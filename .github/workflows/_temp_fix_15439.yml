name: temp-fix-15439

on:
  push:
    paths:
      - '.github/workflows/_temp_fix_15439.yml'

permissions:
  contents: write

jobs:
  stage-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add missing naval base position and push fix branch
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = Path('map/buildings.txt')
          text = path.read_text(encoding='utf-8-sig')
          line = '15439;naval_base;3244.00;9.50;1748.00;0.00;1434'
          if not any(x.strip() == line for x in text.splitlines()):
              newline = '\r\n' if '\r\n' in text else '\n'
              if text and not text.endswith(('\n', '\r')):
                  text += newline
              text += line + newline
              path.write_text(text, encoding='utf-8')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'switch', '-c', 'fix/province-15439-port'], check=True)
          subprocess.run(['git', 'add', 'map/buildings.txt'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Fix missing port position for province 15439'], check=True)
          subprocess.run(['git', 'push', '--force', 'origin', 'fix/province-15439-port'], check=True)
