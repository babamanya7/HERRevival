name: Apply China 1936 Guangdong OOB

on:
  push:
    branches:
      - italy-1936-oob-rework
    paths:
      - .github/workflows/apply-china-1936-guangdong.yml

permissions:
  contents: write

jobs:
  patch-oob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: italy-1936-oob-rework
          fetch-depth: 0
      - name: Patch Guangdong 1936 OOB
        run: python .github/scripts/patch_china_1936_guangdong.py
      - name: Commit Guangdong OOB
        run: |
          git config user.name "babamanya7"
          git config user.email "108981808+babamanya7@users.noreply.github.com"
          git add history/units/CHI_1936.txt
          git commit -m "add Guangdong First Group Army to China 1936 OOB" || exit 0
          git push origin italy-1936-oob-rework
