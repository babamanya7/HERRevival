name: Apply China 1936 OOB phase 1

on:
  push:
    branches:
      - italy-1936-oob-rework
    paths:
      - .github/workflows/apply-china-1936-oob-phase1.yml

permissions:
  contents: write

jobs:
  patch-oob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: italy-1936-oob-rework
          fetch-depth: 0
      - name: Patch China 1936 OOB
        run: python .github/scripts/patch_china_1936_phase1.py
      - name: Commit China OOB phase 1
        run: |
          git config user.name "babamanya7"
          git config user.email "108981808+babamanya7@users.noreply.github.com"
          git add history/units/CHI_1936.txt
          git commit -m "rework China 1936 army templates and 29th Army" || exit 0
          git push origin italy-1936-oob-rework
