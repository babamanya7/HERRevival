name: Apply Italy 1936 OOB rework

on:
  push:
    branches:
      - italy-1936-oob-rework
    paths:
      - .github/workflows/apply-italy-1936-oob-rework.yml

permissions:
  contents: write

jobs:
  patch-oob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: italy-1936-oob-rework
          fetch-depth: 0

      - name: Patch Italian 1936 OOB
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("history/units/ITA_1936_nsb.txt")
          text = path.read_text(encoding="utf-8-sig")

          def block_end(s, start):
              brace = s.find("{", start)
              if brace < 0:
                  raise RuntimeError("opening brace not found")
              depth = 0
              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1
              raise RuntimeError("unterminated block")

          # Replace the universal 12-battalion infantry template with a peacetime
          # metropolitan template and add mobilized / territorial variants.
          first = text.find("division_template = {")
          end = block_end(text, first)
          old = text[first:end]
          if 'name = "Divisione di Fanteria Mobilitata"' not in text:
              templates = '''division_template = {
              name = "Divisione di Fanteria"
              division_names_group = ITA_INF_01

              # Peacetime metropolitan division: 3 infantry regiments x 2 battalions.
              regiments = {
                  heavy_infantry = { x = 0 y = 0 }
                  heavy_infantry = { x = 0 y = 1 }
                  heavy_infantry = { x = 1 y = 0 }
                  heavy_infantry = { x = 1 y = 1 }
                  heavy_infantry = { x = 2 y = 0 }
                  heavy_infantry = { x = 2 y = 1 }
                  artillery_brigade = { x = 4 y = 0 }
                  artillery_brigade = { x = 4 y = 1 }
                  artillery_brigade = { x = 4 y = 2 }
              }
              regimental_support = {
                  artillery = { x = 0 y = 0 }
                  artillery = { x = 1 y = 0 }
                  artillery = { x = 2 y = 0 }
              }
              support = {
                  engineer = { x = 0 y = 0 }
                  field_hospital = { x = 0 y = 1 }
                  signal_company = { x = 0 y = 2 }
                  recon = { x = 0 y = 3 }
                  logistics_company = { x = 0 y = 4 }
              }
          }

          division_template = {
              name = "Divisione di Fanteria Mobilitata"
              division_names_group = ITA_INF_01

              # Mobilized East African War division: 3 regiments x 3 battalions.
              regiments = {
                  heavy_infantry = { x = 0 y = 0 }
                  heavy_infantry = { x = 0 y = 1 }
                  heavy_infantry = { x = 0 y = 2 }
                  heavy_infantry = { x = 1 y = 0 }
                  heavy_infantry = { x = 1 y = 1 }
                  heavy_infantry = { x = 1 y = 2 }
                  heavy_infantry = { x = 2 y = 0 }
                  heavy_infantry = { x = 2 y = 1 }
                  heavy_infantry = { x = 2 y = 2 }
                  artillery_brigade = { x = 4 y = 0 }
                  artillery_brigade = { x = 4 y = 1 }
                  artillery_brigade = { x = 4 y = 2 }
              }
              regimental_support = {
                  artillery = { x = 0 y = 0 }
                  artillery = { x = 1 y = 0 }
                  artillery = { x = 2 y = 0 }
              }
              support = {
                  engineer = { x = 0 y = 0 }
                  field_hospital = { x = 0 y = 1 }
                  signal_company = { x = 0 y = 2 }
                  recon = { x = 0 y = 3 }
                  logistics_company = { x = 0 y = 4 }
              }
          }

          division_template = {
              name = "Divisione Territoriale di Fanteria"
              division_names_group = ITA_INF_01

              # Replacement "II" divisions raised while parent formations served overseas.
              regiments = {
                  heavy_infantry = { x = 0 y = 0 }
                  heavy_infantry = { x = 0 y = 1 }
                  heavy_infantry = { x = 1 y = 0 }
                  heavy_infantry = { x = 1 y = 1 }
                  heavy_infantry = { x = 2 y = 0 }
                  heavy_infantry = { x = 2 y = 1 }
                  artillery_brigade = { x = 4 y = 0 }
                  artillery_brigade = { x = 4 y = 1 }
              }
              regimental_support = {
                  artillery = { x = 0 y = 0 }
                  artillery = { x = 1 y = 0 }
              }
              support = {
                  engineer = { x = 0 y = 0 }
                  signal_company = { x = 0 y = 1 }
              }
          }'''
              text = text[:first] + templates + text[end:]

          def division_blocks(s):
              u = s.find("units = {")
              if u < 0:
                  raise RuntimeError("units block not found")
              starts = []
              pos = u
              while True:
                  pos = s.find("division = {", pos)
                  if pos < 0:
                      break
                  e = block_end(s, pos)
                  starts.append((pos, e, s[pos:e]))
                  pos = e
              return starts

          def set_exp(block, value):
              if "start_experience_factor" in block:
                  return re.sub(r"start_experience_factor\s*=\s*[0-9.]+", f"start_experience_factor = {value}", block, count=1)
              return block[:-1] + f"\n\t\tstart_experience_factor = {value}\n\t}}"

          def set_location(block, value):
              return re.sub(r"location\s*=\s*\d+", f"location = {value}", block, count=1)

          def set_template(block, value):
              return re.sub(r'division_template\s*=\s*"[^"]+"', f'division_template = "{value}"', block, count=1)

          def set_explicit_name(block, value):
              pattern = r"\t\tdivision_name\s*=\s*\{\s*\n\s*is_name_ordered\s*=\s*yes\s*\n\s*name_order\s*=\s*\d+\s*\n\s*\}"
              if re.search(pattern, block):
                  block = re.sub(pattern, f'\t\tname = "{value}"', block, count=1)
              elif "\t\tname = " in block:
                  block = re.sub(r'\t\tname\s*=\s*"[^"]+"', f'\t\tname = "{value}"', block, count=1)
              return block

          replacements = []
          for a, b, block in division_blocks(text):
              original = block

              if "30a Divisione di Fanteria 'Sabauda'" in block:
                  block = set_template(block, "Divisione di Fanteria Mobilitata")

              elif "26a Divisione di Fanteria 'Assietta'" in block:
                  block = set_location(block, 11954)  # Benghazi; not yet in Eritrea on 1 Jan
                  block = set_template(block, "Divisione di Fanteria Mobilitata")

              elif "5a Divisione Alpina 'Pusteria'" in block:
                  block = set_location(block, 9598)  # South Tyrol; embarkation starts 6 Jan

              elif "4a Divisione CC.NN. '3 Gennaio'" in block:
                  block = set_exp(block, "0.20")

              elif "19a Divisione di Fanteria 'Venezia'" in block:
                  block = set_explicit_name(block, "19a Divisione di Fanteria 'Gavinana'")
                  block = block.replace("19a Divisione di Fanteria 'Venezia'", "19a Divisione di Fanteria 'Gavinana'")
                  block = set_template(block, "Divisione di Fanteria Mobilitata")

              elif "24a Divisione di Fanteria 'Pinerolo'" in block:
                  block = set_explicit_name(block, "24a Divisione di Fanteria 'Gran Sasso'")
                  block = block.replace("24a Divisione di Fanteria 'Pinerolo'", "24a Divisione di Fanteria 'Gran Sasso'")
                  block = set_template(block, "Divisione di Fanteria Mobilitata")

              elif "3a Divisione CC.NN. '21 Aprile'" in block:
                  block = set_exp(block, "0.25")

              elif "27a Divisione Autotrasportabile 'Brescia'" in block:
                  block = set_explicit_name(block, "27a Divisione di Fanteria 'Sila'")
                  block = block.replace("27a Divisione Autotrasportabile 'Brescia'", "27a Divisione di Fanteria 'Sila'")
                  block = set_template(block, "Divisione di Fanteria Mobilitata")

              elif "1a Divisione CC.NN. '23 Marzo'" in block:
                  block = set_exp(block, "0.30")

              elif "5a Divisione di Fanteria 'Cosseria'" in block:
                  block = set_location(block, 11954)  # Benghazi; transfer to Eritrea begins in Jan
                  block = set_template(block, "Divisione di Fanteria Mobilitata")

              elif "2a Divisione CC.NN. '28 Ottobre'" in block:
                  block = set_exp(block, "0.30")

              elif "5a Divisione CC.NN. '1 Febbraio'" in block:
                  block = set_exp(block, "0.20")

              elif "29a Divisione di Fanteria 'Piemonte'" in block:
                  block = set_explicit_name(block, "29a Divisione di Fanteria 'Peloritana'")
                  block = block.replace("29a Divisione di Fanteria 'Piemonte'", "29a Divisione di Fanteria 'Peloritana'")
                  block = set_template(block, "Divisione di Fanteria Mobilitata")

              elif "6a Divisione CC.NN. 'Tevere'" in block:
                  block = set_location(block, 12991)  # Mogadishu; landed 29 Dec 1935
                  block = set_exp(block, "0.10")

              if block != original:
                  replacements.append((a, b, block))

          for a, b, block in reversed(replacements):
              text = text[:a] + block + text[b:]

          if "105a Divisione di Fanteria 'Cosseria II'" not in text:
              territorial = '''
              ##### Divisioni territoriali "II" (replacement formations, 1 Jan 1936) #####
              division = {
                  name = "105a Divisione di Fanteria 'Cosseria II'"
                  location = 6788 # Genoa area, representing Imperia garrison
                  division_template = "Divisione Territoriale di Fanteria"
                  start_experience_factor = 0.10
                  start_equipment_factor = 0.50
              }
              division = {
                  name = "119a Divisione di Fanteria 'Gavinana II'"
                  location = 9907 # Florence
                  division_template = "Divisione Territoriale di Fanteria"
                  start_experience_factor = 0.10
                  start_equipment_factor = 0.50
              }
              division = {
                  name = "124a Divisione di Fanteria 'Gran Sasso II'"
                  location = 925 # Abruzzo, L'Aquila/Chieti district
                  division_template = "Divisione Territoriale di Fanteria"
                  start_experience_factor = 0.10
                  start_equipment_factor = 0.50
              }
              division = {
                  name = "127a Divisione di Fanteria 'Sila II'"
                  location = 11837 # Calabria, representing Catanzaro district
                  division_template = "Divisione Territoriale di Fanteria"
                  start_experience_factor = 0.10
                  start_equipment_factor = 0.50
              }
              division = {
                  name = "129a Divisione di Fanteria 'Peloritana II'"
                  location = 4159 # Messina
                  division_template = "Divisione Territoriale di Fanteria"
                  start_experience_factor = 0.10
                  start_equipment_factor = 0.50
              }
              division = {
                  name = "130a Divisione di Fanteria 'Sabauda II'"
                  location = 11773 # Cagliari / Sardinia
                  division_template = "Divisione Territoriale di Fanteria"
                  start_experience_factor = 0.10
                  start_equipment_factor = 0.50
              }

          '''
              marker = "\t##### Commando Superiore Africa #####"
              if marker not in text:
                  raise RuntimeError("Africa marker not found")
              text = text.replace(marker, territorial + marker, 1)

          path.write_text(text, encoding="utf-8-sig")

      - name: Commit patched OOB
        shell: bash
        run: |
          if git diff --quiet -- history/units/ITA_1936_nsb.txt; then
            echo "No OOB changes to commit"
            exit 0
          fi
          git config user.name "HER OOB Bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/units/ITA_1936_nsb.txt
          git commit -m "rework Italy 1936 army OOB"
          git push origin HEAD:italy-1936-oob-rework
