name: Finish Italy 1936 colonial OOB

on:
  push:
    branches:
      - italy-1936-oob-rework
    paths:
      - .github/workflows/apply-italy-colonial-oob-finish.yml

permissions:
  contents: write

jobs:
  patch-oob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: italy-1936-oob-rework
          fetch-depth: 0
      - name: Patch colonial OOB
        run: python3 .github/scripts/patch_italy_colonial.py
      - name: Commit colonial OOB finish
        run: |
          git config user.name "babamanya7"
          git config user.email "108981808+babamanya7@users.noreply.github.com"
          git add history/units/ITA_1936_nsb.txt
          git commit -m "rework Italy 1936 colonial forces" || exit 0
          git push origin italy-1936-oob-rework
