name: Apply Japan 1936 land OOB
on:
  push:
    branches: [italy-1936-oob-rework]
    paths: [.github/workflows/apply-japan-1936-land.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: italy-1936-oob-rework
          fetch-depth: 0
      - run: python .github/scripts/patch_japan_1936_land.py
      - run: |
          git config user.name "babamanya7"
          git config user.email "108981808+babamanya7@users.noreply.github.com"
          git add history/units/JAP_1936_nsb.txt
          git commit -m "rebuild Japan 1936 land OOB" || exit 0
          git push origin italy-1936-oob-rework
