name: HER cleanup starting design teams

on:
  push:
    branches:
      - work/start-designers-and-1944-retirements
    paths:
      - .github/workflows/her-cleanup-starting-design-teams.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/start-designers-and-1944-retirements
      - name: Normalize exact starting variants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          mappings = {
            'history/countries/GER - Germany.txt': {
              'Panzer II':'GER_man_organization',
              'He 51':'GER_heinkel_organization','He 45':'GER_heinkel_organization',
              'Ju 86':'GER_junkers_organization','He 111':'GER_heinkel_organization',
              'Bf 109E':'GER_messerschmitt_organization','Ju 87':'GER_junkers_organization','Do 22':'GER_dornier_organization',
            },
            'history/countries/SOV - Soviet union.txt': {
              'T-37A':'SOV_astrov_design_bureau_organization','BT-7':'SOV_morozov_design_bureau_organization',
              'T-28':'SOV_kirov_organization','T-35':'SOV_kirov_organization',
              'I-5':'SOV_polikarpov_organization','I-15':'SOV_polikarpov_organization','I-16':'SOV_polikarpov_organization',
              'U-2':'SOV_polikarpov_organization','TB-3':'SOV_tupolev_organization',
            },
            'history/countries/ENG - Britain.txt': {
              'Light Tank Mk. II':'ENG_vickers_armstrong_eng_organization','Light Tank Mk. III':'ENG_vickers_armstrong_eng_organization',
              'Medium Mk. II':'ENG_vickers_armstrong_eng_organization',
              'Bristol Bulldog':'ENG_bristol_organization','Gloster Gauntlet':'ENG_gloster_organization','Gloster Gladiator':'ENG_gloster_organization',
              'Hawker Fury':'ENG_hawker_organization','Hawker Demon':'ENG_hawker_organization','Hawker Nimrod':'ENG_hawker_organization',
              'Fairey Gordon':'ENG_fairey_aviation_organization','Fairey Swordfish':'ENG_fairey_aviation_organization',
              'Bristol Blenheim':'ENG_bristol_organization','Vickers Wellington':'ENG_vickers_armstrong_eng_organization',
            },
            'history/countries/FRA - France.txt': {
              'Renault FT (HMG)':'FRA_renault_organization','Renault FT (SC)':'FRA_renault_organization','Renault R35':'FRA_renault_organization',
              'Char B1':'FRA_renault_organization','SOUMUA S35':'FRA_somua_organization',
              'D.500/501':'FRA_dewoitine_organization','D.510':'FRA_dewoitine_organization','D.371':'FRA_dewoitine_organization',
            },
            'history/countries/JAP - Japan.txt': {
              'Type 95 Ha-Go':'JAP_isuzu_organization','Ki-10':'JAP_kawasaki_organization','Ki-2':'JAP_mitsubishi_organization',
              'Ki-3':'JAP_kawasaki_organization','A4N':'JAP_nakajima_organization',
            },
            'history/countries/USA - USA.txt': {'P-36':'USA_curtiss_organization'},
          }

          def block_ranges(text):
              marker='create_equipment_variant ='
              pos=0
              while True:
                  s=text.find(marker,pos)
                  if s<0: return
                  brace=text.find('{',s); d=0
                  for i in range(brace,len(text)):
                      if text[i]=='{': d+=1
                      elif text[i]=='}':
                          d-=1
                          if d==0:
                              yield s,i+1
                              pos=i+1
                              break
                  else: return

          total=0
          for fn,map_ in mappings.items():
              p=Path(fn)
              text=p.read_text(encoding='utf-8-sig')
              edits=[]
              for s,e in block_ranges(text):
                  b=text[s:e]
                  nm=re.search(r'(?m)^\s*name\s*=\s*"([^"]+)"',b)
                  if not nm or nm.group(1) not in map_: continue
                  desired=map_[nm.group(1)]
                  m=re.search(r'(?m)^(\s*)design_team\s*=\s*mio:[^\s#}]+',b)
                  if m:
                      old=m.group(0)
                      new=m.group(1)+'design_team = mio:'+desired
                      if old!=new:
                          edits.append((s+m.start(),s+m.end(),new)); total+=1
                  else:
                      close=e-1
                      edits.append((close,close,'\n\tdesign_team = mio:'+desired+'\n')); total+=1
              for a,b,r in reversed(edits): text=text[:a]+r+text[b:]
              if edits: p.write_text('\ufeff'+text,encoding='utf-8')
          print('normalized:',total)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HER automation"
          git config user.email "actions@users.noreply.github.com"
          git add history/countries
          git commit -m "Refresh starting equipment design teams"
          git push origin HEAD:work/start-designers-and-1944-retirements
