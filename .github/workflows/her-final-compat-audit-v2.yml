name: Final starting MIO compatibility audit v2
on:
  push:
    branches: [work/start-designers-and-1944-retirements]
    paths: [.github/workflows/her-final-compat-audit-v2.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/start-designers-and-1944-retirements
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def brange(text,start):
              b=text.find('{',start); d=0; q=False; esc=False
              if b<0:return None
              for i in range(b,len(text)):
                  c=text[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':q=False
                      continue
                  if c=='"':q=True
                  elif c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return start,i+1
          def block(text,start):
              r=brange(text,start);return text[r[0]:r[1]] if r else None
          def named(text,name):
              m=re.search(r'(?m)^\s*'+re.escape(name)+r'\s*=\s*\{',text);return block(text,m.start()) if m else None
          def field(b,name):
              m=re.search(r'(?m)^\s*'+re.escape(name)+r'\s*=\s*\{',b or '')
              if not m:return set()
              s=block(b,m.start()) or ''
              s=re.sub(r'#.*','',s)
              return {x for x in re.findall(r'\b[A-Za-z0-9_]+\b',s) if x!=name}

          mio_text='\n'.join(p.read_text(encoding='utf-8-sig',errors='ignore') for p in Path('common/military_industrial_organization/organizations').glob('*.txt'))
          grp_text=Path('common/equipment_groups/mio_equipment_groups.txt').read_text(encoding='utf-8-sig',errors='ignore')
          def resolve(t,seen=None):
              seen=seen or set()
              if t in seen:return set()
              seen.add(t);b=named(grp_text,t)
              if not b:return {t}
              out=set()
              for x in field(b,'equipment_type'):out|=resolve(x,seen.copy())
              return out
          def miotypes(n,seen=None):
              seen=seen or set()
              if n in seen:return set()
              seen.add(n);b=named(mio_text,n)
              if not b:return set()
              out=set()
              for x in field(b,'equipment_type'):out|=resolve(x)
              inc=re.search(r'(?m)^\s*include\s*=\s*([A-Za-z0-9_]+)',b)
              if inc:out|=miotypes(inc.group(1),seen)
              return out
          def eqtags(eq):
              out={eq}
              if eq.startswith('vnr_'):
                  x=eq[4:];out.add(x)
                  if 'ship_hull_light' in x:out|={'screen_ship','ship_hull_light','mio_cat_eq_all_destroyer'}
                  if 'ship_hull_submarine' in x:out|={'submarine','ship_hull_submarine'}
                  if 'ship_hull_carrier' in x:out|={'capital_ship','carrier','ship_hull_carrier','mio_cat_eq_all_carrier'}
                  if 'ship_hull_heavy' in x:out|={'capital_ship','ship_hull_heavy','mio_cat_eq_all_battleship'}
                  if 'ship_hull_cruiser' in x:out|={'ship_hull_cruiser','mio_cat_eq_all_cruiser'}
              return out
          def compat(eq,allowed):
              tags=eqtags(eq)
              if tags&allowed:return True
              return any(any(e.startswith(a+'_') and not re.search(r'_\d+$',a) for a in allowed) for e in tags)

          # Soviet destroyer lines: Nevskoye is battle-line only; Rubin's raider archetype accepts screen ships.
          p=Path('history/units/00_SOV_vnr_naval.txt');text=p.read_text(encoding='utf-8-sig')
          edits=[]
          for m in re.finditer(r'(?m)^\s*add_equipment_production\s*=\s*\{',text):
              r=brange(text,m.start());b=text[r[0]:r[1]] if r else ''
              if 'type = vnr_ship_hull_light' in b and 'mio:SOV_nevskoye_design_bureau_organization' in b:
                  edits.append((r[0],r[1],b.replace('mio:SOV_nevskoye_design_bureau_organization','mio:SOV_rubin_design_bureau_organization')))
          for a,z,nb in sorted(edits,reverse=True):text=text[:a]+nb+text[z:]
          if edits:p.write_text('\ufeff'+text,encoding='utf-8')

          scan=[]
          for tag in ['GER','SOV','ENG','FRA','JAP','USA']:
              scan+=list(Path('history/countries').glob(f'{tag} - *.txt'))+list(Path('history/units').glob(f'{tag}_1936_air_bba.txt'))+list(Path('history/units').glob(f'{tag}_1936_nsb.txt'))
          for tag in ['GER','ENG','FRA','ITA','JAP','SOV','USA']:scan+=list(Path('history/units').glob(f'00_{tag}_vnr_naval.txt'))
          rows=[]
          for p in sorted(set(scan)):
              text=p.read_text(encoding='utf-8-sig',errors='ignore')
              for marker in ['create_equipment_variant','add_equipment_production']:
                  for m in re.finditer(r'(?m)^\s*'+marker+r'\s*=\s*\{',text):
                      r=brange(text,m.start());b=text[r[0]:r[1]] if r else ''
                      mm=re.search(r'(?m)^\s*(design_team|industrial_manufacturer)\s*=\s*mio:([A-Za-z0-9_]+)',b)
                      tm=re.search(r'(?m)^\s*type\s*=\s*([A-Za-z0-9_]+)',b)
                      if not mm or not tm:continue
                      mio=mm.group(2);eq=tm.group(1);allowed=miotypes(mio)
                      status='OK' if allowed and compat(eq,allowed) else ('UNKNOWN' if not allowed else 'MISMATCH')
                      nm=re.search(r'(?m)^\s*(?:version_name|name)\s*=\s*"([^"]+)"',b)
                      rows.append((status,str(p),nm.group(1) if nm else '',eq,mio,sorted(allowed),sorted(eqtags(eq))))
          ok=sum(x[0]=='OK' for x in rows);bad=sum(x[0]=='MISMATCH' for x in rows);unk=sum(x[0]=='UNKNOWN' for x in rows)
          out=['# HER final starting MIO compatibility audit v2','']+[ '\t'.join(map(str,x)) for x in rows]+['',f'SUMMARY OK={ok} MISMATCH={bad} UNKNOWN={unk} TOTAL={len(rows)}']
          Path('HER_MIO_FINAL_AUDIT_V2.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - shell: bash
        run: |
          git config user.name "HER automation"
          git config user.email "actions@users.noreply.github.com"
          git add history/units/00_SOV_vnr_naval.txt HER_MIO_FINAL_AUDIT_V2.txt
          git commit -m "Finalize starting MIO compatibility audit" || exit 0
          git push origin HEAD:work/start-designers-and-1944-retirements
