name: HER starting MIO compatibility audit

on:
  push:
    branches:
      - work/start-designers-and-1944-retirements
    paths:
      - .github/workflows/her-mio-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/start-designers-and-1944-retirements
      - name: Audit assigned MIOs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scan_files=[]
          for tag in ['GER','SOV','ENG','FRA','JAP','USA']:
              scan_files += list(Path('history/countries').glob(f'{tag} - *.txt'))
              scan_files += list(Path('history/units').glob(f'{tag}_1936_air_bba.txt'))
              scan_files += list(Path('history/units').glob(f'{tag}_1936_nsb.txt'))
          for tag in ['GER','ENG','FRA','ITA','JAP','SOV','USA']:
              scan_files += list(Path('history/units').glob(f'00_{tag}_vnr_naval.txt'))

          def block(text,start):
              b=text.find('{',start)
              if b<0:return None
              d=0; q=False; esc=False
              for i in range(b,len(text)):
                  c=text[i]
                  if q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': q=False
                      continue
                  if c=='"': q=True
                  elif c=='{': d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return text[start:i+1]
              return None

          def named(text,name):
              m=re.search(r'(?m)^\s*'+re.escape(name)+r'\s*=\s*\{',text)
              return block(text,m.start()) if m else None

          def field_tokens(b,field):
              m=re.search(r'(?m)^\s*'+re.escape(field)+r'\s*=\s*\{',b or '')
              if not m:return set()
              sub=block(b,m.start()) or ''
              sub=re.sub(r'#.*','',sub)
              return {x for x in re.findall(r'\b[A-Za-z0-9_]+\b',sub) if x != field}

          mio_text='\n'.join(p.read_text(encoding='utf-8-sig',errors='ignore') for p in Path('common/military_industrial_organization/organizations').glob('*.txt'))
          grp_text=Path('common/equipment_groups/mio_equipment_groups.txt').read_text(encoding='utf-8-sig',errors='ignore')

          def resolve_token(t,seen=None):
              seen=seen or set()
              if t in seen:return set()
              seen.add(t)
              b=named(grp_text,t)
              if not b:return {t}
              out=set()
              for x in field_tokens(b,'equipment_type'):
                  out |= resolve_token(x,seen.copy())
              return out

          def mio_types(name,seen=None):
              seen=seen or set()
              if name in seen:return set()
              seen.add(name)
              b=named(mio_text,name)
              if not b:return set()
              out=set()
              for t in field_tokens(b,'equipment_type'):
                  out |= resolve_token(t)
              inc=re.search(r'(?m)^\s*include\s*=\s*([A-Za-z0-9_]+)',b)
              if inc: out |= mio_types(inc.group(1),seen)
              return out

          def generic_equipment_names(eq):
              out={eq}
              x=eq
              if x.startswith('vnr_'):
                  x=x[4:]
                  out.add(x)
              # VNR numbered hulls inherit the corresponding generic hull family.
              x=re.sub(r'_\d+$','',x)
              out.add(x)
              # conversion/variant suffixes still inherit their main hull family.
              for fam in ['ship_hull_carrier','ship_hull_cruiser','ship_hull_light','ship_hull_heavy','ship_hull_submarine']:
                  if x.startswith(fam): out.add(fam)
              return out

          def compatible(eq,allowed):
              eqnames=generic_equipment_names(eq)
              if eqnames & allowed:return True
              for e in eqnames:
                  for a in allowed:
                      if e.startswith(a+'_') and not re.search(r'_\d+$',a):
                          return True
              return False

          rows=[]
          for p in sorted(set(scan_files)):
              text=p.read_text(encoding='utf-8-sig',errors='ignore')
              for marker in ['create_equipment_variant','add_equipment_production']:
                  for m in re.finditer(r'(?m)^\s*'+marker+r'\s*=\s*\{',text):
                      b=block(text,m.start())
                      if not b:continue
                      mm=re.search(r'(?m)^\s*(design_team|industrial_manufacturer)\s*=\s*mio:([A-Za-z0-9_]+)',b)
                      tm=re.search(r'(?m)^\s*type\s*=\s*([A-Za-z0-9_]+)',b)
                      if not mm or not tm:continue
                      nm=re.search(r'(?m)^\s*(?:name|version_name)\s*=\s*"([^"]+)"',b)
                      rows.append((str(p),marker,nm.group(1) if nm else '',tm.group(1),mm.group(2)))

          out=['# HER starting MIO compatibility audit','']
          ok=bad=unknown=0
          for p,k,label,eq,mio in rows:
              allowed=mio_types(mio)
              if not allowed: status='UNKNOWN'; unknown+=1
              elif compatible(eq,allowed): status='OK'; ok+=1
              else: status='MISMATCH'; bad+=1
              out.append(f'{status}\t{p}\t{k}\t{label}\t{eq}\t{mio}\tALLOWED={sorted(allowed)}')
          out += ['',f'SUMMARY OK={ok} MISMATCH={bad} UNKNOWN={unknown} TOTAL={len(rows)}']
          Path('HER_MIO_AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "HER automation"
          git config user.email "actions@users.noreply.github.com"
          git add HER_MIO_AUDIT.txt
          git commit -m "Regenerate starting MIO compatibility audit" || exit 0
          git push origin HEAD:work/start-designers-and-1944-retirements
