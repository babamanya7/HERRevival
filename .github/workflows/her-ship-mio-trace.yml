name: Trace generic ship MIO categories
on:
  push:
    branches: [work/start-designers-and-1944-retirements]
    paths: [.github/workflows/her-ship-mio-trace.yml]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/start-designers-and-1944-retirements
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=['generic_escort_ship_organization','generic_battle_line_ship_organization','generic_task_force_ship_organization','generic_raider_ship_organization','generic_submarine_organization','generic_refurbishment_repair_organization']
          src='\n'.join(p.read_text(encoding='utf-8-sig',errors='ignore') for p in Path('common/military_industrial_organization/organizations').glob('*.txt'))
          def brange(text,start):
              b=text.find('{',start); d=0; q=False
              if b<0:return None
              for i in range(b,len(text)):
                  c=text[i]
                  if c=='"': q=not q
                  if q: continue
                  if c=='{': d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return start,i+1
          out=[]
          tokens=set()
          for n in names:
              m=re.search(r'(?m)^\s*'+re.escape(n)+r'\s*=\s*\{',src)
              if not m: continue
              r=brange(src,m.start()); b=src[r[0]:r[1]]
              out += ['## '+n,b,'']
              tokens |= set(re.findall(r'\bmio_cat_[A-Za-z0-9_]+',b))
          out += ['## TOKEN OCCURRENCES']
          files=[p for p in Path('common').rglob('*') if p.is_file()]
          for t in sorted(tokens):
              out.append('### '+t)
              for p in files:
                  try:s=p.read_text(encoding='utf-8-sig',errors='ignore')
                  except:continue
                  if t in s:
                      for i,l in enumerate(s.splitlines(),1):
                          if t in l: out.append(f'{p}:{i}: {l.strip()}')
          Path('HER_SHIP_MIO_TRACE.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - shell: bash
        run: |
          git config user.name "HER automation"
          git config user.email "actions@users.noreply.github.com"
          git add HER_SHIP_MIO_TRACE.txt
          git commit -m "Trace generic ship MIO categories" || exit 0
          git push origin HEAD:work/start-designers-and-1944-retirements
