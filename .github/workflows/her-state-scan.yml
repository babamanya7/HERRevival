name: Trace Eastern Front state IDs
on:
  push:
    branches: [work/start-designers-and-1944-retirements]
    paths: [.github/workflows/her-state-scan.yml]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/start-designers-and-1944-retirements
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          needles=['vinny','vinn','uman','prosk','khmel','nikola','mykola','kherson','kiev','kyiv','zhyto','kirovograd','cherk','odes','odess','ternop','kamian','kamen']
          out=[]
          # collect localization STATE_x -> names
          loc={}
          for p in Path('localisation').rglob('*.yml'):
              try:s=p.read_text(encoding='utf-8-sig',errors='ignore')
              except:continue
              for m in re.finditer(r'(?m)^\s*(STATE_\d+):\d*\s+"([^"]+)"',s):
                  loc.setdefault(m.group(1),set()).add(m.group(2))
          for p in Path('history/states').glob('*.txt'):
              s=p.read_text(encoding='utf-8-sig',errors='ignore')
              im=re.search(r'(?m)^\s*id\s*=\s*(\d+)',s)
              nm=re.search(r'(?m)^\s*name\s*=\s*"?(STATE_\d+)"?',s)
              sid=im.group(1) if im else '?'; key=nm.group(1) if nm else 'STATE_'+sid
              names=' | '.join(sorted(loc.get(key,set())))
              hay=(p.name+' '+s[:1000]+' '+names).lower()
              if any(n in hay for n in needles):
                  out.append(f'{sid}\t{key}\t{p}\t{names}')
          Path('HER_STATE_TRACE.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - shell: bash
        run: |
          git config user.name "HER automation"
          git config user.email "actions@users.noreply.github.com"
          git add HER_STATE_TRACE.txt
          git commit -m "Trace strategic state IDs" || exit 0
          git push origin HEAD:work/start-designers-and-1944-retirements
