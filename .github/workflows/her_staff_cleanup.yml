name: HER staff character cleanup

on:
  push:
    branches:
      - feature/allied-japanese-general-staff
    paths:
      - .github/workflows/her_staff_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove temporary HER staff cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/allied-japanese-general-staff
          fetch-depth: 0

      - name: Clean legacy advisor roles and consolidate staff characters
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          high_slots = {
              'oberkomando_chief', 'genstab_chief', 'operativ_chief',
              'army_chief', 'army_genstab_chief',
              'air_chief', 'air_genstab_chief',
              'navy_chief', 'navy_genstab_chief',
          }

          rotation = {
              'FRA': {
                  'FRA_maurice_gamelin', 'FRA_maxime_weygand', 'FRA_louis_colson',
                  'FRA_Aime_Doumenc', 'FRA_alphonse_georges', 'FRA_joseph_vuillemin',
                  'FRA_francois_darlan',
              },
              'ENG': {
                  'ENG_cyril_deverell', 'ENG_john_vereker', 'ENG_edmund_ironside',
                  'ENG_john_dill', 'ENG_alan_brooke', 'ENG_ronald_adam',
                  'ENG_henry_pownall', 'ENG_archibald_nye', 'ENG_cyril_newall',
                  'ENG_charles_portal', 'ENG_dudley_pound', 'ENG_andrew_cunningham',
              },
              'USA': {
                  'USA_malin_craig', 'USA_george_marshall', 'USA_dwight_d_eisenhower',
                  'USA_thomas_handy', 'USA_leslie_mcnair', 'USA_joseph_mcnarney',
                  'USA_oscar_westover', 'USA_henry_arnold', 'USA_carl_spaatz',
                  'USA_harold_rainsford_stark', 'USA_ernest_king', 'USA_william_leahy',
              },
              'JAP': {
                  'JAP_emperor_hirohito', 'JAP_kanin_kotohito', 'JAP_hajime_sugiyama',
                  'JAP_hideki_tojo', 'JAP_yoshijiro_umezu', 'JAP_yorimichi_suzuki',
                  'JAP_kenji_doihara', 'JAP_takeo_yasuda', 'JAP_fushimi_hiroyasu',
                  'JAP_osami_nagano', 'JAP_shigetaro_shimada', 'JAP_koshiro_oikawa',
              },
          }

          additions = {
              'FRA': '''\n\t# HER general staff\n\tFRA_louis_colson = {\n\t\tname = FRA_louis_colson\n\t}\n''',
              'ENG': '''\n\t# HER general staff\n\tENG_cyril_deverell = { name = ENG_cyril_deverell }\n\tENG_ronald_adam = { name = ENG_ronald_adam }\n\tENG_archibald_nye = { name = ENG_archibald_nye }\n''',
              'USA': '''\n\t# HER general staff\n\tUSA_malin_craig = { name = USA_malin_craig }\n\tUSA_william_leahy = { name = USA_william_leahy }\n\tUSA_joseph_mcnarney = { name = USA_joseph_mcnarney }\n\tUSA_thomas_handy = { name = USA_thomas_handy }\n\tUSA_oscar_westover = { name = USA_oscar_westover }\n''',
              'JAP': '''\n\t# HER general staff\n\tJAP_yorimichi_suzuki = { name = JAP_yorimichi_suzuki }\n\tJAP_takeo_yasuda = { name = JAP_takeo_yasuda }\n\tJAP_koshiro_oikawa = { name = JAP_koshiro_oikawa }\n''',
          }

          def strip_comment(line):
              out = []
              quote = None
              escaped = False
              for ch in line:
                  if escaped:
                      out.append(ch)
                      escaped = False
                      continue
                  if ch == '\\' and quote:
                      out.append(ch)
                      escaped = True
                      continue
                  if ch in ('"', "'"):
                      if quote == ch:
                          quote = None
                      elif quote is None:
                          quote = ch
                      out.append(ch)
                      continue
                  if ch == '#' and quote is None:
                      break
                  out.append(ch)
              return ''.join(out)

          def brace_delta(line):
              s = strip_comment(line)
              quote = None
              escaped = False
              d = 0
              for ch in s:
                  if escaped:
                      escaped = False
                      continue
                  if ch == '\\' and quote:
                      escaped = True
                      continue
                  if ch in ('"', "'"):
                      if quote == ch:
                          quote = None
                      elif quote is None:
                          quote = ch
                      continue
                  if quote is None:
                      if ch == '{': d += 1
                      elif ch == '}': d -= 1
              return d

          def block_end(lines, start):
              first = brace_delta(lines[start])
              if first == 0:
                  return start
              d = 0
              opened = False
              for i in range(start, len(lines)):
                  d += brace_delta(lines[i])
                  if d > 0:
                      opened = True
                  if opened and d == 0:
                      return i
              raise RuntimeError(f'Unclosed block at line {start + 1}')

          def clean_character_file(tag):
              path = Path(f'common/characters/{tag}.txt')
              text = path.read_text(encoding='utf-8-sig')
              lines = text.splitlines(keepends=True)
              remove_spans = []
              depth = 0
              i = 0
              char_header = re.compile(r'^\s*([A-Za-z0-9_]+)\s*=\s*\{')
              advisor_header = re.compile(r'^\s*advisor\s*=\s*\{')

              while i < len(lines):
                  before = depth
                  m = char_header.match(strip_comment(lines[i]))
                  if before == 1 and m and m.group(1) != 'characters':
                      char_id = m.group(1)
                      char_end = block_end(lines, i)
                      rel = 1
                      j = i + 1
                      while j < char_end:
                          am = advisor_header.match(strip_comment(lines[j]))
                          if rel == 1 and am:
                              a_end = block_end(lines, j)
                              block = ''.join(lines[j:a_end + 1])
                              sm = re.search(r'\bslot\s*=\s*([A-Za-z0-9_]+)', block)
                              slot = sm.group(1) if sm else None
                              if slot in high_slots or char_id in rotation[tag]:
                                  remove_spans.append((j, a_end, char_id, slot))
                              for k in range(j, a_end + 1):
                                  rel += brace_delta(lines[k])
                              j = a_end + 1
                              continue
                          rel += brace_delta(lines[j])
                          j += 1
                      for k in range(i, char_end + 1):
                          depth += brace_delta(lines[k])
                      i = char_end + 1
                      continue
                  depth += brace_delta(lines[i])
                  i += 1

              for start, end, _, _ in sorted(remove_spans, reverse=True):
                  del lines[start:end + 1]

              cleaned = ''.join(lines)
              # Merge newly introduced characters into the actual national file.
              ids_to_add = re.findall(r'^\s*([A-Za-z0-9_]+)\s*=\s*\{', additions[tag], re.M)
              payload = additions[tag]
              missing = [cid for cid in ids_to_add if not re.search(rf'^\s*{re.escape(cid)}\s*=\s*\{{', cleaned, re.M)]
              if missing:
                  # additions only contain the missing new IDs by construction on this branch.
                  pos = cleaned.rfind('}')
                  cleaned = cleaned[:pos] + payload + cleaned[pos:]

              path.write_text(cleaned, encoding='utf-8')
              print(tag, 'removed advisor blocks:', [(c, s) for _, _, c, s in remove_spans])

          for tag in ('FRA', 'ENG', 'USA', 'JAP'):
              clean_character_file(tag)

          # Reuse existing Japanese character IDs instead of duplicate clones.
          event_path = Path('events/HER_general_staff_events.txt')
          event_text = event_path.read_text(encoding='utf-8-sig')
          event_text = event_text.replace('JAP_prince_kanin', 'JAP_kanin_kotohito')
          event_text = event_text.replace('JAP_prince_fushimi', 'JAP_fushimi_hiroyasu')
          event_path.write_text(event_text, encoding='utf-8')

          # Remove stale duplicate-name localisations; the existing national characters
          # already have their own localisation elsewhere in the mod.
          stale_keys = {'FRA_aime_doumenc', 'JAP_prince_kanin', 'JAP_prince_fushimi'}
          for loc in (
              Path('localisation/russian/HER_general_staff_l_russian.yml'),
              Path('localisation/english/HER_general_staff_l_english.yml'),
          ):
              lines = loc.read_text(encoding='utf-8-sig').splitlines(keepends=True)
              lines = [ln for ln in lines if not any(re.match(rf'^\s*{re.escape(k)}\s*:', ln) for k in stale_keys)]
              loc.write_text(''.join(lines), encoding='utf-8-sig')

          # The temporary per-country holding files are no longer needed after merge.
          for p in (
              'common/characters/FRA_general_staff.txt',
              'common/characters/ENG_general_staff.txt',
              'common/characters/USA_general_staff.txt',
              'common/characters/JAP_general_staff.txt',
              'common/on_actions/HER_general_staff_startup_fixes.txt',
          ):
              path = Path(p)
              if path.exists():
                  path.unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Clean staff advisor roles and consolidate characters"
            git push origin HEAD:feature/allied-japanese-general-staff
          fi
