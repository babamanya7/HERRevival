name: Patch HER staff icon paths

on:
  push:
    branches:
      - feature/allied-japanese-general-staff
    paths:
      - .github/workflows/her_staff_icons_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/allied-japanese-general-staff
          fetch-depth: 0
      - name: Patch character icon paths
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = {
              'common/characters/FRA.txt': [
                  'FRA_maurice_gamelin','FRA_maxime_weygand','FRA_louis_colson',
                  'FRA_Aime_Doumenc','FRA_alphonse_georges','FRA_joseph_vuillemin','FRA_francois_darlan'
              ],
              'common/characters/ENG.txt': [
                  'ENG_cyril_deverell','ENG_john_vereker','ENG_edmund_ironside','ENG_john_dill',
                  'ENG_alan_brooke','ENG_ronald_adam','ENG_henry_pownall','ENG_archibald_nye',
                  'ENG_cyril_newall','ENG_charles_portal','ENG_dudley_pound','ENG_andrew_cunningham'
              ],
              'common/characters/USA.txt': [
                  'USA_malin_craig','USA_george_marshall','USA_dwight_d_eisenhower','USA_thomas_handy',
                  'USA_leslie_mcnair','USA_joseph_mcnarney','USA_oscar_westover','USA_henry_arnold',
                  'USA_carl_spaatz','USA_harold_rainsford_stark','USA_ernest_king','USA_william_leahy'
              ],
              'common/characters/JAP.txt': [
                  'JAP_emperor_hirohito','JAP_kanin_kotohito','JAP_hajime_sugiyama','JAP_hideki_tojo',
                  'JAP_yoshijiro_umezu','JAP_yorimichi_suzuki','JAP_kenji_doihara','JAP_takeo_yasuda',
                  'JAP_fushimi_hiroyasu','JAP_osami_nagano','JAP_shigetaro_shimada','JAP_koshiro_oikawa'
              ],
          }

          def matching_brace(text, open_pos):
              depth = 0
              for i in range(open_pos, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0: return i
              raise RuntimeError('unbalanced braces')

          missing = []
          for path, ids in targets.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              for cid in ids:
                  m = re.search(r'(?m)^([ \t]*)' + re.escape(cid) + r'\s*=\s*\{', text)
                  if not m:
                      missing.append(f'{path}: {cid}')
                      continue
                  copen = text.find('{', m.start())
                  cend = matching_brace(text, copen)
                  block = text[m.start():cend+1]
                  pm = re.search(r'(?m)^([ \t]*)portraits\s*=\s*\{', block)
                  if not pm:
                      missing.append(f'{path}: {cid} has no portraits')
                      continue
                  popen = block.find('{', pm.start())
                  pend = matching_brace(block, popen)
                  portraits = block[pm.start():pend+1]
                  target = f'gfx/interface/ideas/idea_{cid}.dds'
                  sm = re.search(r'(?m)^(\s*)small\s*=\s*"[^"]*"', portraits)
                  if sm:
                      portraits2 = portraits[:sm.start()] + f'{sm.group(1)}small="{target}"' + portraits[sm.end():]
                  else:
                      lm = re.search(r'(?m)^(\s*)large\s*=\s*"[^"]*"\s*$', portraits)
                      if not lm:
                          missing.append(f'{path}: {cid} has no large portrait line')
                          continue
                      indent = lm.group(1)
                      insert = lm.end()
                      portraits2 = portraits[:insert] + f'\n{indent}small="{target}"' + portraits[insert:]
                  block2 = block[:pm.start()] + portraits2 + block[pend+1:]
                  text = text[:m.start()] + block2 + text[cend+1:]
              p.write_text(text, encoding='utf-8-sig')

          if missing:
              raise SystemExit('Missing targets:\n' + '\n'.join(missing))

          Path('.github/workflows/her_staff_icons_patch.yml').unlink()
      - name: Commit patched icon paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/characters/FRA.txt common/characters/ENG.txt common/characters/USA.txt common/characters/JAP.txt .github/workflows/her_staff_icons_patch.yml
          git commit -m "Add icon paths for rotating general staff"
          git push origin HEAD:feature/allied-japanese-general-staff
