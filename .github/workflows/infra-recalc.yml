name: Soviet infrastructure recalculation

on:
  push:
    branches:
      - soviet-map-redraw-clean
    paths:
      - .github/workflows/infra-recalc.yml
      - .github/infra_recalc.py

concurrency:
  group: soviet-infra-recalc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: soviet-map-redraw-clean
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pillow opencv-python-headless osmium shapely pyproj

      - name: Download OSM PBF extracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .osm-cache
          cat > /tmp/osm_urls.txt <<'EOF'
          https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf
          https://download.geofabrik.de/russia/northwestern-fed-district-latest.osm.pbf
          https://download.geofabrik.de/russia/south-fed-district-latest.osm.pbf
          https://download.geofabrik.de/russia/volga-fed-district-latest.osm.pbf
          https://download.geofabrik.de/russia/north-caucasus-fed-district-latest.osm.pbf
          https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          https://download.geofabrik.de/europe/belarus-latest.osm.pbf
          https://download.geofabrik.de/europe/georgia-latest.osm.pbf
          https://download.geofabrik.de/asia/armenia-latest.osm.pbf
          https://download.geofabrik.de/asia/azerbaijan-latest.osm.pbf
          https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf
          https://download.geofabrik.de/asia/uzbekistan-latest.osm.pbf
          https://download.geofabrik.de/asia/turkmenistan-latest.osm.pbf
          EOF

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            name="${url##*/}"
            final=".osm-cache/$name"
            part="$final.part"
            if [ -s "$final" ]; then
              echo "already present: $name"
              continue
            fi
            echo "=== downloading $name ==="
            curl --fail --location \
              --retry 12 --retry-delay 8 --retry-max-time 2400 --retry-all-errors \
              --connect-timeout 45 --speed-time 180 --speed-limit 1024 \
              --continue-at - --output "$part" "$url"
            test -s "$part"
            mv "$part" "$final"
            ls -lh "$final"
            df -h .
          done < /tmp/osm_urls.txt
          echo "=== all extracts downloaded ==="
          du -sh .osm-cache

      - name: Recalculate Soviet infrastructure locally
        run: python .github/infra_recalc.py

      - name: Commit calculated infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- history/states soviet-infra-report.csv
          if git diff --cached --quiet; then
            echo "No infrastructure changes to commit"
            exit 0
          fi
          git commit -m "Recalculate Soviet infrastructure from local OSM extracts [skip ci]"
          git push origin HEAD:soviet-map-redraw-clean
