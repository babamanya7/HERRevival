name: Soviet infrastructure recalculation

on:
  push:
    branches:
      - soviet-map-redraw-clean
    paths:
      - .github/workflows/infra-recalc.yml
      - .github/infra_recalc.py

concurrency:
  group: soviet-infra-recalc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: soviet-map-redraw-clean
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pillow

      - name: Freeze absolute infrastructure thresholds
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path('.github/infra_recalc.py')
          s = p.read_text(encoding='utf-8')

          replacement = '''ABSOLUTE_INFRA_THRESHOLDS = [
              (0.14, 1),
              (0.235, 2),
              (0.37, 3),
              (0.49, 4),
              (0.60, 5),
              (0.72, 6),
              (0.82, 7),
              (0.97, 8),
          ]

          def infra_from_score(score):
              for ceiling, infra in ABSOLUTE_INFRA_THRESHOLDS:
                  if score < ceiling:
                      return infra
              return 9
          '''

          s, n1 = re.subn(
              r'def infra_from_percentile\(p\):\n(?:    .*\n)+?\n(?=def main\(\):)',
              replacement + '\n',
              s,
              count=1,
          )
          if n1 != 1:
              raise SystemExit(f'Expected percentile mapping function once, got {n1}')

          old = """    percentiles = rank_percentiles(targets)\n    for row, pct in zip(targets, percentiles):\n        row['percentile'] = pct\n        row['new_infra'] = infra_from_percentile(pct)\n"""
          new = """    percentiles = rank_percentiles(targets)\n    for row, pct in zip(targets, percentiles):\n        row['percentile'] = pct\n        row['new_infra'] = infra_from_score(row['score'])\n"""
          if old not in s:
              raise SystemExit('Expected percentile assignment block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Recalculate Soviet infrastructure locally
        run: python .github/infra_recalc.py

      - name: Commit calibration report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/infra_recalc.py soviet-infra-report.csv
          if git diff --cached --quiet; then
            echo "No calibration changes to commit"
            exit 0
          fi
          git commit -m "Freeze absolute Soviet infrastructure thresholds [skip ci]"
          git push origin HEAD:soviet-map-redraw-clean
