name: Soviet infrastructure recalculation

on:
  push:
    branches:
      - soviet-map-redraw-clean
    paths:
      - .github/workflows/infra-recalc.yml
      - .github/infra_recalc.py

concurrency:
  group: soviet-infra-recalc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: soviet-map-redraw-clean
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pillow opencv-python-headless osmium shapely pyproj

      - name: Restore partial OSM cache
        uses: actions/cache/restore@v4
        with:
          path: .osm-cache
          key: soviet-infra-osm-pbf-v4-${{ github.run_id }}
          restore-keys: |
            soviet-infra-osm-pbf-v3-
            soviet-infra-osm-pbf-v4-

      - name: Download OSM PBF extracts
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p .osm-cache
          rm -f /tmp/osm_download_failed

          download_one() {
            target="$1"
            shift
            final=".osm-cache/$target"
            part="$final.part"

            if [ -s "$final" ]; then
              echo "already present: $target"
              return 0
            fi

            success=0
            for url in "$@"; do
              [ -n "$url" ] || continue
              rm -f "$part"
              echo "=== downloading $target from $url ==="
              if curl --fail --location \
                --retry 3 --retry-delay 6 --retry-max-time 900 --retry-all-errors \
                --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
                --output "$part" "$url"; then
                if [ -s "$part" ]; then
                  mv "$part" "$final"
                  ls -lh "$final"
                  success=1
                  break
                fi
              fi
              echo "source failed: $url"
            done

            if [ "$success" -ne 1 ]; then
              echo "FAILED: $target" | tee -a /tmp/osm_download_failed
              rm -f "$part"
            fi
          }

          download_one central-fed-district-latest.osm.pbf \
            https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf \
            https://download-ext2.geofabrik.de/russia/central-fed-district-latest.osm.pbf
          download_one northwestern-fed-district-latest.osm.pbf \
            https://download.geofabrik.de/russia/northwestern-fed-district-latest.osm.pbf \
            https://download-ext2.geofabrik.de/russia/northwestern-fed-district-latest.osm.pbf
          download_one south-fed-district-latest.osm.pbf \
            https://download.geofabrik.de/russia/south-fed-district-latest.osm.pbf \
            https://download-ext2.geofabrik.de/russia/south-fed-district-latest.osm.pbf \
            https://download.geofabrik.de/russia/south-fed-district-260824.osm.pbf \
            https://download-ext2.geofabrik.de/russia/south-fed-district-260824.osm.pbf
          download_one volga-fed-district-latest.osm.pbf \
            https://download.geofabrik.de/russia/volga-fed-district-latest.osm.pbf \
            https://download-ext2.geofabrik.de/russia/volga-fed-district-latest.osm.pbf
          download_one north-caucasus-fed-district-latest.osm.pbf \
            https://download.geofabrik.de/russia/north-caucasus-fed-district-latest.osm.pbf \
            https://download-ext2.geofabrik.de/russia/north-caucasus-fed-district-latest.osm.pbf
          download_one ukraine-latest.osm.pbf \
            https://download.geofabrik.de/europe/ukraine-latest.osm.pbf \
            https://download-ext2.geofabrik.de/europe/ukraine-latest.osm.pbf
          download_one belarus-latest.osm.pbf \
            https://download.geofabrik.de/europe/belarus-latest.osm.pbf \
            https://download-ext2.geofabrik.de/europe/belarus-latest.osm.pbf
          download_one georgia-latest.osm.pbf \
            https://download.geofabrik.de/europe/georgia-latest.osm.pbf \
            https://download-ext2.geofabrik.de/europe/georgia-latest.osm.pbf
          download_one armenia-latest.osm.pbf \
            https://download.geofabrik.de/asia/armenia-latest.osm.pbf \
            https://download-ext2.geofabrik.de/asia/armenia-latest.osm.pbf
          download_one azerbaijan-latest.osm.pbf \
            https://download.geofabrik.de/asia/azerbaijan-latest.osm.pbf \
            https://download-ext2.geofabrik.de/asia/azerbaijan-latest.osm.pbf
          download_one kazakhstan-latest.osm.pbf \
            https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf \
            https://download-ext2.geofabrik.de/asia/kazakhstan-latest.osm.pbf
          download_one uzbekistan-latest.osm.pbf \
            https://download.geofabrik.de/asia/uzbekistan-latest.osm.pbf \
            https://download-ext2.geofabrik.de/asia/uzbekistan-latest.osm.pbf
          download_one turkmenistan-latest.osm.pbf \
            https://download.geofabrik.de/asia/turkmenistan-latest.osm.pbf \
            https://download-ext2.geofabrik.de/asia/turkmenistan-latest.osm.pbf

          echo "=== download pass complete ==="
          du -sh .osm-cache || true
          df -h .

      - name: Save partial OSM cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .osm-cache
          key: soviet-infra-osm-pbf-v4-${{ github.run_id }}

      - name: Validate OSM downloads
        shell: bash
        run: |
          if [ -s /tmp/osm_download_failed ]; then
            echo "Some extracts failed to download:"
            cat /tmp/osm_download_failed
            exit 1
          fi
          count=$(find .osm-cache -maxdepth 1 -type f -name '*.osm.pbf' -size +1M | wc -l)
          echo "PBF files present: $count"
          test "$count" -ge 13

      - name: Recalculate Soviet infrastructure locally
        run: python .github/infra_recalc.py

      - name: Commit calculated infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- history/states soviet-infra-report.csv
          if git diff --cached --quiet; then
            echo "No infrastructure changes to commit"
            exit 0
          fi
          git commit -m "Recalculate Soviet infrastructure from local OSM extracts [skip ci]"
          git push origin HEAD:soviet-map-redraw-clean
