name: Temporary sortie efficiency rebalance

on:
  push:
    branches: [temp_dev]
    paths:
      - .github/workflows/rebalance-sortie-efficiency.yml

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp_dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebalance sortie efficiency bonuses
        run: python .github/rebalance_sortie_efficiency.py

      - name: Commit rebalanced bonuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/technologies/naval_doctrine.txt common/unit_leader/00_traits.txt common/country_leader/00_traits.txt common/ideas/japan.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rebalance carrier sortie efficiency bonuses"
          git push origin HEAD:temp_dev
