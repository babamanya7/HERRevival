name: Temporary Finland focus trim runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trim:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vasya_dev
          fetch-depth: 0

      - name: Trim Finland focus tree
        run: python .github/trim_finland_focus.py

      - name: Remove temporary helpers and commit
        shell: bash
        run: |
          rm -f .github/trim_finland_focus.py
          rm -f .github/workflows/trim-finland-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Trim Finland ideological and Nordic focus branches"
          git push origin HEAD:vasya_dev
