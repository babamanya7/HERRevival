name: Temporary Finland focus trim

on:
  push:
    branches: [vasya_dev]
    paths:
      - .github/workflows/trim-finland-focus.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vasya_dev
          fetch-depth: 0
      - name: Audit focus branches
        shell: python
        run: |
          from pathlib import Path
          import re
          from collections import defaultdict, deque

          path = Path('common/national_focus/finland.txt')
          text = path.read_text(encoding='utf-8-sig')

          def code_mask(s):
              out = list(s)
              in_str = False
              esc = False
              in_comment = False
              for i, ch in enumerate(s):
                  if in_comment:
                      if ch == '\n':
                          in_comment = False
                      else:
                          out[i] = ' '
                      continue
                  if in_str:
                      out[i] = ' '
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == '"':
                          in_str = False
                      continue
                  if ch == '#':
                      in_comment = True
                      out[i] = ' '
                  elif ch == '"':
                      in_str = True
                      out[i] = ' '
              return ''.join(out)

          masked = code_mask(text)

          def matching_brace(open_pos):
              depth = 0
              for i in range(open_pos, len(masked)):
                  if masked[i] == '{':
                      depth += 1
                  elif masked[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError(f'unmatched brace at {open_pos}')

          ft = re.search(r'(?m)^\s*focus_tree\s*=\s*\{', masked)
          if not ft:
              raise RuntimeError('focus_tree not found')
          ft_open = masked.find('{', ft.start())
          ft_end = matching_brace(ft_open)

          blocks = {}
          pos = ft_open + 1
          depth = 1
          while pos < ft_end:
              ch = masked[pos]
              if ch == '{':
                  depth += 1
                  pos += 1
                  continue
              if ch == '}':
                  depth -= 1
                  pos += 1
                  continue
              if depth == 1:
                  m = re.match(r'\s*focus\s*=\s*\{', masked[pos:])
                  if m:
                      start = pos + len(m.group(0)) - 1
                      end = matching_brace(start)
                      block_start = pos
                      block_text = text[block_start:end+1]
                      mid = re.search(r'(?m)^\s*id\s*=\s*([A-Za-z0-9_.:-]+)', block_text)
                      if mid:
                          blocks[mid.group(1)] = (block_start, end + 1, block_text)
                      pos = end + 1
                      continue
              pos += 1

          def brace_blocks(src, keyword):
              sm = code_mask(src)
              result = []
              for m in re.finditer(r'(?m)^\s*' + re.escape(keyword) + r'\s*=\s*\{', sm):
                  op = sm.find('{', m.start())
                  d = 0
                  for j in range(op, len(sm)):
                      if sm[j] == '{': d += 1
                      elif sm[j] == '}':
                          d -= 1
                          if d == 0:
                              result.append(src[op+1:j])
                              break
              return result

          parents = defaultdict(set)
          children = defaultdict(set)
          for fid, (_, _, block) in blocks.items():
              for pb in brace_blocks(block, 'prerequisite'):
                  for p in re.findall(r'\bfocus\s*=\s*([A-Za-z0-9_.:-]+)', code_mask(pb)):
                      parents[fid].add(p)
                      children[p].add(fid)

          def descendants(root, stop_expand=()):
              seen = {root}
              q = deque([root])
              stop_expand = set(stop_expand)
              while q:
                  cur = q.popleft()
                  if cur in stop_expand and cur != root:
                      continue
                  for nxt in children.get(cur, ()):
                      if nxt not in seen:
                          seen.add(nxt)
                          q.append(nxt)
              return seen

          required = ['FIN_right_wing_policies','FIN_keepers_of_the_north','FIN_finnish_neutrality','FIN_suomalainen_sosialismi','FIN_towards_a_red_government','FIN_social_democracy']
          missing = [x for x in required if x not in blocks]
          if missing:
              raise RuntimeError('missing expected focuses: ' + ', '.join(missing))

          shared_nonfasc = descendants('FIN_finnish_neutrality') | descendants('FIN_suomalainen_sosialismi')
          fasc = descendants('FIN_right_wing_policies', {'FIN_keepers_of_the_north'}) - shared_nonfasc
          fasc |= {'FIN_right_wing_policies','FIN_keepers_of_the_north'}

          shared_noncomm = descendants('FIN_social_democracy') | descendants('FIN_finnish_neutrality') | descendants('FIN_right_wing_policies')
          comm = descendants('FIN_towards_a_red_government') - shared_noncomm
          comm.add('FIN_towards_a_red_government')

          remove = (fasc | comm) & set(blocks)
          print('FASCIST REMOVE:')
          for x in sorted(fasc & set(blocks)): print('  ', x)
          print('\nCOMMUNIST REMOVE:')
          for x in sorted(comm & set(blocks)): print('  ', x)
          print('\nTOTAL:', len(remove))

          # Find surviving direct prerequisite references that would need cleanup.
          print('\nSURVIVING FOCUSES REFERENCING REMOVED PREREQUISITES:')
          for fid in sorted(set(blocks) - remove):
              hits = sorted(parents[fid] & remove)
              if hits:
                  print('  ', fid, '<-', ', '.join(hits))

          # Also verify the Nordic shared branch attachment exists.
          nordic = re.findall(r'(?m)^\s*shared_focus\s*=\s*(NORDIC_[A-Za-z0-9_.:-]+)\s*$', text[ft_open:ft_end])
          print('\nNORDIC SHARED ROOTS:', ', '.join(nordic) if nordic else '(none)')
