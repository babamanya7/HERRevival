 USA_disable_automatic_factory_retooling: "Suspend Automatic Factory Retooling"
 USA_disable_automatic_factory_retooling_desc: "Suspend the automatic conversion of civilian factories into military factories under the Ford and General Motors retooling programs."
 USA_enable_automatic_factory_retooling: "Resume Automatic Factory Retooling"
 USA_enable_automatic_factory_retooling_desc: "Resume the automatic conversion of civilian factories into military factories."
