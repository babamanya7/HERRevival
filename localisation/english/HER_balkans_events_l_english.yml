l_english:
 hungary.7.t:0 "Hungary Joins the Axis"
 hungary.7.d:0 "Following the revision of the Treaty of Trianon and the strengthening of economic ties with Germany, the Hungarian government has firmly aligned its foreign policy with Berlin. Hungary joins the Axis powers."
 hungary.7.a:0 "Our place is alongside Germany."

 bulgaria.6.t:0 "Bulgaria Joins the Axis"
 bulgaria.6.d:0 "The return of Southern Dobruja and growing German influence in the Balkans have pushed Sofia toward the Tripartite Pact. Bulgaria joins the Axis powers while, for now, remaining outside direct participation in the war."
 bulgaria.6.a:0 "Join the Tripartite Pact."

 her_balkans.1.t:0 "Yugoslavia and the Tripartite Pact"
 her_balkans.1.d:0 "Surrounded by Axis powers and under intense pressure from Berlin, the Yugoslav government has agreed to join the Tripartite Pact. The move is intended to keep the country out of the war, but it has provoked fierce opposition from those resisting closer ties with Germany."
 her_balkans.1.a:0 "Sign the accession protocol."

 her_balkans.2.t:0 "Coup in Belgrade"
 her_balkans.2.d:0 "Military officers opposed to the agreement with the Axis powers have overthrown the government that signed the Tripartite Pact. In Berlin, the coup is regarded as an open challenge to German policy in the Balkans."
 her_balkans.2.a:0 "The situation has changed overnight."

 her_balkans.3.t:0 "Directive No. 25"
 her_balkans.3.d:0 "Following the coup in Belgrade, the German leadership has decided to destroy Yugoslavia as a political and military factor in the Balkans. Preparations are complete and the troops are ordered across the border. If Italy's war against Greece is still continuing, German forces will simultaneously enter the Greek campaign."
 her_balkans.3.a:0 "Begin the Balkan campaign."

 her_balkans.4.t:0 "Hungary Enters the War Against Yugoslavia"
 her_balkans.4.d:0 "After the German invasion began, the collapse of Yugoslav resistance allowed Hungary to enter the campaign and press its territorial claims in the northern regions of Yugoslavia."
 her_balkans.4.a:0 "Forward."
