 sp_naval_dual_purpose_mounts_1:0 "Improved Dual-Purpose Mounts"
 sp_naval_dual_purpose_mounts_1_desc:0 "Higher training rates, improved loading arrangements and better fire-control integration allow light naval guns to engage both surface and air targets more effectively."
 sp_naval_dual_purpose_mounts_1_output_tt:0 "Unlocks §YImproved Dual-Purpose Light Battery§!."
 sp_naval_dual_purpose_mounts_2:0 "Advanced Dual-Purpose Artillery"
 sp_naval_dual_purpose_mounts_2_desc:0 "Power-assisted mounts, centralized control and heavier dual-purpose weapons provide a much stronger defensive envelope without sacrificing surface firepower."
 sp_naval_dual_purpose_mounts_2_output_tt:0 "Unlocks §YAdvanced Dual-Purpose Light Battery§! and §YBasic Dual-Purpose Medium Battery§!."
