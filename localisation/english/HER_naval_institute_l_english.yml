l_english:
 sp_naval_light_medium_shells_1:0 "Naval Shell Development I"
 sp_naval_light_medium_shells_1_desc:0 "Improved ammunition for light and medium naval artillery increases penetration and destructive effect without requiring an entirely new gun system."
 sp_naval_light_medium_shells_1_output_tt:0 "§YLight and medium naval artillery:§! attack and piercing §G+5%§!.\n§YLight cruisers:§! light-gun attack and piercing §G+10%§!."
 sp_naval_light_medium_shells_2:0 "Naval Shell Development II"
 sp_naval_light_medium_shells_2_desc:0 "Improved shell bodies, fuzes and armor-piercing caps increase the effectiveness of light and medium naval artillery against modern targets."
 sp_naval_light_medium_shells_2_output_tt:0 "§YLight and medium naval artillery:§! attack and piercing §G+5%§!.\n§YLight cruisers:§! light-gun attack and piercing §G+10%§!."
 sp_naval_heavy_shells_1:0 "Heavy Naval Shells I"
 sp_naval_heavy_shells_1_desc:0 "Optimizing heavy armor-piercing shells and their ballistics improves the performance of battleship main batteries against protected targets."
 sp_naval_heavy_shells_1_output_tt:0 "§YBattleships, battlecruisers, super-heavy battleships and battlecarriers:§! heavy-gun attack and piercing §G+5%§!.\nUnlocks the §YHigh-Velocity Shell§! module."
 sp_naval_heavy_shells_2:0 "Heavy Naval Shells II"
 sp_naval_heavy_shells_2_desc:0 "Further development of heavy naval ammunition requires improved alloys, heat treatment and more advanced ballistic solutions."
 sp_naval_heavy_shells_2_output_tt:0 "§YBattleships, battlecruisers, super-heavy battleships and battlecarriers:§! heavy-gun attack and piercing §G+5%§!.\nUnlocks the §YSuper-Heavy Shell§! module."

 sp_naval_sonar_1:0 "Improved Naval Sonar"
 sp_naval_sonar_1_desc:0 "Refined transducers, signal processing and installation practices improve the detection of submerged targets under combat conditions."
 sp_naval_sonar_1_output_tt:0 "Unlocks the §YShip Sonar II§! module."
 sp_naval_sonar_2:0 "Advanced Naval Sonar"
 sp_naval_sonar_2_desc:0 "More powerful emitters, better signal discrimination and improved hull integration extend reliable submarine detection."
 sp_naval_sonar_2_output_tt:0 "Unlocks the §YShip Sonar III§! module."
 sp_naval_depth_charges_1:0 "Improved Depth Charge Systems"
 sp_naval_depth_charges_1_desc:0 "Improved fuzes, charge patterns and launching procedures make depth-charge attacks more effective and repeatable."
 sp_naval_depth_charges_1_output_tt:0 "Unlocks the §YDepth Charges II§! module."
 sp_naval_depth_charges_2:0 "Advanced ASW Weapons"
 sp_naval_depth_charges_2_desc:0 "Better launchers, larger explosive patterns and refined attack doctrine improve the effectiveness of anti-submarine escorts."
 sp_naval_depth_charges_2_output_tt:0 "Unlocks the §YDepth Charges III§! module."
 sp_naval_depth_charges_3:0 "Modern ASW Battery Systems"
 sp_naval_depth_charges_3_desc:0 "Dedicated anti-submarine weapon batteries and mature depth-charge systems provide escorts with much greater striking power against submarines."
 sp_naval_depth_charges_3_output_tt:0 "Unlocks the §YDepth Charges IV§! and §YASW Battery§! modules."

 sp_naval_fire_control_1:0 "Integrated Naval Fire Control"
 sp_naval_fire_control_1_desc:0 "Improved rangefinding, plotting equipment and electromechanical computation allow a ship's batteries to engage targets with greater consistency at long range."
 sp_naval_fire_control_1_output_tt:0 "Unlocks the §YFire Control System II§! module."
 sp_naval_fire_control_2:0 "Advanced Naval Fire Control"
 sp_naval_fire_control_2_desc:0 "More advanced computing, stabilization and centralized fire-control equipment greatly improve the coordination of a ship's main and secondary batteries."
 sp_naval_fire_control_2_output_tt:0 "Unlocks the §YFire Control System III§! and §YRemote Turret Control§! modules."

 sp_naval_dual_purpose_mounts_1:0 "Improved Dual-Purpose Mounts"
 sp_naval_dual_purpose_mounts_1_desc:0 "Higher training rates, improved loading arrangements and better fire-control integration allow light naval guns to engage both surface and air targets more effectively."
 sp_naval_dual_purpose_mounts_1_output_tt:0 "Unlocks improved dual-purpose light-artillery modules."
 sp_naval_dual_purpose_mounts_2:0 "Advanced Dual-Purpose Artillery"
 sp_naval_dual_purpose_mounts_2_desc:0 "Power-assisted mounts, centralized control and heavier dual-purpose weapons provide a much stronger defensive envelope without sacrificing surface firepower."
 sp_naval_dual_purpose_mounts_2_output_tt:0 "Unlocks advanced dual-purpose light and basic dual-purpose medium artillery modules."

 sp_naval_electric_torpedo:0 "Electric Torpedoes"
 sp_naval_electric_torpedo_desc:0 "Electric propulsion greatly reduces the visible wake of a torpedo and improves the stealth of submarine attacks, at the cost of a more demanding power system."
 sp_naval_electric_torpedo_output_tt:0 "Torpedo reveal chance: §G-15%§!.\nMutually exclusive with §YOxygen Torpedoes§!."
 sp_naval_oxygen_torpedo:0 "Oxygen Torpedoes"
 sp_naval_oxygen_torpedo_desc:0 "Using enriched oxygen makes possible long-ranged, high-performance torpedoes with exceptional striking power, but requires careful handling and specialized engineering."
 sp_naval_oxygen_torpedo_output_tt:0 "Torpedo screen penetration: §G+10%§!.\nMutually exclusive with §YElectric Torpedoes§!."
 sp_naval_homing_torpedo:0 "Homing Torpedoes"
 sp_naval_homing_torpedo_desc:0 "Acoustic and autonomous guidance systems allow torpedoes to correct their course after launch and substantially improve the probability of a hit against maneuvering targets."
 sp_naval_homing_torpedo_output_tt:0 "§YDestroyers, submarines and cruisers:§! torpedo hit chance §G+5%§!."

 sp_naval_ship_radar_1:0 "Shipborne Radar Integration"
 sp_naval_ship_radar_1_desc:0 "Adapting early radar sets to warships requires compact antennas, stabilized mounting and integration with shipboard command systems."
 sp_naval_ship_radar_1_output_tt:0 "Unlocks §YShip Radar II§!."
 sp_naval_ship_radar_2:0 "Advanced Surface-Search Radar"
 sp_naval_ship_radar_2_desc:0 "Improved transmitters, receivers and plotting procedures allow warships to detect and track targets more effectively at sea."
 sp_naval_ship_radar_2_output_tt:0 "Unlocks §YShip Radar III§!."
 sp_naval_ship_radar_3:0 "Monopulse Naval Radar"
 sp_naval_ship_radar_3_desc:0 "High-precision naval radar provides more accurate range and bearing information for modern fleet combat."
 sp_naval_ship_radar_3_output_tt:0 "Unlocks §YShip Radar IV§!."

 sp_naval_propulsion_engineering_1:0 "Advanced Naval Machinery"
 sp_naval_propulsion_engineering_1_desc:0 "Improved turbine layout, shafting, lubrication and machinery-room organization increase sustained speed and mechanical reliability without requiring a new hull generation."
 sp_naval_propulsion_engineering_1_output_tt:0 "§YDestroyers, cruisers, battlecruisers and submarines:§! speed §G+3%§!.\n§YBattleships and carriers:§! speed §G+2%§!.\n§YAll affected classes:§! reliability §G+5%§!."
 sp_naval_propulsion_engineering_2:0 "High-Output Naval Propulsion"
 sp_naval_propulsion_engineering_2_desc:0 "Higher-pressure plants and refined machinery integration improve sustained power while reducing fuel losses at operational speeds."
 sp_naval_propulsion_engineering_2_output_tt:0 "§YDestroyers, cruisers, battlecruisers and submarines:§! speed §G+3%§!.\n§YBattleships and carriers:§! speed §G+2%§!.\n§YAll affected classes:§! fuel consumption §G-5%§!."

 sp_naval_survivability_1:0 "Compartmentalization and Damage Control"
 sp_naval_survivability_1_desc:0 "Improved subdivision, pumping arrangements, fire mains and damage-control procedures allow ships to absorb more punishment and remain operational after battle damage."
 sp_naval_survivability_1_output_tt:0 "§YSurface combatants:§! strength §G+5%§!, reliability §G+5%§!."
 sp_naval_survivability_2:0 "Advanced Torpedo Protection"
 sp_naval_survivability_2_desc:0 "Layered underwater protection, improved void and liquid-loaded spaces, and better structural isolation reduce the consequences of torpedo hits and flooding."
 sp_naval_survivability_2_output_tt:0 "§YBattleships and battlecruisers:§! torpedo damage reduction §G+8%§!.\n§YCruisers and carriers:§! torpedo damage reduction §G+5%§!.\n§YAll affected classes:§! torpedo-induced critical hit chance §G-5%§!."
 sp_naval_enhanced_torpedo_belt:0 "Enhanced Torpedo Belt"
 sp_naval_enhanced_torpedo_belt_desc:0 "A more advanced layered underwater protection scheme improves the ability of large warships to contain blast effects and limit flooding after torpedo hits."
 sp_naval_enhanced_torpedo_belt_output_tt:0 "Unlocks the §YEnhanced Torpedo Belt§! module."

 sp_naval_carrier_deck_operations:0 "Carrier Deck Operations"
 sp_naval_carrier_deck_operations_desc:0 "Improve flight deck procedures, aircraft handling and the organization of carrier operations."
 sp_naval_carrier_deck_operations_output_tt:0 "§YCarriers:§! organization §G+5§!, reliability §G+3%§!."
 sp_naval_carrier_flight_deck_systems:0 "Advanced Flight Deck Systems"
 sp_naval_carrier_flight_deck_systems_desc:0 "Develop improved deck handling, elevators, arresting systems and integrated carrier flight operations."
 sp_naval_carrier_flight_deck_systems_output_tt:0 "§YCarriers:§! organization §G+5§!, reliability §G+3%§!, speed §G+2%§!."
 sp_naval_armored_flight_deck:0 "Armored Flight Deck"
 sp_naval_armored_flight_deck_desc:0 "Adopt a protected flight deck concept that sacrifices some aircraft capacity for greater survivability."
 sp_naval_enlarged_air_group:0 "Enlarged Air Group"
 sp_naval_enlarged_air_group_desc:0 "Prioritize hangar and deck capacity to operate the largest possible carrier air group at the cost of protection and operational robustness."
 her_naval_carrier_operations_1:0 "Carrier Deck Operations"
 her_naval_carrier_operations_2:0 "Advanced Flight Deck Systems"

 sp_naval_submarine_snorkel_1:0 "Submarine Snorkel"
 sp_naval_submarine_snorkel_1_desc:0 "A snorkel lets diesel-electric submarines run their diesels at periscope depth, reducing time spent surfaced and improving transit stealth."
 sp_naval_submarine_snorkel_1_output_tt:0 "Unlocks the §YSnorkel I§! module."
 sp_naval_submarine_snorkel_2:0 "Improved Submarine Snorkel"
 sp_naval_submarine_snorkel_2_desc:0 "Improved air intakes, valves and exhaust arrangements allow longer diesel operation at periscope depth while reducing detectable signatures."
 sp_naval_submarine_snorkel_2_output_tt:0 "Unlocks the §YSnorkel II§! module."
 sp_naval_anechoic_tile:0 "Anechoic Coating"
 sp_naval_anechoic_tile_desc:0 "Rubber sound-absorbing tiles reduce reflected sonar energy and lower the acoustic signature of a submarine hull."
 sp_naval_anechoic_tile_output_tt:0 "Unlocks the §YAnechoic Coating§! module."
