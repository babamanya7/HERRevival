l_english:
 PLACEHOLDER_DOCTRINE_LABEL:0 "Cavalry Offensive Doctrine"
 PLACEHOLDER_2_LABEL:0 "MOTORIZATION"
 PLACEHOLDER_2_LABEL_TT:0 "He abandoned the obsolete horse and turned the wheel toward the adoption of armored vehicles."
 placeholder_2_desc:0 "Every weapon has a role. When employed in the right place and according to that role, it produces outstanding results. A rifle optimized for cavalry improves the unit’s basic combat capability."

tank_doc_initiator_desc: "CACCA"
ilcazzo: "ilcazzo"
TANK_DOCTRINE_LABEL: "Armored Warfare Doctrine"
ARMORED_WAVE_LABEL: "Armored Wave"
COMBINED_ARMOR_LABEL: "Combined Armor"
ARMOR_SPEARHEAD_LABEL: "Armored Spearhead"
ARMORED_WAVE_LABEL_TT: "Tanks are powerful tools, like hammers: the enemy will collapse under our devastating, crushing blows."
COMBINED_ARMOR_LABEL_TT: "Tanks are only one section of our military orchestra: only in close cooperation with the others can they create a suffocating symphony for our enemies!"
ARMOR_SPEARHEAD_LABEL_TT: "Tanks are precision machines, like scalpels: we need only one swift and accurate strike to make the enemy front collapse!"

INFANTRY_DOCTRINE_LABEL: "Infantry Doctrine"
OVERWHELMING_INFANTRY_LABEL: "Overwhelming Infantry"
DECISIVE_INFANTRY_LABEL: "Decisive Infantry"
ADAPTABLE_INFANTRY_LABEL: "Adaptable Infantry"
OVERWHELMING_INFANTRY_LABEL_TT: "We cannot worry about every individual battle our units fight; we need to win the war!"
DECISIVE_INFANTRY_LABEL_TT: "Only by securing victory in every battle can we completely defeat the enemy!"
ADAPTABLE_INFANTRY_LABEL_TT: "Infantry operations are the foundation of every army; allowing the infantry to become a disorganized and inflexible mob is simply unacceptable!"

COMMAND_CONTROL_DOCTRINE_LABEL: "Command and Control Doctrine"
CENTRALISED_COMMAND_LABEL: "Centralized Command"
DECENTRALISED_COMMAND_LABEL: "Decentralized Command"
FLEXIBLE_COMMAND_LABEL: "Flexible Command"
CENTRALISED_COMMAND_LABEL_TT: "Leave the thinking to the generals; they will devise a plan the enemy will never forget!"
DECENTRALISED_COMMAND_LABEL_TT: "If anyone knows how to win the war, it is our officers in the field—let them command!"
FLEXIBLE_COMMAND_LABEL_TT: "By ensuring flawless communication between the highest and lowest echelons of our armed forces, we will achieve maximum efficiency!"


ARTILLERY_DOCTRINE_LABEL: "Artillery Doctrine"
RELENTLESS_ARTILLERY_LABEL: "Relentless Artillery"
VERSATILE_ARTILLERY_LABEL: "Versatile Artillery"
INTEGRATED_ARTILLERY_LABEL: "Integrated Artillery"
RELENTLESS_ARTILLERY_LABEL_TT: "Our past experience shows that artillery will win the war for us, and we need a great deal of it."
VERSATILE_ARTILLERY_LABEL_TT: "Only close cooperation among every combat element can guarantee victory."
INTEGRATED_ARTILLERY_LABEL_TT: "By entrusting the control of heavy guns to our men in the field, we will ensure success!"


