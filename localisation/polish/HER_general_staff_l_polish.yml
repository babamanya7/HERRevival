 her_general_staff.ack: "Принято."

 her_general_staff.1.t: "Зміна головнокомандуючого"
 her_general_staff.1.d: "Максим Вейган був призначений головнокомандуючим збройними силами Франції замість Моріса Гамелена."

 her_general_staff.10.t: "Зміна начальника Імперського Генштаба"
 her_general_staff.10.d: "Джон Вірекер, лорд Горт, призначений начальником Імперського Генштаба."
 her_general_staff.11.t: "Зміна начальника штабу ВВС"
 her_general_staff.11.d: "Сіріл Ньюолл призначено начальником штабу Королівських ВВС."
 her_general_staff.12.t: "Новий морський лорд"
 her_general_staff.12.d: "Дадлі Паунд призначений першим морським лордом."
 her_general_staff.13.t: "Перестановки в Імперському Генштабі"
 her_general_staff.13.d: "Едмунд Айронсайд був призначений начальником Імперського Генштаба, Рональд Адам, його заступником."
 her_general_staff.14.t: "Перестановки в Імперському Генштабі"
 her_general_staff.14.d: "Джон Діл призначили начальником Імперського Гентаба, Генрі Паунолл, його заступником."
 her_general_staff.15.t: "Зміна начальника штабу ВВС"
 her_general_staff.15.d: "Чарльз Портал призначено начальником штабу Королівських ВВС."
 her_general_staff.16.t: "Перестановки в Імперському Генштабі"
 her_general_staff.16.d: "Алан Брук призначив його начальником Імперського Генштаба, Арчібальд Най, його заступником."
 her_general_staff.17.t: "Голова Комітету начальників штабів"
 her_general_staff.17.d: "Алан Брук очолював Комітет начальників штабів."
 her_general_staff.18.t: "Новий морський лорд"
 her_general_staff.18.d: "Ендрю Каннінгем призначений першим морським лордом."

 her_general_staff.20.t: "Зміна начальника штабу армії"
 her_general_staff.20.d: "Джордж Маршалл призначив начальником штабу армії США."
 her_general_staff.21.t: "Нове керівництво армійської авіації"
 her_general_staff.21.d: "Генрі Арнольд отримав призначення командувати ВВС армії США."
 her_general_staff.22.t: "Начальник військово-морських операцій"
 her_general_staff.22.d: "Гарольд Старк призначений начальником військової-морської операції."
 her_general_staff.23.t: "Начальник відділу військових планів"
 her_general_staff.23.d: "Дуайт Ейзенхауер призначений начальником відділу військових планів Генерального штабу."
 her_general_staff.24.t: "головнокомандувач флоту США"
 her_general_staff.24.d: "Ернест Кінг був призначений головнокомандуючим флотом США."
 her_general_staff.25.t: "Начальник штабу ВВС армії"
 her_general_staff.25.d: "Карл Спааатс призначений начальником штабу ВВС армії США."
 her_general_staff.26.t: "Формування командування Сухопутних військ"
 her_general_staff.26.d: "Леслі Мак -нейр призначено командувачем Сухопутними військами, Джозеф Мак - Корні — заступником начальника штабу армії."
 her_general_staff.27.t: "Зміна начальника військових-морських операцій"
 her_general_staff.27.d: "Ернест Кінг призначено начальником військово-морських операцій."
 her_general_staff.28.t: "Зміна начальника Оперативного відділу"
 her_general_staff.28.d: "Томас Генді очолив Оперативний відділ Генерального штабу армії."
 her_general_staff.29.t: "Керівник штабу Головнокомандувача"
 her_general_staff.29.d: "Вільям Легі призначений начальником штабу Головнокомандувача і стає старшим військовим радником президента."

 her_general_staff.40.t: "Генеральний інспектор авіації армії"
 her_general_staff.40.d: "Хідекі Тодзіо був призначений генеральним інспектором авіації."
 her_general_staff.41.t: "Зміна генерального інспектора авіації"
 her_general_staff.41.d: "Еріміті Судзукі призначено генеральним інспектором авіації армії."
 her_general_staff.42.t: "Зміна начальника Генштаба армії"
 her_general_staff.42.d: "Хаджіме Сюгіяма був призначений начальником Генерального штабу армії."
 her_general_staff.43.t: "Зміна начальника Морського генштаба"
 her_general_staff.43.d: "Осами Нагано призначено начальником Морського Генерального штабу."
 her_general_staff.44.t: "Зміна генерального інспектора авіації"
 her_general_staff.44.d: "Кенджі Доімара призначено генеральним інспектором авіації."
 her_general_staff.45.t: "Зміна генерального інспектора авіації"
 her_general_staff.45.d: "Такео Ясуда призначено генеральним інспектором авіації армії."
 her_general_staff.46.t: "Перестановки у вищому командуванні"
 her_general_staff.46.d: "Хідекі Тодзіо очолив Генеральний штаб армії, Сігетаро Сімада — Морський генеральний штаб."
 her_general_staff.47.t: "Перестановки у вищому командуванні"
 her_general_staff.47.d: "Йосідзіро Умедзу призначений начальником Генерального штабу армії, Кошіро Оїкава — начальником Морського Генерального штабу."
