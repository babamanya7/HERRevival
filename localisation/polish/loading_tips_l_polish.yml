l_polish:
 LOADING_TIP_0: "«Я ніколи такого не говорив.».\n- Баба Маня"
 LOADING_TIP_1: "«Дайте мені роту Хохлів, і у мене буде самий відполірований хуй».\n- Отто Фон Бісмарк"
 LOADING_TIP_2: "«Головна проблема цитат в інтернеті в тому, що люди відразу вірять в їх достовірність».\n- Володимир Ленін"
 LOADING_TIP_3: "«Тебе це ебати не повинно».\n- Нквдешник"
 LOADING_TIP_4: "«Коли я помру, на мою могилу нанесуть багато сміття, але Лакі всі спалять».\n- Інспектор Джопін"
 LOADING_TIP_5: "«Відходимо на заздалегідь підготовлені позиції».\n- Куроко"
 LOADING_TIP_6: "Комуністи - безсердечні створіння. \n - BigBang"
 LOADING_TIP_7: "«Я з Нквдешником більше грати не буду».\n- Делави"
 LOADING_TIP_8: "«Спитьрусич після обіду, сниться русичу перемога»"
 LOADING_TIP_9: "«Вибачте за погані слова, погані вчинки, петушині вчинки, зокрема, за агресію безпідставну, більше так не буду».\n- Баба Маня"
 LOADING_TIP_10: "«Цікаво гратися з тупим пентосом на автоматизованому інвалідному візку з подачів бургерів і відсосом гівна з під жопи?»\n- Лакі"
 LOADING_TIP_11: "«АААААААААААААААААААААААААААААААААААААААААААААААААААААААААА!!!!!!!!!!!!!!».\n- Нквдешник"
 LOADING_TIP_12: "#ZдраVствуйте"
 LOADING_TIP_13: "Росія тут назавжди.\n- Херсон" 
 LOADING_TIP_14: "«Це петушиний вчинок».\n- БигБенг"
 LOADING_TIP_15: "«Жінка, а скільки у неї дивізій?»\n- Олег Корнилов"
 LOADING_TIP_16: "«Не те, скільки ваги в БігБензі, а скільки в ньому бойовитості».\n- Нквдешник"
 LOADING_TIP_17: "«Даймлер Бенц!»\n- Бабка, 7 грудня 1936 року."
 LOADING_TIP_18: "«Воєнна ситуація обернулася не цілком на користь Нкведешника».\n- БигБенг, 1942 рік"
 LOADING_TIP_19: "Вибач ти гетеро.\n- Лакі (після повідомлення про образу Нкведешника)"
 LOADING_TIP_20: "«Найкращий аргумент проти Жопіна — п’ятихвилинна розмова».\n- БигБенг"
 LOADING_TIP_21: "«Простори БігБенга нас поглинають».\n- Нквдешник"
 LOADING_TIP_22: "Так що, нкведешник мертвий?\n- Деляві (після повідомлення про самогубство нквестника)"
 LOADING_TIP_23: "Писюн у мене висить від таких ігор.  \n - Preacher"
 LOADING_TIP_24: "Захоплюючись кров'ю булькі завивання нургокгорнітів, що загрузли в гнилині і витворили руйнівну чумуну заразу*  \n - Бабка Жопіна"
 LOADING_TIP_25: "Викреслеслюємо 2 Челябінська  \n - BigBang"
 LOADING_TIP_26: "Рейхкомісаріат, неповна затія, я не тільки погодився з цим рішенням БігБенга, але й підтримав його, виконавши одну з найбільших своїх помилок. \n - Бабаманія"
 LOADING_TIP_27: "Соні Еріксон... огляд на бабусю... \n - Бабаманія"
 LOADING_TIP_28: "«Дякувати Господу за німецький ленд-ліз» \n - Турбохохол"
 LOADING_TIP_29: "Я виставив яйця на провітрювання \n - uHCneKTop->l<onuH"
 LOADING_TIP_30: "«Ніколи не ведіть суперечку з Михаєм, ви опуститесь до його рівня, де він має більше досвіду.» \n - Preacher"
 LOADING_TIP_31: "«Броня товста як джмінок українського сала» \n - Нквдшник в процесі створення КВ-1"
 LOADING_TIP_32: "«Але я як би дурень який любить розумно говорити, але не робить так сам» \n - Міхай"
 LOADING_TIP_33: "«Усе нове це добре забуте старе і майже завжди вигадане німцями» \n - Туземна порада трудящих"
 LOADING_TIP_34: "«Дядьку, не в масти тобі такі котли, давай знімай»"
 LOADING_TIP_35: "«Підрозділ особливої групи армії успішно ведуть бойові дії на Донецьку, в результаті чого міська агломерація Донецького басейну перейшла під контроль Вермахту. Коли командир 1-ого парашутного корпусу прибув нагородити бійців, він застав десантників, що висмоктують воду з Макіївського джерела, за це генерал-лейтенант присвоїв почеплену назву групі армій "Макіївське джерело"» \n - З особистого щоденника Фрідріха Паулюса, який командує групою армії «Макіївське джерело»"
 LOADING_TIP_36: "«А ти, друже, вибач, фігура не для фасаду.» \n - Роберт Лей Ерхарду Мільху"
 LOADING_TIP_37: "«АААААА, ПАРАР НА МАТОРНАМ АДСЕКУ!» \n - Генерал-майор Лізюків перед знищенням"
 LOADING_TIP_38: "«Флот простояв в Яві, мати пролежала в канаві, Індус капає» \n - Preacher"
 LOADING_TIP_39: "«Просто не гра, а каторга якась» \n - Preacher"
 LOADING_TIP_40: "«Я довблюся до дупи кожен день.» \n - uHCneKTop->l<onuH"
 LOADING_TIP_41: "«САУка важка ні в кого не провчена?» \n - Preacher"
 LOADING_TIP_42: "«Долбаеба треба ігнорувати, щоб виглядати розумним» \n - Міхай"
 LOADING_TIP_43: "«Крутий позитивний модик, всім раджу!» \n - Полупокер про Хермода"
 LOADING_TIP_44: "«Рудольф Гесс - шкібіді доб єс єс» \n - Турбохохол"
 LOADING_TIP_45: "«Від вас вимагається боротися і шукати, знайти імбу і не здаватися!» \n - Невідомий маршал Хермода"
