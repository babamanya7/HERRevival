l_polish:
 PLACEHOLDER_DOCTRINE_LABEL:0 "Доктрина кавалерійського наступу"
 PLACEHOLDER_2_LABEL:0 "МОТОРИЗАЦІЯ"
 PLACEHOLDER_2_LABEL_TT:0 "Він відмовився від застарілого коня і повернув кермо до впровадження бронованих машин."
 placeholder_2_desc:0 "Кожна зброя має свою роль, і коли вона використовується в потрібному місці, і згідно зі своєю роллю, вона показує видатні результати: гвинтівка, оптимізована для кавалерії, підвищує базову боєспроможність підрозділу."

tank_doc_initiator_desc: "CACCA"
ilcazzo: "ilcazzo"
TANK_DOCTRINE_LABEL: "Доктрина бронетанкових військ"
ARMORED_WAVE_LABEL: "Бронетанкова хвиля"
COMBINED_ARMOR_LABEL: "Сованна бронетехніка"
ARMOR_SPEARHEAD_LABEL: "Бронетанковий клин"
ARMORED_WAVE_LABEL_TT: "Танки — це потужні знаряддя, подібні до молотів: ворог під нашими руйнівними, руйнівними ударами."
COMBINED_ARMOR_LABEL_TT: "Танки - це лише частина нашого військового оркестру. Тільки в тісному взаємодії з іншими вони створюють заспокійливу симфонію для наших ворогів!"
ARMOR_SPEARHEAD_LABEL_TT: "Танки — це точні машини, які нагадують скальпелі. Нам потрібен лише один швидкий і точний удар, щоб атакувати ворога!"

INFANTRY_DOCTRINE_LABEL: "Доктрина піхоти"
OVERWHELMING_INFANTRY_LABEL: "Піхота, що дає"
DECISIVE_INFANTRY_LABEL: "Головний піхота"
ADAPTABLE_INFANTRY_LABEL: "Адаптивна піхота"
OVERWHELMING_INFANTRY_LABEL_TT: "Ми не можемо турбуватися про кожен окремий бій, в якому виявляються наші підрозділи, нам потрібно виграти війну!"
DECISIVE_INFANTRY_LABEL_TT: "Тільки дає перемогу в кожному бою, ми досягнемо повного розгрому ворога!"
ADAPTABLE_INFANTRY_LABEL_TT: "Піхотні операції — це основа будь - якої армії, дозволити їм бути неорганізованою і негнучкою натовпом — просто не можна!"

COMMAND_CONTROL_DOCTRINE_LABEL: "Доктрина командування і керування"
CENTRALISED_COMMAND_LABEL: "Централізоване командування"
DECENTRALISED_COMMAND_LABEL: "Децентралізоване командування"
FLEXIBLE_COMMAND_LABEL: "Гибке командування"
CENTRALISED_COMMAND_LABEL_TT: "Залиште роздуми генералам, вони вигадують план, який ворог не забуде!"
DECENTRALISED_COMMAND_LABEL_TT: "Якщо хтось знає, як виграти війну, так це наші офіцери в полі - нехай вони командують!"
FLEXIBLE_COMMAND_LABEL_TT: "Забезпечуючи бездоганний зв'язок між вищими і нижчими ешелонами наших збройних сил, ми досягнемо максимальної ефективності!"


ARTILLERY_DOCTRINE_LABEL: "Артилерійська доктрина"
RELENTLESS_ARTILLERY_LABEL: "Безжалісна артилерія"
VERSATILE_ARTILLERY_LABEL: "Універсальна артилерія"
INTEGRATED_ARTILLERY_LABEL: "Інтегрована артилерія"
RELENTLESS_ARTILLERY_LABEL_TT: "Наш останній досвід показує, що артилерія виграє нам війну, і нам потрібно багато артилерії."
VERSATILE_ARTILLERY_LABEL_TT: "Тільки забезпечити тісну співпрацю всіх бойових елементів, ми зможемо гарантувати перемогу."
INTEGRATED_ARTILLERY_LABEL_TT: "Ми матимемо успіх, довіривши нашим людям керування великими знаряддями у полі!"


