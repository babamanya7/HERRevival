 AIR_TITLE_MOTHERSHIP: "Літак-матка"
 AIR_TITLE_MOTHERSHIP_DESC: "Літаки-матки — це великі літаки, призначені для перевезення та розгортання менших літаків у бою, що значно розширює їхній оперативний діапазон порівняно з тим, що можуть досягти окремі винищувачі самостійно."
