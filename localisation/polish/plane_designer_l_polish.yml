 early_bombs: "Бомби"
 early_bombs_desc: "З раннього періоду Великої війни літаки все більше й більше використовувалися для скидати бомби на ворожі цілі, а з часом бомбардування ставало чимраз важливішим аспектом повітряної війни."
 heavy_bombs: "Важкі бомби"
 heavy_bombs_desc: "Сучасні військові дії вимагають скинення на ворога все важчих авіабомбів, а сьогодні це найважливіший аспект повітряної війни."
 armor_piercing_bombs: "Бронебійні бомби"
 armor_piercing_bombs_desc: "Бронування палуб військових кораблів з року в рік стає тільки міцнішим, і для протидії потрібно спеціальних бомб, які можуть пробивати броню."
 air_torpedoe_1: "Авіаційні торпеди"
 air_torpedoe_1_desc: "Завдяки тому, що літак легковажний, він може наносити сильніші удари на море."
 air_torpedoe_2: "Розмаїття авіаліній"
 air_torpedoe_2_desc: "Завдяки стандартизації твердень та характеристик ми зможемо створювати більш великі, потужні і універсальні торпеди."
 air_torpedoe_3: "Модерні авіації"
 air_torpedoe_3_desc: "Завдяки легковаженому кріплення, яке скидається на торпеди, можна значно збільшити точність снарядів, а отже, захистити літак, який їх несе."
 photo_reconnaisance: "Фоторозвідка"
 photo_reconnaisance_desc: "Перший очевидний спосіб, яким літаки використовувалися, — це шукати ворожих позицій з кінцевими промовами генералів на землі, і це залишається однією з головних завдань військової авіації."
 aa_lmg: "Легкий кулемет"
 aa_lmg_desc: "Ще з часів Великої війни кулемети гвинтівкового калібру були основою зброї для повітряних боїв."
 survivability_studies: "Обчислення виживання"
 survivability_studies_desc: "Ретельно аналізуючи пошкодження літаків, які повернулися з бою, ми можемо точно визначити, які елементи потрібно підсилювати."
 aircraft_construction: "Будівництво літаків"
 aircraft_construction_desc: "Нові технології дозволяють літати краще пристосовані до конкретних ролей."
 aa_hmg: "Важкий кулемет"
 aa_hmg_desc: "Сучасні літаки здатні винести значно більше урону, ніж старіші моделі, і потрапити в них важче. Отже, кожне попадання повинно наносити максимальний урон, а для цього потрібен патрон великого калібру."
 aa_hmg_2: "Покращений важкий кулемет"
 aa_hmg_2_desc: "Сучасні літаки здатні винести значно більше урону, ніж старіші моделі, і потрапити в них важче. Отже, кожне попадання повинно наносити максимальний урон, а для цього потрібен патрон великого калібру."
 aa_cannon_1: "Гармати I"
 aa_cannon_1_desc: "Знаряд гармати може пробити навіть найміцніший літак, а якщо в ньому буде достатньо вибухівки, то й завдати смертельного удару."
 aa_cannon_2: "Великі гармати"
 aa_cannon_2_desc: "Особливо великим калібром ці гармати можуть збити одним пострілом навіть великий літак."
 aa_cannon_3: "Гармати II"
 aa_cannon_3_desc: "Сучасна гігантська гармата зі швидкістю польоту може збити навіть найміцніший літак."
 range_improvements: "Покращення віддаленості"
 range_improvements_desc: "Хоч і здається очевидним, що підвищення цистерни паливних баків збільшує дальність польоту літака, насправді, додати в літак додаткове паливо, не знизивши цю відстань — нетривіальне завдання."
 sp_centrifugal_jet_tech: "Центробіжний реактивний двигун"
 sp_centrifugal_jet_tech_desc: "У центрогонних реактивних двигунах для створення тяги використовують одноступенцевий компресор, який стискає всмоктоване повітря перед його викидом. Такі двигуни компактні і легко обслуговуються."
 jet_engine_axial_1x: "Реактивний двигун з 1 вісь"
 jet_engine_axial_1x_desc: "Завдяки встановленню декількох компресорів, які розміщені одна за одною, осиковий двигун може раз у раз збільшити тягу, яку створює простий одноступний реактивний двигун."
 jet_engine_axial_2x: "Реактивний двигун з 2 осами"
 jet_engine_axial_2x_desc: "$engine_1_2x_desc$"
 jet_engine_axial_3x: "Реактивний двигун з 3 осами"
 jet_engine_axial_3x_desc: "$engine_1_3x_desc$"
 jet_engine_axial_4x: "Реактивний двигун з 4 осами"
