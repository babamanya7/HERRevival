 jet_engine_1x: "1 реактивний двигун"
 jet_engine_1x_desc: "Хоча цей складний і примхливий двигун має інший підхід до літака, він все - таки значно збільшує швидкість й спритність літальних апаратів."
 jet_engine_2x: "2 реактивних двигуни"
 jet_engine_2x_desc: "$engine_1_2x_desc$"
 jet_engine_3x: "3 реактивних двигунів"
 jet_engine_3x_desc: "$engine_1_3x_desc$"
 jet_engine_4x: "4 реактивних двигунів"
 jet_engine_4x_desc: "$engine_1_4x_desc$"
 jet_engine_6x: "6 реактивних двигунів"
 jet_engine_6x_desc: "$engine_1_6x_desc$"
 rocket_engine_1: "Функціональний двигун I"
 rocket_engine_1_desc: "За допомогою декількох легкоіспаних видів палива та такого ж небезпечного окислювача цей двигун може випускати дуже велику тягу, щоб розганяти літак до високих швидкостей за рахунок зниження дальності польоту."
 rocket_engine_2: "Функціональний двигун II"
 rocket_engine_2_desc: "Удосконалення камери згорання і незначні зміни в складі паливної суміші дають змогу досягти ще більшої продуктивності, хоча й призводять до зменшення дальності польоту."
 rocket_engine_3: "Метеоролог III"
 rocket_engine_3_desc: ""
 bomb_locks: "Бомбодержателі"
 bomb_locks_desc: "Міцні бомби під крилами або фюзеляжами дозволяють літакові успішно атакувати наземні цілі."
 heavy_bomb_locks: "Держави для важких бомб"
 heavy_bomb_locks_desc: "Під крилами або фюзеляжами потужні бомби дозволяють літаки успішно атакувати наземні цілі."
 armor_piercing_bomb_locks: "Держави для бронебійних бомб"
 armor_piercing_bomb_locks_desc: "Завдяки міцності бронебійних бомб під крилами або фюзеляжами літак успішно атакує морські цілі."
 torpedo_mounting: "Міць для легенів торпед"
 torpedo_mounting_desc: "Завдяки міцності літака, який може легко завести торпеду під фюзеляжом, літак стає потужною зброєю для знищення ворожих кораблів."
 torpedo_mounting_2: "Фортеця для середніх торпед"
 torpedo_mounting_2_desc: "Закріплення, яке дозволяє встановити торпеду середньої ваги під фюзеляжом, дає повітряну зброю для знищення ворожих кораблів."
 torpedo_mounting_3: "Міць для важких торпед"
 torpedo_mounting_3_desc: "Завдяки міцності повітряного торпеду літаки можуть знищити ворожі кораблі."
 armor_plate_small: "Бронові пластини"
 armor_plate_small_desc: "Стальні пластини за кріслом пілота і навколо двигуна підвищують живучість літака і захищають проти вогню з землі і атак з флангу."
 large_aircraft_cannon_1x: "1 Пушка велика"
 large_aircraft_cannon_1x_desc: "Завдяки можливості стріляти великими й потужнішими снарядами вона може зруйнувати навіть великий літальний апарат."
 large_aircraft_cannon_2x: "2 Великі гармати"
 large_aircraft_cannon_2x_desc: "Зручні гармати надають літака значну силу, а збільшена щільність вогню дозволяє легко виводити з бою літаки противника."
 small_bomb_bay: "Маленький бомбовий відсік"
 small_bomb_bay_desc: "Він не впливає на аеродинаміку, тому що знаходиться всередині фюзеляжу, але конструкція літака більше не дозволяє йому виконувати складні маневри у повітряному бою."
 medium_bomb_bay: "Середній бомбовий відсік"
 medium_bomb_bay_desc: "Бомбовий відсік середнього розміру дозволяє нести достатньо боєприпасів для ураження різних цілей."
 large_bomb_bay: "Великий бомбовий відсік"
 large_bomb_bay_desc: "Великий відсік для перевезення достатньо зброї, щоб знищувати або виводити з ладу навіть великі фабрики та інші добре захищені цілі."
 tank_buster_1: "Протитанкова зброя I"
 tank_buster_1_desc: "За основу цього знаряддя була взята армійська протитанкова гармата, тому мітки постріли з нього дозволяють знищувати навіть сучасну бронетехніку, але його велика вага і гучномовка сильно Вони обмежують повітряні здібності людини."
 tank_buster_2: "Протитанкова зброя II"
 tank_buster_2_desc: "Для того щоб боротися з важчими сучасними танками, потрібно більшого знаряддя, але під час атаки противника він дуже ефективно діє, незважаючи на велику вагу і значні габарити."
 armor_plate_medium: "$armor_plate_small$"
 armor_plate_medium_desc: "Броня навколо двигунів і вразливих частин фюзеляжу забезпечує значно кращу тривалість життя ціною зниження дальності польоту."
 armor_plate_large: "$armor_plate_small$"
 armor_plate_large_desc: "Багато сталевих пластин захищають двигуни, паливні баки та відсіки екіпажу, завдяки чому літак може витримувати прямі впадки з усього, окрім зенітніх гармат, що робить його складною метою для винищувачів."
 lmg_defense_turret: "Захисний турель з легким кулеметом"
 lmg_defense_turret_desc: "Незважаючи на нестачу потужності для повітряного бою, легкий кулемет в туребі робить будь - яку атаку на цей літак більш ризикованою."
 lmg_defense_turret_2x: "2 Захисні тулі з легким кулеметом"
 lmg_defense_turret_2x_desc: "Комплект з двох легких кулеметів у турелях з електричним приводом охоплює більший простір і робить літак набагато важчим мішенню."
 hmg_defense_turret: "Захисна турель з важким кулеметом"
 hmg_defense_turret_desc: "Важкий кулемет з певною надією на успіх допомагає захиснику битися проти озброєних винищувачів."
 hmg_defense_turret_2x: "2 захисні тулі з важким кулеметом"
 hmg_defense_turret_2x_desc: "Пара потужних турелів з важкими кулеметами роблять літак небезпечною метою для будь-якого нападника."
 cannon_defense_turret: "Захисний турель"
 cannon_defense_turret_desc: "Сучасна зброя в рухомій тулі змінює баланс сили між атакою та атакою в повітряному бою, і багато винищувачів можуть витримати пряме потрапляння з такої зброї і продовжити бій."
 cannon_defense_turret_2x: "2 гарматні щити"
 cannon_defense_turret_2x_desc: "Пара озброєних автоматичними гарматами турелі перетворюють літак у справжню загрозу для тих, хто нападає на його винищувачів."
 rocket_rails: "Ракетні напрямні"
 rocket_rails_desc: "Коли пілот під крилами некеровані ракети виходять перед літаками, які атакують, то набагато легше наводити їх на ціль у порівнянні з бомбами."
 bomb_sights_1: "приціл для бомбометування I"
 bomb_sights_1_desc: "За допомогою складного механічного вирахунку, який зчитує швидкість вітру, кінцеву швидкість і висоту, можна скидати бомби з високою точністю."
 bomb_sights_2: "приціл для бомбометування II"
 bomb_sights_2_desc: "Ранні покоління прицілів вимагали тривалого налаштування, перш ніж видавали показання, але цю повністю стабілізовану модель можна налаштувати лише за декілька секунд. Вона навіть дозволяє компенсувати неглибокі піки."
 radio_navigation_1: "Радіонавігація I"
 radio_navigation_1_desc: "Радіоприємець, який вловлює перетин двох відносно простих радіовипромінюваннях і дозволяє нам знаходити цілі навіть у цілковитій темряві."
 radio_navigation_2: "Радіонавігація II"
 radio_navigation_2_desc: "Радіоприємець, який також включає ряд додаткових пристроїв для вимірювання відстані і повідомляє екіпажу точний момент, коли потрібно скинути бомби, навіть коли ціль не видно."
 air_ground_radar_1: "Радар «Повітря-земля» I"
 air_ground_radar_1_desc: "Розмаїття повітряного базування, що передає штурманові точне зображення поверхні під літаком, дозволяє орієнтуватися навіть під час поганої погоди чи темряви."
 air_ground_radar_2: "Радар «Повітря-земля» II"
 air_ground_radar_2_desc: "Завдяки більшому розв’язанню, ніж у попередніх моделей, цей веселий комплекс дозволяє вести точне бомбардування навіть крізь хмари."
 air_air_radar_1: "Радар «Повітря-повітря-повітря» I"
 air_air_radar_1_desc: "Набір радіолокаційних антен на літаку дозволяє навченим оператору виявити повітряну ціль навіть у темряві."
 air_air_radar_2: "Радар «Повітря-повітря-повітря» II"
 air_air_radar_2_desc: "Завдяки більш потужному передавачові ця радарна система може виявити цілі на більшій відстані."
 non_strategic_materials_small: "Використання нестратегічних матеріалів"
 non_strategic_materials_small_desc: "Замінюючи алюміній на спеціальні оброблені дерева або тканину там, де це можливо, ми можемо різко зменшити витрати стратегічних матеріалів, але дерево і тканину не дуже добре противляться сучасній зброї."
 drop_tanks: "Паперові баки, що скидаються"
 drop_tanks_desc: "Маленькі одноразові баки з додатковим запасом палива дозволяють винищувачам виконувати місії на великій відстані, тому що вони скидаються перед боєм, ці баки не перешкоджають бойовим діям."
 dive_brakes_small: "Аеродинамічний гальм"
 dive_brakes_small_desc: "Ряд снайлерів вздовж задній крони крила розкривається, коли літак йде у піку, знижуючи швидкість і дозволяючи вийти з штопора, не відірвавши крила. Це дозволяє екіпажу скидати бомби з майже вертикального піку, і таким чином різко підвищити точність атаки."
 non_strategic_materials_medium: "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc: "$non_strategic_materials_small_desc$"
 non_strategic_materials_large: "$non_strategic_materials_small$"
 non_strategic_materials_large_desc: "$non_strategic_materials_small_desc$"
 floats: "Поплавці"
 floats_desc: "Завдяки цьому він може сісти на воду, а це полегшує роздування сил ворога, але також значно зменшує маневрність."
 flying_boat_medium: "Летючі човни"
 flying_boat_medium_desc: "Замість того щоб встановлювати шасі, нижньої частини літака можна надати форму, яка дозволяє йому сідати на воду, а це значно полегшує проведення розвідувальних місій над морем."
 flying_boat_large: "$flying_boat_medium$"
 flying_boat_large_desc: "$flying_boat_medium_desc$"
 guided_anti_ship_missile: "Протикорабельна ракета"
 guided_anti_ship_missile_desc: "Сьогодні протикорабельна бомба з ракетним двигуном і радіоуправленням становить серйозну загрозу для всіх кораблів, які борознять моря."
 bouncing_bomb_release: "Механізм скинення бомби"
 bouncing_bomb_release_desc: "Життєдавець для перевезення і скинення спеціальних стрибків, які здійснюють кілька стрибків по поверхні води перед вибухом. Цей механізм, перш ніж скине бомбу в зворотному напрямку, збільшує ймовірність поразки даної мети."
 earthshaker_bomb_release: "Механізм скинення сейсмічної бомби"
 earthshaker_bomb_release_desc: "Для транспортування і скинення гігантських сейсмічних бомб, які пробивають землю і вибухають під поверхнею, такий вибух майже повністю знесе пошкоджену конструкцію."
 rocket_propelled_bombs: "Реактивні бомби"
 rocket_propelled_bombs_desc: "Реактивні бомби можуть завдати великих збитків кораблям та іншим великим бронованим цілям."
 improved_rocket_propelled_bombs: "Важкі реактивні бомби"
 improved_rocket_propelled_bombs_desc: "Більші некеровані бомби з реактивним двигуном, які несуть важкі навантаження і можуть вразити цілі."
 fixed_explosive_charge: "Прикріплений вибух"
 fixed_explosive_charge_desc: "Коли літак налітає на ворожий корабель, то це призведе до трагічних наслідків, але ціною буде втрата літака та його екіпажу."
 recon_camera: "Камера розвідки"
 recon_camera_desc: "Набір камер із спеціальними об’єктивами, які дозволяють літаку робити точні знімки ворожих позицій і навіть підкріпків з великою висоти."
 airdropped_mines: "Паперові міни"
 airdropped_mines_desc: "Набір морських мін, які можна скидати з літака завдяки парашуту."
 demining_coil: "Саперна котушка"
 demining_coil_desc: "Запущена на літак електромагнітна котшка створює сильне поле, яке змушує вибухати магнітні міни у нього на шляху."
 small_plane_airframe_0: "Корпус маленького літака міжвоєнних років"
 small_plane_airframe_0_desc: "Цей корпус демонструє кращі досягнення інженерної думки своєї епохи, але можливості для його розвитку досить обмежені."
 small_plane_airframe_1: "Базовий корпус маленького літака"
 small_plane_airframe_1_desc: "Останніми роками з’явилися нові технології, завдяки яким можна збирати потужні, але компактні літаки, а це лише перший крок на цьому шляху."
 small_plane_airframe_2: "Покращений корпус маленького літака"
 small_plane_airframe_2_desc: "Завдяки поліпшеній аеродинаміці та більш надійному конструкції цей корпус є великим кроком вперед у порівнянні з основною моделлю."
 small_plane_airframe_3: "Удосконалений корпус маленького літака"
 small_plane_airframe_3_desc: "Цей ретельно дороблений для виконання різних бойових завдань корпус є найкращим варіантом для літака з поршневим двигуном."
 small_plane_airframe_4: "Корпус сучасного маленького літака"
 small_plane_airframe_4_desc: "Цей корпус був розроблений спеціально, щоб скористатися перевагами великих швидкостей сучасних двигунів. Його конструкція дозволяє розв’язати низку структурних проблем, які виникають під час польоту на високій дозвуці швидкості."
