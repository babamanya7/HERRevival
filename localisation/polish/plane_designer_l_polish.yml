 medium_plane_airframe_0: "Корпус середнього літака міжвоєнних років"
 medium_plane_airframe_0_desc: "Незважаючи на здатність нести великі навантаження на далекі відстані, потенціал для розвитку цього корпусу дуже обмежений."
 medium_plane_airframe_1: "Базовий корпус середнього літака"
 medium_plane_airframe_1_desc: "Завдяки сучасним технологіям цей корпус має значно більше можливостей, ніж перші літаки подібних розмірів."
 medium_plane_airframe_2: "Покращений корпус середнього літака"
 medium_plane_airframe_2_desc: "Завдяки перевагам сучасної технології цей корпус дозволяє літаку перевозити значно більше вантажу на далекі відстані."
 medium_plane_airframe_3: "Удосконалений корпус середнього літака"
 medium_plane_airframe_3_desc: "Для того щоб досягти оптимальної ефективності під час великого навантаження, цей корпус є найкращою моделлю для літаків з механічним двигуном."
 medium_plane_airframe_4: "Корпус сучасного середнього літака"
 medium_plane_airframe_4_desc: "Коли інженери усвідомлюють, що майбутнє за літаками з реактивним двигуном, то починають розробляти корпуси для літаків, беручи до уваги реактивну тягу."
