 large_plane_airframe_0: "Міжвоєнний корпус великого літака"
 large_plane_airframe_0_desc: "Цей дуже великий корпус має достатньо місця для перенесення бомб або паливних баків. Однак зрозуміло, що потенціал його розвитку дуже обмежений. Нові покоління стратегічних бомбардувальників вже на горизонті."
 large_plane_airframe_1: "Базовий корпус великого літака"
 large_plane_airframe_1_desc: "Цей корпус був розроблений, щоб перевірити потенціал справжнього стратегічного бомбардувальника, здатного атакувати промислові цілі в глибині ворожої території та повертати свій екіпаж живим."
 large_plane_airframe_2: "Поліпшений корпус великого літака"
 large_plane_airframe_2_desc: "Оскільки концепція стратегічного бомбардувальника тепер добре перевірена, цей корпус був розроблений для покращення корисного навантаження та дальності, маючи достатній потенціал для майбутнього зростання."
 large_plane_airframe_3: "Удосконалений корпус великого літака"
 large_plane_airframe_3_desc: "Цей корпус, оптимізований для польотів на далекі відстані на великій висоті, здатний перевозити значне корисне навантаження вглиб ворожої території."
 large_plane_airframe_4: "Сучасний корпус великого літака"
 large_plane_airframe_4_desc: "Реактивний рух забезпечує значний стрибок у продуктивності. Цей корпус був розроблений, щоби скористатися цим."
 large_plane_maritime_patrol_plane_airframe_0: "Міжвоєнний морський патрульний літак"
 large_plane_maritime_patrol_plane_airframe_0_desc: "Флоту потрібні далекобійні літаки, щоби знаходити ворогів далеко від берега. Незважаючи на те, що він дещо застарів, цей корпус пропонує необхідну дальність для покриття великих ділянок океану."
 large_plane_maritime_patrol_plane_airframe_1: "Базовий морський патрульний літак"
 large_plane_maritime_patrol_plane_airframe_1_desc: "Поява більш потужних літаків-носіїв змушує знаходити та знищувати ворожий флот далеко від берега. Перший крок для цього — знайти їх далеко в океані, що потребує нового типу літака."
 large_plane_maritime_patrol_plane_airframe_2: "Поліпшений морський патрульний літак"
 large_plane_maritime_patrol_plane_airframe_2_desc: "Подвійна загроза підводних човнів і рейдових крейсерів вимагає патрулювання величезних ділянок океану. Цей корпус оптимізований для цього."
 large_plane_maritime_patrol_plane_airframe_3: "Удосконалений морський патрульний літак"
 large_plane_maritime_patrol_plane_airframe_3_desc: "Радар та інші датчики дають змогу знаходити ворожий флот навіть за поганої погоди чи темних ночей, але все нове обладнання потребує більшого корпусу для його перенесення."
 large_plane_maritime_patrol_plane_airframe_4: "Сучасний морський патрульний літак"
 large_plane_maritime_patrol_plane_airframe_4_desc: "З настанням ракетної ери морські патрульні літаки повинні бути здатні діяти навіть далі від берега та протягом тривалого часу."
 cv_small_plane_airframe_0: "Міжвоєнний корпус палубного літака"
 cv_small_plane_airframe_0_desc: "Оснащений фіксуючим гаком і посиленим шасі, цей корпус здатний керувати з авіаносця."
 cv_small_plane_airframe_1: "Базовий корпус палубного літака"
 cv_small_plane_airframe_1_desc: "Завдяки використанню нових технологій, розроблених для літаків наземного базування, цей корпус так само потужний, але його можна запускати з палуби авіаносця."
 cv_small_plane_airframe_2: "Поліпшений корпус палубного літака"
 cv_small_plane_airframe_2_desc: "Щоб йти в ногу з розвитком наземної авіації, цей корпус був розроблений із застосуванням нових технологій для збільшення дальності та продуктивності."
 cv_small_plane_airframe_3: "Удосконалений корпус палубного літака"
 cv_small_plane_airframe_3_desc: "Жорсткий характер палубної авіації обмежує, наскільки великим і потужним може бути корпус. Цей корпус являє собою абсолютний максимум, якого можна досягти за допомогою корпусу зі звичайним приводом."
 cv_small_plane_airframe_4: "Сучасний корпус палубного літака"
 cv_small_plane_airframe_4_desc: "Цей корпус був розроблений, щоб використати переваги збільшення тяги, створюваної реактивними двигунами, і перенести їх у морську авіацію."
