 medium_plane_airframe_0: "Міжвоєнний корпус середнього літака"
 medium_plane_airframe_0_desc: "Незважаючи на здатність перевозити значне корисне навантаження на великі відстані, потенціал покращення цього корпусу сильно обмежений."
 medium_plane_airframe_1: "Базовий корпус середнього літака"
 medium_plane_airframe_1_desc: "Завдяки використанню ряду нових технологій, нещодавно розроблених, цей корпус має значно кращі можливості, ніж попередні літаки подібного розміру."
 medium_plane_airframe_2: "Покращений корпус середнього літака"
 medium_plane_airframe_2_desc: "Використовуючи сучасні технології виробництва, цей корпус дозволяє перевозити більший корисний вантаж на більшу відстань."
 medium_plane_airframe_3: "Удосконалений корпус середнього літака"
 medium_plane_airframe_3_desc: "Цей корпус, розроблений для максимізації продуктивності та корисного навантаження, являє собою вершину літаків зі звичайним двигуном."
 medium_plane_airframe_4: "Сучасний корпус середнього літака"
 medium_plane_airframe_4_desc: "У зв'язку з тим, що літаки з реактивними двигунами, ймовірно, стануть домінуючими, інженери починають з'ясовувати, як будувати корпуси з реактивним двигуном."
