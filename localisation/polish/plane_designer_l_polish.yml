 early_bombs: "Бомби"
 early_bombs_desc: "З перших днів Великої війни літаки все частіше використовувалися для скидання вибухівки на ворожі цілі. З часом це дедалі більше перетворювалося на фундаментальний аспект повітряної війни."
 heavy_bombs: "Важкі бомби"
 heavy_bombs_desc: "Сучасна війна вимагає від літаків дедалі частіше використовувати більші бомби для ураження ворожих цілей. З часом це дедалі більше перетворюється на фундаментальний аспект повітряної війни."
 armor_piercing_bombs: "Бронебійні бомби"
 armor_piercing_bombs_desc: "Бронування палуб військових кораблів з року в рік стає тільки міцнішим, і для протидії потрібно спеціальних бомб, які можуть пробивати броню."
 air_torpedoe_1: "Авіаційні торпеди"
 air_torpedoe_1_desc: "Завдяки тому, що літак легковажний, він може наносити сильніші удари на море."
 air_torpedoe_2: "Розмаїття авіаліній"
 air_torpedoe_2_desc: "Завдяки стандартизації твердень та характеристик ми зможемо створювати більш великі, потужні і універсальні торпеди."
 air_torpedoe_3: "Модерні авіації"
 air_torpedoe_3_desc: "Завдяки легковаженому кріплення, яке скидається на торпеди, можна значно збільшити точність снарядів, а отже, захистити літак, який їх несе."
 photo_reconnaisance: "Фоторозвідка"
 photo_reconnaisance_desc: "Першим явним військовим призначенням літака було виявлення противника та повідомлення про його місцезнаходження генералам на землі. Це досі залишається одним із найпоширеніших завдань військової авіації."
 aa_lmg: "Легкий кулемет"
 aa_lmg_desc: "Кулемети гвинтівкового калібру стали основою зброї класу «повітря-повітря» ще з часів Великої війни."
 survivability_studies: "Вивчення живучості"
 survivability_studies_desc: "Ретельно аналізуючи бойові пошкодження літаків, що повертаються, ми можемо точно визначити, які частини літака дійсно життєво важливі."
 aircraft_construction: "Збірка літаків"
 aircraft_construction_desc: "Ми пройшли довгий шлях з часів фанери та тканини у авіабудуванні. Нові технології дозволяють створювати літаки, які краще підходять для конкретних ролей."
 aa_hmg: "Важкий кулемет"
 aa_hmg_desc: "Сучасні літаки здатні витримувати значно більше покарань, ніж старі моделі, а також пропонують менше можливостей для влучень. Таким чином, кожен удар має завдати максимальної шкоди, що вимагає більшого патрона."
 aa_hmg_2: "Покращений важкий кулемет"
 aa_hmg_2_desc: "Сучасні літаки здатні винести значно більше урону, ніж старіші моделі, і потрапити в них важче. Отже, кожне попадання повинно наносити максимальний урон, а для цього потрібен патрон великого калібру."
 aa_cannon_1: "Гармати I"
 aa_cannon_1_desc: "Гарматний снаряд може пробити навіть найміцніший літак, водночас імовірно несучи достатньо вибухівки, щоби завдати калічливої шкоди при влученні."
 aa_cannon_2: "Великі гармати"
 aa_cannon_2_desc: "Завдяки більшому калібру та більшому снаряду ці гармати можуть збивати навіть великі літаки одним ударом."
 aa_cannon_3: "Гармати II"
 aa_cannon_3_desc: "За допомогою сучасної гармати, що вистрілює великим снарядом на великій швидкості, ми можемо збити навіть найміцніший літак."
 range_improvements: "Поліпшення дальності"
 range_improvements_desc: "Хоча здається очевидним, що збільшення запасу палива збільшить дальність польоту літака, фактично додати цей обсяг літаку без надто сильного впливу на льотні параметри далеко не тривіально. Хоча здається очевидним, що збільшення запасу палива збільшить дальність польоту Насправді додати цю місткість до літака без надто сильного впливу на льотні параметри далеко не тривіально."
 sp_centrifugal_jet_tech: "Відцентровий реактивний двигун"
 sp_centrifugal_jet_tech_desc: "Відцентрові реактивні двигуни використовують одноступінчастий компресор для стиснення всмоктуваного повітря, перш ніж виштовхувати його для створення тяги. Це дозволяє створювати менші двигуни, які легше обслуговувати."
 jet_engine_axial_1x: "1 осьовий реактивний двигун"
 jet_engine_axial_1x_desc: "Встановлюючи кілька компресорів один за одним, осьовий двигун здатний збільшити тягу, що створюється простим одноступінчастим реактивним двигуном."
 jet_engine_axial_2x: "2 осьові реактивні двигуни"
