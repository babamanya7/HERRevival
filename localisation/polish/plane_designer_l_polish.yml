 large_plane_airframe_0: "Корпус великого літака міжвоєнних років"
 large_plane_airframe_0_desc: "У цьому дуже великому корпусі для розміщення бомб або паливних баків, але вже зараз очевидно, що потенціал для його розвитку дуже обмежений. На горизонті з’являються стратегічні бомбардувальники."
 large_plane_airframe_1: "Базовий корпус великого літака"
 large_plane_airframe_1_desc: "Цей корпус був розроблений, щоб випробувати можливість створення справжнього стратегічного бомбардувальника, здатного атакувати промислові об'єкти в глибині ворожої території, не піддаючи небезпеці екіпаж."
 large_plane_airframe_2: "Покращений корпус великого літака"
 large_plane_airframe_2_desc: "Оскільки концепція стратегічного бомбардувальника довела право на існування, цей корпус був розроблений для підвищення навантаження та дальності польоту, при цьому зберігши потенціал для подальшого розвитку."
 large_plane_airframe_3: "Удосконалений корпус великого літака"
 large_plane_airframe_3_desc: "Цей оптимізований для польотів корпус призначений для польоту на великі відстані на великій висоті і може нести великий вантаж глибоко в серце ворожої території."
 large_plane_airframe_4: "Корпус сучасного великого літака"
 large_plane_airframe_4_desc: "Реактивна маса забезпечує багатократний стрибок в потужності порівняно з попередніми двигунами."
 large_plane_maritime_patrol_plane_airframe_0: "Межовий літак морського патрулювання"
 large_plane_maritime_patrol_plane_airframe_0_desc: "Для того щоб відшукати ворогів далеко від берега, Флоту потрібно чимало часу, але він дає літакові потрібну відстань, щоб подолати великі відстані над океаном."
 large_plane_maritime_patrol_plane_airframe_1: "Базовий літак морського патрулювання"
 large_plane_maritime_patrol_plane_airframe_1_desc: "З появою потужніших літаків морської авіації було необхідно шукати й знищувати ворожі флоти. Першим кроком є виявлення ворожих кораблів на великій відстані, для чого і потрібен новий тип корпус літака."
 large_plane_maritime_patrol_plane_airframe_2: "Поліпшений літак морського патрулювання"
 large_plane_maritime_patrol_plane_airframe_2_desc: "Нам загрожують одразу і підкладки, і крейсери в походах, через що постало завдання патрулювання великих ділянок океану, для такої задачі оптимізований даний тип корпус."
 large_plane_maritime_patrol_plane_airframe_3: "Удосконалений літак морського патрулювання"
 large_plane_maritime_patrol_plane_airframe_3_desc: "Радари та інші датчики дозволяють виявити ворожий флот навіть вночі або в складних погодних умовах, але для нового обладнання літак потребує більшого корпусу."
 large_plane_maritime_patrol_plane_airframe_4: "Сучасний корпус літака морського патрулювання"
 large_plane_maritime_patrol_plane_airframe_4_desc: "З початком ери ракети морського патрулювання повинні діяти ще далі від берега і ще довше."
 cv_small_plane_airframe_0: "Корпус паубного літака міжвоєнних років"
 cv_small_plane_airframe_0_desc: "Завдяки цьому оснащеному гальмувним гаком і висиленим шасі корпус створює літаки, які можуть діяти з палуби авіаносця."
 cv_small_plane_airframe_1: "Базовий корпус палубного літака"
 cv_small_plane_airframe_1_desc: "Цей корпус втілює нові технології, розроблені для літаків наземного базування, і тому володіє не меншими можливостями, але дозволяє літакові злітати з палуби авіаносця."
 cv_small_plane_airframe_2: "Удосконалений корпус павука"
 cv_small_plane_airframe_2_desc: "Цей корпус був створений, щоб йти в ногу з розвитком авіації наземного базування, і використовує нові технології для збільшення дальності польоту та ефективності."
 cv_small_plane_airframe_3: "Удосконалений корпус палубного літака"
 cv_small_plane_airframe_3_desc: "Строкі вимоги до палубних літаків обмежують розміри та можливості їхнього корпусу, а це — найкраща модель для літаків з механічним двигуном."
 cv_small_plane_airframe_4: "Корпус сучасного палубного літака"
 cv_small_plane_airframe_4_desc: "Цей корпус був розроблений для того, щоб отримати переваги реактивних двигунів і доставити їх до морської авіації."
