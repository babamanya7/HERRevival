 jet_engine_1x: "1 реактивний двигун"
 jet_engine_1x_desc: "Завдяки абсолютно іншому підходу до живлення літака цей складний і темпераментний двигун все ще забезпечує значне збільшення тяги та швидкості."
 jet_engine_2x: "2 реактивні двигуни"
 jet_engine_2x_desc: "$engine_1_2x_desc$"
 jet_engine_3x: "3 реактивні двигуни"
 jet_engine_3x_desc: "$engine_1_3x_desc$"
 jet_engine_4x: "4 реактивні двигуни"
 jet_engine_4x_desc: "$engine_1_4x_desc$"
 jet_engine_6x: "6 реактивних двигунів"
 jet_engine_6x_desc: "$engine_1_6x_desc$"
 rocket_engine_1: "Ракетний двигун I"
 rocket_engine_1_desc: "Використовуючи низку дуже летких палив і такий же нестабільний окислювач, цей двигун здатний видавати дуже велику тягу, щоб розштовхнути літак до високих швидкостей, за рахунок мінімальної дальності."
 rocket_engine_2: "Ракетний двигун II"
 rocket_engine_2_desc: "Удосконалення камери згоряння та незначні зміни паливної суміші забезпечують навіть вищу продуктивність із відповідним зниженням запасу ходу."
 rocket_engine_3: "Ракетний двигун III"
 rocket_engine_3_desc: ""
 bomb_locks: "Утримувачі для бомб"
 bomb_locks_desc: "Кріплення для малих бомб під крилами або фюзеляжем дозволяють літаку атакувати наземні цілі з певною надією на успіх."
 heavy_bomb_locks: "Утримувачі для важких бомб"
 heavy_bomb_locks_desc: "Кріплення для великих бомб під крилами або фюзеляжем дозволяють літаку атакувати наземні цілі з високою ефективністю."
 armor_piercing_bomb_locks: "Утримувачі для бронебійних бомб"
 armor_piercing_bomb_locks_desc: "Кріплення для великих бронебійних бомб під крилами або фюзеляжем дозволяють літаку атакувати морські цілі з високою ефективністю."
 torpedo_mounting: "Міць для легенів торпед"
 torpedo_mounting_desc: "Завдяки міцності літака, який може легко завести торпеду під фюзеляжом, літак стає потужною зброєю для знищення ворожих кораблів."
 torpedo_mounting_2: "Фортеця для середніх торпед"
 torpedo_mounting_2_desc: "Закріплення, яке дозволяє встановити торпеду середньої ваги під фюзеляжом, дає повітряну зброю для знищення ворожих кораблів."
 torpedo_mounting_3: "Міць для важких торпед"
 torpedo_mounting_3_desc: "Завдяки міцності повітряного торпеду літаки можуть знищити ворожі кораблі."
 armor_plate_small: "Бронепластини"
 armor_plate_small_desc: "Сталеві покриття позаду сидіння пілота та навколо двигуна забезпечують підвищену живучість літака проти вогню з землі та атак ззаду."
 large_aircraft_cannon_1x: "1 велика гармата"
 large_aircraft_cannon_1x_desc: "Вистрілюючи більшим і потужнішим снарядом, ніж попередні ітерації автоматичних гармат, ця зброя може збити навіть великий корпус одним ударом."
 large_aircraft_cannon_2x: "2 великі гармати"
 large_aircraft_cannon_2x_desc: "Зручні гармати надають літака значну силу, а збільшена щільність вогню дозволяє легко виводити з бою літаки противника."
 small_bomb_bay: "Малий відсік для бомб"
 small_bomb_bay_desc: "Невеликий відсік для перенесення бомб. Знаходження всередині фюзеляжу зменшує опір, але необхідні для цього структурні зміни означають, що літак не може робити радикальні маневри в повітряному бою."
 medium_bomb_bay: "Середній відсік для бомб"
 medium_bomb_bay_desc: "Бомбовий відсік середнього розміру дозволяє мати достатню кількість боєприпасів для ураження різноманітних цілей."
 large_bomb_bay: "Великий відсік для бомб"
 large_bomb_bay_desc: "Великий відсік, щоб перемістити достатньо боєприпасів, щоби пошкодити або знищити навіть великі заводи та інші важкі цілі."
 tank_buster_1: "Протитанкова гармата I"
 tank_buster_1_desc: "Адаптована на основі протитанкової гармати, яка використовується в армії, ця гармата може знищувати навіть сучасні танки влучними пострілами. Однак його велика вага та незручна конструкція серйозно обмежують габарити літака."
 tank_buster_2: "Протитанкова гармата II"
 tank_buster_2_desc: "Важчі танки, які зараз знаходяться на озброєнні, вимагають значно більшої гармати для боротьби. Хоча він надзвичайно важкий і громіздкий, він чудово підходить як зброя для атак на позиції ворога."
 armor_plate_medium: "$armor_plate_small$"
 armor_plate_medium_desc: "Броня навколо двигунів і більш крихких частин фюзеляжу забезпечує літаку значно кращу живучість за рахунок дальності."
 armor_plate_large: "$armor_plate_small$"
 armor_plate_large_desc: "Велике сталеве покриття захищає двигуни, паливні баки та відділення для екіпажу, дозволяючи літаку уникнути прямого вогню зенітної установки, а також робить його дуже важкою мішенню для винищувачів."
 lmg_defense_turret: "Захисна турель із легким кулеметом"
 lmg_defense_turret_desc: "Незважаючи на дещо недостатню потужність для бою повітря-повітря, легкий кулемет у башті зробить будь-яку атаку проти цього літака більш небезпечною."
 lmg_defense_turret_2x: "2 захисні турелі з легким кулеметом"
 lmg_defense_turret_2x_desc: "Набір із двох легких кулеметів у баштах із електроприводом покриває більше кутів і робить літак набагато складнішою ціллю для атаки."
 hmg_defense_turret: "Захисна турель із важким кулеметом"
 hmg_defense_turret_desc: "Важкий кулемет у башті, що обертається, дозволяє захиснику дати відсіч бійцю, озброєному аналогічною зброєю, з певною надією на успіх."
 hmg_defense_turret_2x: "2 захисні турелі з важким кулеметом"
 hmg_defense_turret_2x_desc: "Набір із двох веж із потужним двигуном із великокаліберними кулеметами представляє будь-якого атакуючого винищувача небезпечну ціль."
 cannon_defense_turret: "Захисна турель із гарматою"
 cannon_defense_turret_desc: "Сучасна гармата в поворотній башті суттєво змінює співвідношення сил захисника і атакуючого в повітряному бою. Мало хто з бійців може витримати пряме влучання сучасної гармати і продовжити бій."
 cannon_defense_turret_2x: "2 захисні турелі з гарматою"
 cannon_defense_turret_2x_desc: "Дві башти, озброєні автоматичними гарматами, надають літаку жахливий оборонний удар, що зробить атаку будь-якого винищувача на нього справді дуже небезпечною."
 rocket_rails: "Направляючі для ракет"
 rocket_rails_desc: "Під крилами зависали некеровані снаряди. Оскільки вони стріляють попереду атакуючого літака, пілоту набагато простіше навести їх на ціль, ніж бомби."
 bomb_sights_1: "Бомбові приціли I"
 bomb_sights_1_desc: "Складний механічний комп'ютер, який враховує дрейф вітру, кінцеву швидкість і висоту, дозволяє бомбардиру скидати бомби з високою точністю."
 bomb_sights_2: "Бомбові приціли II"
 bomb_sights_2_desc: "У той час як для попередніх поколінь бомбових прицілів часто вимагався тривалий процес налаштування, перш ніж вони прийшли до своїх цілевказівних рішень, цей повністю стабілізований бомбовий приціл займає лише кілька секунд і може навіть компенсувати неглибокі занурення."
 radio_navigation_1: "Радіонавігація I"
 radio_navigation_1_desc: "Радіоприймач, що прослуховує перетин двох досить простих радіонавігаційних променів, що дозволяє знаходити ціль навіть у повній темряві."
 radio_navigation_2: "Радіонавігація II"
 radio_navigation_2_desc: "Радіоприймач, який також включає ряд помічників для вимірювання відстані, які повідомляють бомбардиру точний момент, коли бомби потрібно випустити, навіть якщо він не бачить цілі."
 air_ground_radar_1: "Радар «повітря–земля» I"
 air_ground_radar_1_desc: "Бортовий радар, який надає навігатору точне зображення поверхні під літаком, дозволяючи точну навігацію навіть у темряві чи за поганої погоди."
 air_ground_radar_2: "Радар «повітря–земля» II"
 air_ground_radar_2_desc: "Завдяки вищій роздільній здатності, ніж у попередніх моделей, цей радар забезпечує точне бомбардування навіть через хмарний покрив."
 air_air_radar_1: "Радар «повітря–повітря» I"
 air_air_radar_1_desc: "Набір радіолокаційних антен на літаку дозволяє навченому оператору знаходити повітряну ціль навіть у темряві."
 air_air_radar_2: "Радар «повітря–повітря» II"
 air_air_radar_2_desc: "Завдяки потужнішому передавача цей радар може виявляти цілі на більшій відстані."
 non_strategic_materials_small: "Використання нестратегічних матеріалів"
 non_strategic_materials_small_desc: "Замінивши алюміній спеціально обробленою деревиною або тканиною, де це можливо, ми можемо значно скоротити використання стратегічних матеріалів. Однак дерево і тканина не дуже добре протистоять сучасній зброї."
 drop_tanks: "Скидні паливні баки"
 drop_tanks_desc: "Маленькі одноразові баки, які містять додаткове паливо, дають нашим бійцям додаткову дальність під час виконання наступальних завдань. Оскільки вони скидаються перед боєм, вони не перешкоджають бойовим параметрам."
 dive_brakes_small: "Гальма для пікірування"
 dive_brakes_small_desc: "Набір спойлерів уздовж задньої кромки крила розгортається, коли літак починає пікірування, зменшуючи загальну швидкість і дозволяючи літаку виходити з крутого пікірування, не відриваючи крил. Це, у свою чергу, дозволяє літаку атакувати з майже вертикального пікірування, різко підвищуючи точність."
 non_strategic_materials_medium: "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc: "$non_strategic_materials_small_desc$"
 non_strategic_materials_large: "$non_strategic_materials_small$"
 non_strategic_materials_large_desc: "$non_strategic_materials_small_desc$"
 floats: "Поплавці"
 floats_desc: "Сидіння плавучих пристроїв, встановлене під корпусом літака, дозволяє літаку здійснювати посадку на воду. Це полегшує розвідку військово-морських засобів противника, але також значно знижує спритність."
 flying_boat_medium: "Летючий човен"
 flying_boat_medium_desc: "Замість кріплення шасі нижню частину літака можна сформувати таким чином, щоб можна було приземлитися на воду. це значно полегшує розвідувальні місії над водою."
 flying_boat_large: "$flying_boat_medium$"
 flying_boat_large_desc: "$flying_boat_medium_desc$"
 guided_anti_ship_missile: "Керована протикорабельна ракета"
 guided_anti_ship_missile_desc: "Фактично протикорабельна бомба з ракетним двигуном і радіонаведенням, ця нова зброя війни є серйозною загрозою для всіх кораблів, які зараз знаходяться на плаву."
 bouncing_bomb_release: "Механізм скиду стрибучої бомби"
 bouncing_bomb_release_desc: "Стійка для перевезення та запуску спеціальних стрибучих бомб, які сковзають по воді, поки не влучать у ціль. Механізм змушує бомбу обертатися назад під час запуску, що збільшує ймовірність влучання в намічену структурну ціль."
 earthshaker_bomb_release: "Механізм скиду сейсмічної бомби"
 earthshaker_bomb_release_desc: "Стійка та пусковий механізм для велетенських сейсмічних бомб, призначених для проникнення в землю при ударі та вибуху під землею, завдаючи значної структурної шкоди своїй цілі."
 rocket_propelled_bombs: "Бомби на ракетній тязі"
 rocket_propelled_bombs_desc: "Некеровані бомби на ракетній тязі можуть завдавати значної шкоди кораблям і подібним броньованим великим цілям."
 improved_rocket_propelled_bombs: "Важкі бомби на ракетній тязі"
 improved_rocket_propelled_bombs_desc: "Іще більші некеровані бомби на ракетній тязі, які несуть важчий вантаж і здатні ще ефективніше вражати цілі."
 fixed_explosive_charge: "Закріплений вибуховий заряд"
 fixed_explosive_charge_desc: "Стаціонарний порожнистий заряд перетворює літак на летючу бомбу. Якщо літак буде направлено на вороже судно, це спричинить драматичні руйнування, але ціною загибелі літака та екіпажу."
 recon_camera: "Розвідувальна камера"
 recon_camera_desc: "Набір камер зі спеціальними об'єктивами, що дозволяють літаку робити точні знімки з'єднань і об'єктів противника навіть з великої висоти."
 airdropped_mines: "Повітряні міни"
 airdropped_mines_desc: "Набір морських мін, обладнаних парашутом, що дозволяє їх скидати з літака."
 demining_coil: "Котушка для розмінування"
 demining_coil_desc: "Велика котушка, встановлена на корпусі літака, дозволяє літаку створювати потужне магнітне поле, яке викликає вибухи магнітних мін на траєкторії його польоту."
 small_plane_airframe_0: "Міжвоєнний корпус малого літака"
 small_plane_airframe_0_desc: "З перших днів Великої війни авіація прогресувала семимильними кроками. Цей корпус є кульмінацією цих розробок, але очевидно, що потенціал його покращення обмежений."
 small_plane_airframe_1: "Базовий корпус малого літака"
 small_plane_airframe_1_desc: "Останніми роками з'явилася низка нових технологій, які дозволяють будувати дуже потужні, але невеликі літаки. Цей корпус є лише першим кроком на цьому шляху."
 small_plane_airframe_2: "Поліпшений корпус малого літака"
 small_plane_airframe_2_desc: "Завдяки покращеній аеродинаміці та міцнішій конструкції цей корпус є явним кроком вперед у порівнянні з базовою моделлю."
 small_plane_airframe_3: "Удосконалений корпус малого літака"
 small_plane_airframe_3_desc: "Ретельно оптимізований для забезпечення продуктивності, цей корпус являє собою абсолютний максимум того, що можна зробити з поршневим літаком."
 small_plane_airframe_4: "Сучасний корпус малого літака"
 small_plane_airframe_4_desc: "Цей корпус розроблений, щоб використовувати переваги великих швидкостей, які пропонують сучасні двигуни, і вирішити деякі структурні проблеми, пов'язані з польотом на високих дозвукових швидкостях."
 small_plane_airframe_5: "Надзвуковий корпус малого літака"
 small_plane_airframe_5_desc: "Цей удосконалений корпус, здатний до надзвукового польоту зі швидкістю 1 Мах, уособлює вершину людської інженерії."
