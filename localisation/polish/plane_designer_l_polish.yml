 plane_modules_tech: "Літакові додатки"
 AIR_TITLE_MOTHERSHIP: "Материнський літак"
 AIR_TITLE_MOTHERSHIP_DESC: "Материнський літак — це великі літаки, призначені для транспортування та розгортання літаків меншого розміру, що значно розширює їхній радіус дії."
