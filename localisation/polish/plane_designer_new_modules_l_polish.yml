 engine_1_1x: "1x Рядний двигун I"
 engine_1_1x_desc: "Рядні двигуни з рідким охолодженням - легше, ніж радіальні двигуни, і дозволяють встановлювати моторну гармату."
 engine_1_2x: "2x Рядний двигун I"
