 radial_engine_1_1x: "1x радіальний двигун I"
 radial_engine_1_1x_desc: "Радіальні двигуни з повітряним охолодженням, важкі і міцні, виробляють більше потужності, ніж рядні двигуни, але повільніше через більший лобовий опір через більшу лобову площу."
 radial_engine_1_2x: "2x радіальний двигун I"
 radial_engine_1_2x_desc: "Дві радіальні двигуни дають літакові великий зріст тяги, але за це доведеться платити."
 radial_engine_1_3x: "3x радіальний двигун I"
