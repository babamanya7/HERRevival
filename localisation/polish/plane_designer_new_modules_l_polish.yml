 auto_extinguisher_system_small: "Пожежники"
 auto_extinguisher_system_small_desc: "Назва системи говорить сама за себе: пожежа двигуна під час польоту, а тим більше під час битви — це не те, з чим ми хочемо мати справу."
 auto_extinguisher_system_medium: "Пожежники"
