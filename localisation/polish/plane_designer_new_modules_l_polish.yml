 swept_wings: "Стріловидні крила"
 swept_wings_desc: "Стрелоподібне крило допомагає зменшити опір при надзвукових польотах."
 improved_compressor: "Покращений компресор"
 improved_compressor_desc: "Реактивні двигуни всмоктують через повітряозабірник велику кількість повітряного повітря, за вхідним отвіром знаходиться компресорна секція. Робота компресора полягає у збільшенні тиску повітря, що надходить до того, як він досягне частини згоряння."
 supersonic_air_intake: "Надзвуковий повітряозабірник"
 supersonic_air_intake_desc: "Для надзвукового літака впускний отвір має сповільнити потік дозвукового швидкостей, перш ніж повітря досягне компресора."
 afterburner: "Форсаж"
 afterburner_desc: ""

 leigh_light: "Прожектор Лі"
 leigh_light_desc: "Завдяки потужному прожектору з вугільною дугою можна виявити підводні човни вночі."
 sonobuoy: "Гідроакустичний буй"
 sonobuoy_desc: "Одноразова гідроакуста система, скидаючись з літаків, що ведуть боротьбу проти моря."
 magnetic_anomaly_detector: "Детектор магнітних аномалій"
 magnetic_anomaly_detector_desc: "Магнітометри зазвичай використовуються для пошуку підводних човнів. Підводні човни виготовляють переважно з ферми, тому їхня присутність у магнітному полі Землі буде перемінювати поле навколо них. Це на додаток до властивої їм остаткової насиченості."
 asv_radar: "Корабельний радар «Повітря-поверхність»"
 asv_radar_desc: "Базовий бортовий пошуковий радар"

 fb_bomb_locks: "Бомбодержателі"
 fb_bomb_locks_desc: "Міцні бомби під крилами або фюзеляжами дозволяють літакові успішно атакувати наземні цілі."
 fb_heavy_bomb_locks: "Держави для важких бомб"
 fb_heavy_bomb_locks_desc: "Під крилами або фюзеляжами потужні бомби дозволяють літаки успішно атакувати наземні цілі."
 fb_small_bomb_bay: "Маленький бомбовий відсік"
 fb_small_bomb_bay_desc: "Він не впливає на аеродинаміку, тому що знаходиться всередині фюзеляжу, але конструкція літака більше не дозволяє йому виконувати складні маневри у повітряному бою."

 medium_bomb_bay_cluster_bombs: "Касетні бомби"
 medium_bomb_bay_cluster_bombs_desc: "Касетні бомби викидають вибухові бомби, призначені для знищення особистих складів і транспортних засобів."

 small_cluster_bombs: "Бомби-бабочки"
 small_cluster_bombs_desc: "Цей тип бомби був однією з перших касетних бомб, які коли-небудь використовували в бою, і виявився дуже ефективною зброєю."

 supply_drops: "Снабжинче відділення"
 troop_compartment: "Десантне відділення"
 cargo_bay: "Вантажовий відсік"
 cargo_bay_desc: ""

 jet_engine_improvements: "Покращення реактивного двигуна"

 torpedo_mounting: "Легкі гальмарні установки"
 torpedo_mounting_desc: "Вузли підвіски, які дозволяють встановити під фюзеляжем легкі торпеди, дають літакові потужну зброю, яку можна використовувати проти кораблів ворога."
 torpedo_mounting_2: "Звичайні торпедні установки"
 torpedo_mounting_2_desc: "Вузли підвіски, які дозволяють встановити під фюзеляжем середня торпеда, дають літакові потужну зброю, яку можна використовувати проти кораблів ворога."
 torpedo_mounting_3: "Важкі торпедні установки"
 torpedo_mounting_3_desc: "Вузли підвіски, які дозволяють встановити під фюзеляжем важкі торпеди, дають літакові потужну зброю, яку можна використати проти кораблів ворога."

 air_torpedoe_1: "Торпеди повітряного базування"
 air_torpedoe_1_desc: "Потрібно розробити легкі торпеди, щоб їх можна було нести на наших літаках."
 air_torpedoe_2: "Покращені торпеди повітряного базування"
 air_torpedoe_2_desc: "Технології авіалінії дозволяють розвивати більші й потужніші торпеди."
 air_torpedoe_3: "Передові торпеди повітряного базування"
