 high_octane_fuel: "Високооктанова присадка"
 high_octane_fuel_desc: "Авіаціональний бензин з вищим октановим числом може використовуватися як паливо для високопровідних авіалінійних двигунів, що підвищують літно-технічні характеристики літаків."

 remote_control_turret_system: "Турелі з дистанційним управлінням"
 remote_control_turret_system_desc: "Турелі-стрілки можуть сильно дратувати, якщо вони мертві або засинають посеред повітряного бою, тому їх дуже зручно замінити централізованою системою управління."
 remote_control_turret_system_category: "Турелі з дистанційним управлінням"

 pressurized_cockpit: "Терметична кабіна"
 pressurized_cockpit_desc: "Терметизація кабіни літака дозволяє літати на значно менших висотах з менш щільним повітрям, і це збільшує його швидкість та маневрність."
 pressurized_cockpit_med: "Терметична кабіна"
 pressurized_cockpit_med_desc: "Терметизація кабіни літака дозволяє літати на значно менших висотах з менш щільним повітрям, і це збільшує його швидкість та маневрність."



 water_injection: "Стигема вплювання води"
 water_injection_desc: "Вприк двигуна використовується для охолодження топлівно-повітряної суміші і, таким чином, досягнення більшої потужності."
 fuel_injection: "Інжекторна система подачі палива"
 fuel_injection_desc: "Впрік двигуна використовується для охолодження топлівно-повітряної суміші і, таким чином, досягнення більшої потужності і зниження витрат палива."

 early_turbocharger: "Рання турбокомпресор"
 early_turbocharger_desc: "Турбокомпресор — це пристрій примусової індукції з приводом від турбіни, який використовується в поршневому двигуні для збільшення потужності."
 early_supercharger: "Ранній нагнітач"
 early_supercharger_desc: "Нагнетатор - це пристрій примусової індукції з механічним пристроєм, який використовується в поршневому двигуні для збільшення потужності. Його призначення і функція аналогічні турбонагнетелю, з тією фундаментальною різницею, що він посилається в дію механічним шляхом, безпосередньо пов'язаним з двигуном, тоді як турбонагнетатор вводиться в дію За допомогою автомобільних вихлопних газів."


 turbocharger: "Турбокомпресор"
 turbocharger_desc: "Турбокомпресор — це пристрій примусової індукції з приводом від турбіни, який використовується в поршневому двигуні для збільшення потужності."
 supercharger: "Нагнетатор"
 supercharger_desc: "Нагнетатор - це пристрій примусової індукції з механічним пристроєм, який використовується в поршневому двигуні для збільшення потужності. Його призначення і функція аналогічні турбонагнетелю, з тією фундаментальною різницею, що він посилається в дію механічним шляхом, безпосередньо пов'язаним з двигуном, тоді як турбонагнетатор вводиться в дію За допомогою автомобільних вихлопних газів."

 dive_brakes_medium: "Аеродинамічний гальм"
 dive_brakes_medium_desc: "Набір інтерцептерів вздовж задній крони крила розкривається, коли літак входить в пікування, знижуючи загальну швидкість і дозволяючи літаку вийти з крутого пікування, не відриваючи крил. Літак атакувати з майже вертикального піку, що різко підвищує точність."

