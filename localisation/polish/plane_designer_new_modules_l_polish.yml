 aerodynamic_pylons_small: "Аеродинамічні пілони"
 aerodynamic_pylons_small_desc: "Як не дивно, перетягування не допомагає літати швидше, особливо якщо підвісити кілька бомб під крила."
 aerodynamic_pylons_medium: "Аеродинамічні пілони"
 aerodynamic_pylons_medium_desc: "Як не дивно, перетягування не допомагає літати швидше, особливо якщо підвісити кілька бомб під крила."

 drop_tanks_medium: "Пагорби, що скидаються"
 drop_tanks_medium_desc: "Багато палива завжди краще, ніж його відсутність, велика дальність краще, ніж бути підстреленим. Бути авіаконструктором так просто, хіба ви не знаєте?"

