 light_tank_chassis:0 "Легкий танк"
 medium_tank_chassis:0 "Середній танк"
 heavy_tank_chassis:0 "Важкий танк"
 light_tank_chassis_0:0 "Шассі міжвоєнного легкого танку"
 light_tank_chassis_desc:0 "Невелика і компактна шасі ідеально підходить для легкої і дешевої бойової машини, яка виконує такі завдання, як розвідка і підтримка вогнем. Через обмежену вантажопід'ємність непригодно для встановлення важкої броні або великих гармат."
 light_tank_chassis_1:0 "Шассі базу легкого танку"
 basic_light_tank_chassis:0 "Шассі базу легкого танку"
 basic_light_tank_chassis_short:0 "Легка модель 1934 р."
 basic_light_tank_chassis_desc:0 "Через технологічний розвиток проекти післявоєнних років фактично застаріли. де використовуються останні досягнення в металургії та оформленні."
 light_tank_chassis_2:0 "Шассі покращеного легкого танку"
 improved_light_tank_chassis:0 "Шассі покращеного легкого танку"
 improved_light_tank_chassis_short:0 "Легка модель 1936 р."
 improved_light_tank_chassis_desc:0 "Це шассі, наступний цикл розвитку, заснований на попередніх моделях легенів танків, відображується підвищеною надійністю та ремонтом."
 light_tank_chassis_3:0 "Шассі модернізованого легкого танку"
 advanced_light_tank_chassis:0 "Шассі модернізованого легкого танку"
 advanced_light_tank_chassis_short:0 "Легка модель 1941 р."
 advanced_light_tank_chassis_desc:0 "У битвах чимраз частіше використовуються середні танки, а легені з танками відіграють головну роль у підтримці, і нам потрібно нового шасі, яке буде враховувати ці ролі."
 light_tank_amphibious_chassis_0:0 "Шассі міжвоєнного легкого танку (поплавного)"
 light_tank_amphibious_chassis_1:0 "Шассі базованого легкого танку (поплавця)"
 light_tank_amphibious_chassis_2:0 "Шассі покращеного легкого танку (поплаваючого)"
 light_tank_amphibious_chassis_3:0 "Шассі модернізованого легкого танку (поплаваючого)"
 light_tank_amphibious_equipment_0:0 "Місткий плавний танк"
 light_tank_artillery_chassis_0:0 "Межвонна легка САУ"
 light_tank_artillery_chassis:0 "Легка САУ"
 light_tank_artillery_chassis_desc:0 "Маленька і компактна бойова машина, головна роль якої полягає в тому, щоб підтримувати наступаючу піхоту."
 light_tank_artillery_chassis_1:0 "Базова легка САУ"
 light_tank_artillery_chassis_2:0 "Покращена легка САУ"
 light_tank_artillery_chassis_3:0 "Модернізована легка САУ"
 light_tank_destroyer_chassis_0:0 "Межвонна ПТ-установка"
 light_tank_destroyer_chassis:0 "Легка ПТ-Установка"
 light_tank_destroyer_chassis_desc:0 "Невелика і компактна машина з потужним знаряддям для знищення ворожих бронетехніків."
 light_tank_destroyer_chassis_1:0 "Базова пТ-установка"
 light_tank_destroyer_chassis_2:0 "Покращена ПТ-установка"
 light_tank_destroyer_chassis_3:0 "Модернізована легка ПТ-установка"
 light_tank_aa_chassis_0:0 "Нижня легка ЗСУ"
 light_tank_aa_chassis:0 "Легка ЗСУ"
 light_tank_aa_chassis_desc:0 "Маленька і компактна машина з зенітними знаряддями для захисту від ворожої авіації."
 light_tank_aa_chassis_1:0 "Базова легковажка"
 light_tank_aa_chassis_2:0 "Покращена легка ЗСУ"
 light_tank_aa_chassis_3:0 "Модернізована легка ЗСУ"
 medium_tank_chassis_1:0 "Шассі базового середнього танку"
 medium_tank_chassis_0:0 "Шассі міжвоєнного середнього танку"
