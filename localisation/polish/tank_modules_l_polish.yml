 modern_tank_chassis:0 "Шассі сучасного танку"
 modern_tank_chassis_desc:0 "Модернізурова шассі, в якій багато що взяте від попередніх середніх танків, але зроблено набагато більше впертості на швидкість і маневрність з збереженням можливості встановлення важкої броні і великих гармат, характерних для Середні танки, і завдяки цьому утворюється досить універсальна бойова машина."
 main_battle_tank_chassis_desc:0 "Досвід показав, що легені, середні й важкі танки все більше й більше погоджуються між собою: важкі танки стали більш мобільними, а легкі танки, щоб вижити на полі бою, носять все більше і більшекаліберного Отже, є сенс об'єднати всі три проекти в один тип, який стане нашим універсальним основним бойовим танком."
 modern_tank_chassis_1:0 "Шассі сучасного танку"
 modern_tank_artillery_chassis:0 "Сучасна САУ"
 modern_tank_artillery_chassis_desc:0 "Сучасна бойова машина, розроблена так, щоб бути повністю функціональною артилерійською встановкою, здатною конкурувати з сучасними танками і захищатися від будь - яких загроз на полі бою."
 modern_tank_artillery_chassis_1:0 "Сучасна САУ"
 modern_tank_destroyer_chassis_desc:0 "Сучасна бойова машина, розрахована на швидке реагування на напади ворожих танків, щоб захистити подібний рівень."
 modern_tank_destroyer_chassis_1:0 "Сучасна ПТ-Установка"
 modern_tank_destroyer_chassis:0 "Сучасна ПТ-Установка"
 modern_tank_aa_chassis_desc:0 "Сучасна бойова машина, розрахована на мобільну й добре захищену від нападу ворожої авіації."
