 super_heavy_tank_chassis_desc:0 "Гігантська бойова машина, здатна нести найтяжче броню і найбільш потужне знаряддя, але через це повільна і ненадійна."
 super_heavy_tank_chassis_1:0 "Шассі надтяжого танку"
