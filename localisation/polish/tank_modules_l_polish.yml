 ### EQUIPMENT MODULES ###
 expanded_fuel_tank:0 "Додаткові паливні баки"
 tank_gasoline_engine:0 "Бензиновий двигун"
 tank_gasoline_engine_desc:0 "Двигун, який працює на бензині, буде швидше при рівному об'ємі, але сам бензин при цьому більше схильний запалюватися."
 tank_diesel_engine:0 "Дизельний двигун"
 tank_diesel_engine_desc:0 "Дизельні двигуни надійніші за бензинове, але при однаковому об’ємі з ним технологія розвиває меншу швидкість."
 tank_petrol_electric_engine:0 "Бензиново-електронний двигун"
 tank_petrol_electric_engine_desc:0 "Комбінація бензинового двигуна та електропровідника, що отримує від нього енергію, — це складний двигун, дороги і ненадійний, але вищий за будь-який інший за продуктивність у тактичних маневрах."
 tank_gas_turbine_engine:0 "Газова турбіна"
 tank_gas_turbine_engine_desc:0 "Турбіна, розроблена на основі реактивного двигуна."
 tank_riveted_armor:0 "Клепанна броня"
 tank_riveted_armor_desc:0 "Хоча бранопластини, які прилягають до рами та утримуються заклепками, але, на відміну від відносно дешевої технології, самі клепки можуть завдати шкоди екіпажу."
 tank_cast_armor:0 "Лита броня"
 tank_cast_armor_desc:0 "Все шассі, включаючи броню, відливається як одне ціле, дорогий і довгий процес, який дозволяє створити набагато товстіше броню, в якій менше вразливих місць."
 tank_welded_armor:0 "Сварна броня"
 tank_welded_armor_desc:0 "Бронепластини приварюють до шасі, що забезпечує добрий захист, швидше лиття."
 tank_welded_armor_2:0 "Сварна броня 2"
 tank_welded_armor_2_desc:0 "Бронепластини приварюють до шасі, що забезпечує добрий захист, швидше лиття."
 tank_torsion_bar_suspension:0 "Торсионна підвіска"
 tank_torsion_bar_suspension_desc:0 "Порівняно з надійною системою підвіски металевих балок, прикріплених до шасі бойової машини, краще за будь - який інший вид підвіски."
 tank_christie_suspension:0 "Підвіска Крісті"
 tank_christie_suspension_desc:0 "Ця підвіска, розроблена американським винахідником, дозволяє розвивати надзвичайно високу швидкість."
 tank_bogie_suspension:0 "Балансірна підвіска"
 tank_bogie_suspension_desc:0 "Простий і відносно дешевий тип підвіски, в якому котки закріплені окремо, що полегшує їх заміну при пошкодженні."
 tank_interleaved_suspension:0 "Шахматне розташування котків"
 tank_interleaved_suspension_desc:0 "Розмахуючи котки у шаховому порядку, можна поставити більше котків при тій же довжині кузова, поліпшивши тим самим мобільність і забезпечуючи додатковий захист з боків."
 tank_light_one_man_tank_turret:0 "Одномісне знаряддя"
 tank_light_one_man_tank_turret_desc:0 "Маленька башта, яка їла в руках одного члена екіпажу, має завдання наведення і зарядення головного знаряддя, а також виявлення цілей і загроз."
 tank_light_two_man_tank_turret:0 "Двомістичне знаряддя"
 tank_light_two_man_tank_turret_desc:0 "Вартова башта, в якій можуть розміститися два члени екіпажу, що ділять між собою завдання по управленню знаряддям і спостереженням за зупинкою. Навіть така башта не дає ефективно розподіляти зусилля між членами екіпажу."
 tank_light_three_man_tank_turret:0 "Тримісний інструмент"
 tank_light_three_man_tank_turret_desc:0 "Вежі достатньо велика, щоб вміщати трьох членів екіпажу, які розділяють між собою завдання за зарядом і наведення головного знаряддя, а також спостереження за бойовою обстановкою."
 tank_light_fixed_superstructure_turret:1 "Фіксована структура"
 tank_light_fixed_superstructure_turret_desc:0 "Фіксована надбудова дуже обмежує кут повороту головного знаряддя, але дозволяє встановити знаряддя більш великого калібру на відносно невелика бойову машину, що робить цю машину ідеально придатної для Засідка."
 tank_medium_one_man_tank_turret:0 "Одномісне знаряддя"
 tank_medium_one_man_tank_turret_desc:0 "Маленька башта, яка їла в руках одного члена екіпажу, має завдання наведення і зарядення головного знаряддя, а також виявлення цілей і загроз."
 tank_medium_two_man_tank_turret:0 "Двомістичне знаряддя"
 tank_medium_two_man_tank_turret_desc:0 "Вартова башта, в якій можуть розміститися два члени екіпажу, що ділять між собою завдання по управленню знаряддям і спостереженням за зупинкою. Навіть така башта не дає ефективно розподіляти зусилля між членами екіпажу."
 tank_medium_three_man_tank_turret:0 "Тримісний інструмент"
 tank_medium_three_man_tank_turret_desc:0 "Вежі достатньо велика, щоб вміщати трьох членів екіпажу, які розділяють між собою завдання за зарядом і наведення головного знаряддя, а також спостереження за бойовою обстановкою."
 tank_medium_fixed_superstructure_turret:1 "Фіксована структура"
 tank_medium_fixed_superstructure_turret_desc:0 "Фіксована надбудова дуже обмежує кут повороту головного знаряддя, але дозволяє встановити знаряддя більш великого калібру на відносно невелика бойову машину, що робить цю машину ідеально придатної для Засідка."
 tank_heavy_two_man_tank_turret:0 "Двомістичне знаряддя"
 tank_heavy_two_man_tank_turret_desc:0 "Вартова башта, в якій можуть розміститися два члени екіпажу, що ділять між собою завдання по управленню знаряддям і спостереженням за зупинкою. Навіть така башта не дає ефективно розподіляти зусилля між членами екіпажу."
 tank_heavy_three_man_tank_turret:0 "Тримісний інструмент"
 tank_heavy_three_man_tank_turret_desc:0 "Вежі достатньо велика, щоб вміщати трьох членів екіпажу, які розділяють між собою завдання за зарядом і наведення головного знаряддя, а також спостереження за бойовою обстановкою."
 tank_heavy_fixed_superstructure_turret:1 "Фіксована структура"
 tank_heavy_fixed_superstructure_turret_desc:0 "Фіксована надбудова дуже обмежує кут повороту головного знаряддя, але дозволяє встановити знаряддя більш великого калібру на відносно невелика бойову машину, що робить цю машину ідеально придатної для Засідка."
 tank_super_heavy_four_man_tank_turret:0 "Чотиримісна зброя"
 tank_super_heavy_four_man_tank_turret_desc:0 "Велика башта з додатковим місцем для другого заряджаря, що обслуговує головне знаряддя."
 tank_super_heavy_three_man_tank_turret:0 "Тримісний інструмент"
 tank_super_heavy_three_man_tank_turret_desc:0 "Вежі достатньо велика, щоб вміщати трьох членів екіпажу, які розділяють між собою завдання за зарядом і наведення головного знаряддя, а також спостереження за бойовою обстановкою."
 tank_modern_tank_turret:0 "Сучасна зброя"
 tank_modern_tank_turret_desc:0 "Завдяки добре спроектованій вежі три члени екіпажу можуть ефективно керуватися головним знаряддям і стежити за бойовою обстановкою."
 tank_heavy_machine_gun:0 "Важкий кулемет"
 tank_heavy_machine_gun_desc:0 "Пулемет захищає від піхот, навіть якщо він не має великих витрат, навіть на спеціальні бронебійні патрони."
 flamethrower:0 "Вогнемет"
 flamethrower_desc:0 "Це дуже корисно для міських боїв і проти укріплень, але неефективно проти броні і вимагає спеціальної команди."
 tank_auto_cannon:0 "Автоматичне використання"
 tank_auto_cannon_desc:0 "Ця зброя, зроблена за зразком швидкісної зенітної гармати, здатна буквально знищувати непроникні цілі черги снарядів. Невелика калібр не зменшує бронебійності."
 tank_auto_cannon_2:0 "Покращена автоматична зброя"
 tank_auto_cannon_2_desc:0 "Ця зброя, зроблена за зразком швидкісної зенітної гармати, здатна буквально знищувати непроникні цілі черги снарядів. Невелика калібр не зменшує бронебійності."
 tank_anti_air_cannon:0 "Базовий зенітний інструмент"
 tank_anti_air_cannon_desc:0 "Швидка автоматична зброя для боротьби з літаками має обмежену можливість застосувати її до земних цілей для підтримки вогню."
 tank_anti_air_cannon_2:0 "Покращений зенітний інструмент"
 tank_anti_air_cannon_2_desc:0 "Швидка автоматична зброя для боротьби з літаками має обмежену можливість застосувати її до земних цілей для підтримки вогню."
 tank_anti_air_cannon_3:0 "Модернизоване зенітне знаряддя"
 tank_anti_air_cannon_3_desc:0 "Швидка автоматична зброя для боротьби з літаками має обмежену можливість застосувати її до земних цілей для підтримки вогню."
 tank_medium_howitzer:0 "Середня гаубиця"
 tank_medium_howitzer_desc:0 "У середньому гаубиця, яка призначена для встановлення в машину, — це непрямий вогонь з неприборканими намірами, але при необхідності гаубиця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_medium_howitzer_2:0 "Покращена середня гаубиця"
 tank_medium_howitzer_2_desc:0 "У середньому гаубиця, яка призначена для встановлення в машину, — це непрямий вогонь з неприборканими намірами, але при необхідності гаубиця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_medium_howitzer_3:0 "Модернізована середня гаубиця"
 tank_medium_howitzer_3_desc:0 "У середньому гаубиця, яка призначена для встановлення в машину, — це непрямий вогонь з неприборканими намірами, але при необхідності гаубиця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_heavy_howitzer:0 "Важка гаубиця"
 tank_heavy_howitzer_desc:0 "Важка водяна гаубиця, призначена для встановлення в машину, є основним місцем для непрямого вогню, але за потреби гаубця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_heavy_howitzer_2:0 "Покращена важка гаубиця"
 tank_heavy_howitzer_2_desc:0 "Важка водяна гаубиця, призначена для встановлення в машину, є основним місцем для непрямого вогню, але за потреби гаубця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_small_cannon:0 "Мала гармата"
 tank_small_cannon_desc:0 "Маленька й дешева гармата, яка може вести вогонь як шрапнелі, так і бронебійні снаряди, обмежують її ефективність."
 tank_small_cannon_2:0 "Покращена мала гармата"
 tank_small_cannon_2_desc:0 "Маленька й дешева гармата, яка може вести вогонь як шрапнелі, так і бронебійні снаряди, обмежують її ефективність."
 tank_medium_cannon:0 "Середня гармата"
 tank_medium_cannon_desc:0 "Орудіє спільного призначення, яке використовується для широкого кола завдань. Її не можна використовувати ні у боротьбі з піском, ні у битвах з танками, але вона робить так, щоб бойові машини стали гнучкішими."
 tank_medium_cannon_2:0 "Покращена середня гармата"
 tank_medium_cannon_2_desc:0 "Орудіє спільного призначення, яке використовується для широкого кола завдань. Її не можна використовувати ні у боротьбі з піском, ні у битвах з танками, але вона робить так, щоб бойові машини стали гнучкішими."
 tank_medium_cannon_3:0 "Модернізована середня гармата"
 tank_medium_cannon_3_desc:0 "Орудіє спільного призначення, яке використовується для широкого кола завдань. Її не можна використовувати ні у боротьбі з піском, ні у битвах з танками, але вона робить так, щоб бойові машини стали гнучкішими."
 tank_high_velocity_cannon:0 "Базова швидкісна гармата"
 tank_high_velocity_cannon_desc:0 "Пушка, спеціально розроблена для досягнення високої дульної швидкості. Використання спеціальних боєприпасів має чудові бронебійні характеристики, але вони можуть бути ефективними у протибронованих цілях."
 tank_high_velocity_cannon_2:0 "Покращена швидкострільна гармата"
 tank_high_velocity_cannon_2_desc:0 "Пушка, спеціально розроблена для досягнення високої дульної швидкості. Використання спеціальних боєприпасів має чудові бронебійні характеристики, але вони можуть бути ефективними у протибронованих цілях."
 tank_high_velocity_cannon_3:0 "Модернізована швидкісна гармата"
 tank_high_velocity_cannon_3_desc:0 "Пушка, спеціально розроблена для досягнення високої дульної швидкості. Використання спеціальних боєприпасів має чудові бронебійні характеристики, але вони можуть бути ефективними у протибронованих цілях."
 tank_heavy_cannon:0 "Основна важка гармата"
 tank_heavy_cannon_desc:0 "Орудіє, що стріляє великимикаліберними снарядами. Вони володіють виключною бронебойністю і ефективною проти слабобронованих цілей; недоліки — великий розмір і висока вартість, неможливість встановити на більшість видів техніки, за винятком того, що розроблена спеціально під це знаряддя."
 tank_heavy_cannon_2:0 "Покращена важка гармата"
 tank_heavy_cannon_2_desc:0 "Орудіє, що стріляє великимикаліберними снарядами. Вони володіють виключною бронебойністю і ефективною проти слабобронованих цілей; недоліки — великий розмір і висока вартість, неможливість встановити на більшість видів техніки, за винятком того, що розроблена спеціально під це знаряддя."
 tank_heavy_cannon_3:1 "Удосконалене важке знаряддя"
 tank_heavy_cannon_3_desc:0 "Орудіє, що стріляє великимикаліберними снарядами. Вони володіють виключною бронебойністю і ефективною проти слабобронованих цілей; недоліки — великий розмір і висока вартість, неможливість встановити на більшість видів техніки, за винятком того, що розроблена спеціально під це знаряддя."
 tank_super_heavy_cannon:0 "Сучасна гармата"
 tank_super_heavy_cannon_desc:0 "Абсурдно велике знаряддя з незрівнянною ефективністю, здатне знищити майже все, а що не в змозі, то все одно не буде стріляти по танку."
 tank_close_support_gun:0 "Система безпосередньої підтримки"
 tank_close_support_gun_desc:0 "Невелика зброя, розроблена для стрільби фугасовими снарядами по польовому зміцненню ворога і підтримки наступаючої піхоти. бронетехніку можна атакувати, але короткий стовбур і обмежений боєзапас роблять його непридатним для боротьби з потужними танками."
 tank_radio_1:0 "Базова радіостанція"
 tank_radio_1_desc:0 "Базова двонаправлена радіостанція дозволяє танкам координувати свої тактичні маневри у малому масштабі."
 tank_radio_2:0 "Покращена радіостанція"
 tank_radio_2_desc:0 "Покращена радіостанція дозволяє командирам ефективно керувати більшими танковими формуваннями та організовувати потужні маневри."
 tank_radio_3:0 "Модернізована радіостанція"
 tank_radio_3_desc:0 "Ця радіостанція є всиленою передателем і поліпшеною технікою, яка дозволяє підтримувати зв’язок на відстані десятки кілометрів, незважаючи на ворожі глушники."
 amphibious_drive:0 "Пристрій для плавання"
 amphibious_drive_desc:0 "Набір приладів для плавання і невеликий гвинт дозволяють цьому тану рухатися по воді, висаджуючись з корабля на берег або перетинаючи річку."
 secondary_turret_hmg:1 "Базовий важкий кулемет"
 secondary_turret_hmg_desc:0 "Важкий кулемет - допоміжний засіб для бойової машини, розміщення башти обмежує сектор обстрілу, знижуючи ефективність, але зате дозволяє танку атакувати більше цілей, що особливо корисно при вступі."
 secondary_turret_hmg_2:1 "Покращений важкий кулемет"
 secondary_turret_hmg_2_desc:0 "Важкий кулемет - допоміжний засіб для бойової машини, розміщення башти обмежує сектор обстрілу, знижуючи ефективність, але зате дозволяє танку атакувати більше цілей, що особливо корисно при вступі."
 secondary_turret_hmg_3:1 "Удосконалений важкий кулемет"
 secondary_turret_hmg_3_desc:0 "Важкий кулемет - допоміжний засіб для бойової машини, розміщення башти обмежує сектор обстрілу, знижуючи ефективність, але зате дозволяє танку атакувати більше цілей, що особливо корисно при вступі."
 secondary_turret_hmg_4:1 "Сучасний важкий кулемет"
 secondary_turret_hmg_4_desc:0 "Важкий кулемет - допоміжний засіб для бойової машини, розміщення башти обмежує сектор обстрілу, знижуючи ефективність, але зате дозволяє танку атакувати більше цілей, що особливо корисно при вступі."
 secondary_turret_small_cannon:1 "Мала гармата"
 secondary_turret_small_cannon_desc:0 "Мала пушка - кал собаки, не ставте."
 secondary_turret_close_support_gun:1 "Система безпосередньої підтримки"
 secondary_turret_close_support_gun_desc:0 "Будова підтримки — допоміжна машина, а розведення башти обмежує кількість бомб, знижуючи ефективність, але дозволяє танку атакувати більше цілей, що особливо корисне при вступі."
 sloped_armor:0 "Прихильна броня"
 sloped_armor_desc:0 "Броня, розміщена під кутом до траєкторії снаряда, володіє набагато більшою товщиною на зрізі, ніж така ж броня, розміщена вертикально, ще ця броня підвищує шанс відскока снаряда. А втім, така броня вимагає змін у конструкції танку, що ускладнює збирання."
 stabilizer:0 "Рання стабілізація"
 stabilizer_desc:0 "Механічний пристрій, призначений для збереження наводки гармат під час руху танку. Хоча він не настільки досконалий, щоб підтримувати точну стрілянину на ходу, стабілізатор дозволяє стрілку вести прицільну стрілку при коротких зупинках без потреби наводитися на ціль заново."
 stabilizer_2:0 "Модернізований стабілізатор"
 stabilizer_2_desc:0 "Механічний пристрій, призначений для збереження наводки гармат під час руху танку. Хоча він не настільки досконалий, щоб підтримувати точну стрілянину на ходу, стабілізатор дозволяє стрілку вести прицільну стрілку при коротких зупинках без потреби наводитися на ціль заново."
 smoke_launchers:0 "Димові установки"
 smoke_launchers_desc:0 "Батарея піротехнічних пристроїв, які можна включати зсередини, щоб створювати зовні танку густу димову завісу, дуже корисна у обороні або під час потрапляння в засідку."
 extra_ammo_storage:0 "Додаткове сховище зброї"
 extra_ammo_storage_desc:0 "Завдяки додатковому боєзапасу танку можна довше вести бій без потреби, але якщо в бою танку проб’ють броню, то наслідки можуть бути найспустошливішими."
 wet_ammo_storage:0 "Вологе зберігання боєприпасів"
 wet_ammo_storage_desc:0 "Кожухи з водою, що захищають стійкі з боєприпасами, значно зменшують ризик підривання боєзапасу під час потрапляння в танк, а екіпаж оцінить таку турботу."
 armor_tech_1_tt:0 "Відкриває значення до 5 для покращення броні."
 armor_tech_2_tt:0 "Відкриває значення до 10 для покращення броні."
 armor_tech_3_tt:0 "Відкриває значення до 15 для покращення броні."
 armor_tech_4_tt:0 "Відкриває значення до 20 для покращення броні."
 engine_tech_1_tt:0 "Відкриває значення до 5 для покращення двигуна."
