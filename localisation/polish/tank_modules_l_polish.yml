 ### EQUIPMENT MODULES ###
 expanded_fuel_tank:0 "Додаткові паливні баки"
 tank_gasoline_engine:0 "Бензиновий двигун"
 tank_gasoline_engine_desc:0 "Двигун, що працює на бензині, буде швидше при рівному обсязі, але сам бензин при цьому сильніше схильний до займання."
 tank_diesel_engine:0 "Дизельний двигун"
 tank_diesel_engine_desc:0 "Дизельний двигун надійніший за бензиновий, але при однаковому обсязі з ним техніка розвиває меншу швидкість."
 tank_petrol_electric_engine:0 "Бензиново-електричний двигун"
 tank_petrol_electric_engine_desc:0 "Комбінація бензинового двигуна та електродвигуна, що отримує від нього енергію. Такий мотор складний, дорогий і ненадійний, але перевершує будь-які інші за продуктивністю в тактичних маневрах."
 tank_gas_turbine_engine:0 "Газова турбіна"
 tank_gas_turbine_engine_desc:0 "Турбіна, розроблена на основі реактивного двигуна. Висока витрата палива, але при цьому максимальна швидкість при цьому обсязі."
 tank_riveted_armor:0 "Клепана броня"
 tank_riveted_armor_desc:0 "Бронепластини, прикручені до рами та утримувані заклепками. Перевірена часом і відносно дешева технологія, але самі клепані краї броні — вразливі місця, а потрапляння в заклепки може поранити екіпаж."
 tank_cast_armor:0 "Лита броня"
 tank_cast_armor_desc:0 "Все шасі, включаючи броню, відливається як єдине ціле. Дорогий і довгий процес, що дозволяє створити набагато товщу броню, в якій менше вразливих місць."
 tank_welded_armor:0 "Зварна броня"
 tank_welded_armor_desc:0 "Бронепластини приварюються до шасі. Цей процес швидше лиття і при цьому забезпечує хороший захист."
 tank_welded_armor_2:0 "Сварна броня 2"
 tank_welded_armor_2_desc:0 "Бронепластини приварюють до шасі, що забезпечує добрий захист, швидше лиття."
 tank_torsion_bar_suspension:0 "Торсіонна підвіска"
 tank_torsion_bar_suspension_desc:0 "Щодо надійної системи підвіски з металевих балок, прикріплених до шасі бойової машини. Згладжує нерівності краще, ніж підвіски інших типів."
 tank_christie_suspension:0 "Підвіска Крісті"
 tank_christie_suspension_desc:0 "Ця підвіска, розроблена американським винахідником, дозволяє розвивати винятково високу швидкість."
 tank_bogie_suspension:0 "Візкова підвіска"
 tank_bogie_suspension_desc:0 "Простий і відносно дешевий тип підвіски, в якому катки закріплені окремо, що полегшує їх заміну при пошкодженні."
 tank_interleaved_suspension:0 "Шахове розміщення катків"
 tank_interleaved_suspension_desc:0 "Розміщуючи катки у шаховому порядку, можна поставити більше катків при тій же довжині кузова, поліпшивши тим самим мобільність та забезпечивши додатковий захист з боків."
 tank_light_one_man_tank_turret:0 "Одномісна башта"
 tank_light_one_man_tank_turret_desc:0 "Маленька башта, що ледве вміщає одного члена екіпажу, в завдання якого входять наведення та заряджання головної зброї, а також виявлення цілей та погроз."
 tank_light_two_man_tank_turret:0 "Двомісна башта"
 tank_light_two_man_tank_turret_desc:0 "Башта, в якій можуть розміститися два члени екіпажу, що ділять між собою завдання з управління зброєю та спостереження за обстановкою. Навіть така башта не дає ефективно розподілити зусилля між членами екіпажу."
 tank_light_three_man_tank_turret:0 "Тримісна башта"
 tank_light_three_man_tank_turret_desc:0 "Башта, досить велика, щоб вмістити трьох членів екіпажу, які розділять між собою завдання із заряджання та наведення головної зброї, а також спостереження за бойовою обстановкою."
 tank_light_fixed_superstructure_turret:1 "Фіксована структура"
 tank_light_fixed_superstructure_turret_desc:0 "Фіксована надбудова сильно обмежує кут повороту головної зброї, але дозволяє встановити знаряддя більшого калібру на відносно невелику бойову машину, що робить цю машину ідеально придатною для засідок."
 tank_medium_one_man_tank_turret:0 "Одномісна башта"
 tank_medium_one_man_tank_turret_desc:0 "Маленька башта, яка їла в руках одного члена екіпажу, має завдання наведення і зарядення головного знаряддя, а також виявлення цілей і загроз."
 tank_medium_two_man_tank_turret:0 "Двомісна башта"
 tank_medium_two_man_tank_turret_desc:0 "Вартова башта, в якій можуть розміститися два члени екіпажу, що ділять між собою завдання по управленню знаряддям і спостереженням за зупинкою. Навіть така башта не дає ефективно розподіляти зусилля між членами екіпажу."
 tank_medium_three_man_tank_turret:0 "Тримісна башта"
 tank_medium_three_man_tank_turret_desc:0 "Вежі достатньо велика, щоб вміщати трьох членів екіпажу, які розділяють між собою завдання за зарядом і наведення головного знаряддя, а також спостереження за бойовою обстановкою."
 tank_medium_fixed_superstructure_turret:1 "Фіксована структура"
 tank_medium_fixed_superstructure_turret_desc:0 "Фіксована надбудова дуже обмежує кут повороту головного знаряддя, але дозволяє встановити знаряддя більш великого калібру на відносно невелика бойову машину, що робить цю машину ідеально придатної для Засідка."
 tank_heavy_two_man_tank_turret:0 "Двомісна башта"
 tank_heavy_two_man_tank_turret_desc:0 "Вартова башта, в якій можуть розміститися два члени екіпажу, що ділять між собою завдання по управленню знаряддям і спостереженням за зупинкою. Навіть така башта не дає ефективно розподіляти зусилля між членами екіпажу."
 tank_heavy_three_man_tank_turret:0 "Тримісна башта"
 tank_heavy_three_man_tank_turret_desc:0 "Вежі достатньо велика, щоб вміщати трьох членів екіпажу, які розділяють між собою завдання за зарядом і наведення головного знаряддя, а також спостереження за бойовою обстановкою."
 tank_heavy_fixed_superstructure_turret:1 "Фіксована структура"
 tank_heavy_fixed_superstructure_turret_desc:0 "Фіксована надбудова дуже обмежує кут повороту головного знаряддя, але дозволяє встановити знаряддя більш великого калібру на відносно невелика бойову машину, що робить цю машину ідеально придатної для Засідка."
 tank_super_heavy_four_man_tank_turret:0 "Чотиримісна башта"
 tank_super_heavy_four_man_tank_turret_desc:0 "Величезна башта з додатковим місцем для другого заряджає, що обслуговує головну зброю."
 tank_super_heavy_three_man_tank_turret:0 "Тримісна башта"
 tank_super_heavy_three_man_tank_turret_desc:0 "Вежі достатньо велика, щоб вміщати трьох членів екіпажу, які розділяють між собою завдання за зарядом і наведення головного знаряддя, а також спостереження за бойовою обстановкою."
 tank_modern_tank_turret:0 "Сучасна башта"
 tank_modern_tank_turret_desc:0 "Вдало спроєктована башта дозволяє трьом членам екіпажу ефективно управлятися з головною зброєю та стежити за бойовою обстановкою."
 tank_heavy_machine_gun:0 "Важкий кулемет"
 tank_heavy_machine_gun_desc:0 "Кулемет забезпечує гарний захист від піхоти при невеликих витратах. Навіть із спеціальними бронебійними патронами він слабоефективний проти бронетехніки."
 flamethrower:0 "Вогнемет"
 flamethrower_desc:0 "Пристрій для виплескування струменя рідини, що горить. Дуже корисно в міських боях і проти укріплень, але неефективно проти броні і вимагає окремої спеціально навченої команди."
 tank_auto_cannon:0 "Автоматична гармата"
 tank_auto_cannon_desc:0 "Це знаряддя, зроблене на зразок скорострільної зенітної гармати, здатне буквально знищувати слабоброньовані цілі снарядів. Невеликий калібр не знижує бронебійність."
 tank_auto_cannon_2:0 "Поліпшена автоматична гармата"
 tank_auto_cannon_2_desc:0 "Ця зброя, зроблена за зразком швидкісної зенітної гармати, здатна буквально знищувати непроникні цілі черги снарядів. Невелика калібр не зменшує бронебійності."
 tank_anti_air_cannon:0 "Базова зенітна гармата"
 tank_anti_air_cannon_desc:0 "Скорострільна автоматична зброя для боротьби з літаками. Має обмежену можливість застосування до наземних цілей для підтримки вогнем."
 tank_anti_air_cannon_2:0 "Поліпшена зенітна гармата"
 tank_anti_air_cannon_2_desc:0 "Швидка автоматична зброя для боротьби з літаками має обмежену можливість застосувати її до земних цілей для підтримки вогню."
 tank_anti_air_cannon_3:0 "Удосконалена зенітна гармата"
 tank_anti_air_cannon_3_desc:0 "Швидка автоматична зброя для боротьби з літаками має обмежену можливість застосувати її до земних цілей для підтримки вогню."
 tank_medium_howitzer:0 "Середня гаубиця"
 tank_medium_howitzer_desc:0 "Середня польова гаубиця, призначена для установки в машину. Її основне призначення — непрямий вогонь по слабоброньованим цілям, але при необхідності гаубиця може застосовуватися і для стрільби прямим наведенням."
 tank_medium_howitzer_2:0 "Поліпшена середня гаубиця"
 tank_medium_howitzer_2_desc:0 "У середньому гаубиця, яка призначена для встановлення в машину, — це непрямий вогонь з неприборканими намірами, але при необхідності гаубиця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_medium_howitzer_3:0 "Модернізована середня гаубиця"
 tank_medium_howitzer_3_desc:0 "У середньому гаубиця, яка призначена для встановлення в машину, — це непрямий вогонь з неприборканими намірами, але при необхідності гаубиця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_heavy_howitzer:0 "Важка гаубиця"
 tank_heavy_howitzer_desc:0 "Важка польова гаубиця, призначена для установки в машину. Її основне призначення — непрямий вогонь по слабоброньованим цілям, але при необхідності гаубиця може застосовуватися і для стрільби прямим наведенням."
 tank_heavy_howitzer_2:0 "Покращена важка гаубиця"
 tank_heavy_howitzer_2_desc:0 "Важка водяна гаубиця, призначена для встановлення в машину, є основним місцем для непрямого вогню, але за потреби гаубця може використовуватись і для стрільби прямою наводкою. Зменшується кількість бронебойних снарядів, і їх не можна використовувати для боротьби з танками."
 tank_small_cannon:0 "Мала гармата"
 tank_small_cannon_desc:0 "Невелика та дешева гармата, здатна вести вогонь як шрапнельними, так і бронебійними снарядами. Малий калібр обмежує її ефективність."
 tank_small_cannon_2:0 "Поліпшена мала гармата"
 tank_small_cannon_2_desc:0 "Маленька й дешева гармата, яка може вести вогонь як шрапнелі, так і бронебійні снаряди, обмежують її ефективність."
 tank_medium_cannon:0 "Середня гармата"
 tank_medium_cannon_desc:0 "Зброя загального призначення, що використовується для широкого кола завдань. Не досягає виняткової ефективності ні в боротьбі з піхотою, ні в битвах з танками, але забезпечує бойовій машині більшу гнучкість застосування."
 tank_medium_cannon_2:0 "Поліпшена середня гармата"
 tank_medium_cannon_2_desc:0 "Орудіє спільного призначення, яке використовується для широкого кола завдань. Її не можна використовувати ні у боротьбі з піском, ні у битвах з танками, але вона робить так, щоб бойові машини стали гнучкішими."
 tank_medium_cannon_3:0 "Модернізована середня гармата"
 tank_medium_cannon_3_desc:0 "Орудіє спільного призначення, яке використовується для широкого кола завдань. Її не можна використовувати ні у боротьбі з піском, ні у битвах з танками, але вона робить так, щоб бойові машини стали гнучкішими."
 tank_high_velocity_cannon:0 "Базова високошвидкісна гармата"
 tank_high_velocity_cannon_desc:0 "Гармата, спеціально спроєктована для досягнення високої дульної швидкості. При використанні спеціальних боєприпасів має відмінні бронебійні характеристики, але при цьому страждає ефективність проти слабоброньованих цілей."
 tank_high_velocity_cannon_2:0 "Поліпшена високошвидкісна гармата"
 tank_high_velocity_cannon_2_desc:0 "Пушка, спеціально розроблена для досягнення високої дульної швидкості. Використання спеціальних боєприпасів має чудові бронебійні характеристики, але вони можуть бути ефективними у протибронованих цілях."
 tank_high_velocity_cannon_3:0 "Удосконалена високошвидкісна гармата"
 tank_high_velocity_cannon_3_desc:0 "Пушка, спеціально розроблена для досягнення високої дульної швидкості. Використання спеціальних боєприпасів має чудові бронебійні характеристики, але вони можуть бути ефективними у протибронованих цілях."
 tank_heavy_cannon:0 "Базова важка гармата"
 tank_heavy_cannon_desc:0 "Зброя, що стріляє великокаліберними снарядами. Має виняткову бронебійність і високо ефективно проти слабоброньованих цілей; недоліки — великий розмір і висока вартість, неможливість встановити на більшість видів техніки, за винятком тієї, що розроблена спеціально під цю зброю."
 tank_heavy_cannon_2:0 "Поліпшена важка гармата"
 tank_heavy_cannon_2_desc:0 "Орудіє, що стріляє великимикаліберними снарядами. Вони володіють виключною бронебойністю і ефективною проти слабобронованих цілей; недоліки — великий розмір і висока вартість, неможливість встановити на більшість видів техніки, за винятком того, що розроблена спеціально під це знаряддя."
 tank_heavy_cannon_3:1 "Удосконалена важка гармата"
 tank_heavy_cannon_3_desc:0 "Орудіє, що стріляє великимикаліберними снарядами. Вони володіють виключною бронебойністю і ефективною проти слабобронованих цілей; недоліки — великий розмір і висока вартість, неможливість встановити на більшість видів техніки, за винятком того, що розроблена спеціально під це знаряддя."
 tank_super_heavy_cannon:0 "Сучасна гармата"
 tank_super_heavy_cannon_desc:0 "Абсурдно велика зброя з незрівнянною ефективністю. Здатно знищити майже все, а що не здатне, то все одно не стрілятиме по танку."
 tank_close_support_gun:0 "Гармата безпосередньої підтримки"
 tank_close_support_gun_desc:0 "Невелика зброя, спроєктована для стрільби фугасними снарядами по польових зміцненнях противника і підтримки атакуючої піхоти. Здатно атакувати бронетехніку, але короткий ствол і обмежений боєзапас роблять його непридатним для боротьби з потужними танками."
 tank_radio_1:0 "Базове радіо"
 tank_radio_1_desc:0 "Базова двонаправлена радіостанція дозволяє танкам координувати свої тактичні маневри в малому масштабі."
 tank_radio_2:0 "Поліпшене радіо"
 tank_radio_2_desc:0 "Поліпшена радіостанція дозволяє командирам ефективно управляти більшими танковими формуваннями та організовувати великомасштабні маневри."
 tank_radio_3:0 "Поліпшене радіо"
 tank_radio_3_desc:0 "Ця радіостанція відрізняється посиленим передавачем та поліпшеним прийомом; вона дозволяє тримати зв'язок на відстані в десятки кілометрів, незважаючи на ворожі глушилки."
 amphibious_drive:0 "Пристрій для плавання"
 amphibious_drive_desc:0 "Набір пристроїв для плавання та невеликий гвинт дозволяють цьому танку рухатися по воді, висаджуючись з корабля на берег або перетинаючи річку."
 secondary_turret_hmg:1 "Базовий важкий кулемет"
 secondary_turret_hmg_desc:0 "Важкий кулемет — допоміжна зброя бойової машини. Розміщення башті обмежує сектор обстрілу, знижуючи ефективність, але дозволяє танку атакувати більше цілей, що особливо корисно при наступі."
 secondary_turret_hmg_2:1 "Покращений важкий кулемет"
 secondary_turret_hmg_2_desc:0 "Важкий кулемет - допоміжний засіб для бойової машини, розміщення башти обмежує сектор обстрілу, знижуючи ефективність, але зате дозволяє танку атакувати більше цілей, що особливо корисно при вступі."
 secondary_turret_hmg_3:1 "Удосконалений важкий кулемет"
 secondary_turret_hmg_3_desc:0 "Важкий кулемет - допоміжний засіб для бойової машини, розміщення башти обмежує сектор обстрілу, знижуючи ефективність, але зате дозволяє танку атакувати більше цілей, що особливо корисно при вступі."
 secondary_turret_hmg_4:1 "Сучасний важкий кулемет"
 secondary_turret_hmg_4_desc:0 "Важкий кулемет - допоміжний засіб для бойової машини, розміщення башти обмежує сектор обстрілу, знижуючи ефективність, але зате дозволяє танку атакувати більше цілей, що особливо корисно при вступі."
 secondary_turret_small_cannon:1 "Мала гармата"
 secondary_turret_small_cannon_desc:0 "Мала пушка - кал собаки, не ставте."
 secondary_turret_close_support_gun:1 "Гармата безпосередньої підтримки"
 secondary_turret_close_support_gun_desc:0 "Зброя підтримки — допоміжна зброя бойової машини. Розміщення башті обмежує сектор обстрілу, знижуючи ефективність, зате дозволяє танку атакувати більше цілей, що особливо корисно при наступі."
 sloped_armor:0 "Похила броня"
 sloped_armor_desc:0 "Броня, розміщена під кутом до траєкторії снаряда, має набагато більшу товщину на зрізі, ніж така ж броня, розміщена вертикально. Ще ця броня підвищує шанс відскоку снаряда. Проте застосування такої броні вимагає змін у конструкції танка, що ускладнює збирання."
 stabilizer:0 "Рання стабілізація"
 stabilizer_desc:0 "Механічний пристрій, призначений для збереження наведення зброї при русі танка. Хоч воно не настільки досконале, щоби забезпечувати точну стрільбу на ходу, стабілізатор дозволяє стрільцеві вести прицільну стрільбу при коротких зупинках без необхідності наводитися на ціль заново."
 stabilizer_2:0 "Модернізований стабілізатор"
 stabilizer_2_desc:0 "Механічний пристрій, призначений для збереження наводки гармат під час руху танку. Хоча він не настільки досконалий, щоб підтримувати точну стрілянину на ходу, стабілізатор дозволяє стрілку вести прицільну стрілку при коротких зупинках без потреби наводитися на ціль заново."
 smoke_launchers:0 "Димогенератори"
 smoke_launchers_desc:0 "Батарея піротехнічних пристроїв, які можна включати зсередини, щоби створювати зовні танка густу димову завісу. Дуже корисна в обороні або при потрапленні в засідку."
 extra_ammo_storage:0 "Додатковий боєкомплект"
 extra_ammo_storage_desc:0 "Додатковий боєзапас дозволяє танку довше вести бій без необхідності заповнювати запаси — але, якщо в бою біля танка проб'ють броню, результати можуть бути найгіршими. Особливо це варто враховувати при атаці."
 wet_ammo_storage:0 "Мокра боєукладка"
 wet_ammo_storage_desc:0 "Кожухи з водою, що вкривають стійки з боєприпасами, значно зменшують ризик підриву боєзапасу при влучанні в танк. Екіпаж оцінить таку турботу."
 armor_tech_1_tt:0 "Відкриває значення до 5 для покращення броні."
 armor_tech_2_tt:0 "Відкриває значення до 10 для покращення броні."
 armor_tech_3_tt:0 "Відкриває значення до 15 для покращення броні."
 armor_tech_4_tt:0 "Відкриває значення до 20 для покращення броні."
 engine_tech_1_tt:0 "Відкриває значення до 5 для покращення двигуна."
 engine_tech_2_tt:0 "Відкриває значення до 10 для покращення двигуна."
 engine_tech_3_tt:0 "Відкриває значення до 15 для покращення двигуна."
 engine_tech_4_tt:0 "Відкриває значення до 20 для покращення двигуна."
 light_tank_chassis:0 "Легкий танк"
 medium_tank_chassis:0 "Середній танк"
 heavy_tank_chassis:0 "Важкий танк"
 light_tank_chassis_0:0 "Шассі міжвоєнного легкого танку"
 light_tank_chassis_desc:0 "Невелике та компактне шасі, що ідеально підходить для легкої та дешевої бойової машини, що виконує такі завдання, як розвідка та підтримка вогнем. Через обмежену вантажопідйомність непридатне для встановлення важкої броні або великих знарядь."
 light_tank_chassis_1:0 "Шассі базу легкого танку"
 basic_light_tank_chassis:0 "Шассі базу легкого танку"
 basic_light_tank_chassis_short:0 "Легкий танк 1934 р."
 basic_light_tank_chassis_desc:0 "Через технологічний розвиток проєкти повоєнних років фактично застаріли. Сучасна війна вимагає нових проєктів бойових машин, де використовуються останні досягнення в металургії та оформленні."
 light_tank_chassis_2:0 "Шассі покращеного легкого танку"
 improved_light_tank_chassis:0 "Шассі покращеного легкого танку"
 improved_light_tank_chassis_short:0 "Легкий танк 1936 р."
 improved_light_tank_chassis_desc:0 "Це шасі — наступний цикл розвитку, заснований на попередніх моделях легких танків. Відрізняється підвищеною надійністю і ремонтопридатністю."
 light_tank_chassis_3:0 "Шассі модернізованого легкого танку"
 advanced_light_tank_chassis:0 "Шассі модернізованого легкого танку"
 advanced_light_tank_chassis_short:0 "Легкий танк 1941 р."
 advanced_light_tank_chassis_desc:0 "Центральну роль у битвах все частіше відіграють середні танки, легким же танкам в основному відводиться роль підтримки. Нам потрібне нове шасі, яке враховуватиме ці ролі."
 light_tank_amphibious_chassis_0:0 "Шассі міжвоєнного легкого танку (поплавного)"
 light_tank_amphibious_chassis_1:0 "Шассі базованого легкого танку (поплавця)"
 light_tank_amphibious_chassis_2:0 "Шассі покращеного легкого танку (поплаваючого)"
 light_tank_amphibious_chassis_3:0 "Шассі модернізованого легкого танку (поплаваючого)"
 light_tank_amphibious_equipment_0:0 "Міжвоєнний легкий танк-амфібія"
 light_tank_artillery_chassis_0:0 "Межвонна легка САУ"
 light_tank_artillery_chassis:0 "Легка САУ"
 light_tank_artillery_chassis_desc:0 "Невелика і компактна бойова машина. Основна роль — вогнева підтримка піхоти, що настає."
