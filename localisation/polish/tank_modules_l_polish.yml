 modern_tank_aa_chassis:0 "Сучасна ЗСУ"
 super_heavy_tank_chassis:0 "Шассі надтяжого танку"
 super_heavy_tank_chassis_desc:0 "Гігантська бойова машина, здатна нести найважчу броню і найбільше калібрування, але через це повільна і ненадійна."
 super_heavy_tank_chassis_1:0 "Шассі надтяжого танку"
 super_heavy_tank_artillery_chassis_desc:0 "Гігантська бойова машина, здатна нести найтяжче броню і найбільш потужне знаряддя, але через це повільна і ненадійна."
