 heavy_tank_amphibious_chassis_0:0 "Шассі міжвоєнного важкого танку (поплавного)"
 heavy_tank_amphibious_chassis_1:0 "Шассі базового важкого танку (поплаваючого)"
 heavy_tank_amphibious_chassis_2:0 "Шассі удосконалений важкий танк (поплаваючий)"
 heavy_tank_amphibious_chassis_3:0 "Шассі модернізованого важкого танку (поплаваючого)"
 heavy_tank_amphibious_equipment_0:0 "Місткий плавний танк"
 basic_heavy_tank_chassis:0 "Шассі базового важкого танку"
 basic_heavy_tank_chassis_desc:0 "Детальний аналіз Великої війни виявив потребу в важких бойових машинах, які прориваються через ворожі траншеї і прокладають шлях піхоті. Така машина повинна бути поганою і добре озброєна, але не зобов'язана бути дуже швидкою."
 basic_heavy_tank_chassis_short:0 "Важка модель 1934 р."
 improved_heavy_tank_chassis:0 "Шассі удосконаленого важкого танку"
 improved_heavy_tank_chassis_desc:0 "Хоча природа воєнних дій змінилася, на полі бою все ще потрібно тяжкої бойової машини з товстою бронею для прориву ворожого фронту або створення твердинь проти ворожих атак."
 improved_heavy_tank_chassis_short:1 "Важка модель 1940 р."
 advanced_heavy_tank_chassis:0 "Шассі модернізованого важкого танку"
 advanced_heavy_tank_chassis_desc:0 "З огляду на сучасний розвиток броні та вогняної могутності, сучасний танк, щоб бути ефективним, повинен мати товсту броню та велику зброю."
 advanced_heavy_tank_chassis_short:0 "Важка модель 1943 р."
 heavy_tank_chassis_desc:0 "Великий шасі, на який можна встановити важкий інструмент, товсту броню або й те й інше."
 heavy_tank_artillery_chassis:0 "Важка САУ"
 heavy_tank_artillery_chassis_0:0 "Нижня важка САУ"
 heavy_tank_artillery_chassis_desc:0 "Основною причиною бойових дій є вогонь, який підтримує наступаючу піхоту."
 heavy_tank_artillery_chassis_1:0 "Основна важка САУ"
 heavy_tank_artillery_chassis_2:0 "Покращена важка САУ"
 heavy_tank_artillery_chassis_3:0 "Модернізована важка САУ"
