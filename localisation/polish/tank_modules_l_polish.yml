 amphibious_tank_chassis:0 "Шассі танка-амфібії"
 amphibious_tank_chassis_desc:0 "Невелике шассі для танку-амфібії, тому що необхідно забезпечити плавучість має строгі обмеження на розмір зброї і товщину броні."
 amphibious_tank_chassis_1:0 "Шассі танка-амфібії"
 gwtank_chassis:0 "Розробка міжвоєнних танків"
 gwtank_chassis_desc:0 "У Великій війні танк показався потужною зброєю, і в перехідну епоху його розробка сповільнилася, але танки, безсумнівно, відіграватимуть важливу роль у подальших конфліктах."
 armor_tech_1:0 "Основний захист"
 armor_tech_1_desc:0 "У Великій війні танки мусили захищатися тільки від пострілів піхотної зброї, і тому вони могли поводитися відносно тонкої броні. Нове покоління протитанкової зброї зробило поле бою набагато небезпечнішим для бронетехніки, і тепер вона потребує сильнішого захисту."
 armor_tech_2:0 "Покращений бронячий захист"
 armor_tech_2_desc:0 "Тепер, коли по цілому світі дедалі сильніше й серйозніше протитанкове озброєння впроваджується в експлуатацію, наступне покоління танків потребуватиме ще більшої броні."
 armor_tech_3:0 "Модернізований захист"
 armor_tech_3_desc:0 "Тепер, коли, здається, буде досягнуто межі розвитку протитанкових знарядь, нове покоління танків нестиме більш ефективне озброєння, яке зможе пробити будь - яку броню з великої дистанції."
 armor_tech_4:0 "Сучасний бронійний захист"
 armor_tech_4_desc:0 "Небезпека для танків на полі бою збільшувалась: від ворожих танків, протитанкових знарядь, спеціальної протитанкової техніки до сучасної піхотної зброї, яка стріляє кумулятивними зарядами, що здатні пробити навіть Ми повинні розробляти нові засоби захисту, щоб захистити танки від нових загроз."
 engine_tech_1:0 "Основний двигун"
 engine_tech_1_desc:0 "Танки Великої війни були важкими і неповоротними, але сучасна танка, щоб здобути перемогу, потребувала швидкості й мобільності."
 engine_tech_2:0 "Покращений двигун"
 engine_tech_2_desc:0 "Тепер, коли знаряддя більші, а броня важче, нове покоління танків, щоб зберегти мобільність, потребує потужнішого двигуна."
 engine_tech_3:0 "Модернізований двигун"
 engine_tech_3_desc:0 "Механізована війна вимагає швидкого прийняття рішень і швидкого перекидання військ і припасів. Якщо наші танки будуть нести достатньо сучасних озброєнь і броню, щоб вижити на полі бою, їм знадобляться потужні двигуни, щоб не відстати від мотопіхоти."
 engine_tech_4:0 "Сучасний двигун"
 engine_tech_4_desc:0 "Багато нових танків, спрямованих на сучасну війну, значно збільшують їхню вагу, щоб пересувати важкі бойові машини, потрібні потужні двигуни."
 DESIGNER_CHASSIS_BASE:0 "Шассі: "
 DESIGNER_FROM_MODULES:0 "Модулі: "
 DESIGNER_UNSAVED_CHANGES:0 "Незбережені зміни: "
 tank_rocket_launcher:0 "Реактивне встановлення"
 tank_rocket_launcher_desc:0 "Багатостульну пускову установку для стрільби некерованими ракетними снарядами. Велика площа накритті робить її ефективною при роботі за небронованими цілями, але вона неефективна навіть під час прямого потрапляння."
 tank_rocket_launcher_2:0 "Покращена реактивна установка"
 tank_rocket_launcher_2_desc:0 "Цей пристрій дуже точний, але його головною перевагою є збільшена кількість ракет."
 tank_wheeled_suspension:0 "Колісний хід"
 tank_wheeled_suspension_desc:0 "Ця ходьба, зроблена на основі шасі вантажівки, дуже обмежена в вантажопідйомності і дуже мало придатна для їзди по пересеченій місцевості, зате дуже дешева у виробництві."
 tank_half_track_suspension:0 "Послуга"
 tank_half_track_suspension_desc:0 "Задні вісь приводить у рух гусениці, що підвищує проходження на пересеченій місцевості. Така ходьба обмежена в вантажопідйомності, але коштує дешевше, ніж повністю гусенична."
 squeezebore_adaptor:0 "Конусний адаптер"
 squeezebore_adaptor_desc:0 "Спеціальний адаптер, який висів на дуло знаряддя, зменшує його діаметр і стискає снаряд, що зменшує його. Це значно підвищує потужну швидкість снаряда і, отже, пробиту здатність знаряддя, але вимагає особливих снарядів, виготовлених з рідкісних матеріалів."
 armor_skirts:0 "Бронюбки"
 armor_skirts_desc:0 "Тонкими металевими пластинами, що підвішують бойову машину, захищають від протитанкових ружів і кумулятивних зарядів."
 dozer_blade:0 "Бульдозерний відвал"
 dozer_blade_desc:0 "Бульдозерний відвал допомагає машині швидко підніматися на поле бою без допомоги інженерів."
 auto_loader:0 "Автозарядник"
 auto_loader_desc:0 "Автоматичний механізм, що заряджає снаряди і дозволяє танку довго підтримувати високу швидкострільність."
 easy_maintenance:0 "Простота у обслуговуванні"
 easy_maintenance_desc:0 "У бойових машинах з’являється багато важливих складників, які допомагають екіпажу виконувати складні регламентні завдання."
 additional_machine_guns:0 "Додаткові кулемети"
 additional_machine_guns_desc:0 "Додаткові кулемети на бічних виступах та спеціальних вертлюгах підвищують ефективність оборони машини від атаки піхоти на малому дистанції."

