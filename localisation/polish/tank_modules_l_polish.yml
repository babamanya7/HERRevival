 basic_medium_tank_chassis:0 "Шассі базового середнього танку"
 basic_medium_tank_chassis_short:0 "Середня модель 1934 р."
 basic_medium_tank_chassis_desc:0 "У минулому легені танки формували кісточки механізованих зв’язків, але тепер зрозуміло, що їхній потенціал росту наближається до кінця. В майбутньому нам знадобляться більші бойові машини, які зберігають високий рівень мобільності."
 improved_medium_tank_chassis:0 "Шассі поліпшеного середнього танку"
 improved_medium_tank_chassis_short:1 "Середня модель 1940 р."
 improved_medium_tank_chassis_desc:0 "Виходячи з досвіду експлуатації минулих поколінь середніх танків, ясно, що тепер буде актуальна нова модель з підвищеною вміщістю."
 advanced_medium_tank_chassis:0 "Шассі модернізованого середнього танку"
 advanced_medium_tank_chassis_short:0 "Середня модель 1943 р."
 advanced_medium_tank_chassis_desc:0 "Швидкий зріст ваги зарубійних систем і товщини броні вимагає в цій категорії ще більших танкових шасі розміру ранніх важких танків."
 medium_tank_chassis_desc:0 "Балансоване шасі середнього розміру. Відрізується гнучкістю застосування, підходить для великого асортименту бойових машин."
 medium_tank_artillery_chassis_0:0 "Середня кома"
 medium_tank_artillery_chassis:0 "Середня САУ"
 medium_tank_artillery_chassis_desc:0 "Найзручніша бойова машина - це вогонь, який підтримує наступаючу піхоту."
 medium_tank_artillery_chassis_1:0 "Основна середня САУ"
 medium_tank_artillery_chassis_2:0 "Покращена середня САУ"
 medium_tank_artillery_chassis_3:0 "Модернізована середня САУ"
 medium_tank_destroyer_chassis_0:0 "Середня ПТ-установка"
 medium_tank_destroyer_chassis:0 "Середня ПТ-Установка"
 medium_tank_destroyer_chassis_desc:0 "Добре збалансована бойова машина з потужним знаряддям для знищення ворожих бронетехніків."
