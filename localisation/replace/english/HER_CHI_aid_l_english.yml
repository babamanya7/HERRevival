 CHI_prioritize_military_cargo: "Prioritize Military Cargo"
 CHI_prioritize_military_cargo_desc: "Allocate 80% of Western route capacity to incoming weapons and 20% to outgoing tungsten."
 CHI_balance_foreign_cargo: "Balance Foreign Cargo"
 CHI_balance_foreign_cargo_desc: "Allocate 60% of Western route capacity to incoming weapons and 40% to outgoing tungsten."
 CHI_prioritize_credit_repayment: "Prioritize Credit Repayment"
 CHI_prioritize_credit_repayment_desc: "Allocate 40% of Western route capacity to incoming weapons and 60% to outgoing tungsten."
 USA_offer_china_rifle_contract: "Offer a Small-Arms Contract"
 USA_offer_china_rifle_contract_desc: "Offer China 5,000 rifles, 2,400 machine guns, 800 mortars and 700 handheld anti-tank weapons for 55,000 credit units."
 USA_offer_china_artillery_contract: "Offer an Artillery Contract"
 USA_offer_china_artillery_contract_desc: "Offer China 240 field, 80 heavy, 120 anti-tank and 120 anti-air guns for 70,000 credit units."
 USA_offer_china_ammunition_contract: "Offer an Ammunition Contract"
 USA_offer_china_ammunition_contract_desc: "Offer China 10,000 ammunition equipment for 45,000 credit units."
 USA_offer_china_support_contract: "Offer a Support Equipment Contract"
 USA_offer_china_support_contract_desc: "Offer China 1,000 support equipment for 45,000 credit units."
 USA_offer_china_truck_contract: "Offer a Truck Contract"
 USA_offer_china_truck_contract_desc: "Offer China 1,000 trucks for 35,000 credit units."
 USA_offer_china_fighter_contract: "Offer a Fighter Contract"
 USA_offer_china_fighter_contract_desc: "Offer China one 40-aircraft fighter wing for 50,000 credit units."
 USA_offer_china_cas_contract: "Offer a CAS Contract"
 USA_offer_china_cas_contract_desc: "Offer China one 40-aircraft CAS wing for 55,000 credit units."
 USA_offer_china_tactical_bomber_contract: "Offer a Light Bomber Contract"
 USA_offer_china_tactical_bomber_contract_desc: "Offer China one 40-aircraft light tactical bomber wing for 65,000 credit units."
 USA_emergency_arms_for_china: "Emergency Military Aid to China"
 USA_emergency_arms_for_china_desc: "Grant China the complete 5,000-rifle infantry package through the staging stockpile."
 ENG_emergency_arms_for_china: "British Military Aid to China"
 ENG_emergency_arms_for_china_desc: "Grant China the complete infantry package through the shared Western staging stockpile."
 USA_finance_burma_road_expansion: "Finance Burma Road Expansion"
 USA_finance_burma_road_expansion_desc: "Increase Burma Road throughput by 500 after 120 days."
 USA_expand_hump_airlift: "Expand the Hump Airlift"
 USA_expand_hump_airlift_desc: "Increase incoming Hump throughput by 500 after 120 days."
 her_chi_aid.1.t: "China Requests a Commodity Credit"
 her_chi_aid.1.d: "The Chinese government offers to secure an American credit with future deliveries of strategically important tungsten. Open routes through Chinese ports, Indochina, and Burma will be required both to deliver weapons and to service the obligation."
 her_chi_aid.1.a: "Approve the credit"
 her_chi_aid.1.b: "Refuse the request"
 her_chi_aid.2.t: "The American Credit Is Approved"
 her_chi_aid.2.d: "The United States has opened a credit line for purchasing weapons. China will repay it with tungsten, and a protected export depot has been established in Chongqing. Construction and expansion of Western routes remain the responsibility of the United States and Britain."
 her_chi_aid.2.a: "This will strengthen our resistance"
 her_chi_aid.3.t: "The Americans Refuse the Credit"
 her_chi_aid.3.d: "The United States government has refused the Chinese proposal."
 her_chi_aid.3.a: "Regrettable"
 her_chi_aid.contract_accept: "Accept the American offer"
 her_chi_aid.contract_refuse: "Refuse the contract"
 her_chi_aid.4.t: "American Small Arms"
 her_chi_aid.4.d: "The United States offers a complete infantry package for 55,000 credit units."
 her_chi_aid.5.t: "American Artillery"
 her_chi_aid.5.d: "The United States offers a mixed field, heavy, anti-tank and anti-air artillery package for 70,000 credit units."
 her_chi_aid.6.t: "American Trucks"
 her_chi_aid.6.d: "The United States offers 1,000 trucks for 35,000 credit units."
 her_chi_aid.7.t: "American Fighters"
 her_chi_aid.7.d: "The United States offers one 40-aircraft fighter wing for 50,000 credit units."
 her_chi_aid.request_approve: "Approve the Chinese request"
 her_chi_aid.request_refuse: "Refuse China"
 her_chi_aid.8.t: "China Requests Small Arms"
 her_chi_aid.8.d: "China requests the complete infantry package for 55,000 credit units."
 her_chi_aid.9.t: "China Requests Artillery"
 her_chi_aid.9.d: "China requests a mixed artillery package for 70,000 credit units."
 her_chi_aid.10.t: "China Requests Trucks"
 her_chi_aid.10.d: "China requests 1,000 trucks for 35,000 credit units."
 her_chi_aid.11.t: "China Requests Fighters"
 her_chi_aid.11.d: "China requests one 40-aircraft fighter wing for 50,000 credit units."
 her_chi_aid.12.t: "The Americans Approve Our Request"
 her_chi_aid.12.d: "The contract price has been deducted from our credit and the equipment has entered the staging stockpile."
 her_chi_aid.12.a: "We await the shipment"
 her_chi_aid.13.t: "The Americans Refuse the Shipment"
 her_chi_aid.13.d: "The United States rejected our latest request. No credit was spent."
 her_chi_aid.13.a: "We must look elsewhere"
