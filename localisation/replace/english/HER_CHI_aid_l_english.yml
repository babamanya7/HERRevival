 CHI_request_american_credit_expansion: "Request an Expanded Credit Line"
 CHI_request_american_credit_expansion_desc: "After beginning tungsten repayments, request another §Y750,000§! American credit units. Approval adds §Y1,500,000§! to the tungsten obligation."
 USA_deploy_flying_tigers: "Deploy the Flying Tigers"
 USA_deploy_flying_tigers_desc: "Organize the American Volunteer Group into three elite fighter squadrons. §Y120 fighters§! will pass through the BRA transit depot while American instructors strengthen the Chinese air force."
 USA_offer_china_emergency_credit: "Offer China an Emergency Credit"
 USA_offer_china_emergency_credit_desc: "Offer China another §Y1,000,000§! credit units on favorable terms in exchange for §Y1,000,000§! additional tungsten obligations. China must accept the offer."
 USA_begin_ledo_road_construction: "Begin Construction of the Ledo Road"
 USA_begin_ledo_road_construction_desc: "Begin building a road from Assam toward the Burma Road. Construction takes §Y790 days§! and uses §Y10 civilian factories§!. The route cannot open before §Y28 January 1945§!."
