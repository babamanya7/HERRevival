 USA_offer_china_fighter_contract: "Offer a Fighter Contract"
 USA_offer_china_fighter_contract_desc: "Offer China one 40-aircraft fighter wing for 40,000 credit units."
 USA_offer_china_cas_contract: "Offer a CAS Contract"
 USA_offer_china_cas_contract_desc: "Offer China one 40-aircraft CAS wing for 48,000 credit units."
 USA_offer_china_tactical_bomber_contract: "Offer a Light Bomber Contract"
