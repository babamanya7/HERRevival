 CHI_foreign_aid: "Foreign Aid to China"
 CHI_foreign_aid_desc: "Foreign contracts spend §Y14 days§! in staging and another §Y7 days§! in transit after route dispatch.\n\n§YFinance§!\nCredit: §Y[?CHI_usa_credit_balance|0]§!; tungsten debt: §Y[?CHI_usa_tungsten_debt|0]§!; tungsten shipped today: §G[?CHI_tungsten_exported_last_day|0]§!\n\n§YRoutes§!\nSea §Y[?CHI_sea_route_capacity|0]§!; Hanoi §Y[?CHI_hanoi_route_capacity|0]§!; Burma §Y[?CHI_burma_route_capacity|0]§!; Hump §Y[?CHI_hump_route_capacity|0]§!; Ledo §Y[?CHI_ledo_route_capacity|0]§!\nTotal §Y[?CHI_western_route_capacity|0]§!; imports §Y[?CHI_western_import_allocation|0]§!; exports §Y[?CHI_western_export_allocation|0]§!\n\n§YStaged / in transit / dispatched today§!\nInfantry: §Y[?BRA.BRA_CHI_pending_infantry_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_infantry_equipment|0]§! / §G[?CHI_infantry_cargo_dispatched_last_day|0]§! rifles\nArtillery: §Y[?BRA.BRA_CHI_pending_artillery_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_artillery_equipment|0]§! / §G[?CHI_artillery_cargo_dispatched_last_day|0]§! field guns\nAmmunition: §Y[?BRA.BRA_CHI_pending_ammunition_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_ammunition_equipment|0]§! / §G[?CHI_ammunition_dispatched_last_day|0]§!\nSupport: §Y[?BRA.BRA_CHI_pending_support_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_support_equipment|0]§! / §G[?CHI_support_dispatched_last_day|0]§!\nTrucks: §Y[?BRA.BRA_CHI_pending_motorized_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_motorized_equipment|0]§! / §G[?CHI_trucks_dispatched_last_day|0]§!\nFighters: §Y[?BRA.BRA_CHI_pending_small_plane_airframe|0]§! / §Y[?BRA.BRA_CHI_in_transit_small_plane_airframe|0]§! / §G[?CHI_fighters_dispatched_last_day|0]§!\nCAS: §Y[?BRA.BRA_CHI_pending_small_plane_cas_airframe|0]§! / §Y[?BRA.BRA_CHI_in_transit_small_plane_cas_airframe|0]§! / §G[?CHI_cas_dispatched_last_day|0]§!\nLight bombers: §Y[?BRA.BRA_CHI_pending_small_plane_tactical_bomber_airframe|0]§! / §Y[?BRA.BRA_CHI_in_transit_small_plane_tactical_bomber_airframe|0]§! / §G[?CHI_tactical_bombers_dispatched_last_day|0]§!"
 USA_CHI_foreign_aid: "American Aid to China"
 USA_CHI_foreign_aid_desc: "The United States may offer specific contracts under China's credit line or provide unilateral emergency aid. Accepted equipment enters the Western staging stockpile before being physically delivered.\n\nChinese credit: §Y[?CHI.CHI_usa_credit_balance|0]§!\nChinese tungsten debt: §Y[?CHI.CHI_usa_tungsten_debt|0]§!\nRoute capacity: §Y[?CHI.CHI_western_route_capacity|0]§!\n\nStaged: rifles §Y[?BRA.BRA_CHI_pending_infantry_equipment|0]§!; artillery §Y[?BRA.BRA_CHI_pending_artillery_equipment|0]§!; trucks §Y[?BRA.BRA_CHI_pending_motorized_equipment|0]§!; aircraft §Y[?BRA.BRA_CHI_pending_small_plane_airframe|0]§!"
 CHI_request_american_tungsten_credit: "Request an American Tungsten Credit"
 CHI_request_american_tungsten_credit_desc: "Offer the United States a commodity-backed credit secured by future deliveries of Chinese tungsten."
 CHI_request_american_rifles: "Request American Small Arms"
 CHI_request_american_rifles_desc: "Request 5,000 rifles, 2,400 machine guns, 800 mortars and 700 handheld anti-tank weapons for 50,000 credit units. Grenades are abstracted into infantry equipment."
 CHI_request_american_artillery: "Request American Artillery"
 CHI_request_american_artillery_desc: "Request 240 field guns, 80 heavy guns, 120 anti-tank guns and 120 anti-air guns for 60,000 credit units."
 CHI_request_american_ammunition: "Request American Ammunition"
 CHI_request_american_ammunition_desc: "Request 10,000 ammunition equipment for 40,000 credit units."
 CHI_request_american_support_equipment: "Request American Support Equipment"
 CHI_request_american_support_equipment_desc: "Request 1,000 support equipment for 30,000 credit units."
 CHI_request_american_trucks: "Request American Trucks"
 CHI_request_american_trucks_desc: "Request 1,000 trucks for 40,000 credit units."
 CHI_request_american_aircraft: "Request a Fighter Wing"
 CHI_request_american_aircraft_desc: "Request one 40-aircraft fighter wing for 40,000 credit units."
 CHI_request_american_cas: "Request a CAS Wing"
 CHI_request_american_cas_desc: "Request one 40-aircraft CAS wing for 48,000 credit units."
 CHI_request_american_tactical_bombers: "Request a Light Bomber Wing"
 CHI_request_american_tactical_bombers_desc: "Request one 40-aircraft light tactical bomber wing for 60,000 credit units."
 CHI_prioritize_military_cargo: "Prioritize Military Cargo"
 CHI_prioritize_military_cargo_desc: "Allocate 80% of Western route capacity to incoming weapons and 20% to outgoing tungsten."
 CHI_balance_foreign_cargo: "Balance Foreign Cargo"
 CHI_balance_foreign_cargo_desc: "Allocate 60% of Western route capacity to incoming weapons and 40% to outgoing tungsten."
 CHI_prioritize_credit_repayment: "Prioritize Credit Repayment"
 CHI_prioritize_credit_repayment_desc: "Allocate 40% of Western route capacity to incoming weapons and 60% to outgoing tungsten."
 USA_offer_china_rifle_contract: "Offer a Small-Arms Contract"
 USA_offer_china_rifle_contract_desc: "Offer China 5,000 rifles, 2,400 machine guns, 800 mortars and 700 handheld anti-tank weapons for 50,000 credit units."
 USA_offer_china_artillery_contract: "Offer an Artillery Contract"
 USA_offer_china_artillery_contract_desc: "Offer China 240 field, 80 heavy, 120 anti-tank and 120 anti-air guns for 60,000 credit units."
 USA_offer_china_ammunition_contract: "Offer an Ammunition Contract"
 USA_offer_china_ammunition_contract_desc: "Offer China 10,000 ammunition equipment for 40,000 credit units."
 USA_offer_china_support_contract: "Offer a Support Equipment Contract"
 USA_offer_china_support_contract_desc: "Offer China 1,000 support equipment for 30,000 credit units."
 USA_offer_china_truck_contract: "Offer a Truck Contract"
