l_english:
 CHI_foreign_aid: "Foreign Aid to China"
 CHI_foreign_aid_desc: "Foreign credits and weapons sustain Chinese resistance, but cargo and strategic materials must pass through vulnerable external routes.\n\n§YFinance and exports§!\nAmerican credit: §Y[?CHI_usa_credit_balance|0]§!\nTungsten debt: §Y[?CHI_usa_tungsten_debt|0]§!\nTungsten in China: §Y[?left_tungsten|0]§!\nTungsten shipped last day: §G[?CHI_tungsten_exported_last_day|0]§!\n\n§YRoutes§!\nSea: §Y[?CHI_sea_route_capacity|0]§!; Hanoi: §Y[?CHI_hanoi_route_capacity|0]§!; Burma: §Y[?CHI_burma_route_capacity|0]§!; Hump: §Y[?CHI_hump_route_capacity|0]§!; Ledo: §Y[?CHI_ledo_route_capacity|0]§!\nTotal: §Y[?CHI_western_route_capacity|0]§!; imports: §Y[?CHI_western_import_allocation|0]§!; exports: §Y[?CHI_western_export_allocation|0]§!\n\n§YStaging stockpile§!\nRifles: §Y[?BRA.BRA_CHI_pending_infantry_equipment|0]§! (§G+[?CHI_rifles_delivered_last_day|0]§!); artillery: §Y[?BRA.BRA_CHI_pending_artillery_equipment|0]§! (§G+[?CHI_artillery_delivered_last_day|0]§!); trucks: §Y[?BRA.BRA_CHI_pending_motorized_equipment|0]§! (§G+[?CHI_trucks_delivered_last_day|0]§!); aircraft: §Y[?BRA.BRA_CHI_pending_small_plane_airframe|0]§! (§G+[?CHI_aircraft_delivered_last_day|0]§!)"
 USA_CHI_foreign_aid: "American Aid to China"
 USA_CHI_foreign_aid_desc: "The United States may offer specific contracts under China's credit line or provide unilateral emergency aid. Accepted equipment enters the Western staging stockpile before being physically delivered.\n\nChinese credit: §Y[?CHI.CHI_usa_credit_balance|0]§!\nChinese tungsten debt: §Y[?CHI.CHI_usa_tungsten_debt|0]§!\nRoute capacity: §Y[?CHI.CHI_western_route_capacity|0]§!\n\nStaged: rifles §Y[?BRA.BRA_CHI_pending_infantry_equipment|0]§!; artillery §Y[?BRA.BRA_CHI_pending_artillery_equipment|0]§!; trucks §Y[?BRA.BRA_CHI_pending_motorized_equipment|0]§!; aircraft §Y[?BRA.BRA_CHI_pending_small_plane_airframe|0]§!"
 CHI_request_american_tungsten_credit: "Request an American Tungsten Credit"
 CHI_request_american_tungsten_credit_desc: "Offer the United States a commodity-backed credit secured by future deliveries of Chinese tungsten."
 CHI_expand_the_burma_road: "Expand the Burma Road"
 CHI_expand_the_burma_road_desc: "Increase Burma Road throughput by §G500§! daily cargo units after 120 days."
 CHI_expand_the_airlift: "Strengthen Air Transport over the Himalayas"
 CHI_expand_the_airlift_desc: "Increase incoming Hump throughput by §G500§! daily cargo units after 120 days. The air route cannot export tungsten."
 CHI_expand_the_ledo_road: "Expand the Ledo Road"
 CHI_expand_the_ledo_road_desc: "Increase Ledo Road throughput by §G500§! daily cargo units after 120 days."
 CHI_prioritize_military_cargo: "Prioritize Military Cargo"
 CHI_prioritize_military_cargo_desc: "Allocate 80% of Western route capacity to incoming weapons and 20% to outgoing tungsten."
 CHI_balance_foreign_cargo: "Balance Foreign Cargo"
 CHI_balance_foreign_cargo_desc: "Allocate 60% of Western route capacity to incoming weapons and 40% to outgoing tungsten."
 CHI_prioritize_credit_repayment: "Prioritize Credit Repayment"
 CHI_prioritize_credit_repayment_desc: "Allocate 40% of Western route capacity to incoming weapons and 60% to outgoing tungsten."
 USA_offer_china_rifle_contract: "Offer a Small-Arms Contract"
 USA_offer_china_rifle_contract_desc: "Offer China 5,000 rifles for 20,000 credit units."
 USA_offer_china_artillery_contract: "Offer an Artillery Contract"
 USA_offer_china_artillery_contract_desc: "Offer China 500 artillery pieces for 50,000 credit units."
 USA_offer_china_truck_contract: "Offer a Truck Contract"
 USA_offer_china_truck_contract_desc: "Offer China 1,000 trucks for 40,000 credit units."
 USA_offer_china_fighter_contract: "Offer a Fighter Contract"
 USA_offer_china_fighter_contract_desc: "Offer China 100 small aircraft for 80,000 credit units."
 USA_emergency_arms_for_china: "Emergency Military Aid to China"
 USA_emergency_arms_for_china_desc: "Grant China 5,000 rifles, 300 artillery pieces and 600 trucks through the staging stockpile."
 ENG_emergency_arms_for_china: "British Military Aid to China"
 ENG_emergency_arms_for_china_desc: "Grant China 3,000 rifles, 200 artillery pieces and 400 trucks through the shared Western staging stockpile."
 USA_finance_burma_road_expansion: "Finance Burma Road Expansion"
 USA_finance_burma_road_expansion_desc: "Increase Burma Road throughput by 500 after 120 days."
 USA_expand_hump_airlift: "Expand the Hump Airlift"
 USA_expand_hump_airlift_desc: "Increase incoming Hump throughput by 500 after 120 days."
 her_chi_aid.1.t: "China Requests a Commodity Credit"
 her_chi_aid.1.d: "The Chinese government offers to secure an American credit with future deliveries of strategically important tungsten. Open routes through Chinese ports, Indochina, and Burma will be required both to deliver weapons and to service the obligation."
 her_chi_aid.1.a: "Approve the credit"
 her_chi_aid.1.b: "Refuse the request"
 her_chi_aid.2.t: "The American Credit Is Approved"
 her_chi_aid.2.d: "The United States has opened a credit line for purchasing weapons. China has undertaken to repay it with tungsten deliveries."
 her_chi_aid.2.a: "This will strengthen our resistance"
 her_chi_aid.3.t: "The Americans Refuse the Credit"
 her_chi_aid.3.d: "The United States government has refused the Chinese proposal."
 her_chi_aid.3.a: "Regrettable"
 her_chi_aid.contract_accept: "Accept the American offer"
 her_chi_aid.contract_refuse: "Refuse the contract"
 her_chi_aid.4.t: "American Small Arms"
 her_chi_aid.4.d: "The United States offers 5,000 rifles for 20,000 credit units."
 her_chi_aid.5.t: "American Artillery"
 her_chi_aid.5.d: "The United States offers 500 artillery pieces for 50,000 credit units."
 her_chi_aid.6.t: "American Trucks"
 her_chi_aid.6.d: "The United States offers 1,000 trucks for 40,000 credit units."
 her_chi_aid.7.t: "American Fighters"
 her_chi_aid.7.d: "The United States offers 100 small aircraft for 80,000 credit units."
