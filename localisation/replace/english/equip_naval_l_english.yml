l_english:
 naval_equipment:0 "Корабли"
 vnr_ship_hull_submarine_1_desc:0 "Первые подводные военные корабли, действительно способные к эффективным боевым действиям, эти конструкции представляют собой значительные усовершенствования по сравнению со своими предшественниками. Благодаря тому, что дизель-электрические двигатели заменили преимущественно бензино-электрические двигатели первых подводных лодок, они значительно увеличили дальность плавания и надводную скорость по сравнению со своими предшественниками. В бою с военными кораблями противника они действуют в основном как легкие подводные торпедные катера, но им не хватает скорости и запаса воздуха в подводном положении, чтобы оставаться под водой долгое время. Это подводные лодки, которые использовались крупнейшими военно-морскими державами во время мировой войны."
 vnr_ship_hull_submarine_2_desc:0 "В результате эволюции более ранних конструкций подводных лодок некоторые из этих военных кораблей развили идеи «крейсерских» подводных лодок, с более крупными орудиями и большим упором на надводные возможности, в то время как другие смотрят в другом направлении, стремясь увеличить подводные возможности и характеристики."
 vnr_ship_hull_submarine_3_desc:0 "Достижения, достигнутые некоторыми более ранними проектами в увеличении дальности подводного плавания, скорости и общих возможностей, привели к повороту в разработке подводных лодок от «крейсерских» типов к судам с большим упором на подводные возможности. Эти подводные лодки, значительно улучшенные по сравнению с предыдущими типами, несут мощную торпедную нагрузку и представляют реальную угрозу практически для всех надводных кораблей. Однако они по-прежнему ограничены по продолжительности, дальности и скорости подводного плавания и остаются уязвимыми при надводном положении, особенно для самолетов."
 vnr_ship_hull_submarine_4_desc:0 "Благодаря значительно увеличенной емкости аккумуляторов, усовершенствованным системам обновления воздуха во время погружения и усовершенствованной конструкции, это первые подводные лодки, способные оставаться под водой большую часть времени своего пребывания в море. Таким образом, они знаменуют собой масштабный сдвиг в военно-морской войне и превращение подводных лодок в настоящие ужасы. Такие военные корабли дают возможность доминировать в океанах тем странам, которые их разработали и построили."
 vnr_ship_hull_light_1_desc:0 "Мировая война породила новый спрос на эсминцы: они не только были необходимы для защиты своего флота, но и были вынуждены защищать судоходные пути Антанты. Чтобы удовлетворить эту потребность, конструкции эсминцев были оптимизированы и запущены в серийное производство, чтобы удовлетворить спрос. Корабли этой эпохи обычно весят 1000 тонн и развивают максимальную скорость 34 узла, неся при этом пару торпед большего размера, чем их предшественники."
 vnr_ship_hull_light_2_desc:0 "Во время Первой мировой войны наблюдалась тенденция к созданию более крупных эсминцев с более тяжелым вооружением. Во время войны было упущено много возможностей уничтожить крупные корабли, поскольку эсминцы расходовали все свои торпеды в первом залпе. Для решения этой проблемы эсминцы были усилены по корпусу и вооружению. Эсминцы того периода имели более крупные корпуса и водоизмещение от 1500 до 2000 тонн, возглавляемые немного более крупным эсминцем-лидером."
 vnr_ship_hull_light_3_desc:0 "К 1935 году, когда на вооружение поступали все более мощные конструкции новых самолетов, а также несколько военно-морских держав пстроили больше авианосцев, хотя все еще существовали некоторые сомнения относительно того, насколько полезны авианосцы будут в открытой войне, возникла обеспокоенность по поводу потенциальной угрозы, которую самолеты могут представлять для военных кораблей. Продолжение учений показало миру, что авианосец имеет свое предназначение во флоте. В результате на эсминцах появилось основное вооружение двойного назначения, что дало эсминцу значительно улучшенную зенитную роль, что снова увеличило их полезность. Эти корабли водоизмещением до 2500 тонн часто несут увеличенную торпедную нагрузку, чтобы компенсировать уменьшенную торпедную нагрузку на более современных крейсерах."
 vnr_ship_hull_light_4_desc:0 "С началом Второй мировой войны флоты мира нуждались в дешёвых зенитных платформах. Успех авианосного боя показал миру, что они подходят не только для разведки и борьбы с авианосцами, но и необходимы для современной войны против крупных кораблей. Передовые противолодочные технологии также играют важную роль в борьбе с основной угрозой для конвоев, они и зенитные требования увеличили требования к большему количеству эсминцев. В то время как раньше инвестиции в эсминцы снижались в пользу крейсеров и новых линейных крейсеров, эсминцы начинают возвращаться на первый план как неотъемлемая часть флота, так и системы конвоев. Часто они не крупнее своих предшественников, но гораздо более продвинуты в технологиях, в основном имеют плоские палубы и гораздо более мощное торпедное вооружение."
 vnr_ship_hull_light_5_desc:0 "Ближе к концу Второй мировой войны военно-морские силы мира были вынуждены адаптироваться к новым подводным лодкам, которые могли оставаться под водой в течение почти неопределенного периода времени, авианосцам, нагруженным самолетами, более чем способными уничтожать крупные корабли с помощью больших пушек. Крейсера быстро становятся неактуальными перед лицом авианосцев и подводных лодок. В умах большинства военно-морских теоретиков будущую роль эскорта флота берут на себя почти исключительно эсминцы, а скорострельные пушки двойного назначения уничтожают любые самолеты, которые осмеливаются пересечь его путь в попытке бомбить его в пикировании. Водоизмещение этих кораблей также было увеличено, часто доходя до 3000 тонн, поскольку конструкторы загружали их все большим количеством зенитного вооружения, а также большего количества основных орудий."
 torpedo_cruiser:0 "Торпедный крейсер"
 torpedo_cruiser_desc:0 "Основываясь на доктрине Jeune École («Молодая школа»), согласно которой небольшие военные корабли, вооруженные торпедами, могут эффективно и дешево побеждать гораздо более крупные корабли, эти крейсеры в основном вооружены торпедами. Большинство торпедных крейсеров потеряли популярность у большинства военно-морских сил в 1890-х годах, хотя многие другие флоты продолжали приобретать их до начала 1900-х годов. Современные торпедные крейсера предназначены для использования торпед, которые подводные лодки не могут нести."
 early_ship_hull_cruiser_desc:0 "До конца 19 века незащищенные крейсера все еще занимали место в составе флота, тогда как стали появляться защищенные крейсера с броней, а в поле зрения военно-морского флота постепенно попали более крупные броненосные крейсера. Бурное развитие крейсеров в начале 20 века имело несколько типов различных размеров: от линейных крейсеров с огневой мощью и защитой, близкими к дредноуту, до лидеров флотилий, действовавших рядом с эсминцами, эти передовые крейсера значительно превзошли крупные корабли прошлого."
 vnr_ship_hull_cruiser_1_desc:0 "До конца 19 века незащищенные крейсера все еще занимали место в составе флота, тогда как стали появляться защищенные крейсера с броней, а в поле зрения военно-морского флота постепенно попали более крупные броненосные крейсера. Бурное развитие крейсеров в начале 20 века имело несколько типов различных размеров: от линейных крейсеров с огневой мощью и защитой, близкими к дредноуту, до лидеров флотилий, действовавших рядом с эсминцами, эти передовые крейсера значительно превзошли крупные корабли прошлого."
 vnr_ship_hull_cruiser_2_desc:0 "Военно-морское строительство в 1920-х и 1930-х годах было ограничено международными договорами, призванными предотвратить повторение гонки вооружений дредноутов начала 20 века. Вашингтонский военно-морской договор 1922 года наложил ограничения на строительство кораблей стандартным водоизмещением более 10 000 тонн и артиллерийским вооружением более 8 дюймов. Ряд военно-морских сил заказали крейсера классов, соответствующих верху этого предела, известных как «контрактные крейсера»."
 vnr_ship_hull_cruiser_3_desc:0 "В межвоенный период происходили усовершенствования крейсеров в рамках Вашингтонского военно-морского договора. Поскольку политика и финансы по-прежнему ограничивают многие военно-морские державы, выпускаемые модели лишь немного больше по размеру, чем предыдущее поколение, вместо этого наблюдается повышение огневой мощи за счет использования более крупных орудий или растущего внедрения тройных башен и счетверенных торпедных аппаратов. Растущее значение авиации в морской войне также привело к использованию пушек двойного назначения, дополненных растущим набором автопушек. Однако уже предпринимались попытки нарушить ограничения, установленные для крейсеров.\n\nУстановите §YРоль большого крейсера§! на §YКорпус крейсера§!, чтобы разблокировать §YБатарею большого крейсера§! и §YБроню большого крейсера§!."
 vnr_ship_hull_cruiser_4_desc:0 "Благодаря возросшему финансированию, новые крейсера, построенные в конце межвоенного периода и начале Второй мировой войны, вновь увеличились в размерах. Хотя калибр основного вооружения снова остался неизменным, за некоторыми исключениями, их огневая мощь была дополнительно увеличена за счет добавления дополнительной башни или увеличения количества орудий в каждой башне. Вспомогательное вооружение было модернизировано за счет дополнительных спаренных орудий двойного назначения и еще более специализированного зенитного вооружения, часто связанного с улучшенным управлением огнем. В этом поколении также наблюдается растущее внедрение радиолокационных систем на крейсерах."
 vnr_ship_hull_cruiser_5_desc:0 "Крейсера позднего и раннего послевоенного периода остаются похожими на крейсера начала войны, но при этом учитывают многочисленные уроки, извлеченные на протяжении всей войны. Поскольку было подтверждено, что самолеты представляют собой одну из самых больших угроз для кораблей, конструкторы сосредоточились на дальнейшем улучшении возможностей ПВО за счет улучшения управления огнем и улучшения координации между батареями и радаром. Некоторые военно-морские силы также экспериментируют с механизмами самозарядки основного вооружения, значительно повышая их скорострельность."
 early_ship_hull_heavy_desc:0 "Эти корабли, разработанные незадолго до начала мировой войны и построенные во время ее буйства, представляют собой высший уровень развития военно-морского флота до начала этого конфликта. Они были ведущими военными кораблями флота во время войны и сохраняют свою мощь еще долгое время после ее окончания. Хотя они заметно быстрее, чем предшествующие им дредноуты, их наиболее заметной отличительной чертой является расширенное вооружение: они несут от восьми до десяти основных орудий, большинство из которых расположены в спаренных башнях, но некоторые - в новых тройных башнях. Их разрушительная огневая мощь и тяжелая броня гарантировали, что они окажутся в центре своих флотов в Мировой войне, но за это продолжающееся продвижение пришлось платить быстро растущую цену. Даже в большей степени, чем военные корабли до них, эти классы требовали огромных инвестиций, хотя они были лишь тенью того, что должно было произойти."
 vnr_ship_hull_heavy_1_desc:0 "Эти корабли, разработанные незадолго до начала мировой войны и построенные во время ее буйства, представляют собой высший уровень развития военно-морского флота до начала этого конфликта. Они были ведущими военными кораблями флота во время войны и сохраняют свою мощь еще долгое время после ее окончания. Хотя они заметно быстрее, чем предшествующие им дредноуты, их наиболее заметной отличительной чертой является расширенное вооружение: они несут от восьми до десяти основных орудий, большинство из которых расположены в спаренных башнях, но некоторые - в новых тройных башнях. Их разрушительная огневая мощь и тяжелая броня гарантировали, что они окажутся в центре своих флотов в Мировой войне, но за это продолжающееся продвижение пришлось платить быстро растущую цену. Даже в большей степени, чем военные корабли до них, эти классы требовали огромных инвестиций, хотя они были лишь тенью того, что должно было произойти."
 vnr_ship_hull_heavy_2_desc:0 "В межвоенный период на линкор налагались строгие международные ограничения, чтобы предотвратить развязывание дорогостоящей гонки вооружений. Столкнувшись с перспективой гонки военно-морских вооружений против Соединенного Королевства и Японии, которая, в свою очередь, привела бы к возможной войне на Тихом океане, Соединенные Штаты стремились заключить Вашингтонский военно-морской договор 1922 года. Этот договор ограничивал количество и размер флота. линкоры, которыми могла обладать каждая крупная нация. Такие проекты, как британский линкор класса N3, американский класс «Южная Дакота» и японский класс «Кии» — все они продолжали тенденцию к созданию более крупных кораблей с более крупными орудиями и более толстой броней — так и не сошли с чертежной доски. Те проекты, которые были приняты в эксплуатацию в этот период, назывались договорными линкорами."
 vnr_ship_hull_heavy_3_desc:0 "В 1930-е годы военно-морские державы широко модернизировали свои линкоры времен Великой войны. Среди нововведений - увеличенная высота башни и стабильность оптического дальномера (для управления артиллерийским вооружением), усиление брони (особенно вокруг башни) для защиты от огня из пикирования и бомбардировок с воздуха, а также дополнительное зенитное вооружение. Даже когда в конце 1930-х годов снова возникла угроза войны, строительство линкоров не вернуло себе тот уровень важности, который он имел в годы перед Первой мировой войной. «Строительные каникулы», наложенные военно-морскими договорами, означали, что мощность верфей по всему миру сократилась, и стратегическое положение изменилось."
 vnr_ship_hull_heavy_4_desc:0 "На горизонте Вторая мировая война и международная напряженность выше, чем когда-либо, конструкторы стремятся построить новое поколение кораблей для участия в предстоящей войне. В то время как некоторые страны перенесли свои военно-морские надежды на авианосцы, другие по-прежнему настаивают на том, что авианосец может выполнять лишь дополнительную роль, а не заменять основную роль линкора, направленную против крупных кораблей. Вместо этого эти страны переоснащают свои новые конструкции, уделяя особое внимание улучшенной компоновке брони и более эффективным орудиям и башням, а также увеличенной скорости."
 vnr_ship_hull_heavy_5_desc:0 "К концу Второй мировой войны великие державы начали понимать: военно-морская авиация одержала победу над всеми артиллерийскими крупными кораблями. Однако некоторые страны продолжают развивать линкоры в качестве платформ для береговых бомбардировок, престижных проектов и поддержки авианосцев внутри флота или даже пытаются продвигать свою старую роль. Некоторые конструкторы загружают свои линкоры зенитными батареями, чтобы повысить шансы на выживание. Хотя многие из этих линкоров могут продолжать эксплуатироваться в течение многих лет, некоторые страны уже считают их устаревшими."
 vnr_ship_hull_carrier_1_desc:0 "Разработанные в 30-х годах, эти корабли предназначены для обеспечения воздушной разведки и прикрытия флотов легкими истребителями, в первую очередь ориентированных на более «обычные» военно-морские силы. Их дальность плавания значительно увеличена, и были предприняты усилия, чтобы сделать их достаточно быстрыми, чтобы не отставать от флотов, идущих на полной скорости в открытом океане."
 vnr_ship_hull_carrier_2_desc:0 "Поскольку крупные морские боевые операции в эпоху морской авиации продемонстрировали способность авиации серьезно влиять на сражения в море, многие державы отстали в развитии своих авианосных сил. Хотя авианосцы быстро оказываются самыми мощными из своих собратьев, они также представляют собой массивные корабли, на постройку которых требуется много времени и большое количество ресурсов. Стремясь увеличить свои возможности по перебрасыванию авиации в океаны, военно-морские державы обратились к подобным конструкциям, увеличенным версиям существующих более легких авианосцев, чтобы попытаться быстро укрепить возможности своей морской авиации." 
 vnr_ship_hull_carrier_3_desc:0 "Продолжающееся развитие конструкции авианосцев привело к созданию гораздо более крупных моделей. Эти корабли приближаются по размеру к первым авианосцам флота, в то же время вбирая в себя все конструктивные улучшения, внесенные за прошедшие годы. Большинство из них обладают значительной броневой защитой и мощной зенитной артиллерией, а также обладают высокой механической надежностью. Однако они отказались от концепции вторичного вооружения большого калибра в обмен на меньшие орудия двойного назначения."
 vnr_ship_hull_super_heavy_1_desc:0 "Быстрый рост ресурсов, выделяемых на военно-морское строительство после окончания крупного сухопутного конфликта во время Великой войны, первоначально привел к появлению этих проектов, которые положили начало тенденции к внезапному росту размеров, огневой мощи, брони, калибра и, конечно же, стоимости. Такие суда отличают ведущие военно-морские державы мира от простых претендентов на величие, но у них есть свои проблемы; их быстрое развитие и поспешное строительство привели к конструктивным недостаткам и постоянным механическим проблемам. Эти конструкции вооружены восемью-десятью 18-дюймовыми или эквивалентными основными орудиями и имеют защиту, позволяющую конкурировать с кораблями с аналогичным вооружением. С наступлением Морского праздника эти монстры были погребены временем."
 vnr_ship_hull_light_1:0 "Легкий корпус Великой войны"
 vnr_ship_hull_light_2:0 "Послевоенный легкий корпус"
 vnr_ship_hull_light_3:0 "Межвоенный легкий корпус"
 vnr_ship_hull_light_4:0 "Усовершенствованный легкий корпус"
 vnr_ship_hull_light_5:0 "Современный легкий корпус"
 ship_hull_cruiser:0 "Крейсер"
 ship_hull_cruiser_desc:0 "В середине 19 века крейсер стал классом кораблей, предназначенных для плавания в дальних водах, торговых набегов и разведки флота. Он выпускался в самых разных размерах: от меньшего защищенного крейсера до большого броненосного крейсера. С появлением дредноута перед мировой войной броненосный крейсер постепенно превратился в линейный крейсер, в то время как прямые преемники защищенных крейсеров могли быть размещены в единой шкале размеров боевых кораблей, пока Лондонская военно-морская конференция официально не установила стандарты для легких и тяжелых крейсеров. "
 early_ship_hull_cruiser:0 "Корпус крейсера Великой Войны"
 vnr_ship_hull_cruiser_1:0 "Корпус крейсера Великой Войны"
 vnr_ship_hull_cruiser_2:0 "Послевоенный корпус крейсера"
 vnr_ship_hull_cruiser_3:0 "Межвоенный корпус крейсера"
 vnr_ship_hull_cruiser_4:0 "Усовершенствованный корпус крейсера"
 vnr_ship_hull_cruiser_5:0 "Корпус современного крейсера"
 ship_hull_heavy:0 "Тяжелый корабль"
 ship_hull_heavy_desc:0 "Перед Великой войной военно-морской флот уже видел линкоры с 15-дюймовыми орудиями, которые были одними из крупнейших боевых машин, когда-либо построенных в истории человечества. Созданные для максимальной огневой мощи и живучести, эти левиафаны доминируют на каждой миле воды."
 early_ship_hull_heavy:0 "Тяжелый корпус Великой войны"
 vnr_ship_hull_heavy_1:0 "Тяжелый корпус Великой войны"
 vnr_ship_hull_heavy_2:0 "Послевоенный тяжелый корпус"
 vnr_ship_hull_heavy_3:0 "Межвоенный тяжелый корпус"
 vnr_ship_hull_heavy_4:0 "Усовершенствованный тяжелый корпус"
 vnr_ship_hull_heavy_5:0 "Современный тяжелый корпус"
 ship_hull_carrier:0 "Авианосец"
 ship_hull_carrier_desc:0 "Крупный корабль, способный нести в бою крылья мощных самолетов. Также полезен в качестве плавучего аэродрома, который можно расположить у берегов врага."
 ship_hull_carrier_0:0 "Корпус авианосца Великой войны"
 vnr_ship_hull_carrier_conversion_bb:0 "Переделанный корпус линкора"
 vnr_ship_hull_carrier_conversion_bb_desc:0 "Эти корабли, первые крупные авианосцы, в основном построены на корпусах, которые изначально предназначались для крупных военных кораблей, но из-за Вашингтонского военно-морского договора были переоборудованы и достроены как авианосцы. Лишь немногие военно-морские державы построили такие корабли, и их конструкции сильно различались; вместимость их самолетов варьировалась от шестидесяти до ста. Однако есть константы, такие как сохраненные тяжелобронированные пояса и другие особенности артиллерийского корабля. Полуэкспериментальные и ненадежные, они по-прежнему остаются невероятно грозным оружием и заложили основу для следующих поколений авианосцев."
 vnr_ship_hull_carrier_conversion_ca:0 "Переоборудованный корпус крейсера"
 vnr_ship_hull_carrier_conversion_ca_desc:0 "Научившись опыту использования тендеров гидросамолетов, военно-морские державы, у которых были для этого ресурсы, начали работу над кораблями следующего поколения, которые могли бы нести самолеты в море. В отличие от своих предшественников, эти авианосцы имеют кабины экипажа, позволяющие самолетам как взлетать с них, так и затем возвращаться и приземляться на них. Переоборудованные из гражданских кораблей и тендеров на гидросамолеты, большинство этих кораблей ограничены относительно тесными летными палубами и ангарами, но они определенно демонстрируют, что корабли способны эффективно управлять авиацией в море."
 vnr_ship_hull_carrier_1:0 "Улучшенный корпус авианосца"
 vnr_ship_hull_carrier_2:0 "Усовершенствованный корпус авианосца"
 vnr_ship_hull_carrier_3:0 "Современный корпус авианосца"
 ship_hull_submarine:0 "Подводная лодка"
 ship_hull_submarine_desc:0 "Современная подводная лодка далеко ушла от своих несложных предшественниц эпохи Великой войны; сегодня при весьма скромной стоимости она представляет собой угрозу любому кораблю вне зависимости от его размеров."
 vnr_ship_hull_submarine_1:0 "Корпус подводной лодки Великой войны"
 vnr_ship_hull_submarine_2:0 "Улучшенный корпус подводной лодки"
 vnr_ship_hull_submarine_3:0 "Усовершенствованный корпус подводной лодки"
 vnr_ship_hull_submarine_4:0 "Современный корпус подводной лодки"
 vnr_ship_hull_pre_dreadnought:0 "Корпус додредноута"
 vnr_ship_hull_pre_dreadnought_desc:0 "Следуя конструкции британского класса Majestic конца 1890-х годов, додредноуты заменили броненосные крейсера 1870-х и 1880-х годов. Построенные из стали и защищенные закаленной стальной броней,додредноуты несут главную батарею очень тяжелых орудий в барбетах, поддерживаемую одной или несколькими вспомогательными батареями более легких орудий.\n\nПоскольку конструкция «дредноутов» сделала их устаревшими с тех пор Мировая война, а также гигантский рост числа проектов на базе «Дредноутов» за последние три десятилетия, лишь немногие из них все еще находятся на вооружении."
 vnr_ship_hull_cruiser_panzerschiff:0 "Карманный линкор"
 GER_vnr_ship_hull_cruiser_panzerschiff:0 "Панзершифф"
 vnr_ship_hull_cruiser_panzerschiff_desc:0 "В качестве радикальной меры в обход Версальского договора Рейхсмарине сначала приняли Панзершифф (броненосец) в качестве временных крупных кораблей. Обладая промежуточной огневой мощью между тяжелыми крейсерами и линейными крейсерами, панзершиффы давали значительное преимущество в бою один на один против крейсеров, но он становился бесполезным перед лицом организованного флота.\nПодобные конструкции также наблюдались в ранних предложениях Японского флота. такой как проект B-65, но так и не реализованный."
 vnr_ship_hull_cruiser_coastal_defense_ship:0 "Корабль береговой обороны"
 vnr_ship_hull_cruiser_coastal_defense_ship_desc:0 "Корабли береговой обороны — это небольшие военные корабли, часто размером с крейсер, которые пожертвовали скоростью и дальностью действия ради брони и вооружения. Они обычно привлекательны для стран, которые либо не могут позволить себе полноразмерные линкоры, либо могут довольствоваться специально спроектированными мелкосидящими судами, способными вести прибрежные операции вблизи своих берегов."
 ship_hull_torpedo_cruiser:0 "Торпедный крейсер"
 ship_hull_torpedo_cruiser_desc:0 "Легкие крейсера, несущие большое количество торпедных аппаратов за счет меньшего числа орудий главного калибра и установок ПВО."
 vnr_ship_hull_super_heavy_1:0 "Сверхтяжелый корпус"
 vnr_ship_hull_cruiser_submarine:0 "Крейсерская подводная лодка"
 vnr_ship_hull_cruiser_submarine_desc:0 "Эти подводные лодки, значительно крупнее предыдущих, относятся к «крейсерскому» типу, предназначены для независимых операций на дальних дистанциях при рейдах на торговые суда и предназначены для лучшего оснащения для ведения боя с легкими военными кораблями противника в надводном положении. Таким образом, они несут более тяжелое артиллерийское вооружение и имеют улучшенную надводную скорость. Однако их подводные возможности остаются ограниченными."
 vnr_ship_hull_midget_submarine:0 "Миниатюрная подводная лодка"
 vnr_ship_hull_midget_submarine_desc:0 "Небольшая подводная лодка, управляемая небольшим экипажем. Его уменьшенная дальность и мощность вооружения компенсируются высокой эффективностью"
 ship_hull_civilian: "Гражданский корабль"
 ship_hull_civilian_desc:0 "Корабль, предназначенный для гражданской деятельности."
 screen_ship:0 "Охранение"
 capital_ship:0 "Крупные корабли"
 
 vnr_ship_hull_light_6: "Легкий корпус холодной войны"
 vnr_ship_hull_light_6_desc: "После Второй мировой войны обычные эсминцы, построенные в этот период, были значительно крупнее кораблей военного времени и имели полностью автоматические главные орудия, механизмы установок, радары, сонары и противолодочное вооружение, например миномет Кальмар. Появление ракет класса земля-воздух и поверхность-поверхность в 1950-х годах изменило морскую войну. Для защиты флота от воздушных, подводных и надводных угроз были разработаны эсминцы с управляемыми ракетами."
 vnr_ship_hull_cruiser_6: "Корпус крейсера холодной войны"
 vnr_ship_hull_cruiser_6_desc: "Расцвет авиации во время Второй мировой войны кардинально изменил характер морского боя. Даже самые быстроходные крейсера не могли маневрировать достаточно быстро, чтобы уклониться от воздушной атаки, а самолеты теперь имели торпеды, что позволяло противостоять им на умеренных дистанциях.\n\nПосле того как линкоры полностью устарели с появлением ракет, во второй половине XX века крейсера стали самыми крупными кораблями в мире. Некоторые из них полностью переняли конструкцию ракет и даже применили ядерные двигатели."
 vnr_ship_hull_submarine_5: "Корпус подлодки холодной войны"
 vnr_ship_hull_submarine_5_desc: "В 1950-х годах ядерная энергия частично заменила дизель-электрические двигатели. Также было разработано оборудование для извлечения кислорода из морской воды. Эти два новшества позволили подводным лодкам оставаться под водой в течение недель и месяцев."
 
 vnr_ship_hull_merchant_carrier: "Корпус торгового авианосца"
 vnr_ship_hull_merchant_carrier_desc: "Торговый авианосец - это авианосец ограниченного назначения, адаптированный путем добавления взлетной палубы к сухогрузу или нефтяному танкеру, что позволяет ему использовать противолодочные самолеты для поддержки конвоев." 
 vnr_ship_hull_mega_carrier: "Корпус стратегического ударного авианосца"
 vnr_ship_hull_mega_carrier_desc: "К концу 1940-х годов ядерное оружие стало применяться в реальных боевых действиях. Его ужасающая мощь, обрушившаяся на населенные города, вынудила все крупные страны разработать и внедрить средства ядерной триады. Тяжелые реактивные бомбардировщики были единственным способом доставки ядерных бомб на большие расстояния до изобретения межконтинентальных баллистических ракет. Это побудило военно-морской флот предложить мобильную платформу для нанесения ядерных ударов, которой стал ударный авианосец."
 vnr_ship_hull_arsenal_ship: "Корпус корабля-арсенала"
 vnr_ship_hull_arsenal_ship_desc: "Разработка и массовое производство ракет сделали их еще дешевле, чем другие военные средства. Концепция большого надводного корабля, несущего сотни ракет, была разработана для ведения интенсивных и точных береговых бомбардировок. Некоторые эксперты назвали его кораблем-арсеналом."
