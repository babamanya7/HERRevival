  news.339.t:0 "Хорти отстранен от власти!"
  news.339.d:0 "Лидер Венгрии регент Миклош Хорти был отстранен от власти силой после того, как группа спецназа во главе с Отто Скорцени захватила Хорти и его сына, взяв их под стражу, и Хорти был вынужден отказаться от власти из-за угрозы жизни его сыновей. Лидер партии «Скрещенных стрел» Ференц Салаши занял место Хорти и должен продолжать войну до самого конца."
  news.339.a:0 "Венгрия будет боротся!"
  
  ww2_germany.45.t:0 "Клюге найден мертвым"
  ww2_germany.45.d:0 "Фельдмаршал Гюнтер фон Клюге был найден мертвым сегодня, он покончил с собой таблеткой цианида после того, как фюрер отозвал его в Берлин после провала чудовищного покушения, в котором Клюге играл второстепенную роль, но значительную в предательстве Рейха и его народа."
  ww2_germany.45.a:0 "Нелояльная свинья"

  sov_armor.806.t:0 "Сообщение 'Рамзая'"
  sov_armor.806.d:0 "[GetDateText] Рихард Зорге сообщил в Ставку о принятом на сверхсекретном совещании у японского императора 6 сентября 1941 решении Японии не вступать в войну с СССР до конца 1941 года и в начале 1942 года. Если мы прислушаемся к этому донесению, то можно будет снять с восточных границ свежие дивизии и перебросить их под Москву, предотвратив захват столицы Гитлеровскими войсками."
  sov_armor.806.a:0 "Стоит прислушаться"
  sov_armor.806_tt:0 "§GНалёты на дальний восток полностью прекратятся, держать войска там более не требуется§!"

















  #################################################################################### Events ####################################################################################

  ger_armor.305.t:0 "Русская Зима"
  ger_armor.305.d:0 "Выпал первый снег. Началась русская зима, известная как одна из причин поражения Наполеона в 1812 году. Другим фактором, затрудняющим военное маневрирование, является «распутица», или «генерал грязь», явление, происходящее в России с осенними дождями и весенними оттепелями, когда движение по неулучшенным дорогам затруднено из-за распутицы."
  ger_armor.305.a:0 "Вот незадача!"

  finland.10.t:0 "Мирные переговоры с СССР"
  finland.10.d:0 "Наша вторая война с советским режимом оказалась не такой успешной, как мы надеялись. В Москве назначена встреча, на которой нам будет предложена возможность заключить мир, но нам придется уступить любую завоеванную территорию и легализовать коммунизм в обмен на сохранение суверенитета Финляндии. \n\nФинские силы быстро истощаются, и мы больше не можем рассчитывать на помощь Германии. Возможно, это наша единственная надежда на мирное разрешение конфликта, однако нам придется провести демилитаризацию и выплатить военные репарации."
  finland.10.a_tt:0 "§YЕсли СССР согласится\n§!"
  finland.10.a:0 "В этой войне не победить"

  finland.11.t:0 "Финляндия просит мира"
  finland.11.d:0 "Война с Германией обошлась дорого, но, поскольку мы смогли оттеснить гитлеровскую армию, мы получили убедительное предложение из Финляндии. Мы сохраняем контроль над нашей территорией, завоеванной в ходе зимней войны, а Финляндия уходит из Оси и сохраняет нейтралитет, взамен мы выводим свои войска и прекращаем дальнейшие боевые действия.\nЭто завершит наше наступление на Финляндию без полного контроля над регионом, но, в свою очередь, позволит нам сосредоточиться на войне против Германии."
  finland.11.a:0 "это терпимые условия"

  chi_armor.802.t:0 "Инцидент в Ояме"
  chi_armor.802.d:0 "Вскоре после события Марко-Поло в Шанхае произошел еще один инцидент, в результате которого от рук китайцев погиб японский лейтенант. Несмотря на то, что вина лежит на Японии, мы получили диковинные требования о деэскалации ситуации, мы ожидаем, что это будет дымовой завесой, пока японская армия не сможет отправить подкрепление, мы должны сделать то же самое."
  chi_armor.802.a:0 "Война на горизонте"
  
  fra_armor.814.t:0 "The cabinet resigns"
  fra_armor.814.d:0 "The Chamber of Deputies elected Reynaud premier Minister, but by only a single vote with most of his own party abstaining. The new government is especially unstable; many on the Right demanded that Reynaud attack not Germany, but the Soviet Union. The Chamber also forced Daladier, whom Reynaud held personally responsible for France's weakness, to be Reynaud's Minister of National Defence and War."
  fra_armor.814.a:0 "Paul Reynaud will lead the new government."

  fra_armor.815.t:0 "Provinces switch Allegiance!"
  fra_armor.815.d:0 "Provinces in central Africa, India, China and in the Pacific have all declared their support for the free French regime. This act has already destabilized both the legitimacy of our government and the people's trust in us. If we are to regain these colonies then joining the Axis might be our best hope..."
  fra_armor.815.a:0 "We are the true government!"
  fra_armor.815.b:0 "We shall wait until the war ends"

  fra_armor.73.t:0 "North Africa Rebels!"
  fra_armor.73.d:0 ""
  fra_armor.73.a:0 "We are the true government!"

  fra_armor.804.t:0 "Declare Paris an Open City"
  fra_armor.804.d:0 "With the German army closing in on Paris, our government have lost faith in our military's ability to win the war. In order to save Paris from utter destruction the French Government has decided to declare Paris an open city and have begun moving the government out of Paris"
  fra_armor.804.a:0 "Evacuate the Capital!"

  fra_armor.805.t:0 "Paris Declared an Open City"
  fra_armor.805.d:0 "With the French Government completely disjointed, our military victorious have convinced them that further fighting is futile, and upon witnessing our war machine they have decided to declare Paris an open city allowing our forces free entry. We have a narrow window to seize this opportunity incase the French military defy there government orders and decide to make Paris a frontline city"
  fra_armor.805.a:0 "The War is Won"

  fra_armor.806.t:0 "France forms the European Coalition"
  fra_armor.806.d:0 "The French governement has announced their intention to unite Europe under one banner, to counter 'the growing threat of hostile forces and consolidate our own security'. While the power of France has skyrocketed in the recent years, it is still unsure what their real intents are. We still have to make a choice. Should we join them, or should we refuse to integrate France's project ?"
  fra_armor.806.a:0 "We should join them"
  fra_armor.806.b:0 "We have other things to do"

  fra_armor.807.t:0 "[From.GetName] agrees to join the European Coalition"
  fra_armor.807.d:0 "[From.GetName] agrees to join the European Coalition"
  fra_armor.807.a:0 "They picked the right choice."

  fra_armor.808.t:0 "[From.GetName] refuses to join the European Coalition"
  fra_armor.808.d:0 "[From.GetName] refuses to join the European Coalition"
  fra_armor.808.a:0 "Too bad for them."

  fra_armor.809.t:0 "Extensive Conscription"
  fra_armor.809.d:0 "Planning for a major war has allowed us to begin concripting a large amount of our population immediately for the deployment on the frontlines"
  fra_armor.809.a:0 "This should give us plenty of manpower"

  fra_armor.810.t:0 "[FRA.GetName] asks for Monetary support"
  fra_armor.810.d:0 "[FRA.GetName] has request aid in their struggle against their enemies. Much of the previous years has seen France on early mobalization and that has led to a shortage of funds for a long term war. Should we aid them?"
  fra_armor.810.a:0 "Helping them is in our best interest"
  fra_armor.810.b:0 "We are not interested in the situation fo France"

  fra_armor.811.t:0 "[USA.GetName] Sends Aid!"
  fra_armor.811.d:0 ""
  fra_armor.811.a:0 "Our thanks to the Americans!"

  fra_armor.812.t:0 "[USA.GetName] Rejects to Send Aid"
  fra_armor.812.d:0 ""
  fra_armor.812.a:0 "A massive dissapointment"

  fra_armor.894.t:0 "The Beirut Conference"
  fra_armor.894.d:0 "With the war in Europe progressing apace, it is time for the inevitable victors to consider the future of Germany.\n\nWe may propose to [beirut_partner.GetNameDef] a conference on the division of [GER.GetNameDef] after the war, to delineate our spheres of influence on the continent.\n\nOur "friends" in [beirut_partner.GetNameDef] have indicated that they would be interested in such a conference. No doubt, they will want some kind of reward for their sacrifices."
  fra_armor.894.a:0 "We need a conference on the future of Germany."
  fra_armor.894.b:0 "We cannot cooperate with [yalta_partner.GetNameDef]."

  fra_armor.895.t:0 "The Beirut Conference"
  fra_armor.895.d:0 "With the war against [GER.GetNameDef] marching towards its inevitable conclusion, [yalta_origin.GetNameDef] has approached us about a conference on the future of Germany.\n\nThey are suggesting a division of [GER.GetNameDef] between east and west. This would allow our sphere of influence to extend deep into Europe, which would make up for some of the losses we have suffered in this gruesome struggle."
  fra_armor.895.a:0 "For the sake of lasting cooperation."
  fra_armor.895.b:0 "We will dictate our own peace."

  FRA_rhineland_puppet_tt:0 "§YThe Rhineland area will be put under Direct French Control and the remainder of Germany will be put under a French friendly regime§!"

  italy.1.a:0 "Annex them into the empire"
  italy.1.b:0 "Set up a puppet state"

  ita_armor.817.t:0 "Italy in Crisis"
  ita_armor.817.d:0 "With our large territorial losses in Africa and in Sicily, our people are demanding an end to the war and protests have begun all over our cities with there being rumours of an emerging rebellion in the south. To restore the faith of the people we must retake Sicily and show that Italy will not fall!"
  ita_armor.817.a:0 "We must immediately counterattack!"

  ita_armor.811.t:0 "War with Ethiopia continues"
  ita_armor.811.d:0 "our people are growing weary and uncertain about our government due to the lack of a conclusion to the war in Ethiopia. From our propaganda efforts they consider Ethiopia as an easy target with which our military can easily conquer. We should redouble our efforts to end the war quickly before the people lose faith in us."
  ita_armor.811.a:0 "We are losing the peoples support"

  ita_armor.812.t:0 "War with Ethiopia continues"
  ita_armor.812.d:0 "our people are surprised that we are still at war with Ethiopia, with headlines calling for an inquire into our military staff. The people are now losing faith in our military's capability of fighting wars"
  ita_armor.812.a:0 "We need to redouble our efforts"

  ita_armor.813.t:0 "War with Ethiopia Continues"
  ita_armor.813.d:0 "the population is shocked that the war is still not over! They have serious doubts about our military and any aggressive foreign policy we might employ on other nations"
  ita_armor.813.a:0 "We need a new plan"

  ita_armor.814.t:0 "War with Ethiopia Continues"
  ita_armor.814.d:0 "The people are calling for an end to hostilities with Ethiopia. Seeing the cost of a lengthy war with such a small nation has completely demoralized everyone at home"
  ita_armor.814.a:0 "We have to finish the war now"

  ita_armor.815.t:0 "War with Ethiopia Continues"
  ita_armor.815.d:0 "With still no end in sight, mass protests are appearing all over the country, with our military and police joining in rather than stopping this! Mass riots are sure to appear"
  ita_armor.815.a:0 "Our population is demoralized"

  ita_armor.818.t:0 "Italy Offers Protection"
  ita_armor.818.d:0 "Italy approached us with an offer to guarantee our independence in exchange for equipment. With our vulnerable position sandwiched between many nations, an offer such as this could be of great help. It does require alot of faith in Italy however..."
  ita_armor.818.a:0 "We Shall agree"
  ita_armor.818.b:0 "We are alright by ourselves"

  ita_armor.819.t:0 "Czechoslovakia agrees to our offer"
  ita_armor.819.d:0 "Czechoslovakia has seen our offer of protection was a wise choice and are in no doubt that we are a valuable ally to have. They agreed shipments of weapons to us which should help us modernize our army"
  ita_armor.819.a:0 "Excellent"

  ita_armor.820.t:0 "Czechoslovakia rejects to our offer"
  ita_armor.820.d:0 "Czechoslovakia does not see us as a valuable ally and has rejected our offer of protection. As unfortunate as this is, it will not hinder us becoming a European superpower"
  ita_armor.820.a:0 "No matter"

  ita_armor.821.t:0 "Italian Ultimatum"
  ita_armor.821.d:0 "Italian diplomats have presented an ultimatum to us demanding that we submit to their occupation! We have been fooled to think that the Italians would respect our independence despite them allying with us. There is little hope we can resist an invasion alone..."
  ita_armor.821.a:0 "We must Submit"
  ita_armor.821.b:0 "Mount a resistance"

  ita_armor.822.t:0 "Bulgaria Yields"
  ita_armor.822.d:0 "Upon assessing the situation, The Bulgarian government has rightly concluded that our will cannot be challenged. We have already given the order to start moving troops into Bulgaria and we now hold their key cities. This is another step towards the restoring the Great Roman empire!"
  ita_armor.822.a:0 "Excellent"

  ita_armor.823.t:0 "Bulgaria Rejects Ultimatum"
  ita_armor.823.d:0 "Despite the vast difference in strength, Bulgaria has rejected occupation and has severed ties with us. If we are to occupy them, some more aggressive diplomacy is needed..."
  ita_armor.823.a:0 "We shall use force then"

  ita_armor.824.t:0 "Italy Demands Istanbul"
  ita_armor.824.d:0 "Italy has come to us with quite an outlandish demand that we handover the prized city of Istanbul citing that they wish to restore the Roman empire. While they might think themselves invincible, they are serious. Can we afford to go to war?"
  ita_armor.824.a:0 "We are ill prepared for war"
  ita_armor.824.b:0 "They shall Never have it!"

  ita_armor.825.t:0 "Turkey Transfers Territory"
  ita_armor.825.d:0 "To our surprise Turkey has accepted our demands, most likely because they do not wish to be drawn into the wider conflict. This is a great victory for us!"
  ita_armor.825.a:0 "Excellent"

  ita_armor.826.t:0 "Turkey dismisses Italian Claims"
  ita_armor.826.d:0 "Turkey has rejected any of our claims over the city and are prepared to defend there territory. While not the most surprising outcome, it is still nonetheless undesirable."
  ita_armor.826.a:0 "It was a slim chance"

  ita_armor.827.t:0 "Istanbul Conquered"
  ita_armor.827.d:0 "With the conquer of Istanbul, many politicians and the public themselves have provided support for restoring the city to its original heritage, starting with its name."
  ita_armor.827.a:0 "Revive the old Capital!"

  ita_armor.828.t:0 "Germany proceeds with Anschluss"
  ita_armor.828.d:0 "Despite our guarantee of independence for Austria, it has not swayed Germany from seeking Anschluss with the Austrian people. This puts us in a difficult situation, whether we stand by our commitment and risk war or do we back down."
  ita_armor.828.a:0 "We cannot hope to win"
  ita_armor.828.b:0 "We standby our commitments"

  ita_armor.829.t:0 "Italy withdraws support for Austria"
  ita_armor.829.d:0 "Due to us proceeding with Anschluss, Italy has rather embarrassingly withdrawn there guarantee of independence for Austria. This a major blow to the Italian's reputation and has likely stirred instability in their country. However for us this a great success and we should be able to proceed with Anschluss without any fear of Italian opposition. Ashame they do not see the future like we do."
  ita_armor.829.a:0 "We will unite the German people!"

  ita_armor.830.t:0 "Italy Issues warning"
  ita_armor.830.d:0 "Due to us proceeding with Anschluss, Italy has reaffirmed its stance towards keeping peace in Europe. The more likely reason is that they see German expansion as a threat. Thus we are the left with a potential war with the Italians and significantly heightening tensions if we proceed with Anschluss that could be costly for the Reich"
  ita_armor.830.a:0 "None shall stop us"

  ita_armor.831.t:0 "Mussolini gets Dismissed as Head of government"
  ita_armor.831.d:0 "Yesterday morning the King stormed Mussolini's parliament building and demanded for the removal of the Head of State and his subordinates. This included the removal of multiple generals and Chief of staffs. Having the ultimate authority, aswell as support from the people and many members of the fascist council Mussolini has been arrested and King Victor Emmanuel has assumed current leadership of Italy. In a speech to assure the people of Italy, the King revealed Mussolini's plans to form a Roman Empire which would of lead Italy into disaster and defeat. With full control over Italy, the world wonders what is next for Italy."
  ita_armor.831.a:0 "Only the King is suited for rule"
  ita_armor.831.b:0 "We should move towards a true Democracy"
  Vatican_attitude_tt:0 "The £faction_ita_vatican Vatican become §Gmore friendly§!"

  ita_armor.832.t:0 "Mussolini escapes imprisonment!"
  ita_armor.832.d:0 "Following the removal of Mussolini as prime minister, his escort to prison was ambushed by what is no doubt the blackshirts who remain loyal to him. Police were too late to prevent his escape and an investigation doubled with missing officers has shown us that there is still deep rooted support for fascism within to country and its government."
  ita_armor.832.a:0 "Begin the manhunt for Il Duce!"

  ita_armor.833.t:0 "Trouble in the north"
  ita_armor.833.d:0 "Multiple officers have reported trouble amongst their ranks. Many Soldiers are still politically aligned to Mussolini and many officers have resigned in protest to his dismissal. High command is very worried about our heartland in the North who saw great success under Mussolini's rule and is rumored to be harbouring Il Duce"
  ita_armor.833.a:0 "We must counter his influence"

  ita_armor.834.t:0 "Italy Demands Savoy"
  ita_armor.834.d:0 "Italy citing Savoy's Italian population, are seeking to expand their frontier zone around the area to strengthen Italy. However, we are the ones who will decide that."
  ita_armor.834.a:0 "I suppose they can have Savoy"
  ita_armor.834.b:0 "They need more than a few thousand dead"

  ita_armor.835.t:0 "Italy Demands Corsica"
  ita_armor.835.d:0 "Italy citing Corsica's Italian population, are seeking to expand their frontier zone around the area to strengthen Italy. However, we are the ones who will decide that."
  ita_armor.835.a:0 "Corsica is more useful under there control"
  ita_armor.835.b:0 "They need more than a few thousand dead"

  ita_armor.836.t:0 "Italy Demands Malta"
  ita_armor.836.d:0 "Italy citing Malta's Italian population, are seeking to expand their frontier zone around the area to strengthen Italy. However, we are the ones who will decide that."
  ita_armor.836.a:0 "I expect great things by giving Malta"
  ita_armor.836.b:0 "Such a prize should remain with us"

  ita_armor.837.t:0 "Italy Demands Dalmatia"
  ita_armor.837.d:0 "Italy citing Dalmatia's Italian population, are seeking to expand their frontier zone around the area to strengthen Italy. However, we are the ones who will decide that."
  ita_armor.837.a:0 "Dalmatia is irrelevant, let them have it."
  ita_armor.837.b:0 "They need more than a few thousand dead"

  ita_armor.838.t:0 "Italy Demands Ticino"
  ita_armor.838.d:0 "Italy citing Ticino's Italian population, are seeking to expand their frontier zone around the area to strengthen Italy. However, we are the ones who will decide that."
  ita_armor.838.a:0 "They can have Ticino if it makes them happy"
  ita_armor.838.b:0 "They need more than a few thousand dead"

  ita_armor.839.t:0 "[From.GetName] Accepts our demands"
  ita_armor.839.d:0 "[From.GetName] has seen the wisdom of supporting our demands for our rightful territory and have surrendered Savoy it to us."
  ita_armor.839.a:0 "Excellent"

  ita_armor.840.t:0 "[From.GetName] Rejects our demands"
  ita_armor.840.d:0 "[From.GetName] has seen fit to thwart our modest, fair and reasonable demands for our rightful territory."
  ita_armor.840.a:0 "Unacceptable."

  ita_armor.841.t:0 "[ITA.GetName] Proposes a plan to Seize Gibralter"
  ita_armor.841.d:0 "[ITA.GetName] proposed we gather our most radical nationalists and instigate riots and sabotage in Gibralter as a means of weakening it. This will open up the rock to our forces to seize our rightful claim. This plan is dangerous and will msot likely lead to a war with [ENG.GetName] if they do not give up the Rock. However if war is inevitable then this would put us in the most favourable position"
  ita_armor.841.a:0 "Lets give this our stamp of approval"
  ita_armor.841.b:0 "War with the [ENG.GetName] is too dangerous"

  ita_armor.842.t:0 "[SPR.GetName] has agreed to our Plan"
  ita_armor.842.d:0 ""
  ita_armor.842.a:0 "Brilliant"

  ita_armor.843.t:0 "[SPR.GetName] has rejected our Plan"
  ita_armor.843.d:0 ""
  ita_armor.843.a:0 "They do not see war as inevitable"

  ita_armor.844.t:0 "Trouble in Gibralter"
  ita_armor.844.d:0 "Radicals from Spain have begun gathering in around Gibralter and while intially were protesting peacefully, the situation has escalated into riots. Reports of people crossing the water have also been cropping up and the integrity of our military base could potentially be compromised"
  ita_armor.844.a:0 "We need to immediately reinforce the rock"

  ita_armor.845.t:0 "Success at Gibralter"
  ita_armor.845.d:0 "Reports have come in of our success in the sabotaging of Gibralter's forts and bases. British troops are disorganized and are busy with containign the chaos we have created, if there was a time to strike, it is now."
  ita_armor.845.a:0 "We scared them well, but we have changed our mind"
  ita_armor.845.b:0 "Now is the time to strike!"

  ita_armor.846.t:0 "The [?global.year|0] Election"
  ita_armor.846.d:0 "A month after the end of our civil war, the people have casted their votes and with a slim victory the..."
  ita_armor.846.a:0 "...Partito Popolare Italano has won"
  ita_armor.846.b:0 "...Partito Nazionale Monarchico has won"
  ita_armor.846.c:0 "...Partito Comunista Italano has won"
  ita_elections_requirment_tt:0 "New Elections have taken place"

  ita_armor.847.t:0 "King Victor Emmanuel III Steps down"
  ita_armor.847.d:0 "After winning the election, the ever humble King Emmanuel has taken his first action as the head of Italy to put his cousin Ferdinando Adalberto incharge of the country citing poor health. He has emphasized that strong and popular leadership is needed for Italy to forge a strong path ahead and has put his full confidence behind the new leader."
  ita_armor.847.a:0 "Long Live the new King!"

  ita_armor.848.t:0 "Send an Ultimatium?"
  ita_armor.848.d:0 "Yugoslavia cannot expect to withstand to win in a fight between our countries, if we send them a demand for our rightfully claimed land in Dalmatia they may just hand it over without a fight."
  ita_armor.848.a:0 "Do it"
  ita_armor.848.b:0 "Now is not to most oppertune time"

  ita_armor.849.t:0 "Italy Demands Dalmatia"
  ita_armor.849.d:0 "Italian forces are concentrating on the other side of our border, and their diplomats have demanded that we cede all of Dalmatia to them! Should we resist?"
  ita_armor.849.a:0 "No. It is hopeless."
  ita_armor.849.c:0 "Yes! We will not give up our territory without a fight!"

  ita_armor.850.t:0 "[YUG.GetName] Surrenders Dalmatia"
  ita_armor.850.d:0 "The Yugoslavs have wisely folded to our demands and withdrawn all of their forces from Dalmatia. We will incorporate the territory into the union as the Moldavian Soviet Socialist Republic. Its citizenry will now enjoy the benefits of socialism."
  ita_armor.850.a:0 "Excellent"

  ita_armor.851.t:0 "[YUG.GetName] Refuses Our Demands"
  ita_armor.851.d:0 "The Yugoslavs have refused to give in to our demands! It looks like we will have to expel their occupying forces from Dalmatia with force."
  ita_armor.851.a:0 "They will regret this"

  ita_armor.852.t:0 "The Carving up of Central Europe"
  ita_armor.852.d:0 "Our targets are in sight however planners are are insisting we seek out France and Germany in as we are in risk of their military opposition to carve up central Europe. Should we share the spoils or risk going at it alone?"
  ita_armor.852.a:0 "It is safer to find common goals"
  ita_armor.852.b:0 "We do not need to collaborate"
  ita_armor.852.c:0 "there is no one"

  ita_armor.853.t:0 "[ITA.GetName] Proposes a carve up of central Europe"
  ita_armor.853.d:0 "Italy has come to us with a most ambitous of plans, to carve up Central Europe among our spheres of influence and dissolve Switzerland, Austria and Hungary. Such a move will make us a target for other great powers in Europe aswell as create turmoil within Europe. We are definately strong enough but are we ready to reshape Europe?"
  ita_armor.853.a:0 "Small states only serve our enemies"
  ita_armor.853.b:0 "Our interests are not the same"

  ita_armor.854.t:0 "[ITA.GetName] Proposes a carve up of central Europe"
  ita_armor.854.d:0 "Italy has come to us with a most ambitous of plans, to carve up Central Europe among our spheres of influence and dissolve Switzerland, Austria and Hungary. Such a move will make us a target for other great powers in Europe aswell as create turmoil within Europe. We are definately strong enough but are we ready to reshape Europe?"
  ita_armor.854.a:0 "Small states only serve our enemies"
  ita_armor.854.b:0 "We do not agree but lets not get involved"
  ita_armor.854.c:0 "Our interests are not the same"

  ita_armor.855.t:0 "[FROM.GetName] accepts"
  ita_armor.855.d:0 ""
  ita_armor.855.a:0 "Now were on easy mode"

  ita_armor.856.t:0 "[FROM.GetName] rejects"
  ita_armor.856.d:0 ""
  ita_armor.856.a:0 "Let us hope they do not interfere"

  ita_armor.857.t:0 "The Carving up of Eastern Europe"
  ita_armor.857.d:0 "Our armies are ready to conquer eastern Europe, however "
  ita_armor.857.a:0 "It is safer to find common goals"
  ita_armor.857.b:0 "We do not need to collaborate"
  ita_armor.857.c:0 "there is no one"

  ita_armor.858.t:0 "[ITA.GetName] Proposes a carve up of Eastern Europe"
  ita_armor.858.d:0 "Italy has come to us with a most ambitous of plans, to carve up Central Europe among our spheres of influence and dissolve Switzerland, Austria and Hungary. Such a move will make us a target for other great powers in Europe aswell as create turmoil within Europe. We are definately strong enough but are we ready to reshape Europe?"
  ita_armor.858.a:0 "Small states only serve our enemies"
  ita_armor.858.b:0 "Our interests are not the same"

  ita_armor.859.t:0 "[FROM.GetName] accepts"
  ita_armor.859.d:0 ""
  ita_armor.859.a:0 ""

  ita_armor.860.t:0 "[FROM.GetName] rejects"
  ita_armor.860.d:0 ""
  ita_armor.860.a:0 ""

  ita_armor.861.t:0 "[From.GetNameDefCap] invites [Root.GetNameDef] to the [alliance_inviter.GetFactionName]"
  ita_armor.861.d.a:0 "With a suspicious eye on recent developments in world politics, [alliance_inviter.GetNameDef] extends us their hand of friendship, offering us their protection and urging us to stand with them in defence of the principles of liberty and democracy. As a member of the [alliance_inviter.GetFactionName], our people's freedom may well be safeguarded. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Vojvodina and West Banat"
  ita_armor.861.d.b:0 "Recognizing that sometimes even the strong need allies, the [alliance_inviter.GetAdjective] have invited us to join the [alliance_inviter.GetFactionName]. If we choose to accept, this may well provide ample opportunity for us to find our place in the sun. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Vojvodina and West Banat"
  ita_armor.861.d.c:0 "Our ideological allies in [alliance_inviter.GetNameDef] have made note of our valuable contributions to the workers' cause, and this morning we received an invitation us to join the [alliance_inviter.GetFactionName]. Standing together with other socialist republics, we could spread the revolution with renewed strength. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Vojvodina and West Banat"
  ita_armor.861.d.e:0 "It appears the [alliance_inviter.GetAdjective] consider us to be of strategic interest to them, and that they deem it more profitable that we work together than that we should let ourselves be divided by our ideological differences. This morning, the [alliance_inviter.GetAdjective] Ambassador delivered an invitation for us to become a member state of the [alliance_inviter.GetFactionName]. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Vojvodina and West Banat"
  ita_armor.861.a:0 "We will make our stand with them."
  ita_armor.861.b:0 "We only need a few thousand dead..."
  ita_armor.861.c:0 "We will fight alongside our comrades!"
  ita_armor.861.e:0 "It is the profitable choice."
  ita_armor.861.f:0 "We are better off without them."
  ita_armor.861.g:0 "We already have the allies we need."

  ita_armor.862.t:0 "[From.GetNameDefCap] invites [Root.GetNameDef] to the [alliance_inviter.GetFactionName]"
  ita_armor.862.d.a:0 "With a suspicious eye on recent developments in world politics, [alliance_inviter.GetNameDef] extends us their hand of friendship, offering us their protection and urging us to stand with them in defence of the principles of liberty and democracy. As a member of the [alliance_inviter.GetFactionName], our people's freedom may well be safeguarded. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Thrace."
  ita_armor.862.d.b:0 "Recognizing that sometimes even the strong need allies, the [alliance_inviter.GetAdjective] have invited us to join the [alliance_inviter.GetFactionName]. If we choose to accept, this may well provide ample opportunity for us to find our place in the sun. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Thrace."
  ita_armor.862.d.c:0 "Our ideological allies in [alliance_inviter.GetNameDef] have made note of our valuable contributions to the workers' cause, and this morning we received an invitation us to join the [alliance_inviter.GetFactionName]. Standing together with other socialist republics, we could spread the revolution with renewed strength. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Thrace."
  ita_armor.862.d.e:0 "It appears the [alliance_inviter.GetAdjective] consider us to be of strategic interest to them, and that they deem it more profitable that we work together than that we should let ourselves be divided by our ideological differences. This morning, the [alliance_inviter.GetAdjective] Ambassador delivered an invitation for us to become a member state of the [alliance_inviter.GetFactionName]. To encourage our acceptance [alliance_inviter.GetNameDef] has offered us our historical territories of Thrace."
  ita_armor.862.a:0 "We will make our stand with them."
  ita_armor.862.b:0 "We only need a few thousand dead..."
  ita_armor.862.c:0 "We will fight alongside our comrades!"
  ita_armor.862.e:0 "It is the profitable choice."
  ita_armor.862.f:0 "We are better off without them."
  ita_armor.862.g:0 "We already have the allies we need."


  ita_armor.892.t:0 "The Italian Civil War"
  ita_armor.892.d:0 "At exactly 5:00 AM this morning, precisely one day after contact was lost with the Northern garrisons, a well-prepared military operation was launched all throughout Spain with the intention of gaining control of all government institutions and strategic locations in the major cities. Major parts of the Army, Navy, and Air Force have ceased responding to government orders, while concurrently Fascist militias have revolted in the North of the country.\n\nComplete success of this attempted coup has only been prevented by the remaining army who has pledged their loyalt to our king and through quick action, have managed to retain control of the South and many other targets accross the country. This mutiny as predicted is led by Mussolini who after escaping prison has been plotting his seizure to power, the path ahead is nothing short of a nation-wide civil war..."
  ita_armor.892.a:0 "...which, under the leadership of our King, we will win!"
  ita_armor.892.b:0 "...which, as a United People, we will win!"
  death_to_the_fascists:1 "Death to the Fascists!\n"

  ita_armor.893.t:0 "Dismissal of Mussolini"
  ita_armor.893.d:0 "Following our disastrous defeats, many in our party and country have openly spoken out against the continuation of the war. Led by Field Marshal Pietro Badoglio and King Emmanuel, the grand counsel has issued a formal dismissal of Mussolini and the Fascist regime. No doubt they plan to sign an armistice with the allies shortly after.  We have two possible choices, to stand down and let Italy join the allies betraying Germany, or gather our remaining allies, warn Germany and put an end to this rebellion. Either way our future looks grim indeed."
  ita_armor.893.a:0 "We shall stand down"
  ita_armor.893.b:0 "We must crush the traitors!"

  ITA_on_the_brink:0 "§RWill cause a Civil war§!"
  ITA_not_on_the_brink:0 "§GWill avoid a Civil war§!"

  ita_armor.894.t:0 "WW2 comes to an end"
  ita_armor.894.d:0 "With WW2 at an end, we can now focus on rebuilding. Our first action will be moving the capital back to Rome"
  ita_armor.894.a:0 "Time to rebuild"

  ita_armor.895.t:0 "Italy Asks For an Armistice"
  ita_armor.895.d:0 "Following our victory in North Africa and our invasions into Italy, the Italian government has deposed Mussolini and has denounced Fascism. They now seek and armistice with us and are willing to switch sides and fight with us against there former allies. This is a very good opportunity to break the Axis alliance and permanently weaken the Axis in the Mediterranean theatre.\nBy signing this armistice, Italy agrees to hand control of North Africa to us as well as all allied land under the there control, and in return we hand back all land in Italian peninsular."
  ita_armor.895.a:0 "We can accept these terms"
  ita_armor.895.b:0 "We only accept unconditional surrender"

  ita_armor.896.t:0 "Italy reassures loyalty"
  ita_armor.896.d:0 "We have just heard the news that the Italian grand council has arrested Mussolini and have taken over the Italian government. While this move clearly pushes Italy away from Fascism, the new head of the Italian government assures us that Italy will remain loyal to the Axis. However it would be absurd to think that the Italians are not trying to sign an armistice behind closed doors. Therefore we should send troops immediately to Italy to ensure Axis control and prepare an operation to rescue Mussolini should the Italians turn on us"
  ita_armor.896.a:0 "We see through their lies"

  ita_armor.897.t:0 "Allies Sign Armistice"
  ita_armor.897.d:0 "The Allies have accepted our terms and have signed an armistice with us. We should immediately expect German retaliation, our only hope lies with our new allies..."
  ita_armor.897.a:0 "Excellent"
  ita_armor.897.b:0 "We were too late..."

  ita_armor.898.t:0 "Allies Reject Armistice"
  ita_armor.898.d:0 "The Allies have rejected our peace proposal and have said they will only accept unconditional surrender. This is quite unexpected given how much the treaty favoured the Allies, but nonetheless we are left in a dire position with our only hope being in a Axis victory"
  ita_armor.898.a:0 "We shall fight to the death then"

  ita_armor.899.t:0 "End of the Italian Civil War"
  ita_armor.899.d:0 "A long and bloody conflict has come to an end... with the republicans victorious. Through this victory ripples have been made shaking fascism as its birthplace has been purified. The Italian peoples main focus is on rebuilding the country but even more important is the decision on what direction the country to take next."
  ita_armor.899.a:0 "With strength we rebuild"

  jap_armor.800.t:0 "Инцидент на мосту Марко Поло"
  jap_armor.800.d:0 "Японские солдаты готовятся к наступлению на стратегический мост Марко Поло по приказу наших военных генералов без разрешения правительства. при полной поддержке японской армии у нас остается только два очень сложных варианта, но выбор очевиден..."
  jap_armor.800.a:0 "У нас нет выбора"
  jap_armor.800.b:0 "Force them to turn around"

  JAP_ask_for_peace_USA_TT:0 "Must control all Allied pacific islands and territory in Oceania"

  jap_armor.801.t:0 "Japan Offers Peace"
  jap_armor.801.d:0 "Japan has come to us with a peace deal to cease hostilities in the pacific. Following Japanese victories on the pacific islands and the conquest of Oceania they have a very strong foothold in which to repel any attacks from us. While victory is not impossible nor is something we are willing to give up, a few years of peace might give us time to rebuild our fleet and armies for a new invasion of the Pacific. "
  jap_armor.801.a:0 "We shall accept"
  jap_armor.801.b:0 "We will never accept defeat"

  jap_armor.802.t:0 "Allies remain defiant"
  jap_armor.802.d:0 "Even with our tremendous gains in the pacific, the Allies do not accept our peace terms. Perhaps there are invasion plans we do not know about, or there just deluded. Whatever the reason it looks like only an invasion of the United States and an Axis victory in Europe can bring about peace now"
  jap_armor.802.a:0 "We shall be victorious"

  jap_armor.810.t:0 "Инцидент в Ояме"
  jap_armor.810.d:0 "Вскоре после события Марко-Поло в Шанхае произошел еще один инцидент, в результате которого от рук китайцев погиб японский лейтенант. Поскольку наши попытки деэскалации ситуации потерпели неудачу, японская армия запросила немедленную отправку подкреплений, если китайцы не уйдут из Шанхая.."
  jap_armor.810.a:0 "На этот раз мы готовы"

  jap_armor.812:0 "China Renounces the He-Umezu Agreement"
  jap_armor.812.d:0 "China has begun their path of reclaiming the North putting them in direct conflict with our Holdings in East Hebei. Against our Agreement they have moved KMT troops back in the Shandong/Hebei region and are pressing us to give up our Chinese holdings. Our military stands ready should we abide by the terms of the agreement and confront China on the border. This will most likely lead to war. Should we ever even consider rennouncign the agreement, who knows if our military will listen..."
  jap_armor.812.a:0 "This violation will not be tolerated"
  jap_armor.812.b:0 "It is time to withdraw from China"

  jap_armor.813.t:0 "Japan Offers Peace"
  jap_armor.813.d:0 "With Japan having conquered our Far east, we can no longer hope to retake our lost land that lies beyond tough terrain and out of reach of our navy. With this peace deal we cede our far eastern territories and Mongolia to Japan cuting off our access to the Pacific. This is undoubtly a tragic outcome... perhaps a few years of peace can help us rebuild to prepare our revenge and ultimate victory against Japan"
  jap_armor.813.a:0 "We shall have peace for now..."
  jap_armor.813.b:0 "We will never accept defeat"

  jap_armor.814.t:0 "Переворот молодых офицеров подавлен"
  jap_armor.814.desc:0 "Группе молодых офицеров не удалось захватить власть. Однако было убито много офицеров и политиков, а также бывших премьер-министров. Атаки на город Токио и Императорский дворец потрясли нас, но быстрые действия Сугиямы, сплотившего большие силы против повстанцев, предотвратили дальнейшую эскалацию. В сочетании с указом Императора о том, что повстанческая армия должна сдаться, у повстанцев было мало надежды на успех, и многие впоследствии покончили жизнь самоубийством."
  jap_armor.814.a:0 "Наша воля непоколебима"

  jap_armor.815.t:0 "Young Officer Coup Disaster"
  jap_armor.815.desc:0 "A group of young officers have failed in taking over the current government. However many officers and politicans have been assassinated, as well as the former prime ministers. Attacks on Tokyo city and the Imperial Palace have left the nation shakened with much damage and fighting having occured, Despite the Emperor's decree that the rebel army should surrender, his will could not get through to the rebel army and with no unified response a bloodbath ensued."
  jap_armor.815.a:0 "Our Military was disjointed"

  jap_armor.816.t:0 "[MEN.GetName] Requests Control of [927.GetName]"
  jap_armor.817.t:0 "[MEN.GetName] Requests Control of [621.GetName]"
  jap_armor.818.t:0 "[MEN.GetName] Requests Control of [941.GetName]"
  jap_armor.819.t:0 "[MEN.GetName] Requests Control of [926.GetName]"
  jap_armor.820.t:0 "[MEN.GetName] Requests Control of [746.GetName]"
  jap_armor.821.t:0 "[MEN.GetName] Requests Control of [948.GetName]"
  jap_armor.822.t:0 "[MEN.GetName] Requests Control of [756.GetName]"
  jap_armor.823.t:0 "[MEN.GetName] Requests Control of [788.GetName]"
  jap_armor.824.t:0 "[MEN.GetName] Requests Control of [330.GetName]"
  jap_armor.825.t:0 "[MEN.GetName] Requests Control of [789.GetName]"
  jap_armor.816.d:0 "Menjiang was promised all of Mongolian territories when joining us against the Chinese, it would be wise that we honour our arrangment by giving them the promised land we have just taken"
  jap_armor.816.a:0 "We will give them it"
  jap_armor.816.b:0 "We will honour there claims later"

  jap_armor.826.t:0 "Siamese Question"
  jap_armor.826.d:0 "With our recent alliance with Siam, we hold absolute power over them. To better serve the East Asia Co-prosperity Sphere we can either turn them into one of our subjects or do a full invasion to bring Siam into the Japanese Empire"
  jap_armor.826.a:0 "Make them into our subject"
  jap_armor.826.b:0 "fully incorporate them into the empire"

  jap_armor.827.t:0 "[MAN.GetName] Proposes a National Cooperation Government"
  jap_armor.827.d:0 "With the Reorganized National China Government now fully established, Puyi has proposed unification between the two nations to better organize Chinese industry and fulfil the promise we made to him on becoming the emporer of China. If we accept this proposal it will undoubtly lead to a stronger Chinese puppet but may open the door to a more autonomous state."
  jap_armor.827.a:0 "China needs to remain fractured"
  jap_armor.827.b:0 "A stronger China is a stronger Japan"

  jap_armor.828.t:0 "[JAP.GetName] Denounces the National Cooperation Government"
  jap_armor.828.d:0 "Japan probably fearing a strong China has not given us the goahead in this unification"
  jap_armor.828.a:0 "Our future lies in Japan"

  jap_armor.829.t:0 "[JAP.GetName] Approves the National Cooperation Government"
  jap_armor.829.d:0 ""
  jap_armor.829.a:0 "Excellent"
  

  ss_recruitment_event.9.t:0 "Рекрутинговая кампания в Германии"
  ss_recruitment_event.9.desc:0 "В этой титанической борьбе за национальное выживание мы должны использовать все активы и все преимущества. СС хочет вербовать непосредственно из отечества, где есть много тех, кто с радостью взял бы в руки оружие и сражался бы на нашей стороне против угрозы глобального большевизма.\n\nВ то время как Вермахт в принципе согласен с тем, что набор подходящих добровольцев может быть полезен, Генералы ОКВ очень твердо убеждены в том, что любые иностранные добровольцы должны подчиняться военному, а не эсэсовскому командованию."
  ss_recruitment_event.9.a:0 "Теперь у нас есть своя личная армия."


  ger_armor.001.t:0 "Wehrmacht Officers Challenge Hitler"
  ger_armor.001.d:0 "Latent dissatisfaction with Hitler's rule has come to a head with the current crisis, caused by the administration's move to remilitarize the Rhineland. A number of Wehrmacht generals have rallied behind the well-known Field Marshal August von Mackensen, who has put in motion plans aiming to depose Hitler, and to remove the Nazi party from Germany.\n\nWith the split in the German high command becoming clearly apparent even abroad, foreign powers have elected not to protest against the remilitarization, more concerned with the growing internal German instability. The aging Field Marshal has moved quickly, already establishing a provisional government, to which scores have flocked in their opposition to the Nazi government.\n\nThe military coup is already well on its way."
  ger_armor.001.a:0 "Purge this Nazi scum from our lands!"

  ger_armor.857.t:0 "Гитлер найден мертвым"
  ger_armor.857.d:0 "С потерей Берлина Гитлер, непреклонно повторявший, что он не оставит город, решил покончить с собой, предпочтя смерть наблюдению за тем, как антифашистские элементы захватывают власть в стране.Вместо него Карл Дениц теперь возглавил Германию, надеясь спасти армию и нацию, он советует вести переговоры о частичной сдаче ее врагам вместо капитуляции"
  ger_armor.857.a:0 "Мы потеряли всякую надежду"

  ger_armor.858.t:0 "Soviet Union Demands the East"
  ger_armor.858.d:0 "The Soviet Union seeks to reassert there claims on Eastern Poland after we have conquered them, suggesting that the new Europe belongs to both Germany and the Soviet Union. Such lofty claims are backed up with a possible use of force. .\n\nIt seems that our aggressiveness in the east has caused the communists to fear that we might be attacking them next. Ordinarily, giving in to the Bolsheviks easily would be out of the question, but the Soviet Union is far from our only concern. If we agree to their demands, it may buy us time to deal with the west, although it would also position the eastern front significantly further to the west."
  ger_armor.858.a:0 "Give up the east peacefully."
  ger_armor.858.b:0 "We make the demands"

  ger_armor.859.t:0 "Ambitious Porsche"
  ger_armor.859.d:0 "With our go ahead, the new Tiger tanks will be of Henschel design rather than the Porsche. This had not stopped Porsche from already beginning production of its version of the Tiger and now we have up to 50 hulls made, currently with no use."
  ger_armor.859.a:0 "We should convert them into Heavy Tank Destroyers"

  ger_armor.860.t:0 "New Heavy Tank Destroyer"
  ger_armor.860.d:0 "Ferdinand Porsche has come back to us with a completed design for a new heavy tank destroyer based on their Tiger Hulls. It is capable of wielding a longer 88mm and has thick armor, but its reliability raises doubts to its effectiveness."
  ger_armor.860.a:0 "We shall name them after Ferdinand"
  ger_armor.860.a_tt:0 "Add technology §YFerdinand§! and add §G50§! Ferdinand' to the stockpile"

  ger_armor.861.t:0 "Ambitious Porsche"
  ger_armor.861.d:0 "With our go ahead, the new Tiger tanks will be of Porsche design rather than the Henschel. Prior to our decision Porsche already began production of its version of the Tiger and now we have up to 50 hulls made. Lucky for us this means we have 50 tanks ready, and can officially start production with a bonus to efficiency"
  ger_armor.861.a:0 "Lucky for us"

  ger_armor.862.t:0 "Why Die for Danzig?"
  ger_armor.862.d:0 "With our go ahead, war has been declared on Poland, and the reconquest of German territory has begun. However much to our shock, the allies have stood by there commitments and have declared war on us in return. This leaves us caught out with most of our troops on the Polish border and with no plans for continuing the war past Poland. It will take us some time to organize our high command to continue the fight"
  ger_armor.862.a:0 "If they want war, we will give it"

  ger_armor.863.t:0 "Germany Offers Peace"
  ger_armor.863.d:0 "With the Axis achieving total victory in Europe and with the Soviet Union in ruins, Germany offers peace terms to the Allies. Unfortunately, with no major foothold in Europe our chances of winning are slim and perhaps a few years of peace can help us prepare for an eventual victory against the Axis."
  ger_armor.863.a:0 "We shall accept"
  ger_armor.863.b:0 "We will never accept defeat"

  ger_armor.864.t:0 "The Allies Defiant"
  ger_armor.864.d:0 "Even with total victory, the USA is still willing to wage war on us. While a full scale invasion from them is not out of the realm of possibility, it is highly unlikely and we should instead begin preparations for an invasion of the USA."
  ger_armor.864.a:0 "Fools"

  

  ger_armor.866.t:0 "Germany Offers a Cease fire"
  ger_armor.866.d:0 "With the Axis pushing us passed the Urals, taking away almost all of our industry we cannot keep up the war effort, no matter what we can do we cannot hope to retake our lost territories. Germany has offered a cease fire letting us keep everything East of the Urals in exchange for a cease of hostilities. Our chances of winning at this stage are slim and frankly we will not get better terms than this... perhaps a few years of peace can help us rebuild to prepare our revenge and ultimate victory against the Axis"
  ger_armor.866.a:0 "We shall have peace for now..."
  ger_armor.866.b:0 "We will never accept defeat"

  ger_armor.867.t:0 "The Soviets Defiant"
  ger_armor.867.d:0 ""
  ger_armor.867.a:0 "Fools"

  ger_armor.801.t:0 "Germany Proposes an alliance"
  ger_armor.801.d:0 "Following our territorial losses in the winter war, the Germans have approached us with an invitation to join their faction. With the invasion of the Soviet Union underway, we have been given an opportunity to regain our land and extend our influence over all of Northern Scandinavia. This is a tantalizing opportunity but we must be sure that Germany will win. There is also a chance that if we do not accept, we will be opening ourselves to an Axis invasion in the future. Whatever our decision is, there is no going back after it..."
  ger_armor.801.a:0 "We will take up their offer"
  ger_armor.801.b:0 "We will not be pulled into another war"

  ger_armor.802.t:0 "Finland joins the Axis"
  ger_armor.802.d:0 "Although there are differences amongst our Governments, our goal is the same, the destruction of the Soviet scourge.  Our relationship has stretched back since before the Winter War, and it is time for our nations to unite against the Soviets to reclaim and establish what is rightfully due.  The Germans are offering an alliance against the Soviet Union for the greatness of our nations and to avenge those lost to the Soviets."
  ger_armor.802.a:0 "We have promised revenge"

  ger_armor.803.t:0 "Finland refuses our offer"
  ger_armor.803.d:0 "The Finnish have refused and are remaining neutral against those that had once wronged them.  How could their government be so weak as to not seize the opportunity to avenge them!"
  ger_armor.803.a:0 "We will have to redouble our efforts in the North"

  ger_armor.804.t:0 "Смерть Вальтера фон Рейхенау"
  ger_armor.804.d:0 "3 дня назад у Рейхенау произошло кровоизлияние в мозг после охоты под Полтавой при 40-градусном морозе, а сегодня он умер во время перелёта из Полтавы в Лейпциг на лечение."
  ger_armor.804.a:0 "Мы будем оплакивать эту потерю"
  GER_friedrich_paulus_available_tt:0 "§YФридрих Паулюс§! будет доступен в качестве генерала"

  ger_armor.805.t:0 "Смерть Фрица Тодта"
  ger_armor.805.d:0 "8 февраля 1942 года, вскоре после взлета с аэродрома Вольфшанце под Растенбургом в Восточной Пруссии, самолет Тодта внезапно разбился.\n\nВ Берлине были проведены полные похороны, и теперь партия ищет замену в качестве нового министра вооружений. Многие смотрят на Альберта Шпеера как на многообещающего и амбициозного человека, который хорошо подходит для этой роли."
  ger_armor.805.a:0 "Мы будем оплакивать эту потерю"
  
  ger_armor.806.t:0 "Смерть Эрнста Удета"
  ger_armor.806.d:0 "После неудач воздушного блицкрига против Великобритании руководство Третьего Рейха поняло изъяны основной ставки на авиацию тактический поддержки сухопутных войск и Геринг, обвиняя во всех бедах, ограничил полномочия Удета. После нападения на СССР, Эрнст Удет, генерал-полковник авиации, ощущая неспособность обеспечить ведение воздушной войны на два фронта, покончил с собой 17 ноября 1941 года."
  ger_armor.806.a:0 "Мы будем оплакивать эту потерю"
  
  ger_armor.807.t:0 "Germany Invites us to the Axis"
  ger_armor.807.d:0 "With war raging in the Balkans, Germany has reached out to us for assitance with promises of new land for us to own from both Greece and Yugoslavia should we join the Axis"
  ger_armor.807.a:0 "We accept their invitation"
  ger_armor.807.b:0 "We should stay neutral"

  ger_armor.808.t:0 "Bulgaria Declines"
  ger_armor.808.d:0 "Bulgaria has denied our offer and a new Balkan front is not likely to open unless we force it to"
  ger_armor.808.a:0 "We gave them the easy option"
  ger_armor.808.b:0 "Its probably for the best"

  ger_armor.809.t:0 "[JAP.GetName] Offers a Research Exchange"
  ger_armor.809.d:0 "Japan requests an exchange of technologies to help modernize us with our navy and for us to help modernize their army."
  ger_armor.809.a:0 "We accept their offer"
  ger_armor.809.b:0 "We do not need this exchange"

  ger_armor.810.t:0 "[GER.GetName] Accepts the Research Exchange"
  ger_armor.810.d:0 ""
  ger_armor.810.a:0 "Excellent"

  ger_armor.811.t:0 "[GER.GetName] Rejects the Research Exchange"
  ger_armor.811.d:0 ""
  ger_armor.811.a:0 "Ashame"

  ger_armor.812.t:0 "Rudolf Hess Rescued"
  ger_armor.812.d:0 "With our deep push into the UK, our soldiers have come across a prison cell containing our former Chief of the Party Rudolf Hess. He seemed ecstatic when we took control of the building citing German glory and the eminence of the hindered year Reich, but one cannot forget his actions after the fall of France. Now the question remains, what to do with him?"
  ger_armor.812.a:0 "We cannot look past his actions"
  ger_armor.812.b:0 "We should reinstate his rank"

  ger_armor.813.t:0 "[GER.GetName] Demands Alsace Lorraine"
  ger_armor.813.d:0 "Germany is on a path to reclaiming their former glory and it puts them in direct conflict with us. Currently they have their eyes set on Alsace Lorraine, rightful French territory that the Germans once owned. We have been given an ultimatum, give back the land or face war."
  ger_armor.813.a:0 "For now this serves our interests"
  ger_armor.813.b:0 "This is an Outragous Request"

  ger_armor.814.t:0 "[FRA.GetName] Transfers Alsace Lorraine"
  ger_armor.814.d:0 "France has seen it fruitless to go to war with us "
  ger_armor.814.a:0 "A Suprise to be sure, but a welcome one"

  ger_armor.815.t:0 "[FRA.GetName] Rejects our Demand"
  ger_armor.815.d:0 ""
  ger_armor.815.a:0 "We will jsut take it by force then"

  ger_armor.816.t:0 "[From.GetName] Proposes Economic Integration"
  ger_armor.816.d:0 "As we are already closely intertwined, [From.GetNameDef] has come with a proposal to aid us in the expansion of our military economy, by integrating our economies more fully. This would greatly aid both our military growth and bring our countries closer"
  ger_armor.816.a:0 "A great idea"
  ger_armor.816.b:0 "We think not"

  ger_armor.817.t:0 "[From.GetName] Accepts Economic Integration"
  ger_armor.817.d:0 "The [From.GetAdjective] government informs us that they accept our proposal for the integration of our war economies."
  ger_armor.817.a:0 "Under our tutelage their armies will swell."

  ger_armor.818.t:0 "[From.GetName] Rejects Economic Integration"
  ger_armor.818.d:0 "The [From.GetAdjective] government informs us that they reject our proposal for the integration of our war economies."
  ger_armor.818.a:0 "They reject greatness itself!"

  ger_armor.819.t:0 "Picking the New Head of the Wehrmacht"
  ger_armor.819.d:0 "Our first step in securing our Nation is reforming and de Nazifing our Army. With the SS purged we have three candidates who could all be up to the task and help bring glory to our new army."
  ger_armor.819.a:0 "ludwig Beck is proven loyal"
  ger_armor.819.b:0 "Franz Halder could turn out interesting"
  ger_armor.819.c:0 "Walther Von Brauchitsch would be a good option"

  ger_armor.820.t:0 "Picking the New Head of the Luftwaffe"
  ger_armor.820.d:0 "Our luftwaffe was infected with the ego of Goering, below are two candidates to help bring honour back to the luftwaffe and make it a formidable sword of Germany"
  ger_armor.820.a:0 "Albert Kesselring is a good candidate"
  ger_armor.820.b:0 "Ritter Von Greim could work"

  ger_armor.821.t:0 "Picking the New Head of the Kriegsmarine"
  ger_armor.821.d:0 "The Kriegsmarine proved loyal to Germany and not the Nazi's. They are the pride of Germany and we should picking a candidate to help steer them in this new future"
  ger_armor.821.a:0 "Erich Raeder would decimate fleets"
  ger_armor.821.b:0 "Karl Donitz could wreak havoc"

  ger_armor.823.t:0 "Объявление о 4-летнем плане"
  ger_armor.823.d:0 "Экономическое чудо Германского рейха поразило не только немецкий народ, но и международное сообщество, нам нужно встать на путь экономической организации, и Адольф Гитлер объявил о плане, который должен быть реализован в течение следующих четырех лет. Целью этого плана будет установления контроля над экономикой, а также устранение разногласий внутри министерства экономики между Яльмаром Шахтом и Германом Герингом."
  ger_armor.823.a:0 "Путь к величию!"

  ger_armor.824.t:0 "German Mutual Assistance"
  ger_armor.824.d:0 "Germany wants exclusive rights to the materials that we make. In return, they will allow us to have exclusive rights to their resources. It's essentially a win-win situation."
  ger_armor.824.a:0 "We will accept these terms"
  ger_armor.824.b:0 "No thanks, we'll be fine."

  ger_armor.825.t:0 "Italy accepts"
  ger_armor.825.d:0 "Italy accepted our terms and freer trade has opened up between our countries, with investors already setting up in south Tyrol. Hopefully this will allow both our countries to assist each other in our rearmament"
  ger_armor.825.a:0 "Excellent"

  ger_armor.826.t:0 "Italy declines"
  ger_armor.826.d:0 "The Italians have declined our offer and have distanced themselves from Germany. This can only mean they do not wish to align themselves with us and possibly seek a policy that will go against our plans."
  ger_armor.826.a:0 "We should keep a close eye on them"

  ger_armor.836.t:0 "Support for Qingdao"
  ger_armor.836.d:0 "The German Reich has come to us with an offer of further support by means of tank and infantry equipment, however much like the western powers they request that we hand over control of the port city of Qingdao. While the thought of giving up further territory is unthinkable, it would prevent it from falling into Japanese hands should a war break out.."
  ger_armor.836.e:0 "The German Reich has come to us with an offer of further support by means of tank and infantry equipment, however much like the western powers they request that we hand over control of the port city of Qingdao. While this goes against our objective of Japanese hegemony, having an ally outside of Japan could prove very valuable"
  ger_armor.836.a:0 "We can agree on this"
  ger_armor.836.b:0 "Unacceptable"

  ger_armor.837.t:0 "China Accepts our Support for Qingdao"
  ger_armor.837.d:0 "China has agreed to our offer and immediate shipments of equipment are being made to china. Having territory outside of Germany is a great national achievement, and has shown the world that the Reich is here to stay!"
  ger_armor.837.a:0 "China has great potential"

  ger_armor.838.t:0 "China Refuses our Support for Qingdao"
  ger_armor.838.d:0 "China has determined that our support does not warrent giving up territory and has thus refused to accept our offer"
  ger_armor.838.a:0 "They will regret this"

  ger_armor.839.t:0 "Invade Poland?"
  ger_armor.839.d:0 "With Poland seeming to be on the losing side of their war and with no major allies to help them, a great opportunity has been presented to us to seize any claims we may have on their country before they fall in dangerous hands"
  ger_armor.839.a:0 "We shall protect the German people"
  ger_armor.839.b:0 "This is too risky"

  ger_armor.827.t:0 "Germany issues an Ultimatum"
  ger_armor.827.d:0 "Germany has come to the conclusion that [From.GetName] can no longer function as an effective member of the Axis independently and has issued an ultimatum to us. Either accept German control over our government and military, essentially becoming a puppet or risk a more forceful resolution."
  ger_armor.827.a:0 "They should respect our strength!"
  ger_armor.827.b:0 "We will bargain for a better position"
  ger_armor.827.c:0 "We have no choice but to accept"

  ger_armor.828.t:0 "[From.GetName] refuses"
  ger_armor.828.d:0 "[From.GetName] rejects the ultimatum outright!"
  ger_armor.828.a:0 "Now we resort to force"
  ger_armor.828.b:0 "We will back down"

  ger_armor.829.t:0 "[From.GetName] asks for more autonomy"
  ger_armor.829.d:0 "[From.GetName] argues that while we are right in our assessment, they would like to request some more autonomy than what we propose."
  ger_armor.829.a:0 "We shall allow this"
  ger_armor.829.b:0 "we will only accept total control"

  ger_armor.830.t:0 "[From.GetName] accepts"
  ger_armor.830.d:0 "[From.GetName] see's there situation as unstable and leading towards a potential crisis. They have thus accepted our ultimatum in exchange for immediate military support"
  ger_armor.830.a:0 "It is for the greater good" 

  ger_armor.835.t:0 "Germany rejects our proposal"
  ger_armor.835.d:0 "Germany has rejected anything except total control, we are left with two options now..."
  ger_armor.835.a:0 "We just cannot accept this"
  ger_armor.835.b:0 "We have no choice but to kneel"

  germany.98.e:0 "Make a Croatian puppet. Carve up the rest."
  germany.99.e:0 "Split Greece amongst Bulgaria and Italy"

  italy_empire:0 "Italian Empire"

  ger_armor.831.t:0 "Germany declares war!"
  ger_armor.831.d:0 "It seems that Germany wants to go ahead with these absurd demands... traitorous dogs"
  ger_armor.831.a:0 "Our chances are slim"

  ger_armor.832.t:0 "Germany assumes Total control"
  ger_armor.832.d:0 "Following our response, Germany has put us under their thumb and we have no choice but to be kept on a leash. Maybe there is hope to regain our autonomy if we prove ourselves capable"
  ger_armor.832.a:0 "It is for the greater good"

  ger_armor.833.t:0 "Germany asserts dominance"
  ger_armor.833.d:0 "Following our response, Germany has allowed us some autonomy and asserts its control over our country. Maybe there is hope to regain our autonomy if we prove ourselves capable"
  ger_armor.833.a:0 "We are doomed"

  ger_armor.834.t:0 "Germany backs down"
  ger_armor.834.d:0 "Germany recognises the absurdity of their demands and backs down. Although we remain allies tensions have turned high and it would be unwise to place any trust in Germany"
  ger_armor.834.a:0 "We avoided disaster"

  ger_armor.840.t:0 "Fate of Yugoslavia"
  ger_armor.840.d:0 "As the leader of the Axis, Germany has reorganized the occupied country of Yugoslavia in order to appease the claims of all its allies. This has also led to the creation of the new state, Croatia to further Germna interests"
  ger_armor.840.a:0 "We are gracious for German support"

  ger_armor.841.t:0 "Fate of Yugoslavia"
  ger_armor.841.d:0 "As the leader of the Axis, Germany has reorganized the occupied country of Yugoslavia in order to appease the claims of all its allies. This has also led to the creation of the new state, Croatia to further Germna interests"
  ger_armor.841.a:0 "We are gracious for German support"

  ger_armor.842.t:0 "Fate of Yugoslavia"
  ger_armor.842.d:0 "As the leader of the Axis, Germany has reorganized the occupied country of Yugoslavia in order to appease the claims of all its allies. This has also led to the creation of the new state, Croatia to further Germna interests"
  ger_armor.842.a:0 "We should of been given more"

  ger_armor.843.t:0 "Fate of Greece"
  ger_armor.843.d:0 "As the leader of the Axis, Germany has reorganized the occupied country of Greece in order to appease the claims of all its allies."
  ger_armor.843.a:0 "We are gracious for German support"

  ger_armor.844.t:0 "Fate of Greece"
  ger_armor.844.d:0 "As the leader of the Axis, Germany has reorganized the occupied country of Greece in order to appease the claims of all its allies."
  ger_armor.844.a:0 "We are gracious for German support"

  ger_armor.845.t:0 "[GER.GetName] pressures us to close our economy"
  ger_armor.845.d:0 "With Germany being under control of Norway and the important Narvik route, they have issued us the order to cut all trade to other nations who are not part of the Axis. If we issue any objection it will mean certain war"
  ger_armor.845.a:0 "There is no real choice here"
  ger_armor.845.b:0 "we shall remain defiant til the end!"

  ger_armor.846.t:0 "[SWE.GetName] Accepts our demands"
  ger_armor.846.d:0 "Sweden has accepted our offer and has begun to embargo Germany, we ought to protect them for this aid in the war effort."
  ger_armor.846.a:0 "Excellent News"

  ger_armor.847.t:0 "[SWE.GetName] Rejects our demands"
  ger_armor.847.d:0 "The Swedish have refused, citing their neutrality, and are continuing to aid any country who asks whether or not it may assist in the war efforts against us. Our only option is to now invade"
  ger_armor.847.a:0 "We will crush them in a few days"
  ger_armor.847.b:0 "A war with Sweden is too risky"

  ger_armor.400.t:0 "Немецкие войска входят в Прибалтику"
  ger_armor.400.d:0 "As German troops enter the Baltic, local populations have welcomed them in the hopes of regaining their independence. Occupation under the Soviets has been brutal, and as such many inhabitants are eager to join the Germans in their fight against the Soviet Union."
  ger_armor.400.a:0 "We shall liberate all lands of Bolshevik rule"
  german_entry_baltic:0 "15 Compliance will be added to each Baltic State when they are conquered."

  ger_armor.1007.t:0 "Немецкие войска входят в Украину"
  ger_armor.1007.d:0 "As German troops enter the Ukraine, local populations have welcomed them in the hopes of gaining their independence from the Soviet Union, especially after the events of the Holodomor. As such, many inhabitants are eager to join the Germans in their fight against the Soviet Union."
  ger_armor.1007.a:0 "We shall liberate all lands of Bolshevik rule"
  german_entry_ukraine:0 "15 Compliance will be added to each Ukraine State when they are conquered."

  ger_armor.424.t:0 "Italy Requests Dalmatia from Croatia"
  ger_armor.424.d:0 "The Italian government has sent us a request for their direct annexation of the state of Dalmatia from our balkan puppet state Croatia. They argue that, since the initial invasion and subsequent occupation and puppet state were technically a cooperation between German and Italian forces, that if they desire this state from Croatia they should receive it. "
  ger_armor.424.a:0 "They asked nicely, so I suppose"
  ger_armor.424.b:0 "The Third Reich cannot be bothered"

  soviet.13.b:0 "We should back down"

  soviet.65.t:0 "The Soviet Union Demands Annexation"
  soviet.65.d:0 "In order to make up for the strategic ceding of land to Japan, the Soviet Union is demanding our annexation."
  soviet.65.a:0 "Let us forge OUR future together, comrades."
  soviet.65.b:0 "Better dead than red!"

  soviet.66.t:0 "Sinkiang Accepts"
  soviet.66.d:0 "The Sinkiang Government made the wise decision to join the glorious Union!"
  soviet.66.a:0 "Welcome, comrades."

  soviet.67.t:0 "Sinkiang Denies"
  soviet.67.d:0 "The Sinkiang Government has made the unfortunate decision to not accept our very generous offer. How dare they!"
  soviet.67.a:0 "No one will deny us!"

  soviet.68.t:0 "The Soviet Union Demands Submission"
  soviet.68.d:0 "After the remaining Chinese troops were driven out, Sheng Shicai's army and Soviet troops took control of the country. The communists founded our new government under heavy Soviet influence. Since we had their help, they demand even more control."
  soviet.68.a:0 "We shall join our brethren to repay them for their invaluable help."
  soviet.68.b:0 "We don't owe them anything!"

  soviet.69.t:0 "Sinkiang Accepts"
  soviet.69.d:0 "The Sheng Shicai's Government has accepted our gracious offer. This should be adequate repayment for our help."
  soviet.69.a:0 "The Union grows ever larger!"

  soviet.70.t:0 "Sinkiang Denies"
  soviet.70.d:0 "The Sheng Shicai's Government has rejected our offer of membership into the Union. They claim we have already been repaid in full."
  soviet.70.a:0 "They will pay. One way or another."

  soviet.71.t:0 "United States Approves the Lend Lease of Food to Us"
  soviet.71.d:0 "Washington has announced they have approved the lend lease of much-needed food to aid in our Glorious Struggle. Over the next couple years, more than 3,000,000 tons of food will be delivered to feed the population of the Soviet Union. The Holodomor has already gutted our ability to be able to produce food. With the loss of the Ukrainian territories to the bloodthirsty Germans, we would have been unable to sustain ourselves without the Capitalists' help."
  soviet.71.a:0 "Very generous of the Americans"

  soviet.72.t:0 "United States Plans to Build Us With Railroads"
  soviet.72.d:0 "Washington has announced they have approved the lend lease and assignment of engineers to the Soviet Union in order to build and modernize our railway network. Since most of the high infrastructure areas in Europe have been taken by the Nazis, we are in desperate need of supply chains between Moscow and the industrial complexes in the Urals. The US plans to double the amount of railroads currently in the Soviet Union so we can appropriately respond to the fascist menace."
  soviet.72.a:0 "Send my regards to FDR"

  soviet.73.t:0 "United States Plans to Provide Us With Fuel"
  soviet.73.d:0 "Washington has announced they have approved the lend lease of high-octane fuel for our aircraft. Although we continue to produce majority of the oil and fuel we require, our refinement methods are lacking. Since we are unable to produce the high-grade and high-octane fuel required for modern aircraft, the US is stepping in to help us. Since they are planning to provide over half of our aircraft fuel via building refineries for us, we will be able to produce the appropriate fuel required to destroy the Luftwaffe."
  soviet.73.a:0 "Quite considerate of the Capitalists"

  soviet.74.t:0 "United States Approves the Lend Lease of Steel and Aluminium to Us"
  soviet.74.d:0 "Washington has announced they have approved the lend lease of high-grade steel and aluminium to aid in the Great Patriotic War. While we focus on the emergency mass production of war materials to equip the Red Army, quality has suffered. Fortunately, the Americans have planned to produce much of the steel armor plating for our tanks and over half of the aircraft-grade aluminium needed. With these extra resources, we will be able to fend off the Nazi invasion."
  soviet.74.a:0 "We must let the Americans know we are grateful"

  soviet.75.t:0 "United States Plans to Provide Us With Civilian Factories"
  soviet.75.d:0 "Washington has announced they have approved the lend lease of packaged factories and the assignment of engineers to the Soviet Union to help us improve our civilian production. By helping us move and build civilian factories, we can greatly increase the rate at which our civilian economy can recover after the initial onslaught of the Germans."
  soviet.75.a:0 "Thank you very much, USA"

  soviet.76.t:0 "United States Plans to Provide Us With Military Factories"
  soviet.76.d:0 "Washington has announced they have approved the lend lease of high-grade military production equipment. Due to their equipment and tools being of a higher quality, our production will be boosted substantially. It is necessary for us to out-produce the Germans if we have any chance to win. With the help of the American industrial capacity, our industry will be kickstarted and we will be able to win the war."
  soviet.76.a:0 "A toast, to the Americans"

  soviet.77.t:0 "United States Builds the Persian Corridor"
  soviet.77.d:0 "Washington has announced they have approved the construction of a large railway system in Persia to help direct lend lease through the Caucasus to avoid German U-Boats."
  soviet.77.a:0 "An excellent route for Lend Lease"

  sov_armor.853.t:0 "Germany Cedes the East"
  sov_armor.853.d:0 "After we put pressure Germany to give in to our rightful claims on Eastern Poland, they have agreed to cede what we demanded without further conflict. It seems Germany is a friend to the Soviet Union"
  sov_armor.853.a:0 "Lets welcome our Polish friends!"

  sov_armor.854.t:0 "Germany Refuses to Cede the East"
  sov_armor.854.d:0 "Despite our effort to resolve the dispute with Germany peacefully, they have refused to cede Eastern Poland. This clearly shows their intent of continuing to conquer east and we are next on the chopping block. We must mobilize our forces and make a decisive push into the west before Germany has time to complete any preparations"
  sov_armor.854.a:0 "There is no doubt"
    
  sov_armor.800.t:0 "Профессор Евгений Оскарович Патон"
  sov_armor.800.d:0 "Патон был первопроходцем в области технологии соединения и сварки. Чтобы сделать сварку надежным технологическим процессом, необходимо было провести комплексные исследования механики сварных конструкций, связанных с ними металлургических процессов и физики дуги, а также разработать сварочное оборудование, инструменты и приемы. Патон создал методы проектирования рациональных пролетных строений мостов, исследовал условия их эксплуатации, предложил методы восстановления поврежденных мостов. Он провел исследования по основам сварки, расчетам прочности сварных конструкций, механизации сварочных процессов. Руководил разработкой автоматической сварки под флюсом. В годы Великой Отечественной войны руководил разработкой и изготовлением оборудования и технологии для автоматической сварки специальных стали для танков, бомб и другой военной техники."
  sov_armor.800.a:0 "Присвоить ему звание Героя Социалистического Труда!"
  
  sov_armor.700.t:0 "Бомбардировка Горького"
  sov_armor.700.d:0 "Cерия бомбовых авиаударов со стороны немецкой авиации с осени 1941 привело к разрушению промышленного потенциала города. Наибольшие повреждения получил автомобилестроительный завод им. Молотова. За всё время войны вражеские бомбардировщики совершили 43 налёта, из них 26 налётов ночью. На город было сброшено 33 934 зажигательных бомб и 1631 фугасная."
  sov_armor.700.a:0 "Вот незадача!"
  
  sov_armor.801.t:0 "Uk proposes Iran invasion"
  sov_armor.801.d:0 "The United Kingdom proposes a joint effort to occupy Iran to deny Germany and its allies access to its oil reserves. If successful we will occupy the north connecting the Caucasus to Central Asia and the British will occupy the south."
  sov_armor.801.a:0 "We accept these plans"
  sov_armor.801.b:0 "We cannot spare the manpower"

  sov_armor.804.t:0 "Социалистический реализм"
  sov_armor.804.d:0 "Наше Министерство культуры стремилось к тому, чтобы мы могли контролировать не только наше искусство, но и нашу музыку и культуру в целом, чтобы сосредоточиться на самом главном, на повседневном пролетариате. Социалистический реализм покажет труд мужчин и женщин, чья работа сделала Советский Союз такой страной, какой она является сегодня, и помогла продолжить идеалы коммунизма. Благодаря нашему партнерству с Ассоциацией художников революционной России, Обществом художников-станковистов и Союзом советских писателей мы можем продвигать нашу культуру, побуждая наших людей продвигать вперед нашу нацию. Нам нужно определить, на какой области должно быть сосредоточено наше искусство."
  sov_armor.804.a:0 "Вдохновить рабочих"
  sov_armor.804.b:0 "Вдохновить народ"
  sov_armor.804.c:0 "Вдохновить армию"
  sov_armor.804.e:0 "Вдохновить партизан"

  sov_armor.809.t:0 "Возвращение Западной Белоруссии и Украины"
  sov_armor.809.d:0 "Нашими недавними победами мы вернули себе территорию, утраченную в результате войны с поляками, и снова включили этот регион в союз. Давайте поприветствуем наших освобожденных рабочих!"
  sov_armor.809.a:0 "Добро пожаловать в Союз, товарищи!"

  sov_armor.817.t:0 "Набрано 10 резервных дивизий"
  sov_armor.817.d:0 "Не расширяя нашу постоянную армию, наши офицеры выполнили задачу подготовки 100 тысяч человек для использования в наших резервах. Эти люди будут жизненно необходимы в случае начала войны, когда нам потребуется срочное расширение армии."
  sov_armor.817.a:0 "Превосходно"
  sov_armor.817.b:0 "Продолжить подготовку резервистов"

  sov_armor.851.t:0 "The [SOV.GetName] Offers Peace"
  sov_armor.851.d:0 "Following long months of War, plenty of bloodshed has been dealt to either side with meaningless gains. The Soviets declare that the time has come to end hostilities and retreat back to each Nations respective borders. This is a massive win for us and proves that Finland can withstand even the might of the Giant Bear!"
  sov_armor.851.a:0 "We have achieved Victory!"

  sov_armor.820.t:0 "Талантливые новые рабочие"
  sov_armor.820.d:0 "По мере роста нашей промышленности, наш персонал становится все более и более способным в наш век индустриализации и выполняет свои обязанности на хорошем уровне. Со временем все больше и больше рабочих приобретают опыт, и мы можем в полной мере использовать нашу крупную промышленность."
  sov_armor.820.a:0 "Восхитительно"
  sov_armor.820.a_tt:0 "Уменьшает штраф от §YНизкоквалифицорованных рабочих§!"
  
  sov_armor.830.t:0 "Восстановление производства"
  sov_armor.830.d:0 "По мере эвакуации промышленности, наши военные заводы налаживают выпуск военной техники необходимой для ведения войны. Со временем все больше и больше предприятий выходят на высокие показатели производительности труда, и мы можем в полной мере использовать наш военнопромышленный комплекс."
  sov_armor.830.a:0 "Принято к сведению"
  sov_armor.830.a_tt:0 "Уменьшает штраф от §YЭвакуации промышленности§!"

  SOV_can_be_infiltrated:0 "Can be further §HInfiltrated§!.\n"


  sov_armor.829.t:0 "[SOV.GetAdjective] Victory at Perm"
  sov_armor.829.d:0 "Following a clash between [SOV.GetAdjective] and [GER.GetAdjective] forces in the border area around Perm, the [GER.GetAdjective] line broke. [SOV.GetAdjective] units quickly took the oppertunity to send partisans, equipment and supplys through the gaps and establish anti-German activites in Perm.\n\n"
  sov_armor.829.a:0 "We are slowly building our counterattack"
  sov_armor.829.b:0 "We must prepare an appropriate response."

  sov_armor.830.t:0 "[SOV.GetAdjective] Defeat at Perm"
  sov_armor.830.d:0 "Following a clash between [SOV.GetAdjective] and [GER.GetAdjective] forces in the border area around Perm, the [SOV.GetAdjective] forces were defeated and were forced to withdraw."
  sov_armor.830.a:0 "We will have to try better next time"
  sov_armor.830.b:0 "Our line is solid"

  sov_armor.831.t:0 "Stalemate at Perm"
  sov_armor.831.d:0 "Fighting between [SOV.GetAdjective] and [GER.GetAdjective] forces around Perm has died down after both sides withdrew from the contested region to regroup and resupply."
  sov_armor.831.a:0 "We need to prepare for the next incursion"

  sov_armor.832.t:0 "[SOV.GetAdjective] Infiltration at Perm"
  sov_armor.832.d:0 "Following an absence of [GER.GetAdjective] forces, [SOV.GetAdjective]  units quickly took the oppertunity to send partisans, equipment and supplys through the gaps and establish anti-German activites in Perm.\n\n"
  sov_armor.832.a:0 "We are slowly building our counterattack"
  sov_armor.832.b:0 "We cannot abandon the Eastern Front"

