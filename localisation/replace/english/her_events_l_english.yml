  zzz.996.t:0 "Benelux Countries Transfer Control"
  zzz.996.d:0 "In preparation for an invasion of Europe, the governments of Belgium, Luxembourg and Holland have agreed to give the United Kingdom temporary control of its mainland territory when it is retaken. This will allow the United Kingdom to construct new buildings and efficiently repair any damages during the invasion."
  zzz.996.a:0 "We shall not fail them"

  zzz.997.t:0 "Benelux Countries Request's Control"
  zzz.997.d:0 "With the end of the war in Europe, Belgium, Luxembourg and Holland have asked that we return its mainland territory."
  zzz.997.a:0 "Absolutely"

  zzz.998.t:0 "France Transfer's Control"
  zzz.998.d:0 "In preparation for an invasion of Europe, the French government has agreed to give the Unites States temporary control of its mainland territory when it is retaken. This will allow the United states to construct new buildings and efficiently repair any damages during the invasion."
  zzz.998.a:0 "We shall not fail them"

  zzz.999.t:0 "France Request's Control"
  zzz.999.d:0 "With the end of the war in Europe, France has asked that we return its mainland territory."
  zzz.999.a:0 "Absolutely"