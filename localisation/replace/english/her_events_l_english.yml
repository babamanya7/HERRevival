  ww2_germany.52.t:0 "Берлин Пал"
  ww2_germany.52.d:0 "Когда бои идут улица за улицей, дом за домом, до последнего мужчины или женщины, столица рейха, сам Берлин, наконец, неохотно попал в руки врага после одних из самых ожесточенных боев, которые когда-либо были. Но с Берлином или без, война будет продолжаться!"
  ww2_germany.52.a:0 "Война продолжается!"
  
