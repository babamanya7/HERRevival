  eng_armor.804.t:0 "Romania asks for Peace"
  eng_armor.804.d:0 ""
  eng_armor.804.a:0 "Accept Peace"
  eng_armor.804.b:0 "Reject Peace"

  eng_armor.805.t:0 "The UK pressures us to embargo Germany"
  eng_armor.805.d:0 "With Germany’s violation of the Benelux’s neutrality, the United Kingdom pressures us to help stop German aggression.  By shutting down our supply of resources to Germany, hopefully they will see the error in their ways and seek peace in Europe.  We will do this to be in Solidarity with the neutral nations in the world and to prevent yet another war."
  eng_armor.805.a:0 "For Peace!"
  eng_armor.805.b:0 "We wish to not violate our neutrality"

  eng_armor.806.t:0 "Sweden Accepts the Embargo"
  eng_armor.806.d:0 "Sweden has accepted our offer and has begun to embargo Germany, we ought to protect them for this aid in the war effort."
  eng_armor.806.a:0 "Excellent News"

  eng_armor.807.t:0 "Sweden Rejects the Embargo"
  eng_armor.807.d:0 "The Swedish have refused, citing their neutrality, and are continuing to aid the Germans in their war effort against us.  We must take action to stop this!"
  eng_armor.807.a:0 "We must stop the Iron flow at all costs"

  eng_armor.808.t:0 "Germany forces reopening of trade"
  eng_armor.808.d:0 "The disastrous protection of our Scandinavian brothers has led to their destruction, and now the Germans have approached us with demands to re-open our trade with them with threat of invasion.  In order that we prevent our own doom and loss of our democracy, we have no choice but to cave to their demands."
  eng_armor.808.a:0 "We begrudgingly accept."
  eng_armor.808.b:0 "We will not cave to Tyrants!"

  eng_armor.809.t:0 "Sweden opens up Trade"
  eng_armor.809.d:0 "The Swedish government has complied with our arrangements and has lifted the embargo and the iron shall flow."
  eng_armor.809.a:0 "Very Good, we might spare them yet"

  eng_armor.810.t:0 "Sweden Rejects opening up Trade"
  eng_armor.810.d:0 "The Swedish have refused to comply with our demands and have backed with Britain against us. Surely, we shall set them in their place!"
  eng_armor.810.a:0 "Das ist ein Befehl!"

  eng_armor.811.t:0 "Sweden Embargo's us"
  eng_armor.811.d:0 "Britain has used Norway as a means of coercing Sweden to stop trading with us, we must conquer Norway to force the Swedish to reopen trade with us."
  eng_armor.811.a:0 "This spells disaster for our production"
  eng_armor.811.b:0 "We have to retaliate!"

  eng_armor.812.t:0 "The UK embargo's our country"
  eng_armor.812.d:0 "The UK have imposed a complete Embargo on us following our recent political actions. Many of the countries allied under the UK have also followed suite with their declaration. It seems we have to look elsewhere for the resources we require."
  eng_armor.812.a:0 "We have lost vital resource providers"

  eng_armor.813.t:0 "[PER.GetName] requests Peace"
  eng_armor.813.d:0 "Following our conquest of most of Persia, [From.GetName] has requested a ceasfire and will accept a partial occupation of the country until the war in Europe is over"
  eng_armor.813.a:0 "We will carve up the North and West"
  eng_armor.813.b:0 "We want full occupation"

  eng_armor.814.t:0 "[ENG.GetName] Demands Full Surrender"
  eng_armor.814.d:0 "Following our conquest of most of Persia, [From.GetName] has requested a ceasfire and will accept a partial occupation of the country until the war in Europe is over"
  eng_armor.814.a:0 "We will cave in"
  eng_armor.814.b:0 "These demands are upsurd!"

  eng_armor.815.t:0 "Evacuate to Canada?"
  eng_armor.815.d:0 "We are facing the possibility of defeat on our mainland. Should we evacuate the government and the royal family to Canada to ensure our continued fight?"
  eng_armor.815.a:0 "We shall return"
  eng_armor.815.b:0 "We stand and die on Great Britain"
  population_evacuates_tt:0 "§RAround a million population evacuate to Canada§!"

  eng_armor.818.t:0 "Terror attack in Northern Ireland"
  eng_armor.818.d:0 "Following our occupation of Ireland, a rogue faction calling themselves the IRA have launched a terror attack in Northern Ireland in protest of our occupation of Ireland. Demanding full independance from Great Britain, the IRA have said to expect followup attacks until they have achieved their goal,"
  eng_armor.818.e:0 "Following their last attack, the IRA have struck once again attacking factories and infrastructure in Northern Ireland. There seems no end in sight until either we flush them out or meet their demands"
  eng_armor.818.f:0 "After the end of our conflict with the IRA, remaining dissenters attempted to attack Northern Ireland but were stopped. The radicals have been arrested and the police are confident that no further attacks should be expected"
  eng_armor.818.a:0 "We need to deal with this"
  eng_armor.818.b:0 "Bravo"

  eng_armor.819.t:0 "Terror attack in London"
  eng_armor.819.d:0 "Following our occupation of Ireland, a rogue faction calling themselves the IRA have launched a terror attack in London in protest of our occupation of Ireland. Demanding full independance from Great Britain, the IRA have said to expect followup attacks until they have achieved their goal,"
  eng_armor.819.e:0 "Following their last attack, the IRA have struck once again attacking factories and infrastructure in London. There seems no end in sight until either we flush them out or meet their demands"
  eng_armor.819.f:0 "After the end of our conflict with the IRA, remaining dissenters attempted to attack London but were stopped. The radicals have been arrested and the police are confident that no further attacks should be expected"
  eng_armor.819.a:0 "This needs to end quick"
  eng_armor.819.b:0 "Bravo"

  eng_armor.820.t:0 "Terror attack in Birmingham"
  eng_armor.820.d:0 "Following our occupation of Ireland, a rogue faction calling themselves the IRA have launched a terror attack in Birmingham in protest of our occupation of Ireland. Demanding full independance from Great Britain, the IRA have said to expect followup attacks until they have achieved their goal,"
  eng_armor.820.e:0 "Following their last attack, the IRA have struck once again attacking factories and infrastructure in Birmingham. There seems no end in sight until either we flush them out or meet their demands"
  eng_armor.820.f:0 "After the end of our conflict with the IRA, remaining dissenters attempted to attack Birmingham but were stopped. The radicals have been arrested and the police are confident that no further attacks should be expected"
  eng_armor.820.a:0 "We cant give in"
  eng_armor.820.b:0 "Bravo"

  eng_armor.821.t:0 "Terror attack in Liverpool"
  eng_armor.821.d:0 "Following our occupation of Ireland, a rogue faction calling themselves the IRA have launched a terror attack in Liverpool in protest of our occupation of Ireland. Demanding full independance from Great Britain, the IRA have said to expect followup attacks until they have achieved their goal,"
  eng_armor.821.e:0 "Following their last attack, the IRA have struck once again attacking factories and infrastructure in Liverpool. There seems no end in sight until either we flush them out or meet their demands"
  eng_armor.821.f:0 "After the end of our conflict with the IRA, remaining dissenters attempted to attack Liverpool but were stopped. The radicals have been arrested and the police are confident that no further attacks should be expected"
  eng_armor.821.a:0 "We have a crisis on our hands"
  eng_armor.821.b:0 "Bravo"

  eng_armor.822.t:0 "Terror attack in Sheffield"
  eng_armor.822.d:0 "Following our occupation of Ireland, a rogue faction calling themselves the IRA have launched a terror attack in Sheffield in protest of our occupation of Ireland. Demanding full independance from Great Britain, the IRA have said to expect followup attacks until they have achieved their goal,"
  eng_armor.822.e:0 "Following their last attack, the IRA have struck once again attacking factories and infrastructure in Sheffield. There seems no end in sight until either we flush them out or meet their demands"
  eng_armor.822.f:0 "After the end of our conflict with the IRA, remaining dissenters attempted to attack Sheffield but were stopped. The radicals have been arrested and the police are confident that no further attacks should be expected"
  eng_armor.822.a:0 "A deplorable act"
  eng_armor.822.b:0 "Bravo"

  eng_armor.823.t:0 "IRA neutralized"
  eng_armor.823.d:0 "Following successful raids accross Ireland, leaders of the IRA and much of their supporters have either been killed or arrested. This should hopefully be the end of any further attacks"
  eng_armor.823.a:0 "Excellent work"

  eng_armor.824.t:0 "Army Repelled"
  eng_armor.824.d:0 "Following raids accross Ireland, the British Army became involved in heavy fighting and guerilla warfare from the IRA. Unfortunately the leaders of the IRA have managed to retreat to new locations and we are left with little to show for our effort"
  eng_armor.824.a:0 "We will get them next time"

  eng_armor.825.t:0 "IRA Shipments Traced"
  eng_armor.825.d:0 "Analysis of the Raids have shown what equipment the IRA have been using, by following up on shipments made to and from Ireland the police have been able to trace illegal arms suppliers and arrest them. This brings us one step closer to finding the headquarters of the IRA"
  eng_armor.825.a:0 "Good work"

  eng_armor.826.t:0 "IRA Collaborators Found"
  eng_armor.826.d:0 "Raids on possible IRA members have led us to many arrests. Following leads from interegations we have found various IRA agents behind the planning of some future attacks and put a stop to them. Following our previous success, this will make the leadership more desperate and reckless"
  eng_armor.826.a:0 "Excellent job"

  eng_armor.827.t:0 "IRA Leadership Arrested"
  eng_armor.827.d:0 "Tracking a IRA Attack in the making led us to one of the IRA's senior members. Following our interegation, a large raid involving several police departments and special forces teams a large raid had been carried out on a suspected headquarters of the IRA. Lucky for us it was the right place and we now believe the IRA to be neutralized"
  eng_armor.827.a:0 "The threat is atlast over"

  eng_armor.828.t:0 "The League of nations embargo's our country"
  eng_armor.828.d:0 "The League of nations have imposed a complete Embargo on us following our recent political actions."
  eng_armor.828.a:0 "We have lost vital resource providers"

  eng_armor.829.t:0 "The League of nations Lift their embargo"
  eng_armor.829.d:0 "The League of nations have removed their embargo following the easing of tensions"
  eng_armor.829.a:0 "It pays to be on their side"

  eng_armor.830.t:0 "Removal from the League of nations"
  eng_armor.830.d:0 "The League of nations have kicked us out of their faction following our recent actions"
  eng_armor.830.a:0 "We never needed them anyway"

  eng_armor.831.t:0 "Fate of Ethiopia"
  eng_armor.831.d:0 "With the liberation of the Ethiopian peninsula, the question comes as to the future of this land. We can continue our imperialists ways of annexing the land into our empire or restoring Ethiopian autonomy and setting up a friendly government which can become a strong ally."
  eng_armor.831.a:0 "Restore Ethiopia"
  eng_armor.831.b:0 "Annex the land"
  eng_armor.831.c:0 "Annex the land"

  eng_armor.832.t:0 "March onto Cable street"
  eng_armor.832.d:0 "The BUF on one of their marches were stopped at cable street following a gathering of anti fascists. Unfortunately the two clashed leading to many injuries and arrests"
  eng_armor.832.a:0 "This is an appauling event"
  eng_armor.832.b:0 "We should speak out against them"

  eng_armor.833.t:0 "Marches in Lancashire"
  eng_armor.833.d:0 "Following the Disaster on Cable Street, the BUF has tied itself to more traditional values and in particular has advocated for womens rights. This has resonated with the public and their influence and following has grown. How should we approach this?"
  eng_armor.833.a:0 "We need to nip the bud before it blooms"
  eng_armor.833.b:0 "Perhaps we can use them"

  eng_armor.834.t:0 "London City Council Elections"
  eng_armor.834.d:0 "Recent Elections in London has seen a surge of new council members from the BUF to the suprise of everybody. One way or the other we will have to interact with this new Political faction."
  eng_armor.834.a:0 "Darn those Blackshirts"
  eng_armor.834.b:0 "They are becoming more Useful"

  eng_armor.835.t:0 "Defence Regulation 18B"
  eng_armor.835.d:0 ""
  eng_armor.835.a:0 ""

  eng_armor.836.t:0 "BUF protests against War with [GER.GetName]"
  eng_armor.836.d:0 "Our war with Germany has seen protests from the BUF. Firmly believing the Soviet Union as the greater threat, they predict Europe to become too weak through this war to withstand an invasion from the East."
  eng_armor.836.a:0 "We do not compromise principles"
  
  eng_armor.837.t:0 "BUF supports war against the [SOV.GetName]"
  eng_armor.837.d:0 "Our war with Russia has seen much applause from the Radical parties who are lending more support than before to help us win against the 'Red Menace'"
  eng_armor.837.a:0 "Were glad to have their support."

  eng_armor.838.t:0 "The Blitz"
  eng_armor.838.d:0 ""
  eng_armor.838.a:0 ""

  eng_armor.840.t:0 "The War Situation"
  eng_armor.840.d:0 "High command has analysed our strategies for the current predicment we find ourselves in. Hoping that the Soviet Union and Germany could still start a war with each other, they have urged us to stop the war against the Soviets and focus our attention on Germany"
  eng_armor.840.a:0 "This would be most wise"
  eng_armor.840.b:0 "We cannot forgive the Soviet Union"

  eng_armor.841.t:0 "Britain asks for Peace"
  eng_armor.841.d:0 ""
  eng_armor.841.a:0 "Peace will be best"
  eng_armor.841.b:0 "We should stick to this war"

  eng_armor.842.t:0 "[FROM.GETNAME] эвакуирует свой торговый флот"
  eng_armor.842.d:0 "Вслед за вторжением Германии, правительство государства [FROM.GETNAME] отдало приказ направить все торговые суда в Великобританию, чтобы предотвратить их захват немцами"
  eng_armor.842.a:0 "Браво"

  eng_armor.846.t:0 "Trouble in Iraq"
  eng_armor.846.d:0 "Prince Abd al-Ilah has come to us reporting of an imminent coup in Iraq having just escaped arrest. This comes among other reports of pro-British citizens being arrested and politicians being exiled. There is no doubt that we will have to intervene and so we should prepare a taskforce immediately"
  eng_armor.846.a:0 "Preparations need to be made"

  eng_armor.847.t:0 "Soviet Union accepts the proposal"
  eng_armor.847.d:0 "The Soviets see the importance of this invasion and has begun mobilizing troops at the border. As soon as we are ready we will give the signal for the invasion to begin earnest"
  eng_armor.847.a:0 "Excellent"

  eng_armor.848.t:0 "Soviet Union rejects our proposal"
  eng_armor.848.d:0 "The Soviet Union it seems doesn’t accept that Iran is a possible threat or is of any strategic importance to warrant an invasion. This puts us in a position where we could see a much more drawn out war and costly war"
  eng_armor.848.a:0 "We will go alone"
  eng_armor.848.b:0 "The Plan is now too risky"

