l_english:
 her_ger_retirements.1.t: "The Dismissal of Manstein and Kleist"
 her_ger_retirements.1.d: "The position of Army Group South and Army Group A in Ukraine has become critical. Soviet forces have retaken Vinnytsia and Proskuriv, broken toward the Southern Bug, and liberated Mykolaiv. After renewed disagreements with Hitler, Field Marshals Erich von Manstein and Ewald von Kleist have been relieved of command and sent into retirement. Their army groups will pass to new commanders."
 her_ger_retirements.1.a: "Their time has passed."
