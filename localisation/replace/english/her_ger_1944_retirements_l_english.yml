l_english:
 her_ger_retirements.1.t: "The Dismissal of Manstein and Kleist"
 her_ger_retirements.1.d: "Following severe reverses on the Eastern Front and renewed disagreements with Hitler, Field Marshals Erich von Manstein and Ewald von Kleist have been relieved of their commands. On 30 March 1944 both men were summoned to headquarters, decorated, and sent into retirement. Their army groups will pass to new commanders."
 her_ger_retirements.1.a: "Their time has passed."
