l_english:
 her_storage.1.t:0 "Rubber Stockpile Depleted"
 her_storage.1.d:0 "Our strategic rubber reserves have been exhausted. The stockpiles can no longer cover the current industrial demand, and production will have to rely on new domestic output or imports."
