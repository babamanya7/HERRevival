l_english:
 MTG_treaty_renew_mission: "Sign the Second London Naval Treaty"
 MTG_treaty_renew_mission_desc: "The Second London Naval Treaty was intended to limit naval armament growth until its expiration in 1942."
 MTG_naval_treaty_adherent: "London Naval Treaty Signatory"
 MTG_naval_treaty_adherent_desc: "We have signed the London Naval Treaty and are therefore limited in the size of our capital ships. In addition, the London Submarine Protocol (cruiser rules) imposes strict rules on commerce raiding."
 MTG_naval_treaty_adherent_reduced: "Escalator Clause Invoked"
 MTG_naval_treaty_adherent_reduced_desc: "After several signatories of the Washington Naval Treaty declined to join the London Naval Treaty, we invoked the escalator clause, easing restrictions on the size and armament of our capital ships."
 MTG_naval_treaty_adherent_1936: "London Naval Treaty Signatory"
 MTG_naval_treaty_adherent_1936_desc: "We have signed the London Naval Treaty and are therefore limited in the size of our capital ships. In addition, the London Submarine Protocol (cruiser rules) imposes strict rules on commerce raiding."
 MTG_treaty_rejoin_mission: "Accede to the Second London Naval Treaty"
 MTG_treaty_rejoin_mission_desc: "We failed to sign the treaty by the original deadline. This is our last opportunity to join before the escalator clause is activated in one year."
 MTG_escalator_clause_condition: "No country has refused to renew the treaty."
 fascism_renew_naval_treaty_tt: "§RContinuing the naval treaty negotiations will anger most members of our government.§!"
 democracy_renew_naval_treaty_tt: "§GContinuing the naval treaty negotiations will please the public.§!"
 MTG_abandon_treaty_tt: "§RWe will face serious consequences.§!"

 washington_treaty_article_xix: "Washington Naval Treaty: Article XIX"
 washington_treaty_article_xix_desc: "Article XIX of the Washington Naval Treaty prohibits us from constructing new naval bases or coastal fortifications on Pacific islands."