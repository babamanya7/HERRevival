 anti_air_rockets:0 "Противовоздушные ракеты" 
 anti_air_rockets_desc:0 "Развитие ракетостроения способствовало появлению ракет. Помимо применения в наземной войне, флот также пытался объединить это мощное оружие с кораблями. Зенитные ракетные установки использовали ракеты без приборов наведения. Хотя точность была низкой, при попадании они могли нанести непоправимый ущерб самолету. В то же время разработка неконтактных взрывателей также могла бы в определенной степени компенсировать проблему точности."
  
 advanced_sonar:0 "Буксируемая сонарная установка"
 advanced_sonar_desc:0 "Буксируемый сонар также известен как сонар переменной глубины. Он может работать на больших глубинах, что позволяет избежать помех от шума судов.\n\nУстановка этого модуля в §YРазъем для электроники§! на §YЛегких кораблях§! или §YКрейсерах§! поможет им обнаружить §YПодводные лодки§! противника."
 naval_radio_guiding_system:0 "Система радиотехнической наводки ВМФ"
 naval_radio_guiding_system_desc:0 "Первоначально радио использовалось для связи и радиолокации, но в конце войны у него появилась функция дистанционного управления. Военно-морской флот также начал внедрять систему наведения, основанную на радиосигналах на новейшем оборудовании. По сравнению с инерциальными и предустановленными методами наведения, радионаведение также учитывает местоположение цели, что более удобно для атаки движущихся кораблей."
 ship_to_ship_missile:0 "Радиоуправляемая противокорабельная ракета"
 ship_to_ship_missile_desc:0 "Первая противокорабельная ракета с радиоуправлением. Она имеет чрезвычайно высокую скорость и может нанести большой ущерб. Однако для перевозки огромного корпуса ракеты требуется специальная пусковая установка, а установить ее способны не все военные корабли."
 high_speed_light_engine:0 "Котел высокого давления"
 high_speed_light_engine_desc:0 "Недавно изобретенный котел сверхвысокого давления может обеспечить более высокую мощность паровой турбины - около 75 000 л.с., тем самым значительно увеличивая скорость кораблей. Однако из-за нестабильной работы высокоскоростная паровая турбина в настоящее время используется только на небольших кораблях, таких как эсминцы."
 large_destroyer_trend:0 "Большой эсминец"
 large_destroyer_trend_desc:0 "Лидером флотилии был военный корабль, подходящий для командования флотилией эсминцев или других небольших военных кораблей, обычно небольшим крейсером или большим эсминцем. Первоначально часто использовались старые легкие или разведывательные крейсеры, но в начале 1900-х годов быстро увеличивающаяся скорость новых конструкций эсминцев означала, что такие суда больше не могли идти в ногу со своими подопечными. Соответственно, были созданы большие конструкции эсминцев для использования в качестве лидеров.\n\nУстановите §YРоль эсминца-лидера§! на §YЛегкий корпус§!, чтобы усилить §YЛегкую атаку§!."
 escort_destroyer_trend:0 "Эскортный эсминец"
 escort_destroyer_trend_desc:0 "Во время Второй мировой войны появление новых подводных лодок представляло серьезную угрозу для торгового флота. Поскольку большое количество эсминцев было стеснено в боевых действиях, возникла острая необходимость в дешевом и гибком легком эсминце. Эсминцы сопровождения лишились большей части ненужного оборудования, оставив только базовые орудия и глубинные бомбы. Любая военно-морская держава может построить множество кораблей этого типа за несколько месяцев. Благодаря сонарам эти маленькие ребята, действующие на океанском маршруте, стали важным фактором военного потенциала страны.\n\nУстановите §YРоль эскортного эсминца§! на §YЛегкий корпус§!, чтобы снизить §YСтоимость§!."
 destroyer_mass_production:0 "Эсминец массового производства"
 destroyer_mass_production_desc:0 "Масштабные бои на линии фронта привели к огромным потерям эсминцев, которые с трудом могли вынести даже морские державы, имевшие перед войной сотни эсминцев. Для обеспечения эффективности работы флота на эсминцах нового поколения принят простой в производстве режим, при этом время от закладки киля до спуска на воду значительно сокращается."
 sound_surveillance_system:0 "СОСУС"
 sound_surveillance_system_desc:0 "СОСУС, или система звукового наблюдения, представляла собой сеть противолодочного наблюдения, состоящую из большого количества пассивных гидролокаторов. Для строительства такой системы потребовалось построить станции мониторинга на островах и берегах, а усовершенствованная гидроакустическая группа могла отслеживать подводные лодки в этом районе через SOFAR (канал определения и определения местоположения), на глубине которого скорость звука минимальна. Систему также можно использовать для научных исследований, включая гидрологию, географию и морскую биологию."
 destroyer_missile_upgrade:0 "Переоборудование зенитного ракетного эсминца"
 destroyer_missile_upgrade_desc:0 "Во время Второй мировой войны были начаты усилия по разработке ракет класса «земля-воздух», поскольку считалось, что зенитная артиллерия бесполезна против бомбардировщиков, характеристики которых постоянно возрастают. Исследования проводились несколькими крупными державами мира и быстро разработали большое количество типов. По мере развертывания наземной ЗРК она была модифицирована для использования в морских боях.\n\nУстановите §YРоль противовоздушного эсминца§! на §YЛегкий корпус§!, чтобы разблокировать §YРакеты класса "земля-воздух"§!."
  
 early_cruiser_armor:0 "Броня крейсера Великой войны"
 early_cruiser_armor_desc:0 "Крейсерская броня развивалась в годы Великой войны. Защищенные крейсеры заменили в 1890-х годах незащищенные крейсера, а также указали будущее направление развития крейсеров."
 basic_cruiser_armor:0 "Межвоенная броня крейсера"
 basic_cruiser_armor_desc:0 "Ограничение водоизмещения крейсеров, введенное Вашингтонским морским соглашением 1920-х годов, побудило конструкторов принять такие идеи, как наклонная броня, для экономии тоннажа. Крейсера новой конструкции обычно имели среднее бронирование, способное противостоять снарядам старых скорострельных орудий."
 improved_cruiser_armor:0 "Улучшенная броня крейсера"
 improved_cruiser_armor_desc:0 "В условиях надвигающейся напряженности во всем мире Вашингтонская система рушилась, когда Япония и Италия отказались подписать Второе Лондонское морское соглашение, и обе страны начали строить крейсера, превышающие ограничения. Броня крейсеров стала толще и прочнее, как того требует время."
 advanced_cruiser_armor:0 "Усовершенствованная броня крейсера"
 advanced_cruiser_armor_desc:0 "Опыт, полученный в ходе войны, способствовал дальнейшему развитию крейсера. Помимо тяжелой брони, новые крейсера также приняли схему компоновки брони, аналогичную линкору. Сохраняя высокую скорость, больше тоннажа было направлено на броню ключевых частей"
 searchlight:0 "Прожектор"
 searchlight_desc:0 "Комплект мощных фонарей, которые обычно устанавливаются на бортах крейсеров или линкоров для поиска кораблей противника во время ночных боев, а также могут помочь кораблю ориентироваться в туманную погоду. Хотя с его помощью можно получить лучшее поле зрения, при неосторожном использовании он может раскрыть ваше собственное положение."
 treaty_cruiser_trend:0 "Договорный крейсер"
 treaty_cruiser_trend_desc:0 "Опасаясь, что последующая гонка в строительстве более крупных и мощных крейсеров может свести на нет полезность запрета на постройку крупных кораблей, представители США, Великобритании, Японии, Франции и Италии установили ограничения на тоннаж и огневую мощь крейсеров - 10 000 тонн стандартного водоизмещения и 8 дюймов максимального калибра главного орудия."
 colony_cruiser:0 "Колониальный крейсер"
 colony_cruiser_desc:0 "Для защиты огромных колоний при проектировании крейсеров империй всегда учитывались дальность плавания и стоимость. Колониальный крейсер не является крейсером особого класса, но обладает такими особенностями, как низкая стоимость, преимущество в скорости и хорошие мореходные качества. Размещенный вдали от империй, его более чем достаточно для поддержания относительно сильного военно-морского присутствия даже на краю мира.\n\nУстановите §YРоль колониального крейсера§! на §YКорпус крейсера§!, чтобы снизить §YСтоимость§! ."
 cruiser_gun_upgrade:0 "Крейсерский полуавтопогрузчик"
 cruiser_gun_upgrade_desc:0 "С улучшением характеристик эсминцев в 1930-е годы старые скорострельные орудия на крейсерах уже не могли отвечать потребностям реального боя. Для обеспечения боеспособности против эсминцев крейсера оснащались машинами механического заряжания, что повышало скорострельность при экономии живой силы. Хотя эта заряжающая машина по-прежнему требует ручной помощи, она может обеспечить эффективность заряжания, превышающую эффективность заряжания несамозарядных орудий."
 cruiser_aa_upgrade:0 "Переоборудование зенитного крейсера"
 cruiser_aa_upgrade_desc:0 "Хотя многие консерваторы во флоте до сих пор не желают этого признавать, в 1920-х и 1930-х годах характеристики палубной авиации значительно улучшились. Судя по многочисленным проведенным военно-воздушным учениям, некоторые люди увидели доминирование авианосцев в будущих морских боях. Чтобы усилить слабые противовоздушные возможности флота, морские державы начали усиливать зенитные орудия на своих крейсерах в 1930-х годах.\n\nУстановите §YРоль противовоздушного крейсера§! на §YКорпус крейсера§!, чтобы усилить §YПротивовоздушную Оборону§!."
 destroyer_cruiser_trend:0 "Суперэсминец"
 destroyer_cruiser_trend_desc:0 "С появлением крупных эсминцев появился новый тип корабля, обладающий огневой мощью крейсерского уровня на легком корпусе, что еще больше усилило силы легких крейсеров. В разных странах мира его определение в отношении промежуточных вооружений было разным. Он может быть лидером флотилии в эскадре и убийцей эсминцев, если действовать в одиночку. Даже если он встретит крейсер, он сможет спастись, полагаясь на свое преимущество в скорости.\n\nУстановите §YРоль Суперэсминца§! на §YЛегкий корпус§!, чтобы разблокировать §YЛегкую среднюю батарею§!."
 cruiser_radar_sentry:0 "Переоборудование радиолокационного поста"
 cruiser_radar_sentry_desc:0 "Радар полностью изменил способ обнаружения противника в морской войне, даже самые подготовленные наблюдатели не могут сравниться с его дальностью обнаружения. Являясь авангардом флота, крейсера стали первыми военными кораблями, на которых были установлены радары. Развернутые вблизи передовой позиции, крейсера могут обнаруживать противника с помощью радаров на больешм расстоянии, что позволяет флоту обнаружить противника раньше, чем до этого.\n\nУстановите §YРоль радиолокационного пикета§! на §YКорпус крейсера§!, чтобы усилить §YОбнаружение на поверхности§!."
 fighter_directional_system:0 "Система наведения истребителей"
 fighter_directional_system_desc:0 "Предшественником корабельной системы перехвата была разработанная в годы войны тактика совместного перехвата с наземным управлением. Подключив к объединенному центру управления несколько радиолокационных станций, штаб может выдавать истребителям более точную информацию о положении и скорости самолетов противника. С развитием корабельных радаров эта система стала использоваться и в военно-морских операциях. Информация, собранная каждым кораблем, будет суммироваться, чтобы палубные истребители могли более эффективно перехватывать самолеты противника."
 cruiser_missile_upgrade:0 "Переобородувание ракетного крейсера"
 cruiser_missile_upgrade_desc:0 "Это сделало корабельные орудия слабыми и бесполезными перед лицом противокорабельных ракет. Ракеты не только мощнее, но и точнее. Хотя линкоры и могут использовать свое обширное пространство для установки пусковых установок, на крейсерах это не так просто. По этой причине необходимо заплатить небольшую цену.\n\nУстановите §YРакетный крейсер§! на §YКорпус крейсера§!, чтобы разблокировать §YПротивокорабельную ракету§!."
 helipad:0 "Вертолетная площадка" 
 helipad_desc:0 "Идея вертолета была изобретена задолго до 20-го века, но сотни из них были впервые построены и использованы на войне во время Второй мировой. Поначалу вертолеты использовались в небольшом количестве для наблюдения, транспортировки и медицинской эвакуации. Поскольку вертикальный полет позволил бы сэкономить больше места на узкой палубе корабля, флот также увидел в этом прорыве идеальное пополнение запасов для гидросамолетов. Но до того, как были разработаны турбовальные двигатели, вертолеты играли весьма ограниченную роль в морских операциях."
  
 basic_heavy_armor:0 "Межвоенная тяжелая броня"
 basic_heavy_armor_desc:0 "После окончания Великой войны крупные корабли начали использовать более толстую броню, чтобы справиться с быстрым развитием корабельных орудий. Броневые пояса фронтовых линкоров обычно могли достигать толщины более 300 мм, что позволяло в основном защитить от стрельбы ГК, построенных во время войны."
 improved_heavy_armor:0 "Улучшенная тяжелая броня"
 improved_heavy_armor_desc:0 "В 1930-х годах на вновь проектируемых крупных кораблях была применена наклонная броня. Несмотря на немного меньшую толщину, она могла обеспечить такой же уровень защиты, как и более толстая вертикальная броня."
 advanced_heavy_armor:0 "Усовершенствованная тяжелая броня"
 advanced_heavy_armor_desc:0 "В новой тяжелой броне, разработанной во время Второй мировой войны, применялись новейшие технологии производства стали. Новая сталь прочнее и эластичнее, не трескается при косом выстреле некоторых бронебойных снарядов."
  
 incremental_armor_scheme:0 "Пост-Ютландская схема брони"
 incremental_armor_scheme_desc:0 "Ютландское сражение доказало недостатки конструкции брони крупных кораблей. Не имея возможности вести бой на большой дистанции, броня предыдущих линкоров вообще не могла противостоять 15-дюймовым корабельным орудиям. Новая схема брони, разработанная после этого, была также известна как пост-Ютландская схема, которая представляла собой временную конструкцию, в основном усиливающую палубную броню, и вскоре устарела после войны.\n\nУстановите §YСхему брони§! на §YТяжклый корпус§! для усиления §Yброни§! или §YОЗ§!."
 mixed_armor_scheme:0 "Смешанная схема брони"
 mixed_armor_scheme_desc:0 "Смешанная схема представляет собой переходную схему бронирования, появившуюся после войны и в основном интегрировавшую уроки, извлеченные из Ютландии, и идею защиты по принципу «все или ничего». По сравнению с инкрементной схемой, изобретенной 20 лет назад, она имеет лучшее соотношение брони в некоторых наиболее уязвимых местах.\n\nУстановите §YСхему бронирования§! на §YТяжелый корпус§!, чтобы усилить §Yброню§! или §YОЗ§!."
 all_or_nothing_armor_scheme:0 "Схема брони «Все или ничего»"
 all_or_nothing_armor_scheme_desc:0 "Схема «все или ничего» впервые была использована на линкорах типа «Невада», а после этого применялась на всех линкорах США. При условии одинакового тоннажа идея «все или ничего» значительно экономит броню второстепенных зон и использует броневые коробки для защиты хрупкого магазина и главного двигателя. Корабли с такой схемой брони обычно обладают большей живучестью.\n\nУстановите §YСхему брони§! на §YТяжелый корпус§!, чтобы усилить §Yброню§! или §YОЗ§!."
 all_or_nothing_armor_box_armor_scheme:0 "Улучшенная схема брони «Все или ничего»"
 all_or_nothing_armor_box_armor_scheme_desc:0 "Во время Второй мировой войны исследования по броне линкоров вышли на более высокий уровень, широко использовалась схема «все или ничего», что способствовало созданию серии снарядов с большей бронепробиваемостью. В результате на новых линкорах были установлены коробки вторичной брони, чтобы повысить общую прочность корабля и одновременно защитить второстепенные области, такие как помещения экипажа.\n\nУстановите §YСхему бронирования§! на §YТяжелый корпус§!, чтобы усилить §Yброню§!. или §YОЗ§!."
 harvey_steel:0 "Сталь Харви"
 harvey_steel_desc:0 "Броня Харви — разновидность стальной брони, разработанная американским инженером Хейвордом Харви в начале 1890-х годов. Когда-то он был популярен, и его видели несколько основных производителей броневых листов, включая Vickers, Krupp и Bethlehem."
 krupp_steel:0 "Сталь Крупп"
 krupp_steel_desc:0 "Броня Крупп была изобретена немецкой компанией Krupp Arm Works в 1893 году и заменила броню Харви в качестве основного метода защиты кораблей. Производство брони Крупп было очень похоже на броню Harveyized, но в процессе Крупп вместо обычного использования никелевой стали в сплав добавлялось до 1% хрома для дополнительной твердости. Ранние баллистические испытания показали, что 260 мм брони Крупп обеспечивают такую ​​же защиту, как 300 мм брони Харви."
 krupp_cemented_steel:0 "Крупповская цементированная броня"
 krupp_cemented_steel_desc:0 "Процесс производства цементированной брони Krupp (KCA) во многом остался таким же, как и исходная стальная броня Krupp, с небольшими изменениями в составе сплава. KCA сохранил закаленную поверхность за счет применения карбонизированных газов, но также имел гораздо большую волокнистую эластичность на задней части пластины, что значительно снизило вероятность растрескивания и растрескивания под воздействием огня."
 ducol_steel:0 "Сталь Ducol"
 ducol_steel_desc:0 "Ducol или D-steel — название ряда высокопрочных низколегированных сталей различного состава, впервые разработанных в начале 1920-х годов шотландской фирмой David Colville & Sons. Область применения включает строительство корпусов кораблей, легкую броню и сосуды под давлением, такие как паровые котлы локомотивов."
 homogeneous_krupp_steel:0 "Гомогенная крупповская броня"
 homogeneous_krupp_steel_desc:0 "Развитие доспехов с лицевой закалкой в ​​конце 19 - начале 20 веков показало, что такая броня менее эффективна против скользящих косых ударов. Хрупкость закаленного лицевого слоя была контрпродуктивной при таких воздействиях. Новое изобретение гомогенной стали сочетало в себе пластичность и прочность на разрыв и обычно использовалось для защиты палубы и ватерлинии."
  
 basic_torpedo_defense:0 "Ранняя система торпедной защиты"
 basic_torpedo_defense_desc:0 "Торпеда, выпущенная торпедным катером, стоимость которого составляет менее одного процента от стоимости линкора, может нанести такой же ущерб, как и попадание тяжелого морского орудия, или даже более смертоносный. Чтобы противостоять такой угрозе, на линкорах во время Великой войны одна за другой устанавливались системы торпедной защиты. За счет разделения большего количества водонепроницаемых отсеков внутри корпуса эффект приема воды был сбалансирован. Аналогичные усилия включали торпедные выступы, которые были заполнены жидкостью для максимального поглощения подводных взрывов.\n\nУстановите §YСистему торпедной защиты§! на §YТяжелый корпус§!, чтобы уменьшить §RТорпедный урон§!."
 improved_torpedo_defense:0 "Улучшенная система торпедной защиты"
 improved_torpedo_defense_desc:0 "Мощь появляющихся новых торпед намного превосходит мощь торпед прошлых лет. Чтобы компенсировать недостатки системы торпедной защиты времен Великой войны, за местами, уязвимыми для торпедных атак, была поставлена ​​броня, которая вместе с торпедными переборками может противостоять некоторым ударам торпед.\n\nУстановите §YСистему торпедной защиты§ на §YТяжелом корпусе§!, чтобы уменьшить §RУрон торпед§!."
 advanced_torpedo_defense:0 "Усовершенствованная система торпедной защиты"
 advanced_torpedo_defense_desc:0 "Новейшая система торпедной защиты попыталась защитить корпус от торпед, разделив более водонепроницаемые отсеки, что может гарантировать, что основная плавучесть корабля не будет затронута, а совершенствование процесса изготовления брони также усилило торпедный пояс.\n\nУстановите §YСистему торпедной защиты§! на §YТяжелый корпус§!, чтобы уменьшить §RТорпедный урон§!."
 enhanced_horizontal_defense:0 "Улучшение горизонтальной защиты"
 enhanced_horizontal_defense_desc:0 "Параболическая траектория с большой дистанции — один из самых распространенных способов поражения корабля в морских боях. Ютландское сражение уже ослабило палубную броню линкоров и тем самым подтолкнуло морские державы к усилению горизонтальной защиты."
 heavy_ship_refit_reduction:0 "Ремонт устаревшего корабля"
 heavy_ship_refit_reduction_desc:0 "Морской отпуск в значительной степени приостановил усилия по судостроению каждой страны. Для улучшения флота под строгим контролем модернизация старых кораблей стала эффективным и экономичным подходом."
 dry_dock_expansion:0 "Расширение сухого дока"
 dry_dock_expansion_desc:0 "Морские державы начали строить более крупные линкоры сразу после Великой войны, для чего требовались более крупные верфи, чем те, которые использовались для дредноутов. Для размещения огромных корпусов судостроительные предприятия расширили свои сухие доки, построенные в начале 20 века.\nХотя эти суперлинкоры так и не были спущены на воду, новые доки остались. Их не только можно было использовать для строительства более крупных крупных кораблей, но тяжелые краны и портовые сооружения также значительно повысили эффективность ремонта и технического обслуживания."
 improved_conning_tower:0 "Улучшенная боевая рубка"
 improved_conning_tower_desc:0 "Боевая рубка – это ядро ​​линкора. В прошлых войнах она всегда брала на себя обязанности командования, разведки и управления огнем. Развитие морских орудий также привело к эволюции боевой рубки. Не имея достаточной защиты, интегрированный и закрытый мостик мог бы обеспечить лучшую защиту командного состава и в то же время создать достаточно места для отделения связи."
 fuel_oil_boiler:0 "Мазутный котел"
 fuel_oil_boiler_desc:0 "Мазут — это тяжелая нефть, остающаяся после процесса извлечения бензина или дизельного топлива из сырой нефти, которая очень вязкая и трудно улетучивается. Благодаря высокой теплотворной способности мазут может сгорать более полно, обеспечивая более мощную энергетику судов, и при этом выделять меньше дыма, чем котлы, работающие на угле"
 ship_living_standard:0 "Повышение уровня жизни на судне"
 ship_living_standard_desc:0 "Условия жизни на борту были очень суровыми, но постепенно эта ситуация меняется. Все больше стран стали использовать на военных кораблях железные кровати и системы кондиционирования, чтобы обеспечить боевую мораль и физическое состояние моряков в мирное время, чтобы они могли отдаться бою в более боеспособном состоянии.\nПричём из тонкацу (жареной свиной отбивной) и риса карри в Японии до макарон и мороженого в США, еда на кораблях стала еще лучше, хотя лучшая еда предназначалась для офицеров. \n\n§CПусть армия нам завидует!§!"
 rudder_upgrade:0 "Модернизация руля"
 rudder_upgrade_desc:0 "Благодаря использованию улучшенного рулевого механизма корабль может гибко поворачивать. Меньший радиус поворота выгоден флоту, чтобы как можно быстрее скорректировать свой строй или отступить."
 battleship_aa_upgrade:0 "Модернизация ПВО линкора"
 battleship_aa_upgrade_desc:0 "Значение авианосцев в войне подтолкнуло морские державы переключить свое внимание на авианосную боевую группу, и статус линкоров, похоже, сильно ухудшился. Однако без защиты от линкоров авианосец по-прежнему очень уязвим. Их размеры обеспечивают платформу для противовоздушной обороны флота. Эти линкоры, оснащенные большим количеством зенитных орудий, стали появляться рядом с авианосцами в качестве эскорта."
 gas_turbine:0 "Газовая турбина"!
 gas_turbine_desc:0 "Газовая турбина использует непрерывный поток газа в качестве рабочей среды, приводя рабочее колесо во вращение на высокой скорости, и преобразует энергию топлива в машину внутреннего сгорания. Она намного быстрее, чем традиционная паровая турбина, но ограничена такими технологиями, как термостойкие материалы, поэтому сценарии применения газовых турбин относительно немногочисленны."
 fuel_tank_upgrade:0 "Большой топливный бак"
 fuel_tank_upgrade_desc:0 "Стандарт построения глобального флота заключается в том, что флот страны при любых обстоятельствах может быть развернут далеко от сферы ее влияния и эффективно осуществлять сдерживание на местном уровне. Наличие больших топливных баков на наших кораблях может помочь в достижении этой цели."
 radar_jammer:0 "Радарная глушилка"
 radar_jammer_desc:0 "Изобретение радара значительно облегчило обнаружение противника, что имеет решающее значение в морской войне. Для борьбы с ним был разработан ряд интерференционных технологий. Первоначально помехи достигались путем бросания металлической соломы и других пассивных методов. Теперь глушитель может создавать большое количество помех на рабочей частоте радара противника, что затрудняет обнаружение нас."
 combat_information_center:0 "Боевой информационный центр"
 combat_information_center_desc:0 "Боевой информационный центр, или CIC, — это сердце военного корабля. В конце войны на наиболее совершенных кораблях ВМФ были установлены все виды электронных устройств, включая поисковый радар, зенитный радар и систему управления огнем. Прежняя боевая рубка уже не отвечала требованиям. CIC интегрировал каждый блок управления бортовыми электронными системами и с помощью компьютеров мог предоставлять капитану или командующему флотом более быструю и подробную информацию."
  
 prototype_airplane_launcher:0 "Прототип авиационной пусковой установки"
 prototype_airplane_launcher_desc:0 "Пусковая установка для корабельных самолетов, изобретенная в Британии, использует гидравлическое давление для выброса легких гидросамолетов с кораблей с ограниченным пространством, а затем поднимает их с помощью крана в хвостовой части. Некоторые страны экспериментировали с применением гидросамолетов в Великой войне. Однако с увеличением размеров самолетов обычная катапульта уже не могла гарантировать эффективную боевую нагрузку самолета, что в конечном итоге и породило в будущем авианосец."
 early_carrier_study: "Исследование несущей способности"
 early_carrier_study_desc: "Оснащенный полноразмерной полетной палубой и средствами для перевозки, вооружения, развертывания и восстановления самолетов, авианосец удовлетворял потребности в проведении воздушных налетов с моря. До появления первого авианосца были проведены различные исследования ведущими странами в области авиастроения, которые заложили прочный фундамент для тех, кто пришел позже".
 landing_aid_system:0 "Система помощи при посадке"
 landing_aid_system_desc:0 "Посадка палубной авиации — самый опасный вопрос в авианосных операциях. Несмотря на название «системы», операции по оказанию помощи при высадке в основном выполнялись людьми. На каждом авианосце ВМС будут иметь офицеров связи десанта (LSO), которые будут руководить десантными операциями. Иногда их обслуживали опытные пилоты, которые использовали набор семафоров с цветными лопастями, чтобы помочь пилотам регулировать положение при посадке."
 arresting_gear:0 "Задерживающее снаряжение"
 arresting_gear_desc:0 "Система остановки приземления является вспомогательным оборудованием авианосца, обеспечивающим безопасную посадку самолета на палубу авианосца. Важнейшей частью этого устройства является тормозной механизм, который удерживает хвостовой крюк самолета высокопрочным тросом. Если он не справится со своей задачей, баррикада станет последней мерой."
 aviation_dawn:0 "Расцвет авиации"
 aviation_dawn_desc:0 "С развитием морской авиации значительно улучшилось и ее положение на флоте. ВМС Японии, Королевский флот и ВМС США организовали большое количество учений в конце 1920-х — начале 1930-х годов и разработали серию военно-морских и воздушных тактик. Из-за высокого технического порога флот любой страны должен пройти практику, если он хочет создать мощные силы морской авиации.\n\nТем не менее, любой стране, обладающей крупными линкорами, нелегко изменить курс, сопротивление со стороны корыстных интересов ожидается.\n\n§RЭра самолетов наступила, пушки и броня остались в прошлом......§!"
 night_air_strike:0 "Ночной воздушный удар"
 night_air_strike_desc:0 "Навигация в ночное время — чрезвычайно опасная задача, но она может принести элемент неожиданности. Благодаря обширным тренировкам по взлету и посадке на авианосцы в ночное время пилоты и наземные команды постепенно приобрели способность наносить эффективные авиаудары в ночное время при хорошей освещенности."
 dive_bomber_study:0 "Исследование пикирующего бомбардировщика"
 dive_bomber_study_desc:0 "В отличие от торпедоносцев, пикирующие бомбардировщики атакуют с большой высоты, что затрудняет их перехват истребителями или зенитными орудиями. Кроме того, пикирование непосредственно на цель обеспечивает большую точность бомбы и упрощает ее траекторию, позволяя пилоту сохранять визуальный контакт на протяжении всего полета бомбы. Маневренность также гарантирует, что они могут атаковать и уходить на высокой скорости, повышая выживаемость и делая маневры уклонения целевых кораблей неэффективными."
 carrier_mass_production:0 "Авианосец массового производства"
 carrier_mass_production_desc:0 "После многих лет разработки авианосец больше не был грубым кораблем с деревянными палубами. Напротив, на авианосцы применялись все новые и новые технологии, и они даже имели тенденцию превосходить линкоры. Новый режим строительства может ускорить запуск авианосцев."
 vnr_ship_hull_escort_carrier:0 "Эскортный авианосец"
 vnr_ship_hull_escort_carrier_desc:0 "Подводные лодки серьезно угрожали торговому флоту во время войны. Хотя самолеты имели более высокую противолодочную эффективность, они не могли обеспечить прикрытие конвоя глубоко в океане. Ценность обычных авианосцев ограничивала их использование в фронтальных боях. В это время были построены эскортные авианосцы с небольшими ангарами. Они были очень дешевы из-за использования некоторых гражданских компонентов."
 folding_wing:0 "Складное крыло"
 folding_wing_desc:0 "Морское сражение Второй мировой войны представляло собой трехмерную форму боя, и роль самолетов была решающей. Чтобы добиться большей грузоподъемности на авианосцах, авиаконструкторы применили на самолетах складные крылья для экономии места на палубе и в ангаре, но это требовало высокого мастерства изготовления крыльев."
 carrier_damage_control:0  "Интегрированный контроль повреждений"
 carrier_damage_control_desc:0 "Контроль повреждений – это экстренное реагирование на ситуации, которые могут привести к затоплению корабля. Военно-морские силы западных стран давно осознали важность наличия профессиональной противопожарной и ремонтной бригады. Уроки, извлеченные из войны, только сделали ее более заметной, особенно для авианосцев, основных средств военно-морского флота.\nОтдел ликвидации аварий состоит не только из людей, но и из оборудования, включая огнетушители и резервуары с  огнестойкими топливными баками"
 air_fuel_storage:0 "Хранилище авиатоплива"
 air_fuel_storage_desc:0 "Более обширные операции авианосцев во время Второй мировой войны требовали от авианосцев иметь топливные баки большего размера, в то время как количество авиатоплива на борту также имеет решающее значение для дальности полета и загрузки палубных самолетов.\nБольше перевозимого авиатоплива обычно означает, что авианосец может поддерживать больше самолетов и эффективно использовать авиагруппы.\n\nЗапасы авиатоплива могут помочь §Yпалубным самолетам§! улучшить §Yдальность полета§! и §Yманёвренность§!."
 full_armored_carrier:0 "Закрытый броненосный авианосец"
 full_armored_carrier_desc:0 "Соединенное Королевство было первым, кто перед войной принял на авианосцы бронированные полетные палубы, что могло предотвратить повреждение палубы бомбардировками с пикирования в бою. Эту идею быстро переняли другие морские державы, участвовавшие в войне, и все их новые авианосцы были усилены бронепалубами. В конце войны наиболее совершенные авианосцы стали характеризоваться полностью закрытыми ангарами и тяжелобронированными палубами."
 carrier_steam_catapult:0 "Паровая катапульта"
 carrier_steam_catapult_desc:0 "Даже самые современные поршневые самолеты в конце войны быстро устарели из-за реактивных самолетов. Флот решил разместить некоторые из них на авианосцах, но их вес был значительно увеличен за счет использования современных материалов, и они не могли взлетать с палуб ограниченной длины. Некоторые военно-морские конструкторы предлагали соединить с катапультой паровую турбину корабля, чтобы можно было эффективнее запускать реактивные самолеты."
 carrier_angled_deck:0 "Угловая взлетная палуба"
 carrier_angled_deck_desc:0 "Угловая палуба появилась в конце 1940-х годов и обычно располагалась с левой стороны палубы, образуя угол от 6 до 13 градусов с осевой линией. Вся полетная палуба была разделена на две зоны, что позволяло авианосцу одновременно выполнять взлет и посадку, что значительно повышало эффективность боевых вылетов."
 vnr_ship_hull_super_carrier:0 "Суперавианосец"
 vnr_ship_hull_super_carrier_desc:0 "По мере приближения войны к концу установилось доминирующее положение авианосцев во флоте и их мощности уделялось большое внимание. Тем временем закрытый ангар и бронепалуба усовершенствовались, а новый авианосец также принял все технологические инновации, такие как наклонные палубы и паровые катапульты. Этот тип корабля с большей боевой эффективностью и грузоподъемностью назывался суперавианосцем."
  
 acoustic_signature:0 "Исследование акустического сигнала"
 acoustic_signature_desc:0 "Акустическая сигнатура используется для описания сочетания акустических излучений излучателей звука, например, кораблей и подводных лодок. В ходе широкомасштабных операций по шпионажу и наблюдению в мирное время акустические сигнатуры боевых кораблей были собраны и включены в руководства по распознаванию, которые раздавались операторам гидролокаторов для идентификации кораблей противника во время войны."
 teardrop_hull:0 "Каплевидный корпус"
 teardrop_hull_desc:0 "Каплевидный корпус — это конструкция корпуса подводной лодки, в которой характеристики подводного плавания больше, чем надводные. Он широко использовался на ранних этапах разработки подводных лодок, но в начале 20 века от него постепенно отказались в пользу конструкций, оптимизированных для высоких характеристик на поверхности, в результате изменений в оперативной доктрине. Несмотря на это, эта технология по-прежнему оказала глубокое влияние на будущие конструкции подводных лодок."
 diesel_electric_transmission:0 "Дизель-электрическая трансмиссия"
 diesel_electric_transmission_desc:0 "До изобретения корабельного дизеля попытки управлять подводными лодками керосином и бензином не увенчались успехом из-за их высокой летучести. Для увеличения времени погружения подводной лодки была введена дизель-электрическая энергетическая система, состоящая из дизеля, электродвигателя, генератора и аккумуляторной батареи. Дизельный двигатель использовался на поверхности для питания генератора, а электрический двигатель использовался для подводных работ с небольшим содержанием кислорода из воздуха."
 basic_periscope:0 "Базовый перископ"
 basic_periscope_desc:0 "Перископы были использованы еще в 1906 году на первой подводной лодке Германии, которая могла наблюдать за обстановкой на воде, не всплывая на поверхность."
 improved_periscope:0 "Улучшенный Перископ"
 improved_periscope_desc:0 "При изготовлении новых перископов использовались улучшенные призмы и линзы, что позволило улучшить изображение и облегчить капитану наблюдение за целями."
 advanced_periscope:0 "Усовершенствованный перископ"
 advanced_periscope_desc:0 "Новая технология направлена ​​на решение проблемы вибрации перископов во время плавания подводной лодки. Благодаря дополнительному кронштейну мачты, даже если подводная лодка будет идти со скоростью 6-8 узлов, на ее перископ не будут влиять волны. Еще одним улучшением стала повышенная водонепроницаемость — модернизация, защищающая оптику от воздействия взрыва глубинной бомбы."
 basic_ballast_tank:0 "Базовый балластная цистерна"
 basic_ballast_tank_desc:0 "Балластная цистерна представляет собой кабину, в которой размещается балластная вода и используется для регулировки центра тяжести, плавучести и устойчивости судна. На подводной лодке балластная цистерна определяет скорость погружения и всплытия подводной лодки и играет решающую роль в ее тактике."
 improved_ballast_tank:0 "Улучшенная баластная цистерна"
 improved_ballast_tank_desc:0 "В новой конструкции балластной цистерны использованы такие технологии, как более надежный водяной насос и фильтр для предотвращения попадания примесей из воды в цистерну, что эффективно повышает ее долговечность."
 torpedo_computer:0 "Вычислитель данных торпеды"
 torpedo_computer_desc:0 "На подводных лодках во время Великой войны применялись ручные логарифмические линейки или механические калькуляторы для облегчения баллистических расчетов торпед, которые основывались на счетной грамотности оператора и имели низкую точность. Чтобы противостоять этому, на основе аналоговых компьютеров была изобретена вычислительная машина торпед. Это устройство устанавливалось в боевой рубке и было настолько громоздким, что для его эксплуатации и обслуживания требовалось два опытных специалиста, но все равно оно являлось прекрасным дополнением подводной лодки."
 torpedo_loader:0 "Торпедный погрузчик"
 torpedo_loader_desc:0 "Устройство помощи при заряжании торпед на быстроходной подводной лодке, значительно сокращает время перезарядки. Подводные лодки с такой системой могли бы стать ужасными подводными убийцами."
 anechoic_tile:0 "Безэховая плитка"
 anechoic_tile_desc:0 "Безэховая плитка представляет собой звукоизоляционный материал из синтетического каучука толщиной около 30 мм с цилиндрической полостью диаметром 2-5 мм внутри, позволяющий эффективно подавлять шум и вибрацию, а также повышать скрытность подводных лодок."
 sub_AIP_engine:0 "Воздухонезависимая двигательная установка"
 sub_AIP_engine_desc:0 "Воздухонезависимая двигательная установка — это технология, позволяющая долгое время управлять подводной лодкой, не забирая кислород из воздуха. Самообеспеченность подводных лодок с двигателями АИП более чем в два раза выше, чем у обычных ДЭПЛ, а значит, время пребывания в подводном положении больше."
 submarine_mass_production:0 "Подлодка массового производства"
 submarine_mass_production_desc:0 "Применяя модульный метод строительства, верфь может спустить на воду больше подводных лодок за относительно короткий период времени."
  
 multi_mounted_battery:0 "Многомодульная батарея"
 multi_mounted_battery_desc:0 "Одиночные и спаренные основные орудия были разработаны во время Великой войны и ранее стали широко распространены, но чтобы получить большую огневую мощь при аналогичной длине и весе,морские державы устанавливали больше орудий на башни. Наиболее распространённой была трёхствольная башня, получившая широкое распространение. Счетверенные орудия были еще мощнее, но их низкая надежность стала огромным обьектом сомнений."
 basic_super_heavy_battery:0 "Ранняя сверхтяжелая батарея"
 basic_super_heavy_battery_desc:0 "Сверхтяжелая корабельная пушка, разработанная накануне морских каникул. Сообщалось, что британский класс N3 будет оснащен 18-дюймовыми пушками, аналогичное вооружение встречалось также на американских и японских кораблях. Эта пушка чрезвычайно мощная и может легко пробить броню любого линкора."
 experimental_super_heavy_battery:0 "Экспериментальная сверхтяжелая батарея"
 experimental_super_heavy_battery_desc:0 "В 1915 году адмирал Джон Фишер предложил Королевскому флоту сверхбольшой линейный крейсер, известный как HMS Incomparable. Конструкция предназначалась для установки 20-дюймовых орудий, которые были бы самыми большими, когда-либо установленными на военном корабле. Однако более поздние исследования 18-дюймовых орудий столкнулись с различными проблемами и завершились на полпути после Вашингтонского морского соглашения. Страны, в том числе Япония и Германия, возобновили разработку 20-дюймовых орудий во время войны, но так и не создали функциональную модель."
 improved_super_heavy_battery:0 "Улучшенная сверхтяжелая батарея"
 improved_super_heavy_battery_desc:0 "Технологические достижения в смежных областях помогли флоту решить многие проблемы, обнаруженные в старых 18-дюймовых орудиях. В новых сверхтяжелых орудиях обычно используется калибр около 18 дюймов, что значительно мощнее 16-дюймовых орудий, используемых на обычных линкорах."
 improved_medium_heavy_battery:0 "Улучшенная средняя тяжелая батарея"
 improved_medium_heavy_battery_desc:0 "Хотя калибры этих орудий были аналогичны тем, что использовались на додредноутах, их огневая мощь и бронепробитие были значительно улучшены до уровня ранних линейных крейсеров благодаря использованию современных технологий и систем управления огнем."
 advanced_medium_heavy_battery:0 "Усовершенствованная средняя тяжелая батарея"
 advanced_medium_heavy_battery_desc:0 "Больший калибр был принят для орудий главного калибра крупных крейсеров, которые можно было сравнить с некоторыми дредноутами."
  
 naval_combat_support:0 "Морская логистика"
 naval_combat_support_desc:0 "Морская мощь значит больше, чем боевые корабли и самолеты. По мере расширения флота для его правильной работы также требуются инновационные протоколы управления и профессиональная команда логистического персонала.\nВ мирное время и на войне задача военно-морской логистики состоит в том, чтобы обеспечить и поддерживать оперативную готовность, предоставляя нужную поддержку в нужном месте. в нужное время."
 basic_port_facility:0 "Базовый портовый комплекс"
 basic_port_facility_desc:0 "Порт — это морской объект, включающий одну или несколько пристаней и погрузочных площадок, обычно называемый военно-морской базой в военном отношении.\nВоенно-морская база может нести ответственность за ежедневное обслуживание и начало морских операций. Благодаря основным объектам, включая доки, арсеналы и топливные бункеры, военно-морская база играет жизненно важную роль в морских операциях."
 large_shipyard:0 "Большая верфь"
 large_shipyard_desc:0 "Увеличение инвестиций в судостроительную промышленность в XIX веке привело к кардинальным изменениям в этих предприятиях, когда морская мощь стала одним из наиболее решающих факторов силы страны. Небольшие компании постепенно уничтожались или аннексировались промышленными магнатами. Ведущие предприятия владели крупнейшими в мире верфями, способными выполнять заказы на несколько перспективных боевых кораблей одновременно."
 heavy_crane:0 "Тяжелый кран"
 heavy_crane_desc:0 "Кран обычно оснащен канатами или цепями и шкивами, которые можно использовать для подъема или опускания тяжелых предметов. Он широко используется в судостроении для установки башни и других деталей на корабль."
 dry_dock:0 "Сухой док"
 dry_dock_desc:0 "Сухой док, спроектированный как узкий бассейн, который можно затопить, чтобы позволить судну всплывать и стоять на сухой платформе после осушения, был изобретен тысячи лет назад и используется до сих пор. Благодаря этому легче обслуживать и ремонтировать подводную часть корабля."
 port_construction_corps:0 "Портовый строительный корпус"
 port_construction_corps_desc:0 "Строительные корпуса выполняют те же обязанности, что и инженеры, они дислоцируются на военно-морских базах и тесно сотрудничают с морским персоналом при обслуживании и ремонте портовых сооружений."
 integrated_shipyard_complex:0 "Концентрированный судостроительный комплекс"
 integrated_shipyard_complex_desc:0 "Концентрация усилий судостроения на нескольких ключевых объектах позволит значительно повысить эффективность. Такой комплекс состоит из множества верфей  и множества других поставщиков, призванных в большинстве случаев функционировать независимо."
 speed_over_range:0 "Быстрая реакция"
 speed_over_range_desc:0 "Скорость — самое важное на войне. Нам следует сосредоточиться на скорости морской логистики, чтобы гарантировать, что припасы будут доставлены нуждающимся подразделениям в любое время, когда они об этом попросят.\n\n">
 range_over_speed:0 "Глобальное присутствие"
 range_over_speed_desc:0 "Несмотря на то, что он далеко, враг будет наказан. Нам следует сосредоточиться на морской логистике, чтобы флот мог действовать в отдаленных водах.\n\n">
 high_speed_civilian_engine:0 "Высокоскоростной гражданский двигатель"
 high_speed_civilian_engine_desc:0 "Учитывая, что высокооборотный двигатель намного дороже, гражданские корабли будут использовать экономичные. Но это никогда не бывает слишком дорого по сравнению с эффективностью логистики."
 armed_civilian_ship:0 "Вооруженные транспортники"
 armed_civilian_ship_desc:0 "Вооруженное торговое судно — это торговое судно, оснащенное орудиями, обычно для оборонительных целей, намеренно или постфактум. Во времена парусного спорта, пиратства и каперства многие торговые суда обычно были вооружены, особенно те, кто занимается торговлей на большие расстояния и с высокой стоимостью.\nЭти мысли также оказывают глубокое влияние на развитие вспомогательных кораблей дальнего действия."
 repair_ship:0 "Ремонтный корабль"
 repair_ship_desc:0 "Ремонтное судно — это рабочая пчела флота, обычно отвечающая за предоставление широкого спектра ремонтных возможностей, включая оборудование и персонал для ремонта серьезных неисправностей техники и боевых повреждений."
 floating_dry_dock:0 "Плавучий сухой док"
 floating_dry_dock_desc:0 "Плавучий сухой док — это мобильная ремонтная платформа, построенная для обслуживания кораблей в море.\nРазмещенный под кораблем ниже ватерлинии, плавучий сухой док спроектирован так, чтобы иметь возможность погружаться под воду. Затем из него откачивают воду, поднимая корабль из воды. Затем корабль блокируется на палубе плавучего сухого дока для ремонта."
 logistic_system_redundancy:0 "Резервирование логистики"
 logistic_system_redundancy_desc:0 "Чтобы обеспечить правильное функционирование логистической системы даже при худшем сценарии, крайне важно иметь некоторую избыточность на начальном этапе логистических операций. Запасая вдвое или даже втрое больше необходимых припасов, мы можем усилить линию фронта, несмотря ни на что."
 hospital_ship:0 "Корабль-госпиталь"
 hospital_ship_desc:0 "Корабль-госпиталь — это судно, предназначенное для выполнения основной функции в качестве плавучего лечебного учреждения или госпиталя. Большинство из них эксплуатируются вооруженными силами различных стран, поскольку они предназначены для использования в зонах боевых действий или вблизи них."
 surgery_at_sea:0 "Хирургия в море"
 surgery_at_sea_desc:0 "Специализированные члены экипажа, способные оказать медицинскую помощь, были отличительной чертой военных кораблей уже как минимум две тысячи лет. Но условия на борту намного суровее, чем на суше, учитывая толчки, вызванные волнами, соленостью и влажностью.\nБлагодаря достижениям медицинской науки и корабельных технологий, бортовая хирургия позволяет спасти больше жизней в бушующем море."
 medical_supply_at_sea:0 "Трансокеанское медицинское снабжение"
 medical_supply_at_sea_desc:0 "«Уроки битвы при Галлиполи» предупредили каждую страну о слабых местах трансокеанских линий снабжения. Когда лекарства достигают другой стороны океана, они иногда портятся из-за экстремальных условий. Установка улучшенного медицинского хранилища на лодках будет полезна в дальних круизах и десантных операциях."
 joint_sea_hospital:0 "Объединенный морской госпиталь"
 joint_sea_hospital_desc:0 "Учитывая стремительный рост потерь на линии фронта во время Второй мировой войны, полевых госпиталей недостаточно для лечения раненых. Корабли-госпитали дислоцируются в море, вдали от поля боя, и могут разгрузить перегруженные госпитали на суше."
 naval_fuel_complex:0 "Нефтебаза ВМФ"
 naval_fuel_complex_desc:0 "В настоящее время механизированная война ведется за счет нефти, не говоря уже о флоте. В качестве наиболее важного ресурса для питания военных кораблей флот имеет собственный хорошо охраняемый комплекс для хранения топлива.\nРасширение этих объектов значительно повысит устойчивость нашего флота."
 retardant_silo:0 "Ретардантный силос"
 retardant_silo_desc:0 "Топливо чрезвычайно уязвимо к огню и теплу. Нанесение огнезащитных материалов на оболочку топливных бункеров делает их более безопасными в случае пожара."
 integrated_fuel_base:0 "Большая топливная база"
 integrated_fuel_base_desc:0 "Концентрируя больше станций или объектов по хранению и заправке топлива в одном месте, можно значительно повысить эффективность заправки и максимальный запас топлива."
 vnr_ship_hull_civilian_1:0 "Корпус вспомогательного корабля"
 vnr_ship_hull_civilian_2:0 "Корпус быстроходного корабля боевой поддержки"
 vnr_ship_hull_civilian_2_desc:0 "Во время похода флота боевые корабли никогда не остановятся, чтобы дождаться, пока их догонят более медленные корабли. Быстрый корабль боевой поддержки может идти в ногу с флотом и оказывать поддержку даже во время боя."
 vnr_ship_hull_civilian_3:0 "Корпус судна для пополнения запасов"
 vnr_ship_hull_civilian_3_desc:0 "Нефтяной корабль пополнения запасов - это тип более тихоходных, но универсальных вспомогательных кораблей ВМФ с большими топливными баками и сухогрузными трюмами. Кроме корабельного топлива, он также может обеспечивать авиационным топливом самолеты, находящиеся на авианосце."
  
  
 modifier_repair_speed_naval_base_factor:0 "Скорость ремонта морской базы"
 modifier_repair_speed_dockyard_factor:0 "Скорость ремонта верфи"
 modifier_repair_speed_fuel_silo_factor:0 "Скорость ремонта топливного силоса"


# cold war techs
 rocket_depth_charges: "Противолодочные ракеты"
 rocket_depth_charges_desc: "Чтобы противостоять новым подводным лодкам, появившимся после Второй мировой войны, которые ходили тише, на гораздо большей скорости и могли атаковать с гораздо большей дистанции с помощью высокоскоростных самонаводящихся торпед, западные ВМС разработали торпеду с ракетным управлением (RAT), чтобы использовать преимущества современных гидролокаторов с гораздо большей дальностью обнаружения. Затем система RAT была реализована как ракета ПЛО, которая управляется собственной гидролокационной системой и наводится на цель с помощью активного или пассивного сонара."
 destroyer_guided_missile_upgrade: "Ракетный Эсминец"
 destroyer_guided_missile_upgrade_desc: "С развитием ракет они становились все быстрее и меньше, что позволяло превратить даже легкий корабль в грозную боевую машину, подобную линкору в открытом море."
 destroyer_hull_improvement: "Океанский эсминец"
 destroyer_hull_improvement_desc: "Эсминец, возникший как эскорт капитальных кораблей в начале XX века, во второй половине столетия превратился в де-факто корабль модернизированного флота, выполняющий все виды задач, которые были возложены на крейсеры или даже линкоры. Он зарекомендовал себя как экономичный многоцелевой корабль, который будет играть важную роль и в будущем."
 modern_sonar: "Интегрированный сонарная система"
 modern_sonar_desc: "Опираясь на опыт военных действий, военно-морские страны мира осознали, что для охоты за современными подводными лодками одного сонара недостаточно. Интегрированная сонарная система является частью комплексной противолодочной системы, состоящей из наборов пассивных и активных сонаров."
 phased_array_radar: "Радар с фазированной решеткой"
 phased_array_radar_desc: "В теории антенн фазированная решетка обычно означает электронную сканирующую решетку - управляемую компьютером совокупность антенн, создающих пучок радиоволн, который можно направлять в разные стороны без перемещения антенн. Технология фазированных решеток, применяемая в радарах, позволяет одновременно отслеживать несколько морских и воздушных целей, получая подробную информацию об их направлении, скорости и высоте."
 decoy_launching_system: "Систеам запуска ЛТЦ"
 decoy_launching_system_desc: "Уклонения военных кораблей быстро становились бесполезными против ракет. Недавно изобретенная система DLS - это система запуска ложных целей малой дальности, которая запускает радиолокационные или инфракрасные ложные цели с военных кораблей, чтобы отразить атакующие противокорабельные ракеты. Приманки подают ложные сигналы и создают помехи для систем наведения и управления огнем атакующих ракет."
 new_ship_materials: "Новые материалы"
 new_ship_materials_desc: "После Второй мировой войны морская броня стала менее важной из-за развития управляемых ракет. Ракеты могут быть очень точными и пробивать даже самую толстую броню. Вместо того чтобы вкладывать больше денег в улучшение брони, новые материалы будут легче, что позволит кораблю плыть с большей скоростью."
 nuclear_reactor_cost_reduction: "Экономичный ядерный реактор"
 nuclear_reactor_cost_reduction_desc: "Реактор деления стал жемчужиной индустриальной мощи человечества, когда мир перешел к 1950-м годам. В попытке построить полноценный атомный флот были разработаны новые материалы и устройства для дальнейшего снижения стоимости корабельного ядерного реактора."
 full_missile_ship: "Полностью ракетный корабль"
 full_missile_ship_desc: "Морская артиллерия никогда не пропадет, когда ракеты смогут сделать то же самое или даже лучше. По мере развития авиации и морского боя боевые корабли с полным ракетным вооружением становятся краеугольным камнем военно-морского флота."
 nuclear_engine_research: "Ядерный двигатель для надводных кораблей"
 nuclear_engine_research_desc: "Ядерная морская тяга - это движение судна за счет тепла, выделяемого ядерным реактором. Электростанция нагревает воду для производства пара для турбины, используемой для вращения винта судна через редуктор или через электрогенератор и двигатель."
 naval_tactical_data_system: "Морская система тактических данных"
 naval_tactical_data_system_desc: "Морская система тактических данных (МСТД) - компьютеризированная система обработки информации, разработанная в 1950-х годах для использования на боевых кораблях. Она принимала отчеты от многочисленных датчиков на разных кораблях и объединяла их для создания единой карты боевого пространства. Эта информация затем передавалась на корабли и операторам оружия."
 integrated_combat_system: "Интегрированная боевая система"
 integrated_combat_system_desc: "Интегрированная боевая система - это масштабируемая, сетевая система управления боевыми действиями, использующая общее программное обеспечение и вычислительную инфраструктуру, для быстрого развертывания возможностей во всех областях для надводного флота."
 memory_expansion: "Расширение памяти"
 memory_expansion_desc: "Революционный прорыв в области полупроводников позволил увеличить объем памяти в существующих компьютерах. Благодаря более высокой скорости вычислений компьютеры управления огнем станут быстрее и точнее."
 comprehensive_display_system: "Комплексная система отображения"
 comprehensive_display_system_desc: "Комплексная система отображения (КСО) представляла собой систему управления, контроля и координации. Операторы могли присваивать объектам на экране радара различные идентификаторы и объединять их на одном дисплее. КСО позволяла операторам легко направлять дружественные истребители на курсы перехвата неизвестных целей, а более поздние версии могли автоматически рассчитывать точки перехвата."
 electromagnetic_signature_study: "Исследование электромагнитной сигнатуры"
 electromagnetic_signature_study_desc: "Все суда излучают электромагнитные поля, которые, распространяясь через воду, могут быть обнаружены подводными датчиками или минами. Поэтому электромагнитные сигнатуры судов должны быть ниже безопасного уровня, то есть максимального уровня электромагнитных сигнатур, который может иметь судно, чтобы оно могло безопасно плавать над морскими минами."
 recon_drones: "Разведывательный дрон"
 recon_drones_desc: "Беспилотный летательный аппарат (БПЛА), широко известный как дрон, - это летательный аппарат без пилота, экипажа или пассажиров на борту. Изначально БПЛА были разработаны в XX веке для выполнения военных задач, слишком \"скучных, грязных или опасных\" для людей. Военно-морские державы разрабатывали свои собственные беспилотные летательные аппараты с фиксированным крылом или вертолеты для выполнения задач разведки и противолодочной войны."
 optical_landing_system: "Оптическая система посадки"
 optical_landing_system_desc: "Оптическая система посадки (ОСП) используется для передачи информации о глиссаде пилотам в терминальной фазе посадки на авианосец. Обычно она управляется компьютером и является более эффективной и надежной, чем человек."
 airborne_early_warning: "Самолет раннего предупреждения"
 airborne_early_warning_desc: "Для расширения возможностей надводного флота по перехвату и ограничению зоны поражения Авианосцы, созданные после Второй мировой войны, были оснащены самолетами РП, имеющими современную систему радиолокации и слежения. Его бортовая радиолокационная система была предназначена для обнаружения самолетов, кораблей, транспортных средств, ракет и других подлетающих снарядов на больших расстояниях, а также для управления боевым пространством в воздушном бою путем направления ударов истребителей и штурмовиков."
 iff_device: "Устройство Свой-Чужой"
 iff_device_desc: "Идентификация Свой-Чужой (IFF) - это система идентификации, предназначенная для командования и управления. В ней используется транспондер, который прослушивает сигнал опроса, а затем посылает ответ, идентифицирующий передатчика. Впервые она была разработана во время войны, с появлением радара и нескольких инцидентов, связанных с дружественным огнем."
 tactical_air_navigation_system: "Тактическая система воздушной навигации"
 tactical_air_navigation_system_desc: "Тактическая аэронавигационная система, обычно обозначаемая аббревиатурой TACAN, - это навигационная система, используемая военными самолетами. Она предоставляет пользователю пеленг и расстояние (наклонное расстояние или гипотенузу) до наземной или корабельной станции."
 sub_nuclear_engine: "Ядерный реактор подводной лодки"
 sub_nuclear_engine_desc: "Концептуальное проектирование первой атомной подводной лодки началось в конце 1940-х годов, когда развитие ядерных технологий позволило устанавливать на таких платформах, как подводные лодки, более компактные энергетические установки. Спроектированный как реактор с водой под давлением, новый реактор для подводных лодок мог обеспечить бесконечную дальность действия, что делало время погружения теоретически вечным."
 wire_guided_torpedo: "Торпеда с проводным наведением"
 wire_guided_torpedo_desc: "Торпеда с проводным наведением - это торпеда, которая управляется с помощью сигналов, передаваемых ей по тонким проводам, соединенным между торпедой и механизмом наведения, который находится где-то рядом с местом запуска."
 sonar_telephone: "Сонар ближнего радиуса действия"
 sonar_telephone_desc: "Подводный телефон используется на всех подводных аппаратах с экипажем и на многих надводных кораблях ВМС, находящихся в эксплуатации. Голос или звуковой тон (азбука Морзе), передаваемые через гидролокационную систему, гетеродинируются до высокого тона для акустической передачи через воду, что позволяет осуществлять связь между подводными лодками на малые расстояния."
 hydrocooling_battery: "Аккумулятор с гидроохлаждением"
 hydrocooling_battery_desc: "Способность подводной лодки работать под водой и возвращаться на поверхность во многом обусловлена наличием большого блока свинцово-кислотных аккумуляторов, которые требовали почти постоянного внимания со стороны экипажа лодки. С установкой системы гидроохлаждения аккумуляторная батарея может работать дольше, что повышает ее долговечность."
 rescue_submarine: "Спасательная подводная лодка"
 rescue_submarine_desc: "Спасательная подводная лодка, или иногда называемая глубоководным спасательным аппаратом (DSRV), - это тип аппарата, используемого для спасения затонувших подводных лодок. Он имеет напорный корпус с внутренним пространством, позволяющим перевозить несколько выживших, и способен зацепиться за аварийный люк подводной лодки и откачать воду из пространства между люками."
 
 
 # doctrine
 TITLE_FLEET_IN_BEING: "Решающее сражение"
 TITLE_TRADE_INTERDICTION: "Рейдерство"
 TITLE_BASE_STRIKE: "Воздушно-морские операции"
 cat_fleet_in_being: "Доктрина решающего сражения"
 cat_trade_interdiction: "Доктрина рейдерства"
 cat_base_strike: "Доктрина воздушно-морских операций"
 FLEET_IN_BEING_DESC: "Решающее сражение направлено на сохранение присутствия и запугивание противника оборонительной позицией, но при этом стремится уничтожить вражеский флот в одном сражении, когда наступит подходящий момент."
 TRADE_INTERDICTION_DESC: "Рейды нацелены на торговые суда, чтобы ослабить экономику и военное производство противника, и обычно пассивны в обеспечении господства на море."
 BASE_STRIKE_DESC: "Доктрина воздушно-морских операций предполагает, что превосходство в воздухе является ключом к превосходству на море, поэтому безопасность воздушного пространства важнее всех остальных факторов."
 fast_battleship_primacy: "Первенство быстрых линкоров"
 fast_battleship_primacy_desc: "Флот линкоров, обладающий единой высокой скоростью и универсальными характеристиками, способен справиться с любыми задачами на море.\n\n"
 scouting_fleet_primacy: "Первенство разведывательного флота"
 scouting_fleet_primacy_desc: "Преимущества быстроходных линкоров слишком преувеличены, в то время как традиционное разделение труда на линкоры и крейсера доказало свою экономичность и эффективность.\n\n"
 torpedo_groups: "Торпедные группы"
 torpedo_groups_desc: "Главная задача наших кораблей - изводить вражеские флоты торпедами и в конечном итоге нарушить их строй, чтобы обеспечить нам благоприятную ситуацию."
 decisive_battle: "Решающее сражение флота"
 decisive_battle_desc: "Когда наступит подходящий момент, наш флот, усиленный воздушными и сухопутными силами, совершит вылазку, чтобы покончить с врагом в одном решающем сражении."
 armed_merchantmen: "Вооруженные торговые суда"
 armed_merchantmen_desc: "Против безудержного надводного и подводного рейдерства вооруженные торговые суда будут хорошим вариантом для защиты конвоя в отсутствие эскортных кораблей."
 submarine_picket: "Пикет подводных лодок"
 submarine_picket_desc: "Организация группы подводных лодок вблизи вражеских портов или других ключевых точек позволит нам шпионить за передвижениями вражеского флота, даже не замечая этого."
 submarine_picket_bs: "Пикет подводных лодок"
 submarine_picket_bs_desc: "Организация группы подводных лодок вблизи вражеских портов или других ключевых точек позволит нам шпионить за передвижениями вражеского флота, даже не замечая этого."
 coastal_operations: "Прибрежные операции"
 coastal_operations_desc: "Хотя подводные лодки легче обнаружить на мелководье, группа таких судов все равно будет представлять достаточную угрозу для военно-морских и десантных операций у нашего побережья.\n\n"
 ambush_tactics: "Тактика засад"
 ambush_tactics_desc: "Если использовать подводные лодки в засадах и минных постановках, то больше шансов потопить вражеские корабли."
 tonnage_war: "Война за тоннаж"
 tonnage_war_desc: "Ключ к парализации военного потенциала страны лежит в уничтожении ее торговых конвоев. Потопив корабли быстрее, чем обороняющаяся сторона сможет их заменить, мы одержим победу в этой войне на истощение."
 guerrilla_tactics: "Партизанская тактика"
 guerrilla_tactics_desc: "Вместо того чтобы установить контроль над морем, мы должны твердо следовать стратегии бей и беги. К тому времени, когда враг найдет обломки корабля, наши корабли уже будут далеко."
 adjacent_projection: "Проекция прилегающей мощности"
 adjacent_projection_desc: "Поскольку флоты разбросаны по океанам, нам также важно оставаться неоспоримыми в своей сфере влияния."
 naval_concealment: "Меры по маскировке"
 naval_concealment_desc: "Флот не должен выставлять себя напоказ ни при каких обстоятельствах, но когда он это сделает, это будет конец для нашего врага."
 carrier_task_forces: "Флот превыше воздуха"
 carrier_task_forces_desc: "Авианосец - это не только ядро флота, но и самый важный объект войны. Уничтожение его всегда стоит на первом месте.\n\n"
 naval_air_force: "Воздух превыше флота"
 naval_air_force_desc: "Хотя это и не является общепризнанным, обеспечение превосходства в воздухе с помощью самолетов наземного базирования большой дальности является основой победы на море.\n\n"
 frequent_air_raid: "Частые воздушные налеты"
 frequent_air_raid_desc: "Принцип морского боя заключается в уничтожении вражеских авианосцев и сохранении своих. Посылка воздушных рейдов относительно меньшими группами и с большей частотой может удовлетворить обе эти задачи."
 mass_air_raid: "Массированный воздушный налет"
 mass_air_raid_desc: "Авианосец - это всего лишь плавучий аэродром на море, а наибольшую угрозу для надводного флота представляют самолеты. Массированный воздушный налет с аэродромов, чтобы вывести из строя вражеские авианосцы, более чем достаточен для поддержки наших операций."
 flight_deck_management: "Управление летной палубой"
 flight_deck_management_desc: "Несмотря на фиксированную пропускную способность, грамотное управление взлетными операциями позволит поднять эффективность вылетов самолетов, базирующихся на авианосцах, на новый уровень и сделать работу авианосцев эффективнее."
 circle_formation: "Круговое построение"
 circle_formation_desc: "Если флот сосредоточен на операциях с авианосцами, нам нужны только два типа кораблей - авианосцы и эскорт. Круговое построение будет защищать авианосец в центре перекрестным огнем из зенитных орудий всех кораблей сопровождения."
 circle_formation_desc: "Если флот сосредоточен на операциях с авианосцами, нам нужны только два типа кораблей - сами авианосцы и эскорт. Круговая Формация  будет защищать авианосец в центре перекрестным огнем из зенитных орудий всех кораблей сопровождения."

 # tech idea
 vnr_cruiser_cost_1: "Крейсер Договора"
 vnr_cruiser_cost_2: "Новые материалы"
 vnr_destroyer_cost_1: "Эсминец массовой продукции"
 vnr_carrier_cost_1: "Авианосец массовой продукции"
 vnr_submarine_cost_1: "Полодка массовой продукции"
 
 # support tech extension
 unmanned_gun_turret: "Орудийная башня с дистанционным управлением"
 unmanned_gun_turret_desc: "К 1950-м годам орудийные башни все чаще становились беспилотными, а управление установкой орудий осуществлялось дистанционно из центра управления кораблем с использованием данных от радаров и других источников."
 modern_generic_battery: "Морская автоматическая артиллерийская система"
 modern_generic_battery_desc: "\"SjöAutomatKanon\" (SAK), или Naval Automatic Gun System, - автоматическая система двойного назначения, разработанная шведскими военными сразу после Второй мировой войны. Революция в реактивной технике привела к значительному увеличению скорости самолетов в конце войны, когда реактивный самолет мог лететь со скоростью около 1000 километров в час, что делало противовоздушное оружие неэффективным против него. Благодаря компьютерам, управляющим огнем, и скорострельным пушкам, SAK может выпустить достаточное количество снарядов за короткий промежуток времени, чтобы обеспечить попадание в цель.."
 coldwar_ship_torpedo_launcher: "Торпедная установка времен холодной войны"
 coldwar_ship_torpedo_launcher_desc: "Из-за возросшей силы и скорости подводных лодок торпеды после Второй мировой войны получили улучшенные боеголовки и более совершенные двигатели.\n\nУстановка этого модуля на §YЛегкие корабли§! или §YКрейсера§! позволяет им наносить значительный урон вражеским §YКрупным кораблям§!"
 missile_submarine: "Подводная лодка с крылатыми ракетами"
 missile_submarine_desc: "Ракеты с радиоуправлением, разработанные в конце войны, считались родоначальниками современных крылатых ракет, способных преодолевать большие расстояния на дозвуковой скорости и поражать наземные и морские цели с высокой точностью. При соответствующей доработке военно-морским архитекторам удалось добиться того, что подводные лодки могут нести и запускать крылатые ракеты (КРМБ, состоящие из крылатых ракет наземного базирования и противокорабельных ракет) в качестве основного вооружения."
 wake_homing_torpedo: "Самонаводящаяся торпеда"
 wake_homing_torpedo_desc: "Волна - это область возмущенного потока ниже по течению от твердого тела, движущегося в жидкости, вызванная обтеканием жидкости вокруг тела. Военно-морские инженеры использовали это явление и изобрели технику наведения, основанную на траектории следа, оставляемого движущейся целью. Торпеда с системой самонаведения по волнам будет выпущена так, чтобы пройти за кормой цели и повредить ее силовую установку и рулевое управление."
 proximity_detonator: "Бесконтактный взрыватель"
 proximity_detonator_desc: "Торпеда, оснащенная взрывателем ближнего действия, может быть взорвана непосредственно под килем корабля-цели. В результате взрыва образуется газовый пузырь, который может повредить киль или обшивку цели. Однако наиболее разрушительной частью взрыва является подъемная сила газового пузыря, который поднимает корпус судна в воду. Конструкция корпуса рассчитана на сопротивление давлению вниз, а не вверх, поэтому на этой стадии взрыва корпус испытывает сильные деформации."
 
 improved_ship_torpedo_launcher: "Улучшенный торпедный аппарат"
 advanced_ship_torpedo_launcher: "Усовершенствованный торпедный аппарат"
 modern_ship_torpedo_launcher: "Современный торпедный аппарат"
 
 oxygen_torpedo: "Торпеда со сжатым кислородом"
 oxygen_torpedo_desc: "Количество топлива, которое может сжигать торпедный двигатель, ограничено количеством кислорода, которое он может перевозить. Поскольку сжатый воздух содержит всего около 21% кислорода, в кислородной торпеде использовался чистый сжатый кислород вместо сжатого воздуха, и по своим характеристикам она не уступала ни одной современной торпеде, находящейся на вооружении.\n\n"
 electric_torpedo: "Электрическая торпеда"
 electric_torpedo_desc: "Вместо того, чтобы оставлять за собой легко обнаруживаемый след из пузырьков, торпеда с электрическим двигателем остается практически невидимой до тех пор, пока не попадет в цель. Это также означает, что не остается следа, ведущего к стартующей подводной лодке.\n\n"

 tactical_data_link: "Тактический канал передачи данных"
 tactical_data_link_desc: "Тактический канал передачи данных использует стандартный канал передачи данных для обеспечения связи с помощью радиоволн или кабеля. Все военные системы C3 используют стандартизированный канал передачи данных для передачи, ретрансляции и приема тактических данных, что делает передачу данных между дружественными подразделениями безопасной и эффективной.\n\n§После проведения исследования ваши союзники получат разрешение на доступ к вашему каналу передачи данных. Если они согласятся, им не будет разрешено исследовать свой собственный аналог.§!"
 tactical_data_link_for_member: "Доступ к тактическому каналу передачи данных союзников"
 tactical_data_link_for_member_desc: "Тактический канал передачи данных использует стандартный канал передачи данных для обеспечения связи с помощью радиоволн или кабеля. Все военные системы C3 используют стандартизированный канал передачи данных для передачи, ретрансляции и приема тактических данных, что делает передачу данных между дружественными подразделениями безопасной и эффективной."
 signal_control: "Регулирование электромагнитного сигнала"
 signal_control_desc: "По мере того как на борту появлялось все больше электронных устройств, передвижение судов становилось прозрачным для обеих сторон. Было принято положение об электромагнитных сигналах, чтобы обеспечить работу всех устройств на стандартизированной частоте и сделать флот электронно невидимым."
 advanced_radar_finder: "Радиолокационный искатель"
 advanced_radar_finder_desc: "Радар - это устройство, которое излучает радиоволны для определения расстояния, направления и лучевой скорости объектов относительно объекта. Радиолокатор использует эту функцию и определяет направление на источник радиосигнала с помощью нескольких пеленгационных антенн путем триангуляции."
 close_in_area_air_defense: "Противовоздушная оборона ближнего боя"
 close_in_area_air_defense_desc: "Во время Второй мировой войны военно-морской флот часто сталкивался с воздушными угрозами, исходящими от самолетов-смертников и крылатых ракет с радиоуправлением. С восстановлением и модернизацией эсминцев военного времени они станут последним барьером против этих угроз."
 wave_resistance_design: "Конструкция с волновым сопротивлением"
 wave_resistance_design_desc: "Огромные волны в открытом море были самой большой проблемой для лодок за последние несколько столетий, особенно для легких судов, таких как эсминцы. При использовании тонкой носовой части с более острым углом наклона, которая более плавно отводит волну в сторону, количество энергии, необходимое для вытеснения воды, будет меньше, что позволит судну двигаться устойчиво."
 cryptography_revolution: "Революция в криптографии"
 cryptography_revolution_desc: "Благодаря беспрецедентной вычислительной мощности компьютеров, появившихся после войны, криптография добилась значительных успехов как в алгоритмах шифрования, так и в коммуникационных технологиях. Технический прогресс, обычно представленный электронными шифровальными машинами, усовершенствованными алгоритмами и технологией скачкообразной перестройки частоты, практически совершенен с точки зрения защиты военной информации."
 luneburg_lens: "Люнебургская линза"
 luneburg_lens_desc: "Люнебургская линза представляет собой сферически симметричную линзу с градиентным индексом и может быть изготовлена для использования с электромагнитным излучением от видимого света до радиоволн. Впервые представлен проф. Рудольф Люнебург, это устройство может быть использовано при изготовлении микроволновой антенны. По сравнению с параболической тарелкой антенна с люнебургской линзой обладает существенным преимуществом, заключающимся в том, что ею можно управлять, перемещая источник питания вокруг линзы, без необходимости поворачивать всю антенну целиком."

 converted_super_heavy_carrier: "Переоборудованный сверхтяжелый авианосец"
 advanced_missile_system: "Ракета с активной радиолокационной головкой самонаведения"
 advanced_missile_system_desc: "Послевоенная революция в электронике позволила создать систему наведения меньшего размера. Технология активного радиолокационного самонаведения позволяет ракете оснащаться приемопередатчиком радара и электроникой, необходимой для автономного поиска и отслеживания цели, что стало прототипом более поздних технологий "выстрелил и забыл"."

 heavy_armor_research_tt: "§HПрорыв в области тяжелой брони, в свою очередь, принесет пользу исследованиям брони крейсера.§!"
 cruiser_armor_research_tt: "§HПрорыв в области брони крейсера, в свою очередь, принесет пользу исследованиям в области тяжелой брони.§!"