 anti_air_rockets:0 "Противовоздушные ракеты" 
 anti_air_rockets_desc:0 "Развитие ракетостроения способствовало появлению ракет. Помимо применения в наземной войне, флот также пытался объединить это мощное оружие с кораблями. Зенитные ракетные установки использовали ракеты без приборов наведения. Хотя точность была низкой, при попадании они могли нанести непоправимый ущерб самолету. В то же время разработка неконтактных взрывателей также могла бы в определенной степени компенсировать проблему точности."
  
 advanced_sonar:0 "Advanced Sonar"
 advanced_sonar_desc:0 "We can improve the efficiency and range of both passive and active sonar designs by optimizing the components, such as replacing the piezoelectric crystals with ammonium dihydrogen phosphate."
 naval_radio_guiding_system:0 "Naval Radio Guiding System"
 naval_radio_guiding_system_desc:0 "The idea of controlling objects remotely predates the invention of radio, but radio guidance exploits its feature of long-range transmission and makes the process wireless. Compared to inertial and preset guidance methods, radio guidance is more conducive to attacking moving ships by taking location of the target into consideration."
 ship_to_ship_missile:0 "Radio-Guided Missile"
 ship_to_ship_missile_desc:0 "Based on antecedent breakthoughs in radio guided weapons, the radio guidance technology has become the last piece of puzzle in making a self-driven weapon to send powerful payloads from a long distance accurately. Either guided by remote or internal radio source, anti-ship missile is way more effective than conventional artillery and has attarcted most nations in the world to fill their arsenals with it."
 high_speed_light_engine:0 "High-Pressure Boiler"
 high_speed_light_engine_desc:0 "The ultra-high pressure boiler with superheaters can provide a stronger power of about 75,000 hp for the steam turbine. However, due to its unstable performance, it is currently only used on small ships such as destroyers."
 large_destroyer_trend:0 "Large Destroyer"
 large_destroyer_trend_desc:0 "A flotilla leader is a warship suitable for commanding a flotilla of destroyers or other small warships, typically a small cruiser or a large destroyer. Originally, the role was usually played by light cruisers or scout cruisers, but the rapid growth of destroyers in the early 1900s has made these vessels obsolete and incapable of keeping pace with faster destroyers. The new dynamics at sea prompt navies to build dedicated large destroyers to replace them.\n\nInstall §YDestroyer Leader Role§! on §YLight Hull§! to strengthen §YLight Attack§!."
 escort_destroyer_trend:0 "Escort Destroyer"
 escort_destroyer_trend_desc:0 "During the Second World War, the emergence of new submarines posed a major threat to the merchant fleets. As a large number of destroyers were occupied on the frontline, the demand for an economical and flexible light destroyer became urgent. Escort destroyers have been stripped of most unnecessary equipments, retaining only basic guns and depth charges, any naval power can build numerous ships of this type within a few months. With sonars, these little guys active on the ocean route have become an important factor in the country's war potential.\n\nInstall §YEscort Destroyer Role§! on §YLight Hull§! to reduce §YCost§!."
 destroyer_mass_production:0 "Destroyer Mass Production"
 destroyer_mass_production_desc:0 "Violent battles have led to losses of destroyers, so great that even the naval powers with hundreds of them before the war can hardly bear. To sustain continuous fleet operations, the new generation of destroyers have adopted a mass production method, shortening the time from keel to ship."
 sound_surveillance_system:0 "SOSUS"
 sound_surveillance_system_desc:0 "SOSUS, or Sound Surveillance System, is an anti-submarine surveillance network formed by a large number of passive sonars. Its construction requires building monitoring stations on islands and shores. Advanced sonar array deployed at these sites can track submarines in the area through SOFAR (Sound Fixing And Ranging Channel) at which depth the speed of sound is at its minimum. The system can also be used for scientific research including hydrology, geography and marine biology."
 destroyer_missile_upgrade:0 "Anti-Air Missile Destroyer Refit"
 destroyer_missile_upgrade_desc:0 "During World War II, efforts were started to develop surface-to-air missiles as it was generally considered that flak was of little use against bombers of ever-increasing performance. The research was led by several major powers in the world, and they quickly developed a great amount of types. Modified upon land-based SAM system, the ship-to-air missile system saw dedicated improvements in its guiding and launching modules.\n\nInstall §YAnti-Air Destroyer Role§! on §YLight Hull§! to unlock §YSurface-to-Air Missiles§!."
  
 early_cruiser_armor:0 "Great War Cruiser Armor"
 early_cruiser_armor_desc:0 "By the 1890s, it had become a general consensus that cruisers with armor protection had better survivability and would ultimately replace unprotected cruisers.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 basic_cruiser_armor:0 "Interwar Cruiser Armor"
 basic_cruiser_armor_desc:0 "The restriction on displacement of cruisers made by Washington Naval Treaty in the 1920s promoted the naval designers to adopt ideas, such as inclined armor, to save the tonnage. Newly designed cruisers generally had moderate armor, which could resist shells from old rapid-fire guns.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 improved_cruiser_armor:0 "Improved Cruiser Armor"
 improved_cruiser_armor_desc:0 "With looming tensions across the world, the Washington System was crumbling when Japan and Italy refused to sign the Second London Naval Treaty, and both started to build cruisers exceeding the restriction. The cruiser armor has emerged thicker and harder as the times require.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 advanced_cruiser_armor:0 "Advanced Cruiser Armor"
 advanced_cruiser_armor_desc:0 "Experience gained in the war has further promoted the development of cruiser. Besides heavy armor, the new cruisers also adopted an armor layout design similar to that of the battleship. While maintaining a high speed, it allocated more tonnage to the defense of key parts.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 searchlight:0 "Searchlight"
 searchlight_desc:0 "Searchlight is generally installed on the side of ships for reconnaissance at night and navigation in foggy weather. Although a better field of vision can be obtained, it may expose the ship's position if used recklessly."
 treaty_cruiser_trend:0 "Treaty Cruiser"
 treaty_cruiser_trend_desc:0 "With the concern that a subsequent race in building larger, more powerful cruisers might subvert the usefulness of the prohibition on capital ship construction, representatives of the United States, Great Britain, Japan, France and Italy set limits on the tonnage and firepower of cruisers to 10,000 tons in standard displacement and 8 inches for maximum main gun caliber, further solidating the modern definition of cruiser."
 colony_cruiser:0 "Colonial Cruiser"
 colony_cruiser_desc:0 "To guard their vast colonies, the colonial empires always take range and cost into consideration of cruiser designs. Colonial cruiser is not a specific class of cruiser, but it has features including low cost, speed advantage and good seaworthiness. Deployed far from the heart of the empires, it is more than sufficient to maintain a relatively strong naval presence even at the edge of the world.\n\nInstall §YColonial Cruiser Role§! on §YCruiser Hull§! to reduce §YCost§!."
 cruiser_gun_upgrade:0 "Cruiser Semi-Autoloader"
 cruiser_gun_upgrade_desc:0 "Facing stronger performance of destroyers in the 1930s, rapid-fire guns developed before the war can no longer meet the need. To ensure efficiency against destroyers, cruisers are equipped with mechanical loading machines that increase rate of fire while saving manpower. Although the machine still requires manual assistance, it can achieve a loading efficiency far exceeding that of non-autoloading guns."
 cruiser_aa_upgrade:0 "Anti-Air Cruiser Refit"
 cruiser_aa_upgrade_desc:0 "By the 1930s, carrier-based aircrafts have seen great progress in manoeuverability and payload. Some naval officers see this as a chance to promote the role of aircraft carrier in future naval warfare. To counter it, most ships are reinforced with better anti-air firepower, and constructions of dedicated anti-air cruisers start simultaneously.\n\nInstall §YAnti-Air Cruiser Role§! on §YCruiser Hull§! to strengthen §YAnti-Air Attack§!."
 destroyer_cruiser_trend:0 "Super Destroyer"
 destroyer_cruiser_trend_desc:0 "As a by-product of differentiation strategy to cope with larger destroyers, a new ship class with features from both light cruiser and destroyer has emerged. Equipped with intermediate armaments including lesser cruiser-level guns, its definition varies across the world. It can play the role of flotilla leader in a small squadron, and destroyer killer when acting alone, which its speed advantage also allows it to fight an unsymmetrical war at sea.\n\nInstall §YSuper Destroyer Role§! on §YLight Hull§! to unlock §YLight Medium Battery§!."
 cruiser_radar_sentry:0 "Radar Picket Refit"
 cruiser_radar_sentry_desc:0 "The advent of radar has completely changed reconnaissance in naval battle that even the most trained observer cannot match its range or accuracy. Cruisers, usually acting as the vanguard of fleet, become the first naval ships to install radars. With radar's unparalleled detection range, it allows the fleet to spot enemy earlier than before.\n\nInstall §YRadar Picket Role§! on §YCruiser Hull§! to strengthen §YSurface Detection§!."
 fighter_directional_system:0 "Fighter Directional System"
 fighter_directional_system_desc:0 "The predecessor of the ship-controlled interception system is the ground-controlled joint interception tactics developed in the war. By connecting multiple radar stations to the joint control center, the headquarter can issue more specific information on position and speed of enemy aircrafts to fighters. Upon the advance of ship radars, this system is also used in naval operations, making interception carried out by carrier fighters more efficient."
 cruiser_missile_upgrade:0 "Missile Cruiser Refit"
 cruiser_missile_upgrade_desc:0 "Missile is not only powerful but also more accurate, thus rendering naval guns useless in its face. Although battleship can utilize its ample space to install missiles, cruiser must go through total conversion in order to accommodate their launchers and storages.\n\nInstall §YMissile Cruiser Role§! on §YCruiser Hull§! to unlock §YAnti-Ship Missile§!."
 helipad:0 "Helipad" 
 helipad_desc:0 "The idea of helicopter was invented way before the 20th century, but hundreds of them were first built and deployed in the war during the Second World War. At first, helicopters were used in small numbers for observation, transport, and medical evacuation. As vertical flight can save more space on a narrow deck of ship, navy has also seen this breakthrough as a perfect replenishment for seaplanes. But before turboshaft is invented, helicopters only play a very limited role in naval opearations."
  
 basic_heavy_armor:0 "Interwar Protection Solution"
 basic_heavy_armor_desc:0 "The Great War has revealed the weakness of battleship armor, and the new generation of battleships have been designed with better protection. The new armor scheme is more comprehensive, covering more critical areas of the ship, and the armor itself is also improved with better materials and layout."
 improved_heavy_armor:0 "Improved Protection Solution"
 improved_heavy_armor_desc:0 "The Second World War has witnessed the rapid development of naval guns, which can easily penetrate the armor of battleships built before the war. To keep up with the times, the new battleships have been designed with thicker and stronger armor, and more attention is paid to the layout of armor both on surface and under water to ensure better protection for key areas."
 advanced_heavy_armor:0 "Advanced Protection Solution"
 advanced_heavy_armor_desc:0 "The latest generation of battleships has been designed with the most advanced armor scheme, which owns a combination of benefits from most previous designs, made possible by lighter but more resilient steel. The armor layout is optimized to provide the best protection for the ship, and the armor itself is made of the best materials available, providing the highest level of protection against enemy fire."
  
 incremental_armor_scheme:0 "Post-Jutland Armor Scheme"
 incremental_armor_scheme_desc:0 "The Battle of Jutland has proved armor layout before 1914 incompetent. Lacking awareness of the long combat distance, the armor of previous battleships generally lacked the ability to resist 15-inch naval guns. The new armor scheme developed after that was also known as the post-Jutland scheme. It was just a temporary design strengthening the deck armor, and soon became obsolete after the war.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 mixed_armor_scheme:0 "Mixed Armor Scheme"
 mixed_armor_scheme_desc:0 "The mixed scheme was a transitional armor scheme after the war, which mainly integrated lessons learned from Jutland and the idea of all-or-nothing defense. Compared with the incremental scheme invented 20 years ago, it had a better armor ratio in some areas that are highly vulnerable.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 all_or_nothing_armor_scheme:0 "All-or-Nothing Armor Scheme"
 all_or_nothing_armor_scheme_desc:0 "The all-or-nothing scheme was first adopted on the Nevada-class battleships, and has been applied on all US battleships after that. The all-or-nothing design greatly saves the armor of non-essential areas with the same tonnage, and uses armored citadel to protect the fragile magazine and main engine. Ships with this type of armor scheme usually have better survivability.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 all_or_nothing_armor_box_armor_scheme:0 "Enhanced All-or-Nothing Armor Scheme"
 all_or_nothing_armor_box_armor_scheme_desc:0 "During the Second World War, the research on battleship armor went to a higher level that all-or-nothing scheme was widely used, prompting a series of shells with stronger armor piercing effect. The secondary armor box works as a part to enhance overall strength of the ship while protecting secondary areas such as crew quarters.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 harvey_steel:0 "Harvey Steel"
 harvey_steel_desc:0 "Harvey armor was a type of steel armor developed by American engineer Hayward Harvey in the early 1890s. It was once popular and saw several main producers of the armor plate including Vickers, Krupp and Bethlehem."
 krupp_steel:0 "Krupp Armor"
 krupp_steel_desc:0 "Krupp armor was invented by Germany's Krupp Arm Works in 1893 and replaced Harvey armor as a primary method of protecting naval ships. The manufacturing of Krupp armor was very similar to Harveyized armor, but the Krupp process, instead of generally using nickel-steel, added as much as 1% chromium to the alloy for additional hardness. Early ballistic tests showed that 260mm of Krupp armor offered the same protection as 300mm of Harvey armor."
 krupp_cemented_steel:0 "Krupp Cemented Armor"
 krupp_cemented_steel_desc:0 "The manufacturing process of Krupp cemented armor (KCA) remained largely the same as original Krupp steel armor, with slight changes in the alloy composition. The KCA retained the hardened surface via the application of carbonized gases but also had a much greater fibrous elasticity on the rear of the plate, which greatly reduced the incidence of spalling and cracking under incoming fire."
 ducol_steel:0 "Ducol Steel"
 ducol_steel_desc:0 "Ducol or D-steel is the name of a number of high-strength low-alloy steels of varying composition, first developed from the early 1920s by the Scottish firm of David Colville & Sons. Applications have included ship hull construction, light armoring and pressure vessels such as locomotive steam boilers."
 homogeneous_krupp_steel:0 "Homogeneous Krupp Armor"
 homogeneous_krupp_steel_desc:0 "Developments in face-hardened armor in the late 19th and early 20th centuries revealed that such armor was less effective against glancing oblique impacts. The hardened face layer's brittleness was counterproductive against such impacts. The new invention of homogeneous steel combined ductility and tensile strength, and was typically used for deck and waterline protection."
  
 basic_torpedo_defense:0 "Early Torpedo Defense System"
 basic_torpedo_defense_desc:0 "A torpedo fired by a torpedo boat that costs less than one percent of a battleship can cause the same damage as a naval heavy gun hits, or even deadlier. The battleships during the Great War installed torpedo defense systems one after another to resist such threat. By separating more watertight compartments inside the hull, the effect of taking in water was balanced. Similar efforts included torpedo bulges, which were filled with liquid to maximize absorption from underwater blasts.\n\nInstall §YTorpedo Defense System§! on §YHeavy Hull§! to reduce §RTorpedo Damage§!."
 improved_torpedo_defense:0 "Improved Torpedo Defense System"
 improved_torpedo_defense_desc:0 "The power of new torpedoes has far exceeded those of the past. To make up for the shortcomings of the Great War torpedo defense system, armor was put behind areas that are vulnerable to torpedo attacks, and together with the torpedo bulkheads, they can resist some impacts from torpedoes.\n\nInstall §YTorpedo Defense System§! on §YHeavy Hull§! to reduce §RTorpedo Damage§!."
 advanced_torpedo_defense:0 "Advanced Torpedo Defense System"
 advanced_torpedo_defense_desc:0 "The latest torpedo defense system tries to protect the hull from torpedoes by separating more watertight compartments, which can ensure buoyancy of the ship is not affected. Moreover, improvement of the armor manufacturing process has also strengthened the torpedo belt.\n\nInstall §YTorpedo Defense System§! on §YHeavy Hull§! to reduce §RTorpedo Damage§!."
 enhanced_horizontal_defense:0 "Deck Armoring"
 enhanced_horizontal_defense_desc:0 "Although it was not widely realized in the past, the parabolic trajectory from long distance is one of the most common ways to hit a maneuvering ship from another. After studying outcomes of the battle at Jutland, naval powers all chose to strengthen battleship's deck armor."
 heavy_ship_refit_reduction:0 "Obsolete Ship Refit"
 heavy_ship_refit_reduction_desc:0 "The Naval Holiday has largely paused every country's shipbuilding efforts. To improve the fleet under strict observation, modernizing old ships had become an efficient and economical approach."
 dry_dock_expansion:0 "Расширение сухого дока"
 dry_dock_expansion_desc:0 "Морские державы начали строить более крупные линкоры сразу после Великой войны, для чего требовались более крупные верфи, чем те, которые использовались для дредноутов. Для размещения огромных корпусов судостроительные предприятия расширили свои сухие доки, построенные в начале 20 века.\nХотя эти суперлинкоры так и не были спущены на воду, новые доки остались. Их не только можно было использовать для строительства более крупных крупных кораблей, но тяжелые краны и портовые сооружения также значительно повысили эффективность ремонта и технического обслуживания."
 improved_conning_tower:0 "Improved Conning Tower"
 improved_conning_tower_desc:0 "The conning tower is the core of a battleship. In past wars, it has always assumed duties like command, reconnaissance and fire control. The development of naval guns has an interactive influence on its evolution. Once without enough armoring, the integrated and enclosed bridge can provide better protection for commanding personnel, and at the same time create plenty of room for the communication department."
 fuel_oil_boiler:0 "Oil Boiler"
 fuel_oil_boiler_desc:0 "Fuel oil is a heavy oil remaining after the process of extracting gasoline or diesel from crude oil, which is very viscous and difficult to volatilize. Due to its high calorific value, fuel oil can be burned more fully, providing stronger power for ships, while producing less smoke than coal-powered boilers."
 ship_living_standard:0 "Ship Living Standard Improvement"
 ship_living_standard_desc:0 "The living environment aboard was very harsh, but this situation is gradually improving. More countries begin to use iron beds and air-conditioning systems on warships to ensure the fighting will and physical condition of sailors in peacetime, so that they can devote themselves to the battle in a fuller state.\nMoreover, from tonkatsu (fried pork chop) and curry rice in Japan to macaroni and ice cream in US, food on ships is getting even better, though the best is still reserved for officers. \n\n§CLet the army envy us!§!"
 rudder_upgrade:0 "Rudder Upgrade"
 rudder_upgrade_desc:0 "Improved rudder gear allows ship to turn flexibly, which provides a better maneuvering ability in formation and retreat."
 battleship_aa_upgrade:0 "Battleship Anti-Air Upgrade"
 battleship_aa_upgrade_desc:0 "Surprising results made by aircraft carriers in the war have pushed the naval powers to shift their attention from large but slow battle fleet to carrier battle group, a move that seems to deteriorate the role of battleships in the fleet. However, carrier is still considered vulnerable without protection from battleship, whose size provides a platform for anti-air defense. Battleships equipped with a large number of anti-air guns have emerged alongside carriers as escorts."
 gas_turbine:0 "Газовая турбина"!
 gas_turbine_desc:0 "Газовая турбина использует непрерывный поток газа в качестве рабочей среды, приводя рабочее колесо во вращение на высокой скорости, и преобразует энергию топлива в машину внутреннего сгорания. Она намного быстрее, чем традиционная паровая турбина, но ограничена такими технологиями, как термостойкие материалы, поэтому сценарии применения газовых турбин относительно немногочисленны."
 fuel_tank_upgrade:0 "Large Fuel Tank"
 fuel_tank_upgrade_desc:0 "The standard for building a global navy is that the country's fleet can be deployed far away from its sphere of influence under any circumstances, and effectively implement deterrence locally. Having larger fuel tanks on our ships can help achieve this goal."
 radar_jammer:0 "Radar Jammer"
 radar_jammer_desc:0 "The invention of radar has greatly facilitated the ability to locate air targets, which is crucial in naval warfare. A series of interference technologies are developed to counter it. Interference was initially achieved by throwing metal chaff and other passive methods. Now the clutter jammer can release noise in radar's operating frequency, making it more difficult to locate us."
 combat_information_center:0 "Combat Information Center"
 combat_information_center_desc:0 "The combat information center, or CIC, is the heart of a warship. At the end of the war, the most advanced naval ships had all types of electronic devices installed including search radar, anti-air radar and fire control system. The past conning tower no longer met the requirement. CIC integrated every control unit of the electronic systems aboard, with aid from computers, it could provide the captain or fleet commander with faster and more detailed information."
  
 prototype_airplane_launcher:0 "Prototype Airplane Launcher"
 prototype_airplane_launcher_desc:0 "The ship airplane launcher, inveneted by Britain, uses hydraulic pressure to eject light seaplanes from ships with limited space, and then recovers them with a crane at the tail. Some countries have experimented with seaplanes during the Great War and proved their power, but with the increasing size of aircrafts, conventional catapult can no longer sustain effective combat payload of the plane, which eventually inspires aircraft carrier in the future."
 early_carrier_study: "Naval Aviation Theory"
 early_carrier_study_desc: "Equipped with a full-length flight deck and facilities for carrying, arming, deploying, and recovering aircraft, the carrier fulfilled the need to launch air raids from the sea. Before the advent of the first carrier, there were various studies made by different leading countries in aero industry, which laid a solid foundation for those latecomers.".
 landing_aid_system:0 "Landing Aid System"
 landing_aid_system_desc:0 "Landing of carrier-based aircraft is the most dangerous subject in carrier operations. Despite bearing a title of \"system\", the landing aid operations were mostly carried out by people known as landing signal officers (LSO). They were sometimes served by experienced pilots, and used a set of semaphores with colored paddles to help pilots adjust landing attitude."
 arresting_gear:0 "Arresting Gear"
 arresting_gear_desc:0 "The landing arrestment system is an auxiliary equipment used on flight deck that achieves safe landing of aircraft. As the most important part of this device, arresting gear catches tailhook of the plane with a high-strength rope. If it fails, barricade will become the last measure."
 aviation_dawn:0 "Aviation Dawn"
 aviation_dawn_desc:0 "From Wright Flyer to monoplane nowadays, aircraft has been through many revolutions with stronger and corrosion-resistant materials, which the improvements bring it with a more critical role in fleet operations. A large number of exercises have been conducted at the turn of the 1930s, culminating in a series of advancements in naval and air tactics. Due to its heavy reliance on cutting-edge technologies and seasoned personnel, a functional naval aviation must go through lots of practices.\n\nYet it is not easy for any country possessing a large battleship fleet to change the course. Resistance from vested interests is expected.\n\n§RThe age of airplanes is here, guns and armors were the past......§!"
 night_air_strike:0 "Ночной воздушный удар"
 night_air_strike_desc:0 "Навигация в ночное время — чрезвычайно опасная задача, но она может принести элемент неожиданности. Благодаря обширным тренировкам по взлету и посадке на авианосцы в ночное время пилоты и наземные команды постепенно приобрели способность наносить эффективные авиаудары в ночное время при хорошей освещенности."
 dive_bomber_study:0 "Dive Bomber Study"
 dive_bomber_study_desc:0 "Unlike torpedo bombers, dive bombers attack from high altitude, making them harder for fighters or anti-air guns to intercept. Additionally, diving directly at its targets provides greater accuracy for the bomb, and simplifies the bomb's trajectory to allow the pilot to keep visual contact throughout the bomb run. The agility also ensures that they can attack and escape at high speed, increasing survivability while rendering evasive maneuvers by the target ineffective."
 carrier_mass_production:0 "Carrier Mass Production"
 carrier_mass_production_desc:0 "Needs from ongoing war and deeper understanding of construction methods made call for shorter period of building carriers. Welding, pre-assembled sections, and standardized designs have all contributed to the rapid growth of construction efficiency."
 vnr_ship_hull_escort_carrier:0 "Эскортный авианосец"
 vnr_ship_hull_escort_carrier_desc:0 "Подводные лодки серьезно угрожали торговому флоту во время войны. Хотя самолеты имели более высокую противолодочную эффективность, они не могли обеспечить прикрытие конвоя глубоко в океане. Ценность обычных авианосцев ограничивала их использование в фронтальных боях. В это время были построены эскортные авианосцы с небольшими ангарами. Они были очень дешевы из-за использования некоторых гражданских компонентов."
 folding_wing:0 "Folding Wing"
 folding_wing_desc:0 "It is becoming even more evident what decisive role that aircrafts can play in recent battles. To achieven better capacity on carriers, aircraft designers start to apply folding wings on the latest naval planes, trying to save hangar and deck space, whose manufacture requires superb craftsmanship."
 carrier_damage_control:0  "Integrated Damage Control"
 carrier_damage_control_desc:0 "Damage control is the emergency control of situations that may cause the sinking of a watercraft. Navies of western countries have long been aware of the importance of a professional firefighting and repair team. The lessons learned from war have only made it more pronounced, especially for carriers, the primary naval assets.\nThe damage control department consists of not only the men but also devices including fire extinguishers and fire-retardant fuel tanks."
 air_fuel_storage:0 "Air Fuel Storage"
 air_fuel_storage_desc:0 "More extensive carrier opearations during the Second World War have made the need for large fuel tanks even more pronounced, because the quantity of air fuel aboard is positively related to range and payload of aircrafts.\nMore air fuel carried usually means the carrier can support more air groups efficiently.\n\nAir fuel storage can help §Ycarrier-based aircrafts§! improve §Yrange§! and §Yagility§!."
 full_armored_carrier:0 "Enclosed Armored Carrier"
 full_armored_carrier_desc:0 "Britain was the first to adopt armored flight decks on carriers, which their armor could prevent dive bombing from damaging the deck in combat. This idea has become widely accepted by other naval powers by the end of the war, contributing to modern carriers featuring enclosed hangar and armored flight deck."
 carrier_steam_catapult:0 "CATOBAR"
 carrier_steam_catapult_desc:0 "Even the state-of-the-art propeller fighter was quickly rendered obsolete by jet plane at the end of the war. Since its weight has been greatly increased by usage of advanced materials, it is unable to take off from decks with limited length. Some naval designers proposed connecting the steam turbine to the catapult, so that jet fighters can be launched to reach a faster initial speed. Such system is called CATOBAR, or \"Catapult Assisted Take-Off Barrier Arrested Recovery\""
 carrier_angled_deck:0 "Angled Flight Deck"
 carrier_angled_deck_desc:0 "The angled deck first appeared in the late 1940s and it is usually located on the left side of the flight deck, forming an angle of 6 to 13 degrees with the centerline. The entire flight deck is divided into two areas, allowing the carrier to perform take-off and landing operations at the same time, which greatly improves the sortie efficiency."
 vnr_ship_hull_super_carrier:0 "Super Carrier Hull"
 vnr_ship_hull_super_carrier_desc:0 "As the war draws to an end, the superiority of carrier has made it bear the weight of high hopes from naval theorists. Mature technologies like enclosed hangar, armored flight deck, and new innovations such as angled deck and steam catapult, become essential parts on a modern carrier, allowing it to hold over a hundred aircrafts. Due to its enormous size, carrier of this type is usually referred as supercarrier."
  
 acoustic_signature:0 "Acoustic Signature Study"
 acoustic_signature_desc:0 "Acoustic signature is used to describe a combination of acoustic emissions of sound emitters, such as those of ships and submarines. Through large-scale spying and surveillance operations during peacetime, the acoustic signatures of warships are collected and included in recognition manuals, and later distributed to sonar operators to identify enemy ships during the war."
 teardrop_hull:0 "Teardrop Hull"
 teardrop_hull_desc:0 "A teardrop hull is a submarine hull design which emphasizes submerged performance over surfaced performance. It was somewhat commonly used in the early stages of submarine development, but was gradually abandoned in the early 20th century in favour of designs optimized for high performance on the surface as a result of changes in operational doctrine. Despite that, the technology still had a profound impact in future designs of submarines."
 diesel_electric_transmission:0 "Diesel-Electric Transmission"
 diesel_electric_transmission_desc:0 "Before the invention of ship diesel engine, attempts to drive submarines with kerosene and gasoline all failed due to their high volatility. To extend submarine's submersion time, the diesel-electric power system was introduced. It is composed of diesel engine, electric engine, generator, and storage battery. The diesel engine is used on the surface, powering the generator, while the electric engine is for underwater scenario with little oxygen from air."
 basic_periscope:0 "Basic Periscope"
 basic_periscope_desc:0 "Periscopes have been used as early as 1906 on Germany's first submarine, which can observe the situation on the water without surfacing."
 improved_periscope:0 "Improved Periscope"
 improved_periscope_desc:0 "Improved prisms and lenses are used in the manufacturing of new periscopes, this will achieve better imaging effects and facilitate the captain to observe enemy targets."
 advanced_periscope:0 "Advanced Periscope"
 advanced_periscope_desc:0 "New technology focuses on solving the vibration problem of periscopes when the submarine is sailing. With the additional mast bracket, even if the submarine sails at a speed of 6-8 knots, its periscope will not be affected by the waves. Another improvement is the increased watertightness, an upgrade that protects the optics from impact of depth charge blast."
 basic_ballast_tank:0 "Базовый балластная цистерна"
 basic_ballast_tank_desc:0 "Балластная цистерна представляет собой кабину, в которой размещается балластная вода и используется для регулировки центра тяжести, плавучести и устойчивости судна. На подводной лодке балластная цистерна определяет скорость погружения и всплытия подводной лодки и играет решающую роль в ее тактике."
 improved_ballast_tank:0 "Improved Ballast Tank"
 improved_ballast_tank_desc:0 "The newly designed ballast tank uses technologies including a more reliable water pump and a filter to prevent impurities in the water from entering the water tank, which effectively improves its durability."
 torpedo_computer:0 "Вычислитель данных торпеды"
 torpedo_computer_desc:0 "На подводных лодках во время Великой войны применялись ручные логарифмические линейки или механические калькуляторы для облегчения баллистических расчетов торпед, которые основывались на счетной грамотности оператора и имели низкую точность. Чтобы противостоять этому, на основе аналоговых компьютеров была изобретена вычислительная машина торпед. Это устройство устанавливалось в боевой рубке и было настолько громоздким, что для его эксплуатации и обслуживания требовалось два опытных специалиста, но все равно оно являлось прекрасным дополнением подводной лодки."
 torpedo_loader:0 "Torpedo Loader"
 torpedo_loader_desc:0 "A torpedo loading assistance device equipped by high-speed submarine that greatly reduces reloading time. Submarines with such system can be terrible underwater killers."
 anechoic_tile:0 "Anechoic Tile"
 anechoic_tile_desc:0 "Anechoic tile is a synthetic rubber sound-proof material with a thickness of about 30mm and a cylindrical cavity with a diameter of 2-5mm inside, which can effectively suppress noise and vibration, and improve the stealth of submarines."
 sub_AIP_engine:0 "Air-Independent Propulsion"
 sub_AIP_engine_desc:0 "Air-independent propulsion is a technology that can drive a submarine for a long time without taking oxygen from air. The self-sustainability of submarines with AIP engines is more than twice that of ordinary diesel-electric submarines, which means the submerged time is longer."
 submarine_mass_production:0 "Submarine Mass Production"
 submarine_mass_production_desc:0 "By applying modular building method, shipyard can launch more submarines in a relatively short period of time."
  
 multi_mounted_battery:0 "Multi-Mounted Battery"
 multi_mounted_battery_desc:0 "With a better mastering of complex mechanical structure, naval powers post-Great-War started to invest in multi-mounted guns in a turret, in an attempt to achieve stronger firepower with similar size and tonnage. The most common one was the widely used triple-mounted turret. Quadruple guns were even stronger, but their poor reliability remained a huge cutback."
 basic_super_heavy_battery:0 "Early Super Heavy Battery"
 basic_super_heavy_battery_desc:0 "A super-heavy ship gun developed before the Naval Holiday. It was reported that the British N3 class would be equipped with 18-inch guns, similar armaments were also seen on the US and Japanese designs. This cannon is extremely powerful, and can easily penetrate any battleship armor."
 experimental_super_heavy_battery:0 "Experimental Super Heavy Battery"
 experimental_super_heavy_battery_desc:0 "In 1915, Admiral John Fisher proposed a super large battlecruiser to the Royal Navy, known as the HMS Incomparable. The design was intended to mount 20-inch guns, which would have been the largest ever mounted on a warship. However, the later research on 18-inch guns met various problems and ended half-way after the Washington Naval Conference. Countries including Japan and Germany re-initiated developement of 20-inch guns during the war, but have never come up with a functional model."
 improved_super_heavy_battery:0 "Improved Super Heavy Battery"
 improved_super_heavy_battery_desc:0 "Technological advances in related fields have helped the navy solve many problems found on the old 18-inch guns. The new super heavy guns usually use a caliber of about 18 inches, which is much more powerful than the 16-inch guns used by ordinary battleships."
 improved_medium_heavy_battery:0 "Improved Medium Heavy Battery"
 improved_medium_heavy_battery_desc:0 "Though the calibers of these guns were similar to those used by pre-dreadnoughts, its firepower and penetration were largely improved to match early battlecruisers thanks to the use of modern technology and fire control systems."
 advanced_medium_heavy_battery:0 "Advanced Medium Heavy Battery"
 advanced_medium_heavy_battery_desc:0 "A larger caliber was adopted for main guns of large cruisers, which could be compared with some dreadnoughts."
  
 naval_combat_support:0 "Naval Logistics"
 naval_combat_support_desc:0 "Sea power means more than the combatant ships and aircraft. As the fleet expands, it also requires innovative management protocals and a professional team of logistic personnel to properly operate.\nWhether in peace or war, the mission of naval logistics is about providing and sustaining operational readiness by sending the right support to the right place at the right time."
 basic_port_facility:0 "Basic Port Facility"
 basic_port_facility_desc:0 "A port is a maritime facility comprising one or more wharves and loading areas, usually refered as a naval base in terms of military.\nThe naval base is responsible for daily maintenance of ships and launching naval operations, backed by basic facilities including docks, arsenals, and fuel silos."
 large_shipyard:0 "Large Shipyard"
 large_shipyard_desc:0 "Increasing investments in the shipbuilding industry in the 19th century have brought dramatic changes to those enterprises when seapower became one of the most decisive factors in a country's strength. Small companies gradually got eliminated or annexed by industrial tycoons. The leading enterprises owned the largest shipyards in the world with ability to complete orders of several advanced warships at the same time."
 heavy_crane:0 "Heavy Crane"
 heavy_crane_desc:0 "Crane is generally equipped with ropes or chains, and sheaves, that can be used to lift or lower heavy objects. It is extensively used in shipbuilding industry for installing turret and other parts on a warship."
 dry_dock:0 "Dry Dock"
 dry_dock_desc:0 "Designed as a narrow basin that can be flooded to let a vessel float in and rest on a dry platform after drained, the dry dock was invented thousands of years ago and is still in use today. With that, it is easier to maintain and repair the underwater parts of the ship."
 port_construction_corps:0 "Corps of Engineers"
 port_construction_corps_desc:0 "Members of the corps of engineers are both construction workers and engineers. They are deployed to the first line of naval and amphibious operations, building and repairing all types of infrastructure required, such as temporary ports, airfields, and supply bases."
 integrated_shipyard_complex:0 "Concentrated Shipbuilding Complex"
 integrated_shipyard_complex_desc:0 "By concentrating shipbuilding industries to a few key sites, it will largely improve R&D efforts, and access to essential resources and mechanical parts. Such complex consists of a great number of shipyards, docks and other suppliers, in order to function independently under most circumstances."
 speed_over_range:0 "Quick Reaction"
 speed_over_range_desc:0 "Agility is the most important matter in war. We should focus on the speed of naval logistics to make sure supplies are delievered to units in need whenever they ask.\n\n">
 range_over_speed:0 "Global Presence"
 range_over_speed_desc:0 "Despite being far away, the enemy shall be punished. We should focus on the reach of naval logistics to make sure the fleet can operate in distant waters.\n\n">
 high_speed_civilian_engine:0 "High Speed Civilian Engine"
 high_speed_civilian_engine_desc:0 "Due to the cost of high speed engines, civilian ships usually adopts economical but slower ones. However, money has never been an issue in a dynamic war."
 armed_civilian_ship:0 "Merchant Raider"
 armed_civilian_ship_desc:0 "Merchant raiders are military ships diguised as non-combatant vessels. They were widely used during the Great War for different purposes, such as anti-submarine warfare and commerce raiding."
 repair_ship:0 "Ремонтный корабль"
 repair_ship_desc:0 "Ремонтное судно — это рабочая пчела флота, обычно отвечающая за предоставление широкого спектра ремонтных возможностей, включая оборудование и персонал для ремонта серьезных неисправностей техники и боевых повреждений."
 floating_dry_dock:0 "Floating Drydock"
 floating_dry_dock_desc:0 "The floating drydock is a mobile repair platform built for the purpose of maintenance of ships on the sea.\nPlaced under a ship below waterline, water is then pumped out of the floating drydock, raising the ship above surface. Then the ship becomes blocked on the deck for repair."
 logistic_system_redundancy:0 "Logistics Redundancy"
 logistic_system_redundancy_desc:0 "To ensure that logistics system can properly function even at the worst scenario, it is crucial to have some redundancy in the initial stage of logistic operations. By storing double or even triple times of supplies needed, we can reinforce the frontline against all odds."
 hospital_ship:0 "Hospital Ship"
 hospital_ship_desc:0 "A hospital ship is a ship designated for primary function as a floating medical treatment facility or hospital. Most are operated by the military forces of various countries, as they are intended to be used in or near war zones."
 surgery_at_sea:0 "Surgery At Sea"
 surgery_at_sea_desc:0 "Specialised crew members capable of providing medical care have been a feature of military vessels for at least two thousand years. But the conditions aboard is way harsher than on land considering jolts caused by waves, salinity and humidity.\nWith the combined advance in medical science and shipbuilding technology, onboard surgery is made possible to save more lives on the raging sea."
 medical_supply_at_sea:0 "Trans-Oceanic Medical Supply"
 medical_supply_at_sea_desc:0 "Lessons from the Battle of Gallipoli have warned every nation of weak points in trans-oceanic supplyline. When medications reach the other side of the ocean, they sometimes corrupt due to extreme environments. By installing improved medical storage on boats, it will be helpful in long-range cruises and amphibious operations."
 joint_sea_hospital:0 "Joint Sea Hospital"
 joint_sea_hospital_desc:0 "With skyrocketing casualties on the frontline, field hospitals are usually overwhelmed to treat the wounded. The hospital ships are deployed at sea, far from the battlefield, and can relieve the overloaded hospitals on land."
 naval_fuel_complex:0 "Naval Oil Depot"
 naval_fuel_complex_desc:0 "The industrial warfare is driven by oil, especially the naval branch. As one of the most important resources to power warships, the navy has its own heavily-guarded compound for fuel storage.\nBy expanding these facilities, it will greatly improve the sustainability of our navy."
 retardant_silo:0 "Retardant Silo"
 retardant_silo_desc:0 "Fuel is extremely vulnerable to fire and heat. Applying retardant materials to the shell of fuel silos makes it safer in case of fire."
 integrated_fuel_base:0 "Large Fuel Base"
 integrated_fuel_base_desc:0 "By concentrating more fuel storage and refueling stations in one place, it can largely improve the refueling efficiency and max fuel capacity."
 vnr_ship_hull_civilian_1:0 "Auxiliary Ship Hull"
 vnr_ship_hull_civilian_2:0 "Fast Combat Support Ship Hull"
 vnr_ship_hull_civilian_2_desc:0 "When a fleet sorties, the combatant ships will never stop to wait for slower ships to catch up. A fast combat support ship can keep up the pace with the fleet and provide supports even during the combat."
 vnr_ship_hull_civilian_3:0 "Replenishment Oiler Hull"
 vnr_ship_hull_civilian_3_desc:0 "The replenishment oiler is a type of slower but all-round naval auxiliary ships with larger fuel tanks and dry cargo holds. Other than ship fuel, it can also provide air fuel to planes on the carrier."
  
  
 modifier_repair_speed_naval_base_factor:0 "Naval Base Repair Speed"
 modifier_repair_speed_dockyard_factor:0 "Dockyard Repair Speed"
 modifier_repair_speed_fuel_silo_factor:0 "Fuel Silo Repair Speed"


# cold war techs
 rocket_depth_charges: "Anti-Submarine Missiles"
 rocket_depth_charges_desc: "To counter the new post-World War II submarines which run quieter, at much higher speed and can attack from much longer range with high speed homing torpedoes, modern anti-submarine weapon system is in desperate need to expand its range and sensors. The Rocket Assisted Torpedo (RAT) can be delievered by rocket engine, which allows warships the stand-off capability to attack hostile submarines with very little advance notice to them.\n\nMounting this module on §YLight Ships§! and §YCruisers§! will allow them to attack enemy §YSubmarines§!."
 destroyer_guided_missile_upgrade: "Guided Missile Destroyer"
 destroyer_guided_missile_upgrade_desc: "As missiles evolving, they have become smaller in size, enabling conversion of a light ship into formidable war machine like former battleship on high sea.\n\nInstall §YMissile Destroyer Role§! on §YLight Hull§! to unlock §YAnti-Ship Missile§!."
 destroyer_hull_improvement: "Ocean-going Destroyer"
 destroyer_hull_improvement_desc: "Destroyer, emerged as an escort of capital ships in the early 20th century, has grown into the de facto capital ship of a modernized fleet in the second half of the century, carrying out all kinds of missions that were designated to cruisers or even battleships. It has been proved to be an economical multi-role ship with an increasingly important role in the near future."
 modern_sonar: "Modern Active Sonar"
 modern_sonar_desc: "Post War active sonar, this is the advanced sonars developed by the major powers in the very late and post war period."
 phased_array_radar: "Phased Array Radar"
 phased_array_radar_desc: "In antenna theory, a phased array usually refers to an electronically scanned array, a computer-controlled array of antennas which creates a beam of radio waves that can be electronically steered to point in different directions without moving the antennas. Once combined with radar technology, a phased array radar can track down multiple sea and air targets simultaneously while giving detailed information about their direction, speed and altitude."
 decoy_launching_system: "Decoy Launching System"
 decoy_launching_system_desc: "Commonly equipped with radio or infrared guidance systems, missiles can easily track down moving ships regardless of its evasion maneuvers. To foil incoming threat, the decoy launching system has ensured a terminal method to distract the guidance system of missile with chaff or infrared emitting decoys."
 new_ship_materials: "New Materials"
 new_ship_materials_desc: "Given that missiles are highly accurate and able to penetrate the thickest of steel, naval armor has receded in importance of warship architecture ever since the worldwide commissions of guided missiles. Instead of meaningless investment to strengthen physical protection, new materials invented in laboratory are lighter, thus it can achieve a higher top speed on heavy ships."
 nuclear_reactor_cost_reduction: "Economical Nuclear Reactor"
 nuclear_reactor_cost_reduction_desc: "The fission reactor has marked the jewel of human's industrial power as the world is heading towards the 1950s. In an attempt to build a full-nuclear fleet, new materials and devices are developed to reduce the cost of ship nuclear reactor."
 full_missile_ship: "Full Missile Warship"
 full_missile_ship_desc: "Featuring extraordinary precision and range, missile almost outdated naval artillery overnight and encouraged a radical fleet transformation in navies that have seen its value. Naval architects have completely abandoned designing methodology of gun ships inherited from their predecessors, and choose to embrace new concepts which turn modern ships into competent missile-launching platforms."
 nuclear_engine_research: "Surface Ship Nuclear Engine"
 nuclear_engine_research_desc: "Nuclear marine propulsion is propulsion of a ship with heat provided by a nuclear reactor. The power plant heats water to produce steam for a turbine used to turn the ship's propeller through a gearbox or through an electric generator and motor."
 naval_tactical_data_system: "Naval Tactical Data System"
 naval_tactical_data_system_desc: "Naval Tactical Data System (NTDS) is a computerized information processing system developed in the 1950s for use in combat ships. It takes reports from multiple sensors on different ships and collates it to produce a single unified map of the battlespace. This information can then be relayed back to not only ships' COs, but also weapon operators."
 integrated_combat_system: "Integrated Combat System"
 integrated_combat_system_desc: "The Integrated Combat System is a scalable, netted combat management system, utilizing common software and computing infrastructure to rapidly field capability across all domains to the surface fleet."
 memory_expansion: "Arrayed Magnetic Core Memory"
 memory_expansion_desc: "The revolutionary breakthrough in semiconductors post-war has made expansion of memory possible on existing computers. With a higher frequency of calculation, the reaction period of fire control computer against rapidly moving targets can be reduced to a large degree."
 comprehensive_display_system: "Comprehensive Display System"
 comprehensive_display_system_desc: "The Comprehensive Display System (CDS) is a command, control, and coordination system that allows easy display of objects and IDs collected from radars on a single monitor. The CDS successfully reduces complexity to generate a situation map, and thus it can assist operators in calculating interception points either automatically or manually for friendly units against unknown targets."
 electromagnetic_signature_study: "Electromagnetic Signature Study"
 electromagnetic_signature_study_desc: "Every vessel emits electromagnetic field, a unique physical property that can be used to identify it. Typically propagated through water, it is susceptible to being detected by underwater sensors, and needs to be kept below a certain threshold in order to for the vessel to sail safely over sea mines or any weapon systems with magnetic guidance."
 recon_drones: "Recon Drones"
 recon_drones_desc: "An unmanned aerial vehicle (UAV), commonly known as a drone, is an aircraft without any human pilot, crew, or passengers on board. UAVs were originally developed through the 20th century for military missions too \"dull, dirty or dangerous\" for humans. Their naval variants are produced with fixed or rotor wings, and placed on ships to undertake the duty of recon and anti-submarine warfare."
 optical_landing_system: "Optical Landing System"
 optical_landing_system_desc: "As the replacement of LSO, the optical landing system (OLS) is controlled by computer, and thus is more reliable and efficnet than human. It is used to give glidepath information to pilots in the terminal phase of landing on an aircraft carrier with precision close to milliseconds."
 airborne_early_warning: "Carrier-Based AWACS"
 airborne_early_warning_desc: "To expand interception range and area-denial capabilities of the surface fleet, supercarriers are equipped with AWACS (Airborne Early Warning and Control) aircraft carrying advanced radar and tracking system. Its airborne radar system is designed to detect aircrafts, ships, vehicles, missiles, and other incoming projectiles at long ranges and perform command and control of the battlespace in an air engagement by directing fighters and air strikes."
 iff_device: "IFF Device"
 iff_device_desc: "First developed during the war with advance on radar and several friendly fire incidents, the Identification, friend or foe (IFF) is an identification system designed for command and control. It uses a transponder that listens for an interrogation signal and then sends a response that identifies the broadcaster."
 tactical_air_navigation_system: "Tactical Air Navigation System"
 tactical_air_navigation_system_desc: "A tactical air navigation system, commonly referred to by the acronym TACAN, is an upgraded version of navigation system compared to single-sourced radio beacon, typically used by military aircraft. It provides the user with bearing and distance (slant-range or hypotenuse) to a ground or ship-borne station."
 sub_nuclear_engine: "Submarine Nuclear Engine"
 sub_nuclear_engine_desc: "The conceptual design of the first nuclear submarine began in the late 1940s as the advance in nuclear technology allowed smaller power plant to be installed on platforms such as submarines. Designed as a pressurized water reactor, the new submarine reactor can offer infinite range, making the submerging time to be theoretically forever long."
 wire_guided_torpedo: "Wire-Guided Torpedo"
 wire_guided_torpedo_desc: "A wire-guided torpedo is a torpedo that is guided by signals sent to it via thin wires connected between the torpedo and its guidance mechanism, which is located somewhere near the launch site."
 sonar_telephone: "Sonar Short-Range Communication"
 sonar_telephone_desc: "The underwater telephone is used on all crewed submersibles and many Naval surface ships in operation. Voice or an audio tone (morse code) communicated through the sonar system are heterodyned to a high pitch for acoustic transmission through water which allows a short-range communication between submarines."
 hydrocooling_battery: "Hydrocooling Battery"
 hydrocooling_battery_desc: "The ability of a submarine to operate underwater and return to the surface was largely due to a large bank of lead-acid batteries that required nearly constant attention by the boat's crew. With the hydrocooling system installed, the storage battery could work for longer time thus improving its durability."
 rescue_submarine: "Rescue Submarine"
 rescue_submarine_desc: "The rescue submarine, or sometimes refered as deep-submergence rescue vehicle (DSRV), is a type of vehicle used for rescue of downed submarines. It has a pressure hull with internal space to carry several survivors, and the capacity to lock onto a disabled submarine's escape hatch surrounds, pump out the water from the space between its hatch."
 
 
 # doctrine
 TITLE_FLEET_IN_BEING: "Fleet in Being"
 TITLE_TRADE_INTERDICTION: "Trade Interdiction"
 TITLE_BASE_STRIKE: "Base Strike"
 cat_fleet_in_being: "Fleet in Being Doctrine"
 cat_trade_interdiction: "Trade Interdiction Doctrine"
 cat_base_strike: "Base Strike Doctrine"
 FLEET_IN_BEING_DESC: "A strong fleet focused around battleships means that we are a force to be reckoned with when deployed at sea."
 TRADE_INTERDICTION_DESC: "Against a stronger naval opponent we can focus on tying up their fleet and destroying supply lines to starve their war machine."
 BASE_STRIKE_DESC: "With a strong focus on carriers and their support, no enemy will be outside our reach, whether on land or at sea."
 fast_battleship_primacy: "Первенство быстрых линкоров"
 fast_battleship_primacy_desc: "Флот линкоров, обладающий единой высокой скоростью и универсальными характеристиками, способен справиться с любыми задачами на море.\n\n"
 scouting_fleet_primacy: "Первенство разведывательного флота"
 scouting_fleet_primacy_desc: "Преимущества быстроходных линкоров слишком преувеличены, в то время как традиционное разделение труда на линкоры и крейсера доказало свою экономичность и эффективность.\n\n"
 torpedo_groups: "Торпедные группы"
 torpedo_groups_desc: "Главная задача наших кораблей - изводить вражеские флоты торпедами и в конечном итоге нарушить их строй, чтобы обеспечить нам благоприятную ситуацию."
 decisive_battle: "Решающее сражение флота"
 decisive_battle_desc: "Когда наступит подходящий момент, наш флот, усиленный воздушными и сухопутными силами, совершит вылазку, чтобы покончить с врагом в одном решающем сражении."
 armed_merchantmen: "Вооруженные торговые суда"
 armed_merchantmen_desc: "Против безудержного надводного и подводного рейдерства вооруженные торговые суда будут хорошим вариантом для защиты конвоя в отсутствие эскортных кораблей."
 submarine_picket: "Пикет подводных лодок"
 submarine_picket_desc: "Организация группы подводных лодок вблизи вражеских портов или других ключевых точек позволит нам шпионить за передвижениями вражеского флота, даже не замечая этого."
 submarine_picket_bs: "Пикет подводных лодок"
 submarine_picket_bs_desc: "Организация группы подводных лодок вблизи вражеских портов или других ключевых точек позволит нам шпионить за передвижениями вражеского флота, даже не замечая этого."
 coastal_operations: "Прибрежные операции"
 coastal_operations_desc: "Хотя подводные лодки легче обнаружить на мелководье, группа таких судов все равно будет представлять достаточную угрозу для военно-морских и десантных операций у нашего побережья.\n\n"
 ambush_tactics: "Тактика засад"
 ambush_tactics_desc: "Если использовать подводные лодки в засадах и минных постановках, то больше шансов потопить вражеские корабли."
 tonnage_war: "Война за тоннаж"
 tonnage_war_desc: "Ключ к парализации военного потенциала страны лежит в уничтожении ее торговых конвоев. Потопив корабли быстрее, чем обороняющаяся сторона сможет их заменить, мы одержим победу в этой войне на истощение."
 guerrilla_tactics: "Партизанская тактика"
 guerrilla_tactics_desc: "Вместо того чтобы установить контроль над морем, мы должны твердо следовать стратегии бей и беги. К тому времени, когда враг найдет обломки корабля, наши корабли уже будут далеко."
 adjacent_projection: "Проекция прилегающей мощности"
 adjacent_projection_desc: "Поскольку флоты разбросаны по океанам, нам также важно оставаться неоспоримыми в своей сфере влияния."
 naval_concealment: "Меры по маскировке"
 naval_concealment_desc: "Флот не должен выставлять себя напоказ ни при каких обстоятельствах, но когда он это сделает, это будет конец для нашего врага."
 carrier_task_forces: "Carrier Task Forces"
 carrier_task_forces_desc: "Organized task forces with carriers and light cruisers ensures that the enemy will never catch us off guard."
 naval_air_force: "Воздух превыше флота"
 naval_air_force_desc: "Хотя это и не является общепризнанным, обеспечение превосходства в воздухе с помощью самолетов наземного базирования большой дальности является основой победы на море.\n\n"
 frequent_air_raid: "Частые воздушные налеты"
 frequent_air_raid_desc: "Принцип морского боя заключается в уничтожении вражеских авианосцев и сохранении своих. Посылка воздушных рейдов относительно меньшими группами и с большей частотой может удовлетворить обе эти задачи."
 mass_air_raid: "Массированный воздушный налет"
 mass_air_raid_desc: "Авианосец - это всего лишь плавучий аэродром на море, а наибольшую угрозу для надводного флота представляют самолеты. Массированный воздушный налет с аэродромов, чтобы вывести из строя вражеские авианосцы, более чем достаточен для поддержки наших операций."
 flight_deck_management: "Управление летной палубой"
 flight_deck_management_desc: "Несмотря на фиксированную пропускную способность, грамотное управление взлетными операциями позволит поднять эффективность вылетов самолетов, базирующихся на авианосцах, на новый уровень и сделать работу авианосцев эффективнее."
 circle_formation: "Круговое построение"
 circle_formation_desc: "Если флот сосредоточен на операциях с авианосцами, нам нужны только два типа кораблей - авианосцы и эскорт. Круговое построение будет защищать авианосец в центре перекрестным огнем из зенитных орудий всех кораблей сопровождения."
 circle_formation_desc: "Если флот сосредоточен на операциях с авианосцами, нам нужны только два типа кораблей - сами авианосцы и эскорт. Круговая Формация  будет защищать авианосец в центре перекрестным огнем из зенитных орудий всех кораблей сопровождения."

