 ship_rocket_artillery: "Корабельная реактивная артиллерия"
 ship_rocket_artillery_desc: "Недавние достижения в области ракетостроения не только устранили недостаток дальнобойности, но и сделали реактивную артиллерию более доступной для массового производства. Учитывая ее успех в наземных боевых действиях, предпринимаются попытки совместить это мощное оружие с боевыми кораблями. Корабельная реактивная артиллерия использует ракеты без какого-либо устройства наведения. Несмотря на низкую точность, они могут нанести значительный урон объекту даже без прямого попадания. Между тем, изобретение неконтактного взрывателя помогло компенсировать его слабость."
 
