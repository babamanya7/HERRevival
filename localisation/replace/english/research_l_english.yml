 # support tech extension
 unmanned_gun_turret: "Remote-Controlled Gun Turret"
 unmanned_gun_turret_desc: "By the 1950s, turret has been shrunk in size and automated to adapt continuously changing dynamics of war, with gun laying controlled remotely from the ship's control center using inputs from radar and fire control computers."
 modern_generic_battery: "Naval Automatic Gun System"
 modern_generic_battery_desc: "The \"SjöAutomatKanon\" (SAK), or Naval Automatic Gun System, was an automatic dual-purpose weapon system developed by Swedish military immediately after the Second World War. The revolution of jet technology saw great improvement in the speed of aircrafts in the late-war period when a jet plane can fly at speeds close to 1,000 kilometres per hour, rendering anti-air guns ineffective against it. With fire-control computers and quick-firing guns, SAK can fire enough rounds in a short period to ensure a hit."
 coldwar_ship_torpedo_launcher: "Cold War Torpedo Launcher"
 coldwar_ship_torpedo_launcher_desc: "Because of improved submarine strength and speed, post-WWII torpedoes were given improved warheads and better motors.\n\nMounting this module on §YLight Ships§! or §YCruisers§! allows them to do significant damage to enemy §YCapital Ships§!."
 missile_submarine: "Подводная лодка с крылатыми ракетами"
 missile_submarine_desc: "Ракеты с радиоуправлением, разработанные в конце войны, считались родоначальниками современных крылатых ракет, способных преодолевать большие расстояния на дозвуковой скорости и поражать наземные и морские цели с высокой точностью. При соответствующей доработке военно-морским архитекторам удалось добиться того, что подводные лодки могут нести и запускать крылатые ракеты (КРМБ, состоящие из крылатых ракет наземного базирования и противокорабельных ракет) в качестве основного вооружения."
 wake_homing_torpedo: "Wake Homing Torpedo"
 wake_homing_torpedo_desc: "Wake is the region of disturbed flow downstream of a solid body moving through a fluid, caused by the flow of the fluid around the body. Naval engineers have exploited such phenomenon and invented a guidance technique based on the wake trajectory left behind a moving target. Torpedo with wake homing system will be fired to cross behind target's stern and damage its propulsion and steering."
 proximity_detonator: "Proximity Detonator"
 proximity_detonator_desc: "A torpedo fitted with a proximity fuze can be detonated directly under the keel of a target ship. The explosion creates a gas bubble which may damage the keel or underside plating of the target. However, the most destructive part of the explosion is the upthrust of the gas bubble, which will bodily lift the hull in the water. The structure of the hull is designed to resist downward rather than upward pressure, causing severe strain in this phase of the explosion."
 
 improved_ship_torpedo_launcher: "Improved Ship Torpedo Launcher"
 advanced_ship_torpedo_launcher: "Advanced Ship Torpedo Launcher"
 modern_ship_torpedo_launcher: "Modern Ship Torpedo Launcher"
 
 oxygen_torpedo: "Compressed Oxygen Torpedo"
 oxygen_torpedo_desc: "The amount of fuel that can be burned by a torpedo engine is limited by the amount of oxygen it carries. Since compressed air contains only about 21% oxygen, pure oxygen, despite the cost, is used to fuel torpedo in exchange of higher speed and range, which its performance is unmatched by any contemporary torpedoes in service.\n\n"
 electric_torpedo: "Electric Torpedo"
 electric_torpedo_desc: "Instead of leaving an easily-detected trail of bubbles, a torpedo with an electrical engine remains practically invisible until it hits. This also means that there is no trail leading back to the launching submarine."

 tactical_data_link: "Tactical Data Link"
 tactical_data_link_desc: "The Tactical Data Link introduces a data link standard of communication via radio waves or cable. All military C3 systems use standardized data link to transmit, relay and receive tactical data, making the data transmission between friendly units secure and efficient.\n\n§YUpon researched, your allies will be granted a decision to access your data link. If they agree, they won't be allowed to research their own equivalent.§!"
 tactical_data_link_for_member: "Access to Allies Tactical Data Link"
 tactical_data_link_for_member_desc: "The Tactical Data Link introduces a data link standard of communication via radio waves or cable. All military C3 systems use standardized data link to transmit, relay and receive tactical data, making the data transmission between friendly units secure and efficient."
 signal_control: "Electromagnetic Signal Regulation"
 signal_control_desc: "With stacking electronic devices aboard, ship's whereabouts has become transparent to both sides. The regulation on electromagnetic signals was adopted to ensure that all devices function at standardized frequency, and make the fleet electronically invisible."
 advanced_radar_finder: "Radar Finder"
 advanced_radar_finder_desc: "Radar is a device that emits radio waves to determine the distance, direction and radial velocity of objects relative to the site. Radar finder exploits this feature and determines the direction of radio source with multiple direction-finding antennas by triangulation."
 close_in_area_air_defense: "Close-in Area Air Defense"
 close_in_area_air_defense_desc: "During the Second World War, naval fleet was often faced with low-altitude air threats posed by suicide planes and radio-guided cruise missiles. With rehabilitation and modernization of wartime destroyers, they will be the last barrier against these threats."
 wave_resistance_design: "Wave Resistance Design"
 wave_resistance_design_desc: "Huge waves on the highsea have been the biggest challenge to boats for the past few centuries, especially for light ships such as destroyers. By using a fine bow with a sharper angle that pushes the wave out of the way more gradually, the amount of energy required to displace the water will be less, making the ship sail steadily."
 cryptography_revolution: "Cryptography Revolution"
 cryptography_revolution_desc: "Inspired by unprecedented computing power of computers after the war, cryptography has seen breakthroughs in both encryption algorithms and communication technologies. The engineering advance, usually represented by electronic encrypting machines, advanced algorithms, and frequency-hopping technology, is all but perfection in terms of protecting military information."
 luneburg_lens: "Luneburg Lens"
 luneburg_lens_desc: "A Luneburg lens is a spherically symmetric gradient-index lens and can be made for use with electromagnetic radiation from visible light to radio waves. First introduced by Prof. Rudolf Luneburg, this device can be used in manufacture of microwave antenna. Compared to parabolic dish, the antenna with Luneburg lens possesses quite an advantage, which it can be steered by moving the feed around the lens without having to bodily rotate the whole antenna."

 converted_super_heavy_carrier: "Converted Super Heavy Carrier"
 advanced_missile_system: "Active Radar Homing Missile"
 advanced_missile_system_desc: "The post-war revolution in electronics has made smaller guidance system possible. The active radar homing technology allows missile to carry radar transceiver and electronics necessary to find and track its target autonomously, which becomes prototype of the later fire-and-forget technologies."

 heavy_armor_research_tt: "\n§GBreakthrough in heavy armor plate will benefit research on cruiser armor in return.§!"
 cruiser_armor_research_tt: "\n§GBreakthrough in cruiser armor plate will benefit research on heavy armor in return.§!"