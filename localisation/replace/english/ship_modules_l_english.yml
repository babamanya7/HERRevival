 ship_armor_cruiser_heavy_1:0 "100мм пояс/50мм палуба" 
 ship_armor_cruiser_heavy_1_short:0 "Большая крейсерская броня I"
 ship_armor_cruiser_heavy_1_desc:0 "Схема бронирования, призванная дать крейсеру небольшое преимущество в борьбе с эсминцами и другими легковооруженными кораблями."
