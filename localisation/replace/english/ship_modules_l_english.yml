 heavy_ship_engine_3_diesel:0 "150000 л.с."
 heavy_ship_engine_4_diesel:0 "210000 л.с."
 heavy_ship_engine_2_diesel_desc:0 "Этот двигатель, значительно более мощный, чем предыдущие модели, предназначен для того, чтобы дать тяжелому кораблю комфортный запас скорости по сравнению со старыми образцами."
 heavy_ship_engine_3_diesel_desc:0 "Поскольку вес оружия и брони растет, этот двигатель был разработан для обеспечения более высоких скоростей, чтобы преследовать убегающих врагов или сохранять дистанцию ​​​​от превосходящих врагов."
 heavy_ship_engine_4_diesel_desc:0 "Эта силовая установка, созданная с использованием новых материалов и улучшенной конструкции котла, призвана позволить современному линкору не отставать от быстрых авианосцев и крейсеров."
