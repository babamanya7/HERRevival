 carrier_aviation_control_unit: "Авиационный пульт управления"
 carrier_aviation_control_unit_short: "Управление авиацией"
 carrier_aviation_control_unit_desc: "За взлетно-посадочные операции отвечают авиационные диспетчерские службы, которые следят за тем, чтобы эти действия выполнялись эффективно."
 carrier_damage_control_unit: "Отдел контроля повреждений"
 carrier_damage_control_unit_short: "Контроль повреждений"
 carrier_damage_control_unit_desc: "Устройства контроля повреждений предохраняют судно от ситуаций, которые могут привести к затоплению корабля."
 carrier_scouting_unit: "Отряд самолетов-разведчиков"
 carrier_scouting_unit_short: "Разведывательный отряд"
 carrier_scouting_unit_desc: "На авианосце развернута эскадрилья профессиональных самолетов-разведчиков. Эти самолеты, оснащенные увеличенными топливными баками и радиостанциями, предназначены для поиска флота противника на расстоянии сотен миль от своего носителя."
 carrier_spared_squad: "Резервный отряд"
 carrier_spared_squad_short: "Резервный отряд"
 carrier_spared_squad_desc: "В качестве дополнения им был выделен отряд самолетов."
 carrier_fuel_storage: "Хранилище авиационного топлива"
 carrier_fuel_storage_short: "Хранилище авиационного топлива"
 carrier_fuel_storage_desc: "Большое пространство на авианосце для хранения авиационного топлива."
 carrier_civilian_material: "Использование нестратегитечских материалов"
 carrier_civilian_material_short: "Нестратегические материалы"
 carrier_civilian_material_desc: "Использование гражданских материалов на носителях удешевит их производство."
 carrier_secondary_island: "Вторичный мостик"
 carrier_secondary_island_short: "Вторичный мостик"
 carrier_secondary_island_desc: "Вторичный мостик, устанавливаемый на полетной палубе для разгрузки авиационных пунктов управления, расположенных на основном мостике."
 carrier_strength_deck: "Усиленная палуба"
 carrier_strength_deck_short: "Усиленная палуба"
 carrier_strength_deck_desc: "Верхняя сплошная палуба, выдерживающая продольный изгиб, которая глубоко интегрирована с корпусом судна."
 ship_helipad: "Морской вертолет"
 ship_helipad_short: "Вертолетная площадка"
 ship_helipad_desc: "Вертолетная площадка - место, где может взлетать и садиться один вертолет"
 ship_airplane_launcher_3: "Катапульта с паровым приводом"
 ship_airplane_launcher_3_desc: "Катапульта с паровым приводом позволяет самолетам взлетать с очень ограниченного пространства."
 side_lift: "Боковой подьемник"
 side_lift_desc: "Боковой подъемник позволяет повысить эффективность вылетов, не занимая при этом пространства на палубе."
 angled_deck: "Угловая палуба"
 angled_deck_desc: "Угловая палуба позволяет одновременно выполнять операции по посадке и взлету."
 ship_anti_air_5: "Зенитно-ракетный комплекс"
 ship_anti_air_5_desc: "Тип зенитных ракет без систем наведения."
 ship_deck_space_small: "Небольшая ангарная площадь"
 ship_deck_space_small_short: "Малый ангар"
 ship_deck_space_small_desc: "Небольшой ангар с ограниченной вместимостью."
 ship_deck_space_big: "Большой бронированный ангар"
 ship_deck_space_big_short: "Большой ангар (бронированный)"
 ship_deck_space_big_desc: "Большой ангар с большой вместительностью"
 ship_deck_space_bb: "Переоборудованные ангары"
 ship_deck_space_bb_short: "Переоборудованные ангары"
 ship_deck_space_bb_desc: "Грубая полетная палуба ограниченной длины, установленная на линкоре в качестве подхода к переоборудованию его в линейный авианосец."
 ship_deck_space_more: "Большой открытый ангар"
 ship_deck_space_more_short: "Большой ангар (открытый)"
 ship_deck_space_more_desc: "Большая открытая площадка внутри корабля, позволяющая обслуживать и вооружать колесные самолеты. Увеличение площади ангара значительно повышает стоимость корабля."
 ship_deck_space_armored: "Средний бронированный ангар"
 ship_deck_space_armored_short: "Средний ангар (бронированный)"
