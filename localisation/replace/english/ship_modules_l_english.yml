 ship_armor_cruiser_heavy_2_short:0 "Большая крейсерская броня II"
 ship_armor_cruiser_heavy_2_desc:0 "Более тяжелый пояс, позволяющий крейсеру вступать в бой со старыми легкими крейсерами и небольшими кораблями, имея при этом хорошую защиту." 
