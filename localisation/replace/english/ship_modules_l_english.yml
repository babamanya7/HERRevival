 ship_heavy_battery_1_triple_desc:0 "Крупнокалиберная пушка, выпущенная до Великой войны."
 ship_heavy_battery_2_triple_desc:0 "Комплект крупнокалиберных пушек в тяжелобронированной установке. Модернизированная конструкция башни позволила увеличить высоту орудия, тем самым увеличив дальность стрельбы."
 ship_heavy_battery_3_triple_desc:0 "Тяжелобронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 ship_heavy_battery_4_triple_desc:0 "Эта тяжелобронированная установка, являющаяся результатом эволюции тяжелой огневой мощи, обеспечивает высокую точность на больших дистанциях."
 ship_heavy_battery_1_quad_desc:0 "Крупнокалиберная пушка, выпущенная до Великой войны."
 ship_heavy_battery_2_quad_desc:0 "Комплект крупнокалиберных пушек в тяжелобронированной установке. Модернизированная конструкция башни позволила увеличить высоту орудия, тем самым увеличив дальность стрельбы."
 ship_heavy_battery_3_quad_desc:0 "Тяжелобронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 ship_heavy_battery_4_quad_desc:0 "Эта тяжелобронированная установка, являющаяся результатом эволюции тяжелой огневой мощи, обеспечивает высокую точность на больших дистанциях."
  
 ship_super_heavy_battery_2:0 "46-см пушка"
 ship_super_heavy_battery_2_short:0 "Сдвоеная 46-см пушка"
 ship_super_heavy_battery_2_desc:0 "Усовершенствованная версия 18-дюймового орудия, способная стрелять более мощными снарядами."
 ship_super_heavy_battery_2_triple:0 "46-см пушка"
 ship_super_heavy_battery_2_triple_short:0 "Строенная 46-см пушка"
 ship_super_heavy_battery_2_triple_desc:0 "Усовершенствованная версия 18-дюймового орудия, способная стрелять более мощными снарядами."
 ship_super_heavy_battery_2_quad:0 "46-см пушка"
 ship_super_heavy_battery_2_quad_short:0 "Счетверенная 46-см пушка"
 ship_super_heavy_battery_2_quad_desc:0 "Усовершенствованная версия 18-дюймового орудия, способная стрелять более мощными снарядами."
  
 ship_secondaries_3:0 "127мм РФ. Пушка (башня)"
 ship_secondaries_3_short:0 "Вторичная батарея III"
 ship_secondaries_3_desc:0 "Новый тип вспомогательной батареи, разработанный на базе ГК эсминцев, размещаемой в башне." 
 ship_secondaries_4:0 "152мм РФ. Пушка (башня)"
 ship_secondaries_4_short:0 "Вторичная батарея IV"
 ship_secondaries_4_desc:0 "В конце войны была разработана вспомогательная батарея крупного калибра, по огневой мощи близкая к той, что использовалась на легких крейсерах."
  
 ship_smoke_generator:0 "Генератор дыма"
 ship_smoke_generator_short:0 "Генератор дыма"
 ship_smoke_generator_desc:0 "Модификации двигателей позволяют кораблям производить много дыма."
 ship_radar_ja:"ммer:0 "Излучатель помех"
 ship_radar_ja:"ммer_short:0 "Радар-глушитель"
 ship_radar_ja:"ммer_desc:0 "Излучатель помех, работающий на частоте радара противника."
 ship_mast_1:0 "Мачтовый наблюдательный пункт"
 ship_mast_1_short:0 "Мачта"
 ship_mast_1_desc:0 "Мачта работает как наблюдательный пункт и позволяет наблюдать за падением выстрелов, а также содержит оборудование для управления огнем, такое как дальномеры."
 ship_torpedo_fire_control:0 "СУО торпеды" 
 ship_torpedo_fire_control_short:0 "СУО торпеды"
 ship_torpedo_fire_control_desc:0 "Наводчик торпеды — расчетный прицел для стрельбы торпедами, больше похожий на настраиваемый прицел, чем на наводчик."
 ship_bulbous_bow:0 "Носовой сонар" 
 ship_bulbous_bow_short:0 "Носовой сонар"
 ship_bulbous_bow_desc:0 "Выступающая лампочка на носу корабля чуть ниже ватерлинии с гидролокатором внутри."
 ship_aa_fire_control:0 "Предсказатель Керрисона"
 ship_aa_fire_control_short:0 "Противовоздушный предсказатель"
 ship_aa_fire_control_desc:0 "Система управления огнем для автоматизации наведения зенитных орудий."
 ship_electric_motor:0 "Силовая установка с турбоэлектроприводом"
 ship_electric_motor_short:0 "Электрический двигатель"
 ship_electric_motor_desc:0 "Электрическая машина, преобразующая электрическую энергию в механическую. Он приводится в движение паровой турбиной с использованием не только силовой установки, но и силовых агрегатов."
  
 eng_14in_mk7_double:0 "BL 14-дюймовый Mk VII"
 eng_14in_mk7_double_short:0 "Сдвоенная BL 14-дюймовая Mk VII"
 eng_14in_mk7_double_desc:0 "Стандартное тяжелое орудие среднего калибра."
 eng_14in_mk7_quad:0 "BL 14-дюймовый Mk VII"
 eng_14in_mk7_quad_short:0 "Счетверенная BL 14-дюймовая Mk VII"
 eng_14in_mk7_quad_desc:0 "Стандартное тяжелое орудие среднего калибра."
  
 ship_light_weight_shell:0 "Легкий бронебойный снаряд"
 ship_light_weight_shell_short:0 "Легкий ББ снаряд"
 ship_light_weight_shell_desc:0 "Легкие бронебойные снаряды имеют более высокую начальную скорость и ускоряют перезарядку, но в бою на дальних дистанциях они приобретают большее сопротивление, что приводит к рикошету."
 ship_super_heavy_weight_shell:0 "Сверхтяжелый бронебойный снаряд"
 ship_super_heavy_weight_shell_short:0 "Сверхтяжелый ББ"
 ship_super_heavy_weight_shell_desc:0 "Сверхтяжелый снаряд, вес которого больше на 20% по сравнению с обычными. Он медленнее и сложнее в прицеливании, но при попадании наносит большой урон."
 ship_high_velocity_shell:0 "Высокоскоростной бронебойный снаряд"
 ship_high_velocity_shell_short:0 "Высокоскоростной ББ"
 ship_high_velocity_shell_desc:0 "Вместо снижения массы высокоскоростные снаряды требуют больше пороха для достижения высокой скорости при выстреле. Это может вызвать давление на стволы."
 ship_anti_air_shell:0 "Зажигательный снаряд"
 ship_anti_air_shell_short:0 "Противовоздушный снаряд"
 ship_anti_air_shell_desc:0 "Комбинация зажигательных и фугасных снарядов. Он стреляет из основного орудия, но имеет низкую точность."
 ship_vt_shell:0 "Противовоздушный снаряд с бесконтактным взрывателем"
 ship_vt_shell_short:0 "Противовоздушный снаряд (предохранитель VT)"
 ship_vt_shell_desc:0 "Тип зенитного снаряда с взрывателем, который автоматически приводит в действие взрывное устройство при приближении к цели на определенное расстояние."

EQ_MOD_CAT_submarine_miscellaneous_TITLE: "Submarine Miscellaneous"
 crewed_torpedo: "Человекоуправляемая торпеда"
 crewed_torpedo_short: "Человекоуправляемая торпеда"
 crewed_torpedo_desc: "Образец управляемой торпеды, которую ведет водолаз, обычно с фугасной боеголовкой."
 oxygen_generator: "Химический генератор кислорода"
 oxygen_generator_short: "Генератор кислорода"
 oxygen_generator_desc: "Устройство, установленное на подводной лодке, которое выделяет кислород в результате химической реакции."
 diving_plane: "Рули управления"
 diving_plane_short: "Рули управления"
 diving_plane_desc: "Рули управления - это управляющие поверхности на подводной лодке, которые позволяют судну наклонять нос и корму вверх или вниз, чтобы помочь в процессе погружения или всплытия лодки, а также контролировать глубину погружения."
 vlf_receiver: "Приемник очень низких частот"
 vlf_receiver_short: "ОНЧ-приемник"
 vlf_receiver_desc: "Радиоволны очень низкой частоты могут использоваться для связи с подводными лодками, когда они находятся под водой."
 
