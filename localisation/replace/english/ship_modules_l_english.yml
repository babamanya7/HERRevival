 sub_ship_periscope_3_short:0 "Современный Перископ"
 sub_ship_periscope_3_desc:0 "Оптическое оборудование, используемое на подводных лодках для наблюдения за поверхностью."
  
 pressure_hull_1:0 "Прочный корпус I"
 pressure_hull_1_short:0 "Прочный корпус I"
 pressure_hull_1_desc:0 "Прочный корпус защищает подводную лодку от давления воды и определяет максимальную глубину погружения."
 pressure_hull_2:0 "Прочный корпус II"
 pressure_hull_2_short:0 "Прочный корпус II"
 pressure_hull_2_desc:0 "Прочный корпус защищает подводную лодку от давления воды и определяет максимальную глубину погружения." 
 pressure_hull_3:0 "Прочный корпус III"
 pressure_hull_3_short:0 "Прочный корпус III"
 pressure_hull_3_desc:0 "Прочный корпус защищает подводную лодку от давления воды и определяет максимальную глубину погружения."
 pressure_hull_4:0 "Прочный корпус IV"
 pressure_hull_4_short:0 "Прочный корпус IV"
 pressure_hull_4_desc:0 "Прочный корпус защищает подводную лодку от давления воды и определяет максимальную глубину погружения."
  
 sub_battery_1:0 "203-мм пушка"
 sub_battery_1_short:0 "Батарея подлодки"
 sub_battery_1_desc:0 "Орудие крейсерского уровня, установленное на подводной лодке без башни."
  
 ship_sonar_3:0 "Буксируемая сонарная антенна" 
 ship_sonar_3_short:0 "Буксируемый сонар"
 ship_sonar_3_desc:0 "Буксируемый сонар также известен как сонар переменной глубины. Он может работать на больших глубинах, чтобы избежать помех от шума судов."
  
 ship_missile_1:0 "Радиоуправляемая противокорабельная ракета"
 ship_missile_1_short:0 "Противокорабельная ракета"
 ship_missile_1_desc:0 "Противокорабельная ракета с радиоуправлением — примитивная, обладающая высокой скоростью и способная нанести большой ущерб."
 ship_missile_aa_1:0 "Ракета класса «земля-воздух»"
 ship_missile_aa_1_short:0 "Ракета «земля-воздух»"
 ship_missile_aa_1_desc:0 "Зенитная ракета может обеспечить более высокую точность поражения самолетов."
  
 ship_scheme_incremental:0 "Инкрементная схема"
 ship_scheme_incremental_short:0 "Инкрементная схема"
 ship_scheme_incremental_desc:0 "Схема брони, разработанная после русско-японской войны, которая закрывает большую площадь от скорострельных орудий."
 ship_scheme_incremental_post_jutland:0 "Пост-Ютландская схема"
 ship_scheme_incremental_post_jutland_short:0 "Пост-Ютландская схема"
 ship_scheme_incremental_post_jutland_desc:0 "Схема переходной брони, разработанная вскоре после Ютландского сражения с некоторыми улучшениями палубной брони."
 ship_scheme_mixed:0 "Смешанная схема"
 ship_scheme_mixed_short:0 "Смешанная схема"
 ship_scheme_mixed_desc:0 "Смешанная схема, заимствованная из идеи брони «все или ничего», представляет собой компромиссную конструкцию, изобретенную в конце 1910-х годов и учитывающую также защиту второстепенных областей."
 ship_scheme_all_or_nothing:0 "Схема «Все или ничего»"
 ship_scheme_all_or_nothing_short:0 "«Все или ничего»"
 ship_scheme_all_or_nothing_desc:0 "Схема «Все или ничего» предполагает усиленное бронирование наиболее важных для корабля областей, в то время как остальная часть корабля не получает брони."
 ship_scheme_all_or_nothing_armor_box:0 "Схема «Все или ничего» (с коробкой вторичной брони)"
 ship_scheme_all_or_nothing_armor_box_short:0 "Схема «Все или ничего» (с коробкой вторичной брони)"
 ship_scheme_all_or_nothing_armor_box_desc:0 "Усовершенствованная схема «Все или ничего» усиливает второстепенные области дополнительными броневыми ящиками."
 torpedo_bulge:0 "Противоторпедный буль"
 torpedo_bulge_short:0 "Противоторпедный буль"
 torpedo_bulge_desc:0 "Торпедный буль представляет собой частично заполненный водой отсек-спонсон по обе стороны корпуса корабля, предназначенные для детонации торпед, поглощения их взрывов и сдерживания затопления поврежденных участков внутри булей."
 torpedo_belt:0 "Противоторпедный пояс"
 torpedo_belt_short:0 "Противоторпедный пояс"
 torpedo_belt_desc:0 "Противоторпедный пояс состоит из ряда легкобронированных отсеков, простирающихся вбок вдоль узкого пояса, пересекавшего ватерлинию корабля."
 pugliese_system:0 "Система Паглизе" 
 pugliese_system_short:0 "Система Паглизе"
 pugliese_system_desc:0 "Система Паглизе — это компонент подводной защиты, разработанный на основе гидродинамики и способный поглотить большую часть энергии подводного взрыва."
 torpedo_belt_enhanced:0 "Улучшенный противоторпедный пояс"
 torpedo_belt_enhanced_short:0 "Комплексная система противоторпедной защиты"
 torpedo_belt_enhanced_desc:0 "Большое количество водонепроницаемых отсеков и толстая броня позволяют противостоять большинству подводных взрывов."
  
  
 ship_light_battery_1_double_desc:0 "Относительно небольшая пушка для использования на эсминцах и небольших кораблях."
 ship_light_battery_2_double_desc:0 "Небольшая с механизированной установкой, позволяющей быстро поразить цель."
 ship_light_battery_3_double_desc:0 "Небольшое орудие с щитками для защиты экипажа от летящих осколков и суровых погодных условий."
 ship_light_battery_4_double_desc:0 "Пара небольших орудия  в механизированной бронированной установке."
 ship_heavy_battery_1_triple_desc:0 "Крупнокалиберная пушка, выпущенная до Великой войны."
 ship_heavy_battery_2_triple_desc:0 "Комплект крупнокалиберных пушек в тяжелобронированной установке. Модернизированная конструкция башни позволила увеличить высоту орудия, тем самым увеличив дальность стрельбы."
 ship_heavy_battery_3_triple_desc:0 "Тяжелобронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 ship_heavy_battery_4_triple_desc:0 "Эта тяжелобронированная установка, являющаяся результатом эволюции тяжелой огневой мощи, обеспечивает высокую точность на больших дистанциях."
 ship_heavy_battery_1_quad_desc:0 "Крупнокалиберная пушка, выпущенная до Великой войны."
 ship_heavy_battery_2_quad_desc:0 "Комплект крупнокалиберных пушек в тяжелобронированной установке. Модернизированная конструкция башни позволила увеличить высоту орудия, тем самым увеличив дальность стрельбы."
 ship_heavy_battery_3_quad_desc:0 "Тяжелобронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 ship_heavy_battery_4_quad_desc:0 "Эта тяжелобронированная установка, являющаяся результатом эволюции тяжелой огневой мощи, обеспечивает высокую точность на больших дистанциях."
 ship_medium_battery_1_double_desc:0 "Хотя это среднее орудие не способно нанести значительный урон линкорам, оно позволяет тяжелому крейсеру уверенно поражать более легкие корабли и другие крейсера."
 ship_medium_battery_2_double_desc:0 "Это орудие, являющееся развитием более ранней конструкции, было создано с учетом увеличения брони и увеличения дальности ведения морских сражений."
 ship_medium_battery_3_double_desc:0 "Хотя это и не самое большое орудие, которое можно установить на крейсер, оно обеспечивает наилучший баланс между весом вооружения и огневой мощью и может гарантированно пробить крейсерскую броню."
 ship_medium_battery_4_double_desc:0 "Калибр ограничен существующими запасами боеприпасов и рассчитан на модернизацию старых кораблей. Это новое орудие оснащено усовершенствованной системой автоматического заряжания, значительно повышающей скорострельность."
 ship_light_medium_battery_1_double_desc:0 "Компромисс между скорострельностью и весом снаряда, это орудие предназначено для использования на легких крейсерах для поражения небольших кораблей."
 ship_light_medium_battery_2_double_desc:0 "Это орудие представляет собой логическое развитие предыдущих моделей и предназначено для того, чтобы легкие крейсера имели значительное преимущество в огневой мощи над эсминцами и старыми крейсерами."
 ship_light_medium_battery_3_double_desc:0 "Благодаря ряду новых технологий эта легкобронированная установка еще больше увеличивает разрыв между главными батареями эсминцев и легких крейсеров."
 ship_light_medium_battery_4_double_desc:0 "Спроектированная с нуля для обеспечения высокой скорострельности, эта установка была создана для того, чтобы легкие крейсера могли выводить из строя даже более крупных противников с помощью множества попаданий." 
 ship_medium_battery_4_double_desc:0 "Поскольку калибр ограничен существующими запасами боеприпасов, а также с учетом возможности модернизации старых кораблей, новое орудие оснащено усовершенствованной системой автоматического заряжания, позволяющей значительно повысить скорострельность."
 ship_light_medium_battery_1_single_desc:0 "Компромисс между скорострельностью и весом снаряда, это орудие предназначено для использования на легких крейсерах для поражения небольших кораблей."
 ship_light_medium_battery_2_single_desc:0 "Это орудие представляет собой логическое развитие предыдущих моделей и предназначено для того, чтобы легкие крейсера имели значительное преимущество в огневой мощи над эсминцами и старыми крейсерами."
 ship_light_medium_battery_3_single_desc:0 "Благодаря ряду новых технологий эта легкобронированная установка еще больше увеличивает разрыв между главными батареями эсминцев и легких крейсеров."
 ship_light_medium_battery_4_single_desc:0 "Спроектированная с нуля для обеспечения высокой скорострельности, эта установка была создана для того, чтобы легкие крейсера могли выводить из строя даже более крупных противников с помощью множества попаданий." 
 ship_super_heavy_battery_1_triple_desc:0 "Это самая большая пушка, когда-либо установленная на корабле. Эти массивные пушки были разработаны так, чтобы пробивать любую броню на любом расстоянии."
 ship_super_heavy_battery_1_quad_desc:0 "Это самая большая пушка, когда-либо установленная на корабле. Эти массивные пушки были разработаны так, чтобы пробивать любую броню на любом расстоянии."
 ship_medium_battery_1_single_desc:0 "Хотя это среднее орудие не способно нанести значительный урон линкорам, оно позволяет тяжелому крейсеру уверенно поражать более легкие корабли и другие крейсера."
 ship_medium_battery_2_single_desc:0 "Это орудие, являющееся развитием более ранней конструкции, было создано с учетом увеличения брони и увеличения дальности ведения морских сражений."
 ship_medium_battery_3_single_desc:0 "Хотя это и не самое большое орудие, которое можно установить на крейсер, оно обеспечивает наилучший баланс между весом вооружения и огневой мощью и может гарантированно пробить крейсерскую броню."
 ship_medium_battery_4_single_desc:0 "Калибр ограничен существующими запасами боеприпасов и рассчитан на модернизацию старых кораблей. Это новое орудие оснащено усовершенствованной системой автоматического заряжания, значительно повышающей скорострельность."
  
