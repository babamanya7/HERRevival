 ship_armor_cruiser_heavy_3_short:0 "Большая крейсерская броня III"
 ship_armor_cruiser_heavy_3_desc:0 "Копируя методы, применяемые для бронирования линкоров, эта схема бронирования призвана идти в ногу с развитием вооружений в мире."
 ship_armor_cruiser_heavy_4:0 "220мм пояс/120мм палуба" 
 ship_armor_cruiser_heavy_4_short:0 "Большая крейсерская броня IV"
 ship_armor_cruiser_heavy_4_desc:0 "Такая схема бронирования предполагает максимальную защиту тех участков, которые абсолютно необходимы для поддержания корабля на плаву и в бою, за счет всех остальных участков."
 ship_carrier_armor_heavy:0 "150мм палуба"
 ship_carrier_armor_heavy_short:0 "Тяжелая броня летной палубы"
 ship_carrier_armor_heavy_desc:0 "Тяжелые броневые листы защищают ангарные помещения от ударов вражеских бомбардировщиков ценой меньшего рабочего пространства."
 ship_armor_shbb_2:0 "480мм пояс/230мм палуба" 
 ship_armor_shbb_2_short:0 "Улучшенная сверхтяжелая броня"
 ship_armor_shbb_2_desc:0 "Эта схема бронирования, являющаяся последним словом в кораблестроении, предназначена для защиты от известных снарядов главной батареи, что позволяет кораблю с таким бронированием поразить и потопить любой другой линкор в современном мире."
  
