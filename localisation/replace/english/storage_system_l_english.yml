 left_rubber_text:0  "§MDetailed Strategic Rubber Stockpile Information§!"
 left_rubber_desc:0  "Current rubber stockpile: [?left_rubber|0] (Capacity: [?rubber_cap|0])\n§g(Capacity depends on the number of rubber storage facilities × 100000)§!\nDaily throughput: [?rubber_speed|0H]\n§g(Throughput depends on the number of storage facilities × 500)§!\nIn use: [?rubber_storage_withdrawal|0R]\nSent to storage: [?daily_left_rubber|0G]\n§g------------§!\n§gWhen production demand exceeds extraction, resources will automatically be withdrawn from storage.\nWhen rubber extraction exceeds current demand, the surplus will be transferred to storage.§!"
 
