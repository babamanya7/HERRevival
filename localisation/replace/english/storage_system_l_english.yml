l_english:

 local_logicist_center:0  "Strategic Supply Base"
 local_logicist_center_plural:0  "Strategic Supply Bases"
 local_logicist_center_desc:0  "Advance planning and construction of strategic supply bases improves local supply, increases the number of troops that can be supported in a region, and reduces excessive dependence on deliveries from the capital. They are usually built in strategically vital areas that require large forces to defend. Each completed base doubles the local supply ceiling, up to a maximum tenfold increase.\n§g(The effect will take up to one week after construction is completed.)§!"
 
