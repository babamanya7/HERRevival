l_polish:
 naval_equipment:0 "Кораблі"
 vnr_ship_hull_submarine_1_desc:0 "Перші підводні кораблі, які справді здатні до ефективної бойової діяльності, є значно кращими у порівнянні зі своїми попередниками. Завдяки тому, що дизель-електричні двигуни замінили переважно бензино-електричні двигуни перших підводних човнів, вони значно збільшили тривалість плавання і надводну швидкість в порівнянні зі своїми попередниками. Під час бою з військовими кораблями, вони діють в основному як підводні торпедні човни, але їм бракує швидкості й повітря в підводному стані, щоб залишатися під водою довгий час. Це підводні човни, які використовувалися найбільшими військово-морськими силами під час світової війни."
 vnr_ship_hull_submarine_2_desc:0 "У результаті еволюції більш ранніх конструкцій підводних човнів деякі з цих військових кораблів розвинули ідеї «крейсерських» У той час як інші дивляться в іншому напрямку, щоб збільшити можливості та характеристики підводних човнів, з великими знаряддями та упертішим устроїм."
 vnr_ship_hull_submarine_3_desc:0 "Досягнення деяких більш ранніх проектів у збільшенні відстані підводного плавання, швидкості та загальних можливостей призвели до повороту в розробці підводних човнів від «крейсерських» Типи до суден з великим упертістю на підводні можливості. У порівнянні з попередніми видами підводних човнів, ці підводні човни несуть потужні торпедні навантаження і становлять реальну загрозу майже для всіх кораблів. Але вони все ще обмежені у тривалості, відстані та швидкості плавання і залишаються вразливими при надводному положенні, особливо для літаків."
 vnr_ship_hull_submarine_4_desc:0 "Завдяки значно збільшеній посудині акумуляторів, вдосконаленій системі оновлення повітря під час занурення і вдосконалення конструкції, це перші підводні човни, які можуть залишатися під водою Більшість часу свого перебування в морі, тому вони вказують на масштабний зсув у військово-морській війні та перетворення підводних човнів на справжні жахи. Такі військові кораблі дають можливість домінувати в океанах тими країнами, які їх розробили та збудували."
 vnr_ship_hull_light_1_desc:0 "Світова війна створила новий попит на есмінці: вони не тільки були необхідні для захисту свого флоту, але й були змушені захищати судноплавні шляхи Антанти. Щоб задовольнити цю потребу, есмінці були оптимізовані і запущені у серійне виробництво, щоб задовольнити попит. Кораблі цієї епохи звичайно важать 1000 тонн і розвивають максимальну швидкість 34 вузла, несучи при цьому пару торпед більшого, ніж їхні попередники."
 vnr_ship_hull_light_2_desc:0 "Під час Першої світової війни почались більші есмінці, більш озброєні. Під час війни було втрачено багато можливостей знищити великі кораблі, тому що есмінці витрачали всі свої торпеди в першому залі, щоб розв’язати цю проблему. Есмінці того періоду мали більші корпуси і водозбір від 1500 до 2000 тонн, які очолювалися трохи більшим есмінцем-лідером."
 vnr_ship_hull_light_3_desc:0 "До 1935 року, коли на озброєння діяли все більш потужні конструкції нових літаків, а також кілька військово-морських держав пбудували більше авіаносців, хоча все ще існували деякі сумніви щодо того, Під час відкритої війни авіаносці дуже скористали, тому що вони занепокоєні потенційною загрозою для військових кораблів. Подальші вчення виявили світові, що авіаносець має своє призначення у флоті. Унаслідок цього на есмінців з’явилося головне озброєння подвійного призначення, яке дало есмінцю значно удосконалювальну зеніту, що знову збільшило їхню користь. Ці кораблі, щоб компенсувати зменшені торпедні навантаження на нових крейсерах, часто несуть до 2500 тонн."
 vnr_ship_hull_light_4_desc:0 "Коли почалася Друга світова війна, флоти світу потребували дешевих зенітних платформ. Успіх авіаносного бою показав світові, що вони підходять не тільки для розвідки й боротьби з авіаносцями, але й для сучасної війни проти великих кораблів. Крім того, передові протиодні технології відіграють важливу роль у боротьбі з головними загрозою для конвою, вони і зенітні вимоги збільшили вимоги до більшої кількості есмінців. Тоді як раніше інвестиції в есмінці знижувалися на користь крейсерів і нових лінійних крейсерів, есмінці починають повертатися на перший план як невід'ємна частина флоту, так і системи конвойв. Часто вони не більші за своїх попередників, але набагато більш прогресивні в технологіях, в основному мають плоскі палуби і набагато потужніше торпедне озброєння."
 vnr_ship_hull_light_5_desc:0 "Наприкінці Другої світової війни військові-морські сили світу були змушені адаптуватися до нових підводних човнів, які могли залишатися під водою протягом майже невизначеного періоду часу, авіаносцям, Вантажливі літаки, які здатні знищувати великі кораблі за допомогою великих гармат, швидко стають неактивними перед лицем авіаносців і підводних човнів. У розумах більшості військово-морських теоретиків майбутня роль ескоту флоту беруть на себе майже виключно есмінці, а скорострельні гармати подвійного призначення знищують будь-які літаки, які наважуються перетнути його шлях у спробі бомбувати його в пікируванні. Ці кораблі також були збільшені, часто доходячи до 3000 тонн, оскільки конструктори завантажували їх великою кількістю зенітної зброї та більшої кількості основних знарядь."
 torpedo_cruiser:0 "Торпедний крейсер"
 torpedo_cruiser_desc:0 "На основі аргументу Jeune selectole (зокрема, українською мовою).«Молода школа»), Згідно з невеликими військовими кораблями, озброєними торпедами, вони можуть ефективно і дешево перемагати набагато більші кораблі, головним чином озброєні торпедами. Більшість торпедних крейсерів втратили популярність у більшості військово-морських сил у 1890-х роках, хоча багато інших флотів продовжували отримувати їх до початку 1900-х років. Сучасні торпедні крейсери використовують торпед, які не можуть нести підводні човни."
 early_ship_hull_cruiser_desc:0 "До кінця 19 століття незахищені крейсера все ще займали місце в складі флоту, тоді як стали з'являтися захищені крейсера з броней, а в полі зору військово-морського флоту поступово потрапили більш великі броненосні Крейсера. Бурхливий розвиток крейсерів на початку 20 століття мав кілька типів різних розмірів: від лінійних крейсерів з вогненною силою та захистом, близьких до дредноуту, до лідерів флотилій, що діяли поруч з есмінцями, ці Передові крейсери значно перевершили великі кораблі минулого."
 vnr_ship_hull_cruiser_1_desc:0 "До кінця 19 століття незахищені крейсера все ще займали місце в складі флоту, тоді як стали з'являтися захищені крейсера з броней, а в полі зору військово-морського флоту поступово потрапили більш великі броненосні Крейсера. Бурхливий розвиток крейсерів на початку 20 століття мав кілька типів різних розмірів: від лінійних крейсерів з вогненною силою та захистом, близьких до дредноуту, до лідерів флотилій, що діяли поруч з есмінцями, ці Передові крейсери значно перевершили великі кораблі минулого."
 vnr_ship_hull_cruiser_2_desc:0 "У 1920-х і 1930-х було обмежено міжнародними договорами, метою яких було запобігти повторення гонки озброєнь на початку 20 століття. Вашингтонський військово-морський договір 1922 року наклав обмеження на будівництво кораблів стандартним водозбіром понад 10 000 тонн і артилерійським озброєнням понад 8 дюймів. Ряд військово-морських сил замовили крейсера класів, що відповідають верху цього межі, відомих як «контрактні крейсера»."
 vnr_ship_hull_cruiser_3_desc:0 "У міжвоєнний період відбувалися вдосконалення крейсерів в рамках Вашингтонського військово-морського договору. Оскільки політика і фінанси все ще обмежують багато військово-морських держав, випущені моделі тільки трохи більше за розміром, ніж попереднє покоління, замість цього спостерігається підвищення вогняної могутності за рахунок Використання більших знарядь або зростаючого впровадження потрійних башт і рахунованих торпедних апаратів. Рослинність авіації у морській війні також призвела до подвійного призначення гармат, доповнених до зростаючого набору автомобілів. Але вже робилися спроби порушити обмеження крейсерів.\n\nВстановіть §YРоль великого крейсера§! на §YКорпус крейсера§!, щоб розблокувати §YБатарею великого крейсера§! і §YБроню великого крейсера§!."
 vnr_ship_hull_cruiser_4_desc:0 "Зріс фінансування нового крейсера, побудованого наприкінці міжвоєнного періоду та на початку Другої світової війни, знову зріс. Хоча калібр основного озброєння знову залишився незмінним, за деякими винятками, його вогняна міць була збільшена за рахунок додавання більшої вежі або збільшення кількості гармат у кожній вежі. Зброєння було модернізовано за рахунок додаткових подвійних знарядь і більш спеціалізованого зенітного озброєння, яке часто пов’язане з удосконаленням вогню. У цьому поколінні також спостерігається зріст радіолокаційних систем на крейсерах."
 vnr_ship_hull_cruiser_5_desc:0 "Крейсера пізнього і раннього післявоєнного періоду залишаються схожими на крейсера початку війни, але враховують численні уроки, отримані протягом усієї війни. Оскільки було підтверджено, що літаки становлять одну з найбільших загроз для кораблів, конструктори зосередилися на подальшому вдосконаленні можливостей ПВО за рахунок поліпшення управління вогнем і поліпшення Координацій між батарами і радаром, деякі військово-морські сили також експериментують з механізмами самозарядки головного озброєння, значно поліпшуючи їх швидкострільність."
 early_ship_hull_heavy_desc:0 "Ці кораблі, розроблені незадовго до початку світової війни і побудовані під час її буйства, становлять вищий рівень розвитку військово-морського флоту до початку цього конфлікту. Вони були головними військовослужбовцями під час війни і зберігають свою силу ще довго після її закінчення. Хоча вони помітні швидше, ніж попередні дредноути, їх найвизначнішою ознакою є розширена зброя — від восьми до десяти основних знарядь, більшість з яких розташовані в Спарених вежах, але деякі - в нових тройних вежах. Їхня руйнівна вогняна міць і важка броня гарантували, що вони опиняться в центрі своїх флотів у Світовій війні, але через це тривалий поступ довелося платити швидко зростаючу ціну. Навіть у більшій мірі, ніж військові кораблі до них, ці класи вимагали величезних інвестицій, хоча вони були лише тінню того, що мало статися."
 vnr_ship_hull_heavy_1_desc:0 "Ці кораблі, розроблені незадовго до початку світової війни і побудовані під час її буйства, становлять вищий рівень розвитку військово-морського флоту до початку цього конфлікту. Вони були головними військовослужбовцями під час війни і зберігають свою силу ще довго після її закінчення. Хоча вони помітні швидше, ніж попередні дредноути, їх найвизначнішою ознакою є розширена зброя — від восьми до десяти основних знарядь, більшість з яких розташовані в Спарених вежах, але деякі - в нових тройних вежах. Їхня руйнівна вогняна міць і важка броня гарантували, що вони опиняться в центрі своїх флотів у Світовій війні, але через це тривалий поступ довелося платити швидко зростаючу ціну. Навіть у більшій мірі, ніж військові кораблі до них, ці класи вимагали величезних інвестицій, хоча вони були лише тінню того, що мало статися."
 vnr_ship_hull_heavy_2_desc:0 "У міжвоєнний період на лінкор накладалися суворі міжнародні обмеження, щоб запобігти розв’язуванню дорогих гонок озброєнь. Зіткнувшись з перспективою гонки військово-морських озброєнь проти З'єднаного Королівства і Японії, яка, у свою чергу, привела б до можливої війни на Тихому океані, Сполучені Штати Америки прагнули зробити висновок Вашингтонський військовий договір 1922 року, який обмежував кількість і розмір флоту, які могли мати кожна велика нація. Такі проекти, як британський лінкор класу N3, американський клас «Південна Дакота» і японський клас «Кійя» — Усі вони продовжували будувати більші кораблі з великими гарматами та товстішими бронями, так і не зійшли з креслень дошки. Ті проекти, які були прийняті в експлуатацію в цей час, називали договорними лінкорами."
 vnr_ship_hull_heavy_3_desc:0 "У 1930-х військові-морські держави широко модернізували свої лінзи часів Великої війни. Серед нововведень - збільшена висота вежі і стабільність оптичного дальєра (для керування артилерійським озброєнням), посилення броні (особливо навколо вежі) для захисту від вогню з пікування і бомбардування з Повітря, а також додаткова зенітна зброя. Навіть коли в кінці 1930-х знову виникла загроза війни, будівництво лінкорів не повернуло значення, яке він мав на початку Першої світової війни. «Навчальні канікули», Накладені військово-морськими договорами, означали, що потужність верфей по всьому світу скоротилася, і стратегічна ситуація змінилася."
 vnr_ship_hull_heavy_4_desc:0 "На горизонті друга світова війна і міжнародна напруженість більші, ніж будь-коли, конструктори намагаються побудувати нове покоління кораблів для участі в прийдешній війні. У той час як деякі країни перенесли свої військово-морські надії на авіаносці, інші все ще наполягають на тому, що авіаносець може виконувати лише додаткову роль, а не заміняти головну роль лінкора, Замість того, щоб боротися з великими кораблями, ці країни переощаджують свої нові конструкції, приділяючи особливу увагу вдосконаленій компонуванні броні та ефективнішим знаряддям і вежам, а також збільшеній швидкості."
 vnr_ship_hull_heavy_5_desc:0 "Під кінець Другої світової війни великі держави почали розуміти, що військово-морська авіація здобула перемогу над усіма артилерійськими великими кораблями. Однак деякі країни продовжують розвивати лінкори як платформи для прибережних бомбардувань, престижних проектів і підтримки авіаносців всередині флоту або навіть намагаються просувати свою стару роль. Деякі конструктори завантажують свої лінзи зенітні батареями, щоб збільшити шанси на виживання. Хоча багато з цих лінкорів можуть і далі експлуатуватися протягом багатьох років, деякі країни вважають їх застарілими."
 vnr_ship_hull_carrier_1_desc:0 "Розроблені в 30-х роках, ці кораблі призначені для забезпечення повітряної розвідки і прикриття флотів легкими винищувачами, в першу чергу орієнтованих на більш «звичайні» Військово-морські сили, їхня дальність плавання значно збільшена, і були докладені зусилля, щоб зробити їх достатньо швидкими, щоб не відставати від флотів, які йдуть на повній швидкості в відкритому океані."
 vnr_ship_hull_carrier_2_desc:0 "Оскільки великі морські бойові операції в епоху морської авіації показали здатність авіації серйозно впливати на битви в морі, багато держав відстали у своїх авіаносних силах. Хоча авіаносці швидко стають найсильнішими зі своїх зібраних, вони також є масивними кораблями, на яких потрібно багато часу та ресурсів. Намагаючись збільшити свої можливості по перекидання авіації в океани, військово-морські держави звернулися до подібних конструкціях, збільшених версії існуючих більш легких авіаносців, щоб спробувати швидко зміцнити можливості своєї морської авіації." 
 vnr_ship_hull_carrier_3_desc:0 "Унаслідок подальшого розвитку конструкції авіаносців з’явилося набагато більше моделей. Ці кораблі наближаються до першого флоту авіаносців, але вдумуються в усі конструктивні поліпшення, які були внесені за минулі роки. Більшість з них мають великий броневий захист і могутню зенітну артилерію, а також високу механічну надійність. Однак вони відмовилися від концепції вторинного озброєння великого калібру в обмін на менші знаряддя подвійного призначення."
 vnr_ship_hull_super_heavy_1_desc:0 "Швидкий ріст ресурсів, що виділяються на військово-морське будівництво після закінчення великого сухопутного конфлікту під час Великої війни, спочатку привів до появи цих проектів, які поклали початок тенденції до Раптовий ріст розмірів, вогняної сили, броні, калібру і, звичайно ж, вартості. Такі кораблі відрізняють провідні військово-морські держави світу від простих претендентів на велич, але у них є свої проблеми; їх швидке розвиток і поспішне будівництво призвели до конструктивних недоліків і постійних Такі механічні проблеми. Ці конструкції озброєні 8-10ью 18-дюймовими або еквівалентними основними знаряддями і мають захист, який дозволяє конкурувати з кораблями з аналогічним озброєнням. З наближенням Морського свята ці монстри були поховані часом."
 vnr_ship_hull_light_1:0 "Легкий корпус Великої війни"
 vnr_ship_hull_light_2:0 "Післявоєнний легкий корпус"
 vnr_ship_hull_light_3:0 "Можливий легкий корпус"
 vnr_ship_hull_light_4:0 "Удосконалений легкий корпус"
 vnr_ship_hull_light_5:0 "Сучасний легкий корпус"
 ship_hull_cruiser:0 "Крейсер"
 ship_hull_cruiser_desc:0 "У середині 19 століття крейсер став класом кораблів, призначених для плавання у далеких водах, торгових набігів і розтягнення флоту. Він випускався в різних місцях: від меншого захищеного крейсера до великого броненосного крейсера. З появою дредноута перед світовою війною броненосний крейсер поступово перетворився на лінійний крейссер, в той час як прямі наступники захищених крейсерів могли бути розміщені в одній шкалі розмірів розмірів бойових Кораблі, доки Лондонська військово-морська конференція офіційно не встановила стандарти для легенів і важких крейсерів. "
 early_ship_hull_cruiser:0 "Корпус крейсера Великої Війни"
 vnr_ship_hull_cruiser_1:0 "Корпус крейсера Великої Війни"
 vnr_ship_hull_cruiser_2:0 "Післявоєнний корпус крейсера"
 vnr_ship_hull_cruiser_3:0 "Межовий корпус крейсера"
 vnr_ship_hull_cruiser_4:0 "Удосконалений корпус крейсера"
 vnr_ship_hull_cruiser_5:0 "Корпус сучасного крейсера"
 ship_hull_heavy:0 "Важкий корабель"
 ship_hull_heavy_desc:0 "Перед Великою війною військово-морський флот вже бачив лінкори з 15-дюймовими знаряддями, які були одними з найбільших бойових машин, коли-небудь побудованих в історії людства. Ці левіятани, створені для максимальної вогняної сили та виживання, домінують на кожній милі води."
 early_ship_hull_heavy:0 "Важкий корпус Великої війни"
 vnr_ship_hull_heavy_1:0 "Важкий корпус Великої війни"
 vnr_ship_hull_heavy_2:0 "Післявоєнний важкий корпус"
 vnr_ship_hull_heavy_3:0 "Місткий важкий корпус"
 vnr_ship_hull_heavy_4:0 "Удосконалений важкий корпус"
 vnr_ship_hull_heavy_5:0 "Сучасний важкий корпус"
 ship_hull_carrier:0 "Авіаносець"
 ship_hull_carrier_desc:0 "Великий корабель, здатний нести в бою крила потужних літаків, також корисний як плавучий аеродром, який можна розмістити біля берегів ворога."
 ship_hull_carrier_0:0 "Корпус авіаносця Великої війни"
 vnr_ship_hull_carrier_conversion_bb:0 "Перероблений корпус лінкора"
 vnr_ship_hull_carrier_conversion_bb_desc:0 "Ці кораблі, перші великі авіаносці, в основному побудовані на корпусах, які спочатку були призначені для великих військових кораблів, але через Вашингтонського військово-морського договору були перероблені і добудовані Лише невелика кількість військово-морських держав спорудила такі кораблі, а їх конструкції дуже відрізнялися, і їхні літаки були варіовані від шестидесяти до ста. Але є константи, такі як збережені пояси, та інші особливості артилерійського корабля. Полуекспериментальні і ненадійні, вони як і раніше залишаються неймовірно грізною зброєю і заклали основу для наступних поколінь авіаносців."
 vnr_ship_hull_carrier_conversion_ca:0 "Переобладнання корпус крейсера"
 vnr_ship_hull_carrier_conversion_ca_desc:0 "Навчившись застосовувати тендери гідросамолетів, військово-морські держави, які мали для цього ресурси, почали працювати над кораблями наступного покоління, які могли б нести літаки в море. На відміну від своїх попередників, ці авіаносці мають кабіни екіпажу, завдяки яким літаки можуть літати з них, а потім повертатися і приземлятися на них. Переобладнені з цивільних кораблів і тендерів на гідросамолеті, більшість цих кораблів обмежені відносно тісною летальними палубами і ангарами, але вони безсумнівно показують, що кораблі здатні ефективно керувати авіацією в морі."
 vnr_ship_hull_carrier_1:0 "Покращений корпус авіаносця"
 vnr_ship_hull_carrier_2:0 "Удосконалений корпус авіаносця"
 vnr_ship_hull_carrier_3:0 "Сучасний авіаносець"
 ship_hull_submarine:0 "Підводний човен"
 ship_hull_submarine_desc:0 "Сучасний підводний човен далеко пішов від своїх нескладних попередниць епохи Великої війни; сьогодні за дуже скромної вартості він є загрозою будь-якому кораблю незалежно від його розмірів."
 vnr_ship_hull_submarine_1:0 "Корпус підводного човна Великої війни"
 vnr_ship_hull_submarine_2:0 "Покращений підводний човен"
 vnr_ship_hull_submarine_3:0 "Удосконалений підводний човен"
 vnr_ship_hull_submarine_4:0 "Сучасний підводний човен"
 vnr_ship_hull_pre_dreadnought:0 "Корпус додредноута"
 vnr_ship_hull_pre_dreadnought_desc:0 "Дотримуючись конструкції британського класу Majestic кінця 1890-х, додредноути замінили броненосні крейсера 1870-х і 1880-х років. Побудовані з сталі і захищені металевою бронею, вони несуть головну батарею в барбетах, яка підтримується однією або кількома допоміжними батареями, важчими за легені.\n\nОскільки конструкція «дредноутів» зробила їх застарілими з тих пір Світова війна, а також гігантський ріст числа проектів на базі «Дредноутів» За останні три десятиліття лише кілька з них все ще перебувають на полі бою."
 vnr_ship_hull_cruiser_panzerschiff:0 "Карманний лінкор"
 GER_vnr_ship_hull_cruiser_panzerschiff:0 "Панзершіфф"
 vnr_ship_hull_cruiser_panzerschiff_desc:0 "Спочатку Панзершіфф (браненосець) прийняли як тимчасові великі кораблі як радикальний договір проти Версальського договору Рейхсмаріні. Маючи проміжну вогняну силу між важкими крейсерами і лінійними крейсерами, панзершіффи давали значні переваги в бою один на один проти крейсерів, але він ставав непотрібним перед обличчям організованого флоту.\nПодібні конструкції також спостерігалися в ранніх реченнях Японського флоту, таких як проект B-65, але так і не впроваджено."
 vnr_ship_hull_cruiser_coastal_defense_ship:0 "Корабель берегової оборони"
 vnr_ship_hull_cruiser_coastal_defense_ship_desc:0 "Кораблі берегової оборони — це невеличкі військові кораблі, які часто були завбільшки з крейсер, які пожертвували швидкістю та довгою зброєю заради броні та озброєння. Вони зазвичай привабливі для країн, які не можуть дозволити собі повнорозмірні лінкори або можуть задовольнятися спеціально розробленими дрібносидні судами, здатні вести прибережні операції поблизу своїх берегів."
 ship_hull_torpedo_cruiser:0 "Торпедний крейсер"
 ship_hull_torpedo_cruiser_desc:0 "Легкі крейсери, що несуть велику кількість торпедних апаратів за рахунок меншої кількості зброї головного калібру і установок ПВО."
 vnr_ship_hull_super_heavy_1:0 "Надгробний корпус"
 vnr_ship_hull_cruiser_submarine:0 "Крейсерський підводний човен"
 vnr_ship_hull_cruiser_submarine_desc:0 "Ці підводні човни, що значно більші за попередні, стосуються «крейсерське» Типу призначено для незалежних операцій на віддалених дистанціях під час рейд на торгові судна і призначено для кращого оснащення для ведення бою з легкими військовими кораблями ворога в надводному положенні. Таким чином, вони несуть важчу артилерійську зброю і мають ліпшу надводну швидкість, але їхні підводні можливості обмежені."
 vnr_ship_hull_midget_submarine:0 "Мініатюрний підводний човен"
 vnr_ship_hull_midget_submarine_desc:0 "Маленький підводний човен, який контролює невеликий екіпаж, має меншу довжину та потужність, які компенсуються високою ефективністю"
 ship_hull_civilian: "Громадянський корабель"
 ship_hull_civilian_desc:0 "Корабель, призначений для громадянської діяльності."
 screen_ship:0 "Кораблі прикриття"
 capital_ship:0 "Основні кораблі"
 
 vnr_ship_hull_light_6: "Легкий корпус « холодної війни »"
 vnr_ship_hull_light_6_desc: "Після Другої світової війни звичайні есмінці, побудовані в цей період, були значно більші за кораблі військового часу і мали повністю автоматичні головні знаряддя, механізми установок, радари, сонари і протилодне озброєння, як-от міномет Кальмар, коли в 1950-х роках ракет класу стала земля-повітря і поверхня-поверху змінили морську війну. Для захисту флоту від повітряних, підводних і надводних загроз були розроблені есмінці з керованими ракетами."
 vnr_ship_hull_cruiser_6: "Корпус крейсера холодної війни"
 vnr_ship_hull_cruiser_6_desc: "Під час Другої світової війни авіакомпанія докорінно змінила характер морського бою. Навіть найшвидкісніші крейсери не могли маневрувати достатньо швидко, щоб уникнути повітряної атаки, а літаки тепер мали торпеди, що дозволяло їм протистояти помірним дистанціям.\n\nПротягом другої половини XX століття, коли лінкори повністю застаріли з появою ракет, крейсер став найбільшим у світі кораблям. Деякі з них повністю перейняли конструкцію ракет і навіть застосували ядерні двигуни."
 vnr_ship_hull_submarine_5: "Корпус підлоки холодної війни"
 vnr_ship_hull_submarine_5_desc: "У 1950-х роках атомна енергія частково замінила дизель-електричні двигуни, також було розроблено обладнання для вивільнення кисню з морської води. Ці два нововведення дозволили підводним човнам залишатися під водою протягом тижнів і місяців."
 
 vnr_ship_hull_merchant_carrier: "Корпус торгового авіаносця"
 vnr_ship_hull_merchant_carrier_desc: "Торговий авіаносець - це авіаносець обмеженого призначення, адаптований шляхом додавання злітної палуби до сухо вантажу або нафтового танкера, що дозволяє йому використовувати протилодкові літаки для підтримки конвоїв." 
 vnr_ship_hull_mega_carrier: "Корпус стратегічного авіаносця"
 vnr_ship_hull_mega_carrier_desc: "Наприкінці 40-х років ядерна зброя почала застосовуватися в реальних бойових діях, його жахлива сила, яка обрушилася на населені міста, змусила всі великі країни розробити і впровадити засоби ядерної тріади. Важкі реактивні бомбардувальники були єдиним способом доставки ядерних бомб на великі відстані до винаходу міжконтинентальних балістичних ракет. Це спонукало військово-морського флоту запропонувати мобільний платформу для нанесення ядерних ударів, якою став ударний авіаносець."
 vnr_ship_hull_arsenal_ship: "Корпус корабля-арсенала"
 vnr_ship_hull_arsenal_ship_desc: "Розробка і масове виробництво ракет зробили їх ще дешевшими, ніж інші військові засоби. Концепція великого надводного корабля, що несе сотні ракет, була розроблена для ведення інтенсивних і точних прибережних бомб, деякі експерти назвали його кораблем-арсеналом."
