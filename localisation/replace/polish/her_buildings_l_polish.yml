l_polish:
 PRODUCTION_MATERIALS_COAL:0 "Вугілля"
 coal_desc:0 "Вугілля — це пальне, а також найбільше джерело електроенергії, а також важливий компонент виробництва сталі."
 PRODUCTION_MATERIALS_IRON:0 "Залізо"
 iron_desc:0 "Металічне залізо має вирішальне значення для виробництва сталі, чугуни та інших сплавів."
 PRODUCTION_MATERIALS_BAUXITE:0 "Боксити"
 bauxite_desc:0 "Боксити - це руда, необхідна для виробництва алюмінію."

 arms_factory_desc:0 "Ця споруда дає можливість виробляти в області нове військове спорядження. За потребою може бути перетворений у цивільний завод."
 
 industrial_complex_desc:0 "Ця споруда забезпечує територію товарним товаром і дає змогу будувати нові споруди, які можна перетворити на фабрику з виробництва військової продукції. §Y(ПОТРЕБЛЯЄ §!§R20 СТОЛІ)§!\n"
 
 steel_refinery:0 "Сталевий завод"
 steel_refinery_plural:0 "Сталелитні заводи"
 steel_refinery_desc:0 "Сталева фабрика — промислове підприємство з виробництва та розливу сталі. §Y(ПОТРЕБЛЯЄ §!§R30 УГЛЯ§Y І §!§R30 ЖЕЛЕЗА§!§Y)§!\n"
 aluminium_refinery:0 "Алюмінієвий завод"
 aluminium_refinery_plural:0 "Алюмінієві заводи"
 aluminium_refinery_desc:0 "Випадання алюмінію - це процес захоплення алюмінію з його оксиду, глінозему, як правило, за допомогою процесу Холла-Еру. §Y(ПОТРЕБЛЯЄ §!§R30 УГЛЯ§!§Y І §!§R30 БОКСИТІВ§!§Y)§!\n"
 hydro_steel_refinery:0 "Сталевий завод з гідроприводом"
 hydro_steel_refinery_plural:0 "Сталелитні заводи з гідроприводом"
 hydro_steel_refinery_desc:0 "Виробництво стало дешевшим за гідроелектростанцію, але воно вимагає великих оригінальних інвестицій у вигляді вартості будівництва. §Y(ПОТРЕБЛЯЄ §!§R10 УГЛЯ§Y І §!§R30 ЖЕЛЕЗА§! §Y)§!\n"
 hydro_aluminium_refinery:0 "Алюмінієвий завод з гідроприводом"
 hydro_aluminium_refinery_plural:0 "Алюмінієва фабрика з гідроприводом"
 hydro_aluminium_refinery_desc:0 "Проте гідроелектрична алюмінія вимагає великих інвестування у вигляді вартості будівництва. §Y(ПОТРЕБЛЯЄ §!§R30 БОКСИТІВ§!§Y)§!\n"
 
 steel_refinery_inactive:0 "Сталевий завод (неактивний)"
 steel_refinery_inactive_plural:0 "Сталелійні заводи (неактивні)"
 steel_refinery_inactive_desc:0 "Ця сталелитійна фабрика неактивна через брак сировини. Буде повторно активовано, якщо буде забезпечено достатньо сировини."
 aluminium_refinery_inactive:0 "Алюмінієва фабрика (неактивна)"
 aluminium_refinery_inactive_plural:0 "Алюмінієва фабрика (неактивна)"
 aluminium_refinery_inactive_desc:0 "Ця алюмінієва фабрика неактивна через брак сировини. Буде повторно активовано, якщо буде забезпечено достатньо сировини."
 hydro_steel_refinery_inactive:0 "Гідростальовий завод (неактивний)"
 hydro_steel_refinery_inactive_plural:0 "Гідросталітні заводи (неактивні)"
 hydro_steel_refinery_inactive_desc:0 "Цей гідросталітний завод не працює через брак сировини. Буде повторно активовано автоматично, якщо буде забезпечено достатньо сировини."
 hydro_aluminium_refinery_inactive:0 "Гідроалюмінієва фабрика (неактивна)"
 hydro_aluminium_refinery_inactive_plural:0 "Гідроалюмінієві заводи (неактивні)"
 hydro_aluminium_refinery_inactive_desc:0 "Ця гідроалюмінієва фабрика неактивна через брак сировини. Буде повторно активовано, якщо буде забезпечено достатньо сировини."
 synthetic_refinery_inactive:0 "Нефтепереробна фабрика"
 synthetic_refinery_inactive_plural:0 "Нефтепереробні фабрики (неактивні)"
 synthetic_refinery_inactive_desc:0 "Цей нафтопереробний завод неактивний через брак сировини, можливо, знову активується, якщо буде достатньо сировини."

