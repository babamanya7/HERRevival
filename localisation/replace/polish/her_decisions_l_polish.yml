    GER_west_wall_limes_line:0 "Західний вал: програми «Маска» і «Ахен-Саар»"
    GER_west_wall_limes_line_desc:0 "Західний вал необхідно зміцнити, щоб він був захищений від будь-яких атак з боку країн Бенілюкса і посилити Французьку лінію оборони."
    GER_west_wall_limes_line_dd:0 "Збудує §Y4 рівні бункерів§! У кожній провінції вздовж Французько-бельських кордонів від Мозельленду до Бадена.\n"
