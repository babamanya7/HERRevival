    ENG_the_kings_speech:0 "Промова короля"
    ENG_the_kings_speech_desc:0 "'У цю фатальну годину, можливо, самий судний в нашій історії, вдруге в житті більшості з нас ми знаходимося в стані війни. Знову і знову ми намагалися знайти мирне розв'язання незгод між нами і тими, хто тепер є нашими ворогами, але все було марно. Попереду можуть бути похмурі дні, і війна більше не обмежується полем бою.'"
    ENG_the_kings_speech_tt:0 "£faction_eng_british_royalists Роялісти, £faction_eng_conservative §YКонсерватори§! і £faction_eng_labour §YРобочі§! Буде більше §GПрихильні§!"

