    USA_JPMorgan_economic_relief_agitated:0 "£faction_usa_jpmorgan Переговори з J.P. Morgan ([?USA_JPMorgan_negotiation_uses|0]/2)"
    USA_JPMorgan_economic_relief_agitated_desc:0 "J.P. Morgan допоможе знизити втому економіки на §G5%§!Під час напруженого переговорів займуть §Y120 днів§!, Після чого повторні переговори будуть недоступні. §Y270 днів§!."
    USA_JPMorgan_economic_relief_worried:0 "£faction_usa_jpmorgan Переговори з J.P. Morgan ([?USA_JPMorgan_negotiation_uses|0]/2)"
    USA_JPMorgan_economic_relief_worried_desc:0 "J.P. Morgan допоможе знизити втому економіки на §G5%§!. Під час напружених переговорів займуть §Y75 днів§!, Після чого повторні переговори будуть недоступні. §Y180 днів§!."
    USA_JPMorgan_economic_relief_calm:0 "£faction_usa_jpmorgan Переговори з J.P. Morgan ([?USA_JPMorgan_negotiation_uses|0]/2)"
    USA_JPMorgan_economic_relief_calm_desc:0 "J.P. Morgan допоможе знизити втому економіки на §G5%§!. у спокійному відношенні переговори займуть §Y50 днів§!, Після чого повторні переговори будуть недоступні. §Y90 днів§!."
    USA_JPMorgan_negotiation_uses_available_tt:0 "Лічильник переговорів з J.P. Morgan менше §Y2/2§!"
    USA_JPMorgan_improve_relations:0 "£faction_usa_jpmorgan Поліпшити стосунки з J.P. Morgan"
    USA_JPMorgan_improve_relations_desc:0 "Впродовж §Y180 днів§! на фабрики народного споживання буде спрямовано §R+10%§!. Після завершення відношення J.P. Morgan покращиться на один рівень, але не вище спокійного. Рішення знову з'явиться через §Y360 днів§!."

    USA_investments_in_Ford_Chrysler:0 "£faction_usa_chrysler_ford Інвестиції в Ford/Chrysler"
    USA_investments_in_Ford_Chrysler_desc:0 "Після §Y90 днів§! Збільшить ефективність виробництва на §G+5%§!."
    USA_expand_support_for_american_entrepreneurs:0 "£faction_usa_chrysler_ford Розширення підтримки американських підприємців"
    USA_expand_support_for_american_entrepreneurs_desc:0 "Після §Y120 днів§! Завжди дасть §G+5%§! до зростання ефективності виробництва, §G+10%§! до швидкості будівництва військових заводів і §G-7,5%§! до вартості заводу на військові фабрики."
    USA_state_investments_in_defense_giants:0 "£faction_usa_chrysler_ford Державні інвестиції в оборонців"
    USA_state_investments_in_defense_giants_desc:0 "Після §Y200 днів§! Завжди дасть §G+15%§! до зростання ефективності виробництва і §G+7,5%§! до максимальної ефективності виробництва."

  USA_JPMorgan_market_assistance_calm:0 "Допомога J. P. Morgan"
  USA_JPMorgan_market_assistance_calm_desc:0 "На §Y120 днів§! Дає §G+0,25§! Політична влада в день і §Y-5%§! фабрика, яка виробляє товари народного споживання. Після виконання програми J. P. Morgan приваблює членів Конгресу на бік уряду. §Y180 днів§!."
  USA_JPMorgan_market_assistance_worried:0 "Допомога J. P. Morgan"
  USA_JPMorgan_market_assistance_worried_desc:0 "На §Y120 днів§! Дає §G+0,25§! Політична влада в день і §Y-5%§! фабрика, що виробляє товари народного споживання. Після виконання програми J. P. Morgan приваблює членів Конгресу на бік уряду. При тривожному відношенні рішення повернеться через §Y250 днів§!."
  USA_JPMorgan_market_assistance_agitated:0 "Допомога J. P. Morgan"
  USA_JPMorgan_market_assistance_agitated_desc:0 "При схвильованому відношенні J. P. Morgan не буде допомагати уряду."
  USA_JPMorgan_market_assistance_congress_support_tt:0 "До §G10 сенаторів§! і §G25 членів Палати представників§! Підтримають уряд."
  USA_JPMorgan_market_assistance_requires_worried_tt:0 "Ставлення J. P. Morgan — §YТривога§! Або краще."
