    USA_internal_factions_desc:1 "Велика депресія посилила політичний стрес у Сполучених Штатах Америки, хоча вони фінансували його перші вибори, але промислові титани дедалі більше розходяться з Рузвельтом, оскільки він обслуговує народ. Але він не може дозволити собі повністю втратити їхню підтримку, оскільки їхні промислові бази можуть знадобитися, якщо Сполучені Штати Америки втягнуться у нову війну...\n\n"

