    USA_ford_retooling_factories_slow_desc:0 "£faction_usa_chrysler_ford FFord/Chrysler поступово перебудовують частину своєї автомобільної промисловості для виконання державних контрактів на поставку військової продукції в мирний час."

    USA_ford_retooling_factories_fast:0 "£faction_usa_chrysler_ford Форд/Крайслер Швидко переощаджують заводи"
    USA_ford_retooling_factories_fast_desc:0 "£faction_usa_chrysler_ford Компанія Ford/Chrysler в терміновому порядку перебудовує всю свою автомобільну промисловість для задоволення потреб військового виробництва в умовах війни."

