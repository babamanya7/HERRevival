    ITA_war_speech:0 "Мова «Відкинуто жеребок»"
    ITA_war_speech_desc:0 "'Бойці на суходолі, на морі і в повітрі, чоловіки і жінки Італії та імперії, слухайте! Час, передчасний нам доля, проб'є для нас. Час безповоротного рішення настав. Оголошення війни вже оголошує. Ми переможемо, щоб нарешті дати новий світ, світ і справедливість Італії, Європі та всесвіту, італійські люди, хапайтеся за зброю і покажіть свою витривалість, свою мужність, свою доблесть!"

    ITA_war_speech_tt:1 "£faction_ita_proletariat §YПролетаріат§! стане §Gпідтримувати§! Війна, збільшуючи §YПриріст політичної влади§! на §G10%§!"

