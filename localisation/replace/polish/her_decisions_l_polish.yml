    SS_form_SS_high_command:0 "£faction_ger_ss Створити найвище командування SC"
    SS_form_SS_high_command_desc:0 "Гіммлер отримав схвалення від Ваффен-С на формування власного вищого командування, Kommanandoamt der Waffen-SS в рамках SS-Führungshauptamt, який було створено в серпні 1940 року. Він отримав команду SS-VT (Leibstandarte і Verfgungs-Division). , Перейменована в Das Reich і озброєні полиці SS-TV (Totenkopf-Division разом з декількома незалежними від Totenkopf-Standarten)."
