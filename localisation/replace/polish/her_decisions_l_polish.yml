    GER_danzig_speech:0 "Промова "Данціг залишиться німецьким""
    GER_danzig_speech_desc:0 "«Дорогі мої мешканці Данціга, не тільки ви переживаєте цей момент з глибоким хвилюванням, більше того, вся німецька нація розділяє його з вами, і я теж усвідомлюю велич цього години, коли вперше ступаю на землю, яку П'ять століть тому зайняли німецькі поселенці, яка протягом п'яти століть була німецькою і, можете бути впевнені, залишиться німецькою»."
    GER_fall_of_france_speech:0 "Промова "Версаль відомщений""
    GER_fall_of_france_speech_desc:0 "«Тепер, коли ми розгромили французів, вони відчують, що відбувається, коли намагаєшся придушити німецький народ, вони платитимуть нашим військам, яких ми залишаємо охороняти та захищати цю землю!»"
    GER_total_war_speech:0 "Мова "Тотальна війна""
    GER_total_war_speech_desc:0 "«Чи вірите ви разом з фюрером і нами у цілковиту перемогу німецького народу, чи готові ви і німецький народ працювати, якщо фюрер накаже, по 10, 12, а якщо необхідно, і 14 годин на день і віддати все заради перемоги? Чи хочете ви тотальнішу війну? ніж усе, що ми можемо собі уявити сьогодні?»"

    GER_west_wall_border_watch:0 "Західний вал: програма «прикордонник»"
    GER_west_wall_border_watch_dd:0 "Збудує §Y3 рівня бункерів§! у кожній провінції вздовж французького кордону від Саара до Бадена.\n"
