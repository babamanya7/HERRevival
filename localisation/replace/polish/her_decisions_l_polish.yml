    SS_himmler_speer_agreement:0 "Угода Гімлера-Шпеєра"
    SS_himmler_speer_agreement_desc:0 "У 1942 році, після призначення Альберта Шпеєра, Гімлер запропонував, щоб від 5 до 8 відсотків німецького воєнного виробництва було переправлено Ваффен-С в обмін на лояльних робітників СС для Німеччини. Виконання цього рішення призведе до появи нових юнітів СС з 3/30/60% безкоштовним спорядженням, залежно від вибраного варіанта."

