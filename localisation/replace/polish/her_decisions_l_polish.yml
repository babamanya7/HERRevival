    STRATEGIC_REGION_pacific:0 "Тихоокеанський контроль"
    STRATEGIC_REGION_pacific_desc:0 "Тихий океан є життєво важливим для безпеки нашої рідної території.\n\nКонтроль повинен бути збережений, і в разі війни ми не можемо §Rвтратити§! Наше володіння тут інакше населення почне відчувати загрозу, а посилення контролю над Тихим океаном дозволить нам утвердити §YБільше панування§! Над іншими великими державами\n\n§Y[USA.GetFlag]Американська§! Вплив на тихий океан - [ROOT.GetUSApacificcontrol] ([?USA_pacific_control|Y0])\n\n§Y[JAP.GetFlag]Японське§! Вплив на тихий океан - [ROOT.GetJAPpacificcontrol] ([?JAP_pacific_control|Y0])"

    STRATEGIC_REGION_mediterranean:0 "середземноморський контроль"
    STRATEGIC_REGION_mediterranean_desc:0 "Середземне море є життєво важливим для безпеки нашої рідної території.\n\nКонтроль повинен бути збережений, і в разі війни ми не можемо §Rвтратити§! Наше володіння тут інакше населення почне відчувати загрозу, а підсилення контролю над Середземним морем дозволить нам утвердити §YБільше панування§! Над іншими великими державами.\n\n§Y[ENG.GetFlag][ENG.GetName]§! контроль над Середземним морем - [ROOT.GetENGMediterraneancontrol] ([?ENG_med_control|Y0])\n\n§Y[ITA.GetFlag][ITA.GetName]§! контроль над Середземним морем - [ROOT.GetITAMediterraneancontrol] ([?ITA_med_control|Y0])"

