    USA_public_fireside_chat_sway:0 "£faction_usa_public_support Публічні розмови в мирний час"
    USA_public_fireside_chat_sway_desc:0 "Франклін Рузвельт був добре відомий своїм «розмови біля каміна»Тут він міг використовувати свою політичну силу, харизму, для прямого впливу на американський народ особисто."
    USA_public_fireside_chat_sway_tt:0 "£faction_usa_public_support Публікація не більше, ніж §YТривожний§! і має трохи впливу\nЗбільшує тривалість на §Y30 Днів§! за кожен рівень вірності, починаючи з §YТревожного§!"

    USA_public_fireside_chat_war_support:0 "£faction_usa_public_support Публічні розмови воєнного часу"
    USA_public_fireside_chat_war_support_desc:0 "Завдяки вмілому використанню харизми в неформальних розмовах Франклін Рузвельт може заспокоїти американський народ про війну за кордоном на особистому рівні і довірливому рівні."
    USA_public_fireside_chat_war_support_tt:0 "£faction_usa_public_support Публіка принаймні §GПрихильна§! і має трохи впливу\nn збільшити тривалість на §Y60 днів§! за кожен рівень вірності, починаючи з §GПривітного§!"

