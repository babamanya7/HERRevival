    GER_me262_1943:0 "£faction_ger_industrialists Перший реактивний літак"
    GER_me262_1943_desc:0 "Наша реактивна техніка далеко просунулась вперед, і ми вже проектуємо наш перший реактивний винищувач. Потрібно багато політичних маневрів і прихильності, щоб підштовхнути люфтвафі до впровадження цієї невідомої технології"

    GER_reopen_trade_with_sweden:0 "Знову торгівлю з Швецією"
    GER_reopen_trade_with_sweden_desc:0 "Британія використовувала Норвегію як засіб, щоб змусити Швеції припинити торгівлю з нами, і ми повинні завоювати Норвегію, щоб змусити Швецію відновити торгівлю з нами."

    GER_close_off_sweden:0 "Обмежити торгівлю Швеції"
    GER_close_off_sweden_desc:0 "Тепер, коли ми контролюємо Норвегію, ми маємо повну свободу змусити Швецію торгувати тільки зі країнами Осі."

    GER_secure_portuguese_wolfram:0 "Монополірувати португальський вольфрам"
    GER_secure_portuguese_wolfram_desc:0 "Після капітуляції Франції наше панування в Західній Європі дозволяє посилити тиск на Лісабон, і ми можемо вимагати, щоб Португалія припинила продаж стратегічно важливих вольфрам поза Осі."

    GER_secure_turkish_chromium:0 "Монополізувати турецький хром"
    GER_secure_turkish_chromium_desc:0 "Після рішення долі Греції Ось керує на Балканах і може посилити економічний тиск на Турцію. Анкара повинна направити свій стратегічний хром у німецьку воєнну промисловість, а не ворогів."

