    USA_provide_food_SOV:0 "Постачання їжі"
    USA_provide_food_SOV_desc:0 "Американські поставки продовольства зменшать навантаження на радянську державну економіку, і на 30 днів будуть залучені §Y3 фабрики§! і §Y15 конвоїв§!."

    USA_monthly_steel_lend_lease_SOV:0 "Регулярні поставки стали в СРСР"
    USA_monthly_steel_lend_lease_SOV_desc:0 "Запустити регулярні поставки сталі. Кожні 14 днів зі складів США буде списуватися §Y30 000§! А Радянський Союз отримає таку саму партію, і на весь час дії програми будуть зайняті. §Y3 фабрики§! і §Y25 конвоїв§!. При проблемці стали автоматично припинитися, конвою повертається в резерв, а запустити її доведеться заново."
    USA_monthly_steel_lend_lease_SOV_stockpile_tt:0 "На складах Сполучених Штатів знаходиться не менше §Y30 000§! сталі"
    USA_monthly_steel_lend_lease_SOV_tt:0 "США втратять §R30 000§! Єд. сталі, СРСР отримає §G30 000§! їд. стали, після чого автоматично розпочнеться підготовка наступної поставки. Вилишок над вмістом радянських складів буде втрачено."

    USA_monthly_aluminium_lend_lease_SOV:0 "Регулярні поставки алюмінії в СРСР"
    USA_monthly_aluminium_lend_lease_SOV_desc:0 "Запустити регулярні поставки алюмінію. Кожні 14 днів зі складів США буде списано §Y7 500§! Алюмінія, а Радянський Союз отримає таку саму партію, і на весь час програми будуть зайняті. §Y1 фабрика§! і §Y10 конвоїв§!. Якщо алюмінію не вистачає, вона автоматично припиниться, конвоюї повернуться в резерв, а запускати її доведеться заново."
    USA_monthly_aluminium_lend_lease_SOV_stockpile_tt:0 "На складах Сполучених Штатів знаходиться не менше §Y7 500§! алюмінія"
    USA_monthly_aluminium_lend_lease_SOV_tt:0 "США втратять §R7 500§! Алюмінія, СРСР отримає §G7 500§! їд. алюмінію, після чого автоматично почнеться підготовка наступної поставки. Висок над вміщення Радянського Союзу буде втрачено."

    USA_monthly_petroleum_lend_lease_SOV:0 "Регулярні поставки нафтопродуктів у СРСР"
    USA_monthly_petroleum_lend_lease_SOV_desc:0 "Запускає регулярні поставки бензину, маслини та інших нафтопродуктів. Кожні 14 днів США буде списано. §Y50 000§! їд. пальне, а СРСР отримає таку саму партію, і програма весь час буде зайнята. §Y3 фабрики§! і §Y60 конвоїв§!. програма автоматично припиниться, конвою повертається в резерв, а запускати її доведеться заново."
    USA_monthly_petroleum_lend_lease_SOV_stockpile_tt:0 "У США є не менше запасів §Y50 000§! Їже паливо"
    USA_monthly_petroleum_lend_lease_SOV_tt:0 "США втратять §R50 000§! їд. паливо, СРСР отримає §G50 000§! Їжа, після якої автоматично почнеться наступна поставка."

    USA_monthly_rubber_lend_lease_SOV:0 "Регулярні поставки гуми в СРСР"
    USA_monthly_rubber_lend_lease_SOV_desc:0 "Запустити регулярні поставки натуральної та синтетичної гуми. Кожні 14 днів зі складів США буде списано. §Y3 000§! гуми, а СРСР отримає таку ж партію, і на весь час програми будуть зайняті. §Y1 фабрика§! і §Y10 конвоїв§!. програма автоматично припиниться, конвою повертається в резерв, а запускати її доведеться знову."
    USA_monthly_rubber_lend_lease_SOV_stockpile_tt:0 "На складах Сполучених Штатів знаходиться не менше §Y3 000§! гуми"
    USA_monthly_rubber_lend_lease_SOV_tt:0 "США втратять §R3 000§! їд. гуми, СРСР отримає §G3 000§! їд. гуми, після чого автоматично почнуться приготування наступної поставки. Висок надмістя радянських складів буде втрачено."

    USA_monthly_railway_lend_lease_SOV:0 "Регулярні поставки залізничних матеріалів в СРСР"
    USA_monthly_railway_lend_lease_SOV_desc:0 "Запускає постійні поставки рейок, кріплення та залізничного обладнання. Кожні 14 днів зі складів США буде списано §Y15 000§! Стали й відправлялися §Y20 поїздів§!. Всі дії програми будуть зайняті. §Y2 фабрики§! і §Y15 конвоїв§!. Якщо у вас не вистачає сталі або поїздів, програма автоматично припиниться, конвоюї повернуться у резерв, а запускати її доведеться заново."
    USA_monthly_railway_lend_lease_SOV_stockpile_tt:0 "На складах Сполучених Штатів знаходиться не менше §Y15 000§! сталі"
    USA_monthly_railway_lend_lease_SOV_tt:0 "США втратять §R15 000§! Ед. сталі і §R20§! СРСР отримає поїздів §G20§! поїздів і на §Y35 днів§! Народний дух §Y«Залізнична речовина по ленд-лізу»§!, хто дає §G+30%§! і швидкість будівництва залізниць, і потім автоматично почнеться наступна поставка."

    USA_monthly_truck_lend_lease_SOV:0 "Регулярні поставки вантажівок в СРСР"
    USA_monthly_truck_lend_lease_SOV_desc:0 "Запустити регулярні поставки американських вантажних машин. Кожні 14 днів США будуть відправлятися. §Y200 вантажівок§!. Всі дії програми будуть зайняті. §Y1 фабрика§! і §Y10 конвоїв§!. програма автоматично припиниться, конвою повертається до резерву, а запускати її доведеться знову."
    USA_monthly_truck_lend_lease_SOV_stockpile_tt:0 "У США є не менше запасів §Y200§! вантажівок"
    USA_monthly_truck_lend_lease_SOV_tt:0 "США втратять §R200§! Вантажівки, СРСР отримає §G200§! Після чого автоматично почнеться підготовка наступної поставки."
