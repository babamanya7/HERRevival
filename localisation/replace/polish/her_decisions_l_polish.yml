    ITA_bonifica_integrale_tt:0 "£faction_ita_proletariat  §YПролетаріат§! Буде більше §GПрихильний§!, збільшувати £stability_texticon  §YСтабільність§! на §G+5.00%§!."

    ITA_cooperate_with_moderates_tt:0 "£faction_ita_bourgeoisie  §YБуржуазія§! Буде більше §GПрихильна§! і §GОб’ єм§!, збільшувати £stability_texticon  §YСтабільність§! на §G+5.00%§! і £political_power_texticon  §YПриріст політичної влади§! на §G+0.10§!"




    JAP_internal_factions:0 "Внутрішні Фракції"
    JAP_internal_factions_desc:1 "Хоча Японія отримує користь від вірних людей, готових виконувати накази Імператора, але різні японські військові угруповання ведуть запеклу боротьбу, яка приносить більше шкоди, ніж користі. Дзайбацу міцно контролюють економіку і відкриті для нашого Об'єднання, щоб компенсувати наші стратегічні слабкості.\n\n"

