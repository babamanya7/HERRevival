    USA_power_projection:0 "Тихоокеанська проекція сили"
    USA_power_projection_desc:0 "Ми повинні перенести наш штаб Тихоокеанського флоту в Перл-Харбор, на Гаваї, щоб покращити нашу проекцію сили через Тихий океан, без нього японські ембарго неможливо.\n\nРозмістіть Тихоокеанський флот, що складається як мінімум з §Y8 линкорів§!, §Y8 крейсерів§! і §Y30 есмінців§! у Перл-Харборі, Гаваї, щоб дати відпор японським провокаціям."
    USA_power_projection_tt:0 "§RМи не зможемо ввести ембарго на Японію!"
    USA_power_projection_fail:0 "Тихоокеанська проекція сили"
    USA_embargo_japan_tt:0 "Майте адекватну проекцію сили через Тихий океан через Тихоокеанський флот в Перл-Харборі."

    JAP_pearl_harbor:0 "Вікно можливостей у Перл-Харборі"
    JAP_pearl_harbor_desc:0 "Нам випала унікальна можливість атакувати згрупований Тихоокеанський флот США в Перл-Харборі. Якщо ми нанесемо скоординований удар в Перл-Харборі, то зможемо вивести з ладу значну частину їх військово-морської могутності. Ми повинні оголосити війну і атакувати Перл-Харбор протягом пів року, поки американці не готові."
    JAP_pearl_harbor_tt:0 "§RМи втратимо елемент несподіванки, а разом з ним і можливість швидкої війни!§!"

