    GER_battle_for_air_supremacy_over_britain:0 "Битва за перевагу над Британією"
    GER_battle_for_air_supremacy_over_britain_desc:0 "Після падіння Франції Люфтваффі може зосередитися проти Великобританії. Розширення мережі передових аеродром і підготовка стратегічної повітряної кампанії дозволить нашим літакам діяти далі і наносити потужніші удари по британській промисловості."

