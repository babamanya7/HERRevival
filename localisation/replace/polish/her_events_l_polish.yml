  zzz.996.t:0 "Країни Бенілюкса передають управління територіями"
  zzz.996.d:0 "У рамках підготовки до вторгнення уряду Бельгії, Люксембургу та Нідерландів погодилися після звільнення своїх європейських територій тимчасово передати контроль Великобританії. Це дозволить британцям будувати нові споруди і ефективно усувати руйнування під час наступу."
  zzz.996.a:0 "Ми їх не підведемо."

  zzz.997.t:0 "Країни Бенілюкса вимагають повернути управління"
  zzz.997.d:0 "Після закінчення війни в Європі Бельгія, Люксембург та Нідерланди вимагали, щоб вони повернулися до влади європейськими територіями."
  zzz.997.a:0 "Безусловно"

  zzz.998.t:0 "Франція передає управління територіями"
  zzz.998.d:0 "У рамках підготовки до вторгнення в Європу французький уряд погодився після звільнення метрополії тимчасово передати управління її територіями США. Це дозволить американцям будувати нові споруди і ефективно усувати руйнування в процесі наступу."
  zzz.998.a:0 "Ми їх не підведемо."

  zzz.999.t:0 "Франція потребує повернення управління"
  zzz.999.d:0 "Після закінчення війни в Європі Франція вимагала повернути їй контроль над територіями метрополії."
  zzz.999.a:0 "Безусловно"
