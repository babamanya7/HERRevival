  ww2_germany.64.d:0 "Місто Дортмунд потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.64.a:0 "Кінець близько..."

  ww2_germany.65.t:0 "Братислава Пала"
  ww2_germany.65.d:0 "Столиця нашого союзника Словаччини, Братислава, потрапила в руки ворога, ми повинні повернути її у що б не сталося!"
  ww2_germany.65.a:0 "Ми повинні повернути його будь-якою ціною!"

  ww2_germany.66.t:0 "Краків Пал"
  ww2_germany.66.d:0 "Місто Краків потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.66.a:0 "Кінець близько..."

  ww2_germany.67.t:0 "Варшава Пала"
  ww2_germany.67.d:0 "Місто Варшава потрапило в руки ворога, ми повинні повернути її будь-якою ціною!"
  ww2_germany.67.a:0 "Кінець близько..."

  ww2_germany.68.t:0 "Дрезден Пал"
  ww2_germany.68.d:0 "Місто Дрезден потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.68.a:0 "Кінець близько..."

  ww2_germany.69.t:0 "Штеттин Пал"
  ww2_germany.69.d:0 "Місто Штеттін потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.69.a:0 "Все втрачено..."

  ww2_germany.70.t:0 "Відень Пала"
  ww2_germany.70.d:0 "Місто Вена, колишня столиця Австрії, потрапила в руки ворога, ми повинні повернути її в будь-який момент!"
  ww2_germany.70.a:0 "Це катастрофа!"

  news.339.t:0 "Горті вільний від влади!"
  news.339.d:0 "Лідер Угорщини регент Міклош Горті був звільнений від влади силою після того, як група спецназа на чолі з Отто Скорцені захопила Горті і його сина, взявши їх під варту, і Хорті був змушений відмовитися від влади через Смерть його синів, Лідер партії «Схрещених стріл» Ференц Саша зайняв місце Хорті і повинен продовжувати війну до самого кінця."
  news.339.a:0 "Угорщина боротиметься!"

  ww2_germany.45.t:0 "Клюге знайдено мертвим"
  ww2_germany.45.d:0 "Фельдмаршал Гюнтер фон Клюге був знайдений мертвим сьогодні, він наклав на себе таблетку ціаніда після того, як фюрер відкликав його в Берлін після провалу жахливого замаху, в якому Клюге грав другорядну роль, але Це велика зрада Рейха та його народу."
  ww2_germany.45.a:0 "Нелояльна свиня"

  sov_armor.806.t:0 "Повідомлення 'Рамзая'"
  sov_armor.806.d:0 "[GetDateText] Ріхард Зірге повідомив у Ставці про найзапеклішу нараду японського імператора 6 вересня 1941 р., що японське рішення не вступати в війну з Радянським Союзом до кінця 1941 р., і на початку 1942 р. Якщо ми послухаємося цього донесення, то можемо зняти з східних кордонів свіжі дивізії і перекинути їх під Москву, щоб не захопити столиці Гітлерових військ."
  sov_armor.806.a:0 "Варто прислухатися"
  sov_armor.806_tt:0 "§GНальоти на далекий схід повністю припиняться, тримати війська там більше не потрібно§!"

















