  mtg_britain.4.t:1 "Домініони розходяться з короною"
  mtg_britain.4.d:1 "Уряди Домініона повідомили нам, що вони будуть в односторонньому порядку розривати зв'язки з Короною. Вони посилаються на небезпечний ріст фашизму і чимраз більше антидемократичного погляду Великобританії як на головну причину того, чому стосунки між Британією та співдружністю вже не можуть тривати.\n\nЯк сказав один з представників Співдружини в жарку інтерв'ю: \"Правительство, яке використовує насилля, ненависть і маніпуляції, не можна довіряти інтересам своїх підданих. Спираючись на останні події, ми можемо визначити неминуче падіння демократії та парламентаризму, ситуація може стати тільки гірше, якщо чорні сорочки отримають владу. Тому для захисту інтересів наших народів ми не бачимо альтернативи, крім як прибрати короля з поста глави нашої держави і відокремитися від Великобританії».\n\nВони сподіваються, що нинішній політичний параліч перешкодить нам діяти відповідно до цього різкого кроку."
  mtg_britain.4.a:1 "Ми безсилі зупинити їх - поки."

  usa_armor.804.t:0 "Росія вимагає миру"
  usa_armor.804.d:0 ""
  usa_armor.804.a:0 "Прийняти світ"
  usa_armor.804.b:0 "Відкидайте світ"

  usa_armor.805.t:0 "Ембарго [USA.GetName] для нашої країни"
  usa_armor.805.d:0 "Сполучені Штати Америки наклали на нас повне ембарго після наших недавніх політичних дій, використовуючи свої зв'язки в Південній Америці, країни відповідно до доктрини Монро наслідували приклад декларації США. Ми повинні шукати інші ресурси, які нам потрібні."
  usa_armor.805.a:0 "Ми втратили життєво важливих постачальників ресурсів."

  usa_armor.806.t:0 "Закон про судові процедури"
  usa_armor.806.d:0 "Оскільки Верховний суд безжалісно зменшує законодавство Нового курсу, потрібно вжити рішучих заходів, щоб забезпечити економічну безпеку американського народу. Для того щоб зробити суд безпроблемним, було розроблено план, щоб додати суддів, вірних новому курсу, до суду. Офіційне положення закону дозволить президенту призначити новий суд, якщо який-небудь суддя, який служив принаймні 10 років і не зміг піти у відставку 6 місяців після повороту 70. Цей акт, хоча і може бути конституційним, серйозно порушить баланс сил між гілками влади 3, і буде розглядатися багато американців як спроба переглянути конституцію і майже напевно обійдеться нам в значну підтримку."
  usa_armor.806.a:0 "Сподіватимемося, що це спрацює"

  usa_armor.807.t:0 "Питання про дім"
  usa_armor.807.d:0 "Плануючи подолати опозицію Конгресу, виникло питання про те, на якій частині Конгресу слід зосередитися, щоб прийняти законопроект. Хоча закони зазвичай відправляються в палату в першу чергу, тоді, можливо, вигідніше зосередитися в Сенаті."
  usa_armor.807.a:0 "Зосереджуватися на Сенаті"
  usa_armor.807.b:0 "Зосереджуйтесь на домі"

  usa_armor.808.t:0 "Дев'ятий Fireside Chat"
  usa_armor.808.d_house_not_told:0 "У розмові з Рузвельтом Рузвельт звернувся до своїх планів судової реформи. У своїй промові він пов’язав віття американського уряду 3 з конем 3, очолюваними американським народом, з третім конем, Судом, не витягуючи її долю, і розкрикував суд як \\"Policy Making Body\\" Замість суду він висміював його за спробу відвернути полегшення. Однак приклади, наведені Рузвельтом, виявилися оманливими або насправді помилковими, і це призвело до поділу багатьох американців на цю тему, вважаючи її безсоромним захопленням. влада, навіть багато партії, які виступають за новий курс."
  usa_armor.808.d_house_told:0 "У розмові з Рузвельтом Рузвельт звернувся до своїх планів судової реформи. У своїй промові він пов’язав віття американського уряду 3 з конем 3, очолюваними американським народом, з третім конем, Судом, не витягуючи її долю, і розкрикував суд як \\"Policy Making Body\\" Замість суду він висміював його за спробу відвернути полегшення. Хоча немає доказів, що Палати підтримували цю віру, все ж таки вона зміцнилася завдяки підтримці від американського народу."
  usa_armor.808.a:0 "Фальсифікація документів — потрібне зло"
  usa_armor.808.b:0 "Ми повинні прискорити законопроект."
  usa_armor.808.c:0 "Сподіватимемося, що це працює"

  usa_armor.809.t:0 "Дебати між демократами"
  usa_armor.809.d:0 "Як тільки законопроект потрапив в будинок, спалахнув хаос. Демократична партія просто розвалилася, коли дві коаліції засудили один одного, а багато демократів, які виступають проти законопроекту, приєдналися до республіканців, які скористалися всіма перевагами, що вони мали, щоб розділити демократів, а цьому не допомогло лист віце-президента Джона Ненса Ґарнера, який засудив законопроект, у прямому непокорі президенту. При роз'єднанні частини необхідно зробити заходи для забезпечення прийняття законопроекту."
  usa_armor.809.a:0 "Примушувати до компромісу"
  usa_armor.809.b:0 "Осудити противників законопроекту"

  usa_armor.810.t_bill_pass:0 "Біл проходить"
  usa_armor.810.t_bill_fails:0 "Біл провалився"
  usa_armor.810.d_bill_pass:0 "Незважаючи на сильну опозицію, законопроект пройшов через обидві палати Конгресу, за допомогою набору компромісів і переконливих, законопроект було прийнято з 225 на голосування 210 в палаті представників і 50 на 46 в Сенаті. Цей успіх великою мірою зумовлений тим, що Рузвельт засудив листа Ґарнера, а також поступками на інших фронтах, але незважаючи на цей успіх, багато людей відвернулися від Рузвельту. Незважаючи на це, законопроект повинен вступити в силу дуже скоро, розширюючи можливості для законодавства."
  usa_armor.810.d_bill_fails:0 "Незважаючи на наші зусилля, законопроекту вдалося зібрати достатньо опозиції, щоб ефективно перемогти його. Частково через листи віце-президента, а також кроки, зроблені республіканцями, законопроект був повністю зруйнований, з 170 за і 265 проти в Палаті представників, і законопроект не зміг просунутися в Сенат. Крім того, багато людей відвернулися від Рузвельта через те, що вони описують як спробу диктатури."
  usa_armor.810.a:0 "Яке полегшення"
  usa_armor.810.b:0 "Черт."

  usa_armor.814.t:0 "США проти Батлера: 0 Закон про регулювання сільського господарства визнано неконституційним"
  usa_armor.814.d:0 "Сьогодні Верховний суд США постановив, що Закон про регулювання сільського господарства є неконституційним. «США проти Батлера» Було вирішено, що податок на виробників є неконституційним, оскільки він не є правдивим податком, оскільки він обкладав податок на переробки сільськогосподарських товарів тільки для того, щоб дати гроші Фермерам, а також спроба контролювати сільськогосподарські ціни, які виходять за рамки таких повноважень Конституції, — це рішення вимагає зусиль з надання допомоги фермерам."
  usa_armor.814.a:0 "Щось повинно бути зроблено з цим судом."
  usa_armor.815.t:0 "Сидячий страйк у місті Флінт"
  usa_armor.815.d:0 "Сьогодні об'єднання робітників автомобільної промисловості організувало масовий страйк на заводі General Motors у Флінті, вперше замінивши нову тактику страйку, на відміну від пікетування, придумали «Жіночий страйк», робочі зайняли завод, не дав GM найняти штрейкбрехерів. Щоб підтримувати закон і порядок, ми могли б втрутитися, щоб досягти компромісу, але відмова від цього збереже нашу підтримку з боку профспілк, значна частина коаліції демократичних партій."
  usa_armor.815.a:0 "Нехай профспілки й фабрики самі розібираються"
  usa_armor.815.b:0 "Відправте армію, щоб домогтися компромісу"

  usa_armor.816.t:0 "Лист Ейнштейна Рузвельту"
  usa_armor.816.d:0 "Сьогодні на наших столах був лист, написаний всесвітньо відомими науковцями Альбертом Ейнштейном і Лео Сцилардом, біженцями з Європи. У листі обидва твердять, що існує ймовірність того, що Німеччина розробляє бомбу, яка працює на розщепленні атомів, щоб спричинити вибух, наслідки якого будуть катастрофічними. Вони закликають нашу адміністрацію почати розробку подібної бомби в якості контрмери потенційним німецьким розробкам."
  usa_armor.816.a:0 "Необхідно розглянути цю можливість"

  usa_armor.817.t:0 "Рецесія Рузвельта"
  usa_armor.817.d:0 "Раптове скорочення бюджету призвело до різкого спаду американської економіки. Враховуючи, що рівень безробіття став найвищим з початку депресії, ясно, що відновлення американської економіки займе більше часу, ніж очікувалося."
  usa_armor.817.a:0 "Щось має бути зроблено"
  usa_armor.817.b:0 "Це спрацює врешті-решт"

  usa_armor.818.t:0 "Америка обіцяє допомогу"
  usa_armor.818.d:0 "З ростом підтримки війни в Сполучених Штатах Америки недавно було прийнято законопроект, в якому Америка може надавати косметичну допомогу, допомагаючи з економічною та військовою допомогою. Ми сподіваємося, що поставки зброї і паливо будуть протягом наступних років."
  usa_armor.818.a:0 "Найзахопливіше рятівне коло"

  usa_armor.819.t:0 "США хочуть приєднатися до союзників"
  usa_armor.819.d:0 "З підтримкою з дому Сполучені Штати Америки офіційно скерували прохання приєднатися до союзників, щоб допомогти військовим зусиллям і скинути фашистську тиранію. Такі зухвалі особи, що живуть поряд з нами, зажадають, щоб вони не пішли на війну."
  usa_armor.819.a:0 "Привітання нашим новим союзникам"
  usa_armor.819.b:0 "Нам не потрібна їхня допомога"

  usa_armor.820.t:0 "Торпедна криза США"
  usa_armor.820.d:0 "Під час першого морського бою і тренувань ми виявили серйозні проблеми з нашими торпедами. Ми виявили, що існують серйозні проблеми в тому, що торпеда працює занадто глибоко, передчасна детонація, відмова вибуху і торпеда рухаються колами, а не лінійними рухами. По суті, нам потрібно припинити виробництво наших дефектних торпед і терміново зайнятися усуненням цих проблем, які на деякий час залишать нас уразливими."
  usa_armor.820.a:0 "Ми повинні бути обережні, поки це не буде виправлено"

  usa_armor.821.t:0 "Виправлені проблеми зі вибухом торпедів."
  usa_armor.821.d:0 "Наші вчені виявили проблеми з магнітом вибуху і будь-які проблеми з передчасними вибухами. Крім того, були встановлені нові гіроскопи, які також фіксують будь - які кругові рухи нашої торпеди. Очікується, що це різко збільшить кількість попадання наших торпед, хоча є ще деякі проблеми, які необхідно виправити."
  usa_armor.821.a:0 "Чудово."

  usa_armor.822.t:0 "Виправлені проблеми з глибиною торпеди."
  usa_armor.822.d:0 "Нові покращення у плаванні торпедів усунули проблеми з занадто глибоким бігом нашої торпеди"
  usa_armor.822.a:0 "Чудово."

  usa_armor.870.t:0 "Тегеранська конференція"
  usa_armor.870.d:0 "Ми поділяємо Німеччину як спільного ворога з Радами, і нам було б вигідно використати це, щоб організувати зустріч і перетворити її на велику угоду між нашими фракціями. Можливо, ми зможемо очолити ці переговори і змусити Раді використовувати сили проти Японії і, можливо, відкрити більше дипломатичних відносин з азіатськими країнами, такими як Туреччина, використовуючи радянське Вплив. Але слід очікувати тертя через наші протилежні ідеології."
  usa_armor.870.a:0 "Нам слід надіслати делегацію"

  usa_armor.871.t:0 "Тегеранська конференція"
  usa_armor.871.d:0 "Вони послали делегацію, щоб розпочати переговори та обговорити стратегію, і їх головна мета - змусити нас направити сили проти Японії. Ми, звичайно, погодимося на це тільки після того, як з Німеччиною буде вирішено питання, але, хоча ми ще можемо їх відвернути, це хороша можливість зміцнити наші зв'язки з союзниками, які можуть виявитися корисними в Відкриття нових ринків, а також тиск на союзників, щоб вони дотримувалися більш агресивної стратегії щодо Німеччини і взяли на себе більше тягарів, коли почнеться війна."
  usa_armor.871.a:0 "Це чудова можливість"

  usa_armor.872.t:0 "Тегеранська конференція"
  usa_armor.872.d:0 "Коли Раді погодились на конференцію, то зобов’язалися оголосити війну Японії після того, як буде вирішено питання з Німеччиною, але вони сподіваються, що ми принесемо більший внесок у перемогу над Осою."
  usa_armor.872.a:0 "Позитивний результат"

  usa_armor.874.t:0 "Війна з Японією"
  usa_armor.874.d:0 "За результатами Тегеранської конференції ми зобов'язані оголосити війну Японії і разом з нашими союзниками покласти край висхідному сонцю. Наші радники впевнені в нашій силі, оскільки Японія вже дуже давно перебуває в стані війни, її резерви і техніка напевно майже вичерпані."
  usa_armor.874.a:0 "Давайте розмолотимо їх."

  usa_armor.875.t:0 "Східний мир"
  usa_armor.875.d:0 "З нашою перемогою на Сході настав час розрізати завойовані землі."
  usa_armor.875.a:0 "Перемога!"

  usa_armor.876.t:0 "США пропонують економічну допомогу"
  usa_armor.876.d:0 "Конгрес США схвалив план Маршалла допомогти у відбудові Європи. Згідно плану, США звернулися до нас з економічною допомогою, щоб допомогти зменшити нашу економічну втому під час війни і відновити нашу пошкоджену економіку. Це також дозволить швидше завершити будь-які будівельні проекти, але натомість ми повинні прийняти політику вільної торгівлі, а також розпочати демілітаризацію і, звичайно, прийняти домінування США в нашій фракції. Допомога за планом Маршалла триватиме 3 роки, якщо буде прийнято"
  usa_armor.876.a:0 "Ми приймаємо цю велику пропозицію."
  usa_armor.876.b:0 "Ми відновимо себе"

  usa_armor.877.t:0 "[From.GetName] пропонує возз’єднання Австрії"
  usa_armor.877.d:0 ""
  usa_armor.877.a:0 "Якщо вони залишаються нейтральними"

  usa_armor.878.t:0 "[From.GetName] прийняв нейтральне об’єднання"
  usa_armor.878.d:0 ""
  usa_armor.878.a:0 "Це буде досить добре"

  usa_armor.879.t:0 "Менше грошей, що нагромадили"
  usa_armor.879.d:0 "Невдовзі після того, як багато людей пішли на заробітки, багато з них зробили все можливе, щоб зменшити кількість заниженого багатства і використати його. Це означає менше грошей для нас, але ми отримуємо кращу економіку."
  usa_armor.879.a:0 "Ми зробили свою роботу"
  usa_armor.879_tt:0 "Знижує витрати на товари народного споживання, але збільшує швидкість будівництва та видобуток ресурсів завдяки §YПодаток нагромаджене майно§!."

  usa_armor.1000.t:0 "Вибори 1936"
  usa_armor.1000.d:0 "Настав день президентських виборів, діючий президент Франклін Делано Рузвельт вже реалізував кілька програм, які в сукупності називаються «Новий курс», покликаний вивести США з Великої депресії. Хоча багато зусиль були популярними, його плани щодо подальшої ролі та влади уряду були представлені критикою з боку його опонента, республіканця Альфа Лендона. Лендон хоче бачити велику економічну свободу, в той час як Рузвельт і Демократична партія хочуть розширити соціальне забезпечення і забезпечити економічну стабільність. Вибори можуть бути близьким дзвінком або великою перемогою демократів."
  usa_armor.1000.a:0 "Рузвельт, звичайно."

  usa_armor.1001.t:0 "Вибори 1940"
  usa_armor.1001.d:0 "Від часу, коли президент Сполучених Штатів Америки вперше заснував посаду, жоден президент не правив протягом трьох послідовних термінів. Однак у світлі нестабільного стану миру та міжнародних подій за останні кілька років президент Рузвельт вирішив на третій термін порвати з традицією і балотуватися. Республіканець Венделл Вілки, якого характеризують як кандидата від «Темний кінь» З досвідом промисловця з обмеженим політичним досвідом, Рузвельт ставився критично як до економічного інтернаціоналізму, так і до його виправдання на третій термін. Хоча кандидати мають багато спільного в зовнішньому політиці, і Віллкі хоче зберегти деяку форму Нового курсу, багато хто все ще вважає ці вибори вирішальним моментом для майбутнього американської демократії."
  usa_armor.1001.a:0 "Демократи. FDR незамінним."

  usa_armor.1002.t:0 "Вибори 1940"
  usa_armor.1002.d:0 "Від часу, коли президент Сполучених Штатів Америки вперше заснував посаду, жоден президент не правив протягом трьох послідовних термінів. Однак у світлі нестабільного стану миру та міжнародних подій за останні кілька років президент Рузвельт вирішив на третій термін порвати з традицією і балотуватися. Республіканець Уенделл Віллкі, якого характеризують як кандидата від «Темний кінь» з досвідом роботи в якості промисловця з обмеженим політичним досвідом, критикував як економічну інтервенціонізм Рузвельта, так і його виправдання, за те, що він балотувався на третій термін, і різко критикував прийняття законопроекту про судову реформу. Хоча кандидати мають багато спільного в зовнішньому політиці, і Віллкі хоче зберегти деяку форму Нового курсу, багато хто все ще вважає ці вибори вирішальним моментом для майбутнього американської демократії."
  usa_armor.1002.a:0 "Демократи. FDR незамінним."
  usa_armor.1002.b:0 "Республіканці, ми хочемо Віллкі!"

  usa_armor.1003.t:0 "Вибори 1944"
  usa_armor.1003.d:0 "Президентство Франкліна Рузвельта було винятковим у багатьох відношеннях. Незважаючи на погіршення здоров’я і безпрецедентну тривалість свого президента, він намагається і далі керувати нашою країною за допомогою військових зусиль. Республіканці були обмежені у виборі кандидатів через багатьох потенційних кандидатів, які служать у війні, але вибрали губернатора Томаса Дьюї, щоб представляти їх. \n\nРооsevelt продовжує користуватися народною підтримкою, але багато людей підозрюють, що він може не дожити до кінця свого терміну, але чи достатньо цього, щоб дати Дьюї перемоги над людиною, яка завела нас так далеко?"
  usa_armor.1003.a:0 "ФДР переміг Дьюї."

  usa_armor.1100.t:0 "Вибори в Конгресі"
  usa_armor.1100.d:0 "З завершенням іншого вибіркового циклу народ висловився, і конгрес був перебудований відповідно до його інтересів."
  usa_armor.1100.a:0 "Нам доведеться працювати з цим"

  usa_armor.880.t:0 "Переговори з Ford і Chrysler"
  usa_armor.880.d:0 "Генрі Форд, власник Ford Motor Comapny, і Уолтер Крайслер, власник Chrysler Corporation, не бачать негайної необхідності в капітальному переозброєнні для розміщення військової промисловості, оскільки ми знаходимося в Вони обоє дуже незадоволені тим, що їх покарали за Велику депресію через Новий курс. На даний момент Ford і Chrysler будуть приймати тільки обмежені урядові замовлення і конвертувати тільки невеликі частини своєї промислової бази в військове виробництво."
  usa_armor.880.a:0 "Це початок, я вважаю."

  usa_armor.881.t:0 "Переговори з GM і DuPont"
  usa_armor.881.d:0 "П'єр Дюпон, власник General Motors і DuPont Company, не бачить негайної потреби в капітальному переозброєнні для розміщення військової промисловості, оскільки ми знаходимося в світі. Дюпон все ще злиться на те, що його обчорнили як «Торговець смертю» Дослідування Gvernemnt. На даний момент GM і DuPont прийматимуть тільки обмежені урядові замовлення і конвертуватимуть тільки невеликі частини своєї промислової бази в воєнне виробництво."
  usa_armor.881.a:0 "Це початок, я вважаю."

  usa_armor.882.t:0 "Переговори з J.P. Morgan"
  usa_armor.882.d:0 "J.P. Morgan-молодший, власник банківського конгломерату J.P. Morgan, завжди намагається допомогти уряду США у вигляді кредитів. Морган все ще в люті через те, що його звинувачують у великому красі фондового ринку і початку Великої депресії, але бізнес для нього бізнес. В обмін на більш сприятливий прогноз по його банку з боку уряду США, він може надати нам дуже вигідні варіанти кредитування."
  usa_armor.882.a:0 "Він сказав, що бізнес - це бізнес."

  usa_armor.883.t:0 "Ford будує автомобільний комплекс в Толедо"
  usa_armor.883.d:0 "Форд побудував один з найбільших заводів у світі - Автомобільний комплекс Толедо, для масового виробництва джипів і вантажівок у небачених раніше масштабах. Це має підтримувати відповідну моторизацію армії Сполучених Штатів, на додаток до решти союзників."
  usa_armor.883.a:0 "Союзникам потрібні наші вантажівки"

  usa_armor.884.t:0 "Chrysler будує Детройтський арсенал"
  usa_armor.884.d:0 "Компанія Chrysler створила найбільший у світі завод в Детройті, щоб налагодити масове виробництво танків у небачених раніше масштабах. Це дозволить виробляти більше ніж достатньо танків для постачання наших бронетанкових військ і наших союзників."
  usa_armor.884.a:0 "Це повинно допомогти військовим зусиллям"

  usa_armor.885.t:0 "Ford повторно активує Willow Run"
  usa_armor.885.d:0 "Щоб поекспериментувати з виготовленням літаків до Великої депресії, Форд побудував найбільший у світі завод з виробництва літаків - Willow Run. Він був закритий через відсутність попиту після економічного краху, але якщо його знову відкрити, це буде найбільш ефективний авіаційний завод у світі. Едсел Форд стверджує, що бомбардувальники будуть сходити з конвеєра щогодини. "
  usa_armor.885.a:0 "Ви говорите, B-24 щогодини?"

  usa_armor.886.t:0 "Повна співпраця з Ford і Chrysler"
  usa_armor.886.d:0 "Після початку війни Генрі Форд і Уолтер Крайслер вирішили відкласти свої битви з урядом США і допомогти будь-яким можливим способом для перемоги. Вони пропонують допомогти побудувати нові фабрики з виготовлення боєприпасів і повністю переобладнувати свою виробничу базу для виготовлення військових технологій, як - от джипів, вантажівок та танків."
  usa_armor.886.a:0 "Нам потрібно все, що ми можемо отримати"

  usa_armor.887.t:0 "Повна співпраця з GM і DuPont"
  usa_armor.887.d:0 "Після початку війни П'єр Дюпон вирішив відкласти свою ворожість з урядом США про те, щоб бути «Торговцем смерті» і знову повернутися до титулу, щоб допомогти Союзній справі війни. Він пропонує General Motors допомогу у підвищення ефективності військового виробництва і DuPont Corporation допомогу в дослідженнях і розробці нових видів зброї і вибухових речовин."
  usa_armor.887.a:0 "Нам потрібно все, що ми можемо отримати"

  usa_armor.888.t:0 "Займи від J.P. Morgan "
  usa_armor.888.d:0 "Війна — це одна з найдорожчих речей, які може зробити уряд, оскільки уряд США не може заплатити за все, щоб врятувати світ, J.P. Morgan-молодший втрутився і запропонував не тільки покрити різницю, але й запропонувати нам надзвичайно вигідні кредити, щоб погасити решту."
  usa_armor.888.a:0 "Маленька інфляція нікому не зашкодить"
  usa_armor.888.b:0 "Думаю, ми можемо надрукувати більше самі."

  usa_armor.889.t:0 "Ford допомагає Kaiser"
  usa_armor.889.d:0 "Відчайдушні часи вимагають відчайдушних мір. Хоча магія зібраних ліній Ford є комерційною таємницею, ми переконали Ford навчити Kaiser дещо про масове виробництво. Завдяки цим новим знанням Кайзер може створювати кораблі з великою швидкістю."
  usa_armor.889.a:0 "Ділитися турботою"

  usa_armor.891.t:0 "Форд будує завод у Річмонді"
  usa_armor.891.d:0 "Щоб полегшити виробництво танків і авіаперевізників, Форд пропонує розширити один зі своїх найбільших заводів — завод Форда в Ричмонді (штат Каліфорнія). Це принесе неймовірний великий промисловий центр на Західному узбережжі для військових."
  usa_armor.891.a:0 "Це повинно допомогти військовим зусиллям"

  USA_congress_info:0 "Нова інформація про систему Конгресу"
  USA_depression_relief:0 "Захист від депресії"
  USA_deal_with_rosevelt_depression_economy:0 "Рестимулювання економіки"
  USA_waited_out_rosevelt_depression_economy:0 "Рецесія відтаює"
  USA_rosevelt_depression_crisis:0 "Рецесія Рузвельта"
  USA_rosevelt_depression_crisis_desc:0 "З раптовим зменшенням витрат на громадські справи, безробіття знову почало зростати, економіка ще більше занепала, якщо ми не приймемо термінових заходів, це може мати трагічні наслідки."

  afo_news.1.t:0 "Висадка союзників в Нормандії"
  afo_news.1.d:0 "Союзні сили почали те, що могло стати останнім ударом проти Осі, з вторгнення в Нормандію, час покаже, чи стане це першим кроком до перемоги і закінчення війни."
  afo_news.1.a:0 "Ми повинні негайно знищити цей новий фронт!"
  afo_news.1.b:0 "Вперед!"
  afo_news.1.c:0 "Нарешті"
  afo_news.1.e:0 "Зміни у світі"

  afo_news.2.t:0 "Перемога Осі в Північній Африці"
  afo_news.2.d:0 "Сили Осі тепер повністю контролюють Північну Африку, отримавши важливий Суецький канал і контроль над Близьким Сходом, і це серйозна невдача для союзних військ, які тепер покладають свої надії на СРСР."
  afo_news.2.a:0 "Тепер ми зосередимо всі зусилля проти більшовиків!"
  afo_news.2.b:0 ""
  afo_news.2.c:0 "Ми переможемо поодинці, якщо доведеться"
  afo_news.2.e:0 "Зміни у світі"

  afo_news.3.t:0 "Перемога союзників у Північній Африці"
  afo_news.3.d:0 "Війна союзників витіснила сили Осі в Північній Африці, тепер у них є можливість відкрити другий фронт на півдні Європи і вони на один крок наблизилися до закінчення Другої світової війни."
  afo_news.3.a:0 "Ми повинні перемогти в Європі, щоб компенсувати цю поразку."
  afo_news.3.b:0 "Перемога в руках"
  afo_news.3.c:0 "Ми зобов'язані першими взяти Берлін"
  afo_news.3.e:0 "Зміни у світі"

  afo_news.4.t:0 "Польське повстання у Варшаві"
  afo_news.4.d:0 "Після довгого періоду німецької окупації війська польського підполу піднялися, щоб звільнити свою столицю. Польська армія під керівництвом моїх колишніх офіцерів почала наступ на окупаційні сили по всьому місту. Звуки пострілів та вибухів ріжуть на вулицях Варшави; для німецьких гнобителів Польща — це звуки бунту, для поляків — відгомін свободи."
  afo_news.4.a:0 "Ми повинні негайно ліквідувати це повстання!"
  afo_news.4.b:0 "Бажаємо їм успіху"
  afo_news.4.c:0 "Нехай вони кровоточать"
  afo_news.4.e:0 "У них немає шансів."

  afo_news.5.t:0 "Гітлер був убитий"
  afo_news.5.d:0 "Пом’якшення позбутися Гітлера"
  afo_news.5.a:0 "Що це означатиме для нашого альянса?"
  afo_news.5.b:0 "Наш ворог руйнується зсередини!"
  afo_news.5.c:0 "Долой нацистів!"
  afo_news.5.e:0 "Справді, сюрприз"

  afo_news.6.t:0 "Італія вибухнула громадянською війною"
  afo_news.6.d:0 "Італійський народ втратив віру в Муссоліні після втрати колоній і Сицилії, на чолі з фельдмаршалом Пітером Бадольйо та королем Еммануїлом III італійські сепаратисти взяли під контроль його острови та південне узбережжя. Це прокладає шлях до висадки союзників і остаточної глави фашистської Італії."
  afo_news.6.a:0 "Яка катастрофа"
  afo_news.6.b:0 "Давайте скористаємося цією нагодою!"
  afo_news.6.c:0 "Фашисти безхребетні"
  afo_news.6.e:0 "Зовсім не здивований"

  afo_news.7.t:0 "Гітлер вчиняє самогубство"
  afo_news.7.d:0 "Після рішучого вторгнення до Німеччини Гітлер вирішив покінчити життя самогубством з Берліном, і ця втрата завдала великого удару моральному духові німців, і її закликають припинити війну, а також завершити помсти. У своїй останній волі і заповіті Гітлер обрав Карла Дениця, командуючий військово-морським флотом, штатсобергауптом, головою держави.Деніц оголосив, що війна буде продовжуватись доти, доки країна не врятується. від неминучої поразки, але сумнівно, що німецькі війська зможуть надати скільки-небудь значущого опору."
  afo_news.7.a:0 "Наш народ втрачає надію"
  afo_news.7.b:0 "Ми стоїмо на порозі перемоги"
  afo_news.7.c:0 "Интересно"
  afo_news.7.e:0 "Ми наближаємось до бою"

  afo_news.8.t:0 "Віші Північна Африка перемикається!"
  afo_news.8.d:0 "З багатьма провінціями Віші у союзній контролі і швидко зростаючій легітимністю Вільної Франції, глава французької Північної Африки, адмірал Дарлан наказав всім силам Віши приєднатися до союзницьких Це величезний удар за режим Віші та вісі у Північній Африці і дає союзникам унікальну можливість взяти під повний контроль регіон."
  afo_news.8.a:0 "Велика катастрофа!"
  afo_news.8.b:0 "Вузол затягується..."
  afo_news.8.c:0 "Французам не можна довіряти"
  afo_news.8.e:0 "Дивовижний поворот подій!"

  afo_news.9.t:0 "Рузвельт вимовляє промову «Арсенал демократії»."
  afo_news.9.d:0 "Сьогодні в своїй 16-ій розмові біля каміна Рузвельт закликав американців усвідомити небезпеку, яку агресія Осі представляє для Сполучених Штатів Америки. Зворушений падінням Франції та ізоляцією Британії, Рузвельт закликав американців усвідомити, що Атлантичний і Тихий океани не гарантують безпеки Сполучених Штатів Америки, вказуючи, що багато німецьких Ці бомбардувальники легко можуть досягти США, і найбільш дослідженою частиною промови була її ключова фраза, в якій Рузвельт заявив: «Ми повинні бути великим арсеналом демократії, для нас це надзвичайна ситуація, така ж серйозна, як і сама війна»Тоді як Сполучені Штати поступово відкидали ізоляціонізм, на даний момент це категоричний сигнал Осі про те, що Америка буде готова захищати свої інтереси за кордоном, незалежно від її колишнього нейтралітету."
  afo_news.9.1:0 "Ми повинні бути готові захищати демократію"
  afo_news.9.2:0 "Битва"
  afo_news.9.3:0 "Разом ми повинні захищати демократію"
  afo_news.9.4:0 "Интересно"

  afo_news.10.t:0 "Промову Хайле Селассіє"
  afo_news.10.d:0 "Після завоювання Ефіопії її колишній лідер Хайле Селассіє втік до штаб-квартира Ліги Націй, щоб оголосити про останні події, Селассіє засудив італійську агресію і розкрикував світову спільноту за бездіяльність. На завершення свого виступу, яке пізніше стало заголовком по всьому світу, він сказав: «Завтра це будете ви»Хоча багато хто справедливо критикує Великобританію та Францію, обидві країни не готові до будь-якого втручання. Саме через це і попередні невдачі Ліги експерти погоджуються, що це був останній цвях у кришці гробу Ліги Націй."
  afo_news.10.a:0 "Ніхто не встане у нас на шляху"
  afo_news.10.b:0 "Ми не виконали свій борг"
  afo_news.10.c:0 "Що за вдавати"

  afo_news.11.t:0 "Перемога Японії в Тихому океані"
  afo_news.11.d:0 "Японська імперія панує на Тихому океані, контролюючи Тихий океан і океанічний континент, і немає ніякої надії на утримання японської армії та військово-морських сил. Щоб зупинити подальший підйом на захід в Центральну Азію та Близький Схід, союзники вирішили підписати мир з Японією, поступившись територією та військово-морськими базами японців і створити мир між ними. Святкування по цілій Імперії продовжується, і відновлення континенту починається, поки ми говоримо, але вже є сумніви щодо того, чи цей світ продовжуватиметься. Сполучені Штати залишаються світовою супердержавою і вкрай ворожим японцям, а військові витрати залишаються високими, а майбутнє Імперії залежатиме від того, наскільки добре вона зможе інтегрувати свої нові території і зміцнити їх."
  afo_news.11.a:0 "На славу Імперії!"
  afo_news.11.b:0 "Дуже тривожна ситуація"
  afo_news.11.c:0 "Як непередбачено"

  afo_news.12.t:0 "Перемога союзників на Тихому океані"
  afo_news.12.d:0 "Війна на Тихому океані закінчилась з капітуляцією японців, і Імператор Хірохіто підписав безмовну капітуляцію з союзними силами і наказав припинити усі воєнні операції на території Японської імперії. Однак капітуляція не була прийнята по цілій країні: деякі рішучі пункти відмовилися здатися, а імператорський палац на короткий час навіть зробив спробу повстання.\nОднак США послали тисячі військових солдатів до Токіо та інших Японії, щоб запобігти організованому опору і початок процесу відновлення та дерадіказації Японії. Більшість Східної Азії є союзниками, які створюють відчуття стабільності в регіоні, але ще невідомо, як Китай та Радянський Союз відреагують на поразку Японії."
  afo_news.12.a:0 "Ми боролися до кінця"
  afo_news.12.b:0 "Перемога над Японією!"
  afo_news.12.c:0 "Чудова перемога"

  afo_news.13.t:0 "Перемога Осі в Європі"
  afo_news.13.d:0 "Осі торжествують в Європі, а союзників вигнали, а Ради зазнали поразки, одна перемога за іншою німецька військова машина довела, що може перемогти, незважаючи на всі шанси. Без надії на якесь важливе протистояння Сполучені Штати вирішили підписати білий світ з Німецьким рейхом, відмовившись від своїх союзників в Європі і реорганізувавши те, що залишилося в Америці. \nHitler про тисячолітній рейх тепер бачить світло, але розмови про третю світову війну - це не чутки. Без сумніву, США і Німеччина залишаються в стані підвищеної бойової готовності і вкрай ворожі один до одного, ми побачимо в найближчі кілька років, чи буде Німеччина продовжувати бути сильною або вибухне в громадянська війна, рушійна спрага влади, або союзники повернуться так чи інакше."
  afo_news.13.a:0 "Ми приймаємо тільки остаточну перемогу!"
  afo_news.13.b:0 "Жахливий результат"
  afo_news.13.c:0 "Дивовижна перемога"

  afo_news.14.t:0 "Союзна перемога в Європі"
  afo_news.14.d:0 "Війна в Європі після капітуляції Німеччини та Італії майже закінчилась, і Європа стоїть серед цілковитого спустошення та нового розриву між двома супердержавами світу. Території, що перебувають під контролем Радянського Союзу, платять високу ціну, і мало надії на їхню свободу, а райони, які перебувають під контролем союзників, залишаються у повному спустошенні, так і не видужаючи від великої війни Вони залежатимуть від необхідної допомоги США. Це виявляє кінець фашизму в Європі, і хоча це є причиною для великого святкування, експерти та лідери вже розглядають можливість третьої світової війни. Хоч би яким було майбутнє, одна є ключовим, союзники радіють, але попереду ще багато доріг."
  afo_news.14.a:0 "Перемога!"
  afo_news.14.b:0 "Велика перемога Родини!"
  afo_news.14.c:0 "Виграна перемога"

  afo_news.15.t:0 "Італія підписує перемир’я"
  afo_news.15.d:0 "Після катастрофічних втрат території та людей Італія скинула Муссоліні і підписала перемир'я з союзниками, поклавши кінець війні за італійців. Північна Африка залишається в руках союзників, а Італія знаходиться під частковою окупацією союзників до закінчення війни."
  afo_news.15.a:0 "Зрадники!"
  afo_news.15.b:0 "Велика перемога для нас"
  afo_news.15.c:0 "Ми забезпечили своє життя"
  afo_news.15.e:0 "Великий удар за альянсу Осі"

  afo_news.16.t:0 "Кінець Зимової війни"
  afo_news.16.d:0 "Після захоплення міста Ленінград фінською армією уряд змусив Раду підписати мирну угоду. Такий катастрофічний результат для Ради не міг бути передречений і є великою перемогою для фінів, яким інші країни не повинні їх недооцінювати."
  afo_news.16.a:0 "Велика перемога!"
  afo_news.16.b:0 "Як це могло статися!"
  afo_news.16.c:0 "Це безпрецедентно"

  afo_news.17.t:0 "[From.GetName] формує північне сяйво"
  afo_news.17.d:0 "Намагаючись стримати іноземну агресію в Скандинавії, [From.GetName] Він робить політичні кроки, щоб створити новий альянс в регіоні. [From.GetFactionName], за словами [From.GetLeader], гарантує захист всіх скандинавських народів від іноземної агресії."
  afo_news.17.a:0 "Ми будемо сильними"
  afo_news.17.b:0 "Сподіваймося, що їхні інтереси не суперечать нашим."
  afo_news.17.c:0 "Це може викликати тривогу."

  afo_news.18.t:0 "Фінляндія поступила Аландські острови"
  afo_news.18.d:0 "Щоб поліпшити стосунки зі Швецією, Фінляндія вирішила відступити на Аландські острови, поклавши край цьому спірному питанні. Це, без сумніву, сприятиме розширенню співпраці між двома країнами у цивільних і, можливо, військових справах."
  afo_news.18.a:0 "Для більшого блага Фінляндії"
  afo_news.18.b:0 "Це гарний результат."
  afo_news.18.c:0 "Цікавий результат"

  afo_news.19.t:0 "Фінляндія охоплена громадянською війною!"
  afo_news.19.d:0 "Розколота комуністична фракція у Фінляндії вирушила до Гельсінкі і захопила столицю після багатьох сутичок, тепер це переросло в повномасштабну громадянську війну, яка почалася Другу громадянську війну в Іноземні аналітики вважають, що комуністи повільно поширювали невдоволення у Фінляндії, дестабілізуючи країну і дозволяючи їм таємно привозити людей і зброю в очікуванні поглинання. Час покаже, хто виграє."
  afo_news.19.a:0 "За велику Фінляндію!"
  afo_news.19.b:0 "Наші товариші піднімаються!"
  afo_news.19.c:0 "Комуністична загроза"
  afo_news.19.e:0 "Це викликає занепокоєння"

  afo_news.20.t:0 "[SIK.GetName] анексистенно!"
  afo_news.20.d:0 "Міністр закордонних справ Росії оголосив сьогодні про об’єднання Монгольської території в Радянський Союз Угода. Монголи, здавалося, були дуже щасливі святкуванням об’єднання, хоча за ними пильно стежили Радянські гвардійці."
  afo_news.20.a:0 "Синки-ваа?"
  afo_news.20.b:0 "Слава Радянському Союзу!"

  afo_news.21.t:0 "[SIK.GetName] прийняте в державу [SOV.GetName]!"
  afo_news.21.d:0 "Компанія [SOV.GetName] Позначала [SIK.GetName] новий учасник: з’єднання Монголії на сході стає дедалі більшим. [CHI.GetName] і [JAP.GetName]Коли вони привели свою країну в нову еру безпеки."
  afo_news.21.a:0 "Для вільної Східної Азії..."
  afo_news.21.b:0 "Разом, товариші!"

  afo_news.22.t:0 "[SOV.GetName] приєднався до [EST.GetName]"
  afo_news.22.d:0 "Після ультиматум, даному [SOV.GetName], уряд [EST.GetName] Рішення було розв’язане радянським військам в’їжджати в країну після того, як [SOV.GetName] Зажадав у'язниці про взаємну допомогу шляхом створення військових баз в Естонії. Однак тепер повідомлення показують, що авіабази та порти були захоплені радянськими військовими, і що вибори, яких змусили [EST.GetName] було приєднано до [SOV.GetName]Багато спостерігачів співчувають естонським людям у тому, що вони називають ворожим захопленням."
  afo_news.22.a:0 "Насолоджуйтеся завоюванням землі, Ради, будеш наступним."
  afo_news.22.b:0 "Радянська експансія на Захід?"
  afo_news.22.c:0 "Я сподіваюся, що їхні голоси будуть підраховані..."
  afo_news.22.e:0 "Ще одне чудове доповнення до моєї колекції."

  afo_news.23.t:0 "[SOV.GetName] приєднався до [LAT.GetName]"
  afo_news.23.d:0 "Після ультиматум, даному [SOV.GetName], уряд [LAT.GetName] Рішення було розв’язане радянським військам увійти в країну після того, як [SOV.GetName] І все ж, повідомлення показують, що авіабази та порти були захоплені радянськими військовими, а вибори, які були вимушені вибирати [LAT.GetName] було приєднано до [SOV.GetName]Багато спостерігачів співчувають латинським людям у тому, що вони називають ворожим захопленням."
  afo_news.23.a:0 "Насолоджуйтеся завоюванням землі, Ради, будеш наступним."
  afo_news.23.b:0 "Радянська експансія на Захід?"
  afo_news.23.c:0 "Я сподіваюся, що їхні голоси будуть підраховані..."
  afo_news.23.e:0 "Ще одне чудове доповнення до моєї колекції."

  afo_news.24.t:0 "[SOV.GetName] приєднався до [LIT.GetName]"
  afo_news.24.d:0 "Після ультиматум, даному [SOV.GetName], уряд [LIT.GetName] Рішення було розв’язане радянським військам увійти в країну після того, як [SOV.GetName] Зажадав ув'язнення їхнього пакту про взаємодопомоги шляхом створення військових баз у Литві. Однак тепер повідомлення показують, що авіабази та порти були захоплені радянськими військовими, і що вибори, яких змусили [LIT.GetName] було приєднано до [SOV.GetName]Багато спостерігачів співчувають литовському народу в тому, що вони називають ворожим захопленням."
  afo_news.24.a:0 "Насолоджуйтеся завоюванням землі, Ради, будеш наступним."
  afo_news.24.b:0 "Радянська експансія на Захід?"
  afo_news.24.c:0 "Я сподіваюся, що їхні голоси будуть підраховані..."
  afo_news.24.e:0 "Ще одне чудове доповнення до моєї колекції."

  afo_news.25.t:0 "Перемога осі в Росії"
  afo_news.25.d:0 "Просуваючись повз Уралу, Ради лежали розбитими і переможеними, а одна битва за іншою німецька військова машина довела, що може перемогти, незважаючи на всі шанси. Утративши більшу частину своєї промисловості, населення та армії, Рада підписала мирний договір про війну, яку вони не можуть виграти. \nHitler на Сході тепер виконано, але немає сумніву, що Рада використовуватиме цей час, щоб спробувати відновити свої сили для завоювання. Немає сумніву, що нова межа між Радами а Німеччиною залишається в стані підвищеної готовності."
  afo_news.25.a:0 "Ми досягли свого місця життя!"
  afo_news.25.b:0 "Ми будемо мстити..."
  afo_news.25.c:0 "Жахливий результат"
  afo_news.25.e:0 "Дивовижна перемога"

  afo_news.26.t:0 "Вільгельм II повертається до Німецької імперії"
  afo_news.26.desc:0 "У несподіваному заяві вчора вранці німецький уряд офіційно скинув вигнання з Вільгельма II. Пізніше в той же день кортеж старого кайзера пройшов голландську кордон, але з несподіваним поворотом кайзер, як захищав і схвалив свого сина Вільгельма III, щоб зайняти трон замість цього. Кайзер уже присягнувся, що Німеччина повернеться до свого старого величі, але він буде підтримувати з боку, але ще має дізнатися, в якому напрямку піде країна з її дипломатією."
  afo_news.26.a:0 "Хай живе кайф!"
  afo_news.26.b:0 "Повернення до початку століття?"
  afo_news.26.c:0 "Ми зробили свій внесок у його безпеку."
  afo_news.26.d:0 "Ми повинні були сильніше підштовхнути голландців до його екстрадиції!"

  afo_news.27.t:0 "Японське вторгнення в Китай"
  afo_news.27.d:0 "Після інциденту в Оемі та Японія, Китай звинуватили один одного в ескалації зростаючої напруженості в Китаї. Переговори перервалися після того, як Кітаю було поставлено вимоги повністю відмовитися з Шанхая, які були категорично відкинуті після воєнних дій в Пекіні і Тяньцзіні. Шанхай став наступним полем битви в бою, який тепер переріс у повномасштабну війну.\n\n Японія має перевагу у формі краще оснащеної армії та авіації, але час покаже, чи зможе їх зупинити величезний масштаб Китаю."
  afo_news.27.a:0 "Остаточна невдача Ліги Націй"
  afo_news.27.b:0 "Прийшов час повернути собі весь Китай!"
  afo_news.27.c:0 "Прийшов час окупувати весь Китай!"

  afo_news.28.t:0 "Падати Пекіна"
  afo_news.28.d:0 "Після кількох тижнів боїв великамасштабна війна між Китаєм та Японією в Пекіні та Тяньцзіні охопила весь регіон, а Японія відтеснила китайців далі в Габеї.\n\n Маючи абсолютну вищість Японії на морі та в повітрі, китайська армія дійсно могла не зберегти єдності і понести величезні втрати в містах."
  afo_news.28.a:0 "Цікавий результат"
  afo_news.28.b:0 "Ми недооцінили суперника."
  afo_news.28.c:0 "Перемога для багатьох попереду"

  afo_news.29.t:0 "Падіння Шанхая"
  afo_news.29.d:0 "Невдовзі після битв за Пекін і Тяньцзінь китайські та японські війська перестрілили зі стрілкової зброї райони Шанхая. Це протистояння призвело до місяців жорстокої міської війни з важкими втратами з обох боків, і врешті - решт наполегливого китайського опору було недостатньо, щоб стримати японські сили. З двома великими перемогами, озброєними японцями, здається, що в майбутньому війна не закінчиться."
  afo_news.29.a:0 "Цікавий результат"
  afo_news.29.b:0 "Ми недооцінили суперника."
  afo_news.29.c:0 "Вперед, на Нанкін!"

  afo_news.30.t:0 "Падати Уханя"
  afo_news.30.d:0 "Після багатьох жорстоких битв у Ухані та його околицях японські війська зрештою здобули перемогу, перейшовши річку і захопивши головні райони Ухані. Не слід забувати, наскільки це завдає шкоди китайській промисловості та військовим зусиллям, ми можемо лише визнати, що без допомоги Китайських днів ми порахуємо."
  afo_news.30.a:0 "Великий поворот подій"
  afo_news.30.b:0 "Ми повинні копати п'ятки"
  afo_news.30.c:0 "Китай каліка!"

  afo_news.31.t:0 "Перемога японців в Росії"
  afo_news.31.d:0 "Після багатьох років битв японці з тріумфом в Росії, зайнявши весь Далекий Схід, Рада зазнала поразки, і одна з них, японська військова машина, виявила, що може перемогти, незважаючи на шанси. У межах мирної угоди Монголія поступається Сфері Спроводу і новому маріонеточному режиму на Далекому Сході Росії."
  afo_news.31.a:0 "Оглушливий успіх!"
  afo_news.31.b:0 "Ми будемо мстити..."
  afo_news.31.c:0 "Жахливий результат"
  afo_news.31.e:0 "Дивовижна перемога"

  afo_news.32.t:0 "[PRC.GetName]Перемога в китайській громадянській війні"
  afo_news.32.d:0 "Після багатьох років боротьби з китайськими комуністами, вони здобули перемогу в Китаї, і завдяки підтримці його народу, яка повалила національну фракцію, весь континент у кривавій боротьбі. [PRC.GetName], без сумніву, є плани на цей новий Китай, ще має з'ясувати, що це за плани."
  afo_news.32.a:0 "Ми добилися вищої перемоги!"
  afo_news.32.b:0 "Ми будемо мстити..."
  afo_news.32.c:0 "Дивовижний результат"

  afo_news.33.t:0 "Великобританія евакуюється до Канади"
  afo_news.33.d:0 "Після боротьби з німцями за кожен дюйм свого острова уряд і королівська родина Великобританії були змушені евакуюватися. Крім того, один мільйон важливих чоловіків і жінок були евакуйовані через Королівський флот у випадку, коли багато хто називає «Другий Дюнкерк»Незважаючи на зустріч з ворогом на пляжах і боротьбу з ним на посадочних майданчиках, гвардія була відкинута і захоплена. Британський уряд відновлює операції через ставок у Канаді, де вони продовжуватимуть рішуче протистояти ворогам її Величності."
  afo_news.33.a:0 "Ми ніколи не здамося!"
  afo_news.33.b:0 "Ми більше їх не побачимо."
  afo_news.33.c:0 "Падіння імперії"

  afo_news.34.t:0 "Смерть Сталіна"
  afo_news.34.d:0 "Помер великий генеральний секретар Комуністичної партії Радянського Союзу Йосиф Сталін, повідомила сьогодні радянська газета «Правда»Повідомляється, що він помер повільною і болісною смертю від крововиливу в мозок, внутрішнього крововиливу мозку. Хоча він не залишив рамок для претенденції, Презідіум Центрального Комітету Коммуністичної партії Радянського Союзу зустрівся відразу після смерті Сталіна, щоб обговорити колективні кроки вперед для Союзу. Його похорон планується провести на Красній площі, а тіло лежить у мавзолі Леніна."
  afo_news.34.a:0 "Хай живе Сталін, Людина з сталі!"
  afo_news.34.b:0 "Шкода, що це природно"
  afo_news.34.c:0 "Смерть диктатора"

  afo_news.35.t:0 "Смерть Сталіна"
  afo_news.35.d:0 "Помер Генеральний секретар Комуністичної партії Радянського Союзу Йосиф Сталін, невдовзі після їхньої нищівної поразки та принизливого відступу на Урал і в Сибір Йосиф Сталін помер від загадкових обставин. Зараз немає новин про те, чи була це природна, випадкова чи нечесна гра, і багато хто підозрює, що його влада ослабла так само швидко, як і Союз, який він колись очолював. Лише час покаже, чи боротьба за владу над руїнами Радянського Союзу доведе до кінця сталінізму чи комунізму."
  afo_news.35.a:0 "Прийшов час, щоб створити нового лідера."
  afo_news.35.b:0 "Добра їзда"
  afo_news.35.c:0 "Мабуть, це було \"Самогубство\""

  afo_news.36.t:0 "[SOV.GetName] йде у громадянську війну"
  afo_news.36.d:0 "Залишки Об’єднаних Соціалістичних Радянських Республіок назавжди відділилися від явної боротьби за владу після смерті відомого лідера Йосифа Сталіна. Неспроможність CK визначитися з майбутнім Радянського Союзу призвела до того, що внутрішнє коло Сталіна вхопився за владу. «Улюбленим» З часом Нікіта Хрущов зміг заручитися підтримкою реформатора, який намагався змінити багато політичних діячів Сталіна на краще."
  afo_news.36.a:0 "Можливо, ми програли ворога, але ми не програємо."
  afo_news.36.b:0 "Ми успішно відкрили двері, і зараз ми спостерігаємо, як вся гнила структура руйнується."
  afo_news.36.c:0 "Стільки за те, що був «Угода» соціалістичні радянські республіки."

  afo_news.37.t:0 "Об’єднання Польщі та Литви"
  afo_news.37.d:0 "Під час операції поляків Літва проводила референдум про можливість об'єднання двох націй, остаточний підрахунок майже завершений, але вже ясно, що це чудова перемога для табору возз'єднання. Було багато повідомлень про несумісність, фальсифікацію та фальсифікацію на виборах, але ліванські чиновники відкинули ці звинувачення і вже почали реформувати управління в регіональний уряд Польскій державі, хоч цей крок дуже вітається польською громадськістю, однак політичні наслідки референдуму, мабуть, будуть дуже помітні по цілій Європі."
  afo_news.37.a:0 "Браття і кілька зручних хабарів..."
  afo_news.37.b:0 "Це наша сфера впливу!"
  afo_news.37.c:0 "Польща може стати великим гравцем"
  afo_news.37.e:0 "Цікавий результат"

  wtt_news.3.t:0 "Вільгельм II повертається до Німецької імперії"
  wtt_germany.4.b:0 "Краще, щоб він підтримував країну з боку"

  afo_news.38.t:0 "Італійська громадянська війна"
  afo_news.38.d:0 "В Італії вибухнула громадянська війна! і більшість італійських збройних сил відповіла на його заклик до зброї. \n\nНе встановив фортуни на півночі, яка містить велику частину італійської промисловості, і його погляди спрямовані на Рим та Сицилію: Сили та добровольці \n З'явилися під керівництвом короля, вирішивши протистояти і покласти край загрозі Муссоліні раз і назавжди. \n\nВійна за Італію почалася."
  afo_news.38.a:0 "Чи Муссоліні вдасться досягти успіху?"
  afo_news.38.b:0 "До перемоги!"

  afo_news.39.t:0 "Кінець громадянської війни в Італії"
  afo_news.39.d:0 "З капітуляцією останніх позицій фашистів громадянська війна в Італії підійшла до кінця: Республіканці здобули перемогу, і в Італії почалася нова ера. Розлючена війною країна дуже постраждала у боях, але в Італії все ще залишається амбіція, і час покаже, коли Італія зробить наступний крок."
  afo_news.39.a:0 "Місце народження фашизму скверлі"
  afo_news.39.b:0 "Тепер, щоб зцілити нашу країну."

  afo_news.40.t:0 "Протектор Балкан"
  afo_news.40.d:0 "Прагнучи стати панівною державою на Балканах, регіон, відомий своєю невпевненістю, але неймовірно цінний, Італія проголосила себе своїм захисником. Діпломатів з Балкан запросили приєднатися до Італії під єдиним прапором, але ми почекаємо і подивимось, як кожен з них на це відреагує. Протести навколо великих держав також були піддані, оскільки вони, можливо, свідчать про припинення впливу."
  afo_news.40.a:0 "Ми - маяк надії для Балкан!"
  afo_news.40.b:0 "Прийшов час, щоб порох був знайдений"
  afo_news.40.c:0 "Протистояння з Італією неминуче."
  afo_news.40.e:0 "Цікавий хід Італії"
  afo_news.40.f:0 "Чи ми дозволимо Італії уникнути цього?"

  afo_news.41.t:0 "Підписання Бейрутської конференції"
  afo_news.41.d:0 "Бачити спільну перемогу над[GER.GetNameDef]Як неминуче,[beirut_origin.GetNameDef]і[beirut_partner.GetNameDef]Ми прагнемо безпеки в Німеччині.[beirut_origin.GetLeader]і[beirut_partner.GetLeader]Зустрічалися, щоб домовитися про долю[GER.GetNameDef].\n\nДні переговорів призвели до створення нової карти Німеччини, і ця нова Німеччина поділена між Сходом а Заходом з Францією, яка створила маріонетну державу в Рейні.\n\nЗ’ясується, чи це приведе до тривалого миру в Європі."
  afo_news.41.a:0 "Не хваліть за день до вечора."
  afo_news.41.b:0 "Ми вимагали того, що здавалося правильним."
  afo_news.41.c:0 "Давайте швидко завершимо цю війну."
  afo_news.41.e:0 "Це може бути кінець. [GER.GetNameDef]."

  afo_news.42.t:0 "Підвищення імперії Тіоса"
  afo_news.42.desc:0 "Військовий просування [From.GetOldAdjective] Здається абсолютно нездоланним, і ідея, яку багато хто глузував в останні роки - створення нової Римської імперії - тепер здається повністю в межах досяжності італійців. Більшість європейських континентальних держав, які могли б протистояти їм, були практично знищені, залишивши італійців вільними, щоб нав’язати свою волю завойованим народам. На додаток до початку інтеграції того, що вони вже почали називати «Завойовані римські території», Італійський уряд оголосив про відродження Римської імперії, перетворюючи націю в [From.GetNameDef]."
  afo_news.42.a:0 "Виведення бельгійських левів!"
  afo_news.42.b:0 "Подивимося, як довго вони будуть тривати"

  afo_event.1.t:0 "Вітаю!"
  afo_event.1.d:0 "Цей мод частково перебудовує майже всю ігрову механіку, і більшість змін легко зрозуміти, як і у дереві фокусів. Але якщо ви не знайомі з модою, ви можете знайти декілька параметрів нижче, які допоможуть прояснити деякі з прихованих змін у грі. \n\nОсновні зміни:\nЗмінено рельєф і загальний вигляд карти: висічені пагорби під Москвою, ліси на річці Дон і в Україні. Великі міста (Берлін, Париж, Москва, Кіїв та тд) поділені на більше клітин, ніж повітряні та морські регіони."
  afo_event.1.a:0 "Економічні зміни"
  afo_event.1.b:0 "Зміни в технологічному дереві"
  afo_event.1.c:0 "Зміни в бойовій механікі"
  afo_event.1.e:0 "Я готовий до гри"

  afo_event.2.t:0 "Економічні зміни"
  afo_event.2.d:0 "Втома економіки - це нова механіка, вона процінює негативні ефекти на економіку країни і залежить від мілітаризації і мобілізації економіки. Економічні, мобілізаційні та торговельні закони тепер збільшують або зменшують втому економіки, що знижує швидкість будівництва і, зрештою, стабільність і продуктивність фабрики. Економічні закони також дають щотижневий штраф за підтримку війни, щоб боротися з цим, є рішення та міністерства пропаганди. \n\nЕкономічна втому природно при мілітаризації вашої економіки, і це не повинно бути чимось, що ви повинні намагатися зберегти при 0%. Нижче наведено основні способи зменшення економічної втоми:\n\nФокуси\nВійськові облігації (доступні під час війни) \nРішення (більшість з них доступні тільки під час війни)\nЗниження законів (тільки у крайньому випадку, якщо близько 100% втома)\n\nЗалишаючись на частковому мобілізації, ваша втома зросте від 0% до 100% за 24 роки, військова економіка - за 12, а точна мобілізація - за 6. Майте на увазі, що фокуси також може збільшити або зменшити втому."
  afo_event.2.a:0 "& Назад"
  afo_event.2.b:0 "Зміни в індустрії та будівництві"
  afo_event.2.c:0 "Політичні зміни"
  afo_event.2.e:0 "Я готовий до гри"

  afo_event.3.t:0 "Зміни в технологічному дереві"
  afo_event.3.d:0 "Технології у технологічному дереві артилерії простягалися до 1945 року без нових технологій, додавши три танкову середню гармату. Технологія артилерії також може вивчатися з оперенням не більше двох-х років, а технологія танків щороку.\nТехнології станків в промисловості дають бонус у швидкості зростання ефективності виробництва, бонуси давані технологіями на рядок і на ресурси знизилися вдвічі, а Штраф більший за ванілу."
  afo_event.3.a:0 "& Назад"
  afo_event.3.b:0 "Я готовий до гри"

  afo_event.4.t:0 "Зміни в бойовій механікі"
  afo_event.4.d:0 "Бойова ширина змінена на 15 і 20 ( 120 - их рівнинах, 90 - пустища і пагорби, 60 - ліс і місто, 40 - гори, джунглі та болота, 30 - лісові болота (нова місцевість), що робить ідеальну дивизію бойової завширшки 15 і Організація вимагає більше часу для відновлення і великою мірою залежить від погоди, а запас припасів дивізій становить чотири тижні замість 3 днів.\n\n Максимальна кількість авіаносців без штрафу - 12 за бой. Думстаки дуже ослаблені, отже ідеальний розмір флоту тепер становить ~50 кораблів. Кількість машин, які потрібні для кожного тягаря корабля тепер становить 4 замість 3.\n\nСтатити ПТО, ПВО, артилерії, рівень авіації збільшився вдвічі. Перша наземна доктрина доступна лише Німеччині, куди були додані бонуси на стати танки.\n\nПерероблені танки, стати всіх модулів були змінені. За кожну прокачку броні дають по 2% до софт та танків. За кожну прокачку двигуна дається 2% прориву.\n\nУрон штурмів по військах знизився майже вдвічі, і тактики знизилися вдвічі.\n\nДодано велику кількість доп. рота: легень, середніх, важких винищувачів танків, середніх САУ. Для США, ВБ та її домініонів додано доп рота середніх танків."
  afo_event.4.a:0 "& Назад"
  afo_event.4.b:0 "Я готовий до гри"

  afo_event.5.t:0 "Зміни в індустрії та будівництві"
  afo_event.5.d:0 "Виробництво військових і цивільних заводів скоротилося вдвічі (475, стало 2 ) , Але в обмін ви отримуєте приблизно вдвічі більше заводів і фабрик. Для військово-морських верфей і військових заводів потрібно вугілля, а для цивільних заводів ще й 1 одиниць сталі.\n\nНа додаток до цього максимальна кількість цивільних споруд становить 20 для кожного нового будинку, а загальна кількість слотів у одному регіоні - 50.\n\nТакож було додано нові ресурси: боксити, вугілля і залізо, а також 3 нові будівлі.\n\nАлюмінієва фабрика використовує боксити та вугілля для виготовлення алюмінію.\n\nАлюмінієва фабрика з гідроприводом використовує боксити, щоб виробляти алюмінію, але вона дорожча за алюмінієву фабрику.\n\nСталева фабрика використовує залізо та вугілля для виробництва сталі.\n\nІнфраструктура також більше не збільшує кількість сталі та алюмінії, які ви отримуєте від провінції, оскільки вони виробляються тільки на цих заводах.\n\n "
  afo_event.5.a:0 "& Назад"
  afo_event.5.b:0 "Я готовий до гри"

  afo_event.6.t:0 "Політичні зміни"
  afo_event.6.d:0 "Розділ «Міністерства» було додано на вкладку «Правила».\n\nНові доповнення включають:\nМіністерство культури, яке зосереджене на ролі жінок у суспільстві. Він починається з більш орієнтованих на будинок ролей, які дають вам більш високий зріст населення, але ви можете змінити його з великою вартістю або за допомогою фокусів, щоб забезпечити більше бонусів для вашої Наприклад, більш високо рекрутуванне населення і/або продуктивність заводу.\n\nМіністерство оборони зосереджене на військових облігаціях, ви використовуєте їх, щоб зменшити економічну втому. Але до них можна отримати доступ тільки під час воєнних дій, і вони надходять за рахунок ТНП протягом двох років після закінчення війни.\n\nМіністерства пропаганди зосереджені на збільшенні підтримки війни, тому що закони економіки високого рівня вимагають щотижневої військової підтримки, це робиться для того, щоб протидіяти цьому. Кожен рівень забезпечує 0,1% щотижневої військової підтримки і вимагає 0,05 політичної влади в день.\n\nМіністерство праці зосереджене на забезпеченні різних баффів, таких, як стабільність, обсяги виробництва, рекрути і досвід. Для декого потрібен відсоток споживчих товарів, рекрутоване населення чи политу владу.\n\nМіністерство бізнесу - це, по суті, ваша економічна ідеологія, тісно пов'язана з вашою політичною ідеологією. Наприклад, фашисти не можуть використовувати повну приватність, а демократи не можуть дотримуватися ідей націонал-соціалізму. Кожна економічна ідеологія дає різні баффи і дебаффи, які варіюються від збільшення/ум’я стабільності, збільшення/ум’я споживчих товарів, швидкості будівництва, часу дослідження і так далі Далі."
  afo_event.6.a:0 "& Назад"
  afo_event.6.b:0 "Я готовий до гри"

  ss_recruitment_event.1.t:0 "Створення 5.S-Mot.- Division «Wiking»."
  ss_recruitment_event.1.desc:0 "5.SS-Mot.-Division «Wiking» був підрозділом СС серед тридцять вісім дивізій Ваффен-С нацистської Німеччини. У Данії, Норвегії, Швеції, Фінляндії, Естонії, Нідерландах та Бельгії під командуванням німецьких офіцерів, а під час Другої світової війни дивізія служила на Східному фронті. У травні він здався американським військам в Австрії."
  ss_recruitment_event.1.a:0 "Наша армія розширюється"
  ss_recruitment_event.1.b:0 "Набір тільки допоміжних для ОКВ"
  GER_division_wiking_mot_tt:0 "Буде сформовано §YП'яте моторизована дивізія СС «Вікінг»§!."

  ss_recruitment_event.2.t:0 "Створення 6.S-Gebirgs-Div."
  ss_recruitment_event.2.desc:0 "Гірська дивізія СС «Норд» (6. SS-Gebirgs-Division «Норд») Під час Другої світової війни під час Другої світової війни німецький підрозділ Ваффен -С був сформований у лютому 1941 як SS Kampfgruppe Nord (SS Battle Group North). Дивізія була єдиним підрозділом Ваффен-С, який воював за Полярним колом, коли вона була розміщена в Фінляндії та на півночі Росії в період з червня до листопада 1941 року. Вояв у Карелії до перемир’я у вересні 1944 року, після чого залишив Фінляндію, яка брала участь у операції «Норсунд» На початку квітня 1945 року американські війська поблизу Бюдінгена (Німеччина) були знищені в січні 1945 року."
  ss_recruitment_event.2.a:0 "Наша армія розширюється"
  ss_recruitment_event.2.b:0 "Набір тільки допоміжних для ОКВ"
  GER_division_nord_tt:0 "§Y6.SS-Gebirgs-Div. 'Nord'§! створено."

  ss_recruitment_event_22_b_tt:0 "§RВплив СС зростає5Точки./n гнів СС зменшується5очки.§!"

  ss_recruitment_event.27.t:0 "Оновлення 2.S-Verfügungstrappe-Division"
  ss_recruitment_event.27.desc:0 "Наприкінці 1940 року,S-Verfügungstrip-Division було перероблено на 2.S-Mot.-Division «Das Reich»."
  ss_recruitment_event.27.a:0 "Наша армія розширюється"
  SS_DasReich_refit_1_tt:0 "§Y2. SS-Motorisierte-Division 'Das Reich' §! Переозброєно."

  ss_recruitment_event.28.t:0 "Оновлення 1.SS-Motorierte Regt. \"ЛССАХ\""
  ss_recruitment_event.28.desc:0 "У середині 1941 року, після дивовижних дій полку під час вторгнення до Греції, LSSSAH отримав право модернізуватися на повну дивізію."
  ss_recruitment_event.28.a:0 "Наша армія розширюється"
  SS_LSSAH_refit_tt:0 "§Y1. SS-Motorisierte-Division 'LSSAH'§! Переозброєно."

  ss_recruitment_event.29.t:0 "Створення 7.S-Freiw.-Gebirgs-Div."
  ss_recruitment_event.29.desc:0 "Наприкінці 1942 року було створено 7.SS-Freiw.-Gebirgs-Div. «Prinz Eugen» З добровольцями і призовниками Балканського та Volksdeutsche населення, дивізія брала участь у антипартизанських операціях у районі."
  ss_recruitment_event.29.a:0 "Наша армія розширюється"
  SS_recruitment_prinz_eugen_tt:0 "§Y7.SS-Freiw.-Gebirgs-Div. 'Prinz Eugen'§! створено."

  ss_recruitment_event.30.t:0 "Створення 8.SS-Kavall.-Div. «Флоріан Гейєр»"
  ss_recruitment_event.30.desc:0 "У середині 1942 було створено 8.SS-Kavall.-Div. «Флоріан Гейєр» З німцями і Volksdeutschesoldiers, дивізія брала участь в антипартизанських операціях в Радянському Союзі."
  ss_recruitment_event.30.a:0 "Наша армія розширюється"
  SS_recruitment_florian_geyer_tt:0 "§Y8.SS-Kavall.-Div. 'Florian Geyer'§! створено."

  ss_recruitment_event.31.t:0 "Створення 9.S-Panzergrenadier-Div."
  ss_recruitment_event.31.desc:0 "У грудні 1942, 9.S-Panzergrenadier-Div. «Hohenstaufen» створено з призовниками з Рейхської робочої служби. Гогенштауфен брав участь у рельєфі німецьких військ у Каменці-Подольській кишені, Нормандських боях, операції Ринковий сад, Арденського наступу і операції Весняне пробудження."
  ss_recruitment_event.31.a:0 "Наша армія розширюється"
  SS_recruitment_Hohenstaufen_tt:0 "§Y9.SS-Panzergrenadier-Div. 'Hohenstaufen'§! створено."

  ss_recruitment_event.32.t:0 "Створення 10.S-Panzer-Division «Frundsberg»"
  ss_recruitment_event.32.desc:0 "На початку 1943, 10.S-Panzergrenadier-Div. 'Frundsberg' було створено з призовниками з Рейхської робочої служби, але він не був завершено до початку 1944. Перші бої дивізії провела на Україні в квітні 1944. Потім підрозділ було перекинуто на захід, де він бився з союзниками у Франції та Арнемі, і дивізія була переміщена в Померанію, потім воювала на південний схід від Берліна в районі Лужинці до кінця війни."
  ss_recruitment_event.32.a:0 "Наша армія розширюється"
  SS_recruitment_Frundsberg_tt:0 "Сформовано §Y10-я танкова дивізія СС «Фрундсберг»§!."

  ss_recruitment_event.33.t:0 "Створення 11.S-Panzergrenadier-Div."
  ss_recruitment_event.33.desc:0 "У середині 1943 було створено 11:S-Panzergrenadier-Div. «Нордленд» З добровольцями з Скандинавії та Угорщини, а також деякими призовниками, він бачив дії, як частина групи армій півночі, у незалежній державі Хорватії та на Східному фронті під час Другої світової війни."
  ss_recruitment_event.33.a:0 "Наша армія розширюється"
  SS_recruitment_Nordland_tt:0 "§Y11.SS-Panzergrenadier-Div. 'Nordland' §! створено."

  ss_recruitment_event.34.t:0 "Створення 12.S-Panzer-Division «Гітлерюгенд»"
  ss_recruitment_event.34.desc:0 "У середині 1943 було створено 12.SS-Panzer-Division «Hitlerjugend» з добровольцями і призовниками з Гітлерюгенда, в той час як старші офіцери і офіцери були з інших дивізій Ваффен-С. Дивізія зробила кілька військових злочинів по дорозі в Нормандію і під час перших битв у Нормандії, включаючи різанину в Аскці та Арденському абатстві. Вперше він побачив дії на 7 у червні 1944 в рамках німецьких оборонних операцій в Кані і поніс великі втрати під час битви під Фалезською кишенюм. У грудні 1944 дивізія була виконана проти армії США в Арденському наступі, і після невдачі операції, яка отримала назву Бітва при Балзі, дивізія була відправлена до Угорщини для участі в боях навколо Будапешта. Зрештою дивізія відступила в Австрію і здалася армії США 7th на 8 May 1945, після війни кілька членів дивізії, у тому числі її командир Курт Мейер, були засуджені за воєнні злочини."
  ss_recruitment_event.34.a:0 "Наша армія розширюється"
  SS_recruitment_Hitlerjugend_tt:0 "Сформовано §Y12-я танкова дивізія СС «Гітлерюгенд»§!."

  ss_recruitment_event.35.t:0 "Створення 13.S-Waffen-Gebirgs-Div. \"Handschar\" (кроатише Nr. 1)."
  ss_recruitment_event.35.desc:0 "З березня до грудня1944, The13S-Waffen-Gebirgs-Div. \"Handschar\" (kroatische Nr.1) боровся проти повстанської кампанії проти переможених комуністами югославських партизанських сил у незалежному державі Хорватія, фашистському маріонеточних державах Німеччини, яке захопило майже всю сучасну Хорватію, всю сучасну Боснію і Герцеговину, а також частини Сербії. Він отримав назву Handschar після того, як місцевий бойовий ніж або меч носили османські поліцейські протягом століть, коли регіон був частиною Османської імперії. Це була перша ненімецька дивізія Ваффен-С, і її формування позначило розширення Бетфен-С у багатонаціональну військову силу. Він походить з боснійських мусульман (етнічних босніців) з деякими католицькими хорватськими солдатами і переважно німецькими і югославськими Volksdeutsche (етичними німецькими) офіцерами і унтер-офіцерами, він і Адольф Гітлер, і хорватський лідер Анті Павелічу, на короткий час билися в районі Сирмії на північ від річки Сави, перш ніж перейти на північний схід. Після перетину Шеви він встановив позначену «зону безпеки» в північно-східній Боснії між річками Савина, Босна, Дрина і Словача. Він також кілька разів воював за межами зони безпеки і заслужив репутацію жорстокості і дикості не тільки під час воєнних дій, але й в результаті звірств, скоєних проти сербських і єврейських цивільних У кінці1944-х дивізії було тимчасово перекинуто в район Загреба, після чого ненімецькі члени почали у великій кількості дезертирувати. Протягом зими1944-45 він був відправлений в регіон Баранья, де він воював проти Червоної Армії і болгар по всій південній Угорщині, відступаючи через ряд оборонних ліній, поки вони не опинилися всередині кордону Рейха. Більшість позосталих боснійських мусульман пішли в цей момент і спробували повернутися до Боснії, а решта відступила на захід, сподіваючись здатися західним союзникам. Більшість позосталих уцілілих стали військовополоненими британської армії."
  ss_recruitment_event.35.a:0 "Наша армія розширюється"
  SS_recruitment_Handschar_tt:0 "Сформовано §Y13-а гірськопіхотна дивізія СС «Ганджар» (хорватська No 1)§!."

  ss_recruitment_event.36.t:0 "Створення 14. Waffen- Grenadier-Div. bei der SS (Galizische SS-Division Nr. 1)"
  ss_recruitment_event.36.desc:0 "14. Waffen-grenadier-Div. bei der SS (Galizische SS-Division Nr. 1) - німецьке військове формування Другої світової війни, що складається переважно з військових добровольців з українського етнічного походження з області Галиції, пізніше з деякими словниками і чеськими. Сформований в 1943, він був значною мірою зруйнований в битві при Броді, реформований і бачив дію в Словаччині, Югославії та Австрії, перш ніж був перейменований на першу дивізію української Національної армії і Здатись західним союзникам 10 May 1945."
  ss_recruitment_event.36.a:0 "Наша армія розширюється"
  SS_recruitment_14_tt:0 "§Y14. Створений Waffen-grenadier-Div. bei der SS (galizische SS-Division Nr. 1)§!."

  ss_recruitment_event.37.t:0 "Створення 15. Waffen-grenadier-Div. bei der SS (lettische Nr. 1)"
  ss_recruitment_event.37.desc:0 "15. Waffen-grenadier-Div. bei der SS (lettische Nr. 1) - піхотна дивізія Ваффен-С під час Другої світової війни. Він був сформований в лютому 1943, і разом зі своїм спорідненим підрозділом, 19th Waffen Grenadier Division SS (2nd Latvian) заснував латинський легіон."
  ss_recruitment_event.37.a:0 "Наша армія розширюється"
  SS_recruitment_15_tt:0 "§Y15. Створено Waffen-grenadier-Div. bei der SS (lettische Nr. 1)§!."

  ss_recruitment_event.38.t:0 "Створює 16.S-Panzergrenadier-Div."
  ss_recruitment_event.38.desc:0 "У листопаді 1943 року, коли в Штурмбрігаду Рейсфюрера СС було додано новий блок, який використовували для створення нових дивізій. Kampfgruppe«Військова група») З дивізії билася на плацдармені Анціо, тоді як решта дивізії взяла участь у окупації Угорщини, який воював в Італії як дивізія з травня 1944, аж поки не був перекладений до Угорщини в лютому 1945 року. У червні 27, 1944, командний пункт 16th SS-Panzergrenadiers у Сан-Вінченцо, Італія була захоплена американським батальйоном 1st, піхотою 133rd, піхотною дивізією 34th (Red Bulls). Командний пункт був квартиру в центрі міста, яка була захоплена; коли власники повернулися в свою квартиру, вони знайшли підписаний великий шкіряний хендатлас. Наприкінці літа 1944, частина цієї дивізії, SS-Panzer-Aufklguangsabteilung 16 (розвідувальний батальйон 16), під командуванням майора Вальтера Редера, була виведена з бою з американським армією 5th, а потім наступала на Готічна лінія, щоб мати справу з італійським комуністичним загоном Бриґадою Червоної Зірки (Brigata Stella Rossa). Діючи з гірського комплексу, зосередженого на Монте-Солі, на південний схід від міста Марзаботто, Червона Зірка була помічена як значна загроза німецькому тилу, як з точки зору скорочення зв'язку, так і Майор Редер виконав своє завдання і знищив цю партизанську силу. Kampfgruppe навчально-замінного батальйона 16th базувався в Арнемі і брав участь у операції Market Garden. Дивізія здалася британським військам під Клагенфуртом, Австрія, наприкінці війни."
  ss_recruitment_event.38.a:0 "Наша армія розширюється"
  SS_recruitment_Reichsfuhrer_SS_tt:0 "Буде сформовано §Y16-я моторизована дивізія СС «Рейхсфюрер СС»§!."

  ss_recruitment_event.39.t:0 "Створення 17.S-Panzergrenadier-Div. «Гец фон Берліхінген»"
  ss_recruitment_event.39.desc:0 "Дивізія була піднята близько Пуатьє, Франція, як Panzer-Grenadier-Division 'Ghotz von Berlichingen" в жовтні. Вона була сформована з нуля, і більшість її перших персоналу складалися з запасних частин та призовників, багато з яких були румунськими німці та французькі добровольці. Дивізія отримала почесне ім'я Гетц фон Берліхінген, обберштурмбанфюрер Отто Бінге керував формуванням дивізії, а нещодавно призначений бригадефюрер Вернер Остендорф прийняв командування в січні 1944 року. Гец фон Берліхінген був поміщений під армійський корпус LXXXX, частина Герда фон Рундштедта Heeresgruppe D. У рамках плану нумерації всіх названих дивізій СС на початку 1944 дивізія була перейменована в 17th SS-Panzer-Grenadier-Division «Götz von Berlichingen»У лютому 1944 ще не було автомобілів, і того ж року за наказом армійського корпусу LXXXX дивізія почала закруглювати французькі машини, намагаючись завершити мобілізацію. До березня більшість великих бойових форм були повністю моторизовані, хоча два з шести піхотних батальйони все ще були на велосипедах. У червні 1 в червні Von Berlichingen опинився в Туарі у Франції, без танків (хоча екіпажі були повністю оснащені штурмовими знаряддями 42 Sturmgeschütz IV), всього за кілька місяців навчання і нижче сили в офіцерах і офіцерах."
  ss_recruitment_event.39.a:0 "Наша армія розширюється"
  SS_recruitment_Berlichingen_tt:0 "§Y17.SS-Panzergrenadier-Div. 'Götz von Berlichingen'§! створено."

  ss_recruitment_event.40.t:0 "Створення 18.S-Panzergrenadier-Div."
  ss_recruitment_event.40.desc:0 "18.SS-Freiwilligen Panzergrenadier-Division 'Horst Wessel' була сформована в 1944 навколо кадрів з піхотної бригади 1st SS і включає в основному етнічних німців (Volksdeutsche) з Угорщини. Батальйон 1st, що складається з 1000 бійців, був прикріплений до дивізії СС Горста Весселя і відправлений у Галицію. «Задній охорони», Поки не був відправлений на Східний фронт, за винятком одного полку, який боровся зі Словачим національним повстанням у серпні. Пізніше він воював як одне ціле в Угорщині, а потім у Чехословаччині, де був знищений. Дивізія була названа на честь члена СА Горста Весселя, відомого як автор тексту гімну нацистської партії Хорст-Вессель-Лід і прославленого нацистським режимом як мученик ранніх років партії."
  ss_recruitment_event.40.a:0 "Наша армія розширюється"
  SS_recruitment_Wessel_tt:0 "§Y18.SS-Panzergrenadier-Div. 'Horst Wessel'§! створено."

  ss_recruitment_event.41.t:0 "Створення 19. Waffen-grenadier-Div. bei der SS (lettische Nr. 2)"
  ss_recruitment_event.41.desc:0 "19. Waffen-Grenadier-Div. bei der SS (lettische Nr. 2) — піхотна дивізія Ваффен-С під час Другої світової війни. Це була друга латинська дивізія, сформована в січні 1944, після її сестринського підрозділу, 15th Waffen Grenadier Division SS (1st Latvian), з яким вона сформувала латвійський легіон. Під кінець війни його оточували в Курляндській кишені, де він здався Червоній Армії."
  ss_recruitment_event.41.a:0 "Наша армія розширюється"
  SS_recruitment_19_tt:0 "§Y19. Створений Waffen-grenadier-Div. bei der SS (lettische Nr. 2)§!."

  ss_recruitment_event.42.t:0 "Створення 20. Waffen-grenadier- Div. der SS (estnische Nr. 1)"
  ss_recruitment_event.42.desc:0 "20. Waffen-grenadier-Div. der SS (estnische Nr. 1) була іноземною піхотною дивізією Ваффен-С, озброєного відділення німецької нацистської партії, яка служила разом, але ніколи формально не була частиною вертахту в Згідно з деякими джерелами, протягом Другої світової війни дивізія була під спільним командуванням рейхсфюрера СС Генріха Гімммлера, але не була невід’ємною частиною Schutzstaffel (SSS). Він був офіційно активований на 24 в січні 1944, і багато його солдатів були членами естонського легіону і / або естонської добровольчої бригади 3rd, яка билася в складі німецьких військ з серпня 1942 і жовтня У 1943 році обидва попередні формування вивели свій власний склад з окупованих естонськими окупантами, і невдовзі після офіційної активації німецькі окупаційні органи влади оголосили про широке призов до Естонії. Дивізія була сформована в Естонії в естонської добровольчої бригади СС 3rd і спочатку була відома як естонська добровольча дивізія СС 20th."
  ss_recruitment_event.42.a:0 "Наша армія розширюється"
  SS_recruitment_20_tt:0 "§Y20. Створено Waffen-grenadier-Div. der SS (estnische Nr. 1)§!."

  ss_recruitment_event.43.t:0 "Оновлює моторизовані дивізії"
  ss_recruitment_event.43.desc:0 "У середині 1942 «LSSAH», «Das Reich», «Totenkopf», «Polizei» і «Wiking» Було переобладнуто, від моторизованих і піхотних дивізій до механізованих. Проте, на відміну від їх еквіваленту Хіра, механізовані дивізії СС мали повний танковий полк, що робило їх еквівалентними танковим дивізією."
  ss_recruitment_event.43.a:0 "Наша армія розширюється"
  SS_motorized_and_inf_to_mechanized_refit_1_tt:0 "§YМодифікації «LSSAH», «Das Reich», «Totenkopf», «Polizei» і «Wiking» переощені.§!"


  ss_recruitment_event.44.t:0 "Переобладнання механізованих підрозділів"
  ss_recruitment_event.44.desc:0 "Під кінець 1943 р., дивізії переобладнали «LSSAH», «Das Reich», «Totenkopf», «Wiking» і «Hohenstaufen», Від механізованих до бронованих."
  ss_recruitment_event.44.a:0 "Наша армія розширюється"
  SS_mechanized_to_panzer_refit_1_tt:0 "§YМодифікації «LSSAH», «Das Reich», «Totenkopf», «Wiking» і «Hohenstaufen» переощені.§!"

  ss_recruitment_event.45.t:0 "Угода Гімлера-Шпеєра"
  ss_recruitment_event.45.desc:0 "У 1942 році, після призначення Альберта Шпеєра, Гімлер запропонував, щоб від 5 до 8 відсотків німецького воєнного виробництва було переправлено Ваффен-С в обмін на лояльних робітників СС для Німеччини. Ви можете або вирішити віддати 0%, 5% або 10% вашого заводського виробництва SS. Залежно від вашого вибору майбутні дивізії СС будуть з'являтися з відповідно до 0%, 40% або 80% безкоштовного спорядження. Але чим більше ви віддасте СС, тим менше це оцінить ОКВ."
  ss_recruitment_event.45.a:0 "Відмовити що-небудь давати СС!"
  ss_recruitment_event.45.b:0 "Признається віддати 8% виробництва СС"
  ss_recruitment_event.45.c:0 "Признається віддати 16% виробництва СС"

  ss_recruitment_event.46.t:0 "Створює 21.S-Waffen-Gebirgs-Div. der SS 'Skanderberg' (albanische Nr. 1)"
  ss_recruitment_event.46.desc:0 "Ваффененська гірська дивізія С Скандербіг (1st албанський) була німецькою гірською дивізією Ваффен-С, озброєного крила німецької нацистської партії, яка служила разом, але ніколи формально не була частиною Вермахту під час Другої світової війни. Дивізія була розроблена навколо ядра етнічного албанського батальйону, який ненадовго зіткнувся з югославськими партизанами у східній Боснії в складі 13th Waffen Mountain Division SS Handschar (1st Croatian). Албанський офіцер і унтер-офіцери, якому дали назву Скандерсь після середньовічного лорда Джорджа Кастріоті Скандербега, який захищав територію Албанії проти Османської імперії протягом понад двох десятиліть у 15th столітті."
  ss_recruitment_event.46.a:0 "Буде сформовано §Y21-а гірськопіхотна дивізія СС «Скандербіг» (албанська No 1)§!."

  ss_recruitment_event.47.t:0 "Створення 22.S-Freiw.-Kavall.-Div."
  ss_recruitment_event.47.desc:0 "Добровольська кавалерійська дивізія СС 22nd (німецька, 22. SS-Freiwillen Kavallerie-Division) була німецькою кавалерійською дивізією Ваффен-С, яка діяла на Східному фронті під час Другої світової війни. Дивізія складалася в основному з угорської армії Volksdeutsche призовників, які були передані в Ваффен-С після угоди між Німеччиною і Венгрією. У публікаціях ім’я Марії Терезії широко відоме, але не знайдено жодних доказів, які б підтверджували цю назву."
  ss_recruitment_event.47.a:0 "§Y22.SS-Freiw.-Kavall.-Div. 'Maria Theresia' §! створено."

  ss_recruitment_event.48.t:0 "Створення 24. Waffen-Gebirgs-Div. 'Karstjeger' / KAMа"
  ss_recruitment_event.48.desc:0 "Ваффенська гірська дивізія СС «Карстягер» була німецькою гірськопіхотною дивізією Ваффен-С, озброєним крилом німецької нацистської партії, яке служило разом, але ніколи формально не було частиною Вермахту під час Другої світової війни. Названий Karstjhager«Мисливець на Карста»Він був одним з підрозділів 38, розділених Waffen-SSS, сформований на 18 в липні 1944 з добровольчої батальйони СС «Карствер», Його номінальна кількість була не більш ніж теоретичною, і дивізія незабаром була скорочена до бригади СС «Ваффен-Маунтін». Протягом свого існування як батальйон, дивізії та бригади він брав участь у боротьбі з партизанами на Карстовому плато на кордоні Югославії, Італії та Австрії, а гірнича територія вимагала Заснована в 1942 році як компанія, « Volksdeutsche » (етнічні німці / австрійці) з Югославії та Південної Тірольської провінції Італії. Незважаючи на антипартизанські операції, він також бачив дії після капітуляції Італії, коли він рушив, щоб роззброювати італійські війська в Тарвісіо і захистити етнічні німецькі Крім того, під кінець війни він успішно боровся, щоб тримати проходи в Австрії відкритими, дозволяючи німецьким підрозділам втекти з Балкан і здатися британським силам. Залишки підрозділу стали одними з останніх німців, які склали зброю, коли вони здалися британській танковій дивізії 6th на 9 May 1945. Спільне італо-німецьке дослідження включало поділ у 23 окремих злочинів, пов'язаних з вбивством людей 277 між італійською капітуляцією і кінцем війни."
  ss_recruitment_event.48.a:0 "§Y24. Створено Waffen-Gebirgs-Div. 'Karstjeger' / KAMа§!."

  ss_recruitment_event.49.t:0 "Створення 25. Waffen-grenadier-Div. der SS 'Hunyadi'"
  ss_recruitment_event.49.desc:0 "25th Waffen Grenadier Division SS «Hunyadi» (st Hungarian) була коротковічною піхотною дивізією Waffen-SS, озброєного відділення німецької нацистської партії, яка служила разом, але ніколи формально не була частиною вермахту під час Другої світової війни. У листопаді 1944 року, після повалення Німеччини угорською режимом Міклоша Горті, вона складалася переважно з армії, взятих з дивізії Королівської угорської армії 13th Honvéd. Вона ніколи не була належно сформована, кваліфікована або обладнана, і після евакуації з виправного табору перед наступною радянською Красною армією, вона здалася армії Сполучених Штатів Америки в Австрії в травні."
  ss_recruitment_event.49.a:0 "§Y25. Створений Waffen-grenadier-Div. der SS 'Hunyadi'§!."

  ss_recruitment_event.50.t:0 "Створення 26. Waffen-grenadier- Div. der SS 'Hungaria' (ungrische Nr. 2)"
  ss_recruitment_event.50.desc:0 "26th Waffen Grenadier Division of the SS (2nd Hungarian) (німецька, 26). Waffen-grenadier-Division der SS (ungarische Nr.2, угорська, 26. Waffen-SS Grántos Hadosztály (2. magyar), була недовговічною піхотною дивізією Waffen-SS, озброєного відділення німецької нацистської партії, яка служила разом, але ніколи формально не була частиною вертахту під час Друга світова війна. Заснована в листопаді 1944 після повалення Німеччини угорською режимом Міклоша Горті, вона ніколи не була належним чином сформована, підготовлена або оснащена, і після евакуації зі свого тренувального табору перед лицем У травні 1945 року в Австрії розпочалася радянська Червона армія."
  ss_recruitment_event.50.a:0 "§Y26. Створений Waffen-grenadier-Div. der SS 'Hungaria' (ungrische Nr. 2)§!."

  ss_recruitment_event.51.t:0 "Створення бригади «Ваффен-Штурм» СС «Рона»"
  ss_recruitment_event.51.desc:0 "29th Waffen Grenadier Division of the SS «RONA» (також відома як Waffen-Sturm-Brigade der SS RONA, і Kaminski Brigade) була колабораціоністським формуванням, складеним з радянських громадян з району автономії Локот в зайнятих Осіллю області РСФСР у Радянському Союзі під час німецької-радянської війни 1941-45, до серпня 27, 1944, виявивши бригаду занадто недисциплінованою і ненадійною, німецькі командири вивели її з Варшави. Підрозділ було відправлено в Словаччину і розвернуто проти словацьких партизан. Після кінця жовтня 1944 бригада була розформована, а частина російської визволитної армії — генерала Андрея Власова."
  ss_recruitment_event.51.a:0 "Створено §YWaffen-Sturm-Brigade der SS 'RONA'§!."

  ss_recruitment_event.52.t:0 "Створює 29. Waffen- Grenadier-Div. der SS 'Italienche Nr. 1"
  ss_recruitment_event.52.desc:0 "29th Waffen Grenadier Division of the SS (1st Italiana) також Le SS Italiana (німецька, 29). Waffen-grenadier-Division der SS (italienische Nr. 1) — формування СС нацистської Німеччини під час Другої світової війни. Спочатку його було створено в маріонетській італійській соціальній республіці 1943 року як італійський легіон, пізніше перейменовано на бригаду, і це було оновлено до 10 лютого 1945 року."
  ss_recruitment_event.52.a:0 "§Y29. Створено Waffen- Grenadier-Div. der SS 'Italienische Nr. 1§!."

  ss_recruitment_event.53.t:0 "30-я Гренадерська дивізія військ СС (русська No 2)"
  ss_recruitment_event.53.desc:0 "The30Гренадерська дивізія СС (німецька,30. Waffen-Grenadierdiverision der SS)[1]Це була короткочасна німецька піхотна дивізія Ваффен СС, сформована в основному з білоруського, російського і українського особистого складу бригади «Шутцманшафт» в серпні.1944Варшава в Генеральному уряді.[2]Дивізія була перекинута на південний схід Франції до середини серпня.1944Францусські сили внутрішніх справ. Виступ дивізії в бою був поганим, і два батальйона збунтувалися, вбили своїх німецьких лідерів і перейшли до FFI, інші війська дивізії перетнули швейцарський кордон і були інтерновані. Пізніше частину особистого складу дивізії було перекладено до Російської Вільної Армії, а інші були збережені для формування піхотної бригади СС «Біла Русіна» з січня.1945."
  ss_recruitment_event.53.a:0 "30.Waffen-Grenadier-Div. der SS 'Russische Nr. 2'§! створено."

  ss_recruitment_event.54.t:0 "31.SS-Freiwilligen-Grenadier-Division «Батка»"
  ss_recruitment_event.54.desc:0 "Волонтерська греконадерська дивізія СС 31st (німецька, 31. SS-Freiwillen-grenadier-Division) була підрозділом німецьких збройних сил під час Другої світової війни. Він був сформований з угорського Volksdeutsche (етнічні німці), в основному з Бачки у вересні 1944 року, до ньябрю 1944 діяв на Угорському фронті. У січні 1945 року було відправлено в Австрію і перетворено на дивізію 45 з двома батальйонами в кожну полицю і лише трьома взводами в кожній роті. Потім дивізія приєдналася до армії 17th у Сілезії, де вона була оточена Червоною Армією; вона здалася близько Градец Кралове в травні 1945 року."
  ss_recruitment_event.54.a:0 "Створений 31.SS-Freiwilligen-Grenadier-Division «Batschka» §!."

  ss_recruitment_event.55.t:0 "Моторизована дивізія 'Велика Німеччина'"
  ss_recruitment_event.55.desc:0 "Дивізія « Велика Німеччина » — тактичне з’єднання сухопутних військ нацистської Німеччини — брала участь у Другій світовій війні. За період свого існування на основі караульного батальйону було розгорнуто в танковий корпус. Поряд з деякими з'єднаннями Вермахту і військ СС, "Велика Німеччина" була однією з найбільш боєздатних військових сил нацистської Німеччини."
  ss_recruitment_event.55.a:0 "Моторизована дивізія 'Велика Німеччина'§! Успадкована."

  ss_recruitment_event.56.t:0 "Танкова дивізія люфтваффі «Герман Герінг»"
  ss_recruitment_event.56.desc:0 "дивізія люфтваффі «Герман Герінг» - елітне тактичне з'єднання військово-повітряних сил нацистської Німеччини, особисто підкорялося рейхсмаршалу Герінгу. Створений на базі поліцейського батальйону, за період свого існування було розгорнуто в парашутно-танковий корпус, наряду з рядом відбірних форм СС і Вермахту, дивізія (в кінці - корпус) «Герман Герінг» була одним з найбільш боєздатних зв'язків у збройних силах нацистської Німеччини."
  ss_recruitment_event.56.a:0 "Танкова дивізія люфтваффі «Герман Герінг»§! Успадкована."

  ss_recruitment_event.57.t:0 "Зондер Командувача СС під командуванням Дірлеванґера"
  ss_recruitment_event.57.desc:0 "Зондер Командувача СС під командуванням Дірлеванґера, карайного підрозділу СС під командуванням Оскара Дірлеванґера, комплектували з ув’язнених Німеччини, концентраційних таборів та військових в’язниць СС. Особливий статус підрозділу відзначався в тому, що з січня 1943 року Генріх Гімлера на петлях замість руну СС її члени носили зображення скріплених рушниць і гранат."
  ss_recruitment_event.57.a:0 "Зондер Командувача СС під командуванням Дірлеванґера§! Успадкована."
  
  ss_recruitment_event.58.t:0 "32.SS-Freiwilligen-Grenadier-Division «30. Januar»"
  ss_recruitment_event.58.desc:0 "Офіційно про створення дивізії було оголошено 30 січня 1945 року; створення дивізії проходило на полігоні Курмарка, а Нова дивізія була, по суті, збиранням різних запасних і навчальних частин армії СС. Для створення піхотних полків було використано моторизований полк СС «Шиль» (в дивізії став 86-м полком) і лагоди рекрутського депо «Курмарк» Окрім 32-ої добровольчої полк СС, потім 87-й, з курсантів адміністративної школи СС в Арользені і частин фольксштурмуму почав формуватися 88-й полк. Артилерійський полк і саперний батальйон були створені на базі спеціальних шкіл військ СС, загальна кількість дивізії становила приблизно 12 000 чоловік."
  ss_recruitment_event.58.a:0 "Створено 32.SS-Freiwilligen-Grenadier-Division «30. Januar» §!."

