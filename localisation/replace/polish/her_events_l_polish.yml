  news.401.t: "Падіння Будапешта"
  news.401.desc: "З Будапешта ми доносимо донесення: Угорська столиця захопила наступні радянські війська.\n\nПід час боїв велику частину міської забудови було знищено, а місцева ополчення ще намагається вести безнадійні сутички з червоною армією.\n\nЧи після падіння останнього союзника Гітлера, третій Рейх незабаром перестане існувати?"
  news.401.a: "Це серйозний поворот."
  news.401.b: "Батьківщина пам’ятатиме нашу перемогу!"
  news.401.c: "Кінець ближче, ніж здавалося"

  her_romania.1.t: "Антонеску вимагає зречення Кароля II"
  her_romania.1.d: "Вже наступного дня після призначення прем'єр-міністром «Національний легіонерський уряд» Антонеску вимагав від Кароля II зректися трону на користь його сина, Міхая I, і, виконавши цю вимогу, король Кароль II залишить країну. Міхай I, якому зараз 18 років, формально збереже королівську владу, але фактично не матиме всіх повноважень."
  her_romania.1.a: "Це на краще"

  her_romania.3.t: "Спроба державного перевороту"
  her_romania.3.d: "Два дні тому залізна гвардія організувала єврейські погроми, направлені безпосередньо на євреїв і уряд Антонеску, в Бухаресті зав’язалися вуличними боями. Після двох днів боїв поліція Румунії і армія здобули перемогу над повстанцями, і, згідно з одним прикладом, загинуло 1000 людей, а лідери Залізної Гвардії втекли до Німеччини."
  her_romania.3.a: "Добий тих, хто вижив"

  her_romania.2.t: "Страта Корнеліу Зеля Кодряну"
  her_romania.2.d: "Король Кароля II наказав, щоб його стратили Корнеліу Зеля Кодряну, який дуже популярний в народі лідер руху "Залізна гвардія"Товариство залишилося незадоволеним рішенням короля"
  her_romania.2.a: "Що творить король..."

  news.153.t: "Німеччина нападає на СРСР"
  news.153.d: "Сьогодні, 22 червня, німецькі війська переїжджали кордон Радянського Союзу по всіх країнах, Гітлер виступив перед німецьким народом про слабкість Радянського Союзу, повідомляючи про серйозні втрати в рядах Червоної армії. До початку воєнних дій німецькі літаки завдали удару радянським аеродром, і до радянського народу звернувся диктор Левитан: "Громадяни і громадяни Радянського Союзу, сьогодні о четвертій годині ранку без оголошення війни, німецькі збройні сили атакували кордони Радянського Союзу, розпочалась Велика Вітчизняна війна."
  news.153.a: "Довір’я між гігантами є дещо крихким."
  news.153.b: "Ми підписали це, тільки щоб виграти час для нападу."
  news.153.c: "Договір для фашистів - це просто папірець."

  guards_recruitment_event.1.t: "Формування Гвардейських дивізій"
  guards_recruitment_event.1.desc: "Верховний сформував нові гвардійські дивізії, ура!"
  guards_recruitment_event.1.a: "Прийнято до відома"

  news.322.t: "Переворот в Румунії"
  news.322.desc: "У Румунії відбувся переворот організованої і проведений королем країни Міхея I і опозиційними маршалу Йону Антонеску партіями, а о 16:30 Антонеску прибув у королівський палац. У жовтому палаці його чекали Сенетеску і Міхай I. Міхай I запропонував Антонеску припинити війну і підписати перемир'я з Радянським Союзом. Після цих слів Міхай I залишив жовтий салон, а Антонеску був арештований королівською охороною, новим прем'єр-міністром і по суті керівником країни став Константин Сенетеску. Після цього Румунія оголосила війну Німеччині."
  news.322.a: "Це на краще."
  news.322.b: "Він ... хоча б скромніше."

  generic.26.t: "[From.GetName] Підірвані на міні"
  generic.26.d: "Генерал [From.GetName] Тепер він загинув унаслідок наземної наземної наземної наземної машини, внаслідок чого загинув генерал, адьют і водій."

  generic.27.t: "[From.GetName] загинув у авіакатастрофі"
  generic.27.d: "Сьогодні новина про те, що генерал [From.GetName], будучи важко поранений осколком міни, загинув в авіакатастрофі літака, який евакуював його в столицю, тела загиблих були поховані в братерській могилі."

  generic.28.t: "[From.GetName] Згорає в танку"
  generic.28.d: "Сьогодні новина про те, що генерал [From.GetName]Щоб підбадьорити своїх танкістів, він рухався в бойових рядах одного зі своїх зв'язків, генерал кинувся на своєму танку вперед, втупився в позицію ворога і там склав голову."

  generic.29.t: "[From.GetName] Загинув"
  generic.29.d: "Сьогодні після битви загинув генерал [From.GetName]; Під час бою він особисто керував своїми частинами на полі бою у своєму танку і був підбитий противником; танк під час нападу вибухнув боєкомплект і генерал загинув; від нього залишився тільки мундир з медалями."

  generic.30.t: "[From.GetName] Загинув"
  generic.30.d: "Генерал [From.GetName]Загинув артилерійський удар по штабу, і Снаряд догодив точно в бліндаж, що призвело до загибелі генерала, радіста і ще кількох старших офіцерів."

  generic.31.t: "[From.GetName] Загинув"
  generic.31.d: "Генерал [From.GetName] якого вбили під час бою. він помер від втрати крові."

  generic.32.t: "[From.GetName] Загинув"
  generic.32.d: "Генерал [From.GetName] Сьогодні загинув під час випадкової детонації снаряда, і під час інспекції на армейський склад відбувся вибух боєприпасу, коли пожежні команди змогли погасити склад генерала було вже не врятувати."

  generic.33.t: "[From.GetName] Загинув"
  generic.33.d: "Генерал [From.GetName] Коли машина з'їхала в канаву, він відступав разом зі своїми військами, коли його машина з'їхала в канаву і перевернулася, генерал загинув, а водій був тяжко поранений від удару головою."

  man_armor.801.t:0 "Маньчжоу-Го готує рейдові групи"
  man_armor.801.d:0 "Межа між нами і Маньчжоу-Го завжди була місцем сутичок і зіткнень з тих пір, як Японія виграла першу Китайську війну. Тепер новий уряд у Маньчжоу-Го організував бригади, готові набігати і грабувати нашу сільську місцевість, якщо у них з'явиться можливість. Ми повинні переконатися, що у нас достатньо військ, щоб запобігти цьому, поки ми не знайдемо більш надійне рішення."
  man_armor.801.a:0 "Нам доведеться тримати кордон укріпленою"
  MAN_raids_tt:0 "\n§RТримайте не менше 25 дивізій (375 тисяч) на кордоні маньчжурських маньчжурів§!"

