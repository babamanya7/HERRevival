  japan_border_conflict.4.t:0 "Патова ситуація на Халхін-Голу"
  japan_border_conflict.4.desc:0 "Перестрілки між японськими і [SOV.GetAdjective] Загони на Халхін-Голі затихли після того, як обидві сторони відійшли від спірної ділянки з метою перегрупування і поповнення припасів. Оскільки японське командування визнавало непотрібність подальшого наступу, то було запропоновано припинити вогонь і почати переговори щодо встановлення кордону."
  japan_border_conflict.4.a:0 "Ми отримали цінний досвід."

  sov_her.1.t:0 "Смерть Ватутина"
  sov_her.1.d:0 "[GetDateText] Ватутин, разом зі своїм супроводом, виїхав на територію 60-ої армії, щоб перевірити хід підготовки до наступної операції. Ватутин, вискочивши з машини, разом з офіцерами вступив у перестрілку, під час якої був поранений в стегно. Його оглянув генерал-майор медичної служби в І.І.І.І.І.Іскраві, а через день на поїзді до лікарні в Київ. Незважаючи на оперативне втручання і використання найновішого пеніциліну у Ватутина, газова гангрена не змогла врятувати генерала. Через два місяці після поранення він помер у лікарні від зараження крові"
  sov_her.1.a:0 "Прокляті бандерці!"
  vatutin_killed:0 "Схоплення УПА"

