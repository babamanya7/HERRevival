  ger_armor.305.t:0 "Російська Зима"
  ger_armor.305.d:0 "Перший сніг, який почався зимою в Росії, відомий як одна з причин поразки Наполеона у 1812 році, а також ще один фактор, який заважає військові маневрування - «Розподіл», або «генерал бруд», явище, що відбувається в Росії з осінніми дощами і весняними відтеплями, коли рух по неопрацьованих дорогах ускладнюється через розлуку."
  ger_armor.305.a:0 "Оце незадача!"

  finland.10.t:0 "Мирні переговори з Радянським Союзом"
  finland.10.d:0 "Наша друга війна з радянським режимом виявилася не такою успішною, як ми сподівалися. У Москві було призначено зустріч, на якій нам буде запропоновано укласти мир, але нам доведеться поступитися будь - якою завойованою територією і легалізувати комунізм у обмін на збереження суверенітету Фінляндії. \n\nФінські сили швидко вичерпуються, і ми більше не можемо розраховувати на допомогу Німеччини. Можливо, це наша єдина надія на мирний дозвіл конфлікту, але нам доведеться провести демілітаризацію і виплатити військові репарації."
  finland.10.a_tt:0 "§YЯкщо Радянський Союз погодиться\n§!"
  finland.10.a:0 "У цій війні не перемогти"

  finland.11.t:0 "Фінляндія просить миру"
  finland.11.d:0 "Війна з Німеччиною дорого коштувала, але оскільки ми змогли відтіснити гітлерівську армію, то отримали переконливу пропозицію з Фінляндії. Ми зберігаємо контроль над нашою територією під час зимової війни, а Фінляндія виходить з Осі і зберігає нейтралітет, натомість ми виводимо свої війська і припиняємо війну.\nЦе завершить наш наступ на Фінляндію без повного контролю над регіоном, але у свою чергу дасть нам змогу зосередитися на війні проти Німеччини."
  finland.11.a:0 "це терпимі умови"

  chi_armor.802.t:0 "Інцидент в Оемі"
  chi_armor.802.d:0 "Невдовзі після події Марко-Поло в Шанхаї стався ще один інцидент, в результаті якого від рук китайців загинув японський лейтенант. Незважаючи на те, що вина лежить на Японії, ми отримали дикові вимоги про дееселації ситуації, ми очікуємо, що це буде димовою завісою, поки японська армія не зможе відправити підкріплення, ми повинні зробити те ж Саме так."
  chi_armor.802.a:0 "Війна на горизонті"

  fra_armor.814.t:0 "Кабінет міністрів йде у відставку"
  fra_armor.814.d:0 "Палата депутати вибрала Рейно прем'єр-міністра, але тільки одним голосом, при цьому велика частина його власної партії утримувалася. Цей новий уряд є дуже нестійким; багато людей вимагають, щоб Рейно напав не на Німеччину, а на Радянський Союз. Палата також змусила Далад’є, якого Рейно особисто вважав відповідальним за слабкість Франції, стати міністром національної оборони і війни Рейно."
  fra_armor.814.a:0 "Пол Рейно очолить новий уряд."

  fra_armor.815.t:0 "Провінції змінюють свою вірність!"
  fra_armor.815.d:0 "Провінції Центральної Африки, Індії, Китаю та Тихого океану заявили про свою підтримку вільного французького режиму, і цей акт уже дестабілізувався як законність нашого уряду, так і довір’я народу до нас. Якщо ми хочемо повернути ці колонії, то приєднання до Осі може бути нашою найкращою надією."
  fra_armor.815.a:0 "Ми — правдивий уряд!"
  fra_armor.815.b:0 "Ми будемо чекати, поки війна закінчиться."

  fra_armor.73.t:0 "Повстанці Північної Африки!"
  fra_armor.73.d:0 ""
  fra_armor.73.a:0 "Ми — правдивий уряд!"

  fra_armor.804.t:0 "Париж оголошує відкритим містом"
  fra_armor.804.d:0 "З наближенням німецької армії до Парижу наш уряд втратив віру в здатність наших військових виграти війну. Щоб врятувати Париж від цілковитого руйнування, французький уряд вирішив оголосити Париж відкритим містом."
  fra_armor.804.a:0 "Евакуйте столицю!"

  fra_armor.805.t:0 "Париж оголошує відкритим містом"
  fra_armor.805.d:0 "З французьким урядом, повністю роз'єднаним, наша військова перемога переконала їх, що подальші бої марні, і, побачивши нашу військову машину, вони вирішили оголосити Париж відкритим містом, яке дозволяє нашим військам вільний вхід. якщо французькі солдати кидають виклик урядовим наказам і вирішують зробити Париж прифронтовим містом."
  fra_armor.805.a:0 "Війна виграна"

  fra_armor.806.t:0 "Франція формує Європейську коаліцію"
  fra_armor.806.d:0 "Французький уряд оголосив про свій намір об’єднати Європу під одним прапором, щоб протистояти «Дедалі більша загроза ворожих сил і зміцнення нашої власної безпеки»Хоча в останні роки сила Франції різко зросла, досі не ясно, які їхні справжні наміри, ми все ще повинні зробити вибір, чи повинні ми приєднатися до них або відмовитися від інтеграції проекту Франції?"
  fra_armor.806.a:0 "Ми повинні приєднатися до них."
  fra_armor.806.b:0 "У нас є інші справи."

  fra_armor.807.t:0 "[From.GetName] Долучається до Європейського Союзу"
  fra_armor.807.d:0 "[From.GetName] Долучається до Європейського Союзу"
  fra_armor.807.a:0 "Вони вибрали правильний вибір."

  fra_armor.808.t:0 "[From.GetName] Не хоче вступати в Європейську коаліцію"
  fra_armor.808.d:0 "[From.GetName] Не хоче вступати в Європейську коаліцію"
  fra_armor.808.a:0 "Занадто погано для них."

  fra_armor.809.t:0 "Повсюдний воїн"
  fra_armor.809.d:0 "Планування великої війни дозволило нам негайно почати приписувати велику кількість нашого населення для розгортання на передову."
  fra_armor.809.a:0 "Це дасть нам багато робочої сили."

  fra_armor.810.t:0 "[FRA.GetName] просить грошової підтримки"
  fra_armor.810.d:0 "[FRA.GetName] просить допомоги в боротьбі проти ворогів, і більшість минулих років Франція була на ранній стадії мобілізації, що призвело до нестатки засобів для тривалої війни."
  fra_armor.810.a:0 "Допомагати їм у наших інтересах"
  fra_armor.810.b:0 "Ми не зацікавлені в ситуації з Францією."

  fra_armor.811.t:0 "[USA.GetName] Відправляє допомогу!"
  fra_armor.811.d:0 ""
  fra_armor.811.a:0 "Спасибі американцям!"

  fra_armor.812.t:0 "[USA.GetName] відмовився від допомоги"
  fra_armor.812.d:0 ""
  fra_armor.812.a:0 "Глибоке розчарування"

  fra_armor.894.t:0 "Бейрутська конференція"
  fra_armor.894.d:0 "Оскільки в Європі шаленіє війна, настав час для неминучих переможців подумати про майбутнє Німеччини. [beirut_partner.GetNameDef] Конференція з роз’ єднання [GER.GetNameDef] Після війни, щоб окреслити наші сфери впливу на континенті. «Друзі» у [beirut_partner.GetNameDef] Вони вказали, що будуть зацікавлені в такій конференції, без сумніву, вони захочуть отримати якусь нагороду за свої жертви."
  fra_armor.894.a:0 "Нам потрібна конференція про майбутнє Німеччини."
  fra_armor.894.b:0 "Ми не можемо співпрацювати з [yalta_partner.GetNameDef]."

  fra_armor.895.t:0 "Бейрутська конференція"
  fra_armor.895.d:0 "Після того як війна проти [GER.GetNameDef] Прийшла до свого неминучого кінця, [yalta_origin.GetNameDef] До нас звернувся з промовою про майбутнє Німеччини. \n\n Вони пропонують розділення [GER.GetNameDef] Між східом і західом, це дозволило б нашій сфері впливу поширюватися вглиб Європи, що компенсувало б деякі втрати, які ми понесли в цю жахливу боротьбу."
  fra_armor.895.a:0 "В ім'я довгострокової співпраці."
  fra_armor.895.b:0 "Ми будемо диктувати свій світ."

  FRA_rhineland_puppet_tt:0 "§YРейнська область перейде під прямий контроль Франції, а в решті Німеччини буде встановлений дружній Франції режим.§!"

  italy.1.a:0 "Приєднати їх до імперії"
  italy.1.b:0 "Створіть маріонетну державу"

  ita_armor.817.t:0 "Італія в кризі"
  ita_armor.817.d:0 "З нашими великими територіальними втратами в Африці та на Сицилії наш народ вимагає припинення війни, і по всіх наших містах почалися протести з появою чуток про повстання на півдні. Щоб відновити віру народу, ми повинні повернути Сицилію і показати, що Італія не впаде!"
  ita_armor.817.a:0 "Ми повинні негайно контратакувати!"

  ita_armor.811.t:0 "Війна з Ефіопією продовжується"
  ita_armor.811.d:0 "Наш народ втомився і не впевнений в нашому уряді через відсутність закінчення війни в Ефіопії, з наших пропагандистських зусиль вони вважають Ефіопію легкою метою, з якою наші військові можуть легко перемогти. Ми повинні подвоїти наші зусилля, щоб покінчити з війною, перш ніж люди втратять віру в нас."
  ita_armor.811.a:0 "Ми втрачаємо підтримку народу."

  ita_armor.812.t:0 "Війна з Ефіопією продовжується"
  ita_armor.812.d:0 "Наш народ здивований тим, що ми все ще знаходимося в стані війни з Ефіопією, а заголовки закликають провести розслідування щодо нашого військового персоналу, народ втрачає віру в здатність нашої війни."
  ita_armor.812.a:0 "Ми повинні подвоїти наші зусилля."

  ita_armor.813.t:0 "Війна з Ефіопією продовжується"
  ita_armor.813.d:0 "Населення шоковано тим, що війна ще не закінчилась, і вони мають серйозні сумніви щодо нашої військової та будь-якої агресивної зовнішньої політики, яку ми могли б використовувати в інших країнах."
  ita_armor.813.a:0 "Нам потрібен новий план"

  ita_armor.814.t:0 "Війна з Ефіопією продовжується"
  ita_armor.814.d:0 "Люди закликають до припинення воєнних дій з Ефіопією, спостерігаючи за тим, скільки коштує довга війна з такою маленькою нацією, ми повністю деморалізували всіх у себе вдома."
  ita_armor.814.a:0 "Ми повинні закінчити війну зараз."

  ita_armor.815.t:0 "Війна з Ефіопією продовжується"
  ita_armor.815.d:0 "По цілій країні продовжуються масові протести, до яких приєднуються наші військові та поліцейські, а не зупиняють їх; масові заворушення обов’язково з’являться"
  ita_armor.815.a:0 "Населення деморалізовано"

  ita_armor.818.t:0 "Італія пропонує захист"
  ita_armor.818.d:0 "Італія звернулася до нас з пропозицією гарантувати нашу незалежність в обмін на обладнання, з нашим вразливим становищем між багатьма країнами, це може дуже допомогти. Для цього в Італії потрібно багато віри."
  ita_armor.818.a:0 "Ми погодимося"
  ita_armor.818.b:0 "Ми в порядку самі по собі"

  ita_armor.819.t:0 "Чехословаччина погодилась на нашу пропозицію"
  ita_armor.819.d:0 "Чехословакія бачила, що наша пропозиція про захист була мудрим вибором, і ми, безсумнівно, є цінним союзником, вони домовилися про поставки нам зброї, яка повинна допомогти модернізувати нашу армію."
  ita_armor.819.a:0 "Чудово."

  ita_armor.820.t:0 "Чехословаччина відхилила нашу пропозицію"
  ita_armor.820.d:0 "Чехословакія не вважає нас цінним союзником і відкинула нашу пропозицію про захист, хоч би як це було сумно, це не перешкодить нам стати європейською супердержавою."
  ita_armor.820.a:0 "Неважливо"

  ita_armor.821.t:0 "Італійський ультиматум"
  ita_armor.821.d:0 "Італійські дипломати видали нам ультиматум з вимогою підкоритися їх окупації! ми були обманені, думаючи, що італійці поважатимуть нашу незалежність, незважаючи на їхню угоду з нами. Мало надії, що ми зможемо протистояти вторгненням самотужки."
  ita_armor.821.a:0 "Ми повинні представити"
  ita_armor.821.b:0 "Спротив на вершині"

  ita_armor.822.t:0 "Урожай Болгарії"
  ita_armor.822.d:0 "З огляду на ситуацію, болгарський уряд справедливо дійшов висновку, що наша воля не може бути порушена, ми вже дали наказ почати перекидання військ у Болгарію і тепер стримує їх ключові міста. Це ще один крок до відновлення Великої Римської імперії."
  ita_armor.822.a:0 "Чудово."

  ita_armor.823.t:0 "Болгарія відмовилася від ультиматум"
  ita_armor.823.d:0 "Незважаючи на велику різницю в силі, Болгарія відкинула окупацію і розірвала з нами зв'язок, якщо ми хочемо їх окупувати, потрібна більш агресивна дипломатія."
  ita_armor.823.a:0 "Ми тоді будемо застосовувати силу"

  ita_armor.824.t:0 "Італія вимагає Стамбула"
  ita_armor.824.d:0 "Італія прийшла до нас з дуже дикою вимогою передати дорогоцінне місто Стамбул, посилаючись на те, що вони хочуть відновити Римську імперію, хоча вони можуть вважати себе непереможними, вони серйозні. Чи можемо ми дозволити собі піти на війну?"
  ita_armor.824.a:0 "Ми погано споряджені до війни."
  ita_armor.824.b:0 "Вони ніколи цього не отримають!"

  ita_armor.825.t:0 "Туреччина переносить територію"
  ita_armor.825.d:0 "На наше здивування, Туреччина прийняла наші вимоги, мабуть, тому, що вони не хочуть бути втягненими у ширший конфлікт, це велика перемога для нас!"
  ita_armor.825.a:0 "Чудово."

  ita_armor.826.t:0 "Туреччина відхилила претензії Італії"
  ita_armor.826.d:0 "Туреччина відкинула будь - які претензії на місто і готова захищати територію, хоча це не найдивовижніший результат."
  ita_armor.826.a:0 "Це був невеликий шанс."

  ita_armor.827.t:0 "Стамбул було завойовано"
  ita_armor.827.d:0 "З завоюванням Стамбула багато політиків і людей особисто підтримували відновлення міста до його первісної спадщини, починаючи з його назви."
  ita_armor.827.a:0 "Зроди стару столицю!"

  ita_armor.828.t:0 "Німеччина переходить до аншлюсу"
  ita_armor.828.d:0 "Незважаючи на нашу гарантію незалежності Австрії, вона не перешкодила Німеччині шукати аншлюса з австрійським народом. Це ставить нас у складну ситуацію, незалежно від того, чи ми підтримуємо свої зобов’язання і чи ризикуємо війною, чи відступаємо."
  ita_armor.828.a:0 "Ми не можемо сподіватися перемоги"
  ita_armor.828.b:0 "Ми виконуємо свої зобов’язання"

  ita_armor.829.t:0 "Італія відмовилася від підтримки Австрії"
  ita_armor.829.d:0 "Через те, що ми розпочали з Ашлюса, Італія досить незручно відреагувала на гарантію незалежності Австрії, і це, ймовірно, викликало нестабільність в їхній країні. Але для нас це великий успіх, і ми повинні бути в змозі продовжити Ашлюс, не боячись італійської опозиції, і вони не бачать майбутнього так, як ми."
  ita_armor.829.a:0 "Ми об'єднаємо німецький народ!"

  ita_armor.830.t:0 "Італія застерігає"
  ita_armor.830.d:0 "Наша співпраця з Аншлюсом Італія підтвердила свою позицію щодо збереження миру в Європі, і ще більш імовірно, що вони вважають німецьку експансію загрозою. Таким чином, ми, ліві, маємо потенційну війну з італійцями і значно збільшуємо напруження, якщо ми продовжимо Ашлюс, який може бути дорогим для Рейха."
  ita_armor.830.a:0 "Ніхто нас не зупинить"

  ita_armor.831.t:0 "Муссоліні звільнено з посади голови уряду"
  ita_armor.831.d:0 "Учора король атакував парламент Муссоліні і вимагав, щоб голови країни з його підлеглими, а також усунення кількох генералів та начальника штабів. Оскільки Муссоліні було арештовано і підтримано, а також підтриманий народ та багатьох членів фашистської ради, король Віктор Еммануїл прийняв сучасне керівництво Італії. У промові, щоб запевнити людей в Італії, король розкрив план Муссоліні створити Римську імперію, яка призведе до катастрофи і поразки в Італії. Маючи повний контроль над Італією, світ запитує себе, що буде далі для Італії."
  ita_armor.831.a:0 "Тільки король може правити"
  ita_armor.831.b:0 "Ми повинні рухатися до справжньої демократії."
  Vatican_attitude_tt:0 "£faction_ita_vatican Ватикан стає §GБлижче знайомство§!."

  ita_armor.832.t:0 "Муссоліні втік з в'язниці!"
  ita_armor.832.d:0 "Після зміщення Муссоліні з поста прем'єр-міністра його ескорт у в'язницю потрапив у засідку, безсумнівно, через чорні рубашок, які залишаються вірними йому. Поліція запізнилася, щоб запобігти його втечі, і розслідування з участю зниклих безвісти працівників показало, що в країні та її уряді все ще є глибока підтримка фашизму."
  ita_armor.832.a:0 "Починай полювання за Дуче!"

  ita_armor.833.t:0 "Проблеми на півночі"
  ita_armor.833.d:0 "Кілька офіцерів повідомили про проблеми у своїх рядах. і багато офіцерів пішли у відставку на знак протесту проти його звільнення. Високого командування дуже турбує наше серце на Півночі, яке бачило великий успіх під правлінням Муссоліні і, по чутках, захищає Іль Дуче."
  ita_armor.833.a:0 "Ми повинні протистояти його впливу."

  ita_armor.834.t:0 "Італія вимагає Савойю"
  ita_armor.834.d:0 "Італія, посилаючись на італійське населення Савойї, намагається розширити свою прикордонну зону, щоб зміцнити Італію, але ми ті, хто вирішить це."
  ita_armor.834.a:0 "Гадаю, вони можуть мати Савойя."
  ita_armor.834.b:0 "Їм потрібно більше, ніж кілька тисяч загиблих."

  ita_armor.835.t:0 "Італія вимагає Корсику"
  ita_armor.835.d:0 "Італія, посилаючись на італійське населення Корсики, намагається розширити свою прикордонну зону, щоб зміцнити Італію, але ми ті, хто вирішить це."
  ita_armor.835.a:0 "Корсика корисніша там під контролем"
  ita_armor.835.b:0 "Їм потрібно більше, ніж кілька тисяч загиблих."

  ita_armor.836.t:0 "Італія вимагає Мальту"
  ita_armor.836.d:0 "Італія, посилаючись на італійське населення Мальти, намагається розширити свою прикордонну зону навколо території, щоб зміцнити Італію, але ми ті, хто це вирішить."
  ita_armor.836.a:0 "Я чекаю від Мальти великих успіхів."
  ita_armor.836.b:0 "Такий приз повинен залишитися у нас."

  ita_armor.837.t:0 "Італія вимагає Далмації"
  ita_armor.837.d:0 "Італійське населення Далмацій намагається розширити свою прикордонну зону навколо території, щоб зміцнити Італію, але ми ті, хто це вирішить."
  ita_armor.837.a:0 "Далмация не має значення, нехай вона у них є."
  ita_armor.837.b:0 "Їм потрібно більше, ніж кілька тисяч загиблих."

  ita_armor.838.t:0 "Італія вимагає Тічіно"
  ita_armor.838.d:0 "Італія, посилаючись на італійське населення Тічіно, намагається розширити свою прикордонну зону, щоб зміцнити Італію, але ми ті, хто вирішить це."
  ita_armor.838.a:0 "У них може бути Тічіно, якщо це робить їх щасливими."
  ita_armor.838.b:0 "Їм потрібно більше, ніж кілька тисяч загиблих."

  ita_armor.839.t:0 "[From.GetName]Прийняти наші вимоги"
  ita_armor.839.d:0 "[From.GetName] Знайшов мудрість підтримки наших вимог до нашої законної території і здав Савойю нам."
  ita_armor.839.a:0 "Чудово."

  ita_armor.840.t:0 "[From.GetName]Відкинути наші вимоги"
  ita_armor.840.d:0 "[From.GetName] Нам треба було б перешкодити нашим скромним, справедливим і розсудливим вимогам до нашої законної території."
  ita_armor.840.a:0 "Неприємно."

  ita_armor.841.t:0 "[ITA.GetName]Пропонується план захоплення Гібралтера"
  ita_armor.841.d:0 "[ITA.GetName] запропонував зібрати наших найбільш радикальних націоналістів і спровокувати заворушення і саботаж у Гібралтері, щоб ослабити його, і відкриє скелю для наших сил, щоб захопити наші законні претензії. Цей план небезпечний і, можливо, призведе до війни з [ENG.GetName]Якщо вони не відмовляться від Скала, то це ставить нас у найбільш сприятливе становище."
  ita_armor.841.a:0 "Давайте дамо цьому наш друк схвалення."
  ita_armor.841.b:0 "Війна з [ENG.GetName] надто небезпечна"

  ita_armor.842.t:0 "[SPR.GetName] погодився з нашим планом"
  ita_armor.842.d:0 ""
  ita_armor.842.a:0 "Чудово"

  ita_armor.843.t:0 "[SPR.GetName] відхилив наш план"
  ita_armor.843.d:0 ""
  ita_armor.843.a:0 "Вони не вважають війну неминучою."

  ita_armor.844.t:0 "Проблеми в Гібралтері"
  ita_armor.844.d:0 "Реформатори з Іспанії почали збиратися навколо Ґібралтера, і, незважаючи на мир, ситуація переросла у заворушення. Є повідомлення про те, що люди перетинають воду, і цілісність нашої військової бази потенційно скомпрометована."
  ita_armor.844.a:0 "Ми повинні негайно зміцнити скелю."

  ita_armor.845.t:0 "Успіх у Гібралтері"
  ita_armor.845.d:0 "Поступають повідомлення про наш успіх у саботажі фортів і баз Гібралтера, британські війська дезорганізовані і зайняті утриманням створеного нами хаосу, якщо і був час завдати удару, то зараз."
  ita_armor.845.a:0 "Ми їх добре налякали, але передумали."
  ita_armor.845.b:0 "Прийшов час страйку!"

  ita_armor.846.t:0 "Вибори [?global.year|0]"
  ita_armor.846.d:0 "Через місяць після закінчення нашої громадянської війни народ проголосував і з малою перемогою здобув перемогу."
  ita_armor.846.a:0 "Виграв Партіто Пополарі Італано"
  ita_armor.846.b:0 "Національна Монархіко переміг"
  ita_armor.846.c:0 "Виграв Партіто Комуніста Італано"
  ita_elections_requirment_tt:0 "Відбулося нові вибори"

  ita_armor.847.t:0 "Король Віктор Еммануїл III Кроки вниз"
  ita_armor.847.d:0 "Після перемоги на виборах, коли-небудь скромний король Еммануель зробив свій перший крок в якості глави Італії, щоб поставити свого двоюрідного брата Фердінандо Адальберто на чолі країни. Він підкреслив, що в Італії потрібне сильне й популярне керівництво, аби прокласти шлях уперед, і висловив цілковиту впевненість у новому лідері."
  ita_armor.847.a:0 "Хай живе новий король!"

  ita_armor.848.t:0 "Надіслати Ультиматій?"
  ita_armor.848.d:0 "Югославія не може сподіватися перемоги в бою між нашими країнами, якщо ми пошлемо їм вимогу про нашу законну заявлену землю в Далімації, вони можуть просто передати її без бою."
  ita_armor.848.a:0 "Do it"
  ita_armor.848.b:0 "Зараз не найслушніший час"

  ita_armor.849.t:0 "Італія вимагає Далмації"
  ita_armor.849.d:0 "Італійські війська концентруються по іншій стороні нашого кордону, і їхні дипломати вимагали, щоб ми поступилися їм всю Далімацію! чи повинні ми чинити опір?"
  ita_armor.849.a:0 "Ні, це безнадійно."
  ita_armor.849.c:0 "Ми не віддамо свою територію без бою!"

  ita_armor.850.t:0 "[YUG.GetName] здає Далмацію"
  ita_armor.850.d:0 "Югослави мудро підкорилися нашим вимогам і вивели всі свої сили з Далмації, ми включимо цю територію в Союз як Молдавську Радянську Республіку. Тепер його громадяни будуть користуватися благами соціалізму."
  ita_armor.850.a:0 "Чудово."

  ita_armor.851.t:0 "[YUG.GetName] Відмова від своїх вимог"
  ita_armor.851.d:0 "Югослави відмовилися відповідати нашим вимогам, схоже, нам доведеться силою вигнати їх окупаційні сили з Далмації."
  ita_armor.851.a:0 "Вони пошкодують про це"

  ita_armor.852.t:0 "Руйнування Центральної Європи"
  ita_armor.852.d:0 "Наші цілі знаходяться в полі зору, але планувальники наполягають на тому, що ми шукаємо Францію та Німеччину, оскільки ми ризикуємо їх військовою опозицією, щоб розділити Центральну Європу. Чи повинні ми розділити здобич або ризикнути піти на це самотужки?"
  ita_armor.852.a:0 "Знайти спільні цілі безпечніше"
  ita_armor.852.b:0 "Нам не потрібно співпрацювати"
  ita_armor.852.c:0 "Немає нікого"

  ita_armor.853.t:0 "[ITA.GetName]Пропонується вирізати центральну Європу"
  ita_armor.853.d:0 "Італія прийшла до нас з найбільш амбіціозними планами, щоб розділити Центральну Європу серед нашої сфери впливу і розпустити Швейцарію, Австрію та Венгію. Цей крок зробить нас мішенню для інших великих держав Європи і створить заворушення в Європі, але чи готові ми змінити Європу?"
  ita_armor.853.a:0 "Маленькі держави служать тільки нашим ворогам."
  ita_armor.853.b:0 "Наші інтереси не однакові"

  ita_armor.854.t:0 "[ITA.GetName]Пропонується вирізати центральну Європу"
  ita_armor.854.d:0 "Італія прийшла до нас з найбільш амбіціозними планами, щоб розділити Центральну Європу серед нашої сфери впливу і розпустити Швейцарію, Австрію та Венгію. Цей крок зробить нас мішенню для інших великих держав Європи і створить заворушення в Європі, але чи готові ми змінити Європу?"
  ita_armor.854.a:0 "Маленькі держави служать тільки нашим ворогам."
  ita_armor.854.b:0 "Ми не згодні, але не можемо втручатися"
  ita_armor.854.c:0 "Наші інтереси не однакові"

  ita_armor.855.t:0 "[FROM.GetName] приймає пропозицію"
  ita_armor.855.d:0 ""
  ita_armor.855.a:0 "Тепер були в легкому режимі"

  ita_armor.856.t:0 "[FROM.GetName] Відхилити пропозицію"
  ita_armor.856.d:0 ""
  ita_armor.856.a:0 "Сподіватимемося, що вони не повісять"

  ita_armor.857.t:0 "Розрізання Східної Європи"
  ita_armor.857.d:0 "Наші війська готові завоювати Східну Європу."
  ita_armor.857.a:0 "Знайти спільні цілі безпечніше"
  ita_armor.857.b:0 "Нам не потрібно співпрацювати"
  ita_armor.857.c:0 "Немає нікого"

  ita_armor.858.t:0 "[ITA.GetName]Пропонується вирізати Східну Європу"
  ita_armor.858.d:0 "Італія прийшла до нас з найбільш амбіціозними планами, щоб розділити Центральну Європу серед нашої сфери впливу і розпустити Швейцарію, Австрію та Венгію. Цей крок зробить нас мішенню для інших великих держав Європи і створить заворушення в Європі, але чи готові ми змінити Європу?"
  ita_armor.858.a:0 "Маленькі держави служать тільки нашим ворогам."
  ita_armor.858.b:0 "Наші інтереси не однакові"

  ita_armor.859.t:0 "[FROM.GetName] приймає пропозицію"
  ita_armor.859.d:0 ""
  ita_armor.859.a:0 ""

  ita_armor.860.t:0 "[FROM.GetName] Відхилити пропозицію"
  ita_armor.860.d:0 ""
  ita_armor.860.a:0 ""

  ita_armor.861.t:0 "[From.GetNameDefCap] запрошує [Root.GetNameDef] у [alliance_inviter.GetFactionName]"
  ita_armor.861.d.a:0 "З підозрілим поглядом на останні події у світовій політиці [alliance_inviter.GetNameDef] простягає нам руку дружби, пропонуючи свій захист і закликаючи нас стати з ними на захист принципів свободи та демократії. [alliance_inviter.GetFactionName], Свобода нашого народу може бути захищена, щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам нашу історичну територію Воєводіна і Західний Банат."
  ita_armor.861.d.b:0 "Визнаючи, що іноді навіть сильні союзники потребують, [alliance_inviter.GetAdjective] запросив нас приєднатися до [alliance_inviter.GetFactionName]Якщо ми приймемо це, то це може дати нам чудову нагоду знайти своє місце під сонцем, щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам нашу історичну територію Воєводіна і Західний Банат."
  ita_armor.861.d.c:0 "Наші ідеологічні союзники в [alliance_inviter.GetNameDef] Наш цінний внесок у працю робітників, і сьогодні вранці ми отримали запрошення приєднатися до [alliance_inviter.GetFactionName]Разом з іншими соціалістичними республіками ми могли б з новою силою поширити революцію, щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам нашу історичну територію Воєводіна і Західний Банат."
  ita_armor.861.d.e:0 "Схоже, що [alliance_inviter.GetAdjective] вважають нас стратегічними інтересами для них, і вони вважають більш прибутковим, щоб ми працювали разом, ніж ми дозволили собі бути розділеними нашими ідеологічними відмінностями. [alliance_inviter.GetAdjective] Запросив нас стати членом [alliance_inviter.GetFactionName]Щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам нашу історичну територію Воєводіна і Західний Банат."
  ita_armor.861.a:0 "Ми будемо стояти разом з ними."
  ita_armor.861.b:0 "Нам потрібно всього кілька тисяч загиблих..."
  ita_armor.861.c:0 "Ми будемо битися разом з нашими товаришами!"
  ita_armor.861.e:0 "Це вигідний вибір."
  ita_armor.861.f:0 "Нам краще без них."
  ita_armor.861.g:0 "У нас вже є союзники, які нам потрібні."

  ita_armor.862.t:0 "[From.GetNameDefCap] запрошує [Root.GetNameDef] у [alliance_inviter.GetFactionName]"
  ita_armor.862.d.a:0 "З підозрілим поглядом на останні події у світовій політиці [alliance_inviter.GetNameDef] простягає нам руку дружби, пропонуючи свій захист і закликаючи нас стати з ними на захист принципів свободи та демократії. [alliance_inviter.GetFactionName], Свобода нашого народу може бути захищена, щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам наші історичні території Фракії."
  ita_armor.862.d.b:0 "Визнаючи, що іноді навіть сильні союзники потребують, [alliance_inviter.GetAdjective] запросив нас приєднатися до [alliance_inviter.GetFactionName]Якщо ми приймемо це, то це може дати нам чудову нагоду знайти своє місце під сонцем, щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам наші історичні території Фракії."
  ita_armor.862.d.c:0 "Наші ідеологічні союзники в [alliance_inviter.GetNameDef] Наш цінний внесок у працю робітників, і сьогодні вранці ми отримали запрошення приєднатися до [alliance_inviter.GetFactionName]Разом з іншими соціалістичними республіками ми могли б з новою силою поширити революцію, щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам наші історичні території Фракії."
  ita_armor.862.d.e:0 "Схоже, що [alliance_inviter.GetAdjective] вважають нас стратегічними інтересами для них, і вони вважають більш прибутковим, щоб ми працювали разом, ніж ми дозволили собі бути розділеними нашими ідеологічними відмінностями. [alliance_inviter.GetAdjective] Запросив нас стати членом [alliance_inviter.GetFactionName]Щоб заохотити наше прийняття, [alliance_inviter.GetNameDef] запропонував нам наші історичні території Фракії."
  ita_armor.862.a:0 "Ми будемо стояти разом з ними."
  ita_armor.862.b:0 "Нам потрібно всього кілька тисяч загиблих..."
  ita_armor.862.c:0 "Ми будемо битися разом з нашими товаришами!"
  ita_armor.862.e:0 "Це вигідний вибір."
  ita_armor.862.f:0 "Нам краще без них."
  ita_armor.862.g:0 "У нас вже є союзники, які нам потрібні."


  ita_armor.892.t:0 "Італійська громадянська війна"
  ita_armor.892.d:0 "Початкова назва: 5: 00 Сьогодні вранці, рівно через день після втрати зв'язку з північними гарнізонами, по всій Іспанії була начата добре підготовлена військова операція для отримання контролю над усіма Урядові установи та стратегічні місця у великих містах. Більшість армії, флоту і військово-повітряних сил перестали відповідати на урядові накази, в той час як фашистські ополченці повстали на півночі країни. Повний успіх цієї спроби перевороту був запобігний тільки остаточній армії, яка пообіцяла свою вірність нашому королю і завдяки швидким діям змогла зберегти контроль над Юдою та багатьма іншими цілями за Цей бунт, як і передбачали, очолює Муссоліні, який після втечі з в'язниці з задумує свою владу, шлях попереду не що інше, як громадська громадянська війна."
  ita_armor.892.a:0 "Що під керівництвом нашого короля ми переможемо!"
  ita_armor.892.b:0 "Що, як єдиний народ, ми переможемо!"
  death_to_the_fascists:1 "Смерть фашисти!\n"

  ita_armor.893.t:0 "Звільнення Муссоліні"
  ita_armor.893.d:0 "Після наших катастрофічних поразок багато в нашій партії та країні відкрито висловилися проти продовження війни. На чолі з Фельдмаршалом Пітер Бадольйо і королем Еммануелем головний адвокат видав офіційне звільнення Муссоліні та фашистського режиму, безсумнівно, невдовзі після цього вони планують підписати перемир'я з союзниками. У нас є два можливих варіанти: відмовитися і дозволити Італії приєднатися до союзників, які віддали Німеччину, або зібрати решту союзників, попередити Німеччину і покласти край цьому повстанню. У будь - якому разі наше майбутнє виглядає похмурим."
  ita_armor.893.a:0 "Ми будемо відступати"
  ita_armor.893.b:0 "Ми повинні знищити зрадників!"

  ITA_on_the_brink:0 "§R Буде причиною громадянської війни §!"
  ITA_not_on_the_brink:0 "§G Уникне громадянської війни §!"

  ita_armor.894.t:0 "WW2 наближається до кінця"
  ita_armor.894.d:0 "З завершенням WW2 ми можемо зосередитися на відновленні, нашим першим кроком буде повернення столиці до Риму."
  ita_armor.894.a:0 "Час відновлювати"

  ita_armor.895.t:0 "Італія вимагає перемир'я"
  ita_armor.895.d:0 "Після нашої перемоги в Північній Африці та вторгнення в Італію італійський уряд скинув Муссоліні і засудив фашизм. Тепер вони намагаються перемир'я з нами і готові перейти на інший бік і битися з нами проти колишніх союзників, і це дуже хороша можливість розірвати угоду Осі і назавжди послабити вісь на середземноморському театрі. Коли Італія підписала це перемир'я, вона погоджується, що ми маємо контроль над Північною Африкою, а також над цілою союзною землею під контролем там, а натомість ми віддаємо всю землю на італійському півострові."
  ita_armor.895.a:0 "Ми можемо прийняти ці умови"
  ita_armor.895.b:0 "Ми приймаємо тільки безмовну капітуляцію."

  ita_armor.896.t:0 "Італія обіцяє вірність"
  ita_armor.896.d:0 "Ми щойно почули новину про те, що велика італійська рада арештувала Муссоліні і взяв під свій контроль італійський уряд. Хоча цей крок явно відштовхує Італію від фашизму, новий голова італійського уряду запевняє нас, що Італія залишиться вірною Осі. Проте було б абсурдно думати, що італійці не намагаються підписати перемир’я за закритими дверима. Тому ми повинні негайно відправити війська в Італію, щоб забезпечити контроль Осі і підготувати операцію для порятунку Муссоліні, якщо італійці нападуть на нас."
  ita_armor.896.a:0 "Ми бачимо крізь їхню брехню"

  ita_armor.897.t:0 "Союзники підписали перемир'я"
  ita_armor.897.d:0 "Союзники погодилися з нашими умовами і підписали з нами перемир'я, і ми повинні негайно чекати на відповідь Німеччини, наша єдина надія - наших нових союзників."
  ita_armor.897.a:0 "Чудово."
  ita_armor.897.b:0 "Ми запізнилися..."

  ita_armor.898.t:0 "Союзники відмовляються від перемир'я"
  ita_armor.898.d:0 "Союзники відкинули нашу мирну пропозицію і заявили, що приймуть тільки безмовну капітуляцію. Це досить несподівано, враховуючи, наскільки договор сприяв союзникам, але, тим не менше, ми залишаємося в жахливому становищі, і наша єдина надія полягає в перемозі осі."
  ita_armor.898.a:0 "Ми будемо битися до смерті."

  ita_armor.899.t:0 "Кінець громадянської війни в Італії"
  ita_armor.899.d:0 "Довга і кривава війна закінчилась перемогою республіканців, і завдяки цій перемозі рябі почала трясти фашизм, оскільки його батьківщина була очищена. Італійські народи зосереджені на відновленні країни, але ще важливішим є рішення про те, в якому напрямку країна повинна рухатися далі."
  ita_armor.899.a:0 "З силою ми відновлюємося"

  jap_armor.800.t:0 "Інцидент на мосту Марко Поло"
  jap_armor.800.d:0 "Японські солдати готуються до наступу на стратегічний міст Марко Поло за наказом наших військових генералів без дозволу уряду. варіанта, але вибір очевидний..."
  jap_armor.800.a:0 "У нас немає вибору"
  jap_armor.800.b:0 "Заставити їх розвернутися"

  JAP_ask_for_peace_USA_TT:0 "Він має контролювати всі союзні острови Тихого океану та територію в Океанії."

  jap_armor.801.t:0 "Японія пропонує світ"
  jap_armor.801.d:0 "Японія прийшла до нас з мирними угодами про припинення воєнних дій на Тихому океані. Після японської перемоги на тихоокеанських островах і завоювання Океанії у них є дуже міцний плацдарм, в якому можна відбити будь-які атаки з боку нас. Хоча перемога не є неможливою і ми не готові здатися, кілька років миру можуть дати нам час для відновлення нашого флоту і армій для нового вторгнення в Тихий океан."
  jap_armor.801.a:0 "Ми приймаємо"
  jap_armor.801.b:0 "Ми ніколи не приймемо поразки."

  jap_armor.802.t:0 "Союзники залишаються непохитними"
  jap_armor.802.d:0 "Навіть з нашими величезними досягненнями в Тихому океані союзники не приймають наших мирних умов, можливо, є плани вторгнення, про які ми не знаємо, або вони просто обманені. Хоч би якою була причина, здається, що тільки вторгнення до Сполучених Штатів і перемога вісі в Європі можуть принести мир тепер."
  jap_armor.802.a:0 "Ми переможемо."

  jap_armor.810.t:0 "Інцидент в Оемі"
  jap_armor.810.d:0 "Невдовзі після події Марко-Поло в Шанхаї стався ще один інцидент, в результаті якого від рук китайців загинув японський лейтенант. Оскільки наші спроби дееселації ситуації зазнали невдачі, японська армія попросила негайну відправку підкріплення, якщо китайці не підуть з Шанхая."
  jap_armor.810.a:0 "Цього разу ми готові"

  jap_armor.812:0 "Китай відмовився від угоди He-Umezu"
  jap_armor.812.d:0 "Китай почав свій шлях повернення Півночі, що призвело до прямого конфлікту з нашими холдингами у Східному Габеї. Незважаючи на наше співпереживання, вони повернули війська КМТ назад у регіон Шаньдун/ Гебей і вимагають від нас відмовитися від наших китайських власності. Наші військові готові, якщо ми будемо дотримуватися умов угоди і протистояти Кітаю на кордоні, а це, ймовірно, призведе до війни. Якщо ми коли-небудь навіть подивимося на можливість підписувати угоду, хто знає, чи слухатимуть наші військові..."
  jap_armor.812.a:0 "Таке порушення не дозволиться"
  jap_armor.812.b:0 "Час іти з Китаю"

  jap_armor.813.t:0 "Японія пропонує світ"
  jap_armor.813.d:0 "Коли Японія завоювала наш Далекий Схід, ми більше не можемо сподіватися відвоювати наші втрачені землі, які лежать за межами важкопрохідної місцевості і недоступні для нашого флоту. З цією мирною угодою ми зробимо наші віддалені території і Монголію Японії, відрізавши наш доступ до Тихого океану. Це, безсумнівно, трагічний результат... можливо, кілька років миру можуть допомогти нам відновитися, щоб підготувати нашу помсту і остаточну перемогу над Японією."
  jap_armor.813.a:0 "Зараз у нас буде мир..."
  jap_armor.813.b:0 "Ми ніколи не приймемо поразки."

  jap_armor.814.t:0 "Переворот молодих офіцерів пригнічений"
  jap_armor.814.desc:0 "Кілька молодих офіцерів не змогли захопити владу, але було вбито багато офіцерів і політиків, а також колишніх прем'єр-міністрів. Атаки на місто Токіо та Імператорський палац потрясли нас, але швидкі дії Сугії, який об'єднав великі сили проти повстанців, запобігли подальшій ескалації. У поєднанні з наказом Імператора, повстанці не мали надії на успіх, і багато з них зрештою покінчили життя самогубством."
  jap_armor.814.a:0 "Наша воля певна"

  jap_armor.815.t:0 "Катастрофа молодого офіцера"
  jap_armor.815.desc:0 "Група молодих офіцерів не змогла взяти на себе управління цим урядом, але багато офіцерів і політиків були вбиті, а також колишні прем'єр-міністри. Напади на Токійське місто і Імператорський палац залишили націю жахливою втратою та війною, незважаючи на наказ імператора про те, що повстанська армія повинна здатися, його воля не могла пройти до Повстанські війська і без жодної відповіді пішли кривавою багнюкою."
  jap_armor.815.a:0 "Наші військові були поділені"

  jap_armor.816.t:0 "[MEN.GetName] Запитує контроль над [927.GetName]"
  jap_armor.817.t:0 "[MEN.GetName] Запитує контроль над [621.GetName]"
  jap_armor.818.t:0 "[MEN.GetName] Запитує контроль над [941.GetName]"
  jap_armor.819.t:0 "[MEN.GetName] Запитує контроль над [926.GetName]"
  jap_armor.820.t:0 "[MEN.GetName] Запитує контроль над [746.GetName]"
  jap_armor.821.t:0 "[MEN.GetName] Запитує контроль над [948.GetName]"
  jap_armor.822.t:0 "[MEN.GetName] Запитує контроль над [756.GetName]"
  jap_armor.823.t:0 "[MEN.GetName] Запитує контроль над [788.GetName]"
  jap_armor.824.t:0 "[MEN.GetName] Запитує контроль над [330.GetName]"
  jap_armor.825.t:0 "[MEN.GetName] Запитує контроль над [789.GetName]"
  jap_armor.816.d:0 "Менцзяну було обіцяно всі монгольські території, коли він приєднався до нас проти китайців, було б мудро, якби ми прийняли нашу домовленість, давши їм обіцяну землю, яку ми щойно взяли."
  jap_armor.816.a:0 "Ми дамо їм це"
  jap_armor.816.b:0 "Ми виконаємо вимоги пізніше."

  jap_armor.826.t:0 "Сіамське запитання"
  jap_armor.826.d:0 "Завдяки нещодавньому союзу з Сіамом ми маємо абсолютну владу над ними. Щоб краще служити Сфері загального процвітання Східної Азії, ми можемо або перетворити їх на одного з наших підданих, або зробити повне вторгнення, щоб привести Сіам до Японської імперії."
  jap_armor.826.a:0 "Зробіть їх нашою темою"
  jap_armor.826.b:0 "Включити їх до імперії."

  jap_armor.827.t:0 "[MAN.GetName] запропонував створити уряд національної співпраці"
  jap_armor.827.d:0 "Тепер, коли повністю створено національний уряд Китаю, Пуйї запропонував об'єднати дві країни, щоб краще організувати китайську промисловість і виконати обіцянку, яку ми дали йому, ставши Якщо ми приймемо цю пропозицію, це, безсумнівно, призведе до сильнішої китайської маріонетки, але може відкрити двері для більш автономної держави."
  jap_armor.827.a:0 "Китай повинен залишатися розкольним"
  jap_armor.827.b:0 "Сильний Китай — сильна Японія"

  jap_armor.828.t:0 "[JAP.GetName] Відрікся уряду національної співпраці"
  jap_armor.828.d:0 "Японія, мабуть, побоюючись сильного Китаю, не дала нам голови в цьому об'єднанні."
  jap_armor.828.a:0 "Наше майбутнє в Японії"

  jap_armor.829.t:0 "[JAP.GetName]Підтверджує уряд національної співпраці"
  jap_armor.829.d:0 ""
  jap_armor.829.a:0 "Чудово."


  ss_recruitment_event.9.t:0 "Рекрутова кампанія в Німеччині"
  ss_recruitment_event.9.desc:0 "У цій титанській боротьбі за національне виживання ми повинні використовувати всі активи і всі переваги. СС хоче вербувати безпосередньо з готелю, де є багато людей, які з радістю беруть би в руки зброю і б воювали на нашому боці проти загрози глобального більшовизму.\n\nТоді як Вермахт в принципі погоджується з тим, що набір підхожих добровольців може бути корисним, Генерали ОКВ дуже твердо переконані, що будь-які іноземні добровольці повинні підкорятися військовому, а не Есесівське командування."
  ss_recruitment_event.9.a:0 "Тепер у нас є своя особиста армія."


  ger_armor.001.t:0 "Офіцери вермахту кидають виклик Гітлеру"
  ger_armor.001.d:0 "Повсюдне незадоволення правлінням Гітлера досягло апогею з нинішньою кризою, спричиненою ремілітаризацією Рейнської області. Ряд генералів Вермахту об’єдналися навколо відомого фельдмаршала Августа фона Мак - Кенсенена, який впровадив плани, спрямовані на скинення Гітлера і видалення нацистської партії з Німеччини. Через те що розкол у верховній армії Німеччини стає очевидним навіть за кордоном, іноземні держави вирішили не протестувати проти ремілітаризму, більш стурбованої внутрішньою німецькою нестабільністю. Старий фельдмаршал швидко зрушився з місця, створивши тимчасовий уряд, до якого стікалися десятки противників нацистського уряду. \n\n Військова революція вже йде повним ходом."
  ger_armor.001.a:0 "Позбудьтеся цих нацистських покидьків з наших земель!"

  ger_armor.857.t:0 "Гітлер знайдено мертвим"
  ger_armor.857.d:0 "З втратою Берліна Гітлер, який постійно повторював, що не покине міста, вирішив покінчити з собою, віддаючи перевагу смерті спостерігачеві за те, що антифашистські елементи загарбують владу в країні. Тепер він очолив Німеччину, сподіваючись врятувати армію і націю, а також радить вести переговори щодо часткової здачі її ворогам замість капітуляції"
  ger_armor.857.a:0 "Ми втратили надію"

  ger_armor.858.t:0 "Радянський Союз вимагає Сходу"
  ger_armor.858.d:0 "Радянський Союз намагається підтвердити претензію на Східну Польщу після того, як ми їх завоювали, вважаючи, що Європа належить як Німеччині, так і Радянському Союзу. Такі високі вимоги підкріплені силою, здається, наша агресивність на сході змусила комуністів побоюватися, що ми можемо напасти на них наступними. Зазвичай більшовикам було б легко поступитися, але Радянський Союз далеко не єдина наша турбота. Якщо ми погодимося з їхніми вимогами, це може дати нам час для боротьби з Заходом, хоча це також значно розведе східний фронт далі на захід."
  ger_armor.858.a:0 "Відкиньтеся від Сходу мирно."
  ger_armor.858.b:0 "Ми ставитьмо вимоги"

  ger_armor.859.t:0 "Амбіциозний Porsche"
  ger_armor.859.d:0 "У майбутньому нові танки Tiger матимуть дизайн Henschel, а не Porsche. Це не перешкодило Porsche вже почати виробництво своєї версії Tiger, і тепер у нас є корпуса 50, які в даний час не використовуються."
  ger_armor.859.a:0 "Ми повинні перетворити їх у важкі танки."

  ger_armor.860.t:0 "Новий важкий танк-рушувач"
  ger_armor.860.d:0 "Фердінанд Порше повернувся до нас з завершеним дизайном нового есмінця для важких танків на основі їхніх корпусів Tiger. Він здатний осідати більш довгим 88mm і має товсту броню, але його надійність викликає сумніви в його ефективності."
  ger_armor.860.a:0 "Ми називаємо їх на честь Фердінанда."
  ger_armor.860.a_tt:0 "Додати технологію§YФердінанд§!і додати§G50§!Фердінанд до запасів"

  ger_armor.861.t:0 "Амбіциозний Porsche"
  ger_armor.861.d:0 "В майбутньому нові танки Tiger матимуть дизайн Porsche, а не Henschel. На щастя для нас, це означає, що у нас є готові танки 50, і ми можемо офіційно почати виробництво з бонусом до ефективності."
  ger_armor.861.a:0 "На щастя для нас"

  ger_armor.862.t:0 "Навіщо помирати за Данціга?"
  ger_armor.862.d:0 "З нашим просуванням вперед війна була оголошена Польщі, і почалася завоювання німецької території, хоч би як ми були шоковані, союзники виконали свої зобов'язання і в відповідь оголосили нам війну. Це призводить до того, що більша частина наших військ виявляється на польському кордоні, і у нас немає планів продовжувати війну за Польщу. Нам знадобиться трохи часу, щоб організувати наше найвище командування для продовження боротьби."
  ger_armor.862.a:0 "Якщо вони хочуть війни, ми її віддамо."

  ger_armor.863.t:0 "Німеччина пропонує світ"
  ger_armor.863.d:0 "З досягненням осі повної перемоги в Європі та Радянському Союзі в руїнах Німеччини пропонує союзникам мирні умови. На жаль, без будь-якої важливої плацдарми в Європі наші шанси на перемогу малі, і, можливо, кілька років світу можуть допомогти нам підготуватися до можливої перемоги над Осею."
  ger_armor.863.a:0 "Ми приймаємо"
  ger_armor.863.b:0 "Ми ніколи не приймемо поразки."

  ger_armor.864.t:0 "Союзники невблаганно"
  ger_armor.864.d:0 "Навіть коли Сполучені Штати повністю переможені воювати проти нас, то все ж таки це малоймовірно, і ми повинні почати підготовку до вторгнення в США."
  ger_armor.864.a:0 "Дурні"



  ger_armor.866.t:0 "Німеччина пропонує припинити вогонь"
  ger_armor.866.d:0 "З сокирою ми проминули Урал, віднявши майже всю нашу промисловість, ми не можемо продовжувати військові зусилля, що б ми не робили, ми не можемо сподіватися повернути наші втрачені території. Німеччина запропонувала припинити вогонь, дозволивши нам залишити все на схід від Урала в обмін на припинення воєнних дій. Наші шанси на перемогу на цьому етапі малі, і, чесно кажучи, ми не отримаємо кращих умов, ніж це ... Можливо, кілька років миру можуть допомогти нам відновитися, щоб підготувати нашу помсту і остаточну перемогу проти осі."
  ger_armor.866.a:0 "Зараз у нас буде мир..."
  ger_armor.866.b:0 "Ми ніколи не приймемо поразки."

  ger_armor.867.t:0 "Радянські неслухняні"
  ger_armor.867.d:0 ""
  ger_armor.867.a:0 "Дурні"

  ger_armor.801.t:0 "Німеччина запропонувала союз"
  ger_armor.801.d:0 "Після наших територіальних втрат у зимовій війні німці звернулися до нас з запрошенням приєднатися до їхньої фракції. З вторгненням у Радянський Союз ми отримали можливість повернути наші землі і розширити наш вплив на всю Північну Скандинавію, це чудова можливість, але ми повинні бути впевнені, що Німеччина переможе. Є також шанс, що якщо ми не приймемо, ми будемо відкриватися для вторгнення в Осі в майбутньому."
  ger_armor.801.a:0 "Ми приймемо їхню пропозицію"
  ger_armor.801.b:0 "Ми не будемо втягуватися в нову війну."

  ger_armor.802.t:0 "Фінляндія приєдналася до осі"
  ger_armor.802.d:0 "Хоча між нашими урядами існують розбіжності, наша мета — знищити радянське лихо. Наші стосунки затягнулися ще до Зимової війни, і нашим народам час об'єднатися проти Ради, щоб відновити і встановити те, що по праву має бути. Німці пропонують союз проти Радянського Союзу заради величі наших народів і для того, щоб помститися за тих, хто був загублений для Ради."
  ger_armor.802.a:0 "Ми обіцяли помститися"

  ger_armor.803.t:0 "Фінляндія відмовилась від нашої пропозиції"
  ger_armor.803.d:0 "Фіни відмовилися і залишаються нейтральними щодо тих, хто колись їх образив, як могло їх уряд бути настільки слабким, щоб не скористатися можливістю помститися їм!"
  ger_armor.803.a:0 "Ми повинні подвоїти наші зусилля на Півночі."

  ger_armor.804.t:0 "Смерть Уолтера фон Рейхенау"
  ger_armor.804.d:0 "Три дні тому у Рейхенау стався крововилив у мозок після полювання під Полтавою при 40-градусному морозі, а сьогодні він помер під час польоту з Полтави в Лейпциг на лікування."
  ger_armor.804.a:0 "Ми оплакуватимемо цю втрату"
  GER_friedrich_paulus_available_tt:0 "§YФрідріх Паулюс§! буде доступний як генерал"

  ger_armor.805.t:0 "Смерть Фреска Тодта"
  ger_armor.805.d:0 "Восьмого лютого 1942 року, невдовзі після зльоту з аеродрома Вольфшанце під Рапенбургом у Східній Пруссії, літак Тодта раптово розбився.\n\nУ Берліні були проведені повні похорону, і тепер партія шукає заміну в якості нового міністра озброєнь. Багато людей дивляться на Альберта Шпеєра як на багатообіцяючого і амбіціозного чоловіка, який добре підходить для цієї ролі."
  ger_armor.805.a:0 "Ми оплакуватимемо цю втрату"

  ger_armor.806.t:0 "Смерть Ернста Удета"
  ger_armor.806.d:0 "Після невдачі повітряного бліцкрига проти Великобританії керівництво третього Рейха зрозумів недоліки головної ставки на авіацію тактичний підтримки сухопутних військ і Ґерінг, звинувачуючи у всіх лихах обмежив повноваження Після нападу на Радянський Союз, Ернст Вдет, генерал-полковник авіації, відчуваючи неспроможність забезпечити повітряну війну на два фронти, наклав на себе руки 17 листопада 1941 року."
  ger_armor.806.a:0 "Ми оплакуватимемо цю втрату"

  ger_armor.807.t:0 "Німеччина запрошує нас на вісь"
  ger_armor.807.d:0 "З війною на Балканах Німеччина звернулася до нас за згодою з обіцянками нової землі для нас, щоб володіти від Греції та Югославії, якщо ми приєднаємося до вісі."
  ger_armor.807.a:0 "Ми приймаємо їхнє запрошення"
  ger_armor.807.b:0 "Ми повинні залишатися нейтральними"

  ger_armor.808.t:0 "Болгарія зменшується"
  ger_armor.808.d:0 "Болгарія відхилила нашу пропозицію, і новий Балканський фронт навряд чи відкриється, якщо ми не змусимо його зробити це."
  ger_armor.808.a:0 "Ми дали їм простий варіант."
  ger_armor.808.b:0 "Можливо, для найкращого"

  ger_armor.809.t:0 "[JAP.GetName] пропонує дослідницький обмін"
  ger_armor.809.d:0 "Японія просить про обмін технологією, щоб допомогти модернізувати наш флот і допомогти модернізувати їх армію."
  ger_armor.809.a:0 "Ми приймаємо їхню пропозицію"
  ger_armor.809.b:0 "Нам не потрібен такий обмін."

  ger_armor.810.t:0 "[GER.GetName]Приймає дослідницький обмін"
  ger_armor.810.d:0 ""
  ger_armor.810.a:0 "Чудово."

  ger_armor.811.t:0 "[GER.GetName]Відкидає дослідницький обмін"
  ger_armor.811.d:0 ""
  ger_armor.811.a:0 "Сором"

  ger_armor.812.t:0 "Рудольф Гесс врятований"
  ger_armor.812.d:0 "З нашими глибокими нападами на Британію наші солдати наштовхнулися на тюремну камеру, в якій наш колишній голова партії Рудольф Гесс. Він здавався захопленим, коли ми взяли під свій контроль будівлю, посилаючись на німецьку славу і перевагу зруйнованого року Рейха, але не слід забувати про його дії після падіння Франції. Тепер залишається питання, що з ним робити?"
  ger_armor.812.a:0 "Ми не можемо дивитися на його вчинки."
  ger_armor.812.b:0 "Ми повинні відновити його звання."

  ger_armor.813.t:0 "[GER.GetName] потребує Ельзаса Лоррейна"
  ger_armor.813.d:0 "Німеччина знаходиться на шляху до повернення своєї колишньої слави, і це ставить їх у прямий конфлікт з нами, в даний час вони дивляться на Ельзас Лоррейн, законну французьку територію, якій колись володіли німці. Нам висунули ультиматум, віддали землю або вступили у війну."
  ger_armor.813.a:0 "Поки що це служить нашим інтересам."
  ger_armor.813.b:0 "Це обурливий запит"

  ger_armor.814.t:0 "[FRA.GetName] передаває Alsace Lorraine"
  ger_armor.814.d:0 "Франція вважає безплідним воювати з нами"
  ger_armor.814.a:0 "Сюрприз, щоб бути впевненим, але ласкаво просимо"

  ger_armor.815.t:0 "[FRA.GetName] відхиляє наш запит"
  ger_armor.815.d:0 ""
  ger_armor.815.a:0 "Тоді ми заберемо його силою."

  ger_armor.816.t:0 "[From.GetName] пропонує економічну інтеграцію"
  ger_armor.816.d:0 "Оскільки ми вже тісно переплетені, [From.GetNameDef] Я вирішив допомогти нам у розширенні нашої військової економіки шляхом більш повної інтеграції наших економік, і це дуже допомогло б нашому військовому росту, і зблизило б наші країни."
  ger_armor.816.a:0 "Чудова ідея"
  ger_armor.816.b:0 "Ми думаємо, що ні"

  ger_armor.817.t:0 "[From.GetName] приймає економічну інтеграцію"
  ger_armor.817.d:0 "Уряд [From.GetAdjective] повідомляє нам, що вони приймають нашу пропозицію з інтеграції наших військових економік."
  ger_armor.817.a:0 "Під нашою опікою їх армії розбухнуть."

  ger_armor.818.t:0 "[From.GetName] Відмова від економічної інтеграції"
  ger_armor.818.d:0 "Уряд [From.GetAdjective] повідомляє нам, що вони відкидають нашу пропозицію про інтеграцію наших військових економік."
  ger_armor.818.a:0 "Вони відкидають велич!"

  ger_armor.819.t:0 "Вибір нового розділу вермахта"
  ger_armor.819.d:0 "Наш перший крок у забезпеченні безпеки нашої нації - реформування і денацизм нашої армії, з очищенням СС у нас є три кандидати, які можуть впоратися з завданням і допомогти принести славу нашій новій армії."
  ger_armor.819.a:0 "Людвіг Бек виявився вірним"
  ger_armor.819.b:0 "Франц Холдер може стати цікавим"
  ger_armor.819.c:0 "Вальтер фон Браухіч буде хорошим варіантом"

  ger_armor.820.t:0 "Виберіть новий розділ люфтваффі"
  ger_armor.820.d:0 "Наш люфтвафе був заражений его Ґерінга, нижче наведено два кандидати, які допоможуть повернути честь люфтваффі і зробити його грізним мечем Німеччини."
  ger_armor.820.a:0 "Альберт Кессельінг є добрим кандидатом"
  ger_armor.820.b:0 "Риттер фон Грейм може працювати"

  ger_armor.821.t:0 "Вибираємо нову голову кригсмарину"
  ger_armor.821.d:0 "Кригсмарін виявився вірним Німеччині, а не нацистам, і ми повинні вибрати кандидата, який допоможе їм у цьому новому майбутньому."
  ger_armor.821.a:0 "Ерих Редер знищить флот"
  ger_armor.821.b:0 "Карл Доніц може завдати шкоди"

  ger_armor.823.t:0 "Оголошення про чотирилітній план"
  ger_armor.823.d:0 "Економічне чудо Німецького Рейху вразило не тільки німецький народ, але й міжнародну спільноту, нам потрібно стати на шлях економічної організації, і Адольф Гітлер оголосив про план, який повинен бути реалізовано в Протягом наступних чотирьох років, мета цього плану буде контролювати економіку, а також усунути незгоди всередині міністерства економіки між Яльмаром Шахтом і Германом Герінгом."
  ger_armor.823.a:0 "Шлях до величі!"

  ger_armor.824.t:0 "Німецька допомога"
  ger_armor.824.d:0 "Німеччина хоче отримати ексклюзивні права на матеріали, які ми виробляємо, і вони дозволять нам мати виняткові права на їхні ресурси, і, по суті, це непрограшна ситуація."
  ger_armor.824.a:0 "Ми приймаємо ці умови"
  ger_armor.824.b:0 "Ні, дякую, все буде добре."

  ger_armor.825.t:0 "Італія приймає"
  ger_armor.825.d:0 "Італія погодилася з нашими умовами, і між нашими країнами відкрилася вільніша торгівля, і інвестори вже відкрилися у Південному Тіролі, сподіваюся, це дозволить обом нашим країнам допомагати один одному в переозброєнні."
  ger_armor.825.a:0 "Чудово."

  ger_armor.826.t:0 "Італія знижується"
  ger_armor.826.d:0 "Італійці відхилили нашу пропозицію і відступили від Німеччини, і це може означати тільки те, що вони не хочуть приєднатися до нас і, можливо, шукають політики, яка б суперечила нашим планам."
  ger_armor.826.a:0 "Ми повинні стежити за ними."

  ger_armor.836.t:0 "Підтримка Циндао"
  ger_armor.836.d:0 "Німецький рейх звернувся до нас з пропозицією про подальшу підтримку за допомогою танків танків, хоч би як західні держави просили нас передати контроль над портовим містом Ціндао. Хоча думка про відмову від подальшої території є немислимою, вона може запобігти нападанню японців на неї, якщо почнеться війна."
  ger_armor.836.e:0 "Німецький рейх звернувся до нас з пропозицією про подальшу підтримку за допомогою танків танків, хоч би як західні держави просили нас передати контроль над портовим містом Ціндао. Хоча це суперечить нашій меті японської гегемонії, наявність союзника за межами Японії може виявитися дуже цінним."
  ger_armor.836.a:0 "Ми можемо домовитися про це."
  ger_armor.836.b:0 "Неприємно"

  ger_armor.837.t:0 "Китай підтримує Ціндао"
  ger_armor.837.d:0 "Китай погодився на нашу пропозицію, і в даний час здійснюються повільні поставки обладнання в Китай. Територія за межами Німеччини є великим національним досягненням і показала світові, що Рейх тут, щоб залишитися."
  ger_armor.837.a:0 "Китай володіє величезним потенціалом"

  ger_armor.838.t:0 "Китай відмовився від підтримки Ціндао"
  ger_armor.838.d:0 "Китай вирішив, що наша підтримка не перешкоджає відмові від території, тому відмовився прийняти нашу пропозицію."
  ger_armor.838.a:0 "Вони пошкодують про це"

  ger_armor.839.t:0 "Вторгнеться в Польщу?"
  ger_armor.839.d:0 "Оскільки Польща, схоже, знаходиться на програй стороні в їх війні і не має великих союзників, щоб допомогти їм, нам була надана чудова можливість скористатися будь-якими претензіями, які ми можемо мати на їхню країну перед тим, як вони потраплять у небезпечні руки."
  ger_armor.839.a:0 "Ми будемо захищати німецький народ."
  ger_armor.839.b:0 "Це занадто ризиковано."

  ger_armor.827.t:0 "Німеччина висунула ультиматум"
  ger_armor.827.d:0 "Німеччина дійшла висновку, що [From.GetName] Ми більше не можемо функціонувати як ефективний член Осі незалежно і висунула нам ультиматум. Або прийняти контроль Німеччини над нашим урядом і військовими, по суті, став маріонеткою, або ризикнути більш рішучою резолюцією."
  ger_armor.827.a:0 "Вони повинні поважати нашу силу!"
  ger_armor.827.b:0 "Ми будемо торгуватися за кращу позицію."
  ger_armor.827.c:0 "У нас немає іншого вибору, крім як прийняти"

  ger_armor.828.t:0 "[From.GetName] відмовляється"
  ger_armor.828.d:0 "[From.GetName] повністю відкидає ультиматум."
  ger_armor.828.a:0 "Тепер ми біжимо до сили"
  ger_armor.828.b:0 "Ми відступимо."

  ger_armor.829.t:0 "[From.GetName] Потрібно більшої автономії"
  ger_armor.829.d:0 "[From.GetName] Спираючись на твердження, що, хоча ми праві у своєму оці, вони хотіли б попросити більше автономії, ніж ми пропонуємо."
  ger_armor.829.a:0 "Ми дозволимо цьому."
  ger_armor.829.b:0 "Ми приймаємо тільки повний контроль."

  ger_armor.830.t:0 "[From.GetName] Згода"
  ger_armor.830.d:0 "[From.GetName] Вони вважають, що ситуація нестабільна і можуть призвести до потенційної кризи, тому наш ультиматум в обмін на негайну військову підтримку."
  ger_armor.830.a:0 "Це для більшого блага"

  ger_armor.835.t:0 "Німеччина відхиляє нашу пропозицію"
  ger_armor.835.d:0 "Німеччина відкинула все, крім тотального контролю, у нас залишилося два варіанти."
  ger_armor.835.a:0 "Ми просто не можемо прийняти це."
  ger_armor.835.b:0 "У нас немає іншого вибору, окрім як стати на коліна."

  germany.98.e:0 "Зробити хорватську ляльку."
  germany.99.e:0 "Розкол Греції між Болгарією та Італією"

  italy_empire:0 "Італійська імперія"

  ger_armor.831.t:0 "Німеччина оголошує війну!"
  ger_armor.831.d:0 "Схоже, Німеччина хоче піти на ці абсурдні вимоги..."
  ger_armor.831.a:0 "Наші шанси малі"

  ger_armor.832.t:0 "Німеччина взяла під повний контроль"
  ger_armor.832.d:0 "Після нашої відповіді Німеччина поставила нас під удар, і у нас немає іншого вибору, крім як залишатися на повідці, можливо, є надія відновити нашу автономію, якщо ми доведемо, що здатні"
  ger_armor.832.a:0 "Це для більшого блага"

  ger_armor.833.t:0 "Німеччина домінує"
  ger_armor.833.d:0 "Після нашої відповіді Німеччина дала нам деяку автономію і укріпила контроль над нашою країною, можливо, є надія відновити нашу автономію, якщо ми доведемо, що здатні"
  ger_armor.833.a:0 "Ми приречені"

  ger_armor.834.t:0 "Німеччина відступила"
  ger_armor.834.d:0 "Хоча ми залишаємося союзниками, напруженість стала високою, і це було б нерозсудливо довіряти Німеччині."
  ger_armor.834.a:0 "Ми уникнули катастрофи"

  ger_armor.840.t:0 "Доля Югославії"
  ger_armor.840.d:0 "Як лідер осі, Німеччина реорганізувала окуповану країну Югославію, щоб заспокоїти претензії всіх своїх союзників, а це також призвело до створення нової країни Хорватії для підтримки інтересів Гермни."
  ger_armor.840.a:0 "Ми подякували Німеччині за підтримку."

  ger_armor.841.t:0 "Доля Югославії"
  ger_armor.841.d:0 "Як лідер осі, Німеччина реорганізувала окуповану країну Югославію, щоб заспокоїти претензії всіх своїх союзників, а це також призвело до створення нової країни Хорватії для підтримки інтересів Гермни."
  ger_armor.841.a:0 "Ми подякували Німеччині за підтримку."

  ger_armor.842.t:0 "Доля Югославії"
  ger_armor.842.d:0 "Як лідер осі, Німеччина реорганізувала окуповану країну Югославію, щоб заспокоїти претензії всіх своїх союзників, а це також призвело до створення нової країни Хорватії для підтримки інтересів Гермни."
  ger_armor.842.a:0 "Ми повинні дати більше"

  ger_armor.843.t:0 "Доля Греції"
  ger_armor.843.d:0 "Як лідер осі, Німеччина реорганізувала окуповану Грецію, щоб заспокоїти претензії всіх своїх союзників."
  ger_armor.843.a:0 "Ми подякували Німеччині за підтримку."

  ger_armor.844.t:0 "Доля Греції"
  ger_armor.844.d:0 "Як лідер осі, Німеччина реорганізувала окуповану Грецію, щоб заспокоїти претензії всіх своїх союзників."
  ger_armor.844.a:0 "Ми подякували Німеччині за підтримку."

  ger_armor.845.t:0 "[GER.GetName] підштовхує нас до закриття економіки"
  ger_armor.845.d:0 "Оскільки Німеччина контролює Норвегії і важливий маршрут Нарвіка, вони дали нам наказ скоротити торгівлю з іншими країнами, які не є частиною Осі, це означатиме війну."
  ger_armor.845.a:0 "Реального вибору тут немає."
  ger_armor.845.b:0 "Ми залишимося бунтівниками до кінця!"

  ger_armor.846.t:0 "[SWE.GetName]Прийняти наші вимоги"
  ger_armor.846.d:0 "Швеція прийняла нашу пропозицію і почала накладати ембарго на Німеччину, ми повинні захистити їх за цю допомогу в військових зусиллях."
  ger_armor.846.a:0 "Гарні новини"

  ger_armor.847.t:0 "[SWE.GetName]Відкинути наші вимоги"
  ger_armor.847.d:0 "Шведи відмовилися, посилаючись на свій нейтралітет, і продовжують допомагати будь - якій країні, яка запитує, чи може вона допомогти у війні проти нас."
  ger_armor.847.a:0 "Ми роздамо їх через кілька днів."
  ger_armor.847.b:0 "Війна зі Швецією надто небезпечна"

  ger_armor.848.t:0 "Німеччина вимагає виняткових поставок вольфрама"
  ger_armor.848.d:0 "Після капітуляції Франції Німеччина панує у Західній Європі і вимагає припинити продаж вольфрамі за межами Осі. Вольфрам приносить величезні прибутки, але відкрито відмова від німецьких вимог може загрожувати нашому нейтралітету."
  ger_armor.848.a:0 "У нас немає можливості відмовити"

  ger_armor.849.t:0 "Португалія приймає наші вимоги"
  ger_armor.849.d:0 "Лісабон погодився обмежити зовнішню торгівлю, і Португальський вольфрам відтепер служитиме німецькою військовою промисловістю, а не нашим противникам."
  ger_armor.849.a:0 "Чудово."

  ger_armor.851.t:0 "Німеччина вимагає виняткових поставок хрома"
  ger_armor.851.d:0 "Після встановлення контролю над балканськими шляхами Німеччина повинна припинити продаж хрома країнами поза Осі. Цей метал критично важливий для німецького виробництва озброєнь, але вимоги поставить під загрозу наші відносини з Великобританією та Сполученими Штатами."
  ger_armor.851.a:0 "Зберігайте нейтралітет за свою поступливість"

  ger_armor.852.t:0 "Туреччина приймає наші вимоги"
  ger_armor.852.d:0 "Анкара погодилася обмежити зовнішню торгівлю, а поставки турецького хрома німецької промисловості тепер захищені від закупівель і тиску противника."
  ger_armor.852.a:0 "Наша промисловість отримає потрібний хром"

  ger_armor.855.t:0 "Португалія припиняє поставки вольфрама"
  ger_armor.855.d:0 "Висадка союзників в Нормандії виявила, що німецьке панування Західної Європи більше не є незаперечним, що Лісабон зняв обмеження на торгівлю з нашими ворогами і впровадив ембарго проти всіх країн Осі."
  ger_armor.855.a:0 "Португалія відповість за це"

  ger_armor.856.t:0 "Туреччина припиняє поставки хрома"
  ger_armor.856.d:0 "Після втрати Осью всього Крима Анкара більше не вважає Німеччину здатною захистити свої позиції в Чорноморському регіоні, Туреччина зняла обмеження на торгівлю з нашими ворогами і запровадила ембарго проти всіх країн Осі."
  ger_armor.856.a:0 "Ми втратили важливе джерело хрома"

  ger_armor.400.t:0 "Німецькі війська входять до Прибалтики."
  ger_armor.400.d:0 "Коли німецькі війська увійшли до Прибалтики, місцеві жителі вітали їх, сподіваючись відновити свою незалежність. Оскільки Оккупація за Радами була жорстокою, багато людей намагаються приєднатися до німців у їхній боротьбі проти Радянського Союзу."
  ger_armor.400.a:0 "Ми звільнимо всі землі більшовистської влади."
  german_entry_baltic:0 "У 15 - му вірші буде додано до кожного прибалтійського уряду, коли його буде завойовано."

  ger_armor.1007.t:0 "Німецькі війська входять до України"
  ger_armor.1007.d:0 "Коли німецькі війська увійшли до України, вони вітали місцевих жителів, сподіваючись незалежності від Радянського Союзу, особливо після голоду. Багато людей намагаються приєднатися до німців у боротьбі проти Радянського Союзу."
  ger_armor.1007.a:0 "Ми звільнимо всі землі більшовистської влади."
  german_entry_ukraine:0 "15 Остерігання буде додане до всіх країн України, коли вони будуть завойовані."

  ger_armor.424.t:0 "Італія просить у Хорватії Далмації"
  ger_armor.424.d:0 "Італійський уряд спрямував нам запит про їхній прямий аннексія держави Далмація біля нашого балканського маріонетичного держави Хорватія. Вони твердять, що, оскільки початкова окупація і маріонеткова держава були технічним союзом між німецькими та італійськими силами, то, якщо вони хочуть цієї держави від Хорватії, вони повинні отримати його."
  ger_armor.424.a:0 "Вони ввічливо запитали, так що я вважаю"
  ger_armor.424.b:0 "Третього рейху не повинно турбувати"

  soviet.13.b:0 "Ми повинні відступити."

  soviet.65.t:0 "Радянський Союз вимагає анексії"
  soviet.65.d:0 "Щоб відновити стратегічну поступку Японії, Радянський Союз вимагає нашої анкети."
  soviet.65.a:0 "Давайте разом будувати наше майбутнє, товариші."
  soviet.65.b:0 "Краще мертвий, ніж червоний!"

  soviet.66.t:0 "Синьцзян погодився"
  soviet.66.d:0 "Уряд Сінцзяна прийняв мудре рішення приєднатися до славного союзу."
  soviet.66.a:0 "Вітаємо, товариші."

  soviet.67.t:0 "Синьцзян заперечує"
  soviet.67.d:0 "Уряд Сінцзяна прийняв сумне рішення не приймати нашої дуже щедрої пропозиції."
  soviet.67.a:0 "Ніхто нам не відкаже!"

  soviet.68.t:0 "Радянський Союз вимагає підкорення"
  soviet.68.d:0 "Коли залишилися китайські війська, війська Шен Шікай та радянські війська взяли під свій контроль країну, і Коммуністи заснували наш новий уряд під сильним радянським впливом. Оскільки ми отримали їхню допомогу, вони вимагають ще більшого контролю."
  soviet.68.a:0 "Ми приєднаємося до наших братів, щоб відплатити їм за їхню цінну допомогу."
  soviet.68.b:0 "Ми їм нічого не винні!"

  soviet.69.t:0 "Синьцзян погодився"
  soviet.69.d:0 "Уряд Шекай прийняв нашу люб'язну пропозицію, і це повинно бути адекватною оплатою за нашу допомогу."
  soviet.69.a:0 "Угода стає все більшою!"

  soviet.70.t:0 "Синьцзян заперечує"
  soviet.70.d:0 "Уряд Шан Шікай відхилив нашу пропозицію членства в Союзі, і вони стверджують, що ми вже повністю погашені."
  soviet.70.a:0 "Вони заплатять."

  soviet.71.t:0 "США схвалили оренду їжі для нас"
  soviet.71.d:0 "Вашингтон оголосив, що вони схвалили кредитну оренду такої необхідної їжі, аби допомогти у нашій Славній боротьбі. Протягом наступних декількох років для харчування громадян Радянського Союзу буде поставлено понад тонн їжі 3,000, тисяч, а голодомор вже знищив нашу здатність виробляти їжу. З втратою українських територій кровожерним німцям ми не могли б протриматися без допомоги капіталістів."
  soviet.71.a:0 "Дуже щедрі американці"

  soviet.72.t:0 "США планують побудувати залізниці"
  soviet.72.d:0 "Вашингтон оголосив, що вони схвалили кредитну оренду і призначили інженерів до Радянського Союзу для будівництва і модернізації нашої залізничної мережі. Оскільки більшість регіонів з високою інфраструктурою в Європі були захоплені нацистами, ми відчайдушно потребуємо ланцюгів поставок між Москвою і промисловими комплексами на Уралі. США планують подвоїти кількість залізниць у Радянському Союзі, щоб ми могли адекватно реагувати на фашистську загрозу."
  soviet.72.a:0 "Надіслати коментар до FDR"

  soviet.73.t:0 "США планують забезпечити нас паливом"
  soviet.73.d:0 "Вашингтон оголосив, що схвалив оренду високооктанового палива для наших літаків, хоча ми продовжуємо виробляти велику частину нафти і палива, які нам потрібні, наші методи очищення відсутні. Оскільки ми не можемо виробляти високоякісне і високооктанове паливо, необхідне для сучасних літаків, США вступають, щоб допомогти нам. Оскільки вони планують забезпечити більше половини нашої авіаплівки за будівництво нафтопереробних заводів, ми зможемо виробляти відповідне паливо, необхідне для знищення люфтваффу."
  soviet.73.a:0 "Дуже проникливі капіталісти"

  soviet.74.t:0 "Сполучені Штати Америки також ухвалили алюмінію"
  soviet.74.d:0 "Вашингтон оголосив, що схвалив оренду високої сталі та алюмінію для допомоги у Великій Отці. Поки ми зосереджуємося на екстреному масовому виробництві військових матеріалів для оснащення Червоною Армією, якість зазнала шкоди. На щастя, американці планували зробити більшу частину сталевої броні для наших танків і більше половини необхідного авіаційного класу. За допомогою цих додаткових ресурсів ми зможемо відбитися від нацистського вторгнення."
  soviet.74.a:0 "Ми повинні дати американцям зрозуміти, що ми вдячні."

  soviet.75.t:0 "США планують надати нам громадянські заводи"
  soviet.75.d:0 "Вашингтон оголосив, що вони схвалили оренду упаковованих заводів та призначення інженерів у Радянський Союз, щоб допомогти нам поліпшити наше громадянське виробництво. Допомагаючи нам пересувати і будувати громадські заводи, ми можемо значно збільшити темпи відновлення нашої громадянської економіки після первинного впливу німців."
  soviet.75.a:0 "Щиро дякую, США."

  soviet.76.t:0 "США планують надати нам військові заводи"
  soviet.76.d:0 "Вашингтон оголосив, що вони схвалили оренду високоякісного військового обладнання, завдяки більш високому якості обладнання та інструментів наше виробництво буде значно збільшене. Ми повинні перевипробувати німців, якщо у нас є шанс перемогти, за допомогою американського промислового потенціалу наша промисловість буде запущена, і ми зможемо виграти війну."
  soviet.76.a:0 "Тост за американців"

  soviet.77.t:0 "США будують Перський коридор"
  soviet.77.d:0 "Вашингтон оголосив, що схвалив будівництво великої залізничної системи в Персії, аби допомогти безпосередньо позичати оренду через Кавказ, щоб уникнути німецьких підводних човнів."
  soviet.77.a:0 "Чудовий маршрут для оренди"

  sov_armor.853.t:0 "Німеччина відступає від Сходу"
  sov_armor.853.d:0 "Після тиску на Німеччину, щоб вона піддалася нашим законним вимогам щодо Східної Польщі, вони погодились поступитися тим, що ми вимагали, без подальшого конфлікту. Німеччина — друг Радянського Союзу"
  sov_armor.853.a:0 "Вітаємо наших польських друзів!"

  sov_armor.854.t:0 "Німеччина відмовилася поступитися Сходом"
  sov_armor.854.d:0 "Незважаючи на наші зусилля мирно залагодити суперечку з Німеччиною, вони відмовилися поступитися Східною Польщею, і це чітко показує, що вони мають намір і далі завойовувати схід, і ми слідуємо за ними. Ми повинні мобілізувати наші сили і рішуче натиснути на Захід, перш ніж Німеччина встигне завершити будь-які приготування."
  sov_armor.854.a:0 "Без сумнівів"

  sov_armor.800.t:0 "Професор Євгеній Оскаровіч Патон"
  sov_armor.800.d:0 "Патон був першопрохідцем у сфері технології з'єднання і зварювання. Щоб зробити зварку надійним технологічним процесом, необхідно було провести комплексні дослідження механіки зварних конструкцій, пов'язаних з ними металургічних процесів і фізики дуги, а також розробити Патон розробив методи проектування раціональних прольотних мостів, досліджував умови їхньої експлуатації, запропонував методи відновлення пошкоджених мостів. Він вивчав основи зварювання, розрахунки твердостіварних конструкцій, механізацію зварних процесів, проектування автоматичного зварювання під флюсом. Протягом Великої Зечинної війни було розроблено обладнання та технології для виготовлення танків, бомб та інших машин."
  sov_armor.800.a:0 "Присвоїти йому звання Героя Соціалістичного труда!"

  sov_armor.700.t:0 "Бомбардування Горького"
  sov_armor.700.d:0 "Німецька авіалінія, осінь 1941 року, зруйнувала промисловий потенціал міста, і найбільше шкоди для нього було завдано автомобільному заводу Молотва. Протягом війни ворожі бомбардувальники здійснили 43 нальоти, 26 нальотів вночі, а на місто було скинено 33 934 запальних бомб і 1631 фугас."
  sov_armor.700.a:0 "Оце незадача!"

  sov_armor.801.t:0 "Великобританія запропонувала Ірану вторгнення"
  sov_armor.801.d:0 "Великобританія пропонує спільні зусилля для окупації Ірану, щоб позбавити Німеччину та її союзників доступу до її запасів нафти, і якщо ми досягнемо успіху, ми займемо північ, що з'єднує Кавказ з Центральною Азією, а британці - південь."
  sov_armor.801.a:0 "Ми приймаємо ці плани"
  sov_armor.801.b:0 "Ми не можемо пощадити роботу"

  sov_armor.804.t:0 "Соціалістичний реалізм"
  sov_armor.804.d:0 "Наше Департамент культури прагне, щоб ми могли контролювати не тільки наше мистецтво, але й нашу музику та культуру в цілому, щоб зосередитися на найважливішому, на повсякденному прольоті. Соціалістичний реалізм покаже працю чоловіків і жінок, чия робота зробила Радянський Союз такою країною, якою вона є сьогодні, і допомагає продовжити ідеали комунізму. Завдяки нашому партнерству з Асоціацією художників революційної Росії, Товариством художників-станковістів і союзом радянських письменників ми можемо просувати нашу культуру, заохочуючи наших людей просувати вперед нашу Ми повинні визначити, на якій галузі ми зосередимося."
  sov_armor.804.a:0 "Надихнути робітників"
  sov_armor.804.b:0 "Надихнути народ"
  sov_armor.804.c:0 "Надихнути армію"
  sov_armor.804.e:0 "Надихнути партизан"

  sov_armor.809.t:0 "Повернення Західної Білорусії та України"
  sov_armor.809.d:0 "Нашими недавніми перемогами ми повернули собі територію, яку в результаті війни з поляками, і знову включили цей регіон до союзу, давайте привітаємо наших звільнених робітників!"
  sov_armor.809.a:0 "Ласкаво просимо в Союз, товариші!"

  sov_armor.817.t:0 "Набрано 10 резервних дивізій"
  sov_armor.817.d:0 "Не розширюючи нашу сталу армію, наші офіцери виконали завдання підготовки 100 000 людей для використання в наших резервах. Ці люди будуть життєво необхідні в разі початку війни, коли нам знадобиться негайне розширення армії."
  sov_armor.817.a:0 "Чудово."
  sov_armor.817.b:0 "Продовжити підготовку резервістів"

  sov_armor.851.t:0 "[SOV.GetName] пропонує світ"
  sov_armor.851.d:0 "Після довгих місяців війни було вчинено багато кровопролиття з беззмістовними вигодами, а Рада стверджує, що настав час припинити військові дії і відступити до кордонів кожної країни. Це величезна перемога для нас і доводить, що Фінляндія може протистояти навіть впливові гігантського ведмедя!"
  sov_armor.851.a:0 "Ми добилися перемоги!"

  sov_armor.820.t:0 "Новоприйнятливі працівники"
  sov_armor.820.d:0 "З ростом нашої промисловості, наш персонал стає все більш здібним до нашого століття індустріалізації і виконує свої обов'язки на хорошому рівні. З часом дедалі більше працівників набувають досвіду, і ми можемо повністю використовувати нашу велику промисловість."
  sov_armor.820.a:0 "Дивовижно"
  sov_armor.820.a_tt:0 "Зменшує штраф від §YНизккваліфіковані працівники§!"

  sov_armor.830.t:0 "Відновлення виробництва"
  sov_armor.830.d:0 "У міру евакуації промисловості наші військові заводи налагодять випуск військової техніки необхідної для ведення війни. З часом все більше підприємств виходять на високі показники продуктивності праці, і ми можемо повністю використовувати наш воєнно-промисловий комплекс."
  sov_armor.830.a:0 "Прийнято до відома"
  sov_armor.830.a_tt:0 "Зменшує штраф від §YЕвакуація промисловості§!"

  SOV_can_be_infiltrated:0 "§HПідбадьорення агентури можливо§!.\n"


  sov_armor.829.t:0 "[SOV.GetAdjective] Перемога в Пермі"
  sov_armor.829.d:0 "Після зіткнення сил [SOV.GetAdjective] і [GER.GetAdjective] у прикордонній зоні навколо Пермі лінія [GER.GetAdjective] Зламалася. [SOV.GetAdjective] Швидко взяли на себе ініціативу в відправці партизан, обладнання та поставок через прогалини і створення антинімецьких активістів в Пермі."
  sov_armor.829.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.829.b:0 "Ми повинні підготувати відповідну відповідь."

  sov_armor.830.t:0 "Поразка [SOV.GetAdjective] у Пермі"
  sov_armor.830.d:0 "Після зіткнення сил [SOV.GetAdjective] і [GER.GetAdjective] у прикордонній зоні навколо Пермі сили [SOV.GetAdjective] Вони були переможені і були змушені відступити."
  sov_armor.830.a:0 "Наступного разу доведеться постаратися трохи краще."
  sov_armor.830.b:0 "Наша лінія міцна"

  sov_armor.831.t:0 "Тупик в Пермі"
  sov_armor.831.d:0 "Бойові дії між силами [SOV.GetAdjective] і [GER.GetAdjective] в Пермі припинилися після того, як обидві сторони покинули конфлікт, щоб перегрупуватися і поповнювати запаси."
  sov_armor.831.a:0 "Ми повинні підготуватися до наступного втручання."

  sov_armor.832.t:0 "Інфільтрація [SOV.GetAdjective] у Пермі"
  sov_armor.832.d:0 "Після відсутності сил [GER.GetAdjective] підрозділ [SOV.GetAdjective] Швидко взяли на себе ініціативу в відправці партизан, обладнання та поставок через прогалини і створення антинімецьких активістів в Пермі."
  sov_armor.832.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.832.b:0 "Ми не можемо покинути Східний фронт."

  sov_armor.833.t:0 "[SOV.GetAdjective] Перемога в UFA"
  sov_armor.833.d:0 "Після зіткнення між силами [SOV.GetAdjective] і [GER.GetAdjective] в прикордонній зоні навколо UFA лінія [GER.GetAdjective] Зламалася. [SOV.GetAdjective] швидко використовували можливості для відсилання партизан, обладнання і поставок через пробіли і створення антинімецьких активістів в UFA.\n\n"
  sov_armor.833.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.833.b:0 "Ми повинні підготувати відповідну відповідь."

  sov_armor.834.t:0 "Поразка [SOV.GetAdjective] в UFA"
  sov_armor.834.d:0 "Після зіткнення між силами [SOV.GetAdjective] і [GER.GetAdjective] в прикордонній зоні навколо УФА сили [SOV.GetAdjective] Вони були переможені і були змушені відступити."
  sov_armor.834.a:0 "Наступного разу доведеться постаратися трохи краще."
  sov_armor.834.b:0 "Наша лінія міцна"

  sov_armor.835.t:0 "Тупик в UFA"
  sov_armor.835.d:0 "Бої між силами [SOV.GetAdjective] і [GER.GetAdjective] навколо UFA припинилися після того, як обидві сторони вийшли з оспаруваного регіону для перегрупування і поповнення запасів."
  sov_armor.835.a:0 "Ми повинні підготуватися до наступного втручання."

  sov_armor.836.t:0 "Інфільтрація [SOV.GetAdjective] в UFA"
  sov_armor.836.d:0 "Після відсутності сил [GER.GetAdjective] підрозділ [SOV.GetAdjective] швидко взяли на себе ініціативу щодо відправки партизан, обладнання та поставок через прогалини і створення антинімецьких активістів в UFA."
  sov_armor.836.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.836.b:0 "Ми не можемо покинути Східний фронт."

  sov_armor.837.t:0 "[SOV.GetAdjective] Перемога в Оренбурзі"
  sov_armor.837.d:0 "Після зіткнення між силами [SOV.GetAdjective] і [GER.GetAdjective] в прикордонній зоні навколо Оренбурга лінія [GER.GetAdjective] Зламалася. [SOV.GetAdjective] Швидко взяли на себе ініціативу, щоб відправити партизан, обладнання та поставки через прогалини і створити антинімецьких активістів в Оренбурзі."
  sov_armor.837.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.837.b:0 "Ми повинні підготувати відповідну відповідь."

  sov_armor.838.t:0 "Поразка [SOV.GetAdjective] в Оренбурзі"
  sov_armor.838.d:0 "Після зіткнення між силами [SOV.GetAdjective] і [GER.GetAdjective] в прикордонній зоні навколо Оренбурга сили [SOV.GetAdjective] Вони були переможені і були змушені відступити."
  sov_armor.838.a:0 "Наступного разу доведеться постаратися трохи краще."
  sov_armor.838.b:0 "Наша лінія міцна"

  sov_armor.839.t:0 "Тупик в Оренбурзі"
  sov_armor.839.d:0 "Бої між силами [SOV.GetAdjective] і [GER.GetAdjective] Оренбург вщухав після того, як обидві сторони вийшли з ураженого регіону для перегрупування і поповнення запасів."
  sov_armor.839.a:0 "Ми повинні підготуватися до наступного втручання."

  sov_armor.840.t:0 "Інфільтрація [SOV.GetAdjective] в Оренбурзі"
  sov_armor.840.d:0 "Після відсутності сил [GER.GetAdjective] підрозділ [SOV.GetAdjective] Швидко взяли на себе ініціативу, щоб відправити партизан, обладнання та поставки через прогалини і створити антинімецьких активістів в Оренбурзі."
  sov_armor.840.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.840.b:0 "Ми не можемо покинути Східний фронт."

  sov_armor.841.t:0 "[SOV.GetAdjective] Перемога на Уралі"
  sov_armor.841.d:0 "Після зіткнення сил [SOV.GetAdjective] і [GER.GetAdjective] у прикордонній зоні навколо Уральська лінія [GER.GetAdjective] Зламалася. [SOV.GetAdjective] Швидко взялися за перевезення партизанів, обладнання та поставок через прогалини і створення антинімецьких активістів у Уральську."
  sov_armor.841.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.841.b:0 "Ми повинні підготувати відповідну відповідь."

  sov_armor.842.t:0 "Поразка [SOV.GetAdjective] у Уральську"
  sov_armor.842.d:0 "Після зіткнення сил [SOV.GetAdjective] і [GER.GetAdjective] в прикордонній зоні навколо Уральська сили [SOV.GetAdjective] Вони були переможені і були змушені відступити."
  sov_armor.842.a:0 "Наступного разу доведеться постаратися трохи краще."
  sov_armor.842.b:0 "Наша лінія міцна"

  sov_armor.843.t:0 "Тупик у Уральську"
  sov_armor.843.d:0 "Бої між силами [SOV.GetAdjective] і [GER.GetAdjective] У Уральска припинилася після того, як обидві сторони вийшли з оспаруваного регіону для перегрупування і поповнення запасів."
  sov_armor.843.a:0 "Ми повинні підготуватися до наступного втручання."

  sov_armor.844.t:0 "Інфільтрація [SOV.GetAdjective] у Уральську"
  sov_armor.844.d:0 "Після відсутності сил [GER.GetAdjective] підрозділ [SOV.GetAdjective] Швидко взялися за перевезення партизанів, обладнання та поставок через прогалини і створення антинімецьких активістів у Уральську."
  sov_armor.844.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.844.b:0 "Ми не можемо покинути Східний фронт."

  sov_armor.845.t:0 "[SOV.GetAdjective] Перемога в Гур’єві"
  sov_armor.845.d:0 "Після зіткнення сил [SOV.GetAdjective] і [GER.GetAdjective] у прикордонній зоні навколо Гур’єва лінія [GER.GetAdjective] Зламалася. [SOV.GetAdjective] Швидко взяли на себе ініціативу у відправці партизан, обладнання та поставок через прогалини і створення антинімецьких активістів у Гур’єві."
  sov_armor.845.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.845.b:0 "Ми повинні підготувати відповідну відповідь."

  sov_armor.846.t:0 "Поразка [SOV.GetAdjective] у Ґурієва"
  sov_armor.846.d:0 "Після зіткнення сил [SOV.GetAdjective] і [GER.GetAdjective] у прикордонній зоні навколо Гур’єва сили [SOV.GetAdjective] Вони були переможені і були змушені відступити."
  sov_armor.846.a:0 "Наступного разу доведеться постаратися трохи краще."
  sov_armor.846.b:0 "Наша лінія міцна"

  sov_armor.847.t:0 "Тупик у Гур’єві"
  sov_armor.847.d:0 "Бойові дії між силами [SOV.GetAdjective] і [GER.GetAdjective] Гур’єва система припинилася після того, як обидві сторони вийшли з ураженого регіону для перегрупування і поповнення запасів."
  sov_armor.847.a:0 "Ми повинні підготуватися до наступного втручання."

  sov_armor.848.t:0 "Інфільтрація [SOV.GetAdjective] в Гурьєве"
  sov_armor.848.d:0 "Після відсутності сил [GER.GetAdjective] підрозділ [SOV.GetAdjective] Швидко взяли на себе ініціативу у відправці партизан, обладнання та поставок через прогалини і створення антинімецьких активістів у Гур’єві."
  sov_armor.848.a:0 "Ми поволі наздоганяємо нашу контратаку."
  sov_armor.848.b:0 "Ми не можемо покинути Східний фронт."

  imperial_federation_fail_tt:0 "§RСтворення Імперської федерації зазна́є невдачі.§!"
  mtg_britain.104.b:0 "Без Росії ми не можемо продовжувати"

  eng_armor.804.t:0 "Росія вимагає миру"
  eng_armor.804.d:0 ""
  eng_armor.804.a:0 "Прийняти світ"
  eng_armor.804.b:0 "Відкидайте світ"

  eng_armor.805.t:0 "Великобританія вимагає від нас ввести ембарго проти Німеччини"
  eng_armor.805.d:0 "З порушенням німецької нейтральності Бенілюкса з’єднане Королівство робить на нас тиск, щоб допомогти зупинити німецьку агресію. Відключивши наші поставки ресурсів до Німеччини, ми сподіваємося, що вони побачать помилку у своїх шляхах і будуть прагнути миру в Європі. Ми зробимо це, щоб бути в солідарності з нейтральними країнами світу і запобігти ще одну війну."
  eng_armor.805.a:0 "За мир!"
  eng_armor.805.b:0 "Ми не хочемо порушувати наш нейтралітет."

  eng_armor.806.t:0 "Швеція прийняла ембарго"
  eng_armor.806.d:0 "Швеція прийняла нашу пропозицію і почала накладати ембарго на Німеччину, ми повинні захистити їх за цю допомогу в військових зусиллях."
  eng_armor.806.a:0 "Гарні новини"

  eng_armor.807.t:0 "Швеція відмовилася від ембарго"
  eng_armor.807.d:0 "Шведи відмовилися, посилаючись на свою нейтральну позицію, і далі допомагають німцям боротися проти нас, і ми мусимо вжити заходів, щоб зупинити це!"
  eng_armor.807.a:0 "Ми повинні зупинити потік заліза будь-якою ціною."

  eng_armor.808.t:0 "Німеччина відновлює торгівлю"
  eng_armor.808.d:0 "Катастрофічна охорона наших скандинавських братів призвела до їхнього знищення, і тепер німці звернулися до нас з вимогами відновити нашу торгівлю з ними з загрозою вторгнення. Щоб запобігти власним знищенню і втраті демократії, у нас немає іншого вибору, окрім того, як поступити їхнім вимогам."
  eng_armor.808.a:0 "Ми неохоче приймаємо."
  eng_armor.808.b:0 "Ми не піддамося тиранам!"

  eng_armor.809.t:0 "Швеція відкриває торгівлю"
  eng_armor.809.d:0 "Шведський уряд виконав наші домовленості і зняв ембарго, і залізниця буде текти."
  eng_armor.809.a:0 "Дуже добре, ми могли б пощадити їх ще"

  eng_armor.810.t:0 "Швеція відмовилася відкривати торгівлю"
  eng_armor.810.d:0 "Шведи відмовилися виконати наші вимоги і підтримали Британію проти нас, ми ставимо їх на їхнє місце."
  eng_armor.810.a:0 "Дас Айн Бетель!"

  eng_armor.811.t:0 "Шведське ембарго"
  eng_armor.811.d:0 "Великобританія використала Норвегію як засіб, щоб змусити Швеції припинити торгівлю з нами, ми повинні завоювати Норвегію, щоб змусити шведів відновити торгівлю з нами."
  eng_armor.811.a:0 "Це катастрофа для нашого виробництва."
  eng_armor.811.b:0 "Ми повинні помститися!"

  eng_armor.812.t:0 "Британські ембарго - наша країна"
  eng_armor.812.d:0 "Великобританія наклала на нас повне ембарго після наших недавніх політичних дій, багато країн, союзницькі під Британією, також дотримувалися їх декларації. Ми повинні шукати інші ресурси, які нам потрібні."
  eng_armor.812.a:0 "Ми втратили життєво важливих постачальників ресурсів."

  eng_armor.813.t:0 "[PER.GetName] Потрібно миру"
  eng_armor.813.d:0 "Після нашого завоювання більшою частиною Персії [From.GetName] запрошений пожежою і прийме часткову окупацію країни, поки війна в Європі не закінчиться."
  eng_armor.813.a:0 "Ми розділимо Північ і Захід"
  eng_armor.813.b:0 "Ми хочемо повної окупації"

  eng_armor.814.t:0 "[ENG.GetName] вимагає повної капітуляції"
  eng_armor.814.d:0 "Після нашого завоювання більшою частиною Персії [From.GetName] запрошений пожежою і прийме часткову окупацію країни, поки війна в Європі не закінчиться."
  eng_armor.814.a:0 "Ми будемо входити в"
  eng_armor.814.b:0 "Ці вимоги абсурдні!"

  eng_armor.815.t:0 "Евакууватися в Канаду?"
  eng_armor.815.d:0 "Ми стикаємося з можливістю поразки на нашому материку, чи повинні ми евакуювати уряд і королівську родину в Канаду, щоб забезпечити продовження нашої боротьби?"
  eng_armor.815.a:0 "Ми повернемося"
  eng_armor.815.b:0 "Ми стоїмо і вмираємо у Великобританії."
  population_evacuates_tt:0 "§RПриблизно мільйон чоловік евакуюються в Канаду.§!"

  eng_armor.818.t:0 "Теракт у Північній Ірландії"
  eng_armor.818.d:0 "Після нашої окупації Ірландії фракція ІРА почала атакувати Північну Ірландію на знак протесту проти нашої окупації Ірландії. Намагаючись цілковитої незалежності від Великобританії, ІРА заявила, що чекає наступні атаки, поки вони не досягнуть своєї мети."
  eng_armor.818.e:0 "Після останньої атаки ІРА знову атакувала фабрики і інфраструктуру в Північній Ірландії, здається, що кінця не видно, поки ми не викинемо їх або не задовольнимо їх вимог."
  eng_armor.818.f:0 "Після закінчення нашого конфлікту з ІРА позосталі незгідні намагалися напасти на Північну Ірландію, але були зупинені; радікали були арештовані, і поліція переконана, що подальших нападів не варто очікувати."
  eng_armor.818.a:0 "Ми повинні розібратися з цим."
  eng_armor.818.b:0 "Браво"

  eng_armor.819.t:0 "Теракт у Лондоні"
  eng_armor.819.d:0 "Після нашої окупації Ірландії, фракція-їзгою, що викликає себе ІРА, розпочала терористичну атаку в Лондоні на знак протесту проти нашої окупації Ірландії. Намагаючись цілковитої незалежності від Великобританії, ІРА заявила, що чекає наступні атаки, поки вони не досягнуть своєї мети."
  eng_armor.819.e:0 "Після останньої атаки ІРА знову атакувала заводи і інфраструктуру в Лондоні, здається, що кінця не видно, поки ми не викинемо їх або не задовольнимо їх вимоги."
  eng_armor.819.f:0 "Після закінчення нашого конфлікту з ІРА позосталі незгідні намагалися атакувати Лондон, але були відбудовані, радікали були арештовані, і поліція впевнена, що подальших нападів чекати не варто."
  eng_armor.819.a:0 "Це має закінчитися швидко"
  eng_armor.819.b:0 "Браво"

  eng_armor.820.t:0 "Теракт у Бірмінгемі"
  eng_armor.820.d:0 "Після нашої окупації Ірландії фракція ІРА розпочала терористичну атаку в Бірмінгемі на знак протесту проти нашої окупації Ірландії. Намагаючись цілковитої незалежності від Великобританії, ІРА заявила, що чекає наступні атаки, поки вони не досягнуть своєї мети."
  eng_armor.820.e:0 "Після останньої атаки ІРА знову атакувала фабрики та інфраструктуру в Бірмінгемі, і здається, що кінця не видно, поки ми не вирвемо їх або не задовольнимо їх вимоги."
  eng_armor.820.f:0 "Після закінчення нашого конфлікту з ІРА позосталі незгідні намагалися атакувати Бірмінгем, але були відбудовані, радікали були арештовані, і поліція впевнена, що подальших нападів не варто очікувати."
  eng_armor.820.a:0 "Ми не можемо здатися"
  eng_armor.820.b:0 "Браво"

  eng_armor.821.t:0 "Теракт Ліверпуля"
  eng_armor.821.d:0 "Після нашої окупації Ірландії фракція ІРА почала атакувати в Ліверпулі на знак протесту проти нашої окупації Ірландії. Намагаючись цілковитої незалежності від Великобританії, ІРА заявила, що чекає наступні атаки, поки вони не досягнуть своєї мети."
  eng_armor.821.e:0 "Після останньої атаки ІРА знову атакувала фабрики і інфраструктуру в Ліверпулі, і здається, що ми не бачимо кінця, поки не викинемо їх або не задовольнимо їх вимог."
  eng_armor.821.f:0 "Після закінчення нашого конфлікту з ІРА позосталі неслухняні намагалися атакувати Ліверпуль, але були відбудовані, радікали були арештовані, і поліція впевнена, що подальших нападів не варто очікувати."
  eng_armor.821.a:0 "У нас криза в руках"
  eng_armor.821.b:0 "Браво"

  eng_armor.822.t:0 "Теракт у Шеффілді"
  eng_armor.822.d:0 "Після нашої окупації Ірландії фракція-їзгой, називаючи себе ІРА, розпочала терористичний напад у Шеффілді на знак протесту проти нашої окупації Ірландії. Намагаючись цілковитої незалежності від Великобританії, ІРА заявила, що чекає наступні атаки, поки вони не досягнуть своєї мети."
  eng_armor.822.e:0 "Після останньої атаки ІРА знову атакувала фабрики та інфраструктуру в Шеффілді, і здається, що ми не бачимо кінця, поки не вирвемо їх або не задовольнимо їхніх вимог."
  eng_armor.822.f:0 "Після закінчення нашого конфлікту з ІРА позосталі неслухняні намагалися атакувати Шеффілд, але були відбудовані, радікали були арештовані, і поліція впевнена, що подальших нападів чекати не варто."
  eng_armor.822.a:0 "Гіркий вчинок"
  eng_armor.822.b:0 "Браво"

  eng_armor.823.t:0 "ІРА нейтралізована"
  eng_armor.823.d:0 "Після успішних рейдів по всій Ірландії лідери ІРА і більшість їхніх прихильників були або вбиті, або арештовані, і ми сподіваємося, що це буде кінець подальших атак."
  eng_armor.823.a:0 "Відмінна робота"

  eng_armor.824.t:0 "Відбита армія"
  eng_armor.824.d:0 "Після рейдів по цілій Ірландії британська армія почала брати участь у великих боях і партизанській війні з боку ІРА. На жаль, керівники ІРА змогли відступити в нові місця, і нам залишається мало що показати для наших зусиль."
  eng_armor.824.a:0 "Ми отримаємо їх наступного разу."

  eng_armor.825.t:0 "Експерти IRA відслідковуються"
  eng_armor.825.d:0 "Аналіз рейдів показав, яке обладнання використовувало ІРА, і, відстеживши поставки в Ірландію та Ірландію, поліція змогла відстежити нелегальних постачальників зброї та заарештувати їх. Це наближає нас на один крок до пошуку штаб-квартири ІРА."
  eng_armor.825.a:0 "Хороша робота"

  eng_armor.826.t:0 "ІРА знайшли співробітників"
  eng_armor.826.d:0 "Напади на членів ІРА призвели до багатьох арештів. Йдучи до висновку з переговорів між приватними компаніями, ми виявили різних агентів ІРА, що стояли за плануванням деяких майбутніх атак, і поклали їм кінець. Після нашого попереднього успіху це зробить керівництво більш відчайдушним і безумним."
  eng_armor.826.a:0 "Відмінна робота"

  eng_armor.827.t:0 "Лідер ІРА заарештований"
  eng_armor.827.d:0 "Відслідковування IRA Атака привела нас до одного з старших членів ІРА, після нашого втручання було проведено великий рейд з участю декількох відділів поліції і груп спецназа на очікуваний штаб ІРА. На щастя для нас, це було правильне місце, і тепер ми вважаємо, що ІРА буде нейтралізована."
  eng_armor.827.a:0 "Загроза зберігається"

  eng_armor.828.t:0 "Ліга націй ембарго нашої країни"
  eng_armor.828.d:0 "Ліга націй наклала на нас повне ембарго після наших недавніх політичних дій."
  eng_armor.828.a:0 "Ми втратили життєво важливих постачальників ресурсів."

  eng_armor.829.t:0 "Ліга Націй зняла ембарго"
  eng_armor.829.d:0 "Ліга Націй зняла ембарго після послаблення напруженості"
  eng_armor.829.a:0 "Вони платять, щоб бути на їхньому боці."

  eng_armor.830.t:0 "Видалення з Ліги Націй"
  eng_armor.830.d:0 "Ліга Націй вигнала нас зі своєї фракції після наших недавніх дій."
  eng_armor.830.a:0 "Ми ніколи не потребували їх у будь - якому випадку."

  eng_armor.831.t:0 "Доля Ефіопії"
  eng_armor.831.d:0 "З визволенням Ефіопського півострова виникає питання про майбутнє цієї землі. Ми можемо продовжувати наші імперіалістичні шляхи приєднання землі до нашої імперії або відновлення ефіопської автономії та створення дружнього уряду, який може стати сильним союзником."
  eng_armor.831.a:0 "Відновлення Ефіопії"
  eng_armor.831.b:0 "Прикласти землю"
  eng_armor.831.c:0 "Прикласти землю"

  eng_armor.832.t:0 "Марш на Кейбл-стріт"
  eng_armor.832.d:0 "На одному з своїх маршів було відбудовано кабельну вулицю після зустрічі антифашістів, і, на жаль, два сутички призвели до багатьох травм та арештів."
  eng_armor.832.a:0 "Це видовищна подія."
  eng_armor.832.b:0 "Ми повинні виступити проти них."

  eng_armor.833.t:0 "Марші в Ланкаширі"
  eng_armor.833.d:0 "Після Катастрофи на Кейбл-стріт BUF прив'язався до більш традиційних цінностей і, зокрема, Це резонувало з громадськістю та впливом жінок, і пізніше воно збільшилося. Як підійти до цього?"
  eng_armor.833.a:0 "Нам потрібно перерізати бутон, поки він не зацвел."
  eng_armor.833.b:0 "Ми можемо використовувати їх"

  eng_armor.834.t:0 "Вибір лондонської міської ради"
  eng_armor.834.d:0 "Недавні вибори в Лондоні викликали сплеск нових членів ради від BUF до подиву всіх, так чи інакше, нам доведеться взаємодіяти з цією новою політичною фракцією."
  eng_armor.834.a:0 "Кляті чорні сорочки"
  eng_armor.834.b:0 "Вони стають дедалі кориснішими"

  eng_armor.835.t:0 "Оборонний регламент 18B"
  eng_armor.835.d:0 ""
  eng_armor.835.a:0 ""

  eng_armor.836.t:0 "BUF протестує проти війни с [GER.GetName]"
  eng_armor.836.d:0 "Наша війна з Німеччиною викликала протести з боку BUF. На їхню думку, Радянський Союз становить велику загрозу, і вони передбачають, що Європа стане надто слабкою у цій війні, щоб протистояти вторгненням зі Сходу."
  eng_armor.836.a:0 "Ми не компрометуємо принципи"

  eng_armor.837.t:0 "BUF підтримує війну проти [SOV.GetName]"
  eng_armor.837.d:0 "Наша війна з Россією викликала багато аплодисментів з боку радикальних партій, які роблять більше підтримки, ніж раніше, щоб допомогти нам перемогти Червону загрозу."
  eng_armor.837.a:0 "Ми дуже раділи їхній підтримці."

  eng_armor.838.t:0 "Блиц"
  eng_armor.838.d:0 ""
  eng_armor.838.a:0 ""

  eng_armor.840.t:0 "Військова ситуація"
  eng_armor.840.d:0 "Вище командування проаналізувало наші стратегії на даний момент. Сподіваючись, що Радянський Союз і Німеччина все ще можуть воювати між собою, вони заохотили нас припинити війну проти Ради й зосередитися на Німеччині."
  eng_armor.840.a:0 "Це було б наймудрішим"
  eng_armor.840.b:0 "Ми не можемо пробачити СРСР."

  eng_armor.841.t:0 "Британія просить миру"
  eng_armor.841.d:0 ""
  eng_armor.841.a:0 "Мир буде кращим"
  eng_armor.841.b:0 "Ми повинні продовжувати цю війну"

  eng_armor.842.t:0 "[FROM.GETNAME] свій торговельний флот евакуює"
  eng_armor.842.d:0 "Уряд країни після вторгнення Німеччини [FROM.GETNAME] Звільнення від усіх торговельних судів у Британію, щоб запобігти їхньому захопленню німцями"
  eng_armor.842.a:0 "Браво"

  eng_armor.846.t:0 "Проблеми в Іраку"
  eng_armor.846.d:0 "Принц Абд аль-Іла прийшов до нас з повідомленням про приготування перевороту в Іраку, щойно уникнувши арешту, це стосується і інших повідомлень про арешти пробританських громадян і вигнання політиків. Немає сумнівів, що нам доведеться втрутитися, і тому ми повинні негайно підготувати оперативну групу."
  eng_armor.846.a:0 "Підготовка повинна бути зроблена"

  eng_armor.847.t:0 "Радянський Союз прийняв цю пропозицію"
  eng_armor.847.d:0 "Поради бачать важливість цього вторгнення і почали мобілізацію військ на кордоні, як тільки ми будемо готові, ми дамо сигнал, щоб вторгнення почалося серйозно."
  eng_armor.847.a:0 "Чудово."

  eng_armor.848.t:0 "Радянський Союз відхилив нашу пропозицію."
  eng_armor.848.d:0 "Радянський Союз, схоже, не визнає, що Іран є можливою загрозою або має якесь стратегічне значення, щоб виправдати вторгнення. Це ставить нас у ситуацію, коли ми можемо бачити набагато більшу й дорожчу війну."
  eng_armor.848.a:0 "Ми підемо самі."
  eng_armor.848.b:0 "План зараз надто ризикований."

