  sov_her.22.t:0 "Гібель Івана Черняховського"
  sov_her.22.d:0 "18 лютого 1945 року полководець 3-го Белоруського фронту Іоанн Данилович Черняховський отримав смертельне поранення в артилерійському снаряді Східної Пруссії. Один з наймолодших і талановитих радянських воєначальників помер від поранень, які отримали, і командування фронтом залишилося вакантним у розпал Східно-Прусської операції."
  sov_her.22.a:0 "Важка втрата для Червоної армії"

  sov_her.23.t:0 "Перестановки у вищому командуванні"
  sov_her.23.d:0 "Після смерті Івана Черняховського Ставка призначила Маршала Радянського Союзу Олександра Василевського командувачем 3-го Білоруського фронту. Щоб прийняти безпосереднє командування військами Васильський залишив посаду начальника Генерального штабу. Його місце зайняв Олексій Антонів, а керівництво оперативної праці Генерального штабу перейшло до Сергії Штеменко."
  sov_her.23.a:0 "Продовжити наступ"

  
