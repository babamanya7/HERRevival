  lar_ratify_the_stresa_front.5.t:0 "Ратифікація фронту стрілза"
  lar_ratify_the_stresa_front.5.desc:1 "Приготування до підписання та ратифікації Стрезських угод, які формалізують союз з Італією в обмін на територіальні компроміси, ми погоджуємось перенести територію Джибуті до Східної Африки. Після кількох місяців дипломатичної служби залишається тільки покласти чорнило на папір."
  lar_ratify_the_stresa_front.5.a:1 "Тріумф дипломатії [This.GetAdjective]."
  lar_ratify_the_stresa_front.5.b:1 "Це більше не служить нашим інтересам."
  lar_ratify_the_stresa_front.6.desc:1 "Прийшов час виконати обіцянку, яку ми дали уряду [From.GetAdjective]Тепер, коли Альянс діє, ми зобов'язані передати Джибуті під їх контроль."
  lar_ratify_the_stresa_front.6.a:2 "Франція виконує свої обіцянки."
  lar_ratify_the_stresa_front.6.b:1 "Ситуація змінилася."
  lar_ratify_the_stresa_front.7.t:0 "[From.GetNameDefCap] Не ратифікує альянс"
  lar_ratify_the_stresa_front.7.desc:1 "Раптовий уряд [From.GetAdjective] Ми вирішили більше не виконувати своїх попередніх зобов'язань по ратифікації угоди Стрези, всі спроби отримати пояснення за дипломатичними каналами провалилися, а дипломати [From.GetAdjective], Схоже, в однаковій мірі шоковані раптовою змінною серця."
  lar_ratify_the_stresa_front.7.a:1 "Темний день."
  lar_ratify_the_stresa_front.8.desc:1 "[FRA.GetNameDefCap] і [ITA.GetNameDef] вже підписали Stresa Accords і формалізували свій альянс. тепер настала наша черга підтримати нашу угоду, підписати угоду і передати наші акти в Сомалі під контроль [ITA.GetAdjective]."
  lar_ratify_the_stresa_front.8.a:1 "Ми дали слово."
  lar_ratify_the_stresa_front.8.b:1 "Наші інтереси розійшлися."

  france.37.t:0 "Пакт Лаваля-Ріббентропа - французька пропозиція"
  france.37.d:0 "Сьогодні вранці міністр закордонних справ Франції П’єр Лаваль зустрівся з міністром закордонних справ Німеччини Ріббентром, щоб запропонувати договір про ненапад між Францією та Німеччиною. Причина полягала в тому, що обидві країни мусили боротись проти справжнього ворога в особі Великобританії."
  france.37.a:0 "Звучить добре"
  france.37.b:0 "Ні за що"

  france.35.t:0 "Патт Лаваля-Ріббентропа - Німеччина приймає"
  france.35.d:0 "Сьогодні вранці міністр закордонних справ Франції П’єр Лаваль зустрівся з міністром закордонних справ Німеччини фон Ріббентром, щоб запропонувати договір про ненапад між Францією та Німеччиною. Через це обидві країни мусили боротися з справжнім ворогом в особі Великобританії, і після напружених переговорів делегація Німеччини прийняла цю пропозицію."
  france.35.a:0 "Чудово!"

  france.36.t:0 "Патт Лаваля — Ріббентропа: Німеччина відмовляє"
  france.36.d:0 "Сьогодні вранці міністр закордонних справ Франції П’єр Лаваль зустрівся з міністром закордонних справ Німеччини фон Ріббентром, щоб запропонувати укласти договір про ненапад між Францією та Німеччиною. Основою було необхідність боротьби між двома країнами проти справжнього ворога, Великобританії, і після нав’язливих переговорів німецька делегація відхилила пропозицію."
  france.36.a:0 "Merde !"

