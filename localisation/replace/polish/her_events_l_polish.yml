  sov_her.10.a:0 "Зрадники повинні гнити у в’язниці"

  sov_her.11.t:0 "Пропав п’ятирічний план"
  sov_her.11.d:0 ""
  sov_her.11.a:0 "Полетять голови!"

  sov_her.12.t:0 "Матрона Московська"
  sov_her.12.d:0 "Німці вже недалеко Москви, столиця знаходиться в загрозливому становищі; Йосип Сталін вирішив відвідати Матруту. «Російський народ переможе, перемога буде за тобою.». Послуг, який дуже соромився Сталін, покликав священиків до Кремля для блага перемоги; тоді ж чудесна Тіхвінська ікона Богоматері з Тіхвінської в Олексівській церкві була на літаку обнесена Поблизу Москви і Москву від ворога врятувалася, а 9 грудня після першого успішного переслідування, яке передувало Москві, було звільнено Тіхвіна."
  sov_her.12.a:0 "Прийнято до відома"

  sov_her.14.t:0 "Наслідки недбалості генерала Павліва"
  sov_her.14.d:0 "Колишній командуючий Західним фронтом Павлів Д. Ґ. Від початку воєнних дій німецько-фашистських військ проти СРСР виявив боягузтво, бездіяльність влади, відсутність порядку, дозволив розвалити управління військами, здачі зброї і складів противнику, добровільні Перебування військових позицій частинами Західного фронту дало ворогу можливість прорвати фронт, таким чином, Павлів Д. Г. порушив військову присягу, обезчестив високу звання воїна Червоної Армії, забув свій обов’язок перед Родиною, своєю боягузтвом і панікерством. Генерал Павлів, який не визнав своєї провини, втратив своє військове звання і був засуджений до розстрілу."
  sov_her.14.a:0 "Виконання вироку"

  sov_her.16.t:0 "Гібель командуючого Південно-Західного Фронта"
  sov_her.16.d:0 "Двадцять першого вересня 1941 року колона штабів Південно-Західного фронту була атакована головними силами німецької танкової дивізії, втративши кілька гармат і бронемашин, залишки колони відібралися в гащі. У групі залишалося не більше тисячі людей, з них близько 800 командирів, у тому числі командуючий фронт Кірпонос, члени військової ради, начальники штабів, генерали управління фронту і командуючий 5-й армією Потапов. Транспорт і люди розстелялися по кромці, що перетинав кав'ярню, бронемашини зайняли позиції по опушці, і ворог атакував рощу з трьох сторін, спочатку вони вдерлися на східну опушку. Кірпонос був поранений в ногу, а через кілька годин загинув від осколка в голову."
  sov_her.16.a:0 "Важкі часи"

  sov_her.18.t:0 "Спів командуючого 5-ї армії"
  sov_her.18.d:0 "Приходячи до складу південно-Західного фронту, 5-я армія під командуванням Потапова брала участь в прикордонній битві, вела оборонні бої на державному кордоні, потім в районах Ковіля, Дубно, Рівно, Житоміра. У подальшому війську в Коростонський укріплений район наполегливо захищався, і 7 липня вона брала участь у в’язниці Київ, борючись з вищими силами ворожого руху на Київському шляху. У цих боях армії зазнали великих втрат і значна частина з них потрапила в оточення, коли генерал-майор Михаїл Потапов потрапив у полон."
  sov_her.18.a:0 "Це сумно!"

  sov_her.19.t:0 "Військова змова"
  sov_her.19.d:0 "Згідно з даними НКВД ряд вищих офіцерів РККА є учасниками «Військова інтрига», За завданнями якої, під час міжнародно- революційної війни в Іспанії проводили ворожу роботу, спрямовану на поразку Республіканської Іспанії, зниження бойової підготовки ВВС Червоної Армії і збільшення Поблизу військово-повітряних сил."
  sov_her.19.a:0 "Ворогам народу - смерть!"

  sov_her.20.t:0 "Зміна командування ВВС"
  sov_her.20.d:0 "дар"
  sov_her.20.a:0 "Чудово!"

  sov_her.21.t:0 "Вторгнення в Польщу?"
  sov_her.21.d:0 "Згідно з пактом Молотова Ріббентропа ми повинні вторгнуться в Польщу"
  sov_her.21.a:0 "Почати вторгнення"

  ger_her.1.t:0 "Panzerschokolade"
  ger_her.1.d:0 "У Німеччині, починаючи з 1938 року, первітин систематично і в великих дозах як у війську, так і в захисній промисловості входили в Таблетки первітин. «Їзда на бойовому раціоні» Літаків і танкістів під назвою «Panzerschokolade» Напередодні вторгнення у Францію військовослужбовцям Вермахту видали 35 мільйонів доз первітину."
  ger_her.1.a:0 "Прийнято до відома"

  ger_her.2.t:0 "Підкаліберні снаряди і конічні стовбури"
  ger_her.2.d:0 "З 1940 року на озброєння Вермахту починають діяти протитанкові артилерійські гармати з конічним стовбуром, а на початку 1941 року було використано підкаліберні боєприпаси, розроблені раніше, що призвело до підвищення Ефект протитанкових засобів."
  ger_her.2.a:0 "Прийнято до відома"

  ger_her.3.t:0 "Утиліта САУ StuG III"
  ger_her.3.d:0 "Sturmgeschütz III - середня за масою німецька самоходно-атирій установка класу штурмових гармат часів Другої світової війни на базі танку PzKpfw III, яка була дешевша у виробництві на 15-20%, ніж танки на З 1940 по 1945 рік Серійно видавалася в різних модифікаціях і була найбільш масовим за кількістю бронетехніки вермахту (випущено 8636 САУ з 75-ми гарматами)."
  ger_her.3.a:0 "Прийнято до відома"

  ger_her.4.t:0 "Розробка Panzerkampfwagen VI «Тигр»"
  ger_her.4.d:0 "Будівельне бюро двох машинбудівників, «Геншель» і «Порше», зробили тактико-технічні вимоги на важкий танк прорив проектної масою 45 тонн і пушкою, здатною пробити броню товщиною 100 мм на дистанції 1,5 кілометра. На показ на Куммерсдорфському полігоні вибір військової комісії впав на танк компанії. «Геншель»У результаті гібрид з шасі фірми «Геншель» і баштій Фердінанда Порше вступив у виробництво."
  ger_her.4.a:0 "Прийнято до відома"

  ger_her.5.t:0 "Успішне завершення операції «Рейнхард»"
  ger_her.5.d:0 "Сьогодні глобус повідомив Гімлеру з Трієста, що операція «Рейнхард» Завершена в генерал-губернаторстві двома тижнями раніше і всі табори ліквідовані. У відповідь Гіммлер дякував глобусові і дякував йому за велику і унікальну послугу, яку він зробив для всього німецького народу під час операції."
  ger_her.5.a:0 "Прийнято до відома"

  ger_her.10.t:0 "Операція Валькірія зазнала невдачі!"
  ger_her.10.d:0 "Спроба замаху на нашого фюрера провалилася. Після вибуху бомби під час однієї з наших військових зібрань у Волчій Логові наш фюрер був всього за кілька метрів від смерті, також від отриманих ран помер начальник Генерального штабу ОКЛ. Ми вистежили зрадників, які наважилися скинути нас, тепер нам потрібно вирішити долю всіх офіцерів, які мають якесь відношення до цієї змови."
  ger_her.10.a:0 "Вони всі скуштують наш гнів!"

  ger_her.11.t:0 "Оголошення війни Сполученим Штатам"
  ger_her.11.d:0 "Сполучені Штати Америки перебувають у стані війни, і японці швидко захоплюють територію союзників у Східній Азії, де шанси на перемогу високі. Якщо порівняти це з погіршенням стосунків між США та Німеччиною, то можна припустити, що їх приєднання до війни на стороні Великобританії буде лише питанням часу. Ми повинні випередити їх у оголошення війни, і таким чином вивести Сполучені Штати зі рівноваги, збільшивши шанси перемоги Японії на сході."
  ger_her.11.a:0 "Велика нація не дозволить оголосити собі війну!"

  ger_her.12.t:0 "Гібель Огена фон Шоберта"
  ger_her.12.d:0 "Під час воєнних дій на півдні Радянського Союзу, на півдні України, Оуген Ріттер фон Шоберт і його пілот загинули, коли літак спостереження Fieseler Fi.156 Storch сів на радянське мінне поле. Генерал похований з військовими почестями на новосформованому військовому кладовищі в Ніколаеві."
  ger_her.12.a:0 "Сумна звістка!"

  ger_her.13.t:0 "Провал «Барбароси»"
  ger_her.13.d:0 "Під час літньої кампанії на сході нашої армії не вдалося досягти поставлених цілей у знищенні РККА і взятні ключових індустріальних центрів Західної частини СРСР. Москва ще знаходиться в руках більшовиків, а червона армія зберігає свою боєздатність, і причина невдачі лежить на плечах командувачів, які не виконують накази, їх слід усунути від справ «по хворобі»"
  ger_her.13.a:0 "Прийнято до відома"
  blitz_lose_comander_retire_tt:0 "§RВідсутній§! від команди таких генералів: \n§YХайнц Гудеріан§! \n§YВільгельм фон Лееб§! \n§YЕріх Гепнер§! \n§YАдольф Штраус§!\n\n§GНа 2 місяці§! не будуть доступні такі команди: \n§YФедор фон Бок§! \n§YГерд фон Рундштедт§!"

  ger_her.14.t:0 "Хайнц Гудеріан: нове призначення"
  ger_her.14.d:0 "Після закінчення операції «Блау» Гудеріана було викликано в Ставці фюрера у Вінніці і після розмови з Гітлером призначили на посаду головного інспектора бронетанкових військ, відповідального за модернізацію бронетанкових частин. Налагодивши добрі стосунки з Альбертом Шпеером, вони разом зможуть збільшити кількість випущених танків."
  ger_her.14.a:0 "Чудово!"
  inspektor_guderian_tt:0 "§GРозблоковує§! черт «Особиста інспекція заводів Гудеріаном» у військово-промислових організацій §YГеншель§!, §YМАН§!, §YДаймлер-Бенц§! і §YКруп§!"
  inspektor_guderian:0 "§GГудеріан§! призначено інспектором бронетанкових військ"

  ger_her.15.t:0 "Розбіжність у командуванні"
  ger_her.15.d:0 "Будучи командувачем збройних сил, Гітлер воював з начальником свого штаба Гальдером відносно стратегії ведення бойових дій згідно плану «Блау»Так само Бок, який командував групою армії, критикував Гітлера за його втручання у військові справи, тому що вони повинні припинити свою нелояльність і позбавити посад."
  ger_her.15.a:0 "Ми знайдемо їм заміну"

  ger_her.16.t:0 "Ешонек застрелився"
  ger_her.16.d:0 "Сьогодні, після аудієнції з Гітлером, начальник генерального штабу ОЛ Ганс Ешонек застрелився, не виходячи з ставки Вольфшанці."
  ger_her.16.a:0 "Ми знайдемо йому заміну"

  ger_her.17.t:0 "Нервовий зрив у Цейтцлера"
  ger_her.17.d:0 "Тепер у Цейтцлера стався нервовий зрив, і він без дозволу залишив свою резиденцію Гітлеру в Бергхофі, склавши руки."
  ger_her.17.a:0 "Ми знайдемо йому заміну"

  ger_her.18.t:0 "Оборона Рейха"
  ger_her.18.d:0 "Після чергової суперечки з Гітлером, спричиненої останнім управителем танковими частинами, Гудеріана було знято з посади і відіслано у відпустку. Ганс Кребс був призначений начальником штабу сухопутних військ."
  ger_her.18.a:0 "Остання наділя Рейха"
  ger_her_18tt:0 "§GТеодор Буссе стане доступним у якості генерала§!"

  her_news.1.t:0 "Вибух у Бомбеї"
  her_news.1.d:0 "14 Квітень 1944 у Бомбеї, порту Індійського міста Бомбея, спричинив вибух, пожежа на параході. «Форт Стикін»На борту був вантаж «особливі потреби» Пожежа почалася о 12:30, пожежники намагалися гасити полум’я, але їхні спроби були марними. Вибух стався о 16:06, і з вибуху з'явилася хвиля така потужна, що корабель «Джалампада» Приблизно 4000 тонн води були на даху одного з складів 17 метрів заввишки, через 34 хвилини стався другий вибух, а розпалені кипи бавовни підпалили в радіусі 9сот метрів від епіцентру. У результаті вибуху та наступних пожеж загинуло 1376, поранено 24008, майже одну квадратну милю міських кварталів було знищено."
  her_news.1.a:0 "Прийнято до відома"
  her_news.1.b:0 "О,боже..."
  her_news.1.c:0 "Прибита звістка..."

  her_news.2.t:0 "Землетрус у Туреччині"
  her_news.2.d:0 "27 Декабря в 1:57 за місцевим часом стався один з найсильніших землетрусів у історії Туреччини, що стався у Північній Анатолії 1668 року, а Епіцентр землетрусу розташований біля Ерзинджана. Землетруси тривали 52 секунди, і це призвело до цунамі заввишки 1 —3 м, що на узбережжі Чорного моря. Землетрус серйозно пошкодив близько 116 720 будинків. На наступний день, 27 грудня, було вбито близько 8000 осіб, а в той же день температура впала до -30. У результаті, що загинули від низької температури, снігових бур та повеней, а також безпосередньо рільництво стало 32 968, близько 100 000 поранено. Ущерб, нанесений містом Ерзинджан, був настільки великий, що його місце розташування було повністю покинуто."
  her_news.2.a:0 "Це надзвичайна трагедія Туреччини"

  her_news.3.t:0 "Путч молодих офіцерів"
  her_news.3.d:0 "26 Февраля 1936 була сприймала спробу державного перевороту в Японії прихильниками націонал-соціалізму в японській армії, ідеологом путча був Ікі Кіта, програмна робота якої, під назвою «План реконструкції»Повстанці захопили центр Токіо, в тому числі будівлі парламенту, Міністерства внутрішніх справ і Міністерства оборони, і вбили кількох впливових політичних лідерів. Незважаючи на їхні заяви про цілковиту підтримку імператорської влади, імператор Сева різко засудив їхні дії, визнаючи їх незаконними, і деморалізовані повстанці здалися урядовим військам. Деякі повстанці, у тому числі лідери бунту, вчинили самогубство."
  her_news.3.a:0 "Імпереалісти пожирають самі себе"
  her_news.3.b:0 "Шкода що не вийшло"
  her_news.3.c:0 "Интересно"
  her_news.3.e:0 "Добре, що імператор не постраждав, але в бунтівників нічого не вийшло"

  her_news.4.t:0 "Загальна страйка в Греції"
  her_news.4.d:0 "Тринадцятого травня 1936 року в Греції відбувся масовий страйк, який став відповіддю на криваве вбивство жандармерії над містами, що трудилися в місті Салоніки. Уряд у відповідь на вимоги робітників у Салоніках просто розстріляв демонстрантів з кулеметів (8 -9 травня), тоді було вбито 12 осіб і сотні поранених. Незважаючи на репресію, у страйк брали участь близько 500 000 робітників, ремісників і працівників. "
  her_news.4.a:0 "Робочий клас дає про себе знати"
  her_news.4.b:0 "Недостатньо зброї було застосовано..."
  her_news.4.c:0 "Жорстокість жандармів була безпідставною"

  her_news.5.t:0 "Хрустальна ніч"
  her_news.5.d:0 "Дев’ятого листопада 1938 року по цілій нацистській Німеччині, в Австрії та Судетській області почалися єврейські погроми, здійснені військовими загони СА та цивільними особами. Поліція самознищилась від переляку цих подій, і через це багато вулиць було вкрито осколками єврейських магазинів, будинків та синагог. Німецький дипломат Ернст Фом Рата помер після того, як попав на нього польський єврей Гершеля Ґріншпана, інтерпретована Геббельсом як напад міжнародного єврейства на Німеччину і фюрера."
  her_news.5.a:0 "Переслідування Євреїв переступає всі межі!"
  her_news.5.b:0 "Так їм і треба!"
  her_news.5.c:0 "Чи ця свобода, яку Гітлер обіцяв?"
  her_news.5.e:0 "Шкода простих громадян."


  her_news.6.t:0 "Халхін-Гольська війна"
  her_news.6.d:0 "[GetDateText] розпочалася локальна збройна боротьба між радянськими-монгольськими військами та збройними силами Японії. За кілька місяців до цього Японські війська вступали в сутички з радянськими прикордонниками, так 16 січня 1939 року в районі висоти Номон-Хард-Обо група з п'яти японських солдатів з відстані близько 500 метрів Озброєний конфлікт продовжується і сьогодні."
  her_news.6.a:0 "Побажаємо витривалості радянським бійцям"
  her_news.6.b:0 "Японці, в атаку!"
  her_news.6.c:0 "Тоталітарні режими зіткнулися в бою"

  her_news.7.t:0 "Перемога СРСР у боях на Халхін-Голу"
  her_news.7.d:0 "[GetDateText] Перемир'я підписано між Японією та Радянським Союзом, і перемога на Халхін-Голі досягла Радянського Союзу. У Радянському Союзі 25 000 людей, у тому числі поранених, хворих та загиблих, 207 літаків і 253 танків, зазнали урядової кризи і відставки кабінету Хірануми Кіічіро."
  her_news.7.a:0 "Перемога за нами!"
  her_news.7.b:0 "Ми не забудемо цей програш."
  her_news.7.c:0 "Погана поразка Японії."

  her_news.8.t:0 "Замах на Адольфа Гітлера"
  her_news.8.d:0 "Восьмого листопада 1939 року Йоганн Ґеорґ Елзер зробив невдалий напад на Адольфа Гітлера, Германа Геринга та Йозефа Геббельса, ввезений в колону залу. «Бюргербройкеллер» Близько 3000 осіб, у тому числі все найвище керівництво нацистської Німеччини та Мюнхена, покинули зал за сім хвилин до вибуху за 13 хвилин. Вибухова хвиля зруйнувала дахи і розмітала кілька рядів слухачів, що були найближчі до трибуни. Вісім чоловік загинуло і 63 чоловіки було поранено. Ще за 35 хвилин до вибуху близько 20:45, Ельзер був затриманий німецьким прикордонним патрулем при спробі незаконно перетнути швейцарський кордон."
  her_news.8.a:0 "Шкода не вийшло..."
  her_news.8.b:0 "Хто він такий, щоб спробувати забрати життя великого фюрера!"
  her_news.8.c:0 "Шкода не вийшло..."
  her_news.8.e:0 "Цікаві події"

  her_news.9.t:0 "Дія «Антропоїд»"
  her_news.9.d:0 "[GetDateText] Автомобіль Гайдріха з відкиненим верхом підійшов до місця, де його чекали агенти о 10:32. У цей день постійного шофера заміняв водія Йоханнес Кляйн, обершар фюрер СС. Коли машина пригальмувала у повороту диверсанти напали на машину в результаті чого Гейдрих і Кляйн отримали поранення, але все одно змогли вступити в перестрілку з диверсантами, яким за результатами вдалося втекти. Стан офіцерів СС залишається невідомим, і їх обох відправили до лікарні."
  her_news.9.a:0 "Сподіваюся вони здохнуть!"
  her_news.9.b:0 "Здоров'я офіцерам!"
  her_news.9.c:0 "Сподіваюся вони здохнуть!"
  her_news.9.e:0 "Світова війна змушує людей йти на чесне самогубство."

  her_news.10.t:0 "Рейнхард Гейдрих помер!"
  her_news.10.d:0 "Рейнхард Трістан Ойген Гейдріх, начальник головного управління імперської безпеки, який виконує обов'язки імперського протектора Богемії і Моравії, Обергрупенфюр СС і генерал поліції помер [GetDateText] У 38 - річному віці причиною смерті була замах на нього тиждень раніше, а Обергрупенфюрер отримав серйозні поранення і лікарі боролися за його життя. Уранці наступного дня з'явилася інформація про поліпшення стану Гейдріха, але він впав у кому і помер сьогодні."
  her_news.10.a:0 "Фашиста свиня здохла!"
  her_news.10.b:0 "Шкода такої великої людини"
  her_news.10.c:0 "Можливо він отримав по заслугах"

  her_news.12.t:0 "Підрив Дніпрогеса"
  her_news.12.d:0 "В [GetDateText] Дніпрогес, Днепровські греблі, залізничний міст через Дніпр були підірвані радянськими військами, а військові перевезення та люди, які в той час рухалися дамбами, загинули. Ніхто не повідомив про вибух Днепровської дамби на самій дамбі чи на самій території міста Запоріжжя. Так само не було попереджено військові частини, розташовані вниз від Запорожжя у плавнях, хоча телефонне з’єднання у той час на Левебер’є функціонувало нормально. У тілі греблі з’явилася велика колода, і майже 30 - метрова лавина води пронеслася через Днепровську пойму, заливаючи все на своєму шляху."
  her_news.12.a:0 "Падіння Сталіна Косса"

  her_news.14.t:0 "Парад на Красній площі 7 листопада"
  her_news.14.d:0 "Воєнний парад на честь 24-ої річниці Жовтчої революції готувався в облаштованих секретності, Парад почався з вітання маршала Будьононого, який виїхав на коні з воріт Спасської вежі під бій курантів. Після виступу Йосиф Сталін зведений оркестр під керівництвом Агапкіна заграв «Інтернаціонал»Марш відкрив курсанти 1-го Московського Красовиного артилерійського училища імені Л. Б.К. \nВоєнний парад на Красній площі в Москві вселив у радянських людей впевненість: якщо в такій важкій атмосфері, коли ворог біля стін Москви, а в столиці традиційно відзначають річницю Октября, значить ворогу Не взяти місто."
  her_news.14.a:0 "За Родину, братику!"

  her_news.15.t:0 "Гібель конструктора"
  her_news.15.d:0 "Володимир Міхайлович Петляков, радянський авіаконструктор бомбардувальників Пе-2, загинув у авіакатастрофі біля села Мамешево, він заліз у бомбардувальний Пе-2 для вильоту в Москву. Начальник перегонної групи, думаючи, очевидно, що його просить про послугу рядовий працівник заводу, посадив Володимира Міхайловіча в перший підкинутий під руку літак, екіпаж якого виявився недостатньо досвідченим. Коли літак відірвався від землі, він швидко піднявся вгору, увійшов у низьку хмарність і через кілька хвилин, роблячи, як можна було визначити за звуком мотора, коло над аеродром, вивалився з хмар. У безладному падінні, з повним мотором, машина врізалася в землю, і корабель екіпажу та конструктора відбувся миттєво."
  her_news.15.a:0 "Прийнято до відома"

  her_news.16.t:0 "Син Сталіна потрапив у полон"
  her_news.16.d:0 "Йосифівич Джуґашві, найстарший син Йосипа Сталіна, старший лейтенант РККА, потрапив у німецьку неволю під час допиту до Ґюнтера Флюґе."
  her_news.16.a:0 "Оце незадача!"
  her_news.16.b:0 "Прийнято до відома"

  her_news.17.t:0 "Падати Кьонігсберга"
  her_news.17.d:0 "Сьогодні радянські війська захопили Кенігсберг, і німецьке місто Кьонігсберг було перевершене в одне з потужних укріплених районів Східної Пруссії, у Кьонігсберзі було створено три кільця оборони. Перша складалась з траншей, рів і мін, на цьому кільці розташовувалося 15 фортів, друга обручка оборони проходила по околицях міста, третя обручка, в центрі міста. Радянські війська пробивали артилерію по кварталах міста, а інженери підривали сили після масового нападу фортеці. Німецький гарнізон капітулював за наказом коменданта Кьонісберга Отто Ляша, який підписав акт капітуляції, і за це Гітлер зачно засудив Ляша до страти. «Байшне Дона» Було підкріплено знамена Перемоги."
  her_news.17.a:0 "Це кінець третього Рейха."

  her_news.18.t:0 "Звільнення Праги"
  her_news.18.d:0 "Радянські Війска захопили Прагу, наступив вівся цілодобово. Німецька командування вимагала якомога довше оборонятися у Чехословаччині і використовувати незгоди між союзниками з антигітлерівської коаліції. Отримавши дані про перекидання радянських військ на фланги, генерал вирішив зтягнути свої основні частини в район Праги і наполегливо оборонятися там і в самому місті, перетворивши Прагу в «другий Берлін»Радянські війська зігнали ар’єргарди ворога з кордону, широко застосовуючи обстановки та обхід, а Чеські партизани були забрані і пізніше передали радянському командуванню штабу ВС КОНР генерал Трухін. Загальний відступ з району Праги і західніше Праги частин Вермахту і СС швидко переросло в паніку в західну частину Чехословаччини."
  her_news.18.a:0 "Це кінець третього Рейха."

  her_news.20.t:0 "Різня в Нанкіні"
  her_news.20.d:0 "Упродовж шести тижнів насильство продовжувалось 13 грудня 1937 року, внаслідок чого японські військовослужбовці вчинили масові вбивства і ґвалтування цивільного населення Нанкіна. Протягом цього періоду солдати японської імператорської армії вбили від 40 000 до понад 500 000 китайських громадян і роззброєних солдатів, а також скоїли багато зґвалтувань та актів мародства."
  her_news.20.a:0 "Интересно"

  her_news.21.t:0 "Контрнаступ РККА під Москвою"
  her_news.21.d:0 "Незважаючи на успіх літа, осені 1941 року, вороги не змогли досягти своєї головної мети бліцкрига. Німеччина була перед неминучою війною з Радянським Союзом, і в 1941 р., торжество впало в останню хвилину. Тепер німецькі провідники мали усвідомити, що дні бліцкрига були справою минулого. Ми противилися армії, по своїх бойових рисах набагато сильніша за всі інші армії, з якими нам коли-небудь доводилося зустрічатись на полі бою."
  her_news.21.a:0 "За Батьківщину!"
  her_news.21.b:0 "Ще не все вирішено"

  her_news.22.t:0 "Радянське військо вступає в Бухарест"
  her_news.22.d:0 "Після того як Румунія перейшла на сторону антигітлерівської коаліції, радянські та Румунські команди почали співпрацювати, щоб знищити німецькі та угорські частини на території Румунії для повного його звільнення. Щоб виконати цю задачу радянське командування перекинуло додаткові частини в Румунію, які в [GetDateText] До міста Бухареста, в цілому, румунський народ зустрічав радянську армію як визволителів, але через свої політичні причини місто не було забране від радянської армії."
  her_news.22.a:0 "За Батьківщину!"
  her_news.22.b:0 "Ще не все вирішено"

  her_news.23.t:0 "Пожежа в клубі «Коконат Гроув»"
  her_news.23.d:0 "Трагедія сталася ввечері, коли в заведенні було багато людей, пожежа сталася через короткочасне замикання: під час заміни електричної лампочки запалився горючий декор у вигляді листя пальми. Після трагедії загинуло 492 особи, а потім почали переглядати норми безпеки у США."
  her_news.23.a:0 "Боже... прийми душі загиблих"
  her_news.23.b:0 "Так їм і треба"
  her_news.23.c:0 "Передавайте співчуття американцям"

  her_news.24.t:0 "Суд над Лакі Лучано"
  her_news.24.d:0 "Сьогодні 7 червня 1936 року відбувся суд над Чарльзом. «Лакі» Лучано, архітектор сучасної структури американської мафії, який був звинувачений у примусі до проституції і отримав безпрецедентний термін 50 років ув’язнення."
  her_news.24.a:0 "Интересно"

  her_news.25.t:0 "Зв'язок Ельбруса Вермахтом"
  her_news.25.d:0 "Сьогодні вранці, група німецьких гірських стрілок під командуванням Хайнца Грота зайняла готель для альпіністів «Приют 11»Гріт, досвідчений альпініст, організував сходження на вершину Ельбруса і поставив там прапор дивізії. «Едельвейс»Тепер прапор зі свастикою розвивається над Кавказом."
  her_news.25.a:0 "Интересно"

  her_news.26.t:0 "Зв’язок Ельбруса РККА"
  her_news.26.d:0 "Після короткого піхотного бою за Приют 11, німецькі війська в поспіху відступили з зайвою позицій, незабаром бійці Червоної Армії почали сходження на Ельбрус і скинули з заходу вершини Ельбруса прапори третього Рейху і Штангдарти 1-й горнострелковій дивізії вермахта «Едельвейс», встановивши замість них знана з серпом і молотом."
  her_news.26.a:0 "Интересно"

  her_news.27.t:0 "Підрив Весловського водосховища"
  her_news.27.d:0 "Невідомий герой ціною свого життя підірвав греблю Весловського водосховища, греблі Весловського водосховища злетило на повітря. Манич вийшла з кераміки і перетворилась на гігантський водяний струмок, завширшки 4 км."
  her_news.27.a:0 "Интересно"



  her_news.28.t:0 "Визволення концентраційних таборів Заксенгаузен"
  her_news.28.d:0 "Сьогодні радянські війська звільнили концтабір Заксенгаузен, які стояли перед очима радянських солдатів шокували їх, виснажені люди, діти, жінки, чоловіки просили про допомогу, радянські медики почали надавати допомогу Загалом 45 000 в’язнів було звільнено. В’язні розповіли, що, мабуть, розношували нове взуття для німецьких військових, а пари спеціально підбиралися не за розміром, оскільки виснажених людей примусили бігати в цьому взуття цілими стютами."
  her_news.28.a:0 "Жесть"

  her_news.29.t:0 "Звільнення концентраційних таборів Освенцім"
  her_news.29.d:0 "Сьогодні радянські війська звільнили концентраційний табір Освенцім, де нацисти винищували багатьох полонених, а також євреїв, циган і слов’ян. Частина ув'язнених використовувалася як особисті прислуги нацистів або для того, щоб обслуговувати табори, і ще одна група ув'язнених стала невільними жертвами медичних експериментів, які їх проводили. «Ангел смерті» Доктор Йозеф Менґелє, в’язень, який мав нові ліки на замовлення німецьких фармацевтичних компаній, хворів на різні хвороби і проводив експериментальні операції."
  her_news.29.a:0 "Жесть"

  her_news.30.t:0 "Визволення концентраційних таборів Майданек"
  her_news.30.d:0 "Сьогодні радянські війська випустили концтабір Майданек, і коли Червона Армія вступила на територію Майданека, вона зустріла лише кілька сотень в’язнів. Коли радянські воїни увійшли на територію табору, то побачили справжнє царство смерті, сотні мертвих тіл, гори взуття та одяг, що були в'язнями."
  her_news.30.a:0 "Жесть"

  her_news.31.t:0 "Червона Армія виявила масові поховання в Баб'єм Яру"
  her_news.31.d:0 "\nСьогодні радянські війська знайшли масові могили, і, згідно з повідомленням, у двох ямах вони виявили тіла, а там також говориться: «Ми виявили численні кістки спалених тіл, одяг і кістки ... в Києві масові вбивства мирних радянських громадян були безпрецедентними за масштабами ... жертвами стали кілька десятків тисяч чоловіків, жінок і Діти»."
  her_news.31.a:0 "Жесть"

  her_news.32.t:0 "Звільнення Хатіні"
  her_news.32.d:0 "Радянські війська звільнили Хатінь, бо Бойці РККА знайшли близько сотні трупів, які були мирним населенням кількох сіл, яких вивезли на знищення. Причиною цього стало вбивство Ганса Велько, який 1936 року став чемпіоном Олімпійських ігор у тлумаченні ядра і особисто знайомий з Гітлером. Вони почали прочісувати ліс у пошуках партизан і 22 березня 1943 року оточили село Хатинь."
  her_news.32.a:0 "Жесть"

  her_news.33.t:0 "Мова Геббельса про Тотальну війну."
  her_news.33.d:0 "Отже, ви, які сидять тут переді мною, уявляєте в цей момент весь німецький народ. І я хотів би поставити вам десять питань, на які ви разом з усім німецьким народом повинні дати мені відповідь перед лицем всього світу, а особливо наших ворогів, які слухають нас зараз по радіо. Я запитую вас, чи хочете ви тотальну війну? ніж ви взагалі можете собі сьогодні уявити?"
  her_news.33.a:0 "Прийнято до відома"

  her_news.34.t:0 "«Везерюбунг-Зюд» — Капітуляція Данії»"
  her_news.34.d:0 "Вермахт сьогодні вранці, на світанку, перетнув кордон континентальній Данії, і в той час у Коппенгаген була висадка. Коли десантники підійшли до королівського палацу, король Крістіан X, вирішуючи уникнути жертв, наказав скласти зброю."
  her_news.34.a:0 "Бабах"



  news_1941.1.t:0 "Падати Києва"
  news_1941.1.desc:0 "[GetDateText] Київ, столиця Української ССР, захопили німецькими військами в Радянському Союзі. \n\nЗахоплення одного з їхніх найважливіших міст є серйозним ударом для Ради, але все ще залишається питання, чи зможуть німці зберегти набраний темп. Через кілька хвилин після того, як німці зайняли місто, тисячі мін, закладених НКВД, напевно, вибухнули в будівлях вздовж головної вулиці Крещатик, завдавши ще більше збитків і без того зруйнованого міста.\n\nЗараз сили вторгнення дивляться на схід."
  news_1941.1.a:0 "Тривожний розвиток..."

  news_1941.2.t:0 "Повернення Києва"
  news_1941.2.desc:0 ""
  news_1941.2.a:0 ""

  news_1941.3.t:0 "Занепад Москви"
  news_1941.3.desc:0 "В [GetDateText] Німецькі танки прорвалися через наспех засновані загони на вулицях Москви, а на Красній площі було помічено напівгусениці, які вивантажували панцергренадерів. \nБурхливий дим від численних пожеж у передмістях піднімався в повітря, коли піхота вермахта штурмувала Кремль. Кажуть, що гранати і вогнемети були необхідні для боротьби з наполегливими противниками НКВД, які хотіли захищати кожен дюйм комплексу. \n\nНепідтверджені дані вказують на те, що труп Леніна безпечно евакуювали на схід."
  news_1941.3.a:0 "Удар в саме серце Ради..."

  news_1941.4.t:0 "Повернення Москви"
  news_1941.4.desc:0 ""
  news_1941.4.a:0 ""

  news_1941.5.t:0 "Падіння Сталінграда"
  news_1941.5.desc:0 "Німецькі передові частини захопили Сталінград, місто-тезку Сталіна на березі Волги. \n\nЧерез спустошений Сталінградський тракторний завод зірвав битву і зайняв стратегічно важливі висоти Мамаєвого кургана, і фашистські війська витіснили останні радянські захисники через Волгу до її східного берега. Але ще не видно, чи румуни зможуть утримати свою лінію..."
  news_1941.5.a:0 "Чи Сталін повернеться «свій» Місто?"

  news_1941.6.t:0 "Повернення Сталінграда"
  news_1941.6.desc:0 "В [GetDateText] Сталінград звільнений від німецько-фашистських військ, бої були жорстокими і в окремих місцях тривали тижні. \n\nПрапор Союзу Радянських Соціалістичних Республік знову гордо розлучається над містом."
  news_1941.6.a:0 "Тривожний розвиток..."

  news_1941.7.t:0 "Падіння Ленінграда"
  news_1941.7.desc:0 "Ленінград, батьківщина російської революції, впав перед наступними силами вермахту групою армій «Північ». \n\nСуперечні бої все ще чутні в деяких передмістях, але, здається, над рештою зруйнованого міста запанував дивний спокій.\n\nРаніше колони солдатів 18-ої армії Вермахту пройшли маршем повз Ісааківського собору, чи велика купол був вифарбований інженерами Червоної Армії в сірий колір, щоб не привертати увагу мародерських Цивільників Люфтваффі. \nНезважаючи на їхні зусилля, він висічений кульовими отворами і осколками."
  news_1941.7.a:0 "Тривожний розвиток..."

  news_1941.8.t:0 "Повернення Ленінграда"
  news_1941.8.desc:0 "Після тижневих боїв у місті, відомому як Родина Російської революції, пил нарешті оселився, і люди зрозуміли, що Рада знову при владі, і що це питання залишиться."
  news_1941.8.a:0 "Ретельно розпитав..."

  news_1941.9.t:0 "Падає севастополія"
  news_1941.9.desc:0 "Дуже укріплене місто Селестополь, база радянського Чорноморського флоту, остаточно зазнала нападу на фашистів. \n\nЙого втрата буде серйозно перешкоджати будь-якій радянській спробі боротися за Чорне море, а падіння міста вважається важливою перемогою Осі.\n\nЗ Берліна вже видано указ, в якому говориться, що місто відтепер має бути відоме як «Теодорихсхафен» на честь Теодора Великого."
  news_1941.9.a:0 "Тривожний розвиток..."

  news_1941.10.t:0 "Повернення Шевистополя"
  news_1941.10.desc:0 "Селастополь, колишня база британського флоту, був повернений Радянському Союзу, а час від часу вигнаний флот знову може працювати з найвищою ефективністю, оскільки його головна гавань знову відкрита. Хоча ремонтів ще багато..."
  news_1941.10.a:0 "Нехай у них буде база..."

  news_1941.11.t:0 "Падати Баку"
  news_1941.11.desc:0 "Раніше сьогодні сили групи армій «Південь» Вермахту успішно завоювали місто Баку, яка була головною стратегічною метою в їхній війні проти Радянського Союзу. \n\nРозташований на березі Каспійського моря, місто є ключем до Кавказу, а його численні нафтові родовища, безсумнівно, принесуть користь німецьким військовим зусиллям.\n\nЙого захоплення дає країнам Осі можливість розширити війну на Близький Схід і, можливо, навіть в Індію."
  news_1941.11.a:0 "Тривожний розвиток..."

  news_1941.12.t:0 "Повернення Баку"
  news_1941.12.desc:0 "Після тижневих боїв на багатих нафтових родовищах Баку РККА вдалося відбити понадісну вермахту в умовах поганої місцевості. \n\nУ Радянському Союзі не було місця для висадки, і це, без сумніву, коштуватиме німцям справедливої ціни в майбутньому..."
  news_1941.12.a:0 "У них теж немає демократії?"







  news.338.t:0 "Чорний барон мертвий!"
  news.338.d:0 "[GetDateText] Англо-канадські війська розпочали операцію Totalize, під покровом темряви британські та канадські танки в супроводі солдатів захопили висоту біля Сен-Еніан-де-Крамніль. Тут вони зупинилися в очікуванні повітряного бомбардування, не знаючи про причину зупинки союзних військ, Курт Мейер з 12-ї дивізії СС «Гітлерюгенд» Він наказав відбити висоту. \nТанкова ас Міхаель Віттманн, також відомий як «Чорний барон», на рахунку 135 підтверджених знищень танків, мав очолити групу з семи танків. «Тигр»Його група тигрів, що перетинають відчинену місцевість до підвищення, потрапила в засідку Англо-Канадських танків. Під час засідки протитанкові снаряди змогли пробити верхню частину корпусу танка Віттмана, запаливши зброю, і вогонь охопили танк і відірвав вежу."
  news.338.a:0 "Хай упокоїться він зі світом"

  ger_armor.57.t:"Чорний барон помер в Нормандії"
  ger_armor.57.d:"Ми їхали автострадою, Міхаель з чотирма іншими танками по одній смузі, а я і брат Хайнц фон Вестергагена — по іншому. У нас не було часу на розвідку, і через кілька кілометрів я отримав повідомлення від Міхаеля, і це підтвердило мої найгірші побоювання, і я лише сказав: « Великий протитанковий вогонь справа." Я виліз і побачив, що танки Міхаелья зупинились, і на мої поклички він не відповідав, і тут у нас самих попало прямий наводок, танк загорівся і ми мусили вибиратися. Я був шокований, коли побачив, що ми втратили п’ять « Сигрів »."У танку Міхаелья снаряд потрапив прямо в вежу, і було відразу ясно, що ніхто не вижив."
  ger_armor.57.a:0 "Хай упокоїться він зі світом"

  ww2_germany.44.t:0 "Операція Панцерфауст"
  ww2_germany.44.d:0 "Фюрер недавно отримав повідомлення про те, що Міклош Горті, лідер Угорщини, веде таємні переговори про капітуляцію своєї країни перед наступною Червоною Армією. На даний момент він відправив Отто Скорцені розібратися з ситуацією разом з іншими спецрозділами. Фюрер боявся, що ця капітуляція дуже обнажить південний фланг Німеччини, де Румунія вже об’єдналася проти рейху, і відріже багато наших військ."
  ww2_germany.44.a:0 "Горті треба прибрати!"

  ww2_germany.47.t:0 "Кенігсберг Пал"
  ww2_germany.47.d:0 "Містечко Кенігсберг потрапив в руки ворога, ми повинні повернути його у що б не сталося!"
  ww2_germany.47.a:0 "Це погана новина..."

  ww2_germany.48.t:0 "Данціг Пал"
  ww2_germany.48.d:0 "Місто Данціг потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.48.a:0 "Ми повинні продовжувати боротися"

  ww2_germany.49.t:0 "Прага Пала"
  ww2_germany.49.d:0 "Місто Прага потрапив в руки ворога, ми повинні повернути його у будь-яке інше!"
  ww2_germany.49.a:0 "Кінець близько..."

  ww2_germany.50.t:0 "Загреб Пал"
  ww2_germany.50.d:0 "Загреб, cтолиця нашої союзної Хорватії, потрапила в руки ворога, ми повинні повернути її будь-якою ціною!"
  ww2_germany.50.a:0 "Ми повинні повернути його!"

  ww2_germany.51.t:0 "Бреслау Пал"
  ww2_germany.51.d:0 "Місто Бреслау потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.51.a:0 "Кінець близько..."

  ww2_germany.52.t:0 "Берлін Пал"
  ww2_germany.52.d:0 "Коли бої йдуть вулиця за вулицею, будинок за домом, до останнього чоловіка або жінки, столиця Рейху, сам Берлін, нарешті, неохоче потрапив в руки ворога після одного з найзапекліших боїв, які коли-небудь були. Але з Берліном чи ні, війна продовжуватиметься!"
  ww2_germany.52.a:0 "Війна триває!"

  ww2_germany.53.t:0 "Будапешт Пал"
  ww2_germany.53.d:0 "Будапешт, cтолиця нашої союзної Угорщини, потрапила в руки ворога, ми повинні повернути її у що б не сталося!"
  ww2_germany.53.a:0 "Це погана новина..."

  ww2_germany.54.t:0 "Сараєво Пало"
  ww2_germany.54.d:0 "Місто Сараєво потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.54.a:0 "Ми повинні продовжувати боротися"

  ww2_germany.55.t:0 "Франкфурт Пал"
  ww2_germany.55.d:0 "Місто Франкфурт потрапив у руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.55.a:0 "Вони проникли в серце Рейха!"

  ww2_germany.56.t:0 "Мюнхен Пал"
  ww2_germany.56.d:0 "Місто Мюнхен потрапив в руки ворога, ми повинні повернути його будь-якою ціною!"
  ww2_germany.56.a:0 "Вони проникли в саме серце Рейха!"

