  ENG_no_further_appeasement_tt:1 "§YШтраф на стабільність зменшуються на 5% на кожні 5% світового стресу§! Після 10%."
  ENG_no_further_appeasement_tt_1:1 "£faction_eng_labour Лейборісти і £faction_eng_conservative Консерватори стануть §Rменш привітні§!, Знизив §Yстабільність§! на §R15%§!."
