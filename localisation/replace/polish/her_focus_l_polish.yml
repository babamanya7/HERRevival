  ENG_found_the_sas:0 "Знайдено SAS"
  ENG_found_the_sas_desc:0 "Офіцер на ім'я Девід Старлінг (David Stirling) придумав ідею про те, що невеликий підрозділ спецназа може завдати противнику величезний урон. «Повітряна служба» Існує ще один привілей, який змушує противника думати, що він також повинен захищатися від десантників, і ця ідея може бути хорошою."

