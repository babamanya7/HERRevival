  ENG_no_further_appeasement_tt_3:1 "£faction_eng_labour Лейборісти і £faction_eng_conservative Консерватори стануть §Rменш привітні§!, Знизив §Yстабільність§! на §R15%§!."
  ENG_no_further_appeasement_tt_4:1 "£faction_eng_labour Лейборісти і £faction_eng_conservative Консерватори стануть §Rменш привітні§!, Знизив §Yстабільність§! на §R20%§!."
  ENG_no_further_appeasement_tt_5:1 "£faction_eng_labour Лейборісти і £faction_eng_conservative Консерватори стануть §Rменш привітні§!, Знизив §Yстабільність§! на §R25%§!."

  ENG_kickstart_the_war_industry_tt:1 "§YМіцність Penalties are dependant on the War situation§!."

  uk_mediterranean_focus_tt:0 "§GДає рішення для поліпшення можливостей цих островів.\n§!"

  new_military_projections:0 "Нові військові прогнози"
  new_military_projections_desc:0 "Наша сьогоднішня військова організація не відображає нової доктрини, яку ми розробляємо, і наш начальник штабу радить переглянути всі аспекти нашої військової стратегії, щоб дотримуватися нашого процесу перевозу."
  new_military_projections_tt:1 "Надає §YШаблон довгої танкової дивізії§! і §YЗвичайний танковий стиль§!.\n"

  shadow_scheme_focus_tt:1 "Надає §G12§! комірок для будівництва і будівництва §Y12 Військові фабрики§! всього в трьох регіонах, коли починається війна.\n"
  CAN_shadow_scheme_focus_tt:1 "Надає §G6§! комірок для будівництва і будівництва §Y6 військових заводів§! всього в трьох регіонах, коли починається війна.\n"

  USA_call_up_the_national_guard:0 "Назва Національної гвардії"
  USA_call_up_the_national_guard_desc:0 "Буде розвертатися і ходити автоматично, якщо війна"
  national_guard_tt:1 "розвертати§G18§!§Yдивізії Національної гвардії§!По всіх штатах.\n"
  national_guard_deployed:0 "Національна гвардія вже розвернута"

  USA_progress_the_wpa:0 "Продовжити ОРС"
  USA_progress_the_wpa_desc:0 "Ми повинні продовжувати WPA і зосередитися на громадських парках, громадських будівлях, громадських послугах, аеропортах і транспорті, а також створити федеральний письменникський проект."

  USA_modernize_the_army:0 "Модернізувати армію"
  USA_modernize_the_army_desc:0 "Наша армія погано підготовлена і досі бореться тактикою Великої війни, ми консультувалися з нашими інженерами і тактиками, щоб покращити наше розуміння цих нових військових машин."

  USA_restructure_the_national_army:0 "Реорганізувати національні війська"
  USA_restructure_the_national_army_desc:0 "Наша армія десятиліттями перебувала в стані застою і сплячки, і прийшов час почати реорганізацію армії, щоб нові рекрути могли бути відведені в лоно."

  USA_USACE_investments:0 "Інженерні війська США"
  USA_USACE_investments_desc:0 "Інженерний корпус армії США має багату історію в Сполучених Штатах Америки у будівельних проектах як у мирний, так і в воєнний час. Оскільки складність воєнних дій продовжує зростати, ми можемо очікувати, що їх технічний досвід буде надзвичайно корисним."

  USA_carpet_bombing:0 "Коврові бомбардування"
  USA_carpet_bombing_desc:0 "Також відомий як бомбардування насиченням, килимове бомбардування призначено для знищення цілих ділянок землі, наші стратегічні бомбардувальники закриють сонце над небом наших ворогів. Вони не знатимуть ні безпеки, ні миру."

  USA_morgenthau_plan:0 "План Моргентау"
  USA_morgenthau_plan_desc:0 "Секретар казни Херні Моргентау-молодший розробив план ліквідації будь-якої спроможності Німеччини вести війну, видаливши всю свою промислову потужність. Тоді як радикальний, розслаблений варіант його плану може бути впроваджено, щоб обмежити військові можливості Німеччини."

  USA_heavy_tank_doctrine:0 "Доктрина важких танків"
  USA_heavy_tank_doctrine_desc:0 "Дивно, що ми, як найбільш індустріалізована країна у світі, не маємо можливості доставляти найбільші танки, а не як якості, якщо маємо і те, і інше."


  USA_create_unit_airborne_tt:0 "Дає шаблон елітної дивізії парашутистів."

  USA_the_global_super_power:0 "Глобальна супердержава"
  USA_the_global_super_power_desc:0 "Сполучені Штати є опротестом демократії в західному світі, і, досягнувши від моря до сяючого моря, ми є маяком надії, що освітлює небо, як місто на пагорбі."

  USA_focus_on_asia_tt:0 "Починає місію §Yпроекції сили§! в тихому океані, коли інша велика зухвала стає загрозою."

  USA_intervention_mandate_tt:0 "Відкрити §YМандати на інтервенцію§!Завдяки Конгессу розпочати війну проти іншої країни."

  USA_war_foundations:0 "Основи війни"
  USA_war_foundations_desc:0 "Наша сьогоднішня армія недосвідчена і застаріла, спираючись на звіти про тривалу війну, ми зможемо інформувати про наші військові рішення."

  USA_join_the_allies:0 "Приєднатися до союзників"
  USA_join_the_allies_desc:0 "Америка досить довго залишалася байдужим спостерігачем, коли ви бачите гримучого змія, готового на удар, ви не чекаєте, поки він вдарить, щоб розчавити його. Американці захищатимуть свободу і свободу незалежно від того, де вони знаходяться."

  USA_start:0 "Продовжити новий курс"
  USA_start_desc:0 "З огляду на те, що країна в руїнах, Рузвельт зміг повернути США на ноги завдяки першому новому курсу. Однак Рузвельт втратив деяку підтримку, на відміну від широкої підтримки першого Нового курсу, хоча його мета у бізнесі почалася у Другому Новому Курсі. Однак, більшість населення все ще підтримує Рузвельта, незважаючи на зниження енергії Нового курсу."

  USA_renew_the_neutrality_act:0 "Закон - угода про нейтралітет 1935 р."
  USA_renew_the_neutrality_act_desc:0 "З ростом напруженості в Європі та Азії, а також великою історією ізоляціонізму здається природним, що Сполучені Штати продовжуватимуть йти шляхом невтручання, і обидві сторони підтримують ці заходи."

  USA_spanish_civil_war_amendment:0 "Поправка до громадянської війни в Іспанії"
  USA_spanish_civil_war_amendment_desc:0 "За допомогою лазів у діях законів про нейтралітет щодо громадянських війн американські компанії змогли продати величезну кількість зброї націоналістичним людям Іспанії, і це не може тривати."

  USA_hatch_act:0 "Закон про запобігання згубній політичній діяльності"
  USA_hatch_act_desc:0 "Щоб виправити корупцію в уряді, закон Гетча забороняє залякування або підкуп виборців і обмежує політичну діяльність федералів. Він забороняє використовувати будь-які державні кошти, призначені для допомоги або громадських робіт у виборчих цілях, і забороняє чиновникам, які отримують оплату з федеральних фондів, використовувати обіцянки про роботу, просування, фінансову допомогу, контракти чи будь-яку іншу вигоду для примусової кампанії або політичної підтримки."

  USA_rural_electrification_act:0 "Керування електрикою солов"
  USA_rural_electrification_act_desc:0 "З огляду на те, що пилова чаша росте на Великих рівнинах, а бідні фермери страждають у сільських місцевостях, необхідні інвестиції в ці райони. Адміністрація електрифікації сільських районів повинна розпочати амбітне амбітне амбіціозне планування сільської місцевості, що вважається непрактичним і дорогим."

  USA_wagner_steagall_act:0 "Закон Вагнера-Стігалла"
  USA_wagner_steagall_act_desc:0 "Закон про житло, або Закон Вагнера-Стігола, буде спиратися на попередні програми допомоги, такі як Національний житловий акт 1934, щоб полегшити фінансування і будівництво будинків для бідних сімей."

  USA_WPA_roads:0 "Розширення сільських доріг"
  USA_WPA_roads_desc:0 "Використовуючи ресурси ВПА і для надання допомоги Адміністрації по електрифікації сільських районів, ми створимо сільські дорожні мережі, щоб поліпшити ефективність транспортування сільськогосподарських культур і матеріалів Через сільські райони."

  USA_robinson_patman_act:0 "Закон Робінсона Патмана"
  USA_robinson_patman_act_desc:0 "Закон Робінсона Петмена і закон про боротьбу з ціновою дискримінацією покликані перешкодити постачальникам продавати на різні ринки за різними цінами для подальшої боротьби з трастами."

  USA_boulder_dam:0 "Завершити будівництво дамби Боулдера"

  USA_expand_tva:0 "Розширити Адміністрацію долини Теннессі"
  USA_expand_tva_desc:0 "Управління долини Тенессі вже виявило життєздатність комунальних компаній у федеральній власності. Подальші інвестиції в цю корпорацію принесуть користь регіонам у долині Тенессі, які особливо постраждали від Великої депресії."

  USA_napalm:0 "Перевірка напалмових бомб"
  USA_napalm_desc:0 "Napalm був розроблений спочатку командою на чолі з хіміком Луї Фізером для Служби хімічної війни США в 1942 в таємній лабораторії Гарвардського університету. Це суміш гелеподібного агента і летючого нафтохімічного (зазвичай бензину (бензина) або дизельного палива."

  USA_depression_fix:0 "§GПоступово зменшує наслідки Великої депресії§!\n"

  USA_price_control_act:0 "Федеральний закон про справедливе ціни"
  USA_price_control_act_desc:0 "Замість непрямого підходу до контролю над ринками ми можемо встановлювати прямі ціни на товари, щоб краще задовольняти потреби фермерів і уникати непотрібних відходів."

  USA_second_agricultural_adjustment_act:0 "Другий закон щодо регулювання сільського господарства"
  USA_second_agricultural_adjustment_act_desc:0 "Для того, щоб продовжити план FDR для полегшення фермерів і дотримуватися дозволу від США проти Батлера, другий закон про корегування сільського господарства буде фінансувати себе, використовуючи державне фінансування замість податків на переробників."

  USA_federal_works_administration:0 "Створення Федерального агентства з роботи"
  USA_federal_works_administration_desc:0 "Федеральне управління будівництва об'єднає декілька будівельних програм, в першу чергу WPA, в єдину адміністрацію, щоб спростити планування і адміністрування будівництва, а також відкрити більше Функціонування міжпрограмної співпраці."

  USA_interstate_road_board:0 "Виготовлення Національної ради"
  USA_interstate_road_board_desc:0 "Для надання допомоги адміністрації електрифікації сільських районів, а також подальшого з'єднання бідних фермерів до ринків було висунуто ідею створення великої міждержавної дорожнього мережі для полегшення Транспортувати товари."

  USA_farmer_relief_act:0 "Закон про допомогу фермерів"
  USA_farmer_relief_act_desc:0 "З курної чаші, яка тероризує Великі рівнини, пряме полегшення повинно бути доступним для борчих фермерів, щоб повернути їх на ноги."

  USA_farm_bankruptcy_act:0 "Акт про банкрутство ферм"
  USA_farm_bankruptcy_act_desc:0 "У перші роки свого президентства Рузвельт приділяв велику увагу захисту фермерів. Якщо ми хочемо зберегти їхню підтримку, нам потрібно буде пройти далекі заходи захисту, які будуть сприйняті як спірні деякі представники американської громадськості."
  USA_farm_bankruptcy_act_tt:0 "§YЗапропонують освіту нейтрального блоку у випадку громадянської війни.§!"

  USA_judicial_reform:0 "Законопровід про реформу судових процедур"
  USA_judicial_reform_desc:0 "Оскільки консервативний Верховний суд скасовує життєво важливі нові програми угод, потрібно вжити заходів, щоб захистити американських людей і допомагати іншим органам влади 2. Запустивши амбітний план.\"Court Packing\\", Ми можемо отримати контроль над судом для забезпечення безпеки наших програм."

  USA_nira_act:0 "NIRA акт"
  USA_nira_act_desc:0 "Тепер, коли ми змогли зробити так багато радикальних змін у нашій країні, президент вважає, що настав час переглянути скасування NIRA. Якщо ми зможемо відновити його, це матиме великий і різний вплив у нашій країні."

  USA_accumulated_wealth_tax:0 "Нагромадження грошей"
  USA_accumulated_wealth_tax_desc:0 "Щоб фінансувати програми Нового курсу, багаті мусять платити свою частку американському народу, щоб підтримати їх. Для цього буде введено податок на стан понад 50 000 доларів, щоб запобігти величезній накопиченні цього багатства."

  USA_fair_labor_standards_act:0 "Закон про справедливі трудові стандарти"
  USA_fair_labor_standards_act_desc:0 "Щоб захистити права робітників і запобігти експлуататорним стосункам, робітники повинні мати чіткі права, в першу чергу мінімальну заробітну плату."

  USA_worker_autonomy_act:0 "Закон про автономність робітників"
  USA_worker_autonomy_act_desc:0 "Щоб краще представляти народ Америки, фабрики матимуть певні обмеження на те, як вони можуть контролювати поведінку заводів, в першу чергу заборона на вступ робітників у профспілки."

  USA_union_recognition_act:0 "Закон про визнання Союзу"
  USA_union_recognition_act_desc:0 "Щоб допомогти американському працівнику, повинен бути прийняти закон, який змусить власників фабрик визнавати профспілки, які становлять більше, ніж 25 відсотків усіх галузей."

  USA_business_relations_act:0 "Закон про ділові справи"
  USA_business_relations_act_desc:0 "Щоб налагодити тіснішу співпрацю між працівниками та бізнесом, потрібно прийняти закони, спрямовані на примирення цих двох сторін і відкритий діалог про те, як краще керувати промисловістю."

  USA_board_of_business_management:0 "Поради щодо поліпшення бізнесу"
  USA_board_of_business_management_desc:0 "Щоб розпочати подальше обговорення, потрібно створити пораду, яка представляє як профспілки, так і підприємства, для обговорення відповідних протоколів ведення бізнесу."

  USA_cash_and_carry_act:0 "Програма «Кеш енд Керрі»"
  USA_cash_and_carry_act_desc:0 "Тоді як колишні нейтральні акти перешкоджали продажу зброї країнам, що перебувають у стані війни, було зроблено виняток, що дозволяє продавати товари, поки ця країна оплачувала Хоча ця ситуація з тих пір закінчилась, ми можемо заохотити Конгрес відновити цю позицію для постачання союзників."
  USA_cash_and_carry_act_tt:0 "§GЗакусити військову техніку у США - Британію§!"

  USA_lend_lease_act:0 "Закон про ленд-ліз"
  USA_lend_lease_act_desc:0 "З успіхом програми грошових коштів і зростаючої громадської підтримки війни, подальші поставки повинні бути направлені союзниками за кордоном. Закон про ленд-ліз дасть таким країнам, як Великобританія та Радянський Союз, військові матеріали в обмін на оплату після війни."

  USA_CRA:0 "Створення АРК"
  USA_CRA_desc:0 "Після завершення будівництва дамби Боулдер район навколо річки може стати сільськогосподарським і, можливо, навіть великим містом. інвестиційні проекти"

  USA_invest_in_junior_colleges:0 "Інвестиції в юнацькі коледжі"
  USA_invest_in_junior_colleges_desc:0 "Закон Сміта-Хьюза 1917 року справив великий вплив на надання професійної освіти і навчання студентів до спеціалізованих робіт для збільшення фінансування цих програм через молодші коледжі, Ми можемо і далі піднімати людей з нижчих класів на високооплачувану і кваліфіковану роботу"

  USA_wait_out_the_recession:0 "Перечекати рецесію"
  USA_wait_out_the_recession_desc:0 "Хоча рецесія може виглядати жахливо, це просто очікуваний результат переходу американської економіки від державних витрат, і не про що турбуватися"
  USA_wait_out_the_recession_tt:0 "§GЦей фокус закінчиться, якщо ви перечекаєте рецесію Рузвельта замість того, щоб намагатися виправити її за допомогою кейнсіанської економіки.§!\nВідкриває послідовний ланцюжок з §Y3 інвестиційні рішення§!.\n§YКраїна вільних людей§!: зростання фінансів §G+25%§!.\nБудьте врівноважені §YGM/DuPont§! отримує бонуси до боєприпасів, артилерії і гуми.\nУ дружніх стосунках §YKaiser§! отримує бонуси до будівництва інфраструктури і верфей."
  USA_JPMorgan_new_deal_decisions_tt:0 "Відкриває вікно розв’ язку §YПереговори з J.P. Morgan§! і §YПоліпшити стосунки з J.P. Morgan§! на вкладці §YВнутрішні фракції§!."
  USA_TVA_Ford_faction_bonus_tt:0 "У дружніх стосунках §YFord/Chrysler§! отримає §G+7,5%§! до максимальної ефективності виробництва, §G+10%§! до швидкості будівництва військових заводів і §G+10%§! до зростання ефективності виробництва."

  USA_keynesian_economics:0 "Кейнсіанська економіка"
  USA_keynesian_economics_desc:0 "В умовах погіршення стану економіки після недавнього скорочення бюджету потрібно використовувати інші варіанти. Теорія Джона Мейнарда Кейнса про те, що державні витрати необхідні для стимулювання економіки, пропонує рішення, що включає розширення багатьох державних робочих програм для перезапуску американської Економічна ситуація."

  USA_budget_balancing:0 "Балансування бюджету"
  USA_budget_balancing_desc:0 "Американська економіка, нарешті, повертається в потрібне русло, і настав час почати повільний процес переходу зайнятості з державного сектора в приватний, скорочення фінансування багатьох державних програм."
  USA_budget_balancing_tt:0 "§RМоже викликати рецесію§!"

  USA_limited_rearmament:0 "Обмежене переозброєння"
  USA_limited_rearmament_desc:0 "Громадськість як і раніше категорично проти відсилання наших чоловіків вмирати в чужі країни. Недавній запит англійців на закупку американського обладнання дав нам привід збільшити виробництво З достатньою підтримкою ми можемо збільшити цю суму."

  USA_selective_service_act:0 "Закон про виборчу службу"
  USA_selective_service_act_desc:0 "Ця війна була набагато важливішою, ніж ми спочатку думали. З достатньою політичною підтримкою ми можемо провести заклик, який дозволить нам підготувати резервну армію, якщо конфлікт коли-небудь досягне берегів Америки."
  USA_selective_service_act_tt:0 "§GМоже навчати до 50 резервістів\nКоли почнеться війна, закон про робочу силу переключиться на службу вибору.§!"
  USA_selective_service_act_flag:0 "Є закон про виборчу службу"

  USA_rubber_reserve_company:0 "Резінова резервація"
  USA_rubber_reserve_company_desc:0 "Наш доступ до каучуку в Південно-Східній Азії з кожним днем стає все більш небезпечним, ми не можемо дозволити собі покладатися лише на запаси каучуку в Південній Америці, щоб годувати нашу військову машину. Ми повинні негайно приступити до створення програми виробництва синтетичного каучуку в США."

  USA_naval_rearmament_act:0 "Закон про переозброєння військово-морського"
  USA_naval_rearmament_act_desc:0 "Якщо війна коли-небудь переросте в глобальні масштаби, найбільшою перевагою Сполучених Штатів буде наш контроль над великими районами океану, які відділяють нас від конфлікту. Ми повинні гарантувати, що американські води завжди будуть у безпеці."

  USA_flint_strike_support:0 "Не втручався в сидячий страйк Флінта"
  USA_flint_strike_breakup:0 "Втрутився в сидячий страйк Флінта"

  congress_massive_support_trigger_tt:0 "Потрібна підтримка як мінімум §Y65 Сенаторів§W (потрібні: [?senators_support|W0])§W і §Y303 Речники §W(потрібні: [?representatives_support|W0])"

  USA_waited_out_roosevelt_recession:0 "Перечекала рецесію"
  USA_delt_with_roosevelt_recession:0 "Втрутився в рецесію"


  USA_undistributed_profits_tax:0 "Винаходи на нездійсненний прибуток"
  USA_undistributed_profits_tax_desc:0 "Податок на незроблені прибутки був ще одним видом податку на багатство, включене в Закон про прибуток 1936 року. У законопроекті було встановлено принцип, згідно з яким підтримуваючий корпоративний прибуток може складатися податком. Ідея полягала в тому, щоб змусити великі підприємства розподіляти прибуток у вигляді дивідендів і заробітної плати, а не економити або реінфенсувати їх. Це було зроблено для отримання прибутку для оплати програм Нового курсу Рузвельту."

  USA_banking_industry_loans:0 "Кредити банківської галузі"
  USA_banking_industry_loans_desc:0 "З моменту обрання Рузвельт боровся з банківською рамкою, особливо з монополією на монополію J.P. Morgan. «Новий курс» Накопичуються, і федеральні уряди закінчують свої оплату, забираючи кредити в цих банках, збагатили б їх, але запобігали б тискові на бізнес через нові податки."

  USA_emergency_shipbuilding_program:0 "Програма аварійного завершення"
  USA_emergency_shipbuilding_program_desc:0 "Морська комісія бачить можливу загрозу війни між двома океанами, тому проводить програму, яка забезпечує Сполучені Штати Америки достатнім виробництвом торговельних та військових кораблів. Генрі Кайзеру призначено створити великі виробничі потужності для кораблів, яких ще не було в історії."

  USA_veteran_employement:0 "Ретерани праці"
  USA_veteran_employement_desc:0 "FDR намагався зупинити Скоректований закон про компенсацію через вето на тому розумінні, що до здорових ветеранів слід ставитися інакше, ніж до пересічного громадянина. Замість того, щоб платити ветеранам подачки, альтернатива є гарантією їхньої роботи, ми просто не можемо гарантувати їх лікування на вільному ринку."

  USA_tva_ford_cooperation:0 "Співпраця TVA-Ford"
  USA_tva_ford_cooperation_desc:0 "Хоча Форду було відмовлено в можливості побудувати енергетичну технологію для обслуговування долини Теннессі, їхній капітал і інженерний досвід можуть бути корисними. З роздуванням федерального бюджету і збільшенням боргу, приватна промисловість може допомогти, навіть якщо це дасть Титанам більше влади."

  USA_appoint_william_knudsen:0 "Призначити Вільяма Кнудсена"
  USA_appoint_william_knudsen_desc:0 "Вільям Кнудсен (William Knudsen) — колишній виконавчий директор автомобільної промисловості, який має досвід, необхідний, щоб переконати титанів галузі, таких як Ford, Chrysler і GM, внести свій вклад в їх Завдяки великим промисловим базам він може швидко наростати."

  USA_keynesian_militarism:0 "Кейнсіанський мілітаризм"
  USA_keynesian_militarism_desc:0 "З наближенням кейсіанства як початкової школи економічної думки в США, він також може бути використаний у військовому відношенні. Після відновлення Великої депресії всі робочі програми можуть бути переміщені в сторону підготовки США до майбутнього конфлікту. У дусі кейсіанства, так само як фінансовані урядом програми покращили країну для цивільних людей, вони можуть поліпшити нашу готовність до війська таким же чином."

  USA_tva_alcoa_cooperation:0 "Співпраця з TVA-Alcoa"
  USA_tva_alcoa_cooperation_desc:0 "Оскільки TVA є провідним постачальником енергії для долини річки Теннессі, приватні компанії, такі як Aluminum Company of America, Alcoa, можуть використовувати ці величезні можливості виробництва енергії для Будівництво найбільшої алюмінієвої фабрики у світі, це знадобиться під час конфлікту."

  USA_Kaiser_Positive_1_tt1:1 "£faction_usa_kaiser §YKaiser's Industries§! стає більше §GВпливові§!, збільшувати £GFX_faction_construction_civilian_icon §YШвидкість будівництва§! на §G5%§! і збільшує ймовірність того, що вони внесуть свій внесок у майбутній війні."

  USA_Kaiser_Dockyard_Swap_tt:1 "£faction_usa_kaiser §YKaiser's Industries§! стає більше §GВпливові§! і повністю перемикається на кораблябудівлі, §RУмить§! всі бонуси на £GFX_faction_construction_civilian_icon §YШвидкість будівництва§! і §GДає§! £GFX_faction_construction_dockyard_icon §YШвидкість будівництва верфей§! і £GFX_faction_dockyard_icon §Yшвидкодія верфі§!"

