  USA_JPMorgan_Positive_1_tt1:1 "£faction_usa_jpmorgan §YJ.P. Morgan§! стає більше §GПрихильні§!, збільшувати £GFX_faction_stability_icon §Yстабільність§! на §G+5%§! і менша £GFX_faction_consumer_goods §Yфабрики, що виробляють товари для народного вжитку§! на §Y-4%§! і збільшує ймовірність того, що вони внесуть свій внесок у майбутній війні."

