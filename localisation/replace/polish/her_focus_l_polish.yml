  USA_Ford_swap_tt:1 "£faction_usa_chrysler_ford §YFord/Chrysler§! повністю переключається на воєнне виробництво, §RУмить§! весь бонус на £GFX_faction_construction_civilian_icon §YШвидкість будівництва фабрик§! і §GДає§! £GFX_faction_industry_icon Об'єм заводського виробництва і £GFX_faction_construction_military_icon Швидкість будівництва."

  USA_GM_swap_tt:1 "£faction_usa_gm_dupont §YGM/Dupont§! повністю переключається на воєнне виробництво, §RУмить§! весь бонус на £GFX_faction_construction_civilian_icon §YШвидкість будівництва фабрик§! і §GДає§! £GFX_faction_research_icon Швидкість дослідження і £GFX_faction_efficiency_icon Швидкість зростання виробництва."

  USA_JPMorgan_economic_reduction_tt:1 "£faction_usa_jpmorgan §YJ.P. Morgan§! пропонує покривати понад витрати, не оплачені урядом США, зменшуючи економічну втому."

