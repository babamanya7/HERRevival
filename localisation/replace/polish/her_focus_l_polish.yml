  JAP_preparations_to_secure_the_islands:0 "Підготовка до захоплення островів"
  JAP_preparations_to_secure_the_islands_desc:0 "Багаті ресурси острова Голландської Ост-Індії є головною метою нашої війни в південній частині Тихого океану, а американські та їхні маріонетки на Філіппінах блокують нас від наших цілей. Наші солдати повинні бути навчені захоплювати і утримувати ці регіони."

  JAP_tojos_cabinet:0 "Кабінет Тодзіо"
  JAP_tojos_cabinet_desc:0 "Він був занадто слабким і боягузливим, щоб вести Японію проти Західних держав, і знає, що для майбутнього Японії немає надто багато грошей."

  JAP_reform_the_officers:0 "Реформа офіцерів"
  JAP_reform_the_officers_desc:0 "Тодзьо є популярним лідером в нашій армії, з його новими повноваженнями в уряді він може, нарешті, реформувати офіцерів і привести армію до п'ятки."

  JAP_imperial_rule_association:0 "Імперська асоціація правління"
  JAP_imperial_rule_association_desc:0 "Асоціація імперського правління під керівництвом Фумімаро Коное дасть йому платформу для просування цілей його руху «Новий порядок»Це дозволить нам мілітаризувати населення, щоб максимізувати ефективність спільних військових зусиль Японії."

  JAP_konoes_cabinet:0 "Кабінет Коное"
  JAP_konoes_cabinet_desc:0 "Японія більше не може заграти з декадентськими західними ідеями лібералізму. Янки і англо-американці показали, що вони не готові співпрацювати з Японією. Коное виведе Японію проти всього світу!"

  JAP_strike_north_doctrine:0 "Північна доктрина"
  JAP_strike_north_doctrine_desc:0 "Армія вважає, що вторгнення Радянського Союзу на Північ буде набагато простішим, ніж примушення себе до війни з західними державами, які реалізують Сибірську рівнину, даючи відповідь на нашу нестачу ресурсів."

  JAP_german_technological_exchange:0 "Німецька технологічна біржа"
  JAP_german_technological_exchange_desc:0 "Німці дуже далекі від нас, але вони виявили готовність до співпраці, і якщо ми хочемо співпрацювати, щоб знищити радянського ведмедя, то маємо сенс поділитися деякими нашими технологіями."

  JAP_the_korean_project:0 "Корейський проект"
  JAP_the_korean_project_desc:0 "Корея є воротами Японії на континент, і без цього наші мрії про імперію ніколи не здійсняться, вони повинні бути прив'язані до нас."

  JAP_industrialize_the_north:0 "Індустріалізація Півночі"
  JAP_industrialize_the_north_desc:0 "Північні регіони Кореї створюють сприятливі умови для індустріалізації, ми можемо використати цей простір для будівництва заводів, які ми не змогли б розмістити на наших рідних островах."

  JAP_fully_integrate_korea:0 "Повністю інтегрувати Корею"
  JAP_fully_integrate_korea_desc:0 "Корейці успішно пристосовувалися до японських традицій та культури, і їм треба було визнати свій статус у складі Японії."

  JAP_industrialize_the_south:0 "Індустріалізація Півдня"
  JAP_industrialize_the_south_desc:0 "Південний кінець Корейського півострова стане місцем для громадських промислових проектів, які ми не можемо знайти на внутрішніх островах."

  JAP_support_menjiang_claims:0 "Підтримайте претензії Менцзяна"
  JAP_support_menjiang_claims_desc:0 "Наша маріонетська маріонетка не мала легітимності, щоб нав'язати свої претензії всій Монголії, і з нашою допомогою вони зможуть знову заявити про себе на території, втраченій Кітаєм і Радам."

  JAP_crush_the_remaining_warlords:0 "Ковчег позосталих воєначальників"
  JAP_crush_the_remaining_warlords_desc:0 "Націоналісти зазнали поразки, а їхні дрібний Об'єднаний фронт в руїнах, і настав час заставити нашу владу над Китаєм!"

  JAP_exploit_the_southern_resource_area:0 "Експлуатація завойованих територій"
  JAP_exploit_china_desc:0 "Наші війни дорого коштують нашій економіці, і ми розробили плани використання підконтрольних нам районів Китаю, щоб краще контролювати нашу економічну ситуацію."

  JAP_modernization_effort:0 "Зусилля модернізації"
  JAP_modernization_effort_desc:0 "Війна продовжує розвиватися, і ми не можемо бути спіймані без неї, більш важкі броновані та транспортні варіанти дадуть нам перевагу в боротьбі з ворогами Японії."

  JAP_kokura_arsenal:0 "Арсенал Кокура"
  JAP_kokura_arsenal_desc:0 "Kokura Arsenal є одним з найбільших зарубіжних заводів Японії, які будуть розширені, щоб озброїти наших солдатів."

  JAP_advanced_weaponary:0 "Розширена зброя"
  JAP_advanced_weaponary_desc:0 "Хоча зайвою зброєю наших солдатів є арисака і багнет, ми потребуємо сучасної зброї для боротьби з сучасними ворогами. Для виконання цього завдання повинні бути розроблені більш важкі артилерійські та протитанкові платформи."

  JAP_new_bomber_projections:0 "Нові проекти бомбардувальників"
  JAP_new_bomber_projections_desc:0 "Наші сучасні бомбардувальники виявилися неефективними проти виснажливих морських і наземних цілей, а нові бомбардувальники, які можуть нести важчі боєприпаси."

  JAP_the_imperial_japanese_air_force:0 "Імператорські ВС Японії"
  JAP_the_imperial_japanese_air_force_desc:0 "Конфлікт між IJN та IJA призвів до розвитку двох різних військово-повітряних сил з їхньою власною тактикою і літаками. Ця дрібна конкуренція повинна бути зметена заради нашої імперії, і будуть сформовані нові об'єднані і незалежні військово-повітряні сили."

  JAP_project_z:0 "Проект Z"
  JAP_project_z_desc:0 "Американські бомбардувальники наших міст викликали тріщини у вірі нашого народу в імперію, ми повинні мати можливість помститися Сполученим Штатам і створити власний стратегічний бомбардувальник далекого вчинку."

  JAP_synthetic_resource_studies:0 "Дослідження синтетичних ресурсів"
  JAP_synthetic_resource_studies_desc:0 "У той час як брак нашої промисловості можна вирішити, просто збудувавши більше заводів, ми не можемо вирішити проблему нестачі природних ресурсів, просто створюючи їх."

  JAP_imperial_synthetic_programme:0 "Імперська синтетична програма"
  JAP_imperial_synthetic_programme_desc:0 "Ми досягли того, що раніше вважали неможливим, і тепер виготовили з вугілля Резіну та нафти, і Японія вимагає від нас розширення їх виробництва."

  JAP_operation_ketsugo:0 "Операція Кецуго"
  JAP_operation_ketsugo_desc:0 "Іноземні загарбники висадилися на нашій рідній землі, кожен громадянин Японії повинен бути готовий віддати своє життя за нашу країну."

  JAP_strike_at_china:0 "Удар по Китаю"
  JAP_strike_at_china_desc:0 "[Root.GetNameDefCap] Бідний ресурс, але наші сусіди - ні, ми повинні забрати у них те, чого нам не вистачає, і для цього нам потрібно лише привід. Таке виправдання могли дати кілька передбачливих солдатів, після чого імператор не матиме іншого вибору, окрім як погодитись на війну, як би погано вона не була підготовлена..."

  JAP_hideo_iwakuros_order:0 "Заказ генерала Івагуро"
  JAP_hideo_iwakuros_order_desc:0 "Генерал Івакуро попросив створити важкі танки більше, ніж ми коли-небудь бачили, ці сталеві звірі повернуть будь-яку битву на нашу користь."

  JAP_kijiro_nambus_works:0 "Роботи Кідзіро Намбу"
  JAP_kijiro_nambus_works_desc:0 "Kijrio Nambu - один з найбільш талановитих дизайнерів зброї. Його конструкції повинні мати додатковий пріоритет, щоб вони могли бути зроблені і відправлені на нашу лінію фронту раніше."

  JAP_integrate_takasago_volunteers:0 "Інтеграція волонтерів Такасаго"
  JAP_integrate_takasago_volunteers_desc:0 "Наші вірні піддані у Формозі більше підходять для тропічного клімату, ніж ми, і ми набрали багато добровольців, які будуть спеціально споряджені для бойових дій у суворих умовах південної частини Тихого океану."

  JAP_investment:0 "Інвестиції"
  JAP_investment_desc:0 "Зайбацус - наріжний камінь японської економіки, ми повинні інвестувати в важку промисловість і переробку ресурсів, щоб ці компанії могли працювати на піку продуктивності."

  JAP_subsidize_the_okura:0 "Змінювати Okuragumi Shokai"
  JAP_subsidize_the_okura_desc:0 "Компанія Okuragumi Shokai є одним з наших найбільших zaibatus."

  JAP_nationalize_civilian_industry:0 "Націоналізувати громадянську промисловість"
  JAP_nationalize_civilian_industry_desc:0 "Воля імператора є законом, тому що імперський контроль повинен здійснюватися над нашою громадянською промисловістю, щоб направити її на благо Японії."

  JAP_torpedo_ships:0 "Торпедні кораблі"
  JAP_torpedo_ships_desc:0 "Торпеда є цінним інструментом, який, керуючись волею імператора, може збивати найбільші з лінкорів кораблі."

  JAP_auxiliary_carriers:0 "Допоміжні авіаносці"
  JAP_auxiliary_carriers_desc:0 "Хоча літаки слабкі і крихкі, вони будуть корисними в наших військових таморських операціях, ми повинні зосередитися на створенні маленьких перевезень, щоб уникнути надмірних інвестицій."

  JAP_super_submarines:0 "Супер підводні човни"
  JAP_super_submarines_desc:0 "Коли ці підводні човни стікаються під воду, вони можуть порушувати ворожі зв’язки, аж поки основні сили флоту ведуть бій."

  JAP_heavy_escorts:0 "Важкий ескорт"
  JAP_heavy_escorts_desc:0 "Величезні океани навколо Японії представляють наші найсильніші сторони та наші найбільші слабкості, і ми повинні забезпечити безпеку наших морських шляхів від будь-якого іноземця."

  JAP_island_bulwarks:0 "Острови Бастіони"
  JAP_island_bulwarks_desc:0 "Наші острови забезпечують природну буферну зону між нашими островами та будь - якою потенційною загрозою, і нам потрібно зробити велику роботу, щоб запобігти нападам ворога."
  JAP_island_bulwarks_tt:0 "§G Додає рішення, щоб продовжити оновлення можливостей цих островів.\n§!"

  JAP_ensure_military_loyalty:0 "Забезпечити військову вірність"
  JAP_ensure_military_loyalty_desc:0 "Незважаючи на те, що воєнна революція була бажаною, ми не можемо дозволити собі більш непередбачуваних дій з боку армії. З такою кількістю армійських офіцерів на урядових посадах ми повинні вжити рішучих заходів, щоб усунути їх вплив."

  GER_issue_weapon_contracts_tt:1 "£faction_ger_industrialists §YПромисловці§! Буде більше §GЛокальніше§! і §GОб’ єм§!\n\n"

  GER_death_before_defeat_tt:0 "\n£faction_ger_ss СС стане більш §GВпливовий§!, зростаючи зростанням §YПолітична влада§! на §G5%§! і §Yстабільність§! на §G5%§!"

  GER_safeguard_the_balkans:0 "Захист Балкан"
  GER_safeguard_the_balkans_desc0:0 "Балкани не випадково називають пороховою бочкою Європи, якщо комунізм спробує закріпитися в Європі, ймовірно, він почнеться саме там."

  GER_four_year_plan:0 "Четвертий план"

  GER_appoint_hermann_goring_tt:0 "§RТепер військові облігації відбуваються вдвічі швидше, але вони дають тільки половину зниження втоми економіки.§!"

  GER_auxiliary_autobahn:0 "Стромочне автобан"
  GER_auxiliary_autobahn_desc:0 "Тепер, коли ми сформували централізовану кільце інфраструктури між нашими великими містами, нам потрібно вийти і з'єднати наші другорядні міста і наші нові території і привести їх в лоно нашого промислового комплексу."

  GER_invest_in_ig_farben_schact:0 "Інвестиції в І.Г. Фарбен"
  GER_invest_in_ig_farben_desc:0 "Компанія I.G. Farben є основним виробником синтетичної продукції і розробила ефективну тактику виробництва цих виробів, ми відправимо фінансування у вигляді контрактів I.G. Farben, щоб дозволити їм розширити свої галузі і надати нам більше ресурсів, які вони можуть виробляти."

  GER_nazi_economics:0 "Нацистська економіка"
  GER_nazi_economics_desc:0 "Економічне міністерство може виступати тільки як знаряддя просування ідеалів партії і не бути перешкодою для опору волі фюрера. Заповнення цих економічних позицій людям в партії допоможе розмазати знаряддя перевозу."

  GER_deutsche_albriet_front:0 "Німецький трудовий фронт"
  GER_deutsche_albriet_front_desc:0 "Представники однієї організації можуть забезпечити простоту політичної організації і легкий вплив, щоб контролювати робочу політику робітника для запобігання страйку і Збільшуючи продуктивність і допомагаючи отримати більше матеріалів."

  GER_reichsarbeitsdienst:0 "Служба праці Рейха"
  GER_reichsarbeitsdienst_desc:0 "Імперська служба праці (Reichsarbeitsdienst/RAD) — велика організація, створена для пом’якшення наслідків безробіття для німецької економіки, мілітаризації робочої сили і привішення їй нацистської ідеології. Під час війни РАД буде займатися постачанням фронтових військ їжею та боєприпасами, ремонтом пошкоджених доріг і будівництвом і ремонтом злітно-посадкових смуг."

  GER_expand_domestic_mining:0 "Удосконалення ресурсів"
  GER_expand_domestic_mining_desc:0 "Сучасні гірничі роботи в наших регіонах повинні вміщати загублену територію і задовольнити вимоги автарки, для цього ми будемо використовувати DAF і нашу нову інфраструктуру."

  GER_explotation_of_acquired_resources:0 "Експлуатація захоплених територій"
  GER_explotation_of_acquired_resources_desc:0 "Тепер, коли ми знайшли нові території, ми повинні інтегрувати об'єкти гірничодобувної промисловості в нашу систему інфраструктури і забезпечити притік робочої сили для забезпечення продуктивності і використання Здобутих ресурсів."
  GER_explotation_of_nations:0 "Розблоковує рішення щодо експлуатації завойованих країн §GЗниження економічної втоми§!"

  GER_continue_autarky:0 "Продовжити автаркію"
  GER_continue_autarky_desc:0 "Аутаркія - єдиний шлях уперед, щоб ми не торгували своїми промисловими потужностями з сільського світу. Ми повинні проковтнути таблетку, навіть якщо це болісно, щоб Німеччина могла залишатися самодостатньою."

  GER_nationalize_synthetic_industries:0 "Націоналізація синтетичних похідів"
  GER_nationalize_synthetic_industries_desc:0 "Незважаючи на те, що компанії досягли успіху в забезпеченні виробництва синтетичних ресурсів, нам потрібен прямий доступ до ресурсів, необхідних для нашої військової машини. Хоча вони будуть божевільними, нам потрібно націоналізувати їх об'єкти."

  GER_invest_in_ig_farben:0 "Інвестиції в І.Г. Фарбен"
  GER_invest_in_ig_farben_desc:0 "Компанія I.G. Farben є основним виробником синтетичної продукції і розробила ефективну тактику виробництва цих виробів, ми відправимо фінансування у вигляді контрактів I.G. Farben, щоб дозволити їм розширити свої галузі і надати нам більше ресурсів, які вони можуть виробляти."

  GER_issue_more_oil_contracts:0 "Підписати більше нафтових контрактів"
  GER_issue_more_oil_contracts_desc:0 "Наша контрактна система належним чином працює з I.G. farben, щоб отримати багато синтетичних ресурсів, тепер нам потрібно розширити їх з більш великими контрактами і дати їм вертикальну інтеграцію ресурсів."

  GER_kdf_wagen_scheme_mil:0 "Схема «Сила через радість»"
  GER_kdf_wagen_scheme_mil_desc:0 "Ми розробили схему для розвитку нашої військової промисловості, випустивши програму, щоб переконати німців купити наш Volkswagen або Народний автомобіль на майбутнє, але замість цього використовувати їх гроші для фінансування Наша зростаюча військова промисловість."

  GER_hermann_goring_werke:0 "Рейхсверке «Герман Герінг»"
  GER_hermann_goring_werke_desc:0 "Конгломерат Герінга-Верке здобуде і націоналізує нашу нескладну стальовану промисловість та інші фабрики і перетворить їх на засіб переозброєння Німеччини для досягнення цілей Гітлера для Вермахту."

  GER_nationalize_german_arms_industries:0 "Націоналізація військової промисловості"
  GER_nationalize_german_arms_industries_desc:0 "Компанії, які відповідають за покупки зброї, некомпетентні і сповільнюють економіку Німеччини, ми повинні діяти, щоб захопити їх фабрики і виробляти більш високими темпами, ніж будь-коли! Хоча нам доведеться розбити кілька яєць, це нам дуже допоможе."

  GER_issue_weapon_contracts:0 "Видача контрактів на зброю"
  GER_issue_weapon_contracts_desc:0 "Розвиток зброї — це завдання, яке вимагає організації. Керівні компанії ефективні, але повинні бути створені стимули для досягнення виробничих цілей, які змушують їх напружувати свої компанії до межі і за його межами для виробництва для Рейху. Платіжі будуть організовані, і зброя буде текти."

  GER_a_continental_army:0 "Континентальна армія"
  GER_a_continental_army_desc:0 "Тепер, коли ми придбали компанії, нам необхідно інтегрувати їх у нашу інфраструктуру, розширити їх потужність і забезпечити доступність всіх необхідних ресурсів для прискорення виробництва."

  GER_Peenemunde_Army_Research_Centre:0 "Армейський дослідницький центр Пенемюнде"
  GER_Peenemunde_Army_Research_Centre_desc:0 "Ми повинні знайти центр виключно військових досліджень, щоб бути на крок попереду наших ворогів."

  GER_vertical_industrial_arms_integration:0 "Вертикальна інтеграція військової промисловості"
  GER_vertical_industrial_arms_integration_desc:0 "Озброєна промисловість робить екстраординарну роботу з цією підвищеною швидкістю, але вузькі місця виникають на перехідних етапах від шахти до заводу, до навчання, до заводу, до запасів. Роздільна здатність цих компаній контролювати ці точки промисловості зменшить вузькі місця і допоможе нашій німецькій ефективності."

  GER_organization_todt:0 "Organisation Todt"
  GER_organization_todt_desc:0 "Організація Тодт відповідає за наші здобуті галузі і організацію деяких з наших власних, ми повинні закріпити його в якості контролера в цю епоху війни."

  GER_rmbum:0 "Імперське міністерство озброєнь і боєприпасів"
  GER_rmbum_desc:0 "qq"

  GER_mobilize_the_workforce:0 "Мобілізація робочої сили"
  GER_mobilize_the_workforce_desc:0 "Рейх більше не може дозволити своїм громадянам бути ледачими і слабкими, кожен громадянин повинен бути частиною військових зусиль."

  GER_wehrmachtshelferinnen:0 "Помічниці Вермахту"
  GER_wehrmachtshelferinnen_desc:0 "Хоча ми не можемо переконати фюрера дозволити жінкам служити на передових позиціях, але ми можемо вирішити деякі з наших кадрів, дозволяючи їм виконувати допоміжні функції."

  GER_appoint_albert_speer:0 "Призначити Альберта Шпеєра"
  GER_appoint_albert_speer_desc:0 "Альберт Шпеер займе пост міністра економіки і буде «використовувати» Люди, яких ми завоювали, щоб доповнити наші галузі до повної потужності, працюють 24/7, 365 днів на рік."
  todt_died:0 "Тодт помер"

  GER_expand_kummersdorf_research_centre:0 "Розширити дослідницький центр Куммерсдорф"
  GER_expand_kummersdorf_research_centre_desc:0 "Куммерсдорф завжди був центром розробки зброї, інвестуючи більше коштів у обладнання і навчання персоналу, ми можемо значно збільшити темпи розвитку наших найновіших проектів."

  GER_city_festungs:0 "Міста фортеці"
  GER_city_festungs_desc:0 "Західна стіна повинна бути удосконалена, щоб включити будь-яку атаку з району Бенілюкса і зміцнити французьку лінію."
  GER_city_festungs_tt:0 "§OВідкриває вирішення проблеми, пов’язаної з створенням укріплених районів для відчайдушної оборони.§!"

  GER_flak_towers:0 "Зенітні башти"
  GER_flak_towers_desc:0 "Наша сім'я вразлива для великомасштабних бомбардувань, інвестуючи у великімасштабні програми будівництва башт Flak, ми можемо знищити ворожі формування, які захищають наші промислові центри."

  GER_realization_of_the_wehrmacht:0 "Розбудова Вермахту"
  GER_realization_of_the_wehrmacht_desc:0 "Протягом десятиліть Німеччина не працювала без реальної армії, а сильна Німеччина потребувала сильної армії."

  GER_reestablish_jager_training:0 "Відновити навчання Егерей"
  GER_reestablish_jager_training_desc:0 "Ягери, або легкий піхота, мають особливу історію в німецькій армії, і їхні традиції будуть продовжуватися створення елітного та спеціалізованого гірського підрозділу «Гебіргсджагерс»."

  GER_reestablish_jager_training_tt:0 "§YЛюдвіг Кюблер§! буде доступний як генерал\n\n"

  GER_fallschirmjager:0 "Десантні дивізії"
  GER_fallschirmjager_desc:0 "Створення елітного підрозділу, здатного проводити великі повітряно-десантні операції і атакувати противника з непохитною вірністю і високою майстерністю, необхідно для війни, які стоять Перед нами."

  GER_the_heers_new_era:0 "Нова доба армії"
  GER_the_heers_new_era_desc:0 "Наша армія опинилася в новій ері техніки і тактики, ми повинні вирішити, яким шляхом йти."

  GER_war_of_movement:0 "Війна руху"
  GER_war_of_movement_desc:0 "Наш досвід у Великій війні показав нам, що наступ, який припиняється, є початком, який зазнає невдачі."

  GER_observations_from_spain:0 "Пошуки з Іспанії"
  GER_observations_from_spain_desc:0 "Наш досвід перемоги в Іспанії був хорошим джерелом знання для наших теоретиків броні."

  GER_creation_of_the_panzertruppe:0 "Створення танкової групи"
  GER_creation_of_the_panzertruppe_desc:0 "З введенням у вермахт більшої кількості і різновидів бронетехніки стало очевидно, що необхідно створити нове спеціальне командування для наших бронетанкових військ."

  GER_refinement_of_bewegungskrieg:0 "Уточнення війни руху"
  GER_refinement_of_bewegungskrieg_desc:0 "Хоча ми досягли успіху без танків, ми не досягли досконалості, ми повинні постійно вивчати і поліпшуватись."

  GER_a_mechanized_army:0 "Механізована армія"
  GER_a_mechanized_army_desc:0 "Війна за рух є ключем до успіху, замість того щоб обмежувати наші танки швидкістю піхоти, ми повинні збільшити швидкість піхоти, щоб іти в ногу з танками!"

  GER_establish_combined_arms:0 "Створення японських військ"
  GER_establish_combined_arms_desc:0 "Хоча танки виглядають як центр бою, вони вразливі і слабі, коли їх використовують наодинці, але їхні слабкості повинні доповнюватися ефективною піхотою."

  GER_aggressive_artillery:0 "Агресивна артилерія"
  GER_aggressive_artillery_desc:0 "Мобільні артилерійські сили повинні бути в змозі йти в ногу з нашими бронетанковими колонами і постійно підтримувати їх."

  GER_durchbruchwagen:0 "Машина просування"
  GER_durchbruchwagen_desc:0 "Концепція важкого проривного танку почалася в 1930 з Durchbruchswagen, тепер, коли у нас достатньо досвіду, ми можемо, нарешті, перетворити цю концепцію в реальність."

  GER_plan_the_third_generation:0 "План третього покоління"
  GER_plan_the_third_generation_desc:0 "З повідомлень про те, що інші країни використовують шорсткі танки, ми повинні зробити те ж саме, але мати зброю, що відповідає цьому."

  GER_luftwaffe_innovations:0 "Інновації ВВС"
  GER_luftwaffe_innovations_desc:0 "Через обмеження Версаля ми були змушені таємно готувати наші військово-повітряні сили. Тепер, коли ми працюємо більш відкрито, ми можемо інвестувати значні ресурси в дослідження і розробки нових літаків і тактики."

  GER_the_great_sky_war:0 "Велика небесна війна"
  GER_the_great_sky_war_desc:0 "Ці знання допоможуть вам у підготовці люфтваффа."

  GER_invest_in_GEMA:0 "Інвестиції в Товариство електроакустичних і механічних апаратів"
  GER_invest_in_GEMA_desc:0 "Товариство електроакустичних і механічних приладів"

  GER_aeronautic_funding:0 "Авіаційне фінансування"
  GER_aeronautic_funding_desc:0 "Ніяких витрат на вирощування наших військово-повітряних сил не може бути, потрібно виділяти більше коштів, щоб ми могли випускати більше літаків."

  GER_sturzbomber_programm:0 "Програма пікуючого бомбардувальника"
  GER_sturzbomber_programm_desc:0 "Дав-бомбардування вимагає значних навичок і навчання, щоб здійснити, але забезпечити майже точну точність, наші пікуючі бомбардувальники стануть ключем до підтримки нашої армії у вирішальних битвах."

  GER_long_range_escorts:0 "Винищувач-перехоплювач FW-190D"
  GER_long_range_escorts_desc:0 ""

  GER_air_fw:0 "Віддати перевагу Bf-109"
  GER_air_fw_desc:0 ""

  GER_air_bf:0 "Розвиток Bf-109"
  GER_air_fw_desc:0 ""

  GER_improve_the_enigma_machine:0 "Покращення Енігму"
  GER_improve_the_enigma_machine_desc:0 "Наші розвідальні звіти показали, що союзники намагаються зламати нашу загадку і розшифрувати наші повідомлення."
  lar_encryption_bonus_tt:0 "§G+1 криптологічний рівень§!"

  GER_v_bomb_project:0 "Проект бомби V"
  GER_v_bomb_project_desc:0 "Ці літаючі бомби V можуть досягти і знищувати ворожі цілі, не вимагаючи їх доставки, і таким чином вони можуть помститися тим, хто намагається бомбардувати німецький край."

  GER_collaborations_with_the_japanese:0 "Співпраця з японцями"
  GER_collaborations_with_the_japanese_desc:0 "Хоча Китай був союзником Німеччини протягом десятиліть, ми були б наївними, якби думали, що вони здатні допомогти нам в будь-якому випадку. З другого боку, японський флот досить великий, щоб загрожувати Західним державам і може допомогти полегшити частину тягаря для нас."

  GER_german_luftwaffe_assistance:0 "Допомога Люфтваффі Німеччини"
  GER_german_luftwaffe_assistance_desc:0 "Японії бракує промисловості для підтримки великої кількості літаків, необхідних для перемоги в Тихому океані, і ми допоможемо їм заповнити цю прогалину нашими власними літаками."

  GER_explotation_of_annexed_nations:0 "Якщо ви досягнете успіху §GМасове зниження економічної втоми§!\n"

  GER_western_war_plans:0 "Західні військові плани"
  GER_western_war_plans_desc:0 "Ми спочатку не очікували, що Великобританія і Франція зберігатимуть свої зобов’язання по захисту Польщі. Тепер, коли наші генерали вже були готові, ми можемо вжити необхідних заходів, щоб захистити Західну Європу."


  GER_fate_of_yugoslavia_required_states_tt:0 "§YВісь§! Потрібно контролювати всі югославські регіони."



  GER_approach_turkey:0 "Підходить до Туреччини"
  GER_approach_turkey_desc:0 "Туреччина існує в ключовій географічній позиції, як міст до наших північноафриканських володінь, бліжної нафти та південної підбрюшки Росії. Вони позиціонують себе як нейтральний гравець, але, можливо, ми можемо вплинути на них, щоб змінити їхню думку."

  GER_prepare_barbarossa:0 "Підготувати Барбароссу"
  GER_prepare_barbarossa_desc:0 "Наші вороги на Півночі, Півдні та Заході зазнали поразки, наш ворог на Сході величезний, і наша армія і логіка повинні підготуватися проти них."

  GER_eastern_lebensraum:0 "Війна з СРСР"
  GER_eastern_lebensraum_desc:0 "Гермахт не бачив нічого, крім перемоги, в той час як більше більшовіки тонуть у власній некомпетентності. ми повинні тільки вибити двері і вся гнила конструкція впаде."
  GER_mol_rib_pact_des:0 "Викорінює злих ворогів з порадами"

  GER_celebration_of_the_olympics:0 "Святкування Олімпійських ігор"
  GER_celebration_of_the_olympics_desc:0 "Ігри мали величезний успіх, бо перевагу німецької раси та нації було виставлено на загальний огляд."
  olympics_1936:0 "Олімпійські ігри 1936 року."



  GER_recruit_from_the_hitler_youth:0 "Вербування з Гітлерюгенда"
  GER_recruit_from_the_hitler_youth_desc:0 "Гітлерюгенд навчає німецьку молодь ідеалів нацистської партії, з багатьох потенційних новобранців ці діти є найбільш фанатичними і готові пожертвувати собою заради Речі."

  GER_volkssturm:0 "Батальони фольксштурму"
  GER_volkssturm_desc:0 "Ми можемо поспішно завербувати наших старих і наших молодих людей в дивізії і заповнити прогалини на лінії фронту."

  GER_death_before_defeat:0 "Смерть перед поразкою"
  GER_death_before_defeat_desc:0 "Ця війна є війною знищення, або ми знищимо капіталістів та більшевірків, або вони знищать Німеччину, ніякої капітуляції не може бути."
  death_before_defeat:0 "Смерть перед поразкою"

  SOV_father_of_nations:0 "Батько Русів"
  SOV_father_of_nations_desc:0 "Наш союз - це велика сім'я русів, а в кожній сім'ї повинен бути голова, а цей керівник - товариш Сталін, який стежить за тим, щоб усі його діти навчалися соціалістичної думки, і веде нас у світле майбутнє. У разі потреби він буває суворим, але завжди справедливий і чесний."

  GER_split_yugoslavia:0 "Розділ Югославії"
  GER_split_yugoslavia_desc:0 "Після завоювання Югославії ми маємо розділити країну між Осою."

  GER_split_greece:0 "Розділ Греції"
  GER_split_greece_desc:0 "Після завоювання Греції ми маємо розділити країну між Осою."

  GER_integrate_romanian_war_economies:0 "Інтегрувати Румунію"
  GER_integrate_romanian_war_economies_desc:0 "Румунія перетворилася на сферу нашого впливу і стала залежною від німецької економіки, ми могли б використати це, щоб встановити контроль над їх економікою і забрати їх ресурси. Це вимагатиме німецьких інвестицій взамін, але отримання всіх прав на їхню нафту буде великою допомогою для нашої нафтової ситуації."

  GER_integrate_hungarian_war_economies:0 "Інтегрувати Венгію"
  GER_integrate_hungarian_war_economies_desc:0 "Угорщина перетворилася на сферу нашого впливу і стала залежною від німецької економіки, ми могли б використати це, щоб встановити контроль над їх економікою і забрати їх ресурси. Це вимагатиме німецьких інвестицій в обмін, але, отримавши всі права на угорські ресурси, ми вирішимо будь-які проблеми бокситів, які у нас можуть бути, і допоможемо нашій залізній ситуації."

  GER_proclaim_the_axis_powers:0 "Проголосити Осі"
  GER_proclaim_the_axis_powers_desc:0 "Немає сумніву, що в цей момент вісь європейської історії проходить через Берлін."

  GER_condor_legion:0 "Легіон Кондор"
  GER_condor_legion_desc:0 "Націоналістична революція Франко благоприйнятна для наших інтересів у регіоні, ми повинні направити їм військову допомогу, щоб вони перемогли комуністів."

  GER_treaty_of_mutual_assistance:0 "Договір про взаємодопомоги"
  GER_treaty_of_mutual_assistance_desc:0 "Італія, батьківина фашизму, може служити нам важливим союзником, ми повинні бути першими, хто покращить наші стосунки з ними."

  GER_puppet_italy:0 "Кусольна Італія"
  GER_puppet_italy_desc:0 "Ми повинні встановити остаточну владу в рамках альянсу осі і більше не можемо дозволити Італії діяти незалежно від нас, прийшов час висунути ультиматум. Чим більше проблем в Італії, тим більше шансів на успіх."

  GER_puppet_hungary:0 "Лялькова Угорщина"
  GER_puppet_hungary_desc:0 "Ми повинні встановити остаточну владу в рамках альянсу осі і більше не можемо дозволити Угорщині діяти незалежно від нас, прийшов час висунути ультиматум. Чим більше проблем у Угорщині, тим більше шансів на успіх."

  GER_puppet_romania:0 "Кукольна Румунія"
  GER_puppet_romania_desc:0 "Ми повинні встановити остаточну владу в рамках альянсу осі і більше не можемо дозволити Румунії діяти незалежно від нас, прийшов час висунути ультиматум. Чим більше проблем у Румунії, тим більше шансів на успіх."

  GER_puppet_bulgaria:0 "Лялькова Болгарія"
  GER_puppet_bulgaria_desc:0 "Ми повинні встановити остаточну владу в рамках альянсу осі і більше не можемо дозволити Болгарії діяти незалежно від нас, прийшов час висунути ультиматум. Чим більше проблем у Болгарії, тим більше шансів на успіх."

  GER_befriend_sweden:0 "Захистити поставки шведського заліза"
  GER_befriend_sweden_desc:0 "Шведське залізо дуже важливе для нашої військової машини, без нього ми спостерігаємо за за закриттям більшості наших сталелиць."

  GER_alliance_with_finland:0 "Альянс з Фінляндією"
  GER_alliance_with_finland_desc:0 "Фінляндія вважала себе компетентною військовою силою, навіть коли ми стикаємося з великими труднощами, і ми повинні достукатися до них, готуючись до війни проти Радянського Союзу."

  GER_nationalist_spain_befriend:0 "Спілкування з Іспанією"
  GER_nationalist_spain_befriend_desc:0 "Незважаючи на те, що ми ще далеко від війни, ми можемо поліпшити стосунки, забезпечуючи постійну економічну допомогу."

  GER_amphibious_assault_crafts:0 "Амфібійна війна"
  GER_amphibious_assault_crafts_desc:0 "Щоб взяти на себе Сполучені Штати, нам потрібно покращити наукове спеціалізоване обладнання для наших військово-морських вторгувань."

  GER_endsieg:0 "Endsieg"
  GER_endsieg_desc:0 "З нашим Лебенсраумом у польського і чеського народу немає іншого вибору, крім як прийняти постійний німецький контроль, і процес асиміляції може початися. Це, безсумнівно, дуже допоможе у відновленні нашої території від великого завоювання Сходу, і тепер ми можемо зосередитися на усуненні будь-яких загроз для Заходу."

  GER_a_new_europe:0 "Нова Європа"
  GER_a_new_europe_desc:0 ""
  GER_reichsprotectorate_tt:0 "Дозволяє формувати нові супердержави на завойованих територіях §RC зараз не працює §!\n"

  GER_naval_rearmament_tt:0 "§RПереозброєння флоту спізниться після початку війни§!"

  GER_expand_the_naval_dockyards:0 "Розширте військово-морські верфі"
  GER_expand_the_naval_dockyards_desc:0 "Наш флот блідне у порівнянні з західними державами, якщо ми хочемо мати можливість вести війну на воді, то наші верфі повинні бути розширені для задоволення попиту."

  GER_surface_raiders:0 "Поверхні рейдери"
  GER_surface_raiders_desc:0 "Наші швидко рухливі кораблі можуть переслідувати ворожі конвою і знищити стандартні флотилії. Використання цих доктрин змусить наших ворогів розміщати свої столичні кораблі, де їх можна буде легко перемогти в деталях."

  GER_dipose_hitler:0 "Убити Гітлера"
  GER_dipose_hitler_desc:0 "Гітлер веде країну до катастрофи, і ми не можемо більше чекати, щоб здобути остаточну перемогу, ми повинні очиститися від нацистів і направити нашу націю в іншому напрямку."

  GER_form_the_reichskommissariats:0 "Створити Рейхскісаріати"
  GER_mol_rib_pact:0 "Пакт Молотова-Ріббентропа"

  GER_democratic_party_assassination:0 "Німецька імперія"

  GER_reintegrate_wwi_territories:0 "Реінженерія Першої світової війни"
  GER_reintegrate_wwi_territories_desc:0 "Версаль було відібрано, німецькі люди, які живуть на територіях, які були вкрадені у нас, тепер можуть бути повернені до Німеччини."

  ENG_imperial_conference_tt:0 "Розблокувати§YІмператорська конференція§!Рішення для 40 днів.\n§GРозвиток промисловості в Співдружності гарантує там прийом імперських конференційних бонусів§!\n§OПереконайтеся, що у вас є політична влада, щоб використовувати їх!§!\n"

  SOV_great_purge_tt3:1 "£faction_sov_army §YАрмія§! §Rвтратиш більшість впливу§!, Знизивши зростання §YПолітична влада§! на §R15%§!.\n"

  SOV_emergency_powers_tt:1 "£Faction_sov_workers §YРобочі§! §GОтримую вплив§! і стають і стають §GВірніші льоди"






  SOV_formation_of_the_nkvd_tt:0 "£faction_sov_commissars §YКомісари§! ставка §GВірні§! Підвищений §Yстабільність§! на §G5%§! і збільшувати §YПриріст політичної влади§! на §G20%§!."

  SOV_nkvd_divisions_tt:1 "£faction_sov_commissars §YКомісари§! сталі §GЗначно могутніші§!\n"

  SOV_socialist_science_tt:1 "£Faction_sov_workers §YРобочі§! стає більше §GМотивовано§! збільшувати §YПромисловий завод§! на §G20%§!"

  SOV_progress_cult_tt:1 "£faction_sov_army §YАрмія§! Поширилося §Gмотивований і ефективний§! збільшувати §YШвидкість досліджень§! на §G8%§!"

  SOV_reinstall_the_Patriarchate_tt:1 "£faction_sov_peasants §YСеляни§! ставка §GВірні§! §Yстабільність§! Збільшується до §G+10%§!"

  SOV_great_patriotic_war_tt:1 "£faction_sov_army §YАрмія§! §Gмає вплив§! і стає §Gвірніша§!.\n"

  SOV_form_the_stavka_tt:1 "\n£faction_sov_army §YАрмія§! §GПідвищить вплив§! і стане §Gвірніша§! Збільшений §YПриріст політичної влади§! на §G25%§!\n"

  SOV_experts_in_camouflage_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nШвидкість створення укріплень: §G+5%§! \nЗменшення урону проти штурмовиків: §G+5%§! \n\n"

  SOV_an_adaptable_army_ns_tt: "$SOV_modify_the_red_army_ns_intro$ \nЗимові втрати від виснаження: §G-10.0%§! \nВтрати від спеки: §G-10.0%§! \nФактор росту акліматизації до холоду: §G+25.0%§! \nФактор росту акліматизації до жари: §G+25.0%§! \nЗменшення штрафу за місцевість: §G+5.0%§! \n\n"



  SOV_has_civil_war_no_tt:0 "Не беруть участі у громадянській війні"

  SOV_army_reform_1:0 "Одного разу реформував армію"
  SOV_army_reform_3:0 "Двічі реформував армію"

  SOV_air_reform_1:0 "Один раз реформував ВВС"
  SOV_air_reform_2:0 "Двічі реформував ВВС"

  SOV_navy_reform_1:0 "Одного разу реформував флот"
  SOV_navy_reform_2:0 "Двічі реформував флот"

  SOV_army_reform_tt:0 "Одного разу реформував армію"
  SOV_army_reform_1_tt:0 "$SOV_modify_the_red_army_ns_intro$ \n£organization_texticon  Організація дивізії: §G+20.00%§! \n£attacker_speed_texticon  Швидкість дивізії: §G+20.00%§! \n£attack_texticon  Атака дивізії: §G+20.00%§! \n£experience_loss_texticon  Втрати досвідчених бійців: §G-25.00% §!\n£army_doctrine_cost_texticon  Вартість сухопутної доктрини: §G+50.00%§!\n\n"
  SOV_army_reform_3_tt:0 "$SOV_modify_the_red_army_ns_intro$ \n£organization_texticon  Організація дивізії: §G+10.00%§! \n£army_experience  Отримуваний досвід армії: §G+10.00%§! \n£army_doctrine_cost_texticon  Вартість сухопутної доктрини: §G+50.00%§! \n\n"

  SOV_cohesion_first_tt:0 "$SOV_modify_the_red_army_ns_intro$ \n£organization_texticon  Організація дивізії: §G+5.00%§! \n\n"

  SOV_air_reform_1_tt:0 "$SOV_modify_airforce_ns_intro$ \n£experience_neutral_combat_texticon Експеримент з авіаперельотом: §G+30.00%§! \n£air_doctrine_cost_texticon Цінність повітряної доктрини: §G-10.00%§!\n\n"
  SOV_air_reform_2_tt:0 "$SOV_modify_airforce_ns_intro$ \n£experience_neutral_combat_texticon Експеримент з авіаперельотом: §G+40.00%§! \n£air_doctrine_cost_texticon Цінність повітряної доктрини: §G-50.00%§! \n£speed_air_texticon Маневрність: §G+10.00%§! \n£attack_air_texticon Повітряна атака: §G+10.00%§! \n£defence_air_texticon Протипожежна охорона: §G+10.00%§! \n£cas_texticon Коефіцієнт авіаштурми: §G+20.00%§!\n£air_experience Отримуваний досвід авіації: §G+20.00%§! \n\n"

  SOV_navy_reform_1_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n£attack_texticon  Атака палубної авіації: §G+20.00%§! \n£attack_battleship_texticon  Атака великих кораблів: §G+10.00%§! \n£defence_battleship_texticon  Броня великих кораблів: §G+5.00%§! \n£attack_submarine_texticon  Атака підводних човнів: §G+10.00%§! \n£defence_submarine_texticon  Захист підводних човнів: §G+5.00%§! \n£attack_screen_texticon  Атака охорони: §G+10.00%§! \n£defence_screen_texticon  Захист охорони: §G+5.00%§! \n£navy_doctrine_cost_texticon  Коефіцієнт морської доктрини: §G-50.00%§!\n\n"
  SOV_navy_reform_2_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n£attack_texticon  Атака палубної авіації: §G+20.00%§! \n£attack_battleship_texticon  Атака великих кораблів: §G+10.00%§! \n£defence_battleship_texticon  Броня великих кораблів: §G+5.00%§! \n£attack_submarine_texticon  Атака підводних човнів: §G+10.00%§! \n£defence_submarine_texticon  Захист підводних човнів: §G+5.00%§! \n£attack_screen_texticon  Атака охорони: §G+10.00%§! \n£defence_screen_texticon  Захист охорони: §G+5.00%§! \n£navy_doctrine_cost_texticon  Коефіцієнт морської доктрини: §G-50.00%§!\n\n"

  SOV_socialism_in_one_country_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nПриріст політичної влади: §G+5.00%§! \nМодифікатор безпеки від штрафу за оборонну війну: §G+10.00%§! \n\n"
  SOV_the_glory_of_the_red_army_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nМножник сил спеціального призначення: §G+3%§!"


  SOV_army_recovery_tooltip:0 "$SOV_modify_the_red_army_ns_intro$ \n£organization_texticon  Організація дивізії: §G+2%§! \n£attack_texticon  Атака дивізії: §G+2%§!"

  SOV_the_glory_of_the_red_army:0 "Відновлення Червоного війська"
  SOV_army_recovery:0 "Відновлення Червоного війська"

  SOV_assert_soviet_naval_presence:0 "Затвердити присутність Радянського Союзу на морі"
  SOV_assert_soviet_naval_presence_desc:0 "Радянський Союз не може дозволити іншим державам безроздільно панувати на морях. Розширення суднобудівних потужностей на наших узбережжях і розвиток військово-морських технологій закладуть основу флоту, здатного захищати інтереси країни."










  SOV_foster_flying_clubs_tt:0 "$SOV_modify_airforce_ns_intro$ \nЙмовірність отримання асу: §G+25.00%§! \nПідлітковий досвід авіаперельоту: §G+5%§! \nЙмовірність авіаліній: §G-25.0%§! \nШтраф за погану погоду: §G-10.00%§!\n\n"
  SOV_women_in_aviation_tt:0 "$SOV_modify_airforce_ns_intro$ \nПривчання авіакомпанії: §G+5%§! \nОтримання досвіду за місію літака: §G+5%§!\n\n"
  SOV_raskovas_aviation_group_tt:0 "$SOV_modify_airforce_ns_intro$ \nВтрата досвіду авіаперельоту під час знищення: §G-10%§! \nШтраф за нічні стратегічні бомбардування: §G-10,00%§! \nШтраф за нічні операції: §G-10,00%§! \n\n"
  SOV_intensify_pilot_training_program_tt:0 "$SOV_modify_airforce_ns_intro$ \nЙмовірність створення асу: §G+25%§! \nВтрата досвіду авіаперельоту під час знищення: §G-10%§! \nЙмовірність авіакатастроф: §G-25.0%§! \nШтраф за нічні операції: §G-10.00%§!\nШтраф за погану погоду: §G-10%§!\n\n"
  SOV_expand_aviation_institutes_tt:0 "$SOV_modify_airforce_ns_intro$ \nВтрата досвіду авіаперельоту під час вбивства: §G-10%§! \nПривчання авіакомпанії: §G+5%§! \nЙмовірність авіакатастроф: §G-25%§! \nПоганий Штраф за погоду: §G-10.00%§!\n\n"

  SOV_start_the_second_five_year_plan:0 "Почати другий п’ятирічний план"
  SOV_start_the_second_five_year_plan_desc:0 "Після першого п'ятилітка Сталін наказав нам продовжити цей розвиток промисловості, щоб ми більше не тривожились і не покладалися на ці Капіталістичні Свині."
  SOV_start_the_second_five_year_plan_tt:0 "§YРадянська промисловість§! починає реалізацію другого п'ятирічного плану, збільшуючи §YЦінність політичної влади§! на §R50%§!, §YШвидкість будівництва громадянських заводів§! на §G30%§! і §YШвидкість побудови інфраструктури§! на §G30%§!"

  SOV_gaz_automobile_plants:0 "Автозаводи ГАЗ"
  SOV_gaz_automobile_plants_desc:0 "Автомобілі та механізація є невід'ємною частиною індустріалізації, а радянські міста будуть заповнені легковими та вантажними автомобілями, якими керують звичайні громадяни."

  SOV_every_man_must_do_their_duty:0 "Кожен чоловік повинен виконувати свій обов’язок"
  SOV_every_man_must_do_their_duty_desc:0 "Комунізм завжди загрожує ревізіоністи, фашисти і реакціоністи, і ми досягнемо успіху тому, що у нас є воля народу, кожен повинен взяти в руки гвинтівку і служити Раді!"

  SOV_trotsky_revolution:0 "§OЯкщо країна підтримує комунізм більше ніж на 30 відсотків, почнеться громадянська війна§!"

  SOV_tankograd:0 "Танокград"
  SOV_tankograd_desc:0 "Челябінськ - один з найбільших міст у околицях Урала, і ми повинні підготуватися до перенесення більшості наших танків у цей єдиний район з існуючими автозаводами."
  SOV_tankograd_tt:0 "Додати максимум §YІнфраструктори§! у §YЧелябінську§!"

  SOV_the_ussr_academy_of_sciences:0 "Академія наук СРСР"
  SOV_the_ussr_academy_of_sciences_desc:0 ""

  SOV_merge_her_tt:0 "\n§GОб'єднані заводи прокладуть шлях до поліпшення наших збройних сил, привівши їх у відповідність з сучасними стандартами§!\n"

  SOV_national_academies_of_sciences:0 "Національні академії наук"
  SOV_national_academies_of_sciences_desc:0 ""
  SOV_national_academy_of_sciences_research_bonus_tt:0 "Змінить національний дух §Y$SOV_ussr_academy_of_sciences_dynamic_modifier$§! на\nШвидкість досліджень: §G+0.5%§!"

  SOV_connection_of_the_interior:0 "Об’єднати промислову мережу"
  SOV_connection_of_the_interior_desc:0 "Якщо ми хочемо підтримати розвиток важкої промисловості, ми повинні створити нові технології, які дозволять нам побудувати ці величезні мережі заводів. Нам потрібно більше ресурсів і машин, які стануть основою для масштабного будівництва."
  SOV_connection_of_the_interior_info:0 "Додає §Yпо 1-2 рівня інфраструктури§! у Західній Європі.\n"

  SOV_evolve_our_urban_centres:0 "Розвиток міського центру"
  SOV_evolve_our_urban_centres_desc:0 "Якщо ми хочемо підтримати розвиток важкої промисловості, ми повинні створити нові технології, які дозволять нам будувати ці величезні мережі заводів. Нам потрібно більше ресурсів і машин, які забезпечують основу для масштабного будівництва."

  SOV_lower_workers_minimum_wage:0 "Зниження мінімальної зарплати робітника"
  SOV_lower_workers_minimum_wage_desc:0 "На щастя, кожен радянський громадянин готовий йти на жертви заради держави."

  SOV_trans_siberian_railway:0 "Транссибірська магістраль"
  SOV_trans_siberian_railway_desc:0 "Наш план на першу п'ятилітку виявився занадто успішним. Масштабне розвиток важкої промисловості дало Радянському Союзу набагато сильніші можливості для самозахисту, але радянська залізнична мережа зіткнулася з деякими серйозними вузькими місцями. Національний комісаріат шляхів повідомлення (НКПС) має амбіціозний план щодо усунення цих вузьких місць і забезпечення захисту Родину."
  SOV_trans_siberian_railway_info:0 "Додає §Y2 рівні інфраструктури§! у містах Сибіру.\n"

  SOV_urbanise_the_urals:0 "Урбанізувати Урал"
  SOV_urbanise_the_urals_desc:0 "Якщо ми збираємося довести справу до кінця з передислокацією промисловості під час війни, життєво важливо, щоб Урал міг підтримувати цю нову промисловість. Ми повинні фінансувати нові інфраструктури, будувати фабрики і на них повинні працювати люди. "

  SOV_bread_basket_of_the_soviet_union:0 "Житниця Радянського Союзу"
  SOV_bread_basket_of_the_soviet_union_desc:0 "Ми повинні і далі індустріалізувати покинуті райони, Україна є ключовою сільськогосподарською територією, і ми повинні і надалі піднімати її ефективність, якщо хочемо отримати користь з родючого грунту. Урбанізація ключових міст принесе найбільшу користь."
  SOV_bread_basket_of_the_soviet_union_tt:1 "£faction_sov_peasants §YСеляни§! стає набагато §GЕфективніше§! зменшити §YВигідні товари§! на §G12%§!"


















  SOV_modernization_of_the_red_army:0 "Модернізація Красної Армії"
  SOV_modernization_of_the_red_army_desc:0 "Наші вчені зосереджуються на дослідженні найновіших танкових технологій, щоб забезпечити перевагу в бою."

  SOV_development_of_the_shock_army:0 "Створення ударних та танкових армій"
  SOV_development_of_the_shock_army_desc:0 "Вдарна армія — це спеціально споряджена армія, яка призначена для знищення цілих ворожих форм за їхнім нападом. Висока вогняна міць і механізація дозволяють цим силам швидко і швидко наступати."

  SOV_utilization_of_the_tulan_Arms_industry:0 "Озброєні промисловці Тули"
  SOV_utilization_of_the_tulan_Arms_industry_desc:0 "Тульський збройний завод виробляв зброю для Росії ще в 1700-х роках, його близькість до Московської залізничної мережі дозволяє нам виробляти і доставляти зброю на фронт якомога швидше. Все для фронту, все за перемогу."

  SOV_form_the_stavka:0 "Створити ставку"
  SOV_form_the_stavka_desc:0 "Озброєні сили Радянського Союзу переповнені некомпетентністю, і це вже не може тривати. Сталін сформував Верховне командування, щоб взяти під безпосередній контроль наші війська і негайно виправити ситуацію."

  SOV_guards_mortars:0 "Гвардейські міномети"
  SOV_guards_mortars_desc:0 "Пісні наших ракетних бомб "Катюш" Рознесеться по полі бою, а смерть нацистам буде нездійсненна."

  SOV_disband_the_cavalry_army_clique:0 "Розпочати кавалерійську кліку"
  SOV_disband_the_cavalry_army_clique_desc:0 "Будівельний Кулик, ці три назви не пов' язані ні з чим, окрім невдачі і некомпетентності."

  SOV_deep_battle:0 "Глибока битва"
  SOV_deep_battle_desc:0 ""

  SOV_guards_units:0 "Гвардейські дивізії"
  SOV_guards_units_desc:0 "Ці підрозділи оснащені найпередовішим обладнанням, яке ми маємо. Незважаючи на обмежену кількість їх, вони повинні забезпечити посилення сили вогню, потрібне нам для успішного наступу на ворога."
  SOV_guards_unit:0 "Розблокувати шаблон Елітної гвардейської дивізії"

  SOV_perfecting_the_armour_core:0 "Покращення броні"
  SOV_perfecting_the_armour_core_desc:0 "Хоча у нас багато танків, більшість з них застарілі і використовують неправомірну тактику, і будуть вкладені додаткові ресурси, щоб наш бронетанковий корпус діяв як сучасна частина нашої армії."

  SOV_perfecting_the_infantry_core:0 "Покращення піхот"
  SOV_perfecting_the_infantry_core_desc:0 "Радянський Армії бракує піхоти. Але більшість наших солдатів погано навчені або не мають потрібного спорядження для передової буде проведено загальне вдосконалення наших піхотних армій."

  SOV_revitalise_the_airforce:0 "Оживити ВВС"
  SOV_revitalise_the_airforce_desc:0 "Наші військово-повітряні сили дуже потребують модернізації. Нам потрібні нові винищувачі і модернізована інфраструктура, якщо ми хочемо підтримувати сучасні та боєздатні військово-повітряні сили, здатні витримати проти наших наймогутніших ворогів."

  SOV_evolution_of_the_air_strategy:0 "Еволюція повітряної стратегії"
  SOV_evolution_of_the_air_strategy_desc:0 "Наша авіація наповнена застарілими літаками, поганими тактиками і недосвідченими пілотами, і радянські ВВС повинні виховуватися культурою вищості, щоб наші пілоти могли впоратися з будь-якою загрозою Родині."











  SOV_emergency_powers:0 "Екстрені повноваження"
  SOV_emergency_powers_desc:0 "Не можна дозволити невірним гітлерівцям захопити наші цінні заводи в західній частині СРСР. Доклавши максимум зусиль і жертв, ми повинні бути в змозі швидко перекинути найцінніше важке обладнання і об'єкти в Челябінськ та інші місця в Урал."

  SOV_emergency_production_committee:0 "Аварійний комітет"
  SOV_emergency_production_committee_desc:0 "Нам не вдалося належним чином закупити значної кількості обладнання, але не все втрачено, якщо ми зріжемо деякі кути, ми зможемо повністю озброїти наші армії. Можуть бути скарги від наших солдатів, але нам потрібно кількість важливіші якості"

  SOV_defense_of_the_motherland:0 "На захист Родини"
  SOV_defense_of_the_motherland_desc:0 "Фашисти стукають у браму столиці! аби якомога швидше звістити нашу оборону!"
  SOV_defense_of_the_motherland_forts:0 "Додати §Y60 сухопутних фортів§! У Москві, Ленінграді та Сталінграді та його околицях з зенітніми знаряддями.\n"

  SOV_war_since_start:0 "Був або знаходиться в стані війни (не включає війну по пакту Молотова-Ріббентропа)"
  SOV_great_patriotic_war:0 "Велика Вітчизняна війна"
  SOV_great_patriotic_war_desc:0 "Ворог біля воріт, ми повинні зібрати всі свої сили, щоб відбити загарбників або зазнати повного знищення."

  SOV_peoples_militia:0 "Створити народне ополчення"
  SOV_peoples_militia_desc:0 "Армія добровольців готова зібратися в умовах надзвичайної ситуації в нашій країні, ми повинні призначити офіцерів і організувати їх в дивізії"

  SOV_organized_partisans:0 "Організація наших партизан"
  SOV_organized_partisans_desc:0 "Коли нас атакують, ми повинні дозволити людям створити організований опір, який буде включати саботаж інфраструктури та заводів, захоплених ворогом. Це може бути лише план, але ми ніколи не знаємо, коли він може виявитися корисним."

  SOV_penal_battalions:0 "Штрафбати"
  SOV_penal_battalions_desc:0 "У нашій відчайдушній охороні Родини ми зішлемо всіх наших трусів і зрадників, щоб сформувати штрафні батальйони і відправити їх на передову."

  SOV_new_Soviet_woman:0 "Нова радянська жінка"
  SOV_new_Soviet_woman_desc:0 "Щоб просувати ідею рівності у нашій великій угоді, ми повинні дозволити жінкам служити в армії, ми змушуємо їх працювати снайперами, ліками і бомбардувальниками."

  SOV_new_Soviet_man:0 "Нова радянська людина"
  SOV_new_Soviet_man_desc:0 "Радянський Союз - це народ різних національностей, мовних і культурних груп, але ми всі єдині, як авангард комунізму, і кожен повинен намагатися сприяти революції, бо це дає йому його особистість."

  SOV_reinstall_the_Patriarchate:0 "Відновити Патріарха"
  SOV_reinstall_the_Patriarchate_desc:0 "Один Сталін не може дати такої віри нашому народу, тому ми повинні відновити спільну релігію, російське православ’я. Це послабить владу, але дозволить людям об'єднатися під однією справою, для захисту релігії, якій вони дорожать."

  SOV_collective_property:0 "Колективна власність"
  SOV_collective_property_desc:0 "Розділяючи майно та активи на державну та особисту власність, ми можемо принести більше багатства під егідою Радянського Союзу"

  SOV_soviet_acadamy_of_sciences:0 "Радянська академія наук"
  SOV_soviet_acadamy_of_sciences_desc:0 "Ця академія відповідає за багато нових промислових технологій, створені нашою країною, ми повинні продовжувати інвестувати, якщо ми хочемо йти в ногу з прогресом"

  SOV_air_research_reforms:0 "Реформи дослідження повітря"
  SOV_air_research_reforms_desc:0 "Потрібно вкласти додаткові дослідження в розробку нових літаків для наших збройних сил. Він довів руйнівні можливості великих повітряних сил над німецьким небом, і ми не можемо повторити ту саму помилку."

  SOV_synthetic_rubber_programme:0 "Програми штучного каучуку"
  SOV_synthetic_rubber_programme_desc:0 ""

  SOV_advancments_in_the_engineer_core:0 "Покращення в інженерному ядрі"
  SOV_advancments_in_the_engineer_core_desc:0 ""

  SOV_analyze_american_technology:0 "Аналіз американських технологій"
  SOV_analyze_american_technology_desc:0 "Шепіт про новий грізний зброяр, розроблений Вашингтоном, доходить до наших вух, вони не бачать нас справжнього союзника, ми повинні забрати їх розробки, поки вони не нанесли нам удар в спину."

  SOV_kurnatovs_experiments:0 "Досвіди Курчатова"
  SOV_kurnatovs_experiments_desc:0 "Ігор Курчатів вже був провідним вченим у галузі ядерної фізики, і Сталін висловив свою думку, що він є найкращим кандидатом на роль керівника нашого проекту з створення атомної бомби."
















  SOV_eyes_to_the_west:0 "Погляд на захід"
  SOV_eyes_to_the_west_desc:0 "Промислований і сільськогосподарський центр Радянського Союзу лежить на Заході, і ми повинні забезпечити безпеку наших західних кордонів, перш ніж переслідувати будь-які інші геополітичні цілі."


  ENG_advancments_in_convoy_defense:0 "Прогрес у захист конвойв"
  ENG_advancments_in_convoy_defense_desc:0 ""

  ENG_womans_land_army:0 "Жіноча землеробська армія"
  ENG_womans_land_army_desc:0 ""

  ENG_emergency_powers:0 "Нелегкі повноваження"
  ENG_emergency_powers_desc:0 ""

  ENG_reintroduce_elections:0 "Повторне введення виборів"
  ENG_reintroduce_elections_desc:0 ""

  home_guard_focus_tt:0 "\n Вербує людей як резервну силу §Y Home Guard§! до резервного пулу.\n"
  home_guard_tt:0 "розвертати§G30§!§YГоловна Гвардія Легка піхотна дивізія§!у вашій столиці.\n"
  home_guard_deployed:0 "Домашня гвардія розвернута"

  ENG_ground_rearmament_focus:0 "Переозброєння армії"
  ENG_ground_rearmament_focus_desc:0 "Армія є основою будь-якої країни, ми повинні забезпечити, щоб вона залишалася однією з найбільш сучасних бойових сил у світі."

  ENG_modernize_the_royal_army:0 "Модернізація королівської армії"
  ENG_modernize_the_royal_army_desc:0 "Наша армія затрималася протягом десятиліть після Великої війни через акцент на Королівський флот і ВВС. ми не можемо дозволити їм отримати всю славу; ми повинні бути готові відправити наших хлопчиків назад у бій."

  ENG_royal_artillery:0 "Королівська артилерія"
  ENG_royal_artillery_desc:0 "Оновлення наших гармат для досягнення чудової вогняної могутності - це те, що найбільше потрібно нашим солдатам на полі бою."

  ENG_special_boat_service:0 "Особлива лодкова служба"
  ENG_special_boat_service_desc:0 "Офіцер Роджер Кортні, як відомо, раніше звертався до адміралтейства з приводу своїх ідей про складну бригаду каяк. Незважаючи на те, що спочатку його ініціали були невдалими, знахідки на двері капітана найбільш охоронного корабля повністю переконали військово-морське командування в тому, що його ідеї про військово-морську війну заслуговують уваги, і що інвестиції в цю область мають велике значення."

  ENG_bawdsey_research_centre:0 "Дослідницький центр Боудсі"
  ENG_bawdsey_research_centre_desc:0 "Усада Bawdsey була використана нашим міністерством авіації в розробці нової технології, відомої як RADAR. На подальший розвиток цієї концепції повинні бути виділені додаткові вчені та інженери."

  ENG_bletchley_park_focus:0 "Блетчлі Парк"
  ENG_bletchley_park_focus_desc:0 "Для GCCCCS і SIS потрібно нове розташування, він має велику географію і близький до ключових інфраструктурних вузлів та комунікацій. Він також має багато можливостей для розширення, що робить його ідеальним місцем для подальших досліджень."

  ENG_government_loans:0 "Державні кредити"
  ENG_government_loans_desc:0 "Додаткові кредити для будівельних компаній сприятимуть подальшому економічному росту."

  ENG_approve_new_construction_projects:0 "Твердження нових будівельних проектів"
  ENG_approve_new_construction_projects_desc:0 "Ми зробили все можливе, щоб заохотити наші будівельні компанії почати більш масштабні роботи, і тільки утвердити їхні проекти та пожати плоди наших зусиль."

  ENG_reignite_our_manufacturing_heartland:0 "Поновити наш промисловий центр"
  ENG_reignite_our_manufacturing_heartland_desc:0 "Мідленди є центром промисловості, великі інвестиції відкриють північну економіку і повернуть людей на роботу."

  ENG_empty_the_gold_reserves:0 "Опустити золотий запас"
  ENG_empty_the_gold_reserves_desc:0 "Наші золоті резерви як з-за кордону, так і через кордони можуть бути використані для погашення наших поточних витрат, що дозволить більшій частині нашої промисловості зосередитися на військових зусиллях."

  uk_bsa_company:0 "Бірмангемська зброя"

  ENG_royal_tank_corps:0 "Королівський танковий корпус"
  ENG_royal_tank_corps_desc:0 "Королівський танковий корпус бере коріння з Королівського танкового полку Першої світової війни, першого танкового підрозділу в світі. Корпус буде реорганізований в дивізії, що відповідають потребам сучасної війни."

  ENG_modernize_the_royal_army:0 "Модернізація королівської армії"
  ENG_modernize_the_royal_army_desc:0 "Наша армія затрималася протягом десятиліть після Великої війни через акцент на Королівський флот і ВВС. ми не можемо дозволити їм отримати всю славу; ми повинні бути готові відправити наших хлопчиків назад у бій."

  ENG_combat_services:0 "Бойові служби"
  ENG_combat_services_desc:0 "Армія, яка діє на полі бою, вимагає більше, ніж зброя та боєприпаси. Для підтримки засобів-техніки, умов життя та бойової готовності наших підрозділів потрібна спеціальна техніка і особистий склад."

  ENG_royal_armoured_corps:0 "Королівський бронетанковий корпус"
  ENG_royal_armoured_corps_desc:0 "Королівський бронетанковий корпус об'єднує нашу бронехніку і моторизовану кавалерію в єдиному організованому підрозділі. Ми повинні розширити наші розробки нових транспортних засобів і тактики, які будуть використані в цій новій силі."

  ENG_armoured_fighting_vehicles_school:0 "Школа бойових бронованих машин"
  ENG_armoured_fighting_vehicles_school_desc:0 "У міру того, як ми вводимо все більше і більше бронованих машин до нашої армії, наші інші армійські підрозділи повинні бути навчені того, як воювати разом з ними. Для перемоги потрібно використовувати комбіновану зброю."

  ENG_aere:0 "AERE"
  ENG_aere_desc:0 "Науково-дослідний установа з атомної енергії"

