  USA_Titan_positive_1_tt1:1 "£faction_usa_chrysler_ford §YFord/Chrysler§!,£faction_usa_gm_dupont §YGM/Dupont§!, і £faction_usa_jpmorgan §YJ.P. Morgan§! стає більше §GПриязні§!, разом збільшуючи £GFX_faction_stability_icon §Yстабільність§! на §G+5%§! і£GFX_faction_construction_civilian_icon §YШвидкість будівництва фабрик§! на §G+10%§!І збільшує ймовірність того, що вони внесуть свій внесок у майбутній війні."

