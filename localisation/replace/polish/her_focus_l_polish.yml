  FRA_unify_the_government:0 "Об’ єднати уряд"
  FRA_unify_the_government_desc:0 "Політика надто сильно залучена в військові справи, при сильному уряді ми можемо здобути більшу свободу для наших генералів і вчених."

  FRA_national_centre_for_scientific_research:0 "Національний центр наукових досліджень"
  FRA_national_centre_for_scientific_research_desc:0 "Ми зобов'язані об'єднати всі центри дослідників під одним дахом, збільшивши їх ефективність."

  FRA_richelieu_tt:0 "Додає 2 лінза класу Richelieu Class в чергу виробництва з §Y50%§! і §Y35%§! Поступ відповідно до цього"

  FRA_joffre_tt:0 "Додає один авіаносець класу Joffre Class в чергу виробництва з §Y40%§! Поступ"

  FRA_industrial_expansion_effect_tt:0 "Додає 6 §YГражданських Фабрік§! у раніше проінформовані регіони метрополії."
  FRA_military_factories_effect_her_tt:0 "Додає 6 §YВоєнних заводів§! у раніше проінвесовані регіони метрополії і 4 §YВоєнна фабрика§! у раніше проінвесовані колоніальні регіони."
  FRA_colonial_industry_effect_her_tt:0 "Додає 4 §YГромадянські фабрики§! у раніше проінвесовані колоніальні регіони."

  FRA_border_defense:0 "Оборона на кордонах"
  FRA_border_defense_desc:0 "Ми повинні підготуватися до боротьби на нашій землі, використовуючи наші переваги землі, тоді ми зможемо вести битву з ворогом на наших умовах."

  FRA_air_based_sea_supremacy:0 "Повітряно-морська перевага"
  FRA_air_based_sea_supremacy_desc:0 "Вбити кораблі іншими кораблями - дорого, і дешевлі використовувати авіацію для знищення ворожого флоту, поки наші перебувають у відносній безпеці в порту."

  FRA_develop_colonial_dockyards:0 "Розгорнути метрополітенові верфі"
  FRA_develop_colonial_dockyards_desc:0 "У нас величезна колоніальна імперія, щоб переконатися, що наші води в безпеці, нам потрібно більше кораблів, і співвідповідно більше верфей."

  FRA_send_officers_to_the_uk:0 "Надіслати офіцерів до Великобританії"
  FRA_send_officers_to_the_uk_desc:0 "Британське найвище командування запропонувало нам тренування деяких наших офіцерів для спеціальних операцій."

  FRA_special_forces_joint_training:0 "Приєднатися до тренування спец військ"
  FRA_special_forces_joint_training_desc:0 "Нас запросили приєднатися до занять британських спец військ у Шотландії."

  FRA_special_forces:0 "Реорганізувати Іноземний Легіон"
  FRA_special_forces_desc:0 "Французький Іноземний Легіон - елітні війська, зібрані за допомогою волонтерів з усього світу, можливо ми зможемо покращити їх бойові якості, з'єднавши різні підрозділи в одну дивізію."

  FRA_new_army_bureau:0 "Нове бюро армій"
  FRA_new_army_bureau_desc:0 "Стратегії війни еволюціонували швидше, ніж ми могли собі уявити, нові сили були виділені армії, щоб поліпшити нашу стратегію і тактику."

