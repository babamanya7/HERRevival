l_polish:
 her_ger_retirements.1.t: "Манштейн і Клейста"
 her_ger_retirements.1.d: "Розташування армій «Південь» і групи армій «А» Радянське військо повернуло Вінницю і Проскурів, прорвалися до Південного Буги і звільнили Ніколаїв. Після нових конфліктів з Гітлером генерал-фельдмаршали Еріх фон Манштейн і Евальд фон Клейст відірвані від командування і відправлені у відставку, їхні групи армій переходять до інших команд."
 her_ger_retirements.1.a: "Їхній час минув."

 GER_dismantle_maginot_desc: "знести це бетонне убіння"
