  agrarian_society_desc:0 "Місцеві адміністратори вважають, що їхній аграрний спосіб життя зробив більшість колоніального населення просто непридатною для військової служби або для ведення війни будь-якого роду. Вони стверджують, що ми повинні набирати тільки з так званих «Військові племена»Це переконання настільки поширене і вкоренилося, що для його подолання знадобиться принаймні одне покоління. У найближчому майбутньому ми повинні визнати, що вони просто проігнорують будь-який наказ про підготовку фермерів."

