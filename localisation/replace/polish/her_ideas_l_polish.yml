  inexperienced_work_force:0 "Недосвідкова робоча сила"
  inexperienced_work_force_desc:0 "Багато селян та фермерів, які працюють на фабриках, зазнали великих втрат у ефективності та виробництві. Ми повинні провести деякі реформи і дати робочий час адаптуватися до нових постійних робочих місць."

  SOV_second_five_year_plan_12_dynamic_modifier:0 "Радянська промисловість"
  SOV_second_five_year_plan_12_dynamic_modifier_desc:0 "Витіснення багатьох селян та фермерів на фабрики призвело до великих втрат у ефективності та виробництві, і ми повинні провести деякі реформи і дати їм час адаптуватися до нових постійних робочих місць. Наша велика промисловість залишається слабкою, поки ми не зможемо завершити п'ятирічний план і привести нашу країну в сучасну епоху."
