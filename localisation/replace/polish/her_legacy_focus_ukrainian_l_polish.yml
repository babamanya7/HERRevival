l_polish:
 FIN_tank_division_desc:0 "Ми сформуємо першу сучасну фінську танкову дивізію та забезпечимо її потрібною технікою."
 FRA_fleet_in_being_tree:0 "Флот у наявності"
 FRA_fleet_in_being_tree_desc:0 "Наш флот має залишатися постійною загрозою, здатною стримувати ворога самим фактом свого існування."
 FRA_lessons_from_our_defeat:0 "Уроки нашої поразки"
 FRA_lessons_from_our_defeat_desc:0 "Ми мусимо тверезо проаналізувати причини минулої поразки та перебудувати збройні сили."
 GER_air_bf_desc:0 "Подальший розвиток Bf 109 забезпечить Люфтваффе сучасним і надійним винищувачем."
 GER_airland_divisions_desc:0 "Спеціально підготовлені повітрянодесантні частини дозволять завдавати ударів у тилу противника."
 GER_anti_partisan_operations_desc:0 "Скоординовані охоронні операції мають послабити партизанський рух на окупованих територіях."
 GER_economy_of_conquest_desc:0 "Ресурси та промисловість завойованих територій буде підпорядковано потребам воєнної економіки."
 GER_hivi_desc:0 "Місцеві добровольці можуть виконувати допоміжні завдання та вивільнити німецькі сили для фронту."
 GER_jaegernotprogramm_desc:0 "Надзвичайна винищувальна програма зосередить промисловість на терміновому випуску винищувачів."
 GER_ostarbieter_desc:0 "Робочу силу зі східних окупованих територій буде залучено до німецької промисловості."
 JAP_establish_teishin_shudan_desc:0 "Ми створимо спеціальні повітрянодесантні частини Імператорської армії для раптових операцій."
 ROM_iron_guard_focus_desc:0 "Призначення Іона Антонеску має зміцнити уряд і забезпечити підтримку правих сил."
 USA_CAS:0 "Штурмова авіація"
 USA_CAS_desc:0 "Спеціалізовані штурмовики забезпечать безпосередню підтримку наземних військ."
 uk_bsa_company_desc:0 "Потужності Birmingham Small Arms Company допоможуть розширити виробництво стрілецької зброї."
 uk_government_loans_desc:0 "Державні позики дадуть змогу профінансувати необхідне розширення економіки."
 uk_lower_interest_rates_desc:0 "Зниження відсоткових ставок полегшить інвестиції та пожвавить промисловість."
 uk_privatize_the_housing_market_desc:0 "Приватний капітал допоможе швидше розширити житлове будівництво."
