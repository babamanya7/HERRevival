l_polish:
 CAS1:0 "Штурмовик I"
 CAS1_desc:0 "Військова доктрина вимагає наявності літака, здатного підтримувати вогнем бойові дії на землі. Така машина несе менше озброєння, ніж тактичний бомбардувальник, але здатна при цьому атакувати невеликі цілі за допомогою гармат та бомбардувань у пікіруванні."
 CAS2:0 "Штурмовик II"
 CAS2_desc:0 "Бойові дії показали, що для виживання під вогнем винищувачів та ППО штурмовику потрібні високі швидкість, маневреність та бронезахист. Наступне покоління штурмовиків також використовує більш потужні бомби, гармати та кулемети."
 CAS3:0 "Штурмовик III"
 CAS3_desc:0 "Зростання ефективності знарядь ППО та перехоплювачів вимагають від нас поліпшення штурмовиків. Новий зразок має кращий захист, потужніший двигун та поліпшену конструкцію, а також збільшене бомбове навантаження."
 GER_army_innovations_tech:0 "Армійські інновації"
 GER_army_innovations_tech_desc:0 "Нові принципи організації та взаємодії підрозділів підвищать ефективність сухопутних військ."
 USA_USMC:0 "Корпус морської піхоти США"
 USA_USMC_desc:0 "Спеціалізовані морські піхотинці підготовлені до висадки та бою на узбережжі."
 USA_airborn:0 "Повітрянодесантні війська США"
 USA_airborn_desc:0 "Підготовлені десантники здатні висаджуватися з повітря в тилу противника."
 advanced_battleship:0 "Лінкор IV"
 advanced_battleship_desc:0 "Нові лінкори, які можуть стати останнім поколінням епохи, що минає, розроблені зі ставкою на потужність знарядь і ефективність ППО."
 advanced_carrier:0 "Авіаносець IV"
 advanced_carrier_desc:0 "У міру того, як угоди втрачають свою силу, ми отримуємо можливість розробляти більш сучасні та місткі авіаносці, щоби завоювати перевагу в повітрі."
 advanced_destroyer:0 "Есмінець IV"
 advanced_destroyer_desc:0 "Сучасний есмінець характеризується наявністю різних технологій виявлення, новою системою скидання глибинних бомб, а також збільшеними порівняно з попередниками розмірами."
 advanced_heavy_art:0 "Важка САУ III"
 advanced_heavy_art_desc:0 "$heavy_tank_artillery_equipment_desc$"
 advanced_heavy_cruiser:0 "Важкий крейсер IV"
 advanced_heavy_cruiser_desc:0 "Вершиною розвитку важких крейсерів стають сучасні зразки збільшеного розміру з поліпшеним бронезахистом, а також скорострільними знаряддями."
 advanced_heavy_spaa:0 "Важка ЗСУ III"
 advanced_heavy_spaa_desc:0 "$heavy_tank_aa_equipment_desc$"
 advanced_heavy_tank:0 "Важкий танк III"
 advanced_heavy_tank_desc:0 "$heavy_tank_equipment_desc$"
 advanced_heavy_td:0 "Важкий ВТ III"
 advanced_heavy_td_desc:0 "$heavy_tank_destroyer_equipment_desc$"
 advanced_infantry_weapons:0 "Піхотне спорядження III"
 advanced_infantry_weapons_desc:0 "$infantry_equipment_desc$ Додатково модернізовано, щоб включити персональні штурмові гвинтівки та протитанкові ракети."
 advanced_light_art:0 "Легка САУ III"
 advanced_light_art_desc:0 "$light_tank_artillery_equipment_desc$"
 advanced_light_cruiser:0 "Легкий крейсер IV"
 advanced_light_cruiser_desc:0 "Обмеження пішли в минуле, і нове покоління легких крейсерів отримало більш потужне озброєння, а також ефективні системи ППО."
 advanced_light_spaa:0 "Легка ЗСУ III"
 advanced_light_spaa_desc:0 "$light_tank_aa_equipment_desc$"
 advanced_light_tank:0 "Легкий танк III"
 advanced_light_tank_desc:0 "$light_tank_equipment_desc$"
 advanced_light_td:0 "Легкий ВТ III"
 advanced_light_td_desc:0 "$light_tank_destroyer_equipment_desc$"
 advanced_medium_art:0 "Середня САУ III"
 advanced_medium_art_desc:0 "$medium_tank_artillery_equipment_desc$"
 advanced_medium_spaa:0 "Середня ЗСУ III"
 advanced_medium_spaa_desc:0 "$medium_tank_aa_equipment_desc$"
 advanced_medium_tank:0 "Середній танк III"
 advanced_medium_tank_desc:0 "$medium_tank_equipment_desc$"
 advanced_medium_td:0 "Середній ВТ III"
 advanced_medium_td_desc:0 "$medium_tank_destroyer_equipment_desc$"
 advanced_ship_hull_carrier:0 "Сучасний авіаносець"
 advanced_ship_hull_carrier_desc:0 "Унаслідок подальшого розвитку конструкції авіаносців з’явилося набагато більше моделей. Ці кораблі наближаються до першого флоту авіаносців, але вдумуються в усі конструктивні поліпшення, які були внесені за минулі роки. Більшість з них мають великий броневий захист і могутню зенітну артилерію, а також високу механічну надійність. Однак вони відмовилися від концепції вторинного озброєння великого калібру в обмін на менші знаряддя подвійного призначення."
 advanced_ship_hull_cruiser:0 "Корпус сучасного крейсера"
 advanced_ship_hull_cruiser_desc:0 "Крейсера пізнього і раннього післявоєнного періоду залишаються схожими на крейсера початку війни, але враховують численні уроки, отримані протягом усієї війни. Оскільки було підтверджено, що літаки становлять одну з найбільших загроз для кораблів, конструктори зосередилися на подальшому вдосконаленні можливостей ПВО за рахунок поліпшення управління вогнем і поліпшення Координацій між батарами і радаром, деякі військово-морські сили також експериментують з механізмами самозарядки головного озброєння, значно поліпшуючи їх швидкострільність."
 advanced_ship_hull_heavy:0 "Сучасний важкий корпус"
 advanced_ship_hull_heavy_desc:0 "Під кінець Другої світової війни великі держави почали розуміти, що військово-морська авіація здобула перемогу над усіма артилерійськими великими кораблями. Однак деякі країни продовжують розвивати лінкори як платформи для прибережних бомбардувань, престижних проектів і підтримки авіаносців всередині флоту або навіть намагаються просувати свою стару роль. Деякі конструктори завантажують свої лінзи зенітні батареями, щоб збільшити шанси на виживання. Хоча багато з цих лінкорів можуть і далі експлуатуватися протягом багатьох років, деякі країни вважають їх застарілими."
 advanced_ship_hull_light:0 "Сучасний легкий корпус"
 advanced_ship_hull_light_desc:0 "Наприкінці Другої світової війни військові-морські сили світу були змушені адаптуватися до нових підводних човнів, які могли залишатися під водою протягом майже невизначеного періоду часу, авіаносцям, Вантажливі літаки, які здатні знищувати великі кораблі за допомогою великих гармат, швидко стають неактивними перед лицем авіаносців і підводних човнів. У розумах більшості військово-морських теоретиків майбутня роль ескоту флоту беруть на себе майже виключно есмінці, а скорострельні гармати подвійного призначення знищують будь-які літаки, які наважуються перетнути його шлях у спробі бомбувати його в пікируванні. Ці кораблі також були збільшені, часто доходячи до 3000 тонн, оскільки конструктори завантажували їх великою кількістю зенітної зброї та більшої кількості основних знарядь."
 advanced_ship_hull_submarine_desc:0 "Завдяки значно збільшеній посудині акумуляторів, вдосконаленій системі оновлення повітря під час занурення і вдосконалення конструкції, це перші підводні човни, які можуть залишатися під водою Більшість часу свого перебування в морі, тому вони вказують на масштабний зсув у військово-морській війні та перетворення підводних човнів на справжні жахи. Такі військові кораблі дають можливість домінувати в океанах тими країнами, які їх розробили та збудували."
 advanced_submarine:0 "Підводний човен IV"
 advanced_submarine_desc:0 "Сучасні субмарини використовують новітні розробки в області двигунів і озброєння, мають оптимальні обводи і здатні занурюватися на велику глибину."
 advanced_torpedo_ballistics:0 "Удосконалена балістика торпед"
 advanced_torpedo_ballistics_desc:0 "Точніші розрахунки траєкторії підвищують ефективність торпедних атак."
 armored_car1_desc:0 "У той час як попередні бронемашини були простими комерційними моделями з тонким сталевим покриттям, ця модель була розроблена з нуля для броні та легкого озброєння."
 armored_car2_desc:0 "Поліпшене внутрішнє компонування та додаткове сховище боєприпасів створюють більш ефективний броньований автомобіль."
 armored_car3_desc:0 "Зміни на полі бою вимагають значно важчого озброєння та товщої броні, щоби перемогти ворожі легкі підрозділи та вижити, щоби звітувати."
 armored_car_at_upgrade:0 "Протитанкова бронемашина"
 armored_car_at_upgrade_desc:0 "Наші легкомеханізовані частини колись зіткнуться з танковими силами противника. Розробка спеціального протитанкового варіанту дасть їм шанс на бій."
 armored_train_desc:0 "Паровоз потяга, закутий у важку броню, щоби зробити його менш вразливим до атак ворога. Він може нести стільки ж вантажу, скільки і будь-який інший дизайн, але дорожчий у виробництві."
 basic_battlecruiser:0 "Лінійний крейсер II"
 basic_battlecruiser_desc:0 "Модернізовані лінійні крейсери, як і раніше, швидше за навіть новітніх лінкорів, і при цьому вони отримали нові системи управління вогнем, виявлення та ППО."
 basic_battleship:0 "Лінкор II"
 basic_battleship_desc:0 "Нове покоління лінкорів залишається в межах обмежень і відрізняється поліпшеними стабільністю та дальністю."
 basic_carrier_desc:0 "Конструктори авіаносців намагаються створити корабель з високою швидкістю та запасом ходу, щоби не залишати від решти флоту, і при цьому вкластися в обмеження морських угод."
 basic_destroyer:0 "Есмінець II"
 basic_destroyer_desc:0 "Збільшена дистанція ходу торпед, швидке заряджання та посилені знаряддя ППО забезпечують ефективність та універсальність есмінців."
 basic_heavy_art:0 "Важка САУ I"
 basic_heavy_art_desc:0 "$heavy_tank_artillery_equipment_desc$"
 basic_heavy_cruiser_desc:0 "Незважаючи на конференції та угоди, триває встановлення важкого озброєння на легкі крейсери, хоча бронювання, як і раніше, залишає бажати кращого."
 basic_heavy_spaa:0 "Важка ЗСУ I"
 basic_heavy_spaa_desc:0 "$heavy_tank_aa_equipment_desc$"
 basic_heavy_tank:0 "Важкий танк I"
 basic_heavy_tank_desc:0 "$heavy_tank_equipment_desc$"
 basic_heavy_td:0 "Важкий ВТ I"
 basic_heavy_td_desc:0 "$heavy_tank_destroyer_equipment_desc$"
 basic_light_art:0 "Легка САУ I"
 basic_light_art_desc:0 "$light_tank_artillery_equipment_desc$"
 basic_light_cruiser:0 "Легкий крейсер II"
 basic_light_cruiser_desc:0 "Післявоєнні договори стримують розвиток крейсерів, але навіть з урахуванням усіх обмежень можна створити легкий корабель із достатнім озброєнням."
 basic_light_spaa:0 "Легка ЗСУ I"
 basic_light_spaa_desc:0 "$light_tank_aa_equipment_desc$"
 basic_light_tank_desc:0 "$light_tank_equipment_desc$"
 basic_light_td:0 "Легкий ВТ I"
 basic_light_td_desc:0 "$light_tank_destroyer_equipment_desc$"
 basic_medium_art:0 "Середня САУ I"
 basic_medium_art_desc:0 "$medium_tank_artillery_equipment_desc$"
 basic_medium_spaa:0 "Середня ЗСУ I"
 basic_medium_spaa_desc:0 "$medium_tank_aa_equipment_desc$"
 basic_medium_tank:0 "Середній танк I"
 basic_medium_tank_desc:0 "$medium_tank_equipment_desc$"
 basic_medium_td:0 "Середній ВТ I"
 basic_medium_td_desc:0 "$medium_tank_destroyer_equipment_desc$"
 basic_ship_hull_carrier_desc:0 "Розроблені в 30-х роках, ці кораблі призначені для забезпечення повітряної розвідки і прикриття флотів легкими винищувачами, в першу чергу орієнтованих на більш «звичайні» Військово-морські сили, їхня дальність плавання значно збільшена, і були докладені зусилля, щоб зробити їх достатньо швидкими, щоб не відставати від флотів, які йдуть на повній швидкості в відкритому океані."
 basic_ship_hull_cruiser_desc:0 "У 1920-х і 1930-х було обмежено міжнародними договорами, метою яких було запобігти повторення гонки озброєнь на початку 20 століття. Вашингтонський військово-морський договір 1922 року наклав обмеження на будівництво кораблів стандартним водозбіром понад 10 000 тонн і артилерійським озброєнням понад 8 дюймів. Ряд військово-морських сил замовили крейсера класів, що відповідають верху цього межі, відомих як «контрактні крейсера»."
 basic_ship_hull_heavy_desc:0 "У міжвоєнний період на лінкор накладалися суворі міжнародні обмеження, щоб запобігти розв’язуванню дорогих гонок озброєнь. Зіткнувшись з перспективою гонки військово-морських озброєнь проти З'єднаного Королівства і Японії, яка, у свою чергу, привела б до можливої війни на Тихому океані, Сполучені Штати Америки прагнули зробити висновок Вашингтонський військовий договір 1922 року, який обмежував кількість і розмір флоту, які могли мати кожна велика нація. Такі проекти, як британський лінкор класу N3, американський клас «Південна Дакота» і японський клас «Кійя» — Усі вони продовжували будувати більші кораблі з великими гарматами та товстішими бронями, так і не зійшли з креслень дошки. Ті проекти, які були прийняті в експлуатацію в цей час, називали договорними лінкорами."
 basic_ship_hull_light:0 "Післявоєнний легкий корпус"
 basic_ship_hull_light_desc:0 "Під час Першої світової війни почались більші есмінці, більш озброєні. Під час війни було втрачено багато можливостей знищити великі кораблі, тому що есмінці витрачали всі свої торпеди в першому залі, щоб розв’язати цю проблему. Есмінці того періоду мали більші корпуси і водозбір від 1500 до 2000 тонн, які очолювалися трохи більшим есмінцем-лідером."
 basic_ship_hull_submarine_desc:0 "У результаті еволюції більш ранніх конструкцій підводних човнів деякі з цих військових кораблів розвинули ідеї «крейсерських» У той час як інші дивляться в іншому напрямку, щоб збільшити можливості та характеристики підводних човнів, з великими знаряддями та упертішим устроїм."
 basic_submarine:0 "Підводний човен II"
 basic_submarine_desc:0 "Нові підводні човни, побудовані з урахуванням останніх розробок, більш надійні та краще озброєні, а також відрізняються збільшеним запасом ходу, що дозволяє атакувати конвої на далеких маршрутах."
 basic_train_desc:0 "Перейнятий військовими зі звичайних цивільних вантажних перевезень, цей паровоз добре підходить для перевезення великої кількості вантажів на великі відстані. Однак його цивільна конструкція робить його вразливим."
 bba_early_transport_plane:0 "Транспортний літак"
 bba_early_transport_plane_desc:0 "Літаки, що доставляють десант до місця висадки."
 bba_improved_transport_plane:0 "Покращений транспортний літак"
 bba_improved_transport_plane_desc:0 "$transport_plane_equipment_1_desc$"
 bba_strategic_airlifter:0 "Модернізований транспортний літак"
 bba_strategic_airlifter_desc:0 "$transport_plane_equipment_1_desc$"
 coastal_defense_ships_desc:0 "Кораблі берегової оборони — це невеличкі військові кораблі, які часто були завбільшки з крейсер, які пожертвували швидкістю та довгою зброєю заради броні та озброєння. Вони зазвичай привабливі для країн, які не можуть дозволити собі повнорозмірні лінкори або можуть задовольнятися спеціально розробленими дрібносидні судами, здатні вести прибережні операції поблизу своїх берегів."
 commercial_nuclear_reactor_tech:0 "Комерційний ядерний реактор"
 commercial_nuclear_reactor_tech_desc:0 "Цивільний реактор дає змогу використовувати атомну енергію в промислових масштабах."
 cruiser_submarines_desc:0 "Ці підводні човни, що значно більші за попередні, стосуються «крейсерське» Типу призначено для незалежних операцій на віддалених дистанціях під час рейд на торгові судна і призначено для кращого оснащення для ведення бою з легкими військовими кораблями ворога в надводному положенні. Таким чином, вони несуть важчу артилерійську зброю і мають ліпшу надводну швидкість, але їхні підводні можливості обмежені."
 cv_CAS1:0 "Палубний штурмовик I"
 cv_CAS1_desc:0 "Ранній штурмовик, модифікований для зльоту з і посадки на авіаносець."
 cv_CAS2:0 "Палубний штурмовик II"
 cv_CAS2_desc:0 "Поліпшений штурмовик, модифікований для зльоту з та посадки на авіаносець."
 cv_CAS3:0 "Палубний штурмовик III"
 cv_CAS3_desc:0 "Сучасний штурмовик, модифікований для зльоту з та посадки на авіаносець."
 cv_early_fighter:0 "Міжвоєнний палубний винищувач"
 cv_early_fighter_desc:0 "Ранній винищувач, модифікований для зльоту з і посадки на авіаносець."
 cv_fighter1:0 "Палубний винищувач I"
 cv_fighter1_desc:0 "Ранній винищувач, модифікований для зльоту з і посадки на авіаносець."
 cv_fighter2:0 "Палубний винищувач II"
 cv_fighter2_desc:0 "Поліпшений винищувач, модифікований для зльоту та посадки на авіаносець."
 cv_fighter3:0 "Палубний винищувач III"
 cv_fighter3_desc:0 "Сучасний винищувач, модифікований для зльоту з та посадки на авіаносець."
 cv_naval_bomber1:0 "Палубний морський бомбардувальник I"
 cv_naval_bomber1_desc:0 "Рання морський бомбардувальник, модифікований для зльоту з і посадки на авіаносець."
 cv_naval_bomber2:0 "Палубний морський бомбардувальник II"
 cv_naval_bomber2_desc:0 "Поліпшений морський бомбардувальник, модифікований для зльоту з та посадки на авіаносець."
 cv_naval_bomber3:0 "Палубний морський бомбардувальник III"
 cv_naval_bomber3_desc:0 "Сучасний морський бомбардувальник, модифікований для зльоту з та посадки на авіаносець."
 early_battlecruiser:0 "Лінійний крейсер I"
 early_battlecruiser_desc:0 "Післявоєнні лінійні крейсери являють собою важкоозброєні кораблі, що поступаються лінкорам у бронюванні, але виграють у швидкості."
 early_battleship:0 "Лінкор I"
 early_battleship_desc:0 "Пережиток минулих епох для одних, найбільші кораблі у світі для інших — як не крути, це найброньованіші і важкоозброєні кораблі з коли-небудь побудованих, вершина гонки озброєнь на морі."
 early_bomber:0 "Міжвоєнний бомбардувальник"
 early_bomber_desc:0 "Є думка, що для перемоги в наступній війні достатньо бомбардувати ворога до повного знищення. Необхідно розпочати розробку літака, здатного доставляти важкі бомби з прийнятною швидкістю."
 early_carrier_desc:0 "Військові теоретики стверджують, що майбутнє — за ВВС. Першим кроком до нової доктрини стає перетворення старих військових та цивільних кораблів на авіаносці."
 early_destroyer:0 "Есмінець I"
 early_destroyer_desc:0 "Для ефективного захисту торгових конвоїв необхідно допрацювати есмінці Великої війни. Бойову міць помітно поліпшать додаткові торпеди."
 early_fighter:0 "Міжвоєнний винищувач"
 early_fighter_desc:0 "Незважаючи на всі поліпшення за часи Великої війни і після неї, біплани йдуть у минуле. Нам потрібно використовувати новітні мирні технології у військових цілях."
 early_heavy_cruiser:0 "Важкий крейсер I"
 early_heavy_cruiser_desc:0 "Вашингтонська морська угода була покликана стримати гонку озброєнь у класі крейсерів, але марно. Більш легке бронювання дозволяє встановити потужніші знаряддя."
 early_light_cruiser:0 "Легкий крейсер I"
 early_light_cruiser_desc:0 "Швидкі та маневрені легкі крейсери виявляються незамінними для розвідки."
 early_ship_hull_light:0 "Легкий корпус Великої війни"
 early_ship_hull_light_desc:0 "Світова війна створила новий попит на есмінці: вони не тільки були необхідні для захисту свого флоту, але й були змушені захищати судноплавні шляхи Антанти. Щоб задовольнити цю потребу, есмінці були оптимізовані і запущені у серійне виробництво, щоб задовольнити попит. Кораблі цієї епохи звичайно важать 1000 тонн і розвивають максимальну швидкість 34 вузла, несучи при цьому пару торпед більшого, ніж їхні попередники."
 early_ship_hull_submarine_desc:0 "Перші підводні кораблі, які справді здатні до ефективної бойової діяльності, є значно кращими у порівнянні зі своїми попередниками. Завдяки тому, що дизель-електричні двигуни замінили переважно бензино-електричні двигуни перших підводних човнів, вони значно збільшили тривалість плавання і надводну швидкість в порівнянні зі своїми попередниками. Під час бою з військовими кораблями, вони діють в основному як підводні торпедні човни, але їм бракує швидкості й повітря в підводному стані, щоб залишатися під водою довгий час. Це підводні човни, які використовувалися найбільшими військово-морськими силами під час світової війни."
 early_submarine:0 "Підводний човен I"
 early_submarine_desc:0 "Підводні човни призначені для атак на незахищені морські конвої. Ранні моделі, що використовувалися в Першій Світовій війні, перший крок до нової стратегії бойових дій на морі."
 eng_14in_mk7:0 "BL 14-дюймова гармата Mk VII"
 eng_14in_mk7_desc:0 "Британська важка морська гармата калібру 14 дюймів."
 escort_carriers_ship:0 "Ескортний авіаносець"
 escort_carriers_ship_desc:0 "Підводні човни серйозно загрожували торговельному флоту під час війни, але, незважаючи на те що літаки мали більшу ефективність, вони не могли прикрити конвою глибоко в океані. Цінність звичайних авіаносців обмежувала їх використання в фронтальних боях, і в той час були побудовані ескортні авіаносці з невеликими ангарами. Вони були дуже дешеві через використання деяких цивільних компонентів."
 fast_combat_support_ship:0 "Корпус швидкохідного корабля бойової підтримки"
 fast_combat_support_ship_desc:0 "Під час походу флоту бойові кораблі ніколи не зупиняться, щоб чекати, поки догонять повільніші кораблі. Швидкий корабель бойової підтримки може йти в ногу з флотом і підтримувати навіть під час бою."
 fighter1:0 "Винищувач I"
 fighter1_desc:0 "Використання радіальних двигунів та суцільнометалевих фюзеляжів дозволило з'явитися на світ легким монопланам. Це наш перший крок на шляху до сучасного винищувача."
 fighter2:0 "Винищувач II"
 fighter2_desc:0 "У міру того як ми застосовуємо нові технології до вже відпрацьованих схем, розвиток винищувачів іде небаченими темпами. Нам потрібен винищувач, який відрізняється високою швидкістю, маневреністю на великих висотах та максимальною дальністю польоту. Крім того, він має нести потужне озброєння."
 fighter3:0 "Винищувач III"
 fighter3_desc:0 "Попередні розробки гідно себе проявили, але це не привід відмовлятися від додаткових переваг. Новий літак, який має неперевершену потужність, смертоносне озброєння і високу дальність польоту, стане вершиною розвитку поршневої авіації."
 fra_13in_1931:0 "330-мм гармата зразка 1931 року"
 fra_13in_1931_desc:0 "Французька важка морська гармата калібру 330 мм."
 ger_11in_c34:0 "28-см гармата SK C/34"
 ger_11in_c34_desc:0 "Німецька важка морська гармата калібру 28 см."
 gw_artillery:0 "$artillery_equipment$"
 gw_artillery_desc:0 "$artillery_equipment_desc$"
 gwtank_desc:0 "Танки під час Першої світової війни були розроблені окремо та одночасно Великою Британією та Францією як засіб для виходу з глухого кута окопної війни на Західному фронті. Назва «танк» була прийнята англійцями на ранніх етапах їх розробки як захід безпеки, щоби приховати їх призначення. Ранні танки були озброєні кулеметами та невеликими гарматами, рухалися повільно та були броньовані лише настільки, щоби зупинити вогонь зі стрілецької зброї."
 heavy_artillery_1:0 "Рання в’язка артилерія"
 heavy_artillery_1_desc:0 "Рання в’язка артилерія"
 heavy_artillery_2:0 "Покращена в'язка. артилерія"
 heavy_artillery_2_desc:0 "Покращена в'язка. артилерія"
 heavy_artillery_3:0 "Сучасна важка артилерія"
 heavy_artillery_3_desc:0 "Сучасна важка артилерія"
 heavy_battleship:0 "Надважкий лінкор I"
 heavy_battleship_desc:0 "Виконання угод залишилося далеко в минулому. Відкинувши обмеження, ми можемо створити найважчий і найпотужніший лінкор, здатний вести бій із кількома супротивниками відразу."
 heavy_fighter1:0 "Важкий винищувач I"
 heavy_fighter1_desc:0 "Ескадрильям бомбардувальників потрібен захист від перехоплювачів ворога Для цього нам потрібен Винищувач, який не поступається бомбардувальникам по дальності польоту. Ці машини більші, важчі і поступаються за маневреністю звичайним винищувачам,"
 heavy_fighter2:0 "Важкий винищувач II"
 heavy_fighter2_desc:0 "Війна показала, що важкі винищувачі — легкий видобуток для більш маневрених перехоплювачів, проте завдяки озброєнню вони добре проявляють себе в сутичці з бомбардувальниками. Наступний варіант буде відрізнятися підвищеною вогневою міццю проти повітряних і навіть наземних цілей. польоту."
 heavy_fighter3:0 "Важкий винищувач III"
 heavy_fighter3_desc:0 "Хоча ескадрильї важких винищувачів непогано діють у різних ролях, нам слід розробити нові поліпшення, які підвищать їх шанси у сутичках з винищувачами, а також дозволять перехоплювати швидші та захищені бомбардувальники супротивника."
 improved_battleship:0 "Лінкор III"
 improved_battleship_desc:0 "Більш міцна броня, потужніша енергетична установка, великокаліберні гармати та знаряддя ППО дозволяють лінкорам зберігати ефективність в умовах повної присутності бойової авіації."
 improved_carrier:0 "Авіаносець III"
 improved_carrier_desc:0 "Загальне поліпшення конструкції та спеціалізовані розробки, на зразок бортових підйомників, підвищують ефективність авіаносців."
 improved_destroyer_desc:0 "Для захисту від загроз зверху та знизу есмінці отримують радари та сучасне протоволодільне та протиповітряне озброєння."
 improved_heavy_art:0 "Важка САУ II"
 improved_heavy_art_desc:0 "$heavy_tank_artillery_equipment_desc$"
 improved_heavy_cruiser:0 "Важкий крейсер III"
 improved_heavy_cruiser_desc:0 "Обмеження забуті, весь світ будує важкі крейсера з серйозним бронюванням, а також поліпшеними системами ППО для захисту від авіанальотів супротивника."
 improved_heavy_spaa:0 "Важка ЗСУ II"
 improved_heavy_spaa_desc:0 "$heavy_tank_aa_equipment_desc$"
 improved_heavy_tank:0 "Важкий танк II"
 improved_heavy_tank_desc:0 "$heavy_tank_equipment_desc$"
 improved_heavy_td:0 "Важкий ВТ II"
 improved_heavy_td_desc:0 "$heavy_tank_destroyer_equipment_desc$"
 improved_infantry_weapons:0 "Піхотне спорядження II"
 improved_infantry_weapons_desc:0 "$infantry_equipment_desc$ Модернізовано до великої кількості автоматів і протитанкових рушниць."
 improved_light_art:0 "Легка САУ II"
 improved_light_art_desc:0 "$light_tank_artillery_equipment_desc$"
 improved_light_cruiser:0 "Легкий крейсер III"
 improved_light_cruiser_desc:0 "Великі та броньовані крейсери підбираються впритул до обмежень угоди, але все ще залишаються формально в класі легких крейсерів."
 improved_light_spaa:0 "Легка ЗСУ II"
 improved_light_spaa_desc:0 "$light_tank_aa_equipment_desc$"
 improved_light_tank:0 "Легкий танк II"
 improved_light_tank_desc:0 "$light_tank_equipment_desc$"
 improved_light_td:0 "Легкий ВТ II"
 improved_light_td_desc:0 "$light_tank_destroyer_equipment_desc$"
 improved_medium_art:0 "Середня САУ II"
 improved_medium_art_desc:0 "$medium_tank_artillery_equipment_desc$"
 improved_medium_spaa:0 "Середня ЗСУ II"
 improved_medium_spaa_desc:0 "$medium_tank_aa_equipment_desc$"
 improved_medium_tank:0 "Середній танк II"
 improved_medium_tank_desc:0 "$medium_tank_equipment_desc$"
 improved_medium_td:0 "Середній ВТ II"
 improved_medium_td_desc:0 "$medium_tank_destroyer_equipment_desc$"
 improved_ship_hull_carrier:0 "Удосконалений корпус авіаносця"
 improved_ship_hull_carrier_desc:0 "Оскільки великі морські бойові операції в епоху морської авіації показали здатність авіації серйозно впливати на битви в морі, багато держав відстали у своїх авіаносних силах. Хоча авіаносці швидко стають найсильнішими зі своїх зібраних, вони також є масивними кораблями, на яких потрібно багато часу та ресурсів. Намагаючись збільшити свої можливості по перекидання авіації в океани, військово-морські держави звернулися до подібних конструкціях, збільшених версії існуючих більш легких авіаносців, щоб спробувати швидко зміцнити можливості своєї морської авіації."
 improved_ship_hull_cruiser:0 "Удосконалений корпус крейсера"
 improved_ship_hull_cruiser_desc:0 "Зріс фінансування нового крейсера, побудованого наприкінці міжвоєнного періоду та на початку Другої світової війни, знову зріс. Хоча калібр основного озброєння знову залишився незмінним, за деякими винятками, його вогняна міць була збільшена за рахунок додавання більшої вежі або збільшення кількості гармат у кожній вежі. Зброєння було модернізовано за рахунок додаткових подвійних знарядь і більш спеціалізованого зенітного озброєння, яке часто пов’язане з удосконаленням вогню. У цьому поколінні також спостерігається зріст радіолокаційних систем на крейсерах."
 improved_ship_hull_heavy:0 "Удосконалений важкий корпус"
 improved_ship_hull_heavy_desc:0 "На горизонті друга світова війна і міжнародна напруженість більші, ніж будь-коли, конструктори намагаються побудувати нове покоління кораблів для участі в прийдешній війні. У той час як деякі країни перенесли свої військово-морські надії на авіаносці, інші все ще наполягають на тому, що авіаносець може виконувати лише додаткову роль, а не заміняти головну роль лінкора, Замість того, щоб боротися з великими кораблями, ці країни переощаджують свої нові конструкції, приділяючи особливу увагу вдосконаленій компонуванні броні та ефективнішим знаряддям і вежам, а також збільшеній швидкості."
 improved_ship_hull_light:0 "Удосконалений легкий корпус"
 improved_ship_hull_light_desc:0 "Коли почалася Друга світова війна, флоти світу потребували дешевих зенітних платформ. Успіх авіаносного бою показав світові, що вони підходять не тільки для розвідки й боротьби з авіаносцями, але й для сучасної війни проти великих кораблів. Крім того, передові протиодні технології відіграють важливу роль у боротьбі з головними загрозою для конвою, вони і зенітні вимоги збільшили вимоги до більшої кількості есмінців. Тоді як раніше інвестиції в есмінці знижувалися на користь крейсерів і нових лінійних крейсерів, есмінці починають повертатися на перший план як невід'ємна частина флоту, так і системи конвойв. Часто вони не більші за своїх попередників, але набагато більш прогресивні в технологіях, в основному мають плоскі палуби і набагато потужніше торпедне озброєння."
 improved_ship_hull_submarine_desc:0 "Досягнення деяких більш ранніх проектів у збільшенні відстані підводного плавання, швидкості та загальних можливостей призвели до повороту в розробці підводних човнів від «крейсерських» Типи до суден з великим упертістю на підводні можливості. У порівнянні з попередніми видами підводних човнів, ці підводні човни несуть потужні торпедні навантаження і становлять реальну загрозу майже для всіх кораблів. Але вони все ще обмежені у тривалості, відстані та швидкості плавання і залишаються вразливими при надводному положенні, особливо для літаків."
 improved_submarine:0 "Підводний човен III"
 improved_submarine_desc:0 "Досі немає ясності щодо ролі підводних човнів у складі флоту, за винятком атак на конвої. Новий проєкт намагається знайти баланс між швидкістю, дальністю та озброєнням."
 infantry_weapons1:0 "Піхотне спорядження I"
 infantry_weapons1_desc:0 "$infantry_equipment_desc$"
 infantry_weapons_desc:0 "Базове спорядження піхотинця, розроблене до й під час Великої війни."
 integrated_supply_ship:0 "Корпус корабля для заповнення запасів"
 integrated_supply_ship_desc:0 "Нефтяний корабель поповнення запасів - це тип тихохідних, але універсальних допоміжних кораблів ВМФ з великими паливними баками і сухо завантаженими трюмами. Окрім корабельного палива, він також може забезпечувати літаками, які перебувають на авіаносцях."
 interwar_antiair_desc:0 "$anti_air_equipment_desc$"
 interwar_antitank_desc:0 "$anti_tank_equipment_desc$"
 interwar_ship_hull_cruiser:0 "Межовий корпус крейсера"
 interwar_ship_hull_cruiser_desc:0 "У міжвоєнний період відбувалися вдосконалення крейсерів в рамках Вашингтонського військово-морського договору. Оскільки політика і фінанси все ще обмежують багато військово-морських держав, випущені моделі тільки трохи більше за розміром, ніж попереднє покоління, замість цього спостерігається підвищення вогняної могутності за рахунок Використання більших знарядь або зростаючого впровадження потрійних башт і рахунованих торпедних апаратів. Рослинність авіації у морській війні також призвела до подвійного призначення гармат, доповнених до зростаючого набору автомобілів. Але вже робилися спроби порушити обмеження крейсерів.\n\nВстановіть §YРоль великого крейсера§! на §YКорпус крейсера§!, щоб розблокувати §YБатарею великого крейсера§! і §YБроню великого крейсера§!."
 interwar_ship_hull_heavy:0 "Місткий важкий корпус"
 interwar_ship_hull_heavy_desc:0 "У 1930-х військові-морські держави широко модернізували свої лінзи часів Великої війни. Серед нововведень - збільшена висота вежі і стабільність оптичного дальєра (для керування артилерійським озброєнням), посилення броні (особливо навколо вежі) для захисту від вогню з пікування і бомбардування з Повітря, а також додаткова зенітна зброя. Навіть коли в кінці 1930-х знову виникла загроза війни, будівництво лінкорів не повернуло значення, яке він мав на початку Першої світової війни. «Навчальні канікули», Накладені військово-морськими договорами, означали, що потужність верфей по всьому світу скоротилася, і стратегічна ситуація змінилася."
 interwar_ship_hull_light:0 "Можливий легкий корпус"
 interwar_ship_hull_light_desc:0 "До 1935 року, коли на озброєння діяли все більш потужні конструкції нових літаків, а також кілька військово-морських держав пбудували більше авіаносців, хоча все ще існували деякі сумніви щодо того, Під час відкритої війни авіаносці дуже скористали, тому що вони занепокоєні потенційною загрозою для військових кораблів. Подальші вчення виявили світові, що авіаносець має своє призначення у флоті. Унаслідок цього на есмінців з’явилося головне озброєння подвійного призначення, яке дало есмінцю значно удосконалювальну зеніту, що знову збільшило їхню користь. Ці кораблі, щоб компенсувати зменшені торпедні навантаження на нових крейсерах, часто несуть до 2500 тонн."
 isotope_separation_centrifugal:0 "Центрифужне розділення ізотопів"
 isotope_separation_centrifugal_desc:0 "Газові центрифуги прискорюють збагачення матеріалів для ядерних програм."
 ita_extra_armor:0 "Додаткове бронювання"
 ita_extra_armor_desc:0 "Посилене бронювання підвищує живучість кораблів."
 jet_fighter1:0 "Реактивний винищувач I"
 jet_fighter1_desc:0 "Реактивний двигун дозволяє винищувачу розвивати раніше небачену швидкість. Ранні зразки не дуже ефективні, але звичайним винищувачам за ними не наздогнати."
 jet_fighter2:0 "Реактивний винищувач II"
 jet_fighter2_desc:0 "Стріловидне крило та легкі матеріали дозволили нам ще більше збільшити швидкість, а заодно і дальність дії винищувачів."
 jet_strategic_bomber1:0 "Реактивний стратегічний бомбардувальник I"
 jet_strategic_bomber1_desc:0 "Реактивні двигуни наділять нові зразки неперевершеною швидкістю без шкоди для бомбового навантаження та дальності польоту. Ці літаки відкривають нову еру зброї масового ураження."
 jet_tactical_bomber1:0 "Реактивний тактичний бомбардувальник I"
 jet_tactical_bomber1_desc:0 "Поява реактивних перехоплювачів вимагає створення бомбардувальників, які не поступаються ним у швидкості. Ця роль відведена середнім бомбардувальникам першого покоління, оснащеним реактивними двигунами."
 jet_tactical_bomber2:0 "Реактивний тактичний бомбардувальник II"
 jet_tactical_bomber2_desc:0 "Надсучасні реактивні бомбардувальники — рекордсмени по висоті і дальності, вони здатні проводити розвідку і завдавати ударів на іншому континенті."
 land_multi_charge_large_caliber_gun_tech:0 "Багатозарядна великокаліберна гармата"
 land_multi_charge_large_caliber_gun_tech_desc:0 "Великокаліберна артилерійська система дає змогу вражати особливо укріплені цілі."
 long_range_patrol_support_tech:0 "Патрульна рота далекої дії"
 long_range_patrol_support_tech_desc:0 "Елітна піхота спеціалізується на далекій розвідці та диверсіях."
 lotta_svard_tech:0 "Організація «Лотта Свярд»"
 lotta_svard_tech_desc:0 "Добровольча жіноча організація підтримує армію медичною, зв'язковою та тиловою службою."
 main_battle_tank:0 "Сучасний танк"
 main_battle_tank_desc:0 "$modern_tank_equipment_desc$"
 mechanised_infantry:0 "Бронетранспорт I"
 mechanised_infantry2:0 "Бронетранспорт II"
 mechanised_infantry2_desc:0 "$mechanized_equipment_desc$"
 mechanised_infantry3:0 "Бронетранспорт III"
 mechanised_infantry3_desc:0 "$mechanized_equipment_desc$"
 mechanised_infantry_desc:0 "$mechanized_equipment_desc$"
 merchant_carrier:0 "Корпус торгового авіаносця"
 merchant_carrier_desc:0 "Торговий авіаносець - це авіаносець обмеженого призначення, адаптований шляхом додавання злітної палуби до сухо вантажу або нафтового танкера, що дозволяє йому використовувати протилодкові літаки для підтримки конвоїв."
 midget_submarines_desc:0 "Маленький підводний човен, який контролює невеликий екіпаж, має меншу довжину та потужність, які компенсуються високою ефективністю"
 modern_art:0 "Сучасна САУ"
 modern_art_desc:0 "$modern_tank_artillery_equipment_desc$"
 modern_periscope:0 "Сучасний перископ"
 modern_periscope_desc:0 "Поліпшена оптика й прилади спостереження підвищують ефективність підводних човнів."
 modern_ship_hull_cruiser:0 "Корпус крейсера холодної війни"
 modern_ship_hull_cruiser_desc:0 "Під час Другої світової війни авіакомпанія докорінно змінила характер морського бою. Навіть найшвидкісніші крейсери не могли маневрувати достатньо швидко, щоб уникнути повітряної атаки, а літаки тепер мали торпеди, що дозволяло їм протистояти помірним дистанціям.\n\nПротягом другої половини XX століття, коли лінкори повністю застаріли з появою ракет, крейсер став найбільшим у світі кораблям. Деякі з них повністю перейняли конструкцію ракет і навіть застосували ядерні двигуни."
 modern_ship_hull_light:0 "Легкий корпус « холодної війни »"
 modern_ship_hull_light_desc:0 "Після Другої світової війни звичайні есмінці, побудовані в цей період, були значно більші за кораблі військового часу і мали повністю автоматичні головні знаряддя, механізми установок, радари, сонари і протилодне озброєння, як-от міномет Кальмар, коли в 1950-х роках ракет класу стала земля-повітря і поверхня-поверху змінили морську війну. Для захисту флоту від повітряних, підводних і надводних загроз були розроблені есмінці з керованими ракетами."
 modern_ship_hull_submarine:0 "Корпус підлоки холодної війни"
 modern_ship_hull_submarine_desc:0 "У 1950-х роках атомна енергія частково замінила дизель-електричні двигуни, також було розроблено обладнання для вивільнення кисню з морської води. Ці два нововведення дозволили підводним човнам залишатися під водою протягом тижнів і місяців."
 modern_spaa:0 "Сучасна ЗСУ"
 modern_spaa_desc:0 "$modern_tank_aa_equipment_desc$"
 modern_td:0 "Сучасний ВТ"
 modern_td_desc:0 "$modern_tank_destroyer_equipment_desc$"
 molotov_cocktails_tech:0 "Коктейлі Молотова"
 molotov_cocktails_tech_desc:0 "Прості запалювальні засоби дають піхоті додаткову зброю проти бронетехніки."
 motorbike:0 "Військовий мотоцикл"
 motorized_rocket_unit_desc:0 "$motorized_rocket_equipment_desc$"
 naval_bomber1_desc:0 "Морська авіація буде вкрай затребувана у зв'язку із змінами в характері війни на морі — зокрема, посиленням ролі підводних човнів. Потрібні гідролітаки, здатні виконувати роль розвідників і пікіруючих бомбардувальників."
 naval_bomber2_desc:0 "Поліпшена аеродинаміка та нові двигуни помітно підвищують швидкість та бойову ефективність морської авіації."
 naval_bomber3_desc:0 "Цільнометалеві корпуси та аеродинамічні гальма помітно позначаються на льотних властивостях. Платити за це доводиться збільшеною чисельністю екіпажу."
 obsolete_vanilla_hulls:0 "Ранній есмінець"
 obsolete_vanilla_hulls_desc:0 "$destroyer_1_desc$"
 panzerschiffe:0 "Карманний лінкор"
 panzerschiffe_desc:0 "Спочатку Панзершіфф (браненосець) прийняли як тимчасові великі кораблі як радикальний договір проти Версальського договору Рейхсмаріні. Маючи проміжну вогняну силу між важкими крейсерами і лінійними крейсерами, панзершіффи давали значні переваги в бою один на один проти крейсерів, але він ставав непотрібним перед обличчям організованого флоту.\nПодібні конструкції також спостерігалися в ранніх реченнях Японського флоту, таких як проект B-65, але так і не впроваджено."
 pre_dreadnoughts_desc:0 "Дотримуючись конструкції британського класу Majestic кінця 1890-х, додредноути замінили броненосні крейсера 1870-х і 1880-х років. Побудовані з сталі і захищені металевою бронею, вони несуть головну батарею в барбетах, яка підтримується однією або кількома допоміжними батареями, важчими за легені.\n\nОскільки конструкція «дредноутів» зробила їх застарілими з тих пір Світова війна, а також гігантський ріст числа проектів на базі «Дредноутів» За останні три десятиліття лише кілька з них все ще перебувають на полі бою."
 sami_pathfinders_tech:0 "Саамські слідопити"
 sami_pathfinders_tech_desc:0 "Знання північної місцевості допомагає військам орієнтуватися та діяти у суворих умовах."
 ship_alicorn:0 "Проєкт «Алікорн»"
 ship_alicorn_desc:0 "Експериментальний проєкт надважкого бойового корабля."
 ship_constitution:0 "Проєкт «Конституція»"
 ship_constitution_desc:0 "Експериментальний проєкт великого бойового корабля."
 ship_hull_super_heavy:0 "Надгробний корпус"
 ship_hull_super_heavy_desc:0 "Швидкий ріст ресурсів, що виділяються на військово-морське будівництво після закінчення великого сухопутного конфлікту під час Великої війни, спочатку привів до появи цих проектів, які поклали початок тенденції до Раптовий ріст розмірів, вогняної сили, броні, калібру і, звичайно ж, вартості. Такі кораблі відрізняють провідні військово-морські держави світу від простих претендентів на велич, але у них є свої проблеми; їх швидке розвиток і поспішне будівництво призвели до конструктивних недоліків і постійних Такі механічні проблеми. Ці конструкції озброєні 8-10ью 18-дюймовими або еквівалентними основними знаряддями і мають захист, який дозволяє конкурувати з кораблями з аналогічним озброєнням. З наближенням Морського свята ці монстри були поховані часом."
 ship_macross:0 "Проєкт «Макросс»"
 ship_macross_desc:0 "Футуристичний проєкт надпотужного бойового корабля."
 ship_space_yamato:0 "Космічний «Ямато»"
 ship_space_yamato_desc:0 "Футуристичний проєкт корабля з винятковою вогневою міццю."
 sp_naval_underway_replenishment_pick_a:0 "Збільшена дальність поповнення в морі"
 sp_naval_underway_replenishment_pick_a_desc:0 "Перевага надається дальності дії систем постачання в морі."
 sp_naval_underway_replenishment_pick_b:0 "Економне поповнення в морі"
 sp_naval_underway_replenishment_pick_b_desc:0 "Перевага надається зменшенню витрат конвоїв під час постачання в морі."
 starting_tech:0 "Початкові технології"
 starting_tech_desc:0 "Базові промислові знання та інфраструктурні можливості держави."
 strategic_bomber1:0 "Стратегічний бомбардувальник I"
 strategic_bomber1_desc:0 "За період Великої війни і після неї стало ясно, що бомбардування військових цілей і великих міст — ключ до перемоги в наступній війні. Принаймні, нам необхідні літаки, здатні завдавати подібних ударів. Бомбардувальнику потрібна висока стеля, хороша швидкість і велике бомбове навантаження. Це буде велика конструкція з кількома двигунами, а також оборонним озброєнням."
 strategic_bomber2:0 "Стратегічний бомбардувальник II"
 strategic_bomber2_desc:0 "Бомбардування успішно підривають здатність ворога вести бойові дії. Поліпшене оборонне озброєння та підвищена швидкість дозволять новим літакам повертатися неушкодженими, а збільшене бомбове навантаження та дальність польоту підвищать ефективність ударів."
 strategic_bomber3:0 "Стратегічний бомбардувальник III"
 strategic_bomber3_desc:0 "Щоби знизити втрати від вогню знарядь ППО та перехоплювачів, потрібно підвищити максимальну висоту польоту. Нова модель буде ще більшою і зможе нести збільшене бомбове навантаження та великий запас палива, щоб підвищити дальність польоту."
 stronghold_network_tech:0 "Мережа укріплень"
 stronghold_network_tech_desc:0 "Взаємопов'язана система укріплень створює міцний оборонний рубіж."
 suicide_charge:0 "Літак-снаряд"
 suicide_charge_desc:0 "Закріплений вибуховий заряд перетворює літак на керовану пілотом бомбу."
 super_carriers:0 "Суперавіаносець"
 super_carriers_desc:0 "Під кінець війни авіаносці, які перебувають у флоті, приділяли багато уваги, щоб досягти свого апогею. Тим часом закритий ангар і бронелуба вдосконалилися, а новий авіаносець також прийняв усі технологічні інновації, такі як нахилені палуби та парові катапульти. Цей тип корабля з більшою бойовою ефективністю і вантажопідйомністю називався суперавіаносцем."
 super_heavy_art:0 "Надважка САУ"
 super_heavy_art_desc:0 "$super_heavy_tank_artillery_equipment_desc$"
 super_heavy_spaa:0 "Надважка ЗСУ"
 super_heavy_spaa_desc:0 "$super_heavy_tank_aa_equipment_desc$"
 super_heavy_tank:0 "Надважкий танк"
 super_heavy_tank_desc:0 "$super_heavy_tank_equipment_desc$"
 super_heavy_td:0 "Надважкий ВТ"
 super_heavy_td_desc:0 "$super_heavy_tank_destroyer_equipment_desc$"
 tactical_bomber1:0 "Тактичний бомбардувальник I"
 tactical_bomber1_desc:0 "Середнім бомбардувальникам потрібна швидкість і здатність виконувати різні завдання. Схема з двома двигунами, що дозволяє зберегти відносну легкість, прослужить нам ще багато років."
 tactical_bomber2:0 "Тактичний бомбардувальник II"
 tactical_bomber2_desc:0 "Тяжкі тактичні бомбардувальники відрізняються збільшеними дальністю польоту, швидкістю і бомбовим навантаженням і при цьому не втрачають здатність виконувати найрізноманітніші завдання."
 tactical_bomber3:0 "Тактичний бомбардувальник III"
 tactical_bomber3_desc:0 "Взявши найкращі рішення від сучасних винищувачів та новітні матеріали, ми зможемо створити двомоторний бомбардувальник, який перевершить за швидкістю та ефективністю всі попередні зразки."
 tech_support_desc:0 "$support_equipment_desc$"
 tech_trucks:0 "Рання вантажівка"
 tech_trucks_desc:0 "Під час Великої війни армії почали використовувати прості цивільні вантажівки для перевезення припасів і буксирування озброєння. Відтоді вони стали невід'ємною частиною більшості армій."
 usa_8in_mk9:0 "8-дюймова гармата Mk 9"
 usa_8in_mk9_desc:0 "Американська морська гармата калібру 8 дюймів."
 vnr_less_fuel_consumption:0 "Знижене споживання пального"
 vnr_less_fuel_consumption_desc:0 "Удосконалення силової установки зменшує витрати пального кораблями."
 wartime_train:0 "Військовий спрощений поїзд"
 wartime_train_desc:0 "Спрощена конструкція, у якій відсутні багато функцій, які зазвичай зустрічаються у звичайних вантажних потягах, заради здешевлення виробництва. Він усе ще так само вразливий, як і звичайний поїзд, але його легше замінити."
 winter_logistics_support_tech:0 "Рота зимової логістики"
 winter_logistics_support_tech_desc:0 "Спеціальне спорядження та постачання допомагають військам діяти взимку."
 wunderwaffe_modules:0 "Модулі вундерваффе"
 wunderwaffe_modules_desc:0 "Експериментальні корабельні системи відкривають нові бойові можливості."
