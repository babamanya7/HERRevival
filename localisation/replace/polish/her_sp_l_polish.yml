 sp_air_reward_option_turbocharger:0 "Турбокомпресор"
 sp_air_supercharger_tt:0 "Дослідження і розробки Нагнетаторів"
 sp_air_turbocharger_tt:0 "Дослідження і розробки Турбокомпресорів"
 sp_air_engine_upgrades_2:0 "Покращені механічні агрегати"
 sp_air_engine_upgrades_2_desc:0 "Покращені механічні агрегати"
 
 sp_land_alloying_armor:0 "Спрямування броні"
 sp_land_alloying_armor_desc:0 "Спрямування броні танків - це процес додавання у сталь легких елементів, щоб покращити її механічні властивості, зокрема міцність та ударна в'язкість, що необхідно для захисту від сучасних боєприпасів. Легкі елементи, такі як хром, нікель, молібден, ванадій, марганець і кремній, змінюють структуру сталі, роблячи її більш стійкою до деформації і руйнування під час потрапляння снарядів."
 
 sp_battlecarrier: "Бойовий авіаносець"
 sp_battlecarrier_desc: "Бойовий авіаносець - гібридний корабель з властивостями лінкора і авіаносця, ідея була запропонована деякими воєнно-морськими архітекторами з різних країн з акцентом на обидва типи кораблів."
 sp_subcarrier: "Підлодка-носник"
 sp_subcarrier_desc: "Підлодка-носитель насправді є великою підводною човнами, здатною запускати літаки. Незважаючи на легші й менші літаки, їх важко розмістити у вузькому просторі, а це обмежує вміст субстанції приблизно 2."
 sp_nuclear_torpedo: "Ядерна торпеда"
 sp_nuclear_torpedo_desc: "Підводний ядерний вибух може бути смертельним для надводних кораблів і підводних човнів, встановити міні-ядерну боєголовку на торпеду зробить її найпотужнішою зброєю на підводних човнах."
 sp_super_heavy_guns: "Крихітне морське знаряддя"
 sp_super_heavy_guns_desc: "Зверхня корабельна артилерія — це інструмент калібрування понад 18 дюймів (460 мм)."
 sp_mega_carrier: "Стратегічний авіаносець"
 sp_mega_carrier_desc: "Ударний авіаносець — це справжнє втілення аеродрому, здатного запустити важкі реактивні літаки з великими відстанями."
 sp_arsenal_ship: "Корабель-арсенал"
 sp_arsenal_ship_desc: "Оскільки ракети все більше визнаються майбутнім військових справ, виникає концепція корабля-арсенала з сотнями пускових установок ракет."
 sp_early_informatization_system: "Система раннього викривлення"
 sp_early_informatization_system_desc: "На відміну від минулих морських війн, форма майбутніх воєн показує сильну залежність від збору та обробки даних, що знаходяться за межами людського розуміння, і інформатування є єдиним шляхом до Перемога у найближчі десятиліття."
 sp_high_speed_light_engine: "Котів високого тиску"
 sp_high_speed_light_engine_desc: "Поєднання високотемпературних пароперегрівачів і потужних парових турбін розігнати корабель до безпрецедентної швидкості."

 sp_battlecarrier_unique_reward_a: "Дебати про роль авіаносця"
 sp_battlecarrier_unique_reward_a_desc: "Під час ітерації авіаносця виникає запитання: чи варто нам зосередитися на його продуктивності або на координації з іншими кораблями?"
 sp_battlecarrier_perference_a: "Швидкодія"
 sp_battlecarrier_perference_b: "Координація"
 sp_subcarrier_unique_reward_a: "Застосування інженерного досвіду"
 sp_subcarrier_unique_reward_a_desc: "Під час ітерацій субконтейнера виникає запитання: « Чи слід використовувати досвід лише на крейсерських підводних човнах, чи на всіх видах підводних човнів? »"
 sp_subcarrier_perference_a: "Крейсерський підводний човен"
 sp_subcarrier_perference_b: "Всі підводні човни"
 sp_nuclear_torpedo_unique_reward_a: "Орієнтація проекту «Ядерна торпеда»"
 sp_nuclear_torpedo_unique_reward_a_desc: "Безпечність зберігання ядерних боєголовок на підводних човнах залишається проблемою."
 sp_nuclear_torpedo_preference_a: "Безпека на першому місці"
 sp_nuclear_torpedo_preference_b: "Розширене сховище"
 sp_super_heavy_guns_unique_reward_a: "У гонитві за 20-дюймовою гвинтівкою"
 sp_super_heavy_guns_unique_reward_a_desc: "У розробці надтяжних морських знарядь було запропоновано ще більш дику ідею фінансувати дослідження більших знарядь, якщо ми вирішимо досягти прориву в цьому напрямку, то нинішній прогрес буде порушено."
 sp_super_heavy_guns_preference_a: "Запропонувати"
 sp_super_heavy_guns_preference_b: "Забудемо це"
 sp_early_informatization_system_unique_reward_a: "Зусилля інформатизації"
 sp_early_informatization_system_unique_reward_a_desc: "Ведуча група HEKР у сфері комп'ютерних наук запропонувала проект з розширення системи інформатизації та об'єднання всіх електронних пристроїв військово-морських судів у колективну комп'ютерну систему. Це цікава ідея, але вона значно сповільнить вихідну програму."
 sp_early_informatization_system_perference_a: "Дбайте про поміркованість."
 sp_early_informatization_system_perference_b: "Заощадити трохи бюджетів."
 
 
