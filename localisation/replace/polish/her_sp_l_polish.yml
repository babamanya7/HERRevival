 sp_air_reward_option_upgrades_focus:0 "Турбокомпресор чи Нагнетатор?"
 sp_air_reward_option_upgrades_focus_desc:0 "Нагнетатор - механічний агрегат, який працює без охолодження газу, на відміну від нагнетників, охолоджує газ."
