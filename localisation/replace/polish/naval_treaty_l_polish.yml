l_polish:
 MTG_treaty_renew_mission: "Підписання другого Лондонського морського договору"
 MTG_treaty_renew_mission_desc: "Другий морський договір Лондона був призначений обмежити ріст морської зброї аж до її закінчення 1942 року."
 MTG_naval_treaty_adherent: "Учасник Лондонського морського договору"
 MTG_naval_treaty_adherent_desc: "Ми підписали Лондонський морський договір і, відповідно, обмежені у розмірах наших капітальних кораблів. Крім того, лондонський протокол підводних човнів (правило для крейсерів) дав суворі правила торгового рейдерства."
 MTG_naval_treaty_adherent_reduced: "Задіяне особливе застереження"
 MTG_naval_treaty_adherent_reduced_desc: "Після того як деякі сторони, які підписали Вашингтонський морський договір, відмовились від Лондонського морського договору, ми задіяли спеціальну умову, знизивши обмеження на розмір і озброєння наших великих кораблі."
 MTG_naval_treaty_adherent_1936: "Учасник Лондонського морського договору"
 MTG_naval_treaty_adherent_1936_desc: "Ми підписали Лондонський морський договір і, відповідно, обмежені у розмірах наших капітальних кораблів. Крім того, лондонський протокол підводних човнів (правило для крейсерів) дав суворі правила торгового рейдерства."
 MTG_treaty_rejoin_mission: "Повторне приєднання до Другого Лондонського морського договору"
 MTG_treaty_rejoin_mission_desc: "Ми не підписали договір до визначеного терміну, а тепер це наш останній шанс приєднатися до нього, інакше через рік буде активовано особливу умову."
 MTG_escalator_clause_condition: "Жодна країна не відмовилася продовжити угоду."
 fascism_renew_naval_treaty_tt: "§RБільшість членів нашого уряду будуть обурені продовженням переговорів по морському договору.§!"
 democracy_renew_naval_treaty_tt: "§GПродовження переговорів по морській угоді зрадіє громадськість.§!"
 MTG_abandon_treaty_tt: "§RМи зіткнемося з серйозними наслідками.§!"

 washington_treaty_article_xix: "Вашингтонський морський договір: стаття XIX"
 washington_treaty_article_xix_desc: "Стаття XIX Textського морського договору забороняє нам будувати нові морські бази або берегові бункери на островах Тихого океану."