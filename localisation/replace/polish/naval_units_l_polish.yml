l_polish:
 submarine: "Підказки"
 submarine_desc: "Підводні човни - це скручені рейдові кораблі, важкі підводні човни більші та потужніші, мають велику дальність плавання і можуть наносити бомбові удари по поверхні і березі."
 both_cruisers_desc: "Легкий крейсер - еволюціонував від захищеного крейсера і став більш гнучким, його головне завдання - захищати великі кораблі від ворожих легень, але він також може випускати потужні торпеди, здатні на набагато більшим кораблем.\n\nВажкий крейсер - еволюціонував від захищеного крейсера і став більшим, великий крійсер оснащений 8-дюймовими або більш великими знаряддями і хорошою бронею. Це добрий вибір для тих, хто не може дозволити собі будувати великі кораблі."
 light_cruiser: "Легкий Крейсер"
 light_cruiser_desc: "Еволюціонувавши з захищеного крейсера і ставши більш гнучким, його основне завдання - прикривати великі кораблі від ворожих легень, але він також може випускати потужні торпеди, які можуть пошкодити більш великі кораблі."
 heavy_cruiser: "Важкий крейсер"
 heavy_cruiser_desc: "Еволюціонувавши з захищеного крейсера і збільшившись в розмірах, важкий крейсор оснащений 8-дюймовими знаряддями і непоганою бронею. Це добрий вибір для націй, які не можуть дозволити собі побудувати більші кораблі.\nЦей тип кораблів працює в капітальній лінії."
 medium_cruiser: "Важкий флотський крейсер"
 medium_cruiser_desc: "Еволюціонувавши з захищеного крейсера і збільшившись в розмірах, важкий крейсор оснащений 8-дюймовими знаряддями і непоганою бронею. Це добрий вибір для націй, які не можуть дозволити собі побудувати більші кораблі.\nЦей тип кораблів працює в лінії екрану."
 destroyer: "Есмінець"
 destroyer_desc: "Найлегший корабель - захищати більші кораблі, знаходити і знищувати підводні човни."
 ship_hull_light: "Легкий корпус"
 ship_hull_light_desc: "Найлегший корабель - захищати більші кораблі, знаходити і знищувати підводні човни."
 carrier: "Авіаносець"
 carrier_desc: "Великий корабель, здатний нести в бій потужні літаки, також корисний як плавучий аеродром, який можна розташувати біля узбережжя ворога."
 battleship: "Лінкор"
 battleship_desc: "Лінкори - це кораблі середнього рівня з універсальними характеристиками, вони балансують між швидкістю, бронею і полум'ям, але не перевищують їх у жодній сфері."
 battle_cruiser: "Лінійний крейсер"
 battle_cruiser_desc: "Великий корабель з наступальними здібностями, що близькі до бойових, але з слабшою бронею, заміненою на вищу швидкість."
 convoy: "Конвой"
 convoy_desc: "Конвою використовують для міжнародної торгівлі товарами та ресурсами, а також для перекидання військ та морських вторгівель."
 sh_battleship: "Надважкий крейсер"
 sh_battleship_desc: "Найбільший корабель з найбільшими гарматами і найміцнішою бронею, яку можна купити за гроші, заслуговує на підтримку з боку менших кораблів."
 SH_battleship: "Надгробний лінкор"
 SH_battleship_desc: "Найбільша з найбільших гармат і найміцніша броня, яку можна купити за гроші, така дорога доставка варта підтримки з боку менших кораблів."
 battlecarrier: "Лінійний Авіаносець"
 battlecarrier_desc: "Великий, часто гіпотетичний, гібридний корабель, який має поєднувати риси авіаносця, лінкора або крейсера."
 auxiliary_ship: "Розчарований корабель"
 auxiliary_ship_desc: "Військовий корабель цивільного зразка, який відповідає за підтримку флоту."
 
 cv_cas: "Шапковий бомбардувальник (авіаносець)"
 cv_CAS_equipment_desc: "Пісоковий бомбардувальник - це бомбардувальник, який пікірує прямо на ціль, щоб забезпечити велику точність скидати бомби."
 cv_nav_bomber: "Торпедоносець (авіаносець)"
 cv_nav_bomber_equipment_desc: "Бомбардировщик-торпедоносець - це військовий літак, призначений в основному для атаки кораблів за допомогою авіаційних торпед."

 damaged_fire_control: "Пошкоджена система управління вогнем"
 damaged_wooden_flight_deck: "Пошкоджена дерев’яна палуба"
 damaged_armored_flight_deck: "Пошкоджена летюча палуба"
 gas_leakage: "Вутечка газу"