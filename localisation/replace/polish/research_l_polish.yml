 ship_rocket_artillery: "Корабельна реактивна артилерія"
 ship_rocket_artillery_desc: "Недавні досягнення в галузі ракетобудування не тільки усунули брак далекобійності, але й зробили реактивну артилерію більш доступною для масового виробництва. Враховуючи її успіх у наземних бойових діях, намагаються поєднати цю потужну зброю з бойовими кораблями, корабельна реактивна артилерія використовує ракети без будь-якого пристрою наведення. Незважаючи на найменшу точність, вони можуть завдати значного удару об'єкту навіть без прямого потрапляння. Тим часом винахід неконтактного вибуху допоміг компенсувати його слабкість."
 
