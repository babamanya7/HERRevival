 # ДООПРАЦЮВАННЯ АВІАЦІЙНИХ ДВИГУНІВ

 engine_tuning_1: "Доводка авіаційних двигунів I"
 engine_tuning_1_desc: "Покращення систем наддува, харчування та охолодження дозволяє більше використовувати потенціал існуючих авіаційних двигунів без переходу до фундаментальної нової конструкції."
 engine_tuning_1_tt: "§GВідкриває додаткову аргументацію двигунів авіапередачі до рівня +3.§!"

 engine_tuning_2: "Автомобіль другого двигуна"
 engine_tuning_2_desc: "Покращення паливної апаратури, підвищення рівня стиснення і оптимізація робочих режимів дають змогу збільшити потужність від вже освоєнних конструкцій."
 engine_tuning_2_tt: "§GВідкриває додаткову довідку авіаційних двигунів до рівня +5.§!"

 engine_tuning_3: "Доводка авіаційних двигунів III"
 engine_tuning_3_desc: "Завдяки досконалій системі охолодження і новим методам регулювання двигуна його потужності без повної зміни покоління."
 engine_tuning_3_tt: "§GВідкриває додаткову аргументацію двигунів авіапередачі до рівня +8.§!"

 engine_tuning_4: "Доводка авіаційних двигунів IV"
 engine_tuning_4_desc: "Подальший розвиток комп’ютерних наддувів, впаду палива та охолодження збільшує віддачу двигуна і розширює діапазон ефективних режимів його роботи."
 engine_tuning_4_tt: "§GВідкриває додаткову аргументацію двигунів авіаційних двигунів до рівня +11.§!"

 engine_tuning_5: "Доводка авіаційних двигунів V"
 engine_tuning_5_desc: "Завдяки поліпшенню якості виробництва, жаропровідних матеріалів та допоміжних систем можна безпечно використовувати чимраз більші навантаження."
 engine_tuning_5_tt: "§GВідкриває додаткову аргументацію двигунів авіаційних двигунів до рівня +14.§!"

 engine_tuning_6: "Доводка авіаційних двигунів VI"
 engine_tuning_6_desc: "Завдяки утворенню багатоступного наддуву, автоматичному керуванню сумішною та охолодженням можна досягти межі поршневої сили."
 engine_tuning_6_tt: "§GВідкриває додаткову аргументацію двигунів авіаційних двигунів до рівня +17.§!"

 engine_tuning_7: "Доводка авіаційних двигунів VII"
 engine_tuning_7_desc: "Запропонована форсиція і комплексна оптимізація всіх систем двигуна дозволяють видобути максимум можливого з зрілих поршневий конструкцій."
 engine_tuning_7_tt: "§GВідкриває додаткову аргументацію двигунів авіаційних двигунів до рівня +20.§!"


 # ДАЛЬНІСТЬ ПОЛЬОТУ

 range_improvements: "Збільшення віддаленості I"
 range_improvements_desc: "Покращення паливних баків, магістралей і способів розміщення палива дозволяє збільшити дальність літаків без радикальних змін у їх конструкції."
 range_improvements_tt: "§GВідкриває вікно збільшення відстані літака до рівня +4.§!"

 range_improvements_2: "Збільшення дальності II"
 range_improvements_2_desc: "Завдяки більш ефективному використанню внутрішнього об’єму літака та вдосконалених паливних систем можна отримувати більше пального."
 range_improvements_2_tt: "§GВідкриває вікно збільшення відстані літака до рівня +8.§!"

 range_improvements_3: "Збільшення дальності III"
 range_improvements_3_desc: "Оптимізація паливної системи і вдосконалення підвісних баків значно розширяють значну частину дії авіації."
 range_improvements_3_tt: "§GВідкриває вікно збільшення відстані літака до рівня +12.§!"

 range_improvements_4: "Збільшення дальності IV"
 range_improvements_4_desc: "Завдяки комплексній переробці розведення палива та зменшення його непрохідних втрат літаки можуть діяти значно далі від своїх аеродромів."
 range_improvements_4_tt: "§GВідкриває процес збільшення відстані літака до рівня +16.§!"

 range_improvements_5: "Збільшення віддаленості V"
 range_improvements_5_desc: "Заперечна оптимізація паливних систем, баків і режимів крейсерського польоту дозволяє максимально збільшити радіус дії поршневої авіації."
 range_improvements_5_tt: "§GВідкриває процес збільшення відстані літака до рівня +20.§!"
 
 
