 anti_air_rockets:0 "Протиповітряні ракети" 
 anti_air_rockets_desc:0 "Крім використання ракет у наземній війні, флот також намагався об’єднати цю потужну зброю з кораблями. Зенітні ракетні установки використовували ракети без приладів, але вони могли завдати непоправної шкоди літакам, хоча й були низькою. У той же час розробка неконтактних вибухів також могла б у певній мірі компенсувати проблему точності."
  
 advanced_sonar:0 "Літераційне встановлення"
 advanced_sonar_desc:0 "Буксируваний сонар також відомий як вираз змінної глибини, він може працювати на великих глибинах, що дозволяє уникнути перешкод від шуму суден.\n\nВстановлення цього модуля в §YРоз'єм для електроніки§! на §YЛегкі кораблі§! або §YКрейсери§! допоможе їх виявити §YПідводні човни§! Ворог."
 naval_radio_guiding_system:0 "Система радіотехніки ВМФ"
 naval_radio_guiding_system_desc:0 "Спочатку радіо використовували для зв’язку та радіолокації, але в кінці війни у нього з'явилася функція дистанційного управління. Військово-морський флот також почав вводити систему наведення, засновану на радіосигналах на найновішому обладнанні. Порівняно з інерційними і неврівноваженими методами наведення радіонаведення, радіонаведення також враховує місця призначення, що є зручнішим для атаки рухомих кораблів."
 ship_to_ship_missile:0 "Радіоконтрольована протикорабельна ракета"
 ship_to_ship_missile_desc:0 "Перша протикорабельна ракета з радіоуправленням має надзвичайно високу швидкість і може завдати великої шкоди. Однак для того, щоб перевозити велетенський корпус ракети, потрібно особливого запуску, а щоб встановити його, можуть не всі військові кораблі."
 high_speed_light_engine:0 "Котел високого тиску"
 high_speed_light_engine_desc:0 "Недавно винайдений котел надвисокого тиску може забезпечити більшу потужність парової турбіни - близько 75 000 л.с., і це значно збільшує швидкість кораблів. Проте через нестабільну роботу високошвидкісної парова турбіна в даний час використовується тільки на невеликих кораблях, таких як есмінці."
 large_destroyer_trend:0 "Великий есмінець"
 large_destroyer_trend_desc:0 "Лідером флотилії був військовий корабель, який відповідав за флотилії есмінців та інших менших військових кораблів, зазвичай невеличким крейсером або великим есмінецьом. Спочатку часто використовували старі легені або розвідувальні крейсери, але на початку 1900-х років швидко зростаюча швидкість нових конструкцій есмінців означала, що такі судна більше не могли йти в ногу з Згідно з цим, есмінці створили великі конструкції, щоб використовувати їх як лідерів.\n\nВстановіть §YРоль есмінця-лідера§! на §YПростий корпус§!Щоб посилити §YЛегка атака§!."
 escort_destroyer_trend:0 "Ескортний есмінець"
 escort_destroyer_trend_desc:0 "Під час Другої світової війни з’явилися нові підводні човни, які загрожували торговельному флоту. Оскільки велика кількість есмінців була переповнена бойовими діями, виникла потреба в дешевих і гнучких есмінцях. Есмінці втратили більшість ненульового обладнання, залишивши тільки базові знаряддя і глибинні бомби, будь-яка військово-морська держава може побудувати багато кораблів цього типу за кілька місяців. Завдяки сонарам ці маленькі хлопці, що діють на океанському маршруті, стали важливим фактором військового потенціалу країни.\n\nВстановіть §YРоль есмінця§! на §YПростий корпус§!, щоб знизити §YКоштує§!."
 destroyer_mass_production:0 "Есмінець масового виробництва"
 destroyer_mass_production_desc:0 "Масштабні бої на лінії фронту призвели до величезної втрати есмінців, які ледве могли витримати навіть морські держави, що правили перед війною сотні есмінців. Для того щоб зберегти ефективність флоту на есмінцях нового покоління, було прийнято простий у виробництві режим, але час від закладки киля до спуску на воду значно зменшується."
 sound_surveillance_system:0 "СОСУС"
 sound_surveillance_system_desc:0 "СУСУС, або система звукового спостереження, — це мережа протиложного спостереження, що складається з великої кількості пасивних гідролокаторів. Щоб побудувати таку систему, потрібно було побудувати станції моніторингу на островах і берегах, а удосконалена гідроакустична група могла стежити за підводними човнами в цьому районі через SOFAR (канал). Ви також можете використовувати цю систему для наукових досліджень, у тому числі гідрологію, географію та морську біологію."
 destroyer_missile_upgrade:0 "Переобладнання зенітного ракетного есмінця"
 destroyer_missile_upgrade_desc:0 "Під час Другої світової війни було розпочато зусилля по розробці ракет класу «Земля-повітря», оскільки вважалося, що зенітна артилерія безсила проти бомбардувальників, характеристики яких постійно зростають. Дослідження проводилися кількома великими силами світу і швидко розробили велику кількість типів, які підвищували ЗРК наземну ЗРК для використання в морських боях.\n\nВстановіть §YРоль протидушного есмінця§! на §YПростий корпус§!, щоб розблокувати §YРакети класу "Земля-повітря"§!."
  
 early_cruiser_armor:0 "Броня крейсера Великої війни"
 early_cruiser_armor_desc:0 "Крейсерська броня розвивалася в роки Великої війни, охоронені крейсери замінили у 1890-х роках незахищені крейсера, а також вказували майбутнє розвитку крейсерів."
 basic_cruiser_armor:0 "Межвонна броня крейсера"
 basic_cruiser_armor_desc:0 "Обмеження водопостачання крейсерів, заснованого Вашингтонською морською угодою 1920-х років, спонукало конструкторів прийняти такі ідеї, як похила броня, для економії тунелю. Крейсера нової конструкції зазвичай мали середнє бронювання, здатне протистояти снарядам старих скорострільних гармат."
 improved_cruiser_armor:0 "Покращена броня крейсера"
 improved_cruiser_armor_desc:0 "В умовах нависаючої напруженості по всьому світі Вашингтонська система розвалилася, коли Японія та Італія відмовилися підписати другу Лондонську морську угоду, і обидві країни почали будувати крейсера, що перевершує їх. Порожня площа крейсерів стала товстішою і міцнішою, ніж вимагає час."
 advanced_cruiser_armor:0 "Удосконалена броня крейсера"
 advanced_cruiser_armor_desc:0 "Окрім важкої броні, нові крейсери також створили компони броні, аналогічну лінкору. Зберігаючи високу швидкість, більше тоннажу було спрямовано на броню ключових частин"
 searchlight:0 "Прожектор"
 searchlight_desc:0 "Комплект потужних ліхтарів, які зазвичай встановлюються на бортах крейсерів або лінкорів, щоб знайти ворожі кораблі під час нічних боїв, а також допомагають кораблю орієнтуватися в туманну погоду. Хоча він може допомогти отримати краще поле зору, але якщо не бути обережним, він може розкрити ваше власне становище."
 treaty_cruiser_trend:0 "Договірний крейсер"
 treaty_cruiser_trend_desc:0 "Побоюючись, що гонка у будівництві більших і могутніших крейсерів може звести нанівець заборону будувати великі кораблі, представники США, Великобританії, Японії, Франції та Італії Було встановлено обмеження на тунелів і вогняну силу крейсерів - 10 000 тонн стандартного водопостачання і 8 дюймів максимального калібру головного знаряддя."
 colony_cruiser:0 "Колоніальний крейсер"
 colony_cruiser_desc:0 "Для захисту величезних колоній під час проектування крейсерів імперій завжди визначали дальність плавання і вартість. Колоніальний крейсер не є крейсером особливого класу, але має такі особливості, як низька вартість, перевага у швидкості і хороші мореплавні якості. Розмежений далеко від імперій, його більш ніж достатньо для підтримки відносно потужної військово-морської присутності навіть на краю світу.\n\nВстановіть §YРоль колоніального крейсера§! на §YКорпус крейсера§!, щоб знизити §YКоштує§! ."
 cruiser_gun_upgrade:0 "Крейсерський напівавтоматор"
 cruiser_gun_upgrade_desc:0 "З покращенням характеристик есмінців у 1930-і роки старі швидкострільні гармати на крейсерах вже не могли відповідати потреби реального бою. Для того щоб запобігти есмінцю крейсеру, машини механічного заряду були оснащені машинами, що підвищило швидкострільність при економії живої сили. Хоча ця зарядова машина все ще потребує ручної допомоги, вона може забезпечити ефективність зарядження, що перевищує ефективність запряженого обладнання."
 cruiser_aa_upgrade:0 "Переобладнання зенітного крейсера"
 cruiser_aa_upgrade_desc:0 "Хоча багато консерваторів у флоті досі не хочуть цього визнавати, в 1920-х і 1930-х характеристиках пробічної авіації значно покращились. Існують численні військові вчення, які свідчать про домінування авіаносців у майбутніх морських боях. Щоб посилити слабі протиповітряні можливості флоту, морські сили почали посилювати зенітні гармати на своїх крейсерах у 1930-х.\n\nВстановіть §YРоль протидушного крейсера§! на §YКорпус крейсера§!Щоб посилити §YПротипожежна Оборона§!."
 destroyer_cruiser_trend:0 "Супересмінець"
 destroyer_cruiser_trend_desc:0 "З появою великих есмінців з’явився новий тип кораблебудівного корабля, який має силу гасити крейсерський рівень на легкому корпусі. По всьому світі його визначення щодо перехідних озброєнь було різним, він може бути лідером флотилії в ескадрі і вбивцею есмінців, якщо діяти самостійно. Навіть якщо він зустріне свого крейсера, то зможе врятуватися, покладаючись на свій привілей швидкості.\n\nВстановіть §YРоль Супересмінця§! на §YПростий корпус§!, щоб розблокувати §YЛегка середня батарею§!."
 cruiser_radar_sentry:0 "Переобладнання радіолокаційних позицій"
 cruiser_radar_sentry_desc:0 "Радар повністю змінив спосіб виявлення противника у морській війні, навіть найбільш підготовлені спостерігачі не можуть порівнятися з його довгою виявленням. Як авангард флоту, крейсера стали першими військовими кораблями, на яких були встановлені радари. Зруйновані біля передової позиції, крейсери можуть виявити противника за допомогою радарів на віддалі, що дозволяє флоту виявити ворога раніше, ніж раніше.\n\nВстановіть §YРоль радіолокаційної пікета§! на §YКорпус крейсера§!Щоб посилити §YВиявлені на поверхні§!."
 fighter_directional_system:0 "Система керування винищувачами"
 fighter_directional_system_desc:0 "Представник корабельної системи перехоплення був розроблена в роки війни тактика спільного перехоплення з наземним управлінням. Підключивши до об’єднаного центру управління декілька радіолокаційних станцій, штаб може видати винищувачам точнішу інформацію про положення і швидкість літаків ворога. З розвитком корабельних радарів ця система стала використана і в військових-морських операціях. Інформація, організована кожним кораблем, буде складатися для того, щоб палубні винищувачі могли ефективніше перехоплювати літаки ворога."
 cruiser_missile_upgrade:0 "Переозброєння ракетного крейсера"
 cruiser_missile_upgrade_desc:0 "Це зробило корабельні знаряддя слабкими і даремними перед лицем протикорабельних ракет, Ракети не тільки потужніші, але й точніші. Лінкори можуть використовувати свій великий простір для встановлення пускових установок, але на крейсерах це не так вже й легко.\n\nВстановіть §YРакетний крейсер§! на §YКорпус крейсера§!, щоб розблокувати §YПротилежна ракета§!."
 helipad:0 "Вертолітний майданчик" 
 helipad_desc:0 "Ідея вертольота була винайдена задовго до 20-го століття, але сотні з них були вперше побудовані і використані на війні під час Другої світової війни. Спочатку вертольоти використовувалися в невеликій кількості для спостереження, транспортування та медичної евакуації. Оскільки вертикальний політ дозволяє заощадити більше місця на вузькій палубі корабля, флот також побачив у цьому прориві ідеальні запаси для гідросамолетів. Але перш ніж були розроблені турбові двигуни, вертольоти відігравали дуже обмежену роль у морських операціях."
  
 basic_heavy_armor:0 "Нижня важка броня"
 basic_heavy_armor_desc:0 "Після закінчення Великої війни великі кораблі почали використовувати більш товсту броню, щоб упоратися з швидким розвитком корабельних знарядь. Часто бронєві пояси фронтових лінкорів сягали до понад 300 мм, що дозволяло в основному захистити від стрільби ГК, побудованих під час війни."
 improved_heavy_armor:0 "Покращена важка броня"
 improved_heavy_armor_desc:0 "У 1930-х на знову проектованих великих кораблях була застосована похила броня, і хоча вона трохи менша за товщину, вона могла забезпечити такий же рівень захисту, як і товста вертикальна броня."
 advanced_heavy_armor:0 "Вдосконалена важка броня"
 advanced_heavy_armor_desc:0 "У новій важкій броні, розробленій під час Другої світової війни, почали використовувати новітні технології виробництва сталі, міцніші й еластичніші, не тріскаються під час пострілу деяких бронебійних снарядів."
  
 incremental_armor_scheme:0 "Пост-Ютландська схема броні"
 incremental_armor_scheme_desc:0 "Юрландське зіткнення виявило недоліки конструкції броні великих кораблів, не маючи можливості вести бій на великі дистанції, броня попередніх лінкорів взагалі не могла протистояти 15-дюймовим корабельним знаряддям. Нова схема броні, розроблена після цього, була також відома як пост-Ютландська схема, яка представляла часову конструкцію, в основному посилююючу броню, і незабаром застаріла після війни.\n\nВстановіть §YСхему броні§! на §YВажкий корпус§! для підсилення §Yброні§! або §YОЗ§!."
 mixed_armor_scheme:0 "Смішна схема броні"
 mixed_armor_scheme_desc:0 "Смішна схема - це перехідна схема бронювання, що з'явилася після війни і в основному інтеграла уроки, виведені з Ютландії, і ідея захисту за принципом «все або нічого»Інкрементна схема, яку винайшли 20 років тому, має найкраще співвідношення броні в деяких найбільш вразливих місцях.\n\nВстановіть §YСхему бронювання§! на §YВажкий корпус§!Щоб посилити §Yброню§! або §YОЗ§!."
 all_or_nothing_armor_scheme:0 "Схема броні «Все або нічого»"
 all_or_nothing_armor_scheme_desc:0 "Схема «все або нічого» перша використана на лінзах типу «Невада», а потім застосовувалася на всіх линкорах США, за умови однакового тоннажу ідея «все або нічого» Кобаблі з такою схемою зазвичай мають більшу живу цінність, коли використовують бронєві коробки для захисту крихкого магазину та головного двигуна.\n\nВстановіть §YСхему броні§! на §YВажкий корпус§!Щоб посилити §Yброню§! або §YОЗ§!."
 all_or_nothing_armor_box_armor_scheme:0 "Покращена схема броні «Все або нічого»"
 all_or_nothing_armor_box_armor_scheme_desc:0 "Під час Другої світової війни дослідження по броні лінкорів вийшли на вищий рівень, широко використовували схему «все або нічого»Що сприяло утворенню серії снарядів з більшою бронепробивністю. У результаті на нових линкорах були встановлені коробки вторинної броні, щоб збільшити надійність корабля і водночас захистити другорядні ділянки, як, наприклад, приміщення екіпажу.\n\nВстановіть §YСхему бронювання§! на §YВажкий корпус§!Щоб посилити §Yброню§!. або §YОЗ§!."
 harvey_steel:0 "Стаючи Гарві"
 harvey_steel_desc:0 "Броня Харві є різновидом сталевої броні, розробленої американським інженером Хейвордом Харві на початку 1890-х років. Колись він був популярним, і його бачили кілька основних виробників броневих аркушів, включаючи Vickers, Krup і Bethlehem."
 krupp_steel:0 "Сталь Крупп"
 krupp_steel_desc:0 "Броня Крупп була винайдена німецькою компанією Krupp Arm Works у 1893 році і замінила броню Харві в якості основного методу захисту кораблів. Виробництво броні Крупп було дуже схоже на броню Harveyized, але в процесі Крупп замість звичайного використання нікелевої сталі додавали до 1% хрома для додаткової міцності. Ранні балістичні випробування показали, що 260 мм броні Крупп забезпечує такий же захист, як 300 мм броні Харві."
 krupp_cemented_steel:0 "Крупповська цементована броня"
 krupp_cemented_steel_desc:0 "Процес виготовлення цементованої броні Krupp (KCA) багато в чому залишився таким же, як і вихідна сталева броня Krup, з невеликими змінами у складі сплаву. KCA зберіг загартовану поверхню за рахунок застосування карбонізованих газів, але також мав набагато більшу волокнисту еластичність на задньої частини пластини, що значно знизило ймовірність розтягування і Розкидання під дією вогню."
 ducol_steel:0 "Сталевий Ducol"
 ducol_steel_desc:0 "Ducol або D-steel — це назва низки високопрогресивних об’єктів, які вперше були розроблені на початку 1920-х років шотландською компанією David Colville & Sons. Це включає спорудження корпусів кораблів, легкі броні та посудини під тиском, як, наприклад, парові котли локомотивів."
 homogeneous_krupp_steel:0 "Гомогенна велика броня"
 homogeneous_krupp_steel_desc:0 "У кінці 19 - на початку 20 століть виробництво обладунків з лицьовою закочкою виявило, що така броня менш ефективна проти косих ударів. Хрупкість загартованого лицевого шару була контрпродуктивною при таких впливах. Новий винахід гомогенної сталі поєднував гнучкість і міцність на розрив і зазвичай використовувався для захисту палуби та ватерлінії."
  
 basic_torpedo_defense:0 "Рання система торпедного захисту"
 basic_torpedo_defense_desc:0 "Торпеда, випущена торпедним катером, який коштує менше одного відсотка вартості лінкора, може завдати такої ж шкоди, як і потрапляння важкої морської зброї, або навіть більш смертоносної. Щоб не піддатися такій загрозі, під час Великої війни одна за одною встановлювалися системи торпедного захисту. За рахунок розділення більшої кількості водонепроникних відсіків всередині корпусу ефект прийому води був збалансований. Аналогічні зусилля включали торпедні виступи, наповнені рідиною для максимального поглинання підводних вибухів.\n\nВстановіть §YСистема торпедного захисту§! на §YВажкий корпус§!, Щоб зменшити §RТорпедний урон§!."
 improved_torpedo_defense:0 "Покращена система торпедного захисту"
 improved_torpedo_defense_desc:0 "Ці нові торпед набагато сильніші, ніж торпед минулих років. Щоб компенсувати недоліки системи торпедного захисту часів Великої війни, за місцями, вразливими для торпедних атак, була поставлена броня, яка разом з торпедними перебірками може протистояти деяким Вдарам торпед.\n\nВстановіть §YСистема торпедного захисту§ на §YВажкий корпус§!, Щоб зменшити §RУрон торпед§!."
 advanced_torpedo_defense:0 "Удосконалена система торпедного захисту"
 advanced_torpedo_defense_desc:0 "Найновіша система торпедного захисту спробувала захистити корпус від торпед, розділивши більш водонепроникні відсіки, що може гарантувати, що основна плавність корабля не буде порушена, а вдосконалення процесу Крім того, броні посилили торпедний пояс.\n\nВстановіть §YСистема торпедного захисту§! на §YВажкий корпус§!, Щоб зменшити §RТорпедний урон§!."
 enhanced_horizontal_defense:0 "Покращення горизонтального захисту"
 enhanced_horizontal_defense_desc:0 "Діаболічна траєкторія з великої дистанції є одним з найпоширеніших способів, як розбити корабель у боях. Юрландські сутички вже послабили броню лінкорів, і це підштовхнуло морські сили до всилення горизонтальної оборони."
 heavy_ship_refit_reduction:0 "Ремонт застарілого корабля"
 heavy_ship_refit_reduction_desc:0 "Морська відпустка довела до значної міри зусилля в судобудуванні кожної країни, щоб удосконалити флот під суворим контролем модернізації старих кораблів, які стали ефективними і економильними."
 dry_dock_expansion:0 "Розширення сухого дока"
 dry_dock_expansion_desc:0 "Морські держави почали будувати більші лінкори відразу після Великої війни, для чого потрібні більші верфі, ніж ті, які використовувалися для дредноутів. Щоб розмістити велетенські корпуси кораблів, робітники розширили свої сухі доки, побудовані на початку 20 століття.\nХоча ці суперлінкори так і не були спущені на воду, нові доки залишилися. Їх не тільки можна було використовувати для будівництва більших кораблів, але й для великих кранів та портів, які також значно підвищили ефективність ремонту і технічного обслуговування."
 improved_conning_tower:0 "Покращена бойова рубка"
 improved_conning_tower_desc:0 "Бойова рубка — це ядро лінкора, яка завжди брала на себе обов’язки командування, розвідки та осередки вогню, а також розвиток морських знарядь призвели до еволюції бойової рубки. Не маючи достатнього захисту, інтегрований і закритий містик міг би забезпечити кращий захист командного складу і водночас створити достатньо місця для відділення зв'язку."
 fuel_oil_boiler:0 "Мазутний котел"
 fuel_oil_boiler_desc:0 "Мазут — це важка нафта, яка залишається після того, як вивільняється бензин або дизельне паливо з сирої нафти, яка дуже в’язке й важко влітається. Завдяки високій теплотворній здатності мазут може згорити більш повно, забезпечуючи більш потужної енергетики кораблів, і при цьому виділяти менше диму, ніж котли, що працюють на вугіллі"
 ship_living_standard:0 "Підвищення рівня життя на судні"
 ship_living_standard_desc:0 "Умови життя на борту були дуже суворими, але поступово ця ситуація змінюється. Дедалі більше країн почали використовувати на військових кораблях залізні ліжка і системи кондиціювання, щоб забезпечити бойову мораль і фізичний стан моряків у мирний час, щоб вони могли віддатися бою в більш Боєспроможний.\nПричому з тонкацу (смаченої свинячою відбивною) і рису каррі в Японії до макаронів і морозива в США, їжа на кораблях стала ще кращою, хоча найкраща їжа була призначена для офіцерів. \n\n§CНехай армія нам завидує!§!"
 rudder_upgrade:0 "Модернізація руля"
 rudder_upgrade_desc:0 "Завдяки використанню поліпшеного рульового механізму корабель може обертатися, а менший радіус повороту можна повернути флоту, щоб якомога швидше коригувати або відступати."
 battleship_aa_upgrade:0 "Модернізація ПВО лінкора"
 battleship_aa_upgrade_desc:0 "Здається, що значення авіаносців у війні підштовхнуло морські держави переключити свою увагу на бойову команду літаків, і стан лінкорів значно погіршився. Але без захисту від лінкорів авіаносець все ще дуже уразливий, і їх розміри забезпечують платформу для протиповітряної оборони флоту. Ці лінкори, оснащені великою кількістю зенітних знарядь, почали з’являтися поряд з авіаносцями як ескот."
 gas_turbine:0 "Газова турбіна"!
 gas_turbine_desc:0 "Газова турбіна використовує безперервний потік газу в якості робочого середовища, приводить робоче колесо у обертання на високій швидкості, і перетворює енергію палива в машину внутрішнього згорання. Вона набагато швидше, ніж традиційна парова турбіна, але обмежена такими технологіями, як термостійкі матеріали, тому скрипти застосування газових турбін відносно незначні."
 fuel_tank_upgrade:0 "Великий паливний бак"
 fuel_tank_upgrade_desc:0 "Стандартний проект глобального флоту полягає в тому, що флот країни за будь-яких обставин може бути розгорнутий далеко від його впливу і ефективно здійснювати утримання на місцевому рівні. Велич великих паливних баків на наших кораблях може допомогти нам досягти цієї мети."
 radar_jammer:0 "Радарна глушка"
 radar_jammer_desc:0 "Технологія радара значно полегшила виявлення противника, що має вирішальне значення у морській війні, адже для боротьби з ним було розроблено ряд інтерференційних технологій. Спочатку перешкоди досягали металевої соломи та інших пасивних методів. Тепер глушник може створювати велику кількість перешкод на робочій частоті радара ворога, що ускладнює виявлення нас."
 combat_information_center:0 "Інформаційний центр бою"
 combat_information_center_desc:0 "Бойовий інформаційний центр, або CIC, — це серце військового корабля. Під кінець війни на найбільш досконалих кораблях ВМФ було встановлено всі види електронних пристроїв, включаючи пошуковий радар, зенітний радар і система управління вогнем, а колишня бойова рубка перестала відповідати вимогам. CIC інтегрував кожен блок керування бортовими електронними системами і за допомогою комп'ютерів міг надавати капітану або командуючий флот більш швидку і докладну інформацію."
  
 prototype_airplane_launcher:0 "Прототип пускової авіації"
 prototype_airplane_launcher_desc:0 "Пускова установа для корабельних літаків, винайдена в Британії, використовує гідравлічний тиск для викиду легких гідросамонетів з кораблів з обмеженим простором, а потім піднімає їх за допомогою крана в Деякі країни експериментували з використанням гідросамолетів у Великій війні. Але з збільшенням розмірів літаків звичайна катапульта вже не могла гарантувати ефективного удару літака, що зрештою призвело до появи авіаносця в майбутньому."
 early_carrier_study: "Дослідження неповноцінної здатності"
 early_carrier_study_desc: "Для перевезення, озброєння, розвертання і відновлення літаків авіаносець задовольняв потреби літаків під час польоту з моря. Перш ніж з’явився перший авіаносець, було проведено різні дослідження провідних країн у галузі авіабудівництва, які заклали міцний фундамент для тих, хто прийшов пізніше".
 landing_aid_system:0 "Система допомоги при посадці"
 landing_aid_system_desc:0 "Незважаючи на назву авіаперельоту, найбільш небезпечним є літак. «системи»На кожній авіаносці ВМС будуть мати офіцерів зв'язку десантом (LSO), які керуватимуть десантними операціями. Іноді їх обслуговували досвідчені пілоти, які використовували набір семафорів з кольоровими лопатками, щоб допомогти пілотам керувати посадкою."
 arresting_gear:0 "Занепокоєння"
 arresting_gear_desc:0 "Система зупинки приземлення — допоміжне устаткування авіаносця, яке забезпечує безпечне посадку літака на палубу авіаносця. Найбільшою частиною цього механізму є гальма, яка утримує хвостовий гак літака високопрозорим тросом, і якщо він не впорається зі своїм завданням, він стає останньою мірою."
 aviation_dawn:0 "Розмаїття авіації"
 aviation_dawn_desc:0 "Її становище на флоті значно поліпшилось завдяки розвитку морської авіації. ВМС Японії, Королівського флоту і ВМС США організували велику кількість вчень наприкінці 1920-х - на початку 1930-х років і розробили серію військово-морських і повітряних тактик. Через великий технічний поріг флот будь-якої країни повинен пройти практика, якщо він хоче створити потужні сили морської авіації.\n\nОднак будь - яка країна, яка має великі лінкори, не може змінити курс, протистояти егоїстичним інтересам.\n\n§RЕра літаків настала, гармати і броня залишилися в минулому ...§!"
 night_air_strike:0 "Нічний повітряний удар"
 night_air_strike_desc:0 "Рух у нічний час — це надзвичайно небезпечне завдання, але воно може спричинити елемент несподіванки. Завдяки інтенсивному тренуванням по зльоту і посадці на авіаносці вночі пілоти та наземні команди поступово почали наносити ефективні авіадиспетчери вночі, коли вони добре освітлені."
 dive_bomber_study:0 "Дослідження пікуючого бомбардувальника"
 dive_bomber_study_desc:0 "На відміну від торпедносців, бомбардувальники атакують з великою висоти, що заважає їм перехоплювати винищувачами або зенітніми гарматами. Крім того, пікування безпосередньо на ціль забезпечує велику точність бомби і спрощує її траєкторію, дозволяючи пілоту зберігати візуальний контакт протягом усього польоту бомби. Крім того, маневрність гарантує, що вони можуть атакувати і йти на високій швидкості, підвищуючи виживання і вдаючись до маневрування цілових кораблів неефективними."
 carrier_mass_production:0 "Авіаносець масового виробництва"
 carrier_mass_production_desc:0 "Після багатьох років розробки авіаносець більше не був грубим кораблем з дерев’яними палубами, а, навпаки, авіаносці використовували все нові й нові технології, і вони навіть мали тенденцію перевищувати лінзи. Новий метод будівництва може прискорити запуск авіаносців."
 vnr_ship_hull_escort_carrier:0 "Ескортний авіаносець"
 vnr_ship_hull_escort_carrier_desc:0 "Підводні човни серйозно загрожували торговельному флоту під час війни, але, незважаючи на те що літаки мали більшу ефективність, вони не могли прикрити конвою глибоко в океані. Цінність звичайних авіаносців обмежувала їх використання в фронтальних боях, і в той час були побудовані ескортні авіаносці з невеликими ангарами. Вони були дуже дешеві через використання деяких цивільних компонентів."
 folding_wing:0 "Складне крило"
 folding_wing_desc:0 "Морський бій другої світової війни був тривимірним боєм, і літаки були вирішальними. Щоб збільшити вантажопідйомність на авіаносцях, авіаконструатори використовували на літаках складні крила для економії місця на палубі та в ангарі, але це вимагало великої майстерності у виготовленні крил."
 carrier_damage_control:0  "Інтегрований контроль пошкоджень"
 carrier_damage_control_desc:0 "Контроль пошкоджень — це негайне реагування на ситуації, які можуть призвести до затоплення корабля. Військово-морські сили Західних країн давно усвідомили важливість професійної протипожежної і ремонтної бригади. Уроки, витягнуті з війни, тільки зробили її більш помітною, особливо для авіаносців, основних засобів військово-морського флоту.\nВідділ ліквідації катастроф складається не тільки з людей, але й з обладнання, у тому числі вогнегасники та резервуари з вогнетривками паливними баками."
 air_fuel_storage:0 "Збереження авіапотопної системи"
 air_fuel_storage_desc:0 "Під час Другої світової війни авіаносці вимагали, щоб авіаносці мали більше пального, тоді як кількість літаків на борту також відіграє важливу роль у дальшому розмірі. політ і завантаження палубних літаків.\nБільша авіалінія, яку перевозять, зазвичай означає, що авіаносець може підтримувати більше літаків і ефективно використовувати авіапасажири.\n\nЗапаси літака можуть допомогти §YСтрубним літаком§! & Як поліпшити §YДальність польоту§! і §Yманівність§!."
 full_armored_carrier:0 "Закритий броненосний авіаносець"
 full_armored_carrier_desc:0 "З’єднане Королівство було першим, хто перед війною взяв на авіаносці броновані повітряні палуби, що могло запобігти пошкодженню бомбардувань з піку в бою. Цю ідею швидко перейняли інші морські держави, які брали участь у війні, і всі їхні нові авіаносці були всичені бронепалуами. Під кінець війни найбільш досконалі авіаносці стали характеризуватися повністю закритими ангарами та тяжкобронованими палубами."
 carrier_steam_catapult:0 "Парова катапульта"
 carrier_steam_catapult_desc:0 "Навіть найсучасніші поршневі літаки в кінці війни швидко застаріли через реактивні літаки. Флот вирішив розмістити деякі з них на авіаносцях, але їхня вага була значно більшою за використання сучасних матеріалів, і вони не могли злітати з палуб обмеженої довжини. Деякі військово-морські конструктори пропонували з'єднати з катапульти парову турбіну корабля, щоб можна було ефективніше запускати реактивні літаки."
 carrier_angled_deck:0 "Кутова злітна палуба"
 carrier_angled_deck_desc:0 "Кутова палуба з'явилася в кінці 1940-х років і зазвичай розміщувалася з лівого боку палуби, утворюючи кут від 6 до 13 градусів з осейною лінією. Вся палуба була поділена на дві зони, що дозволяло авіаносцю одночасно виконувати зльот і посадку, що значно підвищило ефективність бойових вильотів."
 vnr_ship_hull_super_carrier:0 "Суперавіаносець"
 vnr_ship_hull_super_carrier_desc:0 "Під кінець війни авіаносці, які перебувають у флоті, приділяли багато уваги, щоб досягти свого апогею. Тим часом закритий ангар і бронелуба вдосконалилися, а новий авіаносець також прийняв усі технологічні інновації, такі як нахилені палуби та парові катапульти. Цей тип корабля з більшою бойовою ефективністю і вантажопідйомністю називався суперавіаносцем."
  
 acoustic_signature:0 "Дослідження акустичних сигналів"
 acoustic_signature_desc:0 "Акустична сигнатура використовується для опису поєднання акустичних випромінювачів звуку, як, наприклад, кораблів і підводних човнів. Під час широкомасштабних операцій шпигаж і спостереження в мирний час акустичні сигнатури бойових кораблів були зібрані і включені в керівництво по розпізнаванню, які роздавали оператори гідролокаторів для Автентифікація кораблів ворога під час війни."
 teardrop_hull:0 "Каплеподібний корпус"
 teardrop_hull_desc:0 "Каплевідний корпус — це конструкція підводного човна, де характеристики підводного плавання більші, ніж підводні. Він широко використовувався на ранніх етапах розробки підводних човнів, але на початку 20 століття від нього поступово відмовилися на користь конструкцій, оптимізованих для високих характеристик на поверхні, в результаті Зміни у оперативній доктрині, але, незважаючи на це, ця технологія все ще сильно вплинула на майбутнє конструкції підводних човнів."
 diesel_electric_transmission:0 "Дизель-електрична трансмісія"
 diesel_electric_transmission_desc:0 "До появи корабельного дизельного кораблю спроби керувати підводними човнами гасін і бензином не принесли успіху через їхню високу літургію. Для збільшення часу занурення підводного човна було введено дизель-електрична енергетична система, що складається з дизеля, електропроводника, генератора і акумуляторної батарейки. Дизельний двигун використовувався на поверхні генератора, а електричний двигун використовувався для підводних робіт з невеликим вмістом кисню з повітря."
 basic_periscope:0 "Базовий перископ"
 basic_periscope_desc:0 "Перископи були використані ще в 1906 році на першому підводному човні Німеччини, який міг спостерігати за зупинкою на воді, не спливаючи на поверхню."
 improved_periscope:0 "Покращений Перископ"
 improved_periscope_desc:0 "У виготовленні нових перископів використовувалися вдосконалені призми та лінзи, завдяки чому можна було покращити зображення і допомогти капітану стежити за цілями."
 advanced_periscope:0 "Удосконалений перископ"
 advanced_periscope_desc:0 "Нова технологія спрямована на вирішення проблеми вібрації перископів під час плавання підводного човна. Завдяки додатковому кронштейну щогли, навіть якщо підводний човен буде йти зі швидкістю 6-8 вузлів, на її перископ не будуть впливати хвилі. Ще одним поліпшенням стало підвищення водонепроникності — модернізація, яка захищає оптику від вибуху глибинної бомби."
 basic_ballast_tank:0 "Базовий балонний резервуар"
 basic_ballast_tank_desc:0 "Балласта цистерна — це кабіна, в якій розміщується балка і використовується для регулювання центра ваги, плавучості та стійкості судна. Баласта цистерна на підводному човні визначає швидкість занурення та спалаху підводного човна і відіграє вирішальну роль у її тактиці."
 improved_ballast_tank:0 "Покращена балатична цистерна"
 improved_ballast_tank_desc:0 "Для того щоб запобігти потраплянню з води до резервуара, використовуються новітніші методи, як - от надійний водяний насос і фільтр."
 torpedo_computer:0 "Обчисювач даних торпедів"
 torpedo_computer_desc:0 "На підводних човнах під час Великої війни використовували ручні логарифмічні лінійки або механічні калькулятори для полегшення балістичних розрахунків торпед, які базувалися на рахунковій грамотності оператора і Щоб запобігти цьому, аналогічні комп'ютери винайшли торпед. Цей пристрій був настільки великим, що його обслуговували і обслуговували два досвідчені спеціалісти, але він все одно був чудовим доповненням підводного човна."
 torpedo_loader:0 "Торпедний завантажувач"
 torpedo_loader_desc:0 "Завдяки зарядженню торпед на швидкісному підводному човні значно скорочує час перезарядки, а підводні підводні вбивці можуть стати небезпечними."
 anechoic_tile:0 "Безхехова плитка"
 anechoic_tile_desc:0 "Безехова плитка є звукоізоляційним матеріалом з синтетичного каучуку товщиною близько 30 мм з циліндричною порожниною діаметром 2-5 мм всередині, що дозволяє ефективно придушувати шум і вібрацію, а також Підвищити прихованість підводних човнів."
 sub_AIP_engine:0 "Повітрянезалежне моторне встановлення"
 sub_AIP_engine_desc:0 "Повітрянозалежна рухова система — це технологія, яка дозволяє довго керувати підводним човном, не забираючи кисню з повітря. Самозабезпечення підводних човнів з двигунами АІП більш ніж у два рази вищий, ніж у звичайних DEПЛ, а отже, час перебування в підводному стані більший."
 submarine_mass_production:0 "Підлощина масового виробництва"
 submarine_mass_production_desc:0 "Використовуючи модульний метод будівництва, верф може спустити на воду більше підводних човнів за відносно короткий час."
  
 multi_mounted_battery:0 "Багатомодульна батарея"
 multi_mounted_battery_desc:0 "Одинокі іпарені основні знаряддя були розроблені під час Великої війни і раніше стали широко поширені, але щоб отримати велику вогненну силу при аналогічній тривалій і ваги,морські держави встановлювали більше Найпоширенішою була потрійна вежа, яка набула широкого поширення."
 basic_super_heavy_battery:0 "Рання надтяжка батарея"
 basic_super_heavy_battery_desc:0 "Зверхважна корабельна гармата, розроблена напередодні морських канікул. Повідомлялося, що британський клас N3 буде оснащений 18-дюймовими гарматами, подібно як озброєні машини зустрічаються на американських та японських кораблях. Ця пушка надзвичайно потужна і може легко пробити броню будь-якого лінкора."
 experimental_super_heavy_battery:0 "Експериментальна надтяжка батарея"
 experimental_super_heavy_battery_desc:0 "У 1915 році адмірал Джон Фішер запропонував Королівському флоту надвелику лінійну крейсеру, яку називають HMS Incomparable. Конструкція була призначена для встановлення 20-дюймових гармат, які були б найбільшими, коли-небудь встановлених на військовому кораблі. Але подальші дослідження 18-дюймових гармат зіткнулися з різними проблемами і закінчилися на півдорозі після Вашингтонського морського договору. Країни, в тому числі Японія та Німеччина, відновили розробку 20-дюймових знарядь під час війни, але так і не створили функціональну модель."
 improved_super_heavy_battery:0 "Покращена надтяжна батарея"
 improved_super_heavy_battery_desc:0 "Технологічні досягнення в змінних ділянках допомогли флоту вирішити багато проблем, виявлених у старих 18-дюймових знаряддях. В нових надтяжих знаряддях зазвичай використовується калібр близько 18 дюймів, що значно потужніше за 16-дюймові гармати, які використовуються на звичайних лінзах."
 improved_medium_heavy_battery:0 "Вдосконалена середня батарея"
 improved_medium_heavy_battery_desc:0 "Хоча калібри цих знарядь були аналогічні тим, що використовувалися на додресноутах, їхня вогняна міць і бронепробивність були значно вдосконалені до рівня ранніх лінійних крейсерів завдяки сучасному використанню Технології та системи управління вогнем."
 advanced_medium_heavy_battery:0 "Вдосконалена середня батарея"
 advanced_medium_heavy_battery_desc:0 "Більший калібр був прийнятий для зброї головного калібру великих крейсерів, які можна було порівняти з деякими дредноутами."
  
 naval_combat_support:0 "Морська логіка"
 naval_combat_support_desc:0 "Морська міць означає більше, ніж бойові кораблі та літаки.\nУ мирний час і на війні завдання військово-морської логіки полягає в тому, щоб забезпечити і підтримувати оперативну готовність, забезпечуючи потрібну підтримку в потрібний час."
 basic_port_facility:0 "Базовий порт"
 basic_port_facility_desc:0 "Порт - це морський об'єкт, що включає одну або декілька пристаней і завантажувальних площ, які зазвичай називають військово-морською базою.\nВійськово-морська база може нести відповідальність за щоденне обслуговування і початок морських операцій. Завдяки основним об'єктам, включаючи доки, арсенали і паливні бункери, військово-морська база відіграє важливу роль у морських операціях."
 large_shipyard:0 "Велика верфі"
 large_shipyard_desc:0 "Зростання капіталовкладень у промисловій промисловості XIX століття призвело до радикальних змін у цих підприємствах, коли морська міць стала одним з найважливіших факторів сили країни. Невеликі компанії поступово винищувалися або були використані промисловими магнатами. Ведучі компанії володіли найбільшими у світі верфами, які могли одночасно виконувати замовлення на декілька перспективних бойових кораблів."
 heavy_crane:0 "Важкий кран"
 heavy_crane_desc:0 "Зазвичай кран оснащений канатами або ланцюгами, які можна використовувати для підйому або опускання важких предметів, і його широко використовують у суднобудуванні для встановлення башти та інших деталей на кораблі."
 dry_dock:0 "Сухий док"
 dry_dock_desc:0 "Сухий док, розроблений як вузький басейн, який можна затопити, щоб дозволити судну випливати і стояти на сухій платформі після осушення, був винайдений тисячі років тому і використовується досі. Завдяки цьому легше обслуговувати і ремонтувати підводну частину корабля."
 port_construction_corps:0 "Портовий будівельний корпус"
 port_construction_corps_desc:0 "Будівельні корпуси виконують ті ж обов'язки, що і інженери, вони дислоціюються на військово-морських базах і тісно співпрацюють з морським персоналом при обслуговуванні та ремонті портових будівель."
 integrated_shipyard_complex:0 "Концентрований адміністративний комплекс"
 integrated_shipyard_complex_desc:0 "Концентрація зусиль суднобудівництва на кількох ключових об’єктах дасть змогу значно підвищити ефективність. Цей комплекс складається з багатьох верфей та багатьох інших постачальників, які в більшості випадків працюють незалежно."
 speed_over_range:0 "Швидка реакція"
 speed_over_range_desc:0 "Швидкість - найважливіша на війні, і ми повинні зосередитися на швидкості морської логіки, щоб гарантувати, що припаси будуть доставлені нужденним підрозділам в будь-який час, коли вони про це попросять.\n\n">
 range_over_speed:0 "Глобальна присутність"
 range_over_speed_desc:0 "Незважаючи на те, що він далеко, ворог буде покараний, ми повинні зосередитися на морській логіці, щоб флот міг діяти у віддалених водах.\n\n">
 high_speed_civilian_engine:0 "Високошвидкісний громадянський двигун"
 high_speed_civilian_engine_desc:0 "З огляду на те, що високооборотний двигун набагато дорожче, громадські кораблі будуть використовувати економічні, але це ніколи не надто дорого в порівнянні з ефективністю логіки."
 armed_civilian_ship:0 "Озброєні транспортники"
 armed_civilian_ship_desc:0 "Озброєне торговельне судно — це торговельне судно, оснащене знаряддями, переважно для оборонних цілей, навмисно або постфактум. Під час вітрильників, піратства та каперства багато торгових кораблів зазвичай були озброєні, особливо ті, хто займається торгівлею на великі відстані і з високою вартістю.\nЦі думки також сильно впливають на розвиток допоміжних кораблів."
 repair_ship:0 "Ремонтний корабель"
 repair_ship_desc:0 "Ремонтне судно — це робоча бджола флоту, яка зазвичай відповідає за надання широкого спектру ремонту, у тому числі обладнання та персоналу, щоб ремонтувати серйозні несправності техніки та бойові пошкодження."
 floating_dry_dock:0 "Плавучий сухий док"
 floating_dry_dock_desc:0 "Плавучий сухий док — це мобільна ремонтна платформа, побудована для обслуговування кораблів у морі.\nРозмежений під кораблем нижче ватерлінії, плавучий сухий док розроблений так, щоб зануритися під воду, а потім відкачують воду, піднімаючи корабель з води. Потім корабель блокується на палубі плавучого сухого дока для ремонту."
 logistic_system_redundancy:0 "Резервування реєстрації"
 logistic_system_redundancy_desc:0 "Щоб правильно функціонувати логістичну систему навіть при гіршому сценарії, необхідно мати деяку надлишковість на ранній стадії логічної операції. Запасна вдвічі або навіть втричі більше необхідних припасів, ми можемо посилити лінію фронту, незважаючи ні на що."
 hospital_ship:0 "Корабель-госпітал"
 hospital_ship_desc:0 "Корабель-госпітал - це корабель, призначений для виконання основної функції в якості плавучого лікувального закладу або госпіталізації. Більшість з них експлуатують озброєні сили різних країн, оскільки вони використовуються в зонах воєнних дій або поблизу них."
 surgery_at_sea:0 "Хірургія в морі"
 surgery_at_sea_desc:0 "Члени екіпажу, які могли надати медичну допомогу, були характерною ознакою військових кораблів принаймні дві тисячі років. Але умови на борту набагато суворіші, ніж на суходолі, з огляду на хвилі солоності та вологості.\nЗавдяки досягненням медичної науки та техніки бортова хірургія може врятувати життя більше людей у розбурханому морі."
 medical_supply_at_sea:0 "Трансокеанське медичне постачання"
 medical_supply_at_sea_desc:0 "«Уроки битви біля Галліполі» Застерегли кожну країну про слабкі місця трансокеанські лінії постачання, і коли ліки досягають іншого боку океану, вони іноді псуються через екстремальні умови. Встановлення удосконаленого медичного сховища на човнах буде корисним у віддалених круїзах та десантних операціях."
 joint_sea_hospital:0 "Об’єднана морська лікарня"
 joint_sea_hospital_desc:0 "З огляду на швидкий ріст втрат на лінії фронту під час Другої світової війни полеміки недостатньо для лікування поранених. Кораблі-госпіталі дисшуються в море, далеко від поля бою, і можуть розвантажити перевантажені лікарні на суші."
 naval_fuel_complex:0 "Нефтебаза ВМФ"
 naval_fuel_complex_desc:0 "Нині механізована війна ведеться за рахунок нафти, не кажучи вже про флот. Військові кораблі мають власний добре збережений комплекс для зберігання пального.\nРозширення цих об'єктів значно підвищить стійкість нашого флоту."
 retardant_silo:0 "Ретардантний силос"
 retardant_silo_desc:0 "Топливо надзвичайно вразливе до вогню і теплу, нанесення вогнезахисних матеріалів на оболонку паливних бункерів робить їх безпечнішими у разі пожежі."
 integrated_fuel_base:0 "Велика паливна база"
 integrated_fuel_base_desc:0 "Заохочення більшої кількості станцій або об’єктів для збереження і заправки палива в одному місці може значно підвищити ефективність заправки та максимальний запас палива."
 vnr_ship_hull_civilian_1:0 "Корпус допоміжного корабля"
 vnr_ship_hull_civilian_2:0 "Корпус швидкохідного корабля бойової підтримки"
 vnr_ship_hull_civilian_2_desc:0 "Під час походу флоту бойові кораблі ніколи не зупиняться, щоб чекати, поки догонять повільніші кораблі. Швидкий корабель бойової підтримки може йти в ногу з флотом і підтримувати навіть під час бою."
 vnr_ship_hull_civilian_3:0 "Корпус корабля для заповнення запасів"
 vnr_ship_hull_civilian_3_desc:0 "Нефтяний корабель поповнення запасів - це тип тихохідних, але універсальних допоміжних кораблів ВМФ з великими паливними баками і сухо завантаженими трюмами. Окрім корабельного палива, він також може забезпечувати літаками, які перебувають на авіаносцях."
  
  
 modifier_repair_speed_naval_base_factor:0 "Швидкість ремонту морської бази"
 modifier_repair_speed_dockyard_factor:0 "Швидкість ремонту верфі"
 modifier_repair_speed_fuel_silo_factor:0 "Швидкість ремонту паливного силосу"


# cold war techs
 rocket_depth_charges: "Протилежні ракети"
 rocket_depth_charges_desc: "Щоб протистояти новим підводним човнам, які з’явилися після Другої світової війни, які йшли тихіше, на набагато більшій швидкості і могли атакувати з набагато більшою швидкістю за допомогою високошвидкісних Західний торпед винайшов торпед з ракетним управлінням (RAT), щоб користуватися перевагами сучасних гідролокаторів. Потім RAT було впроваджено як ракета ПЛО, яка керує власною гідролокаційною системою і наведена на ціль за допомогою активного або пасивного сонара."
 destroyer_guided_missile_upgrade: "Ракетний Есмінець"
 destroyer_guided_missile_upgrade_desc: "З розвитком ракет вони ставали все швидше і менше, що дозволяло навіть легкий корабель перетворитися на грізну бойову машину, подібну до лінкора у відкритому морі."
 destroyer_hull_improvement: "Океанський есмінець"
 destroyer_hull_improvement_desc: "Есмінець, що з'явився як ескорт капітальних кораблів на початку XX століття, на другій половині століття перетворився на де-факт корабель модернізованого флоту, що виконує всі види завдань, які були покладені на крейсери або Він навіть зарекомендував себе як економний багатоцільовий корабель, який буде грати важливу роль і в майбутньому."
 modern_sonar: "Композитний комп’ ютер"
 modern_sonar_desc: "Спираючись на досвід воєнних дій, військово-морські країни світу зрозуміли, що для полювання за сучасними підводними човнами одного сонара недостатньо. Інтегровадна сонарна система є частиною комплексної протилодної системи, яка складається з набору пасивних і активних сонарв."
 phased_array_radar: "Радар з фазованою ґраткою"
 phased_array_radar_desc: "У теорії антен фазована решітка зазвичай означає електронну скануюююче решітку - керовану комп'ютером сукупність антен, які створюють пучок радіохвилі, який можна скеровувати в різні сторони без пересування Антени. Технологія фазованих решіток, яку застосовують у радарах, дозволяє одночасно відстежувати кілька морських і повітряних цілей, отримуючи детальні відомості про їхній напрямок, швидкість і висоту."
 decoy_launching_system: "Систем запуску ЛТЦ"
 decoy_launching_system_desc: "Військові кораблі швидко ставали непотрібними проти ракет. Нещодавно винайдена система DLS — це система, яка запускається за фальшивими метами малої віддаленості, яка запускає радіолокаційні або інфрачервоні фальшиві цілі з військових кораблів, щоб відбити атакуючі протикорабельні ракети. Приманки подають фальшиві сигнали і створюють перешкоди для систем наведення і управління вогнем атакуючих ракет."
 new_ship_materials: "Нові матеріали"
 new_ship_materials_desc: "Після Другої світової війни морська броня стала менш важливою через розвиток керованих ракет, Ракети можуть бути дуже точними і пробивати навіть найбільшу броню. Замість того щоб вкладати більше грошей у поліпшення броні, нові матеріали будуть легшими, що дозволить кораблю плисти з більшою швидкістю."
 nuclear_reactor_cost_reduction: "Економний ядерний реактор"
 nuclear_reactor_cost_reduction_desc: "Реактор поділу став перлиною індустріальної сили людства, коли світ перейшов до 1950-х років. У спробі побудувати повноцінний атомний флот було розроблено нові матеріали та прилади для подальшого зниження вартості корабельного ядерного реактора."
 full_missile_ship: "Повністю ракетний корабель"
 full_missile_ship_desc: "Морська артилерія ніколи не пропаде, коли ракети зможуть зробити те ж саме або навіть краще. З розвитком авіації та морського бою кораблі з повним ракетним озброєнням стають наріжним каменем військово-морського флоту."
 nuclear_engine_research: "Ядерний двигун для надводних кораблів"
 nuclear_engine_research_desc: "Ядерна морська вага - це рух корабля за рахунок тепла, який виділяється ядерним реактором. Електростанція нагріває воду для виробництва пари для турбіни, яку використовують для обертання гвинта через редуктор або через електрогенератор і двигун."
 naval_tactical_data_system: "Морська система тактичних даних"
 naval_tactical_data_system_desc: "Морська система тактичних даних - комп'ютерна система обробки інформації, розроблена у 1950-х роках для використання на бойових кораблях. Вона приймала звіти від численних сенсорів на різних кораблях і об’єднувала їх для створення єдиної карти бойового простору, а потім передавалася на кораблі та оператори зброї."
 integrated_combat_system: "Інтегровадна бойова система"
 integrated_combat_system_desc: "Інтегрована бойова система - це масштабована, мережева система управління бойовими діями, використовуючи загальне програмне забезпечення і обчислювальну інфраструктуру, для швидкого розгортання можливостей у Всі ділянки для надводного флоту."
 memory_expansion: "Суфікс пам' яті"
 memory_expansion_desc: "Революційний прорив у галузі напівпровідників дав змогу збільшити обсяг пам'яті в існуючих комп'ютерах, завдяки більшій швидкості обчислень комп'ютери керування вогнем стануть швидшими і точнішими."
 comprehensive_display_system: "Комплексна система показу"
 comprehensive_display_system_desc: "Комплексна система показу (КСО) — це система керування, керування і координації. Оператори могли прив’ язувати об’ єкти на екрані радари різними ідентифікаторами і об’ єднувати їх на одному дисплеї. КСО дозволила операторам легко скеровувати дружні винищувачі на курси перехоплення незнаних цілей, а пізніші версії могли автоматично розраховувати точки перехоплення."
 electromagnetic_signature_study: "Дослідження електромагнітної сигнатури"
 electromagnetic_signature_study_desc: "Усі кораблі випромінюють електромагнітні поля, які можуть бути виявлені підводними датчиками або мінами, які поширюються через воду. Тому електромагнітні сигнатури кораблів повинні бути нижче безпечного рівня, тобто максимального рівня електромагнітних сигнатур, який може мати судно, щоб воно могло безпечно плавати над морськими мінами."
 recon_drones: "Розвідувальний дрон"
 recon_drones_desc: "Безпілотний літальний апарат (БПЛ), відомий як дрон, - це літальний апарат без пілота, екіпажу чи пасажирів. Спочатку БПЛА були розроблені для виконання військових завдань у XX столітті, занадто \"Зануда, брудна чи небезпечна\" Військово-морські держави розробляли свої власні безпілотні літальні апарати з фіксованим крилом або вертольоти для виконання завдань розвідки і протилодичної війни."
 optical_landing_system: "Оптична система посадки"
 optical_landing_system_desc: "Оптична система посадки (СП) використовується для передачі інформації про глісісад пілотам у термінальній фазі посадки на літак. Зазвичай, вона контролюється комп’ ютером і є більш ефективною та надійною, ніж людина."
 airborne_early_warning: "Літак завчасного попередження"
 airborne_early_warning_desc: "Для розширення можливостей надводного флоту по перехоплюванню і обмеження зони ураження Авіаносці, створені після Другої світової війни, були обладнані літаками РП, які мають сучасну систему радіолокації і стеження. Його бортова радіолокаційна система була створена для виявлення літаків, кораблів, транспортних засобів, ракет та інших підлітчих снарядів на великих відстанях, а також для управління бойовим простором в повітряному бою шляхом ударів винищувачів і штурмовиків."
 iff_device: "Пристрій Свій-Чужий"
 iff_device_desc: "Ідентифікація (IFF) — це система ідентифікації, призначена для командування і керування. В ній використовується транспондер, який прослуховує сигнал опитування, а потім посилає відповідь, ідентифікуючий передавача. Вперше вона була розроблена під час війни, з появою радара і декількох інцидентів, пов'язаних з дружнім вогнем."
 tactical_air_navigation_system: "Тактична система повітряної навігації"
 tactical_air_navigation_system_desc: "Тактична аеронавтаційна система, яку зазвичай називають абревіатурою TACAN, — це навігаційна система, якою користуються військові літаки. Вона надає користувачеві пеленг і відстань (наклонну відстань або гіпотенузу) до наземної або корабельної станції."
 sub_nuclear_engine: "Ядерний реактор підводного човна"
 sub_nuclear_engine_desc: "Концептуальне проектування першої атомної підводної човна почалося наприкінці 1940-х, коли розвиток ядерних технологій дозволив встановлювати на таких платформах, як підводні човни, більш компактні Енергетична станція. За допомогою реактора з водою під тиском підводні човни могли забезпечити нескінченну дальність дій, що робило час занурення теоретично вічним."
 wire_guided_torpedo: "Торпеда з дротовим наведенням"
 wire_guided_torpedo_desc: "Торпеда з дротовим наведенням - це торпеда, яка контролюється за допомогою сигналів, які їй по тонких проводах, з'єднаних між торпедою і механізмом наведення, який знаходиться десь поруч з місцем запуск."
 sonar_telephone: "Сонар ближнього радіуса дії"
 sonar_telephone_desc: "Підводний телефон використовується на всіх підводних апаратах з екіпажем і на багатьох надводних кораблях ВМС, які перебувають в експлуатації. Голос або звук (азбука Морзе), які передаються через гідролокаційну систему, гетеродинуються до високого тону для акустичної передачі через воду, що дозволяє здійснювати зв’язок між підводними човнами на Малі відстані."
 hydrocooling_battery: "Акумулятор з гідроохолодженням"
 hydrocooling_battery_desc: "Здатність підводного човна працювати під водою і повертатися на поверхню значною мірою зумовлена наявністьм великого блоку свинцево-кислутних акумуляторів, які вимагали майже постійної уваги з боку екіпажу З умовною системою гідроохолодження акумуляторна батарея може працювати довше, а це збільшує її тривалість."
 rescue_submarine: "Рятівний підводний човен"
 rescue_submarine_desc: "Рятівний підводний човен (DSRV) іноді називають підводним рятувальним апаратом (DSRV). Він має напірний корпус з внутрішнім простором, який дозволяє перевезти кілька вижилих, і здатний зачепитися за аварійний люк підводного човна і відскакувати воду з простору між люками."
 
 
 # doctrine
 TITLE_FLEET_IN_BEING: "Остаточний бій"
 TITLE_TRADE_INTERDICTION: "Рейдерство"
 TITLE_BASE_STRIKE: "Повітряно-морські операції"
 cat_fleet_in_being: "Доктрина вирішальної битви"
 cat_trade_interdiction: "Доктрина рейдерства"
 cat_base_strike: "Доктрина повітряно-морських операцій"
 FLEET_IN_BEING_DESC: "Рішення бою спрямоване на збереження присутності і залякування противника захисною позицією, але він намагається знищити ворожий флот в одній битві, коли настане відповідний момент."
 TRADE_INTERDICTION_DESC: "Рейди націлені на торговельні судна, щоб послабити економіку та воєнне виробництво ворога, і зазвичай пасивні у забезпеченні панування на морі."
 BASE_STRIKE_DESC: "Доктрина повітряно-морських операцій передбачає, що перевагу в повітрі є ключем до успіху на морі, тому безпека повітря важливіша за всі інші фактори."
 fast_battleship_primacy: "Первенство швидких лінз"
 fast_battleship_primacy_desc: "Флот лінкорів, який має одну високу швидкість і універсальні властивості, може впоратися з будь - яким завданням на морі.\n\n"
 scouting_fleet_primacy: "Первенство розвідувального флоту"
 scouting_fleet_primacy_desc: "Переваги швидкохідних лінкорів надто перебільшені, тоді як традиційне розділення праці на лінкори та крейсера виявило свою економність і ефективність.\n\n"
 torpedo_groups: "Торпедні групи"
 torpedo_groups_desc: "Головна мета наших кораблів - виводити ворожі флоти торпедами і зрештою порушити їх будівельний проект, щоб забезпечити нам сприятливу ситуацію."
 decisive_battle: "Військове зіткнення флоту"
 decisive_battle_desc: "Коли настане відповідний момент, наш флот, виґрунтований повітряними й сухопутними силами, зробить вилазку, щоб знищити ворога в одній вирішальній битві."
 armed_merchantmen: "Озброєні торговими суднами"
 armed_merchantmen_desc: "Військові торговельні судна будуть добре споряджені проти нестримного підводного та підводного підводного підводного флоту, щоб захищати конвой без ескортних кораблів."
 submarine_picket: "Пікет підводних човнів"
 submarine_picket_desc: "Організація підводних човнів поблизу ворожих портів та інших ключових точок дозволить нам шпигувати за рухами ворожого флоту, навіть не помічаючи цього."
 submarine_picket_bs: "Пікет підводних човнів"
 submarine_picket_bs_desc: "Організація підводних човнів поблизу ворожих портів та інших ключових точок дозволить нам шпигувати за рухами ворожого флоту, навіть не помічаючи цього."
 coastal_operations: "Прибережні операції"
 coastal_operations_desc: "Хоча підводні човни легше виявити на мілководді, група таких суден все одно буде представляти достатню загрозу для військово-морських і десантних операцій біля нашого узбережжя.\n\n"
 ambush_tactics: "Тактика засідка"
 ambush_tactics_desc: "Якщо ви використовуєте підводні човни в засідках та мінних постановках, то можете швидше потопити ворожі кораблі."
 tonnage_war: "Війна за тунелів"
 tonnage_war_desc: "Ключ до паралізації військового потенціалу країни лежить у знищенні її торгових конвоюв, знищивши кораблі швидше, ніж оборонці можуть замінити їх, ми одержимо перемогу в цій війні на виснаження."
 guerrilla_tactics: "Партизанська тактика"
 guerrilla_tactics_desc: "Замість того щоб контролювати море, ми повинні твердо дотримуватися стратегії бей і бігу, поки ворог знайде уламки корабля, наші кораблі вже будуть далеко."
 adjacent_projection: "Проекція прилеглої потужності"
 adjacent_projection_desc: "Оскільки кораблі розкидані по океанах, нам також важливо залишатися непереконливими у своїй сфері впливу."
 naval_concealment: "За маскуванням"
 naval_concealment_desc: "Флот не повинен виставляти себе напоказ ні за яких обставин, але коли він це зробить, це буде кінець нашому ворогу."
 carrier_task_forces: "Флот вище повітря"
 carrier_task_forces_desc: "Авіаносець - це не тільки ядро флоту, але й найважливіший об'єкт війни, його знищення завжди стоїть на першому місці.\n\n"
 naval_air_force: "Повітря вище від флоту"
 naval_air_force_desc: "Хоча це і не є загальноприйнятим, забезпечення вищості повітря за допомогою літаків наземного базування великої дальності є основою перемоги на морі.\n\n"
 frequent_air_raid: "Часті повітряні нальоти"
 frequent_air_raid_desc: "Принцип морського бою полягає у знищенні ворожих авіаносців і збереженні своїх, посилка повітряних рейдів відносно меншою групою і з більшою частотою може задовольнити обидві ці завдання."
 mass_air_raid: "Масований повітряний наліт"
 mass_air_raid_desc: "Авіаносець - це просто плавучий аеродром на морі, а найбільшу загрозу для надводного флоту становлять літаки. Масований повітряний наліт з аеродром, щоб вивести з ладу ворожі авіаносці, більш ніж достатений для підтримки наших операцій."
 flight_deck_management: "Керування літаючою палубою"
 flight_deck_management_desc: "Незважаючи на фіксовану пропускну здатність, грамотне управління злітними операціями дозволить підняти ефективність вильотів літаків, що побудовані на авіаносцях, на новий рівень і зробити роботу авіаносців Давай."
 circle_formation: "Кругове побудова"
 circle_formation_desc: "Якщо флот зосереджений на операціях з авіаносцями, нам потрібні лише два види кораблів - авіаносців і ескорт. Кругова побудова захищатиме літак у центрі перехресного вогню з з зенітних кораблів усіх кораблів."
 circle_formation_desc: "Якщо флот зосереджений на операціях з авіаносцями, нам потрібні лише два види кораблів - самі авіаносці і ескорт. Кругова терапевтація захищатиме літак у центрі перехресного вогню з з зенітних кораблів усіх кораблів."

