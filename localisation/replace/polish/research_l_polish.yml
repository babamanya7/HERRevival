 # support tech extension
 unmanned_gun_turret: "Орудійна вежа з дистанційним керуванням"
 unmanned_gun_turret_desc: "До 1950-го року гарматні вежі ставали дедалі безпілотними, а керування структурною гарматою здійснювалося дистанційно з центру управління кораблям з використанням даних від радарів та інших джерел."
 modern_generic_battery: "Морська автоматична артилерійська система"
 modern_generic_battery_desc: "\"SjöAutomatKanon\" (SAK), або Naval Automatic Gun System, - автоматична система подвійного призначення, розроблена шведськими військовими відразу після Другої світової війни. Революція у реактивній технології призвела до значного збільшення швидкості літаків наприкінці війни, коли реактивний літак міг летіти зі швидкістю 1000 кілометрів за годину, що робило протиповітряну зброю неефективним проти нього. і скорострільним гарматам може випустити достатньо снарядів за короткий час, щоб забезпечити їх."
 coldwar_ship_torpedo_launcher: "Тріумф у час холодної війни"
 coldwar_ship_torpedo_launcher_desc: "Через зростаючу силу і швидкість підводних човнів торпеди після Другої світової війни отримали вдосконалені боєголовки і більш досконалі двигуни.\n\nВстановлення цього модуля на §YЛегкі кораблі§! або §YКрейсера§! дозволяє ворожим ворогам завдати великої шкоди §YВеликі кораблі§!"
 missile_submarine: "Підводний човен з крилатими ракетами"
 missile_submarine_desc: "Ракети з радіоуправленням, розроблені наприкінці війни, вважалися родоначами сучасних крилатих ракет, здатні долати великі відстані на дозвукову швидкість і порабувати наземні та морські цілі з високою Точнісінько. При відповідній доробітки військово-морським архітекторам вдалося досягти того, що підводні човни можуть нести і запускати крилаті ракети (КРМБ, складаються з крилатих ракет наземного базування і протикорабельних ракета) в якості основного озброєння."
 wake_homing_torpedo: "Самовладний торпед"
 wake_homing_torpedo_desc: "Хвиля - це область обуреного потоку нижче за течією від твердого тіла, що рухається в рідини, викликана обтіканням рідини навколо тіла. Військово-морські інженери використовували це явище і винайшли техніку наведення, засновану на траєкторії слідів, що стоять за ціллю. Торпеда з системою самонаведення по хвилях буде випущена так, щоб пройти за кормою цілі і пошкодити її силі та рульове управління."
 proximity_detonator: "Безконтактний вибухівець"
 proximity_detonator_desc: "Торпеда, оснащена вибухом іншої дії, може бути вибухнена безпосередньо під києм корабля-цілу, і в результаті вибуху утворюється газовий міхур, який може пошкодити киль або обшивку мети. Однак найбільш руйнівною частиною вибуху є підйомна сила газового міхура, який піднімає корпус судна у воду. Структура корпусу розрахована на опір тискові вниз, а не вгору, тому на цій стадії корпус зазнає сильних деформацій."
 
 improved_ship_torpedo_launcher: "Покращений торпедний апарат"
 advanced_ship_torpedo_launcher: "Комп’ютерний торпед"
 modern_ship_torpedo_launcher: "Сучасний торпедний апарат"
 
 oxygen_torpedo: "Торпеда зі стиснутим киснем"
 oxygen_torpedo_desc: "Кількість палива, яке може спалювати моторний двигун, обмежена кількістю кисню, який він може перевозити. Оскільки стиснуте повітря містить лише 21% кисню, то в кисневій торпеді використано чистий стиснутий кисень замість стиснутого повітря, і за своїми властивостями він не поступався жодній сучасній торпеді, У озброєнні.\n\n"
 electric_torpedo: "Електрична торпеда"
 electric_torpedo_desc: "Замість того щоб залишати за собою легко виявлений слід з бульбашок, торпеда з електричним двигуном залишається практично невидимою до тих пір, поки не потрапить у ціль. Це також означає, що не залишається сліду, який веде до стартуючого підводного човна.\n\n"

 tactical_data_link: "Тактичний канал даних"
 tactical_data_link_desc: "Тактичний канал передачі даних використовує стандартний канал для передачі даних за допомогою радіохвилі або кабелів. Всі військові системи C3 використовують стандартизований канал передачі даних для передачі, ретрансляції і прийому тактичних даних, що робить передачу даних між дружніми підрозділами безпечною і Це ефективно.\n\n§ПЯкщо ваші союзники отримають доступ до вашого каналу передавання даних, вони не зможуть дослідити свій власний аналог.§!"
 tactical_data_link_for_member: "Доступ до тактиичного каналу передачі даних союзників"
 tactical_data_link_for_member_desc: "Тактичний канал передачі даних використовує стандартний канал для передачі даних за допомогою радіохвилі або кабелів. Всі військові системи C3 використовують стандартизований канал передачі даних для передачі, ретрансляції і прийому тактичних даних, що робить передачу даних між дружніми підрозділами безпечною і Це ефективно."
 signal_control: "Коригування електромагнітного сигналу"
 signal_control_desc: "Коли на борту з’являлося дедалі більше електронних пристроїв, рух кораблів став прозорим для обох сторін. Було прийнято положення про електромагнітні сигнали, щоб забезпечити роботу всіх пристроїв на стандартизованому частоті і зробити флот електронно невидимим."
 advanced_radar_finder: "Радіолокаційний шукач"
 advanced_radar_finder_desc: "Радар - це пристрій, який випромінює радіохвилі для визначення відстані, напрямку і швидкості об'єкта відносно об'єкта. Радіолокатор використовує цю функцію і визначає напрямок до джерела радіосигналу за допомогою декількох пеленгаційних антен шляхом триангуляції."
 close_in_area_air_defense: "Протипожежна охорона"
 close_in_area_air_defense_desc: "Під час Другої світової війни військово-морський флот часто стикався з повітряними погрозами від літаків-смертників і крилатих ракет з радіоуправленням. З відновленням і модернізацією есмінців воєнного часу вони стануть останнім бар'єром проти цієї загрози."
 wave_resistance_design: "Конструкція з хвилями опору"
 wave_resistance_design_desc: "Великі хвилі у відкритому морі були найбільшою проблемою для човнів за останні кілька століть, особливо для легких суден, як - от есмінці. Якщо використовувати тонку носову частину з більш гострим кутом нахилу, яка плавніше відводить хвилю в бік, кількість енергії, необхідної для витіснення води, буде менше, що дозволить судну рухатися стало стійко."
 cryptography_revolution: "Революція в криптографії"
 cryptography_revolution_desc: "Завдяки безпрецедентній обчислювальній потужності комп'ютерів, що з'явилися після війни, криптографія досягла значних успіхів як в алгоритмах шифрування, так і в комунікаційних технологіях. Технічний прогрес, який зазвичай представлений електронними шифраторними машинами, вдосконаленими алгоритмами і технологією скачкоподібної перебудови частоти, практично досконалий з точки зору захисту військової Інформація."
 luneburg_lens: "Люнебурзька лінза"
 luneburg_lens_desc: "Люнебурзька лінза — це сферично симетрична лінза з градієнтним індексом, що може бути виготовлена для використання електромагнітного випромінювання від видимого світла до радіохвилі. Цей пристрій можна використовувати для виготовлення мікрохвильової антени. Порівняно з параболічною тарілкою антени з люнебурзькою лінзою має суттєвий привілей, що її можна контролювати, пересуваючи джерело живлення навколо лінзи, без необхідності Повертати всю антену повністю."

 converted_super_heavy_carrier: "Переобладнання надтяжчого авіаносця"
 advanced_missile_system: "Ракета з активною радіолокаційною головкою самонаведення"
 advanced_missile_system_desc: "Післявоєнна революція в електроніці дозволила створити систему наведення меншого розміру. Технологія активного радіолокаційного самонаведення дозволяє ракеті озброїтися прийомом радара і електронікою, необхідною для автономного пошуку і відслідковування мети, що стало прототипом більш пізніших технології "Вистрелив і забув"."

 heavy_armor_research_tt: "§HПрорив у області важкої броні у свою чергу принесе користь дослідникам броні крейсера.§!"
 cruiser_armor_research_tt: "§HПрорив у області броні крейсера принесе користь пошукам у великій броні.§!"