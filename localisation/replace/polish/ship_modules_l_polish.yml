 carrier_ship_engine_3_diesel_desc:0 "Двигун, розроблений для того, щоб дозволити навіть великим авіаносцям рухатися на дуже високих швидкостях."
 carrier_ship_engine_4_diesel_desc:0 "Цю силу було розроблено для сучасного обладнання. «Швидкий літак», призначеного для виконання функцій центрального елементу авіаносної групи."
