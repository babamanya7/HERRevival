 ship_heavy_battery_1_triple_desc:0 "Крупнокаліберна гармата, випущена до Великої війни."
 ship_heavy_battery_2_triple_desc:0 "Комплект величезних гармат у погано захищеній установці, яка дала змогу збільшити висоту гармати, збільшуючи дальність стрільби."
 ship_heavy_battery_3_triple_desc:0 "Слабкості виробництва для важких гармат, включаючи нові технології, щоб збільшити точність і швидкість стрільби."
 ship_heavy_battery_4_triple_desc:0 "Ця критична установа, результатом еволюції тяжкої вогненної сили, забезпечує високу точність на великих дистанціях."
 ship_heavy_battery_1_quad_desc:0 "Крупнокаліберна гармата, випущена до Великої війни."
 ship_heavy_battery_2_quad_desc:0 "Комплект величезних гармат у погано захищеній установці, яка дала змогу збільшити висоту гармати, збільшуючи дальність стрільби."
 ship_heavy_battery_3_quad_desc:0 "Слабкості виробництва для важких гармат, включаючи нові технології, щоб збільшити точність і швидкість стрільби."
 ship_heavy_battery_4_quad_desc:0 "Ця критична установа, результатом еволюції тяжкої вогненної сили, забезпечує високу точність на великих дистанціях."

 ship_super_heavy_battery_2:0 "46-м гармата"
 ship_super_heavy_battery_2_short:0 "Зручна 46-см гармата"
 ship_super_heavy_battery_2_desc:0 "Удосконалена версія 18-дюймового знаряддя, здатна стріляти більш потужними снарядами."
 ship_super_heavy_battery_2_triple:0 "46-м гармата"
 ship_super_heavy_battery_2_triple_short:0 "Будована 46-см гармата"
 ship_super_heavy_battery_2_triple_desc:0 "Удосконалена версія 18-дюймового знаряддя, здатна стріляти більш потужними снарядами."
 ship_super_heavy_battery_2_quad:0 "46-м гармата"
 ship_super_heavy_battery_2_quad_short:0 "Зчетвержена 46-см гармата"
 ship_super_heavy_battery_2_quad_desc:0 "Удосконалена версія 18-дюймового знаряддя, здатна стріляти більш потужними снарядами."

 ship_secondaries_3:0 "127мм РФ. Пушка (башню)"
 ship_secondaries_3_short:0 "Вторинна батарея III"
 ship_secondaries_3_desc:0 "Новий тип допоміжної батареї, розроблений на базі ГК есмінців, розміщеній у вежі."
 ship_secondaries_4:0 "152мм РФ. Пушка (башню)"
 ship_secondaries_4_short:0 "Вторинна батарея IV"
 ship_secondaries_4_desc:0 "Під кінець війни було розроблено допоміжну батарею великого калібру, по вогневій могутності близька до того, що використовували на легких крейсерах."

 ship_smoke_generator:0 "Генератор диму"
 ship_smoke_generator_short:0 "Генератор диму"
 ship_smoke_generator_desc:0 "Модифікація двигунів дозволяє кораблям виробляти багато диму."
 ship_radar_jammer:0 "Випромінювання перешкод"
 ship_radar_jammer_short:0 "Радар-глушник"
 ship_radar_jammer_desc:0 "Випромінювання перешкод, які часто працюють на радарі ворога."
 ship_mast_1:0 "Матехнічний пункт"
 ship_mast_1_short:0 "Кола"
 ship_mast_1_desc:0 "Мічта працює як спостерігач і дозволяє спостерігати за падінням пострілів, а також містить обладнання для керування вогнем, як-от далекоміри."
 ship_torpedo_fire_control:0 "СУО торпеди"
 ship_torpedo_fire_control_short:0 "СУО торпеди"
 ship_torpedo_fire_control_desc:0 "Навідувач торпедів — приціл для стрільби торпедами, більший від налаштованого прицілу."
 ship_bulbous_bow:0 "Сонар"
 ship_bulbous_bow_short:0 "Сонар"
 ship_bulbous_bow_desc:0 "Виступна лампочка на носі корабля трохи нижче ватерлінії з гідролокатором всередині."
 ship_aa_fire_control:0 "Передречений Керрісон"
 ship_aa_fire_control_short:0 "Протипожежний передбачувач"
 ship_aa_fire_control_desc:0 "Система управління вогнем для автоматизації наведення зенітніх гармат."
 ship_electric_motor:0 "Сильна установа з турбоелектропривідом"
 ship_electric_motor_short:0 "Електричний двигун"
 ship_electric_motor_desc:0 "Електрична машина, яка перетворює електричну енергію в механічну, запускається в рух турбіни з використанням не тільки силових установок, але й силових агрегатів."

 eng_14in_mk7_double:0 "BL 14-дюймовий Mk VII"
 eng_14in_mk7_double_short:0 "Подвоєння BL 14-дюймова Mk VII"
 eng_14in_mk7_double_desc:0 "Стандартне важке знаряддя середнього калібру."
 eng_14in_mk7_quad:0 "BL 14-дюймовий Mk VII"
 eng_14in_mk7_quad_short:0 "Порахована BL 14-дюймова Mk VII"
 eng_14in_mk7_quad_desc:0 "Стандартне важке знаряддя середнього калібру."

 ship_light_weight_shell:0 "Легкий бронебійний снаряд"
 ship_light_weight_shell_short:0 "Легкий ББ снаряд"
 ship_light_weight_shell_desc:0 "Легкі бронебійні снаряди мають вищу початкову швидкість і прискорюють перезарядку, але в бою на віддалених дистанціях вони набувають більшого опору, що призводить до рикошету."
 ship_super_heavy_weight_shell:0 "Свердлий бронебійний снаряд"
 ship_super_heavy_weight_shell_short:0 "Сверхтяжний ББ"
 ship_super_heavy_weight_shell_desc:0 "Надгробний снаряд, вага якого перевищує 20% у порівнянні з звичайними. Він повільніший і складніший у прицілі, але при потраплянні він завдає великої шкоди."
 ship_high_velocity_shell:0 "Високошвидкісний бронебійний снаряд"
 ship_high_velocity_shell_short:0 "Високошвидкісний ББ"
 ship_high_velocity_shell_desc:0 "Замість того щоб зменшувати масу швидкісних снарядів, порох вимагає більше пороху, щоб він досягнув високої швидкості під час пострілу, а це може викликати тиск на стовбури."
 ship_anti_air_shell:0 "Запалювання снаряда"
 ship_anti_air_shell_short:0 "Протипожежний снаряд"
 ship_anti_air_shell_desc:0 "Комбінація запалювальних і фугасних снарядів, стріляє з основного знаряддя, але має низьку точність."
 ship_vt_shell:0 "Протипожежний снаряд з неконтактним вибухом"
 ship_vt_shell_short:0 "Протипожежний снаряд (запобіжник VT)"
 ship_vt_shell_desc:0 "Тип зенітного снаряда з вибухом, який автоматично приводить в дію вибуховий пристрій при наближенні до цілі на певну відстань."

EQ_MOD_CAT_submarine_miscellaneous_TITLE: "Підводний човен Різне"
 crewed_torpedo: "Підлеглий торпед"
 crewed_torpedo_short: "Підлеглий торпед"
 crewed_torpedo_desc: "Штучний торпеди, який веде водолаз, зазвичай з фугасною боєголовкою."
 oxygen_generator: "Хімічний генератор кисню"
 oxygen_generator_short: "Створення кисню"
 oxygen_generator_desc: "Пристрій, встановлений на підводному човні, який виділяє кисень внаслідок хімічної реакції."
 diving_plane: "Рулі керування"
 diving_plane_short: "Рулі керування"
 diving_plane_desc: "Рулі керування - це керує поверхні на підводному човні, які дозволяють судну нахиляти ніс і корму вгору або вниз, щоб допомогти в процесі занурення або спалахи човна, а також контролювати глибину занурення."
 vlf_receiver: "Приймач дуже низьких частот"
 vlf_receiver_short: "ВІНЧ-приємник"
 vlf_receiver_desc: "Радіохвилі дуже низької частоти використовуються для зв’язку з підводними човнами, коли вони перебувають під водою."

