 sub_ship_periscope_2_desc:0 "Оптичне обладнання, яке використовують на підводних човнах для спостереження за поверхнею."
 sub_ship_periscope_3:0 "Перископ III"
 sub_ship_periscope_3_short:0 "Сучасний Перископ"
 sub_ship_periscope_3_desc:0 "Оптичне обладнання, яке використовують на підводних човнах для спостереження за поверхнею."

 pressure_hull_1:0 "Тривимірний корпус I"
 pressure_hull_1_short:0 "Тривимірний корпус I"
 pressure_hull_1_desc:0 "Прості корпуси захищають підводний човен від тиску води і визначають глибину занурення."
 pressure_hull_2:0 "Тривимірний корпус II"
 pressure_hull_2_short:0 "Тривимірний корпус II"
 pressure_hull_2_desc:0 "Прості корпуси захищають підводний човен від тиску води і визначають глибину занурення."
 pressure_hull_3:0 "Тривимірний корпус"
 pressure_hull_3_short:0 "Тривимірний корпус"
 pressure_hull_3_desc:0 "Прості корпуси захищають підводний човен від тиску води і визначають глибину занурення."
 pressure_hull_4:0 "Тривимірний корпус IV"
 pressure_hull_4_short:0 "Тривимірний корпус IV"
 pressure_hull_4_desc:0 "Прості корпуси захищають підводний човен від тиску води і визначають глибину занурення."

 sub_battery_1:0 "203-ммм гармата"
 sub_battery_1_short:0 "Батарея підліки"
 sub_battery_1_desc:0 "Орудіє крейсерського рівня, встановленого на підводному човні без вежі."

 ship_sonar_3:0 "Буксирувана сонарна антена"
 ship_sonar_3_short:0 "Буксируваний сонар"
 ship_sonar_3_desc:0 "Буксований сонар також відомий як вираз змінної глибини, він може працювати на великих глибинах, щоб уникнути перешкод від шуму суден."

 ship_missile_1:0 "Радіоконтрольована протикорабельна ракета"
 ship_missile_1_short:0 "Протилежна ракета"
 ship_missile_1_desc:0 "Протилежна ракета з радіоуправленням має високу швидкість і може завдати великої шкоди."
 ship_missile_aa_1:0 "Ракета класу «Земля-повітря»"
 ship_missile_aa_1_short:0 "Ракета «Земля-повітря»"
 ship_missile_aa_1_desc:0 "Зенітна ракета може забезпечити вищу точність поразки літаків."

 ship_scheme_incremental:0 "Інкрементна схема"
 ship_scheme_incremental_short:0 "Інкрементна схема"
 ship_scheme_incremental_desc:0 "Схема броні, розроблена після російсько-японської війни, яка закриває велику площу від скорострільних гармат."
 ship_scheme_incremental_post_jutland:0 "Пост-Ютландська схема"
 ship_scheme_incremental_post_jutland_short:0 "Пост-Ютландська схема"
 ship_scheme_incremental_post_jutland_desc:0 "Схема перехідної броні, розроблена невдовзі після Ютландської битви з деякими покращеннями палубної броні."
 ship_scheme_mixed:0 "Смішна схема"
 ship_scheme_mixed_short:0 "Смішна схема"
 ship_scheme_mixed_desc:0 "Смішна схема, запозичена з ідеї броні «все або нічого»Це компромісний проект, який був винайдений наприкінці 1910-х років і який також читає захист другорядних ділянок."
 ship_scheme_all_or_nothing:0 "Схема «Все або нічого»"
 ship_scheme_all_or_nothing_short:0 "«Все або нічого»"
 ship_scheme_all_or_nothing_desc:0 "Схема «Все або нічого» Це вимагає інтенсивного бронювання найвагоміших для корабля областей, в той час як решта корабля не отримує броні."
 ship_scheme_all_or_nothing_armor_box:0 "Схема «Все або нічого» (з коробкою вторинної броні)"
 ship_scheme_all_or_nothing_armor_box_short:0 "Схема «Все або нічого» (з коробкою вторинної броні)"
 ship_scheme_all_or_nothing_armor_box_desc:0 "Удосконалена схема «Все або нічого» посилює другорядні області додатковими броневими ящиками."
 torpedo_bulge:0 "Протиторпедний буль"
 torpedo_bulge_short:0 "Протиторпедний буль"
 torpedo_bulge_desc:0 "Торпедний буль являє собою частково заповнений водою відсік-спонсон по обидві сторони корпусу корабля, призначені для детонації торпед, поглинання їх вибухів і стримування затоплення пошкоджених ділянок всередині булей."
 torpedo_belt:0 "Протилежний пояс"
 torpedo_belt_short:0 "Протилежний пояс"
 torpedo_belt_desc:0 "Протилежний пояс складається з декількох легкобронованих відсіків, які простягаються вздовж вузького поясу, що перетинав корабель."
 pugliese_system:0 "Система Паглізе"
 pugliese_system_short:0 "Система Паглізе"
 pugliese_system_desc:0 "Паглуз — це компонент підводного захисту, розроблений на основі гідродинаміки і здатний поглинути більшість енергії підводного вибуху."
 torpedo_belt_enhanced:0 "Покращений протиторпедний пояс"
 torpedo_belt_enhanced_short:0 "Комплексна система протиторпедного захисту"
 torpedo_belt_enhanced_desc:0 "Велика кількість водонепроникних відсіків і товста броня дозволяють протистояти більшості підводних вибухів."


 ship_light_battery_1_double_desc:0 "Про маленьку гармату, яку використовують на есмінцях та невеликих кораблях."
 ship_light_battery_2_double_desc:0 "Невелика з механізована установа, яка дозволяє швидко вразити ціль."
 ship_light_battery_3_double_desc:0 "Невеликі щити для захисту екіпажу від осколків та суворих погодних умов."
 ship_light_battery_4_double_desc:0 "Пара маленьких інструментів у механізованому бронізованому встановленні."
 ship_heavy_battery_1_triple_desc:0 "Крупнокаліберна гармата, випущена до Великої війни."
 ship_heavy_battery_2_triple_desc:0 "Комплект величезних гармат у погано захищеній установці, яка дала змогу збільшити висоту гармати, збільшуючи дальність стрільби."
 ship_heavy_battery_3_triple_desc:0 "Слабкості виробництва для важких гармат, включаючи нові технології, щоб збільшити точність і швидкість стрільби."
 ship_heavy_battery_4_triple_desc:0 "Ця критична установа, результатом еволюції тяжкої вогненної сили, забезпечує високу точність на великих дистанціях."
 ship_heavy_battery_1_quad_desc:0 "Крупнокаліберна гармата, випущена до Великої війни."
 ship_heavy_battery_2_quad_desc:0 "Комплект величезних гармат у погано захищеній установці, яка дала змогу збільшити висоту гармати, збільшуючи дальність стрільби."
 ship_heavy_battery_3_quad_desc:0 "Слабкості виробництва для важких гармат, включаючи нові технології, щоб збільшити точність і швидкість стрільби."
 ship_heavy_battery_4_quad_desc:0 "Ця критична установа, результатом еволюції тяжкої вогненної сили, забезпечує високу точність на великих дистанціях."
 ship_medium_battery_1_double_desc:0 "Хоча це середнє знаряддя не здатне завдати великого удару лінкорам, воно дає важкій крейсеру з упевненістю вдарити легші кораблі та інші крейсери."
 ship_medium_battery_2_double_desc:0 "Це знаряддя, яке розвивалось раніше, було створене з урахуванням збільшення броні та збільшення дальності ведення морських боїв."
 ship_medium_battery_3_double_desc:0 "Хоча це не найбільша зброя, яку можна встановити на крейсері, вона забезпечує оптимальний баланс між вагою зброї та вогнем і може гарантовано пробити крейсерську броню."
 ship_medium_battery_4_double_desc:0 "Калибр обмежений запасами боєприпасів і розрахований на модернізацію старих кораблів. Цей інструмент оснащено удосконаленою системою автоматичного заряду, яка значно збільшує швидкоплинність."
 ship_light_medium_battery_1_double_desc:0 "Компроміс між швидкострільністю і вагою снаряда, призначений для використання на легких крейсерах для ураження малих кораблів."
 ship_light_medium_battery_2_double_desc:0 "Це знаряддя є логічним розвитком попередніх моделей і призначений для того, щоб легені крейсера мали значні переваги у вогняній могутності над есмінцями і старими крейсерами."
 ship_light_medium_battery_3_double_desc:0 "Завдяки новим технологіям ця легкобронна установа збільшує розрив між головними батарями есмінців і легких крейсерів."
 ship_light_medium_battery_4_double_desc:0 "Спроектована з нуля для забезпечення високої швидкострільності, ця установка була створена для того, щоб легені крейсера могли виводити з ладу навіть більших противників за допомогою безлічі влучань."
 ship_medium_battery_4_double_desc:0 "Оскільки калібр обмежено існуючими запасами боєприпасів, а також з огляду на можливість модернізації старих кораблів, нове знаряддя оснащене удосконаленою системою автоматичного заряду, що дозволяє Це значно пришвидшує темп життя."
 ship_light_medium_battery_1_single_desc:0 "Компроміс між швидкострільністю і вагою снаряда, призначений для використання на легких крейсерах для ураження малих кораблів."
 ship_light_medium_battery_2_single_desc:0 "Це знаряддя є логічним розвитком попередніх моделей і призначений для того, щоб легені крейсера мали значні переваги у вогняній могутності над есмінцями і старими крейсерами."
 ship_light_medium_battery_3_single_desc:0 "Завдяки новим технологіям ця легкобронна установа збільшує розрив між головними батарями есмінців і легких крейсерів."
 ship_light_medium_battery_4_single_desc:0 "Спроектована з нуля для забезпечення високої швидкострільності, ця установка була створена для того, щоб легені крейсера могли виводити з ладу навіть більших противників за допомогою безлічі влучань."
 ship_super_heavy_battery_1_triple_desc:0 "Ці масивні гармати були розроблені так, щоб пробивати будь-яку броню на жодній відстані."
 ship_super_heavy_battery_1_quad_desc:0 "Ці масивні гармати були розроблені так, щоб пробивати будь-яку броню на жодній відстані."
 ship_medium_battery_1_single_desc:0 "Хоча це середнє знаряддя не здатне завдати великого удару лінкорам, воно дає важкій крейсеру з упевненістю вдарити легші кораблі та інші крейсери."
 ship_medium_battery_2_single_desc:0 "Це знаряддя, яке розвивалось раніше, було створене з урахуванням збільшення броні та збільшення дальності ведення морських боїв."
 ship_medium_battery_3_single_desc:0 "Хоча це не найбільша зброя, яку можна встановити на крейсері, вона забезпечує оптимальний баланс між вагою зброї та вогнем і може гарантовано пробити крейсерську броню."
 ship_medium_battery_4_single_desc:0 "Калибр обмежений запасами боєприпасів і розрахований на модернізацію старих кораблів. Цей інструмент оснащено удосконаленою системою автоматичного заряду, яка значно збільшує швидкоплинність."

