 heavy_ship_engine_4_diesel:0 "2100 л.с."
 heavy_ship_engine_2_diesel_desc:0 "Цей двигун, набагато потужніший за попередні моделі, призначений для того, щоб дати важкому кораблю комфортний запас швидкості порівняно зі старими зразками."
 heavy_ship_engine_3_diesel_desc:0 "Оскільки вага зброї і броні зростає, цей двигун був розроблений для того, щоб забезпечити вищі швидкості, щоб переслідувати ворогів, які втікають, або зберегти дистанцію від переважаних ворогів."
 heavy_ship_engine_4_diesel_desc:0 "Ця система, створена з використанням нових матеріалів і вдосконаленої конструкції котла, хоче, щоб сучасні лінкори не відставали від швидких авіаносців та крейсерів."
