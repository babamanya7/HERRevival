 light_ship_engine_4_diesel:0 "50000 л.с."
 light_ship_engine_2_diesel_desc:0 "За допомогою котлів високого тиску така ж вага і площа обладнання можуть забезпечити вищу продуктивність."
 light_ship_engine_3_diesel_desc:0 "Нові розробки в матеріалах дозволяють збільшити вихідну потужність."
 light_ship_engine_4_diesel_desc:0 "Покращена компону двигуна і редуктор турбіни забезпечують більшу ефективність при тій самій вазі."
