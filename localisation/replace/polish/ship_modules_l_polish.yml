 ship_light_battery_1_desc:0 "Малокаліберне знаряддя, яке використовують для есмінців та малих судів."
 ship_light_battery_2_desc:0 "Малокаліберний пристрій на платформі, що дозволяє швидко здійснити наведення на ціль."
 ship_light_battery_3_desc:0 "Малокаліберне знаряддя для захисту від осколків і негоди."
 ship_light_battery_4_desc:0 "Спарені малокаліберні знаряддя у броновані поворотної вежі."
 dp_light_battery_1_desc:0 "Малокаліберне знаряддя, яке може вести вогонь як по морських, так і наземних цілях, так і по авіації."
 dp_light_battery_2_desc:0 "Малокаліберне знаряддя для великого підвищення, яке може вести вогонь як по авіації, так і наземній цілі."
 dp_light_battery_3_desc:0 "Малокаліберний башт з великим підвищенням, який може вести вогонь як по авіації, так і по морській та наземній цілі."
 dp_light_battery_4_desc:0 "Малокаліберне знаряддя, яким керують вежі великого підвищення, здатне вести вогонь як по морських, так і наземних цілях, так і в авіаційних справах."
 ship_heavy_battery_1_desc:0 "Крупнокаліберне знаряддя, розроблене до Великої війни."
 ship_heavy_battery_2_desc:0 "За допомогою плетеної вежі можна збільшити кути підвищення, підвищивши ефектну дальність."
 ship_heavy_battery_3_desc:0 "Важка вежа з величезними знаряддями, розроблена з новими технологіями для підвищення точності та швидкострільності."
 ship_heavy_battery_4_desc:0 "Незрівнянна вогняна сила, важка вежа здатна вести вогонь з високою точністю на величезну відстань."
 ship_super_heavy_battery_1_desc:0 "Найбільші знаряддя, які коли-небудь встановлювалися на кораблі, здатні пробити майже будь-яку броню на будь-який пробіг."
 ship_light_medium_battery_1_desc:0 "Компроміс між швидкострільністю і вагою снаряда, за допомогою якого крейсери можуть працювати з невеликими кораблями."
 ship_light_medium_battery_2_desc:0 "Логічна еволюція колишньої епохи. і застарілі крейсери мають перевагу у вогняній могутності."
 ship_light_medium_battery_3_desc:0 "Ця легкобронована вежа з новими технологіями збільшує розрив у вогняній могутності між есмінцями і легкими крейсерами."
 ship_light_medium_battery_4_desc:0 "За допомогою орудійної башти легко крейсери можуть випорожнити навіть більші кораблі, виводячи їх з ладу безліч разів."
 dp_ship_medium_1:0 "152-м скорострільна універсальна батарея"
 dp_ship_medium_1_short:0 "Батарея легкого крейсера IV"
 dp_ship_medium_1_desc:0 "Орудійна башта принципово нова конструкція з великим кутом підвищення, дозволяє легкому крейсерам атакувати навіть більші кораблі та літаки."
 ship_medium_battery_1_desc:0 "Хоча ця зброя не може завдати серйозної шкоди лінкорам, вона загрожує іншим крейсерам та кораблям менших розмірів."
 ship_medium_battery_2_desc:0 "Подальший розвиток конструкції, що сприймає поліпшене бронювання потенційних цілей і вищі дистанції морських боїв."
 ship_medium_battery_3_desc:0 "Нехай це не найбільше знаряддя, яке можна встановити на крейсері, але воно є балансом між вагою та вогненною силою і без труднощів пробиває броню інших крейсерів."
 ship_medium_battery_4_desc:0 "Навіть з огляду на те, що збільшення калібру обмежено існуючими боєприпасами і потребою модернізації старих кораблів, новий інструмент може похвалитися сучасним зарядженням, радикально підвищуючий темп Стрілянини."
 ship_secondaries_1:0 "75-мм скорострельне знаряддя"
 ship_secondaries_1_short:0 "Допоміжна батарея I"
 ship_secondaries_1_desc:0 "Легенда, розміщена в кам’янистих камерах вздовж корабля, забезпечує певний захист від малих кораблів."
 ship_secondaries_2:0 "120-мм скорострельне знаряддя"
 ship_secondaries_2_short:0 "Допоміжна батарея II"
 ship_secondaries_2_desc:0 "Невелика вежа з швидкострельними знаряддями, що дозволяє великим кораблям вести вогонь по есмінцям і торпедних катерах."
 dp_ship_secondaries_1:0 "100-м універсальна допоміжна батарея"
 dp_ship_secondaries_1_short:0 "Універсальна допоміжна батарея I"
 dp_ship_secondaries_1_desc:0 "Об’єднавши здатність суворого зеніток і допоміжних знарядь у одній вежі, можна значно покращити ПВО корабля, за допомогою якого можна вести ефективний вогонь у малих судах."
 dp_ship_secondaries_2:0 "113-м універсальна допоміжна батарея"
 dp_ship_secondaries_2_short:0 "Універсальна допоміжна батарея II"
 dp_ship_secondaries_2_desc:0 "Розташовування додаткового знаряддя у вежі значно збільшує захист розрахунків."
 dp_ship_secondaries_3:0 "127-м універсальна допоміжна батарея"
 dp_ship_secondaries_3_short:0 "Універсальна допоміжна батарея III"
 dp_ship_secondaries_3_desc:0 "Усесвітня башта зі спарованим знаряддям дозволяє значно збільшити силу вогню"
 dp_ship_secondaries_4:0 "127-мм скорострільна універсальна допоміжна батарея"
 dp_ship_secondaries_4_short:0 "Універсальна допоміжна батарея IV"
 dp_ship_secondaries_4_desc:0 "Створені для швидкострільного вогню з усіх можливих цілей, найкраща з видів допоміжних знарядь."
 ship_fire_control_system_0:0 "Центральний далекомір"
 ship_fire_control_system_0_short:0 "Система управління вогнем 0"
 ship_fire_control_system_0_desc:0 "Корективщик, розміщений вгорі щогли, визначає відстань до мети і передає дані артилерійським розрахункам."
 ship_fire_control_system_1:0 "Керування вогнем"
 ship_fire_control_system_1_short:0 "Система управління вогнем I"
 ship_fire_control_system_1_desc:0 "Центральний пост управління вогнем забезпечує одночасний залпа всіх гармат за наказом командуючого офіцера."
 ship_fire_control_system_2:0 "Механічний прилад для обчислення"
 ship_fire_control_system_2_short:0 "Система управління вогнем II"
 ship_fire_control_system_2_desc:0 "Механічний вичислувач постійно перераховує дальність і мету на основі інформації, яка надходить від дальних та інших приладів."
 ship_fire_control_system_3:0 "Баллістичний обчисювач"
 ship_fire_control_system_3_short:0 "Система управління вогнем III"
 ship_fire_control_system_3_desc:0 "Більш складніші механічні підрахунки враховують велику кількість параметрів цілі при розрахунуванні вогняного рішення."
 ship_torpedo_1:0 "Три-труб. 450-ммм ТА"
 ship_torpedo_1_short:0 "Торпедний апарат I"
 ship_torpedo_1_desc:0 "Блок з торпед середнього розміру, який встановлюється на надводні кораблі."
 ship_torpedo_2:0 "4-труб. 450-ммм ТА"
 ship_torpedo_2_short:0 "Торпедний апарат II"
 ship_torpedo_2_desc:0 "Додавши додаткову трубу до торпедного апарата, можна збільшити ширину ураженої зони і збільшити ймовірність потрапити."
 ship_torpedo_3:0 "Три-труб. 533-ммм ТА"
 ship_torpedo_3_short:0 "Торпедний апарат III"
 ship_torpedo_3_desc:0 "Більші торпеди обладнані більш потужною боєголовкою, що надає більше урону цілі, а також доводиться жертвувати кількістю труб на апарат."
 ship_torpedo_4:0 "4-труб. 533-ммм ТА"
 ship_torpedo_4_short:0 "Торпедний апарат IV"
 ship_torpedo_4_desc:0 "У цій сучасній моделі вирішені всі механічні проблеми запуску великих торпед з надводних кораблів, а також значно прискорений процес заряду."
 ship_torpedo_sub_1:0 "4-труб. 450-ммм ТА"
 ship_torpedo_sub_1_short:0 "Торпедні апарати I"
 ship_torpedo_sub_1_desc:0 "Стандартний набір торпедних апаратів, які перезаряджаються зсередини підводності."
 ship_torpedo_sub_2:0 "6-труб. 450-ммм ТА"
 ship_torpedo_sub_2_short:0 "Торпеди II"
 ship_torpedo_sub_2_desc:0 "Збільшений торпедний сектор дозволяє розмістити більше торпедних апаратів і містить додаткові простір для персоналу бойової частини."
 ship_torpedo_sub_3:0 "4-труб. 533-ммм ТА"
 ship_torpedo_sub_3_short:0 "Торпедні апарати III"
 ship_torpedo_sub_3_desc:0 "Більші торпедні апарати дозволяють стріляти торпедами збільшеного калібру."
 ship_torpedo_sub_4:0 "6-труб. 533-ммм ТА"
 ship_torpedo_sub_4_short:0 "Торпедні апарати IV"
 ship_torpedo_sub_4_desc:0 "Завдяки електричним автоматам заряджання можна перезаряджати торпедні апарати за вираховані хвилини."
 ship_anti_air_1:0 "Кулемет кал. 50"
 ship_anti_air_1_short:0 "ПВО I"
 ship_anti_air_1_desc:0 "Кілька важких кулеметів дозволяють відбитися від літаків, що пролітають близько."
 ship_anti_air_2:0 "20-м установка ПВО"
 ship_anti_air_2_short:0 "ПВО II"
 ship_anti_air_2_desc:0 "Невелика автоматична гармата використовує більші боєприпаси, які достатньо для того, щоб знищити літак."
 ship_anti_air_3:0 "37-м установка ПВО"
 ship_anti_air_3_short:0 "ПВО III"
 ship_anti_air_3_desc:0 "Малокаліберні інструменти Продемонстрували нездатність безпечно збивати літаки раніше, ніж ті встигають на удар; більше калібр — більше знаряддя, але шанс знищити ціль першим потраплянням значно вищий."
 ship_anti_air_4:0 "40-мм чотири-сторінковий інструмент"
 ship_anti_air_4_short:0 "ПВО IV"
 ship_anti_air_4_desc:0 "Найновіші зразки зенітніх знарядь можуть супроводжувати швидкодію ціль завдяки силі пристрою, а просунутий СУО дозволяє фокусувати вогонь декількох розрахунків на одній меті."
 ship_mine_layer_1:0 "Напрямні для встановлення мін"
 ship_mine_layer_1_desc:0 "Модифікація надводного корабля для встановлення морських мін."
 ship_mine_sweeper_1:0 "Міні-тральне обладнання"
 ship_mine_sweeper_1_desc:0 "Оприлюднення, яке дозволяє використовувати мінні трали різних типів."
 ship_mine_layer_sub:0 "Труби для постановок мін"
 ship_mine_layer_sub_desc:0 "Модифікація корпусу субмарини, яка дозволяє виробляти постановку мін."
 ship_depth_charge_1:0 "Напрямні для глибинних бомб"
 ship_depth_charge_1_short:0 "Глибока бомба I"
 ship_depth_charge_1_desc:0 "Нахилні напрямні, по яких глибинні бомби стікають з корми корабля, коли він проходить над ціллю."
 ship_depth_charge_2:0 "Скидання глибинних бомб"
 ship_depth_charge_2_short:0 "Глубічна бомба II"
 ship_depth_charge_2_desc:0 "Цей пристрій використовує слабкий метальний заряд, щоб вистрілювати глибинні бомби на велику дистанцію і таким чином покривати велику площу."
 ship_depth_charge_3:0 "Протилежний бомбомет"
 ship_depth_charge_3_short:0 "Глибока бомба III"
 ship_depth_charge_3_desc:0 "Бомбомет вистрілює невеликі глибинні заряди з контактним вибухом, дозволяючи кораблю атакувати ціль, не втрачаючи акустичних контактів."
 ship_depth_charge_4:0 "Удосконалений протилодний бомбомет"
 ship_depth_charge_4_short:0 "Глибока бомба IV"
 ship_depth_charge_4_desc:0 "Удосконалена модель бомбомета може відправляти важчі заряди на велику дистанцію."
 ship_sub_snorkel_1:0 "Базовий шноркель"
 ship_sub_snorkel_1_desc:0 "Пристрій, який дозволяє підводному човні використовувати дизельні двигуни під водою і перезаряджати акумулятори, не піднімаючись у надводне становище."
 ship_sub_snorkel_2:0 "Покращений шноркель"
 ship_sub_snorkel_2_desc:0 "Покращена конструкція шноркеля усуває проблеми, пов’язані з шаленим штормом, а також зменшує ймовірність виявлення радаром."
 ship_airplane_launcher_1:0 "Катапульта для гідросамолетів"
 ship_airplane_launcher_1_desc:0 "Проста катапульта, спроможна забезпечити зліт невеликого літака-розвідника."
 ship_airplane_launcher_2:0 "Покращена катапульта для гідросамолетів"
 ship_airplane_launcher_2_desc:0 "Покращена система запуску дозволяє підкинути до неба більший літак з збільшеною ефективною дальністю."
 ship_deck_space: "Середнє відкрите місце ангару"
 ship_deck_space_short: "Середній ангар (відкритий)"
 ship_deck_space_desc: "Середній відкритий майданчик всередині корабля, який дозволяє обслуговувати й озброїти літаки, різко збільшує вартість ангару."
 ship_sonar_1:0 "Гідрофон"
 ship_sonar_1_desc:0 "Просте акустичне обладнання, яке дозволяє стежити за підводною метою, завдяки шумові, що вона створює."
 ship_sonar_2:0 "Активний Сонар"
 ship_sonar_2_desc:0 "Активний гідролокатор випромінює звуковий сигнал і фіксує ехо, що відбивається від корпусу підводного човна."
 ship_radar_1:0 "Дециметровий пошуковий радар"
 ship_radar_1_short:0 "Радар I"
 ship_radar_1_desc:0 "Примітивний радар, який працює на 50 см завдовжки, дає можливість виявити надводині кораблі на відстані 10 км і навіть у погану погоду."
 ship_radar_2:0 "Покращений дециметровий пошуковий радар"
 ship_radar_2_short:0 "Радар II"
 ship_radar_2_desc:0 "Покращений радар, який використовує довжину хвилі 30 см, здатний більш-менш точно визначати дистанцію до цілі і її напрямок на відстані більше 25 км."
 ship_radar_3:0 "Сантиметровий артилерійський радар"
 ship_radar_3_short:0 "Радар III"
 ship_radar_3_desc:0 "Ця радар, що використовує полосні магнетрони, може виявити не тільки вкрай невеликі цілі, але й сплески від попадання снарядів, що дозволяє вести прицільний вогонь навіть вночі або в погану погоду."
 ship_radar_4:0 "Інтеграційний радар СУО"
 ship_radar_4_short:0 "Радар IV"
 ship_radar_4_desc:0 "Радар, який працює у сантиметрі, повністю інтегрований з системами керування вогнем і дозволяє вести точний вогонь за будь - яких обставин."
 ship_extra_fuel_tank:0 "Додаткові паливні цистерни"
 ship_extra_fuel_tank_desc:0 "Збільшений запас палива підвищує ефектну відстань."
 light_ship_engine_1:0 "Двигун 35 000 л.с."
 light_ship_engine_1_desc:0 "Набір невеликих парових турбінів може надати швидкості невеликому кораблю або меншій швидкості — більшому."
 light_ship_engine_2:0 "Двигун 40 000 л.с."
 light_ship_engine_2_desc:0 "За допомогою парових котів високого тиску ви можете підвищити продуктивність без збільшення маси та розміру енергетичних установок."
 light_ship_engine_3:0 "Двигун 45 000 л.с."
 light_ship_engine_3_desc:0 "Нові матеріали дозволяють підвищити робочий тиск у котлах і, як наслідок, виробляти потужність."
 light_ship_engine_4:0 "Двигун 50 000 л.с."
 light_ship_engine_4_desc:0 "Покращена компонка підвищує ефективність енергетичних установок без збільшення маси."
 sub_ship_engine_1:0 "Двигун 1 000 л.с."
 sub_ship_engine_1_short:0 "Двигун підводного човна I"
 sub_ship_engine_1_desc:0 "Енергетична установа, що складається з дизельних і електричних двигунів, дозволяє човні пересуватися як над, так і під водою на адекватній швидкості."
 sub_ship_engine_2:0 "Двигун 2000 л.с."
 sub_ship_engine_2_short:0 "Двигун підводного човна II"
 sub_ship_engine_2_desc:0 "За допомогою потужнішого дизельного двигуна човен може швидко вийти на вогняну позицію, коли знайде ціль."
 sub_ship_engine_3:0 "Двигун 3000 л.с."
 sub_ship_engine_3_short:0 "Двигуни підводних човнів III"
 sub_ship_engine_3_desc:0 "Завдяки поліпшеним матеріалам та промисловим процесам нові покоління можуть довше працювати на повній потужності."
 sub_ship_engine_4:0 "Двигун 4000 л.с."
 sub_ship_engine_4_short:0 "Двигуни підводних човнів IV"
 sub_ship_engine_4_desc:0 "Сучасні двигуни можуть надавати значно більшу потужність за короткий час, щоб скоротити дистанцію до цілі або швидко перезарядити акумулятори."
 cruiser_ship_engine_1:0 "Двигун 60 000 л.с."
 cruiser_ship_engine_1_desc:0 "Проста система котлів, що розкручує турбіну, безпосередньо з’єднана з гребним валом."
 cruiser_ship_engine_2:0 "Двигун 70 000 л.с."
 cruiser_ship_engine_2_desc:0 "Парова турбіна з зубчастою передачою значно перевищує ефективність ранніх зразків; збільшення маси призводить до відчутної потужності."
 cruiser_ship_engine_3:0 "Двигун 80 000 л.с."
 cruiser_ship_engine_3_desc:0 "Покращене розташування котлів підвищує робочий тиск і виробляє потужність."
 cruiser_ship_engine_4:0 "Двигун 90 000 л.с."
 cruiser_ship_engine_4_desc:0 "Сучасні матеріали дозволяють енергетичної установки витримати набагато довше."
 heavy_ship_engine_1:0 "Двигун 30 000 л.с."
 heavy_ship_engine_1_desc:0 "При розробці двигуна акцент був зроблений на скорочення маси, щоб корабель міг нести більше броні і озброєння, не розвиваючи при цьому особливо високих швидкостей."
 heavy_ship_engine_2:0 "Двигун 90 000 л.с."
 heavy_ship_engine_2_desc:0 "Енергетична споруда значно сильніша за попередні зразки, з нею корабель буде помітно швидше своїх старих попередників."
 heavy_ship_engine_3:0 "Двигун 150 000 л.с."
 heavy_ship_engine_3_desc:0 "Новий двигун був створений з огляду на кількість гармат і броні, а також на необхідність переслідувати нападників або ж, навпаки, триматися на віддалі від переважаних сил ворога."
 heavy_ship_engine_4:0 "Двигун 210 000 л.с."
 heavy_ship_engine_4_desc:0 "Нова енергетична установа, яка використовує котли нової моделі і сучасні матеріали, забезпечує сучасну лінкору швидкість на рівні швидких крейсерів і авіаносців."
 carrier_ship_engine_1:0 "Двигун 50000 л.с."
 carrier_ship_engine_1_desc:0 "Набір нескладних двигунів дозволяє авіаносцю середніх розмірів досягати швидкості, необхідної для участі в бойових діях."
 carrier_ship_engine_2:0 "Двигун 120 000 л.с."
 carrier_ship_engine_2_desc:0 "З новою енергетичною встановкою авіаносець може перевищувати старі крейсери і деякі есмінці, щоб він міг ліпше ухилитися від бою."
 carrier_ship_engine_3:0 "Двигун 150 000 л.с."
 carrier_ship_engine_3_desc:0 "Удосконалений двигун дозволяє навіть великим авіаносцям розвивати солідну швидкість."
 carrier_ship_engine_4:0 "Двигун 2100 л.с."
 carrier_ship_engine_4_desc:0 "Найновіша система, розроблена для сучасних «Швидкі повітряніносці», Які мають стати центральними фігурами морських ударних групок."
 ship_armor_bb_1:0 "200-м пояс/40-ммм палуба"
 ship_armor_bb_1_short:0 "Блокування лінзи I"
 ship_armor_bb_1_desc:0 "Базова схема бронювання лінкора передбачає рівномірний захист всіх частин корабля від зброї власного калібру."
 ship_armor_bc_1:0 "150-м пояс/25-ммм палуба"
 ship_armor_bc_1_short:0 "Бронування лін. крейсера I"
 ship_armor_bc_1_desc:0 "Броня лінійного крейсера передбачає захист від зброї малого калібру; відносно мала маса броні дозволяє корабель розвивати високу швидкість."
 ship_armor_bb_2:0 "350-м пояс/150-ммм палуба"
 ship_armor_bb_2_short:0 "Лінкора II бронювання"
 ship_armor_bb_2_desc:0 "Схема бронювання з похилим бронюванням захищає лінкор від зброї своїх однокласників."
 ship_armor_bc_2:0 "305-м пояс/100-ммм палуба"
 ship_armor_bc_2_short:0 "Лін бронювання крейсера II"
 ship_armor_bc_2_desc:0 "Схема бронювання лінійного крейсера є компромісом між швидкістю і живучістю:0 вона призначена для захисту корабля від вогню крейсерів і есмінців."
 ship_armor_bb_3:0 "380-м пояс/155-ммм палуба"
 ship_armor_bb_3_short:0 "Блокування лінзи III"
 ship_armor_bb_3_desc:0 "Нова схема все ще вказує на захист від зброї власного калібру, але радикально відрізняється від старих:0 надійне бронювання «Цитати» в центрі корабля поєднується з слабкою бронезахистою всіх інших елементів."
 ship_armor_bc_3:0 "330-м пояс/130-мм палуба"
 ship_armor_bc_3_short:0 "Лін, крейсер III"
 ship_armor_bc_3_desc:0 "Сучасна схема бронювання бере до уваги необхідність зниження ваги; вона захищає життєво важливі елементи корабля і залишає всі інші частини відкритими. Подібна броня не може довгий час витримувати попадання лінз."
 ship_armor_shbb:0 "450-м пояс/210-ммм палуба"
 ship_armor_shbb_short:0 "Сверхтяже бронювання"
 ship_armor_shbb_desc:0 "Останнє слово в структурі броне захистки - це схема захисту від усіх думок калібрів і забезпечення переваги над будь- якими сучасними лінзами."
 ship_armor_cruiser_1:0 "50-м пояс/40-ммм палуба"
 ship_armor_cruiser_1_short:0 "Бронізація крейсера I"
 ship_armor_cruiser_1_desc:0 "Схема захисту, що дає крейсеру деяку перевагу над есмінцями та іншими легкобронованими суднами."
 ship_armor_cruiser_2:0 "100-м пояс/30-ммм палуба"
 ship_armor_cruiser_2_short:0 "Бронізація крейсера II"
 ship_armor_cruiser_2_desc:0 "Більш товстіший бронепереза дає крейсеру надійний захист від вогню старих легких крейсерів і малих кораблів."
 ship_armor_cruiser_3:0 "120-м пояс/50-ммм палуба"
 ship_armor_cruiser_3_short:0 "Блокування крейсера III"
 ship_armor_cruiser_3_desc:0 "Ця схема бронювання використовує принципи, які використовуються в ліккорах, і розроблена у відповідь на відносне збільшення потужності корабельних гармат."
 ship_armor_cruiser_4:0 "150-м пояс/60-ммм палуба"
 ship_armor_cruiser_4_short:0 "Блокування крейсера IV"
 ship_armor_cruiser_4_desc:0 "У цій схемі бронювання елементи, які критично важливі для функціонування корабля, отримали більш серйозний захист за рахунок всіх інших частин."
 ship_armor_carrier_deck:0 "90-мм палуба"
 ship_armor_carrier_deck_short:0 "Перемикання літньої палуби"
 ship_armor_carrier_deck_desc:0 "Важкі бронелисти захищають ангари від нальотів бомбардувальників, але при цьому зменшується їхній робочий об’єм."


