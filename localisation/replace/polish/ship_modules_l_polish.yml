 carrier_aviation_control_unit: "Авіаційний пульт"
 carrier_aviation_control_unit_short: "Керування авіацією"
 carrier_aviation_control_unit_desc: "За злітно-садкові операції відповідають диспетчерські служби, які стежать за тим, щоб ці дії виконувалися ефективно."
 carrier_damage_control_unit: "Відділ контролю пошкоджень"
 carrier_damage_control_unit_short: "Контроль пошкоджень"
 carrier_damage_control_unit_desc: "Пристрійи контролю пошкоджень захищають судно від ситуацій, які можуть призвести до затоплення корабля."
 carrier_scouting_unit: "Відряд літаків-розвідників"
 carrier_scouting_unit_short: "Розвідувальний загін"
 carrier_scouting_unit_desc: "На авіаносці розвернута ескадрилья професійних літаків-розвідників. Ці літаки обладнані збільшеними паливними баками і радіостанціями, призначені для пошуку флоту ворога на відстані сотень миль від свого носія."
 carrier_spared_squad: "Резервний загін"
 carrier_spared_squad_short: "Резервний загін"
 carrier_spared_squad_desc: "На його дощечку було виділено групу літаків."
 carrier_fuel_storage: "Збереження авіаційного палива"
 carrier_fuel_storage_short: "Збереження авіаційного палива"
 carrier_fuel_storage_desc: "Великий простір на авіаносці для зберігання пального."
 carrier_civilian_material: "Використання нестратегітечських матеріалів"
 carrier_civilian_material_short: "Нестратегічні матеріали"
 carrier_civilian_material_desc: "Використання цивільних матеріалів на носіях удошить їх виробництво."
 carrier_secondary_island: "Вторинний містк"
 carrier_secondary_island_short: "Вторинний містк"
 carrier_secondary_island_desc: "Вторинний містк, який розміщений на палубі для розвантаження авіаційних пунктів управління, розміщений переважно на містку."
 carrier_strength_deck: "Всилена палуба"
 carrier_strength_deck_short: "Всилена палуба"
 carrier_strength_deck_desc: "Верхня суцільна палуба, яка витримує дальні вигини, що глибоко інтегровано з корпусом корабля."
 ship_helipad: "Морський вертоліт"
 ship_helipad_short: "Вертолітний майданчик"
 ship_helipad_desc: "Вертолітна майданчик - місце, де може злетіти і сідати один вертоліт"
 ship_airplane_launcher_3: "Катапульта з паровим пристроєм"
 ship_airplane_launcher_3_desc: "Катапульта з паровим двигуном дозволяє літакам злетіти з дуже обмеженого простору."
 side_lift: "Боковий підйомник"
 side_lift_desc: "Боковий підйомний підйом допомагає збільшити ефективність вильотів, не займаючи при цьому простору на палубі."
 angled_deck: "Кутова палуба"
 angled_deck_desc: "Кутова палуба дозволяє одночасно виконувати операції по посадці і зльоту."
 ship_anti_air_5: "Зенітно-ракетний комплекс"
 ship_anti_air_5_desc: "Тип зенітніх ракет без систем наведення."
 ship_deck_space_small: "Невелика ангарна площа"
 ship_deck_space_small_short: "Малий ангар"
