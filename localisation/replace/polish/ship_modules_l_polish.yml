 ship_armor_cruiser_heavy_1:0 "100м пояс/50м палуба"
 ship_armor_cruiser_heavy_1_short:0 "Велика крейсерська броня I"
 ship_armor_cruiser_heavy_1_desc:0 "Схеми бронювання, які дають крейсеру невелику перевагу в боротьбі з есмінцями та іншими легкозброєними кораблями."
 ship_armor_cruiser_heavy_2:0 "150м пояс/60м палуба"
 ship_armor_cruiser_heavy_2_short:0 "Велика крейсерська броня II"
 ship_armor_cruiser_heavy_2_desc:0 "Більш важкий пояс, який дає крейсеру можливість вести бій зі старими крейсерами та невеликими кораблями, маючи добрий захист."
 ship_armor_cruiser_heavy_3:0 "180м пояс/100м палуба"
 ship_armor_cruiser_heavy_3_short:0 "Велика крейсерська броня III"
 ship_armor_cruiser_heavy_3_desc:0 "Копуючи методи, які використовуються для бронювання лінкорів, ця схема бронювання покликана йти в ногу з розвитком озброєнь у світі."
 ship_armor_cruiser_heavy_4:0 "220м пояс/120мм палуба"
 ship_armor_cruiser_heavy_4_short:0 "Велика крейсерська броня IV"
 ship_armor_cruiser_heavy_4_desc:0 "Ця схема бронювання визначає максимальний захист тих ділянок, які абсолютно необхідні для підтримання корабля на плаву та в бою, за рахунок всіх інших ділянок."
 ship_carrier_armor_heavy:0 "150 мм палуба"
 ship_carrier_armor_heavy_short:0 "Важка броня літньої палуби"
 ship_carrier_armor_heavy_desc:0 "Важкі бронєві аркуші захищають ангарні приміщення від ударів ворожих бомбардувальників ціною меншого робочого простору."
 ship_armor_shbb_2:0 "480м пояс/230м палуба"
 ship_armor_shbb_2_short:0 "Покращена надтяжка броня"
 ship_armor_shbb_2_desc:0 "Ця схема бронювання, що є останнім словом у корабельній споруді, призначена для захисту від відомих снарядів головної батареї, що дозволяє корабель з таким бронюванням розчавити і потопити будь-який інший лінкор в Сьогоднішній світ."

