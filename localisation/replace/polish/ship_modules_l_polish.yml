 ship_decoy_launcher: "Система запуску приманки"
 ship_decoy_launcher_short: "КЕП"
 ship_decoy_launcher_desc: "Пристрій, який запускає радіолокаційні або інфрачервоні фальшиві цілі з військово-морських кораблів для відбиття протикорабельних ракет."
 heavy_ship_engine_nuclear: "Важкий ядерний реактор"
 heavy_ship_engine_nuclear_short: "Важкий ядерний реактор"
 heavy_ship_engine_nuclear_desc: "Ядерна морська енергетика - це рух корабля або підводного човна за рахунок тепла, що виділяється ядерним реактором."
 cruiser_ship_engine_nuclear: "Ядерний реактор крейсера"
