 super_heavy_ship_engine_2: "150,000 л.с."
 super_heavy_ship_engine_2_short: "Крихітний паровий двигун II"
 super_heavy_ship_engine_2_desc: "Цей двигун набагато потужніший, ніж попередні, щоб забезпечити важким кораблям комфортний запас швидкості порівняно зі старими моделями."
 super_heavy_ship_engine_3: "200,000 л.с."
 super_heavy_ship_engine_3_short: "Найвищий паровий двигун III"
 super_heavy_ship_engine_3_desc: "З ростом кількості зброї і броні цей двигун був розроблений для забезпечення вищих швидкостей, щоб переслідувати нападників або тримати дальшу стрільби проти переважаних ворогів."
 anechoic_tile_1:0 "Безхехова плитка"
 anechoic_tile_1_short:0 "Безхехова плитка"
 anechoic_tile_1_desc:0 "Тип матеріалів, що оточує корпус, який дозволяє значно знизити шум."
 sub_ship_periscope_0:0 "Перископ 0"
 sub_ship_periscope_0_short:0 "Базовий перископ"
 sub_ship_periscope_0_desc:0 "Оптичне обладнання, яке використовують на підводних човнах для спостереження за поверхнею."
 sub_ship_periscope_1:0 "Перископ I"
 sub_ship_periscope_1_short:0 "Покращений Перископ"
 sub_ship_periscope_1_desc:0 "Оптичне обладнання, яке використовують на підводних човнах для спостереження за поверхнею."
