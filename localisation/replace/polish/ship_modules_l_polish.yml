 ship_fire_control_system_5: "Інтегровадна бойова система"
 ship_fire_control_system_5_short: "ІБС"
 ship_fire_control_system_5_desc: "Комплексова система, яка об’єднує всі органи управління та командування на кораблі, забезпечує розподіл даних з іншими бойовими одиницями."
 ship_display_system: "Комплексна система показу"
 ship_display_system_short: "КСО"
 ship_display_system_desc: "Система показу всієї тактичної інформації та даних у вигляді списку і візуалізації."
