 cruiser_ship_engine_3_diesel_desc:0 "Покращена складова котла дає велику потужність."
 cruiser_ship_engine_4_diesel_desc:0 "Сучасні матеріали дозволяють цьому двигуну працювати набагато довше, коли він має високі навантаження."
