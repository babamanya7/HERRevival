 local_logicist_center:0 "Стратегічна база постачання"
 local_logicist_center_plural:0 "Стратегічна база постачання"
 local_logicist_center_desc:0 "Завчасне планування стратегічних баз постачання може поліпшити ситуацію з місцевим постачанням, збільшити кількість військ, які можуть бути підтримані в регіоні, і зменшити надмірну залежність Тут від поставок з столиці, зазвичай вони будуються на якійсь дуже важливій території, на охорону якої доводиться витрачати багато армій. Кожного разу, коли вони будують стелю місцевого постачання буде збільшуватися в 2 рази, а максимум можна збільшити в 10 разів.\n§g(Після завершення будівництва почнеться протягом тижня).§!"
 
