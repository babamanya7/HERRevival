 left_rubber_text:0 "§MДокладна інформація про стратегічний запас гуми§!"
 left_rubber_desc:0 "Поточні запаси гуми: [?left_rubber|0] (Сміється: [?rubber_cap|0])\n§g(Сміщення залежить від кількості складів гуми × 100 000)§!\nБітова пропускна здатність: [?rubber_speed|0H]\n§g(Пропускна здатність залежить від кількості складів на 500)§!\nВикористовується: [?rubber_storage_withdrawal|0R]\nНадсилає на склад: [?daily_left_rubber|0G]\n§g------------§!\n§gКоли запити виробництва перевищують здобич - використання зі складу почнеться автоматично.\nЯкщо видобути гуми більше, ніж поточні запити - вилиці буде переміщено на склад.§!"
 
 left_aluminium_text:0 "§MДокладна інформація про стратегічний запас алюмінію§!"
 left_aluminium_desc:0 "Поточні запаси алюмінію: [?left_aluminium|0] (Сміється: [?aluminium_cap|0])\n§g(Смішність залежить від кількості складів алюмінію × 100 000)§!\nБітова пропускна здатність: [?aluminium_speed|0H]\n§g(Пропускна здатність залежить від кількості складів на 300)§!\nВикористовується: [?aluminium_storage_withdrawal|0R]\nНадсилає на склад: [?daily_left_aluminium|0G]\n§g------------§!\n§gКоли запити виробництва перевищують здобич - використання зі складу почнеться автоматично.\nЯкщо видобута алюмінія перевищує поточні запити - вилишки будуть переміщені на склад.§!"
 
 left_chromium_text:0 "§MДокладна інформація про стратегічний запас хрома§!"
 left_chromium_desc:0 "Поточні запаси кульгаві: [?left_chromium|0] (Сміється: [?chromium_cap|0])\n§g(Умісність залежить від кількості складів хрома × 75 000)§!\nБітова пропускна здатність: [?chromium_speed|0H]\n§g(Пропускна здатність залежить від кількості складів на 600)§!\nВикористовується: [?chromium_storage_withdrawal|0R]\nНадсилає на склад: [?daily_left_chromium|0G]\n§g------------§!\n§gКоли запити виробництва перевищують здобич - використання зі складу почнеться автоматично.\nЯкщо видобути кульку більше за поточні запити - вилишки буде переміщено на склад.§!"
 
 left_tungsten_text:0 "§MДокладна інформація про стратегічний запас вольфрама§!"
