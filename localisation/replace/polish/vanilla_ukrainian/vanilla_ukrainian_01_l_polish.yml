 LIT_events.5.desc:0 "Після Віленського наступу 1919 року традиційна столиця Литви перейшла до держави [Root.GetNameDef], що з того часу служить каменем спотикання між двома нашими країнами.\n\nЗа місто йде постійне суперництво, і сьогодні [From.GetLeader] заявляє, що, якщо столиця не буде здана державі [From.GetNameDef], бути війні.\n\nЦе місто не особливо корисне нам, але це уламок колишнього союзу. державі заради миру?"
