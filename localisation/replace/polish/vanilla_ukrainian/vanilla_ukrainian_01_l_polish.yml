 sp_land_reward_option_land_cruiser_communication_new:0 "Установити нову, досконалішу систему"
 sp_land_reward_stronghold_network_leadership_approach_desc:0 "У міру просування проєкту [Character.GetName], провідний науковець, мусить вирішити, наскільки [Character.GetSheHe] залучиться до повсякденних операцій. [Character.GetSheHeCap] може вибрати нагляд за будівництвом безпосередньо в полі, забезпечуючи точне виконання, або залишитися в офісі, зосередившися на стратегії та плануванні."
