 RAJ_court_the_princes_desc:0 "Туземні князівства довгий час були опорою лояльності та порядку на субконтиненті. Підтверджуючи їхні привілеї та залучаючи їх безпосередньо до управління, ми зміцнюємо імперський фундамент проти зростаючої популістської агітації."
 RAJ_cv_fighter_equipment_1_short:0 "Sea Gladiator"
 RAJ_destroyer_2:0 "$ENG_destroyer_2$"
 RAJ_fighter_equipment_3_short:0 "Spiteful"
 RAJ_force_china_to_accept_opium_trade_tt:0 "З'явиться світовий ринок опіуму. Деяким генералам це може надто сподобатися..."
 RAJ_form_a_police_force_desc:0 "Хоча обмеження заважають нам утримувати офіційну армію, ми уповноважені створити та оснастити сили безпеки під виглядом поліції. Це важливий крок до захисту наших інтересів."
 RAJ_give_me_blood_and_i_will_grant_you_freedom_desc:0 "Шлях до незалежності вимощений боротьбою та жертовністю. Згуртувавши сміливих для боротьби за нашу справу, ми можемо надихнути рух, достатньо потужний, щоб розірвати ланцюги колоніального правління. Перемога прийде до тих, хто готовий заплатити її ціну."
 RAJ_great_indian_peninsula_railway_desc:0 "Уряд отримав контроль над Великою залізницею півострова Індостан у 1925 році, а це означає, що тепер ми відповідаємо за її розширення та модернізацію. Наростаючому населенню країни потрібна більш сучасна транспортна інфраструктура."
 RAJ_heavy_industries_desc:0 "Швидка індустріалізація є необхідною для забезпечення майбутнього [RAJ.GetName]. Розвиваючи потужний сектор важкої промисловості, ми закладаємо основу для військової сили та економічної незалежності у сучасному світі."
 RAJ_holding_the_gates_of_india:0 "Утримання Воріт Індії"
 RAJ_india_indivisible_tt:0 "Відмикає рішення про претензії на §YІндійські§!, §YПакистанські§! та §YБангладешські§! штати"
 RAJ_indian_gentlemen_officers_goe_desc:0 "$RAJ_indian_gentlemen_officers_desc$"
 RAJ_indian_national_army_support:0 "[GER.GetNameDefCap] надасть їм підтримку."
 RAJ_indian_sandhurst_tt:0 "У Вас з'явиться §Yгенерал§! із §Y4 рівнем навичок§! на ім'я §Y$RAJ_kodandera_madappa_cariappa$§!.\nУ Вас з'явиться §Yгенерал§! із §Y3 рівнем навичок§! на ім'я §Y$RAJ_kodandera_subayya_thimayya$§!.\nУ Вас з'явиться §Yгенерал§! із §Y3 рівнем навичок§! на ім'я §Y$RAJ_jayanto_nath_chaudhuri$§!."
 RAJ_infantry_at:0 "Boys Anti-Tank Rifle"
 RAJ_infiltrate_aden_tt:0 "На початку війни за незалежність підняти ополчення в §Y[659.GetName]§!, §Y[906.GetName]§!, §Y[658.GetName]§!, §Y[765.GetName]§!, §Y[422.GetName]§! та §Y[656.GetName]§! для атаки на володіння [ENG.GetName]."
 RAJ_integrate_the_princes2_desc:0 "Система напівавтономії туземних князівств — це не те, що ми зацікавлені підтримувати. Туземні князівства будуть повністю включені до складу Індії раз і назавжди."
 RAJ_jaguar:0 "Ягуар"
 RAJ_land_of_the_tillers:0 "Земля тих, хто обробляє"
 RAJ_light_cruiser_1_desc:0 "C-class light cruisers were a group of twenty-eight light cruisers of the Royal Navy. They were built before and during the First World War for the rough conditions of the North Sea. They proved to be rugged and capable vessels despite being somewhat small and cramped. Their armament was more than satisfactory, as they carried enough 6 in. guns to fight enemy surface targets and a heavy torpedo load. They saw extensive use during WWI and participated in many surface actions. Only the Caledon, Ceres, and Carlisle subclasses were in service by the mid 1930's."
 RAJ_light_tank_destroyer_equipment_3_short:0 "Archer"
 RAJ_local_leaders_investments_infra_tt:0 "Розвиток місцевої інфраструктури: \nПобудувати до §G1§! §YІнфраструктури§! та §Y1§! будівельного слота в державі."
 RAJ_mechanized_equipment_2:0 "Universal Carrier"
 RAJ_medium_tank_artillery_equipment_2:0 "Avenger"
 RAJ_medium_tank_equipment_3_short:0 "Comet LP"
 RAJ_mineral_exploitation_institute:0 "Інститут експлуатації мінеральних ресурсів"
 RAJ_mountain_tanks_desc:0 "Традиційні танки мають труднощі на пересіченій місцевості, але спеціалізовані гірські танки дадуть нам перевагу у високогірних боях. Ці маневрені машини домінуватимуть на висотах, забезпечуючи стратегічні опорні пункти та перехитруючи наших ворогів."
 RAJ_mughal_breakaway_state_DEF:0 "Сецедоване тубільне князівство"
 RAJ_nationalize_british_owned_factories_desc:0 "Фабрики, побудовані на спинах [RAJ.GetAdjective] робітників, більше не служитимуть іноземним інтересам. Націоналізувавши промисловість, що належить [ENG.GetAdjective], ми повертаємо контроль народу та забираємо те, що було несправедливо відібрано."
 RAJ_obtain_modern_ship_contracts:0 "Отримати контракти на сучасні кораблі"
 RAJ_princely_autonomy_tt:0 "При звільненні туземного князівства як маріонетки додати: "
 RAJ_purchase_decomissioned_british_ships_desc:0 "Ми звернемося до [ENG.GetNameDefCap], щоб придбати виведені з експлуатації військові кораблі. Хоча вони застарілі, ці кораблі можна переобладнати, щоб швидко розширити наш флот з мінімальними витратами."
 RAJ_rebuilding_the_nation:0 "Відбудова нації"
 RAJ_red_eagle_division_desc:0 "Дивізія «Червоний орел» стане першою індійською дивізією, підготовленою до битв за кордоном у важких умовах."
 RAJ_restrictive_administration_budget_desc:0 "Для підтримки фінансової дисципліни необхідно усунути всі несуттєві витрати. Ефективність вимагає, щоб ми зосереджували ресурси там, де вони дають відчутну віддачу."
 RAJ_royal_indian_artillery_:0 "Королівська індійська артилерія"
 RAJ_sp_rockets_ballistic_missile:0 "Проєкт «Prithvi»"
 RAJ_sp_rockets_ground_to_air_missile:0 "Проєкт «Akash»"
 RAJ_special_economic_zones:0 "Спеціальні економічні зони"
 RAJ_submarine_2:0 "$ENG_submarine_2$"
 RAJ_submarine_effort_desc:0 "Японія нарощує силу свого надводного флоту в Азії, тому нам краще направити свою енергію в глибину і завдавати ударів, використовуючи підводні човни."
 RAJ_support_weapons2:0 "Lewis Mk III DEMS & SBML two-inch mortar"
 RAJ_temple_entry_movements_desc:0 "Недоторканність — це пляма на цій країні, яка лише розділяє нас. Щоб боротися з цим, ми дозволимо людям з кожної касти входити до своїх місць поклоніння."
 RAJ_the_calcutta_line:0 "Лінія Калькутти"
 RAJ_the_indian_national_army:0 "Індійська національна армія"
 RAJ_theocratic_rule_alt_desc:0 "Ми — спадкоємці завойовників, спадкоємці імперії, яка колись потрясла світ. Щоб вшанувати спадщину монґолів, ми повинні зміцнити єдність через силу, об'єднавши Індійський субконтинент під нашим правлінням як єдиний народ, пов'язаний не вірою чи походженням, а відданістю трону. Перед могутністю імперії всі схиляться."
 RAJ_urban_industrialism_desc:0 "Майбутнє лежить не в пасовищах, а на фабриках.\nЛише через швидкий промисловий розвиток ми можемо забезпечити революцію та підготуватися до майбутніх битв."
