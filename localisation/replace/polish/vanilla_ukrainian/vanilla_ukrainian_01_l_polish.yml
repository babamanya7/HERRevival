 siam.3.desc:0 "Прая Сонгсурадета звинувачують у тому, що він був організатором одного або кількох замахів на [SIA_plaek_phibunsongkhram.GetName], а також у плануванні державного перевороту. Воля уряду полягає в тому, щоб позбавити Прая Сонгсурадета командування, його звань і титулів, змусити піти у відставку з армії без пенсії та вислати з країни.\nКритики стверджують, що це завуальована чистка, організована [SIA_plaek_phibunsongkhram.GetName] для усунення свого головного суперника, але це явно наклеп."
 siam.3.t:0 "Вигнання Прая Сонгсурадета"
 siam.35.t:0 "[JAP.GetNameDefCap] вимагає, щоб ми друкували більше грошей"
 siam.36.t:0 "[SIA.GetNameDefCap] вимагає погашення боргу"
 siam.37.t:0 "[JAP.GetNameDefCap] погоджується погасити наші борги"
 siam.39.a:0 "Ми витримаємо те, що маємо."
 siam.40.a:0 "Тоді ми боремося."
 siam.49.t:0 "[JAP.GetName] приймає наш заклик"
 siam_dem.4.desc:0 "Пхун вступив у суперечку відкрито і з безпомилковою силою. Виступаючи перед прихильниками та офіцерами, він засуджує «Жовте досьє» як комуністичне за своєю суттю, незалежно від того, якою мовою віддають перевагу його захисники. Він заявляє, що будь-яка програма, яка підносить державу над власністю, обіцяє кардинальні соціальні зміни та розпалює агітацію серед нижчих верств, несе червону отруту в [ROOT.GetNameDef] під іншим іменем."
