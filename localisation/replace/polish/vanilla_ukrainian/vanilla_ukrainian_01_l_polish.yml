 SOV_aleksandr_shlyapnikov:0 "Олександр Шляпніков"
 SOV_align_general_stalin_desc:0 "Використовуючи всі доступні засоби, [ROOT.GetLeader] намагається забезпечити лояльність лідера армії як підготовку до майбутнього конфлікту."
 SOV_back_to_the_nep_new_economy_law:0 "Відкриває новий закон про економіку: §Y$new_economic_policy$§!"
 SOV_bringing_breakaways_back_to_the_fold_desc:0 "Відвоювавши більшу частину країни, ми повинні тепер мати справу з країнами, що відкололися. Вони ж не можуть очікувати, що ми назавжди змиримося з втратою російської імперської території?"
 SOV_carrier_3:0 "Проєкт 71Б"
 SOV_church_candidates_desc:0 "[SOV.GetChurchCandidatesDesc]"
 SOV_committee_in_exile_desc:0 "Ми ніколи не можемо бути впевненими, на кого наступного впаде божевільний погляд Сталіна. Ми мусимо підготувати підпільні маршрути і сховища, щоб вивезти людей із країни, якщо дізнаємося, що хтось із наших прихильників потрапив під чергову чистку."
 SOV_common_economic_space_sov_default_desc:0 "$SOV_comecon_sov_default_desc$"
 SOV_communism_party_russian_long:0 "Всесоюзна комуністична партія (більшовиків)"
 SOV_concessions_to_foreign_powers_desc:0 "Дуже принизливо, що ми змушені благати про іноземну допомогу в нашій боротьбі за порятунок країни, але сталінська тиранія і параноя зв'язали нам руки."
 SOV_coup_detat_civil_war_tt:0 "Додасть підтримку правої опозиції в армії, флоті й авіації.\nРозпочне §Yгромадянську війну в СРСР§!."
 SOV_cv_CAS_equipment_3_short:0 "Ил-10Т"
 SOV_defend_moscow:0 "Оборона Москви"
 SOV_expand_nkvd_opposition_desc:0 "Ми повинні скористатися можливістю розширити військове відомство НКВС. Ці війська можуть бути дуже корисними для забезпечення нашої майбутньої перемоги."
 SOV_factionalism_modifier:0 "Фракційність"
