 JUNO_brazil_events.130.desc:0 "[FROM.GetNameDefCap], наш колега-член Організації американських держав, був атакований і тому запровадив нещодавно прийняте оборонне положення організації. Згідно з цим положенням, очікується, що всі держави-члени прийдуть на допомогу атакованій державі-члену. Якщо ми відмовимося від нашого зобов'язання, ми, ймовірно, втратимо наше членство."
