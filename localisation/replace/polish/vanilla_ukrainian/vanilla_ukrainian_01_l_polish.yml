 SOV_increase_aircraft_production_desc:0 "Останнім часом надмірна увага до безпеки почала негативно впливати на кількість вироблених нових літаків. Ми могли б заощадити значну кількість ресурсів, відмовившись від найбільш надмірних систем безпеки, зберігаючи при цьому дуже безпечні та боєздатні військово-повітряні сили."
