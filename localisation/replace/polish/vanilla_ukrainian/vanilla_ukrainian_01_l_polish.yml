 PER_UNIFIED_neutrality_DEF:0 "Персія"
 PER_a_modern_iran_idea_desc:0 "After significant investments and effort, we have finally achieved our goals of a modern [PER.GetName]"
 PER_abol_ghasem_kashani:0 "Абол Гасем Кашані"
 PER_address_the_issue_tt:0 "Відмикає рішення §YІсламська революція§!, які дадуть нам §R90 днів§! на приборкання революціонерів."
 PER_adult_literacy_desc:0 "Неграмотність — головна проблема, яка переслідує наше населення. Здатність писати та читати рідною мовою допоможе розширити можливості та звільнити наш народ. Рада міністрів та Міністерство освіти об'єдналися, щоб видати освітній кодекс, а також пообіцяли створити школу, яка навчатиме наше доросле населення."
 PER_adult_literacy_idea_desc:0 "Грамотність рідною мовою є одним із найважливіших способів, завдяки якому люди можуть відчувати себе вільними та впевненими. Після фінансування загальнонаціональної кампанії з повернення дорослих до освітніх програм ми побачимо зростання розвитку [PER.GetNameDef] протягом певного часу."
 PER_ally_the_bazaari:0 "Схилити еліту"
 PER_azr_indy_war_tt:0 "§RУсі азербайджанські осердні області, якими ми володіємо, повстануть і оголосять війну за незалежність проти нас!§!"
 PER_buffer_state_tt:0 "Якщо §Yмир§! буде прийнято, то [AZR.GetFlag]§Y[AZR.GetNameDef]§!, [GEO.GetFlag]§Y[GEO.GetNameDef]§!, [ARM.GetFlag]§Y[ARM.GetNameDef]§! та [TMS.GetFlag]§Y[TMS.GetNameDef]§! будуть звільнені як маріонетки [PER.GetFlag]§Y[PER.GetNameDef]§!"
 PER_clamp_kurdish_dissidence_desc:0 "[PER.GetNameDefCap] охоплює частину території, яка колись належала курдському народу. Таким чином, існує значна діаспора людей, які незадоволені нашим правлінням. Настав час покласти край цим повстанським осередкам та забезпечити повернення стабільності та процвітання в регіон."
 PER_clampdown_on_resistance:0 "Придушити курдських сепаратистів у [FROM.GetName]"
 PER_coastal_fortifications_idea_desc:0 "Наша військово-морська сила не завжди була нашим найсильнішим активом, тому для захисту [PER.GetNameDef] від морських вторгнень ми повинні впровадити ініціативу укріплення узбережжя, щоб забезпечити безпеку наших берегових ліній під час будь-якого конфлікту."
 PER_comintern_research_collaboration:0 "Співпраця Комінтерну у дослідженнях"
 PER_communist_events.10.b:0 "Час виказати трохи скромності."
 PER_communist_propaganda_desc:0 "Націоналізація радіостанцій в єдиного державного мовника дозволить нам створити засіб для швидкого схиляння громадської думки у питаннях, в яких вона не повністю узгоджується з позицією держави."
 PER_constitutional_iran_democratic:0 "Іран"
 PER_demand_war_reparations:0 "Вимагати військові репарації"
 PER_eastern_expansion_desc:0 "Світ кардинально змінився за останні кілька років, і режими на нашому Сході залишаються хиткими та схильними до краху. Ми можемо більше ніколи не отримати такої можливості інтегрувати їх у нашу сферу впливу."
 PER_educational_reforms:0 "Освітні реформи"
 PER_embrace_opulence_desc:0 "Для такої важливої особи, як цар царів, вкрай важливо, щоб ми показали світові, наскільки розкішним може бути [PER.GetAdjective]. Дозвольмо всім, хто бажає, поглянути на нашу велич."
 PER_establish_immortal_legion_tt:0 "Відмикає шаблон дивізії §YЛегіон Безсмертних§! та набирає §Yтри§! одиниці у §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_establish_northern_buffer_states_desc:0 "Щоб наші вороги на півночі більше не мали можливості вторгатися безпосередньо в [PER.GetNameDef], ми повинні звільнити окуповані нації на цій землі та відновити їхній суверенітет. Сподіваємося, це запобіжить будь-яким несподіваним вторгненням у майбутньому."
 PER_expand_tabriz_masshad_desc:0 "Ми повинні продовжувати розширення Трансіранської залізниці. Зосередимося на розширенні залізничного сполучення між містами Тебріз та Мешхед."
 PER_fawzia_married:0 "Фавзія Фуад одружена"
 PER_force_white_peace:0 "Нав'язати білий мир"
 PER_foreign_policy_events.1.desc:0 "Здається, [FROM.GetAdjective] уряд дедалі більше нервує щодо нашої дипломатичної ситуації. Протягом минулого тижня [FROM.GetAdjective] посол зустрічався з [THIS.GetLeader] не менше шести разів і практично висунув ультиматум під час останнього раунду переговорів.\n\nАбо ми приєднуємося до [FROM.GetNameDef] в оборонному пакті та приймаємо «певний рівень консультацій щодо внутрішніх справ», або [FROM.GetNameDef], ймовірно, вдасться до військового втручання в нашій країні."
 PER_future_of_war:0 "Майбутнє війни"
 PER_imperial_events.121.t:0 "[ENG.GetNameDefCap] приймає нашу пропозицію"
 PER_imperial_events.202.t:0 "[FROM.GetName] відхиляє Саадабадський пакт!"
 PER_imperial_events.40.t:0 "Вибір шахбану"
 PER_imperial_state_of_iran_DEF:0 "Імперська держава Іран"
 PER_iranian_socialism_desc:0 "Щоб забезпечити довгострокову безпеку держави, ми повинні створити нові альянси з урядами-однодумцями по всьому регіону."
 PER_islamic_revolution:0 "Ісламська революція"
 PER_legacy_of_greatness_desc:0 "Для їхніх прихильників не є несподіванкою, що династії Пехлеві судилося тривати поколіннями. Хоча попереду бурхливі часи, зрозуміло, що шах та його син готуються повести [PER.GetNameDef] у золоту добу процвітання."
 PER_metropolitan_iran_idea:0 "[PER.GetAdjective] метрополія"
 PER_mir_afkhami:0 "Mir Afkhami"
 PER_open_abadan:0 "Відкрити Абаданську технічну школу"
 PER_our_place_in_empire_desc:0 "Після обговорення з [ROOT.OVERLORD.GetAdjective] урядом, ми вирішили, що найкращим курсом дій буде встановлення [PER.GetLeader] як нового Віце-короля [PER.GetNonIdeologyName] поряд з його поточною посадою. Це надасть нам набагато більше простору для маневру у виконанні наших обов'язків як частини [ROOT.OVERLORD.GetNameDef]."
 PER_promoting_resistance_in_progress:0 "Наразі §YСприяння опору§! триває в іншому місці"
 PER_propagate_political_literature_tt:0 "Відмикає рішення §Y$PER_mass_protests$§! для створення опозиційних груп у областях, щоб вони не приєдналися до шаха у потенційній §Rгромадянській війні§!."
 PER_retake_north_iran:0 "Повернути Північний [PER.GetNonIdeologyName]"
 PER_revolution_events.1.a:0 "Згуртувати війська!"
 PER_revolution_in_the_gulf:0 "Революція в Затоці"
 PER_royal_college_funding:0 "Заснувати Тегеранський університет"
 PER_special_forces_program_desc:0 "Є місця, куди наші регулярні фронтові сили не можуть дістатися, і щоб виправити це, створення програми спеціальних сил має першочергове значення. Незабаром ми матимемо спеціалізовані війська, які зможуть впоратися з будь-яким складним завданням, яке ми їм поставимо."
 PER_stand_with_germany:0 "Підтримати [GER.GetNameDef]"
 PER_swear_fealty:0 "Присягнути на вірність загарбникам"
 PER_the_memphis_initiative_desc:0 "Інтеграція територій у нашу Імперію є вирішальною, якщо ми хочемо зберегти контроль над нашими завойованими територіями. Єгипет, зокрема, буде важко утримати під контролем, якщо ми не будемо обережними, і тому ми повинні надавати пріоритет увазі саме до нього."
 PER_transfer_officer_idea_no_lar:0 "$PER_transfer_officer_idea_lar$"
 PER_trial_fifty_three_tt:0 "Прийняття цього фокусу призведе до заборони будь-яких §YКомуністичних§! радників в уряді."
 PER_university_of_isfahan:0 "Фінансувати Університет Ісфахана"
 PER_university_of_isfahan_desc:0 "Ми гостро потребуємо нових освітніх установ, які зосередяться на навчанні нового покоління медичних працівників. Університет Ісфахана має потенціал стати найсучаснішою медичною школою в усій [ROOT.GetNonIdeologyName]!"
 PER_venerate_islam:0 "Шанувати Іслам"
 PHI_american_intervention_category_desc:0 "Хоча [USA.GetNameDef] пообіцяли нам незалежність, їхній уряд може переконати себе, що наша зміна керівництва порушує акт, який має сприяти цій незалежності. Ми повинні стримувати себе, поки перебуваємо під  [USA.GetAdjective]им наглядом, щоб уникнути інтервенції."
 PHI_army_air_corps_desc:0 "Армійський авіаційний корпус, хоч і обмежений у розмірах та ресурсах, не позбавлений амбіцій. Наші острови розкидані, ними важко пересуватися, тому ми повинні значніше інвестувати в наші повітряні можливості, щоб тримати під контролем якомога більшу територію."
 PHI_bicameral_legislature:0 "Двопалатний законодавчий орган"
 PHI_convoys_for_guns:0 "Звернутися до [FROM.GetNameDef] з пропозицією обміняти наші конвої на зброю"
 PHI_decision_cost_icon_truck:0 "100 £GFX_unit_motorized_icon_small"
 PHI_declare_military_emergency_desc:0 "Країна була на слизькому шляху до фашизму, але рішучі дії запобігли остаточному падінню. Тепер зрозуміло, що загрози є всюди, і саме від нас залежить, як їм запобігти. Ніщо не є забороненим, ніщо не є незаконним. Демократія повинна вижити."
 PHI_decrease_japanese_ideological_influence:0 "Зменшити [JAP.GetAdjective]ий ідеологічний вплив"
 PHI_edwin_andrews:0 "Едвін Ендрюз"
 PHI_far_east_air_force:0 "Військово-повітряні сили Далекого Сходу"
