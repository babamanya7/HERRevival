 JAP_new_order_in_east_asia_idea:0 "Новий порядок у Східній Азії"
 JAP_new_order_movement_desc:0 "Ми повинні сформувати загальнонаціональну організацію у внутрішніх справах за зразком однопартійних держав Заходу, щоб мобілізувати націю на війну з колоніальними державами та запобігти комунізму шляхом відмови від сучасного капіталістичного шляху, що почався з Реставрації Мейджі. Це питання зараз є нагальнішим, ніж будь-коли, бо якщо ми не зробимо цього найближчим часом, ми можемо проґавити свій шанс."
 JAP_occupy_macau_desc:0 "Макао — це небезпечне місто, щоб залишати його поза нашим контролем, якщо ми збираємося продовжувати боротьбу проти колоніалістів на заході. Воно може слугувати плацдармом для відрізання наших армій та постачання ворога як повітрям, так і морем. Тому ми повинні негайно втрутитися й окупувати його, перш ніж воно стане причиною нашого несподіваного краху."
