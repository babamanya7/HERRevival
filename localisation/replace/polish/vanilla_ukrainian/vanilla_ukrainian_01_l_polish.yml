 bftb_bulgaria_balkan_federation.11.b:0 "Як співпрацювати з урядом, який нам не довіряє?"
 bftb_bulgaria_balkan_federation.12.b_tt:0 "Це може викликати такі ефекти:"
 bftb_bulgaria_balkan_federation.16.b:0 "Здається, [BUL.GetLeader] марить!"
 bftb_bulgaria_equipment_purchases.2.desc:0 "Перш ніж домовитися про купівлю [FROM.FROM.GetAdjective]ої військової техніки, необхідно вирішити, яку саме техніку ми хочемо придбати."
 bftb_bulgaria_factions.11.a:0 "Негайно позбудьтеся його!"
 bftb_bulgaria_factions.54.t:0 "Захоплення лідерів «Звена»"
 bftb_bulgaria_factions.73.desc:0 "Захоплення лідерів Землеробського національного союзу пройшло успішно. Заарештовано більшість важливих фігур, включаючи самого Ніколу Петкова. Від такого удару союз навряд чи оговтається."
 bftb_bulgaria_factions.75.desc:0 "Спроба захопити лідерів Землеробського національного союзу обернулася грандіозним провалом. Поліцейські увірвалися на таємну зустріч, але їх було набагато менше, ніж змовників, тому нікого не вдалося затримати, і учасники зборів швидко розбіглися. На вулицях зав'язалися жорстокі зіткнення, і постраждали багато невинних жителів. Зіткнувшись з такою жорстокістю поліції, багато городян мимоволі віддали аграріям свої симпатії і почали приховувати членів організації, а іноді й стали давати відсіч органам охорони порядку."
 bftb_bulgaria_german_influence.4.desc:0 "Сьогодні [GER.GetLeader] особисто надіслав нам лист. Він стверджує, що [ROOT.GetAdjective]ий прем'єр-міністр Ґеорґій Кьосеіванов настільки некомпетентний, що [GER.GetAdjective]е керівництво зовсім втратило до нього довіру. Останньому пропонується піти у відставку і поступитися посадою комусь гіднішому.\n[GER.GetAdjectiveCap]ий лідер пропонує замінити Кьосеіванова Боґданом Філовим. У політиці цей ґерманофіл зовсім недавно, а значить [GetLeaderToChallenge] для нього не суперник."
 bftb_bulgaria_political_leaders.1.d:0 "Трагічний випадок..."
 bftb_bulgaria_rearmament.1.t:0 "Переговори щодо [BUL.GetAdjective]ого переозброєння"
 bftb_bulgaria_rearmament.2.a:0 "Ми маємо знайти інші методи переконання..."
 bftb_bulgaria_rearmament.2.t:0 "[ENG.GetNameDefCap] відмовляє в [ROOT.GetAdjective]ому переозброєнні"
 bftb_bulgaria_scw_volunteers.2.t:0 "Болгарські добровольці повернулися з Іспанії"
 bftb_bulgaria_soviet_influence.1.a:0 "Договір вигідний обом країнам!"
 bftb_bulgaria_soviet_influence.1.desc_diplomat:0 "[BUL.GetAdjective]і дипломати"
 bftb_bulgaria_yugoslavian_influence.2.a:0 "Наші народи стануть тільки сильнішими!"
 bftb_bulgaria_yugoslavian_influence.2.desc:0 "[BUL.Capital.GetName] зустрічає свого лідера. [GetBulgarianLeaderToMeetStalin] повертається з зустрічі в місті [YUG.Capital.GetName], де він і [YUG.GetLeader] обговорювали підписання договору про вічну дружбу між державами [YUG.GetNameDef] та [ROOT.GetNameDef]. За підсумками зустрічі угода була укладена та підписана, однак у майбутньому деякі пункти можуть бути переглянуті задля взаємного бажання не тільки зберегти, але й примножити ці взаємовигідні відносини."
 bftb_bulgaria_yugoslavian_influence.3.a:0 "Просто марнування часу..."
 bftb_greece.12.desc:0 "Офіційні особи, які зібралися в столиці, раді були почути, що і [ENG.GetNameDef], і [FRA.GetNameDef] відправлять своїх делегатів на Іракліонську конвенцію. Підготовка до зустрічі у верхах вже розпочалася, конвенція буде проведена найближчими днями.\n\nНаші делегати розподілять сфери впливу на півночі і півдні держави [TUR.GetName], після чого буде остаточно вирішено, чи маємо ми отримати належні нам по праву території вздовж Егейського узбережжя. [ROOT.GetNameDef] опиниться в самому центрі цього процесу."
 bftb_greece.13.desc:0 "Офіційні особи, які зібралися в столиці, раді були почути, що і [ENG.GetNameDef], і [FRA.GetNameDef] відправлять своїх делегатів на Іракліонську конвенцію, але ця радість швидко згасла після новини про участь у конвенції держави [ITA.GetNameDef] Багато наших політичних постатей висловили у приватних бесідах занепокоєння тим, що [ITA.GetAdjective]і махінації можуть позбавити сенсу всю конвенцію, але [ROOT.GetLeader] як і раніше переконаний, що запросити державу [ITA.GetName] було правильним рішенням. Підготовка до зустрічі у верхах вже почалася, конвенція буде проведена найближчими днями. Нам по праву належать території вздовж Егейського узбережжя. Незабаром буде вершитися історія, і [ROOT.GetNameDef] опиниться в самому центрі цього процесу."
 bftb_greece.15.b:0 "Ми голосуємо проти!"
 bftb_greece.176.b:0 "Натхненний успіх!"
 bftb_greece.182.t:0 "[FROM.GetAdjectiveCap]і інвестори вкладають кошти!"
 bftb_greece.185.b:0 "Можливо, в інший раз."
 bftb_greece.187.desc:0 "[FROM.GetAdjectiveCap]і інвестори повернулися до нашої країни після минулого короткого візиту та привезли з собою нові інвестиції та нові можливості! Також вони привезли з собою непроханих спостерігачів, які дуже швидко зникли з поля нашого зору, прийнявшись за свою роботу, хай у чому вона полягає. Втім, неважливо — за допомогою [FROM.GetAdjective]ої держави ми вибудуємо справжню сучасну економіку."
 bftb_greece.190.desc:0 "Ми щойно мали задоволення прийняти у себе представників держави [FROM.GetNameDef], один з яких промовив перед Президією. У цій промові був особливо підкреслений сильний зв'язок між нашими країнами. Вислухати таке приємно, але все ж таки справжня мета [FROM.GetAdjective]ого візиту — обговорити інвестиції в їхню націю, що розвивається Теорія марксизму каже нам, що революція може відбуватися тільки в індустріальному суспільстві, але наша історія і досвід [FROM.GetAdjective]ого народу свідчать про протилежне. уряд вважає, що ми мусимо допомогти [FROM.GetAdjective]им громадянам, оскільки у нас є потрібні ресурси. З іншого боку — і це не оскаржується урядом — наші ресурси знадобилися б нам самим. Як же нам вчинити?"
 bftb_greece.205.a:0 "Щось втрачаєш, щось знаходиш!"
 bftb_greece.21.desc:0 "Тема цього раунду голосування — чи може [ITA.GetNameDef] отримати колоніальні території на півдні держави [TUR.GetNameDef], коли [TUR.GetNameDef] здасться. У кожного з присутніх є свої сумніви щодо того, щоб вільно віддавати частину середземноморської території [ITA.GetAdjective]ій державі, але [ITA.GetAdjective]і делегати незмінно повторюють те, що сказав [ITA.GetLeader]: це було б тільки справедливо у світлі «зіпсованої перемоги», що дісталася ним.\n\nІнші присутні перед офіційним початком Іракліонської конвенції вирішили, що [ITA.GetAdjective]е втручання у вторгнення в державу [TUR.GetNameDef] небажано. і пактом про невтручання у разі війни з державою [TUR.GetNameDef] Якщо дана пропозиція не пройде, то, незалежно від результату Іракліонської конвенції, держава [ITA.GetNameDef] не буде пов'язана. [GRE.GetNameDef], коли почнеться війна, може навіть втрутитися в те, що відбувається."
 bftb_greece.222.t:0 "Іракліонська конвенція — [FRA.GetAdjective]а держава не отримує мандат!"
 bftb_greece.23.desc:0 "Більшість присутніх делегатів вирішила, що [ITA.GetNameDef] не отримає колонії в південній частині держави [TUR.GetNameDef], і визнало саме таке бажання [ITA.GetAdjective]им підбурюванням до війни. [ITA.GetAdjectiveCap]і представники розкритикували рішення і заявили, що воно зайвий раз демонструє правильність самого поняття «зіпсована перемога», як називають її [ITA.GetAdjective]і жителі. безперечно, для того, щоб вони могли вплинути на вердикт за останнім і найважливішим пунктом порядку денного."
 bftb_greece.44.t:0 "Ми здобули перемогу в державі [FROM.GetNameDef]!"
 bftb_greece.45.a:0 "Ми врятували себе від забуття."
 bftb_greece.57.b:0 "Що ж, раз таке їхнє бажання..."
 bftb_greece.68.t:0 "[FROM.GetNameDefCap] подає заявку на вступ до альянсу [GER.GetFactionName]!"
 bftb_news.1.desc:0 "Цього ранку [BUL.GetAdjective]ий лідер [BUL.GetLeader] виступив з офіційною заявою, в якій публічно засудив дії Внутрішньої македонської революційної організації.\n[BUL.GetAdjective]ий міністр внутрішніх справ також повідомив про вступ у силу пакету надзвичайних заходів, які дозволять уряду виділити додаткові ресурси на боротьбу з ВМРО, щоб раз і назавжди покінчити з цією терористичною організацією."
 bftb_news.206.c:0 "Слабаки!"
 bftb_turkey.130.a:0 "Ось справжні друзі [ROOT.GetAdjective] народу."
 bftb_turkey.138.t:0 "[FROM.GetNameDefCap] порушує суверенітет члена альянсу!"
 bftb_turkey.14.desc:0 "[TUR.GetAdjective] політологи вважали, що після скасування заборони політичних партій для початку формування легітимної опозиції будуть потрібні тижні, але вони помилялися. Аднан Мендерес не марнував часу, збираючи групу під крилом традиціоналістів-однодумців, станом релігії в державі [TUR.GetNameDef]. В минулому, коли [TUR.GetAdjective] політичний рух був захоплений релігійними фундаменталістами, зупинився весь процес переходу до демократії, але цього разу все по-іншому: [TUR.GetLeader] має намір перемогти цих фанатиків на виборах.\n\nМендерес і його гурток фундаменталістів зібралися разом у так звану «Традиційну групу», яку НРП розпізнала як прабатьку популістського ісламістського руху, який планує вести свою роботу на платформі консерватизму та традиціоналізму. Набравши достатньо обдурених після дователей, вона, поза сумнівом, виведе на політичну арену опозиційну партію."
 bftb_turkey.16.t:0 "Традиційна група мобілізує селян, щоб підвищити явку виборців"
 bftb_turkey.17.desc:0 "Традиціоналісти Аднана Мендереса здійснили поїздку в [TUR.GetAdjective] Курдистан, що широко висвітлювалася в пресі, де всіляко проповідували примирення і взаємні інтереси в тому, що стосується сьогоднішнього стану справ щодо віри в державі [TUR. Посилаючись на релігійні писання, лідери курдських племен виступили разом із представниками традиціоналістського опозиційного руху та закликали курдів голосувати на виборах за Мендереса та його партію, щоб «повернути державу [TUR.GetNameDef] в обійми Всемогутнього»."
 bftb_turkey.25.a:0 "Ми дозволимо Хатаю перейти до складу держави [TUR.GetNameDef]."
 bftb_turkey.33.t:0 "[FROM.GetNameDefCap] просить про передачу архіпелагу Додеканес"
 bftb_turkey.35.a:0 "Велика перемога!"
 bftb_turkey.41.desc:0 "[FROM.GetLeader], президент держави [FROM.GetNameDef], очолив ініціативу з формального перетворення Балканського пакту на більш широкий і всеосяжний стратегічний альянс під назвою Балканська антанта. Всі учасники Балканського пакту запрошені вступити Представники держави [FROM.GetNameDef] запевнили, що зв'язки, що утворилися серед націй альянсу [FROM.GetFactionName], будуть служити далеко не лише військовим цілям, і вже представили плани щодо спільного розвитку наших фінансових систем, оборонних стратегій та багато іншого."
 bftb_turkey.42.desc:0 "[FROM.GetLeader] оголосив, що [FROM.GetNameDef] ратифікує альянс [ROOT.GetFactionName] і вступить до нього. Оголошення було зустрінуте з великою помпою, і об'єднання наших двох націй у разі неминучої війни було відзначено двома державними святами поспіль."
 bftb_turkey.44.desc:0 "Ми отримали план оборони від держави [FROM.GetNameDef]. Цей план передбачає, що [FROM.GetAdjective]ий уряд візьме на себе відповідальність за захист наших володінь у Леванті. [FROM.GetLeader] стверджує, що географічна близькість держави [FROM.GetNameDef] спрощує захист цих територій та управління ними і що, якщо здати ці території державі [FROM.GetNameDef], ресурси, що звільнилися, можна направити куди-небудь ще.\n\nЦя пропозиція не позбавлена логіки, але ми стоїмо в... цікавому становищі: ми захопили Палестину, Йорданію і Синай у переможеної Османської імперії. Чи готові ми віддати їх її [FROM.GetAdjective] спадкоємцям? наша відмова, яку можуть прийняти за знак нашої недовіри або взагалі вирішити, що ми не цінуємо їхнє місце в цьому альянсі. ь, і ми, на жаль, не можемо бути впевнені, що [FROM.GetAdjective] влада у разі відмови не піде на принцип."
 bftb_turkey.45.a:0 "Ми тепер вийшли на новий рівень."
 bftb_turkey.48.a:0 "Тепер ми справді велика держава."
 bftb_turkey.50.t:0 "[FROM.GetNameDefCap] просить легкі танки"
 bftb_turkey.54.t:0 "[FROM.GetNameDefCap] не надсилає нам нічого"
 bftb_turkey.56.desc:0 "[FROM.GetNameDefCap] погоджується виконати домовленості, укладені більше десяти років тому, і нічого не вимагає натомість. Держава використовувала свою технічну перевагу та розвинену промисловість, щоби добувати нафту в області [350.GetName], яка була для нас недоступна.. Крім того, нам передали частину [FROM.GetAdjective] нафтовидобувної промисловості, і тепер ми можемо використовувати її на свій розсуд. щоби ми краще могли розпорядитися природними ресурсами своєї країни."
 bftb_turkey.69.a:0 "Яка чудова підступність!"
 bftb_turkey.79.a:0 "Від дружби з такими країнами, як [FROM.GetNameDef], можна чекати тільки добра."
 bftb_turkey.82.a:0 "Нам все одно, що вони робитимуть."
 bftb_turkey.85.d:0 "[FROM.GetAdjective]і чвари нас не торкаються."
 bftb_turkey.88.t:0 "[FROM.GetNameDefCap] відступає!"
 bftb_turkey.92.desc:0 "[FROM.GetLeader] проявив великий ентузіазм, коли ми запропонували йому проєкт мирного договору та пакту про ненапад, і відразу ж підписав документи. Тепер, заручившись його підтримкою, ми стали на крок ближче до досягнення миру на рідній землі та у всьому світі!"
 bftb_turkey.98.desc:0 "[FROM.GetAdjectiveCap]ий уряд відмовився визнавати наш авторитет і законність наших вимог. Жалюгідні боягузи вирішили, що [FROM.GetFactionName] їх захистить. Слід вирішити, чи не побоїмося ми союзників держави [FROM.GetNameDef] або трохи відкладемо тріумфальну ходу до влади."
 bicycle_infantry_desc:0 "Регулярні частини піхоти, оснащені велосипедами, пересуваються швидше, ніж війська, що здійснюють марш-кидки, а витрати при цьому невеликі."
 blitzkrieg_theorist:0 "Теоретик бліцкріґу"
 bold_desc:0 "§LСмілива атака відрізняється від необдуманої тим, що завжди призводить до успіху.§!"
 britain.15.d:0 "Уряд Франції не побачив причин запропонованої нами скромної перебудови кордону і вирішив розпочати жахливу війну. Ми дозволимо їм виснажити себе в черговому раунді марної окопної війни, і тоді вони будуть благати про нашу допомогу."
 britain.24.a:0 "Ми виявилися напрочуд прозорливі!"
 britain.8.t:0 "Вимогу не буде задоволено!"
 broad_naval_support_carrier_maneuvering:0 "Маневрування авіаносців"
