 CHI_expand_the_academica_sinica:0 "Розширити Academica Sinica"
 CHI_great_ma_neutrality:0 "Great Ma"
 CHI_guidance_and_support_desc:0 "Народам Індокитаю потрібна допомога у створенні своїх країн. Ми зробимо все, щоб вони знову не опинилися під впливом зовнішніх сил."
 CHI_heavy_weapons_development:0 "Розробка важкого озброєння"
 CHI_highlight_northwestern_road_fake_decision:0 "Північно-західне шосе"
 CHI_hyper_inflation_5:0 "Економічний колапс"
 CHI_incompetent_officers_desc:0 "Наші офіцери ще не в змозі вести сучасну війну. Потрібно буде вивчити важкі уроки, перш ніж вони справді стануть рівними зі своїми колегами в інших країнах. Їхнє навчання стане частиною масштабної програми реформування армії."
 CHI_infantry_equipment_2_short:0 "TsingTao MP18"
 CHI_international_squadron:0 "Запросити «Літаючих тигрів»"
 CHI_joint_tank_development:0 "Спільна розробка танків"
 CHI_know_thy_self_desc:0 "Розуміння ворога принесе нам перемоги, але остаточна перемога може прийти лише через знання власних можливостей. Запровадження процесів ретельної самооцінки виявить наші слабкі сторони, але також і наші сильні сторони."
 CHI_light_tank_aa_equipment_1_short:0 "PGZ 34"
