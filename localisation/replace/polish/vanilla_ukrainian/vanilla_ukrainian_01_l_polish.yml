 FIN_industrialize_the_region_desc:0 "Хоча об'єднана військова міць Північного фронту оборони є значною, ми повинні зробити більше, щоб гарантувати, що наші економіки зможуть підтримувати її в затяжній війні. Щоб зробити це, нам потрібно інвестувати у відновлення нашої промисловості."
 FIN_infrastructure_effort_desc:0 "$FIN_industrial_development_desc$"
 FIN_innovative_designs_desc:0 "У сміливому стрибку інновацій наші інженери оприлюднюють амбіційний проєкт Hyökkäysvaunu, пропозицію надважкого танка, який кидає виклик кордонам броньованої війни. Хоча це може здатися нетрадиційним, ця смілива спроба відображає [ROOT.GetNameDef] рішучість досліджувати новаторські проєкти та розширювати межі можливого на полі бою."
