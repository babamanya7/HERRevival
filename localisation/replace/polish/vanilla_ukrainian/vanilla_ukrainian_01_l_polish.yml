 JAP_kodoha_coup_will_fail_historically_tt:0 "Ми оголосимо воєнний стан і залучимо полк Йокосука Імператорського флоту Японії для придушення повстання. Повідомляється про мінімальні жертви, хоча смерть деяких цілей Кодоха підтверджено:"
 JAP_kwantung_army_impatience:0 "Квантунська армія втрачає терпіння"
 JAP_light_cruiser_2_desc:0 "Крейсери класу «Mogami» були добре озброєні, оснащені хорошою бронею і потужними двигунами, що забезпечували високу швидкість. Вони були модернізовані у порівнянні з початковим проєктом і перекласифіковані у важкі крейсери. Хороша протикорабельна оборона і висока швидкість забезпечували велику дальність операцій."
