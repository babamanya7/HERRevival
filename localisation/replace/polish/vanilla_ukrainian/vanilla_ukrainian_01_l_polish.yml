 IRQ_arab_free_legion:0 "Вільний арабський легіон"
 IRQ_arab_league_economic_cooperation_desc:0 "Щоб зміцнити братерство між арабськими націями, ми повинні прагнути тісніше співпрацювати в економічному секторі."
 IRQ_assasination_of_sidqi_desc:0 "Вбивство Бакра Сідкі — це спроба усунути його від влади, оскільки він став надто впливовим у політичних колах."
 IRQ_effectivizing_our_production_line:0 "Оптимізація виробничих ліній"
 IRQ_emir_of_taif:0 "Емір Таїфу"
 IRQ_establish_iraqi_coastal_defense_force_desc:0 "Наша берегова лінія може бути короткою, але вона розташована на одному з найважливіших у світі маршрутів постачання нафти на захід. Тому ми повинні створити військово-морські сили для захисту наших інтересів у цьому районі."
