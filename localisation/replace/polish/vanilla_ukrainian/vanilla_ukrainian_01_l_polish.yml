 news.1.d:0 "Японські та китайські війська безрезультатно зіткнулися за стратегічний міст Марко Поло, розташований на південний захід від Пекіну.\n\n[CHI.GetNameDef] відхилив вимоги держави [JAP.GetNameDef] про вибачення та територіальні поступки, стверджуючи натомість, що настав «переломний момент» японської агресії.\n\nДипломати побоюються, що нестабільна ситуація в будь-який момент може призвести до війни."
 news.100.b:0 "Ще одна перемога Фатерланду."
 news.105.d_alt:0 "[217.GetCapitalVictoryPointName], промисловий центр на березі Волги, тепер під контролем німецьких військ. З важкими боями пробившися крізь руїни тракторного заводу міста [217.GetCapitalVictoryPointName] і захопивши стратегічну висоту на Мамаєвому кургані, німці витіснили залишки [SOV.GetAdjective]их військ на східний берег Волги. За непідтвердженими відомостями, частина армії разом з партизанами сховалася в каналізації і підвалах, щоб продовжувати боротьбу.\n\nАле ніякого суттєвого опору поки непомітно."
 news.111.d:0 "Після тривалих вуличних боїв, які вели переважно нерегулярні збройні частини, німецькі штурмовики зуміли взяти Нью-Йорк.\n\nІмпровізовані протитанкові укріплення на 5-му авеню виявилися неефективними, і моторизована піхота район за районом захопила Мангеттен.\n\nОсь уже кілька днів у східній частині міста вирують пожежі, від яких ніч така ж яскрава, як і день.\n\nСтатуя Свободи обезголовлена випадковим артилерійським снарядом, причому досі невідомо, з якого боку було зроблено постріл."
 news.129.b:0 "Неймовірно файна робота, друзі!"
 news.130.b:0 "Vive la France!"
 news.151.c:0 "Вони мусили знати, що ми це так просто їм не дозволимо."
 news.157.d:0 "Лише кілька днів тому армія держави [FROM.GetName] рушила на державу [FROM.FROM.FROM.GetName] після оголошення війни. За цим пішов ультиматум держави [FROM.FROM.GetName] з вимогою негайного припинення військових дій та відступу [FROM.GetAdjective]их військ. [FROM.GetLeader] відстоює свою правоту й не збирається поступатися. Тепер країна перебуває у стані війни з державами [FROM.FROM.FROM.GetName] та [FROM.FROM.GetName]."
 news.159.b:0 "Разом ми непереможні!"
 news.159.c:0 "Чудова ініціатива!"
 news.159.t:0 "Розквіт альянсу [From.GetFactionName]"
 news.164.f:0 "Британці дурні."
 news.165.f:0 "Ми зробемо те, що правильно!"
 news.166.c:0 "Ми боремося наодинці."
 news.171.d_GER:0 "Перемовини між державами [GRE.GetNameDef] та [GER.GetNameDef] про кордони зайшли в глухий кут. Заявивши, що пропозиція Німеччини здати частину земель в оренду під німецькі військові бази, рівнозначно втраті цих територій, [GRE.GetLeader] закликав усіх придатних до військової служби греків готуватися до оборони країни."
 news.175.a:0 "Ми боремося разом."
 news.177.a:0 "Потім не приходьте до нас плакати!"
 news.183.t:0 "[From.GetName] відмовляється від союзу з Францією!"
 news.186.a:0 "Італія повинна контролювати Егейське море."
 news.196.d:0 "У своїй палкій промові [From.GetLeader] закликав комуністичні партії в усьому світі прискорити падіння капіталізму, застосовуючи більш екстремальну тактику. Страх переслідування не повинен зупинити жодного чоловіка чи жінку від сприяння боротьбі робітничих класів.\n\n[From.GetName] буде збільшувати фінансування іноземних комуністичних партій і навчати їх більш екстремальній тактиці, необхідній для того, щоб привести їхні країни у відповідність до [From.GetFactionName]."
 news.198.t:0 "[From.GetName] опирається [Soviet.GetAdjective]ому ультиматуму"
 news.20.a:0 "Дуже хоробро."
 news.20.d:0 "Незважаючи на [GER.GetAdjective]і війська на кордоні, [FROM.GetNameDef] відкинула ультиматум Берліну про передачу Мемеля.\n\nДо цього ця територія входила до складу Східної Пруссії, але держава [FROM.GetNameDef] отримала її за Версальським договором. Як заявляє [FROM.GetLeader], необхідно було зберегти цілісність договору, коли [FROM.GetAdjective]ий уряд оголосив, що відкидає його. Міжнародні експерти очікують, що Німеччина спробує захопити ці землі силою..."
 news.200.e:0 "Мир у наш час?"
 news.201.t:0 "[GER.GetNameDefCap] Примушує [TUR.GetNameDef] підкоритися"
 news.202.d:0 "Після місяців дедалі агресивнішої риторики, погіршення відносин між [GER.GetNameDef] та [POL.GetNameDef], сьогоднішнім вечором усе змінилося: дипломатична угода, спрямована на врегулювання суперечки щодо Данциґа, була підписана.\n\n[POL.GetNameDef] приєднає контрольовану Німеччиною Словаччину до Польщі, а в обмін на це поступиться регіоном Данцига. Статус Вільного міста Данциґ було швидко врегульовано, і незабаром воно буде повністю реінкорпороване до складу німецької держави.\n\nХоча питання здається вирішеним мирним шляхом, переможці Великої війни, безсумнівно, мають заперечення."
 news.21.b:0 "Це велика перемога."
 news.210.d:0 "Після десятиліть політичної нестабільності в Китаї, що супроводжувалася збройним конфліктом як всередині країни, так і за її межами, японський уряд оголосив, що вважає китайський уряд загрозою стабільності у сфері своїх інтересів.\n\nСаме на цій підставі — під загрозою війни — було сформовано новий уряд, лояльний до Японії і підпорядкований японському імператору. Цей новий уряд не лише користується захистом японської армії, але й має військовий мандат на відвоювання китайських територій.\n\nХоча політичний конфлікт, безумовно, продовжуватиметься, відкритої війни між двома країнами вдалося запобігти."
 news.222.t:0 "[ENG.GetAdjective]ий парламент обговорює інтервенцію в Скандинавію"
 news.237.b:0 "Ласкаво просимо в Райх!"
 news.242.b:0 "Будемо сподіватися, що [AST.GetNameDef] не зіпсує це."
 news.249.b:0 "Армія півночі буде готова."
 news.25.b:0 "Це німецькі землі."
 news.26.b:0 "Німеччина переможе!"
 news.286.t:0 "Австралія розриває зв'язки з Британією"
 news.291.b:0 "Це не залишиться без наслідків..."
 news.30.c:0 "Це нічого не змінює."
 news.308.t:0 "Югославія відхиляє [HUN.GetAdjective]і вимоги"
 news.312.c:0 "Можливо, з цього вийде щось добре."
 news.335.c:0 "Нехай ідуть!"
 news.45.c:0 "Що він тут робив?"
 news.5.b:0 "Як і має бути."
 news.5.e:0 "Наші союзники взяли ініціативу!"
 news.55.c:0 "Ми підтримуємо Польщу."
 news.57.c:0 "Час наполягти на своєму."
 news.6.d:0 "Користуючися слабкістю Франції, яка зазнала поразки в Європі, держава [JAP.GetNameDef] вимагає від нового уряду надати повний доступ до баз в Індокитаї.\n\nФактично це означало б поступку колонією, і французи на таке не пішли.\n\nЕксперти вважають, що таке рішення викличе з боку японців заходи військового характеру."
 news.60.b:0 "Чехів треба захищати від самих себе."
 news.60.d_2:0 "Після анексії Чехословаччини Німеччиною почалися суперечки про те, яким чином мають бути розділені ці території, але тепер, схоже, рішення знайдено.\n\nЗа підтримки німців Словаччина оголосила про незалежність, і новостворену державу очолив Йозеф Тісо."
 news.68.d:0 "Дванадцяті Олімпійські ігри нещодавно відбулися у Фінляндії.\n\nСпершу місцем проведення мусило стати Токіо, але зростаюча напруженість у світі змусила Олімпійський комітет перенести змагання в Гельсінкі. Найбільше медалей завоювали спортсмени зі США, слідом за ними — Німеччина й Італія. Фінляндія посіла четверте місце у командному заліку з 10 золотими медалями."
 news.9.b:0 "Боягузи втекли!"
