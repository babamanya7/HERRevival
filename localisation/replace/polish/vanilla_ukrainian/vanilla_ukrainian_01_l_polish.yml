 strat_bomber_equipment_1_desc:0 "За період Великої війни і після неї стало ясно, що бомбардування військових цілей і великих міст — ключ до перемоги в наступній війні. Принаймні, нам необхідні літаки, здатні завдавати подібних ударів. Бомбардувальнику потрібна висока стеля, хороша швидкість і велике бомбове навантаження. Це буде велика конструкція з кількома двигунами, а також оборонним озброєнням."
 strikes_event.7.a:0 "Порядок було відновлено."
 submarine_coastal_defense_maneuever_fire:0 "Надто близько, щоб промахнутися"
 submarine_effort_desc:0 "Підводна війна стала найперспективнішим напрямом розвитку з часів винайдення торпедних катерів. Так ми зможемо не тільки захищатися проти ворожих підводних човнів, а й використовувати їх проти ворожих конвоїв."
 subsidiary_carrier_role:0 "Допоміжна роль авіаносців"
 subsidiary_carrier_role_ti_desc:0 "$subsidiary_carrier_role_desc$"
 sup_delay_desc:0 "Навіть коли у битві не можна перемогти, буває корисно уповільнити наступ ворога за допомогою засідок та стримуючих дій."
 super_heavy_artillery_equipment_1:0 "Надважка гаубиця"
 super_heavy_tank_chassis_short:0 "Надважке шасі"
 support_equipment_desc:0 "Радіо, джипи, понтони й інше обладнання, використовуване для підтримки військ."
 support_integrated_operations_first_line_of_attack:0 "Перша лінія атаки"
 support_republican_spain:0 "Підтримка Республіканської Іспанії"
 support_republican_spain_desc:0 "Багато хто сприймає громадянську війну в Іспанії як локальну версію глобального конфлікту ідеологій, що визначають політику нашого часу. Надаючи допомогу республіканській Іспанії, ми боремося з фашистами, які прагнуть поневолити іспанський народ."
 support_republican_spain_short_desc:0 "Відішліть спорядження для підтримки республіканської Іспанії у громадянській війні."
 tac_bomber_equipment_desc:0 "Тактичні бомбардувальники невеликі та швидкі; вони здатні допомагати наземним силам і знищувати ворожі споруди."
