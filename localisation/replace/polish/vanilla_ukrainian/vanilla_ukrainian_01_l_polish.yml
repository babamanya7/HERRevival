 INS_support_weapons:0 "Madsen Machine Gun"
 INS_syarif_kasim:0 "Шаріф Касім II"
 INS_three_year_plan:0 "Трирічний план"
 INS_tin_to_japan_desc:0 "[JAP.GetNameDefCap] має багато кораблів, які зараз вважаються застарілими та підлягають заміні, незважаючи на те, що вони ідеально підходять для флоту [INS.GetAdjective]. Ми повинні придбати ці кораблі за гроші від нашого виробництва олова."
 INS_tin_to_usa_desc:0 "[USA.GetNameDefCap] сповнена корпорацій та урядових установ, що закуповують олово. Тепер, коли у нас є належна видобувна операція, ми маємо можливість отримати великий прибуток."
 INS_tkr_supply:0 "Кожен революціонер має битися"
 INS_union_events.7.desc:0 "Рада в [HOL.GetNameDef] відхилила пропозицію про спільний союз. Їхнє послання тверде, співпраця триватиме, але суверенітет не буде спільним."
 INS_volksraad_events.100.t:0 "Пропозиція у Фольксрааді дозволити освітні субсидії для резидентів не голландського походження"
 INS_volksraad_events.20.desc:0 "Урядові посади в Індії, включно з Фольксраадом, вимагають вільного володіння голландською мовою, що змусило багатьох членів Фольксрааду, особливо представників місцевих громад, поставити під сумнів дійсність її демократії. Вони внесли пропозицію, яка наполягає на тому, що урядові посади мають обіймати індонезійськомовні особи, коли це можливо."
 INS_volksraad_official_flag_desc:0 "Пропозиції у Фольксрааді щодо надання автономії врешті-решт увінчалися успіхом, і те, що ще кілька років тому називалося Нідерландською Ост-Індією, тепер є Домініоном Індонезія. Наш прапор має бути змінений відповідно до цих змін."
