 AFG_political_events.54.a:0 "Чудово!"
 AFG_political_events.62.desc:0 "[FROM.GetNameDefCap] відхилив членство у Тюрко-Перському союзі. Вони обурені нашою нібито зарозумілістю, намагаючись говорити від імені всіх [TUR.GetAdjective] та [PER.GetAdjective] народів."
 AFG_political_events.80.b:0 "Вони не мають права диктувати нам політику."
 AFG_political_events.81.desc:0 "У відповідь на наш ультиматум, [FROM.GetNameDef] вирішив погодитися на наші вимоги. Вони погодилися приєднатися до нашого альянсу, визнаючи силу та лідерство [ROOT.GetNameDef] в об'єднанні ісламського світу. Цей стратегічний крок не лише розширює наш вплив, але й зміцнює нашу позицію як домінуючої сили в регіоні. Тепер, коли вони на нашому боці, наше бачення об'єднаного ісламського фронту стає ще ближчим до реальності."
 AFG_privatize_factories:0 "Приватизувати фабрики"
 AFG_promote_muslim_work_ethic:0 "Просувати мусульманську трудову етику"
 AFG_protector_of_the_tajiks_tt:0 "Відмикає рішення про пропозицію миру з [742.OWNER.GetNameDef], коли [742.GetName] буде окупований [ROOT.GetName]"
 AFG_purchase_capital_ships:0 "Придбати лінійні кораблі"
 AFG_remember_the_khost_rebellion:0 "Пам'ятати про повстання Хоста"
 AFG_revive_the_1923_constitution_desc:0 "Король — провидець, який ще у 1923 році розумів, що націю потрібно витягнути у 20 століття. Його реформи були майже повністю знищені королем Захіром. Але з відновленням короля при владі, ми можемо продовжити там, де він зупинився, та відновити його Конституцію 1923 року."
 AFG_savior_of_the_holy_lands_desc:0 "Настав час для нас виконати священний обов'язок та звільнити Святі Землі від ярма іноземних гнобителів. Наші хоробрі солдати вирушать у похід із силою наших предків, натхнені праведною справою повернення колиски нашої віри. Це божественне починання не лише об'єднає ісламський світ під нашим керівництвом, але й принесе честь та славу нашій великій нації."
 AFG_unite_pashtunistan_desc:0 "Кінцевою метою кампанії Факіра завжди була незалежність Пуштунської держави на землях Британського Раджу. Однак тепер йому випала нагода створити Пуштунську державу за межами згаданих кордонів та завоювати решту регіонів. Хай живе Пуштуністан, хай живе Емір!"
