 INS_limited_war_events.3.a:0 "Індонезія піднімається."
 INS_loyalist_events.14.t:0 "Компроміс щодо Сінгапуру прийнято"
 INS_loyalist_events.18.desc:0 "Наш запит на передачу Цейлону був відхилений. Нинішні контролери не мають наміру розлучатися з островом, і наші дипломати повідомляють, що подальше обговорення цього питання було б марним."
 INS_loyalist_events.23.a:0 "Так і має бути."
 INS_loyalist_events.33.a:0 "Невдача, не більше."
 INS_loyalist_events.4.desc:0 "Делегація [FROM.GetAdjective] прибула до [ROOT.Capital.GetCapitalVictoryPointName] з пропозицією про об'єднання. Вони вказують на спільну малайську спадщину наших народів і зазначають, що кордони між нашими націями були встановлені європейськими колоніальними адміністраторами, а не народами, які населяють ці землі. Пропозиція передбачає розпуск обох урядів і реформування в єдину державу."
 INS_machinefabriek_braat_name_normal:0 "N.V. Machinefabriek Braat"
 INS_medium_tank_artillery_equipment_1_short:0 "PTH-3"
 INS_minimum_program_desc:0 "Persatuan Perjuangan висунула свої вимоги: народний уряд, народна армія та націоналізація всіх плантацій і промисловості, що належать іноземцям. Нам потрібні здібні люди, щоб просувати цю програму вперед. Нйоно виступає від імені робітників, Сетяджіт — від імені партійної інтелігенції. Разом вони подбають про те, щоб революція була організована від фабричних цехів до урядових кабінетів."
 INS_nav_bomber_equipment_2_short:0 "Fokker T.VIII"
 INS_nsm_amsterdam_name_normal:0 "NSM Amsterdam"
 INS_pontianak_to_balikpapan_desc:0 "Ідея будівництва залізниці на Калімантані обговорювалася детально, але суворий, здебільшого недосліджений ландшафт у центрі острова робить це складним завданням. Єдине рішення — U-подібна залізниця від узбережжя до узбережжя. Це буде недешево, але в довгостроковій перспективі це окупиться."
 INS_propoganda_mission_desc:0 "Партійні організатори мають бути направлені по всій території [FROM.GetName] для створення гуртків читання, вербування серед профспілок та донесення ідей революції до сіл. Насіння, яке ми сіємо сьогодні, досить скоро принесе плоди."
 INS_purge_oppurtunists_tt:0 "Відкриває §Y$INS_launch_revolution$§! у країнах із §Y60%§! або більше підтримки комуністів. Країни, в яких ми розпалюємо революції, стануть нашими §Yмаріонетками§!."
 INS_reorganize_freedom_fighter_militia_recon_tt:0 "Додає §Y1 $recon$ батальйон§! до шаблону §Y«Борці за свободу»§!."
 INS_request_ceylon_decision:0 "$INSHOL_request_ceylon$"
 INS_revolution_events.21.a:0 "Скільки ще життів має бути втрачено?"
 INS_revolution_events.26.a:0 "Цікавий розвиток подій."
 INS_revolution_events.30.t:0 "[INS.GetLeader] пропонує локальну угоду про припинення вогню"
 INS_revolution_events.43.a:0 "Ми повинні продовжувати наші зусилля."
 INS_scout_plane_equipment_0:0 "Fokker C.XI"
 INS_socialist_loyalty:0 "Уряд підтримують соціалістичні партії"
