 JAP_stolen_equipment_idea:0 "Пограбовані військові склади"
 JAP_submarine_1_desc:0 "Підводні човни класу «Kaichu» були побудовані після Першої світової війни на базі більш ранніх підводних човнів. Ці підводні човни середнього розміру були достатньо озброєні, мали хорошу оперативну дальність плавання і швидкість для свого часу, але до 1938 року вони дещо застаріли. Всього для Імперського флоту було побудовано 42 човни типу «Kaichu», а серія включала 7 варіантів."
 JAP_sue_for_peace_nuke_desc:0 "Ворог застосував нову найжорстокішу бомбу. Війна розвивається не обов'язково на нашу користь. Ми повинні терпіти нестерпне."
 JAP_sway_disillusioned_young_officers_2_tt:0 "Трохи більша частина §YІмператорської армії§! перейде на наш бік під час §YГромадянської війни§!"
 JAP_the_art_of_warfare_desc:0 "В історії Східної Азії є багато великих тактиків і воїнів, про яких складено легенди, але мало хто наближається до майстра стратегії Сунь-цзи. Можливо, у нього є дещо, чого ми можемо навчитися, щоб наші плани з часом ставали надійнішими."
 JAP_the_divine_wind:0 "Божественний вітер"
 JAP_the_first_five_year_plan_desc:0 "Щоб забезпечити майбутнє нашого народу, ми повинні створити комітет, здатний розробити та впровадити сміливу нову економічну модель для [ROOT.GetNameDef]. Ця нова п'ятирічка дозволить нам по-справжньому розквітнути і процвітати!"
 JAP_the_five_great_cities_desc:0 "Міста Кіото, Осака, Йокогама, Кобе та Наґоя отримали особливий статус, який надає їм різні спеціальні положення, недоступні для звичайних міст, з метою сприяння їх індустріалізації та урбанізації, з кінцевою метою стати спеціальними містами, незалежними від префектур. Ми повинні збільшити наші інвестиції в цю ініціативу."
 JAP_the_surrender_broadcast_desc:0 "Ми глибоко замислилися над загальними тенденціями світу і поточним становищем Імперії, і вирішили вжити надзвичайних заходів, щоб покласти край нинішньому стану справ. Військова ситуація склалася не обов'язково на користь Японії, і ми повинні прийняти цей факт."
 JAP_tojos_premiership:0 "Прем'єрство Тоджо"
 JAP_trans_pacific_influence:0 "Транстихоокеанський вплив"
 JAP_uplift_ainu_revolution_theory:0 "Підтримати теорію революції айнів"
 JAP_yokosuka_naval_air_technical_arsenal_desc:0 "Військово-морський авіаційно-технічний арсенал Йокосука стане ключовим у забезпеченні нашого нового авіаносного флоту найсучаснішими літаками. Він зосередиться на створенні кращих проєктів для масового виробництва такими компаніями, як Аїчі Кокукі, Кюшю Хікокі Кабушікі-ґайшя, та складання у Військово-морському арсеналі Хіро."
