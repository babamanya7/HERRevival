 AFG_central_asia_neutrality_DEF:0 "Королівство Дар'я"
 AFG_contact_rural_loyalists_desc:0 "[AFG.GetAdjective] еліту легко підкупити або вплинути. Середній [AFG.GetAdjective], навпаки, мало цікавиться матеріальними дрібницями чи політичними обіцянками. Однак, звертаючись до їхніх традиційних цінностей та скарг, ми все ще можемо схилити їх до нашої справи."
 AFG_demand_end_to_fascist_influence:0 "Вимагати припинення фашистського впливу в Афганістані"
 AFG_democratic_DEF:0 "Королівство Афганістан"
 AFG_democratic_influence_desc:0 "Через відкриття нашої країни для іноземних інвестицій інші країни використовують цю можливість, щоб впливати на нашу політику."
 AFG_enforce_the_pashtunwali_desc:0 "Хоча правила Пуштунвалі можуть бути застарілими, їх все ще необхідно підтримувати, щоб забезпечити домінування пуштунів у внутрішній політиці. Найбільш застарілі частини законів можуть бути скориговані, але вони залишаться чинними на покоління вперед."
 AFG_expand_quami_template:0 "Реформувати куамі"
 AFG_industrial_events.15.a:0 "Справу закрито."
 AFG_industrial_events.16.a:0 "Цього слід було очікувати."
 AFG_industrial_events.21.desc:0 "Наші друзі в [FROM.GetNameDef] оголосили про свій намір інвестувати значні суми грошей в індустріалізацію нашої країни. Хоча це велика економічна вигода для нас, ми повинні залишатися пильними, щоб [FROM.GetAdjective]s не використали це для надмірного впливу на нашу політику."
 AFG_industrial_events.33.desc:0 "Уряд [FROM.GetNameDefCap] відмовився від будь-яких подальших переговорів щодо розробок уздовж річки Гільменд, посилаючись на те, що будь-яка вода, яка проходить через їхню територію, належить їм, і вони можуть робити з нею, що завгодно. Поступка їм на цьому етапі може зрештою спонукати їх повністю перекрити потік води в майбутньому. Однак будь-яка подальша ескалація на цьому етапі вимагатиме від нас звернення до збройного конфлікту."
 AFG_industrial_events.37.t:0 "[FROM.GetAdjective] Сили готуються до вторгнення"
 AFG_industrial_events.57.t:0 "[FROM.GetAdjectiveCap]ий уряд відмовляється від претензій"
 AFG_infantry_equipment_2:0 "Sten MkII"
 AFG_kajaki_dam_desc:0 "Ми повинні взяти за натхнення Управління долини Теннессі в [USA.GetNameDef] та створити подібне агентство для долини річки Гільменд. Організація матиме завдання економічного розвитку району на благо національної економіки. Однак ми повинні остерігатися провокувати наших західних сусідів, якщо почнемо змінювати русло річки."
 AFG_khorasan_democratic:0 "Республіка Хорасан"
 AFG_maintain_neutrality_desc:0 "Незважаючи на відносну внутрішню стабільність, глобальна ситуація стає дедалі небезпечнішою. Перш ніж нас втягнуть у будь-які конфлікти проти нашої волі, ми повинні чітко дати зрозуміти всім, що ми залишаємося нейтральною нацією."
