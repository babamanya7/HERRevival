 SPA_expand_influence_in_the_western_aragon_garrison_mission:0 "Оспорюється вплив на гарнізон у Західному Арагоні"
 SPA_fuse_the_parties_tt:0 "§GБуде видалене завдання: §Y$SPA_carlist_uprising_mission$§!.§!\n"
 SPA_garrison_control_republicans_total_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Gповний§!\nКількість дивізій на початку громадянської війни: §Y3§! націоналістичні — §Y0§! республіканських§!\n"
 SPA_light_tank_equipment_2:0 "Verdeja 1"
 SPA_prepare_the_pyrenees_defenses_desc:0 "До нас дійшли чутки, що республіканці звернулися до держави [FRA.GetNameDef] зі своїми благаннями про допомогу. Хоча це малоймовірно, ми не можемо ризикнути, що це правда, і залишити наші північні кордони незахищеними. Підготовка до оборони повинна бути розпочата негайно в разі втручання [FRA.GetAdjective]их військ."
 SPA_restore_the_iberian_union_desc:0 "Майже чотири століття минуло відтоді, як Іспанія та Португалія востаннє розділили долю, тривалу, але надто коротку. Разом Іберія сильніша, тому ми забезпечимо «відкриття» нових претензій на португальський трон..."
 SPA_ricardo_rada:0 "Рікардо де Рада-і-Перал"
 SPA_tackle_the_vulnerable_fronts_desc:0 "На окремих ділянках ворожого фронту спостерігаються вразливі місця. Ми повинні зосередитися на цих напрямках, щоб максимізувати ефект наших наступальних дій."
