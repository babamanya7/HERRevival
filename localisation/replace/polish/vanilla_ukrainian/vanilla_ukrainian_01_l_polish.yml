 SWI_add_fallout_to_opinion:0 "Будуть наслідки"
 SWI_adopt_romansh_desc:0 "[ROOT.GetName] не є країною, утвореною регіонами [GER.GetAdjective], [FRA.GetAdjective] і [ITA.GetAdjective], на які мають претендувати наші жадібні сусіди. [ROOT.GetName] — єдина, неподільна мультикультурна нація. Прийняття руманчської мови, якою розмовляють лише в горах наших [ROOT.GetAdjective] Альп, покаже їм, що наша культура та цінності відрізняються від їхніх, незалежно від мови."
 SWI_air_production_ns:0 "Швайцарське виробництво літаків"
 SWI_artillery_desc:0 "Нехай снаряди дощують на наших ворогів, коли наші сили просуваються. Артилерія дозволить [ROOT.GetNonIdeologyName] захищатися з гір і кидатися вперед найефективнішим способом, розгромивши опозицію під дощем свинцю."
 SWI_ban_national_movement_for_switzerland:0 "Заборонити Національний рух Швайцарії"
 SWI_ban_the_communist_party_desc:0 "Комуністичні партії становлять велику небезпеку для [SWI.GetNameDef]. Незважаючи на відстань між нами та [SOU.GetNameDef], їхній революційний вплив відчувається в повітрі. Ми не можемо ризикнути дестабілізувати нашу країну в такі небезпечні часи, тому ми повинні діяти швидко і заборонити будь-яку партію, яка прагне перевернути і підірвати наш уряд."
 SWI_centralization_bop_balanced:0 "Баланс між радою та кантонами"
 SWI_communism_party_long:0 "Комуністична партія Швайцарії"
 SWI_concessions_to_political_party_desc:0 "Наша жорстка позиція щодо [ROOT.GetAdjective]. [FROM.GetRulingIdeology] може відштовхнути [FROM.GetAdjective]ий народ і спровокувати дипломатичний інцидент або, що ще гірше, вторгнення. Можливо, настав час пом'якшити нашу позицію щодо [FROM.GetRulingIdeologyNoun_RU_lower_Gen]."
