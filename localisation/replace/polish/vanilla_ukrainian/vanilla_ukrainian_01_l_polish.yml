 radar_station_desc:0 "Радар дозволяє Вам отримувати дані про ворожі війська в зоні покриття.\nВищий рівень радара в області збільшує радіус дії.\nРадар також дозволяє краще помічати ворожу авіацію в регіоні, збільшуючи шанси Ваших льотчиків на успіх.\nКрім того, радар поліпшує виявлення ворожих флотів."
