 INSHOL_destroyers_desc:0 "Наші важчі бойові кораблі не можуть діяти у вузьких морях архіпелагу без ескорту для прикриття. Заклавши сучасні есмінці, [ROOT.GetAdjective] флот зможе охороняти свої судноплавні шляхи та відганяти торпедні катери в протоках."
 INSHOL_east_indies_fokker_division_desc:0 "Ліцензії Fokker настільки широко використовуються ВПС Ост-Індії, що варто розглянути можливість створення окремої філії, що надаватиме пріоритет ВПС Ост-Індії."
 INSHOL_java:0 "$HOL_java$"
 INSHOL_mass_mobilization_desc:0 "Ми не зможемо виграти цей конфлікт і розгромити Республіку без добре оснащеної армії. Ми маємо переозброїти Ост-Індію та перенаправити фінансування з цивільних секторів до KNIL."
 INSHOL_nationalist_coallition_tt:0 "§Y$INS_sutan_sjahrir$§! та §Y$INS_mohammad_hatta$§! будуть доступні як лідери країни після завершення фокусу §Y$INSHOL_democracy$§!."
