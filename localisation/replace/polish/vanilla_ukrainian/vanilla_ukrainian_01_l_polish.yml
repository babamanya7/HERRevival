 BUL_opression_dispose_of_zveno_generals_desc:0 "Ризик того, що [GetZvenoName] влаштує переворот, цілком реальний, і тому ми позбавимося всіх генералів, близьких до цієї організації або до колишнього Військового союзу, або перевівши їх в резерв, або звільнивши з армії."
 BUL_opression_repress_bzns_desc:0 "Не можна байдуже дивитися, як дисиденти й агітатори поділяють наш народ. Те, що роблять члени $BUL_bzns_name_gen$ з нашим урядом, спричинить серйозні наслідки."
