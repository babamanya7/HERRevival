 central_planning_desc:0 "Тепер у плануванні операції беруть участь офіцери всіх пологів військ, що дозволяє досягти максимальної ефективності."
 change_leader_rules:0 "Коли наш лідер може змінюватися?"
 china.1.d:0 "Японські солдати недавно атакували стратегічно важливий міст Марко Поло ледь південніше від Пекіна, але були відбиті нашими хоробрими солдатами. Безсумнівно, ця подія була влаштована для того, щоби звинуватити нас і змусити віддати ще більше територій — як після Мукденського інциденту, коли японці захопили Маньчжурію.\n\nЯк нам відповісти?"
 china.100.t:0 "Китай піддається тривалій атаці"
 china.104.d:0 "Китай атакований. Воєначальники відкладають свої відмінності для спільної боротьби проти загарбницьких військ Японії. Це можливість просунути інтереси КПК, показавши народові Китаю, що ми — істинне майбутнє Китаю, а не занепалий Ґоміньдан. Чи потрібно приєднуватися до боротьби й забезпечити краще майбутнє Китаю?"
 china.108.a:0 "Потрібно зміцнити наші ряди."
 china.109.d:0 "Час позбавити Китай від хвороби, що зветься Ґоміньданом. Ми звільнимо кожного китайця й об'єднаємо народ під мудрим керівництвом Мао."
 china.202.a:0 "Ми мусимо придушити цю комуністичну загрозу!"
 china.6.a:0 "Озброїти місцевих воєначальників для бою."
 china.6.c:0 "Сподіватися на добровольців, що підуть проти комуністів."
 china.6.tt_2:0 "§YЯкщо КНР вирішить відступити:§!\n"
 china.7.d:0 "Хоч ми й уникнули повного розгрому крізь Великий похід, націоналісти не дозволять нам стати сильнішими без ще одної сутички. Наші агенти вважають, що вони готують наступ на нас, що послабить нашу політичну підтримку, якщо ми відступимо ще далі.\n\nМи не знаємо, наскільки Ґоміньдан зараз відданий реалізації цього плану. Спроби протистояння мають великий ризик. Якщо місцеві воєначальники підтримають цю атаку, наші шанси будуть дуже малі. З іншого боку, відступати зараз, коли ми тільки-но зупинилися, не дуже хороший варіант."
 chinese_puppet_focus_desc:0 "Китай уже довів, що не хоче воювати з нами. Можливо, китайських лідерів сильніше лякає внутрішній розкол. Ми можемо запропонувати їм захист від комуністів і генералів, що бунтують, і вступ у Велику східноазійську сферу співпроцвітання."
