 wtt_border_incident_defender_warning.1.a:0 "Мобілізуйте всі доступні війська!"
 wtt_china.10.t:0 "[FROM.GetName] вимагає підкорення"
 wtt_china_shared.1.t:0 "[From.GetNameDefCap] пропонує підтримку"
 wtt_china_shared.11.b:0 "Їм доведеться задовольнятися тим, що в них є."
 wtt_china_shared.12.a:0 "Надішліть Джозефа Стілуелла."
 wtt_germany.1003.desc:0 "[From.GetAdjective]ий уряд після тривалого засідання парламенту вирішив відхилити прохання про повернення британських титулів перів та королівських титулів представникам королівського сімейства та князівських родів Німеччини."
 wtt_germany.11.d:0 "Німці здійснили свій план, і сьогодні Муссоліні застрелили у своєму автомобілі на вулицях Рима. Влада правління взяв у свої руки король Віктор Еммануїл III, який поклявся підтримувати Центральні держави разом з державою [From.GetNameDef]."
 wtt_germany.18.d:0 "Ми нарешті розібралися зі зрадниками Батьківщини. Тепер громадяни, які нас підтримують, можуть повернутися додому. На нас чекає довгий і важкий процес відновлення зруйнованої держави. Керівники країни можуть вільно вибрати один із шляхів розвитку: перехід до демократії або повернення до монархії.\n\nАле спочатку потрібно вирішити одне питання. В кінці громадянської війни наші війська арештували багато лідерів нацистської верхівки. Ми мусимо вирішити, що зробити з цією темною сторінкою нашої історії."
 wtt_germany.28.d:0 "Німецька імперія скасувала вигнання Вільгельма II і звернулася до Нідерландів із вимогою повернути колишнього кайзера. Схоже, незважаючи на численні вимоги екстрадиції з метою закликати кайзера до відповідальності, що раз у раз відхиляються урядом Нідерландів, цей розпалювач війни знову очолить Німецьку імперію."
 wtt_germany.29.d.2:0 "Німецька імперія скасувала вигнання Вільгельма II і звернулася до Нідерландів із вимогою повернути колишнього кайзера. Нідерландці відмовилися, і ця суперечка переросла у військовий конфлікт!\n\nФранція вже заявила, що це неприйнятно, і, схоже, має намір висунути ультиматум, підкріплений військовою силою. Громадськість Великобританії налаштована проти війни, але якщо ми відмовимося підтримати Францію, наш союз із нею буде розірваний."
 wtt_germany.43.b:0 "Нога їхня більше не ступить на Далекий Схід!"
 wtt_germany.51.t:0 "Відновити у положенні взятих у полон керівників-нацистів?"
 wtt_infiltration.3.a:0 "Викорінимо тих, кого ми знайшли!"
 wtt_japan.120.desc:0 "Представники держави [From.GetNameDefCap] повідомили, що відкидають пропозицію щодо обміну Південного Сахаліну на військову підтримку."
 wtt_news.2.desc:0 "Незабаром після оголошення про те, що Німеччина має намір повернути вигнаного Вільгельма II, влада Нідерландів несподівано блокувала кортеж старого кайзера на кордоні з Німеччиною і змусили його повернутися до своєї резиденції в Дорні.\n\nВ офіційному комюніке нідерландці стверджують, що побоюються дестабілізації обстановки в Європі у зв'язку з можливим поверненням на трон Вільгельма II, і тому уряд Нідерландів узяв на себе відповідальність повернути старого кайзера під домашній арешт.\n\nНімеччина поки що не відповіла на цю заяву, але обурена громадськість також вимагає застосувати військову силу для повернення кайзера.\n"
 wtt_news.22.t:0 "[From.GetName] оголошує про створення Центральноєвропейського альянсу"
 wtt_news.32.a:0 "А які у них плани на нас?"
 wtt_news.36.d:0 "Трагічний випадок."
 wtt_news.39.t:0 "Кампанія з умиротворення Китаю"
 wtt_news.4.b:0 "Це дурний крок із боку нідерландців."
 wtt_news.42.d:0 "Ми усунули перешкоду..."
 wtt_news.42.e:0 "Ефект відчують усі."
 wtt_news.46.a:0 "Це пряма загроза."
 wtt_news.48.b:0 "Повернімо собі велич!"
 wtt_news.51.c:0 "Початок кінця?"
 wtt_news.67.a:0 "Мрію Зейдана здійснено."
 wtt_news.70.a:0 "Aquila Elegit Iovis Omnia Vincit!"
 wtt_political_organisation.10.desc_not_majority:0 "[old_majority_country.GetLeader] стрімко втрачає підтримку в області [state.GetName] після серії вибухів, які знищили місцевий штаб його партії. За цими терактами, скоріш за все, стоїть [majority_country.GetLeader], який пообіцяв «навести лад» в області [state.GetName]. Незабаром переважна більшість громадян підтримала взятий ним курс."
 wtt_political_organisation.6.desc_has_majority:0 "Ми отримали тривожні новини з області [state.GetName]. Мітинги, де виступав [From.GetLeader], зібрали рекордну кількість учасників,а наших місцевих партійних функціонерів обложив натовп розлютованих громадян, стурбованих майбутнім області [state.GetName]. Ми продовжуємо утримувати наші позиції в цій області, але ситуація може змінитися будь-якої миті."
 wtt_prc.20.b:0 "Мобілізувати війська та готуватися до війни."
 wtt_soviet_hold_city_o_fail:0 "Несуттєва перешкода."
 wtt_take_national_leadership.1.t:0 "[From.GetLeader] готовий взяти владу у свої руки"
 wtt_take_national_leadership.3.desc:0 "Незважаючи на приголомшливу народну підтримку, якою користується [new_leader.GetLeader], [From.GetLeader] відмовився піти у відставку з посади глави республіки [From.GetLeader] заявив, що не підкориться вимогам шантажистів і не віддасть країну на пограбування зрадникам та злочинцям. Він чітко дав зрозуміти, що не залишить свою посаду."
 wtt_warlord.3.a:0 "Ми станемо сильні та покажемо їм."
 wtt_warlord_vs_prc.21.b:0 "Це грабіж!"
 wtt_warlord_vs_prc.31.desc:0 "[From.GetLeader] у своєму посланні стверджує, що на цій стадії революційної боротьби як ніколи велика ймовірність контрреволюції. Його особливому представнику доручено уважно стежити за подіями в нашій країні і давати нам поради, як досягти перемоги в класовій боротьбі. проникли реакційні елементи, і що необхідно вжити відповідних заходів."
 wtt_warlord_vs_prc.32.desc:0 "[From.GetLeader] тепло прийняв нашого особливого представника та призначив його своїм особистим радником. Тепер ми контролюємо їхню внутрішню та зовнішню політику."
 wtt_xian_incident.1.b:0 "Не йти."
 wtt_xian_incident.10.desc:0 "Замість очікуваного показового суду та подальшої страти комуністи повідомили, що вони вважають за краще укласти союз проти японців. \n\nБезперечно, вони тягнуть час, знаючи, що ще один гарний удар їх прикінчить. Якщо вони справді хотіли б бачити лідера [CHI.GetLeader] мертвим, то давно стратили б його.\n\nТим не менш, декотрі представники нашого уряду міркують, навіщо комуністам укладати союз саме зараз — може вони знають щось, чого не знаємо ми?"
 wtt_xian_incident.6.desc:0 "Незважаючи на наші доводи та вимоги зупинити цю безглузду війну, [From.GetLeader] відмовився від ідеї створення об'єднаного фронту із комуністами. Зрозуміло, що необхідно вживати більш рішучих заходів. Може, варто заарештувати його та передати комуністам?"
 wtt_xian_incident.8.a:0 "Відправте війська!"
 wuw_GER_chinese_diplomacy.5.a:0 "Чудова ініціатива!"
 wuw_GER_chinese_diplomacy.7.a:0 "Вони не розуміють, чого втрачають"
 wuw_GER_diplomacy.10.a:0 "Ми не сміємо сказати «ні»..."
 wuw_GER_diplomacy.117.b:0 "Ми ніколи не підкоримось!"
 wuw_GER_diplomacy.2.t:0 "[FROM.GetNameDefCap] приймає нашу торговельну пропозицію"
 wuw_GER_diplomacy.29.t:0 "Старий союзник пропонує торгову угоду"
 wuw_GER_diplomacy.31.desc:0 "Попри наші історичні зв’язки та очевидні вигоди, [FROM.GetNameDef] відмовились від торговельної угоди, яку ми запропонували. Ця угода могла б зміцнити наші відносини й розширити торговельні зв’язки. Але, на жаль, [FROM.GetAdjective] мають інші плани."
 wuw_GER_diplomacy.37.t:0 "[FROM.GetNameDefCap] передає території нам"
 wuw_GER_diplomacy.52.t:0 "[FROM.GetNameDefCap] відхиляє співпрацю у військово-морському розвитку"
 wuw_GER_diplomacy.66.a:0 "Шкода"
 wuw_GER_diplomacy.91.a:0 "У нас є потрібні люди..."
 wuw_GER_diplomacy.96.t:0 "[FROM.GetNameDefCap] погоджується на промислову співпрацю"
 wuw_GER_german_politics.02.c:0 "Нам потрібен прагматичний соціаліст!"
 wuw_GER_legions.1.desc:0 "Після нашого оголошення про намір відновити кордони Брест-Литовського мирного договору, кілька грузинських генералів та солдатів у вигнанні звернулись до нас із бажанням допомогти у відвоюванні їхньої батьківщини в обмін на обіцянку відновлення грузинської держави та надання їй влади над Кавказом. Чи варто прийняти їхню допомогу?"
 wuw_GER_legions.8.a:0 "Їхнє знання степів Кубані буде цінним"
 wuw_GER_military_events.2.desc:0 "Після серії інтенсивних бомбардувань нашої військової промисловості спливла на диво незвична історія. Незважаючи на чіткий наказ збивати кожен ворожий літак у нашому повітряному просторі, один із пілотів — Франц Штіґлер — відмовився виконати наказ. Зустрівши пошкоджений бомбардувальник одразу після нальоту, він вирішив не відкривати вогонь. За його словами, стріляти в нього було б так само аморально, як і стріляти в солдатів з парашутом. Після спроб переконати екіпаж посадити літак у [GER.GetNameDef] або відлетіти до нейтральної території, Штіґлер, не отримавши відповіді, провів їх до безпечного місця.\n\nФранц Штіґлер — талановитий пілот, але якщо його поведінка повториться, це може створити для нас серйозні проблеми."
 wuw_GER_monroe.2.t:0 "Доктрина Монро руйнується"
 wuw_GER_realpolitik.10.a:0 "Можливо, вони зможуть захистити нас від [SOV.GetAdjective]их сил."
 wuw_GER_realpolitik.17.a:0 "Якщо цього вимагає ситуація..."
 wuw_GER_realpolitik.25.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 wuw_GER_realpolitik.26.t:0 "[FROM.GetNameDefCap] запитує про торговельні угоди"
 wuw_GER_realpolitik.27.t:0 "Громадянська війна в [ROOT.GetNameDef]"
 wuw_GER_realpolitik.3.a:0 "Вони втрачають можливість..."
 wuw_GER_realpolitik.38.b:0 "[FROM.GetNameDefCap] — це [ROOT.GetAdjective]!"
 wuw_GER_realpolitik.4.t:0 "[FROM.GetNameDefCap] надсилає військову допомогу"
 wuw_GER_realpolitik.50.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відкинув нашу ініціативу щодо розподілу старих чехословацьких земель Австро-Угорщини. Схоже, угода зірвалася..."
 wuw_GER_realpolitik.60.desc:0 "Економічної інтеграції виявилося недостатньо — [FROM.GetLeader] з [FROM.GetNameDef] тепер вимагає нашої повної інтеграції до їхньої держави. Якщо ми не розірвемо зв’язки зараз, це буде кінець нашої незалежності. Як нам діяти?"
 wuw_GER_reichskommissariats.17.c:0 "Її слід включити до Богемії-Моравії"
 wuw_GER_reichskommissariats.26.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.27.t:0 "Керівництво Австралазії"
 wuw_GER_reichskommissariats.7.t:0 "Керівництво Туркестану"
 wuw_GER_weltpolitik.4.a:0 "Це взаємовигідна угода"
 wuw_GER_weltpolitik.6.a:0 "У такому разі — воно буде повністю нашим!"
 wuw_HUN_a_revolutionary_greater_hungary_desc:0 "З поверненням наших кордонів настав час зробити наступний крок. Ми проголосимо Союз Паннонських Соціалістичних Республік — державу для всіх народів, незалежно від національності. Тепер ми можемо зосередитися на поширенні світової революції."
 wuw_HUN_denounce_marxism_leninism:0 "Засудити марксизм-ленінізм"
 wuw_HUN_doctrinal_studies:0 "Доктринальні дослідження"
 wuw_HUN_extensive_licensing_programs_desc:0 "Іноземні військово-повітряні сили вже мають перевірені якісні моделі. Замість того, щоб ризикувати, покладаючись на наш досвід, ми повинні отримати дозвіл на ліцензійне виробництво цих моделей."
 wuw_HUN_form_the_gyorshadtest_desc:0 "Ми маємо сформувати Швидкісний корпус — сучасне механізоване з'єднання, здатне перемагати ворога. Буде створено дві дивізії Gyorshadtest: під командуванням генералів Єньо Майора та Ференца Бізи."
 wuw_HUN_increase_economic_cooperation_desc:0 "Наш уряд відкритий до співпраці із сусідами та міжнародними партнерами. Ми повинні укладати нові торгові угоди та економічні пакти з нашими союзниками."
 wuw_HUN_news_events.1.a:0 "Вони щось задумали..."
 wuw_HUN_news_events.3.a:0 "Дуже тривожно"
 wuw_HUN_news_events.9.t:0 "[HUN.GetNameDefCap] окуповує Бурґенланд"
 wuw_HUN_officialize_the_rakosi_battalion_desc:0 "Сміливі [ROOT.GetAdjective] чоловіки завжди борються за краще майбутнє, навіть за кордоном. Ми повинні підтримати таких людей офіційно, щоб нести революцію тим, хто її потребує."
 wuw_HUN_our_ancestral_lands:0 "Наші прадавні землі"
 wuw_HUN_reestablish_the_rongyos_garda:0 "Відновити Rongyos Gárda"
 wuw_HUN_reinstate_the_navy:0 "Відновити Haditengerészet"
 wuw_HUN_restore_the_hungarian_red_army_desc:0 "Кожен патріот повинен захищати Батьківщину. Ми створимо Угорську Червону Армію за зразком радянської, щоб захистити нашу революцію."
 wuw_HUN_secret_rearmament_desc:0 "Обмеження, накладені на нас Тріанонським договором, забороняють збільшення чисельності армії. Проте політична ситуація у світі дедалі загострюється, і конфлікт вже на горизонті. Ми не можемо залишатися беззахисними і повинні почати переозброєння, навіть якщо це означатиме таємне порушення умов мирного договору після Великої війни."
 wuw_HUN_seek_an_alliance_with_the_kaiser:0 "Шукати союз із кайзером"
 wuw_HUN_sway_the_count:0 "Схилити графа"
 wuw_HUN_szent_laszlo_infantry_division_desc:0 "Ми маємо створити нові піхотні частини для захисту батьківщини. Одну з них слід назвати на честь Святого Ласла, короля Угорщини й покровителя воїнів."
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen_desc:0 "У складі Австро-Угорщини нас знали як Землі Корони Святого Іштвана або Транслайтанія. Першим кроком до відродження імперії буде відновлення цієї назви."
 wuw_HUN_the_old_grand_alliance:0 "Відновити Великий альянс"
 wuw_HUN_the_turul_association_desc:0 "Заснована у 1919 році, асоціація 'Турул' підтримувала Горті під час громадянської війни. З 40 000 членів її можна використати для контролю над освітою."
 ww_BEL_event_diplomatic.34.a:0 "Французи — наші друзі"
 ww_BEL_event_diplomatic.7.t:0 "Бельгія хоче обміняти Кале"
 ww_BEL_event_political.8.a:0 "Нідерландська — наша мова"
 ww_BEL_event_war.2.a:0 "Король Леопольд приведе нас до перемоги."
 ww_congo.1.t:0 "Бельгія інвестує у наш розвиток"
 ww_congo.12.a:0 "Дурні!"
 ww_congo.17.b:0 "Час довести, що ми два рівні та незалежні країни"
 ww_congo.27.b:0 "Це знак, що потрібні великі зміни"
 ww_congo.29.desc:0 "Конґолезькі націоналісти, що називають себе Національним комітетом за визволення, готують війну за незалежність проти своїх господарів. Вони обіцяють, що стануть ближчими до нас, коли війна буде виграна, за умови, що ми надамо їм зброю, коли бої почнуться, і стверджують, що ослаблена [BEL.GetName] є в наших інтересах."
 ww_congo.31.desc:0 "Наші дипломати повернулися з переговорів з [FROM.GetAdjective] військовими з порожніми руками. Здається, угода не була досягнута, і наші нібито союзники зрадили нас..."
 ww_congo.35.t:0 "[COG.GetNameDefCap] підбурює колоніальний спротив"
 ww_congo.47.b:0 "Ні, нам потрібен хтось інший!"
 ww_congo.63.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], звернувся до нас з цікавою пропозицією. Виявляється, що уранові родовища в їхній країні багатші, ніж очікувалося, і зараз обговорюються ідеї контрабанди деякої частини сировини до нашої країни за певну ціну."
 ww_congo.66.a:0 "Ну, це жаль..."
 ww_congo.70.desc:0 "Наш пілот Ян Зумбах залишив нас і вирішив приєднатися до боротьби за ВВС Великої Британії. Його рішення покинути своїх товаришів було важким, але ми повинні аплодувати йому за бажання боротися за незалежну Польщу, вільну від гноблення."
