 ARG_paraguayan_ultimatum.tt:0 "([PAR.GetFlag]§Y[PAR.GetNameDefCap]§!) отримує подію «§Y$ARG_political_events.19.t$§!», яка вимагатиме, щоб вони стали нашою §Yмаріонеткою§!. Вони, ймовірно, погодяться, якщо мають §Gвисоку думку про нас§!."
 ARG_political_events.80.b:0 "Фінансувати промислову освіту."
 ARG_political_events.83.desc:0 "Коли ми відкрили наш новітній освітній грант, нас зустріли гучні похвали від науковців по всій країні. Оскільки ми вирішили зосередитися на навчанні людей сучасній синтетичній переробці, ми можемо очікувати стійкого буму прогресу в наших дослідницьких відділах."
 ARG_political_events.90.t:0 "Спільні військові навчання з [ARG.GetNameDef]"
