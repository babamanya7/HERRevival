 germany.125.t:0 "[FROM.GetNameDefCap] передає Судети державі [GER.GetNameDef]"
 germany.23.t:0 "Мемель: [FROM.GetNameDef] відмовилась"
 germany.40.d_3:0 "Недавно були висунуті вимоги німців до Чехословаччини про передачу Судетської області, де проживає помітна кількість етнічних німців. [GER.GetLeader] розмістив війська на чехословацькому кордоні, готуючись до війни. Зараз у Мюнхені проводяться переговори між Нідерландами, Британією, Францією, Італією та Німеччиною для досягнення мирного закінчення Судетської кризи. Якою буде позиція Нідерландів?"
 germany.49.d:0 "Нещодавно в Мюнхені були проведені переговори між лідерами Британії, Франції, Італії та Німеччини про обговорення майбутнього Чехословаччини. Як британці, так і французи визнали наші претензії на Судетську область законними, а також скасували підтримку для чехів.\n\nНезважаючи на безнадійність ситуації, вперті чехи відмовляються здати свою територію! Нам доведеться взяти її силою. Уже розроблено план вторгнення з метою стерти цей підлий експеримент Версаля з лиця землі!"
 germany.55.a:0 "Встановити маріонетковий режим у Словаччині."
 germany.57.t:0 "Угорщина відмовилася від нашої пропозиції"
 germany.61.d:0 "Кілька німецьких дивізій нещодавно ввійшли в Райнланд. Уперше з часів Великої війни Німеччина розмістила війська на лівому березі Райну. Це чітке порушення Версальського договору, за умовами якого Німеччині було заборонено ремілітаризовувати цей регіон!\n\nФранцузи мобілізовують свої війська та, схоже, збираються надіслати ультиматум. Якщо Німеччина відмовиться поступатися, французи будуть готові до наступу, щоби розквитатися з цією загрозою. Думка британського народу схиляється проти війни, але якщо ми відмовимо, наш альянс із французами буде розпущено."
 germany.70.a:0 "Захистити фюрера будь-якою ціною!"
 germany.70.d:0 "Група старших офіцерів Вермахта, котра вірила, що Гітлер заштовхнув Німеччину у війну, яку вона не може виграти, влаштувала переворот! Схоже, що її організував голова Абвера полковник Ганс Остер, але також було підтверджено, що в ній брали участь генерали Бек, фон Браухіч і адмірал Канаріс!\n\nВажкоозброєні люди, що в очікуванні сиділи в кількох берлінських квартирах, зійшлися з наміром Райхсканцелярії ліквідувати Гітлера та його найближчих соратників. Зараз у її будівлі проходить запекла стрілянина."
 germany.71.a:0 "Герр Гіммлер поведе нас у майбутнє."
 germany.73.d:0 "Запеклі бої в Райхсканцелярії перетворили будівлю на палаючу руїну. Попри те, що велика кількість солдатів SS кинулася на допомогу Гітлеру, підрозділи армії, вірні змовникам, також вступили в бій і виявилися вирішальними. Підтверджено, що Фюрер загинув, а його давня супутниця Єва Браун була тяжко поранена під час перестрілки. Змовникам вдалося захопити всі урядові будівлі в Берліні.\n\nЗначна частина Вермахту перейшла на бік заколотників, але багато офіцерів залишаються вірними НСДАП. Хто повинен їх очолити?"
 germany.76.t:0 "СРСР прийняв німецько-радянський договір"
 germany.81.t:0 "Передано Данциґ в обмін на Словаччину"
 germany.85.b_tt:0 "§YЦей варіант буде розглянутий як зрада всіма державами, що дотримуються умов пакту (§!думка про нас зміниться на §R-50§!§Y)§!"
 germany.87.a:0 "Польща уникнула війни... поки що."
