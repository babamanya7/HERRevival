 DEN_autonomy_low_range:0 "Низький рівень автономії"
 DEN_bop_criticize_our_preparedness:0 "£BoP_right_texticon Розкритикувати нашу готовність"
 DEN_bop_criticize_the_country_leader:0 "Розкритикувати: [DEN.GetLeader]"
 DEN_bop_motion_of_no_confidence_desc:0 "Нинішній уряд, здається, нездатний на будь-які розумні дії, щоб врятувати [DEN.GetNameDef] і його людей. Потрібне нове рішуче керівництво! Rigsdagen повинен висловити «вотум недовіри» керівництву лідера [DEN.GetLeader]."
 DEN_bop_occupation_sabotage_mil_industry_desc:0 "Наші вітчизняні збройові заводи виробляють зброю [?DEN.DEN_overlord_nation.GetNameDef] і допомагають [?DEN.DEN_overlord_nation.GetNameDef] зброєю, зброєю, яка використовується у їхніх війнах. Саботаж на цих заводах зменшить поставки зброї, завдаючи шкоди військовим зусиллям Німеччини, допомагаючи нашим можливим союзникам."
 DEN_claim_sweden_desc:0 "Колись шведи були нашими найзапеклішими суперниками і століттями перебували під нашим пануванням. І на відміну від Данії, Швеція має багато природних ресурсів, необхідних для утримання сучасної армії. Можливо, настав час знову включити Швецію в нашу сферу, відкривши для нас всі її ресурси..."
 DEN_create_danforce:0 "Створити Данфорс"
 DEN_danish_produce:0 "Данська продукція"
 DEN_danish_produce_desc:0 "Бекон і молочні продукти є основою данського експорту, настільки, що під час Великої війни з’явився термін «барони гуляшу» — на позначення тих, хто нажився на торгівлі з Великою Британією та Німеччиною."
 DEN_declare_neutrality_desc:0 "Наша неприєднання під час останньої війни послужило нам добру службу і вберегло нас від жахів війни. Проголошення нашого нейтралітету може врятувати нас знову."
 DEN_deploy_the_home_guard:0 "Розгорнути Народну гвардію в області [FROM.GetName]"
 DEN_develop_greenland:0 "Розвиток Ґренландії"
 DEN_economic_mobilization_strategy:0 "Стратегія економічної мобілізації"
 DEN_emmanuel_briand_de_crevecoeur:0 "Емманюель Бріан де Кревкьор"
 DEN_encourage_paramilitary:0 "Заохочення воєнізованих організацій"
 DEN_expand_institut_for_teoretisk_fysik:0 "Розширити Teoretisk Fysik"
 DEN_expand_vaernepligten_desc:0 "Збройні сили є лише символічною силою, абсолютно нездатною стримувати абияких можливих загарбників. Для того, щоб вони стали на справжній захист нації, нам потрібно швидко розширити призов на військову службу."
 DEN_fascist_militarist:0 "Фашист-мілітарист"
 DEN_fascist_propaganda_ns_desc:0 "Брехливі та нечесні фашисти поширюють злісні чутки про наш уряд, намагаючись підірвати нашу владу."
 DEN_frits_clausen:0 "Фрітс Клаусен"
 DEN_greater_denmark_neutrality:0 "Велика Данська імперія"
 DEN_heavy_market_regulations_desc:0 "Промислові компанії з роками стали великими і багатими. Їхній вплив на економіку став викликати занепокоєння у багатьох людей. Ми повинні стримувати їх і поставити під суворий нагляд, щоб переконатися, що вони не ставлять потреби компанії вище за потреби нації."
 DEN_hjemmevaernet_desc:0 "Є багато людей, готових піднятися і захистити Данію від будь-якого агресора. Ми повинні використати бойовий дух цих людей, сформувавши домашню гвардію — на випадок, якщо хтось буде настільки дурним, щоб напасти на нас."
 DEN_industrial_reinvestments:0 "Промислові реінвестиції"
 DEN_integrate_finland:0 "Інтегрувати державу [FIN.GetFlag][FIN.GetNameDefCap]"
 DEN_konservativ:0 "Консервативний політик"
 DEN_military_cooperation_program_desc:0 "Уклавши союз, обидві країни зможуть вчитися одна в одної в рамках спільної програми військового співробітництва. І щоб підсолодити угоду, вони погодилися субсидувати військову техніку, придбану у наших нових союзників, щоб підтримати наші зусилля з переозброєння."
 DEN_military_might:0 "Відродження військової могутності"
 DEN_military_preparations_desc:0 "Підготовка промисловості до нападу виявиться марною, якщо наші армії не зможуть дати відсіч ворогу. Ми повинні зміцнити нашу оборону і переконатися, що наші війська мають дисципліну і нерви, необхідні для того, щоб утримувати лінію фронту."
 DEN_mio_trait_repurpose_triangel_factories:0 "Перепрофільовані заводи «Triangel»"
 DEN_modernize_the_navy_desc:0 "Якщо ми хочемо йти пліч-о-пліч з найкращими військово-морськими силами сучасності, ми повинні прагнути до якості, а не до кількості. Число не допоможе нам, якщо нас переважатимуть за озброєнням і маневреністю більш сучасні кораблі."
 DEN_neutrality_flag:0 "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! є незалежною та не перебуває у стані війни"
 DEN_neutrality_party:0 "Фермерська партія"
 DEN_no_market_regulations:0 "Скасування всіх галузевих регуляторів"
 DEN_nordic_security_desc:0 "Забезпечивши власну незалежність новим альянсом, ми можемо нарешті звернути увагу на решту скандинавських країн. Ми повинні переконати їх приєднатися до нашої фракції, щоб ми могли захищати один одного, а якщо вони не бачать причини, ми зобов'язані захистити їх від них самих."
 DEN_pan_scandinavianism_desc:0 "Скандинавія, і, меншою мірою, весь північний регіон, протягом тисячоліть тісно перепліталися між собою довгою спільною історією. Використовуючи вже тісні зв'язки між нашими народами, ми можемо зробити кроки до об'єднання."
 DEN_prospecting_new_sites_desc:0 "Стара шахта в Каарсуарсуку вичерпала свої запаси, але в регіоні Кулліссат є й інші родовища. Відкриття нової шахти тут було б дуже корисним не лише для промисловості Ґренландії, але й для наших потреб вдома."
 DEN_reclaim_norway_desc:0 "Данська корона правила [NOR.GetNameDef] сотні років до того, як шведи відібрали її у нас у 1814 році. Брат короля, король [NOR.GetNameDef] Хаакон, показав своє небажання взяти на себе прямий контроль і зробити необхідний вибір, щоб захистити свій народ. Настав час знову об'єднати дві країни під владою Данії."
 DEN_restructuring_sovaernet:0 "Реструктуризація ВМС"
 DEN_slaedepatruljen_sirius:0 "Slædepatruljen Sirius"
 DEN_submarine_1_desc:0 "Rota class submarines were built and commissioned in Denmark following the end of World War I. They were small subs and were based on the Holland 602 design. They displaced 290 tons and were armed with four 450mm torpedo tubes."
 DEN_swedish_steel__protection_tt:0 "Буде відкрите рішення: §Y$DEN_swedish_steel_production_category$§!"
 DEN_take_southern_baltic_sea_states_tt:0 "\nМи поставили своїм пріоритетом безпеку нашого південного кордону, а це означає безпеку південного узбережжя Балтійського моря. Цей пріоритет полегшить нам захоплення необхідної території на можливій §Yмирній конференції§!.\n\n"
