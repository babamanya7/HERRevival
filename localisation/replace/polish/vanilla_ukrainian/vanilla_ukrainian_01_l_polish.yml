 SOV_paranoia_is_low_level_tt:0 "£SOV_paranoia_text_icon Політична параноя — менша ніж [?SOV_paranoia_lower_threshold|Y]"
 SOV_pc_of_the_ussr_navy_desc:0 "Оскільки наші ВМС стають все більш сучасними і боєздатними, настав час визнати їх бойовим родом військ, який за важливістю дорівнює армії. Перший крок — дозволити ВМС сформувати окрему від армії адміністрацію."
 SOV_plan_start_of_uprising_odessa_desc:0 "Україна — хороша база для повстання. Це багатий регіон із великими містами, хорошими портами та інфраструктурою. Однак це також означає, що навернути області на нашу сторону буде важче, ніж у менш розвинених регіонах держави [SOV.GetNameDef]."
