 NOR_jacob_hivden_haug:0 "Якоб Гівден Гауґ"
 NOR_medium_tank_equipment_2:0 "Panservogn m/41"
 NOR_military_police_desc:0 "Оскільки опір нашому режиму зростає, нам потрібно отримати інструменти, щоб придушити його в зародку, поки він не загноївся. Досконаліша військова поліція може бути єдиним способом захистити нашу владу, поки люди [NOR.GetName] не дізнаються прийняти новий порядок."
 NOR_modify_kingdom_of_norway_TT:0 "Змінює §Y$NOR_the_kingdom_of_norway$§!: "
 NOR_norwegian_school_of_economics:0 "Норвезька школа економіки"
 NOR_norwegian_school_of_economics_desc:0 "Якщо ми сподіваємося закріпитися у світовій економіці, нам потрібен досвід, і для цього потрібен час. Заснування Norges Handelshøyskole як нашої національної школи економіки є першим кроком для нашої цивільної, а згодом і військової промисловості процвітати."
 NOR_prepare_state_monarchist_desc:0 "Людям області [FROM.GetName] потрібно нагадати про вибори 1905 року та про те, чому вони переважною більшістю голосів обрали його короля на цю посаду. Вони вимагатимуть прямого втручання короля в найкоротші терміни."
 NOR_printing_money_ns:0 "Друкування грошей"
 NOR_ramp_up_naval_production_desc:0 "Незважаючи на нашу відому морську традицію, наші нинішні військово-морські сили не відповідають нашим амбіціям. Ми повинні не шкодувати зусиль на першому кроці, споруджуючи верфі, які живитимуть флот нашого принца та майбутнього короля Олава."
 NOR_restore_public_trust_in_the_storting_desc:0 "Після десятиліть нестабільності та бездіяльності цілком зрозуміло, що населення не має довіри до нашого парламенту, Стортінґу. Без суспільної довіри ми не зможемо проштовхнути заходи, необхідні для приведення нашої країни до стабільності."
 NOR_rolf_fuglesang:0 "Ролф Йорґен Фуґлесанґ"
 NOR_royal_navy_dmod_desc:0 "Наш гордий флот буде плавати морями навколо держави [NOR.GetName] і за його межами. Адже найширша магістраль до нашої країни — це саме Північне море."
 NOR_tank_rikstanken_armor:0 "Саморобна броня"
 NOR_the_seeds_of_the_revolution:0 "Зернята революції"
 NOR_thunes_mekaniske_verksted_organization:0 "Thunes Mekaniske Verksted"
 NOR_trotsky_embraced:0 "§YПрийняв троцькізм§!"
 NOR_unlocking_prep_deploy_allied_dem_TT:0 "Відмикає рішення, які дозволяють використовувати §YНаціональну готовність§! для посилення збройних сил Норвеґії, коли почнеться війна:\n"
 NO_ADVANCE_IN_COMBAT:0 "Військова частина не може просунутися під час бою."
 NO_ORG_TO_FIGHT:0 "Нам потрібно щонайменше §Y$VAL$%§! організації для боротьби."
 NSB_poland_communist_events.2.t:0 "[From.GetNameDefCap] пропонує захист"
 NSB_poland_events.1.desc:0 "Посилаючись на слабку оборонну спроможність держави [Root.GetNameDef], представники держави [From.GetNameDef] вимагають, щоб уся Словаччина перейшла під Польську окупацію. Вони недвозначно загрожують нам неминучим вторгненням у разі ненавмисно. відповімо?"
 NSB_poland_events.2.t:0 "[From.GetLeader] заявляє про права на [Root.GetAdjective] трон!"
 NSB_poland_events.304.a:0 "Ми візьмемо його силою."
 NSB_poland_events.601.desc:0 "Схоже, що, незважаючи на згоду на статус протекторату в 1932 році, [From.GetAdjective] уряд більше не зацікавлений в тому, щоб підтримувати [Root.GetAdjective] інтереси в країні."
 NSB_poland_monarchist_events.601.a:0 "Невже й справді спрацювало?"
 NSB_polish_fascist_events.401.desc.ukraine:0 "Польща днями висунула нам пропозицію щодо повоєнної розмітки кордонів. Згадавши про землі, що відійшли державі [Root.GetNameDef] внаслідок пакту Бека — Ріббентропа, [о] певні територіальні поступки після перемоги у війні. Вони хочуть заглибитися на схід у Білорусь та Україну і взяти собі колишні території Унії."
 NSB_soviet_atomic_bomb_project.2.t:0 "Агента спіймали на крадіжці ядерних секретів"
 NSB_soviet_civil_war_common.102.a:0 "Цікаві настали часи."
 NSB_soviet_civil_war_common.103.desc_exiles:0 "Представник російської емігрантської спільноти в Маньчжурії звернувся до нас із проханням виділити припаси на випадок другої громадянської війни в Росії. В обмін на це, сказав він, змовники готові визнати права держави [ROOT.GetNameDef] на весь острів Карафуто."
 NSB_soviet_civil_war_common.107.a:0 "Прекрасна новина"
 NSB_soviet_civil_war_common.116.t:0 "[FROM.GetNameDefCap] підтримує нашу справу"
 NSB_soviet_fascist_tsarist.29.a:0 "Нехай цей альянс стане останнім словом дипломатії!"
 NSB_soviet_foreign_politics_events.2.a:0 "Що ж, вони у своєму праві."
 NSB_soviet_foreign_politics_events.268.desc:0 "[FROM.GetAdjectiveCap]ий уряд виявив непідробний інтерес до запропонованого нами оборонного пакту проти держави [USA.GetNameDef]. Дипломати, яких відправив [FROM.GetLeader], підписали подану ним угоду. збройні сили зараз пристосовуються до нової ситуації, а їхнє командування впевнене, що спільно ми переможемо державу [USA.GetNameDef] і покінчимо з її впливом на міжнародній арені раз і назавжди."
 NSB_soviet_foreign_politics_events.32.a:0 "А, то вони думали, що ми блефуємо?"
 NSB_soviet_paranoia_system_events.11.desc:0 "[?ROOT.SOV_purged_character_for_loc.GetName] заарештований НКВС за анонімним доносом і звинувачується в шпигунстві, саботажі і змові проти держави. Або він розколеться під допитами, або вдасться зібрати достатньо свідчень від його оточення, готового дати свідчення."
 NSB_soviet_paranoia_system_events.12.a:0 "Таку корупцію треба викорчовувати з коренем."
 NSB_soviet_paranoia_system_events.13.b:0 "Очевидно, що ці звинувачення підлаштовані."
 NSB_soviet_permanent_revolution.1.desc:0 "Троцькісти з держави [FROM.GetNameDef] збуджують народ революційною пропагандою. Вони навіть обіцяють прийти на допомогу [ROOT.GetAdjective] пролетаріату, якщо той повстане проти держави. Ситуація загрожує вийти з-під контролю."
