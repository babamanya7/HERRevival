 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_EXILES:0 "Занадто довго Патріархат перебував у тіні комунізму. Настав час йому знову офіційно зайняти своє законне місце в центрі російського суспільства і культури."
