 SOV_the_last_break_southward:0 "Останній прорив на південь"
 SOV_the_lonely_island:0 "[SOV.GetLonelyIslandName]"
 SOV_the_onslaught_on_colonialism_desc:0 "Імперіалізм і колоніальна експлуатація є життєво важливими частинами пізнього капіталізму. Однак утримання мільйонів людей у рабстві надає нам гігантський революційний потенціал, який ми можемо легко використати. Пригноблені маси в колоніальних імперіях прагнуть зітхнути вільно — і ми розірвемо їхні кайдани."
 SOV_the_peoples_revolution_desc:0 "Для того, щоби революція продовжилася, вона повинна охопити всі аспекти життя суспільства. Тільки якщо весь народ вважатиме себе частиною і носієм революції, він зможе протистояти численним загрозам, з якими стикається."
 SOV_transpolar_flights:0 "Трансарктичні польоти"
 SOV_war_since_purge:0 "Була війна після завершення Великої чистки"
