 CONGO_ccci:0 "CCCI"
 CONGO_ccci_desc:0 "Compagnie du Congo pour le Commerce et l'Industrie — це великий гірничодобувний конгломерат, що активно працює в Конґо. Хоча вони контролюють багато корисних копалин, саме їх металургійні ресурси є тим, що ми хочемо допомогти розвивати."
