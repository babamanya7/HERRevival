 CZE_build_skoda_office_north_america:0 "Побудувати представництво «Шкоди» в Північній Америці"
 CZE_capital_focus_desc:0 "Наш флот повинен зосередитися на прямих та рішучих зіткненнях."
 CZE_cut_carpathia_loose:0 "Відпустити Карпатію"
 CZE_czech_socialism_desc:0 "Централізація влади, звичайно, йде на користь економіці, але з нею можна і переборщити. Можливо, ми зможемо досягти більшої єдності чеських та словацьких рад, допустивши деяку децентралізацію."
 CZE_czechoslovak_union:0 "Чехословацький союз"
 CZE_demand_overlordship_of_yugoslav_league:0 "Вимагати верховенства над [YUG.GetAdjective]ою лігою"
 CZE_dismantle_poland_desc:0 "Тепер, коли виявилася її нездатність захистити себе, стає зрозуміло, що [POL.GetNameDef] не може стати надійною буферною державою проти наших ворогів. Натомість ми повинні перейти до зміцнення нашої власної держави."
 CZE_expand_the_land_department_of_vtu:0 "Розширити сухопутний відділ VTÚ"
 CZE_faction_tech_sharing_desc:0 "Армії Антанти мусять не поступатися один одному, щоби бути повністю ефективними. Для цього ми пропонуємо всім учасникам нашої спілки добровільно обмінюватися один з одним технологіями."
 CZE_favor_czechs_3_desc:0 "Завершивши розвиток старих індустріальних районів Богемії та Моравії, ми мусимо побудувати нові міста для робітників, зайнятих у нашій промисловості, що розвивається."
 CZE_federalization_agreement_1_desc:0 "Федералізація нашої нації має деякі переваги серед очевидних недоліків."
 CZE_federalization_agreement_puppets:0 "Угода про федералізацію"
 CZE_fighter_equipment_0_short:0 "BH-33"
 CZE_heavy_fighter_equipment_2_short:0 "Be-87"
 CZE_heavy_fighter_equipment_3_short:0 "Š-49"
 CZE_increase_military_aeronautical_institute_funding:0 "Збільшити фінансування військової авіації"
 CZE_jet_fighter_equipment_1_short:0 "L-52"
 CZE_joint_stock_schemes_idea_aat_desc:0 "Акціонерні схеми — це поширений метод, який багато чеських компаній використовують для продовження зростання в умовах політичної або фінансової нестачі."
 CZE_kickstart_rapid_rearmanent_desc:0 "Багато політиків і бізнесменів можуть вважати це жахливим рішенням, але ми повинні розпочати переозброєння негайно. Країни навколо нас не роззброюються, насправді вони роблять протилежне, і це ні для кого не секрет. Ми повинні підготувати нашу армію, поки ще є час."
 CZE_light_fighter_focus:0 "Акцент на легкі винищувачі"
 CZE_light_tank_equipment_1:0 "LT vz. 34"
 CZE_militarized_organizations:0 "Воєнізовані об'єднання"
 CZE_minister_of_defense:0 "Міністр оборони"
 CZE_mio_trait_anti_tank_rifles:0 "Протитанкові рушниці"
 CZE_mio_trait_initial_trait_tank_destroyer_guns_organization:0 "Конструктор винищувачів танків"
 CZE_mio_trait_rear_and_low_ammo_compartment_tank_destroyer:0 "Низький кормовий боєкомплект"
 CZE_mobilize_the_reserves_idea:0 "Мобілізація резервних дивізій"
 CZE_modernize_trieste_designs:0 "Модернізувати проєкти «Трієсте»"
 CZE_moravecs_bohemia_desc:0 "Ходять чутки, що $CZE_emil_hacha$ намагається підірвати наш новий уряд. Якщо ми сподіваємося досягти успіху та зростати в наших нинішніх умовах, нам потрібне керівництво, яке більше відповідає ідеології наших сюзеренів."
 CZE_neutralize_the_hungarian_threat_desc:0 "[HUN.GetNameDefCap] є перешкодою для торгівлі з потенційними союзниками на півдні, і якщо вона об'єднається з нашими ворогами, то може відволікти потенційно важливу частину нашої армії, незважаючи на наслідки Тріанонського договору."
 CZE_no_compromise_with_the_sdp:0 "Продовжувати блокувати SdP"
 CZE_peace_on_our_time_desc:0 "Протягом надто довгого часу ми були на другому плані в європейських міжнародних відносинах. Так більше не буде! Ми можемо міцно стояти на ногах і диктувати власні умови. Хай то буде війна чи мир."
 CZE_power_to_the_military_desc:0 "Очевидно, що для захисту нації не можна шкодувати жодних ресурсів. Це робить критично важливим, щоб ті, хто перебуває при владі, розуміли потреби армії, і немає кращого способу забезпечити це, ніж через військовий уряд."
 CZE_realign_the_church_desc:0 "Релігія занадто довго була елементом, що розділяє [CZE.GetAdjective]і народи. Ми повинні зменшити її вплив на державні справи, такі як освіта та новини, щоб створити більш об'єднане суспільство."
 CZE_realize_the_polish_czechoslovak_confederation_desc:0 "Попри свою мужню боротьбу, [POL.GetNameDef] зазнала поразки. Оскільки її уряд зараз перебуває у вигнанні, з'явилися ідеї про союз із нами. Об'єднавши їхній уряд із нашим, ми могли б згуртувати [POL.GetAdjective]ий народ навколо цієї нової держави та скоординовано докласти зусиль для звільнення нашої спільної батьківщини."
 CZE_recruit_ideologically_aligned_generals_desc:0 "Настав час скоригувати наші навчальні програми, щоб збагатити армію новими кандидатами, які розуміють наші нові цінності."
 CZE_ruml_bedrich:0 "Румл Бедржих"
 CZE_second_republic_democratic_DEF:0 "Чесько-словацька республіка"
 CZE_second_to_none_desc:0 "Проєкти літаків нашої авіаційної промисловості вдосконалюються з кожним днем. Завдяки подальшим дослідженням наші розробки нікому не поступляться у світі!"
 CZE_skoda_plzen_tank_destroyer_organization:0 "Бронетехніка Škoda-Плзень"
 CZE_skoda_priority_shortcut_name:0 "Пріоритет «Шкоди»"
 CZE_stanislav_bukovsky:0 "Станіслав Буковський"
 CZE_sudeten_3_desc:0 "Фортифікації в Судетах міцні, але вони можуть бути ще міцнішими!"
 CZE_sudeten_german_quandary_modifier_tt:0 "§YПасивний ефект§!:\nЯкщо §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§!, або будь-яка інша [BAY.GetFlag]§Yнімецька держава§!, яка межує з нами, виправдовує або отримує §Rмету війни§! проти нас, поки ми контролюємо §Y[69.GetName]§!, §Y[972.GetName]§! або §Y[74.GetName]§!:\n - (§YУсі контрольовані регіони Судетської області§!):\n    Додає §Y$CZE_sudetenland_paramilitaries_modifier$§!, що дає:\n        $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n        $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10.0%§!\n        $modifier_state_repair_speed_bunker_factor$: §R-10.00%§!\n\n - Цей §Yефект§! може спрацювати лише один раз"
 CZE_support_weapons3:0 "ZB vz. 33 & 9 cm Minomet vz. 38"
