 BUL_dominance_in_the_aegean_adriatic_failure:0 "Наша нездатність убезпечити Адріатику завдала сильного удару по моральному духу Болгарії. Якщо ми хочемо повернути сміливість і впевненість, ми мусимо забезпечити болгарське панування в Егейському морі."
 BUL_elites_crushed:0 "Еліти придушені"
 BUL_fate_of_the_balkans_bring_back_state_desc:0 "Ми надішлемо дипломатів у державу [FROM.Controller.GetNameDef] і вимагаємо передати область [FROM.GetName] державі [ROOT.GetNameDef], якій він належить по праву."
 BUL_fate_of_the_balkans_influence_government_autonomy:0 "Проболгарська кампанія пропаганди"
 BUL_fatherland_front_positive_desc:0 "Спочатку створений Болгарською робітничою партією як політичний рух опору для протистояння гніту та фашизму в Болгарії, Вітчизняний фронт тепер складається з членів багатьох організацій, об'єднаних проти всіх тих, хто прагне підкорити болгарський пролетаріат."
