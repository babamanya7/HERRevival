 ITA_EQUIPMENT_VERSION_8:0 "VIII serie"
 ITA_a_time_for_war_tt:0 "Отримає ціль війни §Y$puppet_wargoal_focus$§! проти §Yкожної країни в Європі, чия релігія — не католицизм§!."
 ITA_albanian_fascist_militia_alt:0 "Ополчення «Legaliteti»"
