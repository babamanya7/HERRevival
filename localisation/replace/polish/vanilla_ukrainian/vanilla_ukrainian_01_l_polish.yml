 mtg_britain.100_tt:0 "Якщо резолюція буде прийнята, ви отримаєте таке:\n"
 mtg_britain.104.t:0 "Імперська конференція: федерація — частковий успіх"
 mtg_britain.15.a:0 "Жоден наш король не одружиться з розлученою простолюдинкою."
 mtg_britain.18.a:0 "Чудові новини!"
 mtg_britain.38.d:0 "[From.GetNameDefCap] повідомляє, що наша пропозиція здалася йому дуже підступною, і вона відповідає відмовою."
 mtg_britain.42.t:0 "[From.GetName] відкидає пропозицію вступити до альянсу"
 mtg_britain.45.t:0 "Викорінити вищий клас"
 mtg_britain.47.a:0 "Це допоможе звільненню робітників."
 mtg_britain.79.b:0 "Нехай вирвуть наше підпорядкування з наших сердець силою!"
 mtg_britain.84.b:0 "Наш бюджет не дозволяє цього."
 mtg_britain.86.a:0 "Вони висмоктують із нас ресурси!"
 mtg_netherlands.15.b:0 "Ми так не думаємо."
 mtg_netherlands.29.d:0 "Представники [HOL.GetAdjective] уряду звернулися до нас із проханням надати їм спорядження. Вони стверджують, що без нашої допомоги не зможуть укомплектувати армію до початку вторгнення."
 mtg_netherlands.4.b:0 "Нам не слід втручатися в місцеві територіальні суперечки."
 mtg_netherlands.43.t:0 "[From.GetNameDefCap] відмовляється ділитися військовими знаннями"
 mtg_netherlands.47.a:0 "Він непогано літає."
 mtg_news.1.d:0 "Баланс сил схиляється у бік екстремістів."
 mtg_news.14.a:0 "Можливо, так і треба вчинити."
 mtg_news.29.a:0 "Бояться — і правильно."
 mtg_news.30.b:0 "Вони йдуть за нами."
 mtg_news.33.c:0 "Чудові новини для [From.GetAdjective] робітників!"
 mtg_news.35.a:0 "Це потрібно було зробити."
 mtg_news.43.b:0 "Їх закликали відповісти за брехню!"
 mtg_news.49.b:0 "Все одно нам потрібні тільки ресурси."
 mtg_news.5.c:0 "Нарешті фашисти показали своє справжнє обличчя."
 mtg_news.53.a:0 "Ми раді всім, хто втомився від постійних конфліктів провідних держав."
 mtg_news.56.a:0 "Що за держава без короля? Ну чи королеви."
 mtg_transport_desc:0 "$transport_desc$"
 mtg_usa_canadian_corridor.2.a:0 "Вони вчинили розумно."
 mtg_usa_canadian_corridor.3.a:0 "Ми запропонували мир, а вони обрали війну."
 mtg_usa_civil_war_democrats.1.desc:0 "Столицею прокотилася чергова хвиля масових протестів; демонстранти перекрили всі великі траси на околицях Капітолію. Протестувальники, керовані «Комітетом дій щодо збереження республіки», зажадали незалежного розслідування корупції та недо. вони зажадали, щоб президент [USA.GetLeader] засудив Срібний легіон і публічно запевнив протестувальників у тому, що їхні права як виборців дотримуються.\n\nПрезидент [USA.GetLeader] відмовився висловитися з цього питання."
 mtg_usa_diplomatic_protest.2.desc:0 "Виступаючи з промовою перед обома палатами Конгресу, президент [USA.GetLeader] заявив про те, що його уряд зберігає вірність доктрині Монро, згідно з якою жодним зовнішнім державам не дозволяється мати території на американських континентах. На практиці [USA.GetAdjective] уряд мирився з тим, що інші [USA.GetRulingIdeology] країни мають невеликі володіння, але не може прийняти того, що називає «незаконною окупацією та прямою загрозою їх безпеці». посол передав ноту з ультиматумом від президента — передати контроль над нашими американськими володіннями державі [USA.GetNameDef]."
 mtg_usa_foreign_support.3.a:0 "Це погано."
 mtg_usa_secure_asia.5.a:0 "Найкраще з можливих рішень."
 mtg_usa_secure_asia.6.desc:0 "Переговори з представниками держави [From.GetNameDef] перервалися, ледве встигнувши почати. [From.GetAdjective] кабінет обговорював нашу пропозицію менше години, після чого негайно відкинув її. [From.GetLeader] повідоми[From.GetLeader.GetVerbGendEndA_RU] нашому послу, що якщо пропозиція не буде істотно перероблена, їм нічого обговорювати."
 mtg_usa_secure_asia.8.desc:0 "[From.GetAdjective] уряд погодився поступитися нашим вимогам і наказав місцевій адміністрації співпрацювати з нами доти, доки ми не замінимо її своїми людьми."
 mtg_usa_strategic_interests.3.t:0 "[From.GetNameDefCap] відмовляється співпрацювати"
 mutiny_event.1.a:0 "Let's hope that is the last of it."
 mutiny_event.1.t:0 "Mutiny Crushed"
 mutiny_event.2.desc:0 "Attempts to scare the mutineers into submission have backfired spectacularly as the troops showed little fear of the units sent to supress them. Using skills honed on the front lines, they quickly organized a defense of their positions that would make any attempt to defeat them very costly.\n\nThe officers in charge of the loyalist units have pulled back and are awaiting further orders, but this small success has no doubt strengthened the mutineers' resolve."
 mutiny_event.4.a:0 "We shouldn't have to spell this out."
