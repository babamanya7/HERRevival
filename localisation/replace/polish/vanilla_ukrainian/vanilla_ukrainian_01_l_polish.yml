 trait_mountaineer:0 "Альпініст"
 transfer_state_tt:0 "Область буде передано нам."
 transport_plane_equipment_3_short:0 "Транспорт III"
 tripartite_pact_desc:0 "З метою посилення Антикомінтернівського пакту держави, які підписали договір, заявляють про те, що їхня основна мета на наступні 10 років — «створити і підтримувати новий порядок, забезпечуючи взаємне процвітання та добробут усіх зацікавлених націй»."
 triumphant_revolutionary:0 "Тріумфуючий революціонер"
 tsr_manchukuo.21.desc:0 "За дивним збігом обставин совєти вирішили передати Зовнішню Маньчжурію, стверджуючи, що ми маємо набагато більш особистий зв'язок з цією територією, водночас залишивши Монґолію як буферну державу."
 tsr_manchukuo.21.t:0 "Совєти передають Маньчжурію"
 tsr_sichuan_border_war.2.a:0 "Принаймні вони не забрали назад решту Сікану..."
 tungsten_desc:0 "Вольфрам — рідкісний твердий метал, в основному використовуваний для протитанкових снарядів, але також для верстатів і спеціалізованих деталей."
 turko_persian_empire_neutrality_DEF:0 "Турко-перська імперія"
 tut_9_text_1:0 "Добре! Тепер, коли майже все готово, час глянути на виконання §Yплану бою§! та завоювати Ефіопію во славу Італії.\n\nКлацніть на кнопку §YСтандартний режим мапи§! £GFX_F1£   в нижній правій частині екрану, а далі оберіть Вашу армію, натиснувши на портрет командира внизу екрану."
 uk_destroyer_focus_desc:0 "Сучасні лінкори — це диво, але ми не мусимо нехтувати критично важливою роллю скромного есмінця в захисті наших конвоїв."
