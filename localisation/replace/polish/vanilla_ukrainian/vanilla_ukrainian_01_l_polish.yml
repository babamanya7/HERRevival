 POL_assemble_the_regency_council:0 "Зібрати регентську раду"
 POL_assert_eastern_claims_pavel_desc:0 "До складу Речі Посполитої входить багато частин колишньої Російської імперії, і, без сумніву, Павла вважали б зрадником, якби він їх анексував. Однак Російської імперії більше не існує, і обов'язок Павла як білого - захистити колишні російські території від Радянського Союзу."
 POL_camp_of_national_unity_desc:0 "Ліві та праві санаціоністи більше не мають сили, щоб становити реальну загрозу для уряду, і все, що залишається — це офіційно розпустити їх і зберегти лідерство Іґнація Мосціцького та вести Польщу до нового світлого майбутнього."
 POL_communism_subject_DEF:0 "Соціалістична республіка Польща"
 POL_complete_plan_east:0 "Завершити план «Схід»"
 POL_cv_nav_bomber_equipment_3_short:0 "Mors Floty"
 POL_develop_upper_silesia:0 "Розвинути Верхню Сілезію"
 POL_empower_the_morges:0 "Посилити Фронт Морж"
 POL_fighter_modernisation_desc:0 "Наші винищувачі — основа будь-яких ВПС — не повинні бути застарілими. По мірі того, як решта наших ВПС вдосконалюється, вони також повинні вдосконалюватись."
 POL_find_a_king_tt:0 "§YКоли цей фокус буде завершено§!, можливі кандидати на польський престол представлять себе, щоб стати королем [Root.GetFlag] §YПольщі§! через §Yподію§!. Після того, як кандидата буде обрано, відповідний фокус буде §Yзавершено§!."
 POL_ford:0 "Ford Motor Company"
 POL_four_year_plan_idea_desc:0 "Ця країна доклала зусиль до масової індустріалізації по всій країні."
 POL_habsburg_events.101.a:0 "Так, тепер все сходиться."
 POL_habsburg_monarchist_militants_desc:0 "У Чехословаччині є люди, які прагнуть повернення абсолютної спадкової влади над життям, і все, що нам потрібно зробити — це дати їм зброю, і вони силою просуватимуть справу Габсбурґів!"
 POL_invest_in_eastern_poland_desc:0 "Схід — це безплідне і пустельне місце, повністю занедбане як росіянами, так і польською державою. Там є безліч ідеальних місць для заводів і багато людей, які могли б на них працювати, якщо ми вирішимо інвестувати в такі речі."
 POL_leftist_economics:0 "Установити соціалістичну економіку"
 POL_light_cruiser_1:0 "Клас «Warszawa»"
 POL_mechanized_equipment_3_short:0 "C7P"
 POL_natdem_party:0 "НДПП"
 POL_niech_zyje_opor_desc:0 "По всій Польщі чути шепіт про повстання і свободу. У наших церквах і в підпіллі хоробрі та патріотичні поляки прагнуть відновити незалежну польську державу, і при правильній провокації та оснащенні ми можемо побачити, як Варшава звільниться!"
 POL_pzl:0 "PZL"
 POL_reach_out_to_underground_state_desc:0 "Польська підпільна держава діє в таємниці за зачиненими дверима. Звернувшись до них і надавши їм нашу підтримку, ми можемо одного дня сподіватися на перемогу над нашими колишніми господарями."
 POL_reassemble_the_sejm_desc:0 "З відновленням демократичних практик у Польщі настав час знову запросити до уряду сеймиків, які були вигнані санацією."
 POL_reopen_national_elections:0 "Наново відкрити національні вибори"
 POL_request_autonomous_status:0 "Попросити автономний статус"
 POL_right_paramilitarism_idea:0 "Związek Młodej Polski"
 POL_romanian_alliance_desc:0 "Ми маємо давній союз із румунами, союз між морями, і хоча історично це мало що означало, настав час офіційно запросити румунів приєднатися до нашого альянсу та втілити в життя амбіції Міжмор'я."
 POL_royal_dictatorship_desc:0 "Сейм має право виконавчої влади накласти вето на будь-яке рішення, прийняте королем, і хоча до цього часу це служило нам добре, світ змінюється, і ми не можемо дозволити бюрократії стояти на шляху божественного права нашого Короля керувати країною."
 POL_sanation_decisions_desc:0 "Санаціоністи діляться на табори ліворуч і праворуч, які прагнуть порушити наше правління. Ми мусимо належним чином заспокоїти та відсторонити сторони, щоби створити стабільний уряд для майбутнього Польщі!"
 POL_sanation_left_opposition_2_desc:0 "[Root.GetLeftDesc] Наразі ліві санаціоністи розбудовують владу в Диктатурі і здатні підірвати нашу повсякденну політичну діяльність у цивільному секторі."
 POL_ship_anti_air_2:0 "40mm/40 Vickers AA"
 POL_siodemki_desc:0 "Санація підтримує Квітневу конституцію, в той час як Ендеція хоче замінити її своєю власною. Оскільки наші партії зараз співпрацюють, ми не можемо дозволити собі більше плутанини і повинні домовитися про консолідацію цих конкуруючих бачень майбутнього Польської республіки."
 POL_stanislaw_pawluc:0 "Станіслав Павлуць"
 POL_sub_ship_engine_3:0 "«Sulzer» 5 400 к. с. н. в."
 POL_tac_bomber_equipment_2:0 "PZL.49 Miś"
 POL_tadeusz_bielecki:0 "Тадеуш Бєлецький"
 POL_the_long_push_home_no_mtg:0 "$POL_the_long_push_home$"
 POL_the_old_borders_desc:0 "У минулі століття слов'яни займали регіони, які зараз вважаються німецькими: Померанію, Сілезію та Пруссію. Німецький імперіалізм століттями завдавав шкоди польській державі та сусіднім слов'янським народам, і настав час виправити помилки історії та повернути те, що належить нам по праву."
 POL_the_sanation_right:0 "Права санація"
 POL_unification_propaganda_desc:0 "Данциґ — це культурно різноманітне місто поляків, німців та незліченної кількості інших меншин, і нацистська партія прагне порушити це багатокультурне співробітництво. Ефективна пропаганда може бути використана, щоби перевернути міські меншини на свій бік, пообіцявши їм рівність, яку нацисти швидше помруть, ніж дадуть їм."
 POL_vojtek_commander:0 "Виявлено секрет отримання цього досягнення"
 PORTUGAL_GATHERING_STORM_DESC:0 "Відколи Салазар прийшов до влади в 1932 році, Португалія поступово почала відходити від нестабільного періоду Першої республіки. Фіскальна автономія та політична незалежність від великих держав призвели до створення «Нової держави», що заклала фундамент для розвитку португальської промисловості та модернізації армії.\n\nТепер Португалії варто обрати шлях уперед, поки в сусідній Іспанії збільшуються політична та соціальна нестабільність, а міжнародні відносини безнадійно погіршуються..."
 POR_ITA_Ship_builder:0 "[ITA.GetAdjective]"
 POR_a_new_industry:0 "Нова промисловість"
 POR_arms_purchases:0 "Закупівлі зброї"
 POR_buy_aa_in_britain:0 "Придбати зенітні гармати в держави [ENG.GetNameDef]"
 POR_carrier_effort_desc:0 "Зі зростанням загрози, яку становлять сучасні літаки, авіаносці стають все більш вирішальними в битві за моря."
 POR_concordat_with_the_holy_see_desc:0 "Ми будемо вести переговори про угоду з Ватиканом, заохочуючи соціальну роль Церкви та запобігаючи її втручанню в політичні справи Португалії.\n\n«Deus, Pátria e Família» – Антоніу де Олівейра Салазар"
 POR_empire_neutrality_DEF:0 "П'ята Португальська імперія"
 POR_fight_alongside_the_carlists:0 "Приєднатися на боці карлістів"
 POR_infrastructure_in_angola_tt:0 "Додати §Y2 морські бази§! в провінції Намібе в Анґолі.\n   Додати §Y3 морські бази§! в провінції Луанда в Анґолі.\n"
 POR_medium_tank_equipment_3:0 "Carro de Combate 6"
 POR_prospect_for_resources:0 "Розвідка ресурсів у Португалії"
 POR_prospect_for_resources_desc:0 "Ми можемо інвестувати в розвиток видобувної промисловості в Португалії, щоб покращити експлуатацію знайдених там ресурсів."
 POR_submarine_1:0 "Клас «Foca»"
 POR_workers_of_iberia_unite_desc:0 "Ми повинні проголосити єдність іберійського пролетаріату проти будь-якої тиранії та приєднатися до наших іспанських товаришів у їхній громадянській війні, ставши бастіоном проти фашизму.\nНаші жертви не будуть забуті, бо наша справа справедлива!"
 POSITIONING_INFO:0 "§HРозміщення§! відображає те, наскільки вигідну позицію займає ваш флот, порівняно з ворожим. На розміщення впливає порівняльний розмір флотів, погода та навички командувача. Кораблі, що вступили в бій після його початку, отримують тимчасовий штраф до показника розміщення. Якщо розміщення нижче 100%, флот отримує різні штрафи.\n"
 PRC_CSCEC_civs_desc:0 "Ми закликатимемо CSCEC спеціалізуватися на промисловому будівництві, зрештою, саме в цьому полягають сильні сторони CSCEC."
 PRC_adopt_sun_yat_sens_principles:0 "Прийняти принципи Сунь Ятсена"
 PRC_agrarian_reform_desc:0 "Хоча [FROM.GetNameDef] все ще залишається переважно сільською країною, вона розпочала повільний процес індустріалізації."
 PRC_appeal_for_foreign_aid__bt7_medium_amount_tt:0 "Отримати §Y150§! [SOV.GetAdjective]их §Yлегких танків БТ-7§!"
 PRC_army_doctrines_tt:0 "Отримайте бонус на основі обраної вами §Yвеликої доктрини§!:"
 PRC_aviation_infrastructure:0 "Інвестувати в авіаційну інфраструктуру"
 PRC_border_clashes:0 "Прикордонні сутички"
 PRC_cooperate_ulanhu:0 "Співпраця з Уланьфу"
 PRC_criticize_dogmatism:0 "£BoP_left_texticon Розкритикувати догматизм"
 PRC_defunct_state_bank_desc:0 "Транспортування наших старих монетних пресів під час Великого походу було неможливим, і в результаті наш державний банк зараз намагається зорієнтуватися в цій новій і складній ситуації."
 PRC_develop_yanan_soviet_desc:0 "Нам вдалося встановити контроль над [1032.GetName], що дає нам можливість розширити наші опорні бази. Тепер ми зробимо [1032.GetName] резиденцією нашого уряду."
 PRC_eight_points_for_attention_desc:0 "$PRC_eight_points_for_attention$, встановлені $PRC_mao_zedong$, наголошують на важливості: бути ввічливим у розмові, бути чесним при купівлі та продажу, повертати всі позичені речі, платити компенсацію за все пошкоджене, не бити і не лаяти інших, не псувати посіви, не чіплятися до жінок, не знущатися з полонених."
 PRC_extend_emergency_measures_2_tt:0 "Із завершеним §Y$PRC_emergency_prodction_protocols$§!: §Yзбільшити тривалість на [?PRC_emergency_protocol_idea_days] днів§!, або:"
