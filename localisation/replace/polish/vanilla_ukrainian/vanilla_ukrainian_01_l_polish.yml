 SOV_propaganda_heroes_forward_tt:0 "До §Y5 командувачів військами§! отримають рису §Y$trait_SOV_determined$§! на §Y[?SOV_default_propaganda_campaign_duration]§! дн."
 SOV_propaganda_oil_for_the_motherland:0 "Більше нафти Вітчизні!"
 SOV_propaganda_stalin:0 "Під керівництвом Сталіна!"
 SOV_recruit_cavalry_exiles:0 "Завербувати сибірську кавалерію в області [FROM.GetName]"
 SOV_respect_baltic_self_determination_desc:0 "Кожен народ повинен мати можливість вирішувати свої справи демократичним шляхом. Звичайно, у багатьох буржуазних демократіях на Заході цей процес негайно спотворюється великими сумами грошей. Ми забезпечимо робітникам Естонії, Латвії та Литви справедливе представництво в їхніх урядах."
 SOV_secure_the_baltics_desc:0 "Балтійський регіон довгий час був невід'ємною частиною Росії. Вони відкололися в момент національної слабкості і повинні бути відновлені якнайшвидше."
 SOV_sinkiang_prospection_flag:0 "Проведено розвідку корисних копалин у Південному Сіньцзяні"
 SOV_socialist_humanism_desc:0 "Деякі марксистські теоретики вважають, що люди не можуть впливати на власну долю і що їхнє життя повністю визначається матеріальними факторами. Це, очевидно, неправильно і є буржуазним поглядом на робітничий клас. Люди — це більше, ніж просто набір органів, і ми повинні ставитися до них саме так."
 SOV_soviet_atomic_bomb_project_desc:0 "Ми знаємо, що вчені в інших країнах наполегливо працюють над розробкою методів перетворення найфундаментальніших сил Всесвіту на нову форму зброї. Поки ми відстаємо, ми можемо використати їхні напрацювання для розвитку наших власних і забезпечити збереження паритету руйнувань."
 SOV_soviet_japanese_pact_against_usa_focus_desc:0 "Японці захочуть подальшої експансії, щоб підживлювати свою зростаючу економіку. В наших інтересах спрямувати цю експансію якомога далі від нас, а також заручитися підтримкою сильної військово-морської держави. Разом ми можемо усунути Сполучені Штати зі світової арени!"
