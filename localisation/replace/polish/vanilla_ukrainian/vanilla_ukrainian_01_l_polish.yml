 SPA_a_one_party_state:0 "Однопартійна держава"
 SPA_consolidate_the_north_desc:0 "Першим кроком на шляху до перемоги має стати завоювання та консолідація північних територій. Коли це буде завершено, ми зможемо перейти до інших вразливих територій на республіканському фронті."
 SPA_dictator_for_life_desc:0 "Франко добре послужив своїй нації. Ми не бачимо необхідності змінювати цей стан справ і, звичайно, не повертатися до старої слабкої монархії."
