 upgrade_airforce_department_desc:0 "§LВідділ авіаційної розвідки принесе користь нашій агенції. Завданням цього відділу будуть впровадження у ВПС супротивника та збір розвідданих про переміщення ворожої авіації.§!"
 upgrade_training_centers_desc:0 "§LХоча наші агенти здатні пристосовуватися до будь-якого оточення, культурні норми та мови інших країн найкраще засвоюються тими, хто народився і виріс у цьому середовищі. Якщо ми хочемо розгорнути світову шпигунську мережу, ми мусимо охопити центрами вербування і кулю і наймати агентів всіх культур та біографій.§!"
 usa.1.t:0 "Ергарт хоче вступити на службу"
 usa.10.t:0 "[Root.GetLeader] проти Рузвелта"
 usa.12.t:0 "Кампанія Даґласа МакАртура"
 usa.31.t:0 "Зрушення в політичному ландшафті"
 usa.43.t:0 "Представник критикує президента"
 usa.45.a:0 "Як усе й має бути."
 usa.46.desc:0 "Після незначного серцевого нападу високопоставлений сенатор сьогодні оголосив, що піде у відставку за станом здоров'я. Пропрацювавши в Конгресі понад два десятиліття, сенатор створив велику мережу прихильників, і його вплив мав велику вагу. Хоча технічно лише одна людина з одним голосом, вашинґтонські інсайдери все ж вважали, що він вартий кількох голосів, оскільки він був ключем до кількох інших. \n\nОскільки місце, швидше за все, дістанеться затятому критикові президента [USA.GetLeader], адміністрації буде набагато важче забезпечити необхідну кількість голосів для ухвалення законопроєктів."
 ustasa_crushed:0 "Усташі були придушені"
 value_limit_min_max:0 "$MIN$–$MAX$"
 vapsid_economist:0 "Вапсівський економіст"
 volunteer_corps_desc:0 "Ми ніколи не стали б змушувати своїх громадян віддавати життя за ідеали свободи, однак якщо люди самі бажають допомагати іншим країнам, ми маємо надати їм таку можливість."
 wallis_fancy_title:0 "Її Величність королева Уолліс, перша у своєму імені, Божою милістю Королева Америк, ґросадмірал Королівських ВМС Америк, герцогиня Уоллінґтонська, герцогиня Мангеттенська, герцогиня Лонґ-Айлендська, графиня Оранська, графиня Оагу, маркіза Нового Орлеану, баронеса Спринґфілдська, баронеса Голлівудська, баронеса Центрального парку, Велика світська дама, Захисниця свободи, Північно-західний авангард Аляски, Месниця за Бостонське чаювання та Терор Уоллінґтону, О. К."
