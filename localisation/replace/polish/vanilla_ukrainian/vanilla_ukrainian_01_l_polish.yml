 PHI_leoncio_s_tan:0 "Leoncio S. Tan"
 PHI_mindanao_transport_desc:0 "Попри те, що це другий за величиною острів філіппінського архіпелагу, він ніколи не наближався навіть близько до рівня інвестицій свого північного побратима Лусона. Ми повинні виправити цей недогляд!"
