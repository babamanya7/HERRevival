 WW_hungary.43.a:0 "Довіряти можна лише родині"
 WW_hungary.43.desc:0 "Підлий [FROM.GetLeader] з [FROM.GetNameDef] відкинув нашу пропозицію. Ми повинні шукати інші альянси або тримати оборону самотужки."
 WW_hungary.44.desc:0 "Імператор [FROM.GetLeader] з [FROM.GetNameDefCap] вимагає від нас відновлення корони Відів і коронування Вільгельма Віда як нашого монарха. Це фактично покладе край нашій незалежності, але може врятувати нас від повної анексії. Чи приймемо ми місце в новій імперській федерації?"
