 SIA_american_investment_aid_desc:0 "Сполучені Штати володіють багатством, якого немає ні в кого в нашому регіоні. Якщо ми зможемо забезпечити американську допомогу та інвестиції для наших підпільних та національних зусиль, [ROOT.GetNameDef] отримає матеріальні засоби, щоб витримати труднощі і підготуватися до визволення."
 SIA_army_navy_reform_cat_desc:0 "Армія і флот змагаються за один і той самий обмежений пул ресурсів. Перерозподіл коштів між двома гілками — це постійне балансування, де кожен перерозподіл має наслідки для боєготовності іншої."
 SIA_boon_rawd_brewery_desc:0 "Вітчизняна пивоварна промисловість — це більше, ніж питання споживання. Такі підприємства, як Boon Rawd, показують, що сіамський капітал, обладнання та управління можуть створити сучасну промисловість на сіамській землі."
 SIA_crack_down_of_foreign_merchants_desc:0 "Торгівля довго формувалася зовнішніми інтересами, створюючи вразливості, які можуть вплинути на нашу національну стійкість. Щоб захистити нашу економічну безпеку, ми повинні мати змогу контролювати власну торгівлю, гарантуючи, що процвітання та стабільність будуються на фундаменті, який ми контролюємо самі."
 SIA_damrong_rajanubhab:0 "Дамронг Раджанубхаб"
 SIA_heavy_fighter_equipment_1:0 "Kawasaki Ki-38"
 SIA_khana_ratsadon_dummy_military_desc:0 "Військові — потужна кліка партії Хана Ратсадон. Вони не схвалять політику, яка, на їхню думку, суперечить їхнім інтересам, але схвалять те, що розглядають як підтримку мілітаризації країни."
 SIA_khana_ratsadon_inlay_title:0 "Кхана Ратсадон"
 SIA_mandate_11_desc:0 "Тайський народ повинен ділити свій час на три частини. Одна для роботи, одна для особистих справ, і одна для відпочинку та сну. Це має бути впорядковано і відбуватися за графіком, поки не стане звичкою.\n\nТайський народ повинен виконувати свої звичайні особисті справи таким чином: Їсти у визначений час, не більше чотирьох разів на день; Спати приблизно 6-8 годин.\n\nТайський народ повинен сумлінно виконувати свої робочі обов'язки без розчарувань або ухиляння. Південний відпочинок та обідня перерва не повинні тривати довше однієї години. Наприкінці робочого дня слід займатися спортом щонайменше одну годину або іншими видами діяльності, такими як садівництво, догляд за домашніми тваринами або посадка дерев. Потім, прийнявши душ, повечеряти.\n\nТайський народ повинен використовувати свій вільний час увечері для завершення необхідної роботи, спілкування з родиною та друзями, пошуку знань шляхом прослуховування радіоновин або читання, або інших розваг чи мистецтва, наскільки дозволяють можливості"
 SIA_mandate_9:0 "Дев'ятий мандат"
 SIA_pao_pienlert_boripanyutakit:0 "Пао Піенлерт Боріпаньютакіт"
 SIA_preemtive_strike_desc:0 "Чекати, поки Японія вибере час для війни, було б дурістю. Якщо імперія має намір розірвати Азію, то [SIA.GetName] має завдати удару до того, як її армії та флоти будуть повністю задіяні в іншому місці."
