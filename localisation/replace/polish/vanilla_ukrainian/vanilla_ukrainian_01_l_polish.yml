 GER_aid_in_industrialization:0 "Німецька допомога в індустріалізації"
 GER_anschluss_desc:0 "Незважаючи на слова [AUS.GetAdjective]их політиків, очевидно, що населення держави [AUS.GetNameDef], яке переважно розмовляє [GER.GetAdjective]ою, прагне возз'єднання з Батьківщиною. Нам слід змусити корумпованого лідера [AUS.GetLeader] піти у відставку та дати можливість виконати волю народу."
 GER_anti_soviet_pact_tt_2:0 "§YЧлени оборонного альянсу приєднаються до війни, якщо Комінтерн нападе на будь-кого з них.§!"
 GER_army_innovation_2_desc:0 "Спільна робота на об'єктах у СРСР дала корисний досвід, і це дозволить нам удосконалити свою військову доктрину та спорядження. Але цього разу ми ні з ким не ділитимемося своїми успіхами!"
 GER_assemble_red_orchestra:0 "Зібрати «Червоний оркестр»"
 GER_autarky_achieved_desc:0 "Ми нарешті досягли нашої амбіційної мети — стати повністю самодостатніми! Наша нація стала багата на природні ресурси, які ще більше зміцнять нас і зроблять нас непереможними!"
 GER_ban_political_uniforms_desc:0 "У Ваймарську добу вулиці заполонили парамілітарні організації та політичні угруповання. З метою забезпечення стабільності ми повинні заборонити будь-які відкриті демонстрації політичної приналежності."
 GER_blitzkrieg_modifier_lvl_2:0 "$GER_blitzkrieg_modifier$"
 GER_central_european_alliance:0 "Центральноєвропейський альянс"
 GER_coal_liquidization:0 "Зрідження вугілля"
 GER_communist_propaganda_middle_east_decision:0 "$GER_communist_propaganda_decision$"
 GER_compensation_for_transferred_colonies:0 "Компенсація за передані колонії"
 GER_crossing_the_atlantic:0 "По той бік Атлантики"
 GER_cruiser_warfare:0 "Крейсерська війна"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName] мусить затвердити угоду, щоби бонуси почали діяти. В разі оголошення війни вона вийде з альянсу [Root.GetFactionName].§!\n"
 GER_defend_the_vaterland:0 "Захистити Фатерланд"
 GER_demand_lithuanian_integration:0 "Вимогти інтеграцію Литви"
 GER_destroyer_2_desc:0 "Клас «Zerstörer 1934» був першим класом німецьких есмінців, побудованих після Першої світової війни. Вони були озброєні п'ятьма 5-дюйм. гарматами і вісьмома торпедними апаратами. Було побудовано 16 кораблів, з яких 12 належали до поліпшеного підкласу «Zerstörer 1934A»."
 GER_division_estonia_mech_tt:0 "§YМеханізована§! частина §Y20. SS-Division§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_establish_production_targets_desc:0 "Перш ніж розпочинати будь-які військові кампанії, ми мусимо спочатку модернізувати та оснастити наші збройні сили. Щоби наростити обсяги виробництва, ми мусимо запровадити квоти й амбіційні виробничі цілі."
 GER_extend_mitteleuropas_bounderies:0 "Розширити межі Міттельєвропи на схід"
 GER_form_the_stasi_desc:0 "Розвідувальне управління показало свою ефективність, і ми вже розглядаємо створення Міністерства державної безпеки. Можливо, це не найпопулярніше рішення серед народу, але воно необхідне."
 GER_gen_expanding_effect_tt:0 "Кожна область у зоні інтересів Австрійської Галичини перейде під контроль [GEN.GetNameDef]"
 GER_geo_state_transfer_effect_north_caucasus_tt:0 "Кожна виділена область перейде під контроль §Y[GEO.GetNameDef]§!"
 GER_german_socialist_union_DEF:0 "Німецький фольксуніон"
 GER_glorify_party_rallies_desc:0 "Без нашого політичного ядра держава ослабне. Мартін Борман звернув увагу на те, що наші партійні мітинги можна покращити, щоб отримати більшу підтримку громадськості та діяти вільніше у формуванні уряду."
 GER_greater_proletarian_german_state_communism_DEF:0 "Велика німецька пролетарська держава"
 GER_improve_the_logistics_system:0 "Поліпшити систему логістики"
 GER_improve_trade_relations_tt:0 "Збільшить §Yторговельний вплив§! на поточних і майбутніх §Yчленів альянсу§!."
 GER_instill_german_discipline_desc:0 "Поглянувши на армії фолькскомісаріатів, очевидно, що їм бракує дисципліни та ефективності [ROOT.GetAdjective]. Ми повинні їх цьому навчити, аби вони могли краще захищати себе від ворогів."
 GER_iran_rar_effect_tt:0 "Кожна область у іранській зоні інтересів перейде під контроль [RAR.GetNameDef]"
 GER_japanese_naval_cooperation_desc:0 "Ми можемо багато чому навчитись у [JAP.GetAdjective]ої нації, особливо в питаннях військового флоту. Заснувавши спільні технологічні проєкти, ми зможемо максимально використати знання один одного та зменшити кількість часу, витраченого на винайдення того, до чого у нас як в об'єднаних сил вже є доступ."
 GER_kriegslokomotiven_desc:0 "Логістичні виклики війни вимагають виробництва Kriegslokomotiven, або воєнних локомотивів. Ці потяги будуть пристосовані до наших економічних обставин і потреби у швидкому та дешевому масовому виробництві."
 GER_kurt_tank:0 "Курт Танк"
 GER_lessons_of_the_great_war_desc:0 "Наші невдачі у Великій війні дають нам безцінні відомості, які мають вирішальне значення для наших майбутніх конфліктів. Ми дуже ретельно вивчили минуле, і тепер мусимо втілити в життя уроки, які дає нам історія."
 GER_liberate_italy_desc:0 "[ITA.GetAdjective]и вже давно страждають під правлінням [ITA.GetLeader]. Колись вони були союзниками нашого колишнього режиму, але зараз, коли ми змінилися на краще, це наш обов’язок — привести їх до нового майбутнього!"
 GER_light_cruiser_4:0 "Клас «Q»"
 GER_light_tank_artillery_equipment_2_desc:0 "Sd.Kfz. 124 Wespe (з нім. — «оса») — німецька самохідна артилерійська установка на модифікованому шасі Panzer II."
 GER_light_tank_destroyer_equipment_2_short:0 "Marder III"
 GER_light_tank_equipment_2_desc:0 "Panzer II спочатку був розроблений як тимчасовий проміжок, тоді як були розроблені більші, більш досконалі танки, але він знайшов широке використання в боях через відсутність більш потужних танків."
 GER_medium_tank_equipment_2_short:0 "Panzer IV"
 GER_minister_of_the_colonies:0 "Держсекретар у справах колоній"
 GER_modern_tank_aa_equipment_1:0 "Kugelblitz"
