 INS_knilm_name_nationalized:0 "Garuda Indonesia"
 INS_land_reform_desc:0 "До того, як ми проголосили незалежність, Нідерланди безпосередньо володіли великими обсягами землі. Ми повинні розподілити цю землю між індонезійцями, які будуть її використовувати, за низькими цінами, щоб стимулювати економічне зростання."
