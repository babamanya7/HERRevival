 ETH_cooperation_desc:0 "Наша доля полягає в пануванні Східної Африки. Проте до досягнення цієї мети ми ще дуже далекі. Тому ми повинні співпрацювати з існуючими владними структурами регіону і намагатися отримати будь-яку вигоду."
 ETH_core_east_african_states:0 "Інтегрувати [FROM.GetName]"
 ETH_events.1.d:0 "Оскільки контроль над Сомалілендом та Ерітреєю майже повністю втрачено, за винятком кількох осередків опору, уряд Ефіопії запропонував знайти мирне припинення цих військових дій. Італія офіційно припинить своє вторгнення в Ефіопію та передасть окуповані території в Східній Африці Ефіопії. Як нам слід відповісти?"
