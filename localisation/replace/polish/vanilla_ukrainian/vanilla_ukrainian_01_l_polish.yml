 GOE_RAJ_loyalist.08.a:0 "$GOE_RAJ_loyalist.07.a$"
 GOE_RAJ_navy.7.desc:0 "[FROM.GetLeader] попросив придбати наші старі виведені з експлуатації кораблі, вони наразі не використовуються, але [FROM.GetLeader] наполягає, що [FROM.GetNameDefCap] може їх використати. Вони пропонують велику оплату."
 GOE_RAJ_news.3.desc:0 "Рішення реформувати Ост-Індійську компанію в [RAJ.GetNonIdeologyName] було прийнято [?event_target:EIC_FORMER.GetNonIdeologyName] кілька років тому, щоб стабілізувати занепадаючу [RAJ.GetAdjective] економіку. Оскільки цей крок [?event_target:EIC_FORMER.GetAdjective] економісти загалом вважають успішним, [?event_target:EIC_FORMER.GetAdjective] уряд оголосив, що негайно залишок землі, контрольованої Раджем, буде переданий [RAJ.GetNameDefCap]. Адміністрація Раджу буде розформована, що дозволить [RAJ.GetNameDefCap] керувати усім субконтинентом."
 GOE_RAJ_partition.5.a:0 "Ситуація розвивається..."
 GOE_RAJ_partition.9.t:0 "[ENG.GetName] готується втрутитися"
 GOE_generic_events.1.desc:0 "Нездатність [FRA.GetAdjective] армії захистити Париж призвела до краху уряду. Після поспішно укладеного перемир'я у Віші був створений новий режим. Однак низка [FRA.GetAdjective] чиновників втекла з країни, щоб створити уряд у вигнанні, і пообіцяла продовжувати боротьбу, доки [FRA.GetNonIdeologyName] не буде звільнена. Тепер перед нашим власним урядом постало складне рішення."
 GOT_GER_amerikabomber.01.desc:0 "Після рішення про створення дальнього бомбардувальника різні команди представили свої проєкти. Усі вони обіцяють створити машину, здатну перенести війну через Атлантику. Залишилося лише обрати, хто втілить цю амбітну ідею в життя."
 GOT_GER_integrated_puppet_economies.02.a:0 "Ми маємо використати це на свою користь"
 GOT_GER_integrated_puppet_economies.02.t:0 "Програма експлуатації від [FROM.GetAdjective]"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_STANDARD:0 "Ми перемогли! Після всіх цих років Венізелос нарешті виправданий! Велика ідея перемогла опір скептиків та тих, хто заважав нашому розвитку. Тепер ми стоїмо на порозі нової епохи Греції — на порозі золотої доби!"
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_MONARCHIST:0 "Чемпіони Середземномор'я"
 GRE_agricultural_communes_desc:0 "Світ довкола нас став на рейки індустріалізації, і нам не слід від нього відставати. Разом з цим багато наших людей мало що знають про життя поза сільським господарством, і ми не можемо так легко відкинути своє коріння. Ми організуємо аграрний сектор, створивши в ньому ефективні громади та вивільнивши людей для інших областей — зокрема, для роботи на виробництві та військовій службі."
 GRE_attend_talks_with_the_presidium:0 "Відвідати перемовини з президіумом"
 GRE_bedrock_of_balkan_financial_stability:0 "[Root.GetBedrockFinancialStabilityName]"
 GRE_bribe_french_trade_unions_to_pressure_government_into_investment_desc:0 "Держава [FROM.GetNameDef] вже доволі давно поневолена профспілками. Допомагаючи їх розхитувати стабільність, ми шантажем зміцнимо свою позицію на перемовинах."
 GRE_crack_down_on_foreign_monopolies:0 "Переслідувати іноземні монополії"
 GRE_debt_paid_8304:0 "§G83.4%§!"
 GRE_fascists_attitude_status_amount:0 "[ROOT.GetFascistLoyaltyLevel]"
 GRE_heavy_fighter_equipment_3:0 "EAF Kentrí"
 GRE_increase_our_mining_operations_desc:0 "Можливо, розширення тютюнової індустрії допоможе нам здобути подяку світової спільноти, але саме гірничодобувна галузь корисна для держави. Війни виграються за рахунок видобутку копалин та руди, а не продажу тютюну та оливкової олії."
