 crypto_bomb_focus_desc:0 "Поляки розробляють блискучу машину, яку називають «криптологічною бомбою» й яка може зламати шифри німецької «Еніґми». Ми маємо ресурси для подальшого її розвитку в Блетчлі-Парку."
