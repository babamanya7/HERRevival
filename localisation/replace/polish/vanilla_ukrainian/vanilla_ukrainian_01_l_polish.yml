 CHI_neutral_shortcut:0 "Політика:\nҐоміньдан"
 CHI_opposition_desc:0 "Центральний уряд слабкий і неефективний. Комуністи хочуть перекреслити п'ять тисячоліть китайської історії. Країні потрібен великий лідер, готовий приймати важкі рішення, щоби за будь-яку ціну об'єднати країну."
 CHI_panthay_empire_fascism_ADJ:0 "Imperial Chinese"
 CHI_preemptive_strike_desc:0 "З кожним днем наші внутрішні вороги стають сильнішими, змовляючись проти нашої влади. Ми більше не можемо чекати, поки хтось спробує захопити владу в Китаї, нам потрібно діяти, нам потрібно завдати удару!"
 CHI_preemptive_strike_tt:0 "Ми отримаємо ціль війни §Y$annex_everything$§! проти кожного [CHI.GetAdjective]ого мілітариста, який не приєднався до альянсу [ROOT.GetFactionName] або відхилив наші вимоги стати суб'єктом."
