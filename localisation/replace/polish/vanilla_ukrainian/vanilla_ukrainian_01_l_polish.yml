 HAS_MASTERY_TRIGGER:0 "Має принаймні £doctrine_mastery $AMOUNT|H0$ майстерності у $TRACK|H$"
 HAW_communism_party:0 "КПГ"
 HAW_democratic_ADJ:0 "Гавайськ"
 HBC_democratic:0 "Хебей-Чахарська республіка"
 HINT_ARMY_PLANNER_TEXT_1:0 "Це екран §Yтренування та розгортання§!. Тут можна додавати нові дивізії в чергу на тренування, а пізніше розгортання. Ми радимо додати в чергу дивізію з шаблоном §YDivisione di Fanteria§!.\n\nДивізії в черзі спершу спробують зібрати потрібне їм §Yоснащення§!. Коли оснащення буде отримане, вони почнуть тренування. прогрес тренування не може перевищити відсоток отриманого оснащення.\n\nКлацніть по кнопці §YТренувати§!, щоби додати дивізію в чергу тренування.\n\nКоли дивізія завершить своє тренування, її можна буде §Yрозгорнути§! в §Yточці розгортання за Вашим вибором§!. Розгортати дивізії можна тільки на осердній території."
 HINT_ARMY_PLANNER_TEXT_1_2:0 "Коли дивізія завершить своє тренування, її можна буде §Yрозгорнути§! в §Yточці розгортання за Вашим вибором§!. Розгортати дивізії можна тільки на осердній території."
 HINT_DIVISION_DESIGNER_XP_TEXT:0 "Це §Yконструктор дивізій§!. Його використовують для створення нових і редагування існуючих §Yшаблонів дивізій§!. Створення та редагування коштуватиме Вам £army_experience£ §Yдосвіду армії§!. Досвід армії накопичується, коли Ваші війська беруть участь у боях або армійських навчаннях. Військові частини 1 рівня досвіду — §YНенавчені§! не генерують £army_experience£ досвід армії.\n\nДля Вашого першого редагування шаблону рекомендовано клацнути на порожню комірку в колонці військ підтримки, щоби додати £unit_artillery_icon_small£ §Yпідтримку артилерії§! до Вашої дивізії. Після додання клацніть §YЗберегти§!. Ваші дивізії, які використовують цей шаблон, тепер потребуватимуть §Yартилерійське оснащення§!."
 HINT_RESEARCH_SCREEN:0 "Підказка: Дослідження"
 HITTING_FAN_DESC:0 "Ага, все правильно! Ця колекція парасольок скоро дуже знадобиться."
 HIT_PROFILE_CHANCE_LA:0 "§Y$STAT_NAVY_LG_ATTACK$§!$VALUE|%1$"
 HOA_a_loyal_subject_desc:0 "Оскільки ситуація на світовій арені стає все більш нестабільною, можливо, краще бути під захистом сильнішої нації. Принаймні поки..."
 HOA_exploit_national_resources:0 "Використати національні ресурси"
 HOA_military_cooperation:0 "Військова співпраця"
 HOA_rightfully_ours_idea:0 "Повернення імперії"
 HOL_AI_BEHAVIOR:0 "@HOL Нідерланди"
 HOL_AUS_danubian_state:0 "Дунайська держава Нідерланди"
 HOL_EQUIPMENT_VERSION_10:0 "No. 10"
 HOL_antonie_pannekoek:0 "Антоніе Паннекук"
 HOL_assemble_air_squadron_desc:0 "Кілька наших солдатів виявили бажання навчитися пілотувати літаки та в міру сил допомагати країні в повітрі. Треба піти їм назустріч і попросити літаки у союзників."
 HOL_cave_to_the_germans_desc:0 "Ділячи сухопутний кордон з німцями, ми могли б розумно очікувати вторгнення, якби ми відмовилися від їхніх вимог збільшити потік торгівлі через нашу країну. Нехай вони використовують нас як чорний хід, щоб уникнути британської блокади, якщо це означає нашу безпеку!"
 HOL_combined_chiefs_of_staff_representation_desc:0 "Наші внески були відзначені, і за певного політичного тиску ми могли б отримати представництво, якщо не участь, в ексклюзивному клубі англо-американських стратегічних планувальників, який є Об'єднаним комітетом начальників штабів."
 HOL_de_vaarplicht_desc:0 "Після 150 років нейтралітету та десятиліть посилення пацифізму ми повинні довести нашим новим союзникам нашу рішучість воювати. Замість покладатися на добровільний торговельний флот, як інші країни, ми зробимо законом «Vaarplicht», або «Зобов'язання плавати». Усі громадяни Нідерландів, які ще не були призвані на військову службу, відтепер будуть зобов'язані виконувати службу для торгового флоту або на його користь."
 HOL_drain_the_water_lines_desc:0 "Небезпека відступила, і Голландську водну лінію тепер можна осушити, щоби знову нормально користуватися сільськими землями."
 HOL_for_the_common_good_desc:0 "В інтересах загального блага для всього комунізму ми повинні ділитися нашими технологічними досягненнями один з одним."
 HOL_gateway_to_europe_ger_category_desc:0 "Нідерландці створили «чорний хід», що дозволяє нам обійти британську блокаду і торгувати через нейтральні порти. Нам потрібно натиснути на нідерландців, щоб вони збільшили максимальну кількість вантажів, які ми можемо провозити через їх кордон."
