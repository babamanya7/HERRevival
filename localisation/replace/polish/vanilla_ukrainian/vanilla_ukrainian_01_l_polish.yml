 denmark_expansion_event.24.t:0 "[FROM.GetNameDefCap] погоджується на наші вимоги [NOR.GetAdjective]их земель"
 denmark_expansion_event.701.t:0 "[FROM.GetNameDefCap] порушує наші плани"
 denmark_occupation_event.1.a:0 "Нам не виграти цей бій"
 denmark_occupation_event.110.t:0 "[FROM.GetNameDefCap] клянеться у вірності"
 denmark_occupation_event.20.desc:0 "Ретельно все спланувавши і зухвало атакувавши, загін опору повернувся після вдалого нальоту зі зброєю, яка призначалася для наших так званих господарів. Тепер нам буде ще простіше воювати за свободу!"
 denmark_occupation_event.40.desc:0 "Члени опору кілька місяців планували диверсійні операції і нарешті втілили плани в життя. Саботаж важливої військово-промислової інфраструктури означає, що [?DEN.DEN_overlord_nation.GetNameDef] отримає менше зброї з данської території."
 denmark_overlord_events.16.a:0 "Одного разу ми покажемо їм справжнє смирення..."
 denmark_overlord_events.22.desc:0 "Демократія прекрасна тим, з якого різноманіття кандидатів вона дає змогу обирати."
 denmark_overlord_events.30.desc:0 "Нам вдалося переконати данський уряд заборонити фашизм на тлі нашої смертельної боротьби з цією ідеологією. У цій битві може бути тільки один переможець, і ми повинні взяти гору в ім'я благоденства [ROOT.GetAdjective]ого народу!"
 denmark_overlord_events.33.t:0 "[FROM.GetNameDefCap] поставляє зброю"
 denmark_overlord_events.4.t:0 "[FROM.GetLeader] відкидає наші вибачення"
 denmark_overlord_events.40.t:0 "[FROM.GetAdjective]ий повноважний представник"
 denmark_overlord_events.6.a:0 "Це не наша вина, і лідер держави здатний це зрозуміти"
 denmark_political_events.10.desc:0 "Після нашого успіху на останніх виборах противники поширюють мерзенну брехню про наш уряд, щоб підірвати його позиції. Нам ясно, хто стоїть за наклепом, але зараз ми мало що можемо з цим вдіяти. Не дивно, що політична опозиція будує свою програму на такій брехні!"
