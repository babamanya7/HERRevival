 ITA_appeal_to_the_bourgeoisie:0 "Звернутися до буржуазії"
 ITA_appeal_to_the_bourgeoisie_desc:0 "Ми мусимо звернутися до буржуазних груп, зацікавлених у падінні фашистського режиму. З ресурсами у їхньому розпорядженні та мужністю наших революціонерів ми зможемо швидко покласти край цій кривавій війні!"
 ITA_battaglioni_m_desc:0 "Нам потрібні нові елітні підрозділи, щоби стримати наступ ворога. Ми мусимо трансформувати та посилити батальйони чорносорочників, які відзначилися в боях, і використовувати ці війська для зміцнення найслабших місць на нашій лінії фронту і відкинути ворога назад, звідки він прийшов."
 ITA_befriend_portugal:0 "$ITA_portugal_friend$"
 ITA_bolstered_political_cabinet_desc:0 "Наявність правильних людей у правильних місцях зміцнить фашистську систему та наше панування над державою [ITA.GetNameDef]."
 ITA_by_blood_alone_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$\n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+5.0%§!\n\n"
 ITA_condemn_colonialism:0 "Засудити колоніалізм"
 ITA_cooperation_programs_deal_root_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetName]§!"
 ITA_corpo_volontari_della_liberta:0 "Corpo Volontari della Libertà"
 ITA_defense_against_capitalism:0 "Оборона проти капіталізму"
 ITA_demand_balearic_islands:0 "Вимогти Балеарські острови"
 ITA_demand_turkish_demilitarization:0 "Вимогти демілітаризацію областей [342.GetName] і [339.GetName]"
 ITA_democrazia_cristiana:0 "ХД"
 ITA_depose_mussolini:0 "Скинути Муссоліні"
 ITA_devaluate_the_lire_desc:0 "Війна обійшлася набагато дорожче, ніж нам хотілося би. Наша економіка бореться з її наслідками. Девальвація нашої валюти зробить нашу продукцію більш конкурентоспроможною на міжнародному ринку, але зробить життя пересічного італійця трохи важчим — необхідна жертва, на яку вони з радістю підуть."
 ITA_develop_ethiopia_desc:0 "Уперті ефіопи довгий час кидали нам виклик і принижували нас. Тепер, коли їх нарешті притиснули до землі, ми можемо розвивати їхню країну та показати їм, що наше вторгнення було для їхнього ж блага."
 ITA_disband_the_blackshirts_desc:0 "Чорносорочники — дуже небезпечна організація на службі у фашизму, тому настав час їм зникнути, як це зробив їхній фашистський режим. Ми негайно розпустимо всі активні підрозділи."
 ITA_divino_duce_1_desc:0 "Завдяки сильному культу особистості навколо [ITA.GetLeader] італійський народ ніколи не відмовиться від своєї вірності своєму Дуче та не порушить її. Вони з легкістю перенесуть будь-які труднощі, які їх спіткають, і ніколи не здадуться."
 ITA_escort_ships_purchase_ongoing_flag:0 " Вже є спроби продати кораблі супроводу іншій країні"
 ITA_european_democracies:0 "Європейські демократії"
 ITA_expand_intelligence_services:0 "Розширити служби розвідки"
 ITA_expand_intelligence_services_desc:0 "У цю нову епоху знання — це сила. Ми мусимо розширювати різні галузі розвідки, щоби гарантувати, що зможемо конкурувати з іноземними спецслужбами."
 ITA_expand_naval_intelligence:0 "Розширити морську розвідку"
 ITA_fronte_militare_clandestino_modifier_tt:0 "Отримає модифікатор §Y$ITA_fronte_militare_clandestino_modifier$ (Італія)§! (§Y730§! днів), що дасть:\n   $MODIFIER_RESISTANCE_GROWTH_ON_OUR_OCCUPIED_STATES$: §G+10%§!\n   $MODIFIER_REQUIRED_GARRISON_FACTOR$: §R+15%§!\n\n"
 ITA_fronte_militare_clandestino_spawn_divs_friendly_rome_tt:0 "Створити §Y2 піхотні§! дивізії та §Y2§! дивізії §Yополчення§! в області §Y[THIS.GetName]§!.\n\n"
 ITA_gappisti_state_modifier_rsi_tt:0 "$ITA_modify_partisan_state_modifier_intro$\nЦіль спротиву $ITA_in_our_controlled_states_cw$: §R+10%§!\nШкода нашим гарнізонам $ITA_in_our_controlled_states_cw$: §R+10%§!\n\n"
 ITA_grande_rivolta_rurale_terrain_bonus_tt:0 "Дає доступ до §Yдоктрини гірської війни§!, поки цей національний дух активний, що дає §Yополченню§! бонуси в §Yпагорбах§! і §Yгорах§!: Атака: §G+5%§!, Рух: §G+10%§!"
 ITA_has_fiat_tt:0 "Є конструктор танків §Y$fiat$§!"
 ITA_heavy_cruiser_2_desc:0 "Клас «San Giorgio» — це гіпотетичний клас міжвоєнних важких крейсерів, які були би спущені на воду незадовго до початку війни. Ці крейсери мали б водотоннажність понад 11 000 тонн та вісім 203-мм гармат Ansaldo."
 ITA_integrate_polizia_dell_africa_italiana_ethiopia_tt:0 "Створити §Y2 піхотні§! дивізії."
 ITA_international_support_consumer_goods_tt:0 "Отримує '§Y$ITA_international_aid$§!' яка дає ($MODIFIER_CONSUMER_GOODS_FACTOR$: §Y[?ITA_consumer_goods_from_leftist_aid|%]§!) на §Y730§! днів."
 ITA_italian_tankettes_flamethrower_tt:0 "\nКоли буде завершено спеціальний проєкт §Y$sp_land_flamethrower_tank$§!:\n"
 ITA_light_cruiser_2:0 "Клас «Duca degli Abruzzi»"
 ITA_light_tank_equipment_1_short:0 "L3"
 ITA_light_tank_equipment_3:0 "L8"
 ITA_mario_roatta:0 "Маріо Роатта"
 ITA_masters_of_the_aegean:0 "Господарі Егейського моря"
 ITA_milizia_marittima_di_artiglieria_desc:0 "Італія має розгалужену берегову лінію та ізольовані, вразливі до вторгнення острівні порти. Реформовуючи наше Берегове ополчення та інвестовуючи в нашу берегову оборону, ми можемо запевнитися, що будь-які загарбники заплатять високу ціну."
 ITA_missiolini_occupy_albania:0 "Окупувати Албанію"
 ITA_missiolini_occupy_greece_desc:0 "Подібно до давніх римських легіонів, ми теж можемо розірвати накладені на нас обмеження, завоювавши Грецію, і об'єднати наші братні народи."
 ITA_moschettieri_del_duce_default:0 "Moschettieri del Duce"
 ITA_novus_ordo_modifier:0 "Novus Ordo"
 ITA_pacify_ethiopia_goal_tt:0 "Усі початкові ефіопські землі мають більш ніж §Y60%§! підпорядкування"
 ITA_paramilitary_training:0 "Тренування воєнізованих організацій"
 ITA_peace_preservation:0 "Збереження миру"
 ITA_reorganize_irregulars_desc:0 "Реорганізувавши наші нерегулярні війська, ми могли б посилити їх, зробивши більш грізною силою."
 ITA_reorganize_regio_esercito_desc:0 "Із новим керівництвом приходить нове розуміння. Кожному, хто дійсно намагається подивитися, зрозуміло, що наша переможна армія, безумовно, має області, в яких вона ще може вдосконалюватися. З нещодавно вивільненими ресурсами ми мусимо інвестувати в більший вишкіл і реорганізувати збройні сили так, щоби ніщо не могло стояти на їхньому шляху!"
 ITA_secret_weapons_desc:0 "$secret_weapons_desc$"
 ITA_stockpile_fuel_desc:0 "Нафта — це кров, що тече в жилах наших кораблів; без неї флот був би бездіяльним. Оскільки Італія не має значних внутрішніх запасів нафти, життєво важливо будувати нафтосховища та заповнювати їх, щоби підтримувати наші сили, навіть якщо майбутні конфлікти відріжуть нас від імпорту."
 ITA_stop_the_squandering_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$modifier_production_speed_arms_factory_factor$: §G+5.00%§!\n\n"
 ITA_strengthen_the_papacy:0 "Зміцнити папство"
 ITA_submarine_4:0 "Клас «Pietro Calvi»"
 ITA_superesercito_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_ARMY_ORG$: §G+5.0%§!\n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-5.0%§!\n$MODIFIER_LAND_DOCTRINE_COST_FACTOR$: §G-10.00%§!\n\n"
 ITA_support_the_hungarians:0 "Підтримати угорську претензію на область [45.GetName]"
 ITA_the_fight_overseas_bunkers_tt:0 "Додати §Y2 наземні укріплення§! та §Y2 прибережні укріплення§! в кожній провінції з морською базою або центром постачання в повністю контрольованих африканських землях."
 ITA_the_king_of_the_skies:0 "Король небес"
 ITA_tomislav:0 "Томіслав II"
 ITA_vallo_alpino_del_littorio:0 "Vallo Alpino del Littorio"
 ITA_vallo_alpino_del_littorio_dec_cat:0 "Vallo Alpino del Littorio"
 ITA_vallo_alpino_occidentale_desc:0 "Ми можемо вбезпечити наш західний кордон, побудувавши там низку укріплень."
 ITA_vallo_alpino_settentrionale_east:0 "Vallo Alpino Settentrionale — Схід"
 ITA_war_with_france_desc:0 "$ITA_go_after_france_desc$"
 Illyria:0 "Іллірія"
 JAN_fascism_DEF:0 "Полярна імперія Ян-Маєн"
 JAP_EQUIPMENT_VERSION_2:0 "Kai B"
 JAP_Indian_National_Army_arrives:0 "Дві дивізії Індійської національної армії прибувають до Сінґапуру."
 JAP_a_red_sun_rises_for_a_new_era_desc:0 "Революція перемогла, перемога за нами! Після поразки останніх осередків антиреволюційного опору ми повинні взятися за реорганізацію держави на соціалістичний лад. Однак у партії існують серйозні розбіжності щодо того, як це має бути зроблено. Тому ми повинні провести великі дебати, щоб визначити майбутню траєкторію нашої держави."
 JAP_adopt_new_assault_doctrine_desc:0 "Генерал Шунроку Хата запропонував новий спосіб рішучої перемоги над ворогом у битві. Використовуючи велику кількість артилерії, ми зможемо змусити ворога підкоритися обстрілами, і тоді нам доведеться лише атакувати деморалізовані та розбиті залишки, щоб закріпити успіх."
 JAP_adopt_syndicalist_ideas_desc:0 "Ми повинні прийняти ідеї створення синдикалістських кооперативів у нашій промисловості та використовувати їхні ідеї щодо функціонування відносин між окремими особами та їхніми роботодавцями для вдосконалення нашої поточної промислової моделі."
 JAP_battleship_3_desc:0 "Клас «Tajima» був гіпотетичним класом швидких лінкорів, розроблених для того, щоб бути дешевшими і швидшими у будівництві, ніж масивні лінкори класу «Yamato». Вони використовували старі гармати попередніх лінкорів, але висока швидкість, адекватна броня і зенітні установки забезпечували захист цих кораблів."
 JAP_big_government_faction_gain_tt:0 "£imperial_influence_texticon $JAP_government_faction$ $JAP_big_influence_gain$"
 JAP_democratic_nationalize_zaibatsus_desc:0 "Найбільші корпорації нашої країни довгий час мали безпрецедентну політичну та економічну владу. Цьому настав кінець. Контроль держави не підлягатиме сумніву. Ми повинні націоналізувати їх і використати їхній капітал на благо народу!"
 JAP_develop_the_yen_bloc_tt:0 "Відкриває рішення для §Yінтеграції економік§! наших §Yазійських союзників§!"
 JAP_draft_the_showa_constitution_desc_key_emperor_eian:0 "Ми приймаємо і поважаємо імперську історію нашої нації. Однак авторитаризму немає місця в Японії, яку ми хочемо побудувати. Ми збережемо нового Імператора як номінального лідера, але обмежимо його владу в конституції, як це є в багатьох західних країнах."
 JAP_embrace_kokutai_desc:0 "Наша національна ідентичність, сутність і характер занадто довго ігнорувалися і розмивалися минулими урядами, і вони близькі до того, щоб загубитися у вітрах часу. Ми повинні гарантувати, що кожен [ROOT.GetAdjective]ий громадянин розуміє, що його обов'язок — жити відповідно до наших традицій і жити у злагоді з Кокутай."
 JAP_ensure_temporary_peace_with_china_desc:0 "Щоб зосередити нашу увагу на [SOV.GetNameDef], ми повинні переконатися, що віроломні [CHI.GetAdjective]і сили не вдарять нам у спину, поки наші сили будуть задіяні в боях в іншому місці. Ми також повинні переконатися, що Квантунська армія тим часом не діятиме самовільно, щоб вони не розпочали війну, яку ми не зможемо виграти."
 JAP_escalate_incident_to_border_conflict_MON_desc:0 "Схоже, що [MON.GetAdjective]і війська не відступають від конфлікту. На цьому етапі ми повинні або перейти до збройного протистояння, або відступити самі."
 JAP_establish_synthetic_fuel_joint_venture_desc:0 "З 20-х років ми маємо спільні підприємства з Німеччиною для створення центрів видобутку синтетичних ресурсів з вугілля та нафти. Ми повинні розширити наші горизонти та прагнути збільшити цю співпрацю із західними державами, щоб нарешті стати самодостатніми."
 JAP_establish_the_northern_resource_area:0 "Північна зона ресурсів"
 JAP_finish_the_fight_desc:0 "Потрібно кинути виклик нашій старій колонії та знищити останній оплот ворожої ідеології."
