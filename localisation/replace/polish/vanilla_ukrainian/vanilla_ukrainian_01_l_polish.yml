 INS_fate_of_de_javasche_bank_scripted_name_colony:0 "Доля De Javasche Bank"
 INS_feint_uprising_tt:0 "Найближчі підрозділи KNIL та нідерландської армії будуть дислоковані в цей регіон для придушення місцевих заворушень, залишаючи сусідні регіони тимчасово беззахисними."
 INS_has_built_at_least_one_civ:0 "Побудовано щонайменше одну §Y$industrial_complex$§!"
 INS_hatta_focus_2_desc:0 "Революція закінчилася, і хоча певні політичні діячі наполягають, що революція має продовжуватися, ці голоси слід ігнорувати. Натомість ми маємо дивитися вперед, ми маємо розбудовувати Індонезію, щоб майбутні покоління жили в процвітанні."
