 USA_focus_on_europe:0 "Зосередитися на Європі"
 USA_infantry_equipment_0_short:0 "M1903 Springfield"
 USA_maritime_commission_desc:0 "Більшість нефахівців наголошує лише на бойових кораблях, але справжні експерти знають, що перемога на війні неможлива без звичайних вантажних суден. Щоб наростити обсяги поставок у воєнний час, ми створимо спеціальну комісію для контролю за будівництвом вантажних кораблів."
 USA_monroe_doctrine_idea_desc:0 "Сполучені Штати давно обіцяють захищати західну півкулю від зовнішнього втручання колоніальних держав, а це означає, що будь-яке вторгнення на нашу територію, швидше за все, означатиме, що США прийдуть нам на допомогу. Однак, якщо наша політика більше не відповідатиме політиці Сполучених Штатів, ми можемо опинитися беззахисними."
 USA_national_employment_strategy:0 "Національна стратегія працевлаштування"
 USA_pax_americana_tt:0 "§Y@USAСполучені Штати§! зможуть втручатися у війни між американськими країнами."
 USA_prepare_intervention_desc:0 "Після низки прийнятих дипломатичних та торгових рішень наша позиція на світовій арені змінилася. Раніше ми дотримувалися політики нейтралітету та ізоляціонізму, але тепер готові протистояти будь-якій іноземній агресії. Наша військова політика має відображати такий стан речей."
 USA_privatization:0 "Приватизація держкомпаній"
