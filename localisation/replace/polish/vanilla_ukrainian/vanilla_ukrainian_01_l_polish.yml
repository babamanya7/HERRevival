 IRQ_party_of_national_brotherhood_desc:0 "Надто довго уряд піддавався [ENG.GetAdjective] примхам. Тільки Партія національного братерства має потенціал піднести [IRQ.GetNonIdeologyName] до величі."
 IRQ_political_events.15.desc:0 "Схоже, [FROM.GetAdjective] збройні сили відступають від підвищеної боєготовності вздовж кордону. Хоча ми були готові захищати нашу територію, приємно, що війни вдалося уникнути, принаймні наразі."
