 governments_in_exile_host_desc:0 "Незважаючи на окупацію їхніх країн противником, деякі відважні солдати та громадяни готові продовжувати боротьбу. Якщо ми публічно визнаємо ці уряди у вигнанні, вони зможуть скористатися ресурсами місцевих емігрантських кіл, щоби створити свої загони та боротися разом з нами."
 greater_italy_category_desc:0 "Ранні етапи італійського іредентизму перемогли під час Великої війни та анексії Південного Тіролю й Істрії, але після цього ідеї італійського об'єднання зрадили західні союзники. Під керівництвом лідера [ITA.GetLeader] ці ідеї відродилися, і Італія буде стояти високо у віках. Viva l'Italia e gloria al Duce!"
