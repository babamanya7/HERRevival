 XSM_rebuild_the_ninghai_army_desc:0 "In order to once again bring order to our southern provinces and secure our borders, we must rebuild the Ninghai army. By doing this, we should be able to gain the upper hand in our skirmishes against the Tibetans."
 XSM_sideline_family_conflicts:0 "Відкласти сімейні конфлікти"
