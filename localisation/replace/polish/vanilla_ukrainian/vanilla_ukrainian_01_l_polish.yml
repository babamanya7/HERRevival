 EST_GATHERING_STORM_DESC:0 "Маючи комуністичну загрозу на сході та фашистську на півдні, Константін Пятс і Патріотична ліга захопили повний контроль над нацією, щоби забезпечити майбутнє Естонії. Група ветеранів Війни за незалежність Естонії організувалася в рух, відомий як Вапс — правих популістів, які прагнуть вирвати контроль над нацією з нейтральних рук.\n\nМайбутнє Естонії залишається невизначеним. Чи збереже Пятс мир і розпочне Епоху мовчання, чи Вапси візьмуть під країну свій контроль і заснують нову естонську державу?"
