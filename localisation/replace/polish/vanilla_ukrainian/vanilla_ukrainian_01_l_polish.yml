 URG_force_through_corporatism_desc:0 "Уряд вже намагався проштовхнути корпоратизм один раз, але політики того часу рішуче боролися з цим, і ідея була відхилена. Сьогодні не буде жодного компромісу, ми проштовхнемо це законодавство будь-якою ціною."
 URG_german:0 "Уругвайська колонія"
