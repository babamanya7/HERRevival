 FRA_reach_out_to_spain_desc:0 "Щойно оговтавшись після громадянської війни, Іспанія є нашим природним союзником у наших спробах змінити континент."
 FRA_reorganize_aviation_industry_south_west:0 "Реорганізувати авіаційну промисловість на південному заході"
 FRA_return_to_borodino_desc:0 "Під Бородіном Наполеон найближче наблизився до досягнення своєї перемоги в Європі. Російська армія була майже знищена, і якби він був трохи швидше, він міг би змиритися з росіянами. Ми покажемо всьому світу, що це можливо."
 FRA_roger_salengro:0 "Рожер Саленґро"
 FRA_slum_clearing_desc:0 "Незважаючи на те, що простий французький робітник знаходиться в одній із великих держав світу, він часто живе в жахливих умовах огидної убогості. Жоден король, гідний цього титулу, не може терпіти, щоб його піддані жили в такому стані."
 FRA_strat_bomber_equipment_1:0 "Farman F.223"
 FRA_super_heavy_tank_equipment_1:0 "FCM-F1"
 FRA_the_free_french_navy_desc:0 "Наші союзники замкнені у відчайдушній боротьбі за виживання, для якої життєво важливі морські шляхи. Ми мусимо зробити свій внесок, щоби допомогти їм."
 FRA_two_countries_two_crowns_desc:0 "Немає жодного можливого способу, яким ми могли б об'єднати країни, де одна не вважала б себе суб'єктом іншої. Натомість ми радимо королю правити обома в особистому, але не правовому союзі."
 FRA_weapons_purchases_category_desc:0 "Оскільки наша промисловість все ще наздоганяє іноземні, пошук сучасного озброєння за кордоном може бути єдиним способом привести наші збройні сили до сучасних стандартів."
 FRA_west_africa_intervention.3.a:0 "Марна трата часу."
 FRA_work_desc:0 "Ремісник є найважливішою складовою економіки. Коли керуються потрібними людьми, немає більш благородного покликання, ніж покласти свою працю на службу своїй країні."
