 SWI_spirit_of_saint_bernard_idea_tooltip:0 "Відшкодування втрат шпиталями: §G+10%§!\nМножник втрати досвіду: §G-30%§!"
 SWI_volunteer_force_desc:0 "Ми ще не у стані війни, але [ROOT.GetAdjective]ий народ готовий боротися за демократію. Нас не можна вважати порушниками нейтралітету, але як демократична держава ми не можемо контролювати, куди ходять наші люди та де вони воюють, тому ми можемо спокійно заохочувати взятися за зброю проти тиранії, готуючись до решти [ROOT.GetName] відкрито приєднуючись до зусиль."
