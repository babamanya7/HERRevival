 COG_oust_the_gold_barons:0 "Вигнати золотих баронів"
 COG_raf_and_saaf_cooperation_desc:0 "Багато наших пілотів залишилися служити в Королівських військово-повітряних силах. Хоча співпраця з Британським співтовариством нас болить, це значно допоможе нам здобути досвід та тактику для використання їхніх навичок на полі бою."
 COG_reclaim_bujumbura_desc:0 "Ми не можемо вважати себе новим Королівством Бурунді, якщо не контролюємо нашу стару столицю. Ми повинні зробити все можливе, щоб повернути цей регіон!"
 COG_slander_the_colonial_authorities_desc:0 "Нам потрібно розпочати масштабну пропагандистську кампанію проти колоніальних властей, і викрити перед громадськістю все, що вони зробили і все, що продовжують робити з нами. Лише так ми зможемо здобути справжню підтримку народу."
 COG_societe_nationale_chemins_du_congo_idea:0 "Національна компанія залізниць Конґо"
 COG_spirit_of_loko_yima_desc:0 "[ROOT.GetLeader] несе в собі дух чистого білого Локо Йіма, бога на землі, якого виплюнув небесний батько Бумба під час створення світу. Тому всі повинні слідувати волі [ROOT.GetLeader]."
 COG_state_loyal_to_free_congo_modifier:0 "Провінція, лояльна до вільного Конґо"
 COG_strike_while_the_rion_is_hot_desc:0 "Час настав. Зараз або ніколи. Ми повинні знищити наших ворогів з люттю, щоб наша країна могла бути вільною від колоніальної гніту раз і назавжди!"
