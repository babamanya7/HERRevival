 SIK_protector_of_the_kyrgiz_desc:0 "Киргизький народ по інший бік радянського кордону прагне, щоб його очолював той, хто його розуміє. [ROOT.GetLeader] поділяє їхнє коріння і знає їхні звичаї. Ми повинні звернутися до [SOV.GetLeader] з петицією про об'єднання з провінцією."
