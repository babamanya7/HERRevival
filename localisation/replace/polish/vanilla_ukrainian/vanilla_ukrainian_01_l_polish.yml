 SWE_operation_save_denmark_desc:0 "Можливо, протягом століть у нас були розбіжності з [DEN.GetName], але сьогодні ми об'єднані з її народом і готові звільнити його від тиранії."
 SWE_research_slot_2_desc:0 "Університет Уппсали є найстарішим університетом скандинавського регіону, в якому навчалися такі світила, як Андерс Цельсій, Карл Лінней і Якоб Берцеліус. Коли світ крутиться і збурюється, стає зрозуміло, що наука є найбільшою зброєю в невизначеному світі, і було б певним успіхом інвестувати в такий престижний університет."
 SWE_return_of_the_king:0 "§YКороль§! відновив контроль над §Y[SWE.GetFlag][SWE.GetAdjective]ою§! політикою"
 SWE_severe_lack_of_ammunition:0 "Гостра нестача набоїв"
 SWE_ship_light_medium_battery_4:0 "15cm/53 Bofors M42 RF"
 SWE_ship_torpedo_sub_2:0 "4x 533-мм торпедний апарат"
 SWE_the_barrel_desc:0 "Останні конфлікти прискорили технологічний розвиток у галузі авіації. Тому нам потрібно йти в ногу з нашими ймовірними супротивниками та розробляти власні реактивні літаки, щоб захистити наше небо."
 SWE_train_the_sheltered_manpower_max:0 "Поточна чисельність: [?var:SWE.SWE_train_the_sheltered_manpower_current_manpower]\nМаксимальна чисельність: [?var:SWE.SWE_train_the_sheltered_manpower_current_cap]"
