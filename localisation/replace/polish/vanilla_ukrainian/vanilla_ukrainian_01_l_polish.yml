 PRC_infiltration_desc:0 "Націоналісти хочуть відкритого зіткнення, але не можна піддаватися спокусі. Ми надішлемо невелику групу солдатів для будівництва баз на ворожій території. Коли настане час, ми почнемо повстання і застанемо націоналістів зненацька."
 PRC_infiltration_sea_commie:0 " Якщо інфільтрація досягне §Yрівня 3§!, регіон перейде на наш бік у разі війни проти цільового регіону."
