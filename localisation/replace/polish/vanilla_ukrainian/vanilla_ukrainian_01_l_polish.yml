 PEACE_THIRDPARTY_ACTIONS_DESCRIPTION:0 "Триває мирна конференція. Гра продовжиться, коли всі учасники закінчать свої дії."
 PEACE_TIMED_EFFECT_DEMILITARIZED_ZONE_NAME:0 "Демілітаризована зона"
