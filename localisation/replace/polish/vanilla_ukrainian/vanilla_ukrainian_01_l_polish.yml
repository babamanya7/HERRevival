 SPR_NATIONALISTS_INSTRUCTIONS:0 "Важливо, щоби ми не затягувалися занадто довго, щоби не дати республіканцям час підготувати свій захист."
 SPR_alexander_orlov:0 "Олександр Орлов"
 SPR_avenge_foreign_interference_desc:0 "Іноземні держави втрутилися в громадянську війну проти нас, підтримуючи наших фашистських ворогів. Ми не забули про це, і наша відповідь нарешті під рукою."
 SPR_end_fascism_at_all_costs_desc:0 "Ніщо не має значення, крім повного знищення фашистів — якщо ми повинні продати свої душі комунізму, щоби досягти цього, хай буде так."
 SPR_exploit_spains_riches:0 "Експлуатувати багатства Іспанії"
 SPR_fighter_equipment_2_short:0 "HA-1112"
 SPR_maintaining_the_fire_desc:0 "Втома від війни є провісником падіння. Ми повинні залишатися сильними і відроджувати в людях вогонь, який спонукає їх робити все можливе."
 SPR_opposition_civil_war_preparations_desc:0 "Поки ми докладаємо зусиль, щоб зірвати кожен їхній крок, наші вороги не сидять склавши руки. Нам варто пам'ятати про їхні дії, готуючись до майбутнього конфлікту."
