 soviet.6.d:0 "Держава [FROM.GetNameDef] підкорилася нашим вимогам. Ми замінили занепалий уряд у Таллінні на Народний парламент, який одноголосно проголосував за перетворення держави [FROM.GetNameDef] на радянську соціалістичну республіку. Після обговорення Верховна Рада вирішила задовольнити цю вимогу."
