 SWI_nationalistic_industrialist:0 "Націоналістичний промисловець"
 SWI_ortswehren_desc:0 "Тотальна війна означає, що кожен [ROOT.GetAdjective]ий громадянин має бути готовий захищати свій кантон, але не кожен може приєднатися до наших збройних формувань. Ми можемо створити місцеву охорону, щоби служити опорою, на яку ополченці можуть покластися, щоб підтримати їх у їхніх зусиллях захистити [SWI.GetName]."
