l_polish:
 43TitleIsPuppet:0 "передати нашу маріонетку їм"
 AAT_Sweden.35.a:0 "Чудово."
 AAT_Sweden.44.t:0 "[FROM.GetName] погоджується демілітаризовувати область [148.GetName]"
 AAT_Sweden.5.a:0 "Це просто смішно."
 AAT_Sweden_BoP.10.b:0 "Нам треба знайти баланс поміж капіталізмом та комунізмом."
 AAT_Sweden_ball_bearing.3.desc:0 "Держава [SWE.GetNameDef] звернулася з проханням обміняти їхні безцінні кулькові вальниці, які були би важливим ресурсом для наших військових зусиль, на нашу військову експертизу. [SWE.GetAdjectiveCap]ий уряд, схоже, шукає способи зрівняти шанси з більш розвиненими у військовому відношенні європейськими державами у разі конфлікту в майбутньому."
 AAT_Sweden_flashpoints.30.t:0 "Право проходу крізь державу [SWE.GetName]"
 AAT_Sweden_flashpoints.32.desc:0 "[SWE.GetName] вперто відмовляється надати нам доступ до своєї інфраструктури, посилаючися на свою відданість нейтралітету. Можливо, їм потрібна більш жорстка відповідь, щоби нагадати, що їхня подальша незалежність є лише нагородою від нас за те, що вони дотримуються наших вимог під час реорганізації Європи."
 AAT_Sweden_flashpoints.36.t:0 "Напруга з державою [GER.GetNameDef] спадає"
 AAT_Sweden_flashpoints.50.a:0 "Ми не можемо ризикувати створенням проблем. Ув'язніть їх."
 AAT_Sweden_flashpoints.54.desc:0 "Нещодавня напруженість між владою та тими, хто виступав проти нашого інтернування лівих активістів, почала спадати. Хоча значна частина довіри між владою та народом була втрачена, здається, ми більше не наражаємося на ризик переростання ситуації в конфлікт сектантів."
 AAT_Sweden_flashpoints.73.t:0 "[SWE.GetName] вимагає повернення кораблів"
 AAT_Sweden_nationalists.15.desc:0 "Після масштабних інвестицій у сільську інфраструктуру працівники сільської місцевості стали найактивнішими прихильниками нашого уряду. Завдяки їхній підтримці та впливу на продовольчий ланцюг країни, ми маємо міцний прошарок підтримки, який може стримуватиме міських робітників у майбутньому."
 AAT_Sweden_nationalists.16.a:0 "Простолюдини не поважають своїх правителів."
 AAT_Sweden_nationalists.9.t:0 "Промисловці пропонують підтримку"
 AAT_USA_events.08.t:0 "[FROM.GetNameDefCap] запитує територію Данії"
 AAT_finland_continuation_war.03.a:0 "Яка втрачена можливість..."
 AAT_finland_diplomacy.14.a:0 "Ну, раз вони так говорять..."
 AAT_finland_misc_events.02.b:0 "Це ж просто нерозумно."
 AAT_finland_misc_events.03.t:0 "[?FIN_faction_leader_recieving_resource_rights.GetAdjective]а допомога проєкту розвитку"
 AAT_finland_misc_events.07.desc:0 "У світі, затягнутому в безодню темряви і невизначеності, [FROM.GetName] є маяком науки і технологій, що освітлює шлях. Ця невелика країна за останні роки зробила неймовірний стрибок, і з цим складно сперечатися. Надійшла пропозиція об'єднати нашу наукову громадськість і поділитися результатами досліджень заради загального блага. Ми станемо маяком долі і вкажемо іншим країнам шлях у темряві."
 AAT_finland_the_white_death.10.a:0 "Вони пізнають справжній страх"
 AAT_finland_the_white_death.12.desc:0 "Надійшли повідомлення, що Гяюгя вбитий у бою розривною кулею противника. Єгері забрали його тіло з поля бою і доправили до столиці. Народ держави [FIN.GetNameDef] пам'ятатиме Сімо вічно і вічно буде вдячний йому."
 AAT_nordic_cooperation.7.desc:0 "Наші нордичні сусіди хочуть знайти спільну мову, щоб укласти взаємовигідний договір про економічну та промислову співпрацю. Якщо все буде зроблено належним чином, як ми сподіваємося, це однаково сприятиме розвитку обох наших економік, оскільки ми увійдемо в нього на рівних.\n\nВраховуючи історичні припливи і відпливи ворожнечі в нашому регіоні, ми повинні остерігатися того, щоб не отримати вигоду від майбутнього суперника, якщо він відвернеться від нас спиною."
 AAT_norway.1.desc:0 "Поки суперечливий революціонер був на риболовлі з господарем, фашисти, пов'язані з партією «Національна єдність», увірвалися в будинок Конрада Кнудсена, де зупинився Троцький.\n\nЗлодії шукали будь-які викривальні докази, які б виправдали позбавлення від комуніста-вигнанця, але, на щастя, їх відлякала дочка Кнудсена, Гйордіс, перш ніж вони встигли захопити що-небудь значуще."
 AAT_norway.18.desc_fascist:0 "Слабкий [FROM.GetAdjective]ий уряд здригнувся, а отже, дозволить нам захопити територію, яка силою чи по праву належить нам."
 AAT_norway_allied.2.a:0 "Це прогрес."
 AAT_norway_rikstanken.11.desc:0 "У нашій державі вже давно є танк, який ми ласкаво називаємо Rikstanken — «національний танк». Ми бачили, як він працює та що ми можемо з ним робити, тож, можливо, ми можемо піти далі і спробувати розібрати його на частини, щоби врешті-решт спроєктувати та виготовити свій власний. Зрештою, один танк не має великої бойової переваги."
 AAT_norway_rikstanken.2.c:0 "Торговельний пакт може нас ідеологічно зблизити."
 AAT_norway_rikstanken.6.t:0 "[FROM.GetName] хоче співпрацювати в дослідженні танків"
