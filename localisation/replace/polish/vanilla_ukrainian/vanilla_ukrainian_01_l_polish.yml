 ARG_social_welfare_fund_ns:0 "[ARG.GetAdjectiveCap]ий фонд соціального забезпечення"
 ARG_spirit_of_the_cisplatine_war_idea_desc:0 "Сісплатінська війна також широко відома як Аргентинсько-бразильська війна. Це був збройний конфлікт, що стався у 1820-х роках, і відтоді між нашими країнами встановився напружений і неспокійний мир. Це вже не так. [BRA.GetNameDefCap] — це загроза, з якою треба боротися. Наші війська марширують з духом нашого минулого в попутному вітрі."
 ARMY_DIVISIONS_GROUP_NO_LEADER:0 "В армії $ARMY_NAME|H$"
 ARMY_HQ_DESIGNER:0 "Конструктор штабів армії"
 ARMY_INTEL:0 "Армійські розвіддані"
 ARMY_LEDGER_THRESHOLD_FUZZY_DEPLOYED_MANPOWER:0 "Приблизні розгорнуті людські ресурси «в полі»"
 ARMY_LEDGER_THRESHOLD_STOCKPILE_TYPES:0 "Типи оснащення та кількість запасів"
 ARMY_NAVY_LABEL:0 "Огляд флоту"
 ASSIGNABLE_ADMIRAL_TRAITS_DESC:0 "Риси адмірала — це риси, які можна вручну призначити адміралу."
 AST_abolition_of_private_property:0 "Скасування приватної власності"
 AST_advance_pacific_initiatives_jap_tt:0 " §Y[JAP.GetName]§!, щоб додати §G2§! позамапові §YВерфі§! до ефектів."
 AST_alice_springs_desc:0 "Глушина велика... дуже велика. У її центрі лежить невелике містечко Аліс-Спрінґс, яке може служити центральним логістичним хабом для операцій по всій Австралії. Ми маємо розвивати його та створити там армійську базу для тренування військ, готових до будь-яких умов."
 AST_alp_50_discount:0 "\n\n§YЕфект від >50% Демократичних голосів§!:\nКластери фокусів §YАЛП§!:\nСкорочення часу завершення на §Y5§! днів.\n\nПідніміть Голоси вище §Y70%§!, щоб отримати скорочення часу завершення на §Y10§! днів для кластерів фокусів §YАЛП§!."
 AST_australian_war_cabinet:0 "Австралійський воєнний кабінет"
 AST_autonomy_dominion:0 "Австралія"
 AST_battle_cruiser_1_desc:0 "$ENG_battle_cruiser_1_desc$"
 AST_battleship_2:0 "$ENG_battleship_2$"
 AST_canberra_air_disaster_events.5.a:0 "Претензії неправдиві, нам не потрібно діяти."
 AST_charles_burnett:0 "Чарлз Бернетт"
 AST_department_of_munitions_desc:0 "Щоб належним чином постачати наших хлопців на фронті, нам потрібно прискорити виробництво боєприпасів. Створивши Міністерство боєприпасів, ми зможемо забезпечити посилений контроль за виробництвом оборонних компонентів."
 AST_diplomatic_events.20.t:0 "Виклик до Британського воєнного кабінету"
 AST_diplomatic_events.26.a:0 "Тихоокеанські нації об'єднують зусилля."
 AST_diplomatic_events.32.t:0 "[FROM.GetNameDefCap] надає права на ресурси"
 AST_diplomatic_events.55.a:0 "Ми розширюватимемося."
 AST_diplomatic_events.63.t:0 "Ірландія відмовляється!"
 AST_diplomatic_events.75.a:0 "Виникає новий порядок."
 AST_diplomatic_events.81.t:0 "Чарівний символ єдності"
 AST_dividing_the_pacific_tt2:0 "§RВони отримують§!:"
 AST_empower_the_workers_desc:0 "Австралія — нація каторжників, фермерів та докерів. Настав час дати голос і владу робітничому класу та пролетаріату Австралії. Хай живе революція!"
 AST_ending_overseas_conscription:0 "Скасування заморського призову"
 AST_equitable_diplomat:0 "Справедливий дипломат"
 AST_eric_campbell:0 "Ерік Кемпбелл"
 AST_expected_election_winner_text:0 "§YОчікуваний переможець§!"
 AST_frank_berryman:0 "Френк Берріман"
 AST_government_aircraft_factories_desc:0 "Враховуючи нашу віддаленість від Європи, ми не можемо покладатися на традиційні джерела постачання літаків у воєнний час. Тому нам необхідно розвивати власні внутрішні виробничі потужності, щоб виготовляти корпуси літаків та двигуни за нашими власними специфікаціями."
 AST_heavy_tank_aa_equipment_2:0 "Churchill Local Pattern Anti-Air"
 AST_in_from_the_cold_desc:0 "«Австралії понад усе» та її прихильникам більше не потрібно ховатися. Погане ставлення, якого наша нація зазнала за довгої низки попередніх урядів, нарешті висвітлено, і настав час для нових голосів бути почутими."
 AST_jet_plane_short:0 "Vampire"
 AST_jet_strat_bomber_equipment_1:0 "Avro Vulcan"
 AST_labor_campaign_tour_votes:0 "\n $AST_labor_campaign_tour_mission$: §G+0.05%§!"
 AST_mio_trait_boomerang_spirit:0 "Дух «Бумеранга»"
 AST_mio_trait_gladiator_lessons_learned:0 "Уроки «Gladiator»"
 AST_non_ruling_party:0 "§YОпозиційна партія§!"
 AST_nz_puppet_desc:0 "Пролетарі Нової Зеландії мають приєднатися до своїх австралійських братів та сестер. Ми простягли їм руку допомоги та пообіцяли захищати їх, якщо вони перейдуть під наше управління."
 AST_pacific_area_navy_desc:0 "Поки Його Величність бореться за виживання в Європі, нашою першорядною метою є створення флоту, здатного дати відсіч ворогам тут, у Тихому океані. Ми мусимо виробити стратегії, які дозволять виконати це завдання."
 AST_pacific_resistance:0 "Тихоокеанський опір"
 AST_party_campaign_text:0 "Політична кампанія"
 AST_reestablish_central_flying_school:0 "Відновлення Центральної льотної школи"
 AST_reliable:0 "Надійний"
 AST_revolutionary_equalist:0 "Революційний екваліст"
 AST_rile_up_veterans_desc:0 "На початку Великої депресії ветерани Першої світової війни об'єдналися в ультраправі воєнізовані групи для протидії поширенню комунізму. Навіть якщо ці групи відтоді розпалися, їхні колишні члени нікуди не зникли; «Австралія понад усе» поглине їх, і факел антикомунізму горітиме далі."
 AST_royal_australian_navy_spirit_tt:0 "Змінює §Y$AST_royal_australian_navy_spirit$§! на:"
 AST_scrap_iron_flotilla_desc:0 "Поки ми не поліпшимо наш флот, нам доведеться використати те, що є. Нехай наші вороги називають ці старі есмінці «флотилією з металобрухту» — вона послужить нам вірою та правдою."
 AST_solidarity_by_the_empire:0 "Солідарність Імперії"
 AST_south_australian_housing_trust_desc:0 "Південна Австралія потребує інвестицій та розвитку промисловості, тому вона направить ресурси на комплексне освоєння території та поліпшення поточних житлових умов, особливо в Аделаїді."
 AST_sydney_rowell:0 "Сідні Роуелл"
 AST_the_pacific_resistance_desc:0 "Незалежність Австралії нарешті настала, і буде правильним відмовитися від участі у британських війнах. Прагнучи до єдності з [USA.GetNameDef] натомість, ми можемо формувати стратегії спільного командування, які цінують австралійські інтереси, поки ми самостійно беремо повний контроль над власною оборонною промисловістю та її розширенням."
 AST_the_promise_of_nauru_tt:0 "Ефекти після того, як §Y[AST.GetName]§! фіналізує угоду:\n§YНауру§! переходить у власність та під контроль §Y[GER.GetName]§!\n§Y[AST.GetName]§! стає вільною\n[GET_AST_NAURU_PACT_FACTION_EFFECT]"
 AST_uap_election_win:0 "§YУАП§! отримує §Y1§! Перемогу на виборах.\n\n[GET_AST_UAP_CLUSTER_UNLOCK][GET_AST_15_NATUNITY]"
 AST_uap_win_count_trigger_tt:0 "§YУАП§! має щонайменше $COUNT|Y$ Перемог на виборах."
 AST_unifying_figure:0 "Об'єднавча фігура"
 AST_union_control_local:0 "Розблоковує рішення §YКонтроль профспілок§!. \nДозволяє комуністичне проникнення в Індонезію та Філіппіни."
 AST_union_strike:0 "Організувати страйк"
 AST_war_funder:0 "Спонсор війни"
 AST_war_is_coming_uap_advisors_tt:0 "§Y$AST_billy_hughes$§!:"
 ATTACHED_AIR_WING_DELAYED_DESC:0 "§GКлацніть ЛКМ§!, щоб обрати прикріплену армію.\n§GКлацніть ПКМ§!, щоби відкріпити."
 ATTACH_AIR_WING_DESC:0 "§GКлацніть§!, щоби прикріпити обрані авіакрила до армії."
 ATTRITION_DESC:0 "Щоденна ймовірність втрати оснащення"
 ATTRITION_SUPPLY:0 " - Поганий стан постачання: $ATT|-0%$"
 AUS_BEL_autonomy_eu_member_ADJ:0 "Австрійськ"
 AUS_VICTORY_POINTS_11598:0 "Боцен"
 AUS_VICTORY_POINTS_11610:0 "Фюнфкірхен"
 AUS_alpen_elektrowerke_designer:0 "Alpen-Elektrowerke"
 AUS_alpine_federation_focus_desc:0 "Ми більше не вважаємо, що самостійність є найкращим вибором для Австрії, однак жодна інша фракція не здається життєздатним вибором. Це було б чудовою можливістю для нас звернутися до решти альпійського регіону з пропозицією."
 AUS_army:0 "Österreichisches Bundesheer"
 AUS_austrian_empire_fascism_DEF:0 "Австрійська імперія"
 AUS_austromarxism_desc:0 "Австромарксистська програма, заснована на працях Отто Бауера, яка виступає за золоту середину між соціал-демократією та радянським комунізмом. Зробивши дуже значний поворот від попереднього стану австрофашизму, країна тепер тримається по лінії того, що є комунізмом, і що є демократією."
 AUS_bring_back_the_habsburg_rule_desc:0 "Щоб ми заслужили ім’я справжнього Королівства, нам потрібно коронувати короля, який очолюватиме нашу країну. Наш нинішній регент, безсумнівно, стане чудовим королем, і ми повинні негайно підготуватися до його коронації."
 AUS_cannot_train_due_to_treaty_of_saint_germain_en_laye:0 "Не можна тренувати нові частини, допоки діє §Y$AUS_treaty_of_saint_germain_en_laye$§!"
 AUS_diplomatic_effort:0 "Дунайська дипломатія"
 AUS_diplomatic_effort_desc:0 "Щоб залишатися сильним лідером, якого заслуговує наша федерація, ми повинні переконатися, що нас полюбляють усі її члени. Ми повинні активізувати наші дипломатичні зусилля, щоб розважати та поглиблювати наші відносини всередині федерації."
 AUS_eduard_freiherr:0 "Едуард Фрайгерр"
 AUS_end_european_fascism_desc:0 "Поки ми всі не в безпеці — жоден не буде в безпеці. Фашизм все ще поширений у Європі і, безсумнівно, викличе більше проблем у майбутньому. Ми повинні вжити заходів, щоб запобігти поширенню цієї ганебної ідеології."
 AUS_form_nachrichtenabteilun:0 "Сформувати Nachrichtenabteilung"
 AUS_guarding_the_coast_idea:0 "Вартові узбережжя"
 AUS_hand_bosnia_to_our_cro_puppet:0 "Передати Боснію і Герцеговину §Y[FROM.GetNameDef]§!"
 AUS_hirtenberger_artillery_desc:0 "Довгий час Гіртенберґер було нашим ім’ям, коли нам потрібні були артилерійські гармати та боєприпаси. Тепер вони, як і решта нашої військової промисловості, страждали від нестачі фінансування, поки ми діяли під Сен-Жерменським Договором. Ми повинні зробити інвестиції, щоб повернути їх на правильний шлях."
 AUS_industrial_bribery_decision:0 "Підкупити [FROM.OWNER.GetAdjective]их промисловців"
 AUS_integrate_dnsap_remnants:0 "Інтегрувати залишки НСРП"
 AUS_invite_foreign_tank_designers_desc:0 "[AUS.GetNameDefCap] наразі не має надійного конструктора танків. Поки що використовувався широкий вибір танків, але настав час, щоб ми почали виробляти власні. І запрошення Ansaldo працювати на нас — чудовий перший крок."
 AUS_invite_the_entente_desc:0 "Наш союз виграє від збільшення кількості членів у регіоні, навіть якщо це означає вийти за межі нашого альпійського коріння. Мала Антанта була створена для захисту країн від повернення Габсбурґів, і оскільки ми зараз на одній стороні, чому б не запросити їх?"
 AUS_kingdom_of_austria_neutrality_DEF:0 "Ерцгерцогство Австрія"
 AUS_legacy_of_the_empire_desc:0 "Хоча зараз ми лише тінь нашого минулого, могутньої імперії, ніщо не забороняє нам прагнути відновити те, чим ми колись були. Розпалюючи монархічні настрої в нашій країні, ми можемо підготувати її для того, щоб знову стати могутньою монархією."
 AUS_legitimistische_jugend:0 "Легітимістична молодь"
 AUS_legitimistische_studentenverbindung_desc:0 "Студентське легітимістське товариство — організація, яка обслуговує лояльних студентів усіх рівнів освіти. Менш мілітаристські, ніж легітимістичний корпус, вони більш прихильні до дискурсу та дебатів, а також до науки. Їхні інтереси та непохитна відданість короні можуть виявитися для нас дуже корисними!"
 AUS_liechtenstein_neutrality_DEF:0 "Ліхтенштайн"
 AUS_ludwig_von_mises:0 "Людвіґ фон Мізес"
 AUS_makes_demands_desc_57:0 "Наші вимоги, надіслані керівництву [FROM.GetAdjective], «не були адекватно сприйняті». Вони відхиляють наші претензії, не залишаючи нам можливості для подальшого тиску чи ще однієї спроби висунути такі вимоги."
 AUS_maximilian_ronge:0 "Максіміліан Ронґе"
 AUS_meticulous_lawyer:0 "Скрупульозний юрист"
 AUS_military_exercises_on_border_decision:0 "Військові навчання на [FROM.OWNER.GetAdjective]ому кордоні"
 AUS_mio_standardize_piercing_ammunition:0 "Бронебійні боєприпаси"
 AUS_nachrichtenabteilung:0 "Nachrichtenabteilung"
 AUS_news_events.11.desc:0 "Радикально відвернувшись від свого минулого, австрійське керівництво на чолі з [AUS.GetLeader] вирішило створити власний союз. Він висловлює надію, що інші робітники в Центральній Європі з часом повстануть проти своїх гнобителів і приєднаються до них у боротьбі за права народу."
 AUS_news_events.4.a:0 "Це було близько."
 AUS_news_events.9.a:0 "Це було неочікувано"
 AUS_osterreichische_akademie_desc:0 "Австрійська Академія Наук була заснована в 1846 році рукописним указом імператора Фердинанда I. Відтоді вона виросла з невеликої наукової асоціації та товариства до поважної академії, яка виховує лауреатів Нобелівської премії. Академія зазнала труднощів під час нашої фінансової кризи, але наші інвестиції обов’язково повернуть її на правильний шлях і принесуть нам великий прибуток у майбутньому."
 AUS_political_events.119.t:0 "[FROM.GetNameDefCap] вимагає подальших поступок"
 AUS_political_events.122.b:0 "Як би ми його не полюбляли... відмовте."
 AUS_political_events.20.b:0 "Ми підтримуватимемо їх дипломатично"
 AUS_political_events.20.d:0 "Вони дійсно заслуговують того, щоб ми ризикували через них?"
 AUS_political_events.33.t:0 "[FROM.GetNameDefCap] пропонує захоплене обладнання"
 AUS_political_events.51.t:0 "[FROM.GetNameDefCap] відмовляється передати Сілезію"
 AUS_political_events.63.b:0 "Їх допомога була б дуже доречна."
 AUS_political_events.67.a:0 "Прекрасно!"
 AUS_political_events.7.a:0 "Прекрасно!"
 AUS_political_events.7.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 AUS_political_events.76.desc:0 "\nПісля довгих дебатів і багатьох дискусій, гаранти нарешті дійшли угоди. Нам буде дозволено частково переозброїтися з часом, відсьогодні більше жодних обмежень не буде стояти на нашому шляху щодо підготовки нових військ і збільшення кількості розміщених солдатів.\n\nПроте, до нашої промислової галузі все ще діють обмеження, хоча й менш суворі. Вони будуть остаточно зняті через рік, авжеж, якщо сиутація у світі за цей час кардинально не зміниться.\n\nОднак ця перемога дісталася ціною. Гаранти не довіряють нашій здатності триматися подалі від конфлікту, і призначили наглядача, який повинен залишатися в нашому уряді протягом наступного року, до часу недійсності договору."
 AUS_political_events.77.t:0 "Безпосередня загроза"
 AUS_political_events.89.t:0 "[FROM.GetNameDefCap] упирається"
 AUS_political_events.91.a_tt2:0 "§YОтто фон Габсбурґ§! стане фельдмаршалом §Y2-го рівня§!"
 AUS_rapid_rearmament:0 "Швидке переозброєння"
 AUS_rebuild_democratic_systems_tt:0 "Поточна §YФашистська§! партія §YНСРП§! буде заборонена й:"
 AUS_reintegrating_the_empire_category:0 "Реінтегрувати майбутню Імперію"
 AUS_revolution_tt_2:0 "Кількість військ, наданих кожній стороні, залежатиме від рівня популярності §YКомунізму§!.\n\nЯкщо §YПопулярність Комунізму§! перевищить §Y60%§!, Австрія стане комуністичною мирно, уникнувши громадянської війни."
 AUS_second_brothers_war_desc:0 "У 1866 році вибухнула війна між нами та попередником Німеччини. Тоді це була невелика сварка щодо Шлезвіґ-Гольштайну, однак тепер часи змінилися. [GER.GetAdjective] продовжує становити загрозу на нашому північному кордоні. Настав час припинити це братерське суперництво раз і назавжди."
 AUS_seek_international_partners_tt2:0 "§Y[ROOT.GetNameWithFlag]§! отримає 50 §YДосвіду авіації§! за кожну країну, яка відповість згодою!"
 AUS_supporting_the_troops_desc:0 "Щоб ще більше підвищити ефективність наших військ на полі бою, ми повинні надати їм якомога більше підтримки. Допоміжні роти з польовими госпіталями, розвідкою та допоміжними артилерійськими знаряддями принесли б нам велику користь, адже допомогли б нашим збройним силам."
 AUS_the_political_front:0 "Безпека політичного фронту"
 AUS_unexpected_alliances_desc:0 "Ми повинні бути відкритими для будь-якої та кожної дунайської нації, яка може забажати приєднатися до нашої фракції. Не зважаючи на наші минулі розбіжності, ми повинні простягнути руку та запросити їх стати на наш бік заради єдності Дунаю."
 AUS_war_against_guarantors:0 "Війна з гарантами"
 AUS_women_in_academia_desc:0 "Дозвіл жінкам брати участь у вищій освіті дозволив науковому прогресу в Австрії значно підскочити вперед."
 BAH_fascism_DEF:0 "Багамська унітарна держава"
 BALTIC_axis_investments_desc_fasc_eur:0 "Позиції фашизму в Європі зараз сильні, і, незважаючи на цілком виправдані сумніви, не можна заперечувати, що торгівля з фашистськими державами та їх інвестиції значно посилять [ROOT.GetNonIdeologyAdjective] економіку."
 BALTIC_events.5.a:0 "Цікава ідея!"
 BALTIC_events.503.t:0 "Пропагандистська війна в Білорусі"
 BALTIC_overthrow_the_government:0 "Повалити партію [Root.GetNeutralParty]"
 BALTIC_promote_unity_BLR:0 "Оспорити контроль у державі [From.GetName]"
 BALTIC_recent_skirmish:0 "Нещодавня сутичка"
 BALTIC_soviet_settlers:0 "Радянське заселення"
 BAS_neutrality_DEF:0 "Британо-антильська федерація"
 BATTLE_PLANS:0 "Плани бою"
 BBA_ethiopia_balance_of_power_events.22.a:0 "Селянський зброд не здатний до лідерства."
 BBA_ethiopia_balance_of_power_events.22.b:0 "Меритократія в армії має важливе значення."
 BBA_ethiopia_balance_of_power_events.22.t:0 "Реформа офіцерського складу"
 BBA_ethiopia_balance_of_power_events.51.a:0 "Країні потрібна будь-яка допомога, яку вона може отримати."
 BBA_ethiopia_communist_events.05.b:0 "Усі вороги народу мають відповісти за злочини. Ув'язнити його."
 BBA_ethiopia_communist_events.11.a:0 "Ми не можемо проґавити таку нагоду."
 BBA_ethiopia_communist_events.33.t:0 "Незалежність Еритреї"
 BBA_ethiopia_communist_events.46.desc:0 "[ETH.GetAdjective] дипломати звернулися до нас із пропозицією миру. Умова пропозиції — відмова від претензій на [SUD.GetAdjective] територію, яку ми втратили на користь [ETH.GetNameDef] під час цього конфлікту. Дипломати також заявляють, що в регіоні буде створено [SUD.GetAdjective]ий уряд. Наскільки незалежним буде цей уряд — ще належить побачити."
 BBA_ethiopia_communist_events.49.b:0 "У нас немає вибору, як погодитися."
 BBA_ethiopia_communist_events.56.b:0 "Можливо, ми можемо зробити більше, щоб підтримати боротьбу [ETH.GetNameDef]..."
 BBA_ethiopia_exile_events.01.a:0 "[FROM.GetName] — наша справа."
 BBA_ethiopia_exile_events.10.t:0 "[FROM.GetName] просить надати йому владу над усіма сомалійськими землями"
 BBA_ethiopia_exile_events.19.a:0 "І це тільки початок"
 BBA_ethiopia_exile_events.50.t:0 "Інцидент на кордоні"
 BBA_ethiopia_exile_events.52.t:0 "Закулісна дипломатія"
 BBA_ethiopia_exile_events.54.desc:0 "Наші нещодавні зусилля зі збору коштів виявилися дуже успішними. Імперська скарбниця побачила дуже здоровий приплив готівки від спонсорів з усього світу. Здається, багато хто поділяє наше обурення з приводу окупації [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.58.desc:0 "Гвинтівки, закуплені у [?ETH.host_nation.GetAdjective]их виробників, доставлені нашим військовим, що дислокуються у [?ETH.host_nation.GetName]. Наразі нова техніка проходить випробування на полігонах та навчаннях."
 BBA_ethiopia_fascist_events.10.a:0 "Добре."
 BBA_ethiopia_fascist_events.53.desc:0 "Хоча ми досягаємо значного прогресу в реформуванні нашої економіки та зміцненні нашої армії, ми все ще могли б отримати певну підтримку у виконанні цих завдань. Завдяки поглибленню наших відносин із [ITA.GetAdjective]ою державою, вони можуть бути готові передати нам частину свого надлишкового оснащення. Нам просто потрібно вирішити, що саме ми мусимо попросити."
 BBA_ethiopia_fascist_events.55.a:0 "Ми знали, що їм не можна довіряти."
 BBA_ethiopia_fascist_events.65.b:0 "Вони не в тому становищі, щоби щось вимагати."
 BBA_ethiopia_imperial_events.20.b:0 "Безпечніше буде зробити кронпринца конституційним монархом."
 BBA_ethiopia_imperial_events.20.t:0 "$ETH_ras_imru_haile_selassie$ влаштовує безкровний переворот"
 BBA_ethiopia_industrial_financial_events.4.desc:0 "[FROM.GetLeader] has seen the need to further our cooperation and coordinate foreign and financial policy even more than today. However, [FROM.GetLeader.GetSheHe] wants [FROM.GetNAme] to retain a degree of autonomy within the new federation."
 BBA_italo_ethiopian_war_events.13.a:0 "Це удар для них!"
 BBA_italo_ethiopian_war_events.14.d:0 "У нас тут власна війна, яку ми маємо вести."
 BBA_italo_ethiopian_war_events.14.desc:0 "Рада Ліги Націй обговорила прохання держави [ETH.GetName] про військове втручання у війну з Італією. Зрештою, Рада не пішла так далеко, щоби закликати до повномасштабної інтервенції, але виступила з заявою, в якій рекомендувала країнам-членам підтримати державу [ETH.GetName] будь-яким можливим способом, зокрема, дозволивши добровольцям взяти участь у конфлікті на боці держави [ETH.GetName]."
 BBA_italo_ethiopian_war_events.300.t:0 "Італійська громадськість стурбована"
 BBA_italo_ethiopian_war_events.402.a:0 "Добре, займімо ці землі."
 BBA_italo_ethiopian_war_events.403.desc:0 "На жаль, дипломатичного тиску було недостатньо, щоби забезпечити італійське панування над державою [FROM.GetNameDef]. [FROM.GetLeader] залишається непохитним у тому, що його країна може протистояти військовій могутності держави [ROOT.GetName]."
 BBA_italy_anti_colonialism_events.05.t:0 "[FROM.GetAdjective]і вимоги до [ROOT.GetAdjective]ої інтеграції"
 BBA_italy_anti_colonialism_events.07.t:0 "[FROM.GetName] відхилила нашу пропозицію"
 BBA_italy_anti_colonialism_events.52.t:0 "Північна Африка голосує за вступ до держави [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events_war_will_continue_tt:0 "Війна продовжиться."
 BBA_italy_bop.3.t:0 "Ми повернули [?ITA.ITA_reclaimed_core.GetName]"
 BBA_italy_civil_war.5.b:0 "Відмовити їм у проханні про свободу"
 BBA_italy_communist_events.07.desc:0 "Наші товариші від держави [FROM.GetName] погодилися об'єднати з нами зусилля і створити Велику Комісію Співпраці! Разом ми зможемо протистояти натиску капіталізму і фашизму, переломити хід подій і принести нашу славну революцію в усі куточки світу!"
 BBA_italy_communist_events.09.a:0 "Одужав завдяки оптимізму своєї волі."
 BBA_italy_decide_the_fate_of_mussolini.2.b:0 "Нехай гниє у в'язниці."
 BBA_italy_interaction_events.14.desc:0 "[ITA.GetLeader] вимагає гарантій безпеки між нашими країнами, що цілком справедливо. Більш обурливим є те, що [ITA.GetLeader] також вимагає від нас повної демілітаризації як регіон [342.GetName], так і регіон [339.GetName], що може поставити під загрозу нашу безпеку, оскільки це означатиме, що ми не зможемо створити початкові оборонні позиції на випадок, якщо нас атакує [ITA.GetName] або будь-який з її союзників."
 BBA_italy_interaction_events.22.a:0 "І союз у нас буде."
 BBA_italy_interaction_events.24.desc:0 "Мерзенна німецька держава намагається втрутитися в австрійську політику і поглинути країну. Ми раніше надали їм гарантії, і тому наше населення очікує, що ми виступимо проти німців за них. Ми також можемо звернутися по допомогу до британців і французів. Що ж нам робити?"
 BBA_italy_interaction_events.39.desc:0 "Ми нарешті зробили останній платіж за наші нові володіння в Африці. Ця угода розширила наші колоніальні території, об'єднавши та зміцнивши їх, а також зміцнивши наші позиції там. Загалом, це була дуже вигідна угода для всіх учасників."
 BBA_italy_interaction_events.71.desc:0 "До нас звернувся представник держави [ITA.GetNameDef], який запитав, чи готові ми відкласти наші розбіжності та сформувати новий уряд під наглядом Італії. Посол дав нам знати, що вони продовжать створювати нову адміністрацію на нашій батьківщині, з нашою участю або без неї. Якщо ми відмовимося від цієї пропозиції, то решта світу проігнорує нас на користь цієї нової адміністрації."
 BBA_italy_interaction_events_news.1.a:0 "Іншого виходу, на жаль, не було"
 BBA_italy_missiolinis.53.t:0 "Парк вантажівок постачання посилено"
 BBA_italy_naval_cooperation_programs.02.a:0 "Долучімо експертів до роботи!"
 BBA_italy_naval_cooperation_programs.03.t:0 "[FROM.GetNameDefCap] відхиляє $ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.10.t:0 "[FROM.GetNameDefCap] відмовляється від наших ескортних кораблів"
 BBA_italy_purge_the_party.1.t:0 "Чистка Націонал-фашистської партії"
 BBA_italy_second_italo_ethiopian_war.2.a:0 "Яка ганьба..."
 BBA_swiss_expansion.13.a:0 "Вітаємо нові кантони!"
 BBA_swiss_expansion.2.t:0 "Завдяки нашому впливу, [SWI_influenced_state] прагне приєднатися до нас"
 BBA_swiss_expansion.3.b:0 "Тоді хай буде референдум"
 BBA_switzerland.18.desc:0 "Жахливі новини з наших контактів у [FROM.GetCapitalVictoryPointName]. Схоже, що [FROM.GetAdjective] уряд відмовився від нашої пропозиції про таємний пакт, залишивши нас відкритими до вторгнення від сусідів. Ми повинні приготуватись до оборони або шукати інші шляхи збереження незалежності та демократії."
 BBA_switzerland.19.b:0 "Гарантії мають вистачити"
 BBA_switzerland.19.desc:0 "Історично [FROM.GetName] суворо дотримувався нейтралітету, але, схоже, у відповідь на сучасну ситуацію у світі вони вирішили порушити цю позицію — і схоже, що закликають інші нейтральні країни зробити те саме. Якщо вступ до їхньої фракції видається надто радикальним кроком, ми можемо натомість гарантувати незалежність одне одного."
 BBA_switzerland.22.a:0 "Ми врятовані... мабуть."
 BBA_switzerland.6.a:0 "Це справа для суду."
 BBA_switzerland.8.a:0 "Нехай суд винесе рішення."
 BBA_switzerland_fascist.1.a:0 "Нехай приєднуються до нашої родини"
 BBA_switzerland_fascist.7.desc:0 "На мітингу в [ROOT.GetCapitalVictoryPointName] [ROOT.GetLeader] оголосив про обіцянку [FROM.GetName] щодо тісної співпраці між нашими країнами й захисту [ROOT.GetName] від наших і їхніх ворогів. \n\nДружні офіцери та урядовці з [FROM.GetNameDef], наші союзники, вже прибувають до нашої країни, щоб допомогти нам розвинути наші збройні сили та підготувати їх до служіння новому союзникові."
 BBA_switzerland_trade.15.desc:0 "На жаль, нам повідомили, що [FROM.GetName] не буде інвестувати в економіку [ROOT.GetAdjective]. Ми опиняємось у більшій ізоляції, ніж хотілося б, з огляду на загрозу фашизму."
 BEG_neutrality_DEF:0 "Нація Бенішанґул-Ґумуз"
 BEL_AUS_autonomy_eu_member_ADJ:0 "Бельгійськ"
 BEL_GER_fascism_autonomy_reichskommissariat_DEF:0 "Райхскомісаріат Бельгія"
 BEL_adriaan_martens_crisis_desc:0 "Те, що здавалося простим призначенням Адріана Мартенса до Королівської академії медицини, переросло у повноцінну політичну кризу. Виявилося, що Мартенс був колабораціоністом під час останньої війни і має відверті фашистські погляди. Це може призвести до падіння уряду Спака."
 BEL_belgian_air_force:0 "[ROOT.GetAdjective] повітряні сили"
 BEL_benelux_union_desc:0 "Прем'єр-міністр Спак висунув пропозицію об'єднати країни Бенілюксу, [BEL.GetNameDef], [HOL.GetNameDef] та [LUX.GetNameDef] в єдиний митний союз, з кінцевою метою потенційної повної уніфікації в одну наддержаву. Це може стати навіть основою для майбутнього Європейського Союзу."
 BEL_complete_integration_of_from_decision:0 "Доягти інтеграції [FROM.GetName]"
 BEL_convoy_protection_duties:0 "Оборонне обладнання для торгових суден"
 BEL_european_community:0 "Європейська Спільнота"
 BEL_fortify_liege:0 "Укріплення Льєжа"
 BEL_greater_netherlands_ADJ:0 "Дітськ"
 BEL_greater_netherlands_DEF:0 "Дітсланд"
 BEL_guns_for_the_spaniards_decision:0 "Запропонувати піхотне спорядження для [FROM.GetNameDef]"
 BEL_investigate_bribery_charges:0 "Розслідування звинувачень у хабарництві"
 BEL_julien_lahaut:0 "Жюльєн Лао"
 BEL_liberal_party_long:0 "Ліберальна партія"
 BEL_medium_tank_equipment_1:0 "ACG-1"
 BEL_modify_gold_reserves_dynamic_modifier_tt:0 "Змінити §Y$BEL_gold_reserves_dynamic_modifier$§! на:"
 BEL_multi_language_courses_desc:0 "Однією з основних проблем, що стоїть перед нашою армією, є двомовність нашого населення. Давайте перетворимо це на перевагу! Ми можемо навчати наших офіцерів французькою та нідерландською мовами, що дозволить отримати переваги від двомовного корпусу офіцерів."
 BEL_neutrality_dynamic_modifier:0 "Вічна нейтральність"
 BEL_pressurized_cabin_development:0 "Розробка пресуризованих кабін"
 BEL_re_build_the_fleet_ns_desc:0 "Наш флот був розформований у 1927 році, однак глобальна ситуація вимагає від нас знову інвестувати в наш флот, щоб зберегти торгові зв'язки з Конґо і продовжити наші морські інтереси."
