 BUL_imro_04_desc:0 "Наша співпраця з Внутрішньою македонською революційною організацією зазнала широкої критики не тільки з боку наших сусідів, а й багатьох іноземних держав і навіть деяких верств нашого населення."
 BUL_integrate_the_ratniks:0 "Інтегрувати ратніків"
 BUL_join_the_tripartite_pact_desc_axis:0 "Ми повідомимо німців, що ми готові та готові підписати [GetGermanFactionName] і офіційно приєднатися до їх фракції як союзники."
