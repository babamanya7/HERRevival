 tactic_breakthrough:0 "Прорив"
 tactic_urban_defense:0 "Міська оборона"
 take_claimed_state_short_desc:0 "Завдяки цій цілі війни отримати зазначені землі на мирній конференції буде дешевше."
 tank_designer_flame:0 "Вогнемет (рота підтримки)"
 tank_designer_modern_tank_chassis:0 "Сучасний танк"
 tank_gun_upgrade_desc:0 "Важливо мати гармату, яка не відстає від ворожої бронетехніки та може пробивати її."
 tank_nsb_engine_upgrade:0 "$tank_engine_upgrade$"
 targeted_race_for_the_bomb_desc:0 "Ми не можемо дозволити іншим створити атомну бомбу раніше за нас. Потрібно зробити все, щоби нашій технологічній перевазі нічого не загрожувало."
 targeted_sabotage_destroy_mining_equipment_outcome:0 "Загін зміг пошкодити більшу частину гірничодобувного обладнання. Втрата може бути невелика, але і вона серйозно ускладнить видобуток ресурсів."
 tech_engineers3_desc:0 "Військові інженерні проєкти стають все більш масштабними. Створення сучасної інфраструктури дозволить проводити операції, для яких потрібні ресурси, недоступні на полі бою."
 tech_maintenance_company2_desc:0 "Регулярний техогляд зменшує ймовірність поломки техніки і заздалегідь виявляє деталі, які потрібно замінити."
 tech_mountaineers2_desc:0 "Наші війська можуть досягти переваги над супротивником у горах, а не просто вижити. Використовуючи легке спорядження та в'ючних тварин, вони долають цей рельєф швидше, ніж інші види піхоти."
 tfv_australia.12.a:0 "Залишається сподіватися, що вони зможуть протистояти."
 tfv_australia.34.d:0 "Незалежно від того, чи це невизнання нашої спільної історії, чи просто політичний опортунізм: держава [From.GetNameDef] відхилила нашу пропозицію транстихоокеанського партнерства.\n\nХоча їхня співпраця була б великим надбанням, ми мусимо рухатися вперед із нашим власним порядком денним до наших власних цілей."
 tfv_australia.81.a:0 "[Root.GetAdjective]а та [From.GetAdjective]а держави в Західній частині Тихого океану виграють від цього."
 tfv_australia.92.c:0 "$tfv_australia.90.c$"
 tfv_canada.10.b:0 "Наразі це надто великий ризик."
 tfv_raj.31.t:0 "[SOV.GetNameDefCap] підтримує незалежність Індії"
 tfv_raj.43.desc:0 "Субгас Чандра Бос намагався переконати [GER.GetAdjective]ий уряд допомогти нашій боротьбі, але його зусилля не увінчалися успіхом. Після кількох днів очікування на розмову з лідером [GER.GetLeader], він отримав шанс на зустріч, яка тривала заледве десять хвилин.\n\nХоча [GER.GetLeader] висловив велике захоплення нашою ситуацією та фанатичним духом опору, він також дав зрозуміти, що не вважає нашу країну вартою того, щоб витрачати на неї ресурси."
 tfv_south_africa.16.b:0 "$tfv_south_africa.15.b$"
 tfv_south_africa.62.b:0 "$tfv_south_africa.60.b$"
 tfv_south_africa.68.d:0 "Звільнившися з-під влади колоніальних гнобителів, [MLW.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [MLW.GetAdjective]ого уряду."
 tfv_south_africa.74.t:0 "Свобода для держави [ETH.GetName]"
 tfv_south_africa.79.d:0 "Звільнившися з-під влади колоніальних гнобителів, [RCG.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [RCG.GetAdjective]ого уряду."
