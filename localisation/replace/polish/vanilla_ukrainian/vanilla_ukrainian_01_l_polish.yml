 PRC_promote_regular_army_desc:0 "Лише традиційними засобами ми можемо гарантувати, що Червона армія здатна захищати та розширювати території [ROOT.GetNameDef]."
 PRC_promote_the_silver_dollar_desc:0 "Вилучення мідних монет з обігу на користь срібла дозволить нам переробити старий метал для виробництва боєприпасів. Внутрішня вартість наших монет також означатиме, що нашим торговим партнерам не доведеться турбуватися про зростання чи падіння вартості нашої валюти, оскільки вона прив'язана до вартості срібла."
 PRC_raid_weapon_depots_desc:0 "Наші зусилля з інфільтрації дозволили нам нанести на карту логістичні мережі наших ворогів. Ми можемо використати це для рейдів на ці мережі, використовуючи захоплене спорядження для озброєння ще більшої кількості агентів."
 PRC_remove_iniltration_and_guerilla_decisions_tt:0 "§RВидаляє§! рішення категорії §Y$PRC_infiltration_sea_cat$§! та §Y$PRC_guerilla_warfare_sea_cat$§!"
 PRC_request_guarantees_tt:0 "§R[SOV.GetNameDefCap] може попросити нас стати суб'єктом в обмін на гарантію...§!"
 PRC_rural_recruitment_desc:0 "Окупант ніколи не зможе контролювати всі сільські поселення, що дає нам можливість проводити там вербування з мінімальним ризиком."
 PRC_sea_aid_from_soviet_bolsheviks_desc:0 "Щоб наша революція досягла успіху, ми повинні мати промислову базу для її підтримки. За допомогою радянських інвесторів ми зможемо запустити власну промисловість."
