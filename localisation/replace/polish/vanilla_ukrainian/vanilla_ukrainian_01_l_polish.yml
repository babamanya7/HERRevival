 SWE_norma_projektilfabrik_tt:0 "Додає §G1§! додатковий §Yвійськовий завод§!, якщо виконано допоки §Y[NOR.GetNameDef]§!:\nВійна з великою країною\nМає більше 0% прогресу капітуляції\n§Y[SWE.GetNameDef]§!: Не має війни з §YНорвеґією§!"
