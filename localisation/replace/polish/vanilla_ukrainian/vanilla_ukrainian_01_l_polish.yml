 MEX_focus_control_the_army_desc:0 "Армія є чи не найважливішим виборчим округом у Мексиці. Останні двадцять років показали, що волю народу можна примусити лише багнетами. Отже, генерали-вигнанці є загрозою самому існуванню держави, не кажучи вже про її легітимність."
 MEX_focus_ejido_worker_militias:0 "Робітничі ополчення ехідо"
 MEX_focus_end_land_reform_desc:0 "Програмою земельної реформи вже давно зловживають місцеві авторитети з політичними зв'язками чи військовою владою. Багатий фермер, який краде державну землю заради власної вигоди, не допоможе Мексиці стати сильнішою чи об'єднанішою. Натомість цю землю слід продати тому, хто запропонує найвищу ціну. Можливо, деякі орендодавці дійсно зловживають своїми орендарями, але це справа суду."
 MEX_focus_legion_of_christ_desc:0 "We are righting the wrongs of the 'Revolution' with the indefatigable spirit befitting agents of Christ, but we have only just begun. We need an organization to seek out and punish the criminals who attacked the Holy Church. As it says in the Book of Exodus: take eye for eye, life for life."
 MEX_focus_liberalize_the_banking_sector:0 "Лібералізувати банківський сектор"
 MEX_focus_oppose_yanqui_imperialism_desc:0 "Правильно повернувши собі природні ресурси нашої країни, іноземці тепер вимагають компенсації, але концесії були фактично вкрадені у мексиканського народу під час його слабкості за диктатора Діаса. Чому ми повинні платити злодієві за повернення вкраденого?"
 MEX_focus_realpolitik_desc:0 "У нас є свої ідеологічні переконання, але Мексика як держава має власні інтереси, відокремлені від міжнародної боротьби. Нам потрібно обережно пройти шлях у бурхливі часи, які попереду. Один невірний крок може обрушити всю вагу ймовірних імперіалістів і тиранів на наші голови."
