 BRA_no_fascism_in_south_america_desc:0 "Оскільки ми відкрито виступаємо проти фашизму, настав час діяти в умовах нинішньої небезпеки і захистити наш континент від цієї мерзенної ідеології. Ні, [BRA.GetNameDef] — не ваша колонія!"
 BRA_promote_agriculture_tt:0 "§YВідмикає радника:§!"
