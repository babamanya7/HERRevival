 GER_prioritize_the_navy:0 "Надати перевагу флоту"
 GER_puppet_development_flag:0 "[FROM.GetAdjective]ий розвиток вже підтримується державою [ROOT.GetNameDef]"
 GER_rebuild_the_nation3:0 "$GER_rebuild_the_nation2$"
