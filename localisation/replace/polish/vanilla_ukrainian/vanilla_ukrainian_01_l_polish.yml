 PRC_long_march_to_recovery_desc:0 "Великий похід до [622.GetName] призвів до величезних втрат у нашій армії. Настав час реорганізувати наші війська, що залишилися, і взяти курс на відновлення слави Робітничо-селянської Червоної армії."
 PRC_lots_of_army_recovery:0 "Незважаючи на труднощі, яких ми зазнали, [ROOT.GetAdjective]а Червона армія відновила свою силу майже до попереднього рівня і готова знову боротися за народ."
