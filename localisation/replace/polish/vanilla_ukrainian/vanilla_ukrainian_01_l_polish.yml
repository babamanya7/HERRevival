 JAP_issue_the_senjinkun_military_code_desc:0 "Кишеньковий військовий кодекс «Настанови для поля бою» має бути виданий кожному [ROOT.GetAdjective]ому солдату, щоб підготувати їх до років майбутніх конфліктів. Їх потрібно навчити військових статутів, бойової готовності, відданості братерству, синівської шанобливості, а також шанування шінтоїстських камі та кокутай. «Ніколи не живи, щоб зазнати ганьби полону, честь понад капітуляцію!»"
