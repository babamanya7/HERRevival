 GER_reichskommissariat_ostasien_effect_tt:0 "Усі необхідні області, окрім §Y[743.GetName]§!, перейдуть під контроль [ROA.GetNameDef]"
 GER_rekindle_imperial_sentiment_tt_2:0 "Коли підтримка нейтралів буде досить висока, ці держави зможуть відродити Австро-угорську імперію та вступити до Міттельєвропи крізь рішення.\n"
 GER_rekindle_imperial_sentiment_ww:0 "$GER_rekindle_imperial_sentiment$"
 GER_request_the_return_of_qingdao_desc:0 "Ціндао був одним із договорних портів, які ми отримали під час приниження Китаю. Тепер у нас може з'явитися можливість попросити [CHI.GetNameDef] повернути це місто — звісно, з відповідною компенсацією."
 GER_restore_eastern_imperial_possessions_desc:0 "Землі, що є невід’ємною частиною нашої імперії, зараз утримуються іноземними державами. Щоб реалізувати кордони Брест-Литовського договору, ми повинні спершу звернути увагу на Познань, Західне Помор’я та Сілезію."
 GER_revitalize_the_nation_desc:0 "Після руйнувань громадянської війни ми повинні відновити країну. Народ має згуртуватися для досягнення цієї мети."
 GER_revolutionary_nationalist:0 "Революційний націоналіст"
 GER_scout_plane_equipment_1:0 "Henschel Hs 126"
 GER_slovakia_rkh_effect_tt:0 "Кожна область у словацькій зоні інтересів перейде під контроль [RKH.GetNameDef]"
 GER_south_east_asian_natural_wealth_tt:0 "Відімкне §Yсукупність рішень на мапі§! з поліпшення територій у Південно-Східній Азії."
 GER_soviet_securing_sphere:0 "Захист своєї сфери впливу"
 GER_soviet_smoothes_relationships:0 "Відносини поліпшені"
 GER_strive_for_conservative_values_desc:0 "Ліберальні ідеї занадто довго розбещували наш народ і послаблювали націю. Ми маємо повернутися до добрих старих традицій, щоби хаос Ваймарської Республіки ніколи не повторився."
 GER_submarine_1_desc:0 "Прибережні підводні човни типу «UB III» — це клас човнів U-Boot, побудованих під час Першої світової війни Німецьким імперським флотом. Вони несли десять торпедних апаратів і мали водотоннажність понад 500 тонн. Між 1916 і 1918 роками було побудовано 96 човнів, хоча всі вони були виведені з експлуатації до 1935 року."
 GER_super_heavy_tank_artillery_equipment_1_desc:0 "210-мм артилерійська гармата, встановлена на шасі надважкого танка, ця САУ конкурує за потужністю з деякими залізничними гарматами."
