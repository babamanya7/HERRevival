 SWE_BLITZKRIEG_DESC:0 "Гуркіт чергової великої війни гучнішає день у день, коли Німеччина розмиває кордони своїх сусідів. Оскільки мілітаристська держава залежить від шведської залізної руди, зростають побоювання, що її територіальні амбіції незабаром можуть поширитися за межі Балтики та Скандинавії.\n\nВ очікуванні такої загрози шведські військові почали переозброюватися і модернізуватися завдяки процвітаючій оборонній промисловості країни. Залишається лише з'ясувати, чи здатна країна стримати вторгнення."
 SWE_GER_seized_swedish_assets:0 "Захопили наші активи"
 SWE_VICTORY_POINTS_6287:0 "Шьопенгамн"
 SWE_VICTORY_POINTS_66:0 "Карлебю"
 SWE_aquire_modern_panzers_desc:0 "Доведено, що технологічний застій спричиняє крах, здавалося б, наймогутніших держав під час війни. Тому придбання сучасних бронетехніки для армії є пріоритетом, якщо ми самі хочемо уникнути такої долі."
 SWE_bornholm_crisis_desc:0 "Острови Борнгольм були втрачені для нас, коли вони повстали кілька століть тому, незважаючи на те, що вони ніколи юридично не були передані [Den.GetName]. Стратегічно важливі, оскільки вони контролюють Нижню частину Балтійського моря, зрозуміло, що [Den.GetName] не можуть захистити їх. Ми можемо і повинні відновити контроль над нею заради нашої безпеки."
 SWE_cement_control_of_the_baltic:0 "Контроль цементу в Балтійському морі"
 SWE_christian_gunter:0 "Крістіан Ґюнтер"
 SWE_crisis_affecting_variables:0 "Вони ймовірніше схвалять, якщо:\n - Вони §Yвисокої думки про нас§!\n - Ми маємо сильнішу §Yармію§! за їхню\n - Вони мають менш ніж §Y40% підтримки війни§!\n - Вони не є членом альянсу"
 SWE_dp_ship_secondaries_1:0 "12cm/45 Bofors M24 DP"
 SWE_extend_the_time_of_preparedness_desc:0 "Хоча дехто хотів би, щоб усе негайно повернулося до норми в [ROOT.GetName], на горизонті з'явилися нові загрози. Щоб зберегти нашу здатність захищати націю, нам потрібно продовжувати наш поточний стан готовності та відданості повна оборона."
 SWE_gateway_to_peace_decision_tt:0 "\nУзяття контролю над §YЛенінградом§! змусить державу [SOV.GetName] підписати білий мир із державою [FIN.GetName] або зіткнутися з серйозними наслідками."
