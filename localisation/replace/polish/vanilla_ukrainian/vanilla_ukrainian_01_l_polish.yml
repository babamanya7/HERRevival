 TOA_ven_blockade.1.desc:0 "[FROM.GetName] розмістила військові кораблі біля нашого узбережжя, намагаючись блокувати відвантаження нафти, що прямує до їхніх супротивників. [FROM.GetAdjective] уряд заявляє, що вони не прагнуть прямого конфлікту, а скоріше це є заходом для тиску на свого ворога. Це, безумовно, ескалація, і хоча ще ніхто не постраждав, присутність військових кораблів у цьому районі посилила напругу в Каракасі."
