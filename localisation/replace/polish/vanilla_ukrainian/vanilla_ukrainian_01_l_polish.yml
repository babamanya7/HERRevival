 FIN_politics_kallio_winter_war:0 "[ROOT.GetLeader] не з чуток знає про війну і з занепокоєнням дивиться на зростаючу в світі напруженість. [ROOT.GetLeader.GetHerHis] застереження були сприйняті народом серйозно, і саме президенту вдалося провести нашу націю через найтемніші часи Зимової війни."
