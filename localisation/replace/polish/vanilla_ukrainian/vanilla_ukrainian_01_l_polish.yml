 YEM_burkan_salem:0 "Burkan Salem"
 YUG_army_modernization_desc:0 "Спосіб ведення війни змінився після останнього конфлікту, і ми повинні забезпечити, щоби наша армія йшла в ногу з часом, модернізуючи свою техніку та тактику."
 YUG_attract_foreign_capital:0 "Залучення інозменого капіталу"
 YUG_domestic_artillery_production:0 "Вітчизняне виробництво артилерії"
 YUG_exploit_the_pannonian_deposits_desc:0 "Ми повинні розробляти поклади нафти, які знаходяться на нашій території. Хоча кількість мізерна, нам потрібно все, що ми можемо отримати для нашої бойової машини."
 YUG_form_parachute_battalions_desc:0 "Використовуючи третій вимір, ми можемо вражати локації з несподіваних напрямків, далеко за лінією ворога. Створення спеціалізованих повітряно-десантних батальйонів забезпечить нам максимальне використання наших повітряних сил."
 YUG_form_peasant_councils_desc:0 "Працююча людина має отримати більшу присутність у місцевій політиці. Створення селянських рад значною мірою сприятиме тому, щоб їхні голоси були почуті."
 YUG_heavy_cruiser_project_desc:0 "Щоб адекватно кинути виклик ворожим флотам, нам потрібні більший тоннаж і важче озброєння. Важкі крейсери були б хорошим кроком вперед у порівнянні з легкими крейсерами, які ми досі використовували як опору нашого флоту."
 YUG_idea_macedonian_opposition_1_desc:0 "Надавши македонцям певні політичні права і переставши намагатися прищепити їм сербську ідентичність, поки що напруженість у Македонії дещо полегшилася."
 YUG_idea_slovene_nationalism_2_desc:0 "Автономний уряд Словенії більш зацікавлений у співпраці по відбудові нашої армії, але зроблені їм поступки означають, що в нас є менше контролю над тим, як працюють їхні заводи."
 YUG_join_allies:0 "Королівський альянс"
 YUG_mio_trait_ikarus_funding:0 "Фінансування $YUG_ikarus$"
 YUG_purchase_foreign_desc:0 "Є інші країни, які витратили набагато більше ресурсів на розробку хороших винищувачів, ніж ми. Ми повинні придбати їхні літаки, а не проходити через копіткий процес проб і помилок, щоби розробити наші власні."
