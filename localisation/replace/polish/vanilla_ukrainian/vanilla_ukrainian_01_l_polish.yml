 CHI_a_burgeoning_welfare_state_desc:0 "Держава, яка піклується про своїх людей, володіє неперевершеною силою та стійкістю. Черпаючи натхнення у німців до того, як вони впали у фанатизм, ми почнемо шлях до більш справедливого майбутнього."
 CHI_a_world_freed_from_communism_desc:0 "Фашизм підпалив світ, але це не єдина ідеологія, що загрожує людству. Ми повинні завершити місію, яку розпочали в нашій країні, і позбавити цей світ від злих думок!"
 CHI_affirm_civilian_primacy_desc:0 "Чан будував свою владу на спині армії, але ми знаємо, що думки офіцерів легко змінити, і мало хто з них приносить нам користь. Ми повинні переконатися, що збройні сили розуміють, що вони підпорядковані цивільному контролю."
 CHI_an_alternative_rooted_in_tradition_desc:0 "Лібералізм і комунізм — це іноземні концепції, які не мають жодного значення в [ROOT.GetAdjective]ій державі. Лише щось, створене нами самими, може принести процвітання і гордість на наші береги."
 CHI_an_appropriate_design_2_tt:0 "Якщо прийнято §Y$CHI_controlling_our_skies$§!:\n "
 CHI_bring_the_revolution_further_tt:0 "Ми отримаємо мету війни проти кожного, хто контролює колоніальні регіони або має маріонеток у §Y$Australia$: §!"
 CHI_bring_the_war_home_desc:0 "Наші вороги повинні дізнатися, що жодна частина їхньої території не є недосяжною. Завдяки цілеспрямованим бомбардуванням і психологічній війні ми завдамо глибоких ударів і зруйнуємо волю ворога до боротьби."
 CHI_chen_guofu:0 "Чень Ґофу"
 CHI_chinese_panzers_TT:0 "Виконано фокус §Y$CHI_chinese_panzers$§!"
 CHI_chinese_panzers_desc:0 "Німецькі танки, поза всякими сумнівами, не мають собі рівних у світі. Потрібно наслідувати приклад Німеччини і розробляти власні танки на основі тих самих принципів."
 CHI_co_opt_the_koh_hsin_movement:0 "Кооптувати рух Гесінь"
 CHI_communist_infiltration_in_suiyuan:0 "Комуністичне проникнення в Суйюані"
