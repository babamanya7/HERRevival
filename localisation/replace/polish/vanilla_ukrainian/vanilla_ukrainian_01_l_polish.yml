 TUR_the_clodius_agreement:0 "Угода Клодіуса"
 TUR_the_constitutional_arrows_category_desc:0 "[ROOT.GetNameDef] і Шість напрямних принципів — основа нашої конституції; доки ми шануємо ці принципи, ми маємо вірити, що нашу націю не розвалять зсередини."
 TUR_the_damascus_diktat_desc:0 "[677.Controller.GetNameDefCap] — слабка країна. Нам треба лише пригрозити їм війною, якщо ті не залишать Сирію, і вони впадуть навколішки та благатимуть нас зберегти мир і взяти Сирію собі."
 TUR_three_year_industrial_plan_desc:0 "Ми готові провести в масштабі всього півострова кампанію з індустріалізації, яка збентежить навіть державу [ENG.GetNameDef]. Ми будемо підтримувати один одного як рівні, і зусиллями всієї Балканської Антанти ми разом станемо могутнішими за ворогів!"
