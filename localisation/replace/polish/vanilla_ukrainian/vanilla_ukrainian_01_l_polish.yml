 TUR_BLITZKRIEG_DESC:0 "Батько Турків, Мустафа Кемаль Ататюрк, помер. Туреччина є нацією в журбі, яку зараз очолює шановний державний діяч Ісмет Іньоню. Він успадкував роздрібнену країну, чиї внутрішні розколи стали ще більш очевидними через смерть її провідного світла.\n\nІ незважаючи на внутрішні проблеми, Іньоню також стикається з перспективою війни в Європі, яка загрожує перевершити навіть Велику війну з точки зору спустошення. Ататюрк часто рекламував мантру «Мир удома, мир у світі». Чи може Іньоню сподіватися зберегти мир у ці неспокійні часи?"
 TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_STANDARD:0 "Varlık Vergisi"
 TUR_abuse_the_office_of_soil_products_desc:0 "Toprak Mahsulleri Ofisi створювалася заради контролю за виробництвом продуктів харчування та доходами працівників сільського господарства, але [ROOT.GetNameDef] не потребує фермерів — країні потрібна земля. Ми змусимо власників збиткових ферм продати нам свої землі та спорудимо на їхньому місці нові промислові підприємства. Це принесе користь всій державі."
 TUR_brace_against_the_red_menace_communism_desc:0 "На північ знаходиться віроломне лігво комунізму та головне його джерело. [SOV.GetNameDef] — чума нашого світу, і Балканська Антанта надасть послугу людству, покінчивши з [SOV.GetAdjective] гегемонією."
 TUR_court_the_spanish_desc:0 "Не секрет, що іспанський лідер симпатизує нашій фракції та її ідеалам. Проста пропозиція дружби, пара туманних натяків на можливу вигоду в майбутньому — і вони набагато охочіше схиляться на наш бік."
 TUR_disorganised_armed_forces_16_desc:0 "$TUR_disorganised_armed_forces_desc$"
 TUR_disorganised_armed_forces_8:0 "$TUR_disorganised_armed_forces$"
 TUR_finance_the_bursa_merinos_factory:0 "Фінансувати шерстепрядильну фабрику у Бурсі"
 TUR_foreign_capital_tt:0 "Чим вищий рівень наших відносин із §YВеликими державами Європи§! та §YСША§!, тим більше у нас буде варіантів §Yінвестицій§!."
 TUR_fundamentalism_desc:0 "О славний Боже, єдине бажання мого враженого болем серця — щоб жодна язичницька рука ніколи не торкнулася лона моїх священних храмів."
 TUR_heavy_tank_equipment_2_short:0 "Gergedan"
 TUR_heavy_tank_equipment_3:0 "TÜLOMSAŞ Suaygırı I"
 TUR_infantry_equipment_2:0 "Sten Mk II"
 TUR_kemalist_army_officers_limited_power_neutral_desc:0 "Турецький офіцерський корпус — один із найпалкіших захисників кемалістських цінностей. Не всюди кемалізм зустрічає розуміння, але офіцерський корпус належно захищає його принципи."
 TUR_kemalist_turn_hostile_effect_tt:0 "£faction_tur_kemalist §YКемалісти§! стануть §Rворожими§! уряду."
 TUR_loosen_the_laws_on_secularism_desc:0 "Релігія — головний розділяючий фактор нашої нації. Ми пішли шляхом секуляризму, але навіщо? Наслідуючи слабкі нації заходу? Чи не державі вирішувати, коли, де і як людина молиться своєму богу."
 TUR_mehmet_salih_omurtak:0 "$TUR_salih_omurtak$"
 TUR_modernise_the_general_directorate_of_military_factories:0 "Модернізувати Головне управління військових заводів"
 TUR_modernize_our_tactics:0 "Модернізувати наші тактики"
 TUR_populism_desc:0 "Хто б не пожертвував своїм життям за цю райську країну? Мученики з'являться, якщо просто вичавити ґрунт! Мученики!"
 TUR_privatize_the_anadolu_agency_desc:0 "Свобода преси — невід'ємна частина істинної демократії. Навіть якщо нам не до душі вільна преса, нам доведеться навчитися з нею робити. Ми можемо зробити великий крок у цьому напрямку, приватизувавши державне агентство Анадолу, яке віщає новини по всій Туреччині з моменту заснування його Ататюрком у 1920 року."
 TUR_raise_opinion_of_america_tt:0 "Чим вища думка про нас у Сполучених Штатів Америки, тим більше ймовірність прийняття концесії."
 TUR_ratify_the_six_arrows:0 "Ратифікувати «Шість стріл»"
 TUR_rauf_orbay:0 "Рауф Орбай"
 TUR_readdress_the_montreux_convention:0 "Переоглянути конвенцію Монтрьо"
 TUR_rearmament_scheme_desc:0 "Уже досить давно готується всеосяжна схема переозброєння, але до недавнього часу застосовувати її не було необхідним. Зараз світ опинився на межі чергової війни, і Туреччина повинна бути готова."
 TUR_refugees_from_the_fascist_menace:0 "Біженці від фашистської загрози"
 TUR_second_five_year_plan_cakmak_desc:0 "Беручи за основу німецьку модель ремілітаризації, Февзі Чакмак взяв курс на збільшення об'єму важкої промисловості в державі [ROOT.GetNameDef] і на повсюдню модернізацію інфраструктури."
 TUR_submarine_2:0 "Клас «Saldiray»"
 TUR_sultan_kaiser_forschungsinstitut_desc:0 "Ми визнаємо, що багато наших інститутів і технологій... трохи застаріли. Ми ж тим часом живемо в епоху сучасної війни. Добре, що на нашому боці така промислово розвинена та сучасна держава, як [GER.GetNameDef]. Заснувавши школу технологічного та наукового співробітництва між двома нашими націями, ми скоротимо своє відставання в інноваціях та технології."
