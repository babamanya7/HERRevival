 ROM_strat_bomber_equipment_3:0 "IAR 979"
 ROOT_invest_in_turkish_state_building_desc:0 "Важлива [FROM.GetAdjective]а інфраструктура залишається недорозвиненою в багатьох регіонах країни. Нам під силу це виправити."
 ROOT_invest_in_turkish_state_heavy_industry:0 "Інвестувати в [FROM.GetAdjective]у важку промисловість"
 RULE_ALLOW_GUARANTEES_FREE_DESC:0 "Незалежність будь-якої іншої держави можна гарантувати будь-коли, незалежно від рівня світової напруженості."
 RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_DESC:0 "Держави можуть постачати озброєння за ленд-лізом лише державам з однаковою керівною ідеологією."
 RULE_ALLOW_LICENSING_BLOCKED_DESC:0 "Держави можуть отримувати ліцензії лише крізь спеціальні рішення та події."
 RULE_ALLOW_RELEASE_NATIONS_ITALY_PAP_TOOLTIP:0 "§Y[ROOT.GetName]§! не може дати незалежність державі §Y[PAP.GetName]§! після завершення фокусу §Y$ITA_seek_papal_support$§!."
 RULE_ALLOW_WARGOALS:0 "Цілі війни"
 RULE_ALLOW_WARGOALS_FREE_50_DESC:0 "Виправдання цілей війни вимкнене при менш ніж 50% світової напруженості, але доступне для всіх держав при більшому рівні. Обмеження за ідеологіями не враховуються, але отримання цілей за національними фокусами досі доступне."
 RULE_COMMUNIST_ROM_AI_DESC:0 "§HРумунський§! ШІ намагатиметься укласти союз із великою комуністичною державою, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_DEMOCRATIC_GER_AI_DESC:0 "Німецький ШІ намагатиметься створити конституційну монархію, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_HISTORICAL_NOR_AI_DESC:0 "Норвеґія намагатиметься зберегти демократію й опиратися німецькій окупації, а потім продовжить боротьбу, як уряд у вигнанні, разом із Союзниками."
 RULE_OPTION_AUS_COMMUNIST_AI_DESC:0 "ШІ спробує стати комуністичною і повалити уряд. Дотримуючись суворої австромарксистської програми, ті створять власний альянс."
 RULE_OPTION_COMMUNIST_AFG_AI_DESC:0 "Афганський ШІ буде налагоджувати дружні стосунки з Радянським Союзом і впроваджувати радикальні реформи, щоб перетворити країну на комуністичну державу. Потім вона приєднається до Комінтерну і спробує взяти під контроль Центральну Азію."
 RULE_OPTION_COMMUNIST_RAJ_AI_DESC:0 "§HІндійський§! ШІ намагатиметься отримати свою незалежність крізь союз із Радянським Союзом, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEMOCRATIC_ALTERNATE_CZE_AI_DESC:0 "§HЧехословацький§! ШІ намагатиметься утворити свій власний альянс для самооборони, зберігаючи демократію та рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC:0 "ШІ боротиметься з переворотом Рафаеля Франко та влаштує громадянську війну, щоби спробувати зберегти неушкодженим свій демократичний уряд."
 RULE_OPTION_ETH_STALINIST_desc:0 "ШІ намагатиметься перетворити Ефіопію на комуністичну та заручитися підтримкою Радянського Союзу, перетворивши його на сталіністську маріонетку."
 RULE_OPTION_FASCIST_PHI_AI:0 "$RULE_OPTION_FASCIST$"
 RULE_OPTION_GOE_INDIA_FASCISM_BOSE_RAJ_AI_DESC:0 "Індія піде шляхом опору і обере Чандру Боса своїм лідером, зайнявши більш войовничу позицію щодо незалежності."
 RULE_OPTION_JAP_DEMOCRATIC:0 "Чиста демократія"
 RULE_OPTION_MONARCHIST_BONAPARTIST:0 "Монархізм: Династія Бонапартів"
 RULE_OPTION_MONARCHIST_LEGITIMIST:0 "Монархізм: Династія Бурбонів"
 RULE_OPTION_MONARCHIST_SIA_AI:0 "Монархістський шлях"
 RULE_OPTION_OBEDIENCE_CHINA_MAN_AI_DESC:0 "Маньчжурський ШІ намагатиметься залишатися якомога лояльнішим і слідувати відповідній гілці дерева національних фокусів, щоби зрештою перетворитися на Китайську імперію."
 RULE_OPTION_QUEBEC:0 "Вільний Квебек"
 RULE_RESEARCH_AOT_THREE_YEARS_DESC:0 "Держави можуть досліджувати лише технології з випередженням на три роки."
