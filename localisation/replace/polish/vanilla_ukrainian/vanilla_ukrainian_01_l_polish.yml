 improved_rubber_processing_desc:0 "Широкомасштабне виробництво синтетичної гуми стало можливим завдяки новому способу прискорення реакцій дегідрування."
 improved_worker_conditions_desc:0 "Робота на заводах складна й ризикована. Поліпшення умов для працівників тимчасово знизить темпи виробництва, але це варто вигоди в довгостроковій перспективі."
