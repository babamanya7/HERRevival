 BUL_BLITZKRIEG_DESC:0 "За останні кілька років цар Боріс зміцнив свою владу, розпустивши змовницьку організацію «Звено» та переорієнтувавши міжнародну політику Болгарії на Німеччину. Нещодавні переговори з балканськими сусідами привели до того, що Велика Британія скасувала військові обмеження, накладені на країну після Великої війни, в надії перешкодити Болгарії приєднатися до держав Осі.\nТепер цар прагне повернути втрачені в минулому території, не втягуючи країну в новий конфлікт, але в умовах зростання міжнародної напруженості в Європі залишається побачити, що чекає Болгарію в майбутньому..."
