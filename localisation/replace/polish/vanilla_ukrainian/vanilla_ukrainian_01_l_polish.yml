 land_mastery_gain_factor_tt:0 " Множник приросту майстерності сухопутної доктрини: $RIGHT|+=%1$"
 landmark_national_diet_desc:0 "«Коккай-ґіджідо» — це місце, де збираються обидві палати Парламенту Японії. Будівництво було завершено на початку 1936 року, і він зведений майже повністю з японських матеріалів, за невеликими винятками. Її попередник був зруйнований у 1925 році, коли цей район знову охопила пожежа. Хоча будівля парламенту руйнувалася вже багато разів, цього разу вона, безсумнівно, простоїть століттями!"
 landmark_prague_castle:0 "Празький град"
 lar_appeal_to_overseas_territories.12.t:0 "Північна Африка залишається з Віші"
 lar_capture_tito.2.desc:0 "Наша операція з усунення Тіто, лідера партизанів, увінчалася повним успіхом. Хоча вороги і очікували нападу, поєднання атак штурмової авіації і прямого штурму штабу Тіто десантними військами застало супротивника зненацька. знаходився штаб, і всередині неї, після чого труп Тіто виявили серед убитих."
 lar_compensate_italy.2.desc:0 "[This.GetLeader] тріумфально повертається з Італії, переконавшись, що [From.GetLeader] погоджується підписати запропонований договір. Тепер залишається лише формально передати наші володіння у Східній Африці Італії."
 lar_concessions_to_italy.3.t:0 "[From.GetLeader] відмовляється"
 lar_concessions_to_italy.4.t:0 "Британія та Франція пропонують колоніальну угоду"
 lar_concessions_to_italy.5.a:0 "Звучить цілком розумно."
 lar_fra_coup_pre_position_units_desc:0 "Наш агент візьме на себе командування армійськими загонами, що симпатизують нам, і призначить їм цілі, які повинні бути взяті з початком операції."
 lar_local_recruitment:0 "Місцеве вербування агентів"
 lar_news.1.desc_falangist:0 "Після довгої та жорстокої громадянської війни націоналісти під командуванням Еміліо Моли нарешті перемогли ворогів — карлистів і республіканців — і захопили повний контроль над Іспанією. В ізольованих вогнищах республіканського опору досі йтиметься націоналістичному контролю в раніше республіканських районах, але малоймовірно, що вона переросте в масштабний скоординований опір. привести іспанські імперіалістичні амбіції у поточній світовій кризі."
 lar_news.11.a:0 "Прекрасно, нехай роздирають одне одного на шмаття!"
 lar_news.24.t:0 "Іберійські нації вступають до альянсу [GER.GetFactionName]"
 lar_news.28.b:0 "Схоже, конфлікт ще не вирішено."
 lar_news.291.b:0 "Aloha!"
 lar_news.6.b:0 "Ми наступні?"
 lar_news.7.d:0 "Настав час заново провести кордони Європи."
 lar_operative_event.2.a:0 "Нам залишається лише чекати і сподіватися."
 lar_operative_event.6.a:0 "У нас є способи вас розговорити."
 lar_portugal_promote_monarchist_cause.3.a:0 "Бразильський трон буде відновлено!"
 lar_portugal_purchase_ships.3.desc:0 "[From.GetNameDefCap] відхиляє нашу пропозицію про купівлю [From.GetAdjective]их кораблів для нашого флоту.\nНам доведеться шукати інші країни, які приймуть цю пропозицію, або наголосити на розвитку власних верфей, щоби не довелося покладатися на іноземну допомогу у справі створення потужного [Root.GetAdjective]ого флоту."
 lar_portugal_purchase_ships.6.a_tt:0 "Один легкий крейсер доданий до резервного флоту"
 lar_spain.10.a:0 "Нашу революцію так легко не зупинити!"
 lar_spain.20.a:0 "Ми поведемо їх до слави."
 lar_spain.23.t:0 "[From.GetNameDefCap] надсилає допомогу"
 lar_spain.25.a:0 "Такий пакт зробить наш союз незмірно сильнішим."
 lar_spain.28.t:0 "Іберійський пакт набув чинності"
 lar_spain.33.b:0 "Залучити союзників з держави [union_militar_target_state_2.GetName] до Військового союзу."
 lar_spain.35.t:0 "Відродження монархії"
 lar_spain.36.b:0 "Задовольнимось поки що їх обіцянками."
 lar_spain.50.desc:0 "Тепер, коли [From.GetAdjective] битви у нашій анархістській боротьбі завершилися так, як треба, [From.GetAdjective] осередки хочуть, щоби ми прийняли їх до Ради з оборони."
 lar_spain.51.desc:0 "Золотому запасу нашої нації загрожує поступ націоналістів. Треба простежити, щоб він був безпечно переміщений за кордон і не дістався ворогам."
 lar_spain.9.a:0 "Настав час знову затвердити владу уряду над цими районами."
 lar_spheres_of_influence.1.desc:0 "[From.GetLeader] прибув до Берліна, де він і [This.GetLeader] провели зустріч, яка дозволила б зняти давню напругу у відносинах між нашими народами. Серед обговорюваних питань є і реструктуризація Центральної Європи. From.GetLeader] дав зрозуміти, що [BEL.GetNameDef] з її франкомовним населенням — головний інтерес його нації.\n\nПри цьому його уряд набагато гнучкіший у тому, що стосується долі держав [HOL.GetNameDef] і [LUX.GetNameDef]. Воно пропонує меморандум про взаєморозуміння, в якому буде обговорено, що останні дві країни повинні вважатися такими, що перебувають у нашій сфері впливу, а перша — у сфері впливу Франції."
 lc_bunker_emplacement_desc:0 "Внутрішня укріплена конструкція, що перетворює сухопутний крейсер на мобільний бункер. Вона дозволяє екіпажу утримувати оборонні позиції і вести вогонь у відповідь по ворогу, навіть під сильним обстрілом."
 lc_internal_ammunition_compartments_desc:0 "Посилені відсіки для зберігання додаткових боєприпасів, що дозволяють сухопутному крейсеру вести тривалі бої без поповнення запасів."
