 nsb_news.400.desc:0 "Після майже трьох десятиліть більшовицького правління сьогодні в державу [SOV.GetName] повернулася царська влада. В Успенському соборі Москви пройшла велика церемонія коронації царя Володимира III. Коли царська процесія пройшла повз глядачів, новий царь, вихваляючи дух російського народу та обіцяючи «повернути країні її колишню славу»."
 nuke_dropped.12.t:0 "Атомне бомбардування Копенгаґена"
 nuke_dropped.6.d:0 "The city of Kyoto, a prominent [From.From.Owner.GetAdjective] industrial center, was struck today by a nuclear bomb launched by [?global.nukecountry.GetNameDef]. It is speculated that the city was chosen as a target because it has been regarded as an intellectual center.\n\nThe beauty and historical significance of the Kyoto led many to assume it would be spared from the bomb, but it appears the terror of raining destruction on such a place has rather been seen as a benefit, increasing the psychological impact of the attack. The city's location in the valley somewhat limited the blast, but the old Imperial Palace and many industrial buildings have been completely destroyed."
 nuke_dropped.7.t:0 "Атомне бомбардування Токіо"
 o_felix:0 "Операція «Фелікс»"
 open_up_political_discourse_democratic:0 "$open_up_political_discourse_fascism$"
 operation_collaboration_government_desc:0 "§LДружній нам уряд біля керма держави [From.GetNameDef] дозволить сконцентруватися на інших наших ворогах і розвантажити війська для виконання інших цілей.§!"
 operation_huansheng_limited_success_tt:0 "Під час зухвалого бомбардувального нальоту вдалося розкидати листівки над більшістю визначених міст. Проте здебільшого вони розлетілися у важкодоступних місцях і були швидко прибрані силами противника."
 operation_infiltrate_armed_forces_navy_desc:0 "Впровадитися в спаяні колективи моряків на [From.GetAdjective]их кораблях буде важко, а ось берегові служби — інша справа. Влаштувавши туди свою людину, ми зможемо вивідати цінну інформацію, а також отримаємо можливість підтримувати потім більш складно.§!"
 operation_jericho_failure_tt:0 "Наліт був повною катастрофою. Жодному в'язневі не вдалося втекти. Контроль ворога над регіоном посилюється."
 operation_steal_tech_army_desc:0 "§LНаші аналітики розвідки вважають, що держава [From.GetNameDef] досягла значних успіхів у галузі наземної війни та військово-інженерної справи. Більш ретельне розслідування разом з безпосередніми методами видобутку інформації могли б дати нам цінні відомості.§!"
 operational_concentration_desc:0 "Запорукою успіху будь-якої бойової операції є забезпечення локальної переваги. Замість того, щоби домагатися переваги по всій лінії фронту, Ви послаблюєте деякі її ділянки, щоби зосередити війська там, де вони потрібні."
