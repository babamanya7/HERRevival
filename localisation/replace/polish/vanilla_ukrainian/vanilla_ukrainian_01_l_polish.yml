 DIPLOMACY_FACTION:0 "§T@$TAG$$TARGET|UH$ — член альянсу $FACTION|H$§!"
 DIPLOMACY_FACTION_NAME_LABEL:0 "§TНазва альянсу: §!"
 DIPLOMACY_HEAD_OF_CRYPTOLOGY_ACTION_DESC:0 "They are the current §HHead of Cryptology§! for our faction.\nAsk them to become the new §HHead of Cryptology§!."
 DIPLOMACY_IMPROVERELATION_ACTION_DESC:0 "Почати поліпшення дипломатичних відносин."
 DIPLOMACY_JOIN_ALLY_ACTION_DESC:0 "Приєднатися до війни на боці союзника"
 DIPLOMACY_JUSTIFY_WARGOAL_NO_OTHERS_AS_SUBJECT:0 "Неможливо особисто виправдовувати ціль війни, будучи суб'єктом."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_CALL_ALLY:0 "Заклик до війни прийнятий"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_SEND_EXP_FORCE:0 "Допомогу від експедиційних військ прийнято"
 DIPLOMACY_MESSAGE_FACTION_DISMANTLED:0 "Держава §Y$COUNTRY|U$§! розпустила свій альянс.\n\nВони вирішили побути самі. Поки що."
 DIPLOMACY_NOT_ENOUGH_IDEOLOGY_POPULARITY:0 "$NAME|H$ вимагає від вступника мати більш ніж $MIN|H%0$ популярності ідеології $IDEOLOGY|H$ (зараз $CUR|H%0$)"
 DIPLOMACY_OFFER_JOIN_FACTION_ACTION_DETAILED_DESC:0 "Підготовка переворотів між вашими державами буде автоматично скасована, якщо противник вступить до Вашого альянсу."
 DIPLOMACY_OFFER_MILACC_ACTION_DESC:0 "Запропонувати право проходу наших військ крізь їхню територію."
 DIPLOMACY_REQUEST_EXPEDITIONARY_REJECTED:0 "Запит на експедиційні війська відхилений"
 DIPLOMACY_REQUEST_HEADER:0 "Запит від держави $COUNTRY|Y$: $NAME|Y$"
 DIPLOMACY_REVOKE_EMBARGO_DESC:0 "Скасувати ембарго та дозволити нашому експорту досягати цієї країни."
 DIPLOMACY_SEND_EXP_FORCE_TITLE:0 "Експедиційні війська"
 DIPLOMACY_SEND_VOLUNTEERS_ACTION_DESC:0 "Ми можемо надіслати добровольців для допомоги іншим країнам із їхніми військовими зусиллями, якщо вони не є нашими союзниками."
 DIPLOMACY_WARGOAL_FLAG_GENERATES:0 "Виправдовує ціль війни проти держави $COUNTRY|H$"
 DIPLOMACY_WAR_NO_WAR_NONAGRESSIONPACT_BLOCK_2:0 "\n\n- Протягом $MONTH_FIRST|Y$–$MONTH_SECOND|Y$ міс. Ви зможете порушити пакт, якщо Ви втримуватимете $RATIO_BALANCE|%0Y$ їхніх утримуваних дивізій на вашому спільному кордоні."
 DIVISION_NAMES_GROUP_LIST_ENTRY_ETC:0 "\n  ..."
 DLC_AVAILABLE_DESC:0 "Є доступні доповнення ($NUM|H$)."
 DLC_DESCRIPTION_dlc052:0 "Опиніться в самому серці командування, розгорнувши своїх генералів а лінії фронту, та нагороджуйте медалями ваших найуспішніших капітанів кораблів. Відкотіть японське вторгнення по Південно-Східній Азії за Австралію; виріжте нову імперію за Сіам; і визначте майбутнє Індонезії, із нідерландським правлінням чи без."
 DOD_hungary.10.a:0 "Ми повернемося до імперії."
 DOD_hungary.105.b:0 "Ми заберемо наші землі."
 DOD_hungary.110.b:0 "Не зараз."
 DOD_hungary.113.a:0 "Змусити їх віддати Трансільванію"
 DOD_hungary.152.t:0 "Конкурс на важкі винищувачі"
 DOD_hungary.163.t:0 "Конкурс на [From.GetAdjective] бомбардувальники"
 DOD_hungary.22.desc:0 "Шведська влада офіційно зберігає нейтралітет, але при цьому вона схвалила тривалі відпустки для разюче великої кількості солдатів і офіцерів і навіть дозволила їм взяти з собою табельну зброю. Ці солдати прибули до Угорщини і готові приєднатися до нашої армії."
 DOD_hungary.50.a:0 "Це не варто того, щоби знову проливати кров."
 DOD_hungary.52.a:0 "Гнів — не найкращий привід для війни. Ми чекатимемо свого часу."
 DOD_hungary.53.a:0 "Ми зробили жест доброї волі. Війна нікому не потрібна."
 DOD_hungary.60.a:0 "Нам слід підтримати Угорщину."
 DOD_hungary.64.b:0 "Ми ще можемо битися."
 DOD_hungary.7.a:0 "Громадяни відповіли відмовою"
 DOD_hungary.82.desc:0 "Посол держави [CZE.GetName] звернувся до нас із благанням про екстрену допомогу. С деяких пір [HUN.GetNameDef] проводить масштабну кампанію щодо дестабілізації обстановки у південній Словаччині. Їхня мета ясна: створити привід для вторгнення під приводом захисту людей, яких вони вважають громадянами своєї держави.\n\n[CZE.GetAdjectiveCap]ий уряд звернувся до нас по допомогу в цьому питанні."
 DOD_hungary.90.b:0 "Ми не будемо підтримувати ці марення."
 DOD_hungary.92.desc:0 "Як з'ясувала наша делегація в ході напружених переговорів, [FROM.GetLeader] вважає, що приналежність Воєводини не є предметом обговорення і що [FROM.GetAdjective]ий урядза жодних обставин не піде на поступки. Громадяни зробили свій вибір у 1919 році, їхня батьківщина — [FROM.GetNameDef]. Як уважає [FROM.GetAdjective]ий уряд, що на цьому питання закрите."
 DOD_hungary.96.a:0 "У нас немає іншого вибору, крім як погодитися."
 DOD_romania.12.a:0 "Яка грубість."
 DOD_romania.161.desc:0 "Ми отримали неприємне послання від [FROM.GetAdjective] міністра закордонних справ. Те, що повідомляє [FROM.GetNameDef], — безсумнівна зрада ідеалів, які відстоюють [ROOT.GetFactionName] і [ROOT.GetRulingIdeology]! [FROM.GetNameDefCap] показує, що [romania_new_ally_target.GetFactionName] їм дорожче і вони будуть боротися разом."
 DOD_romania.31.t:0 "[From.GetNameDefCap] приймає пропозицію"
 DOD_romania.60.a:0 "Ми не зможемо протистояти їм."
 DOD_romania.a:0 "Він — справжній геній, що зійшов до нас із небес!"
 DOD_yugoslavia.50.a:0 "Грецька принцеса Александра підкорила серце короля."
 DOD_yugoslavia.70.a:0 "Ми згодні."
 DOD_yugoslavia.701.allied_objection:0 "Рішення підписати Троїстий пакт було зустрінуто вкрай несхвально як у нашій країні, так і за її межами. Воно поставило під сумнів стан справ, за якого [ROOT.GetLeader] має право бути регентом короля Петара II, і Група офіцерів Югославської королівської армії оголосила Петара II повнолітнім, при [FROM.GetAdjective] підтримці вирушила маршем на Белград і зажадала, щоб [ROOT.GetLeader] був негайно відсторонений від влади."
 DOD_yugoslavia.701.b:0 "До зброї!"
 DOD_yugoslavia.80.desc:0 "[From.GetLeader] оголошує сьогодні, що [From.GetNameDef] бажає йти одним курсом з державою [Root.GetNameDef] і офіційно вступить до альянсу [Root.GetFactionName], але лише в обмін на наш вихід із Балкан шляхом відмови від контролю над регіоном [163.GetName]."
 DOD_yugoslavia.801.b:0 "Це виключено."
