 SOV_order_227_decisions_tt:0 "Відкриває доступ до рішень із підготовки та виконання §Yвійськових наступів§!.\n\nНаступні рішення більше не будуть доступні: §Y$SOV_nothing_is_left_behind$§!\n§Y$SOV_staggered_retreat$§!\n§Y$SOV_factory_worker_militias$§!\n§Y$SOV_civilian_labor_in_defense$§!\n"
