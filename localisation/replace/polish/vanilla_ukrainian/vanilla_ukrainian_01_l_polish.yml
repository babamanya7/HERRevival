 springfield_armory:0 "Springfield Armory"
 ss_recruitment_alternate.2.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що в Шотландії є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS."
 ss_recruitment_event.15.a:0 "Зрадники вмирають смертю зрадника."
 ss_recruitment_event.24.a:0 "Доля Німеччини висить на волосині."
 ss_recruitment_event.24.desc:0 "Зі штаб-квартири фюрера надійшли повідомлення, в яких стверджується, що під час приватної зустрічі між лідером [GER.GetLeader] і Гайнріхом Гіммлером виникла якась суперечка. Подробиць небагато, але служба військової розвідки Абвер стверджує, що перехопила таємного кур'єра, який передавав накази низці підрозділів SS по всій Німеччині, щоб підготуватися до чогось під назвою План «Чорний», нібито операції з захоплення контролю над ключовими комунікаціями та точками інфраструктури у разі спроби військового перевороту."
 ss_recruitment_event.4.t:0 "Вербувальна кампанія в Бельгії"
 ss_recruitment_event.8.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що в Литві є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS.\n\nЗвіти місцевих адміністрацій вказують на широке бойкотування будь-якої вербової діяльності, організованої місцевими лідерами."
