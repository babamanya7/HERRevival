 SWI_enhanced_training:0 "Посилене навчання"
 SWI_expand_arms_industry:0 "Розширити збройну промисловість"
 SWI_expand_spy_networks:0 "Розширити шпигунські мережі"
 SWI_fascist_appeaser:0 "Фашистський умиротворювач"
 SWI_federal_police_idea:0 "Розвідка Швайцарської федеральної поліції"
 SWI_frontier_defense_plan_desc:0 "Якщо ми пустимо їх до наших кордонів, [ROOT.GetNameDef] так само добре, як мертвий. Ми не можемо віддати навіть п'ядь території, наші кордони — це святе. Тому ми повинні зміцнювати наші кордони і бути готовими їх захищати."
 SWI_german_military_collaboration:0 "Співробітництво з [SWI_get_fascist_neighbor_adjective]ою армією"
 SWI_hans_hausamann:0 "Ганс Гаусаман"
 SWI_helvetic_republic_DEF:0 "Гельветська республіка"
 SWI_independence_demand_alps_paragraph:0 "Окрім незалежності, вони мають зухвалість також вимагати наші частини Альп, нібито для створення єдиної країни, яка охоплює всі Альпи.\n\n"
 SWI_militaristic_nationalist:0 "Мілітаристський націоналіст"
