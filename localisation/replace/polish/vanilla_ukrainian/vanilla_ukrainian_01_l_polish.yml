 BUL_purchase_ships_destroyers_tt:0 "Ми отримаємо §Y3 есмінці§!."
 BUL_restore_the_bulgarian_patriarchate_desc:0 "Треба тиснути на Константинопольського патріарха, щоб він визнав автокефалію Болгарської церкви та вжив необхідних заходів, щоб Священний синод Болгарської православної церкви міг обрати митрополита, який стане Болгарським патріархом."
 BUL_state_is_in_the_black_sea_tt:0 "Область знаходиться в Чорному морі"
 BUL_strike_from_the_seas_desc:0 "На узбережжі Середземного та Чорного морів є незліченна кількість островів і численні стратегічні місця. Тому нам потрібні солідні сили з адекватними транспортними засобами, здатними наносити удари з моря та займати ті ключові позиції, з яких можна вести масований наступ."
 BUL_supremacy_on_the_bosporus_desc:0 "Тепер, коли ми перебуваємо під контролем протоки Босфор, ми мусимо побудувати відповідні укріплення, щоби забезпечити домінування Болгарії над цим ключовим стратегічним регіоном."
 BUL_the_third_bulgarian_empire_desc:0 "Ми мусимо зробити останній крок на нашому шляху до слави і величі. У країн, які принижували Болгарію в минулому, не залишиться іншого вибору, як визнати зверхність нашої могутньої нації.\nНастав час проголосити Третє Болгарське царство!"
 BUL_the_third_bulgarian_empire_tt:0 "Додає §Y1§! комірку для будівництва, §Y1 цивільний завод§! й §Y1 рівень інфраструктури§! в трьох історичних регіонах, знову захоплених Болгарією."
