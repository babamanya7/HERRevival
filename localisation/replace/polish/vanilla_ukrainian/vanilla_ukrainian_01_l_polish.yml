 SOV_ilyushin_design_bureau_dissolved_days_tt:0 "Число днів від розпуску Бюро: [?SOV_ilyushin_design_bureau_dissolved_flag:days|Y0]"
 SOV_improve_the_stalin_line_name_default:0 "Поліпшити лінію Сталіна"
