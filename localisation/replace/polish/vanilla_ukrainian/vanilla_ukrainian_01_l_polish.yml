 URG_la_teja_refinery:0 "Нафтопереробний завод Ла Теха"
 URG_legacy_of_batlle_desc:0 "Незалежно від того, куди нас приведе майбутнє, зрозуміло, що партія «Колорадо» назавжди пов'язана зі спадщиною Хосе Батльє-і-Ордоньєса. Ми завжди будемо підтримувати його ідею загальної соціальної справедливості."
 URG_prohibition_of_usury_desc:0 "Ми більше не можемо дозволяти кредиторам видавати позики, які непропорційно вигідні для них. Потрібно запровадити закони про лихварство, щоб запобігти таким речам."
 URG_rapid_industrialization_desc:0 "Все готово, щоб вивести нашу країну в нову еру. Ми розпочнемо шлях швидкої індустріалізації та виведемо нашу країну у 20 століття належним чином."
 USA_SH_battleship_2:0 "Клас «Montana»"
 USA_airborne_divisions_desc:0 "Зі збільшенням дальності та вантажопідйомності літаків у нас з'явився цілий ряд нових можливостей. Вантажні літаки тепер можуть доставити цілий батальйон солдатів у ворожий тил, щоб вони сіяли там хаос та паніку."
 USA_amend_the_budget:0 "Внести зміни до бюджету"
