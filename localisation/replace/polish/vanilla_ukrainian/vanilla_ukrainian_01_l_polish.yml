 SEA_PHI_political_events.16.desc:0 "У відповідь на зміну нашого уряду та зовнішньої політики [USA.GetAdjective]ий уряд надіслав листа із засудженням наших дій. Однак, з огляду на їхні попередні втручання в Південній Америці, це видається м'якою реакцією."
 SEA_PHI_political_events.3.t:0 "[FROM.GetName] пропонує нову торговельну угоду"
 SEA_PHI_political_events.30.t:0 "Філіппіни запитують Айзенгауера"
 SEA_PHI_political_events.48.desc.4:0 "Раніше сьогодні ми отримали повідомлення про порушення в [FROM.GetNameDef]. Після цього ми отримали декларацію незалежності від їхнього уряду з чіткою заявою про підтримку від [SPR.GetAdjective]ого уряду. Хоча заява закликає нас не втручатися, [FROM.GetAdjective]ий уряд чітко дав зрозуміти, що вони не ухилятимуться від боротьби за збереження своєї нової незалежності, маючи [SPR.GetAdjective]у підтримку."
 SEA_PHI_political_events.54.a:0 "Ми можемо продовжити війну силами партизанів"
 SEA_PHI_political_events.55.desc:0 "Після значної економічної та політичної підготовки [PHI.GetNameDef] проголосили незалежність. Це передбачувано сталося після закону Тайдінгса-Макдаффі, який Конгрес ухвалив у 1934 році та який визначив курс на [PHI.GetAdjective]у незалежність. [PHI.GetNameDefCap] тепер вільні у формуванні власної політичної та економічної політики без тиску з боку [USA.GetNameDef]."
 SEA_PHI_political_events.64.osmena:0 "$PHI_sergio_osmena$ буде тримати курс."
 SEA_PHI_political_events.71.a:0 "Тоді, мабуть, наші розбіжності більші, ніж ми думали"
 SEA_PRC_faction_events.1.b:0 "Про це не може бути й мови!"
 SEA_PRC_faction_events.11.a:0 "Ми захистимо весь Китай"
 SEA_PRC_faction_events.91.desc:0 "[FROM.GetNameDefCap] відхилив нашу пропозицію приєднатися до їхньої фракції проти нашого спільного ворога. У їхній заяві наголошувалося, що хоча ми були б сильнішими разом, [ROOT.GetNameDef] не заслуговує на довіру."
 SEA_PRC_fourth_army_incident.11.desc:0 "У відповідь на наш запит до [FROM.GetLeader] вжити заходів після інциденту з Новою 4-ю армією, [FROM.GetLeader] написав офіційного листа з вибаченнями нашому керівництву. Він обіцяє спробувати проінструктувати своїх командирів діяти інакше у разі розбіжностей щодо наказів."
 SEA_PRC_fourth_army_incident.8.desc:0 "У відповідь на нашу вимогу вжити заходів після інциденту з Новою 4-ю армією, [FROM.GetNameDef] не виявив бажання визнати будь-яку провину. Це явна ознака недовіри або навіть прихованої ворожості до нашої нації та військ, що підтримують їхні військові зусилля."
 SEA_PRC_misc_events.13.b:0 "Віддати їм наші монґольські володіння"
 SEA_PRC_misc_events.2.a:0 "Ми повинні змінити їхню думку про нас"
 SEA_PRC_political_events.4.t:0 "[FROM.GetName] відмовляється гарантувати нам безпеку"
 SEA_PRC_political_events.7.t:0 "[FROM.GetName] відмовляється прийняти нас до [FROM.GetFactionName]"
 SEA_PRC_request_aid.10.a:0 "Чудово!"
 SEA_china.1.desc:0 "Ми отримали запит від [FROM.GetNameDef] з проханням надіслати матеріальну підтримку. Хоча [FROM.GetLeader] робив сумнівні заяви про нас у минулому, це може бути можливістю зв'язати іноземні інтереси в регіоні."
 SEA_china.13.desc:0 "Нашого славетного лідера [CHI.GetLeader] було застрелено в його машині; катастрофічний фінал ворожої сутички на дорозі. Нам повідомили, що стрілець діяв самостійно, але оскільки його було вбито під час безпосереднього переслідування, будь-які потенційні змовники залишаться на волі. Партія почала шукати заміну."
 SEA_china_democratic.10.a:0 "Разом до перемоги!"
 SEA_china_democratic.12.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися до нас"
 SEA_china_democratic.16.b:0 "Нам не потрібна їхня допомога!"
 SEA_china_democratic.17.a:0 "Ми ніколи не підкоримося!"
 SEA_china_democratic.17.b:0 "Це найкраще для нашого народу"
 SEA_china_democratic.19.a:0 "Тоді їх приборкають силою"
 SEA_china_democratic.7.desc:0 "Ми отримали досить рішучу ноту від [CHI.GetNameDef]. Вони вимагають, щоб ми звільнили [CHI_country_to_be_liberated.GetNameDef] і повернули території їхнім законним власникам."
 SEA_china_improvement.3.desc:0 "Після років наполегливих реформ, тихох чисток і невпинного нагляду останні великі опіумні мережі було ліквідовано. Вперше за десятиліття воля держави панує беззаперечно по всій країні. Циніки бурмочуть про старі часи, але навіть вони змушені визнати, що повітря стало чистішим."
 SEA_china_warlords.3.a:0 "Тоді їх приборкають силою"
 SEA_generic_events.15.a:0 "Засудити місцевих партійних чиновників"
 SEA_generic_events.8.a:0 "Ми можемо використати це для засудження [GetOppositionPartyName]"
 SEA_imperial_influence_events.100.desc:0 "Фракція Армії намагалася посилити свій вплив на [GetImperialInfluenceRulerTitle], але через свої недоліки їй це не вдалося. Через це вони втратили обличчя, а отже, і престиж, що означає зменшення їхнього впливу."
 SEA_imperial_influence_events.420.t:0 "Фракція Цивільного уряду вимагає політичних призначень"
 SEA_imperial_influence_events.450.desc:0 "Лідери партії висунули свої вимоги. Схоже, вони засмучені зростаюючою силою та впливом Флоту на [GetImperialInfluenceRulerTitle] і бажають швидких дій для обмеження їхнього зростання та влади. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_japan_foreign_policy.10.a:0 "За це не варто воювати"
 SEA_japan_foreign_policy.107.desc:0 "Славна новина про те, що керівництво [FROM.GetNameDef] вирішило ще більше інтегруватися з нами, була зустрінута бурхливими оплесками в Сеймі раніше сьогодні. Того, що ми могли запропонувати, було явно достатньо, щоб вони вважали пропозицію вигідною, незважаючи на незначний удар по їхньому суверенітету."
 SEA_japan_foreign_policy.108.a:0 "Вони загрожують єдності організації!"
 SEA_japan_foreign_policy.110.desc:0 "Славна новина про те, що керівництво [FROM.GetNameDef] дозволило собі інтегруватися до нашої нації, була зустрінута бурхливими оплесками в Сеймі раніше сьогодні. Того, що ми могли запропонувати, було явно достатньо, щоб вони вважали пропозицію вигідною, незважаючи на кінець їхнього суверенітету."
 SEA_japan_foreign_policy.128.a:0 "Ми не маємо достатньо сил, щоб відхилити їхні вимоги"
 SEA_japan_foreign_policy.136.desc:0 "Вчора, у дату, що увійде в історію як символ ганьби, [ROOT.GetNameDef] зазнали раптового та навмисного нападу військово-морських та повітряних сил [JAP.GetNameDef]. [ROOT.GetNameDefCap] перебувала в мирі з цією державою і на прохання [JAP.GetNonIdeologyName] все ще вела переговори з її Урядом та її Імператором, спрямовані на підтримання миру в Тихому океані. Дійсно, через годину після того, як [JAP.GetAdjective]і ескадрильї почали бомбардування [ROOT.GetAdjective]ого острова Оаху, посол [JAP.GetAdjective]ої держави у Сполучених Штатах та його колега передали нашому Держсекретарю офіційну відповідь на нещодавнє [ROOT.GetAdjective]е повідомлення. І хоча в цій відповіді зазначалося, що продовження існуючих дипломатичних переговорів видається марним, вона не містила жодної погрози чи натяку на війну чи збройний напад. Але тепер настав час поглянути правді в очі... Ми у стані війни!"
 SEA_japan_foreign_policy.136.t:0 "Напад на Перл-Гарбор"
 SEA_japan_foreign_policy.16.t:0 "[FROM.GetNameDefCap] передає область [729.GetName]"
 SEA_japan_foreign_policy.49.a:0 "Процвітання вже близько!"
 SEA_japan_foreign_policy.63.desc:0 "[JAP.GetLeader] вимагає, щоб ми об'єднали наш уряд із [RNG.GetNameDef], поклавши край нашій незалежності та надавши нашому керівництву високі посади в [RNG.GetAdjective]ому уряді. Чи приймемо ми цю пропозицію?"
 SEA_japan_foreign_policy.78.a:0 "Нам потрібен хтось надійніший на чолі!"
 SEA_japan_foreign_policy.85.a:0 "Наша далекоглядність окупається."
 SEA_japan_popup_events.1.b:0 "Ми не можемо вірити цьому іноземцю"
 SEA_japan_popup_events.12.desc:0 "Прем'єр-міністр оголосив сьогодні раніше, що колишнього імператора Шьова нещодавно знайшли мертвим в імператорській резиденції. Багато хто підозрює, що це міг бути навмисний крок військових, щоб спробувати закріпити свою владу, хоча офіційна версія стверджує, що він помер від природних причин. Однак токійській поліції не дозволили увійти, щоб підтвердити причину смерті. Невже це зрада з боку самих військових?"
 SEA_japan_popup_events.20.desc:0 "Китайська влада стверджує, що досягнуто «критичної точки» щодо нашої «невиправданої агресії» проти Китаю! Наші вимоги про репарації були відхилені, і надходять повідомлення про нові напади на японських громадян у Шанхаї. Якщо нам потрібен був привід, щоб рішуче розібратися з китайцями, то це він!"
 SEA_japan_popup_events.6.a:0 "Тоді він повинен зректися престолу на користь сина"
