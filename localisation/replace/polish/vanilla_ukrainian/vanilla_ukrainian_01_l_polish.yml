 INS_communist_events.2.desc:0 "Уряд у [FROM.GetName] відмовився здатися і наказав своїм збройним силам придушити революційний рух силою. Наші товариші там вже займають позиції та захоплюють ключові опорні пункти. Боротьба не буде короткою, але народ [FROM.GetName] зробив свій вибір, і ми подбаємо щоб вони не залишилися самі."
