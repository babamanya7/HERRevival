 GRE_political_instability_metaxas_desc:0 "§W£faction_gre_monarchist §YМонархісти§!: [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YРеспубліканці§!: [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YКомуністи§! [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YФашисти§!: [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nЗ 1924 до 1935 року в нас сталися двадцять три зміни уряду, тринадцять переворотів і ще й диктатура! Під управлінням Метаксаса ми досягнемо єдності крізь силу, знищивши всіх ворогів! Грецький народ дізнається, як діє уряд, що прагне затвердити лад в цій беззаконній країні."
 GRE_rebuke_british_investment:0 "Засудити [FROM.GetAdjective]і інвестиції"
 GRE_red_militias_desc:0 "Багато хто намагається завадити нам модернізувати грецьке суспільство, але якщо організувати ополчення на захист революції, ставити нам ціпки в колеса буде важче."
 GRE_red_militias_spirit:0 "$GRE_red_militias$"
 GRE_scout_plane_equipment_1_short:0 "KEA Chelidon"
 GRE_secure_the_aegean_desc:0 "Ми намагаємося вирішити проблеми з іншого боку Європи, ігноруючи при цьому ті, що виникли прямо у нас під носом. Турки багато століть тероризують грецький народ, і хоч ми й сподівалися стати на новий шлях до світлого майбутнього, зараз очевидно, що таке майбутнє не забезпечити, не виправивши несправедливості минулого."
 GRE_ship_light_medium_battery_1:0 "15.2cm/45 Armstrong NN"
 GRE_ship_medium_battery_2:0 "20.3 cm/50 Cannon"
 GRE_small_payment_to_italians_debt_effect_tt:0 "Це рішення на чверть зменшить наш поточний §Yборг§! перед державою §Y[ITA.GetName]§! після кожного його виконання.\n"
 GRE_state_of_the_nation_metaxism_desc:0 "§W£faction_gre_monarchist §YМонархісти§!: [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §YРеспубліканці§!: [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §YКомуністи§!: [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §YФашисти§!: [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]"
 GRE_the_gordian_knot_desc:0 "Гордіїв вузол відомий нам із переказів про Александра Македонського. Розрубати його означає вирішити неможливе на перший погляд завдання несподіваним способом. Наше неможливе завдання — повернути втрачені землі. Наш несподіваний спосіб — домогтися, щоб це зробили за нас наші могутні союзники."
 GRE_the_kings_government:0 "Уряд короля"
 GSM_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3:0 "Шаоцзян"
 GSM_communism_ADJ:0 "Ґаньсу-маськ"
 GUAY_mass_drafts_desc:0 "Зрозуміло, що охорона кордону більше не може бути залишена невеликій силі. Оскільки світ стає все більш непевним, ми повинні бути готові відстоювати наші даровані Богом кордони."
