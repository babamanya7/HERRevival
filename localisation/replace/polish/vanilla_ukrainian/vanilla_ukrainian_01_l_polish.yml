 SIK_utilize_asperovs_contacts_desc:0 "Ґареґін Апресов, Генеральний консул СРСР з особливими повноваженнями та представник Другого східного відділу Народного комісаріату закордонних справ Радянського Союзу в Урумчі, має багато важливих контактів у [SOV.GetNameDef]. Ми повинні використати його владу та зв'язки, щоб витиснути більше з нашої співпраці з [SOV.GetAdjective]ою владою."
