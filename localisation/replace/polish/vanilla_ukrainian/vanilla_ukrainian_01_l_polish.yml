 FIN_resignation_of_mannerheim_desc:0 "$FIN_carl_mannerheim$ не має потреби чи бажання правити країною нескінченно довго, і тому бажає оголосити про свою відставку з посади президента, заявивши, що він більше не потрібен, оскільки він виконав обов'язки, які обіцяв виконати, коли вступав на посаду."
 FIN_ship_anti_air_1:0 "20mm/60 RK Madsen M31"
 FIN_socialist_wellfare_if_kuusinen_tt:0 "\nВпливає, якщо §Y$FIN_otto_wille_kuusinen$§! буде призначено лідером країни до завершення цього фокусу:"
 FIN_soviet_threat_desc:0 "[SOU.GetNameDefCap] є загрозою для життя людей робітничого класу в усьому світі, тому що він без жодних сумнівів втягне їх у загарбницьку війну. Перш ніж він набере надто багато сили, ми повинні покласти край загрозі зараз."
 FIN_strengthen_the_naval_bases_desc:0 "Оскільки [ROOT.GetName] готується до війни, вкрай важливо, щоб його військово-морські бази були добре обладнані та добре захищені. Покращуючи інфраструктуру та захист наших військово-морських баз, ми можемо гарантувати, що наш флот залишатиметься безпечним і готовим боротися з ворогом."
 FIN_weapon_caches_cost_increase_tt:0 "Вартість рішень §YНалаштувати схованки зброї§! буде збільшено на §Y[?FIN_weapon_caches_decision_cost_increase]§!.\n"
