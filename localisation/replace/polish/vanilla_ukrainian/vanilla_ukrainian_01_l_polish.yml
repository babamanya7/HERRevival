 MUN_czech_skoda_priority.d:0 "Компанія «Шкода» виробляє широкий спектр продукції: від артилерії до танків, поїздів та морських гармат. Це забезпечує велику гнучкість завдяки перенаправленню ресурсів туди, де попит найвищий, і тепер ми можемо частково цим керувати."
 MUN_the_fall_of_the_republic.6.d:0 "Несподівано [FROM.getname] відхилила наш ультиматум і натомість має намір чинити нам збройний опір. Вони не залишили нам іншого вибору, окрім вторгнення. Плани битв та маршрути наступу вже розроблені, нам залишається лише віддати наказ про напад."
