 PAR_neuter_the_guion_rojo_desc:0 "Радикальна воєнізована група «Колорадо», «Ґіон Рохо», є загрозою безпеці уряду та постійною проблемою. Нам потрібно нейтралізувати та роззброїти групу, перш ніж вони зможуть перейти до повномасштабного конфлікту."
