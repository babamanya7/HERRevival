 ICE_reclaiming_the_empire_desc:0 "Колись Ґренландію заселили вікінґи, які прибули з Ісландії. Відтоді Норвеґія та Данія сперечаються за неї, незважаючи на те, що не мають справжніх прав на острів. Настав час вимогти повернення Ґренландії її законним власникам. Якщо вони хоч трохи цінують свою спадщину та історію, вони беззастережно віддадуть її нам. Продовжуймо наш шлях до слави!"
