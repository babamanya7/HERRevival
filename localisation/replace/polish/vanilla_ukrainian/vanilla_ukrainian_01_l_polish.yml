 CHI_super_heavy_tank_destroyer_equipment_1:0 "PTZ 44"
 CHI_the_seas_of_tomorrow_tt:0 "Стане доступним §Yнауковець§!, що спеціалізується на обраному раніше напрямку."
 CHI_the_three_year_plan_desc:0 "Наші зусилля були дуже розфокусовані, і нашій нації бракувало керівництва. Завдяки плановим зусиллям у найближчі роки ми зосередимо нашу енергію на одній великій меті. Сподіваємося, ніщо цьому не завадить."
 CHI_the_yanan_incident_effect_tt:0 "Звернутися до держави §H[SOU.GetNameDef]§! за підтримкою: §H[WTT_communist_china.GetNameDef]§! мусить перестати бути лідером комуністів.\nУ разі відмови §H[WTT_communist_china.GetNameDef]§! вступить у війну з нами.\nЯкщо договір буде укладено, §H[SOU.GetNameDef]§! та [SOU.GetLeader] зможуть пред'являти нам свої вимоги.\n"
 CHI_tsr_embrace_japanese_cultural_institutions_desc:0 "Щоб досягти кращої співпраці з японцями з метою об'єднання Азії проти іноземних загарбників, ми повинні сформувати об'єднану культуру, приймаючи частину японської культури, щоб зблизитися."
 CHI_tsr_expand_the_nanjing_army:0 "Розширити Нанкінську армію"
 CHI_tsr_form_a_preparatory_committee_desc:0 "Поки недоліки конкуренції за посаду глави держави не будуть усунені, країна ніколи не матиме спокою. Тому, як це було зроблено 19 серпня 1915 року, необхідно створити підготовчий комітет з метою заснування конституційної монархії. Тільки тоді наші внутрішні чвари та політичний хаос можна буде справді викорінити!"
 CHI_tsr_renegotiating_with_warlords_cat:0 "Переговори з воєначальниками"
 CHI_tsr_restoration_of_the_chinese_empire:0 "Реставрація Китайської імперії"
 CHI_wang_shuming:0 "Ван Шумін"
 CHI_warlord_state_idea_tt:0 "Цей дух буде видалено після завершення фокусу §Y$CHI_power_struggle$§!, §Y$CHI_the_yanan_incident$§! або §Y$CHI_proclaim_rival_government$§!."
 CHL_a_new_empire_of_brazil_desc:0 "Ми підкоримо Бразилію і створимо нову Бразильську імперію на чолі з новим королем, не португальського походження!"
 CHL_adopt_mapundungun:0 "Прийняти мапудунґун"
 CHL_banco_central_de_chile:0 "Banco Central de Chile"
 CHL_carlos_fuentes_rabe:0 "Карлос Фуентес Рабе"
 CHL_chilean_anti_communist_action_dem_version:0 "Чилійська антикомуністична дія"
 CHL_construct_the_estadio_nacional_desc:0 "Найбільші зусилля Алессандрі з відновлення економіки та довіри людей були спрямовані на громадські роботи, а його magnum opus — Estadio Nacional, грандіозний національний стадіон для спортивних ігор, який є чудовою демонстрацією його здатності керувати нацією."
 CHL_convene_the_araucanian_congress:0 "Скликати Арауканійський конгрес"
 CHL_csav_organization:0 "CSAV"
 CHL_electing_a_toqui:0 "Вибори токі"
 CHL_enact_universal_suffrage_desc:0 "Право голосу є основою будь-якого демократичного суспільства, і дуже прикро, що не всі в нашій країні можуть голосувати з тими ж правами, що й інші. Ми мусимо домогтися рівності та якнайшвидше надати жінкам Чилі можливість голосувати."
 CHL_expand_the_officer_corps_desc:0 "Було багато офіцерів, відданих фашистській чи соціалістичній ідеї, які згодом залишили нашу службу. Ми мусимо розширити офіцерський корпус і виховати молодих офіцерів, щоби боротися з цим новим дефіцитом."
 CHL_frente_popular_party:0 "НФ"
 CHL_government_mandated_contracts_desc:0 "Аби залучити більше людей до роботи і зробити свій внесок, ми мусимо розглянути можливість субсидування галузевих контрактів і виплачувати частину зарплат самостійно. Таким чином, більше компаній зможуть відчувати себе комфортно, наймаючи більше працівників, а більше людей зможуть отримати гроші, які вони зможуть витрачати та вкладати в економіку."
 CHL_gustavo_silva:0 "Ґуставо Сільва"
 CHL_hispanic_union_fascism_DEF:0 "Іспанська імперія"
 CHL_host_german_intelligence_desc:0 "У своїй операції «Болівар» німці намагаються шпигувати за американцями з півдня, і ми можемо надати їм багато цікавої інформації, якщо вони розмістять шпигунів і дозволять Абверу тісніше співпрацювати з нашим урядом."
 CHL_joint_development_and_research_desc:0 "Тепер, коли ми працюємо більш тісно, ми можемо інвестувати один в одного і розміщувати лабораторії, які приймають дослідників з усіх країн-членів для кращої спільної роботи."
 CHL_joint_invasion_of_mexico_desc:0 "Тепер, коли ми уклали союз із новою Французькою імперією, настав час відтворити те, що нам колись не вдалося. Мексиканська імперія мусить відродитися, інакше ми всі впадемо перед могутністю американців!"
 CHL_lack_of_funds:0 "Нестача коштів"
 CHL_look_to_tradition_desc:0 "Артуро Алессандрі вже побував у центрі уваги, але ще не вирішив жодної з кричущих проблем, які досі нависають над країною. Тому ми мусимо зробити крок назад від лібералізму і озирнутися на ті старі добрі цінності, на які ми звикли покладатися."
 CHL_manuel_pedregal:0 "Мануель Сантьяго Конча Педрегал"
 CHL_mapuche_liberate_guarani:0 "Визволити [GAR.GetAdjective]ий народ"
 CHL_mapuche_nationalism_dynamic_modifier:0 "Націоналізм мапуче"
 CHL_mapuche_reconcilliation_campaigns:0 "Кампанії примирення з мапуче"
 CHL_miguel_serrano:0 "Мігель Серрано Фернандес"
 CHL_news_events.1.t:0 "Фашистський державний переворот у [CHL.GetNameDef]"
 CHL_news_events.4.d:0 "[CHL.GetLeader] з [CHL.GetNameDef] оголосив, що держава розпочне Антиімперіалістичний хрестовий похід, у якому вони звільнять народи Америки від європейського гніту. Багато хто дивується, чи справді ера колоніалізму закінчилася, чи це лише чергова проблема на шляху світових держав."
 CHL_news_events.5.desc:0 "Незважаючи на те, що воно існувало лише короткий час у 1860-х роках, Жак Антуан Бернар, претендент на старий трон, повернувся до Чилі на тлі хаосу та відновив своє давно втрачене королівство. Лише час покаже, як це обернеться..."
 CHL_oscar_fuentes_pantoja:0 "Оскар Фуентес Пантоха"
 CHL_pedro_calderon:0 "Педро Сільва Кальдерон"
 CHL_political_events.20.t:0 "Конференція в Сантьяго"
 CHL_political_events.21.desc:0 "Війська, що належать [PRU.GetNameDef], станом на вчорашній день почали перетинати регіон Напо-Пастаса, штат, який їм не належить. Після Тихоокеанської війни нам нещодавно довелося відмовитися від Такни та передати її Перу в рамках угоди, але оскільки вони не поважають міжнародні кордони, то й ми не повинні."
 CHL_political_events.40.t:0 "[FROM.GetName] вирішує не приєднуватися до нашої фракції"
 CHL_political_events.43.a:0 "Das ist gut"
 CHL_political_events.46.a:0 "Чудово"
 CHL_political_events.5.a:0 "Сьогодні перемога для чилійського народу!"
 CHL_political_events.72.b:0 "Ми не будемо йти на компроміс щодо наших ідеалів!"
 CHL_recruit_young_officers_desc:0 "Багато генералів на високих посадах у нашій країні мали більш ліві симпатії, і всі вони, за винятком декотрих, подали у відставку, коли ми взяли владу в свої руки. Ми мусимо підняти з лав патріотично налаштованих і фанатично налаштованих молодих офіцерів, які б замінили своїх старих занепадницьких начальників."
 CHL_released_Itza_flag:0 "$CHL_released_itza_flag$"
 CHL_reorganized_brazil_flag:0 "Бразилію реорганізовано"
 CHL_republican_guards_in_exile:0 "[CHL.GetAdjectiveCap]а Республіканська гвардія в екзилі"
 CHL_ship_medium_battery_3:0 "20.3-см/50 Cannon"
 CHL_sponsor_anti_colonialist_rebellions:0 "Спонсорувати антиколоніальні повстання"
 CHL_the_mapuche_conflict:0 "Конфлікт із мапуче"
 CHL_the_nationalization_of_copper:0 "Націоналізація міді"
 CHL_unified_in_spirit_tt:0 "Усі §Yамеріндські та полінезійські країни-суб'єкти§! також отримають цей національний дух."
 CHL_union_of_hispanic_republics_desc:0 "Тепер, коли всі гіспанські народи об'єдналися під одним прапором, настав час показати світові, на що ми здатні, і що ми маємо намір звільнити всіх наших людей, які залишилися під іноземним імперіалістичним пануванням."
 CHL_use_the_fascist_movement:0 "Скористатися фашистським рухом"
 CHR_neutrality_DEF:0 "Держава чарруа"
 CHU_communism_DEF:0 "Чуваська рада"
 CIN_democratic_DEF:0 "Чечено-інґуська республіка"
 CIN_neutrality_ADJ:0 "Чечено-інґуськ"
 CIVILIAN_FACTORIES_STATUS:0 "£civ_factory Використовувані цивільні заводи: $USED|Y$/$TOTAL|Y$"
 CKK_JAP_neutrality_subject_ADJ:0 "Чукотськ"
 CKK_fascism_ADJ:0 "Чукотськ"
 CKK_neutrality:0 "Незалежні чукотські території"
 CLEAR_ALL_OVERRIDE_GARRISON_TITLE:0 "Очистити заміни шаблону гарнізону"
 CLICK_TO_CONVERT:0 "§GКлацніть§!, щоби конвертувати в споруду $BUILDING|Y$"
 COG_adopt_lingala_and_swahili_as_martial_languages_desc:0 "Хоча Force publique використовувала французьку як основну мову, ми повинні, намагаючись дистанціюватися від наших колишніх колоніальних господарів, ввести рідні мови Конґо в нашу армію. Основними мовами будуть Лінгала та Суахілі, оскільки це найбільші з них на цей момент."
 COG_allow_local_autonomy_desc:0 "Оскільки практично неможливо належним чином централізувати державу, ми повинні намагатися дозволити регіонам місцеву автономію, щоб краще утримувати підтримку численних людей нашої нації, навіть якщо ми не матимемо такого великого контролю над ними."
 COG_belgian_congo_colonial_dynamic_modifier:0 "Зразкова колонія"
 COG_bundu_dia_kongo_idea:0 "Bundu dia Kongo"
 COG_central_bank_of_congo_ruanda_urundi:0 "Центральний банк Конґо та Руанда-Урунді"
 COG_cooperate_with_the_congolese_churches_desc:0 "Церкви, хоч і консервативні за своєю природою, не виступають проти нас і не становлять великої загрози нашій владі. Тому найкращим варіантом буде заручитися їхньою підтримкою та включити їх у наш національний апарат."
 COG_devout_catholic_kingdom:0 "Вірне католицьке королівство"
 COG_establish_the_anc_locking_tt:0 "§RБлокує будь-які фокуси Force Publique від виконання в майбутньому§!"
 COG_expand_ruanda_urundi_cash_crop_farming:0 "Розширити товарні ферми"
 COG_improve_ruandan_civil_adminsitration:0 "Вдосконалити цивільну адміністрацію Руанди"
 COG_industrial_investment_decisions_desc:0 "Колоніальна влада дала добро на подальші інвестиції і розширення промисловості та шахт у нашій країні, включаючи залізничні дочірні підприємства й інші проекти, необхідні для забезпечення та підтримки цих операцій. Ми використаємо це на нашу користь."
 COG_investments_into_villages:0 "Інвестувати кошти в місцеві селища"
