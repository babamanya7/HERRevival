 CZE_sokolov_raid_pfot_limited_success_ns_desc:0 "Ретельно спланований удар по лінії фортів у Фалкнові зробив [CZE.GetAdjective] оборону вразливою до наших атак. Зараз чудовий час для нас розпочати наступ."
 CZE_strike_at_the_heart_of_bolshevism_desc:0 "Експансія [SOV.GetNameDef] є екзистенційною загрозою для Європи та нашої нації. Ми повинні стати оплотом проти них."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt:0 "Завдання «$CZE_the_rut_demands$» буде відкладено на §Y35 днів§! після вибору цього фокусу."
 CZE_truth_prevails_desc:0 "Навіть перед обличчям великих труднощів та нездійсненних завдань наша країна знає, що наш національний девіз «Правда перемагає» виявиться істинним, коли все закінчиться. Шукайте правду, кажіть правду, і вона переможе."
