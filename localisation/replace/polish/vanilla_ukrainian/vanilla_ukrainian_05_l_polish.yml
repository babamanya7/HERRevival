 NSB_poland_communist_events.2.a:0 "Це наш найкращий шанс."
 NSB_poland_events.302.t:0 "Кайзер виявляє ворожість"
 NSB_poland_events.4.b:0 "[POL_colony_purchase.GetName] — невід'ємна частина [Root.GetAdjective] імперії!"
 NSB_poland_events.402.a:0 "Спробувати все одно варто."
 NSB_poland_events.8.d:0 "Після захоплення Москви державою [From.GetNameDefCap] та її союзниками наші агенти знайшли в архівах НКВС записи, що проливають світло на сумну долю сімейства Романових. У документах мовиться, що вся імператорська сім'я, включаючи Анастасію, була страчена більшовиками в липні 1918 року. Якщо ми зволікаємо, весь світ скоро дізнається, що наша королева не та, за кого себе видає."
 NSB_polish_fascist_events.2.b:0 "Чудово."
 NSB_polish_fascist_events.202.t:0 "[From.GetNameDefCap] відмовляється"
 NSB_soviet_civil_war_common.001.a:0 "Настав час йти далі."
 NSB_soviet_civil_war_common.001.t:0 "Перемога"
 NSB_soviet_civil_war_common.006.desc:0 "[SOS.GetLeader] все слабше утримує країну. По всій державі [SOS.GetNameDef] народ повстає проти тиранії, і [SOS.GetLeader] втрачає владу. Утворюються загони партизан, які допоможуть нам у нашій боротьбі."
