 election.11.d:0 "Ці вибори стали руйнівними для самої установи, яку вона представляє. Більша частина [Root.GetAdjective]ого населення віддала свої голоси на користь фашистської партії, яка прагне скасувати вибори та встановити автократичного правителя. У той час як багато хто розглядає можливість взяти до рук зброю проти цього порушення демократичних ідеалів, які дозволили їм отримати цей мандат, інші вважають, що застосування насильства лише ще більше підтвердить їхні ідеали."
