 SIA_military_strongman:0 "Військовий лідер"
 SIA_mountain_tanks_desc:0 "Скелясті пагорби і гірські перевали не можна просто залишити піхоті. Створюючи компактні броньовані машини, пристосовані для пересіченої місцевості, ми зможемо дати нашим арміям засіб для доставлення захищеної вогневої моці в регіони, де звичайні танки не впораються."
 SIA_national_savings_bond_all_adult_serve:0 "За умови §Y$all_adults_serve$§! отримуємо:"
 SIA_prepare_for_the_next_blockade_desc:0 "Якщо моря стануть ворожими, [ROOT.GetNameDef] може опинитися відрізаною від ринків, обладнання та палива. Тому ми повинні готуватися до наступної блокади вже зараз, створюючи запаси, плани на випадок надзвичайних ситуацій та замінники, перш ніж необхідність змусить нас діяти."
 SIA_promote_military_wing:0 "Загравати з військовим крилом"
 SIA_propaganda_campaign_cooldown_tt:0 "Ця кампанія знову буде доступна через §Y[?constant:propaganda.SIA.default_propaganda_campaign_cooldown] днів§! після її завершення."
 SIA_rebuild_the_war_torn_economy_desc:0 "Громадянська війна розірвала дороги, фабрики, рисові поля та торгові шляхи. Відбудова має розпочатися негайно. Заробітна плата, зерно, залізниця і кредити зроблять для стабілізації [ROOT.GetName] більше, ніж будь-яка промова з Бангкока."
 SIA_release_contigency_funds:0 "Вивільнити резервні фонди"
 SIA_restored_politician:0 "Restored Politician"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc:0 "Залучити Мангкорна Промйоті на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_the_king_of_the_white_elephant_tt:0 "Відмикає кампанію пропаганди §Y$SIA_the_king_of_the_white_elephant$§! після виконання фокусу §Y$SIA_sala_chaloem_thai_movie_theater$§!, що дає:\n$MODIFIER_STABILITY_WEEKLY$: §G+0.45%§! на 180 дн."
 SIA_the_malay_peninsular_defense_plan_desc:0 "Якщо війна прийде до Південно-Східної Азії, Малайя стане одним з її перших полів битви. Укріплення, склади постачання та спільне планування з британцями перетворять півострів на щит проти вторгнення."
 SIA_the_regency_of_rangsit_desc:0 "Принц Рангсіт розуміє, що монархія може вижити, лише примирившись з представницьким урядом. Його регентство пропонує королівську реставрацію, яка є консервативною за своєю гідністю, але демократичною за методами і готовою дати [ROOT.GetNameDef] стабільне парламентське майбутнє."
 SIA_the_unproven:0 "Неперевірений"
 SIA_thonburi_class_coastal_defense_ship:0 "Корабель берегової оборони класу Тонбурі"
 SIA_uk_japan_focus_tt:0 "Дозволяє вибрати між [ENG.GetNameDef] та [JAP.GetNameDef] з такими ефектами:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_wan_waithayakon:0 "Ван Вайтхаякон"
 SIC_drive_out_the_japanese_idea:0 "Вигнати японців"
 SIC_liu_shucheng:0 "Liu Shucheng"
 SIC_sichuan_still_stands:0 "Сичуань все ще стоїть"
 SIC_sichuan_still_stands_desc:0 "Хоча Центральний уряд сподівався, що похід на Чунцін після смерті Лю Сяна означатиме нашу капітуляцію, цього не сталося. Натомість ми довели, що є легітимною силою в Китаї і що ми здатні протистояти Центральному уряду, якщо це буде потрібно."
 SIE_neutrality_ADJ:0 "Сьєрра-леонськ"
 SIK_a_new_nationality_policy:0 "Нова національна політика"
 SIK_heavy_tank_destroyer_equipment_2:0 "PTZ 41 D"
 SIK_king_of_sinkiang:0 "Король Сіньцзяну"
