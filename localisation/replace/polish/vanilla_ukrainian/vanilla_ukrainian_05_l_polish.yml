 CZE_align_slovak_catholics:0 "Залучити словацьких католиків"
 CZE_ally_austria_desc:0 "Її уряд ледь не повалили нацистські головорізи всього кілька років тому; [AUS.GetNameDef] повинна почати розуміти потенційні переваги співпраці з [ROOT.GetNameDef]."
