 ss_recruitment_event.15.desc:0 "Фортуна — або провидіння —, здається, сприяє лідеру [GER.GetLeader], оскільки вибух бомби в його штабі лише незначно поранив його. Декільком іншим поруч із ним не пощастило.\n\nОтримавши медичну допомогу з кількома незначними опіками та поверхневими порізами, [GER.GetLeader] негайно зустрівся з представниками партії, SS і Ґестапо, щоб обговорити подальші кроки."
