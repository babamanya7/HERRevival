 RAJ_rural_mechanization_program_desc:0 "Щоб підвищити сільськогосподарське виробництво та зменшити залежність від застарілих методів праці, ми запровадимо структуровану програму для впровадження механізованого землеробства по всій сільській місцевості. Трактори, молотарки та іригаційні системи трансформують сільську продуктивність та закладуть основу для сучасної, самодостатньої економіки."
 RAJ_seek_intial_funding_desc:0 "Щоб закласти основу для наших великих амбіцій, ми повинні забезпечити капітал від [ENG.GetAdjective] інвесторів. Їхнє початкове фінансування послужить іскрою, яка запалить наш економічний двигун."
