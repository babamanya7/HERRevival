 RULE_OPTION_HISTORICAL_CHI_AI_DESC:0 "§HКитайський§! ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_OPTION_HISTORICAL_PAR_AI_DESC:0 "ШІ уникатиме світової політики та зосередиться на внутрішніх справах, долаючи нестабільність, яка береже країну від війни."
 RULE_OPTION_HUN_FASCIST_KING:0 "Фашистський король"
 RULE_OPTION_LOYALIST_INS_AI_DESC:0 "The AI will stay loyal to the Netherlands, either seeking independence peacefully through the Soetardjo petition, or maintaining the colonial order."
 RULE_OPTION_MACARTHUR_PHI_AI_DESC:0 "Після падіння уряду Філіппін на сцену вийде військовий діяч, який очолить націю у боротьбі проти будь-яких агресорів."
 RULE_OPTION_METAXIST_GRE_AI_DESC:0 "§HГреція§! дотримуватиметься нейтралітету та розвиватиме ідеї метаксизму."
