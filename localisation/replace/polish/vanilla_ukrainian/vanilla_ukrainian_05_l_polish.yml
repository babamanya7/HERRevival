 HABSBURG_cavalry_modifier:0 "Імперські та королівські гусари"
 HABSBURG_joint_consumer_goods_endeavors_desc:0 "Економічні можливості кожного окремого регіону в межах федерації сильно відрізняються, як і наші центральні банки також сильно відрізняються за економічною владою. Хоча кожній країні має бути дозволено мати свій власний центральний банк, створення одного центрального для федерації гарантуватиме, що ми матимемо інстанцію, яка в першу чергу займається загальним економічним статусом союзу."
