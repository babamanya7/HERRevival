 HOA_improved_irrigation_systems_desc:0 "Ми не можемо мати національну безпеку без надійного виробництва продуктів харчування. Щоб підвищити врожайність, ми будемо інвестувати в масштабну програму зрошення нашої орної землі."
 HOA_metal_beasts_desc:0 "Стає все більш очевидним, що бронетехніка відіграватиме все більшу роль на полі бою. Армія повинна навчитися найкраще використовувати та протидіяти таким транспортним засобам."
 HOA_securing_the_adjective_future:0 "Убезпечити [ROOT.GetAdjective]е майбутнє"
