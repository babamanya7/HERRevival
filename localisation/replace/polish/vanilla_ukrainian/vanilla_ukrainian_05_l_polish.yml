 BEL_burgundy_fascism_ADJ:0 "Бурґундськ"
 BEL_convoy_protection_duties_desc:0 "У часи великої небезпеки та потреби стає прийнятним озброювати торгові судна та надавати їм артилерію та морські екіпажі для захисту. Таким чином, ті, хто полює на наші торгові судна, раптом зрозуміють, що їхня здобич має зуби."
 BEL_cooperative_cooperation_desc:0 "Кооперативи є частиною бельгійського суспільства вже деякий час, і їхня бізнес-модель дуже сумісна з економічним ідеалом, який ми підтримуємо. Ми повинні співпрацювати з тими, хто вже існує, і використовувати їх досвід для навчання нових поколінь соціально свідомих бізнесів."
 BEL_corrupt_old_guard:0 "Корумпована стара гвардія"
 BEL_demand_calais_desc:0 "Хоча наш проєкт возз'єднання нації майже завершений, існує критична частина Фландрії, що досі знаходиться в руках іноземців — Кале. Це місто колись було частиною графства Фландрія тисячу років тому, і тому зараз буде справедливо, якщо воно буде відновлене до нас."
 BEL_democratic_party_long:0 "Католицький блок"
 BEL_dietsland_tt:0 "§Y[BEL.GetName]§! буде зватись §YДітсланд§!"
 BEL_dieudonne_salve:0 "Дьєдонне Сев"
