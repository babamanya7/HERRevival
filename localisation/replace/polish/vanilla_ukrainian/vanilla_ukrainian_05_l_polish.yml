 AST_australasia_DEF:0 "Австралазія"
 AST_australian_womens_army_service:0 "Призов жінок до австралійської армії"
 AST_autonomy_associated_dominion:0 "Австралія"
 AST_autonomy_dominion_DEF:0 "Домініон Австралія"
 AST_call_on_fascists_desc:0 "Як невеликий рух із нечисленними прихильниками, «Передусім Австралія» не завжди зводить кінці з кінцями. Однак, іноземна група зі схожими ідеями виявила готовність фінансувати наші амбіції, пропонуючи рішення для забезпечення нашого подальшого просування."
 AST_cannot_campaign_for_two_parties_at_once:0 "Не: проводить кампанію за іншу партію"
 AST_carrier_1:0 "Клас «Courageous»"
 AST_chinese_relations_desc:0 "Наші товариші в Китаї борються за власне виживання. У нас є засоби допомогти їм, але діяти треба швидко, перш ніж їх розчавлять імперіалістичні сили, що вишикувалися проти них."
 AST_commitment_to_the_cause_desc:0 "Настав час скинути з себе пута закордонного короля та побудувати трудовий рай, де немає місця імперіалізму та мілітаристському чаду, здатним занапастити всю Австралію.."
 AST_covert_networks:0 "Приховані мережі"
 AST_diplomatic_events.39.t:0 "[GER.GetNameDefCap] погоджується на Науруанський пакт"
 AST_diplomatic_events.62.t:0 "Антибританський пакт?"
 AST_diplomatic_events.71.desc:0 "[AST.GetName] вимагає контролю над нашими тихоокеанськими островами, стверджуючи, що західна частина Тихого океану не підпорядковується командуванню [USA.GetNameDef]. Острови можуть бути невеликою ціною за вгамування ворожості Австралії, але це все одно ціна. Чи варто нам ризикувати провокувати висхідну фашистську державу, хоча у нас і так повно клопоту?"
 AST_diplomatic_events.74.a:0 "Ми не можемо ризикувати війною; задовольнити їхні вимоги."
 AST_election_countdown_desc:0 "До відкриття виборчих дільниць залишилися лічені дні.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_end_the_kingdom_ireland_join_tt:0 "Оскільки [IRE.GetName] підписала Антибританський пакт, вона вступить у війну на нашому боці після того, як ми оголосимо війну [ENG.GetNameDef]."
 AST_factory_conversions_desc:0 "В обмін на те, що [ROOT.GetFascistParty] проводитиме вигідну для них політику, провідні діячі бізнесу погодилися інвестувати в галузеві реформи, які узгоджуються з цілями партії.\n\nОборонна промисловість має бути пріоритетною, і тому австралійські фабрики мають бути переобладнані для її підтримки."
 AST_geoffrey_street:0 "Джеффрі Стріт"
 AST_heavy_fighter_equipment_1_short:0 "Blenheim IF"
 AST_holding_the_battlefield_tt:0 "§YЗнижена вартість§! для дій \"§YВстановлення маріонеточного режиму§!\" та \"§YЗабрати область§!\" на Мирних конференціях разом із §Y[ENG.GetNameDef]§!."
 AST_improved_ground_crews:0 "Покращені наземні екіпажі"
 AST_industries_assistance_corporation:0 "Сприяння промисловості"
 AST_larrikinism:0 "Ларрікінізм"
 AST_light_tank_artillery_equipment_2:0 "M3 Light SP Artillery"
 AST_malaya_communist_foothold_raid_desc:0 "Малайські комуністичні сили відрізані від півострова. Таємна десантна операція може захопити материковий регіон і розмістити там озброєні ополчення, давши революції плацдарм, необхідний для виживання."
 AST_mechanized_equipment_2_short:0 "Universal Carrier"
 AST_medium_jet_plane_short:0 "Canberra"
 AST_new_south_wales_rc_ic:0 "New South Wales Railway Company"
 AST_owen_gun:0 "Пістолет-кулемет Оуена"
 AST_refuse_british_wars_desc:0 "Ґалліполійська кампанія Великої війни продемонструвала безрозсудність, з якою [ENG.GetNameDef] ставиться до наших експедиційних сил, роблячи ідею ще однієї закордонної кампанії від її імені абсолютно немислимою. Австралійці вимагають, щоб наша кров більше ніколи не проливалася під британським командуванням, змушуючи уряд діяти; Вестмінстерський акт буде ратифіковано."
 AST_rex_ingamells:0 "Рекс Інгамеллс"
 AST_royal_australian_navy_desc:0 "Утворений після створення федерації шляхом об'єднання колоніальних флотів, Королівський австралійський військово-морський флот служив майже на всіх театрах Великої війни. Відтоді він був скорочений через обмежене фінансування, але зі зростанням глобальної напруженості настав час флоту повернутися на моря."
 AST_second_australian_imperial_force:0 "Другі Австралійські Імперські сили"
 AST_specialize_equipment:0 "Спеціалізація оснащення"
