 BALTIC_events.14.a:0 "Ми покінчимо з цими зрадниками!"
 BALTIC_events.7.d:0 "[From.GetNameDefCap], що служить [Root.GetAdjective] воротами до Західної Європи, пропонує план по вторгненню на територію [baltic_wargoal_target.GetNameDef] від імені держави [Root.GetNameDefCap]. [From.GetLeader] стверджує, що [baltic_wargoal_target.GetAdjective] вторгнення буде безцінним для нашої спільної справи розповсюдження революції по Європі і відкриє нові можливості для розширення, як тільки [baltic_wargoal_target.GetAdjective] уряд розпустять."
 BALTIC_forest_brothers_reorganized_idea_desc:0 "Колись це були захисники балтійської незалежності, але тепер латвійський відділ Лісових братів був реорганізований у воєнізоване крило «Pērkonkrusts»."
 BALTIC_german_baltic_industry_desc:0 "[GetGermanBalticIndustryDesc]"
 BALTIC_overthrow_the_government_desc:0 "У нас достатньо підтримки, і тепер [Root.GetLeader] та [Root.GetLeader.GetHerHis] режим будуть повалені! Потрібно лише піти маршем на столицю і оголосити там нову Республіку робітників!"
 BALTIC_secure_military_support_desc:0 "В армії багато хто вважає, що [Root.GetLeader] — негідний лідер, якого необхідно позбавити націю. Ми могли б легко залучити на свій бік генерала, який шукає слави і визнання, пообіцявши йому, що він стане народним героєм."
 BALTIC_unchain_education:0 "Розв'язати освіту"
