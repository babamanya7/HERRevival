 BBA_ethiopia_communist_events.12.t:0 "[SOV.GetAdjectiveCap]е обладнання прибуло"
 BBA_ethiopia_communist_events.14.a:0 "Відмінна пропозиція."
 BBA_ethiopia_communist_events.21.a:0 "Ми вдячні нашим [SOV.GetAdjective] товаришам!"
 BBA_ethiopia_communist_events.31.t:0 "[ITA.GetNameDefCap] погоджується на припинення вогню"
 BBA_ethiopia_communist_events.35.a:0 "Ми разом із народами Африки."
 BBA_ethiopia_communist_events.48.b:0 "У нас немає вибору, як погодитися."
 BBA_ethiopia_communist_events.51.b:0 "У нас немає вибору, як погодитися."
 BBA_ethiopia_communist_events.62.desc:0 "Дипломати з [FROM.GetNameDef] повідомили, що їхній уряд готовий відмовитися від претензій на [?ETH.ETH_disputed_colony.GetAdjective] територію, яку ми звільнили. Вони вже почали відведення своїх військ до нововстановлених кордонів у регіоні."
 BBA_ethiopia_exile_events.08.t:0 "[FROM.GetAdjective]ий уряд відмовляється"
 BBA_ethiopia_exile_events.16.a:0 "Як прикро."
 BBA_ethiopia_exile_events.30.t:0 "Взаємна фракційна заява"
 BBA_ethiopia_exile_events.32.b:0 "Нам краще без них"
 BBA_ethiopia_exile_events.40.a:0 "[ITA.GetName] має вийти з [FROM.GetName]"
 BBA_ethiopia_fascist_events.22.desc:0 "Як і очікувалося, [FROM.GetLeader] відхилив запит на формальну незалежність від [ROOT.GetLeader]. Оскільки такий поворот подій був очікуваним, [ROOT.GetAdjective]і збройні сили вже втримують ключові позиції в країні. Цього разу держава набагато краще підготовлена."
 BBA_ethiopia_fascist_events.67.desc:0 "[ITA.GetAdjective] дипломати обурено відреагували на наше прохання про територіальну компенсацію. Вони стверджують, що народ [ITA.GetAdjective] не зрозуміє передачі територій, за які було пролито кров, тим більше — колишнім ворогам."
 BBA_ethiopia_imperial_events.12.t:0 "[FROM.GetNameDefCap] приймає вимоги"
 BBA_ethiopia_imperial_events.5.a:0 "Вони побачили світло."
 BBA_ethiopia_imperial_events.9.a:0 "Не всіх можна здолати."
 BBA_ethiopia_industrial_financial_events.3.a:0 "Можливо, доведеться застосувати силу, щоби захистити свої інтереси."
 BBA_italo_ethiopian_war_events.112.t:0 "[FROM.GetName] кидає виклик Лізі Націй"
 BBA_italo_ethiopian_war_events.122.a:0 "Війна переходить у нову фазу."
 BBA_italo_ethiopian_war_events.402.t:0 "[FROM.GetLeader] згоден"
 BBA_italy_air_accident.11.t:0 "Трагічна авіакатастрофа"
 BBA_italy_anti_colonialism_events.07.desc:0 "Схоже, що [FROM.GetName] вважає, що вони краще підходять для управління собою, і відхилили нашу пропозицію стати частиною нашої ширшої адміністрації."
 BBA_italy_civil_war.100.b:0 "Утримувати окуповану територію"
 BBA_italy_colonial_management_african_states:0 "Африканські регіони"
 BBA_italy_decide_the_fate_of_mussolini.1.b:0 "Стратити його."
 BBA_italy_decide_the_fate_of_mussolini.2.t:0 "Суд над Муссоліні"
 BBA_italy_interaction_events.10.t:0 "Дурний [FROM.GetLeader] відхилив наш ультиматум"
 BBA_italy_interaction_events.11.desc:0 "[ITA.GetLeader] вимагає, щоб чорногорський трон був переданий італійській державі та щоб корони були об'єднані під одним прапором. Очевидно, що це трохи маячня, хоча і не дуже далека від реальності, оскільки королева Італії є чорногоркою. Як ми повинні відповісти?"
 BBA_italy_interaction_events.21.desc:0 "[ITA.GetNameDef] звернулася до нас із привабливою пропозицією. Вони пропонують нам право власності на Родос та Додеканеські острови в обмін на союз із ними. Ця пропозиція здається майже занадто гарною, щоб бути правдою, але це не так. Що ж нам робити?"
 BBA_italy_interaction_events.22.desc:0 "Турецький уряд сьогодні оголосив, що прийняв нашу пропозицію і розпочне військову співпрацю якнайшвидше в обмін на володіння Додеканеськими островами. Побачимо, куди це нас приведе."
 BBA_italy_interaction_events.24.c:0 "Ми нічого не можемо зробити. Відкликайте гарантії!"
 BBA_italy_interaction_events.26.a:0 "Це має спонукати [AUS.GetAdjective]ий уряд до переосмислення."
 BBA_italy_interaction_events.27.a:0 "Гаразд, ми повертаємося."
 BBA_italy_interaction_events.3.a:0 "Мобілізувати альпійську дивізію!"
 BBA_italy_interaction_events.41.b:0 "Народ хоче незалежності!"
 BBA_italy_interaction_events.7.a:0 "Справді."
 BBA_italy_interaction_events_news.3.a:0 "Не дуже по-французьки..."
 BBA_italy_local_rulers.1.b:0 "Зробити $ETH_haile_selassie_gugsa$ губернатором регіону."
 BBA_italy_missiolinis.02_north.a:0 "Ми переможемо... зовсім скоро."
 BBA_italy_missiolinis.04_south.c:0 "$BBA_italy_missiolinis.02_north.c$"
 BBA_italy_missiolinis.52.desc:0 "Провальна доставка нових вантажівок для армії викликала критику промисловців, яким було доручено завдання, з боку дуче. Той скаржиться на їхню відсутність бачення ідеї. Він переконаний, що ніхто окрім нього не може справді бачити великий потенціал Італії та її народу."
 BBA_italy_missiolinis.61.a:0 "Ми мусимо запастися пальним."
 BBA_italy_missiolinis.63.desc:0 "Муссоліні повністю впевнений, що італійська армія тепер готова вести повномасштабну війну, не використавши негайно все пальне. Вище військове командування може й не так переконане в цьому, але почувається полегшено, знаючи про зібрані досі запаси."
 BBA_italy_naval_cooperation_programs.13.desc:0 "Уряд держави [FROM.GetName] дещо зарозуміло відкинув наш подарунок у вигляді двох есмінців. Безплатно. Яким же могутнім має бути їхній флот, щоб відхилити таку пропозицію!"
 BBA_italy_research_agreement.2.a:0 "Погане рішення"
 BBA_italy_second_italo_ethiopian_war.3.desc:0 "Якщо вони хочуть війни, ми їм її забезпечимо! Абіссінці відхилили нашу щедру мирну пропозицію та сповнені рішучості боротися далі. Ми покажемо цим невдячним дурням, із чого зроблений справжній італійський характер! Це лише невдача. Ми відтіснимо їх назад у гори, а потім повністю захопимо їх."
 BBA_swiss_expansion.15.a:0 "Вони лише відкладають неминуче!"
 BBA_swiss_expansion.15.desc:0 "Наші спроби об'єднати [AUS.GetNonIdeologyName] з [ROOT.GetNonIdeologyName] зазнають невдачі через дії [FROM.GetName], які ведуть кампанію на підтримку свого ганебного уряду й проти нас.\n\nПросувати Аншлюс під час цієї наклепницької кампанії буде неможливо, тож нам доведеться почекати, щоб здійснити наше славне призначення!"
 BBA_swiss_expansion.19.t:0 "[FROM.GetName] Не Дозволить [ROOT.GetNonIdeologyName] Стати Незалежною!"
 BBA_switzerland.14.t:0 "Петиція двохсот"
 BBA_switzerland.19.a:0 "Незвичайні часи вимагають незвичайних рішень"
 BBA_switzerland.2.desc:0 "Давід Франкфуртер, єврей-хорват, що мешкав у Берні, здався поліції Граубюндену та зізнався у вбивстві Вільгельма Густлоффа, очільника Закордонної організації нацистської партії у Швайцарії.\n\nВін назвав ворожу ідеологію нацистської партії щодо євреїв та роль Густлоффа у її поширенні в [SWI.GetName] причинами свого вчинку.\n\nНаше рішення у цій можливо затяжній справі буде використане [GER.GetNameDef] та рештою світу як мірило нашої відданості нейтралітету та верховенству права."
 BBA_switzerland.24.a:0 "Тривожно!"
 BBA_switzerland.3.b:0 "Він стане активом для нашої розвідки."
 BBA_switzerland.5.b:0 "Не варто втручатися в [SWI.GetAdjective] справи."
 BBA_switzerland_ger.15.tt:0 "Отримає місцевого оперативника з §Y[GER.GetAdjectiveCap]§! та §Y[SWI.GetAdjectiveCap]§! національностями"
