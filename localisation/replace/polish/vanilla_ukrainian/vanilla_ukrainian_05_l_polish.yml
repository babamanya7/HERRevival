 POR_HOL_autonomy_eu_member_ADJ:0 "Португальськ"
 POR_a_new_industry_desc:0 "Завдяки останнім технологічним досягненням в автоматизованому виробництві ми можемо продовжувати вдосконалювати та розширювати наші цивільні об'єкти, щоби досягти нових рівнів ефективності."
 POR_advanced_artillery:0 "Удосконалена артилерія"
 POR_advanced_light_aircraft_desc:0 "Координація між авіацією та іншими родами військ є життєво важливою. Розробка сучасних літаків для підтримки наших військ значно поліпшить наш успіх у битві."
 POR_appease_monarchists_desc:0 "Щоб заручитися підтримкою монархічних елементів у нашій країні, ми повинні кооптувати їх до уряду та створити враження, що відновлення монархії є можливістю для майбутнього. Ці компроміси можуть забезпечити нам стабільність і підтримку, які потрібні режиму."
 POR_atlantic_defense_strategy_desc:0 "Наші острови, ізольовані посеред океану, можна легко захопити один за іншим. Однак за належних інвестицій їх можна перетворити на непотоплювані авіаносці!"
