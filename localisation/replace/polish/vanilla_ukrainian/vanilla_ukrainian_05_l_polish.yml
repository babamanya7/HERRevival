 GER_restore_the_holy_roman_empire_desc:0 "Багато хто сумнівався, що цей день настане, але ось ми тут. Зі старими межами Імперії, ми можемо знову коронувати Імператора Священної Римської Імперії — цього разу в об’єднаній нації. Слава Імперії!"
