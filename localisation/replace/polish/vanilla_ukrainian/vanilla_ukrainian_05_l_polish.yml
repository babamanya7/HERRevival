 DESIGNER_COMBATWIDTH_DESC:0 "Ширина фронту вказує Вам, скільки місця ця дивізія займатиме в бою. Наприклад, якщо загальна ширина дорівнює §Y80§!, Ви зможете вмістити §Y4§! дивізії з шириною §Y20§!."
