 tut_last_text_1:0 "Ви пройшли основну частину навчання!\n\nЗа бажанням Ви можете продовжити грати за Італію. Прочитайте ЧаПи або проходження за Італію, якщо зіткнетеся зі складною ситуацією.\n\nКнопка допомоги (вгорі справа) дозволить переглянути ЧаПи, коли забажаєте."
