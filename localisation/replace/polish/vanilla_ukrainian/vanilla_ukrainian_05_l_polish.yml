 MEX_focus_arrest_general_cedillo:0 "Заарештувати генерала Седільйо"
 MEX_focus_caudillo_private_armies_desc:0 "Губернатори, бізнесмени та командири гарнізонів у регіоні, як правило, є однією людиною — революційним генералом, який отримує владу, призначаючи на впливові посади лояльних підлеглих. Ці каудільйо є фактом життя, який ми повинні культивувати, а не боротися з ним."
 MEX_focus_enforce_the_calles_law_desc:0 "Піхотинці крістерос, може й не були знищені на полі бою, але в роки після їх марного повстання ми полювали на їхніх лідерів і прихильників, які залишилися в Церкві, обезголовивши їхній рух і не давши відродитися. Церква не має іншого вибору, як прийняти наші вимоги проти них. Вони стануть ще одним інструментом державної влади, або ми продовжимо їх обезголовлювати."
 MEX_focus_fortify_the_canal_desc:0 "Коли Панамський канал нарешті в наших руках, ми повинні захистити його шлюзи та береги, щоб він став неприступною фортецею."
 MEX_focus_gulf_coast_naval_yards:0 "Верфі узбережжя Мексиканської затоки"
 MEX_focus_military_aviation_specialists:0 "Спеціалісти з військової авіації"
 MEX_focus_purchase_belize_desc:0 "На цю невелику територію довгий час претендувала іспанська корона в колоніальні часи, хоча вона ніколи не була заселена півостровами. Після втрати колоніальної імперії Іспанії під час наполеонівських воєн Британія поступово зміцнила контроль над територією, кульмінацією чого стало створення колонії Британського Гондурасу в 1862 році. Територія повинна бути передана Мексиці як жест доброї волі."
 MEX_focus_rewrite_the_constitution_desc:0 "Конституція, написана злісними генералами, ставить державу вище Церкви, роблячи шлюб цивільним актом, не дозволяючи духовенству підтримувати політичних кандидатів і відмовляючись визнавати Католицьку Церкву як джерело морального авторитету в Мексиці. Ми повинні усунути ці невідповідності шляхом офіційного встановлення католицької віри як державної релігії."
 MEX_focus_social_catholicism_desc:0 "Доктрина політичної релігії, що бере свій початок з початку 1900-х років, соціал-католицизм наголошує на полегшенні тягаря бідних, атакуючи причини бідності. Несправедливість, спричинена необмеженим промисловим капіталізмом, потребує послідовної відповіді з боку Церкви, і прогресивне духовенство Мексики зробить усе можливе, щоб її вирішити."
 MEX_focus_soldaderas_desc:0 "Знакова частина Революції: жінки-солдати воювали рядовими, а деякі отримали посади молодшого офіцера. Вони були особливо важливі для матеріально-технічного забезпечення погано забезпечених революційних армій."
