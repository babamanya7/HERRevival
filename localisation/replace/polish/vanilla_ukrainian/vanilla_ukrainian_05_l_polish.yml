 coalition_of_liberty_faction:0 "Коаліція свободи"
 collaboration_government_set_up_planning_committees_desc:0 "Наша команда зустрінеться з політиками, що симпатизують нам, і обговорить формування нового уряду, який буде керувати державою [From.GetNameDef], коли ми її захопимо, а також створить невеликі робочі групи, які займуться деталями."
 comintern_siberiainmyheart:0 "Сибір у моєму серці"
 communist_pressure:0 "Тиск із боку комуністів"
 confirm_cancel_national_focus:0 "Скасувати національний фокус"
 conglomerate:0 "Конгломерат"
 congo_independence_struggle.17.b:0 "Вони помиляються. Організуйте експедиційну силу для відновлення порядку негайно!"
 congo_independence_struggle.6.b:0 "Тоді не буде жодних переговорів"
 constraining_hierarchy_spirit_desc:0 "Якщо Ви постійно не будете уважно стежити за тим, де знаходяться ваші підлеглі, хтось може їх у Вас вкрасти."
 control_cyprus_goal_name:0 "Контролювати Кіпр"
