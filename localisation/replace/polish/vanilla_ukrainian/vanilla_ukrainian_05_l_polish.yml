 GER_the_eastern_threat:0 "Східна загроза"
 GER_the_mannheim_project_desc:0 "Оскільки ми контролюємо виробництво важкої води в Норвеґії, то можемо з подвоєною силою зайнятися пошуками секрету розщеплення атома, щоб отримати нову зброю проти [GER.GetDanzigGuaranteesBolsheviksDesc]."
