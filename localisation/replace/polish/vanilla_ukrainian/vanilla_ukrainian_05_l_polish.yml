 295_autenticite_name:0 "Кіншаса"
 594_nanning_points:0 "([?594.state_political_support_value|+0]) "
 AAT_Sweden.26.b:0 "Ми не можемо дозволити собі таку ганьбу."
 AAT_Sweden.34.b:0 "Це те, що ми не можемо собі дозволити."
 AAT_Sweden.39.t:0 "$AAT_Sweden.38.t$"
 AAT_Sweden.42.a:0 "Вони стануть нашими."
 AAT_Sweden.5.desc:0 "Леннарта Янссона знайшли сьогодні, коли той переховувався в кущах неподалік від Ріксдаґу. Коли його помітили, він наполягав на тому, що насправді не ховався в кущах, а милувався особливо гарним сонечком. Потім він швидко попрямував до Ріксдаґу.\nПрипускають, що він дійсно сховався в кущах, бажаючи уникнути політичного антагоніста, якого бачили за кілька секунд до того, як він увійшов на подальші дебати з прем'єр-міністром."
 AAT_Sweden.6.t:0 "Скандал через сьорбання"
 AAT_Sweden_BoP.14.a:0 "Електорат висловив своє бажання."
 AAT_Sweden_ball_bearing.8.a:0 "Чи було це неминуче?"
 AAT_Sweden_communism.3.a:0 "Хтось з вищих офіцерів замішаний у цьому."
 AAT_Sweden_communism.6.desc:0 "У наші часи дивно є досі чіплятися за монархію, особливо за монархію без влади. Тим не менш, старий король продовжує пхати свого носа в політику, незважаючи на численні попередження про недоречність та неконституційність його поведінки. Гірше того, він дедалі більше зближується з правими радикальними силами політичного спектру, прагнучи колишньої величі монархічної. Не таким має бути майбутнє суспільства, і ми вже давно пережили потребу в монархії; настав час відібрати їхні активи на благо народу та дозволити їм жити як нормальні люди."
 AAT_Sweden_flashpoints.14.a:0 "Це обурлива позиція. Ми змусимо їх страждати."
 AAT_Sweden_flashpoints.17.desc:0 "Спроба держави [SWE.GetName] заплямувати нашу репутацію через бомбардування Паяли провалилася, і тепер вони відкрито озброюють [FIN.GetAdjective]их військових піхотним спорядженням. Це очевидна спроба шантажувати нас, щоби ми взяли на себе відповідальність за атаку або ризикнули життям ще більшої кількості радянських солдатів.\n\nМи мусимо ретельно прорахувати наш наступний крок, щоб не допустити повного втягування [SWE.GetAdjective]их сил у війну як [FIN.GetAdjective]ого союзника."
 AAT_Sweden_flashpoints.21.desc:0 "У зв'язку з нещодавньою ескалацією напруженості між державами [SWE.GetNameDef] і [SOV.GetNameDef], що переросла у відкритий конфлікт, дипломати пропонують нам звернутися до їхніх колег з [FIN.GetAdjective]ого уряду та створити військовий альянс проти нашого спільного ворога."
 AAT_Sweden_flashpoints.34.a:0 "Починайте підготовку до нападу на [SWE.GetName] та надішліть їм ультиматум."
 AAT_Sweden_flashpoints.72.b:0 "Ми не можемо ризикувати війною з державою [ENG.GetNameDef]."
 AAT_Sweden_nationalists.9.a:0 "Просфпілки будуть знищені."
