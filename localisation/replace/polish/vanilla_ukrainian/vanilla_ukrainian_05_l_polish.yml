 AIR_SUPERIORITY_BAR_EXPLANATION:0 "Кожний тип авіакрила має визначену величину переваги. Воно позначає, наскільки ефективно авіакрило здобуває перевагу в повітрі. Сила переваги в регіоні походить від усіх Ваших (і союзних Вам) активних авіакрил у цьому регіоні. Чим більше авіакрил, тим вища величина, але зауважте, що воно також зменшується з низьким покриттям регіону. Тому пам'ятайте про перебазування своїх авіакрил, щоб отримати найбільш оптимальне покриття."
