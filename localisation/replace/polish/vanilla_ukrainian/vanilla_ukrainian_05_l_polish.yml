 BEL_establish_research_sharing_group_decision:0 "Заснувати група обміну дослідженнями"
 BEL_fascism_vnv:0 "ФНС"
 BEL_fighter_equipment_0:0 "Avions Fairey Firefly"
 BEL_gold_reserves_dynamic_modifier:0 "[BEL.GetAdjective] Золоті резерви"
 BEL_iron_wall:0 "Залізна стіна"
 BEL_junior_officer_training_desc:0 "Гідний офіцер надихає своїх солдатів боротися всупереч труднощам, але може бути сліпим до безнадійної ситуації. Добрий лідер правильно визначить безнадійність ситуації, але зробить все можливе, щоб з неї вибратися. Великий лідер матиме план, щоб вирватися з цієї ситуації і атакувати з кращої позиції. Ми будемо визначати і тренувати наших офіцерів, щоб вони стали найкращими."
 BEL_lack_of_junior_officers_ns_desc:0 "Швидка мобілізація наших сил загалом просувалася добре, за винятком однієї проблеми: нестачі молодших офіцерів для організації новобранців! Потрібен певний час, щоб військова ієрархія перебудувалася."
 BEL_mobilize_the_nation_dynamic_modifier_desc:0 "Наш народ — наш найцінніший ресурс. Давайте мобілізуємо їх для створення найбільшої можливості сили."
 BEL_national_redoubt_at_antwerp_bypass_tt:0 "$TRIGGER_AND_STARTS$:\n 1 §Y$bunker$§! не може бути побудований у місті Брюссель\n 2 §Y$bunker$и§! не може бути побудований у місті Антверпен"
 BEL_port_of_antwerp_desc:0 "Антверпен — місто, яке славиться своєю торговою історією, і його порт залишається важливим і до сьогодні. Давайте використаємо цю репутацію для укладання вигідних торгових угод."
