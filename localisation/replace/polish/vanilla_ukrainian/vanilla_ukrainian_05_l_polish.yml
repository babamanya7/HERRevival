 CHI_a_popular_movement_desc:0 "Нова глава нашої історії вимагає нової організації. Усі знатимуть, що ми як народ — це хвиля, що омиває старе суспільство, роблячи кожного члена частиною цього великого цілого."
 CHI_ally_the_young_china_party_desc:0 "Молодокитайська партія була заснована групою китайських студентів у Парижі 2 грудня 1923 року і була найпомітнішим меншим рухом у країні після Ґоміньдану та КПК. Вони мають гарні ідеї для нашого майбутнього, які ми не можемо просто ігнорувати. Ми повинні негайно укласти з ними союз!"
 CHI_anti_imperialism:0 "Антиімперіалізм"
 CHI_apply_yandas_work_desc:0 "Ден завжди хотів мобілізувати маси та дати сільському населенню альтернативу. Поширення цього слова від села до села зміцнить нашу організацію та країну в цілому."
 CHI_appoint_sympathetic_judges_desc:0 "Маючи суддів на ключових посадах, ми зможемо розширити нашу владу вниз і назовні, аж до провінцій."
 CHI_ban_immoral_entertainment:0 "Заборонити аморальні розваги"
