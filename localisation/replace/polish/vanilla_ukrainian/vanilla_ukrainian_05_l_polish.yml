 ARG_support_the_farmers_decisions_desc:0 "Оскільки ми встановлюємо стандарт рівності для всіх у нашій новій комуністичній державі, дуже важливо не забувати про пролетаріат, який довго і наполегливо працював на полях [ARG.GetAdjective]их ферм. Нам слід спрямувати гроші на підтримку фермерів, щоби забезпечити їм такі ж шанси на хорошу якість життя, як і тим, хто живе в містах."
