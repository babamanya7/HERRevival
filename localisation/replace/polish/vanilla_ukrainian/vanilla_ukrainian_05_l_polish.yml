 INS_heavy_fighter_equipment_1_short:0 "G.I Hispano"
 INS_henri_winkelman_tt:0 "Переведення Анрі Вінкельмана відхилено"
 INS_industrial_events.36.desc:0 "Танкери покинули наші нафтопереробні заводи, їхні трюми прямують до портів покупця. Компенсація узгоджена і буде отримана в повному обсязі, хоча тягар продажу тиснутиме на нашу економіку ще два роки. Такі умови пропонує нам світ у ці важкі роки."
 INS_just_a_fisherman_desc:0 "Вести війну на архіпелазі без флоту — це складне завдання, і ми не зможемо довго його підтримувати. Ми спробуємо, можливо, наївну стратегію, за якою ми відправимо ополченців на рибальських човнах, замаскованих під рибалок, до портів, які контролюються голландцями."
 INS_limited_war_events.1.b:0 "Чудовий день для Республіки."
 INS_limited_war_events.2.t:0 "Контрудар [FROM.GetAdjective]"
 INS_loans_timer:0 "\nЧерез §Y365§! днів:"
 INS_loot_knil_weapons_caches_desc:0 "Є багато схованок зі зброєю, які KNIL заклав до революції. Багато наших членів є колишніми членами KNIL, і ми, можливо, зможемо знайти та пограбувати ці схованки."
 INS_loyalist_events.13.desc:0 "Уряд [FROM.GetAdjective] звернувся до нас із пропозицією щодо Сінгапуру. Вони вимагають суверенітету над островом, посилаючись на його місце в малайському світі. Натомість вони готові гарантувати наш постійний доступ до порту, його військових об'єктів і всіх прав на видобуток ресурсів, що діють наразі."
 INS_loyalist_events.16.t:0 "[FROM.GetNameDefCap] вимагає передачі Цейлону"
 INS_loyalist_events.29.desc:0 "[FROM.FROM.GetNameDefCap] запропонували об'єднання наших двох націй на основі спільної австронезійської спадщини. Наш сюзерен дав їм дозвіл провести референдум з цього питання, і агітатори [FROM.FROM.GetAdjective] вже почали прибувати. Результат визначить, чи наша республіка приєднається до [FROM.FROM.GetNameDef], чи продовжить своє існування в нинішньому статусі."
