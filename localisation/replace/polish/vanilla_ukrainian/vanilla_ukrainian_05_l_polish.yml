 CZE_heavy_fighter_equipment_2:0 "Beneš-Mráz Be-87"
 CZE_integrate_hungary_desc:0 "Тепер, коли ми встановили значну сферу впливу, інтеграція нещодавно розширеної Угорщини та інших територій могла б призвести до відновлення австро-угорських кордонів, але під [ROOT.GetAdjective]им керівництвом."
