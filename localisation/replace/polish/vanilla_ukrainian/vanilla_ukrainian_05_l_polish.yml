 siam.37.desc:0 "Після наших вимог [JAP.GetNameDef] погодилася почати виплату економічних витрат за домовленістю про друк грошей. Компенсація не повністю скасує тягар, покладений на наш народ, але принесе певне полегшення скарбниці."
 siam.4.desc:0 "Рано вранці за допомогою Королівської тайської поліції уряд заарештував ще 51 підозрюваних та симпатиків, включаючи принца Рангсіта, Прая Тепахатсадіна та Прая Удом Понгпенсавада. Їх звинувачують у змові з Прая Сонгсурадетом проти держави, причому особливо відзначається, що Рангсіт, член королівської родини, має постати перед судом. Деякі оглядачі гадають, чи не був принц спеціальною ціллю, щоб подати сигнал решті роялістів у [THIS.GetName]: поводьтеся тихо або падете."
