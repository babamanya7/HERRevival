 MTG_naval_treaty.8.t:0 "Кінець Лондонського морського договору"
 MTG_treaty_reduction_mission:0 "Реалізувати план з морського роззброєння"
 MTG_treaty_reduction_signatory_mission_desc:0 "Нам, як учасникам морської угоди, дозволено мати певну кількість основних кораблів. Зараз вона перевищена, і люди починають задаватися питанням — чи так ми віддані ідеям міжнародного обмеження озброєнь, як говоримо?"
 MUN_czech.1011.t:0 "[FROM.GetName] пропонує договір про захист"
 MUN_czech.1024.c:0 "Це не підлягає обговоренню!"
 MUN_czech.1031.b:0 "Наші розбіжності занадто великі"
 MUN_czech.1034.c_tt:0 "§RМи будемо повністю залежати від рішення [GER.GetNameDef] щодо долі Чехословаччини.§!"
 MUN_czech.1041.d:0 "Посилаючись на те, що цей договір може зашкодити їхній економіці, [From.getname] відхилила підписання договору про митний союз між нашими країнами. Ці причини здаються безпідставними та надуманими відмовками."
 MUN_czech.1045.a:0 "Відмінно"
 MUN_czech.1051.d:0 "Наш новий союзник, [FROM.GetNameDef], висловив зацікавленість у розширенні свого впливу за межі власних кордонів. Відповідно, [FROM.GetAdjective]і представники прибули, щоб заручитися дозволом і підтримкою цієї експансії, під час якої має бути встановлено чітку межу між територіями під [ROOT.GetAdjective]им та [FROM.GetAdjective]им впливом."
 MUN_czech.1053.t:0 "[FROM.GetName] тисне на нас [HUN.GetAdjective]ими претензіями"
 MUN_czech.2.d.1:0 "У світлі нещодавніх новин про наші плани щодо Чехії, багато судетських політичних партій швидко сформували воєнізовані загони по всьому регіону в надії підірвати [CZE.GetAdjective]ий уряд. Тепер вони просять нашої підтримки у здійсненні транскордонних рейдів та актів саботажу, щоб допомогти нашим зусиллям проти [CZE.GetAdjective]ого війська."
 MUN_czech.3.d:0 "На тлі нещодавньої зацікавленості [FROM.GetAdjective]ого уряду в анексії Судетської області, воєнізовані формування почали вступати в сутички з нами. Вони атакують урядові будівлі та підривають нашу оборону в кількох районах. Якщо ми хочемо покращити нашу військову ситуацію в регіоні, нам потрібно розібратися з цими воєнізованими угрупованнями."
 MUN_czech.5.d:0 "Масарик був стабілізуючою фігурою в чехословацькій політиці понад два десятиліття. Коли здавалося, що коаліції створити неможливо, а політичні глухі кути непереборні, Масарик раз за разом творив політичні дива, допомагаючи зміцнювати і розвивати Чехословаччину до її нинішнього стану. Його присутності дуже бракуватиме, і це відчуватиме вся нація."
 MUN_czech_bop.4.d:0 "[ETH.getname] встановила контакт із представниками виробника зброї $CZE_zbrojovka_brno_organization$ і зацікавлена в контрабанді нашої зброї до своєї країни. Попри санкції Ліги Націй проти [ETH.GetAdjective]ого уряду, $CZE_zbrojovka_brno_organization$ готова піти на цю схему. Порушення мандату Ліги Націй виявиться непопулярним на міжнародній арені, якщо нас упіймають."
 MUN_slovakia_little_war.1.a:0 "Відмінна робота."
 MUN_slovakia_little_war.1.d:0 "Наша армія добре проявила себе в регіоні [71.Getname], розгромивши сили противника в цьому районі. Наші командири отримали безцінну інформацію та уроки з цієї битви, які вони зможуть використати в майбутньому."
