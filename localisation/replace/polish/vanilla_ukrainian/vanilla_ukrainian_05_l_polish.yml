 sp_armored_maintenance_tech_desc:0 "Використання броньованих евакуаційних машин дозволяє нашому технічному персоналу евакуювати та ремонтувати всі види обладнання, забезпечуючи максимальну бойову готовність на полі бою."
 sp_land_generic_reward_scientist_xp_1_desc:0 "[Character.GetName] досягає прориву, прискорюючи прогрес і закріплюючи за собою роль першопрохідця у створенні передового озброєння. З кожним відкриттям [Character.GetHerHis] інженерна майстерність зростає, формуючи майбутнє військових технологій."
 sp_land_generic_reward_test_failure_1_desc:0 "Під час випробувань сталася незначна невдача, яка виявила неочікувані вади в прототипі [Character.GetName]. Ця прикрість змушує переглянути підхід і вдосконалити методи. Попри тимчасову затримку, здобутий досвід у довгостроковій перспективі зробить проєкт надійнішим і стійкішим."
 sp_land_multi_charge_large_caliber_gun:0 "Багатозарядна великокаліберна гармата"
 sp_land_reward_land_cruiser_chassis_desc:0 "Під час стрес-тестування проєкту «[SpecialProject.GetName]» було виявлено, що його шасі не здатне витримати величезну вагу, викликаючи структурні деформації. Команда проєктувальників розділилася в думках, чи варто додавати додаткове посилення, яке ще більше збільшить вагу автомобіля, або ж використовувати легші матеріали, що цілком може поставити під загрозу міцність."
 sp_land_reward_option_land_cruiser_communication_current:0 "Залишити поточну систему"
 sp_land_reward_option_land_cruiser_track_reduce_armor:0 "Зменшити броньоване покриття"
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "Гармата проєкту «[SpecialProject.GetName]» щойно успішно завершила знакові випробувальні стрільби, продемонструвавши вражаючу дальність і точність. Це досягнення підняло бойовий дух дослідницької групи та привернуло увагу вищого керівництва, надавши проєкту нового імпульсу та оптимізму щодо його успіху."
