 AST_supply_arms_to_nation_desc:0 "Ми постачатимемо зброю нашим товаришам"
 AST_support_the_policy_of_appeasement:0 "Підтримати політику умиротворення"
 AST_the_irish_anti-britain_pact:0 "Ірландський антибританський пакт"
 AST_uap_candidate_text:0 "§YПартія об'єднаної Австралії§!\n[AST_GET_UAP_LEADER_TEXT]\n\n§LСтабільність вдома, Сила в усій Імперії§!\n\n[GET_AST_UAP_RULING]"
 AST_unratified_westminster_act_idea_desc:0 "Вестмінстерський статут було прийнято в 1931 році, що дозволило самоврядним домініонам Сполученого Королівства підвищити свій суверенітет. Якщо ми ратифікуємо його, британський парламент не зможе впливати на більшість наших законів."
 AST_war_on_japan:0 "Війна з Японією"
 AST_war_plan_japan:0 "Військовий план «Японія»"
 AST_weekly_stability_tt:0 "Щотижнева стабільність: §G+1.00%§!"
 AST_you_can_switch_sf:0 "Ви зможете перемикатися між спеціалізаціями."
 ASY_communism_party_long:0 "Ассирійська соціалістична партія"
 AT_LEAST_100_MILS_CIVS:0 "§YКожен член альянсу§! із принаймні §Y100 $arms_factory_pl_gen$§!"
 AUS_VICTORY_POINTS_11659:0 "Дебрецін"
 AUS_a_new_beginning_desc:0 "\"Поки попіл і пил осідають, а наш новий уряд займає належне йому місце, ми повинні звернути увагу на питання майбутнього. Це лише початок для нової Австрії, і разом ми досягнемо небес!\""
 AUS_aerial_strategies_desc:0 "Навчання на власному досвіді є чеснотою в битвах усіх видів. Постійно розвиваючи та вдосконалюючи наші повітряні стратегії, ми можемо гарантувати, що ми завжди будемо на крок попереду ворога."
 AUS_anschluss_risk_low_tt_NOT:0 "Ризик аншлюсу на даний момент не §GНизький§!."
 AUS_autobahn_west_desc:0 "Наша інфраструктура потребує оновлення, незважаючи на те, що ми б хотіли зміцнити її по всій країні, реалії нашої економіки та промислової ситуації не дозволяють цього. Будівництво на захід і з’єднання нашого автобану з німецьким є одним із, якщо не найкращим, вибором у нашій поточній ситуації."
 AUS_bring_hungary_back_into_the_fold_tt:0 "Відкриває сукупність рішень для §YАнексії старих Земель§! та окремі рішення для §Yпідвищення вірогідності мирного результату§!."
 AUS_cisleithania_neutrality_DEF:0 "Королівства та землі, представлені в Райхсраті"
 AUS_currently_industrially_coaxing_faction_member_flag:0 "Зараз здійснюється промислова допомога союзнику"
 AUS_domestic_air_production_large:0 "Вітчизняне виробництво важкої авіації"
 AUS_ernst_fischer:0 "Ернст Фішер"
 AUS_fascist_writer:0 "Письменник-фашист"
 AUS_fortify_the_traun_line_tt:0 "Буде збудовано 3-ій рівень §YНаземних укріплень§! уздовж німецького кордону від Лінцу до Зальцбурґу в провінціях, де для цих є місце."
 AUS_graf_und_stift_initial_mio_trait_speed_focused_organization:0 "Виробник швидкісного автотранспорту"
 AUS_has_no_air_partners:0 "Незважаючи на всі наші зусилля, нам не вдалося знайти партнерів у наших повітряних зусиллях. У нас нема іншого вибору, окрім як інвестувати у власні дослідження."
 AUS_invest_in_semperit_synthetics_desc:0 "З нашим запасом сталі відсортовано. Тепер нам потрібно розглянути інші ресурси, які нам можуть знадобитися для нашого майбутнього розвитку. Через брак хорошого та досить великого джерела каучуку та нафти нам потрібно шукати інші шляхи отримання цих ресурсів на місцевому рівні."
 AUS_julius_raab:0 "Юліус Рааб"
 AUS_kept_creditanstalt_bankverein_flag:0 "Залишив Creditanstalt-Bankverein об'єднаним"
 AUS_meddling_with_our_politics:0 "Втручання в нашу політику"
 AUS_osterreichische_bundesheer_desc:0 "Оскільки Сен-Жерменський Договір більше не перешкоджає нам, настав час почати належне відновлення. Не можна дозволити, щоб Австрія була застигнута зненацька, як і не слід очікувати, що ми просто смиренно чекатимемо перед дедалі більш загрозливим світом."
 AUS_osterreichische_gebirgsjager_desc:0 "Як майже повністю гірська країна, у наших інтересах є забезпечення того, щоб наші війська були достатньо підготовлені для битв у цих умовах і середовищі."
 AUS_otto_von_habsburg_has_joined_austria_flag:0 "Отто фон Габсбург повернувся до Австрії"
 AUS_phonix_fleugzeugwerke_organization:0 "Phönix Fleugzeugwerke"
 AUS_political_events.104.c:0 "Елізабет..?"
 AUS_political_events.106.a:0 "Тепер клятий Райх пожалкує про свої дії!"
 AUS_political_events.107.a:0 "Ми врятуємо їх!!"
 AUS_political_events.116.desc:0 "Сьогодні до свого кінця підійшли спільні [ROOT.GetAdjective]о-[FROM.GetAdjective]і військові навчання, від яких наша армія отримала велику користь. І ми будемо вірити, що [FROM.GetNameDef] також. Якщо ближче ознайомитися з діяльністю [FROM.GetAdjective]ої армії, то ми також зможемо отримати гарний огляд того, з чим нам потрібно буде працювати, коли наші плани щодо їхнього майбутнього реалізуються."
 AUS_political_events.118.desc:0 "Оскільки ми вступили на шлях відновлення нашої імперії, перед нами знову постало питання про те, як саме ми хочемо її організувати. Наші попередники зазнали невдачі в цьому питанні, що хоч і призвело до появи великої, але неорганізованої імперії. Нам запропоновано сформувати альянс, щоб гарантувати, що наші васали не тільки залишаться вірними нам, але й також утримаються від сварок між собою."
 AUS_political_events.120.t:0 "[FROM.GetNameDefCap] підкоряється нашим вимогам"
 AUS_political_events.15.c:0 "Ми зараз не маємо на це часу!"
 AUS_political_events.16.a_tt:0 "Ставить §YАртура Зейсса-Інкварта§! політичним радником. Його §Rне можна буде прибрати§!\n"
 AUS_political_events.17.t:0 "[FROM.GetNameDefCap] протестує проти нашої заборони НСРП"
 AUS_political_events.2.t:0 "Страховий скандал з Phönix"
 AUS_political_events.20.t:0 "[FROM.GetNameDefCap] шукає нашої підтримки"
 AUS_political_events.25.desc:0 "[FROM.GetNameDefCap] відповіла на нашу вимогу відкликати свої претензії на нашій території, підкорившись цим вимогам. Вони повністю скасували ідею повернути ці території в обмін на нашу підтримку."
 AUS_political_events.38.t:0 "[FROM.GetNameDefCap] відкидає наші вимоги"
 AUS_political_events.44.desc:0 "Відповідь на наші вимоги до держави [FROM.GetNameDef] виявилась найкращою ніж тільки можна було очікувати. Вони передадуть [Get44PuppetOrNotDesc]. Це означає ще один крок для нас у наших зусиллях відновлення нашої імперії!"
 AUS_political_events.45.t:0 "[FROM.GetNameDefCap] відхиляє наші вимоги"
 AUS_political_events.49.a:0 "Ладно, вони можуть забрати її."
 AUS_political_events.59.b:0 "Це їх вибір."
 AUS_political_events.68.a:0 "Вони — загроза для єдності усієї федерації!"
 AUS_political_events.73.desc:0 "\nНепохитні у своїх зусиллях отримати дозвіл на переозброєння, [FROM.GetAdjective]ий уряд знову звернулися до нас, запропонувавши переглянутий та менш суворий договір, який принаймні дозволив би нам контролювати темпи, з якими вони переозброюються. Такий перегляд дозволить їм розпочати навчання військ, але їхня галузь все одно буде обмежена ще на один рік."
 AUS_political_events.75.desc:0 "Не дивлячись на наші зусилля, гаранти непохитні. Нам не дозволили переозброюватися ні за яких обставин. Наші дипломатичні спроби переконати їх і знайти компромісу не були почуті. Наше наслення відчуває сильну неприязнь до ганебних грантів."
 AUS_political_events.90.t:0 "Результати наших виборів"
 AUS_political_events.96.b:0 "Їм не можна довіряти."
 AUS_protector_of_austrian_independence:0 "Захисник австрійської незалежності"
 AUS_radar_effort_desc:0 "Сучасні ВПС залежать не лише від своїх літаків, а й від сучасних технологій, впроваджених до них. Дослідивши радар, ми просто не зможемо дозволити собі технологічно відстати!"
 AUS_reclaim_habsburg_desc:0 "Наша власна Батьківщина все ще не під нашим контролем. Габсбурґи не забули свій скромний початок у селі Габсбурґ. Їх вважали низькими дворянами, але не зараз. Тепер, все змінилося. Настав час повертати собі Батьківщину."
 AUS_reinstate_the_imperial_council_desc:0 "Наш народ, як і очікувалося, висловлює бажання повернутися до старих часів. Нам більше не потрібна явно хибна система, якою можна було б зловживати, як це зробили фашисти під час самоліквідації парламенту в 1934 році. Правило єдиної особи завжди було безпечною системою, яка добре сприймалася в подвійній монархії, настав час повернути її."
 AUS_reintegrate_FROM_italy_decision:0 "Реінтегрувати [FROM.GetName]"
