 FIN_towards_a_red_government_desc:0 "Коли хвиля робітничої революції охопила країну в 1918 році, пролетаріат був зраджений реакційними силами Маннергейма та його німецьких союзників. Настав час помститися нашим загиблим товаришам і нарешті створити робітничу республіку, яку ми завжди мали на увазі. до."
