 INSHOL_begin_negotiations_soetardjo_desc:0 "Петиція Сутарджо щодо автономії є багатообіцяючою, даючи нам можливість знайти компроміс між націоналістами та лоялістами. Ми маємо розпочати офіційні переговори з його партією."
 INSHOL_coffee_plantations_desc:0 "Ми повинні зосередитися на отриманні більшої кількості державних земель на східних островах. Ми зможемо використати цю землю для створення кавових плантацій."
 INSHOL_develop_fighters:0 "Розробка нових винищувачів"
 INSHOL_east_indies_student_exchange:0 "Програма студентського обміну з Ост-Індією"
 INSHOL_eastern_conscription:0 "Сформувати допоміжний корпус"
 INSHOL_flag_will_fly_again_tt:0 "§YПісля закінчення революції дух буде видалено, а зміни правил скасовано.§!"
 INSHOL_increase_esclation_placeholder_desc:0 "Наші ополченці взяли під контроль багато життєво важливих портів, міст і промислових центрів. Ми не будемо продовжувати чекати дій Нідерландів, ми самі закличемо до великого військового наступу!"
 INSHOL_netherlands_in_exile:0 "Нідерланди в екзилі"
 INSHOL_rangers_desc:0 "Ост-Індія — це величезний архіпелаг з різноманітним середовищем. Ми повинні підготувати рейнджерів, адаптованих до бойових дій у цих суворих умовах, щоб гарантувати нашу готовність до їхнього захисту."
 INSHOL_request_economic_dev_subsidy:0 "Запит на субсидії для економічного розвитку"
 INSHOL_rubber_taxation_desc:0 "Голландські інвестиції та досвід перетворили каучукові плантації Ост-Індії на один із найцінніших активів Імперії. Цілком справедливо, що Корона вимагає свою законну частку від багатства, яке вона створила. Хоча деякі місцеві політики протестують, інтереси Імперії не можуть диктуватися провінційним хвилюванням."
