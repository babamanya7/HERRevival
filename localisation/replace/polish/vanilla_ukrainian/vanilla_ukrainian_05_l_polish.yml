 MAN_tsr_proclaim_the_peoples_republic_desc:0 "Коли головні столиці Китаю опинилися під нашим контролем, настав час проголосити утворення Китайської Народної Республіки. В очах світових держав ми більше не будемо неорганізованою територією на периферії, якою керують бандити та інші злочинці, а станемо повноцінною державою!"
 MAN_tsr_raise_the_yong_ying:0 "Сформувати Юн Ін"
 MAN_tsr_research_cooperation_desc:0 "Наразі бракує фактичної комунікації між різними територіями, зайнятими нашою партією. Тому ми повинні координувати наші дослідницькі зусилля в рамках КПК, щоб гарантувати, що жодна частина не відстане."
