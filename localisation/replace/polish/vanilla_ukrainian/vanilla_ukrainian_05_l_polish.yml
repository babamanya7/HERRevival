 CONGO_congos_place_in_the_world_desc:0 "Шлях до цього моменту був сповнений поворотів та непередбачуваних ситуацій, але тепер час для Конґо зайняти своє місце в світі. Наскільки сильно вплине минуле на наше майбутнє? Тепер час для прийняття рішення."
 CONGO_expand_matadi_seaport_desc:0 "Матаді є основним морським портом, що обслуговує Леопольдвіль, і є воротами до внутрішніх районів континенту через численні річки. Нам слід розширити морські об'єкти в цьому місці відповідно до його зростаючої важливості."
 CONGO_expand_ndolo_and_elisabethville_airports:0 "Розширити аеропорти Н'Доло та Елізабетвіль"
 CONGO_interfaith_school_subsidies_desc:0 "Вже є кілька католицьких місіонерських шкіл по всій країні, однак, якщо ми дійсно хочемо недорого підвищити рівень освіти населення, нам потрібно заохочувати більше організацій працювати на наших теренах."
