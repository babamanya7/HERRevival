 NSB_soviet_civil_war_common.116.a:0 "Добре"
 NSB_soviet_civil_war_common.117.t:0 "[FROM.GetNameDef] не підтримує нас"
 NSB_soviet_civil_war_common.124.a:0 "Добре"
 NSB_soviet_communist_civil_war.001.c:0 "Нам потрібен хтось із військовим досвідом."
 NSB_soviet_communist_civil_war.002.t:0 "Берія схоплений армією."
 NSB_soviet_fascist_tsarist.14.t:0 "Повернення царя"
 NSB_soviet_fascist_tsarist.21.a:0 "Принаймні, у нас є росіяни."
 NSB_soviet_for_the_common_good.1.a:0 "Заради загального блага!"
 NSB_soviet_foreign_politics_events.154.desc:0 "[FROM.GetAdjectiveCap]ий посол доставив нам ноту, в якій держава [FROM.GetNameDef] погоджується організувати та провести спільну військову операцію проти держави [PER.GetNameDef]. Як [ROOT.GetAdject [FROM.GetAdjective] командування переконані, що це буде швидка та ефективна операція проти ворога, що поступається нам у технологіях та чисельності, і що ці дії дозволять нам захопити іранські нафтові родовища та отримати [FROM.GetAdjective] шляхи постачання до держави [ROOT.GetNameDef], не давши при цьому можливому супротивнику просунутися з держави [TUR.GetNameDef] до держави [PER.GetName] до бакинської нафти та держави [RAJ.GetNameDef]."
 NSB_soviet_foreign_politics_events.270.desc:0 "Російська Транскаспійська залізниця проходить через Середню Азію і завершується на сході в Ташкенті. [FROM.GetAdjective] уряд тепер має намір розширити її і відправляє пропозицію з'єднати дорогу з нашого столу., що \"[FROM.GetAdjectiveCap]ий представники зацікавлені в синьцзянському ринку. Вони стверджують, що це може стати першим кроком на взаємовигідному шляху розвитку та обміну."
 NSB_soviet_great_patriotic_war.01.t:0 "Микола Іванович Кузнєцов просить призначення"
 NSB_soviet_paranoia_system_events.40.t:0 "Рутинна чистка ВПС"
 NSB_soviet_policies_of_collective_security.13.desc:0 "Тепер, коли питання з державою [POL.GetNonIdeologyName] вирішено, [FROM.GetAdjective] уряд готовий формально ратифікувати договір із спочатку прийнятими умовами."
 NSB_soviet_policies_of_collective_security.5.desc:0 "Наші спроби переконати [FROM.GetAdjective] делегацію в необхідності включити державу [POL.GetNonIdeologyName] до складу пакту успіху не отримали.\n\nСпіврозмовники заявили, що справа держави[POL. до обговорюваного договору, і недвозначно відмовилися обговорювати його надалі."
 NSB_soviet_policies_of_collective_security.6.desc:0 "Після додаткового раунду переговорів [FROM.GetAdjective] делегація погодилася включити державу [POL.GetNonIdeologyName] до складу пакту. Щойно буде узгоджено всі деталі, ми відправимо з повідомленням пакту на тих самих умовах, що і ми."
 NSB_soviet_propaganda_capmaign_events.2.t:0 "Обіцянка миру порушена"
