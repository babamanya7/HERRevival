 GRE_heavy_investment_desc:0 "Ми зробили вагомі інвестиції в економіку держави [GRE.GetNameDef]."
 GRE_light_tank_equipment_3:0 "PKD Hermes I"
 GRE_nationalized_banks:0 "Націоналізовані банки"
 GRE_political_instability_desc:0 "§W£faction_gre_monarchist §YМонархісти§!: [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §YРеспубліканці§!: [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §YКомуністи§!: [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §YФашисти§!: [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]\n\nЗ 1924 до 1935 року в нас сталися двадцять три зміни уряду, тринадцять переворотів і ще й диктатура! Народ втомився й готовий до якоїсь стабільності у своєму уряді, але також залишається обачно скептичний до довготривалості абиякого уряду. Ми мусимо довести їм зворотне та покінчити з постійною внутрішньою боротьбою, поставивши наших політичниз суперників навколішки."
 GRE_political_instability_republican:0 "$GRE_political_instability$"
 GRE_political_instability_republican_2_desc:0 "§W£faction_gre_monarchist §YМонархісти§!: [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YРеспубліканці§!: [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YКомуністи§! [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YФашисти§!: [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nЗ 1924 до 1935 року в нас сталися двадцять три зміни уряду, тринадцять переворотів і ще й диктатура! Ми, венізелісти, не можем заперечувати свою участь у всьому що сталось. Принаймні народ нас вже знає! Тепер ми мусимо вшанувати свою спадщину і закінчити шлях, початий Грецією в 1919 році, коли ми спробували повернути собі Константинополь..."
 GRE_recruit_the_fascists_desc:0 "Щоб упіймати радикала, треба думати як радикал. Фашисти — наші огидні вороги, але з усіх ворогів їх ми явно ненавидимо менше. Вони готові співпрацювати з нами, то чому б нам не використовувати їх для своїх цілей?"
 GRE_remembering_the_anatolian_catastrophe:0 "Спогади про Анатолійську катастрофу"
 GRE_required_fascist_faction_loyalty_tt:0 "§YФракція фашистів§! мусить бути §Gлояльною§!."
