 NOR_fascist_lackey:0 "Фашист-слуга"
 NOR_fascist_preparation_decisions_category_desc:0 "Партія «Національна єдність» історично мала дуже обмежену підтримку в [NOR.GetAdjective]ому суспільстві, ось чому важливо пропагувати по всій країні та створювати базу підтримки.\n\nПосіваючи зерна фашизму, коли прийде слушна можливість, ми зможемо пожинати плоди нашого планування та взяти державу [ROOT.GetName].\n\n\n Повна підтримка «Національної єдності» ([NOR.GetName]): [?NOR.NOR_country_preparedness]/30"
 NOR_for_the_king_and_prince:0 "За короля та принца"
 NOR_fortify_norway_desc:0 "Нашими фортами нехтували досить довго, ми повинні згуртувати будівельні бригади, щоб швидко модернізувати й навіть перебудувати наші існуючі форти, а також побудувати нові, де це необхідно."
 NOR_frontkjempere:0 "Frontkjempere"
 NOR_improved_training:0 "Покращене тренування"
 NOR_invite_german_engineers_desc:0 "[NOR.GetName] ніколи не був промисловим центром, наші попередники більше зосереджувалися на торгівлі, ніж на виробництві власних продуктів. Ось чому нам потрібна допомога [GetNorwegianFascistOverlord], щоб отримати знання, необхідні для того, щоб наздогнати наших союзників, і, що важливіше, наші вороги."
 NOR_lobby_for_parliamentary_support_desc:0 "Досі наші господарі були дуже щедрими, але, можливо, їм потрібно трохи нагадати про те, крізь що проходять наші люди, щоб вони ніколи не забували, що для нас поставлено на карту."
 NOR_lurk_in_the_shadows:0 "Сховатись у тіні"
 NOR_medium_tank_equipment_3:0 "Panservogn m/43"
 NOR_new_haeren_ns_1_desc:0 "[NOR.GetAdjectiveCap]а армія минулого була недостатньою для цих небезпечних часів. Це сучасна армія для сучасної війни."
 NOR_new_haeren_ns_2_desc:0 "$NOR_new_haeren_ns_1_desc$"
 NOR_norwegian_regency_desc:0 "Регент Педер Анкер Ведель-Ярлсберґ заявив, що має намір виконувати лише волю і накази свого короля Гокона VII. Таким чином він прагне зближення з сусідніми скандинавськими монархіями."
