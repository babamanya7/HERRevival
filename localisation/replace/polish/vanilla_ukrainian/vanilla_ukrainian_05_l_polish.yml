 wilhelm_keitel:0 "$GER_wilhelm_keitel$"
 wtt_china_shared.12.c:0 "Надішліть Даґласа МакАртура."
 wtt_germany.1000.b:0 "Прекрасна ідея! Ми мусимо всі мандрувати разом."
 wtt_germany.1001.t:0 "Пожежа на «Гінденбурзі» у Лондоні"
 wtt_germany.16.d:0 "Поляки вирішили відкинути нашу пропозицію. У досить сильних висловлюваннях вони дали ясно зрозуміти, що ніколи добровільно не передадуть своїх територій, і якщо така ціна допомоги, то готові протистояти ворогові поодинці.."
 wtt_germany.16.t:0 "Польща відкидає пропозицію"
 wtt_germany.39.b:0 "Не поспішатимемо з відповіддю."
 wtt_germany.48.desc:0 "[From.GetNameDefCap] приймає наші вимоги та починає процес передачі Ціндао німцям!"
 wtt_germany.56.a:0 "Краще Німеччина, ніж радянці!"
 wtt_germany.56.b:0 "Ніколи! Нехай польські землі впадуть, будучи польськими!"
 wtt_germany.58.desc:0 "Австрійський народ не прислухався до нашого заклику про об'єднання, воліючи зберегти незалежність — принаймні на якийсь час."
 wtt_japan.105.desc:0 "Держава [From.GetNameDefCap] відповіла на наші вимоги надати незалежність Філіппінам, і американський уряд розпорядився негайно провести всі процедури надання суверенітету своїм володінням у Тихому океані."
 wtt_japan.118.desc:0 "Держава [From.GetNameDefCap] в даний час загрузла в громадянській війні і насилу протистоїть ворожим силам. Тимчасовий уряд звернувся до наших представників із пропозицією обміняти Південний Сахалін на так необхідну їм військову допомогу.\n\nНепоганий спосіб отримати землю в обмін на добровольчі дивізії."
 wtt_japan.120.t:0 "[From.GetName] відхиляє пропозицію обміну"
 wtt_japan.40.t:0 "[From.GetLeader] вимагає Маньчжурію"
 wtt_news.25.b:0 "Сумний день для Європи..."
 wtt_news.30.d:0 "Китай чекає ще більш нестабільна обстановка."
 wtt_news.37.desc:0 "У своїй тріумфальній промові [PRC.GetLeader] заявив, що «китайський народ вистояв» і призвів до перемоги комуністів у громадянській війні у Китаї. Тепер, після повного відступу націоналістів, комуністична партія здобула безумовну перемогу у війні, яка тривала кілька десятиліть. Таким чином, невелика група повстанців, яка розпочинала свою боротьбу у віддалених гірських селищах, зрештою стала повноправним урядом Китайської Народної Республіки."
 wtt_news.42.b:0 "Необхідні інвестиції на благо нації."
 wtt_news.44.t:0 "[MAN.GetLeader] претендує на Мандат небес"
 wtt_news.47.a:0 "Хтось мусив це заявити."
 wtt_news.48.c:0 "Ах цей зрадник!"
 wtt_news.5.t:0 "Муссоліні вбитий"
 wtt_political_organisation.1.t:0 "Повідомлення з області [state.GetName]"
 wtt_political_warlord_support.1.t:0 "[From.GetNameDefCap] звертається до нас за підтримкою"
 wtt_take_national_leadership.3.t:0 "[From.GetLeader] відмовляється"
 wtt_warlord_vs_prc.31.b:0 "Ніхто не стане казати нам, що робити."
 wtt_xian_incident.7.desc_b:0 "[From.GetLeader] відкинув нашу пропозицію стратити лідера [CHI.GetLeader]. Натомість передбачається, що ми мусимо укласти союз із націоналістами, оскільки нібито не готові одночасно очолювати революцію та оборонятися від японців."
 wuw_GER_chinese_diplomacy.3.desc:0 "\nНаша делегація повернулась із чудовими новинами. Уряд [FROM.GetAdjective] був радий підписати угоду, і пакт набуде чинності негайно. Ми отримали доступ до їхніх ресурсів за невелику ціну — промислову допомогу."
 wuw_GER_civil_war.8.a:0 "Вони заплатять за зраду!"
 wuw_GER_diplomacy.60.desc:0 "\nРиторика [FROM.GetLeader] та уряду [FROM.GetAdjective] стала значно агресивнішою щодо наших адміністрацій у [912.GetName], заявляючи, що Північний Шлезвіг завжди був і буде німецьким, і тепер вимагають повернення цієї території. Ми знаємо, що це неправда, але чи варто нам уникати відкритого конфлікту з [FROM.GetNameDef]?"
 wuw_GER_diplomacy.66.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що наші вимоги надто суворі, і захищати себе вони можуть самі. Їм не потрібна допомога прусської армії, як вони самі висловились."
 wuw_GER_diplomacy.70.b:0 "Ніякої співпраці з [FROM.GetAdjective] — припинити пропаганду негайно!"
 wuw_GER_diplomacy.77.desc:0 "Наші північні сусіди вимагають провести референдум про приєднання до них. Вони стверджують, що наш народ дуже схожий на їхній і заслуговує жити разом. Ми збережемо певну автономію, але зовнішню політику буде контролювати [FROM.GetAdjective] уряд."
 wuw_GER_diplomacy.78.t:0 "[FROM.GetNameDefCap] погоджується приєднатись"
 wuw_GER_diplomacy.84.desc:0 "[GetIsRootProletarianSubject]"
 wuw_GER_diplomacy.89.desc:0 "[FROM.GetNameDefCap] повідомив про встановлення сфери впливу. Це нас поки не зачіпає, але варто тримати це на контролі. Вони можуть вимагати території."
 wuw_GER_diplomacy.97.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 wuw_GER_diplomacy.98.t:0 "[FROM.GetNameDefCap] запрошує нас до ініціативи обміну технологіями"
 wuw_GER_monroe.6.desc:0 "[FROM.GetNameDef] надіслав нам повідомлення, в якому йдеться про діяльність [GER.GetAdjective] агентів, спрямовану на дестабілізацію регіону. Вони хочуть знати, чи залишаємося ми вірними Доктрині Монро."
 wuw_GER_news.1.d:0 "Будучи довгий час розділеним між різними державами довільними кордонами, що відокремлювали одного родича від іншого, сьогодні німецький народ святкує. Адже нова єдина німецька держава знову підіймає голову. Після недавніх політичних подвигів, [FROM.GetLeader] виправдав відновлення дух Бісмарка, оголосивши про Возз’єднання Німеччини, нації, яка цього разу простоїть тисячу років!"
 wuw_GER_realpolitik.1.b:0 "Нам не потрібна їхня дружба!"
 wuw_GER_realpolitik.12.a:0 "Вони ще пошкодують про це"
 wuw_GER_realpolitik.14.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що [FROM.GetAdjective] нація підкориться нашій владі, оскільки їм потрібна вся можлива допомога для продовження Хеймосодат."
 wuw_GER_realpolitik.17.t:0 "[FROM.GetNameDefCap] вимагає повернення імперських територій"
 wuw_GER_realpolitik.22.t:0 "[FROM.GetNameDefCap] відкидає наші вимоги"
 wuw_GER_realpolitik.4.a:0 "Це точно стане у пригоді"
 wuw_GER_realpolitik.5.t:0 "[LIT.GetAdjective] питання"
 wuw_GER_realpolitik.51.t:0 "Перша Берлінська нагорода"
 wuw_GER_realpolitik.52.desc:0 "Розсудливий [FROM.GetLeader] з [FROM.GetNameDef] погодився передати території в Галичині нашому альянсу та наказав своїм військам відійти. Ми знову перемогли!"
 wuw_GER_realpolitik.52.t:0 "[FROM.GetNameDefCap] передає Галичину"
 wuw_GER_realpolitik.55.t:0 "[FROM.GetNameDefCap] передає старі угорські володіння"
 wuw_GER_realpolitik.62.desc:0 "Попри очевидні переваги, [FROM.GetNameDef] відкинув нашу пропозицію повної інтеграції. Можна лише здогадуватись, чому, але, здається, вони не зацікавлені в добробуті союзу."
 wuw_GER_reichskommissariats.11.desc:0 "Після захоплення стратегічної зони Східної Карелії постало питання, як саме слід розпорядитися цим регіоном. Деякі плани передбачають включення території до складу Московії, інші ж пропонують приєднати її до фінської держави. Що скажемо?"
 wuw_GER_reichskommissariats.13.t:0 "Керівництво Богемії-Моравії"
 wuw_GER_reichskommissariats.15.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.18.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.6.desc:0 "Ми встановили нову цивільну адміністрацію на Кавказі..."
 wuw_GER_weltpolitik.15.t:0 "[FROM.GetNameDefCap] передає землі [GER.GetNameDefCap]"
 wuw_GER_weltpolitik.16.desc:0 "[FROM.GetNameDefCap] повідомили нас, що встановили сферу впливу. Хоча це безпосередньо нас не зачіпає, оскільки немає формальних домовленостей, нам слід тримати це в полі зору. Вони можуть спробувати нав’язати це нам або вимагати території, якщо ми отримаємо над нею контроль."
 wuw_GER_weltpolitik.9.b:0 "Можливо, не варто далі тиснути"
 wuw_HUN_claim_overlordship_over_slovakia:0 "Претензія на сюзеренітет над [SLO.GetNameDef]"
 wuw_HUN_danuvia_submachine_guns_desc:0 "Нашій піхоті потрібна якісна зброя. Початкові прототипи Danuvia 43M показали хороші результати, і додаткове фінансування дозволить нам налагодити масове виробництво."
 wuw_HUN_demand_southern_slovakia:0 "Вимогти Південну Словаччину"
 wuw_HUN_does_not_have_trianon_tt:0 "Не має жодної форми §YТріанонського Договору§!"
 wuw_HUN_economic_intervention:0 "Економічне втручання"
 wuw_HUN_embrace_navy_traditions:0 "Прийняти морські традиції"
 wuw_HUN_end_the_white_terror:0 "Покінчити з Білим терором"
 wuw_HUN_enlarge_the_ganz_danubius_division_desc:0 "Підрозділ Ganz Danubius у Будапешті будує та ремонтує цивільні та річкові судна. Ми повинні розширити його обов’язки та побудувати нові заводи на нашому нещодавно здобутому узбережжі."
 wuw_HUN_integrate_bohemian_and_austrian_industries_desc:0 "Інші держави нашої імперії володіють потужною промисловістю. Тепер, коли ми повернули їх у свою орбіту, було б доцільно інтегрувати їхні виробничі потужності в загальноімперську систему."
 wuw_HUN_invest_in_the_special_forces:0 "Інвестувати в спецпідрозділи"
 wuw_HUN_invite_foreign_investors_desc:0 "[ROOT.GetNameDefCap] розташована в самому серці Східної Європи, і ми можемо використати це, щоб привабити іноземних інвесторів, зацікавлених у покращенні нашої інфраструктури та промисловості."
 wuw_HUN_join_the_comintern_desc:0 "Шлях до перемоги революції лежить через Комінтерн. Разом з нашими товаришами ми зметемо капіталістичну несправедливість і фашистську загрозу на Заході."
 wuw_HUN_joint_oil_exploitation_company_desc:0 "Можливі нафтові родовища на нашій території привернули іноземну увагу. Дружні держави охоче підтримують нашу нафтову промисловість своїми технічними знаннями, і це чудова можливість для нас навчитись у них."
 wuw_HUN_protect_czechoslovakia_desc:0 "[CZE.GetNameDefCap] з моменту здобуття незалежності стала потужною та індустріалізованою державою, але її землі викликають жадібний інтерес у сусідів. Ми запропонуємо їм наш захист від цих загроз — або шляхом інтеграції до нашої імперії, або шляхом надання статусу асоційованого члена."
 wuw_HUN_reclaim_the_pannonian_steppe:0 "Повернути Паннонський степ"
 wuw_HUN_restore_the_duchy_of_teschen:0 "Відновити Тешинське герцогство"
 wuw_HUN_restore_the_hungarian_red_army:0 "Відновити Угорську Червону Армію"
 wuw_HUN_reverse_the_risorgimento_desc:0 "Об'єднання Італії стало фатальною помилкою, наслідком безвідповідальних рішень правителів і трагедією для Австро-Угорської імперії. Цю помилку необхідно виправити, якщо світ коли-небудь хоче зцілитися!"
 wuw_HUN_stage_an_uprising_in_leitha:0 "Організувати повстання в Лайті"
 wuw_HUN_the_turan_desc:0 "Використовуючи базу середнього танка Škoda T-21, ми можемо створити власний танк, здатний проривати навіть найміцнішу оборону. Ми назвемо його на честь Туранізму, щоб поширити ідею угорської ідентичності у світі."
 wuw_HUN_undercover_air_maneuvers_desc:0 "Ми повинні виділити ресурси на розробку нових теорій повітряної війни. У випадку війни ці напрацювання будуть неоціненними, а пілоти — краще підготовленими."
 wuw_HUN_volksbund_der_deutschen_in_ungarn:0 "Фольксбунд німців в Угорщині"
 wuw_HUN_ward_against_extremism:0 "Бастіон проти екстремізму"
 ww_BEL_event_diplomatic.24.a:0 "Відмінно!"
 ww_BEL_event_diplomatic.30.t:0 "[FROM.GetNameDefCap] Запрошує нас приєднатися до [ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.37.desc:0 "Попри очевидні переваги для обох сторін, здається, що [FROM.GetAdjective] не готові вести з нами дипломатичні відносини, за межами вже існуючих. Ми мали великі сподівання на це, але здається, вони не були поділені."
 ww_BEL_event_diplomatic.37.t:0 "[FROM.GetNameDefCap] Не погоджується"
 ww_BEL_event_diplomatic.5.t:0 "Як нам отримати Кале?"
 ww_BEL_event_spanish_interaction.2.c:0 "Надіслати їм артилерію!"
 ww_BEL_event_war.8.a:0 "Віддати Кале за мир."
 ww_congo.23.desc:0 "Колоніальна адміністрація в [FROM.GetNameDef] схвалила наш запит на збільшення просування [FROM.GetAdjective] еміграції до нашої держави. Нова хвиля людей, готових допомогти в будівництві нашої нації, безсумнівно, почне прибувати."
 ww_congo.41.b:0 "Ні, ми не погодимося!"
 ww_congo.54.t:0 "[FROM.GetLeader] передає території Бурунді"
 ww_congo.8.desc:0 "Є велика зростаюча частина конґолезців, які добре володіють французькою мовою, сповідують християнство та мають якусь форму післяшкільної освіти. Колоніальні адміністратори почали називати їх Евольє, європеїзованими людьми, і хоча вони все ще будуть обмежені в тому, як далеко вони можуть піднятися в нашому суспільстві через вимоги колоніальної адміністрації, більш освічене населення, безумовно, сприятиме процвітанню нашої нації одного дня."
 ww_congo.9.a:0 "Ці люди, без сумніву, приведуть нашу націю до незалежності"
