 SPR_primo_de_rivera_speech_mission:0 "Промова Прімо де Рівери"
 SPR_seize_the_gold_reserves_desc:0 "Золоті запаси Республіки ризикують потрапити в руки фашистів або, можливо, ще гірше, сталінських рук. Захопивши їх, ми, безсумнівно, ризикуємо накликати на себе гнів уряду, але це може дозволити нам фінансувати наші військові зусилля шляхом фінансування іноземних закупівель зброї на чорному ринку."
