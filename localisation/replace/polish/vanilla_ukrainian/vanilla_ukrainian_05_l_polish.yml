 ITA_army_modernization_desc:0 "Наші збройні сили могли би скористатися новими обладнанням і методами навчання, які дозволять їм не відставати від армій і доктрин інших великих держав."
 ITA_army_primacy_desc:0 "Індустріально Італія досі відстає від декадентних колоніальних імперій. Ми мусимо вибрати, на що робити пріоритет: армію чи флот. Вибір, схоже, очевидний; так само як Римська імперія покладалася на свої легіони, це мусить зробити нова Італійська імперія!"
 ITA_aviation_hero_tt:0 "  - $air_equipment_research$: §G+5%§!"
 ITA_aviazione_legionaria_tt:0 "§Y2 крила винищувачів§! й §Y1 крило тактичних бомбардувальників§! стануть активні в області [2.GetName]."
 ITA_battleship_2_desc:0 "Лінкори класу «Caio Duilio» були спочатку введені в експлуатацію на початку Першої світової війни. Однак обидва кораблі зазнали повної переробки в період між 1937 і 1940 роками. Ця модель представляє цю переробку. Озброєння модернізовано до десяти 320-мм гармат M1934, водотоннажність тепер становить 29 000 тонн, а швидкість достатня, щоб класифікувати їх як «швидкісні» лінкори."
 ITA_befriend_turkey_desc:0 "$ITA_turkey_friend_desc$"
 ITA_bop_cooperation_with_anarchists:0 "£BoP_left_texticon Співпраця з анархістами"
 ITA_bring_down_fascist_strongholds:0 "Знести фашистські твердині"
 ITA_bulgaria_friend:0 "Подружитися з Болгарією"
 ITA_cantiere_oto_organization:0 "$ITA_cantiere_oto$"
 ITA_defend_the_land_desc:0 "Радянський Союз і його політика підвели пролетаріат і марксистську ідеологію. Італійський народ піде власним шляхом до комунізму, шляхом, повним перешкод і загроз, які нам доведеться подолати, але, сподіваємося, разом із товаришами та союзниками, готовими допомогти один одному."
 ITA_divino_duce:0 "Divino Duce"
 ITA_ethiopian_war_logistics:0 "Логістика ефіопської війни"
 ITA_fiat_aviazione:0 "Fiat Aviazione"
 ITA_fighter_equipment_0_short:0 "CR.32"
 ITA_follow_the_soviet_union:0 "Услід за Радянським Союзом"
 ITA_fortification_effort_desc:0 "Ми мусимо захистити наші береги та кордони від агресії з боку згасаючих і декадентних імперських держав: Франції та Британії."
