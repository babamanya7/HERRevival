 AAT_finland_diplomacy.23.b:0 "З чого б нам це робити?"
 AAT_finland_kinship_war.06.desc:0 "Поки в Радянському Союзі руйнуються цивільні інститути, багато місцевих націоналістичних урядів оголошують про свою незалежність — зокрема й уряд держави [KAR.GetNameDef]. Карельські ірредентисти і мілітаристи оголосили, що на нас чекає друга братня війна, помірковані і соціалісти ж заявляють, що нам не варто втручатися в радянські справи."
 AAT_finland_kinship_war.06.t:0 "Нова братня війна"
 AAT_finland_misc_events.06.a:0 "Нам це знадобиться!"
