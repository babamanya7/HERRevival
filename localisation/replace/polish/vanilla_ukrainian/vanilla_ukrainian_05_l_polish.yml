 vojvodina_DEF:0 "Воєводина"
 war_hero_desc:0 "§LПрославився своїми подвигами на війні.§!"
 war_justification.16.a:0 "Традиції та прагматизм завжди перемагатимуть фанатизм і терор."
 war_justification.16.t:0 "[ROOT.GetLeader] кидає виклик [From.GetAdjective]им гнобителям"
 war_justification.204.a:0 "Нехай приходять!"
 war_justification.207.a:0 "Вони не розуміють, що означає революція для [ROOT.GetAdjective]ого народу."
 war_justification.210.d:0 "«З важким серцем ми повинні визнати реальність нашої ситуації: Вторгнення в [ROOT.GetName] може бути нашим єдиним виходом. Це занадто велика стратегічна перевага, щоб спробувати будь-яке інше рішення в нашій поточній ситуації. Хоча ми віримо, що ані [From.GetAdjective]ий, ані [ROOT.GetAdjective]ий народи не хочуть війни, але історія привела нас до цього, і наші можливості обмежені. Ми можемо лише сподіватися, що завдяки цьому утвердженню нашої військової могутності ми зможемо уникнути подальшого кровопролиття в майбутньому».\n\nХоча існує популярна теорія, що демократії не воюють проти інших демократій, останні події вказують на [From.GetAdjective]е вторгнення в [ROOT.GetName] в майбутньому. Історія може нас ще здивувати."
 war_justification.213.t:0 "[From.GetLeader] закликає до війни проти держави [ROOT.GetName]"
 war_justification.9.d:0 "«Незважаючи на наші спроби знайти дипломатичне вирішення нашого конфлікту з [From.GetName], переговори вкотре провалилися, залишивши нас з обмеженими можливостями. Авторитарний режим [From.GetLeader] продемонстрував нерозумний підхід до цього питання, типовий для лідерів, які не підзвітні своєму народу. Якщо політика [From.GetAdjective]ого керівництва не зміниться, нам не залишиться нічого іншого, окрім як боротися».\n\n[ROOT.GetAdjective]е втручання в [From.GetName] було гострим питанням, деякі політики в опозиції стверджують, що [ROOT.GetRulingParty] з самого початку проводила яструбину політику. Якими б не були їхні початкові наміри, майбутня війна тепер раптом здається дуже реальною і неминучою."
