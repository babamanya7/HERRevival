 CHI_burma_road_reopen_state:0 "Заново відкрити Бірманську дорогу в цій області.\n"
 CHI_camco_tt:0 "Виконано фокус §Y$CHI_camco$§!"
 CHI_chen_shaokuan:0 "Чень Шаокуань"
 CHI_close_ledo_road:0 "Закрити дорогу Ледо"
 CHI_cooperation_with_the_nationalists_desc:0 "У націоналістів шанси об'єднати країну і дати відсіч японцям вище за інших. Необхідно докласти всіх зусиль, щоб вони не вважали нас загрозою для себе."
 CHI_coordinate_with_the_army:0 "Координація з армією"
 CHI_dare_to_die_corps_desc:0 "Боротьба за виживання республіки вже забрала життя багатьох мучеників. До кінця війни їх кількість ще збільшиться, але люди пам'ятатимуть їхню жертву не одне покоління."
 CHI_democracy_desc:0 "Шлях, започаткований Сунь Ятсеном, рано чи пізно приведе нас до республіки. Шлях цей довгий, але ми його пройдемо."
 CHI_demonstrate_our_resolve:0 "Продемонструвати нашу рішучість"
 CHI_denounce_feudalism_tt:0 "Дасть: §G+[?warlord_subjects_pp_gain_base] політичної влади§! щомісяця за кожного підконтрольного мілітариста."
 CHI_develop_counterinsurgency_tactics_tt:0 "Зробить вартість §Y$CHI_counter_infiltration_measures$§! наполовину §Gменшою§!"
 CHI_dominate_japan_desc:0 "Десятки років Японія була загрозою для нашої незалежності. За допомогою західних держав японці вже одного разу намагалися підкорити нас собі, але другий подібної спроби ми не допустимо. Потрібно діяти першими."
 CHI_empowered_nbis_desc:0 "Наша служба збору розвідувальних даних при NBIS (Національне бюро розслідувань і статистики), також відома як Цзюньтун, отримала мандат на пошук усіх ворогів, як іноземних, так і внутрішніх."
 CHI_expand_academica_sinica_desc:0 "Оскільки значна частина нашого населення починає досягати задовільного освітнього рівня, настав час звернути увагу на нашу вищу освіту. Для розширення можливостей ми будемо розвивати вже існуючі інституції в Академії Сініка, нашій найголовнішій науковій установі."
 CHI_experimental_mechanised_unit_effect:0 "Отримає дивізію з §Y2§! шаблонами §Yлегких танків§! і §Y4 мотопіхоти§!.\n"
 CHI_foreign_economic_support_dm_tt:0 "[?CHI_foreign_economic_support_cic_amount|Y0] надлишку виробничих потужностей щомісяця"
 CHI_form_saco_desc:0 "Щоб перемогти, треба знати свого ворога. Американці запропонували створити Китайсько-американську організацію співробітництва для обміну розвідданими та допомоги у підготовці наших партизанських загонів."
 CHI_fu_zuoyi:0 "Фу Цзої"
 CHI_full_political_support:0 "[scope_CHI.GetNameDefCap] має [?scope_CHI.total_political_support_points|+0] §Hбалів політичної підтримки§!\n[scope_CHI.GetStateSupport][scope_CHI.GetWarlordSupport][scope_CHI.GetOtherSupport]\n\n"
 CHI_geologist_trait:0 "Геолог"
 CHI_grain_tax_desc:0 "Паперові банкноти стрімко втрачають ціну. Незабаром ми навіть не зможемо прогодувати армію. Ми можемо провести новий закон, зобов'язавши селян виплачувати податки зерном, це дозволить нам ігнорувати ринок. Це буде непопулярно, і, крім того, є ризик, що цей захід приведе до голоду в країні."
 CHI_great_yuan_neutrality_ADJ:0 "Yuan Chinese"
 CHI_heavy_fighter_equipment_2:0 "CAMCO PF-77"
 CHI_hire_soviet_designer:0 "Найняти радянських конструкторів"
 CHI_illicit_trade_desc:0 "Підпільні ринки та контрабандні мережі підривають авторитет уряду та порушують економічну стабільність. Зусилля з приборкання цієї діяльності залишаються безсистемними, а вплив незаконної торгівлі продовжує перешкоджати національній єдності та реформам."
 CHI_industrial_evacuations_from_nanning:0 "Евакуація промисловості з Наньніну"
 CHI_industrial_evacuations_from_shanghai:0 "Евакуація промисловості з Шанхаю"
 CHI_inefficient_economy_desc:0 "Наша індустріалізація перебуває в зародковому стані, оскільки попередні уряди не підтримували належного зростання. Проте ми можемо вирішити це за допомогою внутрішніх і зовнішніх заходів, наш потенціал справді безмежний."
 CHI_inter_party_coordination_council_desc:0 "Перший крок до перетворення країни на багатопартійну демократію із зрілим електоратом — створення організації, завданням якої стане залучення зацікавлених сторін до роботи над законодавством."
 CHI_invest_in_mountain_guns_desc:0 "Наші землі не є легкопрохідними, і переміщення традиційної важкої артилерії через них є викликом для більшості. Можливість розбирати наші гармати за бажанням є природним вирішенням цієї проблеми і варте вивчення."
 CHI_join_the_republican_government:0 "Приєднатися до республіканського уряду"
