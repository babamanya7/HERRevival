 DEN_train_mountain_infantry_desc:0 "Західна і північна частини Скандинавії — це гірська місцевість, якої немає в материковій Данії. Ми повинні проводити військові навчання в цих горах, щоб підвищити нашу боєздатність і краще захищати наше королівство."
