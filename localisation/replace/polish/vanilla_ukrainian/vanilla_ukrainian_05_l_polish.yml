 BAY_rupprecht_of_bavaria:0 "Рупрехт фон Виттельсбах"
 BBA_SWI_annual_election.1.desc:0 "Щороку Федеральні Збори Швайцарії обирають одного з радників Президентом Конфедерації. Перший серед рівних, [?ROOT.SWI_confederation_president.GetSheHe] використовуватиме [?ROOT.SWI_confederation_president.GetHerHis] обмежені повноваження, щоб представляти раду та вирішувати голосування у разі рівності, м’яко спрямовуючи раду до безпеки або слави.\n\n[SWI_get_extra_election_paragraph]Кого ж цього року обере Асамблея обличчям Швайцарської Конфедерації?"
