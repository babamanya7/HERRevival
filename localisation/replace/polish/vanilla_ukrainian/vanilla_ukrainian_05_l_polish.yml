 KHM_push_them_back_desc:0 "Битва за провінцію Сіньцзян не повинна закінчитися їхньою перемогою, ми відкинемо їх аж до Радянського Союзу!"
 KHM_revive_the_basmachi_movement_desc:0 "Up until 1934 the Basmachi struggled against [SOV.GetAdjective] forces to liberate Central Asia from their tyrannic rule. Though their movement has since been largely crushed, some of their leaders managed to escape. We should endeavor to establish contact with these freedom fighters, and invite them to our court."
