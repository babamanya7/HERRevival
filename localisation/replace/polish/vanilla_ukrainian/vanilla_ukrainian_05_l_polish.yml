 HOA_the_steam_locomotive:0 "Паровий локомотив"
 HOA_the_steel_lions_desc:0 "Епоха статичної війни позаду. Настав час розпочати розгортання власних спеціалізованих бронетанкових підрозділів на полі бою та почати вивчати методи ведення мобільної війни."
