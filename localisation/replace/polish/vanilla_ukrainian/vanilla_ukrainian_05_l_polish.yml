 CZE_artillery_equipment_3_short:0 "10,5 cm vz. 43"
 CZE_bonus_research_slot_2:0 "Команди з обміну знань"
 CZE_central_european_faction_desc:0 "Незважаючи на те, що ми зосередилися на зміцненні власних сил, а не надто покладалися на дипломатію, критично важливо не перенапружувати свій вплив. Можливо, настав час поглянути назовні."
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc:0 "Літаки не завжди можуть бути готові, але наші пілоти готові завжди. З огляду на можливі повітряні загрози з усіх боків, ми повинні зробити повітря нашим морем. Кожен пілот має битися за трьох."
 CZE_change_the_narrative:0 "Змінити наратив"
 CZE_compromise_with_the_veteran_agrarian_desc:0 "Стара гвардія аграріїв є перешкодою на шляху до налагодження відносин зі зростаючим міським електоратом. Нам потрібно піти на компроміс з ними, щоб досягти своїх цілей."
 CZE_continue_with_snejdareks_plan_no_snejdareks:0 "Продовжити план статичної оборони"
 CZE_czech_socialism:0 "Чеський соціалізм"
 CZE_czech_state_modifier:0 "Нестача кваліфікованих чеських робітників"
 CZE_czech_state_modifier_desc:0 "Швидкий економічний розвиток 20-го століття став випробуванням для переважно аграрного чеського населення. Заповнити робочі місця кваліфікованими чеськими працівниками важко. Необхідно докласти зусиль, щоб допомогти підготувати молодих громадян Чехії до мінливих потреб сучасної економіки."
 CZE_deal_with_hungary_desc:0 "Світ у Європі руйнується, і Антанта не може дозволити Угорщині знову пхати нам палиці в колеса. Необхідно усунути цю загрозу раз і назавжди, щоб мати змогу зосередитися на більш важливих проблемах."
 CZE_demands_aus_joins_us:0 "Вимагати від [AUS.getname] приєднатися до нашої Федерації"
 CZE_eliminate_austrian_defeatists:0 "Перемогти [AUS.GetAdjective]их капітулянтів"
 CZE_eliminate_austrian_defeatists_desc:0 "[AUS.GetNameDefCap] відмовилася від готовності захищати свою державу; ми повинні втрутитися зараз, поки не опинилися в оточенні."
 CZE_emergency_measures_desc:0 "Запровадивши надзвичайні заходи, щоб допомогти нам впоратися з численними кризами, з якими стикається наша нація, і водночас використовуючи деякі з цих заходів, щоб пильніше стежити за тими, хто може бути ідеологічно ненадійним для нашого уряду, ми будемо краще підготовлені до викликів, які стоять перед нашою нацією."
 CZE_establish_the_fall_backlines:0 "Створити лінії відступу"
 CZE_expand_praga:0 "Контракти з «Прагою»"
 CZE_expand_the_communist_press:0 "Розширити комуністичну пресу"
 CZE_expand_the_river_monitor_fleet_desc:0 "Наш флот річкових моніторів є одним із найбільших у Європі і допомагає нашій армії захищати внутрішні території. Його розширення значно підвищить їхню здатність виконувати це завдання."
 CZE_go_with_vojcechovskys_plan_dynamic_desc:0 "Недоліком статичної оборони є те, що вона позбавлена маневреності. Після прориву її вже не можна використовувати для наступальних цілей, а лише як залишки укріплень на початковій позиції."
