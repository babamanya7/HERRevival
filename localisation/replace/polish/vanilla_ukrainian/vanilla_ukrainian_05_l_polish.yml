 ETH_executive_council_tt:0 "Відмикає рішення щодо запрошення членів §YОрганізації африканської єдності§! до Виконавчої ради."
 ETH_expand_the_coffee_industry:0 "Розширити кавову промисловість"
 ETH_expanding_the_railway_network_desc:0 "Залізниці мають вирішальне значення для транспортування ресурсів до заводів і далі на внутрішній або міжнародний ринки. Розширюючи мережу залізниць, ми можемо поліпшити нашу здатність доставляти ці ресурси до потрібного пункту призначення. Це також створить більше можливостей для людей із держави [ETH.GetName] переїхати до промислових міст, що розвиваються."
 ETH_fundraising_campaign_decision_desc:0 "Після радіозвернення лідера [ROOT.GetLeader] підтримка нашої справи в Америці значно зросла. Ми мусимо скористатися цим і розпочати кампанії зі збору коштів там і в інших місцях, щоби створити імперську скарбницю і таким чином профінансувати відвоювання наших рідних земель."
 ETH_haile_mariam:0 "Хайле Маріам"
 ETH_invest_in_the_east_desc:0 "Інвестуючи на сході, ми можемо скористатися перевагами історичної торговельної мережі регіону та перетворити територію на промисловий центр для обробки ресурсів [ETH.GetName], готових до експорту."
 ETH_investments_in_progress_flag:0 "Інвестиції вже проводяться"
 ETH_invite_foreign_prospectors_desc:0 "Замість того, щоби намагатися дублювати дослідження з-за кордону, ми повинні використовувати досвід іноземних урядів і компаній, щоби допомогти нам краще використовувати наші багаті природні ресурси."
 ETH_japanese_industrial_investments_decision_desc:0 "Японські інвестори шукають нові інвестиційні можливості в Африці. [FROM.GetName] може стати ідеальним місцем для фінансованої японцями індустрії."
 ETH_lij_abiye_abebe:0 "Lij Abiye Abebe"
 ETH_officer_promotion_boost_tt:0 "Всі майбутні §Yофіцери§! підвищений до звання §Yгенерала§! отримає §G+1 атаки§! та §G+1 захисту§!."
 ETH_our_own_path_desc:0 "Ми були надто слабкі, щоб протистояти [SOV.GetAdjective]им силам, коли вони зрадили нас, взявши під контроль наші справи. Зараз ми маємо набагато сильнішу позицію і нарешті можемо зробити крок до відновлення нашої незалежності. Однак ми повинні бути готові до абияких можливих репресій із боку [SOV.GetAdjective]ої влади."
 ETH_prevents_further_capital_moves_tt:0 "Переміщення столиці в Єрусалим забороняє подальші переміщення."
 ETH_raise_from_the_ranks:0 "Підвищення з рядів"
 ETH_recall_balco_safo_decision_desc:0 "$ETH_balcho_safo$ може бути суворим противником амбіцій імператора щодо реформ і централізації держави [ROOT.GetName]. Але в той же час він є героєм, який брав участь у битві при Мекеле і здобув славетну перемогу при Адві. Він також є популярним лідером, тому, попросивши його знову взяти в руки зброю заради держави [ROOT.GetName], ми не тільки отримаємо досвідченого командира, але й, швидше за все, більше солдатів, які стануть під наші знамена."
 ETH_renewed_offensive_tt:0 "Атака піхоти: §G+10%§!\nАтака нерегулярної піхоти: §G+10%§!\nЗахист дивізій: §R-5%§!"
