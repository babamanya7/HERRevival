 GER_cancel_mefos:0 "Скасувати векселі «MEFO»"
 GER_carrier_1_desc:0 "Розроблений у 1915 році, проєкт «Flugzeugdampfer I» (Авіаносний пароплав I) являв собою переобладнання недобудованого пасажирського лайнера Ausonia в авіаносець. Будівництво було припинено наприкінці Першої світової війни. Якби будівництво було завершено, він міг би нести у своїх трьох ангарах суміш гідролітаків і колісних літаків, а його водотоннажність становила би 12 500 тонн."
