 USA_battleship_primacy_desc:0 "Після відмови Японії дотримуватися положень Вашинґтонського морського договору, нас може чекати нова гонка озброєнь на океані. Наші лінкори повинні бути найкращими та численними."
 USA_carrier_3_desc:0 "With the lessons learned from the preceding Lexington, Ranger and Yorktown variant classes, the result was the Essex Class, a fast ship able to carry a large complement of planes into battle. Damage control designs would also be carried over from the Yorktown class and a deck edge elevator was included to improve plane handling."
