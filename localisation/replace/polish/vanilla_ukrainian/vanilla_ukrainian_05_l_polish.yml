 japan_border_conflict.6.desc:0 "Біля озера Хасан продовжуються зіткнення між [FROM.GetAdjective]ими та [JAP.GetAdjective]ими військами. Намагаючись вийти з патової ситуації, [FROM.GetAdjective]і частини перейшли в наступ і зіткнулися з [JAP.GetAdjective]ими військовими в інших районах цього сектора. Розвідка передбачає, що [FROM.GetNameDef] невдовзі спробує посилити атаку свіжими підкріпленнями, перекинутими з інших регіонів країни."
 jet_technology:0 "Реактивні двигуни"
 jimma_communism:0 "Демократична народна республіка Джімма"
 join_faction_tension_tt:0 " $MODIFIER_JOIN_FACTION_TENSION_LIMIT$: $RIGHT|-=%1$"
 justifying_war_goal:0 "Виправдання цілі війни"
 kliment_voroshilov:0 "$SOV_kliment_voroshilov$"
 kolberg:0 "Kolberg"
 land_cruiser_equipment_desc:0 "$land_cruiser_chassis_desc$"
 lar_align_belgium.2.desc:0 "[From.GetAdjective] кабінет одноголосно проголосував за ухвалення нашої пропозиції, незважаючи на те, що кілька членів уряду вважали за краще піти у відставку, аби не віддавати свій голос «за». Військовий підрозділ протидії тероризму та невелика група державних службовців вже прибули до Брюсселя, щоб координувати свою роботу з [From.GetAdjective]ою владою."
 lar_concessions_to_italy.1.desc:0 "[From.GetLeader] і уряд хочуть, щоби ми спробували схилити на нашу сторону Італію і не дали їй укласти союз із Німеччиною. За свою згоду [ITA.GetLeader] напевно вимагатиме якусь поступку або компенсацію Оцінивши наші володіння у Східній Африці, [From.GetAdjective] уряд запропонував віддати Італії Джібуті та Сомаліленд і створити з нею альянс, що стримує Німеччину."
 lar_concessions_to_italy.2.a:0 "Надсилайте повідомлення."
 lar_concessions_to_italy.5.desc:0 "[From.GetAdjective] посол вручив нам ноту від свого уряду. [From.GetLeader] хоче формально ратифікувати попередні угоди, досягнуті в Стрезі. Як додатковий стимул [From.GetAdjective]ий уряд пропонує нам французькі території у Східній Африці.\n\nУ дипломатичних колах ходять чутки, що [From.GetAdjective]ий уряд уже обговорював з [ENG.GetAdjective]ою верхівкою спільну угоду з ще більш значними територіальними поступками, але отримав відмову."
 lar_congress_of_paris.4.a:0 "Нам більше дістанеться."
 lar_dominate_the_middle_east.3.t:0 "[From.GetNameDefCap] опирається"
 lar_end_the_occupation.2.desc:0 "Після того як [This.GetLeader] підписує Сталевий пакт, німецькі війська по всій країні переходять під контроль французької армії. Після церемонії, яку відвідали і [From.GetLeader], і [This.GetLeader], німецький гарнізон у Парижі спустив [From.GetAdjective] прапор і вийшов маршем із міста, над яким вперше за довгі роки піднявся триколор."
 lar_end_the_occupation.3.desc:0 "Незважаючи на те, що пропозиція об'єднатися проти більшовицької загрози і тих, хто розпалив цю війну, була досить щедрою, [From.GetLeader] грубо його відкинув. За його словами, французи досі не виявили в цій війні будь-якої бойової доблесті, тому він не бачить причин довіряти захист західних кордонів держави [From.GetNameDef] країні, яку одного разу вже перемогли."
 lar_fra_join_the_ententes.1.t:0 "[From.GetNameDefCap] пропонує укласти стратегічний союз"
 lar_france_french_union.2.a:0 "Вони розуміють, що таке братство!"
 lar_intervention_in_greece.2.t:0 "[From.GetLeader] погоджується"
 lar_news.1.desc_carlists:0 "Карлістські війська під командуванням Мануеля Фал Конде нарешті перемогли ворогів — фалангістів і республіканців — і захопили повний контроль над Іспанією. В ізольованих вогнищах республіканського опору досі йде партизанська війна республіканських районах, але малоймовірно, що вона переросте в масштабний скоординований опір.\n\nКлючом до перемоги стали хоробрість і фанатичність карлистських рекете, і точно з таким же прагненням Іспанія взялася за відновлення країни після війни. з нетерпінням чекають, коли їхні зусилля будуть винагороджені і на іспанський престол зійде легітимний карлістський спадкоємець."
 lar_news.1.desc_franco_unified:0 "В останні тижні зростали розбіжності між різними фракціями націоналістів, які здобули перемогу, але тепер, вигнавши непокірних лідерів і примусово об'єднавши політичні партії, Франсіско Франко, судячи з усього, подолав цей розкол і таким чином об'єднав фракції, що залишилися, за своєю справою. Хоча в ізольованих осередках республіканського опору досі йде партизанська війна, громадянську війну можна вважати повністю закінченою. і чи буде повернена отримана ними щедра військова допомога з-за кордону."
 lar_news.11.d:0 "Республіканцям ледве потрібна зовнішня допомога, щоби програти..."
 lar_news.12.b:0 "Ми вітаємо їх."
 lar_news.17.t:0 "[From.GetAdjective] монархія відновлена."
 lar_news.2.g:0 "Найкращий із можливих підсумків."
 lar_news.21.a:0 "Ми очолимо світ чистого чистого марксизму."
 lar_news.23.desc:0 "[POR.GetAdjective] і [?global.POR_iberian_summit_spanish_tag.GetAdjective] політики спільно звертаються до [ENG.GetAdjective] уряду з проханням про прийняття їх в альянс [ENG.GetFactionName вони хочуть брати участь у боях за демократію або ж просто шукають захисту від іноземних загроз.\n\nЯк би там не було, оцінивши ситуацію, держава вирішила, що це піде на користь його інтересам, і нарешті пустило в альянс Іберійські нації."
 lar_news.24.a:0 "Ми вибрали правильну сторону."
 lar_news.5.b:0 "Наш альянс став ще сильнішим."
 lar_non_intervention.3.desc:0 "Посилаючись на відсутність робочих механізмів, що дозволяють забезпечити виконання умов договору, [From.GetNameDef] офіційно відмовляється від нашої пропозиції вступити до Комітету з невтручання. Поки не ясно, чи це означає, що [From.GetLeader] хоче безпосередньо втрутитися у справи Іспанії."
 lar_operative_event.5.desc:0 "Наша контррозвідка досягла великого успіху: після тривалого допиту та розповідей про те, що чекає [This.GetHerHis] за звинувачення у шпигунстві, спійманий [From.From.GetAdjective] агент [This.GetName] погоджується з нами в обмін на повну амністію.\n\nЗавдяки [This.GetHerHis] глибокому знанню внутрішньої кухні [From.From.GetAdjective] розвідки, агенту буде набагато простіше впровадитися туди і уникнути розкриття [From.From.GetAdjective] контррозвідкою."
 lar_portugal_iberian_summit.1_a_tt:0 "Ми негайно надішлемо пропозицію державі [GER.GetFlag][GER.GetNameDefCap].\n"
 lar_portugal_iberian_summit.5.desc:0 "Ми прийняли з держави [From.GetNameDef] посла з пропозицією забути про наші розбіжності та разом йти до спільної мети. Ця держава пропонує обговорити спільний запит на вступ до альянсу [?global.POR_iberian_summit_tarName надіслати цей запит державі [?global.POR_iberian_summit_target.GetNameDef].\n\n Потрібно оцінити, чи є у цієї пропозиції шанси на успіх і чи відповідає вона нашим інтересам."
 lar_portugal_iberian_summit.6.t:0 "Іберійський самміт — [From.GetNameDef] приймає пропозицію"
 lar_portugal_naval_blockade.2.desc:0 "Сьогодні прибув посол з держави [From.GetNameDef] і повідомив, що наша пропозиція щодо уникнення британської морської блокади була прийнята. Ми будемо відправляти своїми конвоями товари туди, куди не можуть потрапити [From.GetAdject\" Натомість вони будуть поставляти нам продукцію з одного зі своїх заводів, щоби забезпечити нас матеріалами для наших проєктів."
 lar_portugal_navy_mutiny.1_allow_tt:0 "Кораблі, що збунтувалися, будуть перегнані в державу [SPD.GetNameDefCap]. \nЯкщо держава [SPD.GetFlag][SPD.GetNameDef] переможе в іспанській громадянській війні, вона поверне нам\n §! вплине на кількість кораблів, що йдуть."
 lar_portugal_navy_mutiny.3.a:0 "Такого більше не повториться!"
 lar_portugal_navy_mutiny.3.t:0 "Звіт про заколот"
 lar_spain.17.t:0 "Сталіністи переможені"
 lar_spain.2.desc:0 "Цього ранку о 5:00, рівно доби після втрати зв'язку з північноафриканськими гарнізонами, по всій Іспанії почалася добре підготовлена військова операція. Її метою було захоплення контролю над усіма урядовими інститутами і стратегічно важливими місцями у великих містах Армія, флот і авіація здебільшого перестали реагувати на накази уряду, водночас на півночі країни збунтувалося карлістське ополчення. Незважаючи на те, що початкових цілей лідерам бунтівників досягти не вдалося, навряд чи вони здадуться так само легко, як у 1932 році. Жодна зі сторін не бажає йти на поступки, і поточна ситуація має всі шанси перерости в справжню громадянську війну..."
 lar_spain.22.desc:0 "[From.GetAdjective] уряд просить надати йому матеріальну допомогу у боротьбі з республіканцями. Громадянська війна виявилася особливо руйнівною і призвела до величезних витрат. Нас запевняють, що будь-яка надана допомога буде безцінною для боротьби з комунізмом."
 lar_spain.49.a:0 "Ми з радістю вітаємо нових прихильників справи анархізму!"
 lar_spain.67.desc:0 "Схоже, що [From.GetAdjective] уряд швидко забув, кому він зобов'язаний своєю нещодавньою перемогою у громадянській війні. Сьогодні вранці весь зв'язок із нашими представниками в державі [From.GetNameDef] раптово перервався, [From.GetLeader] мовить через підконтрольні ЗМІ і поширює пропаганду, явно підбурюючи [From.GetAdjective] народ на чергову війну.\n\nПізніше цього ранку до Москви було доставлено офіційне оголошення про незалежність."
 lar_spain.74.b:0 "Ми мусимо ревно охороняти свою перевагу."
 lar_spain.77.desc1:0 "Останній король Іспанії Альфонсо XIII, який жив у засланні з часів проголошення Другої республіки в 1931 р., помер сьогодні в Римі. Він помер від проблем із серцем у порівняно молодому віці. У зв'язку з його статусом засланця та поточною ситуацією в державі [Root.GetNameDef] очікується, що саме в Римі і буде похований король. Перший і другий сини Альфонсо вже відмовилися від прав на престол у 1933 р., через що трон, ймовірно, успадкує його третій син, інфант Хуан, при цьому ходять чутки, що другий син покійного короля, інфант Хайме, подумує повернути собі право наслідування."
 lar_spain.78_tt:0 "§YПомер Хосе Санхурхо§!\n"
 lar_worker_shortage.1.a:0 "Можливо вони могли б наймати жінок?"
 lar_worker_shortage.1.desc:0 "Після продовження набору солдатів і заклику раніше звільнених від нього трудящих багато компаній повідомляють, що відчувають нестачу працівників. Вона вплинула навіть на збройові підприємства, знизивши їхню продуктивність.\n\nЕксперти-промисловці вимагають від уряду знайти нові джерела людських ресурсів і або повернути на заводи людей, вже покликаних на військову службу, або кимось замінити робітників, що пішли до армії."
 lc_hull_mounted_railway_gun_desc:0 "Перероблена залізнична гармата, вбудована безпосередньо в корпус для максимальної стабільності, забезпечує потужну вогневу підтримку і може вражати віддалені цілі з високою точністю."
 leftist_freemason:0 "Лівий масон"
 legitimacy_gain_factor_tt:0 " $MODIFIER_LEGITIMACY_FACTOR$: $RIGHT|+=%1$"
 lend_lease:0 "Ленд-ліз"
 leningrad_polytechnical_institute:0 "Ленінградський індустріальний інститут"
