 GER_first_ljubljana_award_desc:0 "Лицемірні західні держави свідчать про право народів на самовизначення, віддаючи меншості під владу сербів. У нас є можливість виправити цю історичну несправедливість і заодно знайти нових друзів. Новий європейський порядок буде щедрий із тими, хто вирішить до нас приєднатися."
 GER_first_ljubljana_award_other:0 "Перший Люблянський арбітраж"
 GER_focus_on_the_true_enemy_desc:0 "Наш головний ворог не всередині, а ззовні. Численні злочини західної колоніальної монополії затьмарює лише несправедливість Версальського договору, який був нав'язаний нам після нашої спроби зайняти своє місце під сонцем. Його час закінчився."
