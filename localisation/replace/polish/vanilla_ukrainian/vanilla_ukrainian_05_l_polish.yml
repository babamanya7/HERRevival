 HYD_communism_DEF:0 "Червона республіка південної Індії"
 HouseElectionLost:0 "втратила [?ror_loc] місць"
 ICE_a_profesional_army_desc:0 "Наразі армія занадто слабка, щоб належним чином захистити наш острів, і єдиний спосіб вирішити цю проблему — переконатися, що наша армія складається лише з найкращих людей, які будуть боротися до переможного кінця."
 ICE_emergency_conversions_desc:0 "Хоча країна не обов'язково має можливість будувати важкі кораблі, у нас є багато великих рибальських суден, торгових суден і суден приватних підприємств. У разі надзвичайної ситуації ми можемо розмістити на них кулемети або легкі гармати і швидко та ефективно створити достатньо великі військово-морські сили, щоб конкурувати з більшістю суперників."
 ICE_hot_tempered_reformer:0 "Гарячковий реформатор"
 ICE_modernizing_the_coast_guard_desc:0 "Берегова охорона Ісландії вже давно є нашою основною силою, яка використовується для забезпечення як внутрішньої, так і зовнішньої безпеки. Тому ми повинні переконатися, що вони можуть йти в ногу зі швидкими темпами модернізації і технологічного прогресу."
 ICE_political_unity_desc:0 "У часи небезпеки надзвичайно важливо, щоб нація трималася разом. Ми повинні відкласти наші політичні розбіжності в сторону і зробити все можливе, щоб уберегти [ROOT.GetName] від війни."
