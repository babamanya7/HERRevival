 CHI_sea_military_affairs_commission:0 "$CHI_military_affairs_commission$"
 CHI_sea_modern_warfare_desc:0 "Майбутнє війни не за тими орієнтованими на піхоту арміями, які ми маємо сьогодні. Щоб наші вороги не переграли та не знищили нас, ми повинні інвестувати в нові технології."
 CHI_sea_taiyuan_arsenal_desc:0 "$CHI_taiyuan_arsenal_desc$"
 CHI_sea_tank_plant_desc:0 "$CHI_tank_plant_desc$"
 CHI_sea_unified_industrial_planning:0 "$CHI_unified_industrial_planning$"
 CHI_second_father_of_the_nation_desc:0 "Доктор Сунь Ятсен дозволив нам скинути кайдани Цін і назавжди залишиться Першим батьком нашої нації. Генералісимус Чан очистив партію від комуністів, і за це його завжди пам'ятатимуть як Другого батька."
 CHI_secure_internal_politics_desc:0 "Щоб наш уряд зміг уціліти в сум'ятті китайської політики, ми не можемо дозволити собі відволікатися на внутрішні чвари. Потрібно поставити хрест на всій внутрішній опозиції."
 CHI_secure_the_peninsula_desc:0 "У наших інтересах вжити заходів для того, щоб Корейський півострів більше ніколи не опинився під владою ворожої держави."
 CHI_setting_a_new_standard_desc:0 "Наша армія була занадто під впливом західної думки та доктрини, але ми країна Сунь-цзи, а не Клаузевіца. Через структурні зміни та ідеологічну роботу ми перебудували наші збройні сили за власним образом."
 CHI_song_zheyuan:0 "Song Zheyuan"
 CHI_start_looking_outwards:0 "Почати дивитися назовні"
 CHI_state_support:0 "§HБільшість в областях§!: [scope_CHI.GetFujian][scope_CHI.GetFujianPoints][scope_CHI.GetZhejiang][scope_CHI.GetZhejiangPoints][scope_CHI.GetShandong][scope_CHI.GetShandongPoints][scope_CHI.GetJiangsu][scope_CHI.GetJiangsuPoints][scope_CHI.GetJiangxi][scope_CHI.GetJiangxiPoints][scope_CHI.GetXikang][scope_CHI.GetXikangPoints][scope_CHI.GetHunan][scope_CHI.GetHunanPoints][scope_CHI.GetGuizhou][scope_CHI.GetGuizhouPoints][scope_CHI.GetSichuan][scope_CHI.GetSichuanPoints][scope_CHI.GetAnhui][scope_CHI.GetAnhuiPoints][scope_CHI.GetHenan][scope_CHI.GetHenanPoints][scope_CHI.GetBeijing][scope_CHI.GetBeijingPoints][scope_CHI.GetShanghai][scope_CHI.GetShanghaiPoints][scope_CHI.GetHebei][scope_CHI.GetHebeiPoints][scope_CHI.GetHubei][scope_CHI.GetHubeiPoints][scope_CHI.GetShanxi][scope_CHI.GetShanxiPoints][scope_CHI.GetSuiyuan][scope_CHI.GetSuiyuanPoints][scope_CHI.GetShaanxi][scope_CHI.GetShaanxiPoints][scope_CHI.GetGansu][scope_CHI.GetGansuPoints][scope_CHI.GetQinghai][scope_CHI.GetQinghaiPoints][scope_CHI.GetNingxia][scope_CHI.GetNingxiaPoints][scope_CHI.GetTaklamakan][scope_CHI.GetTaklamakanPoints][scope_CHI.GetUrumqi][scope_CHI.GetUrumqiPoints][scope_CHI.GetDzungaria][scope_CHI.GetDzungariaPoints][scope_CHI.GetYarkand][scope_CHI.GetYarkandPoints][scope_CHI.GetYunnan][scope_CHI.GetYunnanPoints][scope_CHI.GetHainan][scope_CHI.GetHainanPoints][scope_CHI.GetGuangzhou][scope_CHI.GetGuangzhouPoints][scope_CHI.GetGuangdong][scope_CHI.GetGuangdongPoints][scope_CHI.GetNanning][scope_CHI.GetNanningPoints][scope_CHI.GetGuangxi][scope_CHI.GetGuangxiPoints]"
 CHI_super_heavy_tank_aa_equipment_1:0 "PGZ 44"
 CHI_tewu_idea:0 "Те'у"
 CHI_the_burma_road:0 "Бірманська дорога"
 CHI_the_german_mission_desc:0 "Понад десять років ми маємо зв'язки з Німеччиною, і ми повинні спеціально використати контакти Карсуна Чана для розширення нашої співпраці."
 CHI_the_hump_reopen_state:0 "Заново відкрити повітряний маршрут у цій області.\n"
 CHI_the_southern_mandate:0 "Південний мандат"
 CHI_the_southern_mandate_desc:0 "На півдні лежать землі, багаті на ресурси, і люди нашого роду. Ми маємо право на ці землі через наші давні зв'язки, і настав час нам рушити на південь."
 CHI_three_princpals_idea_desc:0 "Засновник республіки, доктор Сунь Ятсен, встановив три фундаментальні принципи, які повинні її формувати: Міньцзу, Міньцюань і Міньшен — Націоналізм, Демократія і Народний добробут. Ми повинні прагнути втілити ці принципи в нашому уряді."
 CHI_tsr_power_struggle_cat:0 "Боротьба за владу в Китаї"
 CHI_tsr_reclaim_the_mandate_of_heaven_desc:0 "Наші попередні перемоги у війнах за повернення імперської столиці дали зрозуміти, що саме Небо визнало Імператора справедливим і гідним Небесного трону. Будь-які сумніви щодо того, що він не є законним правителем усього Китаю, повинні зникнути перед лицем таких незаперечних доказів."
 CHI_utilize_german_contacts_desc:0 "Хоча східні варвари мають ненаситну жагу до крові, серед них є ті, хто здатний прислухатися до розуму, хоча й не від нас. Звернувшись до наших спільних контактів у Європі, ми можемо попросити їх стримати запал гарячих голів."
 CHI_war_in_liangguang_desc:0 "З початком війни в провінції Лянґуан це лише питання часу, коли наші війська втомляться воювати один з одним і захочуть пріоритетно протистояти [JAP.GetAdjective]ій загрозі разом. Якщо ми хочемо перемогти, ми повинні діяти швидко і рішуче."
 CHI_war_taxes:0 "Податки воєнного часу"
 CHI_warlord_PRC_fascism:0 "Китайська імперія"
 CHI_weng_wenhao:0 "Вен Веньхао"
 CHI_xian_warlords_upset:0 "Це роздратує місцевих правителів. Вони можуть §Rпокинути ваш альянс§!, відкинути ваші спроби встановити контроль над ними та пригадати таке ваше ставлення до них у майбутньому."
 CHL_a_new_araucanian_noble_class_desc:0 "Хоча зараз у нас є велика кількість аристократії, ми мусимо створити програми, щоби люди могли стати дворянами країни в обмін на інвестиції в державу або служіння в ім'я короля."
 CHL_abide_by_the_francoist_model_desc:0 "Хоча німці можуть мати великий вплив, нашому руху справді варто звернути увагу на ідеї середземноморських мислителів, таких як Муссоліні та Франко. Це їхня модель, яку ми мусимо наслідувати, і їхні ідеали, які ми мусимо зробити нашими власними."
 CHL_align_the_marxists:0 "Зблизитися з марксистами"
 CHL_an_imperial_capital_desc:0 "На даний момент наша столиця — Сантьяго, те саме місто, яке було столицею старої держави Чилі. Принаймні, слід подумати, чи не краще перенести столицю в інше місце."
 CHL_an_imperial_capital_tt:0 "Ми отримаємо варіант зберегти §YСантьяго§! нашою столицею та отримаємо §G2§! комірки для будівництва або перемістимо столицю в §YТемуко§! та отримаємо §G4§! комірки."
 CHL_annex_and_core_all_american_subjects:0 "Усі §Yамеріндські та полінезійські країни-суб'єкти§! буде §Yанексовано§!, а їхні землі стануть §Yосердні§!."
