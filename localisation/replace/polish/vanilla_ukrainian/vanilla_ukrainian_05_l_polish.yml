 ITA_grand_council_side:0 "[GetGrandCouncilName]"
 ITA_greece_war_goal_desc:0 "Яку Римську імперію ми відновлюємо, якщо не включимо в неї Грецію? Вона не має стати складною мішенню..."
 ITA_has_new_duce_flag:0 "Був скинутий §YВеликою радою§!"
 ITA_heavy_tank_artillery_equipment_2:0 "Semovente da 149/40"
 ITA_improve_the_industries:0 "Поліпшити індустрії"
 ITA_improve_the_industries_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §G+5.00%§!\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+5.00%§!\n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+5.00%§!\n\n"
 ITA_increase_artillery_production_desc:0 "Велика війна була насамперед війною артилерії. Ми мусимо припустити, що наступна війна також буде вестися переважно артилерією. Ми не можемо дозволити собі відставати в цій галузі."
 ITA_infantry_equipment_2_short:0 "MAB-38"
 ITA_irregulars_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+5.00%§!\n\n"
