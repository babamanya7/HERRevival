 tfv_australia.10.b:0 "Територія [Root.GetAdjective] залишиться в [Root.GetAdjective]их руках!"
 tfv_australia.10.t:0 "[From.GetNameDefCap] пропонує захист для наших колоній"
 tfv_australia.82.d:0 "Незважаючи на наше приєднання до авангарду світової сцени, держава [From.GetNameDef] відмовилася визнати нашу важливість у регіоні Західної Тихого океану.\nНе тільки [From.GetAdjective]ий уряд відмовив нам напроти: вони неодмінно висловили, що їхня доктрина «Наншін-рон» цілком могла б вивести їх за межі Індонезії, до самого Австралійського континенту."
 tfv_australia.92.desc:0 "[AST.GetLeader] приїхав до Британії, щоб узяти участь у церемонії одруження короля Едуарда VIII та Уолліс Сімпсон. Після кількох тижнів обідів, вечерь, вечірок у саду, прийомів і ще більше вечерь, йому нарешті вдалося отримати приватну аудієнцію з новим королем.\n\nПісля обміну люб'язностями та світської бесіди, тема розмови переходить до політики. Король виголошує довгу тираду про солідарність Співдружності та вірність батьківщині, і коли він переходить до континентальної політики, [AST.GetLeader] не може не відчувати себе трохи незручно. Король запитує, що він може зробити, щоби допомогти державі [AST.GetNameDef] та прихилити до себе людей."
 tfv_canada.11.d:0 "Скинувши з себе залишки буржуазії, що підтримувалася століттями колоніального насильства, ми нарешті вийшли на світову арену. Ми стоїмо пліч-о-пліч із державою [From.GetNameDef] у складі альянсу [From.GetFactionName], і ми прагнемо поширити світову революцію в усі куточки земної кулі!"
 tfv_canada.22.t:0 "Європа гниє"
 tfv_canada.62.a:0 "[ROOT.GetNameDefCap] стане єдиною!"
 tfv_canada.63.t:0 "[CAN.GetNameDef] пропонує поступки в обмін на Ньюфаундленд"
 tfv_new_zealand.2.desc:0 "Після ретельного розгляду Центральний комітет Комінтерну схвалив наше прохання про членство."
 tfv_new_zealand.4.a:0 "Допоки вони знають своє місце."
 tfv_new_zealand.7.a:0 "Нам його не вистачатиме."
 tfv_new_zealand.9.t:0 "[From.GetNameDefCap] просить контроль над [Root.GetAdjectiveCap]ою Полінезією"
 tfv_south_africa.102.d:0 "Звільнившися з-під влади колоніальних гнобителів, [MOR.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [MOR.GetAdjective]ого уряду."
 tfv_south_africa.20.b:0 "Прийняття їхньої заявки в цей час тільки відкриє ризик конфлікту в далекому регіоні."
 tfv_south_africa.30.a:0 "У нас немає вибору. У нас важливіші питання."
