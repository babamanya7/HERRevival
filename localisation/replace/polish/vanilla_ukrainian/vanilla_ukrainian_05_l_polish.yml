 GER_light_cruiser_4_desc:0 "Крейсери класу «Q» були модифікованою версією крейсера класу «M». Вони були спроєктовані більшими, ніж крейсери класу «M», з важчим зенітним озброєнням і покращеним управлінням вогнем."
 GER_light_tank_artillery_equipment_3_short:0 "WT Leopard"
 GER_marinestosstrupp_desc:0 "Нам потрібно сформувати підрозділ морської піхоти, так звані морські ударні війська, здатні здійснювати сміливі морські вторгнення і проривати берегову оборону противника, якщо ми хочемо поширити нашу владу за море."
 GER_medium_tank_destroyer_equipment_2_desc:0 "Jagdpanzer IV служив у протитанкових батальйонах звичайних танкових дивізій і танкових дивізій SS. Вони воювали в Нормандії, Арденнській операції та на Східному фронті. Вони були дуже успішними винищувачами танків, але показали себе погано, якщо їх не використовували як замінники танків або штурмових гармат, як це було в більшості винищувачів танків. Однак на пізніх етапах війни їх все частіше використовували як заміну танкам, оскільки часто нічого іншого не було."
 GER_middle_eastern_trade_cat:0 "Близькосхідні торговельні переговори"
 GER_mio_trait_hoesch_facilities:0 "Потужності підприємства «Hoesch»"
 GER_mitteleuropa_economic_integration_cat_desc:0 "Наш європейський митний союз поки що був успішним, але він має більше ролей, про які наші союзники не знають. Завдяки подальшій інтеграції їхніх економік із нашою, ми зрештою зможемо зробити їх повністю залежними від нас, фактично перетворивши їх на наших підданих."
