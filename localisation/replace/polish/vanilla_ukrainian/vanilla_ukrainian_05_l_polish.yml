 AST_a_rational_request_desc:0 "Сінгапурська стратегія працює в теорії і тільки там. Генрі Вінтер та інші рішучі голоси мали рацію від самого початку; Британія, швидше за все, буде зайнята на своєму власному континенті, якщо вибухне тихоокеанська війна, стратегія, побудована на британській допомозі не витримає. Ми вимагатимемо контролю над Сінгапуром, щоб самі відповідати за оборону наших океанів."
 AST_a_sense_of_place_upgraded:0 "Відчуття Батьківщини"
