 ITA_italian_hegemony_master_2_desc:0 "$ITA_italian_hegemony_master_1_desc$"
 ITA_italian_irredentism_ns_desc:0 "Щоб [ITA.GetNameDef] повністю розкрила свій потенціал і могутність, ми повинні розширитися до наших природних кордонів і об'єднати всі території, які по праву належать італійському народу!"
 ITA_joint_military_programs_one_ally_tt:0 "Ефекти будуть подвоєні, якщо §Y[ROOT.GetNameWithFlag]§! знаходитиметься в одному альянсі і з державою §Y[ENG.GetNameWithFlag]§!, і з державою §Y[FRA.GetNameWithFlag]§!."
