 BALTIC_balticwall_desc:0 "Укріплення на сході марні, якщо вороги вирішать атакувати з моря! Нехай у нас ніколи не буде флоту під стати британському, німецькому чи радянському, але ми зможемо зробити все, щоб чужі кораблі були безсилі проти наших берегових укріплень."
