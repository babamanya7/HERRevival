 FRA_full_employment_desc:0 "Ми знаходимось у завидному положенні: рівень безробіття в нас дуже низький, частково через масове кровопролиття під час Великої війни. Однак це ускладнило пошук кваліфікованих працівників для компаній, а військовим важко конкурувати з ринком праці для новобранців. Розширення проєкту лише посилить проблему. Ми мусимо спробувати знайти інші джерела робочої сили, щоби заповнити нестачу чи то в наймі, чи в економіці."
