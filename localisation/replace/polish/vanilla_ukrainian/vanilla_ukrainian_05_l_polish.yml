 BRA_paraguay_intervention:0 "Інтервенція в Парагваї"
 BRA_promoting_communism_desc:0 "Бразилія намагається впливати на нашу політику, підтримуючи різні комуністичні групи."
 BRA_purchase_soviet_equipment:0 "Придбати радянське обладнання"
 BRA_reach_out_to_our_neighbors_desc:0 "Ми довгий час були ізольовані від наших сусідів завдяки тому, що є єдиною португаломовною нацією на континенті. Можливо, настав час звернутися до них і спробувати налагодити кращі стосунки, замість того, щоб ставитися до них з підозрою."
 BRA_reinvigorate_the_navy_desc:0 "Офіцери флоту довгий час підтримували інтегралістський рух, навіть коли він був непопулярним серед громадськості. За їхню довготривалу підтримку ми збільшимо фінансування, щоб вони могли розпочати процес відродження старіючого флоту."
 BRA_ship_light_battery_3:0 "127mm/38 Mk 12 SP RPC"
 BRA_soviet_economic_aid_desc:0 "Після років управління лідерами з іншими ідеями, ніж наші, наша економіка не там, де ми хотіли б її бачити. Щоб прискорити процес її відновлення до бажаного стану, ми повинні розглянути можливість пошуку допомоги від інших країн зі схожим до нашого світоглядом."
 BRA_stability_and_unity_desc:0 "Завдяки ретельному політичному маневруванню нам вдалося створити сильнішу і все більш єдину республіку. На цьому фундаменті ми продовжимо захищати громадян нашої великої країни."
