 south_american_events.30.desc:0 "З недавнім поваленням [FROM.GetAdjective] уряду комуністичними силами, у нашій нації зростає тиск на рішучу відповідь. ЗМІ переповнені гіперболічними повідомленнями про червону загрозу та небезпеку, яку [FROM.GetNonIdeologyName] становить для наших інтересів. Тим часом власники бізнесу вимагають відплати за свої втрачені інвестиції в країні. \n\nМи повинні діяти швидко, щоб заспокоїти громадськість і надіслати чітке повідомлення [FROM.GetNonIdeologyName], що ми не потерпимо комунізму в цій півкулі."
 south_american_news.3.d:0 "Ґабріель Терра, президент Уругваю, оголосив минулого тижня про проведення виборів і відхід від влади, яку він продовжив шляхом державного перевороту в 1933 році. Відтепер влада перейде до лідера Національної партії Уругваю Луїса Альберто де Ерреру."
