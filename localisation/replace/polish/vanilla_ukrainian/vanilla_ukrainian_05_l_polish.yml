 SEA_PHI_political_events.56.d:0 "Нехай займаються Тихим океаном, але надішліть наглядача"
 SEA_PHI_political_events.60.a:0 "Мабуть, просто не вміє програвати"
 SEA_PHI_political_events.60.t:0 "Агінальдо ставить під сумнів результати виборів"
 SEA_PRC_faction_events.72.desc:0 "[FROM.GetNameDefCap] запропонував звільнити нас — за однієї умови: Наша незалежність буде надана лише в тому випадку, якщо ми приєднаємося до новоствореного [PRC.GetFactionName] під проводом [FROM.FROM.GetNameDef]."
 SEA_PRC_faction_events.91.t:0 "[FROM.GetNameDefCap] відхиляє нас"
 SEA_PRC_fourth_army_incident.12.desc:0 "У відповідь на лист з вибаченнями, [FROM.GetNameDef] неохоче визнав це достатнім вирішенням інциденту з Новою 4-ю армією."
 SEA_PRC_political_events.26.a:0 "Подивимося, які пропозиції вони можуть мати"
 SEA_PRC_political_events.27.a:0 "Вони роблять помилку"
 SEA_PRC_political_events.31.t:0 "[FROM.GetNameDefCap] погоджується на територіальні гарантії — за певну ціну"
 SEA_PRC_request_aid.21.desc:0 "Вантаж прибув до [ROOT.Capital.GetName] з [SOV.GetNameDef], доставивши наші 150 новозбудованих танків Т-34. Серед тих, хто приймав вантаж, були представники уряду [ROOT.GetName], а також провідні офіцери Сухопутних військ НВАК. Оглядаючи танки, пофарбовані емблемою НВАК, офіцери прагнули розгорнути їх — після періоду навчання та ознайомлення для танкових екіпажів."
 SEA_PRC_request_aid.31.desc:0 "Оскільки [FROM.GetNameDef] не має промислових потужностей і досвіду для створення бронетанкових військ, [FROM.GetLeader] надіслав запит на нашу допомогу. [FROM.GetNameDefCap] конкретно просить наші легкі танки БТ-7, посилаючись на їхню чудову швидкість по пересіченій місцевості. Як нам відповісти?"
 SEA_PRC_request_aid.34.a:0 "Чудово! Ми знайдемо їм гарне застосування, коли б вони не прибули"
 SEA_PRC_request_aid.8.a:0 "Як шкода!"
 SEA_PRC_zhang_guotao_events.6.a:0 "Зрадник!"
 SEA_border_incidents_events.1.a:0 "Село буде нашим!"
 SEA_china.14.b:0 "Ми не можемо прийняти це, до зброї!"
 SEA_china.21.t:0 "[FROM.GetName] кидає виклик Пекіну"
 SEA_china.25.d:0 "Вони не заслуговують на допомогу"
 SEA_china.26.a:0 "Ми крокуємо до перемоги"
 SEA_china.27.desc:0 "На жаль, [SOV.GetNameDef] вирішив не надсилати нам необхідну допомогу. Хоча ми не знаємо причини відмови в цьому незначному проханні, схоже, нам доведеться шукати інші шляхи..."
 SEA_china.28.b:0 "Ніколи!"
 SEA_china_democratic.1.d:0 "Цзен Ці має отримати цю можливість"
 SEA_china_democratic.2.a:0 "Разом ми будемо сильнішими"
 SEA_china_democratic.2.desc:0 "Делегація з далеких країв нещодавно прибула до нашої столиці, вимагаючи аудієнції у [ROOT.GetLeader]. Вони стверджують, що прибули від [FROM.GetNameDef], і прагнуть укласти союз між нашими країнами. Чи приймемо ми пропозицію?"
 SEA_china_democratic.20.desc:0 "[FROM.GetLeader], президент [FROM.GetNameDef], надіслав нам офіційну вимогу розпочати впровадження принципу Міньцюань на підконтрольній нам території. Це неодмінно наблизить нас до Республіки та сприятиме нашому розвитку."
 SEA_china_democratic.6.desc:0 "До нашої уваги дійшло, що в нашій країні діють [FROM.GetAdjective]і осередки, які поширюють республіканські настрої. Хоча це здається досить нешкідливим, виглядає так, що частина пропаганди має досить революційний характер. Повідомлення про те, що робітників закликають організовуватися та об'єднуватися, стають все частішими, і, судячи з недавньої історії, ми не можемо бути певними, що це не хитрий план [FROM.GetAdjective]ого керівництва з метою нашої остаточної інтеграції."
 SEA_generic_events.15.t:0 "[GetOppositionPartyAdjective] протести переросли в насильство"
 SEA_generic_events.6.desc:0 "Скандал за участю урядовців, лояльних до [ROOT.GetRulingParty], вийшов на світло після того, як було знайдено документ, що викладав їхні плани підірвати [GetOppositionPartyName] шляхом саботажу їхнього фінансування. Хоча чиновники діяли незалежно, це не те, у що повірять [GetOppositionPartySupportersName]."
 SEA_generic_events.9.a:0 "Публічно оголосити [GetOppositionPartyName] іноземними агентами"
 SEA_imperial_influence_demand_event_option_8:0 "Доля нікого не чекає"
 SEA_imperial_influence_events.1.c:0 "Відкинути фракцію Дзайбацу"
 SEA_japan_foreign_policy.112.a:0 "Це дозволить нам зосередити зусилля на інших напрямках"
 SEA_japan_foreign_policy.115.desc:0 "Скориставшись нашою слабкістю, [From.GetAdjective]ий уряд запропонував «допомогти» нам з «підтриманням порядку» в наших колоніях. Вони стверджують, що, оскільки світ палає в інших місцях, ми не маємо можливості утримувати контроль над цими регіонами.\n\nЦе явно хитрість, щоб вирвати контроль над нашими колоніями у нас, але який у нас вибір?"
 SEA_japan_foreign_policy.119.desc:0 "[FROM.GetLeader] люб'язно прийняв нашу пропозицію офіційно оформити альянс між нашими державами і вже розпочав ініціативи щодо інтеграції в нашу сферу. Сьогодні день для святкування!"
 SEA_japan_foreign_policy.122.t:0 "Обмін [From.GetAdjective]ими генералами"
 SEA_japan_foreign_policy.126.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися до нас"
 SEA_japan_foreign_policy.128.t:0 "[FROM.GetLeader] вимагає нашої покори"
 SEA_japan_foreign_policy.136.a:0 "Цей день увійде в історію як ганьба!"
 SEA_japan_foreign_policy.4.c_tt:0 "We will be asked to respond once the limited war is over."
 SEA_japan_foreign_policy.48.desc:0 "Промисловці, що належать до [FROM.GetNameDef], почали розвивати нашу місцеву промисловість і засновувати нові корпорації в межах наших кордонів. Це неодмінно наблизить нас до процвітання."
 SEA_japan_foreign_policy.59.desc:0 "Сьогодні [ROOT.GetLeader] та різні командувачі [JAP.GetAdjective]ої армії зробили спільну прокламацію, оголосивши про створення нової [ROOT.GetAdjective]ої держави. Ми переможемо всіх наших ворогів!"
 SEA_japan_foreign_policy.64.t:0 "[FROM.GetNameDefCap] об'єднується з нами"
 SEA_japan_foreign_policy.70.t:0 "Японія вимагає нашої умовної капітуляції"
 SEA_japan_foreign_policy.71.t:0 "[FROM.GetNameDefCap] відмовляється капітулювати"
 SEA_japan_foreign_policy.80.desc:0 "Асоціація Конкордія, керівна еліта держави [FROM.GetNameDef], погодилася на нашу пропозицію і готова в найближчому майбутньому управляти регіоном як невіддільною частиною нашої держави. Схоже, наші плани щодо об'єднання зможуть просуватися без перешкод."
 SEA_japan_foreign_policy.98.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] добре відреагував на нашу пропозицію щодо дешевшої торгівлі між нашими країнами і підписав необхідні документи, щоб це набуло чинності негайно. Вони поділяють наше бачення світлого майбутнього для всієї Азії!"
 SEA_japan_foreign_policy.99.a:0 "Як це жалюгідно!"
 SEA_japan_foreign_policy.99.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] різко відреагував на наше прохання про дешевшу торгівлю в межах нашого альянсу, погрожуючи запровадити мита, якщо ми спробуємо просунути це питання силою. Схоже, [FROM.GetNameDef] не буде частиною світлого майбутнього, яке ми задумали."
 SEA_japan_popup_events.26.desc:0 "Оскільки в Японії зараз вирує громадянська війна між військовими та урядом, Квантунська армія, розквартирована в нашій країні, скористалася нагодою здійснити військовий переворот проти нашого власного уряду, сподіваючись закріпити свою феодальну державу польових командирів у Маньчжурії. Чи дозволимо ми цьому статися, чи будемо чинити опір усім, що маємо?"
 SEA_japan_popup_events.28.desc:0 "Комуністична партія вирішила розпочати підпільні операції подалі від очей як Імперської армії, так і уряду. Єдине питання, яке зараз постає перед ними: який регіон є достатньо віддаленим, де ймовірність бути виявленими та знищеними була б якомога меншою?"
 SEA_japan_popup_events.30.t:0 "Дебати про майбутній напрямок розвитку держави"
 SEA_japan_popup_events.43.a:0 "Як вони сміють іти проти волі Імператора?"
