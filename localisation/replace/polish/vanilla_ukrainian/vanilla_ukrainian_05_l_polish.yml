 BRA_bonus_tech_slot:0 "Національний технологічний фонд"
 BRA_consolidation_of_labor_laws_fallback_tt:0 "Залежно від попередніх виборів фокусу, змінить національні духи §Y$BRA_estado_novo_modifier$§! або §Y$BRA_estado_moderno_modifier$§! наступним чином:"
 BRA_const_kingdom_democratic:0 "Королівство Бразилія"
 BRA_corporatism_desc:0 "Суперечки між робітниками та капіталістами надто довго підривали [BRA.GetAdjective]у економіку. Щоби побороти це, ми запровадимо нову економічну модель, засновану на корпоративістській політиці, яку останніми роками спостерігаємо в багатьох найуспішніших європейських країнах."
 BRA_deal_with_the_cangaceiro:0 "Впоратися з канґасу"
 BRA_defense_of_the_fatherland:0 "Оборона батьківщини"
 BRA_defense_spending:0 "Збільшити видатки на оборону"
 BRA_depose_vargas_desc:0 "[ROOT.GetLeader] став тягарем. Хоча він є вмілим політиком, є межа тому, що народ буде терпіти від однієї людини. Якщо ми хочемо уникнути повернення до злиднів, ми повинні усунути його та замінити більш прийнятним лідером з армії."
 BRA_deposed_former_president:0 "Усунутий колишній президент"
 BRA_desenvolvimentismo:0 "Desenvolvimento"
 BRA_destroyer_4_desc:0 "The Acre-class (sometimes referred to as the Amazonas class) represents six destroyers built for the Brazilian Navy. None were completed before the end of the war. The ships were built in Brazil using a modified British design and some U.S. equipment to replace the six Juruena-class destroyers requisitioned by Britain at the start of the war."
 BRA_empire_of_brazil_and_portugal_neutrality_DEF:0 "Бразильсько-португальська імперія"
 BRA_equality_for_women:0 "Пролетарська рівність"
 BRA_establish_companhia_vale_do_rio_doce_desc:0 "У штаті Мінас-Жерайс, особливо в регіоні Ітабіра, виявлено великі залізорудні жили й інші багаті родовища корисних копалин. Ми маємо забезпечити, щоби штат міг видобувати ці ресурси та освоювати ці родовища, створивши нову компанію, основною метою якої буде саме це."
 BRA_estado_moderno_modifier:0 "Estado Moderno"
 BRA_german_subs_desc:0 "Об'єднання з німцями дозволило нам використовувати їхні технології в тих галузях, у яких ми раніше намагалися модернізуватися, і одна з таких галузей — це підводні човни. Ми використаємо наших новоспечених союзників і здобудемо контроль над рівниною Кабу-Верде!"
 BRA_integralist_support:0 "Мітинг інтегралістів в області [FROM.GetName]"
 BRA_invest_in_ports_desc:0 "Ми досягли значного прогресу у задоволенні внутрішніх потреб нашої економіки до такої міри, що можемо знову розглядати експорт як засіб сприяння економічному зростанню. Для цього нам потрібно інвестувати у головні порти нації."
