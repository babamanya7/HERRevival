 form_european_union_category_desc:0 "Хоча концепція політично об'єднаної Європи лише за останні кілька десятиліть набула будь-якої видимості, наше нещодавнє завоювання наймогутніших держав континентальної Європи представляє нам цю несподівану реальність. Можливо, потрібна реструктуризація нації, щоби повністю скористатися можливостями, які вона нам пропонує."
 form_nordic_nation_flag:0 "НЕ прийнято рішення сформувати §YІмперію Північного моря§!, §YНордичний Союз§! чи §YДомініон Балтійського моря§!"
