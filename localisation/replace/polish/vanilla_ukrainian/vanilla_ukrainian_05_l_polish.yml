 SIA_domestic_arms_industry_desc:0 "Королівство, яке змушене імпортувати кожну гвинтівку і снаряд, не може називати себе безпечним. Якими б скромними не були її починання, вітчизняна військова промисловість дозволить [ROOT.GetNameDef] озброювати своїх солдатів із власних майстерень і вистояти, коли іноземне постачання припиниться."
