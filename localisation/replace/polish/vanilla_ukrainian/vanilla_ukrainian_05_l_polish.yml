 germany.85.desc.a:0 "Антирадянський пакт зобов'язує всі держави, що підписали його, приєднатися до всякої оборонної війни з Радянським Союзом. Нещодавно СРСР напав на державу [From.GetName] і тепер вона надіслала всім членам пакту запит про негайну допомогу у війні. Час показати [Root.GetAdjective]у відданість захисту світу від радянської загрози раз і назавжди."
 germany.91.d:0 "Сильні лідери Франсистського руху зробили немалий прогрес і запропонували стати на наш бік. Французька нація готова боротися за Райх."
 germany.93.a:0 "Ми отримаємо своє."
 germany_mefo_bills.3.desc:0 "Хоча наші зусилля з переозброєння лише посилюються, так само зростає і тягар фінансування цих програм. Військове виробництво зараз забирає значну частину державного бюджету, і все більше людей занепокоєні стабільністю нашої економіки. Якщо ми не зможемо зменшити військові витрати, це серйозно зашкодить нашій економіці."
