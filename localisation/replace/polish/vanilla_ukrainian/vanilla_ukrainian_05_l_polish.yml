 RAJ_spitfire_desc:0 "Відомі своєю швидкістю та маневреністю, Spitfire-и складуть ядро наших сучасних повітряних сил, забезпечуючи домінування в небі та грізну відповідь на будь-яку повітряну загрозу."
 RAJ_the_dominion_of_india_desc:0 "Зі стійким відновленням порядку на субконтиненті, настав час зайняти наше місце серед наших імперських побратимів як лояльний та самоврядний домініон Імперії. \nХай живе король!"
 RAJ_the_legacy_of_babur:0 "Спадщина Бабура"
 RAJ_trade_federation_of_india_desc:0 "Ми досягли історичного зростання в останні роки та досягли рівня політичної влади, про який більшість корпорацій могли лише мріяти. Однак деякі штати під нашим контролем все ще не погоджуються з правлінням компанії, можливо, величезний приплив грошової компенсації зможе їх переконати?"
