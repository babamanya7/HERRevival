 nsb_coup.1.desc:0 "Після кількох тижнів ретельного планування група офіцерів, на чолі яких стоїть [Root.GetLeader], втілила сьогодні в життя план, відомий як [Root.GetOperationName], із захоплення контролю над урядом.\n\nДовгі приготування окупилися, і всі війська, чиєю лояльністю користується [Root.GetLeader], змогли швидко захопити всі важливі урядові будівлі. Місцева гвардія і поліція, зіткнувшись з явною перевагою супротивника, здалися, не зробивши жодного пострілу. дали втекти жодному міністру.\n\nТепер, коли колишній уряд перебуває під вартою, [Root.GetLeader] ставить всю державу [Root.GetNameDef] перед фактом. Очікується, що влада на місцях швидко підкориться новому уряду."
