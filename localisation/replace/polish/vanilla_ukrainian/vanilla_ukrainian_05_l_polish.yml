 SMB_air_doctrine_desc:0 "[SMB_air_doctrine_desc_key]"
 SMB_department_of_propaganda_default_desc:0 "Світ у вогні, і, незважаючи на наші найбільші зусилля, не все наше цивільне населення підтримує рух війни. Тому ми мусимо створити відділ, який би переконував людей у перевагах збройної міжнародної боротьби."
 SMB_domestic_designs_default:0 "Вітчизняні проєкти"
 SMB_domestic_designs_desc:0 "[SMB_domestic_designs_desc_key]"
 SMB_military_facilities_desc:0 "[SMB_military_facilities_desc_key]"
 SMB_navy_desc_default:0 "Від часів Великої війни наші військово-морські сили занепали до такої міри, що багато з наших кораблів уже не придатні для використання за призначенням. Настав час інвестувати у флот і розпочати масштабну програму модернізації."
 SMB_nimble_air_force_default:0 "Спритні ВПС"
 SMB_purchase_aircraft_desc:0 "[SMB_purchase_aircraft_desc_key]"
 SMB_reescalate_the_naval_arms_race_BRA:0 "Corrida Armamentista Naval"
 SMB_regular_infantry_default_desc:0 "Хоча спорядження не менш важливе за будь-що інше, справжньою силою всякої армії є окремий солдат, який захищає свою Батьківщину, відстоює свої основні цінності та бореться за своїх близьких. Саме тому ми мусимо всіляко сприяти підвищенню бойового духу простого солдата і давати йому найкращі шанси на перемогу в найважчих битвах."
 SMB_special_forces_option_1_continuation_desc:0 "[SMB_special_forces_option_1_continuation_desc_key]"
 SMB_strategic_bombing_default_desc:0 "Війну виграють, перемагаючи ворога не лише в бою, але й підриваючи його економіку та промисловість. Саме тому стратегічні бомбардування слід уважати нашим завданням номер один під час війни."
 SMI_DEF:0 "Сапмі"
 SM_UNITS:0 "3D-війська"
 SOK_fascism_party:0 "ВПБ"
 SOL_neutrality_party:0 "СПН"
 SOM_neutrality_DEF:0 "Сомалійський султанат"
 SOV_BULWARK_BOLSHEVISM_DESC_FASCISM:0 "фашизму"
 SOV_EQUIPMENT_VERSION_4:0 "АМ"
 SOV_GREAT_RED_MENACE_DESC_EXILES:0 "загроза російського імперіалізму"
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_COMMUNIST:0 "У 1931 році надмірно пишний Храм Христа Спасителя був підірваний, щоб звільнити місце для грандіозного «Палацу Рад». Оскільки привид війни нависає над Європою, навряд чи ми матимемо ресурси для будівництва цього гіганта. Відновлення старого собору було б доречною оливковою гілкою для релігійної частини нашого населення."
 SOV_SH_battleship_2:0 "Проєкт 23-біс"
 SOV_TACKLE_COMMUNIST_THREAT_NAME_EXILES:0 "східній"
 SOV_Volgograd:0 "Волгоград"
 SOV_adjoined_battle_priests:0 "Прилеглі бойові священики"
 SOV_anti_air_equipment_1_short:0 "61-К"
 SOV_anti_air_equipment_3:0 "100-мм зенитка КС-19"
 SOV_approach_germany_desc:0 "Немає жодної причини, чому б ми не могли прийти до порозуміння з Німеччиною. Звісно, ми не зможемо мирно співіснувати з ними вічно, але німці не нападуть на нас, поки західні союзники існують у них за спиною — і ми мусимо заохотити німців розправитися з ними першими."
 SOV_attempted_to_infiltrate_our_atomic_program:0 "Спробували проникнути в нашу атомну програму"
 SOV_autonomous_soviet_republics:0 "Автономні радянські республіки"
 SOV_baku_oil_fields_tt:0 "[ROOT.GetNameDefCap] допоможе створити військову промисловість у державі [FROM.GetNameDef] в рамках підготовки до громадянської війни. В обмін [ROOT.GetNameDef] отримає §Yправа на видобуток ресурсів§! на бакинських нафтових родовищах війни.\n"
 SOV_ban_excessive_hero_worship:0 "Заборонити надмірне поклоніння героям"
 SOV_build_national_academy_of_sciences_integrated_republic_BLR_desc:0 "Ми збудуємо [BLR.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_carrier_1:0 "Клас «Измаил»"
 SOV_carrier_2:0 "«Червоне повітря»"
 SOV_committee_in_exile_tt:0 "Відмикає рішення §Y$SOV_send_supporters_abroad$§!, що дозволяє нам відправляти симулянтів у вигнання (§Gперсонажі у вигнанні не можуть бути піддані чистці§!). Персонажі у вигнанні стануть доступними, коли громадянська війна почнеться."
 SOV_cooperating_with_other:0 "Співпрацюють із іншими китайськими воєначальниками проти нас"
 SOV_develop_the_urals_desc:0 "Найбільша загроза нашій державі, ймовірно, походитиме з Європи. Розвиваючи території за Уральськими горами, ми створимо резерв промислового потенціалу, до якого буде важко дістатися навіть найдальшому бомбардувальнику."
 SOV_development_aid_for_eastern_allies:0 "Допомога в розвитку для східних союзників"
 SOV_eliminate_opposition_factionalism_tt:0 "Ідею §Y$SOV_factionalism_modifier$§! буде змінено:\n $MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!."
 SOV_eliminate_the_left_tt:0 "§Y$SOV_karl_radek$§!, §Y$SOV_ivar_smilga$§! та §Y$SOV_yevgeny_preobrazhensky$§! стануть можливими цілями сталінської чистки."
 SOV_empire_in_the_pacific_idea:0 "$SOV_an_empire_in_the_pacific$"
 SOV_experts_in_camouflage_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$\n$MODIFIER_DIG_IN_SPEED$: §G+5.0%§!\n$MODIFIER_MAX_DIG_IN$: §G+5.0§!\n$MODIFIER_CAS_DAMAGE_REDUCTION$: §G+5.0%§!\n\n"
 SOV_far_east_fortification_desc:0 "З часів війни з Японією 1905 року ми не спускаємо з регіону очей. Не секрет, що елементи японської армії дивляться на наші далекосхідні володіння з безсоромною жадібністю. Ми мусимо готуватися до конфронтації в цьому регіоні і мусимо вжити заходів, щоб уповільнити будь-яку ворожу атаку, щоби виграти час для розгортання сил із західної Росії в регіоні."
 SOV_for_the_common_good_relation:0 "$SOV_for_the_common_good$"
 SOV_forge_production_reports:0 "Підробити задовільні звіти про виробництво"
 SOV_fyp_controlled_factories_tier_4_tt:0 "Більш ніж §Y[?ROOT.SOV_fyp_factory_requirement_tier_4]§! заводів під контролем (наразі §[GetColorControlledFactoriesTier4][?ROOT.num_of_controlled_factories]§!)"
 SOV_generic_industry_relocation:0 "Перемістити промисловість із [FROM.GetName]"
 SOV_gosproyektstroy_1:0 "Госпроектстрой"
 SOV_heavy_tank_aa_equipment_1:0 "ЗСУ-12.7-4"
 SOV_heavy_tank_aa_equipment_2_short:0 "ЗСУ-37-2"
 SOV_heavy_tank_destroyer_equipment_1_short:0 "СМК"
 SOV_infantry_equipment_3_short:0 "ППС-43"
 SOV_integrate_yugoslavia:0 "Інтегрувати Югославію"
 SOV_ivan_konev:0 "Іван Конєв"
 SOV_ivan_travkin:0 "Іван Травкін"
 SOV_japanese_overtures_desc:0 "Тепер, коли наш західний фланг захищений, ми повинні подбати про східний. Японці мають багато спільного з німцями, і більше спільного з нашим новим урядом, ніж вони, можливо, хотіли б визнати. Поцікавмося, що німці думають про те, щоб надіслати їм запрошення."
 SOV_jet_tac_bomber_equipment_1:0 "Ил-28"
 SOV_jiuquan_oil_prospection_desc:0 "Наші експерти вважають, що в [756.GetName], у північній частині колишньої території [XSM.GetNeutralParty], можуть бути численні поклади нафти. Ми повинні розвивати інфраструктуру в регіоні, щоб сприяти розробці будь-які родовища, які ми знайдемо."
