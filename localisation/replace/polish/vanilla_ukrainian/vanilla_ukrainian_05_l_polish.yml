 LAT_AUS_autonomy_eu_member_DEF:0 "Європейська Латвія"
 LAT_anti_german_propaganda_desc:0 "Треба ясно дати зрозуміти: хоч наша нація і обмірковує ідеї фашизму, [GER.GetLeader] не може нами маніпулювати, а ми не маємо наміру співпрацювати з тими, хто століттями пригнічував наш народ."
 LAT_avenge_the_ancestors:0 "Помститися за предків"
 LAT_belarus_democratic_DEF:0 "Латвійсько-білоруська республіка"
 LAT_consecrate_the_brotherhood_custom_tt:0 "Станеться подія §Y[LAT.GetNameDefCap] запрошує нас до свого альянсу§!."
 LAT_equality_campaigns_desc:0 "Члени Перконкрустс виступають проти місії лідера [Root.GetLeader] створити Латвію, де сонце однаково світить над усіма латвійцями, і тому ми мусимо чітко заявити, що підтримка їхнього зверхнього наративу суперечить основним цінностям нашої нації."
