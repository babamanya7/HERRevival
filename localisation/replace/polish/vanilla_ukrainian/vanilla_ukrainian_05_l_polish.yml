 PERMISSION_NOT_FRIENDLY_DESC:0 "Необхідно для дружніх стосунків"
 PER_UNIFIED_fascism:0 "Перська імперія"
 PER_absolute_monarchy:0 "Абсолютна монархія"
 PER_anti_air_development_desc:0 "Фабрики наших міст стали мішенями ворожих бомбардувальників через їхнє бажання зірвати наші економічні та промислові досягнення. Ми повинні спрямувати ресурси на розробку наших заходів проти повітряних нальотів."
 PER_anti_air_research_boost:0 "Дослідження протиповітряної оборони"
 PER_anti_air_research_desc:0 "Наше поточне протиповітряне озброєння починає застарівати. Ми повинні докласти більше зусиль для дослідження нових технологій, які допоможуть захистити нашу націю від загроз у небі."
 PER_bolster_the_caspian:0 "Посилити Каспій"
 PER_bolster_the_caspian_desc:0 "Каспійське море може бути лише внутрішнім, але воно дозволить [SOV.GetNameDef] ще один спосіб проникнення на нашу територію, якщо вони вирішать вторгнутися. Дехто може сказати, що захист цього моря є безпідставним, але ми ніколи не можемо бути надто обережними щодо наших сусідів на півночі."
 PER_choose_a_shahbanu_desc:0 "Королівський рід династії Пехлеві має продовжитися, але зважаючи на молодість Мохаммеда Рези Пехлеві, у нього не було нагоди знайти дружину. Настав час йому розглянути свої варіанти та обрати жінку, яка служитиме шахбану нашої країни."
 PER_communist_events.8.a:0 "Готувати канонерки."
 PER_communist_industrialization:0 "Комітет економічного планування"
 PER_communist_liberate_pashtuns:0 "Підтримати пуштунський націоналізм"
 PER_crush_saudi_arabia_desc:0 "Наші недавні завоювання залишили нам велику кількість промислового обладнання та персоналу, які можна відправити додому для використання тут. Хоча для виконання цього завдання знадобиться велика кількість поїздів."
 PER_desert_training_desc:0 "Наша прекрасна країна [PER.GetNonIdeologyName] має різноманітну екосистему, але значна частина нашої землі складається з пустельних рівнин. Така складна місцевість вимагає особливого підходу до функціонування наших військових, і тому ми повинні прагнути спеціалізувати нашу підготовку на тому, як виживати та перетинати пустельні ландшафти."
 PER_develop_cities:0 "Розвивати великі поселення"
 PER_establish_air_academy:0 "Створити Повітряну академію"
 PER_establish_nuclear_program_desc:0 "Секрети атома були досліджені [GER.GetNameDef] та [USA.GetNameDef] протягом досить тривалого часу. Отримавши нотатки та дослідницькі документи від наших [USA.GetAdjective] друзів, вони офіційно допомогли нам створити нашу власну ядерну програму."
 PER_establish_opposition_hq_tt:0 "§YЦя держава стане нашою базою операцій і, відповідно, нашою столицею у разі початку громадянської війни проти шаха.§!"
 PER_fascist_attack_afghanistan_desc:0 "Значне іранське населення перебуває в пастці за межами наших кордонів під контролем пуштунів у [AFG.Capital.GetCapitalVictoryPointName]. Така образа нашої територіальної цілісності більше не буде терпітися."
 PER_fascist_events.1.desc:0 "Імперська рада скликалася, щоб вирішити, кому буде запропонована престижна роль шаха. Деякі виступають за відновлення династії Каджарів, інші пропонують залишити Пехлеві на троні, щоб забезпечити легітимність в очах народу. Тим часом лоялісти партії виступають за створення нової династії."
 PER_finding_a_shah:0 "Пошук шаха"
 PER_foreign_schools_bonus:0 "Націоналізовані іноземні школи"
 PER_found_iranian_shipyards:0 "Заснувати Іранські верфі"
 PER_fund_state_intelligence_idea:0 "Фінансування державної розвідки"
 PER_future_of_war_idea_desc:0 "Неможливо заперечити, що танк є символом майбутнього війни. Спрямувавши наші ресурси на розвиток бронетанкової техніки, ми успішно підготувалися до участі в сучасній війні."
 PER_gulf_hegemony_idea_desc:0 "Завдяки обережним маневрам ми нарешті встановили себе як головну силу в регіоні Перської затоки."
 PER_imperial_events.112.desc:0 "Після того, як вдалося витіснити [SOV.GetAdjective]s і відправити їх далі назад на їхні власні землі, ми змогли звернутися до наших ворогів, щоб запросити їхніх дипломатів до Тегерана для початку мирних переговорів. На жаль, вони не були сприйнятливі до наших мирних переговорів, і в результаті війна триває."
 PER_imperial_events.12.desc:0 "Здається, [RAJ.GetAdjective] уряд не бажає відмовлятися від Белуджистану, не отримавши при цьому якоїсь компенсації. Ми можемо або виконати їхні вимоги, або просто оголосити їм війну. Вибір за вами."
 PER_imperial_events.16.t:0 "[FROM.GetNameDefCap] відмовляється віддавати Белуджистан"
 PER_imperial_events.170.desc:0 "У міру того, як війна просувалася, ми не змогли досягти наших цілей у встановлений термін. Фактично, ті, на кого ми намагалися вторгнутися, зуміли відкинути нас назад на наші власні землі. Таким чином, ми нещодавно отримали повідомлення від [FROM.GetAdjective] уряду з вимогами припинити воєнні дії. Якщо ми здамося, ми, ймовірно, страждатимемо кілька років, виплачуючи військові репарації. Ми могли б продовжувати тиснути, однак ми повинні враховувати наші власні втрати."
 PER_imperial_events.220.t:0 "Сезон виборів"
 PER_imperial_events.40.b:0 "Шах одружиться з Іран Теймурташ"
 PER_imperial_events.61.desc:0 "Хороші новини! Наш дипломат повернувся з [GER.Capital.GetCapitalVictoryPointName] з повідомленням, що [GER.GetNameDef] бажає приєднатися до нас у Пакті про ненапад. Зважаючи на цілі [GER.GetNameDef], це найкраще, що ми можемо зробити для забезпечення безпеки нашої країни."
 PER_iranian_empire_ADJ:0 "Іранськ"
 PER_islamic_council_long:0 "Ісламська рада"
 PER_lobby_military_dissidents:0 "Військова мережа Туде"
 PER_lobby_military_dissidents_desc:0 "Партія Туде має низку членів на владних позиціях у військових. Можливо, ми зможемо схилити їх до нашої справи та використати для підриву шаха, коли настане слушний час."
 PER_merchant_navy:0 "Торговий флот"
 PER_offensive_tactics_modifier:0 "Наступальна тактика"
 PER_operation_countenance_happened:0 "Операція «Зіткнення» відбулася"
 PER_push_to_deserts:0 "Північний наступ"
 PER_restoring_the_nation_idea:0 "Відновлення нації"
 PER_secure_afghanistan:0 "Забезпечити безпеку Афганістану"
 PER_technological_modifier:0 "Технологічні інвестиції"
 PER_usurp_afghanistan_desc:0 "Настав час нам нарешті поставити Кабул під [PER.GetAdjective] контроль. Просунути наші сили глибоко в гори [AFG.GetNonIdeologyName] та не повертатися, доки наш прапор не замайорить над палацом Таджбег."
 PHI_appoint_macarthur_desc:0 "З 1935 року генерал Даґлас МакАртур працював радником філіппінського уряду, однак настав час використати його навички та досвід на більш офіційній посаді і передати йому командування Збройними силами Сполучених Штатів на Далекому Сході."
 PHI_asian_trade_connections_dynamic_modifier:0 "Азійські торговельні зв'язки"
 PHI_coastal_artillery:0 "Берегова артилерія"
 PHI_cobalt_supremacy_idea:0 "Кобальтова перевага"
 PHI_coconut_scientist:0 "Вчений з кокосівництва"
 PHI_communism_party_long:0 "Комуністична партія Філіппін"
 PHI_defend_against_USA:0 "Стримати [USA.GetAdjective]у інтервенцію"
 PHI_devil_boats_desc:0 "Наші патрульні катери здобули славу своєю швидкістю і відвагою, а особливо своєю здатністю завдати сильного удару і зникнути в тумані, наче привиди моря. Відповідно, наші вороги навчилися триматися подалі від наших берегів, щоб самим не стати жертвою цих «диявольських човнів»."
 PHI_gold_prospecting_decision:0 "Розвідка родовищ золота"
 PHI_japan_aligned_ideology:0 "Ідеологія, орієнтована на Японію"
 PHI_marine_corps:0 "Корпус морської піхоти"
 PHI_military_requisitions_desc:0 "Щоб фактично сприяти цьому швидкому розширенню військової сили, нам потрібно реквізувати значні запаси зброї та спорядження зі складів постачання у Сполучених Штатах. Це дозволить нам підтримувати надійну бойову силу, оснащену абсолютно найкращою американською військовою технікою."
 PHI_mio_trait_coconut_fuel_adaptations:0 "Адаптація до кокосового пального"
 PHI_pan_pacific_trade_union_secretariat_desc:0 "Хоча ми пожинаємо плоди комунізму для себе і нашого власного народу, цей рух не повинен залишатися ізольованим і замкненим. Ми повинні експортувати нашу філософію та засоби її втілення іншим учасникам по всій Південно-Східній Азії і таким чином сформувати Секретаріат Пан-Тихоокеанських профспілок для нашого взаємного захисту та розвитку."
 PHI_preemptive_strikes_desc:0 "Вороги всюди, і ми в оточенні. Тому ми повинні готуватися до неминучого. А ще краще — підготуватися завдати удару першими, щоб неминуче перестало бути неминучим, а було відверненим. Зрештою, ми будемо в безпеці лише тоді, коли не залишиться нікого, хто міг би напасти на нас."
 PHI_repeatable_except_delay:0 "Це рішення є повторюваним, але §Yамериканське терпіння§! буде продовжено лише першого разу."
 PHI_revolutionary_regrets_desc:0 "За Іспанії ми завжди були іспанськими підданими або громадянами, але тепер, під Сполученими Штатами, ми є лише споживчим ринком для їхнього експорту, якщо не вигнанцями, тому що вони ніколи не робили нас громадянами жодного штату Сполучених Штатів."
 PHI_second_republic_tag_war_fascism:0 "$PHI_second_republic_tag_fascism$"
 PHI_textile_mills_desc:0 "Ми зараз у розпалі великого поштовху до більш індустріальної економіки, і основою цього є текстильна промисловість. Якщо ми зможемо виробляти базові речі самостійно, то ніколи більше не будемо залежними від іноземного впливу чи вразливими до нього."
 PHI_ties_with_anarchist_spain:0 "Зв'язки з Анархістською Іспанією"
 PHI_universal_sufferage:0 "Загальне виборче право"
 PHI_usa_catchup_tt:0 "Це зараховується як завершення одного з американських економічних фокусів для цілей реквізиції."
 PLAN_COHESION_BALANCED_TITLE:0 "§HУрівноважена згуртованість§!"
 PLAN_COHESION_IMMOBILE_DESC:0 "Дивізії §Rніколи§! не будуть переміщуватися!"
 PLAN_COHESION_LOOSE_TITLE:0 "§HГнучка згуртованість§!"
 PNG_fascism_ADJ:0 "Папуанськ"
 PNG_neutrality:0 "Федерація папуаських народів"
 POLITICAL_RESEARCH_BONUS_ENTRY:0 "$CATEGORY$: $FACTOR|=+0%$"
 POLITICS_GOAL_COST:0 "Вартість (£pol_power£): $VALUE|0$"
 POL_CAS_equipment_2_short:0 "Sum"
 POL_ENG_vauxhall_organization:0 "$POL_vauxhall$"
 POL_PEASANT_democratic_DEF:0 "Польський селянський союз"
 POL_STATE_784:0 "Вільно"
 POL_accepted_states:0 "Польща одержала території"
 POL_anti_blitz_tactics_desc:0 "Німці прагнуть захопити нашу країну швидкими і переважаючими силами, але, можливо, ця військова машина — всього лише скляна гармата. Людей можна змусити дивитись у вічі небезпеці без відступу; а танк є грізним лише тоді, коли ми до нього не готуємося."
 POL_anti_imperialism:0 "Антиімперіалізм"
 POL_anti_tank_equipment_1:0 "Armata ppanc. 37mm wz. 36"
 POL_april_constitution_1:0 "Квітнева конституція"
 POL_central_region_strategy_desc:0 "Централізуючи заводи в місцях якнайдалі від кордонів, ми пожвавимо виробництво та захистимо їх від можливих агресорів."
 POL_complete_plan_east_tt:0 "Відкриває доступ до §Yплану «Захід»§!, якщо він іще не виконаний.\nЗабороняє виконання подальших фокусів у гілці §Yплану «Схід»§!."
 POL_complete_the_bermontian_mission_desc:0 "Наша місія воювати пліч-о-пліч з білими і повернути Росію для царя була розбита невдалим вторгненням в Литву, але тепер у нас під командуванням могутня Співдружність націй. Ми повинні сідлати коней і спалити СРСР ущент!"
 POL_develop_polish_ship_building_desc:0 "Данциґ безнадійно втрачений на користь огидного нацистського режиму, і польська торгівля повинна знайти спосіб підірвати фактичне ембарго, яке нацисти тримають на нашій економіці. Можливо, ми ніколи не повернемо Ґданськ, але, можливо, нам вдасться перетворити Ґдиню на великий морський порт, який зможе конкурувати з Ґданськом у своїй величі."
 POL_diplomatic_mission_to_AUS_desc:0 "$POL_diplomatic_mission_to_FIN_desc$"
 POL_diplomatic_mission_to_CZE_desc:0 "$POL_diplomatic_mission_to_FIN_desc$"
 POL_go_left_desc:0 "Тільки об'єднавши наш народ, ми зможемо перемогти ворогів, які загрожують поглинути нас."
 POL_great_peasants_strike:0 "Селянський страйк"
 POL_habsburg_events.201.t:0 "[From.GetLeader] відкидає пакт"
 POL_invest_in_the_peasantry:0 "Інвестувати в селянські спільноти"
 POL_italian_alliance_desc:0 "Італійський уряд не приховує, що він є ворогом ідеалів самовизначення, які представляє Міжмор'я, але завдяки відповідним змінам у польському та італійському внутрішніх урядах ми зможемо узгодити їх з нашим баченням майбутнього Європи."
 POL_join_CZE_rails:0 "Об'єднати залізниці"
 POL_join_allies_desc:0 "Майбутнє держави [Root.GetNameDef] знаходиться в руках наших старих союзників на Заході. Хоча ми вже є членами Альянсу, офіційне приєднання до нього підтвердить нашу відданість країнам Заходу і, сподіваємося, відданість країн Заходу Польщі."
 POL_keep_looking_tt:0 "§YМи розглянемо інших кандидатів на престол.§!"
 POL_leftist_sejm_idea:0 "Лівацький Сейм"
 POL_lithuanian_rail:0 "Польсько-литовські залізниці"
 POL_military_appeasement_desc:0 "Вільне місто Данциґ не можна інтегрувати лише за допомогою грубої сили; певна міра заспокоєння може зробити данциґське ополчення більш відповідним баченням міста Польщі."
 POL_nav_bomber_equipment_3:0 "PZL.75 Mors"
 POL_naval_bomber_experiments_desc:0 "Панування в повітрі так само важливе на морі, як і на суші. Спеціалізовані літаки, розроблені для ведення морської війни, — це спосіб досягти цієї мети."
 POL_pan_slavism_desc:0 "Панслов'янський рух досі був трохи більше, ніж корисним інструментом для росіян, щоб претендувати на гегемонію над усіма слов'янами, але він також був корисним для об'єднання розрізнених слов'янських народів в об'єднані держави, такі як Югославія і Чехословаччина. Чому ж тоді Польща має бути винятком? Чи не повинна Польща також скористатися цією хвилею панславізму?"
 POL_purge_the_sanation:0 "Очистити Санацію"
 POL_strengthen_the_polish_state_desc:0 "Ми не можемо дозволити собі бути розділеними. Наша сила для впровадження змін пропорційна нашій єдності в Сенаті та Сеймі."
 POL_support_global_falangism_desc:0 "Ми не одні в нашій боротьбі за те, щоби принести фалангізм у свою країну. По всій Польщі є волонтери, які прагнуть підтримувати фалангістські рухи по всьому світу, і держава повинна підтримувати цих людей."
 POL_suppress_monarchist_sentiment:0 "Придушити монархічні настрої"
