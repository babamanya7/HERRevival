 HUN_cruisers_desc:0 "Наскільки б сильним не був флот, він нічого не вартий, якщо не може знайти ворога або захиститися від авіації. Розробка нових легких і важких крейсерів допоможе нам перетворити групу кораблів на справжній флот."
