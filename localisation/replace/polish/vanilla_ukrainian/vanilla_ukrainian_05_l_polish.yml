 political.27.d_communism:0 "Після нещодавнього приходу до влади [Root.GetRulingParty], [Root.GetLeader] оголосив, що [Root.GetName] більше не буде дотримуватися нейтральної зовнішньої політики.\n«Світ став заплутаним і складним. Ця країна завжди стояла на своїх принципах і була готова їх захищати. Ми більше не в безпеці наодинці. Нейтралітет більше не є тією безпечною гаванню, якою він був раніше, і ті, хто прагне влади в цьому світі, не поважають його. Ми мусимо стати разом із нашими побратимами-комуністами супротив сил, які прагнуть нас поневолити. Супротив буржуазної більшості, яка не хоче нічого іншого, як гнобити нас. Якщо ми не станемо на захист, то загинемо на самоті»."
