 JAP_organize_the_fifth_column_desc:0 "Коли наші чотири колони наблизяться до Осаки та Токіо, п'ята колона прихильників повстане всередині міст і підірве оборону ворога зсередини. Ми організуємо ці «п'яті колони» у всіх містах, до яких наближаємось, що дасть нам вирішальну перевагу у війні за національне визволення."
 JAP_organize_timorese_black_columns_decision:0 "Організувати тиморські «Чорні колони»"
 JAP_osami_nagano:0 "Осамі Наґано"
 JAP_pacifist_baron:0 "Впливовий барон-пацифіст"
 JAP_pre_emptive_coup_desc:0 "Нам потрібно діяти заради майбутнього нації та не дозволити авторитарному уряду розтоптати наші ідеали."
 JAP_project_z_bomber_project_desc:0 "Столиці наших ворогів лежать далеко від нас, що ускладнює завдання першого вирішального удару, необхідного для швидкого завершення наших воєн. Тому ми повинні побудувати машини, здатні досягти навіть Східного узбережжя Америки, якщо це буде потрібно, та інвестувати в нові моделі стратегічних бомбардувальників, які зможуть знищити промисловість ворога в тилу."
 JAP_raid_an_artillery_depot_decision_tt:0 "Коли почнеться громадянська війна, ми отримаємо §G250§! §Yартилерії§!, а наш супротивник отримає невеликий штраф на 180 днів"
 JAP_reform_the_education_system_desc:0 "Нинішня система освіти все ще має всі недоліки імперських інституцій і не здатна достатньо ефективно достукатися до наших дітей, що призводить до нашого відставання від західних країн. Ми повинні реформувати її з максимальною швидкістю, щоб гарантувати, що так не залишиться надалі."
 JAP_revoke_the_peace_preservation_law_tt:0 "§RБагато наших колоній, ймовірно, побачать у цьому можливість покинути імперію§!"
 JAP_sea_unify_the_air_forces_2_tt:0 "Замінює §Y$JAP_army_and_naval_air_services_dm$§! на §Y$JAP_japanese_airforce_dm$§!, зміна набуває чинності:"
 JAP_secure_the_philippines:0 "Узяття Філіппін"
 JAP_secure_the_philippines_desc:0 "Філіппіни стануть незамінною опорою на шляху до нашої справжньої мети. Ми маємо захопити їх для проведення подальших операцій."
 JAP_separate_air_services:0 "Separate Air Services"
 JAP_shinkansen_desc:0 "Головний інженер Хідео Шіма розробив план створення лінії швидкісного поїзда, яку він назвав Токайдо Шінкансен. Вона з'єднає Токіо, Наґою та Осаку, забезпечуючи швидке та легке перевезення як вантажів, так і цивільних між нашими великими містами. Ми повинні інвестувати в цей проєкт."
 JAP_ship_depth_charge_2:0 "Type 94 DC Thrower"
 JAP_ship_radar_3:0 "Радар «Type 32»"
 JAP_shogunate_neutrality_ADJ:0 "Японськ"
 JAP_sign_tripartite_pact_desc:0 "Завдання, яке стоїть перед нами, може виявитися нам не під силу. Слід звернутися до інших держав зі схожими цілями та налагодити співпрацю у деяких питаннях."
 JAP_small_army_faction_loss_tt:0 "£imperial_influence_texticon $JAP_army_faction$ $JAP_small_influence_loss$"
 JAP_small_influence_gain:0 "отримує §Yневелику§! кількість §YВпливу§!"
 JAP_socialism_in_one_state_desc:0 "Єдині, хто може навчити і підняти народи Азії, — це ми, ті, хто показав, що революція може бути успішною. Ми повинні залучити їх до нашої спільноти, щоб показати їм, як будувати своє життя, якщо знадобиться — силою зброї."
 JAP_strenghten_manchukuo_imperial_army_desc:0 "Імперська армія Маньчжоу-ґо стоїть як авангард проти сил [SOV.GetNameDef] і є тією силою, що утримуватиме кордон у разі початку війни. Ми повинні допомогти у збільшенні цих сил, щоб вони могли, як ми сподіваємося, протистояти [SOV.GetAdjective]ому джаґернауту."
 JAP_strike_the_southern_road_desc:0 "Настав час привести наш план у дію. Ми вдаримо на південь і заберемо собі багаті на ресурси західні колонії. Цим стрімким і рішучим ударом ми зможемо підірвати здатність ворога до опору ще до того, як війна почнеться по-справжньому. Теннохейка Банзай!"
 JAP_strike_the_soviets_desc:0 "Ми стоїмо як бастіон проти більшовиків, які вкрали у нас північний Карафуто. З часів Сибірської експедиції та російсько-японської війни наш народ знову прагне битися з [SOV.GetNameDef], щоб остаточно витіснити їх зі Східного Сибіру та закріпити нашу сферу впливу."
 JAP_sue_for_peace_nuke_mission:0 "Провести ядерні удари по японських територіях"
 JAP_suzuki_bunji:0 "Bunji Suzuki"
 JAP_tadaichi_wakamatsu:0 "Tadakazu Wakamatsu"
 JAP_tadashige_daigo:0 "Тадашіґе Дайґо"
 JAP_tennoheika_banzai_desc:0 "Атака «Банзай» є втіленням [ROOT.GetAdjective]ого бойового духу. У рамках військової програми кожен знатиме бойовий клич і буде навчений тактиці штикової атаки. Використовуючи це, наші люди не житимуть як військовополонені, а натомість підуть у сяйві слави. Хай живе Його Величність Імператор!"
 JAP_the_imperial_defense_plan_imperial:0 "Імперський план оборони"
 JAP_the_labor_farmer_faction_ascendant_tt:0 "Будь-які модифікатори переносяться до §Y$JAP_rounouha_modifier$§!"
 JAP_the_modern_ashigaru_tt:0 "Розблоковує рішення §Yскликати ополчення§! під час війни"
 JAP_urban_investments_modifier:0 "Посилені зусилля з урбанізації"
 JAP_war_communism:0 "Воєнний комунізм"
 JAP_war_communism_new_economy_law:0 "Розблоковує новий закон про економіку: §Y$JAP_war_communism_idea$§!"
 JAP_yamamotos_premiership_desc:0 "З огляду на поточну ситуацію, життєво важливо обрати прем'єр-міністра, який зможе згуртувати Імператорський флот (IJN) навколо себе та керувати як військовий лідер, так і як цивільний. Тому адмірал Ісороку Ямамото буде обраний, щоб вести націю до слави."
 JOR_democratic_DEF:0 "Йорданія"
 JUNO_already_specialized_in_tanks_dummy:0 "$JUNO_already_specialized_in_tanks$"
 JUNO_brazil_events.136.desc:0 "[SOV.GetNameDefCap] швидко відповів на нашу пропозицію відмовою. Ми маємо просити ліцензійне виробництво, як і будь-яка інша країна, і ціна буде такою ж, як і для всіх, жодних знижок."
 JUNO_brazil_events.161.c:0 "Стимулювати суднобудування."
 JUNO_brazil_events.39.t:0 "[ARG.GetNameDefCap] відмовляється від нашої приманки"
 JUNO_brazil_events.40.desc:0 "[BRA.GetAdjective] посол у [ROOT.Capital.GetCapitalVictoryPointName] виступив із заявою від їхнього уряду. У ній нам наказано негайно відкрити наші кордони для [BRA.GetNameDef] і скласти зброю. Далі в заяві докладно пояснюється, що наша нація має бути включена до складу [BRA.GetNameDef] як штат негайно. Якщо ми не підкоримося, вони заявляють, що реалізують свої плани силою."
 JUNO_brazil_events.44.desc:0 "Схоже, що ми на порозі ще більшого конфлікту після нашої відмови передати територію [FROM.GetNameDef]. Хоча ми сподівалися, що вони блефують, розвідувальна інформація з регіону свідчить про те, що [BRA.GetAdjective] військові готуються забрати територію силою."
 JUNO_brazil_events.52.t:0 "[FROM.GetNameDefCap] відхиляє членство в Mercosul"
 JUNO_brazil_events.61.t:0 "[POR.GetNameDefCap] приймає об'єднання"
 JUNO_brazil_events.71.desc:0 "Уряд [FROM.GetNameDef] мудро вирішив передати нам контроль над своїми заморськими територіями. Це має надати нашій промисловості безмитний доступ до ресурсів по всьому світу і змусить великі держави ставитися до нас серйозніше в міжнародних справах."
 JUNO_brazil_news.4.d:0 "Після поглиблення стосунків та співпраці між [BRA.GetNameDefCap] та [POR.GetNameDefCap] дві країни вирішили спільно створити співдружність для подальшого посилення їхньої співпраці."
