 GOE_RAJ_partition.9.a:0 "У нас обмежений час"
 GOE_generic_events.2.desc:0 "Уряд [FROM.GetNameDef] чітко заявив про свою прихильність поважати нашу владу як єдиного представника [FRA.GetAdjective] народу, і що вони продовжуватимуть слідувати нашому керівництву в усіх питаннях зовнішньої політики."
