 ETH_social_reforms_category:0 "Анархо-комуністичні соціальні реформи"
 ETH_strengthen_the_black_lions:0 "Зміцнити Чорних левів"
 ETH_the_heir_of_solomon_desc:0 "[ENG.GetName] створив порохову бочку напруги в Палестині, що призвело до падіння підтримки їхнього керівного мандату Ліги Націй. Можливо, вони готові передати управління регіоном комусь іншому? І хто краще підходить для цього завдання, ніж спадкоємець Соломона, [ETH.GetLeader]."
 ETH_the_heroes_of_adwa_idea:0 "Герої Адви"
 ETH_underground_wargames_desc:0 "Нам було важко відбити [ITA.GetAdjective]і війська під час останньої війни через відсутність розуміння того, наскільки змінилася війна за останні десятиліття. Щоб переконатися, що ми більше не повторимо такої ж помилки, вкрай необхідно, щоби наші офіцери почали проводити військові ігри та планувати повалення сил [ITA.GetAdjective]. Звичайно, ми повинні уникати виклику підозр, роблячи це..."
