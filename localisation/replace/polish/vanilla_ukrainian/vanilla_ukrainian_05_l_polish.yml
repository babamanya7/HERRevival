 idea_CHI_central_government_integration_pressure_desc:0 "Центральний уряд тисне на наше керівництво, вимагаючи повної інтеграції в його ієрархію, що фактично означає відмову від усіх владних повноважень."
 idea_CHI_rooting_out_hardliners:0 "Викорінення прихильників жорсткої лінії"
 idea_RAJ_confiscated_princely_wealth:0 "Конфісковане багатство князів"
 idea_RAJ_partition_chaos_bad:0 "Лиха поділу"
