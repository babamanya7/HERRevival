 INS_peta_party_long:0 "Defenders of the Homeland"
 INS_political_events.2.t:0 "[FROM.GetName] вимагає прав на [721.GetName]"
 INS_political_events.3.desc:0 "Як і очікувалося, [FROM.GetLeader] погодився на наші вимоги і почав виведення військ з [721.GetName]. Сили TKR увійшли в регіон разом із кількома урядовими посланцями. Сам [INS.GetLeader] виступив із промовою в Ділі, проголосивши свободу від колоніального впливу."
 INS_political_events.6.desc:0 "З початком революції наші партизани, які проникли в адміністрацію Індії, більше не потребують діяти в таємниці і почнуть виконувати свої диверсійні місії до того, як Нідерланди встигнуть відреагувати."
 INS_political_events.6.t:0 "Наші приготування приносять плоди"
 INS_revolution_events.37.a:0 "У нас немає іншого вибору, окрім як підкоритися."
 INS_sam_ratulangi:0 "Сам Ратулангі"
 INS_selling_resource_flag:0 "Уже веде переговори про контракт на ресурси"
 INS_ship_contracts_desc:0 "Побудова військово-морського флоту необхідна для підтримки наших торговельних шляхів у разі війни. Ми можемо використовувати наші нові торговельні відносини для отримання військово-морських контрактів."
 INS_soviet_aid_desc:0 "Радянський Союз визнав нашу революцію і готовий її підтримувати. Які б розбіжності не відокремлювали нашу програму від московської, ми не можемо дозволити собі відмовитися від того, що пропонується. Ми повинні взяти зброю і рухатися далі."
