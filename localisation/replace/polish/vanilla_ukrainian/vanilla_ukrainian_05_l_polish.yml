 FRA_ban_communism_desc:0 "Хоча неможливо уявити, щоб хтось усерйоз захотів відвідати хаос і кровопролиття комуністичної революції на власній батьківщині, здається, що серед нас є деякі, хто б зробив саме це. Ми більше не можемо дозволити їм вести змову проти держави. Необхідно вживати найжорсткіших заходів."
