 ARG_army_modifier:0 "$SMB_army_ARG$"
 ARG_british_influences_idea_desc:0 "We have established an influential foothold in [ARG.GetNameDef]"
 ARG_centralize_power_desc:0 "Родольфо Ґйольді добре керував нами досі на нашому шляху після революції. Багато людей у його уряді вважають, що централізація влади лише в Прем'єрі допоможе зберегти безпеку нашої новоствореної радянської держави від внутрішніх та зовнішніх загроз. Зрештою, це робиться в ім'я безпеки та захисту [ARG.GetNameDef]."
 ARG_conservative_traditionalist:0 "Консервативний традиціоналіст"
 ARG_economic_tax_reforms_decisions_tt:0 "Відмикає сукупність рішення §Y$ARG_economic_tax_reforms_decisions$§!."
 ARG_encourage_german_investments:0 "Заохочувати німецькі інвестиції"
 ARG_fascism:0 "Аргентинська ліга"
 ARG_forge_our_own_future_desc:0 "З грандіозним успіхом революції настав час вирішити, як ми хочемо формувати майбутнє [ARG.GetNameDef]. Товаришка Фанні Едельман була рішучою прихильницею КПА протягом багатьох років і докладала зусиль у боротьбі за права жінок у [ARG.GetNameDef]. Багато хто вважає її здатною очолити нашу країну надалі, вводячи [ARG.GetNameDef] у нову еру процвітання."
 ARG_guardia_nacional:0 "Guardia Nacional"
 ARG_implement_rural_reforms:0 "Упровадити сільські реформи"
 ARG_internal_focus:0 "Внутрішній фокус"
 ARG_invest_in_railways_idea_desc:0 "У сучасну епоху кожна галузь покладається на надійну основу національної залізничної мережі. Розбудовуючи залізничні лінії по всій країні, ми заклали основу для надійного транспортування товарів із сільської місцевості до міст."
 ARG_news_events.1.d:0 "[ARG.GetAdjective] уряд останнім часом займає все більш войовничу та наполегливу позицію щодо питань зовнішньої політики. Оскільки безславна декада закінчилося такою швидкою зміною режиму, схоже, що [ARG.GetNonIdeologyName] готується до можливості експансії. Сьогодні вранці [ARG.GetAdjective] лідер [ARG.GetLeader] виступив перед нацією і запевнив населення, що наближається ера величі, з метою об'єднання Південної Америки під одним сильним та стабільним прапором."
 ARG_no_gods_no_masters_idea_desc:0 "Хоча інші країни континенту можуть не погоджуватися з нашим урядом, було б проти нашої ідеології сидіти склавши руки і дозволити, щоб їх завоювали розлючені, войовничі агресори. Якщо хтось із наших сусідів потрапить до рук загарбника, ми повинні взятися за зброю, щоб звільнити його."
 ARG_political_events.18.a:0 "Яке полегшення..."
 ARG_political_events.82.t:0 "Грант на промислову освіту"
 ARG_reach_out_to_chile_2_tt:0 "Якщо вони §Yпогодяться§!, то ми віддамо їм §Y[954.GetName]§! та §Y[953.GetName]§!."
 ARG_reach_out_to_chile_tt:0 "Вони, ймовірно, погодяться, якщо мають §YВисоку думку про нас§! і є або §YФашистами§!, або §YНеприєднаними§!."
 ARG_reach_out_to_the_great_powers:0 "Звернутися до великих держав"
 ARG_reinforced_alliance_desc:0 "Наші тісні стосунки з Британією виявляються дуже корисними, але чим більше ми вивчаємо їхніх військових, тим болючіше стає зрозуміло, що ми не настільки готові до можливого конфлікту, як могли б бути. Ми повинні розглянути можливість запиту їхньої більш чіткої підтримки у формі гарантій та пакту про ненапад."
