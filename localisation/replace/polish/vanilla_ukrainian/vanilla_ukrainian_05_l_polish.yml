 SOV_seek_a_defense_pact_with_the_allies_desc:0 "Незважаючи на неформальні контакти із західними демократіями, було досягнуто мало конкретних і юридично зобов'язуючих домовленостей. Настав час нанести чорнило на папір і заявити світові, що західні демократії готові сформувати з нами Об'єднаний фронт проти фашистської експансії."
