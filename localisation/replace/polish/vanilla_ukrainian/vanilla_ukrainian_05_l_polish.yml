 NORDIC_naval_research_institute_desc:0 "Нам буде недостатньо наздогнати наших ворогів, ми повинні бути в авангарді військово-морських технологій, як ми були раніше. То приймімо спадщину нашого регіону дослідження та морського домінування."
 NORDIC_nordic_industry_desc:0 "[NORDIC_get_nordic_industry_desc]"
 NORDIC_nordic_military_industry_desc_mon:0 "У наші сучасні часи королівства падають наліво і направо, і лише дух королівської родини не врятує їх від забуття. Ми повинні переконатися, що наші королівства мають необхідну зброю, щоб боротися з його вимиранням"
 NORDIC_nordic_navy:0 "[NORDIC_get_nordic_navy_name]"
 NORDIC_second_institution_desc:0 "Наш альянс є більш тісним і пов'язаним, ніж будь-коли раніше, але це також означає, що як підрозділ є громіздким і повільним. Завдяки створенню [NORDIC_get_institution_2_name] [NORDIC_get_institution_2_desc]."
 NORDIC_second_institution_desc_com:0 "ми можемо бути впевнені, що воля робітників буде представлена, кілька людей, які представляють багатьох, обов'язково діятимуть в найкращих інтересах пролетаріату"
 NORDIC_strenghten_ties_decision_desc:0 "Хочемо ми цього чи ні, історія зв'язала [ROOT.GetName] і [FROM.GetName] воєдино. Ми можемо вчитися одне в одного, зміцнюючи ці зв'язки."
 NORDIC_unified_recruitment_propaganda:0 "Уніфікована пропаганда вербування"
 NORDIC_war_participation_increase_TT:0 "Наша участь зросла з §Y[NORDIC_get_current_participation_level]§! до §R[NORDIC_get_participation_level_above]§!"
 NOR_a_valuable_partner_to_germany_desc:0 "Успіх цієї нації нерозривно пов'язаний із [GetNorwegianFascistOverlord]. Чим більше ми можемо зробити, щоб допомогти їм, тим більше вони винагородять нас здобиччю війни. Ми повинні вказати себе на шлях, який може повернути [NOR.GetNAME] у незамінного партнера."
 NOR_alt_dem_offensive_push_desc:0 "Все інше загороджено, настав час атакувати. Давайте просуватися вперед і розчавити наших ворогів, перш ніж вони дізнаються, що їх спіткало."
 NOR_arbeiderklassen_long:0 "Коаліційна партія робітничого класу"
 NOR_artillery_development_desc:0 "Велика війна довела важливість артилерії, ми не можемо дозволити собі відставати більше, ніж ми є, щоб не ризикувати стати безсилими перед ворожими снарядами."
