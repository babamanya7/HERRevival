 GOE_RAJ_loyalist.14.b:0 "У нас інші плани щодо цих ресурсів."
 GOE_RAJ_loyalist.15.desc:0 "Наш сюзерен [OVERLORD.GetNameDef] надав права на ресурси $state_resource_tungsten$ у [288.GetName] [RAJ.GetNameDef], щоб вони могли підживити свою промисловість та зробити внесок у військові зусилля. Це можливість для нас довести [OVERLORD.GetNameDef], що ми віддані підтримці їхніх інтересів у регіоні."
 GOE_RAJ_loyalist.17.desc:0 "На жаль, [FROM.GetNameDef] відмовив у нашому проханні експлуатувати бірманський $state_resource_tungsten$. Це велике розчарування, оскільки ці ресурси могли б бути вирішальними для підтримки розвитку нашої військової машини."
 GOE_RAJ_partition.10.desc:0 "На Індійському субконтиненті спалахнула війна. Нам варто було б втрутитися, оскільки ми мали значний вплив на обидві країни, і покласти край цьому божевіллю."
 GOE_RAJ_partition.5.t:0 "Сутички між індусами та мусульманами"
