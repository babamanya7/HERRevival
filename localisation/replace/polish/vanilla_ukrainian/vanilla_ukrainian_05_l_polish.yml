 CHI_productive_desc:0 "Бездіяльні руки нічого не будують! Лінощі не лише стримують нас, вони також допомагають ворогу. З пасивними та апатичними потрібно розібратися, якщо ми хочемо перемогти як партія!"
 CHI_reject_the_nine_powers_desc:0 "Договори, нав'язані нам заморськими чужинцями, були укладені в час слабкості, але зараз ми можемо їх відкинути. Нехай кожен підписант знає: ми нічого не винні іноземцям!"
