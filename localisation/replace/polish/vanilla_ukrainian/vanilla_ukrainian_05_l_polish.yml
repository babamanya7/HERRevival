 SOV_organize_uprisings_in_the_country_desc:0 "Зрозуміло, що ми не зможемо усунути Сталіна від влади без певної збройної боротьби. Відволікаючи увагу Сталіна від наших приготувань, ми можемо забезпечити їх безперервність."
