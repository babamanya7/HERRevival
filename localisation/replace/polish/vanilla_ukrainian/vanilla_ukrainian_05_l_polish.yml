 licence_production_access_receiver_desc:0 "Держава $COUNTRY|Y$ надає доступ до своїх ліцензій на виробництво іншим державам."
 light_battery_advice_tt:0 "\n\nУстановка модуля §YЛегка батарея§! на §Yлегкі кораблі§! та §Yкрейсери§! поліпшує їхню §Yатаку легких гармат§!, що допомагає зі знищенням ворожих §Yкораблів прикриття§!. §YЛегкі батареї§!, як правило, погано працюють проти броньованих кораблів, таких як §Yкрейсери§! та §Yважкі кораблі§!."
 limited_sea_time_spirit_desc:0 "Утримання флоту в морі робить його дорожчим."
 local_factories_tt:0 " $MODIFIER_LOCAL_FACTORIES$: $RIGHT|+=%1$"
 lone_wolf:0 "Самотній вовк"
 lone_wolf_desc:0 "§LКомандувати великим флотом важко, але й розкрити весь потенціал невеликої бойової групи — теж завдання не з простих.§!"
 long_range_patrol_spirit_desc:0 "Домінуйте в повітрі далеко від дому."
 long_range_submarines_support_the_surface:0 "Тактика підтримки бойового флоту"
 lotsofbattles:0 "Багато битв"
 macdonald_proposal:0 "Пропозиція МакДоналда"
 march_of_the_defenders:0 "Марш захисників"
 marina_lee_desc:0 "§HМаріна Лі§! — це балерина, що спеціалізується на викраденні бойових планів."
 marine_corps_goal_desc:0 "Розширення наших амфібійних сил значно збільшить наші наступальні можливості та кількість ворожої території, якій ми можемо загрожувати."
 marines3:0 "Морська піхота III"
 marksman_desc:0 "§L«Цілься наступним залпом на півметра від корми, просто в їхній боєзапас».§!"
 mech_cost_upgrade_desc:0 "Оптимізація конструкції та заміна менш важливих матеріалів дозволяє будувати автомобіль швидше, але з дещо більшою кількістю дефектів."
 medium_tank_destroyer_equipment:0 "Середній ВТ"
 medium_tank_destroyer_equipment_2:0 "Середній ВТ II"
 mexico.16.title:0 "Страйк нафтовиків"
 mexico.23.a:0 "Торгівля з нашими ворогами рівносильна військовим діям."
 mexico.34.b:0 "Швидше за все, креслення потраплять до рук американців."
 mexico.43.title:0 "[From.GetAdjective]і війська атакують Панамський канал"
 mexico.51.desc:0 "Оточуючі Іспанію моря патрулюють не тільки кораблі іспанських роялістів і повстанців, але також італійські крейсери, російські субмарини і навіть судна Ліги Націй, надіслані, щоби забезпечити заборону на постачання зброї з метою недопущення поширення громадянських воєн у Європі. Не дивно, що наш вантаж перехопили, і він зник."
 mexico.52.b:0 "Наша інтерпретація Маркса — єдино вірна."
 mexico.52.desc_trotsky:0 "На конгресі партії [MEX.GetFactionName] [MEX.GetLeader] оголошує про перевагу свого тлумачення праць Маркса, Енгельса та Леніна над такими хибними розуміннями суті революції, як сталінізм. З розвалом 3-го Інтернаціоналу (відомого як Комінтерн) комуністичні лідери всього світу повинні розглянути свої дії з позиції самокритики. Після визнання своєї політичної сліпоти та нерозуміння істинного духу революції вони будуть запрошені до 4-го Інтернаціоналу та будуть допомагати в організації світової соціалістичної революції."
 mexico.9.title:0 "Вступ Мексики до альянсу [Root.GetFactionName]"
 mexico_attack_on_panama_canal:0 "Атака на Панамський канал"
 militarized_schools:0 "Мілітаризовані школи"
 mine_craft:0 "Мінне ремесло"
 mine_layer_desc:0 "§LПотрібна неабияка сила духу, щоби скидати вибухонебезпечні міни, призначені для потоплення кораблів, зі свого корабля. Цей офіцер має її вдосталь.§!"
 minister_of_peasants:0 "Міністр селянства"
 minister_of_posts_and_telegraphs:0 "Міністр пошти і телеграфу"
 minor_sanctions_relations:0 "$minor_sanctions$"
 mio_header_guns_and_turret:0 "Гармати та башти"
 mio_policy_navy_great_sea_keeping:0 "Оборона відкритих морів"
 mission_type_tactics_control_zone_responsibilities:0 "Відповідальність у зонах контролю"
 mission_type_tactics_flexible_combat_formations:0 "Наступальна позиція"
 mobile_infantry_combined_arms_planning:0 "Інфільтрація"
 mobile_warfare_academy_spirit_tt:0 "Нові офіцери: отримати шанс почати з рисою §Y$armor_officer$§!."
 mobile_warfare_desc:0 "Мобільна війна — це ставка на швидкість і маневрування, покликана відрізати та дезорганізувати ворожі війська.\n\n"
 mod_track_mastery_gain_factor:0 "£doctrine_mod $ARG|H$ фактор приросту майстерності шляху"
 modern_tank_aa_equipment:0 "Сучасна ЗСУ"
 modern_tank_aa_equipment_1_desc:0 "$modern_tank_aa_equipment_desc$"
 modern_tank_equipment_desc:0 "Сучасні танки — це маневрені багатоцільові танки, які можуть виконувати різноманітні функції, наприклад розвідників, танків підтримки чи навіть передових танків."
 modifier_production_speed_naval_headquarters_factor:0 "Швидкість будівництва §Yштабів ВМС§!"
 modifier_unit_ranger_battalion_design_cost_factor:0 "$udc_tt$ рейнджерів"
 molotov_ribbentrop_pact:0 "Пакт Молотова–Ріббентропа"
 motorized_rocket_equipment_desc:0 "Такі реактивні установки залпового вогню доставляють вибухівку до цільової зони швидше, ніж звичайна артилерія, але з нижчою точністю та вимагають більше часу для перезаряджання. Будучи встановленою на вантажівках, ця версія здатна атакувати та змінювати позиції до того, як ворог зможе відповісти вогонь."
 mountain_guns_tt:0 "Відкриває: §H$mountain_gun$§!\n§HАртилерія (гори)§!\n    Атака: §G+8%§!\n    Переміщення: §G+15%§!\n§HПТА (гори)§!\n    Атака: §G+8%§!\n    Переміщення: §G+15%§!"
 mountaineer_corps_goal_desc:0 "Розширення наших гірськопіхотних підрозділів значно підвищить здатність нашої армії вести бойові дії на цій суворій і важкодоступній місцевості."
 move_capital_to_thessaloniki_desc:0 "Афіни були столицею Першої еллінської цивілізації, Константинополь — столицею Другої, але місто Фессалоніки, вічна «друга столиця» протягом усієї еллінської історії, стане столицею Третьої еллінської цивілізації."
 mtg_britain.103.t:0 "Імперська конференція: федерація — успіх"
 mtg_britain.17.t:0 "Під управлінням Великої Британії"
 mtg_britain.35.a:0 "Під керівництвом Мослі ми переживемо будь-яку бурю!"
 mtg_britain.42.d:0 "[From.GetNameDefCap] повідомляє нам про те, що вона вирішила відкинути нашу пропозицію про вступ до альянсу — і нехай ми збережемо за собою Ґібралтар."
 mtg_britain.43.b:0 "Їх слід судити і покарати."
 mtg_britain.58.d:0 "Хід в області [ENG_blackshirt_march_state.GetName] пройшов успішно, незважаючи на протести і незначні зіткнення. Чорносорушечники відстояли честь партії, і ми продовжимо йти назустріч нашій беззастережній політичній перемозі."
 mtg_britain.67.t:0 "[From.GetName] проголошує незалежність"
 mtg_britain.68_tt:0 "Залишити всі спроби убезпечити Канаду.\n"
 mtg_britain.74.d:0 "Наша війна з державою [PAK.GetNameDef] заходить у глухий кут, кінця їй не видно, і громадська думка все частіше ганьбить безглузду втрату життів. Можливо, настав час переговорів про мир?"
 mtg_britain.83.b:0 "Витратити дипломатичні зусилля на те, щоби переконати домініони."
 mtg_britain.86.d:0 "[From.GetAdjective] уряд повідомив нам, що не має коштів для підвищення витрат на оборону. Як наслідок, їм довелося відхилити нашу пропозицію."
 mtg_exile_government.2.title:0 "[From.GetAdjective]ий уряд у вигнанні"
 mtg_netherlands.10.t:0 "Сформовано новий уряд"
 mtg_netherlands.55.d:0 "Внесок принца Бернарда, евакуйованого на підводному човні, вже відчувається. Опір зараз набагато ефективніший і активніший."
 mtg_netherlands.63.d:0 "Перед самою капітуляцією, коли стало зрозуміло, що битва програно, нам вдалося евакуювати свій золотий запас до наших нових союзників. Золото, що зберігалося на кораблях, готових до відплиття в будь-який момент, успішно прибуло за призначенням і дуже стане в нагоді нашому уряду у вигнанні."
 mtg_netherlands.71.a:0 "Зрадники! Всі вони зрадники!"
 mtg_netherlands.76.a:0 "Це було неминуче. Вони надали нам неоціненну послугу."
 mtg_netherlands.8.a:0 "Прекрасна новина!"
 mtg_news.14.d:0 "Будемо сподіватися, що це божевілля не вплине на наші активи!"
 mtg_news.20.d:0 "Британці явно щось задумують..."
 mtg_news.21.t:0 "Англо-німецький союз"
 mtg_news.24.d:0 "Ми протестуємо!"
 mtg_news.3.d:0 "Запитайте бельгійців, як нейтралітет допоміг їм оборонятися у 1914 році."
 mtg_news.30.a:0 "Нічого їм забивати собі голову дивними ідеями."
 mtg_news.33.t:0 "[From.GetName] поступається профспілкам"
 mtg_news.36.desc:0 "Держава [From.GetNameDefCap] проголосила нову «комуністичну альтернативу» Комінтерну, в якій, як стверджує [From.GetLeader], «усі соціалістичні держави, які бажають здобути незалежність від Москви, можуть разом із нами захищати права робітників у всьому світі.» Поки неясно, чи зможе ця нова соціалістична фракція вистояти проти Москви."
 mtg_news.39.desc:0 "Заяви [From.GetAdjective] уряду стають все більш ворожими та антифашистськими. Поряд із прийняттям різних антифашистських актів це дозволяє припустити, що там готуються до військового протистояння зі своїми ідеологічними противниками в не надто віддаленому майбутньому."
 mtg_news.7.c:0 "У свій час американські робітники знову вдихнуть повітря свободи."
 mtg_usa_canadian_corridor.2.t:0 "[CAN.GetNameDefCap] погоджується"
 mtg_usa_civil_war_democrats.41.c:0 "Схоже, містер Гілт дійсно здатний відновити країну."
 mtg_usa_diplomatic_protest.1.a:0 "Вони блефують. Можливо."
 mtg_usa_foreign_support.4.a:0 "Надіслати гвинтівки"
 mtg_usa_pacific_pacification.1.desc_b:0 "Делегація [USA.GetAdjective] уряду прибула для обговорення планів нашого спільного захисту. Схоже, [USA.GetLeader] вважає, що наша невелика частина світу представляє життєвий інтерес для безпеки держави [USA.GetNameDef]. крім надання нам простих гарантій, [USA.GetAdjective] уряд хоче, щоби ми самі не стали загрозою, тому угода передбачає низку положень, що дозволяють державі [USA.GetNameDef] значно впливати на наші внутрішні справи.\n\nПоки що в переговорах справа не дійшла до загроз, але ясно, що президент [USA.GetLeader] визнає нашу відмову актом ворожості."
 mtg_usa_secure_asia.7.desc:0 "Під час великого дипломатичного наступу президент [USA.GetLeader] публічно оголосив В'єтнам та Індокитай регіоном життєвих інтересів держави [USA.GetNameDef]. Як наслідок, воно прагне посилити свою присутність у цій зоні.\n\n приватній бесіді представник держави [USA.GetNameDef] дозволив собі низку агресивних висловлювань з приводу Індокитаю, які не тільки чинять тиск на державу [SIA.GetNameDef], а й вимагали право розміщувати війська в наших колоніях та «консультувати» колоніальну адміністрацію.\n\nПо суті це означає передачу територій під їх контроль."
 mtg_usa_senate_medium_support_tt:0 "До §Y10 сенаторів§! §Gпідтримають§! уряд.\n"
 mtg_usa_southern_threat.2.t:0 "[MEX.GetLeader] погоджується"
 mutiny_event.1.desc:0 "After a few hours of tense negotiations at barracks gates and in front line dugouts, the mutiny in our army is over. Faced with the prospect of a fight they could not win, the mutineers quickly decided to stand down.\n\nThe primary issue then became the fate of those that had refused orders. Military High Command has opted for clemency and assured the mutineers that they would not be punished harshly. A few examples have been made in which some soldiers were demoted to a lower rank and transferred to a different unit."
 mutiny_event.3.desc:0 "\"It's not uncommon for a soldier to doubt whether what he is doing is really worth it. Can anything justify the sacrifices we ask of you? Can we really demand you to potentially die in pursuit of a goal that you would never see?\n\nIt is an unfortunate fact that we must live in the times we were born in. Fate has decided that we must be at war, to protect our freedom, our homes, our [Root.GetAdjective] way of life! We did not choose this war, it was forced on us! You know that I would not ask anything of you that I would not be willing to do myself, and I know that you will do whatever is necessary to secure victory.\"\n\n[Root.GetLeader]'s speech in front of the troops appears to have had the desired effect, as the soldiers broke out in spontaneous cheers and returned to their duties without more than the usual amount of complaining."
 mutiny_event.7.a:0 "Well done."
 nationalzied_foreign_assets_op_modifier:0 "Націоналізація іноземних активів!"
 nav_bomber_equipment_2_short:0 "Морськ. бомбардувальник II"
 naval_academy_scholarships_spirit_desc:0 "Важливо дати потрібним людям можливість сяяти."
 naval_architect:0 "Військово-морський архітектор"
 naval_base:0 "Морська база"
 naval_base_pl_acc:0 "морські бази"
 navy_primancy_focus_desc:0 "Якщо вважати, що в імперії дві руки — армія і флот, то немає сумнівів, яка з них важливіша і сильніша! Флот здатен контролювати далекі моря... А що може армія? Якщо визнати цей простий факт і надати флоту більше ресурсів, наші можливості будуть безмежні."
 nd_conscription_desc:0 "В армію забирають навіть калік та інвалідів; цивільних у принципі бути не може."
 news.101.a:0 "[GER.GetAdjective]а армія, здається, непереможна!"
 news.101.t:0 "Падіння Парижу"
 news.105.t:0 "Падіння м. [217.GetCapitalVictoryPointName]"
 news.114.d:0 "[GetItalianConquestofParisDesc]"
 news.118.t:0 "Падіння Перл-Гарбора"
 news.135.t:0 "Падіння Токіо"
 news.138.d:0 "На відміну від 1920 року, не сталося жодного «Дива на Віслі», коли радянські війська підійшли до Варшави. Польський опір на той час був фактично придушений, і незабаром радянський прапор піднявся над більшістю адміністративних будівель.\n\nЧи бачимо ми кінець Польщі як держави, чи польська армія все ж таки зуміє дати відсіч і відвоювати столицю? Більшість експертів сходяться на тому, що це є малоймовірним."
 news.160.a:0 "Для Європи це не обіцяє нічого хорошого."
 news.163.a:0 "Це закінчиться добре."
 news.169.a:0 "Німеччина демонструє Європі свою могутність."
 news.169.d_annex_YUG:0 "Нещодавні територіальні втрати спричинили розділ югославської держави, за яким послідували етнічний конфлікт та послаблення центральної влади. Німеччина ввійшла в зростаючий вакуум влади і вирішила оголосити «протекторат» на землях Югославії"
 news.170.e:0 "Чи може центр вистояти?"
 news.171.f:0 "Вони зазнають невдачі, як це зробили перси."
 news.172.e:0 "Ми нічого не можемо зробити."
 news.174.d:0 "Після перших випробувань політична верхівка вирішила, що держава [From.GetName] має зосередити [From.GetAdjective]і дослідження у сфері атомних технологій.\n\nЦя галузь зараз ще погано вивчена, і невідомо, чи є у неї будь-яке практичне застосування. Ніхто не знає, як це змінить їхні військові плани."
 news.175.b:0 "Вони готуються до найгіршого."
 news.19.d:0 "Враховуючи кількість німецьких військ, що зібралися на кордоні, [FROM.GetNameDef] прийняла [GER.GetAdjective]ий ультиматум про передачу старої прусської території Мемель.\n\nЦя область увійшла назад до складу Східної Пруссії, від якої була відділена за Версальським договоромі передана державі [FROM.GetNameDef].\n\nНаскільки ж великі німецькі амбіції в Європі? Експерти сумніваються..."
 news.190.d:0 "Оскільки [Italy.GetAdjective]і війська відіграли важливу роль у громадянській війні в Іспанії, [Italy.GetName] розраховує, що держава [From.GetName] передасть їй Балеарські острови. [From.GetLeader] неохоче йде на поступку, заявляючи, що цей дипломатичний крок зміцнить відносини між двома країнами.\n\nЯк сподівається [Italy.GetName], морські бази на Балеарських островах дозволять посилити контроль над Ґібралтарською протокою і розширять доступ до Атлантичного океану."
 news.192.a:0 "Це югославські землі, а не італійські!"
 news.200.t:0 "Німецький вплив на державу [CZE.GetNameDef]"
 news.204.c:0 "Ми мусимо разом зупинити цього агресора!"
 news.205.d_not_america:0 "Дивлячись на конфлікти на інших континентах, [USA.GetLeader] оголосила про нову зовнішньополітичну програму, спрямовану на збереження миру всередині країни.\nБудь-який уряд на американському континенті може звернутися до США за військовим захистом, якщо відчує загрозу з боку своїх сусідів. Хоча це не є гарантією для будь-якої конкретної держави, прагнення до миру в Америці більше не є просто мрією, а офіційною американською політикою"
 news.213.c:0 "[GER.GetName] впаде!"
 news.220.f:0 "Це несподіваний розвиток."
 news.230.c:0 "Люди скрізь повинні повстати за свободу!"
 news.242.a:0 "Це змінює баланс сил у Півднно-Східній Азії."
 news.245.d:0 "\nЗважаючи на зростаючу стратегічну важливість Тихого океану, [AST.GetNameDef] та [USA.GetNameDef] підписали договір про співпрацю в Тихому океані. Хоча договір спрямований на підтримку політичної стабільності в регіоні і, відповідно, транстихоокеанського судноплавства, він також передбачає можливості військової оборони, що дозволяє двом країнам здійснювати повноваження, які виходять далеко за межі їхніх фактичних територіальних претензій.\n\nЗважаючи на те, що така велика територія зараз знаходиться під австралійсько-американським «захистом», це, безсумнівно, лише питання часу, коли ці можливості будуть випробувані на практиці."
 news.248.c:0 "Ох, візьміть ці глухі скелі!"
 news.270.desc:0 "Гуркочучи головною вулицею столиці, новий танк Bob Semple Сил оборони Нової Зеландії є справжнім свідченням винахідливості та бойового духу народу [NZL.GetAdjective]. Озброєний шістьма кулеметами і броньований майже напевно куленепробивним залізним покриттям, він, цілком можливо, стане найбільшою перешкодою, яку доведеться подолати будь-якому загарбнику.\n\nДеякі так звані експерти вказують на тьмяні параметри і слабке озброєння машини як на причини, чому її не варто будувати, але, як сказав прем'єр-міністр [NZL.GetLeader] під час офіційної церемонії прийняття машини, своєчасна оборона королівства має таке велике значення, що досконалої техніки не можна ні чекати, ні вимагати."
 news.272.desc:0 "Стихійні лиха, некомпетентна адміністрація та руйнівна війна змовилися, щоби створити широкомасштабний голод в Індії.\n\nПісля циклону, який спустошив значну частину території і знищив майже весь урожай рису, колоніальна адміністрація виявилася повільною — дехто міг би сказати, що помітно повільною — у вирішенні цієї проблеми. Незважаючи на надлишок продовольства в інших регіонах Індії, не було жодних поставок допомоги через побоювання, що вона може потрапити до рук ворога.\n\nБольші частини території були спустошені, а вартість людських життів і втраченого виробництва ще навіть не можна підрахувати."
 news.286.a:0 "Просто формальність, на цю мить."
 news.301.b:0 "У нас не було вибору."
 news.302.desc:0 "Крайній строк ультиматуму минув, а румунська сторона так і не відповіла на нього. Обурені [HUN.GetAdjective]і чиновники вже засудили румунський уряд, заявивши, що він «дестабілізує регіон» своєю наполегливістю дотримуватися «незаконних договорів». Обидві країни, схоже, готуються до війни, яка може вибухнути в будь-який день."
 news.321.e:0 "Ми знаємо, як це воно..."
 news.325.b:0 "Ми до них готові!"
 news.350.c:0 "Добре для них, напевно."
 news.57.e:0 "Нехай німці прийдуть!"
 news.8.d:0 "Між радянськими та японськими військами на маньчжурському кордоні нещодавно стався серйозний інцидент.\n\nЗа повідомленнями з місця подій, японці взяли росіян у кліщі, коли ті атакували їх через кордон, і змусили вцілілих в паніці відступити.\n\nЧи буде змушена Москва збільшити свою військову присутність на радянському Далекому Сході?"
