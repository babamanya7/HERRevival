 PAR_juan_stefanich:0 "Juan Stefanich"
 PAR_order_italian_planes_desc:0 "Нам потрібно модернізувати наші військові сили. Ми звернемося до [ITA.GetName], щоб переконатися, що наші повітряні сили відповідають вимогам, щоб запобігти будь-якій загрозі від наших сусідів."
