 AFG_political_events.03.desc:0 "[FROM.GetNameDefCap] відхилив нашу пропозицію про об'єднання Центральної Азії в єдине політичне утворення під нашим контролем. Хоча це величезна невдача, мрія ще не померла. Нам просто потрібно почекати слушної нагоди."
 AFG_political_events.172.b:0 "Ким вони себе вважають?"
 AFG_political_events.41.a:0 "Ми продовжуватимемо уважно спостерігати за ними."
 AFG_political_events.54.desc:0 "Як було попередньо домовлено, [FROM.GetAdjective] обладнання було надано нам з моменту спалаху громадянської війни. Їхні оперативники в [ROOT.Capital.GetCapitalVictoryPointName] також запевнили нас, що таємні [FROM.GetAdjective] війська незабаром прибудуть до країни, щоб допомогти нам у боротьбі."
 AFG_political_events.71.a:0 "Славетна перемога для Афганістану!"
 AFG_political_events.86.a:0 "Тоді ми розпочнемо нашу експансію в регіоні."
 AFG_request_japanese_support_desc:0 "[JAP.GetAdjective] прагнуть домінувати на Азійському континенті та можуть шукати союзників, які підтримують їхні головні цілі. Було б розумно переконати їх, що наш суперник король Захір виступає проти цього, та заручитися їхньою підтримкою для нашого майбутнього повстання."
 AFG_revive_the_1923_constitution:0 "Відновити Конституцію 1923 року"
 AFG_standardize_equipment:0 "Стандартизувати обладнання"
 AFG_support_warzistan_independence_desc:0 "Наші кордони з [ENG.GetAdjective] в Індії є постійним джерелом напруги між нашими націями. Хоча нам бракує сил, щоб витіснити їх з регіону, ми можемо підірвати їхнє правління, підтримуючи рухи за незалежність, такі як у Вазиристані."
