 LAND_COMBAT_CAS_INFO_TOOLTIP_DETAIL:0 "Максимальна кількість літаків, яка може допомогти — $MAX_PLANES|Y$. Чим більше використана ширина фронту, тим більше літаків можна вмістити."
 LAO_fascism:0 "Королівство Луанґпхабанґ"
