 GER_not_controls_atlantic_coast_jylland_vlaanderen_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]а маріонетка або член альянсу §Rне контролює повністю§ всі регіони вздовж §YАтлантичного узбережжя§! від §Y[99.GetName]§! до §Y[6.GetName]§!."
