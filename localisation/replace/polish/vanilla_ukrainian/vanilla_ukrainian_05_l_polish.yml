 SOV_regional_development_desc:0 "Замість мати невелику кількість централізованих заводів і залишити решту країни голодувати, ми мусимо забезпечити розвиток промисловості по всьому союзу."
 SOV_rehabilitated_military_desc_default:0 "Тепер зрозуміло, що пильна увага, яку ми приділяли військовим, можливо, була дещо надто ревною. Хоча це цілком виправдано в мирний час, під час війни ми мусимо дозволити професіоналам приймати рішення, виходячи з військової ситуації, а не з політичних міркувань. Настав час трохи приструнити політичних офіцерів і дати командирам більше свободи дій у веденні справ."
 SOV_reinforce_eastern_naval_bases_desc:0 "Навіть після приниження 1905 року японці не припинили галасувати про зазіхання на наші території. Ми мусимо бути готові до війни проти них, а це означає зміцнення наших військово-морських баз у регіоні."
 SOV_reinforce_southern_naval_bases_desc:0 "Чорне море може здатися другорядним театром бойових дій. Але якщо ми втратимо контроль над ним, ми відкриємо всі наші південні території для ворожого вторгнення, як це сталося під час Кримської війни. Ми не мусимо допустити, щоб це повторилося, і мусимо зміцнювати військово-морські бази в регіоні."
 SOV_reverse_the_collectivization_process_tt:0 "Отримає підтримку від самостійних фермерів під час громадянської війни.\nІдею §Y$SOV_factionalism_modifier$§! буде змінено:\n$MODIFIER_LOCAL_BUILDING_SLOTS_FACTOR$: §R-10%§!\n$MODIFIER_STABILITY_POPULARITY_FACTOR$: §G+10%§!\n"
