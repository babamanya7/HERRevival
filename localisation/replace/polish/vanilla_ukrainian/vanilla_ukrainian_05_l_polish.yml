 ITA_missiolini_expand_intelligence_agency:0 "Розширити службу розвідки"
 ITA_missiolinis_desc:0 "Дуче має великі плани, щоби вивести горду італійську націю на належне їй місце. Для втілення свого бачення великої Італії він видає відповідні накази, які, як він сподівається, будуть виконані вчасно. \n\n£ITA_missiolini_text_icon Активні завдання: §Y[?ITA_missiolinis_active_missions]§! \n£ITA_missiolini_text_icon Успішні завдання: §Y[?ITA_missiolinis_successful_missions]§! \n£ITA_missiolini_silver_text_icon Провалені завдання: §R[?ITA_missiolinis_failed_missions]§!"
 ITA_new_industrialization_program:0 "Нова програма індустріалізації"
 ITA_potential_allies_in_the_balkans:0 "Можливі союзники на Балканах"
 ITA_raffaele_de_courten:0 "Раффаеле де Куртен"
 ITA_redshirts_div_cap_12_tt:0 "Змінити межу шаблону §YCamicie Rosse§! на §G+12§!."
 ITA_regia_marina_dynamic_modifier_desc:0 "Тільки забезпечивши домінування на флоті в Середземному морі, ми зможемо убезпечити береги Італії, але для цього ми повинні інвестувати значні кошти в модернізацію флоту."
 ITA_reinforce_regia_aeronautica:0 "Зміцнити Regia Aeronautica"
 ITA_reorganize_regio_esercito_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_infantry_attack_factor$: §G+5.0%§!\n$MODIFIER_MOTORIZED_ATTACK_FACTOR$: §G+5.0%§!\n$MODIFIER_MECHANIZED_ATTACK_FACTOR$: §G+5.0%§!\n\n"
 ITA_reorganize_the_party:0 "Реорганізувати партію"
 ITA_security_militias_desc:0 "Відволікати фронтові війська на охорону тилу — це втрата хороших солдатів. Ми мусимо формувати підрозділи спеціально для охорони тилу армії, щоби вивільнити більше солдатів для боротьби з ворогом."
 ITA_strengthen_the_regime:0 "Зміцнити режим"
 ITA_strengthen_the_regime_desc:0 "Битви за економічну незалежність показали, що фашизм не є слабкою та м'якою ідеологією, як ліберальні режими, що йому передували. Ми мусимо зробити так, щоби люди ніколи цього не забули."
 ITA_subject_DEF:0 "$OVERLORDADJ$а $ITA$"
 ITA_support_nationalist_spain_desc:0 "Іспанія перебуває в розпалі громадянської війни, яка визначить, чи буде вона в майбутньому можливим союзником фашистів, чи залишиться нікому не потрібною республікою — або, що ще гірше, впаде в комунізм чи анархію. Ми мусимо підтримати справжніх іспанців, поки ще не пізно!"
 ITA_tac_bomber_equipment_0_short:0 "Ca.101"
 ITA_utilize_the_blackshirts_desc:0 "Хоча чорносорочники історично були лояльні до фашистського режиму та дуче, якщо ми покажемо їм, що їхня організація може процвітати за нового режиму, можливо, нам вдасться використати їх у власних інтересах. Зрештою, чи справді існує така велика різниця між цими двома режимами?"
 ITA_war_with_the_uk_claims_tt:0 "Отримає претензію на §Yкожну [ENG.GetAdjective]у колонію§! в стратегічних регіонах §Y$STRATEGICREGION_182$§!, §Y$STRATEGICREGION_126$§!, §Y$STRATEGICREGION_128$§!, §Y$STRATEGICREGION_28$§!, §Y$STRATEGICREGION_17$§! і §Y$STRATEGICREGION_216$§! або середземноморський острів, на який [ROOT.GetFlag][ROOT.GetNameDef] ще не має претензію.\nПоточні ефекти:"
 ITZ_fascism:0 "Південно-західна Імперія мая"
 JAM_fascism_ADJ:0 "Хаймаканськ"
 JAN_neutrality_ADJ:0 "Полярн"
 JAP_BLITZKRIEG_DESC:0 "На південному сході точиться війна. Незважаючи на те, що Японія зазнала деяких втрат на початку 1939 року, значна частина китайської території знаходиться під контролем Японії. Напруженість у Європі зростає, і хоча Радянський Союз зосереджує свою увагу на цих питаннях, вони не мусять втручатися у війну в Азії.\n\nКоли ресурси Китаю будуть в руках японців, з Радянським Союзом буде легко мати справу."
 JAP_VICTORY_POINTS_898:0 "Сейшін"
 JAP_a_new_take_on_state_shintoism:0 "Просувати теорію світських святинь"
 JAP_achieving_joubukkokudo_desc:0 "Об'єднання столиць східноазійських держав Махаяни, наше прагнення до створення Чистої Землі, де завдяки новим буддійським соціалістичним ідеалам наше духовне визволення, а також соціальна та економічна емансипація будуть повними, добігає кінця. Слава Ґіро Сеноо, і хай живе Джьобуккокудо!"
 JAP_add_army_and_naval_air_services_modifier_tt:0 "Додає §Y$JAP_army_and_naval_air_services_dm$§!, що дає:\n"
 JAP_aizawa_trial_ongoing:0 "Триває суд над Сабуро Айзавою"
 JAP_alliance_with_siam_desc:0 "Географічне положення Сіаму якомога зручніше для того, щоби допомогти нам у майбутній війні із західними державами. Заручившись його підтримкою, ми значно спростимо невідворотну операцію з вторгнення до Малайю та Ост-Індії."
 JAP_amaterasus_aramitama_desc:0 "Одним із богів, які допомагали Джінґу в її кампаніях проти корейських королівств, був жорстокий дух Аматерасу — Цукісакакі Ідзу но Мітама Амазакару Мукацухіме но Мікото. Цей дух володів великою силою Богині Сонця, яку ми повинні спробувати приборкати для себе!"
 JAP_anti_tank_equipment_2:0 "37-мм скорострільна гармата, тип 1"
 JAP_armored_car_equipment_1:0 "Type 92 Chiyoda"
 JAP_army_faction_demands_more_trucks:0 "$JAP_army_faction$ вимагає більше вантажівок"
 JAP_army_primancy_focus_bypass_tt:0 "$production_effort_tt$ на Японських островах"
 JAP_battle_cruiser_2_desc:0 "Лінійні крейсери проєкту «B-65» були швидкими, помірно броньованими кораблями з хорошою зенітно-ракетною зброєю і сучасним озброєнням. Призначені для боротьби з новими важкими крейсерами ВМС США і для захисту авіаносців Імперського флоту, ці кораблі стали би силою, з якою слід було б рахуватися, якби їх добудували."
 JAP_border_conflict_time_until_cancelled_desc:0 "За нинішніх темпів ми можемо підтримувати бойові дії лише так довго, перш ніж нам доведеться припинити бої."
 JAP_carrier_2:0 "Клас «Soryu»"
 JAP_communist_volunteers:0 "Комуністичні добровольці"
 JAP_develop_nauru_tungsten_deposits:0 "Розвиток залізних родовищ на Науру"
 JAP_develop_samar_steel_deposits:0 "Розвиток залізних родовищ на Самарі"
 JAP_development_for_the_undeveloped_desc:0 "Щоб здійснити справжню революцію, ми повинні розвивати менш розвинені держави, а також покращувати інфраструктуру та промисловий потенціал менших членів альянсу."
 JAP_divert_naval_guns_to_the_army:0 "Передати морські гармати армії"
 JAP_ensure_temporary_peace_with_china:0 "Забезпечити тимчасовий мир з Китаєм"
 JAP_establish_synthetic_fuel_joint_venture:0 "Створити спільне підприємство з синтетичного палива"
 JAP_first_air_fleet_desc:0 "Щоб максимізувати ударну потужність, ми об'єднаємо авіаносці в одну ударну групу та розробимо методики, які дозволять нам узгоджено проводити наступальні операції. Нашим ворогам не вистояти проти нашої переваги у галузі палубної авіації."
 JAP_form_greater_east_asian_customs_union_desc:0 "Як давно планували наші економічні теоретики, ми повинні прагнути створити Тихоокеанський митний союз і повільно, але впевнено об'єднати азійські економіки в єдину найпотужнішу силу."
 JAP_free_asia_pacific_idea:0 "Вільний Азійсько-Тихоокеанський регіон"
 JAP_full_sovereignty_for_the_philippines:0 "Повний суверенітет для Філіппін"
 JAP_fund_propaganda_films_2_tt:0 "Рішення §Y[ROOT.GetImportOrDomesticFilmIndustry]§! можна прийняти ще раз"
 JAP_german_tech_exchange_desc:0 "Подальші німецькі технологічні досягнення були б надзвичайно корисними для наших військових зусиль. Ми повинні подбати про отримання цих схем, чого б це не коштувало."
 JAP_give_it_your_all_for_the_emperor:0 "Віддайте все заради Імператора!"
 JAP_government_faction_demands_limited_navy_influence:0 "$JAP_government_faction$ вимагає обмеження впливу флоту"
 JAP_greater_east_asia_railroad_desc:0 "Наші провідні інженери запропонували ідею залізниці, що з'єднає Японію з материковою Азією та Європою, включаючи тунель або міст, що з'єднає нашу націю з нашими корейськими володіннями. Запозичивши ідею у Південно-Маньчжурської залізниці, наші швидкісні потяги курсуватимуть від Токіо до Рангуна і далі до Тегерана. Нехай наша імперія існує вічно!"
 JAP_greater_east_asia_railroad_tt:0 "Кожен регіон, контрольований нами або нашими союзниками, з рівнем §Yінфраструктури§! менше ніж §Y2§!, отримає §G1§! рівень §Yінфраструктури§!"
 JAP_growing_unrest_in_the_shanghai_concession:0 "Зростання заворушень у Шанхайській концесії"
 JAP_hajime_sugiyama:0 "Хаджіме Суґіяма"
 JAP_hokushin_ron_desc:0 "Фракція в нашій армії, що називає себе «Групою удару на північ», виступає за експансію в Сибір і Монґолію як засіб отримання природних ресурсів та економічної цінності, необхідних для продовження наших імперських амбіцій. Ми повинні підтримати цю ідею і почати підготовку наших сил до впровадження цієї доктрини, коли настане слушний час."
 JAP_hold_speech_in_the_imperial_diet_decision:0 "Виступити з промовою в Імперському сеймі"
 JAP_imperial_army_dm_desc:0 "Імператорська армія Японії є нашою основною наземною силою, яка відіграла центральну роль у нашій швидкій модернізації в епоху Мейджі та брала участь у численних конфліктах, включаючи японо-цінську війну, російсько-японську війну, а також Велику війну. Спочатку сформована з армій князівств після реставрації Мейджі, вона перетворилася на потужну сучасну військову силу під впливом французьких та німецьких зразків."
