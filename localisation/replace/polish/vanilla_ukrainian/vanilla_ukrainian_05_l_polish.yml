 china.10.t:0 "Комуністи відбили наступ"
 china.107.t:0 "Більше не об'єднані"
 china.108.d:0 "Наш внесок у боротьбу проти ненависних японських собак додав великого престижу КПК. Усе більше й більше людей бачать, що ми — майбутнє Китаю, особливо якщо порівнювати нас із корумпованим Ґоміньданом. Партійні кадри вже організовують цих нових послідовників у армію, що попливе на хвилях моря селянства."
 china_nationalist_focus:0 "Дерево фокусів Націоналістичного Китаю"
 chinese_interior:0 "Окупувати внутрішні землі Китаю"
 chinese_interior_short_desc:0 "§LВідтисніть китайців на захід, углиб їхньої території.§!"
 civil_war_desc:0 "Громадянська війна! Нація розділилася на фракції, що воюють між собою за контроль над державою."
 claim_memel_short_desc:0 "§LВимагайте передати Мемель великому Третьому Райху.§!"
