 SAF_heavy_tank_equipment_1:0 "Vickers A1E1 «Independent»"
 SAF_improve_the_three_oh_three_desc:0 "Південноафриканським військам належить боротися в різних кліматичних умовах, і нам пощастило, що гвинтівка «Lee-Enfield» легко піддається модифікації. Інші країни неодноразово змінювали патрон .303, підганяючи його під свої потреби."
 SAF_join_comintern_desc:0 "Радянський Союз давно перебуває на передньому краї боротьби за права робітничого класу та бореться з фашизмом. Ми приєднаємось до їхнього могутнього альянсу."
 SAF_leonard_beyers:0 "Леонард Баєрс"
 SAF_mechanized_equipment_1_short:0 "Bren Carrier"
 SAF_mechanized_equipment_3:0 "Windsor Carrier LP"
 SAF_modern_tank_equipment_1:0 "Centurion"
 SAF_ossewabrandwag_desc:0 "«Вартовий воза» — це африканська націоналістична організація, яка активно підтримує нацистські ідеї. Вони проводять кампанію саботажу проти державної інфраструктури і продовжуватимуть це робити, якщо ми самі не станемо на бік нацистів."
