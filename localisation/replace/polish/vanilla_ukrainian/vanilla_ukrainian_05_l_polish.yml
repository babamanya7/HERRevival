 ENG_blackshirt_march_in_east_anglia:0 "Марш чорносорочників у Східній Англії"
 ENG_chiefs_of_staff_committee_desc:0 "Ми мусимо дати можливість керівникам різних родів військ вести цю війну так, як вони вважають за потрібне. Об'єднаний комітет начальників штабів, сформований ще в 1923 році, тепер отримає можливість координувати операції по всьому світу, підпорядковуючись безпосередньо Військовому кабінету. Це значно спростить планування військових операцій."
 ENG_decolonization:0 "Деколонізація"
 ENG_destroyer_4_desc:0 "Есмінці класу «Battle», побудовані на основі еволюції британських есмінців, які використовувалися протягом війни. Кораблі були замовлені в рамках військово-морських програм 1942 і 1943 років. Вони були добре озброєні як гарматами, так і торпедами. Можливості, швидкість і радіус дії їхнього протиракетного озброєння зробили їх універсальними суднами. Їх пізнє введення у війну призвело до мінімального внеску."
 ENG_enact_the_mosley_manifesto_desc:0 "У попередні роки Мослі підготував маніфест радикальних економічних реформ для подолання бідності. Настав час втілити пропозиції нашого лідера в життя."
 ENG_end_the_blackouts:0 "Закінчити відключення електроенергії по всій країні"
 ENG_expected_decolonization_tt:0 "Спроба перевороту буде попереджена.\n"
 ENG_george_v:0 "Георг V"
 ENG_gibraltar_for_spanish_support_desc:0 "Хоча Ґібралтар здавна вважається невід'ємною частиною нашої нації, можливо, варто домовитися про повернення Ґібралтару до рук Іспанії в обмін на підтримку Франко нашої справи."
 ENG_heavy_tank_artillery_equipment_3:0 "Black Prince AVRE"
 ENG_imperialist_canada_neutrality_ADJ:0 "Імперіалістично-канадськ"
 ENG_imperialist_new_zealand_fascism:0 "Імперіалістична Нова Зеландія"
 ENG_kickstart_the_war_industry:0 "Запустити військову промисловість"
 ENG_light_cruiser_1_desc:0 "Легкі крейсери класу «C» були групою легких крейсерів, побудованих до та під час Першої світової війни для суворих умов Північного моря. Вони виявилися міцними та потужними суднами, незважаючи на те, що вони дещо маленькі та тісні. Їхнє озброєння було більш ніж задовільним, оскільки вони мали достатньо 6-дюймових гармат для боротьби з надводними цілями противника та важке торпедне навантаження для добивання ворожих суден і конвоїв. Вони широко використовувалися під час Першої світової війни та брали участь у багатьох наземних діях."
 ENG_military_training_act_desc:0 "Велика війна залишила в наших людей враження, що їм більше не доведеться воювати. Оскільки світ стає дедалі небезпечнішим, ми мусимо запевнитися, щоб усі здібні молоді чоловіки отримали базову військову підготовку."
 ENG_motion_of_no_confidence:0 "Вотум недовіри"
 ENG_noninterference_treaty_with_germany_desc:0 "Наші імперські амбіції ґрунтуються на тому, щоби не турбуватися про Європу. Можливо, цього легко досягти, якщо [GER.GetNameDef] отримає карт-бланш в Європі в обмін на продовження мирних відносин та їхню обіцянку не втручатися у справи, що стосуються Британської імперії."
 ENG_organize_the_blackshirts:0 "Зорганізувати чорносорочників"
 ENG_reach_out_across_the_channel:0 "Простягнути руку через Ла-Манш"
 ENG_renew_support_for_imperialist_coup_in_new_zealand_tt:0 "Нова Зеландія матиме 90 днів на придушення повстання до того, як воно відбудеться.\n"
