 AAT_norway_communist.7.a:0 "На все добре!"
 AAT_norway_monarchist.5.desc:0 "Із приходом до влади нового регента замість короля виникло питання про те, якими насправді є його наміри щодо держави. Чи бажає він замінити короля Гокона в довгостроковій перспективі, чи він просто має намір допомагати йому в його правлінні? Лише час покаже, якими насправді є його амбіції."
 AAT_norway_rikstanken.1.a:0 "Наш сусід, [?NOR_nordic_tank_seller.GetName]."
 AAT_norway_rikstanken.2.desc_GER:0 "Сила [?NOR_fascist_tank_seller.GetAdjective]их «Панцерів» незаперечна, а їхня індустріальна міць дозволить нам будувати наші танкові війська під будь-яку ціль. Ми також можемо об'єднати з ними зусилля для розробки наших власних танків і допомогти їхнім інженерам усіма можливими способами.\n\nЗвісно, вони очікують від нас ідеологічного зближення незалежно від того, як ми вирішимо підійти до цього."
