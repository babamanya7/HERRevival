 FIN_cancel_motti_tactics_in_state:0 "Зупинити тактику motti в області [FROM.GetName]"
 FIN_confederated_finno_russian_republics_category_desc:0 "Є багато фінів, які живуть у російських республіках і територіях, таких як фіни, естонці, карели, вепси, іжора, водь, сету, виро й інґри. Ми повинні заснувати конфедерацію держав, яка буде звертатися до всіх цих і більше."
 FIN_control_the_flux_of_iron_ore_tt:0 "Вимагає контролю над територіями §Y[666.GetName]§!, §Y[918.GetName]§!, §Y[144.GetName]§!, §Y[924.GetName]§! та §Y[925.GetName]§!.\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! отримує §Y$take_state_focus$§! ціль війни проти будь-якої країни, яка відхиляє [ROOT.GetAdjective]і вимоги."
 FIN_conversion_of_civilian_vessels_desc:0 "Оскільки триває війна, ми повинні використовувати всі доступні ресурси. Завдяки переобладнанню цивільних суден [ROOT.GetName] може швидко зміцнити свій військово-морський потенціал і захистити свої береги від загроз ворога. Великі криголами можна перепрофілювати на кораблі берегової оборони, тоді як менші судна можуть служити міноносцями або патрульними катерами, створюючи потужну оборонну мережу вздовж [ROOT.GetAdjective]ого узбережжя."
 FIN_crack_down_on_the_military_desc:0 "Військові останнім часом поводяться підозріло, і про них потрібно подбати, перш ніж це стане проблемою."
 FIN_cw_soviet_commandos_tt:0 "- Загони радянських командос із 6 §Yпіхотними§! батальйонами, 2 §Yартилерійськими§! батальйонами та 4 §Yбатальйонами підтримки§! §Gвиникнуть у нашій столиці§!.\n\n"
 FIN_expand_production_lines:0 "Розширити виробничі лінії"
 FIN_increase_military_investment_desc:0 "Економічний і матеріально-технічний компоненти конфлікту є такими ж життєво важливими для нашого виживання, як і битви на передовій. Таким чином, ми повинні інвестувати в нашу збройову промисловість, щоб вони могли продовжувати постачати наші сили всім необхідним обладнанням."
 FIN_indoctrinate_the_workers_desc:0 "Завдяки посиленому моніторингу населення ми маємо більше розуміння того, що робить ефективні методи пропаганди. Ми повинні використовувати ці знання для індоктринації населення, забезпечуючи його абсолютну лояльність до уряду та [FIN.GetNameDef]."
 FIN_industrial_development_desc:0 "Оскільки світ стає все більш індустріалізованим, [ROOT.GetName] має йти в ногу, якщо він хоче стати головним гравцем на світовій арені. Інвестиції, які ми робимо у нашу важку промисловість, не лише створять робочі місця та стимулюватимуть економіку, а й також забезпечити ресурси, необхідні для вирішення викликів майбутнього."
 FIN_infantry_equipment_3_short:0 "KP m/44"
 FIN_mannerheim_line:0 "Лінія Маннергейма"
 FIN_mio_trait_rapid_raiders:0 "$FIN_rapid_raiders$"
 FIN_modernize_production_lines_desc:0 "Щоби створити авіаційну промисловість світового рівня, здатну виробляти найсучасніші військові літаки, [ROOT.GetAdjective]ий уряд інвестуватиме в модернізацію національних заводів, відповідальних за виробництво повітряного обладнання, гарантуючи, що [ROOT.GetName] Повітряні сили мають доступ до найновіших і найнадійніших авіаційних технологій."
