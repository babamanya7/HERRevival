 HUN_invite_the_habsburg_prince:0 "Запросити претендента-Габсбурґа"
 HUN_joint_aluminum_mining_company_desc:0 "Оскільки алюміній є незамінним ресурсом для сучасної військової промисловості, ми без особливих зусиль домовимося з Німеччиною про розвиток гірничодобувних підприємств у північній частині країни."
 HUN_kingdom_of_hun_and_rom_communism:0 "Народні федеративні республіки Угорщини та Румунії"
 HUN_light_infantry_divisions_doctrine:0 "Доктрина легких піхотних дивізій"
 HUN_magyarab_science_academy_flag:0 "Засновано Мадярабську академію наук"
 HUN_proclaim_the_restoration_of_austria_hungary:0 "Відновлення Австро-Угорщини"
 HUN_protect_czechoslovakia_desc:0 "За час своєї незалежності Чехословаччина перетворилася на потужну, енергійну державу, проте жадібні сусіди накинули оком на ці землі. Ми запропонуємо протекцію від зовнішніх загроз — або як частину нашої великої імперії, або в ролі її союзника."
 HUN_reintigrate_dalmatia:0 "Реінтегрувати область [103.GetName]"
 HUN_secret_rearmament_desc:0 "Обмеження, накладені Тріанонським договором, не дозволяють нам збільшувати чисельність збройних сил. Однак у міру того, як політична обстановка стає все більш непередбачуваною, а загроза нового конфлікту — все більш реальною, ми не можемо залишатися беззахисними. Ми мусимо почати переозброюватися, навіть якщо доведеться таємно порушити умови договору."
 HUN_socialist_bulwark:0 "Оплот соціалізму"
 HUN_socialist_revanchist_sentiment:0 "Реваншистські настрої"
 HUN_sweden_hungary_unified_democratic_ADJ:0 "Шведсько-угорськ"
 HUN_take_austria_by_force_desc:0 "Першим кроком на шляху відродження великої Угорщини стане возз'єднання з австрійськими землями. Дипломатичний шлях може зазнати невдачі, чого ми не можемо дозволити, тому слід застосувати силу."
