 IRQ_political_events.10.b:0 "Висловити дипломатичний протест."
 IRQ_political_events.18.desc:0 "Сьогодні радісний день для нашої нації, оскільки ми офіційно беремо під контроль управління [455.GetName]. Це знаменує значний крок до об'єднання більшого арабського світу під нашим правлінням."
 IRQ_political_events.20.desc:0 "[FROM.GetAdjective] уряд відхилив план передачі відповідальності за їхню націю [IRQ.GetNonIdeologyName]. Хоча ми думали, що це їх задовольнить, схоже, вони воліють дотримуватися знайомого їм зла."
 IRQ_political_events.20.t:0 "Адміністрація [FROM.GetNameDef] відхиляє пропозицію"
 IRQ_political_events.43.a:0 "Чудово!"
 IRQ_political_events.53.desc:0 "[FROM.GetNameDef] погодився на нашу пропозицію передати Кувейт нашій владі, що знаменує значний крок до об'єднання арабського світу. Ця історична угода зміцнює нашу позицію як лідера в регіоні та наближає нас до реалізації бачення об'єднаної та процвітаючої арабської нації."
 IRQ_political_events.77.desc:0 "Після блискавичної кампанії в області [680.GetName] [IRQ.GetAdjective]а армія захопила всі основні населені пункти та оголосила цей район під своїм контролем."
 IRQ_rally_the_arab_world_desc:0 "Арабський світ прагне скинути кайдани Західних держав. Разом ми об'єднаємо арабські народи та відновимо себе як господарі власної долі."
 IRQ_revoke_anglo_iraq_treaty_desc:0 "Односторонній Англо-іракський договір надто довго гальмував розвиток нашої нації. Але тепер у нас є сила волі протистояти [ENG.GetAdjective] і ми нарешті скасуємо договір. Незалежно від наслідків."
 IRQ_united_arab_republic_communism:0 "Соціалістичні Арабські Республіки"
