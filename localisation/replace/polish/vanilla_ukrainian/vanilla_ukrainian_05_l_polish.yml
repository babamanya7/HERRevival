 DOD_hungary.108.desc:0 "Наш повноважний посол прибув до своєї резиденції в Братиславі. Він простежить за тим, щоб курс, який проводив влада Словаччини, чітко збігався з нашим."
 DOD_hungary.117.t:0 "[SOV.GetLeader] приймає пропозицію"
 DOD_hungary.12.t:0 "Богемія погодилася на тісніші стосунки"
 DOD_hungary.128.t:0 "Німеччина не приймає пропозицію"
 DOD_hungary.129.a:0 "У нас немає вибору."
 DOD_hungary.151.c:0 "Звернутися до Франції"
 DOD_hungary.161.desc_cas:0 "Міністерство авіації бажає придбати новий легкий бомбардувальник для повітряної підтримки наземних сил, але міністерство закордонних справ зазначило, що політичні та дипломатичні мотиви також мають впливати на вибір країни, в якій ми замовимо літаки."
 DOD_hungary.20.desc:0 "В Угорщині спалахнула війна, і в політичних колах активно обговорюють, чи мусимо ми надавати підтримку. Консервативно налаштовані газети закликають допомогти угорцям, заявляючи, що король не повинен сидіти склавши руки, дивлячись на те, як його рідний син, який став королем Угорщини, намагається тримати оборону, з листа анонімної групи армійських офіцерів, що потрапив у пресу, стало зрозуміло, що багато солдатів готові вирушити на війну в Угорщину, якщо уряд їм дозволить. дій."
 DOD_hungary.51.a:0 "Саме так і має бути."
 DOD_hungary.63.desc_HUN_nothing:0 "Конференція з Трансільванії закінчилася повною катастрофою. З незрозумілої причини група вирішила, що вся Трансільванія залишиться під владою Румунії. Незважаючи на те, що в підсумковому варіанті протоколу є пункти, що передбачають захист прав етнічних всяких сумнівів, зазнали нищівної дипломатичної поразки."
 DOD_hungary.64.desc_ROM_nothing:0 "Схоже, договори і традиції повністю втратили сенс. У ході переговорів щодо Трансільванії було вирішено передати всі спірні території Угорщини. Наш уряд досі шокований таким рішенням, але ми мусимо зробити вибір: визнати цю гидоту чи дати їй відсіч?"
 DOD_hungary.66.t:0 "Румунія відмовилася підписати протокол посередницьких переговорів"
 DOD_hungary.72.desc_compromise:0 "Угорська сторона запропонувала нам свій варіант вирішення назрілої кризи. За його умовами північна частина Трансільванії відійде Угорщини, а південна залишиться у Румунії.\n\nНаш міністр закордонних справ вважає, що угорці втратили впевненість у собі, тому ми мусимо досягати ще більш вигідних умов."
 DOD_hungary.86.b:0 "Отже, ми будемо битися одні."
 DOD_hungary.91.a:0 "Добре."
 DOD_romania.10.desc:0 "[ROM.GetLeader] запропонував відродити «санітарний кордон», колись створінь для того, щоби стримати поширення комунізму та завадити Червоній армії увійти до Європи. Щоправда, цього разу його метою стануть два дипломатичні ізгої: [GER.GetNameDef] та [SOV.GetNameDef], яких потрібно розділити.\n\nРумунія вже запропонувала нам вступити з нею у формальний союз."
 DOD_romania.162.t:0 "[romania_new_ally_target.GetNameDefCap] погоджується"
 DOD_romania.22.desc:0 "Наш недавній дипломатичний демарш був прохолодно зустрінутий державою [From.GetNameDef]. Виступаючи на сесії парламенту, [From.GetLeader] заявив, що питання офіційних гарантій для Румунії «буде вирішено, якщо воно коли-небудь стане важливим»."
 DOD_romania.51.a:0 "Чудово."
 DOD_romania.71.t:0 "Югославія пручається"
 DOD_yugoslavia.41.desc:0 "[ENG.GetLeader] нещодавно оголосив про початок дипломатичної кампанії на Балканах. Одним із заходів стала закрита зустріч, яку він провів з нашим послом у Лондоні. У ході зустрічі він запитав про наше ставлення до Німеччини. [GER.GetNameDefCap], зазначив він, забезпечує істотну частину експорту наших несировинних галузей. На його думку, нам не завадило б послабити залежність від Німеччини."
 DOD_yugoslavia.42.desc:0 "Мюнхенська угода, можливо, принесе мир до Європи або навпаки. Німеччина — далеко не єдина держава, яка мріє змінити межі у Європі. Як не дивно, [YUG.GetLeader] та його уряд досі ніяк не відреагували на долю їхнього головного постачальника зброї.\nБагато дипломатів підозрюють, що югослави знали про те, що станеться, і, можливо, дали свою згоду.\n\nМи мусимо нагадати їм про те, що будь-які угоди з Німеччиною будуть сприйняті як ворожі дії, якщо розпочнеться війна."
 DOD_yugoslavia.43.a:0 "Вони просто шукають нових маріонеток."
 DOD_yugoslavia.701.t:0 "[FROM.GetNameDefCap] заперечує!"
 DOD_yugoslavia.801.desc:0 "Нашу делегацію погано прийняли в державі [From.GetNameDef] — їх посол вимагає від нас регіон [103.GetName] в обмін на членство в союзі [From.GetFactionName]."
