 DEN_sovaernet_dynamic_modifier_improved_desc:0 "Данія колись панувала на Балтійському морі, контролюючи хвилі своїми потужними флотами — хоча ще до того в нас була давня морська історія. Вікінги ходили далеко за моря, сіючи страх і захоплюючи землі. Хоча попереду ще багато роботи, флот відновив значну частину своєї колишньої сили."
 DEN_submarine_2_desc:0 "The Havmanden class consisted of five planned submarines. Three were completed before the German occupation, one was completed during the occupation, and the fifth was cancelled. The subs were fairly small, displacing 320 tons. They were armed with five 450mm torpedo tubes."
