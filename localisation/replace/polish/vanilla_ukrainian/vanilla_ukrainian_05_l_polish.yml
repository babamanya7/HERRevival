 GRE_BLITZKRIEG_DESC:0 "Під сильною рукою диктатора Іоанніса Метаксаса стабільність була відновлена в Греції. Чотирирічний план дозволив промисловій базі Греції надзвичайно зрости за останні кілька років, і борг країни — попри те, що він досі надзвичайно високий — видається дещо керованим.\n\nНа жаль, сильний уряд і розумна економічна політика можуть даремно принести користь цій загрозливій країні. Велика та жахлива війна майорить на горизонті, і, незважаючи на тверде наполягання Метаксаса на збереженні Грецією нейтралітету протягом усякого можливого конфлікту в майбутньому, рішення в кінцевому підсумку може приймати не він..."
 GRE_GREATER_GREECE_communism_ADJ:0 "Егейськ"
