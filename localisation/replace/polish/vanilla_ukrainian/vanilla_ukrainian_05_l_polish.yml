 EST_events.6.d:0 "[From.GetNameDefCap] has today requested to extend an invitation into the [Root.GetFactionName] for [FIN.GetNonIdeologyName]. Citing the overwhelming success of nationalism in their nation and the innate desire for Finno-Estonian cooperation, [From.GetLeader] has made a passionate proposal that the [Root.GetAdjective] government consider [FIN.GetLeader] an ally to the nationalist cause."
 EST_events.7.d:0 "Постійні марші та демонстрації по всьому місту змогли остаточно добити ті крихти єдності, що залишалися в державі [Root.GetNonIdeologyName]. Нація тепер розділена повномасштабною громадянською війною. Те, що замислювалося як звичайний захід упокорення демонстрації [Root.GetFascistParty], вчора переросло в люту сутичку з протестувальниками. Ветерани стали битися з солдатами [Root.GetAdjective] армії — тієї самої, в якій служили самі. лише подивитися, хто в результаті буде займати місце глави уряду в місті [Root.Capital.GetName]: [Root.GetLeader] або [neutral_EST_civil_war.GetLeader]..."
 EST_ship_torpedo_sub_2:0 "6x 533-мм торпедний апарат"
 EST_vaps_revolt_category_desc:0 "Низка ветеранських товариств по всій Естонії об'єдналися в єдине фашистське утворення, відоме під назвою Рух вапсів, яке погрожує повалити уряд. Ми мусимо вжити заходів для стримання цього зростання естонського націоналізму, якщо ми хочемо зберегти мирний режим."
