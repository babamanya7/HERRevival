 idea_RAJ_rolling_nuke_barrages:0 "$RAJ_rolling_nuke_barrages$"
 idea_SIA_an_unceasy_alliance_desc:0 "Альянс тримається, але напруга починає проявлятися. Сумніви в уряді непомітно тягнуть націю до більш нейтрального курсу."
 idea_SIA_cemented_control_3_desc:0 "Обов'язок кожного тайця полягає в тому, що в разі війни, яка загрожує суверенітету корони та її народу, кожен гідний таєць повинен чинити опір окупації будь-якими можливими засобами, зі зброєю в руках чи інакше."
 idea_SIA_civilian_slight_support:0 "Цивільне крило: Незначна підтримка"
 idea_SIA_farmers_moving_to_bangkok_bad:0 "$idea_SIA_farmers_moving_to_bangkok_good$"
 idea_SIA_german_tank_studies_desc:0 "Наші офіцери витратили час на вивчення іноземної бронетанкової доктрини та конструкцій, повернувшись із технічними знаннями, які безпосередньо впливають на розвиток наших власних бронетанкових сил."
 idea_SIA_pacific_war_preparations:0 "Підготовка до Тихоокеанської війни"
 idea_SIA_seized_japanese_funds_desc:0 "Оскільки угоду з японцями розірвано, кошти та запаси, які вони залишили після себе, переходять до нас, що стимулює зростання будівництва та промислового виробництва."
 idea_SIA_standing_our_ground_mission_temp_buff:0 "Стійкість до кінця"
 idea_SIA_thai_rice_company:0 "Тайська рисова компанія"
 idea_category_espionage:0 "Шпигунство"
 idea_group_heavy_air_desc:0 "Ідеї та люди, які пожвавлюють розвиток важкої авіації."
 idel_ural_neutrality_DEF:0 "Ідель-уральська держава"
 ideological_groupie:0 "Прихильник ідеологій"
 improved_computing_machine_desc:0 "Тепер можна випускати електронні цифрові комп'ютери. Незважаючи на великі габарити та дорожнечу, ці машини дозволяють аналізувати розвіддані на рівні, незрівнянному з людським."
 improved_sonar_desc:0 "Модулюючи звукові хвилі, ця система може точно вимірювати азимут і відстань до підводної цілі.\n\nУстановка цього модуля в комірку §YЕлектроніка§! на §Yлегкі кораблі§! та §Yкрейсери§! допоможе їм виявляти ворожі §Yпідводні човни§!."
 in_prison:0 "У в'язниці"
 inclimate_weather_experience_spirit:0 "Досвід неприємної погоди"
