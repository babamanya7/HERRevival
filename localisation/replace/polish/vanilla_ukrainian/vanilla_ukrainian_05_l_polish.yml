 NOR_permanent_revolutionary:0 "Вічний революціонер"
 NOR_promote_the_armed_defense_of_the_country_desc:0 "Людям [NOR.GetName] слід нагадати про те, що станеться, якщо вони не захищатимуть нашу країну. Кожен має зіграти свою роль у майбутньому конфлікті."
 NOR_prop_up_the_economy_desc:0 "Ми не зможемо досягти наших політичних цілей, якщо люди будуть голодні. Ми повинні призупинити наш монархічний хрестовий похід, щоб подбати про наших підданих та їхні потреби."
