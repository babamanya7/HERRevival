 YUG_defence_league_desc:0 "Членам нашої держави надано великий рівень автономії; залишився лише останній крок. Офіційно визнавши незалежність усіх балканських націй, ми перетворимо Югославію з нації в економічний і військовий кооператив багатьох націй."
 YUG_friendship_treaty_with_italy_desc:0 "Італія, як наш найпотужніший безпосередній сусід, повинна сприймати нас як друзів. Ми почнемо переговори про декларацію дружби між нашими двома народами."
