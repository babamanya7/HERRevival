 PAR_align_with_the_guion_rojo_desc:0 "Нам потрібно взяти під своє крило воєнізовану організацію партії «Колорадо» та її лідера, Хуана Наталісіо Гонсалеса. Ми використаємо їх, щоб погрожувати та переслідувати нашу політичну опозицію."
