 LEADER_COMING_HEADER:0 "§YШтаб армії ($NAME$)§! завершить розгортання за §Y$DAYS$§! дн."
 LEADER_DEPLOYMENT_TIMING_INFO:0 "Час, необхідний для розгортання або відкликання, залежить від £manpower_texticon людських ресурсів підрозділу армійського штабу. Більші дивізії потребують значно більше часу."
 LEADER_DEPLOY_NEED_MANPOWER:0 "§RНедостатньо людських ресурсів для розгортання§!"
 LEADER_PROXIMITY_FREE_CONTROL_MODIFIERS_NOTE:0 "§HДистанція від армійського штабу до призначеної лінії фронту в будь-який момент часу впливатиме на боєздатність підрозділів на тому самому наказі.§!"
 LEADER_PROXIMITY_NO_HQ:0 "§RПризначте командувача, щоб мати змогу змінювати дистанцію §Yармійського штабу§! до лінії фронту.§!"
