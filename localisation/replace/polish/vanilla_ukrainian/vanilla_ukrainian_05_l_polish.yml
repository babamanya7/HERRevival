 FACTION_UPGRADE_INTELLIGENCE_BONUS_DESC:0 "Завдяки §Hобміну розвідданими§! альянсу ви завершуєте §Hпокращення агентства§! на $BONUS|H.0%$ швидше, якщо інший член альянсу вже відімкнув це §Hпокращення§!.\n\nВаш альянс може збільшити §Hобмін розвідданими§!, утримуючи §Hпозиції розвідки§! у вашому альянсі."
