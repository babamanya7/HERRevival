 BRA_allow_the_church_to_operate_desc:0 "Серед духовенства Південної Америки починає вкорінюватися новий рух. Духовенство виступає за соціалістичні політики, які б раз і назавжди витягли найбільш нужденних із нашого народу з бідності. Можливо, ми повинні прийняти цих радикальних теологів, а не гнівити вірний пролетаріат, який їх підтримує."
 BRA_attack_bolivia_desc:0 "Тропічний ліс Амазонки внутрішньо є [BRA.GetAdjective]. Той факт, що [BOL.GetNameDef] продовжує займати його частини, більше не можна терпіти."
