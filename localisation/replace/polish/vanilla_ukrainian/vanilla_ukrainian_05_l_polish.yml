 BUL_agrarian_cooperative_movement_desc:0 "Ми мусимо черпати натхнення від аграрних заходів, запропонованих Землеробським національним союзом, і сприяти організації села на основі кооперативів."
 BUL_balkan_confederation_cooldown_tt:0 "[GetDecisionCooldownTooltip] §Y365 днів§!.\n"
 BUL_balkan_federation_propaganda:0 "Пропаганда Балканської федерації"
 BUL_balkan_research_cooperation_desc:0 "Ми мусимо розробити програму співпраці, яка дозволить науковцям з різних країн нашої [GetFederationOrConfederation] ділитися своїми відкриттями та розвивати нові технологічні досягнення."
 BUL_ban_far_right_organizations_tt:0 "Будуть відкриті рішення по придушенню фракції [GetNsmName]."
 BUL_brannik_desc:0 "Ця профашистська національна молодіжна організація, заснована Боґданом Філовим, стає все більш масовою і з моменту свого заснування дала нам значну кількість членів, які прагнуть приєднатися до наших військових сил."
 BUL_bulgarian_shipping_chamber_desc:0 "Ми мусимо забезпечити болгарські судноплавні компанії та кооперативи засобами, які їм необхідні для постійного збільшення флоту, оскільки їхні конвої мають вирішальне значення для торгівлі в мирний час, а також для перевезення військ і постачання під час війни."
 BUL_bzns_popularity_status:0 "[GetBznsPopularityStatus]"
 BUL_cooperation_appoint_bzns_members_desc:0 "Фракція [GetBznsName] довела, що складається з компетентних людей, у яких багато цікавих ідей та ініціатив. Ми запропонуємо його найвидатнішим лідерам посади в уряді."
 BUL_cooperation_appoint_faction_members_tt:0 "Лояльність фракції вища, ніж §Y70§!\nПопулярність фракції вища, ніж §Y55§!"
 BUL_cooperation_bzns_joint_act:0 "Спільний виступ із $BUL_bzns_name_ins$"
 BUL_crush_the_communists_desc:0 "Незважаючи на те, що в цьому столітті їх багато разів репресували, комуністи все ще ховаються в тіні, полюючи на нещасних і ізгоїв, щоби згущувати свої ряди. Наш обов'язок — покінчити з ними раз і назавжди, будь-якими необхідними засобами..."
 BUL_depose_the_tsar_cw_tt:0 "Прихильники §Yнейтралітету§! почнуть громадянську війну."
 BUL_dominance_in_the_adriatic_aegean_failure:0 "Наша нездатність убезпечити Егейське море завдала серйозного удару по моральному духу Болгарії. Якщо ми хочемо відновити сміливість і впевненість, ми мусимо забезпечити болгарське панування на Адріатиці."
 BUL_fight_alongside_country_comrades:0 "Битися пліч-о-пліч із нашими [FROM.GetAdjective]ими товаришами"
 BUL_foreign_agreements_factions_ger_tt:0 "Не в альянсі з державою §Y[GER.GetNameWithFlag]§! (або §Y[GER.GetNameWithFlag]§! — суб'єкт держави §Y[ROOT.GetNameWithFlag]§!)"
 BUL_guardians_of_the_balkans_remove_ns_tt:0 "Національний дух §YДоля Балкан§! буде видалений після завершення цього фокусу, якщо він усе ще буде активним."
 BUL_heavy_industry_desc:0 "Після успішної реорганізації сільського господарства ми нарешті маємо можливість здійснити сучасну та амбіційну програму індустріалізації в Болгарії."
 BUL_integrate_the_ratniks_desc:0 "«Ратніки», або Союз воїнів прогресу болгарства — нещодавно заснована націоналістична воєнізована організація, яка могла б виявитися дуже корисним інструментом у підтримці режиму та значної кількості живої сили для армії."
 BUL_macedonian_revolutionary_organizations_desc:0 "[GetImroDecisionCategoryDesc]"
 BUL_national_naval_designer_upgrade_tt:0 "\nВиконання фокусу §Y$BUL_an_aegean_sea_fleet$§! поліпшить цього конструктора.\n"
 BUL_opression_repress_nsm:0 "Репресувати $BUL_nsm_name_acc$"
 BUL_power_to_the_tsar_desc:0 "«Звено» встановили авторитарний військовий режим до того, як його скинув цар Боріс III у 1935 році. Але цар зберіг цю централізацію влади, і настав час добре використати її, якщо ми хочемо об'єднати роздроблену націю."
 BUL_pressure_to_lift_army_restrictions:0 "Змусити скасувати обмеження на армію"
 BUL_prussia_of_the_balkans:0 "Пруссія Балкан"
 BUL_rearmament_negotiations_ongoing_flag:0 "Зараз веде переговори щодо переозброєння армії"
 BUL_recover_italian_territories_ita_will_refuse_tt:0 "\n§R§Y[ITA.GetFlag][ITA.GetNameDefCap]§! відмовиться поступитися своїми територіями на Балканах у цей момент через війну держави §Y[ITA.GetFlag][ITA.GetNameDef]§! або §Yбудь-якого [ITA.GetAdjective]ого союзника§! з державою §Y[ROOT.GetFlag][ROOT.GetNameDef]§!.§!"
 BUL_rejected_our_demands:0 "Відхилили наші вимоги"
 BUL_restore_the_bulgarian_patriarchate:0 "Відновити Болгарський патріархат"
 BUL_scout_plane_equipment_1:0 "КБ-5 «Чучулига III»"
 BUL_second_national_catastrophe_desc:0 "Після нашої поразки у Великій війні Ньойї-сюр-Сенський договір змусив нас поступитися величезними територіями, які зараз належать Югославії, Греції та Румунії, і донедавна Ліга Націй вимагала від нас пріоритету виплати великих воєнних репарацій, калічачи нашу економіку та неминуче збільшуючи борги нашої країни. Національний дух так і не оговтався від цього удару, тому не дивно, чому цей договір у Болгарії в народі називають Другою національною катастрофою..."
