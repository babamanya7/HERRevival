 convoy_escort_efficiency_tt:0 " $MODIFIER_MISSION_CONVOY_ESCORT_EFFICIENCY$: $RIGHT|+=%1$"
 country_capitulated.0.d_positive_both_no_faction:0 "\n[From.From.GetLeader] оголосив, що боягузлива [Root.GetAdjective]а держава більше не може встояти під тиском розміщених у державі [From.From.GetAdjective]их військ. [Root.GetAdjective]а влада вирішила втекти з держави й створити уряд у вигнанні. Їхні основні війська капітулювали, а [From.From.GetNameDef] тепер контролює їхні головні території.\nПопри те, що війна продовжується, тим не менш це велика перемога для держави [From.From.GetNameDef]."
 country_capitulated.0.d_positive_collab_invaded_same_ideology:0 "\n[Root.GetNameDef] оголосили про свою повну капітуляцію перед [From.From.GetNameDef]. Деякі громадяни [Root.GetAdjective], незадоволені від [From.From.GetRulingIdeologyNoun_RU_lower_Gen], який державі [Root.GetNameDef] нав'язав [Root.GetLeader], приєдналися до солдатів [From.From.GetAdjective], щоб усунути його від влади і сформувати новий уряд під керівництвом [From.From.GetNameDef]. [From.From.GetLeader] зауважив, що ця взаємна угода принесе нову епоху процвітання та співпраці для [From.From.GetNameDef]\n[Root.GetLeader] у відповідь заявив, що [From.From.GetLeader] не є справжнім [From.From.GetRulingIdeology] і навіть у вигнанні він продовжуватиме боротися за [Root.GetNameDef] та підтримуватиме всі зусилля опору на своїй батьківщині."
