 AST_broken_hill_propietary_company:0 "Компанія «Broken Hill Proprietary»"
 AST_cabinet_trust_state_2_idea:0 "Низька довіра до кабінету"
 AST_carrier_2_desc:0 "The Ark Royal aircraft carrier was the first such vessel to be built to fit the restrictions of the Washington Naval Treaty. She was the first ship on which the hangars and flight deck were an integral part of the hull. Designed in 1934, the vessel was well-armored and armed. It carried a large complement of aircraft and had adequate operational range and speed to keep up with the major forces of the Royal Navy."
 AST_commonwealth_aircraft_corporation:0 "Commonwealth Aircraft Corporation"
 AST_country_party_influence_alp_tt:0 "Щоденний приріст голосів §YA.L.P§!: §Y+0.02%§!"
 AST_demand_central_africa:0 "Вимагати Центральну Африку"
 AST_demand_resources_desc:0 "Експансіоністські агресори дивляться на Індокитай не лише через саму територію, але й через ресурси, якими він володіє. Якщо ці багатства потраплять до ворожих рук, вони лише затягнуть війну, тоді як у наших руках вони допомогли б покласти їй край. Ми вимагатимемо контролю над цими ресурсами; якщо їхні власники відмовляться співпрацювати, вони не кращі за ворога."
 AST_denim_factory:0 "Джинсова фабрика"
 AST_destroyer_3:0 "Клас «Nizam»"
 AST_diplomatic_events.12.a:0 "Ми повинні вистояти без них."
 AST_diplomatic_events.13.a:0 "Ми скличемо."
 AST_diplomatic_events.14.t:0 "[NZL.GetNameDefCap] стає австралійським штатом"
 AST_diplomatic_events.27.desc:0 "[ENG.GetNameDefCap] не погоджується; Тихоокеанський регіон не буде зміцнений під централізованим контролем. Тихоокеанські території залишаться під владою Британії."
 AST_diplomatic_events.31.t:0 "[FROM.GetNameDefCap] надає [AST.GetName] права на ресурси"
 AST_diplomatic_events.4.b:0 "Сінгапур залишиться нашим."
 AST_diplomatic_events.44.t:0 "Передача Південно-Східної Азії"
 AST_diplomatic_events.66.a:0 "Відмінний перший крок"
 AST_diplomatic_events.74.b:0 "Філіппіни залишаться нашими!"
 AST_diplomatic_events.9.a:0 "Ми повинні впоратися з поставками самостійно."
 AST_eastern_focus:0 "Сфокусуватися на сході"
 AST_election_events.2.t:0 "Екватор до федеральних виборів"
 AST_eminent_successors_desc:0 "Деякі з жертв авіакатастрофи в Канберрі були дуже поважними урядовцями. Хоча немає жодного способу компенсувати їхню жахливу долю, можливо, призначення кількох видатних наступників стабілізувало б уряд і відновило довіру як громадськості, так і міністрів."
 AST_free_healthcare_policy_desc:0 "Наші люди заслуговують на те, щоб бути вільними від хвороб і травм, а якщо станеться найгірше, вони не повинні ставати жебраками через нещастя, як це буває в інших суспільствах. Ми забезпечимо загальний доступ до охорони здоров'я, лікарень та лікарів — бо здоровий народ це продуктивний народ."
 AST_fund_owen_gun_research_desc:0 "Евелін Оуен створив новий пістолет-кулемет, здатний витримати тяжкі умови війни у джунглях. Ми маємо профінансувати виробництво та модернізацію цієї зброї на державному рівні."
 AST_graziers_to_industry_desc:0 "Під час Великої депресії наші міста спорожніли, оскільки робітники шукали стабільності в селі. Тепер, контролюючи засоби виробництва, ми можемо повернути їх у промисловість. Ми повинні вселити в них розуміння потреби нації: печі промисловості мають живитися потом людей."
 AST_hmas_sydney_desc:0 "Епоха лінкорів закінчилася. Майбутнє військово-морської сили лежить у небі над флотом, і Австралія не залишиться позаду. Після років відбудови та модернізації нашого флоту ми готові зробити останній крок; авіаносець, який визначатиме морську могутність Австралії для наступних поколінь."
 AST_holding_the_battlefield_desc:0 "Багато австралійських солдатів полягли за океаном лише для того, щоб їхні зусилля були зараховані як британські. Австралія вимагає більшого впливу за столом перемовин нарівні з [ENG.GetNameDef] на мирних конференціях; інакше наша допомога може припинитися."
 AST_ireland_weapon_smuggling_cat:0 "Озброєння ірландців"
 AST_light_cruiser_1:0 "Клас «C»"
 AST_medium_tank_aa_equipment_2_short:0 "Sentinel AA"
 AST_mio_trait_evans_deakin_lightweight_hull_construction:0 "Полегшена конструкція корпусу"
 AST_mio_trait_nswgr_sentinel_casting_programme:0 "Програма лиття для танків Sentinel"
 AST_naval_auxiliary_patrol:0 "Додаткові берегові патрулі"
 AST_northern_ireland_rises_up:0 "Повстання в Північній Ірландії"
 AST_organize_in_nation:0 "Проникнути в профспілки в §Y[FROM.GetName]§!"
 AST_peter_jeffrey:0 "Пітер Джеффрі"
 AST_pleading_britain_desc:0 "Війна, безумовно, наближається, і це змушує наші коліна тремтіти. З усією повагою до духу ANZAC та репутації Діггерів, воєнний потенціал Австралії швидко вичерпався б без допомоги [ENG.GetName]. Прем'єр-міністр надішле телеграму у Британію за першої ж нагоди."
 AST_political_events.8.t:0 "Війна наближається"
 AST_prospect_pilbara_iron_decision:0 "Відкрити регіон Пілбара для видобутку"
 AST_protect_overseas_commerce:0 "Захист торговельних шляхів"
 AST_red_fred_desc:0 "«Червоний» Фред Патерсон вперше став відомим у комуністичному русі як кандидат на посаду мера Брісбена у 1934 році, де зазнав нищівної поразки. Однак його амбіції залишаються незмінними, і тепер він балотується на виборах олдмена в Таунсвіллі. З нашою підтримкою він може стати першим комуністом, обраним на державну посаду."
 AST_reverse_wage_cuts_desc:0 "Щоб дати бізнесу шанс на виживання, ми впровадили серію скорочень заробітних плат в усій економіці. Тепер, коли ми бачимо ознаки відновлення, нам слід змінити курс. Зростання зарплат веде до збільшення купівельної спроможності, що допомагає стимулювати споживання та економічне зростання."
 AST_rocket_artillery_equipment_1:0 "RP-3 High Explosive/General Purpose"
 AST_scorch_the_north_tt:0 "§YЕфекти, коли на Північний штат здійснюється морське вторгнення:§!"
 AST_scrap_iron_flotilla_taog_idea:0 "Флотилія металобрухту"
 AST_seven_million_britishers_desc:0 "Хоча [ENG.GetLeader] не наважувався давати нам будь-які обіцянки, ми віритимемо в його і Британії відданість [AST.GetNameDef], коли настане критичний момент. Зрештою, ми — лише сім мільйонів британців."
 AST_standard-bearer:0 "Прапороносець"
 AST_the_bolsheviks_counterforce_desc:0 "Слідчий відділ десятиліттями проводив розслідування діяльності підривних груп. Його робота з придушення лівих загроз має високу цінність, і нею не слід нехтувати лише тому, що опоненти «Австралії понад усе» прагнуть протидіяти нашому зростанню. Ми шукатимемо посади в австралійському розвідувальному управлінні та забезпечимо, щоб реальній загрозі національній безпеці приділявся пріоритет."
 AST_the_pacific_garrison_2:0 "Тихоокеанський гарнізон"
 AST_the_pacific_garrison_eng:0 "Тихоокеанський гарнізон"
 AST_the_promise_of_nauru:0 "Обіцянка Науру"
 AST_the_red_pacific_desc:0 "Тихий океан має бути перебудований за образом революції. Від островів до узбережжя нашого регіону ми підтримуватимемо піднесення соціалістичних урядів і подбаємо, щоб червоний прапор майорів від берега до берега."
 AST_uap_confirmed_election_winner_text:0 "§YУАП§! §WПЕРЕМОГА НА ВИБОРАХ§!"
 AST_unlocking_conscription_1903_tt:0 "Розблоковує §YЗакони про призов§!."
 AST_voluntary_foreign_service_idea:0 "Добровільна служба за кордоном"
 AST_walls_and_whispers_desc:0 "Неприступні стіни у поєднанні з вухом, припалим до землі, створюють величезний потенціал для національної безпеки. Буде вжито заходів для покращення сухопутної та берегової оборони по всій нашій країні, а також для створення розвідувальної штаб-квартири всередині."
 ASY_neo_assyrian_empire_fascism_DEF:0 "Велика Новоассирійська імперія"
 ASY_neo_assyrian_empire_neutrality_DEF:0 "Новоассирійська імперія"
 ASY_shimun_eshai:0 "Мар Ешай Шімун XXIII"
 AUS_a_royal_alliance_tt1:0 "Ми запросимо §Y[ENG.GetNameWithFlag]§! в §Y$AUS_a_royal_alliance$§!"
 AUS_adolf_scharf:0 "Адольф Шерф"
 AUS_anschluss_ratio_lowered:0 "§YЗагальна Боєздатність Армії§! необхідна для §YАншлюсу§! буде §YЗнижена§!"
 AUS_austromarxism:0 "Австромарксизм"
 AUS_basic_tanks_desc:0 "Більшість наших танків доволі застарілі, над ними можна було б трохи попрацювати. Тепер, коли у нас є хтось, хто будує танки, нам може бути корисно інвестувати в дослідження того, як найкраще удосконалити наші танки."
 AUS_continue_old_production_desc:0 "Перш ніж ми втратили контроль над нашим узбережжям, ми почали виробництво двох славетних лінійних кораблів. Їхні корпуси все ще в наших руках, і хоча вони вже трохи застаріли, вони все ще можуть стати чудовим аргументом наших нових ВМС."
 AUS_danubian_unity:0 "Дунайська єдність"
 AUS_demand_romanian_lands:0 "Вимогти Трансільванію та Буковину"
 AUS_demand_romanian_lands_desc:0 "Захопивши деякі землі у наших безпосередніх сусідах, ми тепер можемо кинути погляд на наші старі території далі. Землі, якими ми володіли в сучасній Румунії, були для нас великим надбанням, і ми повинні повернути їх якнайшвидше. Не сильно важливо, що думає румунське керівництво. Якщо вони не підкоряться добровільно, нам доведеться використати інші варіанти; один, який розуміє кожна країна."
 AUS_devaluing_the_schilling_tt:0 "Коли національний дух §Y$AUS_devalued_the_schilling$§! прибереться, фокуси §Y$AUS_bring_phonix_insurance_from_the_ashes$§! та §Y$AUS_great_austrian_economic_push$§! стануть доступні."
 AUS_erwin_von_lahousen:0 "Ервін фон Лагузен"
 AUS_focus_on_domestic_production:0 "Вітчизняне літакобудування"
 AUS_form_evidenzburo_tt:0 "Застосовані поліпшення для агентства залежатимуть від обраної нами §YОборонної§! чи §YАгресивної§! тактик по фокусам вище"
 AUS_further_balkan_demands:0 "Подальші балканські вимоги у [FROM.OWNER.GetNameDef]"
 AUS_great_austrian_economic_push_tt:0 "Ще більше покращує австрійські економіку та виробництво, замінюючи ідею §YВідновлення від економічної депресії§! на §YЕкономічний бум§!"
 AUS_grossosterreich_neutrality_ADJ:0 "Австрійськ"
 AUS_heimito_von_doderer:0 "Гайміто фон Додерер"
 AUS_host_of_communist_dissidents:0 "Притулок комуністичних дисидентів"
 AUS_invite_foreign_tank_designers_tt:0 "§YAnsaldo§! буде відкрито в якості виробника танків (Стандартизоване виробництво)"
 AUS_lawmaking_leniency_desc:0 "Система прийняття нових законів у нас доволі архаїчна і потребує перегляду. У такі часи ми повинні мати можливість швидко приймати нові закони, оскільки ситуація змінюється день у день. Ми повинні розглянути можливість лобіювання більш спрощеного законотворчого процесу."
 AUS_legacy_of_the_empire:0 "Спадщина Імперії"
 AUS_militarization_effort_desc:0 "Однією з компаній, на яку сильно покладалася наша колись могутня армія, була Grazer Maschinen- und Waggonbau-Aktiengesellschaft. Створення не тільки транспортних засобів, але й осей для гаубиць і гвинтівок; колись вони були наріжним каменем нашої військової спроможності. Ми зробимо їх такими знову. Заради Австрії та її народу."
 AUS_mio_robust_light_aircraft:0 "Конструктор надійної легкої авіації"
 AUS_news_events.3.t:0 "Нещасна доля аса"
 AUS_no_longer_fascist_cardinal:0 "Фашистського кардинала більше немає"
 AUS_osterreichische_fleugzeugfabrik_organization:0 "Österreichische Fleugzeugfabrig AG"
 AUS_payment_for_alaska_desc:0 "Продаж Аляски викликав суперечки серед нашого народу, але ніхто не може заперечити його позитивний вплив на нашу країну."
 AUS_political_events.101.a:0 "Нарешті."
 AUS_political_events.104.b:0 "Що може піти не так?"
 AUS_political_events.109.a:0 "Якось... неспокійно."
 AUS_political_events.11.t:0 "[GER.GetNameDefCap] висловлюється проти нашого військового командування"
 AUS_political_events.113.t:0 "[FROM.GetNameDefCap] відхиляє Пакт про ненапад"
 AUS_political_events.12.desc:0 "[FROM.GetNameDefCap] звернулася до нас із пропозицією підтримки у формі піхотного спорядження. Вони високо цінують нас як найціннішого союзника та бажають, щоб ці гвинтівки використовувалися для наших військових зусиль у війні з Ефіопією, щоб допомогти забезпечити нашу перемогу у цій війні."
 AUS_political_events.20.c:0 "Можливо, вийде досягти взаємовигідної домовленості?"
 AUS_political_events.22.b:0 "Ні дипломатія, ні техніка нас не врятують!"
 AUS_political_events.23.desc:0 "[FROM.GetNameDefCap] надсилає нам відповідь щодо нашого прохання про допомогу власним запитом. З часу укладання цього Сен-Жерменського договору, ми намагалися повернути собі регіони Альто-Адідже та Трентіно, оскільки вони по праву належать нам. [FROM.GetNameDef] вважає ці землі своїми, і якщо ми хочемо отримати гарантії нашої незалежності, їх вимога з нашого боку, щоб ми раз і назавжди відмовилися від цих претензій."
 AUS_political_events.28.desc:0 "Нарешті ми отримали відповіді від гарантів, і чекати було варто. Після багатьох дискусій і переговорів між ними, вони вирішили, що ми можемо переозброїтися, і оголосили Сен-Жерменський Договір застарілим. Ми більше не зв’язані вчинками наших предків."
 AUS_political_events.3.a:0 "Час готуватися до найгіршого..."
 AUS_political_events.78.desc:0 "Лідери [FROM.GetCommunistParty] в державі [FROM.GetNameDef] знову звернулися до нас з проханням про допомогу. Хоча зараз вони не перебувають у збройному конфлікті, пекуча невдача перевороту 1934 року разом із соціал-демократами все ще горить у їхній пам’яті. Тепер, коли вони знову борються за владу у своїй країні, вони хочуть отримати нашу допомогу. Наша відповідь?"
 AUS_propose_a_federative_union_decision_more_likely_tt:0 "Вони будуть більш схильні погодитись, якщо ми §YПідтримали їх промисловість§! або §YВідправили їм військове спорядження§!. За наявності §YСильнішої армії§!, шанси на їх погодження теж зростуть.\n\n§RВеликі Держави, як правило, не схильні погоджуватись§!"
 AUS_renew_claims_in_italy:0 "Відновити претензії до Італії"
 AUS_repeal_the_habsburgergesetz:0 "Скасувати закон Габсбурґів"
 AUS_revolution_desc:0 "Настав час, коли ми вже не можемо діяти лише як опозиція до керівної партії. Наші люди заслуговують кращого, ніж те, що може дати нинішнє керівництво. Наша зростаюча популярність доводить, що настав час для удару!"
 AUS_saurerwerke_desc:0 "Протягом тривалого часу Österreichische Saurerwerke виготовляла вантажівки різного призначення. У такі часи нам потрібно, щоб вони зосереджувалися виключно на тому, у чому вони найкращі, а саме на виготовленні вантажівок для військових."
 AUS_seek_international_partners_tt3:0 "§Y[ROOT.GetNameWithFlag]§! отримає §YДоступ до ринку§! будь-якої країні, яка відповість згодою!"
 AUS_seize_galicia:0 "Захопити галицькі землі"
 AUS_theodor_innitzer:0 "Теодор Інніцер"
 AUS_tighten_control_of_subjects_desc:0 "Ми зарекомендували себе, як володарі деяких наших старих земель. Хоча це, звичайно, чудово, ми не можемо зупинятися на цьому. Наші маріонеткові нації заслуговують на те, щоб ними керували великі лідери, як і нами. На щастя, ми знаємо як раз таких людей!"
 AUS_true_liechtenstein_neutrality_DEF:0 "Ліхтенштайн"
 AUS_via_danube_to_europe_tt:0 "Заміняє сукупність рішень §YДунайської Федерації§! на сукупність §YЄвропейського Союзу§!, що дозволять запросити більше країни й форсувати їх до §YОбмеженої федералізації§!\n\n§RФокус об'єднаного дерева Австро-Угорщини§! ''§Y$HABSBURG_an_empire_not_just_in_name$§!'' §Rбуде заблокований, що, якщо це §Yнейтрал§!, застосувавши §Yнаціональний дух§! до всіх суб'єктів зі §Yспільним деревом фокусів§!, який знижує автономію, зробить процес повної інтеграції маріонеток простішим§!."
 Ancyra:0 "Анкіра"
 BAD_TEMPORARY_BUFF:0 "$BUFF_REASON$: $VALUE|%-=1$ ($NUM_DAYS|0H$ дн.)\n"
 BALTIC_belarus:0 "$NONIDEOLOGY$-Білорусь"
 BALTIC_catholic_opposition_idea:0 "Католицька опозиція"
 BALTIC_domestic_motors:0 "Вітчизняний автопром"
 BALTIC_events.203.d:0 "Не зумівши заручитися достатньою підтримкою, щоб витримати [SOV.GetAdjective] вторгнення, [From.GetLeader] вирішує залишити ідею про Балтійську Антанту і шукати інші варіанти. На превелике розчарування всієї нашої нації, мрія про протиборство [SOV.GetAdjective] армією пліч-о-пліч з союзниками в державі [From.GetNameDef] так і залишиться мрією."
 BALTIC_ford_motors_desc:0 "Компанії «Ford» чудово вдалося забезпечити доступними автомобілями американців та інші союзні країни по всьому світу. Якщо заснувати завод «Ford» у місті [Root.Capital.GetName], ми зможемо як виробляти машини для своєї армії, так і отримувати прибуток, експортуючи їх у захід."
 BALTIC_influence_neighbours:0 "Вплинути на сусідів"
 BALTIC_invest_in_baltic_trade:0 "Інвестувати в балтійську торгівлю"
 BALTIC_supported_fascism:0 "Підтримка балтійського націоналізму"
 BALT_claims_no_less_than_2_tt:0 "§YРадянські претензії§! — щонайменше §Y2§!"
 BAN_ADJ:0 "Банґладеськ"
 BAN_DEF:0 "Банґладеш"
 BAN_democratic_ADJ:0 "Банґладеськ"
 BAN_neutrality_ADJ:0 "Банґладеськ"
 BASE_VALUE2:0 "Базова величина: $VALUE|2Y$"
 BBA_SWI_annual_election.2.c:0 "Обрати [SWI_GetCouncilor3name]"
 BBA_african_union_events.17.t:0 "[FROM.GetNameDefCap] приєднується до оборонного пакту"
 BBA_ethiopia_anti_colonialism_events.5.desc:0 "Після невдалої спроби посередництва у нашій війні проти держави [?global.african_colonial_country.GetNameDef], [?global.african_supporting_country.GetNameDef] вирішила активно підтримати [ROOT.GetAdjective]у боротьбу. [?global.african_colonial_country.GetAdjectiveCap]ий посол у [?global.african_supporting_country.GetName] був поінформований, що [?global.african_supporting_country.GetNameDef] вважає себе у стані війни з державою [?global.african_colonial_country.GetName] з цього моменту, аж доки [?global.african_colonial_country.GetNameDef] не відмовиться від своїх імперіалістичних та колоніальних амбіцій у Африці та деінде."
 BBA_ethiopia_communist_events.20.desc:0 "[SOV.GetNameDefCap] відхилили нашу пропозицію щодо тренування пілотів. Ми сподівалися, що це пришвидшить розвиток наших ВПС, але схоже, що в СРСР зараз інші пріоритети. Проте нам надали креслення для виробництва власних літаків."
 BBA_ethiopia_communist_events.21.desc:0 "Наші товариші з [SOV.GetName] погодилися допомогти нам у підготовці пілотів. Вони також щедро надали кілька літаків для нашого використання. Це значно прискорить наші плани зі створення повітряних сил, здатних протистояти [ITA.GetAdjective]им силам."
 BBA_ethiopia_communist_events.22.t:0 "[ITA.GetNameDefCap] відмовляється припинити війну з [ETH.GetNameDefCap]"
 BBA_ethiopia_communist_events.50.a:0 "Ми не віддамо наші землі."
 BBA_ethiopia_communist_events_15_tt:0 "§Y$SOV_semyon_budyonny$§! та §Y$SOV_vasily_kuznetsov$§! стануть доступними генералами."
 BBA_ethiopia_exile_events.15.a:0 "Це початок нової ери"
 BBA_ethiopia_exile_events.32.desc:0 "До нас звернулися [FROM.GetLeader] та [FROM.FROM.GetLeader] з проханням приєднатися до [ROOT.GetFactionName]. Це надасть сили як [FROM.GetNameDef], так і [FROM.FROM.GetNameDef] для війни з [ROOT.GetFactionName] проти [ITA.GetName]."
 BBA_ethiopia_exile_events.47.desc:0 "[FROM.GetAdjectiveCap]а відповідь далека від бажаної. [FROM.GetLeader] відмовляється зрушити з місця. [FROM.GetName] не припинить війну, поки не переможе, або не буде знищений."
 BBA_ethiopia_fascist_events.01.c:0 "Мабуть, $ETH_abba_jofir$ має більше шансів на успіх."
 BBA_ethiopia_fascist_events.05.t:0 "[FROM.GetName] приймає нашу пропозицію"
 BBA_ethiopia_fascist_events.50.a:0 "Ми мусимо стиснути зуби та прийняти втрату."
 BBA_ethiopia_fascist_events.54.b:0 "Ні, ми не хочемо посилення держави [FROM.GetName]."
 BBA_ethiopia_fascist_events.58.t:0 "[ITA.GetName] погоджується на аутсорсинг озброєнь"
 BBA_ethiopia_fascist_events.59.t:0 "[ITA.GetName] відмовляє у аутсорсингу озброєнь"
 BBA_ethiopia_fascist_events.61.a:0 "Це має зайняти [ITA.GetAdjective] надовго."
 BBA_ethiopia_fascist_events.63.a:0 "Яка короткозорість."
 BBA_ethiopia_fascist_events.67.a:0 "Вони випробовують нашу лояльність..."
 BBA_ethiopia_imperial_events.2.t:0 "[FROM.GetNameDefCap] погоджується на продаж Джібуті"
 BBA_ethiopia_imperial_events.4.a:0 "Дивне прохання, але чому б і ні?"
 BBA_ethiopia_industrial_financial_events.3.desc:0 "Despite our best efforts to explain the situation, [FROM.GetLeader] refuses to comply with our demands to take the integration of our economies to the next level. [FROM.GetLeader] claims that the independence of [FROM.GetName] must not be tarnished, and can never be part of any discussion whatsoever."
 BBA_ethiopia_is_expelled_tt:0 "Уряд держави §Y[ETH.GetNameWithFlag]§! вигнаний із держави §Y[ENG.GetNameWithFlag]§! і може створити свій уряд у вигнанні в іншому місці."
 BBA_italo_ethiopian_war_events.02.a:0 "Знищити загарбників!"
 BBA_italo_ethiopian_war_events.15.a:0 "Добре."
 BBA_italo_ethiopian_war_events.304.t:0 "Масове дезертирство"
 BBA_italy_anti_colonialism_events.04.a:0 "[FROM.GetLeader] про це пошкодує!"
 BBA_italy_anti_colonialism_events.06.desc:0 "[FROM.GetAdjective]ий уряд зрозумів, що інтеграція в ширшу [ROOT.GetAdjective]у адміністрацію буде корисною і посилить всіх нас."
 BBA_italy_anti_colonialism_events.09.desc:0 "[FROM.GetAdjective] жага до експансії, здається, не знає меж! Ми отримали делегацію від [FROM.GetName], яка пропонує нам підкорення. Вони стверджують, що мало що зміниться: ми все одно будемо керувати нашими землями так, як вважаємо за потрібне, але з додатковим захистом від держави [FROM.GetName] і періодичним підпорядкуванням."
 BBA_italy_anti_colonialism_events.100.t:0 "[FROM.GetAdjective]і урядовці звертаються до нас"
 BBA_italy_anti_colonialism_events.11.desc:0 "Хоча [FROM.GetAdjective]е керівництво не прийняло нашу пропозицію про захист і співпрацю, вони пішли нам назустріч і замінили свій уряд на більш схожий на наш і більш дружньо налаштований до нас."
 BBA_italy_anti_colonialism_events.61.desc:0 "Можливо, це не стало повною несподіванкою, але нам, на жаль, повідомили, що народ Південної Африки не бажає більше перебувати під нашим правлінням. Вони відчували себе знехтуваними та експлуатованими протягом тривалого часу і тому проголосували за вихід з-під нашого управління."
 BBA_italy_civil_war.7.desc:0 "Наші тиранічні [FROM.Adjective]і володарі відхилили наше чесне прохання про незалежність! Хоча вони й допомогли нам перемогти у громадянській війні, вони більше не мають права керувати нашою долею та втручатися в нашу політику. Коли прийде час, наш обов'язок — вигнати їх з наших земель і повернути собі нашу свободу!"
 BBA_italy_civil_war_communist_tt:0 "Ми станемо §Y$RDS_RU_Inst$§!, повсталою стороною у громадянській війні проти §Yкомуністичної§! ідеології. [GetRdsOverlord]"
 BBA_italy_democratic_events.03.desc:0 "Громадянська війна спричинила багато кровопролиття і горя та похитнула самі основи держави [FROM.GetName]. Хаос також залишив вакуум влади, який зараз заповнює відроджена мафія в регіоні [?ROOT.ITA_mafia_epicenter_state.GetName]. Придушення мафії було, мабуть, єдиною доброю справою, яку вдалося зробити фашистам."
 BBA_italy_interaction_events.14.t:0 "[ITA.GetName] вимагає повної демілітаризації Західної Анатолії"
 BBA_italy_interaction_events.21.t:0 "Італія звертається до нас з пропозицією"
 BBA_italy_interaction_events.27.desc_hosting_ethiopia:0 "Італія просить нас допомогти їй стримати експансіоністську силу Німеччини та хоче, щоб ми гарантували незалежність Австрії, щоб допомогти захистити її. Хоча раніше ми воювали пліч-о-пліч, зараз ми приймаємо ефіопський уряд у вигнанні, який був вигнаний італійцями. Якщо [ITA.GetNameDef] хоче нашої допомоги у майбутній війні, вони повинні спочатку погодитися на мир."
 BBA_italy_interaction_events.38.desc:0 "Оскільки влада Папства перевищує владу італійської монархії, багато палких прихильників католицької церкви сьогодні вийшли з вимогою до Папи Римського взяти на себе керівництво країною. Він вже прийняв роль, запропоновану народом, і заявив, що те, що відбувається сьогодні, дійсно є волею самого Бога. Монархія вже мало що може зробити, щоб зупинити його."
 BBA_italy_interaction_events.51.a:0 "Вони пошкодують про це!"
 BBA_italy_interaction_events.6.desc:0 "Принц Аймоне повернувся до нас і повідомив, що його зупинили та відмовили у в'їзді на хорватському кордоні, коли він їхав на коронацію в Загреб. Нам зрозуміло, що хорвати не мають що нам запропонувати, і що військова окупація є єдиним варіантом для них у майбутньому."
 BBA_italy_interaction_events.668.desc:0 "[FROM.GetLeader] настільки ж зарозумілий, наскільки й невіглас! Він відмовляється бачити сенс у передачі нам [454.GetName]. Виконання наших вимог принесло б безпеку і стабільність у регіон, але його дії призведуть лише до війни та страждань!"
 BBA_italy_interaction_events.668.t:0 "[FROM.GetName] відхиляє пропозицію Його Святості"
 BBA_italy_interaction_events.71.t:0 "Італійська пропозиція"
 BBA_italy_local_rulers.2.desc:0 "Під час завоювання Аддіс-Абеби ми звільнили колишнього короля Аббу Джофіра, який співпрацював з нами до початку війни. Тепер він прийшов до нас за підтримкою, щоб відновити частину своєї колишньої влади. Це може виявитися корисним для нас, оскільки він все ще має певний вплив, але відтоді, як його викрили у змові з нами, багато хто вважає його зрадником."
 BBA_italy_missiolinis.04_south.b:0 "$BBA_italy_missiolinis.02_north.b$"
 BBA_italy_missiolinis.121.a:0 "Порвімо кайдани."
 BBA_italy_missiolinis.202.t:0 "Недієздатний політичний кабінет"
 BBA_italy_missiolinis.211.a:0 "Це потрібно змінити."
 BBA_italy_naval_cooperation_programs.09.desc:0 "[FROM.GetName] погодилася придбати кілька наших старих і застарілих ескортних кораблів. Вони, мабуть, справді у відчаї, якщо погодилися на ці застарілі судна. Проте, продаж і виведення їх з експлуатації посилить можливості нашого флоту в цілому, зробивши його швидшим і маневренішим."
 BBA_italy_naval_cooperation_programs.11.t:0 "[ITA.GetNameDefCap] пропонує есмінці"
 BBA_italy_research_agreement.2.t:0 "[FROM.GetNameDefCap] відхиляє нашу військову пропозицію"
 BBA_swiss_expansion.16.a:0 "[SWI_only_independence_response]"
 BBA_swiss_expansion.18.a:0 "[ROOT.GetNameDefCap] повстає!"
 BBA_swiss_expansion.3.t:0 "[FROM.GetNameDefCap] вимагає [SWI_pressed_state]"
 BBA_switzerland.12.b:0 "Він повинен відбути повний термін"
 BECAME_EXILE_DESC:0 "Ми капітулювали.\n\nМи продовжимо воювати в якості §Hуряду у вигнанні§!, розміщені в державі $HOSTNAMEDEF|H$.\nПочаткова §Hлегітимність§! нашого уряду — $LEGITIMACY|0H$."
 BEG_neutrality:0 "Нація Бенішанґул-Ґумуз"
 BEL_GER_fascism_autonomy_puppet:0 "Райхспротекторат Бельгія"
 BEL_achille_van_acker:0 "Ахілле ван Акер"
 BEL_belgian_east_indies_desc:0 "У Нідерландів були значні колоніальні володіння за кордоном, зокрема в Індонезії. Наші імперські амбіції нікуди не зникли, і завжди є місце для додавання кількох коштовних перлин до нашої корони."
 BEL_belgian_legion_dynamic_modifier_desc:0 "Збірка консервативних і монархічних лоялістів готова і прагне підняти зброю на ім'я свого короля."
 BEL_belgian_miracle_desc:0 "Тяжко уявити, що два десятиліття тому Бельгія лежала в руїнах, вважаючись багатьма просто ще одним європейським полем битви. Порівняйте це з тим, чим ми є зараз, маяком продуктивності та інновацій. Це завдяки мужності наших солдатів, завзяттю наших працівників та відданості наших союзників і друзів."
 BEL_corruption_dynamic_modifier_desc:0 "Корупція розповсюджена в нашому уряді, з низкою скандалів, що охоплюють різноманітні злочини, включаючи хабарництво та розкрадання. Довіра до наших демократичних інститутів ніколи не була такою низькою."
 BEL_demand_further_gallic_concessions:0 "Вимагати подальших галльських поступок"
 BEL_democratization_of_education:0 "Демократизація освіти"
 BEL_democratization_of_education_ns_desc:0 "Наша суспільство має традицію піклуватися один про одного, найкраще це втілюється через соціальний контракт між нашими працівниками та корпораціями. Аналогічно, держава повинна прагнути забезпечити рівні можливості для всіх і підкреслити важливість хорошого освіти."
 BEL_economic_downturn_dynamic_modifier:0 "Економічний спад"
 BEL_european_crusade_no_focus_tt:0 "§YРексисити§! отримають бонуси до військовозобовязаного населення.\nЯкщо §YФНС§!"
 BEL_illusive_mastermind:0 "Майстер ілюзій"
 BEL_international_stipend:0 "Міжнародна стипендія"
 BEL_lambert_chardome_tt:0 "§YLамбер Шардом§! стає §YГенералом§!"
 BEL_leopold_prisoner_king:0 "Король-в'язень"
 BEL_liberal_victory:0 "Ліберальна перемога"
 BEL_support_the_rexists:0 "Підтримати Рексистів"
 BEL_the_council_of_europe_tt:0 "Відкриває рішення для §YЗапросити інші країни до $BEL_european_union$§!."
 BEL_the_european_crusade_tt:0 "§YЄвропейський хрестовий похід§! ефекти залежать від того, чи прийшли до влади §YРексисити§! або §YФНС§!"
 BEL_the_kings_surrender_ns:0 "Капітуляція короля"
 BEL_the_price_to_pay_desc:0 "Король уже деякий час веде переговори з нашими окупантами, і його характер дозволив йому здобути їхню довіру. Тому існує ймовірність, що ми можемо повернути втрачені землі Бельгії. Ціна, яку вони вимагають, проста. Стань на коліна."
 BEL_the_walloon_legion:0 "Валлонський легіон"
 BEL_traditional_family_values_desc:0 "Католицька Церква завжди добре вела нас у питаннях належної сімейної етики, і саме цим вченням ми повинні продовжувати дотримуватися. Це єдиний спосіб забезпечити стабільність і зростання, необхідні для подальшого розвитку та процвітання."
 BHR_neutrality_party:0 "Аль-Халіфа"
 BHU_jigme_dorji_wangchuck:0 "Джіґме Дорджі Ванґчук"
 BIA_communism_DEF:0 "Біафринська народна республіка"
 BLC_DEF:0 "Белуджістан"
 BLI_neutrality_ADJ:0 "Балійськ"
 BLI_neutrality_DEF:0 "Королівство Балі"
 BLR_GER_fascism_autonomy_colony_DEF:0 "Райхсланд Остланд"
 BLR_GER_fascism_autonomy_dominion_DEF:0 "Біла Русь"
 BLR_GER_fascism_autonomy_reichskommissariat_DEF:0 "Райхскомісаріат Остланд"
 BLR_aleksei_antonov:0 "Олексій Антонов"
 BM_MULTIPLE_DESC:0 "Дивізія надто розтягнута, щоб ефективно боротися."
 BOL_empresa_nacional_ferrocarriles_del_estado:0 "Empresa Nacional Ferrocarriles del Estado"
 BOL_indigenous_council:0 "Болівійська тубільна рада"
 BOL_neutrality_DEF:0 "Болівія"
 BOS_without_HRZ_fascism_DEF:0 "Боснійська держава"
 BRA_anti_authoritarian:0 "Антиавторитарист"
 BRA_anti_democracy_in_south_america_tt:0 "Отримає ціль війни §Y$puppet_wargoal_focus$§! проти всіх §Yдемократичних і нейтральних§! держав §YПівденної Америки§!."
 BRA_anti_imperialism_tt:0 "Відмикає рішення §YПівденноамериканський антиколоніалізм§! для звільнення колоній у Південній Америці."
 BRA_autarky_desc:0 "Економічні негаразди після краху на Уолл-стріт прокотилися по всьому світі та зруйнували нашу економіку. Від споживання кави до виробництва сталі, ми мусимо стати самодостатніми в усьому та захистити себе від усякої майбутньої зовнішньої кризи."
 BRA_disrupt_bolivar_LaR_desc:0 "Надто довго іноземні спецслужби діяли тут безкарно. З нашим новим фінансуванням ми гарантуємо, що на нашій території нічого не станеться без нашого попереднього відома."
 BRA_electronics_bonus:0 "Бонус до електроніки"
 BRA_empire_of_brazil_and_portugal_neutrality_ADJ:0 "Бразильськ"
 BRA_empire_of_brazil_neutrality:0 "Бразильська імперія"
 BRA_estado_moderno:0 "Estado Moderno"
 BRA_estado_moderno_desc:0 "Наші внутрішні вороги розсіяні й переможені, тож настав час стерти стару політичну систему та проголосити сучасну державу, здатну забезпечити довгостроковий мир і стабільність для [BRA.GetAdjective]ого народу."
 BRA_good_neighbor_policy_desc:0 "$BRA_cooperation_in_the_americas_desc$"
 BRA_industrial_decisions_desc:0 "Наша економіка була зруйнована крахом на Ўолл-стріт і подальшою депресією. Задля добробуту та безпеки нашого народу ми мусимо відновити економіку та диверсифікувати її."
 BRA_military_party_long:0 "Військовий уряд"
 BRA_monarch_choice_1_tt:0 "§YПедру джі Алкантара§! стане лідером Імператорського дому.\n§RЯкщо [ROOT.GetNonIdeologyName] завершить фокус $BRA_constitutional_monarchy$, буде додано наступний національний дух:§!"
 BRA_potenji_river_conference_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap] приєднається до тієї ж фракції, що й [USA.GetFlag][USA.GetNameDef]§! §R\nЦе також призведе до оголошення нами війни будь-яким поточним ворогам [USA.Getflag][USA.GetAdjective]!§!"
 BRA_promote_immigration_to_brazil_tt:0 "Відмикає сукупність рішень §Y$JUNO_promote_immigration_cat$§! для покращення штатів."
 BRA_psad_idea:0 "Departamento Administrativo do Serviço Público"
 BRA_psad_idea_desc:0 "DASP було створено для того, щоби допомогти уряду підтримувати добре функціонуючий режим та економіку шляхом консолідації та реорганізації різних відомств-попередників в одне, цілісне, сучасне відомство."
 BRA_radicalize_the_proletariat:0 "Радикалізувати пролетаріат"
 BRA_renowned_ambassador:0 "Видатний посол"
 BRA_rio_conference:0 "Протокол Ріо"
 BRA_ship_armor_bb_1:0 "229-мм пояс/51-мм палуба"
 BRA_support_the_landowners:0 "Підтримати цукрових баронів"
 BRA_unify_south_america_desc:0 "Південна Америка потрапила під наше панування завдяки силі та мужності нашого народу. Тепер ми повинні розпочати важке завдання об'єднання континенту під нашим правлінням та культурою."
 BRD_neutrality:0 "Королівство Бурунді"
 BREAKTHROUGH_POINTS_TRIGGER_NOT_ENOUGH_POINTS:0 "§RНе має принаймні $AMOUNT$ балів прориву в: $SPECIALIZATION$§!"
 BRM_fascism:0 "Бірманська держава"
 BRM_sp_rockets_ground_to_air_missile:0 "Проєкт «GYD-1B»"
 BROWSER_BACK:0 "Назад"
 BUILDING_SLOT_REMOVE_CONVERSION_LEVEL:0 "Скасувати конверсію споруди."
 BUK_democratic_party:0 "МБ"
 BUL_CAS_equipment_2:0 "ДАР-10"
 BUL_a_royal_visit_desc:0 "Щоб підвищити свою популярність серед населення, цар Боріс відвідає з візитом [GetDestinationName]. У ході візиту цар активно спілкуватиметься з підданими; ми ж простежимо, щоб якомога більше фотографій було зроблено та надіслано пресі."
 BUL_balkan_confederation_industrial_investment_desc:0 "Ми зможемо вплинути на [FROM.GetAdjective]ий уряд, якщо переконаємо [BUL.GetAdjective]их промислових магнатів вкласти гроші у відкриття [BUL.GetAdjective]их філій у державі [FROM.GetName], наш контроль над нею."
 BUL_balkan_federation_economic_aid_desc:0 "Наразі ми підтримуємо [FROM.GetAdjective]ий уряд грошима, щоб держава [FROM.GetNameDef] могла запобігти занепаду промисловості перш ніж приєднатися до альянсу [ROOT.GetFactionName]."
 BUL_bulgarian_academy_of_sciences_desc:0 "Болгарська академія наук стане центром дослідження та інновації, де працюватимуть найвидатніші уми Балкан."
 BUL_communism_party_bulgarian_long:0 "$BUL_communism_party_long$"
 BUL_cooperation_bs_legalize_faction:0 "Легалізувати організацію [GetBsName]"
 BUL_cooperation_zveno_social_renovation_directory:0 "Заснувати директорат громадського оновлення за програмою $BUL_zveno_name_gen$"
 BUL_democratic_principles_desc:0 "Хоча наша головна мета — покінчити з авторитарним режимом царя, ми не можемо допустити, щоби замість нього встановився тоталітарний комуністичний уряд. Ми мусимо залишатися вірними демократичним ідеалам і прагнути посилити вплив міністрів-однодумців в уряді."
 BUL_dobri_bozhilov:0 "Добрій Божілов"
 BUL_draw_up_a_plan_for_regicide:0 "Розробити план царевбивства"
 BUL_fight_alongside_country_comrades_join_cw_tt:0 "§Y[ROOT.GetNameWithFlag]§! приєднається до громадянської війни на стороні держави §Y[FROM.GetNameWithFlag]§!."
 BUL_foreign_agreements_desc:0 "Ми мусимо зосередитись на укладенні вигідних угод з провідними іноземними компаніями, які бажають заснувати у Болгарії свої філії або інвестувати у розвиток нашої промисловості."
 BUL_former_leader_before_ferdinand_tsankov:0 "прем'єр-міністром Александиром Цанковим"
 BUL_free_balkan_states:0 "Вільні балканські держави"
 BUL_freedom_of_press_ban_faction_media_tt:0 "\n§RНе дозволить уряду забороняти ЗМІ будь-якої фракції наступні §Y365 днів§!.§!"
