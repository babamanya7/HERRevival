 italy.16.d:0 "Німеччина вважала за потрібне втрутитися в нашу суперечку з Вішівською Францією. Вони заблокували нашу спробу завоювати Корсику, але в нас усе ще є Савоя."
 japan.16.a:0 "Ми не можемо боротися."
 japan.18.t:0 "Китай відмовляється"
 japan.9.t:0 "Німеччина відхиляє наш запит"
 japan_border_conflict.5.desc:0 "Біля озера Хасан продовжуються зіткнення між японськими та [SOV.GetAdjective]ими військами. Намагаючись вийти з патової ситуації, японські війська перейшли в наступ і зіткнулися з [SOV.GetAdjective]ими військовими в інших районах цього сектора. Розвідка припускає, що вони незабаром спробують посилити атаку свіжими силами, перекинутими з інших регіонів їхньої імперії."
 japan_militarism_ideology_desc:0 "Мілітаризм — це ідеологія, в якій лідер нації має лише номінальний контроль і діє радше як маріонетка в національних збройних силах, ніж як незалежний політик, постійно просуваючи свій порядок денний з кінцевою метою швидкої експансіоністської політики."
