 MAN_tsr_embrace_state_shintoism_desc:0 "Державний шінтоїзм добре послужив Японській імперії, зумівши мобілізувати мільйони на цю справу. Ми повинні прагнути наслідувати його на наших власних територіях, навіть якщо спочатку це може зустріти опір."
