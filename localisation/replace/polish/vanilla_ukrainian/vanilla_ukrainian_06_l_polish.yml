 FIN_otto_brusiin:0 "Отто Брусіін"
 FIN_pact_for_continuation_war_fin_focus_tt:0 "\nЕфекти, коли [GER.GetFlag]§Y[GER.GetNameDef]§! оголошує війну [SOV.GetFlag]§Y[SOV.GetNameDef]§!:\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! приєднається до війни проти [SOV.GetFlag]§Y[SOV.GetNameDef]§!."
 FIN_ragnar_hakola:0 "Раґнар Гакола"
 FIN_reelection_other_leader:0 "лідера [ROOT.GetLeader]"
 FIN_reino_hallamaa:0 "Рейно Галламаа"
 FIN_sami_pathfinders_desc:0 "Будучи чудовими відстежувачами та знавцями дикої природи, саами здатні з легкістю рухатися пересіченою місцевістю півночі Фінляндії та надавати життєво необхідні розвіддані фінським військам.\nБудь то посеред битви чи в тихих глибинах лісу, саами-слідопити тепер стали ключовим елементом фінської армії та незмінним символом гідної спадщини країни."
 FIN_socialist_wellfare:0 "Соціалістичний добробут"
 FIN_state_is_in_the_atlantic_tt:0 "Будь-яка повністю контрольована область знаходиться на узбережжі Атлантичного океану."
 FIN_strengthen_military_administration:0 "Посилити військову адміністрацію"
 FIN_subsidized_national_industrialization_desc:0 "[SOU.GetNameDef] досяг значних успіхів у масовій мобілізації продуктивних сил нації шляхом індустріалізації. Можливо, нам варто попросити допомоги у їхніх експертів у розгортанні подібної програми у Фінляндії."
 FIN_support_for_east_karealian_independence_big:0 "Підтримка війни в Східній Карелії"
 FIN_taavetti_laatikainen:0 "Тааветті Лаатікайнен"
 FIN_tactical_wargaming_department_every_army_leader_tt:0 "§Y$EFFECT_EVERY_ARMY_LEADER_STARTS$§! (включно з відімкненими):\n Додайте навичку планування: §G1§!"
 FIN_the_finnish_throne_desc:0 "Національна коаліція давно виступає за монархію у Фінляндії. Завдяки нещодавньому зростанню підтримки та міцнішому контролю над владою, вони тепер мають засоби розпустити поточну систему та створити на її місці королівство."
 FIN_the_lone_wolf:0 "Самотній вовк"
 FIN_the_workers_state_desc:0 "Тепер, коли диктатура пролетаріату міцно встановлена, ми можемо розпочати відтворення нації таким чином, щоб інтереси пролетаріату твердо поставили на перший план політики. Все, починаючи від того, як ми навчаємо наших дітей, і закінчуючи тим, як ми щоб наші заводи були повністю реконструйовані."
 FIN_united_under_the_north_star_desc:0 "Наші скандинавські друзі та товариші залежать від імперіалістичних держав, які не дбають про інтереси нашого регіону. Але разом ми можемо забезпечити мир для нашого народу шляхом створення альянсу, який повинен стримувати навіть наймогутнішу з імперій."
 FIN_valtionrautatiet:0 "Valtionrautatiet"
 FIN_we_are_the_white_death_idea_desc:0 "Наш знаменитий снайпер, Сімо Гяюгя, підвищив моральний дух наших збройних сил своїми відважними подвигами на полі бою. Солдати тепер згуртовуються навколо збірного імені «білої смерті». Це страхітливе ім'я втілює в собі непохитну відданість знищити всіх нерозсудливих суперників, які насміляться вторгнутися в нашу державу."
