 DEN_dominium_maris_baltici_desc:0 "[ROOT.GetNameDefCap] колись була наймогутнішою державою навколо Балтійського моря. Ми боролися проти балтів, поляків, росіян і, перш за все, шведів за панування над морем. Тепер ми готові раз і назавжди поставити весь регіон під свій контроль."
 DEN_fortification_category_desc:0 "Щоб забезпечити майбутнє [ROOT.GetNameDef], ми повинні підготуватися до найгіршого та зміцнити нашу оборону. Тільки грізна та неприступна стіна фортів може захистити нас."
 DEN_fortify_our_borders_desc:0 "Напруга в Європі знову зростає. Хоча ми пройшли крізь Велику війну неушкодженими, немає жодних гарантій, що це станеться знову. Ми повинні готуватися до найгіршого, сподіваючись на краще. Захист наших кордонів і нашої незалежності є нашим першочерговим завданням!"
 DEN_fortify_the_islands:0 "Укріплення островів"
 DEN_greater_denmark_communism:0 "Північноґерманська народна республіка"
 DEN_haeren_dynamic_modifier_desc:0 "У минулі часи Данія панувала над Скандинавією та була провідною силою регіону. Наші армії марширували регіоном Балтійського моря без опору. Армія — лише тінь колишньої сили, але ми можемо знову відновити її міць для захисту наших кордонів і народу."
