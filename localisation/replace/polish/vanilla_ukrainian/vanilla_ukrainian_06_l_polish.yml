 SEA_PHI_political_events.15.a:0 "Принаймні, це не збройна відповідь"
 SEA_PHI_political_events.17.a:0 "Призначити Евангелісту, нам потрібне радикальне керівництво"
 SEA_PHI_political_events.17.b:0 "Призначити Сантоса, для більш інтелектуального підходу"
 SEA_PHI_political_events.40.desc:0 "Мануеля Кесона було вбито сьогодні о 15:00 під час виступу перед прихильниками в парку Лунета. Стрілець все ще на волі, але підозрюють зв'язки з рухом сакдалістів. Тим часом Національні збори було закрито з міркувань національної безпеки. У Манілі з'явилися значні сили констебулярії, а вулиці було очищено. Гнітюча тиша опустилася на країну, колективне очікування того, що може статися далі, затамувавши подих."
 SEA_PHI_political_events.41.desc:0 "Артеміо Рікарте, повернувшись із вигнання з групою послідовників, озброєних різноманітною японською зброєю, заявив, що знайшов і затримав вбивцю Мануеля Кесона. Тепер він обіцяє співпрацювати з констебулярією, щоб зберегти порядок під час кризи, спричиненої вбивством президента. Через підозри щодо руху сакдалістів, він пообіцяв співпрацювати з партією Ганап, щоб отримати легітимність і тим самим якнайшвидше прискорити отримання незалежності від Сполучених Штатів. У відповідь констебулярія відійшла з Маніли, нібито щоб не загострювати напругу, тим часом американський гарнізон було приведено у стан підвищеної бойової готовності, хоча він поки що не вдався до жодних дій."
 SEA_PHI_political_events.41.t:0 "Вигнанці-сакдалісти повертаються"
 SEA_PHI_political_events.51.desc:0 "Військова ситуація в [USA.GetNameDef] виявилася настільки загрозливою, що надійшов запит на негайне повернення $USA_douglas_macarthur$ додому."
 SEA_PHI_political_events.55.b:0 "Тепер ми можемо співпрацювати як рівні"
 SEA_PHI_political_events.56.b:0 "Нехай забирають місцеве оперативне з'єднання"
 SEA_PHI_political_events.61.desc:0 "Після ретельного розслідування рада, відповідальна за перевірку результатів виборів 1935 року, заявила, що знайшла докази порушень. Саме по собі це не було б дуже вартим уваги, якби не подальші дії судової влади, яка дискваліфікувала [ROOT.GetDemocraticParty], що призвело до перемоги [ROOT.GetNeutralParty]. [USA.GetAdjective]і спроби швидко припинити процес ефектно провалилися, оскільки були сприйняті як додатковий доказ корупції."
 SEA_PHI_political_events.65.desc:0 "На жаль, наш запит на посилення [USA.GetAdjective]ої військової місії в [ROOT.GetNameDef] було відхилено. Інші військові плани [USA.GetNameDef], очевидно, потребують його досвіду."
 SEA_PHI_political_events.68.desc:0 "Ідеологічні розбіжності або, можливо, побоювання зіпсувати відносини з [USA.GetNameDef] призвели до того, що [FROM.GetNameDef] не підписав запропонований нами договір про взаємодопомогу. Схоже, ми повинні шукати союзників в іншому місці."
 SEA_PRC_faction_events.4.t:0 "[FROM.GetNameDefCap] поступився нашим вимогам"
 SEA_PRC_fourth_army_incident.1.b:0 "Їхні сумніви цілком природні"
 SEA_PRC_fourth_army_incident.12.t:0 "[FROM.GetName] приймає вибачення"
 SEA_PRC_fourth_army_incident.4.t:0 "[FROM.GetNameDefCap] робить догану командуванню"
 SEA_PRC_misc_events.12.a:0 "Гірка пігулка"
 SEA_PRC_misc_events.15.desc:0 "Наша делегація до [FROM.GetNameDef] повернулася з чудовими новинами! Наше прохання до [FROM.GetLeader] передати наші законні монґольські території було задоволено. [ROOT.GetLeader] розсипався в похвалах як [FROM.GetLeader], так і нашим дипломатам за досягнення цього результату."
 SEA_PRC_misc_events.18.b:0 "Передати область [729.GetName]"
 SEA_PRC_misc_events.19.a:0 "[FROM.GetNameDefCap] передає область [326.GetName]"
 SEA_PRC_misc_events.6.a:0 "Нагода показати світові наше справжнє обличчя"
 SEA_PRC_political_events.1.desc1:0 "Оскільки 28 ½ більшовиків перемагають у боротьбі за владу, настав час обрати представника, який очолить націю. Незважаючи на його вигнання в [SOV.GetNameDef], настав час для $PRC_wang_ming$ повернутися до керівництва — якщо $PRC_bo_gu$ не отримає схвалення."
 SEA_PRC_political_events.24.t:0 "[FROM.GetName] хоче, щоб ми перепризначили $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.4.desc:0 "Незважаючи на всі зусилля наших дипломатів, [FROM.GetNameDef] відмовився взяти на себе зобов'язання захищати [ROOT.GetNameDef]. Ми можемо лише сподіватися, що такі обіцянки захисту все одно ніколи б не знадобилися."
 SEA_PRC_political_events.41.a:0 "Непростий союз"
 SEA_PRC_political_events.5.desc:0 "[FROM.GetNameDefCap] зробив ще один крок у прагненні розширити співпрацю з нами, попросивши приєднатися до [ROOT.GetFactionName]. Ми повинні вирішити, чи вважаємо ми це корисним розширенням [ROOT.GetFactionName] на Китай, чи такий союз скоріше стане потенційним тягарем."
 SEA_PRC_request_aid.1.a:0 "Надіслати те, чим можемо поділитися"
 SEA_PRC_zhang_guotao_events.4.t:0 "$PRC_zhang_guotao$ залишає Комуністичну партію"
 SEA_border_incidents_events.2.desc:0 "Армія чисельністю менше 100 [MON.GetAdjective]их солдатів окупувала спірне [MAN.GetAdjective]е село Тауран під керівництвом радянських військових радників. Схоже, вони не відступлять без бою, і їх доведеться перемогти, якщо ми хочемо зберегти повний контроль над [761.GetName]."
 SEA_border_incidents_events.5.t:0 "[JAP.GetAdjective]а перемога біля озера Буїр"
 SEA_china.19.desc:0 "Офіційний лист від [CHI.GetNameDef] надійшов сьогодні до нашого міністерства закордонних справ. У ньому стверджується, що Договір дев'яти держав сковує суверенітет [CHI.GetAdjective]ої держави і має бути негайно розірваний. [CHI.GetLeader] наполягає на тому, що пакт є пережитком примусу, і клянеться повернути повну незалежність, з нашою згодою чи без неї."
 SEA_china.24.a:0 "Перемога національного суверенітету"
 SEA_china_democratic.10.b:0 "Це суперечило б нашим принципам нейтралітету..."
 SEA_china_democratic.13.a:0 "Ми підтримаємо їх"
 SEA_china_democratic.2.b:0 "Це суперечило б нашим принципам нейтралітету..."
 SEA_china_democratic.4.desc:0 "[FROM.GetLeader] грубо вирішив відхилити нашу пропозицію союзу між нашими країнами, заявивши, що це суперечить їхньому принципу нейтралітету. Ми можемо лише уявити масштаби корупції, що призвели до цього помилкового рішення."
 SEA_imperial_influence_demand_event_option_1:0 "Ми випробуємо нашу рішучість"
 SEA_imperial_influence_events.1.d:0 "Відкинути фракцію Цивільного уряду"
 SEA_imperial_influence_events.140.desc:0 "Армія висунула свої вимоги. Вони бажають, щоб ми збільшили кількість полків у нашій армії та створили більше дивізій для допомоги в майбутніх завоюваннях. Незважаючи на привід простого зміцнення наших збройних сил, вони, очевидно, також хочуть посилити свій контроль і вплив на [GetImperialInfluenceRulerTitle]. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.161.t:0 "Фракція Армії вимагає збільшення виробництва артилерії"
 SEA_japan_foreign_policy.101.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] добре відреагував на нашу пропозицію щодо створення спільної валюти між нашими країнами і підписав необхідні документи, щоб це набуло чинності негайно. Вони поділяють наше бачення світлого майбутнього для всієї Азії!"
 SEA_japan_foreign_policy.103.b:0 "Ми не відмовимося від нашої економічної незалежності!"
 SEA_japan_foreign_policy.106.b:0 "Перемога або смерть!"
 SEA_japan_foreign_policy.120.a:0 "Це їхня втрата"
 SEA_japan_foreign_policy.134.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef], на жаль, відхилив наші вимоги про підкорення, заявивши, що воля народу — це незалежна держава, а не революційна держава в [ROOT.GetAdjective]ій сфері. Вони зробили неправильний вибір..."
 SEA_japan_foreign_policy.139.desc:0 "The shallow [FROM.GetLeader] has refused to see reason, and has rejected our proposal to merge them into the [MAN.GetAdjective] government. Perhaps a better deal, and maybe even a proper dosage of intimidation is in order."
 SEA_japan_foreign_policy.139.t:0 "[FROM.GetNameDefCap] Rejects the Merger"
 SEA_japan_foreign_policy.141.desc:0 "[JAP.GetLeader] has thoroughly rejected our request to merge other Chinese puppet governments with ours. It seems it was too early for such a move to be readily accepted by the government."
 SEA_japan_foreign_policy.18.b:0 "Це суперечило б нашим принципам нейтралітету..."
 SEA_japan_foreign_policy.22.b:0 "Необхідно посилити нашу національну безпеку!"
 SEA_japan_foreign_policy.25.desc:0 "Партія покращення Тибету — політична партія, сформована у вигнанні в Британській Індії, лояльна до Тубтена Кунпхели, — останнім часом отримує пакунки зі зброєю від невідомих відправників. Схоже, вони можуть готуватися до державного перевороту з позиції, недосяжної для нас."
 SEA_japan_foreign_policy.27.desc:0 "Нарешті настав день, коли ми можемо розпочати нашу кампанію і заявити права на землі Зовнішньої Монґолії, якою зараз править нелегітимний боягуз [MON.GetLeader]. Настав час показати світу, що дух Чингісхана живий!"
 SEA_japan_foreign_policy.40.t:0 "Питання східноазійського співпроцвітання"
 SEA_japan_foreign_policy.52.t:0 "[FROM.GetNameDefCap] відхиляє повну інтеграцію"
 SEA_japan_foreign_policy.57.desc:0 "Сьогодні [FROM.GetAdjective]ий уряд висунув нам ультиматум. Вони вимагають, щоб ми підкорилися їм, якщо ми не хочемо, щоб нашу націю було знищено. Однак ми знаємо, що вони для нас приготували, і, можливо, в наших інтересах чинити їм опір?"
 SEA_japan_foreign_policy.63.a:0 "[ROOT.GetLeader] отримає гарну посаду, тому ми погоджуємося"
 SEA_japan_foreign_policy.89.a:0 "Чому б і ні?"
 SEA_japan_foreign_policy.9.desc:0 "Останній шанс, який ми люб'язно запропонували [FROM.GetLeader], був відхилений, і наші війська тепер готові швидко окупувати їхні великі міста. Настав час показати їм, з чого зроблена [ROOT.GetAdjective]а нація!"
 SEA_japan_foreign_policy.92.c:0 "Ми повинні укласти з ними належну оборонну угоду"
 SEA_japan_foreign_policy.97.a:0 "Ми не бачимо в цьому проблеми"
 SEA_japan_popup_events.12.t:0 "Імператора знайдено мертвим у його резиденції"
 SEA_japan_popup_events.36.a:0 "Дозволити їм продовжувати"
 SEA_japan_popup_events.44.desc:0 "Будучи головнокомандувачем Монґольської народної армії та одним із великих монґольських революціонерів 1921 року, Хорлогійн Чойбалсан є сильним кандидатом на те, щоб привести нашу країну до величі. Завдяки своїм нещодавнім військовим подвигам він довів, що достатньо компетентний, щоб справді керувати нацією як її єдиний лідер. Чи настав час для нього взяти на себе мантію 10-го Голови Ради Міністрів?"
 SEA_japan_popup_events.49.t:0 "[ROOT.GetLeader] знайдено мертвим!"
 SEA_warlords.15.b:0 "$wtt_political_warlord_support.11.b$"
 SEA_warlords.20.a:0 "$wtt_political_warlord_support.23.a$"
 SEA_warlords.29.t:0 "[FROM.GetLeader] пропонує мир"
 SEA_warlords.36.tt:0 "§RЯкщо Ґуансі відхилить нашу пропозицію, у нас миттєво розпочнеться громадянська війна!§!"
 SEA_warlords.44.b:0 "Ми не будемо співпрацювати з Королем Півдня!"
 SEA_warlords.45.a:0 "Ми переможемо!"
 SEA_warlords.62.t:0 "Розпуск Північно-Західного штабу придушення бандитизму"
 SEA_warlords.64.desc:0 "$KHM_ma_hushan$, зганьблений командир 36-ї дивізії Ґоміньдану та Падишах [KHM.GetNameDef], прибув до [441.GetName] після дезертирства від своїх військ, привізши із собою 1000 унцій золота, які він та його люди вкрали зі столиці колишньої держави. Це пахне можливістю..."
 SEA_warlords.70.t:0 "The Legacy of the Pingnan Guo"
 SEA_warlords.71.desc:0 "[FROM.GetLeader] has requested our aid in the fight against [SIK.GetLeader]. While losing them would mean we lose our family's footing in the province, it is also vital that we don't let the communists to our east seize the opportunity when our troops are off fighting elsewhere."
 SEA_warlords.8.a:0 "З цим ми зможемо переломити хід подій!"
 SEA_warlords.9.a:0 "Ці кляті зрадники"
 SEND_EXP_TARGET_AT_WAR:0 "Щоб надіслати їм експедиційні війська, @$TAG$$WHO|H$ мусить бути у стані війни."
 SERVER_BOOKMARK:0 "Закладка: $BOOKMARK$"
 SETTINGS_ACCESSIBILITY_STT_SHORTCUT_INPUT_INFO:0 "Налаштуйте швидку кнопку для ввімк./вимк. §Hspeech-to-text§!"
 SETTINGS_ACCESSIBILITY_TTS_VALUE_INFO:0 "Увімк./вимк. §Htext-to-speech§!"
 SETTINGS_ACCESSIBILITY_USE_STT_SHORTCUT_INFO:0 "Натисніть кнопку для увімк./вимк. speech-to-text"
 SET_SHIP_PRIDE_OF_FLEET:0 "§HПризначити§! $NAME|H$ як §Hгордість ВМС§!"
 SET_SHIP_PRIDE_OF_FLEET_DESC_2_WITHOUT_EXISTING:0 "У Вас може бути лише одна §Hгордість ВМС§! за раз і коли корабель буде призначений, перепризначення або заміна коштуватимуть $COST|R$ £pol_power£."
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_5:0 "Завжди вступати в бій"
 SHIP_ENGAGEMENT_BUTTON_GENERAL_DESC:0 "\n--------------\n§GНе вступати в бій§! працюватиме тільки якщо:\n - В оперативної групи немає наказів\n - Оперативна група патрулює регіон\n§GНе вступати в бій§! буде автоматично ввімкнено, якщо оперативна група була переможена та повертається на морську базу для ремонту."
 SHIP_REFIT_CANCEL_TOOLTIP:0 "§RСкасувати§! переобладнання."
