 TUR_realize_the_nightmare_of_meiji:0 "Реалізувати кошмар Мейджі"
 TUR_refet_bele:0 "Рефет Беле"
 TUR_reinvigorate_turkish_nationalism_desc:0 "Єдиний спосіб об'єднати країну — наслідувати Муссоліні. Нам потрібен сильний лідер правого спрямування, який не проти лівих економічних реформ і може волати до серця людей. Є лише один такий кандидат — поважний маршал Февзі Чакмак."
 TUR_renew_the_turkish_soviet_non_aggression_pact_desc:0 "У 1925 році ми і [SOV.GetNameDef] уклали пакт про ненапад і одними з перших у світі встановили дружні стосунки з [SOV.GetAdjective]им народом, але настали інші часи. Пакт необхідно оновити та переконатися, що поточний вірний колишнім угодам."
 TUR_repeal_the_wealth_tax:0 "Скасувати податок на багатство"
 TUR_revolutionary_brigades_from_abroad_desc:0 "Марксизм є принципово інтернаціоналістичним віровченням, і тому цілком природно, що революціонери з усього світу збираються до нашої нації, щоби боротися в нашій спільній глобальній боротьбі."
 TUR_rising_islamist_dissidence_desc:0 "Щоразу, коли саме поняття вільних виборів піднімалося в державі [TUR.GetNameDef], релігійні фундаменталісти намагалися захопити будь-яку платформу для опозиції РНП. Виявляється, цього разу не буде інакше. По всій країні зростає фундаменталістська свідомість, оскільки наші ідеологічні вороги об'єднуються, щоби повалити наше панування над країною, профануючи урну, яку ми їм надаємо."
 TUR_root_out_kemalists_in_state_desc:0 "Ми мусимо вселити страх у серця безбожників-кемалістів, що продовжують отруювати нашу країну."
 TUR_the_redshirts_desc:0 "Червоносорочники — це наша власна воєнізована фашистська міліція, яка патрулює вулиці наших міських районів і гарантує, що люди суворо дотримуються принципів кемалізму. Іноді вони можуть бути трохи жорстокими, із залізними серцями та головами, наповненими революційним ідеалізмом, але принаймні їхня справа справедлива!"
 TUR_turkish_bolshevism_desc:0 "Кемалізм виконав свою мету і тепер буде перенесено до підручників історії... ну, в усякому разі, деякі незаконні підручники з історії. [TUR.GetAdjectiveCap]а держава тепер змодельована за зразком революції Володимира Леніна, а не ревізіоніста-реакціонера Мустафи Кемаля Ататюрка та його придушеного руху."
