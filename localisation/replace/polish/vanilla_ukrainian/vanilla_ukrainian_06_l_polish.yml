 MEX_cristero_democratic_ADJ:0 "Мексиканськ"
 MEX_focus_arrest_general_cedillo_desc:0 "Каудільйо — це загроза. Вони ділять Мексику на дрібні володіння, де призначення посадових осіб дає їм владу над економікою, військовими та урядом. Вони грабують багатство Мексики, і ніде це не так, як у провінції генерала Сатурніно Седільйо. Його незалежність від центрального уряду є абсолютно нестерпною, і повстанці, яких він збирає, не принесуть йому користі."
 MEX_focus_legacy_of_revolution_desc:0 "Завоювання Революції треба захистити, а національних зрадників викорінити. Генерали — в авангарді цієї боротьби. Вони бачать труднощі, з якими щодня стикається уряд на місцях. Ми повинні надати їм більше свободи дій у забезпеченні правління держави."
 MEX_focus_military_budget_review_desc:0 "Добре фінансована армія режиму Діаса розвалилася, коли революційні ополченці почали звільняти міста та припиняти їх фінансування. Перегляньмо фінанси армії, щоби забезпечити її довголіття під час війни."
 MEX_focus_propaganda_pact_desc:0 "Загроза комунізму стає все більшою в умах вірних латиноамериканських патріотів. З нашими новознайденими союзниками ми поставимо стіну багнетів підступній більшовицькій загрозі. Продемонструймо нашу єдність і братерство перед мексиканським народом, щоби запевнити його в повній перемозі над ненависним ворогом!"
 MEX_focus_reform_the_cristero_guard:0 "Реформувати Гвардію крістерос"
 MEX_focus_rent_freeze:0 "Заморозка оренд"
 MEX_focus_soldaderas:0 "Soldaderas"
 MEX_focus_spanish_civil_war_refugees_desc:0 "Пожежа, що охопила Іспанію, витісняє десятки тисяч громадян Іспанії. Багато з них є верхівкою іспанської інтелігенції або висококваліфікованим технічним персоналом. Надавши їм притулок, ми виконаємо наші гуманітарні обов'язки та водночас принесемо користь Мексиці."
