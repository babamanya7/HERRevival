 PER_aid_communists_cw_desc:0 "Тепер, коли ми позбулися кайданів імперіалізму, ми повинні бути готові надавати допомогу іншим народам світу, які все ще страждають під колоніальним ярмом."
 PER_anti_gulf_decisions_cat:0 "Захист наших інтересів"
 PER_comintern_research_collaboration_desc:0 "[SOU.GetNameDefCap] є одним із світових лідерів у науці та дослідженнях. Забезпечивши альянс із ними, ми тепер маємо цікаву можливість відправити наших вчених навчатися у кращих [SOU.GetAdjective] науковців та повернути [SOU.GetAdjective] знання та навички додому."
 PER_communist_events.20.t:0 "Курдський народ вимагає автономії"
 PER_communist_events.5.desc:0 "Здається, що більша частина останніх заворушень у Перській затоці та прилеглих районах, ймовірно, має своє джерело в [FROM.GetNameDef]. З низкою стратегічних перемог у регіоні, схоже, вони тепер почуваються достатньо сміливими, щоб зробити свій найбільший крок. У суворому попередженні нашому уряду [FROM.GetAdjective] режим вимагає нашого повного виведення з Аравійського півострова та Перської затоки, навіть заходячи так далеко, що вказує на свою готовність блокувати Затоку, якщо ми не виконаємо вимоги."
 PER_communist_faction:0 "Альянс затоки"
 PER_communist_gulf_hegemony_desc:0 "Ми досягли того, що здавалося неможливим — вигнання імперських держав з Перської затоки. Тепер ми є фактичною великою державою регіону і можемо почати утверджувати свій вплив без зовнішнього втручання."
 PER_construct_naval_bases:0 "Побудувати нові військово-морські бази"
 PER_expand_tehran_armor:0 "Розширити об'єкти «Тегеран Армор»"
 PER_fascist_reach_out_to_japan:0 "Подивитися на Схід"
 PER_feat_of_engineering_idea:0 "Інженерний подвиг"
 PER_foreign_policy_events.5.t:0 "[FROM.GetAdjective] уряд відмовляється."
 PER_german_non_aggression:0 "Обговорити Пакт про ненапад з [GER.GetNonIdeologyName]"
 PER_idea_one_for_all_all_for_one_desc:0 "Ми повинні вийти за межі можливого і забезпечити, щоб кожен [ROOT.GetAdjective] ромадянин був готовий захищати [ROOT.GetNameDefCap] в будь-який момент. Тільки так ми зможемо протистояти світовим державам і зберегти наш суверенітет та ідентичність після Великої гри"
 PER_imperial_events.10.t:0 "[FROM.GetNameDefCap] вимагає території Белуджистану"
 PER_imperial_events.172.desc:0 "$PER_imperial_events.162.desc$"
 PER_imperial_events.181.t:0 "[FROM.GetNameDefCap] погоджується на наші умови"
 PER_imperial_events.190.b:0 "Це не вигідно для нас, продовжувати війну."
 PER_imperial_events.191.t:0 "[FROM.GetNameDefCap] погоджується на наші умови"
 PER_imperial_events.230.c:0 "Вислати династію Пехлеві до [SAF.GetNameDef]."
 PER_imperial_events.232.t:0 "Династію Пехлеві вислано до [SAF.GetNameDef]"
 PER_integrate_anatolia_decisions_category_desc:0 "Анатолія була частиною де-юре земель нашої імперії протягом сотень років, і нарешті настав час повернути її під наш контроль. Інтегруйте ці території та сприяйте подальшому розширенню [PER.GetNameDef]."
 PER_invite_oil_nations:0 "Запросити нафтовидобувні нації"
 PER_islamic_faction:0 "Ісламське братство"
 PER_islamic_solidarity_desc:0 "Хоча ми не завжди можемо погоджуватися з течіями, що відрізняються від шиїтського Ісламу, ми не можемо заперечувати, що всі ми маємо спільного ворога в особі імперіалістичних держав Західної Європи, які продовжують втручатися в наші національні справи. Але разом ми виженемо їх з наших земель раз і назавжди."
 PER_kurdish_rebellion_growing:0 "Курдське повстання зростає"
 PER_memphis_initiative_category:0 "Ініціатива Мемфіса"
 PER_modify_special_forces_ns_intro:0 "Modify §Y$PER_special_units_division_idea$§! by"
 PER_mohammed_nakhjavani:0 "Mohammed Nakhjavani"
 PER_mohtaram_eskandari:0 "Мохтарам Ескандарі"
 PER_motorize_infantry:0 "Моторизувати піхоту"
 PER_negotiate_with_america_desc:0 "[USA.GetNameDefCap] показала себе світовим лідером у сфері розробки атомних технологій; інновацій, які можуть виявитися вирішальними для того, щоб залишатися попереду в нашій боротьбі за збереження актуальності на світовій арені. Ми повинні надіслати дипломатичного посланця, щоб попросити їх про допомогу у розвитку нашої власної ядерної програми."
 PER_oil_baron_idea_desc:0 "Наша країна буквально потопає в нафті, особливо після наших зусиль із усунення [ENG.GetAdjective] впливу на наші ресурси. Що нам робити з усією цією нафтою? Накопичувати її для себе."
 PER_opposition_cell_tt:0 "§YЦя держава приєднається до опозиції у разі початку громадянської війни!§!"
 PER_opposition_modifier:0 "Зростаюча опозиція"
 PER_persian_german_trade_idea:0 "Персько-німецька торгова палата"
 PER_price_stabilization_desc:0 "Зі зміцненням банків ми повинні тепер розпочати кампанію проти необґрунтованої наживи. Ми можемо штрафувати власників фабрик та великих мережевих підприємств, які не дотримуються правил, та фіксувати ціни на товари по всьому [ROOT.GetNonIdeologyName]."
 PER_push_negotiations_tt:0 "Надішле нашим ворогам §Yподію§!, що пропонує §Yправа на ресурси§! ініціатору початкового конфлікту в обмін на §Yбілий мир§!. Якщо вони відхилять нас, ми залишимося у війні."
 PER_question_of_resources:0 "Питання ресурсів"
 PER_raf_planes:0 "Придбати літаки RAF"
 PER_rebuild_persepolis_desc:0 "Персеполіс був церемоніальною столицею Імперії Ахеменідів, і його руїни розташовані на рівнинах Марвдашт. Було б потужним кроком витратити наші ресурси на відбудову та оновлення цього стародавнього міста, і нехай воно стоїть як символ нашої Імперії на десятиліття вперед."
 PER_refused_oil_flag:0 "Відмовлено у [PER.GetAdjective] нафті"
 PER_roll_back_reforms:0 "Відновлення нації"
 PER_rural_feudalism_ns_desc:0 "Феодалізм — це застаріла система структурування суспільства, заснована на володінні землею в обмін на службу та працю. Незважаючи на те, що це середньовічна концепція, вона все ще діє в багатьох сільських регіонах [PER.GetNameDef]."
 PER_saadabad_treaty_desc:0 "Нам нічого втрачати і все здобути, залишаючись дружніми з нашими сусідами. Ідея договору, що формалізує нашу дружбу, час від часу з'являлася, і настав час нам взяти ініціативу та переконатися, що ця дружба закріплена в договорі."
 PER_swedish_artillery:0 "Ліцензувати артилерію від [SWE.GetNameDef]"
 PER_trains_from_britain:0 "Запросити потяги з [ENG.GetNonIdeologyName]"
 PER_transfer_officers_to_intelligence_desc:0 "Щоб посилити операції нашого розвідувального агентства, ми повинні перевести деяких наших більш інтелектуально схильних військових офіцерів у розвідувальний відділ."
 PER_viceroyalty_of_iran_DEF:0 "Віцекоролівство Іран"
 PER_war_plan_darius_idea:0 "Військовий план Дарія"
 PER_war_plan_xerxes_idea_desc:0 "Ксеркс Великий був четвертим царем царів Ахеменідської імперії. Він найбільш відомий своєю навалою на Грецію в 480 році до н.е., і хоча вона закінчилася поразкою персів, цього разу ми будемо переможцями. Давайте рушимо на Егейське море та повернемо Турецький півострів."
 PER_workers_army_desc:0 "Армія переповнена контрреволюційними фанатиками, які чекають нагоди відновити свої застарілі погляди на націю. Ми повинні реформувати армію, щоб запобігти цьому, починаючи з вигнання реакціонерів."
 PHI_BLITZKRIEG_DESC:0 "Сполучені Штати поки що дотримуються свого слова, допомагаючи Філіппінам на шляху до незалежності.\n\nТим часом між Китаєм і Японією спалахнула війна, і острівна держава з тривогою дивиться на імперіалістичні устремління свого північного сусіда.\n\nАмериканські підкріплення почали прибувати, щоб зміцнити оборону, але чи вистачить їх? Японія вже відчуває запах крові у воді."
 PHI_asian_trade_connections_dutch_east_india:0 "Торговельна угода з Голландською Ост-Індією"
 PHI_assassination_of_quezon_tt:0 "§RЗапускаються плани, які мають на меті усунення Кесона з посади. Назавжди.§!"
 PHI_develop_japanese_trade_connections_desc:0 "Японія чітко дала зрозуміти, що вона прагне товарів та ресурсів, а Філіппіни мають чим торгувати. Ми повинні заохочувати комерцію між нашими країнами заради взаємної вигоди."
 PHI_dockworker_infiltration_mod:0 "Dockworker Infiltration Efforts"
 PHI_economic_nationalism_desc:0 "Тепер, коли ми маємо повний контроль над нашим майбутнім, настав час взяти під контроль і нашу економіку. У нашому розпорядженні багато інструментів, таких як тарифи, регулювання, рух товарів і капіталу. Ми повинні використати їх усі і тим самим продемонструвати, наскільки насправді міцною є філіппінська економіка."
