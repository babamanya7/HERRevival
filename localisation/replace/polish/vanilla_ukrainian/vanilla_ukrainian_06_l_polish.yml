 TUR_appoint_nihal_atziz_as_president_desc:0 "Ніхал Атсиз відіграв важливу роль у втіленні наших тураністських мрій. З огляду на підтримку народу, було б розумно підвищити його посаду."
 TUR_bankroll_the_malatya_clothing_factory:0 "Фінансувати фабрику одягу в Малатьї"
 TUR_choices_will_decide_legacy_tt:0 "§YМустафа Кемаль Ататюрк§! давно відстоював ідею про те, що держава §Y[ROOT.GetNameDef]§! має перейти від однопартійного авторитаризму до багатопартійної ліберальної демократії. Наш вибір ідеологічного спрямування покаже, наскільки добре нам вдається слідувати ідеалам §YАтатюрка§!."
 TUR_disorganised_armed_forces_17:0 "$TUR_disorganised_armed_forces$"
 TUR_empower_fundamentalists_in_state:0 "£faction_tur_traditionalist Посилити фундаменталістів у землі"
 TUR_etatism_2_desc:0 "Наша змішана економіка не схожа на жодну іншу у світі: в ній є елементи британського лібералізму, італійського корпоратизму і радянського централізованого планування. Це максимально можливий синтез економічних моделей, вінець кемалістської системи, але не варто перевантажувати його умовами війни.\n\n§RЯкщо ми просунемо наш економічний закон, то нам слід бути готовими до виникнення додаткової напруги між нашими несумісними економічними моделями.§!"
 TUR_etatism_decision_desc:0 "Переваги командної економіки в тому, що керуючі особи зберігають значний контроль за нею за допомогою фіскальних механізмів. Задіяти ці механізми зараз було б на користь держави."
 TUR_financing_private_enterprise_desc:0 "Ціль держави — заохочувати і нагороджувати найпідприємливіших громадян. Інвестуючи в тих, хто вдосконалить нашу націю, ми інвестуємо в майбутнє країни."
