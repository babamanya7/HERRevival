 USA_battle_domestic_isolationism_desc:0 "Якби ізоляціоністські елементи домагалися свого, ми були б беззахисні перед будь-якою ворожою нацією. Для нашого ж блага ми повинні почати деконструкцію поширеної ізоляціоністської риторики."
