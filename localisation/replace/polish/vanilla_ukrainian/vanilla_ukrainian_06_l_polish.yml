 AIRWING_MISSION_WING_STATUS_2:0 "§T$NAME|H$ ($NUM|H$ од.) — $STATUS$.§!"
 AIRWING_MIXED_MISSION_NIGHT:0 "Більшість авіакрил виконує завдання §Hвночі§!."
