 ETH_addressing_the_league_of_nations_desc:0 "Неспроможність асамблеї вжити заходів щодо загарбницької війни [ITA.GetName] і, як наслідок, політики залишення жертв агресії загрожує самому існуванню Ліги. Ті учасники, які обрали політику відмови, повинні пам'ятати, що це ми сьогодні, це будете ви завтра..."
