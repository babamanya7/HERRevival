 ETH_italian_general_staff_tt:0 "Якщо відносини з Італією будуть позитивними і вони погодяться, §Y$ITA_giuseppe_tellera$§!, §Y$ITA_mario_berti$§! і §Y$ITA_alessandro_pirzio_biroli$§! буде передано до Ефіопії."
