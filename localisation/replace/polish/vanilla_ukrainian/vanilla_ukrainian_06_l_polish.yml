 JAP_revisit_the_thirteen_demands_desc:0 "Під час Великої війни наш уряд висунув Китайській Республіці низку вимог щодо отримання контролю над їхніми залізницями та іншим. Хоча спочатку до списку входили такі пункти, як вирішальний голос у фінансах, поліції та справах уряду, вони були відхилені, і зрештою документ було підписано із залишенням лише тринадцяти вимог. Ми повинні повернутися до цих ідей і утвердити себе як правителів Східної Азії."
