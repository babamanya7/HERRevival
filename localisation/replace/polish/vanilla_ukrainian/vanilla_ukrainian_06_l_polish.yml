 CHL_araucania_establish_a_hispaniolan_kingdom:0 "Заснувати королівство-сателіт на Еспаньйолі"
 CHL_bolster_revolutionaries_americas_desc:0 "[ROOT.GetAdjectiveCap]і агенти будуть виконувати завдання з озброєння та збільшення революційних сил і незадоволених груп у державі [FROM.GetNameDef], допомагаючи зростанню [ROOT.GetRulingIdeologyNoun_RU_lower_Gen] серед [FROM.GetAdjective]их мас, а також дестабілізації їхньої держави."
 CHL_chilean_anti_communist_action_desc:0 "Комуністи є такою ж великою загрозою для нашого народу, як і будь-яка інша, і ми мусимо зробити все можливе, щоби запевнитися, що вони ніколи не отримають шанс здійснити революцію, якої вони так прагнуть."
 CHL_controlled_education_desc:0 "Якщо ми хочемо, щоби діти виросли правильними та мислили так, як ми цього хочемо, ми мусимо переконатися, що їхня освіта відповідає стандартам і правилам, які ми встановили, аби зробити їх зразковими громадянами."
