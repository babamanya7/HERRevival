 SOV_grigory_semyonov:0 "Григорій Семьонов"
 SOV_honest_serfdom_idea:0 "Чесне кріпацтво"
 SOV_ignite_uprising_timer_mission_desc:0 "[ROOT.GetAdjectiveCap]і робітники і селяни, які симпатизують [SOV.GetAdjective]ій більшовицькій партії, готуються до збройного повстання в країні."
 SOV_increase_opposition_navy_support_small_tt:0 "Підтримка опозиції у флоті збільшиться на щонайбільше §G+5%§!."
 SOV_influence_navy_opposition_desc:0 "Військово-морські сили можуть бути не дуже корисними у громадянській війні, але вони все ще можуть допомогти нам зайняти ключові позиції і забезпечити постачання. Тому варто було б забезпечити лояльність деяких капітанів. Крім того, наявність флоту після війни відкриває для нас нові двері на міжнародній арені."
 SOV_intervention_in_china:0 "Інтервенція в Китай"
