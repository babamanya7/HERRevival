 JUNO_brazil_events.200.d:0 "$BRA_lindolfo_collor$"
 JUNO_brazil_events.32.desc:0 "Стерв'ятники, що керують [BRA.GetNameDef], намагаються використати поточний глобальний конфлікт як можливість шантажувати нас, щоб ми передали територію в Гвіанах. Вони вимагають, щоб ми віддали їм цю територію, або ризикували, що вони заберуть її силою. Можливо, буде важко утримати територію, якщо справа дійде до війни, але це створило б небезпечний прецедент для інших спірних регіонів у всьому світі."
 JUNO_brazil_events.36.t:0 "[FROM.GetName] готується до війни"
