 SOV_national_academies_of_sciences_available_tt:0 "Збудовано принаймні §Y[?ROOT.SOV_academies_required_for_atomic_bomb_project] академій наук§!"
 SOV_national_unification_desc:0 "Якщо ми хочемо вижити в прийдешніх війнах, ми не можемо дозволити собі роз'єднатися. Яких би різних політичних поглядів ми не дотримувалися — зрештою, ми всі росіяни."
 SOV_navy_framejob:0 "Підставити адмірала"
 SOV_navy_framejob_desc:0 "Поширюючи чутки про адміралів, лояльних до лідера [ROOT.GetLeader], і передавши деякі фальшиві «докази» в руки НКВС, ми зможемо на деякий час відвернути увагу від себе. Як бонусний ефект, якщо нам пощастить, інші військовослужбовці флоту можуть бути незадоволені репресивними діями."
 SOV_offer_poland_protection_desc:0 "Польща та польський народ зазнали багато поневірянь і принижень протягом століть. Ні для кого не секрет, що німці хочуть повернути території, віддані Польщі після Великої війни, і готові застосувати насильство, щоб отримати їх. Ми мусимо запропонувати польському уряду наш захист, якщо вони готові обговорювати питання нашого спільного кордону."
 SOV_organization_of_the_partisans:0 "Організація партизанів"
