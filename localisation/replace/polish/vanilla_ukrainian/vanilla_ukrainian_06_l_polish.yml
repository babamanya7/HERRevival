 siam.10.t:0 "Перемога!"
 siam.13.desc:0 "[FROM.GetName] відхилила всі пропозиції щодо територіальних поступок, назвавши їх неприйнятними. Їхнє керівництво заявило, що конфлікт закінчиться лише знищенням нашої держави."
 siam.17.t:0 "[FROM.GetName] відмовляється здаватися"
 siam.23.t:0 "Закон про стабілізацію бата"
 siam.24.a:0 "Шукати інвестиції від [ENG.GetName]"
 siam.25.a:0 "Нехай Його Величність вознесеться на небо."
 siam.29.b:0 "Ми вчитимемося у американців"
 siam.33.a:0 "Зменшити податковий тягар для наших людей."
 siam.34.b:0 "Наказати їм забратися геть від наших берегів."
 siam.35.desc:0 "[JAP.GetNameDefCap] чітко висловила свої очікування: ми повинні збільшити грошову масу, щоб задовольнити їхні економічні вимоги. Тягар ляже на наш народ через зростання цін, тоді як промисловість [JAP.GetAdjective] отримає вигоду. У нас мало можливостей відмовити."
 siam.40.desc:0 "[FROM.GetLeader] відхилив кожне звернення, надіслане з Бангкока. Жодного підпорядкування не визнано достатнім, жоден компроміс не прийнятний. Ворог має намір вирішити справу лише через повне завоювання. Для [ROOT.GetNameDef] не залишилося нічого, крім опору. Якщо вони не покинуть наші береги за домовленістю, їх потрібно вигнати силою."
 siam_dem.3.desc:0 "Суперечка вийшла за межі комітету. Газета, яку вважають військовим рупором, надрукувала повне засудження «Жовтого досьє», представивши його як чужорідну програму, загорнуту в патріотичні гасла. Її редактори попереджають, що пропозиція ставить класові образи вище національної єдності, послаблює довіру до встановлених інституцій і заохочує небезпечні очікування серед робітників і селян. До обіду стаття вже повторюється в казармах, офісах і чайних, і те, що було внутрішньою суперечкою, стало публічним скандалом."
 siam_dem.3.t:0 "Публічна догана"
 socialist_education:0 "Соціалістична освіта в державі [From.GetNameDef]"
 sonar_advice_tt:0 "\nУстановка модуля §YСонар§! на §Yлегкі кораблі§! та §Yкрейсери§! дозволить їм виявляти ворожі §Yпідводні човни§!."
 south_american_events.22.desc:0 "Держава [ECU.GetNameDef] негативно відреагувала на наші пропозиції білого миру. Наразі [ECU.GetAdjective]а влада не бачить причин припиняти боротьбу. Вони не залишають нам іншого вибору, окрім як продовжувати боротися з ними."
 south_american_news.10.a:0 "Це може дестабілізувати регіон."
