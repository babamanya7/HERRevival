 DIPLOMACY_OFFER_JOIN_FACTION_REQUEST_DESC:0 "Держава $COUNTRY|UH$ хоче, щоби ми вступили в її альянс — $FACTION|Y$.\nДобровольці, які прибувають або відправляються з однієї з наших країн в іншу, будуть повернуті назад.\nПідготовка переворотів автоматично скасована."
