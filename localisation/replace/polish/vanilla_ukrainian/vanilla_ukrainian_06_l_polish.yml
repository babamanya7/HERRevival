 SWI_citizen_militia_1_desc:0 "На відміну від більшості інших країн, у Швайцарії кожна особа, яка відповідає критеріям вербування, повинна взяти до рук зброю в місцевих ополченнях, коли її покличуть. Це дозволяє нам мати великий відсоток населення в резерві без серйозних наслідків для нашої економіки, доки вони не розгорнуті.\n"
