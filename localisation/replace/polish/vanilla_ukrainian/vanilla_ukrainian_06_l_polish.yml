 lar_capture_tito.1.t:0 "Операція «Хід конем» завершилася невдачею"
 lar_communist_uprising_train_workers_militia:0 "Підготувати робоче ополчення"
 lar_dominate_the_middle_east.3.desc:0 "У тривалій промові перед нашим представником [From.GetLeader] всіляко вихваляв довгі і славні військові традиції [From.GetAdjective] народу, пояснюючи, що жителі його країни ніколи не схилялися передінозем будь-яким спробам захоплення і що їм краще померти стоячи, ніж жити навколішки."
 lar_end_the_occupation.4.t:0 "Пропозиція від Віші"
 lar_france_french_union.5.desc:0 "Схоже, що після інтенсивної, а іноді навіть бурхливої кампанії націоналісти більшості територій Французької Західної Африки взяли гору на референдумі щодо вступу до Французького Союзу. Поки місцеві європейці намагаються осмислити підсумки голосування, лідери місцевих діям та оголошують результат очевидним приводом для надання повної незалежності."
 lar_france_political_violence.3.desc:0 "Після нещодавного урядового рішення монархісти та праві екстремісти з цілої країни зібрались у столиці з наміром «завершити почате у 1934 році», коли штурм парламенту в ході аналогічних бунтів не завершився успіхом, але змусив уряд подати у відставку.\n\nХоча поліцію попередили про те, що протестуючі можуть звернутись до насильства, вона виявилась не готова до рівню організованості та агресії, продемонстрованої добре підготованими групами. В деяких випалках поліціянти, котрі охороняти Площу Згоди, були змушені відкрити вогонь по протестувальникам, щоб утримати позиції.\n\nВтративши декілька десятків вбитими та пораненими, бунтівники відступили, щоби зализати рани, але їм вдалось показати країні, що навіть у столиці уряд не може вважати себе у безпеці."
 lar_france_vichy_reunification.1.desc:0 "Після звільнення Парижа його військами [From.GetLeader], командир французької армії у вигнанні, зажадав, щоб його уряду дали повну владу над усіма неокупованими районами Франції. Він каже, що будь-яка відмова буде розцінена як заколот проти законного уряду Республіки."
 lar_france_volunteers.3.b:0 "Надіслати їх назад."
 lar_news.22.b:0 "Вони загрожують нашому способу життя!"
 lar_news.3.c:0 "Континент буде поділений заново."
 lar_news.9.desc:0 "Після довгого періоду політичних та економічних реформ міністри-комуністи в уряді Народного фронту зажадали сьогодні, щоб інші міністри або склали повноваження та визнали Комуністичну партію єдиною партією в уряді, або негайно вступили до Комуністичної партії.\n\nВ той же час озброєні робітники великих урядових заводів зайняли стратегічно важливі місця по всій країні. Армія за наказом Парижа залишилася в казармах і втручатися не стала."
 lar_non_intervention.3.t:0 "[From.GetNameDefCap] відмовляється вступати до Комітету з невтручання"
 lar_operative_event.3.t:0 "Агента вбито"
 lar_portugal_iberian_summit.4.t:0 "Іберійські нації хочуть приєднатися до альянсу [Root.GetFactionName]"
 lar_portugal_promote_monarchist_cause.2.a:0 "[Root.GetNameDefCap] та [POR.GetNameDef] об'єднаються знову."
 lar_portugal_promote_monarchist_cause.3.desc:0 "За допомогою [POR.GetAdjective]ого уряду бразильські монархісти захопили контроль над Ріо-де-Жанейро і підняли по всій країні зброю проти протистоїть нам фашистських зрадників. Ворог намагається заручитися підтримкою вірні піддані відродженої держави [Root.GetName] не бояться — їх законний імператор [Root.GetLeader] приведе їх до перемоги!"
 lar_rescue_mussolini.1.t:0 "Спроба порятунку не вдалася"
 lar_spain.15.t:0 "РПМО переможена"
 lar_spain.25.desc:0 "[From.GetAdjective] посланці висунули пропозицію, яка посилить нашу взаємну оборону, а також допоможе підтримувати мир на Піренейському півострові. сторона, а також брати участь у будь-якому конфлікті, що втягує її в тій же ролі, будь то роль агресора або обороняється."
