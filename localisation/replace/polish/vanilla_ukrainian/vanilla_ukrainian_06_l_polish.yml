 CHL_host_spanish_refugees_desc:0 "Наші брати в Іспанії воювали зі своїми друзями та сім'ями і є духовно розбитими. Тепер, коли громадянська війна закінчилася, багато хто прагне втекти від нинішнього режиму, і ми, як іспанські брати, є головним кандидатом на прийняття біженців."
 CHL_humberto_valdivieso:0 "Умберто Арріагада Вальдів'єсо"
 CHL_incorporate_machi_into_the_army_desc:0 "Мачі є традиційними цілителями та релігійними лідерами в нашій релігії, відомі своїми традиційними медичними ремеслами. Ми мусимо подбати про те, щоб у кожній дивізії був принаймні один мачі, щоби забезпечити здоров'я наших солдатів у бою."
