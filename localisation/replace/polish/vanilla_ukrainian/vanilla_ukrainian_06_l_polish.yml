 congo_independence_struggle.1.t:0 "Шепіт про незалежність"
 congo_independence_struggle.10.d:0 "Ми щойно отримали відповідь від [COG.GetNameDef] щодо нашої пропозиції підняти їх до статусу домініону, і вони погодились! \n\nТепер, коли ми бачимо, що вони готові вести переговори, якщо ми натиснемо трохи сильніше, можливо, зможемо переконати їх ще більше, однак це не без ризиків, і ми можемо їх втратити зовсім, або ще гірше — загнати в кут."
 congo_independence_struggle.5.d:0 "Ми щойно отримали новину від нового посла від [COG.GetName], який оголосив, що вони прийняли пропозицію щодо незалежності від колоніального правління [BEL.GetAdjective] в обмін на приєднання до [BEL.GetAdjective] Співдружності як повноцінний та рівноправний член. Тепер починається робота з витягнення адміністрації з Колоніального офісу і передачі цієї відповідальності їхньому новому уряду."
 conservatism_desc:0 "Вважаючи різкі зміни в суспільстві ймовірно шкідливими, консерватизм підтримує традиції та помірні реформи, іноді виступаючи за повернення до старих моральних цінностей."
