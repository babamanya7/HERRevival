 SOV_raskovas_aviation_group:0 "[GetRaskovasAviationGroupName]"
 SOV_reigniting_the_revolutionary_spirit_desc:0 "Роки сталінського правління притупили революційний запал нашого народу. Нашим робітникам казали, що революція станеться — коли-небудь. Ми знаємо, що це не так — при нинішньому глобальному рівні розвитку революція мусить бути запалена в інших країнах, які не так далеко розвинені. І ми її запалимо."
 SOV_reinstate_ilyushin_design_bureau:0 "Відновити конструкторське бюро Ільюшина"
 SOV_secure_moscow_opposition:0 "Убезпечити Москву"
 SOV_seek_a_defense_pact_with_the_allies_target_fra:0 "§Y[FRA.GetFlag][FRA.GetNameDef]§!"
 SOV_send_military_advisors_to_spain_desc:0 "Після перемоги на демократичних виборах, наші товариші в Іспанії зіткнулися з реакційною контрреволюцією. Ми мусимо підтримати їх, щоб їх поразка не заохотила фашистів в інших країнах."
 SOV_sergey_khudyakov:0 "Сергій Худяков"
 SOV_sevastopol_marine_plant_organization:0 "$SOV_sevastopol_marine_plant$"
 SOV_sinkiang_military_aid_flag:0 "Надано військову допомогу Сіньцзяну"
 SOV_sorge_incident_opm:0 "Інцидент із Зорге"
 SOV_strat_bomber_equipment_0:0 "Туполев ТБ-3"
 SOV_supported_japan_bad:0 "$SOV_supported_japan_good$"
 SOV_the_anti_soviet_trotskyist_center_desc:0 "Наше розслідування зінов'євської змови виявило, що в нашій адміністрації існує велика мережа антирадянських терористів. Деякі її члени навіть не до кінця усвідомлюють, кому вони допомагають! Цю змову необхідно викорінити, і для цього, можливо, доведеться вжити радикальних заходів."
 SOV_the_common_economic_space_initiative:0 "Ініціатива Спільного економічного простору"
 SOV_the_head_of_the_nkvd_yagoda:0 "Голова НКВС — Яґода"
 SOV_the_stalin_constitution_mission_desc:0 "[FROM.GetLeader] працює над виконанням фокусу $SOV_the_stalin_constitution$."
 SOV_the_zinovyevite_terrorist_center_mission:0 "$SOV_the_zinovyevite_terrorist_center$"
 SOV_the_zinovyevite_terrorist_center_mission_avoided_tt:0 "Великої чистки вдасться уникнути. Поки що..."
 SOV_third_five_year_plan_desc_default:0 "Поки триває мир, ми мусимо прискорити нашу індустріалізацію, щоб задовольнити потреби наших людей і наших військових."
 SOV_third_moscow_trial_flag:0 "Виконано фокус §Y$SOV_the_bloc_of_rights_and_trotskyites$§!"
 SOV_war_with_uk_desc:0 "Імперіалістичні британці ніколи не мали до нас жодної поваги. Немає сумнівів, що вони звернуться до Радянського Союзу, коли покінчать з рештою світу. Існує лише один спосіб запобігти їхній агресивній експансії: війна!"
 SOV_womens_fascist_movement:0 "Жіночий фашистський рух"
 SPA_a_one_party_state_desc:0 "Демократія, а не самоціль, як хочуть переконати нас республіканці, насправді є нічим іншим, як засобом вирвати повний контроль над державою у слабких і негідних. Ми покінчимо з усіма іншими політичними партіями, щоби ті з сильним баченням не перешкоджали їхньому прагненню до Великої Іспанії."
 SPA_activate_sevilla_fifth_columnists:0 "Задіяти п'яту колону у Севільї"
 SPA_artillery_modernization_desc:0 "Артилерія є ключовою частиною сучасної війни, тому ми повинні модернізувати наші застарілі частини новими та потужнішими моделями."
 SPA_catalunya_offensive:0 "Наступ у Каталонії"
 SPA_establish_the_directory_tt:0 "Держава §Y[ROOT.GetName]§! буде зватися §YІспанська Директорія§!.\n"
 SPA_expand_influence_in_the_ciudad_real_garrison:0 "Розширити вплив на гарнізон у Сьюдад-Реалі"
 SPA_expand_the_special_forces:0 "Розширити війська спец. призначення"
 SPA_glory_and_wealth_on_the_sea_lanes_desc:0 "Доля Іспанії завжди лежала за океанами. На нас чекає слава й багатство, нам потрібно лише відновити контроль над морськими шляхами, як ми це робили в минулому."
 SPA_hand_over_the_ceda_campaign_chest_desc:0 "У нас лишилося достатньо коштів після нашої виборчої кампанії. У випадку, якщо Парламент відхилить наш голос, ми мусимо підготуватися до його знищення. Ми передамо фонд фінансування кампанії Іспанської конфедерації автономних правих більш обізнаним частинам збройних сил, щоби ті змголи підготувати повстання проти лівих."
 SPA_jose_antonio_primo_de_rivera:0 "Хосе Антоніо Прімо де Рівера"
 SPA_light_tank_equipment_3:0 "Verdeja 2"
 SPA_luis_carrero_blanco:0 "Луїс Карреро Бланко"
 SPA_medium_tank_equipment_2_short:0 "CDC 41"
 SPA_rebuild_the_battlefleet_desc:0 "Протягом чотирьох десятиліть після іспано-американської війни наш флот був млявим і боязким. Додавання нових великих військових кораблів, здатних зустрітися з будь-яким ворогом, викличе в його лавах відчуття відродження, а також дозволить нам змагатися на морях з нашими сусідами."
 SPA_reduce_reliance_on_foreign_resources_desc:0 "Покладання на інших — це слабкість, якою можуть скористатися лише наші можливі вороги. Ми повинні прагнути до самозабезпечення будь-якими ресурсами, які ми можемо."
 SPA_tackle_the_vulnerable_fronts:0 "Переоглянути вразливі фронти"
 SPA_the_army_of_africa_mission_tt:0 "Коли почнеться громадянська війна, націоналісти отримають 5 добре тренованих дивізій із §Y7§! батальйонами §Yпіхоти§! та §Y2 артилерії§!, підтримкою §Yрозвідроти§! та §Yроти інженерів§!, а також гарантований контроль над областю §Y[290.GetName]§!.\n"
 SPA_the_crusade_against_democracy_timer_tt:0 "Щонайменше 70 днів від зміни ідеї §Y$SPA_the_crusade_against_democracy$§!.\n"
 SPA_the_war_of_vengeance_desc:0 "Іспано-американська війна 1898 року все ще живе в пам'яті, і глибокий вплив, який вона справила на національну психіку іспанців, найкраще проілюстрований у працях «Покоління '98». Треба помститися за національне збентеження через втрату наших колоній. Америку треба звести нанівець."
 SPB_alfonso_king2:0 "Після багатьох років у засланні Альфонсо XIII повернувся на іспанський трон і поклав кінець століттю кровопролиття, нарешті об'єднавши дві спадкові гілки."
 SPB_kingdom_neutrality_DEF:0 "Королівство Іспанія"
