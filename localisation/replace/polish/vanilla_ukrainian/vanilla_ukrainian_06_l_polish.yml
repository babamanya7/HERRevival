 RULE_OPTION_RAJ_FRAGMENTED:0 "Британська Індія роздроблена"
 RULE_OPTION_RAJ_FRAGMENTED_DESC:0 "Усі доступні для звільнення складові нації Британської Індії будуть створені як вільні та незалежні нації після початку гри."
 RULE_OPTION_STALINIST_GRE_AI:0 "Прорадянський комунізм"
