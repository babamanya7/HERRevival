 GER_glorious_mechanical_machinations_desc:0 "Наш кайзер давно захоплюється великими машинами, й наказав науковцям зосередити дослідження на створенні раніше небачених див: гігантських залізничних гармат, літаків, здатних перетинати Атлантику, і кораблів, що закривають собою обрій."
 GER_heavy_cruiser_3_desc:0 "Офіційно частина класу «Hipper», підклас «Prinz Eugen» включає в себе багато вдосконалень, серед яких — важче протиповітряне озброєння. З трьох кораблів цього підкласу лише Prinz Eugen був завершений. Він брав участь у потопленні HMS Hood під час операції «Навчання на Райні» (Райнюбунґ). Після війни був переведений до США і служив як USS Prinz Eugen у випробуваннях атомних бомб на полігонах Ейбл і Бейкер, а потім затонув біля атолу Кваджалейн у 1946 році."
 GER_historical_path_shortcut:0 "Політика (історична)"
 GER_industrial_relocation_cat_desc:0 "Наша спільна з державою [SOV.GetNameDef] програма переміщення промисловості може призвести до скорочення нашої промислової бази в короткостроковій перспективі, але сировинні ресурси, які ми отримаємо з неї, з лишком компенсують це та зміцнять наші виробничі лінії."
 GER_inner_circle.03.a:0 "[GetIntrigueCharacterName] повністю заслуговує довіри фюрера."
 GER_inner_circle.03.d:0 "$GER_hermann_goring$ — права рука фюрера, призначити його!"
 GER_inner_circle_hide_button_tt:0 "[!hide_button] БЛАБЛА"
 GER_invite_scientists_back_desc:0 "Багато яскравих умів залишили країну після приходу нацистів до влади — і не даремно. Та з відновленням нашої славної Імперії, дехто з них, можливо, захоче повернутись."
 GER_is_not_colonial_overlord_option:0 "Краще перестрахуватись..."
 GER_labor_rights_and_union_stuff:0 "Створити профспілки"
 GER_launch_sino_germanic_joint_research_program_desc:0 "[CHI.GetAdjectiveCap]ий народ володіє знаннями, що можуть бути корисними для нас, як і ми для них. Ми мусимо створити спільну науково-дослідну команду для взаємного прогресу."
 GER_light_cruiser_1_desc:0 "«Emden» був першим великим військовим кораблем, побудованим у Німеччині після Першої світової війни. Він був закладений у 1921 році і введений в експлуатацію в 1925 році. Озброєння складалося з восьми 150-мм (5,9-дюйм.) гармат в одиночних баштах."
 GER_lokot_collaborators_have_been_captured_by_the_soviets_tt:0 "§Y[GER.SOV_bronislav_kaminski.GetName]§! і §Y[GER.SOV_konstantin_voskoboinik.GetName]§! були захоплені військами [SOV.GetAdjective]"
