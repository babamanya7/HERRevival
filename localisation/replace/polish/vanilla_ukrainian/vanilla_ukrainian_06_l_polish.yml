 ENE_democratic_def:0 "$ENM_democratic$"
 ENG_destroyer_1_desc:0 "Серед цих есмінців були класи «Admirality» і «Thornycroft» «V» та «W». Вони були побудовані в рамках Програми надзвичайної ситуації у війні. Вони були кінцевою еволюцією дизайну британських есмінців під час Першої світової війни, втілюючи вдосконалення своїх попередників, а також нові технологічні досягнення. Велика кількість цих кораблів була побудована на пізніх етапах Першої світової війни і згодом стала основою флотилій міноносців Королівського флоту. Починаючи з 1930-х років, їх було поміщено до резервних флотів, які згодом використовували для супроводу конвоїв. Це були добре озброєні швидкісні судна з хорошою дальністю."
 ENG_discuss_imperial_defense_desc:0 "Ми висунемо пропозицію, згідно з якою всі члени Співдружності повинні будуть зробити значний внесок у захист Імперії."
