 HUN_the_regent:0 "Регент Угорщини"
 HUN_trade_deal_with_germany_desc:0 "Корисність для нашої промисловості від поліпшення торговельних відносин з Німеччиною очевидна, а побоювання щодо можливої залежності від німецької економіки безпідставні. Ми підпишемо угоду про розширену торговельну співпрацю."
