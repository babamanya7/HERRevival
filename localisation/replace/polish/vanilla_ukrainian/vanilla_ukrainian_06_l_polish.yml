 SHOW_EXILES_DISABLED_DESC:0 "§RУ нас немає жодних урядів у вигнанні.§!"
 SHX_autonomy_sea_integrated_warlord_subject:0 "Провінція Шаньсі"
 SHX_heavy_fighter_equipment_1_short:0 "P-60"
 SHX_heavy_fighter_equipment_2:0 "CAMCO PF-77"
 SHX_heavy_tank_artillery_equipment_2:0 "PLZ 41 D"
 SHX_li_fuying:0 "Li Fuying"
