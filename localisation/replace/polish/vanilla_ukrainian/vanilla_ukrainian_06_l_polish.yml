 FRA_heavy_cruiser_4_desc:0 "Важкі крейсери класу «Forbin» були гіпотетичним проєктом як продовження класу «Saint Louis». Призначений для захисту торговельних шляхів між материковою Францією та колоніями, він мав велику дальність і хорошу швидкість разом із важким озброєнням із чотирьох потрійних веж і достатньою кількістю зенітної зброї. Компонування корабля та загальний вигляд нагадували вплив попереднього класу Saint Louis, а також британського класу Crown Colony."
