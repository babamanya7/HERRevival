 DEN_prime_minister_resigns_tt:0 "§Y[DEN.GetLeader]§! йде у відставку з посади §Yпрем'єр-міністра§!"
 DEN_protect_bornholm_desc:0 "Борнгольм знаходиться в небезпеці на південь від [SWE.GetNameDef] і на північ від [GER.GetNameDef], ближче до обох країн, ніж до решти Данії. Ми повинні зміцнити цей стратегічно розташований острів у Балтиці і забезпечити наш контроль над ним."
