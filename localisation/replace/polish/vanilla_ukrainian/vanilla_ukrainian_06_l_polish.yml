 CHL_the_path_to_conquest:0 "Об'єднання шляхом завоювання"
 CHL_the_true_enemy_desc:0 "Америка — єдиний справжній ворог нашого народу, і вона занадто довго пригнічувала гіспанців на своєму півдні. Тепер, коли ми готові до останнього поштовху, все, що нам потрібно зробити — це зробити останній крок."
