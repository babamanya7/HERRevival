 FIN_janiskoski_power_plant:0 "Електростанція в Яніскоскі"
 FIN_join_the_comintern_desc:0 "Ми повинні відмовитися від застарілих уявлень про націоналізм і пов'язані з ним образи та працювати разом із [SOU.GetNameDef]. Разом ми можемо допомогти переломити хвилю проти реакційних сил Європи, одночасно забезпечивши наше власне майбутнє."
