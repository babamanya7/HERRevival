 XSM_sideline_family_conflicts_desc:0 "Сім'я Ма велика і контролює величезні території. Теоретично це могло б означати, що об'єднання створило б грізну силу в регіоні, але натомість сім'ю роздирають чвари та конфлікти. Якщо ми хочемо об'єднатися, ми спочатку повинні переконатися, що ці конфлікти не стоять на нашому шляху."
 XSM_solidifying_control_desc:0 "Тепер, коли внутрішні чвари закінчилися, настав час зміцнити нашу владу над Цінхаєм, щоб уникнути будь-якої подальшої дестабілізації, чи то від внутрішніх, чи то від зовнішніх сил."
