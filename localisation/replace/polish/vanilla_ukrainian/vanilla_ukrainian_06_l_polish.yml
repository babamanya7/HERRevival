 CHI_subjugate_the_warlords:0 "Підкорити воєначальників"
 CHI_take_control_of_the_executive_yuan_desc:0 "Той, хто створює закони, має владу, але той, хто забезпечує їх виконання, може їх замінити. З нашими людьми на міністерських посадах ми зможемо протистояти чанкайшизму на кожному рівні."
 CHI_the_chu_x_po_desc:0 "Chu XP-0 (Chu X-PO) — перший розроблений і повністю винищувач, що виробляється в Китаї, здатний на рівних боротися з будь-якими ворогами."
 CHI_the_northwest_highway_tt:0 "\n [?CHI_facilitate_the_northwest_highway_support_equipment|Y0] од. $support_equipment$ \n [?CHI_facilitate_the_northwest_highway_motorized_equipment|Y0] од. $motorized_equipment$"
 CHI_the_soviet_volunteer_group_desc:0 "За чисельністю наших ВПС ми жахливо відстаємо від інших держав регіону. Радянський Союз, можливо, не проти надіслати підкріплення з добровольців."
 CHI_tsr_adopt_the_twelve_symbols:0 "Прийняти Дванадцять символів"
