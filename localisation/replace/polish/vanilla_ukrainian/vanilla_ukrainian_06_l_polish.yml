 ETH_survival_against_all_odds_idea:0 "Усупереч усьому"
 ETH_the_american_radio_address_desc:0 "Закони Ліги Націй постійно порушуються, оскільки неодноразово відбуваються акти агресії. Щоб дух проклятого не запанував над людським родом, всі миролюбні люди повинні співпрацювати, щоб твердо стояти на захисті законності та миру."
