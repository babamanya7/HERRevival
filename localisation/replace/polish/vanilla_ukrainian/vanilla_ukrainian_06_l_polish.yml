 CHI_enforce__virtues_desc:0 "Досі люди витрачають свій час на легковажні та безглузді заняття, тоді як вони могли б самовдосконалюватися заради партії та нації. Ми були занадто поблажливими у нашому контролі, і ми подвоїмо наші зусилля."
