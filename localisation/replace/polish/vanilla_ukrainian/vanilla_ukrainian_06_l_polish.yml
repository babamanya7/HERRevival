 ARG_argentina_first_idea_desc:0 "Завжди нелегко йти наодинці, особливо коли ми ставимо перед собою такі високі цілі завоювання південноамериканського континенту. Однак, якщо ми будемо пов'язані з фашистськими рухами в Європі, ми можемо втратити з поля зору нашу справжню мету: об'єднану Південну Америку."
 ARG_argentine_beef_idea_desc:0 "Відтоді, як у 1536 році іспанські конкістадори вперше завезли велику рогату худобу до [ARG.GetAdjective]их земель, яловичина була основним продуктом у традиційній аргентинській кухні. Завдяки цьому наша яловичина стала відомою в усьому світі, а отже, існує великий попит на її експорт."
 ARG_balancing_act_decisions_tt:0 "Відімкне сукупність рішень §Y$ARG_balancing_act_decisions$§!, котрі дозволять нам балансувати між заспокоєнням держав [USA.GetFlag]§Y[USA.GetName]§! та [ENG.GetFlag]§Y[ENG.GetName]§! або [GER.GetFlag]§Y[GER.GetName]§! та [ITA.GetFlag]§Y[ITA.GetName]§!."
 ARG_bolstering_the_army_desc:0 "Війна продовжує набирати обертів, і ми повинні бути готові відповісти на її заклик. По всій [ARG.GetNameDef] чоловіки та жінки готові ризикувати своїм життям, щоб боротися та захищати своє право на свободу від тих, хто прагне її відібрати. Ми повинні розпочати кампанію з набору та заохотити народ нашої великої нації взяти зброю та готуватися боротися за свій дім."
 ARG_committee_of_state_security_idea_lar_desc:0 "За зразком російських служб розвідки, аргентинський Комітет державної безпеки був створений для виконання функцій зовнішньої розвідки, контррозвідки та таємної поліції."
 ARG_committee_of_state_security_idea_no_lar_desc:0 "$ARG_committee_of_state_security_idea_lar_desc$"
 ARG_conquer_uruguay_desc:0 "Поки наш новий режим зміцнюється, ми повинні вирішити, як діяти щодо наших менших сусідів. [URG.GetNameDefCap] завжди була спірною територією, і її захоплення силою послужить для демонстрації решті світу, що нас не слід недооцінювати."
 ARG_democratic_DEF:0 "Аргентинська республіка"
 ARG_diego_mason:0 "Дієго І. Масон"
 ARG_edelmiro_julian_farrell:0 "Едельміро Хуліан Фаррель"
 ARG_encourage_german_investments_desc:0 "Незважаючи на те, що [GER.GetNameDef] розглядається багатьма як ізгой Європи, вона стала промисловим та військовим центром сили. Ми завжди були відносно дружні з [GER.GetAdjective]ою владою через значну кількість [GER.GetAdjective] людей, що проживають у [ARG.GetNameDef]. Ми повинні звернутися до них і подивитися, чи готові вони інвестувати в наш зростаючий націоналістичний рух."
 ARG_extinguish_south_american_fascism:0 "Знищити південноамериканський фашизм"
 ARG_fanny_edelman:0 "Фанні Едельман"
 ARG_generic_communist_revolutionary:0 "Хуан Домінго Перон"
 ARG_growing_nationalism_modifier:0 "Зростаючий націоналістичний рух"
 ARG_instigate_worker_strike:0 "Спровокувати робітничий страйк в області [FROM.GetName]"
 ARG_jet_fighter_equipment_1_short:0 "Pulqui I"
 ARG_join_the_axis_desc:0 "Ми багато чим зобов'язані державам Осі за нашу здатність поставити [ARG.GetNameDef] під сильне та стабільне керівництво. Таким чином, ми повинні звернутися до них і попросити приєднатися до їхньої війни, допомагаючи поширювати фашизм по всьому світу!"
 ARG_march_to_la_casa_rosada:0 "Марш на Касу Росаду"
 ARG_nationalist_union_south_america_fascism_ADJ:0 "Південноамериканськ"
 ARG_pay_back_usa:0 "Сплатити позику від держави [USA.GetFlag]§Y[USA.GetName]§!."
 ARG_political_events.110.a:0 "Ми повинні загострити це!"
 ARG_political_events.16.a:0 "Excelente!"
 ARG_political_events.4.desc:0 "Сьогодні вранці ми отримали офіційну заяву про ембарго від [USA.GetName]. Було заявлено, що наше рішення залишатися нейтральними у глобальному конфлікті є антитезою всього, за що виступає доктрина Монро. Таким чином, ця санкція накладена на нас до подальшого повідомлення. Здається, наша відданість нейтралітету розлютила наших сусідів на півночі."
 ARG_political_events.61.a:0 "Разом ми відстоюватимемо ідеали Революції."
 ARG_political_events.70.a:0 "Фанні Едельман має залишитися при владі."
 ARG_political_events.73.a:0 "Ми вітаємо їхні прагнення, звичайно, вони отримають як пакт, так і гарантію!"
 ARG_reach_out_to_the_soviet_union_desc:0 "Не секрет, що нам потрібно відійти від нашої старої форми уряду та запровадити швидкі зміни, щоб формувати майбутнє [ARG.GetNameDef]. Оскільки це може призвести до кривавої революції, ми повинні звернутися до нації, яка пережила це раніше. Зв'язок з [SOV.GetNameDef] може забезпечити допомогу, якщо наше прихід до влади супроводжуватиметься прикрим, але необхідним насильством."
 ARG_roberto_maria_ortiz:0 "Роберто Марія Ортіс"
 ARG_royal_navy_influence_bonus:0 "$ARG_royal_navy_influence$"
 ARG_ship_light_medium_battery_2:0 "15.2 cm/50 QF Mark W"
 ARG_spirit_of_the_conquistadors_idea_desc:0 "Саме слава конкістадорів привела наших людей сюди, на нашу прекрасну срібну землю. Вони відіграють важливу роль у нашій історії, а зараз слугують натхненням для нового націоналістичного уряду Німіо де Анкіна. [ARG.GetNameDefCap] зростатиме, коли ми підкоримо наших слабших сусідів і станемо домінуючою силою в Південній Америці."
 ARMY_EXPERIENCE_DESC:0 "По мірі використання оснащення в бою, Ви отримуєте досвід армії. Це означає, що Ви отримуєте досвід армії, коли Ваші §Hдивізії§! беруть участь у битвах або якщо Ви надсилаєте оснащення своїм союзникам шляхом §Hленд-лізу§!.\nТакож досвід можна отримувати від §Hназемних навчань§! військ, які мають принаймні рівень $UNIT_TRAINING_LEVEL|Y$, а також від певних §Hнаціональних фокусів§!. Деякі §Hміністри§! можуть збільшити розмір отримуваного досвіду.\n\nДосвід армії необхідний для створення та редагування §Hшаблонів дивізій§! та відмикання §Hдоктрин§!."
 ARMY_FIGHTING_IN_BORDER_WAR:0 "§RЦя армія бере участь у прикордонному конфлікті.\n\nВи не можете віддавати накази військовим частинам у цій армії, видаляти дивізії та замінювати її командування.§!\n\n"
 ARMY_LEADER_ALREADY_HAS_PREFERRED_TACTIC:0 "Цей персонаж уже має обраною переважну тактику.\n"
