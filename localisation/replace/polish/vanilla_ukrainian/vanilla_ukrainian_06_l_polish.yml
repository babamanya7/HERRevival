 ETH_mercenaries_arabia_tt:0 "Додає §Y2 арабських найманців§!, якщо §Y[843.GetName]§! і §Y[835.GetName]§! дружньо контролюється."
 ETH_on_our_own_idea_desc:0 "Міжнародна спільнота зайняла позицію в конфлікті між державами [ITA.GetName] й [ETH.GetName] та вирішила, що інші країни не повинні втручатися. [ETH.GetName] самотня в цю скрутну годину."
 ETH_pan-africanism:0 "Панафриканізм"
 ETH_promote_the_war_heroes_desc:0 "Ми завдячуємо нашій подальшій свободі героям, які ризикують своїм життям на полі бою. Щоб підтримувати високий моральний дух і підтримувати збройні сили, ми просуватимемо наших героїв війни на більш престижні посади."
 ETH_recruit_mercenaries:0 "Завербувати найманців"
 ETH_regional_supply_depots_desc:0 "Наші війська не зможуть захистити свою Батьківщину, якщо у них не буде боєприпасів і продовольства. Адже армія крокує на животі. Ми повинні переконатися, що вони завжди добре забезпечені, створивши регіональні військові склади постачання в [ETH.GetName]."
 ETH_send_ita_generals_tt:0 "\n§Y$ITA_giuseppe_tellera$§!, §Y$ITA_mario_berti$§! та §Y$ITA_alessandro_pirzio_biroli$§! будуть переведені до Ефіопії."
