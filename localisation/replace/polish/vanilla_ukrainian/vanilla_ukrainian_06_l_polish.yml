 INSHOL_eastern_development_fund_desc:0 "Ми занадто багато уваги приділяємо інвестиціям в Яву та Суматру, ігноруючи більшу частину земель колонії. Ми маємо взяти на себе зобов'язання розвивати інфраструктуру на Сході, щоб уможливити майбутню індустріалізацію."
 INSHOL_emergency_naval_purchases:0 "Екстрені військово-морські закупівлі"
 INSHOL_emergency_powers_gov_general:0 "Надзвичайні повноваження для генерал-губернатора"
 INSHOL_establish_the_princely_council_desc:0 "Султани і раджі архіпелагу користуються такою лояльністю, якої не мала жодна палата в Батавії. Їхні двори старіші за Компанію і старіші за Республіку, яка її змінила. Офіційна рада князівських домів дасть цим правителям місце за столом нової нації і пов'яже їхній авторитет з нашим."
 INSHOL_expand_shell:0 "Розширення інфраструктури Shell"
 INSHOL_fund_ml_knil:0 "Фінансування ML-KNIL"
 INSHOL_license_dutch_weapon_blueprints_desc:0 "Замість того, щоб інвестувати в будівництво цілого вітчизняного виробничого процесу та створення власних технологічних розробок, ми повинні співпрацювати з голландськими компаніями, щоб купувати їхні креслення зброї."
 INSHOL_naval_program_desc:0 "Флот Ост-Індії далеко відстає від інших флотів, навіть колоніальних. В інтересах усіх сторін, щоб ми допомогли у розбудові цього нового флоту, щоб забезпечити швидкий прогрес."
 INSHOL_reasserting_control_desc:0 "Ми не можемо сидіти склавши руки та дивитися, як ці опортуністи намагаються зруйнувати те, що ми будували століттями, одночасно руйнуючи нашу інфраструктуру та радикалізуючи молодь. Ми маємо діяти!"
