 CHL_sell_arica_to_peru_civil_war_tt:0 "§RВиконання цього фокусу, а також $CHL_outlaw_socialism$ або $CHL_utilize_national_populism$, призведе до громадянської війни.§!"
 CHL_socialist_land_reform_desc:0 "Епоха асендадів скінчилася, і нашим селянам більше не доведеться жити в кріпацтві. У державі [CHL.GetNameDef] дійсно настала нова доба!"
 CHL_the_francoist_model:0 "Франкістська модель"
