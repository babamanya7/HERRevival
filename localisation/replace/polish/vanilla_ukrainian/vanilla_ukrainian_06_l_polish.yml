 BUL_obliterate_the_bolshevik_threat_desc:0 "Рано чи пізно комуністичні нації прагнуть перенести свою прокляту революцію до [ROOT.GetNameDef]. Навіщо чекати більшовицького випаду, коли ми можемо скористатися елементом несподіванки? Ми мусимо вдарити першими, і ми мусимо вдарити з такою жорстокістю, щоб їхня улюблена революція була розбита раз і назавжди!"
 BUL_opression_destroy_nsm_desc:0 "Настав час завдати вирішального удару $BUL_nsm_name_dat2$ і позбавити країну від цієї загрози раз і назавжди."
 BUL_opression_destroy_zveno_desc:0 "Настав час завдати вирішального удару $BUL_zveno_name_dat$ і позбавити країну від цієї загрози раз і назавжди."
 BUL_overthrow_the_tsar_desc:0 "У Болгарії поширюються антицарські настрої, і ми мусимо скористатися цією цінною можливістю, щоби повалити [GetBulgarianTsar] та раз і назавжди скасувати Болгарську монархію. У сучасній Болгарії немає місця для такої застарілої форми правління!"
 BUL_peaceful_development_desc:0 "Навіщо приєднуватися до війни, яка не принесе нічого, крім смерті та лиха нашому народу, коли ми можемо просто грати роль миротворців над окупованими балканськими регіонами, пожинаючи територіальні здобутки, не відправляючи жодної людини на вірну смерть на якомусь віддаленому фронті бою?"
 BUL_refuse_army_restrictions_faction_name:0 "є [ROOT.GetFactionName]"
 BUL_restore_the_tarnovo_constitution_desc:0 "Після державного перевороту 1934 року держава керується відповідно до де-факто призупиненої конституції. Настав час офіційно відновити Тирновську Конституцію, яка не тільки порадує наших громадян, а й юридично підтримає наш авторитарний режим."
 BUL_soviet_military_exercises_desc:0 "Нашим військовим є чому повчитися у компетентної та дисциплінованої Червоної армії. Ми мусимо запросити військових радників з [SOV.GetNameDef] прийти до [ROOT.GetNameDef], щоби допомогти нам розробити програму військової підготовки, натхненну радянською моделлю."
 BUL_spr_flag:0 "[SPR.GetFlag]"
 BUL_support_imro_make_contacts_desc:0 "Ми таємно зв'яжемося з ВМРО і дамо лідерам цієї організації зрозуміти, що їхня співпраця з болгарським урядом буде вкрай вигідна обом сторонам."
 BUL_support_imro_supply_activists_desc:0 "Ми постачатимемо ВМРО зброю, щоб вона змогла вторгнутися до Югославії та Грецької Македонії, дестабілізувавши регіон."
 BUL_the_peoples_republic_of_bulgaria:0 "Народна республіка Болгарія"
 BUL_the_spanish_struggle_desc:0 "Наші іспанські товариші стикаються з фашистським покидьком, який, завдяки підтримці інших правих сил у Європі, серйозно загрожує поразкою республіканському уряду. \nЗіткнувшись із таким звірством, [ROOT.GetNameDef] не може дивитися в інший бік. Ми мусимо організувати бригади добровольців, які будуть воювати пліч-о-пліч з іспанськими ополченцями на захист свободи."
