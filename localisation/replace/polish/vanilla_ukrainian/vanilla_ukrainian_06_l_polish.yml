 SMB_air_defense:0 "[SMB_air_defense_key]"
 SMB_army_support_default_desc:0 "Армія не може перемогти, якщо по ній активно б'ють з неба. Саме тому, використовуючи наші ВПС не лише для захисту від таких дій, літаки також мусять бути значною мірою орієнтовані на те, щоби робити те ж саме проти наших супротивників."
 SMB_brown_water_navy_desc:0 "Річки, які протікають крізь джунглі Південної Америки, не використовуються нашими військовими належним чином. Ми розширимо наш річковий флот кількома невеликими штурмовими катерами, щоби допомогти нашим солдатам, коли вони знаходяться далеко від підкріплень чи постачання."
 SMB_enlarge_naval_facilities_default:0 "Збільшити морські об'єкти"
