 COG_children_of_woot:0 "Діти Вуут"
 COG_children_of_woot_desc:0 "Вуут — це надприродна істота, яка назвала тварин та інші живі істоти, а також була першим чоловіком і принесе цивілізацію. Ми — їхні діти і повинні діяти таким чином, щоб відповідати їхнім очікуванням."
