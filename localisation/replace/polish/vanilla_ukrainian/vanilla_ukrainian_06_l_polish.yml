 STAT_NAVY_HG_ARMOR_PIERCING_DESC:0 "Бронебійність важких гармат."
 SUBDOCTRINE_AERIAL_RECONNAISSANCE_DESC:0 "Найдавніша форма військової авіації — розвідка. У цю, як і в будь-яку іншу епоху, знання про те, де ворог і що він робить, може бути потужнішим за будь-яку зброю."
 SUBDOCTRINE_ALREADY_ASSIGNED:0 "§RThis Subdoctrine cannot be assigned to multiple tracks§!"
 SUBDOCTRINE_DESCRIPTION:0 "Через піддоктрину ми спеціалізуємося та вдосконалюємо наш підхід до ведення війни у конкретній галузі."
 SUBDOCTRINE_GUERILLA_WAR_DESC:0 "Виснажувати переважаючого ворога постійними низькорівневими атаками на його лінії комунікацій, підриваючи його волю до продовження боротьби. Уникати великих позиційних битв, щоб зберегти наші обмежені сили."
 SUBDOCTRINE_LONG_RANGE_ESCORT_DESC:0 "Неескортоване денне бомбардування ворожої території призведе до руйнівних втрат. Нам потрібні винищувачі з дальністю, щоб супроводжувати наші бомбардувальники до кінця і назад."
 SUBDOCTRINE_MASSED_CARRIER_FLEET_DESC:0 "Як і на суходолі, успіх у морському бою залежить від концентрації якомога більшої ударної потужності в єдиній вирішальній точці. Розділення породжує поразку."
 SUBDOCTRINE_NAVAL_GUNFIRE_SUPPORT_DESC:0 "Щойно ворожий бойовий флот буде нейтралізований, наші важкі морські гармати можуть звернути свій гнів на сухопутні цілі, підтримуючи наші війська на березі."
 SUBDOCTRINE_RANGERS_2_DESC:0 "$rangers_jungle_training_desc$"
 SUBDOCTRINE_SCREEN_TORPEDO_PRIMACY_DESC:0 "Акцент на агресивних, зухвалих торпедних атаках есмінців замість оборонного прикриття, щоб виснажити ворожу лінію бою перед основною сутичкою."
