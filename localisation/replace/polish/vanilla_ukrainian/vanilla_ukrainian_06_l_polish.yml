 WTT_build_support_in_hainan_desc:0 "§W§H[591.GetStateMajorityCountryName]§! має §Hбільшість в області§! й отримує [?591.state_political_support_value|+0] §Hбалів політичної підтримки§!, поки інша країна не отримає більшу §Hмісцеву підтримку§!\n\n§HМісцева підтримка§!:\n[591.GetLocalStateSupport_CHI][591.GetLocalStateSupport_PRC][591.GetLocalStateSupport_GXC][591.GetLocalStateSupport_YUN][591.GetLocalStateSupport_SHX][591.GetLocalStateSupport_XSM][591.GetLocalStateSupport_SIK]§!"
