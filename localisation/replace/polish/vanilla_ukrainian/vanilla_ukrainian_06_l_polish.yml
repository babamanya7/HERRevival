 JUNO_brazil_events.131.desc:0 "[FROM.GetNameDefCap] виконав своє зобов'язання перед Організацією американських держав, прийшовши нам на допомогу під час цієї безпрецедентної ситуації. Сподіваємося, всі інші члени візьмуть приклад з них."
 JUNO_brazil_events.137.b:0 "Їхні законні власники — це ми."
