 INS_tac_bomber_equipment_0:0 "Martin B-10 WH-1"
 INS_timor_issue_scripted_desc_issue:0 "Східний Тімор вочевидь є законною індонезійською територією, і хоча революція закінчилася, він все ще перебуває під колоніальним пануванням. Ми надішлемо ультиматум [721.OWNER.GetName] з вимогою негайної передачі Східного Тімору."
 INS_volksraad_events.30.desc:0 "[INS.GetLeader] схвалив петицію Фольксрааду про скасування системи квот на освіту в [INS.GetNameDef], щоб покласти край тривалим суперечкам у Фольксрааді щодо її впровадження та справедливості. Її було відправлено [HOL.GetLeader] на остаточне затвердження."
