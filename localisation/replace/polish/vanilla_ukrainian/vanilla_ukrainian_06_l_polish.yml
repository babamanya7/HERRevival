 uk_waves_focus_desc:0 "[Root.GetBritanniaRulesTheWavesDesc]. MМи не мусимо заспокоюватись і покладатися лише на кількість та якість окремих кораблів."
 unfortunate:0 "Дуже жаль."
 united_polynesia_fascism:0 "Полінезійська імперія"
 upgrade_commando_training_desc:0 "§LХоча наш відділ зазвичай займається більш делікатними аспектами війни, найчастіше для виконання операцій потрібен невеликий загін важкоозброєних бійців. Навчивши всіх своїх агентів бойовим прийомам командос, ми підвищимо їх ефективність в диверсійних операціях, знизимо ймовірність виявлення ворожою контррозвідкою та поліпшимо здатність захоплювати шифрувальне обладнання противника.§!"
 upgrade_crypto_strength_desc:0 "§LКоди та шифри показали себе найефективнішим способом розвитку та захисту нашої зарубіжної шпигунської мережі. Урядовий штаб зв'язку присвятив себе створенню нових складних методів шифрування, які не зможе зламати супротивник.§!"
 upgrade_psycho_warfare_desc:0 "§LПропаганда — потужний інструмент забезпечення наших ідеологічних інтересів у нашій же державі, але жоден засіб не зрівняється в ефективності з поширенням жахливих чуток про ворожий режим і наслідки його приходу в країну. Навчивши наших агентів співпрацювати з антиідеологічними, ми зможемо набагато ефективніше поширювати власну ідеологію у світі...§!"
 usa.13.t:0 "Рузвелт помер"
 usa.24.d:0 "[SOV.GetNameDefCap], натхненник, який переконав багатьох у тому, що повалення капіталізму можливе, зрадив міжнародну революцію та приєднався до Нацистської Німеччини. Між соціалізмом в одній країні та цим союзом з фашистами люди починають сумніватися в щирості комуністичних ідеалів у всьому світі. Чи є американський комунізм лише ще одним інструментом, який [Root.GetLeader] використовував для консолідації влади?"
 usa.30.desc:0 "Кожні два роки третина місць у Сенаті та всі місця в Палаті представників підлягають виборам. Незважаючи на те, що місцева ситуація в кожному виборчому окрузі часто затьмарена світовими подіями, іноді вона може мати значення.\n\nПісля підрахунку всіх голосів фракція підтримки уряду [USA.GetSenateElectionOutcome] у Сенаті та [USA.GetHouseElectionOutcome] у Палаті представників."
 usa.65.c:0 "Запевніться, що це не пошириться."
 usa_congress_elections_tt_bad:0 "На виборах до Конгресу фракція, яка підтримує уряд, зіткнеться з сильнішою опозицією.\n"
 veteran_air_instructors_spirit:0 "Інструктори-ветерани"
 viceroy_emeritus_tt:0 "\nЯкщо §HЛорд Галіфакс§! є лідером нашої країни, ефекти автономії з цього фокусу будуть подвоєні."
