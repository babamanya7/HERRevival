 SOV_expand_the_red_fleet_desc_alt:0 "[GetSovietArmyAdjectiveBasedOnIdeology]ий флот жалюгідно слабкий у порівнянні з флотами інших великих держав. Ми мусимо зробити його розширення національним пріоритетом!"
 SOV_factory_worker_militias_state_modifier_tt:0 "\nОбласний модифікатор §Y$SOV_factory_worker_militias_raised$§!:\n   $MODIFIER_LOCAL_RESOURCES_FACTOR$: §R-50.00%§!\n   $MODIFIER_LOCAL_FACTORIES$: §R-100%§!\n   $MODIFIER_LOCAL_ORG_REGAIN$: §G+10.00%§!\n   $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5.0%§!\n"
 SOV_finish_the_five_year_plan_desc_alt:0 "П'ятирічні плани радянського режиму надавали пріоритет інтенсивній індустріалізації країни над усім іншим, до такої міри, що це стало одним з найбільших символів більшовицького гноблення. Ми мусимо викорінити цей проєкт і розробити новий національний план індустріалізації."
 SOV_formalize_of_the_soviet_republic_of_sinkiang_only_once_tt:0 "Це рішення можна активувати лише раз.\n§gШІ однозначно прийме цю пропозицію.§!"
