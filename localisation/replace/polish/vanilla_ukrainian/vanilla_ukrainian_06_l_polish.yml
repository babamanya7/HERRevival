 RAJ_extend_indian_security_zone_desc:0 "Розширення нашої зони безпеки захистить кордони Індії та просуне її владу в регіоні. Розширюючи наш вплив, ми забезпечуємо стабільність та захист, необхідні для безпечної та суверенної нації."
