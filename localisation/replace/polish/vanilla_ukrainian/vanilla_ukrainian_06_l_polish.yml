 NSB_poland_communist_events.201.a:0 "Чудово."
 NSB_poland_communist_events.3.b:0 "Це неприйнятно."
 NSB_poland_communist_events.301.a:0 "Як шкода."
 NSB_poland_communist_events.402.desc:0 "[From.GetLeader] відмовляється приймати державу [Root.GetNameDef] до складу СРСР, стверджуючи, що [Root.GetLeader] \"не готовий\" до такого кроку. Така офіційна причина, але багато хто підозрює, що справа у німецьких амбіціях щодо Польщі."
 NSB_poland_democratic_events.1.t:0 "Питання лідерства"
 NSB_poland_events.201.desc:0 "Сьогодні можна припустити, що всі претенденти на угорський трон разом втратили свої права, оскільки [Root.GetLeader] відтепер стає королем Угорщини. Тепер, коли [Root.GetLeader] править відразу і Угорщиною, і Польщею, [Root.GetAdjective] претензії на гегемонію на Балканах стають цілком реальними."
 NSB_poland_events.301.desc:0 "[From.GetNameDef], як не дивно, погоджується укласти формальний союз із державою [Root.GetNameDef]! Раніше [Root.GetNonIdeologyName] і [From.GetNonIdeologyName] були непримиренними тепер, дві нації можуть стати союзниками і спільно боротися з екстремістською ідеологією, що набирає силу.\nТе, що почалося з Акту 5 листопада, в якому німці погодилися зробити [територію незалежним королівством, тепер стало союзом історичної значимості, відомим."
 NSB_poland_monarchist_events.2.a:0 "Ну що ж..."
 NSB_poland_royal_election.3.b:0 "Який такий Павло?"
 NSB_polish_fascist_events.1.a:0 "Навіщо вторгатися, якщо вони готові самі здатися нам?"
 NSB_soviet_atomic_bomb_project.1.desc:0 "Один із наших агентів, упроваджених в іноземні програми вивчення ядерних технологій, повернувся до нашого посольства з великою кількістю надсекретних документів на різні теми. У них є все, від проєктів центрифуг до розмірів боєголовок. Ці дані, без сумніву, будуть дуже цінними для розвитку нашої власної програми ядерного озброєння."
 NSB_soviet_atomic_bomb_project.2.desc:0 "Один із наших агентів, упроваджених в іноземні програми зі створення ядерної зброї, був сьогодні затриманий при спробі покинути закритий науковий комплекс. При обшуку в його сумці виявилися секретні документи. На жаль, він, очевидно, зізнався, що працює на нас, оскільки сьогодні нашого посла викликали на термінову консультацію та надали йому докази."
 NSB_soviet_civil_war_common.001.desc_exiles:0 "Комуністичний режим упав. Наші переможні війська контролюють столицю. Народ нарешті вільний від червоної тиранії. Нова Росія виросте на уламках старої, зруйнованої двома громадянськими війнами і роками зловживання владою."
 NSB_soviet_civil_war_common.106.t:0 "Таємна допомога в обмін на нафтові родовища Баку"
 NSB_soviet_civil_war_common.129.a:0 "Обов'язок необхідно виконати"
 NSB_soviet_communist_civil_war.003.a:0 "Нас поведе Бухарін."
 NSB_soviet_fascist_tsarist.11.desc:0 "Нам стало відомо, що [FROM.GetNameDef] значно розширює свою морську інфраструктуру на Далекому Сході. Це не віщує нічого доброго для статус-кво, що склався там..."
 NSB_soviet_fascist_tsarist.13.desc:0 "Нам повідомляють, що [FROM.GetNameDef] значно розширює свою військову інфраструктуру на Камчатці. Військові аналітики вважають, що це може використовуватися лише для посилення [FROM.GetAdjective] тиску на наші війська на Алясці, і як плацдарм для вторгнення!"
 NSB_soviet_fascist_tsarist.18.desc:0 "[FROM.GetNameDef] повідомляє нам, що цього разу вони не бачать вигоди у союзі з нами."
 NSB_soviet_fascist_tsarist.32.desc:0 "При останньому відступі противника наші війська взяли в полон високопоставленого [SOV.GetAdjective] генерала. Цей генерал, Андрій Власов, оголосив про свій «антибільшовизм» і тепер пропонує підняти кілька дивізій полонених росіян на бій зі «сталінізмом» — пліч-о-пліч з нами."
 NSB_soviet_foreign_politics_events.271.t:0 "[FROM.GetNameDefCap] погоджується з нашою пропозицією"
 NSB_soviet_foreign_politics_events.278.t:0 "[FROM.GetAdjectiveCap]а військова допомога"
 NSB_soviet_foreign_politics_events.281.t:0 "[FROM.GetNameDefCap] приймає нашу допомогу"
 NSB_soviet_paranoia_system_events.24_paranoia_both_increase_tt:0 "£SOV_paranoia_text_icon Політична параноя підвищується, виходячи з рівня не підданих чистці командувачів військової частини: §R[?SOV.SOV_combined_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.28.b:0 "Вони просто роблять з мухи слона своїми звинуваченнями."
 NSB_soviet_propaganda_capmaign_events.3.desc:0 "Війна, що вибухнула, поставила нас у скрутне становище. Хоч більшість і згідно з тим, що ми — постраждала сторона, і гнів громадськості справедливо спрямований за загарбників, багато хто таємно запитують: чому [THIS.GetLeader] це напад? З органів повідомляють, що в деяких випадках люди заходять навіть далі і стверджують, що [THIS.GetLeader] «або небезпечно наївний, або злочинно некомпетентний»."
 NSB_soviet_spanish_civil_war.6.a:0 "Революція переможе і в Росії!"
