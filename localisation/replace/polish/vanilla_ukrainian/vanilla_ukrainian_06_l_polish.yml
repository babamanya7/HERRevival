 iceland_events.15.desc:0 "На щастя, [FROM.GetAdjective]ий уряд зрозумів наші потреби та схвалив наш запит на територіальну компенсацію. Держава [ROOT.GetName], безумовно, повинна буде у відповідь виплатити невелику суму державі [FROM.GetName], але зараз це несуттєво."
 iceland_events.17.a:0 "Зараз у нас є більш невідкладні справи"
 iceland_events.26.desc:0 "З наших нафтопереробних заводів повідомили, що в околицях держави [ICE.GetName] закінчилася нафта. Усі запаси вичерпано, нових родовищ нафти або газу не передбачається, і подальша робота буде лише марною тратою ресурсів."
 iceland_events.9.desc:0 "Наші переговори з [FROM.GetAdjective]им двором принесли плоди. Принцу Кнуду запропонували ісландську корону, і він її прийняв."
 idea_INS_volksraad_desc:0 "Фольксраад — це рада, створена Нідерландами у 1918 році в рамках системи «Етичної політики», метою якої було створення системи напівдемократії, де могли б бути представлені різні етнічні меншини та культури архіпелагу. Хоча теоретично вона має демократичний характер, генерал-губернатор і нідерландська корона мають безумовне право вето."
