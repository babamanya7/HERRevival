 ITA_anti_air_equipment_1_short:0 "Breda Mod. 35"
 ITA_aquila_magna_tt:0 "§Y1 крило стратегічних бомбардувальників§! стане активним у області [2.GetName]."
 ITA_armored_effort:0 "Розвиток бронетехніки"
 ITA_ascari_create_units_tt:0 "Буде створено до §Y10 [ROOT.GetFlag][ROOT.GetAdjective]их§! колоніальних підрозділів у підконтрольних областях Африки та до §Y3 [ROOT.GetFlag][ROOT.GetAdjective]§! колоніальних підрозділів у кожному суб'єкті Африки."
 ITA_atlantic_fleet_desc:0 "Щойно ми вирвемося з британської клітки, нам доведеться поширити свою владу за океан. Це мусить бути нашим головним пріоритетом."
 ITA_banda_carita_desc:0 "Війна — це не завжди славетна справа. Хоча громадськість може зосередитися на бойових діях на фронтах, ми знаємо, що тил не менш важливий, і що викорінення опору в тилу так само необхідне."
 ITA_bop_slander_the_duce:0 "£BoP_left_texticon Обмовити дуче"
 ITA_cantiere_navale_di_ancona:0 "Cantiere Navale di Ancona"
 ITA_capo_supremo:0 "Capo Supremo"
 ITA_christian_democracy:0 "Християнська демократія"
 ITA_cv_CAS_equipment_3:0 "Breda Ba.201bis"
 ITA_desertions_east_africa_tt:0 "Армії в Східній Африці страждають від дезертирства."
 ITA_destroyer_3_desc:0 "Есмінці класу «Ciclone» були призначені як торпедні катери, але насправді були радше ескортними міноносцями. Вони були дещо збільшеними версіями попереднього класу «Orsa», водотоннажністю понад 1100 тонн, мали покращену остійність і важче протичовнове озброєння."
 ITA_develop_somaliland_desc:0 "На перший погляд, Африканський Ріг не має великого економічного чи стратегічного потенціалу. Але за допомогою кількох вдало застосованих інвестицій ми можемо перетворити цей регіон на плацдарм для подальшого просування в Індійський океан."
 ITA_efficient_supply_lines:0 "Ефективні лінії постачання"
 ITA_european_democracies_desc:0 "Ми мусимо продовжувати політику солідарності та співробітництва між демократичними європейськими країнами. За допомогою дипломатії ми можемо сформувати потужний альянс, здатний протистояти будь-якому іншому."
 ITA_expanded_corporatism_modifier:0 "Розширений корпоративізм"
 ITA_fortification_effort_forts:0 "Додати §Y15 наземних укріплень§! на французькому кордоні.\n"
 ITA_fronte_militare_clandestino_spawn_divs_hostile_rome_tt:0 "Створити §Y1 піхотні§! дивізію й §Y1§! дивізію §Yополчення§! в області §Y[This.GetName]§!.\n\n"
 ITA_giacomo_acerbo:0 "Джакомо Ачербо"
 ITA_giulio_paggio:0 "Джуліо Паджо"
 ITA_hardened_irregular_bands:0 "Загартовані нерегулярні банди"
 ITA_head_of_the_national_committee:0 "Голова Національного комітету"
 ITA_industrial_socialization_desc:0 "Настав час експропріювати великі фабрики з рук великих бізнесменів і буржуа, щоби їх можна було використати на благо всього італійського народу."
 ITA_italian_annecy_name:0 "Анессі"
 ITA_italian_hegemony_master_1_desc:0 "Як батьківщина фашизму, наша мета зрозуміла; щоби стати його захисником і поширити його далеко й широко. Ми будемо прищеплювати почуття обов'язку та вірності фашистській системі кожному народу, який потрапить під нашу гегемонію."
 ITA_la_battaglia_per_la_terra:0 "La Battaglia per la Terra"
 ITA_liberation_or_death_ns:0 "$ITA_liberation_or_death$"
 ITA_macchi_organization:0 "$macchi$"
 ITA_missiolini_strengthen_heavy_industry:0 "Програма індустріалізації"
 ITA_mobilize_the_railway_guns_desc:0 "Відчайдушні ситуації вимагають відчайдушних заходів; прийшов час повернути в дію наші старі залізничні гармати."
 ITA_modernize_the_mezzogiorno_desc:0 "Південь Італії був проблемною дитиною відтоді, як ми стали єдиною країною. Але з нашим прагненням стати панівною державою в Середземномор'ї, весь цей невикористаний потенціал мусить бути мобілізований."
 ITA_mussolini_side:0 "$ITA_benito_mussolini$"
 ITA_mussolini_took_over_minister_of_justice_flag:0 "Минуло §Y365 днів§! відтоді, як §Y[ROOT.ITA_benito_mussolini.GetName]§! очолив Міністерство юстиції\n(наразі минуло [?ITA_mussolini_took_over_minister_of_justice_flag:days|Y0])"
 ITA_papal_faction:0 "Католицький домініон"
 ITA_partisan_republics_spawn_divs_tt:0 "Створити §Y1§! дивізію §Yополчення§! в щонайбільше §Y5 повністю контрольованих осердних землях§!.\n\n"
 ITA_pioneer_in_atomic_research_flag:0 "§Y[ROOT.GetNameWithFlag]§! є однією з перших трьох країн, які дослідити технологію §Y$atomic_research$§!"
 ITA_power_balance_lost_core_4:0 "$ITA_power_balance_lost_core_1$"
 ITA_pressure_government_active_flag:0 "Наразі тисне на інший уряд"
 ITA_raid_category_fluff_text_nuclear_raids:0 "§LКоролівські ВПС Італії (Regia Aeronautica)§!"
 ITA_reggianes_exports_desc:0 "Компанія «Reggiane» розробила серію досить потужних винищувачів, які привернули увагу іноземних військових, які прагнуть модернізувати свої військово-повітряні сили. Якщо ми дозволимо їм експортувати свої літаки, досвід, отриманий від модифікації базової конструкції під різні специфікації, без сумніву, буде дуже цінним для наших власних проєктів розвитку."
 ITA_regio_esercito_3_dynamic_modifier_desc:0 "$ITA_regio_esercito_dynamic_modifier_desc$"
 ITA_ship_armor_bc_2:0 "250-мм пояс/100-мм палуба"
 ITA_ship_armor_cruiser_1:0 "70-мм пояс/50-мм палуба"
 ITA_spreading_the_eagles_wings_desc:0 "Навколо нас руйнуються та зазнають поразки інші ідеології. Здавалося б, лише фашизм витримав натиск цих бурхливих подій і навіть процвітає. Наш обов'язок — принести цю стабільність і іншим народам; принести їм промінь світла в ці темні часи!"
 ITA_spreading_the_eagles_wings_tt:0 "Отримає ціль війни §YМаріонетка§! проти §Yкожної несоюзної сусідньої країни в Європі§!:"
 ITA_steel_industry_in_terni:0 "Сталева промисловість у Терні"
 ITA_tomislav_of_croatia:0 "Томіслав II, король Хорватії"
 IVO_democratic_DEF:0 "Республіка Кот-д'Івуар"
 JAN_democratic:0 "Ян-Маєн"
 JAP_allied_civilian_administration_integration_tt:0 "Розблоковує рішення: §YІнтегрувати цивільні адміністрації наших суб'єктів§!, що дозволить нам §Yанексувати§! наших §Yмаріонеток§!"
 JAP_anarcha_feminist:0 "Анархо-феміністка"
 JAP_army_expansion:0 "Розширення армії"
 JAP_army_expansion_desc:0 "Щоб збільшити чисельність наших збройних сил, ми мусимо знайти досвідчених офіцерів, здатних навчати солдатів мистецтву війни."
 JAP_army_smuggling_kwantung_army_units_to_the_home_islands_mission_tt:0 "IJA отримає §R3§! додаткові §Yкавалерійські дивізії§! на початку §YГромадянської війни§!"
 JAP_blanskspace_tt:0 "\n"
 JAP_broke_the_london_naval_treaty:0 "Порушили Лондонський морський договір"
 JAP_challenge_the_zaibatsus_desc:0 "Найбільші корпорації в нашій країні мають безпрецедентну політичну та економічну силу. Слід нагадати їм, що вони є підданими імператора та виконують його волю."
 JAP_cruiser_ship_engine_1:0 "«Brown-Curtis» 51 000 к. с. н. в."
 JAP_currently_spreading_pro_japanese_sentiments_flag:0 " Наразі підтримує прояпонські настрої в країні"
 JAP_demobilize_the_boeitai:0 "Демобілізувати Боейтай"
 JAP_develop_suiyuan_steel_deposits:0 "Розвиток залізних родовищ у Суйюані"
 JAP_develop_the_yen_bloc_desc:0 "Ми повинні зробити подальший наголос на економічних аспектах Великої східноазійської сфери співпроцвітання. Економіки Азії мають бути інтегровані, і всі повинні прийняти єну як свою валюту. Цього можна досягти, продовжуючи розвиток японсько-маньчжурсько-китайського єнового блоку, водночас вдосконалюючи його."
 JAP_double_leaf_society_idea:0 "Плоди Товариства подвійного листа"
 JAP_east_asia_co_prosperity_sphere_dm:0 "Дай Тоа Кьоейкен"
 JAP_embrace_kokutai:0 "Прийняття Кокутай"
 JAP_empower_the_shogun_desc:0 "Імператор повинен залишатися в більш церемоніальній ролі, маючи сильних посередників, які діють від його імені. Це, безумовно, дозволить слову Імператора лунати далі й ширше."
 JAP_enact_religious_organizations_law_desc:0 "Щоб спрямувати увагу нашого народу на правильні речі та забезпечити його непохитну підтримку в прагненні до [ROOT.GetAdjective]ої долі, ми повинні оприлюднити закон, який дасть державній владі контроль над усіма релігійними організаціями в країні."
 JAP_establish_kingdoms_of_annam_and_cambodia_decision:0 "Створити королівства Аннам і Велика Камбоджа"
 JAP_expand_the_metropolitan_police_desc:0 "Ми точно знаємо, що цивільна поліція — це боєздатна група, яка твердо стоїть на нашому боці й не підконтрольна військовим. Вони допомогли нам повалити фракцію Кодоха, і вони можуть допомогти нам ще раз, відновивши порядок у цій хаотичній ситуації."
 JAP_fighter_equipment_0_short:0 "Type 91"
 JAP_form_the_jikyoku_iinkai_desc:0 "Для кращого контролю над нашим імпортом та експортом до та з [USA.GetNameDef], а також для спроби переконати [USA.GetAdjective]ий народ стати на наш бік, а не на бік [CHI.GetNameDef], ми повинні створити Японський комітет з торгівлі та інформації."
 JAP_form_the_ldp_desc:0 "Тепер, коли Ріккен Сейюкай забезпечила собі контроль і над парламентом, і над кабінетом міністрів, настав час реформувати її в більш ефективний керівний орган. Дотримуючись директиви Ічіро Хатоями, настав час створити Ліберально-демократичну партію, спрямовану на управління країною в осяжному майбутньому."
 JAP_found_the_boeitai_tt:0 "Відкриває можливість вербувати §Yополчення Добровольчого бойового корпусу§! на Японських островах"
 JAP_heavy_ship_engine_1:0 "«Brown-Curtis» 40 000 к. с. н. в."
 JAP_heavy_tank_destroyer_equipment_2:0 "Type 5 Ho-Ri"
 JAP_ichioku_isshin_desc:0 "Як говорить одне з гасел Тайсей Йокусанкай, [ROOT.GetAdjective]ий народ — це справді «Сто мільйонів, одне серце». Хоча наші люди є індивідуальними підданими Імператора, всі вони стоять разом як єдине ціле, їхні серця і розуми єдині."
 JAP_incorporate_buddhist_socialism_desc:0 "Іноуе Шютен і Ґіро Сеноо запропонували теорії впровадження соціалізму, засновані на принципах буддизму, і розглядають їх як схожі концепції, оскільки обидві прагнуть забезпечити трансформацію особистої свідомості, щоб покласти край людському відчуженню та егоїзму. Ми повинні запросити цих мислителів до нашого руху."
 JAP_industrial_investment_for_oil_decision:0 "Перемістити промисловість до §Y[FROM.CONTROLLER.GetNameDef]§! в обмін на §Yнафту§! з §Y[FROM.GetName]§!"
 JAP_influence_tibetan_people_decision:0 "Впливати на [TIB.GetAdjective]ий народ"
 JAP_intervene_in_china_desc:0 "[Root.GetNameDefCap] страждає від нестачі ресурсів, чого не можна сказати про наших сусідів. Ми мусимо силою отримати те, що нам необхідно. Для цього нам потрібна нагода. З цим можуть допомогти кілька заповзятливих солдатів, після чого Імператор не матиме іншого вибору, крім як погодитися на війну, хоч би як погано ми були до неї підготовлені."
 JAP_invest_in_senbu_desc:0 "Наші організації Сенбу, що часто діють у формі шкіл, медичних бригад та центрів розподілу продовольства, є різновидом операцій психологічної війни, спрямованих на умиротворення місцевого населення на окупованих територіях. Наразі вони довели свою ефективність в умиротворенні Маньчжурії, і, можливо, нам слід розширити їхню діяльність на решту Китаю."
 JAP_japanese_armor_doctrine_blankspace_tt:0 "[GetJapaneseArmorDoctrineBlankSpace]"
 JAP_japanese_supremacy_faction:0 "Японська сфера"
 JAP_kayaba_industry_organization:0 "$kayaba_industry$"
 JAP_kodoha_the_emperor_cooperated_flag:0 "§YІмператор Шьова§! вирішив співпрацювати з Кодоха"
 JAP_ldp_leader:0 "Лідер Джімінто"
 JAP_lifetime_employment:0 "Довічне наймання"
 JAP_mechanized_equipment_1:0 "Type 1 Ho-Ki"
 JAP_mobilizing_the_proletariat:0 "Мобілізація пролетаріату"
 JAP_national_army_dm:0 "Національна армія"
 JAP_naval_faction_demands_more_carriers_and_battleships:0 "$JAP_naval_faction$ вимагає більше авіаносців та лінкорів"
 JAP_new_naval_estimates_desc:0 "Нам потрібно оцінити розміри нового збільшеного флоту, щоби розрахувати кількість верфей, необхідних реалізації програми."
 JAP_organize_underground_resistance:0 "Організувати підпільний опір"
