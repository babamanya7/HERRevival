 GER_rapid_army_expansion_desc:0 "Наша армія більше не зростає такими темпами, як раніше, після необхідних змін. Усе ще потрібно мати велику армію, щоб захистити народ у дедалі ворожішому світі. Масова мобілізація та кампанія з підготовки мають вирішити цю проблему."
 GER_re_ratify_the_locarno_treaty_desc:0 "Локарнські договори були підписані 1925 року, й передбачали нормалізацію відносин з боку Антанти та гарантії територіальної цілісності в Європі. Попри те, що їх сприймали як утиск для нас, краще буде скасувати помилку Гітлера й підтримати ці домовленості."
