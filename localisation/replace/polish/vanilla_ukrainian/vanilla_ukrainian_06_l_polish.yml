 GRE_metaxism_4_desc:0 "$GRE_metaxism_desc$"
 GRE_metaxism_focus_desc:0 "Король — незаперечний глава держави, але грецький народ не зовсім задоволений таким станом справ. Нехай це і не ідеальне рішення, але є один дуже талановитий і відданий колишній офіцер, який чекає, щоб утворити уряд..."
