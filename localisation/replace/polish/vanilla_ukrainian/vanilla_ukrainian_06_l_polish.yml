 sp_naval_modern_carrier_unique_reward_b_desc:0 "Авіаносці є беззаперечними володарями морських битв, однак ми маємо забезпечити їм належний захист та безпеку. Що повинно стати нашою головною турботою?"
 sp_naval_nuclear_submarine_preference_a:0 "Зекономити"
 sp_nuclear_bomb_espionage_threats_reward_increase_security:0 "Посилити безпеку"
 sp_nuclear_bomb_espionage_threats_reward_increase_security_tt:0 "Посилена безпека знижує ризик крадіжки відомостей."
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward:0 "Теоретичний прорив"
 sp_nuclear_design_choice_reward_desc:0 "Намагаючися спроєктувати реактор, ми мусимо вибрати, який матеріал використовувати в якості сповільнювача. Від цього буде залежати конструкція всього реактора. Ми можемо використати важку воду або графіт, кожен із яких має свої переваги та недоліки..."
 sp_nuclear_generic_reward_option_industry_tech_name:0 "Удосконалені промислові дослідження"
 sp_nuclear_reactor_minor_explosion_reward_desc:0 "Під час роботи над останньою ітерацією прототипу ядерного реактора стався невеликий інцидент. Стався невеликий вибух, який пошкодив частину лабораторії, але пожежу, що виникла, вдалося легко загасити. Після того, як лабораторію буде відремонтовано, роботи зможуть продовжитися за планом, лише з невеликою затримкою."
