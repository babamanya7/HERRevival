 GER_medium_tank_destroyer_equipment_1:0 "Sturmgeschütz III"
 GER_medium_tank_equipment_1_short:0 "Panzer III"
 GER_mefo_bills_category_desc:0 "Щоби фінансувати нашу зростаючу військову промисловість і зберегти цю таємницю від британських і французьких очей, ми були змушені використовувати балансову структуру для переспрямування платежів у формі векселів. Якщо ми не використаємо наші політичні зв'язки для продовження термінів сплати цих банкнот, ми будемо змушені погасити їх і більше не отримуватимемо їх."
 GER_mefo_bills_mission_tt:0 "Видайте продовження терміну дії §Yвекселів «MEFO»§! на шість місяців, щоби він набув чинності після закінчення поточної партії.\n\nВартість кожного продовження буде поступово зростати, поки не почнеться війна, після чого залежність від векселів буде припинена, а оплата відкладеться до закінчення війни.\n\n"
