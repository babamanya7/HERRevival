 election.6.d:0 "Політика в державі [Root.GetName] дедалі більше радикалізується. Якщо раніше партії, які підтримували [Root.GetAdjective]і демократичні ідеали та представницькі установи, користувалися широкою підтримкою, то на цих виборах усе більше виборців звернулися до політичних крайнощів. Партії, що перебувають у політичній середині, навіть якби вони вирішили відкинути свої розбіжності, більше не складають більшість. Щоб уникнути слабкого уряду меншості, у нас немає іншого вибору, окрім як співпрацювати або з фашистами, або з комуністами."
