 HOTJOIN_PENDING_REQUEST_BLOCK:0 "Не можна продовжити, поки розглядається запит на швидкий вхід. Спершу прийміть або відхиліть його."
 HQ_BRINK_OF_DEATH:0 "§RШтаб армії має менше $THRESHOLD|H%0$ бойової сили. Якщо його знищити, командувач армії може потрапити в полон.§!"
