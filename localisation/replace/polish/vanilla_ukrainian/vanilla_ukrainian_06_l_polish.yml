 germany.108.t:0 "Смерть Рудольфа Гесса"
 germany.114.d:0 "Після нашої перемоги в [Root.GetAdjective]ій громадянській війні Німеччина повторно нагадувала нам про претензії на Данциґ. Також вона нагадувала нам, якими будуть наслідки непослуху для нації, яка ще відновлюється після внутрішнього конфлікту."
 germany.117.t:0 "Данциґська угода"
 germany.118.b:0 "Ми не можемо кооперуватись із державою [yalta_partner.GetNameDef]."
 germany.118.t:0 "Ялтинська конференція"
 germany.119.d:0 "Війна проти держави [GER.GetNameDef] підходить до свого неминучого кінця, і держава [yalta_origin.GetNameDef] звернулася до нас щодо проведення конференції на тему майбутнього Європи.\n\nВони пропонують розділити державу [GER.GetNameDef] на східну й західну частини. Це дозволить поширити нашу сферу впливу вглиб Європи, що відкомпенсує частину втрат у цій жахливій війні."
 germany.12.a:0 "Відмінно."
 germany.120.d:0 "Наша конференція на тему майбутнього Європи провалилася.\n\n[yalta_partner.GetLeader] ясно висловився, що в післявоєнній Європі немає потреби що-небудь планувати й організовувати співпрацю.\n\n«Ми зустрінемось, коли я придумаю свої вимоги державі [GER.GetNameDef] безпосередньо на мирній конференції. І я не хочу бачити жодних перешкод на шляху держави [yalta_partner.GetNameDef]»."
 germany.43.a:0 "Дурні! [GER.GetLeader] має бути задобрений!"
 germany.45.d:0 "Вимоги німців про передачу нашої Судетської області стали більш ворожими, і тепер їхні війська збираються на нашому кордоні! Зараз у Мюнхені проводиться конференція з обговоренням майбутнього Чехословаччини, куди нас, щоправда, не запросили.\n\nБоягузи-британці відмовилися підтримувати наш суверенітет, але принаймні Франція готова допомогти! Вони покинус альянс Британії та сформували новий із нами, обіцяючи підтримку Чехословаччині проти німецької агресії."
 germany.46.b:0 "Ми ніколи не здамося!"
 germany.51.t:0 "Перший Віденський арбітраж"
 germany.56.d_2:0 "Після анексії Чехословаччини Німеччина має намір приєднати Богемію до Райху, але залишити для нас Словаччину. Чи погодимося ми на цей розподіл? Це означатиме приєднання до військового альянсу Німеччини."
 germany.68.t:0 "Франція відмовляється поступатися"
 germany.72.d:0 "Війська SS і лояльні дивізії швидко прибули та захопили всіх командирів-зрадників, і Гітлер особисто провів чистку своїм вірним Люґером. Дивом фюрер пережив напад, обійшовшися лише кількома легкими ранами.\n\nВиживші змовники дорого заплатять за свою нелояльність, і тепер Гітлер ще більш рішучий у доведенні війни до славної перемоги!"
 germany.77.a:0 "Вони так не сильно знизили цей ризик."
 germany.78.d:0 "Як було передбачено в договорі з Німеччиною, деякі спеціальні дослідницькі проєкти діляться з нашими інженерами своїми знахідками. Увагу привернув нещодавній прорив у області радарних технологій, що відкрив неочікувані можливості для просунення наших досліджень у даній галузі."
 germany.82.d:0 "Держава [From.GetNameDef] відмовилася від нашої щедрої пропозиції словацьких територій в обмін на Данциґ, залишивши його собі. Ясно, що [From.GetLeader] не поділяє нашу позицію щодо Данциґа як законної німецької території.\n[Root.GetLeader] розлючений такою відповіддю, а всі дипломатичні варіанти повернення Данциґа вже вичерпані."
 germany.86.b:0 "Данциґ лишиться Ґданськом!"
 germany.96.a:0 "Ця війна не буде довгою."
