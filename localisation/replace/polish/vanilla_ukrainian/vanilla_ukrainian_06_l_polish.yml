 NORDIC_second_institution_desc_dem:0 "ми можемо мати законодавчий орган, який представлятиме виборців наших націй і матиме виконавчі повноваження діяти швидко в умовах війни"
 NOR_a_new_norway_desc:0 "Норвезький народ нарешті звільнився від ярма капіталу, і цей факт потрібно відобразити, коли наша нова країна набуває форми. Більше олігархи та магнати не будуть диктувати напрямок розвитку країни, відтепер народ Норвеґії відповідальність за їхнє майбутнє. За нову Норвеґію та за її межами!"
 NOR_adding_prep_communist_TT:0 "Загальна підтримка [NOR.GetName] нашої революції зростає на $RIGHT|0G$."
