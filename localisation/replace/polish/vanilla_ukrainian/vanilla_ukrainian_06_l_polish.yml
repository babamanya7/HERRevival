 HUN_army_maneuvers_desc:0 "Нам потрібно привести свої збройні сили у форму в очікуванні можливих збройних конфліктів у майбутньому. Ми організуємо маневри, які дозволять нам виробити нові тактики та стратегії."
 HUN_assassinate_horthy_desc:0 "Наразі старий адмірал має надто велику владу як регент Угорського королівства. Його позиція щодо комунізму створює серйозні ускладнення для наших товаришів. Щоб наша нація змогла прийти до революції, його потрібно позбавити влади доступними методами."
 HUN_boost_hungarian_aviation_industry_desc:0 "Нам необхідно зміцнити промислову базу, щоб мати можливість виробляти нові моделі літаків у достатніх для завоювання панування у повітрі кількостях."
