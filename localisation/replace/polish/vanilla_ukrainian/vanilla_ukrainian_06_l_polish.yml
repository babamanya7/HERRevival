 CZE_albrecht_franz:0 "Альбрехт Франц фон Габсбург-Лотринґен"
 CZE_align_nationalist_parties_desc:0 "Хоча ми повинні намагатися апелювати до всіх [ROOT.GetAdjective]их народів, не можна заперечувати, що традиційні чеські націоналістичні партії є найвпливовішими на політичній арені, і саме з ними нам найлегше заручитися підтримкою."
 CZE_align_with_germany:0 "Зблизитися з [GER.GetNonIdeologyName]"
 CZE_an_industrial_legacy:0 "Промислова спадщина"
 CZE_anti_rearmament_propaganda_idea:0 "$CZE_anti_rearmament_propaganda$"
 CZE_austro_hungary_puppets:0 "Кожен §Yсуб'єкт§!, який підпадає під вимоги фокусу"
 CZE_bop_army_readiness_of_power_category:0 "Чеська армія єдина і готова протистояти майбутнім викликам. Однак внутрішня політика та міжнародні події можуть підірвати впевненість армії в тому, що вона здатна належним чином захистити країну."
 CZE_build_the_slapy_reservoir:0 "Побудувати Слапське водосховище"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc:0 "Армія постала з попелу австро-угорських чеських підрозділів та ветеранів Чехословацького легіону. Спадщина обох досі впливає на управління армією."
 CZE_coalition_building_idea:0 "Створення коаліції"
 CZE_consolidate_mining_operations_desc:0 "Наші гірничодобувні операції можна було б краще оптимізувати, якби адміністрації цих компаній були об'єднані для підвищення ефективності. Це дозволило б зробити їхні дослідження та зусилля з розширення існуючих шахт більш ефективними."
 CZE_cruiser__catchup_1:0 "Прорив крейсерів"
 CZE_current_skoda_max_optimization_tier_tt:0 "$CZE_current_skoda_max_optimization_tier_start_tt$ [?skoda_max_optimization_tier|G0]"
 CZE_demand_the_istrian_peninsula_desc:0 "Те, що [ROOT.GetNameDefCap] не має виходу до моря, занадто довго було перешкодою для нашої торгівлі та впливу. Ми більше не можемо миритися з тим, що наша економіка перебуває на милості сусідніх країн, і повинні вимагати доступу до Адріатики."
 CZE_divide_nation_title_dynamic_tesinko_poles:0 "$MUN_czech.1032.t$ у регіоні [72.GetName]"
 CZE_doctrinal_innovation_desc:0 "Обмін кадрами та стратегічні наради з союзниками багато чому нас навчили. Об'єднавши різноманітні точки зору, ми опинилися на межі прориву."
 CZE_doctrine_bonus_2_desc:0 "Сила армії — не тільки у зброї; важливу роль відіграють і ефективні доктрини. Військово-технічний інститут висунув кілька пропозицій щодо зміни поточного стану."
 CZE_economic_investment_in_state_modifier:0 "Зусилля з економічного інвестування"
 CZE_emil_linhart:0 "Еміл Лінгарт"
 CZE_establish_air_defense_zones_enable_tt:0 "Активує: §Y«Зони протиповітряної оборони»§!"
 CZE_exchange_technology:0 "Співпрацювати в дослідженнях"
 CZE_fortify_the_crossroads_with_slo_desc:0 "Будь-яку систему укріплень можна прорвати. Щоб запобігти цьому, ми можемо побудувати опорні пункти навколо наших найважливіших міст, щоб ворог, який прорве наші лінії, не зміг їх легко захопити."
 CZE_heavy_tank_equipment_2_short:0 "TT vz. 40"
 CZE_increase_skoda_max_optimization_tier_var_tt:0 "$CZE_modify_skoda_works_ns_intro_tt$ Максимальний £GFX_prod_eff_cap §Wрівень оптимізації§!: §Y+1§!"
 CZE_industrial_subsidies:0 "Промислові субсидії"
 CZE_infantry_equipment_3_short:0 "ZK 412"
 CZE_legacy_of_the_kriegsmarine_desc:0 "Допомагаючи будувати великі лінкори не так давно, ми досі маємо всі можливості для цього. Це спадщина тих самих заводів, які допомагали розбудовувати австро-угорський Кріґсмаріне."
 CZE_light_tank_destroyer_equipment_3_short:0 "T-1D"
 CZE_light_tank_equipment_2:0 "LT vz. 35"
 CZE_mend_balkan_relations:0 "Налагодити відносини на Балканах"
 CZE_merged_consumer_good_plants:0 "Об'єднані заводи споживчих товарів"
 CZE_military_intelligence_desc:0 "Військова розвідка є одним із найважливіших аспектів розвідувального відомства. Виділення більшої кількості ресурсів на цю сферу принесе значні переваги."
 CZE_mio_trait_panzer_38t_chassis_conversion:0 "Конверсія шасі Panzer 38(t)"
 CZE_mio_trait_scam_facilities:0 "Завод у Мюлузі"
 CZE_mutual_protection_agreement_with_switzerland:0 "Договір про захист з [SWI.GetNonIdeologyName]"
 CZE_profit_off_the_spanish_civil_war_desc:0 "Громадянська війна в Іспанії стає проксі-війною великих держав. Ми не повинні ризикувати життями наших хоробрих солдатів, вплутуючись у такий конфлікт. Натомість це ідеальна можливість профінансувати розбудову нашої промисловості шляхом продажу зброї, можливо, навіть обом сторонам."
