 tfv_south_africa.95.d:0 "Звільнившися з-під влади колоніальних гнобителів, [GNB.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [GNB.GetAdjective]ого уряду."
 the_national_oath_category_desc:0 "Османській імперії судилося впасти, це було так само неминуче, як і необхідно. Коли в 1923 році нам довелося підписати Лозаннський мирний договір, ми втратили набагато більше, ніж розраховували. Вже давно настав час повернути вкрадене у нас."
