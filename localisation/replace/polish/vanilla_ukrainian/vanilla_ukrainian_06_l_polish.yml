 NOR_communist_preparation_decisions_category_desc_trostkyist:0 "Настав час народам [NOR.GetName] прислухатися до вчень Маркса та Троського та підготуватися до неминучого зіткнення, яке перетворить нашу націю на вістря комунізму в Скандинавії.\n\nПриймімо ж вогонь і сірку перманентної революції. Об'єднаймо ж країну проти капіталістів у Осло.$NOR_revolution_support_counter$"
 NOR_convert_merchant_ships:0 "Конвертувати торгові судна"
 NOR_crackdown_on_civilian_life_desc:0 "Немає часу на неквапливі заняття. Війна тут, і в ці нові часи це означає, що війна може бути лише тотальною, щоб не закінчитися смертю та ганьбою для нашого режиму. Цивільне життя має бути обмежено на користь служіння батьківщина."
