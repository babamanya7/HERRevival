 basic_light_shell_desc:0 "Компроміс між бронепробиттям і вибуховою силою. Цей снаряд здатний пробити тонку броню легких кораблів і завдати значно більших пошкоджень."
 bba_news.100.desc_some_purged:0 "Деякі з найближчих прихильників Муссоліні були виключені з фашистської партії, оскільки [ROOT.GetLeader] посилює свій контроль над партією. Чистка не була такою суворою, як дехто побоювався, але залишає [ROOT.GetLeader] у сильнішій позиції для реалізації його власного порядку денного для Італії."
 bba_news.100.t_many_purged:0 "Велика чистка в лавах Національної фашистської партії"
 bba_news.102.desc:0 "[GetTrialOfMussoliniDesc]"
 bba_news.104.a:0 "Усе відповідно до плану."
 bba_news.108.b:0 "Монархія застаріла!"
 bba_news.109.a:0 "Тривожно!"
 bba_news.8.desc:0 "Цілком очікувано — держава [AFA.GetNameDef] погодилася на [ITA.GetAdjective]у вимогу підкоритися. Хоча [AFA.GetAdjective]ий уряд не покидав надії уникнути окупації, з часом ставало все зрозуміліше, що колоніальні держави в регіоні не прийдуть їм на допомогу, і навіть сусідня [ETH.GetName] не зможе виділити солдатів на підтримку. Зваживши похмурість ситуації, уряд підкорився [ITA.GetAdjective]ому тиску, щоби народ не поляг унаслідок зайвого кровопролиття.\n\n[ITA.GetAdjectiveCap]і війська тепере входять на землі малої держави, щоби зайняти позиції на кордоні з державою [ETH.GetNameDef]. Неясно, чи буде ця окупація довготривалою, і як вона вплине на [ITA.GetAdjective]ий конфлікт проти держави [ETH.GetNameDef]."
 beijing_winter_capital_name:0 "Ханбалик"
 betrayed_our_cause:0 "Зрадили нашу справу"
 bftb_bulgaria_balkan_federation.15.a:0 "Тоді ми захопимо ці землі силою!"
 bftb_bulgaria_balkan_federation.15.t:0 "[ITA.GetNameDefCap] відмовляється віддавати балканські землі"
 bftb_bulgaria_equipment_purchases.4.a_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_fighter]§! од. §Yвинищувачів§!"
 bftb_bulgaria_factions.40.desc:0 "Заради популярності націонал-соціалістичний рух наслідує методи болгарського Союзу молодих національних легіонів: він організував ходу від стільного міста [Root.Capital.GetCapitalVictoryPointName] до міста [GetMarchDestinationName].\nПодобно вимагали вживання ще жорсткіших заходів придушення і викорінення більшовиків, створення національного синдикату робітників проти класової боротьби і активнішого втручання держави в болгарську економіку та суспільні питання. цим якнайшвидше."
 bftb_bulgaria_factions.49.desc:0 "В останні кілька тижнів поліція відловлювала залишки націонал-соціалістичного руху, який, втративши керівництво після недавньої черги арештів, помітно послабшав і розгубився.\nМожна впевнено заявити, що націонал-соціалістів більше немає в державі [ROOT.GetNameDef], і від цього наша країна та уряд тільки виграють."
 bftb_bulgaria_factions.51.a:0 "Чудова новина!"
 bftb_bulgaria_factions.60.desc:0 "Ми завдали серйозного удару по широким соціалістам і заарештували тих, хто, згідно з повідомленнями, був неодноразово помічений у підбурюваннях до протестів і заколотів."
 bftb_bulgaria_factions.62.desc:0 "Ми спробували завдати широким соціалістам рішучого удару, але зазнали нищівної поразки. Поліція сліпо вломилася в передбачуване місце таємної зустрічі широких соціалістів з робочими союзами і комуністами, де вони, за чутками, займалися. широкі соціалісти справді були в зазначеному місці, вони просто слухали лекцію Тодора Павлова про діалектичний матеріалізм, і поява поліції виявилася ефектною, але неефективною."
 bftb_bulgaria_fatherland_front.1.desc_positive:0 "Плоди нашої самовідданої праці дозволять нам принаймні об'єднати багатьох політичних та ідеологічних суперників у єдиний фронт проти намірів пронімецької військової диктатури в Болгарії.\nМи організували Вітчизняний фронт, інтегрували тільки широких соціалістів, аграріїв та інші фракції, які нині протистоять засиллям у країні буржуазії, готової без вагань принести нашу батьківщину в жертву власному благополуччю."
 bftb_bulgaria_fatherland_front.2.t:0 "Вітчизняний фронт завдає удару!"
 bftb_bulgaria_german_influence.1.desc_first_donation:0 "Щоби відродити [ROOT.GetAdjective]і військово-повітряні сили та зміцнити зв'язки"
 bftb_bulgaria_german_influence.3.desc:0 "[BUL.GetAdjectiveCap]е верховне командування ввічливо відхилило нашу пропозицію пожертвувати [ROOT.GetAdjective]і літаки для зміцнення [BUL.GetAdjective]их ВПС. Політики заявили, що в даний час [BUL.GetName] в [ROOT.GetAdjective]у політику, і державі треба зосередитись на розвитку власної, [BUL.GetAdjective]ої авіації."
 bftb_bulgaria_german_influence.3.t:0 "[BUL.GetNameDefCap] відмовляється від нашої допомоги"
 bftb_bulgaria_german_influence.4.b:0 "З чого нам потурати капризам німців?!"
 bftb_bulgaria_nationalization.3.t:0 "[FROM.GetNameDefCap] виключає нас із альянсу [FROM.GetFactionName]"
 bftb_bulgaria_rearmament.5.a:0 "Давайте покінчимо з цим."
 bftb_bulgaria_rearmament.6.desc:0 "Після напружених переговорів у Софії ми і [ENG.GetNameDef] підписали угоду про зняття [ENG.GetAdjective]им урядом обмежень з наших збройних сил."
 bftb_bulgaria_rearmament.7.t:0 "[BUL.GetNameDefCap] наполягає на знятті обмежень на свою армію"
 bftb_bulgaria_soviet_influence.2.desc:0 "Сьогодні [GetBulgarianLeaderToMeetStalin] повернувся з міста [ROOT.Capital.GetName], де він і [SOV.GetLeader] обговорювали договір про взаємодопомогу між державами [SOV.GetNameDef] і [ROOT.GetNameDef] довгих переговорів щодо умов та заходів, які необхідно буде вжити урядам держав-учасниць, обидві сторони підписали угоду."
 bftb_bulgaria_tsar_boris.1.t:0 "Цар Боріс III відвідує [GetDestinationName]"
 bftb_bulgaria_tsar_boris.3.desc:0 "Настав час призначити членів регентської ради, яка буде правити державою [ROOT.GetNameDef] від імені спадкоємця Боріса, Сімеона II.\n\nМи мусимо вибрати найбільш підхожих кандидатів із лав царської сім'ї та вищого політичного й військового класу; але вибирати треба розсудливо, бо в кожного з них є свої прихильники, а наша країна вже зазнала лиха та розорення, викликаних рішеннями її лідерів в минулому..."
 bftb_bulgarian_claims.2.a:0 "Таку угоду складно буде поліпшити!"
 bftb_bulgarian_claims.8.desc:0 "[FROM.GetAdjectiveCap]ий уряд підтвердив, що [ROOT.GetNameDef] отримує адміністративний контроль над областю [FROM.FROM.FROM.GetName]. Ми починаємо миротворчу місію і незабаром розмістимо гарнізон, який зможе тільки зберегти порядок і стабільність у регіоні, а й захистити його від будь-яких намірів ворога."
 bftb_bulgarian_claims.8.t:0 "[FROM.GetNameDefCap] передає контроль над областю [FROM.FROM.FROM.GetName]"
 bftb_greece.103.t:0 "Генералів-венізелістів потай повернули до Греції!"
 bftb_greece.166.b:0 "Цього разу інвестицій не буде..."
 bftb_greece.17.desc:0 "Більшість присутніх делегатів вирішила, що [FRA.GetNameDef] не мусить отримати території в Курдистані після успішного повалення [TUR.GetAdjective]ої держави. [FRA.GetAdjectiveCap]і представники спершу хотіли повністю залишити конвенцію, назвавши те, що відбувається фарсом, але потім вирішили залишитися і зберегти можливість впливати на те, що відбувається, навіть якщо їм і не обіцяли нічого."
 bftb_greece.180.c:0 "Нас узагалі не цікавлять [FROM.GetAdjective]і справи!"
 bftb_greece.189.a:0 "Нас тепер чекають ще гірші біди."
 bftb_greece.207.t:0 "НСГ влаштовує переворот!"
 bftb_greece.213.desc:0 "Ці розпусні [FROM.GetAdjective]і злодії вирішили втекти з грошима! Ми старанно вирощували цей борг десятиліттями, а у них вистачає нахабства називати його незаконним? Якщо вони думають, що можуть безкарно обманювати нас, вони жорстоко помиляються — їх чекають наслідки! Хоча, звичайно, не можна не визнати, що ми часом виявляли надмірний ентузіазм, спочатку відкриваючи державі [FROM.GetNameDef] кредит, а потім нараховуючи відсотки за прострочення."
 bftb_greece.223.desc:0 "Більшість присутніх делегатів вирішила, що [ENG.GetNameDef] має отримати вірменський протекторат, вирізаний із території поваленої держави [TUR.GetName]. [ENG.GetAdjectiveCap]і представники високо відгукнулися про делегатів за їх мудрість державних справах та передали [ENG.GetAdjective]ому уряду доручення про планування встановлення своєї адміністрації в регіоні."
 bftb_greece.230.desc:0 "[FROM.GetNameDefCap], як і було обіцяно, приєднується до нас у війні з державою [TUR.GetNameDef]. Разом ми скинемо [TUR.GetAdjective]у державу."
 bftb_greece.231.a:0 "Боягузи!"
 bftb_greece.51.b:0 "Ми можемо виділити їм матеріальну допомогу."
 bftb_greece.63.a:0 "Нам дві заявки на вступ, будь ласка!"
 bftb_greece.65.desc:0 "Схоже, що тепер все стало на свої місця, як шматочки головоломки. Зміна режиму в Берліні була несподіваною і змусила багатьох сумніватися в майбутньому нашої нації. Завдяки пропозиції, що надійшла до нас із Афін, це майбутнє стало трохи більш ясним.\n\nСхоже, що [FROM.GetNameDef] і [TUR.GetNameDef] хочуть утворити довгий стратегічний альянс із нашим урядом. З іншого боку, хто сказав, що на них не поширюються інші наші амбіції?"
 bftb_greece.7.desc:0 "Справа нарешті дійшла до перегляду Севрського та Лозаннського договорів з великими державами Європи та повторного розгляду принципів Великої ідеї. Доля держави [TUR.GetNameDef] не може бути вирішена виключно нами, нам потрібно спочатку заручитися підтримкою держав [ENG.GetNameDef], [FRA.GetNameDef] та [ITA.GetNameDef] (будь вона проклята), якщо ми хочемо запросити на свою конференцію та їх."
 bftb_greece.8.desc:0 "Ми отримали цікаву пропозицію від держави [FROM.GetNameDef], яка, очевидно, хоче змінити межі держави [TUR.GetNameDef]. [FROM.GetNameDef] бажає влаштувати обговорення з європейськими державами, які перемогли у Великій війні, та змінити умови Севрського та Лозаннського мирних договорів, які ми намагалися зобов'язати дотримуватися держави [TUR.GetNameDef].\n\nПредставники держави [FROM.GetNameDef] запевняють наших представників, що перемога над державою [TUR.GetNameDef] матеріально вигідна нам і що Представники [FROM.GetNameDef] уряду наполягають: ця конвенція — лише для уточнення кордонів, не для реалізації реваншистських мрій."
 bftb_news.1.b:0 "Настав час знищити ВМРО!"
 bftb_news.13.c:0 "Виходить, [BUL.GetNameDef] тепер вступить до альянсу [SOV.GetFactionName]?"
 bftb_news.16.d:0 "Вони лише хочуть, щоб [ENG.GetLeader] захистив їх!"
 bftb_news.203.e:0 "Хм, нам слід допомогти [TUR.GetAdjective]ому народу в цій війні..."
 bftb_news.301.c:0 "Добре, добре, рвіть самі себе на частини!"
 bftb_news.4.t:0 "Повернення царя Фердінанда I"
 bftb_turkey.113.desc:0 "Задоволення потреб вільного ринку завжди було наріжним каменем політики кемалістів: якщо є попит, у когось знайдеться пропозиція. Деякі групи населення, переважно релігійні, вважають, що розумна культура споживання, яку розвиває [ROOT.GetNameDef], шкідлива.\n\nПо країні прокотилася хвиля протестів проти виробництва деяких продуктів, заборонених релігією, яку сповідує частина нашого суспільства. Нашу ідею про те, що світська держава, вони не поважають і, схоже, не Втім, можливо, простіше догодитиме натовпу, ніж розбиратися з міжусобицями серед народу."
 bftb_turkey.116.desc:0 "Жахливі новини з нашого гарнізону в області [TUR_fundamentalist_state.GetName]: страшна партизанська атака, підлаштована релігійними фундаменталістами, призвела до безлічі жертв. Втрати з обох боків значні, але бунтівники загрожують, що атаки наші війська не покинуть регіон.\n\nСумний той день, коли громадянин йде проти іншого громадянина через таку ефемерну річ, як віра, але цей день настав у нашій державі. Офіцерський корпус пропонує завдати повномасштабного удару у відповідь по бунтівникам, але деякі політики пропонують вирішити справу миром і тимчасово вивести війська, доки ситуація не вляжеться. Прийняти рішення буде непросто."
 bftb_turkey.117.desc:0 "З місць повідомляють, що релігійні фундаменталісти затопили регіон [TUR_fundamentalist_state.GetName] і підбивають населення повернутися до більш традиційного укладу, який, без сумніву, повністю протилежний ідеям світської держави. Харизматичні священики та енергійні лідери протестів главі руху, що схиляє регіон [TUR_fundamentalist_state.GetName] до своїх ідеалів, і методи несилового впливу поки не принесли помітних результатів. Регіон напевно опиниться в руках фундаменталістів, щоразу ми намагалися викликати в народі симпатії до секуляризму, але фанатики люто пручаються кожному кроці. Ми мусимо зробити вибір: або має право на власну думку, або уряд повинен вжити жорстких заходів і зруйнувати плани фундаменталістів."
 bftb_turkey.141.a:0 "Отже, так і буде."
 bftb_turkey.24.d:0 "Февзі Чакмак — той лідер, якого чекає [TUR.GetNameDef]."
 bftb_turkey.60.desc:0 "[FROM.GetLeader] написав різкий лист, в якому зажадав, щоб турецькому населенню сирійської провінції Хатай дали виконати їхнє демократичне право на референдум і можливість вирішити, чи хочуть вони приєднатися до держави [FROM.GetNameDef] або безстроково залишатися у складі держави [ROOT.GetNameDef] Наші збройні сили виявили незаконну діяльність на [ROOT.GetAdjective]о-[FROM.GetAdjective]ому кордоні: [FROM.GetAdjective] громадяни проникають на територію держави і провокують заворушення. що [FROM.GetNameDef] планує підтасувати результати референдуму так, щоби забезпечити [FROM.GetAdjective] перемогу, але, можливо, найрозумніше буде просто віддати провінцію Хатай державі [FROM.GetNameDef]. кордонів — не найкращий розвиток подій."
 bftb_turkey.62.a:0 "[FROM.GetNameDefCap] мусить зникнути."
 bftb_turkey.77.desc:0 "Ми стали жертвою жахливого та жорстокого повороту долі: [ENG.GetAdjective] та [GER.GetAdjective] уряди уклали союз! Нам дуже потрібна була підтримка альянсу [GER.GetFactionName], але віроломні [ENG.GetAdjective]і пси нас випередили!\n\nВ [ROOT.GetAdjective] історії настали чорні дні. Ми тепер одні, нам нікому допомогти, крім держави [TUR.GetAdjective], яка майже напевно злякається альянсу. І хіба можна його за це звинувачувати? Хто в здоровому глузді міг би противитися такому могутньому дуету? Чи варто навіть і пробувати?"
 bftb_turkey.77.t:0 "Англо-[GER.GetAdjective] альянс"
 bftb_turkey.83.t:0 "Повернення Турецької комуністичної партії"
 bftb_turkey.92.t:0 "[FROM.GetName] Підписує Саадабадський пакт"
 big_gun_club_spirit_desc:0 "Лінкори домінують не лише на морі, а й у політиці."
 bigfleet:0 "Великий флот"
 bio_pharma:0 "[INS_bio_pharma_name]"
 boost_party_popularity_active:0 "збільшує популярність партії в державі"
 boris_shaposhnikov:0 "$SOV_boris_shaposhnikov$"
