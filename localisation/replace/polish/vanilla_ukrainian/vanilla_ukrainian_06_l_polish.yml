 spain.5.d:0 "Спроба повалити Другу Іспанську республіку — це чіткий знак, що фашисти не дозволять квітам прогресу зацвісти навіть де вони природно вкорінюються. Республіканці та їхні союзники, суміш демократів, комуністів й анархістів, звернулися до нас та інших частин міжнародного суспільства по допомогу. Багато націй, що заявляють про захист демократії та свободи, втримали свою підтримку зі страху бути затягнутими у війну. Як нам відповісти?"
 spain.6.d:0 "Той факт, що ми організували ленд-ліз для Націоналістичної Іспанії, не залишився непоміченим. У випадку їхньої перемоги ми зможемо знайти в них сильного союзника, коли Іспанія буде відбудована."
