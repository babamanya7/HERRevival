 NOR_send_the_storting_home_desc:0 "Наш національний парламент давно зітхнув. Збереження його життя лише подовжить його страждання, і, відверто кажучи, наші також. Нехай політики повертаються додому та проводять час зі своїми сім'ями, люди Короля візьмуться за справу. їхні руки."
 NOR_sverre_riisnaes:0 "Сверре Рііснес"
 NOR_the_neutrality_guard_desc:0 "Інші можуть зловживати нашою нейтральною позицією, щоб отримати перевагу над ворогом і втягнути нас у війну з ним, якщо ми не зможемо захистити свої кордони. Спеціальна гвардія нейтралітету може гарантувати, що жодна іноземна воююча сторона не порушить нашу довіру."
