 LIT_invested_in_farms_desc:0 "Завдяки належним інвестиціям переважно аграрна економіка Литви перетворилася на користь держави: литовські культури підживлюють військову економіку, а належна інфраструктура сприяє швидкій мобілізації розрізнених фермерських громад по всій країні."
