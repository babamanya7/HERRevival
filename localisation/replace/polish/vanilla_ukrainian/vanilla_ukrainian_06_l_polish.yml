 FIN_infiltrate_soviet_commandos:0 "Проникнути радянських командос до Фінляндії"
 FIN_integrate_karelia_states_desc:0 "Карельська Республіка все ще не охоплює всі землі, населені карелами, і шляхом інтеграції області [FROM.GetName] до неї ми можемо спробувати вирішити ситуацію."
