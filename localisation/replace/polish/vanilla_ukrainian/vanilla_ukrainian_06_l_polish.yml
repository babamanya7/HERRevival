 RAJ_royal_indian_navy:0 "Королівський [ROOT.GetAdjective]ий флот"
 RAJ_special_operations_executive:0 "Управління спеціальних операцій"
 RAJ_special_operations_executive_desc:0 "Управління спеціальних операцій спеціалізується на нетрадиційних методах ведення війни, від саботажу до збору розвідувальних даних. Розширення його ролі в Індії надає нам інструменти для зриву ворожих планів та перетворення таємних операцій на стратегічні переваги."
 RAJ_strengthen_ties_with_british_investors_GOE_desc:0 "Ми зміцнимо зв'язки з британськими інвесторами, переконуючи їх інвестувати в наші підприємства, забезпечуючи їхні фінансові інтереси, поки ми боремося."
 RAJ_take_in_british_naval_experts_desc:0 "У нас вдома, у Великій Британії, є одні з найкращих військово-морських експертів у світі, залучити деяких сюди буде досить легко."
 RAJ_take_over_administrative_rights_desc:0 "Щоб граціозно вийти з регіону, [ENG.GetAdjective] уряд почав передавати адміністративні завдання нашим службовцям компанії."
 RAJ_tata_steel_dlc:0 "Tata Steel"
 RAJ_the_empires_workshop_desc:0 "Щоб забезпечити силу Імперії перед обличчям зростаючих глобальних потреб, ми поглибимо економічні зв'язки між [ROOT.GetNameDef] та [ROOT.OVERLORD.GetNameDef]. Скоординовані інвестиції та розширення фабрик по всій обох територіях перетворять нашу спільну промислову базу на єдиний, уніфікований двигун виробництва."
 RAJ_the_punjab_accord_desc:0 "Визнаючи унікальне становище сикхської громади та надаючи обмежену автономію в Пенджабі, ми посилимо споконвічний зв'язок лояльності та служби. Взамін їхня постійна підтримка підкріпить владу [ROOT.GetNameDef] у регіоні критичної важливості та забезпечить, що традиція та стабільність йдуть пліч-о-пліч."
 RAJ_the_riches_of_the_raj_targets_oil_tt:0 "Кожна стартова область з §Y$state_resource_oil$§!£resources_strip|1 :\n Додати виробництво §Y+4§!£resources_strip|1.\n Додати §G1§! §Y$infrastructure$§!."
