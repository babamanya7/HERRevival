 wtt_britain.24.t:0 "Пропозиція МакДоналда"
 wtt_china.1.a:0 "Разом ми сильніші!"
 wtt_china.1.desc:0 "Схоже, [From.GetLeader] вирішив нарешті поширити свою владу до далеких куточків Китаю. Представники центрального китайського уряду зажадали, щоби ми виконали наказ, який видав [From.GetLeader], інакше на зміну нам прийде лояльніший уряд."
 wtt_china_shared.10.a:0 "Ми мусимо підтримати їх, як тільки можемо."
 wtt_germany.1000.desc:0 "[From.GetAdjective]ий уряд вирішив підтримати наше прохання про повернення британських титулів перів та королівських титулів членам королівського сімейства та князівських родів Німеччини. Воно пропонує провести «королівську церемонію століття», на яку будуть особисто запрошені всі члени королівського сімейства Німеччини, і на якій їм урочисто повернуть титули, несправедливо відібрані два десятиліття.\n\nІмператорські радники пропонують членам великого королівського сімейства влаштувати грандіозну урочистість із демонстрацією останніх технічних досягнень Німеччини. Для такого випадку якнайкраще підійде надсучасний дирижабль «Гіндербурґ»."
 wtt_germany.38.desc:0 "[FROM.GetNameDefCap] останнім часом посилила свою войовничу риторику, спонукаючи нас повернутися до часів колоніалізму. Дипломатичними каналами німці зараз оприлюднили формальне прохання відновити оренду свого старого анклаву в Ціндао. Це, ймовірно, черговий нерівний договір із нашої епохи приниження, та, можливо, за його допомогою нам вдасться укласти вигідну угоду..."
 wtt_germany.49.t:0 "Вигнання нацистів стало серйозним випробуванням для області [nazi_state_withdrawn.GetName]"
 wtt_germany.51.a:0 "Так, частково відновити у становищі керівників-нацистів."
 wtt_germany.52.a:0 "Боротимемося за демократію!"
 wtt_germany.55.t:0 "Австрійський народ голосує за об'єднання"
 wtt_germany.58.a:0 "Ми мусимо поважати їхній вибір."
 wtt_germany.6.a:0 "Ніщо нас не зупинить."
 wtt_germany.60.desc:0 "Уряд Німеччини повідомив, що не може прийняти нашу пропозицію. Німці побоюються реакції у відповідь Радянського Союзу і бояться піти на ризик."
 wtt_germany.71.t:0 "Відновлення Австро-Угорської імперії"
 wtt_infiltration.10.desc:0 "Комуністична партія, зважаючи на все, замишляє щось грандіозне. Наша розвідка перехопила її кур'єрів з таємними наказами підготуватися до «революційної контратаки» усім їхнім основам, розкиданим країною. Для цього вони збирають війська та припаси. Можливо, йдеться навіть про загальнонаціональне повстання. Ми маємо негайно провести відповідну підготовку."
 wtt_japan.109.desc:0 "[From.GetNameDefCap] промацує настрої, намагаючись дізнатися, наскільки нас зацікавить пакт між нами, [JAP_initiator.GetAdjective]ою й [ITA_fascism.GetAdjective]ою державами. [JAP_initiator.GetAdjective]е керівництво стверджує, що в обстановці зростаючої світової ворожості до наших дій дуже важливо підтримувати одне одного."
 wtt_japan.109.t:0 "Японія пропонує укласти Троїстий пакт"
 wtt_japan.12.a:0 "Вони грають нам на користь."
 wtt_japan.40.desc:0 "Кілька днів тому уряд держави [From.GetNameDef] почало послідовний тиск на нас. Журналісти провідних видань у своїх статтях вимагають від нас повернути Маньчжурію під [From.GetAdjective]ий контроль. Це не просто пропаганда для внутрішнього вживання, оскільки представники лідера [From.GetLeader] дипломатичними каналами закликали нас укласти угоду про майбутнє маньчжурських територій.\n\nСьогодні із цього приводу висловився сам [From.GetLeader], зажадавши якнайшвидше повністю повернути Маньчжурію. Інакше його уряд буде змушений переглянути умови нашої співпраці."
 wtt_manchukou.2.desc:0 "[From.GetLeader] відправив посланця назад із особистою обіцянкою підкоритися і визнати, що [MAN.GetLeader] — справжній правитель Китаю."
 wtt_news.1.desc:0 "Несподіваний переворот Вермахту, очолюваний фельдмаршалом Авґустом фон Макензеном, сьогодні вранці спричинив громадянську війну в Німеччині. Фашисти, роялісти та демократи різних поглядів узяли в руки зброю та пішли проти своїх співвітчизників, а військові частини були відкликані з кордонів держави для зосередження на внутрішній загрозі.\n\nФашисти під командуванням Гітлера вже присяглися знищити державу, ніж віддати її в руки «німців-зрадників»."
 wtt_news.12.desc:0 "У відповідь рішення [GER.GetAdjective]ої влади повернути Вільгельма II [FRA.GetNameDef] та [Eng.GetNameDef] оголосили державі [GER.GetNameDef] війну. [FRA.GetAdjectiveCap]ий і [ENG.GetAdjective]ий уряди заявили про «кричущу впертість» [GER.GetAdjective]ого народу, який дозволив «відомому військовому злочинцю» знову стати на чолі своєї держави і тим самим загострили обстановку.\n\nПредставники цих країн стверджують, що дозволити «розпалювачу Великої війни» знову вдягнути [GER.GetAdjective]у корону — це вкрай аморально, і що [GER.GetAdjective]ий уряд проігнорував усі попередження. «У нас немає іншого вибору»."
 wtt_news.17.desc:0 "Японський уряд вирішив піти на поступки Німеччині, яка нещодавно зажадала передати їй її старий анклав у Ціндао.\n\nУ межах міста було негайно відновлено державний контроль із боку Німеччини."
 wtt_news.19.c:0 "Хитрий і підступний дипломатичний виверт!"
 wtt_news.23.b:0 "Вони не виконали свій обов'язок..."
 wtt_news.26.b:0 "Все одно ми збиралися згортати колоніальну політику."
 wtt_news.27.desc:0 "Група молодих офіцерів успішно скинула уряд і знову затвердила імператора як верховний правитель японської нації. Схоже, переворот став реакцією на передбачувану корупцію уряду та широке поширення ворожих ідеологій.\n\nМаючи імперську риторику, офіцери оголосили про проведення чисток, які продовжуватимуться доти, поки «з рядів збройних сил і уряду не будуть видалені всі неблагонадійні елементи». Сам імператор Хірохіто виступив із короткою заявою, погодившись взяти на себе верховне командування і давши зрозуміти, що він зацікавлений у примиренні з Китаєм та західними колоніальними державами, які мають володіння у тихоокеанському регіоні."
 wtt_news.37.d:0 "Вони все одно нічого не досягнуть."
 wtt_news.40.a:0 "Катастрофа!"
 wtt_news.40.g:0 "Великий удар по нашому союзнику..."
 wtt_news.41.a:0 "$wtt_news.40.a$"
 wtt_news.50.a:0 "Підла зрада!"
 wtt_news.6.t:0 "Австро-Угорщину відновлено"
 wtt_news.67.desc:0 "Після завоювання більшої частини Аравійського півострова [From.GetOldAdjective]ий уряд замислився про те, щоби скористатися панарабськими настроями, які поширилися в регіоні. Після силового усунення можливих заперечень із боку інших країн ідея об'єднання арабів набула реальних обрисів, і [From.GetOldAdjective]ий уряд уже довів свою готовність досягти цієї мети.\n\nЧи то потураючи сподіванням народу, чи бажаючи створити спільний дім для всіх арабів, чи просто сподіваючись прискорити інтеграційні процеси в регіоні, [From.GetOldAdjective]а влада підтвердила, що відтепер їхня країна називається «[From.GetNameDef]»."
 wtt_political_warlord_support.1.desc:0 "[asking_for_support.GetLeader] направив до нас свого представника, щоб дізнатися нашу думку про можливий політичний альянс. [asking_for_support.GetLeader] обіцяє не втручатися у наші внутрішні справи, якщо ми здобудемо перемогу у нинішньому раунді політичної боротьби. Перехід на чийсь бік може мати далекосяжні наслідки, оскільки інші партії, напевно, сприймуть цей крок як зраду."
 wtt_prc.20.t:0 "Китайська провокація"
 wtt_warlord_vs_prc.10.a:0 "[communist_china.GetLeader] не вартий того, щоби за нього вмирати."
 wtt_warlord_vs_prc.4.t:0 "[communist_china.GetNameDefCap] підкоряється"
 wtt_xian_incident.2.desc:0 "У супроводі невеликого ескорту [From.GetLeader] прибув до Сіану, щоб обговорити з нами поточну ситуацію. Він, безперечно, очікує від нас подальших кроків у боротьбі з комуністами. Але коли у нас під боком японська армія, ми маємо чітко висловити свою позицію."
 wtt_xian_incident.9.t:0 "$wtt_xian_incident.7.t$"
 wuw_GER_civil_war.1.b:0 "Хтось має за ними стежити"
 wuw_GER_civil_war.3.b:0 "Підтримаємо Залізний фронт"
 wuw_GER_diplomacy.104.a:0 "Чудово!"
 wuw_GER_diplomacy.3.a:0 "Їхня втрата."
 wuw_GER_diplomacy.52.desc:0 "[FROM.GetLeader] публічно виступив проти нашої пропозиції щодо морської співпраці, назвавши її спробою викрасти [FROM.GetAdjective] технічні секрети..."
 wuw_GER_diplomacy.57.a:0 "Ми не хочемо війни, доведеться погодитись..."
 wuw_GER_diplomacy.86.t:0 "[FROM.FROM.GetNameDefCap] передає території в нашій сфері впливу"
 wuw_GER_diplomacy.98.b:0 "Їм не можна довіряти."
 wuw_GER_diplomacy.99.a:0 "Прекрасно"
 wuw_GER_german_politics.02.t:0 "Лідер для народу"
 wuw_GER_legions.7.a:0 "Вони знадобляться для придушення опору"
 wuw_GER_monroe.13.desc:0 "Ми отримали звіт, що [GER.GetAdjective] активність у регіоні зростає. Вочевидь, робляться спроби дестабілізувати Доктрину Монро, а згодом — повністю її скасувати."
 wuw_GER_monroe.6.b:0 "Ми залишимося нейтральними"
 wuw_GER_news.2.d:0 "Будемо сподіватися, що цього разу удача буде на їх боці"
 wuw_GER_realpolitik.21.t:0 "[FROM.GetNameDefCap] приймає наші вимоги"
 wuw_GER_realpolitik.41.a:0 "Вони втрачають шанс..."
 wuw_GER_realpolitik.42.t:0 "[FROM.GetNameDefCap] запрошує нас до альянсу"
 wuw_GER_realpolitik.56.desc:0 "Хоч це й не стало несподіванкою, але нерозумний [FROM.GetLeader] з [FROM.GetNameDef] привів війська до бойової готовності після отримання нашого ультиматуму й заявив, що не відступить ні на крок."
 wuw_GER_realpolitik.57.a:0 "Нам доведеться це прийняти"
 wuw_GER_realpolitik.63.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] звернувся з пропозицією створити митний союз, який лише зміцнить економіки обох держав. Звучить як угода, від якої важко відмовитися, чи не так?"
 wuw_GER_reichskommissariats.1.desc:0 "Ми встановили нову цивільну адміністрацію в Бельгії та Північній Франції. Тепер ми маємо визначити не лише роль нашого нового суб’єкта, а й того, хто очолить регіон і втілюватиме нашу політику. Призначити німецького рейхскомісара чи скористатись місцевим колаборантом?"
 wuw_GER_reichskommissariats.10.a:0 "Окремий рейхскомісаріат"
 wuw_GER_reichskommissariats.2.desc:0 "Ми встановили нову цивільну адміністрацію в Нідерландах..."
 wuw_GER_reichskommissariats.23.b:0 "Її слід включити до Північної Америки"
 wuw_GER_releasable.1.desc:0 "З реформуванням німецької держави багато наших політиків вважають, що необхідно переглянути вибір столиці. Вони стверджують, що нинішнє місто не відповідає титулу «Столиця німецького народу». У такому разі, куди ми хочемо перенести нашу столицю?"
 wuw_GER_releasable.2.a:0 "П'єр Дюпонг бере кермо влади"
 wuw_GER_weltpolitik.17.t:0 "[FROM.GetNameDefCap] погоджуються на поділ сфер впливу"
 wuw_GER_weltpolitik.18.desc:0 "Ми отримали відповідь від [FROM.GetAdjective], що вони не визнають нашу сферу впливу. Щодо своєї, вони заявили, що вирішуватимуть самостійно, без нашої участі. Це може призвести до напруги в регіоні."
 wuw_GER_weltpolitik.20.t:0 "[FROM.GetNameDefCap] передає свої [ANG.GetAdjective] території"
 wuw_GER_weltpolitik.8.a:0 "Ідеально"
 wuw_GER_weltpolitik.9.desc:0 "[BEL.GetLeader] з [BEL.GetNameDef] вирішив протистояти нашим вимогам, заявивши, що [BEL.GetAdjective] армія буде боротись до останнього за Конґо. Вони не знають, із ким зв’язались."
 wuw_HUN_a_bulwark_against_communism_desc:0 "Більшовицька загроза вже зайшла занадто далеко, і якщо ніхто не спинить її, вона лише посилиться. Ми повинні стати щитом людства, аби захистити світ від цієї зарази!"
 wuw_HUN_a_responsible_government:0 "Відповідальний уряд"
 wuw_HUN_a_revolutionary_greater_hungary:0 "Паннонський соціалістичний союз"
 wuw_HUN_act_of_defense:0 "Закон про оборону"
 wuw_HUN_attempt_economic_independence:0 "Спроба економічної незалежності"
 wuw_HUN_carrying_on_arpads_legacy:0 "Продовжити спадщину Арпада"
 wuw_HUN_elections_in_the_revolutionary_council_desc:0 "Після завершення громадянської війни настав час провести вибори до революційної ради, яка контролює перехід країни до республіки. Комуністичні кандидати мають перевагу, але можливо демократія ще має шанс?"
 wuw_HUN_end_the_regency_desc:0 "Горті добре правив країною як регент, та час обрати нового короля. Це може бути Габсбург або кандидат, який влаштує Малий Антанту. Нам потрібна нова монархія."
 wuw_HUN_heirs_of_the_huns:0 "Спадкоємці гунів"
 wuw_HUN_incorporate_the_hungarian_life_movement:0 "Інтегрувати Рух Угорського Життя"
 wuw_HUN_invest_in_universal_education_desc:0 "Народ керує державою, а без належної освіти він не знатиме, як це робити. Ми маємо інвестувати в безкоштовну освіту для всіх, щоб кожен [ROOT.GetAdjective] був освіченим і голосував свідомо."
 wuw_HUN_join_the_allies_desc:0 "Майбутнє Угорщини та її демократичних цінностей пов’язане з великими західними демократіями та їх альянсом. Ставши членом цього союзу, ми зможемо посилити його, а також розраховувати на їхню підтримку."
 wuw_HUN_join_the_comintern:0 "Приєднатися до Комінтерну"
 wuw_HUN_news_events.3.c:0 "Вони продовжують нашу спадщину"
 wuw_HUN_news_events.6.desc:0 "Шукаючи короля, [HUN.GetAdjective]и офіційно коронували Йосифа Августа фон Габсбурга — останнього палатина Угорщини, архікнязя Австрії, принца Угорщини і Богемії, а також фельдмаршала колишньої австро-угорської армії. Сьогодні, у великій урочистості, його короновано королем Угорщини.\nЯк Вітез і аристократ з династії Габсбургів, новий король одразу заявив, що 'поверне Угорщині велич, якої вона заслуговує, не порушуючи договорів, що розпустили Австро-Угорську імперію'. Також він пообіцяв 'скасувати несправедливості, які ми пережили'. Ймовірно, ця коронація не призведе до зменшення напруження в регіоні."
 wuw_HUN_news_events.9.a:0 "Знову у правильних руках"
 wuw_HUN_proclaim_greater_hungary_core_states_requirement:0 "Усі початкові угорські області повністю під контролем"
 wuw_HUN_reverse_the_risorgimento:0 "Скасувати Рісорджименто"
 wuw_HUN_the_old_habsburg_king:0 "Старий Габсбурзький король"
 wuw_HUN_the_turan_40_tt:0 "\nПісля дослідження технології §Y$improved_medium_tank_chassis$§!:\n"
 ww_BEL_event_diplomatic.19.t:0 "[FROM.GetNameDefCap] Відмовляє"
 ww_BEL_event_diplomatic.23.t:0 "[FROM.GetNameDefCap] Запрошує нас до їхніх дослідницьких зусиль"
 ww_BEL_event_diplomatic.4.t:0 "[FROM.GetNameDefCap] Чинить опір!"
 ww_BEL_event_diplomatic.6.b:0 "Ми не можемо дозволити собі ще одного ворога зараз."
 ww_BEL_event_political.5.desc:0 "Те, що почалося як звичайне призначення, переросло в ще одну політичну кризу для нашого уряду. Прем'єр-міністр повинен був призначити нового члена до Королівської академії медицини, і він запропонував Адріана Мартенса для розгляду. Однак цей вибір виявився суперечливим через фламандський націоналізм Мартенса та його співпрацю з німецькими окупантами під час Великої війни. Цей вибір зазнав жорсткої критики від ветеранів, лібералів, франкомовних бельгійців, і навіть король висловив своє невдоволення. \n\n[BEL.GetLeader] спробував захистити цей вибір, але на нього чинився все більший тиск. Його опоненти закликають до дострокових виборів для обрання нового лідера, хоча Спак, ймовірно, має достатньо політичного капіталу, щоб відстояти свою позицію."
 ww_BEL_event_political.8.t:0 "Мова народу"
 ww_BEL_event_war.2.t:0 "Невідомі симпатії"
 ww_BEL_event_war.3.a:0 "Це воля короля!"
 ww_BEL_event_war.5.a:0 "Майбутнє невизначене."
 ww_congo.25.desc:0 "Бельгійський міністр колоній Альбер де Влішауер, близький союзник П'єра Рікманса, вирішив поїхати за кордон, щоб лобіювати підтримку від наших нових союзників, оскільки ситуація виглядає критичною, а політики на континенті відмовляються діяти. Можливо, завдяки його допомозі ми зможемо знайти вигідні угоди?"
 ww_congo.37.desc:0 "[FROM.GetAdjective] дипломати звернулися до нас з пропозицією миру. Пропозиція залежить від нашої згоди відмовитись від претензій на [?COG.COG_disputed_colony.GetAdjective] території, яку ми втратили від [FROM.GetNameDef] під час цього конфлікту. Дипломати також стверджують, що на відданих територіях [?COG.COG_disputed_colony.GetAdjective] будуть проведені вибори нового уряду. Наскільки незалежними будуть ці вибори, ще неясно."
 ww_congo.5.t:0 "[COG.GetLeader] хоче збільшити виробництво їжі в Конґо"
 ww_congo.51.a:0 "Ми сильніші разом!"
 ww_congo.53.b:0 "Ні, ми не погодимося!"
 ww_congo.55.b:0 "Ми їм покажемо!"
 ww_congo.58.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], відмовився передати нам території з великою кількістю руандійців. Як ми повинні відповісти на гноблення наших людей чужими державами?"
 ww_congo.60.t:0 "[FROM.GetLeader] погоджується на наш запит стати їх протекторатом"
 ww_congo.68.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], погодився приєднатися до Товариства з розвитку урану, яке ми їм запропонували, і їхня ядерна програма тепер може нарешті знову стати на правильний шлях, завдяки новоотриманому урану."
