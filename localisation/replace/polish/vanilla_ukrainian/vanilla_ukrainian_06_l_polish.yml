 GOE_RAJ_generals.1.desc:0 "[RAJ.GetLeader] попросив відправити [RAJ.GetAdjective] війська до [ENG.GetNameDefCap] для навчання британськими солдатами, і пропонує велику оплату за цю послугу."
 GOE_RAJ_generals.2.t:0 "[ENG.GetNameDefCap] приймає!"
 GOE_RAJ_loyalist.07.desc:0 "В ім'я захисту, [FROM.GetNameDefCap] пропонує передати [event_target:RAJ.RAJ_annexing_country_target.GetName] під [FROM.GetAdjective] адміністрацію для забезпечення розвитку її оборони. Хоча цей сценарій може бути не ідеальним з точки зору нашого суверенітету, ми можемо лише припустити, що це тимчасовий захід. Або принаймні, ми сподіваємося."
 GOE_RAJ_loyalist.10.t:0 "[FROM.GetNameDefCap] передає [event_target:RAJ.RAJ_annexing_country_target.GetName] під нашу адміністрацію"
