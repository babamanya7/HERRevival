 SWI_connect_to_the_maginot_line_desc:0 "Вітри війни дмуть у напрямку [FRA.GetName], і є хороші шанси, що її ворогам доведеться атакувати так звану лінію Масжино, це ставить нас у небезпечну ситуацію як [?SWI.SWI_biggest_fascist.GetNonIdeologyName] може виникнути спокуса обійти його, вторгнувшись до нас. Ось чому ми повинні координувати свої дії з [FRA.GetName] і створити єдиний фронт."
