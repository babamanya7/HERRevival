 SPQR_UNIFIED_democratic:0 "Римська республіка"
 SPR_anarchist_castille_communism:0 "Кастильська комуна"
 SPR_anarchist_spain_neutrality_ADJ:0 "Арагонсько-анархістськ"
 SPR_avenge_foreign_interference_tt:0 "Отримає цілі війни проти всіх країн, які надіслали добровольців націоналістам під час громадянської війни.\n"
 SPR_carlos_masquelet_lacaci:0 "Карлос Маскеле Лакасі"
 SPR_disband_the_army:0 "Розформувати армію"
 SPR_expand_soviet_aid_desc:0 "Ми не можемо впоратися з цією війною самі; ми повинні отримати міжнародну допомогу. [SOV.GetNameDefCap] має зрозуміти, що важлива боротьба з фашизмом відбувається тут, на Іберії, і що саме тут слід зупинити їх просування."
 SPR_experiences_from_the_civil_war_desc:0 "Досвід наших військових під час громадянської війни призвів до драматичних нових досягнень у військовому мисленні та розвитку обладнання."
 SPR_join_the_global_fight_against_fascism_desc:0 "Ми перемогли фашизм в Іспанії, але він все ще існує в інших країнах по всьому світу. Наш обов'язок — довести цю боротьбу до кінця."
 SPR_modernize_the_armed_forces_desc:0 "Наша слабка позиція на заході Європи була б значно зміцнена розробкою нової зброї та обладнання для наших збройних сил."
 SPR_oppose_the_communists_desc:0 "Комуністи — не що інше, як необхідний союзник у боротьбі з фашизмом. Коли це закінчиться, ми повинні впоратися з ними по-своєму."
 SPR_plant_the_seeds_of_revolution_desc:0 "Ті, хто має почуття, схожі на наші, давно змушені замовкнути їхні репресивні уряди. Ми дамо цим групам необхідну зброю, щоб вони могли повалити свої країни зсередини та приєднатися до нашої справи, коли ми розгромимо наших ворогів і зв'яжемося з ними."
 SPR_purchase_aircraft:0 "Придбати літаки"
 SPR_red_bulwark_in_the_west_desc:0 "Наше географічне положення полягає в ізоляції від наших союзників. Якщо на нас нападуть, особливо сильні морські сили, ми не зможемо покладатися на допомогу від держави [SOV.GetNameDef]. Тому ми повинні переконатися, що наша оборона є такою, щоби ми могли діяти як бастіон соціалізму; її західний якір у Європі."
 SPR_reform_naval_council:0 "Реформена морська рада"
 SPR_republican_garrison_control_decisions_tt:0 "\nВідкриває рішення на карті §YРозширити контроль над гарнізоном§!, що дозволяє §Gпротидіяти§! §Yвпливу націоналістів§! у державах.\n\nДержави, в яких на момент початку громадянської війни немає §Rтотального§! над гарнізоном§!, вступлять у конфлікт під §Yуправлінням республіканців§!.\n"
 SPR_restore_higher_education_desc:0 "Постраждалі під час війни вищі навчальні заклади мають бути відновлені та розширені, забезпечуючи постійне надходження світлих умів у нашу галузь."
 SPR_revive_the_republican_navy:0 "Відродити Республіканський флот"
 SPR_ship_anti_air_1:0 "2cm/65 C/30"
 SPR_strengthen_the_euzko_gudarostea_desc:0 "Регіон басків має життєво важливу промисловість і має бути краще захищений. Розширення армії, сформованої місцевою владою, має значною мірою допомогти зміцнити тамтешню лінію фронту."
 SPR_the_future_of_the_republic:0 "Майбутнє республіки"
 SPR_wealth_redistribution_desc:0 "Тепер, коли майно заможних конфісковано, ми забезпечимо всім участь у цій перемозі шляхом перерозподілу цього багатства так, щоб усі серед населення однаково пожинали його плоди."
 SPY_ON_STANDBY:0 "Очікує накази"
 SSB_expand_road_and_rail_connections_desc:0 "Зі зростанням сили Саадабадського пакту неминуче, що ми побудуємо залізницю від Стамбула до Кабула, пов'язуючи нашу інфраструктуру разом."
