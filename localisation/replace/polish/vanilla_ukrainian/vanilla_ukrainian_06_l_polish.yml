 improved_submarine_snorkel_desc:0 "Поліпшена конструкція не дозволяє воді потрапляти всередину двигунів, а також знижує помітність для радарів.\n\nЦстановка цього модуля на §Yпідводні човни§! знижує їх §Yпомітність§!, завдяки чому їх складніше виявити."
