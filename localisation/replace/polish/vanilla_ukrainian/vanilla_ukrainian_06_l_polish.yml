 PAR_assasinate_rafael_franco_desc:0 "Якщо ми зможемо відрізати голову змії, це може різко знизити бойовий дух ворога. Ми зв'яжемося з місцевими дисидентами в Чако і надамо їм інструменти, щоб це було зроблено."
 PAR_communism_party:0 "РФП"
