 HUN_light_infantry_divisions_doctrine_desc:0 "Ми мусимо максимально ефективно використовувати особовий склад через його обмеженість. Щоби створити більше дивізій, потрібно зменшити їх чисельність. Легкі дивізії забезпечують оптимальне співвідношення ударної потужності та розміру. Вони стануть основою наших збройних сил."
