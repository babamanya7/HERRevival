 INS_arm_militias_tt:0 "Якщо почнеться громадянська війна, комуністи стартуватимуть із додатковими дивізіями."
 INS_army_located_tt:0 "§Y[HOL.GetNameDefCap]§! передислокує свої Збройні Сили до нас."
 INS_asian_trade_investments_desc:0 "Руйнівні наслідки Великої депресії показали нам, наскільки надмірною була наша залежність від наших довгострокових торговельних партнерів на заході. Оскільки наша економіка орієнтована переважно на експорт, зараз як ніколи важливо розвивати та розширювати нові ринки в Південно-Східній Азії, щоб наша економіка не залежала від якоїсь окремої країни."
 INS_aslia_cat:0 "Об'єднання Тихоокеанського регіону"
 INS_autonomy_knil_rank_limit:0 "Прийнято антидискримінаційні закони в армії"
 INS_autonomy_no_education_quotas:0 "Скасовано квоти на освіту"
 INS_chaos_events.1.b:0 "Накажіть припинити вогонь, ми не можемо ризикувати ескалацією."
 INS_chaos_events.4.desc:0 "Трагічний день спіткав Індонезію сьогодні. Сукарно зіткнувся з ще однією спробою вбивства, цього разу успішною. Ми не повинні дозволити, щоб з цього вийшла криза наступництва, порядок має бути відновлено швидко, інакше республіка розвалиться."
 INS_communist_events.10.a:0 "Ми повинні діяти обережно."
 INS_construction_focus_desc:0 "Іноземний капітал тече рікою, експортні доходи зростають, і вперше за багато років з'явилися реальні гроші для інвестування у вітчизняну промисловість. Ми повинні ловити момент і будувати, поки умови сприяють нам."
 INS_cost_text_oil_8_blocked:0 "£resources_strip|1 §R8§!"
 INS_dr_samsi_sastrawidagda:0 "Д-р Самсі Састравідагда"
 INS_dutch_events.3.a:0 "Ми знайдемо інший шлях посилити наш військово-морський вплив."
 INS_escalation_has_less_2_tt:0 "Рівень ескалації нижчий за §Y2§!"
 INS_establish_nefis_desc:0 "Ми створимо Службу розвідки сил Нідерландської Ост-Індії (NEFIS) спільно з Союзниками та розмістимо її в Австралії. Через неї ми будемо проводити таємні операції з метою саботажу японських окупаційних військ. Через кожну маленьку перемогу ми наближаємося до нашого повернення на батьківщину."
 INS_expanding_asian_trade_mission:0 "Розширення азійських торгових шляхів"
 INS_focus_time_reduce_pki_tt:0 "§Y$INS_utilize_tan_malakas_militia$§! скоротить час, необхідний для цього фокусу, на 35 днів."
 INS_great_depression_desc:0 "Хоча прямий вплив Великої депресії на Ост-Індію був незначним, подальша протекціоністська політика країн по всьому світу мала руйнівні наслідки для економіки Ост-Індії, яка залежить від постійного експорту сировини, такої як каучук і нафта."
 INS_heavy_fighter_equipment_2_short:0 "G.I Mercury"
 INS_industrial_events.4.d:0 "Ми можемо відкрити вугільні шахти в [FROM.FROM.GetName]"
 INS_instigate_chaos_medan_desc:0 "Ми співпрацюватимемо з місцевими націоналістами в Медані та Ріау, організовуючи страйки, заворушення та радикалізуючи населення."
