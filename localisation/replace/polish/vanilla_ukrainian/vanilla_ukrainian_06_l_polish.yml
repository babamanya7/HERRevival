 uk_china_focus:0 "Вплинути на Китай"
 uk_colonial_focus_desc:0 "У нашій величезній, розгалуженій імперії працюють одні з найвидатніших умів світу, але її розміри заважають багатьом з них зустрітися. Заохочуючи їх до спільної роботи над нашими найважливішими проєктами, ми можемо досягти результатів швидше."
