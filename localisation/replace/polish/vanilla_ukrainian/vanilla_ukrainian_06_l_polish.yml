 EST_exploit_the_banks_desc:0 "Константін Пятс уже давно є впливовою фігурою в банківському секторі Естонії. Хоча дехто вважає зрадницьким твердження про те, що Пятс причетний до корумпованості банків та експлуатації трудящих Естонії, зв'язки Пятса у приватному секторі ставлять нашу диктатуру в чудове становище для певної власної експлуатації."
