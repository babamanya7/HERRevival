 CONFIRMDELETETEXT_EXPEDITIONARY_MULTI:0 "§Y$NUM$§! дивізій §Yекспедиційних військ§! буде відправлено додому."
 CONFIRM_REMOVE_CONSTRUCTION_LEVEL_TITLE:0 "Скасувати будівництво"
 CONGO_compagnie_belge_maritime_du_congo_desc:0 "Бельгійська морська компанія Конґо — це компанія, яка відповідає за транспортування матеріалів між Конґо та [BEL.GetNameDef]. Ми повинні надати їй субсидії, щоб забезпечити відкритість важливих торгових шляхів."
 CONGO_expand_tungsten_mines_desc:0 "Зі зростаючим інтересом до снарядів з вольфрамовими сердечниками важливо, щоб ми забезпечили власне джерело цього важливого металу. На щастя, він був знайдений на наших територіях мандату Руанда-Урунді."
 CONGO_jungle_fighting:0 "Бої в джунглях"
 CONGO_soviet_interest:0 "Совєтський інтерес"
 CONGO_the_heart_of_africa_desc:0 "Величезні території Конґо знаходяться в самому серці Африки, і, хоча вони порівняно бідні та не розвинені, їх внутрішні райони ховають безмежні багатства і можливості. Все, що нам потрібно зробити, це вирушити в подорож і знайти їх."
