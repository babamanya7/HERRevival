 china.18.a:0 "У нас нема часу на відновлення."
 china.18.d:0 "Ми ще ледь відновились після останньої операції, а тим часом націоналісти, як виявилось, збільшували присутність своїх військ на наших кордонах. Очевидно, вони намагаються показати, що вони знову оточили нас і що Великий похід тільки відклав їхній фінальний удар проти КПК. Ми не можемо дозволити людям думати, що це правда."
 china.8.d:0 "Дізнавшися про наш запланований наступ крізь своїх агентів, КПК відвела Червону армію ще далі в Шеньсі. Хоч це позбуло нас можливості ослабити їх іще більше, це показало, що комуністи не готові протистояти нам, хай би там що казала їхня пропаганда. Певною мірою, навіть ця ситуація стала вигідною для нас."
