 ALL_TASK_FORCES_REPAIR_NOW:0 "§HНегайний ремонт!§!\nУсі обрані оперативні групи повернуться на базу приписки для ремонту.\n§GКлацніть§!, щоби надіслати. Вони продовжать свої поточні завдання після повного ремонту.\n§GCtrl + клацніть§!, щоби надіслати. Вони залишаться в морській базі після ремонту."
