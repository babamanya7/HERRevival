 FACTION_EXECUTE_RUSH_DESC:0 "Підрозділи атакуватимуть провінції, якщо вони є частиною плану, навіть якщо це може означати, що лінія фронту стане довшою або може поставити підрозділи у відкриті місця.\n\n§gЗверніть увагу, що це вплине лише на союзні підрозділи, керовані ШІ, в межах театру, а не на будь-які підрозділи, керовані гравцем.§!"
