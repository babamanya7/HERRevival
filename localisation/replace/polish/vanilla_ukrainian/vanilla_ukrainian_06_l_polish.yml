 YUG_coastal_defense_desc:0 "Ми не можемо сподіватися позмагатися з флотами наших супротивників в Адріатиці. Натомість ми повинні підготувати наші береги до відбиття будь-яких морських вторгнень, які вони можуть спробувати."
