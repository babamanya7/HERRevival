 NZL_direct_the_coal_industry_desc:0 "Оскільки вугілля стає дедалі важливішим для наших залізниць, промисловості та електростанцій, уряд має втрутитися, щоб координувати виробництво і розподіл в національних інтересах."
 NZL_domestic_car_industry_desc:0 "Виробництво автомобілів у [ROOT.GetName] обмежувалося збиранням деталей від іноземних виробників, які відправляються сюди для фінальної збірки. Завдяки нашим нещодавнім інвестиціям у внутрішнє виробництво сталі, ми можемо почати виробляти компоненти самостійно."
