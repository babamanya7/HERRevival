 SWI_the_second_helvetic_republic_desc:0 "Ще в 1798 році сумно відомий диктатор Наполеон Бонапарт завоював [ROOT.GetName] і створив Гельветську республіку як інструмент для підкорення нашого народу. На щастя для нас, ці дні минули, і ми можемо бути впевнені, що вдруге ми можемо очікувати більш справедливий союз із нашим давнім сусідом."
