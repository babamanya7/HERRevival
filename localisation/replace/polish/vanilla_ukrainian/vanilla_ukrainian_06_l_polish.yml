 DIPLOMACY_JOIN_FACTION_REQUEST_DESC:0 "Держава $COUNTRY|Y$ хоче приєднатися до нашого альянсу $FACTION|Y$.\nЯкщо між членами альянсу були надіслані або отримані будь-які добровольці, вони будуть надіслані назад.\nПідготовка переворотів між державою $COUNTRY|Y$ та нами буде автоматично скасована."
