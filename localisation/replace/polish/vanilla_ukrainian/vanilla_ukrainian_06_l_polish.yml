 DOD_hungary.1.b:0 "Такими питаннями мусять займатися професіонали."
 DOD_hungary.107.b:0 "У жодному разі."
 DOD_hungary.115.b:0 "Наполягати на території."
 DOD_hungary.121.desc:0 "Посли держав [HUN.GetNameDef] і [SOV.GetNameDef] звернулися до нас із пропозицією спільно забезпечувати захист наших кордонів від агресорів. Натомість ми зобов'язуємося надати частину міністерських портфелів комуністам. Угорщина також пов'язує виконання своєї частини гарантій із поверненням їй Південної Словаччини."
 DOD_hungary.123.desc:0 "Стоячи перед величезною картою Європи, [SOV.GetLeader] прочитав нашій делегації годинну лекцію і кілька разів вказав на недоробки та вади висунутого нами плану. Він довго говорив про те, якою дурною є наша пропозиція і навіть звинуватив нас у змові з імперіалістами.\n\nНаші делегати повернулися з Москви з порожніми руками, зате живими."
 DOD_hungary.140.b:0 "Через них вже вибухнула одна війна!"
 DOD_hungary.140.t:0 "[FROM.GetNameDefCap] вимагає права на переозброєння"
 DOD_hungary.141.desc:0 "Без будь-яких попередніх консультацій із нами [From.GetAdjective] уряд підписав угоду з Угорщиною, яка змінює або знімає обмеження, що накладаються Тріанонським договором. Тепер Угорщина може вільно дозброювати свою армію та розробляти всі види військової техніки, у тому числі танки та літаки.\n\nТе, що Угорщина нарощує свою армію, вже давно не є таємницею, але завдяки цій новій угоді вона скоро зможе знову загрожувати нашій безпеці."
 DOD_hungary.144.desc:0 "Переговори про можливість перегляду умов Тріанонського договору не зрушили з початкового етапу. Уряд держави [From.GetNameDef] ясно дав зрозуміти, що не відмовиться від свого прагнення зберегти статус-кво.\n\nНам залишається лише погодитися з їх позицією або спробувати заручитися підтримкою третьої сторони."
 DOD_hungary.146.b:0 "Угорщина не повинна отримати право на переозброєння."
 DOD_hungary.170.a:0 "Чудово!"
 DOD_hungary.24.a:0 "Ми не дозволимо втягнути себе в їхній конфлікт."
 DOD_hungary.30.t:0 "Угорщина запропонувала відновити дружні стосунки"
 DOD_hungary.34.b:0 "Ми мусимо твердо стояти на своєму в цьому питанні."
 DOD_hungary.4.desc:0 "Громадяни Австрії висловилися за об'єднання з Угорщиною, йдеться у заяві, зробленій лідером країни ([AUS.GetLeader]) відразу після опівночі. Як говорить офіційна телеграма, прийнявши австрійську корону, [HUN.GetLeader] зробить перший крок на шляху до відновлення подвійної монархії."
 DOD_hungary.55.f:0 "Ніхто не хоче вислухати нас..."
 DOD_hungary.58.a:0 "Ми з радістю це зробимо."
 DOD_hungary.62.b:0 "Ця війна завершиться швидше, ніж вони сюди дістануться."
 DOD_hungary.64.t:0 "Провал посередницьких зусиль"
 DOD_hungary.65.t:0 "Угорщина відмовилася підписати протокол посередницьких переговорів"
 DOD_hungary.7.t:0 "Ручний референдум"
 DOD_hungary.92.c:0 "Звернутися до Італії за підтримкою."
 DOD_romania.12.t:0 "[From.GetNameDefCap] відмовляється."
 DOD_romania.30.desc:0 "У Європі наростає напруженість, і [ROM.GetLeader] звернувся до нас із несподіваною пропозицією: погодившись захищати Румунію від усіх зовнішніх загроз, ми матимемо право розміщувати свої війська на її території. \n\nЯк жест доброї волі [ROM.GetLeader] також послабив обмеження, накладені на діяльність компартії."
 DOD_romania.b:0 "Влаштувати прийом, щоби відвернути його. ДУЖЕ пишний прийом."
 DOD_yugoslavia.35.a:0 "Час закінчується."
 DOD_yugoslavia.50.b:0 "Італійська принцеса Марія Франческа."
 DOD_yugoslavia.701.a:0 "У нас немає іншого вибору, крім як погодитися."
