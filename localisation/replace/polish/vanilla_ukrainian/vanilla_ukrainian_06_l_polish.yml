 mtg_britain.1.t:0 "Криза зречення Едуарда VIII"
 mtg_britain.100.b:0 "Ми ніколи не зрадимо свою незалежність!"
 mtg_britain.101.a:0 "Ми будемо сильні, як єдине ціле."
 mtg_britain.39.a:0 "Яка зрада!"
 mtg_britain.46.t:0 "[From.GetName] вимагає деколонізації"
 mtg_britain.49.d:0 "[From.GetNameDefCap] пропонує спільно напасти на державу [GER.GetNameDef] у двох напрямках. Якщо вони виконають свої зобов'язання та швидко відкриють другий фронт, то це буде чудова можливість."
 mtg_britain.91.d:0 "Потужна економіка — каркас, що підтримує всю будівлю імперії. Вкрай важливо, щоби домініони не нехтували своїм промисловим потенціалом, а широко інвестували в індустріалізацію."
 mtg_britain.93.a:0 "Інвестиції принесуть стократні плоди."
 mtg_netherlands.35.b:0 "Ми не можемо надати зібрані нами розвідувальні дані."
 mtg_netherlands.51.b:0 "Ми не можемо покладатися на його дані!"
 mtg_netherlands.75.t:0 "Вільгельміна веде переговори з Вільгельмом II"
 mtg_news.13.b:0 "Нам багато що треба обговорити."
 mtg_news.14.c:0 "Вони збожеволіли."
 mtg_news.17.t:0 "[From.GetName] примушує дотримання морських угод"
 mtg_news.21.a:0 "Тепер ніхто не стане на нас на шляху."
 mtg_news.31.desc:0 "\nСьогодні [ENG.GetAdjective] військові частини були розміщені по всій державі [From.GetNameDef], і [ENG.GetAdjective]ий уряд оголосив про введення у своєму домініоні воєнного стану. Робота місцевого уряду призупинена, а поточні справи, принаймні зараз, ведуться безпосередньо з Лондона. Поки неясно, скільки це триватиме, але оглядачі вже назвали [ENG.GetAdjective] позицію «неспроможною» у довгостроковій перспективі."
 mtg_news.36.b:0 "Вони зрадили справу істинного соціалізму!"
 mtg_news.43.desc:0 "Члени [From.GetAdjective] соціалістичної партії неодноразово висловлювали занепокоєння відмовою уряду провести деколонізацію. Статут від бездіяльності уряду, соціалісти почали звинувачувати його в «зраді цінностей соціалізму» і вирішили усунути його силою зброї. обороти, і тепер країні вже не уникнути повномасштабної громадянської війни."
 mtg_news.52.a:0 "Вест-Індія тепер у безпеці."
 mtg_news.64.b:0 "Знову об'єднання? Визначтеся нарешті!"
 mtg_news.8.desc:0 "Перед обличчям глобальних загроз британський уряд зробив спільну заяву з урядами держав [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef] та [NZL.GetNameDef] про створення Британської співдружності націй із новою федеральною урядовою структурою.\n\nПеред цим [RAJ.GetAdjective]ий уряд відмовився від такої пропозиції, і зараз [RAJ.GetNameDef] не бажає асоціюватися з новою політичною наддержавою в її поточному федеральному устрої.\n\nНезважаючи на це, такий крок приведе до безпрецедентних наслідків на глобальній арені."
 mtg_transport:0 "$transport$"
 mtg_usa_anti_bolshevist_aid_tt:0 "Буде відкрите рішення: §YЗброя для анти[GetSovietThreatNameAlt]ої війни§!\nКоли рішення прийнято:\nНадіслати §Y1000§! од. §Yпіхотного спорядження§! країнам у війні з §YРадянським Союзом§!. Першими буде надіслано старі моделі."
 mtg_usa_civil_war_democrats.1.a:0 "Нехай протестують, а нам треба керувати країною."
 mtg_usa_civil_war_democrats.16.a:0 "Це доводить, що політика президента працює!"
 mtg_usa_civil_war_fascists.16.desc:0 "Згідно з конфіденційною доповіддю міністерства торгівлі, багато промисловців з північних регіонів США планують перенести виробництво своєї продукції в інші штати після низки організованих профспілками страйків з вимогою підвищення заробітної плати і скорочення робіт. що у штатах, які не погодилися придушити ці страйки, стає все важче отримувати розумний прибуток."
 mtg_usa_civil_war_fascists.20.desc:0 "Сьогодні о 8:00 до Білого дому прибув особливий посланець, який доставив президенту [USA.GetLeader] офіційне повідомлення від Законодавчих зборів штату [CSAcapital.GetName] про те, що цей регіон більше не бажає вважати Політики заявили, що це фундаментальне право будь-якого цивілізованого народу (з численними цитатами з Декларації незалежності), а також зазначили, що це мирне рішення, що відповідає інтересам усіх, і що нова держава має намір вести самостійну політику як хороший сусід держави [USA.GetNameDef]."
 mtg_usa_civil_war_fascists.203.desc:0 "Група, яка називає себе Громадянською радою держави [USA_state_government_created.GetName], заявила про те, що вона приймає контроль над державою [USA_state_government_created.GetName] у вірності, чи підтримують вони якусь сторону в поточному конфлікті, а просто заявили, що хочуть прийняти низку нових законів щодо призову до [CSA.GetAdjective] військових сил. не є представниками уряду [USA_state_government_created.GetName]."
 mtg_usa_house_small_opposition_tt:0 "До §Y20 представників§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_house_small_support_tt:0 "До §Y25 представників§! §Gпідтримають§! уряд.\n"
 mtg_usa_secure_asia.2.t:0 "[From.GetLeader] погоджується"
 mtg_usa_southern_threat.1.b:0 "Нізащо!"
 mtg_usa_southern_threat.1.desc:0 "Президент [USA.GetLeader] викликав нашого посла, щоби вручити йому вимоги уряду США. Серед них — надання особливих прав [USA.GetAdjective]ому послу. По суті, це надання [USA.GetAdjective]ому уряду права вето на будь-яке наше рішення.\n\nУ разі нашої відмови, як сказано в ноті, [USA.GetAdjective]ий уряд буде змушений «вжити заходів, які визнає необхідними для підтримки національної безпеки»."
 murder_trotsky_infiltration:0 "Підроблені документи"
 mutiny_event.8.a:0 "This keeps getting worse."
 national_news_agency:0 "Державна новинна агенція"
 naval_gunfire_support_joint_operations:0 "Спільні операції"
 naval_invader:0 "Загарбник"
 neutrality_drift_tt:0 " $neutrality_drift$: $RIGHT|+=2$"
 new_deal_desc:0 "Низка постанов та програм, прийнятих Франкліном Д. Рузвелтом з метою виходу з масштабної економічної кризи під час Великої депресії."
 news.140.a:0 "[SOV.GetAdjective]ий ведмідь більшає..."
 news.148.d:0 "З Токіо надходять новини про те, що місто було взято китайськими військами. Воно майже повністю зруйноване, включно з імператорським палацом, де відтепер знаходиться китайська військова адміністрація.\n\nІноземні репортери стали свідками пишного параду перемоги, коли нескінченні ряди китайських солдатів пройшли крізь місто. Японці, які стовпилися вздовж вулиць, зустрічали це видовище труною мовчанням."
 news.15.d:0 "Після проведення Німеччиною арбітражу у Відні було підписано угоду про передачу Північної Трансільванії під контроль Угорщини.\n\nРаніше, за результатами Великої війни, ця територія була віддана державі [ROM.GetNameDef], що призвело до запеклих суперечок.\n\nЧи стане такий переділ кордонів першим кроком у встановленні нового порядку в Європі?"
 news.157.t:0 "[From.From.GetName] втручається в [From.GetAdjective]у війну"
 news.163.e:0 "Зраджені."
 news.180.b:0 "Їхній союз незабаром розпадеться."
 news.180.e:0 "Франція вибрала сторону."
 news.182.b:0 "Нова [From.GetAdjective]а держава нависає над Європою."
 news.193.c:0 "Буде цікаво подивитися, чим це закінчиться."
 news.20.t:0 "[FROM.GetNameDefCap] відхиляє [GER.GetAdjective]і вимоги"
 news.200.a:0 "Німецька дружба краща за німецьке панування."
 news.201.d:0 "\nЗіткнувшись з дипломатичним та військовим тиском з боку альянсу [GER.GetFactionName] як на сході, так і на заході, [TUR.GetAdjective]ий уряд був вкинутий у політичний хаос.\n\nПісля німецьких та радянських загроз, новий уряд, що вийшов з хаосу, є набагато дружнішим до [GER.GetFactionName], ніж попередній. Кілька східних територій вже було передано [SOV.GetNameDef].\n\nДійсно, деякі поспішно замовчані дисиденти стверджують, що новий уряд виконує кожну забаганку [GER.GetLeader]."
 news.216.a:0 "[GER.GetAdjective]ий вплив буде зменшено."
 news.223.e:0 "Такі дії порушать баланс в Європі."
 news.227.t:0 "Похмура і жорстока подорож"
 news.231.t:0 "[JAP.GetAdjective]а розбудова на [CHI.GetAdjective]ому кордоні"
 news.233.c:0 "Подивимося, як ситуація розвинеться."
 news.260.a:0 "Цікаво."
 news.260.b:0 "Дійсно, дуже розумно."
 news.273.t:0 "Бенгальський голод закінчився"
 news.28.d:0 "Група офіцерів Вермахту, що виступала проти війни, здійснила в Берліні замах на життя Гітлера. Озброєні люди увірвалися в Райхсканцелярію і ліквідували фюрера після відчайдушної перестрілки з його охоронцями з SS. Змовники, які вижили, були заарештовані Ґестапо, і сьогодні вранці Гайнріх Гіммлер склав присягу як новий фюрер Третього Райху.\n\nУ своїй промові перед Райхстаґом Гіммлер звинуватив Велику Британію і Францію в організації вбивства Гітлера і заявив, що Німеччина не знатиме спокою, поки не знищить обидві ці держави."
 news.282.t:0 "Рух «Геть із Індії»"
 news.298.c:0 "Вони скинули з себе ярмо Версалю."
 news.301.c:0 "Принаймні, мир було збережено."
 news.309.desc.a:0 "[HUN.GetAdjectiveCap]а влада висунула вимогу, щоб Словаччина знову стала частиною їхньої держави в якості невід'ємної її частини або автономного регіону. Було висунуто ультиматум, підкріплений загрозою застосування сили, і дипломати кількох європейських країн у шаленстві намагаються знайти мирне вирішення цієї останньої кризи."
 news.310.b:0 "Це була вимушена жертва."
 news.313.desc.b:0 "Сьогодні уряди Італії та Угорщини оприлюднили спільну заяву, в якій оголосили про створення Римського пакту. Дві держави пообіцяли надавати одна одній військову допомогу, як оборонну, так і наступальну, якщо виникне така потреба. Баланс сил в регіоні кардинально змінився за одну ніч."
 news.316.c:0 "Будем сподіватись, що воно виправдається."
 news.330.t:0 "Панслов'янський робітничий конгрес"
 news.39.t:0 "Троцького вбито на радянському кордоні"
 news.5.d:0 "Скориставшися слабкістю Франції, яка зазнала поразки в Європі, держава [JAP.GetNameDef] переконала новий уряд поступитися контролем над колонією в Індокитаї! [JAP.GetAdjective]і війська вже зайняли всі основні бази в регіоні, й експерти побоюються, що колонія буде використана для подальших військових кампаній."
 news.66.d.b:0 "Одинадцяті Олімпійські ігри нещодавно пройшли в уцілілих районах зруйнованого та знову відбудованого Берліна; в них взяли участь спортсмени з 49 країн світу.\n\nЛітню Олімпіаду 1936 року вперше в історії частково транслювали по телебаченню в прямому ефірі. Ігри, символ оновленої держави, стали великою перемогою пропаганди Німеччини, яка, незважаючи на величезні витрати на відновлення країни після громадянської війни, вклала у них великі кошти.\n\nНімецькі атлети виступили найкраще і здобули 33 золоті медалі, американці стали другими з 24 медалями. Чотири з них приніс Джессі Оуенс, який став найуспішнішим спортсменом Ігор."
 no_invincible_armies:0 "Історія показує, що непереможних армій нема"
 nsb_armour_folder:0 "$armour_folder$"
 nsb_news.104.t:0 "Англо-[SOV.GetAdjective] вторгнення в державу [PER.GetName]"
 nsb_news.401.c:0 "На горизонті новий союзник?"
 nsb_news.405.a:0 "Коли слов'яни єдині, вони непереможні!"
 nsb_news.407.b:0 "Це релікт із минулого."
 nsb_news.409.desc:0 "У тристоронній угоді держав [GER.GetNameDef], [SOV.GetNameDef] та [JAP.GetNameDef] заявляється, що [JAP.GetNameDef] стане наступним учасником Осі.\n\nТакий розвиток подій несподіваний у світлі недавніх дебатів між [SOV.GetAdjective] і [JAP.GetNameDef] урядами. Ймовірно, воно стало результатом умілих переговорів [GER.GetAdjective] сторони, але такий пакт прикриє [SOV.GetAdjective] східний фланг і дозволить державі [JAP.GetNameDef] зосередити увагу на Тихому океані."
 nsb_news.6.desc:0 "Націонал-демократи і фалангісти давно пов'язані з польським урядом, але тривала співпраця Іґнація Мосціцького з цими вкрай правими елементами призвела нарешті до його падіння. Завдяки зростаючому впливу в польському уряді [POL.GetLeader] тепер замінює Мосцицького на посту президента Польщі.\n\nПлани цього нового націоналістичного уряду поки не зрозумілі — можливо, він вважає, що зможе якось утихомирити іноземні держави, що наглядають його території, а можливо, Польщу чекають у майбутньому нові альянси."
 nsb_news.9.b:0 "Шкода, що все закінчилося саме так."
 nsb_news.9.desc_left:0 "У Росії знову вибухнула громадянська війна — що особливо дивно, адже ще свіжа пам'ять про попередню. Після багатьох років політичних розбіжностей між сталіністами та троцькістами ці угруповання в радянському уряді розділилися та воюють на вулицях за контроль над країною. \n\n[SOV.GetLeader] оголошує себе лідером так званої держави [SOV.GetNameDef], і тепер веде війну проти [SOS.Getleader] зі штаб-квартири в місті [SOV.Capital.GetName]."
 nuclear_reactor_desc:0 "Ця споруда виробляє в області збагачений уран для використання в ядерній зброї."
