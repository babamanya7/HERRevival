 WW_hungary.117.desc:0 "У регіоні [45.GetName] відбувся публічний референдум щодо приєднання до [HUN.GetNameDef]. Вибори пройшли під наглядом міжнародних спостерігачів, які не виявили серйозних порушень. Згідно з результатами, значна частина населення проголосувала за вихід із нашої держави. Чи приймемо ми цей результат?"
 WW_hungary.12.t:0 "[FROM.GetNameDefCap] передає свої [SLO.GetAdjective] території"
 WW_hungary.17.a:0 "Нехай забирають"
 WW_hungary.30.a:0 "Ми пообіцяємо ненапад. Поки що..."
 WW_hungary.32.b:0 "Габсбургів вигнали недарма!"
 WW_hungary.41.b:0 "Ми не зацікавлені"
 WW_hungary.62.b:0 "Ким вони себе вважають?"
 WW_hungary.75.desc:0 "Імпульсивний [FROM.GetLeader] закликає до окупації Святої Землі [FROM.GetAdjective] військами, вимагаючи, щоб ми передали територію та вивели наші війська з регіону. Ситуація може вийти з-під контролю, якщо ми не будемо обережні. Як відповімо?"
 XIC_the_fushi_conference_desc:0 "Для другої зустрічі [PRC.GetLeader] погодився надіслати Лі Кенуна та Чжоу Еньлая як посланців до Фуші, щоб обговорити подальші вимоги та дії, необхідні для того, щоб переконати [CHI.GetLeader] приєднатися до офіційного Об'єднаного фронту. Час перемоги над [JAP.GetAdjective]им імперіалізмом і поверненям землі Фентянської кліки невблаганно наближається..."
 XIC_war_in_yanan:0 "Шоста кампанія на оточення"
 XIC_withdraw_forces_from_yanan_desc:0 "Щоб викликати гнів [CHI.GetLeader] і гарантувати, що керівництво партії Ґоміньдан приїде до Сіаня для перевірки наших військ, ми повинні спровокувати інцидент, вивівши наші сили з Яньаня і дозволивши комуністам захопити місто."
