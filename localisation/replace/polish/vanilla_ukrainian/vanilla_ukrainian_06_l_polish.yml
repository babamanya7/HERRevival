 INS_national_revolution_republic_sukarno_threatened_desc:0 "Сукарно нещодавно пережив замах на вбивство, і цілком очевидно, що станеться ще один, якщо порядок не буде відновлено."
 INS_political_events.15.a:0 "Ми не лише забезпечили себе дешевими ресурсами, ми забезпечили собі цінного союзника."
 INS_political_events.19.t:0 "[HOL.GetName] відкликає адмірала Гелфріха"
 INS_political_events.9.desc:0 "Оскільки [JAP.GetNameDef] почали виводити свої війська з Ост-Індії, ми відправили солдатів до Батавії, щоб відновити колоніальний уряд. Однак наші солдати виявили, що політичний ландшафт в Індії значно змінився з часів окупації. Ще до того, як наші війська дісталися Батавії, [INS.GetLeader] вже підписав декларацію незалежності, проголосивши Республіку Індонезія незалежною нацією, з шокуючою підтримкою громадськості."
 INS_propose_malay_unification_decision:0 "$INSHOL_propose_malay_unification$"
 INS_relocate_generals_tt:0 "Перекинути §Y80%§! наших Збройних Сил до [INS.GetNameDef]."
 INS_republic_knip_party_long:0 "Central Indonesian National Committee"
 INS_republic_masyumi_party_long:0 "Masyumi"
 INS_revolution_events.1.t:0 "[HOL.GetNameDefCap] діє, щоб розтрощити Республіку"
 INS_revolution_events.23.desc:0 "[FRA.GetNameDefCap] відгукнулися на наш заклик про допомогу і відправили багато французьких дивізій до Батавії, щоб негайно нам допомогти."
 INS_revolution_events.26.desc:0 "Сили [HOL.GetAdjective] та республіканські ополченці воювали набагато довше, ніж будь-яка зі сторін очікувала, і [HOL.GetLeader] погодився підписати мирну угоду, яка передбачає рішення про дві держави. Однак, оскільки ми все ще виконали свою частину угоди, [HOL.GetLeader] підтвердив, що нам усе одно буде надано територію, яка була нам обіцяна."
 INS_revolution_events.27.a:0 "Це божевілля!"
