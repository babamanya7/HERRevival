 JAP_the_jeweled_spear_has_struck_desc:0 "Небесний коштовний спис колись використовували боги творення Ізанаґі та Ізанамі, щоб підняти перший суходіл з моря. Так само як вони колись використовували встромлений спис, щоб заявити права на нову землю, так і ми зробимо. Настав час побачити, де небесний спис ударить знову."
 JAP_the_persimmon_has_ripened_desc:0 "Плоди перемоги стрімко дозрівають, і наша армія повністю готова до втручання та захоплення Сибіру в [SOV.GetAdjective]ій імперії, що розвалюється. Війна буде блискавичною, а наші перемоги — славетними. Теннохейка Банзай!"
 JAP_the_red_sun_over_asia_decisions_desc:0 "Нарешті настав час для народів Азії звільнитися від капіталістичного та імперіалістичного гніту. Хай живе робітнича держава!"
 JAP_the_surrender_broadcast_tt:0 "Ми матимемо більше шансів зберегти контроль над Домашніми островами, якщо капітулюємо мирно"
 JAP_the_yamato_spirit:0 "Дух Ямато"
 JAP_to_rival_zheng_yi_sao_desc:0 "Чжен Ши була легендарною китайською лідеркою піратів, яка діяла в Південнокитайському морі, ставши найуспішнішою жінкою-піратом в історії. Ми повинні відповідати цій легенді й навіть перевершити її в ім'я великої імператриці Наґако!"
