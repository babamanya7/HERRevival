 SWE_war_games_desc:0 "Між нами та нашими супротивниками більше немає ніяких претензій щодо нашої геополітичної позиції. Таким чином, нам нічого втрачати, залучаючи військових до військових ігор, які передбачають конфлікт із цими супротивниками."
 SWI_alpine_specialization_desc:0 "Більше ніж будь-яка інша нація, ми можемо прийняти наші гірські традиції та тренувати нестримну силу, яка може захищати та атакувати через гори, як ніхто інший. Вони стануть тією лавиною, яка знищить ворога."
