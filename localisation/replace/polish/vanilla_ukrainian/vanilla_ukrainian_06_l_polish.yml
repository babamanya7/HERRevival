 ENG_god_save_the_king_desc:0 "Понад усе стоїть наш обов'язок перед королем і Короною. Будучи символом опору та надії для народу, а також єдності Імперії для наших підданих і ворогів, короля треба звеличувати всередині та боятися зовні. Так ми й зробимо."
 ENG_harry_pollitt:0 "Гаррі Поллітт"
 ENG_heavy_cruiser_4_desc:0 "Ці кораблі були запропоновані сером Вінстоном Черчиллом, лордом Адміралтейства, на ранніх етапах Другої світової війни для протидії німецьким великим артилерійським крейсерам класу «Deutschland». Ці кораблі мали 9,2-дюймові гармати, важку зенітну зброю та міцну броню. Вони були розроблені для ефективної боротьби з головними кораблями противника. Кораблі врешті-решт були скасовані через високу вартість і відсутність попиту на новий важкий крейсер."
