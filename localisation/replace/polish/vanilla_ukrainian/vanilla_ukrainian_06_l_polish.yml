 CHL_political_events.90.desc:0 "Наш союзник [FROM.GetLeader] з [FROM.GetNameDef] передав нам [270.GetName], згідно з нашим запитом. Тепер, нарешті, наш народ може почуватися в безпеці від зовнішньої загрози та зберегти свою енергію для внутрішніх проблем."
