 SOV_a_global_class_struggle:0 "Глобальна класова боротьба"
 SOV_administrative_reforms_desc:0 "Сталін цінував лояльність понад усе. Відповідно, люди, які працюють в нашій адміністрації, не виявляють багато ініціативи чи незалежного мислення, що може призвести до проблем для них. Нам потрібно прищепити їм ці цінності або замінити їх людьми, які їх мають."
 SOV_align_state_in_process:0 "У даний час проникає в область"
 SOV_bring_old_trotskyists_back_desc:0 "У перші роки революції всередині партії відбувалося багато гарячих дебатів між різними фракціями. Деяких людей, які не зовсім дотримувалися партійної лінії, таких як Карл Радек та Євген Преображенський, навіть виключили через незначні розбіжності. Можливо, жесту каяття з боку цих давніх членів партії було б достатньо, щоб повернути їх до лав партії."
 SOV_build_national_academy_of_sciences_integrated_republic_AZR_desc:0 "Ми збудуємо [AZR.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_claims_on_baltic_desc:0 "Пьотр І мав рацію, прагнучи отримати доступ до портів на заході. Країни Балтії, які були втрачені після революції, мусять бути реінтегровані до складу Радянського Союзу."
 SOV_concessions_germany_ukraininan_oil_SCW_desc:0 "Хоча було б погано втратити Україну, вона може стати цінним союзником у війні проти сталінізму. Німеччина може таємно тренувати українську міліцію, і тоді українські повстанці зможуть здійснити несподівану атаку, коли будуть готові."
 SOV_control_scandinavia:0 "Установити контроль над Скандинавією"
 SOV_decrease_all_opposition_air_tt:0 "Підтримка опозиції в авіації §Rзменшиться§!."
