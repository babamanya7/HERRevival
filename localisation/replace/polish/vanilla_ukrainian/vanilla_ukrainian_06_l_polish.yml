 GER_reinstated_nazi_leadership:0 "Нацистське керівництво відновлене"
 GER_reject_the_locarno_treaty_desc:0 "Локарнська угода була чітко створена для того, щоб перешкодити нам відновити території, які несправедливо були відняті. Ми повинні повністю відкинути цю угоду і підготуватися до відновлення наших старих територій."
