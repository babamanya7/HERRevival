 democratic_revolutionaries_desc:0 "Якщо підтримка демократії зросте понад 70%, у країні почнеться громадянська війна. Якщо підтримка демократії впаде нижче 30%, революційна активність зупиниться."
 denmark_events.666.desc:0 "До сьогоднішнього дня ми тягнули жалюгідне існування, сумуючи про давно минулу славу. Всі мрії про велич відкидалися без найменших сумнівів. Досить це терпіти! Сьогодні ми вступаємо в новий золотий вік! Сила і вплив нашої країни зростають з кожним днем. Настав час проголосити зародження Великої Данії."
