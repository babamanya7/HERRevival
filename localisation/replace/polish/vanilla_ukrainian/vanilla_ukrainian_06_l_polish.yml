 CHL_pan_hispanic_rhetoric_desc:0 "Незабаром настане ера гіспанських народів, і ми будемо правити континентом. Настав час зламати англомовну гегемонію та об'єднати гіспанські народи!"
 CHL_political_events.16.d:0 "Президентські вибори знову наближаються, і термін [ROOT.GetLeader] відповідно добіг кінця. Більшість криз вже вирішено, але з війною по всьому світу стабільності ще належить знайти свій шлях. Хто повинен взяти на себе мантію Алессандрі на цей термін і повести країну до великого майбутнього?"
 CHL_political_events.36.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] люб'язно вирішив прийняти нашу пропозицію про приєднання, і тепер ми стоїмо разом у літописах історії."
 CHL_political_events.38.desc:0 "[CHL.GetLeader] запросив нас приєднатися до них як частина фракції [GET.GetNameDef], щоб перешкодити американському втручанню в іспанські справи. Вони стверджують, що, незважаючи на те, що ми слабші та більш роз'єднані, ми можемо перемогти Сполучені Штати, якщо будемо працювати разом."
 CHL_political_events.42.t:0 "[URG.GetName] підкоряється [GER.GetNameDef]"
