 AIR_DETECTION_IN_REGION_DETAILS:0 "Загальне виявлення літаків: $TOT|%G$\n  Від підконтрольних територій: $BASE|%G$\n  Радари в зоні досяжності: $RAD|%G$\n  Активні літаки в регіоні: $AIR|%G$\n\nЗагальне виявлення зменшене на $DETECT_RED|R$\n  Ніч: $NIGHT|%R$\n  Погана погода: $WEA|%R$"
