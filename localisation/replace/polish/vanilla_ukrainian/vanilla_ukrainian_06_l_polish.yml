 CHI_wang_ganchang:0 "Ван Ґаньчан"
 CHI_zhonghua_minzu_focus_tt:0 "Розблоковує рішення для націоналізації регіонів: [MON.GetFlag] §Y[MON.GetAdjective]их§!, [TAN.GetFlag] §Y[TAN.GetAdjective]их§! та [TIB.GetFlag] §Y[TIB.GetAdjective]их§!"
