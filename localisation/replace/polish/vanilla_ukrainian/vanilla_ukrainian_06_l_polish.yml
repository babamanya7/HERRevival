 IRQ_expand_habbaniya_airbase_desc:0 "Авіабаза Хаббанія стала серцем повітряних операцій в Іраку з моменту її заснування [ENG.GetAdjective]. Щоб краще розмістити наші зростаючі повітряні сили, ми повинні розширити там об'єкти."
 IRQ_export_infrastructure_desc:0 "Нафта має життєво важливе значення для світової економіки, інвестуючи в нашу експортну інфраструктуру для неї, ми можемо заявити про [ROOT.GetNameDef] на світовій карті, водночас отримуючи фінансову вигоду."
 IRQ_hashemite_caliphate_neutrality:0 "Гашімітський халіфат"
 IRQ_hussein_fawzi:0 "Хусейн Фаузі"
 IRQ_kurdistan_events.1.desc:0 "Ми щойно отримали повідомлення від курдських націоналістів у [IRQ.GetNameDefCap] з проханням про допомогу для їхньої революції."
 IRQ_kurdistan_events.3.a:0 "Ми не повинні дозволити, щоб це нас знеохотило!"
 IRQ_nairn_transport_company:0 "Nairn Transport Company"
 IRQ_political_events.40.t:0 "[FROM.GetNameDefCap] вимагає Сирію"
 IRQ_political_events.50.b:0 "Абсолютно ні!"
 IRQ_political_events.70.a:0 "Наскільки везучим може бути людина?"
 IRQ_political_events.76.a:0 "Прикро"
 IRQ_political_events.78.desc:0 "Зіткнувшись із серйозними труднощами, [IRQ.GetAdjective]а армія відступила з міста Дейр-ез-Заур. Можливо, це ще не кінець конфлікту, але наразі цей район залишатиметься [SYR.GetAdjective]им."
 IRQ_project_babylon_focus:0 "Проєкт «Вавилон»"
 IRQ_project_babylon_focus_desc:0 "Щоб вигравати майбутні війни, ми повинні забезпечити важку зброю, необхідну для домінування над ворогами, незалежно від того, наскільки ми можемо поступатися чисельністю. Тому ми повинні прагнути відкрити об'єкти, присвячені дослідженню та розробці експериментальної зброї."
 IRQ_regional_military_integration_desc:0 "Нам бракує військово-виробничих можливостей великих держав, але, можливо, через регіональні інвестиції ми зможемо почати наздоганяти їх."
 IRQ_scavenging_desc:0 "Обладнання, яке ми не можемо виробляти самі, часто з'являється тут у руках іноземних агресорів. Тому ми повинні навчити наші сили розпізнавати та захоплювати цінне військове обладнання, коли воно доступне."
 IRQ_shia_resistance_modifier:0 "Unruly Autonomous Tribes"
