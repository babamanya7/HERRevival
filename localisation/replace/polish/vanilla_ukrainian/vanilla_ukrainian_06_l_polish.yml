 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_DESC:0 "Цілі війни можуть бути отримані лише з національних фокусів, подій та рішень."
 RULE_ALT_FASCIST_BALBO_ITA_AI_DESC:0 "§HІталійський§! ШІ намагатиметься усунути Муссоліні від влади й натомість привести до влади Італо Бальбо, щоби той знайшов незалежний шлях уперед."
 RULE_EXILES_TSARIST:0 "Царисти у вигнанні"
 RULE_FASCIST_YUG_AI_DESC:0 "§HЮгославський§! ШІ намагатиметься зблизитися з фашистськими державами Європи з метою з часом вступити в союз із ними."
 RULE_GROUP_COVERT_ACTIONS:0 "Секретні операції"
 RULE_HISTORICAL_CZE_AI_DESC:0 "§HЧехословацький§! ШІ якомога точніше слідуватиме історичній низці подій."
 RULE_HISTORICAL_YUG_AI_DESC:0 "§HЮгославський§! ШІ якомога точніше слідуватиме історичній низці подій."
 RULE_OPTION_7:0 "7 рівень"
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC:0 "Чилійський ШІ піде шляхом фашизму, за можливості вирішивши стати на бік Німецького Райху. Урешті-решт він піде війною та спробує відновити старе Королівство Чилі."
 RULE_OPTION_COMMUNIST_PAR_AI:0 "Комуністичний шлях"
 RULE_OPTION_FASCIST_BUL_AI_DESC:0 "У міру того, як у країні ширяться ідеї фашизму, лідер правих Хрісто Луков спробує вступити у Вісь і в результаті скине царя та встановить §Hвійськову диктатуру§!."
 RULE_OPTION_GOE_INDIA_UNITED_RAJ_AI_DESC:0 "Індія докладе зусиль, щоби стати незалежною, залишитися демократичною і приєднатися до союзників, але залишитися єдиною країною і уникнути розділу."
 RULE_OPTION_HISTORICAL_IRQ_AI_DESC:0 "ШІ буде коливатися між історичними переворотами, що завершаться захопленням влади «Золотим квадратом» і війною з Великою Британією, після чого, зрештою, відновить монархію та капітулює."
 RULE_OPTION_HUN_HORTHYIST_KING_HUNGARY:0 "Нова династія"
