 MTG_naval_treaty.1.b:0 "Ми не обмежуватимемо свої амбіції!"
 MTG_naval_treaty.1.desc:0 "Наші недавні зусилля щодо збільшення флоту відкрили нам шлях до лав великих морських держав. Держава [From.GetNameDefCap] явно стурбована цим і відправила в нашу столицю делегацію для переговорів щодо взаємного обмеження озброєнь.\n\nДоговір буде складено за зразком другої Лондонської морської угоди та обмежить розмір наших основних кораблів, а також загальний розмір основного флоту так, щоб той не перевищував розмір флоту держави [ENG.GetNameDef]."
 MTG_naval_treaty.6.a:0 "Подивимося, як [From.GetAdjective]і кораблі попливуть без [Root.GetAdjective]ої сталі."
 MUN_czech.1002.b:0 "Ні, вони перебувають під нашим захистом!"
 MUN_czech.1014.d:0 "Впливові дипломати з [FROM.GetNameDef] звернулися до міністра закордонних справ із проханням закріпити туманні обіцянки захисту, викладені в чехословацько-радянському договорі 1935 року."
 MUN_czech.1015.d:0 "Оскільки тепер ми маємо спільних ворогів, [FROM.GetName] звернулася до нас із пропозицією поглибити нашу співпрацю шляхом інтеграції нашої фракції в їхню."
