 SWE_archibald_douglas:0 "Арчибалд Даґлас"
 SWE_ball_bearing_trade_tt:0 "Дозволяє торгувати кульковими вальницями з іноземними державами, що збільшує їхнє виробництво §Yтанків§! і §Yлітаків§!.\nЯкщо вони схвалять цю торгівлю, ми отримаємо можливість отримати\nдосвід §Yармії§!, §Yавіації§! або §Yфлоту§!: §G+20§!\n Стабільність: §G+2%§!, §G+15§! Щотижневі людські ресурси (накопичується за кожну додаткову торгівлю) \n §G+25%§! Бонус за дослідження для §Yкораблів§!, §Yрадарів§!, §Yсинтетичних ресурсів§! або §YТехнології підтримки§!"
 SWE_charles_de_champs:0 "Шарль де Шам"
 SWE_cruiser_ship_engine_2:0 "«De Laval» 70 000 к. с. н. в."
 SWE_decentralized_nordic_volunteer_group_desc:0 "У всіх скандинавських країнах є багато здібних чоловіків; мисливці, стрільці тощо, які могли б служити в армії. Нам потрібно знайти їх і призвати."
 SWE_destroyer_1:0 "Клас «Ehrensköld»"
 SWE_disillusioned_with_the_government_desc:0 "Цей командувач серйозно розчарований в уряді."
 SWE_dp_ship_secondaries_2:0 "12cm/45 Bofors M24C DP"
 SWE_finnish_integration:0 "Східна півкуля"
 SWE_frans_severin:0 "Франс Северін"
 SWE_germanify_sweden_desc:0 "Хоча багато хто стверджує, що ми окремі народи, нещодавній досвід показав нам, що Швеція є частиною німецького братства, пов'язаного кров'ю. Настав час позбутися будь-яких слідів іноземного впливу та знову прийняти наше німецьке коріння."
 SWE_heavy_tank_equipment_1:0 "Tstrv m/34"
 SWE_hygenic_housing_tt:0 "§YПолітика гігієнічного житла почне поширюватися назовні від Сьодерманланду з плином часу, коли одна нова осердна область отримуватиме модифікатор кожні два місяці§!"
 SWE_karnvapenprogram_desc:0 "З розвитком атомної зброї єдиний спосіб справді гарантувати нашу національну безпеку — це розробка такої власної зброї та відповідних систем доставки. Використовуючи прикриття розвитку ядерної енергії та звичайної зброї, ми можемо робити це без занепокоєння великі держави."
 SWE_karnvapenprogram_nuclear_bonus:0 "Ядерний бонус за програму ядерної зброї"
 SWE_light_ship_engine_2:0 "«De Laval» 32 000 к. с. н. в."
 SWE_light_tank_equipment_2_short:0 "Strv L-60"
 SWE_medium_tank_destroyer_equipment_2_short:0 "Pvkv m/43"
 SWE_military_independence_desc:0 "Чому [SWE.GetAdjective]і солдати мусять вмирати за [GER.GetNameDef] в Альпах чи Північній Африці, коли є важливіші справи ближче до дому? Ми повинні зберегти нашу військову незалежність і зібратися з силою проти загроз на наших кордонах."
 SWE_mio_trait_booming_domestic_production:0 "Розквіт вітчизняної промисловості"
 SWE_motorized_equipment_1:0 "Volvo TLV 141"
 SWE_nordland_ADJ:0 "Нордичн"
