 SIA_southeast_asia_joint_command_tt:0 "Отримайте:\n$land_mastery_gain_factor_tt$ §G[?SIA_adc_land_mastery_gain_factor_per_country|%]§!\n$research_speed_factor_tt$ §G[?var:SIA_adc_research_speed_factor_per_country|%]§!\n$max_command_power_mult_tt$ §G[?var:SIA_adc_max_command_power_mult_per_country|%]§!\nза кожного члена фракції у нашій фракції."
