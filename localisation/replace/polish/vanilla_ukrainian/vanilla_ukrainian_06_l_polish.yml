 CHI_one_nation_undivided_bypass_tt:0 "§YКожен китайський мілітарист§!: Одне з наведеного має бути істинним: \n  Не існує\n  Воює з §Y[ROOT.GetNameWithFlag]§!\n  Є суб'єктом §Y[ROOT.GetNameWithFlag]§!\n  Перебуває в альянсі з §Y[ROOT.GetNameWithFlag]§!\n  §Y[ROOT.GetName]§!: має §Yмету війни§! проти нього."
