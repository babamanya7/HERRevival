 LAT_free_the_ugonskrusts_desc:0 "До того, як стати «Pērkonkrusts», ми були «Ugunskrusts», пригнічуваним і пригнічуваним попереднім латвійським режимом. Тепер, коли ми вільні, ми можемо звільнити незліченних політв'язнів, які бажали лише."
