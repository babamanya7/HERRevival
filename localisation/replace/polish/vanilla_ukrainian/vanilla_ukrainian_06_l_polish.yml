 HABSBURG_joint_training_initiative_desc:0 "Єдиною армією в той час керувало призначене міністерство. І озираючись назад; воно було погано кероване та відключене від того, що відбувалося на полі бою. Однак ідея була слушною. Якщо ми хочемо працювати спільно, нашим плануванням і організацією також потрібно керувати спільно."
 HAS_GARRISON_WITH_TEMPLATE:0 "§RНе можна видалити цей шаблон, тому що він використовується як шаблон для гарнізонів на деяких окупованих територіях.§!"
