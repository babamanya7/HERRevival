 RAJ_lions_of_the_great_war_desc:0 "Сікхи славляться військовими традиціями та отримали чимало нагород за участь в останній війні. «Пенджабські леви» самостійно сформували свій потужний полк, і в цьому регіоні багато бажаючих влитися до його лав."
 RAJ_madras_ship_repair_factories_desc:0 "Мадрас буде розвинений у ключовий військово-морський центр підтримки зі спеціалізованими ремонтними об'єктами для обслуговування та переобладнання нашого зростаючого флоту, забезпечуючи оперативну готовність на східному узбережжі."
