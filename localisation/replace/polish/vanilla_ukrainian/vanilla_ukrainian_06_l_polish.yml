 GRE_the_election_of_1936_desc:0 "Перші вибори з моменту повернення Георга II на престол мусять пройти до кінця місяця. Георг II більше не має наміру поступатися своїм престолом і, як кажуть, готовий піти на будь-які заходи, щоби зберегти владу."
