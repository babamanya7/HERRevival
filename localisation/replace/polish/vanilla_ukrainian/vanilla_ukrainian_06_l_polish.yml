 CHI_prepare_for_a_change_in_leadership:0 "Підготуватися до зміни керівництва"
 CHI_provoke_border_clashes_desc:0 "Ми поки що не готові ризикувати повномасштабною війною. Невеликий конфлікт дозволить нам просунути свої позиції, уникнувши нищівної поразки. Ідеально було б завдати удару, коли наш противник задіяє свої війська на іншому напрямку."
 CHI_public_education_reform_desc:0 "Науки та знання — фундамент сучасної нації. Спочатку ми мусимо зміцнити його належним чином."
 CHI_reach_out_to_expats:0 "Звернутися до емігрантів"
 CHI_reinforce_connections_with_shanghai_elites:0 "Зміцнити зв'язки з шанхайськими елітами"
 CHI_reinforce_connections_with_shanghai_elites_desc:0 "У Шанхаї є група осіб із великими статками та владою, накопиченими шляхом виходу з тіні й повернення назад. Залучення цих осіб може виявитися корисним для нашої справи."
 CHI_relocate_factories_from_the_coast_tt:0 "Дозволяє переміщення §YВПО§! та §Yфабрик§!"
 CHI_reopen_ledo_road:0 "Заново відкрити дорогу Ледо"
 CHI_rural_reconstruction_movement_desc:0 "Ми досягли значного підвищення якості життя в містах, проте всього за кілька кілометрів від них селяни живуть у середньовічних умовах. Ми мусимо зробити все можливе, щоб кожен наш громадянин міг тішитися результатами спільної праці."
