 DIPLOMACY_REQUEST_FOREIGN_MANPOWER_ACTION_DESC_MORE:0 "Попросити більше іноземних людських ресурсів для заповнення гарнізонів.\nУ нас вже є $NUMBER|H*$ од. людських ресурсів з цієї держави."
