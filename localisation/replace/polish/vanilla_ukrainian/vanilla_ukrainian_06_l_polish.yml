 idea_VEN_blockade_inactive_instant_desc:0 "Іноземні держави можуть заблокувати наші поставки нафти §Yпрофашистським§! державам, якщо мають більш ніж 2 §Yосновні кораблі§! в §YКарибському морі§!.\nПоточний статус: §Gжодної блокади§!"
