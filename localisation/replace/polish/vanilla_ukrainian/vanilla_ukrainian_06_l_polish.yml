 CHI_influence_mongolia_desc:0 "Монґолія виступає буфером між нами та Росією на північному напрямку. Потрібно лише проконтролювати її здатність постояти за себе."
 CHI_invite_foreign_investors_desc:0 "Нехай це і принизливо, але нам доведеться звернутися до наших експлуататорів за допомогою у справі індустріалізації країни."
