l_polish:
 44DescIsNotPuppet:0 "свою країну і свій народ нашому правлінню та стануть нашим суб’єктом"
 4801_non_monarchist_name:0 "Іх Хурее"
 AAT_Sweden.1.b_tt:0 "§RЦе матиме негативні політичні наслідки.§!"
 AAT_Sweden.25.c:0 "Парашутисти стануть найбільш варіантивними силами."
 AAT_Sweden.29.t:0 "[FROM.GetNameDefCap] відхиляє передачу території"
 AAT_Sweden.3.bagge_is_leader:0 "Очевидно, Баґґе поведе нас у майбутнє."
 AAT_Sweden.46.a:0 "Зробіть їх маріонетками."
 AAT_Sweden.9.a:0 "Справді надихає."
 AAT_Sweden_BoP.10.t:0 "Передвиборча кампанія — Економічна політика"
 AAT_Sweden_ball_bearing.1.c_tt:0 "\nЯкщо вони погодяться, [SWE.GetNameDef] зможе вибрати бонус до досліджень §Yкораблів§!, §Yрадарів§!, §Yсинтетичних ресурсів§! або §Yтехнологій підтримки§! в розмірі §G+25%§!."
 AAT_Sweden_ball_bearing.6.desc:0 "Держава [FROM.GetNameDef] люб'язно прийняла нашу торгову пропозицію. Ця угода, безсумнівно, принесе взаємну вигоду нам обом. У дедалі небезпечнішому світі торгівля стає життєво важливим інструментом для зменшення напруженості між суверенними державами."
 AAT_Sweden_communism.7.b:0 "Флюґ відповідає"
 AAT_Sweden_communism.7.desc:0 "Карл Кілбом намагається захопити контроль над партією. Відбувся розкіл партії навпіл: одна частина є прихильниками Флюґа, а інша — Кілбома. Це загрожує руйнацією політичної перемоги, якої ми вже досягли, і якщо так триватиме, ми можемо взагалі втратити владу. Нам треба вирішити, хто поведе державу[SWE.GetName] у світле майбутнє."
 AAT_Sweden_communism__7_tt_2:0 "Це зблизить нас із німцями"
 AAT_Sweden_flashpoints.10.b:0 "Ми підступимо до [SOV.GetAdjective]ого посольства обережно, щоб уникнути ескалації."
 AAT_Sweden_flashpoints.15.a:0 "Трагічно. Ми вдячні нашим [SWE.GetAdjective]им сусідам."
 AAT_Sweden_flashpoints.16.t:0 "Напруга з державою [SWE.GetName] спадає"
 AAT_Sweden_flashpoints.19.a:0 "Вони не лишають нам вибору."
 AAT_Sweden_flashpoints.50.desc:0 "Хоча ми завжди стежили за діяльністю ультралівих, не виключено, що комуністи саботуватимуть нашу армію або сіятимуть невдоволення в ключових галузях промисловості, щоби полегшити [SOV.GetAdjective]е вторгнення в державу [SWE.GetName]. Тому ми мусимо випередити таку діяльність, інтернувавши тих, хто симпатизує державі [SOV.GetNameDef] або має ліві погляди загалом."
 AAT_Sweden_flashpoints.51.b:0 "Це була помилка. Ми мусимо звільнити тих, кого вже арештували."
 AAT_Sweden_flashpoints.61.desc:0 "Уряд держави [GER.GetNameDef] відреагував на різку ескалацію після захоплення нами Landsverk арештом численних активів у своїй країні, які пов'язані з [SWE.GetAdjective]ими національними компаніями. Хоча ми хотіли поступово дистанціюватися від держави [GER.GetNameDef], це рішення викликало обурення серед [SWE.GetAdjective]ої громадськості."
 AAT_Sweden_flashpoints.61.t:0 "[FROM.GetName] арештовує шведські активи"
 AAT_Sweden_flashpoints.62.desc:0 "Сьогодні держава [SWE.GetNameDef] підняла нещодавню напруженість до нової межі, запровадивши торговельне ембарго проти держави [GER.GetNameDef]. Це рішення суттєво вплине на нашу здатність виробляти залізо для військової промисловості."
 AAT_Sweden_flashpoints.71.b:0 "Ми не хочемо шкодити наші стосунки з державою [SWE.GetName]."
 AAT_Sweden_flashpoints.73.desc:0 "[SWE.GetAdjectiveCap]ий уряд чітко дав зрозуміти, що вважає наше викрадення їхніх суден актом війни і що він буде змушений відповісти тим же, якщо ми негайно їх не звільнимо."
 AAT_Sweden_nationalists.1.b:0 "Варто їх підтримати"
 AAT_Sweden_nationalists.20.t:0 "[FROM.GetName] хоче розширити свій контроль."
 AAT_Sweden_nordic_defense_council.3.a:0 "Шкода"
 AAT_USA_events.06.t:0 "[FROM.GetName] відхиляє наші вимоги"
 AAT_britain_narvik.2.a:0 "Як вони сміють?!"
 AAT_britain_narvik.2.desc:0 "[ENG.GetAdjective]і війська перетнули кордон держави [SWE.GetName]. За відсутності оголошення війни та мовчання з боку [ENG.GetAdjective]ого уряду, [SWE.GetAdjective]а влада обурена відсутністю поваги до [SWE.GetAdjective]ого суверенітету. Найбільш вірогідним поясненням цього є те, що [ENG.GetAdjective]і війська намагаються дістатися до шахт в Єлліваре та Кіруні, щоб саботувати їх, щоб запобігти постачанню руди з високим вмістом заліза до держави [GER.GeName], що було б величезним ударом по економіці як [GER.GetAdjective]ій, так і [SWE.GetAdjective]ій, а також значним порушенням [SWE.GetAdjective]ого нейтралітету."
 AAT_finland_continuation_war.08.desc:0 "Уряд держави [FROM.GetNameDef] звернувся до нас із проханням укласти перемир'я, обіцяючи нам подальші територіальні поступки, а також розірвати всі відносини з державою [GER.GetNameDef]. Погодившись на це, ми можемо повністю зосередити увагу на [GER.GetAdjective]їхніх військах і відтіснити їх туди, звідки вони прийшли."
 AAT_finland_continuation_war.10.t:0 "Радянська влада змушує нас вигнати [GER.GetAdjective]і війська"
 AAT_finland_diplomacy.01.a:0 "Непогана ідея!"
 AAT_finland_diplomacy.02.t:0 "[FROM.GetAdjective]о-[ROOT.GetAdjective]ий союз"
 AAT_finland_diplomacy.11.b:0 "[ROOT.GetAdjective]і землі залишаться [ROOT.GetAdjective]ими!"
 AAT_finland_diplomacy.16.a:0 "Ми будемо поважати їхнє рішення"
 AAT_finland_diplomacy.20.b:0 "Вони просто не знають, що ми запланували щодо них"
 AAT_finland_diplomacy.28.desc:0 "[GER.GetLeader], лідер держави [GER.GetNameDef], демонструє свою підступність і відмовляє нам у захисті в обмін на ресурси. Тепер наше майбутнє висить на волосині. Що ж, подивимося, чи виправдаються такі егоїзм і самозакоханість."
 AAT_finland_kinship_war.05.a:0 "Сподіваємося, ця братня війна і справді буде останньою..."
 AAT_finland_national_defense.01.t:0 "[FROM.FROM.GetAdjective]і схованки зі зброєю в області [?FIN_state_with_weapon_caches.GetName]"
 AAT_finland_the_white_death.1.b:0 "Потрібно роздати більше зброї мисливцям"
 AAT_finland_the_white_death.11.a:0 "Не дивлячись ні на що, він істинний фінський герой!"
 AAT_nordic_cooperation.1.b:0 "Вони вже мертві, просто ще про це не знають."
 AAT_norway.1.a:0 "Його треба вберегти від проблем."
 AAT_norway.12.a:0 "Нюґошволд пішов, Андресен прийшов."
 AAT_norway.7.a:0 "Нарешті трішки спокою."
 AAT_norway_communist.1.desc:0 "Століттями до нашої революції помори Північної Росії перетинали Баренцове море, щоб вести життєво важливу торгівлю з нашими [NOR.GetAdjective]ими товаришами на півночі своєї країни.\nТепер вони пропонують нам відродити цю давню традицію, яка, безсумнівно, буде взаємовигідною та зблизить наші комуністичні нації один з одним."
 AAT_norway_communist.6.desc:0 "Здається, їхня довіра до нас була сильно переоцінена. [FROM.GetName], схоже, не бажає допомагати нам збільшувати військове виробництво."
 AAT_norway_fascist.4.a:0 "Ми допоможемо нашим побратимам-фашистам."
 AAT_norway_fascist.5.a:0 "$AAT_norway_fascist.3.a$"
 AAT_norway_monarchist.2.desc:0 "Сталося неймовірне. Після, здавалося б, успішної операції після нещасного випадку на лижах, наш дорогий король Гокон VII помер від медичних ускладнень.\n\nНаша країна зараз переживає один з найтемніших періодів у своїй історії, будемо сподіватися, що принц Олав зійде на престол якомога швидше, щоб привести нашу країну до безпечної гавані."
 AAT_norway_monarchist.5.b:0 "Добре було би зберігати хороші стосунки з сусідами."
 AAT_norway_news.2.b:0 "Одною королівською особою менше!"
 AAT_norway_rikstanken.12.desc:0 "Незважаючи на наше бажання запустити [ROOT.GetAdjective]у танкову програму за допомогою держави [FROM.GetNonIdeologyName], вони відхилили наш запит. Це стане ударом по нашим надіям на модернізацію збройних сил."
 AAT_norway_rikstanken.2.a:0 "Розпочнімо єдиним танком."
 AAT_trotsky_in_mexico:0 "[get_trotsky_lastname] перебуває в державі [MEX.GetName]"
 ABDA_develop_naval_infrastructure_ast_tt:0 "[AST.GetName] отримує §Y2 верфі§! у національному регіоні."
 ABDA_events.3.a:0 "Прикро."
 ABK_SOV_communism_subject_DEF:0 "Автономна радянська соціалістична республіка Абхазія"
 ACE_PILOT_UNASSIGN_HOTKEY:0 "\n§GКлацніть ПКМ§!, щоби відкріпити."
 ACTIVE_MODIFIER_ALERT_ENTRY_HEADER:0 "$NAME|H$ — активно в:"
 ADD_GOAL_DESCRIPTION:0 "Ви справді хочете додати ціль $GOALNAME|H$? Якщо ви хочете її замінити, це коштуватиме £faction_initiative_texticon $COST|.0$."
 ADU:0 "Андалусія"
 AFA_democratic_party:0 "АНДП"
 AFG_abdul_hai_habibi:0 "Абдул Хай Хабібі"
 AFG_aid_king_zahir_cw:0 "Допомога афганському уряду"
 AFG_chaki_dam:0 "Дамба Чак"
 AFG_communist_influence:0 "Підйом комунізму"
 AFG_demand_end_to_democratic_influence:0 "Вимагати припинення демократичного впливу в Афганістані"
 AFG_foreign_advisors_present:0 "Іноземні військові радники"
 AFG_hone_the_shamshir:0 "Заточити шамшір"
 AFG_industrial_events.12.t:0 "[FROM.GetNameDefCap] відхиляє нафтову угоду"
 AFG_industrial_events.32.a:0 "Це здається розумним."
 AFG_industrial_events.36.t:0 "[FROM.GetAdjective] погоджується скасувати зміни Гільменду"
 AFG_industrial_events.56.desc:0 "Як і слід було очікувати, вперті дурні в [FROM.Capital.GetCapitalVictoryPointName] відмовилися передати нам нашу законну територію вздовж кордону. Таким чином, ми повинні або виконати нашу загрозу військового вторгнення, або ризикувати втратити обличчя на міжнародній арені."
 AFG_invite_foreign_corporations:0 "Запросити іноземні корпорації"
 AFG_invite_the_mughal_prince_desc:0 "Зі встановленням контролю над територією новий правитель має прийняти мантію Тимура. Чи то за походженням, заслугами, чи чистою силою волі, вибір, який ми зробимо, сформує майбутнє нашого царства. Таким чином, ми повинні запросити князя Моголів, який зараз проживає в Індії, зайняти наш трон."
 AFG_jezail_production:0 "Виробництво джезаїлів"
 AFG_khyber_pass_riflining:0 "Нарізка Хайберського перевалу"
 AFG_mohammad_gul_khan_momand:0 "Мохаммад Ґуль-хан Моманд"
 AFG_move_the_capital_to_delhi_decision:0 "Перенести столицю до Делі"
 AFG_neutrality_DEF:0 "Афганістан"
 AFG_pashtun_empire_desc:0 "Сьогодні ознаменує історичний момент в історії нашої нації. Під керівництвом [ROOT.GetLeader] ми з гордістю оголосимо про створення Пуштунського панування та початок нової ери для пуштунського народу. Завдяки нашим модернізованим військовим, стратегічним альянсам та амбітній політиці, ми зміцнили нашу позицію як домінуючої регіональної сили."
 AFG_political_events.12.a:0 "Втрачена можливість."
 AFG_political_events.153.b:0 "Навіщо втручатися в такі далекі землі?"
 AFG_political_events.158.desc:0 "У невеликому повідомленні $AFG_faqir_of_ipi$, традиціоналістський племінний лідер у [FROM.GetNonIdeologyName], звернувся до нашого уряду з проханням про підтримку його сходження на трон. Він обіцяє, що за нашої підтримки він створить сильну націю, узгоджену з нашими інтересами."
 AFG_political_events.21.desc:0 "[FROM.GetAdjective] дипломати оголосили, що їхній уряд підтримує нашу пропозицію інвестувати в [ROOT.GetNonIdeologyName]. Інженери та підприємці вже прямують до нас, щоб створити нові галузі промисловості по всій країні."
 AFG_political_events.40.t:0 "[FROM.GetNameDefCap] висуває ультиматум"
 AFG_political_events.43.t:0 "Іноземне втручання в [FROM.GetNameDefCap]"
 AFG_political_events.82.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися"
 AFG_proclaim_a_new_caliphate_2_tt:0 "Відмикає рішення для §YІнтеграції§! заявлених областей, які ми контролюємо"
 AFG_propose_confederation_with_pakistan_desc:0 "Народ [PAK.GetNonIdeologyName] страждав під [ENG.GetAdjective] правлінням надто довго і справедливо боровся за свою незалежність. Однак наші народи мають стільки спільної історії та культури, що має сенс, щоб наші дві нації об'єдналися, перш ніж ми опинимося в суперечках одна з одною."
 AFG_purchase_aircraft_desc:0 "Наші збройні сили надто вразливі до атак з неба. Нам потрібно інвестувати у власні повітряні сили, щоб протистояти ворожим літакам."
 AFG_reactionary_pm:0 "Реакційний прем'єр-міністр"
 AFG_reform_1_desc:0 "Перехід до парламентської демократії не був гладким, і ми повинні більше робити для прищеплення демократичних цінностей наступному поколінню. Таким чином, ми повинні реформувати систему освіти та зробити її більш доступною для всіх дітей по всій нації."
 AFG_remember_the_khost_rebellion_desc:0 "У 1924 році праведні серед нас повстали проти короля Аманулли та його західних поплічників, щоб повернути країну від краю втрати її гордої ідентичності. Можливо, воно було придушене, але його дух живе, і тепер ми знаємо, як подолати Кабул. Настав час повернутися до традицій!"
 AFG_retire_the_uncles_desc:0 "Політична ситуація починає змінюватися в [ROOT.Capital.GetCapitalVictoryPointName] на шкоду старій гвардії. Настав час королю розпустити нинішній кабінет та створити такий, що більше відповідає його власним цілям."
 AFG_secure_iran_desc:0 "Настав час забезпечити [PER.GetAdjective] нафтові родовища. Спільно з нашими союзниками ми зробимо те, що повинні. Навіть якщо це вимагає зміни режиму в [PER.Capital.GetCapitalVictoryPointName]."
 AFG_sov_iran_war_desc:0 "Наші товариші в [SOU.GetNameDef] затиснуті з усіх боків, що заважає їм мати флот для протистояння нашим ворогам. Через їхню неявну підтримку наших ворогів, окупація [PER.GetName] може дати нам нову базу для військово-морських операцій та позбавить нас потенційного ворога."
 AFG_textile_company_idea:0 "Текстиль Хайбера"
 AFG_truck_factory:0 "Фабрика вантажівок Джанагалак"
 AFG_ulugh_beg_academy:0 "Академія Улугбека"
