 SHX_tac_bomber_equipment_3:0 "CAMCO Type 44"
 SHX_zhou_yuanjian:0 "Zhou Yuanjian"
 SIA_CAS_equipment_1_short:0 "Ki-30"
 SIA_a_modern_economy_desc:0 "Старий аграрний лад не зникає за один день, але він більше не може визначати майбутнє [ROOT.GetNameDef]. Оскільки банки, школи, заводи та інфраструктура зараз набувають форми, ми починаємо будувати економіку, гідну незалежної сучасної нації."
 SIA_and_spring_the_trap_tt:0 "Якщо наша загальна підтримка перевищить §Y80%§!, ми уникнемо громадянської війни і миттєво усунемо військових."
 SIA_civil_nationalism:0 "Громадянський націоналізм"
 SIA_civil_service_heroism_desc:0 "Кожному громадянину має бути прищеплений невід'ємний обов'язок захищати верховенство права, якщо будь-яка сила, іноземна чи внутрішня, спробує захопити цю владу для себе. Нам потрібна не лише підтримка народу, якщо хтось спробує відібрати наші свободи, але й щоб сам народ діяв як прапороносець."
 SIA_civilian_wing_label:0 "Цивільне крило"
 SIA_cultivate_civilian_wing_desc:0 "Авторитет, який Директива Бюро Королівського Палацу забезпечила нам в істеблішменті, відкриває двері для терплячого, тривалого залицяння до цивільного крила. Тут немає різкого фаворитизму, здатного викликати протест, лише повільна, наполеглива робота із завоювання прихильності фракції Пріді, поступка за поступкою. Це довгий шлях, але ним можна йти так далеко, як нам заманеться."
 SIA_demand_repatriation_desc:0 "Ті, хто увійшов на нашу землю під приводом необхідності, заборгували [ROOT.GetNameDef]. Коли наші справи покращаться, ми повинні вимагати повернення того, що було взято, і змусити окупанта відшкодувати витрати на його вторгнення."
 SIA_domestic_tin_smelters_desc:0 "Більше недостатньо просто викопувати руду з землі і відправляти її за кордон. Будуючи вітчизняні оловоплавильні заводи, ми зберігаємо більшу частину вартості наших ресурсів вдома і забезпечуємо себе промисловим металом, важливим як для комерції, так і для війни."
