 RAJ_purchase_decomissioned_british_ships:0 "Придбати виведені з експлуатації кораблі"
 RAJ_rebuilding_the_empires_roads_desc:0 "Імперія не може функціонувати без засобів пересування своїх армій, товарів та людей. Занепалі дороги та залізниці, залишені британцями, мають бути розширені та модернізовані."
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry_desc:0 "Поточні темпи індустріалізації недостатні.\nМи повинні надавати пріоритет важкій промисловості та виробництву сталі, якщо хочемо захистити нашу революцію."
 RAJ_reveal_pressure:0 ""
 RAJ_revive_the_screw_guns:0 "Повернутися до розбірних знарядь"
 RAJ_royal_indian_air_force_dlc_desc:0 "Королівські індійські повітряні сили представляють вершину повітряної могутності Індії. Розширення їхніх можливостей за допомогою сучасних літаків та навчання забезпечує домінування в небі, готовність захищати нашу націю та проектувати силу в регіоні."
