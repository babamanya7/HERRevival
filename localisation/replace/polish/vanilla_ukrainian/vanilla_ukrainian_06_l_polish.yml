 RAJ_deathblow_to_imperial_remnants_desc:0 "[PAK.GetName] діє як маріонетка для англійців, причому останні спрямовують їм велику кількість ресурсів у відчайдушній спробі протиставити себе зростаючій хвилі комунізму. Ми нарешті покладемо край цій суперечці."
