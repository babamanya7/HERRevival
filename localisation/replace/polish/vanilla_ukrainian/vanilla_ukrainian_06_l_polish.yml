 ENG_operation_valentine_desc:0 "Ми захистимо Фарерські острови від усіх негараздів війни і зручно розташуємося там на морі і в повітрі, поки не настане момент, коли ми повернемо їх Данії, звільнивши від мерзенного ярма, в яке вони були загнані ворожою агресією, водночас зміцнивши наші власні позиції в Північному морі."
 ENG_raid_category_fluff_text_air_raids:0 "§LБомбардувальне командування Королівських ВПС§!"
 ENG_request_trade_union_construction_worker_support:0 "Звернутися до профспілок за підтримкою будівельників"
 ENG_request_trade_union_factory_worker_support_desc:0 "Ми скористаємося своїми зв'язками та репутацією у профспілках, щоби переконати їх у важливості якнайшвидшого збільшення продуктивності фабрик. Підтримка профспілок дозволить нам мотивувати робітників."
 ENG_self_government_for_the_americas_desc:0 "Країни Америки готові отримати широку автономію в рамках підготовки до повної незалежності. Це, ймовірно, призведе до припливу іммігрантів, які бажають отримати британське громадянство до того, як незалежність буде офіційно оформлена."
