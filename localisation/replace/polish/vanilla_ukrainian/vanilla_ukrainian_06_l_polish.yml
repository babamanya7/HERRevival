 SIA_the_royal_police_counterweight_desc:0 "Королівська поліція діє як незалежна сила і може бути використана проти нашої опозиції, якщо вони спробують захопити владу для себе."
 SIA_under_investigation:0 "Під слідством"
 SIA_unseat_the_government_tt:0 "[ROOT.GetName] покине свою нинішню фракцію і перейде на інший бік у війні, приєднавшись до §YСоюзників§!.\n\nЛоялісти повстануть проти цих змін, спровокувавши громадянську війну.\n\nЯкщо наша спільна підтримка становить §Yбільше 80%§!, ви усунете уряд і уникнете громадянської війни. Наша загальна підтримка становить §Y5%§! за кожного залученого генерала, на додачу до нашої демократичної підтримки.\n\nНаша підтримка від залучених генералів: §Y[?var:SIA_seri_thai_cw_scale|%]§!, а наша демократична підтримка: §Y[?var:party_popularity@democratic|%]§!"
