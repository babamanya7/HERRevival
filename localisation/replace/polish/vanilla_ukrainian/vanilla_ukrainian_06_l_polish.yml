 FIN_communist_cw_trade_unions_tt:0 "- §GЧлени профспілок здійснять диверсійні дії§! проти §YВійськової промисловості§! і §YВерфей§!.\n"
 FIN_expand_imatra_hydropower_plant:0 "Розгорнути гідроелектростанцію Imatra"
 FIN_expand_imatra_hydropower_plant_desc:0 "Гідроелектростанція Imatra, заснована в 1922 році, довела, що є надійним джерелом енергії для зростаючої промисловості [ROOT.GetName]. З розширенням п'ятої та шостої машин потужність станції лише зросте, що дозволить подальше промислове зростання в регіоні [928.GetName]."
 FIN_expand_ship_building_industry:0 "Розширити суднобудівну галузь"
