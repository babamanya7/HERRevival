 CHL_militarize_the_state:0 "Мілітаризувати державу"
 CHL_military_excercises_desc:0 "Збройні сили ще не повністю готові до бою, і їх необхідно інтенсивно тренувати, перш ніж вони зможуть бути корисними, коли настане день гіспанського об'єднання."
 CHL_oskar_schnake:0 "Оскар Шнаке"
