 AST_alp_discount:0 "\n\nПідніміть Голоси вище §Y50%§!, щоб отримати скорочення часу завершення кластерів фокусів §YАЛП§! на §Y5§! днів."
 AST_alp_votes_count:0 "§YАЛП§! має [?AST_alp_votes_var|2Y]§Y%§! Демократичних голосів.\n\nЩоденна зміна: [?AST_alp_votes_change_var|2Y]§Y%§![GET_AST_ALP_PARTY_CAMPAIGN][GET_LABOR_CAMPAIGN_TOUR][GET_AST_COUNTRY_PARTY_SUPPORT_ALP][GET_AST_JAMES_SCULLIN_VOTES][GET_AST_BEN_CHIFLEY_VOTES][GET_AST_MAURICE_BLACKBURN_ALP_VOTES][GET_UAP_VOTES_DAILY_IMPACT][GET_AST_ALP_DISCOUNT]"
 AST_anti_air_equipment_1:0 "QF 3-inch 20 cwt"
 AST_australian_demands_cat:0 "Австралійські вимоги"
 AST_australian_war_cabinet_desc:0 "На вимогу Сполученого Королівства ми створимо власний Воєнний кабінет. Роблячи це, ми зможемо забезпечити ефективне та стратегічне прийняття рішень, дозволивши цьому органу зосередитися виключно на національній безпеці."
 AST_australian_war_cabinet_idea_tt:0 "\nУ стані війни §Y$AST_australian_war_cabinet_idea$§! буде змінено на:\n §Y2§! позамапові §Y$arms_factory$§!"
 AST_bradford_cotton_mills_ic:0 "Bradmill Denim Factory"
