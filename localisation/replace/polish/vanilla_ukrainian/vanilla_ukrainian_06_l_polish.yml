 COG_make_use_of_the_british_proposal:0 "Скористатися британською пропозицією"
 COG_national_committee_for_liberation_desc:0 "Слабкі центристи Конґолезького національного руху здаються задоволеними компромісом щодо незалежності, яка може так і не настати, частково погоджуючись із тридцятирічним планом емансипації бельгійської Африки Жефа Ван Більсена. Ми повинні здійснити напад на колоніальні влади, поки вони не загасили наші вогні!"
 COG_nyim_of_kuba_party:0 "Прихильники ньїма"
 COG_reclaim_loango_desc:0 "Хоча зараз це не так, наша справжня столиця Лоанго знаходиться в [772.GetName], і її потрібно перетворити на величезне місто, якого світ ще не бачив. Першим кроком буде забезпечення її безпеки."
 COG_subject_DEF:0 "$OVERLORDADJ$е Конґо"
 COG_the_arme_populaire_de_liberation:0 "Народна армія визволення"
 COG_the_kingdom_of_kongo_focus_desc:0 "Дім Água Rosada був останнім керівним домом Королівства Конґо в XIX і XX століттях і також був однією з основних фракцій під час Конґолезької громадянської війни. Дом Педро VII, нинішній претендент, тепер знову коронований як король Конґо."
 COG_the_nyim_of_kuba_focus_desc:0 "Королівство Куба існує з 1625 року і у 1884 році було перетворене на регіональне вождинство в Міжнародній асоціації Конґо. Їхнім правителем є Нїм, який наразі є Мбоп Мабінц маМбеки, і він здатний відновити славу нашої нації!"
 COG_transport_plane_equipment_1_short:0 "F.VII"
 COG_tutsi_warrior_training_desc:0 "Наші великі воїни тутсі допомогли нам завоювати сусідні королівства багато років тому. Ми повинні посилити нашу військову службу, щоб тільки найпідготовленіші та найкраще треновані чоловіки могли вступити до наших збройних сил."
