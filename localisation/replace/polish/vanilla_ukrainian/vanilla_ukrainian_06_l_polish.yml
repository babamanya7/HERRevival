 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_MONARCHIST:0 "Натовп доніс до всіх своє м'яке несхвалення правлінням короля за допомогою актів громадянської непокори та загроз громадянської війни. Вороги зараз у вигіднішій позиції, ніж ми, і тому немає нічого соромного в тому, щоби попросити про допомогу наших союзників. Якщо британці та німці будуть за нас, ми не програємо."
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_MONARCHIST:0 "Середземномор'я — наш дім і дім мільйонів інших. Ми завжди прагнули зберегти мир у нашому маленькому куточку Землі, але нашим гідним похвали цілям постійно заважають ті, хто виношує лихі задуми. Що ж, як то кажуть, не можеш перемогти — приєднуйся. Ми вирвемо шматок землі для нашої могутньої Грецької імперії і нарешті вчинимо справедливо з тими, кого постійно принижували."
 GRE_agricultural_communes:0 "Сільськогосподарські комуни"
 GRE_befriend_communists:0 "Подружитися з £faction_gre_communist комуністами"
 GRE_bring_home_the_exiled_republicans:0 "Повернути додому республіканців у вигнанні"
 GRE_byz_republic_fascism:0 "Грецький національний союз"
 GRE_clearing_land_for_industrial_expansion_desc:0 "Пагорби Греції вистелені полями олив, винограду та тютюну, а ще на наших землях чимало церков — спадщини Візантійської імперії. Перших у нас занадто багато, другим же немає місця в новій Греції. Візьмімо землі, що звільнилися, і спорудимо на них фабрики для робітників!"
 GRE_crack_down_on_the_republicans_desc:0 "Ми надто довго потурали венізелістам — час із цим кінчати. У них немає жодної краплі поваги та честі, вони повністю позбавлені моралі, і ми мусимо вигнати цих шкідників із Греції!"
 GRE_defending_our_kingdom:0 "Захист нашого королівства"
 GRE_defending_our_kingdom_desc:0 "У світлі недавніх політичних подій у Європі деякі вчені заявили, що основна загроза державі може йти зсередини. Що за нісенітниця! Наші сусіди, які постійно замишляють і плетуть інтриги проти нас, — ось хто справжня загроза! Ми часто зазнавали поразки, але у наступній війні ми зобов'язані перемогти."
 GRE_defending_our_seas_desc:0 "У Греції дуже довга берегова лінія, ми контролюємо безліч островів. Колись моря були головними нашими захисними рубежами — сьогодні ж вони мало допомагають проти ймовірних ворогів. Якщо противники сподіваються взяти наші острови або висадитися на наші береги, спершу їм доведеться пережити наліт наших морських бомбардувальників!"
