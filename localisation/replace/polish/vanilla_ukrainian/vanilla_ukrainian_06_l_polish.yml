 CHI_decisive_battles_desc:0 "Не всі перемоги мають однакову вагу, як це показала [JAP.GetNameDef] у 1905 році. Ми повинні зосередити наші сили на перемозі в ключових боях, перехопивши ініціативу для удару по Маньчжурії."
 CHI_denounce_feudalism_desc:0 "Хоча ми проголошуємо наш революційний характер, у нашій партії є ті, хто поводиться як землевласники та еліти минулого. Цим старим феодалам потрібно вказати на їхню контрреволюційну поведінку."
