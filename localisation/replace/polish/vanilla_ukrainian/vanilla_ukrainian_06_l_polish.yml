 SWI_fortify_sargans_gotthard_and_st_maurice_desc:0 "Наші Альпи є гордістю [ROOT.GetName], і в ці непевні часи ми можемо зміцнити їх, щоби гарантувати безпеку нашої Конфедерації."
 SWI_german_industrial_investments_desc:0 "Промислова могутність [?SWI.SWI_biggest_fascist.GetNonIdeologyName] незаперечна. Якщо ми хочемо пережити майбутню війну, нам знадобиться власна промислова база, щоб конкурувати та використовувати її як важіль впливу. Інвестиції в нас [?SWI.SWI_biggest_fascist.GetNameDefCap] також означають, що вони матимуть причини зберегти [ROOT.GetNonIdeologyName] недоторканим."
