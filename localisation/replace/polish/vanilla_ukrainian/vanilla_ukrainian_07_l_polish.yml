 GER_claim_old_colonies_in_the_east_tt:0 "Буде надіслано подію §Yчленам альянсу§! та державі §Y[CHI.GetNameWithFlag]§! з запитом контролю над колишніми [GER.GetAdjective]ими колоніями в §YПівденно-Східній Азії§!. Якщо вони відмовлять або територія підпаде від владу країни, яку ми не вважаємо союзником, на оспорені області буде отримано §Yпретензії§!."
