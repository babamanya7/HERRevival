 GOE_RAJ_goa.2.desc:0 "[FROM.GetLeader] вирішив відмовитися від справи та дозволити нам анексувати Гоа, щоб запобігти конфлікту."
 GOE_RAJ_loyalist.14.a:0 "Ми можемо це дозволити."
