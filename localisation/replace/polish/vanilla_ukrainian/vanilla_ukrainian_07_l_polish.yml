 SOL_communism_party:0 "ПНА"
 SOV_GATHERING_STORM_DESC:0 "Коли влігся пил після Громадянської війни в Росії, СРСР установив незаперечний контроль над більшістю земель колишньої Російської імперії. Стрімкі індустріалізація та колективізація були проведені ціною великих людських жертв.\n\nТепер Радянському союзу загрожують зростаюча Німеччина на заході та войовнича Японія на сході. Звісно, також існують внутрішні загрози в лавах Комуністичної партії..."
