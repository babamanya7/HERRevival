 HUN_her_serene_highness:0 "Її Найясніша Високість"
 HUN_infantry_equipment_1_short:0 "FEG 35M"
 HUN_jeno_ratz:0 "Єньо Рац"
 HUN_joint_air_development_desc:0 "Найкращий спосіб розробки нових типів літаків — тісна співпраця з нашими союзниками. Об'єднавши зусилля найбільших умів наших націй, ми досягнемо найкращих результатів."
 HUN_levente_associations_desc:0 "Наш народ сформував парамілітарні молодіжні організації, відомі як Левенте. Під виглядом фізичного та оздоровчого виховання вони готують молодь Угорщини як усередині країни, так і за її межами до майбутніх боїв і відвоювання наших законних земель."
 HUN_magyar_nemzeti_bank_president:0 "Президент Magyar Nemzeti Bank"
 HUN_national_academy_of_sciences_category:0 "[ROOT.GetAdjective]а академія наук"
 HUN_promoted_hungarianism_desc:0 "Для найкращого служіння нашим національним інтересам ми маємо посилити угорський націоналізм і забезпечити, щоб наш народ знав, куди прямує його майбутнє."
 HUN_restauration:0 "Реставрація"
 HUN_roman_catholic_society_idea:0 "Прийняття римо-католицизму"
 HUN_shvoy_kalman:0 "Швой Калман"
 HUN_the_revolutionary_council_desc:0 "Комінтерн припинив боротьбу з імперіалізмом, обравши мирне співіснування. Ми мусимо звільнити робітників усього світу і продовжити справу Маркса та Леніна, навіть якщо нам доведеться виступити проти Радянського Союзу."
 HUN_yevhen_konovalets:0 "Євген Михайлович Коновалець"
 HYD_communism_ADJ:0 "Південноіндійськ"
 HYD_neutrality:0 "Гайдарабад"
 HYD_neutrality_ADJ:0 "Гайдарабадськ"
 ICE_a_naval_hub_in_the_atlantic_desc:0 "Ісландія — це острів. Мати флот як основний вид збройних сил — цілком логічно. Він може зупинити ворогів на шляху до наших берегів, він може підтримати наших союзників у пануванні на морі, і він може доставити експедиційні сили туди, куди їм потрібно. Побудова сильних ВМС є очевидним вибором для Ісландії."
 ICE_communism:0 "Ісландська робітнича республіка"
 ICE_embrace_the_workers_revolution_desc:0 "Підтримка робітників зробила ці зміни можливими. Тому цілком природно, що синдикати, робітники та профспілки повинні зайняти провідні позиції в новій державі. Лідери робітничої революції можуть повести країну до нових висот і принести нам прогрес, набагато більший, ніж будь-коли міг би зробити будь-який монарх."
 ICE_home_defence_corps:0 "Національна оборона"
 ICE_infiltrate_the_british_isles_category:0 "Проникнення на Британські острови"
 ICE_infrastructure_projects_desc:0 "Якщо ця країна хоче стати сильною, перше, що потрібно зробити, — це розбудувати інфраструктуру. Хороша інфраструктура є основою для будь-якого промислового розвитку."
 ICE_international_trade:0 "Міжнародна торгівля"
 ICE_research_cooperation:0 "Дослідницька співпраця"
 ICE_the_armed_forces_of_iceland_desc:0 "Якщо війна прийде до Ісландії, Ісландія повинна бути здатна захистити себе. Ми повинні почати будувати сили, здатні перемогти всякого можливого загарбника. Це невеликий острів із невеликим населенням, але його розташування та розмір можуть бути силою самі по собі, оскільки жоден ворог не зможе виділити великі сили для його захоплення."
 ICE_the_wisdom_of_odin:0 "Мудрість Одіна"
 ICE_we_shall_defend_our_island:0 "Ми захистимо свій острів"
 ICE_we_shall_defend_our_island_desc:0 "Наш острів — наш дім, і ніхто не знає його так добре, як ми. Спеціалізуючи нашу армію на боях у горах, ми могли б відійти від узбережжя і знищити наших ворогів, як тільки вони висадяться на берег і почнуть відчувати себе впевнено і благодушно."
