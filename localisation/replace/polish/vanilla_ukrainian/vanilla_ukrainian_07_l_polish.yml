 ENG_support_imperialist_coup_in_south_africa_mission_2:0 "Повстання в Південній Африці придушене"
 ENG_suppress_imperialist_coup_in_south_africa_desc:0 "Ми боротимемося з заколотом усюди, де він тільки посміє підняти свою потворну голову."
 ENG_the_three_nation_solution_desc:0 "Культурні та релігійні відмінності на Індійському субконтиненті надзвичайно великі. Вже зараз існують антагонізми між різними угрупуваннями з різною лояльністю. Замість об'єднувати їх усіх в одну державу, мабуть, кращим рішенням було б розділити субконтинент на три держави. Індуїстська Індія, мусульманський Пакистан на північному заході і мусульманська Банґладеш на північному сході."
