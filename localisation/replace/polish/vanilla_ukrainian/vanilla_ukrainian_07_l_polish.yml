 SOV_naval_infantry_desc_default:0 "Хоча ми не маємо наміру вторгатися на ворожі береги в імперіалістичних цілях, сили спеціальної морської піхоти можуть бути дуже корисними для здійснення рейдів на ворожі берегові об'єкти і створення загрози для берегової лінії противника."
