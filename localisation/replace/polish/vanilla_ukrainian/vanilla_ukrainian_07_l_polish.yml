 SRL_state_of_ceylon_tag_neutrality_ADJ:0 "Цейлонськ"
 SSB_economic_cooperation_desc:0 "З наближенням загрози військових титанів з усіх боків, потреба в економічній співпраці між членами Саадабадського пакту стає дедалі очевиднішою. Ми повинні відкрити наші ринки одне для одного та знизити наші тарифи, зменшуючи нашу залежність від світових держав."
 SSB_spirit_tooltip:0 "Модифікує §YСаадабадський пакт§!:"
 SS_recruitment_desc:0 "SS на чолі з Гіммлером уважає, що вони мають проводити вербування іноземних добровольців для боротьби з всесвітнім комунізмом. Вермахт, однак, категорично не згоден із цим і не потерпить паралельну структуру командування. Якщо дозволити одній із сторін зайти надто далеко, це призведе до серйозних наслідків.\n\nПоточний §Yнастрій§! ВК Вермахту (OKW): §Y[Root.GetWehrmachtAngerLevel]§! ([?GER.wehrmacht_anger|-0])\n\nПоточний §Yнастрій§! керівництва SS: §Y[Root.GetSSAngerLevel]§! ([?GER.SS_anger|-0])"
 STABILITY_DESC:0 "Стабільність відображає рівень народної підтримки поточного уряду. Високий рівень стабільності спрощує проведення політичних змін і допомагає ефективніше керувати економікою."
