 DOD_hungary.155.desc:0 "Після переговорів із заводом-виробником та представниками влади ми придбали ліцензію на випуск винищувачів нового типу. Механіки вже вивчають тонкощі технічного обслуговування цієї моделі на пробному зразку, а незабаром ми отримаємо повний комплект креслень та схем. в будь-який момент."
 DOD_hungary.162.desc_tac:0 "Міністерство авіації хоче придбати новий середній бомбардувальник для перехоплення цілей на великій відстані та нанесення тактичних повітряних ударів, але міністерство закордонних справ відзначило, що політичні та дипломатичні мотиви також мусять впливати на вибір країни, в якій."
 DOD_hungary.170.desc:0 "Тепер, коли його більше ніхто не підтримує, Тріанонський договір не вартий навіть паперу, на якому надруковано його текст. Більше ніхто не завадить нам озброювати свою армію!"
 DOD_hungary.23.desc:0 "Шведський уряд зважився на крок, який здивував навіть досвідчених дипломатів, і оголосив про те, що вважає наше порятунок справою державної ваги для Швеції. За чутками, в ситуацію втрутився шведський король — він пригрозив зректися престолу, особисто відправитися в Угорщину і вступити в нашу армію, якщо уряд вирішить обмежитися одними лише словами підтримки."
 DOD_hungary.5.desc:0 "Незважаючи на всі зусилля, жителі Австрії вирішили зберегти нинішній статус к-во."
 DOD_hungary.52.t:0 "[ROM.GetNameDefCap] відмовляється здавати Трансільванію"
 DOD_hungary.72.desc_HUN_all:0 "Угорська сторона запропонувала нам свій варіант розв'язання назрілої кризи. Не дивно, що вони зажадали віддати Угорщині всю Трансільванію якнайшвидше. Ми можемо прийняти цю пропозицію, але вона, поза всяким сумнівом, засмутить наших румунських союзників.\n\nМи можемо висунути зустрічну пропозицію, на чому наполягає наш міністр закордонних справ. Обидві сторони набагато швидше погодяться на компромісний варіант."
 DOD_hungary.93.t:0 "Угорщина пропонує новий розділ Югославії"
 DOD_hungary.95.desc:0 "\nПісля кількох раундів переговорів нам не вдалося дійти згоди з [From.GetAdjective]ою владою з питання реорганізації Югославії. Послання, яке підписав особисто [From.GetLeader], каже: всі територіальні суперечки слід вирішувати на двосторонній основі, «коли цього вимагає ситуація»."
 DOD_hungary.96.desc_HUN_both:0 "Наше небажання виконати вимоги Угорщини не стримало амбіції Будапешта. Дратівливу риторику, що звучить з угорської столиці, тепер повторюють не менш лякаючі заяви Риму та Берліну. Посли трьох держав разом прибули до міністерства закордонних справ, щоби вручити ноту з вимогою передати Воєводіну, Словенію та Далмацію кожному з відповідних заявників."
 DOD_romania.1.a:0 "Це розумне прохання."
 DOD_romania.53.t:0 "[From.GetNameDefCap] пручається"
 DOD_romania.69.a:0 "Відступити."
 DOD_romania.81.desc:0 "Маґда Лупеску, коханка короля Кароля II, за чутками, придбала нову віллу в дорогому передмісті Бухареста. Усі запитують, звідки в неї взялися такі кошти. У закордонній пресі з'явилися нові докази того, що сам король виділив із скарбниці гроші на придбання вілли.\n\nРозгоряється скандал, і ми маємо виступити з офіційною заявою з цього приводу якнайшвидше."
 DOD_romania.82.a:0 "Наклепи є кримінальним правопорушенням."
 DOD_romania.85.b:0 "Король їздить відпочивати до Ніцци щороку."
 DOD_yugoslavia.2.t:0 "Переворот у державі [YUG.GetNameDef]"
 DOD_yugoslavia.36.b:0 "Вони ніколи ні на що не впливали, і так буде завжди."
 DOD_yugoslavia.50.desc:0 "Політики давно обговорюють питання одруження і спадкування в державі [YUG.GetName]. Довга відсутність на троні законного короля ставить під сумнів легітимність правління Карагеоргієвичів. Однак на недавньому званому прийомі в Лондоні серце Члени королівського кабінету вже обговорюють весільні плани. Без сумніву, вибір королівської дружини матиме тривалий дипломатичний вплив на нашу націю і може вплинути на ставлення до Югославії інших держав."
