 sp_naval_super_heavy_battleship_unique_reward_a:0 "Питання пріоритетів: напад"
 sp_nuclear_bomb_desc:0 "Бомба, що використовує процес поділу ядра для вивільнення накопиченої енергії атома в один апокаліптичний момент. З такою зброєю в нашому арсеналі, хто наважиться виступити проти нас?"
 sp_nuclear_bomb_design_choice_reward:0 "Простий або складний дизайн бомб"
 sp_nuclear_major_political_interference_generic_reward_desc:0 "Проєкт «[SpecialProject.GetName]» опинився під посиленою увагою та втручанням із боку політичних лідерів, що спричинило затримки та, можливо, змусило змінити керівництво проєкту. [Character.GetName] лютує з цього приводу. Нам потрібно вирішити ці політичні проблеми, щоби продовжити роботу над проєктом."
 sp_nuclear_project_events.1.desc:0 "Зовсім випадково нашим агентам у державі [FROM.GetNameDef] вдалося роздобути інформацію про проєкт, який, вочевидь, є таємним. Працівник, який брав участь у розробці секретної зброї, атомної бомби, розповів про свою роботу на невеликій вечірці, де також був присутній один з наших агентів."
 sp_nuclear_reactor_tested_reward_public_tt:0 "Інші країни можуть отримати з цього вигоду."
 sp_nuclear_warheads:0 "Ядерні боєголовки"
 sp_rockets_ground_to_air_missile_desc:0 "Велика зенітна ракета на ракетному двигуні, здатна збити бомбардувальник із неба одним влучанням. Це, безумовно, визначить майбутнє протиповітряної оборони."
