 ETH_cie_fascist:0 "Ferrovie Imperiali Etiopiche"
 ETH_communal_agriculture_desc:0 "Колективізуючи сільське господарство та запроваджуючи нові методи ведення сільського господарства, ми можемо значно збільшити нашу сільськогосподарську продукцію та гарантувати кожному доступ до їжі. Це також дозволить емансипованим селянам знайти альтернативну роботу в містах замість натурального господарства."
