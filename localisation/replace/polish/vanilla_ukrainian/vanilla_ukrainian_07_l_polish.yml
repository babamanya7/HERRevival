 BUL_bs_values:0 "\n\n§YЛояльність§! фракції [GetBsName]: [?BUL.BUL_bs_loyalty|+0]\n§YПопулярність§! фракції [GetBsName]: [?BUL.BUL_bs_popularity|+0]"
 BUL_bzns_name_gen:0 "£faction_bul_bzns §YЗемлеробського союзу§!"
 BUL_cooperation_appoint_zveno_members_desc:0 "Фракція [GetZvenoName] довела, що складається з компетентних людей, у яких багато цікавих ідей та ініціатив. Ми запропонуємо його найвидатнішим лідерам посади в уряді."
 BUL_cooperation_nsm_speech:0 "Дозволити промови $BUL_nsm_name_gen$"
 BUL_cooperation_with_italy_desc:0 "Італійці неодноразово виявляли свій економічний інтерес до нашої країни, не можна забувати і про королівський шлюб між царем Борісом і принцесою Джованні. Ми зміцнимо з ними як дипломатичні, так і економічні відносини, оскільки найближчим часом вони можуть стати сильним союзником на Балканах."
