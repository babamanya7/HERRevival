 SPA_sway_leader_loyalty_desc:0 "Маючи правильні засоби переслідування, ми цілком можемо розширити нашу підтримку серед провідних офіцерів іспанської армії. Їхня підтримка, коли прийде час, може виявитися неоціненною."
 SPA_the_army_of_africa_model_desc:0 "Успіхи Африканської армії в громадянській війні не залишилися непоміченими. Наша нова армія повинна відповідати встановленим нею стандартам, тому ми будемо моделювати її за їхнім прикладом."
