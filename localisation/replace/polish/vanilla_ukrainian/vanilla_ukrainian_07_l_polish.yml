 denmark_expansion_event.1.desc:0 "[DEN.GetAdjective]ий уряд висунув нам ультиматум, вимагаючи, щоб держава [ICE.GetNameDef] підпорядкувалася їхній країні та увійшла до її складу. Нам потрібно бути обережними, адже наша відповідь може вплинути на майбутнє держави [ICE.GetNameDef] як незалежної країни, а то й, у гіршому випадку, наблизити нас до війни."
