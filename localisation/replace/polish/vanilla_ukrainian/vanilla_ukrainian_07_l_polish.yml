 TUR_downgrade_fundamentalist_defiance_effect_tt:0 "£faction_tur_traditionalist §YТрадиціоналісти§! більше співпрацюватимуть з урядом в області §Y[TUR_fundamentalist_state.GetName]§!."
 TUR_embrace_military_tradition:0 "Прийняти військові традиції"
 TUR_end_the_british_hegemony:0 "Закінчити британську гегемонію"
 TUR_halk_ve_devlet_desc:0 "Народ і держава — ось у чому пріоритет нашого кемалістсько-соціалістичного руху. Ми мусимо захищати і охороняти свій народ, і найкраще це вийде, якщо ми підсилимо державу в усіх аспектах."
 TUR_integrate_german_officers_into_the_army_desc:0 "Тепер, коли немає потреби приховувати роль німецьких військових представників у нашій країні, ми офіційно інтегрували їх у нашу командну ієрархію. Свою пряму згоду на це дав сам [GER.GetLeader]."
 TUR_invoke_the_methods_of_mehmed_ii_desc:0 "У Мехмеда II ми навчилися тому, що немає нерозв'язних проблем є лише недостатньо великі гармати."
 TUR_issue_an_ultimatium_to_the_bulgarians:0 "Висунути ультиматум болгарам"
 TUR_jet_tac_bomber_equipment_2:0 "MKEK-10"
 TUR_kazim_ozalp:0 "Казім Езалп"
 TUR_kemalist_army_officers_minimal_power_disloyal:0 "Офіцери-кемалісти"
 TUR_kurdish_resistance_escalation_mission_desc:0 "Повстанці-курди знову нарощують протидію уряду на південному сході країни."
 TUR_placate_fundamentalist_state_effect_tt:0 "£faction_tur_traditionalist §YТрадиціоналісти§! зупинять поширення антиурядової риторики в області §Y[TUR_fundamentalist_state.GetName]§! і стануть закликати до активної співпраці."
 TUR_populism_decision_desc:0 "Для будь-якого відповідального уряду народ завжди має бути пріоритетом номер один. Це незаперечно."
 TUR_reappropriated_exploitative_finance:0 "Перепривласнені експлуатаційні фінанси"
 TUR_reclaim_macedonia_desc:0 "Невдячні пси, які живуть на захід від нас, відіграли важливу роль у падінні останньої імперії Османа. Греки ненавиділи нас із тих самих пір, як ми розібрали їх жалюгідну і немічну імперію на частини, і тепер вони утримують у себе, відібравши у нас, більшу частину Фракії та Македонії. Час врятувати наших товаришів, заодно помстившись ворогам..."
 TUR_renew_the_turkish_soviet_non_aggression_pact:0 "Поновити радянський пакт про ненапад"
