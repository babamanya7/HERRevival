 FRA_destroyer_2_desc:0 "Есмінці типу Le Fantasque були по суті вдосконаленими версіями попередніх супересмінців 2400-тонної серії (Guépard, Aigle, Vauquelin), побудованих за військово-морською програмою 1930 року. Це були великі, важкоозброєні та дуже швидкі міноносці, ідеальні для супроводу нових швидкісних підрозділів французького флоту. Їхнє озброєння складалося з нещодавно розроблених гармат, адекватного зенітного та торпедного озброєння."
