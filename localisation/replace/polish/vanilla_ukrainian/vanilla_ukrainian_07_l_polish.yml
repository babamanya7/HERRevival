 SOV_socialist_realism_desc:0 "Шлях до світлого соціалістичного майбутнього довгий і часто вітряний. Деякі люди можуть навіть втратити надію на те, що ця мета може бути досягнута. Ми мусимо показати їм, до чого саме вони прагнуть, просуваючи стиль мистецтва, який показує, яким насправді буде життя в соціалістичній країні."
