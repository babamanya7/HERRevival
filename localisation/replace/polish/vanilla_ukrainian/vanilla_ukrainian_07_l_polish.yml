 RULE_OPTION_ETH_FRAGMENTED_DESC:0 "Ефіопія буде розділена на регіональні держави, з яких складається."
 RULE_OPTION_GER_ALT_FASCIST_AI_DESC:0 "Німецький ШІ спробує замінити Гітлера одним із членів внутрішнього кола, прислухається до занепокоєнь фон Нойрата та спробує впровадити свій новий світовий порядок."
 RULE_OPTION_GOE_INDIA_MUGHAL_RAJ_AI_DESC:0 "Індія намагатиметься утворити Імперію Великих Моголів."
 RULE_OPTION_HISTORICAL_PRC_AI_DESC:0 "§HКомуністичний китайський§! ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_OPTION_INDEPENDENCE_DEM:0 "Новий Бейянський уряд"
 RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0 "§HРПМО§! та їхні союзники-анархісти скинуть ярмо сталінізму і шукатимуть власний шлях незалежного комунізму після громадянської війни."
 RULE_OPTION_MONARCHIST_PHI_AI_DESC:0 "На Філіппінах результати виборів будуть скасовані, до влади прийде $PHI_neutrality_party_long$, а згодом у країні розгориться війна за незалежність за підтримки дружніх гіспанських країн, після чого Філіппіни стануть монархією."
