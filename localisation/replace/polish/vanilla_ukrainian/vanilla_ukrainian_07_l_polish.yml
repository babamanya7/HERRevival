 CHI_accelerate_the_tutelage_desc:0 "Ґоміньдан не зміг виконати обіцянки Сіньхайської революції та доктора Суня. Замість того, щоб навчати населення демократії, вони експлуатували його заради особистої вигоди. Ми повинні надолужити згаяний час."
 CHI_artillery_equipment_1:0 "75mm Type 10 Gan"
