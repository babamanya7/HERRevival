 ENG_replace_government_in_new_zealand_fascism_desc:0 "Народ Нової Зеландії готовий змінити уряд на... більш прихильне до нашого фашистського правління."
 ENG_self_government_for_the_mediterranean:0 "Самоврядування в Середземномор'ї"
