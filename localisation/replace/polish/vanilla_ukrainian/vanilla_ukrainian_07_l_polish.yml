 MAN_recruit_bandits_generic_desc:0 "Наші в'язниці та робочі табори заповнені тими, хто бився проти нас. Для боротьби за свободу нам потрібні кожний солдат і кожна гвинтівка. Імператор має можливість проявити свої легендарні милосердя та благодать, давши цим злочинцям можливість виправитися шляхом військової служби."
