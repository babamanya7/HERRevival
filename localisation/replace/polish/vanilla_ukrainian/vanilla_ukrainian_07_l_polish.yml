 JAP_nationalize_suzuka_naval_arsenal:0 "Націоналізувати морський арсенал Сузука"
 JAP_naval_faction_tier_3_greater_2:0 "$JAP_imperial_influence_tier_3$ $JAP_naval_faction$"
 JAP_nuke_2:0 "Зроблено другий ядерний удар по Японії"
 JAP_range_focus_desc:0 "Тихоокеанський театр бойових дій — це великі відстані. Нам потрібні моделі, здатні долати їх під час виконання завдань."
 JAP_redistribute_wealth_and_collectivize_farms_decision:0 "Перерозподілити багатство та колективізувати ферми"
 JAP_reform_the_army_desc:0 "Граф Хісаїчі Тераучі, генерал, який стрімко підіймається службовими сходами нашої армії, запропонував переглянути наші армійські доктрини. Він вважає старі доктрини грандіозного штурму застарілими, стверджуючи, що на майбутніх полях битв домінуватиме більш мобільний тип війни. Ми повинні прислухатися до його поради й переконатися, що не відстаємо від часу."
 JAP_remove_the_weeds_from_the_crop:0 "Виполювання бур'янів з урожаю"
 JAP_return_of_the_manchukuo_exiles_desc:0 "Багато теоретиків соціалізму та економістів виїхали працювати в різні синдикалістські кооперативи та інші галузі промисловості, створені в Маньчжурії після її завоювання Квантунською армією, сподіваючись утвердити там революційну думку, хоча це тривало недовго. Ми повинні домогтися від тимчасового прем'єр-міністра сприяння поверненню цих осіб в обмін на вислання деяких генералів."
 JAP_send_jodbajab_to_mongolia_decision:0 "Відправити Джодбажаба до Монґолії"
 JAP_shadow_shogun:0 "Тіньовий шьоґун"
 JAP_silver_wheels:0 "The Silver Wheels"
 JAP_spiritual_mobilization_decisions_desc:0 "[ROOT.GetAdjective]ий народ непохитний і готовий підтримати наш уряд у кожному рішенні, якщо буде надана достатня мотивація. Ми повинні мобілізувати населення, як духовно, так і фізично, щоб воно могло зробити свій внесок у військові зусилля."
 JAP_spiritual_mobilization_desc:0 "Ми можемо збільшити кількість новобранців, наголосивши на тих аспектах шінтоїзму, які закликають до почуття обов'язку нашого народу."
 JAP_state_under_army_control:0 "Під контролем Імператорської армії"
 JAP_strengthen_civilian_government_desc:0 "Зростання впливу демократії та лібералізму — не просто загроза нашій нації, але, можливо, її найбільша сила. Наш уряд має стати на захист цих ідеалів."
 JAP_strike_south_doctrine:0 "Доктрина удару на південь"
 JAP_submarine_3_desc:0 "Човни класів «Ko-gata», «Otsu-gata» і «Hei-gata» були великими крейсерськими підводними човнами, які слугували командними кораблями для ескадри підводних човнів. Вони були оснащені складним радіообладнанням, важким торпедним озброєнням, а їх великі розміри означали великий радіус дії. Підводні човни класів «Ko» і «Otsu-gata» також несли на борту плавучі літаки для розвідки."
 JAP_sway_disillusioned_young_officers:0 "Схилити розчарованих молодих офіцерів"
 JAP_tachikawa_aircraft_company_organization:0 "$tachikawa_aircraft_company$"
 JAP_takeo_takagi:0 "Такео Такаґі"
 JAP_test_the_soviets_desc:0 "Ми маємо довгий кордон із державою [SOV.GetNameDef] у Кореї та Маньчжурії. Існує велика кількість можливих гарячих точок, де наші сили можуть зіткнутися будь-якої миті. Для нас це створює можливість перевірити [SOV.GetAdjective]у реакцію на незначну провокацію."
 JAP_the_eternal_kingdom_tt:0 "Цей дух зникне, якщо прогрес нашої капітуляції досягне §Y50%§!"
 JAP_the_fate_of_the_imperial_family_desc:0 "Настав час поставити крапку історія спадкової системи правління. Нам належить вирішити долю імператора та його сім'ї."
 JAP_the_great_spiritual_evil:0 "Велике духовне зло"
 JAP_the_great_spiritual_evil_opm:0 "Непохитна антикомуністична позиція"
 JAP_the_jeweled_spear_has_struck:0 "Коштовний спис ударив"
 JAP_the_metal_collection_order_desc:0 "У нашій країні стрімко вичерпуються стратегічні матеріали, включно зі звичайними металами. Тому ми повинні видати Імператорський указ Nº 667 з метою збору металів, що належать державному та приватному секторам, щоб компенсувати інтенсифікацію воєнної ситуації та дефіцит матеріалів."
 JAP_the_peoples_state_decisions_desc:0 "Імперське правління та феодалізм незабаром підуть у минуле. Настав час для простої людини керувати власною долею і вести себе до мети остаточного порятунку свого народу."
 JAP_tohokai_sympathies:0 "Симпатії до Тохокай"
 JAP_ultimate_deterrence_desc:0 "Найкращий спосіб захистити наших громадян — зробити все можливе, щоб їм не довелося брати участь у війні. У цьому нам допоможе розробка нової зброї колосальної руйнівної сили."
 JAP_west_pacific_treaty_org_allied_trade_cat:0 "Торговельні угоди з союзниками"
 JOIN_CANTCONNECT_RESOLUTION:0 "На даний момент неможливо обробити цей запит на приєднання. Ви мусите знаходитись у головному меню або в екрані гри в мережі, щоби прийняти запит на приєднання"
