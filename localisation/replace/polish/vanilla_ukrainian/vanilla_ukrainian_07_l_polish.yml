 SWI_pre_empt_anschluss_desc:0 "Ходять чутки, що [GER.GetNameDef] хоче анексувати [AUS.GetName] в ім'я єдності [GER.GetAdjective]. Це не те, що [ROOT.GetNAMEDef] може дозволити, оскільки це дасть змогу [GER.GetNameDef] робити ті самі заяви щодо наших німецькомовних кантонів. Ми повинні поспішити й підготувати основу для захисту всього [AUS.GetName]."
 SWI_president_matches_country_politics_TT:0 "§YПрезидент Конфедерації§! збігається з політикою країни"
 SWI_pro_helvetia_idea_desc:0 "Щоб Швайцарія вижила, вона має бути окремою країною від мов, якими всередині неї говорять. Ось чому Pro Helvetia має завдання просувати швайцарські цінності та відповідну відданість демократії, яка з ними пов'язана."
 SWI_purchase_american_planes:0 "[SWI_purchase_democratic_planes_title]"
 SWI_rig_infrastructure_to_blow:0 "Налаштувати інфраструктуру на підрив"
 SWI_spirit_of_resistance_desc:0 "Серця та уми людей [ROOT.GetName] є найважливішим фронтом у битві за наше виживання. Ми повинні переконатися, що кожен [ROOT.GetAdjective]ий громадянин готовий боротися до кінця, навіть коли все здається втраченим."
 SWI_spirit_of_resistance_idea:0 "Швайцарський дух опору"
 SWI_swiss_ship_designs_desc:0 "Ми можемо не мати великого досвіду в проєктуванні та виробництві придатних для мореплавства військових суден, але чим раніше ми почнемо, тим швидше ми зможемо відстоювати свої позиції серед старих і великих морських держав, таких як [ENG.GetNameDef] і [ITA.GetName]."
 SWI_the_new_eidgenossenschaft_desc:0 "У 13 столітті лідери трьох кантонів-засновників присягнули на вічний союз, який ми звемо Eidgenossenschaft. Настав час його оновити, щоби ми могли розширити його і більше кантонів могли відчути нашу демократичну конфедерацію."
