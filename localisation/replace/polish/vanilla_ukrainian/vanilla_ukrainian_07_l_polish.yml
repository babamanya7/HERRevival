 MTG_naval_treaty.2.desc:0 "Уряд лідера [From.GetLeader] погодився на взаємне обмеження флоту. Щойно встигли висохнути чорнило на договорі, як розпочала свою роботу комісія з контролю — вона перевірити, чи відповідає будівництво кораблів новим обмеженням."
 MUN_czech.1020.d:0 "З [FROM.GetNameDef] прибули дипломати з планом угоди, за якою їхня країна інвестуватиме в нашу промисловість та інфраструктуру в обмін на угоду щодо ресурсів. Цей крок, зроблений після невдалих інвестицій у попередні роки, свідчить про відновлення зусиль щодо покращення наших відносин."
 MUN_czech.1024.d:0 "Після того, як прикордонні сутички в Сілезії переросли в повномасштабну війну, [FROM.GetNameDef] тепер заявила про свою готовність припинити конфлікт, якщо територія, на яку вона претендує, буде їй передана."
 MUN_czech.1043.t:0 "[FROM.getname] вимагає, щоб ми приєдналися до їхньої федерації"
 MUN_czech.1046.d:0 "Оскільки ми вирішили багато проблем всередині країни, напруга в нашій нації, здається, спадає. Після завершення багатьох економічних та соціальних програм наша країна тепер, схоже, починає зцілюватися."
 MUN_czech.1049.d:0 "Новий [FROM.GetAdjective]ий уряд звернувся до нас із пропозицією про створення альянсу. Незважаючи на початкову антинімецьку позицію їхнього нового військового уряду, схоже, вони виявили прагматизм і визнали, що їхні старі міжнародні партнери ненадійні."
 MUN_czech.1054.a:0 "Ми повинні розширюватися, щоб протистояти експансії інших"
 MUN_czech.1055.t:0 "[SOV.GetAdjective]і добровольці прибувають"
 MUN_czech.4.d:0 "Нещодавні новини про військову агресію проти нас вразили уряд до глибини душі. [CZE.GetLeader] втратив віру в здатність свого уряду провести країну через цю кризу. Він вимагає, щоб $CZE_jan_syrovy$ взяв ситуацію під контроль і очолив країну. $CZE_jan_syrovy$ заявив, що не має бажання керувати державою, однак, з огляду на обставини, [CZE.GetLeader] відповів, що той не має іншого вибору, окрім як взяти на себе командування і провести нас через цю кризу."
