 IRQ_encourage_federalism_desc:0 "Ми повинні надати певну автономію курдам та ассирійцям, а також легалізувати місцеві мови та практики по всій нашій країні, щоб об'єднати всіх іракських громадян під одним прапором."
 IRQ_establish_iraqi_coastal_defense_force_KUR:0 "Створити Курдські сили берегової оборони"
 IRQ_fawsi_al_kaukji:0 "Fawzi al-Qawuqji"
 IRQ_flood_the_plains_desc:0 "Євфрат і Тигр протягом століть були основою нашої економіки та існування. Однак масштабні іригаційні роботи, проведені за останні десятиліття, дають нам можливість контролювати потік їхніх приток. Координоване затоплення може перетворити низинні землі на захисне болото на обмежений час."
 IRQ_form_the_independent_mechanized_brigade_desc:0 "З придбанням відповідного обладнання та великою кількістю тренувань, наші збройні сили вважають, що готові розгорнути та використовувати свої перші механізовані підрозділи."
 IRQ_greater_iraq:0 "Великий Ірак"
 IRQ_hashemite_arab_federation_fascism_DEF:0 "Великий Арабський Союз"
 IRQ_kurdish_support_resistance:0 "Підтримати опір за кордоном"
 IRQ_kurdistan_events.1.a:0 "Звичайно, ми допоможемо!"
 IRQ_kurdistan_events.2.t:0 "[FROM.GetNameDefCap] погоджується допомогти нам"
 IRQ_kurdistan_tag_democratic_DEF:0 "Курдистан"
 IRQ_maruf_al_rusafi:0 "Маруф ар-Русфі"
 IRQ_mechanized_equipment_2_short:0 "Universal Carrier"
 IRQ_motorized_equipment_0:0 "Austin K5"
 IRQ_political_events.21.t:0 "[FROM.GetNameDefCap] вимагає контролю над [454.GetName]"
 IRQ_political_events.23.desc:0 "Розуміючи, що ситуація є нежиттєздатною для їхніх сил, [ENG.GetAdjective] уряд погодився вийти з [454.GetName] та передав нам владу над регіоном."
 IRQ_political_events.41.t:0 "[FROM.GetNameDefCap] має намір передати нас"
 IRQ_political_events.61.desc:0 "[FROM.GetNameDefCap] погодився на нашу пропозицію миру. Умови вимагають від нас підкоритися [FROM.GetAdjective] владі, що призводить до припинення конфлікту. Хоча війна закінчилася, це рішення може спричинити внутрішні заворушення, оскільки ті, хто боровся за суверенітет та незалежність, зіткнуться з відновленням іноземного контролю над нацією."
 IRQ_sp_rockets_ground_to_air_missile:0 "Проєкт «Al Arq»"
 ITA_FRA_must_control_necessary_states_tt:0 "§Y[FRA.GetNameWithFlag]§! не контролює історичні французькі колонії в Джібуті та Тунісі"
 ITA_air_innovations_bba_desc:0 "Війна в повітрі стала однією з вирішальних областей сучасної війни. Ми не можемо дозволити собі пасти задніх у цій вирішальній області."
 ITA_all_roads_lead_to_rome_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_SUPPLY_NODE_RANGE$: §G+10%§!\n\n"
 ITA_anglo_italian_pact_desc:0 "Військове співробітництво з британцями пішло нам на користь, зарівно як піде і пакт про ненапад. Такий пакт захистив би значну частину наших африканських володінь, що дозволило б нам звернути свій погляд в інше місце."
 ITA_anglo_italian_tech_sharing_name:0 "Англо-італійська військова програма"
 ITA_anti_air_equipment_1:0 "Cannone-Mitragliera da 20/65"
 ITA_battle_cruiser_1:0 "Клас «Caracciolo»"
 ITA_battleship_1:0 "Клас «Conte Di Cavour»"
 ITA_bop_cooperation_with_christian_democrats:0 "£BoP_right_texticon Співпраця з християнськими демократами"
 ITA_bop_praise_the_airforce_desc:0 "Мужні чоловіки та жінки, які служать у нашій авіації, є основою безпечної та стабільної держави [ITA.GetName]. Вони заслуговують на обожнювання італійського народу!"
 ITA_bop_resign_ministry_of_foreign_affairs_position:0 "£BoP_left_texticon Залишити посаду в Міністерстві закордонних справ"
 ITA_bop_take_over_ministry_of_education_desc:0 "Призначення себе міністром державної освіти дозволить Беніто Муссоліні здійснювати прямий контроль над освітньою системою та установами Італії."
 ITA_brescia_small_arms_industry_desc:0 "Італійська стрілецька зброя відома у всьому світі своєю високою якістю. Але ми також мусимо забезпечити достатню кількість найсучасніших видів зброї, якщо хочемо, щоби наші солдати могли перевершити будь-якого ворога на полі бою."
 ITA_claims_on_turkey_bba_desc:0 "$ITA_claims_on_turkey_desc$"
 ITA_cooperation_programs_deal_others_tt:0 "([ROOT.GetEscortShipsSender]): Переміщує §Y2 Есмінці класу Curtatone§! та §Y2 Есмінці класу Maestrale§! до [ROOT.GetEscortShipsReceiver]."
 ITA_cv_nav_bomber_equipment_2:0 "Savoia-Marchetti SM.84-II"
 ITA_defy_the_duce:0 "Кинути виклик дуче"
 ITA_democratic_medium_control_range:0 "Домінування соціалістів у політиці"
 ITA_diving_bombers:0 "Пікіруючі бомбардувальники"
 ITA_divino_duce_2_desc:0 "$ITA_divino_duce_1_desc$"
 ITA_enlist_the_bashkimi_kombetar:0 "Завербувати Bashkimi Kombëtar"
 ITA_fighter_equipment_2:0 "Macchi C.202 Folgore"
