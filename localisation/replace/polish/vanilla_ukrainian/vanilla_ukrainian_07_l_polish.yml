 GER_gunther_von_kluge:0 "Ґюнтер фон Клюґе"
 GER_high_seas_fleet_desc:0 "Наша амбіційна мета — зробити державу [ROOT.GetNameDef] справді глобальною державою. Для цього нам потрібно відродити Hochseeflotte, або Флот відкритого моря, який колись майже конкурував з Королівськими ВПС за панування в океанах."
 GER_hilfskreuzer_cat_desc:0 "Позбавлення наших ворогів сировини та важливих ресурсів значно скоротить війну і гарантуватиме нам перемогу. Тому надзвичайно важливо, щоб ми мали достатньо рейдових суден, здатних потопити торгівельний флот противника, навіть якщо це вимагатиме переобладнання наших власних конвоїв під військові кораблі для участі в рейдах."
 GER_improve_motorized_troops:0 "Поліпшити моторизовані війська"
 GER_increased_trade:0 "Збільшена торгівля"
 GER_increased_trade_desc:0 "Якщо німецький народ хоче процвітати, ми мусимо імпортувати те, що не можемо видобути або збудувати в межах наших власних кордонів. Ми мусимо поглянути назовні та підписати нові торговельні угоди з іншими країнами – угоди, звісно, вигідні для нас."
 GER_influence_nordics_decision:0 "$GER_influence_baltics_decision$"
 GER_inner_circle_himmler.00.a:0 "Пріоритет — Ваффен-СС"
 GER_innovative_warfare:0 "Інноваційна війна"
 GER_japan_friend_desc:0 "У нас із Китаєм були довгі та плідні відносини, але на користь нашим амбіціям більше може піти поліпшення відносин із більш рідною нам воїнською культурою Японії, навіть якщо це значить згодувати Китай вовкам..."
 GER_konrad_adenauer:0 "Конрад Аденауер"
 GER_light_tank_aa_equipment_1:0 "Flakpanzer I"
 GER_light_tank_aa_equipment_3:0 "Flakpanzer 1602"
 GER_mefo_bills_desc:0 "Векселі «MEFO» — боргові зобов'язання, створені Ялмаром Шахтом на фінансування державних програм переозброєння. Формально вони були оформлені через підставну компанію Metallurgische Forschungsgesellschaft, щоби приховати програму від Франції та Британії. Векселі мусять продовжуватися кожні шість місяців. У іншому випадку, коли підійде термін, власникам доведеться виплатити вартість векселів."
 GER_mio_trait_kilian_submarine_bunker:0 "Бункер для підводних човнів «Кіліан»"
 GER_mio_trait_raider_doctrine:0 "Рейдерська доктрина"
 GER_modify_wunderwaffen_modifier_tt:0 "Змінити §Y$GER_wunderwaffen_modifier$§! на:"
 GER_monroe_doctrine_USA_sway_ideology:0 "Посилити підтримку ідеології [ROOT.GetRulingIdeology] в [FROM.OWNER.GetNameDef]"
 GER_national_revitalization:0 "Національне відродження"
 GER_naval_bases_along_atlantic_coast_tt:0 "Кожна область, яку контролює §Y[ROOT.GetName]§! або підлеглий Німеччини та має §Yморську базу§!, уздовж §Yєвропейського узбережжя Алтантики§!: Додасть §G1§! §Yморську базу§!. Додасть §G1§! §Yприбережне укріплення§!. Нинішній ефект:"
 GER_neutrality_influence:0 "Монархічний вплив з боку [GER.GetNameDef]"
 GER_not_controls_french_coast_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]]а маріонетка або член альянсу §Rне контролює повністю§ всі регіони вздовж §YАтлантичного узбережжя§! від §Y[29.GetName]§! до §Y[806.GetName]§!."
 GER_operation_panzerfaust_events.07.desc:0 "Попри наші сподівання, операція «Панцерфауст» зазнала поразки — наші агенти були заарештовані біля резиденції Горті."
 GER_operation_sea_lion:0 "Операція «Морський лев»"
 GER_panzergrenadier_desc:0 "Наша військова доктрина ґрунтується на мобільності та буде залежати від того, наскільки добре діятимуть наші моторизовані війська. Ні піхотні, ні танкові дивізії не будуть успішними у своєму просуванні без належної підтримки. Інтегровуючи механізовану піхоту з передовими частинами, ми забезпечимо, що наші війська збережуть перевагу в наступальних операціях."
 GER_panzerschiff_raiders_ns_desc:0 "Наші важкі крейсери становлять серйозну загрозу для флотів противника. Їхні гармати дуже потужні, а висока швидкість дозволяє їм утікати до того, як ворог зможе належним чином відреагувати."
 GER_preparing_ITA_coup2:0 "$GER_preparing_ITA_coup$"
 GER_price_controls_cat:0 "Заходи контролю за цінами"
 GER_rally_the_industrialists_desc:0 "Промисловці мають значну владу в нашій країні. Їх підтримка потребуватиме часу, але Рудольф Гесс запевняє нас, що ці зусилля виправдають себе."
 GER_reassert_eastern_claims:0 "$GER_demand_memel$"
 GER_refit_convoys_to_cruisers:0 "Переобладнати частину конвоїв на рейдерські судна"
 GER_reich_minister_of_armaments_todt:0 "$GER_reich_minister_of_armaments_speer$"
 GER_reichskommissar_trait:0 "Райхскомісар"
 GER_reichskommissariat_iberia_effect_tt:0 "Усі необхідні області, окрім §Y[41.GetName]§!, перейдуть під контроль [RKI.GetNameDef]"
 GER_reichskommissariat_ukraine_effect_tt:0 "Усі необхідні області, окрім §Y[202.GetName]§!, перейдуть під контроль [RKU.GetNameDef]"
 GER_ressurect_the_red_front_fighters_league_desc:0 "«Союз бійців червоного фронту» був парамілітарною організацією, пов'язаною з рухом часів Ваймарської республіки. За фашистського режиму вони хоробро боролися проти поліції та інших гнобителів. Як це часто бувало при старому режимі, організацію було заборонено. Час повернути її назад!"
 GER_root_is_proletarian_subject:0 "Як підлегла держава, керована представниками пролетаріату, ми отримали вимогу від [FROM.GetAdjective] про передачу частини нашої промисловості в обмін на подальшу допомогу."
 GER_root_out_imperialism_desc:0 "Корені імперіалізму глибоко проросли в ґрунтах Африки та Азії, поневолюючи тамтешніх робітників. Ці люди вже занадто довго страждають від колоніалізму. Ми повинні покласти край експлуатації й дати пригнобленим масам шанс повстати й здобути свободу!"
 GER_send_volunteers_desc:0 "Багато [ROOT.GetAdjective]их громадян прагнуть пригод і бажають воювати за праву справу. Ми мусимо створити легіон «добровольців», який допоможе нашим [CHI.GetAdjective]им друзям."
 GER_soviet_treaty:0 "Договір із [GER.GetTheUSSRName]"
 GER_sp_land_land_cruiser:0 "Landkreuzer P. 1000 Ratte"
 GER_support_the_finns:0 "Підтримати фінів"
 GER_tactical_air_effort:0 "Акцент на тактичну авіацію"
 GER_the_fate_of_the_volga_german_autonomous_area:0 "Доля колонії поволзьких німців"
 GER_the_proletarian_legion:0 "Пролетарський легіон"
 GER_the_sino_germanic_pact:0 "Китайсько-німецький пакт"
 GER_train_schutztruppe_in_karolinen:0 "Мобілізувати Шуцтруппе на Каролінських островах"
 GER_utilize_the_nordliche_gesellschaft_desc:0 "Скандинавія є традиційно нейтральна. Немає сенсу відкривати ще один фронт, щоби спробувати забрати ресурси, якими вони володіють, якщо ми можемо отримати їх дипломатичним шляхом. Таким чином, нам слід скористатися Нордичним товариством Альфреда Розенберґа, асоціацією для зміцнення німецько-скандинавської культурної та політичної співпраці, щоби говорити з Нордичними країнами у вигідному для себе світлі."
 GER_waning_patience_within_the_kriegsmarine_cat:0 "Терпіння Кріґсмаріне"
 GER_weltpolitik:0 "Weltpolitik"
 GER_weltpolitik_desc:0 "Нас не сприйматимуть серйозно як велику силу, доки ми не відновимо нашу колоніальну імперію або не побудуємо нову. Пора знову звернути погляд за межі Європи."
