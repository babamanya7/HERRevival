 RAJ_a_tiger_uncained_desc:0 "Надто довго ми були підкорені різними імперіями, прикуті до ярма імперського правління. Ніколи знову, як тигр, нарешті вільний від своїх викрадачів, він більше ніколи не буде добровільно підкорений."
