 SOV_church_power_1:0 "Опіум для мас"
 SOV_claims_on_poland_desc:0 "Польща утримує території, які століттями були російськими, розділяючи Україну та Білорусь між нашими народами. Це неприйнятний стан речей. Можливо, вони перемогли нас у 1921 році, але ми мусимо нагадати їм, що часи змінилися."
 SOV_cohesion_first_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$\n$MODIFIER_ARMY_ORG$: §G+5.0%§!\n$MODIFIER_TRAINING_TIME_FACTOR$: §R+10.00%§!\n\n"
 SOV_comecon_desc:0 "Система наукового співробітництва країн РЕВ та допомоги його відстаючим учасникам."
