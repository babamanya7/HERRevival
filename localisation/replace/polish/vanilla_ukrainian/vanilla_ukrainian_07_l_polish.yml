 SIA_the_inoffensive_choice:0 "Безпечний вибір"
 SIA_the_king_of_the_white_elephant_desc:0 "Істерія з приводу повернення втрачених територій загрожує охопити націю, і світ спостерігає за цим. Щоб стримати цей запал, ми випустимо антивоєнний фільм, перший тайський фільм, знятий англійською мовою, щоб показати світу справжнє обличчя [SIA.GetName]."
 SIA_the_regency_of_boworadet:0 "Регентство Боворадета"
 SIA_the_songsuradet_rebellion_historical_tt2:0 "Коли час дії вичерпається, ви отримаєте: "
 SIC_a_loose_unity_desc:0 "Хоча номінально ми об'єднані під прапором «Сичуанської кліки», у нашій провінції є кілька різних правителів, які мають свої власні цілі та амбіції. Деякі, як Лю Веньхуей, навіть створили своє власне маленьке царство, яке функціонально відокремлене від решти провінції, тоді як інші мають свої власні ідеї щодо управління армією."
