l_polish:
 11801_modern_name:0 "Ченде"
 12907_autenticite_name:0 "Моба"
 AAT_MIO_events.2.t:0 "Інвестиції $CZE_skoda_works$"
 AAT_Sweden.11.t:0 "[GER.GetAdjectiveCap]і робітники захоплюють контроль над фабриками Landsverk"
 AAT_Sweden.17.desc:0 "Незважаючи на загрозу військових дій за Нарвік, держава [FROM.GetName] відмовилася виконати наші вимоги. Ми не можемо і не залишимо [NOR.GetAdjective]их людей, щоб із ними поводилися як з худобою в нелюдських умовах. Ми мусимо захистити [NOR.GetAdjective]і порти, щоби відрізати загарбницькі сили та звільнити [NOR.GetAdjective]ий народ."
 AAT_Sweden.23.t:0 "[FROM.GetName] просить приєднатися до альянсу"
 AAT_Sweden.25.b:0 "Морпіхи допоможуть нам запанувати в Балтиці."
 AAT_Sweden.31.t:0 "[FROM.GetNameDefCap] просить Борнгольм"
 AAT_Sweden.34.a:0 "У нас немає вибору."
 AAT_Sweden.34.t:0 "[FROM.GetName] вимагає автономні території"
 AAT_Sweden.46.b:0 "$AAT_Sweden.46.a$"
 AAT_Sweden.48.desc:0 "Зрозуміло, що «турбота» наших сусідів про їхню безпеку була лише вивертом. Уряд держави [FROM.GetName] тепер вимагає, щоби ми об'єдналися з ними проти спільного ворога зі Сходу. Відмова від їхніх вимог міцно втягне нас у [FROM.GetAdjective]у сферу та підірве нашу незалежність. Залишається питання, чи гірша альтернатива?"
 AAT_Sweden.49.t:0 "[FROM.GetName] відмовляється прогинатися"
 AAT_Sweden.52.desc:0 "$AAT_Sweden.49.desc$"
 AAT_Sweden_BoP.14.d_right:0 "Настав день виборів, і, незважаючи на всі зусилля партій, жодна з них не отримала більшість місць у Ріксдазі. Однак консерваторам та фашистам вдалося домовитись про формування коаліційного уряду. Невідомо, чи протримається коаліція повний термін, але цілком можливо, що страх перед лівими утримає її разом."
 AAT_Sweden_ball_bearing.5.a:0 "Технології підтримки."
 AAT_Sweden_communism.1.t:0 "Чутки про фашистську контрреволюцію"
 AAT_Sweden_flashpoints.16.desc:0 "Після низки ескалацій напруженості між містами [SWE.capital.GetCapitalVictoryPointName] та [SOV.capital.GetCapitalVictoryPointName], напруга, здається, нарешті спадає. [SWE.GetAdjectiveCap]ий уряд відступився від своєї агресивної риторики щодо інциденту в Паялі і, схоже, визнав, що він мало що може зробити, щоби змусити нас визнати це."
 AAT_Sweden_flashpoints.17.a:0 "Ми розрядимо ситуацію ескалацією: пригрозимо війною, якщо вони не зупиняться."
 AAT_Sweden_flashpoints.31.desc:0 "До нас звернулися члени [GER.GetAdjective]ого уряду з проханням про обмежене використання нашої мережі залізниць, щоби дозволити пораненим військовим і тим, хто перебуває у відпустці, подорожувати до і з держави [GER.GetNameDef] крізь [SWE.GetName] і [DEN.GetName]. Хоча вони наполягають на тому, що запит зроблено виключно з гуманітарних міркувань, не важко уявити, що вони будуть використовувати його для поступового підриву нашого нейтралітету."
 AAT_Sweden_flashpoints.63.t:0 "[FROM.GetNameDefCap] погрожує війною"
 AAT_Sweden_flashpoints.65.desc:0 "[SWE.GetAdjectiveCap]ий уряд нарешті побачив здоровий глузд і вирішив зняти своє ембарго проти нас. Повна нормалізація торгівлі між нашими державами займе час, але ми чітко дали їм знати, що досі маємо спроможність поставити їх навколішки в разі потреби."
 AAT_Sweden_flashpoints.70.a:0 "Безпечної подорожі."
 AAT_Sweden_flashpoints.76.a:0 "Ми чекаємо на день, коли нарешті їх побачимо."
 AAT_Sweden_flashpoints.77.t:0 "Нові кораблі благополучно прибувають"
 AAT_Sweden_flashpoints.81.b:0 "Ні."
 AAT_Sweden_nationalists.10.desc:0 "Багато офіцерів занепокоєні безгосподарністю у політиці національної оборони за нинішньої влади. Тому багато вищих офіцерів армії та флоту погодилися допомогти нашій націоналістичній справі в обмін на збільшення оборонного бюджету, коли ми прийдемо до влади."
 AAT_USA_events.06.desc:0 "[FROM.GetLeader] від держвави[FROM.GetNameDef] відхилив наш запит, стверджуючи, що після референдуму народ Ґренландії явно не хоче бути під владою нікого іншого, окрім [FROM.GetAdjective]ого уряду."
 AAT_USA_events.08.a:0 "Повернути території."
 AAT_finland_continuation_war.04.a:0 "Ми впораємося."
 AAT_finland_continuation_war.04.desc:0 "Наші плани співпраці з державою [FROM.GetNameDef] проти держави [SOV.GetNameDef] тепер порушено через нещодавню зміну в геополітиці. Ми доклали чимало зусиль до обмірковування спільних операцій, але тепер нам доведеться починати все спочатку як у військовому, так і в зовнішньополітичному плані."
 AAT_finland_continuation_war.06.a:0 "Перемога близька!"
 AAT_finland_diplomacy.01.c:0 "Нам це не цікаво."
 AAT_finland_diplomacy.03.desc:0 "Наші дипломати повернулися з відрядження до держави [FROM.GetName]. Вона визнала потребу в єдиному фронті, але не готова жертвувати заради нього своїм суверенітетом. Спершу дискусія йшла добре, але, враховуючи історичну боротьбу держави [FROM.GetName] за незалежність, [GetDiplomacyDescriptionNiceNotNice].\n\nЗамість того щоб утворити союз, наш співрозмовник вирішив вступити в альянс як незалежна держава."
 AAT_finland_diplomacy.09.t:0 "[FROM.GetName] віддає необхідні території"
 AAT_finland_diplomacy.21.a:0 "Нас очікує світле майбутнє"
 AAT_finland_national_defense.02.a:0 "Прекрасні новини."
 AAT_finland_political.07.t:0 "$FIN_carl_mannerheim$ стає президентом"
 AAT_finland_winter_war.05.t:0 "[FROM.GetNameDefCap] відкидає наші мирні вимоги"
 AAT_nordic_cooperation.4.a:0 "Це вигідно нам обом."
 AAT_norway.15.t:0 "Переворот Квіслінґа тепер неминучий!"
 AAT_norway_communist.5.desc:0 "Наші товариші прийняли наше скромне прохання про допомогу, і тепер вони дозволять нашій військовій промисловості розширюватися, щоб задовольнити потреби оборони нашої революції."
 AAT_norway_monarchist.1.t:0 "Увертюра королівського камергера"
 AAT_norway_rikstanken.1.desc:0 "Танки ніколи не були частиною [ROOT.GetAdjective]ого арсеналу, і хоча для нас може бути занадто пізно наздоганяти їх самостійно, це не означає, що ми повинні повністю від них відмовитися.\n\nПершим кроком є пошук відповідного партнера для придбання або співпраці у розвитку наших бронетанкових сил. Очевидною відповіддю була б одна з великих військових держав Європи, але, можливо, пошук постачальника ближче до дому може мати свої довгострокові переваги."
 ABDA_events.1.a:0 "Ми будемо стояти разом."
 ABK_SOV_communism_subject_ADJ:0 "Абхазьк"
 ABK_neutrality_party:0 "Абхазька армія"
 ACE_PILOT_HEADER:0 "Льотчик-ас $FULLNAME$"
 ACHIEVEMENTS_DIFFICULTY:0 "Складність — $FE_DIFFICULTY_NORMAL$ або вище"
 ACTION_UNIT_STANDING_STILL:0 "$COUNT|H$ — стоять на місці"
 ADDRESS_STATE_HINT:0 "Вкажіть регіон"
 ADD_CONVEYOR_LINE_BUTTON_LABEL:0 "Додати част."
 ADD_NEW_AIRWING:0 "Додати нове авіакрило"
 AFA_fascism_ADJ:0 "Афарськ"
 AFG_aalem_daana:0 "Алем Дана"
 AFG_abdul_majid_zabuli:0 "Абдул Маджид Забулі"
 AFG_adopt_nufus:0 "Прийняти нуфус"
 AFG_ally_basmachi_remnants_desc:0 "До 1934 року Басмачі боролися проти [SOV.GetAdjective] сил за визволення Центральної Азії від їхнього тиранічного правління. Хоча їхній рух з того часу був придушений, деяким їхнім лідерам вдалося втекти. Ми повинні спробувати налагодити контакт із цими борцями за свободу та запросити їх до нашого двору. Можливо, вони раніше підтримували Хабібуллу Калакані, але із нашим встановленням контролю, їх буде легко схилити на свій бік."
 AFG_ally_the_brahui_khanate_desc:0 "Ханат Калат був важливим нашим союзником у пізніші роки Імперії Дуррані та значно допоміг у наших перемогах проти Конфедерації Маратха. Ми повинні знову налагодити з ними контакт та розгромити наступників Конфедерації Маратха!"
 AFG_alternative_partnerships_desc:0 "Нам вдалося зберегти нашу незалежність, обережно налаштовуючи [ENG.GetAdjective] та [SOU.GetAdjective]s один проти одного протягом десятиліть. Але тепер, коли до «Великої гри» приєднався новий гравець, ми скоригуємо наші стратегії відповідно."
 AFG_artillery_organization:0 "Кабульський ливарний завод"
 AFG_axis_equipment_desc:0 "Наше військове обладнання — це безлад невідповідних зразків з різних країн. Однак за невеликої допомоги від [GER.GetAdjective]s, ми нарешті зможемо стандартизувати все наше обладнання та модернізувати його одночасно."
 AFG_bukharan_jadidist:0 "Бузарський джадідист"
 AFG_confederation_pak_neutrality_ADJ:0 "Афгано-пакистанськ"
 AFG_counter_elite_on_the_rise_desc:0 "Недавні політичні реформи створили надлишок нестандартних мислителів в академічних і політичних колах для реалізації їхніх ідей."
 AFG_demand_pashtunistan_referendum_desc:0 "Пуштуни становлять більшість нашої нації, але багато хто з них залишається за межами наших кордонів у сусідніх державах. Нам потрібно наполягати на незалежності для пуштунів у цих державах, щоб ми могли привести їх до нашої сфери впливу."
 AFG_establish_camelry_regiments:0 "Створити верблюжі полки"
 AFG_expand_equipment_purchases:0 "Розширити закупівлю обладнання"
 AFG_expand_quami_tt_2:0 "Збільшити ліміт набору нерегулярних військ на 1"
 AFG_expanded_the_madrasas_idea:0 "Розширення медресе"
 AFG_hazara_party:0 "Хазарейці"
 AFG_hazara_party_long:0 "Хазарейці-реакціонери"
 AFG_increase_land_and_animal_taxes:0 "Збільшити податки на землю та тварин"
 AFG_industrial_events.51.desc:0 "Бунтівники з [FROM.GetNonIdeologyName], схоже, перетинають кордон, щоб посіяти заворушення серед паштунського населення. Йдуть розмови про об'єднання паштунів під [FROM.GetAdjective] правлінням замість нашого власного."
 AFG_infantry_equipment_2_short:0 "Sten MkII"
 AFG_kajaki_dam:0 "Створити Управління Долини Гільменд"
 AFG_mohammed_etemadi_khan:0 "Мохаммед Етемаді-хан"
 AFG_naval_academy:0 "Створити Військово-морську академію"
 AFG_pashtunistan_ascendancy_neutrality_ADJ:0 "Пуштунськ"
 AFG_permit_axis_airbases_desc:0 "Наші друзі в [GER.Capital.GetCapitalVictoryPointName] мають труднощі з розгортанням своїх повітряних сил так далеко від дому. Ми можемо полегшити їм цю проблему, водночас отримуючи корисну інфраструктуру та досвід для себе."
 AFG_political_events.02.t:0 "[FROM.GetName] приймає пропозицію"
 AFG_political_events.11.t:0 "[FROM.GetName] погоджується на конфедерацію"
 AFG_political_events.120.b:0 "[SOU.GetAdjective] кров ніколи не буде пролита в [FROM.GetNonIdeologyName]!"
 AFG_political_events.152.desc:0 "[FROM.GetAdjective] уряд відхилив нашу пропозицію щодо координації наших оборонних галузей, і тому наші мрії про дружбу з [FROM.GetLeader] зазнають різкого кінця."
 AFG_political_events.171.a:0 "Хай живе новий Емір!"
 AFG_political_events.21.a:0 "Щедрий внесок!"
 AFG_political_events.22.a:0 "Ми це запам'ятаємо."
 AFG_political_events.62.b:0 "Якщо вони не з нами, вони наші вороги!"
 AFG_political_events.74.desc:0 "Вимоги [AFG.GetNonIdeologyName] щодо перегляду Лінії Дюранда та поступки паштунськими територіями зустріли рішучий опір з боку [FROM.Capital.GetCapitalVictoryPointName]. Незважаючи на потенціал конфлікту, [FROM.GetAdjective] уряд вирішив, що поступка цими територіями створила б небезпечний прецедент та послабила б їхню позицію в регіоні. Нам наказано відхилити вимоги [AFG.GetNonIdeologyName] та готуватися захищати кордон, якщо це необхідно."
 AFG_purchase_capital_ships_tt:0 "Відмикає рішення для §YПридбання дредноутів§! та інших §YСтарих капітальних кораблів§! у великих держав."
 AFG_purchase_tanks_desc:0 "Нашій армії бракує вогневої потужності для прориву міцних ворожих ліній або швидкості для наступу. Ми повинні звернутися до решти світу та інвестувати в бронетанкові сили, щоб вирішити ці проблеми."
 AFG_quami_intro_tt:0 "Модифікувати §Y$AFG_quami_modifier$§! на:"
 AFG_reintroduce_war_elephants:0 "Відновити бойових слонів"
 AFG_secure_army_support:0 "Забезпечити підтримку армії"
 AFG_seek_british_investment_desc:0 "Протягом десятиліть ми підігрівали [ENG.GetAdjective] побоювання, що [SOU.GetNameDef] захопить нашу націю та анексує їхні дорогоцінні індійські території. Це призвело до стипендій та інвестицій, щоб утримати нас на їхньому боці. Оскільки світова ситуація стає більш хиткою, продовження цієї гри може виявитися ще більш прибутковим."
 AFG_support_soviets_in_asia_desc:0 "Середньоазійські республіки в [SOU.GetNameDef] є осередком контрреволюційної діяльності через їхню віддаленість від [SOU.Capital.GetCaptialVictoryPointName]. Щоб запобігти поширенню реакціонерів у нашу націю, ми повинні підтримати [SOU.GetAdjective]s у підтримці порядку в регіоні."
 AFG_support_warzistan_independence:0 "Підтримати незалежність Вазиристану"
 AFG_supporting_resistance_in_state_in_progress:0 "Створення осередку опору в процесі"
 AFG_turkestan_legion_cat_desc:0 "$AFG_form_the_turkestan_legion_desc$"
 AFG_turko_persian_emperor:0 "Імператор Турко-Персії"
 AGGRESSIVE_HIGH_DESC:0 "Продовжити виконувати завдання незважаючи на втрати."
 AIRBASE_CAPACITY_COUNTS_DESCRIPTION:0 "У нас є $OURS|H$ розміщених тут літаків.\nУсього тут розміщено $TOTAL|H$ літаків."
 AIRWING_MISSION_DAY_NIGHT:0 "Завдання виконуються і §Hвдень§!, і §Hвночі§!."
 AIRWING_MISSION_TYPE_NAVAL_KAMIKAZE_DESC:0 "Проводити удари камікадзе проти ворожих кораблів у регіоні. Це значно збільшить шкоду, але також збільшить Ваші втрати."
