 GER_SH_battleship_1_desc:0 "Проєкт лінкорів «H41» був удосконалений порівняно з попереднім проєктом «H39». Проєкт передбачав значно міцнішу броню, посилені торпедні перегородки та захист керма і гребних валів. Головну батарею було модернізовано до восьми 42-см гармат, більших, ніж у запропонованих британських лінкорів класу «Lion». За проєктом, ці кораблі мали б водотоннажність майже 70 000 тонн."
