 SET_SHIP_PRIDE_OF_FLEET_POPUP_DESC:0 "Ви справді хочете §Hпризначити§! $NAME|H$ як §Hгордість ВМС§!?\n\nПісля призначення, скасування цього або перепризначення  §Hгордості ВМС§! коштуватиме $COST|R$ £pol_power£. Ви отримаєте ось ці бонуси:\n$BONUS$\n\n"
