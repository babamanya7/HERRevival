 JAP_experimental_housing_solutions_desc:0 "Міський розвиток має керуватися чотирма функціональними категоріями: житло, робота, транспорт та відпочинок. Кендзо Танґе разом з іншими молодими архітекторами запропонували новий спосіб будівництва міст як частину нового перспективного руху, який вони називають метаболізмом. Ми повинні просувати цю ідею, щоб покращити житлові умови для всіх наших громадян."
 JAP_extensive_army_maneuvers:0 "Розпочати масштабні армійські маневри"
 JAP_financial_genius:0 "Фінансовий геній"
 JAP_formalize_japan_china_manchukuo_alliance_desc:0 "Оскільки уряд [CHI.GetLeader] прийняв наші вимоги щодо придушення комуністичної та антияпонської діяльності, тепер здається ймовірним, що вони будуть готові тимчасово сформувати з нами альянс, щоб впоратися з гнійною виразкою глибоко в лоні Східної Азії, відомою як мілітаризм польових командирів та комунізм, що загрожує всій Азії вірною та неминучою загибеллю."
