 JAP_kodoha_coup_will_fail_non_historically_tt:0 "Ми оголосимо воєнний стан і спробуємо придушити повстання, використовуючи підрозділи надзвичайних ситуацій Департаменту столичної поліції Токіо, обмежуючи участь військових у здійсненні правосуддя над Кодоха. Повідомляється про незначні жертви, хоча смерть деяких цілей Кодоха підтверджено:"
 JAP_koyata_iwasaki:0 "Koyata Iwasaki"
 JAP_launch_the_income_doubling_plan_desc:0 "Осаму Шімомура, економіст, який нещодавно приєднався до Ради економічної стабілізації Японії, запропонував так званий План подвоєння доходів — план, який, за його словами, відіграватиме центральну роль в економічному плануванні, допомагаючи закласти фундамент для нашого швидкого економічного зростання. Ми повинні прийняти його пропозицію і подивитися, куди вона нас приведе."
