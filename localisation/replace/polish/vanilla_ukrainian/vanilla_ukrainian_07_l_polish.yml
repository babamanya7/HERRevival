 mtg_britain.11.d:0 "Видатні представники аристократії не надто м'яко висловили свою огиду до перспективи одруження короля з тією, кого вони вважають «звичайною шльондрою». Презирство, з яким він, здається, ставиться до традицій і церемоній, образило багатьох найвпливовіших людей в країні."
 mtg_britain.23.b:0 "Британці не сміють вказувати нам, що робити!"
 mtg_britain.34.d:0 "Небажання продовжувати безнадійну громадянську війну з колоній і відсутність суспільної підтримки змусили демократичний уряд визнати нашу перемогу і провести переговори про мир. Після цього рішення Королівські ВМС знову перейшли під наш контроль.\n\nДомініони ж ясно дали зрозуміти, що не мають наміру підкорятися недемократичному уряду і натомість бажають зберегти статус незалежних учасників Співдружності націй."
 mtg_britain.44.a:0 "Тут їм будуть раді."
 mtg_britain.49.a:0 "Відмінна ідея, так і вчинимо."
 mtg_britain.80.d:0 "[From.GetNameDefCap] приймає наші вимоги та надає широкий контроль над своєю територією."
 mtg_britain.88.a:0 "Виживання імперії залежить від нас."
 mtg_germany.2.t:0 "[From.GetName] підкоряється"
 mtg_netherlands.2.d:0 "[HOL.GetAdjective] уряд прийняв нашу пропозицію надати «захист» островам Ей-Бі-Сі."
 mtg_netherlands.21.a:0 "Якщо вони вважають, що так краще..."
 mtg_netherlands.28.a:0 "Це розчаровує..."
 mtg_netherlands.30.t:0 "[From.GetNameDefCap] надає спорядження"
 mtg_netherlands.31.t:0 "[From.GetNameDefCap] відмовляється надавати спорядження"
 mtg_netherlands.32.d:0 "[HOL.GetAdjective] представники запропонували скласти секретний план з координації оборони у разі нападу на них. Вони повідомили, що дуже важливо не розголошувати його, оскільки побоюються, що будь-яке порушення їхньої нейтралітету призведе до війни."
 mtg_netherlands.35_tt:0 "§Y[From.GetNameDefCap]§! отримає цільовий бонус до захисту та атаки проти агресора протягом 180 днів після нападу провідної західноєвропейської держави.\n"
 mtg_netherlands.37.t:0 "[From.GetNameDefCap] відмовляється обмінюватися розвідданими"
 mtg_netherlands.69.b:0 "Давайте осушимо землі."
 mtg_netherlands.8.t:0 "[From.GetNameDefCap] ділиться кресленнями лінійного крейсера"
 mtg_news.11.a:0 "Вони приєднуються до блокади..."
 mtg_news.48.a:0 "Це необхідне зло."
 mtg_news.49.a:0 "Це прийнятний компроміс."
 mtg_news.5.d:0 "Ми стоїмо на порозі нової ери."
 mtg_news.5.desc:0 "Після голосування з приводу епохальної пропозиції в Сенаті, президент [USA.GetLeader] негайно підписав Закон про повноваження воєнного часу. Цей закон дає президенту значно більше повноважень у використанні військових сил, ніж раніше. Тепер він може надсилати. війська для захисту [USA.GetAdjective] інтересів туди, куди вважатиме за потрібне, у будь-який час і на будь-який термін.\n\nСам президент [USA.GetLeader] запевнив, що буде користуватися цими новими повноваженнями у разі крайньої необхідності, але джерела в Сенаті стверджують, що це лише перший крок на шляху здійснення широкомасштабної програми щодо зміни всесвітнього балансу сил."
 mtg_usa_canadian_corridor.3.desc:0 "Назвавши нашу пропозицію «ультиматумом “Ванкувер або війна”, який покликаний налякати нас», [CAN.GetLeader] засудив будь-які подальші дипломатичні кроки. Як повідомляється, [CAN.GetAdjective]і сили наведені у стані і займають оборонні позиції вздовж кордону."
 mtg_usa_civil_war_democrats.15.a:0 "Це їхнє право."
 mtg_usa_civil_war_fascists.11.a:0 "Яка жадібність."
 mtg_usa_civil_war_fascists.22.t:0 "Утворення Нейтрального блоку"
 mtg_usa_civil_war_warning_tt:0 "§RЦе наблизить Вас до громадянської війни!§!\n"
 mtg_usa_diplomatic_protest.4.b:0 "Це питання насильством не вирішити."
 mtg_usa_foreign_support.5.desc:0 "Наші зв'язки в державі [From.GetNameDef] принесли користь. З явного схвалення лідера [From.GetLeader] [From.GetAdjective] компанії почали постачати нам гвинтівки в кредит. Зброя буде розміщено на складах у нейтральних до початку війни."
 mtg_usa_foreign_support.9.a:0 "Зробимо з них справжніх чоловіків!"
