 HOL_medium_tank_equipment_2_short:0 "GVT-4"
 HOL_mobilize_the_masses:0 "Мобілізувати маси"
 HOL_open_second_paranam_bauxite_mine_desc:0 "Боксити з Сурінаму мають величезне значення для виробництва алюмінію для літакобудування великих держав. З нинішнім військовим нарощуванням у всьому світі попит на алюміній різко зріс, і тому ми, безсумнівно, могли б збільшити наш експорт, якби ми хотіли відкрити другу бокситову шахту в Паранамі."
 HOL_protect_the_mainland_desc:0 "Щоб захистити континентальні Нідерланди, ми повинні придбати парк сучасних винищувачів, щоби зберегти перевагу в повітрі над нашим небом."
 HOL_request_aid_for_the_engelandvaarders_desc:0 "Понад 100 миль Північного моря, що відокремлюють Англію від Нідерландів, не перешкода для нідерландців, які прагнуть боротися разом із союзниками за звільнення батьківщини. На маленьких човнах-каяках ці Engelandvaarders («англійські моряки») долають відкриті води в таких суворих умовах, що у плаванні виживає у разі кожен десятий. Той, хто зважився на таке, уже сміливець із сміливців, і наш обов'язок — попросити британців всіляко допомагати цим героям."
 HOL_ship_light_battery_2:0 "120mm/50 W-Fijenoord 7"
 HOL_strategic_bombing_defense:0 "Оборона від стратегічного бомбардування"
 HOL_submarine_2:0 "Клас «O16»"
 HOL_tac_bomber_equipment_1_short:0 "Fokker T.V"
 HOL_tac_bomber_equipment_3_short:0 "Koolhoven F.K.71"
 HOL_taog_guarantee_colonial_loyalty_desc:0 "Націоналізм в Ост-Індії зростає, і стає зрозуміло, що готується чергова революція. Хоча ту, з якою ми зіткнулися в 1927 році, вдалося придушити з легкістю, наші джерела повідомляють, що цього разу ми маємо справу з набагато краще підготовленою групою революціонерів. Можливо, якщо ми підемо на деякі поступки мирному націоналістичному руху Сутарджо, ми зможемо відвернути увагу цивільних від революції та спрямувати її на Сутарджо?"
