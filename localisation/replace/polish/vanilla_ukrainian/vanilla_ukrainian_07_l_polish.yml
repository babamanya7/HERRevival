 ETH_italian_general_staff_desc:0 "Нашому війську ще попереду модернізація. Хоча ми робимо великі кроки у виробництві чи закупівлі сучасної техніки для збройних сил, наші офіцери мають багато застарілих поглядів на те, як її використовувати. Можливо, ми могли б навчитися вести сучасну війну, запросивши [ITA.GetAdjective]их офіцерів до нашого генерального штабу."
