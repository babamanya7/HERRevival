 JAP_infantry_equipment_1:0 "Type 99 Rifle"
 JAP_interservice_rivalry_desc:0 "Імперський флот та імперська армія замкнені в жорстокому конфлікті через наші обмежені ресурси. Ми запровадили регулярні конференції, щоб переконатися, що наші ресурси витрачаються в потрібному місці. Надання переваги одному над іншим матиме далекосяжні наслідки."
