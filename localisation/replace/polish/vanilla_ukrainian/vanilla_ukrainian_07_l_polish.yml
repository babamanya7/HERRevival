 GOE_RAJ_news.1.t:0 "Повернення [?event_target:EIC_FORMER.GetAdjective] Ост-Індійської компанії"
 GRAND_DOCTRINE_FLEET_IN_BEING_DESC:0 "Клуб «великих гармат». Традиційний акцент на військово-морській артилерії та важкій броні, щоб здолати ворожий флот і втопити його у штормі сталі потрібно просто мати найбільшу гармату на морі."
 GREATER_LIT_neutrality_subject_DEF:0 "Велике Князівство Литовське"
 GREATER_THAN:0 "більше ніж"
 GRE_AUS_autonomy_eu_member_ADJ:0 "Грецьк"
 GRE_GREATER_GREECE_democratic_DEF:0 "Еллада"
 GRE_GREATER_GREECE_neutrality:0 "Королівство Велика Греція"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_STANDARD:0 "Захисники Середземномор'я"
 GRE_a_fleet_fit_for_the_aegean_desc:0 "Щодня ми змушені дивитися, як італійські крейсери та британські авіаносці ходять нашими морями. Це принизливо! Хтось у Балканах має повстати проти цього та виставити гідний флот, яким можна пишатися."
 GRE_a_long_and_proud_tradition_desc:0 "Наш флот — одна з небагатьох речей, якими Греція могла пишатися навіть у її найгірші часи. Сьогодні ми лише продовжуємо його давні та славні традиції."
 GRE_abandon_the_greek_turkish_naval_treaty_desc:0 "Угода, яка мала обмежити допустимі розміри кораблів, що будуються в Туреччині, раптом чомусь наклала ті самі обмеження на нас! Ну ні. Греція славилася основними кораблями, що надійно захищають наші береги, і в ці сумні часи немає кращої охорони, ніж величезний лінкор."
 GRE_byzantine_army_desc:0 "Не так давно ми мріяли про армію, здатну захистити наші кордони. Нині ми готуємо солдат до походу за півсвіту заради повернення імперії. Немає у світі інших таких армій, і вона поверне те, чого ми так довго були позбавлені."
 GRE_civil_war_imminent_3:0 "$GRE_civil_war_imminent$"
 GRE_debt_to_the_ifc:0 "Борг перед МФК"
 GRE_denied_our_ambitions_ITA:0 "$GRE_denied_our_ambitions$"
 GRE_embracing_modern_warfare_desc:0 "Судячи з повідомлень із Німеччини, танки можуть бути корисні в якості підтримки для піхотних батальйонів. Тільки уявіть! Можливо, наша промисловість недостатньо розвинена для них, але спробувати варто."
 GRE_expansion_of_athens_university_desc:0 "Наука та вища освіта завжди були важливою складовою грецької традиції. Сьогодні у Греції немає навчального закладу важливішим, ніж Афінський національний університет імені Каподістрії. Давши йому додаткові кошти та місце для розширення, ми значно підвищимо користь інституту для держави."
 GRE_faction_indifferent_stability:0 "0"
 GRE_farmer_culture_desc:0 "Нам не варто соромитися нашого фермерського походженння. Ми цілком можем рухатися в сучасну епоху, не забуваючи коренів, що стільки років визначали наше буття. Ми розумієм грецького робітника і не боїмось шанувати його ремесло незалежно від того, скільки воно приносить користі державі."
 GRE_fund_the_hellenic_air_force_academy_desc:0 "Наші пілоти досвідчені, вмілі та сповнені ентузіазму. Час нам висловити їм заслужену повагу. Ми мусимо знову почати повністю фінансувати Академію ВПС та нарощувати виробництво винищувачів, щоби наша авіація була справді гідна Греції."
 GRE_greece_and_turkey_in_the_axis:0 "Греція та Туреччина разом в Осі!"
 GRE_heavy_tank_equipment_1_short:0 "Goliáth I"
 GRE_heavy_tank_equipment_2_short:0 "Goliáth II"
 GRE_hellenic_armoured_corp:0 "Еллінський бронетанковий корпус"
 GRE_hellenic_army_3:0 "Еллінська армія"
 GRE_moderate_investment:0 "Значні інвестиції в державу [GRE.GetNameDef]"
 GRE_open_foreign_subsidized_factories_desc:0 "У будівництві та комплектації заводів персоналом ми перевершили всі очікування, але очевидно, що розширюємося ми повільніше за інших наших європейських товаришів. Є ті, хто набагато багатший за нас, хто може помітно прискорити наш процес модернізації, якщо тільки ми зарекомендуємо себе країною, привабливою для інвестицій."
 GRE_protectors_of_the_mediterranean:0 "[Root.GetProtectorsMediterraneanName]"
 GRE_reorganize_the_royal_guard_desc:0 "Королівська гвардія, або, як її раніше називали, Рота президентської охорони, була утворена королівським указом у 1868 році. Підрозділ супроводу-агіма складався зі штабу, двох піхотних рот-евзон та однієї кавалерійської роти. Ми мусимо реорганізувати ці підрозділи і знову використати їх на полі бою."
 GRE_request_communist_support_desc:0 "Георг II — не грек і не має жодних прав втручатися у справи Греції! Занадто часто наша країна страждала через його необґрунтовані претензії на владу, і тепер настав час змусити цього злочинця відповісти за все! Але одним нам це не під силу, і є лише одне угруповання, яке ненавидить короля так само сильно, як і ми..."
 GRE_reviving_the_double_headed_eagle_desc:0 "Венізелісти були боягузами, які заважали Греції повернути собі справжню колишню славу — славу Візантії! Навіщо задовольнятися узбережжям Туреччини, коли ми можемо повернути усі втрачені володіння Імперії? Почалася нова ера грецької слави!"
 GRE_revolutionaries_of_the_south:0 "Революціонери Півдня"
 GRE_revolutionaries_of_the_south_desc:0 "Ми ніколи повністю не зійдемося в думці з московськими товаришами, але поки що Греція вільна диктувати власне революційне кредо тут, на Півдні Європи, ми будемо вести вільне життя під прапорами істинного комунізму!"
 GRE_strategic_enemy:0 "Стратегічний ворог"
