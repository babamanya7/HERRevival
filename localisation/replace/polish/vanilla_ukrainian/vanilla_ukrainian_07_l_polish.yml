 AST_cv_CAS_equipment_2:0 "Blackburn Skua"
 AST_cv_fighter_equipment_1:0 "Gloster Sea Gladiator"
 AST_department_of_supply_and_development_desc:0 "У воєнний час нам необхідний спеціальний департамент, який відповідає за логістику та постачання: боєприпаси, постачання палива та всього іншого, що необхідно армії в дорозі."
 AST_devalued_currency_desc:0 "Один із найефективніших способів збільшити експорт — послабити валюту. Якщо іноземні покупці можуть придбати більше наших товарів, оскільки їхні гроші мають вищу цінність, ми стаємо більш конкурентоспроможними на міжнародному рівні. Проте це палиця з двома кінцями, оскільки імпорт з інших країн також подорожчає."
 AST_develop_middleback_tt:0 "Це розблокує три рішення для розвитку нашого виробництва §YСталі§! у штаті §Y$STATE_519$§!"
 AST_diplomatic_events.13.a.tt:0 "Буде проведено референдум, що потенційно призведе до §Rанексії§! §Y[NZL.GetName]§!"
 AST_diplomatic_events.17.a.tt:0 "§Y[INS.GetNameDefCap]§! стане §Yмаріонеткою§! §Y[AST.GetNameDefCap]§!."
 AST_diplomatic_events.29.desc:0 "Після тиску Австралії на [ENG.GetNameDef] з метою спровокувати конфлікт із [JAP.GetName], Британія погодилася підтримати наші зусилля з будівництва оборони."
