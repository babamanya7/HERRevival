 ITA_topple_amhara_rulers_event_chain_tt:0 "\nПочне ланку подій §YМісцеві правителі підступають до італійських урядовців§!, яка дозволить збільшити підпорядкування або встановити підлеглі Італії держави в деяких ефіопських областях, за нашим бажанням."
 ITA_towards_a_greater_italy_desc:0 "Італійський іредентизм є природним результатом зради, якої зазнав італійський народ від Антанти після Великої війни. По праву Італія мусить мати повне панування над Середземномор'ям, а для цього нам потрібно розширити свої кордони."
 ITA_train_irregulars_desc:0 "Вербування місцевих сил було б менш обтяжливим для нашої власної робочої сили, і вони мають перевагу в тому, що вони є уродженцями цих земель, знають тамтешніх людей і географію."
 ITA_transport_plane_equipment_1_short:0 "Ca.101"
 ITA_undermine_the_duce_desc:0 "Шалене бажання Муссоліні завоювати Ефіопію знову привело нас до межі поразки. Хоча перемога, безумовно, все ще можлива, має бути зрозуміло, що це не буде перемога Муссоліні."
