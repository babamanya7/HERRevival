 FRA_syria_intervention.1.desc:0 "Під час скромної церемонії в Дамаску місцевий командувач армії режиму Віші офіційно здав територію союзникам. У всьому регіоні припинилися бої, що вціліли війська вішістів здаються в полон. армію: більшість з них вважають за краще повернутися на батьківщину."
 FRA_utilize_the_leagues_desc:0 "Сумний факт, що політичне насильство стало звичним явищем у Франції. Якщо країна хоче пережити загрозу комуністичної революції, ми мусимо не ухилятися від допомоги людей, які можуть і будуть зустрічати комуністичних головорізів на вулиці, якщо до цього дійде."
