 BRA_coffee_crisis_aftermath:0 "Наслідки кавової кризи"
 BRA_companhia_siderurgica_nacional_desc:0 "Сталь стала критично важливим ресурсом у багатьох галузях промисловості, але наше внутрішнє виробництво її недостатнє, щоб задовольнити попит. Тому ми створимо державну національну металургійну компанію з передовим обладнанням, замість того, щоб імпортувати її з-за кордону."
 BRA_consolidation_of_labor_laws_desc:0 "Наше трудове законодавство пропонує мало захисту для робітників, що неминуче призводить до розбіжностей із власниками бізнесу та, зрештою, до страйків. У такий небезпечний час ми не можемо дозволити собі таких страйків чи ризику більшовицької інфільтрації. Тому ми консолідуємо наші закони та знайдемо баланс між робітниками та капіталістами."
 BRA_court_the_military_desc:0 "Надто ідеалістично проводити політичний курс, який не подобається чи послаблює військовий істеблішмент. Наша єдина надія — знайти спільну мову та співпрацювати з ними задля вищого блага нації. Якщо ми зазнаємо невдачі, наші права знову будуть знищені."
 BRA_departamendo_de_propaganda:0 "Departamento de Propaganda"
 BRA_departamendo_de_propaganda_desc:0 "Останнє десятиліття політичних потрясінь дуже добре показало, що може статися, коли уряд і народ не збігаються у своїх поглядах. Щоби запобігти подальшим потрясінням, ми створимо відділ пропаганди, щоби підштовхнути народ до зближення з нашою політикою."
 BRA_destroyer_1:0 "Клас «Maranhão»"
 BRA_distinguished_diplomat:0 "Заслужений дипломат"
 BRA_fascism_party_long:0 "Бразильська інтегралістська дія"
