 country_capitulated.0.d_negative_prev_faction:0 "\n[Root.GetLeader] оголосив, що [Root.GetAdjective]а держава більше не може встояти під тиском [From.From.GetAdjective]их окупаційних військ, які скоюють немислимі звірства в їхній країні. [Root.GetAdjective]а влада створила уряд у вигнанні. Їхні основні війська капітулювали, а [From.From.GetNameDef] тепер контролює їхні головні території.\nХоча війна проти держави [From.From.GetNameDef] та решти альянсу [From.From.GetFactionName] триває, це прикро невдача для всього альянсу [Root.GetFactionName]."
