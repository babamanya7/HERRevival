 sp_naval_ice_carrier_desc:0 "Щоб забезпечити свою перевагу в повітрі над величезними океанами, нам потрібні авіаносці, які могли б зберігати і запускати не тільки палубні літаки, а й звичайні літаки дальньої дії."
