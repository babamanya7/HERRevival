 siam.44.desc:0 "[FROM.GetNameDefCap] розмістила замовлення на підводні човни, побудовані за нашими проектами. Продаж є значущим вотумом довіри до нашої військово-морської промисловості та поширює вплив [FROM.GetAdjective] у води Південно-Східної Азії."
