 BUL_aircraft_repair_facilities_desc:0 "Ми розробили проєкт розширення авіаремонтних баз Терему Ґеорґія Бенковського, що дозволить нашим ВПС оптимально виконувати завдання з технічного обслуговування та ремонту своїх літаків."
 BUL_all_that_glitters:0 "Усе, що сяє"
 BUL_approach_soviet_foreign_industry_tt:0 "Знижена вартість прийняття рішення для §YІноземні угоди§! із [SOV.GetNameDef] та збільшена межа [SOV.GetAdjective]их заводів."
 BUL_balkan_confederation_capital_injection_desc:0 "Ми надамо фінансову підтримку [FROM.GetAdjective]им компаніям, які перебувають у важкому становищі, стабілізуємо фінансовий сектор і зміцнимо [BUL.GetAdjective]ий контроль над економікою держави [FROM.GetNameDef]."
