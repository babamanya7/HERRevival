 SOV_tsar_vsevolod_ivanovich:0 "Цар Всеволод I"
 SOV_ukraine_crackdown_timer_desc:0 "НКВС вирішив зосередитися на Україні, проводячи масові арешти та допити, щоби забезпечити вірність населення регіону."
 SOV_ultimatum_generic_effects_tt:0 "Ця подія змусить державу §Y[FROM.GetFlag][FROM.GetNameDef]§! стати маріонеткою держави §Y[ROOT.GetNameDef]§! або приєднатися до альянсу §Y[ROOT.GetFactionName]§! ([FROM.GetNameDefCap] все ще може відмовити)"
 SOV_volgograd_hydro_station:0 "Волгоградська ГЕС"
 SOV_war_heroes_desc:0 "Росіяни завжди вміли і хотіли здійснювати вчинки надзвичайної хоробрості заради перемоги над будь-яким загарбником вітчизни. Хоча ми єдині в нашій боротьбі проти ворога, ми не мусимо вдавати, що в нашій армії немає солдатів, які вийшли далеко за межі виконання службового обов'язку."
