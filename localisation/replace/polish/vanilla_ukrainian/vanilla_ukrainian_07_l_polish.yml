 aat_news.1.desc:0 "Ісландський альтінг зробив заяву, в якій оголосив про нейтралітет Ісландії в конфлікті між Данією і державою [?ICE.overlord_attacker.GetName].\nТакож парламент проголосив, що $ICE_sveinn_bjornsson$ займатиме посаду регента під час відсутності короля та керуватиме зовнішньою політикою Ісландії. У заяві зазначено, що це тимчасовий захід і після завершення конфлікту буде відновлено довоєнні відносини з Данією. Однак, поки цей день не настав, Ісландія де-факто залишається незалежною."
