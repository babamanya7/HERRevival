 RAJ_privatized_healthcare_desc:0 "Заклики до комуністичних схем охорони здоров'я мають бути придушені в наших володіннях. Охорона здоров'я має бути надана тим, хто її заслужив невидимою рукою ринку."
 RAJ_provincial_autonomy_tt:0 "\nЩоб повністю звільнитися через §YТеорію двох націй§!, нам потрібно завершити або §YОб'єднану Бенґалію§!, або §YСхідний Пакистан§!.\n\nЩоб повністю звільнитися через §YЄдність Індії§!, нам потрібно завершити §YСвітську державу§!\n\n§Y§!Щоб повністю звільнитися через §YЛігу проти Гандизму§!, нам потрібно завершити §YЧервоних у тіні§! або §YДайте мені кров, і я дам вам свободу§!."
 RAJ_quality_training_desc:0 "Сама лише кількість не виграє війни.\nМи стандартизуємо наші навчальні програми, покращимо інструктаж офіцерів та підвищимо професіоналізм наших збройних сил."
 RAJ_red_punjab_operation:0 "Операція «Червоний Пенджаб»"
