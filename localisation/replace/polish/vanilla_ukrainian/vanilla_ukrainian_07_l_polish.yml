 HUN_arpads_mathhias_and_andrews_successor_trait:0 "Спадкоємець Арпада, Ондраша та Матяша Корвіна"
 HUN_autarky_desc:0 "Ми надто покладаємось на закордонну нафту. Слід взяти приклад із Німеччини та розробити синтетичну нафту."
 HUN_carl_wilhelm_takes_absolute_cotrol_decision:0 "Необхідність в «диктаторському правлінні»"
 HUN_develop_tanks:0 "Розробка танків"
 HUN_expand_the_manfred_weiss_steel_works_desc:0 "Величезний машинобудівний комплекс Манфреда Вайсса ще з часів Великої війни є одним з найбільших постачальників для збройних сил. Щоб посилити нашу обороноздатність напередодні нової війни, потрібно ще більше посилити лідера національної промисловості."
 HUN_fighter_competition_desc:0 "Щоб обрати найбільш підходящу модель винищувача для виробництва за ліцензією, ми маємо порівняти параметри всіх претендентів. Ми організуємо змагання та попросимо провідні держави надіслати свої найдосконаліші зразки для участі."
 HUN_ganz_danubius_organization:0 "$HUN_ganz_danubius$"
 HUN_gombos_trade_treaty_arms_market_tt:0 "Дозволяє торгівлю зброєю з §YНімеччиною§!"
