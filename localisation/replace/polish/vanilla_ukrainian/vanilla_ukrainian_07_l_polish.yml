 RAJ_automating_the_army:0 "Автоматизація армії"
 RAJ_azad_hind_dlc_bank_desc:0 "Революція потребує ресурсів. Створивши Банк Азад Гінд, ми створюємо фінансову установу, присвячену підтримці боротьби за незалежність. Він мобілізує кошти, розширить можливості патріотів та закладе економічний фундамент для вільної Індії."
