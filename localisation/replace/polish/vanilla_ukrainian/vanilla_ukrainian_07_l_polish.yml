 ETH_the_second_italo-ethiopian_war_desc:0 "Різдвяний наступ не приніс нам перемогу, на яку ми сподівалися й яка нам так потрібна. Настав час лідерові — [ETH.GetLeader] — покинути столицю й узяти армії під особисте командування. Війну проти італійців необхідно довести до кінця!"
 ETH_unite_the_afar_desc:0 "Зі зміщенням уваги Європи на їхній власний континент можливо заручитися підтримкою афарців на півночі, купивши регіон [DJI.GetName] і возз'єднавши афарів після десятиліть розлуки."
