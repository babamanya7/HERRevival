 ETH_cruiser_tt:0 "[ETH.GetName] отримує важкий крейсер та 3 есмінці від [JAP.GetName]."
 ETH_defeat_italy_category:0 "Друга італо-ефіопська війна"
 ETH_develop_the_capital_region_desc:0 "Нам потрібно пришвидшити темпи індустріалізації для поліпшення життя наших людей і захисту [ETH.GetNameDef]. Тому ми будемо інвестувати в територію навколо [ETH.Capital.GetCapitalVictoryPointName], перетворюючи її на промислове серце [ETH.GetName]."
