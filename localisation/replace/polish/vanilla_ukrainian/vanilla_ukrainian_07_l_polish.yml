 basic_depth_charges_desc:0 "Простий контейнер з вибухівкою та детонатором, що спрацьовує при досягненні заданої глибини.\n\nУстановка цього модуля на §Yлегкі кораблі§! і §Yкрейсери§! дозволить атакувати ворожі §Yпідводні човни§!."
