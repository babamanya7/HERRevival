 spiritual_mobilization_idea:0 "Духовна мобілізація"
 ss_recruitment_alternate.3.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що в Швеції є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS."
