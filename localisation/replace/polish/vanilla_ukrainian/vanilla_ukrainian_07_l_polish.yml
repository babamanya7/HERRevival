 WW_hungary.21.desc:0 "Розсудливий [FROM.GetLeader] з [FROM.GetNameDef] погодився передати нам території в Карпатській Русі й наказав військам відступити. Ми знову здобули перемогу!"
 WW_hungary.23.b:0 "А чи справді вони зможуть це підкріпити?"
 WW_hungary.25.desc:0 "Хоча це й не стало несподіванкою, але нерозумний [FROM.GetLeader] з [FROM.GetNameDef] привів війська у бойову готовність після отримання нашого ультиматуму й надіслав посланця з чітким запереченням поступок у питанні Бурґенланду."
 WW_hungary.29.a:0 "Висловити дипломатичний протест"
 WW_hungary.30.desc:0 "Держави Малої Антанти серйозно поставилися до спроби Карла IV відновити монархію Габсбургів у 1921 році, і досі не дозволяють подібних дій. Цього разу вони не погрожують війною, але вимагають доказів наших мирних намірів — інакше їм доведеться знову покласти край нашій монархії."
 WW_hungary.49.t:0 "[FROM.GetNameDefCap] відмовляється від монарха Габсбургів"
