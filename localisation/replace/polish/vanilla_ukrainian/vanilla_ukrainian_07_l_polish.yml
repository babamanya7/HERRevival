 BUL_modern_tactics:0 "Сучасні тактики"
 BUL_opression_raid_bs_supporters_desc:0 "Після захоплення лідерів $BUL_bs_name_gen$ помітно ослаблений. Настав час влаштувати облаву на решту його учасників, які, як і раніше, тримають організацію на плаву і активно задумують щось проти нас."
 BUL_opression_raid_zveno_supporters:0 "Провести рейд на прихильників $BUL_zveno_name_gen$"
 BUL_recover_italian_territories_desc:0 "Перш ніж територіальні амбіції Італії підуть далі, ми мусимо вимогти від італійського уряду передати контроль над своїми окупованими територіями на Балканах країнам, до яких вони законно належать, інакше можна зіткнутися з наслідками."
 BUL_refuse_army_restrictions_desc:0 "Тепер, коли нас підтриму[GetBulgarianFactionName], нам не потрібна згода держави [ENG.GetNameDef], щоби почати переозброєння армії."
