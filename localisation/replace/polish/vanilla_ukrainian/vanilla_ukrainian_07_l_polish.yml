 SWE_acquire_ww2_tanks_and_wrecks_desc:0 "Оскільки пил осідає в Європі, на полях битв лежить незліченна кількість покинутих танків, які ми могли б використати для досліджень і розробок щодо вдосконалення наших власних конструкцій. Можливо, настав час скористатися цією ситуацією, перш ніж ці військові здобичі будуть витребувані іншими."
 SWE_align_more_closely_with_the_landsorganisationen:0 "Більш тісне співробітництво з Landsorganisationen"
 SWE_allow_landsverk_to_operate:0 "Дозволити Landsverk працювати незалежно"
 SWE_archapeligo_harrasment_desc:0 "Наші береги є перешкодою для всякого можливого агресора. Але ми могли б більше скористатися нашим знайомством з архіпелагом, щоб краще переслідувати ворожі кораблі в цьому районі, якщо дамо флоту для цього ресурси."
 SWE_bofors_anti_tank_gun_tt:0 "Вмикає §HПротитанкова гармата Bofors§!\nПідтримка протитанкової жорсткої атаки: §G+10%§!\nПідтримка протитанкової пробивання: §G+10%§!\nПідтримка жорсткої протитанкової атаки: §G+ 10%§!\nПробивна протитанкова: §G+10%§!\nМоторизована протитанкова сильна атака: §G+10%§!\nМоторизована пробивна протитанкова: §G+10%§!\nЛегкий винищувач танків Жорстка атака: §G+10%§!\nПробій винищувача легких танків: §G+10%§!\nСильний удар винищувача середніх танків: §G+10%§!\nПробій винищувача середніх танків: §G+10%§!\nВажкий винищувач танків Жорстка атака: §G+10%§!\nПробивка важкого винищувача танків: §G+10%§!\nНадважкий винищувач танків Жорстка атака: §G+10%§!\nПробивка надважкого винищувача танків: §G+10%§!\nСучасний винищувач танків Жорстка атака: §G+10%§!\nПробивка сучасного винищувача танків: §G+10%§!"
 SWE_civil_war_tt:0 "§RВикличе громадянську війну в§! §Y[ROOT.GetFlag][ROOT.GetName]§! §Rміж націонал-соціалістами та нинішнім урядом!§!"
 SWE_election_active:0 "Сезон виборів розпочався"
 SWE_finland_claims_desc:0 "Територія [FIN.GetNameDef] по праву є нашим домініоном, і з нашою новою силою ми могли б відновити свій контроль над нею. Однак нещодавні конфлікти в регіоні ускладнили геополітичну ситуацію. Тому нам потрібна підтримка [GER.GetNameDef], щоб надати нашим претензіям ваги."
 SWE_formation_flying_desc:0 "Для підтримки надійної протиповітряної оборони потрібні добре організовані групи винищувачів, здатні швидко реагувати на можливі загрози."
 SWE_government_weapons_contract:0 "Урядовий контракт на постачання зброї"
 SWE_harspranget_dam:0 "Гарспронґет"
 SWE_infantry_equipment_3:0 "Kpist m/45"
 SWE_land_air_warfare_0:0 "Поєднані тактики наземно-повітряної війни"
 SWE_medium_tank_artillery_equipment_3_short:0 "Ikv 73"
 SWE_mobilization_of_society_desc:0 "Кожен, від фабричного робітника до міністра кабінету міністрів, має бути готовий жертвувати заради захисту нації. Незалежно від того, чи означає це переорієнтацію ресурсів на військове виробництво чи взяття до рук зброї, ми зробимо все, щоб [SWE.GetName] вижив."
 SWE_nordic_centralized_air_command_desc:0 "Протиповітряна оборона стала вирішальним фронтом у сучасній війні, але йти в ногу з технологічним прогресом дорого. Щоб знизити витрати, зберігаючи міцну оборону, ми повинні сформувати об'єднане Північне повітряне командування."
 SWE_promote_nordic_identity_desc:0 "Між скандинавською та [GER.GetAdjective]ою культурою може бути подібність, але ми не німці. Люди Скандинавії та Фінляндії мають свою власну культуру та традиції, що тягнуться в давнину, які потрібно підтримувати та захищати від усіх інші."
 SWE_radiojanst_desc:0 "Radiotjänst довів свою популярність серед громадськості, пропонуючи щоденні трансляції культурних подій і новин. Розширюючи мовну станцію, ми можемо збільшити типи програм, які вона виробляє, зберігаючи при цьому добре поінформоване населення."
 SWE_rapid_response_force_desc:0 "Підтримуючи сили швидкого реагування з бронетехніки, яку можна швидко передислокувати на фронті, де це необхідно, ми можемо мати переваги танків без потреби підтримувати їх величезну кількість."
 SWE_retool_dockyards_desc:0 "Зосередження наших зусиль на невеликих кораблях і підводних човнах дозволить використовувати наші сильні сторони, а не намагатися конкурувати з великими державами."
 SWE_rockets:0 "Raketdrift"
 SWE_ship_light_medium_battery_1:0 "15.2 cm/50 Bofors M03"
 SWE_ship_medium_battery_3:0 "20.3 cm/50 Bofors M38"
 SWE_solidified_mandate:0 "Закріплений мандат"
 SWE_sp_land_flamethrower_tank:0 "Проєкт «Nidhögg»"
 SWE_the_aland_issue_desc:0 "Оландці розмовляють шведською, вважають себе шведами і були б шведами, якби не втручання Ліги Націй. Як тоді хтось може дійти висновку, що вони не є шведами? Настав час виправити цю історичну несправедливість."
 SWE_the_aland_question:0 "[145.GetName] і їхнє питання"
 SWE_unify_the_national_socialist_movement_desc:0 "Націонал-соціалістичний рух розділений на безліч фракцій, які пишуть дрібні передовиці, критикуючи одна одну, або просто бешкетують на вулицях. Якщо вони хочуть мати хоч якийсь шанс сформувати уряд, їм потрібно буде згуртуватися навколо єдиного лідера та своїх повідомлення."
 SWE_unrestricted_submarine_warfare_desc:0 "Підводні човни пропонують здатність турбувати кораблі та ворожі військові кораблі, заміна яких є значно дорожчою. Ми повинні використовувати їх, щоби скоротити розрив у озброєннях між нашим флотом і нашими противниками."
