 INS_concessions_to_communists:0 "Поступки комуністам"
 INS_cost_text_rubber_16:0 "£resources_strip|3 §Y16§!"
 INS_cost_text_rubber_90_blocked:0 "£resources_strip|3 §R90§!"
 INS_dutch_events.1.a:0 "Якщо це зміцнить справу, ми повинні поступитися."
 INS_dutch_events.3.t:0 "[HOL.GetNameDefCap] відхиляє нашу пропозицію щодо командування флотом"
 INS_emergency_dockyard_construction_idea:0 "Надзвичайне будівництво верфей"
 INS_enact_militarism:0 "Впровадження мілітаризму"
 INS_evacuate_state:0 "Наказ про евакуацію"
 INS_expand_sea_routes_desc:0 "Наша країна багата на природні ресурси, але наша видобувна промисловість занадто спеціалізована, і нам бракує інфраструктури, необхідної для видобутку деяких рідкісних мінералів, таких як хром і вольфрам. Якщо ми хочемо покращити наші можливості військового виробництва, нам потрібно буде імпортувати їх з інших місць. Щоб повною мірою скористатися перевагами нашої торговельної мережі, яка постійно зростає, нам потрібно буде збільшити потужність нашого торговельного флоту."
 INS_fate_of_de_javasche_bank:0 "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_desc_independent:0 "Ми успадкували валюту в стані кризи. Старий колоніальний гульден уже падав, а перехід на рупію ніяк не стабілізував ринки. Банку Індонезії потрібен чіткий курс від уряду, інакше наша молода економіка постраждає від цього."
 INS_fighter_equipment_4:0 "Lockheed P-80 Shooting Star"
 INS_heavy_fighter_equipment_3:0 "Fokker G.I Wasp"
 INS_industrial_events.5.b:0 "Ми прив'яжемо індійський гульден до голландського гульдена."
 INS_industrial_events_5_desc_colonial:0 "Резерви De Javasche Bank впали до найнижчої точки за десятиліття. За гульден купують менше з кожним місяцем, і власники плантацій вимагають оплати в іноземній валюті. Наші фінансові радники погоджуються, що Банк сам по собі не може повернути назад спад, але вони різко розходяться в думках щодо засобів правового захисту."
 INS_knilm_name_normal:0 "KNILM"
 INS_kolano_of_the_spice_sea:0 "Колано Моря Прянощів"
 INS_limited_war_events.2.desc:0 "Те, що обіцяли як швидкий удар по маріонетковому режиму, обернулося невдачею. Війська [FROM.GetAdjective], підсилені своїми імперськими спонсорами, витіснили наших людей із спірної території і тепер сидять на ній як окупанти. Щодня радіо розносить звістки про їхні хвастощі. Продовжувати натиск означає накликати на себе подальше приниження, але відступити — це визнати поразку перед усім архіпелагом."
 INS_limited_war_events.5.desc:0 "[FROM.GetNameDefCap] відкинула останню ілюзію зваженої війни. У їхніх ефірах тепер відкрито говорять про розчленування Республіки та поділ її островів між старими колоніальними господарями. Цій справі не буде тихого кінця. Індонезія або вистоїть у кінці, або не вистоїть взагалі."
 INS_loyalist_events.2.desc:0 "[INS.GetLeader] повернувся з [HOL.GetNameDef], де він зустрівся з [HOL.GetLeader]. Зустріч пройшла добре, [HOL.GetLeader] визнав ситуацію і погодився на негайне переведення Вінкельмана. Анрі Вінкельман прямує до [1058.GetName], де чекатиме на наші накази."
 INS_loyalist_events.30.a:0 "На цьому все."
 INS_maphilindo_fascism_ADJ:0 "Малайськ"
 INS_maphilindo_fascism_DEF:0 "Малайська імперія"
 INS_modifier_positive_trade_relations:0 "Позитивні торговельні відносини"
 INS_political_events.13.b:0 "Це небезпечно, але, можливо, це реальний шанс стати незалежними?"
 INS_political_events.13.t:0 "Окупація військами [?event_target:INS_invasion_event_invader.GetAdjective] неминуча"
 INS_political_events.5.t:0 "Загальні вибори в Індонезії"
 INS_political_stabilization:0 "Відновлення порядку"
 INS_purge_oppurtunists_desc:0 "Муссо провів двадцять років у Москві, навчаючись приймати накази. Він повернувся з радянськими інструкціями в кишені і планом перетворити нашу республіку на маріонетку Комінтерну. Ми не для того скидали голландців, щоб ставати на коліна перед іншим іноземним господарем. Опортуністи, які продали б нашу революцію Москві, мають бути викорінені, а народи, які ми звільняємо, повинні дивитися на Джакарту, а не на Кремль."
 INS_revolution_events.21.t:0 "[HOL.GetNameDefCap] відмовляється припиняти бойові дії"
 INS_revolution_events.28.desc:0 "Незважаючи на великі військові витрати, здійснені [HOL.GetNameDef], і наш власний безпосередній внесок у конфлікт, величезна кількість ополченців в Індії зуміла розгромити наші сили і окупувала всі великі міста, поваливши голландську адміністрацію і змусивши капітулювати."
 INS_revolution_events.29.a:0 "Це трагедія."
 INS_revolution_events.5.b:0 "Ми не зацікавлені."
 INS_revolution_planning_influence_state:0 "Створити базу ополчення у [FROM.GetName]"
 INS_revolution_planning_influence_state_points_notif_tt:0 "Ми зможемо створити базу ополчення у §Y[?INS_starting_revolution_points_count]§! додаткових регіонах §Rза межами Яви§!."
 INS_revolutionaries_working_with_indonesians_idea_desc:0 "[ROOT.GetAdjective] комуністи були спіймані на спілкуванні з індонезійськими лідерами, і їх підозрюють у змові з метою збройного повстання."
 INS_revolutionary_strategist:0 "Революційний стратег"
 INS_rubber_for_xp:0 "Продати каучук для фінансування навчальних місій"
 INS_set_leader_to_tjarda:0 "Обрати $INS_a_t_van_starkenborgh_stachouwer$"
 INS_strat_bomber_equipment_1:0 "Boeing B-17 Flying Fortress"
 INS_super_heavy_tank_equipment_1_short:0 "SH. Tank"
 INS_the_declaration_of_independence_tt:0 "Ми проголосимо §YНезалежність§!. Кожен регіон, де ми створили §YБазу ополчення§! або §YШтаб§!, буде під нашим контролем, а решта залишиться у [HOL.GetNameDef]\n\n[HOL.GetNameDefCap] скоріше за все, не буде визнавати наш суверенітет, і розпочнеться конфлікт низької інтенсивності. Це може перерости у §Rвійну§!.\n\nВідкриває наземні рейди для захоплення регіонів."
 INS_tkr_professional_army:0 "Професійна армія"
 INS_transport_plane_equipment_1_short:0 "Electra Junior"
 INS_union_events.9.t:0 "[INS.GetNameDefCap] приймає пропозицію союзу"
 INS_volksraad_allow_language_in_government_desc:0 "Державні посади в Ост-Індії, включно з Фольксраадом, вимагають вільного володіння нідерландською мовою, що змусило багатьох членів Фольксрааду, особливо представників корінних громад, поставити під сумнів легітимність цієї демократії. Вони підготували пропозицію, яка наполягає на тому, щоб урядові посади за можливості могли обіймати люди, які розмовляють індонезійською."
 INS_volksraad_events.40.a:0 "[INS.GetLeader] має рацію."
 INS_volksraad_events.40.desc:0 "[INS.GetLeader] підписав і схвалив петицію Фольксрааду про зниження високих податків, накладених на приватні каучукові плантації. Ці податки історично дозволяли мати дуже прибуткову урядову монополію на каучук, однак міжнародний протекціонізм зробив цю систему набагато менш прибутковою. [INS.GetLeader] заявив, що він більше не вірить, що податки компенсують економічні наслідки, які вони викликають."
 INS_volksraad_reduce_rubber_export_tax:0 "Знизити податок на приватний експорт каучуку"
 INS_win_condition_base_republic_warning_desc:0 "Ми повинні продовжувати боротися, вербувати цивільних і дбати про те, щоб вогонь у душі кожного індонезійця продовжував палати. Як тільки ми повалимо адміністрацію Ост-Індії, [HOL.GetNameDef] не матиме іншого вибору, окрім як здатися."
