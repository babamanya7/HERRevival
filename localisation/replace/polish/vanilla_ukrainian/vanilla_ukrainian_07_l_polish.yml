 HINT_LOW_SUPPLY_TEXT_1:0 "Щоби підтримувати боєздатність ваших дивізій, вам знадобляться припаси. Припаси розподіляються зі £GFX_capital_hub_texticon §Yстоличного центру постачання§! та надходять £GFX_train_texticon §Yпотягами§! або £GFX_convoy_texticon §Yконвоями§! до £GFX_supply_hub_texticon §Yцентрів постачання§! або £GFX_naval_supply_hub_texticon §Yморських баз§! у різних провінціях.\n\nТоді постачання розподіляється між розгорнутими дивізіями, які перебувають у межах досяжності вузла. Ви можете побачити діапазон, вибравши іконку £GFX_supply_hub_texticon §Yвузла постачання§! й утримуючи кнопку £GFX_shift£. §YПріоритет моторизації§! може збільшити досяжність вузла постачання, що збільшує радіус, у якому ваші підрозділи отримують постачання. Для цього використовуються £GFX_unit_motorized_icon_sall §Yвантажівки§!."
 HINT_POLITICS_SCREEN_TEXT:0 "Це екран §Yполітики§!. Тут Ви можете переглядати §Yнаціональні фокуси§!, £pol_idea §Yідеї§! та §Yзакони§! Вашої країни.\n\n£pol_power §YПолітична влада§! відображає здатність Вашої країни досягти своїх політичних цілей.\nНаймання радників, виправдання претензій або гарантування незалежності — ось приклади дій, для яких потрібна £pol_power політична влада.\n\n£pol_idea Ідеї дають Вашій країні бонуси в різних сферах, але для їхньої активації також потрібна £pol_power політична влада."
 HOA_improved_irregulars_idea:0 "Поліпшені нерегулярні тактики"
 HOA_the_adjective_industrial_fund_desc:0 "Держава [ROOT.GetNameDefCap] дуже недостатньо індустріалізована. Якщо ми хочемо поліпшити життя людей і мати здатність захистити їх від іноземної агресії, нам потрібно буде швидко індустріалізувати країну."
 HOA_the_roars_of_thunder_desc:0 "Іноді на полі бою єдиним способом витіснити ворога є переважаюча вогнева сила. Найефективніший спосіб розв'язування — артилерія."
