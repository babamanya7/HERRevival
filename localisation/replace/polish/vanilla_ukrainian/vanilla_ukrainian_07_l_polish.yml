 SOV_THE_DECLARATION_DESC_COMMUNIST:0 "У своїй знаменитій «Декларації» 1927 року Патріарх Сергій присягнув на вірність Радянському Союзу, незважаючи на релігійні розбіжності між Церквою і державою. Можливо, настав час надати більш публічну роль різним митрополитам, які підтримали цю декларацію."
 SOV_VICTORY_POINTS_1820:0 "Поронайськ"
 SOV_a_global_class_struggle_desc:0 "Боротьба за визволення робітничого класу за визначенням має бути глобальною. Поки існує хоча б одна країна, яка підтримує капіталістичну систему, революція не в безпеці. Щойно робітники всього світу зрозуміють, що революція знову на марші, вони стануть під наші прапори і підтримають нас у наших починаннях."
 SOV_aid_republican_spain_tt:0 "\n[SPR.GetFlag] [SPR.GetNameDefCap]:\n"
 SOV_aleksandr_cherepanov:0 "Aleksandr Cherepanov"
 SOV_annex_tannu_tuva_desc:0 "Хоча це навряд чи має економічне значення, з політичних міркувань ми мусимо формально приєднати Тувинську народну республіку як автономну область у складі Радянського Союзу."
 SOV_anti_capitalist_campaign_generic:0 "Антикапіталістична кампанія"
 SOV_anti_soviet_military_thinking_banned_army_desc:0 "Вивчення та обговорення документів та ідей опальних і реакційних теоретиків тепер заборонено для офіцерів нашої армії в Академії, а нових випускників ретельно перевіряють, щоб жоден ворог народу не потрапив до лав Червоної армії."
 SOV_anti_soviet_military_thinking_banned_navy_desc:0 "Вивчення та обговорення документів та ідей опальних і реакційних теоретиків тепер заборонено нашим військово-морським офіцерам в Академії, а нових випускників ретельно перевіряють, щоб жоден ворог народу не потрапив до лав Червоного флоту."
