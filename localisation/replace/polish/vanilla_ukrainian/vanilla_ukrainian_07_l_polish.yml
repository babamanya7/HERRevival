 siam_dem.5.desc:0 "Старий режим зломлений, а Сері Тхай святкує тріумф. Але тріумф - це ще не уряд, і коаліція, що об'єдналася проти Пхібуна, далека від згоди щодо того, що має бути далі. У кулуарах влади звучать три імені: Пріді Баноміонг, совість опору; Куанг Апхайвонг, людина досить м'яка, щоб нікого не образити; та генерал Пхін Чунхаван, чиї офіцери чекають на своє. Кого ми піднесемо зараз, той і визначить майбутній мир."
