 SWI_expanded_military_support_desc:0 "Наші сили ополчення складаються не лише з солдатів, їм необхідно багато інших ролей, щоб вони функціонували як добре змащена машина. Якщо ми хочемо досягти успіху в захисті [ROOT.GetName], нам потрібно набирати, навчати та постачати компанії підтримки для наших ополченців."
