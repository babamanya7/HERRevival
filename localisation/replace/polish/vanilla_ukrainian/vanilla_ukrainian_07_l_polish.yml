 AST_canberra_air_disaster_events.1.a.tt:0 "Розблоковує §Yрішення 'Довіра Кабінету'§! та §Yмісію§! на збереження або усунення чинного уряду."
 AST_canberra_air_disaster_events.2.desc:0 "Чинний уряд успішно провів Австралію через національні потрясіння, що виникли після авіакатастрофи в Канберрі. Немов дороговказ, [AST.GetRulingParty] довела свою надійність і силу в скрутні часи, зрештою підвищивши суспільну підтримку по всій країні."
