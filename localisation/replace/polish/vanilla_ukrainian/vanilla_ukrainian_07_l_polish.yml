 SOV_synthetic_rubber:0 "Синтетична гума"
 SOV_the_berlin_moscow_axis_desc:0 "З новим урядом, сформованим за німецькою та італійською моделями, ми повинні налагодити колишні відносини з нашими західними сусідами. Якщо ми зосередимося на поглядах, які ми поділяємо, ми цілком можемо створити міцний і довготривалий союз між нами та державою [GER.GetName]."
 SOV_the_eyes_fear:0 "Глаза боятся..."
 SOV_the_faithful_servant_of_lenin:0 "Вірний слуга Леніна"
 SOV_the_last_break_southward_desc:0 "Остання серія завоювань остаточно закріпить за нами решту Західної Азії та Босфор, що дозволить нам вирвати контроль над Індією із захищеним флангом. Ми нарешті отримаємо беззаперечний доступ до морів, від сусіднього Середземного моря до Індійського океану."
 SOV_the_molotov_line_desc:0 "Нещодавні зміни в політичній географії Європи пересунули наш західний кордон трохи далі на захід. Будь-які старі плани укріплень застаріли. Ми мусимо створити нову лінію вздовж наших нових кордонів, щоб уповільнити будь-яку ворожу атаку, поки ми не зможемо мобілізувати наші сили для контратаки."
