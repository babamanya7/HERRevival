 SPA_garrison_control_nationalists_none_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Rжодний§!\nКількість дивізій на початку громадянської війни: §Y0§! націоналістичних — §Y3§! республіканські§!\n"
