 ARG_eliminate_american_imperialism:0 "Ліквідувати американський імперіалізм"
 ARG_eliminate_american_imperialism_idea_desc:0 "Гігант на півночі вже давно стоїть як бастіон капіталізму. Настав час покласти край американському імперіалізму і принести багряний захід сонця."
 ARG_international_loan_decisions_tt:0 "Відмикає сукупність рішень §YМіжнародні позики§!. Якщо цільові держави погодяться, [ROOT.GetNonIdeologyName] здобуде:\n$ARG_international_loan_tt$"
 ARG_island_negotiations_decisions_tt:0 "Відмикає сукупність рішень §Y$ARG_island_negotiations_decisions$§!, котрі дозолять нам домовитися про мирну угоду з державою [ENG.GetFlag]§Y[ENG.GetNameDef]§!, якщо ми не залучені в масштабнішу війну."
 ARG_liberation_theology_desc:0 "Враховуючи довгу історію католицизму в [ARG.GetNameDef] та його важливість у житті її громадян, багато священиків почали приймати нову форму християнства, відому як Теологія визволення, як реакцію на ідеологічний зсув у [ARG.GetNameDef]. Оскільки ідеї Теології визволення узгоджуються з нашим революційним рухом, було б розумно прийняти цю течію Церкви як нашу державну релігію."
 ARG_militarist_party:0 "ГОО"
 ARG_osmar_hellmuth_event_tt:0 "Станеться подія §Y$ARG_political_events.31.t$§!, котра дозволить нам обрати, звільнимо ми його та завербуємо як §Yагента§! чи залишимо у в'язниці."
 ARG_political_events.28.a:0 "Excelente!"
 ARG_political_events.36.a:0 "Яке полегшення..."
 ARG_political_events.37.a:0 "Як вони сміють!"
 ARG_political_events.44.a:0 "Ми самі по собі..."
 ARG_political_events.72.a:0 "Непросте, але нове майбутнє."
 ARG_reach_out_to_chile:0 "Звернутися до [CHL.GetNameDef]"
 ARG_roca_runciman_treaty_idea_desc:0 "Угода Роки–Рансимена — це важливий торговельний пакт між державами [ARG.GetNameDef] та [ENG.GetNameDef], підписаний у травні 1933 року, який гарантував державі [ARG.GetNameDef] фіксовану частку на [ENG.GetAdjective]ому ринку м'яса. В обмін на це [ARG.GetNameDef] погодилася на обмеження торгівлі та обміну валюти, зберігаючи комерційні інтереси держави [ENG.GetNameDef] в країні."
 ARG_socialist_volunteers_idea_desc:0 "Щоби допомогти захистити міжнародну революцію, ми повинні пропонувати допомогу нашим колегам-соціалістам, коли б не виникла потреба. Якщо у нас є вільна робоча сила, ми повинні відправити добровольців на допомогу в боротьбі з буржуазією по всьому світу!"
 ARG_support_radical_nationalism_desc:0 "З тих пір, як ми скинули кайдани Іспанської імперії, ми прагнемо визначити [ARG.GetAdjective] ідентичність. Ми процвітали і вижили тут і раз і назавжди довели, що ця земля наша. Дозвольмо посилити [ARG.GetAdjective] ідентичність і нагадати всім, хто є справжнім центром сили Південної Америки."
 ARMY_COMPOSITION_HEADER:0 "§YСклад§!\n"
