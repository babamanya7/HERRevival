 MAN_white_russian_advisers:0 "Білоросійські радники"
 MAPMODE_RESOURCES_DESCRIPTION:0 "Показує видобуток ресурсів у областях."
 MAPMODE_STRATEGIC_NAVY_DESCRIPTION:0 "Показує стратегічні регіони та дозволяє переглядати морські операції, що виконуються Вашим флотом.\nРегіони, де Ви маєте перевагу на морі, позначені §Gзеленим кольором§!.\nЗони, заштриховані §Rчервоним§!, знаходяться поза досяжністю вибраного флоту."
 MAPMODE_SUPPLY_MAP_MODE_DESCRIPTION:0 "Показує поточний стан постачання. Яскравіші зеленуваті зони мають більший доступ до постачання, у той час як пурпурові мають менший доступ. Зони, де військові частини страждають від нестачі постачання, позначаються від §Yжовтого§! до §Rчервоного§! кольорів."
