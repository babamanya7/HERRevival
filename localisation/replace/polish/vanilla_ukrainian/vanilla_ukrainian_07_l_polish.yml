 CHI_autonomy_reichskommissariat_DEF:0 "Комісаріат Китай"
 CHI_coastal_forts:0 "Стіна в море"
 CHI_construction_battalions_desc:0 "Єдиний ресурс, якого ми маємо, — це люди. Ми можемо створити підрозділи, здатні справлятися з інженерними завданнями, маючи у своєму розпорядженні практично лише лопати."
 CHI_cradle_of_civilization_tt:0 "Розблоковує рішення для інтеграції §Yазійських§! регіонів, на які ми маємо §Yпретензії§!, після досягнення достатньо високого рівня §Yпідкорення§!"
 CHI_defend_our_coasts_desc:0 "Наш ворог не зможе напасти на нас, якщо не зможе до нас дістатися. Мінування є найефективнішим засобом захисту від вторгнення. Про витрати турбуватимемося пізніше..."
 CHI_develop_northern_naval_logistics:0 "Розвиток північної морської логістики"
 CHI_generic_democratic_reformer:0 "$CHI_kwong_jiang$"
 CHI_guarantee_the_hanoi_route_desc:0 "У разі війни з Японією маршрут через Ханой на північ до наших кордонів стане найкращим каналом підтримки."
 CHI_hanyan_arsenal:0 "Ханьянський арсенал"
 CHI_highlight_hanoi_route_decision:0 "Ханойський маршрут"
 CHI_hire_chennault:0 "Найняти Шеннолта"
 CHI_hongxiang_force:0 "Сили Юньнаньських десантників"
 CHI_illicit_trade:0 "Незаконна торгівля"
 CHI_impair_the_control_yuan_desc:0 "Система стримувань і противаг є важливим фактором у функціонуванні держави, однак вона також може сповільнювати ходу прогресу. Нашій справі піде на користь, якщо Контрольний Юань буде не таким потужним, як дехто сподівається, щоб не перешкоджати нам у досягненні наших цілей."
 CHI_industrial_evacuations_from_zhejiang:0 "Евакуація промисловості з Чжецзяну"
 CHI_inefficient_economy:0 "Неефективна економіка"
 CHI_integrate_the_hongmen:0 "Інтегрувати групи оборони"
 CHI_interception_detection_desc:0 "Своєчасне виявлення дозволяє нам завдати удару раніше, ніж це зробить ворог. Ми покращимо наші радіолокаційні та спостережні мережі, щоб отримати цю критичну перевагу."
