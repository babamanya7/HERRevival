 MEX_church_power_1_desc:0 "Колись впливова Католицька церква Мексики має залишитися в минулому. Священики — це контрреволюціонери, які користуються забобонами темних мас. Перетворимо Мексику на оплот раціоналізму і науки!"
 MEX_cristero_SPR_neutrality_subject_DEF:0 "Нова Іспанія"
 MEX_cv_CAS_equipment_1:0 "Spartan «Zeus» 8W (пал.)"
 MEX_decision_prosecute_clergyman_desc:0 "Конституція 1917 року забороняє священикам брати участь у нашій політичній системі. Штрафи за носіння ряси на людях, ув'язнення за політичні заяви — спосіб напасти на церкву та показати перевагу мексиканської держави над забобонними елементами завжди знайдеться."
 MEX_decision_reconciliation_committee_desc:0 "Численні злочини, скоєні з обох сторін під час Крістіади, відкрили рану, яка досі не загоїлася. Проливаючи світло на несправедливості недавнього минулого, можливо, ми зможемо допомогти запобігти зловживанням у майбутньому."
 MEX_decision_transfer_lands_to_church:0 "Передати землі церкві"
 MEX_decision_transfer_lands_to_church_desc:0 "Дореволюційна церква була великою й багатою. Жадібні генерали та губернатори вкрали величезні ділянки церковних земель у їхніх традиційних опікунів, але тепер ми можемо повернути деякі з них."
 MEX_focus_caudillo_private_armies:0 "Приватні армії каудільйо"
 MEX_focus_oil_revenue_reinvestment_desc:0 "Оскільки зараз ми отримуємо більше прибутку від продажу нафти, наш бюджет швидко збільшився, і ми повинні планувати ефективний спосіб використання цих нових коштів. Щоб отримати від цього вигоду в довгостроковій перспективі, реінвестування цих доходів у стимулювання економіки здається найбільш очевидним вибором."
 MEX_focus_pacific_coast_naval_yards_desc:0 "Торгівля через Тихий океан з Японією та Каліфорнією для нас менш важлива, ніж Атлантика, але ми повинні захистити наші інтереси та відкрити більше можливостей. Розширення тихоокеанських верфей дає нам набагато більше свободи дій, якщо Перську затоку заблокують."
 MEX_focus_raiding_navy:0 "Рейдерський флот"
 MEX_focus_rescind_the_mexican_cession:0 "Скасувати мексиканську цесію"
 MEX_focus_smash_the_bureaucrats:0 "Розбити бюрократів"
 MEX_focus_the_gold_shirts_desc:0 "Генерал Ніколас Родрігес Карраско сформував Золотосорочників в 1933 році, щоби перемогти комуністичних зрадників, які працювали проти уряду. Воєнізована організація має стати крилом уряду, оскільки їхня мета гідна подиву, а їхні методи необхідні."
 MEX_heavy_artillery_desc:0 "Ми зосереджуємо зусилля на польовій артилерії для вогневої підтримки."
 MEX_heavy_fighter_equipment_2:0 "Важкий винищувач Lascurain-Salinas"
 MEX_knights_of_columbus_desc:0 "«Лицарі Колумба», міжнародне католицьке братство, допоможуть нам досягти миру та згоди після десятиліть громадянської війни. Як говориться в Книзі Матвія: «Ви чули, що сказано: око за око, зуб за зуб. А я говорю вам: не протився злому, але хто вдарить тебе в праву твою щоку, зверни до нього й іншу»."
 MEX_social_catholicism:0 "Соціал-католицизм"
 MEX_tac_bomber_equipment_2:0 "Середній бомбардувальник Lascurain-Salinas"
 MEX_tga_desc:0 "Підрозділ TNCA, Мексиканських національних авіаційних майстерень, що займається розробкою броньованих бойових машин."
 MIN_INTEL_REQUIRED_FOR_OLD_TECH_COUNT:0 "Потрібно розвідданих для показу кількості досліджень, старіших ніж $DAYS|H$ дн.: $MIN|H.0%$"
