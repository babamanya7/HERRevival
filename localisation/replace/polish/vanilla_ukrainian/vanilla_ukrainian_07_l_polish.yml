 NORDIC_unlocks_to_arms_against_tyranny_TT:0 "Відмикає спільний фокус §Y$NORDIC_to_arms_against_tyranny$§!"
 NOR_BLITZKRIEG_DESC:0 "У той час як Третій Райх зростає в силі та розмірах, фашистські елементи всередині Норвеґії, здається, готові скористатися можливим німецьким вторгненням, щоб захопити контроль над країною і співпрацювати з ворогом.\n\nВідкун Квіслінґ, безпринципний холуй нацистської партії, схоже, змовився, щоб отримати владу для себе і своєї партії «Національна єдність». Настав час розпочати поспішні приготування, і Норвеґія повинна об'єднатися, щоб захиститися від небезпек, які підстерігають її всередині та ззовні."
 NOR_alt_dem_integrate_militias:0 "$NOR_dem_his_integrate_militias$"
 NOR_approach_kretsen_desc:0 "На нашій окупованій території живуть видатні люди [NOR.GetAdjective], які до війни були опозицією до уряду Нюґошволда, але тепер мають спільного з нами ворога. Ці судді, адміністратори, менеджери та бізнесмени, які таємно зустрічаються на фермі Ґрімелунн може виявитися життєво важливою для наших зусиль опору, якщо вони нададуть нам свій вплив."
 NOR_arbeiderklassen_name:0 "КПРК"
 NOR_bjorn_christophersen:0 "Бйорн Крістоферсен"
 NOR_consolidate_kingdom:0 "Консолідувати королівство"
 NOR_consolidate_power:0 "Консолідувати владу"
 NOR_contested_leadership_ns_desc_ger:0 "Незалежно від того, чого Квіслінґ сподівався досягти своїм переворотом, [GER.GetNameDef] має власні плани щодо уряду, який мав бути встановлений після завоювання держави [NOR.GetNonIdeologyName]. Правда полягає в тому, що дуже мало людей в Райсі вважали Квіслінґа придатним для цієї роботи, окрім самого Гітлера, який, здається, дивно любив дрібного [NOR.GetAdjective]ого тирана."
 NOR_demand_nationalizations_desc:0 "Цей буржуазний уряд іще не знає про силу колективної власності на засоби виробництва. Нам потрібно вимогти націоналізації життєво важливих заводів по всій країні, щоб ми могли розпочати революцію ще до її початку. Що важливіше, чим більше фабрик, тим більше робітників і союзників нашої справи."
 NOR_destroyer_2_desc:0 "The Sleipner class was a class of large torpedo boats built in Norway for the Royal Norwegian Navy and commissioned between 1937 and 1939. Unlike the earlier Draug class, the Sleipner class had relatively good armament and ASW equipment. The displaced 735 tons and had decent speed for their size."
 NOR_foment_resistance_in_state_desc:0 "Люди області [FROM.GetName] мають у собі дух опору, і вони дають відсіч нашому ворогу! Їм просто потрібен додатковий поштовх, щоб це стало вирішальним."
 NOR_germanophile_officer:0 "Офіцер-ґерманофіл"
 NOR_increase_research_funding_desc:0 "[ROOT.GetName] ще ніколи не був технологічним центром. Ми повинні інвестувати в нові дослідження, якщо сподіваємося наздогнати решту Європи, щоб не ризикувати стати залежними від майбутнього ворога."
 NOR_investing_in_norway_ns_desc:0 "Інвестування частини нашого капіталу в державу [NOR.GetName] не тільки зблизить наші країни, але й зміцнить союзника на випадок, якщо нам знадобиться його допомога в майбутньому."
 NOR_invite_cadillac_to_norway_desc:0 "Багато років тому нашому дорогому принцу Олаву, тоді радісному немовляті, подарували мініатюрний Cadillac. Він, безумовно, оцінить це, якщо ми запросимо Cadillac до [NOR.GetNameDef], щоб допомогти нам розробити та виготовити транспортні засоби, які перевозитимуть наші прапор над трупами наших ворогів. Нехай це принесе князю радісні спогади про його дитинство."
 NOR_join_the_comintern:0 "Приєднатися до Комінтерну"
 NOR_kretsen_ns_desc:0 "Ця група, яка проникла глибоко в надра наших окупантів і проводить таємні зустрічі на фермі Ґрімелунд, має завдання очолити цивільний опір усіма можливими способами, ззовні та всередині фашистської окупації."
 NOR_kristian_laake:0 "Крістіан Локе"
 NOR_nortraship_desc:0 "Тепер, коли війна залишила нас вигнанцями з нашої власної країни, нам потрібно консолідувати наші зусилля з судноплавства під єдиним прапором. Nortraship дозволить нам підтримувати військові зусилля здалеку та допоможе нашим союзникам вижити достатньо довго, щоб допомогти нам повернутися в [ROOT.GetName]"
 NOR_peder_furubotn:0 "Педер Фуруботн"
 NOR_prep_fasc_dmod_2:0 "$NOR_prep_fasc_dmod_1$"
 NOR_shield_of_the_north:0 "Щит Півночі"
 NOR_social_incrementalism_desc:0 "Оскільки важкі тридцяті стали лише спогадом у свідомості [NOR.GetAdjective]ого народу, ми повинні шукати соціального прогресу, навіть якщо ми маємо наближатися до нього повільно, щоб не тикати в осине гніздо консерватизму."
 NOR_submarine_3_desc:0 "The Uredd class consisted of two British U-class submarines built for the Norwegian Navy in exile between 1941 and 1943. The ships displaced 540 tons and were armed with four 533mm torpedo tubes. They had a good complement of British radar and sonar, and a diving depth of 60m."
 NOR_tank_procurement:0 "Придбання танків"
 NOR_unlocks_emergency_productionin_state_TT:0 "Буде відкрите рішення: §Y$NOR_decision_emergency_production_title$§!."
 NOR_workers_and_farmers_rise_desc:0 "Грунт закладено, насіння посіяно, і вогонь Революції ось-ось запалиться. Нехай робітники та фермери [NOR.GetNonIdeologyName] повстануть і заберуть засоби виробництва з кривавих рук капіталістів і землевласників.."
 NO_NATIONAL_FOCUS:0 "Національний фокус не вибрано"
 NO_VALID_EXPEDITIONS:0 "Нема відповідних військових частин для відправки.\nВони мусять знаходитися в провінціях, які контролюються цільовою країною."
 NSB_poland_communist_events.402.t:0 "[From.GetNameDefCap] відмовляється"
 NSB_poland_communist_events.601.desc:0 "Східна Польща повернута і знову стала центральним елементом держави [Root.GetNameDef]. Її території вже інтегруються заново в [Root.GetAdjective] адміністрацію; землі, які зіграли таку важливу роль у поваленні старону до складу країни, яку і бився народ."
 NSB_poland_events.102.a:0 "Що ж, війна так війна!"
 NSB_poland_events.2.b:0 "Ця «претензія» не має сенсу."
 NSB_poland_events.2.d:0 "Схоже, що довгострокове регентство в державі [Root.GetNameDef] не пройшло безслідно: [From.GetLeader] тепер вимагає величати себе королем Угорщини. Ця претензія заснована лише на факті існування середньовічного польсько-угорського королівства і, безумовно, є безсоромною спробою територіальної експансії."
 NSB_poland_events.401.desc.dem:0 "[From.GetNameDefCap] сьогодні знову звертається до нас і оголошує про згоду продати територію [POL_colony_purchase.GetName]. Ми тепер у боргу у держави [From.GetNameDef], але угода все одно відбулася як не можна вчасно: [Root.GetNameDef] зазнає труднощів, тепер, коли колонія [POL_colony_purchase.GetName] знаходиться під нашим безпосереднім контролем, у нас є ще одна фортеця, де може розташуватися наш засланець."
 NSB_poland_royal_election.5.b:0 "Нам потрібне інше..."
 NSB_polish_fascist_events.102.a:0 "Настав час змінити курс."
 NSB_soviet_atomic_bomb_project.3.t:0 "Прогалина в безпеці ядерного комплексу"
 NSB_soviet_civil_war_common.002.b:0 "Ленінград — колиска революції."
 NSB_soviet_civil_war_common.003.desc:0 "Наші операції більше не таємниця. [ROOT.GetLeader] мобілізує армію та НКВС і затримує всіх, кого підозрюють в антидержавних задумах. Якщо не діяти зараз, все, за що ми билися, буде втрачено."
 NSB_soviet_civil_war_common.106.desc_exiles_civil_war:0 "Російські білогвардійські війська незадоволені тим, що при владі стоїть [SOS.GetLeader]. Вони почали бунт, що переріс у чергову громадянську війну в Росії. Повсталі звернулися до нас і пропонують дати у в обмін на допомогу в нарощуванні їхньої військової могутності."
 NSB_soviet_civil_war_common.111.desc:0 "[FROM.GetNameDefCap] погоджується навчати українське ополчення. Потім підготовлені війська будуть таємно переправлені в Україну і почнуть повстання проти сталінського режиму."
 NSB_soviet_civil_war_common.119.a:0 "Чудово"
 NSB_soviet_communist_civil_war.003.d:0 "Зінов'єв — природжений лідер."
 NSB_soviet_communist_civil_war.003.e:0 "Каменєв чудово надихне народ."
 NSB_soviet_communist_civil_war.004.a:0 "Це слід заохочувати."
 NSB_soviet_fascist_tsarist.25.desc:0 "[SOV.GetAdjective] представники запропонували включити в наш альянс державу [JAP.GetNameDef]. З огляду на історію напружених відносин держав [SOV.GetName] та [JAP.GetName], вони запропонували нам організувати цей зв'язок та послужити посередником у переговорах."
 NSB_soviet_for_the_common_good.1.t:0 "Заради загального блага"
 NSB_soviet_foreign_politics_events.267.a:0 "Нам доведеться змінити свої плани..."
 NSB_soviet_foreign_politics_events.32.t:0 "[FROM.GetNameDefCap] відмовляється"
 NSB_soviet_nationalist.001.a:0 "Ворог нашого ворога — наш друг"
 NSB_soviet_nationalist.003.t:0 "[FROM.GetNameDefCap] відповідає згодою"
 NSB_soviet_paranoia_system_events.19.a:0 "Чергових зрадників чекає справедливе покарання."
 NSB_soviet_policies_of_collective_security.8.desc:0 "Наші спроби обговорити умови договору з державою [FROM.GetNameDef] зазнали невдачі. Схоже, що питання держави [POL.GetNonIdeologyName] та її включення до пакту критично важливе, і компроміси."
 NUCLEAR_PRODUCTION_SPEED:0 "Побудовано ядерних реакторів: $NUM|Y$\nЗагальна швидкість виробництва: $PROC|%1+$/дн."
 NZL_abolish_the_railways_board_desc:0 "Урядове залізничне управління виявилося неефективним у модернізації мережі. Настав час скасувати цю аберацію і повернути залізниці під міністерський контроль."
 NZL_battleship_1_desc:0 "$ENG_battleship_1_desc$"
 NZL_battleship_2_desc:0 "$ENG_battleship_2_desc$"
 NZL_bureau_of_industry:0 "Бюро промисловості"
 NZL_cv_fighter_equipment_1:0 "Gloster Sea Gladiator"
 NZL_destroyer_2_desc:0 "$ENG_destroyer_2_desc$"
 NZL_destroyer_effort:0 "Розвиток есмінців"
 NZL_expand_the_nzpaf_desc:0 "Військово-повітряним силам Нової Зеландії потрібні нові літаки берегової охорони та морські бомбардувальники. Сучасним державам не можна забувати про війну у повітрі."
 NZL_industrial_conscription_taog_desc:0 "$NZL_industrial_conscription_desc$"
 NZL_john_a_lee:0 "Джон А. Лі"
 NZL_maori_conscription:0 "Призов маорі"
 NZL_n_weir:0 "Н. Віер"
