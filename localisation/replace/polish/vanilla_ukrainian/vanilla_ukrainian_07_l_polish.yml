 AST_nations_of_the_empire:0 "Народи імперії"
 AST_naval_auxiliary_patrol_desc:0 "Багато портів нашої великої країни є бажаними цілями для підводних човнів. Додаткова група берегових патрулів зможе вчасно попередити нас про загрозу."
 AST_no_foreign_battlefields_desc:0 "Це тривало довго, але нарешті уряд заявить, що жоден громадянин не буде примусово відправлений на службу на заморські землі."
 AST_our_own_empire_desc:0 "Настав час колишньої колонії стати з колін і проголосити себе Австралійською імперією. Наше заступництво та довгострокове планування підуть на користь усьому регіону."
 AST_percival_mcneil:0 "Персіваль Макніл"
 AST_red_solidarity_desc:0 "Боротьба в Китаї триває, мільйони страждають і гинуть. Їхня боротьба — наша боротьба, і ми не можемо стояти осторонь. Ми можемо втрутитися, розділити їхній тягар і гарантувати, що полум'я революції не згасне."
 AST_seven_million_britishers:0 "Сім мільйонів британців"
 AST_smuggle_arms_to_ireland:0 "Контрабанда зброї до Ірландії"
 AST_standard_gauge_line_to_darwin:0 "Залізниця стандартної колії до Дарвіна"
 AST_strengthen_ties_with_uk:0 "Зміцнити зв'язки зі Сполученим Королівством"
 AST_strike_from_down_under_desc:0 "Під хвилями вони ковзають, без гуркоту грому, і якщо вони знайдуть вас, ваші кораблі будуть розграбовані. Чули, чули ви про підводні човни з півдня? Краще тікайте, інакше ви втратите свій флот. Так!"
 AST_submarine_3:0 "$ENG_submarine_3$"
 AST_supply_indonesian_nationalists:0 "Постачати індонезійських націоналістів"
 AST_taking_the_helm:0 "Узятися за штурвал"
 AST_tax_reformer:0 "Податковий реформатор"
 AST_the_manpower_directorate_desc:0 "Оскільки наша економіка стає дедалі складнішою, ми стикаємося зі зростаючими кадровими проблемами. Це управління має забезпечити, щоб правильні люди з правильними навичками призначалися на правильні посади у правильний час."
 AST_thomas_blamey:0 "Томас Блеймі"
 AST_through_the_gates:0 "Через ворота"
 AST_uap_won_election_tt:0 "§YУАП§! виграла вибори"
 AST_union_infiltration_in_progress:0 "Проникнення в іноземні профспілки триває"
 AST_war_angst_spirit_tt:0 "Змінює §Y$AST_war_angst_spirit$§! на:"
 AST_woo_usa_desc:0 "Америка, ще одна тихоокеанська держава з британським корінням, — наш справжній союзник. Ця багата, могутня країна зможе краще зрозуміти наші потреби, повести нас до подальшого процвітання та захистити від агресорів."
 AST_yeramba_desc:0 "Спираючись на успіх розроблених в Австралії машин, таких як Sentinel, ми зробили наступний крок, створивши Yeramba — потужне нове доповнення до нашого арсеналу. Це 25-фунтова гармата, встановлена на шасі танка, що забезпечує мобільну, руйнівну вогневу міць проти наших ворогів."
 ASY_communism_ADJ:0 "Ассирійськ"
 AUS_STATE_976:0 "Штаєрмарк і Кернтен"
 AUS_VICTORY_POINTS_6573:0 "Кашау"
 AUS_VICTORY_POINTS_686:0 "Еденбурґ"
