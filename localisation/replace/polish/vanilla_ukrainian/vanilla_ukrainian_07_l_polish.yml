 finland.5.d:0 "Шведський уряд не бажав приєднуватися до нас у війні проти Радянського Союзу, але громадська підтримка серед наших сусідів все ще висока, і багато добровольців з інших північних країн запропонували приєднатися до наших лав, щоб допомогти військовим зусиллям. Хоча й менше, ніж ми сподівалися, але принаймні є певне усвідомлення загрози, з якою ми стикаємося."
