 ENG_CAN_suppressed_coup:0 "Канада придушила повстання.\n"
 ENG_GATHERING_STORM_DESC:0 "Хоча Сполучене Королівство вийшло з Великої війни переможцем, фундамент його великої імперії похитнувся. Кращі представники останнього покоління загинули в окопах Фландрії та Північної Франції, поки по Співдружності поширювався неспокій, а Британія набирала борги.\n\nТравма останньої війни й досі свіжа в пам'яті людей, а держава вже стикається з загрозою ще однієї. Стає дедалі ясніше, що «миру в наш час» не буде."
 ENG_HOL_autonomy_eu_member:0 "Європейська Британія"
 ENG_SH_battleship_2_desc:0 "Лінкори класу «Lion II» були розроблені в 1944 році як вдосконалена версія попереднього лінкора класу «Lion». Враховуючи уроки воєнного часу, ця конструкція була більшою та важчою, і якщо її завершити, вона матиме три або чотири потрійні 16-дюймові гармати останнього типу. Товсті броньові плити захищали корабель від будь-якої поверхні або повітряного противника. Витрати на будівництво цих кораблів, поразка ворожих флотів і потреба в авіаносцях призвели до відмови від проєкту."
 ENG_algernon_willis:0 "Елджернон Вілліс"
 ENG_battleship_2_desc:0 "Лінкори класу «King George V» були результатом Вашинґтонського 1922 року та Першого Лондонського військово-морського договору 1930 року, які обмежували максимальну водотоннажність і стрільбу капітальних кораблів. Таким чином, ці кораблі були оснащені гарматами меншого калібру, ніж попередні та навіть сучасні броненосці. Незважаючи на менший калібр, кораблі були адекватно озброєні, мали потужне зенітне озброєння та належний захист. П'ять кораблів було замовлено та закладено на заміну старим лінкорам класу «Queen Elizabeth»."
 ENG_belgium_security_desc:0 "Попередження було явно недостатньо. Якщо політичні тенденції залишаться такими, якими вони були до цього часу, Бельгія становитиме пряму загрозу нашим водам. Ми мусимо втрутитися і встановити стратегічний плацдарм на материковій частині Європи."
 ENG_blackshirt_march_in_lancashire:0 "Марш чорносорочників у Ланкаширі"
 ENG_commonwealth_of_nations:0 "Співдружність Націй"
 ENG_destroyer_2:0 "Клас «G»/«H»/«I»"
 ENG_embargo_ussr_desc:0 "Держава [SOV.GetNameDef] стає дедалі могутнішою та використовує британські ресурси для підживлення своїх військових зусиль. Ми мусимо позбавити їх доступу до нашої торгівлі."
 ENG_establish_the_local_defense_volunteers_tt:0 "Відмикає набір рішень зі §Yстворення місцевих ополчень§! і §Yзастосування місцевої самооборони на заводах§!."
