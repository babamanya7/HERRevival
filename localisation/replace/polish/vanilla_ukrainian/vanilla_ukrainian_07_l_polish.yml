 naval_lineage_desc:0 "§LЩоб зібрати корабель, потрібно 3 роки. Щоб сформувалися традиції, потрібно 300 років.§!"
 news.134.d:0 "Вже точно відомо, що Париж звільнений від німецької окупації. Союзні війська увійшли до столиці Франції, і німецький гарнізон, що залишався там, здався. Парижани тріумфуванням зустрічали визволителів, що пройшли маршем Єлисейськими полями, хоча, за чутками, німецькі снайпери ще орудують у деяких кварталах.\n\nБули побоювання, що німці використовують тактику випаленої землі при виході з міста і перетворять Париж на руїни та дим проте цього не сталося. Французький триколор майорить над Ейфелевою вежею, інші пам'ятки також не постраждали."
 news.154.t:0 "СРСР порушив пакт Молотова–Ріббентропа"
 news.159.tt:0 "[This.GetName] — член альянсу [From.GetFactionName], в якому також є [From.GetName].\n"
 news.171.d_BUL:0 "Греція відмовилася від посередництва Німеччини в її територіальній суперечці з Болгарією, порівнявши це з капітуляцією.\n\nСпілкуючись із пресою, [GRE.GetLeader] заявляє, що якщо [BUL.GetLeader] та [GER.GetLeader] бажають отримати ці території, «нехай прийдуть і спробують взяти».\n\nУ свою чергу, [BUL.GetAdjective]ий уряд спростував будь-які заяви про те, що пропонував державі [GER.GetNameDef] військову та економічну підтримку за допомогу в отриманні грецьких територій."
 news.182.d:0 "Сьогодні європейські політики були шоковані, коли французькі та німецькі дипломати оголосили про те, що [France.GetName] та [From.GetName] вступили у військовий альянс. За їхніми словами, на кордоні пролито дуже багато крові, в той час як інші сили загрожують обом державам.\n\n[From.GetName] закликає всіх зрозуміти користь від такого альянсу — замість того, щоби послаблювати один одного, давні вороги, об'єднавшись, стануть сильнішими."
 news.195.c:0 "Географічний зсув Польщі. Знову."
 news.200.d:0 "Говорячи про братерство між народами в «німецькій сфері», [From.GetLeader] у своїй сьогоднішній промові оголосив про відданість [From.GetName] політичній та дипломатичній співпраці з [CZE.GetNameDef]. Маючи значне німецькомовне населення, [CZE.GetNameDef] була представлена як природний партнер інтересів [From.GetAdjective].\n\nХоча невідомо, скільки голосів [CZE.GetNameDef] має у цій співпраці, вони принаймні можуть бути впевнені, що їхні кордони в безпеці від територіальних амбіцій [GER.GetNameDef]."
 news.207.b:0 "Вони зламають бастіони комунізму"
 news.212.b:0 "Наші вороги не повинні дружити"
 news.216.e:0 "Війна у Туреччині здається неминучою."
 news.219.c:0 "[SOV.GetAdjective]е командування сильно постраждало."
 news.22.t:0 "[ALB.GetLeader] підкорюється вимогам Італії"
 news.220.e:0 "Соціалістична структура влади є нежиттєздатною."
 news.221.a:0 "Четвертий Інтернаціонал веде за собою."
 news.233.d_war:0 "[GER.GetNameDefCap] має чіткі стратегічні інтереси в Нордиці, як для базування військових операцій, так і для імпорту природних ресурсів. Ескалація конфлікту означає, що існує цілком реальна загроза будь-яким ресурсам, що перевозяться Балтійським або Північним морями.\n\nЗ поступовим посиленням дипломатичних погроз на адресу [DEN.GetNameDef] і [NOR.GetNameDef], збільшення [GER.GetAdjective]их військових операцій в регіоні видається ймовірним."
 news.234.a:0 "Тільки не знову!"
 news.236.c:0 "Доведімо цю війну до якнайшвидшого завершення."
 news.242.c:0 "Ідеально! Все за планом."
 news.249.t:0 "[CAN.GetNameDefCap] та [MEX.GetNameDef] об'єднуються!"
 news.253.f:0 "Ми прокладаємо власний шлях!"
 news.26.c:0 "Наступна зупинка — Берлін!"
 news.26.d:0 "Нещодавно німецькі війська перетнули Райн і розташувалися неподалік від французького кордону, демонстративно порушивши Версальський договір. Франція і Велика Британія назвали те, що сталося, «кричущим порушенням» мирної угоди, що поклала край Великій війні, і почали мобілізацію військ для вторгнення до Німеччини.\n\nВ Європі знову війна!"
 news.262.t:0 "Громадянська війна в Південній Африці"
 news.273.a:0 "Принаймні, це закінчилося."
 news.28.b:0 "Вони за це заплатять!"
 news.282.b:0 "Ще одна приречена спроба вирватися на свободу."
 news.283.desc:0 "\nНа нещодавніх місцевих виборах Індійський національний конгрес отримав переважну більшість голосів за свою платформу повільного і впорядкованого переходу до місцевого самоврядування і статусу домініону в майбутньому.\n\nСкладається враження, що індійці відкинули більш радикальну політику, яку відстоював Ґанді, що виступав за повний розрив з Британією і абсолютне внутрішнє правління якнайшвидше."
 news.293.e:0 "Значить, падіння Імперії було назавжди."
 news.296.t:0 "Вільгельм приймає угорську корону"
 news.311.desc.b:0 "Словаки, які вперто тримаються за свою незалежність, відкинули [HUN.GetAdjective]і вимоги і укріплюють свій кордон. Угорщина не докладає жодних зусиль для деескалації ситуації, і обидві країни, схоже, взяли курс на війну."
 news.326.desc:0 "Внаслідок постійних і зростаючих проблем з хорватськими націоналістичними елементами югославський уряд був змушений надати хорватам більшу автономію. Було створено нову напівнезалежну державу, Бановину Хорватію, і хоча вона все ще номінально є залежною від Югославії, вплив уряду в регіоні значно зменшився."
 news.330.c:0 "Цікаво..."
 news.40.b:0 "Хай живе товариш Троцький!"
 news.42.d:0 "Німецький пасажирський дирижабль «Гінденбурґ» вибухнув сьогодні під час виконання посадки на базі у Лейкгерсті, США. З невідомої поки що причини повітряне судно спалахнуло і впало на землю; загинуло 35 людей. Через важкість видобуванні гелію, його високої вартості, а також американської заборони на його експорт, «Гінденбурґ», як і більшість німецьких дирижаблів, використовував куди більш вогненебезпечний водень, що має велику вантажність.\n\nГромадськість вражена. До того ж зараз розвиваються швидкісні види повітряного транспорту. Чи означає це кінець ери дирижаблів?"
 news.58.b:0 "Ми скоро розберемося з французами."
 news.60.d:0 "Німецькі війська вторглися до Богемії та Моравії з метою підтримання порядку після падіння чеського уряду.\n\nУ Празі окупаційні сили заявили про створення «автономного протекторату» Третього райху.\n\nЗа підтримки німців Словаччина оголосила про незалежність, і новостворену державу очолив Йозеф Тісо. Чехословаччини більше немає."
 news.67.t:0 "XII Олімпійські ігри"
 news.9.t:0 "Відступ СРСР"
