 CHI_political_power_struggle:0 "Боротьба за владу в Китаї"
 CHI_politicise_the_process_desc:0 "Як державний службовець важливо розуміти свої політичні обов'язки. Не всі це розуміють, а тому їх потрібно навчити краще. Ми переформулюємо освіту та екзаменування кожного державного службовця, щоб досягти широкого розуміння."
 CHI_press_warlord_to_become_puppet_democratic:0 "Вимагати від §Y[FROM.GetLeader]§! підкоритися центральному уряду"
 CHI_refused_support:0 "Відхилили підтримку"
 CHI_rural_reconstruction_movement_sea_desc:0 "Наші міста є динамічними центрами сучасності, але цього не можна сказати про сільську місцевість. Ми повинні докласти спільних зусиль для розширення економічного добробуту та ідеологічної підтримки в наших селах. Використовуючи весь наш вплив, ми можемо залучити райони, які інакше залишилися б занедбаними."
 CHI_scout_for_air_experts:0 "Пошук авіаційних експертів"
 CHI_sea_army_reform_desc:0 "$CHI_army_reform_desc$"
 CHI_sea_chinese_panzers:0 "$CHI_chinese_panzers$"
 CHI_sea_expand_public_education_desc:0 "Без населення, яке має доступ до освіти, ми просто відстанемо від інших націй. Щоб забезпечити процвітання нашої нації, ми повинні інвестувати в державну освіту."
 CHI_sea_guarantee_the_hanoi_route_desc:0 "$CHI_guarantee_the_hanoi_route_desc$"
 CHI_sea_land_value_tax_desc:0 "$CHI_land_value_tax_desc$"
 CHI_sea_public_works:0 "$CHI_public_works$"
 CHI_sea_push_into_manchuria:0 "Наступ у Маньчжурію"
 CHI_sea_the_yanan_incident_desc:0 "$CHI_the_yanan_incident_desc$"
 CHI_shx_integration_cost:0 "Зменшує вартість інтеграції для [SHX.GetNameDef] на §G[?shx_integration_cost_reduction|%G0]§!"
 CHI_sino_american_joint_commission_on_rural_reconstruction_desc:0 "Ми повинні використати наші американські контакти, щоб розширити наші зусилля на селі, включивши до них сільські школи, та сприяти створенню добре функціонуючої системи освіти для всієї країни."
 CHI_socialize_major_industries_desc:0 "Ми дозволили деяким особам накопичити забагато багатства та влади, що призвело до того, що ключові галузі опинилися не в тих руках. Ми повинні взяти ці галузі під опіку держави задля безпеки."
 CHI_strat_bomber_equipment_2:0 "CAMCO Type 240"
 CHI_tai_anlan:0 "Тай Аньлань"
 CHI_tank_plant_desc:0 "Наша технологія танків йде повним ходом. Час задуматися про завод, який їх будуватиме."
 CHI_the_well_timed_swoop_of_a_falcon_desc:0 "Ми освоїли способи завдання ударів і знищення наших ворогів. Від вигнання загарбників до ударів по них у їхньому власному домі — старі знання залишаються істинними й донині, коли ми йдемо до перемоги!"
 CHI_towards_a_professional_army:0 "До професійної армії"
 CHI_tsr_military_industrial_collaboration_desc:0 "Наша армія недоукомплектована і погано оснащена, значна її частина діє лише з трофейною технікою. Ми повинні спробувати виправити цю помилку, співпрацюючи з японцями та створюючи власний арсенал."
 CHI_tsr_promote_tridemism:0 "Прийняти тридемізм"
 CHI_tsr_repoen_the_natioal_assembly:0 "Знову відкрити Національну асамблею"
 CHI_tsr_son_of_heaven:0 "Син Неба"
 CHI_wan_fulin:0 "Wan Fulin"
 CHI_war_taxes_desc:0 "Відчайдушне становище змушує нас на відчайдушні заходи. Поки війна триває, ми маємо мобілізувати всі економічні ресурси нашого населення, наскільки це можливо."
 CHI_warlord_annex:0 "Анексувати §Y[FROM.GetName]§!"
 CHI_warlord_industrial_support_flag:0 " Нещодавно запропонована §Yпромислова підтримка§!"
 CHI_warlord_propaganda_stable:0 "Демонстрація стабільності"
 CHI_warlord_state_idea_desc:0 "Наша держава — далека від визначення цього слова. Це регіон і люди, які живуть своїм повсякденним життям під захистом незалежної армії, яка не присягає на вірність жодній державі. Це призводить до того, що ми мало що можемо зробити як уряд, але це також має свої переваги."
 CHI_welfare:0 "Добробут"
 CHI_y_c_james_yen:0 "Y.C James Yen"
 CHI_zhang_fakui:0 "Zhang Fakui"
 CHL_a_new_empire_of_brazil_tt:0 "Буде відкрите рішення: §Y$CHL_integrate_rio_grande_do_sul$§!."
 CHL_an_absolute_monarchy_desc:0 "Попереду ще багато роботи, і єдиний, хто здатен взяти владу в свої руки і керувати країною, — це король. Ось чому вкрай важливо повідомити цьому кабінету, що всі вони можуть розійтися по домівках, оскільки в них більше немає потреби."
 CHL_corporacion_fomento_production_desc:0 "Після землетрусу в Чільяні була заснована організація CORFO, щоби розподіляти товари серед постраждалих, а також допомагати з контролем, розподілом і переміщенням товарів в межах [ROOT.GetAdjective]их корлонів."
 CHL_domingo_blanco:0 "Домінго Бланко"
 CHL_empower_the_preparation_department_desc:0 "Аби наш переворот пройшов максимально гладко, нам потрібно не тільки забезпечити підтримку широких верств населення, але й мати людей, плани та логістику, готові до того дня, який урешті-решт настане."
 CHL_endorse_the_constitution:0 "Ухвалити Конституцію 1925 року"
 CHL_establish_the_royal_mountaineers_desc:0 "Південні Анди є визначальною рисою країни, а гірські стрільці нашої держави — це елітні сили, які створюють фундамент, на якому стоїть наша країна. Ми мусимо розширити цю організацію та забезпечити їх усім необхідним спорядженням."
 CHL_expand_the_department_of_provinces_desc:0 "Відділ провінцій працює понаднормово, щоби забезпечити контроль над усіма регіонами Чилі. Але якщо ми повністю підтримаємо та розширимо його, ми зможемо використовувати його для ефективнішого управління навіть чужими територіями."
 CHL_fascist_tech_sharing_group_name:0 "Іспаномовне товариство розвитку"
 CHL_house_of_orelie_long:0 "Дім Орелі-Антуана I, короля-прабатька Арауканії та Патагонії"
 CHL_impose_new_taxes_tt:0 "Коли національний дух §Y$CHL_imposed_new_taxes$§! буде видалено, він змінить ідею §Y$CHL_chilean_economy_dynamic_modifier$§!:\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§! \n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-10%§!"
 CHL_integrate_the_caribbean:0 "Інтегрувати Карибський басейн"
 CHL_light_cruiser_1_desc:0 "The Chacabuco was a protected cruiser that was built in Britain and commissioned for the Chilean Navy in 1902. It displaced 4,160 tons and was armed with two Armstrong 8 in. main guns and three 18 in. torpedo tubes. It was slow but well-armored compared to early light cruisers."
 CHL_machi_in_the_army_desc:0 "Коли наші шамани мачі марширують разом із нашими військами, ми можемо гарантувати, що вони завжди залишатимуться бадьорими та мотивованими."
 CHL_news_events.3.a:0 "Ким вони себе вважають?"
 CHL_political_events.10.a:0 "Якщо вони хочуть компенсацію, вони можуть її отримати"
 CHL_political_events.17.e:0 "Мармадюк Ґроув Вальєхо"
 CHL_political_events.18.t:0 "Вибір нового Головнокомандувача армії"
 CHL_political_events.22.desc:0 "[CHL.GetLeader] звернувся до нас із надією, що ми дозволимо [CHL.GetNameDef] приєднатися до нашої фракції, щоб ми могли разом боротися в ім'я світової революції, як товариші по зброї. Що ми скажемо на це?"
 CHL_political_events.26.a:0 "Ідеально"
 CHL_political_events.32.b:0 "Ми сильніші без них"
 CHL_political_events.34.desc:0 "[GER.GetLeader] з [GER.GetNameDef] оголосив, що нам не дозволять приєднатися до їхньої фракції, оскільки ми не є частиною плану, який вони мають для майбутнього цього світу. Що, чорт забирай, вони планують?"
 CHL_political_events.55.a:0 "Ми не хочемо ризикувати війною з ними"
 CHL_political_events.59.a:0 "Ми на крок ближче до нашої кінцевої мети"
 CHL_political_events.60.desc:0 "Хоробрі, але нерозумні [ARG.GetAdjective] війська вирішили тримати позиції поблизу Лагуна-дель-Десіерто. Наші війська все ще стріляють по них, але чекають наказів щодо подальших дій."
 CHL_political_events.67.t:0 "[FROM.GetName] приймає наші вимоги"
 CHL_political_events.73.desc:0 "Настав час для різних організацій та груп мапуче обрати людину, навколо якої об'єднатися, яка поведе їх до перемоги над їхніми іспанськими ворогами, відповідаючи духу війн проти Інків та несучи спадщину Кауполікана. Таким чином, вони зібралися, щоб обрати нового Токі, військового вождя, який об'єднає та поведе свій народ до свободи."
 CHL_political_events.83.b:0 "Забезпечити якомога більше території!"
 CHL_political_events.9.t:0 "Затоплення судна «SS Tolten»"
 CHL_political_events.94.a:0 "Оскар Ескудеро Отарола може отримати титул"
 CHL_political_events.94.c:0 "Знову Карибами керуватимуть тубільці!"
 CHL_political_events.96.t:0 "Путч у Паласіо де Ла Монеда"
 CHL_preemtively_strike_foreign_revolutionaries_desc:0 "Ми, можливо, захистили нашу націю від внутрішніх комуністичних загроз, але досі існують зовнішні загрози. Ми мусимо завдати їм випереджального удару, перш ніж вони зможуть принести свою революцію до нас."
 CHL_proliferate_national_populism_tt:0 "Виконуючи фокус §Y$CHL_commence_the_counter_revolution$§!:\nПолітична влада §G+75§!."
 CHL_protect_indigeous_lands:0 "Заректися захищати тубільні землі"
 CHL_seek_foreign_investments:0 "Шукати інвестиції з-за кордону"
 CHL_ship_torpedo_sub_2:0 "6x 533-мм торпедний апарат"
 CHL_socialist_youth_idea_desc:0 "Соціалістичні молодіжні організації допоможуть нам організувати воєнізовані крила, які зможуть допомогти нашим солдатам у бою."
 CHL_sub_ship_engine_1:0 "Двигун «NLSE» 480 к. с. н. в."
 CHL_the_popular_freedom_alliance:0 "Альянс народної свободи"
 CHL_volunteers_to_the_republicans:0 "Добровольці для республіканців"
 CHL_we_must_dig_deeper:0 "Ми мусимо копати глибше"
