 RAJ_defenders_of_the_revolution_desc:0 "Вони не солдати. Вони — охоронці ідеї.\nМи піднесемо наших найбільш дисциплінованих та лояльних бійців до елітного корпусу, захисників як землі, так і ідеології."
 RAJ_destroyer_2_desc:0 "The G, H, and I class destroyers were ordered as part of the 1933 and 1934 Naval Construction Programs. They were generally repeats of the preceding F class, with a slight reduction in size. Armament in the G and H classes were the same as in the F class, with both using on the 4.7 in. guns. These ships had long range, were adequately armed, and had a strong torpedo complement. They were used extensively during the war and suffered numerous losses."
 RAJ_did_not_help_famine:0 "Did not help during Famine"
 RAJ_expand_air_bases:0 "Розширити авіабази"
 RAJ_expand_the_zamindari_system_desc:0 "Система заміндарів довгий час забезпечувала надійну основу для сільського управління та збору доходів. Розширюючи її охоплення та підтверджуючи привілеї лояльних землевласників, ми можемо забезпечити місцевий порядок та адміністративну ефективність, не перенапружуючи центральну державу."
 RAJ_fighter_equipment_0:0 "Hawker Hart"
 RAJ_focus_on_military_industry_desc:0 "Ми повинні надавати пріоритет безпеці нашої країни понад усе, ми повинні надавати пріоритет розширенню наших військових сил для забезпечення нашого виживання."
 RAJ_german_technology_german:0 "Німецькі технології"
 RAJ_guarantee_nepalese_independence_desc:0 "Суверенітет Непалу є символом стійкості проти імперського панування. Гарантуючи його незалежність, ми захищаємо Гімалаї та забезпечуємо сильного союзника в нашій боротьбі проти іноземного впливу в регіоні."
 RAJ_guided_democracy_desc:0 "Ретельно керований демократичний процес забезпечить видимість вибору, водночас гарантуючи, що результати залишаться під нашим контролем. Стабільність вимагає керівництва, і ми готові його надати."
