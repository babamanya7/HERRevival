 SIA_expand_domestic_arms_workshops_desc:0 "Наші внутрішні можливості з виробництва військових матеріалів жалюгідно відстають від інших розвинених країн. Нам потрібно зосередитися на розширенні військового виробництва на рідній землі, щоб переконатися, що наші сили постійно отримують нове обладнання."
 SIA_for_the_preservation_of_siamese_independence_desc:0 "Протягом останнього століття, держави світу зазіхали на територіальну цілісність [SIA.GetAdjective], і це століття, нічим не відрізняється. Ми повинні діяти рішучіше, якщо хочемо зберегти нашу країну, щоб не залишитися державою-обрубком, скаліченою, розділеною та розірваною на частини."
 SIA_fortress_saigon_desc:0 "Північ нашої нової Імперії захищатиме Ханой. З горами на півночі та річкою Хонгха спереду він ідеально розташований для стримування будь-яких загарбників."
 SIA_heavy_fighter_equipment_1_short:0 "Ki-38"
 SIA_heavy_tank_equipment_1:0 "Type 95 Heavy Tank"
 SIA_khana_ratsadon_military_coup_mission:0 "Військові планують скинути уряд!"
 SIA_maintain_resource_independence_desc:0 "Іноземні контракти можуть принести швидкий прибуток, але за ним слідує залежність. Зберігаючи контроль над нашими ресурсами, ми зберігаємо свободу спрямовувати їх відповідно до сіамських потреб, а не іноземних вимог."
 SIA_national_defense_in_asia_desc:0 "Оборона Азії вимагає дисципліни, ієрархії та спільної стратегічної мети. Виступаючи на боці націоналістичного уряду Китаю, [ROOT.GetNameDef] приєднується до коаліції, сповненої рішучості протистояти [JAP.GetAdjective] експансії за допомогою організованих армій та скоординованого командування."
