 AUS_a_safe_harbor_for_dissidents:0 "Безпечна гавань для дисидентів"
 AUS_antischluss_category_desc_medium:0 "§YСередній§!"
 AUS_army_is_bundesheer:0 "s Bundesheer"
 AUS_austrian_empire_neutrality_DEF:0 "Австрійська імперія"
 AUS_civ_industry_effort_idea:0 "Надзвичайні заходи будівництва цивільної інфраструктури"
 AUS_danubian_leader:0 "Захисник дунайських інтересів"
 AUS_domestic_air_production_medium:0 "Вітчизняне виробництво середньої авіації"
 AUS_economic_resuscitation_desc:0 "Наша економіка стабілізувалася і стала стагнувати на дуже низькому рівні. Хоча деякі стверджують, що це добре, адже ми забезпечені від падіння на саме дно подібно каменю, ми знаємо, що гідні кращого і можемо зробити краще. Попереду ще багато зусиль, і цього разу ми подбаємо про те, щоб вони діяли не лише короткостроково."
 AUS_ernst_rudiger_starhemberg:0 "Ернст Рюдіґер Штаргемберґ"
 AUS_fascist_prince_of_starhemberg:0 "Фашистський принц дому Штаргемберґ"
 AUS_grossosterreich_neutrality_key:0 "Велика Австрійська імперія"
 AUS_industrial_exchange:0 "Обмін знаннями"
 AUS_invite_the_entente_tt:0 "Ми запросимо держави §Y[YUG.GetNameWithFlag]§!, §Y[ROM.GetNameWithFlag]§! й §Y[CZE.GetNameWithFlag]§! в наш альянс з умовою, що їх ідеологія §YДемократична§! або §YНейтральна§! і на даний момент вже не є частиною іншого альянсу."
 AUS_johann_jacob_reverta:0 "Йоганн Якоб Реверта"
 AUS_market_help:0 "Ринкова підтримка"
 AUS_motorized_equipment_0:0 "Вантажівка «Saurer Type B» 1916 р."
 AUS_naval_efficiency_idea:0 "Ефективність ВМС Австрії"
 AUS_news_events.10.desc:0 "Хаос кривавої громадянської війни запанував в Австрії. [FROM.GetCommunistParty] розпочала повстання проти керівної [FROM.GetNeutralParty]. Здобувши досить велику підтримку в останній час, комуністи стали силою, з якою Австрії тепер доводиться рахуватися."
 AUS_news_events.3.b:0 "Трагедія."
 AUS_news_events.6.b:0 "Наш зоряний час!"
 AUS_news_events.6.desc:0 "\n\nНе маючи жодного життєздатного варіанту союзі у своєму регіоні, [AUS.GetNameDef] знову взялась за реформування Центральних Держав. Звільнившись від покладених на них угод, країна швидкими темпами вчинила поворот до повторної мілітаризації. Чи буде їхній новий старий альянс схожим на тезку часів Великої Війни чи ні, ще належить побачити."
 AUS_pardon_political_exiles_desc:0 "За часів так званої корпоративної держави під час панування австрофашизму з нашої країни втекло багато геніальних політиків. Ми повинні розширити пропозицію щодо їх повернення, незалежно від їхньої політичної позиції."
 AUS_political_events.10.t:0 "Замах на життя Вільгельма Ценера вдалося запобігти"
 AUS_political_events.105.t:0 "[FROM.GetNameDefCap] відмовляється від своєї підтримки"
 AUS_political_events.118.c:0 "Для цього ми створимо відповідну організацію!"
 AUS_political_events.123.b:0 "Нам одної спроби було достатньо."
 AUS_political_events.15.a:0 "Вони не позбудуться нас просто так!"
 AUS_political_events.39.t:0 "[FROM.GetNameDefCap] здається"
 AUS_political_events.47.t:0 "[FROM.GetNameDefCap] не приймає нашу пропонову"
 AUS_political_events.48.a:0 "Тим відомі Габсбурґи..."
 AUS_political_events.49.b:0 "Наша територія вартує більше за пару заводів!"
 AUS_political_events.49.t:0 "[FROM.GetNameDefCap] запрошує передачі Сілезії"
 AUS_political_events.5.desc:0 "Щойно ми отримали пропозицію від [AUS.GetAdjective]их дипломатів. Після звільнення від Сен-Жерменського договору вони прагнуть відновити свою армію, які вони запевнили нас, лише для оборонних заходів. Їхня країна має історію створення досить надійних повітряних рам і має чимало талановитих пілотів, але через прогалину у їхньому виробництві та підготовці тепер вони стоять перед проблемою відновлення цього потенціалу. Якщо ми готові дивитися поза їхні дії у Великій війні, ми можемо виграти від цього партнерства."
 AUS_political_events.5.t:0 "[AUS.GetNameDefCap] прагне до співпраці між нашими ВПС"
 AUS_political_events.50.desc:0 "Ми отримали відповідь від [FROM.GetAdjective]ого уряду щодо нашого бажання придбання Сілезії. Вони люб’язно погодилися на таку угоду і негайно передадуть територію нам. Натомість ми виділимо кошти на розбудову для них кількох заводів у областях, обраних ними."
 AUS_political_events.51.desc:0 "Повідомлення [FROM.GetAdjective]их дипломатів, на жаль, явно було не тим, що ми сподівалися почути. [FROM.GetNameDef] не тільки відхиляє угоду, але й робить це у манері, яку окрім як зневажливою і принизливою не назвати. В їх відповіді вони написали питання; чому вони повинні погоджуватися на щось подібне та чому ми вважаємо, що маємо право вимагати будь-чого."
 AUS_political_events.58.t:0 "[FROM.GetNameDefCap] вимагає володарства над [39.GetName] і [850.GetName]"
 AUS_political_events.66.t:0 "[FROM.Get.GetNameDefCap] пропонує федеративний союз"
 AUS_political_events.87.desc:0 "Після певного періоду зростання комуністичних настроїв, коли [FROM.GetAdjective]а пропаганда поширювалася серед наших робітників, ми отримали ультиматум. [FROM.GetLeader] вимагає, щоб ми дозволили мирне комуністичне захоплення влади, оскільки, на його думку, цього хоче наш народ. У випадку, якщо ми відмовимося, нас запевняють, що вони підтримають наших працівників, які б у них не були плани."
 AUS_reclaim_dockyards_desc:0 "Зі зміною характеру морських боїв змінюються і потреби нашого флоту. Давно минули ті часи, коли до бою брали лише кілька могутніх кораблів. Сучасні морські битви вимагають від нас значно більших можливостей як для будівництва нових сталевих гігантів, так і для ремонту існуючих. Нам слід збільшити кількість верфей."
 AUS_recruitment_push_idea:0 "Кампанія прискореного вербування"
 AUS_reknowned_architecht:0 "Відомий архітектор"
 AUS_secret_rearmament_idea:0 "Секретне переозброєння"
 AUS_steyr_arms_investment_desc:0 "Наш колишній флагманський виробник зброї сильно постраждав через забов'язання перед Сен-Жерменським Договором. Щоб знову запустити їхню здатність виробляти потрібну нам кількість озброєння, нам слід подумати про інвестиції в них."
 AUTONOMY_CANT_TAKE_DESC:0 "$OWNER|UH$ поки не може отримати статус $NEXTLEVEL|lH$"
 AUTONOMY_CHANGE_TO_DESC:0 "$OWNER|UH$ отримає статус $LEVEL|lH$"
 AVAILABLE_SLOTS_FACTION:0 "Total available slots in faction: $SLOTS|H$"
 AZR_communism_DEF:0 "Азербайджанська соціалістична республіка"
 Allies:0 "Союзники"
 BAH:0 "Багами"
 BALTIC_RAF_organization:0 "$BALTIC_RAF$"
 BALTIC_axis_investments_desc_ger:0 "Німецькі торгові порти стоять по всій Балтиці, і хоч раніше ми були ворогами, не можна заперечувати, що торгівля з країнами Осі та інвестиції значно посилять [ROOT.GetNonIdeologyAdjective] економіку."
 BALTIC_equipment_siphon:0 "Переспрямування озброєння"
 BALTIC_events.12.a:0 "Всі вони — класові зрадники."
 BALTIC_events.18.t:0 "Пропагандистська війна"
 BALTIC_events.301.a:0 "У цьому щось є."
 BALTIC_events.501.a:0 "[Root.GetNonIdeologyName] розширюється!"
 BALTIC_events.503.d:0 "Намагаючись відродити спадщину Литовсько-Білоруської РСР, [From.GetNameDef] намагається дестабілізувати уряд Білорусі, заохочуючи його членів перекинутися на державу [From.GetNonIdeologyName]!"
 BALTIC_restore_workers_republic_desc:0 "У ході нашої боротьби за незалежність радянці допомогли створити [Root.GetAdjective]у робітничу республіку. Хоча сама республіка розпалася, її лідери, як і раніше, живуть у державах [Root.GetNameDef] і [SOV.GetNameDef], так що надія для Республіки робітників ще є"
 BALTIC_united_baltic_ssr:0 "Об'єднана балтійська РСР"
 BAR_neutrality_party:0 "Прихильники літунґи"
 BAY_democratic:0 "Вільна держава Баварія"
 BBA_african_union_events.11.b:0 "Ми не дамо себе залякати [ETH.GetLeader]."
 BBA_african_union_events.15.a:0 "Це запобігатиме конфліктам."
 BBA_african_union_events.19.t:0 "[FROM.GetNameDefCap] стає на наш захист"
 BBA_ethiopia_balance_of_power_events.22.desc:0 "Нещодавній досвід показав, що багато наших офіцерів погано підготовлені до ведення сучасної війни. Найбільш вірогідною причиною цього недоліку є наша історична тенденція присвоювати військові звання на основі спадкових або політичних титулів, а не на основі заслуг особи, про яку йдеться. З огляду на нещодавню хвилю реформ у державі [ETH.GetNameDef], настав час прийняти рішення щодо майбутнього військової ієрархії."
 BBA_ethiopia_balance_of_power_events.25.a:0 "Це для їхнього ж блага."
 BBA_ethiopia_balance_of_power_events.26.desc:0 "Нещодавній досвід показав, що багато наших офіцерів погано підготовлені до ведення сучасної війни. Найбільш вірогідною причиною цього недоліку є наша історична тенденція присвоювати військові звання на основі спадкових або політичних титулів, а не на основі заслуг особи, про яку йдеться. З нещодавньою хвилею реформ у державі [ETH.GetName], цілком доречно, щоби ми забезпечили меритократію як визначальний фактор для того, щоби стати військовим лідером."
 BBA_ethiopia_balance_of_power_events.54.t:0 "Нестача постачання в області [?ROOT.ETH_bop_state.GetName]"
 BBA_ethiopia_communist_events.26.t:0 "[SOV.GetNameDefCap] відмовляється бути посередником у конфлікті"
 BBA_ethiopia_communist_events.31.desc:0 "[ITA.GetAdjective]ий уряд погодився на припинення вогню в нашому поточному конфлікті. Сподіваємось, це дасть змогу побудувати тривалий мир між нашими країнами. Проте ми маємо залишатися пильними, адже конфлікт може спалахнути знову будь-якої миті."
 BBA_ethiopia_communist_events.34.desc:0 "Під час нашого конфлікту з [ITA.GetAdjective]ою нацією нам вдалося звільнити Сомалі від фашистів. Тепер ми маємо можливість надати народу регіону незалежність. Проте [ITA.GetAdjective]и, без сумніву, розлютяться через цей крок, що може дестабілізувати наш крихкий мир із ними."
 BBA_ethiopia_communist_events.37.desc:0 "[SPC.GetNameDefCap] обурено відреагували на нашу пропозицію про втрату територій в Африці. Вони показали, що нічим не кращі за фашистів чи імперіалістів, проти яких, начебто, виступають."
 BBA_ethiopia_communist_events.50.t:0 "[ETH.GetNameDefCap] пропонує мир"
 BBA_ethiopia_communist_events.54.desc:0 "У зв’язку з останньою хвилею [JAP.GetAdjective] добровольців, які приєдналися до нашої боротьби, ми були поінформовані, що уряд у [JAP.Capital.GetCapitalVictoryPointName] готує постачання матеріальної допомоги у вигляді піхотного спорядження. Ця допомога значно посилить революцію. Водночас [JAP.GetAdjective]ий уряд просить не розголошувати походження спорядження, щоб уникнути дипломатичних ускладнень із боку інших великих держав."
 BBA_ethiopia_communist_events.62.t:0 "[FROM.GetName] погоджується на мирну пропозицію"
 BBA_ethiopia_exile_events.04.a:0 "Будемо сподіватися, що це буде швидко"
 BBA_ethiopia_exile_events.43.t:0 "[FROM.GetName] прийняв наш запит"
 BBA_ethiopia_exile_events.56.a:0 "Ми приймемо будь-яку допомогу"
 BBA_ethiopia_fascist_events.01.t:0 "Можливість для змін"
 BBA_ethiopia_fascist_events.03.desc:0 "Представник ув'язненого самозванця з $gojjam_RU_Gen$, $ETH_hailu_tekle_haymanot$а, пропонує підтримати [ROOT.GetAdjective]е завоювання держави [ETH.GetName] в обмін на відновлення $ETH_hailu_tekle_haymanot$а на посаді лідера напівавтономного $gojjam_RU_Gen$. Збройне повстання на півночі, безсумнівно, підірвало би [ETH.GetAdjective]і сили та принесло би швидку перемогу."
 BBA_ethiopia_fascist_events.63.t:0 "[FROM.GetName] відмовляє у поставці зброї"
 BBA_ethiopia_imperial_events.4.b:0 "Ми будемо частиною Імперії Сіону."
 BBA_ethiopia_military_and_tech_events.1_peace.desc:0 "Тепер, коли війна позаду, ми маємо можливість завершити створення нашої військової академії. Перший випуск курсантів може допомогти нашій нації виграти майбутні війни і забезпечити найкраще використання нашого досвіду боротьби з італійцями."
 BBA_italo_ethiopian_war_events.100.desc:0 "[FROM.GetAdjective]ий посол звернувся до уряду з офіційним запитом від [FROM.GetLeader] дозволити йому створити тимчасовий уряд у вигнанні тут, у [ROOT.GetName], якщо війна проти [ITA.GetName] піде погано. Прийняття однозначно ускладнило б підтримання хороших стосунків із [ITA.GetName]."
 BBA_italo_ethiopian_war_events.110.t:0 "Ліга Націй вимагає миру"
 BBA_italo_ethiopian_war_events.120.desc:0 "Війна в державі [FROM.GetName] пішла не так, як очікувалося. Наша горда держава швидко стає посміховиськом Європи, а натовпи в м. [ROOT.GetCapitalVictoryPointName] стають неспокійними. Революція може бути не за горами. Наразі [FROM.GetLeader] звертається до нас із мирною пропозицією."
 BBA_italo_ethiopian_war_events.121.desc:0 "Довга і запекла боротьба нарешті закінчилася. [FROM.GetLeader] прийняв наші вимоги і припинив агресію проти держави [ROOT.GetName]. [ROOT.GetLeader] — герой дня. [ROOT.GetLeader.GetSheHeCap] неухильно вів державу [ROOT.GetNameDef] крізь ці важкі часи й успішно дав відсіч європейській колоніальній державі."
 BBA_italo_ethiopian_war_events.14.b:0 "Якщо люди захочуть поїхати..."
 BBA_italo_ethiopian_war_events.16.t:0 "Допомога вже в дорозі?"
 BBA_italo_ethiopian_war_events.202.t:0 "Дезертирство ворога"
 BBA_italo_ethiopian_war_events.403.t:0 "[FROM.GetNameDefCap] залишається непокірним"
 BBA_italo_ethiopian_war_events.501.t:0 "Примус до мирного столу"
 BBA_italy_anti_colonialism_events.05.b:0 "Ми не відмовимося від нашої обмеженої автономії!"
 BBA_italy_anti_colonialism_events.09.t:0 "[FROM.GetAdjective]ий тиск на уряд держави [ROOT.GetName]"
 BBA_italy_anti_colonialism_events.58.t:0 "Центральна Африка голосує за вступ до держави [ROOT.GetNameDef]"
 BBA_italy_colonial_management.1.b:0 "У нас є інші плани"
 BBA_italy_communist_events.03.desc:0 "Уряд держави [FROM.GetName] прислухався до нашого заклику про підтримку колег-комуністів і вирішив допомогти нам! Це не тільки зміцнить наші зв'язки з ними, але й посилить нашу обороноздатність, щоб ми могли захистити нашу рідну республіку."
 BBA_italy_communist_events.04.a:0 "[ROOT.GetNameDefCap] має переважати, незважаючи ні на що!"
 BBA_italy_council_deposes_duce.1.a:0 "Для загального блага"
 BBA_italy_interaction_events.15.a:0 "Вони ніколи не побачать, як це станеться"
 BBA_italy_interaction_events.34.desc_first_negotiation:0 "Італійський уряд звернувся до нас сьогодні з цікавою пропозицією. Вони кажуть, що хочуть ратифікувати Фронт Стрези, забезпечивши свою підтримку нашій стороні на випадок, якщо в Європі почнеться війна. Однак для того, щоб підписати цю угоду, вони вимагають територіальних поступок, а саме регіони [458.GetName] та [665.GetName]. Як ми повинні відповісти? Вони принаймні тимчасово платитимуть нам, якщо ми погодимося."
 BBA_italy_interaction_events.36.desc_first_negotiation:0 "Італійський уряд звернувся до нас сьогодні з цікавою пропозицією. Вони кажуть, що хочуть ратифікувати Фронт Стрези, забезпечивши свою підтримку нашій стороні на випадок, якщо в Європі почнеться війна. Вони хочуть, щоб ми ратифікували їхні претензії на Балкани. Це не зовсім в нашій зоні інтересів, і тому наш уряд не дуже хоче це заперечувати."
 BBA_italy_interaction_events.72.a:0 "Довго вони чинили опір."
 BBA_italy_missiolinis.121.desc:0 "У нещодавній промові дуче окреслив своє бачення великої Італії,  де одним із пунктів його промови було те, як ми повинні розірвати обмеження, накладені на нас іншими великими державами. Він оголосив Грецію життєво важливою точкою для Італії та її експансії, перешкодою, яку необхідно подолати, щоб ми могли розірвати кайдани, які на нас наклали."
 BBA_italy_missiolinis.132.desc:0 "Дуче знав, що за Тічіно швайцарці будуть вести запеклі бої, але відсутність прогресу змусила його занепокоїтися. Невдовзі після того, як наш наступ зупинився, дуче почав втручатися в плани генерала і ставити під сумнів їхню компетентність, що не пройшло повз італійську громадськість."
 BBA_italy_missiolinis.51.t:0 "Розширення парку вантажівок постачання"
 BBA_italy_missiolinis.62.a:0 "Нам доведеться обійтися."
 BBA_italy_missiolinis.91.t:0 "Розширення служби розвідки"
 BBA_italy_naval_cooperation_programs.14.a:0 "Вони можуть стати в пригоді нашому флоту."
 BBA_swiss_expansion.18.t:0 "[FROM.GetNameDefCap] Надала нам незалежність разом із Альпами"
 BBA_switzerland.19.c:0 "Наша нейтральність може бути єдиним захистом."
 BBA_switzerland_fascist.2.desc:0 "Попри наші спроби наблизитися до [FROM.GetName], вони відхилили нашу пропозицію про підкорення режиму [FROM.GetAdjective]. \n\nЦе ставить нас у скрутне становище — ми вже втратили будь-який вигляд нейтралітету, і тепер нам, можливо, доведеться виживати самотужки."
 BEL_CAS_equipment_2:0 "SABCA S.47"
 BEL_auto_complete_government_resigns_tt:0 "Цей фокус автоматично завершиться результатом події §YУряд йде у відставку§!."
 BEL_belgica_desc:0 "Белгіка була однією з північних територій Римської імперії, так названа через найбільш впливову групу людей, що проживали в цьому регіоні. Очевидно, якщо римляни змогли оцінити силу бельгійського народу, то нам слід взяти приклад з них і вивести це далі, ніж коли-небудь мріяли римляни."
 BEL_burgundy_fascism:0 "Бурґундія"
 BEL_burgundy_rising:0 "Відродження Бургундії"
 BEL_chasseurs_ardennais_ns_desc:0 "Chasseurs Ardennais — це досвідчені захисники бельгійських Арденн, висококваліфіковані та підготовлені до бойових дій у лісах."
 BEL_cockerill:0 "Cockerill"
 BEL_dame_blanche_ns:0 "Дам Бланш"
 BEL_department_of_telecommunications:0 "Департамент телекомунікацій"
 BEL_distrigaz:0 "Distrigaz"
 BEL_early_helicopters_desc:0 "Ніколя Флорін емігрував до [ROOT.GetNameDef] після Російської громадянської війни і зацікавився радикально новою формою польотів із швидко обертовими роторами. Ми повинні фінансувати цей розвиток і подивитись, куди ця нова галузь аеронавтики нас заведе!"
 BEL_eddy_blondeel_tt:0 "§YEдді Блондеель§! стає §YГенералом§!"
 BEL_european_crusade_dynamic_modifier_tt:0 "Покращити §Y$BEL_european_crusade_dynamic_modifier$§! на:"
 BEL_european_crusade_dynamic_modifier_vnv_tt:0 "Додати §Y$BEL_european_crusade_dynamic_modifier$ (VNV)§! на:"
 BEL_flanders_democratic:0 "Федеративна держава Фландрія"
 BEL_force_congolese_capitulation_decision_tt:0 "Лоялістська держава Конґо анексує уряд Стенлівіля, і в Конґо знову відновиться мир, що дозволить їм зрештою реінтегруватися в нашу державу"
 BEL_government_in_exile_cat:0 "Дихаюче серце вбитої країни"
 BEL_king_law_freedom_desc:0 "Гідний бельгієць бореться за Короля, Закон і Свободу. Слід зауважити, що король стоїть перед усіма іншими, як і Леопольд III, наш король. Адже саме його закони ми підтримуємо, і за його свободу ми боремося."
 BEL_maritime_phoenix_ns_desc:0 "Так само як фенікс піднімається з попелу, так і наш флот відроджується з уламків списаних суден."
 BEL_mio_trait_all_metal_expertise:0 "All-Metal Expertise"
