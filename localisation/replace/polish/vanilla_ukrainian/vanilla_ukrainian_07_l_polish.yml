 INDUSTRIAL_ORG_QUEUE_SAVE_OVERWRITE_DESC:0 "Оберіть, яку чергу рис перезаписати. Залиште пустим, щоби створити нову збережену чергу:"
 INDUSTRIAL_ORG_TOOLTIP_UPGRADE_ALREADY_ASSIGNED_MIO:0 "Оновити оснащення, щоби застосувати останні риси §Yдизайнерської команди§!."
 INDUSTRIAL_ORG_TRAIT_TOOLTIP_ON_TECH_CANCELLED:0 "При скасуванні прив'язаної технології:"
 INFRA_VAL_20:0 "£infrastructure_texticon $VAL|0%R$"
 INSHOL_end_to_bloodshed_desc:0 "Цей конфлікт триває вже занадто довго, з незначним прогресом у будь-якому напрямку, лише забираючи більше життів щодня. Ніхто не хоче, щоб це продовжувалося, настав час поговорити з голландськими лідерами за столом переговорів."
 INSHOL_expand_shell_desc:0 "Shell поступово стає дедалі більшою частиною нашої економіки. Зрозуміло, що ми повинні розширити нафтову інфраструктуру в Ост-Індії, щоб не відставати від експортного потенціалу Shell."
 INSHOL_hybrid_navy:0 "Гібридний флот"
 INSHOL_military_equipment_contracts:0 "Контракти на військову техніку"
 INSHOL_relocate_our_generals_desc:0 "Генерали у вигнанні, командири та солдати, що залишилися, мають бути перекинуті до [1058.GetName] з найвищим пріоритетом, поки не пізно."
 INSHOL_volksraad_compromises_desc:0 "Реформи всередині палати завели нас так далеко, і немає причин відмовлятися від цього шляху зараз. Фольксрад продовжить свою обережну роботу, торгуючись поступкою за поступку з Гаагою, досягаючи самоврядування через терпіння, а не через розрив. Майбутнє в рамках голландської співдружності пропонує більше, ніж майбутнє, проведене в боротьбі за існування поза нею."
 INS_acquire_modern_blueprints:0 "Придбати сучасні креслення"
 INS_akademi_angkatan_laut_desc:0 "Ми побудуємо Військово-морську академію з об'єктами для військово-морських досліджень, одночасно навчаючи більше громадян на інженерів та адміралів."
 INS_amir_sjarifuddin_harahap:0 "Амір Шарифуддін"
