 election.5.a:0 "Радше реформи, аніж революція!"
 election.5.d:0 "Комуністичний рух у державі [Root.GetName], підживлений широким невдоволенням серед робітничого класу та радикальними тенденціями серед академічних кіл, виріс настільки, що призвів до утворення кількох партій. Після того, як одна з них отримала значну підтримку на поточних виборах, політики з партії [Root.GetRulingParty] почали дебатувати, чи варто шукати їхньої підтримки у формуванні уряду. Хоча вони вважають наші демократичні установи нічим іншим, як буржуазною тиранією, вони, здається, прагнуть досягти бажаних змін, співпрацюючи з урядом, а не поваливши його."
