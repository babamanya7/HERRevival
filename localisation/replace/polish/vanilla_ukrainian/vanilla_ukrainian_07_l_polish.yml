 congo_independence_struggle.12.d:0 "У шокуючому кроку [BEL.GetName] вирішили скасувати свою пропозицію щодо утворення домініону! Ми не зовсім впевнені, що стало причиною цієї зміни в їхній позиції, можливо, після того, як вони відступили один раз, колонізатор робить те, що йому властиво — експлуатує ситуацію. Тепер ми повинні вирішити, як реагувати на цей образ."
 congo_independence_struggle.17.t:0 "[FROM.GetNameDefCap] прагне незалежності будь-якою ціною"
 congo_independence_struggle.24.d:0 "Звук пострілів порушив тишу ранку. [BEL.GetAdjective] поліцейські підрозділи були надіслані, щоб вивести патріотичні елементи Сили Публіки в полон, проте їх зустріли зливи куль. Заколот швидко поширюється, і міліції почали брати в руки зброю по всій країні. Підтримка справи є широкою по всій країні, однак колоніальні сили утримують контроль над кількома територіями, особливо в тих, що були найбільш експлуатовані і де було більше військової присутності. \n\nЦя Війна за незалежність почалась по-справжньому, і ми не заспокоїмось, поки Конґо не буде вільним від європейської окупації."
