 PER_constitutional_iran_democratic_ADJ:0 "Іранськ"
 PER_demand_war_reparations_desc:0 "Незважаючи на всі зусилля загарбників, їм не вдалося завершити свої цілі, і замість цього ми починаємо вигравати війну. Ми повинні негайно висунути їм наші вимоги та змусити їх заплатити за завдану шкоду."
 PER_fascism_sway_the_rich_idea_tt:0 "Коли розпочнеться громадянська війна або фашистський рух прийде до влади, ми отримаємо наступну ідею:"
 PER_fascist_attack_afghanistan:0 "Протистояти Афганістану"
 PER_foreign_policy_events.4.desc:0 "[FROM.GetAdjective] посол доставив ноту, згідно з якою [FROM.GetNameDef] погоджується організувати та здійснити спільну військову операцію проти [PER.GetNameDef]. Командування [ROOT.GetAdjective] та [FROM.GetAdjective] впевнені, що це буде швидка та ефективна операція проти чисельно та технологічно переважаючого ворога, що дозволить нам забезпечити іранські нафтові родовища та [FROM.GetAdjective] лінії постачання до [ROOT.GetNameDef], водночас запобігаючи потенційному наступу ворога з [TUR.GetNameDef] через [PER.GetName] до бакинських нафтових родовищ та [RAJ.GetNameDef]."
 PER_foreign_retraining:0 "Ініціатива іноземної перепідготовки"
 PER_fund_state_intelligence_idea_desc:0 "Щоб покращити нашу здатність контролювати державну безпеку, ми спрямували ресурси на встановлення більшого контролю над нашою програмою державної розвідки."
 PER_german_non_aggression_desc:0 "Оскільки в Європі починає наростати напруга, на нас може чинитися тиск, щоб ми обрали сторону. Однак важливо, щоб [PER.GetNameDef] залишалася нейтральною, якщо спалахне війна. Враховуючи їхню масову індустріалізацію, ми повинні запропонувати пакт про ненапад [GER.GetNameDef], щоб забезпечити нашу безпеку."
 PER_gulf_decisions_cat_desc:0 "Великі держави ніколи не потерплять нашого прямого втручання у справи їхніх маріонеток у Перській затоці. Тому ми повинні використовувати альтернативні методи, щоб підірвати їхній вплив у регіоні та поступово поширювати наш вплив."
 PER_imperial_events.130.desc:0 "Сьогодні вранці ми отримали повідомлення від [PER.GetAdjective] уряду з наміром здатися та розпочати процес капітуляції. В рамках цього вони готові поступитися нам своїми північними територіями та дозволити їх анексувати до нашої землі. Що ми повинні робити?"
 PER_imperial_events.191.desc:0 "It would seem that the [FROM.GetAdjective] have agreed to our offer, and have begun to draft our terms of surrender. It means that we will be losing out on some of our natural resources, but it is far more favorable than becoming full subjects under the control of [FROM.GetNameDef]."
 PER_imperial_events.40.desc:0 "Готуючись до того, щоб згодом стати шахом, Мохаммед Реза Пехлеві мав багато можливостей шукати кохання. Три жінки привернули його увагу, але лише одна може бути коронована шахбану та правити поруч із ним як регент [PER.GetNameDef]. Це Фавзія Єгипетська, принцеса Султана; Іран Теймурташ, перше кохання шаха; та Ірандохт, колишня принцеса Каджар, яка зустріла шаха у Швейцарії."
 PER_imperial_funded_universities:0 "Імперське фінансування університетів"
 PER_increase_education_funding:0 "Збільшити фінансування освіти"
 PER_islamic_revolution_events.2.desc:0 "Наші дії продовжували відштовхувати духовенство, і в результаті багато високопоставлених представників Ісламу починають заручатися підтримкою серед народу [PER.GetNameDef]. Наш час спливає, і у нас потенційна революція. Як ми повинні діяти?"
 PER_land_reform:0 "Земельна реформа"
 PER_legacy_of_greatness_modifier:0 "Спадщина величі"
 PER_limit_foreign_influence_desc:0 "Надто довго [PER.GetNameDef] перебувала під впливом іноземних держав. Вони претендують на наші ресурси та вимагають, щоб ми ділилися нашими природними благами. Настав час [PER.GetNameDef] стати на ноги, і нам варто було б обмежити вплив цих сторонніх осіб на нашу націю."
 PER_march_on_saadabad:0 "Марш на Са'дабад"
 PER_opposition_has_already_selected_a_hq_1:0 "Вже обрано місце для бази операцій."
 PER_organize_resistance:0 "$PER_promote_resistance_in_gulf_states$"
 PER_pan_iranianism:0 "Пан-іранізм"
 PER_plant_resistance_cat:0 "$PER_plant_resistance_cells$"
 PER_profit_from_war_category_desc:0 "Оскільки війна охоплює світ, ми отримали унікальну можливість продавати наші величезні запаси нафти, щоб покращити власну економіку та потенційно захистити нас від зовнішніх загроз. Ця ініціатива максимально використає наші багаті природні ресурси."
 PER_promise_clergy_power_desc:0 "Іслам є наріжним каменем суспільства для багатьох наших людей. Тому ми не можемо сподіватися підтримувати підтримку народу, якщо почнемо принижувати релігійних діячів і повинні робити більше, щоб схилити їх на нашу сторону."
 PER_rally_bakhtiari_and_qashqai:0 "Згуртувати бахтіарів та кашкаїв"
 PER_reclaim_turkish_peninsula:0 "Повернути Турецький півострів"
 PER_resist_gharbzadegi_idea_desc:0 "Надмірна вестернізація стала лихом для нашої великої нації. Замість того, щоб потурати примхам тих, хто століттями колонізував наш регіон, ми повинні працювати над створенням демократичної держави, який може стояти самостійно."
 PER_sea_specialization:0 "Спеціалізація флоту"
 PER_shahbaz_organization:0 "Авіабудівна компанія «Шахбаз»"
 PER_ssb_events.9.a:0 "Чудово!"
 PER_stand_with_giants:0 "Стояти пліч-о-пліч з гігантами"
 PER_support_technology_bonus:0 "Посилення підтримки піхоти"
 PER_trains_from_britain_desc:0 "Оскільки ми готуємося відкрити Трансіранську залізницю, нам потрібні потяги, щоб якнайшвидше розпочати проєкт. Оскільки [ENG.GetAdjective] мають володіння та акції в наших сировинних ресурсах, було б вигідно для обох націй, якби вони запропонували парові двигуни для відкриття нашої нової залізниці."
 PER_trial_fifty_three:0 "Суд над п'ятдесятьма трьома"
 PER_viceroyalty_of_persia_DEF:0 "Віцекоролівство Персія"
 PHI_10_year_training_plan_desc:0 "З обіцянкою переходу до незалежності протягом десятирічного періоду, Закон про національну оборону містив положення про підготовку самодостатніх, незалежних сил, здатних захистити наш дім. Це включає перехід до регулярної армії, схеми підготовки офіцерів, створення резервних сил та інвестиції у військову інфраструктуру."
 PHI_army_of_the_philippines:0 "Армія Філіппін"
 PHI_asian_trade_connections_siam:0 "Торговельна угода з Сіамом"
 PHI_assume_the_naval_burden_desc:0 "Японія втягнута в конфлікти на суші, тоді як нашою спеціалізацією залишається море. Ми повинні запропонувати взяти на себе відповідальність за морський конфлікт, щоб вони могли повністю зосередитися на інших театрах дій."
 PHI_awaiting_response:0 "Очікує на відповідь"
 PHI_commonwealth_of_the_philippines:0 "Співдружність Філіппін"
 PHI_declare_military_emergency:0 "Оголосити воєнний стан"
 PHI_develop_domestic_aircraft_industry_desc:0 "Покладання на наших друзів і союзників було доречним досі, але врешті-решт, якщо ми хочемо бути визнаними як незалежна держава з власними військовими можливостями в цьому сучасному світі, ми повинні почати інвестувати у власну вітчизняну авіаційну промисловість. Це можна розпочати з надання субсидій авіаційним новаторам та підприємцям у нашій країні."
 PHI_emilio_aguinaldo:0 "Еміліо Агінальдо"
 PHI_encourage_chinese_immigration_idea:0 "Заохочення китайської імміграції"
 PHI_force_unification:0 "Заявити права на [FROM.GetNonIdeologyName] як на [ROOT.GetAdjective]у територію"
 PHI_hermano_jacinto:0 "Ермано Хасінто"
 PHI_if_any_state_occupied_tt:0 "Кожен окупований національний регіон (Наразі: 0):"
 PHI_integration_category:0 "Інтегрувати острови Індійського та Тихого океанів"
 PHI_legalize_the_communist_party:0 "Легалізувати Комуністичну партію"
 PHI_mandatory_conscription_desc:0 "Захист [PHI.GetNameDef] є обов'язком кожного громадянина. Тому громадяни підлягають обов'язковому призову, щоб їх можна було навчити основ бою, і, таким чином, вони були готовими та навченими, якщо від них вимагатиметься виконання військового обов'язку."
 PHI_message_to_mac:0 "генералу Даґласу МакАртуру з "
 PHI_peg_the_peso_to_the_dollar_desc:0 "Наша валюта має бути прив'язана до долара США як мірила її вартості. Це дасть нашій валюті реальну основу цінності та забезпечить надійний фундамент для налагодження торгівлі."
 PHI_permanent_usa_land_bases:0 "Створені постійні [USA.GetAdjective]і наземні бази"
 PHI_quezon_city_campus_desc:0 "Так само, як ми плануємо майбутнє нашої нації, плануючи та будуючи місто майбутнього, ми повинні думати про майбутнє наших громадян і гарантувати, що в цьому молодому місті буде місце для процвітання освітньої досконалості."
 PHI_relations_with_spanish_america_desc:0 "Наші мовні та культурні зв'язки з Іспанією та її колишніми колоніями утворюють міст для формування партнерства з цими націями в міру того, як [USA.GetAdjective]ий вплив слабшає."
 PHI_royal_exiles_desc:0 "Іспанська монархія пережила серію зречень, як примусових, так і добровільних, а також позбавлення спадщини, проте сім'я все ще існує і шукає притулку. Ми могли б отримати величезний престиж в іспаномовному світі, запропонувавши їм притулок."
 PHI_san_miguel_improved_tt:0 "Ефекти від промислового концерну §Y$PHI_san_miguel_company$§! покращено"
 PHI_self_reliance_defense_character:0 "Оборона з опорою на власні сили"
 PHI_sugar_barons_desc:0 "Цукор — це хребет, на якому тримається вся економіка Філіппін. Без цього багатого ресурсу процвітання нашої нації зникло б миттєво. Нам потрібно заохочувати тих, хто вирощує та експортує цю критично важливу культуру, заробляючи нам більше солодких, солодких грошей."
 PHI_the_great_depression_ns_fake_tt:0 "Щоденний приріст політвлади: §R0.75%§! \nЕфективність видобутку ресурсів: §R-25%§! \nФактор фабрик споживчих товарів: §Y50%§! \nШвидкість будівництва: §R-25%§! \nЛіміт напруги для вступу в альянс: §R+100%§!"
 PHI_ties_with_republican_spain:0 "Зв'язки з Республіканською Іспанією"
 PHI_usaffe_headquarters_desc:0 "Наше нове Далекосхідне командування потребуватиме належного штабного відділу, оснащеного та укомплектованого найкращими штабними офіцерами з армії Сполучених Штатів. Є багато відставних командирів, яких можна було б призвати, або перспективних офіцерів, яким потрібен реальний досвід."
