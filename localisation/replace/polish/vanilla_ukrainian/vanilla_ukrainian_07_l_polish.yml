 SOV_freedom_of_debate_unity_of_action_desc:0 "Труднощів в управлінні країною і спрямуванні її на правильний шлях багато, тому альтернативи мусять обговорюватися відкрито. Однак після прийняття рішення обов'язком кожного члена політбюро і навіть усієї партії є беззастережна підтримка цього рішення."
 SOV_has_active_materiel_designer_any_tt_NOT:0 "Нема активного §Yвиробника матеріального забезпечення§!"
 SOV_has_active_ship_designer_any_black_sea_tt:0 "Є активний чорноморський §Yконструктор кораблів§!"
 SOV_has_already_completed_this_trait:0 "Риса вже відкрита в іншої організації"
 SOV_impregnable_forts:0 "Неприступні форти"
 SOV_improve_railway_network_desc:0 "Наша перша п'ятирічка виявилася надто успішною. Масштабне розширення важкої промисловості зробило Радянський Союз набагато сильнішим у плані оборони, але радянська залізнична мережа зазнала деяких критичних проблем. Народний комісаріат шляхів сполучення (НКШС) має амбіційний план, як закрити ці вузькі місця і гарантувати, що ми зможемо захистити вітчизну."
 SOV_industry_relocation_remove_effect_tt:0 "Видалені заводи будуть переміщені в область на Уралі."
