 DEN_bop_ban_all_political_uniforms_desc:0 "По всій Європі можна побачити політичні мундири, які марширують рядами, ніби це був військовий парад. По всій Європі можна побачити політичні заворушення та нестабільність, які марширують вперед, затягуючи континент у хаос. Ми повинні запобігти такому розвитку подій. щоб досягти [ROOT.GetNameDef], поки не пізно."
