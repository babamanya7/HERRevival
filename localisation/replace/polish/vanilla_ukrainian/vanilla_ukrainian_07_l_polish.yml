 SIA_press_censorship:0 "Цензура преси"
 SIA_pridi_phanomyong:0 "Pridi Phanomyong"
 SIA_prince_of_nakhon_sawan:0 "Принц Нахонсавану"
 SIA_public_credit_desc:0 "Купці, фермери та виробники однаково обмежені в доступі до капіталу. Розширюючи державний кредит, уряд може позичати там, де приватні фінансисти вагаються, і стимулювати розвиток у занедбаних секторах."
 SIA_railway_and_port_extensions_desc:0 "Рис, деревина та олово нічого не варті, якщо вони не можуть досягти ринку. Розширення залізниць та наших портів залучить провінції до національної торгівлі та з'єднає [ROOT.GetNameDef] з ширшим світом."
 SIA_seek_support_from_constitutional_monarchists_tt:0 "Ми заручимося підтримкою конституційних монархістів.\n\nВони допоможуть нам у громадянській війні, створивши додаткові дивізії. Однак вони очікуватимуть, що ми залишимося конституційною монархією, виконавши фокус §Y$SIA_a_constitutional_monarchy$§! протягом §Y720 днів§! після здобуття влади.\n\nНевиконання цього призведе до падіння §YСтабільності§! та §YПідтримки війни§!"
