 idea_SIA_public_credit_debt_desc:0 "Кредитні зобов'язання держави є постійним тягарем для економіки, поглинаючи ресурси, які інакше пішли б у виробництво та цивільні товари."
 idea_SIA_wing_promotion_disruption_desc:0 "Відкрите фаворитизм щодо одного з крил Кхана Ратсадон вивів уряд із рівноваги. Ображена фракція зволікає з рішеннями, в армійській рутині панує безлад, а звичайне адміністрування страждає, поки новий порядок не вкоріниться."
