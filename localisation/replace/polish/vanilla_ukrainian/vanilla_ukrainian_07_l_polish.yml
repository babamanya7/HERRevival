 JAP_EQUIPMENT_VERSION_8:0 "Kai H"
 JAP_POL_anti_soviet_pact_2_tt:0 "Якщо одна з країн з духом §Y$JAP_POL_anti_soviet_pact$§! опиниться в оборонній війні з §Y[SOV.GetNameDef]§!, інші будуть призвані на допомогу"
 JAP_SH_battleship_2_desc:0 "Гіпотетичний клас «Super Yamato» використовував «Yamato» як основу, але озброєння було б ще сильнішим з головним озброєнням з 51-см гармат і потужним озброєнням ППО новітнього типу. Товщина їхньої броні була розрахована на те, щоби витримувати навіть снаряди з власних гармат, а водотоннажність становила би близько 70–80 000 тонн."
 JAP_a_common_currency_for_all_of_asia_desc:0 "У рамках нашої міжнародної координації ми повинні прагнути, щоб усі революційні держави прийняли єну як свою офіційну валюту, аби можна було належним чином створити митний і торговельний союз."
 JAP_a_red_dawn_over_asia:0 "Червоний світанок над Азією"
 JAP_a_red_dawn_over_asia_desc:0 "З перемогою наших сил і нашими кордонами, що простягаються через величезні частини Тихого океану, революція ближча до тріумфу, ніж будь-коли раніше. Червоне сонце освітлює небо, а світанок відкриває нову еру для Азії!"
