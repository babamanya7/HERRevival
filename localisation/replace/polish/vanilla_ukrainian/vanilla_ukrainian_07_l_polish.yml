 ETH_outsourced_production_factories_tt:0 "\n Якщо §Y[ITA.GetFlag][ITA.GetNameDef]§! погодиться, §Y[ETH.GetFlag][ETH.GetNameDef]§! отримає §Y4 військові заводи§!."
 ETH_purchase_obsolete_ships_desc:0 "Хоча ми досягаємо прогресу в нашому військово-морському розвитку, ми ще не в змозі розгорнути флот, який міг би належним чином захистити нашу берегову лінію. Однак, можливо, ми зможемо придбати деякі старіші кораблі в інших країн, щоби посилити наш флот."
 ETH_raise_the_chitet_desc:0 "Стягнути регіональні ополчення в усіх підконтрольних ефіопських областях."
