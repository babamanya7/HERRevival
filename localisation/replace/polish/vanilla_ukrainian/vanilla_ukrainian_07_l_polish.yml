 tank_designer_anti_air:0 "Зенітна установка"
 tank_designer_artillery_role_disallowed:0 "Установіть модуль, який дозволяє роль §Hсамохідної артилерійської установки§!, щоби могти змінити її."
 target_hun_tt:0 "Ці рішення будуть стосуватися держави §Y[HUN.GetNameWithFlag]§!"
 targeted_sabotage_collapse_tunnel_desc:0 "Основні залізничні колії в країні проходять через вузький тунель. Наші агенти знайшли слабкі місця в його конструкції та обрушать склепіння, заклавши вибухівку."
 targeted_sabotage_infrastructure_3_tt:0 "Місцевий опір у державі [From.From.GetName] докладе великих зусиль, щоби саботувати місцеву інфраструктуру."
 tech_maintenance_company_desc:0 "Обслуговування, простий і капітальний ремонт забезпечують надійну, безпечну експлуатацію військової техніки. Щоб приділити належну увагу цій проблемі, необхідно створити спеціальні роти."
 tech_military_police2_desc:0 "Взявши на себе обов'язки звичайної поліції на окупованих територіях, такі як регулювання вуличного руху та підтримання правопорядку, наша військова поліція зможе мінімізувати хаос та сум'яття, які так подобаються партизанам."
 tech_special_forces_desc:0 "Нетрадиційні методи війни вимагають особливої підготовки. Ми мусимо докласти всіх зусиль, щоби наші солдати змогли воювати навіть у найважчих умовах."
 technocrat:0 "Технократ"
 tfv_australia.1.d:0 "Сінґапурська стратегія була наріжним каменем нашої політики стримування проти держави [JAP.GetNameDef] після закінчення Великої війни. Однак передислокація Головного флоту до Сінґапуру в разі нападу залежить від підтримки наших союзників у державі [From.GetNameDef]. Оскільки ймовірна загроза для британських володінь на Далекому Сході зростає з кожним днем, верховне [From.GetAdjective]е командування представило можливу нову стратегію, яка дозволить Австралії мати набагато більший контроль над обороною регіону.\n\nЦе непоганий план, і єдине питання полягає в тому, чи ми віримо, що вони можуть забезпечити необхідну безпеку."
 tfv_australia.10.a:0 "[From.GetNameDefCap] буде виконавцем [Root.GetAdjective]их інтересів у регіоні."
 tfv_australia.2.d:0 "[From.GetAdjective]а влада ухвалила закон, який передасть контроль над усіма [From.GetAdjective]ими колоніальними володіннями поблизу Сінґапуру та Борнео державі [Root.GetNameDef].\n\nНаша національна безпека нарешті в наших руках."
 tfv_australia.50.b:0 "Ми не можемо дозволити собі конфлікти, в які нас затягне [From.GetAdjective]а держава."
 tfv_australia.51.a:0 "Світова революція чекає!"
 tfv_australia.82.a:0 "Якщо вони не будуть стояти з нами, ми змусимо їх стати перед нами на коліна."
 tfv_australia.82.t:0 "[From.GetAdjective]ий уряд протистоїть партнерству!"
 tfv_canada.61.a:0 "Берегова лінія — єдиний безпечний кордон!"
 tfv_new_zealand.91.a:0 "Чудово."
 tfv_raj.2.desc:0 "Нізам Гайдарабада, індійський князь, щедро пожертвував гроші на придбання двох повних ескадрилій наших найсучасніших винищувачів для Королівських ВПС. Уряд висловив свою подяку і оголосив, що перший літак буде названо «Дух Гайдарабада»."
 tfv_south_africa.102.t:0 "Свобода для держави [MOR.GetName]"
 tfv_south_africa.13.desc.b:0 "Посилаючись на брак доступних матеріалів, [GER.GetAdjective]ий уряд вирішив, що подальша допомога нам більше не в їхніх інтересах. Натомість усі зусилля зосереджені на розбудові власної армії. Це ставить нас у скрутне становище."
 tfv_south_africa.31.a:0 "Черговий крок до ліквідації імперіалістичної системи колоніалізму!"
 tfv_south_africa.40.b:0 "Викриття наших секретів становить загрозу нашій національній безпеці."
 tfv_south_africa.61.t:0 "Свобода для Мозамбіку"
 tfv_south_africa.70.d:0 "Звільнившися з-під влади колоніальних гнобителів, [UGA.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [UGA.GetAdjective]ого уряду."
 tfv_south_africa.84.t:0 "Свобода для держави [CHA.GetName]"
 tfv_south_africa.99.t:0 "Свобода для держави [MRT.GetName]"
 theater_brazil:0 "Бразильський театр"
 threaten_japan:0 "Демонстрація моці в Тихому океані"
 threaten_member_state_desc:0 "Ми надішлемо повідомлення лідерам держави [FROM.GetNameDef], що якщо вони не погодяться на глибшу інтеграцію з Організацією Африканської Єдності, це матиме серйозні наслідки для них особисто..."
 tooltip_mexico_stability_hit_for_peacetime_expansion:0 "Ми все ще в мирі; розширення наших збройних сил буде дуже непопулярним!\n"
 tooltip_risk_taking_header:0 "Узяття ризику: $SETTING|H$"
 torpedo_expert_desc:0 "§LЩоб вразити корабель, що рухається зі швидкістю 25 вузлів під відносним кутом 72 градуси на відстані 8 км, потрібно просто вирішити легку задачу з математики.§!"
 trait_GRE_fascist_sympathizer:0 "Прихильник фашизму"
 trait_SOV_determined:0 "Цілеспрямований"
 transport_plane_equipment:0 "Транспортний літак"
 true_plurinational_bolivia_communism:0 "Багатонаціональна народна республіка Болівія"
 tsr_manchukuo.16.a:0 "Тоді ми об'єднаємо їх"
 tsr_manchukuo.17.desc:0 "Після обговорень з [FROM.GetNameDef] було погоджено, що найкращим планом дій буде об'єднання китайської адміністрації під нашим керівництвом. Ми сподіваємося на подальшу співпрацю з ними."
 tsr_manchukuo.18.t:0 "[FROM.GetLeader] відхиляє нашу пропозицію"
 tsr_manchukuo.5.a:0 "Революція переможе!"
 tsr_manchukuo_border_war.6.a:0 "Що ж."
 type_vii_class:0 "Тип VII"
 uk_canada_focus_desc:0 "Інвестиції в промисловість і суднобудування Канади дадуть поштовх її економіці і дозволять їй зробити більший внесок у разі війни."
 uk_empire_focus_desc:0 "Наша імперія величезна і, незважаючи на нашу могутність, слабко захищена. Щоб боротися з цим, ми мусимо заохочувати імперський патріотизм по всьому королівству."
 uk_india_focus:0 "Розвиток Індії"
 underdog_mentality_navy_spirit_desc:0 "Якщо з першого разу не вийшло, пускай торпеду знову."
 undermined_support_base:0 "Підірвана база підтримки"
 undoing_brest_litowsk_goal_name:0 "Помститися за Брест-Литовський мир"
 united_mahgreb_communism:0 "Магрибська соціалістична республіка"
 united_polynesia_communism:0 "Соціалістичний союз народів Океанії"
 upgrade_airforce_department:0 "Відділ повітряної розвідки"
 upgrade_economy_civilian:0 "Економічно-цивільна розвідка"
 upgrade_psycho_warfare:0 "Психологічна війна"
 usa.14.t:0 "Сутінки фашизму"
 usa.18.a:0 "Хай [From.GetName] знає: ми готові до війни."
 usa.22.d:0 "Пропаганда фашизму з боку держави [From.GetName] починає впливати на нашу країну. Радіотрансляції дозволяють промовам [From.GetLeader] донести до наших людей, і ми навіть знайшли пропагандистські листівки, що пропагують [From.GetAdjective]ий спосіб життя, які розповсюджуються в деяких частинах країни. [Root.GetName] не є маріонеткою, і ми не дозволимо, щоби наша політика була продиктована державою [From.GetName]. Однак ми не можемо заперечувати вплив [From.GetAdjective]ої політики на нашу країну."
 usa.4.t:0 "Угода про есмінці в обмін на бази"
 usa.401.a:0 "Beggars can't be choosers."
 veteran_communist:0 "Ветеран-комуніст"
 victory_color:0 "§G(Перемога)§!"
 war_escalation_1_or_more_tt:0 "Ескалація становить щонайменше §Y1§!"
 war_escalation_4_tt:0 "§HРівень 4§!\n §YЛіга Націй§!: Ефіопія може надіслати запит на зброю\n §YІталія§!: Італійська громадськість стурбована\n §YЕфіопія§!: Фокус §YЗакупівля зброї§! відкритий"
 war_escalation_8_or_more_tt:0 "Ескалація становить щонайменше §Y8§!"
 war_justification.11.t:0 "[ROOT.GetLeader] висловлюється проти червоної загрози"
 war_justification.206.a:0 "Які переваги можуть мати їхні переконання, якщо вони повинні нав'язувати їх нам?"
 war_propaganda_campaign_running:0 "Уже проводиться кампанія військової пропаганди"
 war_reparation_initiator_extended_desc:0 "$COUNTRY1|UY$ передає цивільні заводи державі $COUNTRY2|Y$ в якості військових репарацій:"
 wargoal_receiver_extended_desc:0 "$COUNTRY1|UY$ має цілі війни проти $COUNTRY2|Y$:"
 water_fjords:0 "Фйорди й архіпелаги"
 weather_sandstorm:0 "Піщана буря"
 werwolf_guerillas_desc:0 "Вервольфи були заздалегідь підготовленою групою німецького опору для боротьби з окупантами на випадок поразки у війні."
 wilton_fijenoord:0 "Wilton Fijenoord"
 woman_in_a_high_castle_tt1:0 "Контролює всі сучасні області держави §Y[USA.GetNameDef]§!"
 wtt_border_conflict_won_defender.1.desc:0 "Сутичка на кордоні між областями [our_state.GetName] і [their_state.GetName] закінчилася рішучою перемогою наших військ над армією [their_country.GetLeader]. [their_country.GetAdjective]і війська відступили, щоби перегрупуватися, а наші солдати взяли контроль над спірною територією."
 wtt_china_shared.10.b:0 "Ми не можемо дозволити собі бути втягнутими в цей конфлікт."
 wtt_germany.19.c:0 "Вони вважають, нам небайдуже, що про нас говорять?"
 wtt_germany.25.t:0 "Радянський Союз пом'якшує відносини"
 wtt_germany.38.c:0 "Ми ніколи більше не віддамо свою споконвічну територію!"
 wtt_germany.4.a:0 "Безперечно, він буде добрим правителем."
 wtt_germany.5.t:0 "Нідерланди не відпускають кайзера"
 wtt_germany.51.c:0 "Не можна допустити, щоб вони опинилися на волі, якщо хід війни зламається... Повісити їх!"
 wtt_germany.69.desc:0 "[From.GetAdjective]ий уряд відповів на нашу пропозицію увійти до Австро-Угорської імперії. Його представники визнають переваги такого рішення та висловлюють свою згоду об'єднати наші держави у разі, якщо це схвалять партії."
 wtt_germany.72.a:0 "Чудова думка! Наші долі і так уже переплетені."
 wtt_germany.74.a:0 "Вони позбавили себе шансу на велич!"
 wtt_germany.999.t:0 "[From.GetLeader] вимагає повернення королівських титулів"
 wtt_infiltration.23.a:0 "Потрібно зачистити всі небагато баз, про які нам відомо."
 wtt_japan.117.desc:0 "Держава [From.GetNameDef] вирішила дотримуватися укладеного з Радянським Союзом пакту про ненапад, незважаючи на те, що вона — наш союзник. Очевидно, її уряд вирішив зберегти дипломатичні відносини з членом пакту."
 wtt_japan.119.t:0 "[From.GetName] приймає пропозицію обміну"
 wtt_japan.126.a:0 "Війна виграна."
 wtt_japan.40.a:0 "Вона належить їм."
 wtt_manchukou_bandit_sabotage.21.a:0 "Цих терористів необхідно вполювати!"
 wtt_manchukou_bandit_sabotage.23.t:0 "Підірвано міст"
 wtt_news.1.a:0 "Тепер назад шляху немає."
 wtt_news.22.b:0 "Вони все сильніше загрожують нашому становищу..."
 wtt_news.27.c:0 "Чи це гарантія миру в тихоокеанському регіоні?"
 wtt_news.38.a:0 "Хай приведе він нас до перемоги!"
 wtt_news.38.b:0 "Яка різниця."
 wtt_news.39.d:0 "Очевидна відмовка."
 wtt_news.39.e:0 "Вони зрозуміють хибність своїх дій."
 wtt_news.43.desc:0 "Завдяки неймовірним зусиллям державі [From.GetNameDef] вдалося відновити Панамський канал. Сьогодні вранці, лише через півроку інтенсивних робіт, відбулося повторне відкриття важливої комунікаційної артерії, що зв'язує Атлантичний і Тихий океани."
 wtt_news.47.c:0 "Навряд чи це призведе до чогось поганого."
 wtt_news.5.a:0 "Усе пройшло ідеально."
 wtt_news.52.desc:0 "Сьогодні німецьке радіо повідомило про те, що [GER.GetLeader] оголосив себе главою уряду. Слідом за перестрілкою в бункері, під час якої було смертельно поранено фюрер, загони SS швидко перекрили всі основні автомобільні та залізничні колії з Берліна. Тим часом у столицю для відновлення порядку направили повітряні та наземні війська."
 wtt_news.65.t:0 "Підйом держави [From.GetNameDef]"
 wtt_news.66.desc:0 "Зростання [From.GetOldAdjectiveCap]ого впливу загнало в глухий кут військових експертів з усього світу, але результати говорять самі за себе. За останні декілька років грекам удалося досягти володарювання на Балканах, відвоювати Стамбул і подавити організований турецький спротив в Анатолії. Здається, зараз настає фінальна стадія греко-турецького конфлікту, який тривав понад 5 століть.\n\nІз метою ще більше укріпити національну гордість [From.GetOldAdjective]ий уряд скористався ідеєю історичного спадкоємтва та проголосив свої досягнення «візантійським опором турецьким окупантам». У межах цієї кампанії пропаганди під час параду в наново перейменованому Константиполі було оголошено, що [From.GetOldNameDef] змінює свою офіційну назву на «[From.GetNameDef]»."
 wtt_news.7.b:0 "Сподіватимемося, ціна була того варта."
 wtt_political_organisation.12.desc_not_majority:0 "Область [state.GetName] охоплена небувалими за своїм масштабом політичними заворушеннями. Ворожнеча, яку ведуть [From.GetLeader] і [majority_country.GetLeader], виплеснулася на вулиці, де щодня відбуваються сутички між їхніми прихильниками. Схоже, [majority_country.GetLeader] досі користується підтримкою більшості населення."
 wtt_political_organisation.7.a:0 "Будуть знать, як лізти в чужі справи!"
 wtt_political_warlord_support.11.desc:0 "Переговори з лідером [From.GetLeader] закінчилися. Керівник держави [From.GetNameDef] зазначив, що його народ з великою цікавістю стежить за подіями в Китаї і будує здогади щодо того, коли лідер [From.GetLeader] приєднається до боротьби за контроль або відмовиться від своїх домагань.\n\nПублічна декларація дружби та захоплення лідером [From.GetLeader] з нашого боку запевнить народ держави [From.GetNameDef] у тому, що їхній лідер є важливою та поважною фігурою у китайській політиці."
 wtt_political_warlord_support.12.t:0 "[From.GetLeader] вимагає зброю"
 wtt_prc.22.t:0 "Саботаж на цивільному заводі"
 wtt_warlord_vs_prc.3.a:0 "Збережімо це між нами."
 wtt_warlord_vs_prc.34.t:0 "[From.GetNameDefCap] відмовляється платити"
 wtt_xian_incident.3.a:0 "Мабуть, [From.GetLeader.GetSheHe] і справді застудився?"
 wuw_GER_chinese_diplomacy.2.b:0 "Ми не можемо поступитися ресурсами"
 wuw_GER_diplomacy.103.a:0 "Тривожно"
 wuw_GER_diplomacy.107.b:0 "Зараз не найкращий час"
 wuw_GER_diplomacy.107.desc:0 "[FROM.GetNameDef] запропонували тривалий обмін: ресурси в обмін на перенесення частини їхньої промисловості. Вони зацікавлені в ресурсах [FROM.FROM.GetName]."
 wuw_GER_diplomacy.109.t:0 "[FROM.GetAdjective]и відхиляють угоду про перенесення індустрії"
 wuw_GER_diplomacy.20.t:0 "Запрошення до [FROM.GetFactionName]"
 wuw_GER_diplomacy.51.desc:0 "[FROM.GetLeader] підтримав нашу пропозицію щодо флотської співпраці. [FROM.GetAdjective] інженери вже готуються до спільної розробки нових суден і озброєння. Це великий день для [ROOT.GetNameDef] та її флоту!"
 wuw_GER_diplomacy.54.a:0 "Чудово!"
 wuw_GER_diplomacy.76.desc:0 "Після завершення громадянської війни [FROM.GetNameDef] повернулись до нас із вимогою підкоритись. Ми підозрювали, що це станеться, але вирішили проігнорувати — їхня допомога в поваленні попереднього режиму була цінною. Поки що вони поводяться доволі доброзичливо, тож, можливо, це не найгірша доля."
 wuw_GER_diplomacy.80.t:0 "[FROM.GetNameDefCap] інвестує в нашу промисловість"
 wuw_GER_monroe.4.b:0 "Ми не повіримо їхній брехні!"
 wuw_GER_mutual_guarantees.3.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відхилив нашу пропозицію про взаємний захист, заявивши, що це лише прикриття для підриву їхньої державності та можливого домінування. Вони дійсно не розуміють, що втрачають..."
 wuw_GER_realpolitik.19.a:0 "Вони ще пошкодують про це"
 wuw_GER_realpolitik.26.b:0 "Забирайте свої папери назад до Берліна!"
 wuw_GER_realpolitik.37.t:0 "[FROM.GetNameDefCap] приймає наші вимоги"
 wuw_GER_realpolitik.51.b:0 "Тоді нехай спробують!"
 wuw_GER_realpolitik.6.t:0 "[FROM.GetNameDefCap] вимагає нашої анексії"
 wuw_GER_realpolitik.60.t:0 "[FROM.GetNameDefCap] вимагає повної інтеграції"
 wuw_GER_realpolitik.63.a:0 "Ми з радістю погоджуємося"
 wuw_GER_reichskommissariats.13.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.23.c:0 "Її слід включити до Колумбуса"
 wuw_GER_reichskommissariats.3.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.5.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_reichskommissariats.9.c:0 "Включити до Туркестану"
 wuw_GER_reichskommissariats.9.t:0 "Статус Поволжської Німеччини"
 wuw_GER_weltpolitik.13.t:0 "[FROM.GetNameDefCap] повертає нам колонії"
 wuw_GER_weltpolitik.15.a:0 "Ми вимагаємо компенсації!"
 wuw_GER_weltpolitik.19.t:0 "[FROM.GetNameDefCap] вимагає контролю над нашими [ANG.GetAdjective] територіями"
 wuw_GER_weltpolitik.5.desc:0 "У спільній заяві разом із [GER.GetLeader], [FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб ми здали Конґо на користь обох країн. Чи будемо ми боротись, чи просто змиримось і передамо їм територію?"
 wuw_HUN_a_cult_of_personality:0 "Культ особистості"
 wuw_HUN_a_reformed_navy_desc:0 "Будівництво флоту на основі застарілих ідей — це марна справа. Ми маємо змогу створити сучасний флот з нуля. Скористаймось цією можливістю."
 wuw_HUN_demand_croatian_reintigration_desc:0 "Забезпечивши безпеку й уклавши нові союзи, ми можемо зосередитись на важливішому. Більшість сучасної Хорватії була частиною нашого королівства до кінця Великої війни — настав час реалізувати наші претензії на ці території."
 wuw_HUN_demand_transylvania_desc:0 "Якщо ми можемо повернути наші території мирно — тим краще. Ми висунемо ультиматум загарбникам наших секейських братів з вимогою повернути ці землі."
 wuw_HUN_join_the_axis_desc:0 "Оскільки наша економіка вже надто залежна від німців, логічно буде наслідувати їх і у війні. Ми надішлемо запит на офіційне вступлення до альянсу Осі."
 wuw_HUN_negotiate_the_restrictions:0 "Переговори щодо обмежень"
 wuw_HUN_news_events.3.t:0 "[HUN.GetNameDefCap] відновлює Центральні держави"
 wuw_HUN_news_events.7.c:0 "Ревізіоністи-шахраї..."
 wuw_HUN_reinstate_the_lenin_boys_desc:0 "Ленінські хлопці — парамілітарна організація компартії 1919 року. Ми повинні її відродити та включити до збройних сил."
 wuw_HUN_reintigrate_slovakia:0 "Реінтегрувати Словаччину"
 wuw_HUN_royal_hussars_desc:0 "Наш народ має давню й славну традицію кінноти, й сьогодні не буде винятком. Має бути створено елітне кінне формування, яке служитиме королівською гвардією, що забезпечує безпеку Його Величності."
 wuw_HUN_royal_hussars_tt:0 "Отримати три §Yкавалерійські§! підрозділи угорських гусарів"
 wuw_HUN_spur_on_the_trianon_trauma:0 "Посилити травму Тріанона"
 wuw_HUN_the_matyasfold_fighter_factory_desc:0 "Weiss Manfréd Acél- és Fémművek має відкрити нове підприємство з виробництва літаків у Матяшфьолді, Будапешт, присвячене виробництву винищувачів власної розробки."
 wuw_HUN_the_toldi_desc:0 "Використовуючи шведський Landsverk L-60 як основу, ми можемо створити власний легкий танк, здатний швидко оточити великі сили ворога. Назвемо його на честь угорського лицаря XIV століття Міклоша Тольді."
 wuw_HUN_the_triple_kingdom_desc:0 "Наприкінці Великої війни, а також до неї, обговорювалося скасування дуалістичної монархії на користь потрійної, до якої входила би також корона Хорватії-Славонії. Ми повинні спробувати втілити ці обіцянки, щоб уникнути повторного розпаду імперії в майбутньому."
 ww_BEL_event_diplomatic.17.t:0 "[FROM.GetNameDefCap] Пропонує поділитися військовим досвідом"
 ww_BEL_event_diplomatic.21.t:0 "[FROM.GetNameDefCap] Приєднується до [ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.29.b:0 "Габсбурги належать минулому."
 ww_BEL_event_diplomatic.31.desc:0 "Лідер [FROM.GetAdjective] [FROM.GetLeader] звернувся до нас, щоб привітати нас у складі [FROM.GetFactionName]. Відтепер ми будемо боротися пліч-о-пліч проти спільних загроз. Час нейтралітету залишився позаду!"
 ww_BEL_event_political.1.a:0 "Створити уряд національної єдності"
 ww_BEL_event_political.2.desc:0 "Корупційний скандал, що обтяжує католицьку партію Поля ван Зееланда, сьогодні загострився, коли було виявлено, що сам прем'єр-міністр приймав \"внески\"! Здається, що це лише питання часу, перш ніж його уряд знову впаде..."
 ww_BEL_event_political.6.a:0 "Нідерландська мова має бути пріоритетною."
 ww_congo.12.d:0 "Французи безпардонно відмовилися від наших вимог! Здається, якщо ми хочемо [772.GetName], нам доведеться забрати його силою!"
 ww_congo.16.b:0 "Нехай живе [ROOT.GetNameDef]!"
 ww_congo.27.desc:0 "Раніше цього тижня, конґолезькі унтерофіцери на чолі з Першим сержантом-майором Нгоє Мукалабуші повстали в Лулуабурзі, провінція Касаї. Одним з головних тригерів здається їхнє ставлення з боку бельгійських офіцерів. Повсталі вломилися в арсенал бази вранці та пограбували білу частину міста. Вони також напали на помітні символи колоніальних властей і проголосили своє бажання незалежності. Потім вони розпорошилися по своїх рідних селах, пограбовуючи на шляху, але не змогли поширити повстання на сусідні гарнізони. Як нам діяти в цій ситуації?"
 ww_congo.43.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], відмовився виконати нашу вимогу передати нам будь-які території з великою кількістю баконґо. Як ми повинні відповісти на гноблення наших людей чужими державами?"
 ww_congo.50.a:0 "Ми будемо раді співпрацювати"
 ww_congo.66.t:0 "[FROM.GetNameDefCap] скасовує угоду з ураном"
 ww_congo.69.a:0 "Жаль..."
 ww_congo.7.a:0 "Чудово!"
