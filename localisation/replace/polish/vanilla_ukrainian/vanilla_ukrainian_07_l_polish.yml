 germany.1041.desc_ally_or_subject:0 "Попри недавню напруженість на чеському кордоні, [FROM.GetAdjective]а зовнішня політика залишається непохитною. [FROM.GetAdjectiveCap]і дипломати пред'явили нам свої територіальні вимоги, очікуючи, що ми передамо Судетську область без вагання."
