 BRA_heavy_ship_engine_1:0 "«Vickers» 30 000 к. с. н. в."
 BRA_imperial_development_key:0 "Імперський розвиток"
 BRA_invite_foreign_companies:0 "Запросити іноземні корпорації"
 BRA_kgbrazil_no_lar_desc:0 "Розвідувальна інформація про наших ворогів є критично важливим компонентом нашої здатності захищати нашу країну та інтереси, коли це необхідно. Ми повинні надати пріоритет залишатися на вершині наших технологічних потреб як для збору розвідувальних даних про нашого ворога, так і для убезпечення нашої конфіденційної інформації від них."
 BRA_no_fascism_in_south_america:0 "Жодного фашизму в Південній Америці"
 BRA_petropolis_line:0 "Підтримати претензію Педру джі Алкантари"
 BRA_promote_resource_extraction_desc:0 "Наша нація була благословенна великою кількістю природних ресурсів. Щоб сприяти більшому економічному зростанню та незалежності, ми інвестуємо в сучасне обладнання для видобутку для наших галузей промисловості."
 BRA_reach_out_to_the_great_powers:0 "$ARG_reach_out_to_the_great_powers$"
 BRA_ship_heavy_battery_2:0 "35.6-см гармата"
 BRA_smash_fascism:0 "Розгромити південноамериканський фашизм"
 BRA_south_american_tech_sharing_group_name:0 "Латиноамериканська рада з досліджень"
 BRA_stimulate_the_civilian_economy_desc:0 "Внутрішнє виробництво товарів залишається недостатнім, що призводить до відтоку грошей з нації для придбання імпорту. Ми повинні обмежити це, розширюючи наші власні галузі промисловості."
 BRA_sway_the_neighbors_lar:0 "Розвідкампанія «Зближення з сусідами»"
 BRA_tech_slot_1:0 "Університет Сан-Паулу"
 BRA_tech_slot_3_desc:0 "Щоб побудувати сильну країну, нам потрібна передова освітня система, яка надає нам легкий доступ до найбільших та найяскравіших умів [BRA.GetName]. Вчасне втручання забезпечує вплив для контролю сфер навчання в установі. Присвячення Університету народу — це лише спосіб переконатися, що в найближчі роки ці інтелектуали охоче залишаться та допоможуть нашій справі."
 BRA_third_republic_desc:0 "З відновленням стабільності в нації та зменшенням загрози військового перевороту, ми маємо можливість запровадити більш стійку Конституцію, яка забезпечує сильні механізми стримування та противаг, але дозволяє Раді Міністрів діяти рішуче, коли це необхідно."
 BRA_uk_POR_democratic_ADJ:0 "Бразильськ"
 BRA_united_states_of_brazil_desc:0 "Хоча ми багато чого зробили відповідно до Конституції 1934 року для сприяння політичній та економічній рівності, ми залишаємося обмеженими багатьма її положеннями. Зараз в інтересах нації відмовитися від цієї незадовільної Конституції на користь тієї, що подібна до Конституції наших друзів у Сполучених Штатах Америки."
 BRA_us_brazil_technology_exchange:0 "[USA.GetAdjectiveCap]о-[ROOT.GetAdjective]ий обмін технологіями"
 BRA_us_brazil_technology_exchange_desc:0 "Ми значно покращили наш національний технологічний досвід в останні роки, однак нам є чого повчитися у наших друзів у [USA.GetNameDef]. Можливо, ми можемо заохотити їх поділитися своїми знаннями в обмін на наші власні."
