 modern_tank_artillery_equipment_desc:0 "Сучасні самохідні артилерійські установки можуть зовні нагадувати танки, але вони, як правило, мають легке бронювання, занадто легке, щоб вижити в бою прямою наводкою. Проте вони захищають свої екіпажі від осколків і стрілецької зброї."
