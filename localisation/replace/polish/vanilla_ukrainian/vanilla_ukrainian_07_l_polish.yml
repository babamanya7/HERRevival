 LOADING_TIP_102:0 "«Мир мусить бути без перемоги. Перемога означатиме примус переможеного до миру та нав'язування побореному умов переможця. Їх буде прийнято з ганьбою, і це залишить образу».\n(Вудро Вілсон, 1917 рік)"
 LOADING_TIP_107:0 "«Людська доброта ніколи не підривала витривалість чи послаблювала волю вільного народу. Нація не мусить бути жорстокою, щоби бути міцною».\n(Франклін Д. Рузвелт)"
 LOADING_TIP_127:0 "«Тепер нас обмовлятиме весь світ, але я досі повністю переконаний, що ми вчинили правильно. Гітлер — головний ворог не тільки Німеччини, а і світу».\n(Геннінґ фон Тресков)"
 LOADING_TIP_83:0 "«Політика — це війна без кровопролиття, у той час як війна — це політика з кровопролиттям».\n(Мао Цзедун)"
