 SOV_preemptive_invasion_of_iran_tt:0 "\nЩойно [PER.GetNameDef] капітулює, ми зробимо країну маріонеткою, приєднавши кілька областей на нашому кордоні й отримавши права на ресурси в [PER.GetAdjective]их землях, багатих на нафту. Ми зможемо попросити [ENG.GetAdjective]у інтервенцію для проведення спільної операції."
