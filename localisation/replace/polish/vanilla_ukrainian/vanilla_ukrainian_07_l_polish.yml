 flying_fortress_desc:0 "Якщо оснастити наші висотні бомбардувальники кулеметами та достатньою кількістю броні, вони зможуть вижити у сутичці та повернутися додому."
 form_arabia_britain_coring_states_tt:0 "Усі §Yбританські§! території в Єгипті, на Близькому Сході та в Аравії стануть осердними.\n"
 form_baltic_federation_category_desc:0 "Наші попередні декларації регіональної солідарності та єдиної зовнішньої політики можуть бути поліпшені лише тепер, коли у нас під контролем уся Балтія. Інтеграція наших колишніх сусідів забезпечить підвищену безпеку для всіх перед обличчям небезпек на Заході та Сході."
 form_byzantine_empire_category_desc:0 "Звільнивши наші старі території від турецького ярма, ми можемо тепер, за допомогою певної пропаганди, стверджувати, що наша нація є спадкоємицею тієї самої імперії, яку турки припинили п'ять століть тому. Ця спадщина неодмінно підвищить наш міжнародний престиж!"
