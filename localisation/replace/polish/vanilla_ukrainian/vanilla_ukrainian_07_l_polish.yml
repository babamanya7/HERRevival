 BUL_germany_donate_fighters_desc:0 "Ми пожертвуємо нещодавно відновленої болгарської авіації невелику кількість літаків."
 BUL_hristo_lukov_death_leader_party:0 "Хрісто Луков, лідер Союзу болгарських національних легіонів,"
 BUL_illusions_of_a_non_partisan_system:0 "Ілюзії безпартійної системи"
 BUL_invigorate_national_industry_desc:0 "Ми надто довго покладалися на іноземний капітал для розвитку нашої інфраструктури, промисловості та сільського господарства. Якщо ми прагнемо самодостатності та свободи розвивати нашу країну по-своєму, ми мусимо почати з інвестування в національну промисловість та розвиток нових заводів.\nЦе буде непросте завдання, але воно, безумовно, того варте зусилля в довгостроковій перспективі."
 BUL_italy_yields_states_to_others_tt:0 "§Y[ITA.GetFlag][ITA.GetNameDefCap]§! передасть §Yіншим балканським країнам§! контроль над ось цими землями: "
