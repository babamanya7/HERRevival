 JAP_heavy_cruiser_2_desc:0 "Важкий клас «Mogami» був модернізованим і перекласифікованим класом легких крейсерів. Це зробило їх швидкими, добре озброєними і добре броньованими крейсерами. Їх велика дальність плавання досягалась за рахунок більш тонкого броньового захисту."
