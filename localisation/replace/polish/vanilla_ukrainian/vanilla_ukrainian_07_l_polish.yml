 FIN_coastal_batteries_effort_desc:0 "$FIN_coastal_defense_desc$"
 FIN_dreams_of_expansionism_desc:0 "Рісто Рюті справедливо визнає, що ми ніколи не матимемо тривалого миру, доки не отримаємо контроль над карельськими землями на нашому сході. Забезпечивши їх безпеку, ми створимо набагато більш надійний кордон з нашими сусідами."
 FIN_finnish_navy_desc:0 "ВМС Фінляндії — це мала, але горда сила, яка готова захищати свою вітчизну від усіх загроз. Акцентуючи увагу на берегову оборону та захист морських шляхів, ВМС Фінляндії стали потужним символом фінської незалежності та ключовим елементом у загальній оборонній стратегій країни. Хоча вони можуть зіткнутися з переважаючими силами, фінські моряки рішуче налаштовані на боротьбу з усією відвагою та наполегливістю своїх сухопутних колег."
 FIN_generic_fascist_demagogue:0 "Бруно Салміала"
 FIN_greater_finland_desc:0 "Більше ми не станемо здобиччю безжальних сусідів, які жадають нашої землі. Натомість ми станемо хижаком і розширимо наші кордони до їхніх природних меж, за межі земель Карелії."
 FIN_hannu_hannuksela:0 "Ганну Ганнуксела"
 FIN_hydro_electric_expansion_desc:0 "Використавши природні ресурси численних річок держави [ROOT.GetName], нам вдалося запустити значне розширення гідроенергетичної інфраструктури. Подальше інвестування в будівництво нових гідроелектростанцій дасть нам засоби для масштабного розширення нашого промислового потенціалу та прискорить ріст нашої держави."
 FIN_infantry_equipment_1_short:0 "M/39 Ukko-Pekka"
 FIN_jarl_lundqvist:0 "Ярл Лундквіст"
 FIN_mining_the_sea_locked:0 "\nВідмикає рішення §Y$FIN_mining_the_sea$§!, котре дозволяє нам розгортати шахти в §Y$STRATEGICREGION_9$§!.\nЯкщо рішення вже відімкнено іншим фокусом: §Gвартість і час§! виконання рішення §Y$FIN_mining_the_sea$§! §Gуполовинені§!."
 FIN_neutrality_party_kokoomus:0 "Національна коаліція"
 FIN_organize_the_opposition:0 "Організувати опозицію"
 FIN_pragmatic_socialism_desc:0 "Хоч ми ненавидимо методи більшовиків і їм подібних, ми не заперечуємо, що потрібно зробити більше для звільнення робітничого класу від жахів сучасного капіталізму. Завдяки ретельному застосуванню демократичного, прагматичного соціалізму ми досягнемо цього."
 FIN_pressure_government_active_flag:0 "$SOV_pressure_government_active_flag$"
 FIN_rapid_raiders_desc:0 "Світ розвивається, так само має розвиватися і наш флот. Інвестуючи в дослідження та виробництво сучасних есмінців, озброєних найновішими торпедними технологіями, ми зможемо вдарити по наших ворогах зі швидкою та смертоносною силою."
 FIN_reach_out_to_scandinavia_desc:0 "Більшість наших скандинавських сусідів поділяють наші настрої та мало зацікавлені в тому, щоб бути втягнутими в конфлікти великих держав. Підтримуючи міцні відносини з ними, ми можемо побудувати основи нашої колективної оборони."
 FIN_red_finland:0 "Червона Фінляндія"
 FIN_sami_pathfinders_recon_bonus_tt:0 "§YРозвідка та $long_range_patrol_support$:§! Розвідка: §G+100.0%§!; §Y$snow$§!: Рух: §G+10%§!; §Y$forest$§!, §Y$hills$§!, §Y$mountain$§!, §Y$marsh$§!, §Y$plains$§! та §Y$river$§!: Рух: §G+5%§!"
 FIN_socialist_welfare_compliance_tt:0 "Додає §G+15.0%§! підпорядкування у §Yкожній контрольованій області з активним опором§!."
 FIN_stir_anti_soviet_sentiment_in_karelia_desc:0 "У Карелії є багато тих, хто не погоджується з політикою радянського уряду, і ми могли б використати це, щоб викликати смуту в регіоні."
 FIN_support_for_ground_forces_ns_tt:0 " $FIN_support_for_ground_forces_dynamic_modifier_tt$\n"
 FIN_the_finnish_swedish_peoples_party_desc:0 "Люди шведського походження становлять значну меншість у Фінляндії, тому співпраця з партією, яка найбільш палко представляє їхні інтереси, може здобути нам значну підтримку нашої політики та завоювати прихильність самої Швеції."
 FIN_vaisala_radiosonde_tests_desc:0 "Під керівництвом професора Вілхо Вяйсяля новаторські зусилля в радіозондовій технології проклали шлях до успішного комерційного виробництва. Спираючись на успіх першого фінського радіозонду в 1931 році, безперервні дослідження та розробки призвели до значного технологічного прогресу."
