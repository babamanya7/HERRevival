 GRE_submarine_2:0 "Клас «Matrozos»"
 GRE_tac_bomber_equipment_1_short:0 "A2"
 GRE_the_macedonian_farmlands:0 "Багаті сільгоспугіддя Македонії"
 GRE_tobacco_exports:0 "Експорт тютюну"
