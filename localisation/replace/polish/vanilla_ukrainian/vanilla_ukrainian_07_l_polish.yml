 AST_abolition_of_private_property_desc:0 "Шестерні промисловості змащені кров'ю робітників. Ми повинні покласти край жорстокості накопичення та повністю скасувати приватну власність. Все буде спільним: від кожного за здібностями, кожному за потребами."
