 ITA_giovanni_giorgi:0 "Джованні Джорджі"
 ITA_grandi_medium_control_range:0 "$ITA_mussolini_medium_control_range$"
 ITA_hardened_irregular_bands_tt:0 "§G+5.00%§! атаки, захисту та швидкості для §Yнерегулярної піхоти§!, §Yкавалерії§! та §Yверблюдової кавалерії§!."
 ITA_heavy_cruiser_1_desc:0 "Клас «Trento» був важким крейсером, спроєктованим Regia Marina наприкінці 1920-х років. Це були перші кораблі, спроєктовані спеціально під обмеження Вашинґтонського військово-морського договору, який обмежував крейсери до 10 000 тонн і 8-дюйм. гармат. Останній корабель цього класу, Bolzano, був удосконаленим проєктом, спущеним на воду в 1932 році."
 ITA_hierarch_bop_tt:0 "При прийнятті на роботу §Y$ITA_power_balance$§! зміститься §Y15%§! до §YВеликої фашистської ради§!."
 ITA_il_sol_dell_avvenire:0 "Il Sol dell'Avvenire"
 ITA_imam:0 "IMAM"
 ITA_impero_italiano:0 "Impero Italiano"
 ITA_improve_overseas_naval_bases_desc:0 "Модернізація портів у наших заморських територіях забезпечить міцне підґрунтя для наших ВМС, які захищатимуть нашу зростаючу Імперію та загрожуватимуть торговельним шляхам наших ворогів."
 ITA_italo_balbo:0 "Італо Бальбо"
 ITA_la_battaglia_per_le_nascite_desc:0 "Якщо ми хочемо зайняти належне нам місце у світі, ми мусимо мати військову силу, щоби зайняти його силою. Для цього ми мусимо мати солдатів. Подружжю недостатньо мати одну чи дві дитини — перш ніж вигравати війни, ми мусимо виграти битву народжень."
 ITA_masters_of_the_aegean_claims_tt:0 "Отримає претензію на §Yкожну [GRE.GetAdjective]у та [TUR.GetAdjective]у прибережну область у Середземномор'ї§!, на яку [ROOT.GetFlag][ROOT.GetNameDef] ще не має претензію або яка знаходиться під [ROOT.GetFlag][ROOT.GetAdjective]им контролем.\nПоточні ефекти:"
 ITA_medium_tank_destroyer_equipment_2_short:0 "Semovente 75/34"
 ITA_military_agreements_desc:0 "Нам є чому повчитися в наших союзників. Ми мусимо звернутися до них із пропозицією розробити програму військово-технічного співробітництва."
 ITA_missiolini_occupy_ticino_subject_effects:0 "\nЯкщо [SWI.GetFlag][SWI.GetNameDef] є суб'єктом держави §Y[ROOT.GetFlag][ROOT.GetNameDef]§!:\n"
