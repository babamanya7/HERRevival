 MAN_tsr_ally_the_soviet_republic_desc:0 "Наші друзі з КПК у решті Китаю напевно хотіли б об'єднатися з нами. Разом ми зможемо набагато ефективніше боротися проти будь-яких зовнішніх чи внутрішніх загроз."
 MAN_tsr_an_industrial_power_desc:0 "Маючи промисловість, яка нарешті здатна конкурувати із Заходом, ми повинні прагнути до її подальшого розширення. Завдяки цьому ми з часом станемо головною промисловою державою Азії, а потім і всього світу."
