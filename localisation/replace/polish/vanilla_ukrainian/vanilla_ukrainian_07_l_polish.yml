 SEA_PHI_political_events.12.desc:0 "Після напружених переговорів і низки поступок з боку [PHI.GetNameDef], [USA.GetLeader] оголосив, що [USA.GetNameDef] не втручатиметься в плани [Root.GetRulingPartyLong]. [USA.GetLeader.GetSheHeCap] був переконаний, що [PHI.GetNameDef] не становить безпосередньої загрози для американського народу, і що ми вжили належних заходів для забезпечення належного продовження стабільного уряду.[TreatyOfManilaToBeSigned]"
 SEA_PHI_political_events.44.a:0 "Все в ім'я свободи та демократії!"
 SEA_PHI_political_events.44.desc:0 "Коли вона надійшла, реакція [MacOrGarrison] була раптовою і нищівною. Не ризикуючи, всю Філіппінську дивізію було розгорнуто в Манілі: першою в атаку пішла кавалерія, за якою одразу послідувала піхота з примкнутими багнетами. Там, де був більш запеклий опір, для його придушення застосовували сльозогінний газ. Приголомшені переважаючою силою, загони сакдалістів були змушені залишити свої барикади і розчинилися за межами міста. \n\nХоча початкову загрозу фашистського перевороту було відвернуто, все ще залишається небезпека ширшої ескалації у громадянську війну, і тому [MacOrEisenhower] вважав за потрібне оголосити військовий надзвичайний стан, запровадити воєнний стан і взяти на себе диктаторські повноваження для забезпечення подальшого стабільного управління."
 SEA_PHI_political_events.56.a:0 "Ми можемо самі керувати своїм флотом"
 SEA_PHI_political_events.6.desc:0 "Зростаючий вплив [FROM.GetCommunistParty] у [FROM.GetNameDef] тепер приносить плоди: її представники перетнули Китай, щоб повідомити нам про [FROM.GetAdjective]і добровольчі сили, які мобілізуються для підтримки наших військ. Крім того, ці добровольці привозять із собою запасне спорядження, щоб допомогти озброїти наші власні загони."
 SEA_PHI_political_events.62.a:0 "Націоналісти б'ються за наші католицькі цінності"
 SEA_PRC_border_war_events.2.desc:0 "Після прикордонних сутичок вздовж кордону [1045.GetName], [PRC.GetNameDef] не вдалося прорвати оборонні рубежі та витіснити ворога. Проте [PRC.GetNameDefCap] вдалося захопити трохи артилерії."
 SEA_PRC_border_war_events.2.t:0 "[PRC.GetNameDefCap] відступає з [1045.GetName]"
 SEA_PRC_faction_events.51.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 SEA_PRC_faction_events.90.b:0 "Ні, ми не можемо їм довіряти"
 SEA_PRC_fourth_army_incident.3.t:0 "[FROM.GetNameDefCap] скаржиться на відсутність координації"
 SEA_PRC_misc_events.1.desc:0 "Китайський народ почав сумніватися в нашій рішучості проти іноземних загарбників!"
 SEA_PRC_misc_events.10.desc:0 "Норман Бетьюн, канадський комуніст і ветеран-польовий лікар громадянської війни в Іспанії, прибув, щоб допомогти [ROOT.GetAdjective]ому народу покращити якість медичного обслуговування. Раніше відомий своїм успіхом у створенні мобільної станції переливання крові, його зусилля тепер, ймовірно, будуть спрямовані на покращення медичної практики у віддалених сільських районах [ROOT.GetNameDef]."
 SEA_PRC_political_events.21.a:0 "[FROM.GetNameDefCap] отримає користь від їхньої допомоги"
 SEA_PRC_political_events.9.t:0 "[FROM.GetName] погоджується підписати пакт про ненапад"
 SEA_PRC_request_aid.31.c.tt:0 "Ми погодимося виробити §R150 танків БТ-7§! для §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.4.desc:0 "Оскільки [FROM.GetNameDef] не має промислових потужностей і досвіду для створення бронетанкових військ, [FROM.GetLeader] надіслав запит на нашу допомогу. [FROM.GetNameDefCap] конкретно просить наші середні танки Т-34, посилаючись на їхній відмінний баланс вогневої потужності, захисту та мобільності. Як нам відповісти?"
 SEA_PRC_request_aid.6.desc:0 "Відповідаючи на наш запит щодо танків Т-34, [FROM.GetName] погодився надіслати нам лише символічну кількість. Цього недостатньо для повного оснащення танкової дивізії, але достатньо, щоб розпочати. Принаймні ми можемо використати ці 50 машин для навчання наших екіпажів, поки шукатимемо інші способи отримати сучасні танки."
 SEA_border_incidents_events.3.desc:0 "Армія чисельністю менше 100 [MON.GetAdjective]их солдатів окупувала спірне [MAN.GetAdjective]е село Тауран під керівництвом радянських військових радників. Схоже, вони не відступлять без бою, і їх доведеться перемогти, якщо ми хочемо зберегти повний контроль над [761.GetName]. Наш сюзерен [JAP.GetNameDef] вимагає негайних дій, а Квантунська армія розглядає ситуацію як образу самого Імператора."
 SEA_china.17.desc:0 "Намагаючись задобрити нас, щоб ми не нападали, [From.GetName] надав нам доступ до авіабаз. Квантунська армія вирішила поки що відступити."
 SEA_china.29.desc:0 "In his zeal for the liberty of our country $CHI_zhang_xueliang$ has overstepped his station by a large margin. Normally this would be unacceptable, but we do not live in normal times and while [ROOT.GetLeader] demands that we imprison him, the competence of [CHI_zhang_xueliang.GetName] could prove useful."
 SEA_china.29.t:0 "The fate of $CHI_zhang_xueliang$"
 SEA_china_democratic.13.t:0 "[FROM.GetNameDefCap] шукає нашої підтримки"
 SEA_china_democratic.19.desc:0 "Ультиматум відхилено. У зухвалому акті непокори [FROM.GetLeader] дав зрозуміти, що його народ не підкориться. Оскільки наших посланців відіслали, дипломатія поступиться місцем війні."
 SEA_china_warlords.4.a:0 "Ми повинні схилити голови"
 SEA_china_warlords.4.desc:0 "Оскільки ситуація стабілізується, а центральна влада зміцнюється, [FROM.GetNameDef] переходить до ліквідації останніх залишків автономії військових губернаторів. Від [THIS.GetNameDefCap] тепер очікують передачі всього військового та адміністративного контролю центральному уряду, завершуючи процес об'єднання."
 SEA_generic_events.11.a:0 "Ми забезпечимо їм справедливу компенсацію"
 SEA_generic_events.12.desc:0 "Прихильники [GetOppositionPartyName] та іншої опозиції провели сьогодні протест, вимагаючи стримати нарощування нашої військової міці, побоюючись, що наша зростаюча армія буде використана за кордоном."
 SEA_generic_events.13.t:0 "[GetOppositionPartyAdjective] прихильники влаштовують бунт у [root.capital.GetCapitalVictoryPointName]"
 SEA_generic_events.3.desc:0 "Повідомляється, що прихильники [GetOppositionPartyName] проводять демонстрацію в столиці; вони критикують неефективність уряду і, схоже, виступають за більш централізовану владу."
 SEA_imperial_influence_demand_event_option_5:0 "Тихше їдеш — далі будеш"
 SEA_imperial_influence_events.320.t:0 "Фракція Дзайбацу вимагає політичних призначень"
 SEA_japan_foreign_policy.106.t:0 "[FROM.GetNameDefCap] інтегрує нашу економіку"
 SEA_japan_foreign_policy.109.desc:0 "Інтеграції наших економік, очевидно, було недостатньо, щоб вдовольнити [FROM.GetAdjective]их партнерів, оскільки [FROM.GetLeader] з [FROM.GetNameDef] сьогодні пішов далі, ніж спочатку обіцяв, і тепер вимагає нашої повної інтеграції до їхньої країни. Якщо ми негайно не розірвемо з ними стосунки, це стане кінцем нашого статусу незалежної нації. Як нам вчинити?"
 SEA_japan_foreign_policy.111.t:0 "[FROM.GetNameDefCap] відхиляє повну інтеграцію"
 SEA_japan_foreign_policy.12.t:0 "[From.GetNameDefCap] відхиляє наші вимоги"
 SEA_japan_foreign_policy.120.desc:0 "[FROM.GetLeader] грубо вирішив відхилити нашу пропозицію про альянс між нашими державами, заявивши, що це суперечитиме їхньому принципу нейтралітету. Ми можемо лише уявити масштаби корупції, що призвели до цього помилкового рішення."
 SEA_japan_foreign_policy.127.a:0 "Ні, ми повинні це відпустити..."
 SEA_japan_foreign_policy.18.desc:0 "Делегація здалеку нещодавно прибула до нашої столиці, шукаючи аудієнції у його високості. Вони стверджують, що прибули від [FROM.GetNameDef], і прагнуть укласти союз між нашими країнами. Чи приймемо ми його?"
 SEA_japan_foreign_policy.31.a:0 "Покажіть їм, з ким вони мають справу"
 SEA_japan_foreign_policy.49.desc:0 "У прокламації, проголошеній сьогодні в Шанхаї, [ROOT.GetLeader] разом із генералами та адміністраторами, надісланими Імператорською армією Японії, оголосив про заснування нового китайського уряду — кращої альтернативи корумпованій вотчині Ґоміньдану. Хай живе Китайська Республіка!"
 SEA_japan_foreign_policy.61.desc:0 "Зрадника Ван Цзінвея бачили минулого тижня, коли він залишав свою резиденцію і відбув у невідомому напрямку. Озираючись назад, це здавалося неминучим через його невдоволення політикою [ROOT.GetLeader]. Втім, за ним ніхто не сумуватиме."
 SEA_japan_foreign_policy.77.desc:0 "[FROM.GetLeader], наш губернатор [FROM.GetNameDef], сьогодні погодився на повну інтеграцію до нашої нації. Це означає, що наш уряд нарешті зможе отримати повний контроль навіть над місцевими дивізіями наших корейських регіонів."
 SEA_japan_foreign_policy.82.t:0 "[FROM.GetNameDefCap] шукає антирадянської співпраці"
 SEA_japan_foreign_policy.91.desc:0 "Хоча [FROM.GetAdjective]а влада поставилися здебільшого нейтрально до нашої пропозиції, вони зрештою вирішили відхилити нашу пропозицію про передачу промисловості в обмін на ресурси. Вони стверджують, що зараз не найкращий час, натякаючи, що ми, можливо, зможемо досягти угоди в майбутньому, коли ще більше зміцнимо наші стосунки."
 SEA_japan_popup_events.14.desc:0 "Незважаючи на небезпечні часи, загальні вибори завершилися, і наш народ вирішив, хто представлятиме його в Палаті представників. Партія Ріккен Мінсейто під керівництвом Мачіди Тюдзі вийшла з виборів як найбільша партія, а Ріккен Сейюкай втратила більшість. Хоча це й не має великого значення через нещодавнє падіння повноважень цивільного уряду, ці вибори показують, що наша демократія все ще стоїть, якою б крихкою вона не була."
 SEA_japan_popup_events.6.t:0 "Хірохіто відмовляється підтримати новий уряд"
 SEA_warlords.10.a:0 "Ми одразу знайдемо йому роботу!"
 SEA_warlords.15.a:0 "$wtt_political_warlord_support.11.a$"
 SEA_warlords.2.desc:0 "Після смерті Лю Сяна [FROM.GetNameDef] охопила боротьба за владу, що призвела до піднесення Ян Сеня. Слідом за чутками про те, що Лю Сян був убитий нашими силами, вони зайняли позицію дистанціювання від нашого уряду та опору інтеграції."
 SEA_warlords.22.desc:0 "Зі смертю Лю Сяна, лідера [SIC.GetNameDef], стає дедалі очевиднішим, що ми повинні втрутитися і взяти ситуацію під безпосередній контроль, щоб не ризикувати втратою території на користь когось менш лояльного до нашого уряду. Однак це може призвести до подальшого протистояння з дрібними командирами, які зараз борються за владу, тому ми все ще повинні діяти обережно."
 SEA_warlords.25.desc:0 "[From.GetLeader] відповів на нашу пропозицію об'єднатися в битві за Китай потоком образ і прокльонів, стверджуючи, що наша місія — це лише чергова невдала спроба захопити владу і підкорити провінції. Схоже, вони не будуть на нашому боці в цій битві."
 SEA_warlords.43.a:0 "Стати на бік Центрального уряду"
 SEA_warlords.47.b:0 "Нова кліка Ґуансі має сильніший авторитет!"
 SEA_warlords.57.desc:0 "Самовдоволений зрадник [FROM.GetLeader] відхилив наш запит на створення передової позиції проти японців, явно не дбаючи про найкраще майбутнє Китаю."
 SEA_warlords.6.c:0 "Ми нічого не можемо виділити"
 SEA_warlords.62.desc:0 "Після викрадення [ROOT.GetLeader] і примусового переконання сформувати другий Об'єднаний фронт, наші урядовці видали ордери на арешт і погрози [FROM.GetLeader] та його людям, а також почали переміщення військ, щоб припинити автономну місію Північно-Західного штабу придушення бандитизму. Настав час цим зрадникам отримати те, на що вони заслуговують."
 SEND_VOLUNTEERS_DESCRIPTION_NO_DIVISIONS:0 "§RВам потрібно обрати одну або більше армій, щоби надіслати пропозицію.§!\n$CURRENT|H$ з ваших дивізій є частиною добровольчих військ, а вашу підсумкову верхню межу — $MAX|H$ ($LIMITREASON$)."
 SEND_VOLUNTEERS_TENSION_DESC:0 "Потрібно $VAL|%Y0$ напруженості, щоби надіслати добровольчі війська.\n"
