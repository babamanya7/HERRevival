 TUR_capitalise_on_rising_kurdish_nationalism_desc:0 "У нас є підстави вважати, що курди з-за кордону готують теракти на нашій території. Вони не розуміють, що комунізм звільнив курдських робітників, і закордонних пролетарів теж чекає невідворотна свобода."
