 RAJ_GATHERING_STORM_DESC:0 "Перлина британської корони, Індія, — це дивне поєднання імперської влади й імперського безвладдя. Невелика еліта з британських держслужбовців править цим великим субконтинентом і мільйонами місцевих суб'єктів. Звідти наймається Індійська армія, яка хоробро боролася у Великій війні.\n\nМісцеві правителі сподівалися, що жертви останньої війни дозволять Індії здобути незалежність від Британії, але цього досі не сталося. Насувається нова війна, і більшість вважає, що настав час узяти правління у свої руки всіма можливими засобами."
