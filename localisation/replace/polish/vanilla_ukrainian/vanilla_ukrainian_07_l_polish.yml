 ITA_mussolini_walks_free_tt:0 "Муссоліні виходить на волю і може жити своїм життям як вільний громадянин."
 ITA_navi_da_battaglia:0 "Navi da Battaglia"
 ITA_new_forms_of_weaponry:0 "Нові форми зброї"
 ITA_new_roman_citizens:0 "Нові римські громадяни"
 ITA_officers_of_the_service_role_oob_tt:0 "§Y1 крило винищувачів§! й §Y1 крило тактичних бомбардувальників§! стануть активні в області [2.GetName]."
 ITA_organize_strikes_in_the_north_tt:0 "§YКоли почнеться громадянська війна§!:\nМи візьмемо контроль над §Yпівденноіталійськими областями§!.\nБуде створено §Y5§! додаткових §Yдивізій ополчення§!.\nФашистська сторона зазнає пошкоджень на деяких заводах."
