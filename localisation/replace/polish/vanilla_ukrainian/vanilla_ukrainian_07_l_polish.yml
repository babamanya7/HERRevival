 SOV_infiltrate_foreign_atomic_programs_dec_cat:0 "Проникнути в іноземні атомні програми"
 SOV_influence_airforce_opposition:0 "Збільшити підтримку авіації"
 SOV_international_union_of_soviet_republics_desc:0 "Найбільшою зрадою революції була ідея про те, що соціалізм можна — ба, навіть треба — збудувати в одній країні. Або робітники всього світу разом досягнуть соціалізму, або його не досягне ніхто. Поки революція перебуває на різних стадіях у різних країнах, ми будемо ділитися нашими ресурсами, щоби забезпечити її просування в усіх союзних країнах, де робітники контролюють уряд."
 SOV_intervention_in_china_desc:0 "Ситуація в Китаї погіршилася до такої міри, що стає загрозою нашій безпеці. Ми мусимо втрутитися і встановити в регіоні надійний уряд."
 SOV_intervention_in_china_wargoal_tt:0 "Отримає ціль війни §Y$puppet_wargoal_focus$§! проти кожного китайського альянсу, §Gкрім§! §Y[GetAppropriateSupportedChineseFaction]§!."
 SOV_kolomna_locomotive_plant_communist:0 "Паровозобудівний завод імені В. В. Куйбишева"
 SOV_last_purge_focus_days_cult_tt:0 "Поточні дні: [?SOV_third_moscow_trial_flag:days|Y0]"
 SOV_long_live_the_workers_government_desc:0 "Тепер, коли ми розпочали довгий шлях до справжнього визволення робітничого класу, ми не мусимо піддаватися спокусі заміни одного уряду еліти на інший. Уряд нашої профспілки завжди повинен бути справжнім урядом робітників, створеним робітниками і для робітників."
