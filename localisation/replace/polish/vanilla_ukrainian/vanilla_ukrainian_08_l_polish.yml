 URG_la_teja_refinery_desc:0 "Заснування сучасного нафтопереробного заводу дозволить нам стати конкурентоспроможними на світовій арені та диверсифікувати нашу економіку."
 URG_mercado_modelo:0 "Mercado Modelo"
 URG_pay_of_all_external_debts_desc:0 "У нас все ще є зовнішні борги перед різними країнами, і в нинішньому кліматі державі не личить мати непогашені платежі."
 URG_terras_dictatorship_desc:0 "Габріель Терра захопив контроль над більшою частиною країни під час самоперевороту 2 роки тому, але нам все ще потрібно працювати, щоб ще більше закріпити контроль над її інститутами."
 URG_tour_to_italy:0 "Тур до [ITA.GetName]"
