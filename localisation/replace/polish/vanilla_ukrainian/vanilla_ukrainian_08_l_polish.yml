 RULE_ALLOW_COUPS:0 "Перевороти"
 RULE_ALLOW_COUPS_FREE_DESC:0 "Держави можуть готувати та влаштовувати перевороти без обмежень."
 RULE_ALLOW_FASCIST_USA:0 "Дозволити фашистські США"
 RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_TOOLTIP:0 "Правило гри: §R$RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_DESC$§!"
 RULE_ALLOW_RELEASE_NATIONS_NOT_ETHIOPIA_COMPLIANCE_TOOLTIP:0 "§Y[ROOT.GetName]§! не може дати незалежність §YЕфіопії§! як країні, допоки підпорядкування не перевищує §Y70%§! у всіх областях Ефіопії."
 RULE_ALLOW_VOLUNTEERS:0 "Добровольці"
 RULE_BOOST_PARTY_AI_ONLY_TT:0 "Правило гри: §R$RULE_ALLOW_PARTY_BOOSTING_AI_ONLY_DESC$§!"
 RULE_FASCIST_ALTERNATE_HUN_AI_DESC:0 "Угорський ШІ намагатиметься утворити свій власний альянс із Італією й Австрією, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_FASCIST_CZE_AI_DESC:0 "§HЧехословацький§! ШІ намагатиметься перетворити країну на фашистську та підписати угоду з Німеччиною, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_FASCIST_JAP_AI_DESC:0 "§HЯпонський§! ШІ намагатиметься вдарити на південь проти західних союзників, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_HISTORICAL_ICE_AI_DESC:0 "Ісландський ШІ намагатиметься зберігати нейтралітет і в разі потреби звернеться за захистом до США."
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI:0 "Fascist Pankhurst-Walsh"
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI_DESC:0 "The distant overlord has determined Australia's fate for too long. Now is the time to cast off the imperial yoke... and liberate others along the way."
 RULE_OPTION_COMMUNIST_HUN_AI_DESC:0 "Угорський ШІ намагатиметься зробити країну комуністичною й укласти союз із іншими великими комуністичними державами, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC:0 "ШІ скине кайдани свого слабовільного короля та спробує захистити Бельгію за будь-яку ціну."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_NZL_AI_DESC:0 "ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_OPTION_DEMOCRATIC_ROM_AI_DESC:0 "§HРумунський§! ШІ намагатиметься реформувати країну в діючу демократію та вступити в союз із іншими великими демократичними державами, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_FALANGIST:0 "Фалангізм"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN:0 "$RULE_OPTION_DEMOCRATIC$"
 RULE_OPTION_HISTORICAL_AUS_AI_DESC:0 "ШІ стане фашистським і спробує відвернути аншлюс під керівництвом Вітчизняного фронту."
 RULE_OPTION_HISTORICAL_BUL_AI_DESC:0 "§HЦар Боріс III§! поведе країну на зближення з державами Осі, покладаючись на німецький арбітраж у справі мирного розширення кордонів Болгарії, і підпише Троїстий пакт і відстрочить участь Болгарії у війні."
 RULE_OPTION_HUN_HISTORICAL:0 "Прдовження гортістського регентства"
 RULE_OPTION_HUN_RESTORE_THE_SOCIALIST_REPUBLIC:0 "Соціалістична федеративна республіка"
 RULE_OPTION_ICE_SUPPORT_AI_DESC:0 "Ісландський ШІ намагатиметься підтримати данську оборону проти будь-якого нападника."
 RULE_OPTION_INDEPENDENCE:0 "Незалежність"
 RULE_OPTION_LEFT_OPPOSITION_SOV_AI_DESC:0 "§HРадянський§! ШІ спробує відновити владу лівої опозиції та поновити вічну революцію, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_MONARCHIST:0 "Монархістський шлях"
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC:0 "ШІ спробує відтворити Австро-Угорську імперію, відновивши її військову міць і вимігши підкорення країн, які зараз займають її колишні землі."
 RULE_OPTION_NEUTRALITY_MONARCHIST:0 "Монархізм"
 RULE_OVERRIDE_BREAKDOWN_TITLE_POS:0 "(усі умови мусять виконуватися):"
