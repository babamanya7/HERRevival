 tfv_canada.21.t:0 "Силовий альянс"
 tfv_canada.50.t:0 "Ворог усередині"
 tfv_canada.52.d:0 "Правоохоронні органи спільно з військовою поліцією досягли значних успіхів у справі тривалого саботажу на заводах. Після підриву ще одного заводу стало очевидно, що саботаж здійснюють не іноземні шпигуни, а група, котра протестує проти примусового призову до армії, запровадженого у Квебеці! Незалежно від їхніх політичних поглядів, наша країна перебуває у стані війни, і вони є зрадниками найвищої стадії."
 tfv_canada.70.a:0 "У цьому нема нічого поганого."
 tfv_raj.34.desc:0 "Цей день знаменує початок нової доби в історії Індії. Після століть під іноземним пануванням ми нарешті досягли повної незалежності. Місцеві [ENG.GetAdjective]і держслужбовці отримали наказ допомогти в переході до [RAJ.GetAdjective]ого самоврядування та будуть відправлені додому протягом наступних кількох місяців.\n\nІз допомогою наших нових [SOV.GetAdjective]их товаришів ми тепер можемо зосередитися на завданні, що стоїть перед нами — побудові держави для нашого народу."
 tfv_raj.42.t:0 "[GER.GetNameDefCap] підтримує нашу справу"
 tfv_south_africa.103.d:0 "Звільнившися з-під влади колоніальних гнобителів, [TUN.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [TUN.GetAdjective]ого уряду."
