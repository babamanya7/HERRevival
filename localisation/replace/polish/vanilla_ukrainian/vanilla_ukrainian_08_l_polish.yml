 DOD_hungary.111.d:0 "Це священні землі!"
 DOD_hungary.117.a:0 "Ми простежимо, щоб він дотримав свого слова."
 DOD_hungary.128.b:0 "Вони явно блефують."
 DOD_hungary.35.a:0 "Хай їм грець."
 DOD_hungary.35.t:0 "[From.GetName] відмовляє у підтримці"
 DOD_hungary.53.desc:0 "[HUN.GetNameDefCap] привела свої війська в бойову готовність. Угорські розвідувальні літаки вторглися в наш простір щонайменше десять разів за останні кілька годин. Наша розвідка повідомляє про пересування великих скупчень піхоти до кордонів. У Будапешті звучить повітряна тривога. Схоже, цього разу [HUN.GetAdjective]а влада налаштована рішуче. Мабуть, на нас чекає війна."
 DOD_hungary.55.a:0 "Звернутися до Німеччини"
 DOD_hungary.57.desc:0 "Незважаючи на нові грубі заяви Будапешта, угорські війська, що стояли біля кордону, відступили вглиб. Вторгнення в повітряний простір припинилися. Схоже, [HUN.GetLeader] бажає зберегти це в секреті якнайдовше, і наші дипломати вважають, що ми мусимо йому це дозволити. Жест примирення — невелика ціна за те, що ми дивом уникли війни."
 DOD_hungary.66.a:0 "Ми бажаємо їм перемоги."
 DOD_hungary.72.a:0 "Прийняти пропозицію."
 DOD_hungary.74.desc_HUN_nothing:0 "Не дивно, що румунська сторона не пішла на поступки — Румунія сповнена рішучості залишити всю Трансільванію у себе. На цьому етапі переговорів ми навряд чи зможемо щось змінити. Ми можемо прийняти пропозицію або залишити конференцію."
 DOD_hungary.85.t:0 "[From.GetNameDefCap] попереджає про дії у південній Словаччині"
 DOD_hungary.92.a:0 "Можливо, так і є."
 DOD_hungary.93.b:0 "Ми не будемо вплутуватися в цю суперечку."
 DOD_hungary.94.b:0 "Атакувати зараз же!"
 DOD_romania.41.desc:0 "[BUL.GetNameDefCap] приймає наші вимоги і тепер буде радитися з нами перед прийняттям будь-яких політичних кроків.\n\nУ Софію вже прибув спеціальний представник для координації дій із місцевим урядом."
 DOD_romania.50.c:0 "Краще загинути на волі, ніж жити в рабстві."
 DOD_romania.84.t:0 "Коханку короля помітили в Парижі"
 DOD_yugoslavia.184.a:0 "Раз цього хоче народ..."
