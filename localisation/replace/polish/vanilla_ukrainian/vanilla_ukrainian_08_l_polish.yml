 MAN_THE_GUNS:0 "Man the Guns"
 MAN_bolster_nationalism_desc:0 "Дуже довго Маньчжоу-ґо вважалася штучною державою, створеною для Японії. Кожна нація колись була лише ідеєю; так і ми представимо світову ідею маньчжурської самоідентифікації та зробимо цю ідею реальністю."
