 PHI_sunset_empires_desc:0 "Найбільшою загрозою для нас є Імперія Вранішнього Сонця та Імперія, над якою сонце ніколи не заходить. Тому ми повинні переконатися, що маємо достатньо куль, щоб битися в тіні."
