 ETH_request_embargo_desc:0 "Ембарго на державу [ITA.GetName] лише символічне, яке їм зовсім не шкодить. Ліга Націй готова вислухати наші прохання. Ми повинні зосередити наші зусилля на тому, щоб переконати радянців запровадити посилене ембарго, яке справді шкодить Італії. Той, який включає нафту та сталь, які є важливими для їхньої бойової машини."
