 AFG_mountain_training:0 "Гірська підготовка"
 AFG_mountain_training_desc:0 "Нові технології та тактики з часом з'являються та зникають, але гори та долини залишаються незмінними. Замість того, щоб намагатися не відставати від наших сусідів у технологічному плані, ми повинні зосередитися на використанні навколишньої землі, щоб отримати тактичну перевагу."
 AFG_occupy_peshawar_tt:0 "§RЦе може призвести до війни з власником [442.GetName]!§!"
 AFG_pashtunistan_ascendancy_communism_ADJ:0 "Пуштунськ"
 AFG_pashtunistan_ascendancy_fascism:0 "Пуштуністанська верховна влада"
 AFG_placated_graduates:0 "Заспокоєні випускники"
 AFG_political_events.01.a:0 "Інтригуюча пропозиція."
 AFG_political_events.112.b:0 "Тоді ми заберемо це силою."
 AFG_political_events.172.desc:0 "\nРаніше цього тижня сили, що належать [FROM.GetNameDef], увійшли та окупували нашу територію Вазиристан, заявивши, що їхня місія полягає в захисті регіону від потенційної окупації їхніми ворогами. Це явно є актом війни, однак це те, що ми, ймовірно, можемо вирішити просто проігнорувати, оскільки вони, ймовірно, не шукають конфлікту з нами, а скоріше прагнуть возз'єднати розсіяний паштунський народ."
 AFG_political_events.42.desc:0 "[FROM.GetAdjective] уряд відхилив наші вимоги щодо припинення іноземного втручання в їхню країну. Вони стверджують, що ми не маємо права втручатися в їхні внутрішні справи та домовленості, які вони уклали з іншими націями."
 AFG_political_events.75.desc:0 "Незважаючи на наші претензії та явне бажання паштунського народу до єдності, [FROM.GetNameDef] відверто відмовився переглядати кордони. Їхня відповідь рішуча, вони відкидають будь-яку ідею поступки територією та попереджають про подальшу ескалацію. Схоже, єдиний шлях до звільнення територій — це конфлікт."
 AFG_rebel_party:0 "Islamic Movement"
 AFG_rebuild_the_silk_road:0 "Відбудувати Шовковий шлях"
 AFG_recruiting_turkestan_legion:0 "Наразі триває набір Туркестанського легіону тут."
 AFG_red_prince:0 "Червоний князь"
 AFG_return_to_delhi_desc:0 "Делі колись був резиденцією Султана та домом для Червоного Форту, де знаходився наш розкішний Павиний Трон. Тепер ми підемо маршем на місто та повернемо нашу давно втрачену столицю, і таким чином відповімо спадщині Імператорів Моголів минулого."
