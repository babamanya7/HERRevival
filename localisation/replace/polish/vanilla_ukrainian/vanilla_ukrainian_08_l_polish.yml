 form_roman_empire_category_desc:0 "Ідея імперії, що охоплює Середземне море, в останні роки відродилася в народній свідомості. Тепер наші військові кампанії перевищили найсміливіші мрії навіть наших найзапекліших прихильників, і ми знаходимося на порозі можливості реалізувати ці амбіції. Roma invicta!"
