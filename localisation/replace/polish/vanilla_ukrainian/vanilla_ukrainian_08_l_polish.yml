 SOV_international_revolutionary_marxist_centre:0 "Міжнародний революційний марксизм"
 SOV_international_revolutionary_marxist_centre_desc:0 "Третій інтернаціонал впав перед сталінським тоталітаризмом і, ймовірно, вже не підлягає порятунку. Ми повинні запропонувати комуністичним партіям світу новий спосіб координації та співпраці."
