 MUN_czech.1002.a:0 "Можливо, вони мають рацію"
 MUN_czech.1008.d:0 "Представники [FROM.GetNameDef], нашого містка до Центральної Європи, запропонували розширити наш альянс, запросивши [CZE_invited_country.GetName]."
 MUN_czech.1017.t:0 "Спільне вторгнення у [GER.GetNameDef]?"
 MUN_czech.1023.d:0 "Посилаючись на якісь застарілі аргументи про середньовічні королівства та імперії, [FROM.GetNameDef] перетворила прикордонні сутички на локальну війну, щоб встановити контроль над [ROOT.GetAdjective]ою Сілезією."
 MUN_czech.1024.a:0 "Можливо, нам варто зосередитися на інших напрямках"
 MUN_czech.1026.faction_merge:0 "Незважаючи на всі наші зусилля, наші та [FROM.GetAdjective]і дипломати не змогли дійти згоди щодо об'єднання фракцій «[ROOT.GetFactionName]» та «[FROM.GetFactionName]»."
 MUN_czech.1036.d:0 "Велика депресія не принесла нашій країні жодної користі ні в економічному, ні в політичному плані. Нас дошкуляють численні регіональні економічні та політичні проблеми, і здається, що вони лише загострюються навіть на тлі нашого дивовижного відновлення після Великої депресії. Ми маємо вирішити ці проблеми до того, як вони ще більше розколють нашу націю."
 MUN_czech.1037.d:0 "Помітивши очевидне виправдання війни проти Угорщини у нашій країні, [GER.GetAdjective]і представники чітко дали зрозуміти, що війна з [HUN.GetAdjective]ими військами означатиме війну і з [GER.GetAdjective]ими. Чи продовжувати нам діяти — вирішувати нам."
 MUN_czech_bop.2.d.1:0 "Нещодавня ремілітаризація Рейнської області, яку провела [GER.getnameDEFcap], налякала декого з наших військових і політичних лідерів. Хоча багато хто вірить в укладені країною альянси та підготовку, яку наразі проводить армія для протистояння можливій німецькій загрозі. Дехто, однак, не настільки впевнений, що ми зможемо вистояти перед будь-якою [GER.GetAdjective]ою загрозою."
