 NORDIC_economic_cooperation:0 "Економічна співпраця"
 NORDIC_first_selector_right:0 "[NORDIC_get_first_selector_right]"
 NORDIC_form_joint_alliance_desc_com:0 "Однак завдяки поштовху пролетарської революції ми можемо об'єднати наші народи й зосередити їх на боротьбі з капіталізмом, об'єднавши наші країни в альянс народів Півночі."
 NORDIC_is_baltic_state:0 "Має узбережжя §YБалтійського моря§!"
 NORDIC_ongoing_investment:0 "Вже інвестує в економіку скандинавських країн."
 NORDIC_research_investments_desc:0 "Наш новий альянс є тіснішим, ніж будь-який інший, немає причин, чому ми повинні тримати наші технологічні досягнення при собі. Поділімося ж нашими дослідженнями, щоб наші інструменти ведення війни мали перевагу, необхідну для знищення наших ворогів."
 NORDIC_strenghtening_ties_flag:0 "Зміцнення наших зв'язків з іншою північною країною."
 NORDIC_the_eastern_front_desc:0 "Плейсголдер"
 NOR_GER_fascism_autonomy_puppet:0 "Райхспротекторат Норвеґія"
 NOR_SOV_communism_ADJ:0 "Норвезьк"
 NOR_alt_dem_focus_on_training_desc:0 "$NOR_focus_on_training_desc$"
 NOR_bail_out_towns_desc:0 "Економічна криза вдарила по багатьох малих містах по всьому [ROOT.GetName]. Вони страждають від величезного боргового тягаря, який вони ніколи не зможуть подолати самі. У нас є засоби та бажання врятувати ці громади та поставити їх на шлях до процвітання, тому використаймо їх."
 NOR_communist_prep_join_heavy_damage:0 "§RОтримаєте серйозну шкоду заводам та інфраструктурі§!"
 NOR_communist_prep_unlock_level_3_TT:0 "Дозволяє тренувати §Yкомуністичні ополчення§! на території крізь рішення §YПідбурювання пролетаріату§!."
 NOR_coordinating_committee_desc:0 "У самому серці цивільного опору знаходиться Koordinasjonskomiteen, завданням якого є сполучення уряду у вигнанні з різними елементами цивільного опору в державі [NOR.GetName]."
 NOR_exiled_manpower_TT:0 "§G+$RIGHT|0$§! людських ресурсів після вигнання"
 NOR_expand_the_dockyards_desc:0 "Незважаючи на наявність одного з найбільших торговельних суден у світі, потужності нашої верфі можна було б розширити та оптимізувати для кращої продуктивності військових кораблів замість простого виробництва вантажних суден і танкерів."
 NOR_invite_secret_army:0 "Кооптувати таємну армію"
 NOR_jonas_lie:0 "Юнас Лі"
 NOR_luftforsvaret_desc:0 "Нашим Повітряним силам настав час перестати бути лише допоміжною силою для наших сухопутних армій, а перетворитися на власну гілку збройних сил. Таку, яка має ресурси, необхідні для проведення всіх операцій, необхідних для сучасного бою в умовах ефективним способом."
 NOR_make_assurances_to_the_people_desc:0 "Це страшний час у [NOR.GetName], безперечно, тому ми повинні запевнити крізь засоби масової інформації, що ми витримаємо, і опинившись на іншому боці, наш милостивий король очолить атаку за наше виживання."
 NOR_mechanized_equipment_1:0 "Stormpanservogn I"
 NOR_minister_of_agriculture:0 "Міністр сільгоспу"
 NOR_modernize_fortifications:0 "Модернізувати укріплення"
 NOR_norges_tekniske_hogskole:0 "Норвезький технічний університет"
 NOR_power_to_the_royal_guard_desc:0 "Hans Majestet Kongens Garde, власна Королівська гвардія нашого улюбленого короля незмінно була найкраще навченою та найрішучішою бойовою силою в королівстві. Натхнення, яке вони черпають від нашого короля та його регента, є відчутним, тому вони повинні очолити атаку нашого армії, і стане кінчиком списа, який розтрощить наших ворогів."
 NOR_print_more_money:0 "Надрукувати більше грошей"
 NOR_reduce_fascist_pp_cost_TT:0 "§YВартість§! рішення §YСтворити підтримку в області§! знижено на §G$RIGHT|0$§! £pol_power£"
 NOR_reform_the_army_desc:0 "Роки нехтування з боку Крістіана Леаке та Ліберальної партії призвели до того, що армія залишилася в руїні. Ми повинні відновити нашу військову ієрархію, логістику, стратегії та протоколи, щоб вони відповідали сучасним арміям. ми, ймовірно, зіткнемося."
 NOR_rikstanken_desc:0 "Сумна правда полягає в тому, що [ROOT.GetName] ніколи раніше не володів танком. Якщо ми сподіваємося мати хоч якісь шанси на перемогу, броня є даною. Питання в тому, яким має бути наш підхід? Велика кількість танків може бути дорогою пропозицією для країни в нашій ситуації; можливо, ми можемо перевірити воду за допомогою одного танка? Або, можливо, ми можемо пожертвувати чимось іншим, крім грошей, заради національних танків."
 NOR_start_rearmament_desc:0 "Можливо, повне роззброєння не є вірним способом уникнути війни, як ми сподівалися. Нам краще почати підготовку до можливого нападу на нашу землю."
 NOR_the_kings_line:0 "Лінія Короля"
 NOR_the_royal_norwegian_navy_desc:0 "Наявність однієї з найдовших берегових ліній у світі має свої переваги, але це також означає, що для її захисту потрібно докласти додаткових зусиль. Наш флот буде першою лінією захисту нашої країни."
 NOR_unionist_railway_director:0 "Залізничний директор-уніоніст"
 NO_SPECIAL_FORCES:0 "У цьому шаблоні немає жодних сил спеціальних операцій."
 NSB_poland_communist_events.1.nosov.desc:0 "У комуністичній партії Польщі давно назріває конфлікт між тими, хто бажає союзу Польщі та СРСР, і тими, хто вважає, що зараз СРСР — такий самий імперіаліст, як і Росія в попередні союзи часи монархії.\nПри цьому після того, як сам СРСР занепав, питання стало неоднозначним. Після втрати Сталіним влади прорадянський лідер Владислав Гомулка також втратив популярність. Тепер нікому протистояти призначенню Марії Кошутської лідером партії."
 NSB_poland_communist_events.201.t:0 "[From.GetNameDefCap] погоджується"
 NSB_poland_monarchist_events.3.desc:0 "Сьогодні пройшла коронація: тепер [From.GetLeader] — король держави [Root.GetNonIdeologyName]. Довга ланка кампаній пропаганди відвернула багатьох [Root.GetAdjective] міністрів від старого режиму. Його [Root.GetNonIdeologyName] тепер — лише маріонетка держави [From.GetNameDef], і майбутнє [Root.GetAdjective] автономії виглядає безрадісним."
 NSB_poland_monarchist_events.4.desc:0 "На вулицях держави [Root.GetNonIdeologyName] спалахнули бої: прихильники і противники монархізму вкинули націю в громадянську війну! Два протиборчі табори, які очолюють [Root.GetLeader] і [From.GetLeader] всій країні, а міністри держави [From.GetNameDef] відмовляються визнавати свою причетність до такої загрози національному суверенітету."
 NSB_poland_monarchist_events.5.t:0 "[From.GetLeader] у вигідному становищі: прихильники вимагають зречення"
 NSB_polish_fascist_events.102.desc:0 "Незважаючи на те, що в результаті нашої пропозиції [From.GetLeader] фактично отримає ключі від країни, схоже, що у [From.GetAdjective] уряду інші плани. Він рішуче відкидає нашу ідею."
 NSB_polish_fascist_events.3.desc:0 "Оголосивши, що наше використання польських заводів заважає військовому розвитку, міністри держави [From.GetNameDef] просять нас зменшити претензії на їхню країну. Якщо погодитися, Польща, як і раніше, залишиться [Root.GetAdject буде набагато незалежніше політично та економічно."
 NSB_polish_fascist_events.5.desc:0 "[From.GetNameDef], оплот принципів фалангізму і католицтва, запрошує нас у міжнародну Фалангу. Якщо прийняти пропозицію, дві наші країни будуть боротися разом за часів війни, а фалангістські елементи в нашому уряді стануть сміливішими і сильнішими. Погоджуватися?"
 NSB_soviet_civil_war_common.105.t:0 "[FROM.GetNameDefCap] відмовляється постачати нас зброєю"
 NSB_soviet_civil_war_common.112.a:0 "Дуже шкода."
 NSB_soviet_civil_war_common.126.t:0 "У регіоні [?SOV.SOV_captured_stockpile_state.GetName] захоплені армійські запаси"
