 INSHOL_elevate_elite_infantry_desc:0 "Ми не можемо вічно покладатися на великі військові стратегії, ми повинні адаптуватися до нових технологій і гарантувати, що не відстаємо. Ми повинні створити кілька елітних піхотних дивізій, готових захищати будь-яке середовище."
 INSHOL_establish_vk_knil_desc:0 "Ми створимо Жіночий добровольчий корпус для KNIL. Їхній внесок відіграватиме важливу роль у покращенні нашої логістики та зв'язку."
 INSHOL_mass_mobilization:0 "Масова мобілізація"
 INSHOL_naval_secondchance:0 "Ост-Індійська військово-морська схема"
 INSHOL_netherlands_indonesia_union_desc:0 "Концепція рівноправної союзної держави між [HOL.GetNameDef] та [INS.GetNameDef] для багатьох виглядає смішною, але в умовах кризи, в якій ми опинилися, це виглядає як єдиний спосіб максимізувати наші шанси на збереження суверенітету."
 INSHOL_princely_authority:0 "Князівська влада"
 INSHOL_produce_own_goods_desc:0 "Хоча у нас є багато вигідних торгових угод, які ми можемо укласти, ми не повинні забувати про власні виробничі лінії та військово-промислові компанії. Ми повинні субсидувати ці компанії, щоб зменшити нашу залежність від іноземного імпорту."
 INSHOL_propose_malay_unification_desc:0 "Індонезія — це архіпелаг, на якому проживають сотні культур, мов та етносів. Хоча деякі з них схожі, інші чітко відрізняються. Проте через спільну боротьбу проти колоніального правління ми знайшли єдність під прапором однієї нації; Індонезії. Можливо, нам варто запитати себе, чому ця єдність повинна зупинятися тут, коли по той бік протоки народ Малайї поділяє багато в чому ту саму історію та прагнення, що й наш власний?"
 INSHOL_purchase_british_artillery_desc:0 "Ми можемо передати виробництво нашої артилерії Об'єднаному Королівству, що дозволить нам надати пріоритет іншому обладнанню."
 INSHOL_renville_agreement_desc:0 "Безпрецедентна агресія Нідерландів привернула міжнародну увагу до революції, і все ж Нідерланди продовжують порушувати перемир'я та провокувати нас на реакцію. Ми маємо спробувати зателефонувати [USA.GetNameDef], бо якщо ми переконаємо їх заступитися за Індонезію, Нідерландам не залишиться нічого іншого, як відступити."
 INSHOL_transfer_of_henri_winkelman_desc:0 "Анрі Вінкельман раніше багато років служив у KNIL. Очевидно, що він знову потрібен в Ост-Індії, і ми повинні організувати його офіційне переведення."
 INS_HOL_FLAG_autonomy_dominion_DEF:0 "$INS_HOL_autonomy_dominion_DEF$"
 INS_acquire_modern_blueprints_desc:0 "Ми купуватимемо креслення в інших країнах і приватних корпораціях, які ми використаємо для будівництва нашого нового флоту."
