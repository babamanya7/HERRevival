 DEN_strength_in_numbers_desc:0 "Якщо ми хочемо мати шанс на перемогу над набагато сильнішим ворогом, ми повинні шукати союзників — до біса наш нейтралітет! Настав час залишити цю наївність позаду і адаптуватися до реалій світу."
 DEN_strengthen_military_industries_desc:0 "Інвестиції в потужну військову промисловість озброєнь можуть виявитися критично важливими в майбутньому. Ми повинні бути впевнені, що ми добре підготовлені, якщо нам доведеться взяти до рук зброю, щоб захистити свій народ."
