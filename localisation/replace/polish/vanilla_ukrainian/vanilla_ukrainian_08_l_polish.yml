 wtt_germany.55.a:0 "Великий день для вирішення німецького питання!"
 wtt_germany.73.desc:0 "[From.GetAdjective]ий уряд повідомляє, що приймає нашу пропозицію щодо інтеграції нашої військової економіки. Ця держава охоче діятиме під нашим керівництвом, змінюючи свою армію на наш вдалий зразок."
 wtt_japan.115.desc:0 "Незважаючи на наш пакт про ненапад, держава [From.GetNameDefCap] в односторонньому порядку напало на Радянський Союз. Зараз перед нами стоїть вибір: підтримати союзників або зберегти вірність укладеному пакту з радянцями та засудити акт агресії."
 wtt_japan.125.t:0 "Радянці повертають Маньчжурію"
 wtt_japan.3.t:0 "[From.GetNameDefCap] відмовляє нам владу над колоніями"
 wtt_ledo_road.2.desc_war_with_from:0 "[From.GetAdjective]і сили внаслідок стрімкого наступу змогли зайняти кілька важливих мостів та переправ. Дорога тепер закрита для будь-якого транспорту, і ми не зможемо отримувати постачання по ній."
 wtt_news.1.t:0 "Німеччина охоплена громадянською війною"
 wtt_news.1001.desc:0 "Сьогодні при спробі «Гінденбурґа» пришвартуватись у лондонських доках сталася жахлива трагедія. За поки що нез'ясованими причинами дирижабль охопило полум'я, і він упав на землю, забравши життя пасажирів та екіпажу, включаючи майже всіх членів великого королівського сімейства Німецької імперії.\n\nБезпосереднє управління країною взяло він уряд, але це навряд чи означає повернення демократії найближчим часом."
 wtt_news.26.c:0 "Радісний день!"
 wtt_news.34.desc:0 "Слідом за зверненням до американських пілотів та механіків із закликом вступити до добровольчого загону президент США [USA.GetLeader] офіційно схвалив передачу понад сотню сучасних винищувачів китайським ВПС. Пілотам армії, ВМС або морської піхоти США на час служби в цьому загоні надається відпустка.\n\nПерші кораблі з літаками мають відбути відразу після збирання машин. Конгресмени висловили занепокоєння тим, що такі дії на межі міжнародного права можуть мати негативний резонанс."
 wtt_news.35.desc:0 "Напруженість між Китаєм та Японією різко зросла після вчорашнього зіткнення у Шанхаї. \n\nЗа повідомленнями західних спостерігачів, сутичка відбулася між китайською поліцією та групою японських матросів. Обидва боки мають постраждалих. Коли для розслідування інциденту прибув японський патруль, китайська армія вже блокувала всі підходи до місця події та заарештувала матросів, звинувативши їх у замаху на вбивство.\n\nЯпонський уряд виступив з різкою заявою про те, що якщо моряків не буде відпущено, то він вживе заходів для їх звільнення."
 wtt_news.37.t:0 "Оголошено створення Китайської Народної Республіки"
 wtt_news.38.c:0 "Корисний союзник."
 wtt_news.40.desc_not_eng:0 "Держава [From.GetNameDef] провела сміливу та блискучу операцію, перекривши важливий торговий шлях, що проходить крізь Суецький канал. При цьому вона скористалася затопленими суднами, підривними зарядами та мінами. Пошкодження досить великі, і швидше за все, відновні роботи займуть місяці."
 wtt_news.40.t:0 "Підірвано Суецький канал"
 wtt_news.43.d:0 "Ми усунули перешкоду..."
 wtt_news.55.t:0 "Відродження держави [From.GetNameDef]"
 wtt_news.57.b:0 "Чи переживе вона поділ цього разу?"
 wtt_news.6.c:0 "Новий силовий блок у Європі? Це тривожно."
 wtt_news.65.desc:0 "У міру продовження [From.GetOldAdjective]ого піднесення від уваги фахівців із історії Персії не вислизнули деякі історичні паралелі. Провідні експерти вже почали порівнювати поточні обставини з добою Кіра Великого, що підняло націоналістичні настрої в [From.GetOldAdjective]ому суспільстві.\n\nПродовжуючи зміцнювати контроль над завойованими територіями, уряд на хвилі суспільного схвалення заявив, що тепер держава офіційно називається «[From.GetNameDef]»."
 wtt_news.70.b:0 "Її велич і славу не можна заперечити!"
 wtt_news.70.desc:0 "Хай славиться [FROM.GetLeader]: за [FROM.GetLeader.GetHerHis] правління [From.GetOldNameDef] значно розширила свої кордони, перевершивши навіть кордони старої Священної Римської Імперії. [From.GetOldAdjectiveCap]а воєнна машина поставила навколішки всіх континентальних ворогів, які могли би кинути виклик її правлінню, залишивши їй можливість продовжувати свою політику.\n\nТепер [FROM.GetLeader] постановлює, що поточна можливість мусить бути використана, і що держава мусить стати духовною спадкоємицею Священної Римської Імперії. На знак цього державу було офіційно перейменовано, і таким чином [FROM.GetLeader.GetSheHe] нарешті досягає політичного об'єднання регіону, яке століттями вислизало від імператорів."
 wtt_news.8.b:0 "Сподіватимемося, новий режим буде більш люб'язним..."
 wtt_political_organisation.2.t:0 "Повідомлення з області [state.GetName]"
 wtt_political_organisation.4.t:0 "[From.GetNameDefCap] здобуває більшість в області [state.GetName]"
 wtt_political_organisation.9.desc:0 "Наші агенти в області [state.GetName] організували серію нападів на місцевий штаб партії, якою керує [old_majority_country.GetLeader], і завдали шкоди її політичній репутації. Місцеве населення звернуло увагу на цю акцію. [old_majority_country.GetLeader] тепер перебуває у явній меншості."
 wtt_warlord.3.desc:0 "[From.GetAdjective]ий уряд категорично відмовився обговорювати наші пропозиції. Воно стверджує, що нам бракує повноважень вести переговори від імені справжнього національного уряду."
 wtt_warlord_vs_prc.32.t:0 "[From.GetNameDefCap] погоджується"
 wtt_xian_incident.2.a:0 "Попросімо його укласти союз із комуністами."
 wtt_xian_incident.8.desc:0 "Ми перехопили повідомлення, яке надіслав [From.GetLeader], про те, що [CHI.GetLeader] перебуває у них під вартою і що його збираються передати комуністам. Враховуючи ненависть до нього, довго він не проживе. \n\nЯкщо ми не хочемо, щоб [CHI.GetLeader] влаштував показову кару лідера [PRC.GetLeader], потрібно діяти швидко та рішуче!"
 wtt_xian_incident_warning_8:0 "§R[CHI.GetNameDefCap] може вирішити почати війну через це!§!"
 wuw_GER_civil_war.5.t:0 "Четверте сілезьке повстання"
 wuw_GER_diplomacy.28.t:0 "[FROM.GetNameDefCap] відмовляється від пропозиції щодо досліджень"
 wuw_GER_diplomacy.56.desc:0 "[FROM.GetAdjective] чиновники та банкіри заблокували наші рахунки в Німеччині та вивели з них кошти. Це означає, що [GER.GetNameDef] конфіскувала наші активи, отримані згідно з Гьомбьошським торговельним договором. Їм більше не можна довіряти..."
 wuw_GER_diplomacy.57.b:0 "Нехай спробують забрати силою!"
 wuw_GER_diplomacy.71.t:0 "Створення Народного комісаріату [ROOT.GetNonIdeologyName]"
 wuw_GER_diplomacy.74.a:0 "Ми маємо визволити наших товаришів!"
 wuw_GER_diplomacy.85.a:0 "У нас немає вибору"
 wuw_GER_diplomacy.95.a:0 "Звучить справедливо"
 wuw_GER_legions.3.desc:0 "Після окупації Брянської, Курської та Орловської областей, наша армія розробила план залучення місцевих колаборантів у Локоті для полегшення управління регіоном і формування додаткових підрозділів для боротьби з [SOV.GetAdjective]. Але це позбавить нашу групу армій військових трофеїв. Чи дозволимо ми створення автономії Локот?"
 wuw_GER_military_events.2.t:0 "Пілот пощадив екіпаж [USA.GetAdjective] бомбардувальника"
 wuw_GER_monroe.8.c:0 "Ми просто перечікували бурю"
 wuw_GER_monroe_news.1.a:0 "Справжня перемога"
 wuw_GER_news.2.a:0 "Цікавий розвиток подій"
 wuw_GER_realpolitik.20.a:0 "Сподіваємось, це буде остання вимога..."
 wuw_GER_reichskommissariats.1.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.13.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Богемії та Моравії, нам слід визначити не лише її призначення, а й те, хто очолить місцеве населення та забезпечить виконання нашої політики. Чи слід нам призначити [ROOT.GetAdjective] політика на посаду райхспротектора, чи краще використати місцевого колаборанта?"
 wuw_GER_reichskommissariats.2.t:0 "Керівництво Нідерландів"
 wuw_GER_reichskommissariats.21.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Карибському регіоні, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_reichskommissariats.27.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Австралазії, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_reichskommissariats.7.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_weltpolitik.1.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із проханням повернути колишні [FROM.GetAdjective] колоніальні території в обмін на поглиблення наших стосунків і офіційну підтримку нашого уряду на світовій арені. Пропозиція дещо одностороння, але, можливо, вона нам вигідна?"
 wuw_GER_weltpolitik.14.a:0 "Цьому не судилось статись..."
 wuw_GER_weltpolitik.14.desc:0 "\n[FROM.GetLeader] з [FROM.GetNameDef] відмовився повертати наші колишні колонії, заявивши, що це одностороння угода, з якої вони майже нічого не виграють."
 wuw_GER_weltpolitik.18.t:0 "[FROM.GetNameDefCap] відмовляються від встановлення сфер впливу"
 wuw_GER_weltpolitik.20.desc:0 "Розсудливий [FROM.GetLeader] з [FROM.GetNameDef] погодився передати території в Анголі та наказав своїм військам відступити. Ми знову святкуємо перемогу!"
 wuw_GER_weltpolitik.6.t:0 "[FROM.GetLeader] відкидає угоду"
 wuw_HUN_a_roman_catholic_state_desc:0 "Наша країна є християнською вже багато століть. Одними з перших угорських християн були вожді харка Булчу та гюла Геула ще близько 950 року. І сьогодні ми залишаємося відданими католицизму й не зійдемо з цього шляху, незважаючи на труднощі."
 wuw_HUN_a_unifying_heritage:0 "Об’єднуюча спадщина"
 wuw_HUN_bringing_the_air_battle_to_the_seas_desc:0 "Лінкор — це пережиток минулого. Майбутнє морської війни — це авіаносці та літаки. Ми будемо на передовій цього напрямку."
 wuw_HUN_budapest_university_of_technology_and_economics_desc:0 "Нам потрібно більше розумних людей, які зможуть зробити проривні відкриття для нашої військової промисловості. Розширивши університет у столиці, ми зможемо збільшити кількість кваліфікованих інженерів і науковців."
 wuw_HUN_forcefully_revitalize_the_industries:0 "Примусова модернізація промисловості"
 wuw_HUN_government_of_national_unity:0 "Уряд національної єдності"
 wuw_HUN_honor_the_great_war_veterans_desc:0 "Попри те, що майбутнє за новими та яскравими командирами, ми не повинні забувати про наш борг перед ветеранами Великої війни, які захищали батьківщину. Ми маємо їх нагородити та забезпечити, щоб інші прагнули наслідувати їх приклад."
 wuw_HUN_magyar_allamvasutak:0 "Magyar Államvasutak"
 wuw_HUN_news_events.1.d:0 "\n[HUN.GetAdjective] уряд під керівництвом [HUN.GetLeader] оголосив нову масштабну індустріальну програму з метою якомога швидшого переозброєння нації. Іноземні спостерігачі вважають це актом агресії з боку [HUN.GetNameDef] щодо сусідів, але лише час покаже справжні наміри."
 wuw_HUN_news_events.8.desc:0 "Сьогодні Генеральний секретар Угорщини Матьяш Ракоші проголосив створення нової Угорської Народної Республіки, заявивши про намір країни посилити співпрацю з [SOV.GetNameDef]. Попри його заяву про відкриту демократію, авторитарну владу важко не помітити. Що чекає угорський народ у майбутньому?"
 wuw_HUN_news_events.9.c:0 "Цікавий розвиток подій"
 wuw_HUN_promote_entrepreneurship:0 "Сприяти підприємництву"
 wuw_HUN_strengthen_horthys_reign_desc:0 "Попри наміри фашистського прем’єра, найкращий шлях до миру і слави — це особиста влада регента, який гарантує виконання своєї волі."
 wuw_HUN_the_bastion_of_catholicism_desc:0 "Наша нація є переважно католицькою, як і наш монарх. Настав час для Апостольського Королівства Угорщина стати захисником християнства та вигнати безбожних комуністів з нашого континенту."
 wuw_HUN_the_bulwark_against_the_west_desc:0 "Фашисти та капіталісти Заходу становлять загрозу. Ми станемо стіною, яка захистить міжнародну революцію."
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias_desc:0 "Арпад, Андраш III Венеційський та Матяш Корвін — троє з найвеличніших правителів нашої старої нації. Якщо Йожеф Август хоче дорівнятися до їхньої слави, він має відновити їхню спадщину, втілити її дух і перенести у майбутнє."
 ww_BEL_event_diplomatic.4.desc:0 "На жаль, здається, що народ [FROM.GetNameDefCap] має завищену оцінку своєї суверенної сили і відмовився від нашої щедрої пропозиції об'єднання. Нам доведеться показати їм силу нашої нації і принести їх у наш союз силою."
 ww_BEL_event_political.3.desc:0 "Поль ван Зееланд нарешті подав у відставку з посади прем'єр-міністра і залишив свою посаду в ганьбі. Цього разу король Леопольд III оголосив, що він особисто призначить нового прем'єр-міністра. Є два основні кандидати: \n\nПоль-Еміль Янсон, член Ліберальної партії і представник уряду національної єдності, вважається стабільним керівником. Інший кандидат — Леон Дегрель, який вважається голосом закону та порядку, і недавно зміцнив свої позиції завдяки успіху його партії на виборах."
 ww_BEL_event_war.10.t:0 "Париж під контролем [ROOT.GetAdjective]"
 ww_congo.12.t:0 "Французи відмовляють від наших вимог"
 ww_congo.18.d:0 "Нещодавно вільний конґолезький уряд в Станлевілі намагався відокремитися від бельгійської колоніальної імперії. Попри велику підтримку в країні, їхнє повстання було швидко придушене військами, лояльними до Бельгії, та іноземними найманцями."
 ww_congo.22.b:0 "Хто він такий, щоб щось вимагати?"
 ww_congo.27.t:0 "Заколот у Лулуабурзі"
 ww_congo.67.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], звернувся до нас з цікавою пропозицією. Вони хочуть, щоб ми приєдналися до спільного Товариства з розвитку урану, і обмінювалися ядерними матеріалами та дослідженнями. Це може призвести до витоку інформації, але це, ймовірно, варте того через уран, який ми так потребуємо."
 ww_congo.70.a:0 "Щасливого польоту"
 yokosuka_naval_arsenal:0 "Морський арсенал у Йокосуці"
