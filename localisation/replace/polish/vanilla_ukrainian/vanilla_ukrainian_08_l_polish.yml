 TUR_funkplan:0 "План Функа"
 TUR_funkplan_desc:0 "Створений за зразком плану Ялмара Шахта, план Вальтера Функа гарантує німецький доступ до [TUR.GetAdjective]их мінеральних руд, а також полегшує [TUR.GetAdjective]ий доступ до ринку німецької комерційної продукції. Приховані положення в плані Функа також гарантують нам мінімальну кількість матеріалів, необхідних для розширення нашої важкої промисловості."
 TUR_georgian_manganese_extraction:0 "Видобуток мангану в Грузії"
 TUR_hunt_down_fifth_columnist_islamists:0 "Уполювати п'яту колону ісламістів"
 TUR_integrate_hakkari_desc:0 "$TUR_integrate_kurdish_state_desc$"
 TUR_integrate_the_fascist_council:0 "Інтегрувати Фашистську раду"
 TUR_kemalism_with_socialist_characteristics:0 "Кемалізм із соціалістичними рисами"
 TUR_kemalist_army_officers_decreased_power_loyal:0 "Офіцери-кемалісти"
 TUR_kemalist_army_officers_extended_power_disloyal_desc:0 "Офіцери елітного турецького корпусу — одні з найбільших захисників кемалістських цінностей. Кемалізм швидко завойовує серця і розуми жителів Туреччини. Офіцерський корпус активно діє проти уряду, щоби гарантувати захист кемалістських цінностей."
 TUR_learning_from_the_tripolitanian_war:0 "Уроки Тріполітанської війни"
 TUR_nazmi_solok:0 "Назмі Солок"
 TUR_partnership_pact_with_bulgaria_desc:0 "Розумно було б не судити [BUL.GetAdjective] народ надто суворо, бо він перейде до рук ворога. Краще запропонувати йому альтернативу, можливість бути на стороні свободи та справедливості, а не автократії та корупції."
 TUR_punish_french_weakness_desc:0 "За часів Наполеона [FRA.GetAdjective]ий триколор майорів над половиною Європи. Сьогодні ж він не заслуговує тріпотіти навіть над Парижем. Уже давно настав час покінчити з цією ганебною для всього світу нацією, відомою як «[FRA.GetNameDef]»."
 TUR_ratify_the_six_arrows_desc:0 "Шість стріл символізують шість фундаментальних стовпів кемалізму. Ратифікувавши ці принципи у національній конституції Туреччини, ми допоможемо закріпити у країні кемалістські цінності."
 TUR_reaffirm_the_balkan_pact:0 "Реформувати Балканський пакт"
 TUR_recall_ataturk_to_active_service:0 "Повернути Ататюрка на службу"
 TUR_revive_turkish_revolutionism_desc:0 "Очевидно, що реформа турецької політичної системи не витримала масового опору турецького народу. Як же вчинити? Потурати масам чи підвищити радикальність наших реформ? Кемалізм вже змінював свою суть, і хто знає, куди заведе його в майбутньому новий перегляд ідеологічних складових?"
 TUR_stoked_nationalism_flag:0 "Нещодавно розпалено націоналістичні настрої"
 TUR_submarine_3_desc:0 "The Oruç Reis-class submarines were built in Britain as a modified British S-class design. The ships were launched in 1940, with several temporarily interned by the Royal Navy. All but one were eventually returned to Turkey. The ships displaced 625 tons and were armed with five 533mm torpedo tubes. They were somewhat limited in their speed and range."
 TUR_the_german_turkish_friendship_treaty:0 "Німецько-турецька угода про дружбу"
 TUR_the_tuz_golu_training_facility_desc:0 "Середземноморський клімат нашої країни не підходить для навчання солдат діям у посушливому кліматі. Ми вирішили побудувати навчальний комплекс поряд із солоним озером Туз, щоб краще підготувати війська до боїв у посушливій місцевості."
 TUR_turkish_air_defense_platforms_desc:0 "Ми маємо захистити небеса на випадок, якщо хтось на сусідніх територіях вирішить атакувати з повітря."
 TUR_ultranationalism_desc:0 "Нехай Бог забере у мене моє життя, моїх близьких і все майно, якщо Він хоче, але нехай Він не позбавить мене єдиної справжньої батьківщини у світі. Ці азани та їхні освідчення є основою моєї релігії, і нехай їхній благородний звук громом панує по всій моїй вічній батьківщині."
 TUR_unite_the_azeri_diaspora_desc:0 "Наш найбільший обов'язок — об'єднати тюркські народи всього світу в єдину націю. Поки ми не звільнимо азербайджанських родичів за кордоном, завдання далеке від завершення."
