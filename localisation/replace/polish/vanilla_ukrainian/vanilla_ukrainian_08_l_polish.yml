 JAP_GATHERING_STORM_DESC:0 "Японська імперія стоїть на перехресті. Армія віддає перевагу доктрині «Хокушін-рон» (Доктрині північної експансії) та закликає до розширення в Сибір. Флот, у свою чергу, підтримує доктрину «Наншін-рон» (Доктрину південної експансії) та ставить за мету завоювання багатих європейських колоній у Південно-Східній Азії й Океанії.\n\nКрім того, звісно, не треба забувати про Китай. Японія володіє могутньою армією, але її промисловості невистачає ресурсів, а час спливає. Який шлях слід обрати?"
