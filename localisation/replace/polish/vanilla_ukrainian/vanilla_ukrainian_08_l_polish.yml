 FIN_crack_down_on_the_military_character_tt:0 "Деякі генерали та військові радники будуть ув'язнені та будуть недоступні для ворожої сторони в громадянській війні:"
 FIN_extra_refresher_exercises_desc:0 "Напруга в Європі продовжує зростати, і якщо ми хочемо зберегти [ROOT.GetAdjective]у незалежність, нам потрібно зміцнити захист Фінляндії за допомогою інтенсивних навчань, готуючись до абиякого можливого спалаху конфлікту та демонструючи рішучість і готовність Фіни захищатимуть суверенітет нації, якщо це необхідно."
