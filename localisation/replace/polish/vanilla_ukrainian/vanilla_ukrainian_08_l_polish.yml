 BRN_communism:0 "Брунейська народна республіка"
 BRN_communism_ADJ:0 "Брунейськ"
 BSK_communism_party:0 "ББП"
 BUILDING_CURRENT_MAX_LEVEL_CAPPED:0 "Поточний максимальний рівень обмежений через:"
 BUL_POPULARITY_TOOLTIP:0 "§YПопулярність§! відображає підтримку, яку фракція отримує від певних верств населення (будь то військові, пролетарські, селянські або радикально праві).\nЧим вища §Yпопулярність§!, тим більша ймовірність того, що фракція буде протистояти уряду.\nПерш ніж знищити фракцію, необхідно виконати певні рішення для її послаблення та зменшення її §Yпопулярності§! до 0."
 BUL_appoint_communist_ministers_tt:0 "Будуть відкриті рішення по придушенню фракції [GetNsmName]."
 BUL_appoint_tsankov_desc:0 "Настав час переходити до радикальніших політичних заходів. Ніхто так не підходить на роль лідерів країни, як Александир Цанков та його Народний соціальний рух."
 BUL_back_from_the_scw_flag:0 "Повернувся з громадянської війни в Іспанії"
 BUL_balkan_federation_project_ready_flag:0 "Проєкт Балканської федерації готовий"
 BUL_boris_german_meeting_location_capital:0 "у місті [GER.Capital.GetCapitalVictoryPointName]"
 BUL_british_military_agreements_flag:0 "Угода про військову співпрацю з британцями була підписана"
 BUL_bulgarian_reintegration_campaign:0 "Кампанія з болгарської реінтеграції в області [FROM.GetName]"
 BUL_bury_the_grudges_of_the_past:0 "Поховати образи минулого"
 BUL_bzns_integrated_flag:0 "Фракція [GetBznsName] інтегрована в уряд"
 BUL_carry_the_revolution_abroad_desc:0 "Болгарія повинна стати авангардом комуністичної революції на Балканах. Ми запросимо уряди-однодумці приєднатися до нашого альянсу, і ми візьмемо на себе зобов'язання силою донести революцію до решти наших сусідів."
 BUL_cooperation_bs_joint_act_desc:0 "Ми організуємо спільний захід з фракцією [GetBsName], на якому публічно оголосимо про свою підтримку цього фракції та готовність співпрацювати з ним."
 BUL_cooperation_bzns_speech_desc:0 "Ми дозволимо фракції [GetBznsName] вимовити про своє бачення економічної та соціальної політики, промислових проєктів та аграрних реформ."
 BUL_cooperation_fund_bzns_desc:0 "Для підтримки наших політичних союзників ми забезпечимо фракцію [GetBznsName] коштами на кампанію пропаганди, що збільшить її популярність."
 BUL_cooperation_fund_nsm:0 "Фінансувати $BUL_nsm_name_gen$"
 BUL_crush_the_communists:0 "Розбити комуністів"
 BUL_defying_moscow:0 "Протистояння Москві"
 BUL_develop_burgas_shipyards_desc:0 "Щоб збільшити наші виробничі потужності для військових кораблів, ми інвестуємо в розширення військово-морської бази Бурґас і будівництво нових верфей у цьому районі."
 BUL_dissolve_the_military_union_zveno_coup_tt:0 "\n§RФракція [GetZvenoName] зможе влаштувати переворот, якщо не буде вчасно знищена.§!"
 BUL_dobri_bozhilov_bftb:0 "Добрій Божілов"
 BUL_dominance_in_the_adriatic_black_sea_success:0 "Після наших успіхів у забезпеченні Чорного моря настав час повторити маневр в Адріатиці. Ми виженемо будь-яку ворожу націю, яка знаходиться на її берегах, і захопимо її цінні території для Пруссії на Балканах."
 BUL_follow_the_stalinist_doctrine:0 "Дотримуватися сталінської доктрини"
 BUL_german_industrial_agreements:0 "Промислові угоди з державою [GER.GetName]"
 BUL_german_military_agreements_flag:0 "Угода про військову співпрацю з німцями була підписана"
 BUL_is_balkan_nation_tt:0 "Є балканською державою"
 BUL_italian_naval_agreements_flag:0 "Угода про морську співпрацю з італійцями була підписана"
 BUL_ivan_dochev_desc:0 "Іван Дімітров Дочев"
 BUL_ivan_markov_desc:0 "Іван Хрістов Марков"
 BUL_join_the_tripartite_pact_warranted_claims_tt:0 "Гарантовані країни:"
 BUL_joint_research_effort_desc:0 "Ми мусимо поєднати наші дослідницькі зусилля у військовій сфері з зусиллями наших союзників, щоби сприяти розробці сучасної зброї, яка може змінити баланс на нашу користь у військовому конфлікті."
 BUL_low_popularity_increase_tt:0 "[?BUL.BUL_faction_low_increase|=G0] популярність фракції."
 BUL_nationalist_propaganda_desc:0 "Серед болгарського населення все ще є сектори, які виступають проти ролі Болгарії як домінуючої сили на Балканах, стверджуючи, що політика уряду є «надзвичайно репресивною». Щоб заглушити ці голоси, ми мусимо профінансувати кампанію пропаганди, яка допоможе нам виправдати дії нашого уряду та відновити болгарський націоналізм."
 BUL_nikola_totev_markov:0 "Нікола Тотев Іванов"
