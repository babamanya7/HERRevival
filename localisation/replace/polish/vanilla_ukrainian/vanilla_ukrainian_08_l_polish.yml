 RAJ_eastern_pakistan_tt:0 "§Y[BAN.GetName]§! належатиме §Y[PAK.GetName]§! після поділу"
 RAJ_education_efforts_desc:0 "Рівень грамотності в [ROOT.GetName] все ще незадовільний. Нам потрібно різко збільшити витрати на освіту, щоб наздогнати великі держави."
 RAJ_education_for_the_masses:0 "Освіта для мас"
 RAJ_engineering_revolution_desc:0 "Прогрес Індії вимагає інженерної революції. Інвестуючи в інфраструктуру, промисловий розвиток та передові технології, ми можемо перетворити націю на центр сили, здатний лідирувати як у мирі, так і у війні."
 RAJ_exports_for_the_empire:0 "Індійський експорт для імперії"
 RAJ_forward_bloc_party_name_long:0 "Прогресивний блок"
 RAJ_great_depression_price_controls:0 "Контроль над цінами під час Великої депресії"
