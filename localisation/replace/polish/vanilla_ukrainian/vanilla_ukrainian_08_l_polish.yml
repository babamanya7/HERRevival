 SOV_impregnable_forts_desc:0 "[ROOT.GetAdjective]а інженерія тепер здатна створювати справді страхітливі укріплення, які легко витримують навіть найсильніші обстріли і майже не піддаються штурму. З великими запасами боєприпасів і припасів, ці форти могли б, за необхідності, роками протистояти ворожим атакам."
 SOV_imprisoned_flag:0 "Перебуває в ув'язненні (§Gперсонажі в ув'язненні можуть бути піддані чистці§!)"
