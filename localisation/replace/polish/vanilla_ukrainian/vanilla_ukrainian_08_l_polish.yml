 country_capitulated.0.d_neutral_both_no_faction:0 "\n[Root.GetAdjective]ий уряд пішов у вигнання, а його основні сили капітулювали перед [From.From.GetNameDef], який тепер контролює їхню територію.\n\nХоча боротьба між [From.From.GetName] і [Root.GetName] закінчилася, [From.From.GetNameDef] все ще перебуває у стані тотальної війни, і бойові дії тривають деінде."
