 ITA_proclaim_the_italian_empire_desc:0 "З нашими нещодавніми здобутками в Африці для нас настає новий день. Із процвітаючою імперією та мудрими інвестиціями в нашу армію, ми більше не просто королівство; ми нарешті з упевненістю можемо заявити про світанок Італійської імперії! Як довго ми чекали цієї миті!"
 ITA_promote_ideology_rallies_balkan_desc:0 "$SOV_promote_ideology_rallies_balkan_desc$"
 ITA_redirect_alfa_romeo_production_desc:0 "Протягом десятиліть італійські спортивні автомобілі були на абсолютній вершині технологій. Але з насуванням хмар війни кожен в Італії мусить зробити свій внесок. Ми не можемо дозволити собі втримувати безглузду розкіш, а машини заводів «Alfa Romeo» можна ліпше використані у військових цілях."
