 BEL_modify_defensive_neutrality_dynamic_modifier_tt:0 "Змінити §Y$BEL_defensive_neutrality_dynamic_modifier$§! на:"
 BEL_more_equipment_for_the_spanish_decision_tt:0 "Нам зможемо вибрати, яке саме обладнання, §YПіхотне Спорядження§!, §YДодаткове Обладнання§! або §YАртилерію§!, відправити §Y[SPD.GetAdjective]§!им республіканцям на допомогу."
 BEL_paul_henri_spaak:0 "Поль-Анрі Спаак"
 BEL_pressurized_cabins_ns:0 "Пресуризовані кабіни"
 BEL_protect_against_france_available_tt:0 "Можна побудувати §Y1 наземний фортифікаційний об'єкт§! у §YШарлеруа§!, §YКортрейк§! або §Yприбережній провінції на північний захід від Кортрейка§!"
 BEL_senior_officer_training_desc:0 "Офіцерів можна охарактеризувати двома з чотирьох рис: лінощі, дурість, працьовитість та кмітливість. Офіцери штабу повинні бути працьовитими та кмітливими, старші офіцери — лінивими та кмітливими. Навіть дурні та ліниві мають свою користь. Передусім ми повинні визначити дурних та працьовитих, адже саме вони приймають рішення, які ведуть до катастрофи, і мають волю і енергію довести їх до кінця."
 BEL_share_military_experience:0 "Поділитися військовим досвідом із державою [FROM.GetNameDef]"
 BEL_the_grand_place_desc:0 "Велика площа в центрі Брюсселя довгий час була осередком соціалістичних ідей. Найвідоміше, саме тут Карл Маркс написав «Комуністичний маніфест», далі це місце стало домом для 3-го Конгресу Першої Інтернаціональної, а згодом стало основним місцем заснування першої соціалістичної партії — Бельгійської робітничої партії."
 BEL_tripartite_government_desc:0 "Як і уряди національної єдності, що були до цього, прем'єр-міністр П'єрло об'єднав кілька демократичних партій для демонстрації бельгійської солідарності. Завдяки цьому політичному єднанню він нарешті отримав можливість проштовхнути більш радикальні законодавчі ініціативи."
 BEL_unlock_gold_reserve_decisions_tt:0 "Відкриває рішення для §Y$BEL_gold_reserves_cat$§!"
