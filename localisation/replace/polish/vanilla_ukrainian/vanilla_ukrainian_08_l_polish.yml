 ARG_hispano_argentina_manufacturer:0 "$ARG_hispano_argentina_organization$"
 ARG_jet_fighter_equipment_2_short:0 "Pulqui II"
 ARG_ligas_patrioticas_tt:0 "Відмикає шаблон дивізії «Ligas Patrióticas» та набирає §Yп'ять§! одиниць у місті §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 ARG_march_to_la_casa_rosada_tt:0 "§Y$ARG_pedro_pablo_ramirez$§! стає лідером партії §Y$ARG_militarist_party_long$§!"
 ARG_military_state_fascism_ADJ:0 "Аргентинськ"
 ARG_modify_corruption_ns_intro:0 "Ідею §Y$ARG_political_corruption_modifier$§! буде змінено:"
 ARG_pay_back_italy:0 "Сплатити позику від держави [ITA.GetFlag]§Y[ITA.GetName]§!."
 ARG_political_events.101.a:0 "Разом ми будемо тримати лінію та захищати наш народ!"
 ARG_political_events.18.desc:0 "Після того, як ми відстояли свою позицію, здається, [ARG.GetAdjective] уряд вирішив, що продовжувати цей курс дій не варто. Тепер ми можемо спокійно відпочити, знаючи, що загроза наразі придушена."
 ARG_political_events.28.desc:0 "Уряд [CHL.GetAdjective] вирішив погодитися на умови, які ми висунули в нашому ультиматумі. Ми негайно зробимо їхні землі маріонетковими та встановимо [ARG.GetAdjective] правління якомога швидше."
 ARG_political_events.31.a:0 "Звільнити Гельмута. Ми можемо використати його навички."
 ARG_political_events.39.desc:0 "Наші вимоги були зустрінуті зарозумілою відмовою від [SPA.GetNameDef]. [SPA.GetAdjective] керівництво стверджує, що наші вимоги занадто високі і не порівнянні з нашими зусиллями під час війни."
 ARG_political_events.41.desc:0 "У 1931 році Родольфо Ґйольді втік з [ARG.GetNameDef] після погроз його життю через його соціалістичні погляди. Тим часом він працював над підтримкою комуністичного повстання в [BRA.GetNameDef] у спробі повалити Жетуліо Варгаса з його посади в уряді. Тепер, коли політичний ландшафт у [ARG.GetNameDef] змістився більше вліво, Ґйольді повідомив, що йому комфортно повернутися на батьківщину, щоб очолити КПА."
 ARG_political_events.44.t:0 "[SOV.GetNameDefCap] відмовляється надіслати допомогу"
 ARG_political_events.51.desc:0 "Незважаючи на сутички з менеджерами та фашистськими агітаторами, страйк робітників у [FROM.FROM.GetName] зумів зібрати значний натовп прихильників. Керівництво КПА виступило з численними промовами про майбутнє нації, позбавленої класового поділу, які були зустрінуті вигуками та скандуваннями натовпу. Місцеве відділення партії вже оголосило, що кількість членів зросла після мітингу."
 ARG_political_events.6.t:0 "[FROM.GetName] погоджується на нашу пропозицію!"
 ARG_political_events.82.desc:0 "Коли ми відкрили наш новітній освітній грант, нас зустріли гучні похвали від науковців по всій країні. Оскільки ми вирішили зосередитися на навчанні людей ефективності нових промислових розробок, ми можемо очікувати стійкого буму прогресу в наших дослідницьких відділах."
 ARG_political_events.90.desc:0 "Намагаючись зміцнити свої стосунки з нами, [ARG.GetLeader] з [ARG.GetNameDef] запропонував провести спільні військові навчання для тренування нашого флоту та повітряних сил. Цей теплий жест дуже вітається в ці похмурі дні."
 ARG_reinforced_alliance:0 "Зміцнення співпраці"
