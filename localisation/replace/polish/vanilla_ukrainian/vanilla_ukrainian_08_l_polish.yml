 INS_loyalist_events.26.desc:0 "Уряд [FROM.GetAdjective] прийняв нашу пропозицію. Їхні офіційні особи вже координують з нашими початок процесу інтеграції. Від Ачеха до Лусона, від Борнео до Мінданао, наша нація тепер охоплює всю широту Малайського архіпелагу."
