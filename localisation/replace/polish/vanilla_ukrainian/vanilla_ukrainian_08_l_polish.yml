 BEL_anti_corruption_taskforce_desc:0 "Корупція розповсюдилася в державі занадто довго, тепер, коли ми очистили верхівку, час узятися за решту. Ми створимо спеціальну розслідувальну групу з розширеними повноваженнями для виявлення та вигнання тих, хто наживається за рахунок платників податків."
 BEL_anti_tank_equipment_1_short:0 "47mm Model 1931"
 BEL_belgian_inquisitor:0 "Бельгійський інквізитор"
 BEL_burgundian_heritage_ns:0 "Бургундська спадщина"
 BEL_burgundian_heritage_ns_desc:0 "Звертаючись до процвітання бургундського золотого віку, військовий, політичний та економічний потенціал нації знову є безсумнівним."
 BEL_charles_king_of_belgians:0 "Карл, Король Бельгійський"
 BEL_cockerill_shipyards_desc:0 "Суднобудівні верфі Cockerill, дочірнє підприємство більшого конгломерату Cockerill, — це саме ті промислові зв’язки, на яких нам слід будувати свою стратегію. Військові кораблі цього часу виготовляються з сталі, а Cockerill робить сталь краще за всіх."
