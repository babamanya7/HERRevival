 IRQ_kurdistan_tag_fascism:0 "Хойбунський Курдистан"
 IRQ_liberate_levant:0 "Визволити Левант"
 IRQ_mechanized_equipment_2:0 "Universal Carrier"
 IRQ_political_events.26.desc:0 "Дипломати з [FROM.GetNameDef] звернулися до нас із пропозицією членства у їхній федерації. Хоча, безсумнівно, будуть економічні переваги та переваги у безпеці від приєднання, нам доведеться відмовитися від значної частини нашої автономії."
