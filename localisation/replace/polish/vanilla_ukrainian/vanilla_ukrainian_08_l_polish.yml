 MEX_aaron_saenz:0 "Аарон Саенс Ґарса"
 MEX_aerial_artillery:0 "Повітряна артилерія"
 MEX_cedillo_tension_4_desc:0 "Генерал Сатурніно Седільйо і вірні йому каудільйо відкрито збирають сили, готуючись до повстання проти законного уряду лідера [Root.GetLeader]. Ми мусимо діяти негайно, щоби покінчити з цією загрозою Мексиці!"
 MEX_church_power_3:0 "Напориста церква"
 MEX_church_power_5_desc:0 "Ненависна Конституція 1917 року була скасована. Після десятиліть гонінь на істинну віру Свята церква нарешті стала найвищим моральним та законним авторитетом у Мексиці!"
 MEX_cristero_communism_ADJ:0 "Мексиканськ"
 MEX_cv_fighter_equipment_2_short:0 "Teziutlán (пал.)"
 MEX_decision_integrate_costa_rica:0 "Інтегрувати державу [COS.GetNameDef]"
 MEX_dionisio_navarro_anguiano:0 "Діонісіо Наварро Анґіано"
 MEX_fabrica_nacional_armas_organization:0 "$fabrica_nacional_armas$"
 MEX_fighter_equipment_1:0 "TNCA «Quetzalcoatl» 4-E-131"
 MEX_focus_church_schools:0 "Церковні школи"
 MEX_focus_heroic_military_college:0 "Героїчна військова академія"
 MEX_focus_international_peacekeepers_desc:0 "Демократичні сили світу планують створити альянс рівних, Організацію Об'єднаних Націй, щоби забезпечити міжнародну безпеку, даючи країнам світу місце для примирення їхніх розбіжностей і вирішення спорів. Ми візьмемо участь у такому проєкті, щоби допомогти латиноамериканським націям зберегти свою незалежність."
 MEX_focus_international_proletarianism_desc:0 "Радянський Союз продемонстрував, що їхній соціалізм змінить планету. Революція, за яку ми так завзято боролися, була лише одним кроком на шляху до звільнення людей: спочатку Мексики, а тепер і всього світу."
 MEX_focus_liberalize_the_banking_sector_desc:0 "Існує багато жорстких державних політик, які заважають ринку трансформувати Мексику. Наприклад, Загальний закон про кредитні установи 1925 року забороняє банкам володіти акціями інших банків. Смішно! Чим вільніший ринок, тим вільніші люди. Луїс Монтес де Ока, адвокат Австрійської школи економіки, допоможе нам реформувати банківську систему."
 MEX_focus_one_world_government_desc:0 "Тепер, коли тиранія Сталіна знищена, ми можемо переконати деяких його прихильників зайнятися самокритикою і приєднатися до спільноти націй, справді звільнених від реакційного гніту."
 MEX_focus_push_past_the_darien_gap:0 "Подолати Дар'єнський розрив"
 MEX_focus_rural_infrastructure_desc:0 "Залізничні системи в Мексиці були розширені в епоху Діаса, але зосереджені в основному в північних містах, щоби полегшити торгівлю з Америкою. Ми повинні просунути залізниці далі на південь."
 MEX_focus_spanish_civil_war_refugees:0 "Біженці громадянської війни в Іспанії"
