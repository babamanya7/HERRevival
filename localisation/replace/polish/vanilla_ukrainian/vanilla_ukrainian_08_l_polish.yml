 election.16.d:0 "На цих виборах опозиція, наскільки вона існує, критикує все більш авторитарне правління партії [Root.GetRulingParty]. Вона ставить під сумнів, чи має електорат взагалі якусь владу, чи все це лише для галочки.\n\nУтім, [Root.GetLeader] досі тішиться високим рівнем підтримки, і хоча обставини виборів ставляться під сумнів міжнародним співтовариством, вони не були оскаржені на національному рівні. Схоже, що навіть якщо [Root.GetName] більше не править народом, народ підтримує свого правителя... принаймні та його частина, що взяла участь у голосуванні."
