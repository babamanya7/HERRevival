 SIK_reestablish_the_guominjun_desc:0 "Ґоміньцзюнь був військовою фракцією, заснованою Фен Юсяном у 1920-х роках. Будучи відданою націоналізму, антиімперіалізму та християнському соціалізму, вона здається ідеальною організацією для відродження, якщо ми хочемо стати третьою стороною у громадянській війні. Не кажучи вже про те, що саме до Ґоміньцзюню Шен Шицай приєднався свого часу, і його вірність ніколи не належала Ґоміньдану."
