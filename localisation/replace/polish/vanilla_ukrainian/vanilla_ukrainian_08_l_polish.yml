 SOV_anti_soviet_military_thinking_banned_airforce_desc:0 "Вивчення та обговорення документів та ідей опальних і реакційних теоретиків тепер заборонено нашим офіцерам ВПС в Академії, а нових випускників ретельно перевіряють, щоб жоден ворог народу не потрапив до лав Радянських ВВС."
