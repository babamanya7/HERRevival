 JAP_investing_in_foreign_industries_cat_desc:0 "Наша програма промислових інвестицій в інші азіатські країни може призвести до скорочення нашої промислової бази в короткостроковій перспективі, але сировина, яку ми отримаємо, з лишком компенсує це і зміцнить наші виробничі лінії."
