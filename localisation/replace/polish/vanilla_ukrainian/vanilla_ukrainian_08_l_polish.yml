 MAN_kempeitai_idea_no_lar:0 "Кемпейтай"
 MAN_reclaim_the_empire_desc:0 "Ми повернули собі свободу, і тепер настав час оголосити війну зрадникам і бунтівникам на інших китайських землях. Ми правитимемо всією країною або загинемо, прагнучи цієї мети."
 MAN_the_kangde_emperor:0 "Імператор Канде"
 MAN_the_two_emperors_desc:0 "Настав час поставити хрест на домислах про те, що ми з Японією не є рівноправними партнерами. Наші два імператори схожі на двох братів!"
