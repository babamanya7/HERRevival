 CHL_political_events.5.desc:0 "[ARG.GetName] вирішила, що утримувати [953.GetName] перед обличчям нашої військової могутності не варто, і війська були помічені під час виведення з провінції. Це залишає спірну територію в наших руках вперше, і кампанії з інтеграції можуть бути розпочаті негайно."
