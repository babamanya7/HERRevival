 SOV_gain_support_from_party_members_tt:0 "§Y$SOV_vsevolod_merkulov$§!, §Y$SOV_mikhail_kalinin$§! і §Y$SOV_nikita_khrushchyov$§! приєднаються до опозиції, коли громадянська війна почнеться.\n§G+10%§! стабільності з початком громадянської війни."
