 POL_support_weapons:0 "Ckm wz. 25 & Moździerz wz. 18"
 POL_the_bombe_desc:0 "«Криптологічна бомба» — це поліпшення циклометра, яке дозволить нам розшифровувати коди дедалі досконаліших версій німецької «Еніґми»."
