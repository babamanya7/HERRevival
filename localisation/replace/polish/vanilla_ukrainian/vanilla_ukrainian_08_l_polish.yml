 SOV_barrier_troops_desc:0 "Битва часто буває хаотичною, і зрозуміло, що іноді солдати втрачають зв'язок із вищими штабами. Ми мусимо створити підрозділи далеко за фронтом, які збиратимуть цих відсталих і повертатимуть їх назад до бойових дій — і заарештовувати тих, хто зраджує своїх товаришів, намагаючись ухилитися від виконання свого обов'язку."
