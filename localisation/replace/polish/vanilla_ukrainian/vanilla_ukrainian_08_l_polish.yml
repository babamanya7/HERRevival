 ARMY_ARMY_LABEL:0 "Огляд дивізій"
 ARMY_BADGE_ORG_STR_INDICATOR_TOOLTIP:0 "§HОрганізація§!\nСередня величина: §H$ORG_MEAN$%§!\nМедіанна величина: §H$ORG_MEDIAN$%§!\n\n§HБоєздатність§!\nСередня величина: §H$STR_MEAN$%§!\nМедіанна величина: §H$STR_MEDIAN$%§!"
 ARMY_DIVISIONS_BUTTON:0 "§GКлацніть§!, щоб обрати.\n§GКлацніть§!, утримуючи §HShift§!, щоб обрати кілька дивізій.\n§GКлацніть ПКМ§!, щоби перейти до дивізії."
 ARMY_LEDGER_THRESHOLD_FUZZY_TOTAL_ARMY_COUNT:0 "Приблизна кількість дивізій"
