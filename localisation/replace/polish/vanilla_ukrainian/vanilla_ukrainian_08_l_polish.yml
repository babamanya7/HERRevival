 DEN_modernize_industrial_machinery_desc:0 "Данія традиційно була аграрною країною, яка покладалася на експорт продовольства, але за останні десятиліття зросла роль міської промисловості. Інвестуючи в сучасне машинобудування, промисловість може зростати ще більше."
