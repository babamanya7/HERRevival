 bba_news.101.a:0 "Так кінчається життя Муссоліні."
 bba_news.106.desc_emperor:0 "Помер старий імператор держави [FROM.GetName], Віктор Еммануїл III. Керуючи Італією протягом двох світових воєн, він слугував символом стабільності та об'єднував [FROM.GetAdjective]ий народ у ці важкі часи. Скорботні громадяни вийшли на вулиці, щоби висловити свою вдячність і підтримку померлому імператору.\n\nНарод сподівається, що єдиний спадкоємець і наступник старого імператора, принц Умберто, буде такою ж непохитною опорою для [FROM.GetAdjective]ого народу. Принц незабаром буде коронований як Умберто I, король держави [FROM.GetName], — хай царює він довго!"
 bba_news.106.desc_king:0 "Помер старий король держави [FROM.GetName], Віктор Еммануїл III. Керуючи Італією протягом двох світових воєн, він слугував символом стабільності та об'єднував [FROM.GetAdjective]ий народ у ці важкі часи. Скорботні громадяни вийшли на вулиці, щоби висловити свою вдячність і підтримку померлому королю.\n\nНарод сподівається, що єдиний спадкоємець і наступник старого короля, принц Умберто, буде такою ж непохитною опорою для [FROM.GetAdjective]ого народу. Незабаром принца буде короновано королем Умберто II — хай царює він довго!"
 bftb_bulgaria_balkan_federation.2.t:0 "[BUL.GetAdjectiveCap]ий проєкт Балканської федерації"
 bftb_bulgaria_balkan_federation.7.a:0 "Ми мусимо надати промислову допомогу [FROM.GetAdjective]ій державі."
 bftb_bulgaria_balkan_federation.8.t:0 "[FROM.GetNameDefCap] просить економічну допомогу"
 bftb_bulgaria_democratic_international_policies.4.a:0 "[ROOT.GetAdjectiveCap]ий уряд визнає територіальну цілісність Болгарії!"
 bftb_bulgaria_democratic_international_policies.4.desc:0 "До нас прибули представники держави [BUL.GetNameDef]. Вони сподіваються, що [ROOT.GetLeader] визнає законність [BUL.GetAdjective]ого уряду на колишніх болгарських територіях, окупованих військами. адміністративний контроль над регіоном державі [BUL.GetNameDef]."
 bftb_bulgaria_equipment_purchases.2.a_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_motorized]§! од. §Yмоторизованої піхоти§!"
 bftb_bulgaria_factions.11.desc:0 "Після ретельного розслідування нам вдалося виявити кількох вірних режиму членів «Звена». Виявилося, що в армії зріла змова проти уряду, але нам вдалося запобігти перевороту.\nСеред змовників випливло ім'я одного з найвірніших наших генералів: [?BUL_zveno_conspirator.GetName].\n\nПотрібно вирішити, що нам робити з цим зрадником."
 bftb_bulgaria_factions.21.t:0 "Бунти призводять до супутніх втрат"
 bftb_bulgaria_factions.31.desc:0 "Незважаючи на те що в минулому аграрії та комуністи рідко знаходили спільну мову, бажання повалити уряд, схоже, об'єднало певні фракції Землеробського національного союзу і Комуністичної партії.\nДеякі аграрії колеги залишилися вірними як боротьбі з буржуазією, так і неприйняттю більшовизму, і нині шукають політичні шляхи до порозуміння з урядом."
 bftb_bulgaria_factions.49.t:0 "Націонал-соціалістичний рух знищено"
 bftb_bulgaria_factions.61.a:0 "Чудова новина!"
 bftb_bulgaria_factions.70.a:0 "Вони отримали по заслугах."
 bftb_bulgaria_factions.70.desc:0 "Ми завдали серйозного удару Землеробському союзу і заарештували тих, хто, згідно з повідомленнями, був неодноразово помічений у публічному наклепі на уряд та підбурюваннях до протестів."
 bftb_bulgaria_factions.83.a:0 "Ось і кінець їхньої підривної діяльності!"
 bftb_bulgaria_fate_of_the_balkans.1.desc:0 "Сьогодні [ROOT.GetLeader] приймає [BUL.GetAdjective]ого посла, який зажадав, щоб держава [ROOT.GetNameDef] увійшла до альянсу [BUL.GetFactionName]. Як уважає [GetBulgarianLeader], [GetNameDef] розробляє програми співробітництва в галузях досліджень та оборони та гарантує безпеку та суверенітет усіх членів альянсу, при цьому дипломат застеріг, що всі держави, які відмовляться вступати до альянсу, будуть вважатися ворогами."
 bftb_bulgaria_fate_of_the_balkans.9.a_cooldown_tt:0 "Рішення §YПідпорядкувати державу [FROM.GetName]§! буде знову доступне через §R365 днів§!"
 bftb_bulgaria_imro.2.t:0 "У Македонії з'являються проболгарські настрої"
 bftb_bulgaria_rearmament.9.t:0 "[BUL.GetNameDefCap] не буде зазнавати військових обмежень"
 bftb_bulgaria_scw_volunteers.2.b:0 "Іспанія — це просто розминка..."
 bftb_bulgaria_soviet_influence.3.a:0 "Настав час шукати нових союзників..."
 bftb_bulgaria_soviet_influence.3.t:0 "[SOV.GetNameDefCap] виходить з угоди про взаємодопомогу"
 bftb_bulgaria_tsar_boris.1.desc_failure:0 "Царський візит до міста [GetDestinationName] став катастрофічним ударом по популярності царя. Вже з самого початку візиту було видно, що серед переважно бідних громадян, які зібралися вітати процесію, не було особливої радості, і в натовпі можна було почути навіть поодинокі освистування.\n\nСитуація погіршилася, коли громадяни організували народний протест навколо ратуші, де монарх і його сім'я насолоджувалися помпезним прийомом і розкішним бенкетом у супроводі найбільш привілейованих членів суспільства. Люди критикували такі пишні заходи і звинувачували вищі класи в усіх економічних і соціальних негараздах, які спіткали країну в останні десятиліття.\n\nУ відповідь силам поліції було доручено негайно розігнати демонстрацію, але застосування насильства лише погіршило ситуацію, і демонстрація переросла в масові заворушення."
 bftb_greece.102.t:0 "Комуністи організують наліт на завод"
 bftb_greece.103.a:0 "Обов'язково було підривати при цьому порт?"
 bftb_greece.167.b:0 "Цього разу інвестицій не буде..."
 bftb_greece.18.b:0 "Ми голосуємо проти!"
 bftb_greece.182.b:0 "Натхненний успіх!"
 bftb_greece.235.a:0 "Боягузи!"
 bftb_greece.237.a:0 "Чудові новини!"
 bftb_greece.42.desc:0 "Наші плани завершилися повним провалом. Верховне командування очікувало, що ми можемо зазнати однієї поразки від [FROM.GetAdjective]их військ, але програти в обох раптових атаках — це вже зовсім нікуди не годиться. [ROOT.GetLeader] скасував усі майбутні напади, але будь-яка спроба вирішити ситуацію нічого не дасть, оскільки [FROM.GetAdjective]ий делегат щойно оголосив нам від імені держави війну. Ситуація розвинулася, але не зовсім на нашу користь."
 bftb_greece.43.desc:0 "Штурм [FROM.GetAdjective]ими військами області [339.GetName] увінчався успіхом для них і розгромною поразкою для нас. [ROOT.GetLeader] мимоволі проводить паралелі з 1919 роком, коли [FROM.GetAdjective]і війська взяли контроль над областю [339.GetName].\n\nУ столиці панує зневіра, але весь народ розлючений тим, як наш давній ворог продовжує атакувати наш суверенітет. Якщо [FROM.GetAdjective]ий народ так бажає чергової війни, ми влаштуємо йому війну, яку він не забуде ніколи."
 bftb_greece.57.a:0 "Це було не прохання."
 bftb_greece.58.b:0 "Нехай забирають. Кіпр для нас не важливий."
 bftb_greece.6.a:0 "Разом ми знову зробимо Грецію великою."
 bftb_greece.6.desc:0 "Підлі анатолійські фашисти сіяли хаос і не бажали йти на переговори з урядом з самого зародження свого шкідливого руху. Але тепер все, схоже, змінюється: нам пропонують укласти угоду століття — об'єднати наші сили з фанатолій спільно скидати державу [TUR.GetNameDef].\n\nНе можна заперечувати, багато хто в нашій адміністрації уклали б угоду з дияволами нашої нації вже для того, щоби ті припинили заважати уряду. На щастя, магнат Арістотель Онассіс запропонував нам альтернативу: він, будучи сам з Анатолії, утворює рух протидії, використовуючи для цього свою славу, ділову хватку та особистий стан. За допомогою такого руху він має намір підірвати основу НСГ. Заходи, зрозуміло, не гарантують нам перемогу над рухом, але на Онассіса, принаймні, покластися можна."
 bftb_greece.60.t:0 "[FROM.GetNameDefCap] погоджується на частковий енозіс"
 bftb_greece.95.a:0 "Разом ми будемо нестримні!"
