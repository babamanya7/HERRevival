 tfv_australia.10.d:0 "[From.GetNameDefCap] розпочав переговори з [Root.GetAdjective]ими дипломатами щодо можливої передачі відповідальності за захист [Root.GetAdjective]ими території у Південно-Східній Азії.\n\nЗ огляду на проблеми, пов'язані із захистом зазначеної території, партнерство може не буде такою поганою ідеєю. Це означало б, що в доступному для огляду майбутньому зазначена територія буде лише номінально [Root.GetAdjective]ою, але номінальне володіння, безсумнівно, краще, ніж повністю їх втратити."
