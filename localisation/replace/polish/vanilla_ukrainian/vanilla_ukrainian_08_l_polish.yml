 AFG_afghan_pakistan_cold_War:0 "Афгано-пакистанська холодна війна"
 AFG_aid_communists_cw:0 "Допомога афганським комуністам"
 AFG_appraoch_anti_communist_theologians_desc:0 "Є багато мусульманських вчених та теологів, які погоджуються, що комунізм — це лихо для нашого громадянського суспільства. На жаль, [SOV.GetNameDef] зараз нав'язує таку мерзенну ідеологію нашим братам у Центральній Азії, і ми повинні зробити все можливе, щоб покласти край цьому нерозумству."
 AFG_constructing_a_national_identity_tt:0 "Коли національний дух §Y$AFG_constructing_a_national_identity_idea$§! буде скасовано:\n"
 AFG_core_central_asian_state_in_progress:0 "Інтеграція держави в процесі"
 AFG_development_in_tms:0 "Розвивати Туркменістан"
 AFG_expanded_education_desc:0 "Збільшення бюджету на освіту призвело до зростання можливостей для викладання в значно розширених освітніх закладах."
 AFG_fascist_graduates:0 "Фашистські випускники"
 AFG_foreign_military_advisors:0 "Запросити іноземних військових радників"
 AFG_gant_refuge_to_jadidists_desc:0 "Ісламські модерністи та реформатори, які є частиною руху джадидизму в [SOV.GetNameDef], активно придушуються урядом, і багато колишніх членів «Молодих бухарців» та «Молодих хівінців» стають мішенню чисток [SOV.GetLeader]. Було б розумно надати їм притулок у нашій нації, водночас дозволивши їм принести нам деякі свої демократичні ідеали."
