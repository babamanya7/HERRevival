 FIN_naval_airforce_desc:0 "Зі зростанням військово-морських сил [ROOT.GetName] повинні зростати і його авіаційні можливості. Створення спеціальної військово-морської авіації забезпечить підтримку ВМС Фінляндії, необхідну для домінування в Балтійському морі, координації військово-повітряних сил і поверхні. флоту для відбиття будь-якої загрози."
 FIN_northern_defense_front_desc:0 "Наших сусідів у Скандинавії та Балтії легко підібрати для великих держав. Але, якби ми об'єднали наші ресурси та співпрацювали у військовій сфері, ми могли б стримати навіть найбільших ворогів від нападу на нас."
