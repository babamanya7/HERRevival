 ITA_modernize_ansaldo_facilities_desc:0 "Економічний спад після Великої війни занурив «Ansaldo» в такі фінансові труднощі, що вони майже не змогли належним чином модернізувати свої фабрики. Від банкрутства їх врятував лише високий статус. Якщо ми хочемо, щоб «Ansaldo» залишалася такою важливою частиною нашої машинобудівної галузі, ми мусимо запевнитися, що вони використовують сучасні машини та технології."
