 CZE_has_a_skoda_naval_focus_tt:0 "$CZE_skoda_texticon_ref$ §YВійськово-морський фокус§! є поточним §YПріоритетом «Шкоди»§!"
 CZE_hungarian_line_desc:0 "Угорська експансія загрожує нашій батьківщині. Ми будемо почуватися безпечніше, відгородившись від сусідів системою фортифікаційних споруд."
 CZE_if_FRA_ally_tt:0 "Ефекти, якщо §YФранція є монархічною§! і ще не уклала союз із кимось іншим:"
 CZE_improve_balkan_trade_relations_desc:0 "Наш найбільший актив у залученні потенційних союзників на Балканах — це наша економіка; ми повинні продемонструвати нашу готовність витрачати ресурси на покращення економічної ситуації наших потенційних союзників."
 CZE_integrate_fortification_engineers_desc:0 "Коли інженери-фортифікатори нашої армії не зайняті будівництвом стаціонарних споруд, ми можемо швидко перекинути їх на передову для покращення нашої оборони. Це допомогло б передовим силам створювати кращі тимчасові захисні споруди для наших військ."
