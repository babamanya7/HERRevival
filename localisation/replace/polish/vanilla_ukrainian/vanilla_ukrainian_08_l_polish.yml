 SOV_lessons_of_war_cowed_trait_tt:0 "\n§YКожен командувач армії та флоту§! із рисою §Y$trait_SOV_cowed_by_stalin_army$§!:\n   Втратить рису §Y$trait_SOV_cowed_by_stalin_army$§!:\n     - $MODIFIER_ARMY_MORALE$: §R-10.0%§!\n     - $MODIFIER_LAND_REINFORCE_RATE$: §R-2.0%§!\n"
