 GER_strafbataillon_spawn_tt:0 "§Y3 каральні дивізії§! будуть створені в §Y[ROOT.Capital.GetName]§!.\nВідкриває обмежений набір §YКаральних дивізій§!."
 GER_strengthen_kriegsmarine_democratic:0 "Deutsche Marine"
 GER_strike_at_the_source_desc:0 "Прожити життя в страху — взагалі не жити. Ми мусимо раз і назавжди покласти край загрозі [GER.GetStrikeAtTheSourceDesc] у Європі."
 GER_synthetic_rubber:0 "Синтетичний каучук"
 GER_the_fate_of_iran_area:0 "Передати іранську адміністрацію Арабії"
 GER_the_fate_of_the_greek_area:0 "Передати грецьку адміністрацію райхскомісаріату Балкани"
 GER_the_fate_of_the_hungarian_area:0 "Передати угорську адміністрацію райхскомісаріату Балкани"
 GER_the_northern_shield_desc:0 "Скандинавські країни багаті на ресурси, однак попри зусилля щодо профспілок, пролетаріат там усе ще страждає від капіталістичних інтересів. Ми віримо, що робітники заслуговують на краще, і до того ж ми можемо ефективніше використовувати ці ресурси. Експлуатації скандинавських робітників настав кінець!"
 GER_the_proletarian_legion_tt:0 "Коли §Yбудь-яка країна§!, в якій §Y[ROOT.GetNameWithFlag]§! сприяв §Yвстановленню комунізму§!, вступить у §Yгромадянську війну§!:"
 GER_the_proud_eagle_and_the_resurgent_dragon_desc:0 "Загроза [JAP.GetAdjective]ого вторгнення до наших друзів із держави [CHI.GetNameDef] постійно нависає над нами. Немає сенсу сидіти склавши руки та чекати, поки вони нападуть. Ми мусимо підготуватися до війни проти воїнів держави [JAP.GetNameDef], на нашій чи на їхній території."
 GER_the_triumphant_will:0 "Тріумфальна воля"
 GER_todt_reich_engineer:0 "$GER_reich_engineer$"
 GER_total_control_over_domestic_affairs:0 "Повний контроль над внутрішніми справами"
 GER_trade_interdiction_desc:0 "Щоб обірвати лінії постачання ворога та послабити його військові зусилля, ми мусимо дотримуватися стратегії перехоплення торгівлі, спрямованої підірвати здатність ворога вести війну. Розгорнувши наш надводний і підводний флоти по всьому морі, ми запобігатимемо транспортуванню життєво важливих ресурсів і торгових суден, примушуючи наших ворогів до покори."
 GER_war_preparations_desc:0 "Щоби повністю підготувати націю до майбутньої війни, ми мусимо забезпечити підготовку не лише у Вермахті, але й у промисловості та інфраструктурі."
 GER_west_yenisei_rkm_effect_tt:0 "Кожна область у зоні інтересів Західного Єнісею перейде під контроль [RKM.GetNameDef]"
 GER_white_russian_exiles_divisions_recruitment_tt:0 "Отримати два козацькі підрозділи та один російський §Yпіхотний§! підрозділ"
 GHA_neutrality_ADJ:0 "Ґанськ"
 GIE_EXILE_ARMY_LEADER_LOCKED_EXILE_PLAYER:0 "Нам потрібно $VALUE|0H$ §Hлегітимності§!, щоби відкрити цього §Hкомандувача армією у вигнанні§!."
 GLC_fascism_ADJ:0 "Ґаллецьк"
 GLC_neutrality_ADJ:0 "Ґалісійськ"
 GNB_neutrality_DEF:0 "Конституційна держава Ґвінея-Біссау"
 GOE_IRQ_news.1.d:0 "Після років невдоволення [ENG.GetAdjective] адміністрацією та міграцією до регіону з часів Великої війни, арабське населення [PAL.GetName] вибухнуло повстанням. Учасники повстання вимагають виведення [ENG.GetAdjective] військ та повної незалежності для Палестини. Хоча [ENG.GetAdjective] навряд чи погодиться на такі вимоги, зрозуміло, що управління територією стане для них дедалі дорожчою справою."
 GOE_RAJ.33.b_tt:0 "Втрата контролю над Гуджаратом та Делі змусить до білого миру"
 GOE_RAJ.33.desc:0 "Група, що претендує на те, щоб бути законними спадкоємцями давно неіснуючої Імперії, оголосила війну за незалежність на далекому Північному Заході, згуртувавши незадоволені фракції під своїм прапором. Хоча більша частина Індії залишається під контролем, це повстання загрожує стабільності. Чи буде це виноскою в історії, чи поверненням імперії?"
 GOE_RAJ.4.t:0 "[FROM.GetName] вимагає підкорення"
 GOE_RAJ.40.desc:0 "Індійські сили перетнули спірну територію поблизу [986.GetName]. Сутички спалахують на пагорбах та рівнинах на північ від Делі. Вони стверджують, що земля належить революції за історичним правом. У радіопромові Прем'єр назвав Пакистан пережитком колоніального поділу. Напруга зростає, і сутичка здається неминучою."
 GOE_RAJ.46.c:0 "Ми вже на шляху до комунізму!"
 GOE_RAJ.46.desc:0 "Невдоволення переросло у відкритий бунт у сільській місцевості, оскільки комуністичні агітатори, які довго діяли в тіні, закликали народ до зброї. Села виступили проти своїх землевласників, і прапори із серпом і молотом майорять над ратушами.\n\nПовстання має ознаки того, що [FROM.GetName] використовує свої гасла та зброю.\n\n Розпочалася нова війна за серце та душу нашої нації."
 GOE_RAJ.50.desc:0 "Пакистанські війська зберігають контроль над [433.GetName]. Індійські сили відступили після важких боїв, і Пакистан продовжує утримувати регіон. Індійські радіопередачі цензурують цю невдачу, щоб уникнути національного збентеження."
 GOE_RAJ_eic.6.b:0 "Ніколи"
 GOE_RAJ_famine.12.t:0 "[FROM.GetName] надає невеликий пакет допомоги"
 GOE_RAJ_loyalist.06.t:0 "Командування Південно-Східної Азії"
 GOE_RAJ_loyalist.10.desc:0 "Чудова новина! [FROM.GetNameDefCap] погодилася дозволити нам розмістити війська на їхній території та працювати над захистом їхніх земель від іноземного вторгнення. Це надзвичайно допоможе нашим військовим зусиллям."
 GOE_RAJ_navy.1.t:0 "[RAJ.GetNameDefCap] пропонує військово-морську угоду"
 GOE_RAJ_partition.2.b:0 "Розосередити натовп."
 GOE_generic_events.4.desc:0 "Уряд [FROM.GetNameDef] скористався нещодавніми заворушеннями, щоб оголосити незалежність від нас. Наші збройні сили, хоча й оговтуються від зміни уряду, вважають, що все ще можливо відновити контроль над ситуацією та силою повернути [FROM.GetAdjective] територію під наш контроль."
 GRE_BEL_autonomy_eu_member_DEF:0 "Європейська Греція"
 GRE_GREATER_GREECE_fascism:0 "Елліністична імперія"
 GRE_civil_war_imminent_1_desc:0 "Напруження між республіканцями та монархістами досягнуло апогею. На жаль, нам не уникнути громадянської війни..."
 GRE_default_on_debt_effect_tt:0 "Такі відчайдушні заходи можуть мати §Yнебажані наслідки§!, не будуть обмежуватись розривом між нами та нашими кредиторами.\n"
 GRE_destroyer_3:0 "Клас «Adrias»"
 GRE_faction_hostile_effects:0 "\n§YЕфекти:§! §RСтабільність: -15%§!"
 GRE_fighter_equipment_1:0 "PZL P-24G"
 GRE_george_ii_restrained_desc:0 "Георг II — суперечливий король еллінів, що повернувся на трон в 1935 році за результатами фальшивого референдуму. Замість того щоби дати статусу одної людини знову розколоти грецьку націю, венізелісти дозволили Георгу II залишитися конституційним монархом за шведським зразком."
 GRE_hellenic_armed_forces_desc:0 "Наші збройні сили досить потужні, враховуючи поточну ситуацію в державі, але ми, як і раніше, слабші за всіх учасників Балканського пакту у військовому відношенні, і нас часто критикують за слабку модернізацію армії. Нам час поставитися до становища, що склалося, серйозно, тим більше що ситуація всередині країни погіршується..."
 GRE_hostile_republicans:0 "Ворожі £faction_gre_venezelist республіканці"
 GRE_improving_our_defensive_lines_desc:0 "Найкращий напад — це гарний захист, і ми маємо намір зробити його абсолютно непробивним"
 GRE_making_use_of_our_islands_cyprus_tt:0 "Ефект від цього фокусу посилюється, якщо також контролювати §YКіпр§!."
 GRE_markos_drakos:0 "Маркос Дракос"
 GRE_medium_tank_equipment_1_short:0 "Távros I"
 GRE_nenikikamen_desc:0 "[Root.GetNenikikamenDesc]"
 GRE_our_traditional_allies_in_the_aegean_desc:0 "Хто допоміг нам виграти війну з османами за незалежність у 1832 році? Велика Британія. Хто стільки років продовжував підтримувати нашу економіку на плаву позиками та інвестиціями? Велика Британія. З ким крокує Греція у нове майбутнє? З Британією!"
 GRE_paying_off_debt_small:0 "Малі виплати боргів"
 GRE_tac_bomber_equipment_3:0 "EAF Martin 187 Baltimore"
 GRE_the_anatolian_refugees:0 "Анатолійські біженці"
 GRE_theodoros_pangalos:0 "Теодорос Панґалос"
 GRE_venerate_the_ancient_hellenes_6:0 "$GRE_venerate_the_ancient_hellenes_spirit$"
 GRE_venerate_the_ancient_hellenes_6_desc:0 "Ми мусимо вчитися у воїнів Фів, що звільнилися від спартанської гегемонії, і у Аргеадів, які, почавши зі скромної Македонії, завоювали півсвіту."
 GRE_venerate_the_ancient_hellenes_8:0 "$GRE_venerate_the_ancient_hellenes_spirit$"
 GRN_democratic_ADJ:0 "Калааллітськ"
 GSM_autonomy_sea_warlord_subject_DEF:0 "Ґаньсуська кліка Ма"
 GUAY_demand_a_seat_at_the_high_table:0 "Вимогти місце за високим столом"
 GUAY_develop_new_territories_desc:0 "Найкращий спосіб згладити територіальні обміни — це забезпечити людям вищу якість життя, ніж та, яку вони мали раніше. Це буде наша політика."
 GUA_DEF:0 "Ґватемала"
 GUA_fascism_ADJ:0 "Ґватемальськ"
 GUA_jose_ezuira_abel:0 "Хосе Есуїра Абель"
