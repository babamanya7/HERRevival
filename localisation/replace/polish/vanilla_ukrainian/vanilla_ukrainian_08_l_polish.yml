 CZE_antonin_hampl:0 "Антонін Гампл"
 CZE_balance_industrial_invevestments_desc:0 "Залишення територій за межами [9.getname] та [75.getname] недостатньо розвиненими є однією з причин, чому наша країна почала розколюватися на початку десятиліття. Розвиток регіонів на периферії нашої країни допоміг би подолати розрив у промисловому розвитку між ними."
 CZE_bonus_research_slot_1:0 "Чеський технічний університет"
 CZE_bop_no_industrialists_with_space_tt:0 "$CZE_bop_ready_for_anything_tt$§Y$CZE_industrialists_veto$§!\n\n"
 CZE_build_additional_rail_stations_desc:0 "З нашою нещодавно розвиненою залізничною інфраструктурою деякі з наших існуючих залізничних станцій не можуть впоратися зі збільшенням пропускної здатності. Їхня модернізація значно покращила б нашу здатність доставляти людей і товари туди, куди їм потрібно, у більших обсягах."
 CZE_catholic_focus_desc:0 "Хоча гусити є відомою частиною [ROOT.GetAdjective]ої історії, багато хто все ще дотримується католицьких вірувань, до яких ми повинні апелювати, посиливши їхню роль у суспільстві."
 CZE_communist_support:0 "Комуністична підтримка"
 CZE_complete_the_power_grid_desc:0 "Енергомережа в наших сільських районах потребує подальшої роботи. Вона відстала від решти країни і є перешкодою для більшого економічного прогресу."
 CZE_create_a_secret_police_branch_desc:0 "Щоб забезпечити стабільність, ми повинні захищатися як від зовнішніх, так і від внутрішніх ворогів. Населенню знадобиться час, щоб звикнути до нової системи, особливо з огляду на те, що вона ще вдосконалюється."
 CZE_demanded_overlordship_HUN:0 "Підкорена Угорщина"
 CZE_diversify_bata:0 "Диверсифікувати компанію «Батя»"
 CZE_escalate_involvement_in_soviet_civil_war:0 "Посилити втручання в громадянську війну в СРСР"
 CZE_fall_of_the_republic_neutrality_DEF:0 "Чесько-словацька республіка"
 CZE_forgive_trading_debts_desc:0 "Економічна нестабільність та Велика депресія обтяжили деяких із наших потенційних союзників боргами перед нами, які вони насилу виплачують, що створює напругу у відносинах. Уряд міг би пробачити ці борги та виплатити компенсацію нашим вітчизняним компаніям, які постраждають від цього кроку."
 CZE_form_the_government_army_desc:0 "Якщо ми хочемо, щоб наша країна досягла успіху, нам потрібно сформувати нову армію, яка врахує помилки своєї попередниці. Ми також повинні переконатися, що її керівництво політично більш прихильне до уряду."
