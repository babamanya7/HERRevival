 nuke_dropped.4.b:0 "Our enemies have struck at the heart of the nation!"
 nuke_dropped.5.a:0 "It's difficult to maintain a stiff upper lip in the face of a nuclear blast wave."
 nuke_dropped.9.d:0 "A nuclear explosion struck the city of Rome today, shocking people around the world, in an unprecedented attack by [?global.nukecountry.GetNameDef]. Due to its historical and artistic treasures, many had never thought the ancient city would be the target of such indiscriminate destruction. With the Vatican City also partially destroyed and the whereabouts of the Pope unknown, the event has horrified not only Italians, but Catholics around the world.\n\nRome's rapid growth in the past decade has been nearly completely undone by the attack. For a while, it looked like the city could aid the nation's recovery after the war was over. Those hopes have now been turned to dust, along with many people."
 occupied_countries.1.desc:0 "Після довгих і завзятих зусиль з налагодження співпраці між нашими окупаційними військами та місцевою цивільною владою ми тепер готові повернути контроль над державою [From.From.GetNameDef] до рук місцевого уряду. Цей новий уряд складається з симпатиків нам громадян і готове діяти під нашим керуванням."
 occupy_libya_fra_desc:0 "Італійська колоніальна імперія мусить бути демонтована. Розпочніть наступ на італійську Лівію з нашого туніського протекторату й окупуйте середземноморське узбережжя. Життєво важливими цілями є стратегічні портові міста Тріполі та Бенгазі."
 oil_processing_desc:0 "Мережа заводів, що займаються синтетичним очищенням та переробкою нафтопродуктів, — наступний крок до забезпечення нашої держави пальним."
 on_standby:0 "Очікує наказів"
 one_germany_goal_desc:0 "Щоб створити міцну та єдину силову базу, ми повинні спочатку забезпечити, щоб Німеччина була сильною та об'єднаною. Паризькі мирні договори забороняли будь-яке возз'єднання німців. Настав час довести, що ми не зв'язані безглуздими договорами."
