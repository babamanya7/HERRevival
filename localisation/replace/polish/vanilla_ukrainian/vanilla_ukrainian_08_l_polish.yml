 TUR_absolutism_desc:0 "Не розглядайте ґрунт, на який ви ступаєте, як просто землю — упізнавайте її! Та подумайте про безсаванні тисячі, які так благородно лежать під вами. Ви славні сини мучеників — соромтеся, та не сумуйте за предками! Не покиньте, навіть коли вам обіцяні світи, цю небесну батьківщину."
 TUR_ataturk_health_worsening_crisis_desc:0 "Мустафа Кемаль Ататюрк старіє, і його напади хвороби будуть все сильнішими. Скільки ще залишилося до того, як Батько Турків захворіє настільки, що вже не зможе оговтатися?"
