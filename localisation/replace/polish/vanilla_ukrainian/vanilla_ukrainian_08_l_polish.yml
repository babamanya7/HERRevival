 DLC_DESCRIPTION_dlc046:0 "Graveyard of Empires представляє унікальні дерева фокусів для Ірану, Британської Індії, Іраку й Афганістану. Скоротіть вплив і втручання зовнішніх сил та відродіть занепалу гордість вашої нації, намагаючися запанувати над Близьким Сходом і Південною Азією."
