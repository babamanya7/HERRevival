 iceland_events.19.desc:0 "Підбурювачі з держави [FROM.GetNameDefCap] вирішили не ратифікувати договір, що дає нам незалежність. Натомість вони наполягають, що [ROOT.GetName] — частина держави [FROM.GetName], і погрожують відновити цю єдність насильно. Треба готуватися до прийдешньої бурі."
