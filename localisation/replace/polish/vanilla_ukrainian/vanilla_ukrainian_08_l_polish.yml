 GER_not_controls_iberian_coast_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]а маріонетка або член альянсу §Rне контролює повністю§ всі регіони вздовж §YАтлантичного узбережжя§! від §Y[792.GetName]§! до §Y[169.GetName]§!."
 GER_operation_panzerfaust_events.01.b:0 "Це перебільшення, Горті вірний!"
 GER_operation_panzerfaust_events.04.a:0 "Це зайшло надто далеко. Розпочати операцію «Маргарет»!"
 GER_operation_panzerfaust_events.10.desc:0 "Сьогодні німці ввели танки на Замкову гору й захопили Міклоша Горті. Подейкують, що вони також забрали його сина до Австрії. Вони передали повідомлення, що ми маємо здатися або вони змусить нас."
 GER_ostwall_desc:0 "Незважаючи на наш прогрес на східному напрямку, потрібно вжити заходів на випадок, якщо ситуація зміниться не на нашу користь. Слід звести оборонні рубежі «Пантера» та «Вотан» уздовж Дніпра, від Чорного моря до Балтійського."
 GER_ostwall_tt:0 "Під контролем члена нашого альянсу\n"
 GER_poland_friend_desc:0 "Хоча Польща втратила вихід до моря, ми довели свої добрі наміри, поступившися їй Словаччиною. Можливо тепер вдасться закріпити цю дружбу туманними обіцянками східних територій у майбутньому."
 GER_prepare_for_the_next_blockade:0 "Підготовка до наступної блокади"
 GER_prioritize_the_navy_desc:0 "Контроль над морями буде життєво важливим, якщо ми хочемо розширити свій вплив за межі нинішніх кордонів. Ми мусимо надати пріоритет військово-морським силам, щоби вони могли конкурувати з усяким ворожим флотом за розміром і потужністю."
