 usa.18.b_tt:0 "[Root.GetNameWithFlag] укладає мир із державою [being_attacked.GetNameWithFlag]"
 usa.23.a_tt:0 "[From.GetNameWithFlag] тепер може втручатися в американські війни."
 usa.40.desc:0 "Під час нещодавнього голосування сенатор несподівано поміняв сторони, щоби проголосувати за пропозицію уряду. Незважаючи на те, що сама проблема була досить незначною, публічне голосування на підтримку раніше відвертого критика лідера [USA.GetLeader] викликало здивування багатьох у Вашинґтоні.\n\nДеякі аналітики вважають, що цей приклад змусить інших сенаторів переглянути свою позицію."
 usa.5.a:0 "Їм же гірше."
 ven_claims_abc_islands:0 "§YВенесуела§! запропонувала «захистити» §YКюрасао§!.\n"
 vojvodina_fascism_ADJ:0 "Сремськ"
 volunteers_receiver_extended_desc:0 "Держава $COUNTRY2|Y$ відправила добровольців до держави $COUNTRY1|Y$."
 war_escalation_1_tt:0 "§HРівень 1§!\n Жодних ефектів"
 war_escalation_7_tt:0 "§HРівень 7§!\n §YЛіга Націй§!: Ефіопія може надіслати запит на міжнародне посередництво\n §YІталія§!: Італійська громадськість ставить під сумнів військові зусилля\n §YЕфіопія§!: Фокус §YМіжнародне посередництво§! відкритий"
 war_justification.209.d:0 "«Незважаючи на наші спроби знайти дипломатичне вирішення конфлікту з [ROOT.GetName], переговори вкотре провалилися, залишивши нас з обмеженими можливостями. Авторитарний режим [ROOT.GetLeader] продемонстрував нерозумний підхід до цього питання, типовий для лідерів, які не підзвітні своєму народу. Якщо політика [ROOT.GetAdjective]ого керівництва не зміниться, нам не залишиться нічого іншого, окрім як боротися».\n\n[From.GetAdjective]е втручання в наші внутрішні справи було гарячим питанням, і деякі політики з опозиції стверджують, що [From.GetRulingParty] від самого початку проводила яструбину політику. Якими б не були їхні початкові наміри, майбутня війна тепер раптом здається дуже реальною і неминучою."
 war_justification.215.t:0 "[From.GetLeader] хоче відновити лад у державі [ROOT.GetName]"
 war_justification.218.d:0 "«Немає сумнівів, що [ROOT.GetName] готується до війни. Зміни в економічній політиці дають зрозуміти, що [ROOT.GetAdjective]ий народ не є миролюбним, а скоріше чекає слушної нагоди, щоб завдати нам удару. Чи будемо ми стояти осторонь і спостерігати, як вони озброюються, поки [From.GetName] беззахисний? Чи ми обеззброїмо цю загрозу до того, як вона стане непідвладною нам?»\n\nЯструби в [From.GetRulingParty] звернули свої погляди в бік [ROOT.GetName], стверджуючи, що напад — найкращий захист. Їх точка зору набирає обертів, і [From.GetName] готується до війни."
 war_justification.3.d:0 "«Чи є більша загроза нашому способу життя, чи навіть самому способу життя, ніж комунізм? Ця чума, яка загрожує зробити рабів, а не господарів, правителями кожної нації, скасувати саму націю, скасувати людей та їхню історію. Ми візьмемо [From.GetName] і знищимо комуністичну чуму».\n\nНенависть глави держави, [ROOT.GetLeader], до комуністів була добре відома ще до приходу до влади [ROOT.GetRulingParty], але, схоже, останнім часом вона посилилася в конкретному випадку з урядом [From.GetAdjective]. З цього може початися наше прагнення стерти марксизм з лиця землі."
 war_justification.6.t:0 "[ROOT.GetLeader] закликає підтримати [From.GetAdjective]их робітників"
