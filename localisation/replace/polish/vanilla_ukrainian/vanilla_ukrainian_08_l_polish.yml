 CHI_three_princpals_idea:0 "Три народні принципи"
 CHI_tongzi_jun_desc:0 "Наш молодіжний корпус приведе націю до перемоги і далі в майбутнє."
 CHI_tour_the_south_desc:0 "Південь Китаю — це різноманітне та динамічне місце, часто вікно у світ. Це місце, де була створена наша партія, останнім часом здобуло більше автономії, і цю тенденцію нам потрібно змінити. Ми повинні відвідати ці провінції!"
 CHI_towards_a_popular_army:0 "До народної армії"
 CHI_tsr_adopt_the_twelve_symbols_desc:0 "Національна емблема «Дванадцять символів» була державною емблемою Китайської імперії, і так буде знову. Заснована на стародавніх символах Дванадцяти візерунків, своєю силою вона рознесе звістку про владу імператора по всій землі. Волею Лазурового дракона і Фенхуана воля Імператора буде виконана!"
 CHI_tsr_establish_the_tewu:0 "Створити Те'у"
 CHI_tsr_national_construction_desc:0 "Китай ніколи не зможе по-справжньому процвітати, якщо ми не побачимо нову хвилю промислового розширення. Без опори, яка б підтримувала її, ми ніколи не зможемо стати нацією, якою Китай призначений бути."
 CHI_unlock_faction_goal_south_subjugated_tt:0 "Якщо цей фокус поїздки буде обрано першим, то буде розблоковано ціль альянсу §Y$faction_goal_south_subjugated_name$§!."
 CHI_uplift_the_cavalry_regiments:0 "Підвищити кінні полки"
 CHI_uplift_the_cavalry_regiments_desc:0 "Наш регіон має давні та горді традиції верхової їзди та кінного спорту. Ми мусимо шанувати ці традиції та гарантувати, що наша кавалерія тішиться найвищою повагою і займає провідне місце в наших збройних силах."
 CHI_vice_premier_trait:0 "Віцепрем'єр"
 CHI_weaponise_the_hongmen_desc:0 "У наших портових регіонах є таємні товариства, вже навчені самообороні, які ми могли б нацькувати на нашого ворога. Дайте їм достатню підтримку, і вони можуть посіяти хаос серед будь-яких загарбників, які наважаться порушити наші землі."
 CHI_x_y_force_cat:0 "[ROOT.GetAdjective]і експедиційні сили"
