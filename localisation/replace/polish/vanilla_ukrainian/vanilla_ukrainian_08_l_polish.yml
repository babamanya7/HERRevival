 FIN_repurpose_small_industries_desc:0 "Хоча у нас немає колосальних галузей промисловості великих держав, у нас є безліч діючих менших заводів. Замість того, щоб починати з нуля, ми повинні перепрофілювати ці маленькі приміщення для військового виробництва."
 FIN_set_up_weapon_caches_in_state_desc:0 "У рамках секретної військової операції велика кількість [ROOT.GetAdjective]ої армійської зброї та обладнання буде заховано у сховках, розкиданих навколо [FROM.GetName], щоб елементи [ROOT.GetAdjective]ого опору могли продовжувати боротьбу проти загарбників."
