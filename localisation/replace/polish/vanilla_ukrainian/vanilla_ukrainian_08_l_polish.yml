 ITA_achille_starace:0 "Акілле Стараче"
 ITA_aid_for_the_spanish_republic_desc:0 "Ми мусимо допомогти нашим іспанським товаришам у громадянській війні. Їхню соціалістичну республіку беруть в облогу кровожерливі іспанські генерали, які присягнули на вірність державі, яку зараз руйнують, за підтримки великих фашистських держав Європи."
 ITA_alfredo_guzzoni:0 "Альфредо Ґуццоні"
 ITA_bop_military_parade_desc:0 "Настав час вшанувати наших звитяжних і доблесних солдатів і дозволити італійському народові обдарувати їх любов'ю."
