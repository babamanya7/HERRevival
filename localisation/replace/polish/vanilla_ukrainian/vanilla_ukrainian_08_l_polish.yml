 SHX_neutrality_DEF:0 "Шаньсійська кліка"
 SIA_achieve_foreign_legitimacy:0 "Досягти іноземної легітимності"
 SIA_allies_integration:0 "Інтеграція з Союзниками"
 SIA_ambassador_to_the_uk:0 "Посол у Великій Британії"
 SIA_appeal_to_navy_clique_countdown:0 "Впровадження військово-морських реформ"
 SIA_appeal_to_rural_people_tt:0 "Ми заручимося підтримкою селянства.\n\nВони допоможуть нам у громадянській війні, надавши ополчення. Однак вони очікуватимуть від нас вигідної сільськогосподарської політики взамін, шляхом виконання фокусу §Y$SIA_mechanization_of_agriculture$§! або §Y$SIA_reduction_of_agricultural_yield_taxes$§! протягом §Y720 днів§! після здобуття влади.\n\nНевиконання цього призведе до падіння §YСтабільності§! та §YПідтримки війни§!\n\nНа початку громадянської війни ми отримаємо: "
 SIA_cultivate_military_wing_desc:0 "Авторитет, який Директива Бюро Королівського Палацу забезпечила нам в істеблішменті, відкриває двері для терплячого, тривалого залицяння до військового крила. Тут немає різкого фаворитизму, здатного викликати протест, лише повільна, наполеглива робота із завоювання прихильності офіцерського корпусу, поступка за поступкою. Це довгий шлях, але ним можна йти так далеко, як нам заманеться."
 SIA_embed_technocrats_in_civilian_institutions_desc:0 "Ми можемо створювати альянси з технократами в уряді, використовуючи їх як продовження руки цивільного крила, щоб проникати глибше і протидіяти впливу військових."
 SIA_exclusivity_resource_contract_desc:0 "Єдиний іноземний партнер пропонує капітал та гарантовані закупівлі в обмін на привілейований доступ до наших ресурсів. Такий ексклюзивний контракт може прискорити розвиток, хоча він і прив'язує частину майбутнього [ROOT.GetNameDef] до апетитів іншої нації."
 SIA_expand_upon_the_dossier:0 "Розширення Досьє"
 SIA_how_quickly_the_tables_turn_desc:0 "Ті, хто колись ставився до [ROOT.GetNameDef] як до слабкої та покірної, можуть побачити, що баланс змінився на протилежний. Доля на війні змінюється швидко, і ми повинні бути готові схопити момент, коли наші гнобителі спіткнуться і ситуація нарешті обернеться проти них."
 SIA_khana_ratsadon_dummy_military_tt:0 "Військові влаштують переворот, якщо ми занадто їх роздратуємо. Щоб уникнути громадянської війни, ми не повинні утримувати §Y$idea_SIA_military_rebellious$§! занадто довго."
 SIA_light_tank_equipment_1_short:0 "Vickers 6-Ton"
 SIA_light_tank_equipment_2:0 "Type 95 Ha-Go"
 SIA_limited_war_indochina_desc:0 "Візьміть під контроль усі виділені регіони, щоб виграти §YОбмежену війну§! і заявити на них права без ескалації до повномасштабної війни.\n§RВтрата понад [?var:global.limited_war_surrender_threshold|%.0] прогресу капітуляції призведе до нашої поразки в обмеженій війні§!"
 SIA_national_savings_bond_desc:0 "Багатство нації не повинно лежати без діла у сейфах та прикрасах, поки дороги та фабрики залишаються незбудованими. Національна ощадна облігація перетворить приватну ощадливість на державні інвестиції."
 SIA_new_territories_administration_cat_desc:0 "Завоювання — це лише початок. Здобутими територіями необхідно керувати, розвивати їх та захищати, якщо вони мають стати невід'ємною частиною нації, а не тягарем, що провокує на відвоювання."
 SIA_new_territories_administration_tt:0 "Відкриває рішення для управління §Yіндокитайськими§! територіями, забезпечуючи підвищене підкорення, промисловість та укріплення."
 SIA_prepare_northern_infrastructure_for_war_desc:0 "Північні підступи стануть життєво важливими в будь-якому змаганні з Бірмою і тими, хто стоїть за нею. Дороги, залізниці та склади в цьому регіоні повинні бути розширені негайно, щоб сили [ROOT.GetAdjective] могли наступати або чинити там опір без затримок."
 SIA_propaganda_campaign_empty_slot_tt:0 "Цей слот для постера до фільму наразі §Gпорожній§!. Нова £SOV_propaganda_text_icon §YКінокампанія§! може бути §Gактивована§!."
 SIA_propaganda_campaign_locked_slot_tt:0 "Цей слот для пропагандистського постера наразі заблоковано. Його можна розблокувати, виконавши такий фокус: TODO"
 SIA_recognize_manchukuo_desc:0 "TODO_CM"
 SIA_recover_indochina_desc:0 "У минулому столітті наша країна була роздроблена [FRA.GetAdjective], урядом на іншому кінці світу, який не має права вказувати нам, що робити чи як жити, і все ж з канонерками та зброєю вони забрали те, що належало нам. У цьому столітті міць [FRA.GetAdjecive] згасає; це століття — наше."
 SIA_renowned_ambassador:0 "$BRA_renowned_ambassador$"
 SIA_restore_order:0 "Відновлення порядку"
 SIA_sala_chaloem_thai_movie_theater_desc:0 "Кіно — це нове середовище в нашій країні, але його потенціал очевидний для всіх. Так само, як і вірші, книги та радіо, воно може наповнити серця і уми простих людей та еліти. Використовуючи це середовище, ми можемо зміцнити рішучість громадян побачити, як піднімається велика [SIA.GetName]."
 SIA_sent_started_cooperative_with_us:0 "Почали співпрацю з розвитку разом з нами"
 SIA_ship_torpedo_sub_1:0 "4x 533-мм торпедний апарат"
 SIA_start_limited_war_indochina_tt_main:0 "Починає §YОбмежену війну§! проти §Y[FROM.GetName]§!.\nКонтролюючи всі виділені регіони, що належать §Y[FROM.GetName]§!, ми зможемо забрати ці регіони без ескалації до повномасштабної війни.\n§RВтрата понад [?var:global.limited_war_surrender_threshold|%.0] прогресу капітуляції призведе до нашої поразки в обмеженій війні§!\n\n§RПоразка в обмеженій війні може змусити нас повернути раніше завойовані території§!"
 SIA_sue_the_king_in_exile:0 "Подати до суду на короля у вигнанні"
 SIA_thai_rung_organization:0 "Thai Rung"
 SIA_the_army_of_siam:0 "Армія Сіаму"
 SIA_the_reflective:0 "Вдумливий"
 SIA_the_songsuradet_rebellion_alt_tt:0 "Генерала Праю Сонгсурадета звинуватять у змові проти держави.\n\nОднак, оскільки ми посилили його військову кліку, він може осміліти і відмовитися від виклику, що призведе до протистояння або потенційно до громадянської війни."
 SIA_to_lay_the_bait_tt:0 "Ми зіллємо сфабрикований економічний план, щоб налаштувати військових проти нас.\nЧим довше ми будемо відкладати §Y$SIA_and_spring_the_trap$§!, тим більшим буде опір проти військових і тим сильнішою стане наша підтримка.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nКожного разу, коли військові критикують фальшивий проект, наша підтримка в громадянській війні зростатиме, аж до максимуму у §Y75%§! підтримки в громадянській війні. Додаткові §Y25%§! підтримки в громадянській війні можна отримати з нашої загальної демократичної підтримки (масштабовано від §Y0%-100%§!)"
 SIC_autonomy_sea_warlord_subject_DEF:0 "Сичуаньська кліка"
 SIC_push_into_xikang_idea:0 "Відкинути тибетців"
 SIC_the_domain_of_liu_wenhui:0 "Володіння Лю Веньхуея"
 SIE_DEF:0 "Сьєрра-Леоне"
 SIE_communism_DEF:0 "Народна демократична республіка Сьєрра-Леоне"
 SIK_establish_the_xinjiangneft_desc:0 "[SOV.GetAdjective]е політбюро обговорило питання «сіньцзянської нафти» і прийняло резолюцію, яка закликає до підготовки розробки нафти біля [SOV.GetAdjective]ого кордону під фірмою нашого уряду. З цією метою має бути створена спільна сіньцзян-радянська компанія «Сіньцзяннафта» для допомоги у спільному видобутку природних ресурсів у регіоні."
