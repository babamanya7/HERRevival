 basic_light_battery_desc:0 "Відкрита поворотна платформа для гармат малого калібру, що встановлюються на невеликих кораблях.\n\nУстановка цього модуля посилює §Yобстріл з легких знарядь§!, що допомагає атакувати ворожі §Yкораблі прикриття§!."
