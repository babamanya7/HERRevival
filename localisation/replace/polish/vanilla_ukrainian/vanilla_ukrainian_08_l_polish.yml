 ITA_rino_corso_fougier:0 "Ріно Корсо Фуж'єр"
 ITA_slovenia_dalmatia_claims_desc:0 "У Югославії досі проживає значна кількість італійського населення, принаймні з часів слави Венеції. Повернення цих регіонів під італійське панування — важливий крок на шляху до відтворення Римської імперії!"
 ITA_submarine_1_desc:0 "Клас «Geoffredo Mameli» — це клас середніх підводних човнів Regia Marina, спущених на воду між 1926 і 1928 роками. Вони мали водотоннажність трохи менше 800 тонн і глибину занурення 100 метрів. Вони стали основою для наступних моделей, таких як «Pisani», «Bandiera» та «Squalo»."
