 PER_modernizing_iran_idea:0 "Ініціатива модернізації"
 PER_motorization_investments_idea_desc:0 "Інвестиції, які ми вклали в розвиток нашого моторного озброєння, окупляться, коли наші війська будуть швидко та точно пересуватися полями бою."
 PER_own_plane_designs:0 "Розробити власні конструкції"
 PER_pashtuns_in_pakistan:0 "Сприяти пуштунському опору в [FROM.GetName]"
 PER_plant_resistance_cells_desc:0 "Щоб підготуватися до нашого превентивного удару, було б розумно викликати політичні заворушення в наших сусідніх регіонах. [IRQ.GetNameDef] здається чудовим вибором, як і окуповані регіони [AZR.GetNameDef], [GEO.GetNameDef], [ARM.GetNameDef], [TMS.GetNameDef]."
 PER_promote_resistance_levant:0 "Антиімперіалістичний опір"
 PER_savior_of_iran:0 "Спаситель [PER.GetNameDefCap]"
 PER_soviet_iranian_oil_collaboration_desc:0 "[ROOT.GetNameDefCap] та наші друзі за кордоном у [SOU.GetNameDef] мають великі запаси нафти в нашому розпорядженні. Координуючи та розширюючи наш видобуток нафти, ми можемо закріпити наш контроль над найважливішим ресурсом світу."
 PER_ssb_events.2.desc:0 "Зустріч завершилася, і [FROM.GetLeader] чітко дав зрозуміти, що офіційний альянс між членами Саадабадського пакту є надзвичайно важливим для виживання наших націй, і погодився приєднатися до альянсу."
 PER_stage_mass_protests_tt:0 "Відмикає рішення §Y$PER_mass_protests$§! для зниження підтримки шаха."
 PER_strengthen_the_tudeh:0 "Зміцнити Партію Туде"
 PER_the_new_economy_idea_desc:0 "Наша нова економіка побудована на потребах нашого населення, а не на ринкових тенденціях. Зрештою, ми хочемо уникнути шкоди, яку капіталізм завдав нашому робітничому класу."
 PER_war_plan_cambyses_idea_desc:0 "Камбіс II був другим царем царів Ахеменідської імперії. Він правив з 530 року до н.е., і його правління відзначилося завоюваннями в Північній Африці, зокрема в Єгипті, де він став фараоном. Слідуючи його стопами, ми повинні вирушити на захід і спробувати повернути його колишні території."
 PER_war_plan_xerxes:0 "Військовий план «Ксеркс»"
 PHASE_START:0 "Починається: $NAME$"
 PHI_asian_trade_connections_dynamic_modifier_desc:0 "Торгівля була наріжним каменем філіппінської економіки протягом століть, і ми не повинні соромитися пожинати її плоди."
 PHI_asian_trade_connections_dynamic_modifier_tt:0 "[GetAsianTradePartnersSiam] \n[GetAsianTradePartnersMalaya] \n[GetAsianTradePartnersDutchEastIndia]"
 PHI_bell_trade_act_desc:0 "Також відомий як Закон про торгівлю з Філіппінами, цей акт регулює торгівлю між [PHI.GetName] та [USA.GetName]. Він включає пакет фінансових інвестицій, преференційні торговельні та тарифні угоди. Він також передбачає значний доступ корпорацій США до філіппінських ресурсів, що викликає певні занепокоєння, проте інші переваги були визнані такими, що варті ризику."
 PHI_bill_of_rights_for_veterans_desc:0 "Багато філіппінців брали участь у війні, і ми повинні гарантувати, що про тих, хто повертається додому, належним чином подбають. Якщо ми піклуватимемося про наших ветеранів, ми зможемо забезпечити хороший притік нових кадрів у майбутньому, оскільки люди побачать, що армія є надійним вибором для кар'єри."
 PHI_bourbon_party_long:0 "Королівський дім Бурбонів"
 PHI_break_chinese_monopoly_desc:0 "Китайські торговці знайшли своє місце в нашому суспільстві як власники крамниць і банків, однак, оскільки такий контроль над критично важливими послугами утримується іноземцями, задля нашої власної безпеки ми повинні забезпечити більш справедливий розподіл мереж збуту."
 PHI_convoys_for_light_tanks:0 "Звернутися до [FROM.GetNameDef] з пропозицією обміняти наші конвої на списані легкі танки"
