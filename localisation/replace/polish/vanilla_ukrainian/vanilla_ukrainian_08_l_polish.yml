 JAP_dadaist_nihilist:0 "Дадаїст-нігіліст"
 JAP_democratic_war_with_china_desc:0 "Люди в Міжнародному сетлменті Шанхаю зараз перебувають під загрозою з боку корумпованого китайського режиму та його поплічників. Ми повинні втрутитися і врятувати їх, щоб не допустити непотрібного пролиття крові!"
 JAP_democratic_war_with_manchukuo_desc:0 "Квантунська армія розірвала з нами зв'язки після громадянської війни і взяла під контроль Маньчжурію. Люди там досі живуть під авторитарним гнітом, як колись ми, і потребують порятунку. Настав час завершити те, що ми почали."
