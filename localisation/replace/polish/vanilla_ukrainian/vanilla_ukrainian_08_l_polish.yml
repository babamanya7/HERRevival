 USA_battleship_4:0 "Клас «Illinois»"
 USA_heavy_tank_artillery_equipment_3_short:0 "T92 HMC"
 USA_homeland_defense_desc:0 "Ворог ступив на землю нашої гордої нації. Американський народ повстане і виштовхне загарбників назад у море!"
 USA_infantry_equipment_0:0 "M1903 Springfield"
 USA_infantry_equipment_1_short:0 "M1 Garand"
 USA_intervention_in_the_americas_desc:0 "Перш за все ми мусимо переконатися в тому, що готові до виникнення будь-якої ситуації в нашій півкулі."
 USA_marc_mitscher:0 "Марк Мітшер"
 USA_militia_organization_act_desc:0 "Громадяни нашої гордої республіки здавна захищають її зі зброєю в руках. Якщо в наші землі коли-небудь вторгнеться іноземний агресор, йому дасть відсіч добре організоване народне ополчення, складене з жителів, що борються за рідний край."
 USA_mio_trait_gould_centrifugal_pump:0 "Відцентровий насос Ґулда"
 USA_mio_trait_outsourced_engines:0 "Двигуни від сторонніх постачальників"
 USA_national_prosperity_program_desc:0 "Запорукою швидкого відновлення та довгострокового процвітання країни є не безконтрольна ринкова економіка, а ретельно продумані програми, що поєднують приватні та державні підприємства."
 USA_norfolk_naval_yard_organization:0 "$norfolk_naval_yard$"
 USA_nuclear_missile_equipment_2:0 "Atlas (SM-65/CGM-16)"
 USA_recruit_the_free_corps_desc:0 "Армія викликає все більше підозр, тому ми мусимо звернутися за допомогою до героїв світової війни. У ту нелегку для країни годину німецький добровольчий корпус врятував Німецьку республіку. Нам потрібна схожа організація, яка підтримає нас у скрутну хвилину."
 USA_seize_cuba_desc:0 "Прямо біля наших берегів знаходиться непотоплюваний авіаносець, готовий стати військовий базою для будь-якого агресора. Ми мусимо не цього допустити."
 USA_selective_training_act_desc:0 "Сполучені Штати завжди, навіть у воєнний час, проводили заклик не поспішаючи. Ми більше не можемо дозволити собі цю розкіш."
 USA_send_lindbergh_to_germany_desc:0 "Знаменитий льотчик запропонував вирушити до Європи і дізнатися, наскільки успішно Німеччина відновилася після попередньої війни. Це дозволить нам отримати дуже цінні відомості. Ліндберґ також зазначив, що готовий співпрацювати з нашим урядом як консультант."
 USA_tank_experiments_desc:0 "Танки незамінні на сучасних полях битв. Ми мусимо знайти їм найкраще застосування."
 USA_women_in_the_workforce_desc:0 "Чи можете Ви використовувати електричний міксер? Якщо так, Ви й із дрилем навчитеся працювати. Протягом війни понад шість мільйонів американських жінок працювали на фабриках, будівництві та іншій фізичній праці й назавжди довели, що жінки можуть виконувати роботу так само добре, як і чоловіки."
