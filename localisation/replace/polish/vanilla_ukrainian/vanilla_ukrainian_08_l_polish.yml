 ETH_exploit_french_weakness_desc:0 "Поки [FRA.GetAdjective]а влада стурбована сварками навколо попелу своєї імперії, ми маємо можливість приєднати територію Французького Сомалі до нашої великої імперії. Навряд чи французи мають сильне бажання провести ще один бій, але ми повинні бути готові до всього."
