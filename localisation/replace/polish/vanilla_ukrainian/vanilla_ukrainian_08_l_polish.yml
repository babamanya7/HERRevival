 ICE_incite_communist_uprising_wales_desc:0 "З невеликим поштовхом ми зможемо змусити валлійських робітників повстати в [122.GetCapitalVictoryPointName] і проголосити свою незалежність від уряду в м. [122.owner.capital.GetCapitalVictoryPointName]."
