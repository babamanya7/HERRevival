 NSB_soviet_foreign_politics_events.268.t:0 "[ROOT.GetAdjectiveCap]о-[FROM.GetAdjective]ий пакт проти держави [USA.GetNameDef]"
 NSB_soviet_foreign_politics_events.276.desc:0 "Нашим дипломатам було представлено нову [FROM.GetAdjective] пропозицію. Схоже, що [FROM.GetNameDefCap] дуже цікавиться новими покладами нафти та корисних копалин на півночі нашої країни. Нам пропонують провести в регіоні в обмін на видобуток ресурсів.\"[FROM.GetAdjectiveCap]ий представники стверджують, що цей хід допоможе нам краще використовувати свої поклади золота та срібла."
 NSB_soviet_foreign_politics_events.284.t:0 "[FROM.GetNameDefCap] відхиляє наші вимоги"
 NSB_soviet_foreign_politics_events.31.t:0 "Аляску повернуто"
 NSB_soviet_paranoia_system_events.22.b:0 "Де, як не в академії, цікавитися новим? Ми не мусимо цьому заважати."
 NSB_soviet_paranoia_system_events.29.a:0 "Усі зрадники мусять заплатити по повній."
 NSB_soviet_planned_economy.1.t:0 "[SOV.GetAdjective] програма планової економіки"
 NSB_soviet_policies_of_collective_security.10.a:0 "Принаймні, ми їм запропонували."
 NSB_soviet_policies_of_collective_security.5.b:0 "Отже, договору не бувати."
 NSB_soviet_policies_of_collective_security.8.a:0 "Яка недоречна лояльність."
 NSB_soviet_propaganda_capmaign_events.2.desc:0 "Наше рішення заздалегідь подбати про свою безпеку поставило нас у незручне становище щодо наших же недавніх заяв. Більшість не ставить запитань, але з органів доповідають, що багато хто потай дивується, чому ми обіцяли мир, тоді як самі явно готуємося до війни. Ніхто не сміє відкрито звинувачувати нас у брехні, але ясно, що неабияку частку довіри серед населення ми втратили."
