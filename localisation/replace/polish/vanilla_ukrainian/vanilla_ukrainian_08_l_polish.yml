 BEL_infantry_equipment_0_short:0 "Mauser M89"
 BEL_inflation_controls_ns_desc:0 "З метою зменшення наслідків інфляції ми почали скуповувати гроші і не випускати нові банкноти для пошкодженої валюти, змінювати відсоткові ставки та заохочувати витрати в економіці."
