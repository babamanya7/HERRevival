 generic_purchase_ships_events.02.desc:0 "[FROM.GetAdjectiveCap]і дипломати та військово-морський персонал повідомили нам, що вони готові розлучитися зі своїм законсервованим обладнанням, яке ми пропонували придбати. Це дозволить нам швидко розширити наш молодий флот."
