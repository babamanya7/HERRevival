 IRQ_anti_western_alliance_desc:0 "Якби домінуючі сили регіону об'єднали свою військову міць та взяли на себе зобов'язання захищати одне одного, у нас був би реальний шанс нарешті протистояти західним державам, які так часто втручаються в наші справи."
