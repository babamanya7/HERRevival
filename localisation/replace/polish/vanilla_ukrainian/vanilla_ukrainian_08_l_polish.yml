 GER_core_alto_adige_tt:0 "Якщо [ROOT.GetnameDef] §Yне в фракції§! з [ITA.GetNameDef] і §Yповністю контролює§! [39.GetName]:"
 GER_danzig_or_war_POL_civil_war:0 "Данциґ в обмін на підтримку"
 GER_demand_sudetenland_desc:0 "Версальський договір допустив найбільшу несправедливість щодо судетських німців. Вони мусять бути передані під наш захист, незважаючи на всі протести чехів."
 GER_democratic_shield:0 "Демократичний щит"
 GER_dive_bombers_desc:0 "$GER_tactical_air_effort_desc$"
 GER_division_danmark_armored_tt:0 "§YТанкова§! частина §YSS-Panzerdivision Danmark§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_dp_ship_secondaries:0 "12.7cm/45 SK C/41 DP"
 GER_fortify_the_vaterland_desc:0 "Щоби захистити державу [GER.GetNameDef], ми мусимо побудувати укріплення скрізь, де це необхідно. Зміцнення нашої оборони дозволить нам утримувати кордони з меншою кількістю людей, звільнивши дивізії для участі в абияких можливих наступальних операціях деінде."
 GER_franz_halder:0 "Франц Гальдер"
 GER_freikrops_militia_recruitment_tt:0 "Отримаєте п’ять §Yвійськових загонів фрайкору§!"
 GER_generalgouvernement:0 "Заснувати Генерал-губернаторство"
 GER_german_hegemony_in_the_middle_east:0 "Німецька гегемонія на Близькому Сході"
 GER_goebbels_fuhrer:0 "$GER_der_fuhrer$"
 GER_goebbels_reich_minister_of_propaganda_master_no_lar:0 "$GER_goebbels_reich_minister_of_propaganda$"
 GER_gotthard_heinrici:0 "Ґоттгард Гайнріці"
 GER_gunther_prien:0 "Гюнтер Прін"
 GER_heavy_tank_equipment_2_desc:0 "Tiger I був німецьким важким танком, розробленим у 1942 році як відповідь на несподівано вражаючу радянську броню, яку зустріли в перші місяці вторгнення країн Осі в Радянський Союз, зокрема Т-34 і КВ-1."
 GER_hess_party_chancellor_improved:0 "$GER_hess_party_chancellor$"
 GER_himmler_director_reich_security:0 "$GER_director_reich_security$"
 GER_himmler_fuhrer_ss:0 "$GER_der_fuhrer$"
 GER_industrial_investments_desc:0 "[CHI.GetNameDefCap] дуже відстає в індустріалізації. Ми маємо відправити інженерів та інвестувати в [CHI.GetAdjective]і корпорації, щоби допомогти їм у їхньому розвитку."
 GER_industrial_relocation_resources_modify_tt:0 "Модифікує §YПереміщення Промисловості§!:"
 GER_inner_circle.01.c:0 "Замінити [GetAscendedAdvisorName3]"
 GER_inner_circle.02.desc:0 "Рейхсляйтери, найближчі до [GER.GetLeader], почали сумніватися у [GER.GetLeader.GetHersHis] лідерстві та баченні майбутнього [GER.GetNameDef]. Вони тепер планують усунути [GER.GetLeader] від влади та захопити титул фюрера. Питання в тому, хто підніметься над іншими й поведе націю до славного майбутнього?"
 GER_inner_circle.03.t:0 "Промисловий план [GetIntrigueCharacterName] під сумнівом"
 GER_inner_circle_himmler.00.t:0 "Обов'язки Гіммлера"
 GER_inner_circle_industrial_reichsleiter:0 "[GetIndustrialReichsleiterNames]"
 GER_inner_circle_industrial_reichsleiter_no_goring:0 "$GER_fritz_todt$ та $GER_albert_speer$"
 GER_invade_italy_desc:0 "Хоча на перший погляд [ITA.GetNameDef] може здатися нам хорошим імовірним союзником, ми знаємо їхнє справжнє обличчя. На початку Великої війни вони відмовилися воювати пліч-о-пліч із нами, а в 1915 році навіть обернулися проти нас, незважаючи на наш попередній альянс. Тоді ми засвоїли наш урок, і помилка довіри до них більше не повториться."
 GER_japan_friend_tt:0 "Фон Фалькенгаузена буде відкликано з Китаю.\n"
