 INS_prime_minister_tt:0 "Відбулися перші загальні вибори в Індонезії"
 INS_privately_owned_military_industry_desc:0 "Ми створимо кілька тіньових корпорацій у військово-промисловому секторі, що гарантуватиме нам збереження контролю над військовою промисловістю після початку революції."
