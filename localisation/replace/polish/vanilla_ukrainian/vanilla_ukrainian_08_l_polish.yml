 AAT_Sweden_BoP.11.t:0 "Передвиборча кампанія — Соціальна політика"
 AAT_Sweden_ball_bearing.1.b:0 "Нам потрібна їхня військова експертиза."
 AAT_Sweden_communism.7.a:0 "Кілбом поведе нас у світле майбутнє"
 AAT_Sweden_flashpoints.20.t:0 "[SWE.GetName] пропонує анти-[SOV.GetAdjective]ий альянс"
 AAT_Sweden_flashpoints.33.b:0 "[GER.GetLeader] нас не скорить. Розпочинайте мобілізацію військ."
 AAT_Sweden_flashpoints.34.t:0 "[SWE.GetName] підіймає військову готовність"
 AAT_Sweden_flashpoints.54.a:0 "Ми ледве уникнули катастрофи."
 AAT_Sweden_flashpoints.60.t:0 "[SWE.GetName] захоплює Landsverk"
 AAT_Sweden_flashpoints.78.b:0 "То є вірний шлях."
 AAT_Sweden_nationalists.19.t:0 "Фіка з королем"
 AAT_Sweden_nationalists.24.t:0 "[FROM.GetName] приймає нашу пропозицію"
 AAT_Sweden_nationalists.26.desc:0 "Рано вранці ми втратили зв'язок з нашими посланцями у державі [FROM.GetName], а кілька караульних бригад, які були — всі здалися. Телефонуючи до уряду злощасної [SWE.GetAdjective]ої країни за поясненнями, ми зустріли мовчання, тож очевидно, що наша непокірна маріонетка має більш грандіозні плани, в які ми не входимо."
 AAT_finland_continuation_war.07.a:0 "Як ми і боялися..."
 AAT_finland_diplomacy.15.desc:0 "[FROM.GetAdjective]ий уряд погодився на інтеграцію до складу нашої держави і почав змінювати свої закони так, щоб вони застосовувалися до автономного регіону, а не до незалежної країни."
 AAT_finland_diplomacy.27.a:0 "Ми будемо битися разом!"
 AAT_finland_misc_events.03.b:0 "Ні, ми не хочемо звітувати перед іншими."
 AAT_finland_misc_events.04.d:0 "Дати право на геологорозвідку в області [148.GetName]."
 AAT_finland_political.09.a:0 "[ROOT.GetAdjective]ий народ дякує вам за службу, маршале бароне Маннергейме!"
 AAT_finland_the_white_death.7.a:0 "Погана справа..."
 AAT_finland_winter_war.04.a:0 "Нехай вони нас більше не спокушають."
 AAT_nordic_cooperation.9.t:0 "Керівництво держави [FROM.GetName] відхилило нашу пропозицію!"
 AAT_norway.11.desc:0 "Після століть поневолення іншими скандинавськими державами, а потім залишення на милість капіталістичних промисловців, [ROOT.GetAdjective]ий народ вчиться виступати разом проти своїх гнобителів і відкидати їхню гегемонію.\n\nТепер [ROOT.GetAdjective]ий народ шукає натхнення для своєї революції!"
 AAT_norway.8.t:0 "[get_trotsky_lastname] прибуває до Москви"
 AAT_norway_monarchist.1.a:0 "Чого він хоче досягти?"
 ABDA_corps_expeditionnaire_spirit:0 "Експедиційний корпус"
 ABDA_maintain_strategic_flexibility_desc:0 "Сполучені Штати не повинні надмірно залучати свої сили до жодного з театрів воєнних дій. Ретельно керуючи нашим стратегічним резервом, ми гарантуємо, що американська промислова та військова міць може бути спрямована туди, де вона найбільше потрібна по всьому Тихому океану."
 ABDA_ship_a_day_sinking_quotas_desc:0 "Ворожі лінії постачання, що простягаються через Тихий океан, є їхнім стратегічним вразливим місцем. Встановивши агресивні та скоординовані квоти на затоплення для наших підводних і надводних сил, ABDACOM зможе логістично виснажити ворога і змусити його перейти до оборони."
 ACCLIMATIZATION_CONDITIONS_HEADER:0 "Умови отримання:"
 ACHIEVEMENTS_DISABLED_WRONG_PLAYER:0 "§YУ цій грі треба грати за державу $COUNTRY$. Досягнення вимкнені.§!"
