 ASSIGN_SUBDOCTRINE_AFTER_GRAND_DOCTRINE:0 "Підтвердьте вибір глобальної доктрини, перш ніж призначати §Hпіддоктрину§!."
 AST_BLITZKRIEG_TAOG_DESC:0 "Зі сну виринають землекопи, протираючи очі, прокидаючись від сонливості, і прокидаються їхні духи АНЗАК. Коли австралійці одягають форму та знову прощаються з батьківщиною, перспектива війни висить у повітрі, як стартова гармата, що чекає на постріл.\n\nЧи буде достатньо військових інвестицій останніх років, щоб відбити як європейські, так і азійські загрози, і чи зможе Британія виконати свої обіцянки Австралії, розтягнувшись по всьому світу? Залишається багато питань, але на одне завжди є відповідь: коли мають відбутися битви, Австралія буде поруч, щоб боротися в них."
 AST_a_deal_with_japan:0 "Угода з Японією"
 AST_adopt_westminster_desc:0 "Ми мусимо прийняти Вестмінстерський статут, що дістався нам у спадок від Великої Британії."
 AST_allied_after_all_desc:0 "Хоча незалежність Австралії була необхідністю, вся співпраця з нашою старою метрополією не припиниться. Ми залишатимемося лояльними до альянсу [ENG.GetFactionName], як і завжди, але прагнутимемо до більшого впливу всередині нього."
 AST_allied_works_council_desc:0 "Всі питання військового будівництва в Австралії займатиметься Союзницькою промисловою радою. Єдиний центр планування допоможе уряду досягти необхідного рівня ефективності."
 AST_anti_air_equipment_3:0 "QF 3.7-inch"
 AST_australia_first_party_req_tt:0 "§YПартія «Австралія понад усе»§! заснована."
