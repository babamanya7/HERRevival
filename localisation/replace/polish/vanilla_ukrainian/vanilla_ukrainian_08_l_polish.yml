 ALL_TASK_FORCES_REPAIR_NOW_DISABLED:0 "Якщо ваші оперативні групи пошкоджено і поблизу ваших морських баз, ви можете відправити їх на базу приписки на ромент."
 AOI_communism:0 "Східноафриканська комуна"
 ARG_agricultural_improvements_desc:0 "Фермерство було невід'ємною частиною розвитку [ARG.GetName] протягом багатьох років, і багато людей покладаються на цей спосіб життя, щоб заробляти на життя. Це чудова можливість покращити частину сільськогосподарської інфраструктури в наших сільських громадах."
 ARG_arsenales_de_marina_organization:0 "Arsenales de Marina"
 ARG_battleship_1:0 "Клас «Rivadavia»"
 ARG_british_gaurantee_desc:0 "Історично ми мали тісні зв'язки з Британією, і вони багато інвестували в нашу країну. Ми повинні прагнути відновити ці зв'язки та зміцнити їх, це може виявитися дуже вигідним для нас!"
 ARG_centralize_power:0 "Централізувати владу"
 ARG_chilean_ultimatum.tt:0 "([CHL.GetFlag]§Y[CHL.GetNameDefCap]§!) отримує подію «§Y$ARG_political_events.19.t$§!», яка вимагатиме, щоб вони стали нашою §Yмаріонеткою§!. Вони, ймовірно, погодяться, якщо мають §Gвисоку думку про нас§!."
 ARG_consolidating_power_tt:0 "§RЦе розгніває армію та скоротить час до здійснення спроби державного перевороту.§!"
 ARG_demand_spanish_compensation_tt:0 "Надіслати подію до §Y[SPA.GetNameDef]§!, вимагаючи, щоб вони віддали нам §YЕкваторіальну Гвінею§!. Вони, ймовірно, погодяться, якщо мають §GВисоку§! думку про нас!"
