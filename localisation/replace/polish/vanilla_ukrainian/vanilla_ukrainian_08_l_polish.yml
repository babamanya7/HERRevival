 CHI_modify_decisive_battle_idea_tt:0 "Змінює §Y$CHI_decisive_battle_idea$§!:"
 CHI_one_nation_undivided:0 "Одна нація, неподільна"
 CHI_organise_the_200th_division:0 "Організувати 200-ту дивізію"
 CHI_organise_the_200th_division_desc:0 "Бронетанкові війська — це найбільша інновація у військовій справі цього століття, і, на жаль, ми відстали. Створення бронетанкової дивізії та призначення відповідного командира, який очолить атаку, стало б помножувачем сили, що прокладе шлях до перемоги."
 CHI_postpone_the_tutelage_desc:0 "Хоча метою залишається демократія, зараз не час, і нинішня криза вимагає особливих заходів. Ми повинні провести націю через небезпеку, перш ніж демократія зможе розквітнути."
 CHI_postpone_the_tutelage_tt:0 "Розблоковує рішення для §Yперевиховання§! певних §Yгенералів-мілітаристів§!, як тільки кліки будуть завойовані"
 CHI_reshuffle_the_green_gang:0 "Перетасувати Зелену банду"
 CHI_rural_militias_desc:0 "Наші землі великі; відправлені для оборони кордонів війська можуть бути в дорозі тривалий час. Сформувавши місцеве ополчення, ми забезпечимо будь-якому загарбнику серйозні проблеми на шляху нашими землями."
