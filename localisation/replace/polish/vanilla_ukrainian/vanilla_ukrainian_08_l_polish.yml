 ENG_regnalname_elizabeth:0 "Єлизавет"
 ENG_replace_government_in_canada_fascism_desc:0 "Народ Канади готовий змінити уряд на... більш прихильне до нашого фашистського правління."
 ENG_replace_government_in_south_africa_communism:0 "Установити комуністичний уряд у Південній Африці"
 ENG_secure_the_imperial_shipping_routes:0 "Убезпека імперських торгових маршрутів"
 ENG_steady_as_she_goes_desc:0 "Наростаюча криза — це саме та причина, чому ми мусимо залишатися вірними своєму корінню. Ми продовжимо курс, яким пливли останніми роками, а не робитимемо різких політичних змін, які можуть спричинити внутрішню нестабільність, коли ми найменше можемо собі це дозволити."
