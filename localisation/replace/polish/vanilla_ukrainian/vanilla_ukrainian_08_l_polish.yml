 denmark_protection_event.131.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], приймає наше запрошення вступити до альянсу і запевняє нас у готовності прийти на допомогу в годину потреби, якщо ми візьмемо на себе взаємні зобов'язання."
 denmark_protection_event.3.desc:0 "Наш посланник у державу [FROM.GetNameDef] повернувся з поганими новинами! [FROM.GetAdjective]ий уряд вирішив, що пакт про ненапад зараз не в його інтересах. Прикро, але переконати їх ми зараз не можемо."
 denmark_protection_event.8.desc:0 "Сьогодні вранці ми отримали повідомлення з держави [FROM.GetNameDef]: вони готові прийняти нашу пропозицію про дослідницьку угоду. Це чудові новини, наш технологічний прогрес тепер прискориться."
 denmark_resistance_event.7.desc:0 "[DEN.GetNameDefCap] оголошує про свою незалежність від гнобителів. Кажуть, що [?DEN.DEN_overlord_nation.GetAdjective]ий лідер [?DEN.DEN_overlord_nation.GetLeader] у нестямі від люті. Данці тепер просять нас виконати умови угоди і пустити їх у наш альянс."
