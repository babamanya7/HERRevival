 request_control_of_navy_desc:0 "Наш альянс стане набагато ефективнішим після інтеграції в наш флот [From.GetAdjective] флоту."
 request_restoration_of_british_titles_desc:0 "У 1917 році британський парламент проголосував за позбавлення всіх британських перів і королівських титулів у німецьких королівських і княжих родин. Тепер, коли ми є союзниками і маємо чудові стосунки, можливо, настав час вимогти скасування цього рішення."
 rescue_mussolini_infiltration:0 "Посадити планери поруч із в'язницею"
