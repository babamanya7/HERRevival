 NAVAL_MISSION_NAME_HOLD_DESC:0 "§GКлац§! або £h£\nСкасувати поточне завдання та почати рух до найближчого порту.\n\n§GCtrl + клац§! або £ctrl£ +£h£\nСкасувати поточне завдання та лишитися на місці.\n--------------\nОсновні кораблі без наказів, розміщені неподалік від місця наземної битви зможуть допомогти шляхом §Hобстрілу узбережжя§!.\nАвіаносці без наказів у відкритому морі зможуть використовувати розміщені авіакрила для проведення повітряних операцій."
