 UNITS_HAS_INVALID_MOVE_WARNING:0 "§RНе вдається пройти до наступної цільової провінції.§!"
 UNITS_VIEW_BTN_EXECUTE_TOOLTIP:0 "§GКлацніть§!, щоби $ACTION$ виконання §Yвсього плану§!.\n§GShift + клацніть§!, а потім §Yклацніть на бажаний наказ§!, щоби почати/зупинити його виконання.\n§GCtrl + клацніть§!, щоби почати/зупинити виконання для всіх прикріплених дивізій і армій."
 UNIT_EXILED:0 "Ця військова частина знаходиться у вигнанні. Їй потрібно повернутися на нашу територію."
 URG_brou_desc:0 "Банк Східної республіки Уругвай має отримати додаткові повноваження та створити валютний фонд для ліквідації нашого зовнішнього боргу."
