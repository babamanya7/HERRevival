 JAP_the_war_has_not_necessarily_developed_focus_desc:0 "Оскільки суперництво між армією та флотом все ще залишається скалкою в нашому боці, а наша стратегія завершення війни шляхом нанесення сильного удару по ворогах зазнала невдачі, здається, що у нас майже не залишилося варіантів. Можливо, настав час прийняти безчестя і розпочати еру, вільну від конфліктів."
