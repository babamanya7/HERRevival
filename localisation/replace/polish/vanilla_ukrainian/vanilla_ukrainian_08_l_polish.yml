 aat_news.120.desc:0 "Після довгих переговорів [FIN.GetLeader] і [SOV.GetLeader] за посередництвом своїх офіцерів і офіційних представників погодилися підписати перемир'я, яке набуває чинності негайно. Державі [FIN.GetNameDef], однак, це перемир'я обійдеться дорого, і її союзники почуватимуться обдуреними."
