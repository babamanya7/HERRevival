 ITA_citta_dell_aria_desc:0 "Наші дослідницькі зусилля довгий час були розпорошені по багатьох різних областях по всій країні. Це робило їх досить неефективними. Ми мусимо об'єднати наші дослідницькі зусилля та заснувати «Небесне місто», в якому вчені та інженери з різних галузей знань зможуть працювати разом над створенням нових поколінь літаків."
