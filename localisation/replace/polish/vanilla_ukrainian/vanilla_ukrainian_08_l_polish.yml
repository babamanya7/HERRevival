 BOL_jose_luis_tejada_sorzano:0 "Хосе Луїс Техада Сорсано"
 BOL_toll_of_the_chaco_war_desc:0 "Щойно закінчилася Чакська війна, що тривала з 1932 по 1935 рік. Воля до боротьби повністю вичерпана навіть у найпалкіших прихильників експансіонізму як у Болівії, так і в Парагваї, і багато хто загинув у досі спірному регіоні Північний Чако."
 BOS_neutrality_DEF:0 "Боснія"
 BOT_ENG_autonomy_colony_DEF:0 "Колонія Бечуаналенд"
 BOT_neutrality_DEF:0 "Ботсвана"
 BOU_neutrality_DEF:0 "Республіка північних Соломонових островів"
 BRA_america_do_sul:0 "Південна Америка"
 BRA_armando_de_sales_oliveira:0 "Арманду джі Салес Олівейра"
 BRA_cangaco_coup_desc:0 "Незважаючи на обіцянки революції, керівництво руху нерішуче та заплуталося в догматичних дебатах щодо відповідних доктрин, яких слід дотримуватися. Завдяки більшій, ніж будь-коли, підтримці серед народу, настав час канґасу взяти командування нацією та раз і назавжди покінчити з корупцією в її серці."
 BRA_cangaco_party_long:0 "Рух канґасу"
 BRA_centralize_development_desc:0 "Наша нинішня столиця занадто віддалена від віддалених регіонів країни, і це призводить до обурення та сепаратизму. Щоб мати найкраще з обох світів, ми заснуємо нову столицю в серці нації, більш доступну для всіх."
 BRA_empire_of_brazil:0 "Відновити Імперію Бразилії"
 BRA_end_of_cangaco_tt:0 "§R$BRA_cangaceiro_mission$§! буде назавжди деактивовано, що запобігає поширенню Канґасу на будь-які інші штати."
 BRA_federal_investment_in_rural_state:0 "Вкластися в область [FROM.GetName]"
 BRA_german_sub_initiative:0 "Обмін інформацією про підводні човни з Німеччиною"
 BRA_launch_the_revolution:0 "Розпочати революцію"
 BRA_mechanized_equipment_1:0 "M2 Half Track Car"
 BRA_nationalize_the_banks:0 "Націоналізувати банки"
 BRA_nationalize_the_banks_desc:0 "Наша економіка ще не оговталася від Великої депресії, що залишає багатьох наших громадян у бідності. Настав час перекласти тягар економічного відновлення з жертв депресії на тих, хто керує банками та є її винуватцями."
 BRA_navy_modifier:0 "$SMB_navy_BRA$"
 BRA_nobel_peace_prize_nominee:0 "Номінант на Нобелівську премію миру"
 BRA_penal_battalions_desc:0 "Багато хто у збройних силах не в захваті від перспективи боротьби за монархію, яка перебувала у вигнанні протягом десятиліть. Однак, використовуючи закони про національну безпеку, ми створили надлишок в'язнів, яких можна використовувати у штрафних батальйонах, посилюючи наші деморалізовані традиційні сили."
 BRA_proletarian_equality:0 "Пролетарська рівність"
 BRA_puppet_government:0 "Маріонетковий уряд"
 BRA_reward_army_loyalty_desc:0 "Армія була незамінною не лише в нашому сходженні до влади, але й у збереженні нашого контролю над нею. Настав час винагородити наших союзників за цю лояльність збільшеним виділенням ресурсів для інфраструктурних проєктів армії."
 BRA_smoking_cobras_desc:0 "Багато хто казав, що змії скоріше закурять люльку, ніж наші сили справді дістануться фронту. Тепер наші вороги бояться завзяття та досвіду солдатів, які прийняли цей титул як відзнаку честі."
 BRA_state_atheism_desc:0 "Щоб переконатися, що уми нашого народу не заповнені небажаними думками, ми повинні забезпечити, щоб така пропаганда ніде не могла поширюватися. Старомодні шляхи [BRA.GetAdjective] теологів та те, що вони проповідують, різко суперечать тому, чого ми хочемо від нашого народу. Ми не повинні дозволяти цьому тривати далі!"
 BRA_subject_DEF:0 "$OVERLORDADJ$а $BRA$"
 BRA_the_white_dove:0 "Білий голуб"
 BRA_third_republic_democratic_ADJ:0 "Бразильськ"
 BRA_united_kingdom_of_brazil_and_portugal_desc:0 "Відновлення Імператорського дому Бразилії також відродило монархічні настрої у Португалії. Можливо, ми повинні використати це як можливість знову об'єднати наші нації під єдиним монархом. Зрештою, обидві нації отримають вигоду від ресурсів та досвіду одна одної."
 BRA_us_of_south_america_cat_desc:0 "$BRA_united_states_of_south_america_desc$"
 BRI_democratic_DEF:0 "Бретонська вільна республіка"
