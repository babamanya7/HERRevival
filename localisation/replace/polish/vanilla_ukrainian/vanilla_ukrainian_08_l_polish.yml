 LIT_arrested_party_members:0 "Члени партії заарештовані"
 LIT_baltic_stronger_together_desc:0 "Між балтійськими державами давно існує почуття братерства та товариства, але ми весь час розділені межами та політикою. Нас пов'язують дипломатія та наша готовність зберігати незалежність, і тому ми маємо боротися один за одного та розширити збройні сили об'єднаної Балтії!"
 LIT_events.101.t:0 "[SOV.GetAdjectiveCap]о-[LIT.GetAdjective]ий ультиматум"
 LIT_events.4.d:0 "Побоюючись вторгнення, міністри держави [From.GetNameDef] пропонують дозволити [Root.GetAdjective] військам базуватися всередині кордонів держави [From.GetNonIdeologyName]. У відповідь [From.GetAdjective] уряд очікує, що [Root.GetNameDef] захищатиме їх суверенітет, — хоча, звичайно, в умовах, коли на його території вже знаходяться війська, [From.GetNameDef] навряд чи зможе чинити опір будь-яким [Root.GetAdjective] вимогам..."
 LIT_events.501.t:0 "Вільнюс повернуто!"
 LIT_events.7.b:0 "У нас інші плани на Польщу."
 LIT_merge_the_arms_industries_desc:0 "Польська та литовська військові промисловості вже кілька десятків років виробляють зброю тільки для своїх країн, але тепер, коли вони єдині, ми маємо можливість спеціалізувати промисловість та об'єднати польські та литовські заводи."
 LIT_peasants_reform_desc:0 "Селяни — одні з найбідніших жителів Литви, незважаючи на те, що вони здебільшого й забезпечують нашу економіку. Тепер, коли Владас Міронас займає посади прем'єр-міністра та міністра сільського господарства, ми можемо забезпечити аграріям набагато кращі умови життя."
 LIT_petras_schatz:0 "Петрас Шац"
 LIT_push_for_ruthenia:0 "Прохід крізь Рутенію"
 LIT_request_polish_occupation_desc:0 "В останні десятиліття сама ідея Польської держави, яка не включає Литву, вважалася немислимою, а литовський суверенітет був для сучасних польських політиків чимось на зразок жарту. Що ж, можливо, вони будуть задоволені литовською окупацією."
 LIT_soviet_mutual_assistance:0 "[SOV.GetAdjective]а взаємна допомога"
 LIT_support_polish_fascists_desc:0 "Польща має спільні з нами вороги, і ми не можемо забути роки польсько-литовської спорідненості. Ми мусимо підтримати фашизм у польській державі."
 LIT_the_nationalist_council_desc:0 "Наш президент вже офіційно не перебуває в політичних партіях, але члени сейму досі сперечаються один з одним, наче невгамовні діти. Вони мусять або співпрацювати з партією [ROOT.GetRulingParty], або готуватися до швидкої відставки."
 LOADING_TIP_148:0 "«Я бачив війну. Я бачив, як стікає кров пораненого. Я бачив мертвих у багні. Я бачив знищені міста. Я ненавиджу війну».\n(Франклін Д. Рузвелт)"
 LOADING_TIP_57:0 "«Хіба ж не жах? Ось ми, два офіцери німецького генштабу, обговорюємо, як краще прикінчити нашого головнокомандувача».\n(Геннінґ фон Тресков)"
 LOADING_TIP_77:0 "«Укріплення, артилерія, іноземна допомога не допоможуть, якщо звичайний солдат не буде знати, що це ВІН захищає свою країну».\n(Карл Ґустав Еміль Маннергейм)"
 LOADING_TIP_99:0 "«Яка би гарна не була стратегія, часом Вам слід поглянути на результати».\n(Вінстон Черчилл)"
