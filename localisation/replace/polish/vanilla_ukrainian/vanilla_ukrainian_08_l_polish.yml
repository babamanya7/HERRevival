 PHI_off_shore_patrol_desc:0 "Наші військово-повітряні сили повинні бути здатними захищати небо однаково як над сушею, так і над морем. Тому ми повинні обслуговувати спеціалізовані морські літаки з більшим радіусом дії та протикорабельними можливостями, щоб ми могли вдарити по загарбнику ще до того, як він побачить наші береги."
 PHI_partido_komunista_ng_pilipinas_coup:0 "Переворот Комуністичної партії Філіппін"
 PHI_police_chief_eisenhower_desc:0 "Зі створенням нашої нової запланованої столиці, Кесон-Сіті, [PHI.GetLeader] визначив, що їй знадобиться відомий шеф поліції. Президент мав чудові робочі стосунки з Дуайтом Д. Айзенгауером і вірить, що за допомогою правильних стимулів його можна переконати обійняти цю посаду, тим самим назавжди прив'язавши його до філіппінської справи."
