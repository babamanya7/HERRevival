 JAP_super_heavy_tank_equipment_1_short:0 "Type 2604"
 JAP_the_divine_wind_desc:0 "Камікадзе, тактика Спеціального штурмового загону, перетворили самогубні атаки з імпровізованого крайнього заходу на усталену доктрину. З новими літаками, по суті пілотованими ракетами, ці атаки будуть нестримними."
 JAP_the_great_spiritual_evil_desc:0 "Прийняття Законів про збереження миру стало гарним першим кроком на нашому шляху до зупинки впливу комуністичного виродження на уми нашого народу, але нам ще багато належить зробити. Кокутай також перебуває під загрозою іноземної соціалістичної думки, і ми повинні застосувати більш активний підхід, щоб не дати цьому знищити нашу націю."
 JAP_the_pacific_union_of_soviet_socialist_republics_tt:0 "Ми будемо відомі як §YТихоокеанський Союз Радянських Соціалістичних Республік§!"
