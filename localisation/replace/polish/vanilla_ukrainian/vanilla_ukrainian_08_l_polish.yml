 XIC_northwest_bandit_suppression_headquarters_desc:0 "Наші операції проти комуністів у Шеньсі зайшли в глухий кут, і лише у другій половині 1935 року ми втратили піхотну дивізію та полк у цьому регіоні. Зі зростаючим тиском з боку наших офіцерів і солдатів, які вимагають припинити безплідну боротьбу проти комуністів і зосередитися на відновленні наших втрачених провінцій на північному сході, ми повинні зробити вибір."
 XIC_reclaim_the_lost_birthright_desc:0 "Нарешті настав час вигнати [MAN.GetAdjective]е і [JAP.GetAdjective]е лихо з нашої батьківщини і повернути собі Маньчжурію! Ми повинні негайно розпочати вторгнення на півночі та захопити регіон, перш ніж їхні війська зрозуміють, що їх вразило."
