 uk_asia_focus_desc:0 "Багато наших старих колоній на сході перебувають під загрозою громадянських війн та імперських амбіцій місцевих країн. Ми не мусимо занедбувати наші аванпости, що залишилися, але продовжувати розвивати ці регіони, щоб забезпечити нашу глобальну присутність."
 uk_australia_focus:0 "Розвиток Австралії"
 uk_canada_focus:0 "Розвиток Канади"
 uk_malta_focus_desc:0 "Мальта займає відмінну позицію в центральному Середземномор'ї, будучи життєво важливою станцією на нашому життєво важливому шляху через Єгипет і Суецький канал до Індії і Далекого Сходу. Час, витрачений на її сильніше укріплення, не буде змарнований."
 uk_mediterranean_focus_desc:0 "Маршрут через Середземне море — життєво важливий короткий шлях до Індії та з Індії. Тому надзвичайно важливо тримати його відкритим і в наших руках."
