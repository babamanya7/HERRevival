 FIN_socialist_welfare:0 "Соціалістичний добробут"
 FIN_socialist_wellfare_desc:0 "Завдяки дбайливому управлінню економікою та захистом нашої нації ми тепер маємо ресурси, щоб винагородити трудящих створенням справжньої соціальної держави. Ми гарантуємо, що наші люди проживуть довге та щасливе життя."
 FIN_tire_factory_at_nokia_add_synthetic_refineries_tt:0 "Додати §G2§! §Y$synthetic_refinery$§!."
 FIN_tornio_steel_factory_desc:0 "Створення металургійного заводу в Торніо, поблизу шахти Кемі, обіцяє революцію у металургійній промисловості Фінляндії. Маючи доступ до нинішніх запасів хрому та нікелю Outokumpu, новий завод вироблятиме високоякісну сталь, подолаючи розрив у промисловості Фінляндії. можливості."
