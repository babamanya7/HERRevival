 WW_hungary.86.desc:0 "Повстанці, пов’язані з [FROM.GetAdjective] парамілітарними організаціями, захопили ключові будівлі в регіоні [975.GetName], поспіхом провівши референдум про приєднання до [FROM.GetNameDef], результати якого, безперечно, були сфальсифіковані. Наші війська напоготові, але чекають наказів."
