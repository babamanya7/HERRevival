 concentrated_industry5:0 "Концентрована промисловість V"
 congo_independence_struggle.1.d:0 "З того часу, як наш континент був поділений серед європейців, ми прагнули свободи та можливості вирішувати свою долю. Наше минуле як колонії [BEL.GetNameDefCap] було забарвлене експлуатацією і дегуманізацією, але ми завжди залишалися під гнітом через нашу власну роз'єднаність та їхню перевагу у вогневій силі. \n\nСеред людей знову почали звучати підбурюючі шепоти, коли вони висловлюють свої мрії про Конґо, вільне від колоніального втручання. Конґо, яке має право на власні закони, Конґо, яке має право отримувати прибутки від власної праці, Конґо, яке повинно формувати своє майбутнє."
 congo_more_options_to_threaten_tt:0 "Якщо ми раніше отримали іноземну підтримку, ми зможемо зайняти більш агресивну позицію на переговорах."
