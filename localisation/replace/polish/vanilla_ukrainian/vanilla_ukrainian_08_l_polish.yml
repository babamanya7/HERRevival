 JUNO_brazil_events.135.desc:0 "Нещодавно ми отримали новину, що [SOV.GetNameDef] погодився на нашу запропоновану угоду. Відтепер ми зможемо ліцензувати виробництво їхнього обладнання за нижчою ціною!"
 JUNO_brazil_events.172.desc:0 "[FROM.GetNameDefCap] відхилила нашу пропозицію про об'єднання через непопулярність цієї політики серед громадськості. Незважаючи на наші пояснення, наскільки ця домовленість була б взаємовигідною, схоже, час для об'єднання ще не настав."
 JUNO_brazil_events.31.desc:0 "Наші розвідувальні служби повідомляють, що вони налагодили тісні робочі стосунки зі своїми [BRA.GetAdjective] колегами. Це призвело до розширення нашого збору розвідувальних даних у Південній Америці, відомого як Операція «Болівар». Схоже, що наша початкова співпраця з [BRA.GetName] починає приносити плоди."
 JUNO_brazil_events.88.tt:0 "Ми отримали §YЗменшення думки§! (Думка про [SOV.GetFlag]§Y[SOV.GetName]§!: §R-25§!.)"
 JUNO_brazil_news.3.a:0 "Молодці!"
 JUNO_brazil_news.6.d:0 "Триваюче заворушення в [BRA.GetNonIdeologyName] вийшло з-під контролю в останні дні, що призвело до комуністичного перевороту. Уряд зірвав змову комуністичного руху з метою повалення режиму в 1935 році, але не зміг зупинити більшу червону хвилю. Хоча більша частина військових залишилася лояльною центральному уряду, багато молодших офіцерів стають на бік комуністів. Багато хто в регіоні стурбований тим, що комуністична [BRA.GetNonIdeologyName] спричинить ланцюгову реакцію по всьому континенту Південної Америки."
