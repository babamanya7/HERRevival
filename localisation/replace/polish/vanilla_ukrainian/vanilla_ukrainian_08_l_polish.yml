 controls_more_than_50_percent_of_territory:0 "[ROOT.GetNameWithFlag] контролює більш ніж §Y50%§! загальної кількості областей у власності.\n Наразі під контролем: [?num_owned_controlled_states|Y0]\n Потрібно: [?controlled_owned_more_than_50|Y0]"
