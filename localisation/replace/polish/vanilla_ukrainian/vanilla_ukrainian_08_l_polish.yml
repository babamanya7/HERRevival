 JAP_sea_battleship_initiative_desc:0 "Завдяки нашим чудовим проєктам лінкорів нам потрібен лише один вирішальний бій, щоб вирішити долю війни на морі. Ми повинні переконатися, що наш бойовий флот оптимізований для рішучого вступу в бій та здобуття перемоги, швидкої, наче вітер."
