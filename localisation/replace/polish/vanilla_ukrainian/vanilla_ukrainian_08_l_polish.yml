 HAS_NOT_EXCLUSIVE:0 "$NAME|G$"
 HAS_NOT_TACTIC_TRIGGER:0 "Не має тактики: $NAME|H$"
 HBC_liu_ruming:0 "Liu Ruming"
 HINTS_ACTIVE:0 "Дозволити підказки"
 HOA_encourage_local_arms_production:0 "Заохотити місцеве виробництво зброї"
 HOA_foreign_investors_desc:0 "Нам потрібні інвестиції в нашу галузь та інфраструктуру, якщо ми хочемо процвітати. На щастя, іноземців, які хочуть отримати прибуток, не бракує."
 HOA_improving_the_educational_system:0 "Поліпшення системи освіти"
 HOA_pave_the_roads_desc:0 "Перевезення людей і товарів через [ROOT.GetNameDef] наразі є надто неефективним. Інвестиції в наші дороги принесуть користь не тільки економіці, це зробить нас більш безпечними, дозволяючи також легше переміщати військові засоби."
 HOA_reform_the_conscription_desc:0 "Оскільки глобальна ситуація стає все більш напруженою, настав час розширити програму призову, щоби ми були готові до будь-якої форми зовнішньої агресії."
 HOL_EQUIPMENT_VERSION_14:0 "No. 14"
 HOL_a_western_capital_taog:0 "$HOL_a_western_capital$"
 HOL_adriaan_dijxhoorn:0 "Адріаан Дейксгоорн"
 HOL_adrianus_rudolphus_van_den_bent:0 "Адріанус Рудолфус ван ден Бент"
 HOL_allied_technological_developments_desc:0 "Перемога залежить від технологічної переваги. Ми повинні позичити свою частку величезних ресурсів, спрямованих на програми досліджень і розробок союзників, щоби ми також могли отримати від них прибуток."
 HOL_anti_tank_guns_for_the_continent_desc:0 "З часів Великої війни ми бачили, як наші континентальні сусіди вдосконалювали конструкції своїх танків. Якщо вторгнення відбудеться, ці машини, безумовно, будуть його невід'ємною частиною. Ми повинні підготуватися відповідно."
 HOL_attract_west_indies_oil_companies_desc:0 "Багато іноземних нафтових компаній зацікавлені у будівництві нафтопереробних заводів на Кюрасао та Арубі, а також у спільній переробці венесуельської нафти з подальшим поділом прибутку."
 HOL_aviatic_aspirations:0 "Авіаційні прагнення"
 HOL_colonial_shipbuilding_taog:0 "$HOL_colonial_shipbuilding$"
 HOL_destroyer_3_desc:0 "The Gerard Callenburgh class planned for four destroyers for the Royal Dutch Navy. All four were launched before the German invasion, but only two were completed, one by the British after escaping to England, and one by the Germans. These destroyers displaced over 1,600 tons, were armed with five 120mm guns in their main armament, as well as eight 533mm torpedo tubes, and had good speed."
 HOL_develop_the_south:0 "Розвиток півдня"
 HOL_draw_up_combined_staff_plan:0 "Скласти план загальної чисельності"
 HOL_europe_research_desc:0 "$HOL_sov_research_desc$"
 HOL_gateway_to_europe_desc:0 "Нідерланди є воротами торгівлі в Європу, і це добре розуміють наші торгові партнери. Хоча наша позиція додає нам сили, вона також ставить нас у незавидну скруту: у той час як британці прагнуть блокувати своїх ймовірних ворогів на континенті, німці хочуть, щоби ми збільшили потік торгівлі до їхньої країни через нашу, використовуючи нас. як чорний хід, щоб уникнути блокади."
 HOL_gateway_to_europe_eng_category:0 "Ворота в Європу"
 HOL_infantry_equipment_1:0 "Johnson M41"
 HOL_infantry_equipment_2:0 "Bergmann MP28"
 HOL_internationally_controversial_aggression:0 "Суперечлива агресія"
 HOL_jacob_adriaan_de_wilde:0 "Якоб Адріаан де Вілде"
 HOL_light_cruiser_3_desc:0 "The Tromp class consisted of a pair of relatively small light cruisers commissioned for the Netherlands just before the German invasion. Both served in the Far East and survived the war. They displaced only 3,350 tons and, as designed, had six 150m guns as their main armament."
 HOL_medium_tank_destroyer_equipment_2:0 "Tankjager 4"
 HOL_modernize_the_air_fleet:0 "Модернізація повітряного флоту"
 HOL_modernize_the_grebbeline:0 "Модернізувати лінію Греббе"
 HOL_oranje_boven:0 "Oranje boven!"
 HOL_petrus_wilhelmus_best:0 "Петрус Вілгелмус Бест"
 HOL_request_equipment_tt:0 "АБО\n"
 HOL_staff_plan_ger:0 "Спільний план німецького командування"
 HOL_submarine_1:0 "Клас «K-III»"
 HOL_taking_back_our_old_colonies_desc:0 "Наша тимчасова слабкість, спричинена завоюванням Наполеоном майже 150 років тому, втратила багато наших колоній на користь британців. Населення багатьох із них все ще поділяє наші нідерландські культуру та спадщину. Ми повинні повернути наші старі колоніальні володіння!"
 HOL_war_on_pacifism:0 "Війна з пацифізмом"
 HOL_war_on_pacifism_desc:0 "З часів Великої війни пацифізм процвітає серед нідерландської громадськості, що робить практично неможливим формування сучасної армії. «Воля народу» надто довго перешкоджала повному виділенню необхідних коштів на армію. Вони не знають, якій небезпеці наражаються... Ми оголосимо війну пацифізму і виженемо ці непродуктивні настрої з розуму нашого населення!"
