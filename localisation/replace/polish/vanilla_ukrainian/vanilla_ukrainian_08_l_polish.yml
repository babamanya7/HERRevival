 ROM_appoint_soviet_friendly_government:0 "Призначити прорадянський уряд"
 ROM_army_maneuvers_desc:0 "Нашу армію потрібно привести у форму для можливих збройних конфліктів у майбутньому. Ми відправимо їх на маневри для розробки нових тактик і стратегій."
 ROM_coastal_defense_ships_desc:0 "Для кораблів, які відмінно справляються з обов'язками берегової оборони, потрібно буде створити нові проєкти."
 ROM_demand_a_western_guarantee_desc:0 "Якщо ми хочемо протистояти і комунізму, і фашизму, нам потрібна буде допомога Заходу. Ми використаємо всі наявні в нашому розпорядженні політичні важелі, щоб отримати таку гарантію."
 ROM_flexible_foreign_policy_desc:0 "Ми мусимо відмовитися від наших принципів і налагодити відносини з тим, з ким це було б практичніше. Від цього залежить наше виживання."
 ROM_ground_support:0 "Наземна підтримка"
 ROM_ground_support_desc:0 "Загальнозброєне спрямування є невід'ємним принципом сучасної війни. Військово-повітряні сили повинні бути навчені підтримувати наші сухопутні сили, коли це необхідно."
 ROM_infantry_equipment_3:0 "Orita Carbine"
