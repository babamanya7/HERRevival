 FRA_carry_the_revolution_east_desc:0 "На нашому східному кордоні лежить найбільша загроза нашому новому порядку. Зібрані там реакційні сили завдадуть удару, коли ми найменше зможемо це собі дозволити — але лише якщо ми дамо їм час підготуватися до цього."
 FRA_celebrate_the_commune:0 "Ушанувати комуну"
 FRA_charles_maurras:0 "Шарль Морра"
 FRA_connections_to_industrialists:0 "Зв'язки з промисловцями"
 FRA_coup_in_north_africa:0 "Підготувати переворот у Північній Африці"
 FRA_cv_fighter_equipment_3:0 "Dewoitine D.525"
 FRA_demand_unification_with_vichy:0 "Вимогти об'єднання з Віші"
 FRA_destroyer_3_desc:0 "Есмінці типу L'Intrépide являють собою модифіковану версію попередніх есмінців класу Le Hardi. Вони були дозволені у військово-морських програмах 1938 та 1939 років, але війна та падіння Франції призвели до скасування цих суден. Вони були б більше зосереджені на зенітній ролі, і мали б збільшення водотоннажності до 2800–2900 тонн, мали б більші двигуни."
 FRA_devalue_the_franc_desc:0 "Хоча інші країни дозволили своїм валютам стати менш цінними, щоби допомогти своїй економіці, ми категорично відмовлялися це робити. В результаті наша економіка відстає від інших. Якщо ми хочемо стати більш конкурентоспроможними і подолати майбутній шторм, ми не мусимо відкидати девальвацію нашої валюти безконтрольно, навіть якщо це виявиться непопулярним заходом."
 FRA_extra_research_slot_desc:0 "У нас у країні безліч світлих умів, яким потрібно надати можливість проводити свої дослідження. Розвиток технологій виведе нас у світові лідери у тих галузях, де це особливо необхідно."
 FRA_family_desc:0 "Найменшою одиницею суспільства є не особистість, а сім'я. Заперечувати цей простий і очевидний факт було найбільшою вадою старої республіки."
 FRA_fatherland_desc:0 "Обов'язок кожного [FRA.GetAdjective]ого чоловіка, жінки і дитини — захищати та допомагати ближньому. Єдиний спосіб досягти цього — це порядок і безумовна вірність нації. Про це не може бути й сумніву, інакше нас чекає та ж доля, що й на стару республіку. Ми зробимо все, що необхідно для підтримки порядку й національної безпеки. Зрештою, народ зрозуміє, що це в його інтересах."
 FRA_fortification_focus_desc:0 "Фортифікації завжди грали ключову роль в обороні, і зараз нам потрібно використовувати їх ще ефективніше. Лінія Мажіно тривалий час служила стримування противника. Нам потрібно більше таких укріплень."
 FRA_francois_hussenot:0 "Франсуа Гюссено"
 FRA_henri_marie_auguste_bineau:0 "Анрі Марі Оґюст Біно"
 FRA_intervention_in_central_africa_desc:0 "Центральна Африка має життєво важливе значення для військових зусиль союзників і може бути сприйнята як важливий для нас пропагандистський переворот."
 FRA_je_suis_la_deluge:0 "Je Suis Le Déluge"
 FRA_joseph_bethenod:0 "Жозеф Бетено"
 FRA_light_cruiser_2_desc:0 "Легкі крейсери типу La Galissonnière були відповіддю на італійські легкі крейсери типу Condottieri і базувалися на попередньому класі Emile Bertin. Вони були побудовані в рамках військово-морських програм 1931 і 1932 років із типовим основним озброєнням і відповідним протиракетним озброєнням того часу. Вони мали водотоннажність 10850 тонн, мали збільшену кількість літаків-розвідників і мали хорошу швидкість."
 FRA_light_cruiser_3_desc:0 "Крейсери типу «DeGrasse» були дозволені у військово-морських програмах 1938 і 1939 років і являли собою істотно вдосконалені La Galissonnières. Вони мали потужніше зенітне озброєння, а також більші двигуни. Падіння Франції призвело до того, що останні два кораблі були скасовані, а головний корабель був закінчений після війни як інший проєкт. Німці збиралися закінчити її як легкий носій, але і цей проєкт не був реалізований."
 FRA_naval_bomber_focus_desc:0 "Як показав досвід минулої війни, кораблі вразливі для атак із повітря. Потрібно постійно поліпшувати ці технології, щоб жодний супротивник не міг нас випередити."
 FRA_protect_the_rights_of_man_desc:0 "Можливо, вони ніколи не скажуть про це відкрито, але кожному, хто має очі, зрозуміло: обмеження права власності — це лише перший крок до ліквідації всіх прав, за які так важко боролися наші горді предки. У нас цього не буде!"
 FRA_public_welfare_desc:0 "Король, який не працює для найменшого зі своїх підданих, зовсім не король."
 FRA_refus_absurde_desc:0 "Навіть у годину поразки воля до опору залишається сильною в деяких серцях. Вони ляжуть в основу руху опору на окупованих територіях."
 FRA_revive_the_national_bloc_desc:0 "Політичний ландшафт з кожним днем стає дедалі радикальнішим. Ліві шепочуть про спільну справу з комуністами. Зараз потрібне сильне, стабільне лідерство."
 FRA_revolution_to_the_utmost:0 "Революція до крайності"
 FRA_revolutionary_zeal:0 "Революційний запал"
 FRA_scout_plane_equipment_2:0 "CAO-700"
 FRA_split_belgium_desc:0 "Оскільки Бельгія тепер у нашій сфері впливу, настав час покликати франкомовні частини її додому. Решта буде сформована в нову державу."
 FRA_support_the_right_desc:0 "Франція завжди була сильною і гордою державою, проте слабкість уряду призвела до того, що народ втратив єдність. Ми мусимо об'єднати Францію та заявити про свою перевагу. Тільки сила зупинить розкладання."
 FRA_support_the_right_focus:0 "Підтримати правих"
 FRA_the_natural_borders_of_france:0 "Природні кордони Франції"
 FRA_the_natural_borders_of_france_desc:0 "Цілком природно, що країна насамперед мусить дивитися на власні інтереси. Ми не можемо мирно співіснувати з німцями в нашій боротьбі, і тому ми мусимо убезпечити наші природні кордони, щоби захистити наші центри."
