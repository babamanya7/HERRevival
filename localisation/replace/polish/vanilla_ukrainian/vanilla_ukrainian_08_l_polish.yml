 JAP_foreign_tank_modernization_cooperation_tt:0 "§YВелика західна держава§! §Yгарантує незалежність§! або перебуває в §Yальянсі§! з §Y[ROOT.GetNameDef]§!"
 JAP_free_colonized_asian_countries_desc:0 "В Азії є багато націй, які зараз перебувають під окупацією західних держав. Як нові охоронці Азії, ми повинні звернутися до цих західних країн і спробувати зробити пропозиції, від яких вони не зможуть відмовитися, надавши нам контроль над цими колоніями."
