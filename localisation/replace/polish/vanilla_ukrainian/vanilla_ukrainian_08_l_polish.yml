 institute_press_censorship_fascist_state_desc:0 "Ці часи небезпечні й ми не можемо дозволити незгодним розірвати нашу країну на частини. Обмеження свободи преси необхідне, щоби правда могли бути почута голосно і ясно."
 integrate_indochina:0 "Інтегрувати Індокитай"
 internationalism_focus_desc:0 "Ідеологія не визнає меж. Будь-яка держава може оголосити себе суверенною, проте наші переконання вищі за подібні обмеження.."
 invade_ireland_desc:0 "Ми мусимо забезпечити безпеку наших конвоїв усіма необхідними засобами. Вторгнення в Ірландію може бути неприйнятним для декого з нас, але якщо це те, що потрібно, щоб отримати використання їхніх авіабаз, то так тому й бути."
