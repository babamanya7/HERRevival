 german_advisors_china_desc:0 "Німецькі військові радники присутні в Китаї щонайменше з 1920-х років, надаючи значну підтримку Ґоміньдану. В умовах нинішньої війни це неприпустимо. Ми, як сторона, що підписала Антикомінтернівський пакт, має право на допомогу Німеччини слід обережніше вибирати союзників."
 germany.1002.b:0 "Польща наша!"
 germany.1042.desc_ally:0 "[ROOT.GetAdjectiveCap]а міць не знає меж. Нам було передано території Судетської області, первісно в [FROM.GetAdjective]ій сфері впливу. Не знадобилося багато часу, щоби [FROM.GetLeader] та [FROM.GetAdjective]і дипломати зрозуміли, що це на краще для альянсу [ROOT.GetFactionName]."
 germany.1043.a:0 "Прокляття."
 germany.107.t:0 "Політ Рудольфа Гесса"
 germany.11.t:0 "Пакт Молотова–Ріббентропа"
 germany.113.a:0 "[Root.GetName] не стане воювати ще з одними."
 germany.116.t:0 "Польща відкинула Данциґську угоду"
 germany.123.a:0 "Хай буде так!"
 germany.126.t:0 "Аншлюс або знищення"
 germany.202.desc:0 "[FROM.GetName] дозволила об'єднати свої німецькі території з так званою [WGR.GetName]. Це спричинило хвилю закликів до возз'єднання з незалежною Німеччиною і серед населення нашої німецької зони."
 germany.61.a:0 "Війна — це не варіант."
 germany.70.t:0 "Змова Остера"
 germany.77.d:0 "Держава [From.GetName] відхилила нашу пропозицію договору, спрямованого на просунення танкових технологій. Можливо, вони бояться, що наше краще озброєння буде обернене проти них."
 germany.80.d:0 "Німці давно заглядаються на Данциґ і шукають можливість об'єднати території Східної Пруссії з іншою частиною німецької держави. Дипломати попереджали, що незабаром може настати день, коли нам доведеться обрати між Данциґом та війною.\n\nДоволі дивно, та німці запропонували нам, як вони це називають, більш мирний варіант. Вони пропонують нам новостворену словацьку державу, що нині є не більш ніж маріонеткою під німецьким керуванням, в обмін на Данциґ.\nНевідомо, яких заходів вжиють німці, якщо ми відмовимося, але нам дали можливість розрулити цей конфлікт із деякими територіальними здобутками."
 germany.80.t:0 "Данциґ в обмін на Словаччину"
 germany.93.d:0 "Ми розраховували, що великі держави Європи сядуть за стіл, щоби придумати справедливу угоду в ім'я миру. Натомість Британія та Франція вирішили підтримати вискочок-югославів і їхню штучну державу. Так чи інакше, Словенія буде нашою..."
 germany.93.d_FRA_abandoned_yugoslavia:0 "Ми розраховували, що великі держави Європи сядуть за стіл, щоби придумати справедливу угоду в ім'я миру. Хоч французи побачили справедливість у нашій справі, дурні-британці вирішили підтримати вискочок-югославів і їхню штучну державу. Так чи інакше, Словенія буде нашою..."
 germany.95.a:0 "Час провчити їх."
 germany_mefo_bills.2.desc:0 "Наша програма переозброєння, хоч і необхідна та благородна за своїм задумом, починає викликати занепокоєння серед економістів. Вони побоюються, що військове виробництво вимагатиме все більше коштів для підтримки. Нам потрібно пильно слідкувати, щоб військові витрати не вийшли з-під контролю."
