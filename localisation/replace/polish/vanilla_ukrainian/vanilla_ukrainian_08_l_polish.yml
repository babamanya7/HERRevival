 889_autenticite_name:0 "Лубумбаші"
 AAT_Sweden.18.desc:0 "Відновлений [NOR.GetAdjective]ий уряд просить передати Нарвік і прилеглі території після того, як ми захистили ці землі та громадян під час війни. У своєму комюніке вони заявляють, що глибоко вдячні за вчинки, зроблені нашим урядом під час війни, і сподіваються на подальшу співпрацю з нами. Відбудеться урочиста церемонія вшанування людей, які відстояли цей шматочок [NOR.GetAdjective]ої незалежності у темну ніч війни."
 AAT_Sweden.21.a:0 "Ця пропозиція — не в наших інтересах."
 AAT_Sweden.31.desc:0 "[FROM.GetAdjectiveCap]ий посол передав похмуре повідомлення. [FROM.GetName] вимагає, щоби ми повернули їм Борнгольм, стверджуючи, що острів ніколи не був законно переданий державі [DEN.GetName], оскільки був втрачений під час повстання. Оскільки це було в XVII столітті, це, очевидно, є тонко завуальованим виправданням [FROM.GetAdjective]ого експансіонізму."
 AAT_Sweden.37.b:0 "$AAT_Sweden.37.a$"
 AAT_Sweden.45.a:0 "Змовники?"
 AAT_Sweden.46.t:0 "Питання держави [FIN.GetName]"
