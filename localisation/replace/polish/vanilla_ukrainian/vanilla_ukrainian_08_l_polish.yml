 GER_amphibious_tank_equipment_2:0 "Tauchpanzer III"
 GER_anglo_germanic_defense_pact_desc:0 "Британці були нашими ворогами в минулому, але тепер ми можемо укласти пакт: якщо хтось нападе на одну зі сторін — отримає війну з обома. Це стане величезним кроком до нормалізації відносин."
 GER_anti_colonialism_decision:0 "$COG_anti_colonialism_decision$"
 GER_autobahn_desc:0 "Від свого початку в 1933 році проєкт державних автобанів був дуже успішним. Будівельні роботи зменшили безробіття, а нові й широкі дороги слугують монументом економічному відновленню держави [GER.GetName]. Однак, попереду ще багато роботи."
