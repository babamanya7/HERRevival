 political.24.d:0 "Захоплення [Root.GetAdjective]ого населення націоналістичною гордістю і спробами відродити славу минулого, схоже, минуло. Це безцеремонне пробудження для їхніх палких прихильників, чия уніформа, мілітаристські пози та надмірно пафосні промови тепер частіше викликають глузування, ніж симпатії.\n\nКолись він вважався загрозою владній базі [Root.GetRulingParty], але тепер [Root.GetAdjective]ий фашизм тепер щодалі частіше сприймається як абсурдна, екстремістська позиція та напад на найбільш фундаментальні цінності нашої нації — тієї самої нації, яку, як вони стверджують, вони так високо цінують. Це слово, здається, більше підходить для наруги, ніж для політичного позначення."
