 ship_engine_sub_aip_2:0 "Поєднаний дизельно-повітрянонезалежний двигун"
 ship_hull_carrier_modern_desc:0 "Найбільші та найдосконаліші авіаносці, здатні використовувати найновіші технології, обладнання та здобутки. Вони є втіленням «найсучаснішого» озброєння."
 siam.20.desc:0 "[FROM.GetName] вирішила повернути наші території; незалежно від того, чи визнають вони наш суверенітет над ними, чи просто піддалися тиску інших країн — це неважливо, наша справа справедлива."
 siam.21.desc:0 "[FROM.GetName] відхилила наш запит. Ці імперіалісти чіпляються за минуле століття пазурами та ланцюгами, не в силах визнати, що час цих так званих «великих націй» сплив."
 siam.32.desc:0 "Наші прибережні води потребують спроможних оборонних суден, і ми повинні обрати постачальника. [ENG.GetNameDefCap] і [JAP.GetNameDef] готові доставити їх — це рішення сформує і наш флот, і наші міжнародні відносини."
 siam.35.a:0 "Виконати вимоги [JAP.GetNameDef]."
 siam.39.desc:0 "[FROM.GetLeader] вирішив прийняти наше підпорядкування. На даний момент [ROOT.GetNameDef] врятовано від подальших руйнувань, хоча не від приниження. Армії наказано скласти зброю, а уряд залишається на місці лише з дозволу сильнішої держави. Ми зберігаємо державу, але ціною гордості та свободи дій."
 siam_dem.5.t:0 "Необхідно сформувати уряд"
 skeptical_towards_industrialization:0 "Скепсис до індустріалізації"
 smie:0 "Servizio Informazioni Militare Etiope"
 social_reformer:0 "Соціальний реформатор"
 south_american_events.17.desc:0 "Нещодавно надійшло несподіване комюніке від [PRU.GetAdjective]их дипломатів. У комюніке містилася пропозиція про умовний мир: ми віддаємо їм Пастасу, а вони виводять свої війська з решти території нашої країни. Нам треба буде ретельно це обміркувати: продовжувати боротьбу за нашу землю чи мати мир, але поступитися частиною нашої території."
 south_american_navy_modifier:0 "Armada Nacional"
 south_american_news.1.b:0 "Це ознаменує нову еру для перуанської держави!"
 south_american_news.5.a:0 "Це, безумовно, змінить баланс сил у регіоні."
 soviet.19.d:0 "Розбіжності в лавах націоналістів призвели до нестабільної ситуації. Їхній лідер, [From.GetLeader], був заарештований у спробі змусити наших ворогів прийняти перемир'я з нами, щоб об'єднати Китай проти зовнішніх ворогів. Хоча ми хотіли би, щоби керівництво Ґоміньдану понесло покарання за свої злочини проти нас, це рідкісна можливість для співпраці та гарантії, що Китай не потрапить до рук іноземних імперіалістів."
 soviet.22.d:0 "Незважаючи на всі зусилля ґоміньданівських генералів досягти перемир'я з лідерами Комуністичної партії, комуністи відмовляються укладати навіть тимчасовий мир, допоки лідер націоналістів живий. Схоже, що бойові дії так просто не закінчаться."
 soviet.29.d:0 "Наші товариші з Французької комуністичної партії досягли значного прогресу. Французький народ готовий приєднатися до Комінтерну."
 soviet.35_threat_LIT:0 "Литва — частина Радянського Союзу"
 soviet_german_friendship:0 "Дружба між СРСР і Німеччиною"
