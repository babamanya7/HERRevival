 CHI_international_instructors_desc:0 "Потреба в пілотах та екіпажах величезна, і ми не можемо навчати їх достатньо швидко. Залучення більшої кількості іноземних інструкторів пришвидшить наші зусилля, щоб підняти більше літаків у повітря."
 CHI_introduce_the_baojia_system_desc:0 "Система Баоцзя використовувалася для організації нашого населення та гарантування його безпеки з давніх часів, і вона виявилася дуже ефективною. Ми повинні розширити її, щоб вона стала основою рекрутингу, оскільки це забезпечить нам постійний потік новобранців."
 CHI_invite_carsun_chang_desc:0 "Хоча західні держави діяли на шкоду [ROOT.GetAdjective]им інтересам, деякі їхні ідеї можуть бути нам корисні. Оскільки Карсун Чан долає прірву між цими ідеями та нашим конфуціанським контекстом, він стане точкою збору для демократичного руху."
 CHI_land_reform:0 "Земельна реформа"
 CHI_light_cruiser_1_desc:0 "The Hairong was a Chinese protected cruiser built in the late 1890s by Germany. The ship was similar to other protected cruisers and subsequent light cruisers produced for China around the turn of the century. Hairong displaced just under 2,700 tons and were armed with three 5.9 in QF guns. "
 CHI_local_alloy_commission:0 "Місцева комісія зі сплавів"
 CHI_long_range_desc:0 "Влучно пущена стріла може закінчити війну ще до її початку. Більші та гучніші двигуни можуть наражати наш екіпаж на ризик, але здатність проєктувати силу ще далі також збільшить наш вплив на світовій арені."
 CHI_maintain_adequate_currency_reserves_tt:0 "Кожні §Y[?CHI_improving_inefficient_economy_mission_time]§! дн., §Y$CHI_inefficient_economy$§! буде покращуватися, доки негативні модифікатори не зникнуть."
 CHI_military_affairs_commission_sea_desc:0 "Основою ефективної армії є належне вище командування. Оскільки Військова рада є нашою найвищою організацією з оборони нації, ми повинні переконатися в її компетентності."
