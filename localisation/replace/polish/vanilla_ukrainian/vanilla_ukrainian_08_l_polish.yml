 RAJ_hostile_takeover_cost_7:0 "Більше ніж §Y7§! контрольовані §YЦивільні фабрики§! (наразі §Y[?actually_controlled_civs]§!)"
 RAJ_hostile_takeover_desc:0 "Усе можна купити, усе. Це лише питання ціни та того, наскільки людина готова опуститися."
 RAJ_imperial_rail_renewal_act:0 "Акт про оновлення імперської залізниці"
 RAJ_instigate_in_sia:0 "Підбурювати в [SIA.GetName]"
 RAJ_keep_calm_and_carry_on_desc:0 "У цю найбільш складну годину ми не похитнемося. [ROOT.GetNameDefCap] повстане як бастіон сили, створюючи знаряддя війни з невтомною рішучістю. Нехай палають печі та співають горни, бо перемога народжується не з комфорту, а з мужності, поту та сталі."
 RAJ_land_clearance_effect_tt:0 "Рішення §H$RAJ_population_decisions$§! тепер дають §G1§! комірку для будівництва.\n$apply_integration_effects_retroactively$"
 RAJ_land_of_the_tillers_desc:0 "Поміщиків немає, але боротьба триває.\nМи перерозподілимо землю та розірвемо останні ланцюги феодалізму — ділянка за ділянкою, село за селом."
 RAJ_light_cruiser_1:0 "Клас «C»"
 RAJ_lions_of_the_great_war_dlc_desc:0 "$RAJ_lions_of_the_great_war_desc$"
 RAJ_local_leaders_investments_infra_chance:0 "[?RAJ_local_leaders_infra_chance|%+]"
 RAJ_local_leaders_investments_mils_tt:0 "Розвиток військової промисловості: \nПобудувати до §G1§! §YВійськової фабрики§!, §G1§! §YІнфраструктури§! та §Y2§! будівельних слотів у державі."
 RAJ_long_range_escorts_desc:0 "Для захисту життєво важливих ліній постачання та місій нам потрібні літаки, здатні супроводжувати бомбардувальники та транспорти на великі відстані. Інвестування в далекобіжний ескорт забезпечує нашу перевагу в повітрі та безпеку операцій далеко за межами наших кордонів."
 RAJ_mahatma_desc:0 "Махатма Ганді, без сумніву, є обличчям руху за незалежність. З ним та Джавахарлалом Неру ми розірвемо ярмо, яке зв'язує нас із Британією."
 RAJ_manipulate_army_statistics_tt:0 "Створює нерегулярні дивізії з повним особовим складом та обладнанням."
 RAJ_mechanization_of_the_cavalry_desc:0 "Ера кінної війни закінчилася. Механізувавши кавалерію, ми перетворюємо її на сучасну бронетанкову силу, поєднуючи швидкість та вогневу міць, щоб домінувати на полі бою та вести Індію у майбутнє війни."
 RAJ_medium_tank_aa_equipment_3:0 "Comet Marksman"
 RAJ_model_after_soviet_desc:0 "Акцент Радянського Союзу на масовій мобілізації та революційній тактиці пропонує нам план для нашої власної військової еволюції."
 RAJ_mohan_singh:0 "Моган Сінґх"
 RAJ_nav_bomber_equipment_3:0 "Fairey Barracuda"
 RAJ_obtain_british_naval_contracts:0 "Отримати британські військово-морські контракти"
 RAJ_planned_economy_desc:0 "Сильна нація потребує сильної економіки, керованої метою та баченням. Прийнявши планову економіку, ми можемо ефективно розподіляти ресурси, надавати пріоритет промисловому зростанню та забезпечити справедливий розвиток для всіх громадян."
 RAJ_princely_state_donations:0 "Внесок тубільних князівств"
 RAJ_prioritize_army_cargo_desc:0 "Залізнична мережа — це основа військової логістики. Надаючи пріоритет армійському вантажу, ми забезпечуємо наших солдатів зброєю, ресурсами та підкріпленнями, необхідними для швидкої та рішучої перемоги."
 RAJ_purchase_cruisers_and_dreadnoughts_desc:0 "$SMB_purchase_cruisers_and_dreadnoughts_desc$"
 RAJ_raf_funding_desc:0 "Королівські ВПС Індії отримають додаткове фінансування й оснащення з Великої Британії."
 RAJ_reveal_famine_timeframe_tt:0 "Показує, скільки місяців залишилося до завершення голоду"
 RAJ_rifle_factory_ishapore_west_bengal:0 "Збройова фабрика Ішапур"
 RAJ_screening_effort_desc:0 "Індія відіграє важливу роль у захисті південного маршруту, що веде до Суецького каналу. Загородження та супровід суден дозволять бійцям та важливим вантажам дістатися до європейського та африканського театрів бойових дій."
 RAJ_seek_international_recognition_desc:0 "Щоб легітимізувати нашу боротьбу, ми повинні забезпечити міжнародне визнання нашої справи. Згуртувавши глобальну підтримку, ми можемо ізолювати [ENG.GetAdjective] та зміцнити наші претензії на суверенітет в очах світу."
 RAJ_smiling_buddah:0 "Усміхнений Будда"
 RAJ_stir_unrest_in_the_north_desc:0 "На населення північних районів Раджу непропорційно вплинув контроль над цінами. Вони, як суха трава, усе, що нам потрібно, — це іскра, щоб запалити вогонь."
 RAJ_support_naval_invasions_desc:0 "Ця війна буде вестися не лише на суші та в повітрі, але й на морі. Так само, як важливо мобілізувати наші сухопутні сили, ми повинні підготувати наш флот для підтримки планів наших союзників щодо військово-морських вторгнень."
 RAJ_through_the_wakhan_corridor:0 "Через Ваханський коридор"
 RAJ_through_the_wakhan_corridor_desc:0 "$RAJ_skibedi_san_ma_desc$"
 RAJ_trainer_planes:0 "Навчальні літаки"
 RAJ_uranium_tipped_bullets_tt:0 "§Y$category_all_infantry$§!:\n    Атака на броньовані цілі: §G+25%§!\n    Пробиття броні: §G+100%§!\n§Y$category_cavalry$§!:\n    Атака на броньовані цілі: §G+10%§!\n    Пробиття броні: §G+40%§!\n§Y$category_artillery$§!:\n    Пробиття броні: §G+100%§!\n§Y$category_tank_destroyers$§!\n    Атака на броньовані цілі: §G+15%§!\n    Пробиття броні: §G+20%§!\n§Y$anti_tank$§!:\n    Атака на броньовані цілі: §G+10%§!\n    Пробиття броні: §G+20%§!\n§Y$mot_anti_tank_brigade$§!:\n    Атака на броньовані цілі: §G+10%§!\n    Пробиття броні: §G+20%§!\n§Y$anti_air$§!:\n    Протиповітряна атака: §G+10%§!\n§Y$mot_anti_air_brigade$§!:\n    Протиповітряна атака: §G+10%§!"
 RAJ_war_taxes_desc:0 "Ціна війни вимагає спільних жертв. Запровадивши військові податки, ми можемо фінансувати наші військові кампанії та забезпечити ресурси, необхідні для перемоги. Вільна Індія варта кожної рупії."
 RAJ_womens_auxiliary_corps_desc:0 "Створивши Жіночий допоміжний корпус, ми розширюємо можливості жінок служити на критично важливих допоміжних посадах, зміцнюючи наші збройні сили. Їхній внесок посилить логістику, зв'язок та операції, доводячи, що кожен індієць має роль у забезпеченні нашого майбутнього."
