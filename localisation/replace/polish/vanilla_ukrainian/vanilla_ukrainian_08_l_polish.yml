 news.240.d:0 "[AST.GetAdjective]ий і [HOL.GetAdjective]ий уряди сьогодні оголосили про укладення «Пакту про спільну співпрацю та оборону», згідно з яким [HOL.GetAdjective]і колоніальні володіння в Південно-Східній Азії будуть передані під захист [AST.GetAdjective]их збройних сил. Договір був підписаний нідерландським губернатором Індонезії і [AST.GetLeader], який оголосив, що угода включатиме повне колоніальне управління, зважаючи на «віддалену та складну ситуацію в Європі». [HOL.GetAdjectiveCap]ий уряд не зробив жодної заяви щодо договору."
