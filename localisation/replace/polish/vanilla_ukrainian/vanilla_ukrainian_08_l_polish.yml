 news.409.desc:0 "У відчайдушній спробі зупинити наступаючі [JAP.GetAdjective]і сили [FROM.GetAdjective]а армія зруйнувала мережу гребель і захисних споруд уздовж Жовтої річки.\n\nВнаслідок цього зливові паводки призвели до переміщення величезної кількості сільського населення, якому було надано лише коротке вікно для підготовки.\n\nЗалишається з'ясувати, чи зможе цей акт дати [FROM.GetAdjective]им військовим достатньо часу на перегрупування і підготовку до подальшої битви."
 news.65.d:0 "Після падіння останнього оплоту націоналістів громадянська війна в Іспанії завершилася.\n\nРеспубліканці здобули перемогу, і для Іспанії почалася нова ера.\n\nКраїна сильно постраждала в ході війни, її доведеться відбудовувати."
