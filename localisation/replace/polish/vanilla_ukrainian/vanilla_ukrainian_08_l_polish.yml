 JAP_VICTORY_POINTS_10115:0 "Сейшю"
 JAP_a_mongol_volunteer_army_desc:0 "Маньчжурська армія має у своєму складі Монґольську армію незалежності, що складається з монґолів та бандитів під керівництвом [ROOT.GetAdjective]их радників. Ми повинні створити подібну армію, повністю підконтрольну нам, з метою згодом відправити їх до [MON.GetNameDef] і звільнити їхню батьківщину від ворожих сил."
 JAP_a_new_take_on_state_shintoism_desc:0 "Релігійна політика і політична теорія, що виникли за часів уряду Мейджі, відомі як Джінджа хішюкьорон, просувають ідею, що шінтоїстські святині є світськими за своєю природою, а не релігійними, і що шінто — це просто світський набір японських національних традицій. Ми повинні продовжувати просувати цю теорію, щоб використати цей рух на власну користь."
 JAP_ally_afghanistan_desc:0 "Король Афганістану править різними афганськими племенами в одному з найсуворіших гірських регіонів світу. Можливо, він прислухається до голосу розуму. Ми повинні спробувати відправити офіційну делегацію до Кабула, щоб переконати його приєднатися до нас у справі звільнення Азії."
 JAP_amphibious_tank_equipment_1:0 "Type 2 Ka-Mi"
