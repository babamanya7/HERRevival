 denmark_overlord_events.24.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], який вважає, що [FROM.GetRulingIdeology] — краща з ідеологій, відмовляється дослухатися до голосу розуму та зробити все для блага своєї країни. [FROM.GetRulingIdeologyNoun] славиться жагою до влади своїх проповідників, і нам не слід надто дивуватися данській відповіді. Мабуть, доведеться показово з ними розправитися..."
 denmark_overlord_events.25.desc:0 "Ми рішуче відкинули [FROM.GetAdjective]і вимоги, адже [ROOT.GetRulingIdeologyNoun_RU_lower_Nom] для нас — не просто ідеологія, а спосіб життя. Утім, нам слід було очікувати, що таку відповідь не приймуть. [FROM.GetAdjectiveCap][FROM.GetRulingIdeology_RU_Adj_Ending_YyAya] [FROM.GetRulingIdeologyNoun_RU_lower_Nom] не знає меж і обов'язково постарається пробитися до влади."
 denmark_overlord_events.7.a:0 "Ці закони діятимуть недовго — ми про це подбаємо!"
