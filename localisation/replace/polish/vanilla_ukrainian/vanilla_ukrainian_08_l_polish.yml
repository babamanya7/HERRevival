 ICE_a_new_yggdrasill_desc:0 "Тепер, коли люди знають про своє велике походження, ми мусимо прагнути будувати великі проєкти та покращувати острів Ісландія, щоб він відповідав Мідґардюру та Іґґдрасілю з легенди!"
