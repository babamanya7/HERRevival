 SOV_merge_vef_plant_flag:0 "$generic_has_already_completed_this_trait$"
 SOV_modernize_aircraft_facilities_desc:0 "Найкращий літак у світі скоро стане непотрібним, якщо йому доведеться злітати з вибоїстих злітно-посадкових смуг і обслуговуватися в дірявих ангарах. Щоб забезпечити найкращу продуктивність, ми також мусимо мати найкращу можливу інфраструктуру."
 SOV_my_brothers_keeper_desc:0 "Стара династія Романових мала династичні зв'язки з багатьма іншими знатними родинами. Деякі з них досі при владі, деякі втратили свої престоли. Тепер, коли ми відновили власну монархію, ми повинні подбати про те, щоб і в цих інших країнах були обрані правильні правителі."
 SOV_nkvd_primacy_desc:0 "Поки ми не будемо впевнені, що всі вороги держави враховані, ми мусимо продовжувати покладатися на НКВС для захисту революції."
 SOV_ocean_going_navy_desc:0 "Хоча Союз займає більшу територію, ніж будь-яка інша країна на планеті, світовим океаном ще належить правити нашим кораблям. Важкі броньовані лінкори будуть частиною нашого майбутнього океанського флоту."
 SOV_opposition_support_high_increase_effect_tt:0 "Народна підтримка повстання збільшиться на §G+2%§!"
 SOV_paranoia_high_decrease_effect_tt:0 "£SOV_paranoia_text_icon Політична параноя зменшується на [?SOV_paranoia_high_decrease|G]"
 SOV_paranoia_increase_based_on_unit_leader_level_effect_tt:0 "£SOV_paranoia_text_icon Політична параноя збільшується в залежності від рівня командирів, які не були піддані чистці: [?SOV_unit_leader_level|R]"
 SOV_patriarch_of_all_russia:0 "Патріарх Усія Русі"
 SOV_pc_of_mortar_armament_name_alt:0 "Міністерство мінометного озброєння"
 SOV_penal_units_raised_flag:0 "Останній раз, коли піднімали штрафні частини"
 SOV_plan_start_of_uprising_odessa:0 "Створити секретний штаб у області [FROM.GetName]"
 SOV_policies_of_collective_security_opinion:0 "Політики колективної безпеки"
 SOV_policy_of_individual_security_desc:0 "У світі є мало друзів і багато ворогів. Ми не мусимо надто перейматися тим, з ким ми укладаємо угоди — або вони, або ми все одно розірвемо ці угоди, як тільки вони відслужать своє."
 SOV_promote_ideology_rallies_baltic:0 "Заохочувати ідеологічні мітинги в державі [FROM.GetNameDef]"
 SOV_propaganda_transport:0 "Транспорт — рідний брат Червоної армії"
 SOV_purged_junior_army_officers_1_desc:0 "Значну кількість молодших офіцерів армії було заарештовано НКВС за звинуваченням у заколоті, шкідництві та антирадянщині. Втрата багатьох досвідчених офіцерів і ветеранів минулих війн призвела до небезпечного розладу Червоної армії."
 SOV_raid_trotskys_villa_tt:0 "Група озброєних вбивць спробує вбити Троцького, здійснивши наліт на його віллу.\n\nШанси на успіх у вбивстві Троцького зростуть, якщо §Y[FROM.GetFlag][FROM.GetNameDefCap]§!:\n- Має високу підтримку комуністів\n- Перебуває в альянсі з державою [ROOT.GetFlag][ROOT.GetNameDefCap]\n- Підпадає під дію держави [ROOT.GetFlag][ROOT.GetNameDefCap]\n"
 SOV_recruit_admiral_opposition_desc:0 "Ми повинні використовувати наші зв'язки в Червоному флоті, щоб спробувати переконати високопоставлених офіцерів перейти на наш бік у разі громадянської війни."
 SOV_reinforce_southern_naval_bases:0 "Укріпити південні морські бази"
 SOV_reinstitute_the_mestnichestvo:0 "Відродити місництво"
 SOV_rejected_our_demands:0 " Відхилили наші вимоги"
 SOV_russian_corporate_state_desc:0 "Майбутнє Росії полягає не в класовому конфлікті, а в класовій співпраці. Для цього держава повинна створити національні союзи, щоб узгодити інтереси праці та капіталу, і через них регулювати виробництво."
 SOV_send_supporters_abroad_desc:0 "Найбезпечніше місце — якомога далі від сталінських поплічників. Нам потрібно вивезти ключових людей з країни в безпечне місце, поки не настане час повернутися і закінчити розпочату роботу."
 SOV_sinkiang_mineral_prospection_desc:0 "[619.GetName], у південно-західній частині колишнього Сіньцзяну, багатий на корисні копалини, але наразі розробляються лише декілька родовищ, причому дуже архаїчним і неефективним способом. Ми мусимо шукати ресурси і поліпшувати інфраструктуру регіону, щоб полегшити експлуатацію."
 SOV_socialist_emulation:0 "Соціалістичне наслідування"
 SOV_soviet_airforce_aircraft_production_focus_tt:0 "§YУсі типи літаків§!: £production_cost Вартість виробництва: §G-5.00%§!"
 SOV_soviet_airforce_dynamic_modifier_alt:0 "Російські ВПС"
 SOV_spanish_supported_faction_default:0 "підтримана іспанська фракція"
 SOV_steel_casting_industry_desc:0 "Наша металургійна промисловість була в авангарді нашого промислового зростання, але вона може просунутися ще далі завдяки впровадженню нових методів виробництва."
 SOV_strat_bomber_equipment_3_short:0 "Ту-4"
 SOV_strengthen_heavy_industry:0 "Посилити важку промисловість"
 SOV_strengthened_relations_with_us_trade:0 "$SOV_strengthened_relations_with_us$"
 SOV_strong_trade_unions_idea:0 "Сильні профспілки"
 SOV_submarine_1_desc:0 "Amerikansky Golland (American Holland) class submarines were built in Canada, then delivered to Russia during WWI, where they were finally assembled. They were the direct copy of the successful Holland type submarines. They were designed to be good sea boats well-armed for their time."
 SOV_submarine_2_desc:0 "The Series V submarines of the Schuka class were the second-most numerous submarines of the Soviet Navy. Their large number came from their deployment to the four fleets of the Soviet Union: Black Sea, Baltic, Northern and Pacific. They were medium-sized patrol submarines with good torpedo armament and seaworthiness."
 SOV_support_the_kuomintang:0 "Підтримати Ґоміньдан"
 SOV_the_eyes_fear_desc:0 "Перед нами стоїть непросте завдання. Ми маємо взяти на себе владу, яка вкорінювалася десятиліттями, і яку підтримуватиме значний відсоток населення. Але ми знаємо, що потрібно робити, і все, що нам залишилося, — це зробити це."
 SOV_the_modern_war_in_the_skies:0 "Сучасна війна в небі"
 SOV_tranformation_of_nature_desc:0 "Сталінський Великий план перетворення природи має бути втілений у життя. Навколишнє середовище мусить бути сформоване і відлите в масовому масштабі, щоб працювати на благо народу."
 SOV_wreckers_sabotage_railways_tt:0 "Контрольовані ворогом §Yзалізниці§! отримають пошкодження"
 SOV_zinovyev:0 "Зінов'єв"
