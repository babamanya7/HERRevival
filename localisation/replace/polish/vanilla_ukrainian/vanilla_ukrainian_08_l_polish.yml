 IRQ_constitutional_monarchy_iraq_DEF:0 "Королівство Ірак"
 IRQ_develop_the_kuwaiti_port_desc:0 "З Кувейтом під нашим законним контролем, наша берегова лінія суттєво збільшилася. Це надало нам можливість ще більше розширити наші військово-морські об'єкти, щоб підтримувати ще більшу присутність у Перській затоці."
 IRQ_foreign_industrial_monopolies:0 "Іноземні промислові монополії"
 IRQ_form_the_independent_mechanized_brigade:0 "Сформувати Незалежну механізовану бригаду"
 IRQ_generic_communist_revolutionary:0 "Arshad al Umari"
 IRQ_ghazi_i_desc:0 "Зійшовши на трон у 1933 році після смерті Фейсала I, король Газі здобув репутацію противника британського впливу в Іраку, незважаючи на десятиліття зв’язків між династією Хашимітів та Сполученим Королівством. Ходять чутки, що молодий король чекає нагоди, щоб силою вигнати британців і розширити вплив своєї армії на сусідні стратегічні території."
 IRQ_heavy_industry_investments:0 "Інвестиції у важку промисловість"
 IRQ_infantry_equipment_0:0 "Rifle No.1 MkIII"
