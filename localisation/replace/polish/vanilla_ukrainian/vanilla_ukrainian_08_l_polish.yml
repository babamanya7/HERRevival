 SEA_PHI_political_events.12.a:0 "Наші зусилля принесли плоди"
 SEA_PHI_political_events.19.desc:0 "Наша делегація до [SOV.GetNameDef] щойно повернулася, але вони принесли погані новини — нам відмовили у вступі до Комінтерну. Принаймні на даний момент ми стоїмо одні проти припливів темряви."
 SEA_PHI_political_events.19.t:0 "[FROM.GetName] відмовляє у вступі до Комінтерну"
 SEA_PHI_political_events.47.desc.2:0 "Наші дипломати, відправлені до [FROM.GetNameDef], швидко повернулися після того, як їхній уряд відмовився обіцяти допомогу в наших кроках до незалежності. Схоже, вони більше зацікавлені в тому, щоб стати нашим новим сюзереном, аніж допомогти нам стати незалежними."
 SEA_PHI_political_events.5.desc:0 "Наша розумна пропозиція щодо торговельної угоди з [FROM.GetNameDef] була відхилена. Схоже, що угоди з іншими торговельними партнерами або геополітичні міркування призвели до того, що вони діяли всупереч як нашим, так і своїм власним інтересам."
 SEA_PHI_political_events.50.desc:0 "У відповідь на нашу декларацію незалежності [FROM.GetNameDef] не надали офіційної відповіді та почали переміщувати війська до найближчих баз для здійснення інтервенції."
 SEA_PHI_political_events.53.t:0 "$USA_dwight_d_eisenhower$ повертається з [PHI.GetName]"
 SEA_PHI_political_events.61.a:0 "Вони знають, що краще для країни"
 SEA_PHI_political_events.68.t:0 "[FROM.GetName] не підписує договір про взаємодопомогу"
 SEA_PRC_faction_events.31.a:0 "Мудрий крок"
 SEA_PRC_faction_events.31.t:0 "[FROM.GetNameDefCap] погоджується на наш запит"
 SEA_PRC_faction_events.73.desc:0 "[FROM.FROM.GetNameDefCap] погодився звільнити [FROM.GetNameDef] за умови, що вони приєднаються до нашої нової фракції, і [FROM.GetNameDef] погодився. Церемонію привітання заплановано провести в [ROOT.Capital.GetName]."
 SEA_PRC_faction_events.73.t:0 "[FROM.FROM.GetNameDefCap] погоджується — [FROM.GetNameDef] приєднується до [PRC.GetFactionName]"
 SEA_PRC_fourth_army_incident.7.a:0 "У цьому можна звинувачувати лише їхню непокору"
 SEA_PRC_misc_events.5.t:0 "Хе Лун та Друга фронтова армія прибули до [ROOT.capital.GetName]"
 SEA_PRC_political_events.10.a:0 "Яка прикрість"
 SEA_PRC_political_events.6.t:0 "[FROM.GetName] погоджується прийняти нас до [FROM.GetFactionName]"
 SEA_PRC_political_events.8.a:0 "Ми все одно не хочемо втручатися"
 SEA_china.18.t:0 "[From.GetName] надав нам права на ресурси"
 SEA_china.9.a:0 "З часом вони про це пошкодують"
 SEA_china_warlords.1.tt:0 "§RМи станемо маріонеткою [FROM.GetName]§!"
 SEA_china_warlords.3.desc:0 "Ультиматум відхилено. У зухвалому акті непокори [FROM.GetLeader] дав зрозуміти, що його народ не підкориться. Оскільки наших посланців відіслали, дипломатія поступиться місцем війні."
 SEA_china_warlords.3.t:0 "[FROM.GetName] відмовляє"
 SEA_imperial_influence_events.220.desc:0 "Флот висунув свої вимоги. Не маючи централізованого контролю та автономії діяти самостійно, вони бажають, щоб на посаду було призначено нового командувача флоту, що також послужить посиленню їхнього впливу на [GetImperialInfluenceRulerTitle]. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.430.desc:0 "Лідери партії висунули свої вимоги. Вони бажають, щоб ми скоригували економічну стратегію нашої нації, і щоб інвестиційні та торговельні стратегії були зміщені на користь інтернаціоналізму та кращих відносин з нашими торговими партнерами. Незважаючи на привід простого зміцнення нашої економіки, вони, очевидно, також хочуть посилити свій контроль і вплив на [GetImperialInfluenceRulerTitle]. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.430.t:0 "Фракція Цивільного уряду бажає змін у законі про торгівлю"
 SEA_japan_foreign_policy.122.a:0 "Здається, в [From.GetNameDef] щось затівається..."
 SEA_japan_foreign_policy.132.b:0 "Ми будемо битися до останнього!"
 SEA_japan_foreign_policy.17.t:0 "[From.GetNameDefCap] відхиляє наші вимоги"
 SEA_japan_foreign_policy.19.desc:0 "[FROM.GetLeader] люб'язно прийняв нашу пропозицію офіційно оформити союз між нашими країнами і вже розпочав ініціативи щодо інтеграції в нашу сферу. Сьогодні день для святкування!"
 SEA_japan_foreign_policy.29.t:0 "Результати Суйюаньської кампанії"
 SEA_japan_foreign_policy.37.desc:0 "[FROM.GetLeader] вирішив прийняти нашу пропозицію і дозволить нашим радіостанціям залишатися в [FROM.GetAdjective]ому ефірі. Вони також дозволили нашим промисловцям відкривати там свої підприємства."
 SEA_japan_foreign_policy.55.desc:0 "Сили, що належать армії Внутрішньої Монґолії, були помічені під час скупчення на нашому південному кордоні. Схоже, вони можуть готуватися до вторгнення на нашу територію, хоча їхні точні цілі залишаються невизначеними."
 SEA_japan_foreign_policy.67.a:0 "Дайте їм відсіч, знищіть усіх зрадників!"
 SEA_japan_foreign_policy.79.a:0 "Так, це піде нам на користь"
 SEA_japan_foreign_policy.8.desc:0 "Нарешті, після довгих роздумів, делегація з [FROM.GetNameDef] вирішила підписати переглянуті документи, які ми їм представили, уникнувши військового втручання, але втративши при цьому свою незалежність. Тепер ми повністю готові вдарити на південь!"
 SEA_japan_foreign_policy.84.a:0 "Можливо, повторна ізоляція піде нам на користь..."
 SEA_japan_foreign_policy.87.t:0 "[FROM.GetAdjective]а анексія"
 SEA_japan_popup_events.19.desc:0 "Після вбивства ще одного японського офіцера в Шанхаї ми отримали ультиматум, у якому йдеться, що якщо ми повністю не виведемо війська з регіону, вони атакують протягом тижня. \n\nЯк нам відповісти?"
 SEA_japan_popup_events.34.desc:0 "Багато наших політичних мислителів розмірковують про те, що люмпен-пролетаріат є основним тілом нашої революції, і що народ айнів також входить до цієї групи. Крім того, вони вважають, що айни жили в первісно-комуністичній системі, і вважають їх гідними бути «лідерами комуністичної революції». Однак зараз постає питання: яким чином вони мають ними бути? Чи має це відбуватися шляхом інкорпорації їхніх традицій у наше соціалістичне суспільство, чи шляхом надання автономії народу айнів?"
 SEA_japan_popup_events.49.a:0 "Здається, привид мілітаризму все ж переслідує нас..."
 SEA_japan_popup_events.7.a:0 "Ясухіто займе його місце"
 SEA_japan_popup_events.8.a:0 "Масакі популярніший серед людей"
 SEA_warlords.2.t:0 "[FROM.GetNameDefCap] залишається непокірним"
 SEA_warlords.52.b:0 "У нас є інші плани щодо [FROM.GetNameDef]"
 SEA_warlords.6.t:0 "[FROM.GetLeader] просить допомоги"
