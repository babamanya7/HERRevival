 ENG_alliance_with_germany_tt:0 "Половина поточної підтримки §Yдемократії§! буде застосована як штраф до §Rстабільності§!:\n"
 ENG_appeal_to_imperial_loyalists_tt:0 "Відкриває доступ до рішень §Y$ENG_appeal_to_imperial_loyalists$§!, які дозволяють улаштувати пробританські громадянські війни в колишніх домініонах.\n"
 ENG_blackshirt_march_in_lothian_desc:0 "Тепер готується великий марш чорносорочників у Лотіані. Він, безперечно, приверне на наш бік місцеве населення."
 ENG_blackshirt_march_in_west_midlands_desc:0 "Тепер готується великий марш чорносорочників у Західних Мідлендах. Він, безсумнівно, приверне на наш бік місцеве населення."
 ENG_carrier_2_desc:0 "Авіаносець Ark Royal став першим подібним судном, побудованим відповідно до обмежень Вашинґтонського морського договору. Це перше судно, на якому ангари і польотна палуба були невід'ємною частиною корпусу. Сконструйований у 1934 році, судно добре броньоване та озброєне. Він мав велику кількість літаків і мав достатню дальність і швидкість, щоби не відставати від основних сил Королівського флоту."
 ENG_communism_subject_DEF:0 "Соціалістична республіка Великої Британії"
 ENG_crewe_works_organization:0 "Crewe Works"
 ENG_eliminate_the_upper_class_tt:0 "Аристократів-фельдмаршалів, -генералів і -адміралів буде усунуто.\n"
 ENG_impose_martial_law_on_canada_desc:0 "Народ Канади введений в оману, і його потрібно захистити від самого себе. Ми відкриємо йому очі і візьмемо владу до своїх рук."
 ENG_infantry_equipment_2_short:0 "Sten Mk II"
 ENG_light_cruiser_2_desc:0 "Легкі крейсери типу «Southampton» були підкласом крейсерів класу «Town» і були розроблені для протистояння японським крейсерам типу «Mogami». Ці кораблі були добре броньовані, мали добру швидкість і дальність польоту, а також мали потужне озброєння з дванадцяти 6-дюймових гармат у чотирьох потрійних баштах. Вони були основою для багатьох наступних проєктів легких крейсерів РН воєнного часу."
 ENG_light_tank_artillery_equipment_3:0 "Bishop"
 ENG_max_horton:0 "Макс Гортон"
