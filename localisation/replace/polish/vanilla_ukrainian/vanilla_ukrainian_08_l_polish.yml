 mountaineers_desc:0 "Бойові дії в горах пов'язані з високою небезпекою для піхоти, але часом їх не уникнути. Провівши серед наших солдатів спеціальну підготовку для ведення бою в горах, ми мінімізуємо ризик."
 mtg_britain.113.d:0 "Перемігши в громадянській війні і знову об'єднавши свою батьківщину, лідери держави [From.GetNameDef] тепер хочуть воз'єднати всю імперію і просять, щоби ми направили їх і підтримали в цьому починанні."
 mtg_britain.22.t:0 "Вотум недовіри"
 mtg_britain.34.a:0 "Нехай почнеться відновлення."
 mtg_britain.36.a:0 "Чудова ідея! Ми згодні."
 mtg_britain.84.a:0 "Оборона імперії залежить від усіх нас."
 mtg_netherlands.10.d:0 "П'ятий кабінет Колейна, як і його попередники, зазнав краху, і державному міністру Дірку Яну де Гееру запропонували взяти на себе формування нового уряду. Востаннє він обіймав офіційну посаду в 1933 році і довів, що здатний керувати країною у мирний час, але зараз, в умовах наростаючої напруженості, неясно, як новий міністр-президент керуватиме державою під час війни, яка здається все більш імовірною."
 mtg_netherlands.13.d:0 "З метою збереження миру і визнаючи наші інтереси в багатому ресурсами регіоні, держава [From.GetNameDefCap] запропонувала своє рішення. Замість передачі нам контролю над регіоном вони можуть дати виняткові права на ресурси, що видобуваються."
 mtg_netherlands.14.t:0 "Королева змушує піти у відставку міністрів-поразників"
 mtg_netherlands.26.d:0 "[HOL.GetAdjective] уряд попросив, щоби ми надали захист Вест-Індії. В даний час, коли їхня військова міць ослаблена, вони побоюються нападу і стверджують, що конфлікти в їхній сфері інтересів суперечать також і нашим інтересам."
 mtg_netherlands.29.a:0 "Передати їм піхотне спорядження."
 mtg_netherlands.32.b:0 "Якщо вони хочуть, щоби ми їх захищали, то маємо приєднатися до нас формально."
 mtg_netherlands.4.t:0 "[From.GetNameDefCap] вимагає від нас захистити острови Ей-Бі-Сі"
 mtg_netherlands.51.d:0 "В останні тижні спостерігається нестача розвідданих для розробки відповідного плану бойових операцій. Дізнавшись про це на нещодавній нараді штабу, принц Бернард наполягав на тому, щоб використовувати свої особисті зв'язки в державі [GER.GetNameDef] для надання нам настільки необхідних відомостей."
 mtg_netherlands.55.a:0 "Вражаюче досягнення."
 mtg_netherlands.6.t:0 "[From.GetNameDefCap] відмовляється захищати острови Ей-Бі-Сі"
 mtg_netherlands.7.t:0 "[From.GetNameDefCap] вимагає креслення лінійного крейсера"
 mtg_netherlands.8.d:0 "[From.GetNameDefCap] вирішує поділитися з нами своїми кресленнями лінійного крейсера класу «Scharnhorst»."
 mtg_news.12.t:0 "[HOL.GetName] зберігає торговий нейтралітет"
 mtg_news.19.b:0 "Це крок у минуле."
 mtg_news.20.a:0 "Німці надали нам велику послугу."
 mtg_news.29.desc:0 "[From.GetAdjective] уряд відкинув [ENG.GetAdjective] ультиматум, що вимагає вільного проходу [ENG.GetAdjective] військ по території країни, а також значного контролю над її внутрішніми справами. [From.GetLeader] заявляє, що уряд очікує [ENG.GetAdjective] заходів у відповідь і армія приведена в стан повної бойової готовності."
 mtg_news.31.t:0 "[ENG.GetName] вводить воєнний стан у державі [From.GetName]"
 mtg_news.32.a:0 "Справа зроблена."
 mtg_news.33.a:0 "Ми робимо те, що маємо."
 mtg_news.34.c:0 "Це перемога у класовій боротьбі!"
 mtg_news.34.t:0 "[ENG.GetName] виганяє королівську сім'ю"
 mtg_news.40.a:0 "Ми йдемо по їхній душі."
 mtg_news.57.b:0 "Це велика відповідальність."
 mtg_news.57.t:0 "Створення домініону Північна Америка"
 mtg_news.6.desc:0 "\nПісля кількох місяців кровопролиття Друга громадянська війна в США, що забрала тисячі життів, закінчилася. Спроба південних штатів вийти з Союзу провалилася. Багато спостерігачів вказують на паралелі з Першою громадянською війною. Знову індустріальна потужність північних штатів жителів півдня \n\n[USA.GetLeader] і його уряд тепер мусять вирішити важке завдання реінтеграції штатів, що відкололися, в державу [USA.GetNameDef]. покарання для повстанців."
 mtg_news.64.a:0 "Всі наші народи об'єдналися, щоби захищати батьківщину."
 mtg_news.64.desc:0 "Перед лицем ймовірної зовнішньої загрози уряди країн Бенілюксу оголосили про термінове об'єднання як урядів, так і армій своїх держав заради їх народів. Тепер інвестиції в промисловість і планування оборони під [From.GetOldAdjective]им управлінням стануть важливішими за внутрішні справи. Передбачається, що спільна армія буде достатньо сильною, щоб реагувати на будь-які можливі загрози суверенітету нового державного об'єднання."
 mtg_usa_civil_war_democrats.22.t:0 "Середній Захід заявляє про підтримку уряду"
 mtg_usa_civil_war_fascists.11.desc:0 "Уряд штату [GetCSAState] доручив поліції припинити всі операції зі збору податків та оцінки майна в штаті. Крім того, губернатор заявив, що всі податки та збори від продажу тютюну та алкоголю скасовуються, і наказав підприємствам не виробляти виплати до державного казначейства.\n\n Водночас він також ухвалив, що підприємства та фізичні особи продовжать подавати податкові декларації владі штату, включаючи ті податки, які раніше необхідно було перераховувати до центрального казначейства."
 mtg_usa_civil_war_fascists.12.desc:0 "Пославшись на погане здоров'я, генерал [From.GetName] подав заяву про відставку. Але ні для кого не секрет, що він приватно висловив занепокоєння політичним курсом країни і навіть стверджував, що не за горами нова громадянська війна в Америці.\n\nСхоже, він керувався не стільки міркуваннями вірності, скільки небажанням виступати зі зброєю в руках проти своїх громадян."
 mtg_usa_civil_war_fascists.202.t:0 "Добровольці з держави [USA_liberated_state.GetName]"
 mtg_usa_congress_medium_support_tt:0 "До §Y10 сенаторів§! і §Y50 представників§! §Gпідтримають§! уряд.\n"
 mtg_usa_foreign_support.5.t:0 "[From.GetNameDefCap] відправляє гвинтівки"
 mtg_usa_foreign_support.7.t:0 "[From.GetNameDefCap] відправляє польові знаряддя"
 mtg_usa_pacific_pacification.3.desc:0 "Уряд держави [From.GetNameDef] відмовився навіть зустрічатися з нашою делегацією, стверджуючи, що між нашими країнами немає жодних невирішених питань. Тим не менш, військовий аташе в регіоні [GET_AUSTRALIA_NEW_ZEALAND_STATUS] доповів про воєнні маневри, що останнім часом почастішали."
