 sp_air_mothership_preference_strength:0 "Міцність і потужніше озброєння"
 sp_air_political_interference_generic_reward_desc:0 "Політики лізуть туди, куди не слід, що призводить до того, що проєкт змушений переробляти вже зроблене з нікому не зрозумілих причин."
 sp_cluster_shells_desc:0 "Кластерні снаряди розкидають по великій території безліч суббоєприпасів, завдаючи максимальної шкоди ворожим військам і техніці."
