 DEN_bop_speak_out_against_warfare_desc:0 "Переозброєння зараз становило б серйозну небезпеку для нашої країни, оскільки це можна було б легко розцінити як ворожу дію з боку найближчих держав. Ми не можемо ризикувати викликати гнів більшого сусіда прямо зараз, оскільки ми не маємо способу захиститися від набагато сильнішої армії."
