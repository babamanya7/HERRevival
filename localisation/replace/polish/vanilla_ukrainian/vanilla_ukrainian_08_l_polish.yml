 ideological_fanaticism_desc:0 "Наші політичні цінності та завдання варті того, щоби за них померти— як раніше люди вмирали за віру. Справжній послідовник має бути готовий прийняти смерть, а тим, хто збився зі шляху, краще приготуватися до неї."
