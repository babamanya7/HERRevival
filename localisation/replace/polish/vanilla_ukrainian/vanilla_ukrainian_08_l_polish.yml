 ICE_taking_the_fight_to_our_enemies:0 "Переносимо боротьбу на наших ворогів"
 ICE_the_ferocity_of_the_fenrir_desc:0 "Фернісульфр, разом із Геллю і Світовим Змієм, — дитина Локі та велетки Анґрбоди. Під час Раґнароку він мав убити Одіна, але не вдалося, незважаючи на його велику силу та лютість. Наші солдати мусимо втілити його суть на на полі бою, щоб перемогти ворога як полем, так і розумом."
 ICE_vinland_desc:0 "Ідея Північноатлантичної імперії народилася з відкриттям Америки ніким іншим, як Лейфом Ейріксоном, який сам мав ісландське походження. На жаль, колонія вікінґів Вінланд загинула, але зараз саме час утілити нашу давню мрію в реальність. В ім'я Одіна!"
