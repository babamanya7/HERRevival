 PAR_radicalize_the_police_desc:0 "Поліція є життєво важливою для підтримання внутрішнього миру, поки армія зосереджена на зовнішніх загрозах, але вона може стати більшим інструментом для підтримки держави. Ми надамо їм більші ресурси і взамін залучимо їх до уряду, і якщо військові чи поліція стануть надто могутніми, ми завжди зможемо налаштувати їх одне проти одного."
