 AST_british_war_cabinet_spirit:0 "Британський військовий кабінет"
 AST_cac_boomerang:0 "CAC Boomerang"
 AST_cac_boomerang_desc:0 "«Boomerang» стане внеском Австралії у розвиток винищувачів та буде страховкою на випадок, якщо припиниться імпорт закордонної техніки. Наші літаки повинні на рівних змагатися з японськими та американськими."
 AST_civil_war_in_nation:0 "Спровокувати революцію в §Y[FROM.GetName]§!"
 AST_colonial_administration_long:0 "Колоніальна адміністрація"
 AST_conscription_level_allowed_all_adults_serve_tt:0 "Розблокувати додатковий рівень §YЗакону про призов§!, який зробить доступним §YУсі дорослі служать§!"
 AST_demand_southwestern_territories:0 "Вимагати Південно-Західні території"
 AST_destroyer_2_desc:0 "$ENG_destroyer_2_desc$"
 AST_diplomatic_events.19.a:0 "[AST.GetNameDefCap] має пережити конфлікти без них."
 AST_diplomatic_events.22.t:0 "Успішні внески до Британського воєнного кабінету"
 AST_diplomatic_events.23.a:0 "Це можна зрозуміти."
 AST_diplomatic_events.33.a:0 "Сподіваємося, вони не потраплять у ворожі руки."
 AST_diplomatic_events.33.t:0 "[FROM.GetNameDefCap] відмовляється надати права на ресурси"
 AST_diplomatic_events.42.a:0 "Майбутнє визначить наслідки."
 AST_diplomatic_events.51.a:0 "Води будуть нашими."
 AST_diplomatic_events.56.desc:0 "Від імені [ENG.GetNameDef], [AST.GetName] стукає в наші двері, вимагаючи передачі африканських територій.\n\n[ENG.GetNameDefCap] налаштована розширити свій контроль в Африці, і якщо ми не схилимося перед австралійською окупацією, вони повернуться на наш поріг зі зброєю."
 AST_diplomatic_events.6.t:0 "Британія відхиляє наш запит"
 AST_diplomatic_events.62.a:0 "Об'єднання не може чекати! Підписати пакт!"
 AST_diplomatic_events.62.b:0 "Це надто небезпечно."
 AST_diplomatic_events.69.desc:0 "Зв'язок між [ENG.GetNameDef] та [AST.GetName] проходить випробування, але остання рішуче налаштована відновити його на повну силу. [AST.GetName] має такі зв'язки та союзників у британському уряді, що її лідери просто не можуть їм відмовити; нації знову ввійдуть до однієї фракції, і Острови та країна на іншому кінці світу знову працюватимуть разом."
 AST_diplomatic_events.72.t:0 "Передача тихоокеанських островів [USA.GetNameDef]"
 AST_domestic_industry:0 "Вітчизняна промисловість"
 AST_election_approaching_cat_desc:0 "Щойно один уряд облаштувався, як наближаються наступні вибори. Демократичні партії хапаються за все, що може підвищити їхню підтримку, сподіваючись, що цього буде достатньо для перемоги, коли відкриються виборчі дільниці, а урни наповняться бюлетенями."
 AST_electrical_grid_expansions:0 "Розширення електромереж"
 AST_generic_fascist_demagogue:0 "Ферґус Фостер Манро"
 AST_heavy_tank_artillery_equipment_3:0 "Churchill Black Prince SP Artillery"
