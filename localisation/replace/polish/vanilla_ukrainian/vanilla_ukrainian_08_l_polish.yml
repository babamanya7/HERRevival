 PER_imperial_events.170.a:0 "Ситуація не на нашу користь..."
 PER_imperial_events.2.desc:0 "Хороші новини! Наш дипломат повернувся з [SOU.Capital.GetCapitalVictoryPointName] з повідомленням, що [SOU.GetNameDef] бажає приєднатися до нас у Пакті про ненапад. Це дозволить нам продовжувати формулювати наші військові плани без втручання набридливих [SOU.GetAdjective]s."
 PER_imperial_events.212.desc:0 "Сьогодні вранці ми отримали повідомлення від [FROM.GetNameDef] про те, що вони рішуче відмовляються від наших вимог. Хоча це створює лише невелику проблему для наших планів, це означає, що нам доведеться забрати цю територію старим способом."
 PER_imperial_events.220.c:0 "Кашані посилить підтримку серед духовенства."
