 AST_mio_trait_kittyhawk_reliability_programme:0 "Програма надійності «Kittyhawk»"
 AST_mio_trait_wirraway_versatility:0 "Універсальність «Wirraway»"
 AST_northern_territory_reconnaissance_unit_desc:0 "Лейтенант авіації та антрополог Дональд Томсон виступав за включення аборигенного населення до збройних сил [AST.GetName], і до нього нарешті прислухаються. Ми доручимо особисто Томсону зібрати розвідувальний підрозділ з людей із місцевими знаннями та навичками виживання в буші для патрулювання навіть найвіддаленіших і найсуворіших наших земель."
 AST_pacific_area_navy:0 "Тихоокеанський флот"
 AST_planned_extraction:0 "Плановий видобуток"
 AST_political_events.2.a:0 "Федеральний контроль розширюватиметься!"
 AST_preemptive_intervention_desc:0 "Активне розширення Японської імперії протягом останнього десятиліття загрожує всім вільним народам у Тихому океані. Ми не чекатимемо, поки японці звернуть свій голодний погляд на нас. Настав час діяти."
 AST_print_the_publicist_upgrade:0 "$AST_print_the_publicist$"
 AST_push_foreign_overlord_out_of_target_tt:0 "Якщо [FROM.GetName] повністю вигнав [?FROM.AST_communist_civil_war_enemy_country.GetName] та його союзників зі своїх земель:"
 AST_referendum_marketing_idea:0 "Прийнято ринкову реформу"
 AST_royal_australian_artillery_desc:0 "Артилерія — цариця полів. Ми маємо розширити наш арсенал великокаліберних знарядь."
 AST_submarine_2_desc:0 "$ENG_submarine_2_desc$"
 AST_tac_bomber_equipment_2:0 "Martin Baltimore"
 AST_the_pacific_pact_desc:0 "Тихоокеанські ініціативи Лайонса у 1934 році налагодили контакт між Австралією та великими азійськими державами, що дозволило нам більше не покладатися на британських чиновників у представленні наших інтересів. Якби ми могли використати ці відносини для забезпечення ненападу азійських держав на Австралію, це стало б кінцевою метою наших дипломатичних зусиль. Це може бути складним завданням, але воно того варте."
 AST_uap:0 "§YУАП§!"
 AST_uap_becomes_ruling_party:0 "§YПартія об'єднаної Австралії§! стає правлячою партією."
 AST_undeniably_ours:0 "Беззаперечно наше"
 AST_undeniably_ours_desc:0 "Незалежно від того, що може дати нам дипломатія, вона ніколи не дасть нам усього. У своєму крихкому стані кордони Вішістської Франції діють радше як рекомендації, і згаяти можливість повністю окупувати їхні землі було б дуже нерозумно. Неминуче настав час для війни."
 AST_vernon_sturdee:0 "Вернон Стерді"
 AST_western_australian_government_railways_desc:0 "Залізниці, що належать державі в Західній Австралії, повинні мати більшу підтримку, ніж будівництво нових автомагістралей. Географія заходу сприяє поїздам, і ми мусимо цим скористатися."
 AST_womens_armed_services_desc:0 "Попри шалений опір, формування жіночих збройних сил буде продовжено. Ми вітатимемо будь-яку допомогу в захисті [AST.GetName] від агресорів, незалежно від статі. Для стимулювання вербування та підготовки вибір директорів для сил має першочергове значення."
 ASY_ADJ:0 "Ассирійськ"
 ASY_neutrality:0 "Ассирія"
 AUS_STATE_75:0 "Мерен"
 AUS_VICTORY_POINTS_6700:0 "Сеґедін"
 AUS_VICTORY_POINTS_9627:0 "Лайбах"
 AUS_a_new_constitution_desc:0 "Наш останній перегляд конституції закінчився катастрофічною травневою конституцією та посиленням влади авторитарного режиму в країні. Ми повинні гарантувати, що подібне більше ніколи не повториться, відновивши суворо демократичну конституцію."
 AUS_architechtual_advancements:0 "Архітектурні досягнення"
 AUS_austrian_empire_fascism_ADJ:0 "Австрійськ"
 AUS_courting_the_princess_of_industry_desc:0 "У нашій країні багато промислових магнатів, які цілком здатні нам допомогти. Серед яких Ельза фон Гутманн, донька засновника Gebrüder Gutmann, яка колись домінувала австрійською торгівлею, виглядає найбільш перспективною. Ми повинні звернутися до неї та запопросити її підтримки."
 AUS_covering_the_phonix_insurances_desc:0 "Якщо повідомити людям, що їхніх улюблених страхувань Phönix більше немає, це мало б кардинальні наслідки для нашої здатності утримувати та покращувати армію. Держава покриватиме страховку, поки Phönix знову не стане на ноги."
 AUS_creditanstalt_bankverein:0 "Creditanstalt-Bankverein"
 AUS_curt_von_jesser:0 "Курт фон Єссер"
 AUS_economic_boom:0 "Економічний бум"
 AUS_emergency_measures:0 "Надзвичайні заходи"
 AUS_extended_workshifts_idea:0 "Подовжені робочі зміни"
 AUS_flight_schools_desc:0 "Для досягнення успіху в повітрі бездоганні літаки вже є чудовим кроком. Але цього недостатньо. Щоб підтвердити наше панування в повітрі, ми також повинні забезпечити найкращу підготовку наших пілотів, щоб вони були готові до будь-якої ситуації, з якою їх зустріне доля. Подібно до того, як ми тренуємо наші наземні підрозділи, ми повинні встановити режим тренувань для наших пілотів."
 AUS_guarantor_is_italy_key:0 "[FROM.GetNameDefCap] відправляє нам генерала і час від часу військового аташе, Еміля Лібіцького, з проханням про допомогу. Він та інші з [FROM.GetAdjective]ого керівництві побачили тривожні тенденції з боку Німеччини, і вони хочуть отримати від нас більш формалізовану підтримку у випадку, якщо їхні оцінки ситуації справді правильні... \n\nЯк сторона, яка підписали Сен-Жерменський договір, ми маємо прийти їм на допомогу... хоча у тексті, ймовірно, можна знайти лазівки."
 AUS_mio_trait_cutting_corners:0 "Зрізання кутів"
 AUS_news_events.6.t:0 "[AUS.GetNameDefCap] реставрує Центральні Держави"
 AUS_news_events.8.a:0 "Нащо це взагалі було зроблено?"
 AUS_osterreichische_sauerwerke:0 "Österreichische Sauerwerke"
 AUS_political_events.26.a:0 "Ну, тоді, бог допоможе."
 AUS_political_events.26.desc:0 "Ми подумали, що [FROM.GetAdjective]ий народ було порозумнішали після того, як нещодавно звернулися до нас по допомогу. Що ж, усі роблять помилки. Коли їм було запропоновано відкликати свої претензії на територію, яка тепер по праву належить нам, вони категорично відмовилися."
 AUS_political_events.26.t:0 "[FROM.GetNameDefCap] відмовляється відкликати свої претензії"
 AUS_political_events.3.a_tt:0 "Рішення §YЗаходів проти аншлюсу§! відкриті"
 AUS_political_events.36.b:0 "Ми будемо відомі світу як Південна Німеччина"
 AUS_political_events.40.b:0 "Нам вони не потрібні."
 AUS_political_events.42.t:0 "[FROM.GetNameDefCap] відмовляє нам"
 AUS_political_events.59.t:0 "[FROM.GetNameDefCap] підтримує доктрину Альфреда Янси"
 AUS_political_events.61.desc:0 "Наш тиск на [FROM.GetAdjective]ий уряд негайно замінити Альфреда Янсу та його дурний оборонний план окупився. Замість повністю антинімецького Янси, Австрія поставила набагато більш прийнятного для нас Франца Беме."
 AUS_political_events.8.desc:0 "[FROM.GetNameDefCap] та їхні політики відхилили нашу пропозицію. Заявляючи, що угода буде однобокою, не принесе їм жодної користі. Також вони додали, що ми самі поставили себе в цю ситуацію своїми діями у Великій війні."
 AUS_political_events.82.t:0 "[FROM.GetNameDefCap] пропонує гарантії"
 AUS_political_events.92.b:0 "У ній все одно 0 сенсу."
 AUS_political_events.99.a:0 "Вони зроблять так, як велимо ми!"
 AUS_politicized_general_staff:0 "Політизація Генштабу"
 AUS_properly_trained_militias_desc:0 "Наші ополченці стали невід’ємною частиною оборони нашої країни, але на даний момент вони не мають офіційної підготовки. Хоча природа ополчення така, що їх повний контроль і підготовка ніколи не будуть можливими, зусилля з навчання прислужаться всім нам."
 AUS_protector_of_the_danube_desc:0 "У зв’язку з постійним погіршенням ситуації, на наших безпосередніх сусідах необхідно вжити заходів для забезпечення довголіття та безпеки всіх наших союзників. Як лідер Дунайської Федерації ця відповідальність має лягти на нас."
 AUS_recently_sent_invite_to_danubian_federation_flag:0 "§Y[ROOT.GetNameDefCap]§! запросила іншу країну в §Y[ROOT.GetFactionName]§!."
 AUS_reforming_the_central_powers_desc:0 "Хоча ми згодні з тим, що участь у військовому альянсі підвищить нашу силу, дивлячись на доступні нам варіанти, здається наче жоден не відповідає нашим стандартам. Під час Великої Війни ми були частиною могутніх Центральних Держав, тож, не маючи кращого варіанту, ми повинні розглянути можливість реінкарнації легендарного союзу."
 AUS_regulate_austrian_finance_sector_tt:0 "Відмикає та спеціалізовує банк як §Yпромисловий концерн§! або для поліпшення §Yбазової ефективності виробництва§!, або для зменшення §Yмножнику заводів для на виробництво споживчих товарів§!. Як альтернатива, банк може спеціалізуватися на §Yобидва§! сектори, однак меншою мірою."
 AUS_reinforcing_the_supply_network:0 "Посилення мережі постачання"
 AUS_sp_land_super_heavy_howitzer:0 "42 cm Haubitze M. 14/16"
 AUS_streamline_production_desc:0 "Великі кораблі мають багато переваг, від простого стримуючого фактору до здатності завдати серйозної шкоди нашим супротивникам. Однак вони також мають серйозний недолік: висока ціна; треба багато як часу, так і матеріалів. Наші корабельні майстри мають ідеї щодо того, як ми могли б пришвидшити виробництво."
 AUS_supporting_italy_in_ethiopia_category_desc:0 "[ITA.GetAdjective]а армія втягнута в другий конфлікт з Ефіопією. Поки цей конфлікт затягується, [ITA.GetAdjective]і сили продовжують слабшати, воюючи з напрочуд добре оснащеним [ETH.GetAdjective]им опором. Цілком можливо, що зовнішні сили зможуть схилити чашу терезів в бік Риму."
 AUS_take_albania:0 "Карт-бланш на Албанію"
 AUS_tighten_control_of_subjects:0 "Контроль маріонеток"
 AUS_unexpected_alliances:0 "Неочікувані побратими"
 AUS_womens_education_initiative:0 "Ініціатива освіти для жінок"
 AUTONOMY_FREEDOM_DEMOTE_COST:0 "Потрібно ще £autonomy_texticon $SCORE|H0$ балів для зниження до цього рівня"
 AVAILABLE_SUB_DOCTRINE:0 "$TRACK_NAME$ — §Hпіддоктрина§!"
 Amaseia:0 "Амасія"
 BAH_fascism:0 "Багамська унітарна держава"
 BAH_neutrality:0 "Багами"
 BALKAN_ENTENTE_FACTION:0 "Балканська Антанта"
 BALTIC_anti_german_plans:0 "Німецькі воєнні плани"
 BALTIC_axis_investments:0 "Просити інвестиції ([GetBalticAxisInvesmentsAdj])"
 BALTIC_belarus_fascism:0 "$NONIDEOLOGYADJ$о-білоруська націоналістична асамблея"
 BALTIC_belarus_uprising:0 "Насувається громадянська війна в Білорусі"
 BALTIC_communist_militancy:0 "Войовничість балтійських комуністів"
 BALTIC_end_swedish_neutrality:0 "Покінчити зі шведським нейтралітетом"
 BALTIC_events.4.a:0 "У нас немає вибору."
 BALTIC_events.502.t:0 "[From.GetNameDefCap] відхиляє пропозицію!"
 BALTIC_finnish_invasion_desc:0 "Фінляндія для нас — втрачений брат, закутий у ланцюгу капіталізму. Звільнити його, як були звільнені країни Балтії, можна лише революцією — зі зброєю в руках."
 BALTIC_german_baltic_industry:0 "Промисловість Балтії та країн Осі"
 BALTIC_international_brigades:0 "Міжнародні бригади"
 BALTIC_trade:0 "Інвестували в балтійську торгівлю"
 BALTIC_united_baltic_ssr_desc:0 "Незважаючи на культурні, мовні та національні відмінності балтійських держав, їх давно об'єднують узи братерства та товариства. Слід визнати, що наші сусіди— такі самі друзі нам, як і рідний [Root.GetAdjective] народ, і що, якщо ми не об'єднаємось в одну республіку робітників, самі робітники від цього лише програють."
 BALTIC_western_revolution_desc:0 "Революція не обмежується країнами Балтії. Майже по всій Європі бідняки батрачать на заводах під капіталістичним гнітом, і лише [Root.GetAdjective] робітники можуть їх звільнити."
 BAL_UNIFIED_democratic:0 "Балтійська федерація"
 BBA_african_union_events.1.b:0 "Нас не цікавить їхній клуб."
 BBA_ethiopia_balance_of_power_events.24.desc:0 "Наша нещодавня хвиля освітніх реформ вже доводить свою успішність. Давні ієрархії в державі [ETH.GetNameDef] все частіше ставляться під сумнів, оскільки молодь вимагає, щоб вони довели свою легітимність. Хоча це викликало напруженість у відносинах між молодшим і старшим поколіннями, здається, що в кінцевому підсумку ставлення зміниться на нашу користь."
 BBA_ethiopia_balance_of_power_events.54.c:0 "Вирішувати проблеми доведеться місцевій владі області [?ROOT.ETH_bop_state.GetName]."
 BBA_ethiopia_communist_events.01.desc:0 "Комуністичне керівництво [ETH.GetName] звернулося до нас по допомогу в боротьбі проти італійських фашистів. Новий режим у [ETH.Capital.GetCapitalVictoryPointName] ще тільки закріплюється при владі, тож, можливо, буде відкритим до нашої зовнішньої політики, якщо ми підтримаємо їх. Втім, це може загострити конфлікт і безперечно розгнівати [ITA.GetName]."
 BBA_ethiopia_communist_events.07.t:0 "[SOV.GetNameDefCap] вимагає припинення війни з [ETH.GetName]"
 BBA_ethiopia_communist_events.29.t:0 "[SOV.GetNameDefCap] успішно посередничає в конфлікті"
 BBA_ethiopia_communist_events.33.b:0 "Це надто ризиковано."
 BBA_ethiopia_communist_events.48.desc:0 "[ETH.GetAdjective] дипломати звернулися до нас із пропозицією миру. Умова пропозиції — відмова від претензій на [ERI.GetAdjective] територію, яку ми втратили на користь [ETH.GetNameDef] під час цього конфлікту. Дипломати також заявляють, що в регіоні буде створено [ERI.GetAdjective]ий уряд. Наскільки незалежним буде цей уряд — ще належить побачити."
 BBA_ethiopia_communist_events.55.desc:0 "Кемпейтай повідомляє, що кілька підривників втекли з-під юрисдикції Імперії на вантажних кораблях, що прямують до Східної Африки. За чутками, серед них були $IA_sakutaro_iwasa$ та $IA_sanshiro_ishikawa$. Ймовірно, вони мають намір приєднатися до революційного руху в [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.08.desc:0 "Незважаючи на наші законні претензії на регіон [550.GetName], [FROM.GetAdjective]ий уряд відмовляється робити будь-які чіткі обіцянки або заяви на підтримку претензій [ROOT.GetAdjective]. Тільки час покаже, чи дозволять вони нам врешті-решт взяти під контроль берегову лінію."
 BBA_ethiopia_exile_events.18.a:0 "Це бодай щось."
 BBA_ethiopia_exile_events.22.a:0 "Може, [647.GetName]?"
 BBA_ethiopia_exile_events.30.desc:0 "[FROM.GetNameDefCap] пропонує нам подати спільну заявку на членство у фракції, опозиційній до [ITA.GetNameDef]. Це суперечило б нашій історичній політиці, але з іншого боку, дозвіл [FROM.GetAdjective]у лідеру залишатися в [ROOT.GetName] вже певним чином її порушив."
 BBA_ethiopia_exile_events.33.desc:0 "На жаль, [FROM.GetName] відхилив [SWE.GetAdjective]о-[ETH.GetAdjective]ий спільний запит на приєднання до [FROM.GetFactionName]. З якихось дивних причин вони відмовилися бачити користь від об'єднаних сил проти [ITA.GetLeader]."
 BBA_ethiopia_exile_events.48.t:0 "[FROM.GetLeader] прийняв наше посередництво"
 BBA_ethiopia_exile_events.53.t:0 "Успішність лобістських зусиль"
 BBA_ethiopia_fascist_events.02.desc:0 "Один із [ETH.GetAdjective]их дворян, $ETH_haile_selassie_gugsa$, який також претендує на трон, звернувся до [ROOT.GetAdjective]ого верховного командування в державі [ETH.GetName]. Дворянин пропонує допомогу проти [ETH.GetLeader] в обмін на контроль над частиною країни після війни. $ETH_haile_selassie_gugsa$, звісно, присягне на вірність $ITA_vittorio_emanuele_iii$, який правитиме замість нього в державі [ETH.GetName]."
 BBA_ethiopia_fascist_events.04.a:0 "Маріонетковий султан нам добре послугує."
 BBA_ethiopia_fascist_events.52.desc:0 "Несподівано держава [FROM.GetName] відкинула наші претензії на володіння колишньою територією в [FROM.GetAdjectiveCap]ому Сомаліленді. Незважаючи на те, що у них є мало засобів для повернення території, здається, вони сповнені рішучості відправити своїх солдатів на смерть проти наших героїчних збройних сил."
 BBA_ethiopia_fascist_events.64.b:0 "Вони не в тому становищі, щоби щось вимагати."
 BBA_ethiopia_industrial_financial_events.2.b:0 "Допоки ми можемо зберегти певну автономію."
 BBA_ethiopia_industrial_financial_events.2.desc:0 "Citing the fact that the economies of [ROOT.GetName] and [FROM.GetName] are so intertwined, and that much of the industry in [ROOT.GetName] is already controlled by [FROM.GetName], [FROM.GetLeader] demands that border stations between the two countries be removed. The control of all foreign policy is to be placed under the control of [FROM.Getname] to ensure maximum protection, coordination, and effficiency. In effect this would mean the end of [ROOT.GetAdjective] independence.\n All this will be done with the the best interest of both countries in mind, [FROM.GetLeader] ensures."
 BBA_italo_ethiopian_war_events.01.b:0 "Нам потрібно бути методичними та обережними."
 BBA_italo_ethiopian_war_events.02.t:0 "Великий італійський наступ"
 BBA_italo_ethiopian_war_events.11.b:0 "Ми не збираємося цього робити."
 BBA_italo_ethiopian_war_events.12.t:0 "[FROM.GetName] відмовляється закривати Суецький канал"
 BBA_italo_ethiopian_war_events.122.desc:0 "Незважаючи на [ROOT.GetAdjective]і успіхи у війні, [FROM.GetAdjective]ий лідер відмовляється змиритися з поразкою. [ROOT.GetLeader] показав світові, що африканська держава може протистояти європейським загарбникам, і це вже сама по собі перемога. Тепер нам потрібно поставити на коліна ще одного."
 BBA_italo_ethiopian_war_events.20.desc:0 "Незважаючи на капітуляцію [ETH.GetAdjective]их сил, [ETH.GetLeader] відмовляється здатися. Ходять чутки, що [ETH.GetLeader.GetSheHe] дозволили створити уряд у вигнанні в [?ETH.host_nation.GetNameDef]. [?ETH.host_nation.GetAdjective]ому уряду був надісланий офіційний протест."
 BBA_italy_anti_colonialism_events.02.desc:0 "Новий уряд держави [FROM.GetName] звернувся до нас з проханням припинити воєнні дії. Здавалося б, після громадянської війни їм вже набридло кровопролиття і боїв."
 BBA_italy_anti_colonialism_events.15.desc:0 "[FROM.GetLeader] нерозумно відхилив запропонований нами оборонний пакт між державами [FROM.GetName] та [ROOT.GetName]. Ця гарантія принесла б стабільність і безпеку обом нашим країнам, але тепер нам доводиться протистояти світові самотужки."
 BBA_italy_anti_colonialism_events.21.b:0 "Це буде непросто!"
 BBA_italy_communist_events.09.t:0 "Антоніо Ґрамші одужує"
 BBA_italy_council_deposes_duce.2.t:0 "Велика рада розглядає пряме втручання"
 BBA_italy_interaction_events.11.b:0 "Що, на їхню думку, дає їм таке право?"
 BBA_italy_interaction_events.18.t:0 "Італія звертається до нас з пропозицією"
 BBA_italy_interaction_events.27.t:0 "Італія просить нас допомогти їм стримати Німеччину"
 BBA_italy_interaction_events.35.desc:0 "[GetItalyWantsMalta]"
 BBA_italy_interaction_events.35.desc_continued_negotiation:0 "Італійці повернулися до нас з черговою вимогою. Тепер вони хочуть отримати у власність острів [116.GetName]. Вони стверджують, що це для того, щоб їм було легше контролювати Середземне море. Якщо ми їм його віддамо, вони заявляють, що тимчасово платитимуть нам за наші зусилля."
 BBA_italy_interaction_events.50.b:0 "Ніяких угод з цими злочинцями не буде!"
 BBA_italy_interaction_events.666.t:0 "Регіон [454.GetName] або війна"
 BBA_italy_interaction_events.8.desc:0 "[ITA.GetLeader] від держави [ITA.GetNameDef] надіслав нам ультиматум, вимагаючи, щоб ми дозволили [ITA.GetName] окупувати регіон Далмація. Якщо ми не виконаємо вимоги [ITA.GetLeader], ми, ймовірно, будемо мати справу з військовим конфліктом."
 BBA_italy_interaction_events_news.3.desc:0 "Французи на прохання Італії вирішили підтримати австрійців у їхній боротьбі за незалежність і пообіцяли атакувати всякого можливого агресора, який спробує втрутитися в суверенітет країни."
 BBA_italy_interaction_events_news.3.t:0 "Французька держава гарантує незалежність Австрії"
 BBA_italy_missiolinis.22.desc:0 "Абіссінія досі далека до втихомирення, а опір італійській окупації залишається запеклим. Дуче не може позитивно висловитися ані стосовно абіссінського народу, ані стосовно спроб притлумити опозицію, і називає операцію національною ганьбою. Він скаржиться, що італійські колоністи грубі за зовнішністю та поводженням, що не вселяє жодну повагу в місцеве населення."
 BBA_italy_missiolinis.62.t:0 "Недостатні запаси пального"
 BBA_italy_missiolinis.92.desc:0 "Замість зміцнення служби розвідки в нас стався витік кількох секретних документів, що справило погане враження про наших агентів. Хоча документи не містили в собі особливо значущі секрети, це стало ганьбою для дуче, адже ще нещодавно той хизувався нашим апаратом розвідки. Це не просто прогнівить дуче, адже також посіє сумнів у наших здібностях серед італійського народу та наших супротивників."
 BBA_italy_naval_cooperation_programs.10.a:0 "Знайдемо інших покупців."
 BBA_italy_purge_the_party.1.desc:0 "Впливові союзники Муссоліні все ще перебувають при владі та намагаються схилити людей до відновлення старого дуче. Якщо ми хочемо зберегти наш контроль над урядом, ми повинні подати приклад і звільнити цих дурнів з їхніх посад."
 BBA_italy_recognize_the_empire.2.a:0 "Наша міць зростає!"
 BBA_italy_recognize_the_empire.3.a:0 "Вони будуть жалкувати про це все життя...."
 BBA_italy_research_agreement.1.t:0 "[FROM.GetNameDefCap] пропонує спільну програму військового співробітництва"
 BBA_swiss_expansion.4.desc:0 "Після мирного референдуму по всій території [?SWI.SWI_state_being_claimed.GetName], результат якого переконливо був на нашу користь, [FROM.GetNameDef] погодились передати контроль над штатом нам. Ми негайно перетворимо території всередині [?SWI.SWI_state_being_claimed.GetName] на кантони, і вони нарешті відчують наш варіант демократії."
 BBA_switzerland.14.c:0 "Це вороги Швайцарії, заарештувати їх!"
 BBA_switzerland.22.desc:0 "До нас надійшли дипломатичні повідомлення з [FROM.GetName], що приносять чудову новину: вони погодилися гарантувати нашу незалежність, обіцяючи захистити нас у разі нападу, навіть з боку [?SWI.SWI_angriest_country.GetName]."
 BBA_switzerland.7.desc:0 "Влада Граубюндена повідомляє, що Давіда Франкфуртера, який перебував під вартою після зізнання у вбивстві представника нацистської партії Вільгельма Густлоффа, було знайдено мертвим у його камері сьогодні вранці. Чи це було самогубство, чи напад розлюченого симпатика нацизму – наразі невідомо, але Федеральна поліція обіцяє знайти відповіді.\n\nДоказів злочинного умислу немає, але обставини дуже підозрілі, і дехто звинувачує [SWI.GetAdjective] уряд у приховуванні інформації, зокрема у відмові допустити представників [?SWI.SWI_fascist_germany.GetAdjective] до тіла або місця події."
 BBA_switzerland.8.t:0 "Суд над Давідом Франкфуртером"
 BBA_switzerland_fascist.4.desc:0 "Попри те, що ми чітко продемонстрували вірність і наші можливості, [FROM.GetNameDef] вирішили відхилити нашу вимогу. Розширення [ROOT.GetNameDef] у регіон [?SWI.SWI_requested_territory.GetName] доведеться відкласти, можливо — до моменту, коли ми вирішимо, що підкорення [FROM.GetName] більше не виправдане."
 BBA_switzerland_trade.14.t:0 "[FROM.GetNameDefCap] інвестує в [ROOT.GetName]"
 BBA_switzerland_trade.2.desc:0 "Схоже, що [FROM.GetName] відмовляється продовжувати нашу торговельну угоду, попри очевидні вигоди для обох сторін. \n\nМи вже нічого не можемо з цим вдіяти, але ця непослідовність точно запам’ятається [ROOT.GetNameDef]."
 BBA_switzerland_trade.3.a:0 "Так, ці ресурси необхідні для нашого виживання"
 BBA_switzerland_trade.9.a:0 "Це буде корисно"
