 JAP_sea_mil_tech_coop_with_germany_desc:0 "Нам потрібні кращі технології, щоб об'єднати світ під одним дахом. Німеччина є не лише нашим історичним партнером у технологічних розробках, але й має значні військово-технічні досягнення, які були б надзвичайно корисними для наших військових зусиль. Ми повинні отримати ці креслення за будь-яку ціну!"
