 CHL_political_events.55.desc:0 "Після недавньої широкомасштабної мобілізації на нашому кордоні та тижневих протестів [CHL.GetAdjective] народу, [CHL.GetLeader] оголосив, що настав час, щоб [CHL.GetNameDef] окупувала [953.GetName] для себе. Чи повинні ми намагатися протистояти їм?"
 CHL_political_events.68.desc:0 "[FROM.GetLeader] залишається непохитним у своїй позиції, що регіон Гвіани належить їм та їхнім союзникам, і жодній іншій владі. Здається, що переговори та закулісна тактика більше не принесуть користі..."
 CHL_political_events.75.a:0 "Це день, на який ми чекали!"
 CHL_political_events.89.a:0 "Вони можуть її забрати"
 CHL_political_events.9.c:0 "Це означає війну!"
 CHL_promote_broad_anti_americansim_desc:0 "Американці — виродки. Вони знекровлювали нас, поки ми не зблідли. Вони забрали все, що ми мали, ніби таке їхнє право, і ми не отримали нічого натомість, хоча вони здіймають стільки галасу. Що американці коли-небудь робили для нас? Повторюю, що американці коли-небудь робили для нас?!"
 CHL_rally_the_people_desc:0 "Переворот підготовлений і готовий. Все, що потрібно зараз, — це підняти народ і дати зрозуміти ліберальному урядові, що його час добігає кінця. Настав час покласти край цьому жалюгідному стану!"
 CHL_request_assistance_in_the_war_tt:0 "Якщо країни погодяться, вони зможуть надсилати нам добровольців під час громадянської війни та будуть більш схильні до цього."
