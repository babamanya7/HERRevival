 TUR_tpda_absorbed_desc:0 "Одним розчерком пера Адміністрація турецького державного боргу була перетворена з приватного підприємства в державне. Ми управляємо своїм боргом, ми контролюєм свій борг, і ми можемо його зменшити. Ми багато досягнули в цьому світі."
