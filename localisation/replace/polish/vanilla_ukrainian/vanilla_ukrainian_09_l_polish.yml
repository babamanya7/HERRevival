 lar_appeal_to_overseas_territories.5.desc:0 "Судячи з усього, у Сирії відбувається невеликий переворот. Кілька ключових фігур колоніальної адміністрації поміщені губернатором під арешт. Потім губернатор оголосив, що [This.GetLeader] — його союзник, і закликав усіх патріот ворогів, що окупували нашу Батьківщину."
 lar_appeal_to_overseas_territories.5.t:0 "[This.GetLeader] отримує підтримку Сирію"
 lar_compensate_italy.1.a:0 "Ми укласти з ним союз."
 lar_dominate_the_middle_east.3.a:0 "Що ж, померти так померти."
 lar_end_the_occupation.5.a:0 "Чудово."
 lar_end_the_occupation.6.a:0 "Хіба справжній патріот може ось так проганяти від себе друга-француза?"
 lar_france_french_union.8.desc:0 "Французькі мандатні території — Сирія та Ліван — проголосували за приєднання до нового Французького Союзу. Багато спостерігачів вважали такий результат у кращому разі малоймовірним, але, мабуть, місцеве населення вважає, що членство у Французькому Союзі. європейських ринків та інвестиції у місцеву економіку."
 lar_heavy_water.1.t:0 "Знищено завод з виробництва важкої води в Телемарку"
 lar_intervention_in_greece.1.b:0 "Ми визначимо свою стратегію."
 lar_low_stability_civil_war.1.desc:0 "Після тижнів агітації і таємних приготувань одразу в кількох французьких містах раптово почалися масові страйки. Майже відразу ж утворилися так звані «бригади захисту робітників», де-не-де підтримувані армійськими військами, що збунтувалися військами. лояльним уряду, ведеться вогонь, сутички між повсталими і лоялістами переростають у перестрілки. У країні швидко зникає всякий порядок, уряд фактично втратив контроль над помітною частиною території."
 lar_news.1.t_franco:0 "Перемога націоналістів у громадянській війні в Іспанії"
 lar_news.10.c:0 "Все вийшло навіть краще, ніж ми очікували!"
 lar_news.20.b:0 "Наша відплата буде швидкою і жахливою!"
 lar_news.20.d:0 "З вогню та в полум'я..."
 lar_news.26.desc:0 "Після відновлення монархії в Португалії та Бразилії португальський король та бразильський імператор відвідали кілька зустрічей, щоб обговорити необхідність і можливу вигоду від повторного об'єднання двох держав.\nПісля тривалих переговорів під час останнього бразильсько-португальського що [POR.GetNameDef] офіційно повертається.\n\nСьогодні при повному благословенні присутніх обивателів-монархістів [POR.GetLeader] був проголошений імператором Португалії та Бразилії. Імператор подякував підданим за вірність і заявив, що правитиме від імені всіх своїх громадян."
 lar_news.4.desc:0 "Після переговорів, проведених на найвищому рівні, [GER.GetLeader] оголосив сьогодні, що німецьке військове управління в Північній Франції незабаром закінчиться і території повернуться під повну владу Франції. У відповідь на це [VIC.GetLeader] оголосив, що його уряд приєднався до Сталевого пакту. Німецькі війська, які зараз захищають ці райони, залишаться там доти, поки їх не замінять французькі війська., Зважаючи на все, ця територія залишилася під німецьким управлінням."
 lar_portugal_iberian_summit.6.desc:0 "[From.GetAdjective] уряд прийняв нашу пропозицію на вступ до союзу [?global.POR_iberian_summit_target.GetFactionName]. Разом ми підписали запит, щоб якнайшвидше направити його державі [?global.POR_iberian_summit_target.GetNameDef]."
 lar_portugal_iberian_workers_united.1.a:0 "Разом ми будемо непереможними!"
 lar_portugal_iberian_workers_united.2.b:0 "[Root.GetNameDefCap] залишиться незалежною нацією."
 lar_portugal_purchase_ships.6.a:0 "Добре."
 lar_portugal_royal_iberian_alliance.1.desc:0 "[From.GetNameDefCap] зауважує, що після всієї соціальної роз'єднаності та нестабільності, перенесеної нашими країнами під час громадянської війни в Іспанії, Іберійським державам було б правильно об'єднатися у пошуках прогресу та процвітання\n From.GetAdjective] уряд запропонував обговорити умови альянсу між нашими двома королівствами, забути про колишні розбіжності та разом долати численні загрози, якими небезпечна для нас не лише Європа, а й увесь світ."
 lar_ratify_the_stresa_front.1.t:0 "Ратифікація Стрезького фронту"
 lar_spain.20.t:0 "[From.GetNameDef] підпорядковується"
 lar_spain.22.b:0 "Зараз нам нічого їм виділити."
 lar_spain.60.desc:0 "[From.GetNameDefCap] відповідає на нашу пропозицію згодою — їм подобається концепція об'єднаної соціалістичної Іберії."
 lar_spain.63.desc:0 "Як і очікувалося, своєчасна матеріальна підтримка комуністичних груп, які вже давно докучали [From.GetAdjective] уряду, спонукала їх до дії. Комуністи почали повномасштабне повстання, щоби скинути уряд, але при цьому вони сильно залежать наші підтримки, їх провідники, незважаючи на весь свій ентузіазм і ідеалізм, не мають великого досвіду у веденні громадянської війни і просять у нас допомоги та лідерства."
 lar_spain.77.t:0 "Помер Альфонсо XIII"
 lar_spain.85.desc:0 "Наші війська повністю захопили регіон [SPR_stolen_state_name.GetName], вигнали всіх прихильників Радянського Союзу та місцеве промосковське керівництво, і тепер ми швидко відновлюємо там місцеве [SPD.GetAdjective] уряд."
