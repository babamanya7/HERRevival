 ITA_corpo_volontari_della_liberta_desc:0 "Комітет національного визволення сповнений рішучості зміцнити нашу військову координаційну структуру — Corpo Volontari della Libertà, — щоб ефективно управляти та координувати більшу кількість партизанів і збройних сил."
 ITA_crush_opposition_desc:0 "Досі є багато прихильників старого фашистського режиму, які виступають проти нашої політики та перешкоджають роботі нового уряду. Прийшов час розквитатися з ними."
