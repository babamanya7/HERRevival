 COMMAND_GROUP_DESC:0 "Армія необхідна для створення планів бою, що дозволяє організовувати переміщення багатьох військових частин у кількох кроках."
 CONFIRM_DELETE_ENCIRCLED_SINGLE:0 "§RВійськова частина знаходиться в оточенні; Ви втратите все її оснащення та $VALUE|%0$ людських ресурсів!§!"
 CONGO_cheap_labor_desc:0 "Є кілька методів маніпуляції працею, які можна застосувати, щоб отримати максимальний результат з робочої сили. Наприклад, можна забезпечити мінімальні трудові захисти, щоб ризик бути звільненим залишався постійним, і вони залишалися залежними від компаній для забезпечення."
 CONGO_congolese_generals_desc:0 "Force publique зросла до таких масштабів, що ми не можемо більше покладатися на колоніальні імпорти для належного керівництва. Африканці цілком здатні це зробити самі, тому ми повинні скасувати політику виключення, яка обмежує їх, і дозволити місцевим з винятковим талантом приєднуватися до офіцерського корпусу."
 CONGO_develop_infrastructure_desc:0 "Ми вже давно стикаємося з реальністю, що Конґо занадто велике і занадто непрохідне для добрих інфраструктурних з'єднань. Це не означає, що ми не повинні намагатися."
 CONGO_establish_cometro_tt:0 "Якщо §YВійна за незалежність§! проти нашого сюзерена відбудеться, §Y[KAT.GetNameDef]§! приєднається до сторони нашого сюзерена і отримає 2 §YПіхотні дивізії§! з 5 батальйонами в §Y[889.GetName]§!"
 CONGO_expanded_rubber_plantations_available_malaya_tt:0 "Наш ворог захопив §YМалайю§!"
 CONGO_expanded_rubber_plantations_desc:0 "Попит на гуму став настільки великим, що тепер стало фінансово вигідно значно розширити плантації. Ми можемо створити спеціалізовані ферми та імпортувати сучасне обладнання для серйозного старту виробництва."
