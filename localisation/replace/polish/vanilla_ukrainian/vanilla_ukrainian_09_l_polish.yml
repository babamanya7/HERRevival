 TUR_aligning_bulgaria_desc:0 "[BUL.GetNameDef] — єдина з Центральних держав, якій вдалося вижити, зберігши свій суверенітет та спосіб життя, і що вони з цим зробили? Нічого. Вони боягузи! Подивимося, як вони боятимуться, коли ми почнемо безпосередньо вказувати їм, що робити."
 TUR_approve_the_funkplan:0 "Ухвалити план Функа"
 TUR_bankroll_the_malatya_clothing_factory_desc:0 "$TUR_open_the_nazilli_callico_factory_desc$"
 TUR_celal_bayar:0 "Джеляль Баяр"
 TUR_central_balkan_bank_wealthy_greece_desc:0 "Ніхто ніколи не міг передбачити, що [GRE.GetNameDef] з усіх країн буде першою з нас, яка приведе свої фінансові справи в такий бездоганний вигляд. Було одностайно погоджено, що Балканський центральний банк мусить бути заснований у Салоніках, у світлі [GRE.GetAdjective]ої досконалості у фіскальному управлінні."
 TUR_continue_to_prioritise_balkan_integrity_desc:0 "В наших інтересах завжди було збереження миру на Балканах. Слід визнати: ми відчуваємо певну відповідальність за захист сусідів та допомогу їм, особливо якщо враховувати наше сумне спільне минуле. Ті часи минули — ми прийдемо до них не як завойовники, а як вірні друзі, які хочуть захистити слабших сусідів від нових ворогів."
 TUR_cooperate_with_the_debt_council_desc:0 "Коли вляглася пилюка Великої війни, Турецька Республіка залишилася — вільна та незалежна нація. Якщо, звичайно, не брати до уваги того факту, що держава [TUR.GetNameDef] успадкувала непристойно великий борг, накопичений імперією Османа, і що цим боргом керують з-за кордону ті, хто хотів нас завоювати. Непроста ситуація, але разом ми зможемо розробити сценарій, який буде вигідним для всіх."
 TUR_counter_the_rebels_in_diyarbakir:0 "Протистояти повстанцям у Діярбакирі"
