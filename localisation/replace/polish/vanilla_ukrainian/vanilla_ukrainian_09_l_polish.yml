 raid_trotskys_villa_attack_desc:0 "Невелика група з офіцером НКВС на чолі влаштує наліт на віллу, розправиться з охороною, знайде Троцького і стратить його за злочини проти держави."
 raid_type_CHI_hakko_ichiu_bombing_desc:0 "Відправивши групу бомбардувальників для удару по символу японського імперіалізму, ми покажемо слабкість Японії та зміцнимо бойовий дух нашого народу."
 raid_type_CHI_tokyo_imperial_palace_bombing:0 "Бомбардування Токійського імператорського палацу"
 raid_type_JAP_pearl_harbor_strike:0 "Удар по Перл-Гарбору"
