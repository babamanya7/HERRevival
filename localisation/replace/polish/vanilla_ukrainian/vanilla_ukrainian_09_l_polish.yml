 sakhalin_concession_tt:0 "[655.GetName] відійде державі [ROOT.getName], коли закінчиться громадянська війна в державі [SOV.GetNameDef]"
 scandinavian_defense_union_acc:0 "Скандинавський оборонний союз"
 scientist_trait_guidance_systems_expert_desc:0 "Експерт із раннього розвитку технологій наведення, має досвід удосконалення систем управління безпілотними вибуховими пристроями великої дальності."
 seawolf:0 "Морський вовк"
 second_italo_ethiopian_war_flag:0 "Друга італо-ефіопська війна триває"
 secure_chinese_waters_goal_desc:0 "Ми можемо домінувати на суходолі, але з довгою береговою лінією, забезпечення того, що ніхто не зможе вторгнутися, має бути найвищим пріоритетом. Ця безпека починається далеко в морі."
 secure_the_pacific_short_desc:0 "§LЗахопіть ключові американські острови, щоби забезпечити контроль над Тихим океаном.§!"
 shadow_scheme_focus_desc:0 "Міністерство авіації виступило з блискучою пропозицією щодо полегшення перепрофілювання цивільних заводів на військові. За допомогою відповідних грантів і кредитів різним ключовим компаніям, їхні заводи можуть бути розширені і адаптовані заздалегідь, щоб зробити перехід на військове застосування набагато більш плавним."
 ship_anechoic_tile_desc:0 "Гумове покриття плиток, призначене для зменшення діапазону, в якому судно може бути виявлене як пасивним, так і активним сонаром."
 ship_hull_carrier_2_desc:0 "$carrier_2_desc$"
 ship_hull_mega_carrier:0 "Льодовий авіаносець"
 siam.10.desc:0 "Ворог тікає, і наша перемога здається забезпеченою. Оскільки територія під повним контролем, старі імперіалістичні сили мають тремтіти від страху. Як вони могли програти? Це знак нашого божественного провидіння."
 siam.11.b:0 "Ми не відмовимося від наших вимог!"
 siam.19.desc:0 "[SIA.GetName], підбадьорений зростаючим націоналізмом та нашою нібито слабкістю в регіоні, вимагає повернення територій, які вважає основними для своєї держави. Вони явно намагаються стрибнути вище голови, але території, на які вони претендують, не обов'язково варті того, щоб воювати за них, коли світ котиться до Армагеддону."
 siam.31.t:0 "Закупівля підводних човнів"
 siam.32.b:0 "Ми покладатимемося на кораблі [JAP.GetAdjective] для нашого прибережного флоту."
 siam.49.desc:0 "[JAP.GetNameDefCap] погодилася підтримати [ROOT.GetNameDef] у її боротьбі. Радники, обладнання та припаси [JAP.GetAdjective] скоро почнуть прибувати, тоді як економічні поступки були надані компаніям [JAP.GetAdjective] відповідно до угоди.\n\nХоча кабінет святкує виживання нації, багато хто потай задається питанням, скільки незалежності було виміняно на цю допомогу."
 siam.7.a:0 "Ми - уряд, і нас не вдасться шантажувати!"
 siam_adc.5.a:0 "Тоді ми покажемо їм."
 siberia_beckons:0 "Наступ на Сибір"
 siberia_unified_DEF:0 "Сибір"
 smoke_and_fire_spirit:0 "Дим і вогонь"
 smoke_and_fire_spirit_desc:0 "Шквал снарядів напрочуд ефективний у втриманні противника від нанесення контрудару."
