 BUL_dominance_in_the_aegean_black_sea_failure:0 "Удар, який ми зазнали після провалу нашої місії із забезпечення Чорного моря, призвів до потьмарення настроїв болгарського населення, єдиний спосіб вирішити це — забезпечити, цього разу успішно, болгарське панування в Егейському морі»."
 BUL_expand_sofia_university_desc:0 "Виділивши частину нашого бюджету на фінансування розширення приміщень Софійського університету, найпрестижнішого вищого навчального закладу Болгарії, ми збільшимо наш кількість блискучих умів, які ми добре використаємо."
