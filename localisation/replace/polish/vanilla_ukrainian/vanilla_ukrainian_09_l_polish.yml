 PHI_government_filipinization_desc:0 "Протягом століть у нашому уряді домінували іноземні суб'єкти: спочатку іспанці, потім американці. Настав час взяти контроль у свої руки і встановити правління на Філіппінах філіппінцями і для філіппінців!"
 PHI_if_align_with_the_usa_tt:0 "Якщо §Y$PHI_align_with_the_usa$§! було завершено:"
 PHI_japan_aligned_ideology_tt:0 "Зблизитися з поточною керівною партією Японії"
 PHI_land_of_the_setting_sun:0 "Країна Західного Сонця"
 PHI_land_reform_desc:0 "Заможні землевласники досі домінують у сільськогосподарському секторі Філіппін. Ми повинні продемонструвати, що ми сучасна нація, а не феодальна. Держава здійснить примусовий викуп цих величезних маєтків і продасть ділянки дрібним власникам та корпораціям для більш ефективного обробітку та використання."
 PHI_local_resistance_desc:0 "Окупанти здобули мало друзів своєю політикою, і існує значне приховане невдоволення, яке ми могли б використати. Кожен може зробити свій внесок: фермери ховають припаси від ворожих солдатів, рибалки перевозять повстанців, солдати навчають інших бойовим прийомам, а торговці надають обладнання та гроші — усе це на допомогу опору."
 PHI_philippine_army_dynamic_modifier_desc:0 "Сухопутні сили Філіппін, що відповідають насамперед за захист наших рідних островів. Спочатку сформовані з кількох розвідувальних підрозділів, сили під їхнім контролем продовжують зростати."
 PHI_philippine_naval_patrol:0 "Філіппінський військово-морський патруль"
 PHI_reconciliation_with_spain_desc:0 "[ReconciliationWithSpain]"
 PHI_rehabilitation_finance_corporation_idea:0 "$PHI_rehabilitation_finance_corporation$"
 PHI_restore_order_timed_idea:0 "Відновлення порядку"
 PHI_sakdalista_editor:0 "Редактор Сакдалісти"
 PHI_second_republic_tag_war_communism:0 "$PHI_second_republic_tag_communism$"
 PHI_spanish_refugees_desc:0 "Через спустошення громадянської війни на батьківщині багато іспанських громадян шукали притулку в інших місцях. З потеплінням відносин між нами та нашими іспанськими колегами значна кількість їхніх людей шукала притулку на нашому архіпелазі."
 PHI_subordinate_philippine_department_desc:0 "Філіппінський департамент був військовою присутністю Сполучених Штатів на Філіппінах до створення USAFFE (Збройних сил США на Далекому Сході). Хоча його командні структури застаріли, їх слід оновити та модернізувати, щоб легше підпорядкувати місцеві філіппінські війська американському командуванню та контролю."
 PHI_subsidies_timed_idea:0 "Субсидії"
 PHI_thalassocracy:0 "Таласократія"
 PHI_the_concrete_battleship_desc:0 "Форт Драм, найбільш вражаючий з портових фортів Манільської затоки, нагадує лінкор. Будівництво розпочалося в 1909 році, і протягом своєї служби він отримував модернізацію озброєння та допоміжних конструкцій. Ця поважна фортифікація, ласкаво відома як «USS Нікуди-не-йде», знову покликана на службу в цю нову епоху сучасної війни."
