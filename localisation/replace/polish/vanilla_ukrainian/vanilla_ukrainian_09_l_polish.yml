 ITA_rsi:0 "$RSI$"
 ITA_russian_government_ideology_desc_default:0 "Не встигли ми впоратися з загрозою, якою була сталінська доктрина, як на зміну їй уже прийшло щось ще гірше. З огляду на те, на що нинішнє керівництво довело свою здатність у минулому, ми не можемо бездіяльно чекати, поки вони нападуть — ми мусимо завдати удару першими!"
