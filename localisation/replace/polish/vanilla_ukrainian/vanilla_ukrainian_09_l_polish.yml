 SIA_southeast_asia_joint_command_desc:0 "Наш договір має стати чимось більшим, ніж просто дипломатичною обіцянкою. Об'єднане командування координуватиме стратегію, постачання, розвідку та оборонне планування по всій Південно-Східній Азії, перетворюючи окремі армії на спільний щит."
