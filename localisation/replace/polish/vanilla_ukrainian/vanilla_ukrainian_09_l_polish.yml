 FRA_anti_air_equipment_2:0 "Schneider 37 mm"
 FRA_ban_the_leagues:0 "Заборонити ліги"
 FRA_bomber_focus_desc:0 "Підтримка з повітря необхідна під час планування як оборони, і наступальних операцій. Якщо ми зосередимо всі зусилля на створенні більш швидкісних, маневрених та точних бомбардувальників, це дасть нам перевагу у будь-якій битві на суші."
 FRA_carrier_1_desc:0 "«Béarn» спочатку був закладений як лінкор типу «Нормандія», але пізніше був перероблений як авіаносець, водотоннажністю 22 100 тонн і служив у міжвоєнні роки та Другу світову війну. Як переобладнаний авіаносець, його швидкість була низькою, і він мав обмежений простір для літаків, але середній броньовий пояс і велика дальність компенсували ці недоліки. Його будівництво дало важливий досвід французьким дизайнерам у DCAN (Direction des Constructions et Armes Navale) і призвело до низки проєктних досліджень згодом."
 FRA_carrier_3_desc:0 "Авіаносець «Jean Bart» був пропозицією середини війни перетворити недобудований лінкор «Jean Bart» класу Richelieu на повномасштабний авіаносець подібно до японського IJN Shinano. Великі розміри корпусу призведуть до створення великого авіаційного компонента, а разом із великими двигунами — дальнього та швидкого авіаносця. Важке зенітне озброєння американського виробництва забезпечить хороший захист від авіації та менших надводних бойових дій."
 FRA_carry_the_revolution_west_tt:0 "Надає ціль війни §YПовалення уряду§! проти §YІспанії§! або будь-яких уцілілих некомуністичних угрупувань громадянської війни в Іспанії."
 FRA_colonial_investments:0 "Колоніальні інвестиції"
 FRA_confirm_eastern_commitments_desc:0 "Після Великої війни ми створили мережу союзів у Східній Європі, як противагу відроджуваній Німеччині та експансіоністському Радянському Союзу. Наші союзники в регіоні зараз цікавляться, чи дійсно ми прийшли б їм на допомогу, якби нас покликали. Ми мусимо заспокоїти їх, перш ніж вони вирішать шукати допомоги в іншому місці."
 FRA_dismantle_the_democracies_desc:0 "Нашим щойно завойованим позиціям загрожує новий [GER.GetAdjective]ий демократичний альянс у Центральній Європі. Ми мусимо вжити заходів, перш ніж вони стануть сильнішими."
 FRA_felix_gouin:0 "Фелікс Ґуен"
 FRA_foreign_guest_workers:0 "Іноземні ґастарбайтери"
 FRA_french_forces_of_the_interior:0 "Французькі внутрішні війська"
 FRA_global_integration:0 "Глобальна інтеграція"
 FRA_heavy_cruiser_2:0 "Клас «Algérie»"
 FRA_instigate_workers_revolution_britain:0 "Спровокувати робочу революцію в Британії"
 FRA_invasion_in_west_africa:0 "Вторгнення в Західну Африку"
 FRA_invite_yugoslavia_desc:0 "Югославія має достатньо проблем і без сусідів, які виношують загарбницькі плани. Якщо ми запросимо цю країну до Малої Антанти, це піде на користь і югославам, і нам."
