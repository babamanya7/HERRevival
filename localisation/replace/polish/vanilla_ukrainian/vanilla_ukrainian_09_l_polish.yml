 RAJ_fascism_party_hindu_nationalism_long:0 "Всеіндійські індуїстські великі збори"
 RAJ_favor_the_muslim_league_desc:0 "Надаючи більше визнання та політичної підтримки Мусульманській лізі, ми можемо культивувати лояльну противагу домінуючому націоналістичному руху. Розширення їхніх можливостей вносить корисне тертя серед тих, хто прагне говорити від імені всієї Індії. У єдності є сила; у розколі — керована політика."
 RAJ_fighter_effort:0 "Розвиток винищувачів"
 RAJ_five_year_plan_modify_tt:0 "Модифікує §YП'ятирічний план§! на:"
 RAJ_form_a_federal_court_desc:0 "Будь-яка форма демократії потребує федерального суду для функціонування та підтримки верховенства права. Ми повинні забезпечити, щоб нас судили наші однолітки, а не адвокати [ENG.GetAdjective]."
 RAJ_forming_an_indian_doctrine:0 "Формування індійської доктрини"
 RAJ_go_into_hiding_desc:0 "Субгас Чандра Бос має уникнути британського нагляду, щоб продовжити боротьбу за незалежність. Пішовши в підпілля, він забезпечує, що керівництво руху залишається недоторканим, готове завдати удару, коли настане слушний час."
 RAJ_great_indian_peninsula_railway:0 "Велика залізниця Індостану"
 RAJ_ground_pounder_desc:0 "Пересічена місцевість Індії ускладнює швидке пересування танків. Ближня повітряна підтримка буде важливою для компенсації нестачі важкої наземної підтримки."
 RAJ_hand_over_aden_to_the_crown_desc:0 "Як і планувалося, [ROOT.GetNameDef] передасть сюзеренітет над Аденом Британській короні, звільняючи адміністративний тягар."
