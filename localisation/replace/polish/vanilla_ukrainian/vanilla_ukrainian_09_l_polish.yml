 AFG_signed_oil_deal_flag:0 "Підписано угоду про нафтові концесії"
 AFG_sov_attack_bonus:0 "Червона загроза"
 AFG_state_industries_tt:0 "Відмикає рішення про створення §YВійськово-промислових організацій§! та продовжить часовий ліміт для радикалізації випускників."
 AFG_the_crown_and_the_world_desc:0 "Доля Імперії — повстати як неперевершена світова наддержава. Розширюючи наш вплив, просуваючи нашу силу та стверджуючи наше домінування, ми забезпечимо наше місце як кінцевого правителя сучасного світу."
 AFG_the_faqirs_revolt:0 "Повстання Факіра"
 AFG_turkish_military_mission_desc:0 "З 1933 року турецькі військові допомагають у навчанні нового покоління афганських солдатів. Можливо, з часом цю співпрацю можна розширити, щоб зблизити наші великі нації."
