 SWE_coastal_support:0 "Прибережна підтримка"
 SWE_danish_alignment_desc:0 "[DEN.GetName] має стратегічне розташування та значно слабший за своїх сусідів, що робить майже неминучим те, що хтось із них спробує позбавити данців їхньої незалежності. Таким чином, ми повинні завдати удару першими, перш ніж програти можливість."
 SWE_decentralized_nordic_army_command_tt_2:0 "Кожен §Yчлен Нордичної оборонної ради§!: "
 SWE_economic_deregulation_desc:0 "Ми не можемо дозволити собі підтримувати ці несерйозні витрати на соціальне забезпечення, коли держава стикається з загрозами існуванню. Тому нам потрібно прийняти жорсткі бюджетні рішення та скасувати обтяжливі правила, щоб приватний сектор міг заповнити прогалини, створені державою."
 SWE_education_reform_desc:0 "Книга Алви Мюрдал «Stadsbarn» викликає переполох серед педагогів щодо ролі держави в розвитку дитинства. Алва та її чоловік Ґуннар також розпалили дискусію щодо соціальної політики у своїй недавній книзі «Криза населення». Можливо, нам варто залучити цю плідну пару до кабінету, де вони зможуть перетворити теорію на практику."
 SWE_exiled_revolutionaries:0 "Комуністична військова рада у вигнанні"
 SWE_fallen_riksdag_trait:0 "Хаос і сум'яття"
 SWE_fascist_counter_revolution_1_desc:0 "Не один з наших воєначальників висловлював опозицію до нашого керівництва, і навіть король висловив свою думку. Ці пам'ятки старовини мусять знати, яку роль вони відіграють у нашому суспільстві, і залишатися там. Але ці голоси з кожним днем стають усе нахабнішими..."
