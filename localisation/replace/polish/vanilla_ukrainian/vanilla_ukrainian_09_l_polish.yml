 AUS_apprentice_programmes_desc:0 "Після тривалого періоду економічного спаду та безробіття багатьом людям не вистачає навичок і досвіду, необхідних для роботи на заводі, яка зараз стала доволі легкодоступною. Встановивши програми для учнів, ми забезпечимо угоду, яка буде вигідною як для заводів, так і для їх працівників."
 AUS_austrofascism_intro_tt:0 "Замінити §YАвстрофашизм§! на:"
