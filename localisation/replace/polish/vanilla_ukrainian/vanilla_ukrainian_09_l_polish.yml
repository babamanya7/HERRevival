 ROM_HUN_aligned:0 "Угорщина надає підтримку"
 ROM_all_parties_must_end_desc:0 "Жодна партія не триває вічно, і поточна геополітична ситуація вимагає пильної уваги нашого Короля. Він може влаштувати хоч одну вечірку, коли війна закінчиться, але поки що він повинен залишити свої гедоністичні манери позаду."
 ROM_appoint_soviet_friendly_government_tooltip:0 "Буде видалено: §Y$ROM_constitutional_guarantees$§!, §Y$ROM_national_christian_party_in_power$§! та §Y$ROM_iron_guard$§!\n"
