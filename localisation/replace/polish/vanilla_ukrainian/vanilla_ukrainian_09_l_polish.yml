 SPA_the_spanish_miracle_desc:0 "План стабілізації окупився вище, ніж ми могли очікувати; економічний бум, який ми переживаємо, можна назвати лише дивом!"
 SPA_the_tangiers_enclave_desc:0 "Місто Танжер було перетворено в міжнародну зону в 1923 році під спільним управлінням Франції, Іспанії та Британії. Бачачи, як наші співадміністратори зараз втягнуті у війну, ми повинні втрутитися та взяти на себе відповідальність за захист міста."
