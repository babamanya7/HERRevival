 AFG_recruit_foreign_experts_desc:0 "Оскільки у нас в країні може бракувати досвіду, ми повинні шукати за межами наших кордонів тих, хто може нам допомогти зараз і навчити нас цих навичок на майбутнє."
 AFG_research_bonus_2_desc:0 "Наш досвід у розробці невеликих кораблів окупився, і наші інженери тепер прагнуть вирішити завдання розробки набагато більших конструкцій для флоту."
