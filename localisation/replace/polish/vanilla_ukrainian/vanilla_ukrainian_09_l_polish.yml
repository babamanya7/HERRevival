 DEN_connect_the_islands:0 "З'єднати острови"
 DEN_declaration_of_neutrality:0 "Декларація нейтралітету"
 DEN_emil_strobech:0 "Еміль Стрьобек"
 DEN_establish_domestic_tank_manufacturing_modifier_tt:0 "$DEN_modify_haeren_dynamic_modifier$ \n$MODIFIERS_ARMY_ARMOR_ATTACK_FACTOR$: §G+5.0%§!\n\n"
 DEN_expand_institut_for_teoretisk_fysik_desc:0 "Інститут теоретичної фізики є провідним світовим авторитетом у галузі фізики і був заснований фізиком-теоретиком Нільсом Бором. Фінансуючи інститут та розширюючи його можливості, ми зможемо пожинати його плоди, а в перспективі навіть залучити самого Нільса Бора до нашої справи..."
 DEN_expand_ubadsvabnet_desc:0 "Найкращий захист нашого узбережжя і багатьох островів — це той, який ворог не бачить. Наявність великого підводного флоту дозволить нам наносити удари непомітно і виводити свої сили без втрат."
 DEN_frederik_IX_takes_over_tt:0 "Хай живе король §Y$DEN_frederik_ix$§!!"
 DEN_increase_welfare_bop_cost_tt:0 "\nВартість рішень §Y$DEN_welfare_side$§! зросте на £pol_power §R+25§!.\n\n"
 DEN_institute_corporatism_desc:0 "Натхненні італійською моделлю, робітники та капіталісти з різних секторів економіки повинні брати участь у формуванні національної політики, щоб ми могли бути посередниками між цими групами та проводити найбільш вигідні для національної економіки реформи. Це допоможе нам забезпечити надійне політичне майбутнє для [DEN.GetNameDef]."
 DEN_king_assumes_power_desc:0 "Нам потрібна тверда рука, яка б вела нас вперед у ці непевні часи. Нам потрібні стабільність і традиції. Можливо, короля можна було б переконати взяти на себе всю повноту влади над урядом у ці тривожні часи."
 DEN_luftstotte_add_modifier_tt:0 "$DEN_add_flyvevabnet_dynamic_modifier$ $MODIFIER_AIR_CAS_EFFICIENCY$: §G+5%§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+5%§! \n$MODIFIER_GROUND_ATTACK_FACTOR$: §G+5.0%§!\n\n"
 DEN_luftstotte_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_AIR_CAS_EFFICIENCY$: §G+5%§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+5%§! \n$MODIFIER_GROUND_ATTACK_FACTOR$: §G+5.0%§!\n\n"
 DEN_military_might_desc:0 "Військова міць [DEN.GetNameDef] зростає з кожним днем, але завжди є місце для вдосконалення. Зосередьмо наше фінансування на Hæren та Flyvevåbnet, щоб покращити їхню підготовку та ефективність у польових умовах."
 DEN_mio_trait_coastal_defense_ship_modernization:0 "Осучаснення кораблів берегової оборони"
 DEN_overlord_licensing_ns_desc:0 "$DEN_danish_licensing_ns_desc$"
