 BUL_contract_foreign_companies_desc:0 "Наша військова промисловість далека від того, щоб реалізувати адекватну програму переозброєння. Ми мусимо шукати за кордоном конструкторів, здатних виробляти високоякісні транспортні засоби для забезпечення нашої армії."
 BUL_cooperate_with_the_zveno:0 "Співпрацювати зі Звеном"
 BUL_cooperation_integrate_bs_desc:0 "Донедавна ми співпрацювали з фракцією [GetBsName] як із окремою, хоч і близькою нам організацією. Настав час нарешті ввести його в наш уряд."
