 RAJ_partition_preparation:0 "Підготовка до поділу"
 RAJ_planned_economy:0 "Планова економіка"
 RAJ_preemptive_invasion_of_iran_desc:0 "[PER.GetNameDef] межує з нами на заході, і якщо з нею швидко не впоратися, вона може забезпечити нашим ворогам прямий шлях до [RAJ.GetNameDef] через Перський коридор. Таке вторгнення, безумовно, може викликати гнів у тих, хто прагне миру, але якщо ми досягнемо успіху, то багаті нафтові родовища [PER.GetNameDef] будуть нашими."
 RAJ_princely_state_donations_GOE_desc:0 "$RAJ_princely_state_donations_desc$"
 RAJ_prioritize_army_cargo:0 "Пріоритет армійського вантажу"
 RAJ_propaganda_in_target:0 "Пропагандистська кампанія в [RAJ_communist_coup_target.GetNameDef]"
 RAJ_raise_import_duties_desc:0 "Щоб зменшити економічну залежність та сприяти внутрішньому зростанню, ми запровадимо вищі імпортні мита на іноземні товари. Ця політика захистить місцеві галузі промисловості, збереже капітал у наших межах та забезпечить, що [ROOT.GetNameDef] стоїть на власних ногах."
 RAJ_rolling_nuke_barrages_desc:0 "Послідовний обстріл був звичайним явищем під час Великої війни. Нові технології дозволяють ще більш руйнівні обстріли."
 RAJ_rural_mechanization_program:0 "Програма механізації сільської місцевості"
 RAJ_secret_weapons_desc:0 "Ми знову утвердимося як світовий лідер у розробці ракет та використовуватимемо їх для знищення наших ворогів."
 RAJ_shareholder_democracy_desc:0 "Законодавча влада в країні належить компанії, але лише номінально. Судді та законодавці всі на нашій заробітній платі, що дозволяє нам легко приймати вигідне законодавство та розділяти опозицію."
 RAJ_shripad_amrit_dange:0 "Шріпад Амріт Данґе"
 RAJ_specialized_dietary_requirement_desc:0 "Щоб підтримувати моральний дух та згуртованість, ми повинні поважати різноманітні дієтичні потреби наших військ. Забезпечуючи харчування, узгоджене з їхніми релігійними та культурними переконаннями, ми гарантуємо, що кожен солдат почувається шанованим та готовим до бою."
 RAJ_strengthen_ties_with_british_investors_desc:0 "Намагаючись збільшити наші видобувні та виробничі потужності, ми досі звертаємося за допомогою до британських капіталістів. Доти, доки у нас не з'явиться власний банківський сектор, ми їздитимемо на уклін до Лондона за підтримкою."
 RAJ_strike_burma_desc:0 "Продовження існування [BRM.GetName] становить стратегічну загрозу на нашому східному кордоні. Взявши його під свій контроль, ми можемо захистити кордон та усунути потенційний плацдарм для іноземних держав."
 RAJ_strike_eastern_pakistan:0 "Завдати удару по Східному Пакистану"
 RAJ_take_in_british_naval_experts:0 "Прийняти [ENG.GetAdjective] військово-морських експертів"
 RAJ_temple_entry_movements:0 "Рухи за вхід до храмів"
 RAJ_the_mughal_uprising_tt:0 "Ми відокремимося від §YБританського Раджу§! і §Rоголосимо війну за незалежність§!."
 RAJ_the_pakistan_movement_tt_1:0 "Відновлюється, доки не відбудеться одне з наступного:\n§Y-[PAK.GetName]§! звільниться\n§Y-[PAK.GetName]§! капітулює\n-Повториться §Y5§! разів.\n\nНаприкінці §Y90-денного§! життєвого циклу духу ми отримаємо: "
 RAJ_timurid_empire_fascism_DEF:0 "Тімурідський союз"
 RAJ_two_nation_theory_dlc_desc:0 "Теорія двох націй стверджує, що індуси та мусульмани є різними націями, кожна з яких заслуговує на власну державу. Прийнявши цю ідеологію, ми визнаємо необхідність окремих шляхів до самовизначення, формуючи майбутнє субконтиненту через поділ та автономію."
 RAJ_uprising_strength_tt:0 "[RAJ_communist_coup_target.GetName] або стане нашим підлеглим, або розпочне громадянську війну. Сила громадянської війни залежить від розміру підтримки комуністів. Комуністична сторона стане нашим підлеглим."
