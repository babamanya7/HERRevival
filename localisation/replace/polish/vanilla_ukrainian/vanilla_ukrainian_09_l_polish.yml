 AUS_build_dockyards_if_coastal:0 "Миттєво буде побудована §YВійськово-морська верф§! у випадковій прибережній області, яку контролює Австрія. Доступно тільки у випадку, якщо ми контролюємо хоча б один прибрежний регіон."
