 BUL_land_reorganization_desc:0 "Настав час провести промислово-аграрну реорганізацію, відповідно до наших планів найближчим часом здійснити комплекс нових реформ для зміцнення цих галузей."
 BUL_limited_womens_suffrage_desc:0 "Болгарські жінки закликають до соціального прогресу та рівності, а націоналісти вже попередили, що ця боротьба є не лише жіночою проблемою, але й питанням соціального розвитку та національного будівництва. Тому, щоб йти шляхом прогресу, зберігаючи при цьому повний політичний контроль, ми надамо умовні права голосу заміжнім жінкам-некомуністам."
 BUL_macedonian_revolutionary_organizations_cooperation_desc:0 "У ймовірній болгарській окупації, яка може статися в найближчому майбутньому, нам потрібна буде допомога Македонії. ВМРО може стати ідеальним інструментом пропаганди проболгарських настроїв у регіоні та в довгостроковій перспективі забезпечити."
 BUL_national_military_academy_desc:0 "Начальник Національної військової академії представив нам проєкт розширення його об'єктів, який має на меті не лише підвищити потужність навчального закладу, а й забезпечити кращу підготовку наших майбутніх військових командирів."
