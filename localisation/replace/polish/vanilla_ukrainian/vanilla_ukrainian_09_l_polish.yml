 Sweden_rearnament.2.desc:0 "Експерти та аналітики стверджують, що в майбутньому війна буде вестися як на суші та морі, так і в небі. Цей новий тип війни привертає підвищену увагу великих держав і, безсумнівно, матиме вирішальне значення в будь-якій майбутній обороні.\nХоча цей спосіб ведення війни обов'язково стане майбутнім, чи зрозуміє це простий заводський робітник, коли хліб стане дефіцитним?"
