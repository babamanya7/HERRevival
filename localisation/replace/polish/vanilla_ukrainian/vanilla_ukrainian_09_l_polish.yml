l_polish:
 287_taklamakan_points:0 "([?287.state_political_support_value|+0]) "
 8_lux_name:0 "Лецебурх"
 AAT_MIO_events.2.desc:0 "Промисловці з $CZE_skoda_works$ прагнуть інвестицій, однак ми можемо дозволити собі вкласти гроші лише в одну з трьох галузей компанії. Це дозволить їм визначити пріоритети у розвитку кораблів, танків чи артилерійського обладнання."
 AAT_Sweden.10.t:0 "Герман Ерікссон подає заяву про відставку"
 AAT_Sweden.12.desc:0 "Сьогодні [?SWE.bus_capture_tag.GetAdjective]а влада повідомила про захоплення та подальшу смерть лідера [?SWE.GetLeader]. Вони стверджують, що [?SWE.bus_capture_tag.GetAdjective]і командос змогли частково оточити рухому штаб-квартиру прем'єр-міністра, яка була притиснута до лінії фронту.\nПри контакті з автобусом, в якому перебував [?SWE.GetLeader] і його співробітники, командос стверджують, що прем'єр-міністр, вийшовши з транспортного засобу, нібито спіткнувся і впав на землю. Незважаючи на триваючі бойові дії, [?SWE.bus_capture_tag.GetAdjective]а влада люб'язно повернула тіло покійного прем'єр-міністра для державного поховання. Розтин показав, що прем'єр-міністр переніс серцевий напад з подальшою зупинкою серця.\nНезважаючи на виниклий хаос, Таґе Ерландер взяв на себе обов'язки надзвичайного прем'єр-міністра, поки не будуть проведені належні вибори."
 AAT_Sweden.20.desc:0 "Під час війни держава [SWE.GetNameDef] нахабно окупувала частину нашої країни під приводом «порятунку норвезького населення від іще гіршої окупації». Це виявилося лише вивертом [SWE.GetAdjective]ого уряду для розширення власних територіальних амбіцій, оскільки він відмовився повернути окуповані території, посилаючися на «поточні проблеми зі світовою стабільністю та заворушення після війни». Ми бачимо, що у своїй основі це очевидний опортунізм, кричуще перетягування ковдри, яке загрожує свободі та цілісності нашої держави. Нарвік є норвезьким містом і залишиться таким, навіть за допомогою сили, якщо це буде потрібно."
 AAT_Sweden.26.t:0 "[?195.GetName] втрачено"
 AAT_Sweden.32.t:0 "[FROM.GetName] здає Борнгольм"
 AAT_Sweden.36.desc:0 "Держава [FROM.GetName] повідомила нам, що не буде підтримувати наше бачення нового світового порядку. Незважаючи на наполегливі вимоги, [FROM.GetAdjective]ий уряд вперто відмовляється повернути наші законні території."
 AAT_Sweden.40.t:0 "[FROM.GetName] вимагає область [145.GetName]"
 AAT_Sweden.47.a:0 "Сподіваємося, наші нові господарі будуть поблажливими."
 AAT_Sweden.48.a:0 "Більше ніколи нашу долю не будуть вирішувати інші."
 AAT_Sweden.53.desc:0 "[SWE.GetAdjectiveCap]ий уряд без жодних провокацій вимагає, щоби ми розпустили армію та приєдналися до нової північної держави. Хоча вони заявляють, що це програма співпраці, зрозуміло, хто буде підлеглим, а хто — господарем. Це фактично повернення до часів колишньої Унії."
 AAT_Sweden_ball_bearing.3.t:0 "[SWE.GetNameDefCap] просить військову експертизу в обмін на кулькові вальниці"
 AAT_Sweden_ball_bearing.5.d:0 "Корабельні технології."
 AAT_Sweden_flashpoints.11.a:0 "Нам не можна втягуватися в ширший конфлікт. Ми вибачимося перед [SWE.GetAdjective]им урядом."
 AAT_Sweden_flashpoints.32.t:0 "[SWE.GetName] відхиляє запит"
 AAT_Sweden_flashpoints.54.t:0 "Напруга в державі [SWE.GetName] спадає"
 AAT_Sweden_flashpoints.77.a:0 "Вони нам украй згодяться."
 AAT_Sweden_nationalists.13.t:0 "Промисловці в захваті"
 AAT_Sweden_nationalists.21.t:0 "[FROM.GetName] надає нам контроль"
 AAT_Sweden_nationalists.23.a_tt:0 "§Y[SWE.GetName]§! повстане проти свого володаря та перейде на наш бік"
 AAT_Sweden_nationalists.28.desc:0 "$AAT_Sweden_nationalists.21.desc$"
 AAT_Sweden_nationalists.9.desc:0 "[SWE.GetAdjective]а промисловість стає дедалі більш конкурентоспроможною перед іноземними конкурентами через втручання соціал-демократів та Landsorganisationen. Тому ряд провідних промисловців погодилися підтримати наш націоналістичний рух, якщо ми погодимося розпустити профспілки раз і назавжди."
 AAT_Sweden_strike.1.a:0 "Нам нічого не залишається, окрім як чекати"
 AAT_Sweden_strike.2.a:0 "Вони прийдуть то тями"
 AAT_Sweden_strike.2.b:0 "Ми повинні негайно зупинити це"
 AAT_britain_narvik.2.t:0 "[ENG.GetName] захоплює [SWE.GetName]"
 AAT_britain_narvik.3.t:0 "[ENG.GetName] саботує [SWE.GetAdjective]і шахти"
 AAT_finland_continuation_war.09.a:0 "Удача залишила нас!"
 AAT_finland_diplomacy.14.desc:0 "[FIN.GetNameDef], наша метрополія, вимагає, щоб ми повністю інтегрувалися до її складу. Вони стверджують, що балтійські території належать їм і що наш регіоналізм у підсумку призведе до дестабілізації земель."
 AAT_finland_diplomacy.18.desc:0 "[FROM.GetLeader] проявляє мудрість і погоджується передати нам свої [GetBalticOrNordic]і території, не вважаючи за потрібне оскаржувати наші претензії."
 AAT_finland_diplomacy.24.t:0 "[FROM.GetAdjective]ий уряд погоджується захистити державу [ROOT.GetNameDef]"
 AAT_finland_kinship_war.01.t:0 "[FROM.GetAdjective]і агітатори у Східній Карелії"
 AAT_finland_kinship_war.03.a:0 "У них немає жодного шансу проти наших військ!"
 AAT_finland_misc_events.02.desc:0 "Війна триває, і дедалі більше політиків і популярних постатей висловлюються за заборону публічних танців як солідарність із нашими солдатами на фронті...\n\nЦі люди стверджують, що у важкі часи танці недоречні. Вони кажуть, що наш обов'язок — підтримати солдатів і виявити свою готовність допомагати країні, утримавшись від таких розваг, а за порушення слід карати штрафом або навіть ув'язненням.\n\nБагатьом різко не до вподоби така пропозиція, вони заявляють, що в інших країнах танці, навпаки, заохочують, оскільки вони допомагають людям краще пережити труднощі війни."
 AAT_finland_misc_events.04.b:0 "Дати право на видобуток нікелю в області [722.GetName]."
 AAT_finland_the_white_death.12.t:0 "Сімо Гяюгя вбитий!"
 AAT_finland_winter_war.02.desc:0 "Ми принесли хороші новини з фронту! Наші війська виграли блокаду міста [195.GetName], і тепер воно належить нам. Завдавши таким чином сильного удару державі [SOV.GetNameDef], ми отримали сильну позицію на мирних переговорах. \n\nОднією з декларованих цілей [SOV.GetAdjective]ого вторгнення було створення буфера навколо міста [195.GetName]. У підсумку ж вони не тільки не досягли мети, але втратили і саме місто. Варто очікувати, що противник захоче припинити цей конфлікт.\n\nМи тепер самі можемо вирішувати, коли починати переговори. Можна продовжувати битися і спробувати домогтися нових результатів, а можна укласти якнайшвидший мир на умовах статус-кво."
 AAT_finland_winter_war.06.desc:0 "Ми отримали вимогу капітулювати від своїх [FROM.GetAdjective]их супротивників. У сплату за мир вони вимагають від нас передати їм різні території, зокрема Карелію і Колу. Ворог наполягає, щоб ми якомога швидше звільнили ці землі."
 AAT_nordic_cooperation.6.t:0 "Держава [FROM.GetName] відмовилася інвестувати в нашу економіку"
 AAT_nordic_shared.2.a:0 "Це може бути єдиним способом вижити."
 AAT_nordic_shared.4.a:0 "Сумні новини."
 AAT_nordic_shared.4.t:0 "Держава [FROM.GetName] відхилила нашу пропозицію"
 AAT_norway.17.a:0 "У нас немає вибору."
 AAT_norway.8.b:0 "На все добре!"
 AAT_norway_communist.6.t:0 "Держава [FROM.GetNameDef] відхилила наше прохання про підтримку!"
 AAT_norway_communist.8.desc_SWE:0 "Королівська родина Норвеґії була відправлена у вигнання, і оскільки знайти притулок у своїх родичів в Данії та Великобританії наразі неможливо, вони вирішили відкинути гордість і шукати місце з нами.\n\nНе дивлячись на відсутність родинних зв'язків, наш обов'язок — захистити скандинавську монархію від зникнення."
 AAT_norway_fascist.4.desc:0 "Представники фашизму в державі [NOR.GetName] розповідають нам про велику боротьбу за створення бази підтримки і взяття під контроль [NOR.GetAdjective]у державу, незважаючи на те, наскільки слабким і недолугим є їхній уряд.\n\nОчевидно, що їм потрібна наша допомога, щоби зміцнити свій контроль над важелями влади в країні, яка може стати корисним союзником в майбутньому."
 AAT_norway_monarchist.5.c:0 "Кінцева мета — відновити колишню славу Норвеґії!"
 AAT_norway_rikstanken.11.t:0 "Чого ми можемо навчитися з Rikstanken"
 ABDA_basic_available_trigger_tt:0 "Не перебуває у стані війни з будь-яким членом ABDACOM"
 ABDA_fortress_singapore:0 "Фортеця Сінгапур"
 ABDA_unified_naval_command:0 "Об'єднане військово-морське командування"
 ABILITY_FRONT_OVERRUN:0 "Використання проривів"
 ACTIVATE_OBSERVER_MODE:0 "Увімкнути режим спостерігача"
 ACTIVE_ATTACHES_EFFECT:0 "Активні аташе"
 ADD_ATTACK_SKILL:0 "Додати навичку атаки: $NUM|+$"
 ADD_DESIGN_TEMPLATE_BONUS_DESC:0 "Має знижку $DISCOUNT|2%Y$ на цей дизайн"
 ADD_FACTION_POWER_PROJECTION_EFFECT_NO_FACTION:0 "Додає $VAL|H0$ од. проєкції сили альянсу"
 ADU_neutrality_ADJ:0 "Андалуськ"
 AFA_fascism_party_long:0 "Данакільська унітарна партія"
 AFG_accelerate_integration_desc:0 "Наше нещодавнє створення конфедерації між [ROOT.GetNonIdeologyName] та [PAK.GetNonIdeologyName] було гучним успіхом. Однак ми повинні прискорити процес інтеграції ще більше, щоб бути готовими до всього, що світ може нам підкинути."
 AFG_aid_fascists_cw:0 "Допомога повстанню Аманулли"
 AFG_anti_soviet_cooperation_idea:0 "Антирадянська співпраця"
 AFG_claim_state:0 "Домовлятися про §Y[AFG.GetAdjective]§! розширення в §Y[FROM.GetName]§!"
 AFG_connect_the_cities:0 "Кільцева дорога [ROOT.GetNonIdeologyName]"
 AFG_connect_the_cities_desc:0 "Хоча залізниця матиме велике значення для нашого довгострокового розвитку, не можна недооцінювати переваги сучасної системи автомагістралей між великими містами. Створивши кільцеву дорогу, що з'єднує міста, ми нарешті можемо підірвати економічний регіоналізм, який довгий час переслідував нашу економіку."
 AFG_demand_pashtunistan_referendum:0 "Вимагати референдум про Пуштуністан"
 AFG_expand_karakul_lambskin_industry:0 "Розширити промисловість каракульського хутра"
 AFG_expel_axis_nationals:0 "Вислати громадян Осі"
 AFG_foreign_influence_tt:0 "Додати §Y[PREV.GetIdeologyNameWithCaps] Вплив зростає§!, що надає (Щоденна підтримка [PREV.GetIdeologyNameWithCaps]: §G+0.02§!) "
 AFG_foreign_intervention_category:0 "Велика гра"
 AFG_hold_a_loya_jirga:0 "Скликати Лоя Джірґу"
 AFG_hot_war_with_pakistan_desc:0 "Дурні в [PAK.GetNonIdeologyName] бажають розділити наш народ та змусити нас сваритися, поки справжні загрози [SOU.GetNameDef] та [RAJ.GetNameDef] продовжують набирати силу. Ми повинні ліквідувати цей зухвалий режим, перш ніж вони залишать весь наш народ під ярмом іншої держави."
 AFG_ideology_on_the_rise_flipped_tt:0 "§R\n\n[THIS.GetNameDefCap] може захотіти вторгнутися в [ROOT.GetNameDef], якщо інші нації отримають надто великий вплив на нас! (Якщо будь-яка ідеологія, крім нейтралітету або [THIS.GetIdeologyNameWithCaps], перевищує 40%, [THIS.GetNameDef] може напасти на нас!)§!"
 AFG_industrial_events.30.a:0 "Ми вимагатимемо переговорів з [AFG.GetNonIdeologyName] щодо розвитку річки."
 AFG_industrial_events.30.desc:0 "В останні роки [FROM.GetAdjective] уряд організував низку проєктів гребель та зрошення вздовж своїх річок. Це призвело до ряду змін у річці Гільменд, яка впадає в наші східні провінції. Рівень води, що протікає через кордон, помітно знижується з року в рік, і наш народ починає турбуватися, що вони більше не зможуть використовувати річку, якщо це продовжиться. Нам потрібно вирішити, чи просто впоратися з цим внутрішньо, чи підняти це питання з [FROM.GetAdjective]s."
 AFG_industrial_events.36.a:0 "Давно пора."
 AFG_industrial_events.37.desc:0 "[FROM.GetAdjective] збройні сили вздовж нашого кордону, як повідомляється, мобілізуються для вторгнення в Долину річки Гільменд після зриву переговорів між нашими урядами. Схоже, у нас немає вибору, окрім як мобілізувати наші власні сили у відповідь."
 AFG_industrial_events.38.desc:0 "Незважаючи на тижні гарячих переговорів між нашими відповідними урядами, схоже, [FROM.GetAdjective]s відмовилися від зриву наших проєктів гребель та зрошення наразі. Лише час покаже, чи піднімуть вони це питання знову в майбутньому."
 AFG_industrial_events.38.t:0 "[FROM.GetAdjectiveCap]ий уряд замовкає щодо змін Гільменду"
 AFG_iron_mines:0 "Розширити мідні та олов'яні шахти"
 AFG_lashkar_regiments_idea:0 "Полки лашкарів"
 AFG_look_to_other_partners:0 "Шукати інших партнерів"
 AFG_mohammed_zahir_shah:0 "Мухаммед Захір-шах"
 AFG_mughal_party_long:0 "The Imperial House of Babur"
 AFG_new_young_afghan_movement:0 "New Young Afghan Movement"
 AFG_pashtun_empire:0 "Пуштунське панування"
 AFG_pdpa_communism_party:0 "PDPA"
 AFG_political_events.01.desc:0 "Представники [FROM.GetNameDef] звернулися до нас зі сміливою пропозицією щодо реорганізації Центральної Азії. Їхня пропозиція вимагає передачі нам контролю над низкою штатів уздовж [FROM.GetAdjective] кордону та створення нової соціалістичної федерації під управлінням [FROM.Capital.GetCapitalVictoryPointName]. Це дозволить нам допомогти у створенні потужного буферного стану в регіоні, який може взяти на себе частину наших оборонних обов'язків у регіоні, звільняючи наших військових для розгортання в іншому місці."
 AFG_political_events.155.a:0 "Майбутнє [AFG.GetNonIdeologyName] належить нам!"
 AFG_political_events.158.b:0 "Навіщо втручатися в такі далекі землі?"
 AFG_political_events.51.b:0 "Навіщо втручатися в такі далекі землі?"
 AFG_political_events.72.t:0 "[FROM.GetNameDef] пропонує територіальну поступку"
 AFG_political_events.73.desc:0 "З огляду на поточну глобальну напруженість та потенціал дорогого конфлікту в регіоні, [FROM.Capital.GetCapitalVictoryPointName] вирішила, що в її найкращих інтересах поступитися спірною територією [AFG.GetNonIdeologyName]. Нам наказано дотримуватися цієї директиви, щоб зберегти стабільність та уникнути непотрібної війни."
 AFG_political_events.90.desc:0 "З'явилися повідомлення про те, що [AFG.GetNameDef], під правлінням [AFG.GetLeader], активно сприяє реакційній діяльності в наших середньоазіатських республіках. Вважається, що [AFG.GetAdjective] агенти сіють заворушення та заохочують анти-[ROOT.GetAdjective] настрої серед місцевого населення. Ця підривна поведінка є прямим викликом нашій владі в регіоні та загрожує стабільності наших середньоазіатських територій. Ми повинні протидіяти цьому іноземному втручанню та зберігати контроль над нашими республіками."
 AFG_political_events.91.desc:0 "Зі спалахом війни з [AFG.GetNameDef] ситуація в наших середньоазіатських республіках досягла критичної точки. Натхненні [AFG.GetAdjective] втручанням та підбадьорені поточним конфліктом, кілька республік повстали, оголосивши свою незалежність від [ROOT.GetNameDef]. Це масове повстання загрожує дестабілізувати весь регіон та ще більше розтягнути наші військові ресурси. Ми повинні діяти швидко, щоб придушити повстання та відновити порядок, інакше ризикуємо втратити контроль над Центральною Азією."
