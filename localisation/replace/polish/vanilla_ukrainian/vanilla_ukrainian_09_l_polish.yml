 PAR_appoint_estigarribia_as_leader:0 "Призначити Естігаррібію лідером"
 PAR_ban_vouchers_desc:0 "Ми повинні заборонити роботодавцям платити робітникам так званими «білими грошима». Ваучери, які роботодавці видають працівникам як альтернативу грошам, увічнюють нерівність та створюють залежність для працівника. Це має припинитися."
 PAR_request_weapons_desc:0 "Ми не зможемо виграти цей бій із тим мізерним запасом легкої зброї, який маємо зараз. Нам потрібно звернутися до [USA.GetName] та переконати їх, що комуністичний уряд посеред їхньої сфери впливу — це не те, чого вони хочуть."
