 CHI_power_struggle_defeated_democratic_ADJ:0 "Китайськ"
 CHI_print_money_for_the_army_desc:0 "Армія ніколи не буває безкоштовною, і якщо хтось хоче велику армію, за це треба платити. Проте існують різні способи оплати, і ми можемо доручити нашим людям надрукувати додаткові гроші спеціально для цієї мети."
