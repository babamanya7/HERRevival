 MEX_focus_oil_field_expansion_desc:0 "Потреба Америки в нафті ненаситна. Незважаючи на те, що вони видобувають більшість нафти у світі, вони також імпортують цей ресурс. Мексика має нерозроблені родовища нафти вздовж узбережжя Мексиканської затоки, які ми можемо використовувати для експорту."
 MEX_focus_realpolitik:0 "Realpolitik"
 MEX_focus_television_innovators_desc:0 "Мексика має напрочуд розвинену електронну промисловість. Ґільєрмо Ґонсалес Камарена та інші члени «Ліги радіоекспериментів» експериментують із кольоровими телепередачами. Ми можемо стати світовими лідерами в галузі комунікаційних технологій, якщо зосередимося на цих розробках."
 MEX_focus_triumph_of_synarchism_desc:0 "Вщент побиті, наші вороги ховаються в тіні, як поплічники Сатани. Зараз ми маємо розв'язані руки, щоби забезпечити відбудову держави таким чином, щоби забезпечити її єдність як у вірі, так і в політичній волі."
 MEX_manuel_avila:0 "$MEX_manuel_avila_camacho$"
 MEX_mission_second_revolution_dummy_desc:0 "Хоча певна поміркованість у питаннях релігії буде толеруватися секуляристами в уряді, занадто тісні стосунки з церквою можуть спровокувати бунт із боку ультралівих та атеїстичного генералітету."
 MEX_pablo_macias:0 "Пабло Масіас"
 MEX_pemex_desc:0 "Petróleos Mexicanos була утворена в результаті націоналізації місцевих активів Royal Dutch Shell, Standard Oil of California й інших іноземних компаній."
