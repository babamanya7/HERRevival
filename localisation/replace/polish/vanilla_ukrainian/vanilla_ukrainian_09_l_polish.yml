 INTERNATIONAL_MARKET_DRAFT_CIVS_DESCRIPTION_TT:0 "Коли Ви купуєте оснащення, Ви призначаєте §Yцивільні заводи§! на виробництво £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT_LOWERCASE_GEN$, чим Ви й будете платити за придбане оснащення. Чим більше оснащення Ви купуєте, тим більше £GFX_civ_factory_output Вам треба виробити."
