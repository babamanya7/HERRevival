 south_american_events.10.d:0 "З оголошенням [FROM.GetAdjective]ого уряду про те, що він має намір розширити свій флот більшою кількістю основних кораблів, здається, крихкий баланс сил на континенті було зруйновано. Тепер ми мусимо вирішити, як реагувати на нову загрозу, яку представляє наш агресивний сусід."
 south_american_events.30.c:0 "У нас є більш нагальні проблеми."
 south_american_events.32.a:0 "Ми закриємо очі на добре оснащених добровольців, які прямують до [FROM.GetNonIdeologyName]."
 soviet.17.t:0 "Поліпшення лінії Сталіна"
 soviet.18.d:0 "Зовнішній тиск із боку держави [SOV.GetNameDef] щодо припинення військових дій між нами та китайською Червоною армією призвів до того, що люди в наших рядах взяли справу в свої руки. [Root.GetLeader] був заарештований двома генералами. Вони намагалися примусити перемир'я між нами та комуністами, щоб об'єднати Китай проти зовнішньої загрози. Міжнародний тиск на користь мирного вирішення, а також слабкість Китаю, розділеного в цю епоху, є факторами на користь створення єдиного фронту. Який курс нам слід обрати?"
 soviet.32.a:0 "$soviet.30.a$"
 soviet.51.a:0 "Їх необхідно заарештувати!"
 soviet.51.d:0 "Заснування Четвертого інтернаціоналу відродило страх Сталіна перед зрадниками в партії та військовому командуванні. Побачивши судові процеси та страти під час Великої чистки, багато хто підозрює, що наближається ще одна. НКВС, який був ключовим інструментом чисток, також гостро усвідомлював той факт, що саме відомство є можливою мішенню. Замість чекати, поки його членів ув'язнять, стратять і замінять, його керівники вирішили завдати удару першими та здійснити переворот за підтримки так само стурбованих військових чиновників.\n\nОднак, незважаючи на свою впливову позицію, НКВС виявилося важко завоювати довіру військових керівників. Переворот увінчався успіхом лише в отриманні контролю над обмеженою територією Союзу, але з урахуванням того, що залишки старого відомства зараз перебувають під загрозою розстрілу, вони навряд чи здадуться."
 soviet.8.d:0 "[FROM.GetAdjectiveCap]ий уряд у Ризі погодився з нашими вимогами, і ми замінили їхнє корумповане правління на Народні збори. Цей орган одноголосно проголосував за те, щоби попросити членство в нашому великому союзі в якості радянської соціалістичної республіки. Ми люб'язно погодилися задовольнити це прохання."
 sp_air_axial_jet_engine_unique_reward_desc:0 "Це знову відбувається. Це ЗНОВУ відбувається. Ми вкотре постали перед дилемою: зосередитися на одному типі літаків чи шукати більш універсальне рішення."
