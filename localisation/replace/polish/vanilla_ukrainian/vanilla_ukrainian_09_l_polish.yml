 ENG_anti_non_contact_committee_desc:0 "Наші технічні експерти з протимінної боротьби вважають, що нові типи мін, які активуються магнітними полями, звуком та іншими засобами, ймовірно, відіграватимуть важливу роль у наступній війні. Призначивши спеціальний комітет Адміралтейства з протимінної боротьби для дослідження способів їх знешкодження вже зараз, ми можемо допомогти зберегти наші кораблі в безпеці і, можливо, навіть досягти певного прогресу в наших власних мінних технологіях в цьому процесі."
