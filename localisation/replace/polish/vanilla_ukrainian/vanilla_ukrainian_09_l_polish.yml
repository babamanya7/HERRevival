 FRA_naval_rearmament_desc:0 "Наша суднобудівна галузь була занедбана, поки ми зосередилися на тому, щоб йти в ногу з розвитком інших галузей. У результаті ми зараз дуже сильно загрожуємо бути перевершеними нашими суперниками в Середземному морі та Атлантиці. Ми мусимо інвестувати більше, щоби надолужити втрачений час."
