 rebuild_suez_canal_desc:0 "Суецький канал має величезне значення для наших військових зусиль. Ми повинні виділити будь-які ресурси, необхідні для відновлення цього великого каналу, щоби ми могли використовувати його для вільного пересування кораблів і військ між Середземним морем та Індійським океаном."
