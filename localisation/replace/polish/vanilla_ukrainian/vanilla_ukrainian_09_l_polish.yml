 ITA_the_fight_overseas_desc:0 "Настав час зміцнювати оборону та готувати логістику для підтримки великих військових кампаній на Африканському континенті. Ми розробимо спеціалізовані методики вишколу наших військ і флоту, щоби вони могли оптимально діяти в багатьох складних умовах, з якими їм доведеться зіткнутися."
 ITA_vallo_alpino_orientale_desc:0 "Ми можемо вбезпечити наш східний кордон, побудувавши там низку укріплень."
