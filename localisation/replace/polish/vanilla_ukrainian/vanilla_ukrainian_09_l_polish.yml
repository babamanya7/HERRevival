 treaty_of_calais:0 "Договір в Кале підписано"
 treaty_of_craiova_desc:0 "Після Другої Балканської війни наша Південна Добруджа дісталася Румунії. Але зараз європейські кордони переглядаються, і Румунія вже пішла на деякі поступки. Ми мусимо вимогти повернення нашої втраченої території."
 tsr_manchukuo.18.desc:0 "Незважаючи на всі наші зусилля переконати їх, [FROM.GetAdjective]ий уряд вирішив, що об'єднання китайських адміністрацій під нашим керівництвом не відповідає їхнім інтересам. Наразі ми залишимося розділеними."
 tsr_manchukuo.19.t:0 "Совєти нічого нам не дають"
 tsr_manchukuo.3.t:0 "Передача Даляня"
 tsr_manchukuo.6.b:0 "Ніколи"
 tsr_manchukuo.9.desc:0 "Після стрімкого розвитку ситуації в Китаї [FROM.GetLeader] з [FROM.GetNameDef], виступаючи як представник усього Китаю, запропонував нам сприяти передачі територій, якими вони колись володіли, в обмін на союзника в регіоні. Хоча більш консервативні оцінки територіальної передачі включають лише Монґолію і Туву, втрачені під час революції, деякі навіть наполягають на поверненні Зовнішньої Маньчжурії, оскільки багато партійних чиновників мають особисті зв'язки з цим регіоном."
