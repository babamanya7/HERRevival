 SIA_dominate_public_symbols_desc:0 "Військове крило довго домінувало над публічними символами, зводячи статуї та оголошуючи державні свята на свою честь. Ми повинні протистояти цьому, створивши власні свята та монументи, що святкують право народу на самовизначення та перемогу над старою автократією."
 SIA_end_factionalism_desc:0 "Розкол між військовим та цивільним крилами Кхана Ратсадон затьмарював кожне рішення з часів революції. Якщо ми зможемо утримувати обидві фракції твердо на боці уряду достатньо довго, ми нарешті зможемо об'єднати їх у єдину Народну партію та назавжди позбутися примари перевороту."
