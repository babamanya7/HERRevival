 ITA_regia_aeronautica_dynamic_modifier_desc:0 "Найновіша гілка збройних сил Італії, яка була однією з найбільших військово-повітряних сил світу на момент свого формування, але останнім часом відстає. Інвестуючи в наші повітряні сили, вони можуть знову стати предметом заздрості світу."
