 CHI_make_a_stand_against_the_colonialists_desc:0 "Століття імперій закінчилося, і ми є провісниками епохи самовизначення. Ми повинні донести це просте твердження до тих, хто тримається старого порядку, і якщо вони чинитимуть опір, то пізнають гнів народу."
