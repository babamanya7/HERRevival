 sp_nuclear_major_breakthrough_reward_desc:0 "Контрольований експеримент із деякими з наших обмежених ядерних матеріалів продемонстрував здійсненність нашого задуму. Це дало поштовх до подальшої роботи над проєктом із новим ентузіазмом."
 sp_rocket_guidance_system_choice_reward_desc:0 "Наші інженери обговорюють систему наведення ракети. Деякі хочуть залишитися при перевіреному механічному комп'ютері, а інші бажають використовувати нові радіотехнології для управління та моніторингу ракети після запуску."
 sp_rockets_improved_guidance_desc:0 "Кращі системи наведення для ракет дозволять нам відправляти наші літаючі бомби далі, що зробить їх ще більшою загрозою для наших ворогів. Завдяки вдосконаленню систем наведення для менших ракет, наша ракетна артилерія також зможе поліпшити свою влучність."
