 germany.108.d:0 "Учора заступник фюрера Рудольф Гесс був убитий, коли Королівські повітряні сили перехопили важкий винищувач, на якому він летів недалеко від берега Шотландії. Істинна причина польоту залишається невідомою — хоча Гесс і був досвідченим пілотом, він летів сам і його літак, як відомо, не був озброєний.\nЙого рештки були віднайдені британською владою, але в Берліні вже запланований похорон із порожньою труною.\n\nГітлер, як повідомляється, помітно засмучений смертю свого старого друга."
 germany.127.t:0 "Формалізувати альянс"
 germany.14.d:0 "Польща тепер нашим контролем, але східні землі підпадають під сферу впливу СРСР відповідно до пакту Молотова–Ріббентропа. Чи варто нам вивести війська та дозволити радянській армії зайняти ці території? Якщо ми цього не зробимо, пакт між нашими державами буде розірвано."
 germany.202.t:0 "Нова Німеччина"
 germany.26.t:0 "Китай затримав військових радників"
 germany.48.d:0 "Нещодавно в Мюнхені були проведені переговори між лідерами Британії, Франції, Італії та Німеччини про обговорення майбутнього Чехословаччини. Британці побачили істину в наших словах і визнали наші претензії на Судетську область законними, але вперті французи відмовляються поступитись.\n\nВони покинули союз із Британією та натомість налагодили кращі відносини з чехами. Схоже, нам доведеться мати справу водночас із обома державами, але принаймні тепер, сподіваємось, британці не будуть втручатися..."
 germany.63.b:0 "Ні, без Британії нам доведеться поступитись..."
 germany.63.t:0 "Британія відмовилася від війни"
 germany.65.t:0 "Франція та Британія мобілізовують війська!"
 germany.67.a:0 "Воювати зараз — божевілля."
 germany.73.a:0 "Смерть націонал-соціалізму!"
 germany.83.b:0 "Хто завгодно може розпочати світову війну з таким пактом."
 germany.89.b:0 "Жодних угод із фашистами!"
 germany.94.a:0 "Тріумф для Німеччини!"
