 CHI_sea_the_hump_desc:0 "$CHI_the_hump_desc$"
 CHI_sea_unified_army_structure_desc:0 "Щоб ефективно протистояти іноземним та внутрішнім загрозам, ми повинні реформувати нашу армію, щоб вона стала професійним підрозділом. За допомогою радників Комуністичної партії ми зможемо створити власну Червону армію і, у свою чергу, краще стримувати загрози ззовні."
 CHI_seek_japanese_support_desc:0 "Могутні союзники мають і комуністи, і центральний уряд. Якщо ми хочемо здобути гору, нам самим потрібен захисник, який не поступається ним по силі."
