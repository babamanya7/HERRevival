 SEA_PRC_misc_events.19.e:0 "[FROM.GetNameDefCap] передає область [743.GetName]"
 SEA_PRC_misc_events.5.desc:0 "Після більш ніж трьох років переховування від сил націоналістів, Хе Лун прибув до [ROOT.capital.GetName] з мінімальними втратами для своєї армії. Досвід Луна у командуванні та тренуванні націоналістичних сил перед тим, як приєднатися до Червоної армії для керівництва партизанськими операціями, стане у пригоді — так само як і його армія."
 SEA_PRC_political_events.12.desc:0 "Це славетний день у [ROOT.Capital.GetName] — ми вільні від ярма [FROM.GetName]. Час святкувати, наш час настав."
 SEA_PRC_political_events.20.t:0 "Генерали з усього Китаю стікаються до нашої справи"
 SEA_PRC_political_events.25.desc:0 "\nПісля запиту [PRC.GetNameDef] передислокувати $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ до їхнього регіону, вони почали рухатися в їхньому напрямку. Незважаючи на наш заклик залишитися в якості радників, вони не могли не виконати наказів, наданих їм [FROM.GetNameDef]."
 SEA_PRC_political_events.4.a:0 "Яка прикрість"
 SEA_PRC_political_events.8.desc:0 "Бачачи себе в оточенні потенційних ворогів, [FROM.GetNameDef] звернувся до нас із пропозицією укласти пакт про ненапад, щоб забезпечити нашу пасивність у будь-яких конфліктах у регіоні, спрямованих проти них."
 SEA_PRC_request_aid.4.a.tt:0 "Ми погодимося надіслати §R250 танків Т-34§! до §Y[FROM.GetName]§!"
