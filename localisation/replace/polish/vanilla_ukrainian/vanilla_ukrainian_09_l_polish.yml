 COG_communism_party:0 "КФНВ"
 COG_devout_catholic_kingdom_desc:0 "Як одне з перших католицьких королівств в Африці, ми знаємо важливість релігії та легітимності Папи. Якщо ми хочемо відновитися після століть страждань, ми повинні залишатися вірними нашим християнським ідеалам."
