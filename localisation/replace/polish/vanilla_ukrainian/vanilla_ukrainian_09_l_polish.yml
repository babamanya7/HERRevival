 SWI_fortify_ticino_desc:0 "Як нейтральна країна між трьома історично войовничими націями, смерть може прийти з будь-якого боку, ми не можемо ослабити свою пильність, [ITA.GetName] з такою ж імовірністю нападе на нас, як [GER.GetNameDef] або [FRA.GetName], і коли вони це зроблять, це буде через [846.GetName]. Ось чому ми повинні перетворити його на неприступну фортецю заради [SWI.GetNameDef]."
 SWI_hans_oehler:0 "Ганс Елер"
 SWI_industrial_production_desc:0 "Ми не можемо ігнорувати тилу. Кожен спроможний орган у кантонах [ROOT.GetNonIdeologyName] має бути готовий пожертвувати собою заради нашої машини війни."
 SWI_j_d_de_montenach:0 "J. D. de Montenach"
 SWI_pro_helvetia_desc:0 "Духовний захист [ROOT.GetName] вимагає, щоб культура [ROOT.GetAdjective] залишалася єдиною, неподільною та відмінною від культури наших сусідів. Ця нова організація, Pro Helvetia, зберігатиме та просуватиме наші спільні швайцарські цінності, глибоко пов'язані з нашою демократією, та забезпечуватиме наше виживання проти переважання."
