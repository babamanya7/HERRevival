 DOD_hungary.1.c:0 "Ми забезпечимо правильні результати."
 DOD_hungary.114.a:0 "Революція крокує планетою."
 DOD_hungary.115.c:0 "Отже, вони отримають мільйон загублених життів."
 DOD_hungary.118.a:0 "Ну добре, нехай спробують."
 DOD_hungary.121.t:0 "Комінтерн дає гарантії"
 DOD_hungary.2.a:0 "Така воля народу."
 DOD_hungary.21.desc:0 "Незважаючи на багаторазові звернення короля Швеції та ряду офіцерів шведської армії, шведський уряд відмовився відправити когось нам на допомогу. Навіть окремі громадяни, які бажають вирушити до Угорщини на війну, отримали відмови у візі. Крім того, влада продавила закон, який забороняє продавати нам зброю."
 DOD_hungary.32.t:0 "[From.GetNameDefCap] відмовляється від участі у переговорах"
 DOD_hungary.50.desc:0 "Трансільванія тривалий час входила до складу [HUN.GetAdjective]ої держави, але після Великої війни її жителі добровільно приєдналися до нас. На жаль, [HUN.GetNameDef] досі мріє повернути втрачені землі. Її політики неодноразово називали Трансільванію невід'ємною частиною своєї нації. Тепер, коли змінився розклад політичних сил, вони знову згадали про старі домагання і вимагають, щоби ми віддали їм усю Трансільванію, інакше..."
 DOD_hungary.57.a:0 "Це перемога."
 DOD_hungary.59.a:0 "Зрозуміло, будемо."
 DOD_hungary.60.t:0 "Балканський криза"
 DOD_hungary.61.b:0 "Нам не можна зараз відступати."
 DOD_hungary.74.b:0 "Наслідки цього провалу — на їхній совісті!"
 DOD_hungary.82.a:0 "Вони її отримають."
 DOD_hungary.90.a:0 "Нам не перемогти в цьому конфлікті."
 DOD_hungary.96.desc_HUN_GER:0 "Замість того, щоби розрядити ситуацію, наша різка відповідь на недавню вимогу Угорщини передати Воєводину привела до укладання пакту між Угорщиною та Німеччиною. [GER.GetLeader] вважає Словенію «одною з найстаріших, досі не повертається провінцій Райху», яку потрібно зажадати назад. Угорський та німецький посли передали ноти, в яких йдеться, що Воєводину та Словенію слід передати їх країнам якнайшвидше."
 DOD_romania.31.desc:0 "[SOV.GetLeader] особисто наказує підготувати план оборони Румунії [SOV.GetSovietArmyAdjectiveBasedOnIdeology]ою армією на випадок війни. Невелика військова місія вже прибула на місце, щоб підготувати бази й аеродроми для незабарного прибуття гарнізонів."
 DOD_romania.53.desc:0 "Незважаючи на явну слабкість своєї армії, [HUN.GetLeader] відмовився прислухатися до голосу розуму і наказав своїм військам зайняти оборонні позиції вздовж нашого кордону. З невідомих причин значна частина його армії виконала цей наказ.\n\nСхоже, вони готові до війни."
 DOD_romania.61.t:0 "[From.GetNameDefCap] прогинається"
 DOD_romania.84.b:0 "Уряд не коментує дії приватних осіб."
 DOD_yugoslavia.1.b:0 "Ми відстоюватимемо наше рішення!"
 DOD_yugoslavia.31.b:0 "Ми мусимо підтримувати хороші стосунки з ними..."
 DOD_yugoslavia.40.b:0 "Ми не маємо права втручатися у справи іншої держави."
 DOD_yugoslavia.41.a:0 "Ми подумаємо над цим."
