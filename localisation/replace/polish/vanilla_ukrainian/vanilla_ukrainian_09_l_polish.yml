 congo_independence_struggle.17.d:0 "Цього ранку ми отримали по радіо поспішно підготовлений звіт від колоніального губернатора [COG.GetNameDef]. Він повідомив, що натовп увірвався в його офіційну резиденцію, нейтралізував охоронців іноземною зброєю і передав йому декларацію про незалежність. Потім вони швидко залишили місце події. Найбільш тривожною є інформація, що цей натовп очолювали елементи Сил Публіки — жандармерії, що відповідає за підтримку порядку. \n\nДекларація вимагала негайного виведення колоніальної адміністрації і передачі законної влади цивільному уряду, який має бути сформований із лідерів цього повстання. Ми не можемо бути впевненими, що це не справжня загроза, і той факт, що цей натовп був озброєний зброєю, що не є виробом [BEL.GetAdjective], може вказувати на те, що іноземні сили прямо втрутилися і можуть надати військову підтримку повстанцям."
