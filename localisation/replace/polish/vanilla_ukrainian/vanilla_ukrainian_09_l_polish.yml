 ITA_milan_comms_industry_desc:0 "Нова сфера радіорозпізнавання і визначення дальності відкриває багато можливостей і, безсумнівно, стане важливою галуззю військових технологій. Ми мусимо забезпечити собі можливість йти в ногу з розвитком цієї галузі."
