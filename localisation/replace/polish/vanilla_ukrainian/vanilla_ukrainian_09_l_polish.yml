 mtg_britain.19.t:0 "Основи індійської держави"
 mtg_britain.24.a:0 "Це значно посилить нас."
 mtg_britain.24.d:0 "[From.GetNameDefCap] повідомляє, що вона перервала дипломатичні відносини з державою [ITA.GetNameDef]."
 mtg_britain.27.t:0 "Союз із державою [From.GetName]"
 mtg_britain.29.d:0 "[From.GetNameDefCap] відкидає нашу пропозицію про союз. Що вони взагалі задумали?.."
 mtg_britain.3.a:0 "Скатертиною дорога. Вони не зупинять короля."
 mtg_britain.37.t:0 "[From.GetName] приймає пропозицію вступити до альянсу"
 mtg_britain.43.d:0 "Під час переходу влади королівська родина перебувала під неофіційним арештом у своїй розкішній резиденції в Бакинґемському палаці. Час вирішити, як вчинити з ним. Громадська думка наполягає на тому, що вони мусять позбавити країну своєї присутності, залишилося тільки вибрати, як саме, і що робити з ними, коли ми ухвалимо рішення..."
 mtg_britain.44.t:0 "Королівська сім'я у вигнанні"
 mtg_britain.46.b:0 "Нехай спробують."
 mtg_britain.60.a:0 "Публік у цілому сприйняв мову добре."
 mtg_britain.65.a:0 "Так як вони пос... тобто, «Прав, Британія»!"
 mtg_britain.83.a:0 "Будемо сподіватися, що домініони погодяться."
 mtg_germany.1.d:0 "Держава [From.GetNameDef], чиїм торговим вимогам ми нещодавно поступилися, висунула нам ультиматум: ми мусимо приєднатися до нього, або вона обрушить на нас міць своєї армії."
 mtg_netherlands.15.d:0 "Представники держави [From.GetNameDefCap] запропонували відтворити буферну державу Об'єднані Нідерланди, що існувала після наполеонівських воєн. Вони посилаються на свій внесок у військові кампанії порівняно з майже повною марністю і тверджують, що їх план допоможе зберегти мир у континентальній Європі."
 mtg_netherlands.24.d:0 "[From.GetNameDefCap] приймає нашу пропозицію надати ексклюзивні права на ресурси Вест-Індії"
 mtg_netherlands.52.a:0 "Це справжня знахідка для розвідки."
 mtg_netherlands.67.d.a:0 "Німці розширили свій вплив на нас настільки, що ми тепер змушені давати їм сприятливі умови в торгових переговорах."
 mtg_news.1.b:0 "Американський експеримент провалюється у нас на очах."
 mtg_news.27.desc:0 "\n[ENG.GetAdjective] уряд оголосив сьогодні, що бере новостворений імперсько-лоялістський уряд у державі [From.GetNameDef] під свій захист. [From.GetNameDefCap] зараз переживає громадянську війну, і цей випадок, судячи з усього, означає, що [ENG.GetNameDef] відтепер братиме активнішу участь у внутрішніх політичних заворушеннях цієї країни."
 mtg_news.28.a:0 "Вони ухвалили правильне рішення."
 mtg_news.28.desc:0 "У відповідь на [ENG.GetAdjective] ультиматум, що вимагає вільного проходу [ENG.GetAdjective] військ по території країни, а також значного контролю над її внутрішніми справами, [From.GetAdjective] уряд оголосив, що підкориться [ENG.GetAdjective] офіційні особи вже прибули, щоби забезпечити нагляд."
 mtg_news.3.g:0 "Проте їхня підтримка нас непохитна!"
 mtg_news.32.d:0 "Це їхні внутрішні справи."
 mtg_news.36.t:0 "Британська комуністична альтернатива"
 mtg_news.44.desc:0 "Внаслідок погано організованого процесу передачі незалежності державі [RAJ.GetNameDef] на континенті з давніх-давен тліли релігійні розбіжності. Зараз вони переросли у раптові зіткнення у великих містах на північному заході та північному сході країни.\n \nМісцевій владі не вдалося запобігти ескалації конфлікту, і тепер ополчення і навіть армійські загони об'єдналися в Мусульманську лігу, оголосивши про незалежність Пакистану і про свою готовність боротися за неї проти Індії."
 mtg_news.57.c:0 "Вони зміцнюють свою владу."
 mtg_usa_civil_war_democrats.20.a:0 "Ніхто не сприймає їх серйозно. Нехай випустять пару."
 mtg_usa_civil_war_democrats.40.b:0 "Це буде кінець республіки."
 mtg_usa_congress_small_opposition_tt:0 "До §Y4 сенаторів§! і §Y20 представників§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_diplomatic_protest.2.t:0 "[USA.GetNameDefCap] вимагає передачі американських володінь"
 mtg_usa_foreign_support.12.b:0 "У нас немає часу на таку нісенітницю."
 mtg_usa_foreign_support.13.desc:0 "[From.GetAdjective] Уряд погодився прийняти невелику кількість членів Срібного легіону для підготовки як пілотів. У ході подальших переговорів вдалося забезпечити покупку в кредит невеликої кількості літаків, які доставлять з початком війни."
 mtg_usa_foreign_support.7.a:0 "Приголомшливо!"
 mtg_usa_house_large_support_tt:0 "До §Y125 представників§! §Gпідтримають§! уряд.\n"
 mtg_usa_secure_asia.9.t:0 "[From.GetNameDefCap] відмовляється"
 mtg_usa_strategic_interests.2.t:0 "[From.GetNameDefCap] передає території"
 mtgnavalfolder_desc:0 "Кораблі та підводні човни, а також нові модулі для Ваших суден."
 native_american_usa_fascism:0 "Реваншистські Сполучені Штати Тубільної Америки"
 naval_air_operations_desc:0 "Літаки, що вилітають на завдання з авіаносців, відкривають для нас новий спосіб завоювати панування на морі. Вони допоможуть ефективно пошкодити ворожий флот."
 naval_expansion_focus_desc:0 "Ми більше не зв'язані Вашинґтонською морською угодою, а флот вкрай важливий для нас як для острівної держави. Побудуйте додаткові портові споруди з метою збільшення виробництва для флоту. Тільки так Японія зможе створити флот, на який заслуговує."
 naval_strike_tactics:0 "Тактика морських ударів"
 navy_capital_ship_defense_factor_tt:0 "$MODIFIER_NAVY_CAPITAL_SHIP_DEFENCE_FACTOR$: $RIGHT|+=%1$"
 neutrality_drift_from_guarantees:0 "Ріст зарубіжного нейтралітету від гарантій"
 news.1.b:0 "Ми провчимо тих китайців!"
 news.13.c:0 "Ми захистили свою незалежність."
 news.136.d:0 "Після напружених боїв війська Союзників окупували Москву, столицю держави [SOV.GetNameDef]. Місто сильно постраждало, пожежі досі не вщухають по обидва береги ріки Москви. Незважаючи на масовані бомбардування, Кремль залишився неушкодженим і саме там розмістилася штаб-квартира окупаційної адміністрації.\n\nВтрата Москви завдала росіянам потужного удару. Хоча практично весь уряд евакуювався із міста завчасно, військові експерти прогнозують швидке падіння радянців."
 news.15.c:0 "Сподіваемося, колись ці зміни підуть нам на користь."
 news.158.d:0 "Кілька днів тому держава [From.GetName] оголосила війну державі [From.From.From.GetName]. Незабаром слідував ультиматум держави [From.From.GetName] з загрозою розпочати військові дії проти держави [From.GetName], якщо не буде покладено край агресії і підписано мир. [From.GetLeader] стверджує, що вони мали на це право, але погодився провести демобілізацію та мирні переговори."
 news.16.d:0 "Після проведення Німеччиною арбітражу у Відні було підписано угоду про передачу всієї Трансільванії під контроль Угорщини.\n\nРаніше, за результатами Великої війни, ця територія була віддана державі [ROM.GetNameDef], що призвело до запеклих суперечок.\n\nЧи стане такий переділ кордонів першим кроком у встановленні нового порядку в Європі?"
 news.180.d:0 "Після того як народ і політики Франції взяли курс на побудову комунізму, [France.GetName] публічно повідомляє про своє прагнення стати частиною альянсу [From.GetFactionName].\n\n[From.GetName] реагує негайно; це означає, що переговори почалися багато тижнів тому потай від громадськості. [From.GetLeader] у своїй довгій промові говорить про те, що світовий пролетаріат повинен спільно організувати революції в усіх країнах світу.\n\n[France.GetLeader] підтримує цю заяву і відкрито погрожує всім, хто має «причини боятися альянсу [From.GetFactionName]»."
 news.181.a:0 "Разом ми сильні!"
 news.186.d:0 "Називаючи Римську імперію попередницею сучасної [From.GetAdjective]ої держави, [From.GetName] запевняє, що незалежна Греція немає права на існування. Натомість «грецькі території» мають визнати панування Італії в районі Егейського моря, інакше їм загрожує окупація.\n\n[Greece.GetName] відкидає ці претензії як безпідставні. Проте держава [From.GetName] користується підтримкою альянсу [From.GetFactionName]."
 news.187.c:0 "У нас багато спільної історії."
 news.203.a:0 "[GER.GetLeader] cannot be allowed to keep making demands of Europe!"
 news.204.t:0 "Польща відхиляє німецький ультиматум"
 news.209.t:0 "Японська армія приймає «Хокушін-рон»"
 news.212.d_not_axis:0 "Між Токіо та Берліном розвивається нове партнерство. Розпочалися переговори про укладення пакту між двома державами, посилаючись як на стратегічні інтереси, так і на спільні цінності. Поки що невідомо, що вийде з цих переговорів, але перспектива дружби між одними з найсильніших збройних сил на кожній півкулі викликає занепокоєння у їхніх численних ворогів."
 news.218.t:0 "Так! У нас нема бананів"
 news.227.d:0 "\"Ми були за десять миль від Берліна, коли ефект почав проявлятися. Вони повинні були посилити наші бойові зусилля. Смішно. Єдине, що посилилося — це моя підозра, що мій командир намагається позбутися мене. Не допомагало й те, що я не міг відрізнити стукіт гусениць німецьких танків від дикого стукоту за моїми очима.\nМені потрібно було знайти доктора Ґонзо.\""
 news.231.d:0 "Після інциденту на мості Марко Поло [JAP.GetName] не послаблює свого тиску на [CHI.GetAdjective]ий кордон.\nУ поєднанні з агресивною риторикою держави [JAP.GetNameDef], яка говорить про «жахливу відплату за відмову держави [CHI.GetNameDef] від співпраці», відновлення війни між [JAP.GetNameDef] та [CHI.GetNameDef] з кожним днем здається все більш і більш вірогідним.\n\nДипломатична ситуація скоро досягне точки кипіння, а [JAP.GetNameDef] не висловлює жодної зацікавленості у розрядці ситуації."
 news.234.c:0 "Це був би агресивний удар."
 news.239.d:0 "Вважаючи свої країни «природними союзниками в поширенні революції», [AST.GetLeader] та [SOV.GetLeader] підписали договір, за яким [AST.GetNameDef] приєднується до [SOV.GetFactionName] як один з основних членів [SOV.GetFactionName].\n[AST.GetNameDef] було оголошено яскравим прикладом держави трудящих, створеної народом і для народу, а не колоніальними володарями Європи.\n\nЗважаючи на останні події у політиці [AST.GetAdjective], дехто може сказати, що цей крок був неминучим. Тим не менше, це викликає велике занепокоєння у тих самих «колоніальних володарів Європи», а також у всіх, хто виступає проти необмеженої влади комуністів та їхньої Світової революції."
 news.25.a:0 "Це занепокоює."
 news.251.c:0 "Чому це має статися саме зараз?!"
 news.263.c:0 "Можливо, найбільші загрози знаходяться всередині наших кордонів..."
 news.265.a:0 "Просто акули відчули запах крові у воді."
 news.290.c:0 "Перегони до Австрії розпочато!"
 news.31.c:0 "Смерть зрадникам!"
 news.312.t:0 "Поновлення Римських протоколів"
 news.32.e:0 "За нашу довгу та результативну дружбу!"
 news.326.b:0 "Хай живе Хорватія!"
 news.338.desc:0 "Держава [FROM.GetNameDef] провела успішні випробування ядерних реакторів, про що [FROM.GetLeader] оголоси[FROM.GetLeader.GetVerbGendEndA_RU] у вчорашньому публічному виступі. [FROM.GetNameDefCap], схоже, наразі лідирує у світовій атомній гонці."
 news.45.a:0 "Цікаво."
 news.59.d:0 "Німецькі претензії на Судетську область, що у Чехословаччині та котра населена великою кількістю етнічних німців, останнім часом посилилися.\n\nНа зустрічі в Мюнхені глави Німеччини, Великої Британії, Франції й Італії спробували знайти рішення так званої Судетської кризи.\n\nВелика Британія і Франція визнали законність вимог Німеччини, проте Чехословаччина, яка не була запрошена до Мюнхена, не має наміру поступатися.\n\nСхоже, їй доведеться наодинці протистояти німцям у цій безнадійній сутичці."
