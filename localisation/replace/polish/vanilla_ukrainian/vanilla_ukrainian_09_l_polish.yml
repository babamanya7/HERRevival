 STATE_1037:0 "Чунцін"
 STATE_CORE_DESC:0 "Осердні землі вважаються невід'ємною частиною Вашої держави. Якщо ними володіє інша держава, у Вас є законне право оголосити їй війну з метою повернення земель. У разі успіху Вам не доведеться застосовувати окупаційну політику: область просто стане частиною Вашої держави."
