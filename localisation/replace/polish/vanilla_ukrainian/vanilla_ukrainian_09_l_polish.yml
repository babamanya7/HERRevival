 USA_shatter_the_empires_desc:0 "Раніше ми були колонією світової імперії, але потім здобули свободу, заплативши за неї своєю кров'ю. Наша республіка не буде в справжній безпеці доти, доки ми не зупинимо тих, хто вважає себе господарями планети."
