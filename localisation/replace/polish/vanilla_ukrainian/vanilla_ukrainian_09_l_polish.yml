 ARG_political_events.1.desc:0 "Сьогодні вранці, на світанку, 8 000 солдатів пройшли маршем з військової бази Кампо-де-Майо в Буенос-Айресі до президентського офісу «Каса Росада». Очолювані Артуро Роусоном та Педро Пабло Раміресом, два генерали вимагають, щоб [FROM.GetLeader] пішов у відставку та передав управління [FROM.GetName] армії. Ми можемо або підкоритися їхньому ультиматуму, або підготуватися дати їм відсіч."
 ARG_political_events.17.b:0 "Вони пошкодують, що відмовилися від нас!"
 ARG_political_events.32.t:0 "[ARG.GetNameDefCap] вимагає нашої здачі островів"
 ARG_political_events.42.a:0 "Надішлемо допомогу нашим товаришам-соціалістам."
 ARG_political_events.5.a:0 "Острови їхні."
 ARG_rapid_militarization_idea_desc:0 "Стрімка мілітаризація — це процес, у якому суспільство організовує себе для військових конфліктів і насильства. Ми взяли на себе зобов'язання всебічно розвивати наш військово-промисловий комплекс і готуватися до майбутніх боїв."
 ARG_rodolfo_ghioldi:0 "Родольфо Ґйольді"
 ARG_ship_armor_cruiser_1:0 "70-мм пояс/25-мм палуба"
 ARG_ship_heavy_battery_2:0 "35.6-см гармата"
 ARG_ship_secondaries_2:0 "155mm/50 RF. Cannon"
 ARG_south_american_unity_desc:0 "Тепер, коли ми отримали території по всьому континенту, настав час взяти нову назву, щоб символізувати той факт, що ми не просто [ARG.GetNameDef], а Південна Америка в цілому. Нам нарешті вдалося об'єднати ці ворогуючі держави під одним потужним прапором."
 ARG_state_unions_idea_desc:0 "Профспілки — це організації працівників, які мають намір підтримувати та покращувати умови своєї праці. Багато з цих умов включають підвищення заробітної плати та пільг, покращення безпеки та умов праці, а також забезпечення того, щоб простий робітник не зазнавав несправедливого поводження з боку керівництва."
 ARG_support_the_farmers_decisions_tt:0 "Відмикає сукупність рішень §Y$ARG_support_the_farmers_decisions$§!."
 ARG_the_old_enemy_desc:0 "Нарешті настав час звернути нашу увагу на північ, де над нами нависає тінь нашого найстарішого суперника. [BRA.GetNameDefCap] завжди були нашим найбільшим ворогом на цьому континенті. Настав час відродити дух Цисплатинської війни та прокласти шлях завоювання до міста [BRA.capital.GetCapitalVictoryPointName]."
 ARG_university_reforms:0 "Університетські реформи"
