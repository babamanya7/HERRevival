 POR_carrier_effort:0 "Розвиток авіаносців"
 POR_iberian_summit_proposal_delayed:0 "Робота над пропозицією приєднатися до альянсу [?global.POR_iberian_summit_target.GetFactionName]"
 POR_join_the_comintern_desc:0 "Радянський Союз проклав шлях іншим країнам наслідувати їх соціалістичний приклад. Нам буде вигідно співробітничати з нашими радянськими товаришами, бо всі ми прагнемо одних цілей."
 POR_limited_self_rule:0 "Обмежене самоврядування"
 POR_mapa_cor_de_rosa_desc:0 "Настав час помститися за приниження, яких ми зазнали британським ультиматумом у 1890 році. Наші колонії в Західній і Східній Африці будуть нарешті з'єднані!"
 POR_medium_tank_equipment_3_short:0 "CDC-6"
 POR_our_comrades_overseas_desc:0 "Ми організуємо конференцію між тими країнами Латинської Америки, які бажають стати частиною нашого блоку. Настав час показати світові єдність між латиноамериканськими та іберійськими народами."
 POR_roads_bridges_and_dams:0 "Дороги, мости та греблі"
 POR_support_the_spanish_republic_effect_tooltip_tt:0 "Надіслати §Y2000§! од. §Yпіхотного спорядження§! державі [GetSpanishRepublicFlagAndNameDef]. Першим буде надіслане старе."
 POR_the_kingdom_reunited:0 "Королівство возз'єднане"
 POR_tropas_paraquedistas_desc:0 "Ми сформуємо елітний піхотний штурмовий загін, здатний запускатися в тил противника, забезпечуючи неоціненну тактичну перевагу."
 POR_vieira_da_rocha:0 "Віейра да Роча"
 POSITIVE_VALUE_PERCENTAGE:0 "$VALUE|G0%$"
 PRC_USA_more_willing_to_send_lend_lease_tt:0 "§Y[USA.GetNameWithFlag]§! охочіше надсилатиме ленд-ліз"
 PRC_a_new_central_committee:0 "Новий Центральний комітет"
 PRC_abolish_the_land_rent_desc:0 "Приватне володіння землею — абсурдна концепція. Земля належить тим, хто працює. Цей крок організує селян та принесе нам народну підтримку."
 PRC_agrarian_socialism:0 "Аграрний соціалізм"
 PRC_air_force_capstone_desc:0 "Наші інвестиції в дослідження обладнання для ВПС мають дозволити нам виробляти літаки, які перевершать літаки ворога. Це також сприятиме плавній інтеграції нових досягнень, таких як реактивні двигуни."
 PRC_asian_democratic_union_tt:0 "§Y$PRC_asian_democratic_union_modifier$§! збільшує §Yшвидкість досліджень§! на §G+1.00%§! і §Yмножник фабрик споживчих товарів§! на §Y-2.0%§! за кожного нового члена альянсу, до максимуму: швидкість досліджень §G+10.0%§! і множник фабрик споживчих товарів §Y-20.0%§!"
 PRC_bolshevik_dominance:0 "Більшовицьке домінування"
 PRC_bolshevik_urban_industrialization_desc:0 "Ми повинні інвестувати в наші міста, щоб сприяти формуванню важкої промисловості."
 PRC_construct_the_banqiao_dam_desc:0 "Гребля на річці Жу в регіоні [602.GetName] могла б забезпечити регіон електроенергією. Це також допомогло б запобігти повеням, які були особливо сильними в останні десятиліття."
 PRC_dalian_shipbuilding_company:0 "Далянська суднобудівна компанія"
 PRC_dissent_in_the_united_front:0 "[GetDissentFocusName]"
 PRC_eastern_expedition_idea:0 "Східний похід"
 PRC_emergency_supply_protocols:0 "Протоколи надзвичайного постачання"
 PRC_enforce_the_three_rules:0 "Три правила"
 PRC_establish_pla_navy:0 "Військово-морські сили НВАК"
 PRC_fighter_equipment_1:0 "J-1"
 PRC_finalize_industrial_plan_desc:0 "Завершивши наші плани реформ, ми тепер можемо фіналізувати наш промисловий план, переконавшись, що новий дослідницький центр і виробничі потужності співпрацюють якомога тісніше."
