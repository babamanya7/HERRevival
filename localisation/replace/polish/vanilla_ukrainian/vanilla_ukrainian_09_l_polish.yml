 FIN_proclaim_greater_finland:0 "Проголошення Великої Фінської федерації"
 FIN_purchase_german_equipment_desc:0 "У Німеччині є велика кількість обладнання, яке просто витрачається на складах. Ми повинні попросити, щоб вони надали частину цього, оскільки ми можемо стати їхнім корисним другом."
 FIN_socialist_wellfare_compliance_tt:0 "Додає §G+15.0%§! підпорядкування у §Yкожній контрольованій області з активним опором§!."
 FIN_the_last_kinship_war_desc:0 "Відродивши дух Братніх війн, тепер ми можемо розпочати підготовку до звільнення наших рідних народів від пазурів іноземного гніту."
