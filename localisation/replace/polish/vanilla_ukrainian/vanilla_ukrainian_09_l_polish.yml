 AST_IRE_stationed_troops_idea_desc:0 "Зараз кількість наших розквартированих військ становить [?AST_IRE_stationed_troops_count_var|Y0]."
 AST_UNION_CONTROL_STATUS_NAME_BRM:0 "Бірма"
 AST_a_convenient_disaster_flag:0 "§YАвіакатастрофа в Канберрі§! була спровокована через рішення §YЗручна катастрофа§!."
 AST_a_northern_barrier_desc:0 "Ворог насувається з півночі, і перед ним лежать менші, непідготовлені нації, по яких він може завдати удару за власним бажанням, перш ніж остаточно дістатися нашого порогу. Якщо ми об'єднаємося з [INS.GetNameDef] для створення єдиного бар'єру, ми ще маємо шанс стримати їх."
 AST_abandon_the_westminster_system_desc:0 "Ми отримали Вестмінстерський парламент у спадок від Великої Британії, але до теперішнього часу він зжив себе. Суперечки між міністрами та суперництво партій ніяк не допомогли Австралії пережити недавню економічну кризу."
 AST_adela_imperial_fascism_ADJ:0 "$AST_autonomy_dominion_ADJ$"
 AST_anti_tank_equipment_1:0 "QF 2-pounder"
 AST_battleship_1_desc:0 "$ENG_battleship_1_desc$"
 AST_british_intel_sharing:0 "Обмін розвідданими з Британією"
 AST_cac_woomera_desc:0 "Австралія розробить бомбардувальники. «Woomera» — легкий літак, але він допоможе у захисті нашої країни та забезпечить авіаційну підтримку військ."
 AST_canberra_air_disaster_events.1.desc:0 "Сьогодні неподалік Канберри розбився літак Lockheed Hudson. Серед десяти людей на борту був командувач армії та його штаб, які летіли на виклик до Кабінету міністрів. Вони та екіпаж трагічно загинули.\n\nЩо спричинило катастрофу — залишається загадкою; погода була ідеальною для польотів, а літаком керував досвідчений офіцер Королівських ВПС Австралії Роберт Гічкок.\n\nНезалежно від причин, це похмурий день для всієї нації — не в останню чергу для родин і друзів жертв — і тепер Австралія дивиться на своїх лідерів. Як вони відреагують?"
 AST_conscription_level_allowed_scraping_the_barrel_tt:0 "Розблокувати додатковий рівень §YЗакону про призов§!, який зробить доступним §YВишкрібання по засіках§!"
 AST_diplomatic_events.25.a:0 "Ми погодимося; Тихоокеанський регіон буде зміцнений під централізованим контролем."
 AST_diplomatic_events.30.b:0 "Ці ресурси не для того, щоб [AST.GetName] їх забирала."
 AST_diplomatic_events.31.a:0 "Це поза нашим контролем."
 AST_diplomatic_events.42.desc:0 "Обіцянки мають одну фатальну ваду; їх можна порушити. Опинившись біля керма влади, лідери [AST.GetFascistParty] вирішили, що не тільки Науру залишається за ними, але й інші тихоокеанські острови теж.\n\nНаші старі тихоокеанські території залишатимуться такими ж далекими від нас, як і до підписання Науруанського пакту, і якщо ми хочемо змінити це, повинна бути війна."
 AST_diplomatic_events.6.desc:0 "Британія відмовляється передати Сінгапур під австралійське управління. Статус-кво збережеться."
 AST_election_events.3.desc:0 "$AST_election_season_cat_desc$"
 AST_ending_overseas_conscription_desc:0 "Наші солдати повинні негайно відплисти з чужих берегів; вони потрібні тут."
 AST_faction_training_initiative_idea_1:0 "Тренувальна ініціатива"
 AST_fly_the_jolly_roger:0 "Підняти Веселого Роджера"
 AST_for_the_southern_cross:0 "За Південний Хрест"
 AST_from_picket_line_to_front_line_desc:0 "Оскільки тактики залякування тих, хто протистоїть визволенню робітничого класу, стають дедалі агресивнішими, наш власний захист має розвиватися у відповідь. З кожним інцидентом робітники стають більш рішучими, і все більше їх приєднується до Корпусу оборони."
 AST_guaranteed_employment:0 "Гарантоване працевлаштування"
 AST_heavy_tank_aa_equipment_3:0 "Churchill Black Prince Anti-Air"
 AST_heavy_tank_artillery_equipment_1_short:0 "Matilda II SPA"
 AST_heavy_tank_artillery_equipment_2_short:0 "Churchill SPA"
 AST_heavy_tank_equipment_2_short:0 "Churchill"
 AST_holden_organization:0 "Holden"
 AST_inevitably_independent:0 "Неминуче незалежні"
 AST_inevitably_independent_desc:0 "Хоча Партія об'єднаної Австралії завжди цінувала британське громадянство, байдужість [ENG.GetNameDef] до австралійських інтересів змусила нас проголосити незалежність і поставити на перше місце власну оборону. Тепер, коли заморська служба у британських війнах природним чином перестала бути проблемою, навіть антилоялісти більш схильні підкорятися правилам; отже, розширення призову зустріне менше опору."
 AST_labor_campaign_tour_mission_desc:0 "У своїй місії представляти кожного громадянина Австралійська лейбористська партія (ALP) прийняла інший погляд на імперіалізм та лояльність Австралії до Імперії. Внутрішні потреби повинні бути на першому місці, а іноземні інтереси більше не повинні бути пріоритетом.\n\nЩоб донести це повідомлення як до нинішньої правлячої партії, так і до виборців, ALP вирушить у загальнонаціональний передвиборчий тур.\n\n§YЕфекти, поки активно:§!\n§WЩоденне зростання голосів за §YА.Л.П (A.L.P)§!: §G+0.05§!§!"
 AST_liberty_loans_desc:0 "Зі свого досвіду на посаді скарбника — чи не найкращого в країні на сьогодні, як стверджують дехто — Бен Чіфлі довів свою здатність керувати економікою воєнного часу. За його рекомендацією ми заохочуватимемо наших громадян переказувати надлишок особистих доходів на заощадження та інвестувати у військові позики."
 AST_mio_trait_all_australian_drive:0 "Суто австралійський рушій"
 AST_mio_trait_integrated_steelworks:0 "Інтегровані сталеливарні заводи"
 AST_mio_trait_utility_conversions:0 "Утилітарні модифікації"
 AST_motherland_advocate_leader:0 "Захисник Батьківщини"
 AST_nz_puppet:0 "Новозеландська маріонетка"
 AST_out_of_the_den_desc:0 "Багато хто в Ірландії досі має глибоку неприязнь до британського правління. Настав час показати нашу силу, витягнути їх із тіні та згуртувати навколо нашої справи проти спільного ворога."
 AST_party_campaign:0 "\n $AST_party_campaign_text$: §G+0.05%§!"
 AST_political_events.1.b:0 "Маркетинг, для координації загальнонаціональних схем збуту сільськогосподарської продукції."
 AST_political_events.2.desc.a:0 "Громадськість погодилася на впровадження нашої авіаційної реформи. Оскільки авіація не існувала на момент написання Конституції Австралії, це цілком справедливо, що уряд нарешті бере під свій контроль аеронавігацію та її регулювання. Задля безпеки та ефективності тепер будуть запроваджені єдині національні авіаційні закони."
 AST_political_stalwart_uap:0 "$AST_political_stalwart$"
 AST_reclaim_the_lost_territory_desc:0 "Під час процесу об'єднання австралійських колоній у федерацію Нова Зеландія врешті-решт вирішила не брати участі. Однак з того часу Конституція продовжує визначати Нову Зеландію як один із потенційних штатів Австралійської Співдружності та дозволяє її прийняття. Ми нагадаємо про це нашим східним сусідам і переконаємо, що нинішня світова ситуація вимагає єдності."
 AST_richard_williams:0 "Річард Вільямс"
 AST_right_vs_left_campaign_title_text:0 "Демократичні вибори"
 AST_royal_australian_submarine_service_desc:0 "Підводні човни — морська зброя майбутнього та важлива складова збройних сил наших союзників. Ми маємо використовувати цю військову стратегію."
 AST_scale_up_middleback_mines_steel_decision_1_desc:0 "Хоча шахта Айрон-Ноб вже деякий час працює, зі зростанням попиту на залізну руду, настав час розширити наші зусилля тут."
 AST_seven_million_britishers_conscription_tt:0 "\n§YЯкщо $AST_ending_overseas_conscription$ не завершено§!:"
 AST_singapore_strategy_tt:0 "Через §Y180§! днів §YСингапур§!:\n Додасть §G2§! §YАвіабази§!.\n Додасть §G2§! §YМорські бази§!.\n Додасть §G1§! §YБереговий форт§!."
 AST_standard_gauge_railway_desc:0 "Протягом десятиліть в Австралії використовували кілька видів залізничної колії з різною шириною, що заважало вантажоперевезенням. Настав час запровадити єдиний стандарт колії по всій країні."
 AST_submarine_1:0 "$ENG_submarine_1$"
 AST_swpa_protector_desc:0 "Австралія мусить стати основним гарантом безпеки у південно-західній частині Тихого океану. Під нашим захистом опиниться морська ділянка від Індокитаю до Індонезії та Нової Ґвінеї."
