 MUN_slovakia_little_war.4.d:0 "Незважаючи на всі наші зусилля, наші сили не змогли виграти сутичку в регіоні [71.Getname]. Нездатність вчасно зібрати достатню кількість боєприпасів та моторизованої техніки для конфлікту стала ключовим фактором нашої неможливості здобути перемогу. Попри цю невдачу, командири, які брали участь у битві, засвоїли кілька дуже важливих уроків."
