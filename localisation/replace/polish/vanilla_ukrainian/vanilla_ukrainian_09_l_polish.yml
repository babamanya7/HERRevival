 SOV_the_khakimov_proposal_desc:0 "Хакімов невтомно працював над покращенням наших стосунків із [SAU.GetAdjective]им урядом. Експерти припускають, що в регіоні є значні запаси природних ресурсів, які капіталісти, звісно ж, прагнуть присвоїти. Ми мусимо продовжувати вибудовувати взаємну довіру, щоб утримати державу [SAU.GetNameDef] від ворожих блоків і надати права на можливі ресурси насамперед нам."
 SOV_the_molotov_line_name_default:0 "Лінія Молотова"
 SOV_the_path_of_marxism_leninism_desc:0 "Безпомилкові вчення Маркса, Енґельса та Леніна підняли нашу країну з найглибшої відсталості до технологічної та промислової рівності. Було б найглибшою дурістю змінити напрямок зараз. Непереможний прапор робітничого визволення нестиметься вперед!"
 SOV_the_peoples_revolution_idea_desc:0 "Революцію мають нести люди, щоб вона справді була успішною."
 SOV_the_plan_for_the_coup_tt:0 "Відмикає §Yрішення§!, щоби схилити главу НКВС на свій бік, тим самим уможливлюючи повалення Сталіна шляхом безкровного перевороту."
 SOV_the_red_fleet_surface_2_dynamic_modifier_alt:0 "$SOV_the_red_fleet_dynamic_modifier_alt$"
 SOV_the_true_tsars_desc:0 "Російський народ завжди потребував сильного лідера, інакше він буде віддалятися все далі і далі один від одного, поки брат не піде на брата, а сини не підуть на батька. Але колишні царі не відповідали своїй ролі, були слабкими і нерішучими. У майбутньому нам знадобиться цар, який зможе відповідати важкому тягарю, покладеному на нього."
 SOV_the_ussr_academy_of_sciences_alt:0 "Імперська академія наук"
 SOV_the_workers_dictatorship_mission:0 "$SOV_the_workers_dictatorship$"
 SOV_understaffed_bureaucracy_desc:0 "НКВС виявив докази широкомасштабної змови всередині цивільної адміністрації, і кілька чиновників були усунені з посад."
 SOV_womens_fascist_movement_desc:0 "Хоча роль жінки, природно, полягає в тому, щоб забезпечити своєму чоловікові затишний дім для відпочинку і сім'ю, за яку варто боротися, багато чоловіків забули, який обов'язок вони мають перед своєю країною і своїм народом. Можливо, кілька відданих своїй справі жінок зможуть нагадати своїм чоловікам, що стоїть на кону, і заохотити їх робити те, що необхідно."
