 CHL_sway_ariosto_hererra:0 "Залучити Аріосто Ерреру"
 CHL_taking_back_patagonia_mapuche:0 "Повернути Пуельмапу"
 CHL_taking_back_patagonia_mapuche_desc:0 "Старий регіон мапуче Пуельмапу, значна частина сучасної аргентинської Патагонії, досі перебуває під іноземним гнітом, і ми не можемо звільнити інші амеріндські народи, поки не зможемо успішно звільнити свій власний. Тому, оскільки іншого шляху немає, нам доведеться розпочати війну..."
 CHL_union_of_hispanic_republics:0 "Союз гіспанських республік"
 CHU_fascism_party:0 "ЧНС"
