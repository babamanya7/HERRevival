 undisturbed_isolation:0 "Непорушна ізоляція"
 united_ma_clique_tag_fascism:0 "Об'єднана держава Хуей"
 unpopular_monarch:0 "Непопулярний монарх"
 unstable_alliance:0 "Нестабільний альянс"
 upgrade_anti_partisan_desc:0 "§LПропаганда — потужний інструмент забезпечення вірності власних громадян, але завоювати лояльність жителів ворожої території куди складніше. Навчивши наших агентів впроваджуватися у ворожий опір, ми, можливо, зможемо ефективно боротися з ним і припиняти його диверсію. партизани і втратить будь-яку надію на повернення свого колишнього режиму.§!"
 upgrade_crypto_strength:0 "Урядова школа шифрувальників"
 upgrade_decryption_boost_2_desc:0 "§LМашини вже довели свою користь у шифруванні даних — зламати машинний код найважче. Машини для криптоаналізу дуже важливі для розшифрування повідомлень, коду до яких у нас поки що немає. Ці машини дуже знадобляться нашій команді дешифрувальників.§!"
 upgrade_diplo_training_desc:0 "§LНавчивши наших агентів «підмазувати» іноземних інвесторів та дипломатів, ми, можливо, зуміємо переконати їх у правильності нашої справи, і їхні інтереси розійдуться з інтересами ворогів держави.§!"
 upgrade_economy_civilian_desc:0 "§LНаші агенти будуть навчені виконувати ролі цивільних осіб на території ворога і діяти в межах своїх промислових та цивільних секторів, збираючи розвіддані про промисловість та економіку супротивника.§!"
 usa.11.d:0 "В умовах постійної загрози бути втягнутими у війну і демократи, і республіканці прагнули знайти кандидата від військових. Генерал Даґлас МакАртур, який зазвичай відданий своїм військовим обов'язкам, скористався можливістю провести кампанію за висунення від Республіканської партії, поки наша держава перебуває в мирі та перемагає. Зараз він кидає виклик Рузвелту, підтримуючи консервативну коаліцію.\n\nРузвелт продовжує бути популярним, але харизма та почуття обов'язку МакАртура справили сильне враження на виборців. Чи справді військові знають найкраще?"
 usa.4.b:0 "Це явно вигідніше для США. І неприйнятно."
 v_class:0 "Клас «V»"
 victoria_iii:0 "Вікторія III"
 vojvodina_create_one_units_tt:0 "(§YВоєводина§!) Створити §Y1§! підрозділ §Yополчення§!."
 war_hero:0 "Герой війни"
 war_justification.19.a:0 "Незважаючи на це, ми повинні готувати людей до війни."
 war_propaganda_manga_industry_desc:0 "Щоб мотивувати наш народ до війни в Китаї, ми повинні фінансувати нові та перспективні проєкти, такі як «Норакуро» та «Фронт у Північному Китаї: Загін Хей-тян», щоб надихнути їх на участь у військових зусиллях."
 warriors_heart_march:0 "Warrior's Heart March"
 weather_arctic_water:0 "Арктичні води"
 western_betrayal:0 "Зрада Заходу"
 will_be_upgraded_to:0 "§YПоліпшиться до:§! "
 women_in_the_workforce_desc:0 "Коли чоловіки пішли на війну, тисячі жінок узялися за роботу, щоби надалі підтримувати наші війська."
 wtt_border_conflict_canceled_attacker.1.desc:0 "Бойові дії в зоні [our_state.GetName]–[their_state.GetName] припинилися, оскільки обидві сторони виявилися неспроможними витіснити іншу. Обидві сторони отримали небагато території. Скаути повідомляють, що солдати [their_country.GetAdjective]і війська з іншого боку окопуються на оборонній місцевості. Здавалося б, вони мають намір зберегти територію, яку мають, але, мабуть, не будуть натискати на наші рубежі."
 wtt_britain_lease_azores.4.a:0 "Британці завжди повертають свої борги."
 wtt_burma_road.4.t:0 "[From.GetNameDefCap] наново відкриває Burma Road"
 wtt_china_shared.3.desc:0 "У дуже строгій ноті [From.GetLeader] повідомив нам про те, що його уряд не зазнає втручання в [From.GetAdjective]і внутрішні справи. Дипломатичні протоколи не дозволяють оголосити лідера [From.From.GetLeader] персоною нон-грата та заборонити йому в'їзд, але практично всій нашій делегації було заборонено повертатися до держави [From.GetNameDef]."
 wtt_germany.1.t:0 "Офіцери вермахту кидають виклик Гітлеру"
 wtt_germany.15.d:0 "Поляки вирішили прийняти пропозицію та розпорядилися переглянути свої межі на нашу користь. Вони довірилися нам і закликають нас бути готовими до можливої [SOV.GetAdjective]ої агресії..."
 wtt_germany.17.t:0 "Німецькі комуністи біжать до Франції"
 wtt_germany.40.t:0 "[From.GetNameDefCap] відмовляється повернути Ціндао"
 wtt_germany.55.desc:0 "Австрійський народ проголосував за об'єднання зі своїми північними братами. Інтеграція земель та збройних сил Австрії розпочнеться негайно."
 wtt_germany.65.desc:0 "Представники держави [From.GetNameDefCap] поінформували нас про те, що їхнім військам необхідно перетнути наші землі, щоб атакувати радянські сили. Вони нагадують, що продовжують захищати нас від комуністичної загрози, а значить ми зобов'язані допомогти їм у поточній війні."
 wtt_germany.8.d:0 "[From.GetNameDefCap] звернувся до прихильників монархії та антифашистки налаштованим представникам італійського уряду, а також до керівників підпілля з пропозицією усунути Муссоліні та поставити як керівник держави Віктора Еммануїла III. Німці запевняють, що зможуть здійснити вбивство; все, що нам потрібно зробити, — це заявити про свою готовність створити новий уряд та підтримувати Німеччину у її подальших військових діях."
 wtt_japan.114.desc:0 "Демократичні елементи в уряді влаштували переворот після того, як військові пригрозили знову обмежити так важко отримані демократичні права громадян. Хоча дехто з них із дивовижною рішучістю та зі зброєю в руках виступив на захист народу та його прав на свободу. Розкол у військовому керівництві дозволив народним представникам захопити законодавчі та виконавчі органи влади. Сутички щойно почалися, але навряд чи чинний уряд буде так легко повалити."
 wtt_manchukou.11.t:0 "П'ятирічний план"
 wtt_news.13.desc:0 "У відповідь на інтенсивну протидію англійців та французів рішенню повернути кайзера Вільгельма II уряд Німеччини запропонував піти на компроміс. Вільгельм II продовжить жити у вигнанні, але на німецький трон під ім'ям Вільгельма III піде його син.\n\n[ENG.GetNameDef] і [FRA.GetNameDef] ухвалили цю пропозицію, завдяки чому можна сподіватися на збереження миру між провідними європейськими державами."
 wtt_news.23.t:0 "Вішістська Франція анексована"
 wtt_news.43.e:0 "Ефект відчують усі."
 wtt_news.55.a:0 "Мрія про об'єднану Латинську Америку чекає!"
 wtt_news.56.b:0 "Дуалістична монархія постає знову."
 wtt_news.68.b:0 "They have seized their own destiny."
 wtt_political_organisation.8.desc:0 "Група бойовиків, яких спонсорує [majority_country.GetLeader], атакувала прихильників нашого уряду, які організували демонстрацію в області [state.GetName]. В результаті декілька участників мітінгу були вбиті, а рівень підтримки нашої влади опустився до небезпечного рівня."
 wtt_soviet_hold_city_t_fail:0 "[soviet_city.GetName] падає"
 wtt_warlord_vs_prc.2.b:0 "Ми ніколи не скоримося зрадникам!"
 wtt_xian_incident.4.b:0 "Ми досі пам'ятаємо останню спробу."
 wtt_xian_incident.6.a:0 "Це наш єдиний варіант."
 wtt_xian_incident.7.t:0 "[CHI.GetLeader] заарештований у державі [CHI_xian_instigator.GetNameDef]!"
 wunschkonzert:0 "Wunschkonzert"
 wuw_GER_civil_war.6.desc:0 "Після тривалого незадоволення серед пролетаріату ситуація в [ROOT.GetNameDef] переросла у збройний конфлікт. Війська [ROOT.GetLeader] зазнали поразок у ряді регіонів. Що чекає цей заколот — покаже час."
 wuw_GER_civil_war.7.desc:0 "Існує ймовірність, що Крігсмаріне підтримає [ROOT.GetLeader] під час нашого перевороту. Еріх Редер був запевнений у значному фінансуванні флоту. Чи варто нам дати йому схожі обіцянки?"
 wuw_GER_civil_war.8.t:0 "Переворот Крігсмаріне"
 wuw_GER_diplomacy.101.a:0 "Нерозумні [FROM.GetAdjective]и..."
 wuw_GER_diplomacy.11.a:0 "Нахабство!"
 wuw_GER_diplomacy.110.a:0 "Жадібні [FROM.GetAdjective]и..."
 wuw_GER_diplomacy.37.desc:0 "Наш запит про повернення колоній був схвально сприйнятий у [FROM.GetNameDef]. Хоча вони не виглядали особливо щасливими з цього приводу, керівництво вирішило передати території, що по праву належать нам."
 wuw_GER_diplomacy.63.desc:0 "\nНаш сюзерен [FROM.GetLeader] оголосив, що Північний Шлезвіг завжди буде [FROM.GetAdjective]. Війська [FROM.GetNameDefCap] увійшли в регіон, а нова адміністрація змусила наших політиків підписати договір про передачу території на 100 років."
 wuw_GER_diplomacy.69.t:0 "[FROM.GetNameDefCap] відкидає пакт"
 wuw_GER_diplomacy.74.t:0 "[FROM.GetNameDefCap] забороняє політичний вплив"
 wuw_GER_diplomacy.89.a:0 "Добре, noted..."
 wuw_GER_legions.6.desc:0 "[SOV.GetAdjective] війська відвоювали регіон Локот і ліквідували створену нами автономну державу, а також заарештували і знищили всіх членів місцевого колабораційного уряду."
 wuw_GER_legions.8.b:0 "Навіщо нам допомога якихось козаків?"
 wuw_GER_monroe.2.desc:0 "Після тривалого тиску з боку [FROM.GetAdjective], схоже, Доктрина Монро нарешті починає тріщати по швах. Кілька країн виступили проти Доктрини та почали тісніше співпрацювати з [FROM.GetAdjective]. Хоча опозиція гучна, залишаються ті, хто все ще вважає Доктрину вартісною. Всі наші подальші дії відтепер будуть спробами пом’якшення наслідків — слід ретельно обрати нашу реакцію."
 wuw_GER_monroe.5.b:0 "Їм не слід втручатися в наші справи!"
 wuw_GER_realpolitik.24.a:0 "Дуже добре"
 wuw_GER_realpolitik.26.a:0 "Ми не бачимо в цьому проблеми"
 wuw_GER_realpolitik.38.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що наші вимоги щодо підкорення суперечать самій ідеї суверенітету та самовизначення [FROM.GetAdjective] народу. Схоже, вони не хочуть бути частиною Великонімецької держави."
 wuw_GER_realpolitik.40.a:0 "Дуже добре"
 wuw_GER_realpolitik.42.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прибув до нашої столиці з пропозицією приєднатися до їхнього альянсу і знову битися пліч-о-пліч як брати, як це було у Великій війні. Вони також обіцяють допомогти нам у поверненні старих австро-угорських земель і відновленні територіальної цілісності Імперії. Чи приймемо ми цю пропозицію?"
 wuw_GER_realpolitik.5.desc:0 "Як зазначалося в Брест-Литовському мирному договорі, землі, що нині відомі як Литва, мали стати нашим васалом, хоча точні деталі не були остаточно визначені. Тепер, коли це знову стало актуальним, нам слід вирішити, як поводитися з [LIT.GetNameDef]?"
 wuw_GER_realpolitik.53.a:0 "Вони пошкодують про це!"
 wuw_GER_realpolitik.56.b:0 "Ми повинні відступити..."
 wuw_GER_realpolitik.59.t:0 "[FROM.GetNameDefCap] відкидає подальшу інтеграцію"
 wuw_GER_realpolitik.63.t:0 "[FROM.GetNameDefCap] запрошує нас до митного союзу"
 wuw_GER_reichskommissariats.14.t:0 "Керівництво Іберії"
 wuw_GER_reichskommissariats.6.t:0 "Керівництво Кавказу"
 wuw_GER_weltpolitik.10.desc:0 "Договір офіційно підписано, і землі мають бути передані. Проте в Конґо чинять опір — і його доведеться придушити..."
 wuw_GER_weltpolitik.16.b:0 "Жодним чином!"
 wuw_GER_weltpolitik.19.a:0 "Це не варте пролиття крові"
 wuw_GER_weltpolitik.6.desc:0 "[FROM.GetLeader] заявив, що від імені всіх хоробрих громадян [FROM.GetNameDef], [FROM.GetLeader.GetSheHe] не буде підтримувати наші абсурдні ідеї про поділ Конґо — країни, яка не має з нами жодного зв’язку. Схоже, рішення остаточне."
 wuw_GER_weltpolitik.9.a:0 "Тоді ми їх зітремо з лиця землі"
 wuw_HUN_capital_ship_efforts:0 "Зусилля щодо капітальних кораблів"
 wuw_HUN_degauss_ship_hulls_desc:0 "Ми почнемо розмагнічування корпусів кораблів, щоб знизити їхній магнітний слід. Це захистить від магнітних мін і зменшить електронний профіль суден."
 wuw_HUN_empower_the_greenshirts_desc:0 "Хоча націонал-соціалісти мають розбіжності з Ґьомбьошем, вони проти Горті. Ми передамо їм зброю для повалення регента."
 wuw_HUN_enlarge_the_ganz_danubius_division:0 "Розширити підрозділ Ganz Danubius"
 wuw_HUN_protect_austria_desc:0 "Щоб протистояти прагненням [GER.GetNameDef] об’єднатися з [AUS.GetNameDef], ми надамо їм гарантії. В обмін вони мають повернути нам Бурґенланд."
 wuw_HUN_reviving_the_spirit_of_1848_requirements_tt:0 "Підтримка §Yкомуністів§! або §Yдемократів§! більша, ніж підтримка §YNEP§! та §YMNSP§!"
 wuw_HUN_royalist_education_initiative_desc:0 "Народ потрібно не тільки навчити поводженню, а й підготувати до славного майбутнього, яке ми йому обіцяємо. У процесі ми виховаємо чимало нових яскравих [ROOT.GetAdjective] вчених."
 wuw_HUN_seek_german_contracts_tt:0 "Якщо §Y[GER.GetName]§! має більше 25 думки про §Y[ROOT.GetName]§!, але менше 50 — отримати 1 §Yпозаекранну військову фабрику§!. Якщо більше 50, але менше 75 — отримати 2 §Yвійськові фабрики§!. Якщо більше 75 — отримати 2 §Yвійськові фабрики§! та 1 §Yцивільну фабрику§!.\nНаразі ми отримаємо:"
 wuw_HUN_undermine_the_admiral:0 "Підірвати авторитет адмірала"
 wuw_HUN_ward_against_extremism_tt:0 "Усі члени фракції отримають цей національний дух"
 wuw_HUN_wolfs_of_the_sea:0 "Морські вовки"
 ww_BEL_event_diplomatic.19.a:0 "Неприємно"
 ww_BEL_event_diplomatic.22.a:0 "Справжній сором..."
 ww_BEL_event_diplomatic.27.t:0 "[FROM.GetNameDefCap] Дозволяє обмежену федералізацію"
 ww_BEL_event_diplomatic.6.desc:0 "Ми щойно отримали нахабну вимогу від [BEL.GetName], щоб передати їм Кале! Вони стверджують, що ця земля законно належить Бельгії через історичне герцогство Бургундія, до якого вони начебто мають певне спадкове право. Їхні посли були досить прямими у своїх погрозах насильства, якщо ми не погодимося з їхніми вимогами, хоча, враховуючи їхню військову силу, це, ймовірно, блеф."
 ww_BEL_event_diplomatic.7.desc:0 "Ми тільки що отримали цікаву пропозицію від [BEL.GetAdjective] делегації. Вони запропонували обмін територіями: Кале на велику частину Конґо. Ми отримаємо держави Кокілятвіль і Стенлівіль, які межують з нашими територіями в цьому районі. Їхні дипломати натякнули на погрози, якщо ми відмовимося від цієї пропозиції, і це буде значне розширення наших африканських володінь, але чи варте це того?"
 ww_BEL_event_diplomatic.8.a:0 "Ні, Кале для нас цінніше."
 ww_BEL_event_diplomatic.8.t:0 "Бельгія хоче придбати Кале"
 ww_BEL_event_political.1.b:0 "Вандервельде формує уряд меншості"
 ww_BEL_event_political.6.t:0 "Фламандське питання"
 ww_BEL_event_political.7.desc:0 "Зараз, коли конституційну кризу вдалося тимчасово приборкати, настав час знову підтвердити легітимність уряду, інакше він не відрізнятиметься від того, який щойно був скинутий. Наразі Поль-Анрі Спаак від соціалістів та Губерт П'єрло від католицької партії є основними кандидатами на дострокових виборах."
 ww_BEL_event_political.8.c:0 "Наші мови рівні, і ми збережемо обидві!"
 ww_BEL_event_spanish_interaction.6.desc:0 "Раніше нейтральні [FROM.GetAdjective]и надіслали нам несподівану пропозицію. Вони бажають утворити альянс з нами. Вони сподіваються, що це дозволить їм надавати нам кращу підтримку у боротьбі проти націоналістів."
 ww_congo.13.t:0 "[FROM.GetNameDefCap] вимагає нашої інтеграції"
 ww_congo.34.desc:0 "Ганський панафриканістський політик Кваме Нкрума сьогодні прибув до нашої столиці за офіційним запрошенням [ROOT.GetLeader]. Як запеклий соціаліст, багато хто вважає, що співпраця з ним може бути корисною, якщо ми хочемо забезпечити майбутнє Африки, і деякі навіть стверджують, що він повинен очолити нашу націю. Який буде найкращий курс дій?"
 ww_congo.36.a:0 "Як лицемірно, їхнє імперіалістичне насильство можна зупинити лише силою."
 ww_congo.43.a:0 "Ми не можемо багато зробити"
 ww_congo.47.t:0 "Дім Нтверо з Бурунді"
 ww_congo.5.b:0 "Якщо він вважає, що це на краще..."
 ww_congo.54.a:0 "Чудово!"
 ww_congo.59.b:0 "Ні!"
 ww_congo.59.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], нещодавно звернувся до одного з наших дипломатів, благаючи, вмовляючи нас відновити наше панування над його королівством, навіть назвавши свою державу Міттелафрикою. Він був під нашим захистом, коли правив як король Руанди, але згодом був скинутий бельгійськими властями. Чи повинні ми прислухатися до божевільного короля?"
