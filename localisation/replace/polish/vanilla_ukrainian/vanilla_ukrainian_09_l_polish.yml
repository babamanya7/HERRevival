 china.11.d:0 "Попри наші спроби відбити атаку місцевих пронаціоналістичних військ, нашої підготовки було недостатньо. З великими втратами ми були вимушені зробити новий відступ, хоч на цей раз коротший.\n\nОпір націоналістам до повного відновлення, схоже, був помилкою. Наше дивовижне відновлення після Великого походу вселило надію в тих, хто нас підтримував, але тепер було посаджено зерно сумління."
