 AUS_proclaim_austrian_empire:0 "Нова Австрійська імперія"
 AUS_reinforcing_the_supply_network_desc:0 "Ми зрозуміли, що зусиль, яких ми доклали для покращення ситуації з нашим постачанням шляхом підвищення стійкості нашої армії до нестачі постачання, недостатньо. Щоб вирішити ситуацію раз і назавжди, потрібно повсюдно покращити саму мережу поставок."
 AUS_schutzbund_support_tt:0 "§Y3§! §Yдивізії Шуцбунду§! будуть розгорнуті в §Y[4.GetName]§! у випадку початку §YКомуністичної§! громадянської війни.\n\nОпозиційна сторона отримає лише §Yодну§! замість §Rдвох§! §Yдивізій Гаймверу§! в §Y[152.GetName]§!"
 AUS_supporting_the_troops:0 "Підтримка військ"
 AUS_the_future_of_austria:0 "Майбутнє Австрії"
 AUS_the_matzen_oil_fields_desc:0 "Нещодавно нам пощастило. Нафту знайшли в районах навколо Матцена на сході Австрії. Це можливість для нас видобувати цей ресурс і дати собі промислову перевагу!"
 AUS_theodor_korner:0 "Теодор Кьорнер"
 AUS_train_equipment_1:0 "BBÖ 81"
 AUS_unlocks_militarist_decisions_tt:0 "§YВідкриває Рішення§! §Y$AUS_arm_border_guards_decision$§! і §YПочати $AUS_military_exercises_on_border_decision$§!\n"
 AUS_viktor_kienbock:0 "Віктор Кінбьок"
 AZR_fascism_ADJ:0 "Азербайджанськ"
 Anatolikon:0 "Анатолік"
 August:0 "серпня"
 BALTIC_align_paramilitarists_desc:0 "У державі [Root.GetNameDef] повно воєнізованих угруповань, багато з яких присвячені виключно захисту [Root.GetAdjective] самовизначення. Як би чудово це не було, краще, якщо ці угруповання будуть вважати нас не [SOV.GetAdjective] маріон, А логічним продовженням [Root.GetAdjective] держави."
 BALTIC_baltic_fleet:0 "Балтійський флот"
 BALTIC_communist_opposition_desc:0 "Радянський Союз показав нам, що він не друг ні державі [Root.GetNameDef], ні його народу, і безглуздо було б вручати ключі від держави стерв'ятникам з Червоної армії, які тільки й чекають, щоби пограбувати [Root.GetAdjective]ий народ. Довіряти їм можна не більше, ніж капіталістам, і, якщо ми хочемо, щоб партія [Root.GetCommunistParty] досягла успіху, потрібно робити все самим!"
 BALTIC_end_swedish_neutrality_desc:0 "Те, що шведи називають нейтралітетом, — не що інше, як слабкість і готовність підкоритися будь-кому, хто здасться сильнішим, не дбаючи при цьому про життя пригніченого класу на своїх кордонах. Такий слабовільний і незграбний уряд. Ми мусимо створити нову Швецію — таку, якій вистачить мужності захистити свій народ від тиранії."
 BALTIC_events.102.a:0 "Нам доведеться знайти інше рішення."
 BALTIC_events.4.b:0 "Зректися? Ніколи!"
 BALTIC_events.7.b:0 "Революція може зачекати."
 BALTIC_german_tank_licences_desc:0 "[GetGermanTankLicencesDesc]"
 BALTIC_german_war_economics_desc_alt:0 "Наші фашистські піклувальники зараз ведуть військову індустріалізацію майже небаченими темпами. Буде правильно скористатися їх прикладом і попросити у них фінансових вливань."
 BALTIC_will_be_at_war_with_LIT:0 "Якщо вони погодяться, §Y[Root.GetNameWithFlag]§! негайно опиниться §Rу війні§! з державою §Y[LIT.GetNameWithFlag]§!."
 BAR_communism_party:0 "ЛНП"
 BATTLE_DEFENCE:0 "Оборона"
 BAY_STATE_152:0 "Оберьостеррайх"
 BAY_VICTORY_POINTS_708:0 "Оуґшбурґ"
 BBA_african_union_events.7.b:0 "Ми на таке не підписувались."
 BBA_african_union_events.8.a:0 "Ще один крок до повної інтеграції."
 BBA_ethiopia_balance_of_power_events.01.desc_communism:0 "Зростаюча централізація держави [THIS.GetName] в поєднанні з відсутністю широкої підтримки керівної влади та загальною нестабільністю в регіоні вилилась у відкрите повстання проти центрального уряду. Анархісти оголосили, що звільнять націю від нашої влади."
 BBA_ethiopia_balance_of_power_events.25.t:0 "Військово-політичні офіцери"
 BBA_ethiopia_communist_events.11.t:0 "[ETH.GetName] просить військових радників"
 BBA_ethiopia_communist_events.19.desc:0 "[SOV.GetNameDefCap] надіслали нам бронетехніку для підтримки в боротьбі проти [ITA.GetAdjective]. Хоча це не найновіші зразки, вони будуть корисними на фронті, навіть просто як моральна підтримка."
 BBA_ethiopia_communist_events.25.desc:0 "[ETH.GetNameDefCap] звернулися до нас з надією, що ми зможемо виступити посередниками між ними та [ITA.GetAdjective]ою владою. [ITA.GetAdjective]у владу не зворушили жорсткі заяви Ліги Націй, тож будь-яке наше посередництво, ймовірно, потребуватиме погрози силою. Ми маємо ретельно зважити, чим готові ризикувати заради [ETH.GetNameDef]."
 BBA_ethiopia_communist_events.38.t:0 "[ETH.GetNameDefCap] пропонує допомогу"
 BBA_ethiopia_communist_events.46.t:0 "[ETH.GetNameDefCap] пропонує мир"
 BBA_ethiopia_communist_events.56.a:0 "Ганбаре, товариші!"
 BBA_ethiopia_exile_events.06.b:0 "Зараз ми не можемо йти на перспективні землі"
 BBA_ethiopia_exile_events.06.desc:0 "[FROM.GetLeader] просить контроль над областю [550.GetName], якщо нам вдасться перехопити її в держави [550.Owner.GetNameDef]. Область була під [ETH.GetAdjective]им контролем, тому історичний пріоритет для цієї вимоги існує. [FROM.GetLeader] також висунув аргумент, що весь народ хабеша мусить бути об'єднаний під владою одного правителя, посилаючися на той факт, що відтоді, як [ITA.GetAdjective]і сили окупували область [550.GetName], [FROM.GetNameDef] не має доступу до моря."
 BBA_ethiopia_exile_events.41.desc_back_off:0 "[FROM.GetLeader] явно перейшла на бік нашого ворога. [?global.ETH_peace_country.GetLeader] дозволено перебувати і вдавати, що він все ще при владі, в [FROM.GetNameDef] вже досить довгий час. Брехня колишнього лідера [?global.ETH_peace_country.GetNameDef] явно вплинула на [FROM.GetLeader] і погіршила ставлення [FROM.GetLeader.GetHerHis] до [ROOT.GetNameDef]. Тепер [FROM.GetNameDef] вимагає, щоби ми просто вийшли з [?global.ETH_peace_country.GetName] і відклали наші розбіжності в сторону."
 BBA_ethiopia_exile_events.45.desc_cede_territory:0 "[FROM.GetLeader] уклав мир з [FROM.FROM.GetNameDef]. На жаль, два лідери вирішили у нас над головою, що [FROM.FROM.GetName] повинен отримати частину [ROOT.GetName]. Ми нічого не можемо з цим зробити."
 BBA_ethiopia_exile_events.52.a:0 "Ще на крок ближче до дому."
 BBA_ethiopia_fascist_events.07.t:0 "Громадянська війна в Ефіопії"
 BBA_ethiopia_fascist_events.55.desc:0 "У невиправдано різкій відповіді [ITA.GetAdjective]ий уряд відхилив наш запит на військове оснащення. Наразі незрозуміло, чим обґрунтоване таке рішення. Ми мусимо просто покладатися на власну промисловість, щоби продовжити план модернізації."
 BBA_ethiopia_fascist_events.67.t:0 "[ITA.GetName] відмовляє в територіальній компенсації"
 BBA_ethiopia_fascist_events.68.desc:0 "Минулої ночі склад [ITA.GetAdjective] озброєнь був успішно розграбований. Італійська влада з люттю звинувачує нашу адміністрацію в організації цього інциденту, попри відсутність доказів. Хоча, мабуть, вони можуть щось запідозрити, побачивши наші солдати з новенькими [ITA.GetAdjective] гвинтівками..."
 BBA_ethiopia_imperial_events.8.t:0 "[FROM.GetNameDefCap] підкорюється"
 BBA_ethiopia_military_and_tech_events.1.b:0 "Школа допоможе нам перейти до оборонного стилю мислення."
 BBA_italo_ethiopian_war_events.110.desc:0 "Ліга Націй вимагає негайного припинення військових дій між державами [ROOT.GetName] та [FROM.GetName]. Резолюція Ради дає право країнам-членам оголосити війну державі [ROOT.GetDameDef], якщо ми відмовимося виконати вимогу."
 BBA_italo_ethiopian_war_events.16.a:0 "Поживемо — побачимо."
 BBA_italo_ethiopian_war_events.301.desc:0 "Наші армії в [ETH.GetName] практично не прогресують і несуть великі втрати. Опір шалений, і ми мусимо боротися за кожен дюйм, який ми здобуваємо. Бойовий дух у всіх арміях на найнижчому рівні, і ми навіть отримали повідомлення про те, що деякі підрозділи відмовляються виконувати прямі накази."
 BBA_italo_ethiopian_war_events.302.a:0 "Тривожні новини!"
 BBA_italo_ethiopian_war_events.401.a:0 "Немає сенсу чинити опір."
 BBA_italo_ethiopian_war_events.501.a:0 "Ми не маємо вибору."
 BBA_italo_ethiopian_war_events.501.desc:0 "Наша милостива країна, яка прихистила нас після того, як наш власний народ був захоплений державою [ITA.GetNameDefCap], схоже, втомилася від нас. Вони плетуть інтриги за нашими спинами, щоби змусити нас підписати мирний договір з нечестивими італійськими загарбниками. На жаль, ми мало що можемо з цим зробити."
 BBA_italy_air_accident.02.a:0 "Трагічно..."
 BBA_italy_anti_colonialism_events.01.d:0 "Ми повинні інвестувати в Ефіопію та ефіопські народи."
 BBA_italy_anti_colonialism_events.02.c:0 "Занадто пізно, вони стануть на коліна!"
 BBA_italy_anti_colonialism_events.13.desc:0 "Схоже, що уряд держави [FROM.GetName] за час війни з нами здобув чимало поваги до наших сил і засобів. Настільки, що він запропонував нам взаємну угоду про ненапад і гарантії на випадок війни."
 BBA_italy_anti_colonialism_events.14.desc:0 "[FROM.GetLeader] мудро погодився підписати запропонований нами пакт про взаємний ненапад між державами [FROM.GetName] та [ROOT.GetName], а також взаємну гарантію — на випадок, якщо один з нас зіткнеться з агресором."
 BBA_italy_anti_colonialism_events.52.desc:0 "Жителі Північної Африки побачили, як доброзичливо та ефективно ми управляємо їхніми землями, і проголосували за те, щоб приєднатися до нашої адміністрації! Здається, що наші інвестиції та турбота про їхні провінції окупилися. Це, безумовно, піде на користь усім нам."
 BBA_italy_bop.2.desc:0 "Ворожі сили захопили контроль над [?ITA.ITA_lost_colony.GetName], шокувавши італійців звідусіль! Люди були під враженням, що хід війни був на нашу користь, або принаймні скоро буде на нашу користь. Хоча це, безумовно, невдача, з хорошим плануванням і силою духу ми обов'язково повернемо собі [?ITA.ITA_lost_colony.GetName]!"
 BBA_italy_communist_events.01.b:0 "Треба йти за Пальміро Тольятті."
 BBA_italy_interaction_events.1.t:0 "[ITA.GetLeader] вимагає [846.GetName]"
 BBA_italy_interaction_events.26.t:0 "[ITA.GetNameDef] відступає"
 BBA_italy_interaction_events.30.desc:0 "[ITA.GetName] запропонувала підтримати наші претензії до регіону [45.GetName] в обмін на взаємні гарантії та договори про співпрацю. Нам здається, що це гарна пропозиція, чи варто її прийняти?"
 BBA_italy_interaction_events.34.b:0 "Це обурливо."
 BBA_italy_interaction_events.34.desc_continued_negotiation:0 "Італійці повернулися до нас з черговою вимогою. Тепер вони хочуть володіти регіонами [458.GetName] і [665.GetName]. Вони стверджують, що це потрібно для того, щоб вони могли мати більш справедливу частку на півночі Африки, порівняно з нами та британцями. Якщо ми віддамо їм ці території, вони заявляють, що будуть тимчасово платити нам за наші зусилля."
 BBA_italy_interaction_events.44.desc:0 "[FROM.GetLeader] розпочав ініціативу щодо створення союзу з країнами Південної Америки та об'єднання латиноамериканських культур під однією владою. Це здається гарною можливістю для захисту від [USA.GetNameDef]. Як ми повинні реагувати?"
 BBA_italy_interaction_events.51.t:0 "Англійці відмовляються від переговорів"
 BBA_italy_interaction_events_news.1.desc:0 "Інформаційні агентства по всьому світу отримали повідомлення від італійського міністерства оборони про те, що німці вирішили відступити після того, як наполягали на своїх претензіях на австрійську територію. Це історичний день для Європи, і лише час покаже, що станеться зі зруйнованою німецькою державою."
 BBA_italy_local_rulers.1.t:0 "$ETH_haile_selassie_gugsa$ звертається до італійських урядовців"
 BBA_italy_missiolinis.02_north.t:0 "Північний фронт стоїть"
 BBA_italy_missiolinis.102.t:0 "Невдача в Албанії"
 BBA_italy_missiolinis.12.a:0 "Абіссінці ведуть запеклу боротьбу."
 BBA_italy_missiolinis.12.desc:0 "Факт, що Абіссінія досі вільна та опирається окупації, на довгі години розлютив дуче, і він назвав це ганьбою не просто особисто для нього, але й для Італії та її народу. Він скаржиться до всіх поблизу, що якби він міг наглянути за останніми фазами війни самостійно, все вже було б скінчено."
 BBA_italy_missiolinis.21.a:0 "Ми принесемо мир і стабільність."
 BBA_italy_missiolinis.83.t:0 "Великі технологічні інновації"
 BBA_italy_naval_cooperation_programs.06.desc:0 "Короткозорість уряду держави [FROM.GetName] вражає! Відмова від нашої пропозиції провести спільні морські навчання, щоб краще підготувати й навчити наші флоти, лише демонструє їхню зарозумілість."
 BBA_italy_purge_the_party.1.c:0 "Помилувати їх усіх."
 BBA_italy_recognize_the_empire.2.t:0 "Імперське визнання"
 BBA_italy_recognize_the_empire.3.desc:0 "[FROM.GetNameDefCap] безглуздо насміхається з наших імперських амбіцій, стверджуючи, що самі по собі мрії та видавання бажаного за дійсне не збудують імперію. Вони повинні заплатити ціну за таку зухвалість! Ми будемо чекати свого часу — поки що — але ми готові показати цим недоумкам справжню міць Італійської імперії."
 BBA_italy_research_agreement.2.desc:0 "[FROM.GetNameDefCap] нерозумно відхилила нашу пропозицію про військову співпрацю. Ця спільна програма зміцнила б військовий потенціал обох країн, але, схоже, [FROM.GetName] не зацікавлений у такій угоді. На щастя, нам не потрібна їхня допомога для досягнення наших цілей!"
 BBA_swiss_expansion.10.a:0 "Нарешті!"
 BBA_swiss_expansion.12.desc_FRA:0 "Наша сестринська республіка [FROM.GetNameDef] прагне взяти під своє крило всі Альпи й вже висунула на них претензії.\n\nНаші [ROOT.GetAdjective] Альпи були частиною нашої нації дуже довгий час, але передача їх під контроль [FROM.GetAdjective] стане винагородою за їхню вірність і рішучість, перетворивши їх на ще потужнішого союзника."
 BBA_swiss_expansion.6.desc:0 "Схоже, що [FROM.GetName] вимагає, щоб штат [848.GetName] приєднався до їхньої конфедерації. Вони посилаються на референдум 1919 року, на якому штат переважною більшістю проголосував за вступ як кантон до [FROM.GetNameDef], але тоді був відхилений самими [FROM.GetAdjective]. Схоже, тепер вони передумали.\n\nЧи погодимось ми, чи ні — очевидно, що вони мають наміри на розширення, тож варто діяти обережно і бути готовими до захисту нашої території, навіть якщо ми виконаємо їхню вимогу."
 BBA_swiss_expansion.7.t:0 "[FROM.GetNameDefCap] відмовили у нашій вимозі приєднати [848.GetName] до [ROOT.GetName]"
 BBA_switzerland.1.t:0 "[ROOT.GetAdjectiveCap]і керівні принципи"
 BBA_switzerland.11.t:0 "Давід Франкфуртер засуджений до тюремного ув’язнення"
 BBA_switzerland.19.t:0 "[FROM.GetNameDefCap] запрошує нас приєднатися до їхньої Антанти"
 BBA_switzerland.3.a:0 "Суд відбудеться, як і заплановано."
 BBA_switzerland_trade.4.a:0 "Поновлюємо угоду"
 BECOME_SPY_MASTER_NO_SUBJECT:0 "§RСуб'єкти не можуть очолювати розвідмережі.§!"
 BEL_AUS_autonomy_eu_member:0 "Європейська Бельгія"
 BEL_STATE_6:0 "Влаандерен"
 BEL_austrian_resistance_active_state_dynamic_modifier_desc:0 "Австрійський фронт свободи активний в державі, що забезпечує більший набір для рекрутів і більше спротиву, якщо держава буде окупована."
 BEL_belgian_fuhrer:0 "Бельгійський фюрер"
 BEL_belgian_miracle_dynamic_modifier:0 "Бельгійське диво"
 BEL_camille_huysmans:0 "Каміль Гьойсманс"
 BEL_demand_further_gallic_concessions_desc:0 "Час позбутися покривала інтриг і дозволити нашим справжнім намірам засяяти. Розбіжності між нами ніколи не були таємницею, але ми повинні показати свою перевагу раз і назавжди. Час захопити нашу долю, що б не сталося."
 BEL_democratic_homecoming_desc:0 "Не монархія здобула для нас нашу батьківщину, а наші демократичні інститути і процес підняття найкращих наших громадян до лідерства. Ми повинні визнати їхній безцінний внесок у цей момент і закріпити їхні успіхи для майбутніх поколінь."
 BEL_european_union:0 "Європейський Союз"
 BEL_flanders_neutrality:0 "Велике герцогство Фландрія"
 BEL_form_alliance_with_spain:0 "Сформувати союз із [FROM.GetNameDef]"
 BEL_gold_reserves:0 "Золотовалютні резерви"
 BEL_gold_reserves_construction:0 "Схвалити національну будівельну програму"
 BEL_government_resigns:0 "Уряд йде у відставку"
 BEL_infantry_equipment_1:0 "Mauser M35"
 BEL_infantry_equipment_3:0 "FN Fusil Automatique Léger"
 BEL_koningshooikt_wavre_line:0 "Лінія Конінґсгоойкт-Вавр"
 BEL_koningshooikt_wavre_line_desc:0 "Лінія Конінґсгоойкт-Вавр, або коротко Лінія КВ, є другою лінією оборони між Конінґсгоойктом і Вавром. Ці позиції готуються спеціально для занять нашими та союзними силами, а не для гарнізонів, і складаються з траншей, бункерів та Бельгійських воріт. Це дуже надійна лінія оборони і має стати основною точкою опору для нас."
 BEL_legacy_of_the_soldier_king_tt:0 "§YКороль Леопольд§! більше не піддасться військовому тиску і не здасть країну, якщо в неї буде вторгнення."
 BEL_lucien_lippert:0 "Люсьєн Ліпперт"
 BEL_peacekeeping_missions_desc:0 "Триваючі конфлікти по всьому світу продовжують нас турбувати, однак для того, щоб зберегти зовнішній вигляд нейтралітету, ми можемо надсилати війська за кордон лише в рамках санкціонованих миротворчих місій."
 BEL_re_establish_belgian_navy:0 "Відновлення бельгійського флоту"
 BEL_spanish_intervention:0 "Інтервенція в Іспанію"
 BEL_the_council_of_europe:0 "Рада Європи"
 BEL_the_lost_tribe_desc:0 "Пляма, яку [BEL.GetName] повинна була нести, це асоціація з переможеними та поневоленими галльськими народами. Ми є власним втраченим плем'ям германців. Ми ті, хто чинить опір. Ми ті, хто бореться. Ми ті, хто завойовує."
 BEL_tripartite_government:0 "Трипартійний уряд"
 BEL_van_overstraeten_on_the_home_front_desc:0 "Найрозумніший серед усіх військових, хоча й має недолік — він це знає. Ван Оверстратен відмінно виконував роль військового радника короля до початку війни, і, хоча його характер ускладнює роботу з ним, наші обставини змушують нас звернутися до нього, щоб він очолив наші сили та привів націю до перемоги."
 BHU_jigme_wangchuck:0 "Джіґме Ванґчук"
 BLR_SOV_communism_autonomy_dominion_DEF:0 "Білоруська народна республіка"
 BLR_SOV_communism_autonomy_integrated_puppet_DEF:0 "Білоруська РСР"
 BLZ_ADJ:0 "Белізьк"
 BLZ_communism:0 "Белізький народний союз"
 BLZ_democratic_ADJ:0 "Белізьк"
 BM_EXILE_LEADER_DIVISION_DESC:0 "Командувач-вигнанець командує дивізіями у вигнанні."
 BOL_Gustavo_Adolfo_Navarro:0 "Ґуставо Адольфо Наварро"
 BOL_generic_democratic_reformer:0 "Моріц Гохшільд"
 BOS_without_HRZ_democratic_DEF:0 "Боснія"
 BOT_DEF:0 "Ботсвана"
 BOT_ENG_autonomy_integrated_puppet:0 "Британський Бечуаналенд"
 BRA_Italian_plane_exchange:0 "Обмін інформацією про літаки з Італією"
 BRA_aftermath_of_the_coup_dummy_idea_desc:0 "$BRA_aftermath_of_the_coup_desc$"
 BRA_amrj_organization:0 "Arsenal de Marinha do Rio de Janeiro"
 BRA_anti_imperialism:0 "Вигнати імперії"
 BRA_army_modifier:0 "$SMB_army_BRA$"
 BRA_const_kingdom_neutrality:0 "Королівство Бразилія"
 BRA_cprm_idea:0 "Rádio Marconi"
 BRA_cristovao_de_castro:0 "Крістован джі Кастро Барселус"
 BRA_decree_no_37:0 "Постанова Nº 37"
 BRA_disrupt_bolivar_no_lar:0 "$BRA_disrupted_bolivar$"
 BRA_empire_of_brazil_democratic_ADJ:0 "Бразильськ"
 BRA_ethical_internationalism:0 "Етичний інтернаціоналізм"
 BRA_federal_employment_plan_desc:0 "Масове безробіття призведе до зростання радикалізму та насильства. Щоби запобігти цьому, ми розширимо можливості для працевлаштування, створюючи державні галузі та нові інфраструктурні проєкти."
 BRA_infantry_equipment_2_short:0 "M1 Thompson"
 BRA_invite_foreign_companies_tt:0 "Відмикає рішення §Y$BRA_invite_foreign_companies_cat$§!, що дозволяє нам запрошувати §YВійськово-промислові організації§! до [BRA.GetNonIdeologyName] з §Y[ENG.GetFlag][ENG.GetName]§!, §Y[USA.GetFlag][USA.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§! або §Y[SWE.GetFlag][SWE.GetName]§!\n§GОтримайте 1 військову фабрику або верф за кожну запрошену ВПО до [BRA.GetNonIdeologyName].§!\n§RМи зможемо запросити лише 1 ВПО з кожної країни!§!\n\n§GВибір з 4 наступних:§!"
 BRA_jaguar_diplomacy_in_progress:0 "Рішення про дипломатію ягуара в процесі"
 BRA_jaguar_diplomacy_tt:0 "Відмикає рішення §Y$BRA_jaguar_diplomacy_cat$§! для заспокоєння великих держав, які виступають проти комунізму в Південній Америці, шляхом укладення з ними пактів про ненапад."
 BRA_lloyd_brasileiro_idea:0 "Lloyd Brasileiro"
 BRA_military_support:0 "Запевнити армію в області [FROM.GetName]"
 BRA_natal_naval_base_desc:0 "Завдяки нашій новій співпраці зі США, вони запропонували побудувати авіабази в нашій країні, використовуючи переважно власні кошти, в обмін на те, що ми дозволимо використовувати аеропорт для ВМС США, армії США, а також ВПС для польотів між Південною Америкою і Західною Африкою."
