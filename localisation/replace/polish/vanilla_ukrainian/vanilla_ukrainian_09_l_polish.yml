 JAP_offshore_coal_desc:0 "Острови Ікешіма та Хашіма біля узбережжя Наґасакі слугують життєво важливими вугільними шахтами для видобутку вугілля з морського дна. Ми повинні розширити ці шахти і побудувати більше будинків на островах, щоб розмістити ще більшу кількість постійної робочої сили."
 JAP_politicize_the_education_system:0 "Політизувати систему освіти"
 JAP_prepare_for_peninsular_warfare_desc:0 "У випадку, якщо ми опинимося в стані війни та будемо змушені відступати, Корейський півострів, ймовірно, стане нашим останнім оплотом на континенті. Ми повинні підготуватися, щоб бути в змозі утримати цей регіон, якщо такий найгірший сценарій коли-небудь станеться."
 JAP_prepare_the_southern_front_desc:0 "Війна в Тихому океані значною мірою включатиме морські десанти. Спеціальні морські десантні сили потребують розширення, якщо вони хочуть впоратися із завданням. Поряд із цим варто інвестувати в наших морських парашутистів, оскільки вони зможуть захоплювати стратегічні місця та острови ще до того, як наші основні сили прибудуть на місце."
