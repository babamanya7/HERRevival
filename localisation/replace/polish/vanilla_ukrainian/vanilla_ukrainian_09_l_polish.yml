 JAP_remove_the_weeds_from_the_crop_desc:0 "Як чітко заявив наш головний політичний теоретик Садао Аракі: якщо не виполоти бур'яни, гарний урожай буде знищено. Тож ми повинні ліквідувати ці бур'яни в уряді, які перешкоджають прогресу нашої нації і шкодять нашій душі, продаючи країну іноземним капіталістам та агентам. Час прополювання настав!"
