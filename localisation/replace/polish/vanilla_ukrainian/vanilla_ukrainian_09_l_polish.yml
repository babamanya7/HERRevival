 SOV_eastern_expansion_desc:0 "Майбутнє Росії — на Сході. Після того, як ми приручили Сибір, цілком доречно, що ми повинні прагнути отримати ще більше землі та ресурсів тут."
 SOV_expand_red_fleet_desc:0 "Червоний флот жалюгідно слабкий у порівнянні з флотами імперіалістичних держав. Ми мусимо зробити його розширення національним пріоритетом!"
