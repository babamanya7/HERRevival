 SEA_PHI_political_events.66.desc:0 "Як ще одна країна у [USA.GetAdjective]ій сфері впливу, [FROM.GetNameDef] тепер прагне покращити співпрацю в цій сфері шляхом створення альянсу іспаномовних націй. Це може стати противагою [USA.GetAdjective]ому тиску, який часом межує з імперіалізмом."
