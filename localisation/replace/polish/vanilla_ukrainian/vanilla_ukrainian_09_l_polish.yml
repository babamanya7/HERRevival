 CHI_empower_the_bureau_of_investigation_and_statistics_desc:0 "З давніх-давен знання ворога і самого себе допомагало вигравати битви. Нам потрібна організація, здатна отримувати необхідну інформацію, тому ми повинні розширити Національне бюро розслідувань і статистики."
 CHI_end_the_humiliation_desc:0 "Ми нарешті стоїмо, як і в минулі століття, як велика держава. Шановані, впливові та величні, ми піднялися над іншими, відкинувши гнобителів у підручники історії. Більше ніякої ганьби!"
