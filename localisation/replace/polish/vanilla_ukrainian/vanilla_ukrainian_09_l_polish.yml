 PEACE_COUNTRY_BIDDED_ON_STATE:0 "$COUNTRY|Y$ має вимоги в цій області."
 PEACE_DEFEATED_ACTIONS_DESCRIPTION:0 "Ви §Rпереможені§!. Переможці висувають вимоги, що стосуються вас та ваших союзників.."
 PEACE_DISMANTLE_INDUSTRY:0 "й військова промисловість цієї області буде демонтована"
