 SPR_the_five_year_plan_desc:0 "Новий сміливий план має на меті перетворення іспанської держави на місцеву індустріальну електростанцію протягом не більше ніж п'яти років."
 SPR_the_inevitable_counterblow:0 "Неминучий контрудар"
 SPR_transplant_soviet_industry_desc:0 "Радянці проявили особливу майстерність у переміщенні цілих заводів навіть на відстань у тисячі кілометрів. Щоб запустити нашу власну військову промисловість, ми виможемо перенесення деяких менш важливих заводів на Піренейський півострів."
 SSB_baghlan_sugar_factory_branches_desc:0 "Цукрова компанія Баглан наразі будує фабрики лише в [AFG.GetNonIdeologyName]. Ми можемо дозволити будівництво нових фабрик у будь-якій країні Саадабадського пакту, а не лише в [AFG.GetNonIdeologyName], що дозволить взаємне економічне зростання."
