 SIA_appeal_to_industrialists_tt:0 "Ми заручимося підтримкою промисловців.\n\nВони допоможуть нам у громадянській війні, надавши додаткове обладнання. Однак вони очікуватимуть, що ми розширимо нашу промислову базу, побудувавши §Y2§! додаткові §YЦивільні фабрики§! до тих, які ми матимемо наприкінці громадянської війни, протягом §Y720 днів§! після здобуття влади (Крім фабрик, отриманих від фокусів або торгівлі). \n\nНевиконання цього призведе до падіння §YСтабільності§! та §YПідтримки війни§!\n\nНа початку громадянської війни ми отримаємо: "
