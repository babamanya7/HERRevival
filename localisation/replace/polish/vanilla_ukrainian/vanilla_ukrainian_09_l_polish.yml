 DEN_annexation_side:0 "Втручання володаря"
 DEN_bop_ban_all_political_uniforms:0 "£BoP_left_texticon Заборонити всю політичну форму"
 DEN_bop_expand_the_welfare_desc:0 "Замість того, щоб розпалювати війну та витрачати гроші на оборону, яка не може сподіватися протистояти натиску будь-якої з великих держав поблизу нас, ми повинні збільшити витрати на нашу систему соціального забезпечення, що розвивається!"
 DEN_bop_unban_oppositions_uniforms_desc:0 "Ми не можемо заборонити іншій партії використовувати політичну форму, поки наші прихильники марширують вулицями, як учасники військового параду. Ми повинні скасувати цю цензуру."
 DEN_christian_evers:0 "Крістіан Еверс"
