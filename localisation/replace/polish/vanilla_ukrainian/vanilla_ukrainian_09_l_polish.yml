 COG_uplift_the_apostolic_vicar_of_leopoldville_desc:0 "Апостольський вікаріат Бельгійського Конґо був заснований Папою Левом XIII у 1888 році та є головною католицькою інституцією в нашій державі. Він очолюється Ординарієм, Апостольським Вікарієм Леопольдвіля, Йорісом Сіксом, і його представництво в уряді буде важливим для отримання підтримки церкви."
