 CHI_tsr_industrial_expansion_cooperation_desc:0 "Без промисловості та ресурсів для її підтримки Китай ніколи не буде процвітати як нація. Ми повинні прагнути покращити наші промислові можливості, якщо хочемо протистояти Заходу."
