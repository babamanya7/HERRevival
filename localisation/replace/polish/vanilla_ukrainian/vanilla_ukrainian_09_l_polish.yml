 SEA_warlords.36.a:0 "[ROOT.GetLeader] доведеться піти у відставку"
 SEA_warlords.44.t:0 "[FROM.GetLeader] пропонує об'єднання Лянґуану"
 SEA_warlords.51.t:0 "Плідні дискусії в Лочуані"
 SEA_warlords.6.b:0 "До біса Совєтів, вони мають нашу повну підтримку"
 SEA_warlords.63.a:0 "Ми дякуємо нашим товаришам за їхню щедрість"
 SEA_warlords.70.desc:0 "Having now achieved what was sought after by our people during the Panthay and Dungan Rebellions, ousting all remnants of Qing and Kuomintang rule from China, many have come to question the nature by which we rule the land. Should we take up the mantle of Du Wenxiu and bring forth our new golden era, or take the safer route and follow in the footsteps of Yuan Shikai?"
