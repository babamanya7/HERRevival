 CHI_neglected_countryside:0 "Занедбане село"
 CHI_one_china_policy_desc:0 "У післяреволюційному хаосі деякі регіони відкололися та відмовляються визнавати новий уряд; дехто претендує на звання незалежної держави. Тепер у нас достатньо сил, щоб усенародно оголосити про те, що ми визнаємо лише межі єдиного Китаю, що існували століттями."
