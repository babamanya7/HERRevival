 TUR_inventive_genius_electronics_modifier_tt:0 "$electronics$ — темпи досліджень: §G+10%§!"
 TUR_jet_strat_bomber_equipment_1:0 "MKEK-0 Köken"
 TUR_kemalist_socialist_theory:0 "Кемалістська соціалістична теорія"
 TUR_legacy_of_ataturk_fulfilled_desc:0 "Ми відстоювали та реалізували найвищі амбіції Мустафи Кемаля Ататюрка щодо [ROOT.GetAdjective]ої держави, перетворивши її на законну багатопартійну ліберально-демократичну державу. Ми відстоювали мрію всього життя Ататюрка, і завдяки цьому наше правління стало значно безпечнішим в очах людей."
 TUR_legacy_of_ataturk_preserved_desc:0 "Ми продовжили колишній статус-кво, підтримуючи авторитарний режим, який пропагує ідеали кемалістів. Ми не зламали прагнення Мустафи Кемаля Ататюрка щодо стану [ROOT.GetAdjective]ої держави, але ми також мало зробили для досягнення цих цілей. Майбутні покоління будуть використовувати закладені нами основи, щоб вони узурпували мантію кемалізму..."
 TUR_objectors_flocking_to_military_service:0 "Заперечники стікаються на військову службу"
 TUR_open_the_nazilli_callico_factory_desc:0 "Уряд оцінює кожен можливий індустріальний проєкт окремо."
 TUR_rebuilding_our_nation_desc:0 "Кемалісти спустошили нашу націю у своїх марних спробах придушити волю народу. Наші вороги вважають нас слабкими, і тому ми мусимо якнайшвидше відновити країну!"
 TUR_refugees_from_the_fascist_menace_desc:0 "Фашисти практикують політику винятковості і на кожному кроці порушують невід'ємні права людини. Їхні дії жахливі, і захист і захист тих, хто тікає від фашистських упереджень, — це найменше, що ми можемо зробити."
 TUR_rehabilitate_the_kadro_movement_desc:0 "Розганяти Кадро та його теоретиків було помилкою. У них були свіжі та революційні ідеї управління державою, а ми відвернулися від цих людей. Новій нації потрібні нові ідеї, а ідей сміливіших, ніж у Кадро, у нас немає!"
 TUR_relocate_from_yildiz_palace:0 "Переїхати з палацу Йилдиз"
 TUR_retire_ataturk_desc:0 "Неприємно думати про таке, але, можливо, нашому Газі краще провести свої останні дні з сім'єю в подорожі континентом? Ми не можемо одноосібно розпоряджатися його життям — не після всіх його жертв на благо країни і народу."
 TUR_revolutionism_decision:0 "Революціонізм"
 TUR_socialism_decision:0 "Соціалізм"
 TUR_strike_the_british_imperialists_desc:0 "Світ ніколи по-справжньому не зміниться, поки в ньому існує [ENG.GetNameDef] у своєму нинішньому вигляді. Ми мусимо зім'яти і знищити їхню огидну імперію."
 TUR_superiority_of_arms:0 "Верховенство зброї"
