 CHI_public_education_reform:0 "Реформа громадської освіти"
 CHI_purchase_tanks_desc:0 "У разі сучасних бойових дій бронетехніка є основним ударним кулаком. Потрібно придбати бодай мінімальну кількість танків і розпочати формування кістяка бронетанкових з'єднань у китайській армії."
 CHI_rapprochement_with_soviet_union:0 "Зближення з Радянським Союзом"
 CHI_reform_the_blue_shirts:0 "Реформувати Синіх сорочок"
 CHI_renounce_the_mcmahon_line_desc:0 "Старий кордон, проведений Британією та імперіалістичним урядом, не відповідає дійсності, нехай навіть британці вдають, що поважають її. Десятиліттями нам не вистачало сил, щоб виправити становище, але цей момент настав."
 CHI_reorganized_administration_desc:0 "Ми змастили колеса нашої адміністрації, щоб вони крутилися ефективніше, усунувши перешкоди, що стояли на нашому шляху."
 CHI_republicanism_desc:0 "Держави заходу цікаво стежать, наскільки щире наше прагнення стати республікою західного типу. Потрібно наголосити про наші плани."
 CHI_revise_the_national_curriculum_desc:0 "У такій великій країні, як наша, не дивно, що існує багато різних позицій. Ми могли б стандартизувати та організувати нашу систему освіти, щоб заохочувати певну, бажану поведінку."
