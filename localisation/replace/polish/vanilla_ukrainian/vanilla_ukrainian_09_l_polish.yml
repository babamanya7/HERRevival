 BUL_abolish_the_tarnovo_constitution_desc:0 "У минулому столітті Тирновська конституція вважалася ліберальною та передовою, але сьогодні вона слугує лише для легітимізації гнітючого диктаторського режиму. Настав час скасувати цю Конституцію і написати нову, засновану на моделі радянської Конституції 1936 року, яка включає такі основні права, як рівність громадян перед законом, свобода слова і зібрань, а також загальна система соціального забезпечення."
