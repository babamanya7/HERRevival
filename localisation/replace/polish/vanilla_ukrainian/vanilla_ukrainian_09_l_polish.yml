 EST_fight_the_vaps_desc:0 "Правий перебіг вапсів бажає підірвати естонську стабільність. Спочатку їх рух починався як спільність ветеранів та національних героїв, але швидко виродилося в ультранаціоналістичну партію, яку [EST.GetLeader] порівнює з нацистами. Якщо ми бажаємо елементами нашої нації треба покінчити."
