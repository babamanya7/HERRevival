 PER_andre_godard:0 "Андре Ґодар"
 PER_celebration_idea:0 "Бум після святкування"
 PER_clash_of_titans:0 "Битва титанів"
 PER_communism_iran_party_long:0 "Партія Ірану"
 PER_communist_air_defense:0 "Ініціатива протиповітряної оборони"
 PER_communist_basic_plane_design_desc:0 "Наші реформи повітряних сил добре розпочалися, тепер ми повинні зосередитися на розробці відповідних технологій та навичок для боротьби з кораблями. Можливо, ми зможемо прискорити процес за допомогою наших товаришів за кордоном."
 PER_communist_destabilize_iraq_desc:0 "[ENG.GetAdjective] залежать від нафти, що надходить з [IRQ.GetNonIdeologyName], ми могли б підірвати їхній доступ до неї, сприяючи курдському повстанню на півночі країни та об'єднавши їх із собою."
 PER_communist_kurdish_uprising_desc:0 "TODO"
 PER_communist_naval_designs_desc:0 "Ми досягаємо прогресу в наших військово-морських реформах, проте нам потрібно подвоїти наші зусилля та розпочати розробку технологій підводних човнів. Можливо, наші товариші в інших місцях будуть готові допомогти нам у цьому починанні?"
 PER_constitutional_shah_desc:0 "Незважаючи на те, що Реза-шах Пехлеві був символом неймовірних змін у [PER.GetNameDef], його тепер понижено до позиції конституційного монарха. Наразі він не більше ніж номінальна особа, оскільки наш новий уряд бере контроль над країною."
 PER_cyrus_initiative:0 "Ініціатива Кіра"
 PER_demand_west_asia_desc:0 "[FRA.GetAdjective] є незаконними загарбниками цих земель, і їх потрібно вигнати, якщо ми хочемо забезпечити свій власний імперський план. Території [SYR.GetNameDef] та [LEB.GetNameDef] мають бути захоплені, якщо ми хочемо протистояти [ENG.GetAdjective] у Північній Африці..."
 PER_dissolve_parliament:0 "Розпустити парламент"
 PER_feat_of_engineering_bonus:0 "Завершено Трансіранську залізницю"
 PER_foothold_in_indus:0 "Плацдарм в Інді"
 PER_foreign_policy_events.1.t:0 "Тиск з боку [FROM.GetNameDef]"
 PER_form_savak_desc:0 "Шпигунство виявляється вирішальним елементом військових зусиль. Щоб не відставати від розвідувальних зусиль нашого ворога, ми повинні створити власну організацію для керування всіма нашими шпигунами та шпигунськими операціями. Навіть внутрішньо, це має допомогти зміцнити наш уряд та стежити за тими, хто прагне його повалити."
 PER_imperial_events.10.c:0 "Вони можуть забрати це лише з наших холодних, мертвих рук."
 PER_imperial_events.110.t:0 "$PER_imperial_events.80.t$"
 PER_imperial_events.122.a:0 "Настали темні часи..."
 PER_imperial_events.122.desc:0 "На жаль, [ENG.GetAdjective] уряд відмовився від нашої пропозиції про здачу. Це означає, що ми повинні продовжувати бої, але якщо ми програємо, то, ймовірно, здамося на їхніх умовах."
 PER_imperial_events.131.a:0 "Це полегшення..."
 PER_imperial_events.190.desc:0 "This morning, we received word from the [PER.GetAdjective] government with an offer to end hostilities and in return, they will allow our faction access to vast amounts of their natural resources. This would bring a swift end to the war, and allow us to focus on our larger goals. Not only that, but we will be in a good position to continue any future war efforts with their oil concessions."
 PER_imperial_events.212.a:0 "Вони пошкодують про це."
 PER_imperial_events.3.desc:0 "На жаль, ми не змогли переконати [SOU.GetNameDef] підписати пакт про ненапад. Це прикро, але це все ще може дозволити нам приєднатися до їхньої фракції в майбутньому, якщо ми продовжимо наші плани експансії."
 PER_imperial_events.30.a:0 "Який вишуканий час!"
 PER_imperial_events.60.t:0 "Бажання [FROM.GetNameDefCap] домовитися про ненапад"
 PER_imperial_events.72.desc:0 "У відповідь на наш лист доброї волі до [GER.GetNameDef], [GER.GetLeader], на жаль, відхилив нашу пропозицію приїхати та відвідати Берлін. Це прикро, оскільки це, ймовірно, була б гарна нагода поспілкуватися з могутнім лідером. На жаль, цього не сталося."
 PER_import_rocketry_desc:0 "Ведення війни розвивається неймовірно швидкими темпами. Оскільки інші нації починають розробляти ракетні технології для використання на полі бою, ми повинні прагнути не відставати від цих розробок, імпортуючи конструкції, необхідні для виробництва нашої власної чудо-зброї."
 PER_increase_education_funding_desc:0 "В рамках ініціативи модернізації Рези-шаха було наголошено на підвищенні якості освіти в країні. Відходячи від нашого традиційного минулого, ми прагнемо запровадити безкоштовну, обов'язкову освіту як для чоловіків, так і для жінок, а також закрити приватні релігійні навчальні заклади."
 PER_iran_for_iranians:0 "[PER.GetNonIdeologyName] для [PER.GetAdjective]s"
 PER_memphis_initiative_category_desc:0 "Нарешті ми завоювали колишню територію, яку прагнув Камбіз II, включивши Єгипет до нашого складу. Щоб забезпечити майбутнє нашої імперії, ми повинні розпочати інтеграцію єгипетських земель під наше суверенне правління."
 PER_modernize_iran_economy:0 "Модернізувати економіку [PER.GetNameDef]"
 PER_non_lethal_takeover:0 "Мирний переворот"
 PER_pahlavis_deposed_flag:0 "Династія Пехлеві повалена"
 PER_persian_empire_DEF:0 "Третя Перська імперія"
 PER_plant_resistance_cells:0 "Створити осередки опору"
 PER_reinstate_qajars:0 "Відновити династію Каджарів"
 PER_royal_visit_germany:0 "Королівський візит до Німеччини"
 PER_shahanshah:0 "Шахиншах"
 PER_shahanshah_desc:0 "Шахиншах, або цар царів, — це найвищий титул, наданий монарху [PER.GetNameDef]. Це титул, який абсолютно личить нашому нинішньому правителю, і честь, яку потрібно відновити."
 PER_ssb_events.6.desc:0 "Після завершення зустрічі [FROM.GetLeader] висловив сумніви щодо пропозиції, заявивши, що вона здається односторонньою і має явну кінцеву мету встановлення [THIS.GetAdjective] домінування в регіоні."
 PER_stand_with_giants_modifier:0 "Стати серед гігантів"
 PER_strengthen_the_tudeh_desc:0 "Партія Туде стала авангардом [ROOT.GetAdjective] робітничого класу, ведучи їх до перемоги над шахом. Тепер їм має бути надано повноваження запровадити соціалізм та звільнити народ від кайданів імперіалізму та капіталізму."
 PER_train_tank_commanders:0 "Навчити танкових командирів"
 PER_united_progressive_parties:0 "Об'єднані прогресивні партії"
 PER_usurp_afghanistan:0 "Узурпувати [AFG.GetNameDef]"
 PHI_add_bell_trade_act_opinion_modifier_tt:0 "Торговельні відносини з §Y[ROOT.GetName]§! змінено на §G+30§!"
 PHI_add_one_infra_point:0 "Додати 1 §Yочко інфраструктури§! для завершення §Y$PHI_investment_plan_3$§!\nПоточні очки: [?PHI_infrastructure_points]"
