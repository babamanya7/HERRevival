 tut_2_text_1:0 "Добре! Тепер, коли сповіщення були розібрані, Ви можете заглибитись у подробиці ведення війн. Італія розпочинає гру у стані війни з Ефіопією, і для Вас не має стати проблемою здобуття перемоги у війні, коли Ви розберетеся, як воювати.\n\nПеремістіть камеру в південно-східному напрямі, поки не знайдете Ерітрею в Східній Африці. Знайшовши область, §Yвиділіть дивізії§! в області $STATE|Y$, затиснувши §Gліву кнопку миші§! та включивши дивізії в поле."
 tut_7_text_1:0 "Добре! Щоб забезпечити Вашим військам більший шанс на успіх, важливо також надати їм належну §Yповітряну підтримку§!, що може їм знадобитись.\n\n§YАвіакрилам§!, прикріпленим до §Yстратегічного регіону§!, можна призначати накази. Авіакрила §Yпідтримки§! можна надіслати на виконання завдання §YПовітряна підтримка§!, що дозволить літакам приєднуватися до наземних бойових дій.\n\nОберіть §Yавіакрила§! на §Yбазі в Ерітреї§!, клацніть §Gправою кнопкою миші§! по §YДанакілю§! та віддайте їм наказ після прикріплення до регіону."
