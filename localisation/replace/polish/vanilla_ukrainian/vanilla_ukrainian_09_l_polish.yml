 NOR_allied_democratic_deploy_prep_decisions_category:0 "Розгортання нашої військової підготовки"
 NOR_approach_the_coordinating_committee_desc:0 "Оскільки наша земля залишається в руках ворога, потрібна організація, яка б працювала в тіні та організовувала наші невеликі цивільні групи для таємного опору окупації. Ми віримо, що різноманітні професіонали Координаційного комітету виконають роботу."
 NOR_complacent_cabinet_ns:0 "Самозадоволений кабінет"
 NOR_deploy_state_preparation_historical:0 "[get_deploy_prep_decision_name]"
 NOR_destroyer_1:0 "Клас «Draug»"
 NOR_destroyer_4_desc:0 "The Stord class consisted of four British S-class destroyers built for the Royal Norwegian Navy in exile between 1943 and 1944. They displaced nearly 1,800 tons and were armed with four 120mm/45 QF Mk IX guns in their main armament, as well as eight 533mm torpedo tubes and a decent ASW and radar complement. They also had good speed and reliability as well."
 NOR_expand_norges_tekniske_hogskole:0 "Розгорнути Norges Tekniske Høgskole"
 NOR_fascist_flip_state_TT:0 "§GВи зможете перевернути цю територію на свій бік, коли почнеться війна.§!"
 NOR_improve_production_lines_desc:0 "Немає сенсу в хоробрості, захищаючи нашу країну, якщо ми не можемо забезпечити зброю та обладнання для продовження боротьби. Сучасна війна полягає в тому, щоб мати кулі, щоб відбиватися, переконаймося, що ми можемо зробити їх настільки швидкими як ми можемо їх звільнити."
 NOR_kirsten_hansteen:0 "Кірстен Ганстеен"
 NOR_liberate_finland_ns_desc:0 "[FIN.GetAdjectiveCap]і робітники явно потребують звільнення. Вони працюють не на себе чи своїх співвітчизників, а на своїх поміщиків та промисловців. Допоможімо нашим товаришам звільнити цю землю, щоб вони могли працювати на благо революції."
 NOR_mechanized_equipment_1_short:0 "Stpv. I"
 NOR_monarchist_preparation_decisions_category:0 "Показати королю Гокону нашу підтримку його правління"
 NOR_move_government_headquarters_decision_desc:0 "Якби наш уряд впав від рук ворога, це забезпечило б нам загибель, а також загибель нашого Короля та Принца. Єдиний вихід — продовжувати рух і уникати неминучого якомога довше."
 NOR_patrol_our_coast:0 "Патрулювати наше узбережжя"
 NOR_patrol_our_coast_desc:0 "Наші береги свідчать про величезний морський простір перед ними, і все це є можливим шляхом для вторгнення на територію [NOR.GetAdjective]. Наш поточний флот розтягнутий над цими водами. Ми повинні розширити наш флот тому він може успішно захищати цю величезну територію."
 NOR_prep_his_dmod_3_desc:0 "Ця область повністю віддана справі розвитку цивільної промисловості в Норвеґії."
 NOR_prepare_a_mobile_government:0 "Підготувати рухомий уряд"
 NOR_proactive_defense:0 "Проактивний захист"
 NOR_ragnar_skancke:0 "Раґнар Сканке"
 NOR_rearm_for_defense:0 "Переозброєння для захисту"
 NOR_reform_the_army:0 "Реформувати армію"
 NOR_revive_pomor_trade:0 "Відродити поморську торгівлю"
 NOR_ruthless_police_captain:0 "Безжальний капітан поліції"
 NOR_sabotage_unions:0 "Спілки саботажників"
 NOR_secure_denmark_desc:0 "Великі держави, які лежать на південь від [NOR.GetName], довго трималися на відстані від нашого колишнього господаря, [DEN.GetName], якби їхня слабка армія капітулювала, ворота до [NOR.GetName] були б закриті широко відкриті. Ми повинні запобігти цьому, забезпечивши ці ворота самостійно."
 NOR_sub_ship_engine_1:0 "«Sulzer» 900 к. с. н. в."
 NOR_submarine_fleet_desc:0 "Підводні човни, завдяки їхній ефективності та непомітності, можуть переломити хід війни в морях по одній торпеді за раз. Нам потрібно створювати більше та кращих підводних човнів, якщо ми сподіваємося збільшити наші шанси."
 NOR_tandbergs_radiofabrikk:0 "Tandbergs Radiofabrikk"
 NOR_the_glucksburg_sea_wall_desc:0 "Граф Ярлсберґ розпочав будівництво морської стіни на ім'я дому, до якого належить наш славетний король Гокон VII, дому Ґлюксбурґів. Він буде служити проміжком влади королівської родини, щоб стримувати наших ворогів. І захистити наші фйорди та гори від шкоди."
 NOR_unity_parade:0 "Парад єдності в місті [FROM.Capital.GetCapitalVictoryPointName]"
 NOR_workers_and_farmers_rise:0 "Робітники та фермери повстають"
 NOTIFICATION_WE_CAPTURED_GENERAL_DESC:0 "Нашим відважним військовим вдалося захопити дивізію, котрою командува[This.GetVerbGendEndA_RU] §H[This.GetName]§!. §H[This.Owner.GetAdjectiveCap]ого§! командира перевели в: $LOCATION|H$."
 NOT_ENOUGH_TASK_FORCES_FOR_CONVOY_ESCORT_REMEDY:0 "Більша кількість оперативних груп із одного флоту на завданні допоможе гарантувати, що завжди буде готова оперативна група, готова захищати конвої."
 NO_ALLIES_TO_CALL:0 "§RВи не можете закликати жодного з союзників.§!"
 NSB_poland_events.301.t:0 "Кайзер погоджується!"
 NSB_poland_events.4.desc:0 "Польська Морська та колоніальна ліга звернулася сьогодні до [Root.GetAdjective] послу у місті [From.Capital.GetName] з пропозицією придбати територію [POL_colony_purchase.GetName]. Продавши полякам територію[POL] ми, без сумніву, непогано поповнимо бюджет держави [Root.GetNameDef], але держава [From.GetNameDef] при цьому отримає владу над усією колонією [POL_colony_purchase.GetName] та її коштовними людськими та викопними ресурсами."
 NSB_poland_events.401.t:0 "Успішний продаж території [POL_colony_purchase.GetName]"
 NSB_poland_events.7.b:0 "Це явна пастка."
 NSB_poland_monarchist_events.6.a:0 "Ми мусимо здатися."
 NSB_poland_monarchist_events.6.b:0 "Це сміховинно! Ми відмовляємося!"
 NSB_poland_monarchist_events.601.desc:0 "[From.GetNameDefCap] приймає нашу недавню вимогу про вступ до складу держави [Root.GetNameDef]. [Root.GetAdjective] війська вже заповнюють регіон, щоб у зародку придушити будь-який опір. нашої мрії про об'єднання всіх слов'ян."
 NSB_poland_monarchist_events.602.a:0 "Тоді це війна."
 NSB_poland_monarchist_events.602.t:0 "[From.GetNameDefCap] відмовляється!"
 NSB_poland_royal_election.5.a:0 "Народилася Польща Габсбурґів!"
 NSB_polish_fascist_events.201.desc:0 "Дивовижний за своєю природою союз держав [POL.GetNameDef] і [GER.GetNameDef] висунув спільну вимогу про анексію. Вони вимагають поступитися Мемілі Німеччини, а решту нашої території — Польщі."
 NSB_polish_fascist_events.204.t:0 "[From.GetNameDefCap] пручається!"
 NSB_soviet_civil_war_common.002.c:0 "Столицею мусить бути Петроград."
 NSB_soviet_civil_war_common.121.t:0 "[FROM.GetName] просить наш захист"
 NSB_soviet_civil_war_common.127.t:0 "Дезертирство на флоті"
 NSB_soviet_comecon.2.desc:0 "[FROM.GetAdjectiveCap]ий уряд вирішив провести серію маневрів та навчань. Так ми посилимо свою армію і навчимося діяти спільно з союзниками. Досвід, отриманий на навчаннях, потрібно буде застосувати для реалізації необхідних військових реформ."
 NSB_soviet_communist_civil_war.008.t:0 "Сталін пережив замах"
 NSB_soviet_fascist_tsarist.12.desc:0 "[FROM.GetAdjectiveCap]і газети все частіше друкують статті з критикою [ROOT.GetAdjective] експлуатації Далекого Сходу, а політики вибирають дедалі різкіші висловлювання, критикуючи нас і нагадуючи [FROM.GetAdjective] народу поразки у війні 1905 року. Найгучніші агітатори вже закликають «помститися за Цусіму»!"
 NSB_soviet_fascist_tsarist.30.a:0 "Славний день!"
 NSB_soviet_fascist_tsarist.9.desc:0 "[FROM.GetNameDef] нарешті приймає фашизм. У зв'язку з цим державі запропонували членство в нашому альянсі, і нам відповіли згодою."
 NSB_soviet_foreign_politics_events.1.a:0 "Ми готові вступити до їхнього альянсу, якщо зможемо зберегти свою Конституцію."
 NSB_soviet_foreign_politics_events.158.t:0 "Новий [FROM.GetAdjective] уряд"
 NSB_soviet_foreign_politics_events.252.desc:0 "Почалася давно очікувана війна з державою [JAP.GetNameDef]. Сьогодні [FROM.GetAdjective] війська атакували [JAP.GetAdjective] позиції по всьому Китаю, і тепер нам час приєднатися до них. [FROM.GetAdjective] союзниками ми зметем [JAP.GetAdjective] армію і проженемо її з нашої землі!"
 NSB_soviet_foreign_politics_events.260.a:0 "Боляче, але терпимо."
 NSB_soviet_foreign_politics_events.272.a:0 "Несподіваний і дуже прикрий поворот подій."
 NSB_soviet_foreign_politics_events.279.desc:0 "Наші дипломати в державі [SIK.GetNameDef] повідомили нам, що [SIK.GetLeader] приймає нашу пропозицію військової допомоги державі [SIK.GetName]. Судячи з усього, китайський лідер бажає посилити свою армію і зміцнити оборону, а також вважає, що за допомогою [ROOT.GetAdjective] [SIK.GetNameDef] зможе вистояти проти натиску ворожих держав зі сходу."
 NSB_soviet_foreign_politics_events.283.desc:0 "[FROM.GetLeader] передав нам офіційне комюніке, в якому приймає інтеграцію китайської провінції Сіньцзян як незалежну радянську соціалістичну республіку, якою керуватиме [ROOT.GetNameDef]. Наші великі проєкти з розвитку регіону показали добру волю [ROOT.GetAdjective]ої влади, яка хоче встановити добрих відносин із союзниками та надання їм допомоги. Завдяки цьому [FROM.GetLeader] розуміє, що наші вимоги продиктовані необхідністю забезпечити ефективне співробітництво наших країн у непрості часи."
 NSB_soviet_paranoia_system_events.19.t.a:0 "Чергових зрадників чекає справедливе покарання."
 NSB_soviet_paranoia_system_events.22.a:0 "Всі наші майбутні лідери мусять бути лояльні до країни."
 NSB_soviet_paranoia_system_events.49.b:0 "Вони просто виконували свою роботу."
 NSB_soviet_policies_of_collective_security.1.desc:0 "Звернувши увагу на погрози, що походять від обох наших націй, [FROM.GetAdjective] уряд запропонував укласти пакт про взаємодопомогу. За його умовами ми мусимо утриматися від ворожих дій по відношенню один до одного.\n\nМіж нашими країнами знаходиться [POL.GetNonIdeologyName] При спробі будь-якої із сторін прийти на допомогу іншій та має проходити через Польщу Деякі члени дипломатичної служби переконані, що ми мусимо включити до цього пакту Польщу, щоби гарантувати одне одному безпосередню підтримку."
 NSB_soviet_policies_of_collective_security.10.desc:0 "[POL.GetLeader] уряд несподівано відмовився приєднатися до запропонованого пакту. Офіційною причиною послужила відсутність серйозних загроз, але наодинці [POL.GetAdjective] делегація пояснила, що радянці можуть зайти, Та так там і залишитися."
 NSB_soviet_spanish_civil_war.3.a:0 "Вони нам дуже знадобляться."
