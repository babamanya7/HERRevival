 SOV_order_227_scorched_earth_decisions_tt:0 "Рішення §YВипалена земля§! більше не будуть доступні."
 SOV_organization_of_the_partisans_desc:0 "Багато солдатів, опинившися в тилу ворога, вирішили продовжувати боротьбу замість принизливого полону. Разом із селянами та робітниками окупованих територій вони продовжують боротьбу проти загарбника. Ми мусимо надіслати їм підтримку, щоб вони могли зв'язати ще більше ворожих підрозділів."
 SOV_organize_popular_brigades_poum_desc:0 "Ми налагодимо контакти з членами різних політичних організацій антисталінської лівиці, як місцевих, так і зарубіжних, щоби сформувати інтернаціональні бригади для підтримки наших іспанських товаришів у війні."
 SOV_pc_of_mechanical_engineering_desc:0 "Наша промисловість стала здатною створювати все більші та складніші верстати та інші важкі машини, до такої міри, що було б виправдано сформувати окрему державну структуру для координації цих проєктів."
