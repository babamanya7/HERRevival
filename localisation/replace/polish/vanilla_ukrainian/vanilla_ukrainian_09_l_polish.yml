 FIN_advanced_jaeger_training_program_desc:0 "Наші єгерські підрозділи протягом тривалого часу вважалися елітою збройних сил, починаючи з часів Великої війни, коли перші з них проходили навчання в Німеччині. Можливо, настав час відродити підрозділи, модернізувавши їх і, у свою чергу, підвищуючи моральний дух усієї армії."
 FIN_align_the_agrarian_league_desc:0 "[ROOT.GetNameDefCap] зазнала надзвичайної індустріалізації протягом останнього століття, ми не можемо ігнорувати тяжке становище мільйонів, які годують націю своєю сільськогосподарською працею. Співпрацюючи з Аграрною лігою, ми можемо забезпечити вирішення їхніх проблем адресовані так само добре, як і їхні міські колеги."
 FIN_anti_air_equipment_3:0 "75 ItK/37 SK"
 FIN_communism_party:0 "ФКП"
 FIN_confederated_finno_russian_republics_desc:0 "Безліч різних людей зараз підпадає під наше управління. Щоб запобігти розвитку ієрархії народів у нашій державі, ми реорганізуємо уряд як конфедерацію республік. Це дозволить усім людям мати справедливе слово у своїх управління."
 FIN_confederated_finno_russian_republics_state_modifier_tt:0 "\n§YКожна осердна область держави [SOV.GetNameDef], яка контролюється державою [ROOT.GetNameDef]§!:"
 FIN_gather_popular_support_desc:0 "Люди є життєво важливими для будь-якої революції чи уряду, і ми повинні зробити все можливе, щоб отримати від них усю можливу підтримку."
