 RAJ_john_brown_organization:0 "John Brown — індійський відділ"
 RAJ_just_good_business_desc:0 "Ми насправді нічого не маємо проти наших східних колег, просто їм потрібні ресурси, які є у нас, це просто хороший бізнес."
 RAJ_local_leaders_investments_defenses:0 "[?RAJ_local_leaders_defenses|0+]"
 RAJ_look_to_the_future:0 "Подивитися в майбутнє"
 RAJ_naval_tech_sharing_group_desc:0 "Обмін військово-морськими дослідженнями між Ост-Індійською компанією та Лондоном. Деякі дипломати пошепки кажуть, що надавати таку велику владу компанії нерозумно, але що вони можуть знати?"
