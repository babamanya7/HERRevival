 PRC_purge_wang_shiwei:0 "£BoP_left_texticon Провести чистку: $PRC_wang_shiwei$"
 PRC_raiding_parties_desc:0 "Того, чого нам бракує в промисловій могутності — порівняно з ворогом, — ми надолужуємо винахідливістю. Відправлення рейдових загонів не лише допоможе стабілізувати нашу ситуацію зі спорядженням, але й погіршить їхню."
 PRC_rectification_campaign:0 "Кампанія по уточненню"
 PRC_rectification_campaign_desc:0 "Існує кілька помилок щодо того, яким курсом має рухатися наша країна. Слід дати нашим товаришам, що помиляються, шанс усвідомити свої помилки."
