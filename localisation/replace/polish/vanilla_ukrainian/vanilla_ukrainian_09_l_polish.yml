 bftb_bulgaria_balkan_federation.10.t:0 "[FROM.GetNameDefCap] вимагає часткового права на самовизначення"
 bftb_bulgaria_british_influence.1.a:0 "[BUL.GetNameDef] тепер під захистом [ENG.GetAdjective]."
 bftb_bulgaria_democratic_international_policies.1.t:0 "[BUL.GetNameDefCap] гарантує [ROOT.GetAdjective]у незалежність"
 bftb_bulgaria_equipment_purchases.10.t:0 "Завершено будівництво корабля — легкий крейсер"
 bftb_bulgaria_equipment_purchases.4.desc:0 "Перш ніж домовитися про купівлю [FROM.FROM.GetAdjective]ої авіації, необхідно вирішити, які саме літаки ми хочемо придбати."
 bftb_bulgaria_equipment_purchases.9.t:0 "Завершено будівництво кораблів — есмінці"
 bftb_bulgaria_factions.10.desc:0 "З надійних джерел стало відомо, що деякі члени «Звена», які не раз публічно критикували режим, нещодавно зустрічалися з декількома офіцерами нашої армії. І хоча мета цих зустрічей і імена офіцерів поки невідомі, можна не сумніватися, що «Звено» потай плете якусь серйозну інтригу..."
 bftb_bulgaria_factions.47.desc:0 "Нарешті нам вдалося інтегрувати націонал-соціалістичний рух в уряд і домогтися більш тісної співпраці членів мертвої організації з нашою партією. Єднання найбільших умов нашої країни стане запорукою успішної спільної роботи над більшими проєктами."
 bftb_bulgaria_factions.81.desc:0 "Наша служба безпеки провела серйозні репресії проти націонал-соціалістичного руху. Поліція увірвалася на сходку високопоставлених націонал-соціалістів, де ці бунтівники публічно заявляли, що [ROOT.GetLeader] — справжнє чудовисько, і планували наступний марш проти уряду. Більшість радикалів було схоплено, і операція, згідно з офіційними звітами, завершилася грандіозним успіхом."
 bftb_bulgaria_fate_of_the_balkans.4.a:0 "Ми не в тому положенні, щоби відмовлятися..."
 bftb_bulgaria_german_influence.4.desc_tsar:0 "цар"
 bftb_bulgaria_german_influence.5.desc:0 "Некомпетентність [BUL.GetAdjective]ого прем'єр-міністра Ґеорґія Кьосеіванова позбавила його довіри керівництва. [BUL.GetLeader] чудово розуміє, що така безпорадність може завдати державі чималої шкоди, і пропозиція відправити. Кьосеіванов поступився місцем Боґданові Філову. У політиці цей ґерманофіл зовсім недавно, а значить [GetLeaderToChallenge] для нього не суперник, та й [ROOT.GetAdjective]им інтересам він заважати не стане."
 bftb_bulgaria_german_influence.8.a:0 "Все йде за планом."
 bftb_bulgaria_german_influence.8.desc:0 "Ми відправили дипломата до міста [BUL.Capital.GetCapitalVictoryPointName], щоб обговорити використання [BUL.GetAdjective]ої території як плацдарм для наших військ. Переговори пройшли успішно, і [BUL.GetLeader] вже підписав угоду, згідно з яким [BUL.GetNameDef] не перешкоджатиме переміщенням [ROOT.GetAdjective]ої армії своїми теренами."
 bftb_bulgaria_german_influence.8.t:0 "[BUL.GetNameDefCap] надає нам право проходу військ"
 bftb_bulgaria_italian_influence.1.t:0 "[BUL.GetAdjectiveCap]а пропозиція про спільні дослідження"
 bftb_bulgaria_political_leaders.1.desc:0 "Минулого вечора [GetLukovLeader] став жертвою нападу. Двоє людей, імовірно [GetLukovPartisans] слідували за ним від «Роял-сінема» до самого будинку на 1-й Артилерійській вулиці. \nВвійшовши в будинок, один із [GetLukovCriminals] розстріляв його впритул, поранивши в плече, й вийшов на сусіднє подвір'я, залишивши смертельно пораненого Хрісто Лукова на порозі власного будинку.\n[GetLukovConclusion]"
 bftb_bulgaria_soviet_influence.4.t:0 "[BUL.GetLeader] вимагає, щоб [ROOT.GetLeader] приєднався до альянсу [BUL.GetFactionName]"
 bftb_bulgaria_tsar_boris.2.t:0 "Смерть царя Боріса III"
 bftb_bulgaria_tsar_boris.3.b:0 "Утворити уряд, прихильний Союзникам."
 bftb_bulgarian_claims.3.t:0 "[GER.GetNameDefCap] відхиляє наші претензії"
 bftb_bulgarian_claims.4.a:0 "Ми беремо те, що наше по праву!"
 bftb_greece.101.t:0 "Венізелісти та комуністи об'єднуються проти абсолютної монархії"
 bftb_greece.173.b:0 "Наразі це не в інтересах Британії."
 bftb_greece.174.c:0 "Пробачте, хлопці. Джон Булл має важливіші справи деінде!"
 bftb_greece.2.t:0 "Венізелісти виграють вибори!"
 bftb_greece.217.a:0 "Метаксас має очолити наше фашистське королівство!"
 bftb_greece.218.desc:0 "Час прийшов: у наш тяжкий час віроломний Георгіос Космідіс закликав усіх до зброї і зажадав, щоби ті, хто вірний НСГ та державі [ROOT.GetNameDef], знищували нас і окупантів по всьому Егейському морі. визначеністю зараз можна сказати лише одне: майбутнє держави [ROOT.GetNameDef] дуже невизначене."
 bftb_greece.220.desc:0 "У столиці панує радісний настрій: [ROOT.GetLeader] оголосив нації, що тепер, за стільки років, [ROOT.GetAdjective]і мрії енозісу з Кіпром нарешті стануть реальністю завдяки нашим [FROM.GetAdjective]им друзям. Наші управлінці відразу ж вирушили на Кіпр, щоби переконатися, що передача влади пройде якомога спокійніше. і тепер він нарешті повернеться в лоно цивілізації, з якої виник."
 bftb_greece.226.a:0 "Перемогли голоси проти!"
 bftb_greece.227.a:0 "Ми будемо готові."
 bftb_greece.229.b:0 "Ситуація змінилася."
 bftb_greece.236.b:0 "Можливо, ми занадто захопилися."
 bftb_greece.3.a:0 "За цим божівльним не піде ніхто і ніколи!"
 bftb_greece.40.desc:0 "Як і очікувало наше верховне командування, ми розгромили [FROM.GetAdjective]і війська на своїх кордонах і прорвали оборону Ізміра. Натхненні таким успіхом наші збройні сили почали заглиблюватися в [FROM.GetAdjective], натхненний нашою перемогою, вважає, що [FROM.GetNameDef] впаде за лічені тижні."
 bftb_greece.41.t:0 "Битва за Босфор почалася!"
 bftb_greece.61.a:0 "Ми це запам'ятаємо..."
 bftb_greece.66.b:0 "Ні, вони нам не потрібні."
 bftb_news.2.b:0 "Ми стоїмо на боці Болгарії."
 bftb_news.206.e:0 "Що це означає для Європи?"
 bftb_news.207.desc:0 "Сьогодні [TUR.GetLeader] оголосив усьому світу, що [TUR.GetNameDef] має намір розширити балканоцентричну зовнішню політику та гарантувати незалежність усіх союзних народів. Міжнародні спостерігачі зрозуміли, що [TUR.GetNameDef] займає більш рішучу і планує звести стосунки з великими державами до мінімуму, щоби зосередитися на безпеці в регіоні.\n\nХоча одні приходять у захват від [TUR.GetAdjective]ого рішення, інші бачать у ньому джерело серйозних проблем. [ITA.GetAdjective]і представники особливо стривожилися та почали благати [TUR.GetAdjective]ий уряд відмовитися від цього згубного курсу, який не приведе ні до чого, крім конфліктів у регіоні."
 bftb_news.208.e:0 "Вони все ускладнюють!"
 bftb_news.301.t:0 "[GRE.GetAdjective]а громадянська війна!"
 bftb_news.6.t:0 "Відновлення Болгарського патріархату"
 bftb_turkey.113.t:0 "Фундаменталісти протестують проти виробництва товарів, заборонених релігією"
 bftb_turkey.127.desc:0 "Дурні новини з держави [FROM.GetNameDef]. Хоча [FROM.GetAdjective]ий уряд не бажає нам зла, [FROM.GetNameDef] не буде інвестувати в нашу промисловість. Їх позиція була тверда, і чиновники попросили більше не піднімати цю тему в найближчому майбутньому."
 bftb_turkey.140.t:0 "[FROM.GetNameDefCap] попереджає"
 bftb_turkey.17.t:0 "Традиційна група Мендереса обговорює з курдськими організаціями можливості альянсу"
 bftb_turkey.26.t:0 "[FROM.GetNameDefCap] віддає Хатай нам"
 bftb_turkey.32.desc:0 "[FROM.GetAdjectiveCap]ий уряд звернувся до нас із інтригуючою пропозицією. [FROM.GetAdjective] делегація представила нам портфоліо, в якому описано історичну та стратегічну важливість Додеканесу для держави [FROM.GetNameDef], і на кидок нерухомості і підприємств, які нам готові продати в обмін на архіпелаг.\n\nНаш уряд більше звикли отримувати території, ніж віддавати їх, але не можна заперечувати, що додаткова промислова потужність була б дуже доречною для [ROOT.GetAdjective]ої військової машини. вирішити, що цінніше нашій нації — посилення індустрії чи архіпелаг Додеканес."
 bftb_turkey.36.desc:0 "На подив багатьох [TUR.GetAdjective]их офіційних осіб, [FROM.GetAdjective]а влада повернула нам острови Онікі в обмін на взаємне підписання договору, який за великим рахунком не зобов'язує жодну зі сторін виконувати його безглузді умови [FROM.GetLeader] здійснив особистий візит, під час якого він і [TUR.GetLeader] підписали так званий «Пакт сили». Обидва лідери пообіцяли і надалі підтримувати відносини між двома сусідніми морськими державами у світлі цього історичного обміну територіями. державі [TUR.GetNameDef]: багато хто радіє анексії нової провінції держави [TUR.GetNameDef] разом із [TUR.GetAdjective]им урядом. На архіпелазі тим часом поширювалася нова методичка, в якій всіляко звеличувався історичний та етнічний зв'язок островів з державою [TUR.GetNameDef]. [FROM.GetAdjectiveCap]ий уряд засудив обмін територіями та закликав інші великі держави також засудити те, що вони називають несправедливим та незаконним порушенням суверенітету [GRE.GetAdjective]ого народу на островах Онікі. Міжнародна спільнота здебільшого зберігає мовчання з приводу цього обміну — ймовірно, щоби не злити [TUR.GetAdjective]ий уряд."
 bftb_turkey.42.a:0 "Разом ми врятуємо Балкани."
 bftb_turkey.43.a:0 "Солідарність могла врятувати нас, але натомість нас може занапастити розділеність."
 bftb_turkey.56.a:0 "[FROM.GetAdjectiveCap]а держава найкраща!"
 bftb_turkey.60.a:0 "Хіба у нас є вибір?"
 bftb_turkey.60.b:0 "Якщо вони хочуть Хатай, нехай спробують забрати його силою."
 bftb_turkey.63.b:0 "Цей світ холодний і нещадний — і ми теж."
 bftb_turkey.67.t:0 "Переворот Золотого квадрата"
 bftb_turkey.85.t:0 "[FROM.GetNameDefCap] просить про посередництво — [TUR.GetNameDefCap] виявляє агресію"
 bftb_turkey.89.t:0 "Ми не отримаємо підтримку жодної держави"
 big_ship_deck_space:0 "ЗПС плавучого аеродрому"
 big_ship_deck_space_desc:0 "Відкрита зона, яка дозволяє обслуговувати, заправляти та дозаправляти літаки і готувати їх до виконання завдань. Дозволяє зберігати та використовувати літаки, що не належать до авіаносців."
 bold:0 "Сміливий"
 bold_attack_spirit:0 "Смілива атака"
 boost_party_popularity_receiver_desc:0 "Іноземна держава підтримує зростання політичної партії в державі $COUNTRY|Y$"
