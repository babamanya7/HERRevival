 POLITICS_SELECT_GOAL_DESC:0 "§YНаціональна ціль§! — це щось на зразок обіцянки нації.\n\nОбрання цілі звичайно коштуватиме Вам §Yполітичної влади§!, але зазвичай її отримаєте назад із нагородою, якщо Ви покажете, що змогли її досягти.\n\nТут Ви знайдете великі історичні події, а також більш скромні шляхи поліпшення своєї держави."
 POLITICS_WARGOAL_DELAYED:0 "Стане ціллю війни, коли буде досягнуто $PROGRESS|Y0%$."
 POL_KINGDOM_RUS_neutrality_DEF:0 "Конгресове королівство Польське"
 POL_VICTORY_POINTS_11386:0 "Елк"
 POL_adaptive_designs_desc:0 "Підтримка нашої ліцензії для іноземних дизайнерів обходиться державі дуже дорого, але, можливо, є способи перепрофілювати наші військові розробки для використання в приватному секторі. Розповсюджуючи частину наших матеріалів серед заможних людей, ми можемо зменшити витрати на утримання іноземних конструкторських компаній."
 POL_additional_research_slot1:0 "Польська школа математики"
 POL_align_with_the_west:0 "Зблизитися з Заходом"
 POL_anna_andersson:0 "Анастасія Романова"
 POL_anti_fascist_army_category_desc:0 "Фашисти використовують риторику боротьби пролетаріату з буржуазією для воцаріння ультранаціоналістичної диктатури, в якій продовжується пригноблення робітничого класу. Ми, як соціалістична держава, мусимо звільнити робітників усього світу від жахів фашизму."
 POL_anti_fascist_revolution_category_desc:0 "Фашисти використовують мову боротьби пролетаріату проти буржуазії для створення ультранаціоналістичних диктатур, які продовжують жорстоке гноблення робітничого класу. Як соціалістична держава, ми мусимо визволити робітників усього світу від терору фашизму."
 POL_anti_german_offensive_desc:0 "Були розроблені плани, як заманити німців у пастку на вулицях міст цієї держави."
 POL_ava:0 "AVA"
 POL_common_organization_of_society_desc:0 "Славек вже давно має амбіції замінити ББСзУ владною структурою, яку він називає «Спільною організацією суспільства». Ця структура унікальним чином надала б велику місцеву автономію польським воєводствам і ґмінам, одночасно централізувавши владу в руках сильного авторитарного режиму, готового втручатися в місцеве управління під час війни. З лівими при владі Славек може нарешті реалізувати свої амбіції."
 POL_complete_plan_west:0 "Завершити план «Захід»"
 POL_control_the_bosporus:0 "Контролювати Босфор"
 POL_cv_CAS_equipment_3_short:0 "Okoń Floty"
 POL_demand_slovakia_pavel_desc:0 "Чехословаччина слабка, а її території заздрять сусіди. Якщо німці можуть забрати Судети, просто попросивши, то хіба ми не можемо забрати Словаччину?"
 POL_develop_polish_ship_building:0 "Розвиток польського кораблебудування"
 POL_diplomatic_mission_to_DEN_desc:0 "$POL_diplomatic_mission_to_FIN_desc$"
 POL_dismantle_soviet_empire_desc_default:0 "[SOV.GetNameDefCap] називає себе федерацією незалежних республік, але це не більше, ніж Російська імперія з блиском червоної фарби. Як і всі імперії, вона є ворогом Польщі."
 POL_heavy_cruiser_4:0 "Клас «San»"
 POL_hel_fortified_area_desc:0 "Укріплюючи ключові райони, ми робимо себе менш вразливими, якщо війна знову прийде до наших берегів і кордонів."
