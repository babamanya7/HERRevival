 PRC_sino_allied_pact_of_non_aggression_desc:0 "Усуваючи іноземний вплив з Китаю, ми повинні переконатися, що менш експансіоністські великі держави не втручатимуться."
 PRC_socialism_with_chinese_characteristics:0 "Марксизм із китайською специфікою"
 PRC_the_party_builds_the_nation_desc:0 "Тепер, коли ми контролюємо великі території Китаю, настав час розпочати загальнонаціональну кампанію, щоб використати наше населення та промисловість, що розвивається."
 PRC_the_pla_naval_school_desc:0 "Новий освітній центр, де навчаються нові офіцери та моряки, міг би стати централізованим місцем для навчання багатьом навичкам, необхідним на великому кораблі: від навігації до проєктування та обслуговування літаків."
