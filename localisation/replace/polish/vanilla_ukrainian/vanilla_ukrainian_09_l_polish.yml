 USA_war_plan_silver_desc:0 "Італія відкрито заявила про намір домогтися панування в Середземномор'ї. Ми маємо бути готові до конфлікту, якщо їхні імперські амбіції не співпадатимуть з нашими інтересами."
 USA_war_plans_desc:0 "Воєнний департамент витратив чимало часу на підготовку планів на випадок непередбачуваних обставин. Хоча неможливо передбачити кожен розвиток подій, ці плани мають допомогти нам пережити перші кілька місяців війни."
