 poland.20.c:0 "Відмінно!"
 poland.21.d:0 "Поки на вулицях міста [DNZ.GetNameDef] вирує війна, [DNZ.GetLeader] вперто протистоїть військам, якими командує [POL.GetLeader]. Але одного міста, очевидно, недостатньо, щоб вистояти проти армії держави [POL.GetNameDef] Як член партії [Root.GetRulingParty], [DNZ.GetLeader] визнає, що [Root.GetLeader] вище за ієрархії і [DNZ.GetAdjective]а поразка тут неприйнятна.[GER.GetNameDefCap] може вступити у війну, захищаючи місто [DNZ.GetNameDef], — це дасть унікальну можливість захопити його, граючи роль захисника."
 poland.25.c:0 "Це наш шанс відновити польську демократію."
 poland.7.t:0 "[FROM.GetNameDefCap] відхиляє захист"
 poland_goal_short_desc:0 "§LПідготуйте німецький народ до війни з Польщею, а потім рухайтеся на Варшаву!§!"
 political.19.b:0 "Ігноруйте їх, вони просто створюють неприємності."
 political.29.d:0 "Громадянська війна, яка розділила наш народ, закінчилася, і наша справа перемогла. Однак ми не можемо дозволити тим, хто підтримував наших супротивників, продовжувати поширювати свою підступну пропаганду серед населення. У наступні дні нам потрібна тверда рука, щоби ми могли об'єднатися, бути готовими і сильними проти будь-яких зовнішніх загроз, які можуть поставити під загрозу нашу молоду державу."
 political.4.a:0 "Народ може зватися, як йому заманеться."
 political.4.d:0 "Комуністичний революційний рух, колись маргінальний, популярний серед радикальних академіків у теорії та порушників спокою на практиці, отримав усе більшу підтримку серед [Root.GetAdjective]ого робітничого класу. Той факт, що дедалі більше людей вирішують ідентифікувати себе з «класом» узагалі, означає, що марксистські ідеї поширюються за межі тих, хто активно прагне повалити уряд.\n\nЧлени [Root.GetRulingParty] нарікають на такий розвиток подій, сумуючи за часами, коли держава [Root.GetName] була тим, із чим люди ідентифікували себе перш за все. Їхні занепокоєння не безпідставні. Можна стверджувати, що революція вже відбувається, причому на кількох рівнях суспільства, і зупинити її може бути надто пізно."
 political_idea_desc:0 "Ідеї, які домінують зараз у політичній сфері."
