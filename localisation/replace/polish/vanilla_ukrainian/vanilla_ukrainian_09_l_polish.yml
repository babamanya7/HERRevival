 tfv_australia.1.a:0 "Австралія повинна забезпечити першу лінію оборони в Південно-Східній Азії."
 tfv_australia.32.a:0 "Ми будемо раді називати їх нашим союзником!"
 tfv_canada.20.a:0 "Цілком природно, що [From.GetNameDef] та [Root.GetNameDef] працюватимуть разом!"
 tfv_canada.53.d:0 "На заводі, який уважався найбільш вірогідною наступною ціллю для саботажу, для «Квебекського кола» було влаштовано пастку. Серед ночі на диверсантів чекали правоохоронці.\nКоли диверсанти прибули, вони виявилися набагато більшою групою, ніж очікувалося, і краще озброєні, з викраденим військовим спорядженням. Почалася перестрілка, в результаті якої було пошкоджено стільки виробничих ліній, скільки передбачалося планами Квебекського кола.\nОднак після запеклих боїв жоден диверсант не залишився в живих. Квебекському колу настав кінець."
 tfv_raj.1.b:0 "Вони потрібні нам для оборони рідної країни!"
 tfv_raj.2.a:0 "Вони нам дуже знадобляться."
 tfv_raj.33.a:0 "Можливо, нам слід попросити німців?"
 tfv_south_africa.2.d:0 "З огляду на зростаючі зобов'язання ближче до дому, держава [From.GetNameDef] погодилася, що її африканськими колоніями поки що керуватимемо ми."
 tfv_south_africa.3.t:0 "[From.GetNameDefCap] відмовляється"
 tfv_south_africa.41.d:0 "Радянці погодилися дозволити нам вивчати їхні шляхи та методи. Низка [SOV.GetAdjective]их вчених приїхали викладати в наших школах та університетах."
 tfv_south_africa.50.b:0 "Якщо народ хоче долучитися до боротьби, ми його не зупинимо."
 tfv_south_africa.74.d:0 "Звільнившися з-під влади колоніальних гнобителів, [ETH.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [ETH.GetAdjective]ого уряду."
 tfv_south_africa.97.d:0 "Звільнившися з-під влади колоніальних гнобителів, [GAM.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [GAM.GetAdjective]ого уряду."
