 CZE_bop_army_readiness_right_side:0 "Підготовлена армія"
 CZE_bop_no_industrialists_tt:0 "$CZE_bop_ready_for_anything_tt$§Y$CZE_industrialists_veto$§!"
 CZE_build_skoda_office_australia:0 "Побудувати представництво «Шкоди» в Океанії"
 CZE_central_european_federation_desc:0 "Ми маємо більше спільного з нашими сусідами, ніж того, що нас розділяє. Створення демократичної федерації може бути єдиним способом зберегти плюралізм у Центральній Європі в умовах численних загроз."
 CZE_continue_armed_force_reform_desc:0 "Продовжуючи модернізацію наших збройних сил відповідно до наміченого графіка та перепідпорядковуючи військові округи нашим штабам у провінціях, ми досягнемо кращої координації в будь-яких потенційних конфліктах."
 CZE_cooperate_with_tito:0 "Співпраця з Тіто"
 CZE_demand_the_czech_corridor:0 "Вимагати Чеський коридор"
 CZE_diversify_refinery_processes_desc:0 "Наші свердловини могли б виробляти широкий спектр різних нафтопродуктів. Єдина проблема полягає в тому, що нам бракує ноу-хау для цього. Якщо ми інвестуємо час у дослідження, щоб з'ясувати як, ми зможемо втілити цю мрію в реальність."
 CZE_fall_of_the_republic_neutrality:0 "Чесько-словацька республіка"
 CZE_favor_czechs_1:0 "Чеська промисловість"
 CZE_first_sudetenland_fortification_program_GD:0 "Перша програма фортифікації Судетської області"
 CZE_forgive_trading_debts_idea:0 "Прощення торгових боргів"
 CZE_fortification_research_subtract_variable_tt:0 "Усі майбутні рішення з категорії «§YПрограми фортифікації§!» виконуватимуться на §Y30§! днів швидше!"
 CZE_gw_tank_equipment_short:0 "Tč vz. 33"
 CZE_hussite_legacy_desc:0 "Гусити не просто просували більш протестантський стиль християнства, вони також виділялися своєю терпимістю до інших думок з цього питання, на відміну від тиранів, які вели війни, щоб протистояти їм."
 CZE_industrialists_veto_desc:0 "Промисловці мають значний вплив на політику країни, оскільки вони стоять на чолі багатьох найбільших конгломератів країни [CZE.GetNameDef]. Їхні інтереси не можна ігнорувати в питаннях економічної політики, а економічна мобілізація є одним із заходів, яким вони б найзапекліше опиралися."
 CZE_integrate_hungary:0 "Інтегрувати колишні австрійські території"
 CZE_investment_deal:0 "Інвестиційна угода"
 CZE_jaroslav_fajfr:0 "Ярослав Файфр"
 CZE_mechanized_equipment_1_short:0 "T-9"
 CZE_medium_tank_equipment_2:0 "Škoda T-23M"
 CZE_medium_tank_equipment_3_short:0 "T-24"
 CZE_merge_skodas_consumer_good_plants_desc:0 "У портфоліо «Шкоди» є багато менших заводів із виробництва споживчих товарів, які не є централізованими. Це допомогло б оптимізувати їхнє виробництво в багатьох сферах цих підприємств. Це також могло б мати позитивний ефект для «Шкоди» в цілому."
 CZE_military_aeronautical_institute_desc:0 "Інститут військової авіації займається розробкою нових літаків для ВПС Чехословаччини."
 CZE_negotiations_with_the_autonomous_bloc_desc:0 "Якщо ми хочемо сформувати коаліцію, яка не поступиться владою легіону посіпак Бенеша в Національних зборах, нам доведеться співпрацювати з Автономним блоком. Однак здобуття їхньої повної підтримки коштуватиме дуже дорого."
 CZE_outreach_to_the_western_powers_desc:0 "Західні демократії кажуть, що підтримують нас, але нам потрібно ще більше зблизитися з ними, щоб переконатися, що їхні слова також будуть підкріплені діями, коли це буде найважливіше."
 CZE_reassure_the_army_desc:0 "Армія нервує через деякі з наших нещодавніх рішень та політику уряду. Настав час запевнити їх, що ми підтримуємо їх незалежно від того, що говорить чи робить уряд."
 CZE_revert_1926_anti_military_laws_desc:0 "Після спроби державного перевороту $CZE_radola_gajda$ армія та жандармерія втратили право голосу, а також деякі інші привілеї. Враховуючи вирішальну роль армії в ці важкі часи, було б справедливо зняти ці обмеження та усунути прірву між армією і політикою."
 CZE_revive_the_czechoslovak_legion_default:0 "Відродити Чехословацький легіон"
 CZE_skoda_fast_optimization_tt_off_dynamic:0 "\n"
 CZE_skoda_shipyards:0 "Верфі Škoda"
 CZE_stefan_jurech:0 "Штєфан Юрех"
 CZE_stefan_osusky:0 "Штєфан Осуський"
 CZE_sudeten_2_desc:0 "У Судетах розташована пристойна оборонна лінія, проте, коли йдеться про безпеку країни, зайва обережність не зашкодить."
 CZE_the_romanian_question_desc:0 "Румунія відокремлює нас від СРСР, нашого друга та захисника. Оскільки вона не дозволить радянським військам прийти до нас на допомогу у разі загрози, варто задуматися про радикальне вирішення цієї проблеми."
 CZE_work_with_germany:0 "Співпрацювати з [GER.GetNameDef]"
