 ARG_counter_interlligence_program_idea_desc:0 "Шпигунство — це один з багатьох фронтів, з якими нам доводиться стикатися в цьому глобальному конфлікті, і тому здатність ефективно керувати власною контррозвідувальною програмою має вирішальне значення для виживання в цій війні. Ми дотримуємося позиції зосередження на оборонній політиці, а не на наступальній тактиці хитрощів."
 ARG_defense_and_democracy_desc:0 "Захист і демократія — головна мета уряду Ортіса, оскільки президент бажає відновити більш демократичну [ARG.GetName] під управлінням «Конкордансії». Це також означатиме збільшення військових витрат, що гарантує, що [ARG.GetName] зможе належним чином захистити себе."
 ARG_dominate_the_south:0 "Домінувати на півдні"
 ARG_encourage_the_red_scare_desc:0 "Здається, фашизм — не єдине, про що ми повинні турбуватися. Зростаюча сила [SOV.GetName] є не менш нагальною. Комунізм є ще однією антитезою демократії, і ми повинні остерігатися його поширення."
 ARG_federal_intervention_modifier:0 "Федеральна інтервенція"
 ARG_fourth_reich_fascism:0 "Четвертий Райх"
 ARG_infantry_equipment_1:0 "Mauser M09"
 ARG_invest_in_roads_idea:0 "Інвестиції в дороги"
 ARG_nationalist_faction:0 "Фашистська конфедерація"
