 IRE_communism_party:0 "КПІ"
 IRQ_agrarian_society_desc:0 "Промисловість Іраку зосереджена навколо аграрного сектору, і консервативне керівництво регіону не виявляло інтересу до розвитку та індустріалізації землі. Для вирішення проблем у державі необхідно буде приділити належний час і зусилля."
