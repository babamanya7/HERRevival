 GRE_athenian_thinkers_desc:0 "Одні з найкращих мислителів в історії походять з Афін, і якщо трохи заохотити науки та мистецтва, по всій Греції знову почнуть з'являтися великі уми!"
 GRE_attend_talks_with_the_presidium_desc:0 "Ми відправимо представників в президіум держави [FROM.GetNameDefCap], щоб обговорити можливості їх скромних інвестицій в нашу військову промисловість."
 GRE_battle_for_the_bosporus:0 "Битва за Босфор"
 GRE_bolster_the_schachtplan_desc:0 "Schachtplan давно служить наріжним каменем грецького планування, але зрозуміло, що він був виключно на користь Німеччини. Наші найкращі економісти розробили схему переробки плану таким чином, щоб він був більш вигідним по обидва боки, і з нашого боку було б безглуздо не скористатися такою можливістю!"
