 ss_recruitment_event.15.t:0 "[GER.GetLeader] пережив спробу вбивства"
 ss_recruitment_event.22.a:0 "Напевно, це була просто бухгалтерська помилка."
 stability.22.desc.b:0 "Спроби уряду переконати страйкарів повернутися до роботи, схоже, не мали жодного ефекту. Навпаки, надходять повідомлення про страйки на інших заводах, а останні кілька робітників, які втримували позиції на первинних робочих місцях, також поклали свої інструменти, зіткнувшися з гнівом своїх колег. Хоча запаси поки що змогли дещо пом'якшити удар по постачанню на фронт, це лише питання часу, коли перебої у виробництві почнуть впливати на нашу здатність вести війну.\n\nУправління війни знову закликало уряд зайняти непохитну позицію щодо страйкарів, але інші фракції всередині адміністрації припускають, що пропозиції піти назустріч робітникам може бути достатньо, щоби переконати їх повернутися до роботи."
 stability.23.a:0 "Зараз ми ніщо не можемо з цим зробити."
