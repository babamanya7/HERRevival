 WW_hungary.37.desc:0 "Підлий [FROM.GetLeader] з [FROM.GetNameDef] відмовився від нашої пропозиції, фактично закривши можливості для співпраці. Ми змушені шукати інші союзи або діяти самостійно."
 WW_hungary.40.a:0 "Тоді ми самі поведемо!"
 WW_hungary.54.a:0 "Так і є"
 WW_hungary.58.desc:0 "Імпульсивний [FROM.GetLeader] нещодавно засудив наше 'незаконне' володіння Галичиною та Буковиною. Тепер ми отримали ультиматум, а їхні війська зосереджуються на кордоні. Як відповімо?"
