 ITA_monarchia_d_italia_desc:0 "Віктор Еммануїл не мусив відчиняти двері італійської політики для фашизму. Настав час виправити цю помилку і змусити фашистів відійти на задній план в уряді."
 ITA_moschettieri_del_duce_desc_default:0 "Для власного захисту дуче втримує під своїм командуванням загін елітних стрільців. Хоча безпека дуче, звісно, має найвищий пріоритет, цих зразкових солдатів можна також використати для ліпшого вишколу наших регулярних військ, що збільшить їхню ефективність у бою."
 ITA_navalmeccanica_organization:0 "$ITA_navalmeccanica$"
 ITA_negotiations_with_albania_desc:0 "Протягом останніх десятиліть історія Албанії перебувала під сильним впливом Італії. Тепер, коли ми залишили авторитарний фашистський режим позаду, ми мусимо запропонувати албанському уряду зміцнити зв'язки між нашими народами та навіть розглянути можливість інтеграції албанської адміністрації в нашу, формально об'єднавши обидві країни."
 ITA_officers_of_the_service_role_desc:0 "Уже недостатньо просто взяти офіцерів із армії та навчити їх літати. Нашим військово-повітряним силам потрібен новий вид офіцерів, вихованих і загартованих службою, а не просто навчених їй."
 ITA_pact_of_steel_desc:0 "Наші відносини з нацистською Німеччиною ускладнені ідеологічними розбіжностями та суперечливими цілями; дуче вкрай насторожено ставиться до німецьких амбіцій в Австрії та на Балканах. Однак реалії змінюються..."
 ITA_partito_democratico_del_lavoro:0 "ДПП"
 ITA_peace_preservation_desc:0 "У ці часи нестабільності та міжнародних конфліктів лише італійський народ здатен зберегти та забезпечити мир у Європі."
 ITA_pellegrini_promotion_tt:0 "\nРису $air_chief$ покращено від §YСпеціаліста§! до §YЕксперта§!."
