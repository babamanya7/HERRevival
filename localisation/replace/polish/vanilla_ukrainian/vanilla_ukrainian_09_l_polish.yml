 GRE_no_turkey_needed:0 "За допомогою брехні та обману ми посилимо зв'язок §YТуреччини§! з §Yфашистськими державами§!."
 GRE_open_up_the_country:0 "Відкрити країну"
 GRE_political_instability_fascism_desc:0 "§W£faction_gre_monarchist §YМонархісти§!: [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YРеспубліканці§!: [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YКомуністи§! [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YФашисти§!: [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nЗ 1924 до 1935 року в нас сталися двадцять три зміни уряду, тринадцять переворотів і ще й диктатура! Фашизм найбільше цінує єдність. Якщо ми не зможем зібрати грецький народ і пояснити, що фашизм — очевидне рішення проблем Греції, ми недостойні правити."
 GRE_reorganize_the_royal_guard:0 "Реорганізувати Королівську гвардію"
 GRE_schachtplan_desc:0 "План Шахта створений німецьким економістом Ялмаром Шахтом. Він гарантує Греції доступ до німецьких ринків в обмін на збільшення імпорту сировини з Греції в Німеччину. Німці щедро підтримують нас, але ми, схоже, потрапили в пастку з такою надією на них."
 GRE_ship_light_medium_battery_2:0 "15.2cm/50 Cannon"
 GRE_sophistry_and_science_desc:0 "Стародавні греки славилися великими умами, і тепер нам як ніколи потрібні яскраві особистості, здатні змінити нашу країну і вивести нас у ХХ століття. Зосередившись на технологічних інноваціях, ми перестанемо бути у відстаючих у Європі на наступні п'ятдесят років."
 GRE_strat_bomber_equipment_1_short:0 "EAF Sfendóni"
 GRE_submarine_2_desc:0 "The Greek submarine Matrozos was an Italian Perla-class submarine captured by the British and transferred to the Hellenic Navy while in exile in 1942. The sub displaced 680 tons and were armed with six 533mm torpedo tubes. It had a diving depth of 80m."
