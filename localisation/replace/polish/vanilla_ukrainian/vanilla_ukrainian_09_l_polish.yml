 CHL_construct_new_hydroelectric_stations_desc:0 "Хоча це може бути непопулярним кроком серед корінних мапуче, регіон Арауканія багатий на всілякі природні ресурси, зокрема на озера та водоспади. Ми могли б використати їх для будівництва гідроелектростанцій, хоча це може засмутити мешканців регіону."
