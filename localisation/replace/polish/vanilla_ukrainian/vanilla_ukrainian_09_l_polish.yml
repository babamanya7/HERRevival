 IRQ_flood_the_plains:0 "Затопити рівнини"
 IRQ_found_the_iraqi_state_railways_IRQ:0 "Заснувати Іракські державні залізниці"
 IRQ_greater_iraq_tag_neutrality:0 "Великий Ірак"
 IRQ_hikmat_suleiman:0 "Хікмат Сулейман"
 IRQ_infantry_equipment_3_short:0 "Sterling MkI"
 IRQ_kurdistan_tag_ADJ:0 "Курдськ"
 IRQ_political_events.14.a:0 "Тоді ми заберемо це силою."
 IRQ_political_events.30.desc:0 "Уряд [FROM.GetNameDef] висунув сміливу вимогу про передачу їм контролю над Ліваном, посилаючись на свій обов'язок захищати та об'єднувати арабські народи регіону. Хоча вони оформлюють свої претензії мовою панарабізму, зрозуміло, що стратегічне розташування та економічний потенціал території, включаючи її цінні порти та інфраструктуру, є центральними для їхніх амбіцій. Якщо ми відхилимо їхні вимоги, навряд чи вони залишать це питання без мирних наслідків."
 IRQ_political_events.52.desc:0 "Уряд [FROM.GetNameDef] категорично відхилив нашу пропозицію передати Кувейт нашій владі, відкидаючи наше бачення арабської єдності та регіональної стабільності. Ця відмова підриває зусилля з консолідації арабського світу та позбавляє народ Кувейту шансу приєднатися до сильнішої, об'єднаної держави. Тепер питання в тому, чи продовжувати дипломатичні канали, чи готуватися до більш рішучого вирішення цієї суперечки."
 IRQ_political_events.73.desc:0 "Через нещодавні похоронні процесії пізнього Газі I, монархічні настрої зросли, оскільки народ сумує. Це дає можливість Абд аль-Ілаху приборкати владу прем'єр-міністрів, які довгий час підривали наше абсолютне правління, як добрий перший крок до повного відновлення Хашимітської влади в Аравії."
 IRQ_pro_western_iraqi_nationalist:0 "Прозахідний іракський націоналіст"
 IRQ_royal_iraqi_army_IRQ:0 "Королівська армія Іраку"
 ITA_STATE_736:0 "Літорале"
 ITA_VICTORY_POINTS_3924:0 "Спалато"
 ITA_VICTORY_POINTS_3943:0 "Дзара"
 ITA_a_bandits_war:0 "Бандитська війна"
 ITA_a_time_for_war_desc:0 "Допоки єресь панує в Європі, миру бути не може. Настав час для нової священної війни. Нові військові машини будуть ревіти в Його ім'я, готові вразити єретика праведною люттю. Нехай не буде миру, поки суд не вразить кожного невіруючого зі ствола 105-міліметрової гармати."
 ITA_agents_of_the_church:0 "Агенти Церкви"
 ITA_albanian_fascist_militia:0 "[GetAppropriateAlbanianFascistMilitiaName]"
 ITA_anti_air_equipment_2:0 "Cannone-Mitragliera da 37/54"
 ITA_army_leaders_desc:0 "Нашими арміями завжди мусять керувати найбільш здібні офіцери. Вкрай важливо створити постійний потік нових і компетентних офіцерів, щоби зберегти перевагу."
 ITA_ascari_desc:0 "Регулярні дивізії, сформовані з місцевих військ з Африки, довели свою високу ефективність у виконанні різних ролей, не лише в якості гарнізонів або резервів, але й у військових операціях на складній місцевості, де іншим дивізіям було би складно."
