 REQUEST_FACTION_MANPOWER_DESC:0 "Кількість людського ресурсу, необхідна для підтримки ваших законів про окупацію: $NEEDED|H*$ \nЗагальний людський ресурс в пулі, який не належить вашій країні: $FREE|H*$\nНайбільше число людських ресурсів, яке можна попросити з поточним внеском: $MAXCANBORROW|H*$\nОцінка внеску: $COST|.0+=$"
 RESEARCH_TIME_TOOLTIP:0 "Час дослідження: $DAYS|Y$ дн."
 RESERVE_FLEETS_FOR_THIS_THEATER_DESC:0 "Кораблі, виробництво яких завершене та які не мають вказану §Yціль розгортання§!, будуть автоматично призначені в резерв.\nКораблі в резервних флотах автоматично надсилатимуться як підкріплення для оперативних груп із увімкненим §Yавтоматичним підкріпленням§! і які не відповідають установленим вимогам.\nАбо, якщо в оперативній групі є більше кораблів, ніж потрібно, деякі з них відділяться та перемістяться в найближчий порт і в резерв."
