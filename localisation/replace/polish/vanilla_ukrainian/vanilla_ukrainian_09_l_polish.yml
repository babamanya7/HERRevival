 SPR_foreign_industrial_aid_desc:0 "З нашими новими угодами ми спонукатимемо іноземні компанії інвестувати в нашу країну та допомагати у нашій відбудові."
 SPR_fortify_the_iron_ring_desc:0 "Найбільше місто Країни Басків, Більбао, отримає власне «Залізне кільце» укріплень, що стане для басків грізною перешкодою для захисту від фашистського ворога."
