 SOV_approach_tukhachevsky_tt:0 "§Y$SOV_mikhail_tukhachevsky$§! стане на бік лівої опозиції в громадянській війні, а також приведе з собою війська та лояльних генералів."
 SOV_armored_car_equipment_1_short:0 "БА-10"
 SOV_battleship_1_desc:0 "The Marat class battleships (originally Gangut class) were WWI-era battleships and the first Dreadnoughts to serve in the Imperial Russian Navy. Their design and turret layout served as the basis of all the succeeding battleship and battlecruiser classes. Only three ships survived the chaos of the Russian Revolution. They were modernized and refitted during the 1930's, resulting in a tall almost pagoda-like superstructure. They had modern electronics and a strong AA complement."
 SOV_claims_on_turkey:0 "Претензії на Туреччину"
 SOV_claims_on_turkey_desc:0 "Турки не лише послідовно відкидають наші вимоги щодо взаємного контролю над протоками Босфор, вони також відмовляються обговорювати будь-які зміни кордонів на сході. Можливо, настав час провчити їх!"
 SOV_concessions_japan_sakhalin_SCW_accept:0 "Якщо пропозиція буде прийнята, [GetSovietOppositionName] отримає [JAP.GetAdjective]і гармати і гвинтівки, і, можливо, бійців, коли почнеться війна. [JAP.GetNameDefCap] отримає контроль над Північним Сахаліном наприкінці війни."
 SOV_country_threat:0 "[SOV.GetAdjective]"
 SOV_covert_operations_desc:0 "Комуністи схильні до недовіри та міжусобиць. Якщо ми правильно зіграємо, то зможемо змусити їх з'їсти один одного."
 SOV_covert_ukrainian_military_buildup_idea_desc:0 "Використовуючи таємні навчальні табори, ми готуємо українське ополчення, щоби створити повстання проти сталіністів."
