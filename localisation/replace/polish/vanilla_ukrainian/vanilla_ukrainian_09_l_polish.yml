 SEA_china_democratic.16.a:0 "Ми дякуємо їм за ці інвестиції"
 SEA_china_misc.1.desc:0 "$CHI_retreat_to_taiwan_desc$"
 SEA_china_warlords.2.t:0 "[FROM.GetName] схиляє голову"
 SEA_generic_events.10.b:0 "Дистанціюватися від причетних осіб"
 SEA_generic_events.8.b:0 "Зосередитися на засудженні насильства"
 SEA_generic_events.8.desc:0 "Популярність [GetOppositionPartyName] спричинила сьогодні проблеми, оскільки група її прихильників вступила в сутичку з прихильниками уряду та [ROOT.GetRulingParty], поки поліція не була змушена втрутитися. Хоча інцидент був локальним, він все ж демонструє напружений політичний клімат."
 SEA_imperial_influence_events.150.t:0 "Фракція Армії наполягає на вантажівках підтримки"
 SEA_imperial_influence_events.501.t:0 "Морські офіцери гнівно йдуть у відставку"
 SEA_japan_foreign_policy.1.t:0 "[FROM.GetNameDefCap] вимагає нашої покори"
 SEA_japan_foreign_policy.108.t:0 "[FROM.GetNameDefCap] відхиляє подальшу інтеграцію"
 SEA_japan_foreign_policy.118.a:0 "Разом ми будемо сильнішими"
 SEA_japan_foreign_policy.26.a:0 "Можливо, він має рацію"
 SEA_japan_foreign_policy.36.desc:0 "Радіостанції, що належать [FROM.GetNameDef], почали транслювати про-[FROM.GetAdjective]у пропаганду по всій нашій країні. [FROM.GetAdjective]ий уряд також звернувся до нас із пропозицією інвестувати в нашу промисловість в обмін на дозвіл залишити радіостанції відкритими."
 SEA_japan_foreign_policy.41.a:0 "Ми повинні застосувати цю стратегію негайно!"
 SEA_japan_foreign_policy.51.a:0 "Чудово!"
 SEA_japan_foreign_policy.52.b:0 "Ми будемо уважно стежити за ними..."
 SEA_japan_foreign_policy.58.desc:0 "Наші [FROM.GetAdjective]і сюзерени передали нам управління багатьма регіонами, що раніше контролювалися Ґоміньданом, і попросили почати підготовку до належної інтеграції цих земель у нашу державу. Ми їх не розчаруємо!"
 SEA_japan_foreign_policy.59.t:0 "Проголошення Держави Бірма"
 SEA_japan_foreign_policy.70.b:0 "Одним ворогом менше на нашій шиї"
 SEA_japan_foreign_policy.79.b:0 "Ні! Доля Маньчжурії лежить в іншому місці!"
 SEA_japan_foreign_policy.81.desc:0 "Асоціація Конкордія, керівна еліта держави [FROM.GetNameDef], вирішила відхилити нашу пропозицію, стверджуючи, що вони не отримають вигоди від інтеграції в нашу націю. Можливо, їх переконали маньчжурські дисиденти чи комуністи, але, на жаль, це рішення не так легко змінити..."
 SEA_japan_foreign_policy.86.a:0 "[From.GetNameDefCap] не стоїть наодинці!"
 SEA_japan_foreign_policy.90.desc:0 "Ми отримали звістку від [FROM.GetAdjective]ої влади щодо нашого запиту на торгівлю промисловістю в обмін на деякі з їхніх ресурсів. Схоже, ми дійшли згоди щодо переваг цієї угоди, і вони з радістю погодилися на умови. Ми отримаємо ресурси найближчим часом."
 SEA_japan_foreign_policy.95.a:0 "Відмінно!"
 SEA_japan_foreign_policy.96.desc:0 "Милостивий лідер [FROM.GetNameDef], [FROM.GetLeader], прийняв усі наші пропозиції, погодившись встановити тісніші зв'язки у торгівлі та наукових розробках, а також укласти оборонний пакт з нашою нацією, згідно з яким ми обидва обіцяємо прийти на допомогу іншому в разі нападу. Це великий день для [ROOT.GetNameDef] та її дипломатичних досягнень!"
 SEA_japan_news_events.01.b:0 "Схоже, хтось нарешті показав характер"
 SEA_japan_popup_events.16.b:0 "Соціаліст Абе Ісоо"
 SEA_japan_popup_events.21.a:0 "Війні доведеться почекати."
 SEA_japan_popup_events.23.desc:0 "Легітимність імператора Хірохіто була поставлена під сумнів через його потурання зростаючому військовому домінуванню над політикою та бездіяльність, коли насильство між фракціями в країні посилилося. Тепер багато хто закликає одного з його молодших братів, Нобухіто, який є відвертим прихильником цивільного уряду, прийняти титул Імператора, оскільки обидва його старші брати вчинили акти державної зради. Це дозволило б зберегти королівську підтримку нашого нинішнього уряду та підняти моральний дух нашого народу."
 SEA_japan_popup_events.25.t:0 "Загальні вибори"
 SEA_japan_popup_events.28.c:0 "Створити відділення в Каґошімі"
 SEA_japan_popup_events.32.desc:0 "Після закінчення громадянської війни та тріумфу революції Робітничо-селянська фракція (Роно-ха) здобула довіру партії та народу. Не будучи настільки ортодоксальними у своїх ідеалах, їм вдалося залучити багато послідовників, а отже, здобути владу. Проте головне питання залишається: хто стане наступним прем'єром республіки? Було представлено трьох кандидатів, але остаточний вибір ще попереду. Чи буде це Хітоші Ямакава, який як центральна фігура соціалістичного руху продемонстрував свій досвід? Чи це буде Кансон Арахата, якому вдалося зібрати велику підтримку народу, і тому його вже обрали головою? Або це буде Ямакава Кікуе, яка, незважаючи на меншу популярність у партії, показала, що вона придатна для цієї ролі як лідер і реформатор?"
 SEA_warlords.3.a:0 "Чудово."
 SEA_warlords.30.a:0 "Цей зрадник!"
