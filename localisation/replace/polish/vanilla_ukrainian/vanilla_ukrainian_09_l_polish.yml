 ETH_education_reform:0 "Реформа освіти"
 ETH_elect_of_god_desc:0 "Ми бачимо Бога в діях нашого Імператора. Як інакше ми можемо пояснити його успіх на полі бою та його керівництво нашою великою імперією? Люди знають, що виконувати накази Імператора означає діяти згідно з волею Всемогутнього."
 ETH_ethiopian_electric_power:0 "Ethiopian Electric Power"
 ETH_events.1.b:0 "Ми не можемо дозволити собі ще одне приниження!"
 ETH_expand_the_levy_tt:0 "Збільшує кількість дивізій Чітет Сефарі, які можна виставити, на §Y48§!.\nДодає §Y3 $irregular_infantry$§! батальйонів до дивізій Чітет Сефарі. Додає §Y$engineer$§!, §Y$military_police$§! і §Y$field_hospital$§!, якщо були досліджені відповідні технології."
 ETH_expand_the_officer_corps_desc:0 "Відсутність меритократії в збройних силах була найбільшою слабкістю останніх років. Для того, щоб переконатися, що найбільш досвідчені люди очолюють наші війська, нам потрібно розширити офіцерський корпус і дозволити зміщення тих, хто отримав своє звання через непотизм."
 ETH_has_readied_uprising_tt:0 "Повстання підготовано в принаймні 1 області"
 ETH_industrialization_dynamic_modifier:0 "Ефіопська промисловість"
 ETH_lord_of_lords_desc:0 "Хоча наша імперія складається з багатьох культур, усі схиляються перед одним і тим же Владикою владик. Навіть найблагородніший із панів знає, що є обов'язок перед Імператором. Його Величність є беззаперечним володарем цих земель."
 ETH_military_communism:0 "Військовий комунізм"
 ETH_modernizing_the_industry_desc:0 "За останні роки ми досягли значного прогресу у збільшенні нашого промислового потенціалу. Однак це буде постійне завдання, оскільки потреби економіки змінюються та з'являються нові методи виробництва. Таким чином, ми будемо прагнути донести електроенергію та інші промислові розробки до всього [ETH.GetName] і продовжувати нашу економічну модернізацію."
 ETH_our_enemys_enemy_desc:0 "Є багато країн, які виступають проти [ITA.GetAdjective]ого експансіонізму з ідеологічних чи стратегічних причин. Нам слід звернутися до цих країн щодо поставок зброї, щоби ми могли розбити [ITA.GetAdjective]і сили у нашому регіоні."
 ETH_pan-africanism_liberate_tt:0 "Отримає ціль війни §Y$liberate_wargoal$§! проти всіх колоніальних держав в Африці:"
 ETH_peace_treaty_part_2_tt:0 "[ETH.GetFlag][ETH.GetName]:"
 ETH_peace_treaty_tt:0 "\n§YУмови мирного договору§!:\n"
 ETH_prospect_for_resources:0 "Розвідка ресурсів"
 ETH_protector_of_the_somalis_desc:0 "[SOM.GetAdjectiveCap]ий народ не тільки підпадає під [ITA.GetAdjective]е варварське правління, але й призвані воювати проти власного народу заради територіальної експансії [ITA.GetLeader]. Коли [ITA.GetName] буде вигнано з регіону, ми захистимо [SOM.GetAdjective]s від експлуатації з боку будь-якої іншої європейської держави."
 ETH_ras_imru_haile_selassie_upgrade_tt:0 "Отримає:\n§Y$army_infantry_2$§!"
 ETH_re-convene_the_parliament:0 "Наново скликати Парламент"
 ETH_secure_arms:0 "Добути зброю"
 ETH_soviet_rifles_desc:0 "Ми були дуже недостатньо підготовлені, коли [ITA.GetName] напала на нас. Зараз наша промисловість не може встигати за матеріально-технічними вимогами сучасної війни. Нам потрібні гвинтівки та боєприпаси в руках кожної людини, яка може їх тримати. Можливо, наші друзі в м. [SOV.Capital.GetCapitalVictoryPointName] можуть допомогти."
 ETH_support_from_the_japanese_communists_desc:0 "[JAP.GetAdjectiveCap]ий і [ETH.GetAdjective]ий народи давно поважали один одного як одні з небагатьох, хто успішно протистояв європейській колонізації. Коли ми виходимо за рамки феодальної епохи в [ETH.GetNameDef], у [JAP.GetNameDef] є ті, хто поділяє наші ідеали та може допомогти нам створити модель анархо-комуністичного суспільства."
 ETH_sway_the_warlords:0 "Перетягнути воєначальників на наш бік"
 ETH_the_ferengi:0 "Ференґи"
 ETH_the_ferengi_desc:0 "Незважаючи на те, що Ліга Націй повільно реагує на наші прохання про допомогу, не бракує окремих іноземців, які готові боротися за нашу справу. Поки ми платимо їм за це."
