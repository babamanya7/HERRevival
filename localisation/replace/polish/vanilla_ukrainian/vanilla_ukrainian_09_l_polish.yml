 JAP_infantry_equipment_3_short:0 "Type 100/44"
 JAP_intensify_anti_guerilla_operations_desc:0 "Партизани та диверсанти перешкоджають прогресу та успіху наших військових кампаній у Китаї, завдаючи ударів там, де це найбільш болісно. Ми повинні підготуватися до нанесення скоординованого удару по цих бандитах і ліквідувати їхні осередки на наших територіях, так чи інакше!"
