 INSHOL_develop_bombers_desc:0 "Ми відправимо батавських інженерів до Амстердама для вивчення виробництва бомбардувальників Fokker з перших рук, щоб отримати доступ до його суворо охоронюваних секретів виробництва. Вони повернуться зі знаннями та технічним досвідом, необхідними для створення сучасної вітчизняної індустрії бомбардувальників в Ост-Індії."
 INSHOL_increase_funding_for_tix:0 "Збільшити фінансування проєкту літака T.IX"
 INSHOL_knil_engineers:0 "Інженерний корпус"
 INSHOL_london_batavia_accord:0 "Лондонсько-батавійська угода"
 INSHOL_transfer_of_conrad_helfrich_desc:0 "Переведення адмірала Конрада Хелфріха безпосередньо до Ост-Індії критично покращить військово-морські зусилля в Ост-Індії."
 INS_HOL_revolution_not_going_well_tt:0 "§RБез Батавії ми не зможемо керувати Ост-Індією, і у нас не залишиться іншого вибору, окрім як домовитися про мирну угоду з революціонерами.§!"
 INS_JAP_repaying_industrialists:0 "Погашення торгових позик"
 INS_aslia_communism:0 "Аслія"
 INS_autonomy_reduced_rubber_tax:0 "Знижено податок на експорт каучуку"
 INS_big_militia_presence_tt:0 "Буде контролюватися нашим ополченням після проголошення незалежності."
 INS_centralize_the_state_desc:0 "Від Суматри до Сулавесі, від Борнео до Банки, наші програми розвитку принесли дороги, фабрики та інституції на території, якими [1058.GetName] колись керував лише номінально. Ці регіони більше не є далекими провінціями. Вони є [INS.GetNameDefCap]."
 INS_chaos_events.1.a:0 "Так і треба!"
 INS_chaos_events.2.desc:0 "Дві найбільші соціалістичні партії Індонезії, очолювані Аміром Шаріфуддіном і Сутаном Шаріром, сьогодні оголосили про об'єднання, утворивши об'єднану Соціалістичну партію Індонезії. Це значно підвищує політичний вплив партії, потенційно ставлячи під загрозу нашу адміністрацію."
 INS_closer_economic_ties_to_netherlands_desc:0 "Ми маємо багато чому навчитися у нашого сюзерена, особливо в економічному плані. Якщо ми надалі інтегруємо нашу експортну економіку з Нідерландами, ми зможемо використовувати їхню інфраструктуру та зв'язки для забезпечення більш вигідних торговельних угод."
 INS_communist_events.7.a:0 "Ми повинні викорінити це, поки воно не поширилося!"
 INS_communist_loyalty:0 "Уряд підтримують комуністичні партії"
 INS_cost_text_oil_120:0 "£resources_strip|1 §Y120§!"
 INS_cost_text_oil_90_blocked:0 "£resources_strip|1 §R90§!"
 INS_cost_text_rubber_90:0 "£resources_strip|3 §Y90§!"
 INS_de_javasche_bank_name_normal:0 "De Javasche Bank"
 INS_develop_borneo_desc:0 "Калімантан має потенціал для отримання величезних багатств, проте острів розвинений дуже слабо, а його населення потерпає від бідності. Перевезення вантажів значною мірою залежить від численних річок та водних шляхів острова, а будь-який зв'язок на великі відстані ускладнюється відсутністю електроенергії. Прокладаючи лінії електропередач та дороги, ми можемо прокласти шлях для майбутніх досліджень та видобутку ресурсів."
 INS_dutch_events.3.desc:0 "[HOL.GetNameDefCap] відхилили нашу пропозицію щодо об'єднаного військово-морського командування, посилаючись на матеріально-технічні та адміністративні проблеми. Хоча це і розчаровує, наша співпраця продовжується через інші канали військових зусиль."
 INS_dutch_investment_rate_60:0 "§YНідерланди§! з імовірністю на §G60%§! більшою обиратимуть фокуси зі спільного дерева"
 INS_eng_treaty_engside_tt:0 "Ми офіційно об'єднаємося з §Y[HOL.GetNameDefCap]§! у конфлікті в Ост-Індії. Якщо §Y[HOL.GetNameDefCap]§! переможе, ми матимемо право власності на Борнео."
 INS_escalation_has_9_tt:0 "Рівень ескалації вищий за §Y9§!"
 INS_gatot_soebroto:0 "Гатот Суброто"
 INS_hold_batavia_HOL_desc:0 "Республіканські сили розпочали операцію з передислокації більшої частини своїх військ на Яву, намагаючись взяти під контроль увесь острів. Ми повинні продовжувати чинити опір, їхня операція ризикована, і вона дає нам можливість повалити їхній уряд у разі їхньої невдачі."
 INS_hq_warning:0 "§W§RРозміщення нашого штабу тут є складним завданням і вимагатиме більшості наших ресурсів.§!§!"
 INS_invite_phillipines_decision_desc:0 "$INSHOL_invite_phillipines_desc$"
 INS_islamist_loyalty:0 "Уряд підтримують ісламські партії"
 INS_loyalist_events.12.desc:0 "Наша пропозиція про об'єднання з [MAL.GetName] була відхилена. Уряд [MAL.GetAdjective], або ті, хто стоїть над ним, вирішили відмовитися. Нам доведеться повернутися до цього питання в більш сприятливий час."
 INS_loyalist_events.14.a:0 "Протоки наші."
 INS_loyalist_events.19.t:0 "[FROM.GetNameDefCap] вимагає референдум у Папуа"
 INS_loyalist_events.20.t:0 "Референдум у Папуа схвалено"
 INS_loyalist_events.22.b:0 "Тимор наш і таким залишиться."
 INS_loyalist_events.25.a:0 "Ми згодні."
 INS_loyalist_events.5.desc:0 "Наші дипломати повернулися з [FROM.Capital.GetCapitalVictoryPointName] з чудовими новинами. Уряд [FROM.GetAdjective] прийняв нашу пропозицію, і їхні офіційні особи вже вживають заходів щодо інтеграції їхніх територій до нашої адміністрації."
 INS_maphilindo_communism_ADJ:0 "Малайськ"
 INS_militia_knil_supply_raid_unlock_tt:0 "Розблоковує рейд §YЗдійснити наліт на склади зброї§! на вузли постачання в регіонах під контролем Нідерландів."
 INS_negotiate_new_contracts_unlock_tt:0 "Відкриває нові рішення §Y$INS_realign_supply_chains_cat$§!."
 INS_nsm_amsterdam_name_nationalized:0 "NSM Jakarta"
 INS_nsm_amsterdam_organization:0 "[INS_nsm_amsterdam_name]"
 INS_oerip_soemohardjo:0 "Уріп Сумохарджо"
 INS_pacific_revolution_desc:0 "Колоніальні держави не відступили з Азії, а лише з Індонезії. Старий порядок досі тримається в таких місцях, як Малайя та Філіппіни, і в кожному з них є чоловіки та жінки, які бажають його повалити. Наша революція дала нам і статус, і зобов'язання допомогти їм. Ми мусимо."
 INS_pki_militia_tt:0 "Тан Малака має дуже потужне ополчення, проте вони борються не лише за волю Індонезії, але й за волю §Rкомунізму§! та Рад. §RЗрештою, вони жорстоко протистоятимуть будь-якому некомуністичному уряду.§!"
 INS_prepare_for_policy_shift:0 "Підготовка до зміни політичного курсу"
 INS_prioritize_dutch_companies_desc:0 "Голландські компанії, такі як Shell і Fokker, протягом століть були основою нашої економіки, а наш експорт сировини був тісно інтегрований із Shell. Це принесло значні багатства Ост-Індії, і ми повинні надати їм пріоритет над дрібнішими місцевими підприємствами, щоб гарантувати, що наша співпраця залишатиметься міцною."
 INS_prioritize_industrial_growth:0 "Пріоритет промислового зростання"
 INS_railway_youth_force_desc:0 "Залізничні молодіжні сили — це ісламська молодіжна група ополченців, яка переважно діє в Центральній Яві і названа так на честь своєї стратегії захоплення залізниць. Вони б стали цінним союзником, проте вони енергійні і хочуть брати участь у боях. Вони будуть незадоволені урядом, якщо ми занадто довго залишатимемося у стані припинення вогню."
 INS_rapid_mobilization:0 "Швидка мобілізація"
 INS_revolution_events.14.a:0 "Це обурливо!"
 INS_revolution_events.2.b:0 "Ми не зацікавлені."
 INS_revolution_events.29.t:0 "Падіння Індії"
 INS_revolution_events.33.t:0 "[INS.GetNameDefCap] просить про посередництво"
 INS_revolution_events.43.desc:0 "Наші зусилля в [FROM.GetName] були успішними, і наші місцеві лідери ополчення підтвердили, що вони готові діяти, коли настане час."
 INS_revolution_war_HOL_desc:0 "Ці повстанці діють уже занадто довго. Занадто багато грошей і військових ресурсів було витрачено на протидію операціям ополчення, але вони продовжують розширюватися. Ми більше не можемо чекай, тотальна війна — єдиний шлях уперед."
 INS_spend_profits_on_urban_desc:0 "Після остаточного узгодження нашої нової угоди про хінін, ми отримуємо можливість використати наш додатковий дохід для розширення виробничої промисловості Батавії, що диверсифікує нашу економіку та зменшить нашу залежність від експорту сировини."
 INS_supomo:0 "Супомо"
 INS_three_year_plan_desc:0 "Ми можемо скласти трирічний план з будівництва інфраструктури по всьому архіпелагу та з'єднання островів."
 INS_union_events.4.a:0 "Достатньо, щоб прапор майорів."
 INS_union_events.6.desc:0 "Після термінових дебатів у кабінеті міністрів, [HOL.GetLeader] схвалив пропозицію [INS.GetAdjective]. Указ короткий і без церемоній. Наші уряди відтепер діятимуть як єдине ціле під Короною до кінця війни."
 INS_volksraad_allow_language_in_schools:0 "Дозволити індонезійську мову в школах"
 INS_womens_sufferage:0 "Жіноче виборче право"
