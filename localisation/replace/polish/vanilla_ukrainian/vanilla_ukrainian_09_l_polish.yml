 SOV_revive_the_stakhanovite_movement_desc:0 "Жорстока експлуатація змушує робітників у капіталістичних країнах викладатись на повну і виробляти більше для тих, хто володіє заводами. У нашій країні робітники, такі як Олексій Стаханов, працюють ще більше, бо знають, що кожна додатково покладена цеглина, кожна додаткова тонна видобутого вугілля, кожна додаткова заклепка допомагає побудувати світ, у якому робітники назавжди звільняться від експлуатації."
