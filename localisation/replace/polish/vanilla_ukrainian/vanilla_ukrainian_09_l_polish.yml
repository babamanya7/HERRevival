 GER_sway_the_middle_east_decisions_tt:0 "Відкриває рішення для §YЗміцнення ідеології [ROOT.GetRulingIdeology]§! в §YКраїнах Близького Сходу§! та для §YПриєднання їх до Міттелеуропи§!"
 GER_theodor_heuss:0 "Теодор Гойсс"
 GER_trade_agreements_tt:0 "Усі союзники отримають §Yнаціональний дух§!:"
 GER_uplift_the_rosenberg_office_desc:0 "Існує багато речей, які потребують належної координації в рамках Райху, включно з управлінням і контролем над окупованими територіями, а також внутрішнім наглядом і всією інтелектуальною та ідеологічною освітою нацистської партії. Всі ці речі мають вирішуватися централізовано і контролюватися з офісу Розенберґа, оскільки Розенберґ є важливим партійним теоретиком та ідеологом."
 GER_ussr_war_goal:0 "Війна з [GER.GetTheUSSRName]"
