 SWE_rule_the_baltic_desc:0 "[SWE.GetName] не буде в безпеці, доки Балтія не опиниться під нашим контролем. Для цього нам потрібно набути досвіду в будівництві більших кораблів, які можуть використовувати найкращі проєкти наших сусідів."
 SWE_ship_anti_air_2:0 "25mm/64 Bofors M32"
 SWE_sp_nuclear_bomb:0 "Kärnvapenprogrammet"
 SWE_submarine_1_desc:0 "The Hajen, Bävern, Valen classes were a series of small to medium-sized submarines built for the Swedish Navy during the 1920s. The Hajen class, commissioned in 1920, had submarines that displaced nearly 400 tons and were armed with four 450mm torpedo tubes. They had a diving depth of only 30m."
 SWE_swedish_shooting_movement_desc:0 "Протягом майже століття [SWE.GetAdjective]ий стрілецький рух організовував стрільбища та змагання, щоб підвищити навички стрільби серед цивільного населення та підвищити їхнє бажання воювати, якщо це буде необхідно. Враховуючи бурхливу ситуацію, у якій ми сьогодні опинилися, можливо, нам варто інвестувати в організацію."
 SWE_wounded_in_protests:0 "Поранений бунтівниками"
 SWE_zeth_hoglund:0 "Зет Гьоґлунд"
 SWI_Ortswehren_dynamic_mod:0 "Підготовка Ortswehren"
 SWI_airspace_surveillance_desc:0 "Якщо ми сподіваємося захистити [ROOT.GetName] і його гори, нам потрібно дивитися в небо в пошуках ворога. Нові засоби дозволять нам знаходити противника і поміщати його в приціли наших бійців і зенітних установок."
 SWI_aktion_nationaler_widerstand_idea:0 "$SWI_aktion_nationaler_widerstand$"
 SWI_appease_fascists_desc:0 "Ми можемо прийняти новий європейський порядок і навчитися співіснувати з нашими фашистськими сусідами. Це може дозволити нам уникнути війни, зберегти незалежність і нейтралітет."
 SWI_banned_foreign_nazi_propaganda_idea_desc:0 "Нацизму немає місця в такому суспільстві, як наше, тому ми не можемо допустити поширення ідеології, яка загрожує самій структурі нашої конфедерації, не кажучи вже про пропаганду, що походить від чужої нації."
