 MUGHAL_divisions_spawned:0 "§Y4§! повністю оснащені дивізії лоялістів приєднаються до нас, коли ми розпочнемо повстання."
 MUN_czech.1007.d:0 "Недовіра між нами та [FROM.GetNameDef] з моменту їхнього створення призвела до того, що тепер вони вимагають нашої лояльності під загрозою вторгнення. Цікаво, однак, що [FROM.GetNameDef] також апелює до наших територіальних амбіцій і обіцяє, що в обмін на відмову від претензій на їхні землі вони можуть допомогти нам здобути інші землі, на які ми претендуємо."
 MUN_czech.1024.t:0 "[CZE.GetName] пропонує мирну угоду"
