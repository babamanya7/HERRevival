 CHI_a_new_middle_kingdom_desc:0 "У минулі епохи ми були точкою, навколо якої обертався світ. Це ізолювало нас від світу і змусило епохи проходити повз нас. Ми не зробимо цієї помилки знову, і цього разу ми будемо творцями власної долі та долі інших."
