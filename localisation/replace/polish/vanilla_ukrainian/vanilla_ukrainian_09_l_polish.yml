 CHL_mapuche_state_communism_ADJ:0 "Мапуцьк"
 CHL_patagonian_giants:0 "Патагонські велетні"
 CHL_political_events.1.desc:0 "[CHL.GetLeader] з [CHL.GetNameDef] запропонував спільну заявку до Союзників, намагаючись захистити наші води та землі, одночасно не розриваючи тісного союзництва між собою та не руйнуючи взаємних стосунків між нашими країнами. Можливо, варто прийняти їхній запит."
 CHL_political_events.4.desc:0 "Війська, що належать [CHL.GetAdjective] державі, почали перетинати раніше встановлені кордони в [953.GetName], і їхні повітряні та військово-морські сили вже мобілізовані. Здається, вони серйозно налаштовані взяти під контроль спірний острів, і незрозуміло, чи зможемо ми на цьому етапі зупинити це шляхом посередництва. Яким має бути наш курс дій?"
 CHL_political_events.40.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] — нерозумна людина, і він дійшов висновку, що краще терпіти гніт американського імперіалізму, ніж ризикувати війною проти них. Однак, мало що можна зробити щодо їхньої очевидної позиції, тому нам доведеться залишити це питання відкритим."
 CHL_political_events.46.t:0 "[FROM.GetName] приєднується до Осі"
 CHL_political_events.47.t:0 "[CHL.GetName] хоче запросити [FROM.GetName] до Осі"
 CHL_political_events.48.t:0 "[FROM.GetName] не приєднується до Осі"
 CHL_political_events.51.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися до Іспанського альянсу"
 CHL_political_events.57.desc:0 "[ARG.GetLeader] з [ARG.GetNameDef] вирішив, що було б якось розумно протистояти нам, і тому ми повинні показати йому, що він зв'язався не з тими людьми. Вперед, чоловіки та жінки Чилі!"
 CHL_political_events.59.t:0 "[FROM.GetName] виводить війська з [954.GetName]"
 CHL_political_events.61.t:0 "[CHL.GetName] вимагає демілітаризації Патагонії"
 CHL_political_events.62.desc:0 "[FROM.GetAdjective] уряд піддався нашим вимогам і демілітаризував Патагонію з обіцянкою більше не завдавати шкоди нашому народу. Вони ще не усвідомили, чому ми висунули ці вимоги."
 CHL_political_events.72.a:0 "Є більше тих, хто готовий боротися за антиімперіалістичну справу"
 CHL_political_events.95.desc:0 "Надійшли нові повідомлення від Генерального директора Чилійських карабінерів, які пропонують вжити заходів проти зростання профαшистських настроїв серед населення, і що недавнє збільшення активності партії Хорхе Ґонсалеса фон Марееса, «Націонал-соціалістичного руху», має бути додатково розслідуване. Вважається, що вони цілком можуть планувати повалити наш уряд, і тому ми повинні залишатися пильними."
