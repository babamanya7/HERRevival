 COG_evolue_in_politics:0 "§YЕволює§! вступили в §Y[COG.GetAdjective]§! політику"
 COG_expansionism:0 "Експансіонізм"
 COG_force_publique_reformed_flag:0 "Force publique був реформований в Армію національного Конґо"
 COG_found_the_congolese_national_movement_desc:0 "Для того, щоб Конґо могло працювати разом, незважаючи на міжетнічні та міжрелігійні суперечки, ми повинні створити єдиний фронт організацій, що буде присвячений тому, щоб зробити Конґо кращим. У зв'язку з цим Патріс Лумумба запропонував створити Mouvement national Congolais."
 COG_founding_father_of_congo:0 "Батько-засновник конґолезької нації"
 COG_frederic_vandewalle:0 "Фредерік Вандеваль"
 COG_heat_resistant_cobalt_idea:0 "Термічно стійкий кобальт"
 COG_investments_into_civ_factory:0 "Інвестувати кошти в місцеву промисловість"
 COG_invite_kwame_to_the_capital_desc:0 "Кваме Нкрума — впливовий та популярний ганський політик-пан-африканіст. Нам слід запросити його до нашої столиці, щоб встановити гарні стосунки з рухом, і можливо він стане корисним для нас у багатьох відношеннях."
 COG_kasa_vubus_first_cabinet_desc:0 "Перші вільні вибори завершено, і Жозеф Каса-Вубу вийшов переможцем. Тепер він активно працює над формуванням першого конґолезького кабінету міністрів. Будучи дуже популярним по всій країні та відмінним у своїй справі, він обов'язково залишиться в пам'яті як великий президент для багатьох поколінь."
 COG_katanga_separatism_modifier:0 "Сепаратизм у регіоні Катанга"
 COG_kingdom_of_burundi_neutrality:0 "Королівство Бурунді"
 COG_ma_loango_party_long:0 "Клан Конді з Лоанґо"
 COG_make_use_of_the_british_proposal_tt:0 "Якщо Бельгія не завершила фокус §YКороль бельгійців§!, ми отримаємо можливість використовувати британську підтримку для переговорів про нашу незалежність від Бельгії. Якщо ж вони §YНадали владу королю-колабораціоністу§!, ми зможемо оголосити незалежність негайно, використовуючи британську підтримку.\n\nПоточні ефекти:"
 COG_minerva_imperia_motorized:0 "Minerva-Imperia Automobiles"
 COG_neutrality_DEF:0 "Конґолезька держава"
 COG_organization_of_african_unity_desc:0 "До цього часу свобода від європейського колоніалізму вважалася питанням просто здобуття незалежності. Однак тепер з’ясувалося, що ми всі все ще є потенційними цілями для завоювання в очах багатьох лідерів за межами Африки. Лише об’єднавшись і співпрацюючи, народи Африки можуть сподіватися на те, щоб не стати підданими знову."
 COG_parti_solidaire_africain:0 "Африканська солідарна партія"
 COG_safeguard_cabinda:0 "Захистити Португальське Конґо"
 COG_south_atlantic_navy_desc:0 "Якщо ми хочемо належно забезпечити нашу незалежність, ми повинні подбати про те, щоб колоніальні держави більше не змогли висаджуватися на наші береги."
 COG_the_executive_council:0 "Виконавча рада"
