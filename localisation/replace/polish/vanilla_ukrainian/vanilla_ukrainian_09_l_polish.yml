 NAVY_FORMATION_SPREAD_DESC:0 "Розосередженість флоту — це те, наскільки флот розосереджений у зоні завдання. Чим більше розосереджені кораблі, тим більше у них шансів помітити ворога, але менше кораблів зможе на початку вступити в бій."
