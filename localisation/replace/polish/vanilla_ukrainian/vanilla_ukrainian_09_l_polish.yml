 SIA_the_peoples_war_in_asia_desc:0 "Боротьба проти [JAP.GetAdjective] імперіалізму — це не просто змагання між державами. Це війна робітників, селян і солдатів проти домінування з-за кордону. Підтримуючи комуністичні сили в Китаї, [ROOT.GetNameDef] бере на себе зобов'язання до ширшої народної війни по всій Азії."
