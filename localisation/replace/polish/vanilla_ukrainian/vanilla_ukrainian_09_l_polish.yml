 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_EXILES:0 "У 1931 році прекрасний Храм Христа Спасителя був підірваний, щоб звільнити місце для кричущого «Палацу Рад». Навіщо саме суспільству, нібито побудованому на ідеї рівності, потрібен був Палац, залишається відкритим питанням. Тепер, коли ми повернулися до влади, ми повинні повернути цей страшний злочин назад і почати відбудову собору."
