 CHI_build_up_our_faction_cat_desc:0 "Занадто довго нації Азії були розділені лише для того, щоб бути завойованими імперіалістами. Тепер ми в такому становищі, коли маємо можливість звільнити їх від колонізаторів і витягти з рабства."
