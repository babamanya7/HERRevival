 YUG_SOV_research_group:0 "Югославсько-радянська дослідницька група"
 YUG_anti_tank_defenses_desc:0 "Оскільки танк займає центральне місце в сучасній війні, потрібні нові розробки в галузі протитанкових польових гармат, які дозволять нашій піхоті знищити цих броньованих гігантів."
 YUG_autonomous_transylvania_desc:0 "У регіоні Банат і Воєводина проживають не тільки серби, але й румуни та угорці. Запропонувавши цим регіонам автономію та самоврядування, ми можемо покласти край претензіям Румунії та Угорщини на ці регіони."
 YUG_develop_military_industry_desc:0 "Сучасній армії потрібна важка промислова база для підтримки необхідного виробництва нових літаків."
 YUG_dissolve_serbia_desc:0 "Регіон, який ми вважаємо «Сербією», насправді є домом для багатьох людей, які не вважають себе сербами. Македонці, албанці та чорногорці населяють території, які ми вважаємо сербськими. Ми не повинні дозволити, щоби нас сприймали як загарбників їхньої культури, і ми повинні переосмислити те, що ми вважаємо по праву сербським."
 YUG_fighter_equipment_0_short:0 "BH-33"
 YUG_fighter_equipment_1_short:0 "IK-2"
 YUG_form_the_federal_republic:0 "Сформувати федеративну республіку"
 YUG_idea_central_management:0 "$YUG_central_management$"
 YUG_ikarus:0 "Ikarus"
 YUG_ikarus_desc:0 "Наша найстаріша авіаційна промисловість, заводи «Ikarus» у Новому Саді, повинні бути розширені, щоб підготувати їх до збільшення виробництва, необхідного для наших нових ВПС."
 YUG_invite_turkey_desc:0 "Турецький народ був звільнений від свого халіфа більше десяти років тому, йому ще належить звільнитися від своїх буржуазних панів. Хоча Республіканська народна партія Туреччини заявляє, що є «соціал-демократією», правда, вона повністю не змогла розірвати ланцюги свого народу, і лише за допомогою прямого втручання Югославії ми зможемо справді звільнити всіх робітників Балкани."
 YUG_naval_research_group:0 "Югославська морська група"
 YUG_small_arms_desc:0 "Піхота є основою будь-якої армії, і ми повинні переконатися, що вона оснащена якнайкраще. Ми повинні стимулювати розробку нових і сучасних моделей зброї."
 YUG_sub_ship_engine_1:0 "Дизельний «MAN» 1 480 к. с. н. в."
 YUG_supremacy_of_defense_desc:0 "Оточені ворогами з усіх боків, ми повинні протриматися достатньо довго, щоби наші союзники зняли з нас жару. Розробка нових військових доктрин повинна бути спрямована на захист нашої Батьківщини."
 YUG_tac_bomber_equipment_3_short:0 "R-1"
 YUG_tank_licenses:0 "Ліцензії на танки"
 YUG_yugoslavian_path_to_communism_desc:0 "Ми не потребуємо керівництва в нашій боротьбі за справу робітників. Ми зберемо тих, хто приймає наше лідерство, і разом поширимо версію Революції."
