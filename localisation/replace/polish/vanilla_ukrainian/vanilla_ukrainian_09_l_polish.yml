 SWI_take_a_stance_desc:0 "Фашистська [?SWI_biggest_fascist.GetNonIdeologyName] володіє найогиднішою та жалюгідною політичною системою. [?SWI_biggest_fascist.GetNameDefCap] є смертельним ворогом нового [ROOT.GetName]; ось чому ми повинні виступити і захистити нашу демократію будь-якими засобами."
