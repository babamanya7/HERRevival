 HABSBURG_motorizing_the_armies_desc:0 "Можливо, сучасна війна все ще стосується наступу піхоти, але навіть якщо це так, слід переконатися, що наша піхота здатна дістатися з однієї точки федерації в іншу якомога швидше та ефективніше. Розпочавши зусилля з моторизації для перевезення великої кількості наших військ вантажівками, ми переконаємося, що наші війська завжди вчасно будуть там, де вони потрібні."
 HAI_DEF:0 "Гаїті"
 HAI_neutrality:0 "Королівство Гаїті"
 HAS_EXILE_TRANSFER_WITH_TEMPLATE:0 "§RНе можна видалити цей шаблон, тому що його використовують дивізії, які втекли у вигнання (§H$AMOUNT$ од.§!).§!"
 HAW_democratic:0 "Гавайська республіка"
 HINT_4_FAC:0 "£factory_item£ §Yx4§!"
 HINT_CONSTRUCTIONS_TEXT:0 "Це екран §Yбудівництва§!. Його використовують для поліпшення областей і провінцій шляхом будівництва споруд. На початку гри рекомендовано впродовж кількох років будувати £GFX_civ_factory §Yцивільні заводи§!, перш ніж переходити до £GFX_mil_factory §Yвійськових заводів§! або більш спеціалізованих споруд. Будуючи цивільні заводи, Ви зможете будувати більше споруд у довготривалій перспективі.\n\nУсі вільні цивільні заводи будуть споруджувати нові будівлі згідно з їхнім місцем у черзі будівництва.\n\nЦивільні заводи зараз підсвічені для більшої зручності. §YКлацніть на завод, щоб активувати режим будівництва.§! Коли режим будівництва активний, клацніть по області на мапі, щоби додати будівлю в чергу на спорудження. §YКлацніть, утримуючи Shift, щоби додати в чергу максимальну кількість споруд.§!"
 HINT_NATIONAL_FOCUS_TEXT:0 "Це екран §Yнаціональних фокусів§!. У ньому можна обрати політичну мету для своєї країни, що мають певні ефекти й бонуси, що допоможуть грі прогресувати.\n\nМи виділили кілька рекомендованих для початку національних фокусів для Вашої зручності. Цей шлях рекомендований, тому що він якнайшвидше дає ще одну §Yкомірку для досліджень§!, що дозволить Вам одночасно досліджувати ще одну £tech_mod£ §Yтехнологію§!."
 HINT_WAR_SCREEN:0 "Підказка: Війна"
 HISTORICAL_TEMPLATE_DESIGNER_NOTE:0 "§L$NOTE$§!"
 HOA_every_man_a_warrior_desc:0 "Якщо [ROOT.GetNameDef] хоче успішно протистояти іноземним агресорам, нам потрібно мілітаризувати суспільство до такого ступеня, щоб кожен міг взяти до рук зброю, коли це необхідно для захисту країни."
 HOA_eyes_on_the_imperialists:0 "Стежити за імперіалістами"
 HOA_foreign_trained_officials_desc:0 "Ми ще можемо багато чому навчитися в досвіді людей з-за кордону. Настав час краще використовувати їх, надавши їм авторитетні позиції в країні."
 HOA_improving_the_educational_system_desc:0 "Наші діти тримають у своїх руках долю нації. Тому надання їм найкращої освіти значною мірою допоможе забезпечити майбутнє [ROOT.GetNameDef]."
 HOA_strengthen_the_irregulars:0 "Зміцнити нерегулярів"
 HOA_support_the_agrarians_tt:0 "Змінити §Y$ETH_state_development_dynamic_modifier$§! на:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 HOA_the_capital_railroad_desc:0 "З'єднавши нашу залізничну мережу з нашими сусідами, ми зможемо краще експортувати наші товари та ресурси до них. Сподіваюся, це дасть поштовх нашій економіці в цьому процесі."
 HOA_use_the_natural_harbors_desc:0 "Завдяки нещодавньому придбанню прибережної землі ми маємо можливість значно розширити свій доступ до міжнародного ринку, створивши власний порт. Це значно спростить імпорт та експорт товарів, значно сприяючи нашій економіці."
 HOL_EQUIPMENT_VERSION_16:0 "No. 16"
 HOL_EQUIPMENT_VERSION_5:0 "No. 5"
 HOL_GER_fascism_autonomy_puppet:0 "Райхспротекторат Нідерланди"
 HOL_cave_to_the_british_tt:0 "@ENG§Y[ENG.GetName]§! має принаймні на §Y15§! од. торгового впливу більше, ніж @GER§Y[GER.GetName]§!\n"
 HOL_caved_to_the_british_idea_desc:0 "Нідерланди прийняли рішення погодитися на вимоги Німеччини, щоб уникнути торгової блокади, яка, безсумнівно, завершилася б економічним крахом. У внутрішній політиці країни стають все помітнішими пробританські та антинімецькі настрої; можна вважати, що зроблено перший обережний крок."
 HOL_curtail_colonial_autonomy_desc:0 "Цілком можливо, що континентальні Нідерланди будуть захоплені, незважаючи на наші найкращі приготування. У цьому випадку ми повинні шукати альтернативи, і однією з можливостей було б перенести уряд до столиці Нідерландської Ост-Індії, у місто Батавія на Яві. Ми повинні чітко дати зрозуміти нашій колоніальній адміністрації, що незабаром ми можемо взяти безпосередній контроль над їхніми справами."
 HOL_demand_increased_dutch_trade_with_germany_desc:0 "Нідерландцям слід... нагадати про їхні торгові зобов'язання перед Німеччиною, а також про їхню військову вразливість через сусідство з нами. Зрозуміло, нагадувати потрібно делікатно."
 HOL_destroyer_1:0 "Клас «Van Ghent»"
 HOL_develop_the_randstad:0 "Розвиток Рандстаду"
 HOL_expand_the_ijmuiden_steel_mill_desc:0 "Наша військова промисловість потребує достатньої кількості сталі, і ми повинні подбати про розширення вже існуючих потужностей в Еймьойдені."
 HOL_fokker_desc:0 "«Fokker», світовий лідер у виробництві цивільних літаків, скористався шансом побудувати більше військових літаків. Можливо, нам варто дозволити їм і підтримати потрібне для цього розширення галузі."
 HOL_gateway_to_europe_hol_category_desc:0 "Протистояння між Великою Британією та Німеччиною через торгівлю з нами посилюється. Ми мусимо виявляти особливу обережність, дотримуючись їх вимог, оскільки, піддавшись тиску однієї сторони, ми можемо виявитися втягнутими в конфлікт з іншого..."
 HOL_german_technological_exchange_desc:0 "Маючи доступ до німецьких технологій, ми зможемо краще нести свою частку тягаря формування цього Нового світового порядку."
 HOL_haven_of_tolerance_desc:0 "Нідерландський дух сяє навіть у комунізмі. Ми вітаємо всіх і всіх, кого уникали їхні батьківщини. Ми не питаємо про їхнє минуле, лише про те, що вони виконують свій обов'язок, щоби захистити цей новонароджений Едем від сил, які хотіли б його задушити."
 HOL_implement_the_program:0 "Реалізувати «Програму»"
 HOL_lessons_from_the_low_countries:0 "Уроки Нижніх країн"
 HOL_medium_tank_equipment_3:0 "Gevechtstank 6"
 HOL_modernize_the_cruiser_fleet:0 "Модернізувати флот крейсерів"
 HOL_placate_the_germans:0 "Задобрити Німеччину"
 HOL_placate_the_germans_desc:0 "Потрібно піти на ряд поступок німцям у поточних торгових переговорах, щоб уникнути ризику їх вторгнення у разі невдоволення."
 HOL_prepare_naval_expansion_desc:0 "Ми повинні вчасно підготуватися до розширення нашого флоту, а отже, вже ЗАРАЗ почати вливати ресурси в розширення нідерландського суднобудування."
 HOL_ship_torpedo_2:0 "4x 533-мм торпедний апарат"
 HOL_strat_bomber_equipment_2:0 "Pander M"
 HOMEBASE_WINDOW_TITLE:0 "Задати базу приписки"
 HOTJOIN_LABEL:0 "Швидкий вхід: "
 HQ_DEPLOY_CP_COST:0 "Розгортання зарезервує £command_power $COST|H0$."
 HUN_autarky:0 "Автаркія"
 HUN_bela_rakosi:0 "Бело Ракоші"
 HUN_crowned_habsburg_tt:0 "Держава §Y[HUN.GetNameWithFlag]§! коронувала §YОтто фон Габсбурґа§!"
 HUN_demand_southern_slovakia_desc:0 "Якщо ми зможемо повернути свої території без зайвого кровопролиття, для всіх буде тільки краще. Ми висунемо Чехословаччини ультиматум із вимогою повернути нам наші законні землі."
 HUN_develop_tanks_desc:0 "Світові держави усвідомлюють важливість танків і виробляють їх у величезних кількостях. Нам слід також зайнятися розробкою власних проєктів, щоби не відставати від наших союзників і наших супротивників."
 HUN_expanded_science_academy_national_flag:0 "Національна академія наук розширена"
 HUN_hero_of_the_revolution_desc:0 "З поверненням історичних територій та проголошенням Союзу Паннонських Соціалістичних Республік стає очевидно, що Бела Кун — Герой Інтернаціональної Революції."
 HUN_industrial_revitalization_desc:0 "Останні роки стали відчутним ударом для нашої промисловості. Ми мусимо докласти всіх зусиль, щоби скоротити технологічне відставання."
 HUN_innovative_weapons_designer:0 "Інноваційний конструктор зброї"
 HUN_light_tank_equipment_3_short:0 "Toldi III"
 HUN_nav_bomber_equipment_2:0 "MÁVAG Sas"
 HUN_nav_bomber_equipment_3:0 "MÁVAG Holló"
 HUN_pal_teleki:0 "Пал Телекі"
 HUN_place_a_habsburg_on_the_bohemian_throne:0 "Посадити Габсбурґа на богемський престол"
 HUN_place_a_habsburg_on_the_mexican_throne:0 "Відновити мексиканський імперіалізм"
 HYD_democratic_DEF:0 "Теланґана"
 ICE_DEF:0 "Ісландія"
 ICE_civilian_war_duty_desc:0 "Важливо, щоб наші громадяни точно знали, як діяти, якщо війна або криза прийде до наших домівок, і щоб кожен цивільний був готовий виконати свій обов'язок, наприклад, допомогти з логістикою, гасінням пожеж і розподілом, коли прийде час."
 ICE_democratic_DEF:0 "Ісландія"
 ICE_embrace_the_workers_revolution:0 "Прийняти робітничу революцію"
 ICE_enact_conscription:0 "Herþjónustu"
 ICE_expand_the_harbour_desc:0 "Все більше і більше кораблів прибувають на острів і відправляються з нього, а це означає, що нам потрібен більший порт. Держава повинна фінансувати розширення порту Рейк'явіка, щоб ми могли продовжувати розвивати економіку."
 ICE_industrial_cooperation_desc:0 "Запрошення данських промисловців відкривати дочірні підприємства в Ісландії в обмін на податкові пільги і не тільки, може створити тут робочі місця. Це також надасть індустріалізації цього острова такий необхідний поштовх. З допомогою Данії ми можемо рухати цю країну вперед."
