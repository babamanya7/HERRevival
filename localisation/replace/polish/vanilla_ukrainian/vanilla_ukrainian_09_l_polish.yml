 JAP_army_securing_navy_support_mission_tt:0 "Більша частина §YІмперського флоту§! перейде на бік IJA у випадку §YГромадянської війни§!"
 JAP_build_the_nishotaki_and_miyanaka_dams_desc:0 "Нові фабрики та об'єкти в нашій країні потребують більше електроенергії, ніж ми зараз можемо дозволити собі виробляти. Ми повинні побудувати нові гідроелектростанції, щоб генерувати електроенергію без спалювання наших дорогоцінних запасів вугілля."
 JAP_combined_nuclear_research_efforts_desc:0 "Оскільки ворожнеча між нашими видами військ близька до завершення, саме час об'єднати їхні амбітні ядерні проєкти в один і залучити до роботи в одній команді всі найсвітліші уми нашої нації."
 JAP_coring_KOR_state_in_progress_flag:0 " Наразі інтегровує корейську провінцію"
 JAP_create_greater_east_asian_treaty_organization:0 "Організація Західно-Тихоокеанського договору"
 JAP_cv_fighter_equipment_0:0 "Nakajima A4N"
 JAP_destroyer_2_desc:0 "Есмінці класу «Asashio» були першими японськими есмінцями водотоннажністю понад 2 000 тонн і першими, які були оснащені гідролокатором. Вони мали важке торпедне озброєння і достатню кількість легких артилерійських установок, а також трохи більший радіус дії, ніж старіші есмінці класу «Fubuki»."
 JAP_develop_yunnan_aluminium_deposits:0 "Розвиток родовищ бокситів у Юньнані"
 JAP_emperor_tooltip:0 "[GetImperialInfluenceRulerTitle] [GetImperialInfluenceRulerName].\n\nThe various §YFactions§! vying for power over the [GetImperialInfluenceRulerTitle] can go between §R$JAP_imperial_influence_tier_1$§!, §R$JAP_imperial_influence_tier_2$§!, §R$JAP_imperial_influence_tier_3$§! and §R$JAP_imperial_influence_tier_4$§!."
 JAP_empress_nagako:0 "Наґако"
 JAP_enact_the_national_conscription_law:0 "Прийняти Закон про національний призов"
 JAP_establish_housing_corporation_desc:0 "Щоб забезпечити житлом по всій країні всіх, хто його потребує, ми повинні створити корпорацію з метою будівництва десятків тисяч одиниць житла для робітників та багатьох орендних об'єктів для теслярів і громадян."
 JAP_establish_the_mine_warfare_force:0 "Створити сили мінної війни"
 JAP_establish_the_northern_resource_area_desc:0 "Ми мусимо почати експлуатацію багатих сибірських земель на благо нашої військової машини, що набирає сили."
