 SHIP_REFIT_TOOLTIP_DELAYED:0 "Після вибору цільового дизайну корабля, вибрані кораблі будуть виокремлені в окрему §Hоперативну групу§! та повернуться на найближчу §Hморську базу§! для переобладнання. Під час ремонту, прогрес можна відстежувати у вікні виробництва.\n\nКораблі повернуться до своєї оперативної групи після завершення ремонту.\n\n§GShift + клацніть§!, щоб обрати декілька кораблів.\n§GCtrl + клацніть§!, щоби перемкнути вибір кораблів."
