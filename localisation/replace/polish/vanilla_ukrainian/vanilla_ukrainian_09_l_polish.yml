 ITA_italian_nice_name:0 "Ніцца"
 ITA_joint_military_programs_desc:0 "Ми мусимо сприяти співробітництву між Італією та нашими новими союзниками як у військовій, так і в науковій галузях, оскільки ті тісно пов'язані між собою."
 ITA_light_ship_effort_desc:0 "Конвоям у наші заморські колонії потрібен захист. Нам необхідно розробити нові доктрини, а також більш сучасні есмінці."
