 GER_reorganize_the_wehrmacht_desc:0 "Для того, щоби ми могли виконати фюрерові амбіційні плани, у Вермахті має відбутися масштабна реорганізація. Забагато нинішніх керівників витрачають свій час на висловлення дріб'язкових і безпідставних занепокоєнь замість виконувати фюрерові накази. Лише усунувши цих людей, ми зможемо досягти наших цілей!"
 GER_request_the_return_of_french_held_colonies_desc:0 "Після завершення Великої війни ми були позбавлені наших колоніальних володінь. З огляду на зростання популярності Німецького колоніального товариства за Аденауера, настав час звернутися з проханням повернути Камерун і Тоголенд. Чим кращі наші стосунки з Францією, тим вищі шанси на успіх."
