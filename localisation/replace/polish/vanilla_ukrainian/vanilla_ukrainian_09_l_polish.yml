 ITA_compagnie_auto_avio_sahariane_desc:0 "Автомобільні роти Сахари в Лівії довели свою ефективність у поєднанні з власними розвідувальними літаками. Розширення цього проєкту має зробити наші сили ще більш грізними та вселити страх Божий у наших ворогів!"
