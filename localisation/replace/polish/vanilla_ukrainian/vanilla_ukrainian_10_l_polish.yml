 RAJ_expand_healthcare_facilities_desc:0 "Охорона здоров'я в [GetRajName] на жаль, недостатня. Дизентерія, холера та малярія спустошують сільську місцевість, стримуючи зростання. Розширення місцевих закладів протидіятиме цьому."
