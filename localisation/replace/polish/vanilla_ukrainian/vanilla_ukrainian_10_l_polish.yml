 CZE_continue_avia_expansion_desc:0 "Інвестиції в «Авіа» забезпечують додаткове обладнання, необхідне для подальшого зміцнення їхніх виробничих потужностей; це могло б допомогти досягти більшої ефективності у виробництві планерів літаків, які мають високий попит."
 CZE_continue_with_snejdareks_plan_default:0 "Продовжити план Шнейдарека"
 CZE_demand_corridor_to_ussr_desc:0 "Якщо [POL.GetNameDef] не співпрацюватиме з нами, ми повинні вжити серйозніших заходів для забезпечення доступу до наших [SOV.GetAdjective]их союзників."
 CZE_demand_regime_change:0 "Вимагати зміни режиму в [FROM.GetName]"
 CZE_destabilize_potential_adversaries_desc:0 "Комуністи-вигнанці, з якими ми співпрацюємо, мають таке розуміння своєї рідної країни, з яким навіть нашим шпигунам важко зрівнятися. Ми повинні повною мірою використати ці знання, розробляючи стратегію звільнення їхньої батьківщини."
 CZE_expand_central_bohemian_mines_desc:0 "Шахти в центрі нашої країни є найважливішими для нашої енергетичної безпеки. Ми повинні розширити їх якомога швидше."
 CZE_favor_czechs_1_desc:0 "Між чехами та словаками завжди існувала напруженість, і не в останню чергу через те, що більша частина промислових потужностей країни зосереджена в чеських провінціях — Богемії та Моравії. У подібній ситуації, проте, набагато простіше будувати нові заводи в ж областях, незважаючи на те, що це може викликати протести словаків."
 CZE_fight_over_silesia_desc:0 "Сілезія може бути по праву [ROOT.GetAdjective]ою землею, але повномасштабна війна з [66.owner.GetNameDef] є небажаною. Тому нам слід продемонструвати свою силу за допомогою масштабних прикордонних сутичок, а не великої війни. Якщо [66.owner.GetNameDef] не захоче воювати за захист Сілезії, ми все ж можемо позбавити їх цієї території."
 CZE_fighter_equipment_1:0 "Avia B-534"
 CZE_form_the_state_defense_guard:0 "Сформувати Гвардію оборони держави"
 CZE_form_workers_brigades_desc:0 "Робітники, яких ми звільняємо, повинні бути готові брати участь у боротьбі. Можливо, вони не є навченими солдатами, але все одно можуть зробити свій внесок як фахівці у своїх галузях."
