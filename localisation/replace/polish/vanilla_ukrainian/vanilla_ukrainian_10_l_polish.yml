 SEA_PHI_political_events.18.b:0 "Відмовити їм"
 SEA_PHI_political_events.49.a:0 "Чудові новини!"
 SEA_PHI_political_events.56.desc:0 "Прагнучи створити власний флот і зробити подальший внесок у наші військові зусилля, [FROM.GetNameDef] звернулися з проханням передати під їхній контроль одне або кілька оперативних з'єднань, що діють поблизу них."
 SEA_PHI_political_events.56.e:0 "Нехай займаються Тихим океаном і постачайте пальне"
 SEA_PHI_political_events.63.t:0 "Президентські вибори [GetYear] року"
 SEA_PHI_political_events.65.t:0 "Дуайт Д. Айзенгауер залишається в [USA.GetName]"
 SEA_PHI_political_events.67.desc:0 "[FROM.GetNameDefCap] підписали запропонований нами договір про взаємодопомогу, який визначає умовний альянс, що тепер набуває чинності. Це перший чіткий крок у посиленні співпраці між [FROM.GetNameDef] та [ROOT.GetNameDef]."
 SEA_PHI_political_events.70.desc:0 "Хвиля [FROM.GetAdjective]их представників, що відвідували [ROOT.capital.GetCapitalVictoryPointName], дала чітко зрозуміти те, що було підтверджено через кілька днів: [FROM.GetNameDef] прийняв нашу пропозицію об'єднатися з [ROOT.GetNameDef]."
 SEA_PHI_political_events.71.desc:0 "[FROM.GetNameDefCap] вирішили не погоджуватися на нашу пропозицію про об'єднання. Хоча вони повідомили, що вважають наш союз цінним, вони також визнали цей крок занадто радикальним."
 SEA_PHI_political_events.9.a:0 "Дідько, вигідна угода."
 SEA_PRC_border_war_events.6.t:0 "[PRC.GetNameDefCap] відступає з [1032.GetName]"
 SEA_PRC_faction_events.2.b:0 "Нехай спробують!"
 SEA_PRC_faction_events.32.t:0 "[FROM.GetNameDefCap] відмовляється виконувати вимоги"
 SEA_PRC_faction_events.4.a:0 "Справи йдуть вгору!"
 SEA_PRC_faction_events.40.t:0 "Шлях уперед — Доля Китаю"
 SEA_PRC_faction_events.5.desc:0 "Схоже, що [FROM.GetLeader] з [FROM.GetName] зроблений з міцнішого тіста, ніж ми спершу уявляли, відмовившись поступитися перед спільною загрозою армій [CHI.GetNameDef] та [PRC.GetNameDef]. Ця непокора настільки ж гідна подиву, наскільки й безглузда. Збройні сили [FROM.GetNameDef] скоро розбіжаться перед нашою могутністю!"
 SEA_PRC_fourth_army_incident.5.b:0 "Ми більше не можемо довіряти цьому альянсу"
 SEA_PRC_misc_events.3.a:0 "Велика втрата"
 SEA_PRC_misc_events.9.a:0 "Це допоможе привести нас до майбутнього"
 SEA_PRC_political_events.24.a:0 "Ми допоможемо нашим товаришам з [FROM.GetNameDef]"
 SEA_PRC_request_aid.2.a:0 "Чудово, ми обов'язково знайдемо цьому гарне застосування"
 SEA_PRC_request_aid.5.desc:0 "Відповідаючи на наш запит щодо танків Т-34, [FROM.GetName] погодився надіслати нам велику кількість — не менше 250 (переважно) новеньких Т-34! Наші генерали розробляють план, як найкраще розгорнути ці танки, включаючи встановлення графіків тренувань для перепризначених танкових екіпажів."
 SEA_PRC_request_aid.6.a:0 "Могло бути більше, але краще, ніж нічого"
 SEA_PRC_zhang_guotao_events.2.a:0 "Привітати Ґотао та його армію, але пильно стежити за ним"
 SEA_PRC_zhang_guotao_events.2.b:0 "Ми не можемо йому довіряти — засудити $PRC_zhang_guotao$ і заборонити йому в'їзд на нашу територію"
 SEA_PRC_zhang_guotao_events.5.b:0 "Відмовити — ми не можемо йому довіряти"
 SEA_border_incidents_events.1.desc:0 "Армія чисельністю менше 100 [ROOT.GetAdjective]их солдатів почала рух на спірне [MAN.GetAdjective]е село Тауран під керівництвом шести радянських радників. Хоча, здається, [JAP.GetAdjective]а армія ще не з'явилася в цьому районі, вони можуть прибути будь-якої хвилини, щоб відбити нас. Чи варте село ризику, чи нам слід проявити більше обережності?"
 SEA_china.3.desc:0 "Як і очікувалося, наш запит про підтримку був відхилений [FROM.GetNameDef]. Хоча наші надії ніколи не були великими, ми очікували, що вони принаймні визнають загрозу, яку [JAP.GetNameDef] становить для всієї Азії. Але, вочевидь, ми помилялися."
 SEA_china.4.b:0 "Ми повинні спершу подбати про власну безпеку"
 SEA_china_democratic.1.t:0 "Президент для Республіки"
 SEA_china_democratic.13.desc:0 "Надійшов запит від [FROM.GetLeader] з [FROM.GetNameDef] щодо надання фінансової підтримки їхній країні. Вони залучили до своєї справи багатьох [FROM.GetAdjective]их емігрантів, які проживають у наших кордонах, і народна підтримка цієї ініціативи різко зросла. Чи варто нам прийняти їхній запит?"
 SEA_china_democratic.15.a:0 "Нас ввели в оману..."
 SEA_china_democratic.20.a:0 "Ми виконаємо вимогу"
 SEA_china_democratic.7.t:0 "[CHI.GetNameDefCap] вимагає звільнити азійські колонії"
 SEA_china_democratic.9.t:0 "[FROM.GetNameDefCap] відмовляється звільняти колонії"
 SEA_china_warlords.4.t:0 "[FROM.GetNameDef] вимагає повної анексії"
 SEA_generic_events.13.b:0 "Відправити армію"
 SEA_generic_events.2.b:0 "Втручання спричинить лише більше проблем"
 SEA_generic_events.3.a:0 "Їм пощастило, що вони мають це право"
 SEA_imperial_influence_events.130.desc:0 "Армія висунула свої вимоги. Вони бажають, щоб ми збільшили масштаби призову до армії та відправили вербувальників у села, щоб залучити більше молодих чоловіків для майбутніх військових дій. Незважаючи на привід простого зміцнення наших збройних сил, вони, очевидно, також хочуть посилити свій контроль і вплив на [GetImperialInfluenceRulerTitle]. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.420.desc:0 "Лідери партії висунули свої вимоги. Схоже, вони бажають, щоб принаймні один з їхніх членів увійшов до консультативної ради [GetImperialInfluenceRulerTitle], аби вони могли керувати політичним напрямком нації та вести її до світлого майбутнього. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_japan_foreign_policy.10.desc:0 "Делегація, надіслана до нас від [FROM.GetNameDef], висунула нам ультиматум. Вони дали нам тиждень, щоб вивести наші війська з регіону Тонкін і дозволити їхнім військам зайняти позиції та створити військові бази в цьому регіоні. Вони стверджують, що це робиться для того, щоб китайці не загрожували [VIN.GetAdjective]ому суверенітету, але ми знаємо, про що йдеться насправді..."
 SEA_japan_foreign_policy.107.t:0 "[FROM.GetNameDefCap] погоджується на подальшу інтеграцію"
 SEA_japan_foreign_policy.117.t:0 "[From.GetNameDefCap] відмовляється від сюзеренітету над колоніями"
 SEA_japan_foreign_policy.137.b:0 "That would be the end to our autonomy, no!"
 SEA_japan_foreign_policy.138.t:0 "[FROM.GetNameDefCap] Merges with Us"
 SEA_japan_foreign_policy.32.b:0 "Ми не підпишемо жодних [JAP.GetAdjective]их документів"
 SEA_japan_foreign_policy.40.b:0 "Ми повинні прагнути процвітання для всіх азійських держав!"
 SEA_japan_foreign_policy.43.a:0 "Чудово"
 SEA_japan_foreign_policy.51.desc:0 "Славна новина про те, що керівництво [FROM.GetNameDef] погодилося на інтеграцію до нашої нації, була зустрінута бурхливими оплесками в Національному сеймі раніше сьогодні. Того, що ми могли запропонувати, було явно достатньо, щоб вони вважали пропозицію вигідною, незважаючи на кінець їхнього суверенітету."
 SEA_japan_foreign_policy.56.desc:0 "Маньчжурських партизанів було помічено поблизу Баян-Тумена, а також в інших частинах наших східних регіонів. Наразі вони не гірші за звичайних бандитів, але з часом стануть справжньою проблемою."
 SEA_japan_foreign_policy.74.a:0 "Гаразд"
 SEA_japan_foreign_policy.91.a:0 "Якщо спершу не вийшло..."
 SEA_japan_news_events.01.a:0 "Ми повинні повернутися до шляхів ери Тайшьо!"
 SEA_japan_news_events.02.t:0 "Створення Великої східноазійської сфери співпроцвітання"
 SEA_japan_popup_events.3.desc:0 "Сьогодні на пленарному засіданні Палати представників Імперського сейму Хамада Кунімацу, член партії Ріккен Сейюкай, виступив із різкою критикою міністра армії Хісаїчі Тераучі та зростаючої влади військових фракцій. Коли міністр звинуватив його у неповазі до авторитету військових та нібито образі їхньої честі, він відповів: «Перевірте стенограму, і якщо там є слова, що ображають військових, я зроблю сеппуку і вибачусь перед вами. Якщо таких слів немає, ви самі зробите сеппуку». Після цього Тераучі розлютився і витріщився на Хамаду зі сцени, викликавши хаос і гнівні вигуки в залі засідань."
 SEA_japan_popup_events.34.b:0 "Цим революційним лідерам треба надати автономію, на яку вони заслуговують!"
 SEA_japan_tokko_arrest_events.2.desc:0 "Токко виявила загрозу нашій внутрішній стабільності. 11 британських громадян, які проживають у нашій країні, мають бути заарештовані за підозрою в порушенні Закону про захист військових таємниць. Їхнім ватажком є М.Дж. Кокс, керівник токійського бюро Reuters. Хоча [ENG.GetAdjective]ий уряд стверджує, що це не шпигуни, їх все одно доставили до будівлі штаб-квартири військової поліції для допитів."
 SEA_japan_tokko_arrest_events.2.t:0 "Інцидент з Коксом"
 SEA_warlords.13.desc:0 "Після падіння військ Ма Хушаня $KHM_mahmut_muhiti$, колишній губернатор Кашґара, який приєднався до повстанців, запропонував повернутися, щоб знову служити губернатором і офіцером нашого уряду. Схоже, він хоче отримати другий шанс спокутувати свою провину, але, пам'ятаючи про його минулі вчинки, можливо, було б нерозумно довіряти йому."
 SEA_warlords.17.a:0 "$wtt_political_warlord_support.12.a$"
 SEA_warlords.22.a:0 "Ми повинні втрутитися"
 SEA_warlords.23.desc:0 "Схоже, що [From.GetLeader] розпочав боротьбу за Китай і згуртував інших мілітаристів на свій бік проти центрального уряду. Якщо ми приєднаємося, то ризикуємо віддати більшу частину своїх повноважень [From.GetNameDef], але відмова може накликати на нас їхній гнів."
 SEA_warlords.50.a:0 "Разом ми переможемо загрозу, що нависла на сході"
 SEA_warlords.56.t:0 "[FROM.GetLeader] просить про передислокацію до [608.GetName]"
 SEA_warlords.73.a:0 "Those damn traitors"
