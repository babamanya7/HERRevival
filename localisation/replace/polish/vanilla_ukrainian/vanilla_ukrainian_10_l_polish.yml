 FIN_children_destination_denmark:0 "державу [DEN.GetNameDef]"
 FIN_cooperation_with_germany_subsidies_tt:0 "Додавання субсидії на обладнання до §Y[ROOT.GetName]§! з [?ROOT.FIN_basic_subsidies_value|Y2] £GFX_civ_factory_output для §Y$small_plane_airframe$§!, §Y$medium_plane_airframe$§!, §Y$light_tank_chassis$§!, §Y$medium_tank_chassis$§!, §Y$artillery_equipment$§!, §Y$anti_air_equipment$§! і §Y$anti_tank_equipment$§!, націлені на §Y[GER.GetName]§!."
 FIN_enhance_southern_infrastructure_desc:0 "Оскільки [ROOT.GetAdjective]а країна прагне забезпечити своє місце у світі, вона повинна зосередитися на розбудові та вдосконаленні свого промислового потенціалу. Першим кроком для досягнення цієї мети є покращення інфраструктури в південних регіонах, щоб гарантувати, що вони краще готові задовольнити потреби легкої та важкої промисловості в короткостроковій перспективі."
 FIN_entice_the_masses_desc:0 "Маси легко піддаються впливу. Обіцяючи вирішити дрібніші близькі до серця питання та проблеми, наш уряд може легко стати привабливішим і сподобатися пересічному фіну."
 FIN_every_finnish_mio_tt:0 "\nКожна §Yнаціональна§! військово-промислова організація:"
 FIN_expand_air_bases:0 "Розширити авіабази"
 FIN_expand_mining_prospection_desc:0 "Інвестиції в сучасні інструменти для видобутку корисних копалин і розширення шахтної інфраструктури закладають основу для міцної промисловості видобутку корисних копалин. Збільшення видобутку буде служити потребам національної оборони та зміцнить готовність країни до конфлікту."
 FIN_fighter_equipment_3_short:0 "VL Humu"
 FIN_finnish_federation_of_trade_unions:0 "Федерація профспілок Фінляндії"
 FIN_foreign_aircraft_equipment_and_subsidies_tt:0 "\nПридбати обладнання для літаків у §Yкраїн, готових продати нам оснащення§!.\nДодати субсидію на обладнання до §Y[ROOT.GetName]§! з [?ROOT.FIN_basic_subsidies_value|Y2] £GFX_civ_factory_output для §Y$small_plane_airframe$§!, орієнтуючись на §Yкраїни, які бажають продати обладнання us§!.\nКраїни продавців:\n"
 FIN_gather_funds_for_womens_shelters:0 "Збір коштів для жіночих притулків"
 FIN_gather_popular_support_dec_tt:0 "Наша сторона отримає §G+10%§! загальної території та військових підрозділів. \nБуде створено додаткові дивізії комуністичного §Yополчення§!."
 FIN_german_threat_desc:0 "Прусський мілітаризм знову підняв свою потворну голову в [GER.Capital.GetCapitalVictoryPointName]. У той час як інші задоволені тим, що європейські столиці знаходяться під черевиком [GER.GetLeader], ми ні. Настав час цієї загрози миру було розібрано раз і назавжди."
 FIN_greater_finland_DEF:0 "Велика Фінляндія"
 FIN_industrialize_the_region:0 "Індустріалізація регіону"
 FIN_joint_scientific_program_tt:0 "§YКожен [ROOT.GetAdjective]ий союзник або суб'єкт§! приєднається до групи обміну технологіями §Y$FIN_joint_research_and_development_program_name$§!."
 FIN_kurt_martti_wallenius:0 "Курт Мартті Валленіус"
 FIN_makola_mine:0 "Шахта Маколи"
 FIN_mineral_wealth_desc:0 "[ROOT.GetNameDefCap] має велику кількість природних ресурсів, які залишаються невикористаними. Якщо ми хочемо підтримувати надійну військову силу, ми повинні використовувати ці ресурси та покращити нашу економічну самодостатність."
 FIN_modernize_the_army_leaders_tt:0 "До §Y3 лідерів підрозділів§! з §Yрівнем навичок 4§! або вище:"
 FIN_no_faction:0 "свого альянсу"
 FIN_pact_for_continuation_war_fin_tt:0 "Ефекти, коли [FROM.GetFlag]§Y[FROM.GetNameDef]§! оголошує війну державі [SOV.GetFlag]§Y[SOV.GetNameDef]§!:\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! оголосить війну державі [SOV.GetFlag]§Y[SOV.GetNameDef]§!"
 FIN_politics_no_kallio_winter_war:0 "[ROOT.GetLeader.GetSheHeCap] також із занепокоєнням помічає зростаючу у світі напругу та виявляє глибоке й щире бажання гарантувати безпеку [ROOT.GetAdjective]ого народу в ці непрості часи."
 FIN_rebalance_industrial_focus_dec_cost_tt:0 "Вартість рішень §Y$FIN_prioritize_light_industry$§! і §Y$FIN_prioritize_heavy_industry$§! буде скинуто до початкової величини.\n"
 FIN_red_finlanda_ADJ:0 "Фінськ"
 FIN_resignation_of_kallio_desc:0 "$FIN_kyosti_kallio$ не був найбільшим державним діячем, і його останні невдачі показали, що він не може спрямувати країну в правильному напрямку. Зараз, коли напруга у світі зростає, а його здоров'я не дозволяє йому мати справу з серйозними проблемами, які постійно виникають, найкраще, якщо він піде у відставку."
 FIN_retake_leningrad_mission_desc:0 "[FIN.GetAdjectiveCap]і сили захопили [195.GetName] у нас, і якщо ми не зможемо відбити його найближчим часом, вони зможуть виконати будь-які свої вимоги."
 FIN_search_for_weapon_caches_decision_cost_cp_tooltip:0 "Прийняття рішення коштує £command_power §Y[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
 FIN_sissi_desc:0 "У міру того, як триває конфлікт, наша легка піхота Sissi стає безцінним надбанням для армії Фінляндії, використовуючи свій досвід у патрулюванні на далеких дистанціях і влаштовуючи засідки, щоб наносити удари по ворожих цілях. Озброєні чудовим знанням місцевості та здатністю рухатися швидко і безшумно вони виявляються колючкою в оці ворога і джерелом гордості для фінського народу."
