 GRAND_DOCTRINE_OPERATIONAL_INTEGRITY_DESC:0 "Завоювання та підтримання переваги в повітрі як передумова для домінування у бойовому просторі за допомогою середніх бомбардувальників загального призначення, які завдають оперативних ударів."
 GREATER_LIT_neutrality:0 "Королівство Литва"
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_STANDARD:0 "Кіпр — грецький і завжди буде грецьким. Можливо, раніше, коли британці позбавили нас шансу на об'єднання, ми не були готові, але тепер наша держава є достатньо сильною і стабільною, щоб об'єднати наш народ! Настав час покінчити з іноземною окупацією Кіпру, щоб острів повернувся до складу Греції, де йому і місце."
 GRE_GREATER_GREECE_democratic:0 "Еллада"
 GRE_a_long_and_proud_tradition:0 "Давня та славна традиція"
 GRE_agrarian_society_desc:0 "Греція традиційно покладалась на сільське господарство і легку промисловість, де експорт заснований на таких торгових продуктах, як табак. Через нашу залежність від традиційних форм виробництва в будівельних проєктах нам доводиться покладатися на важку промисловість великих держав. Назріває конфлікт, і нам необхідно модернізувати індустрію, притому негайно."
