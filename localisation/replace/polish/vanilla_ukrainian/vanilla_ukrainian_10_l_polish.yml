 ITA_rodolfo_graziani:0 "Родольфо Ґраціані"
 ITA_sea_wolves_desc:0 "Наші німецькі союзники розробили жахаючє ефективні підводні човни та доктрину «вовчої зграї» для їхнього застосування. Ми мусимо вчитися у них."
