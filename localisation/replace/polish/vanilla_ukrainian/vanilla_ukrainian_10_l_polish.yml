 GER_revive_the_kaiserreich_desc:0 "Останнє десятиліття показало, що демократичний режим надто слабкий, щоби давати відсіч численним внутрішнім ворогам. Ми маємо повернути до влади сильну руку кайзера; для підготовки до цього заходу ми відродимо стару монархічну конституцію."
 GER_rocketry_innovations:0 "Інновації в ракетобудуванні"
 GER_second_ljubljana_award_desc:0 "Тепер, коли югославське питання влагоджене, настав час зайнятися Грецією. Союзники несправедливо звеличили цю країну. Настав час дізнатися, хто наші друзі."
