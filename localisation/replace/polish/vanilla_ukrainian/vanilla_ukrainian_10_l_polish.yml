 BUL_german_industrial_agreements_cap_basic_tt:0 "Поточні [GER.GetAdjective]і заводи: [?BUL.BUL_german_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_basic_cap|R0]\nВиконання фокусу §Y$BUL_approach_germany$§! збільшить межу до [?BUL.BUL_industrial_investments_medium_cap|G0]."
