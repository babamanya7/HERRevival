 destroyer_leader_desc:0 "§LЦей офіцер, що вміло поєднує рішучість і обережність, став ідеальним командувачем групи швидкохідних кораблів.§!"
 deterrence_desc:0 "Важко самотужки отримати з війни користь. На щастя, ми знаємо, що найкращий захист — це зброя, яка вселяє такий страх, що її не потрібно застосовувати."
