 MAN_state_shintoism_decisions_desc:0 "Оскільки шінтоїзм імпортується до нашої країни з Японії, все ще існує певне побоювання щодо нього, але з деяким переконанням місцеве населення напевно підкориться. Використовуючи методи, випробувані та перевірені на Японських островах, ми можемо використати це як можливість посилити вплив Імператора на наших підданих і, своєю чергою, нашу внутрішню стабільність."
