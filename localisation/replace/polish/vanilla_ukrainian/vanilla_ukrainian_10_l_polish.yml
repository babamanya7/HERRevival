 sp_air_generic_major_breakthrough_reward_option:0 "Чудово!"
 sp_air_helicopter_speed:0 "Вертоліт - Speed Preference"
 sp_air_helicopter_unique_reward_desc:0 "Ця нова техніка буде вразливою до найрізноманітніших загроз, що викликає занепокоєння щодо її живучості на полі бою. Ми могли б розв'язати цю проблему, зосередившись на гелікоптері..."
 sp_air_mothership_aircraft:0 "Літак-матка"
 sp_air_supersonic_jet_cost_increase:0 "Надзвуковий реактивний двигун: найякісніші матеріали"
 sp_armored_signal_tech_desc:0 "Оснащення наших підрозділів командними машинами забезпечить безпечну та надійну комунікацію і координацію на полі бою під броньованим захистом."
 sp_commercial_nuclear_reactor_concerns_reward_option_ignore:0 "Цілковита дурість!"
 sp_land_generic_reward_armor_bonus_1_desc:0 "Очолюючи передові дослідження, [Character.GetName] представляє революційні відкриття в галузі нових сплавів, які змінять танкову броню. Ці знахідки обіцяють значні зрушення в бронетанковій війні, демонструючи ключову роль науковця у формуванні її майбутнього."
