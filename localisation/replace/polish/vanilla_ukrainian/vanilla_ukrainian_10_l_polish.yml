 JAP_sea_bigger_better_yamato:0 "Лінкори класу «Цушіма»"
 JAP_sea_bigger_better_yamato_desc:0 "Оскільки ми не багаті на ресурси, ми повинні переконатися, що використовуємо їх якнайкраще. Ми побудуємо найпотужніші лінкори, які коли-небудь виходили на поверхню планети, здатні перемогти будь-якого ворога в лобовому зіткненні. З цим наші вороги схиляться перед нами або припинять своє існування."
 JAP_sea_mountaineers:0 "Створити гірсько-піхотні полки"
 JAP_sea_pressure_siam_desc:0 "Сіам розташований у вигідному місці, щоб допомогти нам у майбутній війні із західними державами. Залучивши їх на свій бік, ми значно полегшимо неминуче вторгнення до Малайї, а відтак і до Ост-Індії. Тому ми повинні чітко дати їм зрозуміти: якщо вони не з нами, то вони проти нас."
 JAP_shogunate_fascism_DEF:0 "Японський шьоґунат"
