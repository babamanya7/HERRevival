 CZE_strengthen_the_little_entente_desc:0 "Спрямована переважно на стримування [HUN.GetNonIdeologyName], Мала Антанта має потенціал стати серйозним альянсом зі значною армією."
 CZE_strike_the_eastern_threat_desc:0 "Лицемірний [SOV.GetName], виправдовуючи свої імперські амбіції критикою нашого уряду, становить екзистенційну загрозу для [CZE.GetName], яку необхідно усунути."
