 ITA_superaereo_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$\n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+5%§!\n$MODIFIER_AIR_MISSION_XP_FACTOR$: §G+5%§!\n$MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-10.00%§!\n\n"
 ITA_the_carabinieri_spawn_divs_tt:0 "Створити §Y5 піхотні§! дивізій у області §Y[THIS.GetName]§!.\n\n"
 ITA_the_eastern_threat_desc:0 "Не секрет, що новий Радянський Союз становить загрозу не лише нашим власним інтересам, але й інтересам усіх західних держав. Ми підірвемо здатність цієї країни до розширення, позбавивши її одного з найбагатших регіонів, до якого вона має доступ — Чорного моря."
 ITA_the_ethiopian_question_desc:0 "Війна в Ефіопії була жорстокою та несправедливою справою. Ми мусимо відшкодувати збитки, завдані фашистами в країні, та звернутися до місцевої влади з проханням про примирення."
