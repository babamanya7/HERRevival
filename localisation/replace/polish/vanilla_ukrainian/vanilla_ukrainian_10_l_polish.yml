 TUR_GATHERING_STORM_DESC:0 "З попелу Османської імперії зродилася Турецька республіка. Незалежність Туреччини була здобута кров'ю та кулями під час Національної кампанії 1923 року, і хоча боротьба була справедливою, ціна продовжує тяжіти для турецького народу.\n\nРелігійні консерватори вражають внутрішні райони та найрішучішим чином протистоять загальнонаціональним зусиллям модернізації, тоді як курдські націоналісти сіють хаос на сході країни. Наш відомий президент Мустафа Кемаль Ататюрк мусить об'єднати країну або передати смолоскип лідеру, який зможе, й вони мусять зробити це до того, як у Європі виникнуть проблеми..."
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_SECULAR:0 "Надто довго наші релігійні інститути каталися, наче сир у маслі. Щоразу релігійна влада намагається підірвати авторитет уряду та знецінити його роботу. Настав час позбавити їх мирських благ і знайти їм найкраще застосування."
 TUR_VICTORY_POINTS_867:0 "Калканделен"
 TUR_cannot_form_kurdish_collaboration_government_tt:0 "§Y[TUR.GetNameDef]§! не може сформувати курдський колабораційний уряд."
 TUR_cleanse_iberia_of_bolshevism_desc:0 "Поразка націоналізму в іспанській громадянській війні — формене неподобство! Це неможлива, збочена наруга над правосуддям і знущання над справою фашизму. Ми підемо шляхом сили і зцілімо рани минулого."
 TUR_decision_cost_kurd_rebels_blocked:0 "£command_power£ §R15§!"
 TUR_destroyer_3_desc:0 "The four destroyers of the Demirhisar class were built in Britain and completed in 1942. Two of the ships were interned by the Royal Navy, one of which was returned after the war. The ships were based on the British I-class. They displaced 1,370 tons and had four 120mm/45 QF Mk IX guns as their main armament. They had decent speed and good range, and had a strong complement of AA guns and ASW equipment."
