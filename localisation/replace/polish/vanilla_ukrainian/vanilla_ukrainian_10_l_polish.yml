 CHI_integrate_the_hongmen_desc:0 "Китай переповнений групами, що сформувалися для захисту від гніту Цін. Після Сіньхайської революції вони втратили свою мету і пішли різними шляхами. Ми могли б знову дати їм мету, інкорпорувавши їх або наслідуючи їхню організацію та практику."
