 GRE_french_kurdistan_option_tt:0 "Якщо пропозиція буде прийнята, а Іракліонська конвенція завершиться успіхом, то, коли §Y[TUR.GetNameDefCap]§! капітулює, §Y[FRA.GetNameDefCap]§! створить §Yкурдську§! маріонеткову державу на [TUR.GetAdjective]их землях, які є осердними територіями §YКурдистану§!."
