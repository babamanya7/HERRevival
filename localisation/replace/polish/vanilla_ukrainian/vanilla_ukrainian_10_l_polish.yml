 JAP_the_pacific_union_of_soviet_socialist_republics_desc:0 "Мить, до якої ми так довго прагнули, нарешті настала. Настав час проголосити створення нової азійської держави, яка об'єднає різні ради в один союз."
 JAP_to_reach_princess_kaguya:0 "Дістатися принцеси Каґуї"
 JAP_tokko_arresting_anti_army_disidents_mission_tt:0 "Наступні радники будуть заарештовані і не будуть доступні до початку громадянської війни:"
 JAP_unlock_east_asia_occupation_law_tt:0 "Відкриває закон про окупацію в §Yазійських§! регіонах:\n"
 JAP_west_pacific_treaty_org_allied_trade_cat_desc:0 "Наші союзники мають багато ресурсів, які були б корисні для нашої нації, і ми можемо отримати велику вигоду від поглиблення торговельних відносин з цими країнами. Ми забезпечимо постійний потік життєво важливих ресурсів і водночас позбавимо наших ворогів тих самих ресурсів, зміцнюючи нас і послаблюючи їх."
 JAP_west_pacific_treaty_org_economic_integration_decision:0 "Запропонувати економічну інтеграцію §Y[FROM.GetName]§!"
 JAP_yosuke_matsuoka:0 "Йосуке Мацуока"
 JUNO_bolivian_falange:0 "Засновник Болівійської соціалістичної фаланги"
 JUNO_brazil_events.153.desc:0 "Північний Схід Бразилії протягом багатьох років переслідували бандити, відомі як Канґасу. Через нестабільність у столиці та більшу стурбованість політиків утриманням влади, Канґасу лютує. Лише завдяки спільним зусиллям правоохоронних органів ми можемо сподіватися обмежити їхній вплив у регіоні."
 JUNO_brazil_events.160.desc:0 "[FROM.GetAdjective] дипломати звернулися до нас щодо їхніх планів стимулювати іноземні корпорації до створення філій у їхній нації. Вони хочуть знати, чи будемо ми блокувати нашим корпораціям це робити. Якщо ми погодимося дозволити нашим компаніям розширюватися на цей ринок, що розвивається, ми можемо отримати економічну вигоду самі."
 JUNO_brazil_events.32.t:0 "[BRA.GetNameDefCap] вимагає територію в Гвіанах"
 JUNO_brazil_events.40.t:0 "[BRA.GetNameDefCap] висуває ультиматум"
 JUNO_brazil_events.41.a:0 "У них не було іншого реального вибору, окрім як погодитися."
 JUNO_brazil_events.85.desc:0 "Відповідь [FROM.GetNameDefCap] на наше запрошення щойно надійшла до нас. Як ми й сподівалися, [FROM.GetAdjective] керівництво побачило цінність приєднання до Організації американських держав. Відтепер ми працюємо разом!"
 JUNO_easter_island_socialist:0 "Соціаліст із Острова Пасхи"
 JUNO_guay_events.8.desc:0 "[FROM.GetName] повідомила нам, що було б образливо навіть припустити, що вони відмовляться від контролю над їхньою основною територією. Вони повідомляють нам, що продовжуватимуть боротися, доки наш уряд не буде повалено, а наша армія розформована."
