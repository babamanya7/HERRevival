 YUG_invite_german_military_mission_desc:0 "Треба подолати нелюбов наших військових до німців. Запрошення військової місії значною мірою продемонструвало б нашому керівництву, що спільна робота приносить велику користь."
 YUG_invite_italian_naval_experts_desc:0 "Наші середземноморські союзники володіють кращими знаннями про проєктування та будівництво кораблів. Ми запросимо італійських експертів, щоб вони передали нам свої знання."
