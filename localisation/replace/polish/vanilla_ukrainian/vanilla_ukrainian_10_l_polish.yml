 WW_hungary.110.desc:0 "Параноїдальний [FROM.GetLeader] відмовив Герману Герінгу у праві переїхати до нашої країни, попри наші численні прохання й переконливі аргументи. Тепер нам доведеться обійтися без короля, зробивши Салаші єдиним лідером нації."
 WW_hungary.111.desc:0 "Протягом останнього місяця в [664.GetName] тривав публічний референдум щодо приєднання до [HUN.GetNameDef]. За даними міжнародних спостерігачів, вибори пройшли без серйозних фальсифікацій. Результати вже відомі — більшість населення проголосувала за вихід із нашої держави. Чи приймемо ми це?"
 WW_hungary.123.a:0 "Розігнати їх і заарештувати їхнього жалюгідного лідера!"
 WW_hungary.13.t:0 "[FROM.GetNameDefCap] стоїть на своєму в Словаччині"
