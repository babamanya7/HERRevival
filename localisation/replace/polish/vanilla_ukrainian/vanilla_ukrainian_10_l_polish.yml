 BRA_the_polaca_desc:0 "Хоча залишилося небагато людей, здатних створити серйозну загрозу для нашого режиму, було б дуже добре, якби ми розробили нову конституцію, яка окреслила б повноваження президента. Можливо, ми могли б звернутися до нещодавно прийнятої польської конституції для натхнення."
