 ROM_torpedo_boats_desc:0 "Торпеди — чудовий вирівнювач морської війни. Переконавшись, що всі наші кораблі несуть їх, ми зможемо здивувати та знищити переважаючу силу простою зухвалістю та гучним торпедним вогнем."
 ROM_vanatori_de_munte_unit_tt:0 "\nОтримає §Yгірську піхотну§! військову частину з 9 батальйонами.\n"
