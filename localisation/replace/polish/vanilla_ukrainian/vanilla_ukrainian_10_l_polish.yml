 LIT_promote_falange_militancy_desc:0 "[POL.GetFascistParty] сумно відома своїми буйними та жорстокими методами демонстрацій. Багато фашистів бояться націоналістичного запалу партії [POL.GetFascistParty], але ми знаємо, що це лише прояв патріотизму, який палає в їхніх серцях, і його потрібно підтримувати."
