 TUR_intervene_in_the_spanish_civil_war:0 "Втрутитись у громадянську війну в Іспанії"
 TUR_invite_german_officers_to_izmir_desc:0 "Весь світ заздрить майстерності [GER.GetAdjective] військових радників. Для модернізації наших військ та підвищення їх тактичних навичок ми зобов'язані скористатися за допомогою передових збройних сил Європи."
 TUR_join_the_central_powers_desc:0 "Якось ми вже зазнали невдачі, намагаючись укласти пакт, але тепер ми не програємо! Доля якось вирішила дати нам усім другий шанс виправити помилки Великої війни. Ми всі маємо скористатися цією можливістю!"
 TUR_joint_caucasian_turkish_officer_school:0 "Спільна кавказько-турецька офіцерська школа"
 TUR_kemalist_army_officers_extended_power_disloyal:0 "Офіцери-кемалісти"
 TUR_koc_ticaret_as_shipyard_organization:0 "$koc_ticaret_as_shipyard$"
 TUR_nationalism_decision:0 "Націоналізм"
 TUR_peace_in_the_world_desc:0 "Ататюрк одного разу проголосив головною метою турецької зовнішньої політики миру в усьому світі, і ми маємо намір працювати над досягненням цієї високої мети. Ми хочемо, щоби на Землі запанував мир, а не вічні війни через жалюгідні територіальні претензії."
 TUR_placate_kurdish_state_effect_tt:0 "£faction_tur_kurdish §YКурдські повстанці§! в області §Y[TUR_kurdish_state_event_target.GetName]§! будуть утихомирені."
 TUR_privatize_our_infrastructure:0 "Приватизація інфраструктури"
 TUR_recover_the_kardzhali_vilayet:0 "Повернути Кирджалійський вілаєт"
 TUR_restack_the_officer_corps_tt:0 "Ми реорганізуємо §Yофіцерів-кемалістів§! і зробимо їх більш слухняними волі уряду. \n§RЯкщо стабільність країни є нижчою за 50%, а офіцери-кемалісти набули значних повноважень, то вони, швидше за все, повстануть проти уряду!§!"
 TUR_revolutionism_desc:0 "Тож хвилюйся й сяй, як світле небо, о ти славний півмісяць, щоб кожна наша остання краплина крові була нарешті благословенною і гідною! Ні ти, ні мій рід ніколи не згаснуть!"
 TUR_salt_the_scars_of_the_great_war:0 "Роз'ятрити рани Великої війни"
 TUR_scout_plane_equipment_2_short:0 "THK Kartal"
 TUR_seek_treatment_for_ataturk_desc:0 "Щоб наш Газі прожив ще кілька років, необхідно зняти з нього частину непростих обов'язків з управління країною. Ми мусимо відправити його в кругосвітню подорож і надати лікування у найкращих санаторіях світу та відпочинок на найкращих курортах."
 TUR_stoked_liberalism_flag:0 "Нещодавно розпалено ліберальні настрої"
 TUR_strike_at_the_fascist_menace_desc:0 "Фашизм — занадто небезпечна ідеологія, щоби дозволяти їй цвісти в нас під боком. Як швидко наш власний народ підчепить цю заразу? Необхідно роздавити фашистів та позбавити їх легітимності."
 TUR_sub_zero_survival_training_desc:0 "Це нелегке завдання наслідувати деяким з лютих холодів Євразії, але він був змушений це зробити. Ми вирішили побудувати об'єкт на вершині гори Паландьокен в Ерзурумі з додатковим меншим об'єктом, розташований навколо гори Арарат, щоби наші війська могли тренуватися в альпійських і льодовикових умовах цілий рік."
