 XIC_restore_the_homeland_desc:0 "З поверненням нашої старої столиці Мукден нарешті настав час для $CHI_zhang_xueliang$ належним чином прийняти титул Воєначальника Маньчжурії та Генералісимуса Військового уряду Китаю і повернути Фентянській кліці владу, яку вона колись мала. Хай живе Фентян, і хай живе Молодий маршал!"
 XIC_revive_the_beiyang_government_desc:0 "Як законний спадкоємець Бейянського уряду у вигнанні, ми можемо нарешті проголосити себе легітимною Китайською Республікою. Що принесе майбутнє, ще належить побачити, але наразі ми принесли демократію всьому Китаю, і, сподіваємось, так залишатиметься тисячу років."
