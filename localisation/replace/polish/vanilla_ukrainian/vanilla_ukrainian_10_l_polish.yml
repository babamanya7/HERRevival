 JAP_heavy_cruiser_1_desc:0 "Важкі крейсери класу «Furutaka» і наступні крейсери класу «Aoba» були першими важкими крейсерами Імператорського флоту Японії. Вони були спроєктовані за зразком американського класу «Omaha» та британського класу «Hawkins». Пізніше вони були модернізовані і отримали нове озброєння та кращі двигуни."
 JAP_heavy_ship_engine_4:0 "«Kampon» 150 000 к. с. н. в."
