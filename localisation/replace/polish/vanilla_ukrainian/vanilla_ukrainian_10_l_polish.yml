 GRE_the_hellenic_navy:0 "Еллінський флот"
 GRE_the_leonidas_line:0 "Буде завершено початкову частину §Yлінії Леонідаса§! — лінії з наземних фортів, які захищають наші вразливі кордони.\n"
 GRE_utilize_our_strengths_desc:0 "Греція — нація фермерів і товарів розкоші, і в цьому немає нічого соромного. Так, Німеччина масово виробляє танки та винищувачі, але звідки, на вашу думку, береться тютюн у трубці Германа Ґьорінґа? Ми, греки, знаємо свої сильні сторони, і якщо їх триматися, все буде добре."
 GUAY_a_domestic_arms_factory_desc:0 "Хоча наша економіка не може конкурувати з такими старими державами Європи, ми не можемо повністю покладатися на іноземну торгівлю зброєю. Ми розпочнемо процес внутрішнього виробництва зброї, якщо нас коли-небудь ізолюють."
 GUAY_agricultural_colonization:0 "Сільськогосподарська колонізація"
 GUAY_laissez_faire_stats:0 "До цього часу землевласники побудували:\n- §YЦивільні заводи:§! §G[?built_a_civ]§!\n- §YВійськові заводи:§! §G[?built_a_mil]§!\n- §YВерфі:§! §G[?built_a_dockyard]§!\n- §YІнфраструктура§!: §G[?built_a_infra]§!\n- §YАвіабази§!: §G[?built_an_airbase]§!\n- §YЗенітні установки§!: §G[?built_an_aa]§!\n- §YРадари§!: §G[?built_a_radar]§!\n- §YЦентри постачання§!: §G[?built_a_hub]§!"
