 SWITCH_GRAND_DOCTRINE_MASTERY_RESET:0 "§RВся £doctrine_mastery §Hмайстерність§! буде скинута при зміні глобальної доктрини.§!"
 SWI_abandoned_neutrality:0 "Покинули нейтралітет"
 SWI_alpine_redoubt_desc:0 "Поки ми маємо укріплену базу, на яку можна відступити, ми можемо бути нестримною силою проти загарбників. Ми повинні зробити Альпи ще більш неприступними і зовнішньо посилити свій вплив звідти, лише тоді ми зможемо віддалитися від ворога, де б він не був."
 SWI_american_planes_desc_usa:0 "Якщо ми збираємося купувати літаки в іншої країни, [USA.GetNameDef], з її традиціями демократії, відносного нейтралітету та видатної аеронавігаційної техніки, є ідеальним кандидатом."
 SWI_anarchist:0 "Анархіст"
 SWI_anti_tank_divisions_desc:0 "Танк — це вістря сучасної війни, наша місцевість уже дає нам перевагу проти них, але якщо ми оснастимо наші сили протитанковим обладнанням, ми можемо відрізати наконечник і притупити спис."
 SWI_buero_ha_desc:0 "Ми не можемо дозволити нашим сусідам знати, що ми намагаємося зібрати про них розвідувальну інформацію, тому ми повинні покладатися на напівнезалежні розвідувальні служби, щоб узяти на себе наші таємні операції. Ось тут і з'являється фотобізнесмен, який став шпигуном Гансом Гаусаманом, зі своїм невеликим і спритним офісом розвідки, він може виконувати потрібну роботу, не забруднивши нам руки."
 SWI_citizen_supply_mandate_mod:0 "$SWI_citizen_supply_mandate$"
 SWI_concessions_to_fascists:0 "Поступки [ROOT.GetAdjective]ій партії ([FROM.GetRulingIdeology])"
 SWI_embrace_communism:0 "Прийняти комунізм"
 SWI_extensive_fascist_propaganda_desc:0 "Раніше фашистська пропаганда в Швайцарії надходила ззовні, але рух набрав достатнього імпульсу, щоби затопити країну фашистською пропагандою зсередини та ззовні."
 SWI_fair_trial_for_frankfurter:0 "Справедливий суд для Давіда Франкфуртера"
 SWI_fascist_propagandist:0 "Фашистський пропагандист"
 SWI_federal_council_decisions_category_desc_alt:0 "Не можна чекати, що [SWI.GetLeader], лідер держави [SWI.GetNameDef], буде виконувати всі обов'язки країни з такою важливою місією, тому [SWI.GetLeader.GetSheHe] мусить покладатися на раду, щоби делегувати деякі функції неіснуючих зборів.\n\n§YПровідні канцлери:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_dem:0 "Федеральна Рада Швайцарії з 1848 року є непохитним центром швайцарської демократії. [SWI_get_temp_explanation_of_council_system]\n\n§YПрезидент Швайцарської конфедерації:§!\n[SWI_GetPresidentName]\n\n§YПровідні канцлери:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_floating_fortresses:0 "Плавучі фортеці"
 SWI_foreign_fascist_propaganda:0 "Іноземна фашистська пропаганда"
 SWI_fortify_border_with_italy:0 "Зміцнити кордон із Італією"
 SWI_fortify_the_jura_desc:0 "Було зроблено багато підготовчих робіт для зміцнення Альп, але ми також можемо зміцнити гори Юра, які, хоч і не такі круті чи обороноздатні, можуть виявитися вигідними як другий фронт для нападу на плато, коли воно опиниться в руках ворога."
 SWI_heer_und_haus_mod:0 "$SWI_heer_und_haus$"
 SWI_independent:0 "Незалежний"
 SWI_max_country_gold_trade_TT:0 "§RДержавою досягнута межа торгівлі золотом§!"
 SWI_national_redoubt_desc:0 "Анрі Ґізан пропонує інший спосіб захисту [ROOT.GetName]. Замість того, щоби намагатися захищати кордони нашої країни незалежно від ціни, ми можемо стратегічно поступитися Швайцарським плато та відступити в Альпи, де ми можемо дорого обійтися ворогу, щоби нас окупувати."
 SWI_pre_empt_anschluss_tt:0 "§YЯкщо [AUS.GetNameDef] прийме, ми зробимо осердними їхні осердні землі§!\n\nВони, ймовірно, погодяться спираючися на §Yрозмір§! наших збройних сил, їхню §Yдумку§! про нас і якщо §Y[GER.GetNameDef] готується§! анексувати [AUS.GetName]."
 SWI_propagandize_swiss_military_tradition:0 "Пропагувати швайцарську військову традицію"
 SWI_recently_finished_president_initiative_desc:0 "Зважаючи на обмеженість повноважень Президента Конфедерації та Федеральної ради, ми мусимо зачекати, поки не буде здійснена ще одна узгоджена ініціатива. Надання Раді більших повноважень могло б стати способом зробити більше таких ініціатив, але ми повинні подумати, чи є це найкращим курсом для глибоко вкорінених демократичних цінностей Швайцарії."
 SWI_request_austrian_occupation_desc:0 "[ROOT.GetNonIdeologyName], додавши [848.GetName], абсолютно не є нашою остаточною формою. Ми можемо довести [?SWI_fascist_overlord.GetName], що можемо управляти більшою територією, полегшивши їхній тягар і зробивши [ROOT.GetFactionName] більш ефективною бойовою машиною."
 SWI_rig_infrastructure_to_blow_TT:0 "Коли одну з наших основних областей захоплено ворогом, усі §Yінфраструктура§!, §Yзалізниці§!, §Yцентри постачання§! та §Yбункери§! буде повністю пошкоджено. §YВійськові§! та §Yцивільні заводи§! буде пошкоджено частково."
