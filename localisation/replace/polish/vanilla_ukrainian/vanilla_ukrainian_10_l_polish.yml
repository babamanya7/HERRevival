 BEL_fighter_equipment_2:0 "Renard R.36"
 BEL_fn_herstal_desc:0 "[ROOT.GetNameDefCap] благословенний світовою відомістю збройовою індустрією, найбільшою з яких є Fabrique Nationale de Herstal або FN Herstal. Цей виробник зброї випускає продукцію виняткової якості, розроблену кращими фахівцями галузі. Тісна співпраця з Browning Arms Company ще більше підсилює глобальний вплив наших компаній."
 BEL_increased_union_powers_decision:0 "Надати повноваження профспілкам"
