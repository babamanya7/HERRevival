 MEX_focus_urban_development_desc:0 "Міста є центром економічної активності, і тому їхні потреби мають бути пріоритетними перед відсталими сільськими державами. Ми розбудуємо системи доріг і залізниць у Мехіко та інших великих містах, і завдяки цьому багатство Мексики зросте ще більше."
