 mtg_britain.2.b:0 "Мабуть, народ правий — король мусить зректися."
 mtg_britain.52.t:0 "[From.GetName] просить укласти союз"
 mtg_britain.66.a:0 "Ми не бачимо нічого поганого в такому підході."
 mtg_britain.71.d:0 "[From.GetNameDefCap] повідомляє, що утримається від поширення комунізму в державі [CAN.GetNameDef]."
 mtg_britain.85.d:0 "[From.GetAdjective] уряд повідомив нас, що погоджується з нашою пропозицією щодо збільшення видатків на оборону. Вони пообіцяли зробити це негайно."
 mtg_britain.90.t:0 "Імперська конференція: торгівля — [From.GetName] відмовляється"
 mtg_generic.1.desc:0 "[From.GetNameDefCap] звертає увагу на явно недостатню підтримку виборцями нашого поточного уряду та вимагає його заміни."
 mtg_netherlands.1.t:0 "Венесуела пропонує «захист» островам Ей-Бі-Сі"
 mtg_netherlands.15.t:0 "[From.GetNameDefCap] пропонує створити Об'єднані Нідерланди"
 mtg_netherlands.29.t:0 "[From.GetNameDefCap] просить надати спорядження"
 mtg_netherlands.31.d:0 "Представники держави [From.GetNameDefCap] відмовилися надавати нам спорядження. Вони стверджують, що якщо воно нам так необхідне, то наша промисловість зможе зробити більше."
 mtg_netherlands.35.a:0 "Це чудова ідея!"
 mtg_netherlands.4.a:0 "Ми покладемо на себе цей тягар."
 mtg_netherlands.42.d:0 "[From.GetNameDefCap] ділиться з нами деякими положеннями своєї військової доктрини та військовими знаннями."
 mtg_netherlands.46.d:0 "Принц Бернард нещодавно справив надзвичайне враження на публіку, піднявши дух і вселив у серця підданих надію на остаточну перемогу. Хоча формально він не є представником уряду, це не завадить нам скористатися плодами такого несподіваного успіху."
 mtg_netherlands.5.t:0 "[From.GetNameDefCap] погоджується захищати острови Ей-Бі-Сі"
 mtg_netherlands.60.t:0 "[From.GetNameDef] загострює дипломатичний скандал"
 mtg_netherlands.70.t:0 "Німецькі перебіжчики утворюють дивізію"
 mtg_netherlands.76.d:0 "Тепер, коли війна завершується, німецькі солдати, що билися на нашому боці, повернулися на свою батьківщину і готуються воювати безпосередньо за свого кайзера."
 mtg_news.25.b:0 "Нагорода того коштувала."
 mtg_news.45.b:0 "Більше їм нас не втримати!"
 mtg_news.55.b:0 "Вони заплатили найвищу ціну."
 mtg_usa_civil_war_fascists.14.desc:0 "З деяких формувань надходять тривожні новини про те, що солдати не повертаються зі звільнення або просто кидають свої пости. Ще більше турбує той факт, що багато хто з цих солдат родом з одного і того ж регіону, і багато хто отримали листи з дому за кілька днів до самовільного залишення частини.\n\nСхоже, йде скоординована кампанія з повернення додому солдатів із південних штатів."
 mtg_usa_civil_war_fascists.15.desc:0 "Пославшись на те, що політичний клімат не сприяє бізнесу, один власник великої збройової компанії сьогодні заявив про перенесення свого виробництва в більш відповідне місце. Особливо він зазначив активізацію профспілок, діяльність яких, на його думку, знизила продуктивність і зменшила довіру інвесторів, його компанія має намір побудувати новий завод десь у південних штатах."
 mtg_usa_congress_remove_state_tt:0 "З Конгресу виключено двох сенаторів.\n"
 mtg_usa_north_american_dominion.3.t:0 "[From.GetNameDefCap] відмовляється"
 mtg_usa_senate_small_support_tt:0 "До §Y5 сенаторів§! §Gпідтримають§! уряд.\n"
 mtg_usa_strategic_interests.2.desc:0 "Після довгих внутрішніх суперечок [ENG.GetAdjective]ий уряд вирішив прийняти нашу пропозицію. Обидві сторони склали графік передачі контролю над зазначеними територіями."
 mtg_usa_strategic_interests.3.desc:0 "Усього лише через кілька хвилин після початку зустрічі [ENG.GetLeader] і [USA.GetLeader] перервали переговори. [ENG.GetAdjective] відповідь була простою— відмова. За ним була більш докладна дипломатична нота, але вона лише підтвердила небажання навіть обговорювати умови."
 mughal_west_britain_company:0 "Могольська Вест-Британська компанія"
 multialtitude_flying:0 "Політ на різних висотах"
 mutiny_event.6.desc:0 "[Root.GetLeader] announced to the press today that his latest peace offer has failed. While the causes for this unfortunate turn of events are very complex, the [Root.GetAdjective] demand that the other side pay for all damages caused, disarm completely and publicly acknowledge that they started the war may have been the final straw.\n\nOur enemies have responded in kind, calling our reasonable requests a demand for unconditional surrender. They have promised that they will prosecute this war until the bitter end.\n\nWith our enemies evidently unwilling to see reason and promising to fight on, attempts by the mutineers to force a peace settlement have collapsed."
 nationalist_lutheran_priest:0 "Лютеранський священик-націоналіст"
 nationalistic_freedom_fighter:0 "Націоналістичний борець за свободу"
 nationalists_chosen:0 "Смерть червоним!\n"
 naval_air_operations:0 "Вильоти морської авіації"
