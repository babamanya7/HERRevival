 CHI_expand_the_tongzi_jun_desc:0 "Лави молодіжного корпусу можуть виховати нові покоління лояльних і дисциплінованих громадян. Певна міра військової підготовки також полегшить їхній шлях до збройних сил."
 CHI_find_foreign_financiers:0 "Знайти іноземних фінансистів"
 CHI_foreign_threats_desc:0 "Кілька років тому Японія окупувала Маньчжурію, сформувавши на її місці маріонеткову державу. Японці не зупиняться, доки підкорять собі весь Китай; ми маємо бути готові дати їм відсіч, навіть якщо заради цього доведеться піти на контакт із місцевими царьками."
