 ITA_recognized_the_empire:0 "Визнали Італійську імперію"
 ITA_reestablish_old_alliances_desc:0 "Ми мусимо спробувати відновити союз, який сформували під час Великої війни. Тільки об'єднавшись із великими демократичними державами Європи, ми зможемо перемогти численні загрози, які нас підстерігають."
