 ICE_the_viking_spirit_desc:0 "Безстрашні та смертоносні — це слова, які асоціюються з давніми вікінґами. Вони перетинали океани, не знаючи, що лежить за ними, і лише сильні досягали успіху. Безстрашними і сміливими повинні бути ісландці сьогодні, бо тільки завдяки сміливості і відвазі країна наздожене те, що було колись, і знову пануватиме над Північним морем."
 ICE_the_wisdom_of_odin_desc:0 "Одін — Бог, пов'язаний із усім: від мудрості, зцілення, смерті, королівської влади, шибениці, знань, війни, битви, перемоги, чарівництва, поезії та божевілля до рунічної абетки. Він отримав свою величезну мудрість, коли він запропонував своє око в обмін на те, щоби випити з Мімісбрунна, який дав йому здатність нескінченного знання сьогодення, майбутнього та минулого. Ми мусимо спробувати втілити його дух і продовжити його спадок у майбутнє!"
