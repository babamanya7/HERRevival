 IRQ_arab_free_legion_desc:0 "Араби з усього світу зголосилися боротися проти старих держав, які стримували нас протягом десятиліть. Можливо, ми зможемо розвинути це та набрати війська з-за меж наших кордонів, щоб вони воювали поруч із нашими військовими проти наших спільних ворогів."
