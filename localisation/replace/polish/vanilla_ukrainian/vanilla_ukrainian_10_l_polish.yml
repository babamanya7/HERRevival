 INDUSTRIAL_ORG_UNLOCK_TRAIT_POPUP_UPGRADE_VARIANTS_TOOLTIP_HEADER:0 "§YОновити з останніми рисами§!\nОновити оснащення, застосувавши останні §Yриси дизайнерської команди§!. Це створить новий варіант."
 INSHOL_coffee_plantations:0 "Кавові плантації"
 INSHOL_naval_program_transfer_25_tt:0 "Передає §Y25%§! наших військово-морських сил до [INS.GetNameDef]."
 INSHOL_reform_knil_desc:0 "З того часу, як Ост-Індія завершила завоювання всього архіпелагу, Королівська голландська ост-індійська армія залишалася нерухомою і страждає від гострої нестачі фінансування. Із зростанням напруженості у світі, ми повинні почати переозброєння Ост-Індії якомога раніше."
 INS_add_3_militia_unit_tt:0 "Створює три підрозділи §YБорців за свободу§!, які можна використовувати в §Yрейдах§! для збільшення §Gприсутності ополчення§! в голландських регіонах."
 INS_alauddin_syah:0 "Алауддін Мухаммад Дауд Шах II"
 INS_arm_the_youth_desc:0 "Крім революціонерів, ми маємо озброїти молодь. Все ще сповнені енергії та надії, вони нестимуть полум'я революції. Ми повинні гарантувати, що якомога більше індонезійської молоді буде навчено та оснащено для бою. Якщо бойові дії дійдуть до їхніх домівок, вони будуть готові діяти."
 INS_artillerie_inrichtingen_pyrotechnische_name_normal:0 "AI Pyrotechnische"
 INS_artillery_equipment_2:0 "Bofors Haubits m/40"
 INS_bonifacius_cornelis_de_jonge:0 "Боніфаціус Корнеліс де Йонге"
 INS_communist_events.10.t:0 "Риторика [FROM.GetAdjective] набирає обертів"
 INS_communist_events.8.desc:0 "Брошури та листівки походження [FROM.GetAdjective] з'являються на наших фабриках, ринках та в університетах з дедалі більшою частотою. Вони проповідують євангеліє класової боротьби і обіцяють визволення через революцію, і наша поліція повідомляє, що вони знаходять сприйнятливу аудиторію серед невдоволених. Матеріал грубий, але ефективний, і його поширення не має ознак уповільнення."
 INS_conrad_helfrich:0 "Конрад Хелфріх"
 INS_cost_text_rubber_24:0 "£resources_strip|3 §Y24§!"
 INS_dutch_east_indies_desc:0 "Ост-Індія — це величезний архіпелаг, що налічує сотні різних культур і мов, що робить її надзвичайно складною для управління. Різноманітні рухи за незалежність, культурні бар'єри та економічні наслідки Великої депресії не полегшили цю проблему, і адміністрація працює вкрай неефективно. «Етична політика», запроваджена у 1918 році, мала на меті покращити ситуацію шляхом встановлення етичних трудових норм та надання демократичного представництва меншинам, проте Велика депресія завадила їхньому впровадженню."
 INS_dutch_investment_rate_80:0 "§YНідерланди§! з імовірністю на §G80%§! більшою обиратимуть фокуси зі спільного дерева"
 INS_economic_stabilization_desc:0 "Велика депресія та світовий протекціонізм залишили нас економічно покаліченими, і багато індонезійців, які колись працювали в сировинній промисловості, опинилися без роботи. Ми повинні вжити рішучих заходів і створити трудову програму, за якою громадянам без роботи буде призначатися робоче місце."
 INS_escalation_has_less_6_tt:0 "Рівень ескалації нижчий за §Y6§!"
 INS_fighter_equipment_2_short:0 "B-339C"
 INS_fra_treaty_fraside_tt:0 "Ми офіційно об'єднаємося з §Y[HOL.GetNameDefCap]§! у конфлікті в Ост-Індії. Якщо §Y[HOL.GetNameDefCap]§! переможе, ми матимемо право власності на північно-східну Суматру."
 INS_gerardus_johannes_berenschot:0 "Герардус Йоганнес Береншот"
 INS_governor_general_tjarda_desc:0 "Алідіус Тьярда ван Старкенборг Стахауер має дещо інше бачення Ост-Індії, ніж його попередник. Хоча він все ще налаштований проти націоналізму, він має трохи більш ліберальну політику і більш схильний прислухатися до побажань Фольксрааду."
 INS_hatta_princely_advisors_desc:0 "Через нашу спільну різноманітність ми знаходимо єдність. Ми заснували нашу націю на цьому принципі, але кінець революції створив напругу для цієї ідеї через відсутність спільної боротьби. Аби запобігти обуренню та повстанням меншин, ми маємо створити додаткову раду, де місцеві правителі з князівських держав матимуть прямий вплив на національну політику."
 INS_heavy_tank_equipment_3:0 "Zware Tank III"
 INS_henri_gerard_winkelman:0 "Анрі Жерар Вінкельман"
 INS_industrial_events.4.desc:0 "Закривши каучукові плантації в [FROM.FROM.GetName], ми звільнили місце в бюджеті для нових промислових проєктів у регіоні."
 INS_industrial_events_5_desc_independent:0 "Bank Indonesia повідомив, що рупія втратила майже п'яту частину своєї вартості лише за останній квартал. Торговці рисом у Сурабаї почали відверто відмовлятися від неї на користь іноземних банкнот. Наш міністр фінансів наполягає, що валюту можна врятувати, але тільки якщо ми діятимемо рішуче і швидко."
 INS_is_taking_volksraad:0 "Зараз приймає закон у Фольксрааді"
 INS_japanese_military_lessons_desc:0 "Ми маємо вивчити військові доктрини Японії і відповідно адаптувати нашу власну армію."
 INS_light_tank_destroyer_equipment_1:0 "Tankjager 1"
 INS_limited_war_events.6.t:0 "Наступ [FROM.GetAdjective] сповільнюється"
 INS_loot_knil_weapons_caches:0 "Пограбувати схованки зброї KNIL"
 INS_loyalist_events.33.desc:0 "Уряд [PHI.GetAdjective] відхилив нашу пропозицію про об'єднання. Їхній парламент відхилив її без другого читання. Ми запропонували їм місце у найвеличнішій нації Південно-Східної Азії, а вони плюнули на це."
 INS_medium_tank_artillery_equipment_2:0 "Pantserhouwitser 4"
 INS_medium_tank_artillery_equipment_2_short:0 "PTH-4"
 INS_moestopo:0 "Мустопо"
 INS_political_events.4.t:0 "[FROM.GetName] відмовляється віддавати [721.GetName]"
 INS_prime_minister_sjarifuddin_desc:0 "Шаріфуддін є найкращим кандидатом для Індонезії, його поміркована політика дозволяє знайти компроміс між комуністами та соціалістами."
 INS_realign_supply_chains_explain_tt:0 "Відкриває рішення §Y$INS_realign_supply_chains_cat$§! для продажу ресурсів приватним компаніям в оренду на 2 роки."
 INS_request_ceylon_decision_desc:0 "$INSHOL_request_ceylon_desc$"
 INS_returned_from_moscow:0 "Повернувся з Москви"
 INS_scout_plane_equipment_0_short:0 "Fokker C.XI"
 INS_scout_plane_equipment_1:0 "Fokker S.IX"
 INS_state_militia_port_control_2:0 "Окупація портів ополченням"
 INS_strat_bomber_equipment_0_short:0 "Fokker F.XVIII"
 INS_stronghold_java_desc:0 "Ост-Індія — це величезний архіпелаг, на якому проживає багато народів і який має надзвичайно суворий рельєф. Спроба захистити кожен острів, джунглі та гору від армії, набагато більшої за нашу, гарантовано зазнає невдачі. Хоча залишити наших побратимів нелегко, евакуація всіх островів, крім Яви, що дозволить нам розмістити там усю нашу армію, може бути найкращим кроком для нації в цілому."
 INS_tan_malaka:0 "Тан Малака"
 INS_transportation_minister:0 "Міністр транспорту"
 INS_volksraad_rumors_desc:0 "Ми почнемо непомітно обговорювати революцію у Фольксраді. Якщо ми досягнемо успіху, ми зможемо переконати індонезійських членів Фольксраду приєднатися до нашої справи."
