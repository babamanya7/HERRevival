 demand_indochina_focus_short_desc:0 "§LДивіться на новий уряд Франції з вимогою передати Індокитай.§!"
 demobilization_desc:0 "Оскільки загроза війни здається далекою, люди більше не бажають миритися з труднощами законів воєнного часу. Нам потрібно переглянути наші закони та розглянути можливість змінити їх, щоби заспокоїти протестувальників до того, як ситуація загостриться."
 denmark_events.2.desc:0 "Відколи ми доклали всіх зусиль, щоб фінансувати зміцнення кордонів, нам повідомляють, що населення починає заспокоюватися, особливо в тому, що стосується бурі, яка назріває в Європі. Будемо сподіватися, що наша оборона витримає натиск тих, хто захоче окупувати державу [DEN.GetNameDef]."
 denmark_expansion_event.210.b:0 "[ROOT.GetNameDefCap] ніколи не підкориться данцям!"
 denmark_expansion_event.211.a:0 "Переговори тривали недовго."
 denmark_expansion_event.211.desc:0 "[FROM.GetNameDefCap] завбачливо погоджується з нашими справедливими претензіями на їхню територію. Це дуже далекоглядно з боку уряду."
 denmark_expansion_event.220.b:0 "[ROOT.GetNameDefCap] ніколи не підкориться данцям!"
 denmark_expansion_event.3.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію про реінтеграцію"
 denmark_expansion_event.302.desc:0 "На жаль, [FROM.GetNameDef] не приймає нашу щедру пропозицію щодо [SWE.GetAdjective]их ресурсів. Може, краще почати переговори з кимось іншим?"
 denmark_expansion_event.500.desc:0 "У спробі проявити солідарність і забезпечити безпеку малим державам Європи держава [FROM.GetNameDef] звернулася до нас із пропозицією вступити в альянс. Чи варто нам об'єднатися з [FROM.GetAdjective]ими друзями? Чи, може, краще діяти самостійно?"
 denmark_fascist_event.1.b:0 "У нас зараз є більш важливі проблеми."
 denmark_occupation_event.101.desc:0 "[FROM.GetLeader] у своїй мудрості погоджується стати нашим союзником і визнає нашу військову міць. Також нам дали дозвіл посилити свою армію. Усе це дасть нам змогу діяти агресивніше в зовнішній політиці та захопити північні країни для нашої [FROM.GetAdjective]ої метрополії."
 denmark_occupation_event.11.desc:0 "Загальнонаціональні протести проти [?DEN.DEN_overlord_nation.GetAdjective]ої окупації добігли кінця. Данський народ показав окупантам, що наше прагнення до свободи анітрохи не ослабло."
 denmark_occupation_event.2.b:0 "Це лише незначна перешкода"
 denmark_occupation_event.3.t:0 "[FROM.GetNameDefCap] приймає нашу капітуляцію"
 denmark_overlord_events.24.a:0 "Розберемося з ними пізніше."
 denmark_overlord_events.31.t:0 "[FROM.GetNameDefCap] відмовляється заборонити фашизм"
 denmark_overlord_events.34.desc:0 "На наш запит про постачання зброї данський уряд відповів відмовою, вкрай непереконливо аргументувавши її необхідністю зберігати свої запаси на випадок, якщо війна дійде до них. Данці також повідомили, що є нейтральною країною і постачання зброї порушить цей статус..."
 denmark_overlord_events.36.t:0 "[FROM.GetNameDefCap] вимагає призовників"
 denmark_overlord_events.5.a:0 "У нас є більш термінові справи..."
 denmark_political_events.2.d:0 "Ми повинні спробувати що-небудь нове"
 denmark_political_events.5.desc:0 "$DEN_communism_party_long$ відчуває розбіжності щодо того, як планувати передвиборчу кампанію. Хтось не хоче загострювати і без того непросту обстановку і стримує свою риторику. Хтось вважає, що, навпаки, потрібно атакувати на повну силу, щоб здобути розгромну перемогу і позбавити зло будь-якого шансу поволі набрати вплив. Хтось переконаний, що потрібно активно нападати на суперників уже потім, щоб не допустити їх до влади."
 denmark_political_events.7.desc:0 "$DEN_fascism_party_long$ відчуває розбіжності щодо того, як планувати передвиборчу кампанію. Хтось не впевнений, що слід загострювати і без того непросту обстановку і стримує свою риторику. Хтось вважає, що для того, щоб реалізувати своє бачення держави [DEN.GetNameDef], потрібно атакувати на повну силу. Хтось переконаний, що лише активно нападаючи на суперників, ми зможемо послабити їхні позиції та посилити свої."
