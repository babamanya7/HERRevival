 ORDER_PROV_TOOLTIP_RESHAPE_INFO:0 "Перемалювання стрілки наступу дає Вам змогу виправити місця, які війська можуть пропустити при просуванні фронту.\nІще так можна §Yвозз'єднати§! стрілку наступу з іншим наказом, щоби змінити їхній порядок. Досить просто перенести §Yконтрольну точку§! на бажаний наказ."
