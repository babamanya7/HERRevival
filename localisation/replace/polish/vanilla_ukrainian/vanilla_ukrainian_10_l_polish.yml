 GER_the_proletarian_legion_desc:0 "Ми повинні взяти на себе відповідальність за повстання, які ми спровокували. Пролетаріат у країнах, охоплених війною, потребує нашої допомоги, щоб якнайшвидше скинути корумповані режими. Ми маємо розглянути можливість відправити війська на їхню підтримку!"
 GER_train_schutztruppe_in_nauru:0 "Мобілізувати Шуцтруппе в Науру"
 GER_uralbomber_program_desc:0 "Перемога буде досягнута тоді, коли ми зможемо дістатися до наших ворогів, де б вони не знаходилися. Розробка літака, здатного долетіти до Уральських гір, зробить майже всякого можливого ворога в межах нашої досяжності."
