 news.10.b:0 "Бессарабія за правом наша."
 news.124.d:0 "Маніла, столиця Філіппін, була взята японцями після відступу американських військ та філіппінських сил опору. За доступ у стратегічну гавань Маніла-Бей якийсь час після падіння міста ще йшли бої з боку острова Коррехідор, де американці зосередили основну масу своєї артилерії, але невдовзі японці змусили ці знаряддя замовкнути.\n\nПісля падіння Маніли варто чекати стрімкого захоплення решти Філіппін. Це хвороблива поразка для США в Азії та на Тихому океані."
 news.128.d:0 "Захоплення німецької столиці було підтверджено джерелами у Вашинґтоні після того, як американські війська прорвалися до Берліна з різних напрямків. У місті йшли запеклі бої, міст Мольтке було знищено німецькими саперами у відчайдушній спробі сповільнити наступ американців.\n\nІнші мости через Шпрее підірвати не вдалося, і ударні війська США, придушивши спротив, захопили будівлю Кролль-опери та Райхстаґ. Тепер зірково-смугастий прапор переможно майорить над Райхстаґом, бої у місті припинилися. Битву за Берлін закінчено."
 news.132.d:0 "Союзні війська остаточно захопили Рим, коли здався гарнізон, який обороняв місто. Більшість історичних пам'яток не постраждали, переживши черговий катаклізм, яких вони вже бачили чимало. Американські війська принаймні досі не заходили до Ватикану на прохання Святого Престолу.\n\nПадіння Рима стало важливою віхою в італійській кампанії, і багато хто вважає, що тепер організованому опору на півострові настане кінець."
 news.133.d:0 "Французькі війська ввійшли до Рима, щойно залишки гарнізону, що обороняв місто, розчинилися на околицях. Французи стрімко висунулися і зайняли основні адміністративні будівлі, і на Віа дель Корсо відбувся парад перемоги, в якому брало участь безліч солдатів та військової техніки.\n\nНавряд чи після здачі Рима Італія зможе продовжувати опір. Зовнішні спостерігачі припускають, що італійський уряд, який втік зі столиці, незабаром розпочне переговори про капітуляцію."
 news.134.t:0 "Звільнення Парижу"
 news.139.a:0 "Чи це початок кінця..?"
 news.156.a:0 "Кінець уже близько... для наших ворогів."
 news.156.t:0 "Помічена Комета"
 news.159.d_01:0 "[From.GetLeader] повідомив сьогодні, що [From.GetName] бажає укласти новий союз. [From.GetFactionName] заявляє про свою готовність до співпраці у разі війни.\n\nХоча великі коаліції можуть стримувати агресію, ми бачили, до яких наслідків це призводить, коли конфлікт таки виникає. Наміри держав, які створили новий альянс, поки що неочевидні, але ніхто, навіть його засновники, не може передбачити, яким цілям він слугуватиме в підсумку."
 news.186.t:0 "Італія претендує на грецькі території"
 news.192.b:0 "Вони порушують і без того крихкий баланс сил у регіоні."
 news.193.a:0 "Нехай міцнішає дружба наших народів!"
 news.193.t:0 "Міністерство закордонних справ Італії в державі [YUG.GetName]"
 news.198.a:0 "Тоді час для розмов закінчився."
 news.202.b:0 "Співпраця зробить нас сильнішими, ніж конфлікт."
 news.206.d_communist:0 "Після поширення робітничої революції на Сполучені Штати, їхня риторика проти старого порядку стала набагато агресивнішою. Тепер [USA.GetLeader] ставить під сумнів статус Канади як підвладної держави Британської імперії, в той час як американські дипломати відстоюють світ, вільний від аристократії та панування в усьому світі.\n\nНезважаючи на узи, що пов'язують їх разом, напруженість між [USA.GetNameDef] та колоніальною імперією [ENG.GetNameDef] зростає. Це лише питання часу, коли цей дипломатичний конфлікт переросте в ескалацію і революцію в [ENG.GetNameDef] буде здійснено силою."
 news.212.t:0 "Японські дипломати в Берліні"
 news.213.b:0 "Їм доведеться доводити свої слова сталлю."
 news.221.t:0 "Троцький повертається до держави [SOV.GetNameDef]"
 news.222.e:0 "Такі дії порушать баланс у Європі."
 news.223.f:0 "Чи справді вони наважаться на втручання?"
 news.224.d:0 "Враховуючи традицію британського впливу в Середземномор'ї, що проєктується з Ґібралтару, не дивно, що [ENG.GetAdjective]ий уряд вирішив чинити політичний тиск на фашистський уряд держави [Spain.GetNameDef].\n\nДля держави [ENG.GetNameDef], яка все ще відновлюється після громадянської війни, підтримка держави [ENG.GetNameDef] набагато важливіша, ніж політичні принципи."
 news.225.a:0 "Їхня дипломатична місія може бути корисною для нас."
 news.23.t:0 "Зоґу протестує"
 news.233.a:0 "Це не обіцяє нічого хорошого."
 news.25.t:0 "Ремілітаризація Райнланду"
 news.283.t:0 "Індійський Національний Конгрес перемагає на провінційних виборах"
 news.295.desc:0 "Після об'єднання Австрії та Угорщини угорський уряд зібрав у Будапешті міжнародну пресу і оголосив про відновлення Австро-Угорської імперії.\n\nКороль Отто прийняв свій законний титул імператора Австрії і підтвердив свою клятву, що, хоча імперія поки що є лише тінню своєї колишньої сутності, він не заспокоїться доти, доки всі землі Габсбурґів не будуть возз'єднані. Їхні сусіди, безсумнівно, підозріло спостерігають за подіями в Будапешті."
 news.296.desc:0 "Шукаючи короля для своєї нації, угорці, після довгих переговорів і підготовки, на початку цього тижня офіційно запросили шведського принца Вільгельма, герцога Сьодерманландського. Сьогодні, під звуки фанфар і урочистостей, він був коронований королем Угорщини на урочистій церемонії в Королівському палаці в Будапешті.\n\nКажуть, що новий король приймає добробут свого народу близько до серця, і що він рішуче підтримує його демократичні права. Крім того, він виступає за діалог із сусідами Угорщини замість ворожнечі. Таким чином, новий король може стати довгоочікуваною допомогою у зменшенні напруженості в регіоні."
 news.311.desc.a:0 "Між Німеччиною та Угорщиною розгорілася дипломатична криза щодо долі Словаччини. [HUN.GetLeader] раніше заявляв, що Словаччина є основним інтересом [HUN.GetNameDef] через її історичні зв'язки з Угорщиною. Його уряд очікував, що з ним будуть консультуватися щодо будь-яких заходів стосовно Словаччини.\n\nНімецький лідер [GER.GetLeader] відмовився прийняти будь-які подібні вимоги, назвавши їх «нерозумним і небезпечним втручанням у внутрішні справи суверенної держави».\n\nНа тлі зростання напруженості все більше спостерігачів задаються питанням, чи може Угорщина вдатися до насильства, щоб поставити крапку в цьому питанні."
 news.323.b:0 "Кумедно."
 news.327.a:0 "Усі південні слов'яни єдині!"
 news.328.a:0 "Лише в нашій країні вони будуть у безпеці."
 news.329.t:0 "Югославія визнає державу [SOV.GetNameDef]"
 news.33.a:0 "Цілком логічно!"
 news.336.desc:0 "[MEX.GetAdjective]і війська знову окупували Техас після ста років відсутності. [USA.GetAdjective]і війська повністю очистили головні міста Техасу, включаючи Сан-Антоніо і його знамениту пам'ятку — Аламо. Хоча в історичному місці не відбулося жодних боїв, [MEX.GetLeader] об'їхав приміщення католицької місії, провівши мітинги та промови, що заохочували війська продовжувати боротьбу за остаточну перемогу над ненависними «янкі»."
 news.34.c:0 "Спротив продовжується!"
 news.350.desc:0 "\n\nПрислухаючися до волі [ROOT.GetAdjective]ого народу, [ROOT.GetLeader] зумів мирно об'єднати [ROOT.GetAdjective]ий [ROOT.GetRulingIdeology]. Поки що невідомо, який вплив це матиме на світ в цілому, але принаймні в місті [ROOT.Capital.GetCapitalVictoryPointName] люди святкували цю історичну подію."
 news.40.a:0 "Це було неочікувано."
 news.47.d:0 "Дирижабль «Гінденбурґ» сьогодні зазнав драматичного кінця, вибухнувши над Шотландією.\nСхоже, він був захоплений заступником фюрера Рудольфом Гессом, якому вдалося самостійно пролетіти Північне море з особистою місією: домовитися про мир з Великою Британією.\nБританські радіолокаційні станції без проблем виявили масивний об'єкт, і кілька крил Королівських ВПС були негайно відіслані до його позиції. Коли «Гінденбурґ» не відповів по радіо, вони відкрили вогонь.\n\nОстанки Гесса були знайдені в уламках."
 news.57.b:0 "Дурні!"
 news.60.c:0 "Це не те, про що ми домовилялися!"
 news.67.d:0 "Дванадцяті Олімпійські ігри нещодавно відбулися в Токіо. У світлі напруженості у світі багато хто побоювався скасування Ігор, але цього не сталося.\n\nТокіо стало першим неєвропейським містом, яке прийняло в себе Олімпіаду, і спеціально створений літак великої дальності Ме 261 без дозаправки доставив з Німеччини олімпійський вогонь.\n\nЯпонські спортсмени показали непогані результати і завоювали 14 золотих медалей, зайнявши третє місце в командному заліку після Німеччини та США."
 news.69.a:0 "Вони схаменулися."
 noone_supporting_monroe:0 ""
 nsb_news.10.desc_communist_opposition:0 "Капітуляція останніх військ, які очолював [SOS.GetLeader], означає, що [GetSovietCivilWarName] закінчилася. [SOV.GetLeader] оголошує про свою перемогу і обіцяє відновити державу [SOV.GetNameDef] з попелу громадянської війни та руйнування. Роботи попереду багато, і глобальна ситуація не цілком зрозуміла, але [SOV.GetLeader.GetSheHe] не сумнівається, що для держави [SOV.GetNameDef] і світу в цілому настала нова епоха. Покищо невідомо, чи зможе [SOV.GetLeader.GetSheHe] підтвердити свої твердження."
 nsb_news.101.desc:0 "Старий більшовик Лев Троцький сьогодні був атакований у себе вдома групою озброєних грабіжників. Нападники увірвалися до нього в кімнату і відкрили безладний вогонь, після чого поспішно втекли. Троцький не отримав ні подряпини, встигнувши сховатися з дружиною і в за ліжком.\n\nТроцький колись виступав соратником і можливим спадкоємцем Леніна, але після безуспішної боротьби за владу $SOV_iosif_stalin$ видворив його з Радянського Союзу. В зверненні до преси Троцький оголосив, що цей замах став «ще однією жалюгідною спробою Сталіна свого режиму»."
 nsb_news.2.f:0 "Ще один безглуздий прояв імперіалізму."
