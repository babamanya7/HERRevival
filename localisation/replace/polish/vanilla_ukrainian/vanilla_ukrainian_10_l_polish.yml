 ETH_freedom_at_gunpoint_dynamic_tt:0 "Отримає ціль війни §YЗвільнення§! проти держави §Y[FROM.Capital.OWNER.GetName]§!"
 ETH_hold_the_south_mission:0 "Утримати південь"
 ETH_improve_the_administration_desc:0 "В освітньому закладі залишається велика корупція. Це неприйнятно в установах, які нібито пишаються меритократією. Ми повинні безжально викорінити цю корупцію в наших школах та університетах."
 ETH_infrastructure_projects_tt:0 "Змінити §Y$ETH_state_development_dynamic_modifier$§! на:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!"
 ETH_invite_italian_investors_desc:0 "Ми повинні використовувати наших нових володарів, спонукаючи їхніх інвесторів відвідати [ETH.GetName]. Приплив інвестицій значною мірою сприяв би не лише відновленню збитків, завданих війною, але й значному розширенню наших промислових потужностей."
 ETH_italian_control_mission:0 "[ITA.GetName] інтегровує область [?ITA.state_integrated.GetName]"
 ETH_japanese_infrastructure_investments_decision_desc:0 "Японські інвестори шукають нові інвестиційні можливості в Африці. [FROM.GetName] може стати ідеальним місцем для фінансованого японцями розвитку інфраструктури."
