 HABSBURG_an_imperium_restored:0 "Відновлена Імперія"
 HABSBURG_increase_scientific_cooperation_desc:0 "Настав час спільно фінансувати нові лабораторії та секретні дослідницькі центри, де наші вчені зможуть тісніше співпрацювати, підвищуючи швидкість своїх досліджень і відкриваючи нам нові горизонти."
 HABSBURG_is_subject_puppeteer_faction_leader_or_member_trigger_tt:0 "Або є державою §Y[AUS.GetNameDef]§!, або §Y[HUN.GetNameDef]§! і має під контролем будь-який §Yпост-Австро-Угорський регіон§! в якості маріонетки, є маріонеткою Австрії чи Угорщини, очолює альянс як §Y[AUS.GetNameDef]§! або §Y[HUN.GetNameDef]§!, або в альянсі з кимось із них в якості будь-якого §Yпост-Австро-Угорського регіону§!."
 HABSBURG_reform_gemeinsame_armee_desc:0 "У минулому Австро-Угорська імперія запровадила велику, єдину армію, бачачи, що всі країни роблять внесок у нашу спільну справу. Незважаючи на наші нинішні ідеологічні відмінності та подібності, спільні військові зусилля зроблять нас тільки сильнішими."
