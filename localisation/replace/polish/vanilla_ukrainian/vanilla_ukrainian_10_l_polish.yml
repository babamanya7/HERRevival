 CHL_ibanezs_coup_desc:0 "Колишній президент і генерал Карлос Ібаньєс дель Кампо прагне повернути собі втрачене президентське крісло і готовий піти на тіньові оборудки, якщо це буде необхідно, задля досягнення цієї мети. Тому він готовий підтримати спільний переворот консерваторів і фашистів, якщо вони пообіцяють йому керівництво країною."
