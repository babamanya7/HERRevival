 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_REQUEST_FOREIGN_MANPOWER:0 "Держава $COUNTRY|UY$ §Gзгодилася§! з нашим проханням про підтримку гарнізону.\n\nВона виділила нам $MANPOWER|H*$ од."
