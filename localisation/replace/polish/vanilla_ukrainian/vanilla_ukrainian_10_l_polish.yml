 CZE_set_up_polish_puppet_state_desc:0 "Оскільки [GER.GetNameDef] зацікавлена у створенні маріонеткової держави в Польщі, очевидно, що нам варто розглянути таку саму можливість."
 CZE_skoda_naval_yards_desc:0 "Тепер, коли ми знову маємо доступ до моря, ми можемо відновити стару військово-морську промисловість Австро-Угорської імперії, використовуючи існуючий досвід, який досі є в межах наших кордонів. Запуск вітчизняних верфей має стати нашим головним пріоритетом."
