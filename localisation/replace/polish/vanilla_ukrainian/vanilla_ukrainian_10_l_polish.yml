 GATHERING_STORM_DESC:0 "Настають темні часи. В Європі Гітлер зміцнив свою владу і дедалі більшу увагу приділяє землям за кордонами Німеччини. Італія під контролем Муссоліні продовжує брати участь у сміливих військових авантюрах, а в Азії Японська імперія готується до атаки на Китай. Майже двадцять років пройшло з закінчення Великої війни, і світ знову наче облитий бензином. Єдина іскра може все спалити."
