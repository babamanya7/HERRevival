 DEN_imperial_democratic_DEF:0 "Республіка Балтійського моря"
 DEN_imperial_neutrality_DEF:0 "Домініон Балтійського моря"
 DEN_import_machinery_and_material_desc:0 "Якщо ми сподіваємося конкурувати з індустріальною міццю наших сусідів, ми повинні підходити до цього з розумом. Імпорт сучасних інструментів і матеріалів з більш індустріально розвинених країн сприятиме зміцненню наших власних можливостей і їх подальшому розвитку."
 DEN_institute_corporatism:0 "Інституційний корпоративізм"
 DEN_joint_military_drills_desc:0 "Зберігаючи нейтралітет з 1864 року, данські війська вже давно не бачили справжніх бойових дій. Якщо ми наблизимося до нашого нового союзника, ми могли б багато чому навчитися у нього, а спільні військові навчання допоможуть обом країнам отримати досвід одна від одної."
 DEN_loses_one_offmap_civ_tt:0 "§g(§![DEN.GetFlag][DEN.GetNameDefCap]§g)§! Буде видалено §R1§! §Yцивільний завод§! поза мапою."
