 SHX_peng_yubin:0 "Peng Yubin"
 SIA_asian_democratic_compact_desc:0 "Азія не може вічно покладатися на віддалені імперії чи обіцянки великих держав. Демократичні країни регіону повинні об'єднатися, захищати одне одного і довести, що незалежність і свобода можуть вижити в Азії."
 SIA_census_the_hill_tribes:0 "Перепис гірських племен"
 SIA_defenders_of_constitutional_liberty_desc:0 "Вчителі, банкіри, медсестри — освічені середні верстви суспільства можуть бути згуртовані та мобілізовані на захист свободи, якщо військове крило зайде занадто далеко."
 SIA_direct_army_fundings_towards_the_navy:0 "Спрямувати фінансування армії на флот"
 SIA_direk_jayanama:0 "Дірек Джаянама"
 SIA_empower_the_coastguard_desc:0 "Флот не може бути скрізь одночасно, і багато завдань прибережної безпеки краще виконувати більш легким службам. Посилена берегова охорона захистить наше рибальство, патрулюватиме наші береги і звільнить флот для протидії серйознішим загрозам."
 SIA_end_factionalism_mission_desc:0 "Обидва крила Кхана Ратсадон повністю підтримують уряд. Якщо ми зможемо утримати їх обох на рівні §GПовна підтримка§! протягом §Y270§! днів, суперництво між ними можна буде припинити назавжди. Якщо ж ентузіазм хоча б одного крила похитнеться, зусилля доведеться починати заново."
 SIA_fighter_equipment_2:0 "Tachikawa Ki-55"
 SIA_how_quickly_the_tables_turn:0 "Як швидко все змінюється"
 SIA_implement_industrialists_reforms_countdown:0 "Впровадження реформ промисловців"
 SIA_industrialization_drive_desc:0 "Протягом поколінь багатство [ROOT.GetName] спиралося на рисові поля та сільські поселення. Проте сучасний світ формується не плугом, а фабрикою та машиною. Якщо ми хочемо зберегти нашу незалежність серед великих держав, ми повинні перетворити наше аграрне королівство на індустріальну націю."
 SIA_join_the_united_front_desc:0 "Китай стікає кров'ю під [JAP.GetAdjective] агресією, але він все ще бореться. Приєднавшись до Об'єднаного фронту, [SIA.GetName] може допомогти перетворити війну на суші у кладовище для імперських амбіцій."
 SIA_leader_of_the_1932_revolution:0 "Лідер революції 1932 року"
 SIA_limited_war_cat_desc:0 "Ми не можемо сподіватися перемогти великі держави регіону у відкритій війні — поки що. Висуваючи наші претензії крок за кроком, за допомогою ретельно спланованих кампаній, ми підточуємо їхні позиції, тоді як наша власна сила продовжує зростати."
 SIA_maintain_resource_independence:0 "Збереження ресурсної незалежності"
 SIA_military_wing_history_tt:0 "У військовій фракції Кхана Ратсадон домінують армійські офіцери, які вважають себе справжніми вартовими революції. Їхня найамбітніша фігура — §YПлек Пібунсонгкрам§!, полковник, чиє захоплення націоналістичними рухами Європи зростає з кожним роком.\n\nВійськове крило виступає §Gза переозброєння§! і тяжіє до сильної, централізованої держави. Вони з підозрою ставляться до економічних ідей Пріді, які вважають небезпечно радикальними, і не терплять втручання цивільних в оборонні питання. Їхню лояльність найлегше забезпечити шляхом військових інвестицій та політики, що демонструє національну міць."
 SIA_nav_bomber_equipment_1:0 "Douglas TBD Devastator"
 SIA_prajadhipok_audience_with_churchill:0 "Зустріч короля з прем'єром"
 SIA_prayoon_yuthasastrkosol:0 "Праюн Ютхасастркосол"
 SIA_printing_money_monthly_increase_increase:0 "Щомісячне збільшення $MODIFIER_CONSUMER_GOODS_FACTOR$ збільшиться на $VALUE|Y=%1$"
 SIA_public_credit_repayment:0 "Погашення державного кредиту"
 SIA_puey_ungpakorn:0 "Пуей Унгпакорн"
