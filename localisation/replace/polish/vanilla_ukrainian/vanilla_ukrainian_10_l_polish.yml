 LIT_free_voldemares:0 "Звільнити Вольдемараса"
 LIT_ignite_civil_war_in_POL_desc:0 "Підготовка зроблена. Польща незабаром стане полем битви не лише ідей, а й доблесті та слави. Ми зробили все можливе, щоб підтримати фалангістів у Польщі, все, що нам зараз потрібно зробити, це кинути жерль і сподіватися, що Бог справді на їхньому боці."
