 ITA_cv_nav_bomber_equipment_3:0 "Savoia-Marchetti SM.89-II"
 ITA_economic_reforms_desc:0 "За старого режиму економіка значною мірою перебувала в стагнації, але з оновленою Фашистською націоналістичною партією ми більш ніж готові вирішити цю важливу задачу! Тепер ми можемо вільно призначати компетентних людей, які мають кваліфікацію, необхідну для пожвавлення економіки."
 ITA_expand_rome_flying_school:0 "Розширити льотну школу в Римі"
