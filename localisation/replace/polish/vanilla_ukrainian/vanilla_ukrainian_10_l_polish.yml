 GER_proletarian_legion_ns:0 "Пролетарський легіон"
 GER_proletarian_legion_ns_desc:0 "Багато [ROOT.GetAdjective]их громадян прагнуть пригод і хочуть боротися за справедливу справу. З цією метою ми створили легіон добровольців, які вирушать допомагати нашим пролетарським братам у їхніх війнах."
