 army_support_for_fascist_civil_war_desc:0 "Без достатньої підтримки військових будь-яка надія на перемогу у збройній ідеологічній боротьбі була б марною. Ми мусимо забезпечити лояльність добре розміщених підрозділів наших військових сил."
 artillery_equipment_desc:0 "Артилерія відноситься до зброї великого калібру, такої як гармати та гаубиці, якими керують екіпажі, які можуть викидати боєприпаси далеко за межі ефективної дальності особистої зброї."
