 GRE_hold_national_showcase_for_investors_fra:0 "Провести національну виставку для [FROM.GetAdjective]их інвесторів"
 GRE_horror_and_fear_desc:0 "Деймос ке Фобос — жах і страх. Так звали синів Ареса, бога війни. Спартанці проливали кров на полі бою на честь синів Ареса, борючись на самоті, — так і ми проллємо в бою кров на честь нашого славного минулого."
