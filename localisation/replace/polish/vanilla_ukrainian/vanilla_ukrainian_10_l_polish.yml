 GER_inflexible_communist_organizer_leader:0 "Непохитний комуністичний організатор"
 GER_influence_the_middle_east_desc:0 "Хоча історично ми маємо мало спільного з Близьким Сходом, ніхто не може заперечувати, що цей регіон становить для нас інтерес. Нам слід поширити свій вплив у цьому регіоні, щоб отримати певну дипломатичну вагу в регіоні, якщо вона знадобиться."
 GER_inner_circle_industrial_me_focuses_tt:0 "Завершення цього фокусу §Rзаблокує§! §Y$FOCUS_1$§! і §Y$FOCUS_2$§! для їх відповідних радників §YВнутрішнього кола§!."
 GER_install_franz_anton_bach_in_hungary_tt:0 "§YФранц Антон Бах§! стане лідером [HUN.GetAdjective]ого уряду"
 GER_integrate_czechoslovakia_desc:0 "Що більше ми дізнаємося про те, як працює [CZE.GetNameDef], то більше стає зрозумілим, що люди прагнуть змін. Інтеграція в державу [GER.GetNameDef] забезпечила б ці необхідні зміни. Нам слід відправити делегацію з ультиматумом."
 GER_integrate_subjects_economies:0 "Інтегрувати економіки суб'єктів"
 GER_kdf_wagen:0 "[Root.GetKdfWagenName]"
