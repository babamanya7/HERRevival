 CZE_militias_officer_random_general_tt:0 "§YОдин§! випадково вибраний командувач армії отримає рису §YОфіцер ополчення§!:\n-Захист ополчення: §G+5%§!\n-Швидкість ополчення: §G+5%§!\n-Організація ополчення: §G+5%§!"
 CZE_neutralize_the_hungarian_threat:0 "Нейтралізувати [HUN.GetAdjective]у загрозу"
 CZE_pro_rearmament_propaganda_desc:0 "Щоб підвищити підтримку більш централізованого уряду, ми повинні підкреслити нинішню крихку ситуацію в навколишньому світі. Це також допоможе мотивувати населення підтримати плани посилення армії, коли це буде необхідно."
