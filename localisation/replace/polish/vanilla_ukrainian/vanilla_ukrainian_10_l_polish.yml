 CHL_offer_to_protect_pitcairn_desc:0 "Поточна оборона області [270.GetName] слабша, ніж ми сподівалися, і відкриває можливість для наших ворогів захопити і використати його як плацдарм для вторгнення на острів Пасхи і, зрештою, навіть вглиб нашої країни. Ми мусимо запропонувати взяти на себе захист острова, заради нашої власної безпеки."
