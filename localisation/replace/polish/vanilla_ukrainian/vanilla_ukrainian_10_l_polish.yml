 tfv_new_zealand.3.a:0 "Мабуть, це вони помиляються?"
 tfv_raj.212.a:0 "Це виходить із-під контролю."
 tfv_raj.33.t:0 "[SOV.GetNameDefCap] відмовляється допомагати"
 tfv_raj.34.a:0 "Тріумф!"
 tfv_raj.41.b:0 "Ми вже раніше грали у «велику гру» в Індії. Побачимо, як добре її зіграють німці."
 tfv_south_africa.1.c:0 "Колонії мусять захищатися самі."
 tfv_south_africa.10.desc:0 "Велика війна за майбутнє нашої країни нарешті розпочалася. Тепер ми повинні забезпечити кожну крихту підтримки, яку ми можемо отримати, щоб гарантувати нашу перемогу в цій боротьбі. На кону виживання [From.GetAdjective]ої культури та нашого спосому життя!"
 tfv_south_africa.12.t:0 "[From.GetNameDefCap] благає нас про допомогу"
 tfv_south_africa.62.t:0 "Свобода для Конґо"
 tfv_south_africa.64.d:0 "Звільнившися з-під влади колоніальних гнобителів, [KEN.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [KEN.GetAdjective]ого уряду."
