 south_american_events.15.b:0 "Знищте їх!"
 south_american_events.2.t:0 "Спеціалізація Національного відділу важкого озброєння"
 south_american_news.1.c:0 "¡No pasarán!"
 south_american_news.2.t:0 "Новий президент Уругваю"
 south_american_news.5.d:0 "Вперше після війни за конфедерацію, коли об'єднана Перуано-болівійська держава розпалася і, як вважалося, більше ніколи не існувала, вона повернулася. Дехто стверджує, що це лише фасад, який приховує імперіалістичні амбіції справжнього правителя, але багато хто сподівається, що конфедерація зможе об'єднати людей так, як вони ніколи не були об'єднані раніше. Однак, безсумнівним є те, що союз залишиться тут назавжди."
 south_american_news.6.t:0 "Об'єднання Еспаньйоли"
 south_american_news.9.d:0 "Президент Парагваю Еусебіо Аяла оголосив, що він і республіканська гвардія на чолі з його правою рукою Хосе Феліксом Естігаррібією успішно придушили повстання та спробу державного перевороту, здійснені військовими офіцерами на підтримку революційних фебреристів і їхнього лідера, генерала Рафаеля Франко. Однак зараз країна перебуває у ще гіршому стані, ніж кілька місяців тому, коли закінчилася Чакська війна. І, схоже, вона ще дуже далека від того, щоб знову стати колишньою."
 soviet.14.b:0 "Ні, ми ще не досягли повного потенціалу!"
 soviet.24.t:0 "П'ята колона"
 soviet.25.a:0 "Дружина Калініна — підозрювана. Йому теж не можна довіряти."
 soviet.35.d:0 "Нещодавні політичні потрясіння в державі [From.GetName] залишили їхній уряд із сильним баченням майбутнього, яке збігається з нашим. Вони побачили, що могутній Радянський Союз може зробити для світу, і готові віддати все заради Вітчизни."
 soviet.35.t:0 "[From.GetNameDefCap] прагне приєднатися до складу [SOV.GetNameDef]"
 soviet.52.t:0 "Переворот виживших"
 soviet.54.a:0 "Нова епоха для російської політики."
 sp_air_bouncing_bomb_backspin_mechanism_reward_desc:0 "Наші вчені винайшли дотепне рішення для стабілізації бомби після скидання. Механізм надає їй зворотного обертання, що утримує її на траєкторії до цілі."
 sp_air_bouncing_bomb_type_of_explosives_reward_desc:0 "Використовуючи торпекс замість тротилу, ми можемо суттєво зменшити розмір бомби без втрати її руйнівної сили."
 sp_air_centimetric_radar_desc:0 "Розробка сантиметрових радарів дозволить виявляти набагато менші цілі та застосовувати набагато менші антени."
 sp_air_earthshaker_bomb_completion_tt:0 "Відмикає §Y$raid_type_mega_gun_emplacement_strike$§!."
