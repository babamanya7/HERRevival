 improved_airplane_launcher_desc:0 "Поліпшений пневматичний пристрій дозволяє запускати з катапульти важчі літаки, що підвищує радіус пошуку.\n\nУстановка цього модуля на §Yкрейсери§!, §Yважкі кораблі§! та спеціалізовані §Yпідводні човни§! поліпшить здатність виявлення ворожих кораблів."
