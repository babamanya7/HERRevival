 MEX_focus_antidisestablishmentarianism_desc:0 "«Революційна» хунта вже десятиліттями зловживає Правдивою Вірою. Церкви, монастирі та святині формально належать державі, а священнослужителям потрібні ліцензії від уряду, щоби доглядати за своєю паствою. Деякі штати мають одного священика на десятки тисяч вірних. Давайте відмовимося від цієї вимоги і знову дозволимо Церкві мати власність."
 MEX_focus_bolivarian_alliance_desc:0 "Сімон Болівар привів іспанські колонії в Південній Америці до незалежності, створивши Велику Колумбію. На Півдні до нього ставляться так само, як до борців за незалежність, таких як Мігель Ідальго та Маріано Матаморос у Мексиці. Однією з його мрій було об'єднання латиноамериканських націй проти експлуатації з боку європейських імперіалістів і янкі. Ми можемо здійснити цю мрію."
