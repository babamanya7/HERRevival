 idea_SIA_an_absolute_monarchy_desc:0 "Вся політична влада зосереджена в руках корони. Слово короля — закон, інакомислення придушується, а вся вага королівського престижу спрямована на національну мобілізацію. Трон вимагає вірності, а армія є його інструментом."
