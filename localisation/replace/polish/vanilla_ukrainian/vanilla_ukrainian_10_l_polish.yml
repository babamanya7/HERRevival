 SPR_collective_recovery_efforts_desc:0 "Іспанська громада в цілому повинна бути згуртована в одній великій кампанії, щоби відновити шкоду, завдану нашою насильницькою громадянською війною. Наші заводи мають бути відбудовані, щоб люди могли повернутися до роботи, і має бути побудована нова інфраструктура для сприяння взаємодії між місцевими громадами."
