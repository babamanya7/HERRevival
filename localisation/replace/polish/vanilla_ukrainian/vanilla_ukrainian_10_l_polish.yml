 IRQ_allied_training_desc:0 "Наші союзники готові поділитися частиною досвіду, який вони здобули за останні роки конфлікту з нашими ворогами. Ми приймемо цю допомогу, щоб якнайкраще підготувати наші війська до фронтової служби."
