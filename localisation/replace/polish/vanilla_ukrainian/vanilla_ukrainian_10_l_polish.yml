l_polish:
 30_days_tt:0 "На впровадження піде §Y30 днів§!.\n"
 AAT_Sweden.13.desc:0 "Шведський уряд попросив контроль над територією навколо Нарвіка. Вони стверджують, що це суто гуманітарна вимога, яка випливає з бажання захистити норвезьке населення від триваючого конфлікту. Як гарантію безпеки вони запропонували зберегти зону демілітаризованою, і вони будуть здійснювати будь-яку необхідну поліційну діяльність до кінця конфлікту.\nНорвезьке населення, ймовірно, було би щасливішим під шведською окупаційною зоною, що звільнило би більше ресурсів для наших військ на фронті."
 AAT_Sweden.15.b:0 "Ми не можемо залишити державу [NOR.GetName] наодинці."
 AAT_Sweden.23.b:0 "Ми були б раді, якби вони долучилися до нас."
 AAT_Sweden.24.a:0 "Дуже прикро."
 AAT_Sweden.34.a_tt:0 "§RЦе призведе до того, що [FROM.GetName] зможе зробити нас маріонеткою.§!"
 AAT_Sweden.4.desc:0 "Дебати в Ріксдазі сьогодні стали гарячими, коли суперечка про те, хто мусить посісти місце прем'єр-міністра, переросла в особисті випади. Під час дебатів Карл Сьоблом вилаяв Ґленна Вернера, заявивши, що «єдине, на що ти здатен — це вигулювати собаку». Представник Ґленна пояснив, що в того ніколи не було собаки."
 AAT_Sweden.44.a:0 "Як і було сплановано."
 AAT_Sweden.49.a:0 "Коли дипломатія не працює..."
 AAT_Sweden.50.a_tt:0 "§RЦе призведе до того, що [SWE.GetName] зможе зробити нас маріонеткою.§!"
 AAT_Sweden.53.a:0 "Ніколи! До зброї!"
 AAT_Sweden_ball_bearing.4.b:0 "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_ball_bearing.5.desc:0 "$AAT_Sweden.25.desc$\nЗараз нам потрібно зосередитися на тому, в якому типі технологій ми хочемо мати більше розуміння, щоб вирівняти різницю між нами та іншими великими державами."
 AAT_Sweden_flashpoints.12.b:0 "$AAT_Sweden_flashpoints.11.b$"
 AAT_Sweden_flashpoints.30.b:0 "Нам не потрібна [SWE.GetAdjective]а інфраструктура."
 AAT_Sweden_flashpoints.35.a:0 "$AAT_Sweden_flashpoints.31.a$"
 AAT_Sweden_flashpoints.51.t:0 "Обурення рішенням про інтернування"
 AAT_Sweden_flashpoints.56.desc:0 "Після того, як низка високопоставлених офіцерів армії приєдналася до комуністичних революціонерів, довіра до будь-якої гілки влади, окрім військово-морських сил, перебуває на рекордно низькому рівні. Оскільки нещодавні події поставили під загрозу безпеку короля, пропонуються радикальні заходи для забезпечення його виживання. Адміралтейство запропонувало зухвалий план відновлення контролю над ситуацією шляхом переміщення короля на острів Ґотланд і створення військової адміністрації з лояльних до нього людей для більш ефективного управління країною у відносній безпеці."
 AAT_Sweden_flashpoints.60.a:0 "Тоді ми також арештуємо [SWE.GetAdjective]і активи в державі [THIS.GetNameDef]."
 AAT_Sweden_flashpoints.60.b:0 "Landsverk однаково віджив своє."
 AAT_Sweden_flashpoints.74.a:0 "Вони не мали вибору."
 AAT_Sweden_nationalists.23.a:0 "Чудова ідея"
 AAT_Sweden_nationalists.25.a:0 "Схоже, ми одні."
 AAT_Sweden_nationalists.30.desc:0 "[GER.GetAdjectiveCap]а маріонеткова держава, [SWE.GetName], звернулася до Адольфа Гітлера з проханням визнати їхні претензії на нашу землю. Це безпідставна вимога, яка лише слугує нестримному експансіонізму обох сторін."
 AAT_Sweden_strike.1.t:0 "Заворушення в [?SWE.GetNameDef]"
 AAT_USA_events.04.a:0 "Не те щоб ми могли кинути їм виклик."
 AAT_USA_events.07.a:0 "Ґренландія повертається!"
 AAT_finland_continuation_war.01.t:0 "[FROM.GetAdjective]ий уряд пропонує свої заходи для війни з радянцями"
 AAT_finland_continuation_war.02.a:0 "Простежте, щоб про цю угоду навіть записів не було!"
 AAT_finland_diplomacy.02.a:0 "Разом ми сильніші!"
 AAT_finland_diplomacy.06.a:0 "[FROM.GetLeader] отримує підтримку народу за своє рішення"
 AAT_finland_diplomacy.11.a:0 "Ми віддамо [ROOT.GetAdjective]у територію заради благородної мети."
 AAT_finland_diplomacy.15.a:0 "Розумний вибір"
 AAT_finland_misc_events.04.desc:0 "Після успіху перших раундів переговорів із державою [?FIN_faction_leader_recieving_resource_rights.GetNameDef] у нас виникли розбіжності в одному з ключових питань: що отримає натомість інша сторона? Держава [?FIN_faction_leader_recieving_resource_rights.GetNameDef] зацікавлена в низці підприємств на території нашої країни, нам потрібно внести відповідну пропозицію... Ми могли б запропонувати частку у видобутку шахти Макола в Оулу, надати нікель із шахт Петсамо, перенаправити частину сировини, що йде на верфі Турку, або видати права на геологорозвідку в Лаппі."
 AAT_finland_political.06.desc:0 "З деяким здивуванням уряд отримав лист про відставку. У ньому [ROOT.GetLeader] посилається на стан здоров'я. Здоров'я лідера країни, однак же, здавалося чудовим, там що дехто підозрює інші мотиви.\n\nНещодавно вибухнув політичний скандал: було виявлено особистий лист президента, адресат якого — [GER.GetLeader]. У ньому президент просить надати військову допомогу в боротьбі з нашими ворогами, реальними та можливими.\n\nНе дивно, що деякі націоналістично налаштовані члени кабінету засудили таку очевидну атаку на наш нейтралітет і, судячи з усього, змусили президента подати у відставку."
 AAT_nordic_cooperation.1.desc:0 "Знову і знову ми знаходимо докази того, що наші військові зусилля проти держави [?global.NORDIC_country_to_defend.GetNameDef] гальмуються прихованою підтримкою держави [FROM.GetName].\n\nМожливо, настав час дати їм урок, як вести війну по-справжньому."
 AAT_nordic_shared.1.b:0 "Це звучить надто небезпечно. Нам ліпше триматися подалі."
 AAT_nordic_shared.3.t:0 "[FROM.GetName] буде на нашому боці!"
 AAT_norway_communist.2.a:0 "Уперед!"
 AAT_norway_communist.5.t:0 "[FROM.GetNameDefCap] погоджується!"
 AAT_norway_monarchist.4.a:0 "Хай живе королева Матильда!"
 AAT_norway_news.3.t:0 "Гокон VII, король Норвеґії, помер"
 AAT_norway_rikstanken.1.t:0 "[ROOT.GetAdjectiveCap]а танкова програма"
 AAT_norway_rikstanken.12.a:0 "Ми знайдемо інший спосіб."
 AAT_norway_rikstanken.5.t:0 "[FROM.GetName] шукає тісніші зв'язки та танки"
 AAT_norway_rikstanken.7.t:0 "Ми вітаємо наш новий національний танк"
 ABDA_events.1.t:0 "Запрошення до нового Верховного командування"
 ABDA_events.5.b:0 "Ми не можемо взяти на себе ці зобов'язання в даний час."
 ABDA_fortress_singapore_choice_tt:0 "Завершення цього фокусу надасть вибір щодо того, як укріпити Сінгапур."
 ABILITY_DESC:0 "$NAME|H$: $DETAILS$"
 ABORT_DISMANTLE_PROJECT_POPUP_DESC:0 "Скасувати демонтаж комплексу?"
 ACE_PILOT_CANT_ASSIGN_UNFAMILIAR:0 "Неможливо призначити льотчика-аса, оскільки той §Rне знайомий із цим типом літаків§!."
 AFA_ETH_neutrality_subject:0 "Афарська автономна область"
 AFG_75_year_oil_concessions_desc:0 "Геологи останніми роками виявили значні запаси нафти на нашій території. Однак нам не вистачає промислових потужностей, щоб видобувати її самостійно. Можливо, якщо ми звернемося до однієї з великих держав із взаємовигідною угодою, ми зможемо видобувати нафту разом."
 AFG_BUK_emirate_neutrality:0 "Емірат Афганістан"
 AFG_adopt_nufus_tt:0 "§RСкасує рішення $AFG_quami_category$ та запобіжить вербуванню нерегулярних дивізій!§!"
 AFG_aid_rebels_cw:0 "Допомога афганським повстанцям"
 AFG_ally_the_young_afghans:0 "Ally the Young Afghans"
 AFG_central_asian_unification_desc:0 "Центральна Азія перетворилася з економічного занедбаного регіону на швидко зростаючий промисловий центр завдяки нашому ретельному управлінню. Разом ми створимо нове соціалістичне майбутнє для всього нашого народу."
 AFG_compulsory_jizya:0 "Обов’язковий джизья"
 AFG_confederation_pak_neutrality:0 "Афгано-пакистанська конфедерація"
 AFG_contact_rural_loyalists:0 "Зв'язатися з сільськими маликами"
 AFG_form_the_turkestan_legion_tt:0 "Відмикає рішення §Y$AFG_turkestan_legion_cat$§! для вербування дивізій з усього тюркського світу."
 AFG_industrial_events.14.a:0 "Нас не можна змусити підкоритися."
 AFG_industrial_events.21.a:0 "Чудова новина!"
 AFG_industrial_events.31.t:0 "[FROM.GetAdjectiveCap]ий уряд вимагає переговорів щодо річки"
 AFG_industrial_events.50.a:0 "Незабаром вони будуть звільнені!"
 AFG_industrial_events.51.a:0 "Тривожна ситуація."
 AFG_industrial_events.55.a:0 "У нас мало варіантів, окрім як заспокоїти їх."
 AFG_infantry_equipment_3_short:0 "Sterling MkI"
 AFG_khorasan_neutrality_ADJ:0 "Хорасанськ"
 AFG_linchpin_of_global_defense:0 "Ключовий елемент глобальної оборони"
 AFG_look_to_other_partners_desc:0 "Наші торговельні угоди з Радянським Союзом викликали підозри щодо їхнього впливу на нашу внутрішню та зовнішню політику. Такі звинувачення, звичайно, неправдиві, але, можливо, в наших інтересах шукати торговельних партнерів в інших місцях."
 AFG_manghud_party:0 "Manghud"
 AFG_neutral_influence:0 "Іноземний нейтральний вплив"
 AFG_neutrality_graduates:0 "Радикальні випускники"
 AFG_officialize_the_turkish_afghan_defense_treaty:0 "[TUR.GetAdjective]—[ROOT.GetAdjective] Оборонний договір"
 AFG_political_events.100.b:0 "Ми не будемо цього робити."
 AFG_political_events.140.c:0 "Непохитного традиціоналіста Мухаммада Ібрагіма-хана."
 AFG_political_events.157.t:0 "[GER.GetAdjective] підтримка надходить"
 AFG_political_events.160.desc:0 "У відповідь на наш запит уряд [FROM.GetName] погодився підтримати сходження $AFG_faqir_of_ipi$ на трон [ROOT.GetNonIdeologyName]. Ця підтримка включатиме військову допомогу та обладнання для забезпечення успіху нашого починання."
 AFG_political_events.43.desc:0 "Наш посол у [FROM.GetNameDefCap] повідомив нам, що в [FROM.Capital.GetCapitalVictoryPointName] нещодавно була підписана угода з представниками іншої країни. Хоча деталі угоди неясні, не може бути сумнівів, що на [FROM.GetAdjective] уряд впливають нації, які можуть прагнути підірвати наші інтереси в регіоні."
 AFG_political_events.61.a:0 "Чудово!"
 AFG_political_events.61.desc:0 "[FROM.GetNameDefCap] погодився приєднатися до нашого Тюрко-Перського союзу. Разом наші військові зможуть краще стримувати агресію з боку наших спільних супротивників. Але, що важливіше, ми маємо плацдарм, щоб з часом поступово відбирати їхню незалежність."
 AFG_political_events.85.a:0 "Це може бути нам на користь."
 AFG_reinforce_the_royal_guard_desc:0 "Незважаючи на його легітимність, є багато невдоволених поверненням короля та його радикальними реформами. Цим зрадникам не можна дозволити підривати роботу короля, і ними має зайнятися нова служба безпеки, що діє в тіні та впроваджує його волю."
 AFG_renounce_the_durand_line_desc:0 "Лінія Дюранда, нав'язана нам іноземними гнобителями, надто довго розділяла наших пуштунських родичів. Завдяки хитрості наших дипломатів або силі наших збройних сил, ми покладемо край цій несправедливості раз і назавжди."
 AFG_repeal_the_durand_line:0 "Скасувати Лінію Дюранда"
 AFG_shipyards:0 "Створити [ROOT.GetAdjective] суднобудування"
 AFG_shipyards_tt_2:0 "§YВідмикає військово-промислову організацію:§!"
 AFG_soviet_research_cooperation:0 "Радянська наукова співпраця"
 AFG_soviet_research_technology_exchange_tt:0 "§Y[SOU.GetNameDefCap] буде більш схильний прийняти, якщо має високу думку про нас.§! \nЯкщо [SOU.GetFlag]§Y[SOU.GetNameDef]§! погодиться на пропозицію, ми приєднаємося до групи обміну технологіями з ними."
 AFG_state_industries:0 "Створити державні підприємства військової промисловості"
 AFG_state_industries_desc:0 "Випускники університетів радикалізуються через відсутність роботи, яка б використовувала їхні навички. Щоб запобігти цьому, ми могли б створити державні підприємства для працевлаштування більшості з них, одночасно озброюючи наші збройні сили вітчизняно виготовленим обладнанням."
 AFG_subsistence_economy_modifier:0 "Натуральне господарство"
 AFG_unify_the_islamic_world_tt:0 "Стається подія §Y[ROOT.GetNameDefCap] запрошує нас до свого альянсу§!."
