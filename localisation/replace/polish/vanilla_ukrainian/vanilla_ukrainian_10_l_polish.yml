 ARG_change_of_course:0 "Зміна курсу"
 ARG_communist_faction:0 "Інтернаціонал Південної Америки"
 ARG_conquer_south_america_desc:0 "На континенті Південної Америки немає місця іншим світовим ідеологіям, оскільки вони становлять загрозу для нашої соціалістичної держави. Якщо вони не приєднаються до нас, то ми повинні якнайшвидше звільнити їхній народ і поставити його під захисний прапор [ARG.GetNameDef]."
 ARG_cruiser_ship_engine_1:0 "«Parsons» 54 000 к. с. н. в."
 ARG_develop_the_electricity_sector:0 "Розвивати електроенергетичний сектор"
 ARG_disrupt_bolivar_lar_desc:0 "Операція «Болівар» вже багато років для нас як сіль в оці, і саме від нас залежить, чи зможемо ми протистояти цьому огидному акту ворожого шпигунства."
 ARG_emphasis_on_public_works_desc:0 "Щоб відновити нашу країну з руїн Великої депресії, нам потрібно інвестувати більше часу в проєкти громадських робіт. Якщо ми спрямуємо більше грошей у нашу місцеву інфраструктуру, це не лише допоможе нашій економіці, але й покращить життя [ARG.GetAdjective] громадян."
 ARG_fascist_researchers:0 "Фашистські дослідники"
 ARG_fighter_equipment_0_short:0 "D.21"
 ARG_immigration_wave_desc:0 "[ARG.GetName] — це країна, побудована на імміграції. Хоча більшість нашого населення походить з Іспанії, у нас також є значна кількість німців і навіть валлійців у межах наших кордонів. Ми могли б підвищити нашу економіку, сприяючи міграції з цих країн до [ARG.GetName]."
 ARG_in_memory_of_yrigoyen_desc:0 "[ARG.GetNameDefCap] вже переживала подібну ситуацію. Хоча його правління не було бездоганним, Іполіто Ірігоєн все ж здійснив необхідні реформи, які досі приносять користь нашій країні. Нам потрібен хтось, хто підхопить його мантію та поверне нас на шлях демократії."
 ARG_industrial_expansion_desc:0 "Сильна промисловість — це основа будь-якої економіки. Ми повинні зосередитися на наших дослідженнях щодо розробки більшої кількості варіантів для нашої промислової експансії."
 ARG_integrate_operation_bolivar_desc:0 "Протягом деякого часу [GER.GetNameDef] проводила кілька шпигунських місій по всій Південній Америці. Ця директива, любовно названа «Операція Болівар», діяла в [ARG.GetNameDef]. Тепер, коли ми в хороших стосунках із [GER.GetAdjective]им народом, ми можемо працювати над інтеграцією програми та заохочувати її поширення по всьому континенту."
 ARG_manuel_maria_de_iriondo:0 "Мануель Марія де Іріондо"
 ARG_military_government_idea_desc:0 "Педро Пабло Рамірес захопив владу і створив замість неї військову державу. Ця зміна режиму була викликана численними закликами до змін з боку корумпованої та шахрайської Конкордансії. З маніфестом, який зосереджується на [ARG.GeAdjective]ому експансіонізмі, наша країна напевно зіткнеться з багатьма конфліктами в майбутньому."
 ARG_military_state_absorption_mission:0 "Армія збирає підтримку"
 ARG_military_state_fascism_DEF:0 "Легіонерська Аргентина"
 ARG_news_events.3.a:0 "Трагедія, що до цього дійшло."
 ARG_political_events.19.b:0 "Ми не відмовимося від нашого суверенітету."
 ARG_political_events.25.desc:0 "Чудова новина! [CHL.GetAdjective] уряд вирішив приєднатися до нас в альянс. Разом ми зможемо стояти як брати проти загроз, що лежать на півночі. Це знаменний день і крок у правильному напрямку для об'єднаної Південної Америки."
 ARG_political_events.26.t:0 "[CHL.GetNameDefCap] відмовляється приєднатися до нашої фракції"
 ARG_political_events.27.b:0 "Ми не відмовимося від нашого суверенітету."
 ARG_political_events.30.desc:0 "Після того, як ми відстояли свою позицію, здається, [ARG.GetAdjective] уряд вирішив, що продовжувати цей курс дій не варто. Тепер ми можемо спокійно відпочити, знаючи, що загроза наразі придушена."
 ARG_political_events.42.t:0 "[ARG.GetNameDefCap] звертається за допомогою"
 ARG_political_events.7.t:0 "[FROM.GetName] вимагає, щоб ми заплатили за острови."
 ARG_political_events.75.desc:0 "Ми щойно отримали відповідь від [FROM.GetNameDef]. Вітаючи наші останні зусилля змінити нашу країну та повернутися до демократії, вони вирішили погодитися на наші запити, однак, лише частково. Пакт про ненапад було підписано, але вони, на жаль, не гарантують нашу незалежність наразі."
 ARG_political_events.8.t:0 "[FROM.GetName] відмовляється віддати острови."
 ARG_political_events.80.a:0 "Фінансувати освіту в галузі електроніки."
 ARG_preparing_for_war_idea:0 "Підготовка до війни"
 ARG_regulated_national_salaries_desc:0 "Ми спостерігаємо тривожну тенденцію серед наших вітчизняних корпорацій та компаній, які недоплачують своїм працівникам. Ми не зацікавлені в контролі їхніх бюджетів, але ми зацікавлені в тому, щоб усі наші громадяни отримували справедливу заробітну плату. Встановлення мінімальної заробітної плати, безумовно, допоможе всім у цій ситуації."
 ARG_socialist_volunteers_desc:0 "Існує багато інших соціалістичних рухів у всьому світі, які борються за свої мрії про революцію. Якщо виникне потреба, ми повинні запропонувати нашу силу, щоб допомогти тим націям, які прагнуть піти подібним червоним шляхом. Замикатися в собі не означає, що ми повинні ігнорувати страждання наших міжнародних товаришів."
 ARG_soviet_aligned_communism:0 "Південноамериканські радянські республіки"
 ARG_subdue_dissension_idea:0 "Приборканий розбрат"
 ARG_the_buenos_aires_conference_1_tt:0 "Отримає подію «§YПочинається Конференція в Буенос-Айресі§!», яка попросить нас або залишити §YФанні Едельман§! при владі, або перейти до §YАнтоніо Сото§!."
 ARG_thomas_martinez:0 "Томас Мартінес"
 ARG_towards_a_greater_argentina_desc:0 "Завдяки нашим спільним зусиллям із збільшення нашого промислового потенціалу та акцентуванню на фінансуванні громадських робіт та інфраструктури, ми створили основу для того, щоб [ARG.GetName] справді повстала з попелу Великої депресії як держава-початківець на континенті Південної Америки!"
 ARMY_AMOUNT_PENALTY:0 "§RКомандує великою кількістю армій. Всі параметри знижені на $PENALTY|Y1%$§!"
 ARMY_COMPOSITION_SPECIAL_HEADER:0 "\nТакож отримує бонуси на основі цього:\n"
 ARMY_NAVIES_TAB:0 "§YФлот§!"
 ARMY_TAB_LABEL:0 "Збройні сили"
 ARM_democratic:0 "Республіка Вірменія"
 AST_CAS_equipment_2:0 "CAC CA-4 Woomera"
 AST_EQUIPMENT_VERSION_4:0 "Mk IV"
 AST_SH_battleship_1:0 "Клас «Centurion»"
 AST_TAOG_central_bureau:0 "Центральне бюро"
 AST_advisor_uap_increase_modifier_tt:0 "Щоденне зростання голосів за §YО.А.П§!: §Y+0.01%§!"
 AST_alexander_hore_ruthven:0 "А. Гор-Рутвен"
 AST_arthur_calwell:0 "Артур Келуелл"
 AST_australia_first_movement_cat:0 "Рух «Передусім Австралія»"
 AST_australia_first_party_long:0 "Партія «Австралія перш за все»"
 AST_australia_first_spirit_tt:0 "Змінює §Y$AST_australia_first_spirit$§! на:"
 AST_australian_comforts_fund:0 "£BoP_right_texticon Австралійський фонд комфорту"
 AST_australian_comforts_fund_desc:0 "Уряд має вшанувати пам'ять однієї з жертв авіакатастрофи в Канберрі, інвестувавши в Австралійський фонд комфорту, в якому дружина загиблого є активною працівницею.\n\nФонд має на меті полегшити час, який австралійські солдати проводять у полі, надсилаючи їм речі, що доповнюють їхні армійські пайки та особисті комплекти, тому військові зусилля також виграють від цієї інвестиції."
 AST_australian_war_cabinet_war_idea:0 "Австралійський військовий кабінет"
 AST_britain_supplying_ships:0 "Британія постачає кораблі"
 AST_british_war_cabinet_desc:0 "Почалася війна, і Сполучене Королівство сформувало Воєнний кабінет для забезпечення ефективного ведення війни союзниками. Вони викликали нас, щоб ми також поділилися своїми поглядами на цю справу, тож наш прем'єр вирушить представляти австралійські інтереси."
 AST_broken_hill_proprietary_company_ic:0 "Broken Hill Proprietary Company"
 AST_cabinet_trust_cat:0 "Довіра до Кабінету"
 AST_cabinet_trust_effects_3:0 "[GET_AST_CABINET_TRUST_EFFECTS_3]"
 AST_civil_construction_corps:0 "Корпус цивільного будівництва"
 AST_coast_watchers:0 "Берегові спостерігачі"
 AST_com_aircraft_corporation_organization:0 "$AST_commonwealth_aircraft_corporation$"
 AST_cruising_for_a_bruising:0 "Курс на проблеми"
 AST_cv_nav_bomber_equipment_3:0 "Blackburn Firebrand"
 AST_diplomatic_events.14.desc:0 "За підсумками нещодавно проведеного референдуму, [NZL.GetName] вирішила застосувати статтю 6 Конституції Австралії. Новозеландці погодилися, що їхні землі будуть у більшій безпеці під австралійським управлінням, і тому вирішили приєднатися до [AST.GetNameDef]."
 AST_diplomatic_events.24.a:0 "Вітри змінюються."
 AST_diplomatic_events.35.t:0 "Тихий океан було розділено"
 AST_diplomatic_events.56.b:0 "Тоді нехай повертаються зі зброєю."
 AST_diplomatic_events.57.a:0 "Подальша експансія в Африку триватиме!"
 AST_diplomatic_events.68.desc:0 "Австралія не бажає сама протистояти своєму переважаючому ворогу — [JAP.GetNameDef]. Вони тиснуть на нас, щоб ми зробили перший крок і врегулювали назріваючий конфлікт якнайшвидше."
 AST_eminent_successors:0 "£BoP_right_texticon Видатні наступники"
 AST_energy_independence_desc:0 "Покладання на зовнішню торгівлю є непевним, особливо в часи конфлікту; енергетична незалежність є життєво важливою, щоб Австралія могла функціонувати навіть у найскрутніші часи. Інвестуючи в нафтопереробні заводи, ми можемо сприяти розвитку внутрішнього виробництва енергії."
 AST_evans_deakin_co_organization:0 "$evans_deakin_co$"
 AST_fly_the_jolly_roger_desc:0 "Ми можемо відправляти групи підводних човнів з нашої острівної цитаделі, щоб вони нападали на ворожі вантажні кораблі, що проходять поряд з нашими берегами, і знищували їх."
 AST_form_unity_government_text:0 "Уряд національної єдності"
 AST_fred_paterson:0 "Фред Патерсон"
 AST_fund_owen_gun_research:0 "Профінансувати дослідження ПК Оуена"
 AST_heavy_tank_destroyer_equipment_1_short:0 "Matilda II TD"
 AST_heavy_tank_equipment_1_short:0 "Matilda II"
 AST_industrial_populist:0 "Промисловий популіст"
 AST_integrate_indonesia_indonesia_required_states_tt:0 "Контролює всі області §Y[INS.GetNonIdeologyName]§!."
 AST_invest_in_victory_desc:0 "Купуючи облігації військової позики, наші громадяни спрямують свої заощадження на оборону країни."
 AST_john_collins:0 "Джон Коллінз"
 AST_light_tank_aa_equipment_1_short:0 "Vickers Mk VI AA"
 AST_make_a_common_enemy_desc:0 "Голоси недовіри помножилися після втрати урядовців, які загинули в авіакатастрофі в Канберрі. Незвичні обставини катастрофи — не єдиний фактор, що спонукає підозрювати іноземне втручання; зрештою, ніщо не об'єднує більше, ніж спільний ворог."
 AST_medium_tank_artillery_equipment_2:0 "AC I Sentinel SP Artillery"
 AST_national_security_act_desc:0 "Ми перебуваємо у стані війни, і федеральна влада має отримати розширені повноваження, щоби захистити Австралію. Більше можливостей щодо цензури друку, придушення дисидентських груп, оподаткування та вилучення власності для оборони домініону."
 AST_nationalization:0 "Почати націоналізацію"
 AST_no_foreign_battlefields_spirit_tt:0 "Змінює §Y$AST_no_foreign_battlefields_idea_1$§! на:"
 AST_political_events.5.t:0 "Австралійський уряд стає жорсткішим"
 AST_promote_reservists_desc:0 "Нам потрібні захисники в країні, але, приймаючи ополченців та резервістів до лав регулярної армії, ми отримаємо нових досвідчених бійців, яких нам так не вистачає."
 AST_protect_the_dutch_colonies:0 "Захистити нідерландські колонії"
 AST_public_institutions_desc:0 "Для функціонування суспільству потрібні багато базових послуг: від охорони здоров'я та житла до догляду за дітьми і транспорту. Держава повинна забезпечити їх повсюдно, гарантуючи доступ для всіх без обмежень. Звільнені від необхідності приносити приватний прибуток, ці системи зможуть ефективно працювати на задоволення потреб усього населення."
 AST_reverse_industry_tariffs_desc:0 "У минулому ми використовували мита, щоб захистити нашу вітчизняну промисловість від іноземної конкуренції. Однак це призвело до торгових воєн і митних заходів у відповідь проти нашого експорту, підвищуючи ціни. Ми повинні знизити ці бар'єри та заохотити взаємне зниження для сприяння розширенню торгівлі."
 AST_ride_the_lightning_desc:0 "Наші пілоти-винищувачі — це вістря спису нашої повітряної могутності: швидкі, агресивні та невпинні. Сідлаючи блискавку в бою, вони захоплюють контроль над небом, перехоплюють ворожі літаки та гарантують, що куди б не йшли наші війська, за ними відразу слідуватиме панування в повітрі."
 AST_smuggle_arms_to_ireland_desc:0 "Ми повинні забезпечити ірландців зброєю, необхідною для боротьби з британцями."
 AST_specialize_equipment_desc:0 "Не вся британська техніка, яку ми використовуємо, пристосована до наших бойових умов. Виникла потреба у спеціально адаптованих засобах."
 AST_squash_the_squanderbugs:0 "Позбутися марнотратників"
 AST_subject_DEF:0 "$OVERLORDADJ$а $AST$"
 AST_supply_indonesian_nationalists_desc:0 "Ми мусимо допомогти народу Індонезії у його боротьбі з нідерландськими гнобителями. Індонезійцям потрібні освіта і підготовка, але вони перевершують ворога числом, тому неминуче переможуть у боротьбі за справедливість і будуть нам дуже вдячні."
 AST_support_indonesian_uprising_desc:0 "Тепер, коли індонезійці взялися за зброю і повстали проти нідерландців, їм потрібне щось вагоміше, ніж просто слова. Повстанцям потрібні зброя та різне спорядження, а також повномасштабна дипломатична підтримка."
 AST_uap_popularity_decrease_10:0 "Голоси §Y$AST_ruling_party$§! §Y$AST_uap$§!: §R-10.00%§!"
 AST_uap_win_count:0 "§YУАП§! має [?AST_uap_election_win_count|0Y] Перемог на виборах."
 AST_union_control_1_cat:0 "Контроль профспілок"
 AST_union_control_events.1.desc:0 "Спецслужби довели до відома уряду тривожний звіт. Австралійські комуністичні агенти встановлюють контакти з місцевими лідерами профспілок, поширюючи радикальну літературу та заохочуючи робітників об'єднуватися за революційними напрямками. Наразі рух залишається невеликим, але чиновники з безпеки попереджають, що саме з цього такі речі і починаються. Рішення потрібно прийняти до того, як воно вкоріниться."
 AST_uranium_mining_desc:0 "За останні кілька десятиліть ми відкрили кілька великих уранових родовищ у Південній Австралії, особливо на околицях гори Гі. Уран зараз є ключовим військовим ресурсом, і ми маємо збільшити його вироблення."
 AST_veterans_revolt_desc:0 "В армії є багато антикомуністично налаштованих членів, багато з яких раніше належали до фашистських угруповань. Вони зневажають комунізм і радше візьмуться за зброю, ніж дозволять йому прийти до влади.\nЯкщо ми будемо занадто довго зволікати з нашою революцією, або якщо ми дозволимо стабільності впасти занадто низько, вони візьмуть справу у свої руки, щоб запобігти цьому."
 AST_vichy_out_of_africa_tt2:0 "Додає претензії на території §YВішістської Франції§! в §YАфриці§! через рішення §YВіші геть з Африки§!.\n"
 AST_womens_auxilliary_australian_air_force_desc:0 "Половина населення нашої країни також може допомогти на війні, а не сидіти вдома. Жінки займуться підготовкою літаків, службою у військах зв'язку та виконанням інших подібних завдань."
 ATJ_fascism_ADJ:0 "Ачезьк"
 ATTACH_AIRWING_TO_GROUP_TOOLTIP:0 "§GКлацніть ПКМ§!, щоби прикріпити авіакрила до армії."
 ATTRITION_TRAINING:0 "Від §Hвійськових тренувань§!: $VALUE|-0%$"
 AUS_aggression_desc:0 "Підстерігати й сподіватися, що вас не атакують, у такі часи небезпечно. Щоб переконатися, що нас не застануть зненацька, ми повинні бути готові завдати удару першими."
 AUS_antischluss_category:0 "Заходи проти аншлюсу"
 AUS_apprentice_programmes:0 "Запустити учнівські програми"
 AUS_avionics_effort:0 "Зусилля з розвитку авіоніки"
 AUS_bankverein:0 "Wiener Bankverein"
 AUS_bbo_focus_desc:0 "Наразі наші залізниці знехтовані, адже BBÖ, наша національна залізнична компанія, позбавлена коштів. Однак, щоб керувати успішною країною, незалежно від того, велика вона чи мала, нам потрібно забезпечити хороше покриття залізницею по всій країні. Ми повинні почати інвестувати в BBÖ і наші залізні дороги."
 AUS_clamp_down_on_dnsap_desc:0 "Будь-які політичні партії за межами нашого Вітчизняного Фронту давно заборонені в нашій країні. Незважаючи на це, деякі все ще залишаються, і найбільше турбує так звана «НСРП». Неправдиво стверджуючи, що вони представляють справжній австрофашизм, вони стверджують, що ми повинні відмовитися від нашого суверенітету та незалежності на користь Німеччини. Вони — головна загроза держбезпеки, треба негайно з ними розібратися!"
 AUS_coastal_defence_forts:0 "Гарнізон узбережжя"
 AUS_demand_part_of_spanish_winnings_desc:0 "Полум’я конфлікту на Піренейському півострові повільно згасає, наші друзі-націоналісти перемагають, настав час поглянути, що ми можемо отримати від нашої інтервенції. Наша допомога Націоналістичній Іспанії повинна була залучити нас до їхньої ласки, тож здавалося б цілком правильним, щоб ми вимагали певної компенсації за нашу допомогу."
 AUS_doth_desc:0 "Обов’язок кожного [AUS.GetAdjective]ого громадянина — виконувати свою роль у захисті Батьківщини; в армії, на заводах чи на будівництві. Спільними зусиллями нації Батьківщину буде захищено!"
 AUS_expand_stpoltner_steelworks:0 "Розширити металургійний завод Санкт-Пьольтена"
 AUS_habsburg_monarchy_restored_intro_tt:0 "Замінити §YДинастія Габсбурґів відновлена§! на:"
 AUS_innovative_airforce_bonus:0 "Інноваційні ВПС"
 AUS_join_the_axis_desc:0 "Незважаючи на те, що ми сильні самі по собі, не можна заперечувати, що участь у певній формі військового альянсу принесе користь як нам, так і самому альянсу, до якого ми збираємося приєднатися. Нам слід подумати про те, щоб звернутися до найбільш близького до нас альянсу. Будь-хто захоче мати такого союзника, як ми, правильно?"
 AUS_karl_renner:0 "Карл Реннер"
 AUS_mio_trait_radar_improvements:0 "Інтеграція радара й сонара"
 AUS_navy:0 "Österreichische Kriegsmarine"
 AUS_news_events.1.c:0 "Östfrei!"
 AUS_news_events.5.b:0 "Finally!"
 AUS_older_prince_of_liechtenstein:0 "Старший принц Ліхтенштайнський"
 AUS_political_events.103.desc:0 "Хоча ми давно, що [GER.GetAdjective] має у намірах анексувати нас, звіт, який ми отримали сьогодні вранці, розкрив речі в новому, набагато жахливішому ракурсі. Схоже, що нещодавно відбулася конференція, під час якої [GER.GetLeader] озвучував мерзенні ідеї про те, як ми можемо бути інтегровані в їхню країну. Незважаючи на всі наші зусилля, схоже, що ця надзвичайно конфіденційна інформація дійшла до мас і, що ще більше тривожить, до політичних партій, які, здається, вважають це чудовою ідеєю. Ці групи, швидше за все, підірвуть волю наших людей дати відсіч, якщо [GER.GetLeader] вирішить реалізувати ці мерзенні плани."
 AUS_political_events.107.a_tt:0 "Розпочавши війну проти держави [GER.GetNameDef], ми отримаємо:\n"
 AUS_political_events.108.desc:0 "Нам стало відомо, що [FROM.GetAdjective]а армія розпочала досить великі військові навчання прямо на нашому кордоні. Хоча усно в нашу бік не було висловлено жодних погроз, ми не можемо позбутися відчуття, що це певне попередження про те, що згодом має відбутися. Слід бути уважними до наших дій щодо їх країни, адже ми ризикуємо стати жертвою чогось більш серйозного з їх боку."
 AUS_political_events.16.b:0 "Безумовно ні! Тут явно щось не так просто!"
 AUS_political_events.29.c:0 "Вони підготували нас до краху, але що ми можемо зробити?"
 AUS_political_events.30.a:0 "Ми не можемо їх зупинити, але можемо уповільнити."
 AUS_political_events.33.desc:0 "[SPA.GetAdjective]ий уряд прислухався до нашого запиту про компенсацію, і, як спосіб подяки, вони надіслали нам частину обладнання, яке вони захопили у своїх опонентів під час громадянської війни, щоб відшкодувати частину обладнання, яке ми втратили, допомагаючи їм."
 AUS_political_events.35.c:0 "Тепер ми — нова [ROOT.GetName]!"
 AUS_political_events.52.t:0 "[FROM.GetNameDefCap] потребує нашої інтеграції"
 AUS_political_events.73.c:0 "Якщо вони хочуть переозброїтися, нехай за цим хтось стежить!"
 AUS_political_events.81.t:0 "[FROM.GetNameDefCap] дотримується нашої політики"
 AUS_political_events.83.a:0 "Як і ми!"
 AUS_propose_a_federative_union_decision:0 "Запропонувати [FROM.GetNameDef] доєднатися до федеративного союзу."
 AUS_rally_the_people:0 "Згуртувати народ"
 AUS_secretive_priest:0 "Таємничий пастор"
 AUS_the_correct_communism_desc:0 "Є багато шляхів практикувати комунізм, більшість з яких нам не до вподоби. [SOV.GetNameDefCap] затягує назву нашої ідеології в бруд своїм способом керування країно. Їм не можна давати свободу самоуправління."
 AUS_the_right_to_rearm_fed_tt:0 "Ми, як §YНейтральна Нація§!, почнемо переозброєння не дивлячись на наслідки."
 AUS_treaty_of_saint_germain_en_laye_tt_2:0 "§RПоки цей національний дух активний, закон про військовий обов’язок не може вийти за межі «Лише добровольці», нові підрозділи не можна навчати, розформовувати або змінювати їхні шаблони§!"
 AUS_universitat_graz:0 "Ґрацький університет"
 Amisos:0 "Аміс"
 BAH_democratic:0 "Багамська співдружність"
 BAH_fascism_ADJ:0 "Багамськ"
 BALTIC_communist_propaganda:0 "Балтійська комуністична пропаганда"
 BALTIC_defence_of_our_nation:0 "Оборона нашої нації"
 BALTIC_entente_events.6.t:0 "[From.GetNonIdeologyName] пропонує об'єднання"
 BALTIC_events.1.b:0 "Нашу підтримку не отримають ні [From.GetLeader], ні [From.GetLeader.GetHerHis] уряд."
 BALTIC_events.202.a:0 "Як вони сміють відкидати нас?!"
 BALTIC_events.4.d:0 "[Root.GetAdjective] народ все більше незадоволений урядом, і сьогодні на вулицях міста [Root.Capital.GetName] розбіжності загострилися до межі. Протести проти режиму та поводження з бідними верствами суспільства привели до кількох сутичок з [Root.GetAdjective] військовою поліцією. В результаті протестуючі дійшли до парламенту міста [Root.Capital.GetName], в якому [Root.GetLeader] і кілька ключових членів партії [Root.GetRulingParty] проводили засідання. Вимоги протестувальників недвозначні: [Root.GetLeader] і партія [Root.GetRulingParty] повинні бути вигнані з уряду, інакше почнеться революція."
 BALTIC_german_baltic_industry_desc_default:0 "У нашу націю тепер щосили інвестують німці. Приватні сектори Німеччини і держави [Root.GetNonIdeologyName] тепер майже невиразні — найчастіше німців і [Root.GetNonIdeologyAdjective] громадян забезпечують роботою й ті ж."
 BALTIC_purge_of_our_own:0 "Наша власна чистка"
 BALTIC_restore_workers_republic_idea:0 "Робітнича республіка"
 BALTIC_school_of_aviation:0 "Балтійська школа авіації"
 BAL_UNIFIED_neutrality_DEF:0 "Балтійська асамблея"
 BASE_ESCAPE_SPEED:0 "Базова величина: $NUM|+%$"
 BAS_autonomy_collaboration_government:0 "$OVERLORDADJ$і $NONIDEOLOGY$"
 BAS_democratic:0 "Республіка Британські Антили"
 BATTLE_PLANS_X_WILL_BE_ASSIGNED:0 "$NUM|Y$ дивізій буде призначено."
 BBA_african_union_events.7.a:0 "Ми прагнемо глибшої інтеграції."
 BBA_ethiopia_balance_of_power_events.56.b:0 "Реінвестування в регіон для його подальшого процвітання має бути в центрі нашої уваги."
 BBA_ethiopia_communist_events.04.t:0 "[SOV.GetName] погоджується допомогти нам"
 BBA_ethiopia_communist_events.19.a:0 "Чудово!"
 BBA_ethiopia_communist_events.37.t:0 "[SPC.GetNameDefCap] відхиляє пропозицію щодо деколонізації"
 BBA_ethiopia_exile_events.01.desc:0 "[FROM.GetAdjective]ий лідер у вигнанні, [FROM.GetLeader], більш ніж готовий розпочати масштабну кампанію по поверненню [FROM.GetLeader.GetHerHis] країни. Підтримка серед населення є сильною, тож це може бути саме той час, коли це потрібно зробити."
 BBA_ethiopia_exile_events.11.t:0 "Сомалі — наше!"
 BBA_ethiopia_exile_events.16.desc:0 "На жаль, [FROM.GetAdjective]ий уряд відхилив наш запит на використання [454.GetName] в якості бази і поставив під сумнів законність наших претензій на регіон."
 BBA_ethiopia_exile_events.17.desc:0 "Під час приватної зустрічі між [ROOT.GetLeader] та [FROM.GetLeader], [ROOT.GetLeader] пообіцяв, що [ROOT.GetNameDef] надасть підтримку [FROM.getNameDef] кораблями. Можливо, необережні слова, але все ж таки те, що [ROOT.GetAdjective]і ВМС повинні поважати."
 BBA_ethiopia_exile_events.22.b:0 "[524.GetName] буде чудовою базою"
 BBA_ethiopia_exile_events.23.t:0 "Ефіопський острів"
 BBA_ethiopia_exile_events.34.a:0 "Чудова новина"
 BBA_ethiopia_exile_events.56.t:0 "[?ETH.host_nation.GetAdjectiveCap]і пілоти відповідають на виклик"
 BBA_ethiopia_fascist_events.01.desc:0 "Конфронтаційний підхід $ETH_haile_selassie$ до італійців у поєднанні з його довірою до Ліги Націй ні до чого не приpвів. Всім очевидно, що [ROOT.GetName] буде приречена.\n\nВійна — це можливість для змін; вона робить зміну курсу навіть необхідністю. Першим кроком мусить бути відправлення посла до італійців для переговорів про мирну угоду, яку вони можуть прийняти."
 BBA_ethiopia_imperial_events.1.a:0 "Ми знайдемо застосування цим грошам."
 BBA_ethiopia_imperial_events.3.t:0 "[FROM.GetName] відмовляється продавати Джібуті"
 BBA_ethiopia_imperial_events.8.a:0 "Хай живе [ROOT.GetLeader]."
 BBA_ethiopia_industrial_financial_events.2.c:0 "Це справді піде на краще для обох країн."
 BBA_italo_ethiopian_war_events.03.a:0 "Ставки підвищуються."
 BBA_italo_ethiopian_war_events.10.c:0 "Ні, [ITA.GetName] — наш друг."
 BBA_italo_ethiopian_war_events.10.desc:0 "Рада Ліги Націй прийняла рішення про введення повного ембарго на торгівлю з державою [ITA.GetNameDef] у відповідь на незаконну агресію країни проти держави [ETH.GetNameDef]. Під санкції підпадають усі ресурси, які можуть бути використані для виробництва військової техніки. Введення обмежень є негайним і діятиме доти, доки країна не припинить воєнні дії проти держави [ETH.GetNameDef]."
 BBA_italo_ethiopian_war_events.102.t:0 "[FROM.GetNameDefCap] відхиляє [ROOT.GetAdjective]ий запит"
 BBA_italo_ethiopian_war_events.113.b:0 "Ми не можемо дозволити Лізі Націй диктувати нашу зовнішню політику."
 BBA_italo_ethiopian_war_events.15.b:0 "Погано."
 BBA_italo_ethiopian_war_events.203.desc:0 "Так звані експерти не дали нам навіть місяця тоді, коли почалася війна. Ми вистояли проти так званої сучасної армії набагато довше. Ми знаємо, як вони воюють, і ми до цього пристосувалися. У людей повертається віра, і до хоругв зблизька й здалеку стікаються рекрути."
 BBA_italo_ethiopian_war_events.305.t:0 "Заворушення в колоніях"
 BBA_italo_ethiopian_war_events.400.t:0 "Час розквитатися з державою [AFA.GetNameDef]"
 BBA_italy_anti_colonialism_events.15.b:0 "Якщо вони не з нами, вони проти нас!"
 BBA_italy_communist_events.01.t:0 "Керівництво Республіки"
 BBA_italy_communist_events.06.desc:0 "Наші товариші по зброї з держави [FROM.GetName] запропонували створити Велику комісію з членами з Іспанії та інших країн, щоб ми могли розширити співпрацю між нами. Вони стверджують, що разом ми повинні протистояти капіталізму і фашизму, щоб одного дня ми могли їх знищити."
 BBA_italy_communist_events.07.t:0 "[FROM.GetName] приймає нашу пропозицію"
 BBA_italy_democratic_events.05.t:0 "Італійська мафія на підйомі"
 BBA_italy_interaction_events.11.a:0 "Нехай забирають."
 BBA_italy_interaction_events.39.a:0 "Починається нова ера!"
 BBA_italy_interaction_events.40.b:0 "Франція ніколи не буде стояти поруч з Італією"
 BBA_italy_interaction_events.41.desc:0 "[FROM.GetLeader] звернувся до нас з пропозицією взяти нас під своє крило, щоб захистити від іноземних держав та економічної засухи. Однак [FROM.GetName] виглядає дещо вороже і, ймовірно, нападе на нас, якщо ми відхилимо їхні вимоги."
 BBA_italy_interaction_events.44.b:0 "Навіщо нам зустрічатися з імперіалістами?"
 BBA_italy_local_rulers.3.a:0 "Надання деяких поступок могло б задовольнити місцевих жителів."
 BBA_italy_missiolinis.03_north.a:0 "Ми змусили їх тікати!"
 BBA_italy_missiolinis.101.desc:0 "Тісні зв'язки між Італією й Албанією тягнуться вже тисячу років, аж до часів Римської імперії. Між нашими двома державами є міцний історичний зв'язок, і дуче рішуче бажає його поглибити. Він хоче включити Албанію до складу Італії та виміг хуткої окупації країни, щоби ми повністю контролювали вхід до Адріатичного моря. Це принесе славу та престиж Італії, яку багато інших країн надто довго розглядали як малу державу — принаймні, так стверджує дуче."
 BBA_italy_missiolinis.101.t:0 "Окупація Албанії"
 BBA_italy_missiolinis.122.a:0 "Опір був шалений."
 BBA_italy_missiolinis.201.t:0 "Зміцнення політичного кабінету"
 BBA_italy_missiolinis.203.t:0 "Успішний політичний кабінет"
 BBA_italy_missiolinis.43.desc:0 "Муссоліні особисто обстежив кілька новорозгорнутих підрозділів, які захищатимуть наші кордони — а також розширюватимуть їх, якщо дуче розгляне це як необхідність. Він дуже радий збільшеній кількості дивізій і хвалиться про те, що Італія нині має поважну армію, силу якої не можуть заперечити навіть наші вороги, тільки завдяки його передбачливості."
 BBA_italy_missiolinis.52.t:0 "Замало вантажівок підтримки"
 BBA_italy_recognize_the_empire.2.desc:0 "[FROM.GetNameDefCap] мудро визнає наші імперські прагнення і бачить в нас рівних собі — як і належить! Наш престиж і слава продовжують зростати."
 BBA_swiss_expansion.5.desc:0 "Попри підтримку демократії і [ROOT.GetNameDef], [FROM.GetName] вирішили ігнорувати народ [?SWI.SWI_state_being_claimed.GetName], який прагне до референдуму щодо вступу до Конфедерації.\n\nЦе прямий заклик для нас узятися за зброю і захистити наші окуповані кантони від тиранії [FROM.GetNameDef]."
 BBA_swiss_expansion.8.desc:0 "[FROM.GetNameDefCap] нарешті погодились, що [848.GetName] має бути частиною [ROOT.GetNameDef] як його новий кантон.\n\nЦе лише перший крок у шляху [ROOT.GetName] до більш демократичної Європи!"
 BBA_switzerland.1.desc:0 "Політична ситуація всередині та навколо держави [ROOT.GetNameDef] стрімко погіршується. Зростає рух, який виступає за керівні принципи, які допоможуть спрямувати корабель держави у правильному напрямі під час майбутньої бурі, але питання в тому, які саме?\n\nМи не знаємо, що зроблять наші сусіди, але ми мусимо вирішити зараз, який курс дій дозволить державі [ROOT.GetName] вижити."
 BBA_switzerland.18.a:0 "Ми самі проти наших ворогів."
 BBA_switzerland.22.t:0 "[FROM.GetNameDefCap] обіцяє нас захистити!"
 BBA_switzerland.3.c:0 "Якщо подумати, він очевидно винен."
 BBA_switzerland_fascist.3.t:0 "[SWI.GetName] просить контроль над [848.GetName]"
