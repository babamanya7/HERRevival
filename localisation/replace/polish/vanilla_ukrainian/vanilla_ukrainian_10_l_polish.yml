 CHI_rely_on_locals_desc:0 "Створення повноцінної організації, якою зможуть користуватися наші сили, є складним, тривалим і дорогим процесом. Історія показує нам альтернативу: навіщо везти те, що можна знайти на місці? Якщо ми покладатимемося на фермерів і робітників, які населяють нашу велику землю, ми зможемо компенсувати різницю, залишену нашою системою."
