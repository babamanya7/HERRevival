 CHI_but_a_night_breeze_soon_falls_desc:0 "Нічні операції можуть бути сповнені ризику, проте завдяки посиленій підготовці наші пілоти зможуть мінімізувати втрати під покровом темряви. Ворог ніколи не побачить нашого наближення..."
 CHI_clear_out_sycophants_desc:0 "Тиран породжує підтакувачів, і чим довше він править, тим їх більше. Хоча ми номінально контролюємо законодавчу та виконавчу владу, все ще є багато людей, які дотримуються старих ідей. Ми повинні докласти спільних зусиль, щоб гарантувати, що ті, хто наживався на попередньому режимі, будуть поставлені на місце."
