 tfv_australia.62.d:0 "Тримаючи [From.GetAdjective]их людей під своїм буржуазним пальцем, товсті коти, які контролюють уряд держави [From.GetNameDef], оголосили, що вони ні за яких умов не будуть співпрацювати з [Root.GetAdjective]ою державою.\nШкода для них, що ми не прагнемо їхньої співпраці, а скоріше тих, хто рабує під тягарем їхнього розкішного ожиріння!"
 tfv_australia.71.t:0 "Комісія оборони"
 tfv_australia.80.d:0 "[From.GetNameDefCap] з часом став більш прихильним до імперських амбіцій держави [Root.GetNameDef]. Як єдина інша велика військова сила, що базується в регіоні, [From.GetAdjective]а держава вирішила, що краще бути нашим гордим союзником, ніж нашими покірними слугами.\n\nЩоб підвищити наш інтерес, пропозиція щодо західної частини Тихого океану альянс чітко окреслює [Root.GetAdjective]у сферу, щоб також включати кілька територій, які зараз контролюються ворогами держави [From.GetNameDef]."
 tfv_australia.90.a:0 "Попросімо короля відвідати Австралію для зміцнення морального духу."
 tfv_canada.11.t:0 "Істинна американська революція"
