 SWE_let_fly_all_guns:0 "Даймо волю нашій зброї"
 SWE_let_fly_all_guns_desc:0 "Хоча ми не маємо величезної індустрії інших країн, у нас є деякі з найдосвідченіших виробників зброї. З додатковими інвестиціями ми могли б повністю використати їхні таланти, щоб дати нашим силам технологічну перевагу на полі бою."
 SWE_license_skf_ball_bearings_desc:0 "SKF стала світовим лідером у виробництві кулькових підшипників, які просто мають вирішальне значення для виробництва багатьох сучасних військових транспортних засобів. Ми повинні використовувати це на нашу користь під час торгових переговорів із воюючими країнами."
 SWE_light_tank_destroyer_equipment_2_short:0 "Pvkv IVA"
 SWE_mechanized_equipment_3:0 "Terrängbil m/42 KP"
 SWE_medium_tank_equipment_3:0 "Strv m/42"
 SWE_military_academy_desc:0 "За останні роки всі види військ накопичили великий досвід. Створивши систему військових академій, ми можемо забезпечити передачу їхніх знань із покоління в покоління."
 SWE_nav_bomber_equipment_1:0 "Saab T18"
 SWE_nordic_protection_complex_desc:0 "Ми, нордичні країни, всі хочемо миру. Єдине, чого ми справді бажаємо, це базове право жити на півночі, старішати на півночі та бути похованими на півночі. Якщо хтось спробує відібрати його в нас, його теж поховають тут."
 SWE_nordic_research_exchange_desc:0 "Скандинавські країни є технологічно розвиненими, і було б прикро не поділитися своїми досягненнями один з одним."
