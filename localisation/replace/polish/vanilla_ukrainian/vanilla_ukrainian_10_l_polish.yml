 poland.2102.t:0 "Анексія Данциґу"
 poland.3.d:0 "Після того, як ми натиснули на державу [FROM.GetNameDef], щоби та визнала наші законні претензії на східні землі, вони погодилися поступитися тим, що ми вимогли, без подальшого конфлікту. Однак, ми, ймовірно, можемо облишити всяку надію на формування більш міцного зв'язку з цією країною в майбутньому. Віддаючи нам належне, вони, схоже, сподіваються, що ми матимемо якомога менше контактів."
 poland.3.t:0 "[FROM.GetName] віддає схід"
 poland.8.d:0 "Як було попередньо домовлено, після анексії східних територій Німеччини державою [SOV.GetNameDef] деякі з них перейдуть під контроль Польщі у якості компенсації за минулу передачу сходу Польщі державі [SOV.GetNameDef]."
 poland_goal_desc:0 "Данциґ був німецьким, Данциґ залишався німецьким і Данциґ буде німецьким! Необхідно підготувати німецький народ до неминучої війни з Польщею. Пропаганда підштовхне його до більш рішучих дій і покаже всьому світу підступність поляків. Данциґ і сусідні землі повернуться в Німеччину!"
 police_action_desc:0 "[From.GetAdjective]ий народ готовий прийняти відповідальне самоврядування від місцевої поліції та воєнізованих формувань."
 political.10.d:0 "Хоча спроби фашистського руху відродити націоналістичні настрої мали певний успіх, опір цим ідеям залишається високим. Генерали, які планують повалити нинішню адміністрацію, розчаровані відсутністю довіри самого [Root.GetAdjective]ого населення до партії [Root.GetFascistParty].\n\nВони переконані, що народ урешті-решт стомиться від [Root.GetLeader], але розділилися в думках щодо того, який курс дій обрати. Дехто закликає здійснити переворот зараз, до того, як вороги держави [Root.GetName] почнуть діяти. Однак, якщо зробити це в умовах обмеженої підтримки громадськості, країна може опинитися в стані громадянської війни."
 political_connections_navy_spirit:0 "Політичні зв'язки"
 political_correctness_desc:0 "Люди, які відстоюють погляди, що розходяться з думкою більшості, переймаються тим, що проти них існує глобальна змова. Це цікава ідея."
