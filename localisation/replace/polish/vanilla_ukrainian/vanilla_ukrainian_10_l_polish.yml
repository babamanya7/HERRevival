 election.3.d:0 "Тривала війна насунулася на майбутні вибори, і багато виборців занепокоєні тим, що держава [Root.GetName] не готова до втягування в цей конфлікт або до того, що може з нього випливати. Вони вимагають, щоби ми посилили наші запобіжні заходи та забезпечили готовність нашої нації до війни. Хоча більшість все ще підтримує партію [Root.GetRulingParty], ми можемо втратити їх на користь більш радикальних елементів, якщо не розвіємо їхні побоювання."
