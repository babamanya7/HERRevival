 JAP_army_faction_is_at_least_influential_tt:0 "£imperial_influence_texticon $JAP_army_faction$ є щонайменше $JAP_imperial_influence_tier_3$"
 JAP_army_faction_is_not_subdued_tt:0 "£imperial_influence_texticon НЕ: $JAP_army_faction$ є $JAP_imperial_influence_tier_1$"
 JAP_army_faction_tier_2_greater_1:0 "$JAP_imperial_influence_tier_2$ $JAP_army_faction$"
 JAP_battle_cruiser_1_desc:0 "Лінійні крейсери «Amagi» були серією запланованих крейсерів в рамках амбітного плану ВМС Японії мати вісім лінкорів і вісім крейсерів. Після підписання Вашинґтонського морського договору кораблі серії «Amagi» були списані на металобрухт, а один з них був переобладнаний на авіаносець."
 JAP_bicycle_battalions:0 "Велосипедні батальйони"
 JAP_central_agricultural_association:0 "Центральна сільськогосподарська асоціація"
 JAP_communist_sympathizer:0 "Комуністичні симпатії"
 JAP_contact_former_sakurakai_members:0 "Зв'язатися з колишніми членами Сакуракай"
 JAP_cracked_down_on_growing_pro_japanese_sentiment_opm:0 "Розправа над зростаючими прояпонськими настроями"
 JAP_democratic_war_with_manchukuo:0 "Довести справу до кінця"
 JAP_democratic_women_in_the_workforce_desc:0 "Стать тривалий час була визначальним фактором того, де особа повинна служити своїй країні: на фронті, на заводах чи вдома. Прагнучи до більш рівномірного розподілу навантаження, ми забезпечуємо більшу робочу силу, а також більшу армію, якщо виникне така потреба."
 JAP_destroyer_1_desc:0 "Есмінці класів «Minekaze», «Kamikaze» і «Mutsuki» були добре озброєні як надводними гарматами, так і торпедами для свого часу, але мали обмежений арсенал зенітної зброї. На початку Другої світової війни вони вважалися застарілими і були відведені на другорядні ролі."
 JAP_draft_the_showa_constitution:0 "[JAP_draft_the_showa_constitution_key]"
 JAP_east_asian_cooperative_society:0 "Східноазійське товариство співробітництва"
 JAP_emperor_hirohito_override_instant:0 "Поки цивільний уряд Японії очолює §H$JAP_keisuke_okada$§!, високошанований голова держави, Хірохіто, предсталяє собою втілення влади в державі.\n\nДопоки Імперія залишається ціла, численні фракції змагаються за §Hімперський вплив§!."
 JAP_establish_the_japanese_korean_army_desc:0 "З 1904 року Чьосен-ґун діяла як гарнізонна сила в Кореї, але не брала активної участі в бойових діях, окрім вторгнення в Маньчжурію в 1931 році. Ми повинні скасувати договори, які зв'язують наше корейське генерал-губернаторство, щоб розширити цю армію і використовувати її як повноцінну бойову силу."
 JAP_experimental_housing_solutions:0 "Експериментальні житлові рішення"
 JAP_fighter_modernization:0 "Модернізація винищувачів"
 JAP_form_the_yokusan_sonendan_desc:0 "Щоб захистити суверенітет нашої нації, нам потрібно більше людей, які не тільки готові воювати за нас, але й брати участь у силах самооборони для допомоги в питаннях цивільної оборони під керівництвом офіційної місцевої влади. З цією метою ми повинні сформувати елітне воєнізоване молодіжне відділення Асоціації допомоги трону — «Йокусан Сонендан»."
 JAP_formalize_the_tonarigumi_desc:0 "Сусідські асоціації існували неформально протягом досить тривалого часу, допомагаючи в розподілі нормованих товарів, розповсюдженні державних облігацій, гасінні пожеж, охороні здоров'я, цивільній обороні, поширенні пропаганди духовної мобілізації, інформуванні Токко про політичне інакомислення та спостереженні за узбережжям на предмет підозрілої активності. Ми повинні формалізувати їх, щоб мати змогу виділяти більше коштів на ці групи."
