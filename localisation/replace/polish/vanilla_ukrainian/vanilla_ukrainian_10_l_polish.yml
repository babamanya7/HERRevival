 BUL_the_fate_of_the_balkans_desc:0 "Болгарія занадто довго була підпорядкована волі сусідніх країн і великих європейських держав, які їх підтримують... Але часи змінилися, наша країна стала сильнішою, як жодна інша балканська держава, і Болгарія нарешті достатньо могутня, щоби стверджувати. її зверхність і підпорядкувати собі жалюгідні стани, які її оточують."
 BUL_the_fatherland_front_desc_planning:0 "Лідери §YВітчизняного фронту§! готують переворот.\nРано чи пізно вони будуть шукати підтримки фракцій [GetZvenoName], [GetBsName] та [GetBznsName].\nМи можемо зробити певні дії, щоби схуднути уряду:\n- Нейтралізувати та заарештувати лідерів §YВітчизняного фронту§!і співчуваючих йому.\n- Знищити або інтегрувати всі організації, з якими ті можуть вийти на зв'язок.\n- Маючи менше 1 од. §Yпідтримки комунізму§!, ми зможемо завдати вирішального удару §YВітчизняному фронту§!."
 BUL_the_salonika_agreement_desc:0 "Очевидно, що сама Болгарія не становить жодної загрози для народів, які утворили Балканську Антанту, щоб разом протистояти нашій країні, тому ми мусимо спробувати відновити дружні відносини з нашими сусідами, і що краще почати, ніж підписання угоди з лідер [GRE.GetNameDef], [GRE.GetLeader]?"
