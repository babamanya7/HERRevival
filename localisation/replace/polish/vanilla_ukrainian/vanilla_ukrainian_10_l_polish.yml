 china.110.d:0 "[From.GetLeader] і уряд держави [From.GetName] оголосили нам війну."
 china.15.d:0 "Після серії невеликих сутичок на околиці наших територій боротьба з Ґоміньданом, схоже, обернулася на нашу користь. Хоч утримання постійного натиску тяжко позначилось на наших військах і постачанні, зусилля були того варті.\n\nЖодних вирішальних битв ще не сталось, і ми зараз здобули повільну перемогу, що посилило віру в наші погляди й заново роздуло полум'я революції."
 claimed_bessarabia:0 "Претензії на Бессарабію"
 coastal_minelaying_overhead_protection:0 "Тренування зенітних екіпажів"
 collaboration_government_train_paramilitary_forces_outcome:0 "Наша команда організувала кілька надійних людей, у частини з яких є бойовий досвід, у невеликі мілітаризовані загони, які допоможуть охороняти тили нашої армії, що просувається."
 combat_stat_torpedoes_info:0 "§HТорпеди§!\n\nТорпеди найефективніше підходять для боротьби з §Yосновними кораблями§!, для них не має значення показник бронювання. Кількість торпед, запущених по противнику, залежить від його ефективності прикриття.\n"
 commando_desc:0 "§LУ командо чимало талантів: він розуміється на морському десанті, повітряному десанті та операціях у холодну погоду.§!"
 compliance_40:0 "Реорганізована робоча сила"
 congo_independence_struggle.19.d:0 "Ми отримали повідомлення, що [BEL.GetAdjective] війська почали мобілізацію в Льєпольдвілі, а також здійснюють зачистку серед нелояльних елементів по всій Силі Публіки. Попри наші найкращі зусилля змусити уряд [BEL.GetAdjective] підкоритись і досягти нашої мети незалежності без кровопролиття, колоніальні сили вирішили утримувати владу єдиним способом, який вони знають — через силу. Наші можливості швидко зникають, і ми повинні вирішити, чи наказати нашим прихильникам піднятися або відступити, перш ніж ситуація вийде з-під нашого контролю."
 constraining_hierarchy_spirit:0 "Обмежуюча ієрархія"
 continuous_air_production_desc:0 "Ми можемо реорганізувати нашу авіаційну промисловість, зменшивши надлишки та спростивши виробничий цикл."
 continuous_tech_share_group_name:0 "Дослідження альянсу"
 contribution_rule_applicability:0 ""
 control_caroline_islands_goal_name:0 "Контролювати Каролінські острови"
 control_persian_oil_goal_desc:0 "Контроль над нафтовими родовищами та потужностями з переробки Персії забезпечить безперервний потік палива для оперативних потреб."
 crid:0 "Центральний революційний відділ розслідувань"
 cruiser_c_class_aa:0 "Крейсер ППО класу «C»"
 custom_cost_joint_training_exercise_blocked:0 "£command_power£ §R25§!"
 cv_fighter_equipment_3_short:0 "Палуб. винищувач III"
 czech.24.d:0 "[From.GetLeader] відкидає нашу пропозицію передати Судетську область. Він не пояснив нам причини, але це [From.GetAdjective] рішення сильно стривожило наших військових, які вважають, що у німців є серйозні види на нашу країну."
 czech.4.d:0 "Наші відносини з Румунією завжди затьмарювало те, що вони володіють Бессарабією, яка повинна належати нам по праву, але тепер ціла держава заважає нам прийти на допомогу нашим союзникам. Ці союзники запропонували вирішити проблему раз і назавжди, поділивши територію Румунії між нами!"
 czech.8.d:0 "[From.GetNameDefCap] схвалює запропоноване нами рішення польської ситуації. Ми можемо розпочати кампанію, як тільки отримаємо наказ."
 dalmatia_communism:0 "Далматська комуна"
 dalmatia_democratic_ADJ:0 "Далматськ"
