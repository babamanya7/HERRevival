 CZE_align_slovak_catholics_desc:0 "Католицькі та націоналістичні партії наразі мають велику підтримку в Словаччині. Хоча домовитися з націоналістами буде важко без серйозних поступок, ми, можливо, зможемо згуртувати католицькі елементи навколо нашої справи."
