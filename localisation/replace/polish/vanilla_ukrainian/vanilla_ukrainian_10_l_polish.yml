 PER_ali_akbar_derakhshani:0 "Алі Акбар Дерахшані"
 PER_appease_the_seperatists:0 "Заспокоїти сепаратистів"
 PER_clamp_azerbaijani_dissidence_desc:0 "На півночі нашої країни проживає значне населення азербайджанців, які називають [PER.GetNameDef] своїм домом. Однак значна частина людей незадоволена нашим правлінням. Настав час покласти край цим повстанським осередкам та забезпечити повернення стабільності та процвітання в регіон."
 PER_communist_afghanistan_intervention:0 "Зірвати Велику гру"
 PER_communist_events.9.t:0 "[FROM.GetNameDefCap] пом'якшує риторику"
 PER_communist_events_4_tt:0 "§RНаші штати в Перській затоці можуть побачити посилення опору в найближчі місяці!§!"
 PER_enemy_war_reparations_idea:0 "Воєнні репарації"
 PER_establish_opec:0 "Створити ОПЕК"
 PER_expand_tehran_abbas_desc:0 "Ми повинні продовжувати розширення Трансіранської залізниці. Зосередимося на розширенні залізничного сполучення між містами Тегеран та Бендер-Аббас."
 PER_expand_tehran_emam_desc:0 "Ми повинні продовжувати розширення Трансіранської залізниці. Зосередимося на розширенні залізничного сполучення між містами Тегеран та Бандар-Шахпур."
 PER_force_abdication_desc:0 "Шах та його поплічники оговтуються від масового інакомислення серед народу. Настав момент скористатися нашою перевагою та змусити його зректися влади, щоб ми могли нарешті покласти край цій феодальній нісенітниці раз і назавжди."
 PER_foreign_policy_events.3.b:0 "Ми поважатимемо [PER.GetAdjective] незалежність."
 PER_form_savama_desc:0 "Тих зрадників, які відмовилися від нашої культури або працюють як оперативники іноземних держав, потрібно викорінити якомога швидше. З цією метою ми створимо нову спеціальну поліцейську силу."
 PER_german_tanks_desc:0 "Перш ніж ми зможемо думати про проєктування та виробництво власних механізованих сил, ми повинні звернути увагу на нації, які відомі своїм виробництвом танків. Звернувшись до [GER.GetNameDef], ми зможемо виробляти потужні танки, які прорізатимуть ворожі лінії, як гарячий ніж крізь масло."
 PER_gholamali_bayandor:0 "Голам Алі Баєндор"
 PER_homeland_not_fall_idea_desc:0 "Настав час довести нашу мужність і стійко протистояти тим, хто загрожує нашій батьківщині. Згуртуйте війська, вірте у своїх побратимів і готуйтеся боротися за майбутнє нашої країни. [PER.GetNameDefCap] не впаде перед цими агресорами! Змусьте їх тікати з піджатими хвостами!"
 PER_imperial_events.150.b:0 "Ми повинні продовжувати тиснути! Ми переможемо!"
 PER_imperial_events.152.desc:0 "Настав темний день. Наш ворог вирішив продовжувати просування на нашу територію, незважаючи на їхні втрати та наші вимоги миру. Якщо вони хочуть бійки, то вони її отримають."
 PER_imperial_events.160.a:0 "Ситуація не на нашу користь..."
 PER_imperial_events.162.desc:0 "Настав темний день. Наш ворог вирішив продовжувати просування на нашу територію, незважаючи на їхні втрати та наші вимоги миру. Їхнє небажання платити за свої провини є образою всього, що сталося тут. Якщо вони хочуть бійки, то вони її отримають."
 PER_imperial_events.211.a:0 "Ці дурні..."
 PER_imperial_events.232.a:0 "Шкода, але тепер ми повинні коронувати нового шаха-Каджара."
 PER_imperial_events.233.desc:0 "Сьогодні вранці, під час пишної церемонії коронації в [FROM.Capital.GetCapitalVictoryPointName], Мохаммад Хассан Мірза був коронований новим шахом [PER.GetNameDef]. Після багатьох десятиліть правління Пехлеві, Каджар знову є керівним монархом цієї великої нації. Наші зусилля з відновлення династії Каджарів сподобалися [ENG.GetAdjective] уряду, який сподівається, що це дозволить їм мати більший вплив на свої інтереси в [PER.GetNameDef]."
 PER_islamic_restoration_desc:0 "Недавній запал до вестернізації руйнує самі основи нашої ісламської культури та іранського суспільства в цілому. Тому уряд повинен робити більше, щоб обмежити доступ до вад Заходу та їхніх невіруючих ідеологій."
 PER_karim_buzarjamehri:0 "Карім Бузарджомехрі"
 PER_kur_azr_indy_war_started:0 "Війна за незалежність розпочалася."
 PER_legacy_of_greatness:0 "Спадщина величі"
 PER_military_excellency:0 "[PER.GetAdjective] Військова досконалість"
 PER_new_shah_tt:0 "§Y$PER_mohammed_reza_pahlavi$§! стає лідером §Y$PER_neutrality_party$§!"
 PER_our_place_in_empire:0 "Наше місце з [ROOT.OVERLORD.GetNameDef]"
 PER_persepolis_idea:0 "Відбудований Персеполіс"
 PER_prepare_military:0 "Довести військову міць"
 PER_restructure_army_desc:0 "Наша армія ослаблена нескінченними роками війни з Росією під командуванням династії Каджарів. Враховуючи стан, у якому перебуває світ сьогодні, було б розумно відновити наші збройні сили до їхньої колишньої слави."
 PER_revival_party_dem:0 "Hezb-e Tajaddod"
 PER_sell_oil:0 "Продати [PER.GetAdjective] нафту до [FROM.GetNameDef]"
 PER_shahanshah_trait:0 "Шаханшах"
 PER_ssb_events.4.t:0 "[FROM.GetNameDefCap] пропонує економічну інтеграцію"
 PER_the_unification_initiative_desc:0 "[PER.GetNameDefCap] бореться вже кілька років, особливо коли справа доходить до об'єднання населення під одним прапором. З курдським та азербайджанським інакомисленням, що спричиняє проблеми на заході, та духовенством, що чинить опір релігійним реформам, нам доведеться докласти чимало зусиль, якщо ми хочемо об'єднати [PER.GetNameDef] раз і назавжди."
 PER_there_can_be_only_one:0 "Може бути тільки Один"
 PER_war_plan_xerxes_idea:0 "Військовий план Ксеркса"
 PER_white_revolution_idea:0 "Запуск Білої революції"
 PHASE_DISPLAY:0 "$NAME$"
 PHI_anti_hacendados_desc:0 "Багата земельна еліта, успадкована від іспанської колоніальної епохи, занадто довго пригнічувала своїх орендарів. Ми повинні зруйнувати цю застарілу інституцію і повернути землю тим, хто її обробляє. Тільки так ми зможемо модернізувати нашу економіку і позбутися цих п'явок."
 PHI_asean_tag_communism_DEF:0 "Союз держав Південно-Східної Азії"
 PHI_autonomy_collaboration_government:0 "$OVERLORDADJ$і $NONIDEOLOGY$"
 PHI_claim_to_core_tt:0 "Розблоковує рішення §YОтримати національні території§! після того, як ми візьмемо їх під контроль."
 PHI_clock_tt:0 "Прискорені фокуси позначено маленькою піктограмою годинника."
 PHI_coastal_artillery_desc:0 "Безсумнівно, що в ланцюгу островів підрозділом із найбільшою кількістю доступних цілей є берегова артилерія, здатна вражати цілі як на суші, так і на морі. Інвестиції в оснащення, навчання та модернізацію цих підрозділів мають бути пріоритетом."
 PHI_courtney_whitney:0 "Courtney Whitney"
 PHI_defense_strategy_dynamic_modifier:0 "Оборонна стратегія"
 PHI_form_the_executive_commision_desc:0 "Тіньова кабала лідерів смикала за ниточки на задньому плані, але тепер, коли фашистський ідеал прийшов до влади на Філіппінах, настав час для цих осіб вийти на світло і зайняти своє законне місце на чолі уряду."
 PHI_hispanic_empire_tag:0 "Гіспанська імперія"
 PHI_hispanic_empire_tag_communism_DEF:0 "Гіспанський союз"
 PHI_hispanic_overtures_desc:0 "Ми не єдина нація у світі, що має іспанські зв'язки; насправді значна частина Південної Америки їх має, і ми продовжуємо підтримувати позитивні відносини з кількома з них. Ми повинні зробити крок назустріч і спробувати зробити ці зв'язки більш офіційними."
 PHI_marine_corps_desc:0 "Ми маємо великий досвід висадки на берег і відчалювання, оскільки багатьом людям у нашій громаді навіть доводиться користуватися поромами або просто веслувати між островами для роботи чи відвідування сімей. Ми можемо використати цей досвід і перетворити його на провідний у світі корпус морської піхоти, із солдатами, здатними дати бій на будь-якому березі, іноземному чи власному."
 PHI_mineral_prospecting_desc:0 "Дехто сказав би, що нам винятково пощастило з розвідкою корисних копалин, оскільки ми так легко натрапили на великі поклади золота. Однак для економіки небезпечно настільки залежати лише від одного ресурсу, як Іспанська імперія зрозуміла надто пізно. Ми повинні вкласти більше ресурсів у відкриття інших мінералів. Хто знає, що ще може приховувати наша земля?"
 PHI_national_defense_act:0 "Закон про національну оборону"
 PHI_national_fiscal_policy_desc:0 "Оскільки наша нація твердо стала на шлях до незалежності, одне з перших завдань — від'єднати наші фінанси від фінансів Сполучених Штатів, розробити власний бюджет, а також засоби для залучення коштів через оподаткування."
 PHI_pedro_p_baguisa:0 "Педро П. Багіса"
 PHI_reino_de_filipinas_desc:0 "Всі частини стають на свої місця, і поки сама Іспанія розколота внутрішніми чварами, Філіппіни піднялися, щоб стати серцем іспаномовного світу. Нам просто бракує коронації, щоб закріпити нашу позицію; це стане вінценосним моментом у нашій історії."
 PHI_revision_of_taxation_laws_desc:0 "Тепер, коли ми відокремилися від Сполучених Штатів, нам потрібно розробити власний податковий кодекс, розширюючи тим самим нашу податкову базу, що призведе до збільшення державних доходів, які потім можна буде реінвестувати в державні послуги, такі як інфраструктура, соціальне забезпечення, армія та інші схеми розвитку."
 PHI_sent_away:0 "Висланий під [USA.GetAdjective]им тиском"
 PHI_thomas_hart:0 "Thomas Hart"
 PHI_weapons_of_war_desc:0 "Щоб найкраще зберегти наші демократичні ідеали, ми повинні переконатися, що ми оснащені абсолютно найкращою, найнебезпечнішою зброєю. Ми чули чутки про певний «Мангеттенський проєкт». Так сталося, що одна філіппінка працює над цим проєктом, і як добра, вірна людина, вона готова допомогти нам із нашим власним проєктом."
 PLAYTHROUGH_STATS_STARTING_DATE:0 "Почато $DATE$"
 PLAYTHROUGH_STATS_TITLE:0 "Огляд проходження"
 PNG_fascism:0 "Папуа"
 POK_DEF:0 "Понтіанак"
 POLITICS_JUSTIFY_WARGOAL:0 "§TДержава $OWNER|H$ виправдовує ціль війни $TYPE|H$ проти держави $TARGET|H$§!"
 POLITICS_REPLACE_IDEA_DESC:0 "Ви справді хочете замінити ідею $OLD_IDEA|Y$ на $NEW_IDEA|Y$ за £pol_power $COST|-0$?"
 POLITICS_REPLACE_IDEA_POLITICAL_POWER_DESC:0 "Ви справді хочете замінити ідею $OLD_IDEA|Y$ на $NEW_IDEA|Y$ за £pol_power $COST|-0$?"
 POLITICS_TIMED_ACTIVITY_WARGOAL_DESC:0 "§TКоли $OWNER|H$ завершить виправдання цілі війни, то зможе оголосити війну країні $TARGET|H$§!"
 POL_KPP_focus_desc:0 "КПП — це партія революціонерів, готових до рішучих дій, необхідних для побудови соціалізму в Польщі. Хоча дехто з тих, хто був вірний Санації, відтоді змінив свою прихильність, ми не можемо довірити їм місце в нашому уряді, і вони повинні бути замінені нашими товаришами-революціонерами."
 POL_NATDEM_fascism_DEF:0 "Польська національна республіка"
 POL_STATE_154:0 "Край Зацісанський"
 POL_anti_soviet_offensive_desc:0 "Польські війська отримали вузькоспеціалізовані плани протидії [SOV.GetAdjective]ому наступу в цій державі."
 POL_april_constitution_1_desc:0 "Цей законодавчий акт був прийнятий Сеймом у 1935 році з метою забезпечення тривалого миру та стабільності польської держави. Конституція надає майже повну владу Президенту, забезпечуючи йому верховенство над Сеймом і Сенатом."
 POL_april_constitution_2:0 "$POL_april_constitution_1$"
 POL_april_constitution_2_desc:0 "$POL_april_constitution_1_desc$"
 POL_april_constitution_dem_1:0 "$POL_april_constitution_dem$"
 POL_cv_CAS_equipment_2_short:0 "Sum Floty"
 POL_cv_fighter_equipment_1_short:0 "Jastrząb Floty"
 POL_defensive_plans_desc:0 ""
 POL_delay_strike_70_days_tt:0 "§YСелянський страйк§! буде відкладений на §Y70 днів§!, коли цей фокус обраний."
 POL_demand_pomerania_desc:0 "Померанія колись була частиною польської держави, а зараз залишається в руках Німеччини. Хоча мало хто вірить, що у нас є шанс, ми повинні кинути жереб і взяти те, що належить нам."
 POL_draft_a_new_constitution_desc:0 "Славек давно мріє внести зміни до Конституції Польщі, і, отримавши таке право, він може надати нам більш прямий контроль над польською державою і ще більше вдосконалити Квітневу конституцію."
 POL_ease_sanationist_tensions:0 "Полегшити санаціоністську напруженість"
 POL_empowered_sejm_idea:0 "Уповноважений Сейм"
 POL_expand_northern_rail_desc:0 "Всі польські товари повинні в'їжджати і виїжджати через Північ, але тамтешня інфраструктура далека від того, якою вона могла б бути. Північ повинна отримати належну залізничну інфраструктуру."
 POL_expand_poznan_forts:0 "Розширити познанські укріплення"
 POL_fight_against_monarchy_in_LIT_cat_desc:0 "Іноземний агент намагається претендувати на [Root.GetAdjective]ий трон, шукаючи внутрішньої підтримки в нашому уряді. Якщо ми зможемо утримати народну і внутрішню підтримку на низькому рівні, ми зможемо повністю підірвати питання про їхні претензії.\n\nПоточна сила претензії становить [Root.GetPolRoyalClaimStrength]."
 POL_fight_capitalism_decisions:0 "Антикапіталістична революція"
 POL_fighter_modernisation:0 "Модернізація винищувачів"
 POL_foreign_naval_support:0 "Іноземна підтримка флоту"
 POL_habsburg_events.102.t:0 "[From.GetNameDefCap] відмовляється"
 POL_heavy_cruiser_1:0 "Клас «Niemen»"
 POL_heavy_tank_equipment_3_short:0 "Bestia"
 POL_hungary_scope_no_vojvodina_tt:0 "@HUN $HUN|Y$:"
 POL_import_submarine_technology:0 "ORP Orzeł"
 POL_internal_romanian_support:0 "Шукати внутрішню румунську підтримку"
 POL_internationalism:0 "$internationalism$"
 POL_invite_ford:0 "Запросити «Ford Motors»"
 POL_invite_ford_desc:0 "Дешева, ефективна й американська компанія «Ford Motors» здатна масово виробляти моторне обладнання з неперевершеною швидкістю."
 POL_light_ship_engine_2:0 "«Parsons» 54 000 к. с. н. в."
 POL_lithuanian_ultimatum_desc:0 "Протягом багатьох років ми офіційно перебуваємо у стані війни з литовцями, хоча з моменту анексії Вільнюса ніхто не вдавався до агресивних дій. В той час, як Німеччина просувається по всьому континенту, беручи все, що їй заманеться, лише погрожуючи війною, можливо, ми можемо зробити те ж саме з Литвою, вимагаючи припинення цих бойових дій заради обох наших народів."
 POL_medium_bomber_focus_desc:0 "Розширення філософії високоточного бомбардування, адаптоване для більшої дальності для використання в ролі засобів підтримки."
 POL_medium_tank_equipment_2_short:0 "14TP"
 POL_nationwide_fascist_displays:0 "Загальнонаціональні фашистські демонстрації"
 POL_new_military_academy:0 "Нова військова академія"
 POL_organize_the_peasants_strike_desc:0 "Польща розділена кров'ю селян. По всій польській сільській місцевості селяни радикалізуються через зловмисну недбалість уряду. [POL.GetLeader] неминуче доведе страйки до насильства, тому ми повинні підготувати пролетаріат до повстання проти своїх гнобителів."
 POL_peasant_communities:0 "Селянські громади"
 POL_polish_peoples_republic_desc_default:0 "Польща — одна з найбільш індустріально розвинених і незалежних країн-членів СРСР, тому цілком природно, що ми користуємося вищим ступенем автономії."
 POL_polish_revanchism:0 "Польський реваншизм"
 POL_prepare_for_the_next_war:0 "Підготовка до наступної війни"
 POL_raid_nazi_resistance_desc:0 "У місті є ті, хто віддасть ключі від своєї свободи нацистам і зробить місто підпорядкованим Берліну. Ці елементи мусять бути усунуті з міста будь-якою ціною, хоча жорсткі військові дії можуть мати негативний вплив на те, як нас сприймають місцеві жителі."
 POL_rocket_development:0 "Розробка ракет"
 POL_royal_officer_corps_desc:0 "Як король і генерал, Карл Альбрехт є яскравим прикладом того, яким повинен бути польський шляхтич. Можливо, усім нашим офіцерам слід навчатися військовому мистецтву так, як це робив наш король — в окопах."
 POL_ruthenian_army_desc:0 "Як серед поляків, так і серед українців на сході відчутні антирадянські настрої. За умови фінансування та військового керівництва ці воєнізовані організації могли б стати чудовим доповненням до наших армій."
 POL_sabotage_polish_industry:0 "Саботувати польську промисловість"
 POL_sanation_right_irritation:0 "Праві санаціоністи роздратовані"
 POL_sanation_right_leader:0 "Лідер правої санації"
 POL_sanation_right_opposition_2:0 "Помірна опозиція правої санації"
 POL_sergiusz_zahorski:0 "Серґіуш Загорський"
 POL_sideline_the_sanacja_desc:0 "Фаланга й Ендеція стали досить впливовими в польському уряді, і якщо вони почнуть тісніше співпрацювати, то Санація може втратити значний політичний капітал і зробити себе вразливою до державного перевороту."
 POL_study_foreign_built_ships:0 "Вивчення дизайнів британських кораблів"
 POL_study_foreign_tanks:0 "Вивчення іноземних танків"
 POL_sudeten_mountaineers:0 "Судетські гірські стрільці"
 POL_support_monarchism_in_LIT_desc:0 "Як і Польща, Литва мала обрати собі нового короля. Однак, на відміну від Польщі, чесні вибори були оголошені німцями нелегітимними, але ми можемо забезпечити литовцям сильного правителя, якого вони обіцяли; того, хто захистить Литву від німецького імперіалізму."
 POL_support_right_paramilitaries_desc:0 "Фалангістів у польському політичному ландшафті часто описують як фанатиків, фашистів і навіть порівнюють з нацистами, але їхня риторика приваблює польських патріотів, а Єжи Рутковський пропонує створити воєнізоване формування з молодих добровольців, готових боротися і вмирати за незалежність Польщі."
 POL_the_cyclometer:0 "Циклометр"
 POL_the_four_year_plan_desc:0 "Нам потрібно спланувати розширення нашої інфраструктури, щоби забезпечити нашу промисловість усім необхідним не тільки зараз, а й у майбутньому."
 POL_volunteer_corps_desc:0 "Свобода не може бути примусовою для тих, хто не бажає, інакше вона перетвориться на пародію. Однак тим, хто добровільно бере до рук зброю для захисту свободи, необхідно надати засоби для цього."
 POL_warsaw_to_crimea_railway:0 "Залізниця від Варшави до Криму"
 POL_wincenty_witos:0 "Вінцентій Вітос"
 POL_witold_pilecki:0 "Вітольд Пілецький"
 POR_advanced_artillery_desc:0 "Ми повинні розробити нове артилерійське озброєння та навчити війська ефективнішим способам обстрілу та підтримки наступу піхоти."
 POR_allow_free_elections:0 "Дозволити вільні вибори"
 POR_british_influence_desc:0 "Британський уряд інвестує в експлуатацію ресурсів у нашій країні. Це цінна можливість поліпшити дослідження, які ми проводимо."
 POR_buy_ships_italy:0 "Надіслати пропозицію про придбання [ITA.GetAdjective]их кораблів"
 POR_cooperate_with_french_militants_desc:0 "Наші товариші у Франції відчайдушно потребують допомоги в боротьбі проти фашистських націй, які загарбають їхню країну. Ми повинні забезпечити їх зброєю, обладнанням і боєприпасами, щоб вони мали шанс у своїй боротьбі."
 POR_deal_with_fascism:0 "Справитися з фашизмом"
 POR_defend_the_borders_desc:0 "Небезпека вторгнення існує завжди, і ми маємо довгі кордони, які потрібно захищати по всій нашій території. Нам потрібно побудувати відповідні укріплення, щоб протистояти будь-якому можливому вторгненню."
 POR_develop_north_angola:0 "Розвинути Північну Анґолу"
 POR_extraction_industries:0 "Видобувна промисловість"
 POR_humberto_carmona:0 "Умберту Кармона"
 POR_iberian_summit_in_progress_flag:0 " Іберійський самміт триває"
 POR_iberian_summit_pro_axis_desc:0 "[GER.GetFactionName] стане домінуючою силою в Європі. Ми повинні приєднатися до них, перш ніж вони вирішать взяти під прямий контроль нашу територію і ресурси.\nМи надішлемо послання [GetIberianSummitReceiverName]ії, закликаючи її обговорити спільну пропозицію з проханням до держави [GER.GetNameDef] прийняти нас до альянсу [GER.GetFactionName]."
 POR_latin_american_communism:0 "Латиноамериканський комунізм"
 POR_medium_tank_destroyer_equipment_3:0 "Destruidor de Tanques 6"
 POR_medium_tank_equipment_1:0 "Carro de Combate 3"
 POR_military_vehicles_desc:0 "Нашій армії для майбутніх боїв потрібна сучасна техніка. Якщо ми хочемо перемогти в майбутніх конфліктах, ми маємо забезпечити, щоб вони отримували адекватне постачання найвищої якості."
 POR_national_syndicalism:0 "Націонал-синдикалізм"
 POR_observation_mission:0 "Спостережна делегація"
