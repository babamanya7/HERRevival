 MTG_naval_treaty.11.t:0 "Морська угода скасована"
 MTG_naval_treaty.3.a:0 "«Не була досягнута» — все ж надто сильно сказано."
 MUN_czech.1005.d:0 "Оскільки [FROM.GetNameDef] невпинно розширює свою територію, їхні представники прибули, щоб вимагати передачі їм земель, якими колись володіли [FROM.GetAdjective]і дворяни. Вони кажуть, що це дасть їм потенційний вихід до Адріатики, і, схоже, їх не надто цікавлять наші думки з цього приводу."
 MUN_czech.1008.b:0 "Від нас не варто очікувати захисту всієї Європи"
 MUN_czech.1018.t.2:0 "Спільне вторгнення у [GER.GetNameDef]"
 MUN_czech.1028.a:0 "Ми не маємо часу на зволікання!"
 MUN_czech.1041.t:0 "[FROM.getname] відхиляє Договір про митний союз"
 MUN_czech.1045.t:0 "[FROM.getname] погоджується приєднатися до Федерації"
 MUN_czech.1048.d3:0 "Нашу пропозицію щодо пакту про ненапад [FROM.GetAdjective]і представники сприйняли з миттєвим ентузіазмом; схоже, їхні амбіції наразі зосереджені деінде."
 MUN_czech.1050.d:0 "Наші дипломати повернулися з [FROM.GetNameDef] із невтішною новиною: наш запит на приєднання до їхнього альянсу було відхилено. Хоча причини залишаються неясними, зараз ми опинилися в складній ситуації, коли розкрили свої занепокоєння щодо наших традиційних союзників, так і не зумівши здобути нового."
 MUN_czech_bop.2.d.2:0 "Нещодавні новини про те, що деякі з наших сусідів розпочали програми зі значного розширення своїх збройних сил, налякали декого з наших військових і політичних лідерів. Багато хто вірить в альянси, які країна уклала з іншими державами, та підготовку, яку наразі проводить армія для протистояння можливій іноземній загрозі. Дехто, однак, не настільки впевнений, що ми зможемо вистояти перед лицем можливої іноземної агресії."
 MUN_czech_bop.4.b:0 "Це не варте можливих наслідків"
 MUN_czech_bop.5.d:0 "Після розмови з представниками чеського уряду $CZE_zbrojovka_brno_organization$ отримала таємний дозвіл почати контрабанду невеликої кількості стрілецької зброї до країни. Їхній досвід також буде доступний нам через наші таємні канали."
