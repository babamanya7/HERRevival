 IRQ_decoupled_from_the_pound:0 "Decoupled from the Pound"
 IRQ_fligerfuhrer_irak_desc:0 "Наші військові залишаються безнадійно менш озброєними, ніж [ENG.GetAdjective], але ми можемо схилити шальки терезів на нашу користь за допомогою літаків та пілотів від наших союзників."
