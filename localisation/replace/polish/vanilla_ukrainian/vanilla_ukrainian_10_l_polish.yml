 BEL_beligca_fascism_ADJ:0 "Белґіцьк"
 BEL_boelwerf_desc:0 "Булверф — одне з найбільших суднобудівних підприємств Антверпена, і ми повинні використати їхні можливості, а також інвестувати більше в розширення їхніх доків, щоб ми могли швидше зміцнити нашу морську силу."
 BEL_broken_neutrality_desc:0 "Наше оголошення нейтралітету служило нашій нації добре і дозволило нам досягти позиції сили. Тепер ми можемо скинути ці кайдани та провести [BEL.GetNameDef] в нову еру."
 BEL_center_of_nuclear_chemistry_desc:0 "Ми уважно слідкуємо за теоріями Оппенгаймера, Гайзенберґа та Бора і вирішили, що нам варто розглянути застосування цієї науки для себе. Адже ми одні з небагатьох країн, які мають легкий доступ до урану з Конґо."
 BEL_collapsing_government_ns:0 "Колапс уряду"
 BEL_currently_undertaking_gov_4_action_flag:0 "Наразі здійснює чотири заходи уряду"
 BEL_defensive_neutrality_capstone_ns_desc:0 "Ми зробили все, що могли, щоб підготуватися до вторгнення, тепер залишається лише визначити більше стратегічних і високорівневих доктринальних змін, спрямованих на найсучасніші принципи оборонної думки."
