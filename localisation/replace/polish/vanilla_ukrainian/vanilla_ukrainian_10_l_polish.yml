 GER_mefo_bills_extension_timer:0 "До терміну сплати векселів «MEFO»"
 GER_middle_eastern_trade_cat_desc:0 "Близький Схід — багатий на ресурси регіон, а найголовніше — нафтою. Ми можемо отримати значну вигоду від торгівлі з цими країнами. Ми забезпечили б постійний потік життєво важливих ресурсів собі і одночасно позбавили б тих самих ресурсів наших ворогів, зміцнюючи нас і послаблюючи їх."
