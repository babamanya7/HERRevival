 DEN_motorized_equipment_0:0 "Triangel 3½ T"
 DEN_nordic_security_category:0 "Безпека Нордичного фронту"
 DEN_north_sea_oil_drilling_desc:0 "Геологорозвідники виявили поклади нафти за межами узбережжя Нуррейланду. Якби ми змогли видобути ці запаси, то стали б менш залежними від мінливого торгового ринку і стали б більш самодостатніми."
 DEN_pledge_allegiance_desc:0 "Щоб мати можливість повною мірою скористатися перевагами наших відносин з [?DEN.DEN_overlord_nation.GetNameDef], ми повинні присягнути їм на вірність — не залишаючи їм сумнівів у нашій щирості в наших амбіціях створити симбіотичне партнерство, в якому обидві нації можуть розвиватися і отримувати вигоду."
 DEN_policy_of_disarmament_desc:0 "Ми проводимо політику роззброєння вже кілька десятиліть, що є однією з причин, чому ми уникли жахів Великої війни. Виглядаючи незагрозливими для будь-якого сусіда, ми можемо бути врятовані і цього разу."
