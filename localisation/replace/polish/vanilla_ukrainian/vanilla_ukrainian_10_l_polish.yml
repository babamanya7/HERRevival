 germany.1041.t:0 "[FROM.GetNameDefCap] вимагає Судетську область"
 germany.1042.desc:0 "[ROOT.GetAdjective]а міць не знає кордонів. Уся Судетська область була передана нам. [FROM.GetAdjective]а нація залишається поза нашим поглядом. Поки що."
 germany.11.b:0 "Жодних угод із фашистами!"
 germany.124.d:0 "Зіткнувшись із перспективою війни з нами, держава [From.GetNameDef] погодилася передати повний контроль над Судетською областю, а також відкликати будь-які подальші претензії на регіон.\n\n[ROOT.GetAdjective]е населення Судетів нарешті безпечно повернеться під захист держави [ROOT.GetNameDef]."
 germany.13.d:0 "[SOV.GetNameDefCap] відмовився підписувати наш пакт про ненапад! Це ускладнює ситуацію, оскільки ми не зможемо рішуче розквитатися з Польщею та Францією без ризику втручання з боку більшовиків."
 germany.24.c:0 "Ні, наші радники залишаться, як ми пообіцяли китайцям."
 germany.40.b:0 "Потрібно захистити Чехословаччину!"
 germany.55.c:0 "Уся Чехословаччина належить Райху!"
 germany.6.t:0 "Троїстий пакт"
 germany.60.t:0 "Ремілітаризація Райнланду"
 germany.65.d:0 "Британці та французи відмовилися дозволити нам ремілітаризувати Райнланд, назвавши це «непростимим порушенням» умов Версальського договору. Вони мобілізовують війська для війни проти нас і надіслали ультиматум про виведення військ і збереження демілітаризованого статусу Райнланду. В іншому випадку почнеться війна."
 germany.66.t:0 "Франція мобілізовує війська!"
