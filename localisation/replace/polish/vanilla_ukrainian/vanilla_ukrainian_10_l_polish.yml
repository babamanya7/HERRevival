 trade_interdiction_desc:0 "Чим раніше ми виявимо ворожі судна, тим швидше зможемо їх знищити. Ми знищимо кораблі і сховаємось перш, ніж супротивник встигне відреагувати.\n\n"
 trait_JAP_kodoha_sympathizer_desc:0 "Цей персонаж є прихильником фракції Імперського шляху."
 trait_SOV_foreign_military_advisor:0 "Іноземний військовий радник"
 treaty_org.1.b:0 "Нам не потрібна нова війна..."
 treaty_org.1.desc:0 "Коли з безпосередньою світовою загрозою було покінчено, напружені домовленості між державою [SOV.GetNameDef] та союзниками на Заході почали розпадатися.\n\nПобоюючися безповоротного розриву зв'язків на додачу до суперечливих амбіцій у Європі — про що свідчать останні події на сході Німеччини, — держава [FROM.GetNameDef] запропонувала договір взаємної допомоги під час квапливої конференції в Брюсселі."
 troops_on_our_borders:0 "Війська на нашому кордоні:"
