 ITA_giuseppe_de_stefanis:0 "Джузеппе де Стефаніс"
 ITA_giuseppe_pieche:0 "Джузеппе П'єке"
 ITA_grande_rivolta_rurale_desc:0 "Настав час італійському селянству приєднатися до нашої справи та взяти в руки зброю проти фашистських гнобителів. У ворога більше не буде шансів у сільській місцевості!"
