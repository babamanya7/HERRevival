 SIA_the_peoples_day_desc:0 "Замість того, щоб ще більше наголошувати на ролі військових у поваленні старої монархії, ми повинні підвищити роль самого народу. Встановлення Дня Народу згуртує націю і навчить наших громадян не погоджуватися на менше."
 SIA_the_thunder_at_the_gates_desc:0 "Існують фортеці, які звичайні гармати не можуть пробити, і атаки, які повинні бути заявлені з непереборною силою. Важка артилерія, облогові гармати та залізничні гармати дадуть [ROOT.GetNameDef] міць, щоб розбити ворота будь-якого ворога, який сприйме нашу стриманість за слабкість."
 SIA_united_against_aggression_tt:0 "Отримайте:\n$army_defence_factor_tt$ §G[?var:SIA_adc_army_defence_factor_per_country|%]§!\n$max_dig_in_factor_tt$ §G[?var:SIA_adc_max_dig_in_factor_per_country|%]§!\n$army_org_factor_tt$ §G[?var:SIA_adc_army_org_factor_per_country|%]§!\nза кожного члена фракції у нашій фракції."
 SIA_yield_the_air_war_desc:0 "Ми не можемо сподіватися кинути виклик великим державам у небі на рівних умовах. Замість того, щоб марнувати дорогоцінні ресурси у змаганні, в якому ми навряд чи виграємо, ми зміцнимо нашу протиповітряну оборону і позбавимо ворожі літаки свободи безкарно бити по наших людях і містах."
