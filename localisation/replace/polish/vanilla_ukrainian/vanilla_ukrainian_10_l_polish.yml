 JAP_increase_agricultural_export_desc:0 "З моменту придбання нами цієї території Корея функціонувала як житниця для нашої імперії. Ми повинні посилити наші зусилля для розширення цієї галузі, щоб їхні продукти могли експортуватися по всій державі."
 JAP_infantry_equipment_0_short:0 "Type 38"
 JAP_integrate_the_kenkokutai:0 "Інтеграція Кенкокукай"
 JAP_integrate_the_kenkokutai_desc:0 "Товариство національного заснування (Кенкокукай) — це антикомуністична організація, що перебуває під сильним впливом націонал-соціалізму Мотоюкі Такабатаке і прагне створення справжньої народної держави, заснованої на єдності між народом та імператором. Ми повинні залучити їх до нашого уряду, оскільки ми маємо схожі цілі."
