 ENG_heavy_tank_equipment_2:0 "Churchill"
 ENG_henry_wilson:0 "Генрі Вілсон"
 ENG_imperial_federation_india_unified_communism_DEF:0 "Співдружність народів"
 ENG_james_somerville:0 "Джеймс Сомервілл"
 ENG_john_cockcroft:0 "Джон Коккрофт"
 ENG_joint_air_training_scheme_desc:0 "Британський уряд запустив глобальну програму навчання своїх пілотів. Ми зможемо отримати з цього велику вигоду."
 ENG_light_cruiser_4_desc:0 "Також відомі як клас «Swiftsure», ці крейсери були розроблені як модифікована версія класу Crown Colony, що включає військові модифікації, які були дозволені в 1941 році. Вони мали більший радіус дії та більшу кількість зенітної зброї, ніж клас «Crown Colony», тоді як основні озброєння скорочено до трьох потрійних башт. Побудовані надто пізно, щоб вплинути на результат війни, більшість замовлених суден були згодом скасовані."
 ENG_light_tank_equipment_3_short:0 "Valentine"
 ENG_mechanized_equipment_1_short:0 "Bren Carrier"
 ENG_nuclear_missile_equipment_1_short:0 "Blue Streak"
 ENG_pre_empt_spanish_alignment:0 "Завадити зближенню Іспанії з Німеччиною"
 ENG_propaganda_campaigns_in_australia_desc:0 "Ми запустимо потужну кампанію пропаганди, щоби розповісти народу Австралії про некомпетентність його уряду та необхідність керівної ролі Британії."
