 RAJ_form_ties_with_leftist_parties_desc:0 "Нам потрібно зібрати підтримку від соціалістів та комуністів у країні."
 RAJ_freedom_of_the_press_desc:0 "Свобода преси є вимогою для будь-якої молодої демократії, без неї авторитаризм не за горами."
 RAJ_heavy_fighter_equipment_2_short:0 "Beaufighter"
 RAJ_hidden_pressure_PAK:0 ""
 RAJ_hidden_pressure_PAK_BAN_does_not_exist:0 "\nНаш тиск на [THIS.GetName]: §G[?THIS.PAK_pressure]§!\nТиск [RAJ.GetAdjective] на [THIS.GetName]: §YНевідомо§!"
 RAJ_i_am_death_desc:0 "Наш лідер, занурений у транс після замаху, вийшов із нього. Роздумуючи про жорстокість свого випробування, він мав прозріння: якщо не можна запобігти жорстокості людства, то все людство має бути під його твердим демократичним контролем."
 RAJ_indian_gentleman_officers_desc:0 "Для забезпечення майбутнього та безпеки нашої великої Імперської Перлини вкрай важливо, щоб ми залучили лояльних людей для керівництва нашою новою [RAJ.GetAdjective] армією. Ці люди, завдяки тісній співпраці з імперською владою, добре служили [RAJ.GetNameDef], щоб бути зарахованими до наших найбільш довірених командирів."
 RAJ_institutional_money_laundering_desc:0 "Інвесторам не потрібно знати, куди насправді йдуть гроші, чи не так? Хіба не наша мета, ні, імператив максимізувати прибутки за будь-яку ціну? Ну і що, якщо це включає невелике шахрайство? Вони ніколи про це не дізнаються."
 RAJ_jet_fighter_equipment_2:0 "de Havilland Vampire"
 RAJ_join_the_shadow_scheme_desc:0 "Беручи участь у таємних операціях, ми можемо розширити наші розвідувальні можливості та зміцнити наше стратегічне становище."
 RAJ_light_tank_equipment_3_short:0 "Valentine"
 RAJ_lions_of_the_great_war__desc:0 "Жертви індійських солдатів у Великій війні є свідченням їхньої доблесті. Вшановуючи їхню спадщину, ми вшановуємо їхню мужність та надихаємо нове покоління підтримувати їхній дух у боротьбі за долю Індії."
 RAJ_local_resistance_to_land_taxes:0 "Місцевий опір земельним податкам"
 RAJ_manipulate_army_statistics:0 "Маніпулювати армійською статистикою"
 RAJ_mio_trait_apc_research_effort:0 "Дослідження бронетранспортерів"
 RAJ_mio_trait_ordnance_factory_kanpur_uttar_pradesh_art:0 "Збройовий завод у Канпурі"
 RAJ_mughal_shortcut:0 "Політика:\nМоголи"
 RAJ_navy_funding_desc:0 "Королівські ВМС Індії отримають додаткове фінансування й оснащення з Великої Британії."
 RAJ_neutrality_party_long:0 "Британське імперське правління"
 RAJ_propaganda_in_target_desc:0 "Наша ціль визначена, тепер нам лише потрібно забезпечити наших соціалістичних союзників ефективною пропагандою, і незабаром ми посіємо насіння бунту, необхідні для повалення старого порядку та закріплення Азії як червоного бастіону."
 RAJ_red_punjab_operation_decision_tt:0 "\nУ разі перемоги ми отримаємо контроль над державою та скасуємо перемир’я з §Y[PAK.GetName]§!\n\n"
 RAJ_royal_indian_air_force_desc:0 "Настав час перетворити нашу маленьку авіадивізію на самостійний рід військ. Володіючи власними ВПС із незалежним командуванням, ми зможемо краще захищати індійський народ та Імперію."
 RAJ_seven_shackles:0 "Сім кайданів"
 RAJ_siege_batteries:0 "Облогові батареї"
 RAJ_south_east_asia_command:0 "Командування Південно-Східної Азії"
 RAJ_stopping_the_japanese_threat_into_central_asia_desc:0 "Амбіції Японії не закінчуються на кордонах Китаю. Їхні погляди тепер звернені до Центральної Азії, потенційного плацдарму для подальшої імперської експансії.\nМи повинні діяти швидко. Посилюючи наш східний кордон, ми зупинимо хвилю завоювань, перш ніж вона досягне степів та за їхніми межами."
 RAJ_tea_exports_tt:0 "§YМоже бути розширено до 5 разів§!"
 RAJ_the_government_of_india_act_pp_bonus_tt:0 "Модифікувати §Y$RAJ_a_loyal_government$§! на [?RAJ_the_government_of_india_act_pp_bonus_based_on_compliance|+=%%0] $MODIFIER_POLITICAL_POWER_FACTOR$ за кожну стартову область із понад §Y74%§! Підпорядкування."
 RAJ_the_need_for_a_mercantile_navy_desc:0 "Морська торгівля — це найважливіший спосіб світової торгівлі. Нам потрібен флот, здатний доставляти ці товари, а також захищати їх."
 RAJ_the_second_gorkha_war_desc:0 "Незалежність Непалу — це пережиток минулого, що розділяє те, що має бути об'єднаним субконтинентом. Рішуча кампанія приведе ґуркхів до складу, забезпечуючи контроль над Гімалаями."
 RAJ_the_silk_road_desc:0 "Шовковий шлях колись приніс багатство та культуру до Імперії. Відновивши цю історичну торговельну мережу, ми повертаємо наше місце в центрі світової торгівлі, збагачуючи імперію та сприяючи процвітанню на її великих територіях."
 RAJ_the_sword_and_the_saffron_desc:0 "Наша доля викувана силою та вірою. Меч захищатиме нашу землю, а шафрановий прапор об'єднає наш народ під єдиною метою."
 RAJ_timurid_empire_neutrality_ADJ:0 "Тімурідськ"
 RAJ_tryst_with_destiny_desc:0 "Давним-давно ми уклали зустріч із долею, і тепер настає час, коли ми виконаємо нашу обіцянку, не повністю чи в повному обсязі, але дуже суттєво. Опівночі, коли світ спить, Індія прокинеться до життя і свободи."
