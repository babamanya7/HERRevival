 ITA_italo_balbo_roman_emperor:0 "Авґуст Бальбо"
 ITA_jet_engine_effort_desc:0 "Італія мусить бути на передовій розвитку реактивних двигунів завдяки блискучій роботі Секондо Кампіні. Ми мусимо надати йому всі необхідні ресурси для подальшого вдосконалення його проєктів для Regio Aeronautica."
 ITA_jet_fighter_equipment_2_short:0 "Re.2008"
 ITA_king_umberto_high_control_range:0 "$ITA_king_high_control_range$"
 ITA_luigi_einaudi:0 "Луїджі Ейнауді"
 ITA_mafia_abroad_desc:0 "Вплив мафіозних сімей, з якими ми маємо домовленості, зростає не лише в Італії, але й за кордоном. Ми мусимо засилати пов'язаних із ними агентів до великих капіталістичних держав, де їхній бізнес може процвітати, слугуючи нашим інтересам."
 ITA_medium_tank_equipment_2:0 "M16 Sahariano"
 ITA_ministry_of_italian_africa_desc:0 "Із різними племенами та народами Африки не можна поводитися так, як ми могли би поводитися з іншими підвладними народами. Управління цими територіями потребує іншого підходу."
