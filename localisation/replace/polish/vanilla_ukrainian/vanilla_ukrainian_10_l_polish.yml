 SOV_merge_tank_and_materiel_plants_desc:0 "Танки й артилерія, мабуть, найліпше підходять для масового виробництва, використовуючи ефект масштабу. Тому ми мусимо сприяти консолідації виробників танків і матеріального забезпечення, щоби скористатися цим."
 SOV_merge_tank_plant_3_tt:0 "$SOV_merge_tank_plant_intro_tt$§YБронетехніка§!: Протипіхотна атака: §G+3.00%§!\n"
 SOV_military_offensive_name_kutuzov:0 "Операція «Кутузов»"
 SOV_military_offensive_specific_name:0 " в області [?ROOT.SOV_military_offensive_states^0.GetName]"
 SOV_opposition_support_medium_increase_effect_tt:0 "Народна підтримка повстання збільшиться на §G+1.5%§!"
 SOV_politicized_military_desc:0 "Військові комісари часто виступають із запеклими ідеологічними промовами та політичними дискусіями серед рядів, але в багатьох випадках вони також займаються надмірним адмініструванням, надмірною перевіркою військових офіцерів і навіть перешкоджанням виконанню наказів командирів частин."
 SOV_preemptive_invasion_of_iran_desc:0 "Уряду держави [PER.GetNameDef] не можна довіряти, що він підтримає нас у випадку війни, так само як і ми не можемо повністю довіряти, що він не вступить у війну проти нас. Замість того, щоб чекати і спостерігати, ми мусимо вирішити це питання і прояснити ситуацію."
 SOV_prepare_a_war_with_japan:0 "Підготувати війну з Японією"
 SOV_propaganda_more_metal:0 "Більше металу — більше зброї!"
 SOV_raid_trotskys_villa_desc:0 "Агент НКВС Йосип Ґриґорович очолить групу озброєних вбивць під час рейду на віллу Троцького."
 SOV_rehabilitated_military_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$\n$MODIFIER_ARMY_ORG$: §G+5.0%§!\n"
 SOV_reinstitute_the_mestnichestvo_desc:0 "Колись найстаріші та найповажніші родини керували державними справами. Це гарантувало лояльність еліти до держави, якою вона керувала, і те, що кожне нове покоління буде виховуватися відповідно до високих стандартів старого. Ми повинні відновити цю систему, щоб убезпечити наш новий режим."
 SOV_reinstituted_mestnichestvo:0 "$SOV_reinstitute_the_mestnichestvo$"
 SOV_request_imperial_protection_desc:0 "Відчайдушні часи вимагають відчайдушних заходів. Якщо єдиний спосіб перемогти комунізм — це вклонитися Хірохіто, хай буде так. Прийде час, коли Росія стане власною імперією. Але поки що нам потрібна допомога іншої імперії."
 SOV_russia_communism_DEF:0 "Російська радянська соціалістична республіка"
 SOV_secure_the_administration_mission:0 "$SOV_secure_the_administration$"
 SOV_seek_balkan_cooperation:0 "Прагнути до балканської співпраці"
 SOV_seize_manchuria_desc:0 "У результаті громадянської війни в Японії держава [MAN.GetName] звільнилася від японського панування. У нас є чудова нагода нарешті встановити радянську владу над цією територією, якщо діяти швидко."
 SOV_sergey_korolev:0 "Сергій Корольов"
 SOV_socialism_in_one_country_mission_desc:0 "[FROM.GetLeader] працює над виконанням фокусу $SOV_socialism_in_one_country$."
 SOV_soviet_atomic_bomb_project_ns:0 "$SOV_soviet_atomic_bomb_project$"
 SOV_stakhanovite_movement:0 "Стахановський рух"
 SOV_submarine_4_desc:0 "The Project 611 submarines (NATO Codename: Zulu), were the Soviet Navy's first submarine class to be built after WWII. Their design was based on the German Type XXI submarines, and they were meant to replace the older Series XIV K class boats. They were large, ocean-going submarines with a heavy torpedo armament and long range. They were used as a basis for the follow-up Project 613 (NATO Codename: Whiskey) and Project 641 (NATO Codename: Foxtrot) class submarines."
 SOV_support_of_the_peasants_idea:0 "Підтримка селянського класу"
 SOV_support_of_the_peasants_idea_desc:0 "Сильна підтримка фермерів по всій країні дає змогу вербувати та підтримувати більші армії."
 SOV_surface_warfare_desc:0 "Основні кораблі вимагають значних витрат часу та ресурсів і часто стають застарілими ще до завершення будівництва. Менші судна можна будувати набагато швидше, а отже, їм набагато легше йти в ногу з технологічним розвитком. Ми мусимо зосередитися на розвитку наших легких сил як основної ланки морської війни."
 SOV_the_anti_soviet_trotskyist_center:0 "Антирадянський троцькістський центр"
 SOV_the_bloc_of_rights_and_trotskyites_desc:0 "Нарешті ми дійшли до самого серця змови в нашому середовищі. Микола Бухарін насправді був членом троцькістсько-зінов'євського блоку і, швидше за все, лідером людей в уряді, які намагалися здійснити контрреволюцію. Тепер у нас є неспростовні докази цього, і на цьому останньому судовому процесі ми можемо викрити ці факти."
 SOV_the_defense_of_moscow_desc:0 "Ворог стоїть попід самою Москвою. Це місце, де ми мусимо стати на захист і змусити його відступити і зазнати поразки, як ми це зробили з Наполеоном!"
 SOV_the_gobi_gambit_desc:0 "Поки конфлікт між Японією і Китаєм розпалюється, у нас є можливість захопити територію навколо пустелі Ґобі, що дасть нам право голосу в майбутньому Китаю і місце за столом переговорів."
 SOV_the_left_opposition:0 "Ліва опозиція"
 SOV_the_need_for_policy_changes:0 "Потреба в зміні політики"
 SOV_the_need_for_policy_changes_desc:0 "Стало гранично ясно, що країна рухається в хибному напрямку. Сталін і його союзники намагалися зробити занадто багато і занадто швидко. Ми повинні йти, перш ніж бігти. Ми повинні повернути товариша Сокольникова, який зробив велику роботу в перші роки існування Радянського Союзу, щоб повернути нас на правильний шлях."
 SOV_the_old_eastern_empire_desc:0 "$SOV_restore_the_old_eastern_empire_desc$"
 SOV_the_stalin_constitution:0 "Сталінська конституція"
 SOV_the_supreme_soviet:0 "Верховна Рада"
 SOV_third_five_year_plan_military_dynamic_modifier_alt:0 "$SOV_third_five_year_plan_dynamic_modifier_alt$"
 SOV_tolkachi:0 "Толкачі"
 SOV_volunteers_allowed_kuomintang_tt:0 "$volunteers_allowed_intro$ §Y[CHI.GetNameDef]§!."
 SOV_war_with_germany:0 "Війна з Німеччиною"
 SOV_workers_government_idea_desc:0 "Хай живе робітничий уряд. Керівна еліта була усунена від влади. Робітники знову керують країною."
 SPA_artillery_modernization:0 "Модернізація артилерії"
 SPA_carlist_uprising_mission:0 "Насувається повстання карлістів"
 SPA_communism:0 "Республіканська Іспанія"
 SPA_cordoba_offensive_mission:0 "Насувається наступ у Кордові"
 SPA_dios_patria_rey:0 "¡Dios, Patria y Rey!"
 SPA_doctrinal_advancements_desc:0 "За попередні десятиліття наші іноземні прихильники досягли значних успіхів у військовій думці та доктрині. Можливо, ми зможемо переконати їх поділитися з нами своїми ідеями, щоби ми могли перевірити їх у нашій нинішній війні."
 SPA_eliminate_the_carlists_desc:0 "Наше бачення Іспанії несумісне з баченням карлістів. Тримаючись за вмираючу династію, зі своїми слабкими лідерами та релігійним фанатизмом, вони становлять загрозу самому майбутньому Іспанії. Ми повинні викорінити цих інакомислячих, щоби справжні сильні лідери могли виступити та об'єднати країну залізною рукою."
 SPA_encourage_local_mining:0 "Заохотити місцевий видобуток ресурсів"
 SPA_establish_guadalajara_carlist_cell:0 "Створити осередок карлістів у Ґуадалахарі"
 SPA_expand_influence_in_the_catalunya_garrison:0 "Розширити вплив на гарнізон у Каталонії"
 SPA_expand_influence_in_the_extremadura_garrison_mission:0 "Оспорюється вплив на гарнізон в Естремадурі"
 SPA_expand_influence_in_the_guadalajara_garrison_mission:0 "Оспорюється вплив на гарнізон у Ґуадалахарі"
 SPA_juan_yague_blanco:0 "Хуан Ягуе Бланко"
 SPA_medium_tank_equipment_1_short:0 "CDC 39"
 SPA_military_plot_nationalists_desc:0 "Ми готуємося до повалення уряду, але щоби не допустити повторення невдалої спроби 1932 року, ми мусимо забезпечити собі достатню підтримку серед народу, перш ніж розпочати наш переворот. Час має бути обраний ідеально!"
 SPA_negotiate_carlist_support_desc:0 "Наша справа має союзників, до яких тільки треба звернутися. Негативне ставлення лівих до церкви відштовхнуло карлістів, і ті довго готувалися до конфронтації з республікою. Якщо ми заручимося їхньою підтримкою, наше повстання значно посилиться."
 SPA_political_assassination_desc:0 "Наші політичні опоненти стають для нас сіллю в оці, схиляючи на свій бік людей, яких інакше можна було б схилити на наш бік. Тактично усунувши одного з наших ключових опонентів, ми можемо послабити тиск на нас і дати нашому посланню більше шансів бути почутим."
 SPA_prepare_the_carlist_insurrection_desc:0 "Наш союз із Фалангою виник через необхідність, і його очікувана тривалість життя вже може рахуватися тижнями. Ми повинні вдарити по наших гаданих союзниках до того, як вони вдарять по нас, і усунути їхню хибну ідеологію, перш ніж вона матиме шанс укоренитися у свідомості простих людей."
 SPA_press_the_gibraltar_claim_desc:0 "Образа нашого короля, яка полягає в самому існуванні ґібралтарського анклаву, повинна бути помщена."
 SPA_recovering_from_civil_war:0 "Відновлення після громадянської війни"
 SPA_safeguard_the_freedom_of_worship:0 "Захищати свободу віросповідання"
 SPA_secure_the_national_defense_council_desc:0 "Без лідерів, наша справа очолюється хунтою військових і цивільних лідерів із слабко узгодженими цілями. Якщо ми хочемо виконати нашу волю та досягти відродження, на яке заслуговує Іспанія, ми повинні забезпечити домінування над цією різноманітною, а іноді й суперечливою, організацією."
