 BUL_assert_our_claims_enemy_claims_tt:0 "\n§Y[BUL.GetNameWithFlag]§! отримує претензії на балканські землі, контрольовані сусіднім ворогом або союзником ворога, і ціль війни §YАнексія§! проти цих сусідніх країн."
