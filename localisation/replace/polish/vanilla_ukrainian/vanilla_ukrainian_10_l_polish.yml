 RULES_TAB_LABEL:0 "Правила"
 RULE_ALLOW_GUARANTEES_LIMITED_DESC:0 "Надання гарантії незалежності обмежене рівнем світової напруженості та правилами ідеології."
 RULE_ALLOW_KICK_FACTION_ALLOWED_DESC:0 "Лідер альянсу може виключати з нього будь-яку державу."
 RULE_ALLOW_LEAVE_FACTION_ALLOWED_DESC:0 "Суверенні держави можуть виходити з альянсів у мирний час."
 RULE_ALLOW_LEND_LEASE:0 "Ленд-ліз"
 RULE_ALLOW_RELEASE_NATIONS_ALL_NATIONS_RUTHENIA_TOOLTIP:0 "Цю державу не можна звільнити."
 RULE_ALLOW_RELEASE_NATIONS_PEACE_ONLY_DESC:0 "Держави можуть давати незалежність іншим державам лише в мирний час."
 RULE_HISTORICAL_FIN_AI_DESC:0 "Фінський ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_LEFT_OPPOSITION_COOPERATIVE:0 "Ліва опозиція — співпраця"
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC:0 "§HФранцузький§! ШІ намагатиметься відновити французьку монархію та посадити претендента-легітиміста на трон, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_AFRICA_DECOLONIZED_DESC:0 "Усі доступні для звільнення колонізовані нації в Африці будуть створені як вільні та незалежні держави після початку гри."
 RULE_OPTION_ALTERNATE_CHI_AI_DESC:0 "§HКитайський§! ШІ намагатиметься зміцнити владу в Китаї, завойовуючи воєначальників, перш ніж піде на конфлікт із японцями, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_COMMUNIST_YUG_AI_DESC:0 "§HЮгославський§! ШІ намагатиметься реформувати країну в комуністичну республіку, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEFAULT_GER_FRAGEMNTATION_DESC:0 "Німеччина історично цілісна."
 RULE_OPTION_DEMOCRATIC_ALT_AI:0 "Альтернативний демократичний шлях"
 RULE_OPTION_DEMOCRATIC_CZE_AI_DESC:0 "§HЧехословацький§! ШІ намагатиметься залишити країну демократичною та зосередитися переважно на своєму внутрішньому розвитку, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DICTATORSHIP_NEUTRAL_AI_DESC:0 "ШІ піде шляхом авторитарної диктатури, але намагатиметься залишатися нейтральним."
 RULE_OPTION_ETH_COLLABORATIONIST_desc:0 "ШІ зрадить Хайле Селассіє та стане на бік італійців, у результаті чого Ефіопія стане фашистською маріонеткою."
 RULE_OPTION_FASCISM_GRE_AI_DESC:0 "§HГреція§! стане націонал-соціалістичною республікою і спробує приєднатися до Осі на стороні Туреччини."
 RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC:0 "Фінські соціал-демократи звернуться до фінського народу та проведуть радикальні, але безкровні зміни в політиці Фінляндії. Потім Фінляндія спробує приєднатися до інших західних демократій, щоби зберегти суверенітет країни та її консервативно-ліве суспільство."
 RULE_OPTION_HUN_DEMOCRATIC_KING:0 "Демократичний король"
 RULE_OPTION_IMPERIAL_PER_AI:0 "Нейтралітет: імперський шлях"
 RULE_OPTION_INDEPENDENCE_COM_MAN_AI_DESC:0 "Маньчжурський ШІ спробує здобути незалежність і проголосити Китайську народну республіку, обравши відповідну гілку дерева національних фокусів."
 RULE_OPTION_KURDISTAN_IRQ_AI_DESC:0 "Курди Північного Іраку почнуть повстання проти іракського уряду. Якщо їм це вдасться, вони спробують об'єднати свої землі на території Туреччини та Ірану."
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI_DESC:0 "ШІ приєднається до рексистських фашистів, створить велику високоіндустріальну державу, а потім допоможе фашистам у війні."
 RULE_OPTION_ORANJE_BOVEN_HOL_AI_DESC:0 "§HНідерландський§! ШІ намагатиметься підтримувати монархізм і привести королеву Вільгельміну до влади, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_RANDOM:0 "Випадковий шлях"
 RULE_OPTION_SOV_FRAGMENTED:0 "Радянський Союз розпущений"
 RU_lower_Acc_fascism:0 "фашизм"
 RWA_fascism_DEF:0 "Імперія Руанда"
 SAF_BLITZKRIEG_DESC:0 "$SAF_GATHERING_STORM_DESC$"
 SAF_armor_effort:0 "Розвиток бронетехніки"
 SAF_battle_cruiser_1_desc:0 "$ENG_battle_cruiser_1_desc$"
 SAF_carrier_3:0 "$ENG_carrier_3$"
 SAF_celebrate_the_great_trek_desc:0 "Сто років тому наші предки-африканери відокремилися від британської колонії, що набирає силу, і побудували свою націю на північному сході. Їхня стійкість і відвага досі є найкращими якостями Південної Африки."
 SAF_cheap_labor_1:0 "Дешева робоча сила"
 SAF_destroyer_1:0 "$ENG_destroyer_1$"
 SAF_empower_the_workers:0 "Наділити робітників великими правами"
 SAF_heavy_engineering_desc:0 "Для Південної Африки дуже важливо йти в ногу з технічним прогресом. Навіть незважаючи на те, що наша промислова база невелика, ми мусимо розвивати важке машинобудування, щоби наздогнати інші держави."
