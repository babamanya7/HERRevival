 BEL_mio_trait_47mm_at_guns:0 "47mm AT Guns"
 BEL_mio_trait_assault_rifles:0 "Assault Rifles"
 BEL_modernized_army_desc:0 "Часто різниця між переможцями та програвшими у війні полягає в тому, хто найкраще засвоїв уроки зі своїх досвідів. Настав час нам оглянути все, що ми виграли і втратили, і реформувати армію, щоб вона відповідала новим, сучасним стандартам."
 BEL_perpetual_neutrality_desc:0 "Через те, що наша країна була основним полем битви, після Першої світової війни наша нація залишилася в руїнах. Більше ніколи не повинно статися повторення такого. Тому ми оголосимо, що [BEL.GetNameDef] утворить незалежну та вічно нейтральну державу, яка буде зберігати нейтралітет стосовно всіх інших держав."
