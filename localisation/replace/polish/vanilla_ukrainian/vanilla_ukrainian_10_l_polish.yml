 ITA_a_colonial_empire_desc:0 "Незважаючи на зусилля наших ворогів і суперників, Італія стала могутньою колоніальною імперією. Ми мусимо забезпечити не тільки максимальне використання наших територій, але й продовжувати розширювати італійський контроль в Африці."
