 GER_VICTORY_POINTS_686:0 "Еденбурґ"
 GER_a_fourth_silesian_uprising_cat_desc:0 "Через нещодавню нестабільність і громадянську війну в нашій країні, прихильники незалежної Сілезії почали агітувати та готуватися до ймовірного повстання, якщо з’явиться нагода. Було б мудро позбавити їх цих ілюзій. І як якнайшвидше."
 GER_align_south_america_desc:0 "Робітники Південної Америки достатньо натерпілися під ярмом капіталізму. Якщо схилити їх на наш бік — ми здобудемо міцних союзників на всьому континенті."
 GER_all_for_the_front_desc:0 "Кожен чоловік повинен віддати своє серце, кров і душу німецькій нації, якщо хоче, щоб Вітчизна повернула собі колишню славу. Усе, що ми створюємо — для фронту. Наш народ має це усвідомити."
 GER_allied_customs_union_integration_request_tt:0 "Відкриває рішення: §Y$GER_mitteleuropa_economic_integration_cat$§!"
 GER_amerikabomber_messerschmitt_flag:0 "§Y$GER_messerschmitt_organization$§! призначено для розробки §YАмерікабомбера§!"
 GER_anti_colonialism_map_category_name:0 "$ETH_anti_colonialism_map_category_name$"
 GER_anti_comintern_pact_desc:0 "Втручання у внутрішні справи інших держав, яке дозволяє собі Комуністичний інтернаціонал, ставить під загрозу не лише їхнє соціальне благополуччя, а й мир у всьому світі! Ми запропонуємо всім країнам, які виступають проти комуністів, підписати пакт, покликаний стримувати червону загрозу."
 GER_armament_rationalization:0 "Раціоналізація обзроєння"
 GER_ascension_of_goring_desc:0 "Вмілий командир має певне місце у найближчому оточенні фюрера. Оскільки Герман Герінг є не лише досвідченим командиром, але й давнім спільником фюрера, надання йому відносної свободи дій має бути невеликим ризиком за велику винагороду."
 GER_battleship_4_desc:0 "Німецький план «Z» передбачав наявність десяти лінкорів, щоби кинути виклик морській могуті Сполученого Королівства. Клас «H» був серією проєктів шести лінкорів, необхідних для виконання вимог плану. Два кораблі проєкту «H39» були закладені на початку Другої світової війни, але будівництво було зупинено з початком війни. Жоден із кораблів не було офіційно названо, але «Hindenburg» розглядався як можливе ім'я для головного корабля класу. Якби будівництво кораблів було завершено, це були б посилені кораблі класу «Bismarck» із головною батареєю з восьми 40,6-см (16-дюйм.) гармат."
 GER_bewegungskrieg_modifier:0 "Bewegungskrieg"
 GER_case_anton:0 "Провести операцію «Антон»"
 GER_central_european_alliance_desc:0 "Нам вдалося зосередити всю увагу континенту на єдиній проблемі, і тепер ми маємо запропонувати її вирішення: ми створимо для всіх малих держав Європи союз, який забезпечить їм захист від найнебезпечнішої загрози їхньому способу життя."
 GER_challenge_the_monroe_doctrine_tt:0 "Відімкне сукупність рішень із §Yдестабілізації доктрини Монро§!.\n\n§Y[USA.GetNameDefCap]§! отримають сповіщення про це, що дозволить їм спробувати §Rвтрутитися§!."
 GER_create_two_light_panzer_units_tt:0 "Буде створено §Y2 німецькі§! частини §Yлегкої бронетехніки§!."
 GER_cv_CAS_equipment_1_short:0 "Ju 87 C 'Stuka'"
 GER_der_fuhrer:0 "Фюрер"
 GER_develop_the_knickebein_desc:0 "Використовуючи складну систему радіонавігації, ми знайшли спосіб спрямовувати наші літаки для більш точного бомбардування. Використовуючи ці нові технології, ми зможемо ефективніше зрівнювати з землею заводи противника — навіть уночі."
 GER_expand_ss_recruitment:0 "Розширити вербування в SS"
 GER_expatriate_the_communists_ww_desc:0 "$GER_expatriate_the_communists_desc$"
 GER_exploit_the_gombos_treaty_desc:0 "Торговельна угода, яку прем’єр-міністр Угорщини, Дюла Ґьомбьош, на честь якого він і отримав назву, підписав з нами в 1934-ому році, є важливим для стимулювання економіки Угорщини та допомоги у відновленні після Великої депресії. Проте, вона також має великі недоліки... для них. Хоча угода дає їм вигідну ціну на продаж пшениці, зароблені гроші повинні залишатися на рахунку в Німеччині та використовуватися лише для закупівлі німецьких промислових товарів. Тому ми могли б спустошити рахунок, який вони зберігали в нашій країні, щоб допомогти нашій економіці, однак ціною втрати можливого союзника."
 GER_female_kaiser_title:0 "кайзериною"
 GER_fernostliche_legion_ns:0 "Fernöstliche Legion"
 GER_goring_fuhrer:0 "$GER_der_fuhrer$"
 GER_hamburger_flugzeugbau_trait_taken_flag:0 "$generic_has_already_completed_this_trait$"
 GER_heavy_tank_equipment_3_desc:0 "Відомий під неофіційною назвою Königstiger, але солдати союзників часто напівбуквально перекладали його як Королівський тигр, проєкт мав ту саму концепцію, що й Tiger I, але мав бути ще грізнішим. Tiger II поєднував товсту броню Tiger I з похилою бронею, яка використовується на середньому танку Panther. Танк важив майже сімдесят метричних тонн, був захищений спереду бронею від 100- до 180-мм і озброєний довгоствольною 8,8-см гарматою Kampfwagenkanone 43 L/71."
