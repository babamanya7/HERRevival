 EST_national_council_desc:0 "Національна рада — це гілка влади, котра представляє місцеві муніципалітети, міста та корпоративні палати. Якщо ми хочемо належним чином представляти інтереси цих людей, мусимо переконатися, що їхніми представниками є лише лояльні члени партії «Патріотична ліга» та військовослужбовці, адже лише вони здатні захистити суверенітет естонського народу."
 EST_sieze_swedish_assets:0 "Захопити шведські активи"
 EST_unite_the_sami_desc:0 "Саами — розрізнений і повсюдно утискається народ, який живе на території Фінляндії, Швеції, Норвеґії та Росії. Занадто довго їх позбавляли права говорити своєю мовою, а для того, щоби повстати проти гнобителів, ресурсів у них немає. саамів у своїй державі, щоби захистити їх від північного імперіалізму."
 ETH_African_Union_communism_ADJ:0 "Африканськ"
 ETH_GATHERING_STORM_DESC:0 "У Ефіопії багатовікова історія та імператорська династія їй під стать. Хайле Селассіє зробив багато для модернізації імперії, але процес було перервано, оскільки Італія нападала на Ефіопію вдруге за 40 років. Ситуація безрадісна, але якщо імперія збереться із силами, вона зможе зупинити загарбників ще раз. Щоб Ефіопія залишилася вільною, треба звільнити від європейського ярма всю Східну Африку — раз і назавжди."
 ETH_ITA_fascism_autonomy_reichskommissariat:0 "Італійська Східна Африка"
 ETH_a_libyan_revolt_desc:0 "[ITA.GetAdjectiveCap]а армія намагається зберегти контроль над нещодавніми територіями в Східній Африці. Оскільки їхній фокус змістився, ми зробимо все можливе, щоби посіяти зернята повстання на їхніх дорогоцінних [LBA.GetAdjective]их територіях."
 ETH_african_independence_tt:0 "Відкриває доступ до §Yрішень§! по збільшенню спротиву та приросту автономії в африканських країнах."
 ETH_anarchist_power_range:0 "Анархісти при владі"
 ETH_army_2_dynamic_modifier:0 "$ETH_army_1_dynamic_modifier$"
 ETH_buy_anti_tank_guns:0 "Придбати протитанкові гармати"
 ETH_callout_to_the_world_desc:0 "Наша боротьба з фашизмом не є унікальною для нашої країни, це частина ширшої глобальної боротьби з авторитаризмом. Ми об'єднаємо сили антифашизму в усьому світі для нашої справи, бо сьогодні знущаються над нами, завтра — зі світом."
 ETH_communal_education_desc:0 "Забезпечення доступу кожної спільноти в [ETH.GetNameDef] до освіти через школи та бібліотеки є важливим, якщо ми хочемо поліпшити рівень життя для їхнього населення."
 ETH_consolidate_ea_targets:0 "Ці землі можна інтегрувати в державу [ETH.GetName]:"
 ETH_develop_the_horn_of_africa_tt:0 "Відмикає §Yрішення§! про поліпшення незалежних або суб'єктів [ROOT.GetAdjective]их країн Африканського Рогу та, можливо, інтегрувати їх."
