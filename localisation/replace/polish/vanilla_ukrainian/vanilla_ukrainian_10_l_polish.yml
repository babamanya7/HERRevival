 ETH_peace_negotiations:0 "Мирні переговори"
 ETH_purge_ideology_boost_idea:0 "Чистки комуністичних і фашистських вигнанців"
 ETH_rebuilding_the_country_desc:0 "Відновивши повну владу над нашими землями, ми нарешті можемо почати ремонтувати пошкодження наших будинків і промисловості, завдані [ITA.GetAdjective]."
 ETH_reclaim_the_empire_tt:0 "Відмикає рішення §Y$ETH_reclaim_the_empire$§! про повернення національного статусу на території, переданій [ITA.GetFlag][ITA.GetName], коли вони знову перебувають під контролем [ETH.GetFlag][ETH.GetAdjective]."
 ETH_red_army_engineers_desc:0 "Значна частина інфраструктури наших країн була сильно пошкоджена під час [ITA.GetAdjective]ого вторгнення. Якщо ми хочемо побудувати справжню робітничу республіку, нам потрібно буде не лише відновити те, що у нас було, але й розпочати програму швидкої індустріалізації. Ми повинні використати навички наших товаришів у Червоній армії, щоби розпочати цей процес."
 ETH_regional_training_centers_desc:0 "[GetChitetName] далекий від досконалості. Наші війська можуть бути набагато ефективнішими, якщо створити регіональні навчальні центри, щоби показати їм, як воювати і мислити тактично. Це також дозволить нам стандартизувати військову підготовку без потреби в постійній армії."
 ETH_scavenger_random_generals_tt:0 "§YТри§! випадково обрані командувачі арміями отримають рису §Y$scavenger$§!:\n- $MODIFIER_EQUIPMENT_CAPTURE_FACTOR$: §G+3%§!"
 ETH_second_italo_ethiopian_war_category_desc:0 "[Get2ndItaloEthiopianWarDesc]"
 ETH_seize_the_means_desc:0 "Покоління [ETH.GetAdjective]их працівників обробляли поля та створювали промисловість міст. Їхня кров у землі. Тому ми більше не дозволимо заможній кліці претендувати на право власності на ці активи. Їх повернуть людям."
 ETH_started_uprising_flag:0 "Відбувається масштабне повстання"
 ETH_steel_lions_desc:0 "[GER.GetNameDefCap] є піонером нових методів ведення війни. Часи кавалерійської чи окопної війни минули. Майбутнє за танком. Ми повинні використати наш час у [GER.GetNameDef], щоби навчитися використовувати сучасну зброю війни та підготуватися до звільнення нашої батьківщини."
