 AIR_COUNTRY_EXTRA_ATTACKS:0 "Атаки країни:"
 AIR_DELETE_WING_DESC:0 "Ви справді хочете видалити авіакрило $NAME|H$ та повернути все оснащення в резерви?"
 AIR_EXPERIENCE_DESC:0 "Коли Ваші літаки борються з ворогом, виконуючи місії, або проводять §Hповітряні навчанння§!, Ви отримуєте досвід авіації. Це означає, що Ви отримуєте досвід армії, коли Ваші §Hавіакрила§! беруть участь у битвах або якщо Ви надсилаєте оснащення своїм союзникам шляхом §Hленд-лізу§!.\nПевні §Hнаціональні фокуси§! дають додатковий досвід, а декотрі §Hміністри§! можуть збільшити розмір отримуваного досвіду.\n\nДосвід авіації використовується для розробки кращих моделей літаків, проєктування нових і відмикання §Hдоктрин§!."
