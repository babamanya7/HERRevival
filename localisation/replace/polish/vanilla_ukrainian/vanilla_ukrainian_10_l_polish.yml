 DOD_hungary.107.desc_SLO_puppet:0 "Угорська делегація прибула до нас для обговорення ситуації у Словаччині. Вони вважають цю країну своєю історичною сферою впливу та стурбовані тим, що ми впливаємо на політику Словаччини.\n\nГлава делегації навіть наважився припустити, що територію Словаччини можуть використовувати як плацдарм для вторгнення до Угорщини.\n\nВони вважають, що угорська влада має отримати такі ж важелі впливу на Словаччину, якими ми користуємось зараз."
 DOD_hungary.148.a:0 "Нам не можна розв'язувати війну."
 DOD_hungary.150.t:0 "Конкурс на винищувачі"
 DOD_hungary.152.desc_heavy_fighter_refused:0 "Посилаючись на інтереси національної безпеки, [From.GetAdjective] уряд відмовився видати нам ліцензію на виробництво. Ми можемо спробувати щастя де-небудь ще або зайнятися модернізацією наших існуючих літаків як екстрені заходи."
 DOD_hungary.161.desc_cas_refused:0 "Посилаючись на інтереси національної безпеки, [From.GetAdjective] уряд відмовився видати нам ліцензію на виробництво. Ми можемо спробувати щастя де-небудь ще або зайнятися модернізацією наших існуючих літаків як екстрені заходи."
 DOD_hungary.21.a:0 "Ми відбиватимемося самотужки."
 DOD_hungary.24.b:0 "Потай надати допомогу."
 DOD_hungary.44.t:0 "[HUN.GetNameDefCap] поступається"
 DOD_hungary.58.b:0 "Захист їх інтересів зараз не грає нам на руку."
 DOD_hungary.59.t:0 "[ROM.GetNameDefCap] шукає посередника"
 DOD_hungary.64.a:0 "Це чорний день."
 DOD_hungary.85.a:0 "Ось і закінчилося національне самовизначення."
 DOD_hungary.96.b:0 "Ми краще загинемо в бою!"
 DOD_romania.11.desc:0 "[From.GetLeader] повністю підтримує ідею «санітарного кордону». Делегація з держави [From.GetNameDef] прибула до нас, щоб обговорити вступ до союзу та підготувати плани військової підтримки на випадок війни."
 DOD_romania.30.b:0 "Жодних угод з імперіалістами!"
 DOD_romania.42.b:0 "З'ясуймо, чи правий він."
 DOD_romania.52.b:0 "Це не те, що ми мали на увазі."
 DOD_romania.62.a:0 "Ми їх зламаємо!"
 DOD_yugoslavia.50.d:0 "Аделаїда фон Габсбурґ."
 DOD_yugoslavia.70.desc:0 "[From.GetLeader] відправляє сьогодні телеграму в місто [Root.Capital.GetName], висловлюючи в ній інтерес до підписання пакту про ненапад із фашистськими державами. Побоюючись [SOV.GetAdjective] вторгнення та зростання націоналізму своєї нації, [From.GetLeader] бажає налагодити відносини з державою [Root.GetNameDef] Це не означає укладання офіційного союзу, але переміщує державу [From.GetNameDef] у нашу сферу впливу і почне процес вступу [From.GetAdjective] держави до альянсу [Root.GetFactionName]."
