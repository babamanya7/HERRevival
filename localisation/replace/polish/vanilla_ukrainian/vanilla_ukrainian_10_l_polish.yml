 NORDIC_against_tyranny_TT:0 "Рішення §YНадіслати зброю до Північних країн§!, §YНадіслати волонтерів для Північних країн§! і §YЗахистити Північну країну§!, щоб підтримати сусідні північні країни проти вторгнення зовнішніх сил."
 NORDIC_baltic_sea_dominance_desc:0 "Балтійське море давно було нашим заднім двором. У нас немає шансів, якщо ми дозволимо іншим державам вільно панувати над його хвилями. Збудуймо ж береги, щоб ми могли керувати цим холодним і відчуженим простором."
 NORDIC_civilian_contributions_desc:0 "Тепер, коли населення має нове відчуття спільної ідентичності з іншими членами нашого альянсу, ми знаємо, що вони будуть готові робити внески та жертви, необхідні для підживлення військової машини, яка принесе безпеку та славу [NORDIC_get_alliance_name]."
 NORDIC_economic_cooperation_decisions_desc:0 "[ROOT.GetName] і [FROM.GetName] мають багатовікову історію. Іноді як вороги, а іноді як союзники та дружні сусіди. У ці непевні часи ми, скандинавські країни, повинні триматися разом і співпрацювати у взаємовигідній співпраці, на рівних."
 NORDIC_joint_special_forces_desc:0 "Плейсголдер"
 NORDIC_machine_tools_research_desc:0 "Робоча сила — це лише одна частина рівняння. Нам потрібно перевершити наших ворогів, щоб ми могли компенсувати втрати, яких вони не можуть. Ось чому ми не можемо обмежуватися розробкою нових бойових машин, а зосереджуємо свою увагу на техніці, яка породжує їх."
 NORDIC_modifies_member_dmod_TT:0 "Змінює §Y[NORDIC_get_alliance_name]§!: "
 NORDIC_modify_nordic_military_industry_dmod:0 "Змінює §Y[NORDIC_GetMilIndustryDmodName]§!:"
 NORDIC_nordic_military_industry_desc_com:0 "Революція не захищатиметься сама, і так само вона не пошириться без сильного поштовху з боку вже звільнених працівників нашого [NORDIC_get_alliance_name]"
 NORDIC_nordic_military_industry_monarchist:0 "Королівські заводи зброї"
 NORDIC_nordic_research_desc_mon:0 "Королівства на півночі завжди забезпечували простір для розвитку науки, і [NORDIC_get_nordic_industry_name] продовжить цю традицію, об'єднавши всі найкращі уми наших королівств в єдину будівлю, вони служитимуть усім своїм панам, допомагаючи кожному інший."
