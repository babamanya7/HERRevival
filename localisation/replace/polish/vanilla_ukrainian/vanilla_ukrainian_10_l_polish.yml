 lar_communist_uprising_infiltrate_civil_service_desc:0 "Наш агент забезпечить впровадження в адміністрацію кількох надійних людей, які утворюють ядро управління після успішного завершення революції."
 lar_compensate_italy.2.a:0 "Це невелика ціна."
 lar_end_the_occupation.2.a:0 "Ми відновили свою честь."
 lar_france_french_union.7.desc:0 "Виступаючі за Союз партії по всій Французькій Центральній Африці зазнали серії політичних невдач. Території одна за одною голосували проти вступу до нового Французького Союзу. Тепер, поки партії, які виступали за незалежність, святкують перемогу за перемогою, багато активістів заявляють, що французькому правлінню в регіоні завдано серйозного удару."
 lar_france_political_violence.1.desc:0 "Сьогодні праві та ультраправі рухи разом влагтували протести та демонстрації по всьому Парижу. Судячи з усього, протестувальники й не планували мирно розійтись. Ніби підчиняючись якомусь невідомому наказу, демонстрації змінили курс та зібрались біля Національних зборів. Зібраним спецпризначенцям вдалось стримати маршируючі колони на підходах до будівлі. Мітингувальники декілька разів атакували шик поліціянтів, і тим потрібні були певні зусилля, щоби відкинути нападників.\n\nПротестуючі розійшлись тільки глибоко вночі. Новини про бунти розповсюдилися всюди, і радше за все, підірвуть віру народу в здатність уряду підтримувати громадський порядок."
 lar_heavy_water.1.a:0 "Ми сильно відкинуті назад."
 lar_news.11.b_2:0 "Вони стануть ставити під загрозу нашу перемогу над націоналістами?!"
 lar_news.15.a:0 "Скоро виникне велика міць!"
 lar_news.19.desc:0 "Сьогодні держава [From.GetNameDef] оголосила про створення нового альянсу латинських країн, який може стати альтернативою основним світовим блокам. Незважаючи на багатомісячні переговори, поки що не цілком зрозуміло, які держави увійдуть до складу цього союзу, але експерти припускають, що серед них будуть [POR.GetNameDef], [FRA.GetNameDef] і [ITA.GetNameDef]."
 lar_news.20.c:0 "Як зручно. ¡Buena suerte, España!"
 lar_news.21.desc:0 "У міру зростання [From.GetAdjective] впливу уряд вирішив оголосити створення нового комуністичного союзу під назвою «Міжнародне бюро революційної соціалістичної єдності». Він відкидає як троцькістську, так і сталіністську інтерпретації марксизму.\n\n почався як так зване Лондонське бюро, до якого входили незалежні комуністичні організації, що мешкають у Лондоні, а тепер він готовий прийняти у свої лави всі нації, «бажаючі йти до ідеалів комунізму без перешкод ззовні»."
 lar_news.291.desc:0 "Тепер, коли острови Гаваї, Аотеароа, Таїті та Самоа міцно знаходяться під [From.GetOldAdjective] контролем, [From.GetLeader] проголошує, що країна буде відома під назвою [From.GetNameDef] і стане домом для всіх тихоокеанських народів. Полінезійський світ радіє, деякі навіть оголошують, що [From.GetLeader] — істинний спадкоємець Камеамеа, гавайського короля, який виконав пророцтво Нахи трохи більше двох століть тому."
 lar_portugal_iberian_summit.3.t:0 "Іберійський самміт — [From.GetNameDef] відкладає запит"
 lar_portugal_iberian_workers_united.1.desc:0 "Іспанія та Португалія довго були незалежними націями і всіляко підкреслювали свої відмінності, але ці часи минули. Настав день, коли іспанські та португальські робітники об'єдналися у боротьбі з фашизмом!"
 lar_portugal_navy_mutiny.5.desc:0 "Громадянська війна в Іспанії закінчена, і республіканський уряд погодився видати нам кораблі ([?POR_ships_revolted]), щоб компенсувати суду, що пішли від нас на допомогу Іспанії на початку конфлікту. Так як наші есмінці після знаходяться не в кращому стані, Іспанська Республіка проведе інспекцію та вирішить, чи потрібно замінювати ці кораблі на іспанські."
 lar_portugal_promote_monarchist_cause.3.b:0 "Потрібно розправитися з цими зрадниками!"
 lar_portugal_promote_monarchist_cause.5.a:0 "Це посилить Португалію."
 lar_portugal_promote_monarchist_cause.7.b_tt:0 "У разі можливої громадянської війни ви будете на стороні фашистів."
 lar_rescue_mussolini.2.t:0 "Муссоліні врятований"
 lar_spain.11.t:0 "Карлисти переможені"
 lar_spain.25.b:0 "Ми мусимо зберегти незалежність дій."
 lar_spain.56.b:0 "І все ж таки краще не послаблювати поводи."
 lar_spain.69.desc:0 "Держава [From.GetNameDefCap] почула наше прохання про допомогу і пропонує подальше залучення нас до їхньої програми ленд-лізу."
 lar_spain.75.desc:0 "Обміркувавши наше прохання, держава [From.GetNameDef] запропонувала відправити військових експертів, щоби ті навчили наших командирів краще протистояти [SOV.GetAdjective] стратегії, з якою вже стикалися самі. Також ці фахівці нададуть нам цінні розвіддані."
 lar_spain.76.a:0 "Вони ревно зберігають всі свої секрети."
 lar_split_belgium.1.desc:0 "За останні тижні з'явилося кілька груп, які оголосили себе представниками франкомовного населення в нашій країні і почали агітувати за «возз'єднання» Валлонії з Францією. Сьогодні французький посол вручив нам ноту, в якій оголошено, що [From.GetLeader] та уряд прийняли офіційне рішення приєднати франкомовні області нашої країни.\n\nСудячи за повідомленнями про війська, що збираються біля кордонів, вони готові втілити це рішення будь-якими способами."
 large_unit_tactics_unit_knowledge_sharing:0 "Обмін знаннями підрозділів"
 lax_safety_regulations_spirit:0 "Слабкі правила безпеки"
 lc_smoke_generators_desc:0 "Система, призначена для створення густого димового завісу, що маскує рухи транспортного засобу та зменшує його видимість як для наземних, так і для повітряних загроз."
 leon_blum:0 "$FRA_leon_blum$"
 liangguang_clique_democratic_ADJ:0 "Кантонськ"
 liberalism_desc:0 "Підтримуючи філософську традицію поваги до особистої свободи, лібералізм уважає забезпечення цих прав головною функцією держави."
 liberate_burundi:0 "Звільнити державу [BRD.GetName]"
 liberate_sudan:0 "Звільнити державу [SUD.GetName]"
 liberate_upper_volta_desc:0 "$liberate_angola_desc$"
 liberate_zimbabwe:0 "Звільнити Зімбабве"
 liberty_ethos:0 "Дух свободи"
 light_cruiser_3_desc:0 "Великі та броньовані крейсери підбираються впритул до обмежень угоди, але все ще залишаються формально в класі легких крейсерів."
 light_tank_equipment:0 "Легкий танк"
 lithuania_strength:0 "[?LIT.monarchist_support|Y]"
 macdonald_proposal_desc:0 "Ми мусимо забезпечити безпеку наших конвоїв, і для цього ірландські авіа- та морські бази мають виняткове значення. Ми надішлемо посла з пропозицією про обмін Північною Ірландією на негайний вступ Ірландії у війну з нашого боку."
 marines:0 "Морська піхота I"
 marines_expeditionary:0 "Експедиційні війська"
 marines_shore_parties_desc:0 "Часто першими в пролом при висадці десанту потрапляють спеціалізовані групи бойових інженерів, які мають досвід у створенні плацдарму під вогнем."
 mastermind_code_cracker:0 "Геніальний зламник кодів"
 maud_focus_desc:0 "Комітет із військового застосування уранового вибуху переконаний, що теоретично можливо створити бомбу неймовірної потужності, використовуючи уран для досягнення неконтрольованої реакції ядерного поділу. Однак, можливо, ми не зможемо вчасно розробити цю технологію самотужки. Треба поговорити з американцями."
 mechanized_equipment_2_short:0 "Бронетранспорт II"
 medium_tank_artillery_equipment_2:0 "Середня САУ II"
 medium_tank_flame_equipment_2:0 "Середній вогнеметний танк II"
 member_rules:0 "Що наші члени можуть робити?"
 mexico.13.a:0 "[From.GetNameDef] справді наш друг."
 mexico.31.desc:0 "У Мексиці знову розгорівся конфлікт між силами церкви та революції. У відповідь на зростаючий вплив католицьких партій та громадських рухів світські сили підняли збройне повстання, прагнучи повернути контроль над країною. Після десятиліття спокою знову формуються «червоні бригади», А перебіжчики з федеральної армії збираються в штатах, що досі перебувають під управлінням антицерковних губернаторів. Перша війна крістерос закінчилася переговорами між провідними представниками революціонерів і церковників за посередництва американського уряду, але, схоже, цього разу насильницьке протистояння закінчиться тільки ураженням однієї зі сторін."
 mexico.33.a:0 "Синаркісти — це загроза як для Америки, так і для Мексики."
 mexico.36.desc:0 "Пославшись на можливість того, що креслення танків потраплятимуть до рук американців, [From.GetLeader] відмовився від пропозиції щодо обміну ресурсами. Нам доведеться самим розробляти танки або платити німцям за ліцензію..."
 mexico.44.a:0 "Приходьте та забирайте!"
 mexico.8.b:0 "У нас інші плани на Мексику."
 middle_east:0 "Близький Схід"
 mikhail_kalinin:0 "$SOV_mikhail_kalinin$"
