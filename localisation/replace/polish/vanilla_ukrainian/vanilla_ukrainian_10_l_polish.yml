 HUN_demands_tt:0 "Коли ви вимагаєте у когось територію, шанс, що вам віддадуть її без кровопролиття, тим вищий, чим сильніша ваша армія. Однак навіть у цьому випадку опонент може наважитися чинити опір, якщо він має союзників.\n"
