 HINT_DIPLOMACY_TEXT:0 "Це екран §Yдипломатії§!. Тут Ви отримуєте огляд думки інших держав про Вас і їхніх дипломатичних відносин.\n\nЗавжди добре знати, чи Ваша визначена ціль має союзників, яких вона може скликати.\n\nВи також можете §Gклацнути правою кнопкою миші§! по будь-якій країні, щоби побачити можливі дипломатичні дії."
 HOA_develop_capitalstate_desc:0 "Нам потрібно пришвидшити темпи індустріалізації для поліпшення життя наших людей і захисту [ROOT.GetNameDef]. Тому ми будемо інвестувати в територію навколо міста [ROOT.Capital.GetCapitalVictoryPointName], перетворюючи її на індустріальне серце нації."
