 PRC_guerilla_cells_active_1_desc:0 "Осередки ворожих партизанів закріпилися в цьому регіоні."
 PRC_heavy_fighter_equipment_2_short:0 "JH-2"
 PRC_infiltration_sea_cat_desc:0 "Проникаючи в інші китайські регіони, ми можемо збільшити нашу підтримку в районах, які ми ще не контролюємо. [GetCommieInfiltration] Однак існує ризик, що наших прихильників викриють і усунуть. Протидія знизить рівень інфільтрації в цьому регіоні на §Y1 рівень§!."
 PRC_invite_pavel_mif:0 "Запросити Павла Міфа"
 PRC_light_tank_aa_equipment_3_short:0 "PGZ 41"
 PRC_medium_tank_artillery_equipment_2:0 "PLZ 41 Z"
 PRC_neutrality_DEF:0 "Китай"
 PRC_one_with_the_people_desc:0 "Наша відданість боротьбі за покращення [CHI.GetNonIdeologyName] має бути висвітлена якомога більше, щоб залучити більше добровольців до нашої армії."
 PRC_peoples_aviation_company_of_china_organization:0 "Китайська народна авіаційна компанія"
 PRC_peoples_liberation_army_sea:0 "Сухопутні війська НВАК"
 PRC_playing_both_sides_desc:0 "Ми повинні прагнути забезпечити лояльність людей у державах мілітаристів та [CHI.GetAdjective]их регіонах, якщо колись настане час вирішальної битви за майбутнє нашої країни."
 PRC_purge_zhang_guotao:0 "£BoP_left_texticon Провести чистку: $PRC_zhang_guotao$"
