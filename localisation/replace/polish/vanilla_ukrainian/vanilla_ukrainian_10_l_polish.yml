 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "Перебуваючи в довгій тіні Королівських ВМС, інші морські держави змушені розробляти інноваційні нові доктрини, щоби зрівнятися з нами"
 ENG_NZL_suppressed_coup:0 "Нова Зеландія придушила повстання.\n"
 ENG_VANGUARD_DESC_COMMUNIST:0 "Ми мусимо не бути переважені нашими ворогам в морях. У нас досі зберігаються кілька 15-дюймових гармат, які можна використати для заміни трудомістких 16-дюймових гармат, необхідних для наших наступних запланованих лінкорів, що значно прискорить будівництво головного корабля класу: WLNS Vanguard."
 ENG_alan_cunningham:0 "Алан Каннінґем"
 ENG_blackshirt_march_in_london_desc:0 "Тепер готується великий марш чорносорочників у Лондоні. Він, безперечно, приверне на наш бік місцеве населення або спровокує громадянську війну, якщо спалахне насильство."
 ENG_blackshirt_march_in_sussex:0 "Марш чорносорочників у Сассексі"
 ENG_carrier_4_desc:0 "Авіаносці класу «Implacable» були замовлені відповідно до військово-морської програми 1938 року і були по суті вдосконаленими версіями раннього класу «Illustrious». Війна та перехід пріоритету на менші судна для охорони конвою на ранніх і середніх етапах війни уповільнили скорочення цих суден. Це були більші судна, здатні перевозити більше літаків, зберігаючи товсту броню як на корпусі, так і на польотній палубі. Потужніші двигуни забезпечили йому більшу швидкість і радіус дії порівняно з класом «Illustrious»."
 ENG_david_stirling:0 "Дейвід Стірлінґ"
 ENG_discuss_appeasement_desc:0 "Наша політика умиротворення зазнала значної критики, тому ми представимо її на розгляд Співдружності."
 ENG_dominions_accepted_federation:0 "Домініони підтримали імперську федерацію\n"
 ENG_dutch_security_desc:0 "Політичні рухи в Нідерландах продовжують підтримувати наших ворогів. Нідерланди доведеться підкорити, щоби забезпечити вільну Європу."
 ENG_embargo_ussr:0 "Ембарго державі [SOV.GetNameDefCap]"
 ENG_enforce_blackouts_tt:0 "Цей національний дух можна видалити за рішенням."
