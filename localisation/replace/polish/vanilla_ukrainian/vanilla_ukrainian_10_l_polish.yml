 ENG_support_imperialist_coup_in_new_zealand_mission_2_tt:0 "Посилена підтримка повстання.\n"
 ENG_suppress_imperialist_coup_in_new_zealand_desc:0 "Ми боротимемося з заколотом усюди, де він тільки посміє підняти свою потворну голову."
 ENG_swedish_intervention_desc:0 "Шведські рухи проти демократії набули тривожного рівня впливу. Ми не можемо допустити, щоб шведська сталь стала зброєю в руках наших ворогів. Шведи мусять залишатися вільними, але ми мусимо забезпечити певний ступінь впливу на їхню країну."
 ENG_the_one_true_revolution_desc:0 "З містом [SOU.Capital.GetCapitalVictoryPointName] ніколи не буде співпраці. Корупція процвітає в державі [SOU.GetNameDef]; єдина надія — вирізати їй серце та взяти на себе беззаперечне глобальне лідерство в робітничій справі."
