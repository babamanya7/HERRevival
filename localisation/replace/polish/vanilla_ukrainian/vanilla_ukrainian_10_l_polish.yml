 MAN_tsr_the_long_march_south_desc:0 "Час настав. Перекинувши наші війська через кордон, ми розпочнемо завершальний етап громадянської війни в Китаї. Ще рано говорити, хто переможе, але завдяки вмілому маневруванню нашим ворогам буде важко встигати за нами."
