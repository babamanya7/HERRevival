 CHL_political_events.14.a:0 "Готуйтеся битися навіть зі своїми найближчими друзями!"
 CHL_political_events.39.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] — розумна людина, і він дійшов висновку, що наймудріше співпрацювати з нами. Він підписав усі документи, які ми надали, і тепер допомагатиме в захисті нашої півкулі."
