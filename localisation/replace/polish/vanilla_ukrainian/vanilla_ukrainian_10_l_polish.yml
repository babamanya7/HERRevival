 FRA_carrier_2_desc:0 "Авіаносці класу Joffre (назва проєкту PA-16) були наступним поколінням авіаносців для ВМС Франції. Це було останнє з проєктних досліджень, які почалися в 1929 році і закінчилися в 1937 році. Два кораблі були дозволені у військово-морській програмі 1938 року, але ескалація конфліктів уповільнила процес будівництва, і врешті-решт падіння Франції завадило завершенню будівництва цих кораблів. Водотоннажність становитиме близько 20 000 тонн. Вони мали б хороше зенітне озброєння, броню та швидкість, але доповнювали літаки нижче середнього. Загалом, це був би всебічний і універсальний авіаносець для ВМС Франції."
 FRA_carry_the_revolution_west_desc:0 "Режими Піренейського півострова висять на волосині, готові бути зметені народною революцією. Ми розірвемо цю нитку."
 FRA_charles_huntziger:0 "Шарль Гюнціже"
 FRA_connections_to_industrialists_desc:0 "Хоча співпраця з робітниками військової промисловості допомагає, співпраця з людьми, які керують фабриками, сама по собі має переваги."
 FRA_connections_to_trade_unions:0 "Зв'язки з профспілками"
 FRA_cv_CAS_equipment_1:0 "Nieuport Ni.140"
 FRA_france_undividable:0 "Франція неподільна"
 FRA_fusiliers_marine:0 "Fusiliers Marins"
 FRA_georges_valois:0 "Жорж Валуа"
 FRA_intervention_in_indochina_desc:0 "Далеко від бойових дій у Європі, наші колонії в Індокитаї є ідеальним місцем, щоби допомогти нам захистити наші інтереси в регіоні."
 FRA_invest_in_the_metropole:0 "Розвиток метрополії"
 FRA_laissez_faire_desc:0 "Комуністи відкрито говорять про радикальну перебудову економічної структури нашої країни, про позбавлення працьовитої людини належної власності. Проти цього ми поставимо просте поняття свободи. Динамічна економіка завжди перевершить лівий кошмар задушення бюрократії."
 FRA_nav_bomber_equipment_1:0 "Latécoère 298"
 FRA_naval_doctrine_desc:0 "Успіхи, досягнуті у галузі кораблебудування, відкривають нові можливості тактичного та стратегічного маневрування. Але всі ці теорії потребують перевірки, поки ми не побудуємо нові плани і не почнемо застосовувати їх на практиці."
 FRA_proclaim_the_third_empire:0 "Проголосити Третю імперію"
 FRA_rene_prioux:0 "Рене Пріу"
 FRA_retribution_for_sedan_desc:0 "Понад півстоліття німці святкують там битву при Седані і свій тріумф над Наполеоном Третім. У майбутньому кожен німець навчиться проклинати назву того місця."
 FRA_scw_intervention_republicans_desc:0 "Республіканцям в Іспанії потрібна наша допомога! \nВсі, хто готовий боротися на їхньому боці, мусимо мати таку можливість. Ми не можемо дозволити фашистам заволодіти ще одним плацдармом."
 FRA_support_the_finns_desc:0 "Фіни борються за життя. Ми мусимо їм допомогти."
 FRA_syria_intervention.3.a:0 "Статус-кво залишається незмінним."
