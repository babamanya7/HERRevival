 tsr_bandit_suppresion_opm:0 "Придушення бандитизму"
 tsr_manchukuo.11.c:0 "Змусити Квантунську армію вибачитися"
 tsr_manchukuo.15.desc:0 "Не переконавшись нашими аргументами, японці вирішили, що для $JAP_naoki_hoshino$ буде краще залишитися вдома в Японії, аніж обіймати посаду в уряді Маньчжурії. Хоча це розчаровує, ми все одно знайдемо шлях уперед."
 tsr_manchukuo.17.a:0 "Чудово"
 tsr_manchukuo.20.t:0 "Совєти передають Монґолію і Туву"
 tsr_manchukuo.5.b:0 "Зрадники!"
 tsr_manchukuo.7.t:0 "[MAN.GetLeader] пропонує інтеграцію"
 turkestan_united_DEF:0 "Туркестан"
 uk_iraq_focus_desc:0 "Ми надали Іраку незалежність у 1932 році, але з огляду на нинішню глобальну ситуацію, це могло бути помилкою. Не можна допустити, щоб іракська нафта потрапила до наших ворогів..."
 uk_sanction_italy_focus:0 "Санкції проти Італії"
