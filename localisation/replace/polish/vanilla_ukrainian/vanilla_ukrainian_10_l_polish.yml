 CHI_leader_of_the_chinese_brotherhood_trait:0 "Лідер Китайського братерства"
 CHI_legitimise_du_desc:0 "Дехто радив би нам триматися подалі від тих, хто має неортодоксальні способи заробітку, але, можливо, це означало б лише відкинути цінний ресурс. Ми повинні подивитися, що Ду Юешен міг би зробити, якби йому не доводилося працювати в тіні."
