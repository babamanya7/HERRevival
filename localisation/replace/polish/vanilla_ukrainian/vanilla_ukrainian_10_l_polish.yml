 ITA_bring_back_old_glories_desc:0 "У нас є багато старих кораблів, які стоять у різних портах і чекають на утилізацію. Деякі з наших інженерів і морських офіцерів стверджують, що за допомогою деяких змін ми могли би повернути ці старі кораблі до ладу."
 ITA_bulgaria_friend_desc:0 "Болгарія знаходиться в нашій сфері впливу. Їхня безпечна близькість до Італії — ключ до наших амбіцій на Балканах."
 ITA_cantiere_oto:0 "Odero–Terni–Orlando"
 ITA_cede_aquila_class_destroyers_tt:0 "([ROOT.GetEscortShipsSender]): Переміщує §Y2 Есмінці класу \"Аквіла\"§! до [ROOT.GetEscortShipsReceiver]."
 ITA_colonial_unrest_tt:0 "Колоніальні заворушення: §R+15%§!"
 ITA_colonial_uproar_tt:0 "Великі колоніальні заворушення: §R+80%§!"
 ITA_cooperation_program_with_country_desc:0 "Будівництво та експорт наших кораблів до інших країн може призвести до поглиблення технологічної співпраці."
