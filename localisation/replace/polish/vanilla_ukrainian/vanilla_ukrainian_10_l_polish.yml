 moderate_reformist:0 "Помірний реформіст"
 modern_ship_torpedo_launcher_desc:0 "Потужна пневматика дозволяє запускати важчі торпеди, надаючи їм більш високу швидкість.\n\nУстановка цього модуля на §Yлегкі кораблі§! та §Yкрейсери§! дозволяє завдавати істотної шкоди ворожим §Yосновним кораблям§!."
