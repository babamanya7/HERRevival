 NOR_administrative_council_dmod_desc:0 "Поки наша країна перебуває під окупацією, ці чоловіки та жінки будуть групою, якій доручатимуть дрібні справи, а великі рішення прийматимуть далеко від нас наші фашистські володарі."
 NOR_appoint_prince_olav_to_army_staff:0 "Призначити принца Олава до штабу армії"
 NOR_claims_on_ireland:0 "Претензії до Ірландії"
 NOR_communist_prep_2_irregulars:0 "§GНадати 2 нерегулярні дивізії§!"
 NOR_communist_prep_intro:0 "\nКоли почнеться §YКомуністична революція§! ця область:"
 NOR_crush_hitler_desc:0 "Небагато людей зібрали стільки злочинів проти людяності, як Адольф Гітлер. Він знищив незліченну кількість життів, і його зло, здається, не знає меж. Його кінцева мета — знищення всього, що нам дорого, тому ми повинні покласти край його планує, перш ніж покінчити з нами."
 NOR_denounced_us:0 "Вони засудили нас!"
 NOR_elias_corneliussen:0 "Еліас Корнеліуссен"
 NOR_expand_Haeren:0 "Розгорнути Hæren"
 NOR_expand_Haeren_desc:0 "Наші нинішні сухопутні сили бліднуть у порівнянні з іншими арміями на континенті, [ROOT.GetName] просто ніколи не була мілітаристською нацією. Оскільки загроза глобальної війни зростає, ми повинні переконатися, що наше населення готове захищати нашу молоду державу."
 NOR_expedite_training_desc:0 "Навчання наших військ якомога найкраще є життєво важливим для нашого виживання, але це буде марно, якщо вони закінчать своє навчання і [NOR.GetName] не залишиться для захисту. Ми повинні проштовхнутися якнайшвидше, перш ніж нас відштовхнули нашу націю."
 NOR_focus_on_training_desc:0 "Нам потрібно спрямувати всі наші зусилля на те, щоб якомога швидше перетворити наші резерви та новобранців на солдатів і вийти на фронт, оскільки фронту може не бути ще довго."
 NOR_gw_tank_equipment_short:0 "Strv. FT-17"
 NOR_hoyre_name:0 "Праві"
 NOR_king_haakon_vii_ns_desc:0 "Як перший [NOR.GetAdjective]ий монарх із XIII століття, король Гокон VII є зразком демократії. Лише після референдуму він прийняв корону і залишив правління державою [NOR.GetName] своїм радникам та іншим високопоставленим вельможам."
 NOR_light_tank_equipment_2:0 "Landsverk L-120"
 NOR_light_tank_equipment_3:0 "Stridsvogn m/41"
 NOR_lobby_for_parliamentary_support:0 "Лобіювати підтримку в уряді [FROM.GetAdjective]"
 NOR_mechanized_equipment_2_short:0 "Stpv. II"
 NOR_otto_ruge:0 "Отто Руґе"
 NOR_prince_olav_to_navy_staff:0 "Принц Олав у штабі ВМС"
 NOR_quislings_regime:0 "Режим Квіслінґа"
 NOR_quislings_regime_desc:0 "Стабільна привітність Fører Nasjonal Samling очевидна. І хоча багато хто відкидає його на політичному та особистому рівні, навіть у його власному кабінеті, не можна заперечувати, що його впертість і впевненість принесли результати. Він безперечно здатний підтримувати посаду функціонуючий режим, як довго? Це ще належить побачити."
 NOR_radical_trade_unionist:0 "Радикальний член профспілки"
 NOR_research_funding_desc:0 "Наші благородні [ROOT.GetAdjective]і правителі віддані просвітництву, тому вони раді бути покровителями наукового прогресу, необхідного для того, щоб наш домініон розширювався спочатку за допомогою насильства, а згодом лише за рахунок доброзичливості."
 NOR_revamp_hydroelectric_capacity_desc:0 "Алюміній життєво важливий для будівництва літаків та інших військових знарядь, але кількість енергії, необхідної для переробки бокситу в алюміній, робить цей процес дорогим. На щастя для нас, [NOR.GetName] має ідеальний рельєф для токарної обробки наші численні озера та річки перетворені на гідроелектростанції. Тож ми можемо виробляти необхідний алюміній, незважаючи на відсутність великих покладів бокситів."
 NOR_second_north_sea_empire_desc:0 "Регент Педер Анкер Ведель-Ярлсберґ заявив, що має намір відновити колишню славу Норвеґії, і що це лише питання часу, коли постане нова Норвезька імперія."
 NOR_stern_communist:0 "Затятий комуніст"
 NOR_subject:0 "$OVERLORDADJ$а $NOR$"
 NOR_the_secret_army_desc:0 "З 1918 року навколо [NOR.GetName] було створено та сховано автономне військо під назвою Hemmelige Hæren, щоб розпочати дії, якщо виникне ризик захоплення влади комуністами. Їхню обітницю проти комунізму можна підірвати підтримкою фашизму тощо. що важливо, підтримка нашого власного поглинання."
 NOR_the_weapons_of_conquest:0 "Зброя завоювання"
 NOR_trotsky_communism_ADJ:0 "Норвезьк"
 NOR_ulfhedhnar_ns_desc:0 "Ми відродили наших традиційних берсерків-вікінґів, «вовчих плащів». Ці чоловіки жадають битви і готові очолити наші завоювання по всьому світу."
 NOT_ENOUGH_PP_TO_UNASSIGN:0 "\n\n§RНедостатньо політичної влади§!"
 NOT_TRADING_WITH_COUNTRY:0 "Ми не торгуємо з державою @$TAG$$COUNTRY|H$"
 NSB_poland_communist_events.3.t:0 "[From.GetNameDefCap] планує [Root.GetAdjective] інтеграцію"
 NSB_poland_communist_events.5.desc:0 "[From.GetNameDefCap] — більше не [Root.GetAdjective] маріонетка: держава оголосила себе незалежною соціалістичною республікою. Поки що ситуація розвивається мирно, і [From.GetNameDef] як і раніше входить до складу Root.GetFactionName]."
 NSB_poland_events.101.t:0 "[From.GetNameDefCap] погоджується"
