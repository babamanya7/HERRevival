 USA_full_desegregation_desc:0 "Занадто довго деякі наші штати визначали своє ставлення до громадян, використовуючи застарілі, неактуальні, нелюдські критерії. У вільній республіці до всіх громадян має бути рівне ставлення, їх не можна розділяти."
