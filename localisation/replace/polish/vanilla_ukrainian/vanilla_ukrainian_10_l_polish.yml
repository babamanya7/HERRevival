 MAN_tsr_claim_outer_manchuria_desc:0 "Втрата Зовнішньої Маньчжурії на користь росіян донині залишається скалкою в оці маньчжурських націоналістів. Ми повинні прагнути виправити цю історичну несправедливість, повернувши та реінтегрувавши ці території в новонароджену маньчжурську націю."
