 BUL_bulgaria_on_the_three_seas_buliding_tt:0 "Додає §Y2 верфі§! до будь-якої держави з Військово-морськими верфями, вже побудованими вздовж узбережжя Егейського, Адріатичного або Чорного моря.\nДодає §Y1 морську базу§! та §Y2 прибережні укріплення§! в будь-якій провінції з морською базою в Егейському, Адріатичному чи Чорному морях.\nПоточні ефекти:"
 BUL_bulgarian_administration_of_the_balkans_axis_name_def:0 "Осі в"
 BUL_bulgarian_irredentism_desc:0 "Болгарський націоналізм закликає до необхідності перекроїти балканські кордони на користь Болгарії, і з цим погодяться навіть комуністи та демократи. Ми мусимо наголосити на необхідності відновлення Великої Болгарії, спільної мети для всього нашого народу."
