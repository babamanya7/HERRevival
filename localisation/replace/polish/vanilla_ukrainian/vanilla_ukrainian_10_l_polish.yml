 JAP_naval_faction_demands_dockyards:0 "$JAP_naval_faction$ вимагає більше верфей"
 JAP_new_order_in_east_asia_desc:0 "У нещодавніх заявах [ROOT.GetLeader] стало ще більш очевидним, що він має намір встановити новий порядок у Східній Азії, який переслідує шість основних цілей. Вони включають: постійну стабільність Східної Азії, добросусідську дружбу та міжнародну справедливість, спільну оборону проти комунізму, створення нової культури, економічну згуртованість і співпрацю, і, нарешті, мир у всьому світі."
 JAP_pacific_integrated_customs_union_member_tt:0 "§Y[JAP.GetNameDefCap]§! зможе §Rспробувати підкорити нас дипломатичним шляхом!§!"
 JAP_press_association_idea:0 "Асоціація преси Великої Японії"
 JAP_promote_pan_asianism:0 "Просування паназіатизму"
 JAP_purge_the_militarists_desc:0 "Нам слід позбавитися всіх, хто вірить у військове вирішення будь-яких проблем, щоби на їх місце прийшли прихильники більш стриманих підходів. Вони можуть знайти свій шлях за межами наших кордонів."
 JAP_raise_boeitai_tt:0 "Розгорнути всі дивізії ополчення до нашої поточної межі."
