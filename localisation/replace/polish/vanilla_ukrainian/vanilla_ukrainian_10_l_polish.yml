 DEN_welcome_foreign_scientists_desc:0 "В Європі знову назрівають проблеми, і люди тікають від режимів, які намагаються їх придушити. Приймаючи деяких з них з розпростертими обіймами, ми можемо отримати багато знань і компетенції."
