 JAP_launch_the_suiyuan_campaign_tt:0 "За нашої підтримки §YАрмія Внутрішньої Монґолії§! та §YПраведна армія Великої Хань§! розпочнуть наступ для захоплення регіону §Y[621.GetName]§! у сил Ґоміньдану, але матимуть лише вузьке вікно можливостей, перш ніж операцію доведеться скасувати"
 JAP_light_cruiser_2:0 "Клас «Mogami» (легк.)"
 JAP_light_cruiser_3_desc:0 "Легкі крейсери класу «Agano» були спроєктовані перш за все як лідери флотилії для ескадрених міноносців. Вони були швидкісними, озброєні 3 спареними 152-мм гарматами, але обмежене озброєння ППО і тонкі броньові листи були основними недоліками конструкції."
