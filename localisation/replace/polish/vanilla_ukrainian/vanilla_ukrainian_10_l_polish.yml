 POR_unstable_monarchy:0 "Нестабільна монархія"
 POSSIBLE_FACTION_INVITES:0 "Якщо ми оголосимо війну:"
 PRC_ADJ:0 "Китайськ"
 PRC_agricultural_reform_desc:0 "Тепер, коли ми гарантували, що можемо контролювати ресурси нашої економіки, ми повинні продовжити сільськогосподарську реформу, передаючи землю від поміщиків біднішим фермерам."
 PRC_army_doctrines_superior_firepower__tt:0 "За наявність §Y$GRAND_DOCTRINE_SUPERIOR_FIREPOWER$§!:"
 PRC_army_tank_research_desc:0 "Оскільки наша молода промисловість тепер здатна забезпечити важче озброєння, настав час наздогнати інші військові держави та розробити потужності для виробництва танків. Це дасть нам значну перевагу проти сусідніх країн без такої зброї та зміцнить нашу позицію проти тих, хто має власні бронетанкові сили."
 PRC_assaulting_shanxi:0 "Штурм [615.GetName]"
 PRC_ban_special_goods_trade_tt:0 "Покращений §Yнаціональний дух§!, який застосується через рік, буде: "
 PRC_ban_the_opium_trade:0 "Заборонити торгівлю опіумом"
 PRC_central_security_bureau_desc:0 "Не можна допустити, щоби навіть у маленькому селі продовжували тліти вогнища контрреволюції. Ми мусимо спіймати всіх зрадників до останнього, поки вони не наробили справ."
 PRC_charming_revoluionary:0 "Чарівний революціонер"
 PRC_cmc_military_industry_bureau:0 "Бюро військової промисловості ЦВР"
 PRC_consolidate_politcal_power_desc:0 "Тепер один лідер є верховним, і життєво важливо, щоб ми перейшли до закріплення цього в усіх партійних структурах. Дисидентів не можна допускати."
 PRC_develop_the_army:0 "Розвивати армію"
