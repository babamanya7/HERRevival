 ship_submarine_deck_space_desc:0 "A watertight compartment and catapult equipment allowing a submarine to carry, launch and recover a small number of seaplanes."
 siam.15.a:0 "Запропонувати поступки."
 siam.2.desc:0 "Повідомлення від бангкокського кореспондента Reuters розкриває третю за чотири роки спробу отруїти прем'єр-міністра Сіаму (пана Пхун Сонгграма).\nМинулого тижня, як повідомляється, отруту було підмішано в їжу, що тимчасово вплинуло на пана Сонгграма, його дружину та доньку.\nБританський міністр закордонних справ (лорд Галіфакс) у посланні до пана Сонгграма висловлює тривогу з приводу боягузливої спроби замаху на життя прем'єр-міністра та радість з приводу його порятунку."
 siam.22.t:0 "Відправити бюрократів [SIA.GetName] за кордон"
 siam.23.desc:0 "Бат не може залишатися незакріпленим, поки [ROOT.GetName] прагне порядку в торгівлі та фінансах. Наші чиновники тепер стверджують, що монетарна стабільність потребує міцного зовнішнього якоря, прив'язаного до валюти, яка має вагу, щоб заспокоїти купців, кредиторів та іноземних партнерів. Вибір перед нами — не просто технічний. Він сформує напрямок нашої торгівлі, характер нашого розвитку та іноземний вплив, який ляже на економіку [SIA.GetAdjective]."
 siam.4.t:0 "Симпатиків Сонгсурадета заарештовано"
 siam_adc.4.t:0 "[FROM.GetNameDefCap] відхиляє незалежність"
 siam_dem.3.a:0 "Критика поширюється"
 siamese_puppet_focus_desc:0 "Нашим військам необхідний доступ до Сіаму, щоб підійти до британських володінь у Бірмі та Малайї. Демонстрація сили змусить сіамський уряд підписати договір про союз із нами як із гідним довіри партнером у Великій східноазійській сфері взаємопроцвітання."
 sick_desc:0 "§LПрикутий до ліжка через важку хворобу.§!"
 singapore_focus_desc:0 "Сінґапур мусить залишатися нашою головною морською базою на Сході. Гонконґ може впасти до рук японців, але Сінґапур мусить залишатися неприступним, поки не прибуде Головний флот для рішучої перемоги над ворогом."
 siphon_equipment_stockpiles_for_fascist_civil_war_desc:0 "Потрохи розкрадаючи військові склади, ми можемо створити невеликий запас озброєння, яке допоможе нам у майбутній боротьбі."
 skoda:0 "Škoda"
