 SPR_revive_the_republican_navy_desc:0 "Наш флот був так само розірваний початком громадянської війни, як і наша армія, і його відбудова має бути пріоритетом для національної безпеки нашої держави. Для цього буде потрібно створення нової інфраструктури, яку ми розпочнемо негайно."
