 CHL_devalue_the_peso_franc_desc:0 "У той час як інші країни дозволили своїм валютам стати менш цінними, щоби допомогти своїм економікам, ми ще не зробили цього. Як наслідок, ми дуже відстаємо. Якщо ми хочемо наздогнати їх, ми не мусимо чекати на девальвацію нашої валюти, навіть якщо це виявиться непопулярним заходом."
 CHL_establish_corfo_desc:0 "Ми мусимо спробувати створити організацію, яка могла б відповідати за промисловий розвиток, розподіл ресурсів і зусилля з реконструкції. Її можна назвати Corporación de Fomento de la Producción de Chile."
