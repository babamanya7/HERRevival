 RAJ_GOE_secure_southern_india:0 "[GetMughalCivilWarStatus] Південна Індія"
 RAJ_GOE_vie_for_princes_pressure_unknown:0 "Невідомо"
 RAJ_a_secular_state_desc:0 "Індія — релігійна країна, але важливо, щоб сама держава була світською, щоб усунути будь-які сумніви щодо потенційної упередженості проти меншин."
 RAJ_abolish_agrarian_society_criteria_tt:0 "Назавжди зменшує час, необхідний для зменшення ефектів §Y$idea_RAJ_agrarian_society$§!, на §Y3§! місяці."
 RAJ_administrative_oversight_desc:0 "Після подолання корупції в промисловості та забезпечення нашої незалежності настав час взяти місцевих адміністраторів під контроль уряду. Хоча це може здатися складним завданням, племінні лідери та місцеві чиновники мають великий вплив на значну частину нашого населення. У ці темні часи їх необхідно залучити до співпраці заради блага нашої країни."
 RAJ_airforce_shortcut:0 "Індійські ВПС"
 RAJ_anti_air_equipment_2:0 "QF 40 mm Bofors"
 RAJ_arrest_congress_leaders_desc:0 "Лідери Конгресу не підкоряться новій реальності правління компанії. Вони все ще чинять опір і здіймають галас при найменшій нагоді. Нам потрібно придушити бунтівників, перш ніж це пошириться."
