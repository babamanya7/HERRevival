 ITA_partito_democratico_del_lavoro_long:0 "Демократична партія праці"
 ITA_political_commissars_desc:0 "Щоби зберегти прихильність до комунізму та надихнути ідеологічне завзяття в наших військах, ми введемо в армії фігуру політичних комісарів, відповідальних за політичну освіту й організацію підрозділів, до яких вони прикріплені."
