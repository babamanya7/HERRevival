 unlock_general_tt:0 "Персонаж стає доступний у якості генерала"
 usa.1.d:0 "Оскільки американці мобілізуються на війну, ми отримали незвичайний запит. Амелія Ергарт, відома льотчиця, яка нещодавно успішно обігнула земну кулю, бажає вступити в армійський авіаційний корпус пілотом винищувача. Вона продемонструвала значну майстерність у імітаційних повітряних боях, але серед військового істеблішменту є багато тих, хто не сприймає ідею про те, що жінка виконує бойові завдання. Чи варто в її випадку зробити виняток і дозволити їй приєднатися?"
 usa.63.b:0 "Нехай спробують проштовхнути це самі."
 usa.63.desc:0 "Делегація Конгресу з штату [USA_congress_investment_state.GetName] звернулася до уряду з кількома пропозиціями щодо поліпшення інфраструктури штату. Федеральне фінансування повинно бути доступним для модернізації доріг і мостів з метою сприяння торгівлі між штатами. Вони також зазначили, що підтримка з боку уряду в цьому, безумовно, змусить їх бути більш схильними підтримувати президента більш безпосередньо в його порядку денному."
 usa_commonwealth_faction:0 "Американська співдружність"
 vittorio_emanuele_desc:0 "«Король-солдат» нагадує італійцям про їхні недавні перемоги у Великій війні. Його присутність і лояльність до нього — це хороше джерело єдності народу."
 vladivostock_concession_tt:0 "[ROOT.GetAdjective] експедиційне військо, яким командує §Y[?SOV.SOV_japanese_general.GetName]§!, буде відправлено на підтримку силам опозиції.\n§Y[408.GetName]§! відійде державі §Y[ROOT.GetName]§! після закінчення громадянської війни в державі [SOV.GetNameDef]"
 volunteers_receiver_desc:0 "У державі $COUNTRY|Y$ є добровольці з інших держав."
 war_declaration_generated_tension_25:0 "Цільова країна витворила принаймні 25% світової напруженості"
 war_justification.212.d:0 "«У сучасній історії, можливо, навіть в історії в цілому, не було гіршої тиранії, ніж залізна хватка, в якій [ROOT.GetRulingParty] зараз тримає [ROOT.GetName]. Люди можуть стверджувати, що ми не повинні провокувати конфлікти, що ми повинні довіряти [ROOT.GetLeader] дотриманню договорів і обіцянок у майбутньому, але ці люди не бачать, що договори, укладені під час правління фашизму, марні. Для цих безчесних брехунів сила має рацію, і папір, на якому написана угода, згорає так само легко, як і книги їхніх недоброзичливців.\"\n\nЗаздрячи славному суспільству, яке ми будуємо, і спадщині, на якій воно ґрунтується, [From.GetAdjective], здається, готові розпочати війну, щоб знищити його. Ось вам і їхні претензії на мир."
 war_propaganda_convoys_desc:0 "Навіть цивільні можуть допомогти перемогти у війні — завдяки турботі та уважному ставленню до використання матеріалів, кожен грам сталі може стати вдвічі ціннішим для військових зусиль."
 wargoal_receiver_desc:0 "$COUNTRY|UY$ є ціллю іноземних цілей війни."
 warlord_support_from_XSM:0 " [XSM.GetNameDefCap]([?XSM.warlord_political_support_value|+0])"
 warsaw_uprising_will_happen_tt:0 "Кожна §Y[POL.GetAdjective]а осердна область§! піднімуть §Rповстання§! проти держави §Y[FROM.GetNameWithFlag]§!."
 wildlife_surroundings:0 "Околиці дикої природи"
 william_halsey:0 "$USA_william_halsey$"
 wtt_britain.26.t:0 "Французи здають флот"
 wtt_britain.29.d:0 "Уряд Ірландії відкинув пропозицію, відмовившись брати участь у нашій боротьбі за демократію."
 wtt_burma_road.2.desc:0 "[From.GetAdjective]ий уряд вирішив, що не можна більше допускати транспортне сполучення бірманською дорогою. Всі конвої на ній зупинені, їм наказано повернутись. Тепер ми не зможемо отримувати постачання по ній."
 wtt_china.10.b:0 "Ми будемо боротися!"
 wtt_china.12.a:0 "Доведеться вжити заходів."
 wtt_china_shared.1.a:0 "Їхня допомога потрібна, як ніколи."
 wtt_china_shared.14.t:0 "Жодної допомоги від держави [From.GetNameDef]"
 wtt_china_shared.2.a:0 "Їхня боротьба — це наша боротьба."
 wtt_china_shared.3.t:0 "[From.GetNameDefCap] відхиляє нашу підтримку"
 wtt_germany.14.a:0 "Їхня військова міць для нас важливіша за ці землі."
 wtt_germany.19.t:0 "[GER.GetName] виступає проти держави [SOV.GetName]"
 wtt_germany.29.d:0 "Німецька імперія скасувала вигнання Вільгельма II і звернулася до Нідерландів із вимогою повернути колишнього кайзера. Схоже, незважаючи на численні вимоги екстрадиції з метою закликати кайзера до відповідальності, що раз у раз відхиляються урядом Нідерландів, цей розпалювач війни знову очолить Німецьку імперію.\n\nФранція вже заявила, що це неприйнятно і, схоже, має намір висунути ультиматум, підкріплений військовою силою. Громадськість Великобританії налаштована проти війни, але якщо ми відмовимося підтримати Францію, наш союз із нею буде розірваний."
 wtt_germany.4.d:0 "Пишними торжествами було відзначено повернення Вільгельма II як кайзер Німецької імперії! Нідерланди заслужили велику подяку за те, що всі ці роки надавали йому безпечний притулок і неодноразово відмовлялися видавати його колишнім ворогам. Повернення кайзера обіцяє стабільність та єдність країні, що постраждала від недавньої громадянської війни."
 wtt_germany.40.a:0 "Потрібно виявити терпіння."
 wtt_germany.54.a:0 "Провести кампанію на користь об'єднання."
 wtt_germany.60.a:0 "Хто допоможе їм, коли всі ми падемо під натиском радянців?"
 wtt_germany.70.t:0 "[From.GetName] відкидає пропозицію про інтеграцію"
 wtt_germany.73.a:0 "Під нашим піклуванням їхня армія стане кращою."
 wtt_hanoi_route.1.desc:0 "[GetVietnamOwner] перекриває шлях із Ханойської гавані на північ, до китайського кордону; в результаті постачання нашої армії було зупинено. \n\nПодальші поставки цим шляхом неможливі."
 wtt_hanoi_route.2.desc:0 "Місцева [From.GetAdjective]а влада отримала наказ блокувати військові поставки в Ханой, які передбачалося відправити до китайського кордону. У порту виставлено озброєну охорону, яка стежить за тим, щоб жоден екіпаж корабля не прорвав блокаду. [From.GetAdjective]а берегова охорона розгортає всі судна, що досі перебувають у морі. \n\nПодальші поставки цим шляхом неможливі."
 wtt_infiltration.4.desc:0 "Повідомлення про широке впровадження комуністів, схоже, були перебільшені. Рейди на відомі місця їх укриття нічого не виявили. Це означає, що комуністи не змогли організувати свою мережу, або ми придушили все, що їм вдалося створити. Але ми мусимо залишатися напоготові, оскільки вони, поза всяким сумнівом, сподіваються приспати нашу пильність і посилити свою діяльність."
 wtt_infiltration.5.a:0 "Сподіватимемося, що до цього не дійде."
 wtt_japan.1.t:0 "[From.GetNameDefCap] жадає владу над нашими колоніями"
 wtt_japan.119.TT:0 "Отримає 8 військових частин із §Y12 піхотними§! батальйонами та §Y3§! батальйонами §Yпідтримки§!."
 wtt_ledo_road.4.desc:0 "Сьогодні в Юньнань прибула перша транспортна колона по відкритій дорозі Ледо. На повне відновлення вантажопотоку піде якийсь час, але постачання вже почалося."
 wtt_news.14.d:0 "Але що зроблять британці?"
 wtt_news.21.d:0 "Побачимо, як вони до цього поставляться."
 wtt_news.3.desc:0 "Вчора вранці уряд Німеччини зробив несподівану заяву, що має намір повернути вигнаного Вільгельма II. Вдень того ж дня кортеж, що супроводжував старого кайзера, перетнув кордон Нідерландів та Німеччини, і після повернення до Берліна Вільгельм II був відновлений у титулі кайзера Німецької імперії.\n\nВін уже заприсягся повернути Німеччині її колишню велич, але поки що не зробив жодних заяв щодо політичного курсу своєї країни.."
 wtt_news.39.desc:0 "Слідом за інцидентами, названими «нахабними провокаціями», японський уряд заявив, що Китай перебуває у стані «озброєного конфлікту». Воно стверджує, що центральний уряд, яким керує [CHI.GetLeader], продемонстрував своє небажання чи нездатність покарати відповідальних. Як наслідок, у Китай були направлені японські «миротворчі сили» з метою збереження порядку та запобігання подальшим нападам."
 wtt_news.41.c:0 "$wtt_news.40.c$"
 wtt_news.48.t:0 "Війна за незалежність Маньчжурії"
 wtt_news.61.t:0 "Відродження держави [From.GetNameDef]"
 wtt_news.69.a:0 "Ми затвердили нашу гегемонію."
 wtt_news.9.b:0 "Це змусить їх замислитися."
 wtt_political_organisation.12.a:0 "Ми переможемо."
 wtt_warlord_vs_prc.22.t:0 "[From.GetNameDefCap] погоджується"
 wtt_warlord_vs_prc.23.t:0 "[From.GetNameDefCap] відмовляється"
 wtt_warlord_vs_prc.33.t:0 "[From.GetNameDefCap] відмовляється"
 wtt_warlord_vs_prc.4.desc:0 "Незважаючи на всі переконання з боку лідера [communist_china.GetLeader], [SOV.GetLeader] залишився при своїй думці. Визнавши поразку, [communist_china.GetLeader] публічно заявив про те, що помилявся і пообіцяв співпрацювати з нами заради перемоги революції."
 wtt_xian_incident.10.b:0 "Жодних угод із комуністами!"
 wtt_xian_incident.3.t:0 "[From.GetLeader] відмовляється від зустрічі"
 wtt_xian_incident.5.t:0 "[CHI.GetLeader] пропонує укласти альянс"
 wtt_xian_incident.9.a:0 "Черговий буржуазний ворог зустрів свою смерть."
 wuw_GER_chinese_diplomacy.3.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 wuw_GER_civil_war.4.desc:0 "Після завершення громадянської війни постає питання, чи варто дозволяти політичним парамілітарним організаціям діяти вільно. Можливо, краще їх розпустити або хоча б скоротити."
 wuw_GER_civil_war.9.desc:0 "Після перемоги над нацистами, очільник військового уряду Август фон Макензен вирішив піти з польової служби через вік і стан здоров'я. Відтепер він допомагатиме лише з адміністративними справами."
 wuw_GER_diplomacy.111.b:0 "Ми не можемо це прийняти, хай буде що буде!"
 wuw_GER_diplomacy.113.b:0 "Отже, війна!"
 wuw_GER_diplomacy.50.desc:0 "\nДипломати та кораблебудівники з [FROM.GetNameDef] звернулися до нас із незвичайною пропозицією. Вони прагнуть започаткувати масштабну програму морської співпраці, що передбачає обмін технологіями та досвідом між нашими країнами. Це може принести користь, але також створює ризик витоку секретної інформації до [FROM.GetAdjective]. Що ми відповімо?"
 wuw_GER_diplomacy.65.a:0 "Усе йде за планом!"
 wuw_GER_german_politics.02.a:0 "Генріх Брандлер — правильний вибір!"
 wuw_GER_german_politics.02.desc:0 "Разом із відродженням ідеалів Спартака зростає бажання активнішої участі народу в управлінні. Вибори нового представника завершились дуже близькими результатами. Люди вважають обох кандидатів гідними, але обрати можна лише одного."
 wuw_GER_realpolitik.1.a:0 "Смиренно приймаємо цю пропозицію"
 wuw_GER_realpolitik.34.a:0 "Ми вдячні за їхню наївність"
 wuw_GER_reichskommissariats.11.b:0 "Її слід включити до складу Московії"
 wuw_GER_releasable.2.b:0 "Йозеф Бех ще потрібен"
 wuw_GER_weltpolitik.2.t:0 "[FROM.GetNameDefCap] повертає наші колонії"
 wuw_HUN_allied_manufacturing_programs_desc:0 "Хоч наша промисловість і сильна, вона не може конкурувати з провідними державами. Ми повинні виробляти літаки на союзницьких заводах, розраховуючись у пінґо."
 wuw_HUN_an_alliance_with_italy_desc:0 "Попередні кроки до союзу, закладені в Римських протоколах, тепер можна розширити. Ми направимо делегацію до Італії для обговорення угоди про військове співробітництво."
 wuw_HUN_central_military_planning_committee:0 "Центральний військовий комітет"
 wuw_HUN_elect_a_fascist_king:0 "Обрати фашистського короля"
 wuw_HUN_enlarge_the_ganz_danubius_division_tt:0 "Додати §G3§! §Yверфі§! у випадкову контрольовану §Yприбережну область§!"
 wuw_HUN_expand_the_lignite_industry:0 "Розширити буровугільну промисловість"
 wuw_HUN_news_events.9.b:0 "Це не їхнє!"
 wuw_HUN_parade_istvan_bethlens_platform_desc:0 "Розчарований нинішнім станом справ і дедалі агресивнішою авторитарною риторикою прем'єр-міністра Дюли Ґьомбьоша, колишній прем’єр Іштван Бетлен сформував нову опозицію. Ми повинні скористатися цією можливістю, щоб підірвати вплив адмірала та його фашистських поплічників."
 wuw_HUN_reverse_the_brain_drain_desc:0 "Через дискримінаційні закони багато науковців покинули країну. Настав час повернути їх і знову підняти [ROOT.GetAdjective] науку."
 wuw_HUN_the_bastion_of_catholicism:0 "Фортеця католицизму"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen:0 "Землі Корони Святого Іштвана"
 wuw_HUN_the_szekel_command_desc:0 "Після повернення §Y[76.GetName]§! та землі Секей ми можемо залучити місцеве угорське населення — досвідчених у горах секеїв — як елітні частини нашої армії."
 wuw_HUN_the_triple_kingdom:0 "Потрійна монархія"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil_desc:0 "Нам потрібно якнайшвидше створити новий винищувач, і наші вчені з Weiss Manfréd Acél- és Fémművek вже розробили креслення так званої Срібної стріли — Ezüst Nyíl — і чекають дозволу на початок виробництва."
 wuw_HUN_wolfs_of_the_sea_desc:0 "Підводні човни ледь не перемогли найсильніший флот світу у минулій війні. Ми не можемо претендувати на статус сучасного флоту без підводних човнів."
 ww_BEL_event_diplomatic.1.a:0 "Нехай вони йдуть своїм шляхом"
 ww_BEL_event_diplomatic.11.desc:0 "Наша делегація в Парижі повідомила, що переговори щодо Кале зазнали невдачі, і нам, ймовірно, доведеться вдатися до сили, щоб забезпечити цю землю, яка по праву належить нам. Ми намагалися бути розумними в наших пропозиціях, але вони відмовляли нам на кожному етапі. Час показати їм справжню міць [BEL.GetAdjective] армії."
 ww_BEL_event_diplomatic.12.a:0 "Ми надамо їм допомогу!"
 ww_BEL_event_diplomatic.13.a:0 "Це зберігає нас в безпеці"
 ww_BEL_event_diplomatic.15.desc:0 "Запит від вигнаного керівництва [FROM.GetAdjective] тільки що надійшов до нас. Вони хочуть отримати деяке обладнання для тренування своїх залишкових військ, сподіваючись, що з часом вони зможуть повернути свою батьківщину."
 ww_BEL_event_diplomatic.16.t:0 "[FROM.GetNameDefCap] Просить фабрики"
 ww_BEL_event_diplomatic.22.desc:0 "Дипломати [FROM.GetAdjective] повернулися до нас з розчаровуючою відповіддю. Вони стверджують, що хоча ідея може бути благородною, вона неминуче зазнає поразки, як і подібні ініціативи раніше."
 ww_BEL_event_diplomatic.23.a:0 "Звісно, ми приєднаємося"
 ww_BEL_event_diplomatic.26.b_tt:0 "§RВони можуть вигнати нас з фракції!§!"
 ww_BEL_event_diplomatic.32.a:0 "Ми можемо створити щось краще!"
 ww_BEL_event_political.8.b:0 "Французька — наша мова"
 ww_BEL_event_spanish_interaction.8.a:0 "Яка грубість!"
 ww_congo.14.d:0 "[FROM.GetNameDefCap] погодилися з нашими вимогами, і їхня нація перестане існувати як незалежна одиниця найближчими днями. Вони фактично передали нам повний контроль над їхньою країною."
 ww_congo.20.b:0 "Хто сказав, що вони можуть мати незалежність?"
 ww_congo.21.a:0 "Це не наша справа, щоб їх зупиняти"
 ww_congo.54.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], погодився передати нам всі території з великою кількістю бурундійців, бажаючи нам удачі в майбутньому. Сьогодні великий день для нації Конґо."
 ww_congo.57.a:0 "Чудово!"
 ww_congo.67.a:0 "З радістю!"
 ww_congo.69.t:0 "[FROM.GetLeader] відкидає нашу ідею"
 yakov_smushkevich:0 "$SOV_yakov_smushkevich$"
