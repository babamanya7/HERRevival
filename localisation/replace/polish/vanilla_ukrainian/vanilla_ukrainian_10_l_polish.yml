 PRC_supreme_chairman_4:0 "$PRC_supreme_chairman_1$"
 PRC_taiwan_desc:0 "Втрата Тайваню колишнім урядом Цін на користь японців має бути скасована, навіть якщо необхідність повітряної або морської підтримки становить унікальний виклик."
 PRC_the_fight_of_a_people:0 "Боротьба народу"
 PRC_the_pla_naval_school:0 "Військово-морське училище НВАК"
 PRC_the_yulin_garrison_desc:0 "Незважаючи на всі наші зусилля знищити їх, 86-та та 84-та дивізії під командуванням Цзін Юесю та Гао Гуйцзи зуміли відбити наші атаки та ефективно утримали північ під контролем Ґоміньдану. Позбутися їх буде нелегко, оскільки їхні позиції добре укріплені."
