 TUR_absorb_the_tpda_desc:0 "Адміністрація турецького державного боргу наче пухлина зросла з нашим промисловим сектором, але ми зможемо провести нову інтеграцію так, щоби прибрати звідти цю організацію, яка перешкоджає нашому подальшому розвитку."
 TUR_arctic_wolves_training_desc:0 "Наші солдати будуть лазити по снігу, як вовки, що полюють на здобич у бореалі. Завдяки нашій підготовці ворог буде боятися більше, ніж холод на крижаних вітрах."
 TUR_continue_the_policy_of_etatism:0 "Продовжити політику етатизму"
 TUR_continue_the_sumerbank_industrialization_scheme_desc:0 "Заснована у 1933 році, текстильна фабрика «Sümerbank» є державним підприємством, що фінансує будівництво та розвиток текстильної промисловості в нашій країні. Ми повинні й надалі розширювати сферу відповідальності банку та розвивати нашу промисловість відповідно до п’ятирічного плану."
 TUR_create_the_balkan_central_bank:0 "Створити Центральний банк Балкан"
 TUR_cypriot_and_oniki_ilhak_desc:0 "Нехай [GRE.GetAdjective] крикуни скільки завгодно вимагають енозісу — анексія неминуча. Кіпр і Родос наші по праву, і коли ми знову заволодіємо ними, послабити нашу хватку не зможе ніхто і ніколи."
 TUR_entrench_kemalism_in_state:0 "£faction_tur_kemalist Укріпити кемалізм у області"
 TUR_etatism_3_desc:0 "Наша змішана економіка не схожа на жодну іншу у світі: в ній є елементи британського лібералізму, італійського корпоратизму і радянського централізованого планування. Це максимально можливий синтез економічних моделей, вінець кемалістської системи, але ми надто перевантажили його умовами війни. Можливо, нам варто переглянути свої пріоритети і закінчувати експериментувати з етатизмом.\n\n§RЯкщо ми просунемо наш економічний закон, то нам слід бути готовими до виникнення додаткової напруги між нашими несумісними економічними моделями.§!"
 TUR_expanding_the_saadabad_pact:0 "Розширити Саадабадський пакт"
 TUR_fortified_defensive_bases_desc:0 "Кажуть, найкращий спосіб нападу — гарний захист, і така наша офіційна позиція!"
