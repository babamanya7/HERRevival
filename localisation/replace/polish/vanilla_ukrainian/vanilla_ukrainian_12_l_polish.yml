 MAN_recruit_bandits_east_desc:0 "Кожна куля, витрачена на знищення бандитів, могла б бути використана для боротьби в майбутньому. Замість боротися з нашими підданими, ми можемо дати їм можливість виправитися шляхом служби імператорові."
 MAN_release_bandits_2:0 "Розпустити бандитські армії"
 MAN_release_bandits_desc:0 "Колишні злочинці та негідники змогли показати, що вони готові віддати життя за імператора, і тепер їх можна безпечно відпустити в суспільство."
 MAN_trade_delegation_desc:0 "Ми відчутно відстаємо від усього світу у питаннях промислового розвитку. Слід відправити делегацію, яка вивчить іноземні методики та виробить способи поліпшення наших власних."
 MAN_tsr_a_new_self_strengthening_movement_desc:0 "Рух самопосилення, або Рух за засвоєння заморських справ, був періодом вестернізації в нашій старій імперії. Його метою було насамперед покращити наші промислові та військові можливості після кількох криз, які майже знищили нашу націю. Ми повинні продовжувати цю модернізацію, щоб уникнути будь-яких потенційних катастроф у майбутньому."
 MAN_tsr_finish_off_the_japanese_threat:0 "Покінчити з японською загрозою"
