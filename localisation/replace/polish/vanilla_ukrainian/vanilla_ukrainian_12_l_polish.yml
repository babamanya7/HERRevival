 landsverk:0 "AB Landsverk"
 lar_appeal_to_overseas_territories.11.desc:0 "Губернатор Мадаґаскару запропонував нашим військам і військам наших союзників військові бази на острові і просить допомоги у захисті їх від атак."
 lar_arms_purchases.1.b:0 "Це виключено!"
 lar_arms_purchases.2.a:0 "Що ж, якщо це необхідно..."
 lar_concessions_to_italy.4.a:0 "Заради красивих кордонів — усе що завгодно."
 lar_concessions_to_italy.4.b:0 "Нас не купити!"
 lar_congress_of_paris.4.desc:0 "Делегація з держави [From.GetNameDef] оголосила про завершення перемовин. Посилаючись на фундаментальні розбіжності стосовно запропонованих змін, вона покинула Париж і повертається до держави [From.GetNameDef].\n\nНезабаром після від'їзду тієї [From.GetAdjective]ий посол оголосив, що [From.GetAdjective]ий уряд більше не пов'язаний із нами будь-якими домовленостями про взаємодопомогу або союзами."
 lar_france_french_union.10.desc:0 "З Індокитаю надходять доповіді про те, що жителі В'єтнаму, Лаосу та Камбоджі з незначною перевагою проголосували за вступ до нового Французького Союзу. Судячи з усього, такий результат став несподіванкою навіть для місцевого управління, оскільки воно негайне. провести повторний підрахунок голосів. Націоналістичним угрупованням у регіоні завдано сильний удар, їхній бойовий дух помітно постраждав, а багато учасників угруповань почали відкрито сумніватися в тому, що вони представляють волю народу."
 lar_france_french_union.4.t:0 "Західна Африка голосує за вступ до Союзу"
 lar_france_french_union.9.desc:0 "Оголошення результатів нещодавнього референдуму щодо Французького Союзу в Дамаску і Бейруті було зустрінуте криками схвалення. Стало ясно, що переважна більшість у регіоні проголосувала проти вступу до нового Союзу. Основні націоналістичні партії вже оголосили референ а командувач місцевої армії відправив до столиці тривожні доповіді, вимагаючи надіслати підкріплення."
 lar_franco_soviet_treaty.1.a:0 "Дух 1894 року живий і понині!"
 lar_heavy_water.2.desc:0 "За повідомленнями від наших зв'язківців з Телемарку, операція «Ґаннерсайд» увінчалася абсолютним успіхом. Десантувавшись з парашутами, загін непомітно для охорони проник на завод з виробництва важкої води.\n\nВстановивши вибухівку, команда так само покинула завод і розділилася, щоб уникнути пошукових груп противника. Жодних новин від загону після операції не надходило, але цього і слід очікувати. Також варто чекати від німців публічних заяв, якщо їм вдасться взяти в полон або убити когось із наших командос."
 lar_news.1.t_falangist:0 "Перемога фалангістів у громадянській війні в Іспанії"
 lar_news.1.t_republic:0 "Перемога республіканців у громадянській війні в Іспанії"
 lar_news.1.t_stalinist:0 "Перемога сталіністів у громадянській війні в Іспанії"
 lar_news.12.desc:0 "[From.GetNameDef], як і раніше, оговтується від громадянської війни. Тепер країна, як це не дивно, веде переговори про вступ до альянсу [From.GetFactionName]. Схоже, що масштабна допомога, отримана від країн Осі під час громадянської війни не призвели до зближення нового [From.GetAdjective] уряду та його закордонних помічників."
 lar_news.22.a:0 "Ми досягли багато чого, але маємо готуватися до гіршого!"
 lar_news.22.desc:0 "Незважаючи на те, що після завершення громадянської війни в Іспанії минуло вже деякий час, очікуваної кризи анархістських комун в Іберії не сталося. Навпаки, комуни, як стверджується, успішно стабілізувалися і відбудували регіон наново. Тепер вони й надалі залучають іммігрантів-однодумців з усіх країн світу.\n\nУ світлі міжнародної ворожості комуни, що триває, вирішили організуватися у власні «ради з оборони» і далі брати тривалий курс на озброєння."
 lar_news.28.desc:0 "Громадянська війна в Іспанії, здається, закінчилася. Решта республіканських військ або капітулювали, або пішли в підпілля. Лідери націоналістів швидко скористалися ситуацією і оголосили про кінець громадянської війни, але експерти вказують на зростаючі розбіжності серед самих націоналістів і припускають, що війна просто переходить на новий етап, вони передбачають, що зі втратою спільного ворога ці розбіжності лише посилять розкол серед націоналістів. для боротьби з республіканцями, не розпущені та уважно стежать за сусідами."
 lar_news.29.e:0 "Рано чи пізно нам треба буде розправитися з анархістами..."
 lar_news.8.t:0 "[FRA.GetLeader] заявляє права на престол Франції"
 lar_non_intervention.3.a:0 "Час покаже."
 lar_portugal_iberian_summit.3.a:0 "Будемо сподіватися, це того варте..."
 lar_portugal_iberian_summit.3.desc:0 "[From.GetAdjective] уряд заявляє, що наші шанси на вступ до союзу [?global.POR_iberian_summit_target.GetFactionName] зростуть, якщо ми порадимося з [?global.POR_iberian_summit_target.GetAdjective]ими дипломатами, перш ніж надсилати нашу пропозицію державі [?global.POR_iberian_summit_target.GetNameDef].\" # Останнє речення відсутнє. Додати"
 lar_portugal_naval_blockade.1_tt:0 "Відкриває рішення для країн, що воюють із державою [ENG.GetNameDefCap]."
 lar_portugal_navy_mutiny.2_extra.desc:0 "На подив більшості бунтівників, їх кораблям було дозволено піти, і тепер вони прямують в іспанські порти. Есмінець \"Дао\" очолює шлях, за ним слідують ще кілька кораблів nМи зв'язалися з іспанським революційним урядом, і він запевнив нас, що після завершення громадянської війни забезпечить Португалію кораблями."
 lar_portugal_promote_monarchist_cause.2.desc:0 "[POR.GetNameDefCap] звертається до нашого уряду з пропозицією об'єднати дві наші нації під правлінням будинку Дуарте Нуно, який стане королем Португалії та Бразилії. \n\n[POR.GetAdjective] відповіді вона не прийме, і всіляко спонукає нас прийняти пропозицію, щоб уникнути конфлікту між нашими націями."
 lar_portugal_purchase_ships.4.t:0 "Завершено будівництво кораблів — підводні човни"
 lar_portugal_spanish_civil_war.1_tt:0 "§R[POR.GetNameDefCap] зможе приєднатися до держави [SPD.GetFlag][SPD.GetNameDef] у громадянській війні в Іспанії та воювати проти нас!§!"
 lar_portugal_spanish_civil_war.3.a:0 "Краще їм не втручатися в ці справи..."
 lar_spain.10.t:0 "Урядовий терор"
 lar_spain.100.d:0 "На сьогодні [SPR.GetLeader] оголосив про об'єднання всіх іспаномовних народів під прапором держави [SPR.GetNameDef]. [SPR.GetSheHeCap] заявив, що [SPR.GetHerHis] мета — захистити всіх іспаномовних людей, привести їх до процвітання та забезпечити, щоб імперія проіснувала ще тисячу років, і що [SPR.GetAdjective]а національна місія ще не закінчилася."
 lar_spain.12.t:0 "Фаланга переможена"
 lar_spain.18.a:0 "Не слід зволікати дуже довго."
 lar_spain.29.desc:0 "Час прийшов. Держава [iberian_pact_war_target.GetNameDefCap] вступила у війну зі своїми ворогами, і ми, як того вимагає пакт, теж маємо воювати на його боці і виступити єдиним фронтом проти зовнішнього світу."
 lar_spain.51.a:0 "Ми надішлемо золотий запас до держави [SOV.GetNameDef]."
 lar_spain.57.desc:0 "Наші представники в державі [From.GetNameDef] повідомляють, що [From.GetAdjective] уряд вважав за правильне дати нам більше автономії."
 lar_spain.90.desc:0 "Боротьба за владу між різними лівими партіями, які ще недавно разом перемогли на виборах 1936 року, досягла критичної стадії. З огляду на центристську та компромісну політику президента Нісето Алькали-Самори, його відчужені прибічники в кортесах засудили сам розпуск кортесів як те, що зробило вибори неконституційними, і відправили першого у відставку.\n\nНа посаду Алькали-Самори кортеси вибрали його старого суперника — Мануеля Асанью, якому дісталася незавидна задача повернути стабільність на все більш поляризовану політичну арену Іспанії."
 lar_split_belgium.2.desc:0 "Бельгійський уряд погодився провести під нашим наглядом серію референдумів про об'єднання з Францією франкомовних районів Бельгії. Зараз, коли всі пробельгійські партії закликають бойкотувати референдум, наша перемога практично гарантована."
