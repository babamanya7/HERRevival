 SWE_pull_the_trigger_tt:0 "Розмір громадянської війни залежатиме від масштабу їх комуністичної підтримки"
 SWE_radiotjanst_unaligned:0 "Konungens Dagliga"
 SWE_refuge_from_war:0 "Притулок від війни"
 SWE_saltsjobaden_agreement_desc:0 "Розбіжності між працівниками та роботодавцями виходять з-під контролю та ризикують поставити націю на коліна. Нас потрібно розв'язати, якщо ми хочемо подолати загрози на наших кордонах. Таким чином, ми повинні запровадити домовленості про мінімізацію зриву трудових спорів."
 SWE_sami_reconcilliation:0 "Примирення з саамами"
 SWE_severe_lack_of_ammunition_desc:0 "Наші військові страждають від гострої нестачі набоїв до нашої зброї, а також від мішанини різної стрілецької зброї, виробленої та закупленої в різних іноземних держав. Ми мусимо якнайшвидше вирішити ці питання."
 SWE_social_democracy_desc:0 "Соціал-демократи мають бачення Швеції, яке базується не на страху чи гніві, а на надії. Сподіваюся, що, підтримуючи тих, хто найбільше потребує суспільства, можна досягти стабільності та щастя для всіх. Завдяки нашій співпраці та доброзичливості ми зможемо нарешті створити народний дім."
 SWE_sven_hedengren:0 "Свен Геденґрен"
 SWE_transport_plane_equipment_1_short:0 "Trp2"
 SWE_vattenfall_upgrade_tt:0 "\nЯкщо загальний добуток §Yінфраструктури§! в областях §Y[666.GetName]§!, §Y[918.GetName]§! і §Y[38.GetName]§! перевищить §Y11§!, цей концерн буде автоматично поліпшено.\nЦе дасть:\n$industry_research$: §G+15%§!\n$electronics_research$: §G+15%§!"
