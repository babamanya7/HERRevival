 DEN_imperial:0 "Данське володарство"
 DEN_increase_cooperation_desc:0 "Хоч нам і не хотілося б цього визнавати, але ми б ніколи не змогли стримати вторгнення [?DEN.DEN_overlord_nation.GetAdjective] — і, капітулювавши, ми забезпечили собі певний рівень автономії, якого не має жодна інша країна, що перебуває під владою [?DEN.DEN_overlord_nation.GetAdjective]. Тому ми повинні намагатися тісніше співпрацювати з нашими сюзеренами, щоб забезпечити цю незалежність і скористатися перевагами цих відносин."
 DEN_industrial_capability_dynamic_modifier_max_improved_desc:0 "Данія традиційно була аграрним суспільством і виробником, але її промисловість зросла у своїй важливості та економічному значенні. Наша промисловість повністю осучаснена і модернізована, працює на повну потужність вдень і вночі."
