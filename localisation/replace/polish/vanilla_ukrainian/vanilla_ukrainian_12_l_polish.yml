 iceland_events.5.desc:0 "Ворожі настрої в Іспанії значно скоротили обсяг поставленого туди ісландського експорту. Раніше ця країна була великим імпортером ісландської сушеної риби. Такий поворот подій сумний не тільки для рибної промисловості, а й для Ісландії загалом, адже рибна ловля — один із небагатьох секторів її економіки, який почав відновлюватися після війни та Великої депресії."
