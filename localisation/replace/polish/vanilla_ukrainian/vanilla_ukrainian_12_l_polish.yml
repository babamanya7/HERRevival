 INS_volksraad_legalize_displaying_flag_desc:0 "Публічна демонстрація червоно-білого прапора «Індонезії» наразі є незаконною через його зв'язки з націоналістичними, антиколоніальними організаціями. Легалізація його демонстрації, ймовірно, стала б демонстрацією нашої готовності до співпраці та зупинила б триваючу радикалізацію націоналістів по всьому архіпелагу."
