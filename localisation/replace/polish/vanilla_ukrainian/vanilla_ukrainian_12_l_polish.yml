 AST_department_of_aboriginal_affairs:0 "Департамент у справах аборигенів"
 AST_diplomatic_events.16.a:0 "Австралія залишається такою, як є."
 AST_diplomatic_events.20.b:0 "Він потрібен тут."
 AST_diplomatic_events.23.desc:0 "[ENG.GetNameDefCap] кілька разів викликала прем'єр-міністра Австралії до Британського воєнного кабінету, але після неодноразових відмов [ENG.GetLeader] більше не бачить сенсу продовжувати це робити."
 AST_diplomatic_events.41.a:0 "Так ми і зробимо."
 AST_diplomatic_events.53.desc:0 "[AST.GetName] підозрює, що падіння або співпраця Вішістської Франції є однією з головних цілей [ENG.GetNameDef], і тому запропонувала приєднатися і переслідувати французькі африканські колонії, доки Віші не буде підкорено. Хоча за пропозицією можуть стояти невідомі мотиви, безсумнівно, збільшення присутності союзників у регіоні піде нам на користь.\n\nЯкщо ми дамо наш дозвіл, [AST.GetName] ініціює переговори з Вішістською Францією з метою мирної передачі їхніх колоній та створення австралійського гарнізону."
 AST_diplomatic_events.71.b:0 "Тихоокеанські острови залишаться нашими."
 AST_diplomatic_events.76.a:0 "Це означає війну."
 AST_diplomatic_events.82.desc:0 "Транспорт з качкодзьобом, що відчалив із порту Мельбурна шість тижнів тому з повноцінним платипусорієм на борту, прибув до [ENG.GetNameDef]. Однак прибуття корабля не було радісним, адже тварина виявилася мертвою. [ENG.GetLeader] оплакує свого втраченого улюбленця, якого він навіть назвав на свою честь, очікуючи на його прибуття, але стверджує, що в його загибелі винні вороги. Очевидно, вибухи від підводної атаки налякали качкодзьоба до смерті.\n\nОднак бортовий журнал доглядача качкодзьоба вказує на іншу ймовірну причину смерті: температура води та повітря в платипусорії значно перевищувала допустимі норми.\n\nНезалежно від обставин, Качкодзьоб [ENG.GetLeader] мертвий, а британський прем'єр-міністр залишиться без качкодзьоба."
 AST_diplomatic_events.9.desc:0 "[USA.GetNameDefCap] не має вільних конвоїв для допомоги [AST.GetName] з постачанням."
 AST_equal_training:0 "Рівноцінна підготовка"
 AST_eric_feldt:0 "Ерік Фелдт"
 AST_expand_the_northern_railway_desc:0 "У нас є залізниця, яка простягається від Аделаїди на півдні до Еліс-Спрінгс на півночі. Тепер ми мусимо продовжити її північну частину до інших міст регіону та поєднати всю Австралію."
 AST_expand_the_raaf:0 "Розширити КАВПС"
 AST_fight_work_or_perish:0 "Борись, працюй або вмри"
 AST_for_the_southern_cross_desc:0 "Південний Хрест не майорить над Британією. Він майорить над нами. Австралійська ідентичність — це щось справжнє, заслужене, те, що варто захищати. Формується нова національна гордість, не запозичена з Лондона і не визначена далекими інституціями, а вирощена тут, з цієї землі, під цими зірками."
 AST_form_australasia_new_zealand_core_states_tt:0 "Отримує національні території на всі області §Y[NZL.GetNonIdeologyName]§!."
 AST_fund_australian_defense_research:0 "Профінансувати австралійські оборонні дослідження"
 AST_goods_standard:0 "Товарний стандарт"
 AST_heavy_cruiser_2_desc:0 "The Surrey-class heavy cruisers were proposed under the 1928 Naval Program. They were improved versions of the earlier York-class heavy cruisers. Had they been completed, they would have been equipped with four twin 8 in. gun turrets, heavier armor, and more powerful engines. Two ships were ordered but none were laid down."
 AST_heavy_fighter_equipment_2_short:0 "Beaufighter"
 AST_horace_robertson:0 "Горас Робертсон"
 AST_imperial_pressure_spirit_tt:0 "Змінює §Y$AST_imperial_pressure_spirit$§! на:"
 AST_intelligence_director:0 "Директор розвідки"
 AST_iven_mackay:0 "Айвен Макей"
 AST_jack_beasley:0 "Джек Бізлі"
 AST_light_tank_artillery_equipment_3:0 "Crusader II SP Artillery"
 AST_make_common_cause_desc:0 "Під нашим керівництвом Співдружність почала процвітати, ведена світлом соціалізму з темряви капіталістичного гноблення. У цей критичний момент ми маємо переконатися, що наша воля незламна, і ми маршируємо разом у краще майбутнє."
 AST_medium_jet_plane:0 "English Electric Canberra"
 AST_mio_trait_cockatoo_docks_allied_fleet_servicing:0 "Обслуговування союзного флоту"
 AST_mio_trait_nswgr_progressive_up_armouring:0 "Поступове нарощування броні"
 AST_mount_isa_upgraded:0 "$AST_mount_isa$"
 AST_national_defense_desc:0 "Шляхом цілеспрямованих інвестицій та державного управління Австралія побудувала промислову базу, здатну забезпечити власну оборону. Заводи та верфі працюють під наглядом держави, а їхня продукція вимірюється не прибутком, а потребами нації."
 AST_non_ruling_party_alp:0 "$AST_non_ruling_party$ $AST_alp$"
 AST_northern_advancement:0 "Просування на північ"
 AST_off_leash_desc:0 "Докери є основою профспілкових дій в Австралії. Як острів розміром з континент, не дивно, що морська праця відіграє таку життєво важливу роль у нашій економіці. Настав час зняти нашийники та спустити з ланцюга морських псів промисловості."
 AST_owen_gun_desc:0 "Інноваційний вітчизняний пістолет-кулемет Оуена заслужив репутацію надійної та міцної зброї, як і наші солдати. Оскільки наші війська б'ються по всьому світу, ми маємо прийняти цю зброю не лише як символ австралійської винахідливості та дизайну, але й як символ самого нашого воєнного духу."
 AST_pacific_fleet_hub_spirit:0 "Центр Тихоокеанського флоту"
 AST_planned_extraction_desc:0 "Нам пощастило володіти землею, такою багатою на ресурси. Ми маємо переконатися, що її багатства систематично видобуваються і спрямовуються в галузі, які їх найбільше потребують."
 AST_poor_population_growth:0 "Слабкий приріст населення"
 AST_royal_australian_submarine_service:0 "Австралійський підводний флот"
 AST_scorch_the_north:0 "Спалити Північ"
 AST_seize_civilian_industry_desc:0 "Хоча споживчі товари є необхідністю як для наших громадян, так і для економіки, немає жодного способу обійти той факт, що воєнний час диктує ще більшу необхідність. Наближається війна; ми повинні бути готові до неї."
 AST_sentinel_tank_development:0 "Розробка танка Sentinel"
 AST_soldier_rights_promoter:0 "Захисник прав солдатів"
 AST_stanley_goble:0 "Стенлі Гобл"
 AST_submarine_3_desc:0 "$ENG_submarine_3_desc$"
 AST_tac_bomber_equipment_3:0 "Martin Baltimore"
 AST_through_the_gates_desc:0 "Підготовка змінилася терміновістю. Програма національної оборони розширюється за повної підтримки австралійської промисловості. Поряд з існуючими об'єктами зводяться нові, планові показники випуску продукції переглядаються в бік збільшення, а межа між цивільним виробництвом і військовою необхідністю непомітно стирається."
 AST_uap_popularity_increase_5:0 "Голоси §Y$AST_ruling_party$§! §Y$AST_uap$§!: §G+5.00%§!\n\n"
 AST_union_control_2_cat_desc:0 "Робітники [ROOT.GetNonIdeologyName] скинули своїх гнобителів не для того, щоб дивитися, як імперіалістичні держави продовжують тримати наших товаришів за океаном у кайданах. Поширення комунізму за наші кордони — це не просто ідеологічна мета, це стратегічна необхідність. Ми повинні роздмухати полум'я революції за океанами, даючи надію та ресурси тим, хто хоче скинути ярмо імперіалізму, поки старий порядок повністю не втратить підґрунтя."
 AST_war_carriers_idea:0 "$AST_war_carriers$"
 AST_war_is_coming_alp_advisors_tt:0 "§Y$AST_james_scullin$§!:"
 AST_workers_educational_association:0 "Робітнича освітня асоціація"
 AST_world_peace:0 "Світовий мир"
 AST_world_peace_desc:0 "Рух проти війни та фашизму наполегливо працював над виданням журналу під назвою «Світовий мир», який викриває зло фашистського руху в Німеччині, Італії, а особливо під час Громадянської війни в Іспанії. Натхненні статтями з нього, добровольці з нетерпінням прагнуть приєднатися до боротьби з фашизмом."
 ASY_democratic_ADJ:0 "Ассирійськ"
 ASY_democratic_party_long:0 "Ассирійський демократичний рух"
 ATTACH_AIR_WING_SELECT_SOME:0 "§RОберіть авіакрила для прикріплення до армії.§!"
 AUS_ANTISCHLUSS_TOOLTIP:0 "[GetAnschlussStatus]"
 AUS_STATE_39:0 "Зюдтіроль"
 AUS_STATE_850:0 "Тріент"
 AUS_STATE_89:0 "Штаніслау"
 AUS_VICTORY_POINTS_11584:0 "Венедиґ"
 AUS_VICTORY_POINTS_9598:0 "Тріент"
 AUS_a_new_beginning:0 "З чистого листа"
 AUS_aggression_intro_tt:0 "Замінити §YАвстрійська агресія§! на:"
 AUS_aid_austrian_communists:0 "Допомога товаришам в Австрії"
 AUS_airforce:0 "Österreichische Luftstreitkräfte"
 AUS_align_with_ussr:0 "Єдиний курс і Москвою"
 AUS_annexing_the_lands_of_old_decision:0 "[GetAnnexOrIntegrateDecision] [FROM.OWNER.GetNameDef]"
 AUS_approach_democratic_guarantors_desc:0 "Після підписання Сен-Жерменського Договіру нам дозволено мати надто малу армію, щоб захистити себе. Якщо ми не хочемо впасти в дедалі небезпечнішій ситуації, нам знадобиться підтримка. Хоча ми не проводили віч-на-віч з іншими підписантами договору час в останні роки, ми повинні звернутися до них і попросити їхньої підтримки у випадку, якщо холодний конфлікт навколо нас стане гаряче."
 AUS_army_intro_tt:0 "Замінити §YÖsterreichisches Bundesheer§! на:"
 AUS_bring_generals_out_of_retirement_desc:0 "Наша нація має історію ведення війн, і хоча це має свої недоліки у міжнародному питанні, це також означає, що ми маємо широкий спектр талановитих командирів. Деякі з них вже пішли у відставку, але з деякими зусиллями щодо переконання, ми зможемо їх повернути."
 AUS_celebrate_spanish_victory_desc:0 "Оскільки жорстокі зіткнення на Піренейському півострові повільно згасають, стає зрозуміло, що республіканці зберегли контроль над своєю країною. Перемога, у якій наша допомога, ймовірно, також зіграла свою роль, тож цілком слушно запитувати про можливість компенсації за наші зусилля."
 AUS_communism_party:0 "КПА"
 AUS_danubian_communism_bypass_has_rejected_tt:0 "Запобіг австрійським спробам популяризувати §YКомунізм§!."
 AUS_deal_with_the_german_threat_desc:0 "Німеччина вже багато десятиліть існує, як головна загроза на нашому північно-західному кордоні. Їхня політика була жорсткою, з їх планів на яку йде загроза самому нашому існуванню. Покінчимо з цією загрозою раз і назавжди."
 AUS_demand_liberation_of_workers:0 "Вимогти звільнення робітників"
 AUS_demand_liberation_of_workers_tt:0 "Відкриває сукупність рішень §Y$AUS_demand_liberation_of_workers$§! в країнах, де ми раніше успішно підтримали комуністичні настрої."
 AUS_elin:0 "ELIN"
 AUS_emil_liebitzky:0 "Еміль Лібіцкі"
 AUS_has_air_partners:0 "Після випробувань і польотів на багатьох літальних апаратах, ми маємо унікальну можливість вибирати властивості нашого літака, які нам подобаються, а які ні. Гарною ініціативою буде скористатися цими новими знаннями та провести зворотне проєктування деяких із найбажаніших характеристик літака, який ми вибрали."
 AUS_intensify_training_efforts_desc:0 "Хоча наші зусилля з навчання принесли свої плоди, ми вважаємо, що їх можна покращити навіть більше. Підвищивши ефективність нашої базової підготовки, ми могли б ще більше скоротити час, необхідний для навчання солдата."
 AUS_join_the_research_program_tt:0 "§Y[ROOT.GetNameDef]§!, і кожна країна нашого альянсу приєднаються до §YГрупи обміну дослідженнями§!"
 AUS_king_of_liechtenstein:0 "Fürst von und zu Liechtenstein"
 AUS_mauritz_von_wiktorin:0 "Мауриц фон Вікторін"
 AUS_mio_trait_fuel_effeicient_engines:0 "Паливоекономічні двигуни"
 AUS_naval_efficiency_desc:0 "Завдяки наполегливій праці та самовідданості ми, всупереч обставинам, відновили значну військово-морську присутність. Успіх підбадьорив і наших моряків, і тих, хто працює на верфях, і ми повинні скористатися цим для останнього поштовху до досконалості!"
 AUS_news_events.4.t:0 "Ас-винищувач уникає катастрофи"
 AUS_nuclear_effort:0 "Зусилля з ядерних досліджень"
 AUS_phonix_insurance:0 "Страхування Phönix"
 AUS_political_events.107.b:0 "Марна справа."
 AUS_political_events.11.b:0 "Якщо це — ціна запобіганню наслідків..."
 AUS_political_events.23.b:0 "Ми шукаємо союзників. З таким відношенням це будуть не союзники."
 AUS_political_events.24.a:0 "Ми вказали іншим сторонам саме на цей недолік..."
 AUS_political_events.25.a:0 "Від угоди усім буде добре!"
 AUS_political_events.27.a:0 "Вони не завдадуть ніякої шкоди."
 AUS_political_events.31.a:0 "Ми вирішимо це питання промислово."
 AUS_political_events.42.desc:0 "Нашу заявку на приєднання до альянсу [FROM.GetFactionName] було холодно відхилено. Ми намагалися аргументувати свою корисність, але, на жаль, Німеччина зробила свій вибір. Хоча це нас сильно дратує, ми не будемо засмучуватися, а натомість знайдемо інші рішення."
 AUS_political_events.43.desc:0 "Сьогодні вранці [FROM.GetNameDef] надіслала нам жорстку вимогу; вони потребують [Get43PuppetOrNotDesc]. Вимоги доповнюють тонко завуальовані загрози агресії, і здається ймовірним, що наслідком нашої відмови стануть військові дії."
 AUS_political_events.57.t:0 "[GetHostilityItalianClaimTitle57]"
 AUS_political_events.62.desc:0 "Незважаючи на наші вимоги, щоб [FROM.GetNameDef] не дотримувалася так званого плану Янси та переконалася, що ця людина не має жодної влади чи впливу, [FROM.GetAdjective]ий уряд відмовилися прислухатися до наших вимог. Можна лише припустити, що це віщує погане для наших майбутніх відносин."
 AUS_political_events.66.a:0 "Звучить, як чесна угода."
 AUS_political_events.69.b:0 "Мир для нашого покоління!"
 AUS_political_events.73.a_tt:0 "Ми підтримаємо запропонований Австрією варіант. Однак для його прийняття мають погодитись усі гаранти."
 AUS_political_events.84.b_tt:0 "§RЦе може привести до дуже неприємних наслідків!§!"
 AUS_political_events.88.t:0 "[FROM.GetNameDefCap] встановлює комуністичний уряд"
 AUS_political_events.89.a:0 "Війною це не виправити."
 AUS_political_events.90.a_tt:0 "§YКурт Шушніґ§! стане лідером §YДемократичної Партії§!."
 AUS_political_events.94.a:0 "Спробувати було варто."
 AUS_political_events.95.t:0 "[ROOT.GetAdjective]а армія повертається після успішної кампанії"
 AUS_reach_out_to_italy_desc:0 "Незважаючи на те, що у нас була достатня частка розбіжностей, Італія залишається найбільш надійним союзником у нашій поточній ситуації. Оскільки хвилювання та напруженість поблизу нас дедалі зростають, було б корисно звернутися заручитися їх підтримкою."
 AUS_recovering_from_the_depression_desc:0 "Відновлення після економічного краху початку 30-х було повільним, але, здається, Австрія нарешті прямує до кращих часів."
 AUS_reforming_the_central_powers:0 "Вибух минулого"
 AUS_royal_alliance:0 "Королівський імперський альянс"
 AUS_seek_support_from_guarantors_desc:0 "Сен-Жерменьский Договір несе для нас багато обмежень, але він має і хороші сторони. Оскільки нам заборонено мати будь-яку форму того, що можна було б назвати армією, нас мають захистити так звані гаранти. Ми звернемось до них і попросимо підтримки."
 AUS_seeks_a_deal_desc_56:0 "Запропоновану нами угоду з державою [FROM.GetNameDef] було схвалено з їх сторони. В обмін на значні промислові інвестиції, [FROM.GetAdjective]ий уряд погодилися передати регіони [39.GetName] і [850.GetName] згідно з нашим запитом."
 AUS_the_danubian_federation_decision_tt:0 "([FROM.GetFlag]§Y[FROM.GetNameDef]§!) Станеться подія '§Y[ROOT.GetNameDef] запрошує нас у [ROOT.GetFactionName].§!'"
 AUS_vocal_german_unionist:0 "Голосистий прихильник німецького єднання"
 AUS_wienfilm_propaganda_effort:0 "Пропаганда Wien-Film"
 BAH_autonomy_collaboration_government:0 "$OVERLORDADJ$і $NONIDEOLOGY$"
 BALTIC_axis_investments_idea:0 "Інвестиції країн Осі"
 BALTIC_crush_forest_brothers:0 "Розбити лісових братів"
 BALTIC_direct_intervention:0 "Пряма радянська інтервенція"
 BALTIC_free_the_workers_of_poland_desc:0 "Хоч раніше поляки і правили Балтикою, зараз вони — жертви, вразливі перед хижацьким режимом держави [GER.GetNameDef]. Ми мусимо захистити своїх південних товаришів та об'єднати їх під прапором Польської Соціалістичної Республіки!"
 BALTIC_purge_of_our_own_desc:0 "Незважаючи на всі наші спроби придушити опір, ще залишилися ті, хто діє в тіні і планує повалити владу пролетаріату, відновивши в державі [Root.GetNonIdeologyName] диктатуру капіталізму. Ми мусимо влаштувати чистку і позбавитися всіх, хто їх підтримує."
 BALTIC_restore_workers_republic_idea_2:0 "$BALTIC_restore_workers_republic_idea$"
 BALTIC_school_of_aviation_desc:0 "During the independence war, the struggle for control of the air and sea was fought by the British on our behalf, but as the Brits continue to grant concession after concession to the Nazi menace, we cannot trust that they will defend us again. We must take to the air ourselves!"
 BAL_UNIFIED_communism_DEF:0 "Балтійська соціалістична республіка"
 BAN_communism_DEF:0 "Бенґальська народна республіка"
 BAY_VICTORY_POINTS_3700:0 "Ейзнстод"
 BAY_communism_DEF:0 "Баварська радянська республіка"
 BBA_SWI_annual_election.2.t:0 "Надзвичайне голосування за Президента Конфедерації!"
 BBA_african_union_events.2.a:0 "Разом ми сильніші."
 BBA_african_union_events.21.a:0 "Це нарешті дало результати."
 BBA_african_union_events.9.t:0 "[FROM.GetNameDefCap] відмовляється приєднуватися до Виконавчої ради"
 BBA_ethiopia_anti_colonialism_events.5.t:0 "[FROM.GetName] приєднується до війни проти держави [?global.african_colonial_country.GetName]"
 BBA_ethiopia_balance_of_power_events.23.t:0 "Стандартизована реформа освіти"
 BBA_ethiopia_balance_of_power_events.24.t:0 "Реформи в галузі освіти"
 BBA_ethiopia_balance_of_power_events.52.t:0 "Місцевий владика бажає розширити домен"
 BBA_ethiopia_communist_events.15.t:0 "[SOV.GetNameDefCap] надсилає військових радників"
 BBA_ethiopia_communist_events.21.t:0 "[SOV.GetNameDefCap] погоджується тренувати пілотів"
 BBA_ethiopia_communist_events.24.desc:0 "Дипломатичне протистояння між [ITA.GetName] та [SOV.GetNameDef] переросло у відкритий конфлікт. [SOV.GetAdjective]а влада гарантувала нашу незалежність і тепер допомагатиме нам на полі бою у боротьбі з [ITA.GetAdjective]ими силами. Проте, схоже, що це коштуватиме нам нашої самостійності. Відтепер наша зовнішня політика має бути повністю узгоджена з політикою [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_communist_events.29.a:0 "Ми вічно вдячні."
 BBA_ethiopia_communist_events.35.b:0 "У них немає права нас повчати."
 BBA_ethiopia_communist_events.39.desc:0 "Після звільнення регіону Риф від [SPC.GetNameDef], ми маємо можливість змусити їх до мирних переговорів. Після того як вони зрадили нашу довіру щодо питання деколонізації, ми також можемо продовжити війну вже на території [SPC.GetNameDef]."
 BBA_ethiopia_communist_events.57.a:0 "Ми не піддамося реакційним погрозам. І щодо їхнього імператора..."
 BBA_ethiopia_exile_events.18.t:0 "[FROM.GetAdjective]і есмінці"
 BBA_ethiopia_exile_events.23.desc:0 "На знак доброї волі та визнання [ROOT.GetLeader] як законного правителя [ROOT.GetNameDef], [FROM.GetLeader] надав [ROOT.GetLeader] острів [?ETH.japanese_island.GetName] як плацдарм для відвоювання [ROOT.GetName].\n\n [FROM.GetNameDef] буде допомагати [ROOT.GetName] у відвоюванні втраченої території. В обмін на ці послуги [ROOT.GetLeader] присягнув на вірність [FROM.GetLeader], зв'язавши дві країни тісніше разом у їх боротьбі проти європейського імперіалізму."
 BBA_ethiopia_exile_events.41.a:0 "Можливо, це і на краще"
 BBA_ethiopia_exile_events.59.a:0 "Кожна дрібниця допомагає."
 BBA_ethiopia_fascist_events.62.a:0 "Перемога вже на горизонті."
 BBA_ethiopia_fascist_events.62.t:0 "[FROM.GetName] погоджується на поставку зброї"
 BBA_ethiopia_fascist_events.69.b:0 "Наші офіцери потрібні в інших місцях."
 BBA_ethiopia_fascist_events.70.t:0 "[FROM.GetName] погоджується надіслати офіцерів"
 BBA_ethiopia_imperial_events.10.desc:0 "[FROM.GetNameDefCap] вимагає нашого підкорення та інтеграції в їхню націю. Якщо ми підкоримося, це, звичайно, буде кінцем держави [THIS.GetName] як незалежної нації. Невідомо, як далеко [FROM.GetLeader] готовий зайти, щоби досягти інтеграції, але можливість збройного конфлікту поки що не можна виключати."
 BBA_ethiopia_imperial_events.3.a:0 "Нам доведеться розглянути інші методи."
 BBA_ethiopia_imperial_events.3.desc:0 "На жаль, [FROM.GetAdjective]ий уряд відхилив наш запит на купівлю порту Джібуті. Замість побачити в цьому взаємовигоду, він відчайдушно чіпляється за свої колонії та відмовляються поступитися навіть дюймом землі, яку вони захопили."
 BBA_italo_ethiopian_war_events.03.desc:0 "Наш наступ відкинув італійців, але не досяг своєї мети. Наші війська витратили свій ресурс для наступу, і італійці оговтуються від шоку, заподіяного нашим штурмом.\nЗвіти розвідки свідчать, що вони готують новий прорив, краще підготовлений, ніж минулого разу. Наші сили мусять вистояти. Чим довше ми зможемо тримати їх подалі від нашої країни, тим більше вони будуть змушені витрачати на цю війну, і тим легше буде переконати Лігу Націй, що це не невелика «колоніальна сутичка», а скоріше жорстока агресія однієї країни-члена проти іншої."
 BBA_italo_ethiopian_war_events.300.desc:0 "Наші армії марно намагаються досягти будь-яких успіхів у [ETH.GetName], і відсутність прогресу відчувається навіть у [ITA.GetName]. [ITA.GetAdjective]ий народ починає втрачати віру у війну і у здатность нашого керівництва перемогти."
 BBA_italo_ethiopian_war_events.302.t:0 "Неспокій у колоніях"
 BBA_italo_ethiopian_war_events.303.a:0 "Зрадники!"
 BBA_italo_ethiopian_war_events.305.a:0 "Таке нахабство!"
 BBA_italy_anti_colonialism_events.03.a:0 "Це мир!"
 BBA_italy_anti_colonialism_events.08.t:0 "[FROM.GetAdjective]і інвестиції в [ROOT.GetAdjective]ий розвиток"
 BBA_italy_anti_colonialism_events.09.b:0 "Нам потрібна зміна влади!"
 BBA_italy_anti_colonialism_events.55.desc:0 "Можливо, це не стало повною несподіванкою, але нам, на жаль, повідомили, що народ Східної Африки не бажає більше перебувати під нашим правлінням. Вони відчували себе знехтуваними та експлуатованими протягом тривалого часу і тому проголосували за вихід з-під нашого управління."
 BBA_italy_civil_war.1.c:0 "Приєднатись до народної революції!"
 BBA_italy_civil_war_fascist_tt:0 "Ми збережемо контроль над державою §Y[ROOT.GetFlag][ROOT.GetNameDef]§!. §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! стане §Y$RSI_RU_Inst$§!. [GetRsiOverlord]"
 BBA_italy_communist_events.04.desc:0 "Ніхто не відгукнувся на заклик про допомогу! Складається враження, що комуністи всього світу покинули нас і не надто прагнуть допомогти власним товаришам. У цьому суворому світі ми можемо розраховувати лише на себе — але наша революція переможе!"
 BBA_italy_democratic_events.02.a:0 "Чудова ініціатива!"
 BBA_italy_interaction_events.1.b:0 "Ми хотіли б побачити, що вони зроблять!"
 BBA_italy_interaction_events.35.desc_first_negotiation:0 "Італійський уряд звернувся до нас сьогодні з цікавою пропозицією. Вони кажуть, що хочуть ратифікувати Фронт Стрези, забезпечивши свою підтримку нашій стороні на випадок, якщо в Європі почнеться війна. Однак для того, щоб підписати цю угоду, вони вимагають територіальних поступок, а саме регіон [116.GetName]. Як ми повинні відповісти? Вони принаймні тимчасово платитимуть нам, якщо ми погодимося."
 BBA_italy_interaction_events.45.desc:0 "Держава [FROM.GetName] смиренно прийняла нашу пропозицію про союз і приєдналася до нас, щоб разом боротися проти наших спільних ворогів. Сьогоднішній день осяює Південну Америку та державу [ITA.GetNameDef] новим яскравим світлом."
 BBA_italy_interaction_events_news.1.b:0 "Це доводить слабкість, притаманну німецькій системі"
 BBA_italy_missiolinis.132.t:0 "Невдале звільнення Тічіно"
 BBA_italy_missiolinis.31.desc:0 "Щоб Італія справді процвітала, дуче має план розширити нашу виробничу спроможність. Щоби втілити в життя це бачення процвітаючої нації, нам потрібно більше заводів, які можуть підтримати ріст нашої бурхливої імперії."
 BBA_italy_missiolinis.41.a:0 "В ім'я Італії!"
 BBA_italy_missiolinis.51.desc:0 "Наші останні конфлікти проявили певні недоліки в нашому логістичному забезпеченні армії. Вище командування Італії переконало дуче замовити новий парк вантажівок для постачання. Первісно він зажадав збірку 5000 новеньких італійських вантажівок, але його вмовили прийняти менше, запевнивши, що цього вистачить."
 BBA_italy_missiolinis.81.a:0 "Увесь світ побачить."
 BBA_italy_missiolinis.82.desc:0 "Намагання продемонструвати сильну сторону фашистської системи дало дуче зворотну реакцію, через що він проклинав кожного, хто його міг почути. Замість згуртувати народ довкола ідеї фашизму, той став більш скептичним і почав перешіптуватися, який блазень — Муссоліні. Принаймні, дуче в це вірить."
 BBA_italy_missiolinis.93.a:0 "Справді досягнення."
 BBA_italy_naval_cooperation_programs.08.t:0 "[FROM.GetAdjective]а пропозиція щодо купівлі ескортних кораблів"
 BBA_italy_naval_cooperation_programs.09.t:0 "[FROM.GetNameDefCap] погоджується придбати наші ескортні кораблі"
 BBA_italy_research_agreement.1.desc:0 "[FROM.GetName] пропонує спільну дослідницьку програму для зміцнення не лише військового потенціалу, але й зв'язку між нашими країнами. Це дозволить нам легше обмінюватися технологіями та дослідженнями між собою і зблизить наші країни."
 BBA_italy_second_italo_ethiopian_war.1.b:0 "Нізащо! Продовжуймо наступ!"
 BBA_switzerland_fascist.7.t:0 "[FROM.GetNameDefCap] приймає нас до своїх лав"
 BBA_switzerland_trade.4.b:0 "Зосередимось на цивільному виробництві"
 BBA_switzerland_trade.4.desc:0 "Схоже, що торговельна угода з нами була надзвичайно вигідною для [FROM.GetName], раз вони готові знову порушити нейтралітет, щоби забезпечити постачання. \n\nДля нас ця угода майже не має недоліків, якщо тільки ми не забезпечуємо ними оборону [FROM.GetName] від нашого можливого вторгнення."
 BBA_switzerland_trade.8.t:0 "[FROM.GetNameDefCap] може допомогти нам торгувати золотом"
 BEL_anti_tank_guns:0 "Відмінні протитанкові гармати"
 BEL_better_than_maginot:0 "Краще за Магіно"
 BEL_democratic_party:0 "Католицький блок"
 BEL_european_crusade_dynamic_modifier_desc:0 "Ми стоїмо як серце європейської ідеї, і коли навколо крутіться стерв'ятники, тільки наша непохитна рішучість здатна подолати варварські загрози в будь-яких формах."
 BEL_european_crusade_dynamic_modifier_rexist_tt:0 "Додати §Y$BEL_european_crusade_dynamic_modifier$ (Рексисти)§! на:"
 BEL_expand_the_belgian_legion_tt:0 "3 §YДивізії піхоти§! з'явиться в випадковій провінції на батьківщині країни, що прийняла вигнання."
 BEL_fn_herstal_organization:0 "FN Herstal"
 BEL_free_belgian_forces_desc:0 "Наша присутність за кордоном тепер настільки зросла, що ми можемо розпочати належні військові дії проти наших окупантів. Хоча бій може не бути безпосередньо за Бельгію, ми принаймні зможемо перенести боротьбу на наші вороги і зробити свій внесок у зусилля на війні з [BEL.GetAdjective] кров'ю та сталлю."
 BEL_growing_threat_of_fascism_desc:0 "Підвищення підтримки радикального фашизму по всій Європі та світу стало дуже тривожним трендом, і ми повинні бути готові зробити все необхідне, щоб запобігти його поширенню. Навіть якщо такі дії повинні бути превентивними."
 BEL_international_socialist_bureau_desc:0 "Друга Інтернаціонала мала постійну секретаріат у Брюсселі, і хоча ця організація була розпущена в 1916 році, боротьба соціалістів триває. Тепер, коли ми відновили своє становище на міжнародній арені, ми повинні відновити цю інституцію і знову взяти на себе лідерську роль у Соціалістичному Інтернаціоналі."
 BEL_king_of_the_belgians:0 "Король бельгійців"
 BEL_lambert_chardome:0 "Ламбер Шардом"
 BEL_man_with_a_plan:0 "Чоловік з планом"
 BEL_paul_van_zeeland_remains_tt:0 "§YПоль ван Зееланд§! залишається прем'єр-міністром, очолюючи широку коаліцію §Yдемократичних§! партій."
 BEL_raoul_van_overstraeten:0 "Раул ван Оверстретен"
 BEL_re_establish_belgian_navy_desc:0 "Незважаючи на те, що за Версальським договором Бельгія отримала кілька суден від Німеччини після Першої світової війни, у 1927 році Бельгія скасувала свій флот через бюджетні обмеження. З огляду на загрози за кордоном і необхідність підтримувати стратегічні комунікації та торгівлю, зокрема з Конґо, ми повинні відновити наш флот."
 BEL_requisition_congolese_funds_decision_tt:0 "Кошти можуть бути реквізовані кожні 180 днів"
 BEL_resist_and_bite_desc:0 "Шассері Арденні є елітним підрозділом військ [ROOT.GetAdjective], який складається переважно з мешканців провінції Люксембург, що звикли до густих лісів регіону. Їхній девіз: \"Стійко і рішуче!\""
 BEL_secretaries_general:0 "Генеральні секретарі"
 BEL_spanish_intervention_desc:0 "Республіканська ситуація в Іспанії є нестабільною, і очевидно, що для того, щоб демократія перемогла, ті, хто тримається за неї, повинні посилити свою підтримку тих, хто за неї бореться."
 BEL_the_european_crusade_desc:0 "На кордонах Європи кружляють стерв'ятники, їхні варварські ідеології шукають слабкість серед цивілізованих націй. Наше покликання — бути бастіоном порядку та прогресу, і наша нація, що довела свою незрівнянну рішучість, має право стояти на чолі цієї боротьби."
