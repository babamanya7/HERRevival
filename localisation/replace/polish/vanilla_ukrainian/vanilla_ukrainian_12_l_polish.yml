 RAJ_GOE_urge_non_violence:0 "Закликати до ненасильства в [FROM.GetName]"
 RAJ_ammunition_factory_khadki_desc:0 "Щоб мати можливість забезпечити зброєю сучасні бойові сили, нам потрібно різко розширити збройові фабрики нашої країни."
 RAJ_archibald_wavell:0 "$ENG_archibald_wavell$"
 RAJ_azad_hind_dlc_tt_2:0 "На початку §RГромадянської війни§! протягом §Y120§! днів"
 RAJ_azad_hind_tag_DEF:0 "Азад Гінд"
 RAJ_bombay_baroda_and_central_india_railway:0 "Залізниця Бомбей—Барода—Центральна Індія"
 RAJ_bombay_baroda_and_central_india_railway_desc:0 "Розширення Залізниці Бомбей, Барода та Центральна Індія з'єднає ключові регіони, стимулюючи економічне зростання та об'єднуючи громади. Ці життєво важливі лінії зміцнять торговельні мережі та посилять інфраструктуру Індії для майбутніх викликів."
 RAJ_british_arms_investors:0 "Британські інвестиції в збройові заводи"
 RAJ_campaign_against_agrarian_societys_desc:0 "Індію не можна залишати в минулому столітті. Нам потрібно докласти узгоджених зусиль, щоб підняти наш народ."
 RAJ_concessions_to_the_industrialists_desc:0 "Щоб стимулювати розвиток, не виснажуючи імперську скарбницю, ми запропонуємо сприятливі умови промисловцям, готовим інвестувати в регіональне зростання. В обмін на скромні поступки, місцеві лідери забезпечать лояльність через процвітання."
 RAJ_congress_demands_increase_decision_cost_reached_max_tt:0 "Витрати на рішення для кампаній досягли максимального значення (§R200§! £pol_power£)."
 RAJ_cordite_factory_aruvankadu_tamil_nadu_desc:0 "Наявність хороших метальних речовин для артилерії дасть нашим важким гарматам перевагу над ворогами."
 RAJ_defend_states:0 "Захистити"
 RAJ_deforestation_desc:0 "Вогонь живить промисловість. Вогонь потребує деревини та вугілля, і ми маємо їх багато, то чому б не використати?"
 RAJ_fairey_aviation_organization:0 "Fairey Aviation — індійський відділ"
 RAJ_famine_scripted_timeframe_reveal:0 "[GetFamineTimeframe]\n$RAJ_famine_prevention_stats$"
 RAJ_halls_of_knowledge_desc:0 "Сильна нація будується на фундаменті знань. Інвестуючи в дослідження та освіту, ми розвиваємо інновації, розширюємо можливості нашого народу та забезпечуємо місце [ROOT.GetNameDef] як лідера в науці, промисловості та прогресі."
 RAJ_high_altitude_training_desc:0 "Суворі вершини Гімалаїв вимагають сили та стійкості. Створивши спеціалізовані програми високогірної підготовки, ми готуємо наші сили до домінування в екстремальних умовах, забезпечуючи наші кордони та утверджуючи контроль над стратегічними гірськими регіонами."
 RAJ_high_altitude_training_tt:0 "Отримає шаблон гірськострілецької дивізії"
 RAJ_hindi_as_a_national_language_desc:0 "Прийняття хінді як національної мови об'єднає Індію під спільною культурною ідентичністю. Просуваючи її використання, ми зміцнюємо спілкування, плекаємо національну гордість та закладаємо основу для згуртованої та незалежної держави."
