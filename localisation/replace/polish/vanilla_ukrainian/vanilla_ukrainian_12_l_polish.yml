 SIA_chamkat_phalangkun:0 "Чамкат Фалангкун"
 SIA_chemical_imports:0 "Імпорт хімікатів"
 SIA_constitutional_virtue:0 "Конституційна чеснота"
 SIA_fighter_equipment_1_short:0 "Hawk III"
 SIA_install_heavy_cranes_and_power_plant_desc:0 "Суднобудування — це не лише деревина і сталь, а й техніка та енергія. Важкі крани та надійне електропостачання перетворять наші верфі з примітивних об'єктів на справжні інструменти сучасної промисловості."
 SIA_join_the_allies_desc:0 "[ROOT.GetName] не може стояти осторонь, поки світ поглинутий війною. Союзники пропонують зброю, визнання і місце серед націй, що чинять опір агресії. Приєднавшись до них, ми пов'язуємо виживання Сіаму з ширшою боротьбою за вільний світ."
 SIA_khana_ratsadon_dummy_civilian_desc:0 "Цивільне крило — потужна кліка партії Хана Ратсадон. Вони не схвалять політику, яка, на їхню думку, суперечить їхнім інтересам, але схвалять те, що розглядають як підтримку демократії та цивільного населення."
 SIA_khana_ratsadon_dummy_civilian_tt:0 "Цивільне крило влаштує переворот, якщо ми занадто їх роздратуємо. Щоб уникнути громадянської війни, ми не повинні утримувати §Y$idea_SIA_civilian_rebellious$§! занадто довго."
 SIA_military_oversight_bureau_desc:0 "Армії не можна дозволити знову стати державою в державі. Очолюване цивільними бюро нагляду контролюватиме призначення, бюджети та політичну діяльність у збройних силах, гарантуючи, що казарми підпорядковуватимуться Бангкоку, а не навпаки."
 SIA_military_wing_leader:0 "Лідер військового крила"
 SIA_modify_cultural_mandates:0 "Модифікує $idea_SIA_thai_cultural_mandates$ на:"
 SIA_movie_theater_cat:0 "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_nav_bomber_equipment_3_short:0 "P1Y Ginga"
 SIA_no_supply_grace_tt:0 " $MODIFIER_NO_SUPPLY_GRACE$ $RIGHT|+=1$ год"
 SIA_pad_thai_desc:0 "Сучасна нація підтримується не лише міністерствами і заводами, а й спільними звичками, що об'єднують народ. Популяризуючи національну страву з рису, виготовлену з сіамських інгредієнтів, ми стимулюємо внутрішнє споживання, підтримуємо наших фермерів і зменшуємо залежність від іноземних продуктів у нестабільні часи."
 SIA_reluctant_submission_tt:0 "Ми зможемо укласти мир з атакуючою великою державою. Проте вони очікуватимуть, що ми друкуватимемо для них гроші.\nНаш фактор §YФабрик споживчих товарів§! буде зростати на §Y[?idea_SIA_printing_money_monthly_change|%]§! щомісяця, до максимуму у §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nВзяття фокусу §Y$SIA_thai_rice_company$§! зменшить темп зростання на §G50%§!\n\nВзяття фокусу §Y$SIA_demand_repatriation$§! зніме необхідність друкувати гроші."
 SIA_retake_lost_british_states_desc:0 "Не лише [FRA.GetAdjective] розділили наше велике королівство, але й [ENG.GetAdjective], гнані амбіціями, також користалися кожною можливістю, щоб забрати свою частку. Оскільки їхня увага прикута до більших суперників, для нас настав час діяти."
 SIA_river_patrols:0 "Річкові патрулі"
 SIA_scholarly_politician:0 "Політик-науковець"
 SIA_sell_bangkok_dock_co:0 "Продаж компанії Bangkok Dock Co"
 SIA_send_bureaucrats_abroad:0 "Відправка бюрократів за кордон"
 SIA_ship_torpedo_sub_4:0 "6x 533-мм ТА з P.Loading"
 SIA_siamese_development_cooperative:0 "Сіамський кооператив розвитку"
 SIA_start_limited_war_malaysia_burma:0 "Почати обмежену війну проти [FROM.GetName]"
 SIA_submarine_day:0 "День підводника"
 SIA_support_songsuradets_military_clique_desc:0 "Не кожен офіцер є ворогом нації. Сонгсурадет і його лоялісти пропонують дисципліновану військову альтернативу корумпованим генералам, які привели Сіам на край прірви. З їхньою підтримкою можна відновити порядок, не віддаючи державу в руки хаосу."
 SIA_suspend_ordinary_legal_procedures_desc:0 "Повстання Сонгсурадета дає нам можливість провести масштабні реформи в ім'я національної безпеки. Система стримувань і противаг, яка утримується судами та іншими політичними органами, буде нейтралізована, що дасть нам необхідний час для централізації влади."
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc:0 "Залучити Луанга Чавенгсаксонгкрама на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_sway_phin_choonhavan_to_seri_thai_desc:0 "Залучити Пхіна Чунхавана на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_the_thonburi_dockyard_project_desc:0 "Флот не може підтримуватися лише імпортними корпусами. Якщо [ROOT.GetNameDef] має намір утримувати і розширювати свої військово-морські сили, вона повинна інвестувати у верфі, майстерні та робочу силу, які формують справжній фундамент морської могутності."
 SIA_war_material_substitutions_desc:0 "У час блокади ідеальний матеріал менш цінний, ніж доступний. Ми повинні вивчити замінники для металів, хімікатів та імпортних компонентів, щоб виробництво могло продовжуватися навіть тоді, коли іноземні товари більше не досягають наших берегів."
