 emergency_factory_conversion_defensive:0 "Екстрене переобладнання заводів"
 equipment_effort_desc:0 "Межі того, яке обладнання може носити піхота, постійно змінюються. Ми зосередимося на наданні нашим військам найкращих доступних інструментів."
