 bba_news.103.desc_communists:0 "Колишній лідер держави [FROM.GetNameDef], Беніто Муссоліні, був знайдений мертвим, імовірно страчений комуністами. Новий режим [FROM.GetLeader] діяв швидко і заарештував кількох прихильників комуністів, оскільки країну охопила збуджена атмосфера, а багато хто закликав до справедливості і помсти уявним ворогам."
 beck_ribbentrop_signed:0 "Німеччина погодилася захищати Польщу"
