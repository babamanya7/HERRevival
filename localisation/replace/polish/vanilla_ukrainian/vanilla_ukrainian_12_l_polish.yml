 carrier_battlegroups_desc:0 "Авіаносці здатні вражати ворожі цілі на набагато більшій відстані, ніж будь-яка корабельна гармата, а літаки не дадуть ворогові застати нас зненацька. Масив авіаносців — сила, з якою доведеться рахуватися."
