 BRA_license_soviet_designs:0 "Ліцензійні угоди з [SOV.GetNameDef]"
 BRA_oliveria_viana:0 "Олівейра Віана"
 BRA_purchase_soviet_equipment_desc:0 "Нашій армії зараз дуже потрібне обладнання. Щоб збільшити цю армію, ми хотіли б мати можливість купити обладнання за вигідною ціною у надійного союзника. Завдяки деяким переговорам ми повинні змогти укласти угоду з [SOV.GetNameDef]."
