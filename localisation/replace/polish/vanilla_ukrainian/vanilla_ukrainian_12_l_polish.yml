 SPR_concessions_to_the_left_desc:0 "Страйкарі мають вагомі підстави для занепокоєння. Ми пообіцяємо розглянути їх, а поки що підемо на поступки у вигляді відмови від переслідування за незаконне захоплення землі та дрібні соціальні злочини й крадіжки. Це має дещо зменшити соціальну напругу."
