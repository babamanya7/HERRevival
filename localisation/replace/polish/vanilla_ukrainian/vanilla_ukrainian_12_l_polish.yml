 INS_expand_batavia_med_school_desc:0 "Розширення Медичної школи Батавії шляхом будівництва нових кампусів і найму більшої кількості професорів зробить подальшу освіту набагато доступнішою, що життєво важливо для нашого довгострокового економічного зростання."
