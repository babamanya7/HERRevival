 CONGO_at_least_fourteen_focuses_done_tt:0 "Завершено принаймні §Y14§! фокусів з §YSociété Générale de Belgique§! і §YСерце Африки§!"
 CONGO_aviation_militaire_de_la_force_publique_desc:0 "Не секрет, що величезний розмір Конґо робить військове та поліцейське управління територією значним викликом. Однак є один вид транспорту, який може подолати ці відстані з легкістю: літаки. Нам слід інвестувати в це та забезпечити контроль над небом."
 CONGO_congo_free_state_desc:0 "Колоніальна адміністрація була настільки ефективною в запобіганні будь-яким мріям про свободу, що майбутнє Конґо, здається, вже визначено — майбутнє, знову пригнічене під владарюванням абсолютної влади з Брюсселя."
 CONGO_expanded_rubber_plantations:0 "Розширені руберові плантації"
 CONGO_jungle_industry_desc:0 "Інвестори часто не можуть зрозуміти цінність великого джунглю, але потрібно лише знати, де шукати. Ми повинні знайти ці експертизи та забезпечити їх необхідними інструментами для того, щоб відкрити ці приховані багатства."
