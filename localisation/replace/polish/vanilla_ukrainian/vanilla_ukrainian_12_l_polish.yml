l_polish:
 1035_nanjing_points:0 "([?1035.state_political_support_value|+0]) "
 43DescIsPuppet:0 "передати контроль над державою [FROM.FROM.OWNER.GetNameDef] їм"
 43TtIsNotPuppet:0 "[ROOT.GetNameDefCap]"
 AAT_Sweden.29.desc:0 "Держава [FROM.GetNameDef] відхилила наш запит на передачу наших старих колоній, заявивши, що наша вимога настільки не відповідає сучасній геополітиці і що будь-що інше, окрім категоричної відмови, продовжило б цей фарс занадто довго."
 AAT_Sweden.43.b:0 "Це порушує наш суверенітет."
 AAT_Sweden.45.desc:0 "Держава [FROM.GetName] відмовилася демілітаризовувати область [148.GetName], заявивши, що ми не маємо юрисдикцію вирішувати, що [FROM.GetName] робить у межах їхнього кордону. Чи не означає це, що вони активно готують змову проти нас? Украй важливо, щоби ми завдали удару першими."
 AAT_Sweden_BoP.12.desc:0 "З наближенням дня виборів дебати перейшли до нагальних питань національної безпеки та зовнішньої політики. Багато партій виступають за нейтралітет та ізоляціонізм задля безпеки країни, тоді як інші наполягають на більш рішучому зовнішньополітичному курсі. Оскільки світ стає дедалі небезпечнішим, лише один меседж дає надію електоратові."
 AAT_Sweden_flashpoints.20.b:0 "Ми й самі впоряємося."
 AAT_Sweden_flashpoints.36.a:0 "Сподіваємося, ми зможемо зберегти наш нейтралітет."
 AAT_Sweden_flashpoints.39.t:0 "[SWE.GetName] дозволяє прохід пораненим"
 AAT_Sweden_flashpoints.40.desc:0 "Як ми і побоювалися, нещодавній запит Німеччини на доступ до нашої залізничної мережі тепер розширився. [GER.GetAdjectiveCap]ий уряд просить можливість використовувати наші телеграфні та телефонні мережі для прямого зв'язку між державами [NOR.GetName] та [GER.GetNameDef].\n\nПоступка цій вимозі буде ще одним ударом по нашому нейтралітету, проте ми можемо дослідити можливість прослуховування ліній зв'язку, щоби шпигувати за планами [GER.GetAdjective]их військових."
 AAT_Sweden_flashpoints.63.desc:0 "Наше нещодавнє рішення про ембарго проти держави [GER.GetNameDef] було зустрінуте обуренням у місті [GER.Capital.GetCapitalVictoryPointName]. Імовірно, панікуючи через свою історичну залежність від [SWE.GetAdjective]ої залізної руди, вони висунули ультиматум. У ньому йдеться про те, що якщо ми негайно не скасуємо наше ембарго, вони будуть змушені вжити рішучих заходів проти нас, включаючи війну."
 AAT_Sweden_nationalists.12.desc:0 "Ніхто, крім експертів-правників, не знав, що наші нещодавні реформи по суті зводилися до відновлення аристократичних привілеїв. Звісно, з підконтрольними нам ЗМІ такі експерти не мали можливості поширювати невдоволення серед громадськості. Тим часом представники аристократії радіють реформам та з нетерпінням чекають на відновлення справедливості."
 AAT_Sweden_nationalists.14.desc:0 "Міністр оборони оголосив про збільшення військового бюджету на прохання провідних офіцерів, які вже давно доводять, що країна погано озброєна, щоб захистити себе. Зі збільшенням бюджету лояльність військових, принамсі,залишиться потужною."
 AAT_Sweden_nationalists.22.desc:0 "Берлін вирішив не задовольнити наше прохання, посилаючись на те, що ми не готові до величезної відповідальності, яка дістанеться нам разом із великими териториями. Можливо, вони бояться надати райхскомісаріату забагато повноважень?"
 AAT_Sweden_nationalists.22.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 AAT_Sweden_nationalists.25.desc:0 "[FROM.GetName] відхиляє нашу пропозицію. Зважаючи на нашу складну ситуацію, ми не могли не поспробувати."
 AAT_Sweden_nationalists.30.a:0 "Яка підлість"
 AAT_britain_narvik.1.t:0 "[SWE.GetAdjective]і шахти були підірвані"
 AAT_finland_continuation_war.09.t:0 "[FROM.GetNameDef] відхиляє нашу пропозицію миру"
 AAT_finland_diplomacy.04.t:0 "[FROM.GetName] відкидає нашу пропозицію"
 AAT_finland_diplomacy.06.desc:0 "Чудові новини! [FROM.GetNameDefCap] погоджується передати під нашу опіку історичні землі саамів. Тепер ми повинні будемо захищати жителів цих територій і стежити за їхнім добробутом. До нас уже надійшли вітальні листи від саамських лідерів — вони сподіваються, що ми продовжимо поважати їхню культуру та звичаї."
 AAT_finland_diplomacy.07.t:0 "[FROM.GetName] відкидає нашу петицію"
 AAT_finland_diplomacy.23.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], просить нас допомогти країні в обороні від будь-якої можливої агресії з боку держави [SOV.GetNameDef]. Лідер стверджує, що знає про підготовку нападу, і ми — єдина надія на виживання."
 AAT_finland_kinship_war.06.b:0 "Не варто будити сплячого ведмедя..."
 AAT_norway.13.a:0 "Час Квіслінґа нарешті настав!"
 AAT_norway.17.desc_fascist:0 "Лідер держави [NOR.GetNameDef] вимагає, щоби ми поступилися їм частиною нашої території, називаючи це поверненням споконвічних земель свого народу. Як і очікувалося, вони погрожують війною, якщо ми відмовимося.\n\nЗемлі, про які йде мова — землі [GetNorwegianClaims]."
 AAT_norway.3.t:0 "[ROOT.GetLeader.GetName] оголошує придушення незгодних"
 AAT_norway_monarchist.2.t:0 "Король мертвий!"
 AAT_norway_news.99.t:0 "Король Войтек повертає Ян-Маєн під свою владу"
 AAT_norway_rikstanken.10.t:0 "Держава [FROM.GetNameDef] прийняла угоду про дослідження"
 AAT_norway_rikstanken.4.t:0 "[FROM.GetName] хоче придбати наші танки"
 ABDA_naval_procurement_desc:0 "Вже зазнані втрати вимагають термінового поповнення. Скоординована програма закупівель ABDACOM віддасть пріоритет есмінцям, підводним човнам і патрульним кораблям, які найкраще підходять для тихоокеанського театру воєнних дій, гарантуючи, що наш об'єднаний флот зможе протистояти ворожій експансії."
 ABILITY_FRONT_OVERRUN_DESC:0 "Ваша армія буде втрачати менше планування й організації в наступальних маневрах, але буде нести більші втрати."
