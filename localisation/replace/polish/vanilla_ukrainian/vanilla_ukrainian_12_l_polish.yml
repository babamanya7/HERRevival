 NXM:0 "Нінсяські Ма"
 NXM_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1:0 "Чжунсяо"
 NZL_commonwealth_loyalty_desc:0 "Нова Зеландія залишається відданим членом Британської Співдружності і визнає Короля законним главою держави. Економіка Нової Зеландії також глибоко інтегрована в ширшу імперську економічну систему."
 NZL_cv_CAS_equipment_2_short:0 "Skua"
 NZL_cv_nav_bomber_equipment_1:0 "Blackburn Shark"
 NZL_destroyer_1_desc:0 "$ENG_destroyer_1_desc$"
 NZL_destroyer_4_desc:0 "$ENG_destroyer_4_desc$"
 NZL_domestic_arms_industry_desc:0 "Ми маємо переналаштувати якнайбільше підприємств на випуск стрілецької зброї. Нам потрібні патрони, запчастини, додаткове обладнання та багато іншого. Все це ми можемо випускати у себе вдома."
 NZL_electrification_desc:0 "Освоюючи наші річки та розширюючи гідроелектростанції, ми можемо закласти основу для довготривалої промислової могутності. Нові греблі та лінії електропередач збільшать потужність по всій країні, гарантуючи, що заводи, залізниці та порти отримають необхідну їм енергію."
 NZL_expand_devonport_naval_base_desc:0 "Морська база в Девонпорт стане штаб-квартирою нашого флоту, але її необхідно розширити, щоб вона відповідала вимогам концепції тотальної війни."
 NZL_jet_tac_bomber_equipment_2:0 "English Electric Canberra"
 NZL_medium_tank_aa_equipment_1:0 "Crusader (зенітний)"
 NZL_medium_tank_destroyer_equipment_3:0 "Contentious"
 NZL_modern_tank_artillery_equipment_1:0 "Centurion AVRE"
 NZL_national_broadcasting_service:0 "Національна служба мовлення"
 NZL_rule_them_all_desc:0 "Антиподні держави південно-тихоокеанського регіону мають об'єднатися у могутню державу. Австралія має присягнути на вірність нашим найвищим ідеалам."
 NZL_tac_bomber_equipment_0_short:0 "Whitley"
 NZL_technology_sharing_with_japan_desc:0 "У Японії працюють багато найкращих учених і винахідників світу. Вони будуть раді поділитися своїми доробками з нами, їхніми братами по зброї."
 NZL_the_plan_desc:0 "We have joined with our allies to share experience and insight in the training of pilots. The war could be won from the air, so the Commonwealth Air Training Plan could be the key to victory."
