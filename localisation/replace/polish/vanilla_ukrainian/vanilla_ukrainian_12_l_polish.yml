 NPTO:0 "Організація північнотихоокеанського договору"
 NSB_poland_communist_events.302.t:0 "[From.GetNameDefCap] погоджується з анексією"
 NSB_poland_communist_events.401.desc:0 "[From.GetNameDefCap] погоджується прийняти нас у ролі протекторату: тепер ми інтегровані в СРСР як держава-маріонетка. Багато хто в країні вважали наше рішення зрадою, але [Root.GetLeader] запевняє польський народ, що [From.GetLeader] — друг Польщі, і всі етнічні поляки, інтегровані зараз у СРСР, будуть задоволені своїм новим [From.GetAdjective]им урядом."
 NSB_poland_events.3.desc:0 "Представники держави [From.GetNameDef] оголосили про свій інтерес до альянсу з новою Німецькою імперією. Вважаючи, що кайзер [Root.GetLeader] швидше погодиться з [From.GetAdjective] незалежністю, ніж [Root.GetHerHis] попередник, а також стверджуючи, що [From.GetNameDef] у сучасному уявленні можна безпосередньо віднести до Акту від 5 листопада, підписаного Центральними державами, [From.GetNameDef] пропонує укласти формальний союз двох держав.\nПрийняти цю пропозицію — значить досягти найважливішої віхи в [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] відносинах і забезпечити заділ на світле майбутнє двох націй."
 NSB_poland_events.401.desc:0 "[From.GetNameDefCap] сьогодні знову звертається до нас і оголошує про згоду продати територію [POL_colony_purchase.GetName]. Тепер залишається лише утрусити наші борги перед державою [From.GetNameDef], і колонія стане не [Root.GetAdjective] колоніальної імперії."
 NSB_poland_monarchist_events.1.t:0 "[From.GetNameDefCap] заявляє претензії на наш трон"
 NSB_polish_fascist_events.101.desc:0 "[From.GetNameDefCap] погоджується на наші умови, і [Root.GetNameDef] тепер офіційно під [From.GetAdjective] захистом. [From.GetAdjective] солдати вже заповнюють [Root.GetAdject а наша армія та міністри підпорядковуються безпосередньо Берліну."
 NSB_polish_fascist_events.302.b:0 "Можливо, нам допоможе Підпільна держава..."
 NSB_polish_fascist_events.6.a:0 "Все йде за планом."
 NSB_soviet_civil_war_common.003.t:0 "[ROOT.GetLeader] мобілізує збройні сили"
 NSB_soviet_civil_war_common.103.t:0 "Північний Сахалін в обмін на зброю"
 NSB_soviet_civil_war_common.112.desc:0 "Після кількох днів обговорень [FROM.GetLeader] раптово вирішує не підтримувати українське повстання, ніяк не пояснюючи причин відмови."
 NSB_soviet_civil_war_common.122.t:0 "[FROM.GetName] приймає нашу пропозицію"
 NSB_soviet_comecon_effect_duration_tt:0 "Ці ефекти продовжаться §Y180§! днів, після чого національний дух буде замінено на попередній."
 NSB_soviet_communist_civil_war.001.e:0 "Каменєв чудово надихне народ."
 NSB_soviet_communist_civil_war.003.desc:0 "Війна знову на нашому порозі. Ми мусимо озброїтися проти диктатора, який збив нашу країну з вірного шляху. Надто довго Сталін вів Радянський Союз неправильним курсом. Шкода, що все виходить саме так, але у нас немає іншого варіанту."
 NSB_soviet_fascist_tsarist.13.t:0 "[FROM.GetAdjectiveCap]е посилення Камчатки"
 NSB_soviet_fascist_tsarist.16.b:0 "Ми не забули, чого коштували їхні обіцянки минулого разу."
 NSB_soviet_fascist_tsarist.16.t:0 "Троїстий союз"
 NSB_soviet_fascist_tsarist.23.t:0 "Вісь Берлін–Москва: пропозиція прийнята"
 NSB_soviet_foreign_politics_events.11.t:0 "[FROM.GetNameDefCap] вимагає ввести воєнний стан"
 NSB_soviet_foreign_politics_events.12.a:0 "Ми вітаємо таку ініціативу."
 NSB_soviet_foreign_politics_events.200.desc:0 "[FROM.GetAdjectiveCap]ий посол доставив ноту з вимогою негайних консультацій, які йому повинен надати [THIS.GetLeader]. Згідно з нотою, [FROM.GetAdjective] уряд більше не бажає терпіти в нашій країні Не дуже зрозуміло, що мається на увазі під цим, але очевидно, що нам, по суті, дають три варіанти: погодитися на розміщення на нашій території [FROM.GetAdjective] військ, замінити наш уряд більш відповідним потребам держави [FROM.GetNameDef] або у перспективі готуватися до військового вторгнення держави [FROM.GetNameDef]."
 NSB_soviet_foreign_politics_events.265.t:0 "[FROM.GetNameDef] відкидає наші умови миру"
 NSB_soviet_foreign_politics_events.279.t:0 "[FROM.GetNameDefCap] приймає нашу військову допомогу"
 NSB_soviet_foreign_politics_events.32.b:0 "Найменше нам потрібна чергова мерзла земля."
 NSB_soviet_nationalist.002.desc:0 "[FROM.GetAdjectiveCap]ий посол звернувся до нашого з «проханням» про визнання держави [FROM.GetNameDef] істинним і верховним урядом держави [ROOT.GetName]. В обмін нам пропонують «певний ступінь автономії»."
 NSB_soviet_paranoia_system_events.01.a:0 "Чи виправдані його побоювання хоч частково?"
 NSB_soviet_paranoia_system_events.24_paranoia_both_decrease_tt:0 "£SOV_paranoia_text_icon Політична параноя знижується, виходячи з рівня чистих командувачів військової частини: §G[?SOV.SOV_combined_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.31.desc:0 "Штабний офіцер, чий начальник — адмірал [?ROOT.SOV_purged_character_for_loc.GetName], звернувся в НКВС з доповіддю про підозрілу діяльність. Він стверджує, що при нещодавньому візиті [?ROOT.SOV_purged_character_for_loc.GetName] користувався дуже теплим прийомом у морських офіцерів і тому міг передати їм засекречену інформацію. Більше того, є свідчення існування в кількох відвіданих адміралом портах троцькістських осередків, де він за бажання міг плести антиурядові змови."
 NSB_soviet_paranoia_system_events.49.a:0 "Вони відповідальні за те, що сталося."
 NSB_soviet_policies_of_collective_security.13.a:0 "Настав час скріпити пакт підписами!"
 NSB_soviet_policies_of_collective_security.7.a:0 "Ми із задоволенням станемо третьою стороною."
 NSB_soviet_soviet_german_trade_agreement.2.desc:0 "[FROM.GetAdjectiveCap]і дипломати повідомили нам, що приймають нашу пропозицію. Наші країни уклали торгову угоду, в рамках якої [ROOT.GetNameDef] буде постачати сировину, зокрема зерно, бавовну, нафту, гуму, державі [FROM.GetNameDef] В обмін ми отримаємо недобудований крейсер типу «Адмірал Гіппер», креслення інших бойових кораблів, важкі морські гармати та зразки [FROM.GetAdjective] авіації. Така угода обов'язково допоможе нам у розвитку сучасних військових технологій."
 NSB_soviet_spanish_civil_war.4.desc:0 "Харизматичні представники правої опозиції в Радянському Союзі разом з місцевими ораторами з РПМО, CNT та FAI, провели інформаційну та агітаційну кампанію, щоб пробудити революційний дух у пролетарських та селянських масах державиD. Промов народ усвідомив свою класову приналежність і тепер як ніколи хоче допомогти правому справі."
 NUMBER_OF_ENEMY_CONVOYS:0 "Припущене число ворожих конвоїв, котрі проходять крізь регіон"
