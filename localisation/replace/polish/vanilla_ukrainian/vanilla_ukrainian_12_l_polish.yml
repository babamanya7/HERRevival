 RULE_FASCIST_POL_AI_DESC:0 "§HПольський§! ШІ намагатиметься примиритися з Німеччиною в обмін на захист, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_1:0 "1 рівень"
 RULE_OPTION_BALKAN_ENTENTE_DESC:0 "§HТуреччина§! візьме на себе зобов'язання підтримувати безпеку на Балканах і спробує утворити союз із Грецією, Румунією та Югославією."
