 ICE_fighting_as_equals_desc:0 "Ми разом ведемо війну. Ісландія робить більше, ніж просто тягне свою вагу. Данії час визнати, що Ісландія більше не підлеглий, а рівноправний партнер у цьому альянсі. Настав час офіційно оголосити Ісландію незалежною державою."
 ICE_gardhur_airfield_desc:0 "Літаки стають реальною частиною сучасної інфраструктури. Ісландія не повинна відставати. Аеродром поблизу столиці стане ключем до катапультування Ісландії в майбутнє."
