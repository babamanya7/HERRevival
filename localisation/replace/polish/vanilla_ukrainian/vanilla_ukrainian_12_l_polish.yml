 HABSBURG_joint_ventures_in_resource_extraction_desc:0 "Неминуче деякі ресурси залишаються непоміченими або не викопуються з інших причин, зазвичай пов’язаних з економією або часом, або й тим й іншим. Однак тепер, коли всі ці ресурси зібрано в рамках федерації, ми можемо використовувати нашу більшу економіку та розширені знання про те, як найкраще видобувати корисні копалини!"
