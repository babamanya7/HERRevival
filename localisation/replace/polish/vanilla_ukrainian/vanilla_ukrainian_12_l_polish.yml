 JAP_imperial_rule_assistance_association_desc:0 "Через загрози як внутрішні, так і зовнішні, а також розкол у цивільному уряді, ми повинні створити Тайсей Йокусанкай, щоб започаткувати етатистську, парафашистську політичну систему з метою усунення відомчості та фракційності з політики та економіки, створюючи тоталітарну однопартійну державу для максимізації ефективності нашої доктрини тотальної війни."
 JAP_increase_crop_yields_desc:0 "Острови Південних морів мають велику кількість кокосів, потенційно прибуткової товарної культури. Ми повинні заохочувати монополії, які поєднують приватну ініціативу з державним капіталом. Уклавши контракт з Нанйо Кохацу, можна вирощувати цукрову тростину, банани, ананаси, таро, маніок, каву та інші тропічні сільськогосподарські продукти, поставивши острови на один рівень з Тайванем за обсягами виробництва."
