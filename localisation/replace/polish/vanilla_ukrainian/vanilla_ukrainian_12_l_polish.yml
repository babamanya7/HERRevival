 COG_foster_a_personality_cult_desc:0 "Ніхто інший, як [ROOT.GetLeader], не може принести процвітання народам Африки. Він — великий лідер, який є основою нашої незалежності, і тому повинен отримувати відповідне ставлення."
 COG_freedom_at_gunpoint_category:0 "Свобода через кров"
 COG_freedom_at_gunpoint_offer_peace_tt:0 "§Y[FROM.Capital.OWNER.GetName]у§! буде запропоновано мир в обмін на відмову від претензій на §Y[FROM.GetAdjective]у§! територію, яку §Y[THIS.GetName]§! на даний момент контролює. \n\nЯкщо вони погодяться, §Y[THIS.GetName]§! отримає маріонетку на контрольованій території, яка є §Y[FROM.GetAdjective]ою§! осердною.\n\n§R[ROOT.GetFlag][ROOT.GetNameDefCap] покине будь-який альянс, до якого входить, якщо буде прийнято мир і альянс перебуває у стані війни з державою [FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName]!§! \n\n§R[FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName] розглядатиме мирну пропозицію, лише якщо [ROOT.GetFlag][ROOT.GetName] контролюж [FROM.GetAdjective]у територію!§!"
 COG_german_south_west_africa_desc:0 "Ми повинні просуватися до старих територій Німецької Південно-Західної Африки, щоб вони знову стали частиною нашого контролю!"
 COG_invest_in_mirundi:0 "Інвестувати в Compagnie Minière au RuandaUrundi"
 COG_mutual_defense_desc:0 "Народи Африки ніколи не матимуть тривалого миру, поки нації світу не зрозуміють, що ціна спроби колонізувати нас занадто висока. Щоб досягти цього, члени Організації африканської єдності повинні створити угоду про взаємну оборону, обіцяючи захищати один одного, якщо на нас буде здійснено напад."
 COG_reestablish_the_royal_council:0 "Відновити королівську раду"
