 SWE_defense_above_all_desc:0 "Ми маємо визнати той факт, що світ живе за розкладом, відмінним від нашого, і ми більше не можемо ризикувати майбутнім нашої держави без будь-якої форми оборонних можливостей."
 SWE_delegation_to_berlin_desc:0 "Хоча ми досягли великих успіхів у згуртуванні мас до нашої справи, поки що ми не маємо достатньої підтримки, щоб захопити контроль над державою. Проте ходять чутки, що [GER.GetLeader] може сприймати розгортання [GER.GetAdjective]их сил, щоб допомогти нам у нашій боротьбі за певну ціну."
 SWE_dp_light_battery_3:0 "12cm/50 Bofors M36 DP"
