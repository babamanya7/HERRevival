 ARG_international_loan_modifier_desc:0 "Не рідкість, коли країни звертаються до інших країн світу за фінансовою допомогою під час кризи. Враховуючи поточний стан [ROOT.GetAdjective]ої економіки, цілком логічно прийняти допомогу від великих держав, які беруть участь у цьому конфлікті."
 ARG_island_negotiations_decisions_desc:0 "Острови Південної Атлантики є спірною територією, і тому суперечки про те, хто мусить мати над ними суверенітет, тривають. Ця війна може завести нас далі, ніж було би бажано, і нам слід скористатися можливістю домовитися про мирну угоду, коли це буде можливо."
