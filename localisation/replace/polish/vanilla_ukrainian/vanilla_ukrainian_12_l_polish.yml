 mothership:0 "Літаки-матки"
 mtg_britain.101.t:0 "Імперська конференція: федерація — [From.GetName] погоджується"
 mtg_britain.105.t:0 "Імперська конференція: федерація — провал"
 mtg_britain.113.a:0 "Ми вітаємо їх повернення на батьківщину."
 mtg_britain.23.t:0 "Ізолювати середземноморську загрозу"
 mtg_britain.27.b:0 "Нас це не цікавить."
 mtg_britain.48.t:0 "[From.GetName] відкидає вимоги"
 mtg_britain.49.t:0 "Велика Британія пропонує співпрацю"
 mtg_britain.59.a:0 "Що таке пара розбитих носів у порівнянні з майбутнім нації?"
 mtg_britain.66.b:0 "Це неприйнятно! Потрібно проголосити незалежність!"
 mtg_britain.66.t:0 "Лояльність до Великої Британії"
 mtg_britain.72.a:0 "Які зловісні провістки... Потрібно готуватися до гіршого."
 mtg_exile_government.2.desc:0 "[From.GetLeader] офіційно просить [Root.GetAdjective]ий уряд про дозвіл повернутися до складу держави [From.GetNameDef] та відновити тимчасовий уряд партії [From.GetRulingPartyLong], після чого підготуватися до повоєнного миру."
 mtg_netherlands.11.d:0 "Не секрет, що японці виявляють величезний інтерес до ресурсів нашої Вест-Індії. У нас два варіанти: або надати японцям ексклюзивні права на ресурси наших колоній, або повністю передати їм контроль над колоніями. Якщо ми бажаємо зберегти мирні відносини з державою [JAP.GetNameDef] необхідно зробити вибір."
 mtg_netherlands.17.a:0 "Їхня невдячність не знає меж..."
 mtg_netherlands.45.t:0 "Принц Бернард замішаний у скандалі"
 mtg_netherlands.46.a:0 "Гідний представник своєї країни."
 mtg_netherlands.7.d:0 "Держава [From.GetNameDefCap] попросила, щоби ми поділилися кресленнями лінійного крейсера класу «Scharnhorst». Вони хочуть створити свій лінійний крейсер проєкту 1047 для захисту колоній у Вест-Індії."
 mtg_netherlands.73.a:0 "Це великий крок у напрямку монархічної Європи!"
 mtg_netherlands.9.t:0 "[From.GetNameDefCap] відмовляється поділитися кресленнями лінійного крейсера."
 mtg_news.14.t:0 "[From.GetName] переглядає колоніальну політику"
 mtg_news.17.b:0 "Тепер нам залишається тільки чекати від них ультиматуму."
 mtg_news.19.t:0 "[From.GetLeader] посилює партію короля"
 mtg_news.22.a:0 "Материк під нашим контролем."
 mtg_news.25.a:0 "Ця угода була необхідною."
 mtg_news.28.b:0 "У нас не було вибору..."
 mtg_news.31.c:0 "У нас є права!"
 mtg_news.39.c:0 "Бути війні."
 mtg_news.41.desc:0 "Напруженість, підживлювана постійними маршами чорносорочників у державі [From.GetNameDef], досягла межі. Останні вуличні сутички, викликані цими маршами, вийшли з-під контролю, і тепер в те, що відбувалося, втрутилася армія.\n\nКоролівські ВМС зберіг вірність офіційному [From.GetAdjective] уряду, у збройних силах склалася інша ситуація, різні підрозділи підтримують хто лоялістів, хто фашистів."
 mtg_news.42.a:0 "Нарешті перемога!"
 mtg_news.42.desc:0 "З падінням [From.GetAdjective]ого демократичного уряду ситуація на Британських островах стабілізувалася. Уряд відмовився бігти в домініони, щоб врятуватися від фашизму, і флот пообіцяв йому підтримку. Поки незрозуміло, чи варто розуміти це слід чекати чищення серед нелояльних офіцерів."
 mtg_news.43.t:0 "Комуністична громадянська війна в державі [From.GetName]"
 mtg_news.53.desc:0 "Під егідою [From.GetAdjective]ого уряду утворюється новий союз із Бельгії, Нідерландів та Люксембурґу. Лідери цих країн висловили надію, що він «залишиться нейтральним перед наростаючою світовою кризою» і що до нього потім приєднаються інші нації, щоби посилити цей «блок нейтралітету та раціональності перед лицем безумства, що охоплює сучасний світ»."
 mtg_news.54.desc:0 "Після утворення Бенілюксу уряди країн, що входять до нього, робили все, щоби привернути інтерес до «сильного і нейтрального блоку здорового глузду». Тепер до союзу запрошено відразу кілька нових країн, і щоб його назва відповідала становищу, що склалося, його вирішено перейменувати на Європейський Союз."
 mtg_news.56.c:0 "Любов короля не знає меж."
 mtg_usa_civil_war_democrats.21.a:0 "Ми досі утримуємо центр країни."
