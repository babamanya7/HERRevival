 PEACE_BIDDINGS_POPUP_REFUNDED_SCORE_TOOLTIP:0 "§HПовернені бали§! £victory_points $AMOUNT_REFUNDED$\n\nУсі ваші бали повернені. У разі продовження конфлікту ви можете почати втрачати бали назавжди."
