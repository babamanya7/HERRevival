 sp_land_generic_reward_option_scientist_xp_desc:0 "[Character.GetName] досягає прориву, прискорюючи прогрес і закріплюючи за собою роль першопрохідця у створенні передового озброєння."
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery:0 "Застосувати та задокументувати відкриття"
 sp_land_reward_stronghold_network_communication_system_overhaul:0 "Переосмислення системи комунікації"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc:0 "У ході розробки необхідно прийняти критично важливе рішення: ми можемо надати перевагу швидкому виробництву та гарматам меншого калібру, або ж інвестувати в більші й важчі гармати, жертвуючи ефективністю виробництва заради незрівнянної вогневої моці та нищівного удару."
 sp_land_stronghold_network_desc:0 "Складна мережа надійно укріплених бункерів й опорних пунктів, побудованих витримувати інтенсивні напади та захищати важливі стратегічні об'єкти від ворожих вторгнень."
 sp_naval_escort_carrier_desc:0 "To safeguard our supply lines, we want to develop smaller, more economical carriers, providing cost-effective air cover and anti-submarine capabilities across oceans."
 sp_naval_midget_submarine_desc:0 "У наших ВМС існує ніша для легких, дешевих і універсальних підводних човнів, які можна використовувати для будь-яких цілей — від саботажу в портах до нападів на конвої."
 sp_naval_modern_battleship_unique_reward_a_desc:0 "Поки багато хто стверджує, що ера лінкорів минула, ми все ще віримо в них. Цей корабель має шанс стати нашою новою надією. На якому аспекті слід зосередитися, щоб утілити цю мрію в життя?"
 sp_naval_nuclear_missile_submarine:0 "Підводний човен із ядерними ракетами"
