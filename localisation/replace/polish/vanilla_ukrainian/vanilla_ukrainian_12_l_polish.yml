 RAJ_seek_financial_aid_from_the_ussr_desc:0 "Щоб просувати наші революційні цілі та прискорити національний розвиток, ми звернемося до [SOU.GetNameDefCap] за фінансовою допомогою. Їхня підтримка може допомогти нам побудувати новий лад, заснований на солідарності та силі."
