 RAJ_tac_bomber_equipment_1_short:0 "Wellington"
 RAJ_territorial_development_scheme:0 "Схема територіального розвитку"
 RAJ_the_dominion_of_india_every_owned_state_compliance_tt:0 "Кожна область у власності з менш ніж §Y100%§! Підпорядкування"
 RAJ_the_enemy_of_my_enemy_desc:0 "У боротьбі за незалежність альянси укладаються за необхідності. Співпрацюючи з тими, хто протистоїть британцям, ми можемо послабити їхній контроль над нашою землею. Свобода може вимагати несподіваних партнерств, але перемога — це все, що має значення."
 RAJ_the_ordnance_factories_board_desc:0 "Координація великої мережі збройових заводів Індії під єдиною радою оптимізує виробництво, підвищить ефективність та забезпечить постійне постачання зброї та боєприпасів. Ця основа розширить можливості наших військових та посилить самодостатність Індії в оборонному виробництві."
 RAJ_the_sun_sets_desc:0 "Ера імперії закінчується. У міру того, як [ENG.GetAdjective] контроль слабшає, ми прискоримо їхній занепад. Сонце нарешті сяде над їхньою імперією, і ми повстанемо з її тіні."
