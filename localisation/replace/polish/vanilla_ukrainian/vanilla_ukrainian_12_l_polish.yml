 adu_northern_expansion_desc:0 "Халіфат був величезним і поширював свою владу далеко за межі Близького Сходу та Іберії. Колись Грузія, Азербайджан і Трансоксанія називали Халіфат своїм домом, і настав час відновити втрачене."
