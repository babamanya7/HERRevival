 GOE_RAJ_loyalist.05.t:0 "[FROM.GetNameDefCap] вимагає, щоб ми відступили"
 GOE_RAJ_loyalist.07.t:0 "Захист Малайї"
 GOE_RAJ_mughals_peace_deal.1.desc:0 "Нарешті економічні труднощі триваючої війни виявилися надто великими для [UK_INDIA.GetAdjective] уряду. Незважаючи на заперечення їхнього сюзерена, вони запропонували нам значні територіальні поступки в обмін на мир."
 GOE_RAJ_partition.6.a:0 "Усі ми, незалежно від того, до якої релігії ми належимо, є рівною мірою дітьми Індії."
