 MEX_focus_aviation_workshops_desc:0 "TNCA було законсервовано через брак коштів після революції, але відтоді, як убивча потужність літаків лише зростає, ми повинні залишатися на вершині аеронавігаційних досягнень."
 MEX_focus_blue_water_navy_desc:0 "Мексика ніколи не була морською державою. У колоніальні часи нашим іспанським володарям потрібні були всі їхні кораблі, щоб протистояти британцям. Під час боротьби за незалежність і громадянських воєн, що послідували за нею, вся наша увага була зосереджена всередині. Після того як Америка випередила нас і стала великою державою, не було сенсу намагатися боротися з морями. Але, можливо, в ці неспокійні часи Мексиці знадобиться потужний флот."
 MEX_focus_confederation_of_mexican_workers:0 "Конфедерація мексиканських робітників"
 MEX_focus_confederation_of_mexican_workers_desc:0 "Політична еліта Мексики завжди прагнула контролювати діяльність профспілок. CTM замінить CROM, оскільки останній вважається корумпованим і дискредитованим через зв'язки з непопулярними минулими лідерами режиму."
 MEX_focus_falangist_veterans:0 "Ветерани-фалангісти"
 MEX_focus_integrate_the_south:0 "Інтегрувати Південь"
 MEX_focus_integrate_the_south_desc:0 "Єдність народів Мексики була повільним процесом, але він не зупиниться на регіональних кордонах чи гірських хребтах. Ми долали такі перешкоди в минулому, і ми зробимо це знову для південних провінцій."
 MEX_focus_liberate_the_caribbean:0 "Звільнити карибські країни"
 MEX_focus_one_world_government:0 "Один світовий уряд"
 MEX_focus_privatization_desc:0 "Система ехідо накладає обмеження на використання землі залежно від того, як планує використовувати її уряд. Чому держава повинна змушувати фермерів жити, а не вирощувати товарні культури на експорт? Ми можемо зробити Мексику багатшою, якщо розіб'ємо комунальні ферми та дамо можливість реальному розвитку. Застарілі уявлення про самозабезпечення лише перешкоджають прогресу та глобалізації."
 MEX_focus_professional_army_desc:0 "Ми не можемо покладатися на спеціальні солдати для забезпечення військ на місці, нам потрібні склади постачання та корпус матеріально-технічного забезпечення. У військовій школі наші армійські командири та офіцери отримають передові військові знання, які дозволять їм розробити ефективні системи постачання.\nНа цьому етапі навіть осли були б кращим рішенням, ніж залишити війська самим добувати продовольство."
 MEX_focus_weapons_modernisation_desc:0 "Мексика мала фантастичну промисловість стрілецької зброї до революції. Ненависний диктатор Діас, попри всі свої вади, був дуже зацікавлений у розробці зброї. Експерименти з автоматичними гвинтівками в епоху Діаса потребують дослідження."
 MEX_focus_womens_suffrage_desc:0 "Багато законодавців і міністрів революційних урядів виступали проти розширення права голосу для жінок, оскільки вважали, що аргументи духовенства легше вплинуть на жінок і поклали б край програмі секуляризації. Як би там не було в минулому, ми не можемо стати на шляху прогресу."
