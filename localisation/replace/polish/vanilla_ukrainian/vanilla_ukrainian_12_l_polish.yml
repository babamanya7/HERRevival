 ARG_political_corruption_modifier:0 "Політична корупція"
 ARG_political_events.120.t:0 "Дивний відвідувач"
 ARG_political_events.19.desc:0 "Згідно з [ARG.GetAdjective] послом у [ROOT.Capital.GetCapitalVictoryPointName], наш нинішній уряд має зректися влади та бути заміненим на [ARG.GetAdjective] маріонетку. Існує висока ймовірність, що наша відмова призведе до оголошення війни. Ми повинні обирати мудро."
 ARG_political_events.21.b:0 "Вони пошкодують, що відмовилися від нас!"
 ARG_political_events.35.desc:0 "[ENG.GetAdjective] посол звернувся до нас сьогодні з пропозицією поступитися нам Південноатлантичними островами, якщо ми зможемо гарантувати припинення цієї війни. Оскільки нашою метою було захопити Фолклендські та Південна Джорджія острови, це було б нам на користь."
 ARG_political_events.42.b:0 "Ми не можемо нікого відправити в цей час..."
 ARG_political_events.62.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 ARG_political_events.71.desc:0 "Переважною більшістю голосів Фанні Едельман змогла зберегти контроль над своєю позицією в уряді. Здається, шлях, якого бажають для [ARG.GetNameDef], — це шлях, заснований на стабільності та зростанні. Конкурент Антоніо Сото повернувся до Патагонії і погодився наразі дотримуватися планів Едельман."
 ARG_rapid_militirization:0 "Швидка мілітаризація"
 ARG_rapid_urbanization_desc:0 "Значна частина [ARG.GetName] залишається сільською землею, але шлях вперед у 20-му столітті — це акт урбанізації. Розвиваючи наші міста, ми можемо переконати більше людей переїхати туди, а це означає, що ми отримаємо значне збільшення робочої сили для наших високоіндустріальних центрів."
 ARG_revive_the_colonial_plan_desc:0 "Намагаючись закріпитися в Південній Америці, [GER.GetNameDef] розробила план створення колонії в [URG.GetNameDef]. Однак план так і не був реалізований. Ми повинні взяти на себе ініціативу відродити цей план та зробити [URG.GetNameDef] маріонеткою від імені наших фашистських друзів."
 ARG_socialist_researchers_desc:0 "У міру зростання нашої країни як соціалістичної держави, було б розумно інвестувати в розширення наших національних досліджень. Зрештою, революціонізація та модернізація нашої технології є важливими для зростання нашої нації."
 ARG_south_american_unity:0 "Південноамериканська єдність"
 ARG_the_buenos_aires_conference:0 "Конференція в Буенос-Айресі"
 ARG_the_clean_election_desc:0 "Після десятиліть корупції та шахрайства в політиці [ARG.GetNameDef], «Радикальний громадянський союз» (Unión Cívica Radical) зумів здобути перемогу після енергійної кампанії, яка зосередилася на викритті шахрайства з підробкою бюлетенів, яке було поширеним у «Конкордансії». Наразі ведуться обговорення щодо того, хто очолить партію надалі."
 ARG_unite_the_workers_of_argentina_desc:0 "Якщо ми хочемо змінити [ARG.GetNameDef] на краще, ми повинні переконати пролетаріат нашої нації, що радикальні покращення необхідні, щоб покласти край їхнім стражданням. Давайте об'єднаємо робітників усіх професій та покажемо уряду, що статус-кво має бути припинено!"
 ARG_viva_la_revolucion_desc:0 "Настав час надіслати ультиматум уряду [ARG.GetNameDef] та принести вітри змін, необхідні для перетворення нашої нації на справжню соціалістичну державу. Якщо все піде добре, це закінчиться мирно, і влада перейде з легкістю. Однак завжди є ймовірність, що вони не підуть без бою."
