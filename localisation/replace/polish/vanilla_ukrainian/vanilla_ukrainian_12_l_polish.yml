 SWE_move_the_bus_tt:0 "Переміщує рухому штаб-квартиру [?SWE.GetLeader] у цю область.\n§YЯкщо область буде захоплено, поки штаб-квартира перебуває в ній, лідер країни помре.§!"
 SWE_narvik_crisis_desc:0 "Нарвік є стратегічно важливим як основний експортний шлях для нашої залізної руди в зимові місяці. Щоб забезпечити нашу власну національну безпеку в ці неспокійні часи, регіон має бути переданий під нашу юрисдикцію. І якщо [NOR.GetName] буде ослаблено у процесі тим краще."
