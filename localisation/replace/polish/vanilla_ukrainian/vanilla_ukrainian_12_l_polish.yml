 sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc:0 "Наші інженери внесли значні поліпшення в спеціалізовані стартові рампи, необхідні для розгортання ракет."
 sp_rockets_generic_major_breakthrough_reward_desc:0 "$sp_air_generic_major_breakthrough_reward_desc$"
 sp_rockets_medium_range_ballistic_missile_desc:0 "Балістичні ракети середньої дальності дозволять нам доставляти боєголовку через континент з вражаючою точністю та руйнівним ударом."
 sp_variable_time_fuze_shells_desc:0 "Завдяки адаптації снарядів зі змінним детонатором ми зробили нашу польову артилерію руйнівною для наших супротивників. Снаряди вибухають до того, як досягнуть землі, створюючи таким чином набагато більшу зону ураження."
 spain.3.d:0 "Реакційні та фашистські війська в армії прагнули розбити Республіку одним швидким ударом, та вони не очікували ні спротиву, який вони зустріли у великих містах, ні стрімку мобілізацію робітничих військових організацій. Замість перевороту вони влаштували війну — війну проти прогресу та майбутнього, яке хоче іспанський народ.\n\nІ демократичні, і соціалістичні держави висловлюють підтримку Республіки, та небагато насмілюються допомогти напряму. Ми могли б попросити їх підтримати наші старання, інакше пригноблювачі відберуть і їхні свободу й солідарність."
 special_bonus:0 "Бонус до військ спец. призначення"
 spirit_of_defiance_army_spirit_desc:0 "Народ не можна завоювати, поки він не визнає себе завойованим."
 spr_research_name:0 "Радянські технологічні досягнення"
 spy_fabricate_claim_desc:0 "$SPY|H$ виправдовує претензію на область $STATE|Y$ у складі державі $TARGET|Y$.\nЗавершено на $PROGRESS|G%1$."
 ss_recruitment_alternate.1.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що в Англії є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS."
 ss_tech:0 "Моделі підводних човнів"
 stability.21.h:0 "Ми мусимо дати приклад."
 stability.31.desc:0 "Our swift response has proven very effective. Military police units, supported by local law enforcement and patriotic volunteers, swarmed out in a well-coordinated operation to visit every missing draftee. Most were willing to answer the call when they were informed of the consequences of failing to report for duty. Military High Command has publicly declared that anyone who showed up at their duty station will not be charged with any crime or punished for failing to do so in the past. Still, a number of people have categorically refused to take up arms for their country and have been arrested."
 stability.35.desc:0 "Seeing the severity of the situation, the Military High Command has decided that more drastic measures are required to show that evading one's civic duty to defend their country will not be tolerated. At dawn, military police raided the homes of a number of carefully selected, well known and connected people who have used their influence to allow others to avoid the draft. Still in their nightgowns, they have found themselves conscripted into the military and escorted to the barracks under armed guard, where they will be formed up into a separate unit, to avoid their subversive influence from spreading to other units.\n\nThe news of this has spread quickly, and it appears that most people who until now believed that they could get away with ignoring their draft notice have changed their mind. Recruitment stations across the country report that a growing number of people have come by to ask what exactly the consequences would be if a \"friend\" of theirs who had attempted to avoid the draft would turn themselves in."
