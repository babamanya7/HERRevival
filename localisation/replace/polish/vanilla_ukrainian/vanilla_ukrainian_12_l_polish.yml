 RAJ_litteracy_effort:0 "Зусилля з грамотності"
 RAJ_look_to_the_future_desc:0 "Нам потрібно дивитися в майбутнє, а не в минуле, щоб контролювати цей ціновий хаос. Необхідно було запровадити великий набір стабілізаційних заходів ще вчора."
 RAJ_mechanization_of_the_cavalry:0 "Механізація кавалерії"
 RAJ_military_engineer_services_desc:0 "Військово-інженерні служби є основою військової інфраструктури, від укріплень до ліній постачання. Зміцнення цієї критично важливої галузі забезпечує, що наші сили оснащені дорогами, базами та засобами оборони, необхідними для перемоги в будь-якому конфлікті."
 RAJ_mixed_economy_tt:0 "Отримати §G+3§! ресурси в кожній початковій області, де є більше 6 ресурсів, за кожну досліджену §Yтехнологію розкопок§!"
