 HINT_13_FAC:0 "£factory_item£ §Yx1§!"
 HINT_LOW_SUPPLY_TEXT_2:0 "Ви можете змінити §Yпріоритет моторизації§! для армії, вибравши її та перемикаючи ці три рівні у верхньому лівому кутку. За замовчуванням установлено низький пріоритет, який не використовує £GFX_unit_motorized_icon_small §Yвантажівки§!.\n\nДоступність постачання показується в режимі мапи §YПостачання§!  £GFX_F4£."
 HINT_OFFICER_CORPS_SCREEN_TEXT_1:0 "Це екран §Yофіцерського корпусу§!. Тут Ви призначаєте §Yвище військове командування§!, §Yтеоретиків§!, а також §Yголовнокомандувачів армією§!, §Yфлотом§! й §Yавіацією§!.\n\nВище військове командування та головнокомандувачі надають щоденний £army_experience£ §Yдосвід армії§!, £navy_experience£ §Yдосвід флоту§!, £air_experience£ §Yдосвід авіації§!, а також бонуси до конкретних характеристик, указаних під кожною з гілок."
 HINT_WORLD_TENSION:0 "Підказка: Світова напруженість"
 HOA_foreign_trained_officials:0 "Офіційні особи, навчені за кордоном"
 HOA_promote_countryadjective_nationalism_desc:0 "Люди [ROOT.GetNameDef] більше не терпітимуть свого гноблення з боку іноземних держав. Ми повинні скористатися моментом і прискорити наші плани щодо незалежності."
 HOA_the_adjective_armed_forces:0 "[ROOT.GetAdjective]і збройні сили"
 HOA_the_adjective_armed_forces_desc:0 "Світ стає дедалі нестабільнішим через зростання напруженості між великими державами. Якщо ми хочемо зберегти нашу незалежність, [ROOT.GetAdjective]а армія повинна бути готова до війни."
 HOA_the_capital_school_of_technology_desc:0 "Те, що лише кілька років тому було передовим на полі бою та на заводах, сьогодні часто повністю застаріло. Якщо ми хочемо йти в ногу з розвитком нових технологій, ми повинні інвестувати в освіту наступного покоління."
 HOL_EQUIPMENT_VERSION_11:0 "No. 11"
 HOL_aloof_neutrality_desc:0 "Політика суворого нейтралітету майже півтора століття допомагала Нідерландам уникати конфліктів зі своїми сусідами і, що найважливіше, дозволила не виявитися залученими до Великої війни. В результаті віра населення у свій «захисний талісман» настільки велика, що й нідерландський уряд не наважується знехтувати волею народу і взяти рішучу участь у міжнародній політиці, йому залишається лише вірити в Лігу націй і в міру можливості дистанціюватися від того, що відбувається у світі."
 HOL_benelux_unified_democratic_ADJ:0 "Бенілюкськ"
 HOL_colonial_shipbuilding:0 "Колоніальне кораблебудування"
 HOL_de_jeugdstorm:0 "De Jeugdstorm"
 HOL_fighter_equipment_2:0 "Koolhoven F.K.58"
 HOL_form_the_benelux_bel_tt:0 "Станеться подія §YНідерланди запрошують державу [BEL.GetName] в Бенілюкс§!.\n"
 HOL_fortress_holland_desc:0 "Ми повинні поставити все на Голландську фортецю. Область на північ від великих річок і на захід від Ейсселмееру охоплює значно більшу частину нашого населення та промисловості. Пожертвування рештою країни може дозволити нам протриматися в нашій промислово розвиненій зоні досить довго, щоб більш потужний союзник вчасно прийшов нам на допомогу."
 HOL_give_bernhard_generalship:0 "Зробити Бернарда генералом"
 HOL_imperial_ambitions_desc:0 "Поки наш народ тішиться славою, яка личить нашому статусу імперської держави, все, що залишається, це повернути наші старі колонії Нових Нідерландів на північному сході Сполучених Штатів Америки."
 HOL_join_the_french_desc:0 "Комуністичний рух у Франції стає дедалі успішнішим, і тепер вони вирішили відокремитися від Комінтерну. Оскільки географічно вони набагато ближчі до нас, приєднання до них принесе справі комунізму набагато більше користі, ніж покладатися на далекий Радянський Союз."
 HOL_light_cruiser_2:0 "Клас «De Ruyter»"
 HOL_light_tank_artillery_equipment_2_short:0 "PTG-2"
 HOL_light_tanks_for_the_colonies_tt:0 "У залежності від того, чи Ви обрали зосередитися на модернізації, чи на ліцензуванні, цей фокус надасть одне з переліченого:\n"
 HOL_maintained_trade_neutrality:0 "Збережена торгова нейтральність"
 HOL_nav_bomber_equipment_1:0 "Fokker T.IVa"
 HOL_nav_bomber_equipment_2:0 "Fokker T.VIII"
 HOL_secret_staff_talks_tt:0 "Це зробить можливим отримання §Yоснащення§!, §Yнаступальних§! і §Yоборонних§! бойових бонусів, бонусів до дослідження §Yназемних доктрин§! та £legitimacy §Yлегітимності§! уряду у вигнанні.\n"
 HOL_ship_a_day_sinking_quotas_desc:0 "Навіть якщо ми не можемо повністю захистити Ост-Індію від рішучого нападу, ми не повинні полегшувати це. Наші підводні сили повинні безперервно завдавати ударів по лініях постачання противника, і вони мають бути обладнані для цього, а також очолюватись агресивним та здібним командиром."
 HOL_ship_light_battery_4:0 "120mm/50 W-F Mk 10 SP"
 HOL_ship_torpedo_sub_2:0 "4x 533-мм торпедний апарат"
 HOL_southward_defenses_desc:0 "Ми повинні встановити оборонну лінію вздовж річки Маас, щоби перешкодити будь-якому просуванню на північ через Бельгію. Подальше, остаточне зміцнення нашої берегової оборони має остаточно зруйнувати всякі можливі британські плани висадити експедиційний корпус у наших гаванях."
 HOL_strat_bomber_equipment_3:0 "Pander U"
 HOL_strategic_bombing_defense_desc:0 "Якщо війна прийде до Нідерландів, вона, безумовно, включатиме стратегічні бомбардування в найбільшому масштабі, який тільки можна уявити. Ми повинні розробити нові доктрини, щоб впоратися з цією загрозою, і ми повинні розширити наші континентальні авіабази, щоби забезпечити наявність великих військово-повітряних сил, яких вимагатимуть ці доктрини."
 HON_juan_b_valladares:0 "Хуан Б. Вальядарес"
 HUN_GATHERING_STORM_DESC:0 "Будучи однією з двох половин Австро-угорської імперії, Антанта після Великої війни повелась із Угорщиною як із переможеною. За умовами Тріанонського договору ця держава втратила майже дві третини своїх територій. Мільйони етнічних угорців опинилися поза її кордонами, а економіка Угорщини була знищена. Жорсткі обмеження на переозброєння мусили забезпечити, що Угорщина більше ніколи не нестиме загрози миру в Європі.\n\nАле політичний клімат у Європі змінюється, і настав час виправити помилки минулого та відновити колишню славу нації."
 HUN_arpads_successor_trait:0 "Спадкоємець Арпада"
 HUN_arrow_cross_idea:0 "Стрілчастий хрест"
 HUN_carriers_desc:0 "Лінкори — атавізм старої доктрини. Майбутнє війни на морі за авіаносцями та палубною авіацією, і ми мусимо йти в ногу з прогресом."
 HUN_claim_overlordship_over_slovakia_desc:0 "Залишки Словаччини мусять повернутися до складу Угорщини або безпосередньо, або у вигляді протекторату. Ми висунемо Словаччині ультиматум."
 HUN_demand_a_referendum_desc:0 "Розпад Австро-Угорщини був помилкою. Водночас країни сильніші, і жодна з них не може стати великою без другої. Потрібно змусити австрійців провести референдум щодо мирного об'єднання двох наших держав."
 HUN_elect_a_king:0 "Обрати короля"
 HUN_gyor_program_initiatives_category_desc:0 "Дьорська програма — спосіб розвитку армії бюджетом в один мільярд пенґьо, спрямована на модернізацію наших збройних сил, щоб досягти ініціативи на полі бою якістью армії, нівелювавши значну чисельну перевагу ворога."
