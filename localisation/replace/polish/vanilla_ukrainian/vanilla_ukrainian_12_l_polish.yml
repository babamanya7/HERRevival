 kurdish_achievement_tt:0 "Граючи за Курдистан, утримано всі свої осердні землі"
 land_cruiser_chassis_desc:0 "Велетенське важкоброньоване шасі, спроєктоване для підтримки надважкого озброєння та здатне витримати величезні втрати на полі бою, але з високим споживанням пального й низькою швидкістю через свої величезні розміри."
 landmark_kremlin_desc:0 "Московський Кремль — це укріплений комплекс. У межах комплексу розташований Великий Кремлівський палац, який служив царською резиденцією російського імператора. Кремль виходить на Москву-ріку на південь, собор Василя Блаженного та Червону площу до на сході та Олександрівський сад на заході. Нині він став символом влади держави та її контролю люди."
