 MAN_assertiveness_desc:0 "Японці продовжують правити нами з образливою гордістю. Слід нагадати їм, що ми теж імперія, гідна поваги."
 MAN_banditry_category_desc:0 "Квантунська армія мало зацікавлена в допомозі жителям Маньчжурії, розглядаючи це як військову окупацію, а не розбудову нації. Уряду Маньчжоу-ґо, такому, як він є, японці дали мало ресурсів для підтримки порядку. У цей вакуум влади вливаються всілякі бандити: іноді самозвані «борці за свободу», які вбивають і крадуть в ім'я абстрактних ідеалів, таких як «національне визволення» чи «пролетарський інтернаціоналізм», але частіше без будь-якої висловленої ідеології, яка б маскувала їх зловживання."
 MAN_claim_the_mandate_of_heaven_desc:0 "Наші військові перемоги ясно дають зрозуміти: самі небеса визнали імператора гідним зайняти престол. Перед подібними доказами будь-які сумніви в його легітимності повинні розтанути без сліду."
