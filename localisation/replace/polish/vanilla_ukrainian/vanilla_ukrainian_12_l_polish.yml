 PEACE_SCORE_WILL_RECEIVE_TOTAL:0 "Буде отримано £victory_points $AMOUNT|G$"
 PER_UNIFIED_democratic:0 "Кірський союз"
 PER_anti_gulf_decisions_cat_des:0 "[PER.GetNameDef] намагається підірвати інтереси тих, хто виступає проти них у регіоні Перської затоки. Ми повинні діяти рішуче, перш ніж їхні підступні тактики занадто сильно порушать делікатний баланс сил."
 PER_anti_soviet_idea_desc:0 "Після захоплення нашої території під час вторгнення в Іран настав час відплатити цим воєнним агресорам і повернути те, що по праву належить нам. Ми не зупинимося, доки наші колишні території знову не стануть нашими."
 PER_armored_car_equipment_2:0 "AEC"
 PER_army_shortcut:0 "Армія"
 PER_communist_events.3.a:0 "Ми повинні запобігти цій ескалації!"
 PER_communist_events.6.desc:0 "Незважаючи на велику дипломатичну зарозумілість, [FROM.GetAdjective] сили почали виведення з регіону. Це величезна стратегічна перемога для нашого уряду і була сприйнята багатьма у всьому світі як ознака занепаду колоніалізму."
 PER_communist_shore_defense_desc:0 "Підтримання надійної серії військово-морської оборони вздовж нашого узбережжя значно допоможе стримувати будь-якого потенційного агресора від висадки на наших берегах."
 PER_compliant_subject_idea_desc:0 "Немає перемоги в протистоянні такій силі, як [ROOT.OVERLORD.GetNameDef]. Натомість ми повинні виконувати свою роль як піддані та показати, що ми гідні бути потужним васалом."
 PER_develop_qorkhaneh:0 "Розвивати Корханег"
 PER_educational_reforms_desc:0 "Ми запровадили нові кампанії з ліквідації неграмотності. Ми побудували нові університети. Нарешті настав час для нас запровадити нові освітні реформи, які сприятимуть соціальному прогресу та розвитку наших громадян та вирішуватимуть проблеми раніше нерівних освітніх можливостей."
 PER_emperor_for_people_desc:0 "Мохаммед Реза-шах бажає, щоб його правління було ознакою відновлення зв'язку Імператора зі своїм народом. Замість егоїстичного накопичення багатства для королівської родини, він, навпаки, бажає використати його для покращення життя звичайних громадян [PER.GetNameDef]."
 PER_expand_immortal_legion_tt:0 "Набирає §Yтри§! одиниці §YЛегіону Безсмертних§! у §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_expand_tabriz_masshad:0 "Сполучення Тебріз – Мешхед"
 PER_fascist_attack_turkey_desc:0 "[TUR.GetAdjective] та їхні османські попередники довгий час гризли наші кордони та корумпували нашу культуру, водночас окупуючи землі, які по праву належать нашому народу. Ми повинні виправити цю історичну несправедливість."
 PER_first_warning_flag:0 "Перше попередження про Ісламську революцію"
 PER_force_abdication:0 "Примусити до зречення"
 PER_glory_of_cyrus_desc:0 "З виконанням наших військових цілей та безпечним закріпленням землі під [PER.GetAdjective] суверенітетом, ми принесли нову еру процвітання в [PER.GetNameDef] завдяки наполегливій праці та мужності наших збройних сил. Нарешті [PER.GetNameDef] знову може відповідати славі засновника нашої цивілізації, Кіра Великого. Слава Кіру! Слава шаху!"
 PER_greater_iran:0 "Великий Іран"
 PER_imperial_events.122.t:0 "[ENG.GetNameDefCap] відхиляє нашу пропозицію"
 PER_imperial_events.141.a:0 "Азаді! Ми будемо битися до останнього!"
 PER_imperial_events.192.desc:0 "It is a dark day. Our enemy has decided to continue pushing into our territory despite their losses and despite our demands for peace. Their reluctance to allow us to end the war and give them our resources is disappointing, and we have no choice but to keep fighting."
 PER_imperial_events.200.desc:0 "[SSB_leader.GetLeader] звернувся до [ROOT.GetLeader] із пропозицією підписати взаємний пакт про ненапад, залишивши відкритою перспективу подальшої співпраці в майбутньому. [event_target:SSB_leader.GetAdjective] дипломати наполегливо працювали над своєю пропозицією, детально розповідаючи про спільну історію та інтереси наших двох націй, за якою послідував щирий заклик до миру між братніми націями. Переговори були приємними, але вибір підписувати нам чи ні, зрештою, залишається за нами."
 PER_imperial_events.210.desc:0 "[FROM.GetLeader] написав довгий лист [ROOT.GetLeader], повідомляючи їм про [FROM.GetAdjective] вимоги про передачу деяких прикордонних територій під їхній контроль. Хоча це явно є обурливою спробою зневажити наш суверенітет, це також може означати, що [FROM.GetNameDef] може вдатися до рішучих дій, щоб захопити ці землі, якщо ми відмовимося. Як ми повинні діяти?"
 PER_imperial_events.230.t:0 "Повернення династії Каджарів"
 PER_imperial_expansionism_idea_desc:0 "Настав час показати світу, на що здатна [PER.GetNameDef]. Ми запустили виробничі лінії, ми згуртували народ. Незабаром ми вирушимо на війну за славу та велич!"
 PER_iranian_socialist_revolution_tt:0 "\n§RЯкщо комуністична партія має менше 50% підтримки, шах розпочне проти нас громадянську війну!§!"
 PER_islamic_republic_democratic:0 "Ісламська республіка Іран"
 PER_islamic_revolution_desc:0 "Дні шаха полічені. Мечеті відлунюють закликами до змін, і вулиці більше не під його контролем. Старий лад впаде."
 PER_kur_azr_revolt_mission:0 "Сепаратисти готуються до війни за незалежність"
 PER_legacy_of_gilani:0 "Спадщина Озри Гілані"
 PER_motorized_equipment_0_short:0 "FWD Model B"
 PER_negotiate_with_america:0 "Вести переговори з Америкою"
 PER_our_own_artillery_desc:0 "Тепер у нас є об'єкти, необхідні для ефективного проєктування та будівництва наших власних типів допоміжної артилерії. Тепер нам більше не потрібно покладатися на торгівлю для посилення наших сил. Наші нові гармати проливатимуть вогонь на наших ворогів та забезпечать нашу здатність утримувати лінію в будь-якому конфлікті."
 PER_persian_german_trade:0 "Персько-німецька торговельна палата"
 PER_preemtive_strike_idea:0 "Випереджальний удар"
 PER_preparatory_mobilization:0 "Підготовча мобілізація"
 PER_promote_resistance_levant_desc:0 "Наші зусилля у боротьбі з імперіалістами часто зустрічають жорсткий опір через їхню переважну вогневу міць. Однак не бракує людей, які охоче візьмуть зброю в руки в тилу ворога."
 PER_rapid_industrialization_desc:0 "Модернізація дорівнює індустріалізації. Не можна уникнути реальності того, що ми повинні швидко розширити наш фабричний випуск, якщо хочемо досягти того ж калібру, що й інші великі нації світу."
 PER_revolution_events.1.desc:0 "Сьогодні вранці опозиційні партії сформували коаліцію та, проникнувши в наші військові, взялися за зброю проти нас! Їхні сили готуються йти маршем на комплекс Са'дабад! Ми повинні готуватися до відсічі, щоб захистити суверенітет [PER.GetNameDef]!"
 PER_special_units_division_idea:0 "Дивізія спеціальних підрозділів"
 PER_ssb_events.7.desc:0 "[IRQ.GetNameDefCap] підписав сьогодні законодавчий акт, що відкриває торгівлю через Багдадську залізницю для всіх держав, що підписали Саадабадський пакт. Це дозволить здійснювати широку, легку та дешеву торгівлю з усією Європою та буде перевагою для наших економік."
 PER_stand_our_ground_desc:0 "Страх та занепокоєння ширяться в нашому уряді, оскільки загрози з боку наших сусідів та з-за кордону продовжують чинити непохитний тиск. Ми повинні стояти на своєму, незважаючи ні на що. Настав час запровадити заходи, щоб забезпечити виживання [PER.GetNameDef] у наступному десятилітті."
 PER_state_coring_flag:0 "Інтеграція держави"
 PER_state_local_defensive_dynamic_modifier:0 "Місцеві оборонні процедури"
 PER_teymourtash_married:0 "Теймурташ одружений"
 PER_wether_the_storm:0 "Пережити наближення бурі"
 PHI_aguinaldos_coup_desc:0 "Коли безпосередній хаос захоплення влади почав вщухати, особистості у Виконавчій комісії почали змагатися за контроль. Авторитарні режими потребують чіткої влади для управління ними, і підтримка починає гуртуватися."
 PHI_american_intervention_category:0 "Загроза [USA.GetAdjective]ої інтервенції"
 PHI_american_intervention_declare_war_mission:0 "Американське терпіння"
 PHI_asean_tag_ADJ:0 "Південносхідноазійськ"
 PHI_basic_welfare_desc:0 "Ми несемо відповідальність перед нашими найбільш вразливими громадянами і зобов'язані хоча б частково полегшити їхні труднощі. У нас вже є абсолютно необхідні речі, такі як благодійні установи, проте зі зростанням промисловості на перший план вийшло тяжке становище робітників. Ми створимо Національну економічну раду, яка диктуватиме трудове законодавство та встановить мінімальну заробітну плату."
 PHI_bastion_bataan_bypass_tt:0 "На кордонах регіону Батаан більше не можна будувати §Y$bunker$§!, а в самому Батаані, як і в Дагупані, не можна будувати §Y$coastal_bunker$s§!."
 PHI_battalion_combat_teams_desc:0 "Реалії війни чітко показали, що нам потрібні сили, які будуть більш мобільними та гнучкими, здатними адаптуватися до будь-якої ситуації, що виникає. Вони повинні підтримувати вільнішу ієрархію та мати повноваження для дій малими підрозділами."
 PHI_bourbon_party:0 "Дім Бурбонів"
 PHI_convoys_for_artillery:0 "Звернутися до [FROM.GetNameDef] з пропозицією обміняти наші конвої на артилерію"
 PHI_eisenhower_steps_in_flag:0 "Айзенгауер втрутився"
 PHI_exile_support:0 "Підтримка вигнанців"
 PHI_island_nation_dynamic_modifier:0 "Острівна держава"
 PHI_manila_tag_communism_DEF:0 "Філіппінська народна республіка"
 PHI_maphilindo_tag_fascism_ADJ:0 "Малайськ"
 PHI_mio_trait_use_local_materials:0 "Використання місцевих матеріалів"
 PHI_polynesia_tag_fascism_DEF:0 "Австронезійська імперія"
 PHI_polynesia_tag_war_democratic_ADJ:0 "$PHI_polynesia_tag_democratic_ADJ$"
 PHI_reduce_national_defense_act_cost_tt:0 "Вибір фокусів на шляху §YЗближення зі США§! або §YЗближення з Японією§! зменшить час виконання цього фокуса до мінімум 35 днів."
 PHI_replace_depression_dynamic_modifier_tt:0 "Замінити §Y$PHI_the_great_depression_dynamic_modifier$§! на §Y$PHI_shaken_economy_dynamic_modifier$§!\nЕфективна зміна:"
 PHI_second_republic_tag_communism:0 "Друга Філіппінська народна республіка"
 PHI_second_republic_tag_democratic:0 "Друга Філіппінська республіка"
 PHI_second_republic_tag_war_democratic:0 "$PHI_second_republic_tag_democratic$"
 PHI_sugar_barons_category:0 "Співпраця з цукровими баронами"
 PHI_the_silent_killer:0 "Мовчазний вбивця"
 PHI_unified_naval_command_desc:0 "Військові плани [USA.GetNameDef] за ініціативою [PHI.GetAdjective]ої влади були використані як основа для координації між флотами [ROOT.GetFactionName]."
 PHI_war_plan_orange_desc:0 "Основна передумова Військового плану «Помаранчевий» полягає в тому, що Філіппіни повинні продовжувати служити американською передовою оперативною базою у випадку конфлікту, і тому найважливішим активом для захисту є Манільська затока. Ми повинні виконувати оборонні директиви з цією метою і зосередити нашу оборону навколо цієї стратегічно важливої зони."
 PLAN_COHESION_STRICT_DESC:0 "Дивізії будуть переміщуватися лише з дуже коротких відстаней, щоби зберегти бойову лінію.\n\n§RЦей варіант не бажаний для негустонаселених земель або дуже мінливих ліній фронту: Вам знадобиться пильна увага.§!"
 PLAYER_AI_PREFS_TIMEOUT_DESC:0 "Опис тайм-ауту"
 PLC_UNIFIED_RUS_fascism:0 "Бермондтова співдружність"
 PLU_communism_DEF:0 "Палауська солдатська рада"
 PNG_communism:0 "Сполучені папуаські комуни"
 POLITICS_IDEA_COST:0 "Вартість (£pol_power£): $VALUE|-0$"
 POLITICS_WARGOAL_UNLOCK:0 "Буде відкрито ціль війни $NAME|Y$"
 POL_AUS_autonomy_eu_member:0 "Європейська Польща"
 POL_ROM_join_allies:0 "Приєднатися до Союзників"
 POL_SH_battleship_1:0 "Клас «Piłsudski»"
 POL_a_leftist_sejm_desc:0 "Хоча Польська народна партія є кращою за Санацію, соціал-демократам бракує підвалин для проведення радикальних реформ, необхідних для справжнього визволення пролетаріату Польщі. Лише під безпосереднім керівництвом Комуністичної партії польський народ може назавжди розірвати свої кайдани."
 POL_air_innovations:0 "Інновації в авіації"
 POL_anti_fascist_military:0 "Антифашистська армія"
 POL_anti_germans_abroad_desc:0 "Країни Балтії є нашими братами в цій боротьбі проти більшовизму та нацизму. Хоча вони розпорошені, жалюгідні і слабкі, з сильним польським урядом за спиною, ми все ще можемо перетворити ці країни на функціональні військові машини."
 POL_april_constitution_dem_left_desc:0 "$POL_april_constitution_dem_desc$"
 POL_april_constitution_right:0 "$POL_april_constitution_1$"
 POL_arm_monarchist_militants_desc:0 "Ми знаємо, що за нашими кордонами є люди, які хочуть, щоб [Root.GetLeader] приніс порядок і процвітання їхній нації, як [Root.GetLeader.GetSheHe] приніс для нас! Ми повинні бути готові озброїти цих монархічних бойовиків, щоб вони могли боротися за те, щоб привести свого законного монарха на трон."
 POL_artillery_equipment_1:0 "Armata 75mm wz. 31 St."
 POL_common_organization_of_society:0 "Спільна організація суспільства"
 POL_common_organization_of_society_idea:0 "Спільна організація суспільства"
 POL_consolidate_sanation_government:0 "Консолідувати санаційний уряд"
 POL_cossack_king_desc:0 "У 1918 році князь, козак і воєначальник Павло Бермондт-Авалов отримав інструкцію воювати на боці білих у Росії, але замість цього повернув бермонтівські армії проти Литви та Латвії. Хоча Бермондт був непопулярним і некатолицьким, він мав підтримку німців і перспективу мати за спиною білу російську армію."
 POL_diplomatic_mission_to_GRE:0 "Дипломатична місія в державу [GRE.GetNameDef]"
 POL_double_propagandise_monarchist_sentiment:0 "Пропаганда проти: [From.GetLeader]"
 POL_exile_industries_desc:0 "Коли дім стає далеким спогадом, ми повинні працювати над підготовкою до нашого повернення з подальшим розвитком нашої виробничої бази в еміграції."
 POL_expand_poznan_forts_desc:0 "Познань уже є домом для безлічі бункерів і ключових оборонних споруд, але є ще багато можливостей для вдосконалення. Познань — перша лінія оборони від ворога, і її треба захищати, незважаючи на ціну."
 POL_fighter_equipment_3:0 "PZL.62 Pustułka"
 POL_fulfil_fifth_of_november:0 "Виконати Акт 5 листопада"
 POL_heavy_fighter_equipment_1_short:0 "Wilk"
 POL_hungary_exists_no_vojvodina_tt:0 "$HUN|Y$ $TRIGGER_EXISTS$"
 POL_infantry_equipment_1:0 "Kbsp wz. 38M"
 POL_invite_sweden_desc:0 "Шведи мають інтригуючу концепцію нейтралітету в ці часи зростаючого конфлікту. Можливо, нам вдасться переконати їхніх міністрів закордонних справ у тому, що Міжмор'я є найбільш нейтральним союзом у світі, і що ця взаємна пропозиція оборони є найкращим шансом стримати безпосереднє втручання світових держав."
 POL_irena_anders:0 "Ірена Андерс"
 POL_jan_zumbach:0 "Ян Зумбах"
 POL_josef_unrug:0 "Юзеф Унруґ"
 POL_karol_korytowski:0 "Кароль Коритовський"
 POL_king_michaels_coup:0 "Переворот короля Міхая"
 POL_looming_peasants_strike_mission_desc:0 "Селяни незадоволені, вимагають підвищення зарплати та різкого зниження цін на продукти. Погане залізничне сполучення Польщі на сході робить постачання регіону продовольством й обладнанням дорогим заходом, але за рахунок подальших інвестицій у залізницю ми зможемо забезпечити те, що вимагають селяни."
 POL_marian_kukiel:0 "Маріан Кукєл"
 POL_modern_tank_equipment_1:0 "57TP Ułan"
 POL_modern_tank_equipment_1_short:0 "Ułan"
 POL_naval_bomber_experiments:0 "Експерименти з морськими бомбардувальниками"
 POL_new_military_academy_idea:0 "Нова військова академія"
 POL_privatize_education_desc:0 "Хоча іноземні інвестори були досить корисними для нас, підприємства, які вони створили, було б набагато краще, якби вони залишилися в польських руках. Це засмутить первинних власників, але це необхідний акт патріотизму."
 POL_reach_out_to_underground_state:0 "Зв'язатися з Підпільною державою"
 POL_restore_bermontians_desc:0 "Західноросійська добровольча армія була силою на чолі з Павлом Бермондтом-Аваловим, яка прагнула відновити монархізм і порядок на західних територіях Росії. Хоча Польща зараз є головною турботою Павла, знищення російського комунізму все ще є місією Бермонта, і всі білі росіяни повинні вважати своїм обов'язком боротися за Бермонтівську армію!"
 POL_restore_poland_hungary_desc:0 "Століття тому корони Польщі та Угорщини були об'єднані, і домінування у Східній Європі було забезпечено для цієї нації. Зараз, коли Трансільванія та Нітра знаходяться під польським контролем, єдине, що заважає нам повернути собі спадщину Польсько-Угорщини, — це подальше існування самої Угорщини."
 POL_sanationist_army:0 "Санаційна армія"
 POL_ship_torpedo_sub_2:0 "6x 550-мм торпедний апарат"
 POL_siodemki:0 "Консолідувати конституції"
 POL_social_commonwealth_desc:0 "Хоча будь-які амбіції відновлення Польщі-Литви суперечили б цілям нашої революції, не можна заперечувати, що Польща, Литва та багато колишніх країн-членів Речі Посполитої мають спільну історію та спільних ворогів. У світлі нашої спільної боротьби необхідна нова Річ Посполита, яка ставитиме на перше місце безпеку і визволення своїх робітників при соціалізмі."
 POL_standardisation_of_equipment:0 "Стандартизація озброєння"
 POL_the_long_push_home_desc:0 "Повстання було успішним! Тепер залишається лише протриматися достатньо довго, щоб прибула допомога. З населенням, яке стало свідком абсолютного жаху і жорстокості ворожої окупації, польська армія знову битиметься з енергією людей, які в сорок разів перевищують її чисельність! Цього разу ми не впадемо!"
 POR_arms_purchases_desc:0 "Військова промисловість та військово-морські підприємства держави [Root.GetNameDef] наразі не в змозі виробляти обладнання, необхідне нашим військам. Тому ми повинні шукати можливості укладати угоди з іноземними державами, які можуть надати нам сучасне озброєння та кораблі."
 POR_british_guns_desc:0 "Наша військова промисловість не готова до виробництва сучасної бойової зброї. Ми могли б підписати угоду про їх придбання у Сполученому Королівстві."
 POR_defend_the_borders:0 "Оборона кордонів"
 POR_light_tank_destroyer_equipment_1_short:0 "VAT-1"
 POR_light_tank_equipment_1_short:0 "CDC-1"
 POR_naval_blockade_desc:0 "Португальський уряд запропонував прорвати британську морську блокаду і перевезти вантажі для наших військ. Ця допомога нашим військовим зусиллям може стати ключовою в конфлікті."
 POR_portuguese_trade_minor:0 "Португальська торгівля"
 POR_protect_chinese_civilians_desc:0 "Повідомлення про іноземні військові маневри поблизу португальської території в Макао почали викликати занепокоєння серед цивільного населення. Ми не терпітимемо жодної загрози нашим громадянам чи землі; ми повинні діяти зараз заради нашої славної нації!"
 POR_research_sharing_desc:0 "Наші брати по зброї зі Сполученого Королівства далеко попереду нас у плані технологічних досліджень. Угода про спільне використання досліджень зміцнить нас і, отже, наш альянс."
 POR_ship_torpedo_1:0 "2x 450-мм торпедний апарат"
 POR_stir_monarchist_sentiment_in_brazil_desc:0 "Ми будемо закликати монархічні елементи в Бразилії діяти і поширювати роялістські настрої серед бразильського населення."
 POSITIONING_SHIP_RATIO_PENALTY:0 "Більший флот: $NUM|+%$"
 PRC_28_bolshevik_faction_decision_backstab_tt:0 "§GЗнижує§! вартість рішень категорії §Y$PRC_infiltration_sea_cat$§!"
 PRC_GetAssumeLeaderShipText_NotWentian:0 "Позиція нашого нового Голови має бути беззаперечною. Колишній Голова $PRC_zhang_wentian$ зробив свій внесок у стабілізацію Партії, але зараз настав час [ROOT.GetLeader]."
 PRC_appeal_for_foreign_aid_desc:0 "Запит на бронетехніку від [SOV.GetNameDef] дозволить нам створити бронетанкову гілку в нашій армії, а також вивчити їхні розробки для покращення власних."
 PRC_asian_democratic_union_modifier_modify_tt:0 "Змінює §Y$PRC_asian_democratic_union_modifier$§!:"
 PRC_ban_special_goods_trade_desc:0 "Попри популярність особливих товарів, залежність є серйозною проблемою, яку ми повинні вирішити за допомогою заборони. Навіть якщо така реформа спочатку буде непопулярною, вона має вирішальне значення для того, щоб особливі товари не стали перешкодою для революції, як алкоголь колись у [SOV.GetNameDef]."
 PRC_beijing_capital_name:0 "Пекін"
 PRC_can_be_infiltrated:0 "Можна §Hпроникнути§! ще більше\n"
 PRC_carriers_desc:0 "Розробка авіаносців дозволить нам конкурувати з великими морськими державами. Здатність розгортати повітряні сили будь-де, куди може дістатися наш флот, також покращить нашу здатність проєктувати силу в конфліктах далеко від батьківщини."
 PRC_central_military_commission:0 "Центральна військова комісія"
 PRC_china_medical_university_desc:0 "Гігієна та медична допомога допоможуть нам зберегти армію та поліпшити життя наших громадян. Потрібно розпочати дослідження у цих галузях та передавати знання населенню."
 PRC_conventional_warfare_desc:0 "Хоча ведення затяжної війни на виснаження має свої переваги, воно не позбавлене недоліків. Обмежуючись опортуністичними атаками, ми стаємо вразливими до ударів по наших виробничих потужностях. Важче підняти бойовий дух багатьма малими перемогами, а уникаючи великих битв, ми можемо затягнути конфлікти, які інакше могли б закінчитися швидше."
 PRC_dissent_in_the_united_front_1_tt:0 "Перебуваючи в §Yальянсі§! з [CHI.GetNameWithFlag]:"
 PRC_establish_pla_air_force:0 "Військово-повітряні сили НВАК"
 PRC_fighter_equipment_3_short:0 "J-3"
 PRC_government_of_national_defense:0 "Уряд національної оборони"
 PRC_hq_secretary:0 "Секретар штабу"
 PRC_hsia_tian:0 "Ся Тянь"
 PRC_increase_domestic_production_capacity:0 "Збільшити внутрішнє військове виробництво"
 PRC_infiltrate_ordos:0 "Проникнути в Ордос"
 PRC_initialize_five_year_plan_desc:0 "Мета першої п'ятирічки полягає в тому, щоб покращити виробництво наявної промисловості, перш ніж використовувати надлишок продукції для створення промисловості в абсолютно нових секторах."
 PRC_land_redistribution_desc:0 "Багато століть ті, хто працює на землі, були змушені платити за це людям, у власності яких вона знаходиться. Ситуацію треба міняти."
 PRC_launch_100_regiments_campaign:0 "Наступ ста полків"
 PRC_light_tank_aa_equipment_3:0 "PGZ 41"
 PRC_lin_boqu:0 "Lin Boqu"
 PRC_liu_bocheng:0 "Лю Бочен"
 PRC_mao_shortcut:0 "Політика: Мао"
 PRC_medium_plane_focus:0 "Розробки середньої авіації"
 PRC_modern_tank_aa_equipment_1:0 "PGZ 59"
 PRC_part_of_the_comintern:0 "Частина Комінтерну"
 PRC_party_control_desc:0 "Успіх нашого керівництва тепер повинен дозволити нам взяти під подальший контроль Комуністичну партію Китаю."
 PRC_permit_opium_trade:0 "Дозвіл на торгівлю опіумом"
 PRC_rally_the_28_bolsheviks_desc:0 "Глибокі знання 28 ½ більшовиків, підготовлених у Радянському Союзі як лідерів для уряду та армії, повинні бути використані повною мірою в ці важкі часи."
 PRC_reappoint_jinguang_as_admiral_tt:0 "§RЗняти [PRC_ziao_jingguang.GetName] з посади генерала§!"
 PRC_red_army_reborn_desc:0 "Наша нова база в [622.GetName] має бути зміцнена. Деякі з наших втрат можна компенсувати залученням місцевих добровольців, і ми повинні скласти плани захисту нашого нового дому."
 PRC_sea_mobile_warfare:0 "$PRC_mobile_warfare$"
 PRC_second_thoughts_factions_desc:0 "Оскільки ми обидва перебуваємо у стані війни зі спільним ворогом, настав час відкласти наші розбіжності та об'єднати сили проти агресорів на благо нації."
 PRC_secure_the_peoples_support_desc:0 "Навіть якщо нам бракує контролю над більшою частиною Китаю, ми повинні забезпечити лояльність його народу до нашої справи на випадок, якщо знову вибухне громадянська війна."
 PRC_supreme_chairman_1:0 "Верховний голова"
 PRC_survival_tt:0 "Якщо ми протримаємося пів року, війна перейде у стан стагнації, і наша позиція в Шеньсі збережеться. Якщо нам вдасться захопити Яньань до моменту зупинки наступу, ми зможемо її утримати."
 PRC_tac_bomber_equipment_0_short:0 "H-1"
 PRC_to_serve_the_people_desc:0 "Ми повинні переконатися, що наші війська відчувають, що ми прагнемо боротися за речі, які в інтересах нашого народу. Солдати повинні й надалі шанувати свій обов'язок перед нацією, і так само повинні робити ті, хто не в армії."
 PRC_two_soviets_together_desc:0 "Попри змінений курс, який ми обрали в нашій ідеології, ми все ще маємо сильні ідеологічні зв'язки з [SOV.GetNameDef] і, звичайно, не забули їхню матеріальну та політичну підтримку протягом багатьох років."
