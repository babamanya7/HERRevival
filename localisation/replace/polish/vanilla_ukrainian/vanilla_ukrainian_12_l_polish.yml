 COG_uniao_dos_povos_do_norte_de_angola_desc:0 "Унія Народів Півночі Анголи — це партизанський рух, що зараз діє на півночі Анголи, з метою повернути наші колишні території назад до Королівства Конґо. Було б розумно фінансувати цю групу."
 COLLABORATION_EFFECTS_OTHER_SIDE_TOOLTIP:0 "$OTHER_COUNTRY|H$ має $COLLABORATION|+%.0$ колаборації в державі $COUNTRY|H$. Це знизить поріг капітуляції держави $COUNTRY|H$ на $SURRENDER|+%.0$ і дасть $COMPLIANCE|+%.0$ підпорядкування, коли ворог капітулює. Останнє можна використати для відімкнення додаткових модифікаторів підпорядкування."
