 JAP_nationalize_fujinagata_shipyards_desc:0 "Верфі Фуджінаґата є важливим суднобудівним заводом та виробником залізничних вагонів в Осаці, що має стратегічне значення для наших військових зусиль. Щоб розширити потужності та призвати більше робочої сили для них, ми повинні спробувати націоналізувати ці верфі."
