 SOV_sp_land_flamethrower_tank:0 "Проєкт «ХТ-133»"
 SOV_submarine_3_desc:0 "The Series XIV submarines were large cruising submarines with extended range. They were essentially an improved version of the Series IV Pravda class. These submarines featured heavy armament of both surface guns and torpedoes. They had a long range but only satisfactory seaworthiness."
 SOV_super_heavy_tank_artillery_equipment_1_short:0 "ИСУ-203"
 SOV_super_heavy_tank_equipment_1_short:0 "ИС-7"
 SOV_sway_the_railway_workers_tt:0 "Додасть §Yзалізниці§! та §Yцентри постачання§! навколо штабного регіону, коли §Y[GetSovietCivilWarName]§! почнеться."
 SOV_system_decentralization:0 "Децентралізація системи"
 SOV_the_iron_wall_of_russian_resolve_desc:0 "Цар передбачає будівництво легіонів монструозних знарядь війни, які затьмарять існуючі танки і не матимуть собі рівних на полі бою. Російський народ не переможений... Ба, він непереможний! Ці машини будуть втіленням цієї рішучості, і на них розбиватимуться всі армії, які будуть кинуті на нас."
 SOV_the_right_opposition_desc:0 "Параноїдальне керівництво Сталіна руйнує країну. Його перехід до масової колективізації та жорсткої індустріалізації — ще більше. Треба щось робити, і якнайшвидше. Ті, хто може привести цю країну до слави, загоїти рани, завдані безгосподарністю, і відновити економіку, — це члени правої опозиції на чолі з Бухаріним."
 SOV_the_stalin_constitution_desc:0 "Конституція 1924 року була хорошою спробою організувати державу після Громадянської війни, але вона виконала свою функцію. Потрібна нова конституція. Перш за все, ми високо цінуємо невтомну роботу товариша Сталіна, який зберіг Союз сильним і безпечним, і чий геній і мудрість відіграли важливу роль у просуванні справи комунізму вперед."
 SOV_the_true_tsars_idea_desc:0 "Цар є законним лідером держави [ROOT.GetNameDef]. Об'єднання за царя, а не за іншу людину чи ідеологію, дозволяє нам залучити більше прихильників до нашої справи."
 SOV_the_workers_dictatorship_mission_tt:0 "---\nКоли громадянська війна почнеться, центристи отримають модифікатори від фокусу §Y$SOV_the_workers_dictatorship$§!."
 SOV_ultimatum_to_greece:0 "Ультиматум Греції"
 SOV_ussr_academy_of_sciences_dynamic_modifier_alt:0 "Імперська академія наук"
 SOV_vengeance_for_the_yoke_desc:0 "Багато століть тому монґоли розпочали своє жорстоке вторгнення на руські землі. Вони залишаються єдиним народом, про який можна сказати, що він по-справжньому завоював Русь. Зараз вони можуть здаватися слабкими, але ми повинні зробити так, щоб вони ніколи не повернулися до своєї колишньої сили, щоб ми ніколи більше не відчували татарського ярма."
 SOV_women_pilots_desc:0 "Товаришці Расковій, нашій героїчній льотчиці дальньої авіації, слід дозволити сформувати кілька жіночих авіаполків через її програму 122-ї авіаційної групи."
 SPA_a_methodical_approach:0 "Методичний підхід"
 SPA_activate_galicia_fifth_columnists:0 "Задіяти п'яту колону у Ґалісії"
 SPA_awaiting_the_rebellion:0 "В очікуванні повстання"
 SPA_defenses_against_strategic_bombing_desc:0 "Якщо ми приєднаємося до глобального конфлікту, ми повинні забезпечити належний захист наших міст від неминучого великомасштабного стратегічного бомбардування, якому, без сумніву, нас піддадуть можливі вороги."
 SPA_destroyer_4:0 "Клас «Álava»"
 SPA_domestic_industrial_developments:0 "Розвиток вітчизняної промисловості"
 SPA_establish_pais_vasco_carlist_cell:0 "Створити осередок карлістів у Країні Басків"
 SPA_establish_the_directory_desc:0 "Еміліо Мола, великий архітектор повстання, отримав достатню підтримку від хунти та політичних лідерів Фаланги, щоби розпочати наступний етап свого плану: створення Директорії, яка керуватиме всіма аспектами громадянської війни до того моменту, коли країна була забезпечена."
