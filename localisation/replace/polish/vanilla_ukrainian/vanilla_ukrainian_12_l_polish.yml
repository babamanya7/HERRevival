 INS_minimum_program:0 "Програма-мінімум"
 INS_mohammad_hunsi_tharmin:0 "Мохаммад Тармін"
 INS_national_revolution_dutch_cat_desc:0 "Революціонери в Ост-Індії незаконно проголосили незалежність і за допомогою сил ополчення взяли під контроль деякі регіони. Попри всі наші зусилля, ми не змогли відновити контроль у цих регіонах через величезну кількість присутніх там сил ополчення.\n\nНам потрібно зупинити їх, перш ніж вони захоплять більше міст і ще більше дестабілізують адміністрацію Ост-Індії. Хоча це і крайній захід, військова сила може знадобитися, якщо вони продовжуватимуть діяти подібним чином."
 INS_netherlands_can_remove_autonomy_tt_100:0 "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -100.00§!"
 INS_political_events.5.a:0 "Сутан Шарір довів нашу країну до цього моменту, він вестиме нас далі!"
 INS_quality_over_quantity_desc:0 "Один добре навчений солдат із продуманою стратегією та сучасним спорядженням переможе п'ятьох студентів із пістолетами. Ми маємо надавати пріоритет високоякісним, добре озброєним солдатам і спецпризначенцям, а не мобілізації якомога більшої кількості солдатів."
