 MAN_tsr_independence_war:0 "$MAN_independence_war$"
 MAN_tsr_strengthen_the_manchukuo_imperial_army_desc:0 "Нам потрібна сильна армія, щоб перемогти наших супротивників і зберегти нашу незалежність. Надмірна залежність від Квантунської армії врешті-решт призведе лише до нашого падіння. Щоб мати вільну маньчжурську націю, ми спочатку повинні мати армію."
