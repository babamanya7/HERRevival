 CZE_SLO_bohemia_expansion:0 "Богемія-Словаччина"
 CZE_a_divided_nation_sudentenland_germans_cooperate_desc:0 "Порятунок місцевої промисловості в регіоні [FROM.Getname] швидко поверне політичну підтримку місцевого населення."
 CZE_arms_exports_2_desc:0 "На горизонті замаячила загроза війни, і попит на танки зростає з кожним днем. Державні гарантії кредитів та інші заходи підштовхнуть інші держави до покупки чехословацької техніки та посилять ефект масштабу."
 CZE_bastion_of_liberty_idea:0 "Бастіон свободи"
 CZE_closer_ties_with_the_moderate_germany_parties_desc:0 "Деякі партії Судетської області готові співпрацювати з нашою коаліцією та налагоджувати зв'язки з урядом. Поглибмо ці зв'язки."
 CZE_coalition_building_desc:0 "Коаліція, що виникла після виборів, має досягти більшої єдності серед своїх членів, якщо хоче функціонувати ефективно. Нещодавня відставка Яна Малипетра з посади прем'єр-міністра створила додатковий тиск на Широку коаліцію щодо консолідації підтримки."
 CZE_control_the_associations_desc:0 "[CZE.GetNonIdeologyName] має багато організацій: від людей зі спільною професією до гуртків за інтересами чи спортивних асоціацій. Контролюй їх — і ти контролюватимеш значну частину суспільства."
 CZE_current_skoda_priority_dynamic_local_infantry_focus:0 "$CZE_current_skoda_priority_dynamic_local_start$ §YПіхотний фокус§!"
 CZE_czech_fascism_idea:0 "Чеський фашизм"
 CZE_demand_katowice:0 "Вимагати [762.GetName]"
 CZE_doctrine_bonus_desc:0 "Сила армії — не тільки у зброї; важливу роль відіграють і ефективні доктрини. Військово-технічний інститут висунув кілька пропозицій щодо зміни поточного стану."
 CZE_economic_path_shortcut:0 "Економіка"
 CZE_expand_shanghai_office:0 "Розширити представництво «Шкоди» в Шанхаї"
 CZE_expand_vitkovice_ironworks:0 "Розширити Вітковицький металургійний завод"
 CZE_favor_czechs_2:0 "Промисловість центральних регіонів"
 CZE_fighter_equipment_2:0 "Avia B-135"
 CZE_german_czechoslovak_equipment_design_group_name:0 "Czechoslovak-German Equipment Design Committee"
 CZE_grow_ckd_secondary_facilities:0 "Другорядні підприємства ČKD"
 CZE_grow_tatras_capabilities_desc:0 "Нині невеликий танковий відділ «Татри» має кілька нових виробничих проєктів. Надання їм додаткових ресурсів дозволить продовжувати робити успіхи в проєктуванні бронетехніки."
 CZE_guardian_of_central_europe_idea:0 "Вартовий Центральної Європи"
 CZE_has_a_skoda_no_focus_tt:0 "$CZE_skoda_texticon_ref$ §YФокус важкої промисловості§! є поточним §YПріоритетом «Шкоди»§!"
 CZE_integrate_czech_manufacturers_GER_idea_aat_desc:0 "Завдяки масивній промисловості, яка міститься в Богемії і тепер перебуває під нашим контролем, наші виробники отримають значну вигоду від додаткових промислових ресурсів, які вони приносять у нашу військову промисловість."
 CZE_integrate_sudeten_germans_desc:0 "Розкол серед населення Судетської області нікому не допомагає. Ми повинні прагнути врахувати їхні проблеми і працювати над їх вирішенням. Одне лише це може обеззброїти будь-яких прихильників незалежності, оскільки в їхні заяви про погане поводження буде важко повірити."
 CZE_joint_equipment_designs:0 "Спільні проєкти оснащення"
 CZE_karel_janousek:0 "Карел Яноушек"
 CZE_limited_cooperation_desc:0 "Незважаючи на ідеологічні розбіжності, навіть [SOV.GetNameDef] може визнати нашу цінність як партнера і брати участь у деяких прагматичних угодах, навіть якщо вони засуджують нас у своїх газетах."
 CZE_mio_trait_bata_corporation_taken_flag:0 " $GER_hoesch_facilities_trait_taken_flag$"
 CZE_mio_trait_walter_co_name:0 "Двигуни «$CZE_walter_co$»"
 CZE_mobilize_the_reserves_desc:0 "Напруга на нашому кордоні посилюється. Ми повинні призвати резервістів та заздалегідь відібраних військових спеціалістів відповідно до наших мобілізаційних карток."
 CZE_pressure_romania_desc:0 "[ROM.GetNameDefCap] може становити серйозну загрозу, якщо об'єднається з нашими ворогами, можливо, розірвавши наш зв'язок із [SOV.GetNameDef] або надаючи цінну нафту нашим супротивникам. Завдяки [SOV.GetAdjective]ій підтримці, ми становимо достатню загрозу, щоб потенційно змусити їх приєднатися до нас без війни."
 CZE_prioritize_export_contracts:0 "£BoP_left_texticon Пріоритет експортних контрактів"
 CZE_pro_rearmament_propaganda:0 "Пропаганда переозброєння"
 CZE_proclaim_the_restoration_of_bohemia_desc:0 "З відновленням наших старих кордонів ми тепер можемо повернути свою спадщину та зосередитися на інтеграції наших нових земель."
 CZE_reform_the_naval_detachment:0 "Реформувати військово-морський загін"
 CZE_rehabilitate_the_army_desc:0 "Більшість генералів [CZE.GetAdjective]ої армії є ветеранами Чехословацького легіону, який найбільше відзначився в боротьбі проти червоних у їхній громадянській війні. Буде необхідно забезпечити їхню лояльність до нового [CZE.GetAdjective]ого уряду."
 CZE_reorient_the_broad_coalition_desc:0 "Широка коаліція була провідним блоком у нашому уряді багато років. Різноманітні політичні партії, які вона охоплює, роблять коаліцію дедалі складнішою в управлінні. Переорієнтація міністерської політики давно назріла."
 CZE_restart_naval_gun_production:0 "Відновити виробництво корабельних гармат"
 CZE_return_to_democracy:0 "Повернення до демократії"
