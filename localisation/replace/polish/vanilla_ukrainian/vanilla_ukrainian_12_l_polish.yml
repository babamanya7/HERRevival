 BRA_court_the_military_idea:0 "Схилення військових на наш бік"
 BRA_court_the_military_idea_desc:0 "Ми не зможемо втримати владу без усталеного впливу та ресурсів військових. Принаймні поки що ми повинні намагатися утримати їх на своєму боці."
 BRA_demand_portugese_submission_desc:0 "Землями [POR.GetNonIdeologyName] керують нелегітимні сили, бо лише наш Імператор має дане Богом право правити над ними. Ми вимагатимемо здачі всіх їхніх земель нам, або, якщо необхідно, ми візьмемо їх силою."
 BRA_departamento_de_ordem_politica_e_social_desc:0 "Пропаганди і примусу недостатньо, щоб утримати найвідданіших радикалів або іноземних агентів від шкідливої для держави діяльності. Тому нам потрібна нова таємна поліція, яка розслідуватиме такі загрози."
 BRA_embraer_manufacturer:0 "$BRA_embraer_organization$"
 BRA_end_military_interference:0 "Припинити військове втручання"
 BRA_expand_operation_bolivar_desc:0 "[GER.GetAdjectiveCap]і партнери проводили великомасштабну розвідувальну операцію в Південній Америці, контролюючи як економічну, так і політичну діяльність. Нас попросили допомогти їм у розширенні операції в обмін на посилену розвідувальну співпрацю."
