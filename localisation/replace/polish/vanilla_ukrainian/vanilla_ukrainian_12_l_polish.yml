 RAJ_purna_swaraj_desc:0 "[ENG.GetAdjective] уряд в Індії не лише позбавив [RAJ.GetAdjective] народ його свободи, але й заснований на експлуатації мас та зруйнував Індію економічно, політично, культурно та духовно. Тому Індія має розірвати [ENG.GetAdjective] зв'язок та досягти Пурна Сварадж, або повної незалежності."
