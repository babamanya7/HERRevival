 IRQ_arab_dominance_desc:0 "[IRQ.GetNonIdeologyName] — це різноманітна нація, але лише закріпивши політичне домінування арабської більшості, ми зможемо сподіватися на стабільний уряд."
 IRQ_bakr_sidqi_tt:0 "§Y$IRQ_bakr_sidqi$ наймається як незмінний радник.§!"
 IRQ_basra_military_port_focus_desc:0 "With our renewed interest in the seas and the Persian Gulf, we should ensure that the Basra Military Port is handed over to our administration, and doesn't remain a part of the imperialist forces occupying our nation."
 IRQ_constitutional_monarchy_iraq_democratic:0 "Королівство Ірак"
 IRQ_demand_greater_stake_in_the_company_desc:0 "Ми багато зробили для того, щоб робота нафтових об'єктів була якомога надійнішою для [ENG.GetAdjective]. Таким чином, здається лише справедливим, щоб вони поділилися більшою частиною багатства, яке генерує постачання нафти."
 IRQ_effectivize_the_production_line:0 "Оптимізація виробничих ліній"
 IRQ_encourage_federalism:0 "Заохочувати федералізм"
 IRQ_golden_square_strong_desc:0 "$IRQ_golden_square_desc$"
 IRQ_increase_italian_business_relations_desc:0 "Ми не можемо дозволити собі залишатися повністю залежними від [ENG.GetAdjective] у наших економічних потребах. На щастя, [ITA.GetAdjective]s більш ніж раді допомогти нам у цьому починанні."
 IRQ_minister_of_defense:0 "Міністр оборони"
 IRQ_political_events.11.a:0 "Перемога для арабського світу!"
 IRQ_political_events.27.desc:0 "[FROM.GetNameDefCap] мудро вирішив прийняти членство у федерації. Наші державні службовці та дипломати роблять усі необхідні приготування для швидкого процесу інтеграції."
 IRQ_political_events.31.b:0 "Вони забувають своє місце."
 IRQ_political_events.50.t:0 "[FROM.GetNameDefCap] вимагає Кувейт"
 IRQ_political_events.51.desc:0 "У несподіваному розвитку подій, уряд [FROM.GetNameDef] погодився передати владу над нами [FROM.FROM.GetNameDef]. Багато хто в нашому уряді ставить під сумнів, чи справді ця угода відповідає нашим інтересам, чи нас використовують як пішака у більшій геополітичній грі. Настав час вирішити, чи приймемо ми цю передачу, чи будемо чинити опір нав'язуванню іноземного контролю."
 IRQ_political_events.62.t:0 "[FROM.GetNameDefCap] відхиляє мирну угоду"
 IRQ_political_events.70.desc:0 "Сьогодні раніше в Мосулі $IRQ_bakr_sidqi$ став мішенню замаху, здійсненого капралом Абдуллою аль-Талафарі, коли молодий чоловік наставив пістолет на Сідкі та його праву руку Мухаммада Алі Джавада. Під час спроби Джавад був сильно поранений, але Сідкі вийшов неушкодженим."
 IRQ_protector_of_the_gulf:0 "Захисник Затоки"
 IRQ_reapproachment_with_the_tribes_tt:0 "§YАхмед Барзані§! та §YМустафа Барзані§! стають доступними як §YГенерали§! 3-го рівня."
 IRQ_regent_idea:0 "Регент Абд аль-Ілах"
 IRQ_scavenging:0 "Використовувати тактику збору трофеїв"
 IRQ_taha_al_ahmani:0 "Taha al Ahmani"
 IRQ_united_arab_republic_democratic_ADJ:0 "Арабськ"
 ISR_sp_rockets_long_range_ballistic_missile:0 "Проєкт «Jericho III»"
 ITA_agip:0 "Agip"
 ITA_alcide_de_gasperi:0 "Альчіде де Ґаспері"
 ITA_all_roads_lead_to_rome_desc:0 "У минулому римські легіони славилися своєю швидкістю й ефективністю у будівництві доріг та інфраструктури, необхідних їхнім арміям для ведення бойових дій. Тисячі років по тому логістика та лінії постачання стали ще важливішими під час ведення війни."
 ITA_annibale_bergonzoli:0 "Аннібале Берґондзолі"
 ITA_army_primacy_bba:0 "$ITA_army_primacy$"
 ITA_atlantic_fleet:0 "Атлантичний флот"
 ITA_aviazione_legionaria:0 "Aviazione Legionaria"
 ITA_battaglioni_d_assalto_tt:0 "Відкриває доступ до батальйону підтримки §Y$blackshirt_assault_battalion$§!."
 ITA_battleship_1_desc:0 "Лінкори класу «Conte Di Cavour» були введені в експлуатацію під час Першої світової війни. Вони мали 305-мм гармати Armstrong–Vickers, водотоннажність 23 000 тонн і максимальну швидкість, порівнянну з іншими лінкорами епохи дредноутів. Починаючи з 1933 року, два кораблі класу, що залишилися, зазнали серйозної переробки, покращивши свої розміри, озброєння та параметри, щоб бути на рівні з новими «швидкими» лінкорами того часу."
 ITA_bomber_designs_desc:0 "Завдяки новим конструкціям наших бомбардувальників наші ВПС зможуть підтримувати наші війська на суші та на морі, загрожуючи ворожим військам і їхнім лініям постачання."
 ITA_boost_the_grand_council_of_fascism_desc:0 "Беніто Муссоліні багато зробив для Італії, але він, урешті-решт, досі залишається просто людиною. Якщо він коли-небудь поведе країну манівцями, Велика рада фашизму буде там, щоби зупинити його."
 ITA_carrier_3:0 "Клас «Aquila»"
 ITA_claim_the_montengrin_throne:0 "Висунути претензію на чорногорський престол"
 ITA_claims_on_france_tt:0 "§YВішістська Франція§! існує та контролює §YСавою§! та §YКорсику§!"
 ITA_cooperate_with_moderates:0 "Співпрацювати з помірними"
 ITA_cruiser_submarines_desc:0 "Щоб атакувати морські шляхи ворога за межами Середземного моря, нам потрібні підводні човни далекої дії, здатні мандрувати океанами. Надання подальшої підтримки нашій широкій програмі створення підводних човнів після Великої війни, котра значною мірою ґрунтується на роботі інженерів Кавалліні та Бернардіса, допоможе нам досягти цієї мети."
 ITA_demand_ticino:0 "Вимогти Тічіно"
 ITA_destroyer_3:0 "Клас «Ciclone»"
 ITA_develop_somaliland:0 "Розвиток Сомаліленду"
 ITA_dino_grandi_focus_desc:0 "Нам потрібен хтось дипломатично підкований, хто не боїться реорганізувати старі інституції, якщо ми хочемо процвітати. Діно Ґранді працював міністром закордонних справ і реформував дипломатичні класи, відкривши їх для інших людей, окрім дворян. Він не ухиляється від проведення необхідних реформ і підштовхує Італію до нового і світлого майбутнього!"
 ITA_divino_duce_2:0 "$ITA_divino_duce_1$"
 ITA_divisioni_alpine:0 "Divisioni Alpine"
 ITA_extraction_industry:0 "Видобувна промисловість"
 ITA_fausto_gullo:0 "Фаусто Ґулло"
 ITA_fighter_equipment_3_short:0 "G.55 Centauro"
 ITA_fiocchi_munizioni_desc:0 "«Fiocchi» вже давно постачає наші збройні сили високоякіснимим боєприпасами. Стабільне постачання набоїв є життєво важливим у майбутніх війнах, тому ми мусимо переконатися, що продукція компанії «Fiocchi» відповідає поставленим завданням."
 ITA_gappisti_ns_desc:0 "Наші невеликі партизанські загони наносять сильний удар по ворогу в тилу, деморалізують його і підсилюють опір місцевого населення."
 ITA_hamid_idris_awate:0 "Хамід Ідріс Ауате"
 ITA_heavy_tank_equipment_3_short:0 "P43"
 ITA_il_vento_aureo:0 "Il vento aureo"
 ITA_increase_production_desc:0 "Індустріальна війна вимагає насамперед однієї речі: маси. Маси снарядів, маси гвинтівок, маси літаків. Найважливіше — мати більше речей, ніж у супротивника."
 ITA_independence_rsi_desc:0 "$ITA_independence_rds_desc$"
 ITA_infantry_equipment_0_short:0 "Carcano M91"
 ITA_intensify_torpedo_manufacturing_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$\n$MODIFIER_NAVAL_STRIKE_ATTACK$: §G+5%§!\n$MODIFIER_NAVY_SUBMARINE_ATTACK_FACTOR$: §G+5.00%§!\n$MODIFIER_CONVOY_RAIDING_EFFICIENCY_FACTOR$: §G+5.00%§!\n\n"
 ITA_italian_socialism_desc:0 "Перед нами відкривається шлях до соціалізму. Настав час стати на нього з рішучістю, щоби досягти справедливого суспільства в межах наших кордонів і міжнародного статусу, на який Італійська республіка заслуговує за їх межами."
 ITA_light_cruiser_3_desc:0 "Легкі крейсери «Capitani Romani» по суті були спроєктовані для того, щоб обігнати та перевершити за озброєнням нові великі французькі есмінці кінця 1930-х років. Наприкінці 1939 року було замовлено дванадцять корпусів, але до італійського перемир'я 1943 року було побудовано лише три. Вони мали легке бронювання і водотоннажність лише 3700 тонн, але були досить швидкісними. На них було встановлено вісім 135-мм гармат OTO/Ansaldo."
 ITA_litoranea_balbo_alt:0 "Litoranea Libica"
 ITA_military_industry_dynamic_modifier_arty_tt:0 "§Y$artillery_equipment$§!: $production_cost_tt$ §G-10.00%§!\n§Y$anti_tank_equipment$§!: $production_cost_tt$ §G-10.00%§!\n§Y$anti_air_equipment$§!: $production_cost_tt$ §G-10.00%§!\n"
 ITA_milizia_coloniale_desc:0 "Ми мусимо посилити та розширити наші фашистські ополчення — чорносорочників — за рахунок призовників із колоній, лояльних до нашого режиму. Вербування не лише серед італійських колоністів, але й серед місцевого населення дозволить нам значно збільшити їхню чисельність."
 ITA_milizia_marittima_di_artiglieria:0 "Milizia Marittima di Artiglieria"
 ITA_modernized_army:0 "Модернізована армія"
 ITA_moschettieri_del_duce_desc:0 "[GetAppropriateMoschetieridelDuceDesc]"
 ITA_mussolini_resigned_minister_of_justice_position_flag:0 "Минуло §Y365 днів§! відтоді, як §Y[ROOT.ITA_benito_mussolini.GetName]§! залишив посаду в Міністерстві юстиції\n(наразі минуло [?ITA_mussolini_resigned_minister_of_justice_position_flag:days|Y0])"
 ITA_nav_bomber_equipment_2_short:0 "SM.84"
 ITA_naval_cooperation_program_research_group_desc:0 "Спільна програма технологічного розвитку та досліджень, очолювана італійськими фахівцями."
 ITA_new_colonial_policies_desc:0 "Надто довго фашистський режим жорстоко поводився з місцевим населенням у колоніях. Настав час переглянути нашу колоніальну політику, надавши певну автономію цим регіонам і виправивши несправедливість, заподіяну в минулому."
 ITA_new_colonial_policies_pp_from_released_colonies_tt:0 "\nМи отримаємо §G+15§! од. £pol_power політичної влади за кожну звільнену колонію (щонайбільше §Y200§!)."
 ITA_novus_ordo_irregular_troops_tt:0 "Створити §Y5 піхотні§! дивізії."
 ITA_officers_of_the_service_role_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$\n$MODIFIER_AIR_ACCIDENTS$: §G-10.0%§!\n$MODIFIER_AIR_NIGHT_PENALTY$: §G-5.00%§!\n$MODIFIER_AIR_WEATHER_PENALTY$: §G-5.00%§!\n\n"
 ITA_organize_strikes_in_the_north:0 "Зорганізувати страйки на півночі"
 ITA_polizia_dell_africa_italiana:0 "Polizia dell'Africa Italiana"
 ITA_production_lines_factories_tt:0 "Додасть §Y2 комірки для будівництва§! та §Y2 військові заводи§! в щонайбільше двох осердних областях."
 ITA_pugno_alzato_wargoals_tt:0 "Отримає ціль війни §Y$topple_government$§! проти §Yкожної фашистської країни або великої країни§!."
 ITA_raid_category_fluff_text_paratrooper_raids:0 "§LАрдіті§!"
 ITA_revoke_the_acerbo_law_desc:0 "Закон Ачербо дав Муссоліні та його фашистській партії міцний контроль над Італією, якого вони так прагнули. Настав час скасувати цей закон, щоби запобігти повторенню подібного в майбутньому."
 ITA_robert_longhi:0 "Роберт Лонґі"
 ITA_sandro_pertini:0 "Сандро Пертіні"
 ITA_self_propelled_guns_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$ITA_self_propelled_guns_dynamic_modifier_tt$\n"
 ITA_south_american_alliances_desc:0 "Настав час розширити межі нашого альянсу. Ми звернемося до латиноамериканських країн і переконаємо їх у важливості формування міцного альянсу проти численних загроз, які оточують нас усіх."
 ITA_sp_land_flamethrower_tank:0 "Lancia Fiamme"
 ITA_spanish_italian_faction:0 "Іспано-італійський альянс"
 ITA_strat_bomber_equipment_3_short:0 "P.133"
 ITA_strengthened_the_airforce_desc:0 "ВПС Італії знову є одним із найвеличніших повітряних флотів у світі. Нещодавно навчені пілоти прагнуть продемонструвати, наскільки грандіозні повітряні сили ми маємо зараз."
 ITA_strengthened_the_army:0 "Зміцнена армія"
 ITA_struggle_in_ethiopia_desc:0 "Наш прогрес в Ефіопії значно відстає від графіка, але ми не можемо дозволити, щоби така незначна невдача деморалізувала нас. Італійська зброя і фашистська система переможуть — чого би це не коштувало."
 ITA_the_holy_lands:0 "Святі Землі"
 ITA_the_italian_confederation:0 "Італійська конфедерація"
 ITA_the_path_to_progress_aid_effects_tt:0 "Ми отримаємо §Yоснащення§! та тимчасовий бонус до §Yвиробництва споживчих товарів§! від кожної країни, яка підтримає нас."
 IVO_neutrality_DEF:0 "Кот-д'Івуар"
 JAG_nanshin_ron_focus_days_tt:0 "Поточна кількість днів: [?JAP_nanshin_ron_started_flag:days|Y0]"
 JAM_DEF:0 "Ямайка"
 JAP_EQUIPMENT_VERSION_5:0 "Kai E"
 JAP_VICTORY_POINTS_11977:0 "Тайден"
 JAP_a_worthy_succssor_of_meiji_desc:0 "Тепер, коли відбулося щось схоже на другу Реставрацію Мейджі, наш Імператор знову став наймогутнішою людиною в країні. Можливо, було б розумно відповідати ідеалам цієї національної революції та спробувати модернізувати нашу промисловість і науку, щоб принести новий [ROOT.GetAdjective]ий ренесанс."
 JAP_anti_tank_equipment_3_short:0 "47-мм гармата, тип 1"
 JAP_armored_car_at_equipment:0 "Type 4 Armored Car"
 JAP_army_broadcasting_militarist_propaganda_2_mission:0 "Армія транслює антиурядову пропаганду"
 JAP_army_ensuring_loyalty_within_the_regiments_mission_tt:0 "Більша частина §YІмперської армії§! перейде на бік IJA у випадку §YГромадянської війни§!"
 JAP_army_recruiting_more_conscripts_mission:0 "Армія набирає більше призовників"
 JAP_big_influence_gain:0 "отримує §Yзначну§! кількість §YВпливу§!"
 JAP_bin_akao:0 "Бін Акао"
 JAP_cast_the_die_desc:0 "Наша політична та військова база досить міцна. Настав час кинути виклик долі!"
 JAP_central_agricultural_association_desc:0 "Наші численні розрізнені сільськогосподарські організації потрібно об'єднати в одну, якщо ми хочемо вирішити проблеми у наших ланцюгах постачання. Щоб забезпечити це, ми повинні доручити Сенґоку Котаро заснувати Центральну сільськогосподарську асоціацію, як це передбачено Законом про сільськогосподарські організації."
 JAP_closer_ties_with_the_usa:0 "Тісніші зв'язки зі США"
 JAP_communist_core_asian_state:0 "Інтегрувати §Y[FROM.GetName]§!"
 JAP_construct_the_sui_ho_dam:0 "Побудувати греблю Суйхо"
 JAP_create_a_manchurian_imperial_air_force_desc:0 "Ключем до перемоги у цій війні буде перевага у повітрі. Якщо [MAN.GetNameDef] отримає власні ВПС, то ситуація у повітрі відчутно зміниться на нашу користь."
 JAP_develop_west_papuan_oil_deposits:0 "Prospect the West Papuan Oil Fields"
