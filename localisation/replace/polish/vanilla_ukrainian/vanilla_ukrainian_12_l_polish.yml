 scientist_trait_artillery_specialist_desc:0 "Фахівець із артилерійських систем із досвідом вдосконалення вогневих засобів великої дальності та великокаліберних гармат."
 scientist_trait_nuclear_warfare_expert_desc:0 "Експерт із практичного застосування ядерної фізики до розробки зброї, спеціалізується на теорії, що лежить в основі розробки атомної бомби."
 scientist_trait_surface_ship_specialist_desc:0 "Спеціалізується на проєктуванні, розробці та розгортанні великих надводних військових кораблів, а також на дослідженні нових технологій для оснащення військових суден."
 scope_SHX_GetNameDef:0 "[scope_SHX.GetNameDefCap]"
 screening_efficiency_info:0 "§HЕфективність прикриття§!\n\nВисока §Yефективність прикриття§! захищає ваші §Yосновні кораблі§! від ворожих торпед. Охорону авіаносців забезпечують основні кораблі та кораблі прикриття. Охорону основних кораблів забезпечують лише кораблі прикриття.\n"
