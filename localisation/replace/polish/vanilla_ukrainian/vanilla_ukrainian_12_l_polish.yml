 SPR_secure_the_guardia_de_asalto_mission_tt:0 "Коли почнеться громадянська війна, Ви отримаєте 6 погано тренованих дивізій із §Y3§! батальйонами §Yпіхоти§!. Республіканці отримають 3 треновані дивізії з §Y6§! батальйонами §Yпіхоти§!.\n"
 SPR_soviet_industrial_aid_desc:0 "Одні лише поставки зброї не заповнять квоти, необхідні нашим фронтовим військам. Радянська допомога в розширенні нашої вітчизняної промисловості цілком може дозволити нам компенсувати цю різницю на даний момент і, можливо, навіть досягти повного самозабезпечення з часом."
