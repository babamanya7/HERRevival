 SPR_military_plot_republicans_desc:0 "До нас дійшли чутки про зловісну змову з метою повалення уряду, і, незважаючи на наш нещодавній досвід подібних спроб перевороту, ми жахливо не готові до чергової спроби. Ми мусимо перешкоджати їхнім планам, де тільки можемо, та затримати їх, щоби дати собі час підготуватися."
