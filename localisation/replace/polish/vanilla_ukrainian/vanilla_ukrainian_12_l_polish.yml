 JAP_modern_bombers_desc:0 "Модернізовані сили тактичних бомбардувальників є ключовими для підтримки наших військових на полі бою. Тому ми повинні наказати як армії, так і флоту розпочати розробку літаків, здатних надавати тактичну підтримку нашим наземним силам."
