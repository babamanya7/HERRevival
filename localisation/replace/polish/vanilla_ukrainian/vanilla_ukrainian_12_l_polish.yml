 SOV_organize_wreckers_tt:0 "Відмикає §Yрішення§! саботувати промисловість під час §Y[GetSovietCivilWarName]§!."
 SOV_pacify_the_rim_desc:0 "Ми не можемо допустити повторення війни 1905 року, коли наші далекосхідні володіння були атаковані і виявилися жахливо непідготовленими до наступу. Ми повинні інвестувати в місцеву інфраструктуру, щоб мати можливість швидко перекидати війська, якщо виникне потреба."
