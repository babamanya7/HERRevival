 CHL_privatize_national_industries_desc:0 "Національна промисловість наразі є слабкою та неефективною, і ми мусимо прагнути передати її в руки приватних груп, які зможуть краще управляти кожним місцевим промисловим комплексом."
 CHL_push_past_the_darien_gap_desc:0 "Дар'єнський розрив між Колумбією і Панамою може бути важко перетнути, але це необхідно, якщо ми хочемо дістатися кордону Америки й урешті-решт звільнити тамтешніх братів."
 CHL_recall_manuel_santiago_pedregal_to_active_service:0 "Повернути Мануеля Сантьяго Кончу Педрегала на службу"
 CHL_revoke_the_treaty_of_lima:0 "Скасувати Лімський договір"
 CHL_sponsor_anti_colonialist_rebellions_desc:0 "Є люди, які думають так само, як ми, але не мають самовизначення, щоб контролювати і керувати власним майбутнім. Ми мусимо звільнити їх з лап колоніальних держав."
 CHL_state_catholicism_desc:0 "Стара ліберальна влада відокремила католицьку церкву від держави, що ми зараз вважаємо тяжким гріхом. Ми мусимо негайно виправити цю велику помилку!"
 CHL_state_catholicism_idea:0 "Державний католицизм"
 CHL_strengthen_control_desc:0 "Ми мусимо повернути контроль над провінціями від слабкодухих повстанців, які не бачать реальність такою, якою вона є, борючись проти великого режиму Антуана."
 CHL_submarine_1_desc:0 "These submarines were a set of six British H-class, or Holland 602, submarines built in the U.K. and transferred to Chile shortly after World War I in return for submarines interred during the war. The ships were built between 1915 and 1918. They displaced over 360 tons, had a diving depth of 30m, and were armed with four 450mm torpedo tubes."
 CHL_the_grand_chilean_armada_desc:0 "Завдяки нещодавній зміні тональності в держави [CHL.GetNameDef] розпочався процес зміцнення нашої іспанської спадщини шляхом створення власної Великої армади."
