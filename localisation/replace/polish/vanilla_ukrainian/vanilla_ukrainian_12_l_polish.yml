 USA_curtis_lemay:0 "Кертіс ЛеМей"
 USA_dismiss_volunteers:0 "Розпустити добровольців"
 USA_focus_on_europe_desc:0 "Великі держави Європи знову мають намір втягнути всю планету у світову війну. Але цього разу ми не сидітимемо і чекатимемо, поки до нас дійдуть її відлуння. Ми мусимо бути готові активно втручатися в ситуацію, якщо хтось у Європі посміє порушити мир."
 USA_guarantee_the_american_dream:0 "Гарантувати «американську мрію»"
 USA_invite_foreign_support:0 "Запросити іноземну підтримку"
 USA_jet_tac_bomber_equipment_2_short:0 "XB-51"
 USA_labour_management_relations_act_desc:0 "Підприємствам усієї Америки загрожують дії профспілок: страйки, організовані акції, вимоги підвищити заробітну плату. Ми мусимо покінчити з цим."
