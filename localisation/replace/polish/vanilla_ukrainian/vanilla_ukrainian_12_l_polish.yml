 RAJ_unite_the_subcontinent:0 "Об'єднати субконтинент"
 RAJ_womens_auxiliary_air_force_desc:0 "Жіночий допоміжний повітряний корпус розширює можливості жінок для підтримки повітряних операцій, від логістики до зв'язку. Інтегруючи їхні таланти, ми зміцнюємо наші повітряні сили та доводимо, що кожен індієць може зробити внесок у забезпечення безпеки неба над нацією."
 RAJ_womens_royal_indian_naval_service_desc:0 "Ми створимо Жіночу королівську [ROOT.GetAdjective] військово-морську службу, що дозволить жінкам виконувати роль у флоті."
