 NOR_claims_on_faroe_islands_desc_PAWJ:0 "Наш благородний камергер заплатить кровну ціну, щоби забезпечити їхнє повернення до нас."
 NOR_crush_stalin_desc:0 "Роками Йосип Сталін перекручував слова Маркса та Леніна заради власної вигоди, фальшиво засуджував своїх ворогів у судах кенгуру та жертвував незліченною кількістю життів, переслідуючи своє его. Ми повинні зупинити його, перш ніж він знищить майбутнє пролетаріату."
 NOR_demand_king_haakons_rise_to_power_desc:0 "Завдяки підбадьорливій промові барона Ведель-Ярлсберґа люди [NOR.GetName] вимагають вольової монархії, яка перейме правління урядом. Єдина проблема полягає в тому, що сам король Гокон VII постійно наголошує, що Країною мають керувати представники її народу. Здається, короля потрібно трохи переконати."
