 ICE_anti_capitalist_propaganda_desc:0 "Що капіталізм коли-небудь зробив для нас? Так, він, можливо, приніс незначне процвітання нації, але він також привів нас до кризи, в якій ця країна зараз перебуває. Зважаючи на надмірну довіру до ліберальної демократії та готовність наших володарів давати нам лише недоїдки, має бути зрозуміло, що майбутнє має бути десь в іншому місці."
