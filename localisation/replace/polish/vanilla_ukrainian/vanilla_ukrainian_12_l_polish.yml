 bftb_bulgaria_british_influence.1.t:0 "[BUL.GetAdjectiveCap]ий уряд шукає у нас захисту"
 bftb_bulgaria_equipment_purchases.2.a:0 "Закупити моторизовану піхоту"
 bftb_bulgaria_equipment_purchases.4.c_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_tactical_bomber]§! од. §Yтактичних бомбардувальників§!"
 bftb_bulgaria_factions.20.t:0 "Страйк робітників"
 bftb_bulgaria_factions.39.desc:0 "В останні кілька тижнів поліція відловлювала залишки Землеробського національного союзу, який, втративши керівництво після недавньої черги арештів, помітно послабшав і втратив колишній запал.\nМожна впевнено заявити, що Землеробського національного союзу в державі [ROOT.GetNameDef] більше нема, і від цього наша країна та уряд тільки виграють."
 bftb_bulgaria_factions.55.t:0 "Захоплення лідерів «Звена»"
 bftb_bulgaria_factions.61.t:0 "Широкі соціалісти репресовані"
 bftb_bulgaria_factions.75.a:0 "Хтось поплатиться за цей провал!"
 bftb_bulgaria_factions.81.t:0 "Націонал-соціалістичний рух репресований"
 bftb_bulgaria_fate_of_the_balkans.10.t:0 "[BUL.GetNameDefCap] змушує державу [FROM.GetNameDef] вступити до альянсу [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.9.desc:0 "[FROM.GetAdjectiveCap]ий уряд раптово вирішив, що [GetBulgarianLeader] — людина, з якою можна сперечатися. [FROM.GetLeader] публічно оголошує, що відмовляється приймати вимоги [BUL.GetAdjective]ого уряду. Це сміливий крок, який підтримує [FROM.GetAdjective]а більшість, але, як не крути, це прояв крайньої безвідповідальності — [FROM.GetAdjective]ого народу не обійтися без нашого захисту у майбутньому конфлікті, а після такої витівки [GetBulgarianLeader] подумує взагалі виключити державу з альянсу [BUL.GetFactionName]."
 bftb_bulgaria_fatherland_front.2.desc_no_support:0 ""
 bftb_bulgaria_german_influence.4.desc_regency_council:0 "[ROOT.GetAdjective]а регентська рада"
 bftb_bulgaria_german_influence.4.t:0 "[GER.GetLeader] вимагає заміни Кьосеіванова"
 bftb_bulgaria_rearmament.9.desc_reason_war:0 ", через військовий конфлікт, в який їх втягнули, [BUL.GetNameDef] негайно почне переозброєння для збереження національної незалежності та свободи свого народу"
 bftb_bulgaria_scw_volunteers.1.t:0 "[ROOT.GetAdjectiveCap]і добровольці повернулися з Іспанії"
 bftb_bulgaria_soviet_influence.1.b:0 "В даний час такий договір не в наших інтересах."
 bftb_bulgaria_soviet_influence.5.desc:0 "Після надзвичайно напруженої розмови і лютої суперечки з членами [FROM.GetAdjective]ого уряду [FROM.GetLeader] нарешті поступається нашому тиску, і [FROM.GetNameDef] приєднується до альянсу, нашого блоку опору фашизму, імперіалізму та капіталізму."
 bftb_bulgaria_tsar_boris.1.desc_extra_success:0 "Царський візит до міста [GetDestinationName] став повним успіхом! Після завершення ходи до ратуші на зустріч з мером, цар вирішив прогулятися одним із скромних районів міста [GetDestinationName], щоби поспілкуватися з народом.\nГромадяни не могли зустріти Боріса тепліше. Всі були раді бачити свого правителя, який блукає вулицями, і багато хто з радістю обдаровував царя скромними подарунками, від квіткових вінків і місцевих продуктів до невеликих дерев'яних і залізних виробів.\n\nЧи сколихнуло це щире і скромне вітання щось усередині царя чи ні — невідомо, але правда в тому, що з цієї нагоди, замість приватних прийомів і ексклюзивних вечірок в саду, цар вирішив улаштувати велике народне свято, яким могли би насолодитися всі бажаючі. Годі казати, жителі міста [GetDestinationName] були в захваті від цієї ідеї, і всі повернулися додому пізно та дуже задоволеними після заходу."
 bftb_bulgaria_yugoslavian_influence.2.t:0 "[FROM.GetNameDefCap] підписує договір про вічну дружбу"
 bftb_greece.166.a:0 "Ja, ми інвестуємо!"
 bftb_greece.169.t:0 "[FROM.GetAdjectiveCap]і інвестори вкладають кошти!"
 bftb_greece.170.a:0 "Можливо, в інший раз."
 bftb_greece.186.b:0 "Можливо, в майбутньому ми погодилися б, але не зараз."
 bftb_greece.186.t:0 "[FROM.GetAdjectiveCap]і дипломати сподіваються утихомирити [ROOT.GetAdjective]і амбіції у Середземномор'ї"
 bftb_greece.2.desc:0 "Греки заполонили вулиці міст: вони радіють тому, що армія вирішила завадити монархістам впливати на результати виборів. Венізелісти отримали мандат на владу, повернувшись зі свого закордонного вигнання, але на них чекає сизіфів праця з об'єднання розрізненої країни, яка не забула військову катастрофу, в яку венізелісти втягнули її в 1919 року. Крім того, залишається питання, як венізелісти надійдуть із захопленим грецьким монархом. У будь-якому випадку Грецію чекають цікаві часи..."
 bftb_greece.42.a:0 "Ми переможемо! За революцію!"
 bftb_greece.42.t:0 "Битва за Босфор почалася!"
 bftb_greece.46.t:0 "[FROM.GetAdjectiveCap]і війська відбивають наш штурм!"
 bftb_news.16.c:0 "Чи це означає, що [BUL.GetNameDef] вступить до альянсу [ENG.GetFactionName]?"
 bftb_news.2.desc:0 "Цього ранку [BUL.GetAdjective]ий лідер [BUL.GetLeader] відкрито заявив, що уряд почне переговори з Іваном Міхайловим, одним із керівників Внутрішньої македонської революційної організації, про припинення збройних зіткнень між ВМРО та [BUL.GetAdjective]ою владою. За словами міністра внутрішніх справ, держава [BUL.GetNameDef] повинна співпрацювати з цією організацією, щоби звільнити численних македонців, які проживають у державах [YUG.GetNameDef] і [GRE.GetNameDef]. Ця гучна заява може легко розпалити конфлікти на Балканах і збільшити напруженість між великими державами, які мають інтереси у цьому регіоні..."
 bftb_news.202.b:0 "Що ще нам було робити?"
 bftb_news.203.b:0 "Ну давайте!"
 bftb_turkey.116.t:0 "В області [TUR_fundamentalist_state.GetName] стався напад партизанів"
 bftb_turkey.126.b:0 "Ми не будемо укладати угоду з дияволом."
 bftb_turkey.18.a:0 "Судити їх усіх публічно і покарати по всій строгості закону!"
 bftb_turkey.18.t:0 "Розкрита змова щодо фальсифікації результатів виборів у сільських регіонах"
 bftb_turkey.2.a:0 "Тепер чекаємо відповідь держави [SOV.GetNameDef]"
 bftb_turkey.2.desc:0 "[ENG.GetLeader] випускає заяву, в якій говориться, що [ENG.GetNameDef] має намір допомогти нам повернути контроль над своїми протоками. Підтримка держави [ENG.GetNameDef] багато для нас означає і значно посилить нашу легітимність на світовій арені."
 bftb_turkey.34.desc:0 "[FROM.GetAdjectiveCap]а влада повернула нам острови Онікі в обмін на ексклюзивні права на ресурси в області [342.GetName]. Офіційні особи приватно висловили своє невдоволення таким неприкритим випадком свідомого колоніалізму в області [342.GetName], але багато хто з голосів був заглушений загальним приємним хвилюванням з приводу анексії нової провінції держави [TUR.GetNameDef]. Скарги будуть почуті і розібрані [TUR.GetAdjective]им урядом. На архіпелазі тим часом поширювалася нова методичка, в якій всіляко звеличувався історичний та етнічний зв'язок островів з державою [TUR.GetNameDef]."
 bftb_turkey.47.t:0 "[FROM.GetNameDefCap] висловлює стурбованість обороною затоки"
 bftb_turkey.65.desc:0 "Нам стало відомо, що [FROM.GetNameDef] не приєднуватиметься до альянсу [ROOT.GetFactionName]. [ROOT.GetAdjective] представники розчаровані і неабияк стурбовані можливими наслідками для майбутнього Середземномор'я. [ROOT.GetLeader] у приватній бесіді попроси[ROOT.GetLeader.GetVerbGendEndA_RU] уряд прискорити процес прийняття до альянсу нових учасників, щоб утворити помітний блок, який міг би протидіяти всякому можливому прояву [FROM.GetAdjective]ого іредентизму."
 bftb_turkey.67.b:0 "Наше звільнення можливе лише завдяки фашизму."
 bftb_turkey.76.t:0 "[ENG.GetAdjective] представники здаються нам!"
 bftb_turkey.80.a:0 "Відмінний день для збереження світу."
 bftb_turkey.84.b:0 "Ми демократично голосуємо за те, щоби покликати на допомогу!"
 bomber_command_focus_desc:0 "Як завжди казав Джуліо Дуе: «Бомбардувальник завжди прорветься!» Незважаючи на прогрес у радіолокаційних технологіях і засобах ППО, ми мусимо приділяти першочергову увагу розробці кращих бомбардувальників."
