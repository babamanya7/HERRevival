 china.100.d:0 "Неначе кіт, Японія просувається далі й забрала Корею. Вони хочуть принизити нас своєю двадцять однією вимогою. Нещодавно вони окупували Маньчжурію, і тепер ідуть далі. Більше цього не буде — Китаю доведеться битися до останнього за свою свободу. У своїй промові до [Root.GetAdjective]. народу [Root.GetLeader] звернувся до всіх, що їм потрібно об'єднатися або зіткнутися з неминучою загрозою самим."
 china.106.d:0 "Держава [From.GetName] приєдналася до альянсу [Root.GetFactionName] і готова боротися."
 china.2.a:0 "Доведеться нам обходитись без них."
 china.8.a:0 "Боягузи!"
 china.9.d:0 "Наша відданість оточенню Червоної армії була успішною, принаймні поки що. Попри те, що комуністи дізналися про наш наступ, вони вирішили протистояти нам і програли. Вони були вимушені відступити ще далі, а більшість місцевих тепер скептично ставиться до їхніх обіцянок повалити наш уряд."
