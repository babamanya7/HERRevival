 WW_hungary.124.desc:0 "Сьогодні вранці влада в Горі повідомила про чоловіка, який вимагає повернення фермерського маєтку, що колись належав йому. Він стверджує, що щойно зумів повернутися на батьківщину й утекти з лап російського гніту. Він також пообіцяв, що якщо його допустять до політики, він зможе привести нашу націю до слави, адже походить з роду успішних політиків. Чи є це та людина, яка допоможе нам відродити мрію про Велику Грузію?"
 WW_hungary.124.t:0 "Людина повертається додому"
 WW_hungary.16.t:0 "[From.GetNameDefCap] відмовляється від наших вимог"
 WW_hungary.22.desc:0 "Хоча це й не стало несподіванкою, але нерозумний [FROM.GetLeader] з [FROM.GetNameDef] привів війська у стан підвищеної готовності після нашого ультиматуму та надіслав посланця, заявивши, що вони не зроблять жодного кроку назад у суперечці щодо Карпатської Русі."
 WW_hungary.23.a:0 "Цей конфлікт нам не виграти"
 WW_hungary.31.desc:0 "[FROM.GetNameDefCap] призначив Йожефа Августа фон Габсбурга новим палатином нашої нації. Це безумовно зміцнить наш режим."
 WW_hungary.34.t:0 "[FROM.GetNameDefCap] відмовляється від монарха Габсбургів"
 WW_hungary.6.b:0 "Воно не варте таких зусиль."
 WW_hungary.81.t:0 "[FROM.GetNameDefCap] погоджується на інтеграцію"
 WW_hungary.88.desc:0 "[FROM.GetLeader] із [FROM.GetNameDef] погодився на створення нового військового альянсу, зміцнюючи зв'язки між нашими державами. Люди святкують цю подію, що знаменує нову еру безпеки для [ROOT.GetAdjective] нації."
