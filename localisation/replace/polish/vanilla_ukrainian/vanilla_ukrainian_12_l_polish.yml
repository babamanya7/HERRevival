 SEA_PHI_political_events.3.b:0 "Вони отримають ту ж ціну, що й усі інші"
 SEA_PHI_political_events.30.a:0 "МакАртур та Айзенгауер працюють разом? Безумовно!"
 SEA_PHI_political_events.30.desc:0 "Верховний головнокомандувач Збройних сил США на Далекому Сході Даґлас МакАртур запросив послуги свого протеже, Дуайта Д. Айзенгауера. Айзенгауер вже служив під керівництвом МакАртура, коли той був начальником штабу армії, і старший генерал явно бачить його потенціал. Ми самі розглядаємо Айзенгауера як висхідну зірку в армії Сполучених Штатів, і перебування на такій активній та зростаючій командній посаді може дати йому багато досвіду. \n\nСам Айзенгауер наголосив, що не розглядає це як довгострокове призначення і має намір повернутися до Сполучених Штатів через два роки, як тільки навчиться всьому, чому зможе, у МакАртура та на посаді штабного офіцера дійсної служби."
 SEA_PHI_political_events.62.t:0 "Добровольці на громадянську війну в Іспанії?"
 SEA_PHI_political_events.69.a:0 "Разом ми зможемо помститися за нашу колонізацію"
 SEA_PRC_border_war_events.4.t:0 "[PRC.GetNameDefCap] відступає з [615.GetName]"
 SEA_PRC_faction_events.3.t:0 "[FROM.GetLeader] відхиляє нашу пропозицію"
 SEA_PRC_faction_events.32.a:0 "Невірний крок веде до прірви..."
 SEA_PRC_faction_events.40.a:0 "Рішення, яке не прийняте, все одно є прийнятим"
 SEA_PRC_faction_events.51.a:0 "Гнатися за тінями означає втратити сонце"
 SEA_PRC_faction_events.81.a:0 "Тоді їх приборкають силою"
 SEA_PRC_faction_events.90.a:0 "Так, ми повинні об'єднатися проти спільного ворога"
 SEA_PRC_fourth_army_incident.9.desc:0 "Не дивлячись на відсутність вибачень, [FROM.GetNameDef] не виявив бажання далі загострювати цей конфлікт через інцидент з Новою 4-ю армією, хоча вони, безумовно, запам'ятають цей випадок."
 SEA_PRC_misc_events.11.t:0 "Норман Бетьюн помер"
 SEA_PRC_misc_events.13.t:0 "[FROM.GetNameDefCap] вимагає територію"
 SEA_PRC_misc_events.16.desc:0 "Наша делегація до [FROM.GetNameDef] повернулася з чудовими новинами! Наше прохання до [FROM.GetLeader] передати наші законні території, що утримуються [FROM.GetNameDef], було задоволено. [ROOT.GetLeader] розсипався в похвалах як [FROM.GetLeader], так і нашим дипломатам за досягнення цього результату."
 SEA_PRC_political_events.23.a:0 "Мабуть, після чисток залишилося мало кваліфікованих командирів"
 SEA_PRC_political_events.32.t:0 "[FROM.GetNameDefCap] шкодує про своє рішення"
 SEA_PRC_request_aid.10.t:0 "[FROM.GetName] оголошує про підписання угоди про технологічну співпрацю"
 SEA_PRC_request_aid.34.t:0 "[FROM.GetName] виготовить танки"
 SEA_PRC_request_aid.7.desc:0 "Відповідаючи на наш запит щодо танків Т-34, [FROM.GetName] погодився виготовити 150 Т-34 протягом найближчих місяців і надіслати їх нам, коли вони будуть готові. Це займе певний час, але цей захід стане гарним початком для наших прагнень створити сучасні бронетанкові війська."
 SEA_china.18.a:0 "Чудово!"
 SEA_china.2.a:0 "Це допоможе нашим зусиллям"
 SEA_china.2.t:0 "[FROM.GetNameDefCap] погоджується підтримати нас"
 SEA_china.20.desc:0 "[FROM.GetNameDefCap] підтвердив свій негайний вихід із Договору дев'яти держав. Вони визнають, що договір застарів і що суверенітет [CHI.GetAdjective]ої держави має бути необмеженим."
 SEA_china.20.t:0 "[FROM.GetName] відмовляється від Договору дев'яти держав"
 SEA_china_democratic.15.desc:0 "Відповідь на наші благання надійшла від [FROM.GetNameDef], яка вирішила покинути нас напризволяще. Підтримки не буде, кошти не будуть виділені. Ми стоїмо наодинці, незважаючи на народну підтримку в [FROM.GetNameDef]. Ми переможемо, тому що якщо ми цього не зробимо, наша спадщина буде забута."
 SEA_generic_events.3.t:0 "[GetOppositionPartySupportersName] протестують проти слабкого уряду"
 SEA_generic_events.4.a:0 "Засудити їхні дії"
 SEA_generic_events.4.b:0 "Не звертати уваги на подію"
 SEA_imperial_influence_events.241.desc:0 "Флот висунув свої вимоги. Схоже, вони прагнуть розширити свої виробничі можливості та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми замовили будівництво більшої кількості морських верфей для задоволення їхніх потреб у розширенні. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_japan_air_accidents_events.02.t:0 "«Операцію Помста» відвернено"
 SEA_japan_foreign_policy.111.desc:0 "Незважаючи на очевидні переваги і те, що це явно найкраще для союзу, [FROM.GetNameDef] відхилив нашу пропозицію про повну інтеграцію. Можна лише здогадуватися про їхні причини, але, схоже, вони не дбають про найкращі інтереси союзу."
 SEA_japan_foreign_policy.115.t:0 "[From.GetNameDefCap] хоче сюзеренітету над однією з наших колоній"
 SEA_japan_foreign_policy.123.a:0 "Це посилить наш контроль над [Root.GetNameDef]."
 SEA_japan_foreign_policy.131.t:0 "[FROM.GetNameDefCap] розпалює громадянську війну в [ROOT.GetNameDef]"
 SEA_japan_foreign_policy.138.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has accepted the [JAP.GetAdjective] proposal to merge with our government, and the [FROM.GetAdjective] lands now all fall under our jurisdiction. This is a great day for us!"
 SEA_japan_foreign_policy.140.b:0 "Sounds suspicious"
 SEA_japan_foreign_policy.39.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вирішив дозволити інвестиції в наші природні ресурси, і [FROM.GetAdjective]і компанії вже почали налагоджувати діяльність у межах наших кордонів."
 SEA_japan_foreign_policy.49.t:0 "Проголошення Реорганізованого уряду"
 SEA_japan_foreign_policy.52.desc:0 "Незважаючи на очевидні переваги і те, що це явно найкраще для майбутнього Азії, [FROM.GetNameDef] відхилив наше люб'язне прохання про повну інтеграцію. Можна лише здогадуватися про їхні причини, але, схоже, вони не дбають про найкращі інтереси регіону."
 SEA_japan_foreign_policy.60.desc:0 "[JAP.GetLeader] проголосив створення нової [ROOT.GetAdjective]ої держави, яка протистоїть нам і нашому поточному курсу. Схоже, вони готові боротися за свою незалежність від нас і не здадуться без бою!"
 SEA_japan_foreign_policy.79.t:0 "[FROM.GetNameDefCap] прагне тіснішої інтеграції"
 SEA_japan_foreign_policy.9.a:0 "Теннохейка Банзай!"
 SEA_japan_popup_events.1.a:0 "Це пахне новими можливостями!"
 SEA_japan_popup_events.16.t:0 "Імператор призначає нового прем'єр-міністра"
 SEA_japan_tokko_arrest_events.3.b:0 "Ми повинні негайно провести масові арешти!"
 SEA_warlords.12.desc:0 "Після падіння держави Ма Хушаня $XSM_ma_hongbin$ уникнув полону і зрештою дістався до нас, де зараз і перебуває. Ми повинні використати його досвід та знання у численних майбутніх битвах."
 SEA_warlords.35.a:0 "Тоді ми об'єднаємося!"
 SEA_warlords.39.desc:0 "Після кількох напружених годин на межі громадянської війни Чень Цзітан погодився піти у відставку, і ми ввели наші війська в Ґуандун. Що буде далі з провінцією, тепер повністю в наших руках."
 SEA_warlords.39.t:0 "Крах кліки Ґуандун"
 SEA_warlords.40.a:0 "Цей впертий бовдур..."
 SEA_warlords.46.tt:0 "§RЦе, ймовірно, призведе до війни з [CHI.GetNameDef]§!"
 SEA_warlords.6.a:0 "Надіслати якнайменше, щоб уникнути уваги Совєтів"
 SEA_warlords.61.a:0 "Принаймні ми отримали альянс, про який просили..."
 SEA_warlords.65.a:0 "Доки він залишається лояльним"
 SEA_warlords.68.t:0 "Генерали Ґоміньцзюня переходять на бік [FROM.GetNameDef]"
 SEA_warlords.73.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has decided to not lend us any aid to please the Soviet authorities as they value their partnership with the nation far more than our survival."
 SEA_warlords.75.desc:0 "The Inner Mongolian Army and Grand Han Righteous Army stand ready to launch an operation into the territories of warlord [SHX.GetLeader], provided they get our air support and supervision by Japanese staff officers. Perhaps we can secure more of Inner Mongolia without proving a larger-scale war in China."
 SEND_VOL_TARGET_AT_WAR:0 "Щоби надіслати їм добровольчі війська, @$TAG$$WHO|H$ мусить бути у стані війни."
 SEND_VOL_WE_NOT_AT_WAR:0 "Ми мусимо бути у стані миру, щоби надіслати добровольчі війська."
