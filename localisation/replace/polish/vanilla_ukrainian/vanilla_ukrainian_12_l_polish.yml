 BROWSER_LINK:0 "Плейсголдер класного посилання"
 BUILDING_DAMAGED:0 "Рівень пошкоджень: $DAMAGED|-$/$CURRENT|H$"
 BUILDING_STATE_MODIFIER_FORMATTER_HEADING:0 "$BUILDING|H$ — обласні модифікатори:"
 BUL_ZVENO_TOOLTIP:0 "[GetZvenoName] — націоналістична організація, заснована військовими офіцерами і очолювана Кімоном Ґеорґієвим.\n[GetZvenoName] закликає до своїх лав офіцерів збройних сил і згодом може влаштувати лад."
 BUL_align_bulgaria_desc:0 "Десятиліттями наші дипломатичні відносини з Болгарією були дружніми, і завдяки нашій фінансовій допомозі болгарський уряд зміг виплатити свій величезний борг. Настав час закликати Болгарію офіційно стати союзником держави [GER.GetNameDef]."
 BUL_approached_yugoslavia:0 "Звернулися до Югославії"
 BUL_assert_our_claims_historical_claims_tt:0 "Робить осердною будь-яку історично заявлену провінцію, яка повністю контролюється державою §Y[BUL.GetNameWithFlag]§!.\nІсторично заявлені провінції: §Y[106.GetName]§!, §Y[803.GetName]§!, §Y[77.GetName]§!, §Y[184.GetName]§!, §Y[731.GetName]§!, §Y[971.GetName]§!."
 BUL_atanas_pavlov_zhilkov_bftb_desc:0 "Атанас Павлов Жілков"
 BUL_balkan_communism_trade:0 "$BUL_balkan_communism$"
 BUL_blagoi_ivanov:0 "Блаґой Іванов"
 BUL_boris_iii_desc:0 "Цар Боріс III"
 BUL_british_industrial_agreements_cap_faction_tt:0 "Поточні [ENG.GetAdjective]і заводи:[?BUL.BUL_british_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_max_cap|R0] (в альянсі з державою [ENG.GetName])"
 BUL_bury_the_grudges_of_the_past_democratic:0 "§YБалканської Антанти§!"
 BUL_bury_the_grudges_of_the_past_no_faction:0 "[ROOT.GetFlag]§Y[ROOT.GetAdjective]ого§! альянсу"
 BUL_cooperation_bs_joint_act:0 "Спільний виступ із $BUL_bs_name_ins$"
 BUL_cooperation_bs_speech:0 "Дозволити промови $BUL_bs_name_gen$"
 BUL_cooperation_fund_faction_tt:0 "Лояльність фракції вища, ніж §Y55§!"
 BUL_dominance_in_the_aegean_adriatic_success:0 "Після нашого успіху у забезпеченні Адріатики моральний дух болгарських військ, а також цивільного населення вищий, ніж будь-коли. Ми мусимо скористатися моментом і убезпечити Егейське море, щоб Пруссія на Балканах була єдиним і безперечним охоронцем трьох морів."
 BUL_dominance_in_the_aegean_sea:0 "Домінування в Егейському морі"
 BUL_dominance_in_the_aegean_sea_mission_desc:0 "Необхідно взяти під контроль Егейське море, убезпечити узбережжя та захопити нові території для розширення виробництва бойових кораблів та зміцнення болгарського панування на морських просторах."
 BUL_ferdinand_i:0 "Фердінанд I"
 BUL_ff_approaching_faction_timer_effects_tt:0 "Фракція приєднається до Вітчизняного фронту, віднімаючи дні з тривалості завдання §YНеминучий переворот Вітчизняного фронту§! залежно від §Yпопулярності фракції§!. §YЛояльність фракції§!"
 BUL_ff_approaching_zveno_mission_desc:0 "§YВітчизняний фронт§! пропонує фракції [GetZvenoName] приєднатися до перевороту."
 BUL_former_leader_before_ferdinand_kyoseivanov:0 "прем'єр-міністром Ґеорґієм Кьосеівановим"
 BUL_gancho_manchev_desc:0 "Ґанчо Іванов Манчев"
 BUL_georgi_dimitrov:0 "Ґеорґій Дімітров"
 BUL_guardians_of_the_balkans_desc:0 "Ми мусимо зберегти гегемонію Болгарії на Балканах проти будь-якої ворожої сили, яка наважиться кинути їй виклик, тому ми подвоїмо наші військові зусилля і закликатимемо наші маріонеткові уряди на Балканах діяти так само, щоби допомогти нам у захисті нашого володіння."
 BUL_improve_coastal_defenses:0 "Поліпшити берегову оборону"
 BUL_infantry_equipment_3_short:0 "Schmeisser MP41"
 BUL_national_railway_lines_desc:0 "Нам потрібні швидкі та надійні способи переміщення не лише наших військ, а й постачання по всій країні. Розширення наших залізничних ліній поліпшить наші логістичні можливості."
 BUL_nationalization_desc:0 "Іноземний капітал дозволив нам розвивати нові промислові комплекси в Болгарії в таких масштабах, яких раніше не було на Балканах. Але магнати, які ними володіють, дедалі більше розкрадають нашу економіку, тож настав час захопити їхні засоби виробництва та витіснити їх із нашої країни. Однак це розлютить іноземні уряди, і, якщо дипломатія зазнає невдачі, нам, можливо, доведеться за це боротися..."
 BUL_nikola_hadzipetkov_bftb_desc:0 "Нікола Петков Хаджіпетков"
 BUL_opression_discredit_bzns_leaders_desc:0 "Фракція [GetBznsName] поширює серед населення небезпечні ідеї та розгромну критику нашого уряду, що для нас абсолютно неприйнятно. Ми мусимо публічно дискредитувати лідерів фракції, нашкодивши тим самим його популярності та публічному образу."
 BUL_plot_against_boris_dec_cat_desc:0 "[GetPlotAgainstBorisFocusLoc]"
 BUL_purchase_aircraft:0 "Придбати [FROM.GetAdjective]і літаки"
 BUL_purchase_aircraft_everything_available:0 ", [?BUL_quantity_purchased_naval_bomber] од. §Yморських бомбардувальників§! або [?BUL_quantity_purchased_tactical_bomber] од. §Yтактичних бомбардувальників§!"
 BUL_purchase_ships:0 "Придбати [FROM.GetAdjective]і кораблі"
 BUL_purchase_vehicles_armored_car_available:0 " або [?BUL_quantity_purchased_armored_car] од. §Yбронемашин§!"
 BUL_purchase_vehicles_tt:0 "\nМи зробимо вибір між придбанням [?BUL_quantity_purchased_motorized] од. §Yвантажівок§![GetAvailableVehiclesToPurchase] на основі [FROM.GetAdjective]их досліджень.\n"
 BUL_tac_bomber_equipment_2_short:0 "КБ-6"
 BUL_the_eastern_front_desc:0 "До цього часу наші громадяни не хотіли допускати будь-якої ворожості до визволителів болгарського народу. Але нищівна війна між нашими союзниками та [SOV.GetNameDef] змінила мислення багатьох колишніх недоброзичливців, які тепер підтримують нашу пропозицію приєднатися до Східного фронту."
 BUL_the_eastern_front_join_war_tt:0 "§Y[ROOT.GetNameDefCap]§! приєднується до своїх союзників у їхній війні проти §Y[SOV.GetNameDef]§!"
 BUL_third_bulgarian_state_desc:0 "[GetConsolidateTheThirdBulgarianStateFocusLoc]"
 BUL_trifon_trifonov:0 "Тріфон Тріфонов"
 BUL_tsar_boris_negative_01_desc:0 "Боріс III знає, що його диктаторський режим наближається до кінця, і, як не дивно, він відмовляється приймати будь-які зміни, запропоновані нашими міністрами, закликаючи лояльних членів уряду зірвати всі наші пропозиції і відчайдушно намагаючись зберегти контроль над болгарською політикою так довго, як він зможе."
 BUL_vasil_kolarov:0 "Васіл Коларов"
