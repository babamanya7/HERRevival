 DEN_bop_criticize_the_country_leader_desc:0 "Члени Rigsdagen ставлять під сумнів керівництво [ROOT.GetLeader] за закритими дверима, але, здається, ніхто не бажає робити це відкрито. Хтось має відкрито критикувати його та згуртувати більшість Rigsdagen, щоб прокласти шлях за вотум недовіри!"
