 ABK_democratic_party:0 "НЗА"
 ACCLIMATIZATION_GAINED_WHEN_ENTRY:0 "    $YES_NO$ $WEATHER$"
 ACHIEVEMENT_AVAILABLE:0 "Доступне"
 ADDRESS_CITY_HINT:0 "Вкажіть населений пункт"
 ADD_GOAL_CANNOT_AFFORD:0 "§RВи не можете собі дозволити додати ціль, бо вона коштує £faction_initiative_texticon $COST|.0$.§!"
 AFG_afghan_pakistan_cold_War_desc:0 "Хоча нам боляче конфліктувати з нашими родичами за кордоном, ми повинні визнати загрозу, яку вони тепер становлять для нас. Таким чином, ми повинні підготуватися до того, щоб стримувати їх, використовуючи будь-які необхідні засоби."
 AFG_align_with_the_allies_desc:0 "Незважаючи на безліч скарг на британців, ми повинні відкласти їх наразі та прагнути до більшої співпраці зі Союзниками. Як кажуть британці, краще мати справу з відомим тобі дияволом."
 AFG_appraoch_anti_communist_theologians:0 "Звернутися до антирадянських теологів"
 AFG_communist_industrialization:0 "Комуністична індустріалізація"
 AFG_darulaman_university_desc:0 "Наше сучасне місто Даруламан швидко розширюється після перенесення до нього урядових установ. Однак король бажає створити Даруламан як велике місто знань шляхом заснування нового університету зі світового класу об'єктами."
 AFG_develop_central_asia_category_desc:0 "$AFG_central_asian_unification_desc$"
 AFG_electrification:0 "Ініціативи з електрифікації"
 AFG_establish_darulaman_desc:0 "Даруламан мав стати новим запланованим містом, яке б замінило Кабул як столицю [AFG.GetNonIdeologyName]. Коли короля було повалено, роботи над містом були призупинені. Тепер ми можемо завершити проєкт та зробити його маяком сучасності."
 AFG_expand_kabul_university_desc:0 "Потреба у професійних інженерах, лікарях та вчителях більше не може бути задоволена лише відправленням студентів за кордон для спеціалізованої освіти. Натомість ми повинні інвестувати у власні установи та виховати нове покоління вітчизняних фахівців."
 AFG_expand_standing_army_desc:0 "Щоб перемогти наших ворогів та забезпечити нашу незалежність, наша армія повинна бути не просто ефективною, вона також має бути великою. Ми повинні розширити призов та набрати більше чоловіків до наших лав."
 AFG_hold_a_loya_jirga_tt:0 "Коли розпочнеться §Y[ROOT.GetAdjective] громадянська війна§!, протилежна сторона отримає наступне протягом §G180§! днів:"
 AFG_industrial_events.11.t:0 "[FROM.GetNameDefCap] погоджується на нафтову угоду"
 AFG_industrial_events.13.desc:0 "[FROM.GetAdjective] уряд націоналізував свою нафтову промисловість, незважаючи на наші великі інвестиції в неї. Націоналізація призвела до негайного припинення довгострокової нафтової концесії, на яку ми погодилися. Регіон затамував подих, очікуючи нашої відповіді."
 AFG_industrial_events.22.a:0 "$bftb_greece.194.a$"
 AFG_industrial_events.33.a:0 "У нас немає ресурсів для військової ескалації."
 AFG_industrial_events.34.a:0 "Кризу відвернуто."
 AFG_industrial_events.57.a:0 "Перемога міжнародного права та порядку."
 AFG_infrastructure_construction:0 "Інвестиції в інфраструктуру"
 AFG_international_brigades_desc:0 "Незважаючи на хоробрі жертви наших військ, війна, схоже, йде не на нашу користь. Однак ми можемо переломити ситуацію, відкривши набір до міжнародних добровольців, які прагнуть боротися проти гніту."
 AFG_khorasan_fascism:0 "Хорасанська імперія"
 AFG_khorasan_fascism_DEF:0 "Хорасанська імперія"
 AFG_maintain_neutrality:0 "Зберігати нейтралітет"
 AFG_maintain_quami_desc:0 "Система зборів куамі була основою нашої оборони протягом століть. Чому ми повинні відкидати систему, вкорінену в традиціях, яка принесе користь лише міській еліті в столиці? Опір цій останній хвилі модних реформ — єдиний логічний вибір."
 AFG_mihrdil_shahnawaz:0 "Мігрділ Шагнаваз"
 AFG_mughal_emirate_neutrality_DEF:0 "Емірат Великих Моголів"
 AFG_placeholder_fascist:0 "Шер Алі Шерханзай"
 AFG_political_events.10.a:0 "Ми підтримуємо цю ініціативу."
 AFG_political_events.10.desc:0 "Уряд [FROM.GetNonIdeologyName] запропонував інтригуючу пропозицію щодо зміцнення наших двох націй шляхом утворення конфедерації одне з одним. Це передбачає відкриття наших кордонів одне для одного в єдиному економічному ринку та створення спільної зовнішньої політики на світовій арені. Однак це зрештою обмежить нашу власну свободу дій."
 AFG_political_events.10.t:0 "[FROM.GetNameDefCap] пропонує конфедерацію"
 AFG_political_events.12.t:0 "[FROM.GetName] відхиляє конфедерацію"
 AFG_political_events.120.a:0 "Це узгоджується з нашими стратегічними цілями в регіонах."
 AFG_political_events.20.a:0 "Підрив ворожого впливу в нації принесе нам користь."
 AFG_political_events.75.t:0 "Відхилення переговорів щодо кордону"
