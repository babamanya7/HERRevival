 congolese_civil_war_starting_tt:0 "Конґо оголосить війну за незалежність проти нас. Вони зможуть примусити до миру і здобути свою повну незалежність, якщо контролюватимуть §YЛеопольдвіль§!, §YЕлізабетвіль§! і §YСтенлівіль§!. \n\nТе ж саме, ми зможемо примусити їх до миру і зберегти контроль над територією, якщо контролюватимемо §YЛеопольдвіль§!, §YЕлізабетвіль§! і §YСтенлівіль§!."
 conquer_caledonia:0 "Завоювати Каледонію"
 continuous_special_facility_desc:0 "Ми маємо можливість поліпшити наш ідослідницькі комплекси, щоби ті могли розмістити більше науковців, котрі будуть шукати новий прорив, котрий може змінити майбутнє нашої війни."
 continuous_tech_share_group_desc:0 "Скорочення часу дослідження технологій країнами-членами Вашого альянсу через Ваш активний безперервний фокус."
