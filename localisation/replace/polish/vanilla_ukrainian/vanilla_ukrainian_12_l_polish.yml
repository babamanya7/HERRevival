 TUR_turkish_state_railways_desc:0 "Без втручання держави наша країна залишиться розрізненим збіговиськом багатих міст заходу та децентралізованих племен сходу. Об'єднавши нашу націю інфраструктурою, ми виведемо у ХХ століття всю Туреччину, а не лише багаті прибережні міста на Егейському морі."
