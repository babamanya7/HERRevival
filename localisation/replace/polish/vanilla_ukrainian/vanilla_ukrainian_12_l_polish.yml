 GER_EQUIPMENT_VERSION_3_TANK:0 "Ausf. C"
 GER_MAN:0 "MAN"
 GER_STATE_66:0 "Нідершлезіен"
 GER_STATE_743:0 "Цінтао"
 GER_accept_british_naval_dominance_opinion:0 "Прийняли британське морське панування"
 GER_aerodynamic_research_institute_tt:0 "Відімкне рису ВПО §Y$GER_mio_trait_aerodynamic_research_insitute$§! для всіх §Yконструкторів літаків§!. §RОднак її можна застосувати лише до одного з них.§!"
 GER_albert_speer:0 "Альберт Шпеер"
 GER_army_communist_modifier_desc:0 "Народна армія — це щит соціалізму, готовий захищати й поширювати пролетарську революцію. Інноваційне мислення Народного Генштабу гарантує, що жодна імперіалістична агресія не зможе погасити революційний дух німецького народу."
 GER_ascension_of_goebbels_desc:0 "У найближчому оточенні фюрера завжди є місце для тих, хто може допомогти йому зберегти підтримку народу. Для нас, як для близького послідовника і вправного оратора, надання Йозефу Геббельсу відносної свободи дій має бути дуже корисним."
 GER_august_von_mackensen_must_retire_tt:0 "§Y$GER_uncertain_future$§! буде §Yвидалено§!, коли §Y$GER_august_von_mackensen$§! піде з посади глави уряду"
 GER_autarky_desc:0 "Справжня велич Німеччини неможлива без повного самозабезпечення. Потрібно навчитися ефективніше використовувати ресурси."
 GER_battleship_3_desc:0 "Двокорабельні лінкори класу «Bismarck» були найбільшими військовими кораблями, побудованими для Кріґсмаріне. Кораблі були спроєктовані у відповідь на нові французькі лінкори, що будувалися, з аналогічним озброєнням з восьми 38-см (15-дюйм.) гармат, як у класу Richelieu, з чотирма спареними баштами на противагу двом чотирьом баштам Richelieu. Bismarck відомий тим, що потопив британський крейсер HMS Hood у бою в Данській протоці, але згодом був вистежений і потоплений ще до прибуття в порт."
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "Надто довго держави Заходу утримували монополію на колоніальний режим. Настав час змінити це."
 GER_bypass_maginot_in_the_south_ww:0 "$GER_bypass_maginot_in_the_south$"
 GER_central_powers_faction:0 "Центральні держави"
 GER_communist_propaganda_middle_east_decision_tt:0 "Відкриває рішення для §YПоширення комуністичних настроїв§! у §Yменших близькосхідних країнах§!. Коли комуністи отримають більшість — спалахне §Yгромадянська війна§! для встановлення §Yкомуністичної влади§!"
 GER_communist_propaganda_south_america_decision_tt:0 "Відкриває рішення для §YПоширення комуністичних настроїв§! у §Yменших південноамериканських країнах§!. Коли комуністи отримають більшість — спалахне §Yгромадянська війна§! для встановлення §Yкомуністичної влади§!"
 GER_construct_alpenwall_tt:0 "Побудувати оборонну лінію в Альпах від регіону §Y[845.GetName]§! до §Y[976.GetName]§! в кожній області повністю підконтрольній державі §Y[ROOT.GetNameDef]§!, [GER.GetAdjective] ій маріонетці або члену альянсу. Поточний ефект:\n"
 GER_currency_reforms:0 "Валютні реформи"
