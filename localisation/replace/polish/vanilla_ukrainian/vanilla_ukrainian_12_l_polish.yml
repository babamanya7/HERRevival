 convoy_escorts_bs_desc:0 "$convoy_escorts_desc$"
 create_empire_of_zion_tt:0 "Робить осердною кожну підконтрольну державі [ROOT.GetNameDef] або її суб'єктам область на Карибах і у Флориді."
 crisis_magician:0 "Кризовий чарівник"
 czech.1.d:0 "Наші відносини з чехами часто були натягнутими, але останнім часом їхні політики зробили різкий крен у правильний бік. Посилення тиску з боку Німеччини та розчарування у здатності західних демократичних країн надати захист підштовхнули їх до вступу до Комінтерну."
 czech.33.d:0 "[From.GetLeader] ставився до нашої пропозиції з несподіваним розумінням. Ми уклали договір про взаємну дружбу, підтвердивши, що не маємо територіальних домагань один до одного."
