 RAILWAY_GUN_UNIT_STATS:0 "Подробиці про залізничну гармату"
 RAJ_EQUIPMENT_VERSION_7:0 "Mk VII"
 RAJ_GOE_accept_russian_muhajir_money_desc:0 "Дискретна фінансова підтримка з-за кордону може прискорити наші організаційні зусилля та зменшити нашу залежність від місцевих джерел фінансування."
 RAJ_GOE_enforced_peace_decision_desc_2_2_tt:0 "§YЯкщо ми контролюємо [429.GetName], [427.GetName], [424.GetName], [425.GetName], [423.GetName], [982.GetName] та [983.GetName], ми отримаємо більші територіальні поступки, коли війна закінчиться§!"
 RAJ_GOE_louis_mountbatten:0 "Луїс Маунтбеттен"
