 tfv_canada.62.d:0 "Посилаючися на своє хитке «імперське право» та закликаючи захистити статус Лабрадору й Ньюфаундленду як колоніальних володінь, держава [From.GetNameDef] відмовилася поступитися землею, яка по праву належить нам! Ці люди є [Root.GetAdjective]ими, а Ньюфаундленд і Лабрадор володіють [Root.GetAdjective]ими ресурсами, але мусять відповідати перед [From.GetAdjective]ими господарями.\nЦе неприйнятний стан речей, але зрозуміло, що державу [From.GetNameDef] не переконати в дипломатичному вирішенні..."
 tfv_canada.73.a:0 "Принаймні, нам це відкомпенсують..."
 tfv_raj.212.desc:0 "Третій вибух зруйнував завод в одному з наших штатів. Цього разу, схоже, нападники неправильно обрали час, оскільки бомба вибухнула посеред робочої зміни. Десятки робітників загинули і ще десятки вважаються зниклими безвісти. Слідчі відпрацьовують кілька версій, і вже проведено обшуки в кількох будинках. Результати обшуків викликають глибоке занепокоєння, починаючи від пропаганди руху «Геть із Індії» до інструментів, які можуть бути використані для створення саморобної вибухівки.\n\nОднак жоден із заарештованих не є ватажком, і поки що вони відмовляються говорити."
 tfv_south_africa.10.b:0 "Нідерландці нам допоможуть."
 tfv_south_africa.103.t:0 "Свобода для держави [TUN.GetName]"
 tfv_south_africa.104.d:0 "Звільнившися з-під влади колоніальних гнобителів, [LBA.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [LBA.GetAdjective]ого уряду."
 tfv_south_africa.15.a:0 "Це піде нам на користь."
 tfv_south_africa.16.desc.a:0 "Із держави [HOL.GetNameDef] прибула партія літаків, завдяки щедрому пожертвуванню кількох провідних діячів [HOL.GetAdjective]ої авіаційної індустрії. Наші пілоти з нетерпінням чекають на них, і вже розпочалася жорстка конкуренція за місця в новій ескадрильї."
 tfv_south_africa.30.d:0 "Після потрясінь у Європі [From.GetAdjective]ий уряд відкрито поставив під сумнів наше право на суверенітет на Мадаґаскарі, а також нашу здатність захистити населення, яке там проживає. Така поведінка нарешті вийшла за рамки простої риторики, і [From.GetAdjective]а адміністрація вимагає, щоби ми передали їм контроль над островом."
 tfv_south_africa.41.t:0 "[SOV.GetNameDefCap] погоджується"
 tfv_south_africa.63.c:0 "$tfv_south_africa.60.c$"
 tfv_south_africa.82.t:0 "Свобода для держави [CMR.GetName]"
 tfv_south_africa.86.d:0 "Звільнившися з-під влади колоніальних гнобителів, [NGR.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [NGR.GetAdjective]ого уряду."
 tfv_south_africa.98.t:0 "Свобода для держави [LIB.GetName]"
 the_banker:0 "Банкір"
 the_neverending_story_tt:0 "Граючи як воєначальника, контролюйте всі початкові осердні землі Китаю та відновть Китайську імперію"
 the_sacred_king:0 "Священний король"
 tier_taxes_header_1_tt:0 "Наприкінці §Yфіскального року§! ми повинні сплатити частину нашого доходу англійському уряду у вигляді §YФактора споживчих товарів§!. Чим більше цивільних фабрик ми контролюємо, за винятком торгівлі та фабрик, що належать маріонеткам, тим більше нам доведеться платити. Кількість цивільних фабрик, необхідних для перебування в певній податковій групі, показано в комірках §YОподатковуваного доходу§!, а ставка оподаткування вказана у відповідній комірці."
 totally_not_cool_bromania_tt:0 "Румунія змінила сторону та змусила капітулювати колишнього союзника (який іще не капітулював у мить переходу)"
 town:0 "Розвинений сільський регіон"
 train_equipment:0 "Поїзд"
 trait_GRE_fascist_sympathizer_desc:0 "Цей лідер симпатизує догматам фашизму."
 trait_SPA_carlist_loyalties_desc:0 "Цей лідер лояльний карлістам."
 transport_desc:0 "Кораблі, створені тільки для перекидання військ, не мають оборонних можливостей."
 tsr_manchukuo.1.b:0 "Пуї повинен мати свій трон!"
 tsr_manchukuo.15.a:0 "Що ж"
 tsr_manchukuo.2.desc:0 "Сьогодні ввечері [FROM.GetLeader] виступив із досить цікавою пропозицією: передати управління Квантунською орендованою територією навколо портового міста Далянь нам, при цьому ми збережемо наші операції активними, як і раніше. Він заявив, що оскільки наші дві нації вже є нероздільними, було б логічно возз'єднати Далянь з рештою Маньчжурії, одночасно звільнивши нас від деяких адміністративних витрат."
 tsr_manchukuo.8.t:0 "[FROM.GetLeader] відмовляється від інтеграції"
 tsr_manchukuo_border_war.1.b:0 "Що ж"
 tsr_manchukuo_border_war.6.desc:0 "Хоча Пекін і впав під натиском [MAN.GetAdjective]ої армії, просування їхніх сил далі вглиб провінції Хебей було зупинено."
 tsr_sichuan_border_war.2.b:0 "Сікан стоїть!"
 tula_arms_plant:0 "Тульський збройовий завод"
 turned_a_blind_eye_opm:0 "Заплющили очі"
 uk_south_africa_focus:0 "Розвиток Південної Африки"
 unbreakable:0 "Незламний"
 underdog_mentality_navy_spirit:0 "Ментальність аутсайдера"
 unholy_alliance:0 "Нечестивий альянс"
 unit_medal_effectiveness:0 "$MODIFIER_MEDAL_EFFECTIVENESS$"
 unite_the_antilles:0 "Об'єднати Антильські острови"
 united_polynesia_DEF:0 "Полінезія"
 united_polynesia_neutrality_DEF:0 "Об'єднане королівство Полінезія"
 upgrade_form_department:0 "Створити відділ криптології"
 usa.3.d:0 "Дипломатичні та економічні санкції, яких ми зазнали з боку Сполучених Штатів, схоже, стали початком чогось більш загрозливого. Американський Тихоокеанський флот був розміщений на військово-морській базі в Перл-Гарборі, Гаваї, чітко сигналізуючи, що американці зберігатимуть сильну присутність у Тихому океані та продовжуватимуть підтримувати наших ворогів. Удар по базі в цей момент може дати нам елемент несподіванки."
 usa.32.a:0 "Явний знак нашої підтримки серед населення."
 usa.8.t:0 "Лендон проти Рузвелта"
 viktor_schutze:0 "$GER_viktor_schutze$"
 vojvodina_YUG_subject_DEF:0 "Автономна область Воєводина"
 volunteer_corps:0 "Добровольчі корпуси"
 war_building_slot:0 "Привласнення промислових земель"
 war_declaration_rules:0 "Коли ми можемо оголошувати війни?"
 war_escalation_4_or_more_tt:0 "Ескалація становить щонайменше §Y4§!"
 war_justification.1.a:0 "Майбутнє належить державі [ROOT.GetName]!"
 war_justification.19.d:0 "«Наївні громадяни держави [ROOT.GetName], які уявляють собі [From.GetAdjective]ий народ як миролюбний, повністю відірвані від реальності. Ті, хто живе на нашому кордоні, не мають розкоші таких ілюзій, бо бачать, як їхні війська наближаються до нас просто по той бік кордону. Це загроза, яку ми не можемо залишити без відповіді. З кожним днем [From.GetName] готується до війни. Було б божевіллям з нашого боку не зробити те саме».\n\nПрисутність [From.GetAdjective]их військ поблизу нашої території викликає все більше занепокоєння, оскільки ця країна дедалі більше виглядає як ворог [ROOT.GetRulingParty]. Чи є це причиною або наслідком їхньої полеміки — питання спірне."
 war_justification.210.t:0 "[From.GetLeader] закликає до інтервенції в державу [ROOT.GetName]"
 war_propaganda_casualties_desc:0 "Незважаючи на те, що кількість загиблих зростає, наш народ мусить знати, що тільки в бою загартовуються герої."
 warlord_monarchy_fascism_party:0 "Zī Zhèng Yuàn"
 warning_this_idea_can_be_removed_tt:0 "§RЦей дух буде видалено, якщо [COG.GetNameDef] більше не буде колонією§!"
 weather_blizzard:0 "Снігова буря"
 white_liberal_leader:0 "$white_liberal$"
 wilkies_new_deal_desc:0 "Хоча Уенделл Вілкі і заперечував проти реформ, запропонованих Франкліном Рузвелтом у рамках Нового курсу, новий президент підтримав деякі з них."
 wolfpacks_pack_search_patterns:0 "Схеми пошуку зграї"
 wtt_border_conflict_won_defender.1.a:0 "Ми показали їм свою силу!"
 wtt_china_shared.12.b:0 "Їм доведеться вправлятися самим."
 wtt_china_shared.2.desc:0 "У приватній бесіді представники уряду держави [From.GetNameDef] висловили велику зацікавленість тим, як ми підтримуватимемо їхню незалежність. Були створені фонди для груп, які борються за велику незалежність, а також ми почали створювати [From.GetAdjective]ий «Тимчасовий уряд у вигнанні»."
 wtt_germany.19.d:0 "Нещодавні риторичні звинувачення на нашу адресу з боку Німеччини серйозно шкодять нашій репутації у Європі. Наклепні міркування про передбачувану «агресію» починають вселяти іншим страх і хибне уявлення про наші цілі."
 wtt_germany.58.t:0 "Австрійський народ голосує проти об'єднання"
 wtt_germany.62.a:0 "Добре."
 wtt_germany.72.b:0 "Чи не варто. Наш суверенітет надто цінний для нас."
 wtt_infiltration.6.desc:0 "Ворожі війська атакували нашу базу в області [infiltrated_state.GetName]. Від наших товаришів не було жодних повідомлень, але ворожа преса пише про «кампанію з оточення та викорінення в провінції [infiltrated_state.GetName]». Потрібно чекати найгіршого."
 wtt_japan.104.desc:0 "[From.GetNameDefCap] зробила публічну заяву про те, що не має наміру сидіти осторонь і спостерігати за тим, як країна, яка перебуває у сфері її інтересів, залишається під впливом Заходу. Вони вимагають, щоби ми прискорили процес деколонізації та негайно надали Філіппінам незалежність.."
 wtt_japan.119.desc:0 "[From.GetNameDefCap] приймає нашу пропозицію щодо обміну Південного Сахаліну на військову підтримку. Вони вже відправили нам на допомогу декілька «добровольчих» дивізій!"
 wtt_japan.121.b:0 "На даний момент це нас не цікавить."
 wtt_japan.128.desc:0 "Держава [From.GetNameDef] відмовилася укласти з нами мир і поклялося вести війну доти, доки не доб'ється беззастережної капітуляції."
 wtt_japan.128.t:0 "[From.GetName] відхиляє пропозицію миру"
 wtt_japan.32.a:0 "Певне, ми гідні зватися його домом!"
 wtt_ledo_road.1.t:0 "Дорогу Ледо закрито"
 wtt_news.11.desc:0 "Після того як держава [GER.GetFactionName] запропонувала одному із сусідів Радянського Союзу вступити в альянс, радянський уряд дав чітко зрозуміти, що не зазнає подальшого проникнення у «сферу свого впливу».\n\nПриходять невтішні звістки про мобілізацію радянських збройних сил, що, можливо, говорить про підготовку до війни."
 wtt_news.13.t:0 "Компроміс у питанні Вільгельма III"
 wtt_news.17.c:0 "Тепер ми квити за 1914-й."
 wtt_news.25.a:0 "Азія — для азійців!"
 wtt_news.33.b:0 "І чому ми думали, що вони зміняться?"
 wtt_news.41.g:0 "Великий удар по нашому союзнику..."
 wtt_news.41.t:0 "Підірвано Панамський канал"
 wtt_news.46.b:0 "Ми об'єднаємо весь Китай!"
 wtt_news.48.d:0 "Дракон вирішив битися з... Сонцем?"
 wtt_news.7.a:0 "«Данциґ або війна»? Ха! Дипломатія знову перемагає."
 wtt_news.7.d:0 "Угода, вигідна обом? Іще побачимо."
 wtt_news.7.desc:0 "Польський уряд прийняв пропозицію Німеччини повернути Данциґ в обмін на військові гарантії. Згідно з укладеним договором, Німеччина має прийти на допомогу Польщі у разі будь-яких спрямованих проти неї військових дій.\n\nХоча ціна висока, і Польща знову виявляється відрізаною від моря, але, можливо, це має сенс у світлі комуністичної загрози зі Сходу."
 wtt_news.70.t:0 "[From.GetNameDefCap] відроджується"
 wtt_political_organisation.10.t:0 "[From.GetNameDefCap] здобуває більшість в області [state.GetName]"
 wtt_political_organisation.9.t:0 "[state.GetName] підтримує нас"
 wtt_political_warlord_support.12.a:0 "Сподіватимемося, що ми не пошкодуємо про це..."
 wtt_political_warlord_support.21.t:0 "[From.GetLeader] надає підтримку"
 wtt_political_warlord_support.3.desc:0 "Ми розраховували, що [warlord_asked_for_support.GetLeader] надасть нам підтримку, але наші старання не мали успіху. [warlord_asked_for_support.GetLeader] вважає нинішню політичну боротьбу справою другорядної важливості, яка відволікає нашу увагу від справжніх ворогів Китаю."
 wtt_take_national_leadership.1.b:0 "Це не демократія!"
 wtt_warlord_vs_prc.21.desc:0 "[From.GetLeader] надіслав нам повідомлення з вимогою, щоби ми збільшили економічну допомогу згідно з раніше укладеними домовленостями."
 wtt_warlord_vs_prc.35.desc:0 "[From.GetNameDefCap] вимагає, щоб усі комуністи Китаю сформували єдиний альянс — Народний фронт — і розгромили націоналістів, реакціонерів та іноземних загарбників, борючись під спільним прапором."
 wuw_GER_chinese_diplomacy.2.desc:0 "\nНаші великі союзники із заходу, [FROM.GetAdjective], надіслали делегацію з пропозицією інвестувати в нашу промисловість в обмін на вигідні умови торгівлі природними ресурсами. Вони — дійсно добрі друзі."
 wuw_GER_chinese_diplomacy.5.b:0 "Не думаємо, що це нам допоможе"
 wuw_GER_civil_war.6.b:0 "Ми знищимо цей натовп!"
 wuw_GER_civil_war.7.b:0 "Ми не підлаштовуватимемося під Редера"
 wuw_GER_civil_war.9.t:0 "Август фон Макензен іде у відставку"
 wuw_GER_diplomacy.1.a:0 "Ми обидва можемо з цього виграти."
 wuw_GER_diplomacy.110.t:0 "[FROM.GetAdjective]и різко відхиляють угоду"
 wuw_GER_diplomacy.25.a:0 "Погане рішення з їхнього боку..."
 wuw_GER_diplomacy.3.desc:0 "[FROM.GetLeader] здається нерозсудливим лідером, якого не турбує добробут своєї країни. Ми звернемося до інших джерел, щоб знайти те, що нам потрібно."
 wuw_GER_diplomacy.56.t:0 "[FROM.GetNameDefCap] спустошує наші рахунки"
 wuw_GER_diplomacy.61.t:0 "[FROM.GetNameDefCap] поступається нашим вимогам"
 wuw_GER_diplomacy.70.t:0 "[FROM.GetNameDefCap] втручається в нашу політику"
 wuw_GER_diplomacy.72.a:0 "Нам нема чого боятись"
 wuw_GER_diplomacy.79.a:0 "Ми маємо визволити їх!"
 wuw_GER_monroe.1.a_tt:0 "Відкриває рішення для §YЗміцнення Доктрини Монро§!.\n\n[GER.GetNameDefCap] отримує доступ до рішень щодо спроби §RДестабілізувати Доктрину Монро§!."
 wuw_GER_monroe.10.desc:0 "[FROM.GetLeader] оголосив про часткове скасування Доктрини Монро. Вони заявили, що продовжать гарантувати незалежність країн, які не виступили проти Доктрини. Це може ускладнити наші плани, але ми впораємось."
 wuw_GER_monroe.4.b_tt:0 "Ми не займемо чіткої позиції. §Y[USA.GetNameWithFlag]§! може спробувати переконати нас підтримати Доктрину."
 wuw_GER_realpolitik.16.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що нашій державі настав кінець, і ми маємо бути інтегровані до складу [FROM.GetAdjective] держави. Чи погодимось ми на ці вимоги?"
 wuw_GER_realpolitik.22.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що наші причини для вимог [FROM.GetAdjective] земель є вигаданими, і вони не будуть бездіяльно спостерігати, як ми крадемо традиційні землі їхнього народу. Схоже, вони розкусили наш блеф."
 wuw_GER_realpolitik.4.desc:0 "[FROM.GetAdjective]и хочуть підтримати наші зусилля у війні та надіслали певне оснащення. Це невелике постачання, але будь-яка допомога важлива."
 wuw_GER_realpolitik.49.t:0 "Наш сюзерен передає нас [GER.GetNameDef]"
 wuw_GER_realpolitik.8.a:0 "Великий день для [ROOT.GetNameDef]!"
 wuw_GER_reichskommissariats.15.t:0 "Керівництво Балкан"
 wuw_GER_reichskommissariats.9.b:0 "Включити до Московії"
 wuw_GER_releasable.2.desc:0 "Оскільки вибори завершилися на користь Рейтспартай, настав час обрати особу, яка найкраще керуватиме країною. Партія хоче, щоб П'єр Дюпонг очолив уряд, дозволивши Йозефу Беху зосередитися на інших важливих питаннях. Однак над Європою згущуються темні хмари, і, можливо, варто радикально змінити наш політичний курс, щоб не стати жертвою сусідніх держав..."
 wuw_GER_weltpolitik.20.a:0 "Це великий день!"
 wuw_HUN_a_roman_catholic_state:0 "Римо-католицька держава"
 wuw_HUN_award_military_promotions:0 "Присвоїти військові звання"
 wuw_HUN_cruiser_investments_desc:0 "Навіть найсильніший флот марний, якщо він не може виявити ворога чи захиститися від авіації. Нові легкі та важкі крейсери допоможуть зробити наш флот справжньою бойовою силою."
 wuw_HUN_elections_in_the_revolutionary_council:0 "Вибори до Революційної ради"
 wuw_HUN_expand_the_ganz_muvek:0 "Розширити Ganz Müvek"
 wuw_HUN_form_the_gyorshadtest:0 "Формування Gyorshadtest"
 wuw_HUN_hold_territorial_referendums_tt:0 "Відкриває рішення для §Yпроведення референдумів у втрачених територіях§! з метою повернення їх до складу країни"
 wuw_HUN_hungarian_autarky_desc:0 "Ми занадто залежні від іноземних джерел нафти. Ми повинні наслідувати німецькі зусилля у створенні синтетичної нафти та зміцнити нашу економіку, щоб стати самодостатніми."
 wuw_HUN_invest_in_ludovica_academy:0 "Інвестувати в Академію Людовіки"
 wuw_HUN_make_the_magyar_legiero_known:0 "Оголосити про Magyar Légierö"
 wuw_HUN_manred_weiss_steel_and_metal_works:0 "Сталеливарні заводи Манфреда Вайсса"
 wuw_HUN_news_events.1.b:0 "Це забезпечить наше майбутнє!"
 wuw_HUN_news_events.6.c:0 "Імовірний союзник?"
 wuw_HUN_outlaw_the_party_of_national_will:0 "Заборонити Партію національної волі"
 wuw_HUN_reach_out_to_candidates:0 "Звернутися до кандидатів"
 wuw_HUN_reintigrate_slovakia_desc:0 "Протягом століть Словаччина була невіддільною частиною [ROOT.GetAdjective] держави, однак після ганебного Тріанонського договору ці землі було від нас відірвано. Настав час повернути наші північні регіони додому."
 wuw_HUN_secret_rearmament:0 "Таємне переозброєння"
 wuw_HUN_the_botond_desc:0 "Щоб задовольнити потреби в логістиці, нам потрібна нова вантажівка. Прототипи Rába 38M Botond добре показали себе на випробуваннях. Варто завершити розробку та почати виробництво."
 wuw_HUN_the_legacy_of_the_isonzo_front_desc:0 "Його Величність Йожеф Август служив Австро-Угорщині та командував у численних боях на російському, сербському та італійському фронтах. Особливо його надихнула тактика, застосована в битвах на Ізонцо, й він прагне впровадити подібну військову стратегію."
 wuw_HUN_the_szekesfehervar_sosto_plant_desc:0 "Ми повинні відкрити новий завод з виробництва літаків, підконтрольний Інституту авіаційних технологій, який зможе випускати та тестувати розроблені ним літаки."
 ww_BEL_event_diplomatic.2.b:0 "Люксембург — горда і незалежна нація!"
 ww_BEL_event_diplomatic.3.t:0 "[FROM.GetNameDefCap] Поступається"
 ww_BEL_event_diplomatic.35.desc:0 "З нами зв'язався наш північний сусід. Вони хочуть встановити більш серйозні дипломатичні відносини з нами. Їхня пропозиція може бути вигідною для обох сторін, але нам потрібно ретельно обрати правильний шлях."
 ww_BEL_event_spanish_interaction.2.desc:0 "Наша попередня поставка до [SPR.GetAdjective] була дуже корисною для наших республіканських друзів. Їхня битва ще далеко не закінчена, і ми маємо можливість надіслати їм більше обладнання."
 ww_BEL_event_war.2.desc:0 "Король Леопольд III живе в тіні свого батька, короля Альберта Солдатського Короля, відомого тим, що утримував Бельгію під час Великої війни і не давав перемогти Німецькій імперії. Хоча в результаті його країна перетворилася на поле бою, військова гордість нації залишилася непошкодженою, а репутація Бельгії на світовій арені зросла. \n\nЗараз, коли Бельгія знову в стані війни, справжнє випробування характеру Леопольда почнеться, і вже є тривожні ознаки, які викликають у нас занепокоєння. \n\nКороль, стверджуючи, що хоче зберегти життя своїх людей, вже шукає шляхи до миру, і ми підозрюємо, що якщо Брюссель, Льєж або Антверпен падуть, то король може капітулювати раніше, незалежно від демократичної волі народу продовжувати боротьбу."
 ww_BEL_event_war.6.t:0 "Генеральні секретарі"
 ww_congo.65.a:0 "Жаль..."
 ww_congo.73.a:0 "Ми не віддамо нашу територію."
 ww_congo.73.t:0 "[FROM.GetNameDefCap] пропонує мир для незалежності нашої колонії"
 ww_congo.9.desc:0 "З нашим нещодавнім зростанням середнього класу та великою кількістю людей у міських районах з післяшкільною освітою, багато [COG.GetAdjective] почали читати роботи політичних теоретиків, і багато нових політиків та прихильників незалежності починають з'являтися на сцені. Це означає новий етап для [COG.GetAdjective] нації!"
