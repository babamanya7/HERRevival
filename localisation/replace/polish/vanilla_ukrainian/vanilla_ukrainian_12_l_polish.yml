 ENG_HOL_autonomy_eu_member_DEF:0 "Європейська Британія"
 ENG_benelux_intervention_desc:0 "Політичне середовище в регіоні Бенілюксу стає все більш ворожим до нас. Ми мусимо надіслати чітке попередження про те, що ми не будемо миритися з будь-якими ворогами демократії і готові застосувати силу, якщо це буде необхідно."
 ENG_blackshirt_march_in_northern_ireland_desc:0 "Тепер готується великий марш чорносорочників у Північній Ірландії. Він, безперечно, приверне на наш бік місцеве населення."
 ENG_carrier_1_desc:0 "Ці три авіаносці були переобладнаними лінійними крейсерами і були першими авіаносцями Королівського флоту. Їхнє переобладнання стало результатом Вашинґтонського військово-морського договору 1922 року, і робота була завершена у 1925 році. Це були помірно броньовані, але добре озброєні судна, з великою дальністю та хорошою швидкістю, але через характер переобладнання їхня авіація доповнюється обмежений. Тим не менш, вони дали Королівському флоту важливий досвід у будівництві авіаносців і повітряному проєктуванні флоту."
