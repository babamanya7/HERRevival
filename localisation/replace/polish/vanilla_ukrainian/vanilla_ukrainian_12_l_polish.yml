 SOV_peoples_commissariat_desc:0 "Народний комісаріат оборонної промисловості СРСР буде міністерством важкої промисловості, яке зосередиться на наших військово-промислових проєктах. У довгостроковій перспективі робоче навантаження може вимогти подальший розподіл міністерства."
