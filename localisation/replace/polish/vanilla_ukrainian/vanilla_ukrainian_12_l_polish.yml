 GER_cv_nav_bomber_equipment_3:0 "Arado Ar 215"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName] мусить затвердити угоду, щоби бонуси почали діяти. В разі оголошення війни вона вийде з альянсу [Root.GetFactionName].§!\n"
 GER_demand_abandon_of_doctrine_decision:0 "Вимагати [FROM.OWNER.GetNameDef] відмовитися від Доктрини Монро"
 GER_disband_the_schutztruppen_tt:0 "§RУсі підрозділи Шуцтруппе будуть розформовані§!. \n(Людський ресурс та обладнання не повертаються)"
 GER_division_nederland_armored_tt:0 "§YТанкові§! частини §YSS-Panzerdivision Nederland§! та §YSS-Panzerdivision Anton Mussert§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_sweden_mot_tt:0 "§YМоторизована§! частина §YSS Division Sveaborg§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_economy_of_conquest_modifier:0 "Економіка завоювання"
 GER_effective_operations:0 "Ефективні операції"
 GER_establish_wales_decision:0 "Заснувати Великий Уельс"
 GER_european_confederation:0 "Європейська конфедерація"
 GER_first_vienna_award:0 "Перший Віденський арбітраж"
 GER_focus_can_only_be_completed_by_advisor_tt:0 "Цей фокус може розпочати лише §Y$CHARACTER$§! після завершення фокусу §Y$FOCUS$§!."
 GER_form_organization_todt_desc:0 "Хоча є кілька великих будівельних проєктів, які фюрер хотів би бачити завершеними, більшості з них доведеться зачекати. Найбільш гостро [ROOT.GetNameDef] потребує збільшення військової промисловості. З плануванням у руках Фріца Тодта ми впевнені, що результат буде хорошим."
 GER_government_general_idea:0 "Генерал-губернаторство"
 GER_gw_tank_equipment_desc:0 "Leichttraktor — німецький експериментальний танк. Після Першої світової війни Німеччина була обмежена у військових розробках Версальським договором, але секретна програма під назвою «Traktor» розробляла броньовані військові машини та артилерію."
 GER_hans_von_ohain:0 "Ганс фон Огайн"
 GER_heavy_tank_destroyer_equipment_2_short:0 "Elefant"
 GER_hess_party_chancellor:0 "Канцлер партії"
 GER_implement_wage_controls:0 "Запровадити контроль заробітних плат"
 GER_influence_balkans_democratic_decision:0 "$GER_influence_baltics_decision$"
 GER_influence_the_middle_east:0 "Вплинути на Близький Схід"
 GER_integrate_volkskommissariats_tt:0 "Відкриває рішення для §Yінтеграції фолькскомісаріатів§!. Після першої інтеграції §Y[ROOT.GetNameWithFlag]§! буде перейменовано на §Y$GER_german_socialist_union_communism$§!"
 GER_integrate_western_german_speakers_desc:0 "Вересневий план передбачав інтеграцію більших територій Люксембурга в німецьку державу. Обидва ці регіони та Швейцарія колись були частиною Священної Римської імперії, спадкоємцем якої ми є. Ці германські території повинні бути швидко інтегровані в наше царство."
 GER_invite_BEL_to_attack_HOL_decision:0 "Закулісні перемовини з державою [BEL.GetNameDef]"
 GER_light_cruiser_2_desc:0 "Легкі крейсери класу «Leipzig» були побудовані між 1928 і 1935 роками як поліпшення попередніх крейсерів класу «Königsberg». Вони мали водотоннажність понад 8 100 тонн, достатню швидкість і дальність плавання та мали дев'ять 15-см гармат SK C/25 у своєму головному озброєнні."
 GER_light_tank_aa_equipment_2:0 "Flakpanzer Luchs"
 GER_light_tank_artillery_equipment_1_desc:0 "Буксирувані гармати, які призначалися піхотним гарматним ротам мотострілецьких полків, важко встигали за танками в бою. Найпростішим рішенням було модифікувати запасне шасі танка, щоби нести його в бій. У випадку з Bison він використовує шасі Panzer I."
 GER_loyal_inner_circle:0 "Лояльне внутрішнє коло"
 GER_medium_tank_equipment_2_desc:0 "Розроблений як танк підтримки піхоти, Panzer IV спочатку не призначався для ураження ворожої бронетехніки — цю функцію виконував легший Panzer III. Однак, коли недоліки довоєнної доктрини стали очевидними, а також перед обличчям радянських танків Т-34, Panzer IV незабаром взяв на себе роль танкового бойового брата свого все більш застарілого родича. Найбільш широко виготовлений і розгорнутий німецький танк Другої світової війни Panzer IV використовувався як основа для багатьох інших бойових машин."
 GER_mio_trait_early_jet_engine_adopter:0 "Раннє використання реактивних двигунів"
 GER_mio_trait_flying_boat_specialist:0 "Спеціаліст із літаючих човнів"
 GER_mio_trait_long_nose_design:0 "Конструкція з подовженим носом"
 GER_mio_trait_mobility_design_philosophy:0 "Філософія мобільності в проєктуванні"
 GER_nationalize_industries:0 "Націоналізувати промисловість"
 GER_negotiate_old_colonies_in_the_east:0 "Домовитися про старі колонії на сході"
 GER_no_balkan_communism_YUG_tt:0 "Отримати ціль війни §YПовалення уряду§! проти §YСФР Югославія§!.\n"
 GER_no_balkan_communism_desc:0 "Вплив комунізму проникає на Балкани. Ми не можемо цього допустити, а тому маємо знищити загрозу перш, ніж вона пустить коріння."
 GER_north_ural_rkm_effect_tt:0 "Кожна область у зоні інтересів Північного Уралу перейде під контроль [RKM.GetNameDef]"
 GER_pool_technical_know_how:0 "Технічне ноу-гау"
 GER_puppet_finland:0 "Забезпечити [FIN.GetAdjective]у лояльність"
 GER_qingdao_reintegrated_modifier:0 "Ціндао реінтегровано"
 GER_rebuild_the_nation2:0 "Відбудова нації"
 GER_rebuild_the_nation_ww_tt:0 "Відкриває рішення: §Y$GER_public_works_modifier$§!"
 GER_reclaim_former_african_colonies_desc:0 "Азія — не єдине місце, де ми колись мали володіння, які потім втратили. Наші території в Африці й понині становлять для нас інтерес, і нам слід зробити все можливе, щоби повернути їх і знову інтегрувати."
 GER_reich_minister_of_economy:0 "Райхсміністр економіки"
 GER_reichskommissariat_australasien_effect_tt:0 "Усі необхідні області, окрім §Y[979.GetName]§!, перейдуть під контроль [RAA.GetNameDef]"
 GER_reichskommissariat_ostasien:0 "Райхскомісаріат Східна Азія"
 GER_reichswerke_democratic:0 "Bundeswerke"
 GER_request_polish_war_participation_desc:0 "Оскільки ми перебуваємо у стані війни з державою [SOV.GetName], ми вимагаємо пропускати наші армії крізь [POL.GetAdjective]у територію. Оскільки ми поклялися захищати їх, цілком природно, що вони приєднаються до нашої війни."
 GER_return_of_the_kaiser_ww:0 "Повернення кайзера"
 GER_reverse_the_brain_drain:0 "Зупинити «відтік мізків»"
 GER_rocket_interceptor_equipment_2:0 "Fliegende Panzerfaust"
 GER_savitri_devi:0 "Савітрі Деві"
 GER_secretary_to_the_fuhrer:0 "Секретар фюрера"
 GER_slovakia_hun_effect_tt:0 "Кожною областю в словацькій зоні інтересів буде нагороджена [HUN.GetNameDef]"
 GER_submarine_1:0 "Тип «UB III»"
 GER_subversive_infiltrators:0 "Диверсанти-розвідники"
 GER_sway_the_balkans_desc:0 "Багато країн на Балканах відчувають загрозу від іноземних держав. Ми повинні запропонувати їм місце в Міттелеуропі, щоб наш союз міг зміцнитися."
 GER_swedish_trade_agreement:0 "Німецько-шведська торговельна угода"
