 medium_battery_advice_tt:0 "\n\nУстановка модулів §YЛегка середня батарея§! або §YСередня батарея§! на §Yкрейсери§! поліпшує їхню §Yатаку легких гармат§! або §Yатаку важких гармат§!, що дозволить їм битися з §Yкораблями прикриття§! та §Yосновними кораблями§!. Установка будь-якої §Yсередньої батареї§! позначить корабель як §Yважкий крейсер§!, у той час як установка тільки §Yлегкої середньої батареї§! позначить корабель як §Yлегкий крейсер§!."
