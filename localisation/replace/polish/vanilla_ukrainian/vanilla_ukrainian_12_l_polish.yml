 GRAND_DOCTRINE_CONVOY_RAIDING_DESC:0 "Приватири сучасної епохи. Непрямий підхід до морської війни, зосереджений на удушенні морської торгівлі, позбавляючи ворога ресурсів, необхідних для ведення війни."
 GREATER_LIT_communism_DEF:0 "Велика литовська народна республіка"
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_ALTERNATE:0 "Кіпр — грецький і завжди буде грецьким. Можливо, раніше, коли британці позбавили нас шансу на об'єднання, ми не були готові, але тепер, коли Кіпр досяг своєї незалежності, настав час виправити помилки минулого! Мрії про самоврядування — помилка, що межує із зарозумілістю. Кіпріотам слід зрозуміти, що під крилом грецької нації їм буде найбезпечніше."
