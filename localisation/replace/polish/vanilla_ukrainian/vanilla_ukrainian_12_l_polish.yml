 GXC_question_chiangs_authority_desc:0 "Чан Кайші останнім часом намагається посилити свій вплив на наші провінції, щоб спробувати приборкати нас. Ми повинні поставити під сумнів, чи справді він має хоч якусь владу над нами, оскільки ми є функціонально незалежними."
