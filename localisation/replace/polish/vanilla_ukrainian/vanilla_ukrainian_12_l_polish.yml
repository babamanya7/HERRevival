 siam.43.a:0 "Ми раді допомогти."
 siam.48.desc:0 "[SIA.GetNameDefCap] офіційно запросив військову допомогу проти сил, що вторглися в їхню країну. Натомість [SIA.GetAdjective] уряд готовий надати фірмам [JAP.GetAdjective] привілейований доступ до стратегічних ресурсів, інфраструктури та комерційних прав.\n\nПідтримка [SIA.GetName] розширила б наш вплив у Південно-Східній Азії та забезпечила б цінні матеріали для Імперії, хоча це також може втягнути нас глибше в регіональні конфлікти."
 siam.6.desc:0 "Прая Сонгсурадета звинувачують у тому, що він був організатором одного або кількох замахів на [SIA_plaek_phibunsongkhram.GetName], а також у плануванні перевороту проти його уряду. Воля уряду полягає в тому, щоб позбавити Сонгсурадета командування та вислати його з країни.\nОднак його арешту завадили військові, лояльні до Сонгсурадета, які назвали арешт політично вмотивованим. Уряд і військова кліка Сонгсурадета зараз перебувають у глухому куті, обидві сторони відмовляються поступатися."
