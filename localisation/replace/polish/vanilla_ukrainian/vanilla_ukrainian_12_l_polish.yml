 denmark_events.2.a:0 "Безпека понад усе"
 denmark_expansion_event.1.t:0 "[FROM.GetNameDefCap] вимагає нашого приєднання"
 denmark_expansion_event.13.desc:0 "Цього ранку ми отримали від [DEN.GetAdjective]ого уряду вимогу передати під його контроль державу [SWE.GetNameDef]. У нас є свої зв'язки з державою [DEN.GetNameDef], адже наші монархи пов'язані родинними узами, але варто пам'ятати, що відмова може призвести до війни з державою [DEN.GetNameDef] незважаючи на кровне родинне споріднення."
 denmark_expansion_event.13.t:0 "[FROM.GetNameDefCap] вимагає [SWE.GetAdjective]і землі"
 denmark_expansion_event.202.t:0 "[FROM.GetNameDefCap] відкидає [ICE.GetAdjective]і претензії"
 denmark_expansion_event.300.a:0 "Ми приймаємо цю щедру пропозицію!"
 denmark_expansion_event.400.desc:0 "Уже багато років [ROOT.GetNameDef] зберігає нейтралітет у всіх війнах, що стрясають земну кулю. У Європі, однак, знову розпалюються пристрасті, і ми повинні поставити собі запитання — а що означає бути нейтральними? Кілька останніх років точками зосередження для нашої країни були Велика Скандинавія і Балтійське море. Важливо вирішити, як ми будуватимемо відносини з цими регіонами далі."
 denmark_expansion_event.800.desc:0 "До нас звернулася [FROM.GetAdjective]а делегація з пропозицією про захист з боку їхньої військової машини. Натомість вони хочуть нашого підпорядкування..."
 denmark_fascist_event.22.desc:0 "Незважаючи на всі наші дипломатичні зусилля, [FROM.GetAdjective]ий уряд вирішив залишити свої технології при собі. Це дуже прикро, адже разом ми могли б розвиватися набагато швидше, ніж поодинці."
 denmark_occupation_event.30.a:0 "Великий успіх!"
 denmark_overlord_events.1.b:0 "Нехай [?DEN.DEN_overlord_nation.GetLeader] отримає наші найкращі побажання"
 denmark_overlord_events.12.a:0 "Соціал-демократ"
 denmark_overlord_events.33.desc:0 "Наш запит до Данії щодо постачання зброї було задоволено. Ми вже отримали першу партію."
 denmark_overlord_events.43.t:0 "[FROM.GetNameDefCap] нав'язує нам повноважного представника"
 denmark_political_events.9.desc:0 "Тепер, коли данські вибори закінчено, ясно, що перемогла демократія. На відміну від зациклених на одній ідеї комуністів або фашистів, демократичні партії не монолітні. У різних партій є різне бачення того, як краще вести державу [Den.GetNameDef] через непрості часи. Питання в тому, кому слід довірити формування нового уряду?"
 denmark_protection_event.101.desc:0 "Дипломати з держави [FROM.GetNameDef] передають нам позицію свого керівництва про нашу пропозицію альянсу. [FROM.GetLeader] погоджується, що якщо ми не почнемо разом зміцнювати оборону, обидві наші держави впадуть, коли війна докотиться до наших земель."
 denmark_resistance_event.12.t:0 "[FROM.GetNameDefCap] погоджується на обмін розвідданими"
 denmark_resistance_event.25.desc:0 "[FROM.GetNameDefCap] недалекоглядно відкидає наш запит на продаж старих есмінців. Такий дурний вчинок не завадить нам посилити свій флот для захисту власних вод. Ми пошукаємо більш зговірливі країни."
 denmark_trade_deal.3.t:0 "[FROM.GetNameDefCap] відхиляє нашу торгову пропозицію"
 denmark_trade_deal.8.desc_war_cancelation_partner:0 "Торгівельна угода з державою [DEN.GetNameDef] скасована через недавню ворожнечу між нашими країнами."
