 idea_INS_netherlands_most_precious_jewel_desc:0 "Нідерландська Ост-Індія була колонією Нідерландів протягом приблизно 350 років, і її адміністрація тісно інтегрована з нідерландським урядом. Ост-Індію часто називають «перлиною в короні Нідерландів», і Нідерланди не виявляють жодного бажання послабити контроль над своєю дорогоцінною перлиною."
