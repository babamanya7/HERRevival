 INSHOL_democracy_desc:0 "Фольксрад розпочав своє життя як напівміра, дорадчий орган із ретельно обмеженими можливостями, покликаний створити видимість представництва, але без його суті. Він переріс своїх творців. Палата буде реорганізована у справжній законодавчий орган, члени якого обиратимуться народом, який він нібито представляє, а рішення якого будуть обов'язковими для уряду, який колись тримав її на короткому повідку."
 INSHOL_elevate_elite_infantry:0 "Спеціальні війська Депо"
 INSHOL_emergency_naval_purchases_desc:0 "Наші береги небезпечні та недостатньо захищені. Час має вирішальне значення, ми повинні отримати сильніший флот, інакше ми обов'язково загинемо. Ми купуватимемо кораблі у приватних компаній в борг і переобладнуватимемо їх на військово-морські есмінці."
 INSHOL_establish_vk_knil:0 "Створити VK-KNIL"
 INSHOL_invite_phillipines_desc:0 "Численні народи нашого союзу розмовляють різними мовами та дотримуються різних традицій, проте майже всі вони простежують своє коріння до малайського світу. Ми повинні реформувати нашу союзну державу в паномалайську конфедерацію, запросивши Філіппіни як країну-члена. Те, що колись було кількома незначними колоніями, тепер стоятиме міцно як регіональна держава Південно-Східної Азії."
 INSHOL_linggadjati_agreement_desc:0 "Вторгнення на Яву виявилося складним, а наша адміністрація стає нестабільною. Ми маємо відступити і діяти від оборони, щоб не ризикувати падінням усієї Республіки. Ми повинні домовитися про локальні припинення вогню з Нідерландами, що дозволить нам реорганізувати наші сили, перш ніж знову зосередитися на Яві."
 INSHOL_modernize_knil_desc:0 "Ми вивчатимемо нові стратегії та доктрини для Ост-Індійської армії, забезпечуючи збереження переваги над ворогом."
