 news.1.c:0 "Усе вірно! Не поступимося й саженем!"
 news.103.c:0 "Когось за це треба розстріляти!"
 news.118.d:0 "Японські війська взяли штурмом Гонолулу, найбільше місто гавайського острова Оагу. Морська база Перл-Гарбор, де раніше базувався тихоокеанський флот США, також впала під їх натиском.\n\nЗа свідченнями очевидців, американські матроси та десантники відступили на острів Форд, де вперто продовжували спротив, який був пригнічений інтенсивним артилерійським вогнем та бомбардуваннями. Тепер, коли острів належить їм, японські ВМС отримали повну свободу дій у Тихому океані."
 news.128.t:0 "Падіння Берліну"
 news.13.a:0 "Мир, але якою ціною?"
 news.13.e:0 "Шкода. Це зайняло б більшовиків."
 news.15.e:0 "Правильно, правильно!"
 news.15.t:0 "Другий Віденський арбітраж"
 news.150.b:0 "Дурні самі вирили собі могилу."
 news.159.d_04:0 "Незважаючи на те, що останніми роками СРСР зосередилився на побудові комунізму в одній окремо взятій країні, інтернаціоналізм цього руху, як і раніше, не визнає державних кордонів. Солідарності працівників всього світу було присвячено промову, яку вимовив сьогодні [From.GetLeader]. У ній було також порушено тему створення альянсу під назвою [From.GetFactionName].\n\nКрім політичних завдань, цей союз переслідує військові цілі і передбачає взаємодопомогу обох держав у разі зовнішньої агресії. Чи стане він для комуністів мечем або щитом — майбутнє покаже."
 news.161.a:0 "Різке рішення"
 news.161.b:0 "Роблять усе можливе, щоб утримати буржуа при владі"
 news.162.d:0 "Після того, як сторони конфлікту нарешті домовилися про поділ країни на дві частини, громадянська війна в Іспанії добігла кінця. Хоча з обох боків чуються голоси незгодних, які засуджують такий компроміс, мирна угода дасть розділеній нації бодай слабкий шанс відновлення сил."
 news.166.d:0 "Включивши Австрію до свого складу, держава [GER.GetName] використала це для виправдання подальших претензій та назвала «правомірним» повернення колишніх австрійських територій, зокрема Словенії, яка зараз належить державі [YUG.GetName].\n\nУ відповідь на це в Лондоні була скликана конференція для обговорення «словенського питання», куди прибули делегати країн, які підписали Версальський договір.\n\nОднак у палкій промові, виступаючи проти німецької загрози європейській стабільності, [YUG.GetLeader] недвозначно заявив, що [YUG.GetName] не відмовиться від навіть дюйма землі, незважаючи на те, що вони повністю на самоті."
 news.167.e:0 "Італія покаже всьому світу на що здатна!"
 news.169.t:0 "Доля Югославії"
 news.174.a:0 "Ми мусимо слідкувати за розробкою."
 news.18.d:0 "Перемовини у Відні щодо територіальної суперечки між державами [HUN.GetNameDef] та [ROM.GetNameDef] були зірвані.\n\n[GER.GetNameDef], який виступав як третейський суддя, виніс рішення про передачу Північної Трансільванії державі [HUN.GetNameDef]. Румунський уряд не ухвалив такий вердикт і відкликав свою делегацію. Судячи з усього, [GER.GetNameDef] поки що не має великого дипломатичного впливу, як би йому цього не хотілося."
 news.194.d:0 "Через невідомі політичні махінації керівництво [Poland.GetName] передало свої східні регіони [From.GetName].\n\nНаразі невідомо, які обіцянки чи погрози були зроблені [From.GetName], щоб досягти цієї політичної перемоги. Можливо, ми ніколи не дізнаємося, оскільки [Poland.GetLeader] ще не сказав жодного слова, окрім оголошення про угоду."
 news.194.t:0 "Східна Польща віддана державі [From.GetName]"
 news.205.t:0 "Pax Americana"
 news.206.b:0 "Ми повинні бути готовими до будь-якого розвитку подій."
 news.210.a:0 "Не можна заперечувати японську сферу впливу"
 news.211.c:0 "Вони не посміють висунути претензцї на наші азійські території."
 news.217.t:0 "[GER.GetNameDefCap] змушує державу [TUR.GetNameDef] приєднатися до [ENG.GetFactionName]"
 news.229.b:0 "Вони повинні були рятуватися, поки був шанс."
 news.238.d:0 "\nУ спробі протистояти зростаючій загрозі проти [ENG.GetAdjective]их володінь у Південно-Східній Азії, колоніальні території Сінгапуру та Борнео були передані до [AST.GetNameDef]. Маючи на меті стати першою і найкращою лінією оборони Співдружності в Тихому океані, [AST.GetNameDef] бере на себе повну відповідальність за військову та адміністративну підготовку на випадок бойових дій в регіоні.\n\nПередбачаючи протистояти імперським амбіціям [JAP.GetNameDef], [AST.GetNameDef] більше не буде повністю залежати від зусиль свого колишнього колоніального володаря щодо захисту своїх берегів від вторгнення."
 news.244.t:0 "[AST.GetNameDefCap] встановлює сферу впливу"
 news.245.c:0 "Разом ми будемо підтримувати стабільність у півкулі."
 news.25.c:0 "Ми мусимо подбати про безпеку кордонів..."
 news.251.t:0 "[CAN.GetNameDefCap] шукає негайної патріації"
 news.252.c:0 "Із цим баланс сил схиляється на нашу користь!"
 news.270.t:0 "Народження [NZL.GetAdjective]ої бронетехніки"
 news.280.b:0 "Чи це кінець Британської імперії?"
 news.281.a:0 "$news.280.a$"
 news.285.a:0 "Можливо, це був єдиний вихід."
 news.288.b:0 "Це нічого не міняє!"
 news.291.c:0 "Вакуум влади імперії ще може бути заповнений..."
 news.293.b:0 "Наша незалежність захищена!"
 news.30.e:0 "Жаль, що не прикінчили мерзотника!"
 news.306.b:0 "Ми мусимо думати швидко..."
 news.309.c:0 "Чи готові ми розлучитися з незалежністю?"
 news.31.b:0 "Німеччина мусить бути вільна від тиранії!"
 news.319.a:0 "Вони побачать, як помилялися."
 news.321.c:0 "Жадібні покидьки."
 news.321.t:0 "Югославія поділена"
 news.326.c:0 "Початок розпаду Югославії?"
 news.331.desc:0 "Після капітуляції свого союзного партнера Данії, ісландський парламент взяв під контроль власні зовнішні відносини і, таким чином, фактично став повністю незалежною державою. Новообраний тимчасовий губернатор вже проголосив нейтралітет Ісландії в нинішньому конфлікті, незважаючи на вторгнення її материнської країни."
 news.332.t:0 "Французький флот капітулював"
 news.333.c:0 "Ми, схоже, недооцінили їх."
 news.336.title:0 "Згадайте Аламо"
 news.409.b:0 "Це не зможе зупинити неминуче."
 no_focus_on_training_spirit:0 "Незосереджність на тренуваннях"
 norwegian_imperial_ambitions:0 "Імперські амбіції Норвеґії"
 nsb_news.10.desc_exiles:0 "Відновлення вигнаним білим рухом боротьби з більшовиками, що здавалося безнадійним, попри всякі очікування обернулося перемогою. [SOV.GetLeader] оголошує, що держава [SOS.GetNameDef] була переможена. десь знаходиться [SOS.GetLeader], невідомо. Ходять чутки, що [SOS.GetLeader.GetSheHe] вже за кордоном, куди вдалося втекти за кілька днів до капітуляції — можливо, ховається де —то у Південній Америці."
 nsb_news.303.d:0 "Після кількох століть російського правління Сибір тепер не просто регіон у складі зарубіжної держави, а окрема політична одиниця, об'єднана і готова відстоювати свої права за всяку ціну. Народ Сибіру радий: дні імперіалізму пораховані, і люди тепер живуть у незалежній державі без іноземної інтервенції. Республіка оголосила, що не має наміру спочивати на лаврах — у Сибіру повно й інших народів, які треба звільнити та захистити за всяку ціну!"
 nsb_news.400.a:0 "Чудова подія!"
 nsb_news.401.desc:0 "Через місяці після легітимізації свого уряду через відновлення Земського собору фашистські елементи в [SOV.GetAdjective]ому уряді вже розпустили новий парламент, і країною тепер керує [SOV.GetLeader]. Нещодавно коронований цар поки що грає суто символічну роль, але вже очевидно, що реальній владі йому дістанеться мало. Після зміни режиму націоналістична риторика помітно підвищилася, раз по раз чутні промови, що вихваляють братерство «слов'янських народів» і засуджують колишні «гріхи» сусідніх країн."
 nsb_news.405.b:0 "З такою силою доведеться рахуватися."
 nsb_news.406.c:0 "Старший брат усіх слов'ян повернувся..."
 nsb_news.5.desc.habsburg:0 "5 листопада 1916 року німецький Вільгельм II і австрійський Франц Йосип підписали спільну декларацію про створення нової держави з польських земель, окупованих Росією, — Королівства Польща. Проте молода держава не змогла знайти оголосив Другу Польську республіку. Тепер же, здається, Польща нарешті знайшла собі короля — ним буде Карл Альбрехт, народжений в аристократичній родині Габсбурґів, служив у польській армії майже стільки ж, скільки існує сама польська держава. і тепер під рев тріумфуючого натовпу він був обраний першим габсбурзьким королем Польщі."
 nsb_news.9.e:0 "Що це означатиме для справи комунізму?"
 nsm_amsterdam_ins:0 "[INS_nsm_amsterdam_name]"
 nuclear_espionage_desc:0 "Наша програма розвитку ядерного озброєння відстає від досліджень інших країн. Треба запланувати операцію з впровадження у закордонні програми та отримання важливих даних та креслень."
