 JUNO_brazil_events.150.desc.a:0 "Бандити Північно-Східної Бразилії, відомі як Канґасу, організували напад на поселення в регіоні. Правоохоронні органи намагаються просунутися у своїх розслідуваннях через те, що місцеві жителі захищають членів групи. Схоже, що для вистеження винуватців знадобиться набагато сильніша присутність сил безпеки в цьому районі."
 JUNO_brazil_events.200.desc:0 "Знову настав сезон виборів, і [ROOT.GetAdjective] народ із завмиранням серця чекає, хто стане наступним Президентом."
