 generic_purchase_old_ships_category_desc:0 "Світ стає все менш стабільним. Ми мусимо розширити наш морський потенціал. На щастя для нас, деякі великі держави можуть погодитися розпрощатися зі своїми старішими суднами."
 generic_refit_civilian_ships_category_desc:0 "Наш флот навіть у мріях не може зрівнятися зі значно більшими ВПС, що нам загрожують. Ми мусимо нашвидкуруч створити більший флот, переобладнуючи цивільні судна для військових цілей."
