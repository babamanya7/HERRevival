 GOE_RAJ.10.b:0 "Нам доведеться порушити нашу клятву"
 GOE_RAJ.12.a:0 "Ті, хто порушив клятву!"
 GOE_RAJ.30.desc:0 "Після століть правління [ENG.GetAdjective] адміністрація нарешті залишає Індію. Чиновники пакують свої офіси, колоніальні адміністратори складають свої останні звіти, а «Юніон Джек» спущено з урядових будівель. Однак перехід далеко не гладкий; питання щодо кордонів та військового контролю залишаються невирішеними, що спричиняє деяку затримку в остаточній Незалежності."
 GOE_RAJ.33.c:0 "До перемоги!"
 GOE_RAJ.35.desc:0 "Без жодного пострілу Радж перестає існувати. Ми зміцнили контроль над Індією, і Уряд Його Величності, втомлений від тягаря імперії, вирішив не втручатися."
 GOE_RAJ.41.desc:0 "Індійські війська захопили прикордонні землі. Пакистанські сили відступили після важких боїв, і над регіоном тепер майорять комуністичні прапори. Індійські радіопередачі називають це тріумфом народу."
 GOE_RAJ.5.desc:0 "[FROM.GetName] відхилив наші вимоги, наголошуючи, що це незалежне Королівство зі своїми власними правилами та занепокоєннями."
 GOE_RAJ.6.desc:0 "[FROM.GetName] прийняла наші вимоги, фактично перетворивши свою країну на підконтрольну державу."
 GOE_RAJ_eic.6.a:0 "Ми не бажаємо продавати цю землю"
