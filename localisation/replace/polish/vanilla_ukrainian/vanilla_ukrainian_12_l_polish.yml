 JAP_ensure_cross_party_support_desc:0 "Тепер, коли коаліція формується, ми повинні докласти зусиль, щоб здобути підтримку й інших партій, аби ми не розсипалися перед лицем труднощів. Разом ми зможемо повернути дух демократії Тайшьо!"
