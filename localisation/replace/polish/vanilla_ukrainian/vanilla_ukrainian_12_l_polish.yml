 PEACE_DEMILITARIZED_ZONE_DESC:0 "Запобігти будівництву нових укріплень і не дати дивізіям переміщатися через доступні для цього області протягом $NUM_DAYS|H$ дн."
 PEACE_DONE_DESC:0 "Коли ви клацнете по цій кнопці, ви покинете мирні переговори. Абиякі дії, які ви вже зробили, лишаться дійсними, але зможуть бути §Rоспорені§! якщо інші члени конференції все ще висувають вимоги. Якщо це станеться, вас затягне назад.\n\nСкористайтеся цією кнопкою, якщо ви задоволені своїми здобутками й хочете вийти."
 PEACE_LIBERATE_TO_COUNTRY_LABEL:0 "Звільнити на користь: $COUNTRY$"
 PEACE_PEACE_CONFERENCE:0 "Мирна конференція"
