 SPR_a_frontline_suited_for_intellectuals_desc:0 "Це марна трата наших найясніших умів на боротьбу з фашистами на передовій — набагато краще їх можна використовувати далеко за лінією; створення нових засобів ведення війни, які принесуть нашій боротьбі набагато більше користі, ніж кілька додаткових солдатів, можливо."
 SPR_an_army_of_all_classes_desc:0 "Перед обличчям фашистської загрози клас не має значення. Ми сформуємо армію, в якій зможуть служити всі, і водночас познайомимо їх зі здоровими соціалістичними цінностями, якими дорожать їхні співвітчизники."
