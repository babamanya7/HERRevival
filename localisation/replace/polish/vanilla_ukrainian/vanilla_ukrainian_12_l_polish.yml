 GRE_subjugating_the_bulgarians_desc:0 "Болгари — наші вічні вороги. Їхня єдина мета — встромити ніж нам у спину. Їхня жалюгідна цивілізація не досягла нічого, і тому вони при кожній нагоді намагаються принизити нас і нашу спадщину. Годі! Настав час нагадати болгарам, чому ми — одна з найдавніших націй Європи."
