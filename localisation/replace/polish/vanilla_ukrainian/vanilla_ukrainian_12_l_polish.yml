 INS_revolution_events.3.a:0 "Борнео буде необхідною жертвою."
 INS_revolution_events.30.desc:0 "[INS.GetLeader] запропонував локальне припинення вогню в [FROM.GetName], пообіцявши вивести свої війська з [FROM.GetName], якщо ми погодимося, дозволивши нашим військам відновити контроль над регіоном. Однак це за умови, що ми тимчасово відкладемо наші великі військові операції, давши революціонерам час на планування."
