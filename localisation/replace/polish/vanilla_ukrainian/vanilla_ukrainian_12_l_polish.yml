 SWE_fighter_equipment_2:0 "J 22A"
 SWE_form_saab:0 "Створити SAAB"
 SWE_increase_intelligence_funding_desc:0 "Останніми роками [SWE.capital.GetCapitalVictoryPointName] став центром шпигунської діяльності. Ми повинні збільшити фінансування нашої розвідувальної служби, щоб вони могли розробляти нові технології та брати активнішу роль у моніторингу такої діяльності, перш ніж вона загрожуватиме нашим інтересам.."
 SWE_individual_liberty_and_prosperity_for_all:0 "Зменшення рівня бідності"
 SWE_join_the_anti_soviet_pact_tt:0 "Ми встановимо сфери інтересів із [GER.GetName], що зробить їх дуже малоймовірними для нападу на §Y[DEN.GetName]§! та §Y[NOR.GetName]§! протягом §Y2 років§!"
 SWE_karnvapenprogram_bonus:0 "Бонус програми ядерної зброї"
 SWE_kp_bill_desc:0 "Останні події на полі бою продемонстрували необхідність можливості швидко передислокувати війська туди, де вони потрібні. Поки що ми використовували цивільні адаптовані вантажівки для виконання цього завдання, але спеціально створений броньований транспорт був би набагато ефективнішим у бій."
 SWE_light_cruiser_1:0 "Клас «Fylgia»"
