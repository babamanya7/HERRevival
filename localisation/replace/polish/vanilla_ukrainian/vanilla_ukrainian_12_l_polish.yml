 JAP_f_go_nuclear_project_desc:0 "Наше морське командування бажає розпочати програму ядерних досліджень з надією використати потужність цієї технології для нашого флоту. Вони запропонували здійснити це під керівництвом Бунсаку Аракацу в Імператорському університеті Кіото. До його команди входить Хідекі Юкава, видатний теоретик, який напевно досягне необхідних нам проривів."
 JAP_first_strike_blocked_due_to_kwantung_army_tt:0 "Через §Rнезапланований наступ§! Квантунської армії ми не отримаємо бонус §Y$JAP_first_strike_principle_dm$§!"
 JAP_found_the_boeitai:0 "Заснувати Боейтай"
 JAP_found_the_great_japan_press_association_desc:0 "Бюро розвідки при Кабінеті міністрів винайшло спосіб ефективніше скеровувати наше населення у правильному напрямку. Сформувавши Асоціацію преси Великої Японії, ми зможемо через один офіс контролювати всі засоби масової інформації в країні, ефективно піддаючи цензурі будь-яку необхідну інформацію та поширюючи патріотичну пропаганду серед тих, хто може її потребувати."
 JAP_government_faction_tier_4:0 "$JAP_imperial_influence_tier_4$ $JAP_government_faction$"
 JAP_heavy_cruiser_4_desc:0 "Важкі крейсери класу «Ibuki» були останніми крейсерами, побудованими Японією до кінця війни. Вони були вдосконаленими версіями важких крейсерів класу «Mogami», мали таку ж компоновку і озброєння, але з більш сучасною зенітно-ракетною зброєю і двигунами."
