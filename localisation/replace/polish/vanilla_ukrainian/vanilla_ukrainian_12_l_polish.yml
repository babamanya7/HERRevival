 DEN_protect_greenland_desc:0 "Ґренландія була частиною нашого королівства протягом тривалого часу, і претензії на острів сягають корінням ще в епоху вікінґів. Втрата цього острова стала б національною катастрофою і величезною втратою престижу. Щоби стримати абиякий можливий напад на острів, ми мусимо зміцнити його оборону."
