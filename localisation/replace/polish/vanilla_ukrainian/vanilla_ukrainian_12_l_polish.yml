 DEN_buy_foreign_ships_desc:0 "Щоб захистити узбережжя [DEN.GetNameDef] і багато островів, ми повинні спочатку забезпечити собі боєздатний флот, який зможе захистити наші морські шляхи. Тихо наблизившись до країн, які можуть співчувати нашому становищу, ми зможемо придбати у них старі есмінці, щоб зміцнити власний флот."
 DEN_carl_hammerich:0 "Карл Гаммерік"
 DEN_danish_brigade_template_tt:0 "Створює шаблон §YDanske Brigade§!"
 DEN_danish_licensing_ns_desc:0 "У світі, де торгівля й комерція є необхідністю між країнами, добре мати тісних торговельних партнерів. Ця угода принесе вигоду обом країнам і зміцнить зв’язок між нами."
 DEN_declaration_of_neutrality_desc:0 "Данії вдавалося залишатися осторонь війн протягом десятиліть, і це стало можливим лише завдяки нашій політиці нейтралітету. Вона добре нам служила й надалі служитиме."
 DEN_denmark_becomes_a_puppet_tt:0 "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! отримає можливість спробувати стати маріонеткою, якщо сильніша сусідня країна вторгнеться, зберігаючи при цьому свою поточну форму правління\n\n"
 DEN_expand_dansk_industri_syndikat:0 "Розширити Dansk Industri Syndikat"
 DEN_expand_dansk_industri_syndikat_desc:0 "Dansk Industri Syndikat, або Riffelsyndikatet, як його ще називають, є найбільшим виробником зброї в країні і виробляє гвинтівки Madsen, які стоять на озброєнні нашої армії. Інвестиції в розширення його заводів є надзвичайно важливими з точки зору національної безпеки."
