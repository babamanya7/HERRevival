 SPA_the_will_to_empire_desc:0 "У нас є рішучість побудувати Імперію. Ми стверджуємо, що історичне досягнення Іспанії полягає в імперії. Ми претендуємо на провідне становище Іспанії в Європі та проголошуємо, що Іспанія й надалі залишатиметься духовною віссю, яка об'єднує латиноамериканський світ."
