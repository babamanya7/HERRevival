 germany.124.t:0 "[From.GetNameDefCap] передає Судети"
 germany.20.d:0 "Визнаючи, що в Європі тепер встановлено новий порядок, Угорщина та Румунія попросили нас провести арбітраж у рамках територіального спору між двома країнами. Трансільванія була відібрана в Угорщини та приєднана до Румунії в результаті однієї з багатьох непродуманих змін, зроблених у Версалі. Чи варто передати Трансільванію або лише північну частину під угорський контроль?"
