 INS_limited_war_malaya:0 "Конфронтація!"
 INS_local_unity_desc:0 "Ми надамо часткову автономію князівським державам як тимчасовий захід для зменшення внутрішніх конфліктів у ці й без того неспокійні часи."
 INS_loyalist_events.19.a:0 "Нехай проводять своє голосування."
 INS_loyalist_events.20.desc:0 "Австралійці погодилися провести референдум. Кожен округ у східному Папуа дав однаковий результат. Наші інвестиції в західну половину острова говорили голосніше, ніж будь-який передвиборчий плакат."
 INS_loyalist_events.30.desc:0 "Скриньки для голосування були підраховані, і агітатори [FROM.FROM.GetAdjective] відправлені геть. Народ [FROM.GetAdjective] проголосував за те, щоб залишитися. Незалежність, здається, все ще має значення в [FROM.Capital.GetCapitalVictoryPointName]."
 INS_loyalist_events.9.desc:0 "Референдум у [FROM.GetName] завершився. Народ [FROM.GetAdjective] проголосував за те, щоб залишитися під нашим управлінням. Агітатори [FROM.FROM.GetAdjective] поїхали."
 INS_medium_tank_equipment_2_short:0 "GVT-4"
