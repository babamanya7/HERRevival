 mtg_usa_civil_war_fascists.16.a:0 "Абсурдний та антиамериканський крок."
 mtg_usa_foreign_support.10.a:0 "Справжні [USA.GetAdjective] герої"
 mtg_usa_foreign_support.16.a:0 "За день корабель не побудувати."
 mtg_usa_foreign_support.17.desc:0 "Незважаючи на приватну зустріч з лідером [From.GetLeader], нашим агентам у державі [From.GetNameDef] повідомили, що [From.GetAdjective] уряд не може виділити гроші, щоби допомогти нам придбати кораблі."
 murder_trotsky_infiltration_outcome:0 "Наш агент успішно завоював довіру Троцького та його охоронців, скориставшись підробленим паспортом."
