 INS_the_peoples_security_army_desc:0 "Наші члени, які в основному є молодими індонезійцями, втрачають терпіння, прагнучи зробити свій внесок і боротися за нашу Незалежність. Ми повинні створити Революційні збройні сили і почати тренувати наших майбутніх солдатів."
