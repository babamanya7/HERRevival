 CHI_prosecute_cronyism:0 "Переслідувати кумівство"
 CHI_protracted_warfare_idea_desc:0 "Деякі армії вважають, що стрімкий удар виграє всі війни, а інші розуміють, що позбавлення їх цього означає руйнування їхньої волі. Протримавшись довше завдяки оборонній позиції, будь-який загарбник буде відбитий."
 CHI_punish_the_signatories_desc:0 "Шкода, завдана західними людьми нашій нації, є незліченною. Вона залишила нас пригнобленими. Їм треба дати зрозуміти, що вони зробили, і змусити почати виплачувати свій історичний борг."
 CHI_rapprochement_with_soviet_union_desc:0 "Нехай у нас є деякі ідеологічні розбіжності з СРСР, останнім часом стало очевидним, що й спільних інтересів теж достатньо. Нам слід формально закріпити наші відносини та укласти договір про ненапад, щоб продемонструвати всьому світу нашу єдність."
 CHI_refugee_relief_agency_desc:0 "Війна позбавила даху над головою мільйони людей. Ми створимо організацію, яка допомагатиме їм шукати новий притулок."
 CHI_relocate_factories_from_the_coast_desc:0 "Ми маємо серйозну стратегічну головоломку. Наші промислові центри розташовані вздовж узбережжя і ризикують потрапити до рук ворога. Без виробництва не можна очікувати, що опір триватиме довго. Ми перемістимо наше виробництво вглиб країни, де воно буде в безпеці."
 CHI_renounce_the_mcmahon_line:0 "Денонсація лінії МакМагона"
 CHI_reshuffle_the_green_gang_desc:0 "Ду Великі Вуха добре служив нам, але також став занадто впливовим. Коли вороги оточують нас, нам потрібні більш прямі дії. Можливо, настав час комусь іншому керувати Зеленою бандою?"
 CHI_rural_reconstruction_movement:0 "Рух перебудови сіл"
