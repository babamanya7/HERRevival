 URG_a_new_constitution_desc:0 "Нинішня конституція є непрацездатною. Нам потрібна нова, щоб просунути країну в нову еру."
 URG_conaprole_desc:0 "Молоко корисне, повно поживних речовин і його багато, і ми є ідеальною країною для його експлуатації. Національний кооператив виробників молока матиме монополію на молочні продукти та пов'язану з ними інфраструктуру, сприяючи зростанню країни."
 URG_generic_fascist_demagogue:0 "Луїс Сантьяго Регера"
