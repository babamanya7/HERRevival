 FRA_bomber_focus:0 "Акцент на бомбардувальники"
 FRA_carry_the_revolution_north_desc:0 "За Ла-Маншем лежить батьківщина промислової революції, а разом з нею й дім сучасного капіталізму. Ми не можемо допустити, щоб це місце стало плацдармом для контрреволюційного ворога."
 FRA_compensate_italy_desc:0 "У минулому конфлікти на деяких крихітних ділянках пустелі втягували наші нації в конфлікт. Таку нісенітницю легко зупинити, і можна швидко знайти взаємоприємний результат."
 FRA_concessions_to_italy_desc:0 "Італія все ще мріє про імперію в Африці. Якби ми запропонували деякі поступки — і схвалили б її завоювання Ефіопії — ми могли б запобігти формуванню осі між Римом і Берліном."
 FRA_cv_CAS_equipment_2_short:0 "LN.401"
 FRA_destroy_the_counter_revolution_desc:0 "Навіть зараз деякі люди у Франції готуються встромити кинджал у спину власного народу, коли той виявляє хоч секунду слабкості. Ми їм не дамо, і вдаримо першими."
 FRA_diplomatic_freedom_desc:0 "Республіканські уряди прикували себе до штучних конструкцій у Східній Європі, які впадуть, як тільки ми відкликаємо нашу допомогу. Вони є зобов'язаннями, а не активами, тому ми позбавляємося від них."
 FRA_force_the_issue:0 "Форсувати проблему"
 FRA_grow_the_empire:0 "Розвиток імперії"
 FRA_humanite_unie_desc:0 "Хватка розжирілих банкірів і жадібних до влади демагогів стискується. З кожним днем все більше людей стають рабами: світ занурюється в кризу, спричинену жадібністю індивідуалістів. Наразі французькі ідеї потрібні, як ніколи! Ми маємо об'єднати людство!"
 FRA_indochina_intervention.2.desc:0 "Після важких боїв на неймовірно складній місцевості, союзне командування в регіоні оголосило про припинення операції. Оскільки ситуація з постачанням передових підрозділів ставала дедалі гіршою, а опір Віші посилювався, союзні війська вирішили відступити і консолідуватися, залишивши Віші контроль над територією."
 FRA_industrial_expansion:0 "Промислове розширення"
 FRA_instigate_workers_revolution_germany:0 "Спровокувати робочу революцію в Німеччині"
 FRA_intervene_on_side_of_FROM:0 "Втрутитися на боці держави [From.GetNameDef]"
 FRA_intervention_in_west_africa:0 "Інтервенція в Західну Африку"
 FRA_invest_in_our_weaker_allies_desc:0 "Якщо ми хочемо мати спроможних союзників у разі війни, ми мусимо дати їм можливість задовольняти власні військові потреби. Програма помірних інвестицій у свою промисловість дозволить їм виробляти необхідні боєприпаси на місці."
 FRA_joseph_doumenc:0 "Joseph Doumenc"
 FRA_light_cruiser_4_desc:0 "«Colbert» був зенітним легким крейсером, спущеним на воду в 1956 році. Цей крейсер типу «Colbert» був побудований дуже схожим на післявоєнний «De Grasse», оснащений важким зенітним озброєнням як для дальньої, так і для малої дистанції. Різниця між Colbert і DeGrasse полягає в тому, що Colbert мав менші двигуни, тоншу броню і був трохи меншим."
 FRA_light_tank_equipment_3_short:0 "AMX 12t"
 FRA_mechanized_equipment_3:0 "AMX-VCI"
 FRA_methodical_battle_desc:0 "Деякі стверджують, що битва — це хаос, але вони дурні. Битва — це не що інше, як методичне застосування правильних інструментів на основі загального плану. Плануйте добре, і наміри ворога також можуть бути історичною виноскою."
 FRA_national_council_of_the_resistance_desc:0 "Спротив у Франції стає все сильнішим і сильнішим, і він став настільки потужним, що йому потрібен новий керівний комітет для координації його діяльності."
 FRA_political_unity:0 "Політична єдність"
 FRA_reform_the_labour_laws_desc:0 "Робітники Франції працюють у важких умовах, з низькою оплатою та невеликими пільгами. Настав час запровадити комплексний пакет реформ, щоби поліпшити їх долю."
 FRA_renault_organization:0 "$renault_fra$"
 FRA_return_to_borodino:0 "Повернутися в Бородіно"
 FRA_sp_rockets_medium_range_ballistic_missile:0 "Проєкт «SSBS S1»"
 FRA_strengthen_the_little_entente_desc:0 "Мала Антанта зобов'язує нас прийти на допомогу нашим союзникам у Східній Європі та на Балканах. Ми дозволили цьому союзу розпатися, але зараз він потрібен як ніколи. Настав час його відродити."
 FRA_support_the_right:0 "Підтримати правих"
 FRA_unite_the_crowns_desc:0 "Коли Іспанія була забезпечена, ми можемо об'єднати корони та створити нове королівство, Королівство Франко-Іспанія."
