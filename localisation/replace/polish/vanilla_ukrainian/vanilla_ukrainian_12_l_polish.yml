 CZE_seek_french_leadership_desc:0 "Незважаючи на нашу ініціативу щодо створення цього альянсу, очевидно, що армія [FRA.GetNonIdeologyName] була б чудовим доповненням до будь-якого союзу. Навіть якщо це означатиме поступку лідерством."
