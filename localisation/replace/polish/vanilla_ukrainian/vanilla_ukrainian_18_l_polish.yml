 INS_allow_local_autonomy_desc:0 "Система Форстенланден, яка надавала князівствам самоврядування, значно полегшила керування націоналістичними рухами та підвищила стабільність нації в цілому. Ми повинні ще більше підвищити рівень автономії, наданої князівствам, дозволяючи уряду зосередитися на більш важливих справах."
 INS_bangka_bauxite_export_flag_removed_tt:0 "§Y$INS_bauxite_export$§!: завершено протягом §Y365§! або більше днів. Поточна кількість днів: [?INS_bangka_bauxite_export_flag:days|Y0]"
 INS_bauxite_export_desc:0 "Завершення проєкту Банка залишило нас із більшою кількістю сирих бокситів, ніж ми знаємо, що з ними робити. Спроба продати все це була б важкою, але ми могли б запропонувати значно нижчу ціну за боксити, ніж будь-хто інший на ринку, гарантуючи, що кожен грам буде продано. Через величезну кількість бокситів, яку ми можемо продати, це все одно принесе пропорційне зростання прибутку порівняно з нашим поточним експортом."
 INS_chaos_events.4.c:0 "Скасувати республіку, Тан Малака приведе нас до перемоги!"
 INS_cost_text_rubber_120_blocked:0 "£resources_strip|3 §R120§!"
 INS_deescalate_the_conflict_desc:0 "Нідерландці не вестимуть з нами сумлінних переговорів. Для них ми залишаємося повстанцями, незручністю, яку потрібно придушити, а не нацією, з якою варто рахуватися. Але великі держави світу — це зовсім інша справа, і Гаага не може так просто відмахнутися від них. Ми звернемося до міжнародної спільноти з проханням про посередництво, і нехай іноземний тиск змусить зробити те, чого не може наш власний голос."
 INS_dutch_events.2.a:0 "Разом ми втримаємо Тихий океан."
 INS_dutch_events.4.a:0 "Твердий крок до взаємного виживання."
 INS_dutch_events.4.desc:0 "[HOL.GetNameDefCap] оголосили про створення Військово-морської програми [HOL.GetName]-[INS.GetName], спільної ініціативи з реорганізації та розширення наших морських сил. Експертиза [HOL.GetAdjective] та робоча сила [INS.GetAdjective] разом сформують основу нової тихоокеанської оборонної мережі."
 INS_embezzlement_scheme_in_batavia:0 "Схема розкрадання в Батавії"
 INS_fighter_equipment_1:0 "Fokker D.XXI"
 INS_infiltrate_the_army:0 "Проникнення в армію"
 INS_japanese_export_contracts:0 "Один торговий контракт, щоб правити всіма"
 INS_kalimantan_mic_desc:0 "Наші зусилля з розвитку інфраструктури на Калімантані принесли свої плоди. Поширення електрики та зв'язку зблизило нас із громадами, які раніше перебували далеко за межами досяжності уряду. Ми можемо скористатися цією можливістю для задоволення наших потреб у збільшенні військового виробництва, побудувавши нові заводи в регіоні та укомплектувавши їх цією новою робочою силою."
 INS_launch_feint_uprising_desc:0 "Ми використаємо наші місцеві зв'язки, щоб озброїти людей і відправити їх сіяти безлад, тим самим привертаючи увагу військових. Їхнє приречене повстання стане героїчною жертвою заради нашої справи."
 INS_limited_war_events.4.a:0 "Тоді нехай говорять гармати."
 INS_limited_war_events.8.desc:0 "[FROM.GetName] відповіла на нашу пропозицію зухвальством. Їхні міністри проголошують, що вони краще побачать, як кожен кампонг від Пенанга до Джохора спалять дотла, ніж поступляться Республіці хоч однією концесією. Отже, війна триває."
