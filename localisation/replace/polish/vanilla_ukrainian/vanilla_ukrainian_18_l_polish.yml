 WW_hungary.104.desc:0 "Імпульсивний [FROM.GetLeader] звинуватив нас у незаконному контролі над хорватськими землями. Тепер ми отримали ультиматум і бачимо, як війська стягуються до кордону. Як відповімо?"
 WW_hungary.118.desc:0 "Керівництво [FROM.GetNameDef] публічно підтримало результати референдуму в [45.GetName], заявивши, що поважає право народу на самовизначення й не має наміру чинити опір волі більшості."
 WW_hungary.118.t:0 "[FROM.GetNameDefCap] приймає результати референдуму"
 WW_hungary.119.a:0 "Ми змушені це прийняти"
 WW_hungary.122.t:0 "[FROM.GetNameDefCap] оголошує референдум нелегітимним"
 WW_hungary.13.a:0 "Вони ще пожалкують про це!"
 WW_hungary.13.desc:0 "Хоча це й не стало несподіванкою, але нерозумний [FROM.GetLeader] з [FROM.GetNameDef] наказав привести війська в бойову готовність після отримання нашого ультиматуму та надіслав посланника з заявою, що не відступить ні на крок у цьому питанні."
 WW_hungary.15.desc:0 "\n[FROM.GetNameDef] погодився передати нам Воєводину. Наші війська повністю взяли регіон під контроль, і інтеграція почнеться найближчим часом."
 WW_hungary.21.a:0 "Чудово"
 WW_hungary.25.a:0 "Вони ще пожалкують про це!"
 WW_hungary.32.t:0 "[FROM.GetLeader] вимагає відновити правління Габсбургів"
 WW_hungary.37.a:0 "Не судилося"
 WW_hungary.37.t:0 "[FROM.GetNameDefCap] зневажає нас"
 WW_hungary.54.desc:0 "[FROM.GetNameDefCap] призначив Василя Вишиваного (фон Габсбурга) новим королем нашої нації. Це безумовно зміцнить наш режим."
 WW_hungary.6.a:0 "По конях!"
 WW_hungary.61.t:0 "[FROM.GetNameDefCap] відновлює династію Ітурбіде"
 WW_hungary.64.desc:0 "Дегенеративне керівництво [FROM.GetNameDef] вирішило залишитися при владі, вважаючи себе розумнішими за монарха, обраного богом. Ми усунемо їх і посадимо Марію Хосефу Софію де Ітурбіде на трон, хочуть вони того чи ні!"
 WW_hungary.69.a:0 "Ми з радістю приєднаємось"
 WW_hungary.70.a:0 "Вони зробили правильний вибір"
 WW_hungary.72.t:0 "[FROM.GetNameDefCap] вимагає Сілезькі території"
