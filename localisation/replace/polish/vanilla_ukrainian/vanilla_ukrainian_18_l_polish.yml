 ICE_iceland_defense_force_desc:0 "З американською допомогою Ісландія може побудувати сучасну армію. Вони мають знання, досвід і людські ресурси, щоб тренувати наші війська. Спільна з ними розбудова війська має потенціал зробити наші підрозділи справді елітними силами."
