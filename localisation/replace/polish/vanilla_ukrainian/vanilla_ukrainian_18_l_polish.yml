 CZE_motorized_rocket_equipment_1:0 "130mm raketomet RK-2"
 CZE_national_fascism:0 "Національний фашизм"
 CZE_opl_exercises:0 "Навчання OPL"
 CZE_reintegrate_cross_border_rail_connections_flag:0 "Транскордонне залізничне сполучення було покращено"
 CZE_revive_the_czechoslovak_legion_dynamic_desc:0 "У світі знову назрівають заворушення, і хоробрі солдати [ROOT.GetNameDef] готові стати на захист батьківщини. Але як довело минуле, захист батьківщини іноді вимагає, щоб наші війська, воюючи за кордоном, знову знайшли тих, хто готовий покинути свій дім саме заради його захисту."
 CZE_sergej_ingr:0 "Серґ'єй Інгр"
 CZE_skoda_shipyards_organization:0 "$CZE_skoda_shipyards$"
 CZE_skoda_weapon_sales_dummy_idea:0 "Прибуток від продажу зброї"
 CZE_three_kings_desc:0 "Офіційна допомога нашим групам опору значно підвищить їхню здатність завдавати шкоди ворожій армії. Це також може допомогти і нашій армії на полі бою."
 DEFAULT_DIV_TEMPL_SYMBOL:0 "Стандартний символ"
 DEN_BLITZKRIEG_DESC:0 "Данія перебуває в небезпечній ситуації, маючи занедбану армію, бюджет якої скорочується рік за роком у намаганні заспокоїти набагато більшого і сильнішого сусіда — Німеччину.\n\nОднак умиротворення не завадило Німецькому Райху зміцнити свою владу в Європі і висунути претензії до інших країн. Тепер Данія повинна покластися на свою декларацію про нейтралітет, яка врятувала її від руйнівної Великої війни."
 DEN_VICTORY_POINTS_317:0 "Фленсборг"
 DEN_aage_vedel:0 "О. Г. Ведель"
 DEN_aalborg_portland_cement_plant_desc:0 "Континентальна Данія бідна на природні ресурси, але виробництво цементу — один з наших активів. Розширення Ольборзького портландцементного заводу забезпечило б нам внутрішні будівельні можливості."
 DEN_assault_troops_desc:0 "Хоча армія може утримувати лінію фронту і потроху відтісняти наших ворогів, саме завдяки силі наших елітних військ ми знайдемо міць, необхідну для знищення будь-якої загрози, з якою ми зіткнемося. Ми повинні приділяти пріоритетну увагу їхній підготовці і забезпечити наявність слухняних, дисциплінованих спецпризначенців, які чекають у резерві."
 DEN_autonomy_high_range:0 "Високий рівень автономії"
 DEN_baltic_sea_domination_desc:0 "До виникнення Російської імперії, і навіть до недовготривалої Шведської імперії, Данія прагнула домінувати на Балтійському морі. Щоб по-справжньому забезпечити нашу незалежність і захистити нашу батьківщину, ми повинні знову прагнути контролювати все Балтійське море за допомогою військово-морського панування."
 DEN_bop_defend_our_chosen_path_rearmament:0 "£BoP_right_texticon Захистити наш обраний шлях"
 DEN_bop_occupation_allow_fascism:0 "£BoP_left_texticon Дозволити фашизм"
 DEN_bop_occupation_remove_political_agitator:0 "£BoP_left_texticon Усунути політичних агітаторів"
 DEN_bop_occupation_sabotage_civ_industry_desc:0 "Наші вітчизняні фабрики та промислові підприємства змушені виробляти та допомагати [?DEN.DEN_overlord_nation.GetNameDef] різними матеріалами, матеріалами, які використовуються у їхній війні. Саботуючи ці фабрики, матеріальні поставки зменшаться, що зашкодить німецьким військовим зусиллям."
 DEN_cic_to_overlord_5_or_more_tt:0 "§Y$DEN_occupation_laws_dynamic_modifier$§! забезпечує щонайменше §G+5.00%§! цивільної промисловості для володаря"
 DEN_denmark_first_desc:0 "Ми так далеко зайшли завдяки власним заслугам, тож навіщо нам звертатися за підтримкою до будь-якої з великих держав? Замість цього, [DEN.GetNameDef] буде стояти на власних двох ногах і стане такою ж важливою, як і інші великі фракції світу. Længe leve Danmark!"
 DEN_development_category_desc:0 "Щоби подолати майбутні фінансові та сільськогосподарські кризи, ми повинні інвестувати в наші регіони та диверсифікувати їх, щоб зробити їх стійкими та продуктивними."
 DEN_economic_crisis_dynamic_modifier_desc:0 "Велика депресія вдарила по нас з усією силою. Як наслідок, падіння попиту на сільськогосподарську продукцію означало для багатьох фермерів борги та вилучення майна, а стрімке зростання безробіття стало живильним середовищем для екстремістських рухів на політичній периферії. "
 DEN_finish_off_finland_desc:0 "Наші інтереси в Північній Скандинавії завжди будуть під загрозою, якщо ми не убезпечимо наш східний фланг. Ми повинні вжити превентивних заходів для захисту фінських територій!"
 DEN_form_the_danish_freedom_council_desc:0 "Ми повинні зібрати широку коаліцію на підтримку всіх політичних партій, які виступають проти окупації [?DEN.DEN_overlord_nation.GetNameDef], щоб сформувати Раду. Ця Рада Свободи могла б більш ефективно координувати різні рухи опору, які піднялися після вторгнення, а також могла б координувати будь-яку можливу війну за незалежність."
 DEN_fortify_the_islands_desc:0 "Вся Східна Данія лежить на сотнях островів, і наш флот недостатньо великий, щоб захистити їх усі від набагато більших флотів наших сусідів. Побудувавши берегові укріплення у ключових місцях, ми зможемо дати відсіч можливим загарбникам."
 DEN_heavy_cruiser_1:0 "Клас «Herluf Trolle»"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved_desc:0 "$DEN_industrial_capability_dynamic_modifier_max_improved_desc$"
 DEN_launches_destroyers_tt:0 "[DEN.GetNameDefCap] запустить усі свої придбані есмінці"
 DEN_modify_danish_resistance_dynamic_modifier:0 "Змінити §Y$DEN_resistance_dynamic_modifier$§! на"
 DEN_neutrality_party_long:0 "Фермерська партія"
 DEN_offer_protection_category:0 "Запропонувати данський захист"
 DEN_orlogsvaerftet_organization:0 "Orlogsværftet"
 DEN_prioritize_navy_desc:0 "Наші території — це лише невеликий півострів, і тому дуже важливо, щоб ми визначили пріоритети розвитку нашого флоту в очікуванні. Одного дня [DEN.GetAdjective]і ВМС зможуть конкурувати з [ENG.GetAdjective]ими або [JAP.GetAdjective]ими, але тільки якщо ми витрачатимемо час і гроші на їхнє вдосконалення."
 DEN_protect_bornholm:0 "Захист Борнгольму"
 DEN_refit_civilian_ships_desc:0 "Нас оточують країни, які мають набагато потужніші військово-морські сили, ніж ми. Нам потрібно нарощувати наші сили, якщо ми хочемо зрівнятися з їхніми можливостями. Маючи достатньо кораблів, ми зможемо стримувати більшість флотів."
 DEN_remove_economic_crisis_in_730_days_tt:0 "§Y$DEN_economic_crisis_dynamic_modifier$§! буде видалено через 730 днів"
 DEN_remove_two_offmap_civ_tt:0 "Буде видалено §R2§! §Yцивільні заводи§! поза мапою."
 DEN_reorient_production_lines_desc:0 "Ми опинилися в небезпечній ситуації, коли дуже скоро нам може знадобитися більше військової техніки. Щоби задовольнити цю зростаючу потребу у військовому озброєнні, нам потрібно перепрофілювати цивільні заводи на виробництво зброї."
 DEN_request_the_return_of_the_faroes:0 "Запит на повернення Фарерських островів"
 DEN_resistance_category:0 "Данський рух опору"
 DEN_sanction_sabotages:0 "Саботаж санкцій"
 DEN_securing_sweden_ns_desc:0 "Шведи колись були частиною Кальмарської унії та під владою Данії. Час настав повернути Швецію в наше Царство. Наша армія ретельно готувалася до цього дня, щоб дати відсіч будь-яким ворожим силам Швеції."
 DEN_seize_the_production:0 "Захоплення засобів виробництва"
 DEN_side_with_industry:0 "Стати на бік бізнесу"
 DEN_sovaernets_operative_kommando_desc:0 "Нам потрібна компетентна центральна командна структура, яка зможе ефективно координувати наші військово-морські сили. Довіряти цю функцію слід лише найкращим і найздібнішим офіцерам."
 DEN_support_bornholms_industries_desc:0 "Хоча Борнгольм не має значних природних ресурсів, все ж може бути гарною ідеєю інвестувати в його нечисленні галузі, а заодно нагадати всім нашим сусідам, чий це острів."
