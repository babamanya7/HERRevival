 CONGO_copper_cartridges_desc:0 "Гільзи для снарядів. Жодна сучасна війна не може бути ведена без них, і, як виявляється, мідь є найкращим матеріалом для їх виготовлення. Мідь стійка до корозії і досить м'яка, щоб її можна було обробляти. Як зручно, що ми сидимо на справжній горі цього матеріалу!"
 CONGO_french_congo:0 "Французьке Конґо"
 CONGO_rubber_plantations_desc:0 "У Бельгії є досить погана історія у видобутку гуми в Конґо. Попри це, нам все одно потрібно розвивати виробництво цього матеріалу, знаючи, що ми перебуваємо під пильним наглядом міжнародної спільноти."
