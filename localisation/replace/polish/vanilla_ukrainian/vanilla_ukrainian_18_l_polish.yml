 PER_absorb_byzantines_desc:0 "Ми нарешті залагодили багатовікову образу на [GRE.GetAdjective]s, завдавши удару по [GRE.GetNameDef]. Цю територію тепер можна включити до складу нашої Імперії та зробити її офіційною частиною."
 PER_ali_akbar_deiva:0 "Ali Akbar Deiva"
 PER_assassinate_reza_shah_desc:0 "Реза-шах Пехлеві, можливо, здійснив великі зміни в [PER.GetNameDef], але не всі вони популярні серед народу. Роками ходили чутки про потенційні змови про вбивство, але ніхто насправді не наважиться вистрілити... чи не так?"
 PER_clamp_azerbaijani_dissidence:0 "Приборкати азербайджанське інакомислення"
 PER_communist_events.1.a:0 "Тривожний розвиток подій."
 PER_communist_events.7.a:0 "Тоді ми продемонструємо нашу рішучість."
 PER_conscription_idea_desc:0 "Відчайдушні часи вимагають відчайдушних заходів. Хоча ми не можемо присвятити час і ресурси створенню повністю професійної армії, ми можемо гарантувати, що кожен працездатний чоловік здатен взяти до рук зброю і боротися за свою країну."
 PER_construct_air_defenses:0 "Створити протиповітряну оборону"
 PER_core_conquered_state:0 "Реінтегрувати [FROM.GetName]"
 PER_dig_and_defend:0 "Окопатися та захищатися"
 PER_establish_airforce:0 "Створити Повітряні сили"
 PER_found_iranian_shipyards_desc:0 "Хоча придбання кораблів в інших націй досі було достатнім, якщо ми хочемо не відставати від гонки військово-морських озброєнь у регіоні, ми повинні інвестувати у будівництво власних активів. Ми можемо досягти цього, створивши компанію, яка зосереджується переважно на будівництві кораблів для наших військових зусиль — Іранські верфі."
