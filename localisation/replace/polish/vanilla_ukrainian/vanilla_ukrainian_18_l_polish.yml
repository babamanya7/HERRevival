 GER_inner_circle.01.a:0 "Замінити [GetAscendedAdvisorName1]"
 GER_inner_circle.01.desc:0 "[GetAscendingAdvisorName] продемонстрував сильні амбіції та здобув вплив у партії. Проте його спроби отримати більше влади викликали незадоволення інших членів, що призвело до боротьби за вплив. Питання полягає в тому, чи зміг [GetAscendingAdvisorName] вразити [GER.GetLeader], щоб отримати місце в найближчому оточенні."
 GER_instill_auftragstaktik_desc:0 "Наші військові вже давно практикують Auftragstaktik, або командування місіями, наголошуючи на розосередженому командуванні та індивідуальній ініціативі. Це призвело до гнучкості й автономії, посилюючи нашу адаптивність та успішність у непередбачуваних ситуаціях. Надзвичайно важливо, щоби ми продовжували цю практику, аби наші війська завжди перемагали!"
 GER_integrated_economies:0 "Інтегровані економіки"
 GER_kdf_wagen_desc:0 "Ми дамо нашим громадянам можливість придбати в майбутньому «народний автомобіль» за допомогою накопичувальної програми, яка, у свою чергу, дозволить нам фінансувати будівництво заводів для виробництва цих автомобілів."
