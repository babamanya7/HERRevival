 JUNO_brazil_events.73.desc:0 "На тлі глобальної напруженості через Атлантику надійшло приголомшливе повідомлення. [FROM.GetNonIdeologyName], наша колишня колонія, а тепер і сама зростаюча сила, висунула зухвалий ультиматум. Вони вимагають підкорення [FROM.GetName] та її інтеграції в [FROM.GetAdjective] імперію. Наше населення шоковане, багато хто обурений зухвалістю [FROM.GetAdjective]s. Інші ж, однак, побоюючись зростаючої могутності [FROM.GetNonIdeologyName] та нашої власної вразливості, розглядають можливість згоди. Як ми відповімо?"
