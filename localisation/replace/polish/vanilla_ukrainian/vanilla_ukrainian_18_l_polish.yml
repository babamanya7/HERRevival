 MEX_category_territorial_integration_desc:0 "Наша революційна боротьба за повалення корумпованих урядів винагороджує нас контролем над цілими країнами. Мешканці цих регіонів знали лише гноблення, і, щоби насолодитися справжнім звільненням, їх необхідно включити до держави [MEX.GetNameDef]."
 MEX_church_power_4_desc:0 "Ми скоротили гоніння на істинну віру, повернувши церкви, семінарії й релігійні споруди, але попереду ще багато роботи."
