 CHL_strengthen_the_central_bank_desc:0 "Аби наша економіка не просто «покращилася», а стала кращою, ми мусимо докласти зусиль для зміцнення Banco Central de Chile, заснованого президентом Артуро Алессандрі. Ми надамо йому більше свободи робити все, що він вважає за потрібне, щоб у довгостроковій перспективі він допоміг нам."
 CHL_strike_a_deal_with_the_mapuche:0 "Укласти угоду з мапуче"
 CHL_sub_ship_engine_2:0 "«Parsons» 2 750 к. с. н. в."
 CHL_support_the_colonial_plan_desc:0 "Німецьке колоніальне відомство колись розробило план швидкого захоплення контролю над державним апаратом в Уругваї та встановлення колоніального маріонеткового уряду. Зараз ми маємо можливість спробувати втілити цей план у життя і мусимо вимагати від Уругваю приєднатися до нашого альянсу та обрати правильний бік в історії."
