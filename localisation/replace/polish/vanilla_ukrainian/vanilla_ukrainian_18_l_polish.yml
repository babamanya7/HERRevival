 COG_GATHERING_STORM_DESC:0 "Конґо, яке досі страждає від шрамів короля Леопольда ІІ, пройшло довгий шлях з того часу. Колоніальний уряд усе ще використовує дешеву робочу силу в шахтах і існує невидимий дах, який гарантує, що більшість жителів країни не можуть отримати вищу освіту, але не все так безнадійно.\n\nПо мірі того, як італійські колоніальні амбіції стають дедалі більшими, і добре проявивши себе у Великій війні, Force Publique знову готується захистити державу, хоч і недостатньо оснащену."
 COG_approach_the_barotse_litunga:0 "Звернутися до Літунги Баротсе"
 COG_banque_du_congo_belge_idea_2:0 "Центральний банк Конґо та Руанди-Урунді"
 COG_establish_new_sabena_air_routes_desc:0 "Societé Anonyme Belge d'Exploitation de la Navigation Aérienne вже давно корисна для нас, надаючи авіаперевезення між основними населеними пунктами нашої величезної нації. Можливо, ми могли б спробувати встановити нові маршрути в деякі з віддалених регіонів країни, щоб транспортування та комунікація стали набагато простішими для управління."
 COG_establish_the_anc:0 "Створити Національну армію Конґо"
 COG_force_arienne_congolaise:0 "Військова авіація Конґо"
 COG_force_leopoldville_capitulation_decision:0 "Примусити уряд Конґо в Леопольдвілі до капітуляції"
 COG_freedom_at_gunpoint_subject_decision:0 "Визволити [FROM.GetAdjective]ий народ"
 COG_gerard_greindl:0 "Жерар Антуан Поль Ґрейндль"
 COG_invest_in_rubber_plantations_desc:0 "Каучук є паливом нашої економіки і може допомогти нам встановити вигідні торгові угоди з іноземними державами. Тому це сектор, в який ми повинні інвестувати значно."
 COG_kasa_vubus_first_cabinet:0 "Перше Кабінет Каса-Вубу"
 COG_manifeste_convience_africaine_desc:0 "Національна свідомість конґолезців починає набувати форми, і еволює вже почали розчаровуватись у тридцятирічному плані Жефа Ван Більсена. Настав час, щоб конґолезькі інтелектуали заявили про себе та показали світу, куди прямує Конґо!"
 COG_neutrality_ADJ:0 "Конґолезьк"
 COG_peacekeeping_forces:0 "Миротворчі сили"
 COG_peoples_republic_of_congo_communism:0 "Народна республіка Конґо"
 COG_prepare_for_offensive_action_desc:0 "Політики на батьківщині не можуть вирішити нашу роль у цій війні, але ми не повинні забувати, що можемо стати їхнім порятунком і через героїчні дії здобути нашу незалежність у цій війні. Кожен чоловік — на фронт!"
 COG_proclaim_the_peoples_republic_desc:0 "Якби ви запитали наших людей кілька років тому, чи думали вони, що ми досягнемо цього дня, вони б відповіли: ні. Але ми зробили це. Сьогодні — це день, коли ми можемо проголосити створення нашої давно бажаної Народної Республіки. Хай живе голова, хай живе держава!"
 COG_ready_for_action:0 "Готові до дій"
 COG_the_mwami_of_burundi_focus:0 "Мвамі Бурунді"
 COG_the_simba_movement_tt:0 "Коли почнеться війна за визволення, ми отримаємо 3 §YДивізії Руху Симба§!, і вони зможуть здійснити переворот і взяти національне керівництво, якщо популярність §YКомунізму§! стане достатньо високою."
 COG_trade_unionist:0 "Профспілковий активіст"
 COG_triga_i_project_desc:0 "Майбутнє енергетики полягає в ядерній енергії, і наші вчені активно працюють над створенням першої ядерної електростанції в Африці — TRIGA I. Після завершення проєкту ми зможемо використовувати її потужність для нашої армії, якщо це буде необхідно."
