 XIC_invite_chiang_for_troop_inspections_desc:0 "Наша країна ослаблена внутрішніми чварами, тоді як Японія явно має плани на нашу територію. Незважаючи на це, [CHI.GetLeader] відмовляється співпрацювати з КПК і постійно вимагає, щоб ми продовжували кампанію боротьби з бандитизмом, ігноруючи наші відчайдушні благання, погрожуючи переведенням на південь. Ми повинні змусити націоналістів і комуністів почути голос розуму і сформувати Об'єднаний фронт."
 XIC_new_fengtian_clique_democratic_DEF:0 "Нова Фентяньська федерація"
