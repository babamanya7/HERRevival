 ARG_political_events.34.t:0 "[ENG.GetNameDefCap] відмовляється здатися"
 ARG_political_events.39.a:0 "Як прикро..."
 ARG_political_events.43.desc:0 "Чудова новина, товаришу! [SOV.GetNameDefCap] погодився надіслати добровольчі сили у разі спалаху громадянської війни, коли ми оголосимо нашу славетну революцію! Це має дати нам певний спокій, якщо така подія виникне."
 ARG_political_events.52.a:0 "Незабаром наші цілі будуть ідеалізовані!"
 ARG_royal_airforce_influence:0 "Вплив Королівських повітряних сил"
 ARG_secure_the_borders:0 "Забезпечити безпеку кордонів"
 ARG_ship_anti_air_1:0 "12.7mm Vickers Mk III"
 ARG_south_american_alliance_desc:0 "З нашою новою фракцією, сформованою та присвяченою збереженню миру на континенті Південної Америки, ми повинні звернутися до інших демократичних націй навколо нас та попросити їх приєднатися до нашої обіцянки миру та свободи. Разом ми стоїмо сильніше і матимемо менше шансів впасти."
 ARG_subject:0 "$OVERLORDADJ$а $ARG$"
 ARG_technical_schools:0 "Технічні школи"
 ARG_workers_rights_desc:0 "Одним із основних принципів нашої соціалістичної революції було підвищення якості життя робітників пролетаріату [ARG.GetNameDef]. Тепер, коли ми захопили засоби виробництва, ми повинні забезпечити, щоб погані умови праці більше не переслідували наші поля та наші фабрики."
 ARMY_NAVIES_THEATRES:0 "Активні в $N$ стратегічних регіонах"
 ARMY_SORT_SIZE:0 "Розмір"
 ARM_communism:0 "Вірменська соціалістична республіка"
 ARM_fascism_DEF:0 "Велика Вірменія"
 AST_EQUIPMENT_VERSION_6:0 "Mk VI"
 AST_NZL_PUPPET:0 "Австралія та Нова Зеландія"
 AST_UNION_CONTROL_STATUS_COM_1:0 "§GСтабільно§!"
 AST_UNION_CONTROL_STATUS_NAME_INS:0 "Голландська Ост-Індія"
 AST_a_comrade_emancipated:0 "Звільнений товариш"
 AST_absorb_the_uap_desc:0 "Хоча Партія об'єднаної Австралії завжди залишалася ліберальною, вона також схиляється вправо. Однак, з новою політичною партією при владі, членам УАП може не залишитися іншого вибору, окрім як підтримати курс нинішнього уряду. Ми звернемося до найвидатніших членів і завербуємо їх до Партії «Австралія понад усе»."
 AST_additional_militia_training:0 "Додаткові тренування ополчень"
 AST_advance_pacific_initiatives_ins_2_tt:0 "§Y[INS.GetName]§! пропонує:"
 AST_alice_springs:0 "Аліс-Спрінґс"
 AST_alp_cluster_unlock:0 "Наступний кластер фокусів §YАЛП§! §Gрозблоковується§!."
 AST_alp_popularity_decrease_10:0 "Голоси §Y$AST_ruling_party$§! §Y$AST_alp$§!: §R-10.00%§!"
 AST_army_inventions_directorate_desc:0 "Війни є двигуном прогресу та технічної думки. Влада хоче знайти спосіб відокремити розумні ідеї від невдалих. Нове спеціалізоване патентне відомство визначатиме, які з безлічі пропозицій, що надходять до уряду, заслуговують на увагу."
 AST_bradford_cotton_mills_ic_tt:0 "Ефекти від промислового концерну §Y$AST_bradford_cotton_mills_ic$§! покращено"
 AST_britain_supplying_ships_desc:0 "Оскільки [ROOT.GetName] несе тягар охорони берегів британських союзників, стало зрозуміло, що наш флот потребує розширення. Буде лише справедливо, якщо [ENG.GetNameDefCap] постачатиме нам кораблі."
 AST_british_war_cabinet_spirit_tt:0 "Змінює §Y$AST_british_war_cabinet_spirit$§! на:"
 AST_carrier_2:0 "Клас «Ark Royal»"
 AST_castle_crumbling_mission_complete_tt:0 "Завершити місію §YЗамок руйнується§!"
 AST_civil_construction_corps_desc:0 "Ми організуємо заклик усіх працездатних громадян до Корпусу цивільного будівництва, який допоможе у будівництві аеродромів, транспортних шляхів, укріплень та інших ключових об'єктів військової інфраструктури."
 AST_country_party_influence_uap:0 "Вплив Аграрної партії"
 AST_cruising_for_a_bruising_desc:0 "Наш флот довго і вміло використовував крейсери, і цю традицію варто розширювати. Швидкі, універсальні та потужні, ці кораблі незабаром зароблять репутацію в усьому світі — будь-який ворог, що стане на їхньому шляху, зіткнеться з дуже серйозними проблемами."
 AST_department_of_aboriginal_affairs_desc:0 "Ми реалізуємо пропозицію груп активістів з прав аборигенів щодо створення нового Департаменту у справах аборигенів. Департамент буде консультувати комітет з представників аборигенної спадщини, і його метою буде забезпечення доступу корінного населення до належної їжі та медичної допомоги."
 AST_diplomatic_events.13.b:0 "Абсолютно ні!"
 AST_diplomatic_events.23.t:0 "[ENG.GetLeader] більше не шукає військового впливу Австралії"
 AST_diplomatic_events.47.t:0 "Поділ тягаря"
 AST_diplomatic_events.64.a:0 "Вперед, на Белфаст!"
 AST_diplomatic_events.8.t:0 "[USA.GetName] погоджується на наш запит"
 AST_election_recently_concluded:0 "Період формування уряду"
 AST_george_wootten:0 "Джордж Вуттен"
 AST_irrepressible_freethinker:0 "Невгамовний вільнодумець"
 AST_irrepressible_freethinker_democratic:0 "$AST_irrepressible_freethinker$"
 AST_its_fight_work_or_perish_desc:0 "Війна почалася, і залишається тільки одне: довести, що ми до неї готові."
 AST_japan_tech_sharing:0 "Обмін технологіями з Японією"
 AST_japan_tech_sharing_desc:0 "Японські вчені ведуть розробки швидше, ніж наші дослідні бюро, але наша дружба з Імперією вранішнього сонця відкриває нові можливості з накопичення знань та обміну ними."
 AST_john_curtin:0 "Джон Кертін"
 AST_kangaroo_point_shipyards_desc:0 "Evans Deakin & Company пропонує побудувати корабельню та великий сухий док у Кенґару-Пойнті. Такий проєкт ідеально підійде для посилення нашої морської могутності."
 AST_lance_sharkey:0 "Ленс Шаркі"
 AST_leighton_bracegirdle:0 "Лейтон Брейсгірдл"
 AST_light_tank_aa_equipment_3_short:0 "Crusader II AA"
 AST_lithgow_small_arms_factory_desc:0 "Заснований у 1912 році, Завод стрілецької зброї Літгоу був створений, щоб зменшити залежність від британської зброї та обладнання у воєнний час. Оскільки глобальна напруженість знову зростає, ми повинні розширити виробництво для задоволення зростаючих потреб наших збройних сил."
 AST_mio_trait_lee_enfield_no1_mark3:0 "$AST_lee_enfield_no1_mark3$"
 AST_modern_tank_equipment_1:0 "Centurion"
 AST_naurus_return_to_german_hands_tt:0 "'§YПакт Науру§!' стає активним."
 AST_offshore_advancements_spirit:0 "Закордонні досягнення"
 AST_percy_fascism_ADJ:0 "$AST_ADJ$"
 AST_pleading_britain:0 "Благання до Британії"
 AST_red_fred:0 "Червоний Фред"
 AST_red_solidarity_tt:0 "§Y[AST.GetName]§! приєднується до війни §Y[PRC.GetNameDef]§! проти §Y[CHI.GetNameDef]§!. Менший альянс поглинає інший, або §Y[AST.GetName]§! вступає у війну безпосередньо, якщо вони вже союзники."
 AST_robert_menzies:0 "Роберт Мензіс"
 AST_scale_up_middleback_mines_steel_decision_3_desc:0 "Вимоги воєнного часу до металів високі як ніколи, але гори Міддлбек продовжують забезпечувати нас."
 AST_sentinel_tank_development_desc:0 "Історично ми покладалися на імпортні проєкти танків, навіть коли виробляли їх у себе. Ми повинні спиратися на уроки, винесені з цих машин, і, додавши частку австралійських інновацій, розробити власний танк, пристосований до наших можливостей і ресурсів."
 AST_singapore_strategy:0 "Сінгапурська стратегія"
 AST_special_forces_cat:0 "Тренування спеціальних сил"
 AST_supply_arms_to_nation:0 "Постачати зброю в §Y[FROM.GetName]§!"
 AST_take_it_to_foreign_streets_desc:0 "Робітники не мають кордонів. Ми розпочнемо скоординовану міжнародну кампанію, відправляючи австралійських комуністичних організаторів на вулиці кожної нації, де наш вплив уже закріпився, пожвавлюючи місцеві рухи та підтримуючи полум'я революції."
 AST_war_is_coming_cat:0 "Наближається війна"
 AST_workers_paradise:0 "Робітничий рай"
 ASY_neo_assyrian_empire_communism_ADJ:0 "Новоассирійськ"
 AUS_GATHERING_STORM_DESC:0 "Австрія досі дестабілізована «самоліквідацією парламенту» 1934 року й подальшим убивством канцлера Енґельберта Дольфуса, а напруженість у країні все ще залишається високою. Зв'язане суворим Сен-Жерменським договором і переживаючи економічну кризу, австрійське керівництво на чолі з канцлером Шушніґом опинилося перед необхідністю прийняття рішень монументального масштабу. Змиритися зі своєю долею, чи дозволити Німеччині прийти за ними? Чинити опір до останнього, дипломатичним чи військовим шляхом? Чи ж звернутися до минулого: до імперії, якою вона була, імперії, якою вона буде?"
 AUS_VICTORY_POINTS_11581:0 "Аґрам"
 AUS_VICTORY_POINTS_3696:0 "Ґросвардайн"
 AUS_VICTORY_POINTS_6672:0 "Ользніц"
 AUS_adolf_hoch:0 "Адольф Гох"
 AUS_alpine_federation_focus:0 "Альпійська Федерація"
 AUS_antischluss_category_desc_high:0 "§OВисокий§!"
 AUS_at_the_ready_desc:0 "Не тільки наша армія потребує вишколу та постійної готовності. Ті, хто технічно підтримують нашу армію, мають усвідомлювати свою відповідальність перед країною. Переконавшись, що працівники завжди готові підтримати наші збройні сили, ми налаштовуємо себе на успіх."
 AUS_austrotrotskyism_desc:0 "Відхиляючись від австромарксистської середини та давно скасувавши австрофашизм, Австрія нині дотримується суворого набору троцькістських ідей."
 AUS_autobahn_south_desc:0 "Наша інфраструктура потребує оновлення, незважаючи на те, що ми б хотіли зміцнити її по всій країні, реалії нашої економіки та промислової ситуації не дозволяють цього. Будівництво на захід і з’єднання нашого автобану з італійським шосе є одним із, якщо не найкращим, вибором у нашій поточній ситуації."
 AUS_countries_that_can_be_influenced:0 "Країни, на які ми можемо повпливати для охотнішого прийняття наших вимог"
 AUS_danubian_socialist_communes:0 "Заснувати Дунайський блок"
 AUS_end_european_fascism_tt:0 "Ми отримаємо ціль війни §YМаріонетка§! проти всіх §YФашистських§! країн в §YЄвропі§!"
 AUS_eugen_beyer:0 "Ойґен Баєр"
 AUS_federal_state:0 "Федеративна держава Австрія"
 AUS_fit_for_fight_desc:0 "Ми пройшли довгий шлях у відбудові нашої країни з жалюгідного стану, в якому вона була, але ми не можемо зупинятися на цьому. Поки відзначаються наслідки наших зусиль з переозброєння та відбудови, ми повинні підготувати нашу судову систему до того, щоб наші власні закони не перешкоджали нашим зусиллям."
 AUS_hirtenberger:0 "Hirtenberger"
 AUS_industrial_exchange_desc:0 "Нам є чому навчитися у наших нових союзників, зокрема в питаннях будівництва. Хоча також і в плані військових стратегій. Оскільки наші союзники охоче діляться з нами цією інформацією, ми повинні максимально використати це."
 AUS_mio_trait_high_quality_mass_production:0 "Високоякісне масове виробництво"
 AUS_mio_trait_static_wings:0 "Вдосконалення елеронів"
 AUS_motorized_equipment_1:0 "Austro-Daimler ADGR"
 AUS_news_events.12.a:0 "Чудово"
 AUS_news_events.8.t:0 "Габсбурґ під контролем Габсбурґа"
 AUS_political_events.1.desc:0 "Нам стало відомо, що злиття банків у 1934 році, коли рекапіталізована Creditanstalt взяла на себе всі активи та забов'язання Wiener Bankverein, а також операції Niederösterreichische Escompte-Gesellschaft, знову вразила нас, оскільки це значною мірою загальмувало наш економічний розвиток і ненавмисно створило свого роду монополію на фінансовий сектор. Оскільки ми зараз регулюємо цю сферу, який підхід до ситуації буде найкращим виходом?"
 AUS_political_events.101.desc:0 "Після довгих суперечок про те, що їх точно не стосувалося, [FROM.GetNameDef] нарешті припинив свої спроби незаконного впливу на нашу політику. Можна лише припустити, що зараз вони дуже незадоволені нами. Це не наша головна турбота. Нашою першочерговою турботою завжди було, зараз є і завжди буде покращення австрійського становища."
 AUS_political_events.107.t:0 "[FROM.GetNameDefCap] відступає під [GER.GetAdjective]им тиском"
 AUS_political_events.115.desc:0 "Офіційні особи [FROM.GetAdjective]ої армії звернулися до нас у надії організувати спільні військові навчання для армій наших країн. Вони запевняють нас, що така взаємодія буде вигідна для обох наших держав і що ми можемо багато чому навчитися у них... так само як і вони можуть навчитися у нас."
 AUS_political_events.117.t:0 "[FROM.GetAdjective] відмовляється від проведення [ROOT.GetAdjective]о-[FROM.GetAdjective]их спільних військових навчань"
 AUS_political_events.121.a:0 "Це НАША територія!"
 AUS_political_events.124.a:0 "Наші Імперії повстануть, мов фенікс із попелу!"
 AUS_political_events.2.b_tt:0 "Покриття страховки дозволить нам в майбутньому відродити Phönix."
 AUS_political_events.46.t:0 "[FROM.GetNameDefCap] передає територію для уникнення підкорення"
 AUS_political_events.47.b:0 "Ну, ми хоча б спробували."
 AUS_political_events.56.t:0 "[GetHostilityItalianClaimTitle56]"
 AUS_political_events.65.desc:0 "[FROM.GetAdjective]кий уряд неочікувано звернулися до нас із пропозицією про знижки на їхнє обладнання на міжнародному ринку. Питання, чи це така хитрість, щоб мотивувати нас купувати у них більше обладнання, чи це щира пропозицією, залишається неоднозначним."
 AUS_political_events.73.c_tt:0 "На період дії переглянутого договору, в Австрію буде призначено наглядача з демократичними ухилами"
 AUS_political_events.85.a:0 "Добре..."
 AUS_political_events.96.a:0 "Ласкаво просимо!"
 AUS_preparing_the_industry_desc:0 "Один із наших найважливіших і цінних виробників літаків після набуття чинності Сен-Жерменського Договору повністю припинив виробництво нових літаючих машин. Тепер, коли ми відновлюємо наші повітряні сили, ми також повинні відновити наших постачальників."
 AUS_promote_admirals_desc:0 "Оскільки ми так довго стояли без військово-морського флоту, доволі природно, що ми більше не маємо такої кількості адміралів, як колись. Хоча список кандидатів на цю посаду не дуже великий, у нас все ще є кілька з принаймні деяким досвідом, які можуть привести наші флоти до перемоги."
 AUS_pulverfabrik_skodawerke_desc:0 "Хімічний завод Pulverfabrik Skodawerke у Нижній Австрії в минулому мав багато застосувань: порох, динаміт і хімікати для металургійних заводів. Наразі найкращим використанням їхнього досвіду було б спрямувати їх на синтетичні ресурси."
 AUS_rebuild_democratic_systems_desc:0 "Демократична система — це щось дуже тонке, її легко демонтувати, але важко відбудувати чи відновити. Але, заради людей, це те, що потрібно зробити негайно. Партії, які пропагують диктатуру, мають бути заборонені заради нації."
 AUS_reclaiming_yugoslavian_territories_desc:0 "Колись наша велика імперія простягалася аж до Адріатичного моря. Ці землі також у нас вкрали в кінці Великої війни. Повернувши їх, ми також повернули б тактично важливу берегову лінію. Ми повинні «запропонувати» власникам цих регіонів передати їх нам мирним шляхом, інакше вони ризикують зазнати наслідків."
 AUS_regulate_austrian_finance_sector:0 "Регуляція фінансового сектору"
 AUS_spur_the_communist_resistance_tt:0 "Відкриває сукупність рішень для §YЗаохочення Комуністичних Настроїв§! у:"
 AUS_stabilimento_tecnico_triestino_organization:0 "Stabilimento Tecnico Triestino"
 AUS_the_evidenzburo_bonus:0 "Evidenzbureau"
 AUS_train_equipment_3:0 "Panzerzug II"
 AUS_under_german_pressure:0 "Під фашистським тиском"
 AUS_vocal_german_unionist_fascism:0 "Голосистий прихильник німецького єднання"
 AUS_widespread_unemployment:0 "Широке безробіття"
 BALTIC_arms_industry:0 "Завершити озброєння"
 BALTIC_belarus_democratic_DEF:0 "$NONIDEOLOGYADJ$о-білоруська республіка"
 BALTIC_british_aircraft:0 "[GetBritAircraftManufTitle]"
 BALTIC_british_aircraft_alt:0 "Іноземне виробництво літаків"
 BALTIC_british_designers_desc:0 "Ми ретельно вивчили британські проєкти, і тепер, коли підприємство «Crossley Motors» — [Root.Capital.GetName] можна вважати успішним, нам не завадило б запросити британських проєктувальників на роботу до [Root.GetNonIdeologyAdjective]ої інженерної компанії."
 BALTIC_events.502.a:0 "Принаймні, ми спробували."
 BALTIC_events.701.t:0 "[From.GetNameDefCap] блокує [baltic_wargoal_target.GetAdjective] вторгнення"
 BALTIC_events_17_tt:0 "Станеться подія §Y[Root.GetNameDefCap] просить про вторгнення в Естонію§!."
 BALTIC_ford_organization:0 "$BALTIC_ford$"
 BALTIC_german_baltic_industry_desc_alt:0 "У нашу націю тепер щосили інвестують зарубіжні фашисти. Приватні сектори наших фашистських піклувальників і держави [Root.GetNonIdeologyName] тепер майже нерозрізняються — часто їх і [Root.GetNonIdeology"
 BALTIC_promote_communism_militancy:0 "Підтримати [From.Owner.GetAdjective]их бойовиків"
 BALTIC_restore_workers_republic_idea_1:0 "$BALTIC_restore_workers_republic_idea$"
 BAR_fascism:0 "Відроджена імперія Баротселенд"
 BAS_communism_ADJ:0 "Британо-антильськ"
 BAY_VICTORY_POINTS_11544:0 "Немберх"
 BAY_communism:0 "Баварська радянська республіка"
 BBA_SWI_annual_election.1.c:0 "Обрати [SWI_GetCouncilor3name]"
 BBA_african_union_events.22.t:0 "Спроба залякування в [FROM.GetNameDef] провалилася"
 BBA_ethiopia_balance_of_power_events.53.b:0 "Виробництво зброї в приватних руках звучить надто небезпечне."
 BBA_ethiopia_balance_of_power_events.53.t:0 "Регіональний правитель хоче виробляти зброю"
 BBA_ethiopia_balance_of_power_events.55.desc:0 "Було кілька випадків скарг на місцевих правителів області [?ROOT.ETH_bop_state.GetName]. Люди вважають, що аристократія погано ставиться до них. Початкове розслідування цього питання показало, що їхні скарги мають під собою принаймні певні підстави. Однак втручання центрального уряду не буде позитивно сприйняте іншими аристократами."
 BBA_ethiopia_balance_of_power_events.55.t:0 "Місцеві жителі скаржаться на жорстоке ставлення до них"
 BBA_ethiopia_communist_events.01.b:0 "Нам нецікаві ці колоніальні справи в Африці."
 BBA_ethiopia_communist_events.29.desc:0 "Дипломатичне протистояння між [ITA.GetName] і [SOV.GetNameDef] завершилося тим, що [ITA.GetAdjective]а влада погодилася припинити війну проти нас. Це величезна перемога над фашизмом, хоча навряд чи боротьба на цьому завершиться. Сподіваємося, ми зможемо й надалі співпрацювати з нашими друзями з [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_communist_events.39.a:0 "Ми досягли своєї мети."
 BBA_ethiopia_communist_events.41.a:0 "Після всього, що ми для них зробили."
 BBA_ethiopia_communist_events.51.desc:0 "[ETH.GetAdjective] дипломати звернулися до нас із пропозицією миру. Умова пропозиції — відмова від претензій на [UGA.GetAdjective] територію, яку ми втратили на користь [ETH.GetNameDef] під час цього конфлікту. Дипломати також заявляють, що в регіоні буде створено [UGA.GetAdjective]ий уряд. Наскільки незалежним буде цей уряд — ще належить побачити."
 BBA_ethiopia_communist_events.57.t:0 "[JAP.GetNameDefCap] вимагає екстрадиції $IA_sakutaro_iwasa$ та $IA_sanshiro_ishikawa$"
 BBA_ethiopia_exile_events.03.a:0 "Ці повстанці..."
 BBA_ethiopia_exile_events.06.t:0 "[FROM.GetName] просить передати владу над областю [550.GetName]"
 BBA_ethiopia_exile_events.17.b:0 "Дамо їм крейсер з ескортом"
 BBA_ethiopia_exile_events.43.a:0 "Добре"
 BBA_ethiopia_fascist_events.65.desc:0 "[ETH.GetLeader] просить передати контроль над [559.GetName] та [844.GetName] як нагороду, або компенсацію, за свою відданість [ITA.GetName]. [ETH.GetLeader] відіграв вирішальну роль у прориві під час вторгнення в Ефіопію, і це могло б зберегти добрі відносини. Однак, народ [ITA.GetAdjective] навряд чи буде у захваті від передачі територій."
 BBA_ethiopia_imperial_events.20.desc:0 "Заручившись підтримкою [ETH.GetAdjective]ого середнього класу та селянства, рас $ETH_ras_imru_haile_selassie$ оголосив про офіційне повалення $ETH_haile_selassie$ та запровадження загальних виборів у державі [ETH.GetNameDef]. Загалом народ, і що ще важливіше в даному випадку, [ETH.GetAdjective]а армія, вважає його справжнім героєм Другої італо-ефіопської війни: він зумів завоювати лояльність військових і підтримка відсутнього імператора не змогла матеріалізуватися."
 BBA_ethiopia_industrial_financial_events.5.t:0 "[FROM.GetLeader] погоджується"
 BBA_italo_ethiopian_war_events.502.desc:0 "[GetItalyRefusesPeaceTalks]"
 BBA_italy_anti_colonialism_events.101.a:0 "Meraviglioso!"
 BBA_italy_anti_colonialism_events.56.t:0 "Західна Африка голосує за вступ до держави [ROOT.GetNameDef]"
 BBA_italy_civil_war.3.a:0 "Підступні комуняки!"
 BBA_italy_colonial_management.1_do_not_apply_tt:0 "Окупаційний закон §Y$colonial_police$§! буде доступний над підконтрольних [GetAfricanStates][GetAndOrNothing][GetAlbanianStates]."
 BBA_italy_council_deposes_duce.1.t:0 "Засудження [?ITA.ITA_var_deposed_leader.GetName]"
 BBA_italy_interaction_events.20.a:0 "Нам буде краще без них."
 BBA_italy_interaction_events.25.a:0 "Вони стають надто зарозумілими."
 BBA_italy_interaction_events.3.desc:0 "Держава [SWI.GetName] сьогодні оголосила, що відкликає свій нейтралітет, ігноруючи наші вимоги повернути [846.GetName] до італійського світу. Через цей безглуздий вибір у нас не залишилося іншого вибору, окрім повного і цілковитого знищення швайцарської кантональної системи."
 BBA_italy_interaction_events.32.t:0 "[ITA.GetName] хоче провести переговори щодо своїх претензій до Джібуті"
 BBA_italy_interaction_events.33.desc_first_negotiation:0 "Італійський уряд звернувся до нас сьогодні з цікавою пропозицією. Вони кажуть, що хочуть ратифікувати Фронт Стрези, забезпечивши свою підтримку нашій стороні на випадок, якщо в Європі почнеться війна. Однак для того, щоб підписати цю угоду, вони вимагають територіальних поступок, а саме регіон [906.GetName]. Як ми повинні відповісти? Вони принаймні тимчасово платитимуть нам, якщо ми погодимося."
 BBA_italy_interaction_events.36.desc_continued_negotiation:0 "[ITA.GetName] тепер має до нас останнє прохання, перш ніж пакт буде підписано. Вони хочуть, щоб ми ратифікували їхні претензії на Балкани. Це не зовсім в нашій зоні інтересів, і тому наш уряд не дуже хоче це заперечувати."
 BBA_italy_missiolinis.05_south.a:0 "Ми відтіснили ворога!"
 BBA_italy_missiolinis.112.a:0 "Це лише поглиблює несправедливість до нас."
 BBA_italy_missiolinis.113.desc:0 "Грубу несправедливість нарешті було виправлено! Далматинське узбережжя — наше. Муссоліні — в ейфорії; він називає цю перемогу великим моментом для Італії та її народу. Він оголосив, що велику наругу нарешті було загладжено. Люди висипали на вулиці, щоби відзначити цю знаменну подію."
 BBA_italy_missiolinis.203.a:0 "Тільки найрозумніші та найяскравіші."
 BBA_italy_missiolinis.21.desc:0 "Дуче публічно оголосив, що абіссінці розбиті та втікають, а їхню волю зламано після своєї поразки. Наодинці, однак, він проклинає абіссінців за їхні витривалість і непокору італійському правлінню. Дуче віддав наказ натиснути на місцеву опозицію грубою силою та впровадити закони, які стримуватимуть населення. Він хоче втихомирення всієї країни та включення до складу Італії якомога раніше."
 BBA_italy_missiolinis.43.a:0 "Італія убезпечена."
 BBA_italy_missiolinis.52.a:0 "Нашим арміям доведеться обійтися."
 BBA_swiss_expansion.14.desc:0 "Незважаючи на наші рішучі вимоги щодо [FROM.GetAdjective] Альп, [FROM.GetNameDef] відкинув наші претензії. Проте в нас ще залишаються інші способи заволодіти цими землями, якщо ми вирішимо діяти далі."
 BBA_swiss_expansion.6.t:0 "[FROM.GetNameDefCap] хоче бачити [848.GetName] як кантон"
 BBA_switzerland.1.a:0 "Ми мусимо захистити наші демократичні та нейтральні цінності."
 BBA_switzerland.11.desc_GER:0 "[SWI.GetNameDefCap] наважилась винести сміховинно м’який вирок у 18 років ув’язнення вбивці Густлоффа! Це прикро, але ми не могли сильніше тиснути, ризикуючи спричинити бойкот Олімпіади.\n\nПоки що ми можемо зробити з Густлоффа мученика [?SWI.SWI_fascist_germany.GetNameDef] і використати вбивство в пропаганді. Можливо, під час майбутнього вторгнення ми доберемось до Франкфуртера й нарешті отримаємо справедливість."
 BBA_switzerland.15.t:0 "[FROM.GetName] пропонує нам оперативника"
 BBA_switzerland_trade.15.a:0 "Це проблема"
 BBA_switzerland_trade.4.t:0 "[FROM.GetName] хоче поновити нашу торгову угоду"
 BBA_switzerland_trade.9.desc:0 "Це означає, що вони зберігатимуть свої золоті резерви у нас, що дозволить їм вільно купувати й продавати золото без страху перед ембарго. Вигоду отримаємо не лише вони — приплив коштів підтримає нашу економіку, а можливо, стане козирем у майбутніх переговорах."
 BECOME_SPY_MASTER_FACTION_NEEDED:0 "§RЩоби очолити розвідмережу, вам треба бути в альянсі.§!"
 BEL_albert_deveze:0 "Альбер Девез"
 BEL_anti_tank_guns_tt:0 "Додає §HВідмінні протитанкові гармати§!\nПротитанкова атака підтримки ПТА: §G+10%§!\nБронебійність підтримки ПТА: §G+10%§!\nПротитанкова атака фронтових батальойнів ПТА: §G+10%§!\nБронебійність фронтових батальойнів ПТА: §G+10%§!\nПротитанкова атака моторизованої ПТА: §G+10%§!\nБронебійність моторизованої ПТА: §G+10%§!\nАтака ПТ САУ: §G+10%§!\nБронебійність ПТ САУ: §G+10%§!\n"
 BEL_chasseurs_ardennais_ns_ncns_desc:0 "$BEL_chasseurs_ardennais_ns_desc$"
 BEL_cockerill_desc:0 "Cockerill — провідний виробник сталі в [ROOT.GetNameDef], з величезними заводами, здатними виробляти все, від двигунів до артилерії. У зв'язку зі зростаючим попитом на ці продукти, ми знаходимося в ідеальній ситуації для їх подальшого розширення."
 BEL_currently_undertaking_communism_decision_flag:0 "Наразі виконується інше рішення, щодо §Y$BEL_rekindle_the_red_flame_cat$§! decision"
