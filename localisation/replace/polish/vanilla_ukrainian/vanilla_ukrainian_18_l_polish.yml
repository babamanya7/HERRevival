 ITA_servizio_informazione_militare_ns_desc:0 "Наша розвідка допоможе стримувати іноземні шпигунські атаки проти нас, а також посилювати наші власні міжнародні амбіції."
 ITA_socialist_republic_neutrality:0 "Італія"
 ITA_stockpiling_fuel_desc:0 "Наявність великого запасу палива дозволить нашій армії працювати довше."
 ITA_submarine_2:0 "Клас «Perla»"
 ITA_submarine_3_desc:0 "Клас «Marconi» — це клас з шести підводних човнів, побудованих між 1939 і 1940 роками, які прийшли на зміну більш раннім підводним човнам «Luizzi». Підводні човни обох класів мали водотоннажність близько 1000 тонн і вісім 533-мм торпедних апаратів. Лише один корабель обох класів разом пережив війну."
 ITA_support_albanian_irredentism_desc:0 "Ми мусимо спробувати легітимізувати італійське правління в Албанії. Підтримка албанського іредентизму в регіонах Косово та Епір — і навіть далі, безсумнівно, забезпечить нам значну громадську підтримку з боку місцевого населення та надасть нам можливість іще більше розширити сферу впливу."
 ITA_the_fight_against_stalinism_desc:0 "[GetAppropriateRussianGovernmentIdeologyDesc]"
 ITA_the_man_of_providence:0 "Людина провидіння"
 ITA_to_live_as_a_lion_missiolinis_tt:0 "\nЗавдання, видані Муссоліні, матимуть коротший час виконання, але даватимуть кращі винагороди."
