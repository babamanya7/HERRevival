 FRA_syria_intervention.2.desc:0 "Після запеклих боїв, що уповільнили просування союзників у кількох ключових точках, місцевий командувач союзними військами зупинив операцію. Більшість союзників відійшла на свої початкові позиції, тоді як війська режиму Віші зміцнилися на місцевості, кинувши переслідування, задоволені втриманням своїх позицій."
