 JAP_wrestle_tuva_from_the_soviets_desc:0 "Тувинці перебувають під п'ятою росіян уже багато років і прагнуть можливості віддалитися від європейців. Ми можемо надати їм таку можливість і повинні запросити їх до Інтернаціоналу. Однак це може загострити напруженість у відносинах із §Y[SOV.GetNameDef]§!."
