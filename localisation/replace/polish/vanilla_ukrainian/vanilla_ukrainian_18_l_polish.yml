 shareholder_democracy:0 "Акціонерна демократія"
 ship_hull_cruiser_submarine_desc:0 "Великий підводний човен, пристосований для операцій на великих відстанях. Його можна оснастити додатковими паливними цистернами, щоби зробити радіус дії ще більше, або забезпечити невеликим літаком-розвідником."
 ship_hull_light_1_desc:0 "$destroyer_1_desc$"
