 MainInvader190:0 "Сьогодні вранці ми отримали повідомлення від [PER.GetAdjective] уряду з пропозицією припинити воєнні дії, і натомість вони дозволять нам доступ до величезної кількості своїх природних ресурсів. Це принесе швидке завершення війни та дозволить нам зосередитися на наших більших цілях. Крім того, ми будемо в хорошому становищі, щоб продовжувати будь-які майбутні військові зусилля з їхніми нафтовими концесіями."
