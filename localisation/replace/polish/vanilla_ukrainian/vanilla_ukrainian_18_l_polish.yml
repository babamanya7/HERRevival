 INS_the_timor_issue:0 "[INS_timor_issue_scripted_name]"
 INS_union_events.10.a:0 "Навряд чи це все одно б спрацювало."
 INS_unity_in_diversity_desc:0 "Століттями слова 'Єдність у різноманітті' відображали дух нашого архіпелагу. Під час революції ця ідея стала гаслом, нагадуючи індонезійцям, що хоча ми говоримо багатьма мовами і дотримуємося багатьох різних традицій, ми стоїмо разом як один народ. Ми повинні закріпити цю фразу в нашій конституції, щоб наша єдність збереглася для наступних поколінь."
 INS_volksraad_events.101.desc:0 "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
