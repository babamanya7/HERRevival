 expand_civil_fascism_support_desc:0 "Ми мусимо забезпечити постійне поширення підтримки нашої справи серед людей і заохочувати їх публічно кинути виклик авторитету нинішнього уряду. Оскільки позиція уряду все більше підривається, а громадянські заворушення продовжують наростати, нам буде легше досягати своїх цілей. Це особливо актуально, якщо, на відміну від правової зміни уряду, ці цілі передбачають більш... зловісні засоби зміни режиму."
 expand_newfoundland_bases_goal_desc:0 "Розширення наших баз на Ньюфаундленді дозволить нам краще здійснювати контроль над конвоями Північної Атлантики та проектувати повітряну та військово-морську силу вздовж життєво важливих судноплавних маршрутів."
