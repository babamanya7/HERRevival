 SIA_cultivate_military_wing:0 "Залучити військове крило"
 SIA_death_to_the_nationalists_desc:0 "Японію було відкинуто, але питання про майбутнє Азії залишається відкритим. Старий націоналістичний порядок лише замінить одну ієрархію на іншу. Якщо Азія має бути перебудована, комуністи повинні перемогти."
 SIA_direct_funds_from_the_military_towards_development_desc:0 "Хоча Військове крило буде незадоволене тим, що його фінансування перенаправляється на розвиток, саме вони, а не ми, повинні будуть пояснити громадськості, чому ця нестача інвестицій зрештою є для них вигідною."
