 MEX_focus_institutional_revolution_desc:0 "Спадщина демократії в Мексиці слабка, але ми її зміцнили. Наша відданість верховенству права прогресує, і люди починають довіряти нашим виборам, якими уряд маніпулював у минулому."
 MEX_focus_integrate_the_caribbean_desc:0 "Дрібні республіки Карибського басейну поглинаються Мексиканською державою, і тепер настала черга народів Карибського басейну. Вони стануть лояльними мексиканськими громадянами, дотримуючись наших традицій, і, у свою чергу, отримають переваги того, що є частиною спільноти мексиканської нації."
 MEX_focus_support_spains_loyalists_desc:0 "Республіканський уряд в Іспанії був обраний демократичним шляхом, і тепер він зіткнувся з повстанням «націоналістичних» зрадників, які прагнуть лише особистої влади та явно ненавидять простих людей Іспанії. Ми повинні підтримати лоялістів, надіславши їм допомогу та заступившись за них у Лізі Націй, яка намагається накласти ембарго на республіканський уряд."
