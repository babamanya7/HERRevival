 JAP_a_functionalist_housing_policy_desc:0 "Наші теоретики розробили новий план створення великих кластерів багатоквартирних будинків або споруд певного стилю, які будуть використовуватися як державне житло під наглядом урядових органів. Завдяки будівництву з урахуванням функціональності, більше людей зможуть отримати дешевше житло по всій державі."
 JAP_abe_isoo_focus_desc:0 "Абе Ісоо, нинішній лідер партії Шакай Тайшюто і батько японського бейсболу, має сформувати новий кабінет, який наполягатиме на прийнятті нашої нової конституції. Завдяки цьому ми більше не матимемо тимчасового прем'єр-міністра, і порядок, що існував до початку міжусобиць, буде нарешті відновлено."
