 TUR_modernising_the_army_desc:0 "Коли йдеться про розвиток військових технологій, ми розуміємо, як безнадійно відстаємо. Щоб кровопролиття не повторилося, ми маємо спішно вдосконалювати тактику та спорядження."
 TUR_nationalism:0 "Націоналізм"
 TUR_official_opposition_party_organised:0 "Сформовано офіційну партію опозиції"
 TUR_pack_for_a_long_winter_desc:0 "Знайти місце, де можна відтворити морози Євразії, не так просто, але вибору у нас немає. Ми вирішили побудувати навчальний комплекс на вершині гори Паландьокен в Ерзурумі, а також невеликий додатковий комплекс навколо гори Арарат, щоби наші війська могли цілий рік вчитися діяти в гірській та льодовиковій місцевості."
 TUR_pressure_portugal_to_join_desc:0 "Технічно, [POR.GetNameDefCap] не межує із Середземномор'ям, але грає велику роль у майбутньому регіону. Величезна імперія буде для нас цінним союзником, а їм знадобляться такі друзі, як ми."
 TUR_reforming_our_armed_forces_category:0 "Реформувати наші збройні сили"
 TUR_restore_the_divan_desc:0 "Парламент із дармоїдів, обраний нашими ворогами? Ні, ми ніколи не збиралися довго це терпіти. Настав час повернути все, як було раніше. Ми відновимо Диван, щоб релігія посідала чільне місце у державі. Також ми ліквідовуємо взяту з західного світу посаду прем'єр-міністра — давно настав час повернути посаду великого візира!"
 TUR_reuniting_thrace_through_force:0 "Насильницьке возз'єднання Фракії"
 TUR_revolutionism:0 "Революціонізм"
