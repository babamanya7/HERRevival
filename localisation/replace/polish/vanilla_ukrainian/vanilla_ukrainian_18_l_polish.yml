 career_officer:0 "Кар'єрний офіцер"
 carrier_6:0 "Авіаносець VI"
 cat_fortification:0 "Фортифікаційна інженерія"
 cat_production:0 "Виробництво"
 cavalry_attack_factor_tt:0 " $MODIFIER_CAVALRY_ATTACK_FACTOR$: $RIGHT|+=0%$"
 china.15.t:0 "Перемога в області [From.From.GetName]"
 collaborator_king:0 "Король-колаборант"
 combat_entrenchment_tt:0 " $MODIFIER_COMBAT_ENTRENCHMENT$: $RIGHT|+=%1$"
 comintern_leavingtheharbor:0 "Покидаючи гавань"
 comintern_peace_1:0 "Матінка-Росія"
 commonwealth_research_desc:0 "Скорочення часу дослідження технологій, уже вивчених іншими країнами Співдружності."
 communism_drift_from_guarantees:0 "Ріст зарубіжного комунізму від гарантій"
 communism_on_the_rise_desc:0 "Видні політичні елементи почали виступати на користь комуністичних цінностей, знаходячи підтримку в дедалі більшої кількості населення. Шлях нації до комунізму відкритий; вона лише чекає на вибір мирного чи насильницького переходу."
 communist_orator:0 "Оратор спротиву"
 communist_theorist:0 "Теоретик комунізму"
 compliance_60:0 "Програма добровольців"
 congo_independence_struggle.10.a:0 "Ми можемо погодитись на їх статус домініону"
 conquest_of_abyssinia_desc:0 "Хворобливі спогади про Першу Абіссінську війну і програну битву при Адві залишилися в минулому. Тепер ми маємо намір остаточно підкорити Ефіопську імперію і приєднати її до італійських володінь у Східній Африці. Вперед, до перемоги!"
 construction3:0 "Будівництво III"
 construction5_desc:0 "Майбутнє ефективного будівництва полягає у більш ретельному плануванні окремих проєктів та повсюдному застосуванні стандартизованих методів."
 continuous_repair:0 "Ремонт споруд"
 control_brittany_bases_goal_desc:0 "Стратегічні бази вздовж узбережжя Бретані дозволять проводити більш широкомасштабні підводні та повітряні операції в Атлантиці, а також забезпечувати доступ до європейського материка."
 control_danish_belts_goal_name:0 "Контролювати Данські протоки"
 control_manila_goal_desc:0 "Володіння обороноздатною Манільською затокою дозволить проектувати силу через західну частину Тихого океану та забезпечити доступ до Ост-Індії та Південно-Китайського моря."
 core_black_sea_tt:0 "Усі §Yпричорноморські§! території стануть осердними.\n"
 country_capitulated.0.d_positive_prev_faction:0 "\n[From.From.GetLeader] оголосив, що боягузлива [Root.GetAdjective]а держава більше не може встояти під тиском розміщених у державі [From.From.GetAdjective]их військ. [Root.GetAdjective]а влада вирішила втекти з держави й створити уряд у вигнанні. Їхні основні війська капітулювали, а [From.From.GetNameDef] тепер контролює їхні головні території.\nПопри те, що війна проти залишків альянсу [Root.GetFactionName] продовжується, тим не менш це велика перемога для всього альянсу [From.From.GetFactionName]."
 country_idea_desc:0 "Ідеї, що надихають і спрямовують вашу країну."
 cv_nav_bomber_equipment_3_desc:0 "Сучасний морський бомбардувальник, модифікований для зльоту з та посадки на авіаносець."
 cv_plane_naval_upgrade:0 "Атака"
 czech.3.d:0 "[SOV.GetLeader] відхиляє наш запит на вступ до Комінтерну без жодних пояснень."
 dalmatia_democratic:0 "Республіка Далмація"
 danzig_for_guarantees:0 "Данциґ в обмін на гарантії"
