 RAJ_GOE_enforced_peace_decision_desc_2_3_tt:0 "§YЯкщо ми контролюємо [436.GetName], [984.GetName], [426.GetName], [438.GetName] та [435.GetName], ми отримаємо більші територіальні поступки, коли війна закінчиться§!"
 RAJ_GOE_enforced_peace_decision_desc_2_tt:0 "§YМи збережемо контроль над будь-яким з наступних регіонів§!: §YЗахідна Індія§!, §YПівденна Індія§!, §YЦентральна Індія§!, §YСхідна Індія§! та §YПівнічна Індія§!, за умови, що ми контролюватимемо всі штати у даному регіоні, коли припинення вогню набуде чинності."
 RAJ_GOE_independence_movement:0 "Рух за незалежність"
 RAJ_GOE_partition_is_over:0 "Поділ завершено"
 RAJ_GOE_pay_out_dividends_small_tt:0 "Наприкінці §Yфіскального року§! ми виплатимо $eic_low_investments_cost_tt$, назавжди видаливши це з випадкової держави. Натомість ми отримаємо невелику суму додаткових інвестицій від приватних інвесторів на весь період наступного фіскального року.\n\n"
 RAJ_GOE_rajendrasinhji_jadeja:0 "Раджендрасінджі Джадеджа"
 RAJ_GOE_sikh_recruitment_tt:0 "§YСтворює досвідчену гірську дивізію§!"
 RAJ_GOE_william_rhodes_davis:0 "Вільям Роудс Дейвіс"
 RAJ_UK_democratic_DEF:0 "Британська Індія"
 RAJ_a_congress_resurgent_desc:0 "Національний конгрес стрімко зростав у популярності та силі. Тепер це політична сила, яку не можна заперечувати."
 RAJ_annex_goa_desc:0 "Ґоа належить Індії, колись втраченій через імперіалістичні сили, і зрозуміло, що [POR.GetName] не в змозі його захистити. Нам потрібно виправити цю історичну несправедливість."
 RAJ_appoint_german_friendly_government_desc:0 "Узгодження нашого уряду з [GER.GetNameDef] зміцнить зв'язки з зростаючою силою Європи. Ця адміністрація надаватиме пріоритет промисловому зростанню, військовій модернізації та рішучому опору більшовизму."
 RAJ_black_markets_tt:0 "Кожна держава з §YГолодом§! має §YЧорний ринок§!, що ще більше дестабілізує державу.\nЗакриття §YЧорних ринків§! зменшує ризик поширення §YГолоду§! до максимум §Y20%§!, залежно від кількості наявних §YЧорних ринків§!."
 RAJ_boycott_british_made_goods_desc:0 "Надто довго [ENG.GetAdjective] видобували сировину з [GetRajName] і продавали нам назад очищений матеріал за високу ціну. [RAJ.GetRajAdjective]s повинні робити речі для [RAJ.GetRajAdjective]s, а не щоб нас обкрадали наші власні окупанти."
 RAJ_british_air_experts:0 "Британські повітряні експерти"
 RAJ_chariot_of_victory_desc:0 "Поле бою вимагає швидкості та сили. Інвестуючи в бронетехніку та механізовані сили, ми створюємо сучасну армію, здатну до швидких та рішучих перемог, забезпечуючи верховенство Індії в будь-якому конфлікті."
 RAJ_chindits__desc:0 "Чіндіти — це елітні, нетрадиційні воїни, навчені для довготривалих операцій у джунглях. Розширюючи їхні лави та вдосконалюючи їхню тактику, ми отримуємо силу, здатну перехитрити ворогів та порушити їхні операції глибоко за лінією фронту."
 RAJ_combined_arms_academy:0 "Академія поєднаних військ"
 RAJ_company_bonuses_desc:0 "Ми пов'яжемо продуктивність з потенційними бонусами для підвищення ефективності по всій компанії."
 RAJ_concessions_to_the_industrialists:0 "Поступки промисловцям"
 RAJ_cult_of_personality:0 "Культ особистості"
 RAJ_cv_nav_bomber_equipment_1:0 "Blackburn Shark"
 RAJ_defense_of_india_act_desc:0 "Безпеці [GetRajName] загрожує зовнішня агресія. [ROOT.GetLeader] оголосив прокламацією акт про спеціальні заходи для забезпечення громадської безпеки та інтересів, а також для захисту [GetRajAdjective] держави."
 RAJ_deforestation:0 "Паливо для вогню"
 RAJ_demobilize:0 "Демобілізація"
 RAJ_democratic_party_long:0 "Індійський національний конгрес"
 RAJ_destroyer_3:0 "$ENG_destroyer_3$"
 RAJ_dividend_status_high:0 "Ми виплатили §Yвисоку суму§! дивідендів інвесторам, що дає великий бонус на наступний §Yфіскальний рік§!."
 RAJ_dominate_the_bay_of_bengal_desc:0 "Забезпечення військово-морської переваги в Бенґальській затоці є важливим для нашої морської стратегії. Розширюючи нашу присутність та проектуючи силу в цих водах, ми захищаємо торговельні шляхи та стверджуємо регіональне домінування."
 RAJ_douglas_dakota_desc:0 "Ми гостро потребуємо швидкого транспортування військ та вантажів. «Dakota» — дуже здібний літак для цього завдання."
 RAJ_enrollment_of_dali_children:0 "Зарахування дітей далітів"
 RAJ_fight_malnutrition_desc:0 "Нам потрібно запровадити широкі плани боротьби з недоїданням серед населення."
 RAJ_give_me_blood_and_i_will_grant_you_freedom_tt:0 "Розпочне громадянську війну за незалежність між прихильниками демократії та нами\nКожна область, яка має понад §Y65%§! або §Y85% опору§!, стане на наш бік під час громадянської війни та надасть нам 1 або 2 дивізії відповідно, залежно від найвищого опору.\nУсі інші штати стануть на бік демократичної сторони."
 RAJ_has_crushed_black_market:0 "Закрито чорні ринки в [THIS.GetName]"
 RAJ_heavy_cruiser_3_desc:0 "$ENG_heavy_cruiser_3_desc$"
 RAJ_heavy_tank_aa_equipment_3:0 "Black Prince Marksman"
 RAJ_heavy_tank_artillery_equipment_1:0 "Gun Carrier Mk I"
 RAJ_heavy_tank_destroyer_equipment_3:0 "Hector"
 RAJ_heavy_tank_equipment_2:0 "Churchill Local Pattern"
 RAJ_holding_the_gates_of_india_desc:0 "Незважаючи ні на що, ми повинні захистити [RAJ.GetNonIdeologyName] від нападників, що лютують на сході. Вони можуть нападати на нас із завзяттям та люттю, але ми зупинимо їхнє невпинне завоювання біля Воріт [RAJ.GetNonIdeologyName]. Вони не пройдуть."
 RAJ_india_united_desc:0 "Ми мусульмани, індуси, християни, євреї; всі ми — Індія."
 RAJ_instigate_in_afg:0 "Підбурювати в [AFG.GetName]"
 RAJ_integrate_princely_railways_desc:0 "Деякі індійські принци фінансували будівництво власних залізниць, але вони погано пов'язані із залізницями Британської Індії. Ми мусимо щось зробити, щоб об'єднати залізниці країни."
 RAJ_invite_soviet_industrial_experts:0 "Запросити радянських промислових експертів"
 RAJ_lakshmi_sahgal:0 "Лакшмі Сагґал"
 RAJ_light_tank_artillery_equipment_3:0 "Bishop"
 RAJ_lobby_parliment_tt:0 "Ми почнемо формувати Ост-Індійську компанію"
 RAJ_medium_tank_destroyer_equipment_2_short:0 "Charioteer"
 RAJ_navy_funding_effect:0 "У ваш флот буде додано §Y2 легких крейсери§!, якщо у Вас уже є така технологія.\n"
 RAJ_peasant_uprisings_cat:0 "Селянські повстання"
 RAJ_pledge_for_the_allies:0 "Обіцянка Союзникам"
 RAJ_purge_the_reactionaries_desc:0 "Зі старим світом не може бути компромісу.\nВороги революції, саботажники та контрреволюційні елементи будуть викорінені."
 RAJ_rani_of_jhansi_regiment_desc:0 "Натхненні доблестю Рані Джхансі, ми створимо полк, що складається виключно з жінок, щоб протистояти гніту. Надавши цим сміливим бійцям можливість, ми завдамо потужного удару проти колоніального правління та переосмислимо роль жінок у боротьбі за незалежність."
 RAJ_reform_the_agricultural_system:0 "Реформувати сільськогосподарську систему"
 RAJ_research_city_excursions_desc:0 "Радянські наукогради сповнені чудес, а громадяни Індії талановиті та енергійні. Відправивши наших молодих конструкторів у ці міста, ми прискоримо розвиток науки та промисловості."
 RAJ_sanatani_desc:0 "Принципи Санатана-дгарми пропонують вічну основу для єдності та відродження Індії. Прийнявши ці цінності, ми можемо надихнути гармонійну та стійку націю, керовану традиціями."
 RAJ_secure_weapons_tt:0 "Зброя буде додана до запасів після завершення §YПовстання Великих Моголів§!."
 RAJ_super_heavy_tank_destroyer_equipment_1:0 "Iron Duke"
 RAJ_suppress_paramilitary_organizations_desc:0 "У [GetRajName] все ще існують розрізнені воєнізовані групи. Нам потрібно швидко їх викорінити, бо коли бур'яни міцно вкоренилися в ґрунті, коріння важко вирвати."
 RAJ_tata_steel_dlc_desc:0 "Розширення Tata Steel є ключовим для промислового зростання Індії, що зміцнить нашу самодостатність у металургії та забезпечить надійне постачання сталі для військових та цивільних потреб."
 RAJ_the_crown_and_the_world_desc:0 "Доля Імперії Моголів — повстати як неперевершена світова наддержава. Розширюючи наш вплив, просуваючи нашу силу та стверджуючи наше домінування, ми забезпечимо наше місце як кінцевого правителя сучасного світу."
 RAJ_the_hindu_martial_tradition_desc:0 "Від воїнів Шиваджі до захисників дхарми, ми відродимо наш стародавній військовий дух та підготуємо наш народ до майбутніх битв."
