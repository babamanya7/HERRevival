 untethered:0 "Неприв'язаний"
 upgrade_crypto_strength_2_desc:0 "§LСтає очевидно, що наших стандартних методів шифрування недостатньо для приховування повідомлень від ворожих очей. Наші найкращі уми розробляють схему машини, здатної створювати за допомогою заміни букв алфавіту нові шифри з потрібною нам частотою. Для ворогів вона стане повною загадкою.§!"
 upgrade_decryption_boost_2:0 "Машинне розшифрування"
 usa.23.d:0 "Зараз [From.GetName] набагато суворіше дотримується доктрини Монро. Окрім політичного впливу, який вони вже мають на нашу країну, офіційні особи держави [From.GetName] тепер заявляють, що вони готові втрутитися в будь-який конфлікт між американськими країнами."
 usa.4.d:0 "Зайнявши позицію проти німців, США, схоже, зацікавлені в тому, щоб Британія стійко протистояла німецькій загрозі. Однак вони також стурбовані збереженням власної військово-морської присутності в Атлантиці. В обмін на кілька наших військово-морських баз вони постачатимуть нашій країні міноносці. Кораблі були в резерві, але прийняття все одно зміцнить військові зв'язки між нашими країнами, і це може бути мудрим рішенням."
 usa.42.a:0 "Він скоро знову прибіжить до нас."
 usa.65.b:0 "Якщо він довіряє [GER.GetAdjective]им ворогам, ми не довіряємо йому!"
 usa.8.a:0 "Республіканці. Лендон відданий нашим цінностям."
