 JAP_sea_national_spiritual_mobliization_movement_desc:0 "«Розкіш — це наш ворог!» З ощадливістю, гігієною та наполегливою працею, піднесеними до рангу національних чеснот, для військових потреб вивільняється більше людських ресурсів, а воля божественного імператора належним чином доноситься до всіх наших імперських підданих."
