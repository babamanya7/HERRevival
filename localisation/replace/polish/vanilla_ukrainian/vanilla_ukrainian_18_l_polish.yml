 HABSBURG_reinforced_industry_desc:0 "Хоча важливо, щоб наші заводи могли працювати в мирний час, зараз не час вирішувати це питання. Наш промисловий сектор має бути в змозі протистояти війні, яка ведеться на власних теренах, і перш ніж цього буде досягнуто, ми не можемо пошкодувати часу на роздуми про операції в мирний час."
