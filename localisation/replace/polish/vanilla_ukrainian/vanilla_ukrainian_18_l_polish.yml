 CHI_dai_jitao:0 "Dai Jitao"
 CHI_dang_guo_desc:0 "Метою партії завжди було принести демократію нашій нації, але в ці непевні часи важливо, щоб Ґоміньдан міг діяти ефективно. Тому ми повинні тимчасово поставити партію вище за націю."
 CHI_dare_to_die_corps:0 "Загони смертників"
 CHI_decree_the_end_to_corruption:0 "Указ про кінець корупції"
 CHI_denounce_feudalism:0 "Засудити феодалізм"
 CHI_empower_the_bureau_of_investigation_and_statistics:0 "Розширити повноваження Бюро розслідувань"
 CHI_experimental_mechanised_unit_desc:0 "Європейські теоретики давно ведуть дискусії щодо найефективнішого застосування танків. Поки що здається, що найкраще поєднувати швидкі танки та мобільні піхотні групи. Потрібно сформувати таке з'єднання."
 CHI_facilitate_operation_zet:0 "Сприяти операції «Зет»"
 CHI_found_a_modern_fertiliser_plant_desc:0 "Щоб прогодувати націю, ми повинні раціоналізувати наше сільське господарство, і місцеве виробництво добрив є першим кроком. Ми побудуємо завод для цієї мети, але також використаємо його для інших потреб."
 CHI_gu_zhutong:0 "Ґу Чжутун"
 CHI_heavy_weapons_desc:0 "Без підтримки артилерії армія зможе відбити напад ворогів. Потрібно забезпечити збройні сили адекватним спорядженням."
 CHI_improve_opium_modifiers_output_trigger:0 "Промислова ефективність незаконної торгівлі є від'ємною"
 CHI_institute_a_national_registry_of_property_desc:0 "Бюрократія є основою держави, а бюрократія не може ефективно функціонувати, якщо немає точної інформації. Саме через цю неефективність недобросовісні агенти можуть використовувати систему та збагачуватися на шкоду решті нашої нації."
 CHI_integrate_the_warlords_sea_cat:0 "Інтеграція воєначальників"
 CHI_invest_in_mountain_guns:0 "Інвестувати в гірські гармати"
 CHI_invest_in_officer_training:0 "Інвестувати в підготовку офіцерів"
 CHI_invite_foreign_investors:0 "Запросити іноземних інвесторів"
 CHI_land_tax_reform_desc:0 "Наша фінансова система відчайдушно потребує реформ. Частина цих реформ — розширення основи оподаткування."
 CHI_ledo_road:0 "Дорога Ледо"
 CHI_light_tank_destroyer_equipment_3:0 "PTZ 41"
 CHI_look_for_allies:0 "Шукати внутрішніх союзників"
 CHI_medium_tank_equipment_1_short:0 "Type 39"
 CHI_minsheng_focus_desc:0 "Сучасна держава піклується про своїх громадян, щоб у разі потреби громадяни могли та хотіли її захищати. З цією метою ми повинні запровадити принцип Міньшен (Народний добробут) і гарантувати, що соціальне забезпечення може бути надане всім громадянам країни."
 CHI_monopolise_resource_extraction_desc:0 "Ми спостерігали в інших країнах силу центральної організації планування економіки. Особливо дії щодо забезпечення того, щоб потік ресурсів не припинявся і не експлуатувався приватними інтересами, повинні лежати в руках технократів, або в нашому випадку — Національної ресурсної комісії."
 CHI_opium_cat:0 "Антиопіумна політика"
 CHI_personal_leadership_tt:0 "§Y$CHI_chen_jitang$§! стає доступний як фельдмаршал §Y3§! рівня."
 CHI_promote_the_national_currency_desc:0 "Наша нещодавня заміна срібного стандарту запровадженням нової національної валюти показала перші хороші результати у зниженні нашої залежності від глобальних подій. Однак використання нової валюти найбільш поширене у великих містах, і ми повинні докласти спільних зусиль, щоб забезпечити її прийняття в сільській місцевості."
 CHI_protracted_warfare_desc:0 "Відтоді, як [JAP.GetNameDef] перемогла росіян, її народ повірив, що швидкі, агресивні дії є шляхом до перемоги. Це призвело до того, що вони мають армію без запасу міцності, тому якщо ми позбавимо їх швидкої перемоги, їхні підрозділи розсиплються за короткий час."
 CHI_protracted_warfare_idea:0 "Затяжна війна"
 CHI_provoke_border_clashes_effect_tooltip:0 "Відкриває £decision_icon_small §Hрішення§! про початок §Hприкордонних конфліктів§! із державою [WTT_current_china_leader.GetNameDef]\n"
 CHI_purchase_fighters_tt:0 "Ми отримаємо 50 старих винищувачів від держави, що підтримує нас. У разі підтримки Великої Британії та США ми отримаємо винищувачі від обох держав."
 CHI_rapidity_is_the_essence_of_war_desc:0 "Швидкість і несподіванка — наша найкраща зброя, і вміння використовувати ці елементи буде першочерговим у сучасній війні. Сміливі та швидкі маневри виб'ють ворога з рівноваги і, таким чином, дозволять нам вдарити глибше і з меншим опором."
 CHI_redistribute_land_desc:0 "Значною мірою фермери нашої країни працюють на землевласників, які визискують цінність для особистої вигоди. Це не може тривати далі, оскільки це знижує продуктивність нашої країни і стримує її розвиток."
 CHI_sea_anti_communism:0 "$CHI_anti_communism$"
 CHI_sea_industrial_evacuations_desc:0 "$CHI_industrial_evacuations_desc$"
 CHI_sea_integrate_tibet_desc:0 "$CHI_integrate_tibet_desc$"
 CHI_sea_legislative_yuan_desc:0 "$CHI_legislative_yuan_desc$"
 CHI_sea_personal_leadership:0 "$CHI_personal_leadership$"
 CHI_sea_taiyuan_arsenal:0 "$CHI_taiyuan_arsenal$"
 CHI_start_looking_outwards_desc:0 "Помилкою минулого було вірити, що ми можемо стояти осторонь від світу. Колоніальні нації розірвали нас на шматки разом з рештою Азії, залишивши нас збезчещеними. Це не може залишитися безкарним. Ми організуємо решту Азії, щоб стояти разом у силі."
 CHI_suppression_of_anti_japanese_sentiments_idea:0 "Придушення антияпонських настроїв"
 CHI_the_hump_sea_tt:0 "\n [?CHI_the_hump_sea_infantry_equipment|Y0] од. $infantry_equipment$"
 CHI_tour_the_south:0 "Поїздка на південь"
 CHI_train_marines:0 "Вишкіл морської піхоти"
 CHI_tsr_restoration_of_the_chinese_empire_desc:0 "Настав час відновити нашу націю і вивести її зі століття приниження, яке вона була змушена терпіти. Настав час заявити про своє місце в міжнародних справах і героїчно постати у всесвіті. Настав час для [ROOT.GetLeader] взяти на себе роль Великого імператора Китайської імперії!"
 CHI_war_of_resistance:0 "Партизанська війна"
 CHI_warlord_PRC_neutrality_ADJ:0 "Китайськ"
 CHI_xian_refused:0 "Відмовилися формувати Об'єднаний фронт"
 CHL_abolished_serfdom_desc:0 "Епоха асендадів сакінчилася, і нашим селянам більше не доведеться жити в кріпацтві!"
 CHL_amerindian_federation_communism_DEF:0 "Велика федерація америндських народів"
 CHL_amerindian_federation_neutrality_DEF:0 "Велика федерація америндських народів"
 CHL_an_absolute_monarchy_tt:0 "Це §Rзаборонить§! виконання фокусу §Y$CHL_the_straight_line$§! нижче в дереві фокусів."
 CHL_an_empire_in_the_pacific_idea_desc:0 "Нарешті настав час для держави [CHL.GetNameDef] заявити про свою долю та вибудувати могутню імперію в Тихому океані."
 CHL_compania_electro_industrial_valdivia_desc:0 "ESVAL — металургійне підприємство, розташоване у Вальдівії в Чилі. Підприємство вважається спадкоємцем компанії Altos Hornos y Acerías de Corral, інфраструктуру якої воно придбало у 1926 році, коли його створили підприємці з Вальдівії."
 CHL_compania_general_electricidad:0 "Compañia General de Electricidad"
 CHL_cooperation_with_the_falange:0 "Співробіництво з Національною фалангою"
 CHL_democratic:0 "Чилі"
 CHL_destroyer_1_desc:0 "The Almirante Lynch-class destroyers were a group of six ships built for the Chilean Navy in the U.K. just before World War I. Only two ships were delivered before the outbreak of war and served until 1945. They displaced 1,430 tons, had decent speed and range for their vintage, and were armed with six 4 in. L/40 QF Mark VI main guns and two 21 in. torpedo tubes."
 CHL_embrace_indigenous_corporatism_desc:0 "Ідеї корпоративізму Венансіо Конюепана Уенчуала, засновані на старих способах ремесел і будівництва корінних чилійців, мусять бути сприйняті і перетворені на офіційну державну політику для галузей промисловості в нашій країні."
 CHL_expand_the_carabineros_tt:0 "Це §Gзменшить масштаб§! спроби §Yнацистського заколоту§!."
 CHL_fascism:0 "Авангардистське Чилі"
 CHL_hispanic_supremacy_pact_faction:0 "Ліга гіспанської зверхності"
 CHL_ibanez_approaching_argentinian_army_mission_tt:0 "Ібаньєс здобуде додаткові дивізії з початком війни за незалежність."
 CHL_ibanez_strengthening_the_carabineros_mission:0 "Ібаньєс зміцнює Карабінерів Чилі"
 CHL_inflation_control_by_the_central_bank:0 "Контроль над інфляцією з боку Banco Central de Chile"
 CHL_integrate_quebec:0 "Інтегрувати Квебек"
 CHL_introduce_the_franc:0 "Представити франк"
 CHL_joint_development_programs_desc:0 "Тепер, коли ми союзники, ми мусимо докладати зусиль для спільного будівництва нових заводів, щоби краще розвивати кожну з наших країн."
 CHL_machi_in_the_army:0 "Організація армійських мачі"
 CHL_manuel_panguilef:0 "Мануель Абурто Пангілеф"
 CHL_mapuche_state_fascism:0 "Імперія мапуче"
 CHL_monarchist_decisions_desc:0 "Тепер, коли країна є однопартійною державою, є багато речей, які [ROOT.GetLeader] мусить санкціонувати і про які треба подбати."
 CHL_national_falange_cooperation_mission:0 "Алессандрі підступає до Національної фаланги"
 CHL_new_fatherland:0 "Патрія-Нуева"
 CHL_new_fatherland_neutrality_DEF:0 "Королівство Патрія-Нуева"
 CHL_news_events.4.t:0 "Мапуче оголошують священну війну проти імперіалізму"
 CHL_news_events.7.b:0 "Потрібно захистити Рапа Нуї"
 CHL_peru_payments_to_chile_desc:0 "Наразі ми зобов'язані щомісяця сплачувати велику суму грошей державі [CHL.GetNameDef], через придбання області [951.GetName]."
 CHL_political_events.17.desc:0 "Президентські вибори знову наближаються, і термін [ROOT.GetLeader] відповідно добіг кінця. Глобальний конфлікт наближається до кінця, але ще не закінчився. Питання, яке зараз хвилює всіх: хто повинен взяти на себе мантію Алессандрі на наступний термін і керувати країною в ці неспокійні часи?"
 CHL_political_events.18.c:0 "Ґільєрмо Барріос Тірадо"
 CHL_political_events.19.desc:0 "Після критики по всій країні Артуро Алессандрі пішов у відставку та оголосив дострокові вибори, і цього разу, здається, вітри дмуть на користь лівого крила, оскільки народ стікається до виборчих скриньок. Хто поведе, і як ця подія сформує нову республіку?"
 CHL_political_events.2.b:0 "Ні, ми відмовляємо!"
 CHL_political_events.20.a:0 "Еліас Лафертте Ґавіньйо"
 CHL_political_events.26.t:0 "[FROM.GetName] приймає анексію"
 CHL_political_events.31.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вирішив відмовити нам у допомозі в наших зусиллях здійснити переворот проти нинішнього уряду та встановити диктатуру, яка зможе протистояти американцям."
 CHL_political_events.33.t:0 "[GER.GetLeader] приймає наш запит"
 CHL_political_events.44.a:0 "Як ти смієш!"
 CHL_political_events.65.t:0 "[From.GetAdjective] захоплення [311.GetName]"
 CHL_political_events.66.desc:0 "[CHL.GetLeader] виступив сьогодні з великою промовою, засуджуючи нашу, як він стверджує, незаконну та несправедливу окупацію гвіанських територій. Він вимагає, щоб ми негайно передали регіон їм, щоб він міг звільнити народ від імперіалістичного гніту."
 CHL_political_events.80.t:0 "[FROM.GetName] вирішує не допомагати нам"
 CHL_political_events.84.desc:0 "Сьогодні, коли новини про нашу громадянську війну почали доходити до світу, Президент Карлос Ібаньєс дель Кампо отримав повідомлення з Франції. Таємничий чоловік, який стверджує, що є нащадком старої династії в Чилі, що походить від Орелі-Антуана I, Короля Арауканії та Патагонії, заявив, що має дозвіл від французьких купців та легіонерів допомогти нам, але стверджує, що це матиме свою ціну. Ситуація виглядає важкою, і незабаром можуть знадобитися рішучі заходи."
 CHL_political_events.85.a:0 "Наразі ми не маємо сил, щоб впоратися з ними"
 CHL_political_events.85.desc:0 "Острів Пасхи, який місцеві жителі називають Рапа Нуї, перебував під нашим прямим контролем з моменту анексії Королівства Рапа Нуї в 1910 році, і держава існувала з того року до того часу. Тепер вони знову об'єдналися під керівництвом місцевого 'Арікі, Валентіно Ріророко Тукі, та регентської ради, що піклується про нього. Полінезійська держава бажає розірвати з нами всі зв'язки і тому оголосила незалежність. Чи приймаємо ми це?"
 CHL_proliferate_national_populism_desc:0 "Цивільне населення не менш важливе за будь-що інше, особливо якщо ми хочемо стабілізувати нашу державу після перевороту. Ми мусимо заручитися їхньою підтримкою — навіть нечесними методами, якщо знадобиться!"
 CHL_satellite_kingdoms_desc:0 "Наполеон Великий є великим натхненником для Антуана, і його доктрини були такими для всіх державних діячів світу. Ми мусимо робити, як він, і створювати невеликі буферні держави, які дозволять місцевому населенню не думати про своїх нових володарів дуже багато."
 CHL_sell_arica_to_peru:0 "Продати Аріку Перу"
