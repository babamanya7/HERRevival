 elastic_defence:0 "Гнучка оборона"
 election.4.d:0 "Агресивно націоналістичні настрої в державі [Root.GetName] зросли, що призвело до появи кількох партій, які пропагують фашистські ідеали держави, що впроваджує свою владу силою. Одна з них, зокрема, здобула перемогу на поточних виборах, що призвело до дискусій усередині партії [Root.GetRulingParty] про те, чи варто нам намагатися співпрацювати з нею у формуванні нашого уряду. Хоча вони відкрито відкидають демократичні ідеали, на яких ґрунтується наша держава, сам факт їхньої участі у виборах надає певної довіри до наших поглядів, а визнання їхньої суспільної підтримки може утримати їх від насильницьких дій."
