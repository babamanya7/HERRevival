 TUR_strike_the_british_imperialists:0 "Ударити по британських імперіалістах"
 TUR_taking_over_defense_of_the_gulf:0 "Взяти під контроль оборону затоки"
 TUR_the_guardians_of_kemalism:0 "Вартові кемалізму"
 TUR_the_pan_national_association_of_ulemas_desc:0 "Ми не національний рух, ми стоїмо не просто за владу султана, а й за владу мусульман у всьому світі. Ми не дотримуємося поглядів націоналізму, бо віримо у міжнародну справу ісламу! Ми співпрацюватимемо з релігійними лідерами в усьому світі, щоби зрозуміти, як нам найкраще поширити свою релігію та звільнити свою паству мечем."
 TUR_the_sanayiciler_desc:0 "Ататюрк роками невпинно працював, щоби створити клас підприємців та промисловців, який допоможе модернізувати нашу державу. Настав час припинити культивувати і почати пожинати плоди. Ми будемо працювати разом, щоб підвищити вплив Туреччини у регіоні."
 TUR_the_turkish_tank_project:0 "Проєкт турецького танка"
 TUR_three_factories_sacrificed:0 "Ліквідовано три §Yцивільні заводи§!."
 TUR_traditionalist_infiltration_mission_desc:0 "Схоже, релігійні елементи нашого суспільства намагаються знову впровадити своїх послідовників туди, де вони мають лише невелику підтримку."
 TUR_turkish_panzers:0 "Турецькі «Панцери»"
 TUR_utilising_our_terrain_desc:0 "Анатолія — мрія захисника і кошмар загарбника. Ми знаємо свою країну і маємо використовувати її природні укріплення, щоб ускладнити життя будь-яким окупантам."
