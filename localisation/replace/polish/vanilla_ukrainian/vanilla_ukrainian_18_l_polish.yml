 tsr_manchukuo_border_war.2.desc:0 "Зіткнувшись із серйозними труднощами, [MAN.GetAdjective]а армія відступила з міста Калґан. Можливо, це ще не кінець конфлікту, але поки що Калґан залишатиметься [CHI.GetAdjective]им."
