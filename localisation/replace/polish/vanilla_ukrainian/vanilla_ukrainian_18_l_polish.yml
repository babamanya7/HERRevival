 JUNO_brazil_events.86.t:0 "Комуністи в [BRA.GetNameDef] просять нашої допомоги"
 JUNO_brazil_events_153_tt:0 "Рішення §Y$BRA_cangaceiro_decision_cat$§! та §Y$BRA_cangaceiro_mission$§! залишатимуться активними, доки Канґасу не буде усунено з усіх постраждалих штатів.\n\nНаціональний фокус §Y$BRA_deal_with_the_cangaceiro$§! відімкне рішення для усунення Канґасу."
