 ROM_AUS_danubian_state:0 "Дунайська держава Румунія"
 ROM_EQUIPMENT_VERSION_15:0 "O"
 ROM_appoint_soviet_friendly_government_desc:0 "Майбутнє Румунії залежить від добрих стосунків із нашим комуністичним східним сусідом. Ми мусимо призначити уряд, який розуміє цю реальність."
 ROM_balkans_dominance_desc:0 "Ключ до процвітаючого майбутнього Румунії лежить не в революціонерах Сходу, чи демократіях чи фашистах Заходу, а в домінуванні Румунії на Балканах."
 ROM_ermil_gheorghiu:0 "Ерміл Ґеорґіу"
 ROM_ford_organization:0 "$ROM_ford$"
 ROM_heavy_fighter_equipment_3_short:0 "IAR 410"
 ROM_invite_italy:0 "Запросити державу [ITA.GetNameDef]"
 ROM_light_ship_engine_3:0 "Двигун 57 000 к. с. н. в."
 ROM_light_tank_destroyer_equipment_3:0 "TACAM T-38"
 ROM_medium_tank_destroyer_equipment_2_short:0 "TACAM R-2"
 ROM_medium_tank_equipment_1_short:0 "T-39"
 ROM_mio_trait_black_sea_armor:0 "Броня Чорного моря"
 ROM_mountain_artillery_tech_tt:0 "Відкриває: §HГірські гармати§!\n§HАртилерія\n    Гори§!: Рух: §G+15%§!\n§HПТА\n    Гори§!: Рух: §G+15%§!"
 ROM_national_christian_party_desc:0 "Письменник Октавіан Ґоґа має сильний вплив на наш народ через свою Національну християнську партію. Народившись завдяки впливу, отриманому як Аграрна партія, вона має міцні зв'язки з сільськими громадами. Реорганізація нашого Кабінету міністрів могла б використати його вплив на нашу користь."
 ROM_polish_loyalists_neutrality:0 "Тимчасове королівство Польща-Румунія"
 ROM_reserve_divisions_desc:0 "Румунія — невелика нація, і ми повинні виділити відповідну чисельність у резервні дивізії, якщо наша армія хоче мати хоч якусь силу на полі."
 ROM_the_armored_division_tt:0 "Отримає дві військові частини з §Y4 [ROM_UnlockedArmor]ими танковими§! та §Y4 мотопіхотними§! батальйонами.\n\n Додає §Yрозвідроти§! до дивізій, якщо досліджена відповідна технологія."
 ROM_white_squadron:0 "$ROM_white_squadron_focus$"
 RULE_ALLOW_LICENSING:0 "Ліцензії на виробництво"
 RULE_ALLOW_LICENSING_SAME_IDEOLOGY_DESC:0 "Держави можуть отримувати ліцензії лише від держав з однаковою керівною ідеологією."
 RULE_ALLOW_SCORCHED_EARTH:0 "Випалена земля"
 RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC:0 "§HФранцузький§! ШІ намагатиметься утворити Малу Антанту, щоби стримати Німеччину. Якщо ж Чехословаччина створить її раніше, Франція натомість приєднається до неї (потрібне доповнення «Death or Dishonor»)."
 RULE_ENTENTE_EST_AI_DESC:0 "§HЕстонія§! намагатиметься затвердити Балтійську Антанту та вижити супротив СРСР."
 RULE_FASCISM_ARG_AI_DESC:0 "ШІ намагатиметься перетворити країну на фашистську та приєднається до країн Осі, щоби відкрити новий фронт у Південній Америці."
 RULE_FASCIST_CAN_AI_DESC:0 "§HКанадський§! ШІ намагатиметься перейти у фашизм і вступити в союз із Німеччиною, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_GROUP_COUNTRY_SPECIFIC:0 "Правила гри для окремих країн"
 RULE_OPTION_ALT_FASCIST_BALBO:0 "Альтернативний фашизм — Італо Бальбо"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0 "§HБолгарська демократична партія§! спробує приєднатися до Союзників і буде плести змову проти царя Боріса, щоб усунути його від влади і утворити регентську раду, яка підтримує Союзників."
 RULE_OPTION_DEMOCRATIC_YUG_AI_DESC:0 "§HЮгославський§! ШІ намагатиметься зберегти демократичний уряд, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_ETH_STALINIST:0 "Комунізм: радянська підтримка"
 RULE_OPTION_HUN_COMMUNIST_STALINISM:0 "Сталін Паннонії"
 RULE_OPTION_MONARCHIST_GRE_AI_DESC:0 "§HГреція§! прийме абсолютну монархію і намагатиметься приєднатися до Союзників."
 RULE_OPTION_NEUTRALITY_MONARCHIST_DESC:0 "Після відновлення монархії в §HПортугалії§! король Дуарте звернеться із зверненням до бразильських монархістів і спробує відновити §HІмперію Португалії та Бразилії§!."
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC:0 "Маріонетки дають частину своїх балів мирної конференції своєму володареві. Співвідношення залежить від рівня автономії."
 RULE_OPTION_SOVIET_REPUBLIC:0 "Радянська республіка"
