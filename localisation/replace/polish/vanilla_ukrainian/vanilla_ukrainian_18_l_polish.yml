 wtt_border_conflict_lost_defender.1.a:0 "Потрібно контратаувати якомога раніше!"
 wtt_burma_road.4.a:0 "Яке потрібне полегшення."
 wtt_denmark.1.d:0 "Розірвавши договір після вторгнення, парламент Ісландії взяв під контроль всю зовнішню політику держави. Це вважається тимчасовим заходом до закінчення окупації."
 wtt_germany.11.a:0 "Ми маємо висловити свою подяку."
 wtt_germany.17.d:0 "Уряд Німеччини вжив жорстких заходів щодо комуністів і змусив їх залишити країну. Внаслідок цього від нашого сусіда до нас звернувся цілий потік носіїв комуністичної ідеології..."
 wtt_germany.19.a:0 "Провести широкомасштабні військові навчання з метою залякати їх усіх!"
 wtt_germany.2.t:0 "Німецькі емігранти підтримують нас"
 wtt_germany.30.d:0 "Німецька імперія скасувала вигнання Вільгельма II і звернулася до Нідерландів із вимогою повернути колишнього кайзера. Схоже, незважаючи на численні вимоги екстрадиції з метою закликати кайзера до відповідальності, що раз у раз відхиляються урядом Нідерландів, цей розпалювач війни знову очолить Німецьку імперію.\n\nФранція, схоже, має намір обмежити своє обурення дипломатичними запереченнями, а громадськість Великої Британії твердо налаштована проти війни.."
 wtt_germany.49.desc:0 "Нарешті [nazi_state_withdrawn.GetName] під нашим контролем, але битва була суворою. З кожним нашим кроком уперед нацисти ставали все більш фанатичними і відчайдушними, часом борючись доти, поки навколо них не залишалися лише руїни. Часто вони дотримувалися тактики випаленої землі, слідуючи Гітлеровому так званому «Декрету Нерона».\n\nПоки ми не закінчимо цю війну, слід очікувати подальших руйнувань."
 wtt_germany.50.t:0 "Гітлер знайдений мертвим"
 wtt_germany.56.desc:0 "У війні з Радянським Союзом ми програємо та ризикуємо втратити все. За останні кілька років у Німеччині, нашому західному сусіді відбулися великі зміни, але тепер вона вважається поборником демократичних цінностей. Договір про швидке повернення старих німецьких територій, Данциґа та Познані, безсумнівно, врятує мільйони життяв від радянського ярма."
 wtt_germany.72.desc:0 "Оскільки ми й так близькі союзники, [From.GetNameDef] пропонує допомогти нам у розширенні нашої військової економіки, ще щільніше поєднавши наші економічні системи. Це помітно сприятиме зростанню нашої армії, але нам доведеться підкорятися їм у питаннях зовнішньої політики."
 wtt_germany.999.desc:0 "Кайзер [From.GetLeader] попросив [From.GetAdjective]ий уряд звернувся до нас із проханням скасувати закон 1917 року про позбавлення членів королівської сім'ї та князівських пологів Німеччини британських титулів перів та королівських титулів. Воно стверджує, що такий акт покаже світові, що аристократичні сімейства Великої Британії та Німеччини дійсно повернулися до довоєнних сприятливих стосунків, і послужить символом майбутньої англо-німецької дружби..."
 wtt_japan.116.t:0 "[From.GetName] приєднується до війни"
 wtt_japan.2.desc:0 "Уряд держави [From.GetNameDef] ретельно обміркував нашу пропозицію щодо «підтримання порядку» в їхніх колоніях і вирішив погодитись. Він передає нам повний контроль над цими колоніями."
 wtt_japan.21.a:0 "Схоже, в державі [From.GetNameDef] щось не те..."
 wtt_japan.41.t:0 "Військова домога від держави [From.GetNameDef]"
 wtt_ledo_road.3.desc:0 "Після успішного захоплення більшої частини дороги Ледо [From.GetAdjective]а влада дозволила транспортний рух нею. Загроза з боку ворожих військ зберігається, але постачання нею знову надходить."
 wtt_manchukou.1.a:0 "Уся ця республіканська витівка однаково не спрацює."
 wtt_manchukou_bandit_sabotage.21.t:0 "Саботаж на збройовому заводі"
 wtt_manchukou_bandit_sabotage.23.desc:0 "Минулої ночі один із головних залізничних мостів у області [FROM.GetName] впав під вагою поїзда, що проїжджав, з боєприпасами. Операцію з порятунку та відновлення ускладнив вибух боєприпасів. Персонал поїзда досі не знайдено, найімовірніше, усі загинули.\n\nВійськова розвідка відразу ж, як тільки ситуація стала відносно безпечною, вислала групу слідчих з метою з'ясувати, чому обрушилася така міцна споруда. Очевидці стверджують, що за день до обвалення бачили в долині невелику групу людей. В даний час їхнє місцезнаходження невідоме."
 wtt_news.10.b:0 "Звісно, вони не зроблять щось іще дурніше!"
 wtt_news.10.c:0 "Принаймні було створено альянс."
 wtt_news.11.t:0 "Радянці вбезпечують свою сферу впливу"
 wtt_news.13.b:0 "Яке щастя, що німці побачили здоровий глузд."
 wtt_news.14.desc:0 "У відповідь на рішення Німеччини повернути Вільгельма II і незважаючи на відсутність підтримки з боку англійців [FRA.GetNameDef] оголосила їй війну. Французи заявили про «вопильну впертість» німців, які дозволили «відомому військовому злочинцю» знову стати на чолі своєї держави і тим самим загострили обстановку.\n\nПредставники французького уряду стверджують, що дозволити «розпалювачу Великої війни» знову вдягнути корону — це вкрай аморально, і що уряд Німеччини проігнорував усі попередження. «У нас немає іншого вибору»."
 wtt_news.17.b:0 "Як вони сміють здавати *нашу* територію?!"
 wtt_news.18.a:0 "В ім'я Великої Німеччини."
 wtt_news.18.b:0 "Вони цього бажали."
 wtt_news.19.b:0 "Це був найкращий варіант..."
 wtt_news.22.desc:0 "Німеччина продовжує антирадянську риторику і тепер пропонує конкретний план обмеження радянського впливу в Європі. Вона створила новий Центральноєвропейський альянс, який, як вона сподівається, надасть усім його членам захист від того, що називають «розбещеною радянською агресією»."
 wtt_news.3.d:0 "Ми мусили натиснути на Нідерланди сильніше, вимігши його екстрадицію!"
 wtt_news.35.a:0 "Обурливо!"
 wtt_news.41.e:0 "Жахливий удар по американцях!"
 wtt_news.44.b:0 "Порядок відновлений."
 wtt_news.56.desc:0 "Завоювавши всі колишні землі Австро-Угорської імперії, [From.GetOldAdjective]ий уряд як представників останньої держави-спадкоємця розпочав об'єднання цих територій. Державна пропаганда всіляко вихваляє «славні дні імперії» з метою заручитися широкою підтримкою населення при здійсненні націоналістичних реформ та повернення до імперських порядків.\n\nЯк крок назустріч цій меті [From.GetOldAdjective]ий уряд заявив про відродження держави [From.GetNameDef] та відповідним чином офіційно перейменувало країну."
 wtt_news.56.t:0 "Відродження держави [From.GetNameDef]"
 wtt_news.60.a:0 "Це необхідно для нашого виживання."
 wtt_news.61.desc:0 "Завоювавши всі колишні землі Османської імперії, [From.GetOldAdjective]ий уряд як представників останньої держави-спадкоємця розпочав об'єднання цих територій. Державна пропаганда всіляко засуджувала Союзників, які розділили між собою імперські землі, і вихваляла «славні дні імперії» з метою заручитися широкою підтримкою населення новопридбаних територій при здійсненні націоналістичних реформ та повернення до імперських порядків.\n\nЯк крок до цієї мети [From.GetOldAdjective]ий уряд заявив про відродження держави [From.GetNameDef] та офіційно перейменувало країну."
 wtt_political_organisation.4.desc_had_majority:0 "Застосувавши всі доступні засоби, агенти держави [majority_country.GetNameDef], схоже, зуміли схилити населення області [state.GetName] на свій бік. Ми мусимо значно збільшити наші зусилля у боротьбі за довіру громадян."
 wtt_prc.10.a:0 "Ми ризикнемо з урядом."
 wtt_prc.2.a:0 "От параноїк."
 wtt_warlord_vs_prc.10.t:0 "Приєднатися чи вмерти"
 wtt_warlord_vs_prc.33.desc:0 "[From.GetLeader] висловив розуміння, проте ввічливо, але рішуче відмовився від нашої вимоги надати нам безпосередній контроль за їхньою політикою. Передбачається, що ми «не знайомі» з місцевими умовами та маємо надати право трактувати марксистське вчення місцевим експертам."
 wtt_warlord_vs_prc.35.b:0 "Це йде врозріз із [Root.GetAdjective]ими інтересами."
 wuw_GER_diplomacy.37.a:0 "Мудре рішення"
 wuw_GER_diplomacy.53.a:0 "Це вигідно обом сторонам"
 wuw_GER_diplomacy.57.t:0 "[FROM.GetNameDefCap] вимагає повернення Північного Шлезвігу"
 wuw_GER_diplomacy.67.a:0 "Це піде нам на користь"
 wuw_GER_diplomacy.75.a:0 "За пролетаріат!"
 wuw_GER_legions.7.b:0 "Нам не потрібна ця російська наволоч"
 wuw_GER_monroe.12.t:0 "Війна між [USA.GetNameDef] і [GER.GetNameDef] припиняє суперечку щодо Доктрини Монро"
 wuw_GER_monroe.2.a:0 "Ми захистимо всіх, хто не виступив проти нас!"
 wuw_GER_monroe.4.a:0 "А що нам дав [USA.GetNameDef]?"
 wuw_GER_monroe.9.t:0 "[FROM.GetNameDefCap] Скасовує Доктрину Монро"
 wuw_GER_news.1.a:0 "Між німцями нарешті знову немає кордонів"
 wuw_GER_realpolitik.11.a:0 "Великий день для [ROOT.GetNameDef]!"
 wuw_GER_realpolitik.16.t:0 "[FROM.GetNameDefCap] вимагає нашої анексії"
 wuw_GER_realpolitik.28.a:0 "За республіку!"
 wuw_GER_realpolitik.28.b:0 "Ми повинні зупинити цю дурницю!"
 wuw_GER_realpolitik.36.t:0 "[FROM.GetNameDefCap] пропонує об'єднання"
 wuw_GER_realpolitik.7.t:0 "[FROM.GetNameDefCap] вимагає, щоб ми стали їхнім васалом"
 wuw_GER_reichskommissariats.16.t:0 "Керівництво Великобританії"
 wuw_GER_reichskommissariats.9.desc:0 "[ROOT.GetLeader] відкрито заявляє про бажання перетворити колонію поволжських німців на територію рейху. Деякі місцеві чиновники вважають, що краще керувати регіоном з найближчої держави. Як вирішимо це питання?"
 wuw_GER_weltpolitik.19.b:0 "Нехай спробують забрати!"
 wuw_HUN_a_hungarian_galicia:0 "[ROOT.GetAdjective]а Галичина"
 wuw_HUN_a_new_pride_of_the_fleet:0 "Нова гордість флоту"
 wuw_HUN_an_alliance_with_italy:0 "Союз із державою [ITA.GetNameDef]"
 wuw_HUN_anglo_hungarian_alliance:0 "Англо-угорський альянс"
 wuw_HUN_anglo_hungarian_alliance_desc:0 "Горті завжди підтримували тісні зв’язки з британцями, і в нинішній нестабільній ситуації нашій державі пора шукати союзників. Британія — природний партнер для співпраці, їхня допомога дозволить нам зосередитися на своїх справах на континенті."
 wuw_HUN_continue_the_regency:0 "Продовжити регентство"
 wuw_HUN_demand_southern_slovakia_desc:0 "Етнічна [ROOT.GetAdjective] меншина у [664.GetName] зазнає утисків. Ми маємо захистити її та повернути собі цей регіон."
 wuw_HUN_elect_a_democratic_king:0 "Обрати демократичного короля"
 wuw_HUN_expand_the_hungarian_academy_of_sciences_desc:0 "Угорська академія наук — найважливіше та найпрестижніше наукове товариство [ROOT.GetName]. Її основні завдання — розвиток науки, поширення наукових відкриттів, підтримка досліджень і представлення угорської науки в країні та за кордоном."
 wuw_HUN_guarantee_religious_liberties_desc:0 "Багато людей покинули нашу країну, коли вона почала пригнічувати тих, хто не був католиком. Щоб зупинити витік мізків, ми повинні змінити ці закони та працювати над створенням світської держави. Це дозволить багатьом яскравим умам, які втекли з нашої країни, повернутися назад."
 wuw_HUN_news_events.5.t:0 "[HUN.GetLeader] приймає угорську корону"
 wuw_HUN_news_events.9.desc:0 "Цього тижня [HUN.GetAdjective] війська увійшли до Айзенштадта, окупувавши регіон. Вони стверджують, що це зроблено для захисту [HUN.GetAdjective] населення, яке нещодавно вийшло на вулиці з протестами проти, на їхню думку, незаконної окупації регіону після Тріанону. Чи призведе це до нової війни на Балканах, чи залишиться лише незначним переглядом кордонів?"
 wuw_HUN_promote_revanchist_sentiment_desc:0 "Тріанонський договір забрав у нас більше половини населення. Ми повинні виправити цю історичну несправедливість і піднести дух реваншизму в нашому народі."
 wuw_HUN_protect_austria:0 "Захистити [AUS.GetNameDef]"
 wuw_HUN_restore_the_duchy_of_teschen_desc:0 "Сілезькі землі тривалий час належали Чехії, а згодом були включені до нашої імперії. Після війни за австрійську спадщину їх вкрала Пруссія, і ми досі не забули цієї втрати. Ми повинні повернути ці землі собі!"
 wuw_HUN_the_arado_ar_96:0 "Arado Ar 96"
 wuw_HUN_the_hungarian_life_and_renewal_party:0 "Партії угорського життя і відродження"
 wuw_HUN_the_spirit_of_the_aster_revolution:0 "Дух Астрової революції"
 wuw_HUN_undercover_air_maneuvers:0 "Таємні повітряні навчання"
 ww_BEL_event_diplomatic.10.a:0 "Наша законна територія відновлена!"
 ww_BEL_event_diplomatic.29.a:0 "Для нас буде честю мати його поруч"
 ww_BEL_event_diplomatic.3.desc:0 "Ми отримали чудову новину! Люди з [FROM.GetNameDefCap] мудро вирішили, що ми сильніші разом, і вже ведуться підготовки до нової адміністрації цього території."
 ww_BEL_event_spanish_interaction.1.desc:0 "Ми отримали вантаж гвинтівок від уряду [FROM.GetAdjective]. Вони поділяють нашу точку зору, що націоналістів потрібно зупинити, і бажають допомогти нашій боротьбі, не лише словами."
 ww_BEL_event_spanish_interaction.7.t:0 "[FROM.GetNameDef] приєднується до [ROOT.GetFactionName]"
 ww_BEL_event_war.8.desc:0 "В національній катастрофі наша горда столиця Париж впала! Ще раз наші збройні сили виявилися нездатними протистояти явно слабшому ворогові. [FROM.GetAdjective]и запропонували відвести свої війська і заощадити решту країни, але натомість вимагають передати їм Кале. \n\nМи вже відчуваємо, як навколо нас кружляють хижі птахи, і це дасть нам час взяти уроки, які ми отримали, і підготуватися до більших потенційних ворогів у майбутньому."
 ww_congo.10.d:0 "Конґолезькі сили розташовані уздовж кордону нашої колонії в [772.GetName], і вони вимагають повного доступу до наших баз та установ! Якщо ми погодимося на їхній запит, ми фактично передаємо їм контроль над [772.GetName]. З іншого боку, у нас немає реальних засобів для боротьби з ними з цього питання."
 ww_congo.17.t:0 "Конґолезька незалежність досягнута"
 ww_congo.24.desc:0 "Колоніальна адміністрація в [FROM.GetNameDef] відмовила в нашому запиті на збільшення просування [FROM.GetAdjective] еміграції до нашої держави. Це дійсно прикро, але ми не можемо багато зробити, щоб змінити їхню думку."
 ww_congo.26.t:0 "[FROM.GetNameDefCap] займає [796.GetName]!"
 ww_congo.32.b:0 "Крістоф Гбене має очолити"
 ww_congo.34.t:0 "Державний візит Кваме Нкруми"
 ww_congo.36.desc:0 "Посли з [FROM.GetNameDef] відхилили нашу мирну пропозицію. Вони стверджують, що наша атака на них була абсолютно необґрунтованою, і тому вони приймуть тільки безумовну капітуляцію з нашого боку як відповідь на нашу загрозу миру в регіоні."
 ww_congo.39.desc:0 "Перші вільні вибори завершені, і Джозеф Каса-Вубу вийшов на перше місце. Тепер він активно працює над формуванням першого конґолезького кабінету міністрів. Каса-Вубу надзвичайно популярний по всій країні і відмінно справляється зі своєю роботою, він, без сумніву, буде пам'ятати як великий президент для багатьох поколінь."
 ww_congo.46.a:0 "Він може надати нам легітимне право на Середнє Конґо!"
 ww_congo.47.a:0 "Він надасть нам легітимне право на Бурунді, принаймні..."
 ww_congo.49.b:0 "Це не те, чого ми планували..."
 ww_congo.5.desc:0 "Наш губернатор у Конґо, [COG.GetLeader], висловив бажання збільшити виробництво їжі за рахунок зменшення видобутку корисних копалин як частини його зусиль 'покращити соціальні умови колоніального населення'. Це, звісно, знизить прибутковість колонії на даний момент, але, ймовірно, покращить її в довгостроковій перспективі."
 ww_congo.63.a:0 "Це бажана вигода"
 ww_congo.68.a:0 "Чудово!"
