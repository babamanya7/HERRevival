 DOD_hungary.103.a:0 "Ми пам'ятатимемо про їхні інтереси."
 DOD_hungary.106.b:0 "Мобілізувати армію."
 DOD_hungary.107.t:0 "Угорщина вимагає панування"
 DOD_hungary.127.desc:0 "[GER.GetLeader] підписав таємний Берлінський договір, за умовами якого німецька влада погоджується розділити державу [CZE.GetNameDef] на дві сфери інтересів. Він пообіцяв погодитися з будь-яким рішенням щодо Словаччини."
 DOD_hungary.40.a:0 "Негайно висунути ультиматум."
 DOD_hungary.40.t:0 "[HUN.GetNameDefCap] денонсує Тріанонський договір"
 DOD_hungary.42.t:0 "[From.GetName] прогинається"
 DOD_hungary.68.t:0 "Рішення арбітражу з Трансільванії"
 DOD_hungary.75.a:0 "Ми зробили все можливе."
 DOD_hungary.95.t:0 "[From.GetNameDefCap] відкидає нашу пропозицію"
 DOD_romania.1.b:0 "Нам це не цікаво."
 DOD_romania.114.a:0 "У нас немає вибору."
 DOD_romania.2.t:0 "[From.GetNameDefCap] погоджується укласти альянс"
 DOD_romania.42.desc:0 "Отримавши список наших вимог, [BUL.GetLeader], за чутками, розсміявся і порвав документ, заявивши, що румунська армія ніколи не здобуде верх над болгарською в чесному бою."
 DOD_romania.82.t:0 "Король заборонив книгу з критикою на його адресу"
 DOD_romania.83.a:0 "У короля є право бути представницьким."
 DOD_romania.85.desc:0 "Король Кароль II у супроводі коханки та більшості своєї почту прибув на відпочинок до Ніцци. Монарх оселився в королівському номері готелю «Negresco» та повідомив місцевим репортерам, що має намір насолоджуватися найкращими стравами місцевої кухні та гостинністю городян протягом кількох тижнів. Він також планує відвідати оперний театр Ніцци і здійснити низку коротких поїздок до Парижа за покупками.\n\nМісцева преса ставить незручні питання про час, обраний для візиту, і про те, кому доведеться за нього заплатити."
 DOD_romania.86.t:0 "Король замішаний у скандальній справі про розкрадання коштів"
 DOD_yugoslavia.3.b:0 "Ми врятуємо їх."
 DOD_yugoslavia.31.a:0 "Як мило з його боку."
 DOD_yugoslavia.42.a:0 "Надіслати спеціального представника."
 DOD_yugoslavia.702.desc:0 "[YUG.GetAdjectiveCap]ий урядсьогодні підписав Троїстий пакт із фашистськими країнами. Факт його підписання не просто означає, що [YUG.GetNameDef] вступає до альянсу [From.GetFactionName], — він вказує на посилення зв'язків між двома державами та на те, що [YUG.GetLeader], мабуть, користується симпатією фашистів. Багато хто чекає [Root.GetAdjective] на цей тривожний розвиток подій, але [Root.GetLeader] поки що ніяк не коментує те, що відбувається...."
