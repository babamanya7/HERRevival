 PER_military_high_schools_desc:0 "Добре навчена постійна армія починається з нашої молоді. Навчаючи наших молодих людей військової досконалості, ми налаштуємо себе на успіх у майбутньому. Це займе кілька років, але зрештою ми матимемо найбільшу армію в регіоні."
 PER_modern_cataphract:0 "Сучасний катафракт"
 PER_national_bank_desc:0 "Економічно ми не виділялися порівняно з нашими західними суперниками. На жаль, але ми можемо це змінити. Спочатку ми повинні зміцнити Національний банк [ROOT.GetNonIdeologyName] та зробити його більш доступним, зокрема для нашого сільського населення."
 PER_national_bank_iran:0 "Банк-е Меллі-є Іран"
 PER_oil_and_rubber_industry_desc:0 "Хоча наша нація має величезні нерозвідані запаси нафти, ми повинні уникати повної залежності нашої економіки від її транспортування в інші місця. Тому ми повинні диверсифікувати наші галузі промисловості для виробництва продукції, придатної для внутрішнього споживання."
 PER_persian_german_trade_idea_desc:0 "Організація, створена для сприяння позитивним торговельним відносинам між [PER.GetNameDef] і [GER.GetNameDef], а також для забезпечення подальшої модернізації нашої промисловості за моделлю однієї з найвизначніших промислових держав світу."
 PER_pilot_training_desc:0 "Пілоти потребують більше, ніж просто таланту, щоб керувати бойовим літаком. Ретельна програма підготовки для тих, хто готовий ризикувати своїм життям за [PER.GetNameDef], буде вирішальною для забезпечення їхньої безпеки та ефективності в небі."
 PER_rally_the_reformers_tt:0 "Відмикає рішення §Y$PER_mass_protests$§! для створення бази операцій для нашого опозиційного руху."
 PER_request_membership_allies:0 "Запросити членство у Союзниках"
