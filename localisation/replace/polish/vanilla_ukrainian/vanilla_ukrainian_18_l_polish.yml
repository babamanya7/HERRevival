 ARG_improved_cooperation_idea_desc:0 "[ARG.GetNameDefCap] та [ENG.GetNameDef] збігаються у своїх інтересах."
 ARG_infantry_equipment_3:0 "Halcón M-43"
 ARG_intervenciones_federales_decisions_tt:0 "Відмикає сукупність рішень §YIntervenciones federales§!, котрі дозволять нам протистояти §Yвійськовим осередкам§! із §YНеминучої спроби військового перевороту§!."
 ARG_juan_peron:0 "Хуан Перон"
 ARG_maintain_neutrality:0 "Відхилити Союзників"
 ARG_maintain_neutrality_desc:0 "Незважаючи на тиск з боку держав Союзників, нам не вигідно брати участь у їхній війні. У нас достатньо справ на нашому континенті, щоб не турбуватися про конфлікт у Європі. Якщо це ризикує ембарго з боку [USA.GetName], нехай буде так."
 ARG_military_coup_decisions:0 "Незгода в армії"
 ARG_neutrality_party_long:0 "Конкордансія"
 ARG_paraguayan_ultimatum_desc:0 "[PAR.GetNameDefCap] — це стратегічна територія, яка буде вирішальною для наших військових цілей проти решти континенту. Вони можуть або погодитися працювати під нашим керівництвом, або бути змушені військовим шляхом підкоритися нашому прапору. Вибір за ними. Надіслати ультиматум."
 ARG_peronism_desc:0 "Коли Перон прийшов до влади, виникло прагнення створити новий політичний рух, заснований на ідеях та впливах самого Президента. Перонізм, також відомий як хустисіалізм, став суперечливим серед опонентів Перона, деякі порівнюють його з фашизмом, тоді як інші описують його як нечітке поєднання націоналізму, лейборизму та популізму."
 ARG_political_events.111.a:0 "Нехай приходять!"
 ARG_political_events.20.a:0 "Excelente!"
 ARG_political_events.26.a:0 "Як прикро..."
