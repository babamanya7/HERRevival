 AFG_communist_propaganda_desc:0 "Усі засоби масової комунікації мають бути передані під владу держави та використані для піднесення народу до нашої славетної робітничої республіки."
 AFG_confederation_pak_ADJ:0 "Афгано-пакистанськ"
 AFG_confederation_pak_democratic_DEF:0 "Афгано-пакистанська конфедерація"
 AFG_core_central_asian_state:0 "Інтегрувати §Y[FROM.GetName]§!"
 AFG_curtail_anti_democratic_sentiments:0 "Придушення антидемократичних настроїв"
 AFG_development_in_taj:0 "Розвивати Таджикистан"
 AFG_education_for_women_and_girls_desc:0 "Король та його дружина розуміли важливість надання жінкам та дівчатам можливості здобувати освіту, замість того, щоб засуджувати їх до життя у домашньому рабстві. Після його повалення освітні реформи короля були скасовані. Тепер ми виправимо цю несправедливість."
 AFG_extend_a_hand_to_tokyo_tt:0 "Ми проявимо бажання приєднатися до альянсу держави §Y[JAP.GetNameDef]§!."
 AFG_foreign_military_advisors_desc:0 "Щоб підготувати нашу армію до сучасних стандартів, найшвидшим способом було б запросити радників із західних націй. Вони допоможуть підготувати наступне покоління [ROOT.GetAdjective] чоловіків, щоб вони були здатні воювати на полі бою, що постійно розвивається."
 AFG_gain_religious_support_for_reforms_desc:0 "Серед народу зростає занепокоєння, що молодий король Захір-шах використає свою новознайдену владу для запровадження радикальних реформ, які порушать їхній спосіб життя. Щоб розвіяти ці побоювання, ми заручимося підтримкою мулл та продемонструємо прихильність короля до Ісламу."
 AFG_industrial_events.58.b:0 "Ми виженемо їх з нашої землі."
 AFG_infrastructure_construction_desc:0 "Наш брак інфраструктури по всій нації стримує економічний розвиток, залишаючи людей задоволеними жити так, як їхні предки протягом століть. Такий світогляд не відповідає довгостроковим інтересам нації і має бути виправлений шляхом інвестування в інфраструктурні проєкти."
 AFG_integrate_the_basmachi_movement:0 "Інтегрувати рух Басмачів"
 AFG_mohammad_hashim_khan:0 "Мохаммад Хашім-хан"
 AFG_pdpa_communism_party_long:0 "People's Democratic Party of Afghanistan"
 AFG_political_events.122.desc:0 "[FROM.GetNameDefCap] відхилив наше прохання про допомогу. Вони стверджують, що наша революція передчасна і приречена на провал. Наш народ, ймовірно, матиме глибоке обурення до [FROM.GetNameDef] у найближчому майбутньому."
 AFG_political_events.151.desc:0 "[FROM.GetAdjective] уряд погодився на нашу пропозицію щодо оборони. Тепер ми можемо розпочати процес взаємної інтеграції наших військових комплексів. Це, сподіваємося, слугуватиме стримуючим фактором для будь-яких наших регіональних супротивників у найближчому майбутньому."
 AFG_political_events.155.desc:0 "У відповідь на наш запит уряд [FROM.GetName] погодився підтримати сходження $AFG_faqir_of_ipi$ на трон [ROOT.GetNonIdeologyName]. Ця підтримка включатиме військову допомогу та обладнання для забезпечення успіху нашого починання."
 AFG_political_events.158.t:0 "$AFG_faqir_of_ipi$ з [AFG.GetNonIdeologyName] просить допомоги"
 AFG_political_events.53.desc:0 "У відповідь на наш запит уряд [FROM.GetName] погодився підтримати відновлення $AFG_amunullah_khan$ на троні [ROOT.GetNonIdeologyName]. Ця підтримка включатиме військову допомогу та обладнання для забезпечення успіху нашого починання."
 AFG_political_events.70.b:0 "Ми не можемо дозволити собі війну, але нам потрібна згода від [ROOT.OVERLORD.capital.GetCapitalVictoryPointName]."
 AFG_political_events.73.a:0 "Прагматичне рішення."
 AFG_rail_construction_desc:0 "Для перевезення великої кількості ресурсів або людей ніщо не є таким ефективним, як залізниця. Тому ми повинні створити залізничну компанію для розробки та експлуатації власної залізничної мережі."
 AFG_railway_company_idea:0 "Афганська залізнична компанія"
 AFG_red_threat:0 "Червона загроза"
 AFG_reform_2_desc:0 "За допомогою наших іноземних партнерів ми маємо технологічні та фінансові засоби для будівництва масивної нової гідроелектростанції на річці Чак, щоб забезпечити електроенергією столицю та навколишні райони. Хоча це, безсумнівно, засмутить супротивників наших благодійників."
 AFG_republic_of_afghanistan_desc:0 "Прийняття демократії у формі конституційної монархії було величезним кроком. Однак залишається занепокоєння, що наші демократичні свободи ніколи не будуть повністю забезпечені, доки ми не усунемо останні пережитки монархії, оголосивши республіку та обравши демократичного главу держави."
 AFG_restore_the_timurid_empire_desc:0 "Прапори Тимура знову майорять, і імперія, яка колись вселяла страх у серця султанів та королів, повстала з попелу історії. Наше правління простягається через землі, які колись формувалися його завоюваннями, пов'язуючи Схід та Захід під єдиним пануванням. Нехай світ зверне увагу — Тимуриди повернулися, і цього разу ми не зникнемо в минулому."
 AFG_return_of_the_emir:0 "Повернення короля"
