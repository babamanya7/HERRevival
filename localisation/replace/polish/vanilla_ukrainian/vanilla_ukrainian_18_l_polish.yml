 LOADING_TIP_119:0 "«Це клятий “Шеер”! Вогонь по ньому!»\n(Фредерік Секер Белл)"
 LOADING_TIP_140:0 "«Світ буде знищений не тими, хто чинить зло, а тими, хто спостерігає за ними й нічого не робить».\n(Альберт Айнштайн)"
 LOADING_TIP_162:0 "«Якби мені треба було взяти пекло, я б доручив австралійцям узяти його, а новозеландцям — його втримувати».\n(Ервін Роммель)"
 LOADING_TIP_79:0 "«Британським ВМС цікаво дізнатися, чи досягли італійці рівня, на якому були в попередній війні, чи може геть випали».\n(Вінстон Черчилл після оголошення війни Італією)"
 LOADING_TIP_85:0 "«Я радше помру в болоті Великої Румунії, ніж у раю малої Румунії».\n(Іон Антонеску)"
