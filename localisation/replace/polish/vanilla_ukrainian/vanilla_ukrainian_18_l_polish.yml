 SIA_propaganda_poster_slot_available_tt:0 "Має вільний слот для постера до фільму."
 SIA_rice_husk_steam_turbines_desc:0 "Те, що іноземець вважає відходами, необхідність вчить нас цінувати. Спалюючи рисове лушпиння для виробництва пари, ми можемо отримувати енергію з наших власних врожаїв і зменшити нашу залежність від імпортного вугілля та нафти."
