 NORDIC_economic_cooperation_ns_desc:0 "У такі часи ми не можемо дозволити собі ворожнечу та відчуження щодо наших сусідів. Саме тому ми інвестуємо в них, аби підйом припав на всіх. І водночас отримуємо пристойний прибуток."
 NORDIC_first_joint_institution_desc:0 "Оскільки ми робимо наші перші кроки до справжньої інтеграції та співпраці, [NORDIC_get_alliance_name] потребує нової установи, [NORDIC_get_institution_1_desc]"
 NORDIC_joint_military_exercises:0 "Спільні військові навчання"
 NORDIC_large_scale_production_desc:0 "Плейсголдер"
 NORDIC_mountaineers_desc:0 "Скандинавський регіон ідеально підходить для тренування та використання альпіністів. Маючи сильний штат гірських спеціалістів, ми зможемо набагато легше захищати регіон і дати змогу контратакувати, коли у нас буде така можливість. Навіть якщо частина нашої території потрапить до рук ворога, ми ніколи не здамося."
