 AIR_VIEW_AIRPLANES_IN_COMBAT_FIGHTERS:0 "Кількість літаків, які брали участь у боях за останній період.\nНа кількість активних літаків у регіоні, які беруть участь у бою, впливає §Hпомітність літаків§!."
