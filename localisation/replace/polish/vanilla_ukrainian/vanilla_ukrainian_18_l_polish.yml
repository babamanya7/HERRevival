 SWE_per_albin_bus_desc:0 "З такою великою вогневою потужністю в розпорядженні наших супротивників цілком можливо, що уряд може бути обезголовлений повітряним нальотом або вторгненням. Щоб запобігти такому сценарію, нам потрібен мобільний урядовий штаб, який зможе підтримувати зв'язок зі збройними силами і громадськість під час кризи."
