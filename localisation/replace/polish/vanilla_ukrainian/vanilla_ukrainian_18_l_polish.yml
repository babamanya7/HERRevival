 BUL_improve_the_road_system_desc:0 "Болгарські дороги, м'яко кажучи, абсолютно недорозвинені, що ускладнює та вповільнює сполучення. Розвиток сучасної інфраструктури, здатної поліпшувати та розширювати нашу поточну дорожню систему, прокладе шлях до вирішення наших транспортних проблем."
 BUL_industrial_autarky:0 "Промислова автаркія"
 BUL_kiril_stanchev_bftb:0 "Кіріл Станчев"
 BUL_modernize_the_industry_desc:0 "Якщо ми хочемо утвердитися як провідна промислова держава на Балканах, ми мусимо прагнути до модернізації нашої промисловості! Збільшені бюджетні асигнування та вдосконалені інструменти втілять наші мрії."
