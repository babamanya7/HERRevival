 GOE_RAJ.12.desc:0 "Жоден [FROM.GetAdjective] солдат не готовий нам допомогти. Обіцяної допомоги ніде немає, і Токіо мовчить. Ми можемо лише припустити, що ми залишилися самі."
 GOE_RAJ.17.a:0 "Запропонувати [TIB.GetName] гарантії"
 GOE_RAJ.28.desc:0 "[FROM.GetName] відхилив нашу спробу вийти з конфлікту. Чи буде це нашим падінням, чи їхнім?"
 GOE_RAJ.32.desc:0 "Як планувалося [ENG.GetAdjective] урядом, ми маємо передати Провінцію Аден їм, але ми, ймовірно, можемо наполягати на тому, щоб залишити її, якщо цього забажаємо."
 GOE_RAJ.44.t:0 "Прикордонна сутичка в [433.GetName]"
