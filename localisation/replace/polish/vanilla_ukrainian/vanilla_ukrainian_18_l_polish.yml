 ITA_capital_ships:0 "Розвиток основних кораблів"
 ITA_consolidate_power_desc:0 "Наш контроль над партією та країною в цілому залишається слабким. Ми мусимо консолідувати владу, яку маємо, та зміцнити наш режим, показавши громадськості, що ми сильні та надійні, як ніколи раніше!"
 ITA_convene_the_grand_council_desc:0 "Ми мусимо скликати Велику фашистську раду для обговорення, що робити з Муссоліні. Його останній набіг на Ефіопію та небажання ділитися владою чи відповідальністю змусили багатьох поставити під сумнів його здібності як лідера. Він добре послужив своїй країні і є обличчям фашизму, але, мабуть, настав час для нового керівництва..."
 ITA_crush_opposition_bop_tt:0 "§Y$ITA_grand_council$§! більше не зможе усунути поточного лідера або почати громадянську війну в державі §Y[ROOT.GetFlag][ROOT.GetNameDef]§! крізь §Yбаланс сил§!."
 ITA_defend_the_land_invite_tt:0 "§YКожна незалежна комуністична країна не в альянсі§! буде запрошена в §Y$ITA_united_socialist_front$§!."
 ITA_empower_the_unions:0 "Уповноважити профспілки"
 ITA_empowered_carabinieri:0 "Уповноважені карабіньєри"
 ITA_expand_regional_control:0 "Розширити регіональний контроль над: [FROM.GetName]"
 ITA_expanded_corporatism_desc:0 "Корпоративізм — це фундаментальна ідея фашизму, і ми мусимо впроваджувати його на всіх наших новопридбаних територіях, наскільки це можливо. Однак для цього нам доведеться покладатися на місцеві еліти й таланти та відчиняти двері для просування у фашистській ієрархії. Це простий спосіб прищепити лояльність і ефективність у нашому новому домініоні."
 ITA_expanded_lateran_treaty_flag:0 "Латеранський договір був розширений"
 ITA_fanti_dell_aria_spawn_divs_tt:0 "Створити §Y3 повітряні десантні§! дивізії в області §Y[THIS.GetName]§!."
