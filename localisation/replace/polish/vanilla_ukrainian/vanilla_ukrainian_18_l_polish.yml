 YUG_towards_independence_desc:0 "Тепер, коли ми розділили цей союз на кілька автономних держав, настав час перейти до наступного кроку: незалежність. Більше ми не можемо правити як диктатори над нашим народом. Ми мусимо довірити їм самоврядування, вільне від сербського втручання."
 YUG_traditional_values_desc:0 "Традиційні цінності, яких навчає православна релігія, є наріжним каменем нашого суспільства. Просування цього не лише здобуде нам підтримку Православної Церкви, але й згуртує наших людей."
 YUG_uprising_strength_tt:0 "З їхньою поточною підтримкою, сила §Yкомуністів§! буде [YUG_communist_coup_target.Get_Yugo_Uprising_strength].\nВона завлежить від їхньої поточної підтримки §Yкомуністів§! кількості разів, коли селяни були озброєні."
