 BRA_vassouras_line_desc:0 "Наші спроби створити рух для руйнування політичного статус-кво призвели до закликів до відродження нашої імперської історії через повернення імператорської королівської родини. Багато хто зараз гуртується навколо голови вигнаного Імператорського дому Бразилії, Педру Енрікі, як законного правителя нації."
