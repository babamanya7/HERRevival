 GOE_RAJ_eic.5.desc:0 "[FROM.GetName] погодився на торгівлю великою кількістю опіуму між нашими країнами. З новим договірним портом ми можемо безпосередньо розповсюджувати товари по всьому світу. Нехай це споживання зблизить друзів і ворогів."
