 ARG_BLITZKRIEG_DESC:0 "Завдяки найбільш сфальсифікованим виборам в історії Аргентини, Конкордансія продовжує утримувати більшість в уряді, а Роберто Марія Ортіс зараз керує країною як її президент.\n\nОднак на тлі зростання напруженості між двома найближчими друзями Аргентини в Європі країна мусить готуватися до неминучості бути розірваною між двома фракціями. Мало того, серед військових зростає невдоволення, і постійно нагнітається параноя щодо їхнього вічно дрімаючого суперника на півночі. Аргентина стоїть на великому роздоріжжі і мусить добре подумати, як реагувати."
 ARG_FJC_empowered_idea_desc:0 "Federación Juvenil Comunista de la Argentina є однією з найвпливовіших молодіжних політичних організацій в історії країни. Це молодіжна організація, що діє в рамках КПА і була заснована в 1921 році з метою просування політики партії серед аргентинської молоді. Тепер, коли уряд перебуває під повним контролем КПА, ця організація може продовжувати рости і розвивати молодь Аргентини, перетворюючи її на повноцінних революціонерів!"
 ARG_alvears_democracy_desc:0 "Багато хто вважає [ARG.GetLeader] суворою людиною зі суворою політикою, але з часом стало зрозуміло, що він справді дбав про найкращі інтереси [ARG.GetNameDef]. Він справді зміг продовжити спадщину Іполіто Ірігоєна і повинен розглядатися як Батько аргентинської демократії."
 ARG_argentina_first_idea:0 "$ARG_argentina_first$"
 ARG_balancing_act:0 "Балансування"
 ARG_chilean_ultimatum_desc:0 "Надто довго у нас були прикордонні напруження з [CHL.GetNameDef], і якщо ми справді хочемо закріпити за собою домінуючу силу тут, у Південній Америці, нам потрібно нейтралізувати їх якомога швидше. Вони можуть або приєднатися до нас мирним шляхом, або ми рушимо на їхні землі та заберемо те, що є нашим."
 ARG_conquer_paraguay:0 "Завоювати [PAR.GetNameDef]"
 ARG_consolidating_power:0 "Консолідація влади"
 ARG_crack_down_on_corruption_desc:0 "Незважаючи на обрання на одних із найшахрайніших виборів в [ARG.GetAdjective] історії, Ортіс повністю має намір приборкати рівень корупції в уряді. Якщо відкинути іронію, це може лише допомогти зробити [ARG.GetName] сильнішою."
 ARG_democratic_party:0 "ЦРС"
 ARG_disrupt_bolivar_no_lar:0 "Операцію «Болівар» зірвано"
 ARG_fabricaciones_militares_organization:0 "Fabricaciones Militares"
