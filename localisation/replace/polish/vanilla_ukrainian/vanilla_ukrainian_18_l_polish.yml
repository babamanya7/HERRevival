 INSHOL_east_indies_navy_desc:0 "[INS.GetNameDefCap] не має офіційного флоту, залишаючи Нідерланди відповідальними за захист колонії. З огляду на зростаючу напруженість у Європі та Азії, так більше тривати не може. Ми повинні зробити перший крок до створення спеціального [INS.GetAdjective] флоту."
