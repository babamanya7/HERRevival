 INS_revolution_events.40.t:0 "Голландці приймають наші умови"
 INS_revolution_events.9.desc:0 "Сьогодні на Яві виступив [INS.GetLeader], проголосивши незалежність новоствореної Республіки Індонезія. Хоча ми не визнаємо цю нову республіку, їхні ополченці окупували територію, і наша поліція не в змозі контролювати ці райони. Якщо ми не поставимося до цієї ситуації серйозно, вона може перетворитися на тотальну війну."
 INS_revolution_penalty_reduce_tt:0 "§YМи не отримаємо штрафів, якщо це рішення буде прийнято на 7 рівні ескалації§!."
 INS_royal_netherlands_east_indies_army_desc:0 "Королівська нідерландська ост-індійська армія (KNIL) — це давня армія Ост-Індії, що діє незалежно від Нідерландів. KNIL складається як з європейських, так і з індонезійських солдатів, хоча культурні та мовні бар'єри між численними культурами архіпелагу та Нідерландами роблять рекрутування складним і тривалим процесом."
