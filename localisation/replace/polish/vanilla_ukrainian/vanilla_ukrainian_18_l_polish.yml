 aircraft_production_focus_desc:0 "Виробництво літаків залишається нашим найвищим пріоритетом. Необхідно створити Лондонську авіавиробничу групу (London Aircraft Production Group) для управління та координації всього наявного виробництва, пов'язаного з літакобудуванням."
