 ETH_organize_regional_revolts_desc:0 "[ITA.GetAdjective]і війська ще не міцно взяли нашу батьківщину. Опір окупації невпинно виснажує їхнє обладнання, робочу силу і, що найважливіше, їхній ентузіазм продовжувати цю криваву колоніальну спробу. Ми повинні продовжувати допомагати опору та почали координувати зусилля, щоби повалити [ITA.GetAdjective]і окупаційні сили."
