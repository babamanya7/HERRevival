 BUL_stoycho_mushanov_desc:0 "Стойчо Стефанов Мушанов"
 BUL_support_the_spanish_coup_desc:0 "Першим театром війни проти більшовизму є Іспанія. Якщо ми офіційно підтримаємо військове повстання і організуємо групу добровольців для підтримки повстанців, громадянська війна в Іспанії може стати ідеальним полігоном для наших військ."
 BUL_tobacco_exports_desc:0 "Ми активно замінюємо виробництво зерна більш цінними тютюновими культурами, які приносять нам значні доходи."
