 JAP_armored_car_equipment_2:0 "Type 93 Kokusan"
 JAP_army_arsenals_emptied_idea:0 "Армійські арсенали спорожніли"
 JAP_assault_tauran_decision_desc:0 "Через нещодавню провокацію з боку [MON.GetAdjective]их військ та окупацію ними села Тауран біля озера Буїр, ми повинні підготувати наші війська, щоб витіснити їх, перш ніж їхні претензії на нашу законну територію будуть легітимізовані."
 JAP_best_the_graveyard_desc:0 "Наш Божественний Імператор стоїть вище за всіх інших, і ті, хто цього не розуміє, мають бути знищені. Ми повинні вдертися в [AFG.GetNameDef] і забрати їхній трон собі."
