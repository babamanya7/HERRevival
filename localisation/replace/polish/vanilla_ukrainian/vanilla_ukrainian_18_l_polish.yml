 MUN_slovakia.news.1.desc:0 "Незважаючи на повернення регіону [664.Getname] після «$GER_first_vienna_award$», [HUN.getnamedef] все ще прагне зробити додаткові коригування свого кордону зі [SLO.GetAdjective]им урядом у регіоні [71.Getname].\n\nЦей конфлікт виглядає як привід для [HUN.GetAdjective]ої влади перевірити, наскільки сильна її армія проти значно слабшого суперника. Молода [SLO.GetAdjective]а армія, можливо, не готова відповісти на виклик, який постав перед нею."
