 BUL_develop_balkan_federation_project_desc:0 "Необхідно зібрати експертів у різних галузях, наприклад в економіці, індустрії, політиці та соціології, і розібратися в причинах провалу проєкту Балканської федерації в 1920-х рр. Після цього треба розробити новий, поліпшений і інклюзивний проєкт, всім балканським державам буде однаково шанобливим."
 BUL_fate_of_the_balkans_influence_government_tt:0 "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! з більшою ймовірністю підкориться Болгарії в майбутньому."
