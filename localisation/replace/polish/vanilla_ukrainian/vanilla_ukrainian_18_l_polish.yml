 lar_concessions_italy_tt:0 "Італія з великою ймовірністю погодиться спільтно діяти проти Німеччини."
 lar_concessions_to_italy.1.a:0 "Ми придушимо цю так звану Вісь у зародку!"
 lar_concessions_to_italy.7.a:0 "Це ставить нас у скрутне становище."
 lar_congress_of_paris.6.desc:0 "Хоча через недостатку жорсткої політичної сили нашим дипломатам у Парижі не вдається помітно вплинути на ситуацію, нам проте запропонували підтримку при захопленні територій між Анґолою та Мозамбіком, а також можливість заявити права на велику частину Південної Африки. Здається, що передання нам цих територій дозволить двом великим державам уникнути конфлікту, який може поставити під загрозу всю угоду.\n\nПроте, прийнявши цю пропозицію, ми мусимо битись на стороні Франції й Італії, допомагаючи розширити їм свої імперії."
 lar_end_the_occupation.1.a:0 "Ми вітаємо їх з розкритими обіймами!"
 lar_fra_join_the_ententes.3.t:0 "[From.GetNameDefCap] відкидає нашу пропозицію"
 lar_france_volunteers.1.t:0 "Добровольці з держави [From.GetNameDef]"
 lar_franco_soviet_treaty.2.t:0 "[From.GetNameDefCap] погоджується"
 lar_low_stability_civil_war.2.desc:0 "Очевидно, що група реакційних військових офіцерів і багатих землевласників підготувала військовий переворот проти уряду. Особи деяких з них відомі поліції, інші ж поки не впізнані. Скориставшись витоком у розслідуванні, змовники вирішили не зважати на це. розкрили.\n\nПереворот проводився наспіх і без належної підготовки, тому повсталим не вдалося напасти несподівано. Не всі їхні війська встигли зайняти позиції, а місцеві гарнізони були попереджені. Загони лоялістів діяли швидко і успішно запобігли нищівній атакі на наш уряд, але цього їм довелося поступитися помітною частиною території. Переворот триває, і країна, судячи з усього, поринула у повномасштабну громадянську війну."
 lar_news.10.d:0 "Все стає дуже складно..."
 lar_news.24.desc:0 "[POR.GetAdjective] і [?global.POR_iberian_summit_spanish_tag.GetAdjective] політики спільно звертаються до [GER.GetAdjective] уряду з проханням про прийняття їх до альянсу [GER.GetFactionName] — опортуністичний прийом для отримання нових територій або просто відчайдушна спроба уникнути окупації.\n\nЯк би там не було, оцінивши ситуацію, держава [GER.GetNameDefCap] вирішила, що це піде на користь його інтересам, і нарешті пустило в альянс іберійські нації."
 lar_news.29.d:0 "Рано чи пізно нам треба буде розправитися з урядом..."
 lar_news.6.desc:0 "Президент [FRA.GetLeader] оголосив про серйозні зміни у французькій зовнішній політиці, які включають ретельний розбір стратегічних союзів і політичних гарантій, зроблених попередніми адміністраціями.\n\nЗокрема, буде «уважно вивчена» мережа союзів, що пов'язують Францію з країнами Східної Європи,— багато спостерігачів вважають, що це означає її майбутню ліквідацію.\n\nПерші особи держав [POL.GetNameDef], [CZE.GetNameDef] і [ROM.GetNameDef] поки що відмовляються від коментарів щодо цього інциденту та можливих реакцій на нього."
 lar_news.9.a:0 "Радикали захопили владу."
 lar_non_intervention.2.t:0 "[From.GetNameDefCap] приєднується до Комітету з невтручання"
 lar_operative_event.4.t:0 "Агента поранено"
 lar_portugal_iberian_summit.1.c:0 "Що за дурна ідея!"
 lar_portugal_iberian_summit.6.a:0 "Надіслати запит негайно."
 lar_portugal_iberian_summit.9.a:0 "Що за нерозумні у нас сусіди!"
 lar_portugal_promote_monarchist_cause.3.desc_anti_monarchist:0 "За підтримки португальського уряду бразильські монархісти повстають зі зброєю в руках по всій країні. Якщо цим зрадникам вдасться відновити монархію, наша улюблена країна з великою ймовірністю, але, на щастя, бунтівникам не вдалося взяти Ріо-де-Жанейро. У нас є можливість зібрати війська та вирушити маршем зі столиці, щоби забрати наші землі у тих, хто діє на шкоду державі."
 lar_portugal_spanish_civil_war.1.desc:0 "Сьогодні держава [POR.GetNameDef] проголосила свою підтримку Іспанської Республіки і оголосила, що уряд розглядає можливість вживання суворих заходів під час іспанської громадянської війни. Виступаючи з промовою, [POR.GetLeader] засудив загрозу, оголосивши, що борг держави [POR.GetNameDef] — допомогти іспанським товаришам у боротьбі з націоналістами."
 lar_spain.21.a:0 "Тоді ми силою покажемо їм зиск співпраці з нами."
 lar_spain.51.c:0 "Ми надішлемо золотий запас до держави [SPR_relocated_gold_reserves_selection_2.GetNameDefCap]."
 lar_spain.51.d:0 "Ми надішлемо золотий запас до держави [SPR_relocated_gold_reserves_selection_3.GetNameDefCap]."
 lar_spain.55.desc:0 "Після захоплення нашого золотого запасу у нас недостатньо коштів, щоби фінансувати відродження нації. На жаль, інвестиції в державний сектор доведеться відкласти."
 lar_spain.82.a:0 "Ми подивимося, скільки протримається цей стан справ."
 lar_spain.82.desc:0 "Ми перемогли у громадянській війні, але через те, що ми надмірно покладалися на допомогу радянців, накопичився неабиякий борг, який треба повернути. Також хаос громадянської війни призвів до того, що сталіністи проникли на ключові позиції в нашій армії та уряді. Тепер ми опинилися в непростому становищі.\n\nМосква вже почала «пропонувати» нам кандидатури лояльних їй міністрів та офіцерів, і поки що ми не можемо чинити опір її вимогам, не зазнавши великих економічних втрат або, гірше того, Якщо ми хочемо отримати справжню незалежність, ми мусимо розігрувати свої карти обережно і або довести свою лояльність, або спочатку підірвати вплив сталіністів на нашу державу."
