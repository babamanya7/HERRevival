 TUR_bomber_schematics_desc:0 "Мало захищати своє небо у воєнний час — ми мусимо мати можливість вдарити ворога в саме серце, щоб швидко і рішуче завершувати будь-яку війну. Союзники чудово вміють рівняти із землею цілі міста за допомогою бомб, і нам є чому у них повчитися."
