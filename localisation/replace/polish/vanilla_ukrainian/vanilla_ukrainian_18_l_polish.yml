 BUL_opression_ban_nsm_media_desc:0 "Ми заборонимо розповсюджувати будь-яку пресу, яка належить фракції [GetNsmName] або публічно її підтримує."
 BUL_opression_discredit_nsm_leaders_desc:0 "Фракція [GetNsmName] поширює серед населення небезпечні ідеї та розгромну критику нашого уряду, що для нас абсолютно неприйнятно. Ми мусимо публічно дискредитувати лідерів фракції, нашкодивши тим самим його популярності та публічному образу."
 BUL_opression_dispose_of_zveno_generals:0 "Позбутися генералів $BUL_zveno_name_gen$"
 BUL_opression_imprison_zveno_leaders_desc:0 "Ми заарештуємо лідерів $BUL_zveno_name_gen$, тим самим відрубавши змії голову і завдавши організації потужного удару."
 BUL_opression_raid_nsm_supporters_desc:0 "Після захоплення лідерів $BUL_nsm_name_gen$ помітно ослаблений. Настав час влаштувати облаву на решту його учасників, які, як і раніше, тримають організацію на плаву і активно задумують щось проти нас."
