 PRC_no_army_recovery:0 "Все ще виснажена і ослаблена Великим походом, [ROOT.GetAdjective]а Червона армія все ще намагається стати на ноги в боротьбі проти ворогів, що здаються сильнішими."
 PRC_ordenance_bureau_organization:0 "Управління озброєнь"
 PRC_overthrow_the_ussr_desc:0 "В ідеологічних розбіжностях між нами та іншими комуністичними державами винне не лише наше пристосування до ситуації в Китаї. Реакційна і тоталітарна політика цих держав зайшла занадто далеко, і ми повинні втрутитися, щоб звільнити їхній пролетаріат від спотвореної форми революції."
 PRC_playing_both_sides:0 "Гра на два боки"
