 FIN_finnish_supremacy_in_the_north_desc:0 "У той час як інші нації нашого регіону сваряться та домовляються про своє підкорення в руках більших держав, ми самі можемо запропонувати альтернативу. Під нашим керівництвом ми можемо привести наші народи до перемоги проти будь-якого ворога, який може загрожувати нам."
