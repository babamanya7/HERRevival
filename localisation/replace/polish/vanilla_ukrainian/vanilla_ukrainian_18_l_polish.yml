 decision_cost_cp_25_ie_2000_blocked:0 "£command_power£ §Y25§! £infantry_equipment_text_icon£ §R2000§!"
 decision_cost_faction_influence_10_PP_75_tooltip:0 "Прийняття цього рішення коштує £GFX_influence_texticon£ §Y10%§! §Yвпливу в альянсі§! та £pol_power£ §Y75§!"
 decision_cost_ie_2000:0 "£infantry_equipment_text_icon£ §Y2000§!"
 decision_cost_pp_15_NavXP_15_tooltip:0 "Прийняття цього рішення коштує £pol_power£ §Y15§! £navy_experience£ §Y15§!"
 defensive_postures_field_construction_training:0 "Навчання піхотних інженерів"
 demobilization_manpower:0 "Послабити призов"
 denmark_expansion_event.200.t:0 "[FROM.GetNameDefCap] вимагає наші [ICE.GetAdjective]і володіння"
 denmark_expansion_event.222.desc:0 "На жаль для нього, [FROM.GetAdjective]ий уряд відкинув наші претензії. Схоже, нам залишається лише піти на цю країну війною, щоб забрати собі те, що належить [DEN.GetAdjective]ій державі по праву."
 denmark_expansion_event.400.b:0 "Давайте утворимо власний альянс і запросимо до нього інші країни."
 denmark_expansion_event.500.b:0 "У нас зараз немає потреби в альянсі."
 denmark_overlord_events.15.b:0 "Вони у нас потанцюють"
 denmark_overlord_events.15.desc:0 "Схоже, данський уряд відмовився прислухатися до нашого прохання про те, щоб [FROM.GetLeader] склав із себе повноваження прем'єр-міністра в ім'я зміцнення співпраці між нашими країнами. Ось таке нахабство і отруїло наші відносини з данським народом! Потрібно щось зробити, щоб врятувати співпрацю між нашими урядами."
 denmark_overlord_events.21.c:0 "Комунізм без революції"
 denmark_overlord_events.31.desc:0 "Не дивлячись на всі наші прохання і вмовляння, данський уряд відмовився проявити розсудливість і заборонити фашизм. Ми б'ємося з цією шкідливою ідеологією не на життя, а на смерть, а вона тим часом уже встигла проникнути в серця данців. У цій битві може бути тільки один переможець, і ми повинні взяти гору в ім'я благоденства [ROOT.GetAdjective]ого народу!"
