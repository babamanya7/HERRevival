 reign_of_terror_desc:0 "Режим, що нещодавно встановився, нещадний до своїх ворогів і намагається задушити будь-яку опозицію в зародку."
 revolutionary_council:0 "Революційна рада"
 rocket_artillery2:0 "Модернізація ракетної артилерії I"
 rocket_artillery4:0 "Ракетна артилерія III"
 rocket_engines_desc:0 "Обсяг наших знань про ракетну тягу досяг такої міри, що ми можемо створювати летючі бомби і літаки з ракетними двигунами, що розвивають насамперед немислиму швидкість."
 romania.6.b:0 "Радянський Союз дає найкращий шанс."
