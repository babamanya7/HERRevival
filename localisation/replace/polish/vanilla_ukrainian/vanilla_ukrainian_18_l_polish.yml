 PHI_every_state_with_new_railway_connection:0 "Кожен власний регіон, який має нове залізничне сполучення з іншим регіоном:"
 PHI_exile_support_desc:0 "Велика кількість філіппінців проживає в інших країнах, і ми можемо закликати їх надати фінансову та матеріальну підтримку. Потім це можна буде контрабандою передати нашим відважним борцям опору або використати для формування філіппінських бойових підрозділів, які будуть задіяні в нашому остаточному звільненні."
