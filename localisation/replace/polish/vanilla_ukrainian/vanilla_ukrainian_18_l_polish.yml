 landmark_taj_mahal_desc:0 "Тадж-Магал є шедевром архітектури Імперії Великих Моголів. Його величні білі мармурові куполи та вишукані сади роблять його одним із найвідоміших символів Індії, свідченням імперської могутності та вічної спадщини."
