 90_days_tt:0 "На впровадження піде 90 днів.\n"
 AAT_Sweden.16.desc:0 "Після відмови передати землі довкола Нарвіка [SWE.GetAdjective]ий уряд недвозначно пригрозив початком військових дій між нашими країнами, якщо ми відмовимося передати північні [NOR.GetAdjective]і території."
 AAT_Sweden.26.a:0 "Ми мусимо домовитися про мир."
 AAT_Sweden.30.t:0 "[FROM.GetNameDefCap] передає колонії"
 AAT_Sweden.40.a:0 "Ми не можемо боротися з державою [FROM.GetName]."
 AAT_Sweden.51.desc:0 "Держава [FROM.GetName] не витримала та передала нам Нарвік. Це гарантує нам залізну руду з Єлліваре та Кіруни, водночас послаблюючи державу [FROM.GetName]."
 AAT_Sweden.53.b:0 "Ми не маємо сил опиратися."
 AAT_Sweden_BoP.10.d:0 "Розширення армії знизить рівень безробіття та сприятиме інтересам національної безпеки."
 AAT_Sweden_communism.2.t:0 "Інакодумство в армії"
 AAT_Sweden_communism.4.a:0 "Ми повернемось."
 AAT_Sweden_flashpoints.10.t:0 "[SOV.GetAdjectiveCap]ий повітряний рейд на північ держави [SWE.GetName]"
 AAT_Sweden_flashpoints.13.desc:0 "Представники держави [SOV.GetNameDef] вибачилися за нещодавню атаку в Паялі, наполягаючи на тому, що це була щира помилка з боку їхніх пілотів. Вони також погодилися компенсувати нам завдані збитки. Схоже, [SOV.GetAdjective]е представництво намагається встановити більш кооперативний тон у відносинах, сподіваючись уникнути подальшої ескалації між нами."
 AAT_Sweden_flashpoints.33.desc:0 "Ми отримали різку телеграму з міста [GER.Capital.GetCapitalVictoryPointName], в якій повідомляється, що [GER.GetLeader] стурбований нашою відмовою на їхній нещодавній запит. Очевидно, [GER.GetAdjective]ий лідер починає сумніватися у нашому нейтралітеті і вважає, що наші останні дії свідчать про перехід на бік ворогів [GER.GetName].\n\nЗдається, що вони можуть бути готові ескалувати ситуацію до конфлікту, якщо це буде необхідно. Тому, можливо, настав час переглянути нашу поточну позицію."
 AAT_Sweden_flashpoints.75.b:0 "Це не варте початку війни."
 AAT_Sweden_flashpoints.81.t:0 "[FIN.GetName] погоджується, але є нюанс"
 AAT_Sweden_nationalists.12.a:0 "Сподіваємося, вони нам не заважатимуть"
 AAT_Sweden_nationalists.14.a:0 "Завжди варто тримати військових на своєму боці."
 AAT_Sweden_nationalists.20.a:0 "Гарна ідея"
 AAT_Sweden_nationalists.7.t:0 "Успішний марш штурмовиків у регіоні [FROM.FROM.GetName]"
 AAT_finland_continuation_war.10.a:0 "Ми повинні підкоритися, інакше не минути ще однієї війни"
 AAT_finland_diplomacy.14.t:0 "[FROM.GetAdjective]ий уряд вимагає інтеграції регіону [ROOT.GetName]"
 AAT_finland_diplomacy.27.t:0 "[FROM.GetNameDefCap] захистить нас"
 AAT_finland_kinship_war.01.desc:0 "У розпал антирадянських настроїв у Карелії наші вірні громадяни починають побоюватися, що на нас чекають нові братерські війни і повстання у Східній Карелії. Якою б не була мета бунтівників, чи то незалежна Карелія, чи то об'єднання фінських народів, чи то питання племінної ідентичності, чи то навіть фінські імперіалістичні мрії, очевидно, що за цим стоять фінські агітатори."
 AAT_finland_misc_events.03.desc:0 "Наші інвестиції в гірничодобувну інфраструктуру продовжують окуповуватися зростанням видобутку, але дуже складно позбутися думки, що ми могли б видобувати ще більше, якби залучили ресурси та фахівців із більших країн.\n\nНам варто звернутися до держави [?FIN_faction_leader_recieving_resource_rights.GetNameDef] та запропонувати частину добутих ресурсів в обмін на інвестиції та фахівців, які допоможуть вивести видобуток корисних копалин на новий рівень. Ця пропозиція вигідна обом сторонам."
 AAT_nordic_cooperation.2.b:0 "Ми можемо впоратися з цим і без них."
 AAT_norway.14.t:0 "Корисний колаборант"
 AAT_norway.15.b:0 "Ми будемо боротися!"
 AAT_norway.17.desc_denmark:0 "Придворний норвезького короля Гокона VII, або, як ми його колись знали, принца Карла Данського, звернувся до нас із серйозною вимогою. На їхню думку, а також на підставі колекції старих документів сумнівного походження, Данія по праву є частиною Королівства Норвеґії, а не Данії. Вони також натякнули, що в разі нашої відмови заберуть її силою, стверджуючи, що це для нашої ж власної безпеки."
 AAT_norway.5.t:0 "[NOR_lev_trotsky.GetName] ув'язнений!"
 AAT_norway_allied.4.t:0 "Заміна Локе"
 AAT_norway_communist.6.a:0 "Боягузи!"
 AAT_norway_fascist.1.b:0 "Ми не станемо ділити владу з місцевими."
 AAT_norway_fascist.2.t:0 "Держава [FROM.GetNameDef] знехтувала нами!"
 AAT_norway_monarchist.2.a:0 "Які ще трагедії може принести майбутнє?"
 AAT_norway_rikstanken.3.desc:0 "Уряд держави [FROM.GetName] звернувся до нас з проханням дозволити придбати танк. Заковика полягає в тому, що через бюджетні причини вони можуть дозволити собі лише один легкий танк... без башти.\n\nЗвісно, прохання досить незвичне, щоби бути підозрілим, але влада стверджує, що хоче випробувати його, перш ніж вирішити, як будувати свої бронетанкові війська."
 ABDA_the_malay_barrier_desc:0 "Ланцюг островів, що тягнеться від Малайї через [INS.GetNonIdeologyName], формує природний оборонний бар'єр. Сили ABDA повинні використати цю географію, створивши скоординовану морську та наземну оборону, щоб уповільнити просування ворога."
