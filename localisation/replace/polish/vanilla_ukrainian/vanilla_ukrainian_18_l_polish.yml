 USA_pacific_pacification:0 "Утихомирення Тихого океану"
 USA_protest_panay:0 "Скористатися затопленням USS Panay"
 USA_railway_gun_equipment_1:0 "8 inch Mk VI"
 USA_reach_out_to_the_ware_group_desc:0 "У нашому уряді існує невелика група переконаних комуністів. Вони вважають, що діють у таємниці, але ми знаємо їх поіменно. Можливо, вони зрозуміють, що наші цілі збігаються, і ми переконаємо їх відкрито увійти до уряду."
 USA_robert_oppenheimer:0 "Роберт Оппенгаймер"
 USA_sikorsky_organization:0 "Sikorsky Aviation Corporation"
 USA_sp_naval_nuclear_missile_submarine:0 "Підводний човен класу «George Washington»"
 USA_sp_naval_nuclear_submarine:0 "Програма «USS Nautilus»"
 USA_unrestricted_submarine_warfare:0 "Необмежена підводна війна"
 USA_wartime_industry_desc:0 "Ми маємо розвинену промисловість, але вона погано пристосована для війни. Ми мусимо знайти ефективний спосіб перевести її на нові рейки, щоб краще використати всі наявні ресурси."
 USA_wpa_desc:0 "Велика депресія призвела до того, що без засобів для існування залишилися мільйони людей. Управління громадських робіт, покликане спрямовувати їх на роботи в державному секторі, може не вирішити всіх проблем, однак це перший крок у правильному напрямку."
