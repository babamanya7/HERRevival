 ss_recruitment_event.20.b:0 "Менша сила гарантує, що тільки найкращі з наших людей носять цю мантію честі."
 ss_recruitment_event.25.desc:0 "Знову доля тримала руку над [GER.GetLeader] і захистила його від біди. Як розповідає сам фюрер, Гіммлер навів на нього пістолет під час приватної зустрічі, викрикуючи образи та нецензурну лайку. Явно охоплений жадобою влади, райхсфюрер SS намагався вбити [GER.GetLeader], але зброя заклинила та не вистрілила. У момент сум'яття фюреру вдалося здолати Гіммлера і крикнути на допомогу. Як повідомляється, для стримування Гіммлера знадобилося чотирьох членів його гвардії.\n\nВ іншому місці в Райху виникла низка напружених протистоянь між підрозділами SS і регулярної армії, коли перші намагалися захопити ключові комунікаційні пости, але врешті відступили, почувши про те, що [GER.GetLeader] вцілів.\n\nПідрозділи Вермахту мають в оточенні головні офіси та володіння SS і чекають наказів з Берліна."
