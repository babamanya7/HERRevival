 bftb_bulgaria_equipment_purchases.3.c:0 "Закупити важку бронетехніку"
 bftb_bulgaria_factions.20.a:0 "Рано чи пізно голод змусить їх повернутися до стада"
 bftb_bulgaria_factions.27.desc:0 "Нарешті нам вдалося інтегрувати широких соціалістів в уряд і домогтися більш тісної співпраці членів покійної організації з нашою партією. Єднання найбільших умов нашої країни стане запорукою успішної спільної роботи над більшими проєктами."
 bftb_bulgaria_factions.52.t:0 "Члени «Звена» репресовані"
 bftb_bulgaria_factions.73.t:0 "Захоплення лідерів Землеробського союзу"
 bftb_bulgaria_factions.85.t:0 "Захоплення лідерів націонал-соціалістичного руху"
 bftb_bulgaria_fate_of_the_balkans.1.a:0 "[ROOT.GetNameDefCap] вступить до альянсу [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.6.a:0 "[FROM.GetLeader] не може мислити здорово..."
 bftb_bulgaria_yugoslavian_influence.3.desc:0 "[BUL.Capital.GetName] зустрічає свого лідера. [GetBulgarianLeaderToMeetStalin] повертається з зустрічі в місті [YUG.Capital.GetName], де він і [YUG.GetLeader] обговорювали підписання договору про вічну дружбу між державами [YUG.GetNameDef] та [ROOT.GetNameDef]. На жаль, [YUG.GetLeader] ставиться до думки про дружбу з державою [ROOT.GetNameDef] без ентузіазму, тому наша пропозиція була категорично відкинута."
 bftb_bulgarian_claims.6.desc:0 "Згідно з угодою між [GER.GetAdjective]им і [BUL.GetAdjective]им урядами, [GER.GetNameDef] поступається контроль над територіями, які зараз займаємо ми і на які претендує [BUL.GetNameDef]. Відтепер тут розпоряджається [BUL.GetAdjective]ий уряд."
 bftb_greece.173.t:0 "Наші підприємці повертаються з інвестиційних переговорів в Афінах!"
 bftb_greece.179.c:0 "Нас узагалі не цікавлять [FROM.GetAdjective]і справи!"
 bftb_greece.179.desc:0 "$bftb_greece.166.desc$"
 bftb_greece.184.t:0 "[FROM.GetAdjectiveCap]і представники не прийняли нашого делегата і виключили будь-яку можливість інвестицій"
 bftb_greece.185.a:0 "Є альтернативи війні!"
 bftb_greece.187.a:0 "Краще угода з дияволом, ніж смерть."
 bftb_greece.189.desc:0 "Можливо, ми надто напирали з питаннями про інвестиції: [FROM.GetAdjective]і інвестори вирішили, що їм нецікаво вкладати кошти в зростаючу промислову базу нашої країни. Якщо вони не бажають допомогти нам створити власне майбутнє, нам доведеться зробити це без них."
 bftb_greece.193.b:0 "Краще угода з дияволом, ніж смерть."
 bftb_greece.194.a:0 "Можливо, це і на краще..."
 bftb_greece.207.b:0 "Афіни ніколи не будуть під владою фашистських псів!"
 bftb_greece.22.a:0 "Перемогли голоси за!"
 bftb_greece.237.desc:0 "Дипломати з держави [FROM.GetNameDef] повідомили нам, що [FROM.GetLeader] підтримує наші плани проти держави [TUR.GetNameDef]. Звіти нашої військової розвідки також свідчать про те, що вони почали перекидати війська до [TUR.GetAdjective]ого кордону."
 bftb_greece.44.a:0 "[FROM.GetAdjectiveCap]а участь у Комінтерні обов'язкова."
 bftb_greece.58.a:0 "Ми приймаємо вашу пропозицію в обмін на офіційний союз."
 bftb_greece.65.t:0 "[FROM.GetNameDefCap] та [TUR.GetNameDef] пропонують стратегічне партнерство"
 bftb_news.15.desc:0 "[BUL.GetAdjective]ий прем'єр-міністр [BUL.GetLeader] і [GRE.GetLeader] зустрілися в [GRE.GetAdjective]ій столиці, щоб обговорити підписання договору, за яким уряди обох країн офіційно домовляться про дружні відносини та економічну співпрацю між державами [BUL.GetNameDef] та [GRE.GetNameDef].\nЯк заявляє [BUL.GetLeader], це стане першим кроком на шляху до відновлення відносин між державою [BUL.GetNameDef] та її сусідами, що може принести плоди в найближчому майбутньому."
 bftb_news.205.b:0 "О ні, невже знову?!"
 bftb_news.207.d:0 "Хм."
 bftb_news.208.d:0 "Ми хочемо лише повернути свої землі."
 bftb_news.9.b:0 "Цікаво..."
 bftb_turkey.1.desc:0 "Президент [TUR.GetLeader] повідомив нам, що [TUR.GetNameDef] готується знову мілітаризувати Турецькі протоки. [TUR.GetAdjectiveCap]ий уряд хоче, щоби ми підкріпили його претензії на територіальні води і так змінили Лозаннський договір, щоб ці претензії стали легітимними.\n\nЯкщо підтримати [TUR.GetAdjective] претензії на Турецькі протоки, [TUR.GetNameDef], безсумнівно, буде у нас у боргу і, можливо, зможе заперечувати панування держави [ITA.GetNameDef] у середземноморському з іншого боку, вплутавшись у цю кризу, ми можемо опинитися в опозиції до держави [SOV.GetNameDef], що в гіршому випадку здатне вилитися у війну."
 bftb_turkey.102.a:0 "Війна — найгірший варіант."
 bftb_turkey.12.a:0 "Ми перемогли!"
 bftb_turkey.134.a:0 "Джеляль Баяр — очевидний кандидат."
 bftb_turkey.18.desc:0 "Для народжуваної демократії держави [TUR.GetNameDef] настав чорний день: розкрита змова про підтасовування результатів виборів на користь опозиційного руху Аднана Мендереса в сільських провінціях держави [TUR.GetNameDef]. Лідери, працівники місцевих адміністрацій і навіть державні службовці запобігли, а змовники заарештовані. Докази зв'язку із змовою Мендереса або його опозиційного руху не знайдені, але наша реакція, безсумнівно, вплине на його виборчу кампанію."
 bftb_turkey.21.desc:0 "Довгоочікуваний день виборів нарешті настав. Незважаючи на погану погоду та особисті труднощі, люди всієї країни зібралися на дільницях для голосування у своїх провінціях і заповнили бюлетені, поставивши позначки проти своїх улюблених партій. Ніхто не очікував такої передвиборні перегони проходили не зовсім чесно, але будь-який прихильник демократії радий був бачити, що стільки [TUR.GetAdjective] громадян прийшло голосувати на перші вільні вибори держави [TUR.GetName].\n\nКандидати йшли врівень, і на підрахунок голосів та визначення результату виборів пішло чимало часу. У результаті переможцем на перших виборах у державі [TUR.GetNameDef] стає..."
 bftb_turkey.24.a:0 "Джеляль Баяр — очевидний кандидат."
 bftb_turkey.29.desc:0 "Здається, наше рішення сповідувати в управлінні принцип «Батьківщина передусім» мало величезний ефект! По всій країні люди поспішають добровільно записатися в армію. Верховному командуванню вже важко справлятися з таким напливом бажаючих різних релігій і мов. \n\nНа щастя, ми хоч і частково, але були готові до такого повороту подій, і інтеграція колишніх ухилістів пройшла більш-менш плавно. Радники припускають, що приплив добровольців може тривати ще досить довго!"
 bftb_turkey.32.a:0 "Підпишіть контракт. Нехай забирають острови, якщо готові за них заплатити."
 bftb_turkey.37.a:0 "Що ж, могло б бути і краще."
 bftb_turkey.38.a:0 "Давайте працюватимемо разом до нашої взаємної вигоди."
 bftb_turkey.42.t:0 "[FROM.GetNameDefCap] вступить до групи [ROOT.GetFactionName]."
 bftb_turkey.5.a:0 "Ми запропонуємо компроміс."
 bftb_turkey.64.t:0 "[FROM.GetNameDefCap] приєднується до альянсу [ROOT.GetFactionName]"
 bftb_turkey.65.a:0 "Ми мусимо терміново підключити до цього пакту та інші нації."
 bftb_turkey.68.t:0 "Починається [IRQ.GetAdjective] громадянська війна"
 bftb_turkey.70.desc:0 "[IRQ.GetAdjective] фашисти не змогли вигнати [IRQ.GetAdjective] лоялістів і були роздавлені [IRQ.GetAdjective] армією. Це просто жахливо! З іншого боку, наші стратеги вважають, що держава [IRQ.GetNameDef] тепер буде занадто слабким, щоб протистояти нам, коли наші війська захоплять контроль над його державними апаратами."
 bftb_turkey.74.desc:0 "[FROM.GetAdjectiveCap]а верхівка вирішила оголосити, що підтримує наш уряд. Такі оголошення є дуже важливими для закріплення нашого суверенітету та легітимізації нашої ролі як окремої нації всупереч [ENG.GetAdjective] імперіалізму."
 bftb_turkey.84.desc:0 "Підколодні змії з держави [FROM.GetNameDef] надіслали нам недвозначну вимогу скласти зброю і допустити [FROM.GetAdjective]их солдатів на нашу територію для «захисту [ROOT.GetAdjective] робітників та їх прав\" шукати не доводиться: [FROM.GetNameDef] хоче повністю прибрати до рук наші справи і наш суверенітет.\n\nМи не якась другосортна держава на світових побігеньках, ми — [ROOT.GetNameDef]!Нікому не дозволено витирати нами підлогу, тим більш такій відверто ворожій державі, для якої ми— вічна жертва, нам потрібні союзники, має бути хоч одна країна, яка разом з нами повстане проти войовничості, хоча, якщо подумати, чи варто це можливих втрат серед [ROOT.GetAdjective] народу?"
 blow_suez_canal:0 "Підірвати Суецький канал"
 bombingthem:0 "Бомбардуючи їх"
 bosporus_strait_blocked_tt:0 "§RПротока заблокована для держави [ROOT.GetName] через погіршення стосунків із розпорядником протоки.§!"
 brilliant_strategist_desc:0 "§LПрироджений стратег, вміє швидко підлаштовуватися під ситуацію на полі бою.§!"
 britain.10.a:0 "Вінстон Черчилл — це той, хто потрібен Імперії."
 britain.11.t:0 "Вісь Берлін–Москва"
 britain.13.a:0 "Так."
 britain.16.d:0 "Помер Його Величність Георг V, король Сполученого Королівства та британських домініонів та імператор Індії. Його тихий спокій і відданість своїм підданим провели Імперію як через Велику війну, так і Велику депресію. Його син прийме мантію як король Едуард VIII, але вже є побоювання, що він буде занадто вільнодумний. Стенлі Болдвін і Невілл Чемберлен зроблять усе можливе, щоб він приймав вказівки прем'єр-міністра та кабінету міністрів."
 britain.22.t:0 "Стенлі Болдвін подає у відставку"
 britain.8.a:0 "Тоді це війна!"
 bruneval_attack_desc:0 "Штурмовий загін розділиться на чотири команди для захоплення РЛС та зачистки пляжу для евакуації. Фахівець розбере радарну установку та сфотографує її. Також загін намагатиметься полонити для допиту ворожого техніка."
