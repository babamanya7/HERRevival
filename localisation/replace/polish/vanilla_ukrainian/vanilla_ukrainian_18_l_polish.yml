 ship_light_battery_sub:0 "200-мм батарея"
 ship_torpedo_upgrade:0 "Торпеди"
 shore_bombardment_collateral_damage_factor:0 "Побічна шкода від обстрілу узбережжя"
 siam.16.t:0 "Зупинений наступ"
 siam.24.desc:0 "Кооператив розвитку [SIA.GetAdjective] дав державі новий інструмент для національного вдосконалення, але амбіції все ще випереджають внутрішній капітал. Залізниці, майстерні та електричні станції потребують зовнішнього фінансування, якщо вони мають розвиватися швидко. Тепер перед нами два шляхи. Інвестиції [ENG.GetAdjective] пропонують доступ до встановлених ринків, досвідчених фірм та фінансового престижу Лондона. Інвестиції [JAP.GetAdjective] обіцяють тісніше промислове партнерство з азійською державою, яка прагне розширити свій вплив. Обидва шляхи можуть прискорити розвиток, хоча жоден з них не обійдеться без зобов'язань."
 siam.28.t:0 "Коронація короля Ананди"
 siam.33.t:0 "Продаж Bangkok Dock Co."
 siam.5.desc:0 "Спеціальний трибунал, створений Пхуном, щоб судити 51 особу, причетну до повстання, ухвалив, що 25 з них будуть ув'язнені довічно, а 21 — розстріляні. З цих 21 трьох помилувано через їхні заслуги, а саме принца Рангсіта та Прая Тепахатсадіна."
 siam_dem.2.t:0 "Армія заперечує"
 siege_artillery_mobile_artillery_command:0 "Мобільне артилерійське командування"
 sinkiang_ma_autonomy_sea_warlord_subject:0 "Сіньцзянська кліка Ма"
 south_american_events.11.a:0 "Аяла мусить піти. Не можна допустити ескалації..."
 south_american_events.14.t:0 "Президентські вибори 1938 року"
 south_american_events.50.b:0 "Чому наші солдати повинні вмирати за [FROM.FROM.GetNonIdeologyName]?"
 south_american_events.51.a:0 "Ми не зацікавлені в конфлікті з [USA.GetNameDef]"
 south_american_events.60.a:0 "Дозволити їм продовжувати."
 south_american_events.60.b:0 "Придушити цих соціалістичних агітаторів!"
 south_american_news.10.b:0 "Це може бути можливістю розширити наш вплив у регіоні."
 south_american_news.2.d:0 "Ґабріель Терра, президент Уругваю, оголосив минулого тижня про проведення виборів і відхід від влади, яку він отримав в результаті державного перевороту в 1933 році. Таким чином, влада перейде до зятя Терри, просоюзницького політика Альфредо Бальдоміра Феррарі."
 south_american_news.8.a:0 "Чи не досить їм було війни?"
 soviet.15.d:0 "Тувинці обурливо відмовилися об'єднатися з Радянським Союзом! Чого ця жалюгідна нація могла сподіватися досягти самотужки — загадка, відповіді на яку, можливо, ніколи не знайти."
 soviet.25.d:0 "Незважаючи на вигнання Лева Троцького, $SOV_iosif_stalin$ побоюється, що у того є таємні прихильники всередині партії. Серія швидких арештів і жорстоких допитів призвела до зізнань і свідчень, які зручно вказували на деяких суперників Сталіна. Однак, що більше запитань ставиться і що глибше таємна поліція копається в листах і щоденниках, то більше людей виявляються причетними, бодай опосередковано.\n\nЧлени партії починають вірити, що абсолютна влада Сталіна та смерть його дружини ізолювали його до такої міри, що він сприймає будь-кого як загрозу; та хіба це не саме те, що казав би зрадник?"
 soviet.32.b:0 "$soviet.30.b$"
 soviet.36_threat_FIN:0 "Фінляндія — маріонетка Радянського Союзу"
 soviet.54.d_purge:0 "Стало зрозуміло, що найбільшу загрозу для російської держави становлять не змовники проти комуністичної партії, а сама партія. З розчаруванням у комуністичній мрії в Росії нові сили захопили владу, щоби повести нашу країну в майбутнє.\n\nПісля повалення Сталіна [Root.GetLeader] провів над старим генеральним секретарем швидкий судовий процес. Його параноїдальне полювання на відьом було проголошено знищенням керівництва країни в час відчайдушної потреби, і Сталін був засуджений до смертної кари за державну зраду. Стара система пішла з ним у безіменну могилу."
 sp_air_bouncing_bomb_aircraft_modifications_reward_desc:0 "Під час останнього випробування ми нарешті точно визначили, які саме зміни потрібні планеру для правильного встановлення механізму скидання."
 sp_air_bouncing_bomb_backspin_mechanism_reward:0 "Механізм зворотного обертання"
 sp_air_generic_aerodynamics_advancements_reward_desc:0 "Під час роботи ми зробили чимало відкриттів у загальній аеродинаміці, які стануть у пригоді для нашого літакобудування."
 sp_air_intercontinental_bomber:0 "Міжконтинентальний бомбардувальник"
 sp_air_intercontinental_bomber_desc:0 "Величезний літак, навантажений бомбами та пальним, розроблений спеціально для далеких висотних польотів, що дає йому можливість перетинати океани та континенти."
 sp_air_jet_engine_compromise_2:0 "Осьовий реактивний двигун: загальні поліпшення"
 sp_air_jet_engine_preference_fighter:0 "Винищувачі"
 sp_armored_engineer_tech_desc:0 "Поєднуючи інженерні знання з броньованим захистом, броньовані інженерні підрозділи спеціалізуються на розчищенні перешкод і підтримці просування фронту під сильним вогнем."
 sp_land_generic_reward_army_xp_3:0 "Адаптовані польові тактики"
 sp_land_generic_reward_scientist_xp_2:0 "Витончена експертиза"
 sp_land_reward_land_cruiser_assembly_desc:0 "На етапі складання інженери проєкту «[SpecialProject.GetName]» успішно вдосконалили техніку точного вирівнювання для встановлення масивних компонентів техніки, як-от кільце башти та обшивка корпусу, що значно зменшило ризик механічних руйнувань під дією напруги. Ми можемо інтегрувати цю інноваційну технологію на всіх етапах проєкту, щоби збільшити надійність конструкції загалом. Як нам її застосувати?"
 sp_land_reward_self_propelled_super_heavy_howitzer_focus_preference:0 "$sp_land_reward_super_heavy_howitzer_focus_preference$"
 sp_naval_cruiser_submarine_preference_a:0 "Гнучкість операцій"
 sp_naval_fleet_submarine_desc:0 "Підводний човен дальнього плавання, здатний виконувати функції супроводу флоту, але без недоліків, притаманних конструкції попередніх крейсерських підводних човнів."
 sp_naval_fleet_submarine_unique_reward_a:0 "Конструкторські принципи"
 sp_naval_generic_reward_artillery_tech_3:0 "Аналітика корабельних батарей"
 sp_naval_nuclear_torpedo_desc:0 "З появою тактичних боєголовок низької потужності, торпеди великої дальності з такими боєголовками теоретично можуть бути встановлені на будь-якому звичайному підводному човні."
 sp_naval_submarine_carrier_preference_a:0 "Extended Range"
 sp_naval_submarine_carrier_unique_reward_a_desc:0 "Our submarine carriers push the limits of naval engineering, and cannot be equally strong in every area. Shall we prioritize range, hull strength, or stealth?"
 sp_naval_torpedo_cruiser_unique_reward_a_desc:0 "З відродженням старої концепції торпедного крейсера ми маємо ухвалити важливе рішення щодо його ролі у флоті: чи варто зосередитися на їхній сильній стороні — торпедах, чи вирішити їхню головну проблему — боротьбу з есмінцями?"
 sp_naval_underway_replenishment_desc:0 "Постачання ВМС, що знаходяться далеко від своїх баз, завжди було обмежуючим фактором. Оскільки наші флоти діють на надзвичайних відстанях, нам потрібно розробити нові методи постачання."
 sp_nuclear_bomb_design_choice_reward_desc:0 "Існують два проєкти атомної зброї, над якими працюють наші вчені, і розгорнулися дебати щодо того, як їх утілити в життя. Одна конструкція, відома як гарматний тип, набагато простіша у створенні, але й менш ефективна у використанні ядерного матеріалу. Інший — вибуховий, набагато складніший, але теоретично ефективніший у використанні ядерного матеріалу."
 sp_nuclear_major_political_interference_generic_reward_option_fire:0 "[(Character?.GetName:'CAP_SCIENTIST)] піде"
 sp_rocket_design_choice_reward_payload:0 "Вантаж"
 sp_rocket_launch_site_choice_reward_reject:0 "Знайти спосіб змусити нинішнє місце запрацювати."
 sp_rockets_ballistic_missile:0 "Балістична ракета"
 sp_rockets_onsite_explosion_generic_reward:0 "Вибух на місці"
 sp_rockets_warhead_detonation_mechanisms_reward_desc:0 "Важливою частиною всього процесу розробки є забезпечення вибуху зброї в потрібний момент. Схоже, що науковцеві [Character.GetName] вдалося знайти рішення, яке дозволяє підірвати її в найбільш сприятливий момент."
 sp_tag_artillery:0 "Проєкти артилерії"
 special_envoy:0 "Особливий посол"
 special_forces_cap_flat_tt:0 "$MODIFIER_SPECIAL_FORCES_CAP_FLAT$: $RIGHT|+=%0$"
 spirit_of_genghis:0 "Дух Чінґісхана"
