 POR_the_kingdom_reunited_desc:0 "Після відновлення португальського та бразильського престолів ми повинні здійснити об'єднання наших країн, перш ніж спогади про нашу спільну боротьбу залишилися позаду.\nМи подамо пропозицію уряду Бразилії, чітко давши зрозуміти, що якщо вони не підпишуть її добровільно, ми будемо змушені тиснути на це питання іншими засобами..."
 POWERED_BUILDING:0 "Powered Construction: $VAL|+=%2$"
 PRC_100_regiments_campaign_desc:0 "Досі ми зосереджувалися на дрібних сутичках, змушуючи супротивника вважати нас слабкими та неорганізованими. Наш масований наступ застигне ворогів, що розслабилися, зненацька."
 PRC_DEF:0 "Комуністичний Китай"
 PRC_a_modern_army_desc:0 "Тепер, коли ми вдосконалили наше спорядження, нашу доктрину, наше навчання та багато іншого, ми нарешті можемо бути впевнені, що ми підготовлені настільки, наскільки це можливо, незалежно від того, з яким ворогом ми можемо зіткнутися."
