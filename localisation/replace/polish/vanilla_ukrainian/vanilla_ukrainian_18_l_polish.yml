 FIN_mannerheim_line_expansion_modifier_desc:0 "Зміцнюючи та розширюючи лінію Маннергейма, ми покажемо, що з Фінляндією не можна поводитися легковажно та що фіни готові відстоювати свою незалежність усіма доступними засобами."
