 ITA_german_military_cooperation_desc:0 "$ITA_german_millitary_cooperation_desc$"
 ITA_inigo_campioni:0 "Ініґо Кампіоні"
 ITA_integrate_polizia_dell_africa_italiana_somalia_tt:0 "Створити §Y1 піхотну§! дивізію."
 ITA_intensify_torpedo_manufacturing_desc:0 "Італійські торпеди є одними з найнадійніших у світі. Фіуме був батьківщиною торпеди, і з тамтешнім заводом і заводом «Silurificio Italiano» в Неаполі ми отримуємо хороше підґрунтя для подальшого розширення використання цієї смертоносної морської зброї."
 ITA_italian_irredentism_ns:0 "$ITA_italian_irredentism$"
 ITA_italian_tankettes_desc:0 "У той час як інші країни можуть розробляти все більші та важчі танки в пошуках супертанка, який зробив би всі інші танки застарілими, ми знаємо, що найліпший танк — це танк, який насправді знаходиться на полі бою. Танк мусить бути достатньо швидким, щоби вчасно прибути туди, де потрібен, і йому потрібна лише броня досить важка, щоби витримувати гвинтівки. Така машина була б дешевою та швидкою у виробництві."
 ITA_italy_will_guarantee_tt_fulfilled:0 "§Y[ROOT.GetNameDefCap]§! надасть §Yгарантії§! будь-якій §Yвеликій країні§!, яка гарантує державу §Y[ROOT.GetNameDefCap]§!. Поточний ефект:"
 ITA_king_umberto_total_control_range:0 "$ITA_king_total_control_range$"
 ITA_light_cruiser_4_desc:0 "Клас «San Marco» є вдосконаленою версією більш ранніх легких крейсерів «Capitani Romani». Через італійське перемир'я «San Marco» та його перероблений сестринський корабель «San Giorgio» не були введені в експлуатацію до 1950-х років."
