 SIA_a_more_moderate_option_desc:0 "Реформи повинні тривати, а не згоріти у бурі опозиції. Зберігаючи Жовте досьє в поміркованих межах, ми можемо ізолювати екстремістів, заспокоїти середній клас і побудувати цивільний порядок, який переживе свою першу перемогу."
