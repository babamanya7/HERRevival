 JAP_the_enemy_of_our_enemy_desc:0 "Загроза від [SOV.GetSovietThreatName], що нависла над нашими північними кордонами, має бути усунена. Ми повинні розпочати підготовку до війни з [SOV.GetNameDef]. Найкращий спосіб зробити це — зміцнити наші відносини з [GER.GetNameDef], яка, за нашими даними, готується до війни проти [SOV.GetNameDef]."
 JAP_the_lecture_group_ascendant_desc:0 "У дебатах перемогла більш авторитарна та орієнтована на пролетаріат фракція Кодза-ха. Лідери цієї фракції, Сандзо Носака та Кюїчі Токуда, візьмуть на себе складне завдання побудови нової держави. Однак залишається питання: хто має очолити її як Голова, а хто стане Прем'єром нації?"
 JAP_the_metal_collection_order:0 "Наказ про збір металу"
 JAP_the_propaganda_department_decisions_desc:0 "Відділ пропаганди постійно працює над протидією ворожому впливу, а також над поширенням нашого власного як всередині країни, так і за її межами. За допомогою цієї організації ми можемо допомогти скерувати курс Азії до бажаного для нас результату."
 JAP_the_unthinkable_option:0 "Немислимий варіант"
