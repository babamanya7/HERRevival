 CZE_armored_car_equipment_1_short:0 "OA vz. 30"
 CZE_arms_exports_1:0 "Експорт зброї"
 CZE_army_readiness_1_desc:0 "Готовність армії — це не лише люди та техніка на полі бою. Впевненість у своїй підготовці та підтримка політичних і промислових лідерів країни мають велике значення перед лицем загроз. Мати засоби для боротьби — це одне, а здатність робити це ефективно — зовсім інше."
 CZE_artillery_equipment_3:0 "10,5 cm hrubý kanón vz. 43"
 CZE_autonomous_sentiment_desc:0 "Союз із Блоком автономістів має свої недоліки. Одним із них є задоволення їхніх вимог щодо надання регіону [SLO.getname] певної автономії. Інші частини нашої країни можуть вимагати до себе такого ж ставлення."
 CZE_balkan_tech_sharing_group_desc:0 "Research agreement between primarily Balkan nations and [CZE.GetNameDef] to keep their industrial technology on par with larger nations."
 CZE_bop_army_readiness_left_side:0 "Непідготовлена армія"
 CZE_bop_has_started_tt:0 "Баланс сил «§Y$CZE_bop_army_readiness$§!» почав діяти в країні §Y[ROOT.GetName]§!."
 CZE_cooperate_with_tito_desc:0 "[YUG.GetNameDefCap] намагається побудувати прагматичну версію комунізму, як і ми. Вони так само прагнуть об'єднати різні народи під червоним прапором. Зіткнувшись із цими викликами, ми маємо співпрацювати у військових та політичних питаннях."
 CZE_create_a_secret_police_branch:0 "Створити відділення таємної поліції"
 CZE_current_skoda_priority_dynamic_local_tanks_focus:0 "$CZE_current_skoda_priority_dynamic_local_start$ §YТанковий фокус§!"
 CZE_demand_the_czech_corridor_desc:0 "У міру того, як ми перетворюємо Малу Антанту на справжній альянс, стає дедалі очевиднішим, що передислокація військ до наших союзників або отримання їхніх військ може виявитися дуже складною в разі конфлікту. Наявність смуги території, що з'єднує нашу країну та [YUG.GetNameDef], як це колись пропонувалося після Великої війни, могла б підвищити нашу безпеку та убезпечити нашу торгівлю."
 CZE_destroyer_catchup_1_desc:0 "Необхідність будівництва флоту вилилася в стрімку розробку проєктів есмінців."
 CZE_diplomatic_workhorse:0 "Дипломатична робоча конячка"
 CZE_emil_kolben:0 "Еміл Колбен"
 CZE_escalate_border_war:0 "Ескалація [CZE.GetAdjective]о-[66.owner.GetAdjective]ий прикордонної війни"
 CZE_expand_the_aero_clubs_desc:0 "Аероклуби довели свою корисність у забезпеченні постійного припливу талановитих пілотів для нашої країни; ми повинні надалі розширювати їх."
 CZE_expand_vitkovice_ironworks_desc:0 "Вітковицький металургійний завод є важливим постачальником заліза в межах [74.getname]. Його розширення значно збільшить виробничі потужності заводу."
 CZE_frantisek_machnik:0 "Франтішек Махнік"
 CZE_gottwald_faction_desc:0 "Віддана Москві до нестями, сталінська фракція Клемента Ґотвальда бачить чехословацьку державу за образом і подобою СРСР."
 CZE_increase_funding_from_moscow_desc:0 "[ROOT.GetCommunistParty] настільки недофінансована, що наразі оплачує свої приміщення із зарплат власних представників. Щоб зростати, ми маємо звернутися до [SOV.GetNameDef] з проханням збільшити фінансування для поширення нашої газети та залучення нових членів."
 CZE_invest_in_the_balkans:0 "Інвестиції в Балкани"
