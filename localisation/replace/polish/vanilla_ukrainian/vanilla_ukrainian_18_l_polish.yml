 TUR_disorganised_armed_forces_desc:0 "Турецькі збройні сили молоді, як і сама Туреччина. Хоч наша армія і перемогла у Визвольній війні Антанту і османів, за свободу держава заплатила кров'ю. Після того як країна втратила майже чверть населення у Великій війні, мало хто хотів втручатися в нову, але тепер, коли над світом знову нависла загроза масштабного конфлікту, у нас немає вибору. Треба або негайно модернізувати армію, або зробити так, щоб війна ніколи не підійшла до наших кордонів."
 TUR_expanding_our_armaments:0 "Розширити озброєння"
 TUR_fidelity_decision_desc:0 "Вірність султану, вірність Всевишньому — ось два стовпи, яким має глибоко поклонятися кожен наш громадянин."
 TUR_halk_ve_devlet:0 "Halk ve Devlet"
