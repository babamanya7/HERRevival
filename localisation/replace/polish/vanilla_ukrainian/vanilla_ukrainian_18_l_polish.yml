 HISTORICAL_TEMPLATE_DISABLED:0 "Щоби створити цей дизайн ($ROLE|H$), вам потрібні ось ці модулі:\n\n$RESTRICTIONS$"
 HND_UNIFIED_communism:0 "Індостанський союз"
 HOA_rallying_the_adjective_people:0 "Згуртування [ROOT.GetAdjective]их людей"
 HOA_support_the_agrarians_desc:0 "Сільське населення [ROOT.GetNameDef], яке працює в сільському господарстві, є основою нації. Таким чином, ми повинні робити більше, щоб підтримувати їх у життєво важливій роботі, яку вони виконують."
 HOA_the_grand_university_of_capital_desc:0 "Передача знань від одного покоління до іншого має життєво важливе значення для безпеки та розвитку будь-якої нації. Тому ми створимо новий великий університет у [ROOT.Capital.GetCapitalVictoryPointName], щоб краще навчати наступне покоління вчених, істориків і митців."
 HOA_use_the_natural_harbors:0 "Використати природні гавані"
