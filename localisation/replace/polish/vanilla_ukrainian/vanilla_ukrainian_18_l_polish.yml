 SWE_surface_raiders_desc:0 "З кількома швидко побудованими невеликими кораблями ми можемо завдати серйозної шкоди військовим зусиллям ворога, порушивши його судноплавство та переміщення військ."
 SWE_the_cross_we_bear_desc:0 "Ми всі скандинавські брати й сестри. [SWE.GetAdjective]а держава не може з чистою совістю сидіти склавши руки, поки наші скандинавські брати томляться під окупацією. Нам необхідно звільнити їх від ланцюгів, щоб ми закликали жити і помри на півночі, вільний від війни та тиранії."
 SWE_the_old_enemy_stirs_desc:0 "Після кривавої громадянської війни та десятиліття масової індустріалізації [SOV.GetNameDef] прагне відновити контроль над територіями старої Російської імперії та за її межами. Якщо ми хочемо не потрапити в пастку [SOV.GetName] сфери впливу, нам потрібно діяти швидко і готуватися до війни."
