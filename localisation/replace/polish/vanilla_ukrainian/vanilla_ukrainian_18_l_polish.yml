 SIA_intermediate_war_preparation:0 "Підготовка до середньої війни"
 SIA_intermediate_war_preparation_desc:0 "Небезпечно готуватися лише до блискавичної кампанії, але й марнотратно організовуватися виключно для нескінченної боротьби. Збалансована доктрина дозволить [ROOT.GetName] завдавати ударів з енергією, зберігаючи при цьому витривалість, необхідну для зустрічі з більш упертим ворогом."
