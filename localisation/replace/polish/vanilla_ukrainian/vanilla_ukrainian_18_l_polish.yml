 GER_the_austrian_question_desc:0 "Менша німецька альтернатива була помилкою, яку ми повинні виправити негайно. Ми повинні примусити австрійців приєднатися до нашої нації, можливо, запропонувавши їм Бурґенланд в обмін на союз із державою [HUN.GetNameDef]."
 GER_the_central_powers_desc:0 "Щоб вистояти проти Заходу, нам потрібні союзники. Ми створимо власний альянс, який дасть відсіч натиску демократичних режимів."
