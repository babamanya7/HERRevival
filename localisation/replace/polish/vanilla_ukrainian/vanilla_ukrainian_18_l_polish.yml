 uk_rock_focus_desc:0 "Окрім того, що Ґібралтар контролює вхід до Середземного моря, він є добре захищеною гаванню, з якої кораблі можуть виходити як в Атлантику, так і в Середземне море. Тому вкрай важливо, щоб вона надійно охоронялася."
