 SOV_anti_tank_equipment_1_short:0 "М1934"
 SOV_approach_primakov_desc:0 "Віталій Прімаков — один з наших головних кавалерійських командирів, і його підтримка була б дуже цінною у спробах убезпечити країну."
 SOV_autonomy_reichsprotectorate_DEF:0 "Протекторат Росія"
 SOV_barrier_troops:0 "Загороджувальні загони"
 SOV_battleship_2:0 "Проєкт 21"
 SOV_black_sea_shipyard:0 "Чорноморський суднобудівний завод"
 SOV_brilliant_genius_desc:0 "Безсумнівно, найгеніальніша людина з нині живих, товариш Сталін поведе нашу країну до нових вершин наукового розвитку і просуне прогрес усього людства вперед семимильними кроками."
 SOV_build_national_academy_of_sciences_integrated_republic_TAJ_desc:0 "Ми збудуємо [TAJ.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_claim_on_the_straits_desc:0 "Протоки, що ведуть з Чорного в Егейське море, є ключовим стратегічним пунктом. Ми не можемо допустити, щоб цю територію контролювали іноземні держави. Щоби забезпечити позиції Червоного флоту, ми мусимо захистити протоки."
 SOV_comecon_dec_cat_name_alt:0 "Спільний економічний простір"
 SOV_comecon_industrialization_program:0 "Програма індустріалізації в державі [FROM.GetNameDef]"
 SOV_end_the_khalkhin_gol_conflict_wargoal_tt:0 "Отримає ціль війни §Y$puppet_wargoal_focus$§! проти держави §Y[JAP.GetFlag][JAP.GetNameDef]§! та §Yкожного [JAP.GetAdjective]ого союзника в Китаї§!."
 SOV_expand_aviation_institutes:0 "Розширити авіаційні інститути"
 SOV_factory_worker_militias_desc:0 "Ми повинні підняти робітників заводу в області [FROM.GetName], щоби посилити підрозділи, які зараз знаходяться в цій місцевості, інакше їм скоро не залишиться заводів для роботи."
 SOV_great_purge_bypass_tt:0 "Троцький став лідером Радянського Союзу"
 SOV_great_purge_desc:0 "Серед офіцерів назріває небезпечна троцькістська змова, навіть у найвищих чинах. Хоча особиста участь Троцького залишається невідомою, загроза велика. СРСР може бути втягнутий у нову громадянську війну... якщо ми не будемо готові чимось пожертвувати."
 SOV_heavy_industry_desc:0 "Поки наші проєкти індустріалізації продовжують набирати обертів, настав час зробити більший акцент на важку промисловість, щоб підготуватися до виробництва більшої кількості військових матеріалів."
 SOV_hold_stalingrad_desc:0 "[217.GetName] не впаде!"
 SOV_influence_army_opposition:0 "Збільшити підтримку армії"
 SOV_merge_naval_plants_tt:0 "Відмикає рішення §YОб'єднати заводи§! для конструкторів кораблів, дозволяючи нам об'єднувати різні заводи в активний конструктор кораблів, щоби покращити його бонуси."
 SOV_merge_ship_plant_4_tt:0 "$SOV_merge_ship_plant_intro_tt$$naval_mines_research$: §G+15%§!\n$MODIFIER_REPAIR_SPEED_FACTOR$: §G+5%§!\n"
 SOV_mikhail_kalinin:0 "Михайло Калінін"
 SOV_military_offensive_name_saturn:0 "Орерація «Сатурн»"
 SOV_motorized_equipment_1:0 "ЗиС-5"
 SOV_national_academy_of_sciences_puppet_desc:0 "За зразком [GetTheUssrAcademyOfSciencesName] держава [SOV.GetNameDef] заснувала новий науково-дослідний інститут у нашій країні, щоби стимулювати як наш, так і їхній науковий розвиток."
 SOV_nav_bomber_equipment_3:0 "Ил-6"
 SOV_offer_autonomy_to_former_soviet_republics_desc:0 "Нам довелося змиритися з деякими втратами імперських територій для досягнення наших цілей, але всі повинні розуміти, що ці території дійсно є частиною імперської російської сфери. Але оскільки вони допомогли нам відновити імперію, ми повинні запропонувати їм певну автономію, щоб показати нашу вдячність."
 SOV_optimize_production_lines_ns_tt:0 "$SOV_modify_fyp_ns_intro$\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+2.00%§!\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+5.00%§!\n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+5.00%§!\n\n"
 SOV_our_slavic_commitments_desc:0 "Колись ми були захисниками всіх слов'ян, навіть вступили у Велику війну, щоб захистити наших слабших братів-слов'ян. Настав час знову взяти на себе цю мантію і поставити нашу військову міць на їхній захист."
 SOV_paced_industrialization_desc:0 "Хоча акцент Сталіна на важкій промисловості призвів до значного недорозвитку багатьох секторів, ми не можемо ігнорувати цей сектор у нашому власному плануванні. Для того, щоб дозволити іншим секторам модернізуватися і механізуватися, ми повинні мати промислову базу для підтримки цього."
 SOV_paranoia_conducting_inspection_flag:0 "Інспекція вже проводиться"
 SOV_peace_deal_for_south_sakhalin_and_kuril_islands_desc:0 "Ми запропонуємо [JAP.GetAdjective]ому уряду припинення всіх бойових дій, якщо вони погодяться повернути наші колишні території — [537.GetName] і [555.GetName]."
 SOV_permanent_revolution_tt:0 "Троцький повернувся"
 SOV_plan_start_of_uprising_archangelsk:0 "Створити секретний штаб у області [FROM.GetName]"
 SOV_plan_start_of_uprising_tashkent:0 "Створити секретний штаб у області [FROM.GetName]"
 SOV_plan_start_of_uprising_ufa_desc:0 "Урал має перевагу в тому, що його легко обороняти, а розміщення нашої бази тут також дозволить нам поширити свій вплив як на Сибір і Північний регіон, так і на південь, у Великий степ, що дає нам багато різних можливостей."
 SOV_policy_of_individual_security:0 "Політика індивідуальної безпеки"
 SOV_politicized_military_swap:0 "Військові політичні радники"
 SOV_propaganda_anti_fascism_tt:0 "Отримає §Y$SOV_anti_fascist_campaign_generic$§! проти §Yнайбільш індустріалізованої фашистської країни у світі§!, що дає §g(§!$MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!, $MODIFIER_DEFENSE_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!§g)§! на §Y[?SOV_default_propaganda_campaign_duration]§! дн."
 SOV_propaganda_do_not_blab:0 "Не базікай!"
 SOV_rebuild_the_far_eastern_fleet_desc:0 "Якщо ми хочемо захистити наші далекосхідні інтереси, а тим більше перейти в наступ, ми повинні різко розширити наші суднобудівні та ремонтні потужності в цьому регіоні."
 SOV_recruit_manchurian_cavalry_exiles:0 "Завербувати маньчжурську кавалерію в області [FROM.GetName]"
 SOV_regional_development:0 "Регіональний розвиток"
 SOV_reinstate_mig_design_bureau_desc:0 "Ми поновимо на посаді цього авіаконструктора та реабілітуємо всіх інженерів та конструкторів, які не мають жодних доказів саботажу чи антирадянської поведінки."
 SOV_religious_primacy:0 "Релігійна першість"
 SOV_relocate_industry_from_leningrad_tt:0 "§RДля застосування ефектів потрібно втримувати Ленінград, коли час рішення спливе.§!"
 SOV_respect_baltic_self_determination:0 "Поважати самовизначення країн Балтії"
 SOV_revive_the_stakhanovite_movement:0 "Відродити стахановський рух"
 SOV_right_purges_tt:0 "Радники лівої опозиції будуть усунуті."
 SOV_rodion_malinovsky:0 "Родіон Малиновський"
 SOV_secure_leningrad_desc:0 "Наш нинішній кордон з Фінляндією знаходиться надто близько до [195.GetName]у. Несподівана атака з боку Фінляндії може досягти міста за кілька годин. Розташування також дозволяє дуже легко блокувати наш Балтійський флот. Це неприйнятний стан речей, і ми мусимо чітко заявити про це фінському уряду."
 SOV_seek_a_defense_pact_with_the_allies_target_eng:0 "§Y[ENG.GetFlag][ENG.GetNameDef]§!"
 SOV_semyon_timoshenko:0 "Семен Тимошенко"
 SOV_send_equipment_cd_tt:0 "\nЦе рішення буде знову доступне через §Y[?SOV_send_infantry_equipment_cd] дн.§!\n"
 SOV_shift_to_armaments_production:0 "Перехід до виробництва озброєнь"
 SOV_sinkiang_mineral_prospection_sik_desc:0 "[ROOT.GetAdjectiveCap]і урядовці зацікавилися золотом і рідкісними мінералами, що видобуваються на [SIK.GetAdjective]ому Алтаї. Щоб отримати доступ до ринку Сіньцзяну, ми запропонуємо шукати нові родовища та поліпшувати інфраструктуру в області [619.GetName] — області, багатій на корисні копалини, але з дуже архаїчними способами їх видобутку, які застосовує наш сусід."
 SOV_sinkiang_support_expansion_flag:0 "Підтримано розширення Сіньцзяну шляхом розвитку інфраструктури на новоздобутих територіях"
 SOV_soviet_aid_decision_category_desc:0 "Держава [SOV.GetNameDef] зацікавилася нашою країною, а точніше, її природними ресурсами, економічним ринком та зовнішніми відносинами. Як було домовлено раніше, [SOV.GetAdjective]ий уряд наразі здійснює інвестиційну програму в нашій країні, яка, як вони стверджують, стимулюватиме розвиток нашої нації."
 SOV_soviet_railways:0 "Радянські залізниці"
 SOV_stirring_the_masses:0 "Підбурюють маси"
 SOV_submarine_warfare_desc:0 "Підводні човни мають значні переваги у морському бою. Добре спроєктований сучасний підводний човен практично неможливо виявити до того, як він випустить свої торпеди, що цілком можуть вивести з ладу капітальний корабель, який у багато разів перевищує його розмір і вартість. Ми мусимо зосередитися на розвитку цих кораблів як основної наступальної сили нашого флоту."
 SOV_support_weapons3:0 "ДС-39 & 82-мм ПМ-41"
 SOV_the_glory_of_the_red_army_desc:0 "Ми успішно витримали ворожий натиск. Настав час перейти в наступ і повернути війну туди, звідки вона прийшла!"
 SOV_the_local_soviets_idea_desc:0 "Дещо відновлено повноваження обласних і місцевих рад. Це означає, що вони можуть легше приймати рішення в питаннях, які є для них терміновими, ціною певного політичного контролю з боку політбюро."
 SOV_the_means_to_wage_war_ns_tt:0 "$SOV_modify_defense_industry_ns_intro$\n$materiel_manufacturer_cost_factor$: §G-25%§!\n\n"
 SOV_the_modern_war_in_the_skies_desc:0 "Повітряна війна пройшла довгий шлях з часів протистоянь біпланів над окопами. Сьогодні вона має індустріальний характер, з високим оперативним темпом, щоб підтримувати тиск на ворога цілодобово. Ми мусимо визнати цей факт і планувати відповідно."
 SOV_the_old_enemy_desc:0 "Протягом багатьох років Швеція була скалкою в оці імперії. Вони знову і знову нападали на Росію і намагалися створювати коаліції проти нас. Цар Пьотр І вперше почав відтісняти їх, розбивши під Полтавою. У 1809 році ми знову перемогли їх, і можна було б подумати, що це змусило їх знати своє місце. Але вони продовжували намагатися оскаржувати наші інтереси в Балтійському регіоні. Настав час раз і назавжди розчавити цю крихітну націю."
 SOV_the_plan_for_the_coup_desc:0 "Ця боротьба за владу не обов'язково має перерости у відкрите насильство. Якщо ми правильно розіграємо наші карти і розставимо потрібних людей на правильні позиції, ми зможемо заморозити Сталіна, а потім усунути його від влади."
 SOV_the_red_fleet_submarine_1_dynamic_modifier:0 "$SOV_the_red_fleet_dynamic_modifier$"
 SOV_the_synod:0 "$SOV_synod$"
 SOV_the_synod_desc:0 "$SOV_synod_desc$"
 SOV_the_zinovyevite_terrorist_center:0 "Зінов'євський терористичний центр"
 SOV_transformation_of_nature_alt:0 "$SOV_transformation_of_nature$"
 SOV_transport_plane_equipment_2_short:0 "Ли-2"
 SOV_ussr_academy_of_sciences_dynamic_modifier:0 "Академія наук СРСР"
 SOV_vasily_blyukher:0 "Василь Блюхер"
 SOV_vladimir_kosmin:0 "Володимир Космін"
 SOV_zemsky_sobor:0 "$SOV_reconvene_the_zemsky_sobor$"
 SPA_a_fleet_worthy_of_a_king:0 "Флот, гідний короля"
 SPA_activate_ciudad_real_fifth_columnists:0 "Задіяти п'яту колону у Сьюдад-Реалі"
 SPA_con_paquito_desc:0 "Нашій справі потрібні сильні лідери, а Франсіско Франко володіє вірністю хваленої Африканської армії. Щоби наше повстання вдалося, попри його вагання в прийнятті рішення, ми мусимо заручитися його підтримкою. Однак, це може мати високу ціну..."
 SPA_embrace_pan_hispanism:0 "Прийняти пангіспанський націоналізм"
 SPA_encourage_local_mining_desc:0 "Наша галузь потребує ресурсів і стала самовдоволеною у своїй ролі нетто-імпортера. Ми повинні заохочувати рух до більш широкого розповсюдження гірничодобувних підприємств у нашій країні, щоб використовувати багатства Піренейського півострова та зменшити нашу залежність від іноземних постачальників."
 SPA_expand_the_air_branch:0 "Розширити повітряну гілку"
 SPA_extol_the_martyrs_of_the_war:0 "Возвеличити жертв війни"
 SPA_facilitate_pyrenees_freight_transports_tt:0 "Додає максимум §Yінфраструктури§! в §YМадриді§!, §YҐуадалахарі§!, §YСхідному Арагоні§!, §YКаталонії§!, §YБургосі§! та §YКраїні Басків§!."
 SPA_generic_democratic_reformer:0 "Раміро де Маесту"
 SPA_generic_fascist_demagogue:0 "Хосе Луїс де Арресе"
 SPA_improve_domestic_naval_facilities_desc:0 "Великий флот вимагає чудової інфраструктури. Потрібні нові верфі та підприємства, і ми повинні розпочати їх будівництво вже зараз."
 SPA_madrid_offensive_mission:0 "Насувається наступ у Мадриді"
 SPA_reassign_disloyal_leader_mission_desc:0 "Уряд стає все більш підозрілим до деяких наших прихильників серед військових і зараз планує перевести одного з наших ключових співучасників на віддалену посаду, що значно ускладнить наші планування та співробітнцтво."
 SPA_safeguard_the_freedom_of_worship_desc:0 "Республіканці загрожують самій вірі в Бога, і ми повинні дати зрозуміти всім, що ми є останнім бастіоном християнства. Ми будемо захищати права і свободу віросповідання всіх християн, і всі бажаючі можуть приєднатися до нашої боротьби на їх захист."
 SPA_suppress_the_strikes_tt_NOT:0 "Не: $SPA_suppress_the_strikes_tt$"
 SPA_supremacy_of_the_communion_desc:0 "Наскільки певно, що Бог створив небеса та землю, так само Традиціоналістичне Сопричастя є ключем до унітарного майбутнього Іспанії. Повстання карлістів у XIX столітті, можливо, перешкоджали, але їхній дух ніколи не був зламаний: ті, хто вірні Вірі, готові знову повстати проти Республіки."
