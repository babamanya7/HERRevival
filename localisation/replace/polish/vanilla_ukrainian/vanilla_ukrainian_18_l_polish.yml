 SUBDOCTRINE_AIR_CAVALRY_DESC:0 "Гелікоптер пропонує радикальну можливість впровадження третього, вертикального виміру в сухопутну війну. Ми можемо конфігурувати армію для використання цього нового підходу для максимальної мобільності та несподіванки."
 SUBDOCTRINE_BATTLESHIP_ANTIAIR_SCREEN_DESC:0 "Лінкори пропонують неперевершені можливості для палубного озброєння. Оснащення їх для боротьби з ворожою авіацією повинно бути пріоритетом, щоб забезпечити чисте небо для наших оперативних груп."
 SUBDOCTRINE_CARRIER_AIRFIELDS_DESC:0 "Палуба авіаносця — найдорожча нерухомість на Землі. Необхідно докласти максимум зусиль, щоб вичавити з неї максимальну можливу повітряну міць."
 SUBDOCTRINE_FIGHTER_HOMELAND_DEFENSE_DESC:0 "Щоб ефективно вести війну, наша промисловість та інфраструктура повинні бути захищені від стратегічного бомбардування за будь-яку ціну."
 SUBDOCTRINE_LINE_OF_BATTLE_DESC:0 "З нашим великим флотом, що йде в колоні, і гуркотом залпів, ми продемонструємо, що великі гармати все ще панують на хвилях. Ми продемонстуємо світу домінацю гіганських стволів."
 SUBDOCTRINE_MOBILE_INFANTRY:0 "Мобільна піхота"
 SUBDOCTRINE_SUBMARINE_COASTAL_DEFENSE_DESC:0 "Малі підводні човни, що діють поблизу берега, можуть стати постійною проблемою для потенційного загарбника."
 SUBDOCTRINE_TACTICAL_BATTLEFIELD_SUPPORT_DESC:0 "Флот легких бомбардувальників, що обрушує руйнування з неба на ворожі опорні пункти, прокладаючи шлях для просування наших військ."
