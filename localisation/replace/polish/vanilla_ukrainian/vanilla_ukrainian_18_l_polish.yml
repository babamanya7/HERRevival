 improved_medium_battery_desc:0 "Поліпшена конструкція башти підвищує швидкість перезарядки зброї, а посилена броня забезпечує виживання розрахунку.\n\nУстановка модуля §YЛегка середня батарея§! посилює §Yобстріл з легких знарядь§!, що допомагає атакувати ворожі §Y. модуля §YСередня батарея§! посилює §Yобстріл з важких знарядь§!, що допомагає атакувати ворожі §Yосновні кораблі§!."
