 FIN_acquire_andros_dockyards_desc:0 "Придбання верфі Andros у Турку значно покращить виробничі можливості нашого провідного розробника суден, $FIN_crichton_vulcan_organization$. Завдяки цьому новому доповненню [ROOT.GetAdjective]і ВМС зможуть виробляти більше кращих кораблів, збільшуючи їх влади та впливу в регіоні."
