 JAP_emperor_yasuhito:0 "Ясухіто"
 JAP_empower_the_emperor_desc:0 "Час маріонеток давно минув, і сам Імператор повинен взяти безпосередній контроль над державою. Тільки тоді наша Імперія зможе протистояти західним імперіалістам."
 JAP_expand_japan_manchukuo_economic_bloc_desc:0 "Ми повинні взяти на себе ініціативу щодо побудови економічного блоку між нами та нашими імперськими підданими, щоб підтримати нашу економіку та забезпечити достатню кількість стратегічних матеріалів, таких як залізо, вугілля, бавовна та сіль."
 JAP_expand_kawagoe_army_arsenal_desc:0 "Наша збройна промисловість наразі намагається встигати за виробничими потребами, щоб гарантувати боєздатність нашої армії на сучасному полі бою. Ми повинні розширити армійський арсенал Каваґое в Сайтамі, щоб підвищити наші шанси узгодити пропозицію з попитом."
 JAP_female_leader_text:0 "вона"
 JAP_first_strike_principle_dm_desc:0 "Переглянута Політика національної оборони, прийнята в 1936 році, окреслила доктрину, в якій ми встановлюємо принцип першого удару та короткострокову операцію як військовий метод дій у надзвичайних ситуаціях. Підготовка до застосування військової сили в мирний час стала необхідною для короткострокової операції, з огляду на затяжну і тотальну війну. Ми виграємо цю війну швидко, бо інакше можемо не виграти її зовсім!"
 JAP_form_greater_east_asian_currency_union_tt:0 "Розблоковує рішення запросити наших союзників до §YВалютного союзу§!"
 JAP_generic_mio_trait_primary_battery_layout:0 "Передова балістика"
 JAP_german_tech_exchange:0 "Німецький технологічний обмін"
 JAP_government_faction_demands_limited_army_influence:0 "$JAP_government_faction$ вимагає обмеження впливу армії"
 JAP_greater_east_asian_treaty_organization:0 "Організація Великого східноазійського договору"
 JAP_greater_tohokai_rule_fascism_ADJ:0 "Імперсько-японськ"
 JAP_heavy_tank_equipment_3_short:0 "O-I"
 JAP_idemitsu_kosan:0 "Idemitsu Kōsan"
 JAP_imperial_army_low_control_range:0 "Growing Army Influence"
 JAP_japanese_navy_dm_desc:0 "Імператорський флот Японії був сформований у 1868 році на початку реставрації Мейджі, і вже до 1920 року став третім за величиною флотом у світі. Тепер наш могутній флот швидко розширюється, щоб наша держава могла протистояти викликам майбутнього."
 JAP_japans_longest_day_desc:0 "З безчесним прем'єр-міністром та його поплічниками розібралися, а введеного в оману Імператора помістили під домашній арешт. Тепер настав час активізувати військові зусилля і повернути нашій нації ту славу, для якої вона призначена."
 JAP_jungle_adaptation:0 "Адаптація до джунглів"
 JAP_light_cruiser_1_desc:0 "Кораблі класу «Tenryu» мали водотоннажність близько 4400 тонн і були слабо озброєні порівняно з аналогічними кораблями інших флотів, але хороша швидкість і достатнє торпедне озброєння компенсували ці недоліки. Вони були спроєктовані як флагмани ескадрених міноносців, і тому вважалися проміжним класом між легким крейсером і есмінцем."
 JAP_machida_chuuji:0 "Чюджі Мачіда"
 JAP_mengjiang_united_autonomous_government_desc:0 "Щоб легітимізувати претензії князя Де на всю Внутрішню Монґолію, ми повинні реорганізувати уряд держави в Об'єднаний автономний уряд Менцзяну, щоб вони могли раз і назавжди об'єднати монґольський народ у межах китайських кордонів під одним прапором."
 JAP_ministry_of_pan_asian_development_idea:0 "Під управлінням Міністерства пан-азійського розвитку"
 JAP_minpon_shugi:0 "Мінпон Шюґі"
 JAP_naval_faction_tier_4_greater_3:0 "$JAP_imperial_influence_tier_4$ $JAP_naval_faction$"
 JAP_new_order_in_east_asia_tt:0 "Виконання фокусу $JAP_sea_greater_east_asian_co_properity_sphere$ трансформує цей альянс"
 JAP_organize_underground_resistance_desc:0 "Якщо наша партія має протистояти не лише армії, а й центральному уряду, нам знадобиться оперативна база, яка буде далеко за межами досяжності будь-якої влади. Звідти ми зможемо почати звільняти наших товаришів із в'язниць і розпочати операції із забезпечення зброєю для революції."
 JAP_pan_asian_revolutuonary_front:0 "Паназійський революційний фронт"
 JAP_promote_meritocracy:0 "Сприяти меритократії"
 JAP_promote_pro_japanese_sentiment_decison:0 "Просувати прояпонські настрої в §Y[FROM.GetNameDef]§!"
 JAP_promulgate_the_military_ministers_system_tt:0 "Цей крок є §Rнепопулярним§! серед членів §Yцивільного уряду§! і з часом неминуче призведе до тертя між фракціями"
 JAP_public_works:0 "Громадські роботи"
 JAP_put_an_end_to_chinese_feudalism_desc:0 "Феодальні традиції все ще панують у Китаї, і існують мільйони людей, яких треба звільнити та привести до нашої революційної республіки. Указ буде видано, і китайський народ буде звільнено раз і назавжди!"
 JAP_raid_category_fluff_text_air_raids:0 "§LАвіаційна служба Імператорської армії§!"
 JAP_reorganized_national_government_desc:0 "До нашого відома дійшло, що численні місцеві уряди, створені нашою армією, а також пряма окупація китайської сільської місцевості обходяться нам надто дорого. Ми повинні об'єднати ці адміністрації та створити Реорганізований національний уряд."
