 SEA_china.22.a:0 "Накласти ембарго на [CHI.GetName]"
 SEA_china.4.t:0 "[FROM.GetNameDefCap] шукає нашої підтримки"
 SEA_china.7.a:0 "Ми станемо разом проти наших ворогів"
 SEA_china_democratic.14.t:0 "[FROM.GetNameDefCap] погоджується підтримати нас"
 SEA_china_democratic.3.a:0 "Вони поділяють наше бачення майбутнього"
 SEA_china_warlords.2.desc:0 "[FROM.GetName] прийняв наш ультиматум. Їхні лідери говорять про національну єдність та історичну долю, але зміст зрозумілий — тепер вони визнають верховенство [ROOT.GetNameDef].\nХоча їхнє підкорення може бути неохочим, воно рятує Китай від подальшого розколу та кровопролиття."
 SEA_generic_events.2.t:0 "[GetOppositionPartyName] організовує страйк"
 SEA_imperial_influence_events.1.desc:0 "Запекла боротьба за владу розгорілася серед різних внутрішніх фракцій у [ROOT.GetNameDef]; усі змагаються за прихильність [GetImperialInfluenceRulerTitle], намагаючись схилити [GetImperialInfluenceGenderHimHer] на свій бік. Питання, яке хвилює всіх: якій фракції [GetImperialInfluenceRulerTitle] зрештою надасть перевагу, а яку проігнорує?"
 SEA_japan.1.t:0 "Інцидент 26 лютого"
 SEA_japan_foreign_policy.106.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] пішов далі, ніж спочатку обіцяв, і маніпулює ринками, щоб ще більше збільшити нашу залежність від їхньої економіки, намагаючись гарантувати, що ми не зможемо зійти з їхнього шляху. Якщо ми негайно не розірвемо з ними стосунки, це практично стане кінцем нашого статусу незалежної нації. Як нам вчинити?"
 SEA_japan_foreign_policy.117.a:0 "Побачимо, чим це для них обернеться"
 SEA_japan_foreign_policy.119.a:0 "Вони поділяють наше бачення майбутнього"
 SEA_japan_foreign_policy.125.a:0 "Вони поділяють наше бачення майбутнього"
 SEA_japan_foreign_policy.138.a:0 "A Wise Choice"
 SEA_japan_foreign_policy.29.desc:0 "Суйюаньська кампанія добігла кінця, і нові кордони накреслено. Ймовірно, це останній раз, коли наші піддані можуть спробувати здійснити подібне вторгнення без втручання китайського центрального уряду, оскільки зараз вони перебувають у стані підвищеної готовності щодо наших дій у регіоні."
 SEA_japan_foreign_policy.42.b:0 "Тут щось нечисто"
 SEA_japan_foreign_policy.5.desc:0 "[FROM.GetLeader] прислухався до голосу розуму і вирішив, що [FROM.GetNameDef] офіційно підпише необхідні документи для сприяння їхньому вступу до нашої фракції. Сьогоднішній день варто святкувати!"
 SEA_japan_foreign_policy.70.a:0 "Ми ніколи не здамося!"
 SEA_japan_foreign_policy.72.t:0 "[FROM.GetNameDefCap] здає Схід"
 SEA_japan_foreign_policy.75.t:0 "Прибуває [FROM.GetAdjective]е спорядження"
 SEA_japan_foreign_policy.78.t:0 "[FROM.GetNameDefCap] відхиляє повну інтеграцію"
 SEA_japan_foreign_policy.92.b:0 "Ми не бачимо потреби в угодах..."
 SEA_japan_popup_events.22.a:0 "Настав час повернути дух епохи Тайшьо!"
 SEA_japan_popup_events.34.t:0 "Дебати про теорію айнської революції"
 SEA_japan_popup_events.50.desc:0 "З утворенням Асоціації допомоги трону стало зрозуміло, що Генкі Абе, лідер «Поліції думок» (Токко), разом із різними керівниками державної служби не особливо задоволені діями [ROOT.GetLeader]. Тепер вони вимагають, щоб він пішов у відставку на користь пронацистського політика Сейґо Накано. Чи варто нам піддатися цьому тиску?"
 SEA_japan_tokko_arrest_events.4.desc:0 "Токко виявила ще одну загрозу нашій внутрішній стабільності. Цього разу вони викрили [SOV.GetAdjective]у шпигунську мережу, очолювану [GER.GetAdjective]им журналістом Ріхардом Зорге — групу, яку визнали винною у шпигунстві та підривній діяльності по всій нашій країні. Схоже, вони знайшли колаборантів, з якими також треба розібратися, таких як колишній журналіст «Асахі Сімбун» Хоцумі Одзакі та Коїті Сайондзі, представник нашої аристократії."
 SEA_japan_tokko_arrest_events.7.desc:0 "Такео Шіммьо, головного репортера «Майніті Сімбун», було заарештовано Токко за критику військових зусиль. Нібито в рамках нашого міжвидового суперництва, у статті стверджувалося, що «Бамбуковий спис не допоможе. Це має бути літак, морська авіація» і що «Результат Великої Східноазійської війни залежить від посилення морської та повітряної сили, і ми не можемо протистояти ворожій авіації бамбуковими списами», прямо критикуючи керівництво нашої армії та просуваючи ідею, що тільки флот може привести нас до перемоги."
 SEA_warlords.19.desc:0 "$wtt_political_warlord_support.21.desc$"
 SEA_warlords.28.desc:0 "Незважаючи на наші найбільші зусилля уникнути подальшого кровопролиття, [FROM.GetLeader] надіслав образливого листа, стверджуючи, що наші погрози порожні, і що армії [FROM.GetNameDef] відкинуть нас аж до [ROOT.Capital.GetName], якщо ми спробуємо здійснити вторгнення."
 SEA_warlords.35.t:0 "Чан Кайші прибуває до Ґуанчжоу"
 SEA_warlords.41.desc:0 "Стверджуючи, що наші погрози вторгненням — це лише казки, [GXC.GetLeader] проголосив, що вони не відступлять, а змусять нас вести переговори. Чи вдасться це, говорити ще зарано, але нам залишається тільки чекати і спостерігати."
 SEA_warlords.42.a:0 "Зробити з нього приклад для інших"
 SEA_warlords.42.desc:0 "Незважаючи на можливість тримати оборону довше, Хань Фуцзюй вирішив втекти з Цзінаня і залишити наш фланг беззахисним. Наші сили вже затримали його за державну зраду, але питання, що нам з ним робити, залишається відкритим. Чи повинні ми покарати його і повністю конфіскувати його землі, щоб показати приклад, чи краще поки що призначити іншого генерала, щоб уникнути подальших проблем?"
 SEA_warlords.52.desc:0 "Зараз [FROM.GetLeader] займається придушенням так званих бандитів у нашому регіоні за наказом [CHI.GetLeader]. Це, звичайно, стосується і нас, але [FROM.GetLeader] звернувся до нас із запитанням, чи можемо ми тимчасово припинити бойові дії, поки він готується до створення Об'єднаного фронту між нами та Ґоміньданом. Чи приймаємо ми цю пропозицію?"
