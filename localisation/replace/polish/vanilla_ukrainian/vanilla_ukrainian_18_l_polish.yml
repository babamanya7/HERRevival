 SPR_military_plot_republicans:0 "Військова змова"
 SPR_nationalist_castille_fascism_DEF:0 "Націоналістична Кастилія"
 SPR_nationalize_the_industry_desc:0 "Замість того, щоби наша галузь розвіялася в руках інвесторів і компаній, ми передамо її під контроль самої держави, щоб краще керувати та організовувати їхнє виробництво."
 SPR_political_violence_desc:0 "На політичній сцені Іспанії спостерігаються зростаючі поляризація та насильство. З часу останнього великого повстання, страйку шахтарів в Астурії, минуло лише два роки, й нинішній політичний клімат, здається, має всі задатки для нового, набагато більшого й набагато менш локалізованого повстання. Здається малоймовірним, що майбутні вибори покладуть кінець цій низхідній спіралі суспільних заворушень."
 SPR_recovering_from_civil_war_focus_tt:0 "Відкриває доступ до рішень §Y$SPR_recovering_from_civil_war$§!, які дозволяють повернути іспанським областям у власності статус §Yосердної землі§!, якщо вони мають достатньо високий рівень §Yпідпорядкування§!.\n"
 SPR_ship_torpedo_sub_3:0 "6x 533-мм торпедний апарат"
 SPR_soviet_recovery_aid:0 "Радянська допомога у відновленні"
 SPR_the_anti_fascist_crusade_desc:0 "Іспанці билися з фашистами задовго до того, як хтось інший усвідомив небезпеку. Ця боротьба — наша боротьба, і ми не припинимо, доки її не виграємо."
