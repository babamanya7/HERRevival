 SPR_invite_socialist_intellectuals_desc:0 "Наше суспільство буде притулком для всіх інтелектуалів, які поділяють нашу відданість соціалістичній справі. Цих людей потрібно запрошувати звідусіль, щоб їхній геній міг забезпечувати успіхи для всіх нас."
 SPR_juan_garcia_oliver:0 "Хуан Ґарсія Олівер"
