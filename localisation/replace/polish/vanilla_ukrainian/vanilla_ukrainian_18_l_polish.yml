 DIPLOMACY_LEND_LEASE_REASON_TARGET_AT_WAR:0 "Щоб надіслати ленд-ліз, @$TAG$$WHO|H$ мусить бути у стані війни."
 DIPLOMACY_MANAGE_LICENSED_PRODUCTION_EXISTING_ACTION_DESC:0 "Попросити нові ліцензії або скасувати наразі активні."
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_SEND_VOLUNTEERS:0 "\nДержава $COUNTRY|Y$ §Gприйняла§! нашу пропозицію надіслати добровольчі війська для допомоги в їхній війні.\n\nНаші війська йдуть їм на допомогу в боротьбі."
 DIPLOMACY_PEACE_PROPOSAL_YOU_NOT_WAR_LEADER:0 "Ви не є лідером сторони, що програє в цій війні."
 DIPLOMACY_REQUEST_EXPEDITIONARY_NO_UNITS_REQUESTED:0 "Військові частини не вибрані"
 DIPLOMACY_REQUEST_EXP_FORCE_ACTION_DESC:0 "Попросити у держави-маріонетки контроль над рядом дивізій. Оскільки ви маєте сильний вплив на їх уряд, вони обов'язково схвалять запит."
 DIPLOMACY_REQUEST_INTERNATIONAL_MARKET_ACCESS_RIGHTS_REQUEST_DESC:0 "Держава $COUNTRY|UY$ просить доступ до ринку, щоби ми могли купувати та продавати оснащення одне одному."
 DIPLOMACY_REQUEST_LICENSED_PRODUCTION_ACTION_DESC:0 "Попросити ліцензії на виробництво іноземного оснащення для особистого користування."
