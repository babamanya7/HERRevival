 random_general_monarchy_tt:0 "Випадковий [FROM.GetAdjective]ий генерал отримає секретні симпатії монархії."
 rangers_support_desc:0 "Рейнджери-розвідники — це елітні штурмові війська, що спеціалізуються на інфільтрації, розвідці та ближньому бою."
 rangers_tech3:0 "Рейнджери III"
