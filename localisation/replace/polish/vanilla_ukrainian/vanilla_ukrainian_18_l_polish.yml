 IRQ_army_research_bonus_desc:0 "Багато наших військових офіцерів є або колишніми солдатами старої Османської імперії, або пройшли базову підготовку [ENG.GetAdjective] силами. У будь-якому випадку, їхня тактика свідчить про їхній вік і потребує негайного оновлення."
 IRQ_expand_oil_production:0 "Розширити видобуток нафти"
 IRQ_greater_iraq_tag_democratic_ADJ:0 "Іракськ"
 IRQ_kurd_neutrality_party:0 "Барзан"
 IRQ_kurdish_democratic:0 "Курдистанська демократична партія"
 IRQ_kurdish_industry:0 "Розширити промислову базу"
 IRQ_nationalize_the_anglo_iraqi_oil_company_desc:0 "Англо-іракська нафтова компанія продовжує домінувати над нашими економічними та зовнішніми справами, спрямовуючи наше багатство на військові кораблі [ENG.GetAdjective] флоту, що, у свою чергу, заважає нам контролювати власні справи. Настав час покінчити з цим фарсом та націоналізувати компанію на благо нашого власного народу."
 IRQ_political_events.10.t:0 "[FROM.GetNonIdeologyName] відкликає договір"
 IRQ_political_events.13.a:0 "Ще одна перемога для арабського світу."
 IRQ_political_events.22.b:0 "У нас є власний план."
 IRQ_political_events.31.t:0 "[FROM.GetNameDefCap] вимагає контролю над [553.GetName]"
 IRQ_political_events.41.b:0 "Нинішня домовленість нас влаштовує."
 IRQ_political_events.44.desc:0 "The government of [FROM.GetNameDef] has requested that we join them. The time has come to decide whether we will accept this or resist the imposition of foreign control."
 IRQ_political_events.53.a:0 "Чудово!"
 IRQ_purchase_small_ships_desc:0 "Можна домовитися про вигідні умови придбання невеликих військових кораблів та підводних човнів у великих держав, щоб швидко розширити наш флот."
 IRQ_rally_the_arab_world_idea:0 "Об’єднання арабського світу"
 IRQ_recruit_arab_free_legion:0 "Набрати Вільний арабський легіон у §Y[FROM.GetName]§!"
 IRQ_seek_axis_investment_desc:0 "Наша економіка стагнує і потребує диверсифікації, якщо ми хочемо створити стійкість до зовнішньої агресії. Можливо, наші друзі за кордоном будуть готові інвестувати сюди, щоб поглибити наші стосунки."
 IRQ_state_company_for_iron_and_steel:0 "Державна компанія з виробництва заліза та сталі"
 IRQ_take_advantage_of_british_weakness_desc:0 "Якщо ми хочемо витіснити [ENG.GetAdjective] з нашого регіону, ми можемо ніколи не отримати такої хорошої можливості, як зараз, коли вони відволікаються на конфлікти по всьому світу. Давайте завдамо удару, від якого вони ніколи не оговтаються."
 IRQ_unite_maghreb_desc:0 "Магриб — невід'ємна частина ісламського світу, яка надто довго страждала під західним правлінням. З нашою новою силою ми об'єднаємо його під нашим правлінням та виженемо імперіалістів раз і назавжди."
 IRQ_yusuf_salman_yusuf:0 "Юсуф Салман Юсуф"
 ISR_fascism_ADJ:0 "Ізраїльськ"
 ITA_BLITZKRIEG_DESC:0 "Муссоліні, диктатор Італії, здобув певну популярність як миротворець за свою участь у Мюнхенській угоді рік тому. Проте німецька територіальна експансія змусила Італію побачити, що є більше землі, на яку можна претендувати, якщо вдасться досягти порозуміння з німцями.\n\nАлбанію завойовано лише для того, щоби спробувати військовий потенціал Італії, і решті світу слід хвилюватися."
