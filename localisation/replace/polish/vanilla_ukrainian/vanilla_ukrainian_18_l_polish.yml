 XIC_non_agression_pact_with_the_cpc_desc:0 "Щоб довести нашу відданість антияпонській справі, ми повинні спробувати припинити бойові дії на даний момент, навіть якщо самовдоволеного [CHI.GetLeader] це рішення може роздратувати. З часом ми зможемо переконати [CHI.GetAdjective]е керівництво об'єднати зусилля з [PRC.GetNameDef]."
