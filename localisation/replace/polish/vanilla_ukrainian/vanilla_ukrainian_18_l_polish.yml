 GRE_destroyer_1:0 "Клас «Aetos»"
 GRE_destroyer_1_desc:0 "The Aetos-class destroyers were built in Britain and bought for the Hellenic Navy prior to World War I. All four were in service during World War II. They displaced 980 tons and were armed with four 105mm/40 Armstrong P guns and four 533mm torpedo tubes. They were modernized in the late 1920s."
 GRE_destroyer_3_desc:0 "The Adrias class was a class of six British Hunt III-class destroyer escorts, four of which were transferred to the Hellenic Navy in exile in 1942. As destroyer escorts they were slower than a standard destroyer. They displaced 1,050 tons, had four 102mm/45 QF Mk XVI guns as their main armament, and had a strong complement of torpedoes and ASW equipment."
 GRE_eee_in_government_desc:0 "Нам довелось об'єднатись із фашистською партією «Національний союз Греції». Залишається тільки сподіватись, що в майбутньому наслідки цього рішення не зроблять боляче нам самим..."
 GRE_escorts_for_our_bombers:0 "Супровід для наших бомбардувальників"
 GRE_expand_our_tobacco_industry_desc:0 "Немає сумніву, що наша найбільша і найвигідніша частина нашого експорту — це тютюн, який ми продаємо по всьому світу. Країни, з якими ми вже встановили торговельну співпрацю, будуть раді дізнатися, що ми організували все так ретельно, що світ у жодному разі не відчуватиме нестачі в нашому знаменитому тютюні."
 GRE_exploit_errata_in_schachtplan_desc:0 "План Шахта — чергова [FROM.GetAdjective]а кримінальна схема, направлена на розорення бідніших європейських країн. Навряд чи важко вигадати такий сценарій, в якому [FROM.GetAdjective]а держава повинна буде допомогти нам, не накладаючи ніяких додаткових обов'язків."
 GRE_greece_and_turkey_in_the_axis_desc:0 "Тепер, коли підписано і ратифіковано пакт про греко-турецьку дружбу, ми можемо нарешті змінити долю Балкан, отримавши за допомогою німців наше заслужене вічне процвітання! Разом із собою ми візьмемо решту Балканів — якщо доведеться, то й силою..."
 GRE_hellenic_armed_forces:0 "Еллінські збройні сили"
 GRE_hellenoturkism_desc:0 "Грецька націонал-соціалістична партія майже одностайно бажає поглибити наші стосунки з Туреччиною. Ми стільки століть воювали один з одним, проливаючи кров, що ніхто й не подумав про те, скільки ми могли б досягти разом! Заради спільної безпеки обидві країни мають зв'язати себе путами з фашистськими силами! Сподіватимемося, що турки поділяють цю нашу думку..."
 GRE_medium_tank_equipment_1:0 "PKD Távros I"
 GRE_metaxism_7:0 "$GRE_metaxism$"
 GRE_metaxism_desc:0 "Метаксизм просуває нейтралітет у закордонних справах з метою краще розвивати внутрішню політику корпоративізму та націоналізму."
