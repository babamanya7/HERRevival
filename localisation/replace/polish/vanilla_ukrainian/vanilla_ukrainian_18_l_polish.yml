 PRC_great_production_movement_desc:0 "Дефіцит продовольства в [ROOT.GetNameDef], посилений серією стихійних лих, змусив нас заохочувати зміни в громадах, які раніше покладалися на уряд у питаннях харчування. Вони вирушили на раніше непродуктивні землі, щоб створити ферми, і ці зусилля тепер мають бути підтримані нашими військами, які поділяться своїм інженерним досвідом з товаришами."
