 SEA_PRC_political_events.32.a:0 "Це їхня втрата"
 SEA_PRC_request_aid.34.desc:0 "Відповідаючи на наш запит щодо танків БТ-7, [FROM.GetName] погодився виготовити 150 БТ-7 протягом найближчих місяців і надіслати їх нам, коли вони будуть готові. Це займе певний час, але цей захід стане гарним початком для наших прагнень створити сучасні бронетанкові війська."
 SEA_PRC_request_aid.4.c:0 "Ми можемо принаймні допомогти їх виготовити"
 SEA_border_incidents_events.1.t:0 "Наші війська рухаються на Тауран"
