 ace_Erich_Hartmann_desc:0 "§LЕріх Альфред Гартман. Народився 19 квітня 1922 року. Його товариші прозвали його «Bubi». Вважається кращим льотчиком-асом німецького Люфтваффе.§!"
 ace_killed_other_ace.1.d_major:0 "Our latest mission over [From.GetMissionRegion] was a great success for the [From.Owner.GetAdjective] air force in more than one aspect. Reports have come in highlighting [From.GetFullName]'s heroic deed, managing to outwit the [Prev.Owner.GetAdjective] pilot, [Prev.GetName] [Prev.GetSurname], known as [Prev.GetCallsign]. [From.GetCallsign] used [From.GetHerselfHimself] as bait and lured [Prev.GetCallsign] into a trap where the [From.Owner.GetAdjective] pilots were able to dive on [Prev.GetCallsign]'s squadron. [From.GetCallsign] proceeded to outmaneuver the [Prev.Owner.GetAdjective] aircraft and with a single burst sent [Prev.GetCallsign] spiraling from the skies of [From.GetMissionRegion].\n\n[Prev.GetFullName] was a feared pilot with many [From.Owner.GetAdjective] lives on [Prev.GetHerHis] conscience. This is a great victory and shows that when we rally behind great heroes, they perform great deeds."
 add_ruling_to_com_tt:0 "Додає всю підтримку ідеології §Y[ROOT.GetRulingIdeology]§! §Yкомунізму§!."
 advanced_heavy_battery_desc:0 "Поліпшені механізми компенсації віддачі та автоматизована затримка при стрільбі знижують вплив безперервної стрільби на точність, підвищуючи ймовірність вразити ціль.\n\nУстановка модуля §YВажка батарея§! посилює у корабля §Yобстріл з важких знарядь у бою з ворожими §Yосновними кораблями§!."
