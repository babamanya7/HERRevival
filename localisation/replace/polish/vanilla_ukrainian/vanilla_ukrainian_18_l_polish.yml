 SEA_PHI_political_events.14.desc:0 "[USA.GetNameDefCap] оголосили війну [PHI.GetName]. Це сталося після невдачі заспокоїти занепокоєння [USA.GetAdjective]ого уряду щодо ролі [PHI.GetRulingPartyLong]. У публічній заяві [USA.GetLeader] назвав цю війну необхідною для того, щоб зупинити поширення комунізму в Південно-Східній Азії."
 SEA_PHI_political_events.51.a:0 "Його бракуватиме"
 SEA_PHI_political_events.55.a:0 "Раді за них"
 SEA_PHI_political_events.64.desc_quezon:0 "Після захворювання на туберкульоз поступове погіршення здоров'я $PHI_manuel_luis_quezon$ на жаль призвело до його смерті. Віце-президент тимчасово перебрав на себе колишні обов'язки Кесона, поки нація в жалобі, але незабаром настане час визначити наступника."
 SEA_PHI_political_events.67.a:0 "Чудові новини"
 SEA_PRC_faction_events.20.t:0 "[FROM.GetLeader] ставить під сумнів лідерство [?PRC_faction_leader_var.GetName]"
 SEA_PRC_faction_events.41.desc:0 "Схоже, [FROM.GetLeader] вирішив, що [FROM.GetNameDef] краще обійдеться без сили та безпеки, які пропонує [ROOT.GetFactionName]. Можна лише уявити, як вони впораються без нас!"
