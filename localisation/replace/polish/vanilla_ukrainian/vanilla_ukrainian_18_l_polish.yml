 GRE_stalinist_communism_DEF:0 "Союз грецьких радянських республік"
 GRE_the_anatolian_refugees_desc:0 "Після Анатолійської катастрофи нам довелося прийняти майже два мільйони біженців-греків, які проживали в Туреччині. Ми не були готові до такої ситуації, і згодом вона лише стала ще нестерпнішою. Тепер біженців організує до політичної партії Георгіос Космідіс, також біженець з Анатолії. Їхній рух надто великий, щоб його ігнорувати, та й потім, чи так різняться наші цілі?"
 GRE_the_election_of_1936:0 "Грецькі парламентські вибори 1936 року"
 GRE_the_hellenic_army_desc:0 "Маленька, застаріла, але завзята — ось як багато хто описав би грецьку армію, і цей опис недалеко від істини. Нам потрібно лише модернізувати свої тактику та спорядження, і тоді нас боятимуться всі Балкани."
