 YUG_mutual_economic_aid_desc:0 "Радянський Союз і Югославія можуть багато запропонувати одна одній в економічному плані. Уклавши вигідні торговельні угоди та домовленості про економічну допомогу, ми можемо принести велику користь один одному."
