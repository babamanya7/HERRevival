 PRC_approached_the_soviets_opinion:0 "Зближення з Радами"
 PRC_army_reforms_desc:0 "Червона армія застаріла і базується на старій доктрині, яка не виправдовує себе після Великого походу. Ми повинні перебудувати армію з нуля.\n\nНова серія реформ [ROOT.GetLeader] спільно з провідними генералами приведе до створення нової, сильнішої Червоної армії."
