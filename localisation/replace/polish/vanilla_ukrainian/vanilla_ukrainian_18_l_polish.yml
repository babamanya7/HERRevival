 NOR_defend_state_dmod:0 "Оборона області"
 NOR_empower_hirden:0 "Розширення можливостей Гірдена"
 NOR_empower_hirden_desc:0 "Наша власна воєнізована організація, Hirden, була основою планів Nasjonal Samling щодо майбутнього [NOR.GetName]. Зосередження на ній буде життєво важливим для захоплення уряду та боротьби, якщо це необхідно."
 NOR_expand_military_industry:0 "Розширити військову промисловість"
 NOR_extensive_recruitment_desc:0 "Якщо ми хочемо розширити нашу імперію, ми повинні обшукати [NOR.GetAdjective]і землі у пошуках солдатів із духом їхніх скандинавських предків. Риболовля та землеробство є другорядними щодо розширення нашої імперії, тому кожна здатна людина повинна будьте готові взяти зброю проти наших ворогів."
 NOR_fascist_attacker_loc:0 "[?NOR.NOR_cw_fascist_attacker.GetNameDef]"
 NOR_henry_diesen:0 "Генрі Діесен"
 NOR_improved_training_desc:0 "Якщо ми відправимо наших людей на передову без належної підготовки, ми можемо пропустити накази про мобілізацію та натомість видати свідоцтва про смерть.\nСкрипучу програму підготовки новобранців потрібно переглянути, щоб ми могли мати кращі бойові сили, і вивести їх якнайшвидше."
 NOR_mine_laying_effort_desc:0 "Наші кораблі не можуть бути скрізь одночасно, але міни можуть допомогти нам охопити більше води та позбавити ворожих капітанів впевненості в їхній безпеці. Нам потрібні кращі міни, щоб подолати новітні методи уникнення мін і виведення з ладу."
 NOR_mobile_government_decisions_TT:0 "Будуть відкриті рішення: §YПеревести капітал до держави§!."
 NOR_norwegian_carriers:0 "Норвезькі перевізники"
 NOR_reawaken_the_permanent_revolution_desc:0 "Троцький учив нас, що революція не зупиниться, і справді, революція не може зупинитися, поки пролетаріат не сяде за кермо історії. Підіймімо пролетаріат Скандинавії та за її межами!"
 NOT_ENOUGH_MANPOWER_TO_REINFORCE:0 "$FLAG$ $COUNTRY|H$: Недостатньо людських ресурсів, щоби надати підкріплення."
 NSB_poland_communist_events.6.desc:0 "Хоча Східна Польща і брала участь в угоді, за якою [From.GetNameDef] повертається до складу альянсу [Root.GetFactionName], держава зажадала повернення цієї території, пославшись на свою прихильність до міжнародного союзу. народи Західної Білорусі та України десятиліттями жили в Польській державі і відіграли найважливішу роль у селянському страйку, що призвів до зростання соціалізму в Польщі."
 NSB_poland_events.303.desc:0 "[From.GetNameDefCap] висуває нам пропозицію, нібито вигідну для обох сторін. Держава стверджує, що в Акті 5 листопада не була офіційно обумовлена здача оспорюваних Ґданська і Ґдині новоствореному [Root.GetAdjective] укласти союз, але у разі, якщо буде усунено порушення умов, куди погодилася Німеччина."
 NSB_poland_events.6.desc:0 "Восени 1932 року Ліга Націй визнала Польщу єдиним покровителем Ліберії, але рішення не отримало розвитку через втручання Сполучених Штатів. Незважаючи на це, в нашій країні повно поселень і підприємств, керованих Польською Морською та колоніальною лігою. \nУсталений стан справ був вигідним обом націям, але тепер держава [From.GetNameDef], зважаючи на все, нарощує свій вплив, і [From.GetLeader] офіційно пропонує зробити державу [Root.GetNameDef] [From.GetAdjective] протекторатом.\nЯкщо ми приймемо цю пропозицію, ми станемо [From.GetAdjective] підданими з усіма плюсами та мінусами такого статусу, якщо ж ми відмовимося, [From.GetLeader], ймовірно, підкріпить свої домагання силою."
 NSB_poland_monarchist_events.4.a:0 "Зрадники!"
 NSB_poland_royal_election.5.desc:0 "Член королівської сім'ї, Габсбурґ і польський патріот Карл Альбрехт фон Габсбурґ служить у польській армії мало не з часів її заснування. Хоч він і не вроджений поляк, він готовий битися і померти за Польщу, і тому це ідеальний кандидат на трон. Ерцгерцога, мабуть, мало цікавлять високі пости, але, можливо, ми зуміємо переконати його послужити Польщі по-новому — не зброєю, а лідерством."
 NSB_polish_fascist_events.2.a:0 "Оголосити ультиматум."
 NSB_polish_fascist_events.302.a:0 "На жаль."
 NSB_soviet_civil_war_common.100.desc:0 "У державі [FROM.GetNameDef] групи опозиціонерів планують повстання, метою якого стане [FROM.GetLeader]. Їх головний переговорник запропонував передати нам Владивосток після того, як [FROM.GetLeader] буде повалений, — обмін на підтримку у разі громадянської війни."
 NSB_soviet_civil_war_common.101.a:0 "Так ми будемо прикриті з тилу."
 NSB_soviet_civil_war_common.101.desc_exiles:0 "Наші [FROM.GetAdjective] друзі погодилися на наше прохання і підтримають боротьбу з більшовиками потужним експедиційним загоном, коли ми повстанемо. Віддавати їм Владивосток — чимала ціна, але іноді доводиться."
 NSB_soviet_civil_war_common.106.a:0 "Все, що дестабілізує Радянський Союз, нам на руку."
 NSB_soviet_civil_war_common.109.desc:0 "В Росії знову розпочалась громадянська війна. [SOV.GetLeader] веде війну, де його головний противник — [SOS.Getleader]. Якщо повстанці переможуть, ми багато вигадаємо. Ми обіцяли їм підтримку, а  [?ROOT.SOV_foreign_military_advisor_1.GetName] і [?ROOT.SOV_foreign_military_advisor_2.GetName] готові відправитись в державу [SOV.GetName], щоби допомогти там планувати війну і передавати союзникам цінні [SOV.GetAdjective] військові знання."
 NSB_soviet_civil_war_common.110.b:0 "Краще не будемо втручатися."
 NSB_soviet_communist_civil_war.001.b:0 "Смирнов приведе народ до перемоги."
 NSB_soviet_communist_civil_war.010.t:0 "[?SOS.SOV_general_to_desert.GetName] переходить до нас"
 NSB_soviet_fascist_tsarist.12.a:0 "Нам слід підготуватися до війни з нашим давнім суперником..."
 NSB_soviet_fascist_tsarist.19.desc:0 "[FROM.GetAdjectiveCap]ий і [SOV.GetAdjective]ий уряди розпочали переговори про відтворення Троїстого союзу — альянсу, який колись існував між нашими країнами. Тепер вони мають намір втілити цей план і запрошують нас вступити в цей союз."
 NSB_soviet_fascist_tsarist.22.t:0 "Вісь Берлін–Москва"
 NSB_soviet_fascist_tsarist.24.desc:0 "[SOV.GetAdjectiveCap]і дипломати сьогодні повідомили нам, що їхній уряд відхилив нашу пропозицію."
 NSB_soviet_foreign_politics_events.11.a:0 "Так, у цьому є сенс."
 NSB_soviet_foreign_politics_events.251.desc:0 "Схоже, [FROM.GetLeader] дійшов висновку, що війна з державою [JAP.GetNameDef] неминуча і трапиться в найближчому майбутньому. [FROM.GetAdjectiveCap]ий представник у нашій столиці радить нам привести стан бойової готовності та мобілізувати армію в очікуванні [JAP.GetAdjective] нападу."
 NSB_soviet_foreign_politics_events.263.b:0 "Ми не можемо сподіватися на їхню чесність."
 NSB_soviet_foreign_politics_events.266.a:0 "Наші компроміси виправдають себе в майбутньому."
 NSB_soviet_foreign_politics_events.281.a:0 "Ми завжди раді допомогти!"
 NSB_soviet_foreign_politics_events.283.a:0 "Ласкаво просимо до Союзу, товариші."
 NSB_soviet_foreign_politics_events.284.desc:0 "[FROM.GetLeader] передає нам офіційне комюніке, в якому відкидає наші вимоги інтеграції регіону [FROM.GetNameDef] як незалежна радянська соціалістична республіка. Схоже, що [FROM.GetLeader] ні наші великі вкладення у розвиток регіону та допомогу китайським сусідам, і що він, як і раніше, не довіряє державі [ROOT.GetNameDef]."
 NSB_soviet_foreign_politics_events.30.a:0 "Нехай забирають собі цю крижану пустку."
 NSB_soviet_paranoia_system_events.23.a:0 "Потрібно провести ретельне розслідування та виявити винних!"
 NSB_soviet_paranoia_system_events.23.desc:0 "У доповідях з останніх великих навчань йдеться про часті відмови техніки і поранення новобранців через поломки. З цими доповідями ознайомився товариш [Root.GetLeader], і він сильно стурбований можливістю підриву армії зсередини. Як вийшло, що нові танки ламаються, провівши в полі всього кілька днів без обслуговування."
 NSB_soviet_policies_of_collective_security.2.a:0 "Ми будемо боротися разом."
