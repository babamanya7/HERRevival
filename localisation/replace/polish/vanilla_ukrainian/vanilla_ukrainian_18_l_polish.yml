 PER_secularized_state_democratic_idea:0 "$PER_secularized_state_idea$"
 PER_special_forces_program:0 "Програма спеціальних сил"
 PER_ssb_events.1.desc:0 "[SSB_leader.GetLeader] організував зустріч із лідерами всіх держав, що підписали Саадабадський пакт. [SSB_leader.GetLeader] заявляє, що Саадабадський пакт розпочався як простий пакт про ненапад між нашими націями, але став набагато більшим, оскільки наша економічна та військова співпраця зростає дедалі більше. Оскільки наші нації оточені світовими наддержавами з усіх боків, ми безсилі проти них. [SSB_leader.GetLeader] запропонував офіційний альянс між нами, щоб забезпечити повну військову співпрацю та економічну єдність, заявивши, що це необхідно для нашого виживання, оскільки проти цих держав ми приречені на поразку."
 PER_ssb_events.2.t:0 "[FROM.GetNameDefCap] приєднується до Саадабадського альянсу!"
 PER_state_atheism_idea_desc:0 "Наша кінцева мета — наслідувати країни Заходу та привести [PER.GetNameDef] у сучасну еру. Ми більше не можемо дозволити релігійним доктринам стримувати нас. Хоча це може викликати невдоволення серед духовенства нашої нації, заради блага [PER.GetNameDef] ми заохочуємо атеїзм серед наших громадян."
