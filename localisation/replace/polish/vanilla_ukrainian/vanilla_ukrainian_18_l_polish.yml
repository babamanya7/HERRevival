 mod_subdoctrine_mastery_gain_factor:0 "£doctrine_mod $ARG|H$ (піддоктрина) приріст майстерності"
 modern_oil_processing_desc:0 "Ми можемо підвищити ефективність наших нафтопереробних заводів за допомогою нових методів переробки: гідрокрекінґу, алкілювання, окиснення меркаптанів та ізомеризації."
 modern_tank_aa_equipment_desc:0 "Поєднання протиповітряних ракет і скорострільних гармат, сучасна зенітна артилерія становить смертельну загрозу для літаків."
 modifier_experience_gain_battle_cruiser_mission_factor:0 "Приріст досвіду лінійних крейсерів від завдань"
 modifier_production_speed_industrial_complex_factor_desc:0 "Модифікатор швидкості будівництва цивільних заводів."
 modifier_production_speed_land_facility_factor_desc:0 "Модифікатор швидкості будівництва наземних комплексів."
 modifier_production_speed_naval_supply_hub_factor_desc:0 "Модифікатор швидкості будівництва морських центрів постачання."
 modifier_production_speed_nuclear_facility_factor_desc:0 "Модифікатор швидкості будівництва ядерних комплексів."
 modifier_production_speed_radar_station_factor_desc:0 "Модифікатор швидкості будівництва радарних станцій."
 motorized_equipment_0_desc:0 "Під час Великої війни армії почали використовувати прості цивільні вантажівки для перевезення припасів і буксирування озброєння. Відтоді вони стали невід'ємною частиною більшості армій."
 motorized_rocket_unit:0 "Моторизована ракетна артилерія"
 mountaineers_2_reward_3:0 "$mountaineers_combat_2$"
 mtg_britain.1000.t:0 "Помер король Георг VI"
 mtg_britain.104.d:0 "Дискусії з приводу створення імперської федерації зайшли в глухий кут. Хоча [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef] і [NZL.GetNameDef] схвалили цю пропозицію, [RAJ.GetAdjective]ий уряд посилався на фундаментальні культурні відмінності, а також на брак поваги до прав індійської держави. Тепер ми мусимо вирішити, чи створювати федерацію на основі думки погоджених домініонів з тією умовою, що [RAJ.GetNameDef] отримає незалежність, або повністю відкласти це питання."
 mtg_britain.106.d:0 "Держава [From.GetNameDefCap] випустила ультиматум, вимагаючи від нас негайно скоротити кількість основних кораблів згідно з умовами Вашинґтонського морського договору. Вона також заявила, що якщо ми не виконаємо ці умови протягом 60 днів, чисельність нашого може бути скорочена із застосуванням сили."
 mtg_britain.11.a:0 "Вони просто заздрять, що він знайшов кохання."
 mtg_britain.1_tt:0 "Буде розпочато підготовку до весілля.\n"
 mtg_britain.22.a:0 "Хай живе Черчилл!"
 mtg_britain.30.a:0 "Це прийнятно."
 mtg_britain.34.t:0 "Британська громадянська війна закінчилася"
 mtg_britain.41.t:0 "[From.GetName] приймає пропозицію вступити до альянсу"
 mtg_britain.84.d:0 "[From.GetAdjective] представники на конференції натякнули на своє бажання, щоб імперія загалом витрачала більше коштів на переозброєння та оборону. Якщо ми погодимося, то нам доведеться прийняти на себе тягар витрат на самостійне забезпечення своєї безпеки і менше покладатися на [From.GetAdjective] підтримку."
 mtg_britain.97.a:0 "Вони бачать загрозу."
 mtg_germany.2.d:0 "[From.GetAdjective] уряд погодився на наші вимоги і допоможе нам у війні."
 mtg_netherlands.41.t:0 "[From.GetNameDefCap] просить обмінятися військовими знаннями"
 mtg_netherlands.48.a:0 "Яка нерозсудливість..."
 mtg_netherlands.48.t:0 "Принц Бернард подає поганий приклад"
 mtg_netherlands.5.d:0 "Держава [From.GetNameDefCap] погодилася взяти на себе відповідальність за острови Ей-Бі-Сі."
 mtg_news.11.d:0 "Ізоляція Німеччини все зростає..."
 mtg_news.15.desc:0 "Сьогодні опівночі відбулася давно очікувана передача повного суверенітету різним колоніальним народностям Британської імперії. Незважаючи на пропозицію [From.GetAdjective] уряду колишнім підданим приєднатися до альянсу [From.GetFactionName], багато хто. \n\nЦей вчинок викликає змішані почуття в рідній державі, але всіляко вітається соціалістами всього світу."
 mtg_news.18.desc:0 "[From.GetAdjective] уряд оголосив сьогодні про намір «відновити баланс сил у Європі» — якщо потрібно, то й військовими способами. Імперіалізм континентальної Європи «загрожує британській національній безпеці і тому має бути стриманий», заявляє прем'єр-міністр [From.GetLeader].\n\nТочне значення цих слів поки невідоме, але в країні вже оголошено мобілізацію, і, зважаючи на все, там готові до війни."
 mtg_news.30.t:0 "[From.GetName] вживає заходів для забезпечення порядку в домініонах"
 mtg_news.48.c:0 "Це насторожує."
 mtg_news.6.t:0 "У Другій громадянській війні в США перемагають робітники!"
 mtg_news.7.desc:0 "\nПісля кількох місяців кровопролиття Друга громадянська війна в США, яка забрала тисячі життів, закінчилася. [USA.GetLeader] оголосив про закінчення великих бойових операцій. Залишки прихильників повстанського уряду продовжують безнадійний опір, але більшість оточені чи змішалися із громадянським населенням. Як сказав президент [USA.GetLeader], війна явно була наслідком іноземного втручання, спробою дестабілізувати обстановку і розколоти країну. Він пообіцяв, що винних свого часу буде притягнуто до відповідальності."
 mtg_usa_civil_war_democrats.30.desc:0 "Урядам Дакоти, Айови, Міннесоти та Небраски сьогодні ледве вдалося запобігти, мабуть, добре спланованому перевороту, влаштованому лівими елементами за сприяння місцевих правоохоронців і повстанців з Національного комітету. запобігли захопленню кількох губернаторів, але зазнали втрат у ході запеклих сутичок у столицях штатів."
 mtg_usa_civil_war_fascists.1.a:0 "Не можна допустити посилення ситуації."
 mtg_usa_civil_war_fascists.201.b:0 "Включити їх до лав діючої армії."
 mtg_usa_civil_war_fascists.203.t:0 "Повстанці створюють колабораційний уряд на території регіону [USA_state_government_created.GetName]"
 mtg_usa_foreign_support.12.t:0 "Срібний легіон хоче тренувати пілотів"
 mtg_usa_foreign_support.4.c:0 "Надіслати старі танки"
 mtg_usa_foreign_support.5.a:0 "Це буде дуже доречним."
 mtg_usa_secure_asia.5.t:0 "[From.GetLeader] приймає нашу пропозицію."
 mtg_usa_southern_threat.3.t:0 "[MEX.GetLeader] відмовляється."
 murder_trotsky_attack_outcome:0 "Агент зумів зустрітися з Троцьким наодинці і завдав йому сильного удару льодорубом. Троцький не помер на місці, але пізніше помер від отриманої рани в лікарні."
 mutiny_event.6.t:0 "The [Root.GetAdjective] Peace Offer"
 mw_aircraft:0 "M.W. Aircraft"
 naval_blockade_receiver_extended_desc:0 "$COUNTRY2|UY$ піддається морській блокаді з боку держави $COUNTRY1|Y$"
 naval_bomber:0 "Моделі морських бомбардувальників"
 naval_damage_factor_tt:0 " $MODIFIER_NAVAL_DAMAGE_FACTOR$: $RIGHT|+=%1$"
 naval_doctrine:0 "Морська доктрина"
 naval_mines_damage_factor_tt:0 " $MODIFIER_NAVAL_MINES_DAMAGE_FACTOR$: $RIGHT|+=%1$"
 naval_rearmament_focus:0 "Переозброєння флоту"
 naval_strike_tactics_desc:0 "Навчивши пілотів передбачати маршрут кораблів та координувати дії, ми підвищимо ефективність наших нальотів на ворожі кораблі."
 naval_supply_hub_desc:0 "Ця будівля дозволяє вашим флотам поповнювати запаси та заправлятися паливом на цій базі, окрім їхніх баз приписки, що потенційно збільшує радіус дії ваших §Yоперативних груп§!.\nМорський центр постачання можна побудувати лише у прибережній провінції, де розташована морська база не нижче 8-го рівня."
 navy_submarine_detection_factor_tt:0 " $MODIFIERS_SUBMARINE_DETECTION_FACTOR$: $RIGHT|+=%1$"
 nepotism_academy_spirit_tt:0 "§R-50% шанс§!, що нові офіцери будуть завербовані з позитивними рисами."
 nepotism_naval_academy_spirit_tt:0 "Зменшений шанс нових адміралів отримати сприятливі риси особистості."
 news.1.t:0 "Інцидент на мості Марко Поло"
 news.103.d:0 "[195.GetCapitalVictoryPointName], колиска російської революції, здається силам німецької армії. У передмістях ще чутно відлуння стрільби, але над розореним містом повисло тяжке затишшя. Сьогодні вдень німецькі війська пройшли марш повз Ісаакіївського собору, пофарбованого сірою фарбою інженерами [SOV.GetSovietArmyAdjectiveBasedOnIdeology]ої армії з метою маскування від бомбардувальників Люфтваффе. Не дивлячись на всі їхні зусилля, він мерехтить слідами від куль та шрапнели."
 news.104.t:0 "Падіння Києва"
 news.11.b:0 "Вони зробили жахливу помилку."
 news.120.t:0 "Падіння Лос-Анджелеса"
 news.143.d:0 "В останній радіопередачі «Підсумки дня» з Москви було оголошено про те, що Париж відбитий у німецьких загарбників. Повідомляють, що багато захисників міста потонули в Сені, коли під артилерійським обстрілом Червоної армії впали кілька мостів через річку.\n\nЕйфелева вежа нахилилася, пошкоджена вибухом біля основи, але невідомо, яка зі сторін несе за це відповідальність. Нині радянські війська проводять парад на Єлисейських полях, а парижани гадають, чи вони не змінили одних окупантів на інших."
 news.154.d:0 "Пакт про ненапад між Німеччиною та державою [SOV.GetNameDef], який став для багатьох несподіванкою, куди більш очікувано розпався після нападу Радянського Союзу на Німеччину. СРСР завдав першого удару і поклявся раз і назавжди розтрощити німецький Райх.\n\nНімецькі лідери могли і самі планувати напад, але тепер ми про це ніколи не дізнаємося. Зараз вони проводять термінову мобілізацію через військову загрозу."
 news.168.c:0 "Недобре."
 news.183.b:0 "Ми можемо жити з ними, як із ворогами."
 news.206.d_not_communist:0 "Новий комуністичний режим у США прийняв нову доктрину зовнішньої політики [USA.GetAdjective], зайнявши набагато агресивнішу позицію по відношенню як до колишніх союзників, так і до друзів, одночасно зблизившись з членами Комуністичного Інтернаціоналу.\n\nЦя зміна політики включає в себе питання про статус [CAN.GetName] як суб'єктної нації, а також про загальну практику того, що вони називають «всесвітнім британським імперіалізмом».\n\nУ зв'язку зі зростанням напруженості загроза виникнення нового британо-американського конфлікту видається занадто реальною."
 news.210.c:0 "Можливо, настав час захистити наші колонії від японських амбіцій"
 news.211.f:0 "Схоже, що у нас є конфлікт інтересів"
 news.22.d:0 "Італійськими дипломатами було пред'явлено ультиматум на адресу албанського уряду з вимогою підкоритися військовій окупації.\n\n[ALB.GetLeader] зрікся влади, усвідомивши всю марність опору, і Албанія перейшла під керування короля Віктора Еммануїла III.\n\n[ITA.GetNameDef] поглядає на Балкани..."
 news.220.d:0 "Частина радянського вищого командування підняла повстання проти керівництва [SOV.GetLeader]!\n\nНевідомо, що саме викликало це повстання, але не схоже, що це була особливо добре спланована спроба захоплення влади.\n\nПолітична ситуація в [SOV.GetNameDef] може бути не такою, як вони представляють її зовнішньому світу."
 news.243.c:0 "Це чудове партнерство, принаймні зараз."
 news.264.d:0 "Вони не є справжніми комуністами, зрештою."
 news.281.d:0 "$news.280.d$"
 news.290.e:0 "Чи воскресне з попелу імперія?"
 news.294.e:0 "Будемо сподіватися, що конфлікт не пошириться."
 news.30.t:0 "Невдалий замах на життя Гітлера"
 news.302.b:0 "Нехай ідуть!"
 news.312.b:0 "Це не віщує нічого доброго..."
 news.313.a:0 "Ми тримаємось разом"
 news.331.a:0 "Нейтралітет не врятував Данію."
 news.331.t:0 "Ісландія бере контроль над зовнішньою політикою"
 news.38.b:0 "От мерзотник!"
 news.400.desc:0 "Звіти з міста [43.GetCapitalVictoryPointName] підтверджують, що [HUN.GetAdjective]а столиця була захоплена наступаючими [FROM.GetAdjective]ими військами.\n\nЗ деяких укріплень на березі Дунаю все ще чути вогонь зі стрілецької зброї, але жодних значних [HUN.GetAdjective]их сил у межах міста не помічено.\n\nБільшість великих мостів через річку, за наявними даними, зруйновано, а кілька з них перейшли під контроль держави [FROM.GetNameDef].\nУперше за багато років на площі Кошута тихо, а Будинський замок перебуває в чужих руках."
 news.55.a:0 "Тепер події розвиваються швидко."
 news.55.e:0 "Тепер німці не наважаться атакувати!"
 news.63.t:0 "Громадянська війна в Іспанії"
 news.64.t:0 "Кінець громадянської війни в Іспанії"
 news.66.a:0 "Ігри закінчилися."
 news.9.d:0 "Під час накопичення японських військ у Маньчжурії Радянський Союз несподівано відвів свої частини, розташовані на кордоні. Можливо, таким чином Москва намагається уникнути нової конфронтації з Токіо, адже одним із найболючіших спогадів для росіян є поразка в російсько-японській війні."
 north_american_aviation:0 "North American Aviation"
 nsb_coup.2.t:0 "Спроба перевороту не вдалася"
 nsb_news.304.b:0 "Так, а де це взагалі?"
 nsb_news.304.t:0 "Ідель-Уральська держава повернулася"
 nsb_news.402.c:0 "Вони створюють новий світовий порядок?"
 nsb_news.6.b:0 "Який жах."
 nsb_news.7.b:0 "Цікаво."
 nsb_news.7.desc:0 "Сталося щось незвичайне: тепер і [From.GetNameDef], і [POL.GetNameDef] знаходяться під владою однієї людини — ними править [POL.GetLeader]. Хоча поки що це дві різні нації, спільний глава держави означає, що вони нерозривно пов'язані дипломатично.\n\nЙмовірно, ця особиста унія скоро переросте в об'єднання [FROM.GetAdjective]ої та [POL.GetAdjective]ої держав, але поки що вона залишається суто дипломатичною."
 occupy_philippines:0 "Окупувати Філіппіни"
 ocean:0 "Океан"
 oligarchism_desc:0 "Олігархія — це форма уряду, в якій абсолютна влада належить невеликій групі людей."
 operation_boost_resistance_desc:0 "§LПартизанам на окупованій ворогом території дуже потрібна підтримка, щоб продовжувати бої. Вони відволікають на себе велику кількість ворожих військ і можуть виявитися дуже корисним вкладенням.§!"
 operation_felix_desc:0 "Операції Союзників у Середземному морі необхідно припинити, перекривши Ґібралтарську протоку, але покладатися на це на іспанців не варто. Ми мусимо самі перейти через Піренеї і зайняти Іспанію з Португалією. Тільки там ми зможемо забезпечити безпеку нашого південно-західного флангу."
 operation_gertrude:0 "Операція «Ґертруда»"
 operation_infiltrate_armed_forces_army_desc:0 "§LУ [From.GetAdjective]ій армії є люди, яких можна схилити до передачі нам додаткової інформації та підтримки в майбутніх операціях.§!"
 operation_warsaw_uprising:0 "Варшавське повстання"
 operative_commando_desc:0 "Цей агент пройшов курси підготовки командос."
 ott_restore_the_vilayet_of_beirut:0 "Відновити вілаєт Бейрут"
 pan_american_highway_connections:0 "Сполучення Панамериканським шосе"
 panay_incident.3.d:0 "У відповідь на потоплення канонерського човна США USS Panay внаслідок бомбардування раніше цього тижня держава [USA.GetNameDef] вимагає вибачень, покарань причетних до інциденту офіцерів та компенсації. Наш уряд не віддавав наказу про атаку, і не зовсім ясно, чи була вона проведена помилково нашими не в міру старанними пілотами, чи це взагалі спроба деяких жорстко налаштованих військових змусити держави [USA.GetNameDef] та [ENG.GetName] вивести свої загони з території держави [CHI.GetName] Деякі представники уряду не бажають, щоби ми поступалися [USA.GetAdjective] вимогам, але відмова може означати війну."
 paradisus_paradoxum_tt:0 "Граючи як [JAP.GetNonIdeologyName], оголосіть про створення Чистої Буддійської Землі"
 paras_bonus_1_desc:0 "Навіть найліпша висадка може піти не так. Ми мусимо забезпечити, щоби наші війська були добре навчені імпровізованій навігації."
 paratrooper_desc:0 "Використовуючи повітрянодесантні війська, ми можемо вторгатися в раніше недоступні райони і розміщувати там ключові сили, що відкриває нові тактичні можливості."
 paratroopers3:0 "Повітряний десант III"
