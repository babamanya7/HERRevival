 HUN_STATE_73:0 "Карпатолйо"
 HUN_activated_huba_ii_flag:0 "Програма Хуба II приведена в дію"
 HUN_anti_tank_equipment_1:0 "40M 40 mm"
 HUN_armored_warfare_desc:0 "Для повної ефективності нашим моторизованим дивізіям потрібна підтримка бронетехніки. Ми мусимо надіслати наші ресурси на розробку нових проєктів."
 HUN_assault_gun_focus_desc:0 "Замість розробки повноцінних танків ми можемо зробити ставку на дешевші штурмові знаряддя, які допоможуть нашій піхоті проривати межі оборони."
 HUN_balkan_pact_category_desc:0 "Можливо, у минулому між нами були великі розбіжності, але зараз, коли навколо все більше загроз, балканським державам настав час об’єднатися й виступити як одне ціле. Якщо нам судилося вмерти, то лише разом!"
 HUN_bela_kun:0 "Бела Кун"
 HUN_call_in_hungary:0 "Звернутися до Угорщини за підтримкою"
 HUN_cas_focus_desc:0 "Сучасна армія потребує підтримки не тільки на землі, а й у повітрі."
 HUN_claim_the_bucovina_desc:0 "Нехай це і не найважливіша земля, але вона є частиною нашої держави, і ми повернемо її собі."
 HUN_created_austrian_monarchy:0 "Член Габсбурзької династії керує Австрією"
