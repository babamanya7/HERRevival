 germany.100.d:0 "Території, які Болгарія вважала своїми, була передана Греції внаслідок Другої балканської війни та Великої війни. Якщо ми це виправимо, Болгарія стане на наш бік. Однак, якщо їм не вистачає сил, щоб висловити претензії самим, чи є вони достойним союзником для нас?"
 germany.102.d:0 "Греція вчинила нерозумно, відмовившись від нашої допомоги у вирішенні їхніх територіальних конфліктів."
 germany.105.t:0 "Італія покидає альянс [Root.GetFactionName]"
 germany.1050.desc:0 "Фюрера, $GER_adolf_hitler$, було знайдено мертвим у його бункері. Із наближенням ворожих сил, схоже, Фюрер вирішив накласти на себе руки, аби уникнути полону. Щоб не допустити деморалізації військ, нашим пропагандистським каналам доручено повідомляти, що Гітлер загинув героїчно в бою, до останнього подиху борючись із переважаючими силами ворога. Проте наше першочергове питання зараз — хто замінить Фюрера?"
 germany.106.t:0 "Крайовський договір"
 germany.109.d:0 "Дирижабль «Гінденбурґ», що бездіяльно знаходився в Німеччині від початку війни, зустрів свій драматичний кінець, вибухнувши над Шотландією. Схоже, ним керував заступник фюрера Рудольф Гесс. Він зміг сам перелетіти Північне море з метою виконання особистої місії: обговорити можливий мир із Британією.\nБританські радари без проблем знайшли масивне повітряне судно, і кілька авіакрил Королівських повітряних сил вмить відправилися назустріч. Коли «Гінденбурґ» не відповів на радіоповідомлення, вони відкрили вогонь.\n\nГесс успішно стрибнув з парашутом, був заарештований і тепер знаходиться в лондонському Тауері."
 germany.128.t:0 "Антирадянський пакт"
 germany.201.b:0 "Ні, зараз ще не час для цього."
 germany.25.d:0 "Погіршення відносин із Китаєм зробило політично нездійсненним підтримання військової місії в їхній державі. Александер фон Фалькенгаузен та інші радники були відкликані."
 germany.46.d:0 "Вимоги німців про передачу нашої Судетської області стали більш ворожими, і тепер їхні війська збираються на нашому кордоні! Зараз у Мюнхені проводиться конференція з обговоренням майбутнього Чехословаччини, куди нас, щоправда, не запросили.\n\nЯк британці, так і французи відмовилися від своїх обіцянок про підтримку у випадку німецької агресії. Їхні дипломати чітко вказали, що якщо ми вирішимо протистояти німцям, нам доведеться робити це самим. Схоже, в нас немає іншого вибору, окрім як здати Судети..."
 germany.52.a:0 "Заолшя наше!"
 germany.65.a:0 "Не можна поступатися! Райх треба захистити!"
 germany.94.t:0 "Лондон здався"
 germany_formable_category_desc:0 "Ідея єдиного німецького народу була в головах наших громадян уже давно. Тепер, коли ми нещодавно завоювали німецькі території, настав час знову проголосити возз’єднання німців!"
 goal_construction1_desc:0 "Сучасна війна вимагає розвиненої економіки, що постачає армії зброю, літаки, кораблі та танки."
