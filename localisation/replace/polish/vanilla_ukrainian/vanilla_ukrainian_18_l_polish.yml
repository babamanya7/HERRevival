 FIN_motion_of_no_confidence_against_leader_desc:0 "[ROOT.GetLeader] не зробив достатньо для вирішення проблем, з якими стикається наша країна, і очевидно, що цей факт не зміниться. Настав час провести вотум недовіри, щоб усунути цього некомпетентного лідера."
 FIN_national_fanatism_desc:0 "Суспільство має бути повністю пройняте фанатизмом і відданістю справі [FIN.GetAdjective]ої переваги. Ми неодноразово доводили, що ніхто не може зупинити нас і що коли ми працюємо разом, ніщо не може зупинити підйом нашої нації до величі."
 FIN_personal_agenda_tanner_tt:0 "§G$FIN_bop_modifier_united_nation$§!: Контроль над §YКар'ялою§! та кожною областю у власності разом із більш ніж §Y95%§! підтримки демократії збільшить £GFX_power_balance_texticon §Yдовіру громадськості§!.\n  - §R$FIN_bop_modifier_concerning_support_for_extremists$§!: Більш ніж §Y9%§! підтримки фашизму або комунізму зменшить £GFX_power_balance_texticon §Yдовіру громадськості§!.\n  - $losing_soverignty_threatened_tt$"
