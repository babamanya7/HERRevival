 URG_accion_revisionista_del_uruguay_desc:0 "Адольфо Агоріо — одна з головних фігур уругвайського фашизму. Його та його однодумців вплив міг би стати плацдармом для більшого руху, який охопить [URG.GetName]. Ми запросимо їх до уряду та надамо їм належної легітимності."
 URG_allow_nazi_movements_among_german_uruguayan:0 "[GER.GetAdjectiveCap]о-[URG.GetAdjective]і нацистські рухи"
 URG_americanism_desc:0 "Нам потрібно забезпечити, щоб наш фокус як країни був на цінностях Південної Америки та захищати їх у зовнішніх справах."
 URG_anticentralism_desc:0 "Зрозуміло, що зусилля з централізації країни навколо Монтевідео не є доцільними. Краще підтримувати цінності сільського класу там, де вони є, та міського населення там, де вони є, щоб усі могли процвітати разом."
 URG_arnulf_fuhrmann:0 "Арнульф Фурман"
 URG_colorado_victory_desc:0 "Ніколи не було сумнівів, що «Колорадо» продовжуватиме правити [URG.GetName]."
