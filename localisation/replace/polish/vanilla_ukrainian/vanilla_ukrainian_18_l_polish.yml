 MUN_czech.1026.non_aggression:0 "Незважаючи на запевнення у своїх мирних намірах, [FROM.GetAdjective]і дипломати відмовилися підписати з нашою країною пакт про ненапад; чому так сталося — залишається лише здогадуватися."
