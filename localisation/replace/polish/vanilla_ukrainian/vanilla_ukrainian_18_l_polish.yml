 USA_congress_invest_in_state_infrastructure_tt:0 "У штаті [USA_congress_investment_state.GetName] було збудовано додатковий рівень інфраструктури"
 USA_decolonisation:0 "Деколонізація"
 USA_execute_war_plan_black:0 "Виконати воєнний план «Чорний»"
 USA_guarantee_the_american_dream_desc:0 "Більшості наших громадян для щастя потрібні лише стабільна робота, міцне здоров'я та місце для створення сім'ї. Чому б не забезпечити людей усім цим?"
