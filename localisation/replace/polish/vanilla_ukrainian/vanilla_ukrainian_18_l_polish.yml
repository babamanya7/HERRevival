 tfv_australia.1.t:0 "[From.GetAdjective]а пропозиція щодо Сінґапурської стратегії"
 tfv_australia.11.a:0 "[Root.GetNameDefCap] will do what she must."
 tfv_australia.31.d:0 "Дотримуючись нашої нещодавньої політики дистанціювання від Імперії, має сенс лише для країни, яка є домінуючою в нашій власній сфері, займати позицію лідера, а не послідовника.\nМи зберемо інші регіональні сили для нашої справи, і гарантувати, що наші взаємні інтереси захищаються на світовій арені.\n\nБільше не в рабстві перед колоніальними державами Європи, ми забезпечимо новий, більш справедливий баланс сил."
 tfv_australia.60.d:0 "Посилаючися на права всіх працівників на свободу та самовизначення, [From.GetAdjective]ий уряд вимагає, щоб [Root.GetAdjective]а держава поступилася хвилі «океанічного соціалізму», що захлинула наш регіон.\n\nНезалежно від того, чи це входить в інтереси народу держави [Root.GetNameDef], загроза з боку [From.GetNameDef] реальна, і немає жодних сумнівів, що вони, ймовірно, висуватимуть свої вимоги всіма доступними для них засобами..."
 tfv_australia.92.b:0 "$tfv_australia.90.b$"
 tfv_canada.40.d:0 "Хоча сила нещодавно реформованої [Root.GetAdjective]ої держави не викликає сумнівів, реалії регіональної політики також не є беззаперечними. Наш старий ворог, [USA.GetNameDef], домінує на континенті, і виявився нездатним втручатися у справи за межами своїх кордонів.\nЦе робить пропозицію про співпрацю з державою [From.GetNameDef] ще більш цінною. Будь-якій із наших країн може не вистачити сил, щоби самостійно запобігти [USA.GetAdjective]ому втручанню, але проти півночі та півдня [USA.GetLeader] буде змушений двічі подумати, перш ніж діяти.\n\nІ, можливо, [USA.GetNameDef] будуть більш прихильними до повернення території, що по праву належить [Root.GetAdjective]ому народу..."
 tfv_canada.41.t:0 "Мексика погоджується"
 tfv_new_zealand.6.t:0 "Японія відхиляє альянс"
 tfv_new_zealand.91.t:0 "[From.GetNameDefCap] погоджується!"
 tfv_raj.31.a:0 "Тоді вони не лишають нам вибору. Ми мусимо дати їм піти."
 tfv_raj.32.desc_SOV_helps_ENG_reject:0 "Наші надії на легкий шлях до незалежності були жорстоко розбиті британським колоніальним відомством. Коли [SOV.GetAdjective]ий посол звернувся до них із проханням дозволити нам самим визначати свою долю, йому швидко відповіли, що немає про що говорити. [ENG.GetAdjectiveCap]ий уряд стверджує, що питання нашої незалежності є внутрішньою справою, в яку не може втручатися жодна іноземна держава."
 tfv_south_africa.13.a:0 "Зв'яжіться з нашими нідерландськими друзями."
 tfv_south_africa.13.b:0 "Ми впораємося самі або вмремо, намагаючися."
