 NZL_project_seal:0 "Проєкт «Seal»"
 NZL_restart_the_onekaka_ironworks_desc:0 "Металургійний завод Онекака колись уособлював наші амбіції щодо вітчизняного виробництва чавуну та сталі, зменшуючи залежність від закордонних поставок. Щоб дати поштовх економіці та підвищити національну безпеку, виник інтерес знову запустити печі Онекаки."
