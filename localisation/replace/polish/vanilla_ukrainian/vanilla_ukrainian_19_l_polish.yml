 ROM_heavy_fighter_equipment_1_short:0 "IAR 214"
 ROM_heavy_interceptors_desc:0 "Наша країна не може втримувати великі ВПС. Ми мусимо сконцентрувати якомога більше вогневої моці в кожному літаку, щоби знищити будь-якого нападника."
 ROM_join_axis:0 "Приєднатися до Осі"
 ROM_light_tank_equipment_3:0 "T-41"
 ROM_medium_bombers_desc:0 "Минула епоха, коли армії могли вигравати війни, не дивлячись на небо. Ми повинні розробити наші тактичні бомбардувальники, щоби забезпечити нашим солдатам необхідну підтримку з повітря."
 ROM_mio_trait_coastal_defense_production:0 "Збірка берегової оборони"
 ROM_nicolae_sova:0 "Ніколае Сова"
 ROM_petre_dumitrescu:0 "Петре Думітреску"
 ROM_submarine_1_desc:0 "The Delfinul was a Romanian submarine built in Italy for the Romanian Navy. It was launched in 1930 and the ship displaced 650 tons and was armed with six 533mm torpedo tubes."
 ROM_vanatori_de_munte:0 "Vanatori de munte"
