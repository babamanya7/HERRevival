 BORDER_WAR_NOT_OURS:0 "§HУ цій області точиться прикордонний конфлікт§!"
 BOS_fascism:0 "Оборонний союз Боснії та Герцеґовини"
 BRA_aid_operation_bolivar:0 "Операція «Болівар»"
 BRA_bonus_tech_slot_desc:0 "Хоча наша промисловість та військові сили значно розширилися в останні роки, стає все важче підтримувати технологічний паритет із нашими іноземними супротивниками. Щоб протистояти цьому, ми створимо національний фонд для інвестування в нові технології."
 BRA_brazil_integral_desc:0 "До цього моменту ми йшли роками, але ми нарешті зміцнили нашу владу над нацією і позбулися останніх залишків старої, застарілої республіканської форми правління."
 BRA_cangaceiro_state_desc:0 "Колись на північному сході Бразилії існував вакуум влади, який призвів до появи бандитів, відомих під назвою канґасу. Ці бандити залякували регіон десятиліттями й часто отримують підтримку від співчуваючих їм місцевих жителів. Ми мусимо щось зробити з їхніми безперервними грабунками та вбивствами, допоки повністю не втратили контроль над регіоном."
 BRA_centralize_development_tt:0 "Нова столиця буде названа §Y'$BRA_new_capital$'§!"
 BRA_commonwealth_tech_sharing_name:0 "Угода про технологічний обмін між країнами португаломовної Співдружності"
 BRA_court_the_military:0 "Звернутися до військового істеблішменту"
 BRA_deal_with_the_cangaceiro_desc:0 "Канґасу — це не більше ніж бандити, які довгий час були нашою проблемою. Настав час раз і назавжди усунути цю проблему з півночі."
 BRA_depose_vargas:0 "Усунути [ROOT.GetLeader]"
 BRA_disrupt_operation_bolivar:0 "Зірвати операцію «Болівар»"
 BRA_establish_the_brazilian_investment_bank:0 "Податкова політика, що сприяє бізнесу"
 BRA_estado_novo_dummy_idea:0 "$BRA_estado_novo_modifier$"
 BRA_fnm_organization:0 "Fábrica Nacional de Motores"
 BRA_free_prestes_desc:0 "$BRA_luis_carlos_prestes$ був на передовій радикальної [ROOT.GetAdjective] політики протягом кількох років. Однак після провалу першої Intentona Comunista його заарештували разом з керівництвом руху. Якщо ми хочемо мати хоч якусь надію на перемогу, ми повинні звільнити наших лідерів із лап $BRA_getulio_vargas$."
 BRA_henry_ford:0 "Генрі Форд"
 BRA_implement_a_national_guard_tt:0 "Створює шаблон дивізії, відомий як §YGuarda Nacional§!, та набирає §Y6 одиниць§! у місті §Y[ROOT.Capital.GetCapitalVictoryPointName]§!."
 BRA_in_vargas_we_trust_desc:0 "$BRA_getulio_vargas$ зарекомендував себе як здібний політик, який може витримати труднощі лідерства. Крім того, він показав себе мудрим лідером, прийнявши політику нашої партії. Багато хто в партії зараз вірить, що йому судилося підняти націю до ще більших висот."
 BRA_infilitrate_the_military_tt:0 "Більша частка §Yвійськових§! приєднається до комуністів під час майбутньої §Rгромадянської війни§!, якщо цей фокус буде обрано."
 BRA_invite_company_in_progress:0 "Перебуває у процесі запрошення компанії до держави [ROOT.GetName]"
 BRA_ismael_motta_paes:0 "Ісмаел Мотта Паїс"
 BRA_mechanized_equipment_3_short:0 "M5 Half-Track"
 BRA_navy_reward:0 "Нагородження флоту за лояльність"
 BRA_organization_of_american_unity_desc:0 "Наша внутрішня політика була успішною в останні роки, тепер настав час звернути нашу увагу на зовнішні справи та сприяння співпраці по всій півкулі через Організацію американської єдності."
 BRA_provisional_government:0 "Тимчасовий уряд"
 BRA_radicalized_proletariat_desc:0 "Комуністичні ідеї вкоренилися серед [BRA.GetAdjective]ого робітничого класу. Ми балансуємо на тонкій грані між тим, щоби догодити їм і не викликати невдоволення військових."
 BRA_reclaim_territory_in_south_america:0 "Цисплатинський реваншизм"
 BRA_secure_our_borders_desc:0 "Нас оточують вороги за межами наших кордонів, які прагнуть ізолювати та знищити нашу велику державу. Коли внутрішня ситуація під контролем, настав час звернути увагу на зовнішню політику і почати робити маневри для забезпечення нашої національної безпеки."
 BRA_sway_the_neighbors:0 "Схилити сусідів"
 BRA_tribunal_de_seguranca_nacional_desc:0 "Хоча Альянс національного визволення не зміг повалити наш уряд, його члени продовжують ходити вулицями, готуючи змови та вербуючи людей для чергової можливості підірвати державу. Такі злочинці будуть судимі та засуджені більш ефективно зі створенням військових судів на час дії надзвичайного стану."
 BRA_undermine_democracy_desc:0 "Наші найвпливовіші прихильники не задоволені цим компромісом конституційної монархії. Вони стають нетерплячими і хочуть побачити, як монарх використає свій новознайдений вплив, щоб відкинути Національний Конгрес, призначивши нову Раду Міністрів."
 BRA_wealth_redistribution_key:0 "Перерозподіл багатства"
