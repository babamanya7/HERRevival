 PAR_join_the_axis_desc:0 "Очевидно, що наші ідеологічні союзники — це [GER.GetAdjective] та їхні союзники. Ми приєднаємося до Осі та будемо насолоджуватися цим новим світовим порядком."
 PAR_military_pensions_desc:0 "Старий уряд відмовлявся виплачувати військові пенсії ветеранам Чакської війни. Ми не допустимо тієї ж помилки."
 PAR_navy_modifier:0 "$SMB_navy_PAR$"
 PAR_pull_back_troops_from_the_chaco_desc:0 "Війська, розташовані в Чако, мають бути відведені, щоб не загострювати напругу з [BOL.GetName], незважаючи на те, що кажуть військові."
 PAR_purge_the_military_of_dissent_desc:0 "Естігаррібія погодився викорінити будь-яке залишкові незгоди в армії та усунути зв'язки з революцією Франко."
 PAR_to_cross_a_river_desc:0 "Річка Парагвай є головною перешкодою для нас і природно запобігає більшості переправ. Ми повинні звернутися до військово-досвідченої держави з потужним корпусом морської піхоти, щоб вона допомогла нам у цьому починанні."
 PASSWORDS_DONT_MATCH:0 "§RПаролі не збігаються§!"
