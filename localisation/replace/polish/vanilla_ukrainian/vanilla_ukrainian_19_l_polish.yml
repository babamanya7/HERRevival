 CHI_control_yuan_desc:0 "Корупція неминуча за будь-якого ладу, і для ефективної роботи держави її необхідно стримувати. Для цього ми створимо окрему гілку уряду, незалежну від законодавчої, виконавчої та судової."
 CHI_cooperation_with_the_nationalists_effect_tooltip:0 "[WTT_communist_china.GetNameDefCap] і воєначальники, які стали на бік комуністів, зможуть починати §Hприкордонні конфлікти§! з нами у відповідь на це."
 CHI_dai_lis_peoples_state_fascism_ADJ:0 "Китайськ"
 CHI_delivery_tt:0 ", що будуть доставлятися щомісяця."
 CHI_elite_mountaineers_desc:0 "Бої на високогір'ї завжди значно відрізняються від битв на рівнинах. Потрібно підготувати спеціалізовані підрозділи, які здатні користуватися перевагами рельєфу місцевості."
 CHI_expand_national_sun_yat_sen_university_desc:0 "Тепер, коли економіка здатна фінансово підтримувати вищу освіту для нашого населення, настав час для китайського народу широко вчитися, точно запитувати, ретельно обмірковувати, чітко розрізняти та щиро практикувати. Лише завдяки цим принципам, викладеним доктором Сунь Ятсеном, наша нація зможе стати лідером у дослідженнях і розробках."
 CHI_expand_the_airlift:0 "Збільште підйом повітря над горбом"
 CHI_extend_jurisdiction_to_the_provinces_desc:0 "[ROOT.GetRulingParty] добре впоралися з узяттям під контроль великих міст і центральних установ, але ми могли б діяти краще на периферії. Розширення нашої влади значно допоможе об'єднати Китай і стримати [JAP.GetAdjective]ий натиск."
 CHI_form_saco:0 "Сформувати SACO"
