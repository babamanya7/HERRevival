 form_north_sea_category_desc:0 "Оскільки все Королівство Кнута Великого перебуває під нашим правлінням, настав час відновити старий Данелакон і відродити дух Імперії Північного моря. Хвилі знову стануть нашим пануванням, і ми будемо правити, як вважаємо за потрібне."
