 landmark_big_ben_desc:0 "Вестмінстерська годинникова вежа, більш відома як Біґ-Бен, є британською культурною іконою. Це один із найвидатніших символів Сполученого Королівства та парламентської демократії. Спочатку її було завершено в 1859 році в стилі неоготики, і є третьою за висотою вежею у Великій Британії."
