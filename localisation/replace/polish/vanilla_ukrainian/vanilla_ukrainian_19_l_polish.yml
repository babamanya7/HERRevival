 FIN_finnish_army_desc:0 "Будучи продуктом своєї гідної та волелюбної спадщини, фінська армія, загартована роками боротьби з зовнішньою агресією, представляє собою грізну силу. Фінські солдати рішуче налаштовані захищати свою батьківщину; вони — вмілі стрільці та досвідчені воїни, готові протистояти найстрашнішим супротивникам. Попри обмежені ресурси, фінська армія передає дух неполегливості та непохитності, який буде непросто зламати."
