 VIC_celebrate_motherhood_desc:0 "Зрозуміло, що місце жінки — у господарстві, так само, як місце чоловіка — бути на верстаку чи в полі. Нашим людям треба нагадати, що жіноча праця так само важлива для виживання нації, як і чоловіча."
 VIC_heavy_cruiser_3:0 "Клас «Saint Louis»"
 VIC_prosecute_the_losers_desc:0 "Франція роками боролася проти армій кайзера, але втручалася в нинішню війну. Для цього має бути причина, і ми мусимо не зупинятися, поки це не буде виявлено, а винні люди не будуть притягнуті до відповідальності."
