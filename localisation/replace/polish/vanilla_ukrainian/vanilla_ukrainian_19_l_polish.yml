 AUS_anscluss_process_has_begun:0 "§R[GER.GetNameWithFlag] розпочав процес аншлюсу. Ми більше не здатні його зупинити!§!"
 AUS_arm_border_guards_decision:0 "Спорядити гвардію на [FROM.OWNER.GetAdjective]ому кордоні"
 AUS_army_is_landwehr:0 " Landwehr"
 AUS_austromarxism_focus_desc:0 "Започаткована групою Віктора Адлера, Отто Бауера, Карла Реннера, Макса Адлера та Рудольфа Гільфердінга, концепція австромарксизму, за якою ми йшли досить довго. Народжений їхніми різними поглядами, його прагнення — показати золоту середину між соціал-демократією та комунізмом. Це дозволило отримати набагато більшу підтримку з боку людей, ніж будь-яка із цих двох ідеологій поодинці."
 AUS_austrotrotskyism_set_to_intro_tt:0 "Змінити вказану величину §YАвстротроцькізм§! на:"
 AUS_communism_party_long:0 "Комуністична партія Австрії"
 AUS_continue_old_production_tt:0 "Якщо технологія §YРанній корпус важкого корабоя§! ще не досліджена, відмикає її."
 AUS_danubian_communism_category_desc:0 "Ми бачимо, як швидко наш народ знову почав процвітати під нещодавно призначеним комуністичним урядом. Чого не скажеш про наші сусідні країни. Ми не бачимо чогось, що зупиняло б нас від переконання робітників цих країн, що зміни до кращого — можливі, і що ми підтримаємо їх, якщо вони захочуть цього досягти."
 AUS_democratic_christlichsoziale_partei_long:0 "Християнсько-соціальна партія"
 AUS_economic_boom_desc:0 "Наполегливою працею та великими зусиллями Австрія перетворила економічну катастрофу на економіку, яка здатна швидко розвиватися."
 AUS_empowering_the_chancellor:0 "Надання повноважень канцлеру"
 AUS_extend_the_traun_line_available_tt:0 "Хоча б одна провінція в регіоні §Y[153.GetName]§! на кордоні з державою §Y[GER.GetNameWithFlag]§! має місце для будівництва §YТрьох§! або більше §YНаземних укріплень§!"
 AUS_fascism_vaterlandische_front:0 "ВФ"
 AUS_form_evidenzburo:0 "Реформувати Evidenzbureau"
 AUS_generic_communist_revolutionary:0 "Франц Корічонер"
 AUS_heinrich_maier:0 "Гайнрих Маєр"
 AUS_infantry_equipment_3_short:0 "Steyr MG30"
 AUS_lothar_rendulic:0 "Д-р Лотар Рендуліч"
 AUS_militarization_effort:0 "Grazer Maschinen-und Waggonbau"
 AUS_militia_support_2:0 "Підтримка ополчення"
 AUS_news_events.1.a:0 "Від щирого серця побажаємо Австрії успіху..."
 AUS_paul_eisler:0 "Пауль Айслер"
 AUS_political_events.108.t:0 "[FROM.GetNameDefCap] проводить військові навчання на нашому кордоні"
 AUS_political_events.119.b:0 "Ми не можемо цього допустити!"
 AUS_political_events.22.t:0 "[FROM.GetNameDefCap] підтримує нашу незалежність дипломатично"
 AUS_political_events.35.b:0 "Людям слід звикнути"
 AUS_political_events.36.desc:0 "Наш шлях назад із серйозно покаліченої другорядної влади був довгим і важким. Озираючись на те, з чого ми почали, стає ясно, що ця подорож була варта того. Відроджені та навіть сильніші, ніж раніше, настав час для нас вирішити, чого слід чекати від нашого майбутнього. Яким ми хочемо його бачити... і ким ми хочемо, щоб світ бачив нас?"
 AUS_political_events.36.t:0 "Майбутнє Австрії"
 AUS_political_events.60.b:0 "Це ще одна причина, чому Альфреду Янси ліпше залишитися!"
 AUS_political_events.79.a_tt:0 "Якщо почнеться війна, [FROM.GetFlag]§Y[FROM.GetNameDef]§! більш імовірно, що надішле нам добровольців і позичить нам обладнання (з умовою, що там сидить ШІ)."
 AUS_political_events.81.b:0 "Вони стануть найціннішими союзниками... але не зараз."
 AUS_political_events.87.a:0 "У нас нема вибору."
 AUS_political_events.88.desc:0 "Наші невтомні зусилля підтримати [FROM.GetAdjective]их працівників нарешті окупилися. Робітники радіють, адже новий народний лідер, [FROM.GetLeader], бере на себе керівництво країною."
 AUS_political_events.9.t:0 "Вільгельма Ценера вбито"
 AUS_political_events.91.desc:0 "Останнім часом ми спостерігаємо, як наш ерцгерцог, Його Величність [ROOT.GetLeader], безперервно обмірковує ситуацію на фронті. Він висловлює почуття неадекватності та бажання керувати своїми людьми більш безпосередньо. Сьогодні це питання було висунуто знову, наш ерцгерцог бажає хоробро особисто вести своїх людей у битву, залишивши управління країною комусь іншому."
 AUS_political_events.99.b:0 "Ладно, дамо їм порадіти... поки що."
 AUS_promote_the_worthy:0 "Просувати гідних"
 AUS_pulverfabrik_skodawerke:0 "Інвестувати в Pulverfabrik Skodawerke"
 AUS_pulverfabrik_skodawerke_tt:0 "§Y3x§! §G25%§! бонусів дослідження для технологій: §YЗберігання і переробки палива§!."
 AUS_recruiting_the_graduates_desc:0 "Щоб підтримувати наші наукові зусилля в довгостроковій перспективі, ми повинні постійно отримувати нові таланти. Співпрацюючи з Університетом у Ґраці, ми могли б залучити студентів, випускників і професорів до наших власних проєктів."
 AUS_secret_rearmament:0 "Секретне переозброєння"
 AUS_seek_papal_support_tt:0 "Зміна популярності нашої нинішньої керівної партії на: §G5%§!"
 AUS_the_danubian_federation_decision:0 "Запросити державу [FROM.GetNameDef] до альянсу [ROOT.GetFactionName]"
 AUS_the_red_helper:0 "Червоний помічник"
 AUS_the_right_to_rearm_dem_instead_tt:0 "Якщо б [ROOT.GetNameDef] була §YДемократичною Нацією§!, ми б замість цього шукали угоди щодо питання переозброєння."
 AUTONOMY_CURR_DESC:0 "Наразі $COUNTRY|H$ — $LEVEL|lH$"
 AVAILABLE_GRAND_DOCTRINE:0 "$FOLDER_NAME$ — §Hглобальна доктрина§!"
 AZR_democratic_party:0 "Рівність"
 BALTIC_british_aircraft_desc_alt:0 "Зусилля з місцевого проєктування літаків особливим успіхом не увінчалися. Поки що наші ВПС залежать від техніки, взятої як трофеї у німців та росіян, але щоб вижити, нам потрібно освоїти самостійне виробництво. Можливо, ключем до нашої перемоги стане допомога іноземних ВПС..."
 BALTIC_concessions_for_catholics_desc:0 "У нижчих класах держави [Root.GetNameDef] багато відданих католиків, а в першій Республіці робітників релігійні ритуали були суворо заборонені Червоною армією. Це налаштувало багатьох бідняків держави [Root.GetNameDef] проти революції, так що по-справжньому народною республікою, потрібно твердо пообіцяти їм, що їхня віра буде захищена."
 BALTIC_events.6.d:0 "Балтійські країни об'єднувала довга історія спільного страждання під п'ятою іноземного імперіалізму, але тепер це в минулому. [Root.GetNameDefCap] та [From.GetNameDef] звільнені соціалізмом, але [From.GetLeader] стверджує, що це не гарантія виживання балтійських держав. [From.GetLeader.GetSheHeCap] каже, що, поки Балтія розділена за національною ознакою, ми слабкі та вразливі перед імперіалізмом і капіталізмом і, лише об'єднавшись в єдину Балтійську Республіку, ми зможемо витримати натиск іноземних."
 BALTIC_events.601.d:0 "[From.GetLeader] відповідає на [Root.GetAdjective] пропозицію об'єднання категоричною презирною відмовою. Багато хто поважає право держави [From.GetNameDef] на самоврядування, але очевидно, що спільно країни Балтії впораються краще, ніж порізно."
 BALTIC_events.7.t:0 "[From.GetNameDefCap] просить про [baltic_wargoal_target.GetAdjective] вторгнення"
 BALTIC_forest_brothers_resistance:0 "Активність спротиву"
 BALTIC_forest_brothers_resistance_desc:0 "Лісові брати готуються вчинити державну зраду всередині нашої країни. Ми ще не знаємо, що вони будуть робити, але знаємо, що це, безумовно, буде активна підривна діяльність на шляху до нашої мети — поширення соціалізму по всій країні."
 BALTIC_tech_sharing_tt:0 "Ми заключимо §Yугоду про обмін технологіями§! з усіма членами нашого альянсу."
 BAR_neutrality_party_long:0 "Прихильники літунґи"
 BAY:0 "Баварія"
 BAY_neutrality:0 "Королівство Баварія"
 BBA_african_union_events.20.t:0 "[FROM.GetNameDefCap] порушує оборонну угоду"
 BBA_african_union_events.4.a:0 "Короткочасний біль виправданий у майбутньому."
 BBA_african_union_events.5.a:0 "Короткозора позиція."
 BBA_african_union_events.6.t:0 "[FROM.GetNameDefCap] приєднується до [ETH_GetCentralBankName]"
 BBA_ethiopia_balance_of_power_events.01.c:0 "Знищити класових зрадників."
 BBA_ethiopia_communist_events.01.t:0 "[ETH.GetAdjective] комуністи просять допомоги"
 BBA_ethiopia_communist_events.03.t:0 "[SOV.GetName] надсилає допомогу [ETH.GetName]"
 BBA_ethiopia_communist_events.09.t:0 "[SOV.GetNameDefCap] надсилає стрілецьке озброєння"
 BBA_ethiopia_communist_events.59.desc:0 "Схоже, що наша нещодавня відмова виконати вимоги [JAP.GetAdjective] уряду сильно їх розлютила. Було оголошено, що вони накладають ембарго на нас на невизначений термін через так звану «шкідливу ідеологічну діяльність» у регіоні Східної Африки."
 BBA_ethiopia_exile_events.06.a:0 "У цьому є сенс"
 BBA_ethiopia_exile_events.08.a:0 "Виграємо війну, а там подивимося"
 BBA_ethiopia_exile_events.14.desc:0 "Під час нещодавньої зустрічі на Даунинґ-стріт [FROM.GetLeader] говорив з [ROOT.GetAdjective]им Прем'єр-міністром про [454.GetName]. [FROM.GetLeader] заявив, що [FROM.GetLeader.GetSheHe] отримав дуже теплий прийом, коли проїжджав туди по дорозі [FROM.GetLeader.GetHerHis] до [ROOT.GetNameDef]. Розмови поступово змістилися в бік прохання [FROM.GetLeader] використовувати [454.GetName] як базу для відвоювання [ETH.GetNameDef], використовуючи його заявлену пряму лінію до царя Соломона як важіль, таким чином де-факто просячи прем'єр-міністра поступитися [454.GetName] [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.19.t:0 "Започаткування [ROOT.GetAdjective]их ВМС"
 BBA_ethiopia_exile_events.45.desc_white_peace:0 "[FROM.GetAdjective]е посередництво виявилося успішним. [FROM.FROM.GetLeader] отримав наказ [FROM.GetLeader] вивести [FROM.FROM.GetLeader.GetHerHis] війська з території [ROOT.GetAdjective]. \nДоговір не пропонує ніякої компенсації [ROOT.GetName], але ми сподіваємося, що зможемо використати наших нових союзників, щоби привести країну в сучасну епоху. [FROM.GetAdjective]ий [GetGermanCountryLeaderTitle], [FROM.GetLeader], дав туманні обіцянки про відновлення слави імперії [ROOT.GetAdjective]."
 BBA_ethiopia_fascist_events.21.t:0 "[ETH.GetAdjectiveCap]у честь відновлено"
 BBA_ethiopia_fascist_events.53.t:0 "Прохання про [ITA.GetAdjective]ого оснащення"
 BBA_ethiopia_imperial_events.2.a:0 "Чудова новина."
 BBA_ethiopia_imperial_events.7.t:0 "[FROM.GetLeader] просить покори"
 BBA_italo_ethiopian_war_events.10.t:0 "Резолюція Ліги Націй: ембарго"
 BBA_italo_ethiopian_war_events.11.t:0 "Ліга Націй вимагає закриття Суецького каналу"
 BBA_italo_ethiopian_war_events.120.b:0 "Ми все ще можемо перемогти!"
 BBA_italo_ethiopian_war_events.20.t:0 "[ETH.GetLeader] відмовляється здаватися"
 BBA_italo_ethiopian_war_events.500.desc_guarantees:0 "[FROM.GetAdjective]а влада вимагає, щоби ми подали мирний договір із державою [ETH.GetName], якщо ми хочемо їхню допомогу проти німців. Якщо ми підпишемо договір з ефіопами, ми мусимо бути готові розлучитися з деякими завойованими нами землями, зберігши при цьому інші. Такий мир, безумовно, буде гіркою пігулкою для обох країн, але, можливо, він буде вартий того, коли ми зіткнемося з німцями."
 BBA_italo_ethiopian_war_events.500_tt:0 "Війна триває."
 BBA_italy_anti_colonialism_events.01.g:0 "Ми будемо зміцнювати зв'язки з ефіопським народом."
 BBA_italy_anti_colonialism_events.07.a:0 "Це було занадто..."
 BBA_italy_anti_colonialism_events.10.desc:0 "[FROMGetAdjective]ий уряд мудро вирішив прийняти нашу пропозицію об'єднати зусилля і користуватися нашим захистом. Це, без сумніву, зміцнить і принесе користь обом країнам!"
 BBA_italy_anti_colonialism_events.103.b:0 "Дні [FROM.GetLeader], можливо, добігають кінця."
 BBA_italy_anti_colonialism_events.11.a:0 "На [FROM.GetAdjective]их людей чекає світле майбутнє!"
 BBA_italy_anti_colonialism_events.53.desc:0 "Можливо, це не стало повною несподіванкою, але нам, на жаль, повідомили, що народ Північної Африки не бажає більше перебувати під нашим правлінням. Вони відчували себе знехтуваними та експлуатованими протягом тривалого часу і тому проголосували за вихід з-під нашого управління."
 BBA_italy_anti_colonialism_events.59.desc:0 "Можливо, це не стало повною несподіванкою, але нам, на жаль, повідомили, що народ Центральної Африки не бажає більше перебувати під нашим правлінням. Вони відчували себе знехтуваними та експлуатованими протягом тривалого часу і тому проголосували за вихід з-під нашого управління."
 BBA_italy_civil_war.1.a:0 "Нам потрібна тверда рука!"
 BBA_italy_civil_war.7.a:0 "Вони про це пошкодують!"
 BBA_italy_decide_the_fate_of_mussolini.3.t:0 "Смерть Муссоліні"
 BBA_italy_democratic_events.01.a:0 "Ферруччо Паррі є найбільш здібним лідером."
 BBA_italy_democratic_events.01.b:0 "Досвід Івана Бономі є неоціненний."
 BBA_italy_interaction_events.10.desc:0 "Дурний [FROM.GetLeader] від держави [FROM.GetNameDef] позбавив нас нашої законної глини, і тепер настав час знищити державу [FROM.GetName], однією швидкою атакою. Це, безсумнівно, забезпечить наші права на Далмацію на найближче майбутнє."
 BBA_italy_interaction_events.16.desc:0 "[FROM.GetName] відхилила наш дружній запит про гарантії безпеки і відмовив нам у демілітаризації регіону [342.GetName] та регіону [339.GetName]. Це просто обурливо, і з цим треба буде розібратися по-своєму."
 BBA_italy_interaction_events.21.b:0 "Ми не будемо кланятися італійцям, незважаючи ні на які умови!"
 BBA_italy_interaction_events.31.a:0 "Звісно, вони можуть його забрати"
 BBA_italy_interaction_events.46.desc:0 "Держава [FROM.GetName] грубо відхилила нашу пропозицію про союз, і тому нам доведеться обійтися без них. Вони залишаться ізольованими на своєму континенті."
 BBA_italy_interaction_events.46.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 BBA_italy_interaction_events.8.t:0 "[ITA.GetName] вимагає окупації Далмації"
 BBA_italy_local_rulers.3.c:0 "$ETH_hailu_tekle_haymanot$ та його послідовники мають бути підкорені."
 BBA_italy_missiolinis.04_south.a:0 "$BBA_italy_missiolinis.02_north.a$"
 BBA_italy_missiolinis.123.desc:0 "Як і римські легіони до нас, ми розгромили ворожі війська і завоювали всю Грецію. Муссоліні виголосив запальну промову в тіні Парфенону, оголосивши італійців і греків братніми народами з багатовіковою спільною історією, і що тепер вони вільні прокладати свій власний шлях в історії."
 BBA_italy_missiolinis.13.a:0 "Одна лише кров рухає коліщатка історії."
 BBA_italy_missiolinis.22.t:0 "Ефіопія досі опирається"
 BBA_italy_missiolinis.83.a:0 "За дуче та державу!"
 BBA_italy_naval_cooperation_programs.06.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 BBA_swiss_expansion.6.d:0 "Забирайтеся геть"
 BBA_switzerland.16.b:0 "Нам не потрібна їхня допомога"
 BBA_switzerland.23.desc:0 "На жаль, [FROM.GetName] вирішили проігнорувати нашу біду перед загрозами з боку [?SWI.SWI_angriest_country.GetNameDef]. Вони не стануть на наш бік."
 BBA_switzerland.25.t:0 "[?SWI.SWI_angriest_country.GetNameDefCap] більше не вважає нас нейтральними"
 BBA_switzerland_trade.13.b:0 "Це нам не вигідно"
 BEG_communism_DEF:0 "Соціалістичний союз фунджійських і ґумузських народів"
 BEL_HOL_autonomy_eu_member:0 "Європейська Бельгія"
