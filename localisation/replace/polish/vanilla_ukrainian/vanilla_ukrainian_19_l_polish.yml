 purged_kalinin:0 "$purge_1_group_a$"
 radio_detection_desc:0 "Розробка радарів (від англ. — радіохвильове виявлення та ранжування) дозволяє використовувати радіохвилі для виявлення фізичних об'єктів. Зважаючи на вплив, який ці винаходи можуть мати на визначення розташування військ, ці дослідження є дуже секретні."
