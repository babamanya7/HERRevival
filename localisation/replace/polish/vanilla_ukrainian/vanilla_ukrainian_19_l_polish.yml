 FRA_infantry_tanks_desc:0 "Як би там не було, першим і останнім обов'язком танків є надання можливості піхоті зайняти і утриматися на землі. Тому ми завжди мусимо оснащувати наші піхотні підрозділи сучасними, боєздатними танками."
