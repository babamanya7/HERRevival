 ARG_VICTORY_POINTS_12960:0 "Пуерто-Архентіно"
 ARG_a_true_democracy_desc:0 "[ARG.GetNameDefCap] вважалася демократією з 1861 року, однак останнім часом стан нашої політичної системи приніс ганьбу концепції вільної, демократичної республіки. Тепер ми можемо нарешті рухатися вперед як справжня демократія. Та, що цінує стабільність та покращення [ARG.GetAdjective] економіки."
 ARG_banco_central_de_la_republica_argentina:0 "Центральний банк Аргентинської Республіки (Banco Central de la República Argentina)"
 ARG_democratic_ADJ:0 "Аргентинськ"
 ARG_develop_the_electricity_sector_desc:0 "Наш електроенергетичний сектор потребує модернізації, і тому було б розумно зосередити наші ресурси на подальших дослідженнях технологій, щоб допомогти нашому електричному розвитку."
 ARG_education_industrial_bonus:0 "Бонус до промислової освіти"
