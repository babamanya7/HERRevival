 czech.22.d:0 "Влада держави [From.GetNameDef] запропонувала Судетську область як крок до зміцнення взаєморозуміння. З одного боку, це відмінний шанс дешево та безпечно отримати багату територію. З іншого боку, криза навколо Судетської області покаже всьому світу, що так звані «великі держави» вважають Версальський договір беззубим та морально ущербним."
