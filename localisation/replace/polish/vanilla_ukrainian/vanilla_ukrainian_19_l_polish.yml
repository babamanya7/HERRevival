 GRE_a_socialist_economy_desc:0 "Грецький народ надто довго страждав під автократичним правлінням лжекороля та кровожерливих венізелістів. Час людям нарешті прийти до процвітання під керівництвом уряду, для якого вони на першому місці!"
 GRE_connecting_our_prefectures_desc:0 "Нам не вистачає не лише індустріальної бази, а й національної інфраструктури. Наші сусіди урбанізували свої держави; час і нам почати урбанізацію."
