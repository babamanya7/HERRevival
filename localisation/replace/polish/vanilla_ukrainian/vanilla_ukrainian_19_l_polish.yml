 ranger_battalion_desc:0 "Рейнджери — провідні спеціалісти, коли йдеться про ведення бойових дій в умовах густої та вкритої рослинністю місцевості."
 rangers_jaegers_training_desc:0 "Light infantry trained at fighting in Forests, living off what the area has to offer, experts at setting traps, ambushes and excellent shots."
 rebuild_the_nation_fascism_desc:0 "Громадянська війна закінчилася, тож тепер час відбудувати нашу зруйновану державу."
