 DOD_hungary.1.t:0 "Угорщина вимагає провести референдум"
 DOD_hungary.109.a:0 "Так чи інакше ми отримаємо цю країну."
 DOD_hungary.121.a:0 "Розумна ціна."
 DOD_hungary.122.a:0 "Очікувана реакція."
 DOD_hungary.127.a:0 "Це перемога дипломатії."
 DOD_hungary.13.desc:0 "[CZE.GetNameDefCap] не бажає навіть обговорювати будь-які пропозиції щодо наших подальших взаємин. Коли наш посол прибув до міністерства закордонних справ, щоб обговорити відправлену ним офіційну ноту, йому заявили, що говорити не про чим і швидко вказали на двері. [CZE.GetAdjective] посол у нашій країні заявив, що його уряд прагне мирних, добросусідських відносин між нашими країнами, але [CZE.GetNameDef] нізащо не стане частиною Австро-Угорської імперії."
 DOD_hungary.144.a:0 "Ми мусимо поступитися їм."
 DOD_hungary.151.e:0 "Звернутися до США"
 DOD_hungary.151.f:0 "Використовувати досвід, отриманий під час тендеру, для поліпшення власних літаків."
 DOD_hungary.165.desc:0 "Після переговорів із заводом-виробником та представниками влади ми придбали ліцензію на випуск бомбардувальників нового типу. Механіки вже вивчають тонкощі технічного обслуговування цієї моделі на пробному зразку, а незабаром ми отримаємо повний комплект креслень і схем. в будь-який момент."
 DOD_hungary.23.t:0 "Втручання Швеції"
 DOD_hungary.26.desc:0 "Угорщина відкрила свої старі арсенали і надіслала нам вантаж із полагодженими гвинтівками й іншим спорядженням для піхоти. Крім того, до нас прибули кілька тисяч угорських добровольців."
 DOD_hungary.35.desc:0 "Уряд держави [From.GetNameDef] повідомив нам, що вважає питання перегляду Тріанонського договору суто внутрішньою справою зацікавлених країн і відмовився втручатися в цю справу. Схоже, він більше дбає про збереження хороших стосунків зі своїми колишніми союзниками, ніж про справедливість."
 DOD_hungary.43.desc:0 "Схоже, що [HUN.GetNameDef] проігнорувала наше попередження. На демонстрації, яка пройшла вчора ввечері в Будапешті, натовп скандував «[From.From.GetNameDef] мусить вмерти!». [HUN.GetLeader] спроба завадити державі [HUN.GetNameDef] зайняти гідне місце на світовій арені призведе до «такої війни, яку світ ще не бачив; війні, на тлі якої м'ясорубка 1914-1918 років здасться п'яною бійкою в барі».\n\nМи стоїмо на роздоріжжі. Ми або йдемо на війну захищати наші честь і гідність, або визнаємо, що нас перехитрили."
 DOD_hungary.55.c:0 "Звернутися до Радянського Союзу"
 DOD_hungary.57.t:0 "[HUN.GetNameDefCap] поступається"
 DOD_hungary.67.a:0 "Проблема буде вирішена вогнем, кров'ю та сталлю."
 DOD_hungary.69.t:0 "Трансільванський компроміс"
 DOD_hungary.73.t:0 "Конференція з Трансільванії: день 3"
 DOD_hungary.74.a:0 "Ми згодні."
 DOD_hungary.74.desc_compromise:0 "Румунія запропонувала компромісне рішення: розділити Трансільванію на дві частини. Враховуючи напруженість між цими країнами, такий варіант, можливо, є найкращим."
 DOD_hungary.86.t:0 "[From.GetNameDefCap] відмовляється підтримувати нас"
 DOD_hungary.97.a:0 "Отже, бути війні."
 DOD_romania.1.t:0 "Румунія бажає відновити альянс"
 DOD_romania.40.desc:0 "[ROM.GetLeader] терміново викликав себе нашого посла. Перш ніж посол встиг поставити питання про нещодавнє переміщення румунської армії до нашого спільного кордону, йому надали ультиматум. [BUL.GetNameDefCap], як стверджує [ROM.GetLeader], не має права робити будь-які дії без його прямої згоди і надалі пропонуватиме всі важливі політичні рішення на його схвалення.\n\nУ разі відмови вони мають намір застосувати чинність."
 DOD_romania.50.b:0 "Ми можемо піти на деякі поступки."
 DOD_romania.81.t:0 "Коханка короля придбала віллу"
 DOD_yugoslavia.182.d:0 "Наші прихильники панслов'янського конгресу робітників почали прикрашати вулиці міста [This.Capital.GetName] плакатами та листівками з пропагандою [From.GetAdjective] моделі соціалізму. [From.GetLeader] та його режим подобаються їм; що [This.GetAdjective] уряду підуть на користь соціальні реформи на кшталт тих, що проводяться в державі [From.GetNameDef] Багато хто вважає, що таким чином [From.GetLeader] намагається підірвати [This.GetAdjective] незалежність, але не можна не визнати, що ця пропаганда помітно впливає на ставлення середнього [This.GetAdjective]ого громадянина до комунізму та об'єднаного балканського союзу."
 DOD_yugoslavia.19.t:0 "Король Петар подорослішав!"
 DOD_yugoslavia.2.desc:0 "Відразу після того, як уряд принца Павле підписав Троїстий пакт, ряд офіцерів [YUG.GetAdjective] ВПС організували ретельно спланований переворот, скинувши законно обраний уряд і посадивши на престол неповнолітнього Петара II.\n\nЮгославський уряд склав свої повноваження, а нова влада оголосила підпис принца Павле недійсним."
 DOD_yugoslavia.20.a:0 "Дозволити продаж літаків з нашого резерву."
 DOD_yugoslavia.22.desc:0 "Наша закупівельна комісія в державі [From.GetNameDef] домовилася про постачання середніх бомбардувальників для наших ВПС. Ми вже отримали першу партію літаків, і наші пілоти почали їх освоювати."
