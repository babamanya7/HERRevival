 SEA_PHI_political_events.1.a:0 "Наявність альтернативних джерел необхідних ресурсів є критично важливою"
 SEA_PHI_political_events.30.b:0 "Ні, Айзенгауер важливіший для використання тут."
 SEA_PHI_political_events.45.b:0 "Ми не можемо ризикувати війною з [USA.GetNonIdeologyName]"
 SEA_PHI_political_events.56.c:0 "Нехай займаються Тихим океаном"
 SEA_PHI_political_events.57.desc:0 "Наш запит про контроль над місцевими [FROM.GetAdjective]ими військово-морськими силами був схвалений їхнім урядом. Оперативним з'єднанням наказано прибути до наших портів в очікуванні реорганізації."
 SEA_PHI_political_events.58.a:0 "Доведеться зосередитися на розбудові власного флоту"
 SEA_PHI_political_events.64.desc_generic:0 "Поточний термін [ROOT.GetLeader] добіг кінця, і нові президентські вибори тепер визначать нашого наступного президента. Через погіршення здоров'я $PHI_manuel_luis_quezon$ знявся з перегонів."
 SEA_PHI_political_events.9.desc:0 "В обмін на партію [PHI_GetTradedEquipment], [FROM.GetNameDef] пропонує надіслати нам флотилію торговельних і транспортних суден."
 SEA_PRC_border_war_events.4.desc:0 "Після прикордонних сутичок вздовж кордону [615.GetName], [PRC.GetNameDef] не вдалося прорвати оборонні рубежі та витіснити ворога. Проте [PRC.GetNameDefCap] вдалося захопити трохи артилерії."
 SEA_PRC_border_war_events.5.desc:0 "Після прикордонних сутичок вздовж кордону [1032.GetName], [PRC.GetNameDef] вдалося прорвати оборонні рубежі та витіснити ворога. [PRC.GetNameDefCap] тепер оголошує регіон своїм."
 SEA_PRC_border_war_events.5.t:0 "[PRC.GetNameDefCap] завойовує [1032.GetName]"
 SEA_PRC_faction_events.1.a:0 "Ця угода вигідніша для нас"
 SEA_PRC_faction_events.3.a:0 "Це лише тимчасова невдача!"
 SEA_PRC_faction_events.82.t:0 "[FROM.GetName] схиляє голову"
 SEA_PRC_misc_events.12.t:0 "Підписано [SOV.GetAdjective]о-японський пакт про ненапад"
 SEA_PRC_misc_events.13.c:0 "Віддати їм усе, що ми утримуємо"
 SEA_PRC_misc_events.8.a:0 "Ці праці, безумовно, стануть впливовими"
 SEA_PRC_political_events.12.t:0 "[FROM.GetName] погоджується відпустити нас"
 SEA_PRC_political_events.2.desc:0 "Незважаючи на нашу підтримку та їхнє відносно захищене місце в горах центрального Китаю, [FROM.GetNameDef] звернувся з проханням пообіцяти захистити їх у разі конфлікту. Чи бояться вони чергової антикомуністичної кампанії націоналістичних сил, чи іноземного імперіалізму — незрозуміло, але ми повинні зважити ризик втягнення в такі конфлікти, перш ніж надавати будь-які гарантії."
 SEA_PRC_political_events.21.desc:0 "\nШукаючи [ROOT.GetAdjective]их порад щодо військової стратегії, [FROM.GetNameDef] звернувся з проханням дозволити $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ повернутися до Китаю. Чуйков спочатку був розміщений у [FROM.GetNameDef] і вільно володіє китайською мовою, але був відкликаний після конфлікту навколо [ROOT.GetAdjective]их інтересів у Маньчжурії, коли вона ще не була окупована Японією."
 SEA_PRC_political_events.23.t:0 "[FROM.GetName] відмовляється надіслати нам $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$"
 SEA_PRC_request_aid.7.a:0 "Чудово! Ми знайдемо їм гарне застосування, коли б вони не прибули"
 SEA_PRC_request_aid.9.a:0 "Погодитися допомогти в цій справі"
 SEA_PRC_zhang_guotao_events.2.desc:0 "$PRC_zhang_guotao$ з Четвертої фронтової армії, політичний суперник Мао, надіслав телеграму про те, що він та його армія наближаються до [ROOT.Capital.GetName]. Їхній Великий похід тривав майже на рік довше, ніж похід $PRC_mao_zedong$, і армія, напевно, виснажена цим випробуванням. Можливо, саме через це $PRC_zhang_guotao$ знову наголосив, що не прагне кинути виклик нинішньому керівництву партії."
 SEA_PRC_zhang_guotao_events.7.a:0 "Мимовільне двовладдя було помилкою — йому не можна довіряти"
 SEA_border_incidents_events.3.a:0 "Готуватися до штурму!"
 SEA_china.10.desc:0 "Ми отримали пропозицію від [FROM.GetNameDef] приєднатися до [ROOT.GetFactionName] разом з усіма членами [FROM.GetFactionName]. Якби ми погодилися, одним потенційним супротивником стало б менше, а наша власна позиція зміцнилася б. Питання скоріше в тому, чи можна довіряти їхнім намірам і чи не прагнуть вони витіснити нас."
 SEA_china.17.t:0 "[From.GetName] надав нам доступ до авіабаз"
 SEA_china.25.b:0 "$astrov_design_bureau$"
 SEA_china.25.t:0 "Китай просить фахівців з бронетехніки"
 SEA_china.26.t:0 "[SOV.GetNameDefCap] відповідає"
 SEA_china_democratic.18.desc:0 "[FROM.GetName] прийняв наш ультиматум. Їхні лідери говорять про національну єдність та історичну долю, але зміст зрозумілий — тепер вони визнають верховенство [CHI.GetNameDef].\nХоча їхнє підкорення може бути неохочим, воно рятує Китай від подальшого розколу та кровопролиття."
 SEA_china_democratic.5.a:0 "За демократію!"
 SEA_china_democratic.7.b:0 "Їхніми законними власниками є ми."
 SEA_china_improvement.1.a:0 "Добровольці крокують до слави"
 SEA_china_warlords.2.a:0 "Розбите сонце збирає своє світло"
 SEA_generic_events.10.t:0 "Корупційний скандал в уряді"
 SEA_generic_events.14.t:0 "Великий антиурядовий протест"
 SEA_imperial_influence_events.00.b:0 "[GetNameImperialInfluenceFailureOptions]"
 SEA_imperial_influence_events.440.t:0 "Фракція Цивільного уряду прагне обмежити вплив Армії"
 SEA_japan_foreign_policy.100.a:0 "Ми з радістю погодимося"
 SEA_japan_foreign_policy.101.t:0 "[FROM.GetNameDefCap] приєднується до валютного союзу"
 SEA_japan_foreign_policy.103.a:0 "Це надто гарна пропозиція, щоб від неї відмовлятися"
 SEA_japan_foreign_policy.104.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прихильно відреагував на нашу пропозицію, і їхні дипломати прибули до нашої країни для підписання необхідних документів, що сприятимуть подальшій економічній інтеграції."
 SEA_japan_foreign_policy.115.b:0 "Їм доведеться забрати їх силою!"
 SEA_japan_foreign_policy.116.desc:0 "[From.GetNameDefCap] ретельно розглянули нашу пропозицію «підтримувати порядок» у їхніх колоніях і вирішили погодитися. Вони фактично передали нам повний контроль над своїм суб'єктом."
 SEA_japan_foreign_policy.133.t:0 "[FROM.GetLeader] погоджується на наші вимоги"
 SEA_japan_foreign_policy.24.a:0 "Вони щось планують..."
 SEA_japan_foreign_policy.33.a:0 "Перший крок зроблено"
 SEA_japan_foreign_policy.42.desc:0 "[FROM.GetLeader] проголосив, що обидві наші нації мають спільну долю, і що тільки йдучи пліч-о-пліч, ми зможемо викорінити комуністичну загрозу. З цією метою нам було висунуто пропозицію про союз, хоча його умови, схоже, стверджують, що він є лише тимчасовим. Чи варто нам приймати їхню пропозицію?"
 SEA_japan_foreign_policy.48.t:0 "[FROM.GetNameDefCap] розвиває нашу промисловість"
 SEA_japan_foreign_policy.51.t:0 "[FROM.GetNameDefCap] приймає повну інтеграцію"
 SEA_japan_foreign_policy.63.b:0 "Це був би кінець нашої автономії, ні!"
 SEA_japan_foreign_policy.65.a:0 "З часом вони погодяться..."
 SEA_japan_foreign_policy.7.t:0 "[FROM.GetNameDefCap] готується до вторгнення"
 SEA_japan_foreign_policy.72.a:0 "Ми перемогли в цей день!"
 SEA_japan_foreign_policy.75.a:0 "Ми дуже вдячні!"
 SEA_japan_foreign_policy.78.desc:0 "Незважаючи на очевидні переваги і те, що це явно найкраще для майбутнього нації, губернатор [FROM.GetNameDef], [FROM.GetLeader], відхилив наше прохання про повну інтеграцію. Можна лише здогадуватися про причини, але, схоже, вони не дбають про найкращі інтереси нації."
 SEA_japan_foreign_policy.84.desc:0 "На жаль, незважаючи на наші історичні зусилля щодо покращення відносин між нашими двома країнами, [FROM.GetLeader] відхилив нашу пропозицію про взаємний анти-[SOV.GetAdjective]ий пакт. Зазначається, що це занадто небезпечно для [FROM.GetAdjective]ої нації, якщо пакт буде викрито [SOV.GetAdjective]ими агентами."
 SEA_japan_popup_events.14.a:0 "Нехай Мачіда Тюдзі добре керує Ріккен Мінсейто"
 SEA_japan_popup_events.19.b:0 "Наші люди перейшли межу, відступаємо!"
 SEA_japan_popup_events.25.a:0 "Ріккен Мінсейто перемагає!"
 SEA_japan_popup_events.4.desc:0 "Наш Імператор висловив незацікавленість у наших амбіціях щодо Реставрації Шьова та створення нового військового уряду. Ймовірно, він усе ще перебуває під впливом Фракції контролю, але якщо він не стане на наш бік, нам, імовірно, доведеться замінити його імператорську високість на його брата Ясухіто. Чи варто нам «переконати» його приєднатися до нас, чи, можливо, буде розумніше дозволити історії йти своїм шляхом?"
 SEA_japan_popup_events.46.t:0 "Квантунська армія окуповує Східний Хебей"
 SEA_japan_tokko_arrest_events.8.t:0 "Інцидент «Ґассакушя»"
 SEA_warlords.23.b:0 "Ми ніколи не підкоримося"
 SEA_warlords.30.t:0 "[FROM.GetLeader] відмовляється здаватися"
 SEA_warlords.35.desc:0 "З піднесеним духом і ще вище піднятою зброєю Чан Кайші прибув сьогодні вранці з невеликим батальйоном охорони. Однак, схоже, що прийняття пропозиції не було пасткою, і переговори почалися негайно. Чень Цзітан і Лі Цзунжень підштовхували Чана Кайші до створення об'єднаного фронту проти японців, навіть дійшовши до припинення бойових дій з комуністами на цей час. Важко сказати, чи правильний це вибір, але цілком можливо, що так."
 SEA_warlords.43.t:0 "Правління Сунь Тунсюаня"
 SEA_warlords.45.desc:0 "Чудові новини! [GXC.GetNameDefCap] погодилися на запропоноване нами об'єднання під прапором Лянґуану. Разом ми формуємо потужну фракцію, маючи у своєму розпорядженні величезні промислові, сировинні та людські ресурси! Увесь Китай тепер тремтить перед нашою об'єднаною силою та волею."
 SEA_warlords.48.desc:0 "Набагато легше повернути єдність нашій нації, коли її окремі фракції малі та роз'єднані. На жаль, південні провінції почали об'єднуватися, і цей оплот проти нашої сили викликає дедалі більше занепокоєння. Вони здатні мобілізувати проти нас тривожну кількість ресурсів і живої сили, якщо вирішать чинити опір."
 SEA_warlords.63.t:0 "Додаткові [SOV.GetAdjective]і припаси прибувають через перевал Іркештам"
 SEA_warlords.65.b:0 "Ми не підемо на компроміс щодо наших кордонів!"
 SEA_warlords.71.a:0 "We shall aid them in their fight against communism!"
