 BSK_SOV_communism_subject_DEF:0 "Автономна радянська соціалістична республіка Башкортостан"
 BSK_neutrality:0 "Незалежне уфімське губернаторство"
 BUK_SOV_communism_subject_ADJ:0 "Бухарськ"
 BUL_BEL_autonomy_eu_member:0 "Європейська Болгарія"
 BUL_HOL_autonomy_eu_member_ADJ:0 "Болгарськ"
 BUL_a_powerful_bulgarian_navy_desc:0 "Ми мусимо зосередитися на будівництві основних кораблів, які забезпечать наш флот тією вогневою міццю, якої їм зараз не вистачає. Можливо, ми не маємо найбільші військово-морські сили, але якщо ми зосередимо свої зусилля, ми можемо опинитися в положенні, щоби боротися з домінуванням на наших морях навіть проти великих флотів."
 BUL_amend_old_grudges_desc:0 "Настав час помститися за всю шкоду і приниження, завдані Болгарії її численними ворогами в минулому, від віроломних румунів і турків, які вдарили нам ножа в спину під час Другої Балканської війни, до держав Антанти, які перемогли нас у Великій війні та відтоді гальмують розвиток нашої країни."
 BUL_appoint_right_wing_ministers_tt:0 "Будуть відкриті рішення по співпраці з фракцією [GetNsmName].\nБудуть відкриті рішення по придушенню фракції [GetNsmName]."
 BUL_assert_our_claims:0 "Висунути наші претензії"
 BUL_balkan_confederation_balkan_summit:0 "Організувати Балканський з'їзд"
 BUL_british_industrial_agreements_category_desc:0 "Поточні [ENG.GetAdjective]і заводи: [?BUL.BUL_british_industrial_investments|Y0]\nБазова межа: [?BUL.BUL_industrial_investments_basic_cap|R0]\nВиконайте фокус §Y$BUL_approach_the_united_kingdom$§!, щоби збільшити межу до [?BUL.BUL_industrial_investments_medium_cap|G0].\nПриєднайтеся до альянсу §Y[ENG.GetFactionName]§!, щоби збільшити межу до [?BUL.BUL_industrial_investments_max_cap|G0]."
 BUL_bzns_name_text:0 "Землеробський союз"
 BUL_collectivization_of_the_countryside_bs_support_requirement_tt:0 "Більш ніж §Y70%§! лояльності фракції [GetBsName]"
 BUL_condemn_macedonian_organizations_desc:0 "Ми мусимо оголосити своє невдоволення ВМРО і почати працювати над пошуком і ліквідацією будь-яких македонських революційних осередків, які все ще діють в Болгарії, нарешті поклавши кінець тому, що розпочали Звено в 1934 році, і поліпшивши наші зовнішні відносини з нею."
 BUL_cooperation_fund_bzns:0 "Фінансувати $BUL_bzns_name_gen$"
 BUL_destabilize_country_desc:0 "Необхідно впровадити [ROOT.GetAdjective]их агентів у державу [FROM.GetNameDef], щоби зібрати активістів, які симпатизують проєкту федерації, навчити їх основам і створити озброєні партизанські загони для дестабілізації країни."
 BUL_dominance_in_the_adriatic_sea_desc:0 "[GetDominanceInTheAdriaticDesc]"
 BUL_georgi_markov_desc:0 "Ґеорґій Марков Марков"
 BUL_german_aeronautical_agreements_flag:0 "Угода про аеронавтичну співпрацю з німцями була підписана"
 BUL_hristo_lukov_death_conclusion_other:0 "Наша служба національної безпеки вже розшукує вбивць, але необхідно думати про майбутнє нації. [ROOT.GetNameDef] потребує нового лідера. Час знайти заміну Хрісто Лукову."
 BUL_italian_research_desc:0 "Скорочення часу дослідження військових технологій, уже вивчених Італією."
 BUL_ivan_sapundzhiev:0 "Іван Сапунджієв"
 BUL_leader_is_tsar:0 "цар [BUL.GetLeader]"
 BUL_nationalist_propaganda_combo_tt:0 "Якщо національний дух §YДоля Балкан§! усе ще активний після завершення цього фокусу:\n- Збільшує тривалість §YДолі Балкан§! (§Y+365§! днів).\n- Отримає поліпшену версію національного духу §YНаціоналістична пропаганда§!."
 BUL_nationalized_industry_desc:0 "Ми експропріювали кожну іноземну фабрику в Болгарії, таким чином значно збільшивши наші промислові виробничі можливості."
 BUL_opression_raid_zveno_supporters_desc:0 "Після захоплення лідерів $BUL_zveno_name_gen$ помітно ослаблений. Настав час влаштувати облаву на решту його учасників, які, як і раніше, тримають організацію на плаву і активно задумують щось проти нас."
 BUL_persuade_bs_members:0 "$BUL_bs_name_gen$"
 BUL_persuade_faction_members_desc:0 "Ми запропонуємо величезні гроші одному з членів уряду, налаштованих проти царя, щоб той зайнявся пошуками відповідного виконавця нашого плану."
 BUL_persuade_generic_members:0 "фракції"
 BUL_plot_against_boris_death:0 "Смерть царя Боріса"
 BUL_regnalname_ferdinand:0 "Фердінанд"
 BUL_simeon_is_1:0 "всього один рік"
 BUL_stefan_tsanev_desc:0 "Стефан Тошев Цанев"
 BUL_support_imro_supply_activists:0 "Забезпечувати активістів ВМРО"
 BUL_the_peoples_republic_of_bulgaria_desc:0 "Тепер, коли ми позбулися болгарської монархії, ми мусимо внести деякі вкрай необхідні зміни в управлінні нашою нацією. Настав час покінчити з епохою деспотизму та гноблення, які переслідували країну стільки років, і утворити Народну Республіку Болгарія. \nЄдність робить силу!"
