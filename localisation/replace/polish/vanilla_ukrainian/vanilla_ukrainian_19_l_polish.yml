 WW_hungary.100.a:0 "Нарешті возз'єдналися!"
 WW_hungary.114.b:0 "Референдум був сфальсифікований"
 WW_hungary.18.a:0 "Все йде за планом"
 WW_hungary.25.b:0 "Ми мусимо це відпустити"
 WW_hungary.34.a:0 "Вони зробили хибний вибір"
 WW_hungary.45.a:0 "Вони зробили правильний вибір"
 WW_hungary.48.desc:0 "Мудре керівництво [FROM.GetNameDef] погодилось коронувати монарха з династії Габсбургів згідно з нашими вимогами та склало повноваження на користь нового короля."
 WW_hungary.51.desc:0 "Імператор [FROM.GetLeader] з [FROM.GetNameDefCap] вимагає відновлення правління Габсбургів, як це було з 1516 до 1700 року. Це дозволить нам приєднатись до їхнього альянсу без повної втрати незалежності."
 WW_hungary.74.desc:0 "Хоч це й не стало несподіванкою, нерозумний [FROM.GetLeader] із [FROM.GetNameDef] привів свої війська у бойову готовність після отримання нашого ультиматуму та надіслав посланника з заявою, що вони не поступляться ні кроком у цій суперечці."
 WW_hungary.78.desc:0 "[FROM.GetNameDefCap] призначив нового Папу главою нашої держави. Це, безумовно, зміцнить наш режим."
 WW_hungary.79.t:0 "[FROM.GetNameDefCap] призначає нам нового монарха"
 WW_hungary.8.b:0 "І чого варта їхня гарантія, скажіть на милість?"
 WW_hungary.9.desc:0 "Мудре керівництво [FROM.GetNameDef] погодилось на нашу пропозицію й незабаром передасть нам контроль над регіоном [975.GetName] в обмін на гарантії незалежності. Ми стали більшими, а наша дружба з [FROM.GetAdjective]ою нацією знову відновлена."
 WW_hungary.95.desc:0 "Настав час провести президентські вибори та утвердити наші демократичні принципи як маяк у центрі Європи. Основні кандидати — Міхай Каройї, президент Першої Республіки, Арпад Сакашитс, лідер соціал-демократів, та Янош Зічи, голова Християнської соціально-економічної партії та член Угорської академії наук. Яке майбутнє чекає Угорщину?"
 WW_hungary.98.a:0 "Вони пошкодують!"
 XIC_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4:0 "Чжунцзян"
 XIC_anti_japanese_national_salvation_agreement_desc:0 "Оскільки офіційну угоду про припинення бойових дій у Шеньсі досягнуто, настав час зміцнити КПК, щоб вони отримали вплив, необхідний для того, щоб переконати [CHI.GetLeader], що припинення громадянської війни та створення Другого об'єднаного фронту варте зусиль для Ґоміньдану. Тому ми повинні контрабандою переправляти зброю та кошти, надані нам Ґоміньданом, у Радянський район, щоб наростити їхню силу."
 XIC_discussions_in_luochuan_desc:0 "Комуністи відправили Лі Кенуна як свого представника для зустрічі з $CHI_zhang_xueliang$ у Лочуані. Вони бажають обговорити можливість припинення бойових дій і зосередження на тому, що ми обидва сприймаємо як більшу загрозу для Китаю — японцях. Ми підемо їм назустріч і з великим поспіхом вирушимо до вказаного місця."
 XIC_fascism_ADJ:0 "Сіаньськ"
 XIC_invite_zuolin_loyalsits_desc:0 "Багато солдатів і генералів, які служать в армії [MAN.GetNameDef], колись були вірні батькові [ROOT.GetLeader], Чжан Цзоліню. Настав час таємно звернутися до них і запросити повернутися до [ROOT.GetNameDef]."
