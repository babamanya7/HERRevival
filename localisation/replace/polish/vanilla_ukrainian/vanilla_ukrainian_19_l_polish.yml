 regnum_bospori_democratic_DEF:0 "Боспорська республіка"
 reichsautobahn_desc:0 "Проєкт будівництва швидкісних автомагістралей, що здійснюється з великим успіхом з 1933 року, скоротив безробіття і став символом економічного відновлення Німеччини. Але багато чого ще належить зробити."
 remove_flooding_tt:0 "Модифікатори §R$flooded$§! буде очищено."
 repair_ship_1_desc:0 "Ремонтні кораблі оснащені потужним рятувальним обладнанням, яке може стати вирішальним фактором у тому, зможе сильно пошкоджене судно дотягнути до порту чи затоне."
 republican_victory:0 "Республіканська Іспанія перемогла у громадянській війні"
 rescue_mussolini_exfiltration_desc:0 "Невеликий літак, здатний злітати з невеликих аеродромів, сяде та забере Муссоліні, після чого розвернеться і доставить його на дружній аеродром."
 rocket_artillery_brigade_desc:0 ""
 rocket_site_plural:0 "Ракетні майданчики"
 romania.4.a:0 "Трансільванія залишиться румунською."
 royal_order_of_the_steel_crown:0 "Командорський хрест Королівського ордену Сталевої корони"
 rule_group_gie_rules:0 "Уряди у вигнанні"
 sanctuary_of_hope:0 "Sanctuary of Hope"
 schwerpunk_desc:0 "У будь-якій операції слід визначити schwerpunkt, точку головного удару, де потрібно зосередити максимум сил і здобути там перемогу."
 scientist_trait_aircraft_specialist:0 "Спеціаліст із літаків"
 scientist_trait_genius_desc:0 "Прозорливий розум, який розсуває межі науки і технологій, впроваджуючи безпрецедентні інновації. Це талант, який з'являється лише раз на покоління."
 scientist_trait_submarine_specialist:0 "Спеціаліст із підводних човнів"
