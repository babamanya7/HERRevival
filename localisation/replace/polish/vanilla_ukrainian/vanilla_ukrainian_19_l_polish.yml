 HINT_INTELLIGENCEAGENCY_SCREEN_TEXT:0 "Це екран §Yрозвідувального агентства§!. §YРозвідувальне агентство§! потрібне для вербування шпигунів, збирання розвідданих, створення шпигунських §Yмереж§! і проведення таємних §Yоперацій§!. §YКриптологія§! — це ще одна грань війни, адже зламавши вородий шифр, Ви можете отримати велику перевагу на полі бою.\n\nЩо більше у Вас розвідданих, то більше Ви знаєте про ворожі розміщення військ, промисловий потенціал, дослідження, фокуси тощо.\n\nВи можете §Gклацнути правою кнопкою миші§! по країні, щоби показати її §Yзведення по розвідданих§! у вкладці поруч із §YДипломатією§!."
 HINT_POLITICS_SCREEN:0 "Підказка: Політика"
 HINT_PRODUCTION_LINES_2_1:0 "На зображенні внизу Ви можете побачити приклад виробничої лінії з призначеними для неї §Y10§! £factory_item£ §Yвійськовими заводами§!."
 HINT_RESEARCH_SCREEN_TEXT:0 "Це екран §Yдосліджень§!. У Вас є кілька комірок для досліджень, і кожна з них використовується для дослідження £tech_mod£ §Yтехнологій§!. Клацніть на порожню §Yкомірку для досліджень§!, щоб обрати технологію для дослідження.\n\nКраїни мають різну кількість комірок; великі держави зазвичай мають більше. Додаткові комірки можна відімкнути за допомогою §Yнаціональних фокусів§!. Їх ми розглянемо в іншій підказці."
 HINT_TRADE_SCREEN_TEXT:0 "Це екран §Yторгівлі§!. Тут Ви можете обмінювати £GFX_civ_factory §Yцивільні заводи§! на ресурси.\n\nЯкщо хоч одній виробничій лінії не вистачатиме потрібних ресурсів, Ви отримаєте сповіщення §YНестача ресурсів§!; виробничі лінії продовжать виробляти озброєння, але зі зменшеною шивдкістю. Торгівля — це непоганий варіант вирішення цієї проблеми.\n\nВрахуйте, що коли Ви віддаєте цивільні заводи в обмін на ресурси, їх неможливо використовувати для спорудження будівель."
 HOA_crowning_of_the_negusa_nagast_desc:0 "Оскільки ми все більше стаємо домінуючою силою в регіоні, настав час прийняти нашу роль, помазавши нашого лідера новим ниґусе неґестом. Усі повинні об'єднатися навколо [ROOT.GetLeader.GetHerHim] або зустріти наш гнів."
 HOA_every_man_a_warrior:0 "Кожен чоловік — воїн"
 HOA_eyes_on_the_imperialists_desc:0 "Імперські сили регіону зневажливо ставляться до незалежності [ROOT.GetNameDef]. Ми повинні залишатися пильними і не ставати жертвою їхніх амбіцій."
 HOA_improved_irrigation_systems_tt:0 "Змінити §Y$ETH_state_development_dynamic_modifier$§! на:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+15%§!"
