 aat_news.101.desc:0 "Після поразки Росії у Кримській війні Оландські острови були демілітаризовані, а їхні мешканці звільнені від будь-якої військової повинності. Хоча цей статус неодноразово оскаржувався, його все ще дотримуються багато великих держав світу. Однак зараз, після [FIN.GetAdjective]ої операції \"Кільпапур'єгдус\", острови знову ремілітаризовані."
 abandon_the_entente_desc:0 "Це була дурна ідея. Як би ми не хотіли, щоб це було можливо, самотня Балтія просто не є життєздатним варіантом для виживання. Ми повинні піддатися чужій державі, ким би вона не була."
