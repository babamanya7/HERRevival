 PERMISSION_CONTESTED:0 "Спірні"
 PER_anti_soviet_resistance_network_desc:0 "Вони можуть це приховувати, як завгодно, але реальність така, що [SOU.GetNameDef] — це не що інше, як чергова Російська імперія, і багато іранських народів залишаються в пастці під їхнім деспотичним ярмом. Ми повинні робити більше, щоб підірвати їхню владу та сприяти визволенню нашого народу."
 PER_azadi:0 "Азаді"
 PER_bakhtiari_boost:0 "Навчання бахтіарів"
 PER_communist_basic_plane_design:0 "Співпраця повітряних сил"
 PER_communist_events.5.a:0 "Ми відступимо, але під протестом."
 PER_czech_tanks:0 "Придбати чеські танкові ліцензії"
 PER_democratic_shortcut:0 "Політика:\nНаціональний фронт"
 PER_elevate_the_iran_party_desc:0 "Партія Туде прив'яже нашу націю до [SOU.GetNameDef], приймаючи накази від [SOU.Capital.GetCapitalVictoryPointName]. Тому всі прогресисти повинні підтримати Партію Ірану, якщо ми хочемо мати хоч якусь надію на встановлення іранського шляху до соціалізму."
 PER_establish_the_navy_desc:0 "Як і повітряні сили, Імперський [PER.GetAdjective] Флот був заснований Резою-шахом Пехлеві після його державного перевороту проти старої династії Каджарів. З того часу ми виявили необхідність посилити вже створене та забезпечити кращий контроль над морями, що лежать на наших північних та південних кордонах."
 PER_expert_raiders_desc:0 "Хоча забезпечення захисту нашої власної морської торгівлі є важливим, у часи війни, активний пошук та зрив ліній постачання нашого ворога є вирішальним для знищення функціональності їхньої економіки. Ми повинні зосередитися на використанні наших військово-морських засобів для набігів на конвої ворога."
 PER_food_for_all_idea:0 "Їжа для кожного [PER.GetAdjective]"
 PER_generic_democratic_reformer:0 "Mohammed Ali Foroughi"
 PER_imperial_events.132.t:0 "[SOU.GetNameDefCap] відхиляє нашу пропозицію"
 PER_imperial_events.211.desc:0 "Сьогодні вранці ми отримали повідомлення від [FROM.GetNameDef] про те, що вони неохоче погоджуються на наші вимоги та розпочали процес передачі прикордонної території нам. Вони не підозрюють, що це лише допоможе нам у наших махінаціях у подальшому."
 PER_increase_heavy_arms:0 "Збільшити об'єкти для важкого озброєння"
 PER_invest_in_univerity_facilities_desc:0 "Якщо ми сподіваємося конкурувати технологічно, ми повинні подбати про об'єкти, доступні для студентів, професорів та науковців. Ми не можемо дозволити, щоб наші найяскравіші уми були обмежені такими марними перешкодами, як відсутність відповідного обладнання."
 PER_iraj_eskandari:0 "Ірадж Ескандарі"
 PER_memphis_initiative_tt:0 "Відмикає рішення §YМемфіська ініціатива§!, які дозволяють нам інтегрувати завойовані території в нашу націю."
 PER_modernizing_iran_idea_desc:0 "Модернізація [PER.GetNameDef] є критично важливою, якщо ми хочемо стояти пліч-о-пліч із великими націями світу. Запускаючи цю ініціативу, ми демонструємо нашу відданість покращенню інфраструктури нашої великої нації та зобов’язуємося покращувати життя її громадян."
 PER_naval_academy_random_admirals_tt:0 "До §Yтрьох§! випадково обраних військово-морських лідерів отримають §G+1§! навичку координації"
 PER_nematollah_nassiri_operative:0 "Нематолла Нассірі"
 PER_parliament_dissolved:0 "Парламент розпущено"
 PER_price_stabilization_idea:0 "Стабілізація цін"
 PER_promoting_resistance_here:0 "Сприяння опору тут"
 PER_propagate_political_literature_desc:0 "Інститути імперської держави можуть здаватися непереборними для окремої людини, але реальність така, що її ресурси розподілені по всій нації і не можуть впоратися з децентралізованим рухом опору. Щоб здійснити зміни, ми скористаємося цією слабкістю."
 PER_push_to_mountains:0 "Південний фронт"
 PER_rally_the_reformers:0 "Створити Національний фронт"
 PER_rebuild_persepolis:0 "Відбудувати Персеполіс"
 PER_revival_party_dem_long:0 "Revival Party"
 PER_ssb_events.1.a:0 "Абсолютно, ми підпишемо його!"
 PER_ssb_events.9.desc:0 "Можливість спільної дослідницької угоди в рамках Саадабадського пакту була предметом постійних обговорень протягом деякого часу, але після тривалих дискусій нарешті було досягнуто згоди. Усі відкриття та інформація щодо досліджень мають бути спільними між членами пакту, і тепер існують системи, що дозволяють спільні дослідницькі проєкти в рамках Саадабадського пакту. Це може сприяти новій ері науки для нас, дозволяючи нам стояти серед решти світу як лідери та інноватори в науці."
 PER_train_tank_commanders_desc:0 "Щоб отримати максимальну користь від наших танкових дивізій, ними мають керувати компетентні командири. Для цього ми повинні підготувати наших військових лідерів до повернення до навчання, щоб навчитися ефективно включати танкову війну у свій великий набір тактик."
 PER_women_vote_desc:0 "На даний момент лише чоловіки можуть голосувати у справах нашого уряду. Оскільки жінки складають приблизно половину нашого населення, ми повинні забезпечити, щоб їхні голоси були почуті. Однак ми повинні бути обережними, оскільки це може змусити духовенство вважати, що ми відвертаємося від традицій."
 PHI_asean_tag_communism:0 "Союз держав Південно-Східної Азії"
