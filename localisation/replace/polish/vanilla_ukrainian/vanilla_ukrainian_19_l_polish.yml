 germany.43.d:0 "Уперті французи відмовилися слідувати нашому прикладу в Судетській кризі! Вони наполягають на своїй підтримці Чехословаччини, а оскільки ми цього не зробили, вони вирішили вийти з нашого альянсу. Не зважаючи на це, Франція продовжує готуватися до неминучої війни з Німеччиною."
 germany.60.c:0 "Вони не лишаться самі! Закликайте британців до війни!"
 germany.60.d:0 "Кілька німецьких дивізій нещодавно ввійшли в Райнланд. Уперше з часів Великої війни Німеччина розмістила війська на лівому березі Райну. Це чітке порушення Версальського договору, за умовами якого Німеччині було заборонено ремілітаризовувати цей регіон! Якщо ми не надішлемо ультиматум про виведення військ, договір не буде виконуватись."
