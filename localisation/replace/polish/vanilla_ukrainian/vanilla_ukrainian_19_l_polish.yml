 MAN_empower_the_legislative_council_desc:0 "Зараз Законодавчі збори — установа значною мірою формальна, яка у всьому погоджується з японськими правителями. Щоб стати по-справжньому суверенною державою, нам спершу потрібно досягти повної автономності у законодавчих питаннях."
