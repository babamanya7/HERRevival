 USA_combined_bomber_offensive_desc:0 "Тепер, коли ще одна наддержава на нашій стороні, ми отримали несподівані переваги в галузі планування та здійснення широкомасштабних наступальних бомбардувань."
 USA_empower_the_huac_desc:0 "Комісія з розслідування антиамериканської діяльності відіграє важливу роль у оздоровленні нашої демократії. Ми не дозволимо нелояльним елементам втручатися у політичні процеси."
 USA_establish_personal_communication_with_former_naval_person_desc:0 "Новий лідер узяв на себе роль першого міністра в державі [ENG.GetName]. Ми повинні відкрити з ним особистий діалог, допомагаючи нам підготуватися та скоординувати наш неминучий вступ у війну."
 USA_expand_the_USMC_desc:0 "У минулому корпус морської піхоти США був ключовим фактором багатьох успішних бойових операцій. Він гратиме ще більш помітну роль у морських десантних кампаніях у майбутньому. Завжди вірні!"
 USA_fascist_menace_desc:0 "Ані Версальський договір, ані економічні санкції не спинили Німеччину, і агресивний прусський мілітаризм знову набирає сили. Німеччина має бути переможена повторно, і, бодай спочатку, ми мусимо взяти її під свій контроль."
