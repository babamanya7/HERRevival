 FIN_pact_for_continuation_war_ger_tt:0 "Ефекти, коли [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! оголошує війну державі [SOV.GetFlag]§Y[SOV.GetNameDef]§!:\n[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! оголосить війну державі [SOV.GetFlag]§Y[SOV.GetNameDef]§!."
 FIN_personal_agenda_svinhufvud_tt:0 "§G$FIN_bop_modifier_eradicate_socialism$§!: Менш ніж §Y1%§! підтримки демократії та комунізму збільшить £GFX_power_balance_texticon §Yдовіру громадськості§!.\n  - §R$FIN_bop_modifier_concerning_support_for_socialists$§!: Більш ніж §Y9%§! підтримки демократії або комунізму зменшить £GFX_power_balance_texticon §Yдовіру громадськості§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_preserve_sapmi_desc:0 "Народ саамів протягом тривалого часу страждав від імперіалістичного гніту як у межах наших кордонів, так і за їх межами. Ми повинні загладити провину з цими людьми та допомогти їм звільнити їх від їхніх постійних страждань від рук наших сусідів."
