 GER_ballistic_missile_equipment_2_short:0 "A8"
 GER_befriend_czechoslovakia:0 "$GER_czech_friend$"
 GER_break_the_anglo_french_colonial_hegemony:0 "Розбити англо-французьку колоніальну гегемонію"
 GER_build_the_rur_dam_desc:0 "Будівництво Рурської греблі — це більше, ніж просто інженерний подвиг, це інвестиція в майбутнє. Гребля не лише сприятиме економічному розвитку регіону, але й допоможе стимулювати наші промислові зусилля та обсяги виробництва."
 GER_build_volkshalle_landmark_tt:0 "Замінює §Y$landmark_berlin_reichstag$§! на §Y$landmark_berlin_volkshalle$§!"
 GER_bypass_maginot_in_the_south_desc:0 "Британія має свої інтереси в Бельгії та Нідерландах, тому нам потрібен новий обхідний шлях навколо лінії Мажіно. Гірський ландшафт південного напрямку буде важко перетнути, але німецька винахідливість не дасть нам зникнути."
 GER_closer_sino_germanic_relations_desc:0 "[CHI.GetAdjective] вже давно є нашим союзником, і багато хто вважав імовірним, що вони вступлять у Велику війну на нашому боці. Ми маємо зміцнити цей зв'язок між нашими державами."
 GER_communist_propaganda:0 "[GER.GetAdjective]а червона загроза"
 GER_communist_propaganda_decision:0 "Пропаганда комунізму в державі [FROM.GetNameDef]"
 GER_cv_nav_bomber_equipment_2_short:0 "Ar 195"
 GER_czechoslovakia_desc:0 "На південь від нас, у [CZE.GetNameDef], є ще робітники, закуті в кайдани капіталізму. Вони ще не повністю осягнули істину справжнього комунізму, і ми мусимо принести її їм — будь-якими засобами. Такий наш обов'язок як товаришів."
 GER_danzig_or_war_desc:0 "Данциґ був німецьким, Данциґ залишався німецьким, і Данциґ буде німецьким! Якщо Польща не поступиться ним, необхідно підготувати німецький народ до неминучої війни. Данциґ і навколишні землі повернуться до Німеччини!"
 GER_danzig_vs_slovakia_desc:0 "Поляки є на заваді в наших планах на «життєвий простір», але ще не пізно змінити довгострокові пріоритети та запропонувати їм дружбу. Єдиний спосіб цього досягти територіальний: ми могли б обміняти Данциґ на Словаччину. Польща вже виявила свій інтерес у цьому регіоні, коли окупувала Заолшя."
 GER_demand_memel:0 "Відновити претензії на схід"
