 PHI_modify_defense_strategy_dynamic_modifier_tt:0 "Змінює §Y$PHI_defense_strategy_dynamic_modifier_tt$§!:"
 PHI_mosquito_fleet_desc:0 "Одна торпеда або один снаряд можуть націлитися і потопити один корабель. Тому ми повинні мати не просто один корабель, а цілий рій. Вони можуть дістати одного, десять, навіть сотню, але вони не зможуть потопити нас усіх! Гірше того, достатньо, щоб лише один із наших власних пострілів влучив у ціль, а з нашим роєм ми навряд чи схибимо."
 PHI_polynesia_tag_democratic_ADJ:0 "Австронезійськ"
 PHI_reconciliation_with_spain_neutral:0 "Іспанія мала беззаперечний вплив на розвиток нашої нації, але значна частина нашої недавньої історії була антагоністичною через наші колоніальні зв'язки. Тим не менш, не можна заперечувати, що ми маємо з ними більше спільного, нам просто потрібно зустрітися на рівних."
 PHI_reduce_unneccessary_expenditure_desc:0 "Тепер, коли у нас є національна фіскальна політика, ми повинні переконатися, що баланс зведений правильно. Ми хочемо досягти цього не підвищенням податків чи переслідуванням тих, хто їх уникає, а скоріше зрізанням зайвого «жиру». Зрештою, якщо ми ще не надаємо ці послуги, хто за ними сумуватиме?"
 PHI_request_equipment:0 "Запитати спорядження у [?host.GetName]"
 PHI_resistance_engineer:0 "Інженер руху опору"
 PHI_second_republic_tag_war_democratic_ADJ:0 "$PHI_second_republic_tag_democratic_ADJ$"
 PHI_second_republic_tag_war_fascism_ADJ:0 "$PHI_second_republic_tag_fascism_ADJ$"
 PHI_slippery_slope:0 "Слизький шлях"
 PHI_sugar_barons:0 "Цукрові барони"
 PHI_the_hunters_desc:0 "Кадети Філіппінської військової академії втекли у підпілля, коли окупанти закрили заклад. Відтоді вони сформували загін «Мисливці» і добре використовують свої навички, навчаючи місцевих жителів бойовим прийомам і збору розвідданих, щоб активно боротися з нашими ворогами навколо Маніли."
 PHI_transfer_20_percent_navy_tt:0 "Передати 20% наших військово-морських сил [FROM.GetNameDef]."
 PHI_wendell_fertig:0 "Wendell Fertig"
 PLAYER_AI_PREFS_DISABLED:0 "Опція доступна тільки під час гри в мережі."
 PNG_democratic_DEF:0 "Папуа Нова Ґвінея"
 POK_neutrality_DEF:0 "Султанат Понтіанак Кадріяг"
 POL_SANATION_fascism_DEF:0 "Польська санаціоністська хунта"
 POL_abolish_segregated_seating_desc:0 "Польща — це країна людей різних етносів, культур і віросповідань, але в нашій освіті ми тримаємо їх окремо. Якщо всі вони справді поляки, то повинні бути разом і вільно обмінюватися ідеями. Сегрегація лише вадить нашій освіті, і її необхідно скасувати."
 POL_anti_tank_guns_desc:0 "Будь-який ворог неодмінно розгорне проти нас танки. Ми повинні бути готові надати їм теплий прийом."
 POL_appoint_nationalist_ministers:0 "Націоналістичні політичні кампанії"
 POL_april_constitution_fas_1:0 "$POL_april_constitution_fas$"
 POL_april_constitution_right_desc:0 "$POL_april_constitution_1_desc$"
 POL_arm_peasant_militia:0 "Озброїти селянське ополчення"
 POL_battleship_1:0 "Клас «Piast»"
 POL_communal_governance_desc:0 "Селянська війна, хоч і була необхідною, але принесла хаос і спустошення нашому селу. Зараз настав час для відбудови та створення органів місцевого самоврядування в наших сільських громадах, які допоможуть загоїти шрами війни."
 POL_crackdown_in_lviv:0 "Репресії у Львові"
 POL_diplomatic_mission_to_CZE:0 "Дипломатична місія в державу [CZE.GetNameDef]"
 POL_diplomatic_mission_to_TUR_desc:0 "$POL_diplomatic_mission_to_FIN_desc$"
 POL_expand_central_industrial_region:0 "Осучаснити галицьку промисловість"
 POL_expansion_of_new_towns_desc:0 "Тепер, коли захід відвойований у німців, ми повинні розвивати зростаючу промисловість у таких містах, як Ґдиня, які стрімко наближаються до Варшави за своєю величчю."
 POL_friedrich_christian:0 "Фрідріх Крістіан"
 POL_heavy_cruiser_2:0 "Клас «Wisła»"
 POL_hel_fortified_area:0 "Гельська укріплена зона"
 POL_join_CZE_industry:0 "Приєднати чеську промисловість"
 POL_liberalism:0 "Лібералізм"
 POL_militarism_focus:0 "Польський мілітаризм"
 POL_military_youth_desc:0 "Залучення нашої молоді до організацій, що пропагують дисципліну та національну ідеологію, сприятиме вихованню лояльного покоління майбутніх рекрутів."
 POL_peasants_strike_desc:0 "На сході кипить напруженість. Якщо ми не вирішимо цю кризу якомога швидше, ми цілком можемо зіткнутися з громадянською війною. Страйк, організований лідером Селянської партії Станіславом Міколайчиком, сформував коаліцію демократів, соціалістів і комуністів в опозиції до польського уряду та, якщо його проігнорувати, він спровокує повстання."
 POL_polish_shock_battallions_desc:0 "Спеціально підготовлені ударні батальйони під назвою Uderzeniowe Bataliony Kadrowe є збройним крилом Конфедерації нації, готовим померти, щоб утримати Варшаву від ворога."
 POL_press_for_liberia_desc:0 "У 1932 році польський і ліберійський уряди домовилися про передачу Ліберії під опіку Польщі. Американці сприймають нашу присутність у Ліберії як образу, але ця країна є вразливою і гостро потребує польського захисту."
 POL_promote_falangism_central_america:0 "Просувати фалангізм у §YЦентральній Америці§!"
 POL_promote_falangism_decisions:0 "Просувати фалангізм"
 POL_radicalize_poles_in_germany:0 "Радикалізувати польських бойовиків у Німеччині"
 POL_restore_poland_hungary:0 "Відновити Польсько-Угорщину"
 POL_royal_dictatorship:0 "Установити диктатуру короля"
 POL_royal_guard:0 "Королівська гвардія"
 POL_royal_hussars:0 "Відновити королівських гусарів"
 POL_royal_officer_corps:0 "Королівський офіцерський корпус"
 POL_seek_an_alliance_with_kaiser_desc:0 "Своїм існуванням Королівство Польща завдячує Акту від 5 листопада — декларації, зробленій кайзером Німеччини, який пообіцяв виокремити нове польське королівство з окупованої Росією Конгресової Польщі. Наразі невідомо, якими є плани кайзера щодо Польщі, але, можливо, м'яке нагадування про декларацію Німецької імперії могло б посіяти зерно для малоймовірного союзу."
 POL_ship_light_battery_1:0 "130mm/40 Model 1924"
 POL_sideline_the_right_desc:0 "Хоча праві могутні, спільним ударом лівих і Замку вони можуть стати політично неактуальними."
 POL_stanislaw_radkiewicz:0 "Станіслав Радкевич"
 POL_strat_bomber_equipment_3_short:0 "Szerszeń"
 POL_support_monarchy_in_CZE_desc:0 "Панування Габсбурґів над Чехословаччиною швидко відходить у далекі часи, але зараз, коли Габсбурґ на нашому троні, а польська ідентичність сильна, ми маємо можливість просувати західнослов'янську ідентичність і наполягати на претензіях Габсбурґів на Богемію."
 POL_support_right_paramilitaries:0 "Підтримати праві воєнізовані організації"
 POL_tac_bomber_equipment_0_short:0 "Żubr"
 POL_tomislaw_lupaszko:0 "Томіслав Лупашко"
 POL_trust_in_the_west:0 "Довіра Заходу"
