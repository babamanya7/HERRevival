 SOV_belarus_tt:0 "[BLR.GetNameDefCap] отримає незалежність, коли закінчиться [GetSovietCivilWarName]"
 SOV_build_national_academy_of_sciences_integrated_republic_KYR_desc:0 "Ми збудуємо [KYR.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_capital_of_the_tsars:0 "Столиця царів"
 SOV_carefully_planned_assassination_desc:0 "Агент НКВС іспанського походження Рамон Меркадер потоваришує з довіреними особами Троцького, потім переїде до Мексики, де видаватиме себе за симпатика Троцького, чекаючи на слушний момент для здійснення вбивства."
 SOV_characters_will_be_purged_tt:0 "§RОсь ці персонажі будуть піддані чистці та будуть видалені з гри:§!"
 SOV_cohesion_first:0 "Згуртованість передусім"
 SOV_desperate_measures_decisions_unlocked_tt:0 "Відкриває доступ до кількох рішень §Y$SOV_great_patriotic_war$§!."
 SOV_dismiss_the_counter_revolution_desc:0 "Публічно засуджуючи будь-які розмови про контрреволюцію, ми зможемо відвернути увагу НКВС від наших агентів. Однак це також може означати, що ми втратимо частину прихильників, які повірять у фальшиве звільнення."
 SOV_embrace_the_black_hundreds_tt:0 "Відмикає §Yрішення на мапі§! про проникнення в області; це зробить їх підконтрольними на початку §Y[GetSovietCivilWarName]§!."
 SOV_expand_nkvd_opposition:0 "Розширити військовий відділ НКВС"
 SOV_expand_the_morskaya_aviatsiya_desc:0 "Літаки вже кардинально змінили характер наземної війни. У майбутньому вони становитимуть значну небезпеку навіть для найсучасніших надводних кораблів. Ми мусимо гарантувати, що у нас завжди буде сучасна морська авіація для підтримки інших наших кораблів."
 SOV_expand_the_red_fleet:0 "Розширити [GetSovietArmyAdjectiveBasedOnIdeology]ий флот"
 SOV_experts_in_camouflage_desc:0 "Щоби досягти та зберегти елемент несподіванки, ми мусимо бути абсолютно впевнені, що ворог не помітить позицій або пересування наших військ, поки не стане занадто пізно. Кожен солдат повинен бути навчений мистецтву маскування."
 SOV_fyp_controlled_factories_tier_5_tt:0 "Більш ніж §Y[?ROOT.SOV_fyp_factory_requirement_tier_5]§! заводів під контролем (наразі §[GetColorControlledFactoriesTier5][?ROOT.num_of_controlled_factories]§!)"
 SOV_generic_industry_relocation_desc:0 "Евакуація важкого обладнання наших заводів області [FROM.GetName] на Урал — величезна справа, але вона необхідна для забезпечення нашого військового виробництва."
