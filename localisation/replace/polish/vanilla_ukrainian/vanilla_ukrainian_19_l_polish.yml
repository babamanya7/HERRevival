 JAP_secure_control_from_army_decision:0 "Забезпечити контроль над §Y[FROM.GetName]§!"
 JAP_seek_foreign_investments_tt:0 "Розблоковує рішення §YЗалучити іноземні інвестиції§! для отримання §Yцивільних фабрик§! в обмін на §Yполітичну владу§!"
 JAP_socialism_in_one_state:0 "Соціалізм в одній державі"
 JAP_sorge_incident_tt:0 "Різні [SOV.GetAdjective]і громадяни та їхні зв'язки в нашій країні, підозрювані у шпигунстві, будуть заарештовані"
 JAP_stir_communist_sentiments_in_south_asia_decison:0 "Розпалювати комуністичні настрої в §Y[FROM.GetNameDef]§!"
 JAP_strike_on_the_southern_resource_area:0 "Ударити по південній ресурсній зоні"
 JAP_the_flying_geese_desc:0 "Технологічний розвиток у Південно-Східній Азії може керуватися лише нашим власним розвитком, і азійські країни наздоганятимуть Захід як частина регіональної ієрархії, де виробництво масових товарів безперервно переміщуватиметься від більш розвинених країн до менш розвинених. Подібно до гусей у клині, ми прокладатимемо шлях для розвитку Азії!"
 JAP_the_lecture_group_ascendant:0 "Сходження Групи лекцій"
 JAP_the_showa_constitution_desc:0 "Ми з повагою ставимося до імперської історії нашої країни. Однак у Японії, яку хочемо побудувати, не місце авторитарному правлінню. Ми збережемо символічний пост імператора, але обмежимо його владу конституцією, як це зроблено у багатьох західних країнах."
 JAP_the_ultimate_battleship:0 "Неперевершений лінкор"
 JAP_tokko_idea_lar_desc:0 "Спеціальна вища поліція — це організація, створена з метою забезпечення дотримання цивільного права, контролю за політичними групами та ідеологіями, які вважаються загрозливими для громадського порядку нашої нації. Пильно стежачи за людьми всередині нашої країни, вони діють як авангард проти іноземних агентів, а також політичних дисидентів."
 JUNO_anti_communist_action:0 "Чилійська антикомуністична дія"
 JUNO_brazil_events.132.t:0 "[FROM.GetNameDefCap] відмовляється від зобов'язань"
 JUNO_brazil_events.143.a:0 "Ми повинні розібратися з цим, перш ніж це вийде з-під контролю."
 JUNO_brazil_events.152.desc:0 "Під час нашої останньої правоохоронної операції на Північному Сході Бразилії Лампіау, найвідоміший з Канґасу, був убитий у перестрілці з поліцією. Член банди Лампіау зрадив його, що дозволило поліції влаштувати засідку на групу в їхньому сховку. Хоча багато невеликих груп бандитів продовжують бродити по сільській місцевості, це, здається, знаменує кінець великомасштабних операцій Канґасу."
 JUNO_brazil_events.41.t:0 "[FROM.GetNameDefCap] приймає анексію"
 JUNO_brazil_events.43.desc:0 "Незважаючи на їхню войовничу риторику та бажання включити нас до своєї нації, схоже, [BRA.GetAdjective] готовність насправді йти з нами на війну не матеріалізувалася. Дипломати з [BRA.GetNameDef] повідомили нам, що вони будуть прагнути альтернативних засобів для отримання нашої території, але робитимуть це мирним шляхом. Принаймні, поки що."
 JUNO_brazil_events.45.t:0 "[BRA.GetNameDefCap] висуває ультиматум"
 JUNO_brazil_events.62.desc:0 "Наша недавня пропозиція [POR.GetNameDef] викликала несподівану відповідь. [POR.GetNameDefCap] відхиляє ідею об'єднання, але натомість пропонує співдружність для наших двох націй. Це дало б нам деякі переваги об'єднання, менше недоліків, і дозволило б обом нашим націям зберегти свою унікальну ідентичність."
 JUNO_brazil_events.63.desc:0 "Наша пропозиція про об'єднання [POR.GetNameDef] була зустрінута байдужим відхиленням. Незважаючи на наші найкращі зусилля, щоб змусити їх побачити переваги цієї угоди, [POR.GetAdjective] не зацікавлені в повторному об'єднанні наших країн."
 JUNO_brazil_events.70.desc:0 "[FROM.GetAdjective] дипломати передали нашим ультиматум. Вони заявляють, що, враховуючи хиткий стан світових справ, вони не вважають, що ми здатні захистити наші заморські території. Через історичні зв'язки вони вважають, що самі підходять для цього. Таким чином, вони вимагають, щоб ми негайно передали контроль над їхніми територіями."
 JUNO_brazil_news.5.d:0 "Триваюче заворушення в [BRA.GetNonIdeologyName] вийшло з-під контролю в останні дні, що призвело до кривавої громадянської війни. Уряд зірвав змову комуністичного руху з метою повалення режиму в 1935 році, але не зміг зупинити більшу червону хвилю. Хоча більша частина військових залишилася лояльною центральному уряду, багато молодших офіцерів стають на бік комуністів. Багато хто в регіоні стурбований тим, що комуністична [BRA.GetNonIdeologyName] спричинить ланцюгову реакцію по всьому континенту Південної Америки."
 JUNO_father_of_industrialization:0 "Батько індустріалізації"
 JUNO_guay_events.1.desc:0 "Військові офіцери висловили свою підтримку керівному уряду. Стратегія умиротворення спрацювала, і здається, що кошти, що спрямовуються у військові, мали додаткові переваги."
