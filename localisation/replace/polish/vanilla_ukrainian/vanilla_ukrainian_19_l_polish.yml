 GRE_ATTITUDE_TOOLTIP:0 "§YСтавлення§! відображає бажання фракції співпрацювати з урядом.\n§GДружні§! та §Gлояльні§! фракції даватимуть стабільність і бонуси до людських ресурсів.\n§RВорожі§! фракції зменшуватимуть стабільність.\nБайдужі та §gнесуттєві§! не даватимуть жодних бонусів і штрафів."
