 TUR_expanding_the_saadabad_pact_desc:0 "Саадабадський договір був гідною ініціативою кемалістів, але тепер, без сумніву, у нас із його учасниками більше спільного, ніж будь-коли раніше. Не будемо витрачати час на півзаходи — час звернутися до членів Саадабадського договору, щоби перевести цю угоду в офіційний союз."
 TUR_gw_tank_equipment:0 "Renault FT-17"
 TUR_imperialist_puppets:0 "Імперіалістична маріонетка"
 TUR_infrastructure_privatised_idea:0 "Приватизована інфраструктура"
 TUR_integrated_german_officers:0 "Інтегровані німецькі офіцери"
 TUR_kemalist_army_officers_extended_power_loyal_desc:0 "Офіцери елітного турецького корпусу — одні з найбільших захисників кемалістських цінностей. Кемалізм швидко завойовує серця і розуми жителів Туреччини, як того і хотів би Ататюрк. Офіцерський корпус діє спільно з урядом, захищаючи турецький суверенітет від всіх зазіхань."
 TUR_kemalist_army_officers_limited_power_disloyal:0 "Офіцери-кемалісти"
