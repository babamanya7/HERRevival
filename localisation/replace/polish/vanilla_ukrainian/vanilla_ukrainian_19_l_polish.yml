 AAT_MIO_events.2.c:0 "Інвестувати в $CZE_skoda_artillery$."
 AAT_Sweden.1.b:0 "Немає причин, чому Перу Альбіну сліди іти у відставку."
 AAT_Sweden.1.t:0 "Урядова комісія рекомендує переозброєння"
 AAT_Sweden.23.desc:0 "Держава [FROM.GetName] звернулася з проханням приєднатися до нашого альянсу через занепокоєння щодо можливої післявоєнної напруженості між державами-переможницями. Приєднання держави [FROM.GetName] до нашого альянсу розширить наш вплив у їхньому регіоні, але, звісно, зобов'яже нас захищати їх у разі виникнення конфлікту."
 AAT_Sweden.25.desc:0 "Після довгих дискусій серед вищого військового керівництва про те, як розподілити фінансування для нових спецпідрозділів, процес зупинився. Здається, що єдиний спосіб вийти з глухого кута — це втручання уряду, який мусить підтримати одну з пропозицій."
 AAT_Sweden.3.axel_is_not_leader:0 "Нехай Фермерська партія мусить отримати шанс."
 AAT_Sweden.31.a:0 "Ми не можемо дозволити собі сперечатися з державою [FROM.GetName]."
 AAT_Sweden.40.desc:0 "Як і в 1919 році, [FROM.GetAdjective]ий уряд знову замахнувся на Оландські острови. Незважаючи на рішення Ліги Націй про передачу нам суверенітету над островами, [FROM.GetName], схоже, не може залишити нас у спокої. Можливо, вони вважають, що ми перебуваємо у слабкій позиції, а з розпадом Ліги вони відчувають запах крові у воді; всі вони — вперті опортуністи."
 AAT_Sweden.45.t:0 "[FROM.GetName] відмовляється демілітаризовувати область [148.GetName]"
 AAT_Sweden.50.t:0 "[SWE.GetName] вимагає область [144.GetName]"
 AAT_Sweden.7.a:0 "Ой леле."
 AAT_Sweden_BoP.10.desc:0 "Політичний сезон знову наближається, і партії, що змагаються за контроль над Ріксдаґом, ведуть активну передвиборчу кампанію. Головним питанням, яке привернуло увагу електорату, є економіка. Одні виступають за продовження поточної політики, інші хочуть радикальних змін, але вирішити це можна лише одним чином."
 AAT_Sweden_BoP.14.d_fascist:0 "День виборів настав, і виборці зробили свій вибір. $SWE_fascism_party_long$ сформує мажоритарний уряд найближчими днями, і ніхто не здивований так, як вони. Як довго демократичний апарат Швеції протримається — невідомо."
 AAT_Sweden_ball_bearing.2.a:0 "Взаємовигідна торгівля."
 AAT_Sweden_communism.1.a:0 "Стурбованість"
 AAT_Sweden_communism.1.desc:0 "Нарешті ми отримали владу в уряді, і в той час як [ROOT.GetDemocraticParty] прийняла волю виборців з милістю, на яку заслуговує демократія, ультраправі партії сприйняли цей факт критично, ставлячи під сумнів легітимність голосування. Поки що це лише незгодні, але ми повинні подбати про те, щоб не стало гірше."
 AAT_Sweden_flashpoints.16.a:0 "Саме час було відступитися."
 AAT_Sweden_flashpoints.21.a:0 "Нам слід більше просувати співпрацю між нашими державами."
 AAT_Sweden_flashpoints.37.desc:0 "[SWE.GetAdjectiveCap]ий уряд суворо відкинув наш ультиматум, заявивши, що ми не мусимо сприймати їхній нейтралітет як визнання слабкості або поганої підготовки. Вони також заявили, що наші військові повинні бути готові до серйозних втрат, якщо будуть вжиті необдумані дії проти держави [SWE.GetName].\n\nЦе може бути просто блефом для стримування військових дій, але спостереження за шведськими військами показують, що вони готові боротися за свою незалежність."
 AAT_Sweden_flashpoints.42.t:0 "[GER.GetName] просить прохід військ"
 AAT_Sweden_flashpoints.60.desc:0 "Держава [SWE.GetName] захопила контроль над Landsverk — компанією, з якою ми працювали разом із [SWE.GetAdjective]ими промисловцями над розробкою бронетехніки. Хоча корисність Landsverk для нас зменшилася за останні роки, це явна ознака того, що [SWE.GetName] бажає дистанціюватися від держави [GER.GetNameDef]."
 AAT_Sweden_flashpoints.71.desc:0 "Чотири колишні [ITA.GetAdjective]і винищувачі сьогодні прибули до одного з наших портів. Кораблі були придбані [SWE.GetAdjective]им урядом і наразі передаються державі [SWE.GetName]. Поки вони перезаправляються, ми могли б узяти контроль над ними та можливо використати їх дял себе. Однак, це ймовірно може пошкодити наші стосунки з державою [SWE.GetName]."
 AAT_Sweden_flashpoints.79.a:0 "Шкода."
 AAT_Sweden_flashpoints.83.t:0 "[SWE.GetName] відмовляється"
 AAT_Sweden_nationalists.10.t:0 "Офіцери пропонують підтримку"
 AAT_Sweden_nationalists.16.t:0 "Катастрофічний королівський візит до провинції [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.20.b:0 "Всі території належать Райхові!"
 AAT_Sweden_nationalists.26.a:0 "Verdammt"
 AAT_Sweden_nordic_defense_council.2.t:0 "[FROM.GetName] долучається до Нордичного оборонного союзу"
 AAT_USA_events.01.desc:0 "[USA.GetAdjective] уряд на чолі з [USA.GetLeader] оголосив про окупацію Ґренландії в рамках нової операції під назвою \"Ґренландський патруль\", що має на меті убезпечити Північну Америку від іноземних загроз та впливу, як це було вирішено на Гаванській конференції. Вони пообіцяли повернути її нам, як тільки ситуація у світі заспокоїться."
 AAT_finland_diplomacy.16.t:0 "[FROM.GetAdjective]ий уряд відхиляє наші вимоги"
 AAT_finland_diplomacy.25.t:0 "[FROM.GetNameDef] відхиляє наше прохання про захист"
 AAT_finland_political.02.desc:0 "Сьогодні [ROOT.GetLeader] знову стоїть перед необхідністю боротися за посаду президента, і здобути перемогу буде непросто... \n\nНе дивлячись на перебування на посаді президента з 1931 року та чималі заслуги, [ROOT.GetLeader.GetHerHis] становище значно похитнулося після відмови допустити до уряду соціал-демократів всупереч власним обіцянкам. Ця політична помилка значно знизила шанси на новий президентський термін. Сьогодні ми дізнаємося, чи зможе [ROOT.GetLeader.GetHerHis] перемогти [GetPoliticsDescriptionOldManPete]."
 AAT_finland_the_white_death.7.desc:0 "Хоч як старалися наші солдати, але Біла Смерть залишається на волі й тижнями наводить жах на армію за цілковитої нездатності офіцерів будь-що їй завадити. Бойовий дух неухильно падає..."
 AAT_germany.2.a:0 "Прикро."
 AAT_germany.2.desc:0 "Держава [FROM.GetName] відхилила нашу пропозицію, заявивши, що на даний момент вона не відповідає їхнім інтересам.\nВони підкреслюють, що не мають до нас ніяких негативних намірів, але на даний момент мають інші пріоритети."
 AAT_norway.16.desc:0 "Незважаючи на наш трагічний відступ із держави [NOR.GetName], ми можемо принаймні знайти розраду в тому, що наші лідери мали передбачливість підготуватися до найгіршого і перенаправили ресурси, щоб служити нам у відвоюванні [NOR.GetAdjective]ої території.\n\nЦі інструменти мають полегшити початок одіссеї до наших давніх берегів."
 AAT_norway_communist.8.a:0 "Їм тут раді!"
 AAT_norway_communist.8.desc_DEN:0 "Наш принц Карл, або Гокон VII, як його називали протягом багатьох років, повернувся до держави [ROOT.GetName].\n\nПринц Карл був раптово скинутий і засланий після жахливої комуністичної революції, і тепер повинен прийняти життя у вигнанні в нашій країні разом зі своєю сім'єю."
 AAT_norway_rikstanken.2.b:0 "Нам потрібні числа, щоби конкурувати."
 AAT_rikstanken_program_tech_bonus:0 "Норвезька танкова програма"
 ABDA_develop_naval_infrastructure_desc:0 "Тривалі військово-морські операції в Тихому океані вимагають баз, складів пального та ремонтних потужностей. Інвестиції в інфраструктуру наших портів і якірних стоянок розширять радіус дії та витривалість військово-морських сил ABDA."
