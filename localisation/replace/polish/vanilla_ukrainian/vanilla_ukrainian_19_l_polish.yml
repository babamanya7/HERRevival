 marcel_gensoul:0 "$FRA_marcel_gensoul$"
 marine_commando_desc:0 "Війська, що спеціалізуються на десантних операціях, стають все більш необхідними. Імпровізовані методи і спорядження відходять у минуле, оскільки наша морська піхота підтримується спеціалізованими десантними кораблями і тренуваннями."
 marine_corps_tech_bonus:0 "Бонус до цілі $marine_corps_goal_name$"
 marines_expeditionary_blowtorch_desc:0 "Ідеальне поєднання морських, повітряних і спеціалізованих сухопутних сил здатне забезпечити безпеку будь-якої цілі. Цей підхід із погляду спільнодії до наступальної війни має стати проявом нашої логістичної майстерності."
 marines_expeditionary_support:0 "Експедиційні оперативні групи"
