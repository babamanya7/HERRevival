 soemu_toyoda:0 "$JAP_soemu_toyoda$"
 south_american_events.20.desc:0 "Нещодавно надійшло несподіване комюніке від [PRU.GetAdjective]их дипломатів. У ньому містилася пропозиція умовного миру: вони віддають нам Лорето, а ми виводимо свої війська з решти території їхньої країни. Нам потрібно буде ретельно це обміркувати, ми можемо задовольнитися тим, що маємо зараз, або продовжити боротьбу в надії отримати ще більше територій."
 south_american_news.12.d:0 "Після найбільшого страйкового руху, відомого до цього часу в Болівії, військові на чолі з молодим підполковником Херманом Бушем виступили за повалення справжнього республіканського уряду Хосе Луїса Техади Сорсано. Вони стверджували, що, на відміну від Техади, стоять на боці болівійського народу та його соціалістичних ідеалів, але оскільки їм не вдалося захопити Ла-Пас, поліція та решта армійців вистежили їхню групу та ув'язнили їхніх лідерів."
 southern_resource_area_desc:0 "Британський Борнео і багата Нідерландська Ост-Індія є дуже цінними стратегічними цілями. Японія повинна заволодіти нафтовими родовищами і каучуковими плантаціями, інакше її виробництво відчуватиме нестачу ресурсів, а військова машина зупиниться."
 soviet.2.d:0 "Наш рейд маньчжурського кордону, де зосереджувалися японські війська, закінчився успіхом! Ми впіймали їх до того, як вони змогли закінчити підготовку, і наші хоробрі солдати завдали їм потужного удару внаслідок жорстокої сутички з ними."
 soviet.20.d:0 "Незважаючи на викрадення лідера [From.GetLeader], націоналісти відмовилися вступати в переговори про перемир'я з комуністами. На жаль, китайці і надалі перебуватимуть у жорстокому конфлікті з власним народом, роблячи його легкою здобиччю для своїх ворогів."
 soviet.26.b:0 "Рокоссовський відмовляється зізнаватися, але йому не можна дозволити жити."
 soviet.3.d:0 "Наш рейд маньчжурського кордону, де зосереджувалися японські війська, закінчився невдачею! Ворог стримав і оточив наші війська, які понесли важкі втрати перш ніж змогли вийти з бою."
 soviet.54.d_nopurge:0 "Зі зменшенням влади комуністичної партії давно стало зрозуміло, що сталінська система нежиттєздатна.\n\nНові сили піднялися, щоби захопити владу, посилаючися на російські ідеали з метою повести нашу країну новим шляхом.\n\nСимволізуючи цей перехід, [Root.GetLeader] скинув Сталіна та помістив його під домашній арешт, далеко від владних кабінетів, де він розробив так багато своїх небезпечних проєктів.\n\nПо мірі того, як нова російська система зростає, щоби замінити гниючий труп партії, секретність, параноя та політичні змови старого генерального секретаря підходять до кінця."
 sp_air_generic_reward_test_failure_2:0 "Розрив бомби"
 sp_air_helicopter_desc:0 "Розробка вертольота з його унікальною здатністю зависати на місці може забезпечити критично важливу тактичну перевагу у військових операціях."
