 PEACE_CONFERENCE_BID_WILL_RESULT_IN_CONFLICT:0 "Вимогу до цієї вимоги приведе до £peace_conf_icons|3 §Rзаперечення§! вимог."
 PEACE_CONFERENCE_COST_TOO_HIGH_NEXT_PARTICIPANT:0 "§RВи не можете висунути ці вимоги цього ходу, оскільки це знизить ваші бали надто низько відносно наступного учасника конференції.§!"
