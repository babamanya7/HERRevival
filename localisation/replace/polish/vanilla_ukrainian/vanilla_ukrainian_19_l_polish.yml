 GER_erwin_rommel:0 "Ервін Роммель"
 GER_expand_transcacuasian_administrative_duties_decision:0 "Поширити транскавказькі адміністративні повинності на Північний Кавказ"
 GER_felix_steiner:0 "Фелікс Штайнер"
 GER_four_year_plan_desc:0 "Нам потрібен амбіційний план переозброєння та досягнення повної самодостатності нашої нації. Поставлені завдання мають бути досягнуті за чотири роки."
 GER_fund_the_film_department:0 "Фінансувати відділ кінематографії"
 GER_german_war_economy_desc:0 "Народ нашої великої нації має послужити на благо нашої обороноздатності. Ми переходимо на повномасштабну економіку воєнного часу і сподіваємось, що кожен серйозно поставиться до свого громадянського обов'язку."
 GER_growing_public_dissent_mission:0 "Зростання суспільної незгоди"
 GER_heavy_cruiser_2:0 "Клас «Hipper»"
 GER_heavy_cruiser_2_desc:0 "Важкі крейсери класу «Admiral Hipper» були першими важкими крейсерами Кріґсмаріне. Офіційна водотоннажність становила 10 000 тонн, але насправді вона перевищувала 16 000 тонн. Вони були озброєні вісьмома 8-дюйм. гарматами в чотирьох спарених баштах, з додатковою батареєю з дванадцяти 105-мм гармат."
 GER_hilfskreuzer_cat:0 "Допоміжний крейсер"
 GER_holy_roman_empire_of_the_german_nation_idea:0 "Священна Римська імперія німецької нації"
 GER_infantry_equipment_1:0 "Karabiner 98k"
 GER_inner_circle.02.b:0 "[GetAscendedAdvisorName2] найкраще підходить для цього завдання."
 GER_inner_circle.03.desc:0 "У найближчому колі [GER.GetLeader] спалахнула гостра боротьба за владу. Напруга зросла, коли [GetIntrigueCharacterName] здобув вплив і більші повноваження. [GetIndustrialReichsleiterNames] публічно критикують методи одне одного щодо управління промисловістю та виробництвом зброї, змагаючись за прихильність фюрера."
 GER_integration_of_puppet_economies_desc:0 "Коли ми дивимося на те, як живуть наші підлеглі, стає зрозуміло, наскільки погано вони керують своєю економікою. Хоча, звісно, це в першу чергу впливає на них самих, вони також тягнуть нашу економіку донизу. Фюрер вимагає, щоб із цією проблемою щось було зроблено!"
 GER_light_tank_artillery_equipment_3:0 "Waffenträger Leopard"
 GER_light_tank_destroyer_equipment_1_short:0 "Marder II"
 GER_medium_tank_artillery_equipment_1:0 "Grille"
 GER_medium_tank_artillery_equipment_2_short:0 "Hummel"
 GER_medium_tank_destroyer_equipment_2:0 "Jagdpanzer IV"
 GER_medium_tank_equipment_2:0 "Panzerkampfwagen IV"
 GER_military_dictatorship_desc:0 "Велика війна довела, що одного кайзера недостатньо, щоби правильно керувати державою. Як і раніше, Верховне командування армії повинно знову отримати диктаторські повноваження та стати єдиною політичною силою в Імперії."
 GER_mio_trait_anti_tank_specialization:0 "Протитанкова спеціалізація"
 GER_mitteleuropa_economic_integration_cat:0 "Економічна інтеграція"
 GER_modify_bewegungskrieg_modifier_tt:0 "Змінює §Y$GER_bewegungskrieg_modifier$§!:"
 GER_monarchist_sentiment_desc:0 "Народ хоче монархії — і він її отримає. Хоча конкретна форма правління ще не визначена, очевидно, що німецькому народові потрібен свій кайзер."
 GER_no_reds_in_western_europe_FRA_tt:0 "Отримати ціль війни §YПовалення уряду§! проти §YФранцузької комуни§!.\n"
 GER_norman_stewart:0 "Норман Бейллі-Стюарт"
 GER_occupy_macedonian_decision:0 "Окупувати Македонію"
 GER_offer_military_production_support_desc:0 "Східні буферні держави не мають потужної промислової бази, як у нас. Ми повинні запропонувати їм допомогу у виробництві зброї та боєприпасів, щоб вони змогли протриматися хоча б певний час у разі нападу з боку [SOV.GetNameDef]."
 GER_operation_marita:0 "Операція «Маріта»"
 GER_operation_panzerfaust_events.09.a:0 "Ми в безпеці... поки що"
 GER_operation_panzerfaust_events.10.b:0 "Ми ніколи не здамося!"
 GER_prepare_italian_coup_tt:0 "Якщо пропозицію буде прийнято:\n"
 GER_realpolitik_desc:0 "Настав час поглянути назовні на решту Європи та визначити, в який бік дме вітер. Якщо з’являться можливості для альянсів або завоювань, ми повинні негайно їх використати."
 GER_reassert_eastern_claims_desc:0 "$GER_demand_memel_desc$"
 GER_reichskommissariat_arabien_effect_tt:0 "Усі необхідні області, окрім §Y[291.GetName]§!, перейдуть під контроль [RAR.GetNameDef]"
 GER_reichskommissariat_bohemia_effect_tt:0 "Усі необхідні області, окрім §Y[9.GetName]§!, перейдуть під контроль [RKH.GetNameDef]"
 GER_reichskommissariat_hindustan:0 "Райхскомісаріат Великий Індостан"
 GER_reichskommissariat_norwegen_effect_tt:0 "Усі необхідні області, окрім §Y[110.GetName]§!, перейдуть під контроль [RKG.GetNameDef]"
 GER_revive_the_kaiserreich_ww_desc:0 "$GER_revive_the_kaiserreich_desc$"
 GER_rocketry_innovations_desc:0 "Наступний великий стрибок у розвитку авіації вже в наших руках! Наші інженери невтомно працюють над удосконаленням ракетних двигунів, що може мати значні наслідки та користь у нашому прагненні стати господарями неба."
 GER_saf_rka_effect_tt:0 "Кожна область у південноафриканській зоні інтересів перейде під контроль [RKA.GetNameDef]"
 GER_sam_missile_equipment_1:0 "Wasserfall AA Rocket"
 GER_see_to_the_eastern_front:0 "Огляд Східного фронту"
 GER_seeherrschaft_desc:0 "Ми на шляху до того, щоби стати беззаперечними господарями океанів і втілити наше бачення Seeherrschaft, або морського панування. Тепер [ROOT.GetNameDef] править хвилями!"
 GER_sepp_dietrich:0 "Зепп Дітріх"
 GER_south_east_asian_construction_modifier:0 "Реалізовано інфраструктурні проєкти"
 GER_strengthen_kriegsmarine_fascism:0 "Kriegsmarine"
 GER_subsidize_hoesch_benzin:0 "Субсидувати Hoesch-Benzin"
 GER_super_heavy_tank_equipment_1_desc:0 "Panzerkampfwagen VIII Maus (з нім. — «миша») — німецький надважкий танк часів Другої світової війни, чий прототип був створений наприкінці 1944 року. Це найважча повністю закрита бойова броньована машина, коли-небудь створена. Основним озброєнням Maus була 128-мм гармата KwK 44 L/55 із доданою спареною 75-мм гарматою."
 GER_support_the_proletarian_uprising:0 "Підтримати повстання пролетаріату"
 GER_support_weapons:0 "MG 08 & leichter Minenwerfer"
 GER_supporting_the_uprising_decision:0 "Підтримати повстання в державі [FROM.GetNameDef]"
 GER_the_german_stakhanovite_movement:0 "Німецький стаханівський рух"
 GER_the_mannheim_project_ww:0 "Проєкт «Мангайм»"
 GER_the_monarchy_compromise_ww_desc:0 "$GER_the_monarchy_compromise_desc$"
 GER_the_second_naval_race_desc:0 "Нас принижували британці й французи досить довго! Час відновити наш флот і показати, що ми більше не будемо схиляти голови. Невдовзі весь світ дізнається, що моря належать нам!"
 GER_transport_plane_equipment_3_short:0 "Ju 352"
 GER_turkey_friend:0 "Подружитися з Туреччиною"
 GER_wirtschaftswunder:0 "Wirtschaftswunder"
 GER_wirtschaftswunder_desc:0 "Всі наші програми та ініціативи з пожвавлення економіки нарешті принесли свої плоди! Люди в усьому світі захоплюються нашим фінансовим та промисловим відновленням і називають його «Wirtschaftswunder» — економічним дивом."
 GER_workers_educator:0 "Освітянин робітничого класу"
 GNA_communism_ADJ:0 "Ґвінейськ"
 GOE_RAJ.1.t:0 "[FROM.GetName] просить дозволу на вторгнення до [BHU.GetName]"
 GOE_RAJ.16.a:0 "Менше адміністративних витрат."
 GOE_RAJ.30.t:0 "Британська адміністрація Раджу падає"
 GOE_RAJ.32.b:0 "Залишити його"
 GOE_RAJ.38.desc:0 "Схоже, [ENG.GetAdjective] уряд достатньо нами переситився. Британські війська прибули у великій кількості під виглядом операцій зі стабілізації. Мережі опору були викорінені, проблемні елементи утихомирені, а наш власний вплив був акуратно придушений.\nВелика Британія наполягає на тому, що це все тимчасово, необхідне втручання для захисту цілісності регіону. Однак повідомлення чітке: вони тут головні, і якщо ми бажаємо керувати, ми повинні робити це на їхніх умовах."
 GOE_RAJ_generals.1.a:0 "Абсолютно!"
 GOE_RAJ_goa.3.desc:0 "[FROM.GetLeader] відповів на наші вимоги та відмовив нам у праві на Гоа, незважаючи на наші погрози військовими діями."
