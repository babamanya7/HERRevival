 FRA_methodical_battle:0 "Методичні битви"
 FRA_national_mobilization_desc:0 "Нарешті ми отримали уряд, який здатний діяти. Настав час зміцнювати армію і готуватися боротися за Францію."
 FRA_national_syndicalist:0 "Націонал-синдикаліст"
 FRA_prepare_coup_in_syria:0 "Підготувати переворот у Сирії"
 FRA_proclaim_the_third_empire_desc:0 "Бонапартистів можна вважати аутсайдерами в боротьбі за трон, але вони несуть у собі мрію про час, коли вся Європа схилялася перед імператором французів."
 FRA_rally_the_leagues:0 "Згуртувати ліги"
 FRA_refus_absurde:0 "Refus Absurde"
 FRA_reorganize_the_dutch_desc:0 "Нідерландці теж колись були частиною Французької імперії. Тепер, коли вони зазнали поразки, настав час повернутися до цього природного стану речей."
 FRA_retribution_for_sedan:0 "Відплата за Седан"
 FRA_the_blum_viollette_proposal_desc:0 "Громадянство Французької Республіки має бути відкритим для всіх, хто відповідає вимогам. Багато з наших вірних підданих в Алжирі хотіли б стати повноправними громадянами, але поки що їм не дозволено це зробити. Зробивши їх повноправними громадянами, ми б зв'язали Алжир набагато ближче до Франції."
