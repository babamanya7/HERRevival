 DEN_buy_allied_weapons_desc:0 "Як маленька країна, наша здатність виробляти озброєння обмежена — і щоб забезпечити нашу незалежність, ми повинні придбати найкраще можливе обладнання з усіх можливих. Можливо, нам вдасться переконати наших союзників надати нам необхідне озброєння на умовах субсидування."
