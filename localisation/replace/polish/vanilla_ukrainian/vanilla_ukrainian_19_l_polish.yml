 ITA_AUS_autonomy_eu_member_DEF:0 "Європейська Італія"
 ITA_albanian_oil:0 "Албанська нафта"
 ITA_anglo_italian_agreements_desc:0 "З новою реальністю у Східній Африці інші колоніальні держави мусять змиритися з нами. Нам потрібно, щоби вони дозволили нам пройти крізь Суецький канал, але вони потребують нас набагато більше. Якщо вони відмовляться, нам, можливо, доведеться шукати підтримку деінде."
 ITA_antifascist_civil_war_triggered_flag:0 "Антифашистська громадянська війна в Італії сталася"
 ITA_austrian_guarantees_tt:0 "У випадку, якщо Німеччина спробує провести аншлюс, Італія отримає можливість втрутитися."
 ITA_battle_cruiser_1_desc:0 "Клас «Francesco Caracciolo» — це клас капітальних кораблів, запропонований одразу після Першої світової війни. Кораблі водотоннажністю близько 34 000 тонн, були добре броньовані і досить швидкі, як для свого розміру та епохи. Лише один корабель був спущений на воду, але його списали у 1921 році."
 ITA_befriend_greece:0 "$ITA_greece_friend$"
 ITA_bop_unify_the_left:0 "£BoP_left_texticon Об'єднати лівих"
 ITA_bring_down_fascist_strongholds_desc:0 "Враховуючи критичну ситуацію в Європі, ми не можемо чекати, поки агресивні фашистські держави почнуть наступ на нас. Той, хто б'є першим, б'є найліпше, тому ми мусимо подбати про те, щоб ударити по фашистах першими і вдарити сильно."
 ITA_camicie_nere_desc:0 "Чорносорочники склали особисту присягу [ITA.GetLeader], що зробило їх більш надійними та лояльними, ніж решта армії. Надання їм більших повноважень і відповідальності тільки зміцнить наше правління."
 ITA_carrier_effort_desc:0 "Сучасні бойові флоти будуть зосереджені на авіаносцях, а не на лінкорах. Перевагу повітряної сили над кораблями було продемонстровано американцями ще в 1921 році!"
