 FRA_SH_battleship_1:0 "Клас «Charlemagne»"
 FRA_SH_battleship_1_desc:0 "Суперлінкори класу «Charlemagne» — це гіпотетична конструкція, яка відповідає великим лінійним кораблям інших флотів. Вони мають важке озброєння на передньому плані, важке зенітне озброєння та товсту броню. Весь дизайн запозичив елементи з класів Richelieu та британського Nelson."
