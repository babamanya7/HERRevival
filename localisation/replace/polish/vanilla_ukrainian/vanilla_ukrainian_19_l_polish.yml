 NORDIC_nordic_airforce_communist:0 "Північний народний авіаційний комісаріат"
 NORDIC_nordic_army_desc:0 "[NORDIC_get_nordic_army_desc]"
 NORDIC_radar_expansion:0 "Розширення радара"
 NORDIC_research_investments:0 "Інвестиції в спільне дослідження"
 NORDIC_second_selector_left_desc:0 "Плейсголдер"
