 lc_internal_fuel_tanks_desc:0 "Розширені паливні відсіки в корпусі, що збільшують дальність ходу транспортного засобу та зменшують необхідність частих зупинок для дозаправки під час тривалих кампаній."
 lc_super_heavy_railway_gun_desc:0 "Ця масивна гармата, спочатку побудована для залізничних платформ, здатна обстрілювати цілі з надзвичайної відстані з безпрецедентною руйнівною силою."
