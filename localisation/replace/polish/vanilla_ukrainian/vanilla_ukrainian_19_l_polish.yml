 siam.16.a:0 "Нехай буде мир."
 siam.27.desc:0 "Король Ананда залишається в [SWI.GetName], далеко від королівства, яким йому належить правити одного дня. Проте відстань не виводить його з-під нашого впливу. Вчителів можна підібрати, предмети акцентувати, а звички заохочувати, щоб його розум був спрямований у майбутнє, яке ми готуємо для [ROOT.GetNameDef]. Чи повернеться він як солдат, науковець чи хтось більший, значною мірою залежить від того, що він вивчатиме зараз.\n\nБо чим насправді є король, як не продовженням своєї країни?"
 siam.45.t:0 "[FROM.GetNameDefCap] пропонує об'єднання альянсів"
 siam.46.desc:0 "[FROM.GetLeader] погодився на нашу пропозицію об'єднати наші альянси в одну коаліцію. Те, що раніше було окремими командуваннями та дипломатичними каналами, тепер згортається в одну структуру, дозволяючи нашим урядам координувати військові плани, заходи постачання та зовнішню політику з набагато більшою чіткістю.\n\nУгода не позбавлена ускладнень, але необхідність єдності перемогла."
 siam.7.desc:0 "Поки напружене протистояння між урядовими силами та військовою клікою Сонгсурадета триває, урядові слідчі почали чути чутки про те, що сформувався союз між Королівським флотом і Сонгсурадетом з прямою метою протидії зростаючому авторитаризму Пхуна.\nЦе ще не все, деякі помічники Королівського двору повідомляли про зустрічі представників Сонгсурадета з високопоставленими принцами, що посилює побоювання, що роялісти також об'єднаються з опозицією."
 siam_adc.3.t:0 "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] приймає незалежність"
 siberia_unified_neutrality_DEF:0 "Сибірська мультинаціональна держава"
