 BEL_democratization_of_education_desc:0 "Наше суспільство має традицію взаємної турботи, що найкраще втілюється в соціальному контракті між нашими працівниками та корпораціями. Подібним чином держава повинна прагнути надати кожному рівні можливості та підкреслити важливість хорошої освіти."
 BEL_determined_prime_minister:0 "Рішучий прем'єр-міністр"
 BEL_economic_downturn_dynamic_modifier_desc:0 "Наша економіка знаходиться в руїнах після того, як остання війна перетворила нашу націю на поле бою, відновлення ще більше ускладнюється через наслідки глобальної депресії, з якою ми досі боремося."
 BEL_generic_fascist_demagogue:0 "Йоріс ван Северен"
 BEL_georges_deffontaine:0 "Жорж Деффонтен"
 BEL_government_in_exile:0 "Уряд у вигнанні"
 BEL_government_in_exile_desc:0 "Залишкові [BEL.GetAdjective] політичні еліти прибули до столиці свого нового притулку, серед них кілька ключових міністрів, таких як, Хуберт Пірло, Поль-Анрі Спак, Каміль Гютт і Альберт ван Влешауер. Разом вони сформували «Уряд Чотирьох» і пообіцяли побачити війну до її переможного завершення."
 BEL_interpreters_tt:0 "Цей §Yнаціонаьний дух§! буде додано як до нинішніх членів фракції, так і до майбутніх."
 BEL_laboratoire_aerotechnique_de_belgique_organization:0 "Laboratoire Aérotechnique de Belgique"
 BEL_legacy_of_the_great_war_desc:0 "Ми пройшли довгий шлях з часів жахів «великої» війни, і хоча наші рани ще не загоїлися, ми з гордістю несемо наші шрами. Ми один раз чинили опір загарбникам, ми можемо, ні, ми будемо, чинити опір знову."
 BEL_modify_belgian_legion_dynamic_modifier_tt:0 "Покращити §Y$BEL_belgian_legion_dynamic_modifier$§! на:"
 BEL_modify_corruption_dynamic_modifier_tt:0 "Змінити §Y$BEL_corruption_dynamic_modifier$§! на:"
 BEL_paul_emile_janson_desc:0 "Ліберальний кандидат на пост прем'єр-міністра, Поль-Еміль Жансон був обраний королем як стабільний лідер для відновлення стабільності в уряді в ці все більш нестабільні часи."
 BEL_protect_against_france_desc:0 "Попередні підготовки на південь були більше орієнтовані на випадок оточення, але реальність така, що може статися повномасштабне вторгнення з боку французів — тому ми повинні підготувати укріплення та форти відповідно!"
 BEL_strength_and_brotherhood:0 "Сила та братерство"
 BEL_support_the_vnv_desc:0 "У рамках останніх виборів, Vlaamsch Nationaal Verbond, або Фламандський Національний Союз, об'єднався з партією Рекс з наміром створити корпораціоністську державу. Тепер, коли Деґрель прийшов до влади, настав час віддячити його союзникам і почати кроки до більш експансіоністської фашистської держави, з поглядом на возз'єднання з Нідерландами."
 BEL_trade_union_support:0 "Підтримка профспілок"
 BEL_trade_union_support_desc:0 "Нашими природними союзниками в політичній боротьбі є профспілки, але до цього часу їхня підтримка нашому руху була прохолодною. Ми можемо посилити свої обіцянки їм, і натомість вони мобілізують своїх членів на нашу підтримку."
 BEL_volunteer_effort2_ns_desc:0 "Ми повинні допомогти зберегти мир у світі та забезпечити, щоб фашистські держави не здобули перевагу. Уникнення фактичної війни є найважливішим, тому наразі ми обмежимося лише відправкою добровольців."
