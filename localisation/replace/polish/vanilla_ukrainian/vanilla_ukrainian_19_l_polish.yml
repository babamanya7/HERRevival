 HABSBURG_organizational_exercises_desc:0 "Маневри вирішують хід війни. Оскільки війна ведеться у все більш високому темпі, зростає потреба у високих швидкостях і бездоганній організації. Жодна вогнева потужність не врятує нас, якщо наші війська не навчані, як швидко рухатися, не втрачаючи мети свого пересування. У міру того, як наша армія зростає, до неї входять чоловіки багатьох національностей, необхідно докласти зусиль для координації та організації наших військ."
