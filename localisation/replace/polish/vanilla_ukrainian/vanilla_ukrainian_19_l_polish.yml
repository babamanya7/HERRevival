 USA_strategic_bombing:0 "Стратегічне бомбардування"
 USA_support_rock_island_desc:0 "Ключ до перемоги — всебічна допомога відважним солдатам, чи то за допомогою сильного артобстрілу, чи прямої підтримки на полі бою. Треба зробити так, щоби наші війська нічого не потребували."
 USA_transport_plane_equipment_1:0 "Douglas DC-2"
 USA_two_ocean_navy_act_desc:0 "Напередодні війни, що насувається, ми зобов'язані зробити так, щоб противник не зміг висадитися на американську землю. Наш флот повинен давати відсіч будь-яким ворогам в обох океанах, що омивають наші береги."
