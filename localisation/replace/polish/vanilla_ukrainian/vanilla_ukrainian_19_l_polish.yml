 SCREENING_TOOLTIP_NO_SCREENS:0 "Відсутність §Yкораблів прикриття§! дозволить ворожим підводним човнам та іншим легким кораблям цілитися на основні кораблі торпедами та дасть великі штрафи до позиціонування."
