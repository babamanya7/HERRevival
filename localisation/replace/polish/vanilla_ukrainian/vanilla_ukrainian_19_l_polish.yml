 DEN_restructuring_sovaernet_desc:0 "За багато десятиліть мирного життя низка недоліків у структурі військово-морського командування залишилася непоміченою. Єдиний спосіб усунути їх зараз — це повна реорганізація Søværnet."
 DEN_sahnefront_desc:0 "Данія — щедра країна з багатими сільськогосподарськими традиціями, і як наші піддані, ми зможемо отримати з цього користь. Контроль над Данією зміцнить наші збройні сили та спроможності."
