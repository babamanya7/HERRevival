 wtt_infiltration.24.a:0 "На щастя, ми позбулися їх усіх."
 wtt_japan.109.a:0 "Пречудова ідея. Ми підпишемо пакт."
 wtt_japan.113.desc:0 "[ITA_fascism.GetAdjective]ий уряд погодився підписати Троїстий пакт, присягнувшись підтримати нас у разі оголошення війни."
 wtt_japan.119.a:0 "Вони нам дуже знадобляться!"
 wtt_japan.120.a:0 "Ми самі по собі..."
 wtt_japan.2.t:0 "[From.GetNameDefCap] передає владу над колоніями"
 wtt_ledo_road.2.desc:0 "[From.GetAdjective]ий уряд вирішив, що не можна більше допускати транспортне сполучення дорогою Ледо. Всі конвої на ній зупинені, їм наказано повернутись. Тепер ми не зможемо отримувати постачання по ній."
 wtt_news.1.b:0 "Їх зрадила армія! Ми не можемо допустити подібного."
 wtt_news.13.c:0 "Мир було збережено..."
 wtt_news.24.desc:0 "Започаткована Німеччиною раніше цього тижня операція з анексування Вішістської Франції закінчилася успішно. Тим не менш, німцям не вдалося захопити військово-морську базу в Тулоні до того, як французи наказали затопити кораблі. Таким чином, військово-морські сили Франції не дісталися Німеччині."
 wtt_news.27.b:0 "Тривожні вісті... До нас таких пропозицій не надходило..."
 wtt_news.32.d:0 "Японія скористається цією ситуацією."
 wtt_news.34.t:0 "Сформовані «Летючі тигри»"
 wtt_news.41.f:0 "Вони ухвалили вірне рішення."
 wtt_news.48.a:0 "Цуценя надумало гарчати?"
 wtt_news.53.t:0 "Об'єднання Скандинавії"
 wtt_news.57.desc:0 "Тепер, коли Польща та Литва знову об'єднані під загальним правлінням, [From.GetOldAdjective]ий уряд почав посилатися на історію у своїй пропаганді, намагаючись об'єднати народи обох країн. «Експерти-історики» навперебій наводять різні факти з минулого Польсько-литовської унії, доводячи, що спільно Польща та Литва здатні протистояти всім загрозам на своїх кордонах. Схоже, такий підхід спрацював і вплинув на настрої публіки, яка все частіше замислювалася про славне минуле.\n\nСьогодні [From.GetOldAdjective]ий уряд зробив черговий крок до своєї мети, заявивши про відродження Унії та про зміну назви країни на «[From.GetNameDef]»."
 wtt_news.66.a:0 "Хай розпочнеться відвоювання."
 wtt_news.68.t:0 "Підйом держави [From.GetNameDef]"
 wtt_political_warlord_support.1.a:0 "Ми підтримаємо їх."
 wtt_political_warlord_support.11.t:0 "[From.GetLeader] вимагає публічно висловити підтримку"
 wtt_political_warlord_support.12.desc:0 "Переговори з лідером [From.GetLeader] завершились. Правитель держави [From.GetNameDef] зазначив, що громадськість його країни вкрай стурбована поганою якістю спорядження військ. У багатьох загонах не вистачає гвинтівок, а деяким солдатам доводиться використовувати таку застарілу зброю, як мушкети із дульним заряджанням та мечі\n\nОскільки протидія сторін у поточному конфлікті може призвести до відкритих військових зіткнень, [From.GetLeader], перш ніж публічно висловлювати свою підтримку, хоче, щоби ми забезпечили його війська відповідною зброєю."
 wtt_prc.21.a:0 "Хто міг таке вчинити?"
 wtt_prc.24.t:0 "Патруль потрапив у засідку"
 wtt_the_hump.4.a:0 "Подарунки з неба!"
 wtt_warlord_vs_prc.23.b:0 "Цього рази опустимо це питання."
 wtt_warlord_vs_prc.32.a:0 "Він прислухався до здорового глузду."
 wtt_warlord_vs_prc.36.b:0 "У такому разі можна взагалі розпускати Об'єднаний фронт."
 wtt_xian_incident.5.b:0 "Жодних угод із націоналістами!"
 wuw_GER_chinese_diplomacy.6.t:0 "[FROM.GetNameDefCap] погоджується на співпрацю"
 wuw_GER_civil_war.2.t:0 "Звільнення Ернста Тельмана з в'язниці"
 wuw_GER_civil_war.6.t:0 "Комуністична громадянська війна в [ROOT.GetNameDef]"
 wuw_GER_diplomacy.101.desc:0 "Незважаючи на очевидні вигоди, [FROM.GetNameDef] відмовилися приєднатись до нашої ініціативи. Вони заявили, що не довіряють нам настільки, щоб ділитись технологіями."
 wuw_GER_diplomacy.2.desc:0 "[FROM.GetLeader] здається розсудливим лідером, який дбає про найкращі інтереси своєї країни. Випадково, це також відповідає нашим інтересам. Ми використаємо додаткові ресурси з [FROM.GetName] як слід."
 wuw_GER_diplomacy.23.t:0 "[FROM.GetNameDefCap] просить повернення колишніх колоній"
 wuw_GER_diplomacy.29.a:0 "Неочікувано, але приємно!"
 wuw_GER_diplomacy.32.b:0 "Ми виконаємо свою частину угоди"
 wuw_GER_diplomacy.52.a:0 "Нерозумне рішення"
 wuw_GER_diplomacy.57.desc:0 "\n[FROM.GetLeader] та [FROM.GetAdjective]ий уряд останнім часом стали значно агресивнішими у своїх висловлюваннях. Вони вважають плебісцити 1920 року щодо Шлезвігу фальшивими та вимагають повернення території. Хоча ми знаємо, що це неправда, можливо, варто уникнути відкритого конфлікту?"
 wuw_GER_diplomacy.58.t:0 "[FROM.GetNameDefCap] поступається нашим вимогам"
 wuw_GER_diplomacy.72.desc:0 "Ми виявили діяльність [FROM.GetAdjective] осередків у нашій країні. Вони пропагують ідеї пролетарської революції. Чи не є це частиною плану щодо нашої інтеграції в [GER.GetAdjective] державу?"
 wuw_GER_diplomacy.76.t:0 "[FROM.GetNameDefCap] вимагає нашого підкорення"
 wuw_GER_diplomacy.83.b:0 "Ми краще залишимось незалежними."
 wuw_GER_diplomacy.88.t:0 "[FROM.GetNameDefCap] передає території у нашій сфері впливу"
 wuw_GER_diplomacy.89.b:0 "Неприйнятно!"
 wuw_GER_diplomacy.90.desc:0 "[FROM.GetLeader] хоче підписати з нами пакт про ненапад. Це може обмежити нашу свободу дій, але зменшує ризик конфлікту."
 wuw_GER_diplomacy.92.desc:0 "[FROM.GetNameDef] позитивно сприйняв наш вибір і пропонує зробити перехід легшим, замінивши лідера на Вальтера Ульбріхта."
 wuw_GER_diplomacy.93.a:0 "Чудово!"
 wuw_GER_diplomacy.93.t:0 "[FROM.GetNameDef] встановлює Вальтера Ульбріхта"
 wuw_GER_diplomacy.98.a:0 "Прекрасна ініціатива"
 wuw_GER_news.2.c:0 "Наш зоряний час!"
 wuw_GER_realpolitik.15.t:0 "[FROM.GetNameDefCap] відкидає наші вимоги"
 wuw_GER_realpolitik.27.a:0 "За короля!"
 wuw_GER_realpolitik.27.desc:0 "Після тривалого періоду зростання монархістських настроїв, схоже, що консервативні сили [ROOT.GetAdjective] втомилися чекати мирної зміни влади, заявляючи, що чинний уряд не має наміру передавати владу та не дозволяє повернення до минулих епох. Після інтенсивних дебатів дипломатія зазнала краху, і почався збройний конфлікт."
 wuw_GER_realpolitik.33.b:0 "Ми не відмовимося від нашої економічної незалежності!"
 wuw_GER_realpolitik.56.t:0 "[FROM.GetNameDefCap] стоїть на своєму"
 wuw_GER_realpolitik.57.b:0 "Перемога або смерть!"
 wuw_GER_realpolitik.58.a:0 "Чудово!"
 wuw_GER_realpolitik.58.t:0 "[FROM.GetNameDefCap] погоджується на подальшу інтеграцію"
 wuw_GER_reichskommissariats.18.t:0 "Керівництво Міттельафрики"
 wuw_GER_weltpolitik.7.t:0 "[BEL.GetNameDefCap] планує здати нашу свободу"
 wuw_HUN_assault_gun_focus_desc:0 "Замість повноцінних танків ми зробимо ставку на штурмові гармати як більш економічну альтернативу для підтримки проривів нашої піхоти."
 wuw_HUN_attempt_economic_independence_desc:0 "Щоб відновити нашу велич, ми не можемо покладатися на іноземні держави для підтримки економіки. Ми самостійно збудуємо процвітаючу державу!"
 wuw_HUN_demand_szekely_autonomy:0 "Вимогти автономію Секейського краю"
 wuw_HUN_demand_transylvania:0 "Вимогти Трансільванію"
 wuw_HUN_establish_the_second_republic:0 "Заснувати Другу Республіку"
 wuw_HUN_establishing_a_royal_guard_desc:0 "Усім відомо, що кожному королю потрібна особиста гвардія, і Горті — не виняток. Настав час забезпечити його захист, адже на троні знову сидить король."
 wuw_HUN_expand_the_diosgyor_machinery_factory:0 "Розширити машинобудівний завод у Діошдьйорі"
 wuw_HUN_nationalize_key_industries_desc:0 "У країні досі залишилося чимало заводів та підприємств, що належать іноземцям. Наступним кроком до соціалізму стане націоналізація цих активів."
 wuw_HUN_news_events.4.t:0 "[HUN.GetNameDefCap] проголошує світове панування"
 wuw_HUN_news_events.5.desc:0 "Шукаючи короля для своєї нації, [HUN.GetAdjective]и після тривалих переговорів і підготовки офіційно коронували [HUN.GetLeader]. Сьогодні, серед великого святкування, його короновано на короля Угорщини у Королівському палаці в Будапешті."
 wuw_HUN_on_a_high_horse:0 "На високому коні"
 wuw_HUN_reclaim_the_slovak_possessions_desc:0 "Словаччина тривалий час була частиною нашої держави, і ледь не повернулася до нас після Тріанонського договору. Ми повинні знову стати на цю землю та повернути її собі!"
 wuw_HUN_reclaim_transylvania_desc:0 "Після завершення Великої війни [ROM.GetAdjective]и окупували Трансильванію, яка століттями була під нашим правлінням. Минуло не так багато часу, і наш народ досі це пам’ятає. Настав час повернути ці землі собі."
 wuw_HUN_renounce_the_treaty_of_trianon:0 "Відмовитися від Тріанонського договору"
 wuw_HUN_repulo_muszaki_intezet:0 "Repülö Muszaki Intézet"
 wuw_HUN_restore_the_socialist_federative_republic_desc:0 "Комінтерн зрадив боротьбу з імперіалізмом, обравши шлях співіснування. Якщо робітники світу прагнуть свободи, ми повинні продовжити справу Маркса й Леніна — навіть якщо доведеться виступити проти СРСР."
 wuw_HUN_reverse_the_brain_drain:0 "Зупинити витік мізків"
 wuw_HUN_szent_laszlo_infantry_division_tt:0 "Отримати дивізію з 6 §Yпіхотними§! та 1 §Yартилерійським§! батальйоном"
 wuw_HUN_tap_newfound_oil_deposits:0 "Освоїти нові нафтові родовища"
 wuw_HUN_the_kingdom_of_ukraine_required_states_tt:0 "§Y[ROOT.GetNameDefCap]§! або його суб'єкт контролює всі §Yукраїнські§! національні області в межах §YРадянського Союзу§!, а також §Y[137.GetName]§!, §Y[218.GetName]§!, §Y[93.GetName]§! і §Y[234.GetName]§!."
 wuw_HUN_volksbund_der_deutschen_in_ungarn_desc:0 "Націонал-соціалістичний Фольксбунд, підтримуваний DNSAP, стане ідеальною опорою для нашого нового монарха. Ми налагодимо контакт із їхнім керівництвом."
 ww_BEL_event_diplomatic.14.desc:0 "Незважаючи на очевидні загрози нашому існуванню, керівництво [FROM.GetAdjective] відмовилося від нашого запиту на гарантію. Ми намагалися пояснити їм ситуацію, але вони відмовляються розуміти серйозність ситуації. Схоже, нам доведеться обходитись без їхньої допомоги."
 ww_BEL_event_diplomatic.15.b:0 "Їхні амбіції благородні, але ми не можемо допомогти"
 ww_BEL_event_diplomatic.23.b:0 "Наші технології залишаться нашими"
 ww_BEL_event_diplomatic.25.desc:0 "Хоча ми думали, що подали переконливі аргументи щодо створення групи досліджень Європейського Союзу для [FROM.GetNameDef], вони відмовилися приєднатися до ініціативи. Сподіваємося все одно отримати вигоду від ініціативи, але без [FROM.GetNameDef]."
 ww_BEL_event_diplomatic.26.b:0 "Ні, ми повинні думати про нашу суверенітет!"
 ww_BEL_event_diplomatic.6.t:0 "Бельгія вимагає Кале"
 ww_BEL_event_political.1.desc:0 "Тиск на уряд через постійний корупційний скандал врешті-решт призвів до його падіння. Розслідування на чолі з Леоном Дегрелем, лідером фашистського руху Рексистів, вело розслідування щодо хабарництва серед міністрів протягом кількох років, що призвело до виявлення численних виплат. \n\nЗ метою відновлення легітимності, прем'єр-міністр Поль ван Зееланд скликав дострокові вибори, щоб відновити довіру та легітимність, і результати вже готові. \n\nПартія Робітників Бельгії (Parti Ouvrier Belge), яку очолює Еміль Вандервельде, здобула найбільшу кількість голосів, скориставшись непопулярністю свого політичного суперника. Він може використати цю перемогу для формування меншості, або працювати разом з партією католиків Пола ван Зееланда, щоб створити більш стабільну більшість і утворити Уряд національної єдності. \n\nТакож варто зазначити, що партія Леона Дегреля, Рексисти, також добре виступила, адже його антикорупційна позиція виявилася дуже популярною."
 ww_BEL_event_war.4.t:0 "Королівський в'язень"
 ww_congo.10.b:0 "Ніколи!"
 ww_congo.13.a:0 "Ми зростатимемо сильніше разом!"
 ww_congo.19.c:0 "Руйнівний удар..."
 ww_congo.26.b:0 "Хто вони такі?"
 ww_congo.30.desc:0 "Наші дипломати повернулися з переговорів з [FROM.GetAdjective] військовими, і, як повідомляється, досягнуто угоди, згідно з якою вони нададуть нам людей та обладнання, коли ми вирішимо оголосити війну проти наших гнобителів. Сьогодні хороший день для народу Конґо!"
 ww_congo.33.desc:0 "Питання лідерства в нашій нації стало актуальним через зв'язки Цириля Адули з американцями та бельгійськими профспілками. Багато хто вважає, що лідер Симбів, Крістоф Гбене, повинен взяти на себе роль нового голови держави. Чи повинні ми підкоритися їм?"
 ww_congo.37.t:0 "[FROM.GetNameDefCap] пропонує мир за незалежність [?COG.COG_disputed_colony.GetAdjective]"
 ww_congo.56.a:0 "Це на благо народу"
 ww_congo.61.t:0 "[FROM.GetLeader] відмовляється від нашого запиту стати їх протекторатом"
 ww_congo.8.a:0 "Ми побачимо, як це розвиватиметься"
 yoshitoshi_tokugawa:0 "$JAP_yoshitoshi_tokugawa$"
 zmaj:0 "Zmaj"
