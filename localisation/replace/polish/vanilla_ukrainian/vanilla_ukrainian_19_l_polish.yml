 INS_aslia_DEF:0 "Аслійська федерація"
 INS_communist_events.1.c:0 "Можливо, якщо ми надамо їм місце за столом, ми все ще зможемо це контролювати."
 INS_core_state_decision:0 "Інтегрувати [FROM.GetName]"
 INS_cost_text_oil_4_blocked:0 "£resources_strip|1 §R4§!"
 INS_cost_text_rubber_4_tooltip:0 "Прийняття рішення коштує £resources_strip|3 §Y4§!."
 INS_escalate_the_conflict_desc:0 "Ми організуємо заворушення та сутички з ворожими силами, щоб посилити напруженість та ескалацію, закладаючи основу для того, щоб пізніші, більш жорсткі операції зазнали меншої прискіпливості з боку міжнародної спільноти."
 INS_fate_of_de_javasche_bank_desc:0 "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fighter_equipment_4_short:0 "P-80"
 INS_finish_the_bauxite_project_desc:0 "Тепер, коли нові дороги, порти та залізниці запрацювали по всьому Банка-Белітунгу, геологорозвідувальні групи повідомляють про поклади вольфраму та хрому, які перевершують наші початкові очікування. Ці острови ще доведуть свою повну цінність для республіки."
 INS_industrialized_colony_tt:0 "Змінює §Y$INS_industrialized_colony$§! на:"
 INS_infantry_equipment_3_short:0 "M3 SMG"
 INS_iskandar_sjah:0 "Султан Мухаммад Джабір Шах"
 INS_javanese_education_investments_desc:0 "На додаток до нашого поточного проєкту з будівництва початкових і середніх шкіл, ми могли б побудувати громадський коледж та спеціалізовані професійно-технічні школи, що зробило б подальшу освіту набагато доступнішою для сімей середнього класу."
 INS_laskar_rakjat_desc:0 "Революція складається з багатьох різних ополчень по всій Індонезії, як великих, так і малих. Організація ополчень є необхідним кроком для досягнення перемоги. Проте ми не повинні діяти надто поспішно, оскільки надання повноважень ополченням, пов'язаним з нашими політичними конкурентами, може призвести до катастрофи."
 INS_limited_war_events.5.t:0 "[FROM.GetNameDef] закликає до нашого знищення"
 INS_limited_war_events.7.desc:0 "Наш наступ зупинився, і що гірше, ворог про це знає. З-за протоки надійшла вимога. Скласти зброю зараз і прийняти їхні умови, або дивитися, як зростають списки жертв заради того самого результату. Вибір, який вони пропонують, — це лише масштаб похорону."
 INS_limited_war_events.9.t:0 "[FROM.GetName] має намір зламати Республіку!"
 INS_local_unity:0 "Часткова князівська автономія"
 INS_loyalist_events.1.b:0 "Анрі Вінкельман потрібен на батьківщині."
 INS_loyalist_events.10.a:0 "Ми дали слово."
 INS_loyalist_events.17.a:0 "Відмінно."
 INS_loyalist_events.19.b:0 "Ми цього не дозволимо."
 INS_loyalist_events.22.a:0 "Це не варте того, щоб за це битися."
 INS_loyalist_events.25.desc:0 "Делегація [FROM.GetAdjective] прибула з пропозицією про об'єднання наших двох республік. Вони стверджують, що наші народи поділяють спільне австронезійське коріння, набагато давніше, ніж колоніальні кордони, які нас розділяють, і що єдина держава, що охоплює архіпелаг, стала б головною силою в Південно-Східній Азії. Згода означала б розпуск нашого уряду та інтеграцію в їхній."
 INS_loyalist_events.31.desc:0 "Скриньки для голосування були підраховані. Народ [FROM.GetAdjective] обрав [FROM.FROM.GetNameDef] замість нас, і розрив був немалий. Наші адміністратори вже отримують інструкції розпочати передачу."
 INS_machinefabriek_braat_organization:0 "[INS_machinefabriek_braat_name]"
 INS_nav_bomber_equipment_0_short:0 "Fokker T.IV"
 INS_pacific_revolution:0 "Тихоокеанська революція"
 INS_political_events.19.a:0 "Похмурий день для флоту"
 INS_prime_minister_sjarifuddin:0 "Прем'єр-міністр Шаріфуддін"
 INS_propose_malay_unification_decision_desc:0 "$INSHOL_propose_malay_unification_desc$"
 INS_realign_supply_chains_time_reduce_10_tt:0 "Зменшує час відновлення рішень §Y$INS_realign_supply_chains_cat$§! на §Y10§! днів."
 INS_republic_national_party_long:0 "Національна партія Індонезії"
 INS_republic_socialist_party:0 "СПІ"
 INS_revolution_ended_tt:0 "Національна революція завершилася"
 INS_revolution_events.11.a:0 "Ще одна перемога для [HOL.GetNameDef]."
 INS_revolution_events.20.a:0 "Кровопролиття нарешті закінчиться."
 INS_revolution_events.32.t:0 "[HOL.GetNameDefCap] відмовляється від припинення вогню"
 INS_revolution_events.33.b:0 "Ми не можемо ризикувати нашими відносинами з голландцями."
 INS_revolution_events.34.desc:0 "Вашингтон погодився виступити посередником між нашим урядом і голландцями. Американські посланці вже в дорозі, і буде запропоновано формальне припинення вогню. Це величезна можливість. За підтримки найпотужнішої держави світу голландцям буде набагато складніше зволікати або вдаватися до сили. Ми повинні триматися твердо за столом і дозволити американцям робити те, що вони вміють найкраще."
 INS_revolution_events.7.t:0 "[ENG.GetNameDefCap] відмовляється допомогти нам"
 INS_revolution_war_HOL:0 "Розпочати поліцейську операцію"
 INS_royal_netherlands_east_indies_army:0 "Королівська нідерландська ост-індійська армія"
 INS_spend_profits_on_rural_desc:0 "Після остаточного узгодження нашої нової угоди про хінін, ми отримуємо можливість використати наш додатковий дохід для розвитку транспортної та комунікаційної інфраструктури в сільській місцевості, прокладаючи шлях для майбутнього промислового розвитку."
 INS_sudirmans_promotion_desc:0 "Судірман продемонстрував чудові лідерські якості та організував кілька успішних наступів. Настав час визнати зусилля нашого Командира, надавши йому звання Генерала, на яке він заслуговує."
 INS_the_declaration_of_independence_desc:0 "Ми більше не можемо ризикувати чекати, треба кувати залізо, поки гаряче! Ми повинні відправити наше ополчення, щоб захопити контроль над портами, містами та промисловими центрами досить швидко, щоб голландська влада не встигла відреагувати. Тоді ми проголосимо незалежність, проголосивши Республіку Індонезія."
 INS_union_events.1.a:0 "Війна триватиме з [1058.GetName]."
 INS_union_events.3.desc:0 "[INS.GetNameDefCap] категорично відмовилися від нашого прохання переїхати до [1058.GetName]. [INS.GetLeader] заявив, що ми не маємо права вимагати такого рівня допомоги, коли їхні сили і так занадто розпорошені."
 INS_union_events.7.t:0 "[HOL.GetNameDefCap] відхиляє пропозицію союзу"
 INS_utilize_tan_malakas_militia_desc:0 "Червоне ополчення Тана Малаки — це, мабуть, найсильніше окреме ополчення в усій Індонезії, і його мобілізація до TKR стала б величезною перевагою. Це не обходиться без ризиків, надання потужному ополченню з сильними політичними мотивами такого впливу значно полегшить їм захоплення влади."
 INS_volksraad_custom_tt:0 "Дозволяє наймати §Yрадників Фольксрааду§!\nДозволяє використовувати §Yрішення Фольксрааду§!"
 INS_win_condition_base_republic_real_desc:0 "Ми повинні продовжувати боротися, вербувати цивільних і дбати про те, щоб вогонь у душі кожного індонезійця продовжував палати. Як тільки ми повалимо адміністрацію Ост-Індії, [HOL.GetNameDef] не матиме іншого вибору, окрім як здатися."
 INTELLIGENCE_OPPURTUNITIES:0 "Бонус швидкості покращення агентства в наступних покращеннях:"
 INTEL_LEDGER_FIELDED_NAVY_MANPOWER_TOOLTIP:0 "  Флот: $VALUE|H$"
