 SIA_decrease_civilian_approval_3_tt:0 "Зменшує схвалення крила §YЦивільних§! на §RВеличезну величину§!"
 SIA_demand_independence_VIN:0 "Вимагати звільнення §Y[VIN.GetName]§!"
 SIA_divert_army_funds_to_navy_toggle_undo_tt:0 "Ми більше не будемо перенаправляти частину армійських коштів на флот."
 SIA_embed_technocrats_in_civilian_institutions:0 "Інтеграція технократів у цивільні інституції"
 SIA_empower_the_coastguard:0 "Посилення берегової охорони"
 SIA_farmers_into_the_city_desc:0 "Сучасна економіка не може підтримуватися лише сільською працею. З розширенням промисловості держава повинна заохочувати впорядковану міграцію з полів до міст, де можна буде сформувати нову міську робочу силу."
 SIA_heavy_cruiser_1:0 "Клас «Sri Ayuthia»"
 SIA_heavy_fighter_equipment_2:0 "Kawasaki Ki-45"
 SIA_heavy_fighter_equipment_3_short:0 "Ki-102"
 SIA_josiah_crosby:0 "Джозая Кросбі"
 SIA_khana_ratsadon_military_coup_mission_desc:0 "Військові вбачають у політиці нинішнього уряду загрозу своїм інтересам. Вони активно планують усунути уряд, якщо їхнє становище не покращиться."
 SIA_light_tank_equipment_1:0 "Vickers 6-Ton"
 SIA_light_tank_equipment_3:0 "Type 98 Ke-Ni"
 SIA_look_to_european_fascism_desc:0 "У нас є можливість реформувати цю країну, не скуту минулим, ми будемо дивитися в нове майбутнє, натхненні тим, що відбувається на Заході. Очевидно, що старий світовий порядок руйнується, і ті, хто залишиться позаду, страждатимуть від наслідків відсутності свого бачення."
 SIA_mandate_1:0 "Перший мандат"
 SIA_new_territories_administration_available_trigger:0 "Будь-який регіон в §YІндокитаї§!\n   Контролюється §Y[ROOT.GetName]§!"
 SIA_pacific_island_raid_desc:0 "Ми здійснимо рейд на тихоокеанський острів і спробуємо завдати серйозної шкоди розташованим на ньому морським спорудам, кораблям та арміям ворога."
 SIA_prajadhipok_audience_with_churchill_tt:0 "[ENG.GetName] надасть нам "
 SIA_preemtive_strike:0 "Превентивний удар"
 SIA_radio_propaganda:0 "Радіопропаганда"
 SIA_radio_propaganda_desc:0 "Радіо стає основою, оскільки [SIA.GetName] електрифікується, і так само, як ми повинні контролювати пресу, ми повинні контролювати те, що транслюється."
 SIA_resistance_fighter:0 "Боєць руху опору"
 SIA_siamese_tankettes_desc:0 "Наша армія освоїла свій парк легких танкеток, підвищивши їхню надійність і знизивши витрати на їх утримання в польових умовах."
 SIA_specialized_warfare_desc:0 "Рельєф нашого регіону не сприяє однорідній армії. Гори, джунглі та річкові долини вимагають різних навичок. Створюючи спеціалізовані війська, ми можемо гарантувати, що [ROOT.GetNameDef] зустріне ворога з відповідною силою на будь-якому полі бою."
 SIA_spread_democratic_sentiment_in_universities_desc:0 "В академічних колах криється майбутній напрямок розвитку [SIA.GetName]. Те, що вони вивчають сьогодні, відгукнеться в майбутньому, і, прищепивши сьогоднішнім вченим сильне почуття демократичного обов'язку, ми можемо поширити його за межі наукових залів."
 SIA_strat_bomber_equipment_3:0 "Nakajima G8N"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc:0 "Залучити Джіру Вічітсонгкрама на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai:0 "Переманити Пхічіта Кріангсакпхічіта"
 SIA_sway_tiang_sirikhan_to_seri_thai:0 "Переманити Тіанга Сірікхана"
 SIA_the_duty_of_the_thai_people_during_the_war_act:0 "Закон про обов'язок тайського народу під час війни"
 SIA_the_khana_ratsadon_desc:0 "Народна партія поклала край абсолютизму і відкрила шлях до конституційного уряду. Її спадщина була спірною, зрадженою та кривавою, але вона залишається фундаментом, на якому можна побудувати сучасне [SIA.GetName]."
 SIA_thonburi_class_coastal_defense_ship_desc:0 "Скромний флот все ще може мати гострі зуби, якщо він належним чином спроектований для місцевих умов. Клас Тонбурі пропонує [ROOT.GetNameDef] практичний засіб берегової оборони, поєднуючи солідну вогневу міць із роллю, що відповідає водам, які нам найбільше потрібно захищати."
 SIC_drive_out_the_japanese:0 "Вигнати японців"
 SIC_neutrality_party:0 "$CHI_neutrality_party$"
 SIC_push_into_xikang_mission:0 "Боротьба за Сікан"
 SID_fascism:0 "Сідамське царство"
 SIK_heavy_tank_artillery_equipment_3_short:0 "PLZ 43 D"
 SIK_invest_in_the_dushanzi_oil_fields_desc:0 "Нафта була виявлена в районі Душаньцзи на рубежі століть, і до 1909 року ми вже розпочали певний рівень видобутку, але з недавніми інвестиціями з Радянського Союзу з'явився потенціал для подальшого розширення. Ми повинні прагнути інвестувати далі в ці спільні сіньцзян-радянські зусилля з розширення нафтопереробних заводів, оскільки вони можуть бути життєво важливими як для наших, так і для радянських військових зусиль."
 SIK_modern_tank_equipment_1:0 "Type 59"
 SIK_nav_bomber_equipment_1:0 "CAMCO N-323"
