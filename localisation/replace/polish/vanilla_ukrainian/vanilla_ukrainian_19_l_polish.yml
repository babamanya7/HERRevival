 RULE_ALLOW_RELEASE_NATIONS_SOVIET_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! не може дати незалежність цій державі, не виконавши фокус §Y$SOV_autonomous_soviet_republics$§! або §Y$SOV_reconvene_the_zemsky_sobor$§!."
 RULE_GROUP_PEACE_SCORE:0 "Розподіл балів мирної конференції"
 RULE_OPTION_ALTERNATE_GUOMAO_DESC:0 "ШІ піде шляхом неохочої діархії, а Мао та Ґотао спробують об’єднати зусилля проти воєначальників. ШІ не прагнутиме приєднатися до Другого об’єднаного фронту."
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI_DESC:0 "Australia First demands an independent Australia that is free to forge her own future."
 RULE_OPTION_BOLSHEVIK_PRC_DESC:0 "ШІ піде шляхом 28 ½ більшовиків, намагаючись налагодити відносини з Радянським Союзом. Якщо ж він опиниться у Другому об’єднаному фронті, ШІ спробує вплинути на фракцію дипломатичними засобами."
 RULE_OPTION_COMMONWEALTH:0 "Монархізм: династія Веттинів"
 RULE_OPTION_DEFAULT:0 "За замовчуванням"
 RULE_OPTION_DEMOCRATIC_ALTERNATE:0 "Альтернативний демократичний шлях"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:0 "§HУряд на чолі з Ніколою Мушановим§! слідуватиме політиці §Hсоціалізму§! і спробує поліпшити відносини з сусідами, щоби створити Балканську Антанту і захистити півострів від агресії іноземних держав."
 RULE_OPTION_FASCIST_AI_URG_DESC:0 "ШІ зблизиться з Віссю, обернувши країну на плацдарм для завоювання Південної Америки."
 RULE_OPTION_FRA_FRAGMENTED_DESC:0 "Усі доступні для звільнення складові нації Франції будуть створені як вільні та незалежні нації після початку гри."
 RULE_OPTION_HABSBURG:0 "Монархізм: династія Габсбурґів"
 RULE_OPTION_HASHEMITE_IRQ_AI:0 "Нейтралітет: Гашиміти"
 RULE_OPTION_INDEPENDENCE_NEU_MAN_AI_DESC:0 "Маньчжурський ШІ спробує здобути незалежність і захопити владу над усім Китаєм, перетворивши країну на конституційну монархію, рухаючись відповідною гілкою дерева національних фокусів."
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY_HOL_AI_DESC:0 "§HНідерландський§! ШІ намагатиметься відродити спадщину заколоту на «De Zeven Provinciën» і перейти в комунізм, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_OBEDIENCE_MAN_AI_DESC:0 "§HМаньчжурський§! ШІ намагатиметься лишитися якомога лояльним і слідувати відповідній гілці дерева національних фокусів."
 RULE_OPTION_ORANJE_BOVEN:0 "Oranje boven"
 RULE_OPTION_SWE_COMMUNISM_DESC:0 "Шведський ШІ піде комуністичним шляхом і приєднається до або Осі, або Союзників."
