 GER_SOV_industrial_development_group_desc:0 "У результаті поступового поглиблення промислових відносин та співпраці між [GER.GetNameDef] та [SOV.GetNameDef], [GER.GetAdjective]і промисловці простягнули руку допомоги [SOV.GetAdjective]им із метою подальшого розвитку промислових зусиль обох сторін."
 GER_STATE_88:0 "Кракау"
