 TUR_petrol_ofisi_formed:0 "Профінансовано освіту Petrol Ofisi.\n"
 TUR_pivot_to_the_past_desc:0 "Можливо, Війна за незалежність була необхідністю, але основа Республіки була помилкою. Ататюрка більше немає, і він не може захищати свою дорогу світську республіку. Народ ж пристрасно бажає повернення Османського султанату. Коли ми остаточно утихомиримо кемалістів, ми виконаємо волю народу."
 TUR_reappropriated_exploitative_finance_desc:0 "Ми переробимо багатство іноземних лихварів і наших власних жалюгідних внутрішніх капіталістичних паразитів, щоби побудувати суспільство, яке справді служить робочому класу держави [TUR.GetNameDef]."
 TUR_reconciling_kemalism_with_bolshevism_desc:0 "[SOV.GetLeader] мусить стати однією з ключових постатей нашої ідеології. Як безболісно здійснити подібну ідеологічну заміну, неясно, але хто посміє нам суперечити?"
 TUR_relocate_from_yildiz_palace_desc:0 "Ми надто довго зосереджували наші морські зусилля довкола Чанаккале та проток. Настав час нарешті реалізувати наші плани щодо розширення порту Мерсін."
 TUR_sectarian_woes_desc:0 "$TUR_sectarian_woes_desc_tt$\n\nТуреччину долають внутрішні незгоди, що виникають на ідеологічному, релігійному і етнічному грунтах. Кемалісти сподіваються перетворити Туреччину у світську державу, але серед населення велика частка тих, кто налаштований рішуче проти концепції секуляризму. На сході курдський народ завдав турецькому уряду немало проблем, і, схоже, готовий бунтувати проти асиміляції. Щоб залагодити ці проблеми, треба вирішувати їх або ласкавою рукою, або залізним кулаком."
