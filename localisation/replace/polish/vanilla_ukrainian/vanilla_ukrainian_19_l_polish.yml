 GER_VICTORY_POINTS_577:0 "Черновіц"
 GER_ally_chiang_kai_shek_desc:0 "Наші поточні ініціативи у Східній Азії можуть виявитися корисними не лише для нас. Якщо [CHI.GetLeader] з держави [CHI.GetNameDef] укладе з нами союз і зблизиться з нами, ми розширимо нашу сферу впливу та посприяємо колоніальному зростанню в цьому регіоні."
 GER_ally_white_russian_forces:0 "Союз із білогвардійським рухом"
 GER_anti_air_equipment_3:0 "8.8 cm FlaK 41"
 GER_anti_soviet_pact_desc:0 "Ми можемо поглибити Антикомінтернівський пакт і запропонувати всім учасникам утворити коаліцію проти Радянського Союзу. Якщо одна з цих країн опиниться у стані війни з СРСР, решта має виступити на її боці."
 GER_arado_flugzeugwerke_organization:0 "$GER_arado_flugzeugwerke$"
 GER_atlantikwall_idea:0 "Будівництво Атлантичного валу"
