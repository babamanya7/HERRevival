 UNITS_VIEW_BTN_AREA_DEFENSE:0 "§HОборона території§!\n - §GКлацніть§! по областях, щоби додати їх до/видалити їх із наказу армії.\nАрмія з цим наказом не може мати інші в один час.\n\nДивізії, прикріплені до армії з цим наказом розподіляться по вказаній зоні з метою захищати важливі міста, порти й інші об'єкти, а також реагувати на незначну присутність ворога."
