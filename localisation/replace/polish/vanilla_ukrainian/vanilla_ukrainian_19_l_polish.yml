 usa.21.d:0 "Пропаганда комунізму з боку держави [From.GetName] починає впливати на нашу країну. Радіотрансляції дозволяють промовам [From.GetLeader] донести до наших людей. Ми навіть знайшли пропагандистські листівки, які заохочували [Root.GetAdjective]их працівників організовуватись і пропагувати [From.GetAdjective]ий спосіб життя. [Root.GetName] не є маріонеткою, і ми не дозволимо, щоби наша політика була продиктована державою [From.GetName]. Однак ми не можемо заперечувати вплив [From.GetAdjective] політики на нашу країну."
 usa.42.t:0 "Сенатор виступає проти політики уряду"
 usa.63.t:0 "Представники штату [USA_congress_investment_state.GetName] пропонують підтримку"
 usa.64.desc:0 "За підказкою старшого сенатора штату [USA_congress_investment_state.GetName], Комітет Сенату з питань торгівлі розпочав слухання щодо стану місцевої суднобудівної промисловості. За оцінками експертів, значний відсоток торгівлі США залежить від зовнішньої торгівлі, а країні катастрофічно не вистачає суднобудівних потужностей. [USA_congress_investment_state.GetName] було визначено як регіон, у який слід зробити великі інвестиції, і кілька членів комітету висловили очікування, що адміністрація президента [USA.GetLeader] виділить для цього кошти."
 variationsontherussianthem:0 "Варіації російської теми"
 veteran_trade_unionist:0 "Ветеран профспілки"
 viceroy_emeritus_desc:0 "Лорд Галіфакс тривалий час був віце-королем Індії. Його губернаторство не обійшлося без суперечок, але його дипломатичний талант, здається, дає результати."
 viceroy_emeritus_downside_tt:0 "\nЧерез суперечливу історію Лорда Галіфакса в Індії:"
 vichy_exist_not_trigger:0 "§YВішістська Франція§! не існує"
 victory_or_death_spirit_desc:0 "Краще померти зі славою, ніж жити в соромі поразки."
 war_bonds_desc:0 "Нам потрібно більше ресурсів для нашої військової економіки, і військові облігації — саме те для їхнього отримання."
 war_justification.15.d:0 "«Національний дух [ROOT.GetAdjective]ого народу сильний, але не всім народам так пощастило. Традиції [From.GetName] були знищені, а законні правителі давно вбиті та поховані, і все це в ім'я ідеї великої марксистської революції. Наш обов'язок — відновити порядок у цьому світі, заведеному на манівці кровожерливими узурпаторами, і утвердити силу [ROOT.GetName] проти цієї загрози».\n\nХоча [ROOT.GetRulingParty] завжди виступала проти комунізму, [From.GetName] стала об'єктом особливих нападок в останніх промовах. Незалежно від того, чи є напад на [ROOT.GetAdjective]у націю з боку комуністів реальною загрозою, превентивна атака на [From.GetAdjective]ий комунізм вже ведеться."
 war_justification.2.d:0 "«[From.GetAdjective]і політики стверджують, що мають свободу і демократію, стверджують, що хочуть миру, але всі ці речі, якими вони пишаються, є порожніми. Їхня демократія роз'єднує людей там, де вони мали б бути єдиними, а їхня свобода видає лише брак дисципліни. Ми, [ROOT.GetAdjective]ий народ, бачимо крізь цю брехню... і ми бачимо, що цей мир, мир на їхніх умовах, також є брехнею».\n\n[ROOT.GetRulingParty] вже давно висміює слабкість [From.GetAdjective]ої нації, але останнім часом риторика стала більш агресивною. День збройного конфлікту стає все ближчим."
 war_justification.208.d:0 "«Чи є суспільство, більш огидне майбутньому революції, більш чуже до долі робітника, ніж фашистський режим [ROOT.GetName]? Закликаючи народ фанатично присвятити себе ветхому інституту національної держави, вони одягнули віковічні способи дикунства в сучасне вбрання, намагаючись представити себе як альтернативу неминучій міжнародній перемозі робітничого класу. Це лише питання часу, коли вони завдадуть удару по нас або наших союзниках. Давайте вдаримо першими».\n\nНіхто не очікував від нас і [ROOT.GetAdjective]ого населення нічого іншого, окрім взаємного презирства, але останнім часом ворожнеча посилилася. Слухаючи слова [From.GetLeader], здається, що конфлікт рано чи пізно виникне."
 war_justification.216.a:0 "Якщо вони захочуть випробувати нашу силу, то пошкодують про це."
 war_justification.217.t:0 "[ROOT.GetLeader] ставить під питання [From.GetAdjective]ий суверенітет"
 war_justification.7.t:0 "[From.GetAdjective]ий комунізм зазнає поразки"
