 INDUSTRIAL_ORG_TASK_CAPACITY_TITLE:0 "§HОб'єм задач§!"
 INFILTRATION_LABEL_TT:0 "Ставка на введення в оману та нетрадиційні піхотні стратегії."
 INSHOL_borneo_and_the_grote_oost:0 "$HOL_borneo_and_the_grote_oost$"
 INSHOL_hawk_75a7_desc:0 "Американський винищувач Hawk 75A-7 — ідеальний літак для Ост-Індії, доступний і потужний. Ми можемо укласти угоду з виробником, щоб внести необхідні вдосконалення до наших ВПС."
 INSHOL_import_lumber_desc:0 "Ми запровадимо контроль цін у зростаючому сільськогосподарському секторі Ост-Індії, щоб імпортувати всю деревину країни з плантацій Ост-Індії за цінами, з якими жоден інший уряд не зможе зрівнятися, і встановимо державну монополію на деревину."
 INSHOL_instigate_infighting:0 "Спровокувати міжусобиці в Республіці"
 INSHOL_nationalist_coallition_desc:0 "Фольксрад занадто довго говорив в один голос, і цей голос був занадто тихим. Час петицій і терплячих відстрочок минув. Коаліція націоналістичних членів палати відкладе свої суперечки та вимагатиме безумовної незалежності. Старі голоси з-поза меж палати, люди, яких голландці колись вважали надійно відсунутими на другий план, знову будуть запрошені до нашого кола."
 INSHOL_padang_port_desc:0 "Ресурси, вироблені в Паданзі, повинні спочатку направлятися через Яву, перш ніж потрапити на міжнародні ринки, оскільки в регіоні бракує об'єктів, здатних приймати великі конвої. Цей непотрібний гак перевантажує наш ланцюжок постачання та обмежує економічний потенціал Суматри. Побудувавши великий вантажний порт у Паданзі, ми зможемо усунути цей гак, підвищивши прибутковість плантацій Паданга."
 INSHOL_seek_foreign_help_desc:0 "Ні для кого не секрет, що спроба виграти війну проти сильно індустріалізованої колоніальної держави в якості новоствореної нації без усталеної економіки є майже нездійсненним завданням. Ми маємо звернутися до інших країн, які підтримують нашу справу, щоб дізнатися, чи готові вони нам допомогти."
 INS_CAS_equipment_3:0 "Douglas A-26 Invader"
 INS_armored_car_equipment_1_short:0 "AS AC3D"
 INS_artillerie_inrichtingen_name_nationalized:0 "Industri Persenjataan Negara"
