 INDUSTRIAL_ORG_QUEUE_WINDOW_INSTRUCTION:0 "Коли ця організація зможе відкрити рису, вона відкриє першу рису в черзі.\n§GShift + клацніть§! по рисі, щоби §Yдодати її в чергу§!.\n§GПереміщуйте риси мишею§!, щоби §Yзмінити порядок черги§!."
