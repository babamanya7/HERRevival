 NO_RAILWAY_ACCESS_TO_TARGET:0 "Військова частина не може ввійти в провінцію без залізниць."
 NSB_poland_communist_events.3.desc:0 "[From.GetNameDefCap] вимагає негайної анексії держави [Root.GetNameDef]. [From.GetLeader] починає анексію, щоб реалізувати свої вимоги на «Співдружність соціалістичних республік». своєї незалежності, і [Root.GetNonIdeologyName] стане частиною [From.GetAdjective] держави."
 NSB_poland_communist_events.502.a:0 "Ми залишимося в альянсі [From.GetFactionName]"
 NSB_poland_events.401.desc.com:0 "[From.GetNameDefCap] сьогодні знову звертається до нас і оголошує про згоду продати територію [POL_colony_purchase.GetName]. Тепер залишається лише вгамувати наші борги перед державою [From.GetNameDef]; POL_colony_purchase.GetName] вже звільнений від гніту [From.GetAdjective] колоніалізму."
 NSB_poland_monarchist_events.3.t:0 "[From.GetLeader] влаштовує переворот!"
 NSB_polish_fascist_events.1.t:0 "Пакт Бека — Ріббентропа"
 NSB_polish_fascist_events.2.t:0 "[From.GetNameDefCap] прагне розділити Литву"
 NSB_soviet_civil_war_common.114.desc:0 "Навчені в Німеччині українські солдати захопили контроль над ключовими містами по всій Україні. Утворено тимчасовий уряд, який очолює [UKR.GetLeader], і [UKR.GetNameDef] тепер проголошується незалежною державою."
 NSB_soviet_civil_war_common.116.desc:0 "Наші переговори з \"[FROM.GetAdjectiveCap]ий представниками увінчалися успіхом. В обмін на дозвіл [BLR.GetAdjective] уряду у вигнанні повернутися після війни [FROM.GetAdjective] уряд підтримає нас спорядженням і допомогою у військовому будівництві."
 NSB_soviet_civil_war_common.118.b:0 "Ми можемо виділити їм бодай кілька гвинтівок."
 NSB_soviet_civil_war_common.118.d:0 "Нам немає сенсу втручатися в це."
 NSB_soviet_communist_civil_war.001.d:0 "Зінов'єв — природжений лідер."
 NSB_soviet_communist_civil_war.002.c:0 "Потрібен хтось, хто забезпечить лояльність армії."
 NSB_soviet_fascist_tsarist.26.t:0 "Токійська вісь — [JAP.GetName] приймає пропозицію"
 NSB_soviet_foreign_politics_events.12.t:0 "[FROM.GetNameDefCap] хоче розширити прикордонні зміцнення"
 NSB_soviet_foreign_politics_events.152.a:0 "Вони вибрали собі незавидну долю."
 NSB_soviet_foreign_politics_events.153.desc:0 "Ми отримали дипломатичну ноту від держави [FROM.GetNameDef], яка пропонує нам провести спільну військову операцію проти держави [PER.GetNameDef]. [FROM.GetAdjective] командування стверджує, що ця операція дозволить нам захопити іран нафтові родовища та отримати шляхи постачання до держави [FROM.GetNameDef], не давши при цьому можливому супротивнику просунутися з держави [TUR.GetNameDef] до держави [PER.GetName] до бакинської нафти та держави [RAJ.GetNameDef]."
 NSB_soviet_foreign_politics_events.155.desc:0 "Після кількох виснажливих зустрічей [ROOT.GetAdjective] і [FROM.GetAdjective] дипломатів [FROM.GetNameDef] вирішує не втручатися в наші плани на державу [PER.GetNameDef]. [FROM.GetLeader] наважився припустити, що ця пропозиція — лише спроба виправдати наші територіальні амбіції. Схоже, що нам доведеться розбиратися з державою [PER.GetNameDef] самостійно."
 NSB_soviet_foreign_politics_events.263.desc:0 "Посол, якого надіслав [FROM.GetLeader], з'явився до нас зі сміливою пропозицією. [FROM.GetAdjective] уряд бажає підписати договір про укладання союзу з нами! Деталі договору ще потрібно уточнити, але головною метою союзу стане зниження або усунення впливу держави [USA.GetNameDef] у Тихому океані. Такий договір одним махом усуне головну загрозу нашій позиції в Китаї і дозволить вивільнити чимало військ, які можна використовувати в інших місцях. Більшість флотських офіцерів раді такому пропозиції, офіцери ж наземних військ ставляться до нього з підозрою, турбуючись, що [FROM.GetNameDef] завдасть нам удару в спину при першому зручному випадку."
 NSB_soviet_foreign_politics_events.275.a:0 "Непродумане рішення..."
 NSB_soviet_foreign_politics_events.276.a:0 "Ці ресурси нам не важливі. Нам потрібне золото!"
 NSB_soviet_foreign_politics_events.276.b:0 "Ресурси в [ROOT.GetAdjective] надрах належать державі [ROOT.GetName]!"
 NSB_soviet_foreign_politics_events.280.a:0 "Справедлива пропозиція."
 NSB_soviet_nationalist.004.a:0 "Треба домогтися підпорядкування!"
