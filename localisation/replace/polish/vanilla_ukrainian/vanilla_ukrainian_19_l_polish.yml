 COG_force_publique_desc:0 "Force publique — це жандармерія та військова сила Конґо, заснована в 1877 році під час Свободної держави Конґо. Її офіцери повністю європейці, будь то бельгійці чи найманці, в той час як звичайні солдати в основному є вихідцями з Конґо. Сила дуже ефективна, коли це необхідно, проте нерівність та погане управління викликають велике невдоволення."
 COG_formally_recognize_the_kimbanguist_church_desc:0 "Симон Кімбангу, самопроголошений особливий посланець самого Ісуса Христа, був кісткою в горлі нашої адміністрації протягом багатьох років. Однак з огляду на кількість підтримки, яку його рух отримав серед місцевого населення, настав час офіційно визнати Церкву Ісуса Христа на землі його особливим посланцем Симоном Кімбангу як легітимну релігійну організацію в нашій країні."
