 MAN_tsr_depose_puyi_desc:0 "Пуї виконав свою мету як фігура на чолі держави, але тепер він служить лише перешкодою для справжньої демократії. Перебування під владою монарха лише сприятиме закріпленню нашої держави в середньовічних концепціях аристократії та дворянства. Тому вкрай важливо усунути його з посади."
