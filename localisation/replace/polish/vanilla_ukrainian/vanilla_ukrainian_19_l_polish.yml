 ARG_envoy_to_london_idea:0 "Тісні зв'язки з Лондоном"
 ARG_expand_aluminum_extraction:0 "Розширити видобуток алюмінію"
 ARG_fourth_reich_fascism_ADJ:0 "Аргентинськ"
 ARG_infantry_equipment_2_short:0 "Hafdasa C-4"
 ARG_integrate_the_motherland_desc:0 "Керівні класи на територіях, які ми звільнили від капіталістичної та фашистської гнилі, можуть продовжувати повставати проти нас, якщо ми не вживемо заходів, щоб інтегрувати їх у нашу зростаючу коаліцію."
 ARG_invite_ghioldi_back_to_argentina:0 "Запросити Ґйольді назад до Аргентини"
 ARG_islas_del_atlantico_sur:0 "Islas del Atlántico Sur"
 ARG_light_ship_engine_1:0 "«Parsons» 42 000 к. с. н. в."
 ARG_military_government_idea:0 "Військовий уряд"
 ARG_military_production_lines_desc:0 "Зі зростанням кризи по всьому світу було б розумною ідеєю інвестувати в майбутнє нашого військового виробництва. Якщо ми побудуємо більше фабричних комплексів, призначених для військового обладнання, то ми найкращим чином підготуємося до наближення бурі."
 ARG_modify_growing_nationalism_ns_intro:0 "Ідею §Y$ARG_growing_nationalism_modifier$§! буде змінено:"
 ARG_news_events.3.t:0 "[ARG.GetAdjective] Комуністична Революція"
 ARG_no_gods_no_masters:0 "Ні богів, ні господарів"
 ARG_political_events.100.b:0 "Ми повинні йти наодинці."
 ARG_political_events.110.t:0 "[FROM.GetNameDefCap] здійснює агресивні кроки щодо [URG.GetNameDef]"
 ARG_political_events.16.t:0 "[PAR.GetNameDefCap] погоджується на умови ультиматуму"
 ARG_political_events.2.desc:0 "Незважаючи на нашу відданість невтручанню в цей конфлікт, [USA.GetAdjective] дипломати продовжують тиснути на нас, щоб ми розірвали зв'язки з нашими [GER.GetAdjective] друзями. Сьогодні вранці нас рішуче попросили запровадити ембарго проти [GER.GetName], щоб зберегти мир на американському континенті. Це поставило нас у скрутне становище, і залишатися поза цією війною стає з кожним днем все важче."
 ARG_political_events.5.b:0 "Ми не можемо віддати їх просто так..."
 ARG_preparation_for_the_elections_desc:0 "Термін Августіна Педро Хусто добігає кінця, і [ARG.GetName] готова до нового президента. Хоча офіційним кандидатом від уряду є Роберто Марія Ортіс, опозиційна партія на чолі з Марсело Т. де Альвеаром все ще має шанс поборотися за більш демократичну [ARG.GetName]. Прецедент для виборів створений, і тепер залишається лише побачити, як вони пройдуть."
 ARG_promote_urbanization:0 "Сприяти урбанізації"
 ARG_rapid_militirization_desc:0 "Тепер, коли у нас при владі міцний військовий уряд, ми можемо почати дивитися на наші експансіоністські цілі. Настав час розширити нашу військово-промислову модель та збільшити виробництво зброї та військ. Світ повинен готуватися протистояти силі [ARG.GetNameDef]."
 ARG_royal_navy_influence_desc:0 "Тепер, коли наші зв'язки з Британією тісніші, ми повинні подивитися, чи можемо ми навчитися і з їхніх військових зусиль. Королівський флот широко поважається, і вивчення їхніх операцій, ймовірно, буде корисним. Поки ми цим займаємося, ми повинні розглянути можливість дослідження кораблів, подібних до їхніх."
 ARG_ship_torpedo_1:0 "3x 533-мм торпедний апарат"
 ARG_ship_torpedo_4:0 "5x 533-мм ТА (пневм.)"
 ARG_socialist_researchers:0 "Соціалістичні дослідники"
 ARG_tac_bomber_equipment_0_short:0 "FMA AeMB.1"
 ARM_fascism_party:0 "Вірменський легіон"
 ASSIGN_LEADER_TITLE:0 "Обрати командувача для: $UNIT|Y$"
 AST_CAS_equipment_1_short:0 "Wirraway"
 AST_CSIR:0 "ДОНПД"
 AST_EQUIPMENT_VERSION_11:0 "Mk XI"
 AST_adela_imperial_fascism_DEF:0 "$AST_autonomy_dominion_DEF$"
 AST_advance_pacific_initiatives_desc:0 "Завдяки укладеним пактам про ненапад наші відносини з азійськими сусідами покращилися. Ми продовжимо максимально використовувати ці зв'язки та закличемо наших нових союзників допомогти нашому промисловому розвитку."
 AST_against_war_and_fascism:0 "Проти війни та фашизму"
 AST_all_dressed_up_idea:0 "При повному параді"
 AST_alp:0 "§YАЛП§!"
 AST_australian_arms_production_desc:0 "Доставка вантажів морем забирає багато часу, і це означає, що виробництво власної зброї для Австралії набагато важливіше, ніж для інших домініонів. У нас вже є заводи та технології."
 AST_australian_army_catering_corps:0 "Продовольчий корпус Австралійської армії"
 AST_australian_command_desc:0 "Оскільки важливість оборони та безпеки Австралії стала очевидною навіть у [ENG.GetNameDef], необхідна реорганізація наших спільних сил. З передачею більшої кількості британських сил під австралійське командування можна буде вести війну ефективніше."
 AST_australian_military_forces_desc:0 "Загартовані у вогні Великої війни, австралійські військові довели свою доблесть на далеких берегах, твердо стоячи в деяких з найжорстокіших кампаній того конфлікту. У роки по тому армія була зменшена в розмірах і переформована в оборонні сили, завданням яких переважно є захист рідних островів. Важко здобуті уроки минулого зберігаються, готові бути застосованими знову."
 AST_borderless_solidarity:0 "Солідарність без кордонів"
 AST_borderless_solidarity_desc:0 "Солідарність. Слово, що об'єднує робітників світу. Жоден кордон не може нас розділити, жодна нація не може стояти самотньо. Де б не палала боротьба, ми відповімо на заклик і станемо разом у глобальній битві за визволення."
 AST_broken_hill_proprietary_company_ic_tt:0 "Ефекти від промислового концерну §Y$AST_broken_hill_proprietary_company_ic$§! покращено"
 AST_bwc_count_2:0 "Удруге [ENG.GetLeader] просить про присутність [AST.GetLeader], стверджуючи, що саме наша тісна співпраця визначить результат нашої спільної боротьби.\n\n"
 AST_cabinet_trust_effects_1:0 "[GET_AST_CABINET_TRUST_EFFECTS_1]"
 AST_canberra_air_disaster_events.3.desc:0 "Після успішного вотуму недовіри чинний уряд нарешті замінюють, і він неохоче передає кермо влади своїм наступникам. Після періоду політичної нестабільності та суспільної недовіри Австралія готова до нового початку."
 AST_crush_the_gates_desc:0 "Нарощування сил завершено. Австралійська промисловість тепер працює на повній воєнній основі, її продукція повністю спрямована на оборону та проєкцію національної могутності. Який би шторм не насувався, Австралія зустріне його не як неохочий домініон, що поспіхом намагається мобілізуватися."
 AST_cv_fighter_equipment_3_short:0 "Firefly"
 AST_develop_port_kemla_steel_tt:0 "Це дозволить нам прийняти рішення §YПобудувати другу доменну піч у Порт-Кембла§!, що значно підвищить наше виробництво §YСталі§!."
 AST_diplomatic_events.1.b:0 "Так, підпишемо."
 AST_diplomatic_events.38.desc:0 "У результаті Першої світової війни кілька німецьких територій у Тихому океані опинилися під контролем Австралії, але тепер може з'явитися спосіб повернути одну з них: острів Науру.\n\n[AST.GetFascistParty] поділяє цінності, що збігаються з нашими інтересами, однією з яких є повне відділення [AST.GetName] від [ENG.GetNameDef]. Через обмежений наразі вплив руху, його представники шукають нашої підтримки, щоб прискорити своє зростання, і як тільки вони повністю прийдуть до влади, вони наполягають на поверненні контролю над островом Науру — за умови, що ми гарантуємо їхню безпеку, коли вони будуть домагатися незалежності."
 AST_diplomatic_events.7.desc:0 "[AST.GetNameDefCap] бажає отримати спорядження від союзників для своїх військових потреб і просить нашої допомоги в управлінні необхідними поставками. Чи можемо ми виділити конвої, щоб дозволити [AST.GetName] скористатися ними?"
 AST_diplomatic_events.73.t:0 "[USA.GetNameDefCap] відмовляється"
 AST_diplomatic_events.76.desc:0 "[USA.GetNameDefCap] відмовилася віддати нам [PHI.GetNameDef]. Незважаючи на наші вимоги та зростаючий вплив у Тихому океані, Вашингтон не бажає відмовлятися від контролю над територією."
 AST_diplomatic_events.8.a:0 "Вони стануть у великій нагоді!"
 AST_dominate_the_skies_desc:0 "Австралія знаходиться далеко від більшості ворожих авіабаз, тому ми мусимо досягти абсолютної повітряної переваги в нашому куточку світу."
 AST_eastern_focus_desc:0 "Якщо британські війни є австралійськими, то австралійські війни також є британськими. Японське вторгнення вже давно стало незаперечною загрозою, і ми більше не миритимемося з нинішньою пасивністю, яка чекає, поки конфлікт впаде нам на голову. Ми покажемо Японії, що означає австралійська рішучість, тоді як Британія доведе свою лояльність найсміливішою заявою з усіх: оголошенням війни."
 AST_edward_milford:0 "Едвард Мілфорд"
 AST_election_events.1.desc.a:0 "Голоси підраховано; на виборах перемогла Об'єднана австралійська партія.\n\nОАП пройде короткий період формування уряду, після чого наступні три роки доводитиме, що громадяни не дарма довірилися її представникам."
 AST_election_events.3.t:0 "$AST_election_season_cat$"
 AST_electrical_grid_expansions_desc:0 "В обмін на те, що [ROOT.GetFascistParty] проводитиме вигідну для них політику, провідні діячі бізнесу погодилися інвестувати в галузеві реформи, які узгоджуються з цілями партії.\n\nРозширюючи нашу електромережу, ми можемо сприяти внутрішньому виробництву енергії, яке не залежить від імпорту."
 AST_equal_pay_desc:0 "Існує стійка омана, що ті, хто володіє засобами виробництва, заслуговують на більше, ніж ті, хто працює на них. Власники і менеджери не працюють важче, і вони не є від природи більш кваліфікованими. Вирівнявши зарплати, плоди праці можна буде ділити більш справедливо по всьому суспільству."
 AST_fighter_equipment_3_short:0 "CA-15"
 AST_ford_australia_organization:0 "Ford Australia"
 AST_government_aircraft_factories_organization:0 "Урядові авіаційні заводи"
 AST_heavy_tank_destroyer_equipment_3:0 "Churchill Black Prince Tank Destroyer"
 AST_indirect_support:0 "Непряма підтримка"
 AST_invoke_the_1903_defence_act:0 "Застосувати Закон про оборону 1903 року"
 AST_jet_strat_bomber_equipment_1_short:0 "Vulcan"
 AST_land_development:0 "Освоєння земель"
 AST_light_tank_aa_equipment_2:0 "M3 Light Anti-Air"
 AST_light_tank_artillery_equipment_1_short:0 "Vickers Mk VI SPA"
 AST_m_special_unit_desc:0 "Спецзагін M займеться попередньою розвідкою та збором інформації та забезпечуватиме нас актуальними даними про кількість та розташування ворожих військ."
 AST_medium_tank_artillery_equipment_3_short:0 "Yeramba"
 AST_medium_tank_destroyer_equipment_2_short:0 "Sentinel TD"
 AST_mio_trait_evans_deakin_pacific_raider_refit:0 "Переобладнання тихоокеанських рейдерів"
 AST_mount_isa_mines_ic:0 "Mount Isa Mines"
 AST_new_south_wales_rc_organization:0 "$new_south_wales_rc$"
 AST_permanant_military_forces_desc:0 "Основними збройними силами Австралії є міліція, якій доручено захищати материк. Однак у цей час зростання глобальної напруженості доцільно створити кадри професійних офіцерів і солдатів, багато з яких здобули досвід під час Великої війни. Навіть якщо спочатку вони служитимуть у резерві, ці сили забезпечать стабільність і стандартизований рівень підготовки."
 AST_phosphate_commission:0 "Фосфатна комісія"
 AST_pilbara_mining_tt:0 "Відкриття §Y$STATE_870$§! для подальшої розвідки розблокує повторюване рішення для збільшення виробництва сталі без обмежень."
 AST_rural_concessions_desc:0 "Сільські представники Аграрної партії отримують надто мало голосів, щоб правити самостійно, але вітаючи їхній вплив в австралійській політиці, ми, як нині правляча партія, можемо отримати додаткову підтримку."
 AST_scale_up_pilbara_mines_steel_decision:0 "Масштабувати шахти Пілбари"
 AST_scrap_iron_flotilla_taog:0 "Флотилія з металобрухту"
 AST_second_australian_imperial_force_desc:0 "Австралія розгорнула Перші Австралійські Імперські сили під час Великої війни, відправивши війська за кордон для бойових дій. Оскільки війна знову загрожує охопити світ, ми повинні створити Другі Імперські сили, щоб продемонструвати силу Австралії за кордоном."
 AST_singapore_strategy_idea:0 "Оборонні споруди Сінгапуру"
 AST_sufficient_funds_tt:0 "Достатньо коштів (Буде досягнуто через §Y[?AST_insufficient_funds:days_left]§! днів)"
 AST_supply_minister:0 "Міністр постачання"
 AST_the_brisbane_line:0 "Лінія Брісбена"
 AST_the_red_pacific:0 "Червоний Тихий океан"
 AST_under_the_rule_of_canberra:0 "Під владою Канберри"
 AST_union_control_events.4.desc:0 "До уряду дійшов шокуючий звіт. У результаті скоординованої операції було захоплено один із наших штатів і оголошено його частиною революційного уряду. Швидкість та організація нападу викликали незручні запитання — наші спецслужби підозрюють, що повстанці діяли не самі, і що до наших берегів їх могли направити іноземні сили. Ті, хто врятувався під час захоплення, не здалися. Вони перегрупувалися і взялися за зброю, налаштовані повернути те, що у них забрали."
 AST_until_the_tide_of_battle_swings:0 "Поки хід битви не зміниться"
 AST_uranium_mining:0 "Видобуток урану"
 ASY_democratic:0 "Ассирійська республіка"
