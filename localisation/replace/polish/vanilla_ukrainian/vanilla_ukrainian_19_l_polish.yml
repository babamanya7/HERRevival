 SPA_support_the_war_industry:0 "Підтримати військову промисловість"
 SPA_the_stabilization_plan_desc:0 "Ми повинні триматися подалі від нерозумної мрії фалангістів про автаркію та неспроможної економічної політики, яка реалізується на її шляху. Щоб досягти економічного паритету з рештою світу, ми повинні звернути увагу на економічну лібералізацію, яка, сподіваємося, спровокує економічний бум, який принесе користь усім іспанцям."
 SPC_democratic_ADJ:0 "Іспанськ"
