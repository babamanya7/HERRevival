 CHI_shanghai_power_company:0 "Шанхайська енергетична компанія"
 CHI_ship_light_medium_battery_2:0 "14cm/50 3rd Yr. Type"
 CHI_suspend_the_inter_party_coordination_council_desc:0 "Ми можемо призупинити МКР, якщо їхня робота стане активно шкодити країні. Ми можемо відновити його пізніше, якщо ситуація зміниться."
 CHI_the_lingguang_incident_cat_desc:0 "Після серії провокацій, викликаних як спробами центрального уряду отримати владу над Півднем, так і відстоюванням двома південно-східними провінціями Ґуандун і Ґуансі своєї незалежності та наполяганням на жорсткішому підході до Японії, це переросло в повномасштабну кризу."
 CHI_the_northwest_highway:0 "Північно-західна магістраль"
 CHI_the_political_tutelage_upgraded_dm:0 "Відновлена республіка"
 CHI_towards_a_popular_army_desc:0 "Нашим збройним силам бракує спорядження та вишколу, але єдине, що у нас є — це люди. Ми змусимо іноземних загарбників розбитися об стіну солдатів, якою є Національно-революційна армія."
 CHI_tsr_low_legitimacy_4:0 "Легітимна династія"
 CHI_tsr_the_reorganied_government:0 "Реорганізований уряд"
 CHI_unify_as_the_china_democratic_league_desc:0 "Як розрізнені малі групи ми не можемо протистояти Ґоміньдану, але якщо ми об'єднаємося, у нас може бути шанс. Але хто нас очолить?"
 CHI_warlord_PRC_communism_ADJ:0 "Китайськ"
 CHL_GATHERING_STORM_DESC:0 "Унаслідок краху на Уолл-стріт США припинили імпорт міді та селітри з Чилі, що було основним джерелом доходу країни. Це призвело до того, що Чилі стала південноамериканською країною, яка найбільше постраждала від економічної депресії, а політична нестабільність, яка тільки посилилася з депресією, досі не вирішена.\n\nПо мірі того, як термін Артуро Алессандрі добігає кінця, фашистський рух перебуває на підйомі, і країна яскраво пам'ятає перевороти попереднього десятиліття, а також Соціалістичну республіку Чилі 1932 року."
 CHL_a_grand_armada:0 "Велика армада"
 CHL_amerindian_federation_communism_ADJ:0 "Америндськ"
 CHL_augustin_de_guevara:0 "Агустін Морено Ладрон де Ґевара"
 CHL_augusto_pimochet:0 "Аугусто Піночет"
 CHL_avenge_the_pacification_tt:0 "Різні антимапуче елементи в країні послідують за §YКарлосом Ібаньєсом дель Кампо§! у §Rгромадянській війні§! проти нас!"
 CHL_carabineros_de_chile_fascist_desc:0 "Carabineros de Chile — це наша національна правоохоронна жандармерія, яка має юрисдикцію над усією країною. Створена колишнім президентом Карлосом Ібаньєсом дель Кампо у 1927 році; їхня місія полягає у підтримці порядку та забезпеченні дотримання законів Чилі."
 CHL_carabineros_de_chile_neutrality:0 "$CHL_carabineros_de_chile_fascist$"
 CHL_chilean_economy_dynamic_modifier_desc:0 "Через значну залежність від експорту, серед іншого, міді та нітратів, чилійська економіка сильно постраждала після великої кризи, коли найбільший торговий партнер Чилі, США, припинили імпорт із Чилі, і країна була змушена розпродати шматки землі, щоби не допустити повного колапсу економіки. Було докладено зусиль для врегулювання ситуації, але потрібно зробити ще більше. Колись чилійська економіка знову стане великою!"
 CHL_deeper_mines_modifier:0 "Експансивні системи шахт"
 CHL_demand_the_guayanas:0 "Вимогти Ґвіану"
 CHL_french_investments_desc:0 "Жак Антуан Бернар прибув до країни з грошовою підтримкою французьких дворян, невдоволених Республікою, в якій вони зараз живуть, сподіваючися на краще майбутнє в державі [CHL.GetNameDef]."
 CHL_hispanic_union_democratic:0 "Федерація іспанських республік"
 CHL_industrial_decisions_desc:0 "Наша економіка була зруйнована крахом на Ўолл-стріт і подальшою депресією. Аби економіка й наш народ знову процвітали, ми мусимо відновити промисловість, перезапустити експорт і розширити нашу національну спеціалізацію."
 CHL_inflation_control_by_the_central_bank_desc:0 "Banco Central de Chile був заснований президентом Артуро Алессандрі в 1925 році. Ми мусимо доручити йому контролювати інфляцію, щоби підтримати довгостроковий економічний розвиток Чилі та запобігти спіральному зростанню цін, яке завдає економічної та політичної шкоди."
 CHL_joint_research_initiatives:0 "Спільні дослідницькі ініціативи"
 CHL_la_moderna_araucania:0 "La Moderna Araucanía"
 CHL_law_of_permanent_defense_of_democracy:0 "Закон про постійну оборону демократії"
 CHL_mapuche_liberate_isthmo_amerindia:0 "Визволити [IAS.GetAdjective]ий народ"
 CHL_mapuche_state_communism:0 "Союз корінних народів мапуче"
 CHL_modern_conquistadors:0 "Conquistadores de Pedro de Valdivia"
 CHL_policies_of_arturo_alessandri_desc:0 "Політика Алессандрі багатогранна, а його останній термін іще навіть не закінчився. Він надзвичайно допоміг нації, і досі має силу допомогти їй іще більше. Він справді є батьком новітнього втілення Чилі."
