 news.109.t:0 "Падіння Каїру"
 news.117.b:0 "За імператора!"
 news.119.d:0 "Просуваючись усе далі на південь, японська імперія захопила Сідней та столицю Австралії — Канберру. Захисникам Сіднею довелося відступити через міст Гарбор-Бридж і зайняти нові позиції на пагорбі Обсерваторії, проте знищити міст їм не дозволили японські солдати, які продовжили наступ на столицю.\n\nВійськовий прапор Японії тепер майорить над ратушею Канберри, що стала штаб-квартирою нової військової адміністрації, і військова поліція кемпейтай патрулює вулиці, пильно стежачи за тим, що відбувається."
 news.14.b:0 "Так їм буде краще."
 news.167.d:0 "Включивши Австрію до свого складу, держава [GER.GetName] використала це для виправдання подальших претензій та назвала «правомірним» повернення колишніх австрійських територій, зокрема Словенії, яка зараз належить державі [YUG.GetName].\n\nУ відповідь на це в Лондоні була скликана конференція для обговорення «словенського питання», куди прибули делегати країн, які підписали Версальський договір.\n\nКонференція була закінчена неочікуваним проявом лояльності, оскільки Італія підтримала територіальну цілісність [YUG.GetName], залишивши вимоги Німеччини невизнаними.\n\nЯк завжди, італійська зовнішня політика абсолютно непередбачувана, і ще невідомо, куди приведе цей ґамбіт."
 news.176.c:0 "Похмурий день для старих союзників."
 news.179.e:0 "Тривожний розвиток подій."
 news.192.t:0 "Італія претендує на югославські території"
 news.194.c:0 "Державі [Poland.GetName], схоже, не лишили іншого вибору."
 news.204.a:0 "Німеччина проігнорувала кожне попередження!"
 news.205.e:0 "Сподіваймося на тривалий мир"
 news.209.c:0 "Вони не розуміють, з якою страшною силою їм доведеться зіткнутися"
 news.214.c:0 "Вони явно намагаються загрожувати державі [GER.GetName]."
 news.222.c:0 "[ENG.GetNameDefCap] повинен зробити важкий вибір."
 news.226.a:0 "$news.225.a$"
 news.231.b:0 "Конфлікт у Китаї викликає занепокоєння."
 news.232.d:0 "Говорячи про «спільні політичні інтереси», [GER.GetLeader] сьогодні оголосив про дипломатичну програму поліпшення відносин між [GER.GetNameDef] і скандинавськими країнами.\n\nПершим кроком є створення постійної дипломатичної місії в державу [DEN.GetNameDef], що забезпечить відсутність конфліктів між двома країнами.\n\n[DEN.GetAdjective]ий уряд люб'язно прийняв цю дипломатичну пропозицію, згідно з [GER.GetLeader].\n\n[DEN.GetAdjective]і дипломати були недоступні для коментарів."
 news.238.b:0 "Будемо сподіватися, [AST.GetNameDef] знає, що робить."
 news.241.d:0 "Після створення соціалістичної робітничої держави в Австралії, [AST.GetAdjective]ий уряд зараз працює над тим, щоб поширити свій вплив на регіон. Посилаючись на заклики пригноблених фермерів та фабричних робітників [NZL.GetNameDef], [AST.GetNameDef] тисне на [NZL.GetAdjective]ий уряд, щоби той приєднався до «Народного союзу» південної частини Тихого океану.\n\nБачачи себе оточеним, і майже не сподіваючись на своєчасну допомогу від [ENG.GetFactionName], [NZL.GetNameDef] пристав на вимоги. Хоча [AST.GetLeader] проголошує «рівність усіх держав як продовження рівності всіх людей», мало хто сумнівається в тому, яка саме держава керує."
 news.242.d:0 "\nВійськова доктрина [ENG.GetNameDef] довгий час боролася з питанням оборони в Південно-Східній Азії. Тепер вони сподіваються, що їх проблемам прийшов кінець, оскільки [AST.GetNameDef] бере на себе відповідальність за оборону Сінгапуру і Борнео, щоб протистояти ворожій військовій активності в регіоні.\n\nЦя передача влади включає, принаймні на даний момент, цивільну адміністрацію колоніальних регіонів, щоб дозволити [AST.GetNameDef] вжити будь-яких заходів, необхідних для захисту їх континенту від нападу з-за кордону. Політичні наслідки цього кроку для [ENG.GetNameDef], [AST.GetNameDef] і [MAL.GetNameDef] поки що не визначені."
 news.245.b:0 "Це забезпечить нам місце домінуючої держави в Тихоокеанському регіоні."
 news.251.d:0 "\n\nПісля невдалих переговорів з Вестмінстером і безпрецедентних 63-годинних дебатів канадський парламент скасував Акт про Британську Північну Америку, натомість закріпивши Конституцію Канади в законах, недоторканних для британського парламенту або монархії.\n\nХоча сам по собі цей крок не є антибританським, він сигналізує про відхід від політики Співдружності колишньої імперії.\n\nХоча він є природним кроком для будь-якої країни, яка прагне гарантувати стабільність у майбутньому, він не сприяє пом'якшенню і без того напруженої обстановки у глобальній політиці."
 news.253.d:0 "\nУ своїй промові сьогодні вранці прем'єр-міністр [AST.GetLeader] оголосив про відданість австралійського уряду зростанню і стабільності як океанічної держави. Це означає пошук нових берегів, відмінних від британської Європи, оскільки австралійський народ більше не може нести на своїх плечах тягар зовнішніх конфліктів. Прямо посилаючись на королівську промову на відкритті останнього парламенту, [AST.GetLeader] влучив у ціль, заявивши: \"Ніколи більше Галліполі!\" Захоплені вигуки натовпу свідчать про те, що в австралійській політиці розпочалася нова ера. Чим вона закінчиться, світ може тільки починати припускати."
 news.265.c:0 "Французам кінець."
 news.271.a:0 "Світ тремтить від вигляду наших танків!"
 news.28.c:0 "Хоча б Гітлера вже нема."
 news.293.c:0 "Чудово... Тепер наша черга."
 news.294.t:0 "$news.293.t$"
 news.309.desc.b:0 "[HUN.GetAdjectiveCap]а влада висунула вимогу, щоб Словаччина знову стала частиною їхньої держави в якості невід'ємної її частини або автономного регіону. Було висунуто ультиматум, підкріплений загрозою застосування сили, і словацький уряд у гарячці намагається знайти дипломатичне вирішення цієї нещодавньої [HUN.GetAdjective]ої кризи."
 news.318.a:0 "Вони знали, як краще для них."
 news.323.a:0 "Прощавай."
 news.325.a:0 "Югославія для всіх слов'ян!"
 news.329.b:0 "Ми покажемо їм Революцію."
 news.332.d:0 "У нас не було вибору."
 news.400.t:0 "Падіння міста [43.GetCapitalVictoryPointName]"
 news.55.d:0 "З огляду на зростаючу агресивність Німеччини, Велика Британія та Франція прийняли рішення про необхідність укладання військового союзу з Польщею. Британський прем'єр зробив таку заяву в Палаті громад: «У разі будь-яких дій, що явно загрожують незалежності Польщі, і якщо польський уряд визнає за необхідне протистояти таким діям військовими засобами, уряд Її Величності буде готовий надати Польщі всю можливу підтримку. Відповідні запевнення вже надані уряду Польщі»."
 northern_expansion_focus:0 "Розширення на північ"
