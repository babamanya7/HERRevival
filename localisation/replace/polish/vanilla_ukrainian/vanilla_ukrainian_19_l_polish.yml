 LAT_events.2.a:0 "А у нас є вибір?"
 LAT_events.5.t:0 "[From.GetLeader] бажає об'єднання Остланду"
 LAT_events.8.d:0 "Рішення уряду зняти заборону з фашистського угруповання «Громовий хрест» призвело до того, що Густавс Целміньш та його прихильники по всій Латвії стають все сміливішими, активнішими та злішими. Сьогодні їх агресія досягла найвищої точки — бійці «Перконкрустса» озброїлися і вирушили маршем на Ригу, вимагаючи негайної здачі латвійського уряду. Хоч і очевидно, що уряд не збирався співпрацювати з «Перконкрустсом», схоже, ця група вважає, що в їх керівному режимі [Root.GetLeader] не має місця."
 LAT_look_north:0 "[Root.Get_Look_North_Focus_Loc]"
 LAT_neutrality_party:0 "Народна рада"
 LAT_paramilitary_idea:0 "Латвійські збройні формування"
 LAT_perkonkrust_revolt_category_desc:0 "Ультранаціоналісти, які прославляють балтійські племена і латиський етнос, — Перконкрустс — є екзистенційною загрозою для Латвії, за створення якої ми так важко боролися. Перконкрустс — це інфекція на ураженій національній гордості, і вони мусять бути ліквідовані."
 LAT_ready_the_resistance:0 "[Root.Get_Ready_Resistance_Focus_Loc]"
 LAT_reorganize_forest_brothers_desc:0 "«Лісові брати» — захисники латвійської ідентичності та нашого права на самовизначення, але їм заважає прагнення захищати також і незалежність Литви та Естонії. Так далі продовжуватися не може: латвійські «лісові брати» повинні присвятити себе «Pērkonkrusts»!"
 LAT_restore_saeima_desc:0 "Латвійський сейм призначений для збору місцевих представників, і хоча він більше не управляє нашим урядом, ми можемо відновити його, давши роль радника при диктатурі і забезпечивши народ ілюзією демократії."
 LAT_saeimas_idea:0 "$LAT_saeima_idea$"
 LAT_the_old_ways_desc:0 "Учасники руху «Pērkonkrusts» не присвячують себе Христу та його вченню — вони приносять клятви іншим, давнім богам. Консерватори можуть вважати захопленість Целміньша давніми божествами страшною і протиприродною, але «Pērkonkrusts» бореться за справжню Латвію, вільну від впливу іноземних богів."
