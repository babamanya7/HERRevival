 JAP_anti_air_equipment_3:0 "25-мм зенітна гармата, тип 96"
 JAP_anti_tank_equipment_1_short:0 "37-мм гармата, тип 94"
 JAP_anti_tank_equipment_2_short:0 "37-мм гармата, тип 1"
 JAP_approach_mitsubishi_desc:0 "Компанія Міцубіші була спочатку заснована як судноплавна фірма на початку епохи Мейджі. Розширившись на більшість промислових секторів, сьогодні вони контролюють значну частину військової промисловості в нашій країні. Ми повинні заручитися їхньою підтримкою для нашого уряду, щоб ми могли максимально ефективно використовувати їхні потужності."
 JAP_approach_mitsui_desc:0 "Дзайбацу Міцуї бере свій початок у період Едо, і на сьогодні є однією з найбільших промислових корпорацій у нашій країні. Ми повинні заручитися їхньою підтримкою для нашого уряду, щоб ми могли максимально ефективно використовувати їхні послуги."
 JAP_army_and_naval_air_services_dm:0 "Повітряні сили армії та флоту"
