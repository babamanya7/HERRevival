 AFG_development_in_tms_desc:0 "Нафта стає критично важливим ресурсом для сучасної економіки чи військових. На щастя, розвідники визначили, що Туркменістан містить велику кількість дорогоцінної рідини, яка лише чекає на видобуток."
 AFG_economic_regionalism_desc:0 "Різні регіони Афганістану мають слабку єдність із національним урядом чи економікою через брак відповідної інфраструктури. Це ускладнює розподіл економічних тягарів чи вигод за межі окремих регіонів і сприяє їхній тривалій ізоляції."
 AFG_expand_academy_tt:0 "Вербує §Yдвох§! випадкових §YГенералів§!"
 AFG_industrial_events.20.desc:0 "[FROM.GetAdjective] уряд проводить політику збільшення іноземних інвестицій у країну та звернувся до нас щодо нашої зацікавленості. Хоча економічно ми не можемо отримати багато вигоди від цієї угоди, це була б чудова можливість вплинути на [FROM.GetAdjective] уряд, щоб він перейняв наш спосіб мислення."
 AFG_industrial_events.51.t:0 "Паштунський опір уздовж [AFG.GetAdjective] кордону"
 AFG_industrial_events.53.t:0 "[FROM.GetAdjectiveCap]ий уряд передає територію"
 AFG_industrial_events.54.t:0 "[FROM.GetNameDefCap] відмовляється від передачі території"
 AFG_industrial_events.55.b:0 "Ми готові захищати нашу територію за будь-яку ціну."
 AFG_infantry_equipment_1:0 "Rifle No.4 MkI"
 AFG_islamic_republic_democratic_DEF:0 "Ісламська республіка Афганістан"
 AFG_join_axis:0 "Приєднатися до Осі"
 AFG_modern_cataphracts_idea:0 "Сучасні катафракти"
 AFG_modify_er_ns_intro:0 "Модифікувати §Y$AFG_economic_regionalism$§! на:"
 AFG_modify_ssem_ns_intro:0 "Модифікувати §Y$AFG_subsistence_economy_modifier$§! на:"
 AFG_neutral_influence_desc:0 "Через відкриття нашої країни для іноземних інвестицій інші країни використовують цю можливість, щоб впливати на нашу політику."
 AFG_officer_training:0 "Навчання офіцерів"
 AFG_placated_graduates_desc:0 "Завдяки розширенню державної служби нам вдалося поглинути значну частину безробітних випускників, які інакше могли б радикалізуватися."
 AFG_political_events.102.a:0 "Ми будемо реалізовувати наш план альтернативними засобами."
 AFG_political_events.121.t:0 "[FROM.GetNameDefCap] погоджується прийти нам на допомогу"
 AFG_political_events.140.desc:0 "Ці вибори були дещо хаотичними, враховуючи відсутність у нації попереднього досвіду подібних подій. Однак кілька кандидатів, які виступали з широкими платформами, вийшли на перший план. Коли виборчі дільниці закриваються, здається, електорат був схильний до:"
 AFG_political_events.152.t:0 "[FROM.GetName] відхиляє договір"
 AFG_political_events.42.b:0 "Вони не залишають нам вибору."
 AFG_political_events.51.desc:0 "У невеликому повідомленні $AFG_amunullah_khan$, колишній правитель [FROM.GetNonIdeologyName], звернувся до нашого уряду з проханням про підтримку його відновлення на троні. Він обіцяє, що за німецької підтримки він створить сильну, модернізовану націю, узгоджену з нашими інтересами."
 AFG_political_events.72.a:0 "Ми повинні уникнути втягування в черговий конфлікт."
 AFG_political_events.81.a:0 "У них насправді не було вибору."
 AFG_political_events.87.t:0 "[FROM.GetNameDefCap] відхиляє Пакт"
 AFG_republic_democratic:0 "Республіка Афганістан"
 AFG_request_japanese_support:0 "Запросити японську підтримку"
 AFG_seek_american_aid:0 "Шукати американської допомоги"
 AFG_sinkiang_intervention_desc:0 "[SIK.GetNonIdeologyName] довгий час був частиною ісламського світу. Однак зростання комунізму в колишній Російській імперії та Китаї тепер загрожує нашим побратимам-мусульманам за кордоном. Настав час нам покласти край загрозі для них раз і назавжди."
 AFG_sugar_processing_desc:0 "Попит на цукор неухильно зростає серед нашого народу. Ми повинні задовольнити цей попит, створивши цукрову фабрику для переробки сільськогосподарської продукції на цю цінну речовину. Буде задоволений не лише попит, але й створена більша промислова зайнятість."
 AFG_suggest_integrate_state:0 "Запропонувати передачу §Y[FROM.GetName]§! до [ROOT.GetNonIdeologyName]"
 AFG_support_king_zahir_tt:0 "§YКороль Захір-шах§! отримує:\n Приріст політичної влади §G+5%§! \n Щоденна підтримка неприєднаних §G+0.02§!"
