 HUN_treaty_of_triannon_desc:0 "Тріанонський договір багато чим схожий на Версальський: він сковує нашу армію, не допускаючи її переозброєнню. Нашою головною метою є його переписання або скасування. Ми можемо це зробити шляхом зближення з Малою Антантою й запропонувати підписати Бледську угоду або відмовитися від нього взагалі. Останній варіант буде розглядатися як дуже агресивний і може спровокувати жорстку зворотну реакцію."
 HYD_DEF:0 "Гайдарабад"
 ICE_GATHERING_STORM_DESC:0 "Iceland has a long history of isolation and exploration. Having switched hands between her former owner Norway and her current overlord Denmark when Norway became a junior parter of Sweden in 1814, and having just received home rule in 1919.\n\nWith the Great depression striking Iceland, the situation looks bleak, and with conflict looming over the horizons, it may be time to jump ship and cut ties with the Danish once and for all."
 ICE_agricultural_expansion:0 "Розвиток сільського господарства"
 ICE_democratic:0 "Ісландія"
 ICE_expanding_the_university_of_reykjavik:0 "Розширення університету Рейк'явіка"
 ICE_general_strike:0 "Загальний страйк"
 ICE_hermann_jonasson:0 "Германн Йоунассон"
 ICE_industrial_research_school_desc:0 "Університет має великий успіх. Країні потрібно розвивати цей успіх, створюючи більш орієнтовану вищу освіту, спрямовану також на розвиток промисловості. Таким чином ми зможемо забезпечити себе необхідними інженерами."
 ICE_international_research_community_tt:0 "Кожна комуністична країна, яка не є членом альянсу або перебуває в альянсі з державою [ROOT.GetName]:"
 ICE_mine_iceland:0 "Замінувати Ісландію"
 ICE_organize_a_march_desc:0 "Занадто довго народ був поневолений іноземними володарями. Націоналістичний марш на столицю, подібний до маршу на Рим, послужить нагадуванням про наше сильне вікінґське минуле. Якщо ми зможемо залучити кожного волелюбного ісландця, ми зможемо показати уряду, що ісландський народ сильний, численний і об'єднаний! Разом ми можемо створити краще майбутнє!"
 ICE_the_icelandic_economy_modifier_desc:0 "Наша економіка сильно постраждала під час Великої війни, коли Ісландія була ізольована від решти світу. Потім настала депресія, і хоча континентальна Європа трохи оговталася, ісландська економіка продовжує страждати. Але, можливо, колись ми здивуємо світ..."
 ICE_thungur_hnifur_desc:0 "Ісландська армія ніколи не буде великою. Щоб компенсувати це, ми повинні забезпечити найкращу підготовку наших військ і зосередитися на наших сильних сторонах, щоб, коли ми завдамо удару, він був сильним."
