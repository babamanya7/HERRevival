 idea_SIA_civilian_opposition_desc:0 "Цивільне крило обернулося проти уряду. Чиновники зволікають, а бюджети розподіляються неправильно, гальмуючи державний механізм."
 idea_SIA_civilian_slight_support_desc:0 "Цивільне крило загалом підтримує курс уряду. Їхня співпраця приносить скромні, але відчутні переваги."
 idea_SIA_military_opposition_desc:0 "Військове крило працює проти уряду. Офіцери підривають виробничі зусилля, а ентузіазм щодо урядової справи зникає з лав."
 idea_SIA_military_slight_support_desc:0 "Військове крило здебільшого співпрацює. Їхня підтримка приносить скромні покращення в призові та виробництві, хоча і без повної віддачі."
