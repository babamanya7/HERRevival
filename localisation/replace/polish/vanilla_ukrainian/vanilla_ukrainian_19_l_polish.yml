 LIT_MIL_neutrality:0 "Литовська хунта"
 LIT_a_martial_prime_minister_desc:0 "Посада прем'єр-міністра зазвичай займає обраний чиновник, але в часи війни і впливу президента, що посилився, його правою рукою має бути сильний лідер — такий, якому [ROOT.GetLeader] зможе довіряти!"
 LIT_aleksandras_stulginskis:0 "Алєксандрас Стульґінскіс"
 LIT_baltic_defence_army:0 "Балтійська оборонна армія"
 LIT_events.101.b:0 "Ми не здамося без бою!"
 LIT_events.103.d:0 "[SOV.GetNameDefCap] не погоджується розділити разом з нами державу [POL.GetNameDef], і, хоча ми як і раніше вільні розпочати з ним війну, наші міністри впевнені, що вона закінчиться поразкою."
 LIT_events.104.t:0 "[POL.GetNameDefCap] відмовляється!"
 LIT_events.301.d:0 "Нарешті між державами [Root.GetNonIdeologyName] і [From.GetNonIdeologyName] укладено угоду про мир, і конфлікт, який періодично спалахував із самого зародження держави [Root.GetNameDef], тепер, схоже, завершено У серцях багатьох [From.GetAdjective] громадян ще живі думки про унію, але ми впевнені, що ця унія буде новою, заснованою на взаємоповазі союзників."
 LIT_events.5.a:0 "Місто нам марне. Забирайте."
 LIT_events.5.t:0 "[From.GetNameDefCap] вимагає область [784.GetName]"
 LIT_events.8.b:0 "Нізащо."
 LIT_events.9.d:0 "Згадавши про давню співпрацю Польщі та Литви, [From.GetLeader] припускає, що окупація Польщі альянсом [Root.GetFactionName] пройшла б без інцидентів, якби країна перейшла під одноосібне управління держави [From.GetNameD При окупації доведеться пожертвувати цінними ресурсами, які надає Польща, зате польський опір стане проблемою Литви."
 LIT_king_of_poland:0 "Королівство Польща"
 LIT_peasant_militia:0 "Селянське ополчення"
 LIT_rapid_fortifications_in_the_east:0 "Швидкі укріплення на сході"
 LIT_secure_a_loyal_cabinet_desc:0 "Тепер, коли переворот увінчався успіхом і Антанас Смєтона отримав абсолютну владу над урядом, настав час заново скликати сейм, щоб більш ефективно управляти нацією, оточивши диктатора лояльними йому міністрами."
 LOADING_TIP_133:0 "«Ми не в тому становищі, щоби вистояти у тривалій статичній війні. Де би союзники не зосередили свої сили, вони проб'ються».\n(Ґерд фон Рундштедт)"
