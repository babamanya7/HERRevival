 MUN_the_fall_of_the_republic.2.a:0 "Нам потрібні радикальні зміни."
 MUN_the_fall_of_the_republic.5.d:0 "Після здобуття нами незалежності було лише питанням часу, коли сусідня країна спробує включити нас до своєї території. Схоже, [FROM.getname] стала першою, хто це зробив, і тепер вимагає нашої капітуляції. Що ми маємо робити?"
