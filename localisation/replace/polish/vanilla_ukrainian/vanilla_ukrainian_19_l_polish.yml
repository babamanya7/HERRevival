 mtg_usa_foreign_support.10.desc:0 "Від нашої делегації в державі [From.GetNameDef] надійшло повідомлення. [From.GetAdjective] уряд схвалив створення кількох тренувальних таборів для підготовки членів Срібного легіону і навчання їх піхотної тактики. не вибухне війна."
