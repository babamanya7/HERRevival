 SPR_habsburg_neutrality:0 "Габсбурзька Іспанія"
 SPR_juan_negrin:0 "Хуан Негрін"
 SPR_national_strikes:0 "Національні страйки"
 SPR_new_leadership_desc:0 "Для того, щоб Республіка пережила ці важкі часи, потрібне нове керівництво. Ми залучимо радників і міністрів з новими поглядами на те, як найкраще боротися з фашистською загрозою, що дозволить нам краще захистити наші принципи та переконання."
 SPR_plant_the_seeds_of_revolution_tt:0 "Відкриває набір рішень §Y$SPR_the_seeds_of_revolution$§!, які дозволяють створити анархічні повстання в сусідніх ворожих країнах.\n"
 SPR_rebuild_the_nation_desc:0 "Після жахів громадянської війни стабільність повернулася, і ми поступово відновлюємо нашу промислову основу. Період великих інвестицій у програми розширення промисловості, безсумнівно, дасть нашій економіці поштовх, необхідний для того, щоби знову набрати тягу."
 SPR_shared_burdens_desc:0 "Боротьба за нашу свободу від авторитаризму, капіталізму та релігійних забобонів буде довгою та важкою. Ми всі повинні зробити свій внесок у подолання труднощів, які, без сумніву, чекають на нас, перш ніж усі зможемо пожинати плоди нашої праці."
 SPR_ship_heavy_battery_2:0 "35.6-см гармата"
 SPR_ship_light_battery_1:0 "102 mm/45 Vickers Mk L"
 SPR_star_bonifacio_echeverria:0 "Star Bonifacio Echeverria"
 SPR_submarine_4_desc:0 "The three submarines of the Spanish D class were all launched in 1944 and commissioned at various times after the war. All three were designed and built in Spain. They were large, oceangoing submarines, displacing 1,050 tons. They were armed with six 533mm torpedo tubes and had excellent speed and range."
 SPR_the_spanish_red_army_desc:0 "Для захисту інтересів іспанських робітників від іноземної загрози має бути створена нова лояльна армія. Ми будемо моделювати це за зразком Радянського Союзу."
 SPR_war_of_independence_tt:0 "§RЯкщо вони не приймуть наші вимоги, це призведе до війни!§!"
 SSB_chromium_2_tt:0 "Імпортує ресурси від інших членів пакту, додаючи:\n§Y4§! £GFX_resources_strip|1, §Y5§!£GFX_resources_strip|4, §Y6§!£GFX_resources_strip|2, §Y6§!£GFX_resources_strip|5 безпосередньо у §Yстолицю§!."
