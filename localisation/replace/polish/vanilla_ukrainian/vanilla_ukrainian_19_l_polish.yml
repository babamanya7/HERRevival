 JAP_continue_takahashi_korekiyos_policies:0 "Продовжити політику Такахаші Корекійо"
 JAP_demand_submission_from_breawakay_states:0 "Вимагати підкорення від держав, що відкололися"
 JAP_democratic_research_slot:0 "Реорганізувати Токійський імператорський університет"
 JAP_democratic_womens_suffrage:0 "Виборче право для жінок"
 JAP_develop_chinese_resources_desc:0 "Потрібно почати розробку багатих ресурсів Китаю, що потрапили в наші руки — вони послужать нам у наступній війні."
 JAP_develop_the_chinese_resources:0 "Розробка китайських ресурсів"
 JAP_east_asian_cooperative_society_desc:0 "Нещодавно розроблена теорія Східноазійського товариства співробітництва виступає за побудову кооперативного суспільства у Східній Азії, яке б вийшло за межі етнічних та національних кордонів. Ми повинні спиратися на цю ідею, щоб зміцнити нашу позицію як захисника Тихого океану та лідера народів Східної Азії."
 JAP_east_asian_cooperative_society_tt:0 "Відкриває рішення для налагодження дружніх стосунків та інвестування у природні ресурси §Yазійських країн§!"
