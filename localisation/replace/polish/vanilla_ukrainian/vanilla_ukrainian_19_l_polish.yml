 CHI_great_yuan_fascism:0 "Empire of the Great Khan"
 CHI_heavy_tank_equipment_3:0 "Type 43 Dà"
 CHI_hyper_inflation_1_desc:0 "Наші економісти помітили незначне зростання інфляції. Ми мусимо стежити за цим."
 CHI_hyper_inflation_none:0 "Стабільна економіка"
 CHI_labor_reform_desc:0 "Китайські звички та звичаї формувалися тисячоліттями. Настав час відкрити їм двері в сучасність."
 CHI_left_kmt_party_long:0 "Революційний комітет Ґоміньдану"
 CHI_legislative_yuan_desc:0 "Сучасна республіка спирається на законодавчий орган, який обирається народом. Ми мусимо привести нашу систему у відповідність."
 CHI_maintain_adequate_currency_reserves_desc:0 "Безрозсудні витрати загрожують крахом системи, як це було показано неодноразово. Якщо ми хочемо досягти успіху в контрольованому зростанні, нам потрібно стримувати себе і підтримувати належні валютні резерви."
 CHI_minister_of_transport_trait_2:0 "$CHI_minister_of_transport_trait$"
 CHI_mission_to_germany_desc:0 "Європейські парії проводять активні реформи, прагнучи повернути минулу славу. Ми можемо багато чого в них навчитися."
 CHI_mission_to_the_us_soong_us_decision:0 "Поки §YСун Мейлін§! залишається §Yполітичним радником§!, США може підтримувати нашу війну з §YЯпонією§!\n"
 CHI_modern_tank_artillery_equipment_1_short:0 "PLZ 59"
 CHI_modern_tank_destroyer_equipment_1:0 "PTZ 59"
 CHI_modify_corruption_in_the_armed_forces_tt:0 "Змінює §Y$CHI_corruption_in_the_armed_forces$§!:"
 CHI_nine_power_treaty_desc:0 "Ми все ще працюємо під впливом угод про нерівність, які формалізують «політику відкритих дверей» щодо Китаю. Іноземці все ще мають екстериторіальні права, а ми не повністю контролюємо нашу економіку."
 CHI_personal_leadership_desc:0 "Роз'єднане командування військами загрожує тим, що якийсь самовпевнений офіцер будь-якої миті може спробувати прийти до влади. Потрібно докласти всіх зусиль, щоби наші солдати завжди були вірні своєму уряду."
 CHI_renegotiate_with_warlord:0 "Почати переговори з §Y[FROM.GetNameDef]§!"
 CHI_republic_of_china_navy_desc:0 "Центральний флот мав складне минуле: погане фінансування та непевний контроль над узбережжям залишили наші кораблі у жалюгідному стані. З проблемами на горизонті, наша мета — залишити ці виклики позаду."
 CHI_revive_the_chinese_action_committee_desc:0 "Ґоміньдан монополізував доступ до армії, зосередивши владу в руках невеликої кліки. Однак деякі досвідчені військові не згодні з керівною групою, хоча й не підтримують комуністів."
 CHI_revive_the_chinese_action_committee_tt:0 "§Y$CHI_jiang_guangnai$§!, §Y$CHI_cai_tingkai$§! та §Y$CHI_chen_mingshu$§! стають доступними як §Yгенерали§!"
 CHI_salvage_enemy_equipment_desc:0 "Потреби Національно-революційної армії не можуть бути задоволені нашою промисловістю. Наші підрозділи могли б компенсувати частину цієї нестачі, повторно використовуючи те, що ми зможемо знайти у таборі ворога."
