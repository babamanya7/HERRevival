 SIL_jozsef_kozdon:0 "Йожеф Кождон"
 SKILL_LEVEL_DETAILS:0 "З кожним новим рівнем генерал отримує три очки випадкових параметрів. Вибрані риси підвищують ймовірність підвищення пов'язаних параметрів."
 SKK_DEF:0 "Сіккім"
 SLAVIC_UNIFIED_DEF:0 "Слов'янський Союз"
 SLAVIC_UNIFIED_fascism:0 "Слов'янська імперія"
 SLO_STATE_975:0 "Градсько"
 SMB_air_doctrine:0 "[SMB_air_doctrine_key]"
 SMB_air_force_default_desc:0 "Багато теоретиків стверджують, що найбільше ми відстаємо у розвитку сучасних військово-повітряних сил. Тому ми мусимо наполегливо працювати над тим, щоби виправити це, будуючи нові ангари та об'єкти, а також навчаючи додаткових пілотів."
 SMB_army_professionalism_default_desc:0 "Хоча мати якомога більше солдатів, готових приєднатися до армії, може бути гарною практикою, але, на думку наших іноземних військових радників, набагато важливіше переконатися, що армія дійсно діє в найкращому стані в будь-який момент часу."
 SMB_army_professionalism_desc:0 "[SMB_army_professionalism_desc_key]"
 SMB_establish_aircraft_industry_BRA:0 "Empresa Brasileira de Aeronáutica"
 SMB_foreign_advisors_default_desc:0 "Хоча [ROOT.GetAdjective]і військові інструктори хороші, вони не такі хороші, як ті, хто воював у численних конфліктах і пройшов підготовку у військових академіях найвищого рівня в інших країнах. Тому ми мусимо докласти зусиль для залучення іноземних військових радників, які допоможуть навчити нашу армію за спеціальностями своїх країн, щоб іще більше зміцнити наші збройні сили."
 SMB_fortification_effort_desc:0 "Хоча флот і авіація є нашими основними засобами для недопущення ворожих сил до наших берегів, ми все ще мусимо підтримувати потужну серію берегових укріплень як останню лінію оборони проти будь-якого загарбника."
 SMB_jungle_warfare_training:0 "Закласти CIGS"
 SMB_license_designs_desc:0 "[SMB_license_designs_desc_key]"
 SMB_logistics_department:0 "[SMB_logistics_department_key]"
 SMB_logistics_department_default_desc:0 "Південна Америка може бути нашим домом, але, тим не менш, це безжалісний континент для регулярних армій, на якому доводиться воювати. Щоб вирішити цю проблему, було б корисно заснувати рід військ, який би займався виключно належним управлінням і розподілом логістики."
 SMB_naval_foreign_advisors:0 "[SMB_naval_foreign_advisors_key]"
 SMB_naval_foreign_advisors_desc:0 "Останнім часом наші морські офіцери мали мало можливостей перевірити свої здібності в бою. Тому ми могли б отримати користь від запрошення офіцерів із іноземних флотів для навчання наших офіцерів сучасній морській тактиці."
 SMB_special_forces_option_3_continuation_default_desc:0 "Аби наші десантники мали якомога більше шансів на успіх при виконанні стрибків, нам слід розглянути можливість розробки технологій, які допоможуть підвищити їхню живучість, будь то десантна бронетехніка чи замасковані ящики зі спорядженням."
