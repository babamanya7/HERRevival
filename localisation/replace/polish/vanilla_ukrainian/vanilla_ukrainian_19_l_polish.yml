 SOV_peace_deal_for_hokkaido_desc:0 "Ми запропонуємо [JAP.GetAdjective]ому уряду припинити всі бойові дії, якщо вони погодяться повернути наші колишні території — [537.GetName] і [555.GetName], а також передачу області [536.GetName] під [ROOT.GetAdjective]ий контроль."
 SOV_permanent_revolution_dec_cat:0 "Вічна революція"
 SOV_preparations_for_operation_countenance_mission_tt:0 "Коли завдання §Y$SOV_operation_countenance$§! буде активне, [GetOperationCountenanceTooltip] війська матимуть §Y[?SOV.SOV_operation_countenance_mission_days] дн.§!, щоби змусити державу [PER.GetNameDef] капітулювати перш ніж вона постарається приєднатися до іншого альянсу та їхнє населення почне хвилюватися щодо наших військових можливостей."
 SOV_proclaim_soviet_hegemony:0 "Проголосити радянську гегемонію"
 SOV_propaganda_campaign_locked_slot_tt:0 "Ця комірка для плакату пропаганди наразі заблокована. Її можна відімкнути, виконавши ось ці фокуси: §Y[GetCollectivistAndPossitiveFocuses] [GetKomsomolFocus]§!"
 SOV_purged_junior_army_officers_3_tt:0 "§YУся наземна техніка§!: Бонус до надійності: §R-30%§!\n§Y$politically_connected$§! стане єдиною рисою, доступною для нових генералів."
 SOV_reconvene_the_zemsky_sobor_tt:0 "§Y$SOV_aleksandr_kazembek$§! і §Y$SOV_anastasy_vonsyatsky$§! повернуться з вигнання."
 SOV_recruit_general_opposition_desc:0 "Ми повинні використовувати наші зв'язки в Червоній армії, щоб спробувати переконати високопоставлених офіцерів перейти на наш бік у разі громадянської війни."
 SOV_request_imperial_protection:0 "Попросити імперський захист"
 SOV_restoration_and_development_desc:0 "Тепер, коли війна закінчилася, ми можемо повернутися до мирного розвитку наших галузей та покращення життя наших людей."
 SOV_scout_plane_equipment_1_short:0 "Р-10"
 SOV_seek_balkan_cooperation_desc:0 "Країни Балканського півострова та Малої Азії можуть стати потужними союзниками, якщо ми зможемо наблизити їхні ідеологічні погляди до наших."
 SOV_send_infantry_equipment_asia_desc:0 "Ми мусимо надіслати військове оснащення нашим китайським союзникам, щоби ті могли перемогти як імперіалістичних держав, що їх оточують, так і амбіційних китайських воєначальників."
 SOV_sergey_rudenko:0 "Сергій Руденко"
 SOV_sinkiang_military_aid_mission_dummy:0 "[SOV.GetAdjective]а військова допомога"
 SOV_sinkiang_mineral_prospection:0 "Розвідка корисних копалин у Південному Сіньцзяні"
 SOV_sinkiang_support_expansion_sik:0 "Підтримати експансію держави [SIK.GetNameDef]"
 SOV_soviet_artillery_desc:0 "Сучасні війни виграються завдяки науковому застосуванню вогневої сили в потрібних точках. Ми зосередимо наші зусилля на розробці не лише кращої зброї, але й на тому, як застосовувати її максимально ефективно."
 SOV_stolen_vital_nuclear_information_desc:0 "$NSB_soviet_atomic_bomb_project.1.desc$"
 SOV_strengthen_the_mobilization_plan:0 "Посилити план мобілізації"
 SOV_support_in_china_generic:0 "[SOU.GetAdjective]а підтримка в Китаї"
 SOV_swap_to_political_advisors_desc:0 "Наша війна — це не просто змагання між країнами за ресурси; це змагання політичних систем. Хоча ми не мусимо дозволяти політичним міркуванням диктувати військові рішення, ми все ж мусимо запевнитися, щоби ці політичні міркування були враховані при прийнятті рішення."
 SOV_tac_bomber_equipment_0:0 "ДБ-3"
 SOV_the_bloc_of_rights_and_trotskyites:0 "Блок правих і троцькістів"
 SOV_the_comintern_desc:0 "Боротьба за визволення трудящих не обмежується якоюсь однією країною; це всесвітня боротьба. Ми мусимо надавати допомогу товаришам у будь-якій країні світу і боротися з силами реакції і контрреволюції, де б вони не знаходилися."
 SOV_the_construction_of_communism:0 "Будівництво комунізму"
 SOV_the_head_of_the_nkvd_yezhov:0 "Голова НКВС — Єжов"
 SOV_the_head_of_the_nkvd_yezhov_tt:0 "§Y$SOV_nikolay_yezhov$§! стане прихильником правої опозиції."
 SOV_the_need_for_policy_changes_tt:0 "§Y$SOV_grigory_sokolnikov$§! стане доступний як радник."
 SOV_the_permanent_revolution_decisions_tt:0 "Відмикає рішення §YОрганізувати п'яту колону§! для розпалювання революційних повстань у ворожих європейських сусідів."
 SOV_the_red_fleet_submarine_2_dynamic_modifier:0 "$SOV_the_red_fleet_dynamic_modifier$"
 SOV_the_rush_for_berlin_desc:0 "Очевидно, що наші нинішні союзники в боротьбі з [GER.GetAdjective]ими силами стануть нашими найбільшими суперниками після війни. Ми не можемо дозволити їм перемогти нас у перегонах за Берлін."
 SOV_they_will_know_fear:0 "Вони пізнають страх"
 SOV_third_five_year_plan_military_dynamic_modifier:0 "$SOV_second_five_year_plan_dynamic_modifier$"
 SOV_transformation_of_nature_desc:0 "Коли наша наукова спільнота розширює межі того, що раніше вважалося можливим, навіть найбільші, найбільш інвазивні проєкти стають здійсненними."
 SOV_tupolev_design_bureau_organization:0 "$tupolev_design_bureau$"
 SOV_unification_of_the_exiles:0 "Об'єднання вигнанців"
 SOV_urals_crackdown_timer:0 "Репресії на Уралі"
 SOV_wreckers_sabotage_dockyards_desc:0 "Пошкодивши морське виробництво лідера [SOS.GetLeader], [SOS.GetAdjective]і сили буде перенаправлено в інше місце."
 SOV_xian_incident_desc:0 "Завдяки нашим контактам з видатними ґоміньданівськими чиновниками ми зможемо викрасти Чана Кайші і змусити його поділитися владою з Мао, фактично поклавши край їхній руйнівній сварці, щоб Китай зміг краще протистояти хижацтву Японії."
 SPA_commerce_protection_desc:0 "Глобальна торгівля, як ніколи, є ключем до здорової економіки. Здатність захистити наше власне торгове судноплавство зміцнить нашу позицію в будь-якому майбутньому конфлікті, з яким ми можемо зіткнутися."
 SPA_confirm_the_fueros:0 "Підтвердити фуерос"
 SPA_defenders_of_catholicism:0 "Захисники католицизму"
 SPA_emilio_esteban_infantes:0 "Еміліо Естебан-Інфантес Мартін"
 SPA_equipment_modernization:0 "Модернізація оснащення"
