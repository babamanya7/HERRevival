 buddhist_socialism_desc:0 "Буддійський соціалізм, також відомий як дхаммічний або природний соціалізм, — це політична ідеологія, яка пропагує соціалізм, заснований на принципах буддизму. Як буддизм, так і соціалізм прагнуть покласти край стражданням, аналізуючи їх умови та усуваючи їх основні причини за допомогою практики. Обидва також прагнуть забезпечити трансформацію особистої свідомості, щоб покласти край людському відчуженню та егоїзму."
