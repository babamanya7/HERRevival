 SOV_aleksandr_golovanov:0 "Олександр Ґолованов"
 SOV_align_the_zinovyevites_tt:0 "§Y$SOV_grigory_zinovyev$§! і §Y$SOV_lev_kamenev$§! будуть звільнені з в'язниці та відправлені у вигнання (§Gперсонажі у вигнанні не можуть бути піддані чистці§!). Вони стануть доступні як радники, коли почнеться громадянська війна.\nВідкиває доступ до §Yрішень§!, за якими партизани повстануть у ключових регіонах із початком громадянської війни.\n"
 SOV_an_empire_in_the_pacific_desc:0 "Оскільки наша імперія починає простягатися через Тихий океан, наш корабельний дизайн також повинен слідувати цьому прикладу, щоб мати можливість здійснювати нашу владу і вплив на цих величезних просторах океану."
 SOV_an_oceangoing_navy:0 "$SOV_ocean_going_navy$"
