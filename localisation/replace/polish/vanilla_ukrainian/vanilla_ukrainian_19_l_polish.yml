 MAN_tsr_reclaim_our_lost_possessions_desc:0 "Втрата Зовнішньої Маньчжурії за Айгунським і Пекінським договорами, а також радянське захоплення Монґолії все ще є болючим місцем на тілі нашої держави. Ми повинні виправити цю історичну помилку і покласти край радянській імперії раз і назавжди!"
 MAN_tsr_trading_illicit_goods_desc:0 "Хоча торгівля забороненими товарами не є основним джерелом доходу нашої країни, вона приносить значні прибутки. Було б нерозумно припиняти її, але якщо залишити її без контролю, це може мати жахливі наслідки як для маньчжурського, так і для китайського суспільства."
