 china.6.d:0 "Після довгого відступу Червоної армії Комуністичної партії Китаю, вони змогли перегрупуватись і закріпитись у області Шеньсі. Їхні повторні спроби обернути сільське населення проти нас і пошук підтримки від Радянського Союзу вказують, що вони можуть стати значно сильнішими, якщо їх не чіпати. Однак, більшість навколишніх воєначальників хоч і підтримують нас, та не хочуть або не можуть надати достатню підтримку для ефективного наступу.\n\nНаразі неясно, чи Червона армія ще відновлюється, або готова до боротьби, але час зараз не нашому боці. Щоб посилити нашу політичну позицію, потрібно вдарити по комуністах."
