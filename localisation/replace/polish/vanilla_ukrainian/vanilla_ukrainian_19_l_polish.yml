 FIN_found_pohjolan_voima:0 "Заснувати Pohjolan Voima"
 FIN_industrial_cooperation_desc:0 "Члени держав Осі мають у своєму розпорядженні величезні знання та ресурси. Настав час для промислового співробітництва, щоб краще використовувати ці невикористані активи для покращення наших країн."
 FIN_infiltrate_soviet_commandos_desc:0 "Радянські командос є одними з найкращих солдатів, які існують, і можуть бути корисними для нашої революції."
