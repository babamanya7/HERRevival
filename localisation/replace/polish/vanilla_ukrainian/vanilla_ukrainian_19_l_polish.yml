 NOR_obsolete_armed_forces_ns_1:0 "Застарілі збройні сили"
 NOR_offensive_doctrines:0 "Наступальні доктрини"
 NOR_officers_academy_desc:0 "Хороший офіцер збільшує ефективність наших бойових сил, і з огляду на невелике населення це буде життєво важливо, особливо якщо ми маємо надію вижити під іноземним нападом."
 NOR_prep_resistance_dmod:0 "Planted Resistance"
 NOR_prepare_for_war:0 "Готуватися до війни"
 NOR_reduced_workers_rights_ns_desc:0 "Виправдовуючись неминучою війною та приреченістю, ми принесли в жертву обмеження прав наших працівників на певний час. Сподіваємося, вони нас зрозуміють, коли війна закінчиться."
 NOR_reichskommissariat_ADJ:0 "Норвезьк"
 NOR_replace_laake_desc:0 "Крістіан Локе був інструментом Ліберальної партії з моменту свого призначення. Він проштовхнув численні скорочення можливостей армії та, здається, не має навичок або волі вести Норвеґію до перемоги. Нам потрібен хтось, хто готовий поставити армію на передовий край життя в [NOR.GetName]."
 NOR_repurpose_lighthouses:0 "Змінити призначення маяків"
 NOR_rubin_design_bureau_nord_organization:0 "$SOV_rubin_design_bureau_organization$–Норд"
 NOR_rule_the_northern_sea_desc:0 "Нехай наше королівство розшириться до Північного моря! Наші кораблі будуть рукою, що простягне наше королівство до горизонту. Щоб це сталося, нам потрібні військово-морські бази, необхідні для підтримки такого домінування, а також практики та методи, які дозволять нам йти далі."
 NOR_ship_light_battery_1:0 "76 mm/40 Armstrong EOC"
 NOR_social_incrementalism:0 "Соціальний інкременталізм"
 NOR_super_heavy_tank_equipment_1:0 "Tung Stormvogn m/44 «Isbjorn»"
 NOR_unlocking_prep_deploy_dem_his_TT:0 "Відмикає рішення, які дозволяють використовувати §YРозвиток територій§! для захисту Норвеґії.\n §RКоли у стані війни§!:\n §YЗахищати територію§! рішення, які обмінюють Розвиток на бонуси до захисту та опору в цій території.\n Рішення §YНадзвичайне виробництво на території§!, які зміщують розвиток у бік військового виробництва, та\n рішення §YРозгорнути збройні формування на території§!, які використовують розвиток для вербування збройних формувань у цій території."
