 JAP_modify_early_industrialization_modifier_tt:0 "Змінює §Y$JAP_early_industrialization_efforts_dm$§!:"
 JAP_national_defense_state_desc:0 "Кожен громадянин повинен усвідомлювати важливість перетворення нашої нації на фортецю, здатну стримати будь-який тиск."
 JAP_nobuhito_is_the_current_regent_or_emperor_flag:0 "§YНобухіто§! зійшов на престол"
 JAP_occupy_indochina:0 "Окупація Індокитаю"
 JAP_prepare_for_the_final_war_desc:0 "Технології визначають історію війни, а історія війни визначає історію. Незабаром настане остання війна, яка вирішиться у повітрі. Оскільки в майбутньому літаки зможуть літати на великі відстані, щоб завдавати ударів безпосередньо по столицях інших держав. Щоб уникнути цього, ми повинні запровадити нову командну економіку, створивши однопартійну державу національної оборони."
 JAP_radio_guided_missiles_desc:0 "Управління озброєння Імператорської армії Японії досягло значних успіхів у розробці керованої зброї. Вони близькі до прориву щодо вільнопадаючої гіростабілізованої ракети з інфрачервоним наведенням, призначеної для скидання з літаків на морські цілі. Ця нова зброя отримала назву Ке-Ґо."
 JAP_raid_category_fluff_text_land_infiltration_raids:0 "§LҐірецу Кутейтай§!"
 JAP_red_brigades_desc:0 "Усі чоловіки і всі жінки повинні зробити свій внесок у захист батьківщини. Ми гарантуємо їм таку можливість."
 JAP_sasebo_naval_arsenall_organization:0 "$sasebo_naval_arsenall$"
 JAP_sea_fate_of_the_imperial_family:0 "Доля імператорської сім'ї"
 JAP_sea_nationalize_the_zaibatsus:0 "Націоналізувати Дзайбацу"
