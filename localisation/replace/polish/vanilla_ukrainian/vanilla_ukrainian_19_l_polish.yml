 MILITARY_INDUSTRIAL_ORG_HINT_SCREEN_TEXT:0 "Коли ви виробляєте, досліджуєте або проєктуєте обладнання, ви можете призначити $INDUSTRIAL_ORG_TOOLTIP_HEADER$. Ці організації забезпечують вдосконалення обладнання, яке вони досліджують або проєктують. На виробничих лініях вони допомагають зі швидкістю, ефективністю та потребами в ресурсах.\n\nЗа кожне завдання, яке виконує $INDUSTRIAL_ORG_TOOLTIP_HEADER$, він отримує кошти, які можна використати для відімкнення властивостей. Ці навички покращують обладнання або виробничі бонуси $INDUSTRIAL_ORG_TOOLTIP_HEADER$.\n\nКожне дослідження, на яке призначено $INDUSTRIAL_ORG_TOOLTIP_HEADER$, коштуватиме щоденний £pol_power §Yприріст політичної влади§!."
