 CHI_a_generalissimo_for_all_of_china_desc:0 "Наша боротьба проти іноземного загарбника була хворобою шкіри, але наша внутрішня загроза завжди була хворобою серця. Хвороба, з якою ми тепер впоралися, щоб мати змогу мріяти про майбутнє."
