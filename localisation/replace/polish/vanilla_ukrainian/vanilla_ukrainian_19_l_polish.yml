 mtg_britain.43.t:0 "Доля королівської сім'ї"
 mtg_britain.47.d:0 "Держава [From.GetNameDefCap] провела деколонізацію за нашою вимогою."
 mtg_britain.70.d:0 "[From.GetNameDefCap] відмовляється виконувати наші вимоги і повідомляє, що ми не маємо влади над [CAN.GetAdjective]ими робітниками."
 mtg_britain.74.b:0 "Ми ніколи не визнаємо їх незалежність!"
 mtg_britain.77.t:0 "[BAN.GetName]: громадянська війна заходить у глухий кут"
 mtg_britain.9.d:0 "Побоюючись, що публічна заява короля по радіо дасть йому надто велику підтримку серед народу, прем'єр-міністр [ROOT.GetLeader] відмовився дозволити це зробити. Не маючи можливості піти проти свого прем'єр-міністра в цьому питанні, король не мав іншого вибору, окрім як поки що тримати «свою версію історії» при собі."
 mtg_britain.94.d:0 "[From.GetAdjective] уряд повідомив, що відхиляє наше прохання щодо збільшення інвестицій у їхню внутрішню промисловість. Вони стверджують, що у довгостроковій перспективі більш корисним виявиться природне зростання."
 mtg_britain.96.d:0 "[From.GetAdjective] лідери визнають, що політика умиротворення не позбавлена своїх недоліків, і бажають обговорити це питання. Вони відкриті до змін у дипломатичній сфері, але якщо знайдуть підтримку в імперії."
 mtg_netherlands.21.t:0 "[From.GetNameDefCap] прагне до інтеграції колоній"
 mtg_netherlands.28.d:0 "Представники держави [From.GetNameDefCap] повідомили, що Вест-Індія їх не цікавить і що вони не бажають давати жодних обіцянок щодо захисту наших колоній."
 mtg_netherlands.3.a:0 "Ми цього так не залишимо!"
 mtg_netherlands.30.a:0 "Їх допомога не буде забута."
 mtg_netherlands.43.a:0 "Вони хочуть, щоби ми залишалися слабкими?"
 mtg_netherlands.71.d:0 "Королева держави [HOL.GetNameDef] Вільгельміна оголосила про готовність до відновлення на троні Німеччини кайзера Вільгельма II після закінчення війни. Ця заява викликала у наших солдатів невиправданий оптимізм і необґрунтоване почуття лояльності, частина бійців [HOL.GetNameDef], щоби боротися за королеву.\n\nЯкщо ми не доведемо війну до рішучого кінця, викорінити цей рух буде складно."
 mtg_netherlands.72.d:0 "Минулої ночі кайзер Вільгельм II, який залишався під нашою опікою до кінця життя, мирно помер уві сні. Його син Фрідріх Вільгельм став тепер головою будинку фон Гогенцоллернів і вибрав собі тронне ім'я Вільгельм III."
 mtg_netherlands.74.d:0 "З кінцем війни [HOL_kaiserreich_germany.GetLeader] вважає доречним нагадати нам про нашу домовленість і пропонує укласти на рівних умовах союз між двома нашими націями перед лицем неминучого протистояння Заходу і нової монархічної Європи."
 mtg_netherlands.75.a:0 "Яка ганьба. Розберемося з нею пізніше."
 mtg_news.16.b:0 "Британці кинули виклик."
 mtg_news.2.d:0 "Американська республіка бореться за своє життя!"
 mtg_news.34.b:0 "Ось вона — неприкрита тиранія соціалізму."
 mtg_news.38.a:0 "Істинні соціалісти — ми!"
 mtg_news.39.t:0 "[From.GetName] протистоїть фашизму"
 mtg_news.40.desc:0 "Заяви [From.GetAdjective] уряду стають все більш ворожими та антикапіталістичними. Поряд із прийняттям різних антиамериканських актів це дозволяє припустити, що там готуються до військового протистояння зі своїми ідеологічними противниками з Нового Світу в не надто віддалений."
 mtg_news.42.b:0 "Вони значно послабили самі себе..."
