 SPR_enlarge_the_weapon_caches:0 "Збільшити схованки зброї"
 SPR_ensure_loyalty_desc:0 "Військові найжорстокіше зрадили уряд. Першим кроком до загоєння цієї рани є забезпечення лояльності всіх офіцерів, яких ми відтепер призначаємо."
 SPR_fighter_equipment_1:0 "Hispano Aviación HA-1000"
