 INTERNATIONAL_MARKET_ADD_TO_MARKET_REQUIRE_CONVOYS_TT:0 "Укладення контракту з цією країною потребуватиме £convoy_texticon£ §Yконвої§!."
 INTERNATIONAL_MARKET_BUYER_TAB:0 "Покупець"
 INTERNATIONAL_MARKET_DRAFT_CONVOYS_TITLE:0 "Конвої"
 INTERNATIONAL_MARKET_FILTER_COUNTRY_BUTTON:0 "Фільтрувати за державою-продавцем"
 INTERNATIONAL_MARKET_SUBSIDIES_ENTRY_EQUIPMENT_TT:0 " Тип оснащення: $NAME|Y$"
 INTERNATIONAL_MARKET_SUBSIDIES_OVERVIEW_TOGGLE_USAGE_TT:0 "Ви можете зменшити §Yекономічний потенціал§!, який мусите створити, та кількість доставок у контракті, застосувавши §Yринкові субсидії§!. §YРинкові субсидії§! можна застосовувати тільки до контрактів, де вони застосовуються до всього оснащення в контракті."
 INU_fascism:0 "Держава Нео-Туле"
 IRQ_agrarian_society_modifier_level_down_tt:0 "§GЗнижує§! ефекти $IRQ_agrarian_society$"
 IRQ_allied_training:0 "Навчання Союзників"
 IRQ_baghdad_colleges_of_engineering_and_education_desc:0 "Багдад був центром навчання протягом століть, але в останні десятиліття ним нехтували на користь західних університетів. Настав час нам інвестувати в наші освітні установи, щоб відновити наше місто як серце академії."
 IRQ_forceful_industrialization_desc:0 "Темпи індустріалізації в [ROOT.GetNameDef] надто повільні, якщо ми хочемо уникнути відставання від наших супротивників. Ми повинні організувати масштабну програму індустріалізації, навіть якщо це розлютить громадськість."
 IRQ_independent_flight_schools_desc:0 "Наші пілоти здебільшого навчалися за кордоном у [ENG.GetAdjective], однак тепер у нас є критична маса пілотів, коли ми можемо почати навчати наших пілотів самостійно."
 IRQ_invite_foreign_arms_corporations_desc:0 "Потреба у внутрішній збройовій промисловості є критичною, однак нам бракує досвіду для розробки та виробництва власного обладнання. Тому ми повинні співпрацювати з іноземними корпораціями для створення фабрик, які є взаємовигідними для нас та для них."
 IRQ_iran_ultimatum:0 "Press Claims on Arabistan"
 IRQ_kurdish_revolt_desc:0 "Настав момент оголосити про нашу незалежність від [IRQ.GetNonIdeologyName] та створити справді вільну націю для курдського народу."
 IRQ_kurdistan_events.2.desc:0 "Наші контакти в [FROM.GetNameDefCap] відповіли на наше прохання про допомогу та погодилися підтримати нашу справу."
 IRQ_mechanized_equipment_3_short:0 "Churchill Kangaroo"
 IRQ_modernization_desc:0 "Парад вулицями із застарілим обладнанням може бути достатнім, щоб утримати наш власний народ під контролем, але він мало що зробить для стримування агресії іноземної держави. Ми повинні модернізувати наше обладнання та утвердити наші збройні сили як серйозний засіб стримування."
 IRQ_nationalist:0 "Сірий кардинал"
 IRQ_pan_arab_crackdown_desc:0 "$IRQ_curtail_arabism_desc$"
 IRQ_political_events.27.a:0 "Ми сильніші разом."
 IRQ_political_events.31.desc:0 "Уряд [FROM.GetNameDef] вимагає нашого негайного виведення з [PAL.GetName] після нещодавніх спалахів насильства на території. Вони стверджують, що краще підходять для управління мандатною територією і що наші дії шкодять їхнім побратимам-арабам. Хоча виведення було б вигідним для наших військових, шкода зовнішній політиці може бути значною."
 IRQ_political_events.33.desc:0 "Розуміючи, що ситуація є нежиттєздатною для їхніх сил, [ENG.GetAdjective] уряд погодився вийти з [454.GetName] та передав нам владу над регіоном."
 IRQ_political_events.71.b:0 "$IRQ_sharaf_bin_rajeh$ підійде"
 IRQ_political_events.75.desc:0 "Наші [FROM.GetAdjective] друзі погодилися надіслати делегацію з огляду на майбутні інвестиції, за умови, що ми негайно підпишемо угоду про початковий обмін. Це добре обернулося."
 IRQ_regional_military_integration_tt:0 "Завершення цього фокусу, коли Йорданія є нашим суб'єктом або ми контролюємо Йорданію, додасть дві додаткові військові фабрики в Йорданії."
 IRQ_restoration_of_hejaz:0 "Відновлення Хіджазу"
 IRQ_revoke_anglo_iraq_treaty_tt:0 "§R[ENG.GetNameDefCap], ймовірно, оголосить нам війну за скасування договору!§!"
 IRQ_tanks_organization:0 "Тікрітський бронетанковий завод"
 IRQ_unite_mashriq_desc:0 "Машрік — це б'юче серце ісламського світу. Ми не можемо заспокоїтися, доки він весь не буде під контролем Халіфа."
 ISR_democratic_DEF:0 "Ізраїль"
