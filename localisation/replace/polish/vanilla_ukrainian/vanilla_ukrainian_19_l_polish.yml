 GUAY_clamp_down_on_new_territories_desc:0 "Ми не можемо допустити анархії на наших нових територіях. Нам потрібно придушити опір та покарати ворогів держави."
 GUAY_cult_of_personality:0 "Культ особистості"
 GUAY_empower_the_land_owners_desc:0 "Землевласники є єдиною наймогутнішою клікою в країні. Ми розширимо їхні права, надавши їм більше землі, і, у свою чергу, отримаємо їхню підтримку."
 GUAY_export_focus:0 "Фокус на експорті"
