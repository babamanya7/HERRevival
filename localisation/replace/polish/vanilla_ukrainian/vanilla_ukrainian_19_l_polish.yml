 ETH_invest_tt:0 "Відкриває доступ до §Yрішень§! по інвестиціях в області."
 ETH_invite_foreign_industrialists_desc:0 "За останні роки ми значно поліпшили нашу інфраструктуру та промисловість, зробивши використання природних ресурсів набагато ефективнішим. Проте ми могли б прискорити розвиток нашої галузі, запросивши іноземних експертів і промисловців працювати в [ETH.GetName]."
 ETH_mesfin_sileshi:0 "Mesfin Sileshi"
 ETH_military_communism_desc:0 "Ті невеликі успіхи, яких ми маємо на передовій, є результатом винахідливості та хоробрості простих солдатів, а не їхнього спадкового лідерства. Голос невдоволення стає все голоснішим. Імперіалізм пішов своїм чередом. Зараз час силового перерозподілу багатства."
 ETH_mytishchi-ababa_plant:0 "Митищинсько-Абебський завод"
 ETH_organization_of_african_unity_tt:0 "Відмикає рішення щодо запрошення незалежних африканських країн до §YОрганізації африканської єдності§!."
 ETH_our_enemys_enemy:0 "Ворог нашого ворога"
 ETH_peoples_army_focus_desc:0 "Незважаючи на нашу початкову слабкість у веденні сучасної війни, нам вдалося уповільнити [ITA.GetAdjective]е вторгнення за допомогою використання нетрадиційної тактики. Ми можемо закріпити це у нашій військовій доктрині та навчити наших офіцерів тому, як вести асиметричну війну."
 ETH_recruit_aircrews_from_host_desc:0 "Напевно знайдуться [?ETH.host_nation.GetAdjective]і пілоти та сервісні фахівці, які захочуть працювати на службі держави [ROOT.GetName], якщо платня буде досить гарною."
 ETH_reform_the_currency_desc:0 "Незважаючи на те, що обіг [ETH.GetAdjective]их банкнот зріс за останні роки, багато хто все ще вважає за краще використовувати валюти інших країн під час торгівлі [ETH.GetName]. Нам потрібно реформувати бирр, щоб він став більш прийнятним як усередині країни, так і за кордоном."
 ETH_secure_arms_tt:0 "Відкриває §Yрішення§!, щоби придбати військову техніку за кошти імперської скарбниці"
 ETH_soviet-ethiopian_trade_agreement_desc:0 "Багато хто в усьому світі не бажають торгувати з нами через ідеологічну опозицію до нашої робочої республіки. Однак у нас є можливість укласти взаємовигідну торговельну угоду з [SOV.GetAdjective], що дозволить нам обмінюватися ресурсами та товарами без звичайних торгових бар'єрів."
 ETH_tactical_training_tt:0 "Змінити §Y[GetEthiopianArmySpiritName]§! на:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§! "
 ETH_the_defense_of_addis_ababa_tt_1:0 "§Y$VICTORY_POINTS_5010$§!:\n"
 ETH_the_junior_officer_corps_desc:0 "Століттями в збройних силах домінували аристократи. Якщо ми хочемо зробити їх більш ефективними на полі бою, нам потрібно створити офіцерські школи та навчальні програми, які сприятимуть меритократії замість кумівства. Східцем до цього було б створення молодшого офіцерського складу."
 ETH_the_king_of_kings_desc:0 "Його Величність, [ETH.GetLeader], позбавив нас від принизливої долі стати слугами [ITA.GetAdjective]ої держави. Він є лідером, якому немає рівних у сучасному світі, і його слід шанувати як такого."
