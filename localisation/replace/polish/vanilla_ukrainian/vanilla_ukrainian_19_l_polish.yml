 ITA_libyan_infrastructure_desc:0 "Наші величезні землі в Північній Африці все ще відстають від решти нашої Імперії з точки зору інфраструктури. Ми мусимо зосередити наші зусилля на тому, щоби привести їх у відповідність."
 ITA_libyan_refineries:0 "Лівійські НПЗ"
 ITA_meritocracy_desc:0 "Приборкавши опозицію в наших лавах, ми тепер можемо відкрити кілька установ для членів поза лавами Фашистської партії. Це мусить призвести до появи нових і цікавих ідей, а також нових можливостей."
