 navy_casualty_on_hit_tt:0 " $MODIFIER_NAVAL_CASUALTY_ON_HIT_FACTOR$: $RIGHT|-=%1$"
 neo_mesopotamia_formed_flag:0 "Месопотамію вже відновлено"
 neutrality_focus_desc:0 "Хоч інші заявляють, що щоби стати на чийсь бік у глобальному конфлікті, потрібні мужність і мудрість, ми то знаємо, що щоби відмовитися, потрібно ще більше."
