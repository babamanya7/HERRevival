 JAP_establish_the_mine_warfare_force_desc:0 "До нашої уваги дійшло, що західні країни використовують морські міни як засіб контролю морів. Ми повинні перейняти ці ідеї, але не без створення сил, які також відповідатимуть за відстеження мін та тралення вод за потреби."
