 JAP_army_faction_tier_4_greater_3:0 "$JAP_imperial_influence_tier_4$ $JAP_army_faction$"
 JAP_ashigaru_category_desc:0 "Система ашіґару була частиною військового укладу нашого народу протягом століть і дозволяє нам залучати чоловіків з різних сіл по всій нашій державі, щоб вони брали зброю до рук і захищали свої домівки."
 JAP_battleship_3:0 "Клас «Tajima»"
 JAP_blocked_from_favoring_the_government_flag:0 " §Y$JAP_government_faction$§! §Rповністю втратила довіру§! з боку $JAP_imperial_influence_ruler_title$"
 JAP_combined_arms_desc:0 "Координація між нашими повітряними та наземними силами є ключем до успіху. Щоб забезпечити кращу підтримку та очистити поле бою від будь-яких перешкод, з якими може зіткнутися наша армія, ми повинні інвестувати в тактику взаємодії родів військ, яка дозволить нашим літакам працювати в тандемі з іншими видами військ."
 JAP_communist_infiltration_of_state_decision_decision:0 "Створити підпільний комуністичний осередок у §Y[FROM.GetName]§!"
