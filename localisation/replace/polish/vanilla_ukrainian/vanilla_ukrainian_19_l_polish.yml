 FRA_anti_air_equipment_3:0 "Canon de 75 CA modèle 1940"
 FRA_appeal_to_overseas_territories_desc:0 "Хоча столичні райони Франції, можливо, впали перед ворогом, більша частина її імперії все ще залишається вільною. Якщо ми зможемо зібрати їх на допомогу, ми зможемо повернути бій ворогу."
 FRA_army_reform_desc:0 "Виграти війну не зможе ні окрема піхотна частина, ні найсучасніший танк. Ми мусимо всебічно розвивати стратегію та тактику бою. Розставивши правильних людей на ключових позиціях, ми значно зміцнимо армію."
