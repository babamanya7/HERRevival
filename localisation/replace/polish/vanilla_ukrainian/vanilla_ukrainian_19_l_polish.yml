 MAN_pacify_the_countryside_desc:0 "Як тільки ми прийшли до влади, численні бандити та повстанці намагалися встановити контроль над віддаленими регіонами країни. Щоб показати серйозність своїх намірів, ми мусимо позбутися терористів і продемонструвати народу, що ми здатні підтримувати законність."
