 MUN_czech.1018.d.FRA:0 "Наші дипломати повернулися з [FRA.GetNameDef] із чудовою новиною про те, що вони готові взяти участь у спільному вторгненні до [GER.GetNameDef]. Тепер ми маємо оцінити, чи буде достатньо наших об'єднаних сил."
 MUN_czech.1018.d.POL:0 "Наші дипломати повернулися з [POL.GetNameDef] із чудовою новиною про те, що вони готові взяти участь у спільному вторгненні до [GER.GetNameDef]. Тепер ми маємо оцінити, чи буде достатньо наших об'єднаних сил."
 MUN_czech.1026.guarantee:0 "Наші дипломати повідомляють, що попри їхні зусилля, [FROM.GetNameDef] не погодилася з нашою пропозицією щодо договору про взаємну оборону. Здається, вони вважають, що ми наражаємось на більшу небезпеку, ніж вони. Будемо сподіватись, що вони помиляються."
 MUN_czech.1050.a:0 "Тоді, можливо, нам варто запропонувати вигідніші умови"
 MUN_czech.1056.d:0 "Подібно до того, як це колись пропонувалося на Паризькій мирній конференції після Великої війни, [CZE.GetNameDef] оголосила, що вважає коридор до свого союзника, [YUG.GetNameDef], необхідним для безпеки їхнього альянсу. Для досягнення цієї мети [FROM.GetAdjective]і представники висунули ультиматум з вимогою передати їм [975.GetName]."
 MUN_czech.news.2.b:0 "Це буде легко."
