 SOV_GREAT_RED_MENACE_EVENT_DESC_2_COMMUNIST:0 "загрозою комунізму"
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_COMMUNIST:0 "Відтоді, як були зроблені перші кроки зі статтею Nº 124, становище Церкви в нашому Союзі пройшло довгий шлях. Зрозуміло, що вона не може бути вилучена з радянського суспільства — тож, можливо, нам слід прийняти її і знову надати їй центральне місце в житті радянського робітника."
