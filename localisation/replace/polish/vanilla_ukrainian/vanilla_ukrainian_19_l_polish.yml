 NOR_aluminum_production_desc:0 "Виробництво алюмінію є надзвичайно енергоємним процесом, і хоча нам бракує покладів бокситів, [ROOT.GetAdjective]ий рельєф ідеально підходить для виробництва гідроелектростанцій, тому ми можемо легко імпортувати боксит і перетворити його на цінний ресурс для нашого військова промисловість, що зароджується."
 NOR_ask_for_foreign_support_desc:0 "Оскільки наше королівство ніколи не мало великої бази підтримки фашистів, нам потрібна підтримка наших братів-фашистів за кордоном. З їх допомогою ми можемо показати [NOR.GetName] шлях до панґерманської фашистської імперії."
 NOR_autonomy_aat_defense_council_member:0 "Норвезький атлантичний вал"
 NOR_clueless_defense_minister:0 "Недолугий міністр оборони"
 NOR_communist_education_centers_ns_1_desc:0 "Ці центри були засновані нашими товаришами з-за кордону. Саме ці центри — головні в підготовці [NOR.GetAdjective]ого народу до нової Норвеґії майбутнього."
 NOR_communist_prep_level_2_TT:0 "$NOR_communist_prep_intro$\n $NOR_communist_prep_join_comm_side$\n $NOR_communist_prep_2_irregulars$\n $NOR_communist_prep_join_moderate_damage$"
 NOR_convoy_bombing:0 "Бомбардування конвоїв"
 NOR_crush_hitler_ns_desc:0 "Небагато режимів є настільки жорстокими та нелюдськими, як гітлерівський. Ми не можемо дозволити цьому маніяку розгулювати на наших очах. Розберімося з ним та його нацистською [GER.GetAdjective]ою державою швидко та рішуче."
 NOR_denounce_the_german_reich:0 "Засудити [GetNorwegianThreateningFascist]"
 NOR_efficient_production_ns_desc:0 "Не можна ігнорувати жодне покращення в напрямку ефективності. Ми повинні переконатися, що можемо зробити максимум з тим, що маємо, або ризикуємо бути непродуктивними."
 NOR_exiled_monarchy_to_desc_DEN:0 "Повернувшись до свого данського імені, принц Карл буде прийнятий у державі [DEN.GetName] своїм братом, королем Фредеріком, де він буде виконувати свою роль, яку королі відіграють в данському суспільстві."
 NOR_exiled_monarchy_to_desc_ENG:0 "Оскільки повернення на батьківщину, в Данію, було неможливим, колишній король Гокон і його сім'я тепер змушені прийняти своє вигнання в державі [ENG.GetName] — землі, де колись відбулося весілля принца Карла Данського і Мод Уельської, колишньої королівської пари."
 NOR_exiled_monarchy_to_desc_SWE:0 "Не маючи можливості повернутися на батьківщину ні короля Гокона, ні королеви Мод, колишня королівська родина була змушена шукати притулку в сусідній монархії, що співчуває їм. Іронія долі норвезької корони, залежної від шведської королівської сім'ї так скоро після здобуття незалежності, не втрачає своєї актуальності для всього світу."
 NOR_fde_intelligence_agency_desc:0 "Наші солдати та офіцери не можуть йти сліпо на передову. Вони повинні знати, з чим вони зіткнуться, і вміти використовувати обман у своїх планах. Ось чому ми створимо розвідувальне відділення армії, щоб вони могли бруднити руки замість наших солдат."
 NOR_heavy_tank_equipment_3:0 "Stormvogn m/43"
 NOR_invite_soviet_designers:0 "Запросити радянських дизайнерів"
 NOR_messerschmitt_norge_organization:0 "$GER_messerschmitt_organization$"
