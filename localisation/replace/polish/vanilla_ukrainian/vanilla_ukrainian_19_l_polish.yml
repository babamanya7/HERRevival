 ITA_diving_bombers_desc:0 "Тема ближньої авіаційної підтримки набула значного значення у військових колах. Хоча літаки вже давно використовуються для скидання бомб, схоже, що деякі країни почали розробляти спеціалізовані літаки, які можуть доставити бомбу з неперевершеною точністю, пікіруючи з великої висоти. Хоча наша промисловість, без сумніву, зможе вчасно виготовити такий літак, є й інші країни, які мають проєкти саме для цієї мети."
