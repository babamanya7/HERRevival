 GOE_RAJ_loyalist.04.desc:0 "Ми отримали добрі новини від нашого посланця до [ENG.GetNameDef]. [ENG.GetAdjective] уряд погодився дозволити нам готувати вторгнення в [PER.GetNameDef]. З благословення Корони ми повинні згуртувати наші війська та готуватися до війни."
