 denmark_overlord_events.16.desc:0 "У відповідь на нашу відмову піддатися [FROM.GetAdjective]им вимогам про те, щоб [ROOT.GetLeader] пішов у відставку, наші гегемони вирішили нав'язати нам нові закони, щоб нас втихомирити."
 denmark_overlord_events.21.desc:0 "Нам довелося підкоритися вимогам гегемона. Тепер ми повинні сформувати новий уряд."
 denmark_overlord_events.34.t:0 "[FROM.GetNameDefCap] відмовляється постачати зброю"
 denmark_overlord_events.48.b:0 "Їхнім жалюгідним військам не змагатися з нашими!"
 denmark_overlord_events.5.desc:0 "Наш лідер, [ROOT.GetLeader], надсилає королю держави [FROM.GetNameDef] щиру телеграму з привітаннями до дня народження, але у відповідь отримує лише холодну й образливу відписку. Що гірше, тепер данці відмовляються визнавати помилку свого короля і належним чином вибачатися. Це чудовий привід вказати нашим підданим на їхнє місце і нагадати їм, що подаровані їм під нашим заступництвом привілеї не варто сприймати як належне."
 denmark_overlord_events.7.t:0 "[FROM.GetNameDefCap] насаджує нові драконівські закони"
 denmark_political_events.11.desc:0 "У державі [ROOT.GetNameDef] коїться чорт знає що! Нарешті вони знайшли уряд, обраний народом і для народу, але комусь це не подобається. У країні з'явився рух самозваних патріотів, прихильників застарілого інституту монархії. Вони набувають популярності, але небезпеки поки що не становлять."
 denmark_political_events.6.desc:0 "$DEN_neutrality_party_long$ відчуває розбіжності щодо того, як планувати передвиборчу кампанію. Хтось не хоче загострювати і без того непросту обстановку і стримує свою риторику. Хтось вважає, що для того, щоб реалізувати своє бачення держави [DEN.GetNameDef], потрібно атакувати на повну силу. Хтось переконаний, що лише активно нападаючи на суперників, ми зможемо послабити їхні позиції і посилити свої."
