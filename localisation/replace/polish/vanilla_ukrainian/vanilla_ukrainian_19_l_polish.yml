 poland.2101.b:0 "Данциґ лишиться Данциґом!"
 poland.2101.d:0 "Німецька партія [GER.GetRulingParty] запропонувала підтримати нашу боротьбу з Польщею в обмін на більш прямий контроль над державою [Root.GetNameDef] державою [From.GetNameDef]."
 poland.8.a:0 "Зміщення на захід — це найліпше, на що ми могли сподіватися, враховуючи обставини."
 political.13.a.tt:0 "Збільшує ймовірність внутрішньої підтримки при організації виборів."
 political.8.d:0 "Кілька високопоставлених [Root.GetAdjective]их військових висловили підтримку — декотрі приватно, а декотрі відкрито — [Root.GetAdjective]ому фашистському руху. Вони вважають, що [Root.GetRulingParty] забула, наскільки важлива сила зброї для утримання країни разом, і дедалі більше роздратовані тим, що уряд розглядає армію як інструмент, а не як одну з найважливіших установ країни. Дехто навіть уважає, що потрібен новий уряд, який знає, як вести державу [Root.GetName] в наступну половину століття.\n\nЦя фракція, можливо, не є переважно політиками, але дехто з них отримав посади в міністерстві оборони. Якщо такий розвиток подій продовжиться, вони можуть мати достатню політичну підтримку для здійснення перевороту."
 political_connections_navy_spirit_desc:0 "Моє командування не має нічого спільного з тим, що мій батько був міністром фінансів!"
