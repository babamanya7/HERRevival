 GER_division_britain_mot_tt:0 "§YМоторизована§! частина §YSS-Division Oliver Cromwell§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_latvia_mech_tt:0 "§YМеханізована§! частина §Y15. SS-Panzergrenadier-Division§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_lithuania_infantry_tt:0 "Ненавчена частина §Y40. SS-Waffen-Grenadier-Division§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_sweden_mech_tt:0 "§YМеханізована§! частина §Y§YМеханізована§! частина §YSS-Panzergrenadier-Division Sveaborg§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_dornier_organization:0 "$dornier$"
