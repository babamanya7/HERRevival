 SH_battleship_2_desc:0 "Нове слово в концепції суперважких кораблів: потужніші знаряддя та поліпшена система управління вогнем."
 SIA_a_new_dawn_over_asia:0 "Новий світанок над Азією"
 SIA_a_new_drydock_desc:0 "Серйозне військово-морське обслуговування вимагає сучасного сухого доку. Без нього ремонт великих кораблів залишатиметься повільним, неефективним і залежним від іноземної допомоги. Новий сухий док дасть [ROOT.GetNameDef] більш жорсткий контроль над власним військово-морським майбутнім."
 SIA_achieve_foreign_legitimacy_desc:0 "Іноземні держави спостерігали за нашою кризою з підозрою, чекаючи, чи скотиться Сіам у правління хунти або революцію. Ми повинні довести, що цивільний уряд є стабільним, законним і здатним захистити країну."
 SIA_aid_for_resources_desc:0 "Наша нація має ресурси, яких бажають іноземні держави, і не має певних інструментів, які вони можуть надати. Розумний обмін допомоги на матеріали допоможе забезпечити [ROOT.GetNameDef] постачанням, гарантуючи при цьому, що наше багатство сприятиме нашому власному збереженню."
 SIA_ananda_age_trigger_12:0 "Королю Ананді щонайменше §Y12§! років (Зараз §Y[?var:SIA_anandas_age]§!). Його день народження 20 вересня."
