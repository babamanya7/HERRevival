 tfv_australia.72.d:0 "Незважаючи на спроби [Root.GetAdjective]ого Верховного командування, держава [From.GetNameDef] відхилила наш запит щодо контролю над їхніми колоніями в регіоні Південно-Східної Азії.\n\nОднак наші амбіції нестримні. Ми продовжуватимемо шукати шляхи забезпечення [Root.GetAdjective]ої популярності в Тихому океані."
