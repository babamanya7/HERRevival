 MEX_focus_heavy_artillery_desc:0 "Убивча сила польової артилерії незаперечна. Велика війна показала світові, наскільки артилерія необхідна для підтримки наступу та припинення наступу противника. Ми повинні розвивати нашу звичайну артилерію."
 MEX_focus_heroic_military_college_desc:0 "Colegio Militar була заснована в 1823 році та отримав почесне звання Heroico після того, як п'ятеро його курсантів билися насмерть проти американської морської піхоти під час американсько-мексиканської війни 1847 року. Шостий курсант загорнувся в мексиканський прапор і кинувся зі стін, щоб уникнути захоплення."
 MEX_focus_hispanic_alliance:0 "Іспанський альянс"
 MEX_focus_jefe_maximo_desc:0 "Мексика ще глибше зануриться в хаос, якщо Плутарко Кальєс втратить свій вплив на країну. Він створив адміністрації Портеса, Ортіса, Родрігеса, а тепер і Карденаса, і його політичні вороги критикують його як «el Jefe Maximo», як якогось бандитського вождя! По правді кажучи, Кальєс просто літній державний діяч, який має на увазі лише найкращі наміри щодо Мексики. Втратити його на цьому етапі революції було б пародією."
 MEX_focus_plan_of_agua_prieta_desc:0 "Революція проти Діаса та жорстока внутрішня боротьба після неї тривали десятиліття. Коли пил влягся, переможні північні генерали зустрілися в Агуа-Прієта, Сонора, щоб викласти свій план щодо майбутнього Мексики. Вони є популістською клікою прихильників модернізації та секуляризації, або ж «конфедерацією касіке», трохи кращою за бандитських лордів, які ділять свою здобич, залежно від точки зору."
