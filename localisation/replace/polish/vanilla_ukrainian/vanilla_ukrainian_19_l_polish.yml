 sp_air_scientist_xp_generic_reward_desc:0 "Під час роботи з останнім прототипом наші науковці зробили кілька нових відкриттів."
 sp_armored_lc_transmission_improvements_tech:0 "Поліпшення підвіски"
 sp_cluster_shells:0 "Кластерні снаряди"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology:0 "Прорив у рушійних технологіях"
 sp_land_reward_option_self_propelled_super_heavy_howitzer_focus_preference_firepower:0 "$sp_land_reward_option_super_heavy_howitzer_focus_preference_firepower$"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_firepower:0 "Зосередитися на вогневій моці"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc:0 "Новий метод армування, відкритий одним із молодших інженерів, був переданий зовнішній дослідницькій групі на подальшу оцінку. Хоча результати все ще вивчаються, цей метод можна застосувати в поточному проєкті, якщо він буде визнаний придатним."
 sp_naval_modern_battleship_preference_c_a:0 "Точність"
 sp_naval_modern_carrier_preference_c_a:0 "Стримування легких сил"
 sp_naval_submarine_carrier_free_design:0 "Підводний авіаносець"
 sp_naval_super_heavy_battleship_unique_reward_a_desc:0 "Проєктування нового класу лінкорів дає нам змогу зосередити зусилля на вдосконаленні здатності домінувати в морському бою. Що слід обрати пріоритетом?"
 sp_naval_torpedo_cruiser_desc:0 "Ми можемо завдати значної шкоди найважливішим і найдорожчим кораблям наших ворогів, використовуючи торпедні крейсери, відповідно до концепції минулого століття — jeune école."
 sp_nuclear_generic_industry_tech_reward_desc:0 "Під час роботи над проєктом наші інженери зробили кілька нових винаходів, які з великою ймовірністю можуть бути адаптовані для використання і в інших сферах."
 sp_nuclear_scientist_xp_generic_reward_desc:0 "TODO_TA"
 sp_rocket_interceptor_desc:0 "Поєднавши силу ракети з маневреністю невеликого корпусу, ми створимо неперевершений літак-перехоплювач."
 sp_rocket_submarine_eq_bonus_range_increase:0 "Missile Launching Submarine - збільшена дальність"
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc:0 "Під час останнього етапу створення прототипу було значно покращено точність та стійкість системи наведення до перешкод, що дозволило нам посилити нашу технологічну перевагу."
 sp_rockets_medium_range_ballistic_missile:0 "БРСД"
 sp_shock_hardening_techniques_desc:0 "Застосовуючи різні методи шокового загартування та використовуючи вирівнювачі напруги для наших компонентів, ми знизили рівень передчасних детонацій, зробивши наші снаряди більш надійними та ефективними."
 sp_super_heavy_battleship_eq_bonus_anti_air:0 "Надважкий лінкор: поліпшені зенітні батареї"
 sp_tag_bomb_speed_factor_tt:0 " $sp_tag_bomb_speed_factor$: $RIGHT|+=%1$"
 sp_tag_guided_bomb_speed_factor_tt:0 " $sp_tag_guided_bomb_speed_factor$: $RIGHT|+=%1$"
 spain.2.d:0 "Переворот не був повністю успішним, але карлісти, фалангісти й Конфедерація автономних правих змогли мобілізувати велику частину армії та скинути Республіку, що надто довго дозволяла нашій гордій християнській нації розпадатися в анархію. Результат усе ще невизначений, і світ із занепокоєнням спостерігає, яка сторона здобуде перемогу.\n\nМи не влаштували переворот, сидячи склавши руки, і цього не має робити світ, якщо він хоче розчавити червону загрозу. Інші нації в схожому процесі відновлення своєї національної слави мали б бути готові прийти нам на допомогу."
 ss_bonus:0 "Бонус до моделей підводних човнів"
 stability.22.b:0 "Проведімо демонстрацію сили армії в містах."
 stability.23.desc.b:0 "Зусилля, спрямовані на подолання заколотів в армії, не дали жодного ефекту. Підбадьорені відсутністю ефективної реакції уряду, заколотники розширили список своїх вимог, включивши до нього негайне припинення вогню з подальшим укладенням всеосяжного мирного договору та демобілізацію.\n\nУправління війни наполегливо рекомендує надіслати заколотникам рішучий сигнал, щоб утримати їх від будь-яких подальших дій з їхнього боку."
 stability.23.t:0 "Бунти в армії"
 stability.31.a:0 "Рішучі дії запобігли гіршому."
 staunch_monarchist:0 "Переконаний монархіст"
 strat_bomber:0 "Стратегічний бомбардувальник"
 strat_bomber_equipment_3:0 "Стратегічний бомбардувальник III"
 strategic_destruction_desc:0 "Наші пілоти можуть добратися до стратегічних цілей швидше, ніж флот і наземні війська. Оскільки противнику буде нічим оснащувати своїх новобранців, ми швидко задавимо його числом."
 strikes_event.5.a:0 "Мабуть, нам слід."
 strongman_of_san_luis_potosi:0 "Деспот Сан-Луїс-Потосі"
 subject:0 "Суб'єкт"
