 denmark_events.200.desc:0 "Помер знаменитий політичний діяч Торвальд Стаунінг. Він кілька термінів служив прем'єр-міністром Данії і здобув популярність серед багатьох громадян. Під кінець свого життя він висловлював стурбованість майбутнім соціальної демократії в Європі."
