 landing_craft_desc:0 "Судно, спеціально розроблене для висадки на ворожу територію, трохи спростить завдання."
 landmark_berlin_volkshalle_desc:0 "Зала Народу є свідченням незламності духу нашого народу та його гордого бажання домінувати над земною кулею. Він покаже світові, що завдяки силі завоювань все можливо, і батьківщина може зробити навіть найбільше неможливе завдання можливе."
 lar_appeal_to_overseas_territories.2.t:0 "Індокитай залишається з Віші"
 lar_appeal_to_overseas_territories.8.desc:0 "Хоча місцеві керуючі в Західній Африці і підтримували перехід на нашу сторону, значна частина європейського населення, судячи з усього, цю думку не поділяла. Через наростаючий громадський тиск губернатори були змушені публічно оголосити про свою підтримку уряду Віші."
 lar_arms_purchases.3.a:0 "Яка нахабність!"
 lar_bruneval_raid.1.a:0 "Який боягузливий спосіб ведення війни."
