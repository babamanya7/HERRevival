 IRQ_heavy_industry_investments_desc:0 "Ми досягаємо успіху в постачанні сировини для промисловості, але стає очевидним, що для того, щоб наздогнати великі держави, нам потрібно створити більше державних важких галузей промисловості або субсидувати існуючі."
