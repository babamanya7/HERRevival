 raid_type_CHI_national_diet_bombing_desc:0 "Відправивши групу бомбардувальників для удару по головному штабу ворога та символічному осередку влади Японії, ми зможемо підняти бойовий дух нашого народу й водночас завдати удару по моральному стану ворога."
