 antilles_category_desc:0 "Антильська конфедерація була палкою ідеєю Рамона Еметеріо Бетансеса щодо необхідності об’єднання корінних жителів Карибського басейну в єдине регіональне утворення, яке б прагнуло зберегти суверенітет і добробут антильських націй. Її підтримка здобула свого піку на час з 1850-х років до самої іспано-американської війни. Відтоді здебільшого зникла, але ще не все втрачено. Покликаючись на дух нашого спільного шляху, ми можемо прагнути створити Антильську конфедерацію раз і назавжди. Антили для антильців!"
