 YUG_expand_the_university_of_belgrad:0 "Розширити Белградський університет"
 YUG_heavy_fighter_project_desc:0 "Наші винищувачі повинні бути в змозі підтримувати більш вразливі бомбардувальники. Це вимагає важчого озброєння та більшої дальності за рахунок певної швидкості та маневреності."
 YUG_heavy_tank_equipment_3_short:0 "TT M43"
 YUG_independent_engineer_regiments_desc:0 "Мобільність є ключовою в сучасній військовій доктрині, хоча місцевість не завжди дозволяє це зробити. Спеціальні інженерні полки, вмонтовані в наші дивізії, працюватимуть, щоби полегшити пересування дивізії будь-якою місцевістю."
 YUG_josip_broz_tito:0 "Йосип Броз Тіто"
 YUG_modern_tank_equipment_1:0 "Projekat Igman"
 YUG_modern_tanks_desc:0 "Завдяки додаванню основного озброєння великого калібру бронетехніка вийшла далеко за межі простого наміру безпечного транспортування сил із пункту А в пункт Б. Ми повинні розробити власну версію сучасних танків, щоб мати змогу конкурувати з нашими сусідами."
 YUG_petar_kosic:0 "Петар Косіч"
 YUN_expand_local_infrastructure_desc:0 "In order for our province to be properly traverseable, we need to invest in infrastructure that can be sustained in mountainous terrain such as ours. This way more goods may also be transferred between our towns."
