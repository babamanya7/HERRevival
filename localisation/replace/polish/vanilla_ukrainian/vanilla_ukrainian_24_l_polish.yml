 SCO_democratic:0 "Шотландія"
 SCO_neutrality:0 "Королівство Шотландія"
 SEA_PHI_political_events.21.t:0 "Даґлас МакАртур прибуває на Філіппіни"
 SEA_PHI_political_events.64.t:0 "Смерть $PHI_manuel_luis_quezon$"
 SEA_PRC_border_war_events.6.desc:0 "Після прикордонних сутичок вздовж кордону [1032.GetName], [PRC.GetNameDef] не вдалося прорвати оборонні рубежі та витіснити ворога. Проте [PRC.GetNameDefCap] вдалося захопити трохи артилерії."
 SEA_PRC_faction_events.20.desc:0 "[FROM.GetLeader] відкрито поставив під сумнів військові зусилля та лідерство [?PRC_faction_leader_var.GetLeader] під час нещодавнього саміту з членами [ROOT.GetFactionName]. Він розкритикував те, як ведеться війна, звинувативши [?PRC_faction_leader_var.GetName] у навмисному затягуванні конфлікту. Це може бути грою [FROM.GetLeader] з метою отримання більшого впливу в альянсі, але, можливо, в його звинуваченнях є частка правди?"
 SEA_PRC_faction_events.30.desc:0 "Здається, [FROM.GetNameDef] успішно вдалося проникнути на нашу територію і забезпечити собі лояльність багатьох наших підданих. Тепер вони вимагають офіційної передачі цих територій [FROM.GetNameDef]. Що станеться, якщо ми відмовимося, не уточнюється, але це, ймовірно, викличе силову відповідь."
 SEA_PRC_faction_events.32.b:0 "Ми не потерпимо зрадливих союзників!\n§R[FROM.GetName] може спробувати приєднатися до іншої фракції§!"
 SEA_PRC_fourth_army_incident.3.desc:0 "Уряд [FROM.GetNameDef] надіслав нам скаргу на відсутність координації між нашими командирами на місцях. Вони цитують звіти своїх командирів, у яких зазначено, що наші офіцери не бажали виконувати накази командування [FROM.GetName], залишаючи їх усіх у невиправдано вразливих позиціях. Зокрема, [FROM.GetNameDef] хоче, щоб ми гарантували свою участь у поточному тактичному відступі і не ставили його під загрозу міжусобицями."
 SEA_PRC_misc_events.10.a:0 "Ми приймемо будь-яких міжнародних добровольців"
 SEA_PRC_misc_events.2.desc:0 "Китайський народ почав сумніватися в нашій рішучості проти іноземних загарбників."
 SEA_PRC_political_events.22.desc:0 "\nНаші представники в [FROM.capital.GetName] повідомили нам новину, що [FROM.GetNameDef] прийняв наше прохання дозволити $SOV_vasily_chuykov$ повернутися до Китаю, і поінформували, що він вже в дорозі до [ROOT.GetNameDef]. Крім того, до нього приєднався $SOV_aleksandr_cherepanov$."
 SEA_PRC_political_events.3.t:0 "[FROM.GetNameDefCap] погоджується на територіальні гарантії"
 SEA_PRC_zhang_guotao_events.4.desc:0 "$PRC_zhang_guotao$ оголосив про свій вихід з Комуністичної партії Китаю, посилаючись на невиправно зіпсовані стосунки з Центральним комітетом та своє розчарування в партії."
 SEA_china.2.desc:0 "У момент прозріння [FROM.GetNameDef] вирішила підтримати нас у нашій боротьбі. Ми не маємо ілюзій, що це акт доброти; скоріше, це власний інтерес у тому, щоб ми виконували за них брудну роботу."
 SEA_china.28.desc:0 "Центральний уряд капітулював перед [JAP.GetNameDef], пообіцявши не чинити опір територіальній агресії. Удар тепер припадає на нас: [JAP.GetAdjective]ий уряд вимагає наші землі, прагнучи анексії шляхом дипломатичного примусу."
 SEA_china.5.a:0 "Шлях до перемоги відкритий"
 SEA_china.6.t:0 "[FROM.GetNameDefCap] відхиляє наш запит"
 SEA_china_democratic.4.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися до нас"
 SEA_china_democratic.9.a:0 "Ми повинні звільнити їх, чого б це не коштувало"
 SEA_china_warlords.1.b:0 "У нас немає вибору, окрім як підкоритися"
 SEA_generic_events.14.a:0 "Ми включимо кілька пропозицій [GetOppositionPartyAdjective]"
 SEA_imperial_influence_demand_event_option_6:0 "Роби або не роби, намагатися немає сенсу"
 SEA_imperial_influence_events.440.desc:0 "Лідери партії висунули свої вимоги. Схоже, вони засмучені зростаючою силою та впливом Армії на [GetImperialInfluenceRulerTitle] і бажають швидких дій для обмеження їхнього зростання та влади. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_japan_foreign_policy.1.a:0 "Це можливість для нас"
 SEA_japan_foreign_policy.100.t:0 "[FROM.GetNameDefCap] запрошує нас до валютного союзу"
 SEA_japan_foreign_policy.101.a:0 "Чудово"
 SEA_japan_foreign_policy.105.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відреагував на наше запрошення до інтеграції з сильним невдоволенням і стверджує, що будь-яке тісніше економічне партнерство між нашими країнами не обговорюється і ніколи не буде обговорюватися. Можливо, вони могли передбачити, що ми для них готували..."
 SEA_japan_foreign_policy.109.t:0 "[FROM.GetNameDefCap] вимагає повної інтеграції"
 SEA_japan_foreign_policy.15.a:0 "За це не варто воювати"
 SEA_japan_foreign_policy.3.b:0 "Вони нам все одно не були потрібні"
 SEA_japan_foreign_policy.32.a:0 "Ми можемо їм це пообіцяти"
 SEA_japan_foreign_policy.34.desc:0 "[FROM.GetLeader], лідер [FROM.GetNameDef], вирішив, що [FROM.GetAdjective]і люди не заслуговують на милосердя, відхиливши нашу великодушну пропозицію і прийнявши за нас рішення, що ми повинні покласти край [FROM.GetAdjective]ій державі."
 SEA_japan_foreign_policy.36.b:0 "Припиніть цю нісенітницю негайно!"
 SEA_japan_foreign_policy.39.a:0 "Напевно, за цим криється якийсь прихований намір"
 SEA_japan_foreign_policy.41.desc:0 "Сенбу були створені для посилення нашого контролю над нашими континентальними володіннями і почали намагатися підвищити рівень покори на наших окупованих територіях. Можливо, настав час надати їм більше адміністративних обов'язків і належним чином використати їх?"
 SEA_japan_foreign_policy.45.b:0 "Ми не відмовимося від нашої економічної незалежності!"
 SEA_japan_foreign_policy.6.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися до нас"
 SEA_japan_foreign_policy.64.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прийняв [JAP.GetAdjective]у пропозицію об'єднатися з нашим урядом, і тепер усі [FROM.GetAdjective]і землі підпадають під нашу юрисдикцію. Це великий день для нас!"
 SEA_japan_foreign_policy.69.desc:0 "[JAP.GetLeader] проголосив створення нової [ROOT.GetAdjective]ої держави, яка протистоїть нам і нашому поточному курсу. Схоже, вони готові боротися за свою незалежність від нас і не здадуться без бою!"
 SEA_japan_foreign_policy.72.desc:0 "Дипломати, що виступають від імені [FROM.GetLeader], погодилися на наші вимоги, підігнувши хвости, і здають нам свої сибірські володіння. Сьогодні великий день для Імперії!"
 SEA_japan_foreign_policy.81.t:0 "Асоціація Конкордія виступає проти нас"
 SEA_japan_foreign_policy.94.desc:0 "Дволикий лідер [FROM.GetNameDef], [FROM.GetLeader], відхилив усі наші пропозиції, відкинувши ідею тісніших зв'язків між нашими націями. Це похмурий день для [ROOT.GetNameDef] та її дипломатичних досягнень..."
 SEA_japan_foreign_policy.94.t:0 "[FROM.GetLeader] не підписує жодної угоди"
 SEA_japan_popup_events.28.t:0 "Сільська база операцій"
 SEA_japan_popup_events.49.desc:0 "Після приходу до влади як представник поміркованих сил у флоті, [ROOT.GetLeader] став дуже популярним в очах народу. Однак тепер, коли армія знову здобуває величезну владу, схоже, що вони все ще тримають на нього зуб, оскільки раніше сьогодні його знайшли мертвим у власній резиденції. Хоча це, ймовірно, фальшивка, на тілі прем'єр-міністра було знайдено заповіт, який передає керівництво країною Адачі Кендзо."
 SEA_japan_popup_events.5.desc:0 "Після достатніх «умовлянь», здається, наш великий імператор вирішив підтримати наш новостворений уряд, давши нам офіційне благословення на продовження наших планів щодо Реставрації Шьова. Це послужить зміцненню нашої нації!"
 SEA_japan_popup_events.7.desc:0 "Раніше сьогодні наші офіцери, за повідомленнями, знайшли імператора Шьова мертвим у його резиденції. Вони стверджують, що його вбили іноземні агенти, але ми не можемо знати напевно, адже правда може зашкодити нам більше, ніж принести користь. Через цю загрозу військові оголосили воєнний стан і заявили, що принц Тітібу, генерал Імперської армії, буде коронований, оскільки було б занадто небезпечно продовжувати спадкоємність і передавати корону Акіхіто, коли нападники все ще можуть бути на волі. Чи це частина великої змови, чи справді діяв іноземний нападник?"
 SEA_japan_popup_events.8.b:0 "Аракі має стати Сото нації"
 SEA_japan_tokko_arrest_events.4.b:0 "Намагайтеся не розлютити [SOV.GetAdjective]у владу"
 SEA_warlords.12.t:0 "$XSM_ma_hongbin$ прибуває"
 SEA_warlords.21.desc:0 "$wtt_political_warlord_support.22.desc$"
 SEA_warlords.27.t:0 "[FROM.GetLeader] капітулює"
 SEA_warlords.35.b:0 "Почекаємо і побачимо..."
 SEA_warlords.37.t:0 "Боротьба за Ґуансі"
 SEA_warlords.46.desc:0 "Ми отримали відповідь від [GXC.GetNameDef], і, на жаль, вони вирішили, що їхній «суверенітет», який вони скоро втратять, важливіший за наше спільне майбутнє. Тепер ми повинні розглянути альтернативні кроки, найбільш імовірним з яких є об'єднання силою, адже тільки разом ми зможемо протистояти державам, що гуртуються проти нас."
 SEA_warlords.55.a:0 "Тоді ми чекатимемо свого часу..."
 SEA_warlords.60.t:0 "Генерали переходять на бік [FROM.GetNameDef]"
 SEA_warlords.7.t:0 "Надходить мінімальна допомога"
 SEA_warlords.71.t:0 "[FROM.GetLeader] Requests Aid"
 SEA_warlords.8.desc:0 "Центральний уряд вирішив повністю підтримати наші зусилля, щоб гарантувати, що Совєти не захоплять нашу провінцію, ризикуючи при цьому власними відносинами з цією державою."
 SEN_DEF:0 "Сенеґал"
 SERVER_LOST:0 "Сервер був втрачений."
 SET_FACTION_RULE_EFFECT:0 "Задає правило $RULE|H$ для альянсу $FACTION|H$."
