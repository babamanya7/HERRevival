 SOV_comecon_dec_cat_desc_default:0 "$SOV_found_the_comecon_desc$"
 SOV_control_scandinavia_desc:0 "Останньою загрозою для нашого північного кордону залишаються уряди на Скандинавському півострові. Ми мусимо донести до них, що мирне співіснування вимагає взаємної довіри, а ми не можемо довіряти урядам, ідеологія яких не збігається з нашою."
 SOV_coup_detat_desc:0 "Настав час узяти на себе владу в країні. Якщо все піде добре, ми вдаримо швидко і усунемо найбільші перешкоди безкровним переворотом. Якщо все піде не так, нам доведеться боротися за нашу країну."
