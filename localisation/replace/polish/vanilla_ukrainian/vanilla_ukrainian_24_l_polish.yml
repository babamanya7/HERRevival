 BBA_switzerland.10.desc:0 "Представники [?SWI.SWI_fascist_germany.GetNameDef] і вдова Густлоффа висловили вдячність [SWI.GetNameDef] за рішучий вирок Франкфуртеру, тож тепер немає сумнівів у позиції [SWI.GetNameDef] у подібних питаннях. Це безперечно покращить ставлення [?SWI.SWI_fascist_germany.GetName] до [SWI.GetName].\n\nПопри позитивні коментарі [?SWI.SWI_fascist_germany.Getleader.GetHerHis], було чітко зазначено, що ідеальним варіантом для нацистської партії була б екстрадиція до [?SWI.SWI_fascist_germany.GetNameDef]."
