 BRA_expand_operation_bolivar:0 "Розширити операцію «Болівар»"
 BRA_italian_trucks_desc:0 "Нам слід докласти зусиль, щоби не лише отримати італійський досвід у розробці та виробництві сучасних автомобілів, але й зробити замовлення та попросити негайну доставку італійських вантажівок."
 BRA_kgbrazil_just_add_operatives:0 "Співпраця [SOU.GetAdjective] розвідки"
