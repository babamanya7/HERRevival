 JAP_launch_the_suiyuan_campaign_desc:0 "Армія Внутрішньої Монґолії та Праведна армія Великої Хань готові розпочати операцію на територіях польового командира [SHX.GetLeader], за умови надання нашої авіаційної підтримки та нагляду японських штабних офіцерів. Можливо, нам вдасться забезпечити контроль над більшою частиною Внутрішньої Монґолії, не провокуючи повномасштабну війну в Китаї."
