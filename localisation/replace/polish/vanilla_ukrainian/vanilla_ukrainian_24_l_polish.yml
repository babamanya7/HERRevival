 CKK_democratic_DEF:0 "Чукотська республіка"
 COG_a_society_of_trade_desc:0 "Наша соціальна структура давно існує завдяки торговим шляхам, що проходять через Конґо. Ми повинні підтримувати це, якщо хочемо здобути більш сильну економічну основу."
 COG_attempt_to_centralize_the_state_desc:0 "Наша велика країна практично неможлива для контролю з одного центрального місця, якщо тільки ми не винаходимо кращі технології зв'язку та транспорту. Проте ми повинні зробити все, що можемо, щоб централізувати державу навколо нашої столиці."
 COG_congo_integration_decisions_desc:0 "Настав чудовий момент возз'єднати народ баконґо в рамках однієї держави. Ми маємо докласти зусиль для інтеграції окупованих територій у нашу державу."
 COG_foster_a_personality_cult:0 "Розвивати культ особистості"
 COG_great_cattle_chiefs:0 "Великі вожді худоби"
 COG_guerilla_tactics_drills_desc:0 "Наша місцевість ідеально підходить для тактики партизанської війни. Тому ми повинні зосередитися на тренуванні наших солдатів у використанні цих методів на свою користь і гарантувати, що зможемо відбити будь-якого загарбника, якого зустрінемо."
 COG_kimberite_pipes_to_expand_bakwanga_mine:0 "Використати кімберлітові труби для розширення шахти Бакванга"
 COG_marcel_maquet:0 "Марсель Маке"
 COG_national_committee_for_liberation_tt:0 "§RМи більше не зможемо намагатися мирно вести переговори про нашу незалежність і будемо зобов'язані почати збройну революцію§!"
