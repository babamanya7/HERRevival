 ITA_VICTORY_POINTS_819:0 "Наполі"
 ITA_abolish_the_colonies_tips_tt:0 "Збільшення підпорядкування на колоніальних землях і завершення фокусу з розвитку певних областей зроблять більш імовірною успішну інтеграцію регіону."
 ITA_albanian_occupation_desc:0 "Албанія є легкою мішенню для наших військ для окупації. Навряд чи ми зустрінемо сильний опір. Ми мусимо показати світові міць Італії та відновити славу минулого!"
 ITA_amedeo_mecozzi:0 "Амедео Мекоцці"
 ITA_anglo_italian_agreements:0 "Англо-італійські угоди"
 ITA_armored_car_equipment_2_short:0 "AS.42"
 ITA_army_modernization:0 "Модернізація армії"
 ITA_balbo_low_control_range:0 "$ITA_mussolini_low_control_range$"
 ITA_battle_cruiser_2_desc:0 "Клас «Principe Amedeo» — це гіпотетичний крейсер, який був би спущений на воду наприкінці 1930-х років. Він був би порівнянний з французькими крейсерами типу Dunkerque, водотоннажністю близько 30 000 тонн і озброєний 320-мм гарматами в головній батареї."
 ITA_battleship_2:0 "Клас «Caio Duilio»"
 ITA_benito_mussolini_roman_emperor:0 "Авґуст Муссоліні"
 ITA_blackshirts_div_cap_8_tt:0 "Змінити межу шаблону §YCamicie Nere§! на §G+8§!."
 ITA_bop_liturgical_reforms:0 "Літургійні реформи"
 ITA_bop_resign_ministry_of_justice_position_desc:0 "Відставка з посади міністра благодаті та правосуддя відкриє доступ до неї іншим, залишаючи Беніто Муссоліні менший контроль над судовою системою та установами Італії."
 ITA_bop_utilize_the_mafia_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_SUPPLY_NODE_RANGE$: §G+10%§!\n\n"
 ITA_catholic_action:0 "Католицька дія"
 ITA_cede_aquila_class_destroyers_to_spanish_tag_desc:0 "Ми могли би передати іспанцям кілька наших есмінців, щоб зміцнити зв'язок між нашими країнами і посилити їхній військовий потенціал."
 ITA_common_ground_advisors_tt:0 "Відмикає радників із інших антифашистських груп."
 ITA_conquer_the_north_mission_desc:0 "Настав час відвоювати позиції, які ми втратили під час наступу ефіопів."
 ITA_deus_vult:0 "Deus vult"
 ITA_develop_libya:0 "Розвиток Лівії"
 ITA_divino_duce_desc:0 "Стало очевидним, який вплив може мати одна людина на країну та її народ. Можливо, це те, що ми можемо використати і адаптувати. Використовуючи наші державні канали, ми можемо просувати нашого нового дуче як сильного і здібного лідера, здатного об'єднати Італію. Ми дамо людям когось більшого, ніж життя, в кого можна вірити — когось божественного, в кого можна покласти свою віру!"
 ITA_end_fiat_ansaldo_duopoly_medium_templates_tt:0 "\nКоли буде досліджено технологію §Y$improved_medium_tank_chassis$§!:\n"
 ITA_enlist_the_bashkimi_kombetar_desc:0 "Є багато громадян Албанії, які симпатизують нашому уряду та ідеології і бажають вступити до загонів червоносорочників. Ми мусимо створити нову гілку нашого добровольчого ополчення, в рамках якої організувати нові підрозділи, що складаються з цих новобранців."
 ITA_enrico_fermi:0 "Енріко Фермі"
 ITA_expand_national_universities_desc:0 "Для такої технологічно розвиненої країни, як наша, завжди існує потреба у більшій кількості інженерів. Ми визначили наші університети як найбільше вузьке місце для підготовки достатньої кількості нових фахівців, щоби зберегти конкурентоспроможність нашої країни."
 ITA_expanded_corporatism:0 "Розширений корпоративізм"
 ITA_ezio_rosi:0 "Еціо Розі"
 ITA_ferrovie_dello_stato_italiane:0 "Ferrovie dello Stato Italiane"
 ITA_fighter_designs:0 "Дизайни винищувачів"
 ITA_filippo_bonfiglietti:0 "Філіппо Бонфільєтті"
 ITA_grand_council_alt:0 "Національна військова хунта"
 ITA_guardia_nazionale_repubblicana_desc:0 "Враховуючи роль, яку відіграли Королівські карабіньєри у спробі повалення фашистського режиму, ми негайно замінимо цю збройну силу. У нас уже є план відновлення чорносорочників і створення Національної республіканської гвардії, яка виконуватиме поліційні та військові функції."
 ITA_heavy_tank_equipment_1_short:0 "P75"
 ITA_human_torpedo_raid_trigger_tt:0 "Має принаймні один §Yосновний корабель§! або §Yкорабель прикриття§! на стоянці в морській базі"
 ITA_iberian_protection:0 "Іберійський захист"
 ITA_il_sol_dell_avvenire_desc:0 "Настав час проголосити нову італійську державу, Італійський національний союз, в якому всі громадяни будуть вільними та рівними перед державою.\nСонце майбутнього зійде в Італії!"
 ITA_imam_organization:0 "$ITA_imam$"
 ITA_independence_war:0 "Війна за незалежність"
 ITA_italia_libera_invite_tt:0 "\n§YНезалежні демократичні країни§! в Центральній і Південній Європі, близькі до [ROOT.GetName], будуть запрошені в §Y$ITA_free_states_of_europe$§!."
 ITA_italian_confederation:0 "Італійська конфедерація"
 ITA_joined_faction_with_literally_hitler_achievement_flag:0 "Держава §Y[ITA.GetFlag][ITA.GetNameDefCap]§! приєдналася до альянсу фашистської держави §Y[GER.GetName]§! будь-якої миті"
 ITA_liberate_gramsci_desc:0 "Наш товариш, філософ-марксист Антоніо Ґрамші, вже більше десяти років утримується фашистським урядом у в'язниці, і зараз його здоров'я стрімко погіршується. Ми мусимо організувати таємну операцію, щоби звільнити його та врятувати йому життя, адже він, без сумніву, стане ключовою фігурою в нашій робітничій революції."
 ITA_light_tank_equipment_1:0 "L3"
 ITA_litoranea_balbo:0 "[GetAppropriateLitoraneaBalboName]"
 ITA_long_range_aircraft_desc:0 "Ворожі бази, промисловість і лінії постачання часто знаходяться далеко поза лінією фронту. Нам потрібно розвивати та вдосконалювати наші літаки далекої дії, щоби ті могли досягати та вражати ці життєво важливі цілі."
 ITA_mafia_abroad:0 "Мафія за кордоном"
 ITA_medium_tank_artillery_equipment_3_short:0 "Semovente M42L 105/25"
 ITA_midget_submarines:0 "Карликові підводні човни"
 ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro:0 "Змінити §Y[GetAppropriateRegiaAeronauticaNsName]§! на:"
 ITA_mussolini_high_control_range:0 "Диктаторський авторитет дуче"
 ITA_mussolini_took_over_minister_of_corporations_flag:0 "Минуло §Y365 днів§! відтоді, як §Y[ROOT.ITA_benito_mussolini.GetName]§! очолив Міністерство корпорацій\n(наразі минуло [?ITA_mussolini_took_over_minister_of_corporations_flag:days|Y0])"
 ITA_navi_da_battaglia_desc:0 "Лінкори класу «Littorio» є швидкими та потужними прикладами основних кораблів. Будівництво більшої кількості таких кораблів і вдосконалення нашої доктрини для їхнього ефективнішого використання значно поліпшить нашу бойову лінію."
 ITA_negotiate_italian_claims:0 "Обговорити італійські претензії"
 ITA_new_industrialization_program_generic_tt:0 "Якщо фокус §Y$ITA_strengthen_northern_industry$§! був виконаний, північні національні конструктори будуть поліпшені.\nЯкщо фокус §Y$ITA_modernize_the_mezzogiorno$§! був виконаний, південні національні конструктори будуть поліпшені."
 ITA_new_ricostruzione_industriale:0 "Nuova Ricostruzione Industriale"
 ITA_novus_ordo_forts_tt:0 "Додати до §Y10 наземних укріплень§! повністю контрольованих землях на кордонах Лівії."
 ITA_partisan_republics_state_modifier_tt:0 "$ITA_modify_partisan_state_modifier_intro$\n$MODIFIER_COMPLIANCE_GROWTH_ON_OUR_OCCUPIED_STATES$: §G-10%§!\n\n"
 ITA_peace_preservation_guarantees_tt:0 "Буде надано гарантії кожній незалежній або союзній §Yдемократичній§! країні Європи:"
 ITA_refit_civilian_ships:0 "Переобладнати цивільні кораблі"
 ITA_regia_marina_3_alt_dynamic_modifier:0 "$ITA_regia_marina_alt_dynamic_modifier$"
 ITA_regia_marina_name_alt:0 "$ITA_regia_marina_alt_dynamic_modifier$"
 ITA_regional_development_buildings_tt:0 "Додати §Yкомірку для будівництва§!, §Yцивільний завод§! і §Yморську базу§! в щонайбільше двох областях у попередньо розвинених регіонах. [GetAppropriatePeriodOrColon]\n"
 ITA_roman_faction:0 "Imperium Romanum"
 ITA_scout_plane_equipment_1_short:0 "Ca.310"
 ITA_self_propelled_guns_desc:0 "Танк може і зробив революцію у війні, але багато в чому самохідна гармата є найціннішою машиною на полі бою. Вогнева підтримка, яку надають порівняно дешеві та прості машини, — безцінна, коли йдеться про прорив укріплень або боротьбу з ворожими танками."
 ITA_social_stability:0 "Соціальна стабільність"
 ITA_solid_progress_completion_tt:0 "Буде автоматично після успішного завершення завдань §Y$ITA_conquer_the_north_mission$§! і §Y$ITA_conquer_the_south_mission$§!, виданих $ITA_benito_mussolini$ в січні 1936 року\n"
 ITA_spreading_the_eagles_wings:0 "Розправляючи крила орла"
 ITA_steel_in_tripoli:0 "Сталь у Тріполі"
 ITA_the_italian_republic_desc:0 "Монархія — стала та гнила система, яка не робить нічого, крім як перешкоджає нашій революції. Настав час позбутися королівської сім'ї та подбати про їхніх послідовників."
 ITA_the_italian_social_republic_desc:0 "Роялісти та інші антифашистські елементи в Італії віроломно повстали проти нашого режиму. Ми реформували нашу партію в антимонархічну Республіканську фашистську партію та створили Італійську соціальну республіку — нове втілення італійської фашистської держави. Ми будемо протистояти ворожій атаці і возз'єднаємо нашу землю!"
 ITA_war_escalation_inc_tt:0 "Ескалація війни збільшиться на §R1§!."
 ITZ_communism:0 "Колектив Чічен-Іци"
