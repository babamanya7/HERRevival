 RULE_DEFAULT_CONSTANT_OVERRIDE_BREAKDOWN_DESC:0 "$ROOT|Y$ > $FROM|Y$"
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI_DESC:0 "§HТуреччина§! прийме комуністичний уряд, який збереже відданість кемалізму і спробує утворити власну фракцію."
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC:0 "ШІ спробує утворити Дунайську федерацію, запросивши інші країни, розташовані вздовж Дунаю, під своє нейтральне крило."
 RULE_OPTION_CALIPHATE_AFG_AI_DESC:0 "Афганський ШІ спробує повалити короля Захіра-шаха і замінити його Факіром із Іпі, який потім спробує скасувати модернізацію країни. Афганістан тоді буде прагнути розширити свої кордони, щоб зрештою утворити новий халіфат."
 RULE_OPTION_COMMUNIST_BUL_AI_DESC:0 "§HБолгарія§! спробує вступити до Комінтерну та боротися проти фашизму та капіталізму в Європі разом із радянськими товаришами."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_CAN_AI_DESC:0 "§HКанадський§! ШІ намагатиметься слідувати історичній низці подій і рішень у дереві національних фокусів."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_FRA_AI_DESC:0 "§HФранцузький§! ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_OPTION_ENG_FRAGMENTED_DESC:0 "Усі доступні для звільнення складові нації Сполученого Королівства будуть створені як вільні та незалежні нації після початку гри."
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0 "§HГреція§! прийме демократію, переживе крах уряду і приступить до досягнення найбільшої цілі..."
 RULE_OPTION_INDEPENDENCE_MAN_AI_DESC:0 "§HМаньчжурський§! ШІ намагатиметься звільнитися та завоювати весь Китай, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY:0 "Християнська демократія"
 RULE_OPTION_MONARCHIST_LIT_AI_DESC:0 "§HЛитва§! намагатиметься відновити монархію та висунути претензії на Річ Посполиту."
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC:0 "ШІ намагатиметься утримати Лева Троцького в Норвеґії та дотримуватися його принципів комунізму, виступаючи проти Радянського Союзу, якщо той залишиться сталіністським, і вступаючи з ним у союз, якщо Троцький стане його лідером."
 RULE_OPTION_PLAYER_ONLY:0 "Лише проти гравців"
 RULE_OPTION_SECULAR_REPUBLIC:0 "Світська республіка"
 RULE_OPTION_SHOW:0 "Показувати"
 RULE_RESTORE_THE_SOCIALIST_REPUBLIC_HUN_AI_DESC:0 "Угорський ШІ спробує відновити колишню соціалістичну федеративну республіку та створити червону великоугорську державу."
