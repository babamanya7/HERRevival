 axis_leanings_focus_desc:0 "У нас багато спільних інтересів та цінностей із новою Німеччиною, яка зараз нарощує вплив у Європі. Якщо ми станемо союзниками, у нас з'явиться друг — сильний, але досить далекий, щоби не кидати нам виклик в Азії."
