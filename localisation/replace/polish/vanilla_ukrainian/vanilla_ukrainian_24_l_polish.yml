 CHI_avoid_another_crisis_cat:0 "Назрівання чергової кризи"
 CHI_avoid_another_crisis_tt:0 "\nНадасть варіанти відтермінування японського вторгнення шляхом надання поступок."
 CHI_bolster_our_ranks:0 "Зміцнити наші ряди"
 CHI_central_steel_and_machine_works_desc:0 "Сталь є глибоко фундаментальною для нашої промисловості, і досі нам бракувало належного виробництва. І це незважаючи на доступні нам ресурси, нам просто потрібно запровадити план Національної ресурсної комісії."
 CHI_china_reborn_desc:0 "Старі ідеї призвели лише до нашої експлуатації імперіалістами. Потрібна фундаментальна зміна курсу. Нам потрібно переформатувати наше суспільство за допомогою нової ідеології. Ми розпочнемо серію кампаній, які назвемо «Рухом за нове життя»."
 CHI_collaboration_with_the_japanese:0 "Співпраця з японцями"
 CHI_communist_infiltration_state_607:0 " [607.GetName][607.GetCommaIfMoreInfiltration]"
 CHI_crack_down_on_illicit_goods:0 "Боротьба з незаконними товарами"
 CHI_defend_our_coasts:0 "Захистити наші узбережжя"
 CHI_detect_infiltration:0 "Зачитка від проникнення"
 CHI_enact_georgist_tax_reforms_desc:0 "Джорджизм слугував основою економічної теорії Сунь Ятсена, який хотів створити податок на володіння землею. «Єдиним засобом підтримки уряду є нескінченно справедливий, розумний і рівномірно розподілений податок, на якому ми заснуємо нашу нову систему»."
 CHI_expand_the_academica_sinica_desc:0 "Багато століть Китай йшов попереду всього світу в галузі наук та мистецтв. Збільшення фінансування наших університетів — перший крок до повернення колишньої величі."
 CHI_expand_the_chinese_academy_of_sciences:0 "Заснувати Китайську академію наук"
 CHI_expel_the_occupiers_desc:0 "$PRC_expel_the_occupiers_desc$"
 CHI_fighter_purchases_desc:0 "Нашим ВПС необхідні сучасні винищувачі, здатні протидіяти іноземним загрозам. Наша власна промисловість поки що не здатна їх виробляти, тому залишаються лише закупівлі з-за кордону."
 CHI_formalize_field_promotions:0 "Формалізувати польові підвищення"
 CHI_formalize_field_promotions_desc:0 "В ідеальному світі ми мали б повністю навчену та освічену армію. Але це не той світ. У нашому нинішньому скрутному становищі пріоритетом є доставка військ на фронт, і чим швидше ми зможемо це зробити, тим краще. Ми створимо програму для пошуку тих серед звичайних солдатів, хто зможе повести своїх товаришів уперед."
 CHI_free_hospitals_desc:0 "Великій нації не належить кидати хворих громадян напризволяще. Ми створимо масштабну систему лікарень і цим підвищимо загальний рівень здоров'я серед населення — і народ нас підтримає."
 CHI_from_many_to_one_faction_tt:0 "Додасть §G+20.0%§! $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$, якщо виконання маніфесту альянсу низьке. \nДодасть §G-10.0%§! $MODIFIER_AUTONOMY_GAIN_WARSCORE$, якщо виконання маніфесту альянсу високе."
 CHI_fund_the_marine_corp_desc:0 "Наші армії величезні, і їхню міць не можна ставити під сумнів, але вони можуть бути тупим інструментом при неправильному використанні. Спеціалізований корпус професійної морської піхоти, навчений захищати наші берегові лінії, вартував би вдесятеро більше за їхню чисельність у звичайних військах, і коли настане час, спроєктує нашу силу на моря."
 CHI_grow_the_coal_industry_desc:0 "Вугілля живить наші фабрики, потяги та печі. Щоб продовжувати живити націю, одночасно нарощуючи нашу економічну міць, нам потрібно знайти нові джерела енергії. Національна ресурсна комісія визначила кілька джерел, які ми повинні розробити."
 CHI_gung_ho_idea_fake_ns:0 "$CHI_gung_ho_idea$"
 CHI_he_yingqin:0 "Хе Їнцінь"
 CHI_heavy_tank_artillery_equipment_3_short:0 "PLZ 43 D"
 CHI_import_fertilisers_desc:0 "Хоча внутрішнє виробництво вирішує проблеми залежності, імітація когось іншого — це лише зайвий крок. Якщо ми налагодимо замовлення з інших місць, ми зможемо зосередитися на наших власних сильних сторонах."
 CHI_industrial_evacuations_from_state:0 "Евакуація промисловості з області [FROM.GetName]"
 CHI_infiltrated_state_2:0 "Засновані місцеві відділення"
 CHI_infiltration_not_detected:0 "Жодного §Hпроникнення§! не виявлено в цій області:\n"
 CHI_invite_foreign_experts:0 "Запросити іноземних експертів"
 CHI_invite_foreign_experts_desc:0 "Минуле століття показало, що наші технічні знання відставали від знань жителів Заходу. Хоча це було нам на шкоду, зараз ми в змозі скористатися їхніми знаннями і розвивати нашу економіку швидше, ніж будь-коли."
 CHI_invite_the_flying_tigers_desc:0 "Наші американські друзі створили підрозділ пілотів-добровольців та закупили сучасні літаки, щоб підтримати нас. Потрібно лише схвалити цей план."
 CHI_judicial_yuan:0 "Судовий Юань"
 CHI_labor_reform:0 "Реформа праці"
 CHI_ledo_road_desc:0 "Однієї Бірманської дороги недостатньо. Потрібно шукати нові способи отримувати військове постачання."
 CHI_liberate_the_peoples_of_asia_desc:0 "Як і в минулі століття, решта Азії дивиться на нас у пошуках керівництва, і ми відповімо. Ми допоможемо їм повстати проти імперіалістів і знайти власну свободу, помстившись за своїх братів."
 CHI_local_bomber_production:0 "Місцеве виробництво бомбардувальників"
 CHI_minquan_focus_desc:0 "Подорож, розпочата доктором Сунь Ятсеном, зрештою призведе до єдиної республіки. Без сумніву, це буде довга подорож, але ми долаємо її крок за кроком. Першим кроком було б запровадження принципу Міньцюань (Народвладдя) і забезпечення поширення права голосу на всіх громадян Китаю."
 CHI_modify_illicit_trade_tt:0 "Змінює §Y$CHI_illicit_trade$§!:"
 CHI_naval_separate_defense_plan_desc:0 "Чень Шаокуань запропонував так званий «Окремий план морської оборони», який передбачає будівництво щонайменше дванадцяти авіаносців протягом наступних 30 років. Якщо ми хочемо убезпечити наші моря, ми повинні підтримати цю ідею і почати виробництво авіаносного флоту з максимальною швидкістю!"
 CHI_ncns_request_handover_of_coastal_cities:0 "$CHI_request_handover_of_coastal_cities$"
 CHI_neglected_countryside_fake_ns:0 "$CHI_neglected_countryside$"
 CHI_one_china_policy:0 "Політика одного Китаю"
 CHI_operation_zet_hidden:0 "$CHI_facilitate_operation_zet$"
 CHI_overlordship_over_indochina_desc:0 "З давніх-давен Індокитай потребував захисту Китаю. Те, як швидко він опинився під владою Франції, — зайвий доказ нездатності постояти за себе."
 CHI_political_advisors_in_every_division:0 "Політичні радники в кожній дивізії"
 CHI_press_warlord_to_become_puppet_upgrade_with_affirm_civilian_primacy:0 "$CHI_press_warlord_to_become_puppet$"
 CHI_promote_admiral_desc:0 "Наші нещодавні зусилля з військово-морського будівництва врешті-решт зроблять наші старі військові кораблі 19-го століття застарілими. Однак це дає можливість перетворити їх на навчальні судна як для екіпажу, так і для командирів, з навчальною програмою, оптимізованою під стратегічний напрямок нашого флоту."
 CHI_protracted_warfare:0 "Затяжна війна"
 CHI_put_an_end_to_PRC_desc:0 "Що справді стоїть на нашому шляху до об'єднання всього Китаю, так це ті набридливі комуністи, що засіли в горах на чолі з [PRC.GetLeader]. Доки вони існують, не буде єдиного Китаю. Внутрішні вороги роблять нас слабкими, слабкість запрошує іноземну агресію, а іноземна агресія ставить під загрозу наш суверенітет. Тому наш обов'язок — покласти край [PRC.GetNameDef]!"
 CHI_reach_out_for_help:0 "Звернутися по допомогу"
 CHI_refugee_resettlement_desc:0 "Мільйонам біженців, які залишилися без дому, треба жити. Давши їм притулок на своїй території, ми отримаємо нову робочу силу для економіки та нових призовників."
 CHI_retake_coastal_cities:0 "Повернути прибережні міста"
 CHI_rocaf:0 "Зміцнити Націоналістичні ВПС"
 CHI_sea_army_reform:0 "$CHI_army_reform$"
 CHI_sea_communist_administrators:0 "$CHI_communist_administrators$"
 CHI_sea_democracy:0 "$CHI_democracy$"
 CHI_sea_develop_capital_desc:0 "Без промислової бази ми ніколи не зможемо утримати наші позиції. Тому ми повинні інвестувати в нашу столицю."
 CHI_sea_develop_the_hanyan_arsenal_desc:0 "$CHI_develop_the_hanyan_arsenal_desc$"
 CHI_sea_forced_loans_desc:0 "$CHI_forced_loans_desc$"
 CHI_sea_imperial_legacy_desc:0 "$CHI_imperial_legacy_desc$"
 CHI_sea_judicial_yuan_desc:0 "$CHI_judicial_yuan_desc$"
 CHI_sea_opposition_desc:0 "$CHI_opposition_desc$"
 CHI_sea_overlordship_over_indochina_desc:0 "$CHI_overlordship_over_indochina_desc$"
 CHI_sea_provoke_border_clashes_desc:0 "$CHI_provoke_border_clashes_desc$"
 CHI_sea_rural_reconstruction_movement_desc:0 "$CHI_rural_reconstruction_movement_desc$"
 CHI_secure_the_soviet_border_desc:0 "Російський ведмідь був скалкою в нашому боці, втручаючись у наші справи занадто довго. Ми повинні убезпечити наш північний фронт, встановивши офіційні відносини з [SOV.GetNameDef], і, можливо, отримати від них щось більше."
 CHI_seek_japanese_support:0 "Шукати японську підтримку"
 CHI_shanghai_arsenal:0 "Shanghai Arsenal"
 CHI_state_aa:0 "Щит проти неба"
 CHI_technological_cooperation_desc:0 "Співпраця з центральним урядом відкриє нам доступ до всіх нових технологій, розроблених центром."
 CHI_the_hanoi_route_tt:0 "\n [?CHI_the_hanoi_route_support_equipment|Y0] од. $support_equipment$"
 CHI_three_principles_of_the_people:0 "Три народні принципи"
 CHI_tsr_deepen_our_collaboration_desc:0 "Під керівництвом Японської імперії ми досягли великих успіхів у боротьбі проти наших загарбників. Ми повинні прагнути поглибити нашу співпрацю з ними, щоб гарантувати реалізацію нашої мети — об'єднаної Азії."
 CHI_tsr_five_races_under_one_union:0 "П'ять рас у єдиному союзі"
 CHI_tsr_legacy_of_the_hongxian_emperor_desc:0 "Юань Шикай, можливо, залишив країну в жахливому стані, повному варлордства та республіканського запалу, але його наміри були добрими. Тому він прийняв титул імператора Хунсянь, щоб дарувати нації Конституційний достаток, і став її Захисником. Якщо хтось і гідний пошани, то це він, і ми повинні докласти зусиль, щоб відродити його спадщину, поки вона не забута часом."
 CHI_tsr_pan_asianism_desc:0 "Для нас природно прийняти ідеали паназіатизму, оскільки ми є братнім народом японців, і Сунь Ятсен колись постановив, що азійські нації повинні об'єднатися, щоб вигнати колонізаторів. Ця війна — це боротьба не лише в Китаї, а й масштабніша боротьба, спрямована на вигнанні західників з нашої нації."
 CHI_tsr_son_of_heaven_2:0 "$CHI_tsr_son_of_heaven$"
 CHI_whampoa_military_academy_desc:0 "Без гідних командирів армія не має сенсу. Щоб мати першокласні збройні сили, ми маємо подбати про наявність навчених офіцерів, які готові їх очолити."
 CHI_xiao_yisu:0 "Сяо Їсу"
 CHL_a_grand_armada_desc:0 "Подібно до Великої Іспанської імперії, з якої ми були створені, Карлос Ібаньєс дель Кампо мріє про велику армаду, достатньо потужну, щоби кинути виклик британському королівському флоту, американському та німецькому флоту відкритих морів одночасно, і нехай так воно і буде!"
 CHL_an_empire_on_the_pacific_desc:0 "Тепер, коли наша золота доба справді розпочалася, настав час розширити наші горизонти та поглянути на захід. Ми створимо велику імперію, яка охопить весь Тихий океан!"
 CHL_arm_resistance_decision_desc:0 "Озброїти бійців спротиву в цій області."
 CHL_claims_patagonia:0 "Заявили права на Патагонію"
 CHL_communist_but_democratic_party_long:0 "Демократично-комуністична партія"
 CHL_contract_efe:0 "Домовитися з EFE"
 CHL_demand_the_guayanas_desc:0 "Ґвіана була окупована іншими силами занадто довго. Регіон, який колись претендував на Ельдорадо, може не мати його в реальності, але він має багато інших багатств, багатств, які ми відчайдушно хочемо мати для себе."
 CHL_democratic_volunteer_corps_desc:0 "Де б авторитаризм не наважився підняти свою потворну голову, наші солдати стоятимуть гордо, готові викорінити його за першої ж нагоди."
 CHL_development_inwards_desc:0 "Нашою політикою має бути не втручатися у світові справи, а розвивати країну зсередини, не надто покладаючись на експорт."
 CHL_elena_caffarena:0 "Елена Каффарена"
 CHL_embargo_strategies_desc:0 "Існує більше способів підтримати наших друзів-демократів, аніж просто посилати солдатів воювати, і час довів, що економічні заходи можуть бути не менш потужними. Ось чому ми мусимо ввести ембарго проти ворогів наших друзів, щоби позбавити їх міді та нітратів, необхідних їм для ведення війни."
 CHL_empowered_preparations_department_desc:0 "Відділ підготовки нацистів наразі є пріоритетним у партії, і група готується до державного перевороту проти ліберального уряду."
 CHL_enlarge_the_textile_industries_desc:0 "Текстиль завжди вироблявся здебільшого всередині країни, і так має бути і сьогодні. Держава мусить субсидіювати відкриття нових текстильних виробництв, а також намагатися налагодити торговельні шляхи з країнами-однодумцями."
 CHL_expand_the_department_of_provinces_change_tt:0 "Попередньо отриманий §Yнаціональний дух§! буде змінено з трішки різними ефектами в залежності від того, який §Yдепартамент§! ми раніше зміцнили."
 CHL_expand_the_forestry_decision_tt:0 "Будуть відкриті рішення §YРозширити лісівництво§! в областях §Y[950.GetName]§! та §Y[279.GetName]§!.\n"
