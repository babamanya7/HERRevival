 SWE_bofors_anti_tank_gun_desc:0 "Досвід Bofors у створенні зброї виявився незамінним. З певними інвестиціями вони могли б створити нове покоління протитанкових гармат, щоб протистояти найдобре броньованій техніці, яку можуть запропонувати нам противники."
