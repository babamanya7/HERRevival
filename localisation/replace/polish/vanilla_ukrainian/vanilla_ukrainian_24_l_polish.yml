 WW_hungary.106.a:0 "Вони пошкодують про своє рішення!"
 WW_hungary.114.t:0 "Референдум про приєднання до [HUN.GetAdjective] держави"
 WW_hungary.3.t:0 "Смерть прем'єр-міністра Дюли Ґьомбьоша"
 WW_hungary.36.desc:0 "Великий і благородний [FROM.GetLeader] з [FROM.GetNameDef] погодився створити новий військовий альянс, зміцнивши вже існуючі зв’язки між нашими державами. Народ вийшов на вулиці святкувати цю історичну подію — початок нової ери для [ROOT.GetAdjective] держави!"
 WW_hungary.61.desc:0 "[FROM.GetNameDefCap] призначив Марію Хосефу Софію де Ітурбіде новою королевою нашої нації. Це безсумнівно зміцнить наш режим."
 WW_hungary.8.a:0 "Нам потрібна будь-яка допомога..."
 WW_hungary.89.desc:0 "[FROM.GetLeader] із [FROM.GetNameDef] відмовив нам у вступі до їхнього союзу, тим самим закривши шлях до співпраці в найближчому майбутньому. Ми змушені шукати інші альянси або діяти самостійно."
 WW_hungary.93.desc:0 "Хоч це й не стало несподіванкою, нерозумний [FROM.GetLeader] із [FROM.GetNameDef] привів армію в бойову готовність після отримання нашої пропозиції й надіслав посланника із заявою, що «Румунія — це Румунія!»"
 WW_hungary.94.a:0 "Бела Кун має повернутися до влади"
 WW_hungary.94.c:0 "Міхай Каройї має очолити нас"
