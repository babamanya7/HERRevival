l_polish:
 330_non_monarchist_name:0 "Іх Хурее"
 4128_autenticite_name:0 "Ілебо"
 5117_autenticite_name:0 "Кіншаса"
 AAT_Sweden.14.a_tt:0 "§YУ кінці війни [NOR.GetNameDef] попросить нас повернути їхню землю.§!"
 AAT_Sweden.20.a:0 "Значить, війна."
 AAT_Sweden.20.t:0 "[SWE.GetNameDefCap] відмовляється повертати Нарвік"
 AAT_Sweden.24.desc:0 "Держава [FROM.GetName] поки що відмовилася прийняти нас до свого альянсу. Вони висловили побоювання, що розширення альянсу може призвести до ще більшого конфлікту. Наразі схоже, що ми залишилися самі по собі."
 AAT_Sweden.27.desc:0 "Після того, як наша коаліція захопила область [?146.GetName], втрати Червоної армії були настільки нищівними, що Москва була змушена переглянути свою агресію. Вони погодилися на білий мир і обіцяють більше не претендувати на територію. І в Стокгольмі, і в Гельсінкі люди радіють. Хто би сподівався, що Червоний Ведмідь зроблений з паперу?"
 AAT_Sweden.34.desc:0 "[FROM.GetAdjectiveCap]ий посол повідомив нам, що [SWE.GetAdjective]ий уряд уважає, що, оскільки міжнародний порядок переосмислюється, [THIS.GetAdjective]ий уряд більше не може належним чином захищати свої заморські території. Якщо [THIS.GetName] не може належним чином захищати свої території, її уряд повинен передати їх тому, хто може це зробити; і [FROM.GetName] буде кращим вибором."
 AAT_Sweden.35.desc:0 "Держава [FROM.GetName] покірно вирішила передати нам свої автономні території. Це, безумовно, псує наші відносини з державою [FROM.GetName], але в довгостроковій перспективі це не матиме значення, оскільки досить скоро вони будуть зметені в нашу сферу."
 AAT_Sweden.51.t:0 "[FROM.GetName] прогинається"
 AAT_Sweden.52.t:0 "$AAT_Sweden.49.t$"
 AAT_Sweden_BoP.12.c:0 "Ми слабкі і вразливі, ми маємо бути краще підготовлені до війни."
 AAT_Sweden_communism.5.b:0 "«Відсторонити» їх від влади."
 AAT_Sweden_communism__7_tt_1:0 "Це зблизить нас із союзниками"
 AAT_Sweden_flashpoints.10.a:0 "Світ мусить почути про цей акт агресії."
 AAT_Sweden_flashpoints.38.t:0 "[SWE.GetName] завдає превентивного удару"
 AAT_Sweden_flashpoints.43.a:0 "Вони де-факто під нашим контролем."
 AAT_Sweden_flashpoints.73.a:0 "Ми не маємо наміру віддавати їх."
 AAT_Sweden_flashpoints.79.desc:0 "[FIN.GetName] надсилає нам дипломатичне «ні» у відповідь на нашу вимогу щодо Оландських островів."
 AAT_Sweden_nationalists.1.t:0 "[SWE.GetAdjective]і Націонал-соціалісти вимагають втручання"
 AAT_Sweden_nationalists.15.t:0 "Селяни залишаються вірними"
 AAT_Sweden_nationalists.18.desc:0 "Королівський візит короля до провинції [FROM.FROM.GetName] дуже сприяв зростанню популярності монарха. Радісні прихильники вишикувалися на вулицях, розмахуючи [SWE.GetAdjective]ими прапорами, кидаючи квіти попереду короля. Були й недоброзичливці, але місцева поліція тримала їх подалі від процесії."
 AAT_Sweden_nationalists.21.a:0 "Наші впливи зростають."
 AAT_finland_continuation_war.05.t:0 "[FROM.GetAdjective]а війна з Союзом"
 AAT_finland_continuation_war.12.t:0 "[FIN.GetName] бажає перейти на іншу сторону"
 AAT_finland_misc_events.01.a:0 "Врятуйте наших дітей!"
 AAT_finland_misc_events.02.a:0 "Ми всі повинні чимось жертвувати в такі непрості часи, хоч би який безглуздий вигляд це мало."
 AAT_finland_misc_events.05.desc:0 "Чудові новини! Кілька промислових підприємств спільними зусиллями інвестували гроші, обладнання та фахівців у [FROM.GetAdjective]ий видобувний сектор, і ці інвестиції почали приносити дивіденди у вигляді прав на видобуток. Ми отримали у своє розпорядження частину видобувних ресурсів області [?FROM.FIN_state_given_for_resource_rights.GetName].\n\nПотрібно якнайшвидше пустити їх у справу!"
 AAT_finland_motti.01.desc:0 "[FROM.GetAdjective]і війська почали використовувати тактику motti в області [FROM.FROM.GetName]. У рамках цієї тактики [FROM.GetAdjective]і війська оточують загони супротивника і відрізають їх від ліній постачання, роблячи вразливими для [FROM.GetAdjective]их атак. Якщо ми хочемо прорватися до Фінляндії, потрібно терміново перешкодити їхнім маневрам."
 AAT_finland_political.08.b:0 "Маннергейм ще потрібен на посаді!"
 AAT_finland_winter_war.06.a:0 "У нас немає іншого вибору, окрім як визнати поразку..."
 AAT_germany.2.t:0 "[FROM.GetName] відхиляє нашу угоду"
 AAT_nordic_cooperation.7.a:0 "Справедлива угода."
 AAT_nordic_cooperation.7.b:0 "Виглядає підозріло."
 AAT_nordic_shared.1.a:0 "Тісне співробітництво — ось шлях до виживання."
 AAT_norway.13.desc:0 "Поки ми були зайняті розвитком нашої економіки та пильним наглядом за фашистами за кордоном, ми дозволили внутрішньому фашизму гноїтися прямо у нас під носом. Незважаючи на те, що база його підтримки зменшується, а його партія, «Національна єдність», так і не отримала жодного місця в Стортинґу, Відкун Квіслінґ сформував [?NOR.NOR_cw_fascist_attacker.GetAdjective]ий уряд за [?NOR.NOR_cw_fascist_attacker.GetAdjective]ої підтримки та стверджує, що захопив важелі влади в державі [ROOT.GetNonIdeologyName]."
 AAT_norway.20.desc:0 "Перебуваючи в гостях у своєї сім'ї в Англії, вона трагічно померла від серцевої недостатності уві сні.\n\nПервісно титулована принцеса Уельська Мод, королева-консорт Норвеґії, пережила не тільки короля Гокона і принца Олава, які вже на шляху до Англії, але і всіх норвежців, оскільки її любили в усьому королівстві."
 AAT_norway_fascist.6.desc:0 "Представники [FROM.GetAdjective]ої фашистської партії принесли нам жахливі новини. Держава [FROM.GetNameDefCap] відхилила наші благання про допомогу.\n\nЦе означає, що ми залишилися наодинці в наших пошуках фашистського режиму, контрольованого нами в Норвеґії."
 AAT_norway_monarchist.3.a:0 "Скрутні часи вимагають нестандартних заходів."
 AAT_norway_news.2.t:0 "Мод, королева Норвеґії, померла"
 ABDA_events.5.desc:0 "[FROM.GetNameDef] надіслала нам запрошення приєднатися до Американсько-Британсько-Голландсько-Австралійського командування. ABDACOM вже зарекомендував себе як верховний координаційний орган союзних військ на Тихоокеанському театрі, об'єднавши флоти та армії основних союзних держав під єдиним командуванням. Членство приведе наші збройні сили до цієї єдиної структури з доступом до спільної розвідки, узгодженої доктрини та всієї ваги підтримки союзників. Ми повинні вирішити."
 ABK_fascism_party_long:0 "Абхазький ультраорфодоксальний союз"
 ABORT_DISMANTLE_PROJECT_POPUP_TITLE:0 "Скасувати демонтаж"
 AFA_ITA_fascism_subject:0 "Губернаторство Аусса"
 AFG_against_kabul_desc:0 "Король Захір та його дядьки є узурпаторами трону, їхній нелегітимний режим має бути повалений за будь-яку ціну."
 AFG_communism_DEF:0 "Демократична республіка Афганістан"
 AFG_development_in_uzb:0 "Розвивати Узбекистан"
 AFG_expand_state_education_desc:0 "TODO"
 AFG_expand_telegraph_network_desc:0 "[ROOT.GetNonIdeologyName] відстала від своїх сусідів за безліччю економічних показників. Першим кроком до модернізації нашої економіки є покращення зв'язку між нашими містами та нашими сусідами шляхом розширення телеграфної мережі."
 AFG_expand_the_kings_powerbase_desc:0 "Молодий король Захір-шах — це лише символічна фігура для народу. Тим часом дядьки короля обіймають найпотужніші урядові посади. Однак король все більше розчаровується в їхньому застарілому мисленні та бажає створити підтримку для більш прогресивного режиму."
 AFG_fascist_graduates_desc:0 "$AFG_communist_graduates_desc$"
 AFG_ghulam_muhammad_ghobar:0 "Гулам Мухаммад Гобар"
 AFG_hares_muzafar:0 "Гарес Музафар"
 AFG_industrial_events.35.a:0 "Ми не можемо дозволити цьому загостритися далі."
 AFG_industrial_events.35.t:0 "[FROM.GetNameDefCap] відхиляє договір про воду"
 AFG_industrial_events.55.t:0 "[FROM.GetNameDefCap] погрожує війною"
 AFG_integrate_tajik_and_uzbek_republics:0 "Захисник Центральної Азії"
 AFG_invite_waziristan_rebels_desc:0 "Повстанці Факіра Іпі та його ополчення Лашкар наразі беруть участь у активних бойових діях проти [RAJ.GetAdjective] влади у їхніх Північно-Західних провінціях. Ми повинні допомогти їм перетнути наші кордони та почати створювати для них базу влади в наших східних регіонах, щоб вони одного дня могли повернутися до Вазиристану сильнішими, ніж будь-коли раніше."
 AFG_liberator_of_persia:0 "Визволитель Персії"
 AFG_mohammad_zahir_shah_ns_upgrade_1_desc:0 "$AFG_mohammad_zahir_shah_ns_desc$"
 AFG_naval_academy_tt:0 "Вербує §Yдвох§! випадкових §YАдміралів§!"
 AFG_naval_organization:0 "Афганські верфі"
 AFG_pashtun_domination:0 "Домінування пуштунів"
 AFG_placeholder_1_desc:0 "У нас немає любові до [ENG.GetAdjective] або [SOU.GetAdjective]s після століть ворожнечі та конфліктів між нами. Однак зростання [GER.GetName] дає нам можливість отримати більш однодумного міжнародного партнера."
 AFG_political_events.10.b:0 "Ми вже скинули одного гнобителя і не потребуємо іншого."
 AFG_political_events.112.a:0 "Варто було спробувати."
 AFG_political_events.160.t:0 "[FROM.GetNameDefCap] погоджується підтримати нас"
 AFG_political_events.60.b:0 "Хто вони такі, щоб говорити від імені [ROOT.GetAdjective] народу?"
 AFG_political_events.86.t:0 "[FROM.GetNameDefCap] погоджується на Пакт"
 AFG_political_events_110_desc_durand:0 "Уряд [FROM.GetNameDef] запросив низку наших територій уздовж їхнього кордону. Вони стверджують, що ці землі по праву повинні належати їм, і доводять, що нинішні кордони несправедливо розділяють їхній народ та територію."
 AFG_privatize_factories_desc:0 "TODO"
 AFG_promote_the_counter_elite_tt:0 "Наступні радники стануть доступними для найму:"
 AFG_salang_pass_desc:0 "Гірська місцевість [ROOT.GetNonIdeologyName] ускладнює розвиток зручних транспортних маршрутів по всій країні. Однак [SOU.GetAdjective] інженери вважають, що можуть побудувати тунель через гори в Саланзі. Їхній уряд запропонував здійснити будівництво в обмін на деякі стратегічні поступки."
 AFG_second_empire_fascism_ADJ:0 "Афганськ"
 AFG_second_empire_fascism_DEF:0 "Друга Афганська імперія"
 AFG_secure_army_support_desc:0 "У збройних силах залишається низка офіцерів, які були призначені або служили під керівництвом $AFG_amunullah_khan$. За допомогою правильних стимулів їх можна примусити підтримати його повернення на трон."
 AFG_socialist_coup_desc:0 "Зі зникненням консервативних обмежень на політичну думку, відкрилася скринька Пандори, і націю охопила хвиля антимонархічних настроїв. Настав час змести це застаріле королівство та започаткувати сучасну соціалістичну державу."
 AFG_support_weapons2:0 "Lewis Mk. III DEMS & SBML two-inch mortar"
 AFG_support_weapons4:0 "Bren Mk. III & ML 4.2 inch Mortar"
 AFG_timurid_bureaucracy_desc:0 "Вкорінена у спадщині Тимура, Тимуридська бюрократія є зразком ефективного управління та централізованого контролю. Відновлення цієї системи зміцнить адміністрацію Емірату, забезпечуючи стабільність та процвітання на його великих територіях."
 AIRBASE_CAPACITY_OK:0 "Ця авіабаза повністю працездатна.\n§gПеревищення межі працездатності може вплинути на пропускну здатність літаків і зменшити ефективність завдань.§!"
 AIRBASE_CAPACITY_RIGHT:0 "/ $MAX$"
 AIRWING_MISSION_EFFICIENCY:0 "§TЕфективність завдання: $AMOUNT|H1%$.§!"
 AIRWING_MISSION_WING_STATUS_RAID:0 "§Tпризначено до нальоту§!"
