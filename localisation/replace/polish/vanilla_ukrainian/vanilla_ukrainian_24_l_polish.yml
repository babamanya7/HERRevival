 DEN_adds_units_to_brigade_tt:0 "Додає підрозділи до шаблону §YDanske Brigade§! у §Y[DEN.GetNameDef]§!"
 DEN_ask_for_weapons:0 "Запит на постачання зброї"
 DEN_bombefly_desc:0 "Єдиний спосіб зберегти [DEN.GetNameDef] у повній безпеці — це можливість бомбардування та знищення промислових потужностей нашого ворога."
 DEN_bop_occupation_allow_communism_desc:0 "Наші комуністичні володарі не сприймають того факту, що ми заборонили їхню ідеологію в [ROOT.GetNameDef]. У наших інтересах було б знову дозволити комунізм."
 DEN_bop_occupation_ban_elections_desc:0 "Ми повинні заспокоїти наших [?DEN.DEN_overlord_nation.GetAdjective]их господарів, заборонивши вільні вибори"
 DEN_bop_occupation_ban_fascism_desc:0 "Наші [?DEN.DEN_overlord_nation.GetAdjective]і господарі бачать, що перебувають у стані війни з самою фашистською ідеологією, і ще більше цінуватимуть нашу подальшу співпрацю, якщо ми заборонимо всі фашистські організації в нашій країні."
 DEN_bop_unban_all_political_uniforms:0 "£BoP_right_texticon Дозволити всю політичну форму"
