 JAP_zaibatsus:0 "Дзайбацу"
 JUNO_brazil_events.137.b.tt:0 "§RЦе дасть їм ціль війни проти нас!§!"
 JUNO_brazil_events.137.desc:0 "Ми отримали досить рішуче сформульоване повідомлення від [BRA.GetNameDef]. Вони вимагають, щоб ми звільнили [BRA_country_to_be_liberated.GetNameDef] та повернули території їхнім законним власникам."
 JUNO_brazil_events.140.t:0 "Дипломатія ягуара"
 JUNO_brazil_events.150.t:0 "Канґасу проводить операцію"
 JUNO_brazil_events.16.desc:0 "Наші обговорення з урядом [USA.GetName] виявилися успішними. Ми дійшли згоди, що [BRA.GetNameDef] отримає економічну допомогу від [USA.GetName] в обмін на постачання їм ресурсів та зобов'язання приєднатися до війни, коли наші військові будуть здатні."
 JUNO_brazil_events.162.desc:0 "[FROM.GetAdjective] дипломати повідомили нам, що їхній уряд не дозволить своїм корпораціям створювати філії в [ROOT.GetNonIdeologyName] у найближчому майбутньому. Вони посилаються на занепокоєння щодо прав інтелектуальної власності та потенційної можливості викриття військових секретів ворожим націям."
 JUNO_brazil_events.18.b:0 "Ми не будемо проливати [BRA.GetAdjective] кров за [FROM.GetNameDef]."
 JUNO_brazil_events.191.t:0 "[FROM.GetNameDefCap] забороняє монархічний рух"
 JUNO_brazil_events.33.a:0 "У них було мало іншого вибору, окрім як поступитися нам."
 JUNO_brazil_events.34.desc:0 "Уряд [FROM.GetName] відмовився передати нам право власності на свої території в Гвіанах, після наших нещодавніх вимог. Тепер ми повинні вирішити, чи виконувати нашу загрозу та забирати територію силою, чи прийняти дипломатичний удар, відступивши."
 JUNO_brazil_events.35.desc:0 "Незважаючи на їхню войовничу риторику щодо нашої землі в Гвіанах, здається, [BRA.GetAdjective] готовність насправді йти з нами на війну не матеріалізувалася. Дипломати з [BRA.GetNameDef] повідомили нам, що вони будуть прагнути альтернативних засобів для отримання території, але робитимуть це мирним шляхом. Принаймні, поки що."
 JUNO_brazil_events.50.t:0 "[FROM.GetNameDefCap] пропонує членство в Mercosul"
 JUNO_brazil_events.51.desc:0 "Після тривалих переговорів та консультацій уряд [FROM.GetNameDef] нарешті погодився приєднатися до Mercosul. Відтепер ми будемо співпрацювати у питаннях економічної та зовнішньої політики для забезпечення миру та процвітання в регіоні."
