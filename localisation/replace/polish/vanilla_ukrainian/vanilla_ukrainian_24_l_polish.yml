 MEX_focus_international_struggle_desc:0 "Ми не самотні у своїй боротьбі проти наших ідеологічних ворогів. У нас є багато можливих союзників за кордоном, з якими ми можемо спілкуватися. Ми повинні допомогти їм захопити владу, щоби створити величезний блок можливих союзників, які у свою чергу допомагатимуть нам."
 MEX_focus_northern_steel_plants:0 "Північні металурігйні заводи"
 MEX_focus_oil_field_expansion:0 "Розширення нафтових родовищ"
 MEX_focus_revolutionary_women_desc:0 "Жінки, які традиційно асоціювалися з домашньою роботою, десятиліттями виконували промислову роботу в Мексиці. Тютюнова, кавова та швейна промисловість, як правило, наймає більшість жінок, хоча це спричинило тертя з профспілковим рухом, де домінують чоловіки. Чоловіки вже мають право на рівну оплату за рівну працю та мінімальну заробітну плату — ми повинні забезпечити це право і для жінок."
 MEX_focus_triumph_over_the_cristeros_desc:0 "Багато талановитих людей піднялися на вершину під час кампаній проти Крістеро. Боротьба з повстанцями тактикою невеликих підрозділів і підтримкою з повітря дала нашим генералам чудову нагоду перевірити свої здібності. Кампанія репресій також показала, хто не гидував більш брудною роботою."
