 SOV_the_threat_from_the_land_of_the_rising_sun_desc:0 "Зрозуміло, що Японія хоче панувати в Китаї. Досягнувши цього, вона, без сумніву, поверне на північ, щоб захопити величезні ресурси Сибіру. Поки вони зайняті в Китаї, вони вважатимуть за краще не виступати проти нас, і тому ми мусимо запевнитися, що війна в Китаї триватиме, допоки ми не будемо готові кинути виклик японцям."
 SOV_third_five_year_plan_dynamic_modifier_alt:0 "Новий проєкт національної індустріалізації"
 SOV_training_activities_curtailed:0 "Тренувальна діяльність згорнута"
 SOV_transport_plane_equipment_2:0 "Ли-2"
 SOV_ultimatum_to_greece_thrace:0 "Змусили Грецію віддати Фракію"
 SOV_undermine_stalins_authority_desc:0 "Єдине, що втримує Сталіна при владі — це страх людей перед ним і тим, що він може зробити. Ми ще не можемо повністю усунути страх людей, але ми можемо зменшити здатність Сталіна завдавати шкоди іншим. Якщо все піде дуже добре, ми можемо навіть ізолювати його до такої міри, що він знову стане лише однією людиною."
 SOV_war_with_germany_desc:0 "Німецька загроза продовжує наростати. Ми можемо і мусимо знищити німецьку армію і змусити її схилитися перед новими володарями."
 SOV_wreckers_sabotage_dockyards:0 "Саботувати ворожі верфі"
 SOV_young_builders_of_communism_desc:0 "Ми будуємо соціалізм не для сучасних дорослих, ми будуємо його для дітей і поколінь, які ще не народилися. Їх потрібно навчити вдосконалювати та розвивати наші досягнення, щоб вони могли завершити розпочату нами роботу."
 SPANISH_SUPPORTED:0 "Так"
 SPA_bolster_offensive_infrastructure:0 "Укріпити наступальну інфраструктуру"
 SPA_claim_the_aragonese_possessions_desc:0 "Королівство Арагон колись простягалося далеко й широко в Середземному морі. Іспанія, як історичний продовжувач Арагонського королівства, по праву заслуговує на повернення цих територій під її контроль. Ми будемо відстоювати це право."
 SPA_claim_west_africa:0 "Претензії на Західну Африку"
 SPA_expand_influence_in_the_valencia_garrison:0 "Розширити вплив на гарнізон у Валенсії"
 SPA_expand_the_war_industry:0 "Розширити військову промисловість"
 SPA_fascist_crackdown_mission_desc:0 "Від самого початку громадянської війни наші «союзники»-фалангісти відтіснили нас на узбіччя. Вони чітко дали зрозуміти, що їхнє бачення майбутнього Іспанії несумісне з баченням майбутнього законного карлістського королівства, і вони, безсумнівно, планують повністю придушити наш вплив будь-якими можливими способами. Ми мусимо бути готові захищати наші ідеали силою, якщо вони не залишать нам вибору."
 SPA_light_tank_artillery_equipment_2:0 "Verdeja 75mm"
