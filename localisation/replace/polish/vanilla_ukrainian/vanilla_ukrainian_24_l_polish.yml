 CZE_protect_neutrality:0 "Захистити нейтралітет"
 CZE_reintegrate_cross_border_rail_connections_desc:0 "Покращення залізничного сполучення з нашими сусідами — це хороший спосіб здобути їхню прихильність. Особливо, якщо ми намагаємося розвивати економічні зв'язки між нашими країнами."
 CZE_revisit_custom_union_talks_tt:0 "Ми все одно зможемо переконати їх приєднатися іншими §Rметодами§!."
 CZE_rudolf_bechyne:0 "Рудолф Бехинє"
 CZE_second_sudetenland_fortification_program_desc:0 "Судетська область, наш гірський кордон із Німеччиною, є ідеальним місцем для прикордонних укріплень. Вивчивши французьку лінію Мажино, ми можемо побудувати власну подібну лінію."
