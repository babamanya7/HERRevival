 congo_independence_struggle.11.d:0 "Згідно з угодою з [BEL.GetName], сьогодні ми розпочали будівництво нового урядового будинку для розміщення парламенту домініону. Наступним кроком буде початок процесу написання нашої конституції і проведення перших виборів. З цих скромних початків ми можемо почати формувати політичну ідентичність цієї нації."
 congo_independence_struggle.12.b:0 "Ми повинні відступити, заморська територія — це не так погано."
 congo_independence_struggle.23.b:0 "Це неприйнятно, ми вимагаємо повної незалежності!"
 congo_independence_struggle.8.d:0 "[BEL.GetName] здається, вважає, що ми не здатні забрати незалежність силою, і вони викликали нашу рішучість. Вони запропонували нам «можливість» стати заморським департаментом, фактично зробивши нас розширенням їхньої нації з правом на громадянство, але без автономії, щоб формувати своє майбутнє. Вони можуть бути праві, що ми не маємо військової сили для того, щоб протистояти цьому, однак вибір врешті решт за нами."
