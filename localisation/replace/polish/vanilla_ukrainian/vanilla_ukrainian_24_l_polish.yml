 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_GIVESTATECONTROL:0 "\nДержава $COUNTRY|Y$ §Gприйняла§! нашу пропозицію передати їй контроль над однією з окупованих областей.\n\nТепер вони керують нею."
