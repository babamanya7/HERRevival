 JAP_protect_the_manchurians_desc:0 "Маньчжури все ще перебувають під гнітом залишків нашої старої Квантунської армії. Ми повинні прибрати за собою і рушити на звільнення людей. Настав час завершити боротьбу і звести рахунки з Імператорською армією!"
 JAP_raid_an_artillery_depot_decision:0 "Рейд на артилерійський склад"
 JAP_rikken_seiyukai_victory_desc:0 "Результати виборів вирішено. Ліберально-консервативна партія Ріккен Сейюкай здобула переконливу перемогу і, схоже, матиме чітку більшість надалі. Схоже, народ вирішив, у якому напрямку він хоче бачити рух країни."
 JAP_sea_establish_the_northern_resource_area:0 "Створення Північної ресурсної зони"
 JAP_sea_establish_the_northern_resource_area_desc:0 "Тепер, коли ми успішно окупували північ, багаті сибірські пустища мають бути використані для потреб нашої військової машини, що постійно зростає. У зв'язку з цим ми повинні закласти нові шахти та планові міста у життєво важливих місцях, щоб видобути все, що тільки можливо."
 JAP_sea_greater_east_asian_co_properity_sphere_2_tt:0 "Відкриває рішення §Y«Встановити маріонеткові режими»§! по всій Південно-Східній Азії"
 JAP_sea_heavier_naval_guns:0 "Важчі морські гармати"
 JAP_sea_jet_prototypes_desc:0 "Майбутнє авіації не за пропелерами. Ми повинні звернути увагу на реактивну тягу для покращення можливостей наших літаків. Наші інженери назвали проєкт зі створення цього нового експериментального літака «Імперська зброя Nº 2», а модель отримала назву «Кікка»."
 JAP_seek_yakuza_support_desc:0 "Є багато груп, які мають велику владу в тіні, вони контролюють і впливають на дії як політиків, так і генералів. Ми повинні спробувати укласти союз із цими групами і переконати їх працювати разом з нами, щоб гарантувати, що військові не доб'ються свого."
 JAP_sent_back_genrikh_lyushkov_opm:0 "Відіслано Генріха Люшкова"
 JAP_shinkansen_in_operation_idea:0 "Сінкансен в дії"
 JAP_shogunate_neutrality:0 "Японський шьоґунат"
 JAP_spread_revolutionary_flames_to_south_asia_tt:0 "Розблоковує рішення для запрошення §Yкомуністичних південноазійських§! націй до нашого альянсу"
 JAP_support_weapons:0 "Type 3 Heavy Machine Gun & Type 11 mortar"
 JAP_support_weapons2:0 "Type 11 LMG & Type 10 grenade discharger"
 JAP_supremacy_of_the_battlefleet_desc:0 "Потужні лінійні кораблі здатні вирішити результати війни на морі одним рішучим ударом. Потрібно оптимізувати наш лінійний флот, щоби забезпечити можливість нанести подібний удар."
 JAP_sway_the_navy_moderates:0 "Схилити на свій бік поміркованих з флоту"
 JAP_temporary_construction_bonus_idea:0 "Швидке промислове розширення"
 JAP_the_art_of_warfare:0 "Мистецтво війни"
 JAP_the_footsteps_of_jimmu:0 "Слідами Джімму"
 JAP_the_peoples_state_decisions:0 "Антимілітаристська боротьба"
 JAP_the_spirit_of_the_ikko_ikki_desc:0 "Мілітаристські буддисти школи Джьодо Шіншю в нашому минулому довели світові, що наших монахів слід боятися в бою, а завдяки їхній вірі мережа храмів дозволяла більш ефективно та дієво мобілізувати війська за потреби. Ми повинні вірно відродити дух цих буддійських воїнів, крокуючи до Чистої Землі!"
 JAP_the_ultimate_tank_tt:0 "\nПісля дослідження технології §Y$super_heavy_tank_chassis$§!:\n"
 JAP_tomoyuki_yamashita:0 "Томоюкі Ямашіта"
 JAP_utilize_ainu_expertise:0 "Використати досвід айнів"
 JAP_wrestle_mongolia_from_the_soviets_desc:0 "Монґоли перебувають під п'ятою росіян уже багато років і прагнуть можливості віддалитися від європейців. Ми можемо надати їм таку можливість і повинні запросити їх до Інтернаціоналу. Однак це може загострити напруженість у відносинах із §Y[SOV.GetNameDef]§!."
