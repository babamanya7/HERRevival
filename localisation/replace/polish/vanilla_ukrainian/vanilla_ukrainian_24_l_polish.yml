 INDUSTRIAL_ORG_DETAIL_TRAIT_POINTS_DELAYED:0 "Бали рис використовуються для відімкнення рис для Вашої §Yвійськово-промислової організації§!. Їх можна отримати, зібравши достатньо §Yкоштів§! шляхом завершення §Yдосліджень§! або призначенням до §Yвиробничої лінії§!."
