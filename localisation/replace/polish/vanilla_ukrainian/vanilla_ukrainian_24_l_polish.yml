 BUL_anti_capitalism_desc:0 "[GetAntiCapitalismFocusLoc]"
 BUL_appeal_to_european_capitalists_desc:0 "[ROOT.GetNameDef] потребує нового вливання капіталу, щоби стимулювати розвиток національної промисловості та переглядати борги з великими транснаціональними компаніями, які вже інвестували в країну."
 BUL_appoint_right_wing_ministers_desc:0 "Царський режим, хоча й допомагає у здійсненні твердого контролю над країною, не має жодних реальних цілей, щоби поліпшити становище Болгарії на міжнародній арені. Ми мусимо скористатися авторитарним характером нинішньої системи, щоби призначити нових міністрів, які готові здійснити політичні та соціальні зміни, яких Болгарія дійсно потребує."
