 JAP_fortify_the_border:0 "Зміцнити кордон"
 JAP_fukumotoism_desc:0 "Фукумото Кадзуо наголошував на необхідності теоретичної та політичної боротьби радикальної авангардної партії, яка б вливала марксистську свідомість у робітників ззовні через теоретичну боротьбу, щоб перетворити рух на політичну боротьбу. Впровадивши це в наше управління, ми зможемо встановити кращий спосіб достукатися до нашого народу і поширювати серед нього будь-які ідеї, які ми побажаємо."
 JAP_generic_mio_trait_high_velocity_guns:0 "Надійні бронебійні підривники"
