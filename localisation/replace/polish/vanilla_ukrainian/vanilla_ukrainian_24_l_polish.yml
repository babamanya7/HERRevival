 SHIP_REPAIR_PROGRESS:0 "Ремонт: $PROGRESS|Y%1$"
 SHOW_INTEL_LEDGER:0 "Показати зведення по розвідданих, щоби переглянути розвіддані по інших країнах, які у вас є."
 SHX_CAS_equipment_1_short:0 "Vultee V-11"
