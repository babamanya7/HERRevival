 MTG_naval_treaties_desc:0 "Щоб обмежити витрати та уникнути ще однієї руйнівної гонки озброєнь, великі морські держави світу підписали кілька угод, що обмежують загальний розмір їх флотів та розмір кожного корабля окремо. Оскільки ми теж підписали ці угоди, нам доведеться дотримуватися певних обмежень, і поки їх дотримуються і наші опоненти, баланс сил має залишатися незмінним.\n\nЗараз ми знаходимося [GetStrengthRatioBritain] [GetRelevantNavalTreatyNation] за кількістю основних кораблів."
 MTG_naval_treaty.3.t:0 "[From.GetNameDefCap] виходить із переговорів"
 MUN_czech.1004.d:0 "До [ROOT.capital.GetCapitalVictoryPointName] надійшли новини про те, що [FROM.GetAdjective]і війська просуваються до [HUN.GetAdjective]ого кордону. Хоча [HUN.GetAdjective]і представники, безсумнівно, незабаром зв'яжуться з нами, ми повинні вже зараз вирішити, чи варто нам допомогти [HUN.GetNameDef] і здобути потенційного союзника, чи дозволити [FROM.GetNameDef] продовжувати свої нинішні плани."
