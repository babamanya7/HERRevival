 SPA_secure_the_northern_garrisons:0 "Забезпечити вірність північних гарнізонів"
 SPA_sin_paquito_desc:0 "Уряд, боячися його ймовірної невірності, надіслав Франсіско Франко командувати військами на Канарських островах. Однак, попри наші запрошення, він також не пообіцяв нам свою підтримку, і лише затримує нас своєю нерішучістю. Якщо «Міс Канарські острови 1936 року» не наважиться приєднатися до нас, ми просто продовжимобез нього."
 SPA_stamp_out_the_maquis_desc:0 "Макі, залишки наших ворогів, постійно вели партизанську війну, намагаючись оскаржити наш контроль над материковою Іспанією. З часом їхній вплив зменшився, і тепер настав час викорінити їх раз і назавжди."
