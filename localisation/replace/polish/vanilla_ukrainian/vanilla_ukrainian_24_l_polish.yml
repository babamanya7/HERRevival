 mtg_britain.1.a:0 "Наполягти на королівському шлюбі."
 mtg_britain.109.d:0 "У світлі останніх подій бірманці оголосили про свою незалежність. Вони вважають, що ми зараз зайняті Пакистаном і не зможемо нічого вдіяти з ними."
 mtg_britain.13.d:0 "Королю Едуарду нарешті вдалося переконати уряд дозволити йому виступити з промовою по радіо, проілюструвавши те, що він називає «своєю версією історії». Він висловив сподівання, що це дозволить народу краще зрозуміти, чому він вважає, що повинен діяти саме так."
 mtg_britain.17.d:0 "У прагненні надати нам незалежність [ENG.GetNameDef] заявляє, що продовжить керувати нами під час цього переходу. Ми зможемо покладатися на підтримку Великої Британії, доки міцно не встанемо на ноги."
 mtg_britain.28.t:0 "[From.GetName] приймає пропозицію вступити до альянсу"
 mtg_britain.51.a:0 "Як недоречно."
 mtg_britain.53.t:0 "[From.GetName] задовольняє прохання"
 mtg_britain.64.a:0 "Залишається сподіватися, що це не надто вплине на народ."
 mtg_britain.64.t:0 "[From.GetName] веде пропаганду"
 mtg_britain.67.a:0 "Побачимо, чи довго вони протримаються."
 mtg_britain.73.a:0 "Ми не можемо їм дозволити ось так відокремитися!"
 mtg_britain.76.t:0 "Громадянська війна в Пакистані"
 mtg_britain.79.d:0 "[From.GetNameDefCap] просить надати право проходу по нашій території, щоби напасти на ворога, державу [SOV.GetNameDef]. Вони вимагають від нас беззаперечного підпорядкування та широкого контролю над урядом. Якщо ми не підкоримося, то, за їхніми словами, у них не залишається іншого вибору, крім як провести свої війська по нашій землі без нашого схвалення..."
 mtg_britain.80.a:0 "Добре. А тепер крізь Кавказ до Сталінграду!"
 mtg_britain.92.d:0 "[From.GetAdjective] лідери особливо наголосили на важливості внутрішнього промислового потенціалу. Вони бажають, щоби ми збільшили урядові інвестиції в цей сектор."
 mtg_exile_government.3.a:0 "Ми згодні."
 mtg_exile_government.5.title:0 "[From.GetName] відхиляє пропозицію про інтеграцію флоту"
 mtg_germany.3.t:0 "Держава [From.GetName] відмовляється підкоритися"
 mtg_landing_craft:0 "$landing_craft$"
 mtg_netherlands.33.d:0 "[From.GetNameDefCap] приймає нашу пропозицію скласти спільний план оборони"
 mtg_netherlands.4.d:0 "[HOL.GetAdjective] уряд попросив нас взяти під свій захист Кюрасао. До цього під приводом «захисту» звернулися венесуельці, і тепер вони турбуються з приводу можливих ворожих дій у випадку, якщо вони відхилять таку [VEN.GetAdjective]у «пропозицію»."
 mtg_netherlands.45.d:0 "Схоже, принц Бернард виявився замішаним в одному малоприємному скандалі. Його волелюбний характер, який іноді виявляється справжнім благословенням, може й завдавати занепокоєння... Уряд тепер змушений витратити цінні ресурси, щоб урятувати репутацію принца в суспільстві."
 mtg_netherlands.59.a:0 "Це турбує... Будемо сподіватися, що скандал не отримає продовження."
 mtg_netherlands.64.t:0 "Проєкт «Зьойдерзее» стимулює розвиток інфраструктури"
 mtg_netherlands.7.b:0 "Ні. Вони й самі можуть розробити свої кораблі."
 mtg_netherlands.77.a:0 "Чудова думка! Інакше нам не вистояти."
 mtg_netherlands.77.d:0 "[From.GetAdjectiveCap]ий уряд звернувся до нашого уряду з пропозицією об'єднати країни Бенілюксу в одну державу. Він стверджує, що майбутні потрясіння вимагають ближчої співпраці та єдності наших народів — такого, якого можна досягти лише через повне Якщо ми приймемо цю пропозицію, почнуться приготування до негайної відмови від суверенітету на користь нової наднаціональної держави під [From.GetAdjective] управлінням."
 mtg_news.16.desc:0 "У своїй сьогоднішній публічній заяві новий [From.GetAdjective]ий прем'єр-міністр [From.GetLeader] оголошує про намір нового уряду уникнути курсу умиротворення, старанно підтримуваного попередниками. [From.GetLeader] ясно дає зрозуміти, що мета держави [From.GetNameDef] — «зупинити марш тиранії скрізь, де тільки вона підніме свою потворну голову». Поки неясно, чи зупинить загрозу війни прагнення певних націй до експансії, але в державі [From.GetNameDef] вже на повну силу розгорнуті програми з вербування, що надає сили цьому виступу."
 mtg_news.18.b:0 "Вони йдуть за нами."
 mtg_news.2.c:0 "Ось що відбувається, коли надто довго ігнорують фашистів."
 mtg_news.22.desc:0 "[ENG.GetAdjective] і [GER.GetAdjective] уряди уклали пакт про невтручання та відмову від агресії, а також висловили намір «поважати сфери інтересів один одного». Мало кого дивує такий стан справ після того, як держава [GER.GetNameDef] ясно позначила останнім часом свою про[ENG.GetAdjective] позицію, але критики закликають замислитися про те, що це може означати для Європи."
 mtg_news.23.b:0 "Побачимо, чи зможуть вони уникнути громадянської війни."
 mtg_news.34.desc:0 "Так званим «милосердним» рішенням [ENG.GetAdjective] королівську сім'ю вигнали з країни. Представники уряду і самої королівської сім'ї ніяк не прокоментували ситуацію. Сьогодні королівська родина прибула в державу [From.GetNameDef], де їй на її прохання було надано притулок."
 mtg_news.36.c:0 "Серед червоних назріває новий розкол."
 mtg_news.4.a:0 "Битимось з ними там, щоби не боротися з ними тут."
 mtg_news.43.a:0 "Ми повернемо єдність нашої нації!"
 mtg_news.55.a:0 "Він не прагнув влади, але все ж таки зможе добре послужити країні."
 mtg_news.58.a:0 "Це крок до повної перемоги."
 mtg_usa_civil_war_democrats.14.a:0 "А що ще чекати від цих комуністів-зрадників?"
 mtg_usa_civil_war_democrats.26.a:0 "Це стратегічно важливі території."
 mtg_usa_civil_war_democrats.28.desc:0 "Після численних демонстрацій на підтримку Бостонського уряду губернатори Невади, Арізони, Юти, Нью-Мексико та Колорадо оголосили надзвичайний стан. У деяких випадках загони поліції та Національної гвардії в з собою вбитих та поранених."
 mtg_usa_foreign_support.15.b:0 "Це буде марна трата грошей"
 mtg_usa_north_american_dominion.3.b:0 "Можливо, він має рацію."
 mtg_usa_protect_south_america.3.desc:0 "Делегація держави [From.GetNameDef] поспішно залишила самміт і попрямувала додому. [From.GetAdjective] посол досі відмовляється прокоментувати цей крок, стверджуючи, що поки що чекає розпоряджень."
 mtg_usa_southern_threat.3.b:0 "В даний час війна не в наших інтересах."
 nationalism_focus_desc:0 "Наша держава унікальна, і всі наші політичні здобутки можливі лише тут. Ми мусимо відстоювати це за будь-яку ціну."
 nav_bomber_bonus:0 "Бонус до моделей морських бомбардувальників"
 naval_base_gen:0 "морської бази"
 naval_critical_score_chance_factor_tt:0 " $MODIFIER_NAVAL_CRITICAL_SCORE_CHANCE_FACTOR$: $RIGHT|+=%1$"
 naval_wargames_spirit_desc:0 "Теоретичне тактичне тренування зберігає життя та пальне."
 neutrality:0 "Нейтралітет"
 news.100.d:0 "Німецька армія, що вторглася в державу [POL.GetNameDef], захопила Варшаву.\n\nВ окремих районах ще продовжуються бої, але організованого опору в місті більше не існує.\n\nСтверджується, що польський уряд евакуювався, коли перші німецькі частини увійшли до передмістя, і його місцезнаходження невідоме.\n\nПоляки продовжують боротися із загарбниками, проте втрата столиці серйозно підірве бойовий дух."
 news.125.d:0 "Після тривалих масованих бомбардувань місто Калкутта в Індії було взято японською армією. Хоча епізодичні бої ще якийсь час тривали у передмісті, парад перемоги був організований і пройшов на Чауринґгі-авеню.\n\nСолдати індійської національної армії, створеної японцями під гаслом звільнення Індії від британського панування, взяли участь у параді, що викликало тріумфування натовпу. Можна припустити, що за падінням Калкутти невдовзі вся Індія опиниться у руках японців."
 news.141.d:0 "Рим, Вічне місто, було взято радянськими штурмовиками. Італійські війська відступили, і радянські увійшли до міста, де швидко придушили осередки опору. Історичні будівлі залишилися цілими, хоча, за деякими даними, Пантеон міг постраждати від кулеметного вогню.\n\nСРСР поки що дотримуються нейтралітету Святого престолу, але їхні війська взяли Ватикан у кільце, що не може не нервувати Його Святість."
 news.15.a:0 "Подивимося, як довго це триватиме."
 news.155.a:0 "Це може бути початком нової Великої війни"
 news.156.a.tt:0 "Ваза впала.\n"
 news.159.d_03:0 "Навіть держава [From.GetName], відома упевненістю у власних силах і у своїй перевазі, вважає за можливе вступати в союзи з тими країнами, яких вона поважає. [From.GetLeader] оголосив сьогодні, що було підписано остаточні угоди про створення військової коаліції під назвою [From.GetFactionName], куди увійдуть лише гідні держави, чиє призначення — досягти величі.\n\nЧи стане джерелом цієї величі ідеальне суспільство або розширення своїх кордонів спільними зусиллями — решта світу дізнається про це, коли стане занадто пізно."
 news.176.d:0 "Сьогодні британський парламент несподіваним рішенням відкинув пропозицію об'єднатися в альянс, як цього хоче [FRA.GetName]. Причина відмови — небажання розхитувати і без того крихкий баланс сил на європейському континенті.\n\nФранцузький уряд уже назвав це рішення політичним ходом, заявивши, що Британія жертвує безпекою Франції заради своїх інтересів."
 news.182.c:0 "Європейська дипломатія перебудовується вздовж осі Париж–Берлін."
 news.187.d:0 "Оскільки [GRE.GetName], як стверджує [ITA.GetName], є спадкоємцем одної з найдавніших держав Європи, між обома країнами існує історичний зв'язок.\n\nПолітичні прагнення зрозумілі: держава [ITA.GetName] вважає, що [GRE.GetName] — ідеальний кандидат на вступ до альянсу [ITA.GetFactionName].\n\nПобачимо, чи зможуть захід і схід знову об'єднатися після півтори тисячі років роз'єднання."
 news.19.b:0 "Німці мають стати єдиною нацією."
 news.19.c:0 "Якби ми могли чинити спротив..."
 news.193.d:0 "[From.GetName] оголошує про відкриття постійної дипломатичної місії у державі [YUG.GetName], розуміючи, що вона різко відреагує на проблему італомовного населення Далмації. Як говорить заява [From.GetAdjective]ого міністерства закордонних справ, дві країни нерозривно пов'язані спільними історією та інтересами, а порозуміння значно важливіше, ніж малозначна прикордонна суперечка.\n\nНапруженість в Європі наростає, і варто сподіватися, що інші країни підуть за цим прикладом."
 news.198.c:0 "Це був їхній ультиматум. Греція мусить підготуватися до війни."
 news.207.d_not_fascism:0 "[USA.GetLeader] сьогодні виступив з публічною промовою проти того, що він назвав «найбільшою небезпекою для людської цивілізації» — комунізму.\n\nНе тільки [USA.GetNameDef] буде проводити захисну політику, щоб запобігти поширенню світового соціалізму в Америці, але й [USA.GetAdjective] має на меті знищити саме серце комунізму.\n\nНапруженість у відносинах досягла небувало високого рівня, і достатньо однієї іскри, щоб спалахнуло полум'я війни між [SOV.GetNameDef] та [USA.GetNameDef].."
 news.207.t:0 "[USA.GetNameDefCap] засуджує Комінтерн"
 news.209.a:0 "Було б нерозумно загрожувати нашим володінням"
 news.216.b:0 "Ми підтримуємо державу [TUR.GetName]."
 news.217.b:0 "[GER.GetNameDefCap] наживає все більше ворогів."
 news.218.a:0 "Я лише хотів банан."
 news.220.c:0 "Вони розсипаються зсередини!"
 news.229.c:0 "Це, ймовірно, закінчиться збройним конфліктом."
 news.231.a:0 "Злісні імперіалістичні загарбники!"
 news.238.t:0 "[AST.GetNameDefCap] бере на себе відповідальність за колонії"
 news.244.b:0 "Нашим подвір'ям не будуть керувати європейці!"
 news.246.d:0 "Після певного часу співпраці через Об'єднану раду оборони між [USA.GetNameDef] та [CAN.GetNameDef] виникло нове політичне партнерство. Програма, що отримала назву [CAN.GetFactionName], має на меті просувати інтереси Північної Америки у всіх міжнародних справах, включаючи всі питання оборони і військових дій.\n\nПоки [CAN.GetNameDef] все ще відкриває своє постколоніальне «я», а [USA.GetAdjective]і політики практично воюють один з одним через ізоляціоністську та інтервенціоністську політику, новостворений альянс може запропонувати обом країнам зовнішньополітичний напрямок, якого їм так бракує."
 news.247.t:0 "[CAN.GetNameDefCap] приєднується до [GER.GetAdjective]ого альянсу!"
 news.252.t:0 "[CAN.GetNameDefCap] приєднується до альянсу [GER.GetFactionName]!"
 news.262.b:0 "До цього давно йшло."
 news.263.b:0 "Без коментарів."
 news.263.t:0 "Антироялістські бунти в державі [SAF.GetNameDef]"
 news.273.b:0 "Нарешті."
 news.281.desc:0 "У спільній заяві [ENG.GetAdjective]ий міністр закордонних справ разом з [SOV.GetAdjective]им послом оголосили, що Індії буде негайно надано повний суверенітет над її власними справами. Не зовсім зрозуміло, яку роль відіграв [SOV.GetNameDef] у цій раптовій зміні політики [ENG.GetAdjective], але, схоже, значну.\n\nОдним з перших кроків нового індійського керівництва було оголошення про тіснішу співпрацю з [SOV.GetNameDef], що надало додаткової ваги чуткам про те, що [SOV.GetNameDef] втрутився від їхнього імені."
 news.285.b:0 "Свобода!"
 news.292.desc:0 "За наполяганням угорців Австрія провела референдум щодо можливого возз'єднання двох націй під короною Габсбурґів. Остаточний підрахунок голосів майже завершено, але вже зараз зрозуміло, що це переконлива перемога прихильників возз'єднання. Було багато повідомлень про невідповідності, підтасовування результатів голосування і фальсифікацію виборів, але австрійські чиновники відкинули ці звинувачення і вже почали реформувати адміністрацію в регіональний уряд угорської держави.\n\nХоча угорська громадськість щиро вітає цей крок, політичні наслідки референдуму, ймовірно, будуть гостро відчуватися в усій Європі."
 news.294.a:0 "Що таке кілька смертей для імперії?"
 news.295.a:0 "Наче фенікс із попелу."
 news.297.desc:0 "Шукаючи короля для своєї нації, угорці, після довгих переговорів і підготовки, на початку цього тижня офіційно запросили німця Фрідріха Франца, Великого герцога Мекленбурґ-Шверина. Сьогодні, під звуки фанфар і урочистостей, він був коронований королем Угорщини на урочистій церемонії в Королівському палаці в Будапешті.\n\nЧлен СС з 1931 року, ідеологічні погляди нового короля добре відомі, і він вже заявив, що «принесе Угорщині велич, на яку вона заслуговує, незалежно від того, якою буде ціна». Разом з обіцянкою короля «виправити несправедливість, що сталася з нами в минулому», малоймовірно, що ця коронація призведе до послаблення напруженості в регіоні."
 news.297.t:0 "Фрідріх Франц приймає угорську корону"
 news.298.desc:0 "У публічній декларації [HUN.GetLeader] відмовився від договору, нав'язаного союзними державами після Великої війни. Підписаний [HUN.GetAdjective]ою владою під протестом у 1920 році, він значно зменшив розмір країни і обмежив чисельність її збройних сил.\n\nУ своїй промові [HUN.GetLeader] вже натякнув, що Угорщина може незабаром знову заявити про свої претензії на території, відібрані у неї два десятиліття тому."
 news.304.t:0 "[From.GetName] повертає Південну Словаччину"
 news.305.desc:0 "Дипломатичні переговори зірвалися, і сьогодні держава [From.From.GetName] публічно відхилила [HUN.GetAdjective]і вимоги щодо повернення Південної Словаччини. Обурені [HUN.GetAdjective]і чиновники вже засудили [From.From.GetAdjective]ий уряд, заявивши, що він «дестабілізує регіон» своєю наполегливістю дотримуватися «незаконних договорів». Обидві країни, схоже, готуються до війни, яка може спалахнути будь-якої миті."
 news.306.a:0 "Марш до Великої Угорщини продовжується."
 news.319.desc:0 "Незважаючи на ультиматум і загрозу негайних військових дій із боку Румунії у разі відмови, Болгарія відхилила вимоги Румунії. Остання відмовилася відступати, і обидві країни, схоже, перебувають на чіткому шляху до військового конфлікту."
 news.320.b:0 "Приходьте і забирайте!"
 news.321.a:0 "Ми маємо подякувати друзям."
 news.333.a:0 "Ми робили те, що мали робити."
 news.350.a:0 "Це може бути небезпечно."
 news.350.t:0 "Мирне возз'єднання держави [ROOT.GetNameDef]"
 news.36.e:0 "Це порушує Версальський договір!"
 news.41.d:0 "Льва Троцького знайшли мертвим сьогодні у його номері в готелі Буенос-Айреса. Він був задушений альпіністською стропою. Охоронці Троцького затримали вбивцю на виході з будівлі. Хоча він був португальським націоналістом, є докази його роботи на ГРУ. Схоже, Сталін нарешті завдав смертельного удару своєму давньому супернику."
 news.41.t:0 "Смерть Троцького"
 news.58.e:0 "Німці не наважилися б зараз атакувати... так?"
 news.61.d:0 "Німецькі війська вторглися до Богемії та Моравії з метою підтримання порядку після падіння чеського уряду.\n\nУ Празі окупаційні сили заявили про створення «автономного протекторату» держави [GER.GetNameDef]. Угорські війська за підтримки німців захопили Словаччину та приєднали її до Угорщини.\n\nЧехословаччини більше не існує."
 news.65.a:0 "Добре для Іспанії."
 night_fighting_spirit:0 "Нічні бої"
 north_american_alliance:0 "Північноамериканський альянс"
 nsb_news.2.desc.com:0 "Сьогодні Польща отримала владу над Ліберією! З 1932 року Ліберія вважала Польщу головним інвестиційним партнером і вірила, що у неї практично немає колоніальних амбіцій, проте ця угода фактично зробила Ліберію польською маріонеткою.\n\n США не згодні з таким рішенням: вони вважають ліберійську незалежність основним національним принципом.\n\n[POL.GetLeader] стверджує, що це лише заходи захисту Ліберії від можливих колонізаторів, але багатьом таке пояснення здається непереконливим."
