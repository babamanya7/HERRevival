 PHI_pilot_training_programme_desc:0 "Пілоти є надзвичайно важливим ресурсом, і ми маємо значний їх дефіцит, враховуючи поганий стан нашої авіаційної промисловості. Ми повинні укласти угоди з іншими країнами, щоб дозволити підготовку нашої молоді до цієї професії підкорювачів неба."
