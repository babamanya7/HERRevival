 JAP_medium_tank_artillery_equipment_3:0 "Type 4 Ha-To"
 JAP_mobilize_the_proletariat_desc:0 "Робітники добре справляються зі своєю роботою, старанно забезпечуючи зброєю наших військових, але відчайдушні часи вимагають відчайдушних заходів. Настав час підвищити виробничі квоти, навіть якщо лише тимчасово, щоб армія могла отримати всю необхідну зброю."
 JAP_modern_bombers:0 "Сучасні бомбардувальники"
