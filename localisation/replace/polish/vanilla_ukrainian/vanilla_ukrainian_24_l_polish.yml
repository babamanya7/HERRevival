 NO_RAILWAY_ACCESS_STANDING_COOLDOWN:0 "Військова частина не може рухатися, оскільки знаходиться в провінції з неконвертованими залізницями. Конверсія буде завершена через $DAYS$ дн."
 NO_SAFE_RAILWAY_ACCESS:0 "Військова частина не може ввійти в провінцію з ворожими військами."
 NSB_Soviet_fascist_civil_war.003.desc:0 "У Росії знову вибухнула громадянська війна. $SOV_grigory_semyonov$, який проживав тут після втечі від червоних, вирішив знову залишити державу [ROOT.GetName], щоби приєднатися до боротьби з комуністами в державі [SOV.GetNameDef]."
 NSB_Soviet_fascist_civil_war.003.t:0 "$SOV_grigory_semyonov$ і [ROOT.GetName] більше не разом."
 NSB_poland_communist_events.302.a:0 "Чудово."
 NSB_poland_communist_events.401.a:0 "Неминуча жертва."
 NSB_poland_communist_events.602.a:0 "Чудово."
 NSB_poland_democratic_events.1.desc:0 "Тепер, коли уряд позбавлений санаціоністів, залишається питання: хто має очолити нову Польську селянську партію? Зараз цю роль виконує найревніший захисник селянства — Станіслав Міколайчик, але не можна забувати, що перемога в громадянській війні була б неможлива без підтримки Фронту Морж.\n\nФронт Морж, який представляє генералів, які виступають за відновлення у Польщі вільних виборів, віддає перевагу колишньому прем'єр-міністру Польщі Вінцентію Вітосу. цієї посади Міколайчика може змусити багатьох селян, які билися на фронті за нашу демократичну справу, відчути себе безправними та відданими партією."
 NSB_poland_events.202.desc:0 "Лідери [From.GetAdjective] уряди оголосили, що не вважають, що [Root.GetLeader] має право претендувати на [From.GetAdjective] трон. Це означає, що більше немає жодного шансу на мирну анексію держави [From.GetNameDef], але завжди залишається військовий шлях."
 NSB_poland_events.202.t:0 "[From.GetNameDefCap] не вважає, що [Root.GetLeader] висуває претензію обґрунтовано"
 NSB_poland_events.6.a:0 "Прагматична пропозиція."
 NSB_poland_monarchist_events.5.b:0 "Краще війна, ніж бути [From.GetAdjective]ою маріонеткою."
 NSB_polish_fascist_events.101.t:0 "[From.GetNameDefCap] підписує пакт"
 NSB_soviet_civil_war_common.105.a:0 "Це погано."
 NSB_soviet_civil_war_common.117.desc:0 "Наші переговори з \"[FROM.GetAdjectiveCap]ий представниками не дали жодних конкретних результатів. [FROM.GetLeader] відкидає нашу пропозицію, і [FROM.GetName] не надасть нам жодної допомоги."
 NSB_soviet_civil_war_common.121.desc:0 "[FROM.GetLeader] відправив делегацію з проханням підтримати їх у боротьбі з державою [SOS.GetNameDef].\n[FROM.GetAdjective] уряд готовий запропонувати нам свій суверенітет в обмін на [ROOT.GetAdjective]у участь у війні."
 NSB_soviet_civil_war_common.124.desc:0 "Фабрики, побудовані в державі [?SOV_civil_war_start_state.GetName], готові до запуску. Це значно допоможе нам у війнах — як поточній, так і майбутніх."
 NSB_soviet_civil_war_common.125.t:0 "Дезертирство у військах супротивника"
 NSB_soviet_civil_war_common.128.t:0 "Безлади в державі [SOS.GetNameDef]"
 NSB_soviet_comecon.2.a:0 "Ми готові боротися разом з вами, товариші!"
 NSB_soviet_communist_civil_war.005.desc:0 "Революціонери з усього світу прибули, щоби боротися з ворогами істинної революції. Добровольці організуються в міжнародні бригади, які незабаром підуть війною на ворогів держави [ROOT.GetNameDef]."
 NSB_soviet_fascist_tsarist.11.a:0 "Вони, без сумніву, хочуть оскаржити нашу гегемонію."
 NSB_soviet_fascist_tsarist.26.a:0 "Відмінні новини, наш східний фланг тепер прикритий!"
 NSB_soviet_foreign_politics_events.150.a:0 "Дуже мудро."
 NSB_soviet_foreign_politics_events.152.c:0 "Підготувати вторгнення в державу [FROM.GetNameDef]!"
 NSB_soviet_foreign_politics_events.158.a:0 "Принаймні тепер [FROM.GetNameDef] буде співпрацювати."
 NSB_soviet_foreign_politics_events.20.t:0 "[FROM.GetNameDefCap] відправляє військових радників"
 NSB_soviet_foreign_politics_events.210.t:0 "Тиск із боку держави [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.250.desc:0 "До нас дійшов [FROM.GetAdjective] конвой із гвинтівками й іншим спорядженням. Поки неясно, коли зможе прибути новий конвой, так що доведеться обходитися тим, що є."
 NSB_soviet_foreign_politics_events.273.b:0 "Вони лише хочуть збільшити [FROM.GetAdjective] вплив на нашу країну."
 NSB_soviet_foreign_politics_events.280.desc:0 "Після нашої територіальної експансії на схід [FROM.GetAdjective] уряд продемонстрував інтерес до підтримки нашого зростання і допомоги в будівництві інфраструктури та військових укріплень на наших новонабутих територіях. регіоні [756.GetName], який, як зазначається, може стати ключовим у нашому військовому просуванні на схід."
 NSB_soviet_paranoia_system_events.23.t:0 "Кампанія проти саботажу"
 NSB_soviet_policies_of_collective_security.5.a:0 "Це не повинно стати на заваді договору."
 NSB_soviet_propaganda_capmaign_events.3.a:0 "Але ми не хотіли цієї війни!"
 NXM_PRC_communism_subject:0 "Провінція Нінся"
 NZL_battleship_2:0 "$ENG_battleship_2$"
 NZL_befriend_japan_desc:0 "Ми — тихоокеанська нація, і наші інтереси безпеки співпадають із прагненнями найсильнішої держави у регіоні. Японія та її могутній флот зможуть уберегти нас від решти світу."
 NZL_carrier_4_desc:0 "$ENG_carrier_4_desc$"
 NZL_cv_nav_bomber_equipment_1_short:0 "Shark"
 NZL_expand_the_university_of_auckland_desc:0 "Оклендський університет — один із головних навчальних закладів нашої країни. Розширивши його навчальну базу, ми зможемо утримати вдома наші найкращі уми."
