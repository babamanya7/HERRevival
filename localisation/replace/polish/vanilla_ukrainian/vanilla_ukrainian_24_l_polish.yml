 IRQ_political_events.16.t:0 "[FROM.GetNameDefCap] вимагає контролю над [455.GetName]"
 IRQ_political_events.17.desc:0 "[FROM.FROM.GetNonIdeologyName] намагається розширити свої обов'язки у [FROM.GetAdjective] сфері впливу, взявши на себе управління [ROOT.GetNameDef]. Якщо ми погодимося, ми більше не будемо безпосередньо підпорядковуватися [FROM.GetAdjective], але все одно не матимемо засобів для незалежних дій на світовій арені."
 IRQ_political_events.44.b:0 "$IRQ_political_events.40.b$"
