 GER_train_schutztruppe_in_nordlische_salomonen:0 "Мобілізувати Шуцтруппе на Північних Соломонових островах"
 GER_treaty_with_the_ussr_desc:0 "$GER_soviet_treaty_desc$"
 GER_uranverein:0 "Uranverein"
 GER_von_braun:0 "Вернер фон Браун"
 GIE_AIRWING_RECRUITMENT_LOCKED:0 "Держава $COUNTRY|H$ мусить накопичити $VALUE|0H$ §Hлегітимності§!, перш ніж закликати на службу авіакрила."
 GOE_IRQ_news.1.b:0 "Як відреагує [ENG.GetNameDef]?"
 GOE_RAJ.17.desc:0 "Рішучим кроком [RAJ.GetName] почала розміщувати війська на кордоні з [TIB.GetName], заявляючи про свій намір розширити свою зону безпеки для захисту своєї серцевини. Це категорично суперечить нашим інтересам у регіоні."
 GOE_RAJ.17.t:0 "[RAJ.GetName] виступає проти [TIB.GetName]"
 GOE_RAJ.21.desc:0 "Старий уряд під ярмом Імперіалістичної Британії капітулював, і його уряд втік з країни. Оскільки ми зміцнюємо контроль над субконтинентом, нам потрібно вирішити, як вчинити з нашими старими гнобителями."
 GOE_RAJ.22.desc:0 "Розгублена телеграма від лорда Лінлітгоу повідомила нам, що повстанці на чолі з [RAJ.GetLeader] взяли контроль над країною.\nЛінлітгоу прямує до країни з пропозицією білого миру від [RAJ.GetLeader] за умови, що ми відмовимося від усіх претензій на Індію."
 GOE_RAJ.22.t:0 "Британський Радж впав"
 GOE_RAJ.25.b:0 "Ми ще не закінчили"
 GOE_RAJ.39.desc:0 "У темному підвалі лідери профспілок погодилися зустрітися з нами, подалі від сторонніх очей уряду. Вони мають вплив на фермерів, фабричних робітників та продавців риби, на простий люд. Вони були б готові підтримати нас у наших зусиллях повалити нинішній уряд, але натомість вимагають деяких поступок."
 GOE_RAJ.50.a:0 "Гірка втрата"
 GOE_RAJ_eic.2.c:0 "Він має мати добрі зв'язки з урядом"
 GOE_RAJ_famine.2.desc:0 "Великий циклон, за яким послідували кілька штормів, вдарив по [?global.famine_state.GetName]. Хоча збитки значні, це має додатковий ефект поширення хвороби бурої плямистості на ширшій території, що ще більше посилює вплив грибка."
 GOE_RAJ_generals.5.desc:0 ""
 GOE_RAJ_navy.1.a:0 "Це принесе нам обом велику користь!"
 GOE_RAJ_navy.4.b:0 "Ми ні за яких обставин не погодимося на це!"
 GOE_RAJ_partition.8.t:0 "Ганді переживає спробу вбивства."
 GOE_RAJ_princely.1.desc:0 "Історична імперія Бабура була величезною та доброзичливою, і правила субконтинентом багато сотень років. На нас чекає багато роботи, якщо ми хочемо відповідати цій спадщині. Хоча багато нащадків династії Ґуркані вижили, лише один може привести нас до слави."
 GOE_form_country_pakistan_required_states_tt:0 "Контролює всі §Yпакистанські§! області"
 GOE_generic_events.5.desc:0 "Наші колишні гнобителі розлючені нашою декларацією незалежності і починають мобілізувати свої сили, щоб придушити нашу новознайдену свободу. Здається, наша незалежність не буде здобута без кровопролиття."
 GOE_generic_events_1_tt:0 "§RВішійська Франція може оголосити нам війну!§!"
 GRAVEYARD_OF_EMPIRES:0 "Graveyard of Empires"
 GRE_AUS_danubian_state_DEF:0 "Дунайська держава Греція"
 GRE_CAS_equipment_1_short:0 "EAF Atlas"
 GRE_MANPOWER_TOOLTIP:0 "Бонус до людських ресурсів"
 GRE_PETITION_FOR_AID_FOCUS_NAME_MONARCHIST:0 "Попросити Британію й Німеччину про допомогу!"
 GRE_a_land_of_mountains:0 "Земля гір"
 GRE_a_legacy_of_war_desc:0 "Війна у нас у крові. Ми воювали і з нами воювали з давніх-давен. За минулі століття ми чомусь навчилися, і нашій армії давно час перейняти все найкраще з нашого кривавого минулого."
 GRE_battleship_1:0 "Клас «Kilkis»"
 GRE_compromise_with_the_monarchists_focus_tt:0 "§YГеорг II§! відмовляється від свого безумовного впливу на державу та стає конституційним монархом.\n\n£faction_gre_monarchist §YМонархісти§! стануть §Gдружніми§!.\n£faction_gre_communist §YКомуністи§! стануть §Rворожими§!."
 GRE_cooperate_with_foreign_monopolies_desc:0 "Немає сенсу боротися з сильними цього світу. У цій битві нам не перемогти — вона лише повільно знищить Грецію. Замість того, щоби безтямно перти напролом, давайте запросимо монополії за стіл переговорів і домовимося про умови, вигідні для всіх сторін."
 GRE_damaskinos:0 "Дамаскінос"
 GRE_dem_monarchy_democratic:0 "Греція"
 GRE_dimitris_glinos:0 "Дімітріс Глінос"
 GRE_evripidis_bakirtris:0 "Евріпідіс Бакіртріс"
 GRE_extracting_more_from_our_soil_desc:0 "Греція — країна, багата на природні ресурси; потрібно лише рішуче їх витягти. Сучасні технології дають нам таку можливість — залишилося її реалізувати."
 GRE_fighter_equipment_3_short:0 "EAF Spitfire"
 GRE_four_year_plan:0 "Чотирирічний план"
 GRE_making_use_of_our_islands_desc:0 "Ми повернули собі дуже багато островів після загибелі Османської імперії, настільки ефективно вбитої Антантою, але відтоді ми ними майже не займалися. Крит давно вже є важливою частиною Греції, і саме там ми докладемо перших зусиль і поширимо їх на інші острови, щоб підвищити їхню стратегічну та матеріальну цінність для держави."
 GRE_mountain_training_effect:0 "Відкриє доступ до: §HПідготовка до війни в горах§!\n§HПіхота\n    Гори§!\n      Захист: §G+5%§!\n      Рух: §G+5%§!\n§HМорська піхота\n    Гори§!\n      Атака: §G+5%§!\n      Рух: §G+10%§!\n§HГірська піхота\n    Гори§!\n      Атака: §G+5%§!\n      Захист: §G+5%§!\n      Рух: §G+10%§!\n§HПовітряний десант\n    Гори§!\n      Атака: §G+5%§!\n      Рух: §G+10%§!\n"
 GRE_political_instability:0 "Політична нестабільність"
 GRE_prepare_for_the_great_anti_fascist_war_desc:0 "Фашизм — головна загроза марксизму. Наші ідеологічні розбіжності можна вирішити лише на полі бою. Радянський Союз не робить нічого, щоби зупинити поширення фашизму, тож цим доведеться зайнятися нам."
 GRE_ship_medium_battery_1:0 "23.4 cm/45 Armstrong H"
 GRE_ship_medium_battery_4:0 "20.3 cm/50 Auto-Load."
 GRE_sophistry_and_science_idea_desc:0 "Якщо ми зумієм підтримувати співзалежність політиків і вчених, то ще на крок наблизимося до сучасності."
 GRE_stage_an_incident_in_the_bosporus_desc:0 "Радянське Політбюро не приховує власного бажання контролювати Константинополь. Заручившись нашою допомогою, радянці вирішили зробити перші тверді кроки до взяття контролю над Босфорською протокою, і Греція має зіграти в цьому вирішальну роль..."
 GRE_the_metaxas_line:0 "Буде завершено початкову частину §Yлінії Метаксаса§! — лінії з наземних фортів, які захищають наші вразливі кордони.\n"
 GRE_ui_attitude_header:0 "Ставлення"
 GRE_underhanded_rogues:0 "Хитрі шахраї"
 GRE_utilize_british_capital_desc:0 "Зрозуміло, що британці більш ніж готові допомогти нам, оскільки наш король є їхнім вірним союзником. Нам слід скористатися цим фактом і попросити їхніх інвесторів допомогти у відновленні того, що було втрачено під час громадянської війни."
