 ICE_american_protection_desc_standard:0 "Наближається війна, а ми занадто малі, щоб бути самотніми. [USA.GetNameDefCap] може захистити нас. Ми повинні звернутися до уряду [USA.GetAdjective] і запропонувати їм розмістити тут війська для захисту Ісландії. Це буде кроком назад на нашому шляху до незалежності, але це буде лише тимчасовим відступом. Було б гірше, якби нас захопили."
