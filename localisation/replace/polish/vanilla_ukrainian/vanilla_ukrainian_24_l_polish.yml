 HOL_continue_the_war_in_batavia_desc:0 "Вторгнення, якого ми боялися, відбулося, і нашу оборону було зведено вбік. Уряду вдалося втекти, і він зараз перебуває у вигнанні, прийнятому нашими союзниками. Хоча наша королева хотіла б, щоб уряд залишався у вигнанні та «близько до дій» у Європі, ми вважаємо, що настав час переїхати до Ост-Індії, а звідти продовжити війну як суверенна держава."
 HOL_dirk_jan_de_geer:0 "Дірк Ян де Геер"
