 ENG_a_s_warfare_desc:0 "Атлантика — це наша «дорога життя», і ми мусимо забезпечити її чистоту від ворогів, які полюватимуть на наші вразливі судна, будь то над поверхнею чи під нею. Ми зосередимося на передових розробках у галузі протичовнової боротьби, гарантуючи, що наші кораблі супроводу будуть оснащені найкращим озброєнням і засобами виявлення, які ми можемо надати."
