 HOL_philips_focus_desc:0 "«Philips» уже давно є лідером ринку радіоприймачів та іншої електроніки. Можливо, уклавши контракт і фінансуючи цю нідерландську компанію з виробництва електроніки, ми зможемо досягти деяких власних проривів у цьому дедалі важливішому типі військового обладнання."
 HOL_philips_focus_tt:0 "Буде відкритий промисловий концерн §Y$HOL_philips$§!.\n"
 HOL_protect_the_colonies:0 "Оборона колоній"
 HOL_pull_strings_with_british_industrialists:0 "Використовувати зв'язки з британськими промисловцями"
 HOL_pursue_diplomatic_grievances_desc:0 "Образи на адресу принца Бернарда і фактично всього нашого уряду переросли у повномасштабний дипломатичний скандал на межі військових загроз. Ми вимагаємо негайних і недвозначних вибачень, інакше нам доведеться перейти від слів до справи..."
 HOL_share_military_knowledge_desc:0 "Після майже 150 років миру наші сусіди стали розбиратися у військових справах куди краще за нас. Можливо, наші можливі союзники не відмовляться поділитися знаннями з нами, щоби нам у майбутньому було простіше обороняти свою батьківщину."
 HOL_submarine_3_desc:0 "The O21 class consisted of seven submarines built and commissioned by the Netherlands. The ships were all incomplete at the time of the German invasion, though five managed to escape to Britain and serve the Dutch Navy in exile. The subs were slightly larger than the preceding O-class subs, displacing over 990 tons, but were similarly armed with eight 533mm torpedo tubes."
