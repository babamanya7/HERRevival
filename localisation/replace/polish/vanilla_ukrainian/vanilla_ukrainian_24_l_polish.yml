 lar_dominate_the_middle_east.3.b:0 "Це просто непотрібний клаптик землі з непотрібними людьми."
 lar_low_stability_civil_war.1.a:0 "Ще одна Французька революція?"
 lar_low_stability_civil_war.2.a:0 "Всі ми знали, що це станеться."
 lar_news.15.t:0 "Франко-іспанський союз"
