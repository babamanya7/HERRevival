 SHX_modern_tank_artillery_equipment_1:0 "PLZ 59"
 SHX_wang_jingguo:0 "Ван Цзінґо"
 SHX_zhang_changsheng:0 "Zhang Changsheng"
 SIA_acquire_submarines:0 "Придбати підводні човни"
 SIA_aid_for_resources_tt:0 "Ми попросимо [JAP.GetNameDef] приєднатися до нашої війни в обмін на надання їм прав на видобуток каучуку в §Y[724.GetName]§!"
 SIA_american_investment_aid:0 "Американська інвестиційна допомога"
 SIA_ananda_industry_3:0 "Промисловий візіонер"
 SIA_ask_for_the_release_of_american_commodities:0 "Запит на розблокування американських товарів"
 SIA_bangkok_dock_organization:0 "Бангкокські доки"
 SIA_constitutional_virtue_desc:0 "Монархію, яка поважає закон, важче повалити і легше захищати. Під керівництвом Рангсіта ми відновимо конституційне правління, обмежимо свавільну владу і навчимо націю, що Корона знаходиться у найбільшій безпеці, коли вона виступає гарантом законної свободи."
 SIA_cultivate_civilian_wing:0 "Залучити цивільне крило"
 SIA_decrease_military_approval_tt:0 "Зменшує схвалення крила §YВійськових§! на §RНевелику величину§!"
 SIA_end_military_grift_desc:0 "Занадто довго військові бюджети підживлювали приватні статки, патронажні мережі та марні престижні проекти. Війна викрила цю гниль. Кожен корупційний контракт, підставний підрозділ і вкрадений вантаж має бути розслідуваний і відібраний у старої кліки."
