 SWI_join_france_desc:0 "Хоча стосунки не завжди були дружніми, [ROOT.GetName] і [FRA.GetName] поділяють ті самі демократичні цінності та навіть мову, тому, якщо нам довелося вибрати сторону в майбутньому конфлікті, їхній захист однозначно більш бажаний. ніж альтернатива."
 SWI_martial_law_desc:0 "У деяких ситуаціях потрібен скальпель, але в наш час немає такого, [ROOT.GetNameDef] потребує молота, якому можна довіряти, щоб тримати наших ворогів і наше населення під контролем."
 SWI_military_readiness_decisions_category_desc:0 "Народ Швайцарії знаходиться в епіцентрі фашистської бурі, тому мусить бути готовий захищати свій демократичний спосіб життя.\n\n\nВійськова готовність: [?SWI.SWI_military_readiness]/[?SWI.SWI_max_mil_readiness]£GFX_SWI_military_readiness_text_icon£"
