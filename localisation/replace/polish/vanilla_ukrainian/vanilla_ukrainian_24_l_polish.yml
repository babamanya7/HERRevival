 INSHOL_comite_rijkseenheid:0 "Комітет державної єдності (Comité Rijkseenheid)"
 INSHOL_comite_rijkseenheid_desc:0 "Прапор в Ост-Індії спускають, але люди просто дивляться, як це відбувається. Ми не можемо цього дозволити, ми маємо переконати адміністрацію Ост-Індії, що голландський народ хоче, щоб революція була зупинена!"
 INSHOL_east_indies_investments:0 "Інвестиції в Ост-Індію"
 INSHOL_encourage_further_investment:0 "Заохочення подальших інвестицій"
 INSHOL_increase_esclation_placeholder:0 "Швидка ескалація"
 INSHOL_increase_funding_for_tix_desc:0 "Інженери Fokker розробляють новий двомоторний бомбардувальник для заміни застарілих моделей, які використовують ВПС Ост-Індії. Цей проєкт має дуже малий бюджет, і, ймовірно, його завершення триватиме дуже довго. Ми можемо збільшити їхнє фінансування, щоб значно прискорити прогрес."
 INSHOL_license_dutch_weapon_blueprints:0 "Ліцензувати креслення голландської зброї"
 INSHOL_naval_program_transfer_25_2_tt:0 "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! передасть §Y25%§! своїх військово-морських сил до §Y[INS.GetNameDefCap]§!."
 INSHOL_outsourced_navy_desc:0 "У нас і так достатньо витрат, ми не можемо продовжувати відволікати все більше і більше колоніального бюджету на флот. Ми можемо платити корпораціям, щоб вони займалися виробництвом замість нас."
 INSHOL_papua_referendum_desc:0 "Сьогодні острів Папуа розділений між Індонезією та Австралією. Хоча наші інвестиції та розвиток перетворили нашу половину на зростаючий і процвітаючий регіон, підконтрольна Австралії територія залишається занедбаною та слаборозвиненою. Майбутнє острова має перебувати в руках його народу, і тому ми повинні вимагати офіційного референдуму щодо об'єднання Папуа."
 INSHOL_singapore_compromise_desc:0 "Сінгапур — це індонезійська земля за історією та культурою, і цілком природно, що він має бути включений до складу єдиної Індонезії. Проте Британія не бажає відмовлятися від Сінгапуру через його стратегічне значення та необхідність як військової бази. Ми повинні запропонувати компроміс, за якого Сінгапур приєднається до союзу за умови, що Британія збереже право розміщувати війська на острові."
 INSHOL_transfer_of_conrad_helfrich:0 "Переведення Конрада Хелфріха до Ост-Індії"
 INSHOL_volksraad_compromises:0 "Компроміси Фольксраду"
 INS_CAS_equipment_2_short:0 "A-20C Havoc"
 INS_UNION_DEF:0 "Netherlands-Indonesia Union"
 INS_abandon_mission_desc:0 "Наші ресурси не безмежні, а боротьба в [FROM.GetNameDef] вимагає більшого, ніж ми можемо собі дозволити зараз. Ми відкличемо наших агентів і перенаправимо наші зусилля туди, де вони потрібні найбільше."
 INS_all_in_on_rubber_desc:0 "Каучук — це наша найсильніша карта, і ми маємо намір нею зіграти. Кожен доступний акр плантацій буде відданий під вирощування каучуку, а наш експортний апарат буде реорганізовано, щоб переміщати його швидше і дешевше, ніж будь-хто інший в регіоні."
 INS_armored_car_equipment_0_short:0 "WF Pantserwagen"
 INS_chemical_imports_stolen_tt:0 "Додає §G[?var:ROOT.INS_guns_from_seek_help_focus]§! одиниць Піхотного спорядження, якщо ставлення вище §Y75§! на момент завершення цього фокусу."
 INS_communist_events.1.t:0 "Революція в [ROOT.GetName]"
 INS_communist_events.7.t:0 "Комуністична диверсія в [FROM.GetName]"
 INS_dutch_investment_rate_40:0 "§YНідерланди§! з імовірністю на §G40%§! більшою обиратимуть фокуси зі спільного дерева"
 INS_eng_treaty_holside_tt:0 "§Y[ENG.GetNameDefCap]§! офіційно оголосить про свою підтримку на нашому боці конфлікту та надасть суттєву допомогу. Якщо війна закінчиться перемогою, §Y[ENG.GetNameDefCap]§! матиме право на Борнео."
 INS_escalation_has_3_tt:0 "Рівень ескалації вищий за §Y3§!"
 INS_exile_tt:0 "§Y[HOL.GetNameDefCap]§! зможе продовжити передислокацію до §Y[INS.GetNameDef]§!."
 INS_greater_indonesia:0 "Проголосити Велику Індонезію"
 INS_increase_laskar_funding_desc:0 "Наші ополченці складають більшість наших сил. Ми маємо визнати це і фінансувати їх відповідно, навіть якщо вони не повністю лояльні до [INS.GetLeader]."
 INS_infiltrate_the_media_desc:0 "Наш рух залучив кількох високопоставлених представників медіаорганізацій в Ост-Індії. Ми можемо використати це на нашу користь, щоб непомітно посіяти прореволюційні настрої в головах громадян."
 INS_integrate_subject_in_progress:0 "Уже інтегрує суб'єкта"
 INS_invest_in_batavian_education_req_2_tt:0 "Успішно виконано щонайменше §Y6§! місії Фольксрааду"
 INS_is_deescalating_tt:0 "Ще не виконує місію з деескалації"
 INS_light_tank_artillery_equipment_2:0 "Pantsergeschut 2"
 INS_limited_war_events.9.desc:0 "Радіоперехоплення ворожого командування підтвердили найгірше. Не буде ніякого врегулювання, ніякого зваженого миру, ніякого повернення до рубежів, які ми тримали раніше. Маріонетки та їхні лондонські господарі вимагають повної капітуляції Республіки, щоб Індонезію зламали, а її острови повернули під імперіалістичний чобіт, з-під якого ми їх вирвали. На це є лише одна відповідь."
 INS_loyalist_events.10.t:0 "[FROM.GetNameDefCap] голосує за об'єднання"
 INS_loyalist_events.16.b:0 "Цейлон залишиться під нашим контролем."
 INS_loyalist_events.21.t:0 "Референдум у Папуа відхилено"
 INS_loyalist_events.28.t:0 "[FROM.GetNameDefCap] вимагає референдум у [PHI.GetName]"
 INS_medium_tank_artillery_equipment_3:0 "Pantserhouwitser 5"
 INS_more_market_resources_desc:0 "Світ може загрузнути в економічній кризі, але криза породжує можливості для тих, хто достатньо сміливий, щоб ними скористатися. Наводнивши ринок нашими товарами за цінами, з якими не зрівняється жоден конкурент, ми гарантуємо, що коли світ відновиться, індонезійські товари вже будуть на кожній полиці та на кожному складі."
 INS_national_revolution_republic_win_hol_tt:0 "[INS.GetAdjective] республіканські загони ополчення встановлять §Rде-факто контроль§! над регіоном, і конфлікт закінчиться §Rперемогою Республіки§!."
 INS_nationalist_scholar:0 "Вчений-націоналіст"
 INS_new_bauxite_routes:0 "Нові бокситові шляхи"
 INS_political_events.11.desc:0 "Після проголошення незалежності наші ополченці негайно вирушили захищати нашу територію від голландського вторгнення, якого ми очікували. Однак, на подив багатьох, [HOL.GetLeader] оголосив, що не буде закликати до вторгнення, натомість надавши пріоритет відбудові голландської батьківщини та уникненню подальшого конфлікту."
 INS_political_events.14.desc:0 "Сукарно, а також кілька інших провідних революціонерів в Індонезії були заарештовані голландською військовою поліцією до того, як ми змогли встановити маріонетковий режим."
 INS_railway_youth_force:0 "Співпраця із Залізничними молодіжними силами"
 INS_renville_timer_mission_republic:0 "Очікування переговорів Ренвілл"
 INS_reorganize_freedom_fighter_militia_2:0 "Подальша реорганізація дивізій борців за свободу"
 INS_republic_masyumi_party:0 "Masyumi"
 INS_revolution_events.3.desc:0 "[ENG.GetNameDefCap] погодилися безпосередньо вступити в конфлікт, надіславши кілька дивізій воювати в Батавії. Хоча нам доведеться відмовитися від Борнео, це сильно схиляє шанси на нашу користь."
 INS_revolution_planning_envoy_DONE:0 "База ополчення у [FROM.GetName]"
