 PRC_prepare_for_war_with_japan_desc:0 "Японські мілітаристи — серйозна загроза нашій нації: вони хочуть розрізати її на частини й експлуатувати так, як не снилося жодному китайському уряду. Наша боротьба з націоналістами меркне порівняно з цим."
 PRC_propaganda_efforts_2_tt:0 "Отримуйте §G[?PRC_gain_faction_inluence_number|%]§! §Yвпливу на фракцію§! за кожне рішення §Y«Партизанська війна»§!"
 PRC_purge_the_world_of_fascism_desc:0 "Попри обіцянки відійти від капіталізму, ненависть фашистів до комунізму є достатнім доказом того, що це лише фарс. Радикальні засоби, які ми використовуємо для звільнення пролетаріату, фашисти використовують для його придушення, і це те, проти чого ми повинні виступити."
