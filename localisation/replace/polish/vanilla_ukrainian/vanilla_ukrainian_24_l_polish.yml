 JAP_border_incident_forgotten_desc:0 "Якщо ми хочемо використати інцидент на радянському кордоні для Кореї, ми повинні вдарити швидко."
 JAP_carrier_1_desc:0 "Авіаносець «Kaga» був першим авіаносцем японського флоту. Спершу він був лінкором, але був добудований як авіаносець. У підсумку вийшов великий і важкоброньований авіаносець з обмеженим простором для вдосконалення. Проте, це був важливий досвід будівництва авіаносця для Імперського флоту Японії."
