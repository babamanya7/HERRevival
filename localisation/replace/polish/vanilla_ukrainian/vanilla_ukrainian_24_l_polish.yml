 BRA_no_fascism_in_south_america_tt:0 "Отримає ціль війни §Y$puppet_wargoal_focus$§! проти всіх §Yфашистських§! держав §YПівденної Америки§!."
 BRA_pact_of_silence_desc:0 "Нації піднімаються і нації падають. З падінням такої кількості націй останнім часом, з'явилася надлишкова кількість експертів у всіх галузях, які шукають безпечніших берегів, щоб назвати їх домом. Можливо, ми могли б закрити очі на їхнє походження, якщо зможемо скористатися їхніми знаннями."
 BRA_politically_educated:0 "Політично освічений"
 BRA_prepare_for_second_intentona_desc:0 "Наша перша спроба повалити буржуазну державу $BRA_getulio_vargas$ провалилася. Якщо ми не відновимо сили швидко, будь-який шанс на другу спробу революції буде знищений новою хвилею антиліберального законодавства, яке він приймає. Ми повинні відродити вогонь революції, перш ніж це станеться."
 BRA_propaganda_idea:0 "Departamento de Propaganda"
