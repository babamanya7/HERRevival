 SOV_railway_gun_equipment_1:0 "ТМ-3-12"
 SOV_raise_penal_units_desc:0 "Більше м'яса для м'ясорубки."
 SOV_recover_the_kuril_islands_desc:0 "Курильські острови були втрачені після катастрофи 1905 року. Якщо ми завдамо швидкого і сильного удару, ми зможемо повернути їх і поставити Японію в ситуацію, коли ескалація конфлікту не матиме для неї жодного сенсу."
 SOV_recruit_admiral_opposition_tt:0 "Один адмірал стає відданим нашій справі."
 SOV_reinforce_western_naval_bases_other_states_tt:0 "Також дасть §Y2 гармати ППО§! та §Y2 прибережні укріплення§! в регіоні §Y[111.GetName]§!, §Y[812.GetName]§!, §Y[808.GetName]§! або §Y[189.GetName]§!, якщо [SOV.GetNameDef] повністю контролює якийсь із цих регіонів."
 SOV_sinkiang_joined_comintern_days_tt:0 "Наразі днів: [?SOV_sinkiang_joined_comintern_counter_flag:days|Y0]"
 SOV_smersh_desc:0 "Ми мусимо донести до кожного громадянина, що шпигуни та ворожі агенти присутні скрізь, і що будь-яка пуста балаканина може дати ворогу важливу інформацію, яка дасть йому перевагу."
