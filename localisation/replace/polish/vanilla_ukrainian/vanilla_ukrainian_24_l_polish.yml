 SOV_CHURCH_CANDIDATES_DESC_TSARIST:0 "Церква попросила дозволу направити своїх кандидатів на майбутні вибори до Земського собору. Визнаючи важливу роль, яку Патріархат відіграє в російському суспільстві, ми вирішили погодитися, прокладаючи шлях до можливості справжнього злиття волі Божої і волі нашого правителя."
