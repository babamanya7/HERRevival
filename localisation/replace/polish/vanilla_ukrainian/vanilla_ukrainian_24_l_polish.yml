 XSM_ma_bufang:0 "Ма Буфан"
 XSM_the_civilian_governor_remains_desc:0 "Хоча Ма Буфан хотів повного контролю, стає дедалі очевиднішим, що це неможливо без ризику повномасштабного повстання народу. Однак Ма Лінь запропонував компроміс, де обидві ролі розглядатимуться як співправителі: він відійде до більш символічної ролі лідера, а Буфан де-факто контролюватиме більшість справ."
 YAK_communism_party_long:0 "Якутські регіональні більшовицькі збори"
 YUG_all_yugoslavian_regiments_desc:0 "Хоча наші народи можуть бути різноманітними, усі вони повинні служити для захисту нашої нації. Ми не будемо робити різниці за національністю при організації наших полків."
 YUG_arrest_ustasa_leaders_cooldown:0 "$YUG_arrest_ustasa_leaders$"
 YUG_bomber_project_desc:0 "Щоб довести бій до ворога, нам потрібні бомбардувальники. Нашим інженерам необхідно доручити розробку нових вітчизняних конструкцій такого типу."
