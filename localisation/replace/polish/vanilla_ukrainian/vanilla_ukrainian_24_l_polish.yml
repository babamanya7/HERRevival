 RAJ_conquer_afghanistan_desc:0 "Афганістан, родове серце імперії, має бути повернутий. Відновивши контроль над цим історичним регіоном, ми вшановуємо спадщину Моголів та забезпечуємо життєво важливий опорний пункт для відродження імперії."
