 ENG_motorized_focus_desc:0 "Останнім часом армія експериментує з повністю моторизованими піхотними підрозділами. Поки що вони не сформували жодної повністю моторизованої дивізії, але за умови правильних слів на адресу військового міністра це може стати можливим незабаром."
