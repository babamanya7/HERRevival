 PEACE_WAR_SCORE_REDISTRIBUTION_TO_PARTICIPATING_COUNTRIES:0 "Недостатньо внеску у війну"
 PER_absolute_monarchy_desc:0 "Після придушення Резою-шахом Пехлеві дисидентів, які прагнули викорінити його правління, він тепер оголосив абсолютну монархію, забравши більше влади Короні та гарантуючи, що ніхто інший не зможе загрожувати його родоводу. Цей процес включає зосередження уваги на більш мілітаристському підході до зовнішніх справ та розширенні постійної армії [PER.GetNameDef]."
 PER_anglo_iranian_oil_ns_desc:0 "Офіційно відома як Англо-перська нафтова компанія, AIOC була заснована [ENG.GetNameDef] у 1909 році після відкриття значного нафтового родовища в Меджед-Солеймані. Багато хто в [PER.GetNameDefCap] вважає, що ця компанія використовує ресурси та робочу силу нашої нації, не виконавши багатьох обіцянок, які вона дала."
 PER_bofors:0 "Бофорс"
 PER_bolster_civilian_industry:0 "Посилити нашу цивільну промисловість"
 PER_civil_unrest_category:0 "Громадські заворушення"
 PER_communist_education_reform_desc:0 "Наша система освіти застаріла і не відповідає потребам держави. Нам потрібно залучити більше дітей до шкіл та забезпечити, щоб вони закінчили школу з більш практичними навичками, які вони зможуть використовувати в робочій силі."
 PER_communist_events.1.t:0 "Зростання активності радикалів"
 PER_communist_events.11.desc:0 "Уряд [FROM.GetNonIdeologyName] запросив інженерну підтримку у розробці протикорабельних технологій, щоб вони могли розробити відповідні контрзаходи загрозі колоніальних держав у Перській затоці. Вони зобов'язалися ділитися з нами будь-якими майбутніми розробками, які вони зроблять."
 PER_communist_events.14.t:0 "[FROM.GetNameDefCap] надає конструкцію"
 PER_communist_events.2.desc:0 "[FROM.GetAdjective] влада організувала придушення курдських рухів за незалежність по всьому регіону. Наші контакти в цьому районі тому перейшли у підпілля або втекли через кордон до [ROOT.GetNameDef]."
 PER_communist_propaganda_tt:0 "Відмикає рішення §Y$PER_national_iranian_radio$§! для підвищення стабільності, підтримки війни та популярності партії."
 PER_constitutional_monarchy_desc:0 "Шах надто довго домінував у політиці нації, однак його відсутність засмутила б занадто багатьох, хто продовжує вірити в його священну роль. Таким чином, ми обмежимо здатність шаха впливати на політичні справи та залишимо його роль церемоніальною."
 PER_declare_loyalty_to_britain_desc:0 "Як новий суб'єкт [ROOT.OVERLORD.GetNameDef], було б розумно діяти обережно та слідувати примхам нашого сюзерена. Можливо, це буде наша можливість нарешті завершити нашу ініціативу модернізації. Шлях, можливо, прийняв абсолютно інший напрямок, але кінець той самий."
 PER_deposed_shah_trait:0 "Повалений шах"
 PER_desert_training_idea:0 "Спеціалізована підготовка в пустелі"
 PER_forced_secularization_desc:0 "З тих пір, як Реза-шах Пехлеві вперше прийшов до влади, в [PER.GetNameDef] постійно чинився опір духовенству. Іслам залишається нашою державною релігією, однак, намагаючись довести західному світу, що ми здатні стояти серед них, настав час нам відокремити релігію від держави та піти шляхом модернізації."
 PER_hasan_arfa:0 "Хасан Арфа"
 PER_imperial_events.160.b:0 "Ми повинні продовжувати тиснути! Ми переможемо!"
 PER_imperial_events.233.a:0 "За нашого нового шаха!"
 PER_imperial_events.70.a:0 "Приємна пропозиція. Надіслати запрошення."
 PER_invest_in_univerity_facilities:0 "Інвестувати в університетські об'єкти"
 PER_iranian_nuclear_program_desc:0 "Початок нашої власної програми атомної зброї є вирішальним кроком для нас, щоб перейти від слабкої та незначної нації до сильної світової держави, якою [ROOT.GetNameDef] судилося стати."
 PER_islamic_solidarity:0 "Ісламське братство"
 PER_motorization_investments_idea:0 "Інвестиції в моторизацію"
 PER_persia_adj:0 "Перськ"
 PER_push_to_deserts_desc:0 "Ворожі сили переважно атакують нас із північних кордонів [PER.GetNameDef]. Ми повинні зосередити наші війська в цих регіонах та запобігти подальшому просуванню загарбників. Потім ми перенесемо боротьбу на них і відкинемо їх назад до кордону."
 PER_qajar_dynasty_party:0 "Династія Каджарів"
 PER_rally_ancient_history_desc:0 "Не секрет, що молоде правління династії Пехлеві викликало занепокоєння у [PER.GetNameDef] щодо майбутнього. Наш найкращий шанс поширити націоналістичну гордість та довіру до шаха — це нагадати нашому народу та світу, наскільки неймовірною була історія стародавньої Персії. Настав час відсвяткувати Імперію Ахеменідів."
 PER_rebuilding_iran:0 "Відбудова [PER.GetNonIdeologyName]"
 PER_reclaim_turkish_peninsula_desc:0 "[TUR.GetNameDefCap] — це перешкода, яка стоїть на шляху нашої експансії на захід. Анатолія колись була перською землею, і настав час нам рухатися, щоб повернути її. Перевести наші війська на позиції та готуватися до вторгнення!"
 PER_resistance_decisions_tt:0 "Відмикає рішення §YСтворити осередки опору§!, які дозволяють нам викликати нестабільність у сусідніх країнах для підготовки до вторгнення."
 PER_rural_feudalism_ns:0 "Сільський феодалізм"
 PER_special_units_desc:0 "У міру зростання наших військових можливостей для нас важливо розглядати наші спеціалізовані підрозділи на додаток до наших регулярних військ. З цим виникне багато нових можливостей, включаючи розвідувальні операції, спеціальні сили і навіть експериментальну зброю."
 PER_ssb_events.11.t:0 "[TUR.GetName] підписує угоду про експорт хрому"
 PER_swear_fealty_desc:0 "Незважаючи на всі наші зусилля захистити [PER.GetNameDef], нам не вдалося стримати ворога. Оскільки їхні війська наближаються до нашої столиці, було б розумно звернутися та негайно закінчити цю війну, пропонуючи себе як маріонетку. Принаймні таким чином ми зможемо запобігти подальшому спустошенню нашої країни."
 PER_treaty_of_tehran_tt:0 "Надішле подію до [ENG.GetFlag]§Y[ENG.GetNameDef]§! та [SOV.GetFlag]§Y[SOV.GetNameDef]§!, вимагаючи вивести їхні війська та припинити війну."
 PER_war_plan_darius:0 "Військовий план «Дарій»"
