 RAJ_lobby_parliment_desc:0 "За підтримки приватних інвесторів ми будемо лобіювати парламент, щоб представити приватизацію як єдину життєздатну гарантію проти чергового глобального економічного колапсу. Розпродаж частин Раджу — це не просто стратегія, це стабільність для імперії."
 RAJ_local_leaders_investments_header:0 "Інвестиції"
 RAJ_local_recruitment_offices_desc:0 "У нас велике населення, багато хто з них був би готовий записатися в армію як спосіб покращити своє економічне становище, замість того, щоб нам доводилося оголошувати загальний призов. Створення відділень вербування надасть нам достатньо добровольців."
 RAJ_lowest_bigger_construction_desc:0 "Ми завжди повинні звертатися до найменшого учасника торгів, щоб знизити витрати на будівництво."
 RAJ_medium_tank_equipment_2:0 "Cromwell Local Pattern"
 RAJ_mineral_exploitation_institute_desc:0 "Недавні розробки гірничодобувної промисловості не принесли очікуваних результатів. Здається, нам потрібно інвестувати в кращі геологічні дослідження, щоб точніше оцінити потенційний дохід від наших природних ресурсів."
