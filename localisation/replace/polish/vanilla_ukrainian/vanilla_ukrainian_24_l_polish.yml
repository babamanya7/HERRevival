 ETH_the_emperor_stays:0 "Імператор залишається"
 ETH_the_ferengi_tt:0 "Відкриває §Yрішення§!, щоб вербувати найманців, використовуючи кошти імперської скарбниці."
 ETH_the_liberator_of_country_short_desc:0 "[ETH.GetLeader] героїчно привів нас до незалежності, вільної від корупційного впливу [ITA.GetName]. Ми не знаємо, що передбачає майбутнє, але ми знаємо, що воно буде славним, доки у нас є визволитель [ETH.GetName], який веде нас у нього."
 ETH_together_for_victory_desc:0 "Наближається час, щоби ми відновили нашу честь і розірвали кайдани італійського гноблення. Щоб наші плани не провалилися, нам потрібно зміцнити наші сили та отримати підтримку з усієї Східної Африки. Тільки разом перемога буде забезпечена."
