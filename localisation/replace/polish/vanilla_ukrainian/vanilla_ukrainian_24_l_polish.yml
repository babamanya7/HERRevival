 SWI_closer_democratic_ties_desc:0 "Оскільки автократія кидає тінь на Європу, можливо, ми не зможемо постояти за себе, але, співпрацюючи з іншими демократичними націями, ми зможемо зупинити її просування. Першим кроком буде налагодити з ними тісніші зв'язки та довести їм, що ми можемо зробити свій внесок у справу."
 SWI_concessions_to_communists:0 "$SWI_concessions_to_fascists$"
 SWI_decision_remove_councilor_1_desc:0 "Вигнання радника запускає механізми Швайцарської Асамблеї. Нам доведеться почекати деякий час, перш ніж ми зможемо заповнити їхню посаду."
 SWI_defend_against_paratroopers_desc:0 "Ми бачили, як можна використовувати десантників для обходу будь-яких укріплень, що робить будь-які приготування спірними. Життєво важливо, щоби ми були готові впоратися з ними, перш ніж вони завдадуть хаосу нашій обороні."
