 CHL_return_to_the_parliamentary_era:0 "Повернення до епохи парламентаризму"
 CHL_ship_heavy_battery_2:0 "35.6-см/50 Cannon"
 CHL_support_for_the_international_revolution_desc:0 "Є багато людей, яким доводиться боротися не лише з іноземними державами, які вторгаються в їхні домівки, але й з корумпованими урядами та промисловими підприємствами, які забирають у них засоби до існування. Ми мусимо зробити все можливе, щоби люди в усьому світі могли відчувати себе в безпеці і бути захищеними від зла."
 CHL_syndicalize_the_production_sector_desc:0 "Виробничий сектор наразі страждає від неефективності та жорстоких власників асьєнд, які думають лише про власний прибуток. Ми мусимо синдикалізувати галузі та створити справжню фалангістську корпоративну промислову модель."
 CHL_the_patagonian_giants:0 "Патагонські велетні"
 CHL_undo_colonialist_occupations:0 "Скасувати колоніальну окупацію"
 CHL_veteran_legionaries_desc:0 "Багато членів французьких іноземних легіонів приєдналися до Антуана Бернара в його подорожі до нашої країни та будуть допомагати йому в його славетних завоюваннях."
