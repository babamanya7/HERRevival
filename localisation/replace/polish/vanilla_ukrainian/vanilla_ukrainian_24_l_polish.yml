 IRQ_restore_al_andalus:0 "Відновити Аль-Андалус"
 IRQ_rural_electrification_desc:0 "Хоча електрифікація неухильно просувається в міських районах, сільське населення залишається відрізаним від таких розробок. Тому ми повинні створити національну електроенергетичну раду, щоб рівномірно запроваджувати електричну інфраструктуру по всій країні."
 IRQ_strengthen_relations_with_turkey:0 "Зміцнити стосунки з Туреччиною"
 IRQ_strengthen_the_golden_square_desc:0 "«Золотий квадрат», що складається з чотирьох високопоставлених військових офіцерів, став центром для панарабізму та анти-[ENG.GetAdjective] настроїв. Можливо, настав час повністю залучити їх до уряду та розпочати реформи, необхідні для зміцнення нації."
 IRQ_support_from_skies_above_desc:0 "З огляду на оточення навколо нас, покладатися лише на піхоту та наземні підрозділи було б нерозумно. Хоча спроба створити повітряні сили, ймовірно, вимагатиме великих витрат, це захід, який ми повинні вжити."
 IRQ_support_from_the_mountains:0 "Гірський досвід"
 IRQ_support_weapons3:0 "Bren Mk. I & ML 3 inch mortar"
 ITA_EQUIPMENT_VERSION_10:0 "X serie"
