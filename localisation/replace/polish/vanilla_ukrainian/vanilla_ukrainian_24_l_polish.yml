 SWI_ban_foreign_nazi_propaganda_desc:0 "Ми не можемо дозволити цьому засобу іноземної пропаганди стояти. Нацизм суперечить кожній цінності, яка визначає [ROOT.GetAdjective]у Федерацію. З цієї причини це не можна терпіти в країні, побудованій на демократії та толерантності, як наша, щоби не ризикувати, що їх використають, щоби знищити нас зсередини."
