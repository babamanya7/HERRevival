 SPR_literacy_programs_desc:0 "Неграмотність широко поширена серед робітничого населення, але за допомогою належних програм це можна швидко поліпшити, безсумнівно, дозволяючи виявлятися прихованим талантам."
 SPR_miguel_buiza_femandez_palacios:0 "$SPR_miguel_buiza_fernandez_palacios$"
 SPR_militarize_the_people_desc:0 "Ми не маємо розкоші тримати руки чистими від крові. Усіх треба навчити володіти зброєю для самозахисту, щоб, коли прийде час, вони могли боротися за своє майбутнє."
