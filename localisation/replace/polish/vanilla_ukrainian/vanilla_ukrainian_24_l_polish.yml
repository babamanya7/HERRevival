 BEL_plan_de_man:0 "План де Ман"
 BEL_revitalize_nederlands_desc:0 "Наша мова майже зникла! Навіть суди оголошують свої рішення французькою, і лише місцеві діалекти згадуються. Перший крок до відновлення фламандської величі — це забезпечити правильну мову в уряді та серед наших людей. Нідерландська!"
