 STAT_COMMON_FUEL_CONSUMPTION_FACTOR_DESC:0 "Скільки пального споживає ця військова частина під час роботи. Повітряні та морські частини споживатимуть пальне під час виконання активних завдань або проведення навчань. Наземні частини зі споживанням пального споживатимуть пальне навіть при бездіяльності, але бойові дії, пересування чи навчання ще більше збільшать споживання."
