 FRA_invite_portugal:0 "Запросити Португалію"
 FRA_light_tank_artillery_equipment_3_short:0 "F3 155 mm"
 FRA_maxime_weygand:0 "Максім Вейґан"
 FRA_national_mobilization:0 "Національна мобілізація"
 FRA_pre_empt_the_fascist_attack_desc:0 "Чому ми мусимо дозволити ворогові підготуватися в мирі і вибрати момент, коли неминуча атака станеться, коли це найбільше підходить для них? Ми завдамо удару першими і придушимо цю загрозу, перш ніж вона встигне підготуватися."
 FRA_psf_party:0 "ФСП"
