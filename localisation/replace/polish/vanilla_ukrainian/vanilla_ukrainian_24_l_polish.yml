 adu_recreate_rashid_expansion_desc:0 "До правління Омейядів в Аравії, Рашіди панували над арабським світом, і саме під їхнім правлінням Халіфат поширився на Персію та Індостан. Відтворюючи це давнє завоювання, ми можемо возз'єднати Персію та міфічну землю Індостану з нашою державою."
