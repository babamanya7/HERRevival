 FRA_submarine_4:0 "Клас «Phénix»"
 FRA_syria_intervention.1.a:0 "Гідний бій."
 FRA_the_legitimate_heir_desc:0 "Легітимісти вважають карлістську гілку законним спадкоємцем престолу Франції. Призначення їх кандидата на престол відкриває надзвичайну можливість правління Іспанією та Францією в умовах подвійної монархії."
