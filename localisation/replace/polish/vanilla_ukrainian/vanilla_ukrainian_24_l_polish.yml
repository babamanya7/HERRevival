 BRA_create_faction_desc:0 "Є багато інших, хто поділяє наші ідеї щодо того, яким має бути комуністичне суспільство. Настав час відкритися для співпраці з цими націями, щоб ми, разом, могли відстоювати нашу справу!"
 BRA_establish_psad_desc:0 "Державний апарат, який дозволяє реалізовувати політику нашого уряду, став застарілим і недієздатним. Ми створимо Departamento Administrativo do Serviço Público (DASP), який допоможе нам більш ефективно управляти країною та підтримувати економічну ефективність."
