 NORDIC_air_production_desc:0 "Якщо ми сподіваємося встановити панування в північній півкулі та за її межами, нам потрібно наздогнати багаторічні запаси, які великі держави мають над нами. На щастя, ми можемо поділитися практикою, знаннями та обладнанням, яке можемо використати, щоб перевищити виробництво ворога і закрити цю прогалину."
 NORDIC_aircraft_concentration_desc:0 "Плейсголдер"
 NORDIC_conflict_scale_limited_war_name:0 "§GОбмежена війна§!"
 NORDIC_expert_naval_mechanics_desc:0 "Плейсголдер"
 NORDIC_ground_operations_desc:0 "Будуючи більше баз, ми маємо більшу гнучкість у наших спільних повітряних операціях, і будуючи більше протиповітряних батарей, ми можемо захистити нашу землю та зняти вагу зі спини наших пілотів. Ось як ми створюємо взаємопов'язану наземну підтримку система для максимізації ефективності наших повітряних операцій."
 NORDIC_is_joint_focus_member_TT:0 "Є частиною §Y[NORDIC_get_alliance_name]§!"
 NORDIC_monarchist_second_selector_left:0 "Велике Князівство Повітряних Сил"
 NORDIC_nordic_airforce_desc_com:0 "Ми не можемо дозволити силам капіталізму захопити взірець свободи, який ми всі повинні розділити порівну. Наші повітряні сили будуть кишати небесами наших ворогів і спускати на них ковдру пекельного вогню."
 NORDIC_nordic_army:0 "[NORDIC_get_nordic_army_name]"
 NORDIC_nordic_army_monarchist:0 "Крокуючі леви"
 NORDIC_nordic_military_industry_communist:0 "Виробництво зброї північних людей"
 NORDIC_nordic_navy_desc:0 "[NORDIC_get_nordic_navy_desc]"
 NORDIC_nordic_navy_desc_mon:0 "Об'єднані військово-морські сили [NORDIC_get_alliance_name] пануватимуть над хвилями в усіх наших домініонах. [NORDIC_get_nordic_navy_name] буде припливом, який буде бити наших ворогів, доки не залишаться лише уламки їхніх кораблів."
 NORDIC_procurement_fund_desc:0 "Великі економічні та військові держави мають потенціал для виробництва засобів оборони та завоювання, і хоча у нас є рідна військова промисловість, вона блідне в порівнянні. Можливо, ми ще не зможемо зрівнятися з цією промисловою потужністю, але ми можемо об'єднати наші кошти для закупівлі великої кількості зброї та транспортних засобів, життєво необхідних для нашої оборони."
 NOR_abandoning_nynorsk_ns_desc:0 "Лідери «Національної єдності» постановили, що нюношк неприпустимий і кожен громадянин повинен використовувати букмол — варіант норвезької мови."
 NOR_administrative_council_dmod:0 "Адміністративна рада"
 NOR_anti_tank_equipment_1_short:0 "Bofors 37mm"
 NOR_approach_the_fatherland_league_desc:0 "Вже багато років Вітчизняна ліга просуває консервативний порядок денний у Норвеґії, але їм бракує нашого імпульсу та рішучості. Ми можемо показати їм, наскільки ми єдині та як ми можемо об'єднати зусилля для досягнення наших спільних цілей проти комунізму."
 NOR_bjarne_oen:0 "Б'ярне Еен"
 NOR_callous_engineer:0 "Безсердечний інженер"
 NOR_claims_on_denmark_desc_mon:0 "Можливо, Данія була землею, яку наш улюблений король називав своїм домом, але ми знаємо, що його справжньою домівкою завжди була [NOR.GetNonIdeologyName], навіть до того, як він був обраний на корону. Незважаючи на це, ми повинні повернути його стару країну в його королівство, можливо, це спонукатиме його брати активнішу роль в уряді нашої монархії."
 NOR_communist_preparation_decisions_category_desc_stalinist:0 "Люди [ROOT.GetName] занадто довго закривали очі, настав час, нарешті, прислухатися до заклику наших братів і сестер у [SOU.GetNameDef].\n\nВикористовуючи їх як приклад чого може досягти [ROOT.GetName], коли вони захоплять засоби виробництва й об'єднаються під одним прапором і одним лідером, який поведе їх у боротьбі з тиранією Осло.$NOR_revolution_support_counter$"
 NOR_crumbling_fortifications_ns_desc:0 "У деяких випадках називати їх «укріпленнями» було б перебільшенням. Вони не просто законсервовані, але ще й зовсім не готові до сучасних боїв."
 NOR_expedite_training:0 "Прискорене навчання"
 NOR_frontkjempere_desc:0 "Багато [NOR.GetAdjective]их добровольців прагнуть на передову, щоб допомогти нашим визволителям перемогти за кордоном. Багато хто загине, але це лише ціна, яку ми платимо за те, що ми є частиною глобального націоналістичного руху. Хто знає, можливо [NOR.GetName] буде настільки підлабузнюватися, щоб довірити йому управління власною справою."
 NOR_generic_communist_revolutionary:0 "Генрі Вільгельм Крістіансен"
 NOR_iceland:0 "Ісландія"
 NOR_johan_ludwig_mowinckel:0 "Юган Людвіґ Мовінкел"
 NOR_make_assurances_to_the_people:0 "Запевнити [NOR.GetAdjective]й народ"
 NOR_norwegian_reichsprotectorate_desc:0 "Завдяки нашим численним успіхам [GetNorwegianFascistOverlord] вирішив, що [NOR.GetName] готовий повністю приєднати нашу країну до своєї імперії. Це віддзеркалення їхньої сили та нашої поваги до неї. Ми зробимо все, що потрібно щоб задовольнити їхню постійно зростаючу жагу влади та землі."
 NOR_our_royal_claims_desc_queen:0 "На жаль, короля Гокона VII більше немає з нами, але ми мусимо пам'ятати про спадок, який він нам залишив, до якого входять його численні претензії по всій Європі. Нам іще більше пощастило з нашою дорогою королевою Матильдою I, яка не лише має власні претензії, але й готова зробити все можливе, щоби відстояти ці претензії та принести землі в наше королівство. Борімося за землю нашої Корони!"
 NOR_popular_reformer:0 "Популярний реформатор"
 NOR_pragmatic_defense_minister:0 "Прагматичний міністр оборони"
 NOR_prep_his_dmod_1:0 "Область розвивається"
 NOR_research_funding:0 "Фінансування досліджень"
 NOR_sivorg_ns:0 "Sivorg"
 NOR_stavanger_airfield_desc:0 "Скоро буде завершено будівництво аеропорту Ставанґер, і це місце ідеально підходить для військового аеродрому. Ми можемо внести необхідні зміни, щоб використовувати цей цивільний аеропорт як військову авіабазу."
 NOR_support_rebellion:0 "Підтримати повстання в області [FROM.GetName]"
 NOR_swedish_claims:0 "Претензії до Швеції"
