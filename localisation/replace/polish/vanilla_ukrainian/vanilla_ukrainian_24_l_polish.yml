 restructure_supply_system_desc:0 "Переспрямовуючи будівельні матеріали та залізничних робітників, ми можемо швидко створити невелику кількість тимчасових складів постачання вздовж деяких наших залізниць. Однак це не є стійким способом управління системою.\n\n§RЦе рішення можна прийняти лише раз. Бонус зникне, якщо ви збудуєте понад 3 додаткові центри постачання.§!"
