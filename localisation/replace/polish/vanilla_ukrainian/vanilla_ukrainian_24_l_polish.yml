 SWE_italian_destroyers_desc:0 "Будувати кораблі з нуля дорого. Однак багато країн можуть захотіти продати деякі зі своїх старих суден. [ITA.GetNameDefCap], наприклад, уже виявив зацікавленість у продажу низки есмінців нам за дуже розумну ціну."
 SWE_landsverk_organization:0 "Landsverk"
 SWE_landverk_l_62:0 "Landsverk L-62"
 SWE_light_cruiser_1_desc:0 "The Fylgia was a relatively small armored cruiser that was commissioned for the Swedish Navy in 1905. The performed mostly training duties during the war, and underwent an extensive refit in 1939-41. Prior to the refit, she displaced over 4,300 tons and was armed with six 152mm/45 K/50 M1903 guns in her main armament. She had good armor, but was relatively slow for a cruiser."
 SWE_mio_trait_german_landsverk_tech_exchange:0 "Німецько-шведський обмін танковими технологіями"
 SWE_move_the_bus:0 "Пересунути автобус"
 SWE_mythologize_swedish_history:0 "Контрреволюція"
 SWE_mythologize_swedish_history_desc:0 "Ми захопили контроль над державним апаратом, але ще багато чого потрібно зробити, щоб укріпити нашу владу. Тому ми запровадимо хвилю реформ, щоб наситити наших політичних прихильників, а також викорінити всіх тих, хто чинить опір нашій владі."
 SWE_nordic_defense_fleet_desc:0 "З ратифікацією договору про оборону Нордичних країн ми можемо розпочати процес об'єднання наших військово-морських активів під комбіновану систему командування."
 SWE_per_albin_hansson:0 "Пер Альбін Ганссон"
 SWE_privately_managed_holidays_desc:0 "Державі немає місця втручатися в те, як бізнес вирішить працювати. Тому ми дозволимо приватному сектору контролювати свою політику відпусток. Якщо працівникам це не подобається, вони можуть знайти роботу в іншому місці."
 SWE_rationing_desc:0 "Ми дуже добре пам'ятаємо економічні труднощі, які завдала Велика війна невинним людям [SWE.GetName]. Нам потрібно знову уникнути такого лиха, запровадивши систему нормування їжі, палива та інших необхідних речей."
 SWE_rationing_food_stamps_remove_tt:0 "$MODIFIER_STABILITY_WAR_FACTOR$: §R-5%§!"
 SWE_refuge_for_revolutionaries_tt:0 "Радники-комуністи з інших країн переходять до [SWE.GetName] залежно від політичної ситуації в їхній країні. Наразі ці радники переходять до [SWE.GetName]:"
 SWE_research_slot_1:0 "[AAT_Sweden_royal_institute_name]"
 SWE_royal_visit:0 "Організувати королівський візит до області [FROM.GetName]"
 SWE_scramble_for_the_baltic_desc:0 "Територія, яку зараз займають країни Балтії, колись була територією Шведської імперії протягом багатьох століть. Якщо ми хочемо відновити наше панування над ширшим Балтійським морем, нам потрібно швидко діяти, щоб повернути ці території під [GER.GetAdjective]ий контроль, а інакше [SOV.GetAdjective]і війська випередять нас."
 SWE_ship_heavy_battery_4:0 "40.6 cm/48 Bofors M41"
 SWE_sieze_landsverk:0 "Захопити Landsverk"
 SWE_suffragette_rfsu:0 "Заснування ДАСО"
 SWE_the_cross_we_bear_tt_1:0 "Для кожної окупованої §Yнордичної§! країни:"
 SWE_transport_plane_equipment_1:0 "Trp2"
 SWE_undermine_the_fascists:0 "Підірвати фашистів"
 SWE_upgrade_current_trait:0 "Покращити поточну рису лідера"
 SWE_varnplikt_desc:0 "Покладатися на невелику професійну армію буде недостатньо, щоб захистити наш суверенітет від наших більш агресивних сусідів. Тому ми запровадимо систему військової служби, щоб гарантувати, що всі чоловіки військового віку мають хоча б певну військову підготовку."
 SWE_volvo_desc:0 "Volvo заслужила репутацію виробника міцних, надійних компонентів і транспортних засобів. Ми повинні розвивати їхній успіх, адаптуючи їхні цивільні проєкти вантажівок і двигунів до військового застосування."
