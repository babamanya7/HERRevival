 ARG_political_events.10.t:0 "Приборкання військового невдоволення"
 ARG_political_events.12.b:0 "Їхня пропозиція для нас нічого не значить."
 ARG_political_events.37.desc:0 "Жахлива новина. [ARG.GetAdjective] уряд відмовився від нашої пропозиції поступитися островами в обмін на мир. Ми повинні готуватися до подальших боїв, і тепер нам доведеться витрачати наші ресурси на захист ще одного фронту."
 ARG_refused_embargo_idea:0 "Відхилили запит на ембарго"
 ARG_release_hellmuth_desc:0 "Осмар Гельмут — [ARG.GetAdjective] німецького походження, який за нашого старого уряду був заарештований після того, як був виявлений як колаборант з фашистським урядом у [GER.GetNameDef]. Ми повинні негайно звільнити його та найняти в наше власне розвідувальне агентство."
