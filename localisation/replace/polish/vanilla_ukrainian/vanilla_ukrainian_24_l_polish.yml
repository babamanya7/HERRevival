 POR_ship_torpedo_sub_1:0 "4x 450-мм торпедний апарат"
 POR_the_popular_front_bloc_desc:0 "Тепер, коли ми підкреслили нашу іберійську ідентичність і консолідували нашу націю як [Root.GetName], ми повинні поширювати комунізм за кордоном і шукати союзників, готових приєднатися до нашої справи та разом боротися проти тиранії та гноблення."
