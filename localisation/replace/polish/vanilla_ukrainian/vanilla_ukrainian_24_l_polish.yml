 uk_balkan_strategy_desc:0 "Багато країн на Балканах є пробританськими і бачать ту ж загрозу з боку Центральної Європи, що і ми. Якщо ми скористаємося можливістю і підтримаємо їх на ранній стадії, то зможемо забезпечити їхню лояльність, хоча й ціною роздратування їхніх реваншистських сусідів."
 uk_china_focus_desc:0 "Хоча китайські націоналісти називають себе ворогами наших колоніальних зусиль, вони опинилися у пастці між ворогами, маючи надто мало союзників. Якщо ми достукаємося до них, можливо, вони захочуть змінити свою політику."
 uk_service_focus_desc:0 "Завдяки ротації військовослужбовців збройних сил на колоніальних станціях і назад додому вони можуть дізнатися про умови на різних фронтах, отримати досвід і поділитися ним зі своїми товаришами на батьківщині."
 uk_turkey_focus_desc:0 "Вони не зобов'язані нас любити, але Туреччина мусить знати достатньо, щоби боятися наших лінкорів..."
 unlocks_decisions_to_further_improve_rwanda_and_burundi:0 "Відкриває рішення для подальшого §Yполіпшення§! та §Yрозвитку§! §YРуанди-Урунді§!"
 unruly_falangist_marionette:0 "Непокірна фалангістська маріонетка"
 usa.1.b:0 "Ні, це не буде потрібно."
 usa.11.t:0 "Рузвелт проти МакАртура"
 usa.14.d:0 "Наш великий зразок для наслідування, Нацистська Німеччина, зрадила свої найглибші принципи і об'єдналася з великим ворогом: комуністами. У міру того як знання поширюються, хвилювання слідують за ними. Люди були готові йти за нами так далеко через страх перед комуністичною революцією, але через відступ Німеччини наше велике відродження ставиться під сумнів."
 usa.20.a_tt:0 "[Root.GetNameWithFlag] отримає: §Y$american_influence_drift_democratic$§!"
 usa.43.a:0 "Ганебно."
 victor_denain:0 "$FRA_victor_denain$"
 war_escalation_level_tt:0 "§YПоточна ескалація війни§!\nРівень ескалації збільшується з часом, а також унаслідок різних дій, які вживає Італія.\n\nТривалість війни: [?ETH.ETH_escalation_time_increase_total|=Y]\nІталія розпочала великий наступ (+1) [GetItalianRenewedOffensiveText]\n\nІталія виділила принаймні 25 регулярних дивізій (+1) [GetItalian20DivisionsText]\n\nІталія виділила принаймні 300 літаків (+1) [GetItalianAircraftsText] [GetDefendTheNorthMissionText][GetDefendTheSouthMissionText][GetDefendHararMissionText][GetDefendTheCapitalMissionText]"
 war_justification.216.d:0 "«Мої опоненти хотіли б, щоб ви повірили, що моє правління схоже на правління [ROOT.GetRulingParty] у [ROOT.GetName]. Вони сильно помиляються. У той час як успіхи [ROOT.GetLeader] є результатом нещодавнього захоплення, деструктивного масового руху, що прагне примусити інші нації до покори, [From.GetRulingParty] стоїть в опозиції до цього руху, як той, хто не підкориться. Я готовий зробити все необхідне для усунення цієї загрози, навіть якщо це означатиме війну».\n\nРежим [From.GetLeader] проводить ворожу політику по відношенню до [ROOT.GetAdjective]ої нації. Наші далекоглядні плани щодо майбутньої величі присоромили їхню націю, і не дивно, що вони відчувають загрозу."
 war_justification.220.t:0 "[ROOT.GetLeader] виступає за вторгнення до [From.GetName]"
 war_justification.301.t:0 "[ROOT.GetLeader] піддається критиці за слабку зовнішню політику"
 war_propaganda_film_industry_desc:0 "[ROOT.GetImportOrDomesticFilmIndustryDesc]"
 war_receiver_desc:0 "$COUNTRY|UY$ веде оборонну війну."
 warrior_code:0 "Кодекс воїнської честі"
 warrior_traditions_idea:0 "Воїнські традиції"
 wtt_britain.24.a:0 "Чудова ідея."
 wtt_britain_lease_azores.4.desc:0 "Військові дії в Європі закінчилися, та [POR.GetAdjective]а влада нагадує, що Азорські острови були передані нам лише на час війни. Настав час повернути їх колишньому власнику."
 wtt_china_shared.12.desc:0 "[From.GetLeader] звернувся до лідера [USA.GetLeader] з пропозицією відправити одного з наших генералів як начальник штабу [From.GetAdjective]ої армії.\n\nТаким чином ми заслужимо особисту повагу з боку лідера [From.GetLeader], а наш генерал отримає безцінний бойовий досвід, і у разі війни [From.GetLeader] надасть нам війська.\n\nЯкого генерала вибрати?"
 wtt_germany.1006.desc:0 "Servizio Informazione Militare (Служба військової розвідки) повідомляє про підозрілу активність серед монархістських кіл. Схоже, що деякі з відданих лише королю нещодавно контактували з іноземними агентами — німецькими. Схоже, монархістів вербують і готують до протидії нашому великому лідеру. Але ще не все втрачено. Ми можемо надіслати банди для розправи з ними, поки в нас є така можливість. Як діяти?"
 wtt_germany.67.a:0 "Самі винні."
 wtt_germany.70.desc:0 "[From.GetAdjective]ий уряд відповів на нашу пропозицію увійти до Австро-Угорської імперії. Його представники недвозначно дали зрозуміти, що ніколи з власної волі не погодяться з нашою провідною роллю в подібній задумі."
 wtt_germany.71.desc:0 "Обидві наші сусідні держави, спадкоємці Австро-Угорщини, прийняли пропозицію приєднатися до нас і відновити таким чином Австро-Угорську імперію. Широкі маси зустріли підписання договору святковим тріумфуванням на вулицях, а [GER.GetAdjective]ий уряд привітав нас із тим, що ми знову увійшли до їхнього альянсу."
 wtt_germany.72.t:0 "[From.GetName] пропонує економічну інтеграцію"
 wtt_japan.123.t:0 "Опір фашистів ламається"
 wtt_japan.13.desc:0 "Із якихось причин держава [From.GetNameDef] відхилила нашу пропозицію укласти пакт про ненапад."
 wtt_japan.22.desc:0 "Процес заміни наших правих генералів та чиновників тими, хто поділяє ліві погляди і кого ми раніше неофіційно відправили у вигнання до держави [From.GetNameDef], завершено."
 wtt_japan.31.t:0 "Доля імператорської сім'ї"
 wtt_manchukou.1.b:0 "Нехай спробує."
 wtt_news.30.b:0 "Вони назвали вбивство правосуддям!"
 wtt_news.32.e:0 "Ми маємо скористатися цим собі на благо."
 wtt_news.34.c:0 "Добровольці? Швидше, найманці!"
 wtt_news.36.b:0 "Це була не випадковість."
 wtt_news.42.c:0 "Це значно допоможе нашим зусиллям."
 wtt_news.45.t:0 "[new_leader.GetLeader] очолює національний уряд Китаю"
 wtt_news.68.desc:0 "У міру встановлення контролю над своїми сусідами [From.GetOldAdjective]а держава все виразніше користується історичними паралелями у явних спробах об'єднати народи під своїм керівництвом. Досягнення імперії Маджапагіт зокрема відверто романтизуються, але пропаганда вже вплинула на громадську думку.\n\nСьогодні [From.GetOldAdjective]ий уряд зробив черговий крок і оголосив про зміну назви країни на «[From.GetNameDef]», віддавши тим самим честь спільній історичній спадщині регіону."
 wtt_news.7.t:0 "Польща повертає Данциґ"
 wtt_political_organisation.5.t:0 "Повідомлення з області [state.GetName]"
 wtt_political_organisation.6.a:0 "Ми будемо стежити за розвитком ситуації."
 wtt_prc.10.desc:0 "Слідом за створенням Уряду національної оборони [From.GetNameDef] заявив, що не зазнає «зайвої самостійності та непокори». Війна з Японією стає все більш неминучою, і будь-хто, хто не підтримує Уряд національної оборони, вважатиметься можливим ворогом. [From.GetLeader] відкрито сказав, що не чекатиме початку війни, щоб виступити проти правителів, які відмовляються підкорятися."
 wtt_prc.12.desc:0 "З причин, що не піддаються розумному поясненню, [From.GetLeader] відмовляється співпрацювати з нами навіть з найголовніших питань. Він стверджує, що ми лише зграя бандитів, яких скоро винищуть, і закликає інших правителів приєднатися до нього."
 wtt_the_hump.3.t:0 "[From.GetNameDefCap] поновлює авіаперевезення через «Горб»"
 wtt_warlord.2.t:0 "[From.GetNameDefCap] погоджується"
 wtt_warlord_vs_prc.2.a:0 "[communist_china.GetLeader] відправиться до Москви й усе вирішить."
 wtt_xian_incident.2.t:0 "[From.GetLeader] прибуває до Сіаня"
 wtt_xian_incident.4.a:0 "Мабуть, він має рацію."
 wtt_xian_incident.9.b:0 "Він досі потрібен."
 wuw_GER_chinese_diplomacy.1.desc:0 "\nНаші великі союзники із заходу, [FROM.GetAdjective], надіслали нам вантаж зброї та боєприпасів. Але це ще не все — вони також надіслали інженерів та промисловців, які допоможуть нам у розбудові власної військової промисловості після століть приниження."
 wuw_GER_diplomacy.21.t:0 "[FROM.GetNameDefCap] приєднується до [ROOT.GetFactionName]"
 wuw_GER_diplomacy.27.a:0 "Чудово!"
 wuw_GER_diplomacy.30.a:0 "Чудові новини!"
 wuw_GER_diplomacy.31.t:0 "[FROM.GetAdjective] відкидають нашу торгову пропозицію"
 wuw_GER_diplomacy.39.t:0 "[FROM.GetNameDefCap] передає територію"
 wuw_GER_diplomacy.55.desc:0 "[FROM.GetLeader] виявився безвідповідальним лідером, якому байдуже на добробут своєї країни. Ми знайдемо інших партнерів."
 wuw_GER_diplomacy.65.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відповів, що задля безпеки майбутнього своєї держави він приймає наші умови та негайно розпочне виплати."
 wuw_GER_diplomacy.81.desc:0 "Наше існування як Народного комісаріату добігло кінця. Лідери [FROM.GetAdjective] визнали наші успіхи й пропонують повністю інтегруватися в їхню державу. Незалежності ми втратимо, але вони обіцяють піклуватись про наш народ."
 wuw_GER_diplomacy.82.a:0 "Скористаймося цими гвинтівками!"
 wuw_GER_diplomacy.84.t:0 "[FROM.GetNameDefCap] вимагає більшої пролетарської солідарності"
 wuw_GER_legions.3.t:0 "Можливість співпраці в Локоті"
 wuw_GER_military_events.2.b:0 "Зробимо з нього приклад!"
 wuw_GER_monroe.12.a:0 "Розв’яжемо це силою!"
 wuw_GER_monroe.13.t:0 "Іноземне втручання дестабілізує регіон"
 wuw_GER_mutual_guarantees.1.t:0 "[FROM.GetNameDefCap] пропонує взаємну співпрацю"
 wuw_GER_realpolitik.18.a:0 "Великий день для [ROOT.GetAdjective] нації!"
 wuw_GER_realpolitik.25.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відповів на наше запрошення в альянс із великим обуренням, заявивши, що жодне партнерство між нашими державами неможливе тепер і в майбутньому. Схоже, вони не бажають нашої допомоги у поверненні оттоманських земель..."
 wuw_GER_realpolitik.26.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] надіслав дипломатів до нашої столиці для обговорення перспективи тісніших торговельних зв'язків із [FROM.GetAdjective] нацією. Це наблизить наші відносини, але також дозволить їм купувати наші ресурси за нижчими цінами, що може нашкодити нашій економіці."
 wuw_GER_realpolitik.35.a:0 "Жахлива новина..."
 wuw_GER_realpolitik.6.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб ми підкорилися їхній владі й стали автономним регіоном у складі їхньої держави, як це було передбачено у договорі Брест-Литовськ. Чи підкоримося ми цим вимогам?"
 wuw_GER_realpolitik.60.b:0 "Перемога або смерть!"
 wuw_GER_realpolitik.63.b:0 "Мені це здається підозрілим..."
 wuw_GER_realpolitik.9.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що наші вимоги ґрунтуються на документах, які не мають жодної цінності, та публічно засудив нашу державу. Схоже, вони налаштовані боротися за свою свободу..."
 wuw_GER_reichskommissariats.15.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Балканському райхскомісаріаті, нам слід визначити не лише її призначення, а й те, хто очолить місцеве населення та забезпечить виконання нашої політики. Чи слід нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще використати місцевого колаборанта?"
 wuw_GER_reichskommissariats.4.t:0 "Керівництво України"
 wuw_GER_reichskommissariats.6.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_releasable.1.t:0 "Столиця для німецького народу"
 wuw_GER_weltpolitik.1.t:0 "[FROM.GetName] вимагає повернення колоній"
 wuw_GER_weltpolitik.3.t:0 "[FROM.GetNameDefCap] не повертає наші колонії"
 wuw_HUN_a_mobile_army:0 "Мобільна армія"
 wuw_HUN_a_reformed_navy:0 "Реформований флот"
 wuw_HUN_announce_the_gyor_program:0 "Оголосити програму Дьорі"
 wuw_HUN_bringing_the_air_battle_to_the_seas:0 "Повітряний бій на морі"
 wuw_HUN_carrying_on_arpads_legacy_desc:0 "Великий Арпад був головою союзу мадярських племен і натхненням для [ROOT.GetLeader]. Його династія принесла [ROOT.GetNameDef] велич. Нам варто наслідувати його приклад."
 wuw_HUN_construct_the_arpad_line:0 "Будівництво лінії Арпада"
 wuw_HUN_cruiser_investments:0 "Інвестиції в крейсери"
 wuw_HUN_establishing_a_new_dynasty_tt:0 "Можна буде обрати короля Угорщини: §YМіклоша Горті§! або §YІштвана Горті§!"
 wuw_HUN_expand_on_the_weiss_wm_16_desc:0 "Ми повинні розвивати моделі Weiss WM-16 Budapest, щоб досягти нових технологічних проривів у виробництві бомбардувальників."
 wuw_HUN_heirs_of_the_huns_desc:0 "Існує багато теорій про походження нашого народу — фінно-угри, тюрки... Але ми повинні підтвердити, що є істинними спадкоємцями гунів, і принесемо руйнування кожному, хто стане нам на заваді."
 wuw_HUN_intervene_in_czechoslovakia:0 "Втрутитись у справи [CZE.GetNameDef]"
 wuw_HUN_invest_in_ludovica_academy_desc:0 "Королівська угорська академія оборони Людовіки — наш інститут підготовки офіцерів. Його потрібно розширити, щоб наші генерали отримували краще навчання."
 wuw_HUN_invite_otto_to_the_throne:0 "Запросити Отто на трон"
 wuw_HUN_join_the_axis:0 "Приєднатися до Осі"
 wuw_HUN_joint_aluminum_mining_company_desc:0 "Оскільки алюміній є важливим ресурсом для сучасної воєнної промисловості, ми можемо заручитися підтримкою [GER.GetAdjective] для розширення шахт на півночі нашої країни."
 wuw_HUN_news_events.3.b:0 "Ми повернемо колишню славу!"
 wuw_HUN_news_events.5.b:0 "Новий ворог з’явився"
 wuw_HUN_promote_hungarianism_desc:0 "Щоб знову відновити нашу колишню славу, ми повинні підтримати тих, хто щиро цього прагне — навіть якщо вони радикальні. Настав час просувати новітні ідеї гунґаризму, засновані на вченні католицького єпископа Отокара Прохаски, що закликає захищати інтереси Угорщини будь-якою ціною."
 wuw_HUN_reclaim_the_slovak_possessions_tt:0 "Відкриває рішення для §Yреінтеграції старих угорських територій§! у Словаччині"
 wuw_HUN_revenge_for_the_romanian_humiliations_desc:0 "У війні 1918–1919 років нас було принижено, а Трансільванію відібрано. Щоб повернути честь, ми повинні повернути ці землі, які належать нам по праву."
 wuw_HUN_soviet_hungarian_war_indsutry_desc:0 "Ми закликаємо СРСР інвестувати в нашу військову промисловість, аби краще захищати комуністичних союзників."
 wuw_HUN_the_botond:0 "Botond"
 ww_BEL_event_diplomatic.11.a:0 "Відійдемо від прірви."
 ww_BEL_event_diplomatic.12.desc:0 "Тільки що надійшло повідомлення від керівництва [FROM.GetAdjective]. Оскільки світ навколо них стає все більш ворожим, вони турбуються про свої можливості захистити свою країну. Наша допомога була б надзвичайно корисною і важливою для підтримки миру в регіоні."
 ww_BEL_event_diplomatic.15.t:0 "[FROM.GetNameDefCap] Просить обладнання"
 ww_BEL_event_diplomatic.16.a:0 "Звісно, ми допоможемо"
 ww_BEL_event_diplomatic.21.a:0 "Чудова новина!"
 ww_BEL_event_diplomatic.23.desc:0 "Делегація [FROM.GetAdjective] звернулася до нас з пропозицією щодо дослідницької ініціативи для всієї [FROM.GetFactionName]. Як близькі союзники, ми повинні ділитися своїми технологіями, щоб просувати весь Союз."
 ww_BEL_event_diplomatic.25.t:0 "[FROM.GetNameDefCap] Відмовляє приєднатися до групи досліджень Європейського Союзу"
 ww_BEL_event_political.4.t:0 "Бюджетна криза"
 ww_BEL_event_political.5.b:0 "Спак має політичну підтримку, щоб пережити цей момент"
 ww_BEL_event_political.8.desc:0 "Наш народ довгий час був розділений мовами. Валлони говорять французькою, а фламандці — нідерландською, що створює розкол між групами та перешкоджає розвитку більш єдиного [ROOT.GetName]. Нам слід прийняти рішення щодо нашої офіційної мови, інакше непорозуміння між друзями, неправильно виконувані військові накази та помилки правосуддя будуть постійно частиною повсякденного життя [ROOT.GetAdjective]."
 ww_BEL_event_spanish_interaction.2.b:0 "Їм потрібне підтримувальне обладнання!"
 ww_BEL_event_spanish_interaction.9.t:0 "[FROM.GetNameDefCap] Розпускає $BEL_SPR_alliance$"
 ww_BEL_event_war.10.b:0 "Ми хочемо все!"
 ww_BEL_event_war.6.c:0 "Це просто привід для легітимного опору. Ні."
 ww_congo.11.t:0 "Французи погоджуються з нашими вимогами"
 ww_congo.17.a:0 "Баланс сил в Африці змінився"
 ww_congo.18.c:0 "Єдність дає силу"
 ww_congo.20.t:0 "Революція в Руанді"
 ww_congo.35.a:0 "Нам треба покласти цьому кінець негайно!"
 ww_congo.53.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef] та народу Бурунді, звернувся до нас з вимогою передати їм всі території з більшістю населення бурундійців. Як ми повинні відповісти?"
 ww_congo.56.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef] та народу Руанди, звернувся до нас з вимогою передати їм всі території з більшістю населення руандійців. Як ми повинні відповісти?"
 ww_congo.67.b:0 "Це занадто небезпечно"
 ww_congo.7.t:0 "Бельгійці схвалюють нашу схему виробництва їжі"
 ww_congo.72.t:0 "Ян Зумбах прибуває"
