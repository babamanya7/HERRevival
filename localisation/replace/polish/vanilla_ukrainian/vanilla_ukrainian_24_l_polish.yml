 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_ASKSTATECONTROL:0 "\nДержава $COUNTRY|Y$ §Rвідхилила§! наш запит про передачу контролю над окупованою областю."
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_LEND_LEASE_EXISTING:0 "\nДержава §Y$COUNTRY$§! §Rвідмовилася§! від наших змін ленд-лізу!\n\nВони більше не отримуватимуть нашу матеріальну підтримку."
