 JAP_establish_synthetic_fuel_joint_venture_tt:0 "Якщо §Yвелика західна держава§! §Yгарантує незалежність§! або має принаймні §Y75§! думки про §Y[ROOT.GetNameDef]§!, [ROOT.GetNameDef] отримує додатковий бонус до технологій категорії $cat_synth_oil$ та §Y$synthetic_refinery$§!"
