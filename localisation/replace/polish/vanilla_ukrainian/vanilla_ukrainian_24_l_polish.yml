 BRA_support_weapons4:0 "M1941 Johnson MG & M2 4.2 inch mortar"
 BRA_sway_the_cangaco:0 "Схилити канґасу на нашу сторону"
 BRA_sway_the_cangaco_desc:0 "Канґасу роками боровся проти різних режимів, які панували над нацією. Хоча вони навряд чи є марксистами, ці бандити мають сильну підтримку з боку сільського селянства за перерозподіл місцевого багатства. Можливо, ми зможемо залучити їх та їхній досвід до нашого революційного руху?"
 BRA_sway_the_neighbors_desc:0 "Ми повинні використовувати всі необхідні засоби, щоб підвищити класову свідомість серед наших сусідів та підтримати їх у скиданні кайданів буржуазного гніту."
