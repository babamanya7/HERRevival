 FIN_integrate_kola_and_karelia_tt:0 "Вимагає контролю над територіями §Y[213.GetName]§!, §Y[215.GetName]§! та §Y[216.GetName]§!.\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! отримує §Y$take_state_focus$§! ціль війни проти будь-якої країни, яка відхиляє [ROOT.GetAdjective]і вимоги."
 FIN_joint_research_and_development_program_desc:0 "Фінська ініціатива з метою сприяння технологічним дослідженням і розробкам."
 FIN_low_trust_range:0 "Низький рівень довіри"
 FIN_marine_jaeger_divisions:0 "Єгерські підрозділи морської піхоти"
 FIN_marine_jaeger_divisions_desc:0 "Створені наприкінці 1934 року єгери морської піхоти Фінляндії, Rannikkojääkärit, були сформовані як елітна частина морської піхоти ВМС Фінляндії. Ці добре навчені та адаптовані солдати оснащені для виконання різноманітних місій, від берегової оборони до десантних нападів і буде ключовим активом у абияких можливих боях уздовж узбережжя Балтійського моря."
 FIN_mio_trait_yhteissisus_modern_premises:0 "Сучасні простори Yhteissisu"
 FIN_motion_of_no_confidence_cost_unavailable_tt:0 "Рішення §Y$FIN_motion_of_no_confidence_against_leader$§! буде недоступним."
 FIN_motti_tactics_category_desc:0 "Стратегія motti передбачає оточення та ізоляцію ворожих підрозділів, щоб пошкодити їхні матеріально-технічні та комунікаційні лінії. \nРеалізація цього підходу вимагає ретельного планування та навчання сил оборони, щоб забезпечити їх ефективність на полі бою, але це дозволить перехитрити ворога і вдарити там, де вони найменше очікують."
 FIN_motti_tactics_decision_cost_dynamic_cp_pp_tooltip:0 "Прийняття рішення коштує £command_power §Y[?FIN_motti_decision_cost]§! £pol_power §Y[?FIN_motti_decision_cost]§!"
 FIN_motti_tactics_desc:0 "Стратегія motti передбачає оточення та ізоляцію ворожих підрозділів з метою пошкодити їхні матеріально-технічні та комунікаційні лінії. Реалізація цього підходу вимагає ретельного планування та навчання сил оборони, щоб забезпечити їх ефективність на полі бою. Використовуючи та вдосконалюючи motti warfare, ми зможемо перехитрити ворога і завдати удару там, де вони найменше очікують."
 FIN_national_armor_focus_desc:0 "Оскільки військові дії посилюються, [ROOT.GetName] має звернути увагу на свою власну військову промисловість. Зосереджуючись на розвитку можливостей внутрішнього виробництва танків, ми прагнемо зміцнити наші бронетехнічні сили та створити транспортні засоби, адаптовані до їхніх унікальних потреб на поле бою."
 FIN_personal_agenda_ryti_tt:0 "§G$FIN_bop_modifier_dream_of_greater_finland$§!: Окупація осердних земель Фінляндії у власності ворога збільшить £GFX_power_balance_texticon §Yдовіру громадськості§!.\n  - §R$FIN_bop_modifier_concerning_support_for_socialists$§!: Більш ніж §Y9%§! підтримки демократії або комунізму зменшить £GFX_power_balance_texticon §Yдовіру громадськості§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_reach_out_to_scandinavia_shared_focus_tree_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! завершує спільний фокус §Y$NORDIC_reaching_out_to_our_neighbors$§!."
 FIN_red_finland_DEF:0 "Червона Фінляндія"
 FIN_resignation_of_kallio:0 "Відставка $FIN_kyosti_kallio$"
 FIN_social_democracy_desc:0 "Ми бачили невдачі та жахи, які відбуваються, коли революція в більшовицькому стилі обрушується на націю. Якщо ми хочемо створити міцне суспільство, яке принесе користь робітничому класу, це має бути демократичними, мирними засобами, де це можливо."
