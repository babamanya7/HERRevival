 SOV_dismiss_the_counter_revolution_tt:0 "Зменшує політичну параною за рахунок майбутньої стабільності та зменшення військової підтримки."
 SOV_end_the_khalkhin_gol_conflict:0 "Завершити конфлікт на Халхин-Ґолі"
 SOV_expand_the_red_fleet_desc_default:0 "$SOV_expand_red_fleet_desc$"
 SOV_expanded_exploitation_of_gold_mines_desc:0 "[SOV.GetAdjective]і інвестиції в інфраструктуру та промислова допомога в північних територіях держави [ROOT.GetNameDef] дозволили нам підвищити ефективність експлуатації наших золотих копалень у регіоні."
 SOV_experts_in_camouflage:0 "Експерти з камуфляжу"
 SOV_found_the_pcdi_desc_default:0 "Наша оборонна промисловість стала дуже великою, і тепер потребує спеціального урядового органу для координації, якщо ми хочемо, щоб вона розвивалася далі. Ми заснуємо Народний комісаріат оборонної промисловості."
 SOV_ground_based_training_desc:0 "Після повідомлень про серію авіакатастроф і аварій під час навчань НКВС розпочав перевірку у ВПС і, дотримуючись вказівок агентів, призначених для цієї справи, більше не проводитиме льотні навчання, поки триває розслідування."
 SOV_heavy_tank_equipment_2:0 "КВ-1"
 SOV_increase_weekly_paranoia_in_trait_tt:0 "§Y[ROOT.GetLeader]§!: Змінити рису §Y$stalin_political_paranoia$§!:\nЩотижнева політична параноя: §R+1§!"
 SOV_infiltrate_atomic_program_tt:0 "Ми спробуємо зібрати життєво важливу інформацію, пов'язану з [GetAtomicProgramName], щоби прискорити власну національну атомну програму.\n\nШанси на успіх у цій операції зростуть, якщо §Y[FROM.GetFlag][FROM.GetNameDef]§! матиме високу комуністичну підтримку.\n"
 SOV_infrastructure_effort:0 "Розвиток інфраструктури"
 SOV_kim_philby:0 "Кім Філбі"
 SOV_leader_of_the_party_and_the_people_trait_tt:0 "§Y[ROOT.GetLeader]§!: Змінити відповідну рису (§Y$stalin_inheritor_of_lenin$§! або §Y$stalin_servant_of_lenin$§!):\n$MODIFIER_STABILITY_POPULARITY_FACTOR$: §G+15.00%§!\n$MODIFIER_STABILITY_DEFENSIVE_WAR_FACTOR$: §G+40.00%§!\n$political_advisor_cost_factor$: §G-25%§!\n"
 SOV_light_cruiser_4_desc:0 "The Sverdlov class cruisers (Project 68bis) were the last gun cruisers of the Soviet Navy and were improved versions of the preceding Chapayev class. Compared to the Chapayevs, they had the same main armament, machinery and armor protection, but had increased fuel capacity for greater range, improved underwater protection, an increased anti-aircraft battery, and slightly better seaworthiness. They were designed for the roles of convoy hunting and capital ship escorts. Due to the advent of the missile age, many ships were cancelled or not finished."
 SOV_merge_aircraft_plant_3:0 "Об'єднати завод «VEF»"
 SOV_merge_aircraft_plants_desc:0 "Хоча конкуренція між дизайнерами створює природний стимул для постійного вдосконалення, вона також витрачає ресурси на дублюючі зусилля, які ми не можемо собі дозволити. Ми мусимо об'єднати наші дизайн-бюро, щоб позбутися цього марнотратства."
 SOV_mine_warfare:0 "Мінна війна"
 SOV_modern_tank_aa_equipment_1:0 "ЗСУ-57-2"
 SOV_molotov_line_forts_6:0 "Додати §Y6 наземних укріплень§! $SOV_molotov_line_forts_where$"
 SOV_molotov_ribbentrop_pact:0 "Пакт Молотова–Ріббентропа"
 SOV_noisy_meeting_in_paris_desc:0 "Placeholder: Not yet completed, makes Stalin suspicious of one of his loyal poltical advisors"
 SOV_northern_crackdown_timer_desc:0 "НКВС вирішив зосередитися на Північному регіоні, проводячи масові арешти та допити, щоби забезпечити вірність населення регіону."
 SOV_nothing_is_left_behind_desc:0 "Якщо наші війська будуть змушені відступити, ми простежимо за тим, щоб вони не залишили після себе нічого, що може бути використано ворогом."
 SOV_operation_zet_desc:0 "Хоча Ґоміньдан є реакційним, здається малоймовірним, що Мао і його бренд комунізму візьмуть гору в Китаї. Ми мусимо прагнути поліпшити відносини з Чаном Кайші; безглуздо анахронічна Японська імперія все одно скоро розвалиться."
