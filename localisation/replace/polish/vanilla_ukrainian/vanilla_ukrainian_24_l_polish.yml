 DIPLOMACY_REQUEST_FOREIGN_MANPOWER_TITLE:0 "Попросити підтримку гарнізону"
 DIPLOMACY_REVOKE_GUARANTEE_TITLE:0 "Відкликати гарантію"
 DIPLOMACY_SEND_ATTACHE_ACTION_DESC:0 "Відправивши нашого аташе, ми зміцнимо співпрацю у військовій галузі та зможемо ефективніше наростити нашу міць."
 DIPLOMACY_WAR_TITLE:0 "Оголосити війну"
 DISABLE_TASK_FORCE_UNDERWAY_REPLENISHMENT:0 "§GКлацніть§!, щоби §Hвимкнути§! §Hпоповнення в морі§! для вибраних оперативних груп."
 DOD_hungary.100.t:0 "Угорщина вимагає передати Словаччину"
 DOD_hungary.102.t:0 "[From.GetNameDefCap] відмовляється віддати Словаччину"
 DOD_hungary.106.t:0 "[From.GetLeader] порушує цю обіцянку"
 DOD_hungary.116.desc_no_deal:0 "Під час переговорів з нашою делегацією радянсько-угорська сторона знову озвучила свої вимоги. Якщо ми не передамо Бессарабію та Трансільванію відповідним заявникам, вони готові вирішити питання військовим шляхом."
 DOD_hungary.12.a:0 "Ми згодні."
 DOD_hungary.122.b:0 "Звернутися до Німеччини."
 DOD_hungary.124.t:0 "[From.GetNameDefCap] пропонує розділити Чехословаччину"
 DOD_hungary.141.a:0 "Ми мусимо завдати удару, поки ще не пізно!"
 DOD_hungary.141.t:0 "[FROM.GetNameDefCap] заручилася [From.GetAdjective] підтримкою для переозброєння"
 DOD_hungary.142.a:0 "Відмінно."
 DOD_hungary.147.a:0 "Молитимемося, що вони мають рацію."
 DOD_hungary.154.desc:0 "У [From.GetAdjective] ВПС проходять випробування нових важких винищувачів. За даними нашого військово-повітряного аташе, наша новітня модель має здобути гору. Ми чекаємо на офіційний запит від [From.GetAdjective] уряду. \n\nКерівництво заводу-виробника повністю схвалює угоду, але продаж новітньої військової техніки іноземній державі може завдати шкоди нашій національній безпеці. Чи варто нам дозволити продаж цих літаків?"
 DOD_hungary.30.desc:0 "Угорська влада звернулася до нас із проханням переглянути умови Тріанонського договору. Вони пропонують змінити обмеження на чисельність військ, що накладаються договором, щоб Угорщина змогла зміцнити свою армію. Угорщини також дозволять збільшити витрати бюджету на розширення та модернізацію військової промисловості \n\nОскільки країна перебуває під жорстким контролем демократичного уряду, наші дипломати схильні погодитися на цю пропозицію."
 DOD_hungary.34.t:0 "[From.GetName] підтримує Угорщину"
 DOD_hungary.36.desc:0 "Незважаючи на сильний політичний тиск, який чинить [From.From.GetNameDef], [From.GetNameDef] категорично не бажає обговорювати це питання. Схоже, вони досі побоюються, що ми звернемо нашу зброю проти них.\n\nМи використовували всі дипломатичні важелі і тепер змушені чекати, коли нам представиться шанс знову повернутися до цього питання."
 DOD_hungary.40.desc:0 "[HUN.GetLeader] сьогодні заявив про те, що, починаючи з цього моменту, [HUN.GetNameDef] більше не визнає умови договору. Він оголосив, що ця угода не має юридичної сили, оскільки її нав'язали Угорщини Уряд Угорщини навіть не спромігся формально повідомити нам про своє рішення.\n\n Багато наших чиновників вимагають жорстко відповісти на цей демарш, якщо ми покажемо угорцям, що не боїмося їх, вони неодмінно підуть назад., Що ми блефуємо."
 DOD_hungary.41.b:0 "Схоже, це якесь непорозуміння."
 DOD_hungary.61.a:0 "Нам проти них не вистояти."
 DOD_hungary.70.desc:0 "До світанку делегаціям, що беруть участь у конференції, вдалося знайти компроміс. Згідно з його умовами, ми отримаємо північну Трансільванію, а південні частини цієї території залишаться у Румунії. Румунська делегація вже погодилася на такі умови. Міністерство закордонних справ попереджає, що у разі неприйняття цієї пропозиції нам загрожує дипломатична ізоляція."
 DOD_hungary.71.t:0 "Конференція з Трансільванії: день 1"
 DOD_hungary.72.desc_HUN_nothing:0 "Угорська сторона запропонувала напрочуд примирливий варіант. Вся Трансільванія залишиться в Румунії в обмін на незначні пільги для етнічних меншин. Представник Румунії наполегливо пропонує нам погодитися на ці умови, обіцяючи, що через пільги будуть надані після підписання договору."
 DOD_romania.163.a:0 "Ніщо не забуто."
 DOD_romania.68.t:0 "Провал дипломатичних зусиль"
 DOD_romania.69.desc_GERITA:0 "Ми отримали другий ультиматум. Цього разу до вимог додалося схоже за текстом послання від послів держав [GER.GetNameDef] та [ITA.GetNameDef], які підтримали румунський план. Вони вимагають, щоби наші війська не заважали окупації, щоб уникнути зайвого кровопролиття."
 DOD_yugoslavia.30.a:0 "Натиснути на них."
 DOD_yugoslavia.33.b:0 "Це стає серйозно. Ми мусимо негайно придушити антинімецькі елементи!"
 DOD_yugoslavia.44.a:0 "Вони мусять зробити вибір."
