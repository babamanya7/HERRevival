 POL_boleslaw_piasecki:0 "Болеслав Пясецький"
 POL_can_boost_in_latin_america_tt:0 "Будуть відкриті рішення: §YПросувати фалангізм у Латинській Америці§!."
 POL_commerce_attack_desc:0 "Жоден флот не обходиться без підводних човнів. Наші підводні човни, як і решта флоту, мають бути організовані для оптимальної летальності."
 POL_complete_the_plan_desc:0 "Настав час підбити підсумки чотирирічного плану та підготувати плани на наступні чотири роки польської індустріалізації! Чим більше ми інвестуємо в Польщу та її промисловість, тим краще ми будемо підготовлені до того, що приховує в собі польське промислове майбутнє."
 POL_cv_fighter_equipment_3:0 "PZL.62 Pustułka Floty"
 POL_cv_fighter_equipment_3_short:0 "Pustułka Floty"
 POL_danzig_decisions:0 "«Вільне» місто Данциґ"
 POL_demand_pomerania:0 "Вимогти Померанію"
 POL_destroyer_3_desc:0 "Польський есмінець «Piorun» був побудований Британією на базі есмінців типу «N» для ВМС Польщі і був введений в дію у 1940 році. Володіючи водотоннажністю в 1770 тонн, есмінець відрізнявся швидкістю та надійністю. Він був озброєний шістьма 120-мм гарматами, п'ятьма 533-мм торпедними апаратами, відмінним протичовновим обладнанням та новітніми британськими радарами та сонарами."
 POL_diplomatic_mission_to_ITA:0 "Дипломатична місія в державу [ITA.GetNameDef]"
 POL_foreign_air_support:0 "Іноземна підтримка авіації"
 POL_greater_commonwealth:0 "Велика Річ Посполита"
 POL_heavy_fighter_equipment_3_short:0 "Lis"
 POL_henryk_floyar_rajchman:0 "Генрік Флояр-Райхман"
 POL_invest_in_lithuania:0 "Інвестувати в державу [From.GetNameDef]"
 POL_invest_in_the_old_polish_region_desc:0 "Нам слід модернізувати старі заводи в Кєльцях, Скаржиську, Радомі, Стараховицях та Островці, а також будувати нові, щоби зміцнити нашу промисловість."
 POL_invite_exiled_nobility_desc:0 "Хоча багато російських дворян відмовляються визнати законну спадщину нашого короля Анастасії, запрошення їх назад з обіцянкою дворянських титулів може спонукати їх змінити свою позицію і визнати її єдиною живою істинно народженою дочкою царя Ніколая II."
 POL_invite_the_baltics:0 "Запросити Балтію"
 POL_jet_tac_bomber_equipment_1_short:0 "Borsuk"
