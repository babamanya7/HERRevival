 GXC_medium_tank_aa_equipment_3_short:0 "PGZ 43"
 GXC_medium_tank_artillery_equipment_1:0 "PLZ 39"
 GetOppositionPartySupportersName_fascist:0 "Фашисти"
 HABSBURG_economic_cooperation_policy_desc:0 "На даний момент члени нашої федерації повністю самостійно керують своїми економіками. Хоча це, безумовно, надає кожному якомога більше свободи, це також перешкоджає економічній потужності федерації. Встановлюючи політику економічного співробітництва, ми не тільки допоможемо їм у розвитку, але й зможемо гарантувати, що ми спільно діятимемо перед обличчям більших економічних проблем."
 HABSBURG_supplying_the_federation:0 "Постачання Федерації"
 HABSBURG_supplying_the_federation_desc:0 "Оскільки наша федерація зростає, наше постачання та залізнична мережа повинні розвиватися разом із нею. Треба докласти зусиль, інакше ми ризикуємо перерости власну інфраструктуру та зазнати болісного та принизливого падіння."
 HABSBURG_the_strength_of_the_common_man:0 "Сильні сторони простої людини"
 HAI_communism_DEF:0 "Гаїтянська соціалістична республіка"
 HAI_democratic:0 "Гаїті"
 HBC_ADJ:0 "Хебей-чахарськ"
 HBC_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1:0 "Чжунсяо"
 HBC_democratic_party:0 "$CHI_democratic_party$"
 HBC_neutrality_party:0 "$CHI_neutrality_party$"
 HIGH_ORG_REGAIN:0 "Висока організація: $VAL|=+%2$"
 HINT_NO_TEMPLATE_NO_XP_TEXT:0 "Ви клацнули на сповіщення §YШаблон відсутній§!. Не хвилюйтеся! Дуже добре, що Ви дивитеся на сповіщення для пошуку відповідей: у них написана важлива інформація.\n\nІмовірно, Ви створили виробничу лінію, що виробляє артилерійське оснащення. На даний момент жодна з Ваших §Yдивізій§! не використовує цей тип озброєння, оскільки його нема в жодних §Yшаблонах дивізій§!.\n\nКоли Ви отримаєте більше £army_experience£ §Yдосвіду армії§!, артилерію можна буде додати у який-небудь шаблон. £army_experience£ Досвід армії накопичується, коли Ваші війська беруть участь у боях або армійських навчаннях.\n\nВи поки що можете проігнорувати це сповіщення, оскільки це навчання допоможе Вам, коли Ви наберете досить £army_experience£ досвіду армії."
 HINT_OFFICER_CORPS_SCREEN_TEXT_2:0 "Теоретики зменшують вартість наземної морської та повітряної §Yдоктрин§!, які зосереджуються на стратегії загалом. Вони встановлюються для кожної з гілок і бонуси до розгорнутих дивізій, флотів і повітряних полків."
