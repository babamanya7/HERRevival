 TTS_ferdinand_pius:0 "Фердинанд Пій Бурбон-Сицилійський"
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_STANDARD:0 "Ми обкладемо немусульман нашої країни податком на багатство, який забезпечить фінансування наших індустріальних проєктів, а [ROOT.GetNameDef] стане ще ближче до секуляризації."
 TUR_acquiesce_to_fundamentalists_desc:0 "Цій республіці не вижити без компромісів, навіть якщо для цього доведеться відмовитися від конституції, на якій ґрунтується її існування."
 TUR_acquiesce_to_fundamentalists_tt:0 "Ця й іще до §Y2§! додаткових £faction_tur_traditionalist §Yтрадиціоналістських областей§! почнуть тісніше співпрацювати з урядом."
 TUR_ataturk_health_poor_tt:0 "§YМустафа Кемаль Ататюрк§! вважатиметься §Yнездоровим§!."
 TUR_connecting_our_capitals:0 "Сполучення наших столиць"
 TUR_crowning_ourselves_with_the_fin_ugor:0 "Фіно-угорська спільність"
 TUR_cypriot_and_oniki_ilhak:0 "Кіпро-онікійський ілхак"
 TUR_disorganised_armed_forces_1_desc:0 "$TUR_disorganised_armed_forces_desc$"
 TUR_dissolve_the_ODPA_desc:0 "Західні держави вважають, що заборгованість османів дає нагоду вимогти від нас вірності їхній справі. Імперіалісти залишаються колишніми і старанно демонструють, що змінюватись не збираються. Час покінчити з старим пережитком нашого слабкого минулого, коли ми не могли за себе постояти."
 TUR_embed_kemalist_propagandists_into_state_desc:0 "Заради свого виживання ми мусимо докласти всіх зусиль, щоб ідеологія кемалізму оселилася в серцях якомога більшої кількості людей."
 TUR_etatism:0 "Етатизм"
 TUR_etatism_crisis_2:0 "Девальвація турецької ліри"
 TUR_etatism_stabilisation_desc:0 "Краса змішаної економічної моделі в тому, що у нас є можливість при необхідності застосувати негайні міри, і саме це ми зараз робили. Тепер у нас є відстрочка до наступного економічного зруху, але вічно вона тривати не буде. Ми мусимо використати цей час з розумом."
 TUR_fund_the_gemlik_silk_factory:0 "Фінансувати шовкопрядильну фабрику у Ґемліку"
 TUR_imperial_factories_desc:0 "У кемалістів була цікава ідея так званого етатизму, і, хоч ми ніколи не стали б відкрито підтримувати ідеологічний стовп кемалістів, не можна не визнати, що централізована організація та державний контроль засобів виробництва можуть бути... корисними. Не варто порівнювати це з комунізмом чи фашизмом — усі заводи належатимуть султанові. Ми лише керуватимемо ними від його імені!"
 TUR_integrate_the_fascist_council_desc:0 "Фашистська рада Реджепа Пекера досить довго існувала на периферії держави. Час почати інтеграцію турецьких фашистських цінностей у каркас кемалізму."
 TUR_integrated_armed_forces_desc:0 "Це амбіційна програма, але її варто продати. Зважаючи на те, як важко нам, невеликим націям, протистояти великим державам, ми вирішили заснувати багатонаціональні збройні сили Балканської Антанти. Ми будемо за необхідності допомагати один одному ресурсами, щоби спільно вистояти під напором імперіалістів."
 TUR_jet_fighter_equipment_2:0 "MKEK-8 Güç"
 TUR_kemalist_army_officers_decreased_power_loyal_desc:0 "Турецький офіцерський корпус — один із найпалкіших захисників кемалістських цінностей. При спробі завоювати підтримку народу кемалізм зіткнувся з деякими труднощами, але офіцерський корпус твердо налаштований підтримати уряд."
 TUR_kemalist_army_officers_minimal_power_neutral_desc:0 "Турецький офіцерський корпус був одним із найпалкіших захисників кемалістських цінностей, але тепер вони грають переважно церемоніальну роль."
 TUR_kemalist_influenced_state_effect_tt:0 "£faction_tur_kemalist §YКемалісти§! мусять зайняти доступні адміністративні посади в цій області."
 TUR_learning_from_the_tripolitanian_war_desc:0 "Ланцюжок подій, що привів до падіння імперії Османа, розгорнувся так стрімко, що мало хто встиг зробити належні висновки. Ми мусимо пам'ятати, як [ITA.GetAdjective] армія вторглася в Османську Лівію і відібрала її у нас."
 TUR_lift_the_ban_on_other_political_parties:0 "Зняти заборону інших політичних партій"
 TUR_patriotism_over_internationalism_desc:0 "Ми відкидаємо міжнародну природу троцькізму і радикальний марксизм заради національної форми соціалізму. Тяжкість життя робітників у всьому світі для нас на другому місці після тих труднощів, які зазнають робітники Туреччини, і саме це відрізняє кемалізм-соціалізм від радикальніших варіантів комунізму."
 TUR_permit_regional_elections_desc:0 "Туреччина — велика країна з безліччю релігій, культур та інтересів. Можливо, ми не надто погрішимо проти конституції, якщо дамо певний ступінь автономності всім суб'єктам нації, навіть тим, хто особливо сильно протестував проти кемалізму. Зрозуміло, все це заради національної безпеки."
 TUR_purchase_italian_light_tanks_desc:0 "Зараз неможливо створити сучасну армію, не забезпечивши її міцною, надійною бронею. Все просто — нам потрібні власні танки, а хто виробляє їх краще, ніж [ITA.GetNameDef]?"
 TUR_scout_plane_equipment_1:0 "THK Şahin"
 TUR_seize_religious_property_desc:0 "З початку релігія була бичем цієї республіки. Необхідно націоналізувати і закрити всі релігійні споруди країни і знайти найкраще застосування їх землям. Звільнившись від кайданів релігії, ми повною мірою розкриємо свій потенціал."
 TUR_ship_heavy_battery_1:0 "28 cm/50 SK L/50"
 TUR_ship_torpedo_2:0 "4x 533-мм торпедний апарат"
 TUR_supporting_the_east_desc:0 "Саме наші східні провінції забезпечують нам основну підтримку, але якість інфраструктури в них, як і раніше, жахлива. Підтримуючи схід, ми підтримуємо своїх послідовників і можемо краще підготуватися до операцій на сході та півночі."
 TUR_the_battle_for_our_nations_survival:0 "Боротьба за виживання нашої нації"
 TUR_the_chester_concession_desc:0 "У нас залишаються права на поступки, які Америка обіцяла нам понад десять років тому. Ми можемо пов'язати ступінь своєї участи у війні із вкладом Америки у добробут [TUR.GetAdjective] держави."
 TUR_the_montreux_convention_tt:0 "Ми скличемо §Yконвенцію§!, оголосивши про наш намір ремілітаризувати §YДарданелльську§! та §YБосфорську протоки§!. Потрібно бути готовими до негативної реакції §YРадянського Союзу§!."
