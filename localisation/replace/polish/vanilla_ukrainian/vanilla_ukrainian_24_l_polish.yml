 SWI_swiss_airplane_designs_desc:0 "Ми не можемо покладатися на наших сусідів щодо техніки, яка дозволяє нам оволодіти небом, тому що ми не можемо довіряти їм, що вони покірно нададуть нам знаряддя їхньої перемоги."
 SWI_the_army_position_desc:0 "Ми розташуємо наші громадянські ополчення та нашу постійну армію на кордонах [ROOT.GetName], тож їм знадобляться укріплення, щоби посилити свою здатність утримувати вторгнень."
 SWI_the_national_front:0 "Національний фронт"
 SWI_trading_with_switzerland_military:0 "Імпорт військового виробництва зі Швайцарії"
 SWI_weapons_of_democracy_desc:0 "Перш ніж ворог зробить неймовірне, ми повинні бути готові зробити все необхідне, щоби зупинити його, навіть якщо це означає використання невибіркової зброї масового знищення, яка може пролити пекло на наших ворогів. Звичайно, це утримає їх від подальших звірств."
