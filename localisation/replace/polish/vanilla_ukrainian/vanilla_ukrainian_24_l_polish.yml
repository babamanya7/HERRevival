 SIA_limited_war_indochina_no_target:0 "Обмежена війна провалилася"
 SIA_mandate_1_desc:0 "Країна, народ і національність мають називатися тайськими"
 SIA_mandate_7_desc:0 "Кожна тайська людина повинна допомагати будувати націю. Кожна працездатна людина повинна мати стабільну роботу. Будь-яка людина без професії є некорисною для нації і не заслуговує на повагу з боку тайського народу."
 SIA_national_savings_bond_scraping_the_barrel:0 "За умови §Y$scraping_the_barrel$§! отримуємо:"
