 ETH_christmas_offensive_idea:0 "Різдвяний наступ"
 ETH_collectivization_reforms_decision_desc:0 "Земля держави [ETH.GetNameDef] століттями належала аристократам, хоча її обробляв народ. У нас є можливість зробити кожного господарем, перерозподіливши землю."
 ETH_cooperation_sud_tt:0 "Отримає суданського політичного радника:\n§Y$economic_organizer$:§!\n   $MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5%§!\n   Стабільність: §G+5%§!"
 ETH_core_883:0 "Інтегрувати область [883.GetName] в імперію"
 ETH_counter_the_armored_threat_NoLaR_tt:0 "\nЯкщо §Y[SOV.GetFlag][SOV.GetNameDef]§! погодиться, §Y[ETH.GetFlag][ETH.GetName]§! отримає технологію §YМіжвоєнний танк§! і §G200§! [SOV.GetAdjective]их танків."
 ETH_defeat_italy_category_desc:0 "Італія знову намагається перетворити Ефіопію на звичайну колонію. Ми перемогли цих загарбників у попередній раз, і зможемо перемогти їх знову, якщо зможемо остаточно вигнати їх із наших кордонів!"
 ETH_ecole_militaire_haile_selassie_1er_desc:0 "Наша армія виявляється дуже застарілою порівняно з іншими державами в регіоні з точки зору як оснащення, так і мислення. Ми створимо власну військову академію, щоби навчати нове покоління офіцерів, як вести сучасні війни."
 ETH_expand_tax_exemptions:0 "[ETH_GetTaxExemptionTitle]"
 ETH_hold_addis_ababa_mission_desc:0 "Тримаючись у нашій столиці, ми можемо сподіватися, що міжнародна спільнота зрозуміє, що італійців треба зупинити силою."
 ETH_independence_support_progress_flag:0 " Наразі підтримує рух за незалежність"
 ETH_invest_in_state_industry:0 "Інвестиції в промисловість держави [FROM.GetName]"
 ETH_joint_swedish-ethiopian_intelligence_program:0 "Спільна шведсько-ефіопська програма розвідки"
 ETH_mounted_levies_desc:0 "Від пустель Сходу до гір Заходу наша батьківщина складається з різноманітних важкопрохідних місцевостей і тому погано підходить для колісних чи гусеничних транспортних засобів. Проте тисячоліттями було доведено, що верблюди та коні справляються із цим завданням."
 ETH_negusa_nagast_tt:0 "§Y[ROOT.GetNameWithFlag]§! оголосить незалежність."
 ETH_offer_peace_SOM:0 "Мир в обмін на [SOM.GetAdjective]у незалежність"
 ETH_peoples_army:0 "Народна армія"
 ETH_reach_out_to_the_italians_tt:0 "Пропозицію про співпрацю буде надіслано до §Y[ITA.GetNameDef]§!, пропонуючи мир в обмін на територію."
 ETH_reinforce_dynamic_identity_desc:0 "За нової адміністрації люди залишаються в розгубленості щодо своєї національної ідентичності. Незважаючи на їхні дрібні образи, тепер вони [ETH.GetAdjective]. І настав час їм дізнатися, що хороші [ETH.GetAdjective]і люди лояльні до лідера [ETH.GetLeader] і держави."
 ETH_reintegrate_core:0 "Відвоювати область [FROM.GetName]"
 ETH_risk_of_rebellion_tt:0 "Ризик повстання\n Повстання станеться, якщо стабільність опиниться нижче §Y15%§! або популярність керівної партії опиниться нижче §Y40%§!."
 ETH_scania:0 "$scania$"
 ETH_selassie_left_flag:0 "$ETH_haile_selassie$ покинув Ефіопію"
 ETH_soviet_aid_desc:0 "Ми успішно скинули кайдани феодальної вірності. Тепер ми повинні перемогти фашистів і приступити до створення нашої робочої республіки. Якщо хтось прихильно ставиться до нашої справи, то це, безперечно, люди держави [SOV.Getname]."
 ETH_soviet_mediation_tt:0 "§R\n[SOV.GetNameDefCap] зможе спробувати взяти контроль над нами в обмін на переговори з державою [ITA.GetName]!§!"
