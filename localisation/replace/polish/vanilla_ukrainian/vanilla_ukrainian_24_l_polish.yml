 PHI_bill_of_rights_desc:0 "Якщо ми хочемо, щоб нас сприймали всерйоз як сучасну державу, ми повинні закріпити права нашого народу в законі. Це може ґрунтуватися на прикладі [USA.GetName], проголошуючи такі свободи, як свобода віросповідання, слова, преси та зборів. Однак ми є окремою нацією, і існують певні помітні відмінності: наприклад, ми не вважаємо доцільним надавати право на носіння зброї в нашому суспільстві."
