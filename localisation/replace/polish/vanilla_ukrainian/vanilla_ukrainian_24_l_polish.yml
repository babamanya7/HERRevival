 CHL_land_reforms:0 "Земельні реформи"
 CHL_law_of_permanent_defense_of_democracy_desc:0 "Комуністична загроза нависла не лише над нами, але й над усім світом. Якщо ми хочемо вижити під час холодної війни, яка неодмінно настане, ми мусимо переконатися, що комуністи не зможуть повалити наш режим і загрожувати нашому народові."
 CHL_mapuche_state_neutrality_DEF:0 "Держава мапуче"
 CHL_more_funds_or_the_propaganda_department_desc:0 "Наш відділ пропаганди працює понаднормово, щоби переконати людей, що ми — їхні рятівники. Але вони не зможуть працювати ефективно, якщо ми не надамо їм фінансування. Ми мусимо відмивати кошти крізь корумпованих політиків, щоб підготувати переворот."
 CHL_nacistas_gathering_support_mission:0 "Нацисти набирають підтримку"
