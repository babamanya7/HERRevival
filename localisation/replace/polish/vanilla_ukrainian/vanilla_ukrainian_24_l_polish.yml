 POR_mechanized_focus_desc:0 "Механізована техніка набагато краще, ніж інша колісна техніка, підходить для захисту наших піхотинців під час ворожого вогню. Дослідження та виробництво таких транспортних засобів можуть виявитися вирішальними."
 POR_nation_in_arms:0 "Озброєна держава"
