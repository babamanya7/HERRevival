 CONSTRUCTION_RAILWAY_SELECTED_DESC:0 "§GКлацніть§! по вузлі, щоби почати будівництво залізниці з цієї точки. Проведіть мишею по провінціях, крізь які залізниця мусить проходити та клацніть по цільовій провінції. Повторіть шлях у зворотному напрямі, щоби видалити провінції. §RКлацніть ПКМ§!, щоби скасувати.\n§GShift + клацніть§! по вузлі та клацніть по цільовій провінції, щоби провести найкоротший шлях (з урахуванням існуючих шляхів). §RКлацніть ПКМ§!, щоби скасувати."
