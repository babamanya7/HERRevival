 south_american_events.22.a:0 "Це не ідеально..."
 south_american_events.32.desc:0 "Оскільки [FROM.GetNonIdeologyName] нещодавно розвалилася у громадянській війні, багато наших промисловців та окремих громадян збирають допомогу для знесиленого [FROM.GetAdjective] уряду, який бореться за стримування комуністичної загрози.\n\nДеякі з найбільш затятих антикомуністів у військових тепер пропонують використати це як можливість оснастити та відправити військових добровольців для допомоги у конфлікті, зберігаючи при цьому правдоподібне заперечення з боку уряду."
 south_american_news.51.d:0 "Сьогодні вранці президент [FROM.GetLeader] з [FROM.GetName] оголосив по радіо, що нація знову запроваджує надзвичайний стан через ризик перевороту з боку комуністичної партії. За словами президента, були знайдені документи, які вказували на те, що комуністи перебувають на пізніх стадіях планування повалення уряду. За підтримки правої інтегралістської партії, [BRA.GetLeader] змусив опозиційні партії піти в підпілля. Президент оголосив, що заснує нову державу з новою конституцією спільно з інтегралістською партією, яка доблесно врятувала націю від більшовизму. Враховуючи минулу риторику та дії інтегралістів, схоже, що ліберальна демократія в Бразилії закінчилася, хоча й без офіційної назви."
 south_pacific_mandate_desc:0 "Наші володіння в Тихому океані, передані нам Лігою націй, утворюють першу лінію оборони Японії в майбутній війні зі США. Ці острови є непотоплюваними авіаносці, і ми мусимо як слід зміцнити їх."
 soviet.21.d:0 "Переговори в Сіані принесли результати. І націоналісти, і комуністи погодилися на перемир'я, яке принаймні тимчасово припинило бойові дії і дозволило сторонам співпрацювати проти зовнішньої загрози."
 soviet.25.t:0 "Суд над Антирадянським троцькістським центром"
 soviet.34.t:0 "Утиск Литви"
 soviet.37.t:0 "Талановиті нові офіцери"
 soviet.4.d:0 "[FROM.GetAdjectiveCap]а влада мудро прислухалася до наших вимог і вивела всі свої війська з Бессарабії. Ми приєднаємо цю територію до Союзу як Молдавську Радянську Соціалістичну Республіку. Її громадяни відтепер користуватимуться благами соціалізму."
 soviet.5.a:0 "Дурні!"
 soviet.53.d:0 "Після заснування Четвертого інтернаціоналу полювання на прихильників Троцького посилилося, і декількох людей, близьких до Сталіна, було страчено. Не маючи нікого, крім себе, Сталін усамітнився у своєму маєтку. Після того, як із усіма зрадницькими друзями і членами сім'ї нарешті розквиталися, він може відпочити та повністю зосередитися на принесенні слави державі [SOV.GetNameDef]."
 soviet.54.t:0 "Під новим керівництвом"
