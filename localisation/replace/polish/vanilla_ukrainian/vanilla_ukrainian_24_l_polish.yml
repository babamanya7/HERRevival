 AIR_ASSIGN_ALL:0 "Призначити всі"
 AIR_OVERVIEW_CATEGORY_CARRIER_0:0 "$COUNT|H$ §Hпалубних штурмових літаків§!"
 AIR_REBASE_ALL_DESC:0 "§GКлацніть, щоби перемістити всі активні авіакрила на найближчі можливі бази для оптимальної ефективності.§!"
 AIR_REBASE_ENTRY_GOOD:0 "$COUNT$ $WING|Y$ перебазовуються на базу $BASE|Y$\n"
 AIR_SUPERIORITY_SAM_MISSION_REDUCTION_ENEMY:0 "Скорочено ворожими ракетами класу «земля–повітря» в регіоні: $RED|R1$"
 AIR_SUPPLY_CHUNK_DESC:0 "Ця частина отримує §Yповітряне постачання§!.\nСкинуто припасів: $VAL|+=$"
 AIR_SUPPLY_VERY_LOW_SUPPLY:0 "§RНам потрібно ще $NEED|H1$ постачання в стратегічному регіоні!§!"
 AIR_TITLE_SCOUT_PLANE:0 "Розвідувальна\nавіація"
 AIR_VIEW_AVERAGE_MISSION_EFFICIENCY_ENEMY:0 "§HВорожа середня ефективність завдань§!\nЕфективність: $VAL|H%$"
 AIR_VIEW_DAMAGE_TO_DIVISIONS_BY_ENEMY:0 "§HШкоди отримано дружніми дивізіями§!"
 AIR_WEATHER_MODIFIER:0 "Погодний модифікатор:"
 AIR_WING_NAME_CZE_GENERIC:0 "$NR$. $NAME$"
 AIR_WING_NAME_FRA_GENERIC:0 "$NAME$ No. $NR$"
 AI_MESSAGE_CAT2_MES6:0 "Hear that, $OTHER$? That's the sound of how hard I am owning you right now."
 ALERT_DIVISION_NO_EQUIPMENT:0 "§T$NAME|H$§!"
 ALT_communism:0 "Ойротська радянська республіка"
 ALT_democratic_ADJ:0 "Алтайськ"
 ALT_neutrality_DEF:0 "Конфедеративна республіка Алтай"
 ANG_fascism_ADJ:0 "Анґольськ"
 ANU_democratic:0 "Республіка айнів"
 ARA_UNIFIED_fascism_ADJ:0 "Аравійськ"
 ARG_accept_german_advisors:0 "Прийняти німецьких радників"
 ARG_american_allyship_desc:0 "Один із наших найсильніших союзників — це тепер пробуджений гігант на півночі. У дусі панамериканської єдності ми повинні надіслати [ARG.GetAdjective] посланця до Вашингтона, округ Колумбія, щоб розвинути тісніші зв'язки з [USA.GetAdjective] урядом."
 ARG_anti_corruption_policies_desc:0 "Ми повинні забезпечити, щоб політична корупція, яка заплямувала нашу країну протягом останнього десятиліття, ніколи не повернулася на наші урядові вибори. Шляхом запровадження нової політики, спрямованої на викорінення культури хабарництва, розкрадання та кумівства в уряді нашої нації."
 ARG_bolstering_the_army:0 "Кампанія з набору"
 ARG_chilean_ultimatum:0 "[CHL.GetAdjective] Ультиматум"
 ARG_committee_of_state_security:0 "Комітет державної безпеки"
 ARG_communism_party_long:0 "Комуністична партія Аргентини"
 ARG_economic_reform_in_state:0 "Податкова реформа в області [FROM.GetName]"
 ARG_education_synthetics_bonus:0 "Бонус до освіти в галузі синтетики"
 ARG_embargoed_us_desc:0 "[ARG.GetNameDefCap] embargoed us due to pressure from [USA.GetNameDef]."
 ARG_end_operation_bolivar:0 "Покінчити з операцією «Болівар»"
 ARG_envoy_to_london_desc:0 "[ENG.GetName] були одним із наших найближчих союзників протягом багатьох років, і тепер, коли ми стоїмо з ними проти їхніх ворогів, було б розумно надіслати [ARG.GetAdjective] посланця до Лондона, щоб налагодити тісніші зв'язки з [ENG.GetAdjective] урядом."
 ARG_hortensio_quijano:0 "Ортенсіо Кіхано"
 ARG_infamous_decade_4_idea:0 "$ARG_infamous_decade_idea$"
 ARG_intervenciones_federales:0 "Intervenciones Federales"
 ARG_joint_military_exercises_desc:0 "Як знак доброї волі до [USA.GetAdjective]ого уряду, ми повинні надіслати пропозицію про спільні військові навчання, проведені в [ARG.GetNameDef]. Працюючи разом, ми можемо покращити підготовку та рівень кваліфікації нашого флоту та повітряних сил."
 ARG_loan_from_italy:0 "Узяти позику в держави [ITA.GetFlag]§Y[ITA.GetName]§!."
 ARG_marxism_DEF:0 "Народна республіка Аргентина"
