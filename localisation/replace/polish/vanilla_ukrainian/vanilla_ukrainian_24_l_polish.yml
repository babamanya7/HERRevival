 CHI_EQUIPMENT_VERSION_14:0 "N"
 CHI_a_brotherhood_for_china_desc:0 "Товариство синіх сорочок для багатьох — це збіговисько грубіянів, що порушують спокій. Однак його лідер, Дай Лі, бачить його як братерство, і це та точка зору, яку ми можемо прийняти для сприяння єдності."
 CHI_aggresive_prosecution_of_opposition_neutrality:0 "Агресивне переслідування опозиції"
 CHI_autonomy_colony_DEF:0 "$OVERLORDADJ$а китайська колонія"
