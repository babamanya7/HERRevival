 CHL_promote_ideology_rallies_americas_desc:0 "[ROOT.GetAdjectiveCap]і агенти проводитимуть політичні мітинги по всій державі [FROM.GetNameDef] для просування [ROOT.GetRulingIdeologyNoun_RU_lower_Gen] серед [FROM.GetAdjective]их мас."
 CHL_reapproach_america:0 "Наново зблизитися з Америкою"
