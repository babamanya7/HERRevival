 HUN_civilian_industry_desc:0 "Незважаючи на потребу в оборонній промисловості, ми мусимо не забувати про потреби цивільного населення. Тому розвиток цивільної промисловості є необхідним."
 HUN_created_spanish_habsburg_monarchy:0 "Карл Пій Австрийській керує Іспанією"
 HUN_csangos_science_academy_flag:0 "Засновано Чанґоську академію наук"
 HUN_danuvia_submachine_guns_desc:0 "Для підвищення ефективності піхоти необхідно укомплектувати її більш досконалою зброєю. Зразки системи Кіралі 43М добре показали себе на випробуваннях; збільшивши фінансування розробки, ми зможемо наблизити момент початку їхнього масового виробництва."
 HUN_demand_transylvania_desc:0 "Якщо ми зможемо повернути свої території без зайвого кровопролиття, для всіх буде тільки краще. Ми висунемо Румунії ультиматум з вимогою повернути нам наші законні землі."
 HUN_dockyards:0 "Поновити активність судноплавної промисловості"
 HUN_elect_a_king_desc:0 "Підтримка повернення до монархічного строю досягла достатнього рівня; можна починати думати про процес обрання нового короля."
