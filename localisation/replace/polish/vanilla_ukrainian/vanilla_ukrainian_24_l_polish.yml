 CZE_intervene_in_the_ussr_desc:0 "Знову у [SOV.GetNameDef] виникли заворушення, і хоча стара королівська сім'я, яку ми колись підтримували, не повернеться, не можна ігнорувати можливість появи більш дружнього уряду."
