 IRQ_al_muthanna_club_desc:0 "Не бракує клубів та груп, які виникають з метою встановлення панарабського режиму по всьому регіону. Ми забезпечимо фінансування цих організацій, щоб вони продовжували зростати та схиляти населення до цієї мети."
 IRQ_al_muthanna_club_idea_desc:0 "Клуби Аль-Мутанна є потужною силою в іракському суспільстві, просуваючи арабський націоналізм та антиімперіалістичні настрої. Хоча вони надихають на єдність і гордість серед іракської молоді, їхня радикальна риторика та вплив на політику загрожують поглибленням розколів і дестабілізацією крихкої держави."
