 RAJ_red_eagle_division:0 "Дивізія «Червоний орел»"
 RAJ_red_in_the_shadows_desc:0 "Серед хаосу імперського занепаду революційні сили набирають міць, працюючи таємно, щоб підірвати старий лад. Піднесення червоного прапора сигналізує про наближення розплати — тієї, що може змінити майбутнє Індії та світу."
 RAJ_royal_indian_artillery_desc:0 "Індійська королівська артилерія з'явилася, коли Ост-Індійська компанія створила артилерійський батальйон з індійськими стрілками в 1748 році. У нашому розпорядженні багато десятиліть накопиченого досвіду."
