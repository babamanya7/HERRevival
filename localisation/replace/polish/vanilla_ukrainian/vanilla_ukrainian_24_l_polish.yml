 DEN_development_projects_mainland_state_modifier_desc:0 "$DEN_development_projects_state_modifier_desc$"
 DEN_establish_domestic_tank_manufacturing:0 "Налагодити вітчизняне виробництво танків"
 DEN_expand_the_brigades_desc:0 "Щоб підвищити шанси данської бригади на звільнення [ROOT.GetNameDef], нам потрібно додати ще більше людей до їхніх підрозділів."
 DEN_fromandskorpset_desc:0 "Нещодавні вдосконалення як в армії, так і на флоті суттєво посилили наші збройні сили. Ми виявилися більш ніж здатними проєктувати нашу силу далеко і широко, над водами і на чужі береги — якщо ми цього забажаємо."
 DEN_haeren_dynamic_modifier:0 "Hæren"
 DEN_haeren_reorganization_desc:0 "Данська армія невелика і абсолютно не готова захищати наші кордони. Вона повинна бути реорганізована в ефективну бойову силу з ефективним центральним командуванням, щоб зберегти нашу незалежність і стримувати можливих ворогів."
 DEN_hans_hedtoft:0 "Ганс Гедтофт"
 DEN_hans_lunding:0 "Ганс Лундінґ"
 DEN_increase_maritime_trade:0 "Збільшення морської торгівлі"
 DEN_industrial_capability_dynamic_modifier_desc:0 "Данія традиційно була аграрним суспільством і виробником, але її промисловість зросла у своїй важливості та економічному значенні. Ми повинні індустріалізуватися та модернізуватися, щоб не відставати від стрімкого розвитку в сучасну епоху."
 DEN_infantry_equipment_0_short:0 "Gevær M. 1889"
 DEN_modernize_the_navy_add_modifier_tt:0 "$DEN_add_sovaernet_dynamic_modifier$ $MODIFIER_NAVAL_DETECTION$: §G+10%§! \n$MODIFIER_NAVAL_ACCIDENTS_CHANCE$ §G-10.00%§!\n\n"
 DEN_no_market_regulations_desc:0 "Галузі зростали і процвітали всупереч нашому регулюванню ринку, а не завдяки йому. Якщо ми справді хочемо конкурувати з рештою світу за допомогою наших галузей, нам потрібно скасувати всі регуляторні норми щодо них."
 DEN_nordic_security:0 "Нордична безпека"
 DEN_puppet_the_overlord_tt:0 "Після того, як ми постраждали від [?DEN.DEN_overlord_nation.GetAdjective]ої окупації, ми маємо повне право захистити свою свободу, §Yпідпорядкувавши§! їх на можливій §Yмирній конференції§!\n\n"
 DEN_research_and_development_desc:0 "Нафта та машинобудування — це те, що тримає сучасне суспільство на ногах, а ми відстали майже у всіх цих сферах. Ми повинні зробити так, щоб не відставати далі."
 DEN_resistance_dynamic_modifier_desc:0 "Лише об’єднавшись у спротиві проти [?DEN.DEN_overlord_nation.GetAdjective] окупаційних сил, ми зможемо сподіватися на вільну [DEN.GetNameDef]. Рух Опору є серцевиною цього спротиву та буде критичним для відновлення нашої свободи."
 DEN_seize_power_desc:0 "[DEN.GetNameDefCap] нарешті готова прийняти новий фашистський уряд. Ми скасуємо Ригсдаг і натомість віддамо майбутнє нашої великої нації в руки $DEN_cay_lembcke$. Однак, якщо буде лише слабкий опір, ми повинні бути готові придушити його назавжди."
 DEN_sign_forsvarsforliget_desc:0 "Зважаючи на те, що напруженість у Європі знову зростає, ми повинні визнати, що наші нинішні оборонні можливості є вкрай недостатніми. Підписання нової оборонної угоди, яка збільшить фінансування армії, флоту та повітряних сил, посилить нашу військову спроможність і забезпечить цілісність нашої держави."
 DEN_support_the_faroes_industries:0 "Підтримака Фарерської промисловості"
