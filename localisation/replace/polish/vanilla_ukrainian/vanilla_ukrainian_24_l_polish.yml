 BEL_consolidate_resistance_groups_desc:0 "Існує велика кількість організацій спротиву в [BEL.GetNameDef], всі вони бажають підтримати наше визволення, але розділені безліччю різних ідеологій, поглядів, ідеалів, груп інтересів і прихильників. Як уряд у вигнанні, ми маємо можливість взяти на себе центральну організаційну ініціативу, щоб об'єднати їх для досягнення нашої спільної мети."
