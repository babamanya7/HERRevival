 GER_aid_in_military_industrialization:0 "Німецька допомога у військовій індустріалізації"
 GER_an_invincible_army_trigger:0 "$TRIGGER_OR_STARTS$:\n   Понад §Y5§! підлеглих держав\n   Понад §Y49§! окупованих областей у §YЄвропі§!"
 GER_anschluss_old_desc:0 "Аншлюс, або приєднання Австрії, — давня мрія німецького народу. Версальський договір забороняє таке приєднання, та все ж настав час здійснити цю мрію. Ми маємо дати австрійцям шанс розділити наше славне майбутнє!"
 GER_ascension_of_character_tt:0 "§Y$CHARACTER$§! призначається §Yрайхслайтером§! і підноситься у §YВнутрішньому колі§! як:"
 GER_autonomy_in_the_kriegsschulen_desc:0 "Воєнні академії, або Kriegsschulen, мають давні традиції в нашій країні. Хоча є спокуса контролювати та пристосовувати до себе кожну деталь освіти, що надається в академіях, можливо, буде ліпше, якщо ми дозволимо навчальним закладам самим забезпечувати найліпшу підготовку для наших майбутніх офіцерів і надамо їм відповідні повноваження."
 GER_barbarossa_mission_desc:0 "Німецькі збройні сили повинні бути готові розгромити Радянську Росію в ході швидкої кампанії. Основна частина російської армії буде знищена сміливими операціями на чолі з бронетанковими загонами."
 GER_battle_for_air_superiority:0 "Битва за перевагу в повітрі"
 GER_bernhard_bastlein:0 "Бернгард Бестлайн"
 GER_bewegungskrieg_modifier_lvl_4:0 "$GER_bewegungskrieg_modifier$"
 GER_bormann_secretary_to_the_fuhrer_improved:0 "$GER_bormann_secretary_to_the_fuhrer$"
 GER_carte_blanche_for_alsace_and_french_colonies:0 "Карт-бланш на Ельзас і французькі колонії"
 GER_construct_the_westwall:0 "Фінансування Західного валу"
 GER_danzig_trigger_polish_civil_war:0 "Польща охоплена громадянською війною, і має виконуватися одна з умов:\n      Німеччина відправила добровольців на допомогу одній із сторін\n      Одна зі сторін перебуває в альянсі з Німеччиною"
 GER_demand_memel_desc:0 "За підсумками Великої війни Німеччина втратила свої східні території: частина з них відійшла відродженій Польщі, а Мемель отримала Литва. Обом країнам буде висунуто ультиматум, однак Польща, швидше за все, відповість відмовою."
 GER_destabilize_the_monroe_doctrine_decision_tt:0 "Хоча б §Y5§! американських країн виступають проти Доктрини Монро."
 GER_dive_bombers:0 "Пікіруючі бомбардувальники"
 GER_division_belgium_mot_tt:0 "Ветеранська §Yмоторизована§! частина §Y27. SS-Division Langemark§! and the veteran §Ymotorized 28. SS-Division Wallonien§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_doctrine_reinforced_dummy_decision:0 "[USA.GetNameDefCap] заручилися підтримкою Доктрини Монро в країні [FROM.OWNER.GetNameDef]"
 GER_effectivize_the_volkswerke:0 "Оптимізувати Volkswerke"
 GER_ernst_udet:0 "Ернст Удет"
 GER_ernst_wollweber:0 "Ернст Волльвебер"
 GER_establish_carrier_groups_desc:0 "Сповнені рішучості створити неперевершений флот із авіаносців, ми мусимо навчити наших пілотів діяти з цих палуб. Наші літаки будуть панувати в небі над морем і сушею!"
 GER_establish_protectorates_in_america_desc:0 "Країни на американських континентах надто довго управлялися у спосіб, який не відповідав нашим ідеалам. Потрібна повномасштабна реорганізація, щоб навести лад на цих територіях після тривалого часу неоптимального управління."
 GER_expand_kriegsmarinewerft_desc:0 "Ми мусимо подвоїти наші зусилля з будівництва військово-морських сил, які зможуть зважатися з флотами наших ворогів. Застосовуючи передові технології в суднобудуванні та будуючи найсучасніші військові кораблі, ми впевнено вирвемо контроль над відкритим морем із-під контролю наших ворогів."
 GER_form_the_stasi:0 "Створити Штазі"
 GER_franz_ritter_von_epp:0 "Франц Риттер фон Епп"
 GER_fritz_todt:0 "Фріц Тодт"
 GER_generalgouvernement_effect_tt:0 "Усі необхідні області, окрім §Y[88.GetName]§!, перейдуть під контроль [GEN.GetNameDef]"
 GER_grosskampfschiff_construction:0 "Будівництво Grosskampfschiff"
 GER_hans_oster:0 "Ганс Остер"
 GER_himmler_reichsfuhrer_ss:0 "$GER_reichsfuhrer_ss$"
 GER_industrial_cooperation_desc:0 "Наша співпраця з [SOV.GetAdjective]ою владою поки що обмежувалась військовою сферою. Зважаючи на те, що [SOV.GetNameDef] — наш союзник, логічно розширити співпрацю й на інші галузі. Наші промислові підходи схожі, тож спільні проєкти будуть легко реалізованими."
 GER_inner_circle.01.b:0 "Замінити [GetAscendedAdvisorName2]"
 GER_kdf_wagen_factories_economic_growth_text:0 "Побудувавши новий [GetAutobahnName], ми мусимо заповнити його автомобілями. Щоби стати по-справжньому процвітаючою та сучасною економікою, нам потрібно побудувати заводи, які зможуть виробляти ці автомобілі, створюючи при цьому робочі місця та зайнятість."
 GER_knickebein_desc:0 "Наш прорив у системі навігації Knickebein дозволив нам значно покращити точність бомбардувальників, навіть під час нічних рейдів, завдаючи прицільних ударів по ворожих позиціях."
 GER_ludwig_erhard:0 "Людвиґ Ергард"
 GER_mackensen_dead:0 "Фон Макензен мертвий"
 GER_marie_luise_hammerstein:0 "Марія Луїза фон Гаммерштайн"
 GER_mechanized_equipment_1_desc:0 "Sd.Kfz. 11 (Sonderkraftfahrzeug — спеціальна моторизована машина) — німецький напівгусеничний автомобіль, який дуже широко використовувався під час Другої світової війни. Він міг перевозити вісім військовослужбовців на додаток до буксирування гармати або причепа."
 GER_mechanized_equipment_3_desc:0 "Оновлена версія Sd.Kfz. 251 з інфрачервоним прожектором."
 GER_medium_tank_artillery_equipment_3:0 "Brummbär"
 GER_medium_tank_destroyer_equipment_1_desc:0 "Штурмова гармата Sturmgeschütz III була найбільш виробленою бойовою броньованою машиною Німеччини під час Другої світової війни. Він був побудований на шасі перевіреного танка Panzer III. Спочатку задумувався як мобільна броньована легка гармата для підтримки піхоти, StuG постійно модифікувався і широко використовувався як винищувач танків."
 GER_mefo_bills_1939_fake_ns_tt:0 "$GER_increasing_cg_tt$ $GER_CG_penalties_warning$\n\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y71.0%§!\n $MODIFIER_CIVILIAN_INTEL_TO_OTHERS$: §G-25.0%§! \n $MODIFIER_ARMY_INTEL_TO_OTHERS$: §G-25.0%§!\n $MODIFIER_NAVY_INTEL_TO_OTHERS$: §G-25.0%§!\n $MODIFIER_AIRFORCE_INTEL_TO_OTHERS_FACTOR$: §G-25.0%§! \n $modifier_production_speed_arms_factory_factor$: §G+15.00%§!\n $modifier_production_speed_dockyard_factor$: §G+15.00%§!"
 GER_mefo_bills_mission_desc:0 "Термін дії випущеними нами векселів скоро завершиться. Ми мусимо вирішити, продовжити їх чи почати виплати."
 GER_mio_trait_history_of_battleships:0 "Історія лінкорів"
 GER_mio_trait_schnellbomber_doctrine:0 "Доктрина швидкісного бомбардувальника"
 GER_mittelafrika_desc:0 "В Африці є більше цікавих для нас територій, ніж ті, якими ми раніше володіли. З його величезними природними багатствами регіон, який ми вирішили назвати Міттельафріка, надав би державі [ROOT.GetNameDef] велику користь."
 GER_neutrality_influence_tt:0 "§RСпалахне громадянська війна, якщо підтримка §YНеприєднаних§! перевищить 45%!§!"
 GER_operation_isabella_desc:0 "Оскільки лише [POR.GetNameDef] стоїть між нами та повним контролем над Піренейським півостровом, нашим наступним кроком мусить бути змусити їх підкоритися нам. Зберігаючи місцеві органи влади, але забезпечуючи їхню лояльність до нас, ми зможемо отримати від них усе необхідне в питаннях землі, інфраструктури та військових структур."
 GER_operation_panzerfaust_events.03.desc:0 "Міклош Горті підкорився, і тепер Угорщина повністю під нашим контролем. Здається, наша тактика залякування спрацювала."
 GER_plan_z:0 "План «Z»"
 GER_re_establish_german_control_over_qingdao_desc:0 "У 1898 році ми домовилися про оренду Ціндао. Цю угоду було розірвано в 1914 році [JAP.GetAdjective]ою окупацією незабаром після початку Великої війни. Оскільки територія більше не перебуває під окупацією, можливо, настав час нагадати їм про цю угоду."
 GER_renew_mefos_desc:0 "Райхсбанк має вирішальне значення у відбудові та переозброєнні нашої нації. Зрозуміло, що ми допустили помилку, вирішивши погасити борги, і ми мусимо продовжити термін дії векселів «MEFO» ще на кілька місяців."
 GER_rk_modifiers_tt:0 "[GetRosenbergsModifiers]"
 GER_safeguard_the_baltic_ww:0 "$GER_safeguard_the_baltic$"
 GER_saved_the_monroe_doctrine_bad:0 "Зміцнив Доктрину Монро"
 GER_schlieffen_once_more_desc:0 "Лінію Мажіно слід оминути. Ми знову висунемося через Бельгію та Люксембурґ і отримаємо перемогу одним швидким ударом."
 GER_second_vienna_award:0 "Другий Віденський арбітраж"
 GER_shared_rd_programs_2_tt:0 "Кожна §Yдержава§! у нашому §Yальянсі§! також приєднається до §YЦентральноєвропейської дослідницької групи§!"
 GER_start_the_proletarian_revolution:0 "Почати пролетарську революцію"
 GER_strategic_air_effort:0 "Акцент на стратегічну авіацію"
 GER_strengthen_the_waffen_ss:0 "Посилити Waffen-SS"
 GER_strengthen_the_waffen_ss_desc:0 "Waffen-SS, бойова гілка SS, виявилася цінним активом для нас під час бойових дій. Хоча технічно це воєнізоване формування, ми твердо переконані, що за наявності більших ресурсів воно могло б діяти так само ефективно, як і наша регулярна армія."
 GER_stricter_industrial_organization:0 "Суворіша організація промисловості"
 GER_subsidize_hoesch_benzin_desc:0 "Раніше казали, що армія марширує на шлунку, але сучасна армія працює на паливі. Щоби підтримати нашу військову спроможність, ми мусимо інтенсифікувати наші зусилля з виробництва синтетичного палива."
 GER_the_fate_of_the_irish_area:0 "Передати ірландську адміністрацію райхскомісаріату Великої Британії"
 GER_the_first_berlin_award:0 "Перша Берлінська угода"
