 SIA_revision_of_unequal_treaties:0 "Перегляд нерівноправних договорів"
 SIA_seek_support_from_absolutists_monarchists_tt:0 "Ми заручимося підтримкою абсолютистських монархістів.\n\nВони допоможуть нам у громадянській війні, створивши додаткові дивізії. Однак вони очікуватимуть, що ми повернемося до абсолютної монархії, виконавши фокус §Y$SIA_an_absolute_monarchy$§! протягом §Y720 днів§! після здобуття влади.\n\nНевиконання цього призведе до падіння §YСтабільності§! та §YПідтримки війни§!"
 SIA_sell_privy_purse_lands:0 "Продаж королівських земель"
 SIA_ship_armor_cruiser_1:0 "63-мм пояс/38-мм палуба"
 SIA_sideline_disloyal_officers_tt:0 "Два випадкових генерала отримають рису §YReassigned§! на 4 роки, через що вони не даватимуть бонусів.\nДва випадкових генерала, які не мають риси §YReassigned§!, отримають додаткові характеристики та додаткову позитивну рису."
 SIA_spread_democratic_sentiment_in_universities:0 "Поширення демократичних настроїв в університетах"
 SIA_strat_bomber_equipment_1_short:0 "B-17 Flying Fortress"
 SIA_territorial_defense_student_desc:0 "Розширюючи молодіжний рух, найперспективніших кандидатів можна перевести до тренувальних таборів молодших солдатів, де вони допомагатимуть в обороні [SIA.GetNameDef]. Вони отримають належну військову підготовку і діятимуть як додатковий інструмент, який зможе використовувати армія."
 SIA_the_bank_of_siam_desc:0 "Промислове зростання не може відбуватися лише на основі звичаїв і приватних привілеїв. Сильніший національний банк дасть державі більший контроль над кредитами, валютою та обігом капіталу."
