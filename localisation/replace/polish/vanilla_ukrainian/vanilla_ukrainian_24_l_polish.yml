 idea_SIA_rebuilding_after_civil_war:0 "Відбудова після Громадянської війни"
 idea_SIA_unified_khana_ratsadon_desc:0 "Стару чвару між військовими та цивільними завершено. Оскільки обидва крила Кхана Ратсадон нарешті рухаються в одному напрямку, уряд може діяти з такою єдністю цілей, якої він ніколи раніше не знав. Солдати, адміністратори та промисловці тепер працюють як один організм."
 idea_SIA_yuvachon_desc:0 "Рух «Ювачон» прищеплює молоді нації військову дисципліну, створюючи резерв підготовленої робочої сили та розпалюючи націоналістичні настрої."
 idea_category_espionage_desc:0 "Прийміть ідеї/найміть міністрів для здійснення шпигунства"
 idea_group_light_aircraft_manufacturer:0 "Конструктор легких літаків"
 idea_group_rocketry_desc:0 "Ідеї та люди, які пожвавлюють розвиток ракетних технологій."
 idel_ural_SOV_communism_subject:0 "Ідель-уральська федеративна радянська соціалістична республіка"
 ideological_loyalty_spirit_desc:0 "Від того, хто не володіє правильною ідеологією, не можна очікувати досягнення правильного результату в бою.\n\n§GЦей дух доступний через нашу ідеологію.§!"
 imperial_connections:0 "Імперські зв'язки"
 imprisoned_emperor:0 "Заарештований імператор"
 improved_light_battery_desc:0 "Закрита поворотна платформа для гармати малого калібру. Захищає розрахунок від уламків і у разі важких погодних умов.\n\nУстановка цього модуля посилює §Yобстріл з легких знарядь§!, що допомагає атакувати ворожі §Yкораблі прикриття§!."
 improved_rocket_engines_desc:0 "Ми можемо будувати високоточні балістичні ракети далекої дії, здатні досягти віддалених міст і навіть космосу."
 improved_seaplane_tender_desc:0 "Удосконалення технологій дозаправки та евакуації на морі сприяють підвищенню ефективності експлуатації гідролітаків.\n\nУстановка модуля §YГідроавіаносець§! на §Yесмінці§! поліпшує їхню здатність виявляти ворожі судна."
 industrial_effort_focus2_desc:0 "Японія нещодавно почала індустріалізацію, але вона ще не така сильна, як західні держави. Ми маємо постаратися скоротити цей розрив."
