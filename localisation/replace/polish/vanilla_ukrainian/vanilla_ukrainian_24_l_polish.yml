 idea_RAJ_princely_state_aggression_tt:0 "Отримує §Y$idea_RAJ_princely_state_aggression$§!, що надає:\n(§YКожна князівська держава§!):\nНапруга для створення воєнної мети проти країни: §Y-100%§!\nЧас на виправдання воєнної мети: §G-75%§! протягом §Y180 днів§!"
