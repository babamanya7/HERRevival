 AST_SH_battleship_1_desc:0 "The Centurion was a class of hypothetical heavy battleships of the Royal Navy built to counter the large vessels of the German and Japanese navies. Large 18 in. guns and thick armor provide the ship with the necessary firepower and protection to battle these vessels. Strong AA armament, long range, and good speed were a necessity to cover the vast seas of the British Empire."
 AST_a_domestic_supply_chain_desc:0 "Одним із побічних ефектів нашої зосередженості на внутрішній економіці є розвиток надзвичайно стійкої виробничої системи. З усіма рівнями виробництва, розташованими вдома, ми значною мірою захищені від зовнішніх потрясінь."
 AST_aerodrome_of_democracy_democracy:0 "Аеродром демократії"
 AST_allied_after_all:0 "Зрештою союзники"
 AST_amphibious_mechanized_equipment_1:0 "LVT-2"
 AST_arthur_fadden_votes:0 "\n $AST_arthur_fadden$: §G+0.01§!"
 AST_battleship_1:0 "$ENG_battleship_1$"
 AST_battleship_4:0 "Клас «Vanguard»"
 AST_battleship_4_desc:0 "The Vanguard-class battleship was the last battleship to be built for the Royal Navy. A single ship was ordered but four more were considered for the Pacific theater. Ordered under the 1940 Emergency War Program, construction did not gain a high priority and was finished after the war. The class had a sleek hull, giving excellent stability and seaworthiness. The armament was the same as the Queen Elizabeth and Revenge class battleships, providing considerable firepower. Strong engines and good armor made the vessel fast and well protected."
 AST_ben_chifley:0 "Бен Чифлі"
 AST_bound_once_more:0 "Знову пов'язані"
 AST_broken_hill_proprietary_company_improved_ic:0 "$AST_broken_hill_proprietary_company_ic$"
 AST_canberra_air_disaster_events.3.t:0 "Вотум недовіри"
 AST_castle_crumbling_mission:0 "Замок руйнується"
 AST_citizen_military_forces:0 "Воєнізовані загони"
 AST_coast_watchers_desc:0 "У той час як більшість наших сил залишається зосередженою на материку, наші північні підступи пропонують життєво важливу мережу раннього попередження. Розгорнувши місцевих розвідників на цих віддалених островах, ми зможемо виявляти ворожі повітряні та військово-морські пересування задовго до того, як вони почнуть загрожувати австралійським берегам."
 AST_cockatoo_island_shipyards_taog_desc:0 "Верфі острова Какаду тривалий час слугували імперським центром ремонту та обслуговування, підтримуючи операції Королівського флоту за кордоном. Тепер, як наріжний камінь Королівського австралійського флоту, ми маємо розширити їхні потужності, щоб задовольняти зростаючі потреби нашого флоту і підтримувати нашу військово-морську могутність."
 AST_communism_support_text:0 "[?party_popularity_100@communism|Y]% Підтримки комуністів"
 AST_country_party_influence_uap_tt:0 "Щоденний приріст голосів §YU.A.P§!: §Y+0.02%§!"
 AST_cv_fighter_equipment_2:0 "Fairey Fulmar"
 AST_cv_fighter_equipment_3:0 "Fairey Firefly"
 AST_deal_with_japan_tt:0 "Ми запропонуємо Японії §YМалайю§! в обмін на союз. Якщо це зробити не вдасться, ми запропонуємо передати регіони §YКалімантан§!, §YСулавесі§! та §YМолукка§!.\n"
 AST_defence_citizen_military_forces_act_desc:0 "До цього часу за кордон могли бути відправлені лише добровольці з числа професійних солдатів. Оскільки ескалація конфлікту триває, ми повинні створити правову базу, яка дозволить підрозділам міліції нести службу за кордоном, якщо це буде потрібно."
 AST_demand_madagascar:0 "Вимагати Мадагаскар"
 AST_demand_resources_tt:0 "Розблоковує рішення з категорії §Y$AST_resource_acquisition_cat$§! для запиту частки ресурсів країн Південно-Східної Азії."
 AST_destroyer_4_desc:0 "The Battle class destroyers built upon the evolution of British destroyers used throughout the war. The ships were ordered as part of the 1942 and 1943 Naval Programs. They were well-armed in terms of both their guns and their torpedoes. Their AA armament ASW capabilities, speed, and range made them versatile vessels."
 AST_diplomatic_events.24.desc:0 "Прем'єр-міністр Австралії мав великий вплив на військові зусилля Британської Співдружності. Під час своїх регулярних візитів до Лондона Роберт Мензіс здобув довіру британських міністрів, тоді як їхня віра у власного прем'єр-міністра згасла. Міністри тепер змусили лідера [ENG.GetNameDef] піти у відставку, а Мензіса — зайняти його місце.\n\nНавіть якщо [AST.GetName] втратить свого прем'єр-міністра, вона здобуде вічну вірність свого сюзерена, захищену австралійським співвітчизником, який тепер біля керма Британії. Країна на іншому кінці світу бажає більшої влади, і Роберт Мензіс є першим, хто під цим підпишеться."
 AST_diplomatic_events.44.a:0 "Майбутнє виглядає світлим."
 AST_diplomatic_events.5.a.tt:0 "§YСінгапур§!:\n  Контролюється §YАвстралією§!.\n  Належить §YАвстралії§!.\n§YОстрів Різдва§!:\n  Контролюється §YАвстралією§!.\n  Належить §YАвстралії§!.\n§YКокосові острови§!:\n  Контролюється §YАвстралією§!.\n  Належить §YАвстралії§!."
 AST_diplomatic_events.52.a:0 "Води будуть нашими."
 AST_diplomatic_events.63.a:0 "Тоді Ірландія залишиться розділеною."
 AST_diplomatic_events.71.a:0 "Ні, ми не будемо."
 AST_diplomatic_events.73.desc:0 "[USA.GetNameDefCap] відмовилася здати нам свої тихоокеанські острови. Незважаючи на наші вимоги та зростаючий вплив у Тихому океані, Вашингтон не бажає відмовлятися від контролю над островами."
 AST_diplomatic_events.81.b:0 "Заборону на експорт не буде знято, навіть для прем'єр-міністра."
 AST_direct_support:0 "Пряма підтримка"
 AST_direct_support_desc:0 "До бою, товариші! Нас волають про допомогу китайські брати, які ведуть нерівну боротьбу з фашизмом! Записуйтесь у добровольці та приєднуйтесь до світової боротьби всіх робітників!"
 AST_expand_iron_mining_tt:0 "Наявність обох фокусів §Y$AST_exports_for_economic_recovery$§! та §Y$AST_within_reach$§! дозволить експлуатувати регіон Пілбара у штаті §Y$STATE_870$§!, відкриваючи майже невичерпне джерело §YСталі§!. Ми можемо використовувати це для підживлення нашої економіки."
 AST_expand_the_raaf_desc:0 "Ми маємо збільшити нашу повітряну армію, тому активно вкладаємось у будівництво нових баз, підготовку пілотів та випуск техніки."
