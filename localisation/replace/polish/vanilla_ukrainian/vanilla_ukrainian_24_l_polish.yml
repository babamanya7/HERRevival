 SPR_appeal_for_increased_autonomy_desc:0 "Ціною [SOV.GetAdjective]ої допомоги, яка зробила нашу перемогу можливою, було рабство. Ми показали себе вірними і здібними захисниками соціалізму, і це, звичайно, визнають у Москві. Можливо, нам вдасться переконати їх послабити віжки."
 SPR_destroyer_4_desc:0 "The Álava-class destroyers were launched postwar as upgrades to the previous Almirante Antequera class (which was a subclass of the earlier Churruca class). They displaced 1,710 tons and had four 120mm/45 Vickers-Armstrong Mk Fs as their main guns. Their speed and range were comparable to the earlier designs that the class built upon."
 SPR_disbanded_army:0 "Розформована армія"
 SPR_enemies_of_our_enemy_desc:0 "Хоча вони допомагали нашим ворогам під час громадянської війни, тепер у нас спільний ворог. Можливо, настав час відкласти наші розбіжності, допоки не буде виграно більшу боротьбу."
