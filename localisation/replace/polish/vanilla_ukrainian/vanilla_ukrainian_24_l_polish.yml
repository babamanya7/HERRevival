 CZE_skoda_optimization_tier_hover_tt:0 "Модифікатори фокусів £GFX_CZE_skoda_text_icon §YПріоритету «Шкоди»§! §Yмножаться§! на поточний £GFX_prod_eff_cap §YРівень оптимізації§!\n\n£GFX_prod_eff_cap §YРівень оптимізації§! з часом зростатиме, що довше ми перебуватимемо на одному й тому ж фокусі £GFX_CZE_skoda_text_icon §YПріоритету «Шкоди»§!\n\nПоточний максимальний §Wрівень оптимізації: §![?skoda_max_optimization_tier|G0]"
