 FRA_coup_in_indochina_desc:0 "Багато французів в Індокитаї прагнуть знову боротися із загарбником. Треба лише вийти з ними на зв'язок."
 FRA_coup_in_north_africa_desc:0 "Багато французів у Північній Африці прагнуть знову боротися із загарбником. Треба лише вийти з ними на зв'язок."
 FRA_cv_fighter_equipment_1:0 "Dewoitine D.510"
 FRA_cv_nav_bomber_equipment_3_short:0 "D.750P"
 FRA_destroyer_4_desc:0 "Класи Hoche і Bayard були останнім проєктом супересмінця французького флоту. Обидва класи базувалися на класі Mogador, водотоннажністю 4200 тонн із подібним основним озброєнням, але вдосконаленими зенітними гарматами та потужнішими двигунами. Вони були дозволені у військово-морських програмах 1939-40 років, але початок війни та падіння Франції призвели до скасування цих кораблів."
 FRA_france_undividable_desc:0 "Франція повинна бути сформована в єдине ціле, під одним прапором. Настав час відкрито визнати це, хоча б лише для того, щоби заспокоїти страхи розколу."
 FRA_gastonhenri_billotte:0 "Ґастон-Анрі Бійот"
 FRA_independence_for_madagascar_mission:0 "Рух за незалежність на Мадаґаскарі"
 FRA_indochina_intervention.1.t:0 "Союзники беруть Індокитай"
