 AST_military_expansionist:0 "Військовий експансіоніст"
 AST_mio_trait_john_brown_clyde_built_standard:0 "Стандарт якості річки Клайд"
 AST_naval_expansion_desc:0 "В обмін на те, що [ROOT.GetFascistParty] проводитиме вигідну для них політику, провідні діячі бізнесу погодилися інвестувати в галузеві реформи, які узгоджуються з цілями партії.\n\nФлот має бути розширений, якщо [AST.GetName] хоче мати шанс проти ворогів із вищою військово-морською потужністю. Протягом обмеженого часу всі сили будуть кинуті на верфі, забезпечуючи збільшення виробництва кораблів."
 AST_peace_out_all_wars_tt:0 "[THIS.GetName] вийде з усіх поточних війн."
 AST_percy_fascism:0 "$AST$"
 AST_permanant_military_forces:0 "Постійні збройні сили"
 AST_pig_iron_protests:0 "Протести через чавун"
 AST_political_events.5.desc:0 "Утворилася група зухвалих і суперечливих голосів: Рух «Австралія передусім». Уряд побоюється, що його наміри можуть бути не зовсім демократичними, і вирішив взяти групу, а також її членів, під нагляд. Втручання демократів знизить наші можливості до організації та придушить вербування нових членів."
 AST_political_events.8.a:0 "Ми повинні готуватися."
 AST_political_events.9.desc:0 "Те, що почалося як суперечка через завантаження чавуну, переросло в щось набагато більше. Робітники по всій Австралії кидають роботу на знак солідарності, кидаючи виклик як уряду, так і промисловості. У міру поширення страйків і зростання напруженості, криза розгортається і вимагає відставки тих, хто перебуває при владі. Тож, не зумівши повністю взяти ситуацію під контроль, уряд робить саме це, залишаючи посаду правлячої партії відкритою для [AST.GetCommunistParty]."
 AST_request_resource_rights_in_malaya:0 "Запросити права на ресурси у [MAL.GetNameDef]"
 AST_royal_australian_navy_spirit:0 "Королівський військово-морський флот Австралії"
 AST_singapore_strategy_desc:0 "Сінгапурська стратегія є ключовим компонентом австралійської оборонної політики, і як база для кораблів Королівського флоту, розміщених у Тихому океані, сама територія Сінгапуру має надзвичайно важливе значення. Ми переконаємо британців провести додаткове оборонне будівництво, тоді як самі зміцнимо австралійські військово-морські сили."
 AST_standard_gauge_railway:0 "Стандартизація залізниці"
 AST_summons_to_australian_hall_desc:0 "У нашому прагненні розширити [AST.GetFascistParty], ми повинні об'єднати та мобілізувати наших прихильників. Австралійський зал чекає."
 AST_super_heavy_tank_equipment_1:0 "Tortoise"
 AST_support_weapons4:0 "Bren Mk. III & ML 4.2 inch Mortar"
 AST_the_publics_australia:0 "Народна Австралія"
 AST_uap_election_campaign_tt:0 "§YВиборча кампанія УАП§!\n§LЗгуртувати середній клас, власників бізнесу та імперських лоялістів; Партія об'єднаної Австралії запустить політичну кампанію.§!\n\n§YЕфект:§!\nЩоденна вартість політичної влади: §R1.00§!\nЩоденне зростання голосів §YУАП§!: §G+0.05%§!"
 AST_uap_votes_count:0 "§YУАП§! має [?AST_uap_votes_var|2Y]§Y%§! Демократичних голосів.\n\nЩоденна зміна: [?AST_uap_votes_change_var|2Y]§Y%§![GET_AST_UAP_PARTY_CAMPAIGN][GET_AST_COUNTRY_PARTY_SUPPORT_UAP][GET_AST_BILLY_HUGHES_VOTES][GET_AST_ARTHUR_FADDEN_VOTES][GET_AST_MAURICE_BLACKBURN_UAP_VOTES][GET_ALP_VOTES_DAILY_IMPACT][GET_AST_UAP_DISCOUNT]"
 AST_union_control_events.1.a:0 "Тримайте їх під наглядом. Ми будемо спостерігати і чекати."
 AST_union_control_events.4.t:0 "Комуністичні диверсанти захоплюють території [MAL.GetAdjective]"
 AST_war_carriers_desc:0 "Логістика виграє війни, і більшість місцевості, в якій діє Австралія, погано підходить для звичайного транспорту, такого як вантажівки чи поїзди. Натомість ми повинні покладатися на місцеву робочу силу, добре пристосовану до умов і знайому з прихованими стежками та скороченнями."
 AST_war_is_coming_decrease_advisors_tt:0 "§Y$AST_maurice_blackburn$§!:"
 ASY_neutrality_party:0 "АЦС"
 ATJ_democratic:0 "Вільна держава Ачег"
 ATTRITION_TERRAIN:0 "\n - $TERR|H$: $ATT|=-1%0$"
 AUS_VICTORY_POINTS_442:0 "Тарнов"
 AUS_VICTORY_POINTS_557:0 "Цнайм"
 AUS_austromarxism_becomes_austrostalinism:0 "Національний дух §YАвстромарксизм§! буде змінено на §YАвстросталінізм§!"
 AUS_bring_phonix_insurance_from_the_ashes_tt1:0 "Заміняє §YПокриття страхувань Phönix§! на §YСтрахування Phönix§!"
 AUS_broke_the_treaty_democratic:0 "Порушив наш договір"
 AUS_covering_the_phonix_insurances:0 "Покриття страхувань Phönix"
 AUS_devalue_the_schilling_desc:0 "Однією з причин, чому наша економіка бореться та стагнує, є наша слабка валюта. Хоча рівень інфляції в 2877%, який ми мали в 1929 році, можна забути, як страшний сон, наша інфляція все ще надто висока. Можливо, це не найпопулярніше рішення серед людей, але ми повинні розглянути можливість девальвації нашої валюти."
 AUS_empowering_the_chancellor_desc:0 "Доля канцлера нашої країни нелегка. Ми не був би там, де ми є сьогодні, якби не [ROOT.GetLeader], і хоча ми не повинні перетворюватися на культ особистості, ми цілком можемо висловити вдячність нашому канцлеру."
 AUS_eugen_sanger:0 "Ойґен Занґер"
 AUS_franz_von_keil:0 "Франц фон Кайль"
 AUS_garrisoned_state_modifier:0 "Фортифікований регіон"
 AUS_graf_and_stift_organization:0 "Gräf und Stift"
 AUS_grossosterreich_fascism_key:0 "Велика Австрія"
 AUS_integrate_dnsap_remnants_desc:0 "В межах наших кордонів все ще існують і дишуть залишки НСРП, незважаючи на суворішу заборону. Більшість із мертвої партії об’єдналися в Великонімецьку народну партію, однак деякі все ще живуть у політичному вакуумі. Ми повинні спробувати завербувати їх до Вітчизняного Фронту, щоб запобігти подальшим повстанням з їхнього боку."
 AUS_inviting_the_observers_tt:0 "Відкриває сукупність рішень для §YЗапрошення більше Націй в Дунайську Федерацію§!"
 AUS_malke_schorr:0 "Мальке Шорр"
 AUS_medal_1:0 "Миличний хрест"
 AUS_mio_trait_innovative_riflemaking:0 "Інноваційний дизайн"
 AUS_news_events.10.c:0 "Уперед!"
 AUS_news_events.11.c:0 "Великий день для нашої Республіки!"
 AUS_phonix_fleugzeugwerke_improved:0 "Phönix Fleugzeugwerke"
 AUS_phonix_insurance_desc:0 "Програма страхування Phönix дозволила нашим військовослужбовцям придбати страхування життя, яке покриває їх на випадок, якщо трапиться найгірше. Усвідомлення того, що про їх сім'ї будуть дбати, значно збільшило кількість охочих йти в армію."
 AUS_political_events.103.t:0 "Турбуючий звіт щодо [GER.GetAdjective]ого експансіонізму"
 AUS_political_events.115.t:0 "[FROM.GetAdjective]о-[ROOT.GetAdjective]і спільні військові навчання?"
 AUS_political_events.21.t:0 "[FROM.GetNameDefCap] гарантує нашу незалежність"
 AUS_political_events.22.desc:0 "Використовуючи деякі з менш відомих пунктів і «дрібний» шрифт, [FROM.GetNameDef] не збирається пропонувати нам гарантії, ЗАТЕ пропонує нам дипломатичну підтримку в разі вторгнення. Вони стверджують, що впевнені, що їхні слова можуть переконати німецького лідера не гірше за загрози втручання, тому не бачать жодних причин мати людей напоготові для нас."
 AUS_political_events.33.a:0 "Чудово!"
 AUS_political_events.44.a:0 "Wunderbar!"
 AUS_political_events.45.a:0 "У нас є гарний контраргумент!"
 AUS_political_events.46.desc:0 "Намагаючись уникнути підкорення та обмеження їхньої незалежності, [FROM.GetAdjective] керівництво вжило рішучих заходів. Замість того, щоб напряму стати нашим підданим, вони згодні передати нам свої території, які раніше контролювалися нами. Однак це не той результат, якого ми очікували від наших вимог, ми згодні?"
 AUS_political_events.54.t:0 "[FROM.GetNameDefCap] незгодна з нашими претензіями на Габсбурґ"
 AUS_political_events.77.a:0 "Наш час виходить..."
 AUS_political_events.89.b:0 "Голос народу буде почуто!"
 AUS_revised_treaty_of_saint_germain_en_laye_desc:0 "Завдяки дипломатичним зусиллям, вплив оригінального Сен-Жерменського Договору було зменшено. Більше не страждаючи від жорстких обмежень розміру своєї армії [ROOT.GetNameDef] тепер може розпочати переозброєння хоча б мінімального масштабу."
 AUS_richard_steidle:0 "Рихард Штайдле"
 AUS_seeks_a_deal_desc_57:0 "Нам надійшла відповідь від [FROM.GetADjective]ого уряду, вони не готові піти на запропоновану нами угоду. Заявляючи, що їхні землі не продаються, вони рішуче відкидають будь-яку можливість продажу чи будь-якого домовлення щодо цих регіонів."
 AUS_speak_out_against_embargo:0 "Висловитися проти щодо ембарго Італії"
 AUS_strengthen_the_arms_industry_desc:0 "Деякі з наших старих виробників все ще відкладаються на виробництві цивільних товарів, незважаючи на наші зараз дуже очевидні потреби в озброєнні. Маючи грошовий стимул, ми зможемо змусити Збройовий завод Леопольда Гассера повернутися до військової справи та виробляти дуже потрібну нам зброю."
 AUS_suddeutschland_neutrality:0 "Південна Німеччина"
 AUS_supporting_italy_in_ethiopia_focus_tt:0 "Відкриває сукупність рішень для §YПідтримки Італії в Італо-Ефіопській війні§!"
 AUS_take_albania_desc:0 "[ALB.GetNameDefCap], можливо, не була найважливішою частиною наших земель, насправді вона ніколи й не була нашою, хоча, безумовно, були розроблені плани щодо цього. Проте зараз, коли ми знову підтверджуємо свою присутність на Балканах, немає жодних причин, щоб ми не вимагали цього їх сучасного уряду."
 AUS_the_danubian_federation_observers_decision:0 "Запросити державу [FROM.GetNameDef] в альянс [ROOT.GetFactionName]"
 AUS_the_homeland_front_desc:0 "У разі повномасштабного вторгнення до нас кожен австрієць повинен виконати свій обов’язок перед Батьківщиною. Ми повинні навчати наших солдатів спеціально для цього сценарію; сценарію битви за Батьківщину, щоб переконатися, що якщо це станеться, ми будемо готові."
 AUS_the_peoples_army_desc:0 "Наша відданість тому, щоб люди були належним чином озброєні в цій ситуації, мала неочікуваний, але дуже бажаний побічний ефект. Все більше людей бажають приєднатися до наших збройних сил."
 AUS_the_royals_of_liechtenstein:0 "Запросити королівську сім'ю Ліхтенштайну"
 AUS_totalitarian_safety_desc:0 "У 1933 році Енгельберт Дольфус привів Австрію до поточного політичного стану заради безпеки нашої країни. Рішення про повну ліквідацію парламенту викликало суперечки серед нашого народу, однак ми віримо, що воно було необхідне для нашої безпеки. Нехай Дольфуса більше нема з нами, але ми повинні продовжувати його курс заради нашої ж безпеки."
 AUS_trying_to_control_us:0 "Спроби контролювати нас"
 AUS_unlocks_diplomatic_decisions_tt:0 "§YВідкриває Рішення§ §YПровести $AUS_joint_military_exercises_decision$§! і §YСпробувати $AUS_industrial_bribery_decision$§!\n"
 AUS_veteran_head_of_agency:0 "Ветеран"
 AZR_ADJ:0 "Азербайджанськ"
 Argyrokastro:0 "Аргірокастрон"
 BACK:0 "Назад"
 BAD_SERVER_PASSWORD:0 "Неправильний пароль"
 BAH_ADJ:0 "Багамськ"
 BALTIC_events.101.t:0 "[From.GetNameDefCap] погоджується"
 BALTIC_events.19.t:0 "[SOV.GetNameDefCap] довіряє нам державу [BALTIC_country_to_transfer.GetNonIdeologyName]"
 BALTIC_german_war_economics:0 "Перейти на модель військової економіки ([GetBalticAxisInvesmentsAdj])"
 BALTIC_recent_skirmish_desc:0 "Ця держава недавно постраждала від сутички з опором місцевої воєнізованої організації."
 BALTIC_school_of_aviation_tech_bonus:0 "Школа авіації"
 BALTIC_squash_resistance:0 "Розчавити весь спротив"
 BAN_fascism_ADJ:0 "Бенґальськ"
 BAR_communism_ADJ:0 "Баротсейськ"
 BAS_ADJ:0 "Британо-антильськ"
 BATTLE_REINFORCE_CHANCE2:0 "Імовірність доповнити лінію фронту при виборі: $VALUE|2G%$\n"
 BAY_fascism:0 "Націонал-соціалістична держава Баварія"
 BA_italo_ethiopian_war_events.15.desc_b:0 "На жаль, Ліга націй не погодилася надати нам військові сили для допомоги. Замість цього вони лише закликали країни-члени допомогти нам, що, зрештою, не призвело до жодної великої підтримки. Прибула лише невелика кількість нових добровольців."
 BBA_african_union_events.11.desc:0 "[FROM.GetNameDefCap] погрожує членам нашого уряду особисто, якщо ми не почнемо узгоджувати свої політичні цілі з їхніми. Безсумнівно, це зроблено з метою тиску на нас задля подальшої інтеграції в Організацію Африканської Єдності."
 BBA_ethiopia_anti_colonialism_events.2.desc:0 "[?global.african_supporting_country.GetLeader], лідер держави [?global.african_supporting_country.GetNameDef], вимагає негайного припинення війни з [?global.african_revolt_country.GetAdjective]ими повстанцями. [?global.african_supporting_country.GetAdjectiveCap]і дипломати закликають державу [ROOT.GetName] визнати незалежність держави [?global.african_revolt_country.GetNameDef]. Вони не заявляють прямо, що [?global.african_supporting_country.GetNameDef] розпочне війну, якщо ми вирішимо відмовитися, але явно натякають на таку можливість."
 BBA_ethiopia_balance_of_power_events.51.b:0 "Потрібно зменшувати кількість приватних армій, а не збільшувати їх."
 BBA_ethiopia_communist_events.25.a:0 "Ми допоможемо їм завершити цю війну."
 BBA_ethiopia_communist_events.32.a:0 "Ми продовжимо змушувати їх страждати."
 BBA_ethiopia_communist_events.41.t:0 "[ETH.GetNameDefCap] вимагає виведення радників"
 BBA_ethiopia_communist_events.48.t:0 "[ETH.GetNameDefCap] пропонує мир"
 BBA_ethiopia_communist_events.53.desc:0 "На жаль, [SOV.GetAdjective] дипломати повідомили, що наразі не можуть направити жодного військового персоналу. Вони посилаються на загрози біля власних кордонів, які мають пріоритет. Однак, як жест доброї волі, вони надіслали нам партію піхотного спорядження."
 BBA_ethiopia_exile_events.16.t:0 "[FROM.GetNameDefCap] відмовляється"
 BBA_ethiopia_exile_events.21.a:0 "Це все ж таки краще, ніж нічого"
 BBA_ethiopia_exile_events.24.a:0 "Це зробить їх більш сильним союзником"
 BBA_ethiopia_exile_events.30.a:0 "Це закономірна ескалація"
 BBA_ethiopia_exile_events.31.desc:0 "[FROM.GetAdjective]ий уряд відхилив нашу пропозицію щодо спільної заявки на членство. На жаль, це означає, що нам доведеться боротися індивідуально, замість того, щоб мати підтримку більшого альянсу."
 BBA_ethiopia_exile_events.42.b:0 "Як вони сміють ставити під сумнів наші рішення?"
 BBA_ethiopia_exile_events.52.desc:0 "Нещодавня вечірка, проведена в резиденції його величності [ETH.GetLeader], мала великий успіх. Поки гості спілкувалися і насолоджувалися делікатесами, привезеними з усього світу, [?ETH.host_nation.GetAdjective]і політики почули від [ETH.GetAdjective]их вигнанців про жорстоку [ITA.GetAdjective]у окупацію батьківщини. Багато хто з них схилявся до підтримки виділення більшого обсягу [?ETH.Host_nation.GetAdjective]их ресурсів, щоби допомогти нам колись звільнити державу [ETH.GetNameDef]."
 BBA_ethiopia_fascist_events.20.desc:0 "[FROM.GetLeader] оголосив, що [FROM.GetNameDef] більше не визнає [ROOT.GetAdjective]е панування. [FROM.GetNameDefCap] бажає підтримувати добрі стосунки з державою [ROOT.GetNameDef], якщо це можливо, але [FROM.GetLeader] заявляє, що вони готові взяти до рук зброю та боротися за свою незалежність, якщо знадобиться."
 BBA_ethiopia_fascist_events.54.desc:0 "Ми отримали запит від держави [FROM.GetName] на військове оснащення. Це допоможе [FROM.GetAdjective]им військовим із модернізацією. Це також допомогло б нам позбутися деякого старого надлишкового оснащення."
 BBA_ethiopia_fascist_events.56.a:0 "Ми ніколи в них не сумнівалися."
 BBA_ethiopia_imperial_events.1.b:0 "Воно [ROOT.GetAdjective]е й таким залишиться!"
 BBA_ethiopia_imperial_events.8.desc:0 "[FROM.GetLeader] прийняв мудре рішення прийняти нашу владу. [FROM.GetName] буде лояльним підданим імператора [ROOT.GetLeader]."
 BBA_ethiopia_military_and_tech_events.1_war.desc:0 "[GetEthiopianMilitaryAcademyName] випускає перший в історії клас, який повинен буде відправитися прямо зі школи на війну. Побудувати цю школу і завершити навчання першого класу кадетів, одночасно ведучи війну, — це справді великий подвиг.\nЦе початок нової ери для [ROOT.GetAdjective]их військових!"
 BBA_italo_ethiopian_war_events.101.t:0 "[FROM.GetNameDefCap] приймає запит про прийняття уряду"
 BBA_italo_ethiopian_war_events.11.desc:0 "Делегати з держави [ETH.GetName] в Лізі Націй звернулися з проханням закрити Суецький канал для держави [ITA.GetName] в якості посилення санкцій проти держави [ITA.GetNameDef]. Після довгих дебатів у Раді, Рада вирішила задовольнити це прохання. Таким чином, державі [ROOT.GetNameDef] було доручено заблокувати будь-який [ITA.GetAdjective]ий трафік через канал."
 BBA_italo_ethiopian_war_events.15.t:0 "Наш заклик до міжнародної допомоги"
 BBA_italo_ethiopian_war_events.201.desc:0 "Завдяки такому тривалому протистоянню, бойовий дух простих солдатів починає підніматися. Коли початковий ентузіазм згас, багато хто почав сприймати можливу поразку як належне, але зараз знову з'явилися розмови про можливу перемогу. Також є явні ознаки адаптації підрозділів до нового стилю ведення бойових дій."
 BBA_italo_ethiopian_war_events.401.desc:0 "Італійці попросили, щоби ми передали всю державу під їхній контроль, для використання в якості плацдарму в їх війні проти держави [ETH.GetName]. Прийняття цієї пропозиції фактично покладе кінець незалежності держави [ROOT.GetName], але якщо ми відмовимося, то це, безумовно, означатиме вторгнення."
 BBA_italo_ethiopian_war_events.500.t:0 "Вимоги до миру"
 BBA_italo_ethiopian_war_events.510.t:0 "[ITA.GetNameDef] підриває авторитет Ефіопії"
 BBA_italy_anti_colonialism_events.03.t:0 "Кінець італо-ефіопської війни"
 BBA_italy_anti_colonialism_events.100.b:0 "Ми будемо стежити за новим італійським урядом!"
 BBA_italy_anti_colonialism_events.102.desc:0 "[FROM.GetAdjective]ий уряд прийняв мудре рішення приєднатися до нас, хоча і не об'єднавшись в одну країну, але прийнявши [ROOT.GetAdjective]е лідерство і керівництво. Хоча це не той результат, на який ми сподівалися, це зміцнить наші позиції в Середземномор'ї без пролиття крові."
 BBA_italy_anti_colonialism_events.102.t:0 "[FROM.GetAdjective]ий уряд прагне співпраці"
 BBA_italy_anti_colonialism_events.15.a:0 "Це їхня втрата!"
 BBA_italy_colonial_management.1.a:0 "Набрати їх!"
 BBA_italy_communist_events.09.desc:0 "Антоніо Ґрамші нарешті одужав після важкої хвороби, яку він переніс під час несправедливого ув'язнення. Він готовий допомагати нашій справі усіма можливими способами з сильнішим переконанням і запалом, ніж будь-коли раніше!"
 BBA_italy_democratic_events.02.desc:0 "[FROM.GetName] запросила нас приєднатися до нової ініціативи з обміну дослідженнями з ними. Це розширить і поглибить зв'язки та співпрацю між нашими країнами."
 BBA_italy_interaction_events.12.a:0 "Perfetto!"
 BBA_italy_interaction_events.25.desc:0 "Італійське міністерство оборони зробило нам попередження щодо нашої спроби приєднати австрійців до нашої країни. Вони заявляють, що якщо ми виступимо проти Австрії, то зіткнемося з серйозними контрзаходами з боку італійської армії. Як ми повинні реагувати на цю явну провокацію?"
 BBA_italy_interaction_events.28.a:0 "Oui, pour la liberté!"
 BBA_italy_interaction_events.33.a:0 "Невелика ціна за мир."
 BBA_italy_interaction_events.37.t:0 "Територіальні переговори завершено"
 BBA_italy_interaction_events.4.t:0 "Вимоги коронувати італійського принца"
 BBA_italy_interaction_events.6.t:0 "Аймоне зупинили на хорватському кордоні"
 BBA_italy_interaction_events.666.a:0 "Ми повинні виконати вимоги Його Святості..."
 BBA_italy_local_rulers.4.d:0 "Ніяких переговорів з місцевими правителями не буде."
 BBA_italy_missiolinis.11.desc:0 "Тепер дуче бажає швидке закінчення війни в Абіссінії, щоб Італія могла обернутися кудиінде для здобуття подальшої слави. Завоювання стародавніх земель Аксуму зміцнить позиції Італії як одної з великих імперій світу.\n\nПотрібно розправитися з залишковими оплотами абіссінців, і всі землі Абіссінії мусить опинитися в руках італійців."
 BBA_italy_missiolinis.201.desc:0 "Знайти потрібних людей на потрібні місця завжди важко — особливо, якщо потрібних людей не вистачає. Дуче переконаний, що для того, щоб Італія — і фашизм — досягли успіху, він повинен знайти здібних і кваліфікованих людей, які поповнять кабінет міністрів, і він призначить когось, хто буде шукати їх далеко і широко."
 BBA_italy_missiolinis.21.t:0 "Утихомирення Ефіопії"
 BBA_italy_missiolinis.212.desc:0 "Побоюючись, що його увага буде розпорошена, якщо йому доведеться особисто керувати військовими діями, дуче не соромиться скаржитися на брак компетентних людей в армії. Він упевнений, що ця проблема стане крахом Італії, якщо ситуація погіршиться."
 BBA_italy_missiolinis.42.desc:0 "Нестача італійських солдатів раз у раз мучить дуче, адже він вбачає в наших протяжних кордонах із нашими суперниками велику вразливість. Дуче почувається розбито після останньої невдалої спроби збільшити кількість військ і почав сумніватися у відданості народу його ідеї відновлення італійської величі."
 BBA_italy_missiolinis.92.t:0 "Фіаско зі службою розвідки"
 BBA_italy_naval_cooperation_programs.05.desc:0 "[FROM.GetName] прийняла нашу пропозицію про спільні морські маневри, усвідомлюючи необхідність бути підготовленими та готовими на випадок, якщо наші вороги нападуть на нас."
 BBA_italy_sends_military_support.1.a:0 "Це неодмінно стане в нагоді."
 BBA_swiss_expansion.12.desc:0 "Неочікувано, [FROM.GetNameDef] заявляє претензії на [ROOT.GetAdjective] Альпи. Їхня аргументація в кращому разі сумнівна, але значна частина їхнього населення мобілізована та готова до вторгнення, якщо ми відмовимо. До того ж, рельєф місцевості на їхню користь, що зробить війну довгою й дорогою. Ми маємо зважити всі варіанти."
