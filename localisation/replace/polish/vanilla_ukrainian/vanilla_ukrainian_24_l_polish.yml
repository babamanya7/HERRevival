 USA_north_american_dominion_desc:0 "Зміцнивши наші найближчі рубежі, ми мусимо спрямувати погляд у далечінь і завдавати попереджувальних ударів по будь-яких ворогів Північної Америки. Ми не зазнаємо держав-ізгоїв у цьому регіоні."
 USA_raise_the_free_corps_tt:0 "Створює лояльні піхотні підрозділи на територіях, що залишаються під контролем уряду."
