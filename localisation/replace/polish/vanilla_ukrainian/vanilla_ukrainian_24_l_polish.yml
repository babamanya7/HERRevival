 SPR_repair_and_expand_the_dockyards_desc:0 "Великі верфі не були захищені від руйнувань громадянської війни. Ремонтуючи їх, ми також повинні розглянути питання про їх розширення, щоби бути готовими до майбутніх програм розширення ВМС."
