 JAP_hideo_shima:0 "Хідео Шіма"
 JAP_ikki_kitas_state_socialist_ideals_desc:0 "Письменник і політичний філософ Іккі Кіта є дуже впливовим і залученим до нашого руху. Він багато разів критикував капіталістичні моделі, називаючи себе соціалістом. Ми повинні прийняти його ідеї та реорганізувати економіку так, щоб вона більше відповідала цьому ідеалу."
