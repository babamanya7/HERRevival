 SUBDOCTRINE_NAVAL_STRIKE_TACTICS_DESC:0 "Авіація авіаносців має пройти крізь частокіл ворожих винищувачів і зенітної артилерії, щоб доставити свій вантаж. Наше навчання буде акцентувати на живучості та завзятості у доведенні атаки до кінця."
 SUBDOCTRINE_OPEN_OCEAN_AIR_PATROL_DESC:0 "Дальність польоту сучасних літаків дозволяє здійснювати морський пошук і завдавати ударів по ворожих об'єктах задовго до того, як вони загрожуватимуть нашим берегам."
