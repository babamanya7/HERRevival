 CZE_AUS_danubian_state_DEF:0 "Дунайська держава Чехословаччина"
 CZE_HOL_autonomy_eu_member_DEF:0 "Європейська Чехословаччина"
 CZE_a_divided_nation_ukrainian_states_desc:0 "Попередні інвестиційні зусилля не змогли подолати промислову нерівність у регіоні [FROM.GETNAME]. Для покращення ситуації потрібні нові інвестиції."
 CZE_air_training_abroad_desc:0 "Відправляючи курсантів до військово-повітряних сил дружніх до нас країн, ми отримуємо цінний досвід та різнобічні погляди, коли вони повертаються на службу."
 CZE_back_against_the_mountains_RUT_desc:0 "Ніхто в міжнародній спільноті не прийде на допомогу державі [ROOT.GetName] під час війни."
 CZE_bastion_of_liberty_desc:0 "Протягом цього десятиліття ми були однією з небагатьох справді плюралістичних країн Європи на схід від Рейну. Зробімо так, щоб люди цього не забули."
 CZE_benees_mraz_organization:0 "Beneš-Mráz"
 CZE_bop_no_agrarians_tt:0 "$CZE_bop_ready_for_anything_tt$§Y$CZE_agrarian_politics_1$§!"
 CZE_bring_kramer_and_lobel_under_state_control_desc:0 "Націоналізувавши компанію «Крамер і Лобль», ми зможемо забезпечити безперервні дослідження та своєчасне постачання важливих електротоварів і радіоаксесуарів."
 CZE_broken_shield:0 "Розбитий щит"
 CZE_ceskoslovenska_armada_dynamic_modifier:0 "Československá Armáda"
 CZE_change_the_narrative_desc:0 "Хоча досі церква не підтримувала нашу революцію, узгодження її цінностей з нашими може зіграти важливу роль у створенні підтримки нового режиму."
 CZE_czech_state_oil:0 "Чеська державна нафта"
 CZE_department_2_idea_lar:0 "2-й департамент"
 CZE_disoriented_minister_of_foreign_affairs:0 "Дезорієнтований міністр закордонних справ"
 CZE_elevate_slovak_officers:0 "Просувати словацьких офіцерів"
 CZE_embezzle_quatermaster_funds_desc:0 "Про наших солдатів і так добре дбають. Звісно ж, ніхто не помітить і не засмутиться, якщо частина коштів, призначених для наших казарм, піде кудись інде."
 CZE_expand_airfield_capacity:0 "Розширити місткість аеродромів"
 CZE_expand_existing_armory_plants_desc:0 "Перенесення деяких із наших існуючих збройових заводів буде дорогою інвестицією з невеликою довгостроковою вигодою. Розширення існуючих підприємств дасть переваги та можливості для збільшення виробництва, а також досліджень і розробок на цих поточних локаціях. Навіть із ризиком того, що вони перебуватимуть у місцях, які легше атакувати потенційним ворогам."
 CZE_expand_prf_science_facilities_desc:0 "Наукові установи PrF сповнені армією світлих голів, які чекають на можливість зробити щось більше, ніж те, чим вони займаються зараз. Розширення факультету та залучення їх до співпраці з урядом є гарним початком для покращення наших досліджень."
 CZE_expand_the_horska_divisions_desc:0 "Оскільки наша країна складається переважно з невисоких пагорбів і плато, наші солдати, спеціально навчені для ведення війни в гірських умовах, відіграватимуть вирішальну роль на цій складній місцевості."
