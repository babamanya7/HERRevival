 EST_events.701.d:0 "Сьогодні демонстрації вапсів, що йдуть по всій країні, досягли переломного моменту: сутички між представниками уряду, яким керує [Root.GetLeader], і вапсами перейшли в насильницьку конфронтацію. На заклик Артура Сірка протестуючі заблокували ворота Рііґікоґу де швидко звели імпровізовані барикади, що не дають представникам закону проникнути в будівлю. своїй відставці з посади диктатора на користь Артура Сірка."
 EST_fight_vaps_decisions:0 "Боротися з вапсами"
 EST_generic_fascist_demagogue:0 "Йоганнес Варес-Барбарус"
 EST_sieze_swedish_assets_desc:0 "Шведи сидять на своїх ресурсах, нічого не роблячи і роздаючи їх лише тим державам, які здаються їм найбільш страшними. З таким розбазарюванням настав час кінчати. Ці ресурси необхідно віддати під опіку Естонії."
 EST_squash_the_opposition_desc:0 "Установивши повну владу над цивільним урядом, ми мусимо викорінити всі чорні паростки зради з нашого кабінету міністрів і місцевих урядів. Ті, хто виступає проти нашого керівництва, мусять швидко засвоїти, що виступати проти Патріотичної ліги значить піти супротив самої Естонії."
 EST_submarine_2_desc:0 "The Kalev class consisted of two submarines built in the U.K. for the Estonian navy in 1936. Its primary purpose was minelaying, though it was also armed with four 533mm torpedo tubes."
 EST_support_independent_militaries:0 "Підтримати незалежні війська"
 ETA_DAYS_WEEKS:0 "§TЛишилося $DAYS|H$ дн. і $WEEKS|H$ тиж. із $COST|H$ дн.§!"
