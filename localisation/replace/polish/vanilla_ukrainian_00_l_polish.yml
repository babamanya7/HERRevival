 HUN_CAS_equipment_1_short:0 "WM-16"
 HUN_FACTION_COMMIE:0 "Союз комуністичних рад"
 HUN_a_multi_ethnic_empire_desc:0 "Наша імперія охоплює багато різних народів і культур, і ми повністю це прийняли, надаючи велику автономію різним регіонам нашої держави, змушуючи наші народи хотіти залишатися її частиною."
