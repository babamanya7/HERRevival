 NOR_reviving_the_norgesveldet_desc:0 "Наших предків боялися всі, вони здійснювали набіги та завойовували скрізь, де могли бачити, і куди пливли. Ми повинні озирнутися в минуле та повернути цей дух. Ми можемо стати новою загрозою вікінгів, яка не дає дітям спати вночі."
 NOR_send_the_king_back_to_denmark:0 "Відправити короля назад до Данії"
 NOR_switch_to_fascist_TT:0 "§R$NOR_fascism$, який очолює [NOR.GetFascistLeader], стане новим урядом. Спалахне громадянська війна.§!"
 NOR_the_crowns_executive_powers_desc:0 "Оскільки король продовжує відхиляти будь-які заклики до нього мати абсолютну владу, у нас немає іншого вибору, окрім як надати йому виконавчі повноваження. Коли він прокинеться від політичної дрімоти, він матиме інструменти, як скерувати державу [ROOT.GetNonIdeologyName] до слави!"
