 ss_recruitment_event.22.desc:0 "Уряд отримав низку скарг від керівників кількох заводів. Вони отримали замовлення на матеріали від «Управління будівництва та закупівель SS». Після доставки їх відправили до «Управління фінансових питань SS», яке повинно було заплатити їм, але натомість переслали їх далі до «Управління економічного співробітництва SS», де їм сказали, що початковий офіс повинен був заплатити їх безпосередньо.\n\nМожливо, ще більш тривожними є замовлені матеріали — точне обладнання, велика кількість хімікатів, що використовуються для виготовлення добрив, а також кількість сталі та листового металу.\n\nГіммлер відмовився обговорювати ці події з урядовими чиновниками, але був підслуханий розмови з високопоставленим офіцером зв'язку SS у міністерстві економіки, який сказав, що «якщо [GER.GetLeader] не дасть мені зброю, мені доведеться просто побудувати власну». Мені байдуже, де і як я отримаю те, що мені для цього потрібно»."
 ss_recruitment_event.7.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що в Латвії є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS."
