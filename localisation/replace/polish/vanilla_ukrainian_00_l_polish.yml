 NOR_claims_on_faroe_islands_desc:0 "Внаслідок минулих порушень монархій [DEN.GetNonIdeologyName] і [SWE.GetNonIdeologyName] нам було відмовлено у Фарерських островах. Час із цим покінчити. [NOR_GetFaroeClaimsDesc]"
