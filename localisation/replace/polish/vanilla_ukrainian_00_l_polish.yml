 PER_brown_shirts_tt:0 "§YМи отримаємо [?ROOT.PER_fascist_militia_count] дивізій ополчення після вступу у громадянську війну проти шаха або після становлення фашистами.§!"
 PER_clash_of_titans_desc:0 "Виникла непередбачена проблема у вигляді відродження [GRE.GetNameDef]. Ми не можемо дозволити іншій такій імперії набирати силу на наших кордонах. Ми повинні негайно оголосити війну та рухатися, щоб забезпечити цю землю для слави шаха!"
 PER_coastal_defense_initiative_desc:0 "Незважаючи на те, що ми маємо обмежений доступ до світових океанів, вторгнення морем все ще є реальною можливістю. Щоб забезпечити захист узбережжя [PER.GetNonIdeologyName], ми повинні виступити з ініціативою розвитку оборони вздовж берегів Перської затоки та Каспійського моря."
 PER_communist_events.10.desc:0 "Будь-який шанс знайти дипломатичне вирішення кризи в Затоці випарувався після рішення [FROM.GetNameDef] надіслати військово-морське з'єднання, щоб прорвати нашу блокаду в регіоні. Якщо ми хочемо зберегти елемент несподіванки, ми повинні негайно завдати превентивного удару. В іншому випадку нам, ймовірно, слід знизити рівень ескалації."
 PER_communist_events.5.b:0 "Вони і чий флот?"
 PER_communist_industrialization_desc:0 "Ми створимо новий департамент для нагляду за розширенням та модернізацією економіки, вільний від упередженості та інерції попередніх економічних департаментів."
 PER_conscription_idea:0 "Кожен чоловік служить"
 PER_constitutional_monarchy:0 "Відновлення конституційних обмежень для шаха"
 PER_construct_air_bases:0 "Побудувати авіабази"
 PER_core_byzantium_state:0 "Інтегрувати [FROM.GetName]"
 PER_dalir_pesyan:0 "Далір Песян"
 PER_embrace_industrial_powers_desc:0 "Замість того, щоб ховатися та ізолюватися від решти світу, для нас було б набагато краще використати наші зв'язки з промисловими державами, щоб допомогти у розвитку майбутнього [PER.GetNameDef]."
 PER_establish_special_unit:0 "Створити Легіон Безсмертних"
 PER_fascism_sway_the_rich_idea:0 "Схиляння еліти"
 PER_foothold_in_indus_desc:0 "[RAJ.GetNameDefCap] — це яскравий приклад колоніальної могутності [ENG.GetNameDef]. Однак [ENG.GetAdjective]s тут не місце, і їм було б добре дізнатися, що ця земля є [PER.GetNameDef] правом народження за словом Дарія Великого. Розпочати переговори та забезпечити наш плацдарм в Індії."
 PER_homeland_not_fall_idea:0 "Наш бойовий дух"
 PER_hormuz_crisis:0 "Криза в Ормузькій протоці"
 PER_imperial_events.1.b:0 "Ми не можемо на це погодитися."
 PER_imperial_events.112.a:0 "Ми поженемо їх до їхньої столиці!"
 PER_imperial_events.12.b:0 "Тоді ми заберемо це силою."
 PER_imperial_events.120.b:0 "Абсолютно ні, просуватися до столиці."
 PER_imperial_events.14.t:0 "[FROM.GetNameDefCap] погрожує війною"
 PER_imperial_events.142.t:0 "[PER.GetAdjective] Честь відновлена"
 PER_imperial_events.171.desc:0 "Чудова новина! [FROM.GetNameDefCap] погодився на наші вимоги миру та почав виводити свої війська з наших кордонів. Їхні провини під час цієї війни означають, що ми змогли вимагати репарації за вторгнення. Ми довго і наполегливо боролися, щоб утримати їх на відстані, і цей день слід святкувати роками!"
 PER_imperial_events.172.t:0 "$PER_imperial_events.162.t$"
 PER_imperial_events.200.t:0 "Саадабадський пакт"
 PER_imperial_events.62.a:0 "Прикрий поворот подій..."
 PER_imperial_events.71.t:0 "[GER.GetNameDefCap] надсилає запрошення до візиту"
 PER_imperial_expansionism_desc:0 "Настав час нам почати працювати над розширенням нашої нової імперії за межі наших поточних кордонів. Ми повинні підготувати нашу військову машину, закликати наше населення виконати свій обов'язок та готуватися показати світові, що [PER.GetAdjective] Імперія готова вимагати те, що належить нам по праву."
 PER_iranian_iraq_DEF:0 "Домініон Ірак"
 PER_iranian_socialist_revolution:0 "Іранська соціалістична революція"
 PER_islamic_revolution_events.1.t:0 "Нестабільність серед духовенства"
 PER_kurdish_revolt_mission:0 "Курдське повстання неминуче"
 PER_loyalist_iran_ADJ:0 "Іранськ"
 PER_luftwaffe_planes_desc:0 "Коли справа доходить до виняткових літаків, Люфтваффе [GER.GetNameDef] є одними з найкращих. Оскільки ми вже маємо тісні зв'язки з [GET.GetNameDef], має сенс звернутися до них і купити будь-які надлишкові літаки, які їм більше не потрібні."
 PER_middle_east_protectorate:0 "Створити протекторат над Близьким Сходом"
 PER_navy_shortcut:0 "Флот"
 PER_nuclear_program:0 "[PER.GetAdjective] Ядерна програма"
 PER_persia_DEF:0 "Персія"
 PER_proclaim_greater_iran_desc:0 "Наші кордони відновлені до своїх законних позицій на всіх фронтах, і ми звільнили наш народ від тиранії іноземного правління. Тепер ми можемо нарешті проголосити народження Великого Ірану, який витримає випробування часом."
 PER_reject_foreign_dominance:0 "Відкинути іноземне домінування"
 PER_reverse_engineer_tanks_desc:0 "Уважніше розглядаючи танки, які ми виробили, що надійшли від іноземних держав, ми можемо дізнатися, як вони працюють і як ми можемо виробляти власні конструкції для майбутнього використання. Це перший крок на шляху до розробки власних танкових конструкцій [PER.GetNonIdeologyName]."
 PER_secularize_the_state:0 "Secularize the State"
 PER_secure_iraq_desc:0 "У рамках наших обов'язків перед нашими союзниками, ми повинні прагнути забезпечити безпеку [IRQ.GetNameDef] будь-якими необхідними засобами. Цей рішучий захід спрямований на забезпечення захисту [IRQ.GetAdjective] народу від будь-яких зовнішніх загроз, а також на сприяння єдності в регіоні."
 PER_ssb_events.8.t:0 "[FROM.PREV.GetNameDefCap] оголошує війну [FROM.PREV.FROM.GetNameDefCap], порушуючи Саадабадський пакт!"
 PER_swedish_artillery_desc:0 "[SWE.GetAdjective] розробили потужну артилерію, яку ми вигідно матимемо в нашій армії. Ми повинні звернутися до цієї нордичної нації та спробувати домовитися про ліцензійну угоду, щоб ми могли розпочати власне виробництво."
 PER_war_plan_cambyses_idea:0 "Військовий план Камбіса"
 PER_women_vote:0 "Розширити виборче право для жінок"
 PHI_asian_trade_connections:0 "Азійські торговельні зв'язки"
 PHI_benguet_corporation_improved_tt:0 "Ефекти від промислового концерну §Y$PHI_benguet_corporation$§! покращено"
 PHI_bring_in_eisenhower_desc:0 "Подібно до МакАртура, Дуайт Д. Айзенгауер працював радником філіппінського уряду з 1935 року, і МакАртур вирішив офіційно залучити цього перспективного офіцера до свого штабу. Хоча надходили повідомлення про антипатію між ними, можливо, їхні різні характери та стилі керівництва стануть тим доповненням, яке необхідне для безпеки нації."
 PHI_comitern_desc:0 "Хоча наші зв'язки з [SOV.GetNameDef] були в кращому випадку слабкими, не можна заперечувати їхню силу на міжнародній арені, і якщо ми бажаємо, щоб наш комуністичний експеримент тривав і експортувався іншим, ми повинні об'єднатися в одну сферу задля покращення соціалістичного ідеалу в усьому світі."
 PHI_decision_cost_icon_truck_blocked:0 "§R100§! £GFX_unit_motorized_icon_small"
 PHI_department_of_foreign_affairs_category:0 "$PHI_department_of_foreign_affairs$"
 PHI_economic_nationalism:0 "Економічний націоналізм"
 PHI_eustacio_orobia:0 "Eustacio Orobia"
 PHI_hispanic_overtures:0 "Іспаномовні ініціативи"
 PHI_investment_fund_desc:0 "Хоча індивідуальні інвестиції в нашу країну дуже цінуються, щоб справді максимально використати цей капітал, він повинен зберігатися в централізованому фонді під управлінням тих, хто дійсно знає економічні реалії тут, на Філіппінах. Це дозволить належним чином спрямовувати ці інвестиції туди, де їх можна найкраще використати для отримання найвищого прибутку."
 PHI_jap_equipment_non_aat:0 "§Y[PHI.GetName]§! використовуватиме §Yрозробників спорядження [JAP.GetName]§!."
