 MAN_tsr_request_dalian_desc:0 "Японія наразі окупує маньчжурське портове місто Далянь, розташоване на краю Ляодунського півострова, як частину орендованої території Квантун. Однак ми повинні спробувати переконати їх передати його нашому уряду, оскільки для них різниця буде незначною, тоді як для нас це буде надзвичайно корисно."
