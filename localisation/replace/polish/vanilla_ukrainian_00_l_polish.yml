 SWE_undermine_the_fascists_desc:0 "Фашисти, які борються за владу, є не чим іншим, як розлюченим натовпом, маючи шанс, що вони призведуть націю до краху. Ми повинні підірвати їхню підтримку та забезпечити, щоб усі справжні патріоти залишалися вірними Королю."
