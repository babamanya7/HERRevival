 POLITICS_INVALID_IDEA_REMOVED:0 "§HНевідповідна ідея $IDEA|R$ видалена§!"
 POL_ROM_UNION_neutrality:0 "Королівство Польща-Румунія"
 POL_STATE_5:0 "Вармія-Мазурія"
 POL_VICTORY_POINTS_6282:0 "Щецин"
 POL_air_modernisations_programme:0 "Програма модернізації ВПС"
 POL_april_constitution_fas:0 "Виправлена Квітнева конституція"
 POL_arm_peasant_militia_desc:0 "Польське селянство звільниться від своїх гнобителів лише одним шляхом — взявши до рук зброю і воюючи з буржуазією. Використовуючи політичний капітал Фронту Морж для викрадення обладнання в Санації, ми почнемо війну з повністю навченим і озброєним селянством."
 POL_baltic_navy:0 "Вартовий Балтики"
 POL_belorussian_army_desc:0 "У Білорусі є багато незалежних військових угруповань, готових боротися проти держави [SOV.GetNameDef]. Усе, що нам потрібно зробити — це надати їм офіційне визнання і запропонувати їм військове керівництво."
 POL_carrier_2:0 "Клас «Zygmunt Waza»"
 POL_claim_russia_desc:0 "Король Анастасія Романова — остання жива спадкоємиця царя Ніколая ІІ, і тому її претензії на російський престол не лише законні; це воля Божа. Маючи підтримку російських дворян, Анастасія готова повернути собі право бути імператрицею Росії за правом народження."
 POL_claiming_lithuania:0 "Претендент на корону Речі Посполитої"
 POL_complete_april_constitution:0 "Завершити Квітневу конституцію"
 POL_control_the_bosporus_desc:0 "Румунський альянс абсолютно безглуздий, якщо ми не зможемо переправити армію і флот через протоку Босфор. Туреччина становить життєво важливий стратегічний інтерес для нашої країни, і ми повинні переконати її співпрацювати."
 POL_demand_LIT_pavel:0 "Вимогти Литву"
 POL_diplomatic_mission_to_GRE_desc:0 "$POL_diplomatic_mission_to_FIN_desc$"
 POL_dismantle_soviet_empire_desc:0 "[GetDismantleSovietEmpireDesc]"
 POL_fight_against_monarchy_in_LIT_cat:0 "Протистояти іноземному претенденту"
 POL_greater_commonwealth_desc:0 "Амбіції Речі Посполитої виходять далеко за межі історичних кордонів колишнього королівства. Річ Посполита в серцях поляків — це велика імперська держава, мультикультурна імперія, яка сяє від моря до моря!"
 POL_growing_monarchist_sentiment:0 "Зростаючі монархічні настрої"
 POL_habsburg_events.101.desc:0 "Схоже, наш ультиматум державі [From.GetNameDef] переконав уряд зробити Отто фон Габсбурга королем Угорщини! Тепер, коли на тронах і Угорщини, і Польщі сидять Габсбурги, на Європу чекає нова ера Габсбургів."
 POL_infantry_at:0 "Kb Ppanc wz. 35 Ur"
 POL_integrate_greater_kashubia:0 "Інтегрувати Померанію"
 POL_intervention_focus:0 "Акцент на інтервенції"
 POL_invite_somua_desc:0 "Французька моторизована та броньована техніка витриваліша від інших і здатна брати снаряди від ворожої техніки, майже не зазнаючи жодних пошкоджень. Це типи транспортних засобів, які нам потрібні, щоби пережити війну."
 POL_italian_alliance:0 "Італійський альянс"
 POL_light_ship_engine_1:0 "«Parsons» 33 000 к. с. н. в."
 POL_lithuanian_alliance:0 "Альянс із Литвою"
 POL_pro_allied_government:0 "Призначити просоюзницький уряд"
 POL_promote_chemical_industry_desc:0 "До часів санаційного уряду Ігнацій Мосціцький був інтелектуалом і хіміком. Тепер, на чолі польської держави, Мосціцький займає позицію, яка дозволяє йому підтримувати хімічну промисловість та її дослідження."
 POL_resistance_industries:0 "Промисловість спротиву"
 POL_roman_czerniawsi:0 "Роман Чернявський"
 POL_romanov_desc:0 "Хоча це малоймовірний кандидат, дівчина, яка називає себе Анастасією Романовою, стверджує, що останнім монархом Польщі був цар Ніколай II, а отже, її претензії на Польщу є богоугодними."
 POL_sea_to_sea_desc:0 "Річ Посполита — це набагато більше, ніж просто союз Польщі та Литви; це славетна імперія, що мерехтить від моря до моря, від Польщі до Криму."
 POL_second_man_of_the_state_desc:0 "Ліві санаційні сили були достатньо відсунуті на узбіччя, і тепер Сміглий і Мосціцький здатні повністю позбавити лівих впливу в уряді. Сміглий має стати «другою людиною», що означає, що під час війни Мосціцький мусить поступитися своїм президентським кріслом Правій санації та військовим."
 POL_ship_torpedo_sub_3:0 "6x 550-мм ТА з заряд. порш."
 POL_strat_bomber_equipment_2_short:0 "Osa"
 POL_submarine_2:0 "Клас «Orzeł»"
 POL_sway_lithuanian_generals:0 "Вплинути на [From.GetAdjective]их генералів"
 POL_the_bombe:0 "«Бомба»"
 POR_british_influence:0 "Британський вплив"
 POR_colonial_army_desc:0 "Щоб мати сильну націю, ми не можемо покладатися лише на столичну армію. Ми повинні створити колоніальні підрозділи, озброїти їх і навчити воювати в сучасній війні."
 POR_concordat_with_the_holy_see:0 "Конкордат зі Святим Престолом"
 POR_const_kingdom_neutrality:0 "Королівство Португалія"
 POR_deal_with_the_japanese_threat_desc:0 "Японська армія загрожує нашим володінням у Тихому океані, займаючи прилеглі анклави та ізолюючи наші колонії. Ми мусимо передбачити їхні можливі військові дії, принісши війну на батьківщину Японії зараз, коли вони цього не очікують."
 POR_endless_sea_desc:0 "Наші анклави в Азії піддаються ворожнечі з боку імперій, які їх оточують. Ми повинні зосередитися на зміцненні їхнього захисту, щоб вони могли протистояти всякому можливому вторгненню."
