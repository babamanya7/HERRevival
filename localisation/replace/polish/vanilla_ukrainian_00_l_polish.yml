 RAJ_modernizing_army_desc:0 "Протягом тривалого часу індійську армію розглядали як не більше ніж колоніальну охорону. Вона була позбавлена багатьох переваг та спорядження, доступних військам британської метрополії. Але тепер настав час модернізувати її, використовуючи все, що у нас є під рукою."
 RAJ_mongol_legacy:0 "Монгольська спадщина"
 RAJ_mughal_court_party:0 "МД"
 RAJ_ordnance_factory_khamaria_jabalpur_desc:0 "Розташований у Джабалпурі, Збройовий завод Хамарія є ключовим виробником боєприпасів та озброєнь. Розширення його потужностей зміцнює вогневу міць наших військових, забезпечуючи, що наші сили залишаються добре оснащеними для будь-якого виклику."
