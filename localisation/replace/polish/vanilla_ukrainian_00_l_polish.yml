 JAP_integrate_the_great_empire_of_manchuria_desc:0 "З Асоціацією злагоди, що твердо стоїть на нашому боці, Пуї та його лоялісти не мають достатньо влади, щоб завадити нам покінчити з їхньою автономією. Нарешті настав час об'єднати наші дві нації під владою єдиного істинного Імператора!"
 JAP_interservice_rivalry_army_dominant:0 "Суперництво служб — домінування армії"
