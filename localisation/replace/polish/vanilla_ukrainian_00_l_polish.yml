 AST_election_season_cat:0 "Сезон виборів"
 AST_election_season_cat_desc:0 "Щойно один уряд облаштувався, як наступний готується зайняти його місце. На даному етапі мало що можна зробити, щоб вплинути на громадську підтримку, хоча це не зупинить партії від спроб. Нічого не закінчено, поки не закінчено, і цей день настане на виборчих дільницях."
