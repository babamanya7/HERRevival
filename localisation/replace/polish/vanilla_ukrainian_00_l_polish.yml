 ARG_british_cooperation_idea_desc:0 "[ENG.GetNameDefCap] є одним із наших найдавніших торгових партнерів. Оскільки ми продовжуємо дотримуватися наших численних договорів та угод, ми можемо виявити, що наша ідеалогія змінюється, щоб відповідати їхній."
 ARG_british_gaurantee:0 "Тісніші зв'язки з Британією"
 ARG_communism_party:0 "КПА"
 ARG_coup_imminent_tt:0 "§RПрийняття цього фокусу розпочне місії «Військове невдоволення» з відліком часу.§!"
 ARG_dominate_the_south_desc:0 "З такою кількістю супротивників, що оточують нас на континенті, вкрай важливо, щоб ми звернулися до них із залізним кулаком та знищили будь-які потенційні загрози, перш ніж вони виникнуть. Давайте покажемо їм, хто є найбільш домінуючою силою в Південній Америці."
 ARG_enrique_mosca:0 "Енріке Моска"
 ARG_envoy_to_london_idea_desc:0 "Поки ми продовжуємо підтримувати один одного, [ENG.GetNameDef] матиме друга в державі [ARG.GetNameDef]. Для наших двох країн важливо залишатися політично пов'язаними і гарантувати, що наші цілі залишатимуться узгодженими."
 ARG_german_loan_repaid_flag:0 "[GER.GetAdjective]у позику сплачено"
 ARG_heavy_cruiser_1_desc:0 "The Garibaldi class represents a class of armored cruisers built for Argentina around the turn of the century. All were obsolete by the mid-1930s, with the last one being decommissioned by 1932. They were replaced in 1931 by the British-built Veinticinco de Mayo-class heavy cruisers."
 ARG_improved_cooperation_idea:0 "Поліпшене співробітництво"
 ARG_infamous_decade_idea:0 "Безславна декада"
 ARG_integrate_operation_bolivar_idea_lar:0 "Інтеграція операції «Болівар»"
 ARG_international_loan_decisions:0 "Міжнародні позики"
 ARG_legitimize_the_PCA_desc:0 "Комуністична партія Аргентини є основною комуністичною партією в [ARG.GetNameDef]. З моменту свого заснування партія підтримувала узгодження з Комуністичною партією Радянського Союзу, що часто викликало тертя з рештою лівих сил [ARG.GetNameDef]. Однак, тепер, коли ми потребуємо кардинальних змін, щоб покінчити з «Сумним десятиліттям» (Infamous Decade), можливо, настав час легітимізувати цю партію в [ARG.GetAdjective] уряді."
 ARG_loan_from_britain:0 "Узяти позику в держави [ENG.GetFlag]§Y[ENG.GetName]§!."
 ARG_maintain_neutrality_idea:0 "Присвячені собі"
 ARG_news_events.3.d:0 "Триваюче заворушення у [ARG.GetNonIdeologyName] вийшло з-під контролю в останні дні, що призвело до громадянської війни. Очолювані колись вигнаним Родольфо Гйольді та підтримувані багатьма лівими членами [ARG.GetAdjective] конгресу, комуністи тепер відокремилися від уряду в спробі захопити контроль та запровадити радикальні зміни по всій нації. Багато хто в регіоні стурбований тим, що комуністична [ARG.GetNonIdeologyName] спричинить ланцюгову реакцію по всьому континенту Південної Америки."
 ARG_our_own_path:0 "Наш власний шлях"
 ARG_political_events.25.t:0 "[CHL.GetNameDefCap] погоджується приєднатися до нашої фракції"
 ARG_political_events.26.desc:0 "[CHL.GetAdjective] уряд вперто відмовився приєднатися до нас у наших цілях завоювання континенту. Хоча ми не можемо змусити їх до цього, ми все ще потенційно можемо перенести нашу праведну війну до їхнього порогу. У будь-якому випадку, це сумний день для відносин між нашими двома націями."
 ARG_political_events.3.desc:0 "Президент [ARG.GetLeader] з [ARG.GetName] звернувся до нас сьогодні із заявкою на приєднання до Союзників у нашій боротьбі проти ворогів. Здається, наші прохання про американську єдність перед обличчям таких негараздів нарешті були почуті."
 ARG_political_events.38.desc:0 "Керівництво [ARG.GetNameDefCap] звернулося до нас з вимогою передати контроль над нашою землею в Екваторіальній Гвінеї як відшкодування за їхню підтримку під час нашої недавньої війни проти республіканців. Ми, можливо, захочемо уважно розглянути наші варіанти."
 ARG_political_events.40.t:0 "[SPA.GetNameDefCap] погоджується на наші вимоги"
 ARG_political_events.60.b:0 "Ми повинні йти самі."
 ARG_political_events.7.a:0 "Не дуже добре, але ми погодимося."
 ARG_raf_cooperation_idea:0 "Співробітництво з Королівськими ВПС"
 ARG_reinforce_the_education_system_desc:0 "Освіта є основою демократичної нації. Кожен, хто живе в [ARG.GetNameDef], має мати свободу відвідувати школу, щоб зростати та розвиватися як чесні, працьовиті громадяни. Ми повинні скористатися цією можливістю, щоб зосередити наше фінансування на конкретних професіях, сподіваючись, що це дозволить нам розвивати власні технологічні та економічні досягнення."
 ARG_revisit_the_roca_runciman_treaty_desc:0 "Договір Роки–Рансимена діє з 1933 року, забезпечуючи наш експорт яловичини з [ENG.GetName]. Однак, з огляду на недавній розвиток нашої економіки, можливо, настав час нам домовитися про новий договір з [ENG.GetAdjective] і отримати ще вигіднішу торговельну угоду."
 ARG_socialist_unification_idea:0 "Соціалістичне об'єднання"
 ARG_south_american_unity_decisions_tt:0 "Відмикає сукупність рішень §Y$ARG_south_american_unity_decisions$§!, котрі дозолять нам інтегрувати завойовані території в нашу державу."
 ARG_soviet_aligned_communism_DEF:0 "Південноамериканські радянські республіки"
 ARG_study_the_battle_of_the_river_plate_desc:0 "Битва на Ла-Платі була першою морською битвою цієї війни, і вона відбулася на території Південної Америки. Ми повинні докласти всіх зусиль, щоб вивчити цю битву та навчитися вдосконалювати наші власні військово-морські можливості на її прикладі."
 ARG_the_argentinian_metropole_desc:0 "Буенос-Айрес стоятиме як символ справжнього метрополійного життя в [ARG.GetName]. Розвиток наших міст допоміг нам заохотити населення жити щасливим, продуктивним життям. Роблячи це, ми тепер маємо бум населення та вищий рівень освіти по всій країні."
 ARG_the_second_argentine_republic_tt:0 "([ARG.GetFlag]§Y[ARG.GetNameDefCap]§!) надасть §Yгарантії§! усім демократичним країнам у §YПівденній Америці§!."
