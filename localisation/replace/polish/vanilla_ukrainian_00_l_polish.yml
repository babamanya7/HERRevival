 PRC_establish_friendly_bases_desc:0 "Велика кількість цивільних на окупованій території дозволяє нашим інфільтраторам легко змішуватися з натовпом під час вчинення диверсій."
 PRC_fascism:0 "Китайська імперія"
 PRC_gains_more_faction_inluence_tt:0 "[PRC.GetName] отримує більше впливу фракції"
 PRC_he_long_second_army_desc:0 "Значною мірою збережений стан армії Хе Луна означає, що ми маємо нову головну силу для охорони [ROOT.capital.GetName]. Його досвід уникнення націоналістичних сил — це також те, що ми повинні використати."
 PRC_initialize_five_year_plan_tt:0 "§RНевиконання промислових цілей до кінцевого терміну плану призведе до штрафів для вашої економічної ефективності, що відображатиме втрату довіри до центрального планування.§!\n\n§YВсього фабрик, необхідних для досягнення цілей:\n[GetFiveYearPlanGoalCivFactoriesText] цивільних фабрик\n[GetFiveYearPlanGoalMilFactoriesText] військових заводів§!"
 PRC_initialize_shorter_market_plans_mission:0 "Започаткувати короткострокові ринкові плани"
 PRC_join_comintern_desc:0 "Оскільки керівництво Комуністичною партією, а отже, і державою, стає все більш централізованим, ми тепер можемо звернутися з проханням про вступ до Комінтерну як надійний союзник."
