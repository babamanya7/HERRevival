 SIA_poster_center_text:0 "[SIA_GetDaysRemainingCenter]"
 SIA_ship_torpedo_2:0 "4x 450-мм торпедний апарат"
 SIA_standing_our_ground_trigger:0 "Цей фокус буде автоматично виконано, якщо на нас нападуть і ми оберемо варіант §YОпір§! у відповідній події."
 SIA_start_limited_war_rejoin_faction:0 "Ми тимчасово покинемо нашу нинішню фракцію і повернемося до неї після закінчення §YОбмеженої війни§!."
 SIA_suspend_ordinary_legal_procedures:0 "Призупинення звичайних правових процедур"
 SIA_thai_students_in_the_oss_desc:0 "Нове покоління патріотичної молоді може пройти підготовку за кордоном у мистецтві шпигунства, саботажу та нерегулярної війни. Відправивши надійних тайських студентів на орбіту розвідки Союзників, ми підготуємо здібних служителів для прихованої війни, що чекає попереду."
 SIA_the_greater_thai_empire_desc:0 "Час нашого піднесення настав. Те, що колись було відібрано, відновлено, і оскільки народ визнав нас де-факто владою, ми твердо встановили свою легітимність як законних лідерів цієї оновленої Великої Тайської Імперії."
 SIA_the_king_of_krung_thon:0 "Король Крунг Тхона"
 SIA_the_malay_peninsular_defense_plan_tt:0 "Збудує залізницю між Бангкоком і Сінгапуром.\n\nКожен переможний бал у [MAL.GetName], Сінгапурі, [724.GetName], [289.GetName] та [1076.GetName]\nДодає §G2§! §YБерегового форта§!\nДодає §G2§! §YСухопутного форта§!\nКожен із цих регіонів:\nДодає §G1§! §YСтаціонарна ППО§!"
 SIA_the_true_heirs_of_1932_desc:0 "Військові люблять представляти революцію 1932 року як виключно своє досягнення, відкидаючи той факт, що це була перемога народу. Людям потрібно лише нагадувати про цей факт, і з них ми черпатимемо силу."
