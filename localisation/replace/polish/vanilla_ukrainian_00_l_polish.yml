 SWI_defend_the_skies:0 "Захистити небеса"
 SWI_dissent_crackdown_idea:0 "Придушення інакомислення"
 SWI_expand_weapons_industry_desc:0 "У повній війні нашого мізерного військово-промислового потенціалу не вистачить. Сучасний конфлікт виграє той, у кого останнім закінчаться кулі, тому ми повинні бути впевнені, що можемо виготовляти обладнання для війни швидше та довше."
 SWI_federal_police_idea_no_lar_2:0 "$SWI_federal_police_idea$"
 SWI_fortify_austrian_border_desc:0 "Тепер, коли Австрія знаходиться в руках імовірного ворога, ми не можемо ризикувати відкритим флангом, яким ворог може скористатися у разі війни. Як і на кордоні з [GER.GetNonIdeologyName], ми повинні укріпити цей фронт."
 SWI_lay_the_groundwork_desc:0 "Для того, щоби бути готовими до тотальної війни, нам спочатку потрібна хороша база. Інфраструктуру та транспортні мережі [ROOT.GetName] необхідно поліпшити та модернізувати. Тільки тоді наші громадяни будуть ефективно мобілізовані на фронт."
 SWI_militia_active_penalty_increase_TT:0 "Штрафи за §Y$SWI_active_citizen_militia$§! збільшаться на:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §R-[?SWI.SWI_citizen_militia_modifier_change|%]§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §R-[?SWI.SWI_citizen_militia_modifier_change|%]§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §R+[?SWI.SWI_citizen_militia_modifier_change|%]§!\n$MODIFIER_TRAINING_TIME_FACTOR$: §R+[?SWI.SWI_citizen_militia_modifier_change|%]§!\n$MODIFIER_CIVILIAN_FACTORY_USE$: §R+1§!\n"
 SWI_modernize_airforce_desc:0 "Тепер зрозуміло, що сучасна війна визначається не лише тим, що відбувається на полі бою, але й над ним, у відкритому небі, яке ми сподіваємось захистити та домінувати."
 SWI_mountaneer_paratroopers:0 "Гірські десантники"
 SWI_request_austrian_occupation:0 "Попросити [AUS.GetAdjective]у окупацію"
 SWI_request_italian_alps_occupation_desc:0 "Оскільки частина нашої країни складається з [ITA.GetAdjective] громадян, які розмовляють [ITA.GetAdjective], ми можемо плавно перейти до адміністрування [ITA.GetName] і використовувати його людей і ресурси, щоб продовжувати наші зусилля щодо завершення цієї війни."
 SWI_support_active_militias_continuous_focus_desc:0 "Наші громадяни озброєні та включені до своїх місцевих ополчень, усі інші зобов'язані підтримувати їх як можуть, щоби ми могли тримати на відстані ворогів конфедерації."
 SWI_swiss_democratic_propaganda_desc:0 "Після того, як вони наполягали на тому, щоби Форарльберг приєднався до них, [SWI.GetNameDef] продовжив широку кампанію пропаганди по всій державі [AUS.GetNonIdeologyName]. Вони зосередили свої зусилля на просуванні характерної для них форми демократії, протистоянні фашизму і, перш за все, на приєднанні до їхньої конфедерації."
