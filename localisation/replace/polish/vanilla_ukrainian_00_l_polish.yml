 SWE_vin_och_sprit_ab:0 "Vin och Sprit AB"
 SWI_ENG_puppet_fascism_ADJ:0 "Альпійськ"
 SWI_GATHERING_STORM_DESC:0 "Швайцарія є унікальною серед націй Європи. Це багатокультурна та децентралізована країна, заснована на принципах взаємної поваги та підтримки. Принциповий нейтралітет Швайцарії зберігся і у Великій війні, а побачивши жахи цієї війни здалеку, Швайцарія наяву переконалася у необхідності самооборони. Зараз, коли все ближче нависає тінь нової війни, ця мирна держава має визначитися: чи зберегти нейтральність і захищатися від окупантів озброєним нейтралітетом, чи утворити вимушений союз із однією із сусідніх держав чи діяти на випередження та перемагати ворогів раніше, ніж вони навіть обміркують своє вторгнення."
 SWI_SOV_puppet_communism_ADJ:0 "Швайцарськ"
 SWI_axis_gold_desc:0 "Бути нейтральною країною означає, що наші ринки залишаються відкритими для кожної країни, що є перевагою, якою ми можемо скористатися. Відкривши наш ринок золота для [SWI_biggest_fascist.GetNameDef], ми зможемо об'єднати наші економіки, щоби заспокоїти їх і поліпшити наші економіки."
 SWI_bought_equipment_from_the_enemy:0 "Придбали оснащення від ворога"
 SWI_buero_ha_idea:0 "$SWI_buero_ha$"
 SWI_buy_ships_USA:0 "Придбати старі [USA.GetAdjective]і есмінці"
