 JAP_further_rural_investments_desc:0 "Наші сільські регіони довгий час були занедбані центральним урядом, а швидка індустріалізація таких міст, як Токіо, витягнула людей із села, залишивши багато містечок і сіл у скрутному становищі. Ми повинні інвестувати в ці території, щоб робоча сила, необхідна для їх функціонування, могла там залишитися."
 JAP_greater_navy_dominant_fascism_ADJ:0 "Імперсько-японськ"
 JAP_guide_the_mongols_desc:0 "Можливо, революція досягла успіху в деяких частинах Монголії, але зараз вони перебувають під радянським гнітом. Ми повинні втрутитися і особисто направити монгольський народ до процвітання та звільнити його від феодального, застарілого та авторитарного способу життя."
