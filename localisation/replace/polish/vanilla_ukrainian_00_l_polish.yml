 landmark_prague_castle_desc:0 "Старовинний Празький град, найбільший у світі, протягом століть слугував резиденцією королів, імператорів, а тепер — президентів Чехословаччини. Його зовнішній вигляд свідчить про те, що це не оборонна споруда, а символ влади, що нагадує величні палаци. А за його зовнішніми стінами розташований найбільший у Чехословаччині храм, будівництво якого було завершено у 1926 році."
 landmark_tokyo_imperial_palace_plural:0 "$landmark_tokyo_imperial_palace$"
 lar_communist_uprising_organise_cells_desc:0 "Наш агент проведе роботу з кількома відібраними робітниками, щоби створити революційні комітети, які заронять зерна революційного руху на кожному заводі."
 lar_congress_of_paris.3.a:0 "Чудово."
 lar_france_french_union.2.desc:0 "Здивуввавши багатьох спостерігачів, народи Алжиру, Марокко та Тунісу з незначним відривом одобрили референдум по Французькому Союзу. Тепер, коли жителі цих територій вважаються повноправними громадянами, їм дозволено ввести своїх представників в Національних зборах.\n\nХоча у всіх трьох країнах як і раніше залишились націоналістичні елементи, їх ьойовому духу нанесений сильний удар, від якого вони зможуть оговтатися лише через покоління."
 lar_france_french_union.3.t:0 "Північна Африка голосує за вихід"
 lar_france_french_union.8.t:0 "Сирія голосує за вступ до Союзу"
 lar_heavy_water.2.a:0 "Хто ризикує — перемагає."
 lar_local_recruitment_desc:0 "Нам потрібні агенти, які зможуть влитися в місцеві громади. Деяких із них можна знайти в нашій власній країні, але нам доведеться докласти спільних зусиль, щоби знайти, завербувати і витренувати їх."
 lar_news.12.t:0 "[From.GetNameDefCap] вступає до альянсу [From.GetFactionName]"
 lar_news.8.e:0 "Не така абсолютна монархія нам потрібна!"
 lar_portugal_iberian_summit.8.t:0 "Іберійські нації хочуть приєднатися до альянсу [Root.GetFactionName]"
 lar_portugal_navy_mutiny.1.desc:0 "Революційна організація флоту (Organização Revolucionária da Armada) влаштувала заколот у наших ВМС, посадивши під арешт кількох офіцерів. Метою цього заколоту, очолюваного командою есмінця «Дао», був похід до і в іспанській громадянській війні на боці республіканців.\n\nОднак нерішучість деяких членів команди заважає бунтівникам розвернутися на повну силу, так що ми ще маємо можливість зупинити їх."
 lar_portugal_navy_mutiny.3_extra.desc:0 "Заколот був організований краще, ніж очікували наші офіцери. Коли берегова артилерія відкрила вогонь по бунтівних кораблях, повсталі розвели пари і, дотримуючись дистанції, вийшли з порту слідом за есмінцем. На жаль, кілька кораблів ([?POR_ships_revolted]) змогли піти і зараз прямують до Іспанії. Після закінчення громадянської війни ми зв'яжемося з іспанським урядом і обговоримо компенсацію наших втрат."
 lar_portugal_purchase_ships.3.a:0 "Ми впораємося і без них."
 lar_portugal_purchase_ships.5.a_tt:0 "Два есмінці додані в резервний флот"
 lar_portugal_purchase_ships.5.t:0 "Завершено будівництво кораблів — есмінці"
 lar_portugal_royal_iberian_alliance.1.a:0 "Цей альянс буде вигідний Португалії."
 lar_rescue_mussolini.2.a:0 "Ми не забуваємо своїх друзів."
