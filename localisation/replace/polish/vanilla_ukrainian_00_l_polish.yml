 GOE_RAJ_navy.10.desc:0 "Чиновники з [RAJ.GetNameDefCap] попросили придбати права на наші контракти на сучасні кораблі та просять право розробляти наші крейсери 1936 року для Королівського індійського флоту. Вони пропонують нам щедро заплатити за контракти."
