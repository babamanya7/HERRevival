 wtt_germany.39.t:0 "Китай пропонує поторгуватися за Ціндао"
 wtt_germany.54.b:0 "Провести кампанію проти об'єднання."
 wtt_germany.64.t:0 "[GER.GetName] проводить реінтеграцію Люксембургу"
 wtt_germany.9.t:0 "Італійці приймають пропозицію про переворот"
 wtt_infiltration.23.t:0 "Комуністична загроза ослаблена?"
 wtt_infiltration.4.t:0 "Комуністи, що впровадилися, зламані?"
 wtt_infiltration.5.desc:0 "Патрулі націоналістів виявили нашу базу в області [infiltrated_state.GetName]. Якщо вони мають намір скористатися нашими ресурсами, то їм доведеться провести військову операцію."
 wtt_japan.104.a:0 "Вони мають рацію. Вони заслужили на свободу."
 wtt_japan.11.a:0 "Нам потрібен мир... поки що."
 wtt_japan.122.a:0 "Ми розквитаємося з ними пізніше."
 wtt_japan.126.desc:0 "[From.GetAdjective]а влада запропонувала нам укласти мир. Вони повністю покинуть континент в обмін на негайне припинення бойових дій."
 wtt_japan.21.desc:0 "[From.GetAdjective]а влада вирішила повернути на батьківщину чиновників і генералів, які дотримуються лівих поглядів, а замість них відправити до нас прихильників правих переконань."
 wtt_manchukou_bandit_sabotage.21.desc:0 "Із області [FROM.GetName] надходять повідомлення про те, що на одному з наших заводів спалахнула велика пожежа. Пожежники досі борються із вогнем, але впевнені, що до кінця дня його вдасться загасити. За попередніми оцінками пошкодження досить значні, оскільки вогнище займання, судячи з усього, знаходилося на сховищі легкозаймистих хімікатів.\n\nВійськова розвідка розпочала розслідування інциденту. Не виключена можливість навмисного підпалу."
 wtt_news.1000.a:0 "Жахлива трагедія... з несподіваними результатами."
 wtt_news.1001.a:0 "Яка жахлива трагедія!"
 wtt_news.16.a:0 "Ми ще побачимо повернення нашої колоніальної слави."
 wtt_news.16.t:0 "Китай відновлює німецьке правління в Ціндао"
 wtt_news.18.desc:0 "Після того як між державами [AUS.GetNameDef] і [GER.GetNameDef] намітилося тісне співробітництво, Австрії значно посилилися пронімецькі настрої. Проведений учора плебісцит показав, що народ Австрії впевнено виступає на користь об'єднання зі своїм північним сусідом.\n\nІнтеграція Австрії почалася негайно, і цього ранку колишня держава припинила своє існування."
 wtt_news.2.a:0 "Як вони сміють?!"
 wtt_news.25.desc:0 "Зважаючи на слабкість держави [From.GetNameDef], не дивно що [JAP.GetAdjective]а влада посилювала тиск на [From.GetAdjective]і східні володіння. Цього ранку представники [From.GetAdjective]ого уряду зробили несподівану заяву про те, що контроль над [From.GetAdjective]ими колоніями негайно переходить до держави [JAP.GetNameDef]."
 wtt_news.4.t:0 "Вільгельм II звільнений із-під домашнього арешту в Нідерландах"
 wtt_news.40.d:0 "Ми відрізали їх від імперії!"
 wtt_news.40.e:0 "Жахливий удар по британцях!"
 wtt_news.47.desc:0 "Уряд на чолі з лідером [From.GetLeader] заявив, що поточна ситуація в Індокитаї є явною прямою загрозою [From.GetAdjective]ій безпеці. Згідно з офіційною заявою, жоден уряд у світі не потерпить, щоби йому в черево змогли встромити кинджал. Допоки в цьому регіоні не запанує спокій або допоки [671.Controller.GetAdjective]а влада не замінить губернаторів на більш лояльних до держави [From.GetNameDef], загроза [From.GetAdjective]им інтересам зберігатиметься.\n\n[From.GetLeader] через свого представника особливо наголосив, що хоча [From.GetAdjective]ий уряд спробує знайти мирне вирішення проблеми, він не виключає і військовий варіант."
 wtt_news.53.c:0 "Довго це не протримається!"
 wtt_news.8.a:0 "Хай розпочнеться відбудова."
 wtt_political_organisation.11.a:0 "Нам, схоже, доведеться вдовбати ідеї в людей."
 wtt_political_warlord_support.2.a:0 "Молодець."
 wtt_political_warlord_support.21.desc:0 "Виступивши раніше цього тижня перед загальними зборами представників національної та міжнародної преси, [From.GetLeader] назвав себе «першим учнем лідера [From.From.GetLeader]», стверджуючи, що люди наче [From.From.GetLeader] допоможуть Китаю вийти з хаосу міжусобної боротьби та внутрішніх конфліктів.\n\nКоли його запитали, чи передбачає він участь лідера [From.From.GetLeader] у його уряді, [From.GetLeader] відповів, що буде тільки радий бачити поруч із собою таку досвідчену і мудру людину."
 wtt_soviet_hold_city_o_success:0 "[soviet_city.GetName] залишиться за нами!"
 wtt_warlord_vs_prc.36.t:0 "[From.GetLeader] відхиляє пропозицію альянсу"
 wuw_GER_diplomacy.100.a:0 "Хай буде так"
 wuw_GER_diplomacy.59.desc:0 "\nСамовпевнений [FROM.GetLeader] заявив, що Північний Шлезвіг — це [FROM.GetAdjective] земля. Їхні війська мобілізуються та прямують до кордону. Схоже, вони готуються до війни. Як відповімо на цю провокацію?"
 wuw_GER_diplomacy.62.a:0 "Ми не підемо на компроміси!"
 wuw_GER_diplomacy.68.t:0 "[FROM.GetNameDefCap] погоджується на пакт"
 wuw_GER_diplomacy.70.a:0 "Це може бути вигідно"
 wuw_GER_diplomacy.72.t:0 "Комуністичний вплив із [FROM.GetNameDef]"
 wuw_GER_diplomacy.87.desc:0 "Після перемоги у війні ми контролюємо території поза нашою сферою впливу. Хоч угода не була письмовою, існує очікування, що ми передамо ці землі союзнику."
 wuw_GER_monroe_news.1.desc:0 "Після інтенсивного тиску з боку [GER.GetNameDef], так звана Доктрина Монро була остаточно скасована. Установили її [USA.GetNameDef], і вона слугувала гарантією безпеки для Америк. Справжні наміри [GER.GetAdjective]ого уряду залишаються невідомими."
 wuw_GER_realpolitik.10.t:0 "[FROM.GetNameDefCap] вимагає від нас відновити монархію"
 wuw_GER_realpolitik.20.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб ми передали їм ще більше територій. Цього разу вони хочуть отримати [87.GetName], [98.GetName] та [97.GetName]. Вони знову посягають на нашу державу, але можливо, це єдиний спосіб уникнути знищення. Чи приймемо ми їхні умови?"
 wuw_GER_realpolitik.45.t:0 "[FROM.GetLeader] хоче розділити Чехословаччину"
 wuw_GER_realpolitik.50.a:0 "Тоді ми нічого не вдіємо..."
 wuw_GER_realpolitik.6.a:0 "Ми мало що можемо вдіяти..."
 wuw_GER_realpolitik.62.t:0 "[FROM.GetNameDefCap] відкидає повну інтеграцію"
 wuw_GER_reichskommissariats.10.c:0 "Включити до Туркестану"
 wuw_GER_reichskommissariats.11.t:0 "Статус Східної Карелії"
 wuw_GER_the_battle_of_britain.01.desc:0 "$GER_hermann_goring$ прагне довести перевагу Люфтваффе та зламати дух [ENG.GetAdjective] народу. Його мета — бомбардування знакової пам’ятки Лондона — Біг-Бена. Він стверджує, що це змусить [ENG.GetNameDef] скоритися та пришвидшить завершення війни. Особисто він гарантує, що жодна бомба не впаде на Берлін під час цієї кампанії, інакше його можна називати Германом 'Маєром'."
 wuw_GER_uncertain_future.01.desc:0 "Після завершення громадянської війни ми поступово відбудовуємо країну. Люди прагнуть стабільності та безпеки, однак відчувають дедалі сильніше розчарування через відсутність чіткого курсу. Населення вимагає ясного плану розвитку."
 wuw_GER_weltpolitik.13.desc:0 "\n[FROM.GetLeader] з [FROM.GetNameDef] погодився на наш запит щодо повернення наших колишніх колоній, заявивши, що їм краще буде під нашою владою. Люди святкують на вулицях — колоніальна імперія [ROOT.GetAdjective] повертається на мапу."
 wuw_GER_weltpolitik.17.a:0 "Чудово!"
 wuw_GER_weltpolitik.2.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] погодився на наше прохання щодо повернення колоній, заявивши, що їм краще бути під нашим контролем. Люди святкують на вулицях — [ROOT.GetAdjective] колоніальна імперія знову на мапі!"
 wuw_GER_weltpolitik.7.desc:0 "[BEL.GetLeader] з [BEL.GetNameDef] підкорився спільним вимогам [GER.GetAdjective] та [ENG.GetAdjective] сторін і вирішив підписати угоду, яка означатиме поділ нашої держави між ними, поклавши край будь-якій незалежності. Невже ми маємо просто прийняти свою долю?"
 wuw_HUN_a_habsburg_poland:0 "Габсбурзька Польща"
 wuw_HUN_a_unifying_heritage_desc:0 "[ROOT.GetAdjective] народ міг бути розсіяний по кількох країнах, але це не заважає нам відчувати солідарність одне з одним. Ми повинні підтримати нашу загальноугорську ідею та працювати над тим, щоби якнайшвидше об’єднати весь [ROOT.GetAdjective]ий народ під одним прапором."
 wuw_HUN_an_airforce_to_be_reckoned_with_desc:0 "Наші повітряні сили потрібно модернізувати й посилити, щоби бути конкурентоспроможними. Об’єднані види збройних сил — це майбутнє війни, і ми маємо прийняти цей факт."
 wuw_HUN_construct_the_szeretfalva_deda_railway_line_desc:0 "Для кращого постачання військ, які охороняють лінію Арпада в Трансільванії, ми маємо збудувати нові залізничні гілки та вузли постачання."
 wuw_HUN_devalue_the_pengo:0 "Ревальвація пенге"
 wuw_HUN_establish_the_mavag_aircraft_factory:0 "Заснувати авіазавод MÁVAG"
 wuw_HUN_increase_economic_cooperation:0 "Посилити економічну співпрацю"
 wuw_HUN_initiate_army_maneuvers_desc:0 "Наша армія повинна бути приведена у форму для можливих майбутніх збройних конфліктів. Ми направимо її на маневри для розробки нової тактики та стратегій."
 wuw_HUN_magyar_cserkeszszovetseg_tt:0 "Змінить ідею §YКоролівська гвардія§!:\n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+10%§!\n$MODIFIER_DRIFT_DEFENCE_FACTOR$: §G+15%§!\n§Y$category_support_battalions$:§! Організація: §G+10§!, Міцність: §G+5§!"
 wuw_HUN_make_the_magyar_legiero_known_desc:0 "Magyar Légierő — це повітряний компонент наших збройних сил. Нам було заборонено мати військову авіацію. Проте під прикриттям цивільних авіаклубів поступово було створено секретну повітряну гілку. Тепер, із новими договорами, ми можемо офіційно оголосити про її існування."
 wuw_HUN_promote_increased_urbanization_desc:0 "Все більше людей залишають села та невеликі містечка і переїжджають до великих міст у пошуках роботи на нових фабриках. Навіть якщо ми не можемо одразу надати їм роботу, ми можемо збудувати нові квартали, готуючи ґрунт для подальшого розширення."
 wuw_HUN_reaffirm_territorial_claims_desc:0 "Відкинувши Тріанонський договір, ми тепер повинні офіційно підтвердити наші претензії на території, що були у нас незаконно відібрані."
 wuw_HUN_renew_the_shipping_industry:0 "Відновити суднобудівну галузь"
 wuw_HUN_royalist_education_initiative:0 "Роялістська освітня ініціатива"
 wuw_HUN_sailing_the_danube_desc:0 "Велика річка Дунай була артерією нашої країни впродовж століть. Ми повинні інвестувати в розвиток річкового флоту, щоб забезпечити стабільні перевезення як товарів, так і військ."
 wuw_HUN_seek_german_contracts:0 "Залучити [GER.GetAdjective] контракти"
 wuw_HUN_stage_an_uprising_in_leitha_desc:0 "Повстання проти австрійців у Лайтабаншагу 1921 року довело, що жителі [975.GetName] прагнуть бути частиною нашої великої держави. Ми повинні знову надіслати туди агентів, негайно запропонувати їм захист і окупувати регіон."
 wuw_HUN_stage_an_uprising_in_leitha_tt:0 "§RЦе може призвести до війни з володарем [975.GetName]!§!"
 wuw_HUN_subvert_gombos_troops:0 "Знешкодити війська Гьомбьоша"
 wuw_HUN_the_cult_of_arpad:0 "Культ Арпада"
 wuw_HUN_undoing_the_yugoslav_mistake_tt:0 "Відкриває рішення для §Yреінтеграції старих угорських територій§! на території колишньої Держави словенців, хорватів і сербів"
 ww_BEL_event_diplomatic.14.t:0 "[FROM.GetNameDefCap] Відмовляє нам у гарантії"
 ww_BEL_event_diplomatic.2.desc:0 "[FROM.GetLeader] закликав нас до об'єднання через спільну історію, спадщину та мову в спробі забезпечити нашу анексію до їхньої нації."
 ww_BEL_event_diplomatic.8.desc:0 "Ми щойно отримали цікаву пропозицію від [BEL.GetAdjective] делегації. Вони висловили бажання купити Кале в нас з метою «відновити свої історичні території». Сума, яку вони запропонували, досить велика і, безсумнівно, покращить нашу економіку, але питання в тому, чи варта ця втрата землі такої ціни. Також слід зазначити, що їхні дипломати натякнули на ескалацію напруженості, якщо ми відмовимося від їхньої пропозиції."
 ww_BEL_event_political.5.t:0 "Криза Адріана Мартенса"
 ww_BEL_event_spanish_interaction.5.a:0 "Чудова новина!"
 ww_BEL_event_war.1.t:0 "Переміщена авіаційна промисловість активована"
 ww_BEL_event_war.7.a:0 "Наші війська скоро маршируватимуть вулицями Парижа!"
 ww_congo.21.b:0 "Хто сказав, що вони можуть мати незалежність?"
 ww_congo.49.t:0 "Німецький колаборант"
 ww_congo.55.t:0 "[FROM.GetLeader] не передає території Бурунді"
 ww_congo.58.t:0 "[FROM.GetLeader] не передає території Руанди"
 yalta_division_tt:0 "Наступні регіони буде визнано сферою інтересів союзників:\n§Y[42.GetName]§!, §Y[978.GetName]§!, §Y[50.GetName]§!, §Y[51.GetName]§!, §Y[52.GetName]§!, §Y[53.GetName]§!, §Y[54.GetName]§!, §Y[55.GetName]§!, §Y[56.GetName]§!, §Y[57.GetName]§!, §Y[58.GetName]§!, §Y[59.GetName]§!.\n\nНаступні регіони увійдуть до сфери інтересів [SOU.GetAdjective]:\n§Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!.\n\n [POL.GetAdjective] претензії на такі регіони будуть визнані всіма сторонами:§Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[5.GetName]§!.\n\n"
