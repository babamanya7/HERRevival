 DLC_DESCRIPTION_dlc036:0 "Збудуйте нову імперію, опирайтесь іноземній агресії або дослідіть межі нейтралітету. By Blood Alone додає нові варіанти альтернативної історії та варіативний ігровий процес для Італії, Ефіопії та Швайцарії, а також інші значні зміни."
 DLC_TOGETHER_FOR_VICTORY:0 "Together for Victory"
