 MEX_fighter_equipment_3:0 "Легкий винищувач TNCA «Huitzilopochtli»"
 MEX_focus_ejido_worker_militias_desc:0 "Земельна реформа, обіцяна в Конституції 1917 року, просувається повільно. Часто орендодавці використовують бандитів і приватні армії, щоби залякати своїх орендарів і запобігти перерозподілу. Організуймо селян, фермерів і робітників у громадські загони, щоби захистити здобуті нами здобутки від несправедливості."
 MEX_focus_interior_defence_plan_desc:0 "Це правда, що янкі мають чисельну та технологічну перевагу над нами, але ми маємо знання про місцевість, підтримку з боку людей, а також час і простір, щоби створити міцну оборону. Ми будемо знекровлювати ворога в пустелях і горах, використовуючи тактику «удар і тікай», глибоку оборону та приховані опорні точки."
 MEX_focus_peripheral_infrastructure_desc:0 "У наших найбільш сільських регіонах протягом десятиліть мало поліпшувалась інфраструктура. Є низка бідних фермерів, які ведуть натуральне господарство, які готові працювати на фабриці та отримати освіту, якби ми розширили нашу систему доріг."
 MEX_focus_strike_breaking_desc:0 "Об'єднання в профспілки є фундаментальним правом, яке захищає Конституція 1917 року, але напади на власність є злочинними і повинні розглядатися як такі. Відкликання робочої сили з критичної галузі може навіть сприйматися як зрада під час кризи."
 MEX_focus_support_spains_loyalists:0 "Підтримати лоялістів в Іспанії"
 MEX_focus_tank_workshops_desc:0 "Наш авіаконструктор, TNCA, експериментував із броньованими бойовими машинами під час Великої війни, створивши прототип на основі британських ромбів. Нам слід перезапустити ці експерименти та створити танкову майстерню."
 MEX_focus_the_gold_shirts:0 "Золотосорочники"
 MEX_focus_triumph_over_the_cristeros:0 "Тріумф над крістерос"
 MEX_habsburg_empire_neutrality_DEF:0 "Третя Мексиканська імперія"
