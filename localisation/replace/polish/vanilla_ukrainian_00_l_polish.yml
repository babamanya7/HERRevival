 JAP_politicize_the_education_system_desc:0 "Армія давно контролює національну систему освіти, але було зроблено недостатньо для радикалізації молоді, щоб вона належним чином приєдналася до нашої справи. Ми повинні більше інвестувати в нашу політичну індоктринацію та збільшити фінансування системи освіти."
