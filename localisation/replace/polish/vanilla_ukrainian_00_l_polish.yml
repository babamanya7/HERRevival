 FIN_national_armor_focus:0 "Акцент на національну бронетехніку"
 FIN_national_unity:0 "Національна єдність"
 FIN_neutrality_party_long:0 "Аграрна ліга"
 FIN_pact_for_continuation_war_broken_tt:0 "Пакт порушено, і країни більше не зобов'язані допомагати одна одній у разі війни з державою [SOV.GetFlag]§Y[SOV.GetNameDef]§!!!"
 FIN_power_balance:0 "Довіра громадськості"
 FIN_preserve_sapmi:0 "Зберегти саамів"
 FIN_prioritize_light_industry:0 "Надати пріоритет легкій промисловості"
 FIN_railways_and_infrastructure_desc:0 "Велика війна продемонструвала необхідність надійних залізничних і автомобільних мереж, які допомагають промисловості та військовим доставляти ресурси або людей туди, де вони повинні бути. Після десятиліть окупації та кровопролиття наші логістичні мережі гостро потребують інвестицій."
 FIN_ralf_torngren:0 "Ральф Тьорнгрен"
 FIN_right_wing_policies_desc:0 "Ліві — не що інше, як агенти іноземних держав. Вони миттєво продали б свою батьківщину, якби вона здобула їм прихильність за допомогою [SOU.Capital.GetCapitalVictoryPointName]. Якщо наша держава хоче процвітати та вижити, ми повинні звернутися до партії та праві організації."
 FIN_rudolf_holsti:0 "Рудольф Голсті"
 FIN_stalins_puppet_kuusinen_ns_tt:0 "  - Фінські товари йтимуть у Радянський Союз, що даватиме їм тимчасові бонуси до споживчих товарів і постачання."
