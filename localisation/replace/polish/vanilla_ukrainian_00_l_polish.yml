 POR_the_iberian_socialist_union_desc:0 "Наша спільна боротьба з іспанськими республіканцями під час війни показує нам, що настав час об'єднати Піренейський півострів під урядом народних соціалістів.\nРазом ми переможемо наших ворогів раз і назавжди!"
