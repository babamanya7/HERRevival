 office_of_strategic_services:0 "Управління стратегічних служб"
 operation_fork_desc:0 "Нова незалежна держава Ісландія займає надзвичайно стратегічно важливе місце в Північній Атлантиці. Втрата Норвегії поставила б беззахисний острів у вразливе становище. Ми мусимо перемогти наших ворогів до вторгнення та окупації Ісландії, щоб вони не отримали стратегічні бази острова, з яких вони можуть поставити під загрозу наші лінії постачання. Тільки з нашим захистом ісландці будуть в безпеці від наших ворогів."
 operation_outcome_sabotage_industry_tt:0 "Націлює місцевий опір на промисловість та підвищує шанс успішної атаки."
