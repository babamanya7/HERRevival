 CHI_negotiate_the_nine_powers_treaty_desc:0 "Династія Цін погодилася підкоритися західним державам, і договори 19-го століття переслідують нас, як привиди, їхні наслідки все ще тяжіють над Китаєм. Ми звернемося до підписантів і подивимося, чи зможемо ми вирішити наші розбіжності, цього разу не як слуга, а як рівний."
 CHI_our_people_in_the_legislative_desc:0 "Нинішня система стала беззубою при Чані. Силач спробував підмінити собою сильну центральну владу, і з цим нам доведеться боротися. Нам доведеться переписати автономію деяких урядових елементів, щоб зміцнити ядро нації."
