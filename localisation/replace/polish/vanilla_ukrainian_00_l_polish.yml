 TUR_accelerate_native_fighter_designs:0 "Оновити вітчизняні дизайни винищувачів"
 TUR_accelerate_native_fighter_designs_desc:0 "Наша авіація відома і шанована, але замало [ROOT.GetAdjective] літаків відповідають виробничим стандартам. Це потрібно виправити."
