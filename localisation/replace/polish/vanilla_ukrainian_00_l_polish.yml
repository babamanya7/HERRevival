 GRE_academy_of_athens_desc:0 "Афінська академія була заснована в 1929 році як інститут вищої освіти, але вона ще молода, і їй потрібна допомога. Ми маємо зробити з неї центр тяжіння для всіх амбіційних вчених у Європі та за її межами!"
 GRE_ancient_talents_desc:0 "З бронзової доби ми мали пристрасть до всього морського. Час вшанувати славні традиції і відродити їх."
