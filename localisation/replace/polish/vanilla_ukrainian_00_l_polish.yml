 AST_union_control_events.5.a:0 "Жахлива невдача. Ми повинні звернутися до інших шляхів, щоб підтримати наших товаришів."
 AST_vindicated_realist:0 "Виправданий реаліст"
 AST_volunteer_air_corps:0 "Добровольчий корпус повітряних спостерігачів"
 AST_volunteer_air_corps_desc:0 "Австралійський повітряний простір величезний і знаходиться далеко поза межами досяжності лише офіційних підрозділів. Натомість ми маємо покладатися на місцевих добровольців, які обслуговують тисячі спостережних пунктів, розкиданих по всій країні, щоб стежити за нашим небом."
 AST_walls_like_uluru:0 "Стіни як Улуру"
 AST_war_is_coming_spirit_fake:0 "$AST_war_is_coming_spirit$"
 AST_wool_agreement_desc:0 "Оскільки вовна є одним із найбільших комерційних продуктів Австралії, її експорт не лише приносить прибуток, але й покращує відносини з країнами-імпортерами. Однак Британія вимагає все, маючи намір використовувати її для уніформи своїх солдатів, а також у переговорах з державами, що мають дефіцит вовни. Ми повинні поступитися британським вимогам."
