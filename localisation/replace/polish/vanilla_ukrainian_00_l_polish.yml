 PRC_mediating_general_secretary_idea_tt:0 "\n§Y$PRC_zhang_wentian$§! буде посередником між §Y$PRC_mao_zedong$§! та [GetGuotaoOrBolsheviks], щоб утримати обидві сторони від отримання занадто великої влади в рамках §Y$PRC_communist_power_struggle$§!. §RБаланс сил зміститься до центру§!"
 PRC_medium_tank_destroyer_equipment_1_short:0 "PTZ 39"
 PRC_peoples_liberation_army_desc:0 "Червона армія Китаю змогла досягти багато чого. У майбутньому на неї чекають ще більші звершення у боротьбі за свободу нашого народу."
 PRC_peoples_volunteer_army:0 "Народна добровольча армія"
 PRC_pla_ground_force:0 "Сухопутні війська Народно-визвольної армії"
 PRC_prepare_for_third_phase_desc:0 "Мао проголосив існування трьох фаз партизанської війни. Після виконання перших двох, спрямованих на здобуття підтримки та ослаблення наших ворогів, настав час перейти до конвенційних засобів. Ми будемо далі розширювати нашу територію, починаючи прямі атаки на міста в третій і завершальній фазі."
 PRC_proclaimed_communism:0 "Китайська народна республіка"
 PRC_promote_paper_bills_desc:0 "Паперові гроші з низькою собівартістю виробництва стали б гарною заміною мідним монетам, які можна переробити на заводах боєприпасів. Однак серйозним недоліком є ​​те, що наші торгові партнери можуть нервувати через валюту, вартість якої ми можемо легко змінити, просто надрукувавши її більше."
