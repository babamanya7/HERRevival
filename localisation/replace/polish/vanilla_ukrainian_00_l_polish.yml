 GOE_RAJ.10.t:0 "[FROM.GetName] закликає [JAP.GetName] виконати свою клятву."
 GOE_RAJ.29.t:0 "Новий віце-король для [RAJ.GetName]"
 GOE_RAJ.37.desc:0 "Наші останні політики окупації, як і очікувалося, призвели до зростання активності опору. Це, схоже, привернуло увагу Уряду Його Величності. Надійшов різкий лист, у якому чітко дається зрозуміти, що Лондон не схвалює наш безрозсудний підхід до управління. Повідомлення наповнене ретельно підібраними словами, які все ж примудряються випромінювати загрозу. Без зайвих слів, нам радять переглянути нашу позицію, щоб ми не були вимушені отримати допомогу у відновленні порядку, якої ми, можливо, не оцінимо."
 GOE_RAJ.39.a_tt:0 "Коли ми отримаємо владу, ми будемо зобов'язані підвищити безпеку праці протягом §Y6 місяців§!. Невиконання цього засмутить профспілки. Підвищена безпека праці дає: "
