 PAR_chaco_war_decoration_desc:0 "Ветерани Чакської війни заслуговують на військові нагороди, які вони так і не отримали від попереднього уряду. Невелика ціна для заспокоєння військових."
 PAR_flip_to_fascism:0 "Перескочити у фашизм"
 PAR_goad_bolivia_desc:0 "Якщо ми зможемо втягнути Болівію в конфлікт, це значно послабить повстанців. Хоча це ризиковано, ми оприлюднимо фальшиву телеграму, що свідчить про бажання Франко розширити своє завоювання на Болівію після закінчення громадянської війни, сподіваючись спонукати [BOL.GetAdjective] уряд втрутитися."
 PAR_manuel_t_aponte:0 "Manuel T. Aponte"
 PAR_mass_drafts:0 "$GUAY_mass_drafts$"
 PAR_nazify_the_army_desc:0 "Нацистська символіка вже поширюється у військових, як лісова пожежа. Будь-яка інша дія, крім прийняття цього, і навіть заохочення, розлютить військових. Ми можемо використати це, щоб зблизитися з [GER.GetName], а також розвинути сильнішу військову ідентичність."
