 CHI_heavy_weapons_development_desc:0 "Маючи лише скромні ресурси, ми мусимо максимально ефективно використовувати важке озброєння. Потрібно розпочати розробку нових артилерійських знарядь."
 CHI_hyper_inflation_5_desc:0 "Наша валютна система повністю обвалилася. У значній частині країни торгівля повернулася до бартерної системи. Бідність широко поширена. Наші працівники використовують паперові гроші, якими ми їм платимо, щоб опалювати свої будинки. Для вирішення ситуації потрібна агресивна програма фінансово-економічних реформ."
 CHI_indo_chinese_campaign_desc:0 "Ми маємо довгу історію з Південно-Східною Азією, і сьогодні пишеться ще одна глава. Ми відберемо цю територію у [671.controller.GetNameDef], щоб союзні сили могли діяти вільно."
 CHI_industrial_evacuations_desc:0 "Перемогу у сучасній війні забезпечують заводи: армія без зброї — це просто натовп людей у дурнуватих капелюхах."
 CHI_industrial_evacuations_from_hebei:0 "Евакуація промисловості з Хебею"
 CHI_initiate_the_sky_projects_desc:0 "Ракетобудування та передові двигуни відкривають нові стратегічні можливості. Ми фінансуватимемо експериментальні ініціативи з прицілом на довгострокову віддачу."
