 MEX_infantry_equipment_1:0 "Mondragón M08"
 MEX_juan_andreu:0 "Хуан Андреу"
 MEX_mission_cedillos_rebellion_desc:0 "Генерал Сатурніно Седільйо та пов'язані з ним каудільйо вже багато років діють незалежно від центрального уряду. Заходи, які [Root.GetLeader]  проводить із метою збудувати єдину націю становлять загрозу їхній владі, і тому вони намагаються звести нанівець наш прогрес усіма можливими способами."
