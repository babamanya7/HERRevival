 NOR_expand_naval_academy_desc:0 "Більше кораблів означає, що нам потрібно більше офіцерів, щоб вести їх у бій. Нашої військово-морської академії було достатньо протягом багатьох років, але в міру того, як наш флот розширюється, так само має бути кількість офіцерів і матросів."
