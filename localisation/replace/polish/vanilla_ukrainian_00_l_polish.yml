 sp_naval_anechoic_tiles_desc:0 "Це спеціальне гумове покриття для підводних човнів, яке містить невеликі порожнини між собою, зменшує ризик виявлення ворожими сонарами."
 sp_naval_cruiser_submarine_desc:0 "Підводний човен із великою дальністю плавання, призначений для подолання великих відстаней без підтримки, був би ідеальним для нападу на ворожі кораблі."
 sp_naval_cruiser_submarine_unique_reward_a_desc:0 "Безсилля Лондонських морських договорів зробило будь-які реальні обмеження на палубне озброєння підводних човнів неважливими. Проте залишається питання: чи варто нам віддати перевагу показному озброєнню перед тактичною дальністю?"
