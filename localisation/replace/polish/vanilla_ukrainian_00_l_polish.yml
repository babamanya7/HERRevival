 COG_copper_cartridges_small_idea:0 "Мідна картеч"
 COG_declaration_of_congolese_unity_desc:0 "Народи баконго живуть розділеними міжнародними кордонами. Ми повинні докласти зусиль до об'єднання наших людей якомога швидше, і для цього забезпечити процвітання баконго на століття вперед."
 COG_democratic_DEF:0 "Республіка Конго-Леопольдвіль"
 COG_emergency_powers_for_pierre_ryckmans:0 "Надзвичайні повноваження для колоніального губернатора"
 COG_establish_the_anc_desc:0 "Наші вимоги були численні, але лише тепер вони нарешті були виконані. Сьогодні — день, коли ми зможемо сформувати справжню конголезьку армію, яка зможе стояти гордо перед будь-якими ворогами, з якими ми зустрінемося."
