 FRA_revive_the_franco_polish_alliance_desc:0 "Франція завжди підтримувала незалежну Польщу. За останні роки відносини між нашими країнами трохи охололи. З загрозою Німеччини на горизонті, настав час відновити наш пакт."
 FRA_revolution_to_the_utmost_desc:0 "Революція, що залишилася наполовину, не є революцією. Ми не повинні зупинятися, поки справа не буде зроблена і нова політична система не стане безпечною. Якою б не була ціна."
