 IRQ_political_events.16.b:0 "Їм не можна довіряти."
 IRQ_political_events.17.b:0 "Нас влаштовує нинішня домовленість."
 IRQ_political_events.21.desc:0 "Уряд [FROM.GetNameDef] вимагає нашого негайного виведення з [PAL.GetName] після нещодавніх спалахів насильства на території. Вони стверджують, що краще підходять для управління мандатною територією і що наші дії шкодять їхнім побратимам-арабам. Хоча виведення було б вигідним для наших військових, шкода зовнішній політиці може бути значною."
 IRQ_political_events.24.desc:0 "Через безліч ускладнень, [FROM.GetNameDef] відхилив наш план взяти на себе відповідальність за [454.GetName]. Незважаючи на те, що ми запропонували варіант, який дозволив би [ENG.GetAdjective] мирно вийти з регіону, вони натомість вирішили продовжувати свою криваву та дорогу окупацію території, незалежно від ціни."
 IRQ_political_events.28.a:0 "Можливо, вони змінять свою думку?"
 IRQ_political_events.42.desc:0 "Уряд [FROM.GetNameDef] категорично відхилив нашу пропозицію передати Сирію нашій владі, відкидаючи наше бачення арабської єдності та регіональної стабільності. Ця відмова підриває зусилля з консолідації арабського світу та позбавляє народ Сирії шансу приєднатися до сильнішої, об'єднаної держави. Тепер питання в тому, чи продовжувати дипломатичні канали, чи готуватися до більш рішучого вирішення цієї суперечки."
 IRQ_political_events.62.desc:0 "[FROM.GetNameDefCap] відхилив нашу пропозицію миру, наполягаючи на повній покорі без компромісів. З провалом переговорів конфлікт триватиме, залишаючи нас протистояти повній могутності сил Союзників. Шлях попереду буде сповнений викликів, але наша рішучість щодо незалежності залишається непохитною."
 IRQ_political_events.71.c:0 "Нам потрібен Президент, а не король!"
 IRQ_political_events.71.t:0 "Легітимізація нашого правління"
 IRQ_political_events.76.desc:0 "На жаль, [FROM.GetAdjective] уряд відхилив наш запит на обмін дорогоцінної нафти на зброю. Їхня втрата — наш виграш."
 IRQ_purchase_armored_equipment:0 "Придбати броньоване обладнання"
 IRQ_put_down_tribal_revolts:0 "Придушити племінні повстання"
 IRQ_reach_out_to_jordan_desc:0 "Наші родичі продовжують правити Йорданією під захистом [ENG.GetAdjective]. Однак ми можемо схилити їх та [ENG.GetAdjective] до того, щоб дозволити нам розвивати більшу політичну та економічну згуртованість в обмін на взяття їхньої оборони на себе."
 IRQ_renegotiate_treaty:0 "Переглянути договір"
 IRQ_special_projects:0 "Ядерний дослідницький центр Тувайта"
 IRQ_state_company_of_cotton_industries_idea:0 "State Company of Cotton Industries"
 IRQ_strengthen_relations_with_turkey_desc:0 "[TUR.GetAdjective] були на передовій протистояння західним державам, хоча це зрештою коштувало їм імперії. Таким чином, ми є природними союзниками, і ми повинні робити більше для побудови кращих стосунків з ними."
 IRQ_suppress_tribal_revolts:0 "Suppress Tribal Revolts"
 IRQ_unite_mashriq:0 "Об'єднати Машрік"
 ISR_communism_DEF:0 "Левантський союз"
 ISR_democratic:0 "Ізраїль"
 IS_ATTACKER:0 "Наступальна тактика"
 ITA_all_within_the_state_desc:0 "Якщо ми хочемо перемогти у цій кривавій війні, необхідно, щоби кожен зробив свій внесок у військові зусилля. Але не все зводиться до безпосередньої боротьби з ворогом: наші лінії фронту потребують підтримки потужної промисловості та логістики так само, як і солдат, щоб укомплектувати їх."
 ITA_all_within_the_state_ns_desc:0 "Зміцнення наших можливостей за лінією фронту забезпечить шлях вперед до перемоги."
 ITA_ansaldo_train_organization:0 "$AUS_ansaldo_organization$"
 ITA_anti_uk_war_goals:0 "Війна зі Сполученим Королівством"
 ITA_anti_uk_war_goals_desc:0 "Гниюча Британська імперія замкнула нас у клітці в Середземному морі та ніколи добровільно не віддасть нам ключі. Ми мусимо вдарити по англійцях, щойно настане час!"
 ITA_artillery_equipment_1:0 "Cannone da 75/27 modello 06"
 ITA_battaglioni_m_re_battaglioni_d_assalto_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_militia_max_org_factor$: §G+5.00%§!\n$modifier_army_sub_unit_militia_defence_factor$: §G+5.00%§!\n$modifier_army_sub_unit_blackshirt_assault_battalion_defence_factor$: §G+5.00%§!\n$modifier_army_sub_unit_blackshirt_assault_battalion_attack_factor$: §G+5.00%§!\n\n"
 ITA_battleship_3_desc:0 "Клас «Littorio», також відомий як «Vittorio Veneto», представляв собою найсучасніші лінкори, що використовувалися Італією під час Другої світової війни. Вони мали водотоннажність понад 40 000 тонн і були дуже швидкими для свого розміру. Вони складали основу італійського флоту."
 ITA_benito_mussolini:0 "Беніто Муссоліні"
 ITA_blackshirt_loyalty:0 "Здобути лояльність чорносорочників"
 ITA_bop_praise_the_airforce:0 "£BoP_right_texticon Похвалити авіацію"
 ITA_bop_privileges_for_the_elites:0 "£BoP_right_texticon Привілеї для еліт"
 ITA_bop_resign_ministry_of_justice_position:0 "£BoP_left_texticon Залишити посаду в Міністерстві юстиції"
 ITA_bring_down_fascist_strongholds_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! отримає ціль війни проти будь-якої фашистської країни в Європі."
 ITA_capo_supremo_desc:0 "Лиш одна особа в Італії здатна принести славу та силу, на які наша велика нація заслуговує. Часи декадентної монархії закінчилися; настав час нашому енергійному дуче стати верховним лідером Італії."
 ITA_carlo_favagrossa:0 "Карло Фавагросса"
 ITA_combined_land_and_air_warfare_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$\n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+5%§!\n$MODIFIER_AIR_CAS_PRESENT_FACTOR$: §G+5.00%§!\n\n"
 ITA_crush_the_mafia_desc:0 "Мафія та численні банди контрабандистів, здирників і злочинців загалом відродилися під час громадянської війни. Наш обов'язок перед італійським народом — викорінити їх і відновити безпеку та стабільність у країні."
 ITA_democratic_king_desc:0 "Настав час італійській монархії зробити крок уперед, до більш демократичної держави, зберігаючи при цьому фігуру короля як головного лідера."
 ITA_democratic_side:0 "Соціалістична фракція"
 ITA_democratic_subject:0 "Республіканська Італія"
 ITA_destroyer_1:0 "Клас «Curtatone»"
 ITA_destroyer_1_desc:0 "Есмінці класу «Curtatone» були першими есмінцями, побудованими в Італії після закінчення Першої світової війни, і першими есмінцями, що використовували здвоєні гарматні установки. Кораблі спочатку були замовлені одночасно з есмінцями класу «Palestro», але були відкладені через дефіцит сталі. Водотоннажністю трохи менше 1000 тонн, на них встановлено чотири 102-мм гармати Schneider–Armstrong."
 ITA_disgruntlement_in_the_airforce_desc:0 "Військово-повітряним силам пообіцяли нові ресурси та кошти для розширення своїх сил, але нічого не виявилося, і серед військ поширюється незадоволення."
