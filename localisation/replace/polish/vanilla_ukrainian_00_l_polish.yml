 HOL_daf_tt:0 "Буде відкритий виробник матеріального забезпечення §Y$HOL_daf$§!.\n"
 HOL_decolonization_tt2:0 "Усі регіони в §YІндонезії§!: Повністю контрольовані державою §Y[HOL.GetNameDef]§!"
 HOL_depillarization_desc:0 "Нідерландське суспільство було поділено на різні верстви, які називаються «zuilen», або «стовпами». У рамках нового мандату королеви вона мала на меті покінчити з цією «пілларизацією», яка мучила нашу країну всі ці роки. Люди з однією релігією, ідеологією чи соціальним статусом тепер можуть вільно взаємодіяти з представниками іншої, поліпшуючи стабільність."
 HOL_europe_research_name:0 "$HOL_the_continents_best_and_brightest$"
 HOL_expand_curacao_oil_refineries_tt:0 "Буде відкритий промисловий концерн §Y$HOL_royal_dutch_shell$§!.\n"
 HOL_fighter_equipment_3:0 "Fokker D.XXX"
 HOL_germany_is_the_greater_threat_desc:0 "У світлі посилення агресії Німеччини ми повинні направити нашу оборону на схід, на випадок, якщо вони будуть менш поважати наш нейтралітет, ніж це було під час останньої війни..."
 HOL_heavy_fighter_equipment_1:0 "Fokker G.1 Mercury"
 HOL_heavy_fighter_equipment_1_short:0 "Fokker G.1M"
 HOL_infantry_equipment_0:0 "Mannlicher M95"
 HOL_lessons_from_the_last_war_desc:0 "Хоча ми, можливо, не були залучені, у нас було чудове місце, з якого можна було спостерігати за махінаціями та невдачами плану Шліффена на нашому порозі. Ми повинні зробити висновки з цих спостережень."
 HOL_shell_shocked_spectator_desc:0 "Дотримавшися нейтралітету, Нідерланди стали притулком для безлічі біженців із Західного фронту, і нідерландцям довелося побачити на власні очі всі страхи війни. У результаті серед населення сильні пацифістські настрої, що є серйозною перешкодою для підвищення, що продовжує, поки що, користуватися певним престижем в очах широких мас.\n\nЩоб остаточно позбавити країну таких настроїв, буде потрібна оборонна війна або «війна з пацифізмом»."
