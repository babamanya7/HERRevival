 RAJ_socialist_self_reliance_desc:0 "Ми не будемо залежати від капіталістичного імпорту чи імперіалістичних радників.\nІндія годуватиме себе, озброюватиме себе і стоятиме сама, якщо це буде необхідно."
 RAJ_the_defense_of_hong_kong:0 "Захист Гонконгу"
 RAJ_the_indian_national_army_desc:0 "Індійська національна армія втілює боротьбу за незалежність, об'єднуючи патріотів під єдиним прапором для взяття зброї проти колоніального правління. Завдяки своїй рішучості та жертовності, ІНА готова вести Індію до визволення та суверенітету."
 RAJ_the_jewel_becomes_the_crown_desc:0 "З падінням метрополії, тепер наша черга взяти на себе тягар лідерства в імперській родині. З оновленою енергією ми використаємо величезні ресурси [ROOT.GetNameDef], щоб звільнити серце Імперії та знищити всіх, хто наважився заплямувати її зелені та приємні землі."
 RAJ_the_zamindari_system:0 "Система заміндарі"
 RAJ_urban_training_desc:0 "Хоча ми сподіваємося, що до цього не дійде, є шанс, що нам доведеться стримувати ворога на вулицях наших великих міст. Ми повинні бути готові керувати таким сценарієм за допомогою спеціалізованої міської підготовки."
