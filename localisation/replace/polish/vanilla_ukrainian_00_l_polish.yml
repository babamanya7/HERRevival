l_polish:
 888_autenticite_name:0 "Мбужі-Маї"
 AAT_Sweden.10.desc:0 "Сьогодні Герман Ерікссон подав заяву про відставку, заявивши, що бажає піти на пенсію, щоб зайняти посаду головного виконавчого директора компанії Vin & Sprit AB.\nНе дивлячись на його бажання, він усе ще може бути потрібен в уряді, але мати його на посаді головного виконавчого директора державного виробника лікеро-горілчаних виробів може мати свої переваги."
 AAT_Sweden.12.a:0 "Справжня трагедія."
 AAT_Sweden.16.a:0 "Ми не можемо ризикувати отримати ще більше ворогів."
 AAT_Sweden.16.t:0 "[SWE.GetNameDefCap] погрожує військовими діями через Нарвік"
 AAT_Sweden.22.a:0 "Дуже прикро."
 AAT_Sweden_BoP.10.c:0 "Чому багатії платять такі великі податки?"
 AAT_Sweden_BoP.11.desc:0 "Нині передвиборча кампанія дійшла до соціальної політики, і тепер партії доводять свої плани щодо виправлення суспільних негараздів. Деякі партії виступають за радикальне реформування уряду для вирішення проблем, інші дотримуються більш обережного підходу, проводячи часткові зміни. Проте лише один меседж знаходить відгук у електораті."
 AAT_Sweden_BoP.12.d:0 "Єдиний спосіб забезпечити мир у регіоні — встановити наш контроль над ним."
 AAT_Sweden_ball_bearing.1.a:0 "Нам треба забезпечити достаток харчів."
 AAT_Sweden_ball_bearing.7.desc:0 "Держава [FROM.GetNameDef] відхилила будь-яку пропозицію взаємної торговельної угоди. Вони посилаються на стрімке погіршення глобального політичного клімату і, як наслідок, на те, що будь-які великі військові угоди мають бути відкладені."
 AAT_Sweden_communism.6.t:0 "Доля дому Бернадот"
 AAT_Sweden_flashpoints.12.desc:0 "[SOV.GetAdjectiveCap]і пілоти випадково здійснили повітряний наліт на [SWE.GetAdjective]е село, прийнявши його за ціль у державі [FIN.GetName]. Посли [SWE.GetAdjective]ого посольства звернулися до нас із вимогою пояснити причину нападу, а також повідомити, як ми збираємося відшкодовувати збитки.\n\nНа щастя, новина про інцидент не набула широкого розголосу, і тому в нас є можливість швидко вирішити ситуацію, перш ніж вона загостриться ще більше."
 AAT_Sweden_flashpoints.12.t:0 "[SWE.GetAdjectiveCap]і дипломати вимагають пояснення бомбардування Паяли"
 AAT_Sweden_flashpoints.19.b:0 "$AAT_Sweden_flashpoints.17.b$"
 AAT_Sweden_flashpoints.38.a:0 "[SWE.GetName] стане лише виноскою в нашій історії."
 AAT_Sweden_flashpoints.56.b:0 "Чудова пропозиція."
 AAT_Sweden_flashpoints.63.a:0 "Відкиньте їхній ультиматум."
 AAT_Sweden_flashpoints.71.a:0 "Ми могли б ліпше застосувати ці човни."
 AAT_Sweden_flashpoints.78.t:0 "[SWE.GetName] вимагає Оландські острови"
 AAT_Sweden_flashpoints.81.a:0 "Це варте того."
 AAT_Sweden_nationalists.17.a:0 "Він здобуде своє, якщо не здаватиметься."
 AAT_Sweden_nationalists.24.desc:0 "Держава [FROM.GetName] прийняла нашу пропозицію. Коли настане час, вони домовляться про білий мир, щоби ми разом знищили державу [GER.GetName]."
 AAT_Sweden_nationalists.30.t:0 "[FROM.GetName] отримує [FIN.GetAdjective]у землю"
 AAT_britain_narvik.4.desc:0 "[ENG.GetName] оголосила, що її стратегічна мета в державі [SWE.GetName] досягнута і вона виводить свої війська. Її уряд також підтверджує, що не має справжньої ворожнечі до [SWE.GetAdjective]ої держави, і що його дії в [SWE.GetName] відбуваються виключно в інтересах захисту демократії. [GER.GetAdjective]е та [SWE.GetAdjective]е посольства надіслали лист протесту, причому [GER.GetAdjective]а сторона стверджує, що [ENG.GetName] порушила нейтралітет і вторглася на територію іноземної держави в зоні бойових дій, а [SWE.GetName] докоряє [ENG.GetAdjective]ому уряду за те, що, попри його високі цілі допомоги державі [FIN.GetName], тепер зрозуміло, що це був погано продуманий хід для досягнення власних цілей, який коштував [SWE.GetAdjective]их життів."
 AAT_finland_diplomacy.04.b:0 "Вони самі обрали свою долю."
 AAT_finland_diplomacy.05.b:0 "[FROM.GetAdjective]ий уряд збожеволів."
 AAT_finland_diplomacy.08.desc:0 "[FROM.GetNameDefCap] покладається на нас у тому, що стосується видобутку залізної руди. Вони стурбовані зростаючою у світі напругою і, вважаючи себе найрозвиненішою у військовому плані державою Півночі, просять передати їм контроль над північними територіями, що багаті на ресурси, — як для захисту цих земель, так і для ефективного застосування ресурсів у військовій справі."
 AAT_finland_diplomacy.17.desc:0 "[FIN.GetNameDefCap] вимагає віддати всі території, які є у нас в [GetBalticOrNordic]ому регіоні. Це частина нового порядку денного щодо захисту [GetBalticOrNordic]ого регіону у складі великої [FIN.GetAdjective]ої федерації народів."
 AAT_finland_kinship_war.02.desc:0 "Наші спроби розпалити невдоволення державою [SOU.GetName] увінчалися грандіозним успіхом. 20 000 жителів Східної Карелії втекли до Фінляндії під час повстання і активно працювали з членами Карельського академічного товариства, намагаючись зберегти спогади про свої втрати. Братні війни не були забуті, як не забуте і ставлення радянської влади до карелів.\n\nВ результаті жителі Східної Карелії почали відкрито братися за зброю в боротьбі проти гнобителів. Зброя і боєприпаси вже певний час постачаються в регіон, але тепер повсталі закликають вигнанців повернутися і приєднатися до боротьби.\n\nПитання в тому, чи візьме [ROOT.GetName] участь у боротьбі цього разу?"
 AAT_finland_misc_events.03_tt:0 "Додає +1"
 AAT_finland_political.08.a:0 "[ROOT.GetAdjective]ий народ дякує вам за службу, маршале бароне Маннергейме!"
 AAT_finland_the_white_death.1.a:0 "Erinomaista!"
 AAT_finland_winter_war.06.t:0 "[FROM.GetAdjective]і територіальні вимоги миру"
 AAT_finland_winter_war.07.desc:0 "Вони погодилися на умови миру! Народ на вулицях святкує перемогу. [FROM.GetAdjective]і війська вже почали залишати нашу територію, безславно повертаючись додому. \n\nЦей день — день гордості нації. Ми не просто здолали загарбників — їхня поразка була настільки розгромною, що ми змогли розширити свої території за рахунок ворожих земель!"
 AAT_finland_winter_war.08.a:0 "Дурні! Вони за це заплатять!"
 AAT_norway.11.a:0 "Народ цієї давньої землі більше не спить!"
 AAT_norway_monarchist.1.desc:0 "Незважаючи на те, що король Гокон наполягає на незалежності Стортингу та дозволяє йому вирішувати свої питання всередині країни, його камергер, Педер Анкер Ведель-Ярлсберг, пропонує норвезькій короні втрутитися в небезпечно нестабільну ситуацію.\n\nПосилаючись на невизначену загрозу іноземного вторгнення, він закликає жителів держави [ROOT.GetName] продемонструвати свою довіру до короля та вимогти дій від свого присяжного сюзерена.\n\nВін є найближчою довіреною особою короля і добре пов'язаним членом наймогутнішої дворянської родини в державі [NOR.GetName], тому такий розвиток подій повинен викликати обачність."
 AAT_norway_rikstanken.1.b:0 "[?NOR_communist_tank_seller.GetName], безумовно, маж засоби."
 AAT_norway_rikstanken.5.desc_SOV:0 "[FROM.GetAdjectiveCap]ий уряд звернувся до нас із проханням придбати у нас велику кількість легких танків, і він бажає не лише укласти торгову угоду, але й створити тісніші відносини між нашими народами.\n\nЦе можливість для нас показати населенню держави [FROM.GetName], чого можна досягти, коли засоби виробництва захоплені, і це призведе до тіснішої співпраці в майбутньому."
 ABDA_corps_expeditionnaire:0 "CEFEO"
 ABILITY_DEEPER_DIG_IN_DESC:0 "Ваші війська отримають велике посилення швидкості окопування."
 ACCEPT_AND_SUBMIT:0 "Прийняти та надіслати"
 ACE_PILOT_STATUS:0 "Поточний стан: $STATUS$\n"
 ACE_UNASSIGNED:0 "Непризначено"
 ACHIEVEMENTS_MOSTLY_NOT_OK:0 "§RБільшість досягнень недоступна.§!"
 ACTION_UNIT_STRATEGIC_DISABLED:0 "$COUNT|H$ — страт. передислокація вимкнена"
 ADDRESS_ZIP_CODE_HINT:0 "Вкажіть поштовий індекс"
 ADD_CONVEYOR_LINE_BUTTON_DESC:0 "Додати військову частину $CONVEYOR|H$ для паралельної підготовки.\n\n§GShift + клацніть§!, щоби додати 5 частин."
 ADD_MASTERY_EFFECT:0 "Додати $AMOUNT|H0$ £doctrine_mastery §Hмайстерності§!"
 AFA_democratic_party_long:0 "Афарська національно-демократична партія"
 AFG_BLITZKRIEG_DESC:0 "У той час як король Захір-шах продовжує зростати у своїй ролі, виклики, що стоять перед його правлінням, продовжують зростати. Британія, Німеччина та Радянський Союз борються за вплив на стратегічно розташоване королівство, приносячи як інвестиції, так і погрози інтервенції. Тим часом порушники спокою перетинають кордони з Індією, розпалюючи заворушення з обох боків. Але в той час, як світ знову занурюється у війну, в регіоні постає питання: «Що робитиме Афганістан?»"
 AFG_abdur_rahim_khan:0 "Абдур Рахім-хан"
 AFG_anti_soviet_cooperation_desc:0 "Не бракує націй, які бажають обмежити [SOU.GetAdjective] вплив. Ми повинні використати це як можливість отримати військовий досвід від цих націй, щоб бути повністю готовими до будь-якої майбутньої [SOU.GetAdjective] експансії."
 AFG_approach_foreign_inteligence_services:0 "Звернутися до іноземних розвідувальних служб"
 AFG_approach_foreign_inteligence_services_desc:0 "Ми знаходимося на перехресті великих держав і довгий час були у їхній милості. Якби ми створили власну розвідувальну службу, ми могли б скористатися нашим унікальним становищем, налаштовуючи наших сусідів одне проти одного."
 AFG_central_asia_neutrality_ADJ:0 "Дар'їнськ"
 AFG_confederation_pak_communism_DEF:0 "Афгано-пакистанський союз"
 AFG_contact_amanullah_loyalists:0 "Зв'язатися з лоялістами Аманулли"
 AFG_continuity_pm:0 "Прем'єр-міністр спадкоємності"
 AFG_crown_the_bukharan_emir_desc:0 "Зі встановленням контролю над територією новий правитель має зійти, щоб претендувати на титул Еміра. Саїд Мір Мухаммад Алім-хан Бухарський перебуває в Кабулі вже досить багато років і є ідеальним кандидатом, якщо ми хочемо відновити славу великої Імперії Дуррані."
 AFG_democratic_ADJ:0 "Афганськ"
 AFG_disgruntled_minority:0 "Невдоволена меншина"
 AFG_expand_border_guards:0 "Розширити прикордонну охорону"
 AFG_expand_state_run_factories:0 "Розширити державні фабрики"
 AFG_eyes_on_the_north:0 "Погляд на північ"
 AFG_fascism_ADJ:0 "Афганськ"
 AFG_fortify_pakistan_tt:0 "Штати вздовж кордону з [RAJ.GetNameDef], які ми придбали в попередньому фокусі, отримають §G2§! §YНаземних форти§!"
 AFG_hold_a_loya_jirga_desc:0 "Ми повинні переконати короля Захіра провести зустріч із племінними та релігійними лідерами нації, на якій ми зможемо поставити під сумнів його легітимність та заручитися більшою симпатією до нашого зростаючого повстання."
 AFG_hold_elections_desc:0 "Зі стабілізацією ситуації в країні, ми тепер маємо можливість нарешті провести перші вільні вибори [AFG.GetNonIdeologyName]."
 AFG_hold_elections_tt:0 "§YНаступна подія виборів дозволить нам обрати нового лідера країни.§!"
 AFG_increase_air_purchases:0 "Збільшити закупівлю літаків"
 AFG_industrial_events.10.a:0 "Це відповідає нашим стратегічним інтересам."
 AFG_industrial_events.10.b:0 "Нам не потрібно втручатися у внутрішні справи [FROM.GetAdjective]."
 AFG_industrial_events.40.a:0 "Тривожний розвиток подій."
 AFG_industrial_events.54.b:0 "Ми не боїмося звільнити територію силою."
 AFG_industrial_events.59.a:0 "Тоді ми продовжуємо захищати нашу територію."
 AFG_industrial_events_31_tt:0 "§RЦей курс дій може призвести до війни з [FROM.GetNameDefCap]!§!"
 AFG_iron_mines_desc:0 "Олово, мідь та залізо є необхідними для виробництва багатьох сучасних потреб. Якщо ми хочемо розвинутися в індустріалізовану націю, нам потрібно розвивати та забезпечувати власний доступ до таких ресурсів. На щастя, у нас багато нерозвіданих ресурсів, які чекають на експлуатацію."
 AFG_manghud_party_long:0 "Manghud Dynasty"
 AFG_political_events.110.t:0 "[FROM.GetNameDefCap] запитує територію"
 AFG_political_events.156.desc:0 "Як було попередньо домовлено, [FROM.GetAdjective] обладнання було надано нам з моменту спалаху громадянської війни. Їхні оперативники в [ROOT.Capital.GetCapitalVictoryPointName] також запевнили нас, що таємні [FROM.GetAdjective] війська незабаром прибудуть до країни, щоб допомогти нам у боротьбі."
 AFG_political_events.62.t:0 "[FROM.GetNonIdeologyName] відхиляє $AFG_turko_persian_union$"
 AFG_political_events.72.desc:0 "Політична ситуація в [AFG.GetNameDef] досягла критичної точки. Їхній уряд офіційно відхилив Лінію Дюранда, вимагаючи перегляду кордонів для об'єднання паштунських племен. [AFG.GetAdjective] уряд чітко дав зрозуміти, що невиконання цих вимог призведе до оголошення війни. Зіткнувшись із перспективою дорогого та тривалого конфлікту, [FROM.GetNameDef] запропонувала поступитися спірною територією [AFG.GetNameDef] у спробі зберегти регіональну стабільність та уникнути подальшої ескалації."
 AFG_political_events.90.a:0 "Ми повинні задіяти додаткові сили безпеки для придушення заворушень."
 AFG_political_events.95.desc:0 "Нещодавня громадянська війна, що охопила знесилену націю [AFG.GetNonIdeologyName], викликала тривогу в [ROOT.Capital.GetCapitalVictoryPointName]. Однак ситуація набула нової гостроти, оскільки повідомлення з регіону свідчать про те, що [GER.GetAdjective] війська допомагають силам [AFG.GetLeader] повалити законний уряд. Ми можемо лише припустити, що це свідчить про узгодження [AFG.GetLeader] з [GER.GetNameDef], що було б великою загрозою для наших інтересів у цьому районі. Таким чином, члени збройних сил розробили плани для нашого схвалення, які дозволять нам таємно допомогти законному уряду та запобігти фашистському захопленню нації."
 AFG_protector_of_baghdad_desc:0 "TODO"
 AFG_reform_4:0 "Економічна модернізація"
 AFG_reorganize_the_royal_guard_desc:0 "Королівська гвардія не відповідає честі, яка була на них покладена. Ми відродимо їх за допомогою низки реформ та розширення їхніх лав. Вони повинні стати втіленням сили та рішучості [ROOT.GetNameDef]."
 AFG_republic_of_afghanistan:0 "Оголосити республіку"
 AFG_secure_baghdad:0 "Забезпечити Багдад"
 AFG_shah_mahmud_khan:0 "Сардар-шах Махмуд-хан"
 AFG_standardize_equipment_desc:0 ""
 AFG_visit_foreign_capitals_desc:0 "Нашому режиму бракує міцних зв'язків з великими державами по всьому світу. Оскільки геополітична ситуація стає менш стабільною, було б в наших найкращих інтересах забезпечити кращі стосунки з цими державами на випадок, якщо нам випаде нагода."
 AGENCY_UPGRADES_DURATION:0 "Поліпшення філій займає $DAYS|H$ дн."
 AGENCY_UPGRADE_IN_PROGRESS:0 "§HПоліпшення триває§!"
 AIRWING_COUNTRY_HIDDEN:0 "§TДержава $COUNTRY|H$ має близько $AMOUNT|H$ літаків на цій авіабазі.§!"
 AIRWING_MISSION_CANCEL_TRANSFER:0 "Скасувати поточне переміщення."
 AIRWING_MISSION_EFFICIENCY_TOT:0 "§TЕфективність завдання: $AMOUNT|H1%$.§!\n"
