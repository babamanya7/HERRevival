 NOR_modify_independent_norway_TT:0 "Змінює §Y$NOR_independent_norway_dmod$§! на:"
 NOR_nationalize_the_hydro_plants_desc:0 "Гідроелектроенергетика є одним із основних компонентів індустрії [ROOT.GetAdjective], але зараз вона не в тих руках, у капіталістичних руках! Захопімо засоби вироблення електроенергії для наступного етапу революції."
 NOR_oscar_torp:0 "Оскар Торп"
 NOR_our_royal_claims_desc_king:0 "Нам пощастило мати такого скромного короля, який заперечує будь-які претензії на землі за межами його поточної юрисдикції. Нам ще більше пощастило мати нашого дорогого графа Педера Анкера Ведель-Ярлсберга, який готовий зробити все можливе, щоб натиснути ці претензії та перенесіть їх у наше царство. Ми станемо воювати за землю нашого короля!"
 NOR_prep_his_dmod_2:0 "Розвинута область"
 NOR_prince_olav:0 "Принц Олав Норвезький"
 NOR_prince_olavs_inspiration_desc:0 "Незважаючи на нашу поточну ситуацію, [NOR.GetAdjective]ий народ усе ще вірить у нашого принца. Хоча він не приєднався до боротьби, його підтримка з вигнання є неоціненною для легітимності нашого уряду."
