 HABSBURG_industrializing_our_capitals:0 "Індустріалізація Столиць"
 HABSBURG_part_of_something_bigger_desc:0 "Усі люди знають, що вони повинні захищати свої власні домівки, однак наша новостворена федерація неминуче зазнає краху, якщо вони також не усвідомлять важливість транскордонного співробітництва та допомоги в захисті того, що дорого ближньому."
