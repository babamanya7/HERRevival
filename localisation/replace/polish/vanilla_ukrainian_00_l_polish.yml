 NOR_invest_in_airfields_desc:0 "Немає сенсу мати літаки, якщо ми не маємо інфраструктури, необхідної для їх запуску. Нам дуже бракує необхідної інфраструктури, щоб задовольнити потреби розширених військово-повітряних сил."
