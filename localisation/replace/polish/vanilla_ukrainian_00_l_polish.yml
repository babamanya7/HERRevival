 tfv_south_africa.71.d:0 "Звільнившися з-під влади колоніальних гнобителів, [SUD.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [SUD.GetAdjective]ого уряду."
