 UNITS_VIEW_BTN_DRAW_OFFENCE:0 "§HЛінія наступу§!\n§GКлацніть і втримуйте праву кнопку§! на мапі, щоби намалювати §Yлінію наступу§!.\nЛінії можна малювати тільки на території, до якої у Вас є призначена §Hлінія фронту§! або наказ про §Hморське вторгнення§!.\n\nДивізії, призначені до плану з лінією наступу, намагатимуться взяти територію, щоби перемістити свою лінію фронту туди.\n\n§GУтримуйте кнопку миші§! та §Gвідпустіть§! по кнопці виконання плану, щоби змінити тип виконання."
