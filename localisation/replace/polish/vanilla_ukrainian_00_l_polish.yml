 HUN_intervene_in_czechoslovakia_desc:0 "За умовами Тріанонського договору Чехословаччина отримала частину наших земель. При цьому нам відомо, що Німеччина має погляди на Чехословаччину загалом. Можливо, нам вдасться дійти згоди: вони повернуть наші законні землі і отримують гарантію радянської військової допомоги у разі німецької агресії."
