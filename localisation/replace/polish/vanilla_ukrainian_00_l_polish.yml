 SWE_GATHERING_STORM_DESC:0 "Незважаючи на те, що Швеція зберігала нейтралітет у Великій війні, вона зазнала чимало труднощів через спроби Великої Британії блокувати Німеччину. У той час як напруженість на континенті зростає, шведський народ побоюється, що він знову буде змушений страждати від рук великих держав.\n\nТим часом соціал-демократи намагаються знайти баланс між створенням загального добробуту, здатної підтримати населення, яке перебуває в облозі, і створенням надійного військового стримування, щоб зберегти столітню прихильність нації до нейтралітету."
 SWE_VICTORY_POINTS_9167:0 "Тавастегус"
 SWE_adopted_ger_lang_idea:0 "Онімечення"
 SWE_beneath_sticks_and_stones:0 "Під палицями та камінням"
 SWE_bofors_fly_swatter_desc:0 "Bofors має потенціал встановити новий стандарт протиповітряної техніки. Ми повинні надати їм ресурси для цього та забезпечити, щоб шведське небо залишалося вільним від ворожих літаків."
 SWE_central_nordic_army_command_tt_2:0 "Вони будуть більш схильні погодитися, якщо:\n -Вони мають §Yвисоку думку про нас§!\n -Ми маємо сильнішу §Yармію§!, ніж вони\n -Ми маємо такий самий §Yтип уряду§!, як і вони\n -Ми §Yгарантуємо§! їх"
