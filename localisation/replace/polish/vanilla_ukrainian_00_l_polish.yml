 JAP_sway_disillusioned_young_officers_desc:0 "Більшість молодих офіцерів, які брали участь у нещодавньому державному перевороті фракції Кодоха, походять із бідних сільських родин і незадоволені нинішньою структурою армії та системою просування по службі, що базується на походженні, а не на заслугах. Ми повинні використати це і пообіцяти їм краще завтра."
