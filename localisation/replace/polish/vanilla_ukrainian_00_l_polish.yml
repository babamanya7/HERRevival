 TUR_balkan_pact:0 "Балканська Антанта"
 TUR_balkan_pact_innovative_transport_techniques_desc:0 "Щоб краще координувати та сприяти легкому транспортуванню наших армій через наші численні кордони, ми, як колектив націй, мусимо поліпшити нашу інфраструктуру. Сподіваємось, ця ініціатива допоможе подолати цю перешкоду."
 TUR_brace_against_the_red_menace_desc:0 "[GetBraceAgainstTheRedMenaceDesc]"
 TUR_british_dockyards_in_turkey_desc:0 "Наша берегова лінія є великою і тягнеться майже по всій межі. На ній вистачає місця для розвитку кораблебудівної промисловості, і [ENG.GetAdjective] дипломати це визнають. Ми приймемо їхню пропозицію щодо посилення нашої кораблебудівної галузі, щоби схилити шальки терезів у війні в нашу з ними сторону."
 TUR_counter_the_rebels_in_hakkari:0 "Протистояти повстанцям у Хаккярі"
 TUR_disorganised_armed_forces_12_desc:0 "$TUR_disorganised_armed_forces_desc$"
 TUR_establish_the_committee_of_pan_turkism_desc:0 "По всій Євразії наші турецькі брати і сестри чекають, коли ми звільнимо їх з лап злих гнобителів. Так і буде, і ми не зупинимося, поки всі турки не опиняться під нашим захистом і в межах нашої країни!"
 TUR_etatism_crisis_1:0 "Зростаюча інфляція"
 TUR_fighter_equipment_2_short:0 "THK Fw 190"
 TUR_heavy_fighter_equipment_1:0 "TamTAS Arı"
 TUR_holding_our_first_multi_party_election:0 "Провести перші багатопартійні вибори"
 TUR_holding_our_first_multi_party_election_desc:0 "Сама доля Турецької республіки залежить від майбутніх виборів, але ми заприсяглися виступати на них чесно і своє слово дотримали. Турецькому народу можна вірити — він зробить правильний вибір."
 TUR_inanc_vergisi_spirit:0 "İnanç Vergisi"
 TUR_infantry_equipment_1_short:0 "M38 Kırıkkale"
 TUR_is_kemalist_state_tt:0 "Вважається £faction_tur_kemalist §Yкемалістською областю§!"
 TUR_kazim_karabekir:0 "Кязим Карабекір"
 TUR_kemalist_army_officers_powerful_loyal_desc:0 "Офіцери елітного турецького корпусу — одні з найбільших захисників кемалістських цінностей. Кемалізм ніколи ще не укорінявся в Туреччині так глибоко, як в наші дні, і ніколи ще в державі не було так безпечно, як при нинішній адміністрації."
 TUR_liberalism_decision:0 "Лібералізм"
 TUR_muzaffer_goksenin:0 "Музаффер Гьоксенін"
 TUR_nuri_killigil:0 "Нурі Кіллігіль"
 TUR_pack_for_a_long_winter:0 "Приготуватися до довгої зими"
 TUR_peace_at_home:0 "Мир удома"
 TUR_press_the_austro_hungarian_claim:0 "Висунути австро-угорські претензії"
 TUR_realize_the_nightmare_of_meiji_desc:0 "Султан Абдул-Хамід II боявся, що японський імператор прийме іслам і оголосить себе халіфом замість турецького монарха. Цього не сталося. На жаль, Японія підписала як Лозаннський, так і Севрський договори. Ми довго захоплювалися японцями, але тепер бачимо, що вони так само гідні засудження, як інші старі держави. Ми осоромимо їх і правитимемо Нихонським хедиватом безпосередньо з Константинополя."
 TUR_red_officers_desc:0 "Так само, як офіцери-кемалісти представляють і захищають свою власну ідеологію, наші нові офіцери будуть служити охоронцями марксизму в державі [TUR.GetNameDef]."
 TUR_return_of_the_sultan_desc:0 "Нарешті настав час зробити те, що ми так давно мріяли, — негайно повернути султана додому з вигнання. Наші лоялісти вже зв'язалися з ним, і тепер залишається лише повернути його додому та влаштувати церемонію коронації."
 TUR_secularism_decision_desc:0 "Якщо ми дозволимо архаїчним середньовічним догмам впливати на управління нашою країною та на наш спосіб життя, нам ніколи не домогтися, щоб великі держави цього світу вважали нас рівними собі."
