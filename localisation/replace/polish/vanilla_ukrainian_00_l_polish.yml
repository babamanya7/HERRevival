 JAP_solidify_tohokai_rule_desc:0 "Зі сходженням Накано на посаду прем'єр-міністра фракція Тохокай в Асоціації допомоги трону стала найбільшою. Тепер ми маємо можливість по-справжньому зміцнити правління Товариства Сходу та закріпити роль Накано в [ROOT.GetAdjective]ій політиці на найближчі роки!"
