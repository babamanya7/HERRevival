 SWE_crusade_against_bolshevism_tt:0 "\nЯкщо §Y$SWE_crusade_against_the_eastern_threat$§! активний, поки §Y[SWE.GetName]§! або будь-який член альянсу захоплює будь-яку з цих земель:\n§Y[195.GetName]§!, §Y[206.GetName]§!, §Y[202.GetName]§!, §Y[242.GetName]§!, §Y[219.GetName]§!, §Y[137.GetName]§!, §Y[218.GetName]§!, §Y[217.GetName]§!, §Y[252.GetName]§!, §Y[249.GetName]§!, §Y[229.GetName]§!, §Y[247.GetName]§!, §Y[408.GetName]§!, §Y[214.GetName]§! буде скинуто до повних 365 днів."
 SWE_democratic_party:0 "СДРПШ"
 SWE_establish_nordland_desc:0 "Ми повстали з попелу під керівництвом [GER.GetNameDef], сильніші, ніж будь-коли раніше. Тепер ми маємо бути винагороджені за нашу вірність справі розширенням нашого панування глибоко на Схід."
 SWE_finland_claims:0 "Визнання наших фінських претензій"
 SWE_government_weapons_contract_desc:0 "У [SWE.GetName] є багато компаній, які мають досвід у створенні зброї. Якщо ми хочемо бути готовими до тотальної війни, нам потрібно стимулювати розширення цих компаній через контракти на військову техніку."
 SWE_hedgehog_defense_desc:0 "Ми можемо підвищити ефективність нашої оборони в глибинних операціях, використовуючи тактику «їжака», яка складається з невеликих осередків військ на захисних позиціях, які ворог може обійти. Однак стримування осередків позбавить ворога сили та залишить його вразливий до контратаки."
 SWE_husqvarna_vapenfabrik_desc:0 "Husqvarna має довгу історію виробництва стрілецької зброї для [SWE.GetAdjective]ої армії. Настав час розширити їхню промислову базу та використати їхній досвід для модернізації армії."
