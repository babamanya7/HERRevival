 RULE_ALLOW_RELEASE_NATIONS_PEACE_ONLY_TOOLTIP:0 "Правило гри: §R$RULE_ALLOW_RELEASE_NATIONS_PEACE_ONLY_DESC$§!"
 RULE_ALLOW_WARGOALS_FREE_100_DESC:0 "Виправдання цілей війни вимкнене при менш ніж 100% світової напруженості, але доступне для всіх держав при більшому рівні. Обмеження за ідеологіями не враховуються, але отримання цілей за національними фокусами досі доступне."
 RULE_HISTORICAL_BRA_AI_DESC:0 "Варгас намагатиметься залишитися при владі, обережено знищуючи політичну опозицію в Бразилії, перш ніж урешті-решт приєднається до Союзників і співпрацюватиме зі Сполученими Штатами."
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI:0 "Незалежний комунізм"
 RULE_OPTION_CAVE_TO_THE_GERMANS:0 "Прогнутися під німців"
 RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC:0 "Чилійський ШІ вирішить підтримати різні організації мапуче, і ті врешті-решт візьмуть у країні контроль. Пізніше він піде священною війною проти імперіалізму, вигнавши європейців із земель Південної та Центральної Америки."
 RULE_OPTION_COMMUNIST_COMINTERN:0 "Комунізм"
 RULE_OPTION_COMMUNIST_JAP_AI:0 "Червоне сонце сходить"
 RULE_OPTION_COMMUNIST_PHI_AI:0 "Морський комунізм"
 RULE_OPTION_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES:0 "Лідерство серед малих демократій"
 RULE_OPTION_FASCIST_DICTATORSHIP_DESC:0 "Плутарко Кальєс, Сатурніно Седільйо й інші військові лідери покінчать зі спробами встановити §Hдемократію§! в Мексиці і зблизять країну з Німеччиною."
 RULE_OPTION_FASCIST_URG_AI:0 "Фашистський шлях"
 RULE_OPTION_GOE_INDIA_COMMUNISM_RAJ_AI_DESC:0 "Індія спробує здобути незалежність за допомогою комуністичного дерева фокусів. У разі успіху Індія зосередиться на зростанні сільськогосподарської економіки та створенні власної унікальної соціалістичної ідеології."
 RULE_OPTION_LOYALIST_INS_AI:0 "Лоялізм"
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS_ENG_AI_DESC:0 "§HБританський§! ШІ намагатиметься зорганізувати чорносорочників і зробити країну фашистською, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_REVOLUTION_COMMUNIST_INS_AI:0 "Malaka's Revolution (комунізм)"
 RULE_OPTION_SAME_FACTION:0 "Лише при членстві в одному альянсі"
 RULE_OPTION_SECOND_REPUBLIC:0 "Друга республіка"
 RULE_OPTION_SIDQI_IRQ_AI_DESC:0 "Бакр Сідкі здійснить свій історичний переворот, але не буде вбитий. Натомість уряд буде співпрацювати з Іраном і Туреччиною з метою формування регіонального блоку держав."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC:0 "ШІ намагатиметься утворити Нордичну оборонну раду для захисту Нордики."
