 YUG_non_discriminating_officer_promotions_desc:0 "Наша дискримінаційна політика має бути скасована, і відтепер усім етнічним групам має бути дозволено просуватися по рядах нашого офіцерського корпусу. Це дозволить отримати найздатніше військове керівництво, яке ми можемо отримати."
 YUG_peasant_uprisings_desc:0 "Народи Балкан досить довго страждали під черевиком імперіалізму! Ми простягнемо руку до страждаючих нижчих класів Балкан і організуємо їх у страйки та демонстрації, доки буржуазія не буде справедливо знищена!"
