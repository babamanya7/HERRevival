 COG_secure_soviet_aid_desc:0 "Є багато сил, які хотіли б бачити нас незалежними або хоча б послабити наших бельгійських володарів. Радянський Союз може бути нашою найкращою надією, якщо ми хочемо здобути союзника, на якого можна покладатися навіть після війни."
 COG_the_ma_loango_focus_desc:0 "Мâ Лоанго — традиційний правитель Королівства Лоанго. Тепер, коли ми прийняли це звання, ми повинні прагнути до реінтеграції старих територій, які колись належали королівству."
 COG_the_mwami_of_burundi_focus_desc:0 "Тепер, з піднесенням Мвамбуци IV Бангіріченге на наш трон, ми можемо претендувати на титул Королівства Бурунді. Зробивши це, ми зможемо легітимізувати наші претензії на це маленьке королівство на сході, і, можливо, ми можемо піти далі."
