 PHI_the_red_sun_over_manila:0 "Червоне сонце над Манілою"
 PHI_trucks:0 "вантажівки"
 PHI_usa_equipment:0 "§Y[PHI.GetName]§! використовуватиме §YВПО [USA.GetName]§!."
 PHI_usa_focus_done_T3_tt:0 "Завершено всі три фокуси: §YПрив'язати песо до долара§!, §YПро-хасендадос§! та §YЗакон про громадянство§!."
 PHI_vicente_lava:0 "Vicente Lava"
 PLAN_EXECUTE_CAREFUL_DESC:0 "При виконанні плану військові частини не нападатимуть на важкозахищені місця, якщо тільки вони не зайняті ворожими військами, і уникатимуть нападу на провінції, взяття яких послабить лінію фронту, зробивши їх довшою."
 PLAN_PREPERATION_BREAKDOWN:0 "$MAX_DESC$\n$SPEED_DESC$"
