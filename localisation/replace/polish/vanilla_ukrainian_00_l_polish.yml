 FRA_join_germany_desc:0 "Німецький Райх стає силою, з якою не можна не зважатися. Їхні плани на майбутнє можна привести у згоду з нашими власними цілями. Ми мусимо підтримати їх, і коли вляжеться пилюка, Франція займе те місце в Європі, яке належить їй по праву."
