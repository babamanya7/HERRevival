 TUR_the_international_of_proletarian_freethinkers:0 "Інтернаціонал пролетарів-вільнодумців"
 TUR_the_treaty_for_prosperity_and_trade:0 "Договір процвітання та торгівлі"
 TUR_truce_with_government_called_flag:0 "Пролунав заклик до перемир'я з урядом"
 TUR_utilize_foreign_capital_desc:0 "Наша нація молода, на багатьох наших землях ще немає промисловості, але нам не доведеться вирішувати цю проблему самотужки. Чимало європейських держав зацікавлені у сильній Туреччині, і якщо ми звернемося до них за допомогою, вони обов'язково її нададуть."
 TUR_variant_turkish_tax_focus:0 "[Root.GetTurkishVariantTaxName]"
 TUR_widespread_illiteracy_idea_desc:0 "Хоча рівень грамотності в нашій країні значно зріс з часу впровадження реформ алфавіту та мови завдяки зусиллям Ататюрка з підвищення грамотності та національним освітнім кампаніям, що навіть принесли йому звання «башьогретмен», попереду ще багато роботи."
