 CONFIRMDELETEUNIT:0 "Розформувати дивізію"
 CONGO_african_union_desc:0 "Ідеї панафриканізму набрали популярності на всьому континенті, і багато вільних африканських народів бажають об'єднатися заради спільної мети. Ми повинні сприяти цьому та створити організацію, яка зможе об'єднати всі наші нації."
 CONGO_free_enterprise_fund_desc:0 "Бельгійська колоніальна адміністрація добре усвідомлює, що їм потрібно інвестувати для максимального використання потенціалу Конго. Тому вони пропонують фінансові гранти для малих підприємств, щоб допомогти їм стартувати."
 CONGO_gold_and_diamonds_desc:0 "Ми знаходимося в досить вдалому становищі, контролюючи великі запаси золота та діамантів. Ми повинні використати ці ресурси, щоб купити потрібні постачання, експертизу та інструменти, де це необхідно найбільше."
 CONGO_improved_employment_contracts_desc:0 "Попит на сировину досяг таких рівнів, що ми вже не можемо маніпулювати ринком праці так, як раніше. Шахтарі самі стали цінним товаром, і вони це знають. Щоб забезпечити їхню продуктивність, нам потрібно запропонувати їм кращі умови праці."
 CONGO_purchasing_commission_desc:0 "З тим, як Конго все більше залежить від сучасного обладнання та техніки, стало очевидно, що потрібно створити департамент для організації імпорту таких товарів."
 CONGO_regional_specialization_desc:0 "Конго — велика країна, що складається з різноманітних географічних зон і біомів. Ми повинні забезпечити, щоб відповідні ресурси, експертиза та інструменти були направлені в регіони, де їх можна найкраще використати."
