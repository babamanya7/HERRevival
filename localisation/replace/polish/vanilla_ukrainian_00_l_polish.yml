 SOV_demand_balkan_submission_desc:0 "Минулий досвід показав, що країни, які нас оточують, скористаються будь-якою нашою слабкістю. Коли в Європі назріває війна, ми не можемо дозволити собі мати сусідів із сумнівною лояльністю. Країни на Балканах і в Малій Азії змушені будуть вибрати, чи хочуть вони бути з нами, чи проти нас."
 SOV_destroyer_2:0 "Клас «Гнівний»"
 SOV_development_aid_for_eastern_allies_desc:0 "Протягом століть західний імперіалізм і колоніалізм жорстоко експлуатували країни Азії. Скромні інвестиції з нашого боку дозволили б нашим союзникам в Азії набагато ефективніше протистояти подальшим капіталістичним зазіханням."
 SOV_diversify_the_programme_desc:0 "Ми багато чому навчилися за останні роки і досягли прогресу в галузі традиційної війни. Ми — нація великих вчених, які здатні розкрити методи ведення війни, що дають величезні переваги. Ми мусимо забезпечити їм найкращі умови для роботи, якщо хочемо бачити результати."
 SOV_expand_shipbuilding_plants:0 "Розширити кораблебудівні заводи"
 SOV_found_the_warsaw_pact_desc:0 "Коли над Європою дмуть вітри змін, стає дедалі зрозуміліше, що нам потрібен договір про колективну оборону, щоб запобігти будь-якій агресії з боку занепадаючого Заходу. З цією метою ми повинні формалізувати Організацію Варшавського договору, військове доповнення до РЕВ."
 SOV_fyp_controlled_factories_tier_3_tt:0 "Більш ніж §Y[?ROOT.SOV_fyp_factory_requirement_tier_3]§! заводів під контролем (наразі §[GetColorControlledFactoriesTier3][?ROOT.num_of_controlled_factories]§!)"
