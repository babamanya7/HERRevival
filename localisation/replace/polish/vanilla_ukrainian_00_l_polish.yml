 SOV_integrate_poland:0 "Інтегрувати Польщу"
 SOV_ivan_chernyakhovsky:0 "Іван Черняховський"
 SOV_kirov:0 "«Киров»"
 SOV_liberate_ryutin_tt:0 "§Y$SOV_martemyan_ryutin$§! буде звільнений та відправлений у вигнання (§Gперсонажі у вигнанні не можуть бути піддані чистці§!). Він стане доступний як радник, коли почнеться громадянська війна, а його прихильники приєднаються до опозиції."
