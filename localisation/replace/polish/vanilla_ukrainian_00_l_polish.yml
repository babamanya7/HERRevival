 GER_navy_imperial_modifier_desc:0 "Наш потужний Імперський флот прокладе шлях через океани для реалізації наших глобальних амбіцій і панування на морях."
 GER_no_balkan_communism_ROM_tt:0 "Отримати ціль війни §YПовалення уряду§! проти §YРумунської народної республіки§!.\n"
 GER_no_reds_in_western_europe_tt:0 "Отримати ціль війни §YПовалення уряду§! проти комуністичних держав у Нижніх землях і Франції.\n"
 GER_norway_friend_desc:0 "Норвегія контролює практично весь експорт заліза із Північної Швеції. Нам слід залякати їх та схилити до «дружби» під загрозою розширення нашого флоту."
 GER_num_of_puppet_economies_integrated_tt:0 "Ви можете впливати на економіку до [?GER_puppet_economies_integration_cap] країн. (Зараз: §[GetColorForCurrentIntegratedPuppetEconomiesValue][?GER_puppet_economies_integrated]§!)"
 GER_offer_military_production_support_tt:0 "Усі східноєвропейські держави під нашою опікою отримають наступний бонус до §Yвійськового виробництва§! на §Y730§! днів:"
 GER_oswald_lutz:0 "Освальд Люц"
 GER_otto_skorzeny:0 "Отто Скорцені"
 GER_our_place_in_the_sun_desc:0 "Нехай усі знають, що німецька імперія знову заявляє свої права на місце під сонцем! Наш народ відмовляється принизливо мерзнути в тіні."
 GER_pragmatic_socialist:0 "Прагматичний соціаліст"
 GER_protect_the_revolution_desc:0 "Дехто сприймає наші інтервенції за кордоном як спробу здобути вплив, але ми знаємо, що наша місія — захистити пролетаріат навіть за межами нашої держави. Для цього нам потрібна можливість діяти за межами звичних норм міжнародної політики."
 GER_prussian_artillery:0 "Прусська артилерійська доктрина"
 GER_raid_category_fluff_text_naval_commando_raids:0 "§LКрігсмаріне§!"
 GER_recruiting_schutztruppe_locations_map_category_name:0 "Вибрати місце вербування підрозділів Шуцтруппе."
 GER_red_europe:0 "Червона Європа"
 GER_reestablish_free_elections_desc:0 "Ми знову станемо на шлях демократичних цінностей, повернувши вільні вибори у найближчому майбутньому."
 GER_reestablish_the_black_reichswehr:0 "Відновити «Шварцрайхсвер»"
 GER_reform_austro_hungarian_empire_tt:0 "Прохання до інших держав-спадкоємців Австро-Угорщини відновити Імперію.\n§RЯкщо вони погодяться, Ви успадкуєте всі війни, у яких вони беруть участь!§!\n"
 GER_reich_minister_of_armaments_speer:0 "Райхсміністр озброєнь"
 GER_request_the_return_of_french_held_colonies:0 "Запит на повернення французьких колоній"
 GER_rnd_programs_modifier:0 "Спільні R&D Програми"
 GER_schlieffen_once_more_ww_desc:0 "$GER_schlieffen_once_more_desc$"
 GER_second_vienna_award_noland:0 "Другий Віденський арбітраж"
 GER_sp_nuclear_reactor:0 "Uranmaschine"
 GER_spark_the_flame_of_revolution_desc:0 "Ситуація робітників у сусідніх країнах далека від ідеальної. Зрештою, там буде неминуча збройна революція, але поки що ми повинні хоча б поширити слово про комунізм."
 GER_speer_reich_architect:0 "$GER_reich_architect$"
 GER_start_the_proletarian_revolution_civil_war_tt:0 "Це призведе до §RГромадянської війни§!, якщо час місії завершиться!"
 GER_strafbataillon_desc:0 "Упровадивши заходи з індоктринації в армії, ми тепер можемо використовувати її не лише для того, щоби робити наших солдатів лояльними до нас. Розгортаючи штрафні батальйони, ми можемо виховувати бажані націоналістичні настрої в цих людей як за допомогою індоктринації, так і за допомогою служіння Батьківщині!"
 GER_submarine_4:0 "Тип «XXI»"
 GER_support_a_coup_in_liechtenstein_desc:0 "Ми отримали повідомлення про те, що в Ліхтенштайні однодумці планують скинути регента в цій мікрокраїні. Чоловік на ім'я Альфонс Гуп звернувся до нас за підтримкою і запевняє, що ми теж матимемо з цього користь."
 GER_support_the_finns_ww:0 "$GER_support_the_finns$"
 GER_tactical_bombers_desc:0 "$GER_strategic_air_effort_desc$ Зрівнявши з землею кожен завод за межами наших кордонів, ми забезпечимо, що тільки ми зможемо створити ефективну армію."
 GER_the_fading_eagle_category_desc:0 "Наші італійські союзники показали нам своє справжнє обличчя, оскільки їхній народ обернувся проти нас. Це ставить наш південний фланг під велику небезпеку. Ми зробимо те, що повинні — все, що в наших силах, щоб зібрати уламки старого уряду та взяти ситуацію під контроль."
 GER_todt_reich_minister_of_armaments:0 "$GER_reich_minister_of_armaments_todt$"
 GER_totaler_krieg:0 "Totaler Krieg"
 GER_trading_partners:0 "Торговельні партнери"
 GER_traditionalist:0 "Традиціоналіст"
 GER_turkey_puppet_desc:0 "Туреччина затиснута, як у лещата, між нами та [GER.GetTheUSSRName]. Якщо чинити на них тиск, турки, швидше за все, підкоряться і стануть маріонетковою державою. За це СРСР отримає частину території східної Туреччини. Однак якщо Туреччина відповість відмовою, розпочнеться війна."
 GER_unlock_operational_planning_in_africa_tt:0 "Відімкне рішення: §YОпераційне планування в Африці§!."
 GER_urbanization_desc:0 "Впровадження сучасної техніки в сільському господарстві вивільнило багато людей, які тепер стікаються до міст у пошуках нової роботи. Цим людям можна знайти хороше застосування на наших заводах, де вони можуть продовжувати робити нашу економіку однією з найсильніших у світі."
 GER_wehrwirtschaft_modifier:0 "Wehrwirtschaft"
 GER_wunderwaffen_modifier_desc:0 "Програми Wunderwaffe — це смілива ініціатива, спрямована на створення майбутнього війни через радикальні технологічні прориви. Наші вчені та інженери розширюють межі можливого, розробляючи революційні види озброєння, що забезпечать панування Німеччини в небі, на морі та на суші. Ці інновації можуть змінити хід історії й завдати вирішального удару будь-якому супротивнику!"
 GIE_DIVISION_RECRUITMENT_EXILE_PLAYER_DELAYED:0 "Держава $HOSTNAMEDEF|H$ передасть покликані §Hкадрові дивізії у вигнанні§! під наше командування."
