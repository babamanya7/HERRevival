 tfv_australia.11.d:0 "[Root.GetAdjective]і війська були готові взяти на себе відповідальність за захист усієї території [From.GetAdjective] у Південно-Східній Азії, щойно [From.GetLeader] затвердив угоду.\n\nХоча під час передачі був зустрінутий місцевий опір, страх перед зовнішньою агресією гарантує, що більшість визнає необхідність [Root.GetAdjective]ого захисту."
 tfv_canada.71.desc:0 "Наші великі друзі з держави [FROM.GetName] прийняли наше прохання і підписали запропонований Закон про Ньюфаундленд, фактично передавши нам суверенітет над Ньюфаундлендом і Лабрадором. Це великий день для Канади!"
