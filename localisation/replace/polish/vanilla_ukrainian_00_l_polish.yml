 CZE_anglo_czechoslovak_bank_desc:0 "Створений унаслідок злиття трьох інших празьких банків у 1930 році. Наразі це другий за величиною банк у країні."
 CZE_arms_exports_3_desc:0 "Попит на зброю досяг небачених раніше висот. Темпи виробництва щосили намагаються не відставати від нього. Щоб підтримати наших зброярів, ми можемо публічно оголосити про те, що продаватимемо техніку кожному, хто готовий за неї заплатити, і пустити ці кошти на власне переозброєння."
