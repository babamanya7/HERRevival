 GER_army_innovation_desc:0 "Гайнц Гудеріан та інші радикальні теоретики просувають новаторські військові доктрини, що наголошують на комунікації, визначення точок головного удару та локальна взаємодія повітряних та наземних сил. Якщо розвивати ці ідеї далі, можливо, ми зможемо уникнути м'ясорубки Великої війни."
 GER_army_modifier_desc:0 "[GER.GetNameDefCap] має довгу та славну військову історію з традицією інноваційного мислення. Генеральний штаб прагне ще більше покращити наші збройні сили після принизливої поразки у Великій війні. Озброєні цими знаннями, ми готові завдати удару будь-якому ворогу, що бажає підкорити наш гордий народ."
 GER_assassinate_mussolini:0 "Убивство Муссоліні"
 GER_atlantic_naval_bases_desc:0 "Визнаючи стратегічну важливість атлантичних прибережних регіонів, і в рамках наших зусиль щодо утвердження домінування над Атлантичним океаном, ми мусимо надати пріоритет розширенню та модернізації морських баз у прагненні до морської переваги."
 GER_autarky_efforts_desc:0 "$GER_autarky_desc$"
 GER_auto_union_organization:0 "$GER_auto_union$"
 GER_ballistic_missile_equipment_1_short:0 "A4"
 GER_befriend_turkey_desc:0 "$GER_turkey_friend_desc$"
 GER_boosting_communism_in_country:0 "[USA.GetNameDefCap] поширює комунізм"
 GER_brothers_in_arms_desc:0 "Наші австрійські брати мужньо билися разом із нами в Центральних державах. Ми повинні запропонувати їм угоду, від якої вони не зможуть відмовитись, щоб знову боротися пліч-о-пліч."
 GER_carl_walther:0 "Carl Walther"
 GER_carrier_3_desc:0 "«Graf Zeppelin» був єдиним класом кораблів Крігсмаріне, спроєктований як авіаносець від самого кіля. Було замовлено два кораблі, але жоден із них не було завершено. За задумом, «Graf Zeppelin» мав нести 30 винищувачів Bf-109T і 12 пікіруючих бомбардувальників Ju-87E, корабельних версій Bf-109E і Ju-87D."
 GER_carrier_4:0 "Клас «Europa»"
 GER_closer_sino_germanic_relations:0 "Зміцнити китайсько-німецькі відносини"
 GER_communist_propaganda_expanded_decision:0 "$GER_communist_propaganda_decision$"
 GER_construct_aircraft_carriers_desc:0 "Усякі великі та сучасні військово-морські сили, гідні свого імені, мусять мати у своєму складі авіаносці. Ці кораблі ставатимуть дедалі важливішими для панування на морях, тому, щоби не відставати від наших ворогів, ми мусимо запустити амбіційну програму з будівництва авіаносців."
 GER_danzig_or_war:0 "Данциг або війна"
