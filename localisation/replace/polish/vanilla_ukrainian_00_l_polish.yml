 COG_joseph_ileo:0 "Жозеф Ілео"
 COG_make_contact_with_irving_brown_desc:0 "Американський профспілковий діяч і лідер Американської федерації праці Ірвінг Браун давно має зв'язки з Сірілем Адулою, і як лейтенант армії США, він може бути дуже корисним для залучення на нашу сторону. Використовуючи його як контакт, ми зможемо залучити інвестиції від американців, пов'язаних із профспілками."
 COG_national_insitute_of_agronomic_study:0 "Національний інститут агрономічних досліджень"
 COG_proclaim_the_peoples_republic:0 "Проголосити Народну Республіку Конго"
