 shbb_focus_desc:0 "Навряд чи ми зуміємо за короткий термін перегнати Велику Британію чи Сполучені Штати за кількістю лінкорів, але, можливо, це нам і не потрібно. Ми могли б будувати набагато потужніші надважкі лінкори, які на Заході заборонені згідно з Вашингтонським морським договором."
 ship_ASW_upgrade_desc:0 "Зброя для боротьби з підводними човнами важлива для визначення місцезнаходження та ліквідації підводних човнів."
 ship_escort_deck_space_desc:0 "Open area inside the ship that allows the servicing and arming of wheeled airplanes. Much smaller and cramped than hangars on the Fleet Carriers."
