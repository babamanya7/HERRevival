 SWI_close_ties_with_fascists:0 "Тісні зв'язки з фашистами"
 SWI_closer_ties_with_germany_desc:0 "У нас є потужний і небезпечний північний сусід. Якщо ми хочемо вижити, можливо, було б гарною ідеєю залишатися на їхньому доброму боці, тому наближення до них у пошуках кращих стосунків, зберігаючи нейтральну позицію, виявилося б життєво важливим."
