 AUS_army_monarchy_intro_tt:0 "Замінити §YÖsterreichische Landwehr§! на:"
 AUS_austrofascism_opm:0 "Австрофашизм"
 AUS_became_subject:0 "[ROOT.GetNameDefCap] зазнає радикальних змін у своїй політиці після того, як ми втратили нашу незалежність. Хоча від втрати незалежності явно є багато негативних ефектів, нещодавно ми виявили один очікуваний позитивний. Оскільки ми більше не контролюємо власний суверенітет, спроба інтегрувати нас викликала б значно більше труднощів, ніж просто гнів населення.\n\nДобре усвідомлюючи це, здається, [GER.GetLeader] скасував план змусити нас приєднатися до німецької держави."
 AUS_bring_hungary_back_into_the_fold_desc:0 "Не так давно ми й [HUN.GetAdjective] були частиною однієї великої нації. Ми були насильно розділені після Великої Війни і обидва сильно ослаблені несправедливими угодами, які нам нав’язали. Щоб запобігти повторенню подібного, ми повинні запропонувати їх повну інтеграцію в нашу відновлену країну!"
 AUS_broke_the_treaty:0 "Порушив наш договір"
 AUS_cisleithania_neutrality_ADJ:0 "Цизлайтанськ"
 AUS_courting_the_princess_of_industry:0 "Зв'язки з «Принцесою промисловості»"
 AUS_danubian_state_ADJ:0 "Австро-дунайськ"
 AUS_defending_the_coast_desc:0 "Як би нас не приваблювала ідея відбудови нашого старого флоту у всій його красі, ми повинні дивитися правді в очі. Широкомасштабне виробництво капітальних кораблів не є для нас найближчим часом. Насправді, якщо ми не використаємо цей невеликий прибережний плацдарм негайно, ми, швидше за все, втратимо його, ніж коли-небудь знову виграємо морську битву. З великими кораблями доведеться почекати, а зараз нам потрібен флот, здатний захистити наше узбережжя."
 AUS_demand_hungarian_submission_tt:0 "Відкриває сукупність рішень із §YПідпорядкування Угорщини§! та окремі рішення для §YПоліпшення Вірогідності Мирного Результату§!."
 AUS_democratic_landbund:0 "Землеробський союз"
 AUS_devalue_the_schilling:0 "Девальвувати шилінг"
 AUS_extend_italian_claims_tt:0 "Відкриває сукупність рішень для §YРеінтеграції оспорюваних нами Територіями Італії§!."
 AUS_flight_schools:0 "Österreichischen Fliegerschule"
 AUS_for_a_better_future_desc:0 "Озираючись назад, наші цілі завжди стосувалися відновлення чогось втраченого. Тепер, коли цього нарешті досягнуто, ми повинні почати дивитися вперед у наше майбутнє."
 AUS_frontmiliz_focus:0 "Frontmiliz"
 AUS_great_austrian_economic_push_desc:0 "Наші невтомні зусилля повільно окупаються, і наша економіка знову зростає. Ми могли б відсвяткувати й залишитися з цим, але протягом процесу відродження нашої економіки ми побачили невикористаний потенціал. Навіщо погоджуватися на менше, якщо ми можемо ще далі розширити наш фінансовий сектор?"
 AUS_greater_germany_party_long:0 "Великонімецька народна партія"
 AUS_grossosterreich_neutrality:0 "Велика Австрійська імперія"
 AUS_imperilalist_sentiments:0 "Імперіалістичні настрої"
 AUS_infantry_equipment_3:0 "Steyr MG30"
 AUS_invest_in_semperit_synthetics:0 "Інвестувати в Semperit Synthetics"
 AUS_kingdom_of_austria_neutrality_ADJ:0 "Австрійськ"
 AUS_mechanized_equipment_1_short:0 "ADMK"
 AUS_militia_is_schutzbund:0 "Шуцбунду"
 AUS_osterreichische_gebirgsjager:0 "Österreichische Gebirgsjäger"
 AUS_outlaw_the_radicals:0 "Оголосити радикалізм поза законом"
 AUS_political_events.105.a:0 "Нас кинули напризволяще..."
 AUS_political_events.121.t:0 "[FROM.GetNameDefCap] відкидає наші вимоги"
 AUS_political_events.125.a:0 "Або Ви з нами, або..."
 AUS_political_events.36.c:0 "Ми вже бездоганні"
 AUS_political_events.43.c:0 "Ми ніколи не були їхнім підданим, але ми можемо зійтись на передачі відібраних у них земель."
 AUS_political_events.67.t:0 "[FROM.GetNameDefCap] приймає федеративний союз"
 AUS_political_events.68.desc:0 "Незважаючи на очевидні переваги та фатк, що так буде найкраще для усієї федерації, [FROM.GetNameDef] відхилила нашу пропозицію щодо більш тісного союзу. Можна лише здогадуватися щодо причин відмови, але, здається, вони не ставлять у найбільший пріоритет інтереси федерації."
 AUS_political_events.70.a:0 "Інша справа!"
 AUS_political_events.77.a_tt:0 "§R[GER.GetNameWithFlag] почав процес аншлюсу нашої країни. Рубікон перетнуто, ми більше нічого не можемо зробити.§!"
 AUS_political_events.80.t:0 "[FROM.GetNameDefCap] ігнорує наш поклик"
 AUS_political_events.86.desc:0 "\nВ знак неповаги до своїх працівників, [FROM.GetLeader] блокує наші зусилля інформувати їх про їхні права в суспільстві. Це явно ворожі дії не лише по відношенню до нас, а й до працівників у всьому світі."
 AUS_political_events.88.a:0 "Привітаємо наших товаришів!"
 AUS_political_events.94.b:0 "За Австрію! За Короля! За Аляску!"
 AUS_rebuild_the_armada_bonus:0 "Відбудова Армади"
 AUS_refine_vaterlandische_front:0 "Новий Вітчизняний Фронт"
 AUS_royal_scientific_grants:0 "Королівські наукові гранти"
 AUS_seek_agreement_for_rearmament_tt:0 "Прохання буде відправлено до §Y[ITA.GetFlag]Італії, [ENG.GetFlag]Британії, [FRA.GetFlag]Франції§! та §Y[USA.GetFlag]США§!, щоби ті могли схвалити або відхилити наш запит. Вибір переозброїтися буде доступний незалежно від їхньої відповіді."
 AUS_seek_papal_support_desc:0 "Як католицька країна ми завжди надавали великого значення слову духовенства. Отримавши підтримку від Його Святості, ми, ймовірно, могли б збільшити віру наших людей у нас."
 AUS_strengthen_the_cabinet:0 "Посилення кабінету"
 AUS_the_right_to_rearm_dem_tt:0 "Ми, як §YДемократична Нація§!, будемо шукати угоди щодо питання переозброєння."
 AUS_the_silesian_question_desc:0 "Сілезькі землі довгий час були частиною нашої величезної імперії. Незважаючи на те, що ці регіони не пов’язані з нашим центром, вони все одно мають для нас дуже велике значення. Ми повинні запросити їх назад."
 AUTONOMY_MASTER_COUNTRY_EFFECT:0 "Володар"
 AUTO_BALANCE_SHIPS_IN_TASK_FORCES_DETACHED:0 "§RНе можна розподілити відділені оперативні групи§!"
 Adrianople:0 "Адріанополь"
 April:0 "квітня"
 BAH_communism_ADJ:0 "Багамськ"
 BALTIC_autobahn_desc:0 "Не важливо, наскільки розвинена промисловість держави [Root.GetNonIdeologyName], якщо інфраструктура країни не сприяє швидкому та постійному припливу робочої сили. Змоделювавши наш інфраструктурний сектор за образом райху, ми зможемо досягти його ефективності."
 BALTIC_events.11.d:0 "Кілька антикомуністичних публікацій потрапили до рук [Root.GetAdjective]их громадян по всій країні. Мета цієї пропаганди — власне [Root.GetLeader], що називається там зрадником і [SOV.GetAdjective]ою маріонеткою. [Root.GetAdjective]ий націоналізм і відкидають міжнародні цінності комуністичної революції. Без сумніву, їхнє таємне поширення вплинуло на зростання націоналізму."
 BALTIC_events.12.d:0 "Вони з'явилися немов з нізвідки, атакувавши кілька великих промзон у державі [forest_brothers_raid_state_target.GetName] і сильно пошкодивши обладнання. На щастя, нальоти проводилися вночі, коли заводи були закриті, але збитки державної власності величезні."
 BALTIC_promote_communism:0 "Соціалістична пропаганда в державі [From.Owner.GetNameDef]"
 BALTIC_renew_allied_trade_desc:0 "[GetBalticRenewAlliedTradeDesc]"
 BALT_claims_no_greater_than_2_tt:0 "§YБалтійські претензії§! — щонайбільше §Y2§!"
 BAL_UNIFIED_neutrality:0 "Балтійська асамблея"
 BAN:0 "Бангладеш"
 BAY_neutrality_ADJ:0 "Баварськ"
 BBA_SWI_annual_election.2.a:0 "Обрати [SWI_GetCouncilor1name]"
 BBA_african_union_events.12.t:0 "Починається процес повної інтеграції"
 BBA_ethiopia_anti_colonialism_events.5.a:0 "[ROOT.GetAdjectiveCap]і та [?global.african_supporting_country.GetName]і сили стоять разом!"
 BBA_ethiopia_communist_events.12.desc:0 "Обіцяне державою [SOV.GetName] обладнання надійшло на наші склади та вже розподіляється серед військ."
 BBA_ethiopia_communist_events.23.a:0 "Перемога для [ITA.GetName]!"
 BBA_ethiopia_communist_events.25.c:0 "Це надто ризиковано."
 BBA_ethiopia_exile_events.10.a:0 "Це дало б нам сильного союзника"
 BBA_ethiopia_exile_events.22.e:0 "Вони можуть мати один з островів [ENG.GetAdjective]."
 BBA_ethiopia_exile_events.47.t:0 "[FROM.GetLeader] відмовляється співпрацювати"
 BBA_ethiopia_fascist_events.06.a:0 "Як прикро."
 BBA_ethiopia_fascist_events.50.b:0 "Ми не потерпимо таке приниження!"
 BBA_ethiopia_fascist_events.64.t:0 "[FROM.GetName] просить контроль над [550.GetName]"
 BBA_ethiopia_fascist_events.69.desc:0 "Керівництво [ETH.GetName] усвідомлює слабкість своїх збройних сил і тому просить нашої підтримки. Вони цікавляться, чи дозволимо ми деяким з наших офіцерів приєднатися до їхнього генерального штабу й надати поради щодо ефективного використання сучасного озброєння."
 BBA_ethiopia_imperial_events.10.t:0 "[FROM.GetNameDefCap] надсилає ультиматум"
 BBA_italo_ethiopian_war_events.100.a:0 "Їм тут раді"
 BBA_italo_ethiopian_war_events.121.t:0 "Перемога!"
 BBA_italo_ethiopian_war_events.303.desc:0 "[ETH.GetAdjevtive]а катастрофа повернула [ITA.GetAdjective]ий народ проти війни. Дедалі більше людей відкрито критикують наш уряд та його керівництво, і навіть чутки про альтернативи йому вже не є рідкістю."
 BBA_italo_ethiopian_war_events.500.desc_territories:0 "Для того, щоби віддати нам частину своїх колоніальних територій, англійці хочуть, щоби ми припинили війну з ефіопами. Якщо ми підпишемо з ними договір, ми мусимо бути готові розлучитися з деякими завойованими нами землями, зберігши при цьому інші. Такий мир, безумовно, буде гіркою пігулкою для обох країн, враховуючи всю пролиту нами кров, піт і сльози."
 BBA_italy_anti_colonialism_events.100.a:0 "Албанський та італійський народи повинні об'єднатися!"
 BBA_italy_anti_colonialism_events.101.t:0 "[FROM.GetNameDefCap] інтегровано в [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.12.b:0 "Це була вимога, а не пропозиція."
 BBA_italy_anti_colonialism_events.21.desc_accepted:0 "Коли ми поставили собі за мету засудити і зруйнувати колоніальні імперії в Африці, ми не були впевнені, як така акція буде зустрінута. Зважаючи на те, з якою впертістю країни можуть триматися за те, що вони вважають своїм, ми повинні вважати наші зусилля успішними. Навіть звільнення одного народу — це велике досягнення!"
 BBA_italy_anti_colonialism_events.53.a:0 "We bid them farewell"
 BBA_italy_anti_colonialism_events.62.t:0 "Близький Схід голосує за вступ до держави [ROOT.GetNameDef]"
 BBA_italy_civil_war.100.a:0 "Передати територію"
 BBA_italy_communist_events.02.b:0 "Це не стосується [ROOT.GetAdjective]их людей."
 BBA_italy_communist_events.08.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 BBA_italy_interaction_events.16.a:0 "Вони не залишають нам вибору"
 BBA_italy_interaction_events.50.a:0 "Спочатку вони повинні підписати мирний договір!"
 BBA_italy_local_rulers.2.d:0 "Ніяких переговорів з місцевими правителями не буде."
 BBA_italy_local_rulers.4.t:0 "$ETH_seyoum_mengesha$ звертається до італійських урядовців"
 BBA_italy_missiolinis.11.a:0 "Ворог буде переможений!"
 BBA_italy_missiolinis.211.t:0 "Посилення вищого військового командування"
 BBA_italy_naval_cooperation_programs.01.desc:0 "Ми отримали пропозицію від [FROM.GetName] приєднатися до програми морського співробітництва з ними. Така програма може бути дуже корисною для нас, але вона буде не менш корисною і для [FROM.GetAdjective]ого флоту."
 BBA_italy_recognize_the_empire.1.a:0 "Визнати Італійську імперію."
 BBA_swiss_expansion.16.c:0 "Нехай спробують завоювати це правом сили!"
 BBA_swiss_expansion.2.a:0 "Ми повинні принести їм справжню демократію"
 BBA_switzerland.11.a:0 "Це найкраще, що ми могли зробити зараз"
 BBA_switzerland.16.a:0 "Вони стануть чудовим союзником"
 BBA_switzerland.17.a:0 "Все заради демократії!"
 BBA_switzerland_fascist.5.desc:0 "Можливо, це обійшлося дорого, але підкорення та вірність, яку ми продемонстрували [FROM.GetNameDef], дали результат. З цього моменту [ROOT.GetNameDef] отримає контроль над територією [?SWI.SWI_requested_territory.GetName] від їхнього імені, і вона буде інтегрована в наші володіння."
 BBA_switzerland_trade.1.a:0 "Їхні фабрики живитимуть нашу воєнну машину"
 BBA_switzerland_trade.11.desc:0 "Ми вже користуємось ринками в [FROM.GetName], щоби обійти торгові бар'єри, пов’язані з політичною ситуацією у світі. Збільшення наших резервів там може ще більше зміцнити економіку, навіть якщо це допоможе і їм."
 BBA_switzerland_trade.12.desc:0 "Цього слід було очікувати. Вони використали маску нейтралітету, щоби вдарити нам у спину. Це матиме серйозні наслідки для нашої економіки — ми маємо відповісти."
 BBA_switzerland_trade.6.a:0 "Чудово!"
 BEL_ambassador_to_london:0 "Посол у Лондоні"
 BEL_artillery_equipment_2:0 "Canon de 75 mle GP III"
 BEL_belgian_maginot_bypass_tt:0 "Не контролює або не може побудувати щонайменше §Y3 наземних укріплень§! в провінціях §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! або §Y[977.GetName]§! на §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! кордоні."
 BEL_burgundy_fascism_DEF:0 "Бургундія"
 BEL_christian_corporatism_desc:0 "Ми з інтересом вивчаємо італійський корпоратизм — концепцію колективних державних трудових організацій, які всі прагнуть до тих самих економічних цілей. Ми маємо намір слідувати цій моделі, але застосувати християнські етики та ідеали для створення чогось більш унікального для Бельгії."
 BEL_construction_investments:0 "Інвестиції в будівництво"
 BEL_german_non_aggression:0 "Німецький пакт про ненапад"
 BEL_gold_reserves_desc:0 "На щастя, [ROOT.GetAdjective] держава має чималий золотий запас. Це забезпечує нам стабільну основу для позик і кредитів у межах нашої країни, хоча ми також можемо вибрати продати наше золото, щоб тимчасово прискорити розвиток та будівництво."
 BEL_independent_neutral_and_loyal:0 "Незалежна, нейтральна та лояльна"
 BEL_intervene_on_side_of_SPR:0 "Втрутитися на боці держави [FROM.GetNameDef]"
 BEL_invite_soviet_tank_makers_desc:0 "Раніше ми завжди покладалися на наших союзників для отримання броньованих одиниць, і навіть попри те, що наші друзі змінили політику, цей підхід залишився. Завдяки нашим дружнім відносинам з Радянським Союзом, ми можемо переконати їх надати нам деякі поради."
 BEL_language_barriers_ns:0 "Мовні бар'єри"
 BEL_military_service_for_all_in_exile:0 "Військова служба для всіх у вигнанні"
 BEL_minister_of_national_defence_deveze:0 "Міністр державної оборони"
 BEL_modify_royal_military_academy_dynamic_modifier_tt:0 "Змінити §Y$BEL_royal_military_academy_dynamic_modifier$§! на:"
 BEL_no_secretaries_general_tt:0 "§YГенеральні секретарі§! будуть видалені як §YЗакон окупації§! у Бельгії"
 BEL_paul-henri_spaak:0 "Поль-Анрі Спаак"
 BEL_prisoner_king:0 "Король у полоні"
