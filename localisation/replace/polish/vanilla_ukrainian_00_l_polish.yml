 HUN_reintigrate_west_banat:0 "Реінтегрувати область [764.GetName]"
 HUN_renounce_the_treaty_of_trianon_desc:0 "Закінчення Великої війни, яке позбавило нашу колись велику державу двох третин земель і населення, не поступається ганьбі Німеччини за підсумками Версальського договору. Ця несправедливість має бути виправлена."
 HUN_tac_bomber_equipment_3_short:0 "RMI-16"
 HUN_the_danubian_federation_decision_tt:0 "([FROM.GetFlag]§Y[FROM.GetNameDef]§!) отримає подію «§Y[ROOT.GetNameDef] запрошує нас у [ROOT.GetFactionName].§!»"
 Hadrianopolis:0 "Адріанополь"
 IAS_neutrality:0 "Істмо-америндська держава"
 ICE_a_monument_to_leif_desc:0 "Незважаючи на поширений південцями міфами про те, що Христофор Колумб був першим європейцем, який відкрив Америку, наш великий предок Лейфюр Ейрікссон, безсумнівно, був першим, хто це зробив. Щоб вшанувати його пам'ять, ми мусимо встановити пам'ятник, присвячений його у Вінландії, коли ми завоюємо землі собі."
 ICE_agricultural_expansion_desc:0 "Для модернізації ісландського сільського господарства можна зробити багато вдосконалень. Використовуючи переваги сучасних технологій та легкодоступне опалення за рахунок природних гарячих джерел, можна збільшити виробництво сільськогосподарської продукції, а також вивільнити землю та працівників для інших цілей."
 ICE_expand_the_civilian_fleet:0 "Розширити цивільний флот"
 ICE_fascism_DEF:0 "Ісландсвелді"
 ICE_fighting_as_equals_tt:0 "§Y[ROOT.getName]§! оголошує незалежність"
 ICE_hrafninn_flygur_desc:0 "Як круки, ми будемо правити небом. Ісландія буде асоціюватися з авіабудуванням та провідними авіаційними технологіями — в усьому світі."
 ICE_mine_iceland_desc:0 "З точки зору військово-морських шляхів Ісландія є критично вразливою в усіх напрямках, окрім північного. Щоб належним чином забезпечити безпеку людей на нашому острові, ми повинні бути готові до інтенсивного мінування ісландських вод у разі відкритого конфлікту."
 ICE_state_owned_enterprises_desc:0 "Тепер, коли наш острів може більш повноцінно забезпечувати себе самостійно, настав час подумати про створення виробництв, які могли б залучити робітників і поліпшити економіку, а також ефективність державного апарату."
 ICE_the_might_of_thor_desc:0 "Тор — Бог грому, сили та захисту людства. Володіючи своїм молотом Мйольніром, він вдарив по хмарах, щоб викликати бурю, і наша армія вдарить той самий грім і страх у наших супротивників!"
 IMPORT_EQUIPMENT_DESIGN_WRONG_DESIGNER_DESC:0 "Ці дизайни не призначені для $DESIGNER|Y$. Відкрийте відповідний конструктор та імпортуйте знову:"
