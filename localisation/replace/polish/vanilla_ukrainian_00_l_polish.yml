 DEN_christian_x:0 "Крістіан X"
 DEN_create_danforce_desc:0 "[?DEN.DEN_overlord_nation.GetNameDefCap] заборонила нам мати достатньо велику армію, щоб реально загрожувати їхньому пануванню. Натомість ми повинні шукати деінде вільну і дружню націю, яка б тренувала і постачала сили, здатні взяти участь у звільненні [DEN.GetNameDef] від гноблення."
 DEN_dano_german_military_cooperation_desc:0 "Для того, щоб розвинути наші збройні сили до рівня, необхідного для досягнення наших цілей, нам може бути важливо звернутися до наших колег з [GER.GetNameDef] і попросити про військову і технологічну співпрацю. З цією пропозицією майбутнє, яке ми бачимо для [DEN.GetNameDef], стане ближчим до того, щоб стати реальністю."
 DEN_demand_icelandic_territory:0 "Вимогти [ICE.GetFlag][Ice.GetAdjective]і території"
