 sp_naval_nuclear_missile_submarine_unique_reward_a_desc:0 "Якщо інформація про наш планований ядерний удар дійде до противників, вони розпочнуть масштабне полювання на наші атомні підводні ракетоносці. Аби сховатися від переслідувачів, ми мусимо..."
