 INFLUENCE_SORT:0 "Вплив"
 INSHOL_artillerie_inrichtingen_desc:0 "Artillerie Inrichtingen виробляє артилерію та іншу зброю в Нідерландах уже понад 250 років і працює в Ост-Індії вже кілька десятиліть. Розширення їхніх виробничих потужностей шляхом відкриття нових виробничих об'єктів в Ост-Індії значно покращило б можливості KNIL, одночасно зміцнюючи економіку недофінансованих регіонів шляхом створення нових робочих місць."
 INSHOL_development_loans_netherlands:0 "Кредити на розвиток від Нідерландів"
 INSHOL_end_to_bloodshed:0 "Рішення про дві держави"
 INSHOL_establish_the_princely_council:0 "Створити Раду князів"
 INSHOL_indonesian_cheap_labor:0 "Дешева індонезійська робоча сила"
 INSHOL_indonesian_cheap_labor_desc:0 "$CONGO_cheap_labor_desc$"
 INSHOL_naval_program:0 "Нідерландсько-Індонезійська військово-морська програма"
 INSHOL_netherlands_indonesia_union:0 "Нідерландсько-Індонезійська унія"
 INSHOL_no_compromise_desc:0 "Голландська жадібність, яка змусила їх інвестувати майже виключно в Яву, ігноруючи східні острови, залишила Яву ахіллесовою п'ятою всієї колонії. Це стане їхнім крахом!"
 INSHOL_recall_gerardus_johannes_berenschot:0 "Відкликати генерала Береншота"
 INSHOL_request_ceylon_desc:0 "Британська колонія Цейлон має глибокі культурні та мовні зв'язки з ширшим малайським світом. Оскільки паномалайська федерація Мафіліндо зростає, цілком природно, що і цей острів повинен знайти своє місце в межах конфедерації."
 INSHOL_request_east_timor_desc:0 "Тимор не має права бути окупованим Португалією, це пережиток колоніальної історії, який ми не повинні більше терпіти, бо це законна індонезійська територія. Ми висунемо формальну вимогу Португалії негайно повернути нам Тимор."
 INSHOL_subsidize_bauxite:0 "Субсидування бокситових проєктів"
 INSHOL_the_war_in_europe_desc:0 "Конфлікт в Європі швидко загострюється, і Нідерланди тепер у стані війни. Ми більше не можемо покладатися на їхній захист і повинні твердо стояти на своєму, інакше ризикуємо бути захопленими іноземними державами."
 INS_anti_tank_equipment_2:0 "Solothurn S-18/1000"
 INS_armored_car_equipment_1:0 "Alvis-Straussler AC3D"
 INS_bangka_bauxite_export:0 "Експорт бокситів з Банки"
 INS_chaos_events.2.t:0 "Соціалістичні партії об'єднуються"
 INS_communist_events.3.a:0 "Велика перемога для трудящих усього світу."
 INS_communist_events.9.desc:0 "Оперативники [FROM.GetAdjective] були помічені в компанії відомих агітаторів і лідерів бойовиків по всій країні. Студентські організатори, які колись роздавали листівки на кутках вулиць, тепер проводять зустрічі за закритими дверима з людьми, що мають дипломатичні документи [FROM.GetAdjective]. Заборонені видання друкуються швидше, ніж поліція встигає їх конфіскувати, а протести, які колись згасали за один день, тепер зупиняють роботу цілих районів на дні. Ці комуністи щодня вчаться організовуватися в більші групи, якщо ми не діятимемо швидко, ми можемо втратити над ними контроль."
 INS_deescalate_the_conflict:0 "Запросити міжнародне посередництво"
 INS_direct_rule_desc:0 "Система Форстенланден, яка надавала князівствам самоврядування, додала труднощів у адмініструванні, вимагаючи додаткової бюрократії та марнуючи час. Настав час взагалі скасувати цю систему та запровадити пряме правління на всьому архіпелазі."
 INS_dutch_investment_rate_30:0 "§YНідерланди§! з імовірністю на §G30%§! більшою обиратимуть фокуси зі спільного дерева"
 INS_escalation_has_less_3_tt:0 "Рівень ескалації нижчий за §Y3§!"
 INS_has_revolutionary_hq:0 "Створено революційний штаб"
 INS_heavy_tank_equipment_3_short:0 "ZT-III"
 INS_indonesian_assault_doctrine_desc:0 "Солдати — це ще не все на війні. Мільйон людей нічого не варті, якщо у них немає зброї, якою можна битися. Ми маємо надати пріоритет отриманню високоякісної артилерії, щоб просуватися глибше на контрольовану ворогом територію."
 INS_infantry_equipment_1:0 "M1 Garand"
 INS_infiltrate_the_media:0 "Проникнення в ЗМІ"
 INS_is_noncore_but_indonesian_trigger_tt_NOT:0 "Є ненаціональним індонезійським регіоном"
 INS_japanese_resource_infrastructure_desc:0 "Передача контролю над нашою основною інфраструктурою видобутку ресурсів [JAP.GetNameDef] є необхідним кроком до перемоги у війні, оскільки найвищим пріоритетом є те, щоб підрозділи [JAP.GetAdjective] залишалися повністю забезпеченими в будь-який час. [JAP.GetNameDefCap] також розвиватиме нашу місцеву інфраструктуру з метою підвищення ефективності експорту ресурсів."
 INS_light_tank_equipment_3:0 "Pantservoertuig 5"
 INS_limited_war_events.6.a:0 "Запропонуйте їм умови."
 INS_loyalist_events.32.desc:0 "Референдум [PHI.GetAdjective] завершився на нашу користь. Їхній уряд прийняв результат і розпочав контакти з нашим міністерством закордонних справ для організації передачі повноважень."
 INS_loyalist_events.4.a:0 "Ми приймаємо пропозицію."
 INS_netherlands_can_remove_autonomy_tt_200:0 "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -200.00§!"
 INS_political_events.18.desc:0 "Тан Малака, індонезійський комуніст, який служив ці останні роки як довірений радник нашого уряду, оголосив про свій негайний від'їзд. Оскільки [INS.GetNameDef] тепер є вільною республікою, він має намір нарешті повернутися до країни, на яку він востаннє ступав як утікач більше двох десятиліть тому. Він дякує нам за наданий йому притулок і свободу продовжувати свою роботу, і каже лише, що його місце тепер вдома."
 INS_political_events.3.a:0 "Чудово!"
 INS_prime_minister_hatta_desc:0 "Мохаммад Хатта, відомий як проголошувач революції, служив віцепрезидентом при Сукарно і, як правило, був більш демократично налаштованим з них двох. Він стане підходящим Прем'єр-міністром, на якого зможе погодитися більшість політичних партій."
 INS_prioritize_dutch_companies:0 "Пріоритет голландських компаній"
 INS_realign_supply_chains_desc:0 "Хоча протекціонізм часів Великої депресії слабшає, зростання виробництва та переоцінений гульден залишили голландський експортний ринок у руїнах, оскільки наші старі торговельні партнери на заході звернулися до Південної Америки для задоволення свого попиту. Ми повинні вжити заходів, щоб переконати наших союзників знову почати торгувати з нами."
 INS_reform_education_system_desc:0 "Революція довела, що студенти та молодь, незадоволені соціальним устроєм, завжди очолюватимуть повстання. Задля безпеки нашого уряду та нації ми вимагатимемо, щоб у школах викладали відповідно до нашої урядової ідеології."
 INS_republic_add_generals_tt:0 "§Y$INS_sudirman$§![INS.GetFlag], §Y$INS_soengkono$§![INS.GetFlag], §Y$INS_supriyadi$§![INS.GetFlag], §Y$INS_djatikoesoemo$§![INS.GetFlag], §Y$INS_maludin_simbolan$§![INS.GetFlag] стає генералом."
 INS_republic_national_party:0 "НПІ"
 INS_revolution_events.9.a:0 "Неприйнятно!"
 INS_revolution_penalty_reduce_tt_2:0 "§RШтрафи будуть зняті, якщо ми почекаємо до §Y8§! рівня ескалації.§!§!"
 INS_revolution_planning_hq_tt:0 "Побудовано не більше §Y3§! революційних штабів"
 INS_secularism_desc:0 "Індонезія є домом для багатьох людей різних релігій. Змішування релігії та політики призведе лише до внутрішніх конфліктів, тому ми маємо заборонити релігійні політичні партії."
 INS_start_limited_war_malaya:0 "Розпочати обмежену війну в Малаї"
 INS_sukarno:0 "Сукарно"
 INS_sumatra_railway:0 "Суматранська залізниця"
 INS_the_bangka_project:0 "Проєкт Банка"
 INS_the_bangka_project_desc:0 "Острови Банка-Белітунг, хоч і малі, є наріжним каменем індонезійської економіки завдяки покладам бокситів на островах. Нам необхідно побудувати дороги, порти та залізниці на Банка-Белітунгу, щоб ми могли повною мірою скористатися багатими мінеральними ресурсами островів."
 INS_transport_plane_equipment_2_short:0 "Lodestar"
 INS_union_events.7.a:0 "Навряд чи це все одно б спрацювало."
 INS_union_events.8.desc:0 "Світові зрозуміло, що війна складається не на нашу користь. [HOL.GetNameDef] впали, і їхня база операцій перемістилася на схід. Лідери [HOL.GetAdjective] надіслали нам пропозицію сформувати спільну союзну державу на чолі з королевою Вільгельміною, щоб гарантувати максимально можливу співпрацю. Хоча, здається, ніхто не в захваті від цієї пропозиції, це може бути нашим ключем до виживання."
 INS_volksraad_events.71.t:0 "Червоно-білий прапор більше не є нелегальним для демонстрації!"
