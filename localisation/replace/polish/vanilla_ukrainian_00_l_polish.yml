 hq_light_armor_desc:0 "Бронетанкові батальйони дозволяють штабному підрозділу швидше пересуватися полем бою та довше виживати в бою, якщо цього вимагатимуть обставини."
 iceland_events.23.desc:0 "[ICE.GetLeader] відкрито оголошує, що [ICE.GetNameDef] відтепер є захисником Північного моря. [ICE.GetNameDefCap] з цього моменту стає гарантом безпеки мешканців островів Північного моря.\nТому, як заявляє [ICE.GetLeader], буде краще, якщо [ROOT.GetNameDef] передасть контроль над нашими володіннями в Північному морі державі [ICE.GetName]."
