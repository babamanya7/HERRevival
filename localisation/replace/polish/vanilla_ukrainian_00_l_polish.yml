 GUAY_workers_rights_desc:0 "Робітники, які живуть довше і є щасливішими, також працюють старанніше. Впровадження прав робітників є безпрограшним варіантом як для здоров'я нації, так і для її економіки."
 GUA_fascism_DEF:0 "Гватемальська корпоративна держава"
 GXC_CAS_equipment_3_short:0 "Type 24"
 GXC_formation_of_the_nraja_desc:0 "Ми знову переконалися, що у нас немає іншого вибору, окрім як організувати збройний опір і йти на Нанкін, якщо ми хочемо завадити японцям повільно захопити нашу землю. Тому ми повинні сформувати Національно-революційну антияпонську армію (НРАЯ) і підготуватися до походу проти Хунані."
