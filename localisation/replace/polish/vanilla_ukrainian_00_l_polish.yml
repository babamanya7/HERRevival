 CHL_political_events.84.a:0 "На цьому етапі він може бути нашою єдиною надією..."
 CHL_political_events.86.desc:0 "[FROM.GetLeader], суверенний король [FROM.GetNameDef] та громадянин Французької держави, попросив, щоб ми об'єдналися та допомагали одне одному в поширенні французької гегемонії по всьому світу. Що ми скажемо?"
 CHL_political_events.97.desc:0 "З коронацією нашого короля деякі люди в країні здаються незадоволеними, і сформувався народний опір. Водночас ветерани Легіону масово прибувають до нашої країни, щоб запропонувати свою допомогу нашому новоствореному уряду."
 CHL_popular_resistance_desc:0 "У країні досі є багато людей, які не вірять у силу Його Світлості короля Антуана Бернара. З ними потрібно негайно розквитатися!"
 CHL_promote_pan_hispanic_rhetoric_desc:0 "Ми всі особистості. Але, незважаючи на це, ми об'єднані духом і кров'ю як гіспанський народ, і настав час заявити про наше право за народженням і повалити всяких імперіалістів, які намагаються тримати наш народ роз'єднаним."
 CHL_ruler_of_the_inca:0 "Цар інків"
 CHL_ship_medium_battery_4:0 "20.3-см/50 Auto-Load."
 CHL_strengthen_the_central_bank:0 "Зміцнити Центральний банк"
 CHL_taking_back_patagonia_kingdom_desc:0 "Незважаючи на те, що ми проголосили себе новим Королівством Арауканія та Патагонія, насправді нам досі бракує значної частини королівства, а саме Патагонії. Ми мусимо прагнути якнайшвидше возз'єднати королівство, щоби не втратити ту невелику легітимність, яку ми маємо."
 CHL_unified_in_spirit_desc:0 "Оскільки ми всі маємо спільну мету, ми можемо добре працювати разом, як добре змащений механізм. Тому слід зазначити, що ми мусимо, не об'єднуючи наші нації в одне ціле, все ж прагнути до об'єднаних збройних сил і кращої координації. Народи Америки і Тихоокеанського регіону єдині духом і завжди будуть стояти пліч-о-пліч!"
 CHL_work_towards_laissex_faire_desc:0 "Кінцевою метою ліберального уряду є досягнення економіки laissez-faire, а отже, все, що в наших силах, має бути зроблено для досягнення цієї мети."
