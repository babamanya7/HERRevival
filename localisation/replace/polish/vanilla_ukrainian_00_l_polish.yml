 germany.102.a:0 "Вони мали б здогадатися, яка в нас альтернатива."
 germany.104.e:0 "Сильний союзник — сильна Німеччина."
 germany.1041.desc:0 "Попри недавню напруженість на чеському кордоні, [FROM.GetAdjective]а зовнішня політика залишається непохитною. [FROM.GetAdjective]і дипломати пред'явили нам ультиматум — передати Судетську область, а інакше буде оголошена війна."
 germany.107.d:0 "Учора заступник фюрера Рудольф Гесс був заарештований солдатами Місцевої оборони в Шотландії після того, як він з парашутом вистрибнув із важкого винищувача. Гесс — досвідчений пілот, і він, судячи з усього, сам перелетів Північне море, намагаючись лишатися поза радіусом дії радарів, перш ніж вирушити на захід, у Британію.\nГесс, схоже, сам узяв на себе спробу обговорення миру між Британією та Німеччиною, однак Берлін публічно назвав його божевільним, і позбавив його всіх політичних посад. Британська ж влада втрималася від коментарів."
 germany.115.a:0 "Ця угода таки була взаємовигідною."
 germany.121.d:0 "Як було обумовлено в Ялтинській конференції, Німеччина має бути поділена на дві окремі держави, кожна у сфері впливу одної з воюючих сторін.\n\nСподіватимемося, це закінчить конфлікти в Європі."
 germany.126.d:0 "Неспокій і акти насильства розгорнулися в Австрії: протестувальники висловлюють бажання включити Австрію до складу Німеччини. І це враховуючи внутрішні конфлікти, які вже переживає наша країна. Берлін активно просуває аншлюс Австрії, і це, ймовірно, наш єдиний шанс зберегти австрійські цінності."
 germany.16.d:0 "[From.GetNonIdeologyName] відмовилася ділити з нами Польщу, відкрито порушивши пакт Молотова–Ріббентропа! Ця зрада дозволила нам розірвати договір з ними!"
 germany.23.a:0 "Уперті дурні."
 germany.29.a:0 "Нам треба підготуватися до військового втручання."
