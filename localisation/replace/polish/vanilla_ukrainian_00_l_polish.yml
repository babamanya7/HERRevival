 HOA_construct_great_monuments_desc:0 "[ROOT.GetAdjectiveCap]ому народові є чим пишатися. Ми маємо давню історію, яку варто вшанувати пам'ятниками, які надихають на прагнення до все більших висот."
 HOA_jagged_alliance_idea:0 "Безпека — в альянсах"
 HOA_political_stability_desc:0 "Ми не можемо сподіватися залишитися незалежною нацією, якщо ми роз'єднані вдома. Лише створивши єдиний фронт, ми зможемо протистояти тому, щоби нас не знесли вітри змін, які зараз охоплюють світ."
 HOA_secure_the_ogaden:0 "Забезпечити Огаден"
 HOA_secure_the_ogaden_desc:0 "Захист Огадену створить низку природних бар'єрів між нами й абиякими можливими агресорами, а також відкриє нашу економіку для торгівлі через Індійський океан."
