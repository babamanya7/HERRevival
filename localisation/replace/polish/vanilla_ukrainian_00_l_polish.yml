 NZL_scrap_metal_recycling_desc:0 "Економіка з високою часткою імпорту, як наша, не може дозволити собі марнотратно ставитися до стратегічних ресурсів. Щоб зміцнити нашу економічну стійкість, ми створимо підприємства з переробки брухту для переробки та повторного використання металів і гуми."
