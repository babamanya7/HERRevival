 war_justification.1.t:0 "[ROOT.GetLeader] висловлюється проти держави [From.GetName]"
 war_justification.207.d:0 "«Товариші, хоча найбільших революціонерів колись називали зрадниками, тепер стало очевидним, що зрадили саму революцію. Як інакше пояснити правління [ROOT.GetRulingParty] з [ROOT.GetName], які відкинули будь-який натяк на марксистські ідеї, щоб побудувати вироджену робітничу державу, де вони зможуть панувати на фальшивих підставах? Зміцнюючи власну владу ціною міжнародної революції, вони показали, що їх мало хвилюють ідеали, які вони нібито сповідують. Ми повинні принести їм справжню революцію».\n\nХоча спочатку підтримуючи перемогу [ROOT.GetRulingParty] в [ROOT.Capital.GetName], [From.GetLeader] відійшов від філософії [ROOT.GetLeader]. Конфлікт загострився до такої міри, що вони готуються до вторгнення, щоб нав'язати нам свій варіант соціалізму."
