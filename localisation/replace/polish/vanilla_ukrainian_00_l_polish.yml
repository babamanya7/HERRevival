 FRA_reconciliation_desc:0 "У минулому французькі революції занадто часто кидали країну в нескінченні судоми революційного та контрреволюційного терору. Можливо, настав час будувати республіку, в якій кожен має своє місце, підтримав він революцію чи ні."
