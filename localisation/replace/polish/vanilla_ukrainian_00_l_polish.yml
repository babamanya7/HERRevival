 ENG_ally_the_south_african_imperialist_uprising_desc:0 "Ми не кинемо наших південноафриканських лоялістів напризволяще. Вони отримають від нас військову допомогу, а після перемоги у війні — наш захист і заступництво."
 ENG_anti_tank_equipment_1:0 "QF 2-pounder"
 ENG_battleship_3:0 "Клас «Lion»"
 ENG_carrier_2:0 "Клас «Ark Royal»"
 ENG_continuation_of_politics_desc:0 "Ми з легкістю заручилися народною підтримкою для втручання у справи ключових країн, політичний курс яких відрізняється від нашого. Потрібно використати цю перевагу."
 ENG_decolonized:0 "Британія провела деколонізацію"
 ENG_destroyer_3:0 "Клас «J»/«K»/«N»"
 ENG_expose_the_belly_of_the_bear_desc:0 "Битися з Радянським Союзом без узбережних плацдармів — це неймовірний виклик. Ми виможемо прохід крізь держави [PER.GetName] та [AFG.GetName] і вдаримо по Радянському Союзі там, де вони найменше очікують: суходолом та в їхнє оголене черево."
 ENG_imperial_federation_india_unified_neutrality_ADJ:0 "Імперськ"
 ENG_imperial_federation_india_unified_neutrality_DEF:0 "Імперська федерація"
 ENG_imperialist_australia_fascism:0 "Імперіалістична Австралія"
 ENG_impose_martial_law_on_south_africa:0 "Увести воєнний стан у Південній Африці"
 ENG_impose_martial_law_on_south_africa_desc:0 "Народ Південної Африки введений в оману, і його потрібно захистити від самого себе. Ми відкриємо йому очі і візьмемо владу до своїх рук."
 ENG_infantry_at:0 "Boys Anti-Tank Rifle"
 ENG_infantry_equipment_2:0 "Sten Mk II"
 ENG_mechanized_equipment_3:0 "Churchill Kangaroo"
 ENG_medium_tank_equipment_3_short:0 "Comet"
 ENG_propaganda_campaigns_in_canada_desc:0 "Ми запустимо потужну кампанію пропаганди, щоби розповісти народу Канади про некомпетентність його уряду та необхідність керівної ролі Британії."
 ENG_reconciliatory_speech_desc:0 "Можливо, примирлива промова — саме те, що потрібно, щоби знизити політичну напруженість, яка зростає всередині країни."
 ENG_renew_support_for_imperialist_coup_in_australia:0 "Підсилити підтримку повстання в Австралії"
 ENG_request_trade_union_dockyard_worker_support:0 "Звернутися до профспілок за підтримкою працівників верфей"
 ENG_request_trade_union_factory_worker_support:0 "Звернутися до профспілок за допомогою заводських робітників"
 ENG_self_government_for_the_americas:0 "Самоврядування в Америці"
 ENG_socialist_science_pool:0 "Соціалістичний науковий фонд"
 ENG_support_imperialist_coup_in_south_africa_mission_2_tt:0 "Посилена підтримка повстання.\n"
 ENG_support_imperialist_coup_mission_2_tt:0 "Повстання приречене на провал.\n"
 ENG_the_british_path_to_fascism:0 "Британський шлях до фашизму"
 ENG_the_british_path_to_fascism_desc:0 "Наш шлях до фашизму буде власним, і ми не станемо на коліно перед тими на континенті, хто вважає себе нашими ідеологічними зверхниками. Люди пам'ятають минулу війну, і будь-яка співпраця з режимом, що існує в державі [GER.GetName], обов'язково накличе на себе їхній гнів."
 ENG_the_sun_never_sets_tt:0 "Ці бонуси будуть застосовані до всіх новодосліджених типів кораблів.\n"
