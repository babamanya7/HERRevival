 MTG_abandon_treaty_democratic_desc:0 "Спроба стримати гонку морських озброєнь провалилася. Нам потрібен дозвіл на переозброєння, щоби ми могли протистояти майбутнім загрозам."
 MTG_abandon_treaty_fascist:0 "Відмовитися від морських договорів"
 MTG_naval_treaty.5.desc:0 "Наша тверда заява [From.GetAdjective] уряду, очевидно, мала бажаний ефект. Після довгої ночі внутрішніх колівань наш посол отримав запевнення від лідера держави. що кабінет схвалив зниження витрат на флот і що пустити на брухт частину основних кораблів, а в майбутньому стане фінансувати лише заміну зношених кораблів."
 MTG_naval_treaty.9.t:0 "Підписано другу Лондонську морську угоду"
 MUN_czech.1004.b:0 "Давайте залишимося осторонь"
 MUN_czech.1009.d:0 "Дипломати з [FROM.GetNameDef] повідомили, що ми були б бажаними гостями в їхньому альянсі. Однак у минулому наші територіальні претензії були каменем спотикання у відносинах з [FROM.GetNameDef]. Тепер ми повинні вирішити, чи продовжувати наполягати на цих претензіях, чи зосередитися на встановленні більш дружніх відносин."
 MUN_czech.1013.b:0 "Ми намагаємося захистити власну територію!"
 MUN_czech.1020.t:0 "[FROM.GetName] пропонує інвестиції на умовах"
 MUN_czech.1025.d.1:0 "[ROOT.GetAdjective]і війська, відправлені до [CZE_supported_spanish_faction.GetName], повертаються додому після того, як допомогли їм здобути перемогу. Бойові дії дали новий досвід нашим військам, і особливо медичним загонам."
 MUN_czech.1034.d:0 "Через наші поступки націоналістичним настроям інших груп, члени Словацької народної партії сформували власне воєнізоване формування, яке тепер прагне незалежності або принаймні автономії для Словаччини. Тепер постає питання: чи варто зосередитися на збереженні видимості єдності, запобігаючи цьому, чи досягти її, дозволивши це і зосередившись на землях, які залишаються лояльними до уряду."
 MUN_czech.1037.b:0 "Це нічого не змінює"
 MUN_czech.1051.a:0 "Ми повинні посилити нашого ключового [FROM.GetAdjective]ого союзника"
 MUN_czech_bop.3.a:0 "Подивимося, до чого це призведе."
