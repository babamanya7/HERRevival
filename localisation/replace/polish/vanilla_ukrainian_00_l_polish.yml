 idea_GUAY_volunteers:0 "[THIS.GetAdjectiveCap]і загони добровольців"
 idea_PAR_loyal_military:0 "Лояльна армія"
 idea_RAJ_flames_of_the_revolution_desc:0 "Старий порядок розвалився під тягарем власного занепаду. З попелу колоніального правління постає нова Індія, створена не в палацах чи парламентах, а на полях, фабриках і в полум’ї революції. Проте жарини класової війни все ще палають... і не всі, хто носить червоний, роблять це добровільно."
 idea_RAJ_independence_movement_tt:0 "Модифікує §Y$idea_RAJ_independence_movement$§!\nЕфективна зміна:"
 idea_RAJ_sikh_approval_1:0 "$idea_RAJ_sikh_approval$"
 idea_RAJ_upset_congress_leaders:0 "Незадоволені лідери Конгресу"
 idea_SIA_civilian_full_support:0 "Цивільне крило: §GПовна підтримка§!"
 idea_SIA_military_full_support_desc:0 "Військове крило твердо стоїть за урядом. Офіцери підтримують кампанії з призову та виробництво зброї, спрямовуючи ресурси армії на національні цілі."
 idea_SIA_military_neutral_desc:0 "Військове крило не зайняло жодної позиції. Армія виконує свої обов'язки без ентузіазму чи опору, чекаючи на розвиток подій."
 idea_SIA_military_wing_unrest_desc:0 "Терпіння офіцерів знову увірвалося. Зазнавши невдачі у спробі захопити владу напряму, військове крило тепер виливає свою лють через саботаж, дезертирство та повну відмову від співпраці. Бойова міць армії тане, поки бунтівників не приструнять."
 idea_SIA_oss_special_forces_training_desc:0 "Наші агенти тренувалися разом з OSS у сфері диверсій, інфільтрації та повітряно-десантних операцій. Отримані уроки перетворили наші спеціальні сили на грізну зброю."
 idea_SIA_overheated_economy_desc:0 "Економіка вийшла за межі своїх природних можливостей. Споживчий попит випередив потужності, а будівельний бум зупинився, поки ситуація не охолоне."
 idea_SIA_the_sacred_hierarchy:0 "Священна ієрархія"
