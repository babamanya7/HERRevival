 JAP_the_co_prosperity_sphere_decisions_desc:0 "Нашa кінцева мета контролю над Азією стає все ближчою, і, формуючи паназійський союз, ми можемо зміцнити зв'язки між різними націями, які прагнемо взяти під своє крило. Ми повинні зробити все, що в наших силах, щоб втілити цю мрію в реальність."
