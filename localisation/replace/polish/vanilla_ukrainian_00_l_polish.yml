 URG_american_air_bases:0 "Американські авіабази"
 URG_american_air_bases_desc:0 "Америка тисне на нас, щоб ми дозволили їм створити авіабази на нашій території. Це, безумовно, допоможе нам захистити себе від будь-якої загрози Осі."
 URG_augustus_caesar_bado:0 "Август Цезар Бадо"
 URG_declare_neutrality_desc:0 "Ми не повинні втручатися у європейські справи."
 URG_destroyer_1:0 "Клас «Uruguay»"
 URG_food_for_the_warmachine_desc:0 "Оскільки більша частина сільськогосподарських угідь знаходиться під нашим контролем, ми можемо почати відправляти продовольство нашим союзникам, посилюючи нашу владу."
 URG_greater_uruguay_DEF:0 "Великий Уругвай"
 URG_mercado_modelo_desc:0 "Настав час залишити старий сільськогосподарський ринок позаду та відкрити Mercado Modelo, найбільший сільськогосподарський ринок у країні."
 URG_rapid_industrialization:0 "Швидка індустріалізація"
 URG_terra_election:0 "Вибори 1938 року відбулися"
 USA_CSA_fascism_ADJ:0 "Американськ"
 USA_agricultural_adjustment_act_desc:0 "Депресія найсильніше вдарила по наших фермерів. Ми мусимо простежити, щоби ті, хто забезпечує нас продуктами, не розорилися, ставши жертвами неконтрольованого ринку."
 USA_america_first_desc:0 "Дехто хоче, щоби ми витрачали наші багатства і проливали кров наших молодих бійців у війнах за кордоном. Не можна піддаватися на прийоми розпалювачів війни. Ми мусимо дотримуватися простої максими: «Америка перш за все, а решта — потім»."
 USA_amphibious_tank_equipment_1:0 "LVT-1(A)"
 USA_battleship_1:0 "Клас «New York»"
 USA_defense_of_the_pacific_desc:0 "З японським урядом неможливо домовитися. Його політика експансії є загрозою як для нас, так і для наших азійських сусідів. Америка повинна взяти цю країну під свій контроль, щоб реформувати її та навчити не допускати колишніх помилок."
 USA_edward_brooks:0 "Едвард Брукс"
 USA_electric_boat_company_organization:0 "$electric_boat_company$"
 USA_end_monarchism_desc:0 "Європейські монархії вже вкинули світ у вир чергової великої війни, і ми не допустимо, щоб це повторилося знову. Наші батьки-засновники оголосили війну британському королю, щоби здобути свободу, а ми навіки звільнимо всю планету від його ти!"
 USA_fascism_subject:0 "$OVERLORDADJ$ий протекторат Америка"
 USA_guns_for_the_anti_fascist_war:0 "Зброя для антифашистської війни"
 USA_harold_rainsford_stark:0 "Гаролд Рейнсфорд Старк"
 USA_light_cruiser_2:0 "Клас «Brooklyn»"
 USA_light_tank_destroyer_equipment_1_short:0 "M6 GMC"
 USA_louisiana_maneuvers:0 "Маневри в Луїзіані"
 USA_military_construction:0 "Військове будівництво"
 USA_office_of_scientific_research_and_development_desc:0 "Насувається війна, і ми мусимо прискорити темпи наукових досліджень, щоби не виявитися безпорадними перед будь-яким можливим супротивником."
 USA_old_age_pension_act_desc:0 "Наші громадяни, які пропрацювали все життя, мусять тішитися повагою та стійким фінансовим становищем у старості. Існуючих законів явно недостатньо для підтримки пенсіонерів."
 USA_protest_molotov_ribbentrop:0 "Висловити протест проти пакту Молотова–Ріббентропа"
 USA_super_heavy_tank_equipment_1_short:0 "T95"
 USA_transport_plane_equipment_2:0 "Douglas DC-3"
 USA_unrestricted_submarine_warfare_desc:0 "Історія показує, що будь-який договір, що накладає обмеження на підводні війни, з якими б добрими намірами його не уклали, не варто паперу, на якому він надрукований. Нам не варто пов'язувати себе зобов'язаннями, на які наші вороги обов'язково наплюють."
