 CZE_divided_nation_event_onbroad_tt:0 "Розблоковано §Yрішення§!, які дозволяють нам §Yвидалити§! негативні §Yмодифікатори регіону§! у наших національних регіонах.\n\nВиконання цих §Yрішень§! також зменшить негативні модифікатори національного духу §Y$CZE_a_divided_nation_dynamic_modifier$§!, поки його не буде §Yвидалено§!."
