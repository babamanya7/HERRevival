 JAP_end_the_interservice_rivalry_desc:0 "Наші перемоги доводять, що наша нація здатна стати світовою державою, тому суперечки за ресурси між нашими внутрішніми фракціями здаються все більш недоречними. Настав час покласти край цьому розколу, який занадто довго розділяв наші інтереси, і забезпечити [ROOT.GetAdjective]е домінування над Азією на століття вперед."
