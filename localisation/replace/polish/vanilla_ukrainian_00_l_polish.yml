 mtg_britain.1.b:0 "Домовитися на морганатичному шлюбі."
 mtg_britain.102.t:0 "Імперська конференція: федерація — [From.GetName] відмовляється"
 mtg_britain.106.a:0 "Вони бояться нас."
 mtg_britain.17.a:0 "Виймемо максимальну вигоду з їхньої допомоги."
 mtg_britain.2.t:0 "Формування підтримки Едуарда VIII"
 mtg_britain.22.d:0 "Своїм вотумом недовіри Палата громад сьогодні дала чітко зрозуміти, що втратила віру в нинішній уряд. Подавши королю прохання про відставку, [Root.GetLeader] як можливий спадкоємець висунув кандидатуру Вінстона Черчилла.\n\n що новий прем'єр-міністр відійде від суперечливої політики умиротворення та, можливо, навіть відповість на подальші виклики військовою силою."
 mtg_britain.27.a:0 "Яка чудова ідея!"
 mtg_britain.2_tt:0 "Буде продовжено підготовку до весілля.\n"
 mtg_britain.32.d:0 "[From.GetAdjective] представники повідомляють нам, що вони офіційно відкидають нашу пропозицію укласти договір про невтручання. Якщо вони мають намір переслідувати свої інтереси, нам слід виявляти обережність..."
 mtg_britain.45.d:0 "Тепер, коли в країні твердо зміцнився комунізм, необхідно перерозподілити майно її громадян. У представників вищих класів слід... вирвати з рота срібні ложки, з якими вони народилися."
 mtg_britain.54.d:0 "[From.GetNameDefCap] відхиляє наш запит про вступ до Комінтерну. Ми залишимося самі."
 mtg_britain.64.d:0 "[From.GetAdjective] уряд почав вести велику ідеологічну пропаганду, використовуючи воєнний стан для придушення засобів масової інформації."
 mtg_britain.72.t:0 "Безлади в Північній Індії"
 mtg_britain.75.t:0 "[RAJ.GetName] визнає нашу незалежність"
 mtg_britain.76.b:0 "Це безглуздо. Ми мусимо визнати їхню незалежність."
 mtg_britain.81.d:0 "Представники держави [From.GetNameDefCap] відкинули наші вимоги. «Якщо вони хочуть від нас послуху, нехай спробують вирвати його з наших сердець силою!» — такою була їхня відповідь."
 mtg_britain.82.b:0 "Нехай наш голос буде почутий!"
 mtg_britain.90.d:0 "[From.GetAdjective] уряд відкинув нашу пропозицію щодо збільшення експорту та розширення програми торговельних пільг. Вони побоюються, що такі пільги негативно вплинуть на їхню внутрішню економічну ситуацію."
 mtg_exile_government.2.a:0 "Час їм повернутися на свою територію."
 mtg_exile_government.4.title:0 "[From.GetName] приймає пропозицію про інтеграцію флоту"
 mtg_netherlands.18.a:0 "Це так задують полум'я свободи?"
 mtg_netherlands.26.t:0 "[From.GetNameDefCap] просить, щоб США захищали Вест-Індії"
 mtg_netherlands.33.a:0 "Чудово!"
 mtg_netherlands.36.t:0 "[From.GetNameDefCap] погоджується обмінятися розвідданими"
 mtg_netherlands.47.t:0 "Принц Бернард подає гарний приклад"
 mtg_netherlands.48.d:0 "У своїй відверто самовпевненій манері принц Бернард, схоже, дав своїм товаришам-пілотам низку «цінних вказівок», абсолютно непродуктивних з тактичного погляду, а часом навіть небезпечних. Бравада в його дусі вже збільшила втрати."
 mtg_netherlands.54.t:0 "Принц Бернард має намір організувати опір"
 mtg_netherlands.62.t:0 "[From.GetNameDef] знімає напруженість"
 mtg_netherlands.67.d.b:0 "Німці розширили свій вплив на державу [HOL.GetNameDef] настільки, що [HOL.GetAdjective] уряд тепер змушений давати їм сприятливі умови в торгових переговорах."
 mtg_netherlands.73.d:0 "Зі визволенням першої німецької землі королева Вільгельміна виконала свою початкову обіцянку — кайзер [HOL_kaiserreich_germany.GetLeader] тепер збере тимчасовий уряд на окупованій території.[HOL_kaiserreich_germany.GetLeader] зможе очолити власну війну за звільнення решти країни та залучити на свій бік нових послідовників."
 mtg_news.1.desc:0 "Напруженість у Сполучених Штатах досягла кульмінації. Невдоволені політикою президента [USA.GetLeader] законодавчі органи кількох американських штатів проголосували за вихід із Союзу.\n\nВсі надії на мирне вирішення конфлікту розвіялися з початком лютих сутичок. Схоже, більшість членів уряду вирішили залишитися на законній стороні, але також надходять повідомлення про велику кількість перехідних на бік штатів, що відкололися.\n\nЖодна сторона не збирається поступатися, так що спостерігачі пророкують довгу і запеклу боротьбу."
 mtg_news.2.a:0 "Внутрішні вороги — як і раніше вороги."
 mtg_news.22.c:0 "Вони ділять світ між собою..."
 mtg_news.27.a:0 "Ми мусимо вітати їхнє повернення на батьківщину."
 mtg_news.38.b:0 "Хай тільки спробують, зрадники!"
 mtg_news.4.c:0 "Під впливом військово-промислового комплексу, без сумніву."
 mtg_news.45.t:0 "Громадянська війна в Пакистані"
 mtg_news.49.t:0 "[JAP.GetName] отримує ресурси Вест-Індії"
 mtg_news.53.t:0 "Утворення Бенілюксу"
 mtg_news.7.b:0 "Справедливість перемогла!"
 mtg_usa_civil_war_democrats.14.t:0 "Робітники страйкують"
 mtg_usa_civil_war_democrats.25.t:0 "Північний Захід виходить із Союзу"
 mtg_usa_civil_war_fascists.12.t:0 "Генерал [From.GetName] йде у відставку"
 mtg_usa_protect_south_america.1.t:0 "Cамміт із безпеки Південної Америки"
 mtg_usa_senate_small_opposition_tt:0 "До §Y4 сенаторів§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_strategic_interests.1.desc:0 "Президент [USA.GetLeader] прибув до Лондона, щоб обговорити низку пропозицій щодо кількох стратегічно важливих територій по всьому світу. Згідно з [USA.GetAdjective]им урядом, [ENG.GetNameDef] відчуває брак ресурсів захищати ці території способом, що забезпечує задоволення [USA.GetAdjective] інтересів. Поки [ENG.GetAdjective]ий уряд не надасть достатніх гарантій того, що він має намір дотримуватися вказаного способу дій, аналітики вважають, що [USA.GetLeader] вимагатиме поступитися контролю над територіями державі [USA.GetNameDefCap]."
 nacista_coup_attempt_happened:0 "Спроба перевороту «Насіста» вже відбулася"
 nakajima:0 "Nakajima Aircraft Company"
 natal_airbase_modifier:0 "Дозволили нам використовувати Парнамірінський аеропорт"
 native_american_usa_neutrality_ADJ:0 "Тубільн"
 nav_bomber_equipment_3_desc:0 "Цільнометалеві корпуси та аеродинамічні гальма помітно позначаються на льотних властивостях. Платити за це доводиться збільшеною чисельністю екіпажу."
 naval_gunfire_support_landing_lane_clearance:0 "Очищення десантних смуг"
 naval_light_gun_hit_chance_factor_tt:0 " $MODIFIER_NAVAL_LIGHT_GUN_HIT_CHANCE_FACTOR$: $RIGHT|+=%1$"
 naval_rank1:0 "Командор"
 naval_rank3:0 "Віцеадмірал"
 naval_rearmament_focus_desc:0 "Хоча ми намагалися запобігти гонці військово-морських озброєнь за допомогою Другого Лондонського військово-морського договору, навіть ті, хто його підписав, здебільшого ігнорують його. [Root.GetNavalRearmamentDesc] не мусять втратити свою глобальну перевагу. Ми мусимо завжди дбати про те, щоб він залишався найбільшим у світі."
 navy_capital_ship_defence_factor_tt:0 " $MODIFIER_NAVY_CAPITAL_SHIP_DEFENCE_FACTOR$: $RIGHT|+=%2$"
 navy_chief_naval_gunnery_designer_2:0 "Конструктор корабельних гармат\n(експерт)"
 neo_mesopotamia:0 "Месопотамія"
 nepotism_naval_academy_spirit_desc:0 "Мій батько був учителем в академії, як і його батько до нього, а також його старшого брата..."
 news.10.c:0 "У нас не було вибору..."
 news.101.d:0 "Бої в різних регіонах держави [FRA.GetNameDef] продовжуються, але надходять повідомлення про те, що німецькі війська увійшли до Парижа. Французи оголосили, що залишають столицю, незадовго до того, як її покинули останні військові частини. Німецькі війська на очах у занімілих парижан кількома колонами промарширували Єлисейськими полями, повторюючи прусський парад перемоги 1871 року.\n\nВійськові експерти стверджують, що [FRA.GetNameDef] неминуче впаде."
 news.112.d:0 "Після низки суперечливих доповідей було отримано підтвердження того, що Гібралтар був захоплений німцями.\n\nЦей стратегічний порт, що охороняє доступ до Середземномор'я, вважався неприступним на початку війни. Британський гарнізон відступив тунелями в Скелі, однак був вибитий звідти гранатами та вогнеметами.\n\nТепер, коли Гібралтар у руках німців, у війні за Середземне море може настати корінний перелом."
 news.12.d:0 "Радянські дипломати передали ультиматум уряду держави [FIN.GetNameDef] із вимогою перегляду кордонів у Карелії. Гельсінкі відкинув ці вимоги, незважаючи на суттєву присутність радянських військ у регіоні, і заявив, що «жоден клаптик фінської землі не дістанеться російським агресорам».\n\nМіжнародні спостерігачі побоюються, що війна з СРСР неминуча."
 news.151.b:0 "Наш день прийде."
 news.163.c:0 "Прикро."
 news.163.d:0 "Включивши Австрію до свого складу, держава [GER.GetName] використала це для виправдання подальших претензій та назвала «правомірним» повернення колишніх австрійських територій, зокрема Словенії, яка зараз належить державі [YUG.GetName].\n\nУ відповідь на це в Лондоні була скликана конференція для обговорення «словенського питання», куди прибули делегати країн, які підписали Версальський договір. За підсумками мирної конференції було вирішено, що [YUG.GetName] повинна поступитися Словенією Німеччині заради загального миру.\n\nЗалишившись без підтримки провідних європейських держав, [YUG.GetLeader] не бачить іншого виходу, крім як підписати подану угоду."
 news.182.e:0 "Не пощастило."
 news.185.t:0 "[From.GetName] домагається розширеного військового пакту"
 news.188.d:0 "Незважаючи на десятиліття конфліктів і дипломатичних маневрів, проведених задля досягнення контролю над Середземномор'ям, [ITA.GetName] та [TUR.GetName] залишили свої розбіжності позаду.\n\nВ угоді про співпрацю на благо всього Середземномор'я [ITA.GetName] та [TUR.GetName] зобов'язуються встановити тісніші дипломатичні та економічні зв'язки, ніж будь-коли."
 news.213.d_war:0 "Як країна вільних, [USA.GetNameDef] вважає себе природним ворогом фашизму у всіх його формах по всьому світу. В умовах агресії німецького режиму вони є найбільшим ворогом світу, побудованого на ліберальних принципах, яких дотримується [USA.GetNameDef].\n\nЗ огляду на це, а також за схвалення Конгресу [USA.GetAdjective], [USA.GetLeader] виніс попередження [GER.GetNameDef]. Якщо [GER.GetNameDef] не капітулює і не змінить політичний курс, [USA.GetNameDef] спрямує проти нього всю свою промислову та військову міць.\n\n \"Ми не дозволимо [GER.GetNameDef] відвернути хід історії!\""
 news.216.d:0 "Вчора дипломати з держави [GER.GetName] висунули державі [TUR.GetName] ультиматум, в якому вимагали від [TUR.GetLeader] піти у відставку на користь уряду, підтримуваного Німеччиною. За підтримки Великих національних зборів [TUR.GetLeader] відхилив ультиматум, оголосивши народу [TUR.GetAdjective], що Туреччина ніколи не буде пішаком у військових іграх іноземного диктатора.\n\nТепер країна готується до війни."
 news.219.b:0 "Доказ, що корупція притаманна комунізму."
 news.22.b:0 "Ми на крок ближче до створення нашої великої імперії."
 news.223.a:0 "Ми зробимо, що мусимо, за короля та вітчизну."
 news.23.b:0 "Це буде коротка кампанія."
 news.239.c:0 "Ми — самі кордони справедливості і чесності!"
 news.241.a:0 "Ситуація в Тихому океані змінюється."
 news.244.a:0 "Вони намагаються домінувати."
 news.249.c:0 "Армія півдня буде готова."
 news.25.e:0 "Нема про що непокоїтися."
 news.252.d:0 "Вважаючи себе природними союзниками, [GER.GetNameDef] та [CAN.GetNameDef] підписали пакт про взаємну оборону. [CAN.GetAdjective]ий прем'єр-міністр [CAN.GetLeader] оголосив про союз у своїй промові, цитуючи природне збіг [CAN.GetAdjective]их і [GER.GetAdjective]их інтересів.\n\nВраховуючи підвищену мобілізацію по всій Європі і недавнє дистанціювання [CAN.GetNameDef] від Співдружності, не важко передбачити, про які інтереси йде мова.\nЯк в Європі, так і в Америці старі держави спостерігають за цим зі зростаючою тривогою."
 news.254.d:0 "[AST.GetNameDefCap], стверджуючи свою повну незалежність, почала поширювати свій вплив на південну частину Тихого океану. В рамках цього [AST.GetAdjective]ий уряд зажадав, щоб усі колишні колоніальні держави Океанії перейшли під його владу.\n\nНе бажаючи цього, уряди Великої Британії та Нової Зеландії спочатку чинили дипломатичний опір. Однак, не маючи жодних підстав для поширення влади Імперії в регіоні — роль, яку раніше виконувала Австралія, було лише питанням часу, коли [AST.GetNameDef] висуне ультиматум, підкріплений силою.\n\nНова Зеландія зараз є найсхіднішою провінцією [AST.GetNameDef]."
 news.261.c:0 "Вочевидь, це один із шляхів розвитку Співдружності."
 news.280.c:0 "Цінний союзник."
 news.283.a:0 "Вони виведуть нас на свободу."
 news.287.a:0 "Ймовірна історія!"
 news.288.a:0 "Альянс із безвиході."
 news.298.a:0 "Приниження закінчилось, але не забуте!"
 news.299.desc:0 "Повернувши землі, які були відібрані у них за Тріанонським договором, [From.GetLeader] вчора ввечері видав прокламацію про те, що країна відтепер буде називатися Великою Угорщиною. Сподіваємося, що це послужить підвищенню престижу Великої Угорщини в очах світу, а також краще опише протяжність її кордонів."
 news.302.t:0 "Румунія відхиляє [HUN.GetAdjective]і вимоги"
 news.309.t:0 "Угорщина вимагає контроль над Словаччиною"
 news.31.e:0 "Це зіграє нам на руку!"
 news.321.b:0 "Це було чудовою ідеєю!"
 news.335.d:0 "\nНещодавній інцидент у Панаї вийшов з-під контролю. Обурення в [USA.GetNameDef] призвело до того, що кілька відомих політиків вимагають негайної розправи над [JAP.GetNameDef]. [USA.GetAdjective]і ЗМІ переповнені новими історіями про звірства [JAP.GetAdjective], деякі правдиві, деякі перебільшені, деякі повністю вигадані. Коли дві великі держави стоять на порозі війни, мало хто з оглядачів все ще сподівається на стабілізацію ситуації."
 news.335.t:0 "Напруга між [USA.GetNameDef] та [JAP.GetName] зростає"
 news.37.b:0 "Завдання виконано."
 news.44.t:0 "Політ Рудольфа Гесса"
 news.5.a:0 "Стерв'ятники терзають труп."
 news.56.c:0 "Ми запобігли ще одній світовій війні."
 news.57.a:0 "Здається, буде війна!"
 news.7.a:0 "Початок ще однієї війни в Азії?"
 news.7.b:0 "Який сором..."
 news.7.c:0 "Ми показали світу, чого варті."
 news.70.d:0 "З самого приходу до влади партії [baltic_annexation.GetRulingParty], [baltic_annexation.GetNameDef] активно прагне зміцнити зв'язки з державою [SOV.GetNameDef] і тепер стає його частиною. Хоча [baltic_annexation.GetLeader] зберігає свою посаду, більшість міністрів — прихильники радянської влади, а національний суверенітет фактично втрачено. Радянські офіційні особи заявляють, що держава [baltic_annexation.GetName] попросила про захист, оскільки клімат у Європі стає дедалі небезпечнішим для малих держав.\n\n[SOV.GetNameDef] також підтверджує, що такий «захист» буде наданий будь-якій державі, яка відчуває загрозу з боку сусідніх країн."
 non_strategic_materials_large_short:0 "$non_strategic_materials_small_short$"
 non_strategic_materials_small_short:0 "Використання нестрат. матеріалів"
 nsb_coup.2.a:0 "І ці люди хотіли керувати країною?"
 nsb_news.12.desc:0 "Діюючи неймовірно швидко, [SOV.GetAdjective] опозиція заарештувала і змістила трійку, очолювану Берією. На світанку сили Червоної армії оточили столицю, а тим часом був таємно затриманий військами раніше, ніж про це дізнався його особистий охоронець, оголошено новий уряд: очолювати країну тепер буде [SOV.GetLeader], $SOV_lavrenty_beriya$ звинувачений у зраді державі [SOV.GetNameDef]."
 nsb_news.303.t:0 "Сибір об'єднаний"
 nsb_news.4.e:0 "Цікаво."
 nsb_news.401.t:0 "Земський собор розпущений"
 nsb_news.406.desc:0 "[SOV.GetNameDef] знову приміряє на себе роль захисника слов'ян і оголошує про гарантії іншим слов'янським народам у Європі. У своїй заяві [SOV.GetLeader] обіцяє, що всі ресурси, доступні державі [SOV.GetNameDef] будуть використані на користь усім слов'янським народам і на захист їх від зовнішніх загроз». і не має наміру ухилятися від відповідальності."
 nsb_news.9.h:0 "Їх уже перемогли якось, переможуть і тепер!"
