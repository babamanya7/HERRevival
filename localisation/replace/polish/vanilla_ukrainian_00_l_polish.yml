 SIA_expand_the_slipways_desc:0 "Наші нинішні потужності занадто тісні для амбіцій, які зараз формуються. Збільшивши стапелі, ми розширимо наші можливості будувати і ремонтувати судна, що дозволить флоту зростати в розмірах і боєготовності."
 SIA_generic_fascist_demagogue:0 "Wichit Wichitwathakarn"
 SIA_japan_aid_request.4.a:0 "Тоді ми стоїмо самі."
 SIA_japanese_fighters_desc:0 "Хоча наша власна авіаційна промисловість залишається слабкою, іноземні літаки можуть допомогти заповнити цю прогалину. Японські винищувачі в руках [ROOT.GetAdjective] принаймні дали б нам певну міру сучасної повітряної могутності, нехай навіть у межах, встановлених нашою промисловою слабкістю."
 SIA_khana_ratsadon_cat_desc:0 "Хана Ратсадон, Народна партія, що поклала край абсолютній монархії, не є монолітом. Її військове та цивільне крила мають власне бачення розвитку країни, і напруга між ними проходить червоною ниткою через кожне рішення. Тримайте обидві фракції задоволеними, або ризикуєте тим, що коаліція розірве себе на частини."
 SIA_luang_phibunsongkhram:0 "Luang Phibunsongkhram"
 SIA_mandate_3_desc:0 "Припинити називати тайців невідповідно до назви національності або за вподобаннями групи.\n\nВикористовувати назву 'тайці' для позначення всього тайського народу без його поділу."
