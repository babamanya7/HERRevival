 invited_to_split_yugo:0 "Запрошення поділити Югославію прийняте"
 iron_duke:0 "Залізний герцог"
 isolate_australia_desc:0 "Австралія є вкрай важливою територією для союзних держав, що ведуть війну в Тихому океані, і вона не повинна стати плацдармом для нападу на Японію та володіння, що належать їй по праву. Захопивши ключові острови в південній частині Тихого океану, ми можемо ізолювати Австралію від Сполучених Штатів."
 istanbul_military_industries:0 "Istanbul Military Industries"
 italy.11.a:0 "Якщо виникне така потреба, ми все одно можемо вимогти їх."
 italy.12.b:0 "У нас буде краща можливість."
 italy.9.b:0 "Ми виграли цю війну не для того, щоб підкоритися іноземним вимогам!"
