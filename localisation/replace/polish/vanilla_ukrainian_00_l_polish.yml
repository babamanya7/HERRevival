 SEA_PHI_political_events.1.b:0 "Ми маємо на увазі інших торговельних партнерів"
 SEA_PHI_political_events.17.desc:0 "Скориставшись слабкістю американського нагляду за національним урядом, Комуністична партія Філіппін швидко втрутилася і заповнила порожнечу; обрані члени партії закликали до негайних рішучих дій, які могли забезпечити лише вони. Хоча інші групи все ще мають певний вплив, комуністичний сектор швидко зріс у значенні. \n \nТепер ми повинні визначити, хто саме має очолити партію та вести націю назустріч червоному світанку, що сходить."
 SEA_PHI_political_events.2.a:0 "Чудові новини"
 SEA_PHI_political_events.3.desc:0 "Обравши шлях до незалежності, [FROM.GetNameDef] звернувся до нас із проєктом торговельної угоди між нашими країнами. Вони пропонують угоду, яка зробить імпорт наших ресурсів привабливішим для них, тоді як раніше торговельні партнери могли обиратися, виходячи з [USA.GetAdjective]их інтересів, а не [FROM.GetAdjective]их інтересів."
 SEA_PHI_political_events.45.a:0 "Це розширить наш вплив"
 SEA_PHI_political_events.68.a:0 "Можливо, їхні суперники в регіоні будуть більш прихильними"
 SEA_PRC_faction_events.2.a:0 "Марно опиратися..."
 SEA_PRC_faction_events.21.a:0 "Явна ознака мудрості"
 SEA_PRC_faction_events.5.t:0 "[FROM.GetNameDefCap] відхиляє наші вимоги"
 SEA_PRC_faction_events.60.b:0 "Нам краще без них"
 SEA_PRC_faction_events.71.t:0 "[FROM.GetNameDefCap] хоче отримати опіку над нашими азійськими підданими"
 SEA_PRC_faction_events.80.t:0 "[FROM.GetName] вимагає нашого підкорення"
 SEA_PRC_political_events.11.t:0 "[FROM.GetName] хоче бути вільним"
 SEA_PRC_political_events.20.desc:0 "Відновлення бойових дій між [CHI.GetNameDef] та [PRC.GetNameDef] викликало невпевненість серед ворожих офіцерів, змусивши деяких із них перейти на наш бік."
 SEA_PRC_political_events.22.t:0 "[FROM.GetName] погоджується надіслати нам $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.24.b:0 "Вони роблять добру справу в [CHI.GetName]"
 SEA_PRC_political_events.26.desc:0 "\n[FROM.GetNameDefCap] вирішив задовольнити наше прохання і наказав $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ переїхати до [ROOT.GetNameDef]. Їхні поради, безсумнівно, будуть цінними, а передислокація стане ударом по армії [CHI.GetNameDef]."
 SEA_PRC_request_aid.2.desc:0 "[FROM.GetNameDefCap] погодився надіслати запитане нами спорядження. Ця велика поставка дозволить нам розгорнути кілька нових дивізій і забезпечить нас спеціалізованим обладнанням, що дозволить сформувати роти підтримки."
 SEA_PRC_request_aid.4.a:0 "Ми можемо виділити багато"
 SEA_PRC_request_aid.7.t:0 "[FROM.GetName] виготовить танки"
 SEA_border_incidents_events.2.t:0 "Інцидент у Таурані"
 SEA_border_incidents_events.7.desc:0 "Бої між [JAP.GetAdjective]ими та [MON.GetAdjective]ими силами навколо озера Буїр вщухли після того, як обидві сторони відійшли зі спірного регіону для перегрупування та поповнення запасів. Визнаючи марність подальших наступів, [JAP.GetAdjective]і військові попросили про припинення вогню та переговори для фіксації кордону, визнавши, що село лежить на [MON.GetAdjective]ій території."
 SEA_china.5.desc:0 "Ми отримали відповідь на наш запит і раді повідомити, що незабаром нам будуть надані іноземні кошти. Вони повинні стати великою підмогою для нашої промисловості і дозволити нам значно збільшити наші збройні сили, і цілком можливо, що допомога згодом може бути розширена і включатиме матеріальні засоби."
 SEA_china.7.desc:0 "Центральний уряд [FROM.GetName] надіслав запрошення для [ROOT.GetName] приєднатися до їхнього альянсу. Вони говорять про національну єдність і необхідність спільного опору іноземним зазіханням. Хоча ідеологічні розбіжності залишаються, перспектива співпраці перед обличчям зростаючих загроз може заслуговувати на увагу."
 SEA_china.7.t:0 "Запрошення від [FROM.GetName]"
 SEA_china_democratic.14.desc:0 "Ми отримали відповідь на наш запит і раді повідомити, що незабаром нам будуть надані іноземні кошти. Це має стати великою підмогою для нашої економіки і дозволить нам значно розвинути нашу промисловість і збройні сили."
 SEA_china_democratic.17.tt:0 "§RМи станемо залежною державою [FROM.GetName]§!"
 SEA_generic_events.12.desc_wartime:0 "Прихильники [GetOppositionPartyName] та інших опозиційних партій провели сьогодні протест, вимагаючи припинити нашу нинішню війну, вважаючи жертви нашої армії непотрібними для [ROOT.GetAdjective]их інтересів."
 SEA_generic_events.15.desc:0 "Ми отримали новини, що місцевий масовий протест, організований [GetOppositionPartyName], закінчився кровопролиттям після того, як кидання предметів у поліцію спровокувало вогонь у відповідь. Цей інцидент, хоча в ньому немає провини ні уряду, ні [GetOppositionPartySupportersName], викликає серйозні занепокоєння щодо стабільності в країні."
 SEA_generic_events.6.a:0 "Публічно вибачитися"
 SEA_imperial_influence_demand_event_option_7:0 "Вчинки красномовніші за слова"
 SEA_imperial_influence_events.00.a:0 "[GetNameImperialInfluenceDemandOptions]"
 SEA_imperial_influence_events.330.desc:0 "Лідери Дзайбацу висунули свої вимоги. Вони бажають, щоб ми скоригували економічну стратегію нашої нації, і щоб більше коштів спрямовувалося промисловим конгломератам. Незважаючи на привід простого зміцнення нашої економіки, вони, очевидно, також хочуть посилити свій контроль і вплив на [GetImperialInfluenceRulerTitle]. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_japan_foreign_policy.1.b:0 "Ми повинні зберегти нашу незалежність за будь-яку ціну!"
 SEA_japan_foreign_policy.1.desc:0 "Керівництво Квантунської армії [FROM.GetNameDef] вимагає нашої покори. Однак вони прийшли з пропозицією. Якщо ми приєднаємося до них, вони допоможуть нам повернути давні монгольські землі і дозволять нам створити нову Монгольську імперію під їхнім контролем. Що скажемо?"
 SEA_japan_foreign_policy.105.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 SEA_japan_foreign_policy.117.b:0 "Тоді ми звільнимо їх силою!"
 SEA_japan_foreign_policy.123.desc:0 "Процес обміну наших правих генералів і держслужбовців на лівих, яких ми раніше відправили в неофіційне вигнання до [From.GetNameDef], завершено."
 SEA_japan_foreign_policy.123.t:0 "[Root.GetAdjective]их генералів обміняно"
 SEA_japan_foreign_policy.132.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб наша буржуазна диктатура підкорилася правлінню центральної комуністичної влади в Токіо і дозволила народу нашої держави належним чином керувати собою як лояльній частині [FROM.GetAdjective]ої сфери. Як нам реагувати на цю очевидну загрозу?"
 SEA_japan_foreign_policy.17.b:0 "Ми повинні це облишити"
 SEA_japan_foreign_policy.2.t:0 "[FROM.GetNameDefCap] підкорюється нашому правлінню"
 SEA_japan_foreign_policy.38.t:0 "[FROM.GetNameDefCap] блокує поширення нашого впливу"
 SEA_japan_foreign_policy.39.t:0 "[FROM.GetAdjective]і інвестиції в наші природні ресурси"
 SEA_japan_foreign_policy.54.a:0 "Вони озброюють політичних дисидентів!"
 SEA_japan_foreign_policy.61.b:0 "Можливо, він правий..."
 SEA_japan_foreign_policy.68.desc:0 "Сьогодні [ROOT.GetLeader] та різні командувачі [JAP.GetAdjective]ої армії зробили спільну прокламацію, оголосивши про створення нової [ROOT.GetAdjective]ої держави. Ми переможемо всіх наших ворогів!"
 SEA_japan_foreign_policy.7.b:0 "Тоді нехай приходять!"
 SEA_japan_foreign_policy.76.b:0 "Вони занадто високої думки про себе"
 SEA_japan_foreign_policy.97.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] надіслав дипломатів до нашої столиці, щоб обговорити перспективу складних торговельних відносин із [FROM.GetAdjective]ою державою. Це зблизило б наші стосунки, але дозволило б їм отримати доступ до наших ресурсів за нижчою ціною, що несе ризик зашкодити нашій економіці."
 SEA_japan_news_events.01.t:0 "[JAP.GetLeader] виступає проти втручання військових"
 SEA_japan_news_events.02.b:0 "Ще один хід пропагандистської машини"
 SEA_japan_popup_events.13.a:0 "Оголосити воєнний стан, Нагако вирішить нестабільність нації!"
 SEA_japan_popup_events.16.c:0 "Президент Палати перів Токугава Ієсато"
 SEA_japan_popup_events.27.a:0 "Скинемо загарбників у море!"
 SEA_japan_popup_events.31.b:0 "Кюїті Токуда має досвід"
 SEA_japan_popup_events.36.desc:0 "Нам стало відомо, що в нашій країні зараз діють [FROM.GetAdjective]і осередки, які поширюють комуністичні настрої. Хоча це здається досить нешкідливим, виглядає так, що частина пропаганди має досить революційний характер. Повідомлення про те, що робітників заохочують організовуватися та об'єднуватися, стають все частішими, і, судячи з недавньої історії, ми не можемо бути впевнені, що це не хитрий план [FROM.GetAdjective]ого керівництва з нашої остаточної інтеграції."
 SEA_japan_popup_events.5.a:0 "Відмінно!"
 SEA_japan_tokko_arrest_events.8.b:0 "Замести це під килим, нам це все одно вигідно"
 SEA_warlords.25.a:0 "Тоді нам доведеться знищити і їх!"
 SEA_warlords.27.desc:0 "Побоюючись, що боротьба призведе лише до більшого кровопролиття і нестабільності в регіоні, [FROM.GetLeader] вирішив, що найкраще буде присягнути нам на вірність."
 SEA_warlords.29.a:0 "Звучить розумно."
 SEA_warlords.5.desc:0 "З посиленням тиску з боку Центрального уряду та падінням бойового духу серед наших військ стає зрозуміло, що ми повинні припинити нашу безплідну боротьбу і звернути увагу на більші загрози, що нависли над Китаєм. День втрачено, війська Ма Хушаня продовжуватимуть окупувати південні частини нашої провінції."
 SEA_warlords.51.desc:0 "На початку цього тижня наш представник Лі Кенон зустрівся з [FROM.GetLeader] у Лочуані, щоб обговорити антияпонські питання та питання радянської допомоги у боротьбі проти загарбників. Наприкінці зустрічі вони домовилися чинити опір Японії, хоча й не погодилися на переговори з Чаном Кайші. Чжан, однак, затаївши образу на японців за вбивство свого батька, заявив, що зробить все можливе, навіть якщо це коштуватиме йому життя, щоб переконати генералісимуса приєднатися до КПК проти японців."
 SEA_warlords.55.tt:0 "Тепер ми зможемо взяти фокус §Y$XIC_request_relocation_to_northeastern_command$§!"
 SEA_warlords.57.t:0 "[FROM.GetLeader] відхиляє наш запит"
 SEA_warlords.60.desc:0 "Численні генерали і солдати, колись вірні старому маршалу Чжан Цзоліню, якого Квантунська армія вбила багато років тому, тепер відгукуються на заклик його сина, [FROM.GetLeader], і переходять на бік [FROM.GetNameDef]. Це катастрофа!"
 SEA_warlords.7.desc:0 "Центральний уряд вирішив надати нам мінімальну підтримку, намагаючись не розгнівати радянську владу, оскільки вони цінують своє партнерство з цією державою більше, ніж наше виживання."
