 improve_stalin_line:0 "Поліпшити лінію Сталіна"
 improved_depth_charges_desc:0 "Нескладний механічний пристрій для скидання глибинних бомб на віддаленні від корабля. Воно дозволяє есмінцю атакувати підводну мету, не перебуваючи безпосередньо над нею.\n\nУстановка цього модуля на §Yлегкі кораблі§! та §Yкрейсери§! дозволить атакувати ворожі §Yпідводні човни§!."
 improved_encryption_desc:0 "Шифрувальні апарати обмежені за кількістю випадкових комбінацій, що дозволяє зламувати шифри. Поліпшивши механізм рандомізації роторних шифраторів, ми можемо ускладнити такий криптоаналіз."
 improved_fire_control_system:0 "Поліпшена система керування вогнем"
