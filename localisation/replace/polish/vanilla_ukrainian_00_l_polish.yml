 YUG_reunite_the_kingdom_desc:0 "Хоча багато хто хвилюється, що ця дія може знову сповзти до роз'єднаності та культурних конфліктів, характерних для Югославії, ми повинні знову об'єднати нашу націю в єдине ціле, щоб протистояти більшим загрозам на нашому кордоні."
 YUG_royal_wedding_desc:0 "Королівські шлюби вже давно є способом укріплення союзів, і оскільки багатьом престижним принцесам не вистачає короля, наш молодий король Петар міг би забезпечити нам союз зі світовою державою."
