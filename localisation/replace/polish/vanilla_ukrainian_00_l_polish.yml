 FIN_align_the_trade_unions:0 "Об'єднати профспілки"
 FIN_can_demand_territory_if_occupying_tt:0 "\n\nМи зможемо вимогти від держави [SOV.GetNameDef] територіальних поступок, якщо будемо контролювати області §Y[213.GetName]§!, §Y[215.GetName]§! або §Y[216.GetName]§!."
 FIN_confederated_finno_russian_republics_DEF:0 "Конфедерація фіно-російських республік"
 FIN_confederation_of_finno_russian_republics_dm:0 "Конфедерація фіно-російських республік"
 FIN_contract_with_yhteissisu_desc:0 "У співпраці з провідними [ROOT.GetAdjective]ими корпораціями ми заснуємо компанію Yhteissisu Oy з метою забезпечення надійного та ефективного транспортування для [ROOT.GetAdjective]их оборонних сил.\nПеренесення виробництва вантажівок Sisu S-21 до Yhteissisu збільшить виробництво вантажівок і автобусів для військового використання, гарантуючи, що наші сили оснащені необхідними ресурсами для будь-якої ситуації."
 FIN_expand_air_force_academy:0 "Розгорнути Академію ВПС"
 FIN_finland_can_send_peace_demands_tt:0 "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§! можуть вимогти мирні переговори, включаючи [ROOT.GetAdjective]і територіальні поступки, якщо вони контролюють §Y[213.GetName]§!, §Y[215.GetName]§! або §Y[216.GetName]§!."
 FIN_finnish_march_of_conquest_desc:0 "Занадто довго ми тримали оборону проти [SOU.GetNameDef] та його попередників. Тепер настав час переломити ситуацію та відсунути кордони, звільнивши людей Карелії від [SOU.GetAdjective]ого гніту, будь-які необхідні засоби."
 FIN_integrate_leningrad_desc:0 "[195.GetName] може бути переважно росіянами, але з огляду на наші плани щодо нашої нової Інгерійської республіки це мало що має значення."
 FIN_keepers_of_the_north_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! вимагає анексії всіх скандинавських суб'єктів або союзників у [ROOT.GetAdjective]ому альянсі.\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! вимагає кожну скандинавську область, контрольовану союзником.\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! претендує на кожну скандинавську область, контрольовану нейтральною або ворожою країною.\n§YКожна скандинавська область, яка вже контролюється [ROOT.GetFlag] [ROOT.GetNameDefCap]§!: Додається §G+30,0%§! підпорядкування."
