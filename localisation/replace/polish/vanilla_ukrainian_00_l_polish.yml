 FRA_UK_democratic_DEF:0 "Франко-британська унія"
 FRA_VICTORY_POINTS_9522:0 "Екс-ла-Шапель"
 FRA_battleship_3_desc:0 "Лінкори класу Gascogne були підкласом класу Richelieu. У рамках військово-морської програми 1940 року було замовлено три кораблі, але жоден не був запущений. Конструкція була б повторенням конструкції Richelieu, але з рівномірним розподілом основного озброєння в носовій і кормовій частині, поліпшеним протиракетним озброєнням і вдосконаленими двигунами, що призвело б до кращого корабля."
 FRA_coordinate_rearmament_tt:0 "Знижує вартість ліцензій на виробництво для членів нашого альянсу."
 FRA_cv_CAS_equipment_2:0 "Loiré-Nieuport LN.401"
 FRA_cv_nav_bomber_equipment_1_short:0 "Laté 298B"
 FRA_division_cuirassee_desc:0 "Заповзятливий офіцер на ім'я де Голль запропонував новий вид дивізії, що поєднує важку броню з піхотою та середніми танками для бою як єдине ціле."
 FRA_establish_spheres_of_influence:0 "Створити сфери впливу"
 FRA_france_leads_desc:0 "Нація з гордою історією Франції не може дозволити іншим країнам диктувати її зовнішню політику. Ми зробимо свій вибір, керуючись власними інтересами."
 FRA_franco_british_cores:0 "Усі §Y[FRA.GetAdjective]і осердні землі§! стануть §Y[ENG.GetAdjective]ими осердними§!."
 FRA_frederic_irene_joliot_curie:0 "Фредерік та Ірен Жоліо-Кюрі"
 FRA_freedom_front_desc:0 "Зіткнувшись із хаосом і потрясіннями, які обіцяють комуністи, потрібно бути готовими укласти союзи з іншими партіями, навіть з тими, які особисто можна вважати осудними."
