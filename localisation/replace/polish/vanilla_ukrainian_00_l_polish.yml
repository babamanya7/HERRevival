 ships_bonus:0 "Бонус до моделей кораблів"
 siam.1.desc:0 "[SIA_phraya_phahon.GetName] звинувачують у продажі королівської нерухомості чиновникам за цінами, нижчими від ринкових — скандал, який суттєво підірвав його легітимність у Народних зборах. Схоже, що вплив [SIA_phraya_phahon.GetName] добігає кінця."
 siam.15.b:0 "Прийнятна лише тотальна перемога."
 siam.21.a:0 "Ми дамо їм це зрозуміти."
 siam.25.t:0 "Смерть Прачадіпока"
 siam.31.b:0 "Ми будуватимемо наш підводний флот за проектами [JAP.GetAdjective]."
 siam.37.a:0 "Справедливе врегулювання. Наша економіка відновиться."
 siam.42.desc:0 "[FROM.GetNameDefCap] офіційно вирішила прив'язати свою валюту до нашої. Це рішення наближає [FROM.GetNameDef] до нашої економічної орбіти і свідчить про певну довіру до стабільності наших фінансових інституцій. Торгівля між нашими народами має стати більш передбачуваною, а купцям [FROM.GetAdjective] буде легше вести справи з нашими."
 siam.8.desc:0 "Забезпечивши достатню політичну та військову підтримку, військова кліка Сонгсурадета разом із флотом ефективно захопила великі райони [THIS.GetName]. Рано вранці в передмістях Бангкока пролунали постріли, і вся країна, здається, опинилася на межі повномасштабної громадянської війни між урядом і Сонгсурадетом."
 siam_adc.5.t:0 "[FROM.GetNameDefCap] відхиляє наші вимоги"
 ski_troops_desc:0 "Фахівці з холодної погоди є життєво важливими для нашої тактики ведення бойових дій. Офіційно визнавши цих фахівців у нашому військовому статуті, ми зможемо вивільнити ресурси та тренування, щоби підвищити їхній професійний рівень."
 south_american_events.17.a:0 "Нашій країні потрібен мир!"
 south_american_events.17.t:0 "[PRU.GetNameDefCap] пропонує білий мир у обмін на Пастасу"
 south_american_events.30.a:0 "Ізолювати їх економічно та дипломатично."
 south_american_events.31.desc.a:0 "[FROM.GetAdjective] дипломати залишили своє посольство в [ROOT.Capital.GetCapitalVictoryPointName] сьогодні, видавши сувору заяву від свого уряду. Вони заявляють, що більше не прийдуть нам на допомогу, якщо ми опинимося в конфлікті з іншими націями, і вони не визнають нас законним урядом нації.\n\nКрім того, вони запровадили проти нас ембарго у спробі послабити нашу економіку. Хоча було очевидно, що [FROM.GetNameDef] буде ворожим до нашого режиму, швидкість та рішучість їхніх дій стали шоком для багатьох."
 south_american_events.51.desc:0 "Наші дипломати сподівалися, що [USA.GetNameDef] закриє очі на нашу діяльність в Америці, але, схоже, нам не пощастило. Ми щойно отримали термінове повідомлення від [USA.Capital.GetCapitalVictoryPointName] з вимогою припинити будь-яку ворожу діяльність у півкулі, інакше вони вважатимуть це актом війни проти [USA.GetNameDef]. Нам доведеться діяти обережно, якщо ми хочемо уникнути подальшої ескалації цього конфлікту."
 south_american_news.11.d:0 "Після найбільшого страйкового руху, відомого до цього часу в Болівії, військові на чолі з молодим підполковником Херманом Бушем пішли на повалення справжнього республіканського уряду Хосе Луїса Техади Сорсано. Вони заявили, що, на відміну від Техади, вони стоять на боці болівійського народу та його соціалістичних ідеалів, і тепер, після відставки Техади, вони взяли на себе повний контроль над Болівією."
