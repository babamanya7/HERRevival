 GER_division_nederland_mech_tt:0 "Ветеранська §Yмеханізована§! частина §Y23. SS-Division Nederland§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_nederland_mot_tt:0 "Ветеранська §Yмоторизована§! частина §Y23. SS-Division Nederland§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_economy_of_conquest_modifier_desc:0 "Незважаючи на несправедливі умови Версальського договору, ми піднімаємося з попелу з непохитною рішучістю. Через невпинну мілітаризацію ми прагнемо створити неперевершену військову індустрію, щоб забезпечити наш шлях до слави. Це створить навантаження на нашу економіку, але з перемогою прийде можливість пожинати плоди завоювань, спрямовуючи багатства інших країн на зміцнення наших збройних сил. Горе переможеним!"
 GER_embrace_democratic_institutions_desc:0 "Ліберальна демократія — це лише ширма для буржуазії. Справжня демократія потребує як соціальної, так і економічної рівності. Отже, лише ми можемо повністю реалізувати волю народу в управлінні державою."
 GER_end_of_czechoslovakia_desc:0 "Настав час розділити старі чеські землі між тими, хто може керувати ними належним чином. Нам слід також розглянути створення окремої словацької держави-маріонетки на сході."
