 NSB_poland_events.301.a:0 "Відмінний день для Польщі!"
 NSB_poland_royal_election.3.desc:0 "Сьогодні на регентській раді з'явився незвичайний кандидат. Грузинський князь, козак і колишній російський білогвардійський генерал Павло Бермондт-Авалов заявив свої права не тільки на трон Королівства Польща, а й на Польсько-литовську унію. тому цей козак з невідомих причин намагався вторгнутися в Балтику, і, схоже, з тих часів його апетити тільки виросли. білогвардійців, протидіючи у своїй державі [SOV.GetNameDef] і посилюючи наші війська, і навіть у перспективі зробивши нас прибічниками фашистських держав Європи."
