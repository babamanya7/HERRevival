 CZE_continue_the_central_bohemia_plan_desc:0 "Продовження нашого плану з розширення промислових зон у центрі країни дозволить нам скористатися ефектом масштабу. Розширення нашої промисловості подалі від кордонів також було б розумним кроком з точки зору національної безпеки."
