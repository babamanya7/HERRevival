 ITA_expand_national_universities:0 "Розширити національні університети"
 ITA_fighter_equipment_0:0 "Fiat CR.32"
 ITA_flotta_d_evasione_admiral_traits_tt:0 "Два випадкові адмірали отримають рису §Y$bold$§!:\n- $MODIFIER_NAVAL_SPEED$: §G+10%§!\n- $MODIFIER_NAVAL_DAMAGE_FACTOR$: §G+5.00%§!\n\n"
 ITA_focus_sh_tank_template_tt:0 "\nКоли буде досліджено технологію §Y$super_heavy_tank_chassis$§!:\n"
 ITA_foggia_farm_fields_desc:0 "Модернізація сільськогосподарської промисловості Фоджі дасть змогу збільшити виробництво продуктів харчування."
 ITA_giuseppe_fioravanzo:0 "Джузеппе Фйораванцо"
 ITA_giuseppe_tellera:0 "Джузеппе Теллера"
 ITA_heavy_cruiser_2:0 "Клас «San Giorgio»"
 ITA_heavy_cruiser_4:0 "Клас «Garibaldi»"
