 DEN_kanslergadeforliget_desc:0 "Велика депресія все ще відчувається в [ROOT.GetName] зі стрімким зростанням безробіття та занепадом сільськогосподарського сектору. Нам потрібно вийти за межі партійних кордонів і дійти згоди щодо того, як подолати кризу, в якій ми опинилися."
