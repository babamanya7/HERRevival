 AST_cabinet_trust_state_3_tt:0 "§YСередня довіра до кабінету§!\nПриріст політичної влади: §R-15%§!\nСтабільність: §R-20.00%§!\nПідтримка війни: §R-10.00%§!"
 AST_call_that_a_knife_desc:0 "«Це не ніж… ОСЬ ЦЕ ніж!» Трохи бравади та гумору мають велике значення. Наші солдати стикаються з небезпекою з упевненістю, мужністю та неабиякою зухвалістю."
 AST_carrier_3:0 "$ENG_carrier_3$"
 AST_central_bureau_desc:0 "Бюро зв'язку та розвідки, скоординоване з США, обіцяє дати нам стратегічну перевагу в майбутній бурі. Наш досвід у цій сфері мусить бути визнаний."
 AST_comintern_desc:0 "Хоча Радянський Союз часом відступав від істинних марксистських принципів, він залишається прапороносцем робітничого інтернаціоналу. Приєднавшись до Комінтерну, ми зможемо об'єднати наші зусилля, щоб понести факел соціалізму по всьому світу."
 AST_communist_ideals:0 "Комуністичні ідеали"
 AST_critics_to_shame_desc:0 "Авіакатастрофа в Канберрі вплинула на всю націю, не залишивши жодного австралійця осторонь скорботи. У такі часи завжди знайдуться ті, хто прагне цим скористатися. Ми маємо викрити найгучніших критиків, показавши, чим насправді є їхня критика; спробою порушити порядок."
 AST_cultural_visionary:0 "Культурний візіонер"
 AST_diplomatic_events.15.t:0 "Громадськість Нової Зеландії чинить опір"
