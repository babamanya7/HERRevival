 SOV_soviet_japanese_reckoning:0 "Радянсько-японські розрахунки"
 SOV_sp_nuclear_reactor:0 "Ф-1"
 SOV_spanish_general_campesino:0 "§Y$SPR_valentin_gonzalez$§! ([SPD.GetFlag])"
 SOV_support_in_china_generic_desc:0 "[SOU.GetAdjective]ий уряд підтримує державу [ROOT.GetNameDef] в нашій війні проти [JAP.GetAdjective]ої армії, сподіваючися налагодити з нами тісніші зв'язки, а також повпливати на нашу політику."
 SOV_supported_japan_good:0 "Підтримали Японію в конфлікті"
 SOV_the_defense_of_moscow:0 "Оборона Москви"
 SOV_the_end_of_the_imperialist_era:0 "Кінець доби імперіалізму"
 SOV_the_left_opposition_desc:0 "Зрозуміло, що Радянський Союз відхилився від обіцяного шляху. Зараз навіть говорять про побудову соціалізму в одній країні, кинувши робітників усього світу напризволяще, замість солідаризуватися з ними. Якщо товариш Сталін не буде діяти, це обов'язково зроблять інші."
 SOV_the_military_conspiracy:0 "Військова змова"
 SOV_the_red_fleet_surface_2_dynamic_modifier:0 "$SOV_the_red_fleet_dynamic_modifier$"
 SOV_the_trade_union_as_labor_organizer_desc:0 "За капіталізму профспілки існують для того, щоб забезпечити основні права людини для робітників і захистити їх від експлуатації з боку власників фабрик. Очевидно, що в новій системі це більше не потрібно, і тому роль профспілок має зміститися в бік організації праці з метою оптимізації виробництва."
 SOV_the_workers_dictatorship:0 "Робітнича диктатура"
 SOV_transport_plane_equipment_1:0 "АНТ-9"
 SOV_ukraine_crackdown_timer_tt:0 "Одна область у регіоні Україна буде орієнтована на центристів."
 SOV_war_with_japan:0 "Війна з Японією"
 SOV_wreckers_sabotage_contruction_desc:0 "Активісти чекають наказу страйкувати на будівельних майданчиках по всій країні."
 SPA_a_great_maritime_power_desc:0 "Іспанської могутності колись боялися за океанами. Хоча наші статки зменшилися протягом століть, наш зв'язок із морями залишається. Ми приймемо нашу морську спадщину та відновимо свою присутність на водних шляхах світу."
 SPA_absorb_the_portuguese_empire_tt:0 "Усякі осердні землі §YПортугалії§! під нашим контролем стануть нашими осердними."
 SPA_burgos_offensive_mission:0 "Насувається наступ у Бургосі"
 SPA_demand_french_north_africa_desc:0 "[FRA.GetAdjective]і колонії залишилися ослабленими після падіння їхньої батьківщини. Ми повинні запропонувати свій захист, мовчки розуміючи, що відмова не є варіантом."
 SPA_directory_fascism:0 "Іспанська директорія"
 SPA_establish_asturias_carlist_cell:0 "Створити осередок карлістів в Астурії"
 SPA_establish_galicia_carlist_cell:0 "Створити осередок карлістів у Галісії"
 SPA_expand_influence_in_the_catalunya_garrison_mission:0 "Оспорюється вплив на гарнізон у Каталонії"
 SPA_expand_the_requetes_desc:0 "Поки що ми покладалися на відносно невеликі, але порівняно добре навчені сили десантних військ. Однак наші амбіції вимагають набагато більшого. Ми повинні розширити цих рекете та забезпечити необхідне навчання для всіх, хто відповідає на виклик полювання."
 SPA_heavy_tank_equipment_3_short:0 "TP 3"
 SPA_jose_antonio_giron:0 "Хосе Антоніо Хірон"
 SPA_national_recovery:0 "Національне відновлення"
 SPA_not_republican_spain_tt:0 "Не §YРеспубліканська Іспанія§!\n"
 SPA_obtain_training_staff:0 "Роздобути навчальний персонал"
 SPA_the_third_dimension_of_warfare_desc:0 "Незламний дух карлістів уже панує над землею; тепер він повинен підкорити й небо."
 SPA_the_war_in_the_north_desc:0 "Північ завжди була центром карлістського руху. Будь-яке повстання повинно бути зосереджено на тому, щоби захистити це як нашу базу операцій."
 SPA_utilize_the_intellectuals_desc:0 "Ті, хто володіє неперевершеними інтелектуальними здібностями, мають отримати ресурси, необхідні для найкращого служіння своїй країні у спосіб, яким не можуть наші війська."
 SPC_ADJ:0 "Іспанськ"
 SPECIAL_PROJECT_AVAILABLE_ALERT_TT:0 "§YДоступний спеціальний проєкт§!"
 SPECIAL_PROJECT_PHASE_TIME:0 "$DAYS|0$ дн."
 SPECIAL_PROJECT_SCIENTIST_ALREADY_ASSIGNED:0 "$CHARACTER|Y$ має призначення до проєкту $PROJECT|Y$"
 SPECIAL_PROJECT_SUPPLY_UTILIZATION_FULL_SPEED_TT:0 "Цей комплекс споживає $SUPPLY|2Y$ £supply_texticon£"
 SPEED_REINFORCEMENT_BONUS:0 "Швидкість: $VAL|+=2%$"
 SPOTTING_CHANCE_FOR_NAVAL_DOMINANCE:0 "   Шанс помічення: $VAL|1%+=$"
 SPR_all_must_do_their_part_desc:0 "Щоб соціалістична справа досягла успіху, кожна людина має зробити свій внесок у цю справу. У нас немає місця внутрішнім розколам між нашими різними громадами."
 SPR_disband_the_army_mission_tt:0 "§GЗбільшує частку армії, яка стане на бік республіканців на початку громадянської війни, з §Y50%§! до §Y80%§! і зменшує нашу кількість дивізій Африканської армії з §Y5§! до §Y3§!.§!\nЦі §Y80%§! будуть §Rрозпущені§!.\n\n§RЦе призведе до негайного початку громадянської війни!§!\n"
 SPR_enlarge_the_weapon_caches_desc:0 "Навіть до шахтарського страйку в Астурії 1934 року, по всій країні таємно виникали схованки зброї для підготовкидо неминучої потреби відстоювати наші свободи зі зброєю в руках. У ці кризові часи, нам піде на користь подальше їх розширення."
 SPR_euskalduna:0 "Euskalduna"
 SPR_expand_soviet_aid:0 "Розширити радянську допомогу"
 SPR_faith_in_the_cause_desc:0 "Немає місця поразницькому мисленню, коли весь світ проти тебе. Ми або зберігаємо нашу непохитну віру в досягнення мирного майбутнього, або падаємо."
 SPR_foreign_industrial_aid:0 "Іноземна промислова підтримка"
 SPR_global_defense_council_desc:0 "Наші кордони вийшли за межі географії Піренейського півострова, і назва, яку ми дали нашій тимчасовій раді оборони, більше не є представницькою для всіх, хто входить до неї. Ми перейменуємо нашу організацію на щось відповідне, що включатиме всіх людей на цій планеті."
 SPR_indalecio_prieto:0 "Індалесіо Прієто"
 SPR_jose_miaja:0 "Хосе Міаха Менант"
 SPR_louis_gonzalez_ubieta:0 "$SPR_luis_gonzalez_de_ubieta$"
 SPR_manuel_azana:0 "Мануель Асанья"
 SPR_nationalist_spain_neutrality_ADJ:0 "Іспанськ"
 SPR_preparing_offensive_in_progress_flag:0 "Ведеться підготовка до наступу"
 SPR_reprofessionalize_the_military:0 "Перепрофесіоналізувати армію"
 SPR_secure_the_guardia_civil_mission_tt_2:0 "Коли почнеться громадянська війна, Ви отримаєте 5 тренованих дивізій із §Y6§! батальйонами §Yпіхоти§!. Республіканці отримають 10 погано тренованих дивізій із §Y3§! батальйонами §Yпіхоти§!.\n"
 SPR_sway_leader_loyalty_mission_desc:0 "Змовники-націоналісти намагаються розширити свою підтримку серед нашого військового керівництва, і до нас дійшли чутки, що до різних осіб звертаються із заманливими пропозиціями... Залишається тільки молитися, щоби їм не вдалося схилити нікого з них на свій бік."
 SPR_tac_bomber_equipment_2:0 "Construcciones Aeronáuticas SA 3.318"
 SPR_the_threats_abound_desc:0 "Зрозуміло, що світ не погоджується з самим нашим існуванням. Куди б ми не звернулися, нас зустрічають холодно або навіть відверто вороже. Тепер нам зрозуміло: у нас немає союзників, на яких можна було б покластися. Ми повинні готуватися до війни з кожною з цих неіснуючих національних держав."
 SPR_wealth_redistribution:0 "Перерозподіл багатств"
 SSB_flags_tt:0 "[PER.GetFlag][TUR.GetFlag][IRQ.GetFlag][AFG.GetFlag]"
 SSB_saadabad_trade_agreement_desc:0 "Взаємна торговельна угода між первинними підписантами Саадабадського пакту, яка сприяє подальшій співпраці та більш інтегрованій економіці, скасовуючи всі мита та об'єднуючи ресурси."
