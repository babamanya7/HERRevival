 ETH_reinforce_dynamic_identity:0 "[Get_ETH_reinforce_dynamic_identity_name]"
 ETH_reinforce_gojjam_identity:0 "Зміцнити годжамську ідентичність"
 ETH_replace_the_abuna_desc_jimma:0 "Надто довго православна церква Теуахедо впливала на політику цієї країни. Настав час офіційно розірвати зв'язки між імперією та церквою. Натомість ми повинні шукати тісніших зв'язків з нашими братами і сестрами за вузьким морем."
 ETH_secularization_reform:0 "Секуляризація"
 ETH_securing_arms_deals_flag:0 "Забезпечення угоди про постачання озброєння"
 ETH_senedu_gebru:0 "Сенеду Гебру"
 ETH_soviet_mediation:0 "$SOV_communism_ADJ$е посередництво"
 ETH_sway_the_warlords_desc:0 "Навіть якщо ми не зможемо переконати будь-кого з могутніших Рас відкрито виступити проти $ETH_haile_selassie$, ми можемо принаймні посіяти зерно для майбутньої співпраці. Крім того, ми повинні спробувати переконати деяких менших воєначальників у перевагах співпраці з італійцями, а не проти них."
 ETH_the_heroes_of_ethiopia_desc:0 "Багато наших полководців показали себе як чудові стратеги. Незважаючи на переважну матеріальну перевагу ворога, наші воєначальники призупинили свій наступ. Ми повинні винагородити цих героїв за їхній внесок у подальше виживання [ETH.GetNameDef]."
 ETH_the_new_administration:0 "Нова адміністрація"
 ETH_the_patriots_tt:0 "Відкриває безперервний фокус §Y$ETH_supporting_the_arbegnoch$§!.\nДодає §G+10§! цілі спротиву в окупованих ворогом областях у Північній і Центральній Ефіопії."
