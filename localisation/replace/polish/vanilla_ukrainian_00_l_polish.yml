 DOD_hungary.100.b:0 "Ми не поступимося й п'яддю землі."
 DOD_hungary.102.a:0 "Забути про цю проблему."
 DOD_hungary.107.desc_SLO_independent:0 "Після кількох тижнів гарячкової активності угорських військових [HUN.GetLeader] заявляє про те, що ситуація, що склалася в Словаччині, викликає сильне занепокоєння в Угорщині і вимагає від нас деяких гарантій. \n\nКрім того, ми будемо змушені консультуватися з ними перед вступом в альянси та укладанням договорів, а дії нашої армії координуватиме їхня військова місія."
 DOD_hungary.11.a:0 "Ще один крок на шляху до повернення того, що належить нам по праву."
 DOD_hungary.118.desc:0 "Наша рішуча відсіч радянсько-угорським агресорам дала плоди. Днями «Правда» опублікувала передовицю з критикою на адресу «антисоціалістичних ревізіоністських домагань», особливо наголосивши, що претензії на Бессарабію та Трансільванію — ознака «імперіалістичної поведінки, яка не притаманна розвиненим соціалістичним країнам».\n\nРеакція Будапешта, втім, була дуже стримана. Цілком можливо, що [HUN.GetLeader] досі бажає отримати наші землі."
 DOD_hungary.129.t:0 "Німецький ультиматум"
 DOD_hungary.145.desc:0 "Переговори в Бледі зайшли в глухий кут. Ми мусимо перехопити дипломатичну ініціативу, підключивши до процесу третю сторону. Якщо ми заручимося підтримкою провідної держави, [From.From.GetLeader] може піти на поступки. До кого ми мусимо звернутися?"
 DOD_hungary.147.t:0 "[From.GetNameDefCap] втручається в ситуацію з переозброєнням Угорщини"
 DOD_hungary.151.a:0 "Звернутися до Німеччини"
 DOD_hungary.27.desc:0 "Угорський уряд заявив про те, що розглядає будь-який напад на Швецію як напад на територію Угорщини. Угорська армія приведена в стан підвищеної боєздатності і вступить у війну відразу після завершення мобілізації."
 DOD_hungary.41.t:0 "[From.GetName] висуває ультиматум"
 DOD_hungary.44.a:0 "Так ми й думали."
 DOD_hungary.5.b:0 "Ми поважатимемо підсумки референдуму."
 DOD_hungary.54.c:0 "Запропонувати переговори за участю незалежного посередника."
 DOD_hungary.59.desc:0 "Зіткнувшись із наростаючим тиском Угорщини, румуни зажадали створити незалежну групу для вирішення спору про Трансільванію. Вони звернулися до нас, щоб дізнатися, чи бажаємо ми увійти до складу цієї групи. Вони, поза всякими сумнівами, вірять, що ми відстоюватимемо їхні інтереси в цьому питанні."
 DOD_hungary.62.t:0 "Балканський криза: [From.GetNameDef] підтримує Румунію"
 DOD_romania.110.a:0 "Ми мусимо скористатися цією можливістю."
 DOD_romania.110.desc:0 "[ROM.GetLeader] звернувся до нас із ідеєю нейтралізувати державу [CZE.GetNameDef]. Згадавши наші спільні інтереси в цьому регіоні, він запропонував розділити країну на три частини. Нам дістануться західні області, Румунія отримає Словаччину, А Угорщини відійде крихітна частина території вздовж південного кордону."
 DOD_romania.115.a:0 "Ми розглянемо можливі варіанти."
 DOD_romania.31.a:0 "Сподіваюся, ми потім про це не пошкодуємо."
 DOD_romania.50.t:0 "Румунія вимагає внести зміни до складу уряду."
 DOD_romania.601.b:0 "Можливо, нам краще триматися осторонь."
 DOD_romania.61.desc:0 "Через лічені хвилини після того, як минув термін, відведений ультиматумом Белграду, ми отримали офіційне комюніке: югославський уряд розпущений, а його повноваження передані ряду місцевих урядів, кожен з яких тут же присягнув нам на вірність."
 DOD_romania.68.a:0 "До зброї!"
 DOD_yugoslavia.10.a:0 "Зрадники!"
 DOD_yugoslavia.181.d:0 "Схоже, що з заснуванням панслов'янського конгресу робітників багато представників [This.GetAdjective] робітничого класу починають підтримувати ідею входження держави [This.GetNameDef] до альянсу у вигляді комуністичної країни, чия модель розвитку — [From Зараз цей рух незначний, але багато хто [This.GetAdjective] офіційні особи побоюються, що якщо не покарати активістів належним чином за пропаганду такої ідеї, в державі [This.GetNameDef] почнуться загальнонаціональні страйки і навіть зросте парамілітаризм лівого спрямування."
 DOD_yugoslavia.184.b:0 "Розробити з цією бандою нестерпних селян!"
 DOD_yugoslavia.43.desc:0 "До нас прибув спеціальний представник із Берліну, щоб обговорити наше ставлення до Мюнхенського угоди. Схоже, [ENG.GetLeader] розраховував, що ми надамо твердішу підтримку, коли на переговорах прозвучала загроза війни. Наша держава і [CZE.GetNameDef] пов'язані єдиною долею, нагадав він. Якщо [CZE.GetNameDef] дістанеться німцям, ми опинимося в ізоляції на континенті."
 DOD_yugoslavia.502.t:0 "[From.GetPrincessName] погоджується"
 DOD_yugoslavia.503.a:0 "Можливо, добра принцеса Александра..."
