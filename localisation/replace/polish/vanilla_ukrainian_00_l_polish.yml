 SOV_moscow_trial_index_2:0 "Другий"
 SOV_multi_religious_empire:0 "Багаторелігійна імперія"
 SOV_national_academy_of_sciences_research_tt:0 "Змінити національний дух §Y$SOV_ussr_academy_of_sciences_dynamic_modifier$§! на:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+1%§!"
 SOV_no_time_for_peace_desc:0 "Як би ми цього не хотіли, надії на довготривалий мир мало. Нова зброя і технології зроблять війну ще більш руйнівною, ніж раніше, і, на жаль, ми мусимо інвестувати наші важко зароблені ресурси, щоб не відставати від наших ворогів."
 SOV_oil_production_desc:0 "Наступним логічним кроком у нашому промисловому розвитку, а також у військовій модернізації є підвищення рівня автомобілізації. Це виможе величезні запаси мастильних матеріалів і пального. На щастя, ми володіємо достатніми запасами нафти, які можуть бути використані для цього, якщо ми розвинемо необхідні галузі."
 SOV_operation_iskra_ongoing_objective_tt:0 "Мета цього наступу — прорвати облогу області §Y[195.GetName]§!, відновивши сполучення області з нашою столицею до моменту закінчення місії."
 SOV_operation_iskra_ongoing_success_tt:0 "\n§GМи прорвали блокаду §YЛенінграду§! і зараз місто з'єднане з нашою столицею.§!"
 SOV_penal_battalions_spawn_tt:0 "У м. §Y[ROOT.Capital.GetName]§! буде створено §Y4 штрафні дивізії§!. Буде відкрите рішення §Y$SOV_raise_penal_units$§!, що дозволяє піднімати §Y4 штрафні дивізії§! щороку."
 SOV_peoples_commissariat:0 "$SOV_found_the_pcdi_name_default$"
 SOV_popular_uprising_units_tt:0 "Партизани приєднуються до держави [ROOT.GetNameDef]."
 SOV_positive_heroism_desc:0 "Хоча всі досягнення членів робітничого класу поділяються всіма членами робітничого класу, ми все одно можемо вказувати на окремих людей як на приклади, яким інші мусять наслідувати."
 SOV_promote_ideological_rallies_cd_tt:0 "\nМи можемо сприяти ідеологічним мітингам у країні лише один раз."
 SOV_protect_the_white_sea_baltic_canal:0 "Захистити Біломорсько-Балтійський канал"
 SOV_protect_the_white_sea_baltic_canal_desc:0 "Канал між Балтійським і Білим морями є дивом сучасної інженерії, і не можна допустити, щоби він потрапив до рук ворога."
 SOV_purged_junior_army_officers_2_tt:0 "§YУся наземна техніка§!: Бонус до надійності: §R-20%§!"
 SOV_purged_junior_navy_officers_1_desc:0 "Значна кількість молодших офіцерів ВМС була заарештована органами НКВС за звинуваченнями в заколоті, диверсії та антирадянщині. Втрата багатьох досвідчених офіцерів і ветеранів минулих війн призвела до небезпечного розладу Червоного флоту."
 SOV_rebuild_the_nation_desc:0 "Наша зруйнована війною країна має бути відбудована. За допомогою кампаній пропаганди ми можемо забезпечити, щоб кожен чоловік, жінка і дитина зробили свій внесок у відбудову."
 SOV_reinstate_tupolev_design_bureau_desc:0 "$SOV_reinstate_mig_design_bureau_desc$"
 SOV_reinstate_yakovlev_design_bureau_desc:0 "$SOV_reinstate_mig_design_bureau_desc$"
 SOV_rejected_defensive_pact:0 "Відхилили оборонний пакт"
 SOV_reopen_novodevichi_desc:0 "Церква довгий час була позбавлена можливості виховувати нових священиків. Для того, щоб відродити Церкву, ми повинні створити місце, де вона зможе виховувати наступне покоління священиків і монахів. Старий монастир у Новодевичах здається очевидним вибором."
 SOV_return_democracy_to_the_party_unlock_left_tt:0 "§YРадники лівої опозиції§! стануть доступні."
 SOV_return_of_the_rocor_desc:0 "Російська православна церква закордоном складається з тих вигнанців, які після Громадянської війни в Росії, замість того, щоб відмовитися від своїх переконань і принципів, обрали еміграцію. Тепер, після поразки комуністичного уряду, який змусив їх до еміграції, нарешті настав час привітати їх на батьківщині та відновити їх у правах."
 SOV_sabotage_behind_enemy_lines_cost_blocked:0 "£command_power£ §R15§!"
 SOV_send_military_advisors_to_spain:0 "Надіслати військових радників в Іспанію"
