 RAJ_GOE_india_indivisible_cat:0 "Неподільна Індія"
 RAJ_GOE_pay_out_dividends_high_tt:0 "Наприкінці §Yфіскального року§! ми виплатимо $eic_high_investments_cost_tt$, назавжди видаливши це з випадкової держави. Натомість ми отримаємо велику суму додаткових інвестицій від приватних інвесторів на весь період наступного фіскального року.\n\n"
 RAJ_GOE_pay_out_dividends_normal_tt:0 "Наприкінці §Yфіскального року§! ми виплатимо $eic_normal_investments_cost_tt$, назавжди видаливши це з випадкової держави. Натомість ми отримаємо середню суму додаткових інвестицій від приватних інвесторів на весь період наступного фіскального року.\n\n"
 RAJ_GOE_provide_working_opportunities:0 "Забезпечити робочі можливості для військового персоналу"
 RAJ_GOE_seek_support_from_the_unions_tt:0 "Ми зможемо шукати підтримки від профспілок. Вони підтримають нас, якщо ми надамо їм певні поступки, зменшивши необхідний поріг популярності комунізму для завершення §Y$RAJ_royal_indian_navy_mutiny$§! на §G-10%§!"
 RAJ_GOE_spread_dissent_in_the_army:0 "Використати радикальних офіцерів для поширення інакомислення в армії"
 RAJ_agrarian_society_dynamic:0 "$RAJ_agrarian_society$"
 RAJ_an_economy_unbound:0 "Необмежена економіка"
 RAJ_artillery_equipment_3:0 "BL 5.5-inch Medium Gun"
 RAJ_azad_hind_radio_desc:0 "Щоб поширити послання визволення, ми повинні створити Радіо Азад Гінд. Ця революційна трансляція нестиме наш заклик до свободи через кордони, об'єднуючи патріотів та розпалюючи боротьбу проти колоніального гніту. Боротьба потребує голосу, і це буде наш голос."
 RAJ_bhoodan_movement_desc:0 "Через добровільний перерозподіл землі ми розширимо можливості безземельних та відновимо справедливість у сільській місцевості. Віддаючи землю назад тим, хто її обробляє, ми заробляємо не лише їхню працю, але й їхню тривалу лояльність."
 RAJ_bombay_trade_port_desc:0 "Бомбей має потенціал стати торговим портом світового класу, сприяючи імпорту та експорту великої кількості товарів. Усе, що потрібно, — це інвестиції в розширення його портових об'єктів."
 RAJ_british_pilot_training_desc:0 "Королівські ВПС погодилися прийняти індійських пілотів на навчання. Це дозволить нам створити власне авіакрило."
 RAJ_coastal_protection:0 "Захист узбережжя"
 RAJ_communism_party_long:0 "Комуністична партія Індії"
 RAJ_corporate_domination_desc:0 "У міру того, як ми консолідуємо контроль над субконтинентом, ми можемо все більше домінувати над приватним та державним секторами. З нашою метою повного контролю, прямого чи опосередкованого, ми можемо збільшити продуктивність усіх підприємств."
 RAJ_create_unit_red_eagles_tt:0 "Отримає елітну піхотну дивізію в Делі.\n"
 RAJ_demand_return_of_imperialist_colonies_desc:0 "Настав час вимагати повернення всіх імперіалістичних колоній на субконтиненті, об'єднавши всі індійські землі під одним прапором та поклавши край ері колоніального вторгнення."
 RAJ_destroyer_1:0 "$ENG_destroyer_1$"
 RAJ_douglas_gracey:0 "Даглас Грейсі"
 RAJ_extended_franchise_desc:0 "Розширення прав простого [GetRajAdjective] народу є ключовим кроком для зменшення [ENG.GetAdjective] контролю над країною."
 RAJ_forming_an_indian_doctrine_desc:0 "Настав час прокласти власний шлях. Ми розробимо індійську доктрину, що відображає наші унікальні сильні сторони та прагнення."
 RAJ_halls_of_knowlege_3_desc:0 "Освічене суспільство є основою процвітаючої імперії. Будуючи великі бібліотеки по всій імперії Моголів, ми зберігаємо стародавню мудрість, плекаємо інновації та надихаємо майбутні покоління вести імперію до неперевершеної величі."
 RAJ_heavy_fighter_equipment_1_short:0 "Blenheim"
 RAJ_hedgemony_of_the_subcontinent_tt:0 "Усі початкові землі належать [ROOT.GetName]"
 RAJ_heir_of_the_empire:0 "Спадкоємець імперії"
 RAJ_indian_national_congress:0 "Індійський національний конгрес"
 RAJ_instigate_in_brm_desc:0 "Ми оберемо [BRM.GetName] $RAJ_instigate_generic_desc$"
 RAJ_ishapore_arsenal_desc:0 "Ішапурська фабрика стрілецької зброї працює з XVIII століття та є центром нашої збройової промисловості. Тут було розроблено чимало удосконалень для зброї."
