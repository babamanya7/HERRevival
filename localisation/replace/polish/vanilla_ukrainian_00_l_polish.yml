 EST_HOL_autonomy_eu_member:0 "Європейська Естонія"
 EST_beyond_the_baltic_desc:0 "Хоча дехто наполягає на тому, що Балтійської Антанти достатньо, щоби захистити нашу маленьку країну від вторгнення, ми всі добре знаємо, що це хибна думка. Союзники допомогли нам у 1918 році в нашій боротьбі за самовизначення, і можливо було б не так безглуздо очікувати, що вони прийдуть нам на допомогу ще раз!"
 EST_corporate_chambers_idea:0 "$EST_corporate_chambers$"
 EST_disrupt_vaps_recruitment_desc:0 "Хоча вапси — це традиційно ветерани від середнього до похилого віку, серед них не бракує молодих симпатиків, які прагнуть приєднатися до них в ім'я своїх батьків і дідів. Ми мусимо знайти способи зірвати це вербування та відвернути цих молодиків від пісні фашистської сирени."
 EST_era_of_silence_desc:0 "По мірі того, як насильницький ультранаціоналістичний рух вапсів охоплює землі від Сааремаа до Вирумаа, державний старійшина мусить розпочати нову епоху для Естонії; епоху без виборів, без інакомислення та без опору. Нація мусить увійти в епоху мовчання."
 EST_events.101.d:0 "[From.GetLeader] ясно бачить цінність можливого майбутнього союзу між державами [Root.GetNameDef] та [From.GetNameDef] і погоджується на договір між націями."
 EST_events.102.t:0 "[From.GetNameDefCap] уряд відмовляється"
 EST_events.2.a:0 "We have no choice."
 EST_events.801.b:0 "Ми мусимо негайно придушити цих повстанців!"
 EST_ismaaliit_idea:0 "Isamaaliit"
 EST_look_north:0 "Поглянути на північ"
 EST_march_on_talinn_desc:0 "Тепер, коли на нашій стороні стільки ветеранських спільнот і воєнізованих естонських груп, ми впевнені, що Константін Пятс не зможе утримати нас, коли ми підемо на Таллінн. Ми вийдемо маршем до Riigikogu і недвозначно заявимо там про створення з Артуром Сірком."
 EST_prepare_underground_resistance:0 "Підготувати промисловий спротив"
 EST_proclaim_finno_ugra_desc:0 "Тепер, коли Фінляндія у нашій владі, у нас з'явилася унікальна можливість оголосити про фінську ідентичність у нашій державі. У Північній Європі багато фінно-угорських народів, і, об'єднавши їх, ми отримаємо багато нових солдатів, які зможуть битися вапсів."
 EST_rally_the_nation:0 "Згуртувати націю"
