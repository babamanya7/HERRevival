 AST_integrate_indonesia_indonesia_core_states_tt:0 "Отримує національні території на всі області §Y[INS.GetNonIdeologyName]§!."
 AST_ivan_dougherty:0 "Айван Догерті"
 AST_james_fairbairn:0 "Джеймс Ферберн"
 AST_join_comintern_desc:0 "Комунізм — наше майбутнє, тому ми маємо приєднатися до світової боротьби, яку ведуть наші товариші по всьому світу. Папа Джо покаже нам справжній шлях і поведе робітників з Австралії та інших країн у світле майбутнє."
 AST_larrikinism_desc:0 "Визначаючись як «некультурна, галаслива, але добросерда людина», ларрікінізм став уособленням австралійської культури: сувора витривалість, неповага до авторитетів і добродушний виклик перед лицем небезпеки. Австралійські солдати заслужили репутацію у Великій війні за те, що з гідністю стикалися з труднощами і сприймали все спокійно."
