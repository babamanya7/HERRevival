 GUAY_empower_the_land_owners_desc_tt:0 "Землевласники будуть більш схильні будувати високовартісні будівлі, такі як §YЦивільні фабрики§!, §YВійськові фабрики§!, §YВерфі§! та §YДодаткові слоти для будівництва§!"
