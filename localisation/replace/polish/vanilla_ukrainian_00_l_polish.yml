 CZE_skoda_max_optimization_tt:0 "Максимальний рівень оптимізації фокусу §Y«Шкоди»§! буде збільшено до 7."
 CZE_skoda_works_dynamic_modifier_desc:0 "Компанія «Шкода» охоплює виробництво, будівництво та інвестиції в усіх секторах нашої важкої промисловості. Її вплив не знає меж у межах наших кордонів."
