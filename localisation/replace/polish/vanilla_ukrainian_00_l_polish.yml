 JAP_fund_resistance_groups_in_asia_desc:0 "На нашому континенті є багато тих, хто бореться проти іноземного гніту і хто з радістю прийняв би нашу допомогу, якби ми її запропонували. Ми повинні використати це як можливість послабити західні держави та сприяти свободі й волі для всієї Азії!"
