 CHI_sea_annex_tuva_desc:0 "Тува колись була частиною нашої держави, але після революції росіяни вкрали її у нас. Ми повинні прагнути возз'єднати їх з братами на півдні та звільнити з рук росіян."
 CHI_sea_anti_opposition_campaigns_desc:0 "$CHI_anti_opposition_campaigns_desc$"
 CHI_sea_battle_for_china_desc:0 "Оскільки Центральний уряд дедалі більше відхиляється від правильної лінії партії, стає все більш очевидним, що єдиний шлях вперед — повернути контроль. Ми повинні пробити собі шлях до столиці та захопити її у держави, яка нас підвела."
