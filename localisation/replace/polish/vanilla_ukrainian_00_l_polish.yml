 CHL_avenge_the_pacification_of_araucania_desc:0 "Чилійська окупація Арауканії, яка тривала з 1861 по 1883 рік, була темним періодом в історії мапуче, і настав час помститися за несправедливість і війну, яку принесли нам чилійці. До зброї, хоробрі воїни! Поверніть те, що колись належало вам і знову стане вашим! Ушануйте спадщину Кілапана та Кауполікана!"
