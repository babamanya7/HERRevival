 bftb_turkey.99.desc:0 "Нестерпні [FROM.GetAdjective] паразити відмовилися від своїх шалених вимог. Можна було б назвати цей вчинок мудрим, але віднести цей епітет до [FROM.GetAdjective] адміністрації — значить, неймовірно їй втішити. Поки що [ROOT.GetNameDef] та [FROM.GetNameDef] збережуть світ..."
 blow_panama_canal_desc:0 "Ми не можемо дозволити нашим ворогам використовувати стратегічно місця Панамським каналом. Тому ми повинні розпочати підготовку, щоби завдати достатньо цілеспрямованої шкоди каналу, щоб він залишався непрацюючим протягом тривалого часу. Це значно ускладнить для ворога переміщення кораблів з Тихого океану в Атлантику і навпаки."
