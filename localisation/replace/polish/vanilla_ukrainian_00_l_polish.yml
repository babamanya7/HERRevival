 PRC_urbanization_desc:0 "Щоб сприяти розвитку важкої промисловості, ми повинні заохочувати колишніх самодостатніх фермерів працювати в нашій промисловості, поки держава гарантує, що інші фермери виробляють достатньо продукції для розподілу як у містах, так і в селах."
