 poland.13.a:0 "Аякже! [faction_invitee_target.GetNameDefCap] — наш друг!"
 poland.1303.a:0 "Сумно."
 poland.19.d:0 "«Я кінчаю життя самогубством. Прошу у моїй смерті нікого не звинувачувати. Я спалив усі особисті листи та документи. Якщо не все, прошу мене пробачити. Господь Усемогутній, можливо, пробачить мені мої гріхи, включно з цим останнім». Вчора ввечері рівно о 20:45 ця записка та пістолет були знайдені біля тіла Валерія Славека. Найдосвідченіші лікарі у військовому шпиталі Пілсудського не змогли врятувати Славека, і цього ранку було оголошено про смерть колишнього прем'єр-міністра. Разом із цією запискою було залишено листа, прочитати яке з волі покійного може лише [Root.GetLeader]. І хоча його вміст, як і причина такого шокуючого вчинку, залишається таємницею, свої припущення в місті [Root.Capital.GetName] будують усі підряд. Багато хто вважає, що тривала маргіналізація лівих санаціоністів і зростаюча ізоляція Славека сильно сприяли його меланхолії. Смерть найвпливовішого лідера лівих, без сумніву, засмутила багатьох."
 political.20.t:0 "Демократи вимагають референдум"
 political.25.d:0 "Багато комуністів передбачали, що [Root.GetName] стане наступною країною, яку охопить так звана міжнародна революція, але після кількох місяців страйків і червоних прапорів на вулицях рух, схоже, затих. Робітничий клас, передбачувана рушійна сила революції, має більш нагальні проблеми, ніж повалення [Root.GetLeader], і, схоже, явно не вражений тим, як добре ці революції пройшли в інших країнах. Тим часом інтелектуали, які писали палкі заклики перерізати горлянки гнобителям, виявилися напрочуд неохочими підбурювати до чогось, що могло би порушити їхній комфортний спосіб життя.\n\nРозмови про революцію, ймовірно, триватимуть чи то за дешевим пивом, чи то за дорогим вином, але це, найімовірніше, будуть лише розмови і ніщо більше."
 political.3.t:0 "Комуністи здійснюють переворот"
 political.32.desc:0 "Настав час об'єднати розділені [ROOT.GetAdjective]у державу ([ROOT.GetRulingIdeology]), яка повстала після війни. Держава [ROOT.GetNameDef] буде знову єдиною."
