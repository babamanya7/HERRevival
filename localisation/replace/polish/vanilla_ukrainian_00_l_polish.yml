 GRAND_DOCTRINE_BASE_STRIKE_DESC:0 "Бий сильно, бий першим. Нові технології морської авіації пропонують інтригуючу можливість нанесення удару по ворогу на сході сонця, перш ніж він зрозуміє, що битва почалася. Банзааай!"
