 LIT_lithuanian_activist_front_desc:0 "По всій Литві повно активістів та воєнізованих груп, і, хоч вони розрізнені та розділені ідеологією, їх об'єднує бажання боротися за Литву та зберегти її незалежність. Заснувавши Литовський фронт активістів, ми не дамо імперістам так просто."
 LIT_move_capital_to_vilnius:0 "Перемістити столицю у Вільнюс"
 LIT_peace_with_poland_desc:0 "Війна Польщі та Литви офіційно йде вже кілька десятиліть, але більшу частину цього часу жодна зі сторін не брала участі в боях. Хоча Вільнюс і залишається в руках Польщі, ми мусимо перевести це патове становище у формальний стан миру, щоби зосередитися на справжніх ворогах — західних і східних."
 LIT_seimas_idea_2:0 "$LIT_seimas_idea_1$"
 LIT_vladas_jurgutis:0 "Владас Юргутіс"
 LOADING_TIP_100:0 "«Із часів Італо-грецької війни ми більше не кажемо “греки б'ються, як герої” — ми кажемо “герої б'ються, як греки”».\n(The Montreal Daily Star, 1942 рік)"
 LOADING_TIP_103:0 "«Якщо Ви хочете повної безпеки, ідіть до в'язниці. Там Вас нагодують, одягнуть, нададуть медичну допомогу тощо. Бракуватиме лише свободи».\n(Дуайт Д. Айзенгауер)"
 LOADING_TIP_158:0 "«V — це перша буква слів “victoire” французькою, “vrijheid” фламандською... “victory” наших добрих друзів, англійців. Їхнє слово для перемоги також починається з V».\n(Віктор де Лавеле, кампанія «V for Victory»)"
 LOADING_TIP_160:0 "«Бій за свободу — це бій не одної людини ані одної держави. Це колективна боротьба кожного, хто відмовляється носити ланцюги господаря».\n(Серхіо Осменья)"
 LOADING_TIP_75:0 "«Голодні та безробітні — це матеріал, із якого створюється диктатура».\n(Франклін Д. Рузвелт)"
 LOADING_TIP_80:0 "«І ми будемо битись із ними торцями розбитих пивних пляшок, тому що це все, що в нас є!»\n(Вінстон Черчилл одразу після обіцянки битися в полях і на вулицях)"
 LOADING_TIP_97:0 "«Нам би завадило декілька таких лез, пане райхсмаршал».\n(Ервін Роммель на заяву Гьорінга, що американці вміють робити лише леза для бритв)"
 LOGIN_DESCRIPTION:0 "Насолоджуйтеся перевагами гри в мережі, хмарного зберігання, досягнень та інших майбутніх функцій акаунту Paradox."
