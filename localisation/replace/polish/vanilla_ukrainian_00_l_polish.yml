 ITA_italian_confederation_leader:0 "Лідер Італійської конфедерації"
 ITA_italian_hegemony_program_desc:0 "Програма технологічного співробітництва країн під італійською гегемонією."
 ITA_italian_heraklion_name:0 "Ераклеум"
 ITA_italian_highways_bba:0 "$ITA_italian_highways$"
 ITA_joint_maneuvers_with_country:0 "Спільні [ROOT.GetAdjective]о-[FROM.GetAdjective]і маневри"
 ITA_losing_colonies_tt:0 "Ефекти буде застосовано щоразу, коли [ROOT.GetName] втрачає контроль над §Yнеосередним регіоном§! на користь ворога, доки величина буде меншою від §Y30%§! у бік §Y$ITA_grand_council_side$§!."
 ITA_marines_and_landing_craft_desc:0 "Війни виграються не лише морською силою; ми також мусимо мати можливість переправляти наші армії хвилями та безпечно висаджувати їх на берег..."
 ITA_mario_scelba:0 "Маріо Шельба"
 ITA_mechanized_equipment_1_short:0 "CVP-4"
 ITA_military_industry_dynamic_modifier_desc:0 "Наш вітчизняний військовий комплекс відстав від наших конкурентів як у продуктивності, так і в технологіях. Ми повинні зміцнити військову промисловість Італії, якщо хочемо, щоби наші сили були успішними на полях битв."
 ITA_mio_trait_special_aerotorpedoes_unit:0 "Спеціальна аероторпедна група"
 ITA_new_colonial_policies_tt:0 "§YКожна підконтрольна колонія в Африці§! буде звільнена як §Yмаріонетка§!."
 ITA_new_industrialization_program_north_tt:0 "Національні північні конструктори будуть поліпшені."
 ITA_new_industrialization_program_south_tt:0 "Національні південні конструктори будуть поліпшені."
 ITA_new_ricostruzione_industriale_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+5.00%§!\n\n"
 ITA_northern_designer_tt:0 "Цей конструктор знаходиться в північній частині Італії. Завершення фокусів §Y$ITA_strengthen_northern_industry$§! і §Y$ITA_new_industrialization_program$§! поліпшить конструктора"
 ITA_oto_naval_guns_desc:0 "Італія покладається на фірми «Ansaldo» й «Oderi–Terni–Orlando» у створенні великих гармат для своїх основних кораблів. Здійснюючи цілеспрямовані інвестиції в їхні потужності, ми можемо зробити наші лінкори предметом заздрощів усього світу."
 ITA_oto_naval_guns_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$\n$MODIFIER_NAVY_CAPITAL_SHIP_ATTACK_FACTOR$: §G+5.00%§!\n\n"
 ITA_peace_with_ethiopia_tt:0 "\n\nПісля мирних переговорів із державою §Y[ETH.GetNameWithFlag]§!:"
 ITA_program_for_scientific_cooperation_name:0 "Програма наукової співпраці"
 ITA_refit_civilian_ships_rm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$ITA_deck_conversions_dynamic_modifier_tt$\n\n"
 ITA_regia_marina_3_alt_dynamic_modifier_desc:0 "$ITA_regia_marina_alt_dynamic_modifier_desc$"
 ITA_regia_marina_dynamic_modifier:0 "Regia Marina"
 ITA_reorganize_the_party_desc:0 "Національна фашистська партія перетворилася на застарілу та громіздку організацію, сповнену інтриг і самозвеличення. Маючи міцніший контроль над партією, ми тепер можемо почати реорганізацію з нуля, зробивши її більш ефективною та динамічною."
 ITA_scientific_cooperation_desc:0 "Ми мусимо розробити програму наукового співробітництва, щоби не відставати від технологічного прогресу інших світових держав."
 ITA_seek_papal_support_desc:0 "Щоб упоратися зі зростаючою соціальною та політичною стабільністю в нашій країні, нам потрібно буде спертися на Церкву, яка історично мала такий великий вплив на італійський народ. Ми мусимо звернутися до папи в пошуках його схвалення та підтримки."
 ITA_servizio_informazione_militare_desc:0 "Наші військові потребують точної інформації для планування своїх операцій. Для цього нам потрібна центральна організація, яка збирає та аналізує цю інформацію, а також, за необхідності, здійснює наступальні дії проти вибраних цілей."
 ITA_setting_course_desc:0 "Королівство Італія готове виконати своє призначення. Велич і слава чекають на гордий італійський народ. Настав час вирішити, як рухатися далі."
 ITA_submarine_2_desc:0 "Підводні човни класу «Perla» та «Adua» були побудовані в 1930-х роках. Вони були третім і четвертим підкласами підводних човнів серії «600», побудованих в Італії. Вони були меншими за своїх попередників, водотоннажністю трохи більше 600 тонн."
 ITA_supermarina:0 "Supermarina"
 ITA_the_eastern_threat:0 "Східна загроза"
 ITA_the_fight_overseas_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$\n$MODIFIER_NAVAL_INVASION_CAPACITY$: §G+10§!\n$MODIFIER_NAVAL_INVASION_PREPARATION_SPEED$: §G+15.0%§!\n\n"
 ITA_yugoslavia_friend_desc:0 "Замість протистояти Югославії зараз, ми можемо відкласти її остаточне завоювання до більш сприятливого часу. Натомість ми могли би подружитися з режимом і включити країну у сферу нашого впливу."
 JAM_fascism_DEF:0 "Хаймаканська імперія"
 JAN_democratic_DEF:0 "Республіка Ян-Маєн"
 JAP_EQUIPMENT_VERSION_16:0 "Kai P"
 JAP_PARF_develop_member_industry_decision:0 "Розвивати §Y[FROM.GetAdjective]у§! промисловість"
 JAP_agricultural_protectionism:0 "Аграрний протекціонізм"
 JAP_ally_the_dragon_king_desc:0 "Король-дракон Бутану править своїм відокремленим та ізольованим тибетським королівством, але, можливо, він здатен побачити ширшу картину. Ми повинні спробувати відправити офіційну делегацію до Пунакхи, щоб переконати його приєднатися до нас у справі звільнення Азії."
 JAP_alternative_communist_international:0 "П'ятий комуністичний Інтернаціонал"
 JAP_amaterasus_weapons_idea:0 "Зброя Арамітами Аматерасу"
 JAP_anti_communist_volunteers_desc:0 "Ми маємо воювати з комунізмом скрізь, де стикаємося з ним. Якщо десь ми не беремо участі у конфлікті офіційно, то там нашу ідеологію відстоюватимуть добровольці."
 JAP_arm_resistance_decision_desc:0 "Озброїти бійців опору в цьому регіоні."
 JAP_army_faction_tier_3_equal_navy:0 "$JAP_imperial_influence_tier_3$ $JAP_army_faction$"
 JAP_asian_communist_solidarity:0 "Азійська комуністична солідарність"
 JAP_battle_for_australia:0 "Битва за Австралію"
 JAP_big_zaibatsu_faction_gain_tt:0 "£imperial_influence_texticon $JAP_zaibatsu_faction$ $JAP_big_influence_gain$"
 JAP_big_zaibatsu_faction_loss_tt:0 "£imperial_influence_texticon $JAP_zaibatsu_faction$ $JAP_big_influence_loss$"
 JAP_border_conflict_back_out_of_conflict_desc:0 "Небезпека того, що цей конфлікт вийде з-під контролю і перетвориться на повномасштабну війну між нашими країнами, просто надто велика. Ми повинні скоротити наші втрати зараз і надіслати дипломатичні щупи іншій стороні."
 JAP_children_of_the_sun_desc:0 "Не тільки наш королівський рід, але й сам [ROOT.GetAdjective]ий народ є дітьми сонця. Велика богиня Аматерасу колись дала нам цю землю, і ми повинні бути вдячні за це. Настав час відплатити за те, що вона нам дала!"
 JAP_chuuichi_nagumo:0 "Chūichi Nagumo"
 JAP_crush_the_internal_factions:0 "Знищити внутрішні фракції"
 JAP_demand_tonkinese_bases:0 "Вимога баз у Тонкіні"
