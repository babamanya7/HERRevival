 ETH_SefariNameDefault:0 "Мехал Сефарі"
 ETH_amedeos_feast_of_maskal_tt:0 "Якщо фокус §Y$ETH_sway_the_warlords$§! був виконаний:\n§Y$ETH_seyoum_mengesha$§!, §Y$ETH_ayalew_birru$§! та §Y$ETH_ras_kassa$§! стануть лояльні."
 ETH_anti_colonialism_category_desc:0 "Ми зробимо все, що можемо, щоби підтримати рухи спротиву в нашому регіоні, поки імперіалістична гниль не буде нарешті прибрана."
 ETH_arms_purchases_desc:0 "Ліга Націй не змогла зупинити італійське вторгнення, замість цього вони просто проголосували за ембарго на продаж зброї обом країнам. Вони повинні розуміти, що це завдає нам більше болю, ніж [ITA.GetName]. Ми повинні мати підстави стверджувати, що нам, як законному захиснику, має бути дозволено купувати зброю на міжнародному рівні."
 ETH_arranged_expansion_modifier:0 "Зорганізована територіальна експансія"
 ETH_available_as_air_chief_tt:0 "$available_chief_of_airforce$: "
 ETH_battleship_tt:0 "[ETH.GetName] отримує лінкор [JAP.GetAdjective]."
 ETH_bomb_proofing_tt:0 "Змінити §Y$ETH_industrialization_dynamic_modifier$§! на:\n$MODIFIER_INDUSTRY_AIR_DAMAGE_FACTOR$: §G-10%§!\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+10%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5%§!"
 ETH_bop_increase_communist_influence_desc:0 "Ми мусимо забезпечити, щоби комуністи мали вплив на рішення, які приймаються центральним урядом. Ми повинні розпочати кампанію пропаганди, щоби посилити підтримку нашої справи серед людей, поки країна не розпалася."
 ETH_build_infrastructure:0 "Поліпшити інфраструктуру в області [FROM.GetNameDef]"
 ETH_can_call_allies_tt:0 "§Y[ETH.GetNameWithFlag]§! може закликати союзників до війни."
 ETH_capital_school_of_technology_desc:0 "Наші освітні реформи виявилися успішними і варті інвестицій. Ми повинні пришвидшити наш прогрес, об'єднавши експертів з інженерних справ нації в єдину технологічну школу."
 ETH_contact_the_exiles_desc:0 "Коли війна з [ITA.GetName] підійшла до кінця, багато хто втекли до сусідніх регіонів у страху перед тим, що може принести новий режим. Коли ми почнемо втілювати наші плани щодо відновлення нашої незалежності, можливо, ми зможемо переконати цю ширшу діаспору приєднатися до нас. Незважаючи на наші розбіжності в минулому, зараз настав час співпрацювати на благо Батьківщини."
 ETH_cooperation_gugsa:0 "Співпраця з ерітрейцями"
 ETH_copy_plane_designs_desc:0 "Немає сенсу переосмислювати те, що вже розроблено іншими. Ми просто відтворимо конструкції літаків інших країн і скористаємося їхніми інвестиціями в дослідження."
 ETH_defeat_italy:0 "Перемогти колонізаторів"
 ETH_ecole_militaire_haile_selassie_1er_tt:0 "Змінити §Y[GetEthiopianArmySpiritName]§! на:\n$MODIFIER_XP_GAIN_ARMY$: §G+5%§!"
 ETH_german_mediation:0 "[GER.GetAdjective]е посередництво"
 ETH_host_country_decision:0 "Попросити дозвіл установити уряд у вигнанні в державі [FROM.GetName]"
 ETH_humanitarian_aid_tt:0 "Змінити §Y$ETH_international_red_cross_dynamic_modifier$§! на:\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+10%§!"
 ETH_invest_in_the_west_desc:0 "Різні регіони [ETH.GetName] мають доступ до різноманітних ресурсів. Інвестуючи на заході, ми могли б швидко збільшити індустріалізацію виробництва одягу та скористатися наявним досвідом у цій галузі."
 ETH_invite_italian_investors:0 "Запросити італійських інвесторів"
 ETH_jah_desc:0 "Рух растафарі створив неочікувану мережу прихильників [ETH.GetName] по всьому світу. Багато хто приписує нашому Імператору [ETH.Getleader] велике релігійне значення. Деякі заходять так далеко, що стверджують, що він є втіленням Бога, або, точніше, Джа. Можливо, нам слід скористатися нашою міжнародною підтримкою, прийнявши цей растафаріанський рух."
 ETH_japanese_dockyard_investments_decision_desc:0 "Японські інвестори шукають нові інвестиційні можливості в Африці. [FROM.GetName] може стати ідеальним місцем для деяких фінансованих японцями суднобудівних підприємств."
 ETH_japanese_investments_flag:0 " Японські інвестиції наразі тривають"
 ETH_mekwanint_influence_range:0 "Мекуанинт впливають на політику"
 ETH_officer_reforms_centralized_BoP:0 "Увести політичних військових офіцерів"
 ETH_pan-africanism_desc:0 "Мета рівності, якої ми прагнемо, є антитезою експлуатації одного народу іншим, про що так багато говорять сторінки новітньої африканської історії. Якого б вигляду воно не набувало, цього зла слід уникати там, де його немає, і знищувати там, де воно існує. Наш священний обов'язок — забезпечити нарешті здійснення мрії про рівність для всіх, кому в ній досі відмовляють."
