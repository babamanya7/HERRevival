 DEN_poul_sommer:0 "$DEN_paul_sommer$"
 DEN_rally_the_finnish:0 "Згуртувати [FIN.GetFlag] фінів"
 DEN_return_occupied_territory_category_desc:0 "Іноземні держави стверджують, що захищають наші землі від усіх тягарів війни, допоки ми не будемо «визволені з мерзенного рабства», у яке нас занурила ворожа агресія. Що ж, настав час передати острови."
 DEN_science_pact_desc:0 "Незважаючи на те, що ми досягли значних успіхів у науково-технічному прогресі, оскільки наша країна робить більший акцент на промисловості, ми все ще відстаємо від деяких країн. Звернувшись до дружньої країни, ми могли б укласти взаємовигідну програму досліджень і партнерства, що ще більше прискорило б наш прогрес."
