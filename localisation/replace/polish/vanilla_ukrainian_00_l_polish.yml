 GRE_invest_back_into_neglected_siberian_regions_desc:0 "Ми запропонуємо державі [FROM.GetNameDefCap] фінансову підтримку його найбільш відсталих регіонів і попросимо знизити [FROM.GetAdjective]ий вплив на нас."
 GRE_light_tank_equipment_1_short:0 "Vickers 6-Ton"
 GRE_macedonian_generals_desc:0 "Александр Македонський колись завоював собі величезні землі, почавши зі скромної Македонії. Велич Александра у нас у крові, він і династія Аргеадів мусять стати прикладом стратегічного генія."
 GRE_panagiotis_gazis:0 "Панайотіс Газіс"
 GRE_pay_back_debt_to_the_ifc_category_desc:0 "З часів нашої війни 1829 р. за незалежність Греція забруднює в боргах, а Велика війна анітрохи не полегшила ситуацію. Якщо ми зможемо виплатити наші борги, у Греції напевно з'явиться якась подоба економічної стабільності. Є, однак, певні радикальні рухи, що перешкоджають як політичним, так і економічним угодам. Якщо поступитися цим рухам або просто пустити ситуацію на самоплив, можуть з'явитися більш радикальні варіанти розвитку...\n\n§YБорг§! перед §Yбританцями§!: [ROOT.GetDebtPercentageBritain]\n\n§YБорг§! перед §Yфранцузами§!: [ROOT.GetDebtPercentageFrance]\n\n§YБорг§! перед §Yіталійцями§!: [ROOT.GetDebtPercentageItaly]\n\nУсього виплачено §Yборгів§!: [ROOT.GetDebtPercentagePaidTotal]"
 GRE_pyrkal_organization:0 "$GRE_pyrkal$"
 GRE_rebuke_italian_investment:0 "Засудити [FROM.GetAdjective]і інвестиції"
 GRE_reclaiming_the_wayward_ally_desc:0 "Колапс Османської імперії був для нас значним полегшенням, але Турецька республіка ще небезпечніша для Греції, ніж попередні османи. Незвичайним часам — незвичайні союзи; час Греції повернути османів назад."
 GRE_scout_plane_equipment_1:0 "KEA Chelidon"
 GRE_ship_torpedo_1:0 "2x 533-мм торпедний апарат"
 GRE_strat_bomber_equipment_1:0 "EAF Sfendóni"
 GRE_super_heavy_tank_equipment_1:0 "PKD Apollo I"
 GRE_thema_nautikon_desc:0 "Колись Візантія правила морями, але й за століття після її падіння грецький народ не втратив дух мореплавства! Що стосується війн, моря ми знаємо так само добре, як і гори Пінд."
 GRE_venerate_the_ancient_hellenes_desc:0 "Хіба ми не спадкоємці великих давніх греків? Хіба ми не родичі цим майстрам полеміки, філософії та війни? Ми повернемо нашому народу почуття великої гордості, щоби знову стати дороговказом Європи."
