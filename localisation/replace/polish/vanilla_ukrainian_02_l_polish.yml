 BRN_communism_DEF:0 "Брунейська народна республіка"
 BUL_acquire_modern_tools:0 "Придбати сучасні інструменти"
 BUL_an_aegean_sea_fleet_desc:0 "Тепер, коли ми маємо присутність в Егейському морі, ми мусимо прагнути до повного панування над ним. Для цього ми не можемо покладатися лише на есмінці та підводні човни, нам потрібні кораблі більшого тоннажу в наших флотах."
 BUL_balkan_confederation_industrial_investment:0 "інвестиції у промисловість держави [FROM.GetNameDef]"
 BUL_balkan_federation_military_aid_desc:0 "Наразі ми надаємо військову підтримку [FROM.GetAdjective]ому уряду, проводячи операцію з виявлення дисидентських осередків у сільській місцевості навколо області [FROM.Capital.GetName]. Це необхідно зробити перш ніж держава вступить в альянс [GetFactionName]."
 BUL_bought_guns:0 "Придбали зброю"
 BUL_bulgarian_academy_of_sciences:0 "Болгарська академія наук"
 BUL_cooperation_appoint_bs_members:0 "Призначити членів $BUL_bs_name_gen$"
 BUL_cooperation_zveno_speech:0 "Дозволити промови $BUL_zveno_name_gen$"
 BUL_darzhavna_samoletna_fabrika_desc:0 "В потужності на ДАР в Божурищі вже виробляються болгарські винищувачі для забезпечення наших військово-повітряних сил. Тепер ми можемо інвестувати в дію на авіаційному заводі в Ловечі, з модерні інсталяції, які будуть фокусуватися на виробництві інших ліків літаків."
