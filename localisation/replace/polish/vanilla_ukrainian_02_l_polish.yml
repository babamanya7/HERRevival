 DEN_STATE_138:0 "Сконеланнен"
 DEN_align_with_overlord_desc:0 "Хоча нам вдалося зберегти високий рівень незалежності в нашій мирній угоді з [?DEN.DEN_overlord_nation.GetNameDef], ми все ще залишаємося лише маріонеткою. Однак це відкриває перед нами інтригуючі можливості. Можливо, якби ми приєдналися до [?DEN.DEN_overlord_nation.GetNameDef], ми могли б скористатися перевагами нашого сильнішого володаря і перетворити цю поразку на перемогу..."
 DEN_bop_occupation_underground_factories_desc:0 "Щоб мати кращі шанси відновити наш суверенітет, нам потрібні відповідні запаси зброї. Ми повинні побудувати секретні збройні заводи, щоб ми могли озброїти населення, коли настане день, коли нам, можливо, доведеться боротися за нашу свободу."
 DEN_bop_speak_out_in_favor_of_disarmament:0 "£BoP_left_texticon Висловитися на користь роззброєння"
 DEN_bop_unban_all_political_uniforms_desc:0 "Ми не можемо допустити, щоб заборона на політичну форму залишалася, оскільки вона обмежує права людей!"
 DEN_build_a_modern_dannevirke_desc:0 "Данці століттями будували потужні укріплення на кордонах з континентальною Європою, найвідомішим з яких є Данневірке. Оскільки [GER.GetNameDef] знову переозброюється і розбурхує великі держави навколо нас, ми повинні побудувати сучасне Данневірке, щоб захистити наші кордони."
 DEN_civilian_preparations:0 "Громадянська підготовка "
 DEN_convert_automobile_production_add_modifier_tt:0 "$DEN_add_haeren_dynamic_modifier$ $MODIFIER_ARMY_SPEED_FACTOR$: §G+5%§! \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-5.0%§!\n\n"
 DEN_convert_automobile_production_desc:0 "Настав час наказати данським автомобільним виробникам переобладнати свої цивільні виробничі лінії для участі у військових діях і підтримки нашої обороноздатності. Забезпечення власного виробництва вантажівок і підвищення рівня механізації нашої армії зробить її більш мобільною і гнучкою."
 DEN_demand_territory_category_desc:0 "Нордичний регіон належить до гегемонії Данії, тому ми можемо захистити наші братні народи. Ми маємо повне право вимагати, щоби будь-яка скандинавська територія, яка не перебуває під нашою юрисдикцією, була передана під наш захист."
 DEN_denmark_first:0 "Данія понад усе!"
 DEN_devalue_the_krone_desc:0 "Девальвація крони зробить нашу сільськогосподарську продукцію більш конкурентоспроможною на міжнародному ринку та покращить експортні можливості, що, в свою чергу, полегшить становище фермерів, які перебувають у скрутному становищі."
 DEN_devalue_the_krone_modifier_tt:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$MODIFIER_STABILITY_WEEKLY$ §G+0.10%§!\n\n"
 DEN_dominium_maris_baltici:0 "Dominium Maris Baltici"
 DEN_expand_haerens_tekniske_korps_desc:0 "Технічний корпус армії управляє Арсеналом озброєнь і Hærens Geværfabrik, який виробляє як зброю, так і боєприпаси. Розширення цих об'єктів дозволить збільшити виробництво гвинтівок та артилерії, що, звичайно, посилить наші військові можливості."
 DEN_expand_vaernepligten_modifier_tt:0 "$DEN_modify_neglected_military_dynamic_modifier$ \n$MODIFIER_MOBILIZATION_SPEED$: §G+10.00%§!\n\n"
 DEN_five_year_plan:0 "Представлення п'ятирічного плану"
 DEN_five_year_plan_desc:0 "Щоб забезпечити майбутнє нашого народу, ми повинні створити комітет, здатний розробити та впровадити нову сміливу економічну модель для [DEN.GetNameDef]. Цей новий п'ятирічний план забезпечить нам справжній розквіт і процвітання!"
 DEN_flyvertaktisk_kommando_desc:0 "Об'єднання двох різних родів військ в одну структуру недостатньо. Для того, щоб цей новий вид збройних сил був максимально ефективним і згуртованим, нам потрібно створити центральну командну структуру, яка зможе належним чином координувати військово-повітряні сили."
 DEN_flyvevabnet_dynamic_modifier_max_improved_desc:0 "$DEN_flyvevabnet_dynamic_modifier_desc$"
 DEN_imperial_fascism_DEF:0 "Данська імперія"
 DEN_import_machinery_and_material:0 "Імпорт обладнання та матеріалів"
 DEN_improved_logistics_desc:0 "Данія — заможна й родюча країна, і, використовуючи ці ресурси, ми забезпечимо харчування для наших військ і зміцнимо наші військові можливості."
