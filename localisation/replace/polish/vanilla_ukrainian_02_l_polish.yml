 china.1.a:0 "Ми досягли критичної точки!"
 china.108_PRC_SOV_reinforcements_2:0 "Буде отримано 20 дивізій"
 china.12.a:0 "Політична влада виростає зі ствола рушниці."
 china.3.t:0 "Погані китайсько-німецькі відносини"
 chinese_war_focus:0 "Війна з Китаєм"
 collectivist_ethos:0 "Дух колективізму"
 combined_arms_expert:0 "Експерт зі спільнодії родів військ"
 cominwealth_allied_research_desc:0 "Скорочення часу дослідження технологій, відомих членам Комінвелту."
 communism_drift_factor_tt:0 "$communism_drift$: $RIGHT|+=2$"
 communist_partisans_recruiting:0 "Вербування партизанів-комуністів"
 communist_revolutionary_desc:0 "§LПрибічник ідей світової революції, яка має допомогти країні, а потім — усьому світу перейти до комуністичного суспільства.§!"
 compliance_growth_tt:0 " $MODIFIER_COMPLIANCE_GROWTH$: $RIGHT|+=%1$"
 con_def_bonus:0 "Бонус до доктрини захисту конвоїв"
 concentrated_industry5_desc:0 "Великі промислові комплекси включають безліч різних виробництв, що зменшує витрати на транспорт і робочу силу."
 congo_independence_struggle.13.a:0 "Чудово!"
 congo_independence_struggle.16.t:0 "[FROM.GetNameDefCap] відступає і дозволяє нам отримати незалежність"
 congo_independence_struggle.18.t:0 "[FROM.GetNameDefCap] дозволяє нам піти"
 congo_independence_struggle.22.d:0 "Ми отримали звістку від сильно покараної делегації з [COG.GetNameDef], що вони вирішили прийняти своє місце як заморський департамент [BEL.GetName]. Наші органи громадянства та оподаткування вже почали підготовку документації для належної інтеграції цих нових громадян до нашої системи, а Колоніальний офіс розпочав розробку нової системи місцевого управління, яка ближче відповідатиме [BEL.GetAdjective] лініям."
 congo_independence_struggle.3.a:0 "Це виглядає дуже розумно. Ми погоджуємося!"
 congo_independence_struggle.8.a:0 "Добре. Ми приймаємо..."
 consolidated_aircraft:0 "Consolidated Aircraft"
 continuous_repair_desc:0 "Ми сформуємо спеціалізовані ремонтні бригади з будівельників та заводських робітників і будемо централізовано спрямовувати їх для якнайшвидшого відновлення пошкоджених об'єктів інфраструктури."
 control_all_nordic_states_tt:0 "Контролювати або зробити маріонетками всі §Yшведські§!, §Yнорвезькі§! і §Yданські§! території."
 control_lappland_metals_goal_desc:0 "Доступ до мінеральних багатств Лапландії зміцнить постачання заліза та вольфраму для альянсу, підтримуючи нашу промисловість з виробництва зброї."
 convoy_interdiction_desc:0 "Поліпшена координація дій наших підводних човнів дозволяє їм перехоплювати конвої в дорозі. Порушивши маршрути постачання ворога, ми отримаємо стратегічну перевагу."
 coordinated_strike_sabotage_communications:0 "Саботувати лінії зв'язку"
 coordinated_strike_sabotage_communications_outcome:0 "Наш загін успішно саботував зв'язок супротивника, через що той повільно реагував на наші атаки."
 country_capitulated.0.d_positive_prev_no_faction:0 "\n[From.From.GetLeader] оголосив, що боягузлива [Root.GetAdjective]а держава більше не може встояти під тиском розміщених у державі [From.From.GetAdjective]их військ. [Root.GetAdjective]а влада вирішила втекти з держави й створити уряд у вигнанні. Їхні основні війська капітулювали, а [From.From.GetNameDef] тепер контролює їхні головні території.\nПопри те, що війна проти залишків альянсу [Root.GetFactionName] продовжується, тим не менш це велика перемога для держави [From.From.GetNameDef]."
 country_resource_aluminium_tt:0 "$country_resource_aluminium$: $RIGHT|+=$"
 craven:0 "Боягуз"
 cult_of_the_signal_flag_spirit:0 "Культ сигнальних прапорів"
 cv_plane_range_upgrade_desc:0 "$plane_range_upgrade_desc$"
 czech.16.d:0 "Чехи спочатку відчували сумніви, але зрештою зрозуміли, якою серйозною загрозою є більшовизм, і звернулися з проханням прийняти їх у Вісь. Уряд, яким керує [CZE.GetLeader], поспішив заявити про те, що це ніяк не позначиться на статус Судетської області."
 czech.19.d:0 "Уряд, яким керує [From.GetLeader], нарешті усвідомив те, що ми зрозуміли вже дуже давно: [From.GetNameDef] виживе лише під нашим захистом. Це позбавить нас можливості окупувати їхню територію безпосередньо, Зате у нас з'явиться покірний союзник, а інші країни не зможуть втручатися у його справи."
 czech.21.d:0 "Кажуть, що, дізнавшись про нашу пропозицію, [From.GetLeader] вигукнув \"Не в цьому житті!\" і промовив довгу промову про ущербність нашого народу, нашого державного устрою та лідерських якостей, яких нібито позбавлений [CZE.GetLeader]. Ми поки що не отримали офіційної відмови, але у нашого посла майже не залишилося надії."
 czech.22.t:0 "Судетське питання"
 czech.25.d:0 "Влада держави [From.GetNameDef] вирішила підтвердити свою прихильність до альянсу «Мала Антанта», забутого в останні роки через зростання німецького впливу. Їх міністр закордонних справ відвідав нещодавно нашу столицю для обговорення питання, не бажаємо ми стати постійними учасниками цього альянсу."
 d_collaboration_DESC:0 "Додає колаборацію проти обраної держави. Клацніть ПКМ, щоб обрати країну та введіть «collaboration 0.3»"
 damage_to_naval_base_low:0 "Наліт на морську базу"
