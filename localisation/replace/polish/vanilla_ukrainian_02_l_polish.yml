 HUN_institute_for_industrial_techniques:0 "Інститут промислових технологій"
 HUN_institute_for_industrial_techniques_desc:0 "Несистематичний розвиток технологій помітно знизив темпи зростання промисловості. Слід створити новий інститут, який б цілеспрямовано зайнявся дослідженнями в галузі індустріальних методик."
