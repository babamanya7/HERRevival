 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED_DESC:0 "Середня швидкість оперативної групи занадто низька, що погіршує її здатність виявляти кораблі. Слід відняти повільні кораблі або додати швидші."
