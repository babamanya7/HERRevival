 JAP_women_in_industry_desc:0 "Занадто довго від жінок очікували, що вони залишатимуться вдома і піклуватимуться про сім'ю. Якщо жінка здатна бути лідером нашої країни, то справедливо дозволити їм працювати і в інших галузях. Це лише сприятиме економічному майбутньому [ROOT.GetNameDef], оскільки значно розширить нашу робочу силу."
