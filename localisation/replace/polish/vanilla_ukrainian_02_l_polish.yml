 PLC_UNIFIED_neutrality_DEF:0 "Річ Посполита"
 POLITICS_REMOVE_IDEA_DESC:0 "Ви справді хочете видалити ідею $IDEA|Y$ за £pol_power $COST|-0$?"
 POL_BEL_autonomy_eu_member_DEF:0 "Європейська Польща"
