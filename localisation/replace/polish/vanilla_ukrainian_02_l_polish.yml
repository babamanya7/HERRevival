 UNITS_VIEW_BTN_TRAIN_UNITS_TOOLTIP:0 "Клацніть, щоби почати §Gтренування§! цієї армії. Військові частини споживатимуть оснащення, взамін отримуючи досвід. Ваша країна також отримуватиме £army_experience£ досвід армії від кожної частини, чий рівень не менший, ніж $VAL|Y$ — $NAME|Y$."
