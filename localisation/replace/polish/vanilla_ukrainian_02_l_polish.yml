 NSB_soviet_communist_civil_war.001.t:0 "[GetSovietCivilWarName]"
 NSB_soviet_fascist_tsarist.14.desc:0 "Несправедливість, яку зазнала наша держава десятиліття тому, тепер, нарешті, виправлена. У належно пишній і помпезній церемонії, проведеній в Успенському соборі, великий герцог Володимир Кирилович був коронований як цар. Цар очолив процесію з воріт Кремля, вітаючи радісний народ, і особисто відвідав вражаючий парад на свою честь.\n\nУ своїй пишній промові новий монарх звеличив чесноти російського народу і поклявся знову повернути націю на вірний шлях, щоб та повернула собі славу."
 NSB_soviet_fascist_tsarist.22.a:0 "Ця нова Вісь — та, навколо якої буде обертатися світ!"
 NSB_soviet_fascist_tsarist.27.desc:0 "[GER.GetAdjective] уряд повідомляє нам, що, незважаючи на всі зусилля, японці, на жаль, відхилили нашу пропозицію альянсу."
 NSB_soviet_fascist_tsarist.32.a:0 "Будь-який союзник у боротьбі з більшовизмом нам буде до речі."
 NSB_soviet_foreign_politics_events.11.b:0 "Ми самі вирішимо, як нам себе захищати."
 NSB_soviet_foreign_politics_events.152.b:0 "Ми не будемо на них давити — поки що..."
 NSB_soviet_foreign_politics_events.155.a:0 "Вічно на них не можна покластися..."
 NSB_soviet_foreign_politics_events.287.desc:0 "Вчора [SIK.GetLeader] в офіційній заяві оголосив про вихід Сіньцзяну зі складу альянсу [ROOT.GetFactionName] і негайно скасував всі [ROOT.GetAdjective] угоди.\n [ROOT.GetName] знаходиться на межі колапсу, а вороги насідають зі сходу та заходу, Сіньцзяну час посилити зв'язки зі своїми східними китайськими сусідами та братами, щоб разом протистояти іноземним окупантам."
 NSB_soviet_nationalist.001.b:0 "Це законна [ROOT.GetAdjective] територія!"
 NSB_soviet_paranoia_system_events.21.desc:0 "Розслідуючи троцькістську змову в армії, НКВС виявив докази того, що генерал [?ROOT.SOV_purged_character_for_loc.GetName] в минулому критично висловлювався про те, як діяв Льва Троцького у справі революції під час громадянської війни на допиті [?ROOT.SOV_purged_character_for_loc.GetName] спершу стверджував, що [ROOT.GetLeader] — його кумир, і клявся у вірності, але потім розколовся і зізнався, що з ним виходили на зв'язок троцькістські агенти, щоб утворити в армії контрреволюційний осередок, який потім займався б саботажем проти Червоної армії."
 NSB_soviet_paranoia_system_events.24.c:0 "Закінчити слідство, не виносячи висновку."
 NSB_soviet_paranoia_system_events.39.t:0 "Велика чистка — суд над адміралами"
 NSB_soviet_policies_of_collective_security.3.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 NSB_soviet_policies_of_collective_security.6.a:0 "Тепер підемо і поговоримо з поляками."
 NSB_soviet_policies_of_collective_security.9.a:0 "Вони почули голос розуму."
 NSB_soviet_soviet_german_trade_agreement.1.t:0 "Радянсько-німецька торговельна угода"
 NSB_soviet_soviet_german_trade_agreement.2.a:0 "Червоному флоту це піде на користь."
 NSB_soviet_soviet_german_trade_agreement_tech_bonus_name:0 "Радянсько-німецька торговельна угода"
 NSB_soviet_spanish_civil_war.1.desc:0 "Вчора в Кронштадт прибув корабель, повний іспанських біженців, що залишили країну через неминуче падіння їх уряду в результаті громадянської війни. Їх прийняла наша делегація з міста [ROOT.Capital.GetName]. Серед біженців був великий комуністичний борець [?SOV.SOV_spanish_general.GetName], з яким провели бесіду наші представники. [ROOT.GetNameDef], щоби залікувати свої рани і знайти тих, хто допоможе їм звільнити іспанський народ, також він попросив [ROOT.GetAdjective] уряд визнати його військове звання і прийняти його на службу, щоб він міг і надалі боротися з фашизмом та імперіалізмом."
