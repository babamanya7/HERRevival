 SOV_the_rush_for_berlin:0 "Гонка за Берлін"
 SOV_tranformation_of_nature:0 "Перетворення природи"
 SOV_trigger_first_moscow_trial_tt:0 "Станеться подія §YПерший московський процес§!."
 SOV_victory_over_devastation:0 "Перемога понад розоренням"
 SOV_vladimir_kasatonov:0 "Володимир Касатонов"
 SPANISH:0 "Іспанська"
 SPA_a_fleet_worthy_of_a_king_desc:0 "Наш флот має бути значно розширений, якщо монарх хоче стверджувати свою волю через океани. Нова військово-морська інфраструктура буде побудована негайно."
 SPA_anti_republican_offensive:0 "Антиреспубліканський наступ"
 SPA_banish_the_party_leaders_desc:0 "Окреме партійне керівництво Фаланги та Карлістів усе більше намагається просувати свої власні плани, виявляючись шипою в нашому боці. Використовуючи їхню роз'єднаність, щоб підірвати їхні позиції, ми можемо виправдати вигнання цих непокірних лідерів із країни, замінивши їх маріонетками, вірними Франко."
 SPA_carlism_desc:0 "У 1830 році король Фердінанд VII оприлюднив Прагматичну санкцію та зробив свою дочку, майбутню Ізабеллу II, спадкоємицею. Цей вчинок усунув його брата Інфанта Карлоса з лінії спадкування, і тому, після смерті короля, прихильники Інфанта Карлоса розпалили серію громадянських воєн, об'єднавшися під прапором карлізму та борючись за відновлення Салічної лінії спадкування. \n\nСтоліття по тому рух карлістів усе ще дуже живий, а його війська, відомі як Requetés, невпинно тренуються, готуючися до того часу, коли вони знову знадобляться для захисту християнства та повернення законного короля."
 SPA_communism_ADJ:0 "Іспанськ"
 SPA_destroyer_4_desc:0 "The Álava-class destroyers were launched postwar as upgrades to the previous Almirante Antequera class (which was a subclass of the earlier Churruca class). They displaced 1,710 tons and had four 120mm/45 Vickers-Armstrong Mk Fs as their main guns. Their speed and range were comparable to the earlier designs that the class built upon."
 SPA_disjointed_carlist_juntas:0 "Розрізнені карлістські хунти"
 SPA_domestic_industrial_developments_desc:0 "Західні інновації можна адаптувати для іспанського робітника, взявши найкраще з обох світів і поліпшивши відновлення нації."
 SPA_expand_influence_in_the_baleares_garrison_mission:0 "Оспорюється вплив на гарнізон Балеарських островів"
 SPA_fuse_the_parties_desc:0 "Необхідну основу було закладено, і настав час об'єднати Фалангу та карлістів у єдину партію на чолі з Франсіско Франко."
 SPA_guadalajara_offensive:0 "Наступ у Гуадалахарі"
 SPA_heavy_tank_equipment_2_short:0 "TP 2"
 SPA_portuguese_aid:0 "Португальська підтримка"
 SPA_retake_the_americas_desc:0 "Великі латиноамериканські держави не мають наміру прийняти наше лідерство добровільно — і ми не повернемо наші старі володіння від держави [USA.GetNameDef] без бою. Хоча виклик великий, реалізація наших імперських амбіцій близька, якщо тільки ми зможемо його подолати."
 SPA_submarine_4_desc:0 "The three submarines of the Spanish D class were all launched in 1944 and commissioned at various times after the war. All three were designed and built in Spain. They were large, oceangoing submarines, displacing 1,050 tons. They were armed with six 533mm torpedo tubes and had excellent speed and range."
 SPA_the_iberian_pact_tt:0 "Ця угода зобов'язує будь-яку зі сторін приєднатися до будь-якого альянсу або тієї самої сторони в будь-якій війні, до якої приєдналася інша.\n"
 SPA_unite_iberia_desc:0 "Португалія й Іспанія колись були об'єднані, і дехто сказав би, що вони повинні стати знову. Ми погоджуємось. Іберійське об'єднання незмірно зміцнить наше становище у світі."
 SPA_valencia_offensive:0 "Наступ у Валенсії"
