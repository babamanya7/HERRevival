 RULE_ALLOW_RELEASE_NATIONS_ALL_NATIONS_SUDETENLAND_TOOLTIP:0 "Цю державу не можна звільнити."
 RULE_FASCIST_HISTORICAL_ITA_AI_DESC:0 "§HІталійський§! ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_HISTORICAL_LAT_AI_DESC:0 "§HЛатвійський§! ШІ більшу частину кампанії лишиться нейтральним, але країна стане радянською маріонеткою в 1940-х."
 RULE_OPTION_9:0 "9 рівень"
 RULE_OPTION_ALLOWED:0 "Дозволено"
 RULE_OPTION_AUS_COMMUNIST_AI:0 "$RULE_OPTION_COMMUNIST$"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC:0 "ШІ спробує стати комуністичним і повалити уряд, перш ніж зблизитися з СРСР і вступити до Комінтерну."
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC:0 "ШІ спробує приєднатися до Союзників, відновивши демократію в Австрії."
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC:0 "ШІ спробує утворити Дунайську федерацію, запросивши інші країни, розташовані вздовж Дунаю, під своє демократичне крило."
 RULE_OPTION_COG_COM_REVOLUTION_AI:0 "Революція Сімби"
 RULE_OPTION_DEMOCRATIC_HISTORICAL_USA_AI_DESC:0 "§HАмериканський§! ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_OPTION_DEMOCRATIC_SIA_AI:0 "$RULE_OPTION_DEMOCRATIC$"
 RULE_OPTION_DEN_FASCIST:0 "Фашистська Данія"
 RULE_OPTION_FALANGIST_DESC:0 "§HФалангісти§! на чолі з Хосе Антоніо Прімо до Ріверою відхилять карлізм і спробують відновити іспанський імпералізм."
 RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY:0 "GOE — Ост-Індійська компанія"
 RULE_OPTION_HISTORICAL_PHI_AI_DESC:0 "Філіппіни й надалі будуть дотримуватися курсу, узгодженого зі Сполученими Штатами."
 RULE_OPTION_ITA_DEMOCRATIC_PLAN:0 "Італійський соціалізм"
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE:0 "Монархізм — Римська імперія"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0 "ШІ спробує переконати країни навколо Швайцарії приєднатися до конфедерації та озброїть країну, щоб підготуватися до того, щоб власники тих держав відмовлялися дозволити своїм державам бути вільними."
 RULE_RESEARCH_AOT:0 "Дослідження з випередженням часу"
