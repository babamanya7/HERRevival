 NSB_poland_communist_events.301.desc:0 "[From.GetNameDefCap] відмовляється переходити в Співдружність соціалістичних республік. Ця відмова не означає кінець [Root.GetAdjective]их амбіцій у регіоні, але ясно показує, що мирні відносини з державою [From.GetNameDef."
