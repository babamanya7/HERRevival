 POL_VICTORY_POINTS_3581:0 "Прешув"
 POL_VICTORY_POINTS_9570:0 "Вроцлав"
 POL_agrarian_reform_desc:0 "На горизонті майорить селянський страйк. По всій країні ціни на продукти харчування стрімко зростають, а наша роз'єднана промисловість та бездіяльність уряду щодо допомоги найбіднішим верствам населення викликають великі хвилювання серед селян. Однак за умови достатніх інвестицій та реформ ми зможемо стати більш ніж спроможними задовольнити вимоги селян."
 POL_april_constitution_3_desc:0 "$POL_april_constitution_1_desc$"
 POL_assert_eastern_claims:0 "Висунути претензії на схід"
 POL_assert_western_claims_desc:0 "Кордони Польщі, здається, випадково не включають багато її колишніх територій, які відтоді стали великими промисловими центрами. Було б корисно для бермонтської справи, якби вони знову опинилися під польським контролем."
 POL_ban_the_nazi_party:0 "Заборонити Нацистську партію"
 POL_belorussian_army:0 "Білоруська армія"
 POL_can_boost_in_benelux_tt:0 "Будуть відкриті рішення: §YПросувати фалангізм у Бенілюксі§!."
 POL_carrier_3:0 "Клас «Stanisław August»"
 POL_dismantle_capitalist_empires_desc:0 "Капіталізм — природний ворог соціалізму, і тепер, коли в Польщі перемогла революція, ми повинні використовувати нашу позицію як засіб для демонтажу капіталістичного імперіалізму в усьому світі, починаючи з повного демонтажу всіх колоніальних імперій."
 POL_dissolve_the_bbwr_desc:0 "Ліві стали настільки впливовими і могутніми всередині диктатури, що титул президента для Мосціцького видається в кращому випадку символічним. Залишилося лише зробити його офіційним і ліквідувати всі сліди Замку в уряді, піднявши Славека на найвищу вершину влади в державі."
 POL_escelate_the_strike_desc:0 "Рішення режиму налагодження про швидке просування селянського страйку на один етап. Це рішення не мусить бути видимим, якщо не ввімкнено режим налагодження."
 POL_expand_polish_intelligence_no_mtg:0 "$POL_expand_polish_intelligence$"
 POL_force_polish_upper_class_desc:0 "Будучи молодою нацією, яка нещодавно отримала свободу, багато поляків займають лише нижчі економічні верстви суспільства. Наша нація не зможе вистояти, якщо ми не створимо елітний клас, який майже від народження буде підготовлений до управління країною."
 POL_ford_free:0 "$POL_ford$"
 POL_heavy_tank_equipment_3:0 "45TP Bestia"
 POL_hohenzollern_desc:0 "Німці вбачали в Гогенцоллернові правителя нового Королівства Польща, а наші тісні дипломатичні зв'язки з Румунією роблять румунську королівську родину ідеальною кандидатурою на роль польського короля."
 POL_konstanty_drucki_lubecki:0 "Константи Друцький-Любецький"
 POL_light_tank_equipment_3_short:0 "9TP"
 POL_nationalist_constitution:0 "Націоналістична конституція"
 POL_ozon:0 "Тріумф ТНЄ"
 POL_preserve_baltic_independence_desc:0 "Хоча уряди країн Балтії здебільшого недемократичні і капіталістичні, вони так само, як і ми, стикаються із загрозами зі Сходу та Заходу, і краще, щоб ми підтримували їхні буржуазні диктатури, ніж дозволили їм підкоритися імперіалістичним амбіціям Німеччини і Росії."
 POL_protect_czechozlovakia:0 "Захистити Чехословаччину"
 POL_restore_kuban_cossacks_desc:0 "Зрада кубанських козаків стала головним поворотним моментом громадянської війни в Росії, який забезпечив поразку білих. Цього разу ми запевнимося, щоби Кубань очолив уряд, який залишиться лояльним до нас."
 POL_right_paramilitarism_idea_desc:0 "Військова молодь Польщі — це організація, заснована Едвардом Ридзом-Сміглим і керована впливовим фалангістом Єжи Рутковським. Хоча організація офіційно існує для створення військової молоді, її програма ефективно впроваджує фашистські ідеали у вразливі уми молодих людей."
 POL_sanation_left_opposition_4_desc:0 "[Root.GetLeftDesc] Наразі ліві санаціоністи перебувають на межі спроби перевороту в уряді. Втомлений постійною маргіналізацією, ніхто не знає, що зробить Славек."
 POL_stanislaw_kopanski:0 "Станіслав Копанський"
 POL_start_central_industrial_region:0 "Розширити краківську промисловість"
 POL_state_national_council_desc:0 "Санаціоністи мають Квітневу конституцію, щоб кодифікувати свої переконання, і нам давно пора зробити те ж саме. Буде створено Державну національну раду, яка об'єднає соціалістичних політиків з усієї Польщі для виправлення реакційних законів санації."
 POL_submarine_3_desc:0 "Клас «Sokół» складався з двох британських підводних човнів типу «U», побудованих для ВМС Польщі в 1941–1942 рр. Човни мали водотоннажність у 540 тонн і були озброєні чотирма 533-мм торпедними апаратами, а також були оснащені радаром та сонаром британського виробництва та могли занурюватися на глибину до 60 метрів."
 POL_support_monarchy_in_LIT_cat_desc:0 "Оскільки [Root.GetLeader] тепер сидить на [Root.GetAdjective]ому троні, ми маємо божественне право вимогти область [Root.GetRoyalClaim] як законну частину нашої нації.\n\nНаша поточна сила вимоги становить [Root.GetPolRoyalClaimStrength]."
 POL_tac_bomber_equipment_1:0 "PZL.37 Łoś"
 POL_the_cyclometer_no_mtg_desc:0 "$POL_the_cyclometer_desc$"
 POL_vauxhall:0 "Vauxhall Poland"
 POL_warsaw_main_railway_station_desc:0 "Варшава — вузол транспортних і вантажних перевезень. Щоб уникнути вузьких місць, необхідно докласти додаткових зусиль до управління її залізницею."
 POL_woo_the_sanation_generals:0 "Домогтися прихильності генералів-санаціоністів"
 POL_xawery_czernicki:0 "Ксаверій Черніцький"
 POL_zygmunt_piasecki:0 "Зигмунт Пясецький"
 POR_a_royal_wedding_desc:0 "Шлюб між домом Дуарте Нуну де Браганса, законним спадкоємцем португальського престолу, та принцесою Марією Франсішкою Орлеанською, дочкою претендента на бразильський престол, порадує монархічні елементи в Португалії та Бразилії."
 POR_bento_goncalves:0 "Бенту Гонсалвеш"
 POR_develop_mozambique_desc:0 "Розвиваючи інфраструктуру та промисловість у Мозамбіку, ми зможемо використовувати його джерела алюмінію на нашу користь."
 POR_iberian_summit:0 "Іберійський самміт"
 POR_jose_hipolito_raposo:0 "Жузе Іполіту Рапозу"
 POR_limited_self_rule_desc:0 "Збільшуючи автономію наших африканських колоній, дозволяючи їм формувати власний уряд, ми можемо зосередитися на більш нагальних справах. Ця деколонізація може наблизити нас до демократій у всьому світі."
 POR_medium_tank_equipment_2_short:0 "CDC-4"
 POR_popular_front_desc:0 "Народний фронт Іспанії показує шлях. Ми повинні об'єднати комуністів, соціалістів та анархістів у широкий фронт, який очолить опір фашизму та світовій революції."
 POR_support_a_spanish_monarchy_in_the_war:0 "Підтримати іспанську монархію у війні"
 POR_support_the_spanish_republic:0 "Підтримати Іспанську республіку"
 POR_unreliable_army:0 "Ненадійна армія"
 PRC_28_bolshevik_faction_decision_legitimize_faction_leader_desc:0 "Ворог мого ворога — наш друг. Ми повинні відкласти наші розбіжності, щоб зосередитися на загарбнику"
 PRC_agricultural_reformist:0 "Аграрний реформатор"
 PRC_allow_autonomous_regions_desc:0 "Унікальні вимоги кожного регіону Китаю слід визнати, надавши певний ступінь автономії."
 PRC_appoint_chang_qiankun_desc:0 "Після навчання у Військово-повітряній інженерній академії імені Жуковського в Радянському Союзі Чан Цянькунь є ідеальним кандидатом для керівництва нашими військово-повітряними силами."
 PRC_ask_for_soviet_lend_lease:0 "Попросити радянський ленд-ліз"
 PRC_base_builder:0 "Будівничий бази"
 PRC_bolshevik_urbanization_2_desc:0 "Створення робочих місць у містах для заохочення сільського населення до переїзду туди було б не лише вигідним для нашої економіки, але й посилило б наш вплив у містах, які ставлять під сумнів революцію."
 PRC_every_peasant_a_soldier_desc:0 "Кожна працездатна людина, яка працює в полі, також повинна бути готова взяти до рук зброю, якщо нація цього потребуватиме.\n\n«Революційна війна — це війна народних мас; вести її можна лише мобілізувавши маси та спираючись на них»."
 PRC_extend_emergency_measures_desc:0 "Ми як ніколи близькі до вирішення наших найважливіших проблем, але ми повинні продовжити наші зусилля, інакше вони будуть марними."
 PRC_focus_on_china:0 "Зосередитися на Китаї"
 PRC_generic_communist_revolutionary:0 "$CHI_zhang_guotao$"
 PRC_guerilla_suppression_sea_cat:0 "Кампанії з придушення партизанів"
 PRC_guerilla_warfare_sea_cat:0 "Партизанська війна"
 PRC_heavy_fighter_equipment_2:0 "JH-2"
 PRC_holding_half_the_sky:0 "Тримати половину неба"
 PRC_infiltrate_henan:0 "Проникнути в Хенань"
 PRC_infiltration_succesful:0 "§GПроникнення успішне§!\n"
 PRC_invite_the_dixie_mission_desc:0 "Як держава, що зростає в Азії, ми повинні дізнатися, чи зацікавлені [USA.GetNameDef] у встановленні дипломатичних зв'язків. Можливо, вони, на відміну від імперіалістичних держав навколо нас, будуть готові допомогти побудувати Китай, який зможе захистити себе від зовнішніх загроз."
 PRC_medium_tank_destroyer_equipment_3_short:0 "PTZ 43"
 PRC_mobile_warfare_desc:0 "Ми не можемо вічно ховатися по лісах та горах. Настав час дати ворогові рішучий бій і показати всьому світу, що ми не боїмося відкритого протистояння."
 PRC_prepare_for_war_with_japan:0 "Підготуватися до війни з Японією"
 PRC_provoke_japan:0 "Спровокувати Японію"
 PRC_raid_weapon_depots:0 "Рейд на склади зброї"
 PRC_reclaim_the_grasp_of_power:0 "Повернути владу"
 PRC_revolutionary_military_commission:0 "Революційна військова комісія"
 PRC_sea_literacy_programs:0 "$PRC_literacy_programs$"
 PRC_sea_move_capital:0 "Перенести столицю"
 PRC_sea_soviet_advisors_desc:0 "У Рад є кілька агентів, що діють у Китаї. Ми повинні завербувати їх і використовувати їхній досвід, якщо хочемо перемогти націоналістичний уряд."
 PRC_sea_strengthen_the_central_secretariat_desc:0 "$PRC_strengthen_the_central_secretariat_desc$"
 PRC_send_wang_ming_to_soviet:0 "£BoP_left_texticon Вислати §Y$PRC_wang_ming$§! до [SOV.GetName]"
 PRC_shorter_market_plan:0 "Короткострокові ринкові плани"
 PRC_slight_mao_support_range:0 "Slight Support of Mao"
 PRC_strong_28_support_range:0 "Strong Support of the 28½ Bolsheviks"
 PRC_tech_agreement_with_ussr_desc:0 "Розвинений стан нашої революції дозволяє нам зробити внесок у вигляді досліджень у наше партнерство з [SOV.GetNameDef]. Коли ми наздоженемо їхні технології в різних галузях, ми зможемо поділитися нашою оцінкою їхнього обладнання, вільною від упереджень, властивих розробникам."
 PRC_the_westward_expedition_desc:0 "[NXM.GetNameDefCap] на заході дає чудову можливість для розширення. Якщо ми організуємо сутичку на кордоні [1045.GetName], ми зможемо скористатися тим, що вони не звертають на нас уваги."
