 NORDIC_expand_naval_base_network:0 "Розширити мережу морських баз"
 NORDIC_jet_engines_desc:0 "Нові досягнення в реактивних двигунах роблять найкращі гвинтові літаки класу схожими на паперових повітряних зміїв, що безцільно дрейфують. Настала нова ера повітряних боїв, у якій домінуватимуть реактивні двигуни. Якщо ми разом об'єднаємо наші інвестиції в поле, ми можемо перескочити наших ворогів і створити вершину харчового ланцюга літаків."
 NORDIC_joint_special_forces:0 "Спільні сили спеціальних операцій"
 NORDIC_monarchist_first_selector_left:0 "Велике Князівство Морів"
 NORDIC_nordic_electronics:0 "Північна електроніка"
 NORDIC_nordic_electronics_desc:0 "Електроніка тут, і вона може стати вирішальним чинником війни в майбутньому. Ми не можемо дозволити нашому ворогу перемогти нас у гонці електронних озброєнь. Розвиваймо разом цю електроніку, щоб ця нова сила була на нашому боці."
 NORDIC_nordic_university_desc:0 "Плейсголдер"
 NORDIC_promote_nordic_unity_desc:0 "Ми повинні нагадати нашим сусідам про нашу спільну історію та нашу традицію допомагати один одному, навіть якщо це було досить спорадично."
 NORDIC_radar_expansion_desc:0 "Плейсголдер"
 NORDIC_research_capstone_unlock_TT:0 "Це відімкне додаткові гілки фокусів для §Y$NORDIC_nordic_research$§!."
 NORDIC_standarized_parts:0 "Стандартизовані частини"
 NORDIC_submarine_cooperation_desc:0 "Позбавивши ворогу можливість перевозити війська та постачання морем, ми вже наполовину виграли війну. Найкращий спосіб забезпечити це — спільно працювати над виробництвом найсучасніших підводних човнів."
 NOR_alfred_roscher_lund:0 "Альфред Рошер-Лунд"
 NOR_alt_dem_prioritize_production_desc:0 "Нашій військовій машині потрібне обладнання, і воно потрібне зараз! Нехай заводи безперервно працюють, щоб наші відважні солдати мали засоби перемогти наших ворогів, незалежно від ціни."
 NOR_complacent_cabinet_ns_desc:0 "Той факт, що Юганові Нюгошволду вдалося створити стабільний уряд — значне досягнення. Однак він і його кабінет уважають, що це було останньою перешкодою. Чого вони не знають, то це того, що це була лише перша з багатьох перешкод."
 NOR_crush_big_communist:0 "Розбити [?GLOBAL.platonic_big_communist.GetNameDef]"
 NOR_decision_industrial_takeover_title:0 "Промислове захоплення області [FROM.GetName]"
 NOR_deploy_state_preparation_fascist:0 "[get_deploy_prep_decision_name_fascist]"
 NOR_enhance_coastal_defense_desc:0 "Розширеність наших узбереж — це палка з двома кінцями. З одного боку, це дозволяє нашим людям процвітати в морі, а з іншого — це означає, що ворог має величезний доступ для морського вторгнення."
 NOR_exiled_convoys_TT:0 "§G+$RIGHT|0$§! конвоїв буде додано до національного запасу після вигнання"
 NOR_expanded_conscription_ns:0 "Розширений призов"
