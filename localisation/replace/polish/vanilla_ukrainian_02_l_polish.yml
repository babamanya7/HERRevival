 EST_formalize_baltic_entente:0 "Затвердити Балтійську Антанту"
 EST_herbert_brede:0 "Герберт Бреде"
 EST_join_the_allies:0 "Приєднатися до Союзників"
 EST_long_push_east_desc:0 "Ми не очікували, що наша кампанія пройде настільки добре, але зрештою ми зі зброєю в руках пробиваємо собі шлях до серця ворожої території. Землі супротивника великі, а наші малі, тому треба готуватися до непростої подорожі."
 EST_national_council_idea:0 "Національна рада Естонії"
 EST_unite_karelia:0 "Об'єднати Карелію"
 EST_unite_the_finnic_identity:0 "Об'єднати фінські народи"
 ETH_ITA_fascism_autonomy_integrated_puppet:0 "Італійська Східна Африка"
 ETH_anti-tank_guns_desc:0 "[SWE.GetName] має одні з найкращих складів зброї у світі. Незважаючи на технічну нейтральність у зовнішніх справах, [SWE.GetAdjective]ий уряд може бути готовий розлучитися з деякими своїми протитанковими гарматами, якщо це обмежить зростаючу сферу впливу фашистів."
 ETH_camouflage_desc:0 "З появою авіації на полі бою все важче отримати елемент несподіванки. Щоб звести до мінімуму видимість наших тактичних намірів, нам потрібно, щоби наші війська брали участь у підготовці з маскування та приховування."
 ETH_chitet_law_peace_time:0 "$ETH_chitet_law$"
 ETH_conservative_high_command_idea_desc:0 "Раси держави [ETH.GetName] знають, як вести війну. Немає потреби змінювати щось, що довело ефективність століттями. Ворог завжди зазнає поразки в результаті повної атаки, де перемагає переважаючий бойовий дух і чисельність [ETH.GetAdjective]ої армії."
 ETH_demand_peace_decision_desc:0 "Хоробрий народ держави [FROM.GetName] повстав проти [?FROM.previous_overlord.GetAdjective]ої тиранії. Ми мусимо діяти негайно та використати всі засоби, щоби змусити державу [?FROM.previous_overlord.GetNameDef] піти з [FROM.GetAdjective]ої території."
 ETH_education_reforms_decision_desc:0 "Щоби запобігти розвитку реакційного руху в майбутньому, ми повинні реформувати систему освіти, щоб діти виростали вільно мислячими дорослими, а не капіталістичними холуями."
 ETH_expand_the_kebur_zabagna_tt:0 "Вербує додаткову дивізію §YКебур Зебеньї§!.\nДодає додаткові §Yпіхотні§! та §Yкавалерійські§! батальйони до шаблону §YКебур Зебенья§!.\nДодає §Yрозвідроту§! й §Yартилерію§!, якщо були досліджені відповідні технології."
 ETH_exploit_french_weakness_category_desc:0 "Коли настане час, ми візьмемо область [268.GetName] під свій контроль, поки [FRA.GetAdjective]а влада відволічеться на справи ближчі до дому."
 ETH_fait_accompli_tt:0 "§Y[ITA.GetNameWithFlag]§! підпише мир із державою §Y[ROOT.GetNameWithFlag]§!, поступившись будь-якими африканськими землями, контрольованими державою [ROOT.GetNameDef].\n"
 ETH_freedom_at_gunpoint_dynamic:0 "Звільнити державу [FROM.GetName] від: [FROM.Capital.OWNER.GetName]"
 ETH_has_active_liberation_goal:0 "Має активну ціль війни §YЗвільнення§!"
 ETH_improve_the_horn_of_africa_category:0 "Поліпшити Африканський Ріг"
 ETH_infrastructure_projects_desc:0 "[ETH.GetName] має багато природних ресурсів, яких жадає світ. Однак ми не можемо скористатися цими ресурсами без відповідних засобів доставки їх на заводи чи вивезення з країни. Ми повинні швидко розширити нашу інфраструктуру та усунути це економічне вузьке місце."
 ETH_international_mediation_desc:0 "Ліга Націй не може дозволити конфлікту між двома державами-членами тривати так довго. Вони повинні діяти і змусити [ITA.GetName] відійти до своїх довоєнних кордонів!"
 ETH_international_mediation_tt:0 "[ITA.GetName] й [ETH.GetName] підпишуть білий мир.\n "
