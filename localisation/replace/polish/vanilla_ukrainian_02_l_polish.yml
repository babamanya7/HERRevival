 JAP_subdue_the_kwantung_army_desc:0 "Квантунська армія довгий час була скалкою в нашому оці, не прислухаючись до авторитету нашої військової кліки. Ми повинні гарантувати, що вони стануть повністю підлеглими нам, шляхом тактичних підвищень і залякування. З часом Садао Аракі стане їхнім новим головою Квантунської армії."
 JAP_tauran_border_incident_forgotten_desc:0 "Якщо ми хочемо витіснити [MON.GetAdjective]і війська з нашої території та від їхнього кордону з [761.GetName], ми повинні діяти швидко."
