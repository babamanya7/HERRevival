 soviet.1.d:0 "Ситуація на маньчжурському кордоні вже деякий час була напружена, але тепер ми отримуємо доповіді від наших монгольських товаришів, що японці зосереджують війська в Хейлунцзяні. Якщо поступитись, це може бути розглянуто як ознаку слабкості, але якщо відповісти вогнем, ситуація може загостритись. Які Ваші накази, товаришу командире?"
 soviet.22.a:0 "Такими темпами, вороги Китаю розділять і заволодіють ним."
