 tsr_manchukuo.5.desc:0 "Після шокуючих подій у Маньчжурії група комуністів, відома як Народно-революційна партія Внутрішньої Монголії, вирішила спробувати осідлати хвилю і здійснити переворот в уряді Менцзяна. Хоча їм не вдалося з самого початку захопити всю країну, незабаром вони можуть досягти успіху, враховуючи стрімку втрату японського контролю в цьому районі."
