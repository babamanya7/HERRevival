 JAP_the_indochinese_soviet_desc:0 "Тепер, коли союз засновано, ми повинні створити нові Радянські Республіки та залучити їх до нашої спільноти. Ми повинні створити Індокитайську Раду, щоб виправдати нашу окупацію регіону."
 JAP_the_war_has_not_necessarily_developed_focus_tt:0 "Радикальні частини військових спробують здійснити державний переворот, щоб перешкодити Імператору оголосити про капітуляцію нашої нації."
