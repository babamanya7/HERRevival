 SOV_build_national_academy_of_sciences_integrated_republic_KUB_desc:0 "Ми збудуємо [KUB.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_build_national_academy_of_sciences_integrated_republic_default:0 "національну академію наук"
 SOV_civilian_labor_in_defense_desc:0 "Ми змусимо цивільне населення в області [FROM.GetName] працювати над будівництвом укріплень для захисту свого міста."
 SOV_claim_on_sinkiang:0 "Висунути претензію на Сіньцзян"
 SOV_concessions_japan_vladivostok_SCW_desc:0 "Японські військові завжди прагнули Владивостока. Тому вони повинні бути схильні допомогти нам експедиційними силами, якщо ми використаємо майбутнє право власності на цю територію як розмінну монету."
 SOV_concessions_uk_belarus_SCW_accept:0 "Якщо прийнято, [ENG.GetNameDef] почне будувати військові заводи в [?SOV.SOV_civil_war_start_state.GetName]. [BLR.GetNameDefCap] стає незалежною наприкінці війни."
 SOV_demand_eastern_poland_desc:0 "Наприкінці Великої війни було встановлено і погоджено лінію Керзона як східний кордон Польщі. Ця лінія проходить приблизно за 200 кілометрів на захід від нинішнього кордону Польщі. Ми мусимо нагадати їм про цей базовий історичний факт і запевнитися, щоб кордон був там, де він має бути."
 SOV_destroyer_4_desc:0 "The Skoryi class (Project 30bis) was a further improvement on the Ognevoy class. The increase in size and displacement (2,500-3,100 tons) resulted in a more stable ship with an increased operational range. All ships were built after the War to a modular design that resulted in rapid construction and deployment times. Their armament was the same as that of the previous Ognevoy class, but the main guns were housed in twin turrets instead of single turrets."
 SOV_diplomacy_middle_east_decision_category:0 "Близькосхідна дипломатія"
 SOV_expand_the_morskaya_aviatsiya:0 "Розширити морську авіацію"
 SOV_focus_complete_effect_tt:0 "\nЕфекти виконання фокусу:"
 SOV_funds_for_the_cause_desc:0 "Наявність Лева Троцького та інших, що базуються за кордоном, безумовно, може піти нам на користь. Ми мусимо організовувати соціалістичні заходи зі збору коштів по всьому світу і водночас таємно намагатися переконати уряди підтримати нас зброєю."
 SOV_imperial_academies_of_sciences_joint_program_desc:0 "Спільна програма технологічного розвитку та досліджень, що фінансується Російською імператорською академією наук."
