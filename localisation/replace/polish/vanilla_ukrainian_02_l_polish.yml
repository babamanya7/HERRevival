 generic_purchase_ships_events.01.desc:0 "Держава [FROM.GetNameDef] звернулася до нас із пропозицією придбати деякі з наших законсервованих військово-морських активів. Активи, які їх цікавлять, вже не експлуатуються через їхній вік і відсутність сучасного обладнання."
 ger_jap_diplomacy_focus:0 "Ставка на німецько-японську дипломатію"
 germany.1042.t:0 "Держава [FROM.GetNameDefCap] поступилася"
 germany.116.b:0 "Ми не можемо дозволити собі цей конфлікт."
 germany.12.d:0 "[SOV.GetNameDefCap] вчинив мудро, підписавши з нами пакт про ненапад. Це означає, що ми можемо не боятися втручання з боку Радянського Союзу.\n\nНа жаль, тепер деякі наші друзі сумніваються у відданості Німеччини знищенню комунізму. Коли ми розберемося з Польщею та Францією, можливо нам доведеться перерозглянути цей договір. Але цю тему краще відкласти на потім."
 germany.121.a:0 "За Німеччину..."
 germany.15.d:0 "Відповідно до пакту Молотова–Ріббентропа, німецькі війська були виведені зі Східної Польщі, а наші війська тепер входять, щоб окупувати територію."
 germany.20.t:0 "Другий Віденський арбітраж"
 germany.23.d:0 "[FROM.GetAdjective]ий уряд відмовився від наших вимог! Вони прикриваються Клайпедською конвенцією, стверджуючи, що Німеччина не має жодного законного права на територію Мемеля. Нам доведеться пояснити нашу позицію іншим способом..."
 germany.29.t:0 "Австрія відмовилася від аншлюсу!"
 germany.4.t:0 "Аншлюс"
 germany.44.d:0 "Вимоги німців про передачу нашої Судетської області стали більш ворожими, і тепер їхні війська збираються на нашому кордоні! Зараз у Мюнхені проводиться конференція з обговоренням майбутнього Чехословаччини, куди нас, щоправда, не запросили.\n\nНа щастя, схоже, що Союзники дотримуватимуться своїх обіцянок про підтримку. Вони пригрозили [GER.GetLeader] війною, якщо наші кордони будуть хоч трохи порушені. Не залежно від цього, нам треба підготуватися до неминучого німецького наступу."
 germany.48.a:0 "Це може скластися на нашу користь."
 germany.55.d:0 "Кінець Чехословаччини вже близько: саме в цей момент наші війська входять у Прагу. З капітуляцією чехословацької армії ми здобули величезну кількість озброєння. Їхні танки, зокрема, добре послужать нашій армії.\n\nБогемія буде анексована в якості протекторату, але що стане зі Словаччини? Ми можемо встановити в ній маріонетковий режим на чолі з Йозефом Тісо."
 germany.56.d:0 "Німецькі війська ввійшли в Прагу, і кінець Чехословаччини неминучий. Вони планують анексувати Богемію, але залишити для нас Словаччину. Чи погодимося ми на цей розподіл? Це означатиме приєднання до військового альянсу Німеччини."
 germany.77.t:0 "СРСР відхилив німецько-радянський договір"
 germany.85.b:0 "Це не наша війна."
 germany.92.a:0 "Версальський договір мусить виконуватись."
 gojjam_democratic:0 "Годжам"
 grand_assault:0 "Великий наступ"
 grant_parliamentary_audience_desc:0 "Окупаційні війська тероризують державу [From.GetNameDef], і терпіти їх уже неможливо. Зберімо представників [From.GetAdjective]ої нації перед нашим законодавчим органом, щоби свідчити перед [Root.GetAdjective] народом, що у нас є привід до війни."
 great_depression_desc:0 "Велика депресія, що охопила весь світ, почалася з біржового краху в США, де викликала різке зростання безробіття та скорочення податкових надходжень. Американському народу та уряду і так є про що турбуватися, крім чергової війни."
