 LIT_monarchy_events.2.desc:0 "4 червня 1918 року Вільгельм Карл фон Урах був демократично і при масовому схваленні народу обраний королем Литви, але втручання Німецької імперії зробило референдум недійсним, і Литва так і не возз'єдналася зі своїм королем., був син, і тепер, коли Німеччина вже давно не править Литвою, [Root.GetLeader] запрошує Карла Геро фон Ураха стати новим королем Литви! посилити нову литовську монархію."
 LIT_mykolas_slezevicius:0 "Міколас Слєжєвічюс"
 LIT_patriotic_socialism_desc:0 "Демократичний уряд складався в основному з соціал-демократів і центристів, а ідеали соціалізму плямують розуми литовських робітників. Казіс Грінюс, безумовно, був соціалістом, але не можна заперечувати і його патріотизм. Можливо, надихнувшись деякими з його стати більш продуктивними і більше підтримуватимуть диктатуру."
