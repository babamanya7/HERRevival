 CONFIRM_START_TRAINING:0 "Почати тренування"
 CONFIRM_START_TRAINING_DESC:0 "Чи хочете Ви, щоб ця армія почала військові тренування?\nВійськові частини потрохи набиратимуть досвід під час тренувань, який також додаватиметься до національного досвіду армії. Частини не отримують досвід поза рівнем $MAX|Y$, їхня організація буде знижена до кінця тренувань, вони не зможуть переміщуватися й (?) виснаження $ATTRITION|R%0$."
 CONGO_colonial_ambitions_desc:0 "Конго — вражаюча частина території, але цей континент — великий. Ми повинні показати іншим колоніальним державам, що боротьба за Африку ще не завершена."
