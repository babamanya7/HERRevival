 ITA_portugal_friend:0 "Подружитися з Португалією"
 ITA_power_balance_lost_core_3:0 "$ITA_power_balance_lost_core_1$"
 ITA_raise_the_peoples_desc:0 "Є багато хоробрих італійських селян, готових боротися за наші ідеали. З ними ми зможемо сформувати більше загонів червоносорочників, якими поповнимо лави наших збройних сил."
 ITA_ratify_the_stresa_front:0 "$FRA_ratify_the_stresa_front$"
 ITA_regia_marina_alt_dynamic_modifier:0 "Marina Italiana"
 ITA_release_colonies_central_africa_tt:0 "Колонії в Центральній Африці будуть звільнені."
 ITA_release_colonies_south_africa_tt:0 "Колонії в Південній Африці будуть звільнені."
 ITA_scout_plane_equipment_2_short:0 "Ca.311"
 ITA_seek_british_military_cooperation_desc:0 "Хоча наші колишні союзники зрадили нас у минулій війні, можливо, все ще є сенс зазирнути за межі наших образ і простягнути їм оливкову гілку. Нам є чому повчитися у британців, зокрема в питаннях їхніх військово-морських і військово-повітряних сил."
 ITA_seize_old_equipment:0 "Захопити старе оснащення"
 ITA_send_ultimatum_to_country_balkan:0 "$SOV_send_ultimatum_to_country_balkan$"
 ITA_ship_armor_cruiser_4:0 "150-мм пояс/80-мм палуба"
 ITA_spanish_italian_alliance_desc:0 "$ITA_spanish_italian_faction_desc$"
 ITA_strat_bomber_equipment_3:0 "Piaggio P.133"
 ITA_strengthen_ascari_corps_desc:0 "Наші війська з європейської частини Імперії часто борються в суворому кліматі Африки. Тубільці, очевидно, від таких проблем не страждають. Ми мусимо завербувати деяких із них для підтримки наших військ, котрі воюють у спекотному кліматі."
 ITA_the_abyssinian_fiasco_completion_tt:0 "Може бути автоматично завершеное після провалу завдань §Y$ITA_conquer_the_north_mission$§! і §Y$ITA_conquer_the_south_mission$§!, виданих $ITA_benito_mussolini$ в січні 1936 року\n"
 ITA_the_carabinieri:0 "Карабіньєри"
 ITA_the_king_of_the_skies_desc:0 "На відміну від наших римських предків, наші збройні сили мусять домінувати в небі, щоб оптимально діяти на суші і на морі. Італійські літаки вже відомі своєю універсальністю та якістю, але настав час нашим авіаційним інженерам зробити крок уперед і розробити справжню летючу фортецю."
 ITA_turkey_friend:0 "Подружитися з Туреччиною"
 ITA_via_della_vittoria_desc:0 "Погана інфраструктура продовжує перешкоджати нашим операціям у Північній Африці. Об'єднання зусиль навколо єдиної «Дороги перемоги» могло би значно поліпшити ситуацію та дозволило би нам вільніше діяти вздовж єгипетського кордону."
 ITA_vittorio_emanuele_iii_roman_emperor:0 "Август Віктор Еммануїл"
 IVO_democratic_ADJ:0 "Івуарськ"
 JAP_STATE_1029:0 "Коуген"
 JAP_VICTORY_POINTS_12089:0 "Тайкю"
 JAP_add_early_industrialization_modifier_tt:0 "Додає §Y$JAP_early_industrialization_efforts_dm$§!, що дає:\n"
 JAP_adopt_new_assault_doctrine:0 "Прийняти нову штурмову доктрину"
 JAP_advance_one_hundred_million_fireballs:0 "Вперед, сто мільйонів вогняних куль"
 JAP_ally_with_the_zaibatsus:0 "Союз із дзайбацу"
 JAP_anti_colonialism_category:0 "Антиколоніалізм"
 JAP_appoint_new_generals_desc:0 "Тепер, коли багато генералів вирішили виступити проти нас, ми стикаємося з нестачею компетентних офіцерів для командування нашими військами. Ми повинні зробити все можливе, щоб виправити це і найняти нове покоління армійських командирів."
 JAP_armored_car_at_equipment_short:0 "Type 4 Armored Car"
 JAP_army_faction_demands_more_tanks:0 "$JAP_army_faction$ вимагає більше танків"
 JAP_army_recruiting_more_conscripts_mission_tt:0 "IJA отримає §R4§! додаткові §Yпіхотні дивізії§! на початку §YГромадянської війни§!"
 JAP_buddhist_socialism_idea:0 "Буддійський соціалізм"
 JAP_carrier_3:0 "Клас «Shokaku»"
 JAP_carrier_ship_engine_3:0 "«Kampon» 152 000 к. с. н. в."
 JAP_carrier_warfare_experiments:0 "Експериментальні авіаносці"
 JAP_carrier_warfare_experiments_desc:0 "Лінкори — пережиток минулої епохи. Ми маємо дивитися у майбутнє, а майбутнє — за авіацією. Авіанесучі кораблі дозволять нам зберігати перевагу в повітрі над усім Тихим океаном."
 JAP_closer_ties_with_the_usa_desc:0 "Оскільки демократична система в нашій країні тепер у безпеці, наші дипломати наполегливо працюють над відновленням відносин, зіпсованих військовими, починаючи зі Сполучених Штатів Америки. Ми повинні звернутися до них і спробувати укласти угоду, яка закріпить нашу дружбу на довгі роки."
 JAP_conflict_between_faction_reaching_boiling_point_mission:0 "Конфлікт між фракціями досягає точки кипіння"
 JAP_crumbling_military_cabinet_idea_2:0 "Поточна ситуація в Імперії"
 JAP_democratic_nationalize_zaibatsus:0 "Націоналізувати Дзайбацу"
 JAP_divert_military_funds_tt:0 "Кожен регіон, що не перебуває під §Yконтролем армії§!, приєднається до нас на початку §YГромадянської війни§!"
 JAP_early_industrialization_efforts_dm_desc:0 "Наша промислова революція по-справжньому розпочалася лише у 1870-х роках під час реставрації Мейджі, після того як місія Івакури привезла додому знання, необхідні для запуску наших проєктів індустріалізації. Відтоді наша економіка значно зросла, і було створено сучасні галузі промисловості. Проте, незважаючи на це, наша економіка все ще значно відстає від західних країн, значною мірою через нестачу природних ресурсів."
 JAP_embodying_empress_jinguu:0 "Втілення імператриці Джінгу"
 JAP_establish_the_gunbatsu_desc:0 "Щоб реорганізувати уряд, ми повинні спочатку зруйнувати його структуру і перебудувати з нуля. Для цього вже розпочато підготовку до створення військової кліки, яка допомагатиме Імператору керувати країною як закрите внутрішнє коло."
 JAP_expand_hiratsuka_navy_arsenal_tt:0 "Або вийшли з §YЛондонського морського договору§!, або було активовано §Yпункт про ескалацію§!"
 JAP_expand_the_showa_research_association_desc:0 "Шьова Кенкюкай — політичний аналітичний центр, створений для генерування інноваційних ідей щодо політичних реформ шляхом перегляду та оцінки проблем Конституції Мейджі, розширює зони своїх інтересів і формує нові підгрупи. Ми повинні заохочувати це, щоб вони могли розробляти нові технології та шляхи домінування в Азії."
 JAP_expand_the_showa_steel_works_desc:0 "Ми маємо радикально підвищити продуктивність металургійного комбінату Шьова — це є необхідною умовою майбутньої масштабної індустріалізації."
 JAP_extensive_navy_maneuvers_desc:0 "Щоб здолати держави, що відкололися від нас, коли наша нація розпалася внаслідок громадянської війни, ми повинні переконатися, що наш флот перебуває на належному рівні та готовий протистояти їм. Тому ми повинні організувати масштабні маневри, щоб гарантувати нашу готовність до бою."
 JAP_foreign_tank_modernization_cooperation_2_tt:0 "Розблоковує рису MIO §Y$JAP_mio_trait_foreign_research_and_development_cooperation$§! для всіх §Yконструкторів танків§!. §RОднак її можна застосувати лише до одного з них§!."
 JAP_form_cabinet_intelligence_bureau:0 "Сформувати Бюро розвідки при Кабінеті міністрів"
 JAP_form_the_great_japan_industrial_patriotic_association_desc:0 "Промисловці та профспілки в нашій країні роз'єднані та неефективні, що стримує наш економічний розвиток. Ми повинні об'єднати їх усіх під егідою однієї парасолькової організації, щоб наші галузі промисловості працювали якомога ефективніше та сприяли подальшій експансії."
 JAP_gather_royal_pacifists_support:0 "Залучити підтримку імператорських пацифістів"
 JAP_greater_emperor_dominant_fascism:0 "Велика Японська імперія"
 JAP_heavy_tank_equipment_2:0 "Iwakuro"
 JAP_heavy_tank_equipment_2_short:0 "Iwakuro"
 JAP_improved_radio_communications_desc:0 "Наші радіостанції зараз у жахливому стані, і в результаті наші формування часто розпадаються через поганий зв'язок і відсутність сигналу в глибоких джунглях і на віддалених островах. Ми повинні модернізувати наше обладнання та побудувати нові радіовежі, щоб це більше не повторювалося."
