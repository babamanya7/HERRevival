 ENG_unite_the_anglosphere:0 "Об'єднати англосферу"
 ENG_war_with_ussr_desc:0 "Загроза держави [SOU.GetNameDef] продовжує зростати попри наші заперечення. Ми не можемо терпіти агресивну державу [SOU.GetName] і в нас немає вибору, крім як піти війною заради кращого майбутнього."
 EOB_empire_brazil_neutrality:0 "Бразильська імперія"
