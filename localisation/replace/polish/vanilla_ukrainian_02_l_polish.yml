 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_STANDARD:0 "Звання відповідальної демократичної держави передбачає значно більшу відповідальність, ніж гарантування громадянських свобод лише власного народу. Світ — небезпечне місце, і демократія постійно під загрозою, а значить ми зобов'язані стати на варті свободи."
 TUR_anti_bolshevik_mediterranean_bloc_desc:0 "Як би нам не хотілося зберегти дружбу з державою [SOV.GetNameDef], сталінізм занадто далеко пішов від марксистських ідеалів, і ми не будемо втішатися хибними запевненнями, ніби з ним можна миритися. Ми мусимо розірвати відносини з державою [SOV.GetNameDef] та знайти інших однодумців."
 TUR_balkan_defense_council_spirit:0 "$TUR_balkan_defense_council$"
 TUR_britain_abandons_turkey_tt:0 "\nПісля нашої заяви про відмову підтримати державу §Y[TUR.GetNameDef]§! у §Y[TUR.GetAdjective]ого уряду§! буде остання можливість розрядити обстановку."
 TUR_combined_operational_strategies_desc:0 "Співпрацюючи на всіх рівнях з питань стратегії та оборони, ми можемо гарантувати безпеку всьому нашому регіону, навіть якщо сили не рівні."
