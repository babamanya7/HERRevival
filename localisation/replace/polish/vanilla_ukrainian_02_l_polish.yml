 MEX_focus_law_on_industrial_promotion_desc:0 "Протягом багатьох років мексиканські штати та федеральний уряд намагалися заохочувати розвиток нових галузей промисловості шляхом звільнення від податків. Часто місцеве законодавство суперечить національним інтересам, відволікаючи капітал у неважливі або неефективні сфери. Нам потрібно раціоналізувати наш підхід до промислового розвитку за допомогою централізованого плану."
 MEX_focus_oil_revenue_reinvestment:0 "Реінвестування доходів від нафти"
 MEX_focus_party_of_the_revolution_desc:0 "Президент Карденас був обраний на платформі аграрної реформи завдяки підтримці робітничих і селянських організацій. Ми здійснили реформи і тепер маємо горду соціалістичну націю, готову боротися з несправедливістю на міжнародній арені."
 MEX_focus_rural_infrastructure:0 "Сільська інфраструктура"
 MEX_infantry_equipment_1_short:0 "Mondragón M08"
 MEX_international_struggle_desc:0 "Ми допомагатимемо тим, кого визнаємо гідними допомоги з ідеологічних міркувань або в боротьбі за звільнення. Це велика відповідальність, але мексиканський народ досить сильний для такого завдання."
 MEX_jose_vasconcelos_desc:0 "§LПисьменник-філософ, колишній міністр і кандидат у президенти, Васконселос створив синкретичну мексиканську ідеологію, змішавши уявлення про «народну» релігію, католицизм і громадянський націоналізм. Він ратував за повернення колишніх мексиканських володінь.§!"
 MEX_legion_of_christ_desc:0 "Атеїсти-терористи розгромлені! Тепер слід покласти край їх жорстокому режиму. Як мовиться в Книзі Вихід: «око за око, життя за життя». Щоб стати мстивою рукою Всемогутнього, Легіон Христа зробить все, щоби з наших земель зникло сатанинське безвір'я."
 MEX_leon_trotsky:0 "$SOV_lev_trotsky$"
