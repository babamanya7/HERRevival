 DIVISION_QUEUED:0 "$N$ дивіз."
 DLC_DESCRIPTION_dlc028:0 "La Résistance додає таємних агентів, шпигунські місії та нові можливості для рухів спротиву. Надсилайте агентів у небезпечні території, щоби розшифрувати ворожі секрети або підготувати підґрунтя для Вашого вторгнення, зв'язавшися з колабораціоністами, які будуть раді отримати будь-яку владу."
 DLC_DESCRIPTION_dlc051:0 "Відтворіть Богемське королівство, утворіть союз із держав Центральної Європи, захистіть себе укріпленнями або створіть мережу союзників із новим деревом фокусів для Чехословаччини з Peace for Our Time."
 DOCTRINE_ARMY_XP_COST:0 "£army_experience $COST$"
 DOCTRINE_EFFECT_SOURCE_MILESTONE:0 "$GRAND_DOCTRINE|H$ — віха $TRACK$"
 DOD_hungary.10.desc:0 "Драматичні зміни, що відбулися нещодавно на політичній арені Балкан, поставили під питання наші взаємини з новою Австро-угорською імперією. Сьогодні посол Угорщини передав нам офіційну ноту, вимагаючи, щоби ми висловили нашу позицію щодо імперії. Габсбург стверджують, що Богемія і Моравія, дві землі старої імперії, належать їм.\n\nОднак [HUN.GetLeader] дав нам зрозуміти, що згоден на компроміс— він стане номінальним главою нашої держави, маючи при цьому мінімальну реальну владу."
 DOD_hungary.101.t:0 "Відбулася передача Словаччини"
 DOD_hungary.105.t:0 "Німеччина відмовляється від розділу держави [CZE.GetName]"
 DOD_hungary.109.desc:0 "Незважаючи на всі наші зусилля, уряд Словаччини відмовився підкоритися. Тепер нам доведеться розглянути можливість військових дій для захисту наших північних рубежів."
 DOD_hungary.111.t:0 "Комуністичний ультиматум"
 DOD_hungary.124.a:0 "Цікавий маневр."
 DOD_hungary.160.a:0 "Невеликий бомбардувальник для безпосередньої авіапідтримки."
 DOD_hungary.3.a:0 "Мудрий вибір."
 DOD_hungary.5.a:0 "Ми мусимо звільнити країну і повернути її законному правителю."
 DOD_hungary.6.a:0 "Побачимо, наскільки вони є єдиними насправді."
 DOD_hungary.86.desc:0 "[From.GetAdjectiveCap]а влада відхилила наше прохання про допомогу на тлі кричущої [HUN.GetAdjective]ої агресії. Вони визнають нашу правоту, але не бажають проливати кров і витрачати гроші, обстоюючи її."
 DOD_hungary.92.t:0 "[From.GetNameDefCap] відкидає наші вимоги"
 DOD_hungary.97.desc:0 "Незважаючи на несприятливі для себе обставини, [YUG.GetAdjective]ий уряд відмовився прислухатися до голосу розуму і повідомив наших послів, що, якщо ми побажаємо вирішити питання силою, [YUG.GetAdjective] армія буде готова відбити напад."
 DOD_romania.163.desc:0 "Кодряну погрожував майбутньому румунської держави. За свої безрозсудні дії він був заарештований— задля збереження стабільності. Його смерть стане застереженням, що можна виступати або хорошим прикладом для людей, або жахливим ним нагадуванням. Фашистів Румунії чекає більш урівноважений та відповідальний лідер."
 DOD_romania.60.desc:0 "Румунська армія стоїть біля нашого кордону, і світло наповнюється чутками про те, які її цілі. Коли наш посол у Бухаресті поставив питання щодо цього, йому прямо відповіли: [ROM.GetLeader] вирішив, що єдина Югославія більше не відповідає його інтересам. Він має намір розділити нашу країну на кілька васальних держав під прямим керуванням Румунії.\n\nПротягом години ми отримаємо офіційний ультиматум."
 DOD_romania.601.desc:0 "Спостерігаючи за внутрішньою боротьбою, характерною для держави [YUG.GetNameDef], [ROM.GetLeader] вирішує продовжити свою політику панування на Балканах, поділивши югославський народ між кількома місцевими державами. [Root.GetNameDefCap] входить до народів, запрошених поділити Югославію, і, хоча це приваблива можливість розширити наші балканські території, ми будемо зобов'язані приєднатися до конфлікту у разі, якщо Югославія відмовиться від ультиматуму."
 DOD_romania.62.desc:0 "Термін ультиматуму, висунутого [YUG.GetAdjective]ому уряду, минув, але ми так і не отримали відповіді. Наші пілоти-розвідники повідомили, що до югославської частини нашого кордону стягуються війська, після чого в генштабі провели аналіз нашого плану вторгнення Старші військові радники не стали гарантувати швидку перемогу у війні з Югославією."
 DOD_romania.66.t:0 "[From.GetNameDefCap] відмовляється"
 DOD_romania.69.b:0 "Ми боротимемося до останнього!"
 DOD_yugoslavia.20.desc:0 "Усвідомивши свою стратегічну слабкість, [YUG.GetAdjective]і ВПС розпочали реалізацію програми прискореної модернізації та розширення авіації. На покупку техніки виділено значну суму. Спеціальна комісія вирушила в поїздку Європою у пошуках нових виробників винищувачів та середніх бомбардувальників.\n\nОскільки справа не терпить зволікання, [YUG.GetAdjective] влада наполягає на негайній доставці або перекиданні літаків прямо із заводу."
 DOD_yugoslavia.702.t:0 "[YUG.GetNameDefCap] підписує Троїстий пакт"
 DOD_yugoslavia.802.t:0 "[From.GetNameDefCap] погоджується"
 DOMESTIC_FILM_INDUSTRY_DESC:0 "[ROOT.GetAdjectiveCap]а кіноіндустрія значно розвинулася за останнє десятиліття. Зважаючи на те, що населення відчуває голод на розваги, ми можемо отримати вигоду від кінематографічного продукту, покликаного збудити патріотичні настрої."
