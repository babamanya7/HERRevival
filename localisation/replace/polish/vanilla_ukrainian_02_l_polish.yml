 raid_type_gun_emplacement_raid:0 "Удар по позиції для гармати"
 raid_type_nuclear_missile_strike_desc:0 "Ракета дальнього радіусу дії вийде на суборбітальну балістичну траєкторію з визначеного місця запуску в напрямі наміченої цілі. У відповідний момент боєголовка на борту ракети спричинить атомний вибух."
