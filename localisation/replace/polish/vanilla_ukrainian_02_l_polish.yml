 siam.15.desc:0 "Швидкий наступ сил [SIA.GetAdjective] міг застати нас зненацька, але оскільки їхній авангард видихається під зростаючим напруженням, їхня слабкість стає очевидною. Те, що мало стати блискавичною кампанією, перетворилося на виснажливе випробування для армії [SIA.GetAdjective]. Ми могли б бути великодушними і запропонувати їм шлях до виходу через поступки, проте рішення за нами: чи краще нам послужить милосердя, ніж тотальна перемога."
 siam.41.desc:0 "Делегація чиновників [FROM.GetAdjective] прибула, щоб спостерігати та вивчати нашу адміністративну та дослідницьку практику. [FROM.GetNameDefCap], здається, має намір модернізувати свою бюрократію, спираючись на іноземний досвід, і обрала [ROOT.GetNameDef] як свою модель. Візит є негласним визнанням наших методів і можливістю зміцнити доброзичливі відносини з іншим урядом."
