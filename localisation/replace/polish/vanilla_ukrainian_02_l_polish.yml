 GRE_subjugating_the_bulgarians:0 "Утихомирення болгар"
 GRE_the_cannon_desc:0 "Гуркіт наших гармат почує весь світ!"
 GRE_the_modern_movement:0 "Сучасний рух"
 GRN_democratic_party:0 "Спільність"
 GUAY_a_deal_with_devil_desc:0 "Зрозуміло, що ми не можемо вижити без союзників у непевному світі. Ми будемо прагнути приєднатися до нашого старшого партнера та сформувати ще тісніший зв'язок; сподіваємось, вони не приведуть нас до забуття."
 GUAY_coup_detat:0 "Наслідки державного перевороту"
 GUAY_national_academy_of_sciences_3_desc:0 "Кожен південноамериканець заслуговує на вищу освіту. Контроль над континентом дає нам достатньо ресурсів, щоб надати це кожному чоловікові та жінці."
 GUAY_river_trade_desc:0 "Наша країна — це країна річок. Перевезення поромів цими річками було основним заняттям протягом усього існування країни. Логічно розширити цей тип торгівлі, якщо наші сусіди будуть готові."
