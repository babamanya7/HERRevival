 ITA_international_aid:0 "Міжнародна підтримка"
 ITA_irregulars_desc:0 "Нерегулярні війська відіграють ключову роль у кампанії в Африці. Ми мусимо збільшити вербування серед місцевого населення та поліпшити підготовку цих підрозділів."
 ITA_italian_corsica_name:0 "Корсика"
