 ITA_la_battaglia_per_le_nascite:0 "La Battaglia per le Nascite"
 ITA_light_cruiser_1_desc:0 "Крейсери «Taranto» та «Bari» були крейсерами часів Першої світової війни, отриманими від Німеччини в якості репарацій. Обидва водотоннажністю від 4500 до 5100 тонн були озброєні німецькими 150-мм гарматами SK/45."
 ITA_light_ship_effort:0 "Розвиток легких кораблів"
 ITA_light_tank_equipment_3_short:0 "L8"
 ITA_logistics_in_ethiopia_desc:0 "Завдяки належному плануванню та матеріально-технічному забезпеченню ми досягнемо невеликих, але постійних успіхів, не жертвуючи нашими людьми без потреби."
