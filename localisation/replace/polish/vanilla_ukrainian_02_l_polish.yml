 STAT_COMMON_ACCLIMATIZATION_HOT_GAIN_DESC:0 "Швидкість, із якою військова частина акліматизовується в теплому кліматі."
 STAT_COMMON_FUEL_CONSUMPTION_DESC:0 "Скільки пального споживає ця військова частина під час роботи. Повітряні та морські частини споживатимуть пальне під час виконання активних завдань або проведення навчань. Наземні частини зі споживанням пального споживатимуть пальне навіть при бездіяльності, але бойові дії, пересування чи навчання ще більше збільшать споживання."
