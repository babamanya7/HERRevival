 CZE_the_polish_question_desc:0 "Поляки так і не пробачили нам Заолшя; безсумнівно, вони готові накинутися на нас, як тільки ми дамо слабину. Але наша велика нація не планує сидіти склавши руки і ігнорувати цю загрозу. Ми мусимо перейти до рішучих дій!"
