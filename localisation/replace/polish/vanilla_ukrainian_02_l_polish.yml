 ROM_hedonist_king:0 "Король-гедоніст"
 ROM_hunedoara_steel_works_desc:0 "Щоби задовольнити потреби нашого виробництва зброї, великий сталеливарний завод у Трансільванії має бути модернізований і різко розширений."
 ROM_joint_allied_staff_college:0 "Спільний проєкт військової академії"
 ROM_local_development:0 "Місцева розробка"
 ROM_malaxa_desc:0 "Ми мусимо розширити нашу вітчизняну автомобільну промисловість, щоб її можна було легко переобладнати та використати для військових цілей, коли це буде потрібно. З цією метою один із наших бізнес-магнатів має кілька досить цікавих ідей, якими ми могли б скористатися..."
 ROM_malaxa_organization:0 "$ROM_malaxa$"
 ROM_medium_tank_destroyer_equipment_1_short:0 "TACAM T-60"
 ROM_nav_bomber_equipment_2:0 "IAR 114"
 ROM_nav_bomber_equipment_2_short:0 "IAR 114"
 ROM_renew_the_romanian_polish_alliance_desc:0 "Наші старі зв'язки з Польщею останніми роками охололи. Оскільки загрози навколо нас не зменшилися, а глобальна політична ситуація стає все більш бурхливою, настав час відродити наш альянс із нашим північним сусідом."
 ROM_subject:0 "$OVERLORDADJ$а $ROM$"
 ROM_tac_bomber_equipment_3:0 "IAR 779"
 ROM_the_cordon_sanitaire_desc:0 "Ми межуємо з небезпечними ідеологіями як на сході, так і на заході. Разом із нашими сусідами на півночі та півдні ми встановимо бар'єр, який замкне ці догми на карантин і не дасть їм просуватися далі."
