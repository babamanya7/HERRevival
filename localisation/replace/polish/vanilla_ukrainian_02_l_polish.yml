 AST_a_change_of_authority_tt:0 " §Y[ROOT.GetName]§! тепер може оголошувати війни.\n §Y[ROOT.GetName]§! тепер може відхиляти заклики до війни.\n §Y[ROOT.GetName]§! більше не передає жодних балів мирної конференції своєму власнику."
 AST_a_convenient_disaster:0 "Зручна катастрофа"
 AST_a_growing_womens_guild:0 "Зростаюча жіноча гільдія"
 AST_a_growing_womens_guild_desc:0 "З моменту свого заснування у 1928 році Австралійська жіноча гільдія імперії відстоює промислову співпрацю для подолання національних економічних проблем. На благо нації громадяни повинні допомагати своєму уряду, а не працювати проти нього. З Панкгерст Волш на посаді президента «Австралії понад усе» ми зможемо поширити цей заклик через політичний рух."
 AST_all_for_one_one_for_all:0 "Один за всіх, і всі за одного"
 AST_alp_election_campaign_tt:0 "§YВиборча кампанія АЛП§!\n§LЗгуртувати робітничий клас, членів профспілок та реформаторів, орієнтованих на внутрішні проблеми; Австралійська лейбористська партія запустить політичну кампанію.§!\n\n§YЕфект:§!\nЩоденна вартість політичної влади: §R1.00§!\nЩоденне зростання голосів §YАЛП§!: §G+0.05%§!"
 AST_alp_less_than_3_wins_tt:0 "§YАЛП§! має менше §Y3§! перемог на виборах."
 AST_armored_car_equipment_2:0 "T17E1 Staghound"
 AST_army_inventions_directorate:0 "Директорія військових розробок"
 AST_army_inventions_directorate_taog_desc:0 "Однією з небагатьох позитивних сторін війни, якщо це можна так назвати, є швидкий темп технологічних інновацій, зумовлений необхідністю. Ми повинні створити централізовану організацію для розробки, вдосконалення та використання цих проривів."
 AST_central_bureau_idea_desc:0 "Створена та координована з США спільна розвідувальна група, метою якої є протидія зусиллям наших ворогів на тихоокеанському театрі."
 AST_clive_caldwell:0 "Клайв Келдуелл"
 AST_conscription_level_allowed_service_by_requirement_tt:0 "Розблокувати додатковий рівень §YЗакону про призов§!, який зробить доступним §YОбов'язкову службу§!"
 AST_department_of_munitions:0 "Міністерство боєприпасів"
 AST_destroyer_3_desc:0 "The Nizam class was the designation of the J, K, and N class destroyers transferred from the RN. They were similar to the earlier Tribal class but rather than emphasizing gun armament, the designers returned to a more standard heavy torpedo and lighter gun setup. The ships were modified throughout their wartime service. Upgrades included improved anti-aircraft guns and radar. They were fast, long-ranged and well-armed vessels ideal for fleet escorts."
 AST_develop_port_kemla_steel_medium_decision:0 "Побудувати другу доменну піч у Порт-Кембла"
 AST_develop_port_kemla_steel_medium_decision_desc:0 "Порт-Кембла добре функціонував лише з однією доменною піччю, але попит зріс настільки, що ми, можливо, захочемо побудувати другу. Це приблизно вдвічі збільшить виробництво сталі в регіоні."
 AST_diplomatic_events.11.a:0 "Наші вороги боятимуться нас."
 AST_diplomatic_events.11.t:0 "Воєнний альянс"
 AST_diplomatic_events.3.a:0 "Чудово!"
 AST_diplomatic_events.47.b:0 "Ми впораємося самі."
 AST_diplomatic_events.47.desc:0 "Незважаючи на недавнє відокремлення від Британської Співдружності, [AST.GetName] пропонує військову співпрацю. [AST.GetName] стверджує, що поділ тягаря піде на користь [ENG.GetNameDefCap], враховуючи, наскільки вона розтягнута по всьому світу."
 AST_diplomatic_events.48.desc:0 "[ENG.GetNameDefCap] погодилася підписати пакт про ненапад, заклавши основу для військової співпраці."
 AST_diplomatic_events.53.t:0 "Віші геть з Африки"
 AST_diplomatic_events.56.a:0 "Щоб уникнути конфлікту, території буде передано."
 AST_diplomatic_events.58.t:0 "Віші відмовляє [AST.GetName] у територіях"
 AST_diplomatic_events.75.desc:0 "Зрозуміло, що становлення [AST.GetName] як фашистської держави починає приносити певні плоди, коли нації настільки бояться нашого гніву. [USA.GetNameDefCap] погодилася; [PHI.GetNameDef] тепер наша."
 AST_empire_air_training_scheme_taog:0 "Імперська схема підготовки льотчиків"
 AST_evan_deakin_and_company_organization:0 "Evans Deakin & Company"
 AST_expanding_influence:0 "Розширення впливу"
 AST_gw_tank_equipment_short:0 "Vickers II"
 AST_hand_in_glove:0 "Рука об руку"
 AST_heavy_tank_aa_equipment_3_short:0 "Black Prince AA"
 AST_heavy_tank_destroyer_equipment_3_short:0 "Black Prince TD"
 AST_herbert_v_evatt:0 "Герберт В. Іветт"
 AST_imperial_pressure_spirit_desc:0 "Через останні події вже не можна заперечувати, що австралійська політика рухається в напрямку, неприйнятному для країни під егідою Британської Співдружності. [ENG.GetNameDefCap] спробує повернути нашу націю на визначений шлях, але її терпіння може швидко урватися.\n\n§WБуде видалено, як тільки §Y[AST.GetName]§! перестане бути суб'єктом §Y[ENG.GetNameDef]§!§!"
 AST_in_from_the_cold:0 "Повернення з холоду"
 AST_ireland_anti_british_pact_offer_accept_later_tt:0 "Якщо [AST.GetName] виконає свою частину угоди, ми приєднаємося до їхнього альянсу та візьмемо участь у їхній війні проти Британії, щойно вони оголосять війну."
 AST_medium_tank_equipment_1_short:0 "M3 Grant"
 AST_mio_trait_hudson_coastal_patrol:0 "Прибережне патрулювання «Hudson»"
 AST_motherland_advocate_pa:0 "Захисник Батьківщини"
 AST_nationalization_underway_tt:0 "§YНаціоналізація триває§! \nВиробництво фабрик: §R-30%§! \nВиробництво верфей: §R-30%§!"
 AST_nav_bomber_equipment_3:0 "Bristol Beaufort"
 AST_no_foreign_battlefields_spirit:0 "$AST_no_foreign_battlefields_idea_1$"
 AST_percy_stephensen:0 "П. Р. Стівенсен"
 AST_political_events.1.desc:0 "Є дві сфери, в яких ми, як уряд, прагнемо посилити федеральний контроль: Авіація та Маркетинг.\n\nЩодо авіації, мета полягає у внесенні поправок до Конституції, щоб надати Парламенту Співдружності повноваження ухвалювати закони щодо аеронавігації та літальних апаратів.\n\nПоправка щодо маркетингу має дозволити співпрацю між Співдружністю та Штатами у сфері маркетингу, що наразі є конституційно неможливим.\n\nЗ якого питання ми скличемо референдум?"
 AST_political_events.4.desc:0 "Лідери [AST.GetName] довго працювали під тиском військових приготувань, і нарешті напруга забрала свою найбільшу жертву; прем'єр-міністр помер від серцевого нападу.\n\nЗ огляду на поточну ситуацію у світі, його керівництва дуже не вистачатиме. Тим не менш, Австралія повинна рухатися далі з новим лідером біля керма: [AST.GetLeader]."
 AST_protect_the_dutch_colonies_desc:0 "Нідерланди — слабка далека господиня індонезійських колоній. Вона не в змозі захищати їх від нападів Японії, Китаю й абияких інших можливих агресорів. Ми мусимо взяти на себе управління цими територіями для їхнього ж блага."
 AST_reinforcements_desc:0 "Ми підготуємо значною мірою нерозвинені північні регіони, збудувавши оборонні споруди та авіабази."
 AST_research_cooperation_desc:0 "Австралійці — талановитий, винахідливий народ, але ми не маємо ні інфраструктури, ні достатньої кількості мешканців, щоб реалізувати великий науковий проєкт. Ми мусимо співпрацювати з союзниками, обмінюватися знаннями та відкриттями заради загального блага."
 AST_squash_the_squanderbugs_desc:0 "Порожня трата грошей на споживчі товари, що подорожчали через зростання інфляції, позбавляє коштів облігації військової позики та підриває військову економіку. Ми мусимо приборкати потяг громадян до розкоші та допомогти армії."
 AST_stephensen_tt:0 "\nВибір президента для §YРуху «Австралія понад усе»§! визначає можливі подальші дії."
 AST_strat_bomber_equipment_1_short:0 "Wellington"
 AST_strength_in_numbers_spirit_tt:0 "Змінює §Y$AST_strength_in_numbers_spirit$§! на:"
 AST_submarine_2:0 "$ENG_submarine_2$"
 AST_summons_to_australian_hall_upgrade:0 "$AST_summons_to_australian_hall$"
 AST_tax_reformer_alp:0 "$AST_tax_reformer$"
 AST_victor_crutchley:0 "Віктор Кратчлі"
 AST_volunteers:0 "Добровольці"
 AST_war_angst_spirit:0 "Страх війни"
 AST_war_is_coming_cat_desc:0 "Напруженість зростає, і як австралійські чиновники, так і громадяни починають усвідомлювати, що війна може бути неминучою, незалежно від того, наскільки їхня політика чи інтереси бажають іншого.\n\nМи повинні скликати засідання Кабінету міністрів, щоб визначити процедури на випадок вторгнення. Проте, перш ніж це зробити, можливо, варто вжити дій, з якими повний склад Кабінету може не погодитися."
 AST_war_is_coming_tt:0 "\nРозблоковує §YДемократичні вибори§!"
 AST_well-being_of_the_community:0 "Добробут громади"
 AST_womens_services_director:0 "Директор жіночих служб"
 AST_workers_paradise_desc:0 "Сталінський експеримент із побудовою комунізму обернувся провалом, але впевнені, що соціалізм — вірний шлях. Робітники Австралії підуть своєю дорогою, не слухаючи вказівок з Москви."
 ASY_democratic_DEF:0 "Ассирійська республіка"
 ASY_neutrality_party_long:0 "Ассирійська церква Сходу"
 ATJ_fascism_DEF:0 "Величний Султанат Ачег"
 ATJ_neutrality:0 "Королівство Ачег Даруссалам"
 ATTRITION_TOTAL:0 "Загальне виснаження: $TOT|=-1%2$"
 AUS_STATE_4:0 "Нідерьостеррайх"
 AUS_VICTORY_POINTS_577:0 "Черновіц"
 AUS_air_base_intiative_desc:0 "Хоча в Австрії присутні авіабази, їх уже недостатньо для розміщення наших, нещодавно, значно збільшених військово-повітряних сил. Щоб оптимізувати те, як ми використовуватимемо наші повітряні сили, нам слід розглянути питання про створення необхідної інфраструктури для утримання наших літаків у небі."
 AUS_airforce_intro_tt:0 "Замінити §YÖsterreichische Luftstreitkräfte§! на:"
 AUS_alois_schonburg_hartenstein:0 "Алойс Шьонбург-Гартенштайн"
 AUS_anscluss_process_has_not_begun:0 "Ризик аншлюсу на даний момент [GetAnschlussRisk]. На це впливає співвідношення загальної сили армії (сухопутні війська, ВПС, ВМС) між [ROOT.GetNameDef] й [GER.GetNameDef].\n\nМи також можемо вплинути на це співвідношення подальшими політичними засобами."
 AUS_artillery_equipment_1:0 "7,5 cm Gebirgskanone M. 15"
 AUS_austrostalinism_desc:0 "Відхиляючись від австромарксистської середини та давно скасувавши австрофашизм, Австрія нині дотримується суворого набору сталінських ідей."
 AUS_celebrate_spanish_victory:0 "Відзначити перемогу республіки"
 AUS_civ_industry_effort_effort:0 "Надзвичайні заходи будівництва цивільної інфраструктури"
 AUS_clamp_down_on_dnsap_tt:0 "§Y$AUS_kurt_schuschnigg$§! стане лідером партії «§Y$AUS_fascism_vaterlandische_front_long$§!», а керівна партія зміниться на §YФашизм§!."
 AUS_communist_lawyer:0 "Комуністичний юрист"
 AUS_employment_efforts_desc:0 "Щоб подолати нинішню кризу зайнятості в Австрії, було зроблено значні інвестиції. Тепер, з учнями на фабриках, і люди, і промисловість здаються задоволеними."
 AUS_extend_italian_claims_desc:0 "Ми визначили наш курс щодо того, яким чином ми хочемо вести справи щодо регіонів, які [ITA.GetNameDef] вкрала у нас наприкінці Великої Війни. Ми ніколи не володіли Венецією і Ломбардією, але вони завжди представляли для нас великий інтерес. Чому б не зробити ще один крок і не забрати те, чого ми хотіли і все ще хочемо, якщо ми вже заволоділи тим, що ми мали раніше?"
 AUS_follow_the_jansa_plan:0 "Дотримуватись плану Альфреда Янси"
 AUS_for_a_better_future:0 "[AUS.GetAdjective]е майбутнє"
 AUS_fortify_the_traun_line_desc:0 "Першим кроком плану, викладеного Янсою, було будівництво фортів уздовж річки Траун, однак за поточного стану було вирішено перемістити будівництво фортів до спільного німецького кордону. Ми повинні розпочати цей проєкт до того, як він стане неактуальним."
 AUS_frontmiliz_focus_desc:0 "Тепер, коли ми заслужили довіру [GetMilitiaName], ми повинні забезпечити їх швидку інтеграцію в Бундесгеер. Хоча вони й надалі залишатимуться своїми окремими організаціями, ми принаймні переконаємось, що обидві сторони безперебійно працюють разом. Це забезпечить нам успіх як на полі бою, так і на вулицях нашої власної країни."
 AUS_habsburg_monarchy_restored_desc:0 "Як монархія Австрія була великою силою на європейському континенті. Відновивши монархію, ми знову станемо нею!"
 AUS_hirtenberger_organization:0 "Hirtenberger Defence Systems"
 AUS_invite_spanish_refugees_desc:0 "Незважаючи на всі наші зусилля під час громадянської війни, їх було недостатньо, щоб привести наших братів до перемоги. Результат війни, безумовно, дуже невтішний, але ми, можливо, ще зможемо допомогти їм одужати, запросивши до нас тих, хто боровся за ту саму справу, і інтегруючи їх у австрійське суспільство та армію."
 AUS_joined_faction:0 "Оскільки ми тепер є частиною славетного альянсу [ROOT.GetFactionName], здається, що, німецький лідер, [GER.GetLeader], вирішив відмовитись від інтеграції нас у склад Німеччини.\n\nМи доклали до цього дуже багато зусиль, адже слід було переконатися, що ми здатні зберегти нашу незалежність, і результат був вартий витрачених сил."
 AUS_joint_military_exercises_decision:0 "[ROOT.GetAdjective]о-[FROM.OWNER.GetAdjective]і військові навчання"
 AUS_light_specialization_bonus:0 "Ініціатива Jagdfliegerkompanie"
 AUS_offensive_on_the_fascists:0 "Антифашистський наступ"
 AUS_offensive_on_the_fascists_desc:0 "Ми більше не можемо ігнорувати той факт, що наш південний сусід є джерелом багатьох наших проблем. Хоча ми завжди віддаємо перевагу дипломатії, інколи потрібне більш радикальне втручання."
 AUS_political_events.1.a_tt:0 "Жодних змін щодо наших промислових концернів не буде. Creditanstalt-Bankverein залишатиметься доступним, як результат:"
 AUS_political_events.1.b:0 "Österreichische Creditanstalt є найрозумнішим вибором."
 AUS_political_events.100.desc:0 "\nНезважаючи на нашу попередню відмову від призначення Артура Зейсса-Інкварта в наш уряд, [FROM.GetAdjective]ий лідер, [FROM.GetLeader], не перестає вимагати від нас поступок. Нехай в результаті цього тиск на нас посилився, однак ми все ще зберігаємо наш суверенітет і контроль над нашою власною політикою, тож вибір все ще залишається за нами."
 AUS_political_events.102.desc:0 "На конференції, яку нещодавно скликав [ROOT.GetLeader], фюрер поділився деякими своїми амбіціями щодо майбутнього розширення Німецького Райху. Перший план на розширення [ROOT.GetLeader.GetSheHe] вважає незначним ризиком. \nАвстрійці. Ті ж самі німці, вони нічим не відрізняються від нас, і їх люди переважно мають схожі з нами погляди, що підтверджується політичним кліматом у країні. Фюрер вважає, що такого розширення можна буде досягти дипломатичним шляхом, якщо ми матимемо достатньо часу переконати австрійський народ у правоті [ROOT.GetAdjective]их дружніх настроїв."
 AUS_political_events.107.desc:0 "До нас дійшли нищівні новини про те, що [FROM.GetLeader] здався [GER.GetAdjective]им вимогам щодо їх інтеграції в [GER.GetNameDef]. Хоча перед цим ми надали гарантії австрійцям, видно, нашої обіцянки було недостатньо, щоб заохотити їх до опору німецький машині. Ми все ще маємо інтереси в цьому регіоні, тож в майбутньому ми можемо розглянути питання щодо звільнення Австрії."
 AUS_political_events.114.desc:0 "У світлі нашої нещодавньої угоди щодо ненападу між нашими країнами, [FROM.GetAdjective]ий уряд запропонували нам деяку промислову підтримку. Хоча наш промисловий сектор зазвичай відповідає нашим стандартам, будь-яка допомога вітається з радістю. Було піднято кілька голосів застережень; вони стверджували, що [FROM.GetNameDef] робить це не просто так."
 AUS_political_events.119.a:0 "Ми повинні поступитися..."
 AUS_political_events.120.desc:0 "Наші територіальні вимоги до [FROM.GetAdjective]ого керівництва, на щастя, було схвалено. Незважаючи на те, що і так цього очікували, все одно дуже приємно, що не потрібно вживати більш радикальних заходів для забезпечення контролю над нашою законною територією."
 AUS_political_events.2.desc:0 "Невдовзі після смерті свого шановного генерального директора Вільгельма Берлінера, страхова компанія Phönix зіткнулася з новими проблемами. Новопризначений директор Ебергард Райнінггаус привернув увагу уряду до фальсифікованих балансів, які викрили дефіцит, починаючи з 1929 року, який на даний момент сягає понад 250 мільйонів шилінгів. \n\nКомпанія оголосила про банкрутство та негайно припинила свою діяльність. Так як популярний спосіб страхування учасників бойових дій раптово став недоступний, ми зіткнулися з обуренням багатьох із тих, хто встигли стати залежними від страхових виплат."
 AUS_political_events.20.desc:0 "[GetGuarantorFlavorText]"
 AUS_political_events.29.a:0 "Вони не залишиають нам вибору..."
 AUS_political_events.3.t:0 "Ремілітаризація Рейнланду викликає широке занепокоєння"
 AUS_political_events.30.desc:0 "[GetTreatyStatus]"
 AUS_political_events.31.t:0 "[FROM.GetNameDefCap] вимагає компенсації за свою допомогу"
 AUS_political_events.41.t:0 "[FROM.GetNameDefCap] і [FROM.GetFactionName] вітають нас в союзі"
 AUS_political_events.43.a:0 "Ми не в змозі відбиватися"
 AUS_political_events.48.desc:0 "Дивлячись на дії їх предків в минулому, слід було очікувати, що [FROM.GetNameDef] рано чи пізно втрутиться в нашу внутрішню політику. Нас сповістили, що нині наша країна проголошена монархічною, і нашим новим монархом стане [ROOT.GetLeader]."
 AUS_political_events.64.desc:0 "[FROM.GetAdjective]ий уряд звернулися до нас із пропозицією допомогти ще більше підняти нашу промислову галузь. Вони запропонували покрити частину нашого виробництва необхідних цивільних споживчих товарів, щоб ми могли зосередитися на будівництві нових фабрик."
 AUS_political_events.64.t:0 "[FROM.GetNameDefCap] пропонує промислову допомогу"
 AUS_political_events.71.a:0 "Нарешті, хороші новини!"
 AUS_political_events.84.desc:0 "\nНещодавно ми були вимушені звернути увагу на нову проблему; схоже, що австрійці намагаються розпалити комуністичні настрої серед наших працівників. Хоча поки що це доволі незначна нестабільність, це також може бути підготовкою до чогось. Ми поняття не маємо, які їхні справжні наміри, але краще брати до уваги всі можливі варіанти... навіть найстрашніші."
 AUS_political_events.92.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], звернувся до нас із запитом придбати Аляску. Ще в 1867 році, коли [USA.GetNameDef] викупили її у тодішньої Російської імперії після того, як першу пропозицію до Ліхтенштейну було відхилено. Але «тоді» то не «зараз», з того часу вони змінили свою думку і тепер хочуть придбати у нас цей громадний регіон. Натомість вони пропонують нам щедро заплатити."
 AUS_political_events.93.t:0 "[FROM.GetNameDefCap] продає нам Аляску"
 AUS_purchase_foreign_designs:0 "Придбання іноземних літаків"
 AUS_rebuild_the_armada_desc:0 "Ми маємо історію виробництва сильних бойових кораблів і панування на морях. Зараз ті дні здаються лише минулим, але наше знання не втрачено. Настав час відвоювати моря. Що може бути ефективніше, як створити чималий флот із великими бойовими кораблями, щоб стримувати всяких можливих нападників?"
 AUS_recruiting_the_graduates:0 "Набір з університету"
 AUS_reestablish_austrian_navy:0 "Відродження ВМС"
 AUS_reestablish_benkverein:0 "Creditanstalt-Bankverein буде розпущено, а новий Wiener Bankverein отримає нашу повну підтримку."
 AUS_repeal_the_adelsaufhebungsgesetz:0 "Скасувати закон про ліквідацію дворянства"
 AUS_repeal_the_may_constitution:0 "Скасувати травневу конституцію"
 AUS_restoring_our_rightful_flag_desc:0 "Коли ми взяли участь у Олімпійських іграх 1936 року, ми виявили, що наш прапор такий самий, як і [HAI.GetAdjective]ий. Неохоче ми змінили наш прапор, щоб він відрізнявся від їхнього, але факт залишається фактом: цей прапор належить нам, і оскільки [HAI.GetAdjective]ий уряд не відмовилися від нього тоді, ми повинні впоратися з ними іншим способом."
 AUS_revised_treaty_of_saint_germain_en_laye:0 "Переглянутий Сен-Жерменський Договір"
 AUS_scientific_grants:0 "Наукові гранти"
 AUS_seek_agreement_for_rearmament:0 "Просити згоди на переозброєння"
 AUS_strengthen_legitimistische_corps_desc:0 "Легітимістичний корпус почав свій шлях як студентська організація для австрійських дворян, які навчалися у вищих навчальних закладах нашої країни. Спочатку вони були не чим іншим, як зібранням студентів зі схожими інтересами, однак в міру погіршення політичного клімату, вони ставали все більш мілітаристськими. Ми повинні розглянути можливість найму з них, щоб пришвидшити час розгортання нашої армії."
 AUS_the_right_to_self_determination:0 "Наше право на самовизначення"
 AUS_union_of_danubian_socialists_communism_ADJ:0 "Дунайськ"
 AUS_union_of_danubian_socialists_communism_DEF:0 "Союз Дунайських Соціалістів"
 AUS_unlocks_reichstag_raid:0 "Відкриває §YРейд§!:\nНаліт на Райхстаг проти §Y[GER.GetNameWithFlag]§!"
 AUS_vinzenz_schumy:0 "Вінценц Шумі"
 AUTONOMY_CANT_LOSE_DESC:0 "$OWNER|UH$ поки не може бути знижено до статусу $PREVLEVEL|lH$"
 Amida:0 "Аміда"
 BALTIC_belarus_communism:0 "$NONIDEOLOGYADJ$о-білоруська РСР"
 BALTIC_defending_the_nation:0 "Рада національної безпеки"
 BALTIC_domestic_motors_desc:0 "Іноземні розробки — це добре, але вічно покладатися на них не можна. [Root.GetNonIdeologyName] — горда нація, і ми мусимо показати світові, що наші інженери та мислителі анітрохи не гірші за західних."
 BALTIC_end_bourgeouis_dictatorships_desc:0 "У Балтії домінують так звані «нейтральні» диктатори, що користуються підтримкою армії і не дбають про згоду народу. Балтійський пролетаріат страждає під гнітом капіталістичної диктатури. Лише стараннями звільнених!"
 BALTIC_entente_events.1.d:0 "Будучи лідером Балтійської Антанти, [From.GetNameDef] фінансує нову ініціативу для учасників цього союзу. Фінансування взаємовигідне і для держави [Root.GetNameDef], і для держави [From.GetNameDef], а заразом демонструє відданість справі свободи та розвитку наших народів!"
 BALTIC_events.13.t:0 "Сутичка з «лісовими братами»"
 BALTIC_events.3.t:0 "[From.GetNameDefCap] вимагає прямого втручання"
 BALTIC_forment_disloyalty:0 "Об'єднати опозицію"
 BALTIC_renew_allied_trade_desc_allied:0 "З самого зародження нашої держави ми сподівалися на торгову та військову підтримку Союзників, і було б нерозумно зараз від неї відмовлятися. Щоб пережити тиск німців та росіян на наші кордони, ми мусимо залучити інвестиції Союзників у країну."
 BALTIC_request_german_support_desc_alt:0 "Нам бракує промислової потужності наших фашистських піклувальників, але, можливо, ми зможемо переконати їхній уряд передати нам обладнання із запасів, щоби посилити оборону проти майбутньої комуністичної загрози зі сходу."
 BALTIC_seek_support_of_soviets:0 "Залучитися підтримкою радянців"
 BALTIC_sieze_the_means_of_production:0 "Захопити засоби виробництва"
 BALTIC_soviet_military_staff:0 "Радянське військове керівництво"
 BALTIC_soviet_volunteers_tt:0 "Коли §Yгромадянська війна§! почнеться, буде отримано §Y5 піхотних дивізій§!."
 BALTIC_western_revolution:0 "Нести революцію на захід"
 BAY_ADJ:0 "Баварськ"
 BBA_african_union_events.11.a:0 "Ми будемо обережнішими надалі."
 BBA_ethiopia_balance_of_power_events.51.t:0 "Місцевий владика пропонує створити підрозділ найманців"
 BBA_ethiopia_communist_events.05.desc:0 "Сьогодні військові та антифашистська організація Чорні Леви організували переворот проти уряду [ROOT.GetLeader]. Імператор мав інспектувати війська, коли група незадоволених солдатів заарештувала його та офіцерів. \n\nУ той же час у [ROOT.Capital.GetCapitalVictoryPointName] Чорні Леви захопили ключову інфраструктуру міста, включно з резиденцією імператора. Унаслідок сутичок загинуло багато лоялістів з армії та поліції, але решта [ETH.GetName] тепер під контролем тимчасового уряду. Більшість населення, виснажена війною з [ITA.GetName], просто прийняла нову владу. Тепер нова адміністрація має вирішити долю [ROOT.GetLeader]."
 BBA_ethiopia_communist_events.08.a:0 "Ми не можемо виділити спорядження."
 BBA_ethiopia_communist_events.09.a:0 "Хід війни змінюється на нашу користь."
 BBA_ethiopia_communist_events.28.desc:0 "Дипломатичне протистояння між [ITA.GetName] і [SOV.GetNameDef] зійшло нанівець після того, як [ITA.GetAdjective]а влада погодилася завершити війну проти нас. [SOV.GetAdjective]ий уряд гарантував нашу незалежність і чітко дав зрозуміти, що напад на нас означає напад на них. Однак, схоже, що ціною за їхню допомогу стало наше підпорядкування. Відтепер наша зовнішня політика має повністю відповідати політиці [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_communist_events.34.t:0 "Незалежність Сомалі"
 BBA_ethiopia_communist_events.36.a:0 "Підтримка їм принесла результати."
 BBA_ethiopia_communist_events.40.desc:0 "Нам не вдалося зберегти контроль над нашими територіями в Африці. Уряд [ETH.GetName], досягнувши своїх цілей, звернувся до нас із надією розпочати переговори про мир між нашими сторонами."
 BBA_ethiopia_communist_events.47.desc:0 "[ETH.GetAdjective] дипломати звернулися до нас із пропозицією миру. Умова пропозиції — відмова від претензій на [DJI.GetAdjective] територію, яку ми втратили на користь [ETH.GetNameDef] під час цього конфлікту. Дипломати також заявляють, що в регіоні буде створено [DJI.GetAdjective]ий уряд. Наскільки незалежним буде цей уряд — ще належить побачити."
 BBA_ethiopia_communist_events.49.t:0 "[ETH.GetNameDefCap] пропонує мир"
 BBA_ethiopia_communist_events.58.b:0 "Ми не терпітимемо таких образ!"
 BBA_ethiopia_communist_events.60.a:0 "Яка ж гіпокризія — їхнє імперське насильство можна зупинити лише силою."
 BBA_ethiopia_communist_events.61.desc:0 "[FROM.GetAdjective] дипломати звернулися до нас із пропозицією миру. Умова пропозиції — відмова від претензій на [?ETH.ETH_disputed_colony.GetAdjective] територію, яку ми втратили на користь [FROM.GetNameDef] під час цього конфлікту. Дипломати також заявляють, що в цих територіях буде проведено голосування для обрання нового уряду. Наскільки незалежними будуть ці вибори — ще невідомо."
 BBA_ethiopia_exile_events.04.desc:0 "[ENG.GetNameDefCap] вирішив відкликати $RAJ_orde_wingate$. Вони стверджують, що йому було доручено створити нові сили для допомоги [ETH.GetLeader] у війні в [ETH.GetName]. Вказується, що перебування буде обмежено в часі, і що $RAJ_orde_wingate$ буде дозволено повернутися, коли операція буде завершена."
 BBA_ethiopia_exile_events.07.a:0 "Хороші новини"
 BBA_ethiopia_exile_events.31.a:0 "Принаймні, ми намагалися"
 BBA_ethiopia_exile_events.50.a:0 "Це далеко не допустима поведінка"
 BBA_ethiopia_exile_events.54.a:0 "Ми не забудемо їх внесок у цю справу."
 BBA_ethiopia_exile_events.60.a:0 "Будь-який танк краще, ніж ніякого"
 BBA_ethiopia_fascist_events.57.desc:0 "[FROM.GetName] просить укласти угоду з аутсорсингу озброєнь, за якою [ITA.GetAdjective] компанії заснували б заводи на їх території для виробництва військового обладнання. Керівництво залучених компаній без сумніву буде вдячне за таку можливість для розширення. Однак, якщо [FROM.GetName] колись повстане, ми будемо воювати з ворогом, що знає багато наших слабких місць."
 BBA_ethiopia_military_and_tech_events.1.c:0 "Школа запевниться, що ми завжди будемо готові до війни."
 BBA_italo_ethiopian_war_events.11.a:0 "Це має завдати шкоди їх військовим можливостям."
 BBA_italo_ethiopian_war_events.120.a:0 "Треба зосередитися на чомусь простішому."
 BBA_italo_ethiopian_war_events.15.desc_b:0 "Навіть після резолюції Ліги Націй, яка дозволила підтримку держави [ROOT.GetName], кількість добровольців, які прибувають, щоби допомогти нам у наших військових зусиллях, на жаль, дуже мала. Сподіваємось, що бойові можливості цих хоробрих борців за свободу не поступаються їхньому ентузіазму."
 BBA_italo_ethiopian_war_events.203.t:0 "Виживання всупереч усьому"
 BBA_italo_ethiopian_war_events.303.t:0 "Італійська громадськість ставить під сумнів військові зусилля"
 BBA_italo_ethiopian_war_events.502.a:0 "Яка ганьба."
 BBA_italy_air_accident.11.a:0 "[ROOT.GetNameDefCap] втратила двох чудових офіцерів."
 BBA_italy_anti_colonialism_events.01.desc:0 "Після того, як ми розібралися з нашими внутрішніми справами, ми можемо знову поглянути назовні. Ми успадкували від фашистів багато проблем, які тепер повинні вирішити. Одне з найголовніших питань — це питання Ефіопії. Це була несправедлива і жорстока війна, яку розпочав Муссоліні, що завжди прагнув престижу, і тепер, коли його немає, ми повинні вирішити долю Ефіопії."
 BBA_italy_anti_colonialism_events.54.t:0 "Східна Африка голосує за вступ до держави [ROOT.GetNameDef]"
 BBA_italy_civil_war.1.desc:0 "Наша улюблена Італія розколота під тягарем війни! Зараз формуються протилежні сторони, які боротимуться за те, що залишилося від нашої нації, і за те, які ідеали Італія буде сповідувати в майбутньому. Перед усіма нами стоятиме важкий вибір, але ми повинні бути наполегливими та витривалими, щоб знову розквітнути. "
 BBA_italy_civil_war.4.a:0 "Morto per la libertà!"
 BBA_italy_colonial_management.1.t:0 "Колоніальна поліція"
 BBA_italy_decide_the_fate_of_mussolini.3.desc:0 "Плани вбивства колишнього дуче вже розробляються, але ми повинні ретельно зважити на те, як відреагує італійський народ. Питання в тому, як ми це розкрутимо?"
 BBA_italy_democratic_events.03.a:0 "Ще одна проблема, яку потрібно вирішити."
 BBA_italy_interaction_events.24.a:0 "Ми можемо впоратися самотужки."
 BBA_italy_interaction_events.27.desc_standard:0 "Це вже було зроблено під час Великої війни, але зараз Італія знову просить нас допомогти їй стримати експансіоністську силу Німеччини. Вони хочуть, щоб ми гарантували незалежність Австрії, щоб допомогти захистити їх. Який наш план дій?"
 BBA_italy_interaction_events.28.desc:0 "Наші сусіди на південному сході звернулися до нас з проханням допомогти їм захиститися від можливого нападу Німеччини на Австрію, незалежність якої вони зараз гарантують. Тепер вони просять нас зробити те саме. Як ми повинні відповісти?"
 BBA_italy_interaction_events.31.desc:0 "[GetRatifyStresaFrontEventDesc]"
 BBA_italy_interaction_events.31.t_negotiate_claims:0 "[ITA.GetNameDefCap] хоче обговорити свої претензії до Сомалі"
 BBA_italy_local_rulers.3.d:0 "Ніяких переговорів з місцевими правителями не буде."
 BBA_italy_missiolinis.122.desc:0 "Гірська місцевість Греції виявилася непереборною перешкодою для наших військ. Вони опинилися заблокованими й притиснутими. Проте Дуче залишається переконаним, що перемога буде за нами — мусить бути за нами — і відмовляється визнавати будь-які невдачі. Він палко доводить, що наша перевага врешті-решт переможе."
 BBA_italy_missiolinis.33.a:0 "Перший крок до величі."
 BBA_italy_missiolinis.33.t:0 "Успішна програма індустріалізації"
 BBA_italy_missiolinis.53.desc:0 "Муссоліні особисто привітав заводи, залучені у виробництві нових вантажівок для армії, назвавши робітників кістяком Італії. Тепер він чекає на більш рухомі військові сили, які можуть швидко пересуватися великими обширами землі, не обмежені відставанням логістики."
 BBA_italy_missiolinis.81.desc:0 "Дуче вирішив продемонструвати перевагу фашистської системи та її здібність ефективніше зосереджувати ресурси та зусилля. Він має показати італійцям — а також решті світу, — з якою швидкістю фашизм здатен зробити великі технологічні стрибки. Він також сподівається, що це згуртує й об'єднає історично розділений італійський народ під крилом фашизму."
 BBA_italy_naval_cooperation_programs.07.t:0 "[ROOT.GetAdjective]о-[FROM.GetAdjective]і маневри"
 BBA_italy_pact.1.t:0 "[FROM.GetNameDefCap] Пропонує пакт про ненапад"
 BBA_swiss_expansion.12.b:0 "Це — абсурд!"
 BBA_switzerland.6.b:0 "Ми це розглянемо."
 BBA_switzerland.9.desc_default:0 "[SWI.GetNameDefCap], попри наші заклики до справедливості та їхні заяви про нейтралітет і верховенство права, помилували Давіда Франкфуртера, який не лише вбив члена нацистської партії, а й сам зізнався у цьому!\n\nЦе доводить, що вони обрали сторону і стануть законною ціллю у можливій майбутній війні. Ми не можемо дозволити цій образі [?SWI.SWI_fascist_germany.GetNameDef] залишитися без відповіді."
 BBA_switzerland_fascist.1.desc:0 "Крихітна держава [FROM.GetName], колишня Кримінальна Сирна Держава, прагне приєднатися до [ROOT.GetNameDef], ставши нашим маріонетковим урядом. Це можна вважати як визнання власної слабкості, так і проявом вірності [ROOT.GetRulingParty]\n\nЇхні потужні оборонні можливості та добре підготовлене цивільне населення можуть стати в пригоді для наших майбутніх планів."
 BBA_switzerland_trade.10.a:0 "Ну і гаразд"
 BBA_switzerland_trade.3.t:0 "Наша чинна торговельна угода з [FROM.GetName]"
 BBA_switzerland_trade.4.c:0 "Зосередимось на військовому виробництві"
 BBA_switzerland_trade.5.t:0 "[FROM.GetName] не поновлює нашу угоду"
 BEL_abandon_neutrality:0 "Відмовитися від нейтралітету"
 BEL_academies_of_belgium_dynamic_modifier_tt:0 "Покращити §Y$BEL_academies_of_belgium_dynamic_modifier$§! на:"
 BEL_ateliers_metallurgiques_tubize_organization:0 "Ateliers Métallurgiques-Tubize"
 BEL_british_guarantee:0 "Британська гарантія"
 BEL_corvette_fleet_desc:0 "Будівництво кораблів займає багато часу, особливо для великих капітальних суден. Натомість, через термінову потребу в розширенні нашого флоту, ми повинні зосередитись на малих, легко виготовлюваних суднах, спеціалізуючись на тому, що нам потрібно найбільше: захисті наших торгових інтересів."
 BEL_currently_undertaking_intervention_decision_flag:0 "Наразі виконується інше рішення, щодо §Y$BEL_intervention_in_spain_cat$§!."
 BEL_defensive_reorganization_dynamic_modifier:0 "Оборонна реорганізація"
 BEL_diplomatic_rapprochment_desc:0 "Наше вираження нейтралітету було необхідним для політичних і дипломатичних реалій того часу, але тепер все змінилося. Ми ніколи не припиняли спілкування з нашими друзями з інших націй, але тепер нам слід бути більш відкритими і публічними щодо цього."
 BEL_economic_recovery_ns:0 "Економічне відновлення"
 BEL_edgar_sengier:0 "Едгар Сенж'є"
 BEL_fernand_verstraete:0 "Фернанд Верстрете"
 BEL_fortify_liege_desc:0 "Під час Першої світової війни укріплена позиція Льєжа відіграла важливу роль у стримуванні німецьких сил, що дозволило успішно оборонятися. Однак серйозні недоліки були виявлені в конструкції фортифікацій. Ми засвоїли уроки і тепер настав час оновити укріплення."
 BEL_gaston_eyskens:0 "Гастон Еейскенс"
 BEL_invite_german_tank_organization_desc:0 "Оскільки більшість наших попередніх контактів з броньованими силами тепер закриті для нас, ми повинні шукати нових партнерів для співпраці, щоб доставити панцери до народу."
 BEL_kings_abdication_tt:0 "§GЗ королем Леопольдом йде, Бельгія стане набагато стійкішою до вторгнення.§!"
 BEL_le_patron:0 "Le Patron"
 BEL_leopold_party:0 "Таємна рада"
 BEL_leopolds_return_desc:0 "Король Леопольд III є законним правителем [BEL.GetNameDef], і він має повернутися на свій трон тепер, коли Бельгія була відновлена."
 BEL_medium_tank_equipment_1_short:0 "ACG-1"
 BEL_modify_socialism_on_the_rise_dynamic_modifier:0 "Змінити §Y$BEL_socialism_on_the_rise_dynamic_modifier$§! на:"
 BEL_paul_van_zeeland:0 "Поль ван Зееланд"
 BEL_polish_licences:0 "Польські ліцензії"
 BEL_rally_to_the_king_desc:0 "Король став більше ніж просто в'язнем, він став символом нашої борючої нації. Ми впевнені, що з його лідерством, вмінням, інтелектом і рішучістю ми подолаємо ці темні часи й вийдемо з них сильнішою, більш процвітаючою нацією."
 BEL_renard_constructions_aeronautiques_desc:0 "Одним з найперспективніших дизайнерів останнім часом є Альфред Ренар, який має кілька дуже інноваційних проєктів, і ми повинні підтримати ці ініціативи та його компанію."
 BEL_scars_of_ww1_ns_fake:0 "$BEL_scars_of_ww1_dynamic_modifier$"
 BEL_secretaries_general_tt:0 "§YКерівник держави§! отримає спеціальний §YЗакон про окупацію§!, доступний лише в §YБельгійських осередніх територіях§!"
 BEL_socialism_on_the_rise_dynamic_modifier:0 "Соціалістичні настрої"
 BEL_the_european_crusade:0 "Європейський хрестовий похід"
 BEL_the_secret_army_desc:0 "Тепер, коли наша країна була окупована, ми повинні почати будувати спротив для здійснення актів саботажу та дезорганізації. Таємна армія є нашим каналом для цього, заснована на численних офіцерах нашої поразеної армії, які мають організаційні та логістичні навички для початку цієї роботи. Все, що нам потрібно, це віддати наказ."
 BEL_unity_makes_strength_desc:0 "Спочатку девіз Голландської Республіки, коли вона правила як Нідерландами, так і Бельгією. Він був формально прийнятий бельгійською державою після революції 1830 року, яка призвела до нашої незалежності. Він дійсно був увічнений єдністю ліберальних прогресистів і католицьких консерваторів, що стояли в центрі бельгійської політики, і з того часу втілює бельгійську ідею."
 BHR_democratic_party_long:0 "Рух за свободу Бахрейну"
 BIA_neutrality_party_long:0 "Прихильники оби"
 BLI_fascism:0 "Вілватікта"
 BLR_GER_fascism_autonomy_satellite_DEF:0 "Райхсланд Остланд"
 BLR_fedor_dobysh:0 "Федір Добиш"
 BLZ_DEF:0 "Беліз"
 BOL_democratic_ADJ:0 "Болівійськ"
 BOL_eusebio_ayala:0 "Еусебіо Аяла"
 BOL_fabian_vaca_chavez:0 "Фабіан Вака Чавес"
 BOL_subject:0 "$OVERLORDADJ$а $BOL$"
 BOP_LEFT_SIDE_TOOLTIP:0 "[ROOT.GetLeftSideName]"
 BORDER_CONFLICT_IF_YOU_LOSE:0 "§HЯкщо Ви програєте:§!"
 BORDER_CONFLICT_IF_YOU_WIN:0 "§HЯкщо Ви переможете:§!"
 BOTTLENECK_CONNECTION_REASON_DAMAGE:0 "Від шкоди: §R-$NUMBER$§! (§R-$PERCENTAGE|.0$§!)"
 BRA_GATHERING_STORM_DESC:0 "Велика депресія зруйнувала бразильську економіку через надмірну залежність від експорту. Наступні роки стали свідками зростаючого рівня політичних потрясінь, коли коаліції військових, робітників і політиків скинули олігархію, що правила країною, і замінили її крихкою демократичною конституцією.\n\nЖетулью Варгас вийшов на передній план бразильської політики, нещодавно зупинивши комуністичний переворот і взявши на себе надзвичайні повноваження. Поки що невідомо, чи буде відновлено демократію, чи Варгас поведе країну в більш авторитарному напрямку."
 BRA_airforce_modifier:0 "$SMB_air_force_BRA$"
 BRA_alvaro_alberto_da_motta_e_silva:0 "Алвару Алберту да Мотта-і-Сілва"
 BRA_authoritarian_populist:0 "Авторитарний популіст"
 BRA_bop_left_side:0 "Цивільний уряд"
 BRA_brown_water_navy_idea:0 "Розширений узбережний флот"
 BRA_brown_water_navy_idea_bonus_tt:0 "Уся піхота:\n §YРічка:§!\n Рух: §G+10%§!\n Атака: §G+10%§!\n Захист: §G+5%§!"
 BRA_cohen_plan_tt:0 "Відкриває завдання §Y$BRA_execute_the_cohen_plan$§!, яке треба виконати протягом 100 днів від завершення цього фокусу. Для виконання потрібно виконати фокус §Y$BRA_estado_novo$§! або §Y$BRA_estado_moderno$§!. §RНевдача призведе до перевороту!§!"
 BRA_deal_with_the_cangaceiro_dec:0 "Почати операцію проти кангасу в області §Y[FROM.GetName]§!"
 BRA_deal_with_the_cangaceiro_tt:0 "Відмикає сукупність рішень §Y$BRA_deal_with_the_cangaceiro$§! для ліквідації кангасу в уражених штатах."
 BRA_ethical_internationalism_desc:0 "Навіть найбільші держави не можуть створити і забезпечити свій народ усім необхідним. Щоби забезпечити мир і процвітання для нашого народу, нам слід збудувати свою зовнішню політику на взаємовигідному економічному партнерстві з країнами-однодумцями."
 BRA_invite_to_organization_faction:0 "Висунути ідею військового співробітництва з державою §Y[FROM.GetNameDef]§!"
 BRA_invite_to_ussa:0 "Висунути ідею інтеграції державу §Y[FROM.GetNameDef]§! в державу §Y[ROOT.GetNameDef]§!"
 BRA_italian_aircraft_desc:0 "Співпраця з італійцями дозволила нам використовувати їхні технології в тих галузях, у яких ми раніше намагалися модернізуватися, і однією з таких галузей є авіабудування. Використовуючи італійські технології, ми будемо панувати в небі Південної Америки!"
 BRA_jaguar_diplomacy_desc:0 "Нещодавно [CHI.GetName] використала одну зі своїх рідних тварин як дипломатичний подарунок. Незважаючи на ідеологічні розбіжності, це, здається, успішний метод згладжування напружених стосунків з іноземними урядами. Можливо, ми могли б використати ту ж техніку, щоб відмовити великі держави від втручання в наші власні справи."
 BRA_kgbrazil_desc:0 "[BRA_kgbrazil_desc_key]"
 BRA_launch_the_revolution_desc:0 "Настав час. Ми виправимо те, що не змогли зробити у 1935 році під час Intentona Comunista. Ми повинні повстати проти [BRA.GetLeader] та його гнітючого уряду."
 BRA_liberation_in_progress:0 "Уже готуються вимоги про деколонізацію"
 BRA_modify_brazilian_airforce_ns_intro:0 "Ідею §Y$BRA_airforce_modifier$§! буде змінено:"
 BRA_rejected_washington_accords:0 "Відхилено Вашингтонські угоди"
 BRA_sub_ship_engine_1:0 "«Ansaldo» 2 000 к. с. н. в."
 BRA_submarine_2_desc:0 "The Tupy class was a class of Brazilian submarines built by Italy in the mid-1930s. They were smaller submarines, displacing just over 600 tons, and was armed with six 533mm torpedoes."
 BRA_support_industrialists_desc:0 "Хоча серед нашого населення більше робітників, ніж капіталістів, останні контролюють значно більше багатства та ресурсів. Ми повинні запровадити політики, які обмежують права робітників та дозволяють промисловцям працювати ефективніше для покращення економіки в цілому."
 BRA_support_weapons3:0 "M1919 Browning MG & M1 mortar"
 BRA_supporting_operation_bolivar:0 "Підтримка операції «Болівар»"
 BRA_the_international_crisis_desc:0 "Світ стає все більш нестабільним, оскільки напруженість між великими державами зростає, а старі прикордонні суперечки знову виходять на перший план зовнішніх справ. Ми повинні діяти обережно, але також звертатися до інших демократичних націй у регіоні для нашої спільної безпеки."
 BRA_united_states_of_south_america_cos_tag_neutrality_def:0 "Південноамериканська імперія"
