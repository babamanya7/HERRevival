 PER_fascist_reach_out_to_germany:0 "Подивитися на Захід"
 PER_fawzia_faud:0 "Фавзія Фуад Єгипетська"
 PER_follow_the_tudeh_desc:0 "Партія Туде — єдина партія, яка відображає бажання народу до радикальних змін, а не демократичну ширму нинішнього режиму. Таким чином, ми повинні згуртуватися навколо них як навколо серця радикального руху."
 PER_form_arya_party:0 "Сформувати Партію Арія"
 PER_idea_reject_foreign_dominance:0 "[ROOT.GetAdjective] Солідарність"
 PER_imperial_events.132.desc:0 "На жаль, [SOU.GetAdjective] уряд відмовився від нашої пропозиції про здачу. Це означає, що ми повинні продовжувати бої, але якщо ми програємо, то, ймовірно, здамося на їхніх умовах."
 PER_imperial_events.202.a:0 "...ви могли б просто сказати «ні»."
 PER_imperial_events.62.desc:0 "На жаль, ми не змогли переконати [GER.GetNameDef] підписати пакт про ненапад. Це прикро, але це все ще може дозволити нам приєднатися до їхньої фракції в майбутньому."
 PER_increase_faculty_staffing_budget:0 "Збільшити бюджет на персонал факультету"
 PER_infantry_equipment_3_short:0 "ППШ-41"
 PER_iranian_revanchist:0 "Іранський реваншист"
 PER_iranian_shipyards_organization:0 "Іранські верфі"
 PER_last_thousand_years_desc:0 "Завдяки всій нашій наполегливій праці та відданості покращенню нашої нації, ми нарешті досягли точки, коли [PER.GetNameDef] судилося витримати випробування часом та вийти на світову арену як сучасна та могутня країна. Ми нарешті перевершили велич наших предків Ахеменідів!"
 PER_lingering_islamic_beliefs:0 "Стійкі ісламські вірування"
 PER_merchant_navy_desc:0 "Перевезення ресурсів морем є життєво важливим для виживання [PER.GetNameDef]. Тому вкрай важливо, щоб ми створили професійний торговий флот, здатний підтримувати наших військових."
 PER_mohammed_reza_pahlavi:0 "Мохаммед Реза Пехлеві"
 PER_nikolai_markov:0 "Ніколай Марков"
 PER_own_plane_designs_desc:0 "Вклавши ресурси у придбання іноземних літаків, можливо, настав час доручити нашим інженерам створення власних конструкцій літаків для використання у повітряних силах."
 PER_persian_german_trade_desc:0 "[GER.GetNameDefCap] вдалося швидко індустріалізуватися знову після поразки у Великій війні. Це був би чудовий приклад для наслідування, коли ми прагнемо модернізувати [PER.GetNameDef]. Здається, що їхній новий лідер також поважає нас, що дозволяє плавний перехід до формування позитивних стосунків."
 PER_preemptive_strike:0 "Превентивний удар"
 PER_profit_from_war:0 "Отримати прибуток від війни"
 PER_raf_planes_desc:0 "[ENG.GetNameDefCap] має Королівські повітряні сили, і їхній талант та майстерність добре відомі більшості націй. Однак не лише майстерність їхніх пілотів, але й якість їхніх літаків допомагає їм перемагати у битвах. Давайте звернемося до них і зробимо замовлення на їхні літаки."
 PER_rally_ancient_history:0 "Згуртуватися навколо стародавньої історії"
 PER_rapid_appeasement_tt:0 "Пожертвувавши нашими ресурсами, нам вдалося відвернути революцію наразі."
 PER_request_british_equipment:0 "Запросити [ROOT.OVERLORD.GetAdjective] обладнання"
 PER_revolution_in_the_gulf_tt:0 "Відмикає більше рішень §Y$PER_gulf_decisions_cat$§! для сприяння опору в окупованих областях Перської затоки."
 PER_shiraz_university_bonus:0 "Профінансовано Університет Шираза"
 PER_soviet_alignment_tt:0 "Якщо §Y[SOV.GetNameWithFlag]§! є комуністичною, вони будуть запрошені до нашої фракції."
 PER_ssb_events.7.a:0 "Сьогодні великий день для [ROOT.GetAdjective]!"
 PER_ssb_events.8.desc:0 "Тривожна новина: [FROM.PREV.GetNameDefCap] оголосив війну іншому члену, порушивши основне положення Саадабадського договору. В результаті [FROM.PREV.GetNonIdeologyName] був виключений з Саадабадського пакту. Лише час покаже, який вплив це матиме на пакт у майбутньому, можливо, це призведе до посилення солідарності між членами, що залишилися, або, можливо, це спричинить ланцюговий розкол, що призведе до загибелі Саадабадського пакту."
 PER_the_new_economy_desc:0 "Нова економіка, заснована на потребах народу, а не на примхах ринку, нарешті починає формуватися після наших реформ. Хоча ще є над чим працювати, ми можемо сказати, що будуємо соціалізм у [ROOT.GetNameDef]."
 PHI_american_intervention_unlock_more_decisions_tt:0 "Завершення цього фокусу розблокує більше §Yрішень§! для зниження ризику §Yамериканської інтервенції§!"
 PHI_back_soon_trait:0 "Немає уряду"
 PHI_basilio_fernando:0 "Basilio Fernando"
 PHI_battalion_combat_teams_tt:0 "§Y$category_all_infantry$§!:\n    Протипіхотна атака: §G+15%§!\n    Протитанкова атака: §G+15%§!\n    Бронебійність: §G+15%§!\n §Y$category_cavalry$§!:\n    Протипіхотна атака: §G+10%§!\n    Протитанкова атака: §G+10%§!\n    Бронебійність: §G+10%§!"
 PHI_coastal_defense_ships_desc:0 "Наш флот зріс настільки, що тепер ми маємо інфраструктуру та засоби для складання та обслуговування більших суден. Нашою першою метою залишається захист власних берегів, але тепер ми можемо проєктувати судна, які здатні битися на рівних з ворожими основними кораблями, використовуючи нашу власну географію на свою користь."
 PHI_decision_cost_convoys_icon_large:0 "[?PHI_convoy_vars_large_cost] £GFX_topbar_convoys"
 PHI_dockworker_infiltration:0 "Співпраця з докерами"
 PHI_encourage_foreign_investment_desc:0 "Сполучені Штати — не єдина країна, зацікавлена в отриманні частки нашого ринку. У нас є численні сировинні ресурси та процвітаючий аграрний сектор. Ми повинні чітко заявити, що наша нація відкрита для інвестицій для тих, хто має кошти та далекоглядність, щоб отримати вигоду від дарів Філіппін."
 PHI_i_shall_return_desc:0 "Цю фразу вимовив генерал Даглас МакАртур, коли евакуювався з [PHI.GetNameDef], і з того часу він часто її повторював. Настав час надати інструменти та обладнання, щоб зробити це реальністю."
