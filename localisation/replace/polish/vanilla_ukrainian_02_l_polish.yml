 HINT_EXECUTE_ORDER_TEXT:0 "Під портретом є мала шкала прогресу (3), що показує відносну силу між Вашою армією та можливими ворожими військами.\n\nЯкщо Ви ще не призначили командира для армії, варто зробити це зараз. Клацніть на порожній портрет угорі зліва.\n\nЯкщо ситуація складається на Вашу користь, значок припущеного плану (2) має стати зеленим. Якщо це так, клацніть по кнопці §YВиконати план§! (1)."
 HINT_PRODUCTION_LINES_TEXT:0 "Це екран §Yвиробництва§!, де показані Ваші виробничі лінії. Вони виробляють оснащення, потрібне для ведення війни. Рекомендовано виробляти оснащення і потрібне зараз, і яке знадобиться в майбутньому.\n\nЄ два типи виробничих ліній: військові та морські. Військові використовують £factory_item£ §Yвійськові заводи§!, а морські — £naval_factory_icon£ §Yверфі§!. Що більше заводів призначено для виробничої лінії, то швидше на ній вироблятиметься потрібне озброєння.\n\nВиробничу лінію можна створити, клацнувши по одній із чотирьох виділених кнопок угорі. Коли Ви виберете тип оснащення з однієї з цих категорій, буде створена відповідна виробнича лінія.\n\nПрочитайте §Yнаступну сторінку§! цієї підказки, щоб глянути §Yпоради§! щодо того, що саме виробляти та скільки заводів призначати для кожної лінії."
 HINT_RESEARCH_TREE:0 "Підказка: Дерева технологій"
 HOA_the_steel_lions:0 "$ETH_steel_lions$"
 HOL_FRA_democratic_subject:0 "Батавська республіка"
 HOL_VICTORY_POINTS_4361:0 "Оостгавен"
 HOL_WILHELMINISM_NEUTRALITY:0 "Династичні зв'язки між нашим власним королівським домом і домом німецького кайзера, який донедавна перебував у вигнанні в Гейс-Доорні в Нідерландах, все ще сильні. Ми, сім'я, повинні бути разом, і німці, безумовно, мають підстави дякувати нам за те, що весь цей час приймали їхнього Кайзера."
 HOL_benelux_unified_democratic:0 "Бенілюкська федерація"
 HOL_borneo_and_the_grote_oost:0 "Борнео та «Великий Схід»"
 HOL_borneo_and_the_grote_oost_desc:0 "Великий острів Борнео й інші острови, відомі під загальною назвою «De Grote Oost» («Великий Схід»), як-от Сулавесі та Молуккські острови, мають бути більш доступними для нашого зростаючого населення, дозволяючи більшій кількості промисловості осісти в цих районах."
 HOL_continental_shipbuilding:0 "Континентальне кораблебудування"
 HOL_de_jeugdstorm_desc:0 "Відвернути населення від палкого пацифізму і за кілька років прищепити йому культуру мілітаризму — нелегка справа. Але завдяки широкій пропаганді, риториці, починаючи з нашої вразливої молоді, ми впораємося з цим у повній мірі, на яку зможемо."
 HOL_decolonization_desc:0 "Наша батьківщина має багато проблем, і замість того, щоби посилати наші ресурси за кордон, щоб піклуватися про наші колонії, одночасно пригнічуючи корінне населення, ми повинні чітко дати їм їхню свободу, щоб вони могли піднятися як повноправний і рівноправний член світової спільноти, вийшовши з неї. наші сили повертаються на материк у процесі."
 HOL_east_indies_investments_mod_tt:0 "Змінює §Y$HOL_east_indies_investments_mod$§! на:"
 HOL_fortress_holland:0 "Голландська фортеця"
 HOL_hendrik_seyffardt:0 "Генрік Сеейффардт"
 HOL_lead_the_minor_democracies_desc:0 "Оскільки великі держави нашого часу, схоже, налаштовані на нову війну, малим демократіям Європи залишається вберегти світ від спалаху, як натовп, який тримає двох бійців один від одного. Ми очолимо інших у формуванні блоку нейтралітету проти розпалювачів війни."
 HOL_making_the_ends_of_europe_meet_desc:0 "Тепер комунізм охоплює Європу з обох сторін. Настав час звести кінці з кінцями та усунути владу між ними."
 HOL_prepare_for_our_return_taog_desc:0 "$HOL_prepare_for_our_return_desc$"
 HOL_request_infantry_equipment_desc:0 "Якщо ми хочемо допомагати союзникам у бою, для цього потрібно отримати від них необхідне обладнання."
 HOL_responsibility_for_our_own_defense_desc:0 "Не маючи великих сил, на які можна покластися, у нас немає іншого вибору, окрім як подбати про свій власний захист і взяти на себе повну відповідальність за те, щоб вони відповідали будь-якому виклику, який може бути кинутий проти них."
 HOL_revive_the_buffer_state_proposal_desc:0 "Оскільки німці та французи, схоже, не можуть утриматися від того, щоби знову і знову вдарити один одного в горло, можливо, настав час знову обговорити аргументи на користь потужної буферної держави в Нідерландах. Якщо бельгійці та люксембуржці не бажали цього, то, можливо, вони повинні були зробити більше, щоби зробити свій внесок у військові зусилля, як це зробили ми?"
 HOL_submarine_1_desc:0 "The K-III class consisted of two submarines built for and used by the Royal Dutch Navy as patrol subs. They were commissioned in the early 1920s, and based on the U.S. Holland-class submarines. Each displaced over 580 tons and were armed with four 450mm torpedo tubes. "
 HOL_the_netherlands_first:0 "Нідерланди передусім"
 HOL_the_netherlands_first_desc:0 "Нідерланди мають усі багатства природних ресурсів, щоби бути великою державою. Якщо ми належним чином скористаємося цим і продовжимо мілітаризувати наше суспільство, нам не потрібна буде допомога Німеччини, щоби зайняти власне місце в цьому світі."
 HOL_unity_through_democracy:0 "«Єдність крізь демократію»"
 HOL_zuiderzee_infrastructure_advancements:0 "Розвиток інфраструктури Зьойдерзее"
 HRE_UNIFIED_democratic_DEF:0 "Федеративна республіка Центральної Європи"
 HUN_AUS_danubian_state_DEF:0 "Дунайська держава Угорщина"
 HUN_HOL_autonomy_eu_member:0 "Європейська Угорщина"
 HUN_VICTORY_POINTS_690:0 "Брошшо"
 HUN_anti_tank_equipment_2:0 "38M 50 mm"
 HUN_civilian_industry:0 "Цивільна промисловість"
 HUN_claim_galicia_desc:0 "Польща — ніщо інше, як штучно створена держава. У разі потреби її можна розібрати на частини."
 HUN_council_of_peoples_commissars_desc:0 "Нам потрібен орган управління, який відповідав би за перехід Угорщини до комуністичного режиму. Після завершення цього процесу Раднарком стане аналогом західних кабінетів міністрів."
 HUN_dynastic_ties_desc:0 "Шведський король на угорському троні означає ближчі зв'язки між двома країнами. Вони можуть прийти один одному на допомогу у воєнний час, а уряд Швеції з більшою ймовірністю надасть Угорщині ліцензії на виробництво."
 HUN_elect_a_fascist_king_desc:0 "Нашій нації потрібен сильний лідер, здатний стати нам опорою в непрості часи. Це має бути хтось, хто зможе вселити в наш народ впевненість у завтрашньому дні, а в наших ворогів — страх."
 HUN_expand_the_manfred_weiss_steel_works:0 "Розширити металургійний комбінат М. Вайсса"
 HUN_expand_the_technical_university_of_budapest_desc:0 "Нам потрібно більше світлих умів, що працюють над науковими відкриттями, які допоможуть нам підготуватися до майбутніх конфліктів. Розширення столичного університету забезпечить нашій оборонній промисловості приплив талановитих учених та інженерів."
 HUN_francois_deak:0 "Франсуа Деак"
