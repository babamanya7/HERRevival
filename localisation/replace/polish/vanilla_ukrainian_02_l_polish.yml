 SET_NEEDED_AMOUNT:0 "Установити кількість на потрібну для задоволення нашої поточної потреби в цьому ресурсі."
 SHIFT_CLICK_TO_ADD_ALL:0 "§GShift + клацніть§!, щоби додати все."
 SHIPS_LOST_FILTER_FACTION:0 "Фільтрувати за альянсом, щоби бачити тільки кораблі, які ми втратили через цей альянс, та їхні кораблі, які ми потопили"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_4:0 "Вступ. при високому ризику"
