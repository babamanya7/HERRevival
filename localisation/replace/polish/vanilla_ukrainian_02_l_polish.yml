 SOV_a_sustainable_economy_desc:0 "Перехід до нової економічної політики супроводжувався помітним зсувом у бік виробництва споживчих товарів за рахунок уповільнення загальної швидкості індустріалізації. Якщо ми хочемо бути конкурентоспроможними в довгостроковій перспективі, нам потрібно перевести економіку на більш стійку модель."
 SOV_advanced_maneuvers:0 "Новітні маневри"
 SOV_advanced_maneuvers_desc:0 "Мати великі та сучасні кораблі немає сенсу, якщо їхні екіпажі не мають уявлення про те, як ними користуватися. Ми мусимо запровадити регулярні, масштабні військово-морські навчання для підготовки наших екіпажів та офіцерів до сучасної морської війни."
