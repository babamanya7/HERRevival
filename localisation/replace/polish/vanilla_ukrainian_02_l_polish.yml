 ARG_align_with_the_monroe_doctrine_desc:0 "Протягом багатьох років доктрина Монро була політикою запобігання європейському втручанню в Західну півкулю. Хоча зараз ми є союзниками європейських держав, ми повинні повністю приєднатися до цієї доктрини та запобігти вторгненню в Америку."
 ARG_american_defense_investments:0 "Американські оборонні інвестиції"
 ARG_anti_american_propaganda_idea:0 "Антиамериканська пропаганда"
 ARG_argentine_nationalism_idea:0 "Аргентинський націоналізм"
 ARG_british_argentine_agreement:0 "[ENG.GetAdjectiveCap]о-[ARG.GetAdjective]а угода"
 ARG_british_influences_idea:0 "Influence in Argentina"
 ARG_buying_the_islands_idea:0 "Придбано острови в Південній Атлантиці"
 ARG_capitalize_the_beef_industry:0 "Капіталізувати м'ясну промисловість"
 ARG_committee_of_state_security_desc:0 "У міру зростання світової напруги, все більше ворогів нашої ідеології починають виповзати з тіні. Щоб утриматися при владі, вкрай важливо, щоб ми зосередилися на створенні розвідувального агентства для забезпечення наших цінностей як в [ARG.GetNameDef], так і на міжнародному рівні."
 ARG_cruiser_ship_engine_4:0 "Двигун 110 000 к. с. н. в."
 ARG_economic_reactivation_idea_desc:0 "Закон про економічну реактивацію — це законодавчий акт, створений для того, щоб забезпечити спрямування більшої кількості державних коштів на фінансування розвитку економічних та промислових секторів."
 ARG_eduardo_avalos:0 "Едуардо Авалос"
 ARG_fighter_equipment_2_short:0 "Hawk 75O"
 ARG_hitler_1_desc:0 "З нашим новим президентом в уряді відбувся негайний поштовх до кардинальних змін у [ARG.GetNameDef], щоб наслідувати минулу силу, якою володіла [GER.GetNameDef]. Сеньйор Гілтер, здається, наполягає на створенні Четвертого Рейху в Південній Америці. Що може піти не так цього разу?"
 ARG_import_substitution_desc:0 "У міру зростання напруги у світі імпорт з Європи значно скоротився. Хоча ми маємо тісні торговельні зв'язки з [ENG.GetAdjective], [ARG.GetAdjective] економіці доведеться розпочати заміщення імпорту шляхом посилення індустріалізації."
 ARG_march_to_la_casa_rosada_desc:0 "Уряд Кастільйо нарешті зайшов надто далеко. Невдоволення у військових досягло критичної точки, коли президент наказав подати у відставку Міністру війни Педро Пабло Раміресу за переговори з опозиційною партією UCR. Військове керівництво згуртовує своїх лоялістів та готується до маршу на Касу Росаду."
 ARG_news_events.2.d:0 "Сьогодні вранці важкий крейсер Крігсмаріне «Адмірал Граф Шпее» вступив у бій з ескадрою Королівського флоту біля Ла-Плати у Південній Атлантиці. У битві, що послідувала, низка [ENG.GetAdjective] кораблів була серйозно пошкоджена та змушена відступити, прямуючи до Фолклендських островів. «Адмірал Граф Шпее», навпаки, зазнав мінімальних пошкоджень, за винятком критичного удару по його паливній системі. [GER.GetAdjective] корабель втік до порту Монтевідео у [URG.GetNameDef], щоб здійснити терміновий ремонт. Багато джерел стверджують, що це перша морська битва цього конфлікту, і схоже, що війна нарешті дісталася континенту Південної Америки."
 ARG_our_own_path_idea_desc:0 "Незважаючи на всі труднощі, які ми пережили, щоб потрапити сюди, [ARG.GetNameDef] здатна стояти на власних ногах, не стаючи на коліно перед іншими націями, угрупованнями та конгломератами. Ми самі обираємо свій шлях у ці неспокійні часи."
 ARG_political_events.15.t:0 "[ARG.GetNameDefCap] висуває ультиматум"
 ARG_political_events.27.a:0 "Ми не можемо їх стримати"
 ARG_political_events.61.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 ARG_political_events.72.t:0 "Антоніо Сото встановлює Аргентинський анархо-синдикалізм"
 ARG_preparing_for_war_idea_desc:0 "Південноамериканський континент нависає над нами, готовий до захоплення. Наші армії готуються до війни, в той час як наші політики та дипломати завзято створюють документи та ультиматуми, готуючись до нашого завоювання. Гадюка стоїть напоготові, щоб завдати удару."
 ARG_public_works_investment_idea_desc:0 "Для [ARG.GetAdjective]ого уряду важливо фінансувати і закуповувати проєкти громадських робіт для рекреації, працевлаштування, охорони здоров'я та безпеки. Це сприятиме покращенню якості життя у більшій [ARG.GetAdjective]ій спільноті."
 ARG_ship_medium_battery_2:0 "19 cm/52 Odero–Terni"
 ARG_support_the_farmers_decisions:0 "Підтримати фермерів"
 ARG_support_the_spanish_coup_desc:0 "Наші брати в Іспанії зараз беруть участь у кривавій громадянській війні за майбутнє своєї країни. Ідеї Франко про керований військовими уряд значною мірою збігаються з нашими. Ми повинні негайно надіслати допомогу і показати світові помилковість демократії."
