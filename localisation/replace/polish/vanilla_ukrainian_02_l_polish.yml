 SPR_anti_fascist_unity_tt:0 "Будуть відкриті рішення §Y$SPR_anti_fascist_unity$§!, які дозволять відстрочити повстання анархістів в обмін на поступки.\n"
 SPR_castille_fascism_DEF:0 "Націоналістична Кастилія"
 SPR_destroyer_1_desc:0 "The three destroyers of the Alsedo class were built for the Spanish Navy in Spain. They were based on the British L-class design, and were commissioned between 1924 and 1925. They displaced over 1,040 tons and had three 102mm/45 Vickers Mk LA guns as their main armament, as well as four 450mm torpedo tubes. They had decent speed and range for their vintage as well."
 SPR_destroyer_2:0 "Клас «Churruca»"
 SPR_disbanded_army_desc:0 "Армія довела свою нелояльність і була розпущена урядом. Поки ми не переконаємось у лояльності наших офіцерів, ми мусимо покладатися на народне ополчення, а не на професійну армію."
 SPR_distribute_arms_to_the_people:0 "Роздати людям зброю"
 SPR_distribute_arms_to_the_people_desc:0 "Нелояльність у військових тепер майже безсумнівна, і зрозуміло, що ми не можемо покладатися на них у захисті цінностей Республіки. Ми повинні почати розповсюджувати зброю тим, хто дбає про найкращі інтереси Республіки, щоб вони могли сформувати перший захист від можливого повстання."
 SPR_eliminate_guerrillas:0 "Знищити партизанів у області [From.GetName]"
 SPR_enlist_the_carabineros_tt:0 "Ви отримаєте 1 дивізію з §Y3§! батальйонами §Yпіхоти§! в 5 випадкових регіонах.\n"
 SPR_government_power_struggle_desc:0 "Незважаючи на те, що ліві політичні партії перемогли на останніх виборах, вони роздроблені, оскільки кожна з них бореться за домінування нового уряду. Офіс самого президента зазнає особливої атаки, оскільки давні ворожнечі президента з різними частинами політичних лівих загострюються. Завзяті й амбіційні політики вже з жадібністю дивляться на цю позицію."
