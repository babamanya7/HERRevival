 ROM_AUS_danubian_state_DEF:0 "Дунайська держава Румунія"
 ROM_CAS_equipment_1:0 "IAR 37"
 ROM_GATHERING_STORM_DESC:0 "Румунія вийшла з Великої війни переможницею, і внаслідок цього здобула нові території та людей, не всі з яких, щоправда, — румуни. Щоб захистися від реваншизму з боку країн, які були вимушені передати їй землі, Румунія створила мережу союзів по всіх Балканах. За останні роки, щоправда, держава в основному зайнялася внутрішніми справами, а уряд Кароля II дав цим союзам розпастися.\n\nЗі змінами в політичній ситуації в Європі Румунія може опинитися самотньою та вразливою."
 ROM_HOL_autonomy_eu_member:0 "Європейська Румунія"
 ROM_VICTORY_POINTS_11659:0 "Дебрекін"
 ROM_acquire_licenses:0 "Отримати ліцензії"
