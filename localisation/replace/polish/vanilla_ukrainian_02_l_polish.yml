 denmark_protection_event.100.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], пропонує нам об'єднати сили, і заявляє, що разом ми зможемо на рівних протистояти найсильнішим світовим державам. Що ми відповімо?"
