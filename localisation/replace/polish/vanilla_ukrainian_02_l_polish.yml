 more_likely_to_accept_federalization_tt:0 "- Вони §Gвисокої§! думки про нас\n- Ми поділяємо ідеологію"
 motorised_infantry_desc:0 "Пересадивши повільну піхоту на автотранспорт, ми різко збільшимо її мобільність, що дозволить швидше реагувати на ситуації і розробляти нові стратегії."
 motorized_equipment_desc:0 "Вантажівки, використовувані для перевезення військ, припасів, а також для моторизації дивізій."
 mtg_britain.109.a:0 "Нам залишається лише прийняти це."
 mtg_britain.31.t:0 "[From.GetNameDefCap] приймає пропозицію щодо невтручання"
 mtg_britain.35.t:0 "Хода на Даунинг-стріт"
 mtg_britain.51.d:0 "[From.GetNameDefCap] відкидає нашу пропозицію. Його представники стверджують, що не налаштовані вороже до Німеччини."
 mtg_britain.52.d:0 "[From.GetNameDefCap] звертається до нас із проханням вступити до Комінтерну."
 mtg_britain.55.d:0 "Деякі елементи в нашій партії давно звинувачували нас у нещирості і в тому, що ми лише розмовляємо про комуністичні ідеали свободи і рівності. Тепер ці елементи спробували зробити переворот. Нам вдалося зберегти владу, але ситуація загострилася і переросла у справжню громадянську війну."
 mtg_britain.56.t:0 "Комуністична громадянська війна закінчилася"
 mtg_britain.59.d:0 "Хід в області [ENG_blackshirt_march_state.GetName] був зустрінутий масштабними протестами і пройшов з жорстокими вуличними зіткненнями. Незважаючи на велику кількість поранених і навіть кілька вбитих, нашим чорносорочникам вдалося стримати атаки з боку порушників."
 mtg_britain.61.a:0 "Потрібно бути напоготові."
 mtg_britain.61.d:0 "До нашої інформації дійшло, що [From.GetNameDef] підтримує імперських лоялістів у нашій країні. Якщо не припинити цю діяльність, то справа може дійти до справжньої громадянської війни!"
 mtg_britain.72.d:0 "Спроби зберегти єдину державу на Індійському субконтиненті, найімовірніше, приведуть до великої напруги. Через релігійні відмінності починаються заворушення і зіткнення, особливо на північному заході та північному сході країни, а окремі діячі вдаються до все більш ворожій риториці... Не схоже, щоб криза закінчувалася, навіть у Бірмі народ говорить про відокремлення..."
 mtg_britain.77.b:0 "Ми ніколи не визнаємо їх незалежність!"
 mtg_britain.8.a:0 "Прикрий удар проти короля."
 mtg_britain.9.t:0 "Прем'єр-міністр обмежує короля"
 mtg_britain.90.a:0 "Вони думають тільки про себе!"
 mtg_germany.1.b:0 "Отже, ми біймося з ними."
 mtg_netherlands.16.t:0 "[From.GetNameDefCap] підтримує пропозицію створити Об'єднані Нідерланди"
 mtg_netherlands.20.t:0 "[From.GetNameDefCap] запрошує нас до Європейського Союзу"
 mtg_netherlands.64.b:0 "Зараз у нас немає на це коштів."
 mtg_netherlands.65.t:0 "Проєкт «Зьойдерзее» стимулює розвиток індустрії"
 mtg_netherlands.66.b:0 "Не можна дозволити їм потрапити до [ENG.GetAdjective] сфери впливу!"
 mtg_netherlands.66.t:0 "[ENG.GetName] домінує в [HOL.GetAdjective]их торгових переговорах"
 mtg_netherlands.7.a:0 "Чому б і ні."
 mtg_netherlands.71.t:0 "Солдати переходять у державу [HOL.GetName]"
 mtg_netherlands.73.t:0 "[HOL_kaiserreich_germany.GetLeader] очолює громадянську війну в Німеччині"
 mtg_news.12.a:0 "Народ із такою жагою особистої вигоди гідний захоплення та поневолення!"
 mtg_news.13.desc:0 "[From.GetAdjective] уряд оголосив дванадцяту імперську конференцію. Протягом двох наступних місяців представники [From.GetAdjective] уряду та домініонів будуть збиратися в Лондоні та обговорювати справи, що стосуються всієї імперії.\n\nПоки неясно, як це відіб'ється на міжнародній політиці, але, можливо, у ході дискусій буде порушено питання про федеративну імперію, освіта якої помітно вплине на розклад сил у світі."
 mtg_news.17.a:0 "А ми здатні."
 mtg_news.18.c:0 "Рубіж перейдено."
 mtg_news.45.a:0 "Дрібні вискочки!"
 mtg_news.46.desc:0 "Зі втратою континентальних європейських територій [From.GetAdjective]ий уряд вирішив переміститися в місто Батавія на індонезійському острові Ява. Місцевий колоніальний уряд має бути замінений [From.GetAdjective]им урядом, який буде керувати там\nВони присяглися продовжувати війну проти агресорів на колоніальній базі."
 mtg_news.64.t:0 "Країні Бенілюксу об'єднуються"
 mtg_usa_civil_war_democrats.16.desc:0 "У нещодавній урядовій доповіді йдеться про те, що після кількох десятиліть міграції із сільських районів у промислові центри північного заходу країни ситуація докорінно змінилася. Все більше компаній у цивільному секторі переміщуються в південні штати і обґрунтовуються в нерозвинених регіонах, створюючи сотні нових робочих місць. Багато власників заводів як одну з причин називають «ворожий» клімат на півночі з його страйками та зростаючою агресивністю профспілок."
 mtg_usa_civil_war_fascists.13.a:0 "Це дуже турбує."
 mtg_usa_diplomatic_protest.4.t:0 "[From.GetNameDefCap] відкидає ультиматум"
 mtg_usa_foreign_support.1.desc:0 "Деякі провідні члени Срібного легіону Америки виступили з низкою лекцій у державі [This.GetNameDef], присвячених загрозі їхній державі з боку укорінених на всіх рівнях уряду комуністів. Під загрозою американський спосіб життя, так що яку ми зможемо надати, буде зустрінута з подякою і, можливо, допоможе нам у разі будь-якої сумної необхідності."
 mtg_usa_foreign_support.1.t:0 "Пожертвування для держави [USA.GetNameDef]"
 mtg_usa_protect_south_america.2.a:0 "Істинний лідер."
 nationalism:0 "Націоналізм"
 native_american_usa_democratic_ADJ:0 "Тубільн"
 naval_aviation_pioneer:0 "Першопрохідник морської авіації"
 naval_innovations_focus:0 "Інновації у флоті"
 naval_reform_spirit_desc:0 "Війна завжди міняється."
 naval_ship_recovery_chance_tt:0 " $MODIFIER_NAVAL_SHIP_RECOVERY_CHANCE$: $RIGHT|+=%1$"
 neo_mesopotamia_decision:0 "Відновити колиску цивілізації"
 news.100.t:0 "Падіння Варшави"
 news.124.t:0 "Падіння Маніли"
 news.127.d:0 "Завдавши нищівного удару американської армії, японські війська висадилися в Панамі і захопили контроль над каналом, примусивши до капітуляції гарнізон, що охороняв його. Стверджується, що декільком загонам американських і панамських солдатів вдалося втекти в джунглях, звідки вони ведуть партизанську війну, однак навряд чи це порушить плани Японії.\n\nВтративши канал, американський флот буде змушений йти в обхід Південної Америки, щоби досягти Західного узбережжя США, що дає японському імперському флоту істотну стратегічну перевагу."
 news.13.b:0 "Тепер ми можемо зосередити сили деінде."
 news.132.t:0 "Падіння Рима"
 news.144.d:0 "[GetSOVIdeologyLondonDesc]"
 news.154.c:0 "Пакт зіграв свою роль."
 news.155.b:0 "За славу Німецької нації!"
 news.160.b:0 "Німецький народ переможе."
 news.162.a:0 "Добре для іспанців."
 news.168.j:0 "Німеччині краще бути обережною."
 news.171.t:0 "Другий Люблянський арбітраж"
 news.172.d:0 "Після довгої та напруженої розмови з німецьким послом [GRE.GetLeader] каже, що [GRE.GetAdjective]ий уряд має намір у майбутньому координувати свою політику з державою [GER.GetNameDef].\n\nПоліцейським у [GRE.GetAdjective]ій столиці довелося силою розганяти спалахнувші після цього рішення стихійні мітинги, на яких багато кричали, що «[GRE.GetLeader] відповість за своє боягузтво»."
 news.172.t:0 "Греція погоджується"
 news.182.t:0 "[France.GetName] приєднується до альянсу [From.GetFactionName]!"
 news.187.a:0 "Без сумнівів, [Greece.GetName] розділяє наші інтереси."
 news.190.a:0 "Це важливий крок на шляху до повного середземноморського панування."
 news.195.a:0 "[Soviet.GetName] ушановує свої договори."
 news.197.t:0 "[From.GetName] піддається на [Soviet.GetAdjective]ий ультиматум"
 news.200.b:0 "Чехи завжди були друзями німців."
 news.203.t:0 "Польща передає Данциг"
 news.212.c:0 "Можливо, краще, якщо з цього нічого не вийде"
 news.217.d:0 "\n\nВисунувши ультиматум уряду [TUR.GetAdjective], [GER.GetNameDef] створив собі нового ворога. Замість того, щоб підкоритися вимогам дипломатів [GER.GetAdjective], як очікував [GER.GetLeader], [TUR.GetNameDef] погодився на оборонний союз із державою [ENG.GetNameDef].\n\n[ENG.GetNameDef] та її союзники готуються захищати [TUR.GetNameDef] у випадку, якщо [GER.GetNameDef] виконає свій ультиматум."
 news.217.e:0 "[GER.GetNameDefCap] і [TUR.GetNameDef] грають у небезпечну гру."
 news.223.d:0 "\nЗ огляду на досвід Великої війни, [ENG.GetNameDef] не буде недооцінювати стратегічну цінність регіону Бенілюксу та можливі ризики, пов'язані з посиленням впливу ворожих країн. [ENG.GetAdjective]ий парламент обговорив можливість військового втручання.\n\nХоча політичні наслідки такої дії сильно вплинули на [ENG.GetLeader], було наведено кілька вирішальних аргументів, перш ніж було вирішено, що решту дебатів слід провести в закритих кабінетах.\n\nТаке втручання безповоротно змінило б політичний ландшафт Західної Європи."
 news.228.b:0 "Їм слід лишатись у своїй власній малій «сфері впливу»!"
 news.228.c:0 "Європейську стабільність необхідно зберегти!"
 news.230.e:0 "Спонсоровані американцями перевороти? Таке стається раз за життя!"
 news.239.a:0 "Дуже бентежить."
 news.240.c:0 "[AST.GetNameDefCap] стежить за Тихим океаном."
 news.243.b:0 "[Root.GetNameDefCap] вітає співпрацю з усіма, хто не стоятиме на нашому шляху."
 news.246.c:0 "Зараз вдома не може бути ніякої загрози."
 news.254.b:0 "Як і належить."
 news.261.t:0 "[ENG.GetNameDefCap] реорганізовує африканські колонії"
 news.262.c:0 "Можливо, найбільші загрози знаходяться всередині наших кордонів..."
 news.263.desc:0 "Південною Африкою прокотилася хвиля антимонархічних демонстрацій, багато з яких стали насильницькими. Тисячі протестувальників вийшли на вулиці, штурмуючи поліцейські дільниці та інші урядові будівлі. Портрети короля були зірвані, порізані, спалені, а в одному випадку — розчинені в кислоті.\n\nПоліція і військові, як відзначають спостерігачі, дуже неохоче намагалися стримати повстання, натомість вирішили охороняти заводи і мости. Це поставило питання про те, чи справді заворушення стали несподіванкою для уряду."
 news.282.a:0 "Майбутнє лишається невизначеним."
 news.285.c:0 "Подивимося, чи мир триватиме."
 news.293.t:0 "Австрія голосує проти возз'єднання"
 news.299.t:0 "Угорщина проголошує Велику Угорщину"
 news.30.d:0 "Група офіцерів Вермахту, що виступала проти війни, організувала в Берліні замах на життя Гітлера. Озброєні люди увірвалися до Райхсканцелярії, але не змогли впоратися з охоронцями фюрера з SS. Гестапо заарештувало всіх змовників, включно з такими високопоставленими офіцерами, як Людвіг Бек і Вільгельм Канаріс. У своїй промові перед Райхстагом Гітлер поклявся помститися Великій Британії та Франції за організацію «бездарного замаху» на своє життя."
 news.307.a:0 "Ще одна дипломатична перемога!"
 news.31.d:0 "Група офіцерів Вермахту, що виступала проти війни, організувала в Берліні замах на Гітлера. Озброєні люди увірвалися до Райхсканцелярії та ліквідували фюрера після відчайдушної перестрілки з його охоронцями з SS. Змовникам вдалося зайняти майже весь Берлін, на їхній бік перейшло багато частин Вермахту. Сили, які й досі вірні нацистам, висунули нового лідера та поклялися очистити Німеччину від «комуністичних виродків та іноземних агентів, які тимчасово захопили Берлін»."
 news.329.c:0 "Радянський вплив поширюється..."
 news.37.c:0 "Цей бунтівник отримав те, що заслужив."
 news.37.t:0 "Убивство Льва Троцького"
 news.39.a:0 "Цікаво."
 news.63.b:0 "До перемоги!"
 night_bombing_desc:0 "Вночі ворожа оборона слабша, а наші бомбардувальники вкриті темнотою. Тепер ми можемо цілодобово атакувати ворога. Покажемо йому, які ми вперті.\n\n"
 night_fighting_spirit_desc:0 "Звикання до бою в темряві дає явні переваги."
 north_africa_needed_tooltip:0 "Контролює всі §Yмарокканські§!, §Yтуніські§!, §Yалжирські§! та §Yлівійські§! області"
 northern_expansion_focus_desc:0 "Доктрина експансії північ, якої дотримується імперська армія, розглядає Радянський Союз перед як основну загрозу японських амбіцій. З урахуванням зростаючої напруги в Європі вдалий момент для нападу на радянський Далекий Схід рано чи пізно настане. Ми маємо бути готові діяти."
 nsb_coup.3.a:0 "Ми роздавимо бунтівників!"
 nsb_news.1.d:0 "Дивіться, як Польща сама розділить себе на частини."
 nsb_news.2.a:0 "Це образливо!"
 nsb_news.9.d:0 "[SOS.GetLeader] безперечно переможе."
 nuclear_scientist:0 "Вчений-ядерник"
 nuke_dropped.3.t:0 "Атомне бомбардування Нагасакі"
 nuke_dropped.5.b:0 "God save the King!"
 nuke_dropped.9.b:0 "Рим не відбудують за один день..."
 o_konstantin:0 "Операція «Константін»"
 object_to_attaches_desc:0 "Наші противники підтримують іноземну підтримку! Ми повинні виступити з рішучим запереченням і вимогти усунення будь-яких аташе."
 officers_purged_4:0 "$officers_purged$"
 officers_purged_4_desc:0 "$officers_purged_desc$"
 officers_purged_9:0 "$officers_purged$"
 operation_herkules_desc:0 "Приналежний Британії острів занадто довго був для нас скалкою в боці. Він заважає нам проводити операції в Північній Африці, і поки Мальта під контролем Союзників, Центральне Середземномор'я не належить нам повністю. Ми мусимо захопити Мальту."
 operation_steal_tech_airforce_desc:0 "§LМи отримали кілька дуже тривожних доповідей, з яких випливає, що противник випереджає нас у кількох областях авіабудування. У такому разі нам треба постаратися дізнатися, наскільки великий розрив, і використати отриману інформацію, щоб його ліквідувати.§!"
 operational_destruction_desc:0 "Атаки на ворожі шляхи постачання заважають противнику переміщати сили між полями битв. Це надає нам наземну армію перевагою в районах, де ми досягли переваги в повітрі."
