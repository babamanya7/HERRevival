 IAS_neutrality_DEF:0 "Істмо-америндська держава"
 ICE_communist_tech_sharing_group_name:0 "Міжнародна дослідницька спільнота Рейк'явіка"
 ICE_enact_conscription_desc:0 "Оскільки майбутнє нашої країни стає дедалі більш невизначеним, оборона стає першочерговим пріоритетом. Щоб виправити той факт, що наші збройні сили практично не існують, ми повинні запровадити обов'язкову військову повинність для всіх наших молодих людей."
 ICE_eysteinn_jonsson:0 "Ейстейн Йонссон"
 ICE_general_strike_desc:0 "Покажімо світові загалом, і нашому мерзенному данському королю зокрема, що робітники Ісландії сильні та згуртовані. Великий страйк, який зупинить всю промислову роботу, а також всі судноплавні перевезення на острів і з нього, повинен дійсно зашкодити маріонетковому уряду і показати людям, кому насправді належить влада."
 ICE_infiltration:0 "Проникнення"
 ICE_not_standing_idly_by:0 "Не сидіти склавши руки"
 ICE_off_shore_oil_drilling_desc:0 "Нафта дедалі більше стає критично важливим ресурсом. Сучасні військово-морські сили споживають її у величезних кількостях. Є підстави вважати, що на морському дні навколо острова може бути нафта. Це варіант з високим ризиком і високою винагородою, але варто дослідити, чи існує ця нафта і чи можна її видобути на поверхню."
 ICE_organize_a_march:0 "Організувати марш"
 ICE_the_navy_king:0 "Король флоту"
 ICE_viking_spirit_desc:0 "Безстрашні та смертоносні — ось слова, які асоціюються з давніми вікінгами. Вони перетинали океани, не знаючи, що лежить за ними, і лише сильні досягали успіху. Безстрашними і сміливими мусять бути ісландці сьогодні, бо тільки завдяки сміливості та відвазі країна повернути те, що було колись, і знову запанує над Північним морем."
