 RAJ_GOE_try_to_arrest_bose_tt:0 "\n\n[ENG.GetAdjective] намагатимуться заарештувати §YСубгаса Чандру Боса§!. Він може уникнути полону, завершивши §Y$RAJ_go_into_hiding$§!.\nУ разі арешту він розпочне війну за незалежність ув’язненим і може бути звільнений шляхом захоплення столиці протилежної сторони.\n\n"
 RAJ_all_india_students_federation:0 "Всеіндійська студентська федерація"
 RAJ_an_economy_unbound_desc:0 "Більше не будучи стримуваною нашими сюзеренами, наша економіка нарешті може процвітати, звільнена від своїх попередніх зобов'язань."
