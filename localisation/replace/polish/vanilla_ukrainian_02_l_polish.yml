 USA_light_tank_artillery_equipment_1_short:0 "T30 HMC"
 USA_limited_intervention_desc:0 "Для нашого повномасштабного вступу у війну потрібні були б надзвичайні обставини, однак у світлі останніх подій багато хто готовий добровільно брати участь у конфліктах за кордоном."
 USA_mechanized_equipment_2:0 "M3 Half-Track"
 USA_pacific_pacification_desc:0 "Австралія та Нова Зеландія знаходяться надто далеко від Великої Британії, і та не може захищати їх на повну силу. Ми не потерпимо, щоб їх захопила країна, для якої держава [USA.GetNameDef] є ворогом."
