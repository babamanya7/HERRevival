 ENG_heavy_tank_destroyer_equipment_2:0 "Churchill Gun Carrier"
 ENG_homeland_defense_decision_cat_desc:0 "[ROOT.GetAdjectiveCap]а строгість допомогла нам виграти багато воєн, і якщо ми хочемо більше ніколи не програвати, ми мусимо переконатися, що готові віддати все, що в нас є, для захисту Батьківщини. Ми ніколи не здамося!"
