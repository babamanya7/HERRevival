 DESIGNER_MAIN_COLUMN_TITLE:0 "Фронтові батальйони — це ваші передові війська.\n\nКожна колона — це полк певного базового типу, як-от §Yбронетехніка§!, §Yпіхота§! або §Yмоторизовані війська§!. Найвищий тип вирішує, що ще ви можете додати в цей стовпець батальйонів. Чим більше у вас лінійних батальйонів, тим більша ваша §Yширина фронту§! і чим менше цих дивізій ви зможете вписатися в той же бій."
