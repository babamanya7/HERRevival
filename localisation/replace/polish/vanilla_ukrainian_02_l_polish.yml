 AFG_armored_car_equipment_2:0 "ACV-IP II"
 AFG_axis_airforce:0 "Повітряні сили Осі"
 AFG_communist_international_brigades:0 "Інтернаціональні бригади"
 AFG_da_afghanistan_bank_idea:0 "Банк Афганістану"
 AFG_economic_regionalism:0 "Економічний регіоналізм"
 AFG_expand_royal_guard:0 "Розширити Королівську гвардію"
 AFG_expand_telegraph_network:0 "Розширити телеграфну мережу"
 AFG_extend_a_hand_to_tokyo:0 "Простягнути руку Токіо"
 AFG_generic_democratic_reformer:0 "Абдул Хоссейн Азіз"
 AFG_hot_war_with_pakistan:0 "Гаряча війна з Пакистаном"
 AFG_increase_air_purchases_desc:0 "Наші повітряні сили швидко розвивають потенціал для стримування або знищення іноземних літаків, що входять у наш повітряний простір. Однак нам бракує можливості проектувати силу на землю за допомогою наших літаків. Тому ми повинні розпочати інвестування у власні бомбардувальні ескадрильї."
 AFG_industrial_events.10.t:0 "[FROM.GetNameDefCap] пропонує нафтові концесії"
 AFG_industrial_events.12.a:0 "Ми знайдемо іншого партнера для проєкту."
 AFG_industrial_events.13.t:0 "[FROM.GetNameDefCap] націоналізує нафтову промисловість"
 AFG_industrial_events.30.b:0 "Ми не можемо ризикувати дипломатичною кризою зараз."
 AFG_industrial_events.57.desc:0 "[FROM.GetAdjective] уряд нарешті побачив розум і вирішив деескалувати ситуацію вздовж кордону, та відкликав претензії на неспокійну прикордонну територію, де нещодавно загострилася напруженість."
 AFG_infrastructure_investment:0 "Інвестиції в інфраструктуру"
 AFG_into_the_plains_of_india:0 "У рівнини [RAJ.GetNameDef]"
 AFG_invite_to_faction_in_progress:0 "У процесі запрошення до фракції"
 AFG_khuddamul_furqan_party:0 "Khuddamul Furqan"
 AFG_lord_of_baghdad:0 "Відбудовник Багдада"
 AFG_low_legitimacy_debuff:0 "Низька легітимність"
 AFG_mohammad_zahir_shah_ns_negative:0 "$AFG_mohammad_zahir_shah_ns$"
 AFG_motorized_equipment_0:0 "ZIS-5"
 AFG_neutrality_ADJ:0 "Афганськ"
 AFG_political_events.154.desc:0 "Уряд [FROM.GetAdjective] відповів на наш запит і з жалем відмовляється надавати підтримку сходженню $AFG_faqir_of_ipi$ на трон. Посилаючись на занепокоєння щодо потенційних ускладнень та поточного геополітичного клімату, [FROM.GetAdjective] вирішив зосередитися на інших стратегічних пріоритетах."
 AFG_political_events.156.t:0 "[JAP.GetAdjective] підтримка надходить"
 AFG_political_events.159.a:0 "Як вони сміють зрадити нас!"
 AFG_political_events.170.t:0 "Коронація Могольського князя"
 AFG_political_events.22.desc:0 "[FROM.GetAdjective] дипломати оголосили, що їхній уряд відмовляється інвестувати в [ROOT.GetNonIdeologyName] у найближчому майбутньому. Вони посилаються на занепокоєння щодо наших довгострокових мотивів та небажання пропонувати економічну допомогу нації, яка може зрештою потрапити у сферу впливу їхніх ворогів."
 AFG_political_events.42.t:0 "[FROM.GetNameDefCap] відхиляє вимоги"
 AFG_political_events_53_tt:0 "§Y[GER.GetNonIdeologyName] забезпечить нас зброєю та надішле добровольців для допомоги нам, коли почнеться громадянська війна.§!"
 AFG_protector_of_baghdad:0 "Захисник Багдада"
 AFG_qargha_dam_desc:0 "Більш посушливі регіони нації не мають належного зрошення, що, у свою чергу, ставить під загрозу врожаї та може спричинити голод. Однак ми можемо створити дамби для збільшення доступної води для зрошення, що може навіть призвести до надлишку сільськогосподарської продукції."
 AFG_recruit_experts_and_officers_desc:0 "Вчені, інженери та військові офіцери, які колись служили [PER.GetAdjective] або [TUR.GetAdjective] державам, тепер починають бачити перевагу нашої нації. Таким чином, ми можемо переконати їх служити нам, поки ми прагнемо утвердити себе як регіональну велику державу."
 AFG_recruited_turkestan_legion_here:0 "Туркестанський легіон уже набрано тут."
 AFG_reformist_aristocrat:0 "Аристократ-реформіст"
 AFG_request_german_support_desc:0 "$AFG_amunullah_khan$ довгий час захоплювався [GER.GetNonIdeologyName] та заручився підтримкою низки високопоставлених прихильників у його уряді. Можливо, вони підтримають повернення короля в обмін на дружній режим у регіоні."
 AFG_secure_dynasty:0 "Захистити династію"
 AFG_shipyards_tt:0 "Додати §G1§! слот для будівництва та §G1§! §YВійськово-морську верф§! у прибережній області."
 AFG_soraya_tarzi:0 "Сорая Тарзі"
 AFG_support_soviets_in_asia:0 "Підтримати Ради в Азії"
 AFG_the_amu_darya_plan:0 "План Амудар'ї"
 AFG_the_amu_darya_plan_desc:0 "Імператор розробив плани та налагодив контакти з тими, хто в його старій батьківщині бажає уникнути [SOV.GetAdjective] правління. Спочатку наша кампанія визволення має бути ретельно спланована, і лише після цього ми зможемо атакувати [SOV.GetNameDef]."
 AFG_the_golden_emir:0 "Золотий емір"
 AFG_turkestan_legion_cat:0 "Туркестанський легіон"
 AFG_ulugh_beg_academy_desc:0 "Улугбек колись правив могутньою імперією Тимуридів як Султан, але також знаходив час для розширення наших знань з астрономії та математики. Ми повинні вшанувати його спадщину, створивши новий університет на його ім'я."
 AFG_wazir_caliphate_fascism_DEF:0 "Емірат Афганістан"
 AFG_wazir_caliphate_neutrality_ADJ:0 "Афганськ"
 AIRWING_ATTACHED_MANUAL_ORDER_DESC:0 "Ви збираєтеся відкріпити це авіакрило від армії. Це скасує його поточні накази. Ви впевнені?"
 AIRWING_MISSION_TYPE_AIR_SUPPLY_DESC:0 "Поліпшити постачання в регіоні. На кількість доставлених припасів впливають ефективність завдання, перехоплення та ворожа ППО."
