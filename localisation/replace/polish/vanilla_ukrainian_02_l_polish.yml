 NORDIC_becomes_airforce_member_tooltip:0 "§Y$NORDIC_airforces_originator_dmod$§! буде замінено на §Y$NORDIC_airforces_member_dmod$§!, а §Rперестане керувати [NORDIC_get_adjective]ого розвитку авіації§§!."
