 ITA_african_conquests_tt:0 "Із нашою спраглою до влади імперією §Yанексовувати§! території на §YАфриканському континенті§! буде §Yдешевше§!."
 ITA_aid_for_the_spanish_republic_tt:0 "Надіслати §Y2500§! од. §Yпіхотного спорядження§! державі [GetSpanishRepublicFlagAndNameDef]. Першим буде надіслане старе."
 ITA_angelo_iachino:0 "Анджело Якіно"
 ITA_anglo_italian_tech_sharing_desc:0 "Програма спільних військових розробок Італії та Великої Британії."
 ITA_anti_partisan_measures_desc:0 "Останнім часом ворожі партизани надзвичайно активізувалися, переслідуючи наші резерви та загрожуючи нашим лініям постачання. Ми мусимо розгорнути нові підрозділи, що спеціалізуються на війні з партизанами, та тримати ці кляті банди на відстані."
 ITA_anti_tank_equipment_3:0 "Cannone da 75/32 mod. 37"
 ITA_artillery_equipment_3:0 "Obice da 210/22 modello 35"
 ITA_banda_carita:0 "Banda Carità"
 ITA_banda_koch_desc:0 "Сучасна війна часто є справою цілих народів, що воюють. Це означає, що лінія фронту більше не є єдиним місцем, де відбуваються бойові дії. Ми також мусимо бути готові захистити наші лінії комунікацій, використовуючи бойові війська."
 ITA_believe_obey_fight_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+10%§!\n\n"
 ITA_bend_the_bars_desc:0 "Італія опинилася у в'язниці, створеній британцями після Великої війни, і що більш густонаселеною та могутньою стане Італія, то більше вона буде страждати від свого ув'язнення. Настав час зігнути ґрати цієї в'язниці та розширити італійський контроль."
 ITA_bop_convoke_ecumenical_council:0 "£BoP_left_texticon Скликати екуменічну раду"
 ITA_cacciatorpediniere_di_scorta:0 "Cacciatorpediniere di Scorta"
 ITA_carrier_1:0 "Клас «Giuseppe Miraglia»"
 ITA_democratic_king:0 "Демократичний король"
 ITA_develop_eritrea_desc:0 "Ерітрея — наша найстаріша колонія на африканському континенті, і одна з найцінніших. Із її відмінною стратегічною позицією, її легко можна розбудувати в наріжний камінь нашої колоніальної імперії."
 ITA_economic_reforms:0 "Економічні реформи"
 ITA_expand_foggia_farm_fields_desc:0 "Регіон Фоджі здавна був житницею, що годує всю Італію. Коли почнеться війна, нам доведеться призвати до армії багатьох чоловіків, які працюють у полях. Ми мусимо модернізувати та розширити сільське господарство в регіоні, якщо хочемо, щоби наше населення було ситим."
 ITA_expand_the_royal_guard:0 "Розширити королівську гвардію"
 ITA_extraction_industry_desc:0 "Ми мусимо розширювати видобувну промисловість, щоби задовольнити попит на наші виробничі лінії. Ми не можемо допустити, щоби нестача сировини поставила під загрозу наше військове виробництво."
 ITA_extraction_industry_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-15.00%§!\n\n"
 ITA_fight_alongside_country_comrades_balkan:0 "$SOV_fight_alongside_country_comrades_balkan$"
 ITA_fuel_reserves_desc:0 "Наявність великого запасу палива звільнить наших військових для того, щоб робити більше екскурсій та бути більш активними."
 ITA_guiseppe_fioravanzo:0 "$ITA_giuseppe_fioravanzo$"
