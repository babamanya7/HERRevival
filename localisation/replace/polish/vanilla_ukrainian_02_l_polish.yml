 CKK_JAP_neutrality_subject_DEF:0 "Чукотський протекторат"
 CKK_neutrality_party:0 "ЧНП"
 CLEAR_ALL_OVERRIDE_GARRISON_DESC:0 "Ви справді хочете прибрати всі перелічені заміни шаблону гарнізонів та змінити шаблон на стандартний?"
 CLEAR_ALL_OVERRIDE_LAWS_DESC:0 "Ви справді хочете прибрати всі перелічені заміни закону та змінити закон на стандартний?"
 COG_acquire_american_investments:0 "Залучити американські інвестиції"
 COG_acquire_american_investments_desc:0 "Американці зацікавлені в тому, щоб використовувати нашу величезну націю як хаб для транспортування постачання та зброї, оскільки ми стратегічно розташовані в центрі Африки і також знаходимося неподалік від американського континенту. Ми повинні скористатися цією перевагою та спробувати залучити американських інвесторів."
 COG_alexandre_safiannikoff:0 "Олександр Сафіанніков"
 COG_appoint_a_royal_council:0 "Призначити королівську раду"
 COG_charles_tombeur:0 "Шарль Томбьор де Табора"
 COG_copper_cartridges_idea:0 "Мідна картеч"
 COG_democratic_party:0 "АБАКО"
 COG_desgregate_the_universites_desc:0 "У нашій країні є багато талановитих людей, яких затискають та принижують політики університетів, що не дозволяють певним категоріям людей досягати вищих рівнів освіти. Ми повинні покласти цьому край, адже є багато людей, які хочуть допомогти нашій країні, але не можуть."
 COG_emigration_to_katanga_idea:0 "Еміграція до Катанги"
 COG_invest_in_geomines_desc:0 "Компанія Géomines (Компанія геологічного та гірничого інжинірингу Бельгії) відіграла велику роль у видобутку та експлуатації величезних родовищ металевої руди на південному сході нашої країни і є одним із найбільших виробників олова в світі. Вони безумовно можуть допомогти нашій економіці в довгостроковій перспективі, якщо ми зараз інвестуємо в них."
 COG_kasai_separatism_modifier:0 "Сепаратизм у регіоні Касай"
 COG_kingdom_of_burundi_neutrality_ADJ:0 "Бурундійськ"
 COG_mittelafrikan_kingdom_neutrality_ADJ:0 "Середньоафриканськ"
 COG_paul_ermens:0 "Пол-Шарль Ерменс"
 COG_peacekeeping_forces_idea:0 "Миротворчі сили"
 COG_progressive_congolese_students_desc:0 "Оскільки багато хто в нашій країні починає вірити в соціалістичну риторику, буде доцільно створити молодіжні організації, де ці ідеї можуть поширюватися і розвиватися далі. Молодь — це наше майбутнє, і тому вони повинні отримати навчання, яке допоможе їм вести нас, коли настане їхній час."
 COG_recall_fredrik_olsen_to_active_service_tt:0 "§YФредрік-Вальдемар Ольсен§! стане Генералом"
 COG_standardize_military_production_desc:0 "З нашим поточним міксом іноземного та вітчизняного обладнання наші промислові потужності не здатні виробляти необхідні заміни досить швидко. Тому ми повинні стандартизувати техніку, яку використовують наші збройні сили."
 COG_the_empain_group_decisions:0 "«Група Empain»"
 COG_the_intore_lion_dancers:0 "Танцюристи львів Інторе"
 COG_the_invisible_roof_desc:0 "Хоча не існує законів, які офіційно закріплюють це, більшість, якщо не всі, установи та корпорації в [ROOT.GetNameDef] блокують підвищення корінних жителів Конго на вищі посади і не дозволяють їм навчатися в вищих навчальних закладах."
 COG_to_be_annexed_angola_flag:0 "Лоялісти Королівства Конго"
