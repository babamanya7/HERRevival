 LIT_claim_lithuania_minor_desc:0 "Регіон, який німці помилково називають Кьонігсбергом, — насправді споконвічна литовська земля. Мала Литва ще з часів Балтійських хрестових походів існувала під окупацією німців. Час повернути її собі."
 LIT_events.701.d:0 "На жаль, схоже, що лідери альянсу [From.GetFactionName] вважають вступ до нього [POL.GetAdjective] держави активною перешкодою інтересам союзу. Очевидно, [From.GetNameDef] має інші плани на державу [POL.GetNameDef]."
 LIT_events.8.t:0 "[From.GetNameDefCap] закликає до об'єднання"
 LIT_expand_military_budget_desc:0 "Серед військових часті скарги на низьку щодо цивільних урядовців платню. Тепер, коли кабінет прем'єр-міністра займає Раштікіс, настав час видати армії потрібний їй бюджет."
