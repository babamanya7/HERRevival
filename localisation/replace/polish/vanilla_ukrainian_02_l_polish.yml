 INTERNATIONAL_MARKET_SELL_EQUIPMENT_TOOLTIP:0 "§YПродати оснащення§!\n\nВи можете продати $NUM|Y$ видів оснащення.\n\n§GКлацніть§!, щоб оглянути оснащення, яке Ви виставили на продаж на ринок.\n§GКлацніть§! знову, щоби повернутися до огляду контрактів."
