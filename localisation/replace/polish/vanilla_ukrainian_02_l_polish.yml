 political.13.t:0 "Просування до демократії"
 political.23.d:0 "Після того, як їхня спроба провести громадський референдум із метою встановлення демократії була відхилена, люди, що стояли за цією пропозицією, відкинули режим [Root.GetLeader] як невиправний. Широка коаліція повстанських груп, об'єднаних спільною метою встановлення більш представницької політичної системи в державі [Root.GetName], взялася за зброю і оголосила, що не заспокоїться, поки не буде повалена [Root.GetRulingParty]."
 political.27.d_fascism:0 "Після нещодавнього приходу до влади [Root.GetRulingParty], [Root.GetLeader] оголосив, що [Root.GetName] більше не буде дотримуватися нейтральної зовнішньої політики.\n«Світ став заплутаним і складним. Ми більше не в безпеці самі по собі. Ми мусимо стати разом із нашими фашистськими партнерами супротив наших ворогів. Якщо ми не станемо на чийсь бік, то загинемо на самоті»."
 political.9.d:0 "Дехто скаже, що бачив, як це станеться. І ті, хто попереджав про небезпеку фашизму, і ті, хто звеличував його як рятівника держави [Root.GetName], сьогодні виявили, що їхні пророцтва здійснилися, оскільки військові в місті [Root.Capital.GetName] скинули уряд на чолі з [Root.GetRulingParty] і захопили владу. [Root.GetLeader] зник безвісти — за чутками, він подався у вигнання, — і переворот не зустрів особливого опору на початковому етапі.\n\nНове [Root.GetAdjective]е керівництво також не має наміру допускати зростання опору. Було оголошено воєнний стан, і з урахуванням поточних змін, те, що буде після цього, навряд чи буде сильно відрізнятися від попереднього."
