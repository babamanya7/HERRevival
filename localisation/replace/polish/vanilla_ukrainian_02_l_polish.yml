 STAT_NAVY_TORPEDO_DAMAGE_REDUCTION_VALUE:0 "$VALUE|H1$"
 SUBDOCTRINE_BROAD_NAVAL_SUPPORT_DESC:0 "Завдяки розвідці, перевазі в повітрі та ударній спроможності в одному пакеті, авіаносці є безцінним багатоцільовим інструментом в руках командира оперативної групи."
 SUBDOCTRINE_CARRIER_STRIKES:0 "Повітряна міць «Море-берег»"
 SUBDOCTRINE_CARRIER_STRIKES_DESC:0 "Майже вся світова промисловість та військовий потенціал знаходяться в радіусі авіаудару від берегової лінії. Наші авіаносці можуть розмістити повітряну міць на ворожому задньому дворі."
 SUBDOCTRINE_FIRE_CONCENTRATION_DESC:0 "Шляхом централізації контролю над засобами вогневої підтримки наша армія може концентрувати вогневу міць у критичній точці, а не розтрачувати її невеликими пакетами."
 SUBDOCTRINE_IRREGULARS_DESC:0 "Асиметричний підхід до піхотної війни, в якому уникається прямий бій з переважаючими силами, використовуючи партизанську тактику засідки, дезінформації та виснаження, щоб підірвати рішучість ворога."
 SUBDOCTRINE_SCREEN_PATROL_BOATS_DESC:0 "Дешеві швидкохідні ударні катери, озброєні торпедами, є потужним інструментом проти традиційного бойового флоту важких кораблів, особливо в прибережних водах, де вони можуть атакувати із засідки."
