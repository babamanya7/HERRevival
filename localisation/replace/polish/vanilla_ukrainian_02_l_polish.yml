 upgrade_army_department:0 "Відділ армійської розвідки"
 upgrade_invisible_ink_desc:0 "§LЗ вигляду лист, написаний невидимим чорнилом, — це звичайний чистий аркуш паперу, але ультрафіолетове випромінювання або хімікати, наприклад нашатирний спирт, виявляють його вміст. Якщо прийняти за стандарт використання всіма нашими агентами невидимого чорнила, наша інформація при перехопленні її противником.§!"
 upgrade_passive_defense_desc:0 "§LМісцева самооборона може стати важливою частиною нашої розвідки. Навчаючи шпигунство та контррозвідку сили місцевої самооборони та гарнізонні війська, ми забезпечимо собі захист навіть у тому випадку, якщо наші експерти зайняті іншими справами.§!"
 upgrade_suicide_pills:0 "Пігулки для самовбивства"
 usa.12.d:0 "Щоб обірвати рекордну тривалість президентства Рузвелта, республіканці звернулися до поважних воєначальників, сподіваючись знайти підхожого кандидата, який проведе Америку через цю війну. Генерал Даглас МакАртур був популярним кандидатом серед консерваторів, але він також є незамінним активом у поточному конфлікті та неохоче витрачав свій час на президентську кампанію.\n\nТим не менш, він залишається одним із найбільш перспективних кандидатів від консерваторів і можливо, можна переконати провести кампанію, щоб уникнути поміркованого республіканського президента. Чи варто це жертви?"
 usa.8.b:0 "Демократи. Рузвелт готовий зробити все, що необхідно."
