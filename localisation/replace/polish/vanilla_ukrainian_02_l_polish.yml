 raid_trotskys_villa_desc:0 "Троцький замкнувся на своїй віллі і листується з іншими членами партії, плетучи підступи проти Радянської держави. Ми можемо відправити невеликий загін, атакувати будинок змовника і покласти йому кінець."
 raid_type_ENG_reichstag_bombing_desc:0 "Відправивши групу бомбардувальників атакувати головну штаб-квартиру ворога та символічне місце сили Німеччини, ми зможемо підняти бойовий дух наших людей, одночасно завдавши удару бойовому духу ворога."
