 vittoria_mutilata:0 "Vittoria Mutilata"
 vittoria_mutilata_desc:0 "§LПорушивши Лондонський пакт, наші союзники зрадили Італію і завдали їй удару в спину. Ми пролили так багато крові під Ізонцо заради їхньої перемоги, а вони відмовили в тому, що належало нам по праву. Тепер Італія має намір взяти долю у свої руки і сама чинити справедливість.§!"
 vittorio_emanuele:0 "$ITA_vittorio_emanuele_iii$"
 voice_of_restraint:0 "Голос скромності"
 vojvodina_fascism:0 "Сремська імперія"
 vow_in_the_desert:0 "Клятва в пустелі"
 war_escalation_2_tt:0 "§HРівень 2§!\n Жодних ефектів"
 war_escalation_8_tt:0 "§HРівень 8§!\n §YЕфіопія§!: Дезертирство в лавах ворога\n §YІталія§!: Масове дезертирство"
 war_justification.1.d:0 "«Чи належить [From.GetName] [From.GetAdjective]ому народу? Поставмо собі краще питання: майбутнє належить [From.GetAdjective]ому чи [ROOT.GetAdjective]ому народу?»\n\n[ROOT.GetLeader] у своїй сьогоднішній промові припустив, що [ROOT.GetName] знаходиться на шляху до війни. Політична напруженість зростала протягом останнього місяця і, здається, [ROOT.GetAdjective]ий народ починає розуміти, що війна неминуча."
 war_justification.10.d:0 "«З важким серцем ми повинні визнати реальність нашої ситуації: Вторгнення в [From.GetName] може бути нашим єдиним виходом. Це занадто велика стратегічна перевага, щоб спробувати будь-яке інше рішення в нашій нинішній ситуації. Хоча ми віримо, що ані [ROOT.GetAdjective]ий, ані [From.GetAdjective]ий народи не хочуть війни, але історія привела нас до цього, і наші можливості обмежені. Ми можемо лише сподіватися, що завдяки цьому утвердженню нашої військової могутності ми зможемо уникнути подальшого кровопролиття в майбутньому».\n\nХоча існує популярна теорія, що демократії не воюють проти інших демократій, останні події вказують на [ROOT.GetAdjective]е вторгнення в [From.GetName] в майбутньому. Історія може нас ще здивувати."
 war_justification.17.a:0 "Ми маємо згуртуватися навколо цієї справи!"
 war_justification.17.d:0 "«Хто і як визначає кордони нації? Який би спосіб люди не знаходили в минулому, щоб обґрунтувати, де закінчується [ROOT.GetName] і починається [From.GetName], ми живемо в нову епоху. Стратегічну важливість цього кордону неможливо переоцінити, і ми маємо повне право змінити його, щоб забезпечити постійну безпеку нашого народу». \n\nСлухаючи нещодавні промови [ROOT.GetLeader], вторгнення в [From.GetName] здається неминучим. Незгодні голоси заперечують, але громадська підтримка війни зростає."
 war_justification.18.t:0 "[ROOT.GetLeader] ставить під сумнів мотиви [From.GetName]"
 war_justification.20.t:0 "[ROOT.GetLeader] виступає за вторгнення до [From.GetName]"
 war_justification.202.a:0 "Як і очікувалося від фашистських покидьків на кшталт [From.GetLeader]."
 war_justification.213.a:0 "Вони пошкодують, що зробили нас ворогами."
 war_propaganda_bombing:0 "Підтримати бойовий дух"
