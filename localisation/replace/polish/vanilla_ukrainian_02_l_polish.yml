 SHX_light_tank_equipment_2_short:0 "Type 36"
 SHX_medium_tank_aa_equipment_3_short:0 "PGZ 43"
 SHX_medium_tank_destroyer_equipment_1_short:0 "PTZ 39"
 SHX_warlord_support:0 "\n§HПідтримка воєначальників§!:[scope_SHX.GetWarlordSupportFromGXC][scope_SHX.GetWarlordSupportFromYUN][scope_SHX.GetWarlordSupportFromSHX][scope_SHX.GetWarlordSupportFromXSM][scope_SHX.GetWarlordSupportFromSIK]"
 SIA_STATE_1068:0 "Чампасак"
 SIA_a_new_dawn_over_asia_desc:0 "Японська імперія впала, а корумповані сили, що прагнули успадкувати її руїни, були відкинуті. По всій Азії піднімається новий світанок над націями, сповненими рішучості будувати своє майбутнє вільним від імперського панування."
 SIA_achieve_foreign_legitimacy_tt:0 "Отримайте §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! стабільності за кожну велику країну, яка має понад §Y75§! ставлення до нас.\n\nЯкщо вимогам відповідають більше ніж §Y3§! великі країни, ми також отримаємо §Y1x§! §G50%§! Зниження вартості для: §YСухопутна доктрина§! за кожну таку велику країну понад цей ліміт.\n\nЯкщо вимогам відповідають §Y6§! або більше великих країн, ми отримаємо §G+2§! §YЦивільні фабрики§!."
 SIA_chemical_imports_desc:0 "Сучасне сільське господарство та промисловість однаково залежать від сполук, які ми ще не виробляємо в достатній кількості. Імпорт хімікатів забезпечить нас добривами, ліками, барвниками та вибухівкою, поки вітчизняна промисловість не візьметься за це завдання."
