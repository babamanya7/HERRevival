 SWE_the_lion_of_the_north_rises_desc:0 "Занадто довго Швеція сиділа осторонь глобальної боротьби за владу. Через це ми піддалися обурливим вимогам і блокадам з боку великих держав. Ті дні минули, лев Півночі колись воскресне більше і зайняти місце лідера регіону."
