 GER_artillery_bombardment_desc:0 "Піхота — основа нашої армії, і, щоби вона досягла успіху, їй потрібна належна підтримка. Ми мусимо вкласти значні кошти в артилерію, аби наша піхота могла використати абияку перевагу й перемогти всякого ворога, що постане перед нею."
 GER_ascension_of_todt_desc:0 "Як кваліфікований інженер з військовим досвідом Фріц Тодт виявився компетентним радником фюрера. Ми вважаємо, що за умови відносної свободи дій він міг би бути дуже корисним для [ROOT.GetNameDef]."
 GER_austro_hungarian_empire:0 "Австро-Угорщина"
 GER_autobahn_fascism:0 "Reichsautobahn"
 GER_barbarossa_mission:0 "Директива фюрера Nº 21"
 GER_battle_cruiser_2_desc:0 "У 1939 році Крігсмаріне вирішили замінити три з запланованих крейсерів класу «P» крейсерами. Це призвело до появи крейсерів класу «O», озброєних шістьма 38-см (15-дюйм.) гарматами в трьох спарених баштах. Кораблі були спроєктовані з водотоннажністю 35 400 тонн і максимальною швидкістю 35 вузлів. Було видано замовлення на будівництво трьох кораблів цього класу, але жоден з них не був побудований."
 GER_befriend_china:0 "$GER_china_friend$"
 GER_bewegungskrieg_modifier_desc:0 "Сучасна війна із сучасною технікою дозволила [GER.GetNameDef]ам повністю реалізувати доктрину Bewegungskrieg — маневреної війни, заснованої на русі та гнучкості на полі бою. Завдяки стрімкому просуванню [GER.GetAdjective] військ, підтриманому артилерійським бомбардуванням, вони зможуть швидко подавити та розгромити будь-якого ворога."
 GER_black_front_long:0 "Бойова ліга революційних націонал-соціалістів"
 GER_build_the_eastern_bulwark_ns_tt:0 "Після вступу у війну з §Y[SOV.GetNameDef]§! ми отримаємо:"
 GER_case_anton_desc:0 "Наша маріонеткова держава у Франції зжила себе. Ми негайно почнемо інтеграцію в державі [Root.GetName], і, якщо ми будемо діяти досить швидко, ми навіть зможемо заволодіти залишками французького флоту."
 GER_conquer_italy:0 "Завоювати Італію"
 GER_crushed_the_monroe_doctrine_bad:0 "Знищив Доктрину Монро"
 GER_currency_reforms_desc:0 "Першим кроком до відновлення та пожвавлення економіки є проведення радикальної валютної реформи."
 GER_cv_CAS_equipment_3:0 "Junkers Ju 187 C"
 GER_demand_slovenia_YUG:0 "Вимога Словенії"
 GER_der_fuhrer_wehrmacht:0 "$GER_der_fuhrer$"
 GER_develop_heraeus_facilities_desc:0 "Вкладення в нові потужності можуть забезпечити доступ до зростаючого попиту на дорогоцінні метали, яких потребує сучасна армія. Ці спеціалізовані матеріали необхідні для електроніки та високоякісного озброєння."
 GER_eben_emael_partial_success_ns:0 "Частковий успіх у штурмі Ебен-Емаеля"
 GER_ersatz_material:0 "Розробляти ерзац-матеріали"
 GER_establish_greater_flanders_decision:0 "Створити Велику Фландрію"
 GER_establish_western_grand_duchies:0 "[GetWesternDuchiesName]"
 GER_expand_gestapo_desc:0 "Гестапо виявилося найбільш придатним для боротьби з політичною опозицією й іншими порушниками спокою. Розширюючи його, ми зможемо гарантувати, що наше населення буде діяти відповідно до чинних законів та очікувань."
 GER_fedor_von_bock:0 "Федор фон Бок"
 GER_fuhrerprinzip_inner_circle_tt:0 "Активовує механіку Внутрішнього кола."
 GER_fund_the_film_department_desc:0 "Кіно виявилося потужним знаряддям для натхнення та лідерства. Виробляючи та просуваючи патріотичні фільми, ми підштовхнемо нашу націю повністю присвятити себе нашій славній [ROOT.GetAdjective]ій державі!"
 GER_german_hegemony_in_the_middle_east_desc:0 "Близький Схід готовий до завоювання, і багато з держав можуть бути готові стати на наш бік, сподіваючись, що ми будемо протистояти британським чи французьким імперіям. Час встановити нашу гегемонію на Близькому Сході."
 GER_goebbels_reich_minister_of_propaganda_ministry:0 "$GER_goebbels_reich_minister_of_propaganda$"
 GER_grosskampfschiff_construction_desc:0 "$GER_pride_of_the_modern_germany_desc$"
 GER_heavy_tank_artillery_equipment_2:0 "Sturmtiger"
 GER_heed_von_neuraths_concerns_desc:0 "Занепокоєння щодо нашої нинішньої військової тактики та політики висловлювали декотрі високопоставлені військові на чолі з Константіном фон Нойратом. На їхню думку, досить агресивні військові плани фюрера не здійсняться, і що перед обличчям ризику повномасштабної війни, яка може виникнути, якщо ми будемо їх реалізовувати, наша армія ще недостатньо сильна."
