 SWE_hemvarnet_desc:0 "Є тисячі бажаючих добровольців, яких можна оснастити старішою військовою технікою для захисту стратегічних місць у їхніх місцевостях. Це значною мірою допоможе запобігти перенапруженню армії, намагаючись захистити всю націю одночасно."
