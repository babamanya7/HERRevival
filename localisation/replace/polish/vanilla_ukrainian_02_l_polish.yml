 AIR_BASE_RIGHT_CLICK_REASON_SAME_BASE_ROCKET:0 "§R$COUNT|H$ ракет(и) вже розміщені на цій авіабазі.§!"
 AIR_MAPICON_SHOW_ALL_AIR_PORTS:0 "Місцезнаходження аеропортів"
 AIR_SUPERIORITY_TYPE_3:0 "Наразі активні штурмовики"
 AIR_WING_REBASE_TITLE:0 "Перебазування"
 AIR_WING_XP_BONUS_HEADER:0 "§HЦе дає ось ці ефекти:§!"
 AI_MESSAGE_CAT2_MES7:0 "Hey $OTHER$, maybe you wouldn't be doing so badly if you stopped running away and actually tried to fight?"
 ALERT_RIGHTCLICK_REPORT:0 "§GКлацніть ПКМ, щоби прибрати.§! Це також прибере всі непрочитані сповіщення цього типу на мапі."
