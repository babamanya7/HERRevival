 ENG_light_tank_destroyer_equipment_2:0 "Valiant"
 ENG_mechanized_equipment_3_short:0 "Churchill Kangaroo"
 ENG_philip_kerr:0 "Філіп Керр"
 ENG_raising_militia_flag:0 " Ми наразі збираємо підрозділи місцевої самооборони в області"
 ENG_reconciliatory_speech:0 "Примирлива промова"
 ENG_replace_government_in_new_zealand_communism:0 "Установити комуністичний уряд у Новій Зеландії"
 ENG_special_air_service_desc:0 "Офіцер на ім'я Дейвід Стірлінг прийшов до думки, що невеликий підрозділ командос може дошкуляти ворогу в його тилу, завдаючи йому величезної шкоди. Називаючи їх «Повітряною службою», ми отримуємо додаткову перевагу, змушуючи ворога повірити в те, що він також мусить захищатися від десантників. Ця ідея може мати певні переваги."
 ENG_swedish_intervention:0 "Інтервенція в Швецію"
 ENG_tac_bomber_equipment_3_short:0 "Mosquito B"
 ENG_trade_unions_demand_conscription_limitations_desc:0 "Щоб виконати вимоги профспілок, ми тимчасово обмежимо призов до армії."
 ENG_trade_unions_demand_conscription_limitations_tt:0 "Забороняє приймати закони, що збільшують масштаб призову, протягом §Y365 днів§!.\n"
 ENG_trade_unions_demand_construction_safety_legislation_done_flag:0 "§Y«Профспілки вимагають затвердити техніку безпеки у будівництві»§! виконано"
 ENG_trade_unions_demand_minister_appointment_10:0 "$ENG_trade_unions_demand_minister_appointment_1_NOT$"
