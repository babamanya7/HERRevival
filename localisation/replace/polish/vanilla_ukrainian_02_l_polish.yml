 SEA_PHI_political_events.1.desc:0 "Прагнучи зменшити свою залежність від торгівлі з [USA.GetNameDef], [FROM.GetNameDef] звернувся до нас із пропозицією про нову торговельну угоду. Подібно до них, це може дозволити нам також зменшити нашу залежність від невеликої групи торговельних партнерів."
 SEA_PHI_political_events.15.desc:0 "[USA.GetNameDefCap] оголосили про повне торговельне ембарго щодо [PHI.GetNameDef] через «неспроможність [PHI.GetAdjective]ого уряду обмежити комуністичний вплив»."
 SEA_PHI_political_events.2.desc:0 "Наша пропонована торговельна угода з [FROM.GetNameDef] була позитивно сприйнята їхнім урядом. Їхній ентузіазм є чудовим початком нашого пошуку нових торговельних партнерів."
 SEA_PHI_political_events.43.desc:0 "Артеміо Рікарте, повернувшись із вигнання з групою послідовників, озброєних різноманітною японською зброєю, заявив, що знайшов і затримав вбивцю Мануеля Кесона, однак шеф поліції Айзенгауер спростував цю заяву, стверджуючи, що цей чоловік був бідним селянином, якому заплатили, щоб зробити його цапом-відбувайлом. \n\nУ відповідь група рушила до Національних зборів, сповнена рішучості домогтися справедливості, і штурмувала будівлю. На вході пролунали постріли, двоє перехожих були поранені. Вину поклали на охоронців, яких підтримували американці, і Айзенгауер був змушений вивести констебулярію з району, побоюючись ескалації напруги. \n\nНезважаючи на його зусилля, натовп, підбурюваний повстанцями-сакдалістами, яких звозили з навколишніх регіонів, погрожував повністю розтрощити поліцію. У відчаї Айзенгауер надіслав термінове повідомлення [MessageToMac]з проханням про допомогу."
 SEA_PHI_political_events.69.b:0 "Ми не будемо під владою [FROM.capital.GetCapitalVictoryPointName]"
 SEA_PHI_political_events.70.a:0 "Чудові новини!"
 SEA_PRC_faction_events.10.t:0 "[FROM.GetNameDefCap] пропонує альянс"
 SEA_PRC_faction_events.32.desc:0 "[FROM.GetNameDefCap] відхилив наш запит на передачу територій, в які нам вдалося проникнути."
 SEA_PRC_faction_events.72.a:0 "Ми приймемо і пропозицію, і умову"
 SEA_PRC_faction_events.72.t:0 "[FROM.GetNameDefCap] умовно пропонує нам свободу"
 SEA_PRC_faction_events.73.a:0 "Це новий світанок"
 SEA_PRC_faction_events.82.a:0 "Розбите сонце збирає своє світло"
 SEA_PRC_misc_events.13.desc:0 "Ми отримали делегацію від [FROM.GetNameDef], яка вимагає від нас передати територію, котру вони вважають законно своєю, і це може бути правдою... З певної точки зору. [FROM.GetLeader] буде дуже вдячний, якби ми погодилися і віддали китайцям те, що вони просять, і так само засмутиться, якби ми відмовили — настільки, що [FROM.GetLeader.GetSheHe] може розглянути можливість забрати територію силою. Принаймні так стверджує делегація..."
 SEA_PRC_misc_events.19.c:0 "[FROM.GetNameDefCap] передає область [728.GetName]"
 SEA_PRC_political_events.5.b:0 "Ми не можемо ризикувати надмірним розширенням"
 SEA_PRC_political_events.6.desc:0 "Наша делегація до [FROM.GetNameDef] повернулася додому, щоб оголосити, що нас радо прийняли до [FROM.GetFactionName]. Разом із ними прибули [FROM.GetAdjective]і дипломати, щоб обговорити, як може виглядати наша співпраця."
 SEA_PRC_political_events.7.desc:0 "Дипломати, яких ми відправили до [FROM.GetName], повернулися з новиною, що нам не дозволили приєднатися до [FROM.GetFactionName]. Схоже, що [FROM.GetNameDef] зосереджує свої дипломатичні зусилля деінде."
 SEA_PRC_request_aid.11.t:0 "[FROM.GetName] відхиляє угоду про технологічну співпрацю"
 SEA_PRC_zhang_guotao_events.1.desc:0 "$PRC_zhang_guotao$, генерал, який очолює Четверту фронтову армію, керує однією з двох армій, що ще не прибули до наших безпечних базових районів. Вони все ще перебувають у Великому поході, після незгоди з Мао щодо того, який шлях обрати. У жовтні 1935 року $PRC_zhang_guotao$ оголосив себе справжнім лідером [ROOT.GetNameDef] і навіть зайшов так далеко, що сформував власний Центральний комітет, Центральний уряд і Центральну військову комісію. Крім того, він заявив, що $PRC_mao_zedong$, $PRC_zhang_wentian$ і $PRC_zhou_enlai$ повинні бути виключені з партії. \n\nТепер $PRC_zhang_guotao$ надіслав телеграму [ROOT.GetLeader], в якій оголосив, що прямує зі своєю армією до безпечних базових районів. У телеграмі також зазначено, що, відповідно до побажань Лін Юйїна — посланця партії в [SOV.GetNameDef] — Готао призупинив діяльність своїх партійних органів на користь мирного примирення з Мао та іншими. Що б він не говорив, Готао залишається сильним політичним суперником, і його не слід недооцінювати."
 SEA_PRC_zhang_guotao_events.1.t:0 "Розкол у партії"
 SEA_china.1.a:0 "Ми підтримаємо їх"
 SEA_china_democratic.12.desc:0 "[FROM.GetLeader] грубо вирішив відхилити нашу пропозицію анти-[JAP.GetAdjective]ого союзу між нашими країнами, заявивши, що це суперечить їхньому принципу нейтралітету. Ми можемо лише уявити масштаби корупції, що призвели до цього помилкового рішення."
 SEA_china_democratic.18.a:0 "Розбите сонце збирає своє світло"
 SEA_china_democratic.20.t:0 "[FROM.GetNameDefCap] вимагає застосування принципів Міньцюань!"
 SEA_china_democratic.5.t:0 "Громадянська війна в [ROOT.GetNameDef]"
 SEA_china_democratic.6.b:0 "Розправитися з цими нахабними агітаторами!"
 SEA_generic_events.13.a:0 "Нехай авторитетний політик заспокоїть натовп"
 SEA_imperial_influence_events.1.b:0 "Відкинути фракцію Флоту"
 SEA_imperial_influence_events.110.t:0 "Фракція Армії прагне розширити виробництво озброєння"
 SEA_imperial_influence_events.230.t:0 "Фракція Флоту бажає змін у законі про призов"
 SEA_imperial_influence_events.460.t:0 "Фракція Цивільного уряду прагне обмежити вплив Дзайбацу"
 SEA_japan_foreign_policy.10.b:0 "Ми їм це не віддамо!"
 SEA_japan_foreign_policy.103.t:0 "[FROM.GetNameDefCap] вимагає економічної інтеграції"
 SEA_japan_foreign_policy.116.t:0 "[From.GetNameDefCap] надає сюзеренітет над колоніями"
 SEA_japan_foreign_policy.135.t:0 "Проголошення Другої Філіппінської Республіки"
 SEA_japan_foreign_policy.14.t:0 "[FROM.GetNameDefCap] реорганізовує наш уряд"
 SEA_japan_foreign_policy.140.a:0 "Very well, it makes our administrative duties simpler"
 SEA_japan_foreign_policy.18.a:0 "Разом ми будемо сильнішими"
 SEA_japan_foreign_policy.20.a:0 "Це їхня втрата"
 SEA_japan_foreign_policy.30.desc:0 "Нарешті безжальний штурм з боку [JAP.GetNameDef] та їхніх злісних підданих припинився, і їхні війська повертаються на свої позиції. Невідомо, чи запам'ятається в історії те, що сталося сьогодні, але принаймні Нанкінський уряд тепер знає про [JAP.GetAdjective]і амбіції в регіоні."
 SEA_japan_foreign_policy.5.a:0 "Як і належить"
 SEA_japan_foreign_policy.55.a:0 "Пан або пропав, готуйтеся до гіршого!"
 SEA_japan_foreign_policy.57.a:0 "Ми не можемо боротися з ними"
 SEA_japan_foreign_policy.73.t:0 "[SOV.GetNameDefCap] відступає з Сибіру"
 SEA_japan_foreign_policy.82.a:0 "Все заради наших [FROM.GetAdjective]их друзів!"
 SEA_japan_foreign_policy.85.d:0 "Як ми й підозрювали, підписуючи Антирадянський пакт, тепер ми опинилися в стані війни з Радянським Союзом. Настав час для наших співавторів виконати свою обіцянку і приєднатися до нас."
 SEA_japan_popup_events.2.b:0 "Ми повинні зберегти його за будь-яку ціну!"
 SEA_japan_popup_events.30.a:0 "Кодза-ха тут мають рацію"
 SEA_japan_popup_events.31.desc:0 "З тріумфом революції та владою в руках Кодза-ха настав час обрати прем'єра для нової народної республіки. Двома фаворитами партії під час війни були Сандзо Носака та Кюїті Токуда, і з перемогою революції вони обидва показали, що здатні та готові вести нас до комунізму. Хоча ідеологічно вони не завжди збігаються, обидва демонструють великий потенціал, і на кого впаде вибір, залежить виключно від долі. Чи буде це інтернаціоналіст Носака, чи більш досвідчений, але, можливо, менш популярний серед широкого загалу Токуда?"
 SEA_japan_popup_events.42.a:0 "Ми повинні покласти край цьому болоту!"
 SEA_japan_popup_events.43.t:0 "Інцидент Кюдзьо"
 SEA_japan_popup_events.47.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] нещодавно підписав новий документ, що анулює наші права на лісозаготівлю та видобуток корисних копалин у [655.GetName], грубо зневажаючи договори, які ми підписали при передачі регіону назад їм наприкінці Громадянської війни в Росії."
 SEA_japan_popup_events.6.desc:0 "Незважаючи на наші наполегливі спроби переконати нашого великого імператора, він, схоже, відмовляється дослухатися до голосу розуму. Хоча це не ідеально, ми знали, що така можливість існує, і маємо плани на такий випадок. Його брат, Ясухіто, генерал Імперської армії Японії — це кандидат, якого ми маємо на увазі, щоб зайняти його місце. Він стане або Сессьо (регентом) для сина Хірохіто, Акіхіто, або новим імператором, який набагато більше відповідає нашій ідеології."
 SEA_japan_popup_events.9.a:0 "Ми повинні триматися подалі від таких західних концепцій!"
 SEA_japan_tokko_arrest_events.1.desc:0 "Токко виявила загрозу нашій внутрішній стабільності. Здається, існують організації соціалістів і комуністів, які прагнуть підірвати наше суспільство. Було складено список осіб, які підлягають арешту, що складається з багатьох високопоставлених членів комуністичної партії, таких як Кансон Арахата, Сабуро Еда, Рьокіті Мінобе, Іцуро Сакісака, Кодзо Сасакі, Мосабуро Судзукі, Мінору Такано та Хітоші Ямакава."
 SEA_japan_tokko_arrest_events.5.t:0 "Інцидент у Йокогамі"
 SEA_warlords.19.a:0 "$wtt_political_warlord_support.21.a$"
 SEA_warlords.24.t:0 "[From.GetLeader] підкоряється"
 SEA_warlords.3.t:0 "[FROM.GetNameDefCap] погоджується на інтеграцію"
 SEA_warlords.43.b:0 "Гоміньдан зазнав невдачі, ми повинні приєднатися до японців!"
 SEA_warlords.47.desc:0 "Тепер, коли об'єднання стає дедалі ближчим, ми повинні прийняти важке рішення про те, хто має очолити цю нову кліку. Обидва кандидати гідні: [ROOT.GetLeader] має верховне командування військово-повітряними силами, тоді як Лі Цзунжень — майстер сухопутного бою і фігура, що надихає війська. Хто ж візьме гору?"
 SEA_warlords.69.a:0 "Вони виконали своє призначення"
 SEA_warlords.69.b:0 "Вони все ще можуть бути нам корисні"
 SEA_warlords.70.b:0 "We will be an empire once more!"
 SEA_warlords.72.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has decided to fully stand behind our efforts to ensure the Soviets don't seize our province, and with that risking their own relationship with the state."
 SEA_warlords.9.desc:0 "Центральний уряд вирішив не надавати нам жодної допомоги, щоб догодити радянській владі, оскільки вони цінують своє партнерство з цією нацією набагато більше, ніж наше виживання."
