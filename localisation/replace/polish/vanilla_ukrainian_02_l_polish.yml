 USA_GATHERING_STORM_DESC:0 "Сполучені Штати повернулися в ізоляцію після завершення останньої війни та насолодилися періодом економічного процвітання під час 1920-х років. Цей період несподівано скінчився, коли націю скувала Велика депресія.\n\nАмериканська політика невтручання в іноземні війни лишилася непорушеною, але в Європі й Азії зростає напруженість. Чи хочуть Штати цього, чи ні, але «Великий нейтрал» може буде затягнутий у цей вир подій."
