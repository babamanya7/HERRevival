 SPR_secure_the_guardia_civil_desc:0 "Екстремістські елементи продовжують порушувати громадський порядок. На чолі боротьби з цивільними заворушеннями стоїть Цивільна гвардія. Гарантування відданості нашої національної поліції мусить бути пріоритетним, якщо ми хочемо покінчити з насиллям і зберегти контроль."
