 TUR_no_faction_alliance_members_tt:0 "Підписанти Саадабадського пакту не ратифікували Саадабадський конкордат"
 TUR_peace_in_the_world:0 "Мир у світі"
 TUR_press_the_austro_hungarian_claim_desc:0 "Наше тріумфальне повернення з попелу Турецької Республіки є великою подією, але ми з усіх боків оточені ворогами, які хотіли б знову нас знищити. Нам потрібні союзники, і похід у землі поблизу Дунаю під проводом османів навряд чи стане чимось незвичайним."
 TUR_privatize_the_anadolu_agency_tt:0 "Прибирає рішення §YЦензура преси§!."
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect_desc:0 "Ми завжди пишалися тим, що знаходимося на вістря європейських авіаційних інновацій, але при цьому наші пілоти відомі своєю безрозсудною вдачею."
 TUR_rearmament_scheme:0 "Підготована схема переозброєння"
 TUR_recover_the_kardzhali_vilayet_desc:0 "Надто довго нам докучає [BUL.GetAdjective] народ. Нехай він скільки завгодно бреше, ніби це не так, але турки, замкнені в їхній державі-обрубці, волають про звільнення. Хіба ми можемо залишити їх благання без уваги?"
 TUR_reforming_our_armed_forces_category_desc:0 "Війна за незалежність важко далася нашим збройним силам. Вирвати свою свободу в імперіалістів виявилося непросто і обійшлося нам дуже дорого. Раніше ми могли відкладати реформу армії, але тепер світ швидко стає небезпечним."
 TUR_sectarian_woes_1:0 "$TUR_sectarian_woes$"
 TUR_ship_light_medium_battery_2:0 "15.2 cm/50 Cannon"
 TUR_strike_at_the_fascist_menace:0 "Ударити по фашистській загрозі"
 TUR_submarine_1:0 "Клас «Birinci İnönü»"
 TUR_taking_responsibility_for_the_air_war_desc:0 "[SOV.GetAdjective] народ і без того зайнятий контролем над землею і морем — ми мусимо допомогти їм і взяти на себе повітря."
 TUR_the_sun_language_theory_desc:0 "Теорія мови Сонця — теорія, згідно з якою всі людські мови походять від корінного турецького. Очевидно, що ця теорія є повністю логічною і повинна підтримуватися державою, а також викладатися по всій країні."
 TUR_thwarting_traditionalist_infiltration_desc:0 "Ми не можемо дозволити, щоби на захід і далі проникали ті, хто заважає вести націю світським шляхом розвитку. Наш обов'язок — зупинити цих людей."
