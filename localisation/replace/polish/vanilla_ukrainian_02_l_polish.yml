 WW_hungary.101.t:0 "[FROM.GetName] відмовляє в протектораті над Секейфьолд"
 WW_hungary.109.desc:0 "Великий [GER.GetLeader] дозволив Герману Герінгу переїхати до нашої країни й стати новим конституційним королем нашого народу. Наш зв’язок стає ще міцнішим, і трон більше не порожній."
 WW_hungary.120.a:0 "Якщо це воля народу"
 WW_hungary.120.t:0 "Референдум про приєднання до [HUN.GetAdjective] держави"
 WW_hungary.121.a:0 "Розумна відповідь"
 WW_hungary.124.b:0 "Що б він не казав, ми не можемо йому довіряти"
 WW_hungary.22.b:0 "Ми повинні від цього відмовитись"
 WW_hungary.44.a:0 "Вони мають рацію"
 WW_hungary.45.t:0 "[FROM.GetNameDefCap] приймає монарха з династії Відів"
 WW_hungary.49.desc:0 "Дегенеративне керівництво [FROM.GetNameDef] відмовилось скласти повноваження, вважаючи себе розумнішими за монарха, обраного богом. Ми скинемо їх і посадимо Карла Альбрехта на трон — хочуть вони того чи ні!"
 WW_hungary.50.t:0 "[FROM.GetNameDefCap] призначає нам монарха з династії Габсбургів"
 WW_hungary.68.desc:0 "Дегенеративне керівництво [FROM.GetNameDef] вирішило залишитися при владі, вважаючи себе розумнішими за монарха, обраного богом. Ми усунемо їх і посадимо Йосифа Франца на трон!"
 WW_hungary.75.b:0 "Скільки хрестових походів уже зазнали поразки?"
 WW_hungary.79.a:0 "Без сумніву"
 WW_hungary.86.b:0 "Вони пошкодують про своє рішення!"
 WW_hungary.94.desc:0 "Народ потребує обраного представника, тепер коли громадянська війна завершилась. З одного боку — популярний Міхай Каройї, консервативний політик і колишній прем'єр-міністр. З іншого — комуністи: одні підтримують повернення Бели Куна, інші — Сталініста Матяша Ракоші, якого хвалять за участь у боях. Хто ж поведе країну вперед?"
