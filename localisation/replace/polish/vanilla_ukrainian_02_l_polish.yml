 TUR_join_the_axis:0 "Приєднатися до Осі"
 TUR_kemalism_with_socialist_characteristics_desc:0 "Ми не зацікавлені в тому, щоби позбутися кемалізму, ми зробили б ведмежу послугу світу, позбувшись нашої доморощеної та прогресивної ідеології. Кемалізм досить динамічний, щоб його можна було змінити, щоб більше відповідати марксистським цінностям, не руйнуючи його основи."
 TUR_konfederasyon_desc:0 "Ми завжди були близькі з азербайджанським народом і з радістю готові надати азербайджанцям рівні громадянські права у нашому чудовому союзі тюрків."
