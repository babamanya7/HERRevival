 GER_launch_sino_germanic_joint_research_program:0 "Запустити Китайсько-німецьку спільну дослідницьку програму"
 GER_liberate_oppressed_people:0 "Звільнити пригноблені народи"
 GER_lower_taxes:0 "Знизити податки"
 GER_mass_production_desc:0 "Завдяки промисловому прогресу, якого ми досягли останнім часом, ми багато дізналися про засоби виробництва. Нам слід застосувати всі ці нові знання і розуміння, щоб оптимізувати наші конвеєри і виробляти матеріали в небачених раніше масштабах."
 GER_medium_tank_aa_equipment_1_desc:0 "Прозвана Möbelwagen (з нім. — «Меблевий фургон») через коробчату башту в закритому стані, це була імпровізована самохідна зенітна установка, побудована на шасі танка Panzer III і озброєна 3.7-см гарматою."
 GER_medium_tank_artillery_equipment_2_desc:0 "Hummel (з нім. — «джміль») — самохідна артилерійська установка на базі шасі Geschützwagen III/IV, озброєна 15 см гаубицею. Він використовувався німецьким вермахтом під час Другої світової війни з початку 1943 року до кінця війни."
 GER_medium_tank_destroyer_equipment_3_desc:0 "Jagdpanther (з нім. — «пантера-мисливець») — винищувач танків, побудований нацистською Німеччиною під час Другої світової війни на базі шасі танка «Пантера». Він надійшов на озброєння наприкінці війни (1944) і брав участь у східному та західному фронтах. Jagdpanther поєднувала в собі дуже потужну 8,8-см гармату PaK 43 з Tiger II і характерну чудову броню та підвіску шасі Panther, хоча вона страждала від загального поганого стану Німеччини наприкінці війни, що призвело до невеликого виробництва. кількості, нестачі запасних частин і поганої підготовки екіпажу."
