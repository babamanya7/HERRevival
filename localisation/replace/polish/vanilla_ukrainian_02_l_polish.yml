 INDUSTRIAL_ORG_QUEUE_SAVE_BEFORE_LOAD_DESC:0 "§YУ вас є незбережені зміни, які буде втрачено.§!\n\nБажаєте зберегти чи відхилити поточну чергу рис «$SAVED|Y$» перед завантаженням черги рис «$LOAD|Y$»?\n\nЯкщо ви не збережете, §Rзміни до поточної черги рис буде втрачено§!."
 INDUSTRIAL_ORG_TOOLTIP_NO_UPGRADE_ALREADY_ASSIGNED_MIO:0 "Нові риси, застосовні до цього оснащення, не з'явилися. Поліпшення не потрібне."
