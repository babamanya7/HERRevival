 PER_communist_events.20.a:0 "Надати їм автономію."
 PER_embrace_national_front_desc:0 "Політична влада та прийняття рішень більше не можуть бути зосереджені в руках необраного, непідзвітного шаха чи його наступника. Ми повинні покінчити з усім інститутом та перейти до формування [ROOT.GetAdjective] республіки."
 PER_establish_opposition_hq:0 "Встановити штаб опозиції в §Y[FROM.GetName]§!"
