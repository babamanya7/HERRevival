 PRODUCTION_AIRCRAFT_BUTTON:0 "Виробництво літаків"
 PRODUCTION_DRAG_N_DROP:0 "§GПереміщуйте курсором§!, щоби змінити §Yпріоритет§!."
 PRODUCTION_INCREASE_PRIORITY_LABEL:0 "§GКлацніть, щоби §Hзбільшити пріоритет§!.\nShift + клацніть, щоби надати виробничій лінії §Hнайвищий пріоритет§!.§!"
 PRODUCTION_NAVAL_DEPLOYMENT_SCRAPPING_DESC:0 "Немає бази для розгортання. Частина буде утилізована після завершення."
