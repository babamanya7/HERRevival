 SWI_ask_for_vorarlberg_desc:0 "Тепер, коли ми деякий час перебували під крилом [?SWI_fascist_overlord.GetName] і довели свою лояльність, настав час довірити нам те, що належить нам по праву. [848.GetName] проголосували за те, щоби приєднатися до нас, коли [ROOT.GetNonIdeologyName] була демократичною конфедерацією, тому немає сумніву, що вони захочуть приєднатися до нашої нинішньої форми."
