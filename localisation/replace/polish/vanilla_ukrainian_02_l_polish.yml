 INS_medium_tank_equipment_1_short:0 "GVT-3"
 INS_militias_di_mission:0 "Даруль-Іслам вимагає представництва"
 INS_militias_kris_repayment:0 "Ополчення KRIS вимагає інвестицій у Сулавесі"
 INS_mohammad_roem:0 "Мохаммад Рум"
 INS_njono:0 "Нйоно"
 INS_no_compromise_idea:0 "Indonesia Raya"
 INS_political_events.17.a:0 "На жаль, вони можуть мати рацію."
 INS_political_events.17.desc:0 "До Імператорської Генеральної штаб-квартири дійшли звістки з Батавії. Сукарно та його кліка, підняті нашими власними руками для управління островами від імені Імператора, проголосили Республіку [FROM.GetAdjective] у відповідь на наші неодноразові територіальні втрати, вважаючи, що наші сили занадто розпорошені, щоб щось з цим зробити."
 INS_prepare_raiding_bases_desc:0 "Ми використаємо нашу мережу шпигунів, щоб таємно створити бункери по всьому архіпелагу, гарантуючи нашу готовність завдати удару, щойно почнеться революція."
 INS_quinine_export:0 "Більш вигідна угода про хінін"
 INS_reduce_escalation_3_tt:0 "Знижує §YРівень ескалації§! на §G3§!"
 INS_reorganize_freedom_fighter_militia_flag:0 "Прийнято рішення: §Y$INS_reorganize_freedom_fighter_militia_1$§!"
 INS_revolution_events.4.desc:0 "[ENG.GetNameDefCap] відмовилися від будь-якої подальшої допомоги в конфлікті, незважаючи на терміновість і запропоновану винагороду. [ENG.GetLeader] заявив, що хоча в їхніх найкращих інтересах, щоб ми зберегли нашу колоніальну імперію, ризик глобальної ескалації після їхнього втручання занадто високий, і що нам доведеться вирішувати це самостійно."
 INS_revolution_events.6.desc:0 "[ENG.GetNameDefCap] погодилися відправити добровольчі війська та спорядження до [1058.GetName], щоб допомогти нам повернути контроль над Індією."
 INS_revolution_events.8.desc:0 "Наша колоніальна поліція в Ост-Індії заарештувала і допитала кількох членів зростаючого революційного руху в Індонезії. Здається, вони намагаються встановити військову присутність, щоб підготуватися до початку національної кампанії за незалежність. Ми ще не знаємо напевно, але вони можуть готувати збройну революцію."
 INS_set_leader_to_sjarifuddin:0 "Обрати $INS_amir_sjarifuddin_harahap$"
 INS_silence_nationalists:0 "Примусити замовкнути симпатиків націоналістів"
 INS_singapore_compromise_decision:0 "$INSHOL_singapore_compromise$"
 INS_strat_bomber_equipment_3:0 "Boeing B-29 Superfortress"
 INS_tighter_tkr_integration_desc:0 "Армія народної безпеки та різні ополчення не діють у єдності, а координація обмежена. З продовженням війни це лише створюватиме все більше і більше проблем, нам потрібно об'єднати збройні сили та ополчення в єдину організацію, незважаючи на неминучі протести офіцерів ополчення."
 INS_transport_plane_equipment_2:0 "Lockheed Model 18 Lodestar"
 INS_union_events.3.a:0 "Здається, вони забули, чий прапор досі нас об'єднує."
 INS_volksraad_allow_language_in_schools_desc:0 "Доступ до вищої освіти в Ост-Індії значною мірою обмежений нідерландцями та заможними класами індонезійців, які розмовляють нідерландською, оскільки це єдина мова, якою ведеться викладання у вищих навчальних закладах. Поточна пропозиція у Фольксрааді щодо відкриття шкіл з індонезійською мовою навчання чекає на голосування Генерал-губернатора."
 INS_volksraad_education_subsidies_for_indonesians:0 "Відкрити субсидії на освіту для не-нідерландських жителів"
 INS_volksraad_events.10.t:0 "Пропозиція у Фольксрааді дозволити індонезійську мову в школах"
 INS_war_escalation_1_tt:0 "§Y[INS.GetName]§!: Розблоковує сухопутні рейди"
