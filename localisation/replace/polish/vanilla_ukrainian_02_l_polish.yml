 JUNO_brazil_events.11.desc:0 "Незважаючи на сутички з місцевими соціалістичними та ліберальними агітаторами, мітинг інтегралістів у [FROM.FROM.GetName] зумів зібрати значний натовп прихильників. Керівництво партії виступило з численними промовами про майбутнє нації, які були зустрінуті вигуками та скандуваннями натовпу. Місцеве відділення партії вже оголосило, що кількість членів зросла після мітингу."
