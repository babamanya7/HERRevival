 YUG_motorized_logistics_desc:0 "Моторизація відкриває багатообіцяючі нові шляхи забезпечення найнеобхіднішого та спеціалізованого обладнання, яке не відстає від військ на передовій. Це дозволяє нам гарантувати, що наші сили завжди перебувають у найкращому бойовому стані."
 YUG_motorized_recon_companies_desc:0 "Щоб отримати адекватну інформацію про ворожі формування та їхні позиції, нам потрібні спеціальні моторизовані розвідувальні роти, здатні долати значні відстані перед наступом наших основних сил."
