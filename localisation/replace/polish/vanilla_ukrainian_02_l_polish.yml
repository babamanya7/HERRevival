 SWE_sieze_landsverk_desc:0 "Landsverk протягом тривалого часу працював як лазівка для [GER.GetAdjective]их військових, щоб обійти обмеження Версальської угоди щодо розробки бронетехніки. Деякі в уряді стверджують, що нам потрібно захопити компанію, щоб дистанціюватися від [GER.GetAdjective]ої бойової машини."
