 GOE_RAJ_loyalist.06.desc:0 "Зі створенням Командування Південно-Східної Азії ми опинилися на роздоріжжі. У нас обмежена кількість ресурсів, які ми можемо виділити на цю операцію, і ми повинні вирішити, на чому ми повинні зосередитися, щоб підтримати військові зусилля спільно з [ENG.GetNameDef]."
