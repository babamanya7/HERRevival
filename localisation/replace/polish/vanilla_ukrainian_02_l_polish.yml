 INFLUENCE_TOP_TWO:0 "§Y2 члени альянсу§! з найбільшим впливом:"
 INSHOL_autonomous_dominion_desc:0 "Незважаючи на нерозумне визначення 'самодостатності', встановлене Нідерландами, якому ми маємо відповідати, щоб умови петиції Сутарджо були чинними, індонезійське бажання незалежності є настільки сильним, що нам вдалося виконати ці вимоги. Згідно з угодою, ми проголосимо повну та беззастережну незалежність від голландської корони."
 INSHOL_continue_exclusive_rights_desc:0 "Гульден Ост-Індії втратив більшу частину своєї вартості під час великої депресії, а наше економічне зростання зайшло в глухий кут. Ми могли б спробувати стабілізувати гульден, надавши Банку Яви виключні права на друк грошей, які він мав до 1922 року."
 INSHOL_education_reforms_desc:0 "Багато громадян Ост-Індії не мають можливості здобути освіту, і дуже мало хто закінчив середню школу. Якщо ми хочемо, щоб Ост-Індія стала багатою індустріальною державою, ми повинні забезпечити належний доступ населення до освіти."
 INSHOL_increase_esclation_placeholder_tt:0 "Відкриває §YРішення§! вести переговори щодо локального припинення вогню та §Yзбільшує таймер§! для окупації Яви."
 INSHOL_naval_program_transfer_100_2_tt:0 "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! передасть весь свій флот до §Y[INS.GetNameDefCap]§!."
 INSHOL_princely_authority_tt:0 "Князівські лідери будуть доступні як варіанти для §YДемократичних виборів§!."
 INSHOL_recall_gerardus_johannes_berenschot_desc:0 "Герардус Йоганнес Береншот є одним з найталановитіших генералів Співдружності. Більшу частину своєї кар'єри він провів в Ост-Індії, але кілька років перебував у Нідерландах. У ці важкі часи ми повинні відкликати його до Ост-Індії, щоб допомогти у воєнних зусиллях."
 INSHOL_request_ceylon:0 "Запит на передачу Цейлону"
 INSHOL_sumatra_desc:0 "$HOL_sumatra_desc$"
 INS_JAP_DEF:0 "Defenders of Homeland"
 INS_army_factory_decision:0 "Оренда іноземних військових заводів"
 INS_aslia_communism_ADJ:0 "Аслійськ"
 INS_can_raid_here_HOL:0 "Регіон під загрозою рейду"
 INS_centralize_the_state_2_tt:0 "Необхідні регіони, які є §Yненаціональними§!:"
 INS_chaos_events.1.desc:0 "Після проголошення незалежності влада в Сурабаї стала нестабільною. Сьогодні група голландських лоялістів підняла старий колоніальний прапор на будівлі колишнього готелю Yamato. Місцеві юнаки-пемуда штурмували будівлю, зняли прапори і підняли натомість червоно-білий індонезійський прапор. Інцидент переріс у жорстокі, неорганізовані бої."
 INS_cost_text_oil_40:0 "£resources_strip|1 §Y40§!"
 INS_detangle_supply_chains_desc:0 "Наша експортна економіка вимагає, щоб товари проходили через десятки посередників, перш ніж вони нарешті досягнуть кінцевого пункту призначення, і кожен раз вимагається збір, податок або будь-яка інша причина, щоб відібрати трохи собі. Ми повинні попрацювати над тим, щоб розплутати цей безлад і контролювати більшу частину ланцюжка постачання безпосередньо."
 INS_developing_sumatra_desc:0 "Суматра — найбагатший на ресурси острів архіпелагу, проте інфраструктура там настільки слабка, що величезна частка видобутих ресурсів навіть не доходить до Батавії. Транспорт покладається на клаптики ґрунтових доріг і незв'язані залізничні лінії, що абсолютно недостатньо для підтримки наших планів щодо острова. Ми не можемо дозволити цьому продовжуватися."
 INS_dutch_investment_rate_70:0 "§YНідерланди§! з імовірністю на §G70%§! більшою обиратимуть фокуси зі спільного дерева"
 INS_east_indies_exile_government_desc:0 "На жаль, попри всі наші зусилля, Ост-Індія впала. Однак ми не повинні втрачати надію. Ми повинні продовжувати робити все можливе з тими обмеженими ресурсами, які у нас є. Ми програли битву, але ми ще не програли війну."
 INS_economic_stabilization:0 "Економічна стабілізація"
 INS_embrace_co_prosp_sphere:0 "Прийняти Сферу Спільного Процвітання"
 INS_expand_batavia_technical_institute:0 "Розширити Технологічний інститут Батавії"
 INS_fair_election_desc:0 "Після повалення Президента та закінчення революції ми нарешті зможемо провести перші справді чесні вибори без авторитарного впливу."
 INS_flag_legalized:0 "Червоно-білий прапор дозволено демонструвати"
 INS_focus_time_reduce_jap_tt:0 "§Y$INS_first_come_first_serve$§! скоротить час, необхідний для цього фокусу, на 70 днів."
 INS_focus_time_reduce_usa_tt:0 "§Y$INS_realign_supply_chains$§! скоротить час, необхідний для цього фокусу, на 70 днів."
 INS_guided_democracy:0 "Керована демократія"
 INS_has_spent_points_trigger_tt:0 "Неможливо створити додаткові бази ополчення"
 INS_japanese_army_training:0 "Реформа армії"
 INS_japanese_army_training_desc:0 "Ми маємо багато чому навчитися у наших сюзеренів [JAP.GetAdjective], і тепер, коли KNIL розпущено, ми повинні створити нову армію, навчену IJA, готову захищати Індонезію від зовнішніх загроз."
 INS_kartosoewirjo:0 "Картосувірйо"
 INS_limited_war_events.3.t:0 "[FROM.GetName] схиляється перед Республікою"
 INS_loyalist_events.10.desc:0 "Референдум у [FROM.GetName] завершився рішучим голосуванням на користь об'єднання з [FROM.FROM.GetNameDef]. Наші адміністратори в регіоні повідомляють, що результат був очікуваним. Ми зобов'язані його визнати."
 INS_loyalist_events.17.desc:0 "Передача Цейлону завершена. Наша адміністрація почала переміщення чиновників на острів, і передача пройшла без інцидентів. Тепер ми утримуємо позиції по обидва боки протоки."
 INS_loyalist_events.21.desc:0 "Австралійці відмовилися. Їхній губернатор у Порт-Морсбі зробив заяву, назвавши це прохання образою суверенітету Австралії. З самим папуаським народом не консультувалися."
 INS_loyalist_events.30.t:0 "[FROM.GetNameDefCap] голосує проти об'єднання"
 INS_maphilindo_communism:0 "Союз малайських народів"
