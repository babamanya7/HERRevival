 AAT_Sweden.17.t:0 "[FROM.GetNameDefCap] вперто відмовляється віддавати Нарвік"
 AAT_Sweden.41.desc:0 "Держава [FROM.GetName] поступилася і передала нам Оландські острови. Нарешті несправедливість минулого була виправлена, а їхній належний статус відновлено."
 AAT_Sweden.46.desc:0 "Усім зрозуміло, що [FIN.GetName] не може протистояти [SOV.GetAdjective]ій загрозі. Фіни говорять про свій суверенітет, не в змозі усвідомити — те, що вони сприймають як незалежність, не було надано жодною політичною чи військовою силою, а існує як результат хаосу, спричиненого громадянською війною в Росії. З того дня цокає годинник, який незабаром досягне нуля, і старий ворог знову підніме свою потворну голову. Тому вкрай важливо, щоби ми взяли під контроль [FIN.GetAdjective]і справи до того, як це зроблять [SOV.GetAdjective]а диктатура."
 AAT_Sweden.48.t:0 "$AAT_Sweden.47.t$"
 AAT_Sweden.50.a:0 "Воно того не варте."
 AAT_Sweden.50.b:0 "Це абсурд."
 AAT_Sweden_BoP.14.d_left:0 "Настав день виборів, і, незважаючи на всі зусилля партій, жодна з них не отримала більшість місць у Ріксдазі. Однак соціалістам і соціал-демократам вдалося домовитися про створення коаліційного уряду. Невідомо, чи протримається коаліція повний термін, але цілком можливо, що страх перед правими утримає її разом."
 AAT_Sweden_BoP.14.t:0 "Результати виборів"
 AAT_Sweden_flashpoints.18.t:0 "[SOV.GetNameDefCap] вимагає закінчення поставок зброї"
 AAT_Sweden_flashpoints.22.desc:0 "[FIN.GetAdjectiveCap]і дипломати повідомили нам, що, незважаючи на спільного ворога в державі [SOV.GetNameDef], стратегічні цілі їхнього уряду надто відрізняються від наших. Тому вони, на жаль, відхилили нашу пропозицію про союз."
 AAT_Sweden_flashpoints.40.c:0 "Ми не можемо покинути наш нейтралітет."
 AAT_Sweden_flashpoints.50.b:0 "Це неприйнятно в демократичному суспільстві."
 AAT_Sweden_flashpoints.62.t:0 "[FROM.GetName] вводить торговельне ембарго проти держави [GER.GetNameDef]"
 AAT_Sweden_flashpoints.74.t:0 "[SWE.GetName] погоджується на інтернування кораблів"
 AAT_Sweden_nationalists.22.a:0 "Схоже, то була помилка.."
 AAT_finland_continuation_war.12.a:0 "Відмінно. Будемо сподіватися, що [SOV.GetLeader] не проти..."
 AAT_finland_diplomacy.01.t:0 "[FROM.GetAdjective]а пропозиція про об'єднання"
 AAT_finland_diplomacy.08.b:0 "Ми захистимо [ROOT.GetAdjective]ий суверенітет над цими територіями."
 AAT_finland_diplomacy.08.t:0 "[FROM.GetAdjective]ий тиск заради контролю за потоком залізної руди"
 AAT_finland_diplomacy.12.t:0 "[FROM.GetName] погоджується на територіальні поступки"
 AAT_finland_diplomacy.17.a:0 "Зрозуміло"
 AAT_finland_diplomacy.21.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], у своїй величі клянеться робити все, щоб зберегти мир між нашими народами на довгі роки. Ця людина — воістину друг [FIN.GetAdjective]ого народу."
 AAT_finland_diplomacy.22.desc:0 "[FROM.GetLeader] проявляє себе ненадійною людиною і стверджує, що не може гарантувати мир між нашими народами. Очевидно, має місце підготовка до акту агресії проти нашої нації. Потрібно як слід підготуватися."
 AAT_finland_diplomacy.22.t:0 "[FROM.GetLeader] відхиляє нашу пропозицію фінсько-[FROM.GetAdjective]ого пакту"
 AAT_finland_diplomacy.23.t:0 "[FROM.GetNameDefCap] шукає захисту від держави [SOV.GetNameDef]"
 AAT_finland_kinship_war_dynamic_modifier_tt:0 "Поки модифікатор §Y$FIN_anti_soviet_sentiment$§! діє в областях §Y[215.GetName]§!, §Y[216.GetName]§!, §Y[146.GetName]§! або §Y[147.GetName]§!, [FROM.GetNameDef] може спровокувати карельське повстання."
 AAT_finland_misc_events.05.t:0 "[FROM.GetName] дає нам права на ресурси"
 AAT_finland_political.04.a:0 "Спочивай з миром!"
 AAT_finland_political.05.desc:0 "Сьогодні нам надійшов лист про відставку, автор його — [ROOT.GetLeader]. У листі [ROOT.GetLeader.GetSheHe] скаржиться на проблеми зі здоров'ям і зазначає, що йде з посади президента, вважаючи це правильним рішенням. \n\n[GetPoliticsDescriptionKallioWinterWar]"
 AAT_finland_political.09.desc:0 "Ми дуже вдячні за всі ті звершення, за якими стоїть [ROOT.GetLeader] — адже очевидно, що без [ROOT.GetLeader.GetHerHis] лідерства ми не вистояли б у непевний період, і нашу націю було б втрачено... \n\nТепер, однак, настав час залишити війну позаду й дивитися назустріч миру, відновленню країни. Щоб зцілити рани і йти в майбутнє, треба відновити цивільний уряд."
 AAT_finland_the_white_death.8.a:0 "Ми позбулися надокучливої мухи!"
 AAT_finland_winter_war.05.a:0 "Дурні! Вони за це заплатять!"
 AAT_germany.1.t:0 "[FROM.GetNameDefCap] просить права на ресурси"
 AAT_nordic_cooperation.3.a:0 "Ну що ж..."
 AAT_nordic_shared.1.t:0 "[FROM.GetName] запрошує нас приєднатися до альянсу [NORDIC_get_alliance_name]"
 AAT_norway.1.t:0 "[NOR_lev_trotsky.GetName] зазнає утиску від фашистів"
 AAT_norway.10.t:0 "Стортинг спотикається"
 AAT_norway.11.t:0 "[ROOT.GetAdjectiveCap]ий народ пробуджується!"
 AAT_norway.8.desc_SOV:0 "Ми мріяли про цю мить роками. Підступна змія, [SOV_lev_trotsky.GetName] — у наших руках. Він заплатить за свої злочини проти революції, а головне — проти товариша Сталіна. Не те, щоб між ними була якась різниця в очах пролетаріату."
 AAT_norway_monarchist.3.desc:0 "Поки наш народ оплакує смерть свого улюбленого короля Гокона VII, стало зрозуміло, що вся увага принца Олава прикута до поля бою, а якщо б це було не так, то, як повідомляється, він був занадто засмучений, щоби думати про щось інше, окрім як про те, як привести наших людей до перемоги. Нам залишається лише гадати, хто поведе державу [NOR.GetNameDef] крізь ці неспокійні часи. Принаймні, ми можемо бути вдячні маркізу Ярлсбергу за його тверду руку."
 AAT_norway_monarchist.3.t:0 "Спадкування в нашій країні"
 AAT_norway_news.3.desc:0 "Після, здавалося б, успішної операції після нещасного випадку на лижах, улюблений король Норвегії Гокон VII помер від медичних ускладнень.\n\nНорвегія зараз переживає один з найтемніших періодів у своїй історії, сподіваємося, що принц Олав зійде на трон якнайшвидше, щоби спрямувати країну в безпечну гавань."
 AAT_norway_rikstanken.11.b:0 "Нам не потрібні танки."
 AAT_norway_rikstanken.3.t:0 "[FROM.GetName] хоче придбати [ROOT.GetAdjective]ий танк"
 AAT_norway_rikstanken.5.b:0 "$AAT_norway_rikstanken.3.b$"
 ABDA_events.1.desc:0 "[FROM.GetNameDef] створило спільне верховне командування для Тихоокеанського театру воєнних дій і надіслало нам запрошення приєднатися. Ця ініціатива — відома як ABDACOM — прагне об'єднати військово-морські, військово-повітряні та сухопутні сили союзних країн, що діють у регіоні, під єдиною структурою командування. Членство означатиме тіснішу координацію з [FROM.GetNameDef] та іншими партнерами, які вже віддані цій справі. Ми повинні вирішити, чи приймати запрошення."
 ABDA_events.4.desc:0 "Оскільки Сінгапур призначений як ключова ланка оборонного периметра ABDACOM, наші командири повинні вирішити, як інвестувати в його укріплення. Ми можемо віддати перевагу військово-морським підступам і обороні гавані, посилити сухопутні підступи проти атаки з суші, або розподілити наші ресурси на обидва напрямки. Кожен варіант визначить, як Сінгапур можна буде захистити, коли прийде ворог."
 ABDA_expand_the_command_desc:0 "ABDACOM довів свою цінність. Тепер ми повинні спиратися на цей фундамент, розширюючи членство для інших країн-союзників у регіоні та поглиблюючи наш обмін дослідженнями і розвідувальною інформацією, щоб залишатися на крок попереду ворога."
 ABDA_naval_procurement:0 "Військово-морські закупівлі"
 ABDA_naval_procurement_hol_ships_tt:0 "[HOL.GetName] отримає §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
 ABDA_supreme_command_desc:0 "Американо-британсько-голландсько-австралійське командування (ABDACOM) запровадило єдину військово-морську доктрину для флотів усіх учасників. З поглибленням альянсу, обмін розвідданими, скоординоване патрулювання та взаємна логістича підтримка неухильно підвищують бойову ефективність кожного флоту, що ходить під прапором ABDACOM."
