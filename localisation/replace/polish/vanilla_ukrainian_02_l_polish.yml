 RAJ_azad_hind:0 "Азад Гінд"
 RAJ_azad_hind_bank_desc:0 "Революція потребує ресурсів. Створивши Банк Азад Гінд, ми створюємо фінансову установу, присвячену підтримці боротьби за незалежність. Він мобілізує кошти, розширить можливості патріотів та закладе економічний фундамент для вільної Індії."
 RAJ_battaglione_azad_hindoustan:0 "Battaglione Azad Hindoustan"
 RAJ_bruce_w_mcpherson:0 "Брюс У. МакФерсон"
 RAJ_capital_ship_effort:0 "Розвиток основних кораблів"
 RAJ_clamp_down_on_corruption_desc:0 "Незважаючи на всі спроби британських промисловців розширити охоплення залізниць Індії, прогрес майже не зрушив з мертвої точки. Причини тому — хронічна корупція та махінації у транспортному секторі. Ми мусимо щось зробити."
 RAJ_congress_demands_tt:0 "Відмикає наступну вимогу §YКонгресу§!"
 RAJ_cv_nav_bomber_equipment_3_short:0 "Firebrand"
 RAJ_deathknell_to_the_raj_desc:0 "Ми руйнували залишки Раджу, беручи все більше контролю над їхніми землями. Настав час покінчити з цим фарсом та вимагати повного контролю над субконтинентом."
 RAJ_douglas_dakota:0 "Douglas Dakota"
 RAJ_east_india_railways:0 "Східноіндійські залізниці"
 RAJ_expand_mazagon_dock_dlc:0 "$RAJ_expand_mazagon_dock$"
 RAJ_fight_malnutrition:0 "Боротьба з недоїданням"
 RAJ_fighter_equipment_1_short:0 "Demon"
 RAJ_found_scindia_shipyard_dlc:0 "$RAJ_found_scindia_shipyard$"
 RAJ_gurkhas_desc:0 "Відомі своєю хоробрістю та завзяттям, гуркхи — це елітні сили, неперевершені в бою. Розширюючи їхню роль та забезпечуючи їхню відданість нашій справі, ми забезпечуємо ключову перевагу на полі бою."
 RAJ_has_met_with_kremlin_flag_NO_USSR:0 "Зустрічався з закордонними комуністичними групами"
 RAJ_heavy_tank_equipment_3:0 "Churchill Black Prince"
 RAJ_imperial_industry_initiative_desc:0 "Щоб забезпечити позицію [ROOT.GetNameDef] як опори Імперії, ми повинні взяти на себе зобов'язання щодо широкомасштабного розширення міської промисловості. Імперська промислова ініціатива спрямує ресурси на важке машинобудування та кваліфіковану робочу силу, таким чином забезпечуючи, що наші міста стануть двигунами стійкості та оновлення на субконтиненті."
 RAJ_import_substitution_industrialisation:0 "Імпортозаміщення"
 RAJ_infantry_equipment_3:0 "GRI Sterling Mk I"
 RAJ_infiltrate_aden_desc:0 "Аден, стратегічний опорний пункт британської влади, є ключем до зриву їхнього контролю в регіоні. Проникаючи туди та організовуючи місцевий опір, ми можемо розпалити повстання, які послаблять британський контроль та створять хаос саме тоді, коли почнеться наша боротьба за незалежність."
 RAJ_light_tank_aa_equipment_2:0 "Matilda (зенітна)"
 RAJ_orchestrate_train_robberies_desc:0 "Будівництво залізниці сповільнилося під керівництвом робітників та посиленим наглядом, але кожна побудована лінія краще інтегрована в планову економіку, забезпечуючи вищу логістичну віддачу та ефективність."
 RAJ_population_decisions:0 "Індустріалізація сільської місцевості"
 RAJ_princely_autonomy:0 "Князівська автономія"
 RAJ_princely_states_donations_troops:0 "$RAJ_princely_states$"
 RAJ_prioritize_civilian_cargo_desc:0 "Сильний внутрішній фронт є важливим для перемоги. Надаючи пріоритет цивільному вантажу, ми забезпечуємо своєчасну доставку продовольства, товарів та матеріалів для підтримки нашого народу та промисловості, зберігаючи націю стійкою у часи кризи."
 RAJ_privatized_healthcare:0 "Приватизована охорона здоров'я"
 RAJ_protest_against_the_howell_monument_desc:0 "Монумент Голвелла є символом прославлення колоніального панування та несправедливості. Організувавши протести проти цього символу, ми згуртуємо націю, щоб відкинути імперську пропаганду та вимагати видалення реліквій, які ображають нашу боротьбу за свободу."
 RAJ_punjab_autonomy_desc:0 "Пенджаб має глибоке значення для сикхів, і надавши їм місцеву автономію, ми можемо завоювати їхню довіру."
 RAJ_red_in_the_shadows_tt:0 "Відмикає рішення щодо проникнення в британський уряд та впливу на рух за незалежність у напрямку прокомуністичної позиції, зменшуючи вимоги для завершення §Y$RAJ_royal_indian_navy$§!."
 RAJ_secure_rajahsthan_desc:0 "Пустелі Раджастхану не повинні стати базою для контрреволюції.\nМи включимо область до нашого складу."
 RAJ_sharpen_the_tulwar_desc:0 "Тулвар, символ сили та непокори, має бути заточений для майбутніх битв. Модернізуючи наші сили та вдосконалюючи наші стратегії, ми забезпечуємо готовність [ROOT.GetNameDef] завдати рішучого удару, коли цього вимагатиме момент."
 RAJ_sikh_religious_guarantees_desc:0 "Сикхи — важлива релігійна меншина та відважні воїни. Нам потрібно заспокоїти їх, гарантувавши їхні релігійні права."
 RAJ_the_mughal_uprising_desc:0 "Віддалений регіон на півночі є ідеальним географічним місцем для відокремлення від британців.\nМісцеві лідери розпалили полум'я в серцях людей розповідями про славне минуле, коли Моголи правили цією землею, вільні самі обирати свою долю.\nІншалла, так буде і з нами."
 RAJ_the_need_for_a_mercantile_navy:0 "Потреба у торговому флоті"
 RAJ_timurs_succesor:0 "Наступник Тімура"
 RAJ_trade_federation_of_india_tt:0 "Відмикає рішення про надання претензій на власні штати з високим рівнем підпорядкування, використовуючи §Yфактор фабрик споживчих товарів§! та §Yполітичну владу§!."
