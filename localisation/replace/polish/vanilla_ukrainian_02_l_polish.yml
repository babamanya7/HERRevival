 PHI_pearl_of_the_orient_seas:0 "Перлина східних морів"
 PHI_pearl_of_the_orient_seas_desc:0 "Романтизований першими іспанськими дослідниками для опису земель, які вони щойно відкрили, цей опис, тим не менш, закріпився і залишається правдивим. Попри всі випробування та трагедії, що випали на долю наших островів, ми залишаємося місцем великої краси, з якою можуть зрівнятися лише перли, які ми тут збираємо."
 PHI_propose_unification:0 "Запропонувати об'єднання з [FROM.GetNameDef]"
 PHI_puppet_president:0 "Президент-маріонетка"
 PHI_rebuild_sakdalistas_desc:0 "У ніч на 2 травня 1935 року 65 000 частково озброєних селян порушили спокійний мир на Філіппінах, намагаючись захопити владу в підтримуваного американцями уряду. Ця спроба провалилася, але гнів через зростаючу майнову прірву між міськими багатіями та сільською біднотою продовжує кипіти під поверхнею, чекаючи, щоб його використали."
 PHI_return_of_the_exiles:0 "Повернення вигнанців"
 PHI_sanction_piracy:0 "Санкціонувати піратство"
