 wtt_border_conflict_lost_attacker.1.t:0 "Поразка в області [our_state.GetName]"
 wtt_china.11.t:0 "[From.GetNameDefCap] підкоряється"
 wtt_germany.18.b:0 "Засудити до висновку, вони ще можуть стати в нагоді"
 wtt_germany.24.b:0 "Не вірте жодному [GER.GetAdjective]ому слову!"
 wtt_germany.38.b:0 "Можливо, вони будуть корисними в цій галузі."
 wtt_germany.46.desc:0 "Німецька імперія прийняла нашу пропозицію провести переговори щодо повернення Ціндао. Її представники гарантують негайне відкликання фон Фалькенгаузена з Китаю."
 wtt_germany.49.a:0 "Невелика ціна за порятунок нашої батьківщини від них."
 wtt_germany.53.t:0 "В Австрії посилюються пронімецькі настрої"
 wtt_germany.5_tt:0 "Старий кайзер міг би допомогти синові правити.\n"
 wtt_germany.71.a:0 "Це зоря нової ери в історії Австро-Угорщини."
 wtt_infiltration.2.desc:0 "В результаті вжитих нашими владою дій в області [infiltrated_state.GetName] було виявлено базу комуністів. Необхідно направити туди наші війська, щоб якнайшвидше розквитатися з цими бандитами. Будь-яке зволікання загрожує посиленням їхньої присутності, і тоді позбутися їх буде важче."
 wtt_infiltration.5.t:0 "Базу в області [infiltrated_state.GetName] викрито"
 wtt_japan.107.desc:0 "Держава [From.GetNameDefCap] відповіла на вимоги Японії надати незалежність Філіппінам, і американський уряд розпорядився негайно провести всі процедури надання їм суверенітету."
 wtt_japan.12.desc:0 "Держава [From.GetNameDef] офіційно схвалила нашу пропозицію укласти пакт про ненапад."
 wtt_japan.21.t:0 "Обмін [From.GetAdjective]ими генералами"
 wtt_news.16.d:0 "Повернення німецького колоніалізму?"
 wtt_news.19.a:0 "Ми захистимо їх нашими життями."
 wtt_news.2.c:0 "Хтось мусив наполягти на своєму."
 wtt_news.2.t:0 "[From.GetNameDefCap] перешкоджає поверненню Вільгельма II"
 wtt_news.31.c:0 "Ми вчинили правильно."
 wtt_news.31.desc:0 "Надійшла звістка про те, що сьогодні вранці слідом за арештом, розпорядження про яке дав [CHI_xian_instigator.GetLeader], розстрільний взвод комуністів стратив Чан Кайші. Цю міру наказання після недовгого суду за звинуваченням у злочинах проти народу та партії, у зраді та в контрреволюційній діяльності проголосивши [PRC.GetLeader]. Радянський представник виступав на суді як обвинувач, і це підкріплює підозри в тому, що [SOV.GetLeader] таємно схвалив рішення. \nНовий лідер націоналістів [CHI.GetLeader] поклявся помститися за смерть Чана і «винищити» всіх комуністів."
 wtt_news.39.c:0 "Що ми накоїли?!"
 wtt_news.46.desc:0 "Виступивши сьогодні перед групою прихильників, [From.GetLeader] оголосив про значні зміни у своєму правлінні. Раніше [From.GetLeader] терпимо ставився до того що деякі частини Китаю практично незалежні. Але це залишилося у минулому. З сьогодення [From.GetNameDef] вважає своєю державою весь Китай. Будь-хто, хто посміє не послухатися наказів єдиного законного правителя Китаю, буде оголошений злочинцем або зрадником і отримає відповідне покарання.\n\nПоки незрозуміло, чи зможе [From.GetLeader] виконати свої загрози, або ж ця заява залишиться лише пропагандистським ходом задля отримання підтримки населення."
 wtt_news.58.b:0 "Так... Це все скидається на внутрішню справу..."
 wtt_news.62.t:0 "Об'єднання Європи"
 wtt_news.64.a:0 "Roma invicta!"
 wtt_news.66.t:0 "Підйом [From.GetNameDef]"
 wtt_political_warlord_support.11.b:0 "Неприйнятно."
 wtt_political_warlord_support.21.a:0 "Як мило з його боку."
 wtt_prc.11.t:0 "[From.GetNameDefCap] приєднується до Уряду національної оборони"
 wtt_prc.2.t:0 "[From.GetLeader] відхиляє пропозицію альянсу"
 wtt_prc.21.desc:0 "З держави [JAP.GetManchuriaPuppet] надходять повідомлення про те, що на одному з наших заводів спалахнула велика пожежа. Місцеві пожежники й досі борються із ним, але впевнені, що до кінця дня його вдасться загасити. За попередніми оцінками пошкодження досить значні, оскільки вогнище займання, судячи з усього, знаходилося на сховищі легкозаймистих хімікатів.\n\nВійськова розвідка розпочала розслідування інциденту. Не виключена можливість навмисного підпалу."
 wtt_prc.31.desc:0 "Під покровом ночі наші товариші з держави [JAP.GetManchuriaPuppet] влаштували диверсію на мосту, що має важливе стратегічне значення. Невеликий загін диверсантів доповів, що міст повністю підірваний і впав разом з поїздом, що перевозив боєприпаси.\n\nДиверсанти простежили за тим, щоб місцеві жителі побачили вибух і зрозуміли, що його було влаштовано навмисно. Залишається перевірити, чи змусить це японців перейти до рішучих дій."
 wtt_take_national_leadership.2.t:0 "[old_leader.GetLeader] підкоряється"
 wtt_the_hump.2.desc:0 "[From.GetAdjective]ий уряд наказав негайно припинити всі перельоти через Гімалаї. Незважаючи на протести, що тут же відбулися, воно не має наміру змінювати своє рішення."
 wtt_the_hump.4.desc:0 "Маршрут поставок через Гімалаї повністю відновлено, і згідно з ретельно спланованим графіком цим шляхом щодня доставляються такі необхідні вантажі."
 wtt_warlord.1.b:0 "У наших планах їм немає місця."
 wtt_warlord_vs_prc.33.a:0 "Мабуть, нам слід повторити свої слова з застосуванням сили."
 wtt_xian_incident.1.a:0 "Піти."
 wtt_xian_incident.4.desc:0 "На зустрічі у Сіані [From.GetLeader] зробив несподівану пропозицію: він вважає, що нам потрібно укласти союз із комуністами, щоби спільним фронтом протистояти японській загрозі."
 wuw_GER_civil_war.1.a:0 "Ласкаво просимо назад, товариші!"
 wuw_GER_civil_war.1.t:0 "Репатріація комуністів"
 wuw_GER_civil_war.7.a:0 "Будь-якою ціною забезпечимо їхню підтримку"
 wuw_GER_diplomacy.107.a:0 "Чому б і ні?"
 wuw_GER_diplomacy.51.a:0 "Наш флот знову стане сильним"
 wuw_GER_diplomacy.65.t:0 "[FROM.GetNameDefCap] приймає наші умови"
 wuw_GER_diplomacy.68.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] повідомив, що заради безпеки свого народу вони згодні на пакт та готові встановити сфери впливу."
 wuw_GER_diplomacy.75.b:0 "Ми повинні зупинити це божевілля!"
 wuw_GER_diplomacy.88.desc:0 "[FROM.FROM.GetNameDef] передав нам землі [FROM.GetAdjective], що лежать у межах нашої сфери впливу. Домовленість виконано."
 wuw_GER_diplomacy.91.t:0 "[FROM.GetNameDefCap] хоче пристати до нашої ідеології"
 wuw_GER_diplomacy.93.desc:0 "Можливо, несподівано, але [FROM.GetAdjective] керівництво погодилося замінити Ернста Тельмана. Вони здійснили цю зміну задля покращення відносин із нами та для уніфікації політичних курсів. Це слід вважати успіхом!"
 wuw_GER_monroe.11.a:0 "Вперед!"
 wuw_GER_monroe.12.desc:0 "Низькоінтенсивна суперечка щодо Доктрини Монро завершилася після початку повномасштабної війни між нашими країнами. Дипломатія й таємні операції тепер виглядають марними, бо війна стала єдиним аргументом."
 wuw_GER_monroe.7.a:0 "Відмовимось, щоб уникнути гніву [FROM.GetAdjective]"
 wuw_GER_monroe.8.a:0 "Ми знову підтримуємо Доктрину"
 wuw_GER_monroe_news.1.b:0 "Жахливо"
 wuw_GER_realpolitik.2.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] позитивно відповів на нашу пропозицію, і їхні дипломати прибули до нашої країни для підписання всіх необхідних документів про вступ до нашого альянсу."
 wuw_GER_realpolitik.28.desc:0 "Після тривалого періоду зростання демократичних настроїв, демократичні сили [ROOT.GetAdjective] втомилися чекати мирної зміни влади, заявивши, що чинний уряд прагне зберегти всю владу собі, і його потрібно усунути для розвитку демократії. Після жорсткої політичної боротьби дипломати втратили контроль, і розпочався збройний конфлікт."
 wuw_GER_realpolitik.40.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] погодився на нашу пропозицію, і їхні дипломати прибули для підписання необхідних документів щодо вступу до нашого альянсу. Вони радо приймають нашу допомогу у відновленні старих угорських територій."
 wuw_GER_realpolitik.44.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 wuw_GER_realpolitik.56.a:0 "Вони пошкодують про це!"
 wuw_GER_realpolitik.9.t:0 "[FROM.GetNameDefCap] відкидає наші вимоги"
 wuw_GER_reichskommissariats.20.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.5.t:0 "Керівництво Остланду"
 wuw_GER_releasable.1.c:0 "Франкфурт — гарна західна столиця"
 wuw_GER_weltpolitik.10.a:0 "Ми заберемо це силою"
 wuw_HUN_a_holy_empire_tt:0 "§YOtto von Habsburg§! та його васали будуть благословенні Папою"
 wuw_HUN_announce_the_gyor_program_tt:0 "Відкриває рішення §YІнвестиції в програму Дьорі§!, що дозволяють додаткові інвестиції та розширення §Y[ROOT.GetAdjective] військової промисловості§!"
 wuw_HUN_develop_laszlo_vargas_design_desc:0 "Наш видатний аеронавігаційний інженер Ласло Варга розробив багато вітчизняних моделей для нашої армії, зокрема прототип Varga RMI-1 X/H. Ми маємо надалі фінансувати його розробки, щоб забезпечити подальший прогрес."
 wuw_HUN_develop_the_weiss_wm_21_solyom_desc:0 "Ми повинні врахувати наші попередні помилки в авіації й створити легкий бомбардувальник Weiss WM-21 Sólyom. Цей сокіл зможе бити ворога з небес, де б він не стояв."
 wuw_HUN_enact_agrarian_reform_desc:0 "Наш аграрний сектор має великий потенціал для покращення. Його оптимізація й підвищення ефективності звільнить робочу силу, яку можна буде використати в будівництві й оборонній промисловості."
 wuw_HUN_establishing_a_royal_guard:0 "Створити королівську гвардію"
 wuw_HUN_expand_the_diosgyor_machinery_factory_desc:0 "Завод Diósgyőri Gépgyár має бути розширено на нові сектори, що дозволить пришвидшити виробництво промислових матеріалів, інструментів, двигунів і мотоциклів."
 wuw_HUN_extensive_licensing_programs:0 "Розширені ліцензійні програми"
 wuw_HUN_hungarian_tradition:0 "[ROOT.GetAdjective]а традиція"
 wuw_HUN_news_events.7.desc:0 "Сьогодні голова Центрального виконавчого комітету Угорщини Бела Кун оголосив про відновлення Соціалістичної федеративної республіки рад Угорщини, яка раніше була знищена в серпні 1919 року. Хоча раніше її знищили антиреволюціонери й Мала Антанта, Бела Кун заявив, що цього разу буде інакше. Що ж чекає Балкани?"
 wuw_HUN_news_events.8.t:0 "Проголошення Угорської Народної Республіки"
 wuw_HUN_promote_revanchist_sentiment:0 "Заохочувати реваншистські настрої"
 wuw_HUN_the_kingdom_of_ukraine_desc:0 "Після Великої війни ми намагалися заснувати українську державу за підтримки Німеччини. Її знищили більшовики, але тепер ми знову контролюємо українські землі й можемо спробувати відновити Габсбурзьке Королівство Україна."
 wuw_HUN_the_mavag_heja_desc:0 "Авіаційний підрозділ компанії MÁVAG розробив нову модель літака, яку назвали «Яструб», на основі італійського зразка Reggiane Re.2000. Ми повинні підтримати масове виробництво цієї нової моделі."
 wuw_HUN_the_szekel_command_division_tt:0 "Отримати дві дивізії з 4 §Yгірськими§! батальйонами та 1 §Yартилерійським§! батальйоном"
 wuw_HUN_the_toldi_tt:0 "\nПісля дослідження технології §Y$improved_light_tank_chassis$§!:\n"
 ww_BEL_event_diplomatic.14.a:0 "Як неввічливо з їхнього боку!"
 ww_BEL_event_diplomatic.2.t:0 "[FROM.GetNameDefCap] Вимагає нашу анексію"
 ww_BEL_event_diplomatic.30.a:0 "Вони тут бажані"
 ww_BEL_event_diplomatic.32.desc:0 "Попри очевидні переваги, лідер [FROM.GetAdjective] [FROM.GetLeader] відмовив нам в членстві в [FROM.GetFactionName]. Ми могли б багато чого принести в цей союз, але з огляду на цю відмову, ми повинні переглянути наші амбіції щодо вступу до них, як тепер, так і в майбутньому."
 ww_BEL_event_diplomatic.9.t:0 "Кокільятвіль і Стенлівіль продано Франції!"
 ww_BEL_event_political.2.t:0 "Корупційний скандал Поля ван Зееланда"
 ww_BEL_event_spanish_interaction.1.a:0 "Ми використаємо їх належним чином!"
 ww_BEL_event_war.4.a:0 "Призначити Леона Дегреля новим регентом"
 ww_congo.16.d:0 "У відповідь на зростання глобальних напружень та нещодавні переможні подвиги [FROM.GetLeader], об'єднання країн Центральної Африки, що говорять на романських мовах, було досягнуто. Тепер вони оголошують себе новою світовою силою і обіцяють захищати народ [FROM.GetAdjective] за будь-яку ціну."
 ww_congo.22.a:0 "Ми погодимося"
 ww_congo.27.a:0 "Захопити їх і зробити приклад з Мукалабуші"
 ww_congo.32.t:0 "Симба здійснює переворот"
 ww_congo.38.t:0 "[FROM.GetName] погоджується на мирну пропозицію"
 ww_congo.41.t:0 "[FROM.GetLeader] вимагає об'єднання народу баконго"
 ww_congo.44.desc:0 "Рада вирішила, що найбільш легітимним правителем Конго буде Дом Педро VII, нинішній претендент на трон недавно скасованого Королівства Конго, що колись знаходилось на наших західних провінціях, а також на території сучасних Кабінди та Анголи. Напевно, він міг би принести стабільність і досягти об'єднання народу баконго?"
 ww_congo.48.t:0 "Клан Абанігіня з Руанди"
 ww_congo.50.t:0 "[FROM.GetNameDefCap] прагне встановити альянс"
 ww_congo.58.b:0 "Ми їм покажемо!"
 ww_congo.65.t:0 "[FROM.GetLeader] відмовляється від угоди з ураном"
 ww_congo.71.a:0 "Нехай їде"
