 SWI_plains_warfare_desc:0 "[ROOT.GetName] мав багато можливостей тренуватися в долинах, горах, пагорбах і лісах, але якщо ми хочемо воювати в чужих країнах, ми повинні адаптуватися до сучасних доктрин війни. Ми побачили, як швидко рухома механізована піхота може шокувати оборону та забезпечити швидку перемогу, тож ми можемо навчитися цьому та перенести армію [ROOT.GetAdjective] у 20-е століття."
 SWI_purchase_american_planes_usa:0 "Придбати американські літаки"
 SWI_return_to_the_old_switzerland_desc:0 "Тепер, коли війна добігає кінця, ми нарешті можемо вжити заходів, щоби повернути [ROOT.GetNonIdeologyName] до того, що було раніше; демократична і нейтральна нація, заснована на принципах взаємної поваги та самовизначення. Як тільки війна закінчиться, ми нарешті зможемо встановити навколо нас демократію та нейтралітет."
 SWI_volunteer_forces_idea_desc:0 "Хоча згідно з нашою звичайною політикою [SWI.GetNameDef] офіційно не є частиною жодного конфлікту, ми дозволяємо та таємно заохочуємо приєднуватися як волонтери, особливо коли це стосується захисту демократії."
