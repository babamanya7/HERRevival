 MUN_czech.1007.t:0 "[FROM.GetName] вимагає лояльності"
 MUN_czech.1011.d:0 "У рамках зусиль з відлякування будь-якої агресії щодо [FROM.GetNameDef], їхні дипломати звернулися до нас із проєктом договору про взаємну оборону. В обмін на нашу підтримку вони запропонують нам такий самий захист, що змусить будь-якого агресора вести війну на два фронти."
 MUN_czech.1013.t:0 "[FROM.GetName] пропонує умовний союз"
 MUN_czech.1023.a:0 "Готуйте війська"
 MUN_czech.1029.d:0 "Наш останній фортифікаційний проєкт завершено, і тепер є ресурси для початку наступного. Наші інженери готові за першим же наказом вирушити в інше місце, щоб розпочати земляні роботи на новій лінії укріплень."
 MUN_czech.2.d.3:0 "У світлі нещодавніх новин про наші плани щодо [CZE.getname], місцеві комуністичні партії швидко мобілізували робітничу міліцію. Ці загони робітничої міліції почали атакувати об'єкти [CZE.GetAdjective]ого уряду в регіоні. Тепер вони просять нашої повної підтримки у здійсненні транскордонних рейдів та диверсій проти [CZE.GetAdjective]ого уряду і інших контрреволюціонерів."
 MUN_czech_bop.2.t.2:0 "Військова експансія сусідніх країн"
 MUN_the_fall_of_the_republic.4.d:0 "Після нещодавнього хаосу, що спіткав [CZE.GetAdjective]ий уряд, невеликий регіон [RUT.getname] опинився поза межами будь-якої держави. Цей невеликий регіон проголошує себе незалежною країною і робить дипломатичні кроки назустріч своїм сусідам. Багато хто в нашому уряді стурбований тим, що такий стратегічно важливий регіон на нашому кордоні може потрапити до чужих рук. Армія запропонувала негайно висунути сепаратистському регіону ультиматум з вимогою анексії."
