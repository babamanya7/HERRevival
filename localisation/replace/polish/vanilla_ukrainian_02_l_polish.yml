 CHI_sea_industrial_research_projects_desc:0 "Без сучасної промисловості ми відстанемо від решти, і без неї нас незабаром перевершить Центральний уряд. Фінансування досліджень сучасніших методів і техніки допоможе підтримувати нашу промисловість на рівні з рештою світу."
