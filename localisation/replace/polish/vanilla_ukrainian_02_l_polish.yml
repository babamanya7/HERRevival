 uk_commonwealth_focus_desc:0 "Об'єднані спільною вірністю Короні, країни Британської Співдружності — перші, на кого ми можемо розраховувати у випадку нового глобального конфлікту. Забезпечення безпеки нашої дипломатичної адміністрації там матиме вирішальне значення."
