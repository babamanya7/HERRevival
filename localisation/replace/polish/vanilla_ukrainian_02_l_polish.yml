 ITA_missiolini_industrial_research:0 "Промислові дослідження"
 ITA_missiolini_occupy_greece_occupation_effects:0 "\nКожна [GRE.GetFlag][GRE.GetAdjective]а осердна земля, повністю підконтрольна державі [ROOT.GetFlag][ROOT.GetNameDef]:\n   Підпорядкування: §G+5.0%§!.\n   Спротив: §G-5.0%§!.\n\nПоточні ефекти:"
 ITA_missiolini_stockpile_trucks_desc:0 "Нам потрібні більш мобільні збройні сили, здатні швидко пересуватися великими ділянками місцевості, не будучи обмеженими відставанням у логістиці."
 ITA_missiolini_strengthen_heavy_industry_desc:0 "Щоб Італія по-справжньому процвітала, нам потрібно будувати нові заводи, щоби підтримувати зростання нашої бурхливої імперії та розширювати наші виробничі можливості."
