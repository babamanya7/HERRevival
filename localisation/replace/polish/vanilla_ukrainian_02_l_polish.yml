 RAJ_GOE_eic_the_taxman_taxes_tt:0 "З нашою поточною економікою ми повинні сплатити §Y[?var:taxes_display_tt]%§! нашої економіки як §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! на основі контрольованих цивільних фабрик (за винятком фабрик маріонеток і торгівлі)."
