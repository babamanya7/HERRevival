 BUL_opression_ban_bs_media_desc:0 "Ми заборонимо розповсюджувати будь-яку пресу, яка належить фракції [GetBsName] або публічно її підтримує."
 BUL_popular_suspicions_about_death_basic:0 "Однак причини смерті досі не з'ясовані, і є припущення, що Боріса було отруєно під час останньої зустрічі — багато хто вважає, що так наказав [GER.GetLeader]. Інші переконані, що царя отруїв НКВС. Хтось вказав на [ENG.GetAdjective]у владу і, як не дивно, дехто навіть наважується стверджувати, що до смерті царя причетний сам [BUL.GetAdjective]ий уряд..."
 BUL_purchase_aircraft_tt:0 "\nМи зробимо вибір між придбанням [?BUL_quantity_purchased_fighter] од. §Yвинищувачів§![GetAvailableAircraftToPurchase] на основі [FROM.GetAdjective]их досліджень.\n"
 BUL_purchase_vehicles_everything_available:0 ", [?BUL_quantity_purchased_mechanized] од. §Yбронетранспортерів§! або [?BUL_quantity_purchased_armored_car] од. §Yбронемашин§!"
 BUL_ratniks_desc:0 "[GetIntegrateTheRatniksFocusLoc]"
 BUL_restrained_paramilitary_organizations_desc:0 "Члени воєнізованих організацій є лояльними людьми, які вже володіють певною формою військової дисципліни і будуть готові вести війну за більшу славу нашої країни. Якщо ми зможемо залучити ці організації, вони можуть стати надійним джерелом робочої сили."
 BUL_restrained_paramilitary_organizations_tt:0 "Будуть відкриті рішення по співпраці з фракцією [GetNsmName]."
 BUL_soviet_industrial_agreements_category_desc:0 "Поточні [SOV.GetAdjective]і заводи: [?BUL.BUL_soviet_industrial_investments|Y0]\nБазова межа: [?BUL.BUL_industrial_investments_basic_cap|R0]\nВиконайте фокус §Y$BUL_soviet_bulgarian_treaty_of_mutual_assistance$§!, щоби збільшити межу до [?BUL.BUL_industrial_investments_medium_cap|G0].\nПриєднайтеся до альянсу §Y[SOV.GetFactionName]§!, щоби збільшити межу до [?BUL.BUL_industrial_investments_max_cap|G0]."
