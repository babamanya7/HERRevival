 GOT_GER_fading_eagle.01.t:0 "[FROM.GetNameDefCap] Вимагає нашого підкорення"
 GOT_guarantee_events.01.desc:0 "Зрозуміло, що [GER.GetLeader] не можна вмовити і він не зупиниться перед світовим пануванням. [GER.GetLeader.GetSheHe] переконався, що ніхто не наважиться стати на шляху [GER.GetNameDef] та його зростаючих амбіцій і жаги до територій."
 GOW_fascism:0 "Султанат Сулавесі"
 GRAND_DOCTRINE_SPECIAL_FORCES_QUANTITY:0 "Розширені спецвійська"
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER:0 "Перевага вогневої міці"
 GRE_GREATER_GREECE_fascism_DEF:0 "Елліністична імперія"
 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_STANDARD:0 "Натовп доніс до всіх своє м'яке несхвалення правлінням короля за допомогою актів громадянської непокори та загроз громадянської війни. Вороги зараз у вигіднішій позиції, ніж ми, і тому немає нічого соромного в тому, щоби попросити про допомогу наших британських союзників. Якщо британці будуть за нас, ми не програємо."
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_STANDARD:0 "Захисники Середземномор'я"
 GRE_a_legacy_of_war:0 "Спадщина війни"
 GRE_anti_french_stratagems:0 "$GRE_anti_german_stratagems$"
 GRE_argos_alliance:0 "Аргоський альянс"
 GRE_civil_war_imminent_1:0 "$GRE_civil_war_imminent$"
 GRE_command_economy_desc:0 "Ми живемо в епоху військових машин і більше не можем терпіти те, що більшість грецьких робітників проводять життя, працюючи на полях заради виробництва непотрібних продуктів розкошіі. Ми почали перехід, що значно перетворить Грецію і грецький народ, і будем втручатися в економіку, щоб підштовхнути націю в правильному напрямку."
 GRE_debt_paid_6607:0 "§G66.7%§!"
 GRE_destroyer_2:0 "Клас «Vasilefs Georgios I»"
 GRE_encourage_tourism_desc:0 "Нашим давнім пам'яткам заздрить увесь світ, і немає сумніву, що ми можемо посилити свою економіку за допомогою туризму. Звичайно, тінь війни, що нависла над Європою, не особливо цьому сприяє, але ми сподіваємося, що привабливішою буде можливість сховатися від реальності в екзотичній Греції!"
 GRE_eon_fascist:0 "Національна молодіжна організація"
 GRE_exploited_our_generosity:0 "Скористалися нашою щедрістю"
 GRE_exporting_more_luxury_commodoties_desc:0 "Тютюн, оливки, фета, виноград, інжир — якщо хочеш брати від життя все, купуй грецьке! Ми мусимо просунути у світові маси образ нашої країни як виробника найкращих товарів розкоші."
 GRE_fighter_equipment_0_short:0 "BH-33SHS"
 GRE_georgios_kosmidis:0 "Георгіос Космідіс"
 GRE_gordian_knot_tt:0 "Усі держави, що підписали угоду, за винятком §YІталії§!, оголосять війну §YТуреччині§! для підтримки §YГреції§!, щоб виконати умови §Yконвенції про Велику ідею§!."
 GRE_greek_mechanisation:0 "Грецька механізація"
 GRE_heavy_cruiser_1:0 "Клас «Averof»"
 GRE_horror_and_fear:0 "Жах і страх"
 GRE_luxury_exports:0 "Експорт предметів розкоші"
 GRE_metaxism_2_desc:0 "$GRE_metaxism_desc$"
 GRE_mobilise_our_economy_desc:0 "Великі держави Європи повстають на військові рейки, і відставати від них нам не можна. Для Греції цей процес буде болючим–куди болючішим, ніж для більшості інших країн, але заради свого виживання ми мусимо піти на жертви."
 GRE_monarchist_economy_change_radical_tt:0 "Радикальна зміна економічної політики зменшить лояльність §Yфракції монархістів§! на §R15§!.\n"
 GRE_neorion:0 "«Неоріон»"
 GRE_nikos_zachariadis:0 "Нікос Захаріадіс"
 GRE_protectors_of_the_mediterranean_spirit_desc:0 "Ніхто не жив в Середземномор'ї довше за нас. Ми відповідаємо за нашу Батьківщину і її жителів, і цей священний борг незламний."
 GRE_rapprochement_with_the_italians:0 "Зближення з італійцями"
 GRE_recruit_republican_general:0 "Найняти £faction_gre_venezelist генерала-республіканця"
 GRE_rejuvenating_athens_desc:0 "Наша велика і славна столиця — одне з найстаріших міст у всій Європі. Ще це одна з наших найбагатших і найкраще організованих префектур. Замість того, щоби розвивати провінції, які вже безнадійно відстають, зосередьмо зусилля на нашій сучасній столиці."
