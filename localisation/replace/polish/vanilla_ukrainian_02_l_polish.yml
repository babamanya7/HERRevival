 NOR_independent_norway_removal_tt:0 "§R§Y$NOR_independent_norway_dmod$§! буде видалено, якщо [ROOT.GetNonIdeologyName] стане підданим іншої нації!§!"
 NOR_invite_foreign_investment:0 "Заохотити іноземні інвестиції"
 NOR_joakim_lehmkuhl:0 "Йоакім Лемкул"
 NOR_luftforsvaret:0 "$NOR_royal_air_force_dmod$"
 NOR_mechanized_equipment_2:0 "Stormpanservogn II"
 NOR_northern_international:0 "Північний Інтернаціонал"
 NOR_pacifist_diplomat:0 "Дипломат-пацифіст"
 NOR_prepare_communist_unlock_TT:0 "Відкриває §YРозбудити пролетаріат у області§!, що дає §Gтериторію та війська§!, коли починається Комуністична революція, але §Rпошкоджує будівлі§! в області."
 NOR_prepare_exile_desc:0 "Реальність незаперечна. Наша держава не може вічно відбиватися від наших ворогів, але ми можемо захищатися досить довго, щоб витягти якомога більше з країни, щоб боротися наступного дня."
 NOR_preparing_the_return_to_norway_desc:0 "Сцена готова, у нас є сили опору, які сіють хаос у тилу ворога, співпраця ключових окупаційних адміністраторів, добре навчені війська у вигнанні та військова підтримка наших союзників. Настав час повернути бій нашим ворогам і повторіть [NOR.GetNonIdeologyName]!"
 NOR_reawaken_the_permanent_revolution:0 "Пробудити постійну революцію"
 NOR_recruit_norwegian_refugees_desc:0 "Сотні, якщо не тисячі [NOR.GetAdjective]их біженців залишають окупацію, щоб уникнути гноблення ворога. Багато з них є частиною сил, які борються за захист країни, але не змогли втекти; інші навчилися боротися з опором; а деякі ніколи не билися, але їх можна навчити. Ми повинні використовувати кожного, кого зможемо, щоб вижити у цій війні."
 NOR_reichskommissariat_DEF:0 "Райхскомісаріат на окупованих норвезьких територіях"
 NOR_secret_police:0 "Таємна поліція"
 NOR_send_the_king_back_to_denmark_desc:0 "Ми не можемо називати себе комуністами, якщо зберігаємо королівську родину. Захопивши важелі влади та засоби виробництва, монархія стане центром для контрреволюції та інакомислення. Ми повинні швидко розквитатися з королівською родиною."
 NOR_supplies_commisioner:0 "Уповноважений по постачанні"
 NOR_the_glucksburg_sea_wall:0 "Глюксбурзький морський вал"
 NOR_unlocking_prep_allied_dem_TT:0 "Відмикає §YПідготувати державу до війни§!, що дозволяє використовувати §YКонвої§! і §YПолітичну владу§! для підвищення §Gнаціональної готовності§! і підготовки держави до війни"
 NOTIFICATION_CAPTURED_GENERAL_CLICK:0 "§GКлацніть§!, щоби перемістити камеру до цього місця."
