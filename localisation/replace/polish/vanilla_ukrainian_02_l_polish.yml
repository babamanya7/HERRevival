 baltic_security_goal_desc:0 "Щоб забезпечити майбутнє наших громадян і цивільних осіб, ми повинні захищати Балтійський регіон усім, що маємо. Тільки тримаючи його під нашим контролем, його люди зможуть процвітати."
 basic_ship_hull_heavy_short:0 "Корпус важкого корабля 1936 р."
 battleofwuhan:0 "Уханська битва"
 battleship_antiair_screen_efficient_navigation:0 "Ефективна навігація"
 battleship_focus_desc:0 "Японії потрібен сильний флот, і його ядром мають стати лінкори. Нехай інші держави витрачають кошти на спірні проєкти на кшталт авіаносців. Моря підкоряються лише лінкорам!"
 bba_africa_news.2.a:0 "Будемо сподіватися на мир і процвітання"
 bba_news.101.desc:0 "Після усунення від влади в Італії Беніто Муссоліні був поміщений під домашній арешт за злочинну некомпетентність і державну зраду шляхом бездіяльності, очікуючи на свою долю, яка нарешті його наздогнала. Рано вранці колишній лідер Італії був розстріляний на очах у невеликої групи представників уряду і похований того ж дня під час закритої церемонії, на якій були присутні його найближчі родичі."
 bba_news.104.t:0 "Оголошено нову військову програму"
