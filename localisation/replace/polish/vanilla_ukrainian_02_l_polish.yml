 landmark_hagia_sophia_desc:0 "Стоячи на перехресті імперій, Агія-Софія була візантійським собором, османською мечеттю і символом постійно мінливих правителів Стамбула. Її масивний купол і величні зали відображають як її духовне значення, так і амбіції тих, хто вважав місто своїм."
 landmark_hofburg_palace:0 "Гофбург"
 lar_align_belgium.1.desc:0 "[This.GetLeader] і французький посол зустрілися після серії вуличних інцидентів, під час яких бандити в масках атакували франкомовних громадян. Посол передав ноту від свого уряду, в якій говорилося, що, оскільки ми, очевидно, нездатні захистити французьку спільноту в нашій країні, французький уряд вважає своїм обов'язком зробити це за нас, для цього вона вимагає від нас найвиключніших прав — у тому числі право розміщувати війська в нашій країні та проводити розслідування силами французької жандармерії.\n\nУ ноті сказано, Що відмова буде вважатися актом агресії і призведе до найтяжчих наслідків."
 lar_appeal_to_overseas_territories.7.desc:0 "Колонії Центральної Африки, очолювані керуючим Феліксом Ебуе, виступили на нашу підтримку. Серед місцевого населення вже розпочався набір солдатів."
 lar_appeal_to_overseas_territories.9.desc:0 "Поки місцеві керуючі на наших територіях у Західній Африці сперечалися про те, що говорить [This.GetLeader], патріотично налаштовані громадяни вирішили діяти та захопити колоніальні урядові пости. Тепер цей район під нашим контролем."
 lar_arms_purchases.1.a:0 "Зрозуміло!"
 lar_capture_tito.1.a:0 "На цей раз йому вдалося піти."
 lar_congress_of_paris.2.t:0 "Перемалювання мапи Африки"
 lar_fra_join_the_ententes.2.desc:0 "[From.GetAdjective] уряд обговорив нашу пропозицію союзу і вирішив прийняти її. Наші дипломатичні служби обговорять подробиці договору, а ми можемо бути впевнені, що держава [From.GetNameDef] за годину потреби прийде до нас на допомога — за умови, що й ми будемо готові зробити те саме."
 lar_france_french_union.3.a:0 "Яка невдячність!"
 lar_france_political_violence.4.t:0 "Політичне насильство повертається"
 lar_france_vichy_reunification.3.desc:0 "Уряд, який очолює [From.GetLeader], відмовився передати нам владу. Усі спроби розпочати переговори були зустрінуті мовчанням з їхнього боку. Можливо, нам доведеться примусити їх силою зброї."
 lar_intervention_in_greece.3.desc:0 "Згідно з досить різкою нотою від [From.GetAdjective] посла, його уряд наразі не зацікавлений у зміні статус-кво у Східному Середземномор'ї. Воно надає перевагу поточній ситуації невизначеності, до якої можуть призвести військові дії."
 lar_intervention_in_greece.3.t:0 "[From.GetLeader] відмовляється"
 lar_news.1.t_carlists:0 "Перемога карлистів у громадянській війні в Іспанії"
 lar_news.15.b:0 "Францію чекає чудове майбутнє!"
 lar_news.15.c:0 "Це значно змінить баланс сил!"
 lar_news.18.desc:0 "Через кілька місяців після несподіваного рішення Франсіско Франко здати владу і проголосити повернення законного короля Іспанії, [From.GetSPBkingloc] цього ранку нарешті в'їхав до Мадрида. Під радісні крики городян королівська процесія пройшла вулицями міста церкви Святого Ієроніма.\n\nУ ході помпезної церемонії [From.GetSPBking2loc].\n\nХоча наша держава досі здебільшого лежить у руїнах, можливо, новий король послужить об'єднуючою і відновлюючою силою і завдяки йому [From.GetNameDef] вирушить назустріч славному майбутньому."
 lar_news.2.desc_republic_soviet_help:0 "Користуючись активною радянською підтримкою, Друга республіка нарешті перемогла своїх ворогів — анархістів і націоналістів — і захопила повний контроль над Іспанією. В ізольованих вогнищах націоналістичного опору досі йде партизанська війна раніше націоналістичних районах, але малоймовірно, що вона переросте в масштабний скоординований опір.\n\nКраїна кинула всі сили на відновлення постраждалих від війни міст і промисловості, радянський тиск на націю все зростає, і поки неясно, чи зможе демократичний іспанський уряд залишитися вірним своїм демократичним принципам або перетвориться на аванпост московського впливу у Західній Європі."
 lar_news.7.b:0 "Франція затверджує свою перевагу."
 lar_news.8.d:0 "Хай живе [FRA.GetLeader]!"
 lar_news.9.d:0 "Революція перемогла!"
 lar_portugal_iberian_workers_united.2.a:0 "[Root.GetNameDefCap] та [POR.GetNameDef] об'єднаються!"
 lar_portugal_navy_mutiny.6_tt:0 "Кораблі ([?POR.POR_ships_revolted]) будуть повернуті державі [POR.GetNameDef]."
 lar_portugal_promote_monarchist_cause.3.t:0 "Повстання монархістів!"
 lar_portugal_promote_monarchist_cause.6.a:0 "Їх доля вирішена."
 lar_portugal_purchase_ships.1.desc:0 "[From.GetAdjectiveCap]ий уряд, який усвідомлює малі розміри свого флоту, оголосив тендер на закупівлю [Root.GetAdjective]их кораблів. Якщо ми побудуємо потрібні їм кораблі, їхня країна забезпечить нас товарами, які ми можемо скористатися власних потреб."
 lar_ratify_the_stresa_front.3.a:0 "Чорний день."
 lar_spain.18.a_tt:0 "Цей національний дух буде видалено з початком громадянської війни.\n"
 lar_spain.23.a:0 "Ми пам'ятатимемо про їхню допомогу."
 lar_spain.33.desc:0 "У справи карлістів, як і раніше, є послідовники в армії. Якщо ми скоординуємося з ними і заручимося їх допомогою, успіх нашого повстання буде практично гарантований."
 lar_spain.41.t:0 "[From.GetNameDefCap] відкидає вимоги"
 lar_spain.46.a:0 "Вони прийняли мудре рішення. Разом ми сильніші!"
 lar_spain.47.a:0 "Що ж, самі запропонували."
 lar_spain.82.t:0 "Ціна перемоги"
 lar_spain.83.a:0 "Ми показово встановимо окупаційну зону в Каталонії."
 lar_spain.88.desc:0 "[SPD.GetAdjective] війська повністю захопили регіон [SPR_stolen_state_name.GetName], вигнали наших прихильників та місцеве промосковське керівництво і тепер швидко відновлюють там власний уряд."
 large_front_operations:0 "Великі фронтові операції"
 large_unit_tactics_wide_trench_networks:0 "Окопування за ніч"
 liberate_eritrea_desc:0 "$liberate_angola_desc$"
 licence_production_access_active:0 "має доступ до виробництва держави"
 light_cruiser_1:0 "Легкий крейсер I"
 light_mg_2x_desc:0 "Набір із двох кулеметів гвинтівкового калібру дає невелику додаткову вогневу міць проти повітряних цілей за дуже помірну ціну."
 light_tank_equipment_desc:0 "Легкі танки — це невеликі, маневрені бойові машини, здатні як розвідувати, так і боротися з легкоброньованим противником."
 limited_interventionism:0 "Обмежений інтервенціонізм"
 logistics_company_desc:0 "Займається плануванням, замовленнями та розподілом ресурсів для дивізії."
 macchi_ETH:0 "$macchi$"
 mannerheim_cross:0 "Хрест Маннергейма"
 march_through_estonia_desc:0 "Слабкий уряд Константіна Пятса надовго заглушив крик патріотів Естонії. Нам не вистачає людської сили, щоби поодинці боротися з естонськими збройними силами, але, можливо, демонструючи наше розчарування диктатурою в серії маршів по всій країні, ми можемо нагадати молоді Естонії, що їхні батьки боролися за хороше життя для них, Пятс і його кабала заперечує їх."
 mare_nostrum_goal_name:0 "Mare nostrum"
 marine_bonus:0 "Бонус до морської піхоти"
 market_access_rights_general_desc:0 "Держава $COUNTRY|UY$ має доступ до ринків інших держав"
 marxist_fundamentalist:0 "Марксист-фундаменталіст"
 massed_strikes:0 "Масовані удари"
 materiel_manufacturer:0 "Виробник матеріального забезпечення"
 mechanical_computing_desc:0 "Створення машин, здатних виконувати диференціальний аналіз, докорінно змінить підхід до машинних обчислень."
 medium_tank_aa_equipment_3_desc:0 "$medium_tank_aa_equipment_desc$"
 medium_tank_destroyer_brigade_desc:0 "Винищувачі танків — це танки з більшою, ніж зазвичай, гарматою у фіксованій надбудові на місці башти. Середні винищувачі танків створюються з шасі середніх танків, через що вони є досить мобільними та володіють пристойною вогневою міццю."
 merchant_marine_manufacturer:0 "Конструктор торгового флоту"
 mexico.10.a:0 "[Root.GetLeader] приймає запрошення."
 mexico.12.desc:0 "[From.GetLeader] вимагає, щоб держава [Root.GetNameDef] продала невелику територію Британського Гондурасу, що іноді називається Белізом. Іспанська імперія колись претендувала на неї, але так і не вкоренилася там, так що У Мексики мало претензій, проте ми можемо продати цю територію нашим мексиканським друзям як жест доброї волі."
 mexico.19.e:0 "Вісенте Ломбардо, радикальний профспілковий діяч."
 mexico.20.title:0 "Хуан Андреу засуджує вибори"
 mexico.22.title:0 "Лев Троцький повертається до СРСР"
 mexico.23.desc:0 "Захист ворожих конвоїв зазнає нестачі ресурсів, і наші підводні човни борознять океан, майже не зустрічаючи опору. Вони можуть нападати на окремі торгові судна практично будь-коли. Капітани наших підводних човнів прозвали це «Щасливими часами». Вибір цілей багатий — наприклад, нейтральні мексиканські нафтові танкери. Наші адмірали вимагають негайного дозволу атакувати ці танкери, хоча міністерство закордонних справ попереджає, що такі дії негативно позначаться на наших відносинах з Мексикою."
 mexico.24.title:0 "Напад німецьких підводних човнів"
 mexico.32.b:0 "У будь-якому разі заарештувати цих «зутерів». Заворушення загрожують нашим роботам на потреби фронту."
 mexico.34.a:0 "Ця угода допоможе як Мексиці, так і Німеччині."
 mexico.47.title:0 "[From.GetFactionName]"
 mexico.56.a:0 "Вони пізнають гнів збройного пролетаріату!"
 mexico.8.title:0 "[From.GetAdjective]ий вступ до альянсу [Root.GetFactionName]"
