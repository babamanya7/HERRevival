 SPR_suppress_the_strikes_mission_desc:0 "Праві ополченці та штрайкбрехери розправляються з нашими невдоволеними робітниками, змушуючи їх повернутися до роботи та посилюючи соціальні заворушення й розчарування у здатності уряду захистити своїх громадян."
