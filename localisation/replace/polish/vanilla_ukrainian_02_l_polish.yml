 SOV_revolutionary_spirit_idea:0 "Революційний дух"
 SOV_right_opposition_communism:0 "Радянська республіка"
 SOV_romanov_reconstruction_desc:0 "Нарешті наш народ знову має царя, який веде його за собою. Через два десятиліття після переслідування останніх законних правителів нашої країни настав час знову прийняти нашу керівну династію і покінчити з дрібними перешкодами на шляху до виконання волі нашого царя."
 SOV_scorched_earth:0 "Застосувати тактику випаленої землі"
 SOV_second_moscow_trial_flag:0 "Виконано фокус §Y$SOV_the_anti_soviet_trotskyist_center$§!"
 SOV_send_elite_commandos_poum_desc:0 "У нас є висококваліфіковані та досвідчені люди, здатні успішно проводити спецоперації, а також несталінські колишні учасники громадянської війни і ветерани армії, які знають, як вести війну.\nМи мусимо надати ці ресурси в розпорядження уряду РПМЄ в його боротьбі проти фашизму і сталінізму."
 SOV_sinikiang_influence_cg_tt_sik:0 "§Y[SOV.GetFlag][SOV.GetNameDefCap]§! отримає від цієї угоди §Y-1,0%§! до бонусу для споживчих товарів."
 SOV_sinkiang_oil_prospection_flag:0 "Проведено розвідку нафти в Північному Сіньцзяні"
 SOV_soviet_atomic_bomb_project:0 "[ROOT.GetAdjective]ий проєкт атомної бомби"
 SOV_soviet_civil_war_dec_cat:0 "[GetSovietCivilWarName]"
 SOV_soviet_civil_war_dec_cat_desc:0 "Над нами нависла загроза нової громадянської війни. Ми повинні підготуватися до найгіршого і забезпечити контроль над якомога більшою частиною країни та збройними силами. Але ми також повинні бути обережними і не привертати до себе зайвої уваги, інакше [ROOT.GetLeader] може змусити нас діяти раніше, ніж ми будемо готові."
 SOV_sp_rockets_medium_range_ballistic_missile:0 "Проєкт «РТ-15»"
 SOV_steel_casting_industry_ns_tt:0 "$SOV_modify_fyp_ns_intro$\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+5.00%§!\n\n"
 SOV_strengthened_relations_with_us:0 "Зміцнили відносини з нами"
 SOV_super_heavy_tank_equipment_1:0 "ИС-7"
 SOV_the_centre_desc:0 "Товариш Сталін був найбільшим борцем за наш народ. Ми мусимо залишити майбутнє революції в його більш ніж надійних руках."
 SOV_the_local_soviets_idea:0 "Місцеві ради"
