 SIK_king_of_sinkiang_desc:0 "Шен Шицай є беззаперечним лідером кліки Сіньцзян, а деякі навіть називають його королем. Однак провінція знаходиться на роздоріжжі: одні хочуть слідувати за Центральним урядом, тоді як інші хочуть продовжувати дотримуватися радянської лінії. Те, що проголосить Король, вирішить майбутнє провінції та її народу, але поки що незрозуміло, що саме це буде."
