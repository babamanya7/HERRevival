 IRQ_anti_western_alliance:0 "Антизахідний альянс"
 IRQ_construct_the_dukan_dam_desc:0 "Великі річки нашої нації мають бути використані не лише для зрошення, але й для виробництва електроенергії. Ми зробимо це, створивши гідроелектростанцію на річці Заб, створивши штучне озеро."
 IRQ_embargo_the_axis_powers_desc:0 "Держави Осі є загрозою світовому миру і мають бути позбавлені всіх ресурсів, необхідних для ведення війни."
 IRQ_ensure_sunni_dominance_desc:0 "Despite being a minority, the Sunni elite has long ruled our nation, propped up by the Hashemite Dynasty and the Arab nationalists. If we want these parties to remain in power, we must ensure that Sunni dominance over our politics continues."
 IRQ_greater_iraq_tt:0 "Відмикає рішення §Y$greater_iraq_decision_cat$§! для отримання претензій на області Близького Сходу, які ми контролюємо."
 IRQ_guardian_of_independence:0 "The Guardian of Independence"
 IRQ_infantry_focus_desc:0 "Великі держави можуть гратися зі своїми механізованими чудовиськами, як їм заманеться, але реальність така, що будь-яка війна зрештою буде вестися піхотою. Таким чином, армія отримає суттєве збільшення бюджету для покращення їхньої підготовки."
 IRQ_kurdish_attack_iran_desc:0 "[PER.GetAdjective] режим є загрозою для нашого народу. Лише через силове визволення курдів у межах їхніх кордонів та поразки [PER.GetAdjective] військових нашими руками ми зможемо забезпечити майбутнє для нашого народу."
 IRQ_kurdish_language:0 "Курдські мовні школи"
 IRQ_minister_of_the_interior:0 "$minister_of_the_interior$"
 IRQ_modernization:0 "Прагнути модернізації"
 IRQ_navy_modifier_intro_tt:0 "Модифікувати §Y$IRQ_navy_modifier$§! на:"
 IRQ_nuri_as_said:0 "Нурі ес-Саїд"
 IRQ_purchase_british_aircraft:0 "Придбати британські літаки"
 IRQ_raf_levies_focus:0 "Військові збори RAF"
 IRQ_rally_behind_the_hashemite_dynasty_desc:0 "Сім'я Гашімітів має бути центром, від якого ми продовжуватимемо будувати почуття іракської нації. Після років перебування при владі, ми близькі до того, щоб справді закріпити наш контроль над нею."
 IRQ_restore_regent_desc:0 "Нерозумний опортунізм Рашида Алі аль-Гайлані та «Золотого квадрата» призвів лише до спустошення нашої нації. Ми повинні раз і назавжди позбутися їхнього отруйного впливу, усунувши їх та відновивши старий уряд при владі."
 IRQ_special_forces_desc:0 "У деяких ситуаціях під час війни жменька спеціалізованих військ, які проникають у тил ворога, можуть завдати нищівного удару, який ціла армія не змогла б завдати відкрито. Нам потрібні такі сили у стані готовності."
 IRQ_subject:0 "$OVERLORDADJ$ий $IRQ$"
 IRQ_suppress_tribal_revolts_desc:0 "In order to bring unity to our nation and ensure that we are not torn apart from within when confronting our neighbors, we must put down tribal revolts and ensure poverty reduction for those willing to cooperate so that the rifts in our nation's soul can be mended."
