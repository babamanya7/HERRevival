 GER_shared_rd_programs:0 "Спільні наукові програми"
 GER_sign_the_second_treaty_of_berlin_desc:0 "Ми усвідомлюємо розміри нашої армії, проте так само усвідомлюємо, що [SOV.GetNameDef] має військо, з яким ми не бажаємо вступати в конфлікт. Домовившись уникати ворожнечі, ми забезпечимо краще майбутнє для всіх робітників наших країн."
 GER_south_east_asian_natural_wealth:0 "Природні багатства Південно-Східної Азії"
 GER_sp_land_large_caliber_kinetic_energy_sabot:0 "Röchling shell"
 GER_speer_reich_minister_of_armaments:0 "$GER_reich_minister_of_armaments_speer$"
 GER_state_development_east:0 "Програми громадських робіт в Східній Німеччині"
 GER_state_development_west:0 "Програми громадських робіт в Західній Німеччині"
 GER_stormtroopers_desc:0 "Stosstruppen Великої війни були елітними ударними підрозділами, призначеними для штурму ворожих окопів і створення проривів, якими могла би скористатися основна піхота. Нам слід відродити цю ідею та підготувати нових елітних штурмовиків, які стануть уособленням швидкості, спритності та безжальної ефективності на полі бою."
 GER_strasserite_state_fascism:0 "Німецький фольксрайх"
 GER_strat_bomber_equipment_3:0 "Focke-Wulf Ta 400"
 GER_strengthen_the_proletarian_international:0 "Зміцнити пролетарський інтернаціонал"
 GER_super_heavy_tank_aa_equipment_1_short:0 "FlakMaus"
 GER_supported_the_monroe_doctrine_good:0 "Підтримав Доктрину Монро"
 GER_sweden_friend:0 "Подружитися зі Швецією"
 GER_the_great_red_menace_desc:0 "Наші дії під час попередньої війни ще свіжі у пам'яті. Потрібно змусити сусідів побоюватися нападу з нового напрямку, пояснивши їм, що над нами нависла велика [GER.GetGreatRedMenaceDesc] зі сходу. Ми розпочнемо масовану кампанію пропаганди, спрямовану на держави континенту."
 GER_the_swiss_gold:0 "Швайцарське золото"
 GER_totaler_krieg_desc:0 "Щоби досягти повної перемоги, ми мусимо мобілізувати все наше суспільство та принести тотальну війну на поріг нашого ворога. Настав час: [ROOT.GetNameDef] підніметься, і нехай буря вийде назовні!"
 GER_u_boat_effort:0 "Розвиток U-Boot"
 GER_u_boat_efforts_desc:0 "Успіхи тактики «вовчої зграї» переконали Флотське верховне командування подвоїти цей підхід і зосередитися на створенні більшої кількості та вищої якості підводних човнів, щоби забезпечити нашу перемогу у відкритому морі."
 GER_walter_model:0 "Вальтер Модель"
