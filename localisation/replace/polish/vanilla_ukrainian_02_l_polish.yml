 ENG_alliance_with_germany_desc:0 "Наші інтереси збігаються з інтересами німців — якщо вони прагнуть гегемонії на європейському континенті, то ми прагнемо Європу, яка не загрожуватиме Британським островам, допоки ми дбаємо про нашу глобальну імперію. Можливо, союз, як того бажає король, був би не такою вже й дивною співпрацею."
