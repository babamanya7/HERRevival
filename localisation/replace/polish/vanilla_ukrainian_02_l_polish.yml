 JAP_raise_support_within_the_proletarian_class_desc:0 "Багато наших вищих лідерів походять з робітничого класу, працювавши на верфях та металургійних заводах. Ми повинні заохочувати японський пролетаріат об'єднуватися в профспілки та виступати проти тих, хто хоче розтоптати їхні права."
 JAP_revere_the_emperor_destroy_the_traitors_desc:0 "День, до якого ми готувалися, нарешті настав. Наші війська взяли під контроль Токіо, і розпочалися переговори з Імператором, щоб переконати його підтримати наш рух, попри його початкове насторожене ставлення. Нарешті ми зможемо позбавити нашу країну західного занепаду і повернути славу старих звичаїв!"
