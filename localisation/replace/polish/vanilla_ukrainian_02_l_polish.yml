 democratic_on_the_rise_desc:0 "Видні політичні елементи почали виступати на користь демократичних цінностей, знаходячи підтримку в дедалі більшої кількості населення. Шлях нації до демократизму відкритий; вона лише чекає на вибір мирного чи насильницького переходу."
 denmark_expansion_event.10.t:0 "[FROM.GetNameDefCap] вимагає підпорядкування"
 denmark_expansion_event.212.t:0 "[FROM.GetNameDefCap] відкидає [SWE.GetAdjective]і претензії"
 denmark_expansion_event.3.desc:0 "На жаль, [ICE.GetAdjective]ий уряд, судячи з усього, відмовив нам у реінтеграції. Дуже недалекоглядне рішення — м'яко кажучи. Утім, і воно не завадить нам заявити свої права на цей острів."
 denmark_expansion_event.300.t:0 "[FROM.GetNameDefCap] пропонує права на ресурси"
 denmark_expansion_event.302.a:0 "Як грубо."
 denmark_expansion_event.502.desc:0 "На жаль, [FROM.GetNameDef] відмовляється вступити з нами в альянс. Схоже, що взаємні гарантії безпеки їх не цікавлять."
