 pavel_events.3.desc:0 "З держави [From.GetNameDef] прибула тривожна телеграма, що вимагає негайної здачі «колишніх польських територій». Під ними маються на увазі в тому числі Померанія, Пруссія і Сілезія.\n\nТой пори, як польський займає [From.GetLeader], Польща стала дещо непередбачуваною, але що [From.GetLeader.GetSheHe] стане вимагати територію у держави [Root.GetNameDef] — такого ніхто й уявити не міг."
