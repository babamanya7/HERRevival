 CHI_send_the_first_lady_abroad:0 "Відправити першу леді за кордон"
 CHI_taiyuan_arsenal_desc:0 "Тайюанський арсенал — одне з небагатьох місць у Китаї, здатних виробляти важке озброєння. Слід розширити його, щоби забезпечити наші війська артилерією та іншою зброєю."
 CHI_the_hump_sea_desc:0 "Потяги, вантажівки та кораблі — це все добре, коли йдеться про доставку вантажів, але майбутнє за небом. З кваліфікованими пілотами ми змогли б перелітати через Гімалаї та приземлятися в Юньнані, а це означає, що ніщо не зможе зупинити наші поставки."
 CHI_the_political_tutelage_dm:0 "Політична опіка"
 CHI_the_sky_cannot_have_two_suns_tt:0 "Кожен мілітарист у нашому альянсі, який також є комуністом:\n   Додасть: §Y-10.00%§! впливу на альянс"
 CHI_tu_yuming:0 "Ду Юмін"
 CHI_unify_the_admissions_process_desc:0 "Наша система вищої освіти розділена між кількома центрами, а процес подачі документів складний і роздроблений. Якщо ми реструктуризуємо процес у спільний вступний іспит, то зможемо гарантувати, що для кожного компетентного студента знайдеться місце."
 CHI_warlord_core_manchuria:0 "Інтеграція [FROM.GetName]"
 CHI_warlord_economic_support_reset_tt:0 " Пропонували §Yекономічну підтримку§! протягом останніх [?CHI_warlord_economic_support_flag:days_left|0] днів"
 CHI_warlord_leader_neutrality:0 "$CHI_neutrality$"
 CHI_yu_hanmou:0 "Ю Ханьмоу"
 CHL_a_new_empire_of_brazil:0 "Нова Бразильська імперія"
 CHL_attract_additional_french_investments_desc:0 "Французькі бізнесмени та промисловці, які спочатку відчули чудову можливість в експедиції Антуана до Чилі, тепер вражені його грандіозними подвигами, і їх легко переконати надати більше допомоги, пообіцявши землю в майбутньому."
 CHL_carlos_prats:0 "Карлос Пратс"
 CHL_conservative_party_in_power:0 "Консервативна партія"
 CHL_counter_operation_bolivar_desc:0 "Німеччина намагається вплинути на південноамериканські країни, використовуючи шпигунство та саботаж у своїй мерзенній операції «Болівар». Ми мусимо зробити все можливе, щоби протидіяти їхнім зусиллям."
 CHL_departamento_de_la_juventad_nacista:0 "Departamento de la Juventud Nacista"
 CHL_emilio_soto:0 "Еміліо Дароч Сото"
 CHL_endorse_the_constitution_desc:0 "У 1920-х роках ми пережили важку соціальну та економічну кризу, через яку старий керівний клас втратив свій престиж і до влади прийшов уряд Артуро Алессандрі. 1924 року його усунули від влади внаслідок перевороту, але в 1925 році він повернувся, після чого використав свою владу для розробки нової конституції на заміну Конституції 1833 року. Ми мусимо слідувати настановам його як засновника нового Чилі."
 CHL_establish_a_royal_guard_desc:0 "Жоден король не є повноцінним без свого великого війська слуг і охоронців, і, на жаль для Антуана III, йому не вистачало саме цього. Тому першочерговим завданням слід уважати якнайшвидше створити підрозділ королівської варти."
 CHL_expand_the_agricultural_field:0 "Розширити галузь сільгоспу"
 CHL_expand_the_department_of_provinces:0 "Збільшити відділ провінцій"
 CHL_guillermo_araya:0 "Гільєрмо Пауліно Іскіердо Арая"
 CHL_high_quality_nitrate_desc:0 "Хоча наша промисловість наразі не є найсильнішою, є ще одна річ, яка вирізняє нас із-поміж інших. Це велика кількість нітратів, і значна частина світового виробництва знаходиться в межах наших кордонів. Таким чином, ми можемо гарантувати, що тільки ми отримуємо доступ до матеріалу найвищої якості, тоді як ми продаємо менш очищену селітру."
 CHL_host_spanish_refugees:0 "Дати притулок іспанським біженцям"
 CHL_ibanez_as_prime_minister:0 "Прем'єр-міністр Ібаньєс"
 CHL_impose_new_taxes:0 "Запровадити нові податки"
 CHL_invite_french_aristocracy_desc:0 "Для боротьби з внутрішніми проблемами, пов'язаними з системою асьєнд і інкілінахе, ми мусимо залучити нову французьку аристократію та переробити систему управління дворянством країни."
 CHL_issue_bonds:0 "Заохотити купівлю облігацій"
 CHL_izquierda_communist_party_long:0 "Комуністична лівиця — Революційна робітнича партія"
 CHL_je_suis_le_deluge_desc:0 "Колись давно казали, що колись прийде потоп, і цей день настав. Ми — той потоп, який зруйнує занепалий світовий порядок і покладе початок новій ері!"
 CHL_la_federacion_araucania_desc:0 "Арауканська федерація на чолі з традиціоналістом мапуче Мануелем Абурто Пангілефом виступає категорично проти співпраці з сучасним чилійським суспільством, і її було б легко включити в наш рух за незалежність."
 CHL_laissez_faire_desc:0 "Ринок мусить функціонувати вільно, і лише уникнувши державного впливу на промисловість, наша економіка зможе відновитися."
 CHL_law_of_permanent_defense:0 "Постійна оборона"
 CHL_low_cost_housing_desc:0 "У нашій країні є багато переселенців або бідних, і ми мусимо зробити все можливе, щоб підтримати ці нещасні душі, які все ще залишаються людьми нашої нації. Тому ми мусимо створити національні житлові організації, а також зробити державною політикою побудову соціальних мереж, які можуть вловити будь-якого нещасного, що впав."
 CHL_luis_alamos_barros:0 "Луїс Аламос Баррос"
 CHL_nacista_decisions_desc:0 "Епоха лібералів і соціалістів закінчилася, і настав час нацистам залишити свій слід в історії та нав'язати свою політику."
 CHL_nacista_insurgency_decisions:0 "Нацисти"
 CHL_nacista_newpapers_propaganda_mission:0 "Пропаганда у Trabajo, Acción Chilena та Radio Difusión Santa Lucía"
 CHL_new_fatherland_DEF:0 "Патрія-Нуева"
 CHL_payment_for_aid:0 "Виплати за іноземну допомогу"
 CHL_pedro_aguirre_cerda:0 "Педро Агірре Серда"
 CHL_pedro_alfonso:0 "Педро Енріке Альфонсо"
 CHL_political_events.14.desc:0 "Націонал-соціалістичний рух Чилі здійснив спробу державного перевороту, але безрезультатно. Коли їх вигнали зі столиці, вони використали свою широку популярність, щоб оголосити війну нашому режиму, і тому у нас на руках громадянська війна, хоча й не в тих масштабах, яких дехто боявся б."
 CHL_political_events.28.b:0 "Ми розберемося з ними пізніше"
 CHL_political_events.31.t:0 "[FROM.GetName] вирішує не допомагати нам"
 CHL_political_events.43.desc:0 "Завдяки тиску, здійсненому [CHL.GetAdjective] урядом, нація [URG.GetNameDef] була змушена підкоритися нам, згідно з таємними колоніальними планами, розробленими в попередні роки. Це допоможе розширити наш вплив в Америці, а також допоможе нам утримати руки США подалі від Південної Америки."
 CHL_political_events.45.a:0 "Ми з радістю погодимося"
 CHL_political_events.60.a:0 "Рухатися, щоб окупувати територію"
 CHL_political_events.7.d:0 "До нашого відома дійшло, що є ті у військових, хто заплямував би його репутацію завжди залишатися аполітичним, відкрито критикуючи народ за їхній вибір президента, і чітко заявляючи, що соціалізм є за своєю суттю злом. Ці люди явно введені в оману, але ми повинні залишатися пильними, якщо хочемо, щоб черговий державний переворот був лише поганим кошмаром."
 CHL_political_events.79.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відгукнувся на наш заклик до зброї та пообіцяв надіслати нам зброю та добровольців, стільки, скільки зможе виправдати."
 CHL_political_events.93.t:0 "Король Ельдорадо"
 CHL_reintigrate_tacna_fascist:0 "Реінтегрувати Такну"
 CHL_released_inca_flag:0 "Інків звільнено"
 CHL_repeal_the_separation_of_church_an_state_desc:0 "Розкол між церквою та державою був великою помилкою, і його необхідно якомога швидше подолати. Церква є нашим союзником, як ми всі добре знаємо."
 CHL_requires_usa_states_tt:0 "Контролює всі §Yпідсвічені американські землі§!"
 CHL_satellite_kingdoms_tt:0 "Будуть відкриті рішення §YЗаснувати сателітні королівства§!, де також будуть опції заснувати держави §Y[INC.GetNameDef]§!, §Y[SUR.GetName]§! та §Y[HAI.GetName]§! як маріонетки, якщо ми контролюємо їхні історичні території."
 CHL_sociedad_caupolican_defensora_de_la_araucania:0 "Sociedad Caupolicán de la Araucanía"
 CHL_straight_line_party:0 "Пряма лінія"
 CHL_support_for_the_international_revolution:0 "Підтримати інтернаціональну революцію"
 CHL_undo_colonialist_occupations_tt:0 "Будуть відкриті рішення з §Yокупації Белізу та Панамського каналу§!."
 CHL_work_on_the_pan_american_highway_desc:0 "Під час різних панамериканських конференцій, проведених в останні роки, ми домовилися співпрацювати з нашими братами в Північній і Південній Америці, щоби допомогти сполучити два американські континенти та реалізувати цей проєкт Панамериканського шосе."
 CIP_communism:0 "Середньоіндійська комуна"
