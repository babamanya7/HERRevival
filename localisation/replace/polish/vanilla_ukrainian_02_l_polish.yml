 DEN_offer_protection_tt:0 "Буде відкрите рішення: §YЗапропонувати данський захист§!"
 DEN_overlord_category_desc:0 "Ми дозволили Данії зберегти певну незалежність як особливий протекторат. Однак ми маємо пильно стежити за ними, оскільки наш захист також передбачає певні зобов'язання."
 DEN_public_works:0 "Громадські роботи"
 DEN_rally_the_nation:0 "Згуртувати націю"
 DEN_rule_the_north_sea:0 "Влада над Північним морем"
 DEN_stockpile_oil_desc:0 "Ми повинні бути готові до найгіршого і почати готуватися до війни. Навіть якщо ми ніколи не побачимо бойових дій, великий конфлікт у нашому оточенні вплине на нас. Щоб мінімізувати цей вплив, ми повинні накопичити великі запаси стратегічних ресурсів."
