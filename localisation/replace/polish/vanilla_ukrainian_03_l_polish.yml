 form_sweden_hungary_category_desc:0 "Нехай у нас зі шведами не так багато спільного. Однак ми маємо факт єдиного королівського дому, і Карл Вільгельм має мрію встановити своє правління над власною Батьківщиною. Ми повинні втілити його мрію в реальність."
 found_own_faction_focus_desc:0 "Ми доклали чимало зусиль до створення Великої східноазійської сфери спільного процвітання. Щоб забезпечити собі довгострокову перемогу, Японія має стати одноосібним лідером як в Азії, так і за її межами."
