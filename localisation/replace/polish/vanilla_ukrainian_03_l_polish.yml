 ITA_end_fiat_ansaldo_duopoly_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$armor_research$: §G+15%§!\n$infantry_weapons_research$: §G+15%§!\n$artillery_research$: §G+15%§!\n$air_equipment_research$: §G+15%§!\n$naval_equipment_research$: §G+15%§!\n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-10.00%§!\n\n"
 ITA_ends_event_chain_tt:0 "§RСкінчує ланку подій.§!"
 ITA_ethiopian_war_logistics_desc:0 "Можливо, ми неправильно оцінили ситуацію з логістикою для нашого славетного завоювання Ефіопії. Ми мусимо зробити своєю першочерговою метою забезпечення наших хоробрих військ необхідними припасами."
 ITA_expand_the_royal_guard_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_cavalry_defence_factor$: §G+5.00%§!\n\n"
 ITA_export_midget_submarines_desc:0 "Прозорі води Середземного моря небезпечні для великих підводних човнів. Інші країни можуть бути зацікавлені в наших менших карликових субмаринах."
 ITA_export_midget_submarines_tt:0 "Збудує §Y5 карликових підводних човнів§! для держави §Y[FROM.GetFlag][FROM.GetNameDef]§!. Їхня збірка займе §Y[?ITA.ITA_export_midget_submarines_days] дн.§!"
 ITA_fortification_effort:0 "Розвиток укріплень"
 ITA_franco_italian_pact:0 "Підписати Франко-італійський пакт"
 ITA_german_military_cooperation:0 "$ITA_german_millitary_cooperation$"
 ITA_guardia_nazionale_repubblicana:0 "Guardia Nazionale Repubblicana"
 ITA_has_disbanded_blackshirts_tt_NOT:0 "НЕ: $ITA_has_disbanded_blackshirts_tt$"
 ITA_improve_the_industries_desc:0 "Із відновленою економікою ми тепер маємо ресурси, щоби звернути увагу на нашу промисловість і провести широкомасштабні реформи й там. Більш ефективна індустрія, безсумнівно, призведе до того, що більше техніки швидше потрапить до наших переможних сил."
 ITA_jet_fighter_equipment_2:0 "Reggiane Re.2008"
 ITA_la_battaglia_del_grano_desc:0 "Країна не може вважатися по-справжньому великою, якщо вона залежить від інших країн, які її годують. Якщо ми хочемо, щоби нас сприймали всерйоз, Італія мусить бути незалежною в основних продуктах харчування. Для цього ми мусимо боротися, і боротися так само наполегливо, як і в будь-якій іншій битві. Лише перемігши в битві за зерно, ми можемо сподіватися на перемогу у війні."
 ITA_legge_bottai_desc:0 "Римські мистецтво та культура є фундаментом усієї сучасної культури Європи. Ми ніколи не можемо дозволити, щоби ці історичні скарби були витіснені модернізмом. Хоча Італія завжди мусить дивитися в майбутнє, вона також ніколи не мусить забувати про своє минуле."
 ITA_liberate_the_workers_of_africa_desc:0 "Прийшов час раз і назавжди звільнити африканський народ від різних урядів, які його гноблять!"
 ITA_libyan_railway:0 "Лівійська залізниця"
 ITA_libyan_railway_desc:0 "Інвестиції в лівійську дорожню мережу, безумовно, цінні, але для широкомасштабного переміщення військ, ресурсів і вантажів необхідна сучасна залізнична мережа."
 ITA_litoranea_balbo_desc:0 "Дороги в Лівії жахливі. Навіть поблизу узбережжя мережа доріг просто не відповідає сучасній країні. Попереду ще багато роботи з її поліпшення, зокрема будівництво великої автомагістралі вздовж узбережжя."
 ITA_missiolini_occupy_dalmatia_occupation_effects:0 "\nЯкщо [ROOT.GetFlag][ROOT.GetNameDef] контролює область §Y[103.GetName]§!:\nКожна [YUG.GetFlag][YUG.GetAdjective]а осердна область під повним контролем держави [ROOT.GetFlag][ROOT.GetNameDef]:\n   Підпорядкування: §G+5.0%§!.\n   Спротив: §G-5.0%§!."
 ITA_missiolini_pacify_ethiopia_desc:0 "Дуче віддав наказ придушити абіссінську опозицію грубою силою та прийняти закони, щоби тримати населення під контролем. Він хоче якнайшвидше втихомирити всю країну і включити її в лоно Італії."
 ITA_multirole_aircraft_desc:0 "Розробляючи корпус літака, здатний виконувати різні ролі в бою, ми можемо досягти значного скорочення виробничих витрат і часу на вишкіл екіпажу. Ми негайно долучимо наших інженерів до роботи над створенням таких універсальних корпусів."
 ITA_new_ricostruzione_industriale_mechanized:0 "$ITA_new_ricostruzione_industriale$ (мехапіхота)"
 ITA_portugal_friend_desc:0 "Португалія, як і Іспанія, є природним союзником італійського народу. Ми мусимо зміцнити наші дружні стосунки."
 ITA_preserve_army_traditions_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_ARMY_ORG$: §G+5.0%§!\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+5.0%§!\n$modifier_army_sub_unit_infantry_defence_factor$: §G+5.00%§!\n\n"
 ITA_rds_overlord_tt:0 "Ми станемо суб'єктом держави §Y[?ITA_rds_overlord.GetFlag][?ITA_rds_overlord.GetNameDef]§!."
 ITA_regia_aeronautica_name_default:0 "$ITA_regia_aeronautica_dynamic_modifier$"
 ITA_reorganize_irregulars:0 "Реорганізація нерегулярних груп"
 ITA_south_american_alliances:0 "Південноамериканські альянси"
 ITA_super_heavy_tank_equipment_1_short:0 "Il Duce"
 ITA_the_catholic_dominion:0 "Католицький домініон"
 ITA_the_italian_liberation_war_desc:0 "Прийшов час повстати проти фашистів і повалити їхній хворий режим! Антифашистські партизани з усієї Італії готові боротися та віддати своє життя в цій національно-визвольній війні!"
 ITA_train_irregulars_cd_tt:0 "\nЦе рішення буде знову доступне через §Y[?ITA_colonial_management_cd] дн.§!\n"
