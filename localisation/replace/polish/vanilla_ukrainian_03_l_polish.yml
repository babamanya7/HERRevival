 604_qinghai_points:0 "([?604.state_political_support_value|+0]) "
 6_month_timer_mughal_tt:0 "У нас буде §Y255§! днів, щоб виграти цю війну, перш ніж адміністрація, що передає владу, запропонує припинення вогню."
 AAT_Sweden.1.c:0 "Очевидно, що опозиційна партія праворуч."
 AAT_Sweden.29.a:0 "Ми їм покажемо."
 AAT_Sweden.3.c:0 "[AAT_Sweden_3_c_loc]"
 AAT_Sweden.48.b:0 "$AAT_Sweden.47.a$"
 AAT_Sweden_communism.5.t:0 "Організаторів викрито"
 AAT_Sweden_flashpoints.31.a:0 "Виживання важливіше за нейтралітет."
 AAT_Sweden_flashpoints.52.t:0 "Вибух масових протестів і насилля через арешти лівих"
 AAT_Sweden_flashpoints.75.desc:0 "[ENG.GetAdjectiveCap]ий уряд уперто відмовляється повертати наші інтерновані кораблі. Схоже, що єдиний спосіб повернути ці судна — це боротися за них."
 AAT_Sweden_flashpoints.83.a:0 "Вони мало того хотіли."
 AAT_Sweden_nationalists.20.desc:0 "Наш лояльний суб'єкт, [FROM.GetName], звертається до нас з проханням розширити його повноваження, надавши йому території на півночі колишньої країни на ім'я [SOV.GetName]. Це дозволить нам полегшити тягар окупації для наших підданих та зосередити наші зусилля на боротьбі з великим ворогом."
 AAT_Sweden_nationalists.8.t:0 "Аристократія пропонує підтримку"
 AAT_Sweden_strike.2.desc:0 "На жаль, наші зусилля зупинити протести не увінчалися успіхом. Майже кожен заводський робітник, швачка і деревообробник, здається, вийшов на вулиці, протестуючи проти політики уряду. Що ще гірше, жорстокість проявляється на протестах. Страждають як цивільні, так і правоохоронці."
 AAT_USA_events.03.b:0 "Насправді, ми передумали."
 AAT_USA_events.04.desc:0 "[FROM.GetLeader] від [FROM.GetNameDef] відхилив наш запит, стверджуючи, що після референдуму народ Фарерських островів явно не хоче бути під владою нікого іншого, окрім [FROM.GetAdjective]ого уряду."
 AAT_USA_events.08.desc:0 "[FROM.GetLeader] від держави [FROM.GetNameDef] надіслав нам запит на повернення незаконно утримуваної данської території її законному власнику."
 AAT_britain_narvik.1.desc:0 "Ми успішно підірвали [SWE.GetAdjective] шахти та позбавили державу [GER.GetNameDef] одного з найважливіших ресурсів для імпорту. Попри обіцянку допомоги державі [FIN.GetName], яка була головним мотивом для цього, ми ніколи не мали наміру вступати у прямий конфлікт з державою [SOV.GetNameDef], і ми завдали серйозного удару по нашому головному супротивникові. У нас немає реального ворога у вигляді держави [SWE.GetNameDefCap], і тепер нам потрібно вирішити, що робити далі."
 AAT_finland_continuation_war.13.a:0 "Добре, але тільки якщо нам нададуть компенсацію"
 AAT_finland_diplomacy.25.desc:0 "[FROM.GetAdjective]ий уряд відхилив наше прохання про захист від [SOV.GetAdjective]ої агресії. Оскільки трапився найгірший сценарій, ми повинні якомога ретельніше готуватися до оборони."
 AAT_finland_kinship_war.06.a:0 "Треба відправити їм людей і матеріальне забезпечення"
 AAT_finland_misc_events.01.t:0 "Евакуація дітей"
 AAT_finland_misc_events.07.t:0 "[FROM.GetAdjective]а дослідницька програма"
 AAT_finland_political.04.t:0 "[ROOT.GetLeader] помирає"
 AAT_finland_winter_war.03.a:0 "У нас немає іншого вибору, окрім як визнати поразку..."
 AAT_finland_winter_war.04.desc:0 "Вони погодилися на умови миру! Народ на вулицях святкує перемогу. [FROM.GetAdjective]і війська вже почали залишати нашу територію, безславно повертаючись додому. Цей день — день гордості нації, але розслаблятися не можна, адже в траві кругом ще багато змій."
 AAT_germany.3.desc:0 "Держава [FROM.GetName] погодилася на нашу угоду, яка, безсумнівно, буде вигідною для обох сторін. Сподіваємося, що за цією вигідною угодою послідують і інші."
 AAT_nordic_cooperation.1.t:0 "Держава [FROM.GetNameDef] перетнула межу!"
 AAT_nordic_cooperation.8.desc:0 "Нам щойно повідомили, що [FROM.GetAdjective]і лідери погодилися на нашу взаємовигідну угоду. Це буде чудово як для наших економік, так і для Нордичного регіону в цілому."
 AAT_norway.14.desc:0 "Відкун Квіслінг, який роками був найбільшим прихильником фашизму в державі [NOR.GetNonIdeologyName], запропонував свою допомогу в нашому вторгненні на його батьківщину.\n\nВін хоче здійснити державний переворот в Осло за нашої підтримки і встановити режим, дружній до держави [ROOT.GetNameDef]. Після цього він прокладе шлях для нашого вторгнення і легітимізує [ROOT.GetAdjective]у окупацію держави [NOR.GetName]."
 AAT_norway.2.a:0 "Це найліпше, що ми наразі можемо зробити."
 AAT_norway.9.a:0 "Попереду тільки мир і стабільність!"
 AAT_norway_communist.4.t:0 "[FROM.GetName] хоче, щоби ми допомогли їм розвинути свою військову промисловість"
 AAT_norway_communist.5.a:0 "Ми застосуємо цю зброю для боротьби з нашими спільними ворогами!"
 AAT_norway_communist.8.b:0 "Вони можуть залишитися, але їм тут не раді."
 AAT_norway_news.2.a:0 "Втрата для нас усіх."
 AAT_norway_rikstanken.7.desc:0 "Держава [FROM.GetName], наш сусід, погодилася на продаж першого танка державі [ROOT.GetName]. Звісно, в нього не так багато броні, та й башти немає, але з деякими доробками він може стати початком [ROOT.GetAdjective]их танкових військ."
