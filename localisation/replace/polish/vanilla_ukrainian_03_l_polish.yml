 EST_SOV_communism_autonomy_integrated_puppet:0 "Естонська РСР"
 EST_convert_FIN_cat_desc:0 "[FIN.GetFascistParty] вже давно має тісні зв'язки з партією [EST.GetFascistParty], і тепер, коли ми заявили про панування над нашою власною нацією, ми повинні дати можливість фінським ветеранам взяти верх над своєю нацією."
 EST_events.10.t:0 "Питання про інтервенцію"
 EST_events.5.a:0 "[From.GetLeader] is nothing but a blowhard."
 EST_events.701.t:0 "[Root.GetLeader] відступає"
 EST_join_the_axis_desc:0 "Тепер, коли ми запевнили німців у своїх намірах, ми переконані, що вхід Естонії до країн Осі абсолютно виправданий."
 EST_long_push_east:0 "Довгий похід"
 EST_prepare_for_the_inevitable:0 "Підготуватися до неминучого"
 EST_prepare_underground_resistance_desc:0 "Основні заводи по всій державі [Root.GetNonIdeologyName] закриваються і захоплюються ворогами, і тому нам дуже важливо шукати спорядження та інвестиції в індустрію за кордоном, щоб як і раніше виробляти зброю для сил."
 EST_support_independent_militaries_desc:0 "По всій країні незалежні військові формування прагнуть кинутися в бій, щоби знову захистити Естонію від іноземного імперіалізму, але надлишок хоробрості не скасовує нестачу ресурсів. Ми мусимо забезпечити всіх солдатів, як з державної армії, так і поза нею, ресурсами, необхідними для захисту нашої нації."
 EST_veterans_government_desc:0 "Попередній кабінет міністрів був слабкий і діяв за вказівкою Константіна Пятса. Нам потрібен новий кабінет міністрів, які співчувають справі вапсів."
 ESU_POR_unified_democratic_DEF:0 "Сполучені республіки Іберії"
 ESU_POR_unified_fascism_ADJ:0 "Іберійськ"
 ETH_BoP_expand_red_guards:0 "Збільшити кількість дивізій Червоної гвардії"
 ETH_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3:0 "Фітаурарі"
 ETH_airbase_name:0 "Дебре-Зеїт"
 ETH_amedeos_feast_of_maskal:0 "Мескельський бенкет Амедео"
 ETH_an_empire_in_the_shade_of_the_sun_desc:0 "Його Величність [ETH.GetLeader] — імператор без імперії. Це не тільки принизливо для нашого імператора, але й обмежує нашу здатність вживати заходів щодо звільнення [ETH.GetName]. Можливо, наші друзі в [JAP.Capital.GetCapitalVictoryPointName] захочуть передати нам контроль над островом, щоби ми могли використовувати його як базу операцій для остаточного звільнення нашої батьківщини."
 ETH_arm_resistance_decision:0 "Озброїти анти[FROM.OWNER.GetAdjective]ий спротив у області [FROM.GetName]"
 ETH_balance_range:0 "Політична рівновага"
 ETH_chitet_category_desc:0 "Оголошення національної мобілізації дає державі доступ до великої кількості військ дуже швидко. Це ополчення добре служило країні протягом століть. Коли війна закінчиться, їх усіх можна буде відправити додому, до мирного життя."
 ETH_communal_agriculture:0 "Комунальний сільгосп"
 ETH_core_906:0 "Інтегрувати область [906.GetName] в імперію"
 ETH_encourage_local_development_desc:0 "Ніхто не може повністю передбачити потреби всієї економіки, і небезпечно прикидатися іншим. Залишимо регіони розвиватися, як вони вважають за потрібне. Адже місцевий політичний естеблішмент та бізнес найкраще знатимуть, що потрібно в їхніх регіонах."
 ETH_events.1.a:0 "Підписати договір."
 ETH_expand_the_mehal_sefari_tt:0 "Змінити §Y[GetEthiopianArmySpiritName]§! на:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+25%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!"
 ETH_freedom_at_gunpoint:0 "Свобода під прицілом"
 ETH_improve_the_horn_of_africa_category_desc:0 "Покращуючи інфраструктуру в сусідніх країнах, ми можемо зробити регіон сильнішим і тісніше зв'язати країни Африканського Рогу."
 ETH_international_mediation:0 "Міжнародне посередництво"
 ETH_liberate_KEN:0 "Звільнити державу [KEN.GetName]"
 ETH_mesafint_total_control_range_state_modifiers_tt:0 "\n§YОбласні модифікатори:§!\n$MODIFIER_LOCAL_BUILDING_SLOTS_FACTOR$: §R-25%§!\n$modifier_production_speed_infrastructure_factor$: §R-20%§!\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §R-20%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+20%§!\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+20%§!\n$MODIFIER_RECRUITABLE_POPULATION_FACTOR$: §R-25%§!\n$MODIFIER_ARMY_SPEED_FACTOR$: §G+10%§!"
