 ENG_battleship_4_desc:0 "Лінкор типу «Vanguard» був останнім лінкором, побудованим для Королівського флоту. Було замовлено один корабель, але розглядалося ще чотири для тихоокеанського театру. Будівництво, замовлене згідно з Програмою надзвичайної війни 1940 року, не набуло великого пріоритету і було завершено після війни. Цей клас мав гладкий корпус, що забезпечувало відмінну стійкість і морехідність. Озброєння таке ж, як у лінкорів класу «Queen Elizabeth» і «Revenge», забезпечуючи значну вогневу міць. Потужні двигуни і хороша броня зробили судно швидким і добре захищеним."
 ENG_benelux_intervention_USA:0 "Бенілюкська інтервенція"
 ENG_carrier_3_desc:0 "Клас «Illustrious» був розроблений в рамках обмежень Другого Лондонського військово-морського договору 1936 року, який обмежив розмір носія верхньою межею в 23 000 тонн. Він був першим британським авіаносцем, який мав броньовану пілотну палубу, що зменшило розмір його авіагрупи. Важка броня та зенітна зброя забезпечували міцний захист кораблів, а потужні двигуни та великий запас палива забезпечували кораблям велику дальність дії."
