 pakistan_RU_Prep:0 "Пакистані"
 pan_americanism_goal_desc:0 "Уся Америка має бути об'єднана. Залучивши всіх, ми зможемо захистити нашу частину світу та створити єдиний фронт проти будь-яких зовнішніх сил."
