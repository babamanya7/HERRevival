 CZE_raiding_focus:0 "Акцент на рейди конвоїв"
 CZE_rocket_artillery_equipment_2:0 "13 cm RKP 2"
 CZE_semi_constitutional_monarchy_desc:0 "Тепер, коли монарх обраний, настав час внести зміни до конституції. Хоча дехто виступає за централізацію влади, щоб уникнути міжусобиць у ці неспокійні часи, зрозуміло, що монарх не може робити все сам. Тому, можливо, найкраще частково зберегти нинішню систему для допомоги в управлінні країною, водночас маючи монарха, який направлятиме її."
 CZE_skoda_select_little_entente_group:0 "Продати зброю партнерам по Малій Антанті"
