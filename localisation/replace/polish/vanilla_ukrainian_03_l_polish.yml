 HINT_LOGISTICS_TEXT_2:0 "Оснащення розподіляється зі £GFX_capital_hub_texticon §Yстоличного центру постачання§! та доставляється £GFX_train_texticon §Yпотягами§! або £GFX_convoy_texticon §Yконвоями§! на £GFX_supply_hub_texticon §Yцентри постачання§! або £GFX_naval_supply_hub_texticon §Yморські бази§! в різних провінціях.\n\nЗвідти доставлене оснащення розподіляється між дивізіями в діапазоні центру постачання. Ви можете переглянути діапазон, обравши £GFX_supply_hub_texticon §Yцентр постачання§! та затиснувши £GFX_shift£. На діапазон може вплинути моторизація, яка використовує £GFX_unit_motorized_icon_small §Yвантажівки§!.\n\nНа ефективність постачання впливають рівень £GFX_railways_texticon §Yзалізниць§! і £GFX_naval_supply_hub_texticon §Yморських баз§!, нестача £GFX_train_texticon §Yпоїздів§! і ворожі авіанальоти. Все це створює §Rвузькі місця§!, вплив яких можна зменшити, поліпшуючи залізниці, які ведуть до столичного центру постачання, надаючи повітряний захист винищувачами та досяючи достатньої кількості поїздів. Доступність постачання показана в режимі мапи §YПостачання§!  £GFX_F4£ ."
 HOA_countryleader_desc:0 "[ROOT.GetLeader] — єдина людина, яка може утримати націю разом у ці важкі часи, тому люди повинні об'єднатися навколо [ROOT.GetLeader.GetHerHim]."
 HOA_push_for_the_highlands_desc:0 "Економічний центр Східної Африки лежить у високогір'ї. Захист для [ROOT.GetNameDef] значною мірою допоможе розширити наш економічний потенціал."
 HOA_securing_the_adjective_future_desc:0 "[ROOT.GetNameDefCap] — це маленька держава, у якої дуже мало друзів на світовій арені. Зміна цього значною мірою допоможе забезпечити нашу майбутню свободу та незалежність."
 HOL_air_cover_for_the_new_fleet_desc:0 "Якщо ми інвестуємо у великі лінійні крейсери, то ми також повинні забезпечити для них належне повітряне прикриття, щоб кораблі не були розтрачені. Розглянемо конструкцію авіаносця."
 HOL_combined_chiefs_of_staff_representation:0 "Представництво в Об'єднаному комітеті начальників штабів"
 HOL_cruiser_ship_engine_1:0 "«Parsons» 56 000 к. с. н. в."
 HOL_domestic_jet_engine_designs_desc:0 "Слід заохочувати наших інноваційних авіабудівників експериментувати з футуристичними конструкціями. Хоча результатом може бути не відразу функціональний літак з реактивним двигуном, це, безсумнівно, призведе до поліпшення виробництва літаків загалом."
