 CHI_sik_integration_cost:0 "Зменшує вартість інтеграції для [SIK.GetNameDef] на §G[?sik_integration_cost_reduction|%G0]§!"
 CHI_small_arms_expertise_desc:0 "Основною силою армії досі є індивідуальна стрілецька зброя. Потрібно зосередити наші скромні ресурси на тому, щоб йти в цій галузі в ногу з часом."
 CHI_socialize_major_industries:0 "Націоналізувати основні галузі промисловості"
 CHI_strengthening_our_resolve:0 "Зміцнення нашої рішучості"
 CHI_take_a_stance_on_illicit_trade:0 "Зайняти позицію щодо незаконної торгівлі"
 CHI_take_control_of_the_executive_yuan_tt:0 "Коли нового мілітариста перетворено на маріонетку, кожна існуюча маріонетка-мілітарист отримає: §Y[?executive_yuan_autonomy_ratio|%]§! співвідношення автономії"
 CHI_the_hump_desc:0 "Поставки повітрям через Гімалаї не можуть повністю замінити інші транспортні канали, але й завадити їм набагато складніше."
 CHI_tsr_legacy_of_the_hongxian_emperor:0 "Спадщина імператора Хунсянь"
 CHI_tsr_reestablish_the_beiyang_army:0 "Відновити Бейянську армію"
 CHI_turn_a_blind_eye_desc:0 "Можна визнати, що деяка неофіційна торгівля мала згубний вплив на структуру китайського суспільства. Однак прибутки від цієї торгівлі не можна заперечувати, і якби ми залишили все як є, ми могли б отримати велике багатство."
 CHI_utilise_the_terrain_desc:0 "Наші дивізії не оснащені новітнім обладнанням і не мають єдиного стандарту підготовки, але якщо є щось, що ми знаємо глибоко, то це наші власні землі. Ми можемо використовувати кожен водний шлях, пагорб і поле на свою користь, і таким чином перетворити досвід будь-кого, хто наважиться вторгнутися, на справжнє пекло."
 CHI_war_of_resistance_desc:0 "Ми поки що не готові до повномасштабної війни з японцями. Ми чинитимемо опір загарбникам, поки не видасться вдалий момент для контратаки."
 CHI_warlord_autonomy_allocate_lend_lease_decision:0 "Виділити ленд-ліз для §Y[FROM.GetName]§!"
 CHI_warlord_autonomy_offer_economic_support_decision:0 "Запропонувати §Yекономічну підтримку§! §Y[FROM.GetName]§!"
 CHI_weaponise_the_faithful:0 "Озброїти вірних"
 CHL:0 "Чилі"
 CHL_align_the_police:0 "Зблизитися зі Слідчою поліцією"
 CHL_an_attempt_to_maintain_our_neutrality_desc:0 "Багато різних країн, які беруть участь у світових конфліктах, хочуть втягнути нас у війну, яка складається з їхніх безглуздих суперечок. Ми мусимо робити все в наших силах, щоби триматися подалі від їхнього конфлікту і не пхати свого носа в конфлікт, частиною якого ми не мусимо бути."
 CHL_dispute_over_tierra_del_fuego_tt:0 "Це може привести до §Rвійни§! з власником Вогняної Землі."
 CHL_enforce_the_chilean_identity_tt:0 "Коли національний дух §Y$CHL_ancestral_mapuche_resistance$§! буде видалено, [950.GetName] знову стане осердною землею."
 CHL_enter_patagonia_desc:0 "Якщо аргентинці повірили нам бодай на секунду, це є доказом того, що ми їх надурили та злякали. Настав час нашим військам увійти в Патагонію та завдати сильного удару ще до того, як вони зрозуміють, що по них ударили."
 CHL_expand_mining_prospection_tt:0 "Додає виробництво §Y4 од.£resources_strip|5 §Yсталі§!, £resources_strip|6 §Yхрому§!, £resources_strip|4 §Yвольфраму§! або £resources_strip|2 §Yалюмінію§!§! в кожній осердній області, яка вже надає один із цих ресурсів.\nПоточні ефекти:"
 CHL_invite_french_aristocracy:0 "Запросити французьку аристократія"
 CHL_invite_peter_adolf_ceasar_to_chile_tt:0 "§Y$CHL_peter_hansen$§! стає генералом."
 CHL_mapuche_liberate_charrua:0 "Визволити [CHR.GetAdjective]ий народ"
 CHL_mapuche_liberate_inuit:0 "Визволити [INU.GetAdjective]ий народ"
 CHL_mapuche_state_neutrality:0 "Держава мапуче"
 CHL_nacistas_approaching_foreign_fascists_mission:0 "Нацисти підступають до іноземних фашистських рухів"
 CHL_political_events.11.desc:0 "[GER.GetLeader] приніс офіційні вибачення, як би це не було малоймовірно, а також погодився надати економічну компенсацію в обмін на корабель, а також на життя, втрачені для Чилі в інциденті з «SS Tolten»."
 CHL_political_events.13.desc:0 "Націонал-соціалістичний рух Чилі здійснив спробу державного перевороту, але безрезультатно. Наші карабінери придушили їхнє повстання з обмеженими жертвами, що виникли внаслідок перестрілки та протистояння біля окупованого Чилійського університету. Оскар Новоа Фуентес та Умберто Арріагада Вальдів'єсо командували нашими силами під час битви та будуть адекватно винагороджені."
 CHL_political_events.29.b:0 "Вони не потребують нашої допомоги"
 CHL_political_events.30.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] пообіцяв допомогти нам у наших зусиллях здійснити переворот проти нинішнього уряду та встановити диктатуру, яка зможе протистояти американцям."
 CHL_political_events.61.b:0 "Навіщо нам це робити?"
 CHL_political_events.64.t:0 "[From.GetAdjective] захоплення Панамського каналу"
 CHL_political_events.66.t:0 "[CHL.GetName] вимагає контролю над нашими гвіанськими територіями"
 CHL_political_events.77.desc:0 "[PRU.GetLeader] заявив, що нація [PRU.GetName] ніколи не прийме нашої пропозиції продати їм Аріку, оскільки вона має повернутися до них без оплати, стверджуючи, що наше захоплення регіону після Тихоокеанської війни було несправедливим та незаконним."
 CHL_political_events.81.b:0 "Вони нам не потрібні!"
 CHL_reapproach_america_desc:0 "США розірвали багато зв'язків з нами, коли почалася Велика депресія, і наші відносини ще не є остаточно вирішеними. Тому Президент і Конгрес мусять докласти спільних зусиль для якнайшвидшого відновлення відносин з ними."
 CHL_recruit_young_officers_tt:0 "Певних молодих офіцерів буде підвищено до §Yгенералів§!."
 CHL_releases_bra_tt:0 "Необхідні землі буде передано підлеглій §Yреорганізованій Бразилії§!."
 CHL_socialist_youth_desc:0 "Серед молоді є багато радикально налаштованих лівих і правих. Соціалісти, зокрема, досить голосно і пристрасно захищають свої цінності, а тому готові боротися проти будь-кого, хто загрожує нашій великій державі."
 CHL_sponsor_american_revolutions_desc:0 "Є багато людей, які можуть досягти успіху в революції, якщо постараються, але у них немає коштів або зброї, аби зробити так, щоби засоби відповідали меті. Тому ми мусимо підтримати таких революціонерів і вигнати капіталізм з Південної Америки."
 CHL_strengthen_instituto_nacional:0 "Зміцнити Instituto Nacional"
 CHL_support_the_democracies_desc:0 "Демократичні режими в Європі та Америці перебувають у скруті, і наш обов'язок як демократичної нації — допомогти їм у цій ситуації будь-якими можливими способами. Тому ми мусимо відправити чилійців захищати інтереси наших сусідів-демократів."
 CHL_the_popular_freedom_alliance_desc:0 "У країні є люди, які поділяють наші ідеали, але не наважуються відкрито заявити про це. Тому ми мусимо переконати генерала Карлоса Ібаньєса дель Кампо очолити нову коаліцію — Альянс народної свободи, який апелює до консервативних цінностей, але таємно підтримує нас."
 CHL_unify_the_fascist_movements_desc:0 "Хоча Хорхе Гонсалес фон Мареес міцно контролює Націонал-соціалістичний рух Чилі, є й інші групи зі схожими ідеями, які не слідують за ним. Слід наполягати на тому, що він мусить очолити авангардистський «рух-парасольку» для чилійських фашистів, щоби переворот увінчався успіхом."
 CHR_communism:0 "Колективний оборонний союз народів чарруа та гуарані"
 CHU_SOV_communism_subject_ADJ:0 "Чуваськ"
 CIVIL_WAR_NAME:0 "$ORDER$$SECOND$а громадянська війна"
 COG_belgian_congo_neutrality_DEF:0 "Бельгійське Конго"
 COG_congo_and_the_war_in_europe:0 "Конго та війна в Європі"
 COG_congo_stanleyville_neutrality_DEF:0 "Конго-Стенлівіль"
 COG_days_left_for_rebellion_tt:0 "Поточні дні: [?COG_time_until_annex_angola_rebellion:days|Y0]"
 COG_force_arienne_congolaise_desc:0 "Щоб належним чином тримати крок з нашими ворогами, ми повинні реорганізувати наші авіакрила та створити окремий підрозділ авіації в нашій новоствореній армії."
 COG_great_military_chiefs_desc:0 "Те, що виділяло нас у минулому, це наші великі військові командири. Ми повинні запровадити суворі тренувальні програми, щоб наші нинішні командири могли досягти рівня командирів минулого."
 COG_has_active_liberation_goal:0 "Має активну Ціль Війни на Визволення"
 COG_invested_into_industry_in_state_flag:0 "Місцева індустрія отримала фінансову допомогу"
 COG_liberation_by_force_desc:0 "Народи Африки не мають достатньої сили для того, щоб звільнити себе самі. Ми повинні прагнути визволити їх від їхніх гнобителів, щоб вони знову змогли пізнати свободу, як це було колись."
 COG_mittelafrikan_kingdom_fascism:0 "Королівство Міттельафрика"
 COG_nationalization_of_foreign_industrial_assets_desc:0 "Протягом нашої історії багато іноземних компаній і корпорацій приїжджали до нашої країни, щоб експлуатувати наші ресурси та людей. Ми повинні націоналізувати ці галузі та зробити їх частиною нашого економічного простору."
 COG_occupy_cabinda:0 "Окупувати Кабінду"
 COG_pro_independence_reforms_in_the_force_publique_structure:0 "Реформи на підтримку незалежності в структурі Force Publique"
 COG_reestablish_the_bouvandji_desc:0 "У 11 столітті Буванджі були братством ковалів з народу Войо. Вони володіли майстерністю у вогні та залізі, і завоювали державу Нгою, що підкорила нас. Однак з нашою перемогою в останні роки, можливо, настав час скористатися їхніми вміннями на свою користь."
 COG_ruanda_urundi_decisions_desc:0 "Мандат, який Бельгія отримала після Великої війни під керівництвом Юджина Юнгерса, дозрів до розширення та інвестицій. Можливо, було б розумно звернути увагу на цей регіон."
 COG_shatter_the_roof_desc:0 "Час настав, щоб зламати невидимий дах, який був завжди присутній над головами багатьох наших людей, і нарешті дозволити їм відчути свободу вибору, як вони хочуть жити!"
 COG_transport_plane_equipment_3_short:0 "DC-3"
 COLLECTION_FACTION_BALKAN_STATES:0 "Балканські області"
 COLLECTION_STATES_IN_AMERICAS:0 "Усі області в Північній і Південній Америках"
 COLLECTION_STATES_MY_CONTINENT:0 "Області на континенті [ROOT.GetCountryContinent]"
 COMBAT_LOG_COMBATS_WON_DETAILED_DESC:0 "Виграно битв: $WON|H$\nУсього битв: $TOTAL|H$"
 COMBAT_LOG_PERIOD_DESC:0 "Дані за $TIME$"
 COMBAT_PROGRESS_DESC:0 "Показує поточний баланс сил між нападником і захисником цієї битви."
 COMMAND_POWER_DESC:0 "§HКомандна влада§! використовується для проведення певних бойових операцій і підвищення генералів. Її можна витрачати на одноразові операції або виділяти для підтримки тривалих операцій. Приріст і максимум §Hкомандної влади§! можна збільшувати з допомогою різних доктрин і національних ідей."
