 OPERATION_OUTLOOK_DESC:0 "Перспективи операції визначаються двома чинниками.\n§HРизик§! позначає ймовірність арешту або вбивства одного з ваших агентів після завершення операції.\n§HБонусний результат§! дає вашим агентам шанс досягти додаткового ефекту або іншої нагороди на додаток до звичайних."
