 PHI_modernization:0 "Модернізація"
 PHI_philippine_naval_patrol_desc:0 "Щоб бути належним чином визнаним на міжнародній арені, особливо як нація, що складається з безлічі островів, наш флот повинен бути справді здатним захищати наші береги. Щоб виростити його до такого розміру та можливостей, ми повинні прагнути вдосконалити та оновити наші системи командування та управління відповідно до тих, що очікуються від сучасного флоту."
 PHI_polynesia_tag_neutrality_DEF:0 "Австронезійська співдружність"
 PHI_reino_de_filipinas_tag_war_neutrality_DEF:0 "$PHI_reino_de_filipinas_tag_neutrality_DEF$"
 PHI_san_miguel_desc:0 "Заснована за Іспанською королівською хартією в 1890 році, броварня «Сан-Мігель» відтоді виробляє винятковий лагер у німецькому стилі. Тепер, коли наше населення стає все більш заможним, а світовий попит зростає, ми повинні намагатися розширити цю відому установу напоїв. Вип'ємо за кращий світ!"
 PHI_second_republic_tag_war_communism_ADJ:0 "$PHI_second_republic_tag_communism_ADJ$"
 PHI_the_concrete_battleship:0 "Бетонний лінкор"
 PHI_the_red_sun_over_manila_desc:0 "Комуністичні настрої зростають на Філіппінах, і вперше з'явилася примарна можливість захопити реальну владу. Невдале повстання сакдалістів слугує нагадуванням про марність збройного заколоту проти підтримуваного американцями уряду, тому натомість ми повинні шукати більш політичні засоби для захоплення влади."
 PHI_the_sun_has_set_desc:0 "Британці довго були загрозою для Сполучених Шта... для Філіппін. Ми розбили їх у 1779 році, і вони нам цього так і не пробачили. Настав час нагадати їм про їхнє місце у світі."
 PHI_utang_na_loob_desc:0 "«Утанг на лооб» (Utang na loob) — це філіппінська культурна цінність, що перекладається як «борг вдячності» або «борг внутрішнього я». Вона означає глибоке емоційне та моральне зобов'язання відплатити тому, хто надав значну допомогу, особливо в скрутні часи. Це почуття взаємності зазвичай виражається через вчинки служіння, підтримки або вірності."
 PHI_war_plan_rainbow_five_desc:0 "Тепер, коли нашу власну безпеку належним чином розглянуто, ми можемо почати звертати увагу на ширшу війну та краще визначити наше належне місце в ній. Ми можемо багато запропонувати військовим зусиллям, і ми повинні переконатися, що вкладаємо це туди, де це найбільше потрібно."
