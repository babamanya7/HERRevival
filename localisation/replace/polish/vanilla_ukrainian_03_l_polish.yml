 MUN_czech.news.2.a:0 "Карпатська що?"
 MUN_czech.news.2.c:0 "Ідіть, якщо наважитесь!"
 MUN_czech_exile.1.d:0 "Після того, як [GER.GetNameDef] ліквідувала їхню країну внаслідок Мюнхенської конференції, [CZE.GetAdjective]і вигнанці прибули до багатьох країн, зокрема й до нашої. Вони готові взяти до рук зброю, щоб допомогти нам, роблячи це з надією, що одного дня зможуть визволити свою країну за нашої допомоги."
 MUN_slovakia_little_war.3.t:0 "Прикордонне зіткнення в регіоні [71.Getname]"
 MUN_the_fall_of_the_republic.1.d:0 "Нещодавнє рішення [ROOT.GetLeader] відмовитися від Судетської області призвело до спалаху протестів по всій країні. Хоча політичне та військове керівництво прагнуло уникнути кровопролиття у, як вони вважали, безглуздому опорі в умовах непереборної сили, багато хто в країні відчув, що вони прийняли хибне рішення. Деякі політичні рухи зараз намагаються скористатися цими заворушеннями для досягнення власних цілей."
