 CZE_the_tvp_project_desc:0 "Наша армія запропонувала програму Танка загального призначення (TVP) для розробки вітчизняного проєкту танка. Деякі з наших виробників, які мають значний досвід у виробництві танків, виявили інтерес до нашого проєкту."
