 IRQ_hashemite_arab_federation_democratic:0 "Об'єднана Арабська Федерація"
 IRQ_increase_prime_ministers_powers_desc:0 "Доведено, що іракський народ не бажає абсолютного правління під Гашімітською династією, і тому нам відкрилася можливість раз і назавжди закріпити конституційний характер їхнього правління та спрямувати Ірак на більш західний шлях."
 IRQ_kurdish_outreach:0 "Курдська інформаційно-роз'яснювальна робота"
 IRQ_kurdistan_tag_neutrality:0 "Королівство Курдистан"
 IRQ_naval_air_support_desc:0 "Це дурість — вірити, що ми зможемо розробити флот, здатний протистояти великим державам. Однак розробка літаків, які можуть націлюватися на військово-морські об'єкти, може вирівняти шанси за частку вартості одного корабля."
 IRQ_political_events.23.t:0 "[ENG.GetNameDefCap] погоджується на передачу"
 IRQ_political_events.29.desc:0 "[FROM.GetNameDefCap] рішуче відхилив нашу пропозицію про членство у федерації. Вони наполягають, що ніколи не приймуть такої домовленості через занепокоєння щодо впливу на їхню країну."
 IRQ_political_events.34.desc:0 "Через безліч ускладнень, [FROM.GetNameDef] відхилив наш план взяти на себе відповідальність за [553.GetName]. Незважаючи на те, що ми запропонували варіант, який дозволив би [ENG.GetAdjective] мирно вийти з регіону, вони натомість вирішили продовжувати свою криваву та дорогу окупацію території незалежно від ціни."
 IRQ_political_events.35.t:0 "Адміністрація [FROM.GetNameDef] відхиляє пропозицію"
 IRQ_political_events.51.a:0 "Нам буде краще."
