 czech.18.d:0 "[From.GetNameDefCap] відмовляється прийняти нас у Вісь!"
 czech.27.d:0 "[From.GetLeader] погодився на зустріч з нашою делегацією, але поки що відмовляється вступити в Антанту. Схоже, [From.GetAdjective] влада хвилюється, що, вступивши в наш альянс, вони порушать тендітну рівновагу сил в регіоні."
 dam_plural:0 "Греблі"
 damage_control_2_desc:0 "Розмежувавши основний водопровід на кораблі, ймовірність того, що в результаті влучання корабель повністю втратить здатність до пожежогасіння, значно зменшується."
