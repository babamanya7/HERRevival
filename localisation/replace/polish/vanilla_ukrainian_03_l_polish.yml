 NORDIC_economic_cooperation_decisions:0 "Шукати економічну співпрацю з [FROM.GetName]"
 NORDIC_equipment_conversion_focus_desc:0 "У нас є величезні склади, наповнені старою зброєю та транспортними засобами, або законсервованими, або захопленими у наших полеглих ворогів. Це старе обладнання можна переобладнати в найновішу та найсмертоноснішу пропозицію нашої поточної бойової машини."
 NORDIC_escalation_hostility_reason:0 "Надано допомогу Нордичній країні, що обороняється"
 NORDIC_expert_naval_mechanics:0 "Експерти з морської механіки"
 NORDIC_industrial_cooperation:0 "Промислова співпраця"
 NORDIC_jet_engines:0 "В епоху реактивних літаків"
 NORDIC_naval_exercises_desc:0 "Всі наші країни мають морську спадщину, яка сягає століть, Балтійський і Північний Атлантичний океан сформували нашу культуру та спосіб життя, але, як відомо будь-якій морській нації, море може бути водночас і ровом, і шосе. То навчімося захищатися і атакувати з моря."
 NORDIC_nordic_army_desc_dem:0 "Роль [NORDIC_get_nordic_army_name] полягатиме у встановленні параметрів для різних сухопутних сил у наших демократичних країнах, щоб вони діяли взаємодоповнююче. Таким чином, сильні сторони одних врівноважують слабкі сторони інших, щоб позбутися гноблення по всьому континенту, одна провінція за раз."
 NORDIC_shared_intelligence_desc:0 "Увесь проєкт [NORDIC_get_alliance_name] обертається навколо того, щоб поділитися нашою владою, і якщо знання дійсно сила, то поділімося тим, що ми знаємо про наших ворогів, і тим, що ми знаємо, що наші вороги знають про нас, і навіть те, що вони думають вони знають про нас."
 NOR_a_resurgent_labor_movement:0 "Відродження робітничого руху"
 NOR_a_warden_king_desc:0 "Це обов'язок короля — ні, його привілей — захищати землі, надані йому верховною владою. Нехай збройні сили будуть мечем абсолютної королівської влади, який дрімає, доки король не вирішить повстати й орудувати ним."
 NOR_anti_tank_equipment_2:0 "47mm panservernkanon"
 NOR_bring_soldiers_from_norway_desc:0 "Багато тих, хто боровся за захист нашої країни, залишаються в пастці на нашій батьківщині. Ми можемо докласти зусиль, щоб привести деяких із них, а також інших, які, можливо, ще не воювали, але все ще хочуть повернути свою країну з того місця, де ми зараз."
 NOR_communist_aligned_good:0 "Близькі до наших комуністичних ідеалів"
 NOR_communist_prep_level_3_TT:0 "$NOR_communist_prep_intro$\n $NOR_communist_prep_join_comm_side$\n $NOR_communist_prep_2_militias$\n $NOR_communist_prep_join_light_damage$"
 NOR_communist_preparation_decisions_category_desc:0 "[GetRousingProletariatDesc]"
 NOR_drobak_coastal_fort:0 "Прибережний форт Дробак"
 NOR_drobak_coastal_fort_desc:0 "Дробак, а точніше зунд Дробак, може стати ключем до захисту нашої столиці. Ніколи не знаєш, коли добре розміщена торпеда може затримати вторгнення достатньо довго, щоб підготуватися до відповіді."
 NOR_expand_industrial_capacity_desc:0 "Нас можуть вислати, але це не означає, що ми безпорадні. У нашому розпорядженні є один із найбільших у світі торговельних флотів, і ми можемо використати його, щоб отримати промислові потужності, необхідні для наших зусиль із повернення наша батьківщина."
 NOR_fde_intelligence_agency:0 "Форсварецька розвідка"
 NOR_foreign_plane_designs_desc:0 "[ROOT.GetName], як молода і довго занедбана держава, не має інфраструктури, ноу-гау чи інструментів для проєктування та виробництва повітряних сил, необхідних для сучасного бою. Ми повинні звернутися до міжнародного ринку зброї, щоб постачати повітряні сили [NOR.GetName]."
 NOR_haerens_flyvevaaben_desc:0 "Новий рубіж війни знаходиться в небі. Якщо ми дозволимо ворогу повністю контролювати наш повітряний простір, наші наземні сили не зможуть діяти ефективно. Ми повинні розвинути повітряні сили, які можуть діяти на користь нашої землі війська."
 NOR_invite_secret_army_desc:0 "У минулому лідери [NOR.GetNonIdeologyName] створили таємну армію, щоб захистити країну в разі комуністичної революції, але тепер немає потреби переслідувати їх, оскільки їх мета не має значення. Ми можемо піти на компроміс і запросити тих які хочуть захищати свою країну разом з нами, а не проти нас."
 NOR_light_tank_equipment_3_short:0 "Strv. m/41"
 NOR_mon_stabilizing_effects:0 "Національне втручання"
 NOR_needed_support_TT:0 "Загальна §YПідтримка монархії§! з боку [NOR.GetName]! становить щонайменше §Y[?temp_preparedness]§! (Поточна: [?NOR_country_preparedness])"
 NOR_prepare_state_monarchist:0 "Демонстрація монархістів у області [FROM.GetName]"
 NOR_quislings_coup_desc:0 "Умови дозріли для неминучого приходу до влади Nasjonal Samling. На належному чолі з Fører Vidkun Quisling, це перший крок до повного контролю над [NOR.GetAdjective]ою територією і нашої можливої експансії по всій Скандинавії."
 NOR_rearm_for_defense_desc:0 "Можливо, ми неправильно оцінили небезпеку попереду. Наші береги не забезпечать захист від рішучого ворога, і ми не можемо сліпо покладатися на те, що наші північні сусіди будуть вічно буфером. Тепер ми повинні надолужити втрачений час і переозброїтися [NOR.GetName] бути готовим до захисту."
 NOR_revive_pomor_trade_desc:0 "Століттями наші народи на півночі торгували з Поморським краєм на Білому морі. Це дозволило обом населенням процвітати, але імперська влада та капіталізм зупинили це. Відновімо торгівлю з нашими давніми братами."
 NOR_reviving_the_norgesveldet:0 "Відродження Norgesveldet"
 NOR_shield_of_the_north_desc:0 "Що таке меч, якщо ви ним не володієте? Що, якщо щит, якщо він не захистить підданих? Наша королівська сім'я повинна захищати не лише [NOR.GetNameDef], але й королівства та землі, які знаходяться поруч їхній обов'язок. Навіть якщо не обов'язково де-юре."
 NOR_ship_medium_battery_2:0 "20.3 cm/50 Cannon"
 NOR_ship_torpedo_3:0 "4x 533-мм торпедний апарат"
 NOR_the_neutrality_guard:0 "Гвардія нейтралітету"
 NOR_unity_parade_desc:0 "Давайте наповнимо вулиці міста [FROM.Capital.GetCapitalVictoryPointName] нашими голосами, щоб ми нагадали людям цього великого міста, що наша боротьба та їхня боротьба — одне й те саме."
 NOR_weathering_the_storm_to_come:0 "Подолання майбутньої бурі"
 NOTIFICATION_OUR_GENERAL_SICK_DESC:0 "[This.GetRank] §H[This.GetName]§! занедужує й більше не може служити. [This.GetHerHisCap] ефектинвість упаде нижче звичного, допоки [This.GetSheHe] не одужає."
 NSB_Soviet_fascist_civil_war.001.a:0 "До зброї!"
 NSB_poland_communist_events.201.desc:0 "[From.GetNameDefCap] стає маріонеткою держави [Root.GetNameDef]. Тепер, коли [Root.Capital.GetName] безпосередньо приймає звіт від [From.GetAdjective] уряду, наша гегемонія над Балтикою неминуча."
 NSB_poland_communist_events.6.b:0 "Це наші землі."
 NSB_poland_events.302.a:0 "Дуже прикро."
 NSB_poland_events.302.desc:0 "Незважаючи на всі наші дипломатичні зусилля та спільні, здавалося б, інтереси наших націй, кайзер відмовляється укладати формальний альянс. Схоже, що, хто б не правил Німеччиною, король чи фашист, вона все одно вважає нашу країну своїм природним ворогом."
 NSB_poland_events.402.desc:0 "На жаль, [From.GetAdjective] уряд зараз абсолютно не зацікавлений у тому, щоби поступитися територією [POL_colony_purchase.GetName]. [Root.GetAdjective] заморські амбіції на цьому не закінчуються, але на будь-яких спробах мирної передачі колонії [POL_colony_purchase.GetName]."
 NSB_poland_events.701.desc:0 "Цього разу уряд держави [From.GetNameDef] відмовився укласти з нами формальний союз. Через таку гірку дипломатичну поразку план Фронту Морж на франко-польський союз залишається лише фантазією, і ми мусимо шукати підтримки у інших країн."
 NSB_poland_monarchist_events.602.desc:0 "Неймовірно, але [From.GetAdjective] уряд не бажає підкорятися нашим вимогам і поступатись державі [Root.GetNameDef] контроль над Балканським регіоном. Спроби знайти дипломатичне рішення успіхом не увінчалися — тепер справа за армією."
 NSB_polish_fascist_events.4.desc.rejected:0 "[From.GetNameDefCap] відмовляється від наших пропозицій щодо повоєнного формування кордонів. Втім, це несуттєво — у нас багато інших планів на повоєнний розвиток Польщі."
 NSB_polish_fascist_events.5.t:0 "[From.GetNameDefCap] запрошує нас до міжнародної Фаланги"
 NSB_soviet_civil_war_common.002.t:0 "Столиця держави [ROOT.GetNameDef]"
 NSB_soviet_civil_war_common.100.b:0 "У нас немає зайвих людських ресурсів"
 NSB_soviet_civil_war_common.108.a:0 "Доведеться нам тоді справлятися самим."
 NSB_soviet_civil_war_common.108.desc:0 "Наші переговори з державою [FROM.GetNameDef] виявилися безплідними. Незважаючи на запропоновані права на видобуток нафти в майбутньому, держава не допоможе нам наростити військову міць."
 NSB_soviet_civil_war_common.110.desc:0 "Радянська опозиція попросила нас допомогти їй у боротьбі за владу. Вона хоче, щоби ми потай навчали українське ополчення в обмін на право на видобуток ресурсів у незалежній Україні в майбутньому."
 NSB_soviet_civil_war_common.114.a:0 "Це неприйнятно!"
 NSB_soviet_comecon.1.desc:0 "У рамках організації економічної координації РЕВ [FROM.GetAdjective] уряд почав інвестувати в нашу економіку. Це дозволить нам значно наростити її в наступні пару місяців."
 NSB_soviet_fascist_tsarist.18.t:0 "Троїстий союз — пропозиція відхилена"
 NSB_soviet_foreign_politics_events.151.a:0 "Принаймні, вони будуть боротися на правильній стороні."
 NSB_soviet_foreign_politics_events.153.b:0 "Ми поважатимемо [PER.GetAdjective] незалежність."
 NSB_soviet_foreign_politics_events.252.t:0 "Війна з державою [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.274.t:0 "[FROM.GetNameDefCap] погоджується з нашою пропозицією"
 NSB_soviet_foreign_politics_events.278.desc:0 "До наших дипломатів прийшов лист від [FROM.GetAdjective] посла. В ньому наш сусід очевидно занепокоєний військовим потенціалом дердави [ROOT.GetName], пропонує допомогу у відновленні [ROOT.GetAdjective] армії. Вони направлять нам спорядження та інструкторів. Ми отримаємо літаки та авіатехніку, гвинтівки та кулемети для солдат, артилерійські комплекси та укріплення, школи для пілотів. В обмні [FROM.GetAdjective] уряд просить прибрати деякі торгові обмеження та збільшити [ROOT.GetAdjective] експорт таких товарів як шерсть, хутро та шкіра."
 NSB_soviet_paranoia_system_events.49.desc:0 "Ретельне прочісування ВПС дало свої результати. Слідчі НКВС змогли добути визнання від молодших офіцерів — ті вказали на генералів, які розпорядилися влаштувати навчальні вильоти в погану погоду. Мотиви генералів поки неясні, але слідчі НКВС упевнені, що в лічені дні отримають відповіді."
 NSB_soviet_policies_of_collective_security.1.a:0 "Ми погодимося на початкові умови."
 NSB_soviet_policies_of_collective_security.2.t:0 "[FROM.GetNameDefCap] погоджується підписати пакт"
 NSB_soviet_policies_of_collective_security.4.a:0 "У їхніх твердженнях є сенс."
 NSB_soviet_policies_of_collective_security.4.t:0 "[FROM.GetNameDefCap] наполягає на [POL.GetAdjective] участі в пакті"
 NSB_soviet_policies_of_collective_security_poland_included_effects_root_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! і [POL.GetFlag]§Y[POL.GetNameDefCap]§! відкличуть усякі претензії та цілі війни, спрямовані один проти одного, підпишуть пакт про ненапад і гарантують один одному виконання його умов."
 NSB_soviet_policies_of_collective_security_tt:0 "Якщо [POL.GetAdjective] уряд погодиться, [POL.GetNameDef] увійде до колективної угоди про взаємодопомогу поряд з державами [FROM.GetNameDef] та [ROOT.GetNameDef]."
 NSB_soviet_soviet_german_trade_agreement.2.t:0 "[GER.GetNameDefCap] підписує $NSB_soviet_soviet_german_trade_agreement.1.t$"
