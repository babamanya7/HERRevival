 CHI_camco_primacy_desc:0 "CAMCO є нашим найкращим внутрішнім партнером для розвитку авіації. Пріоритетність їхніх можливостей забезпечить те, що виробництво йтиме в ногу з амбіціями."
 CHI_closer_ties_with_germany_desc:0 "Дипломатичні контакти з Німеччиною розширили наші можливості у сфері співпраці — серед них кредити для подальшого індустріального розвитку."
