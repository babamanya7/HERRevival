 JAP_combined_arms:0 "Взаємодія військ"
 JAP_cooperate_with_anarchists_desc:0 "Анархісти були відкинуті іншими фракціями в КПЯ і змушені були самотужки захищатися від тиранічної держави. Ми повинні запросити їх до нашого об'єднаного руху і гарантувати, що деякі з їхніх ідеалів також можуть втілитися в майбутньому, яке ми плануємо."
