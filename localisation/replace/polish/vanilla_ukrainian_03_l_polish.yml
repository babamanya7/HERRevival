 form_greater_german_state_category_desc:0 "Незважаючи на спротив з усіх боків, нам вдалося подолати корумповані уряди західної європи. Вони більше не можуть пригнічувати робітників, яких ми звільнили і які в цей момент згуртовуються навколо нашої справи. Кайдани капіталізму розбиті, і над Європою — і світом — світає новий порядок."
