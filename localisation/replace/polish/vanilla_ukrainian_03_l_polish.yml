 AREA_DEFENSE_REPLACE_OTHER:0 "Увага"
 ARG_CAS_equipment_2_short:0 "I.Ae 22 DL"
 ARG_american_defense_investments_desc:0 "Хоча добре мати сильні військові сили з добре навченими військами, часто стверджується, що стійка оборона так само хороша, як і потужний наступ. Наш зв'язок з [USA.GetNameDef] призвів до покращення наших оборонних можливостей у наших найбільш вразливих регіонах, зокрема для того, щоб допомогти нам витримати атаки з повітря. Джунглі та гори захищають нас на землі, а ці турелі захищатимуть наше небо."
 ARG_argentina_first_desc:0 "Після ретельного розгляду ми вирішили, що найкращий курс дій для майбутнього [ARG.GetNameDef] — це залишатися поза зростаючим конфліктом у Європі та натомість зосередитися на потребі [ARG.GetNameDef] у зростанні та стабільності. Давайте сформуємо власну фракцію та протистоїмо світові."
