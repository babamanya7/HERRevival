 RAJ_british_air_experts_desc:0 "Використання досвіду досвідчених британських авіаторів та інженерів може прискорити розвиток наших повітряних сил. Їхній досвід у сучасній повітряній війні надасть безцінні знання, поки ми будуємо грізну присутність у небі."
 RAJ_carrier_2_desc:0 "The Ark Royal aircraft carrier was the first such vessel to be built to fit the restrictions of the Washington Naval Treaty. She was the first ship on which the hangars and flight deck were an integral part of the hull. Designed in 1934, the vessel was well-armored and armed. It carried a large complement of aircraft and had adequate operational range and speed to keep up with the major forces of the Royal Navy."
 RAJ_confer_with_the_congress:0 "Радитися з Конгресом"
 RAJ_congress_industrial_expansion:0 "Кампанія промислового розширення"
 RAJ_crown_commodities_cg_to_the_empire_tt:0 "(§Y[ENG.GetFlag][ENG.GetName]§! та їхні §Yсуб'єкти§!):"
 RAJ_crown_commodities_desc:0 "Надаючи пріоритет вирощуванню товарних культур, орієнтованих на експорт, ми можемо забезпечити постійний потік доходів та посилити нашу економічну важливість для Імперії. Чай, бавовна, джут та інші основні продукти колоніальної торгівлі будуть основою процвітання в сільській місцевості."
 RAJ_de_havilland_organization:0 "De Havilland — індійський відділ"
 RAJ_demand_return_of_imperialist_colonies:0 "Вимагати повернення імперіалістичних колоній"
 RAJ_destroyer_3_desc:0 "$ENG_destroyer_3_desc$"
 RAJ_destroyer_4:0 "Клас «Battle»"
 RAJ_empower_provincial_authorities_desc:0 "Замість того, щоб загравати з приватними інтересами, ми посилимо адміністративні повноваження місцевих органів влади безпосередньо контролювати розвиток. Довіряючи інвестиційні рішення провінційному управлінню, ми забезпечуємо, що лояльність винагороджується відповідальністю."
 RAJ_famine_risk_scripted_gui_desc:0 "Шанс запобіжних заходів зупинити поширення голоду на сусідні штати: §G[?RAJ_famine_shield]%§!\nРизик поширення голоду: §R[?RAJ_famine_spreads]%§!"
 RAJ_form_a_federal_court:0 "Створити Федеральний суд"
 RAJ_gun_and_shell_factory_cossipore_desc:0 "Фабрика Кассіпор ще більше підвищить наші можливості в плані піхотного обладнання, а також забезпечить боєприпасами для військ."
 RAJ_indianisation_of_army_desc:0 "Щоб забезпечити надійний захист Індії в умовах тотальної війни, нам доведеться закликати під рушницю всіх жителів країни. Ми мусимо не лише активніше поповнювати армію за рахунок індійців, але також використовувати індійських офіцерів у структурі командування."
 RAJ_indianize_the_army_desc:0 "Настав час замінити колоніальний вплив на індійське керівництво у збройних силах. Підвищуючи індійських офіцерів та реструктуризуючи армію, ми будуємо армію, яка справді представляє націю та служить їй."
 RAJ_infantry_equipment_0_short:0 "GRI No. 1 Mk III"
 RAJ_ishapore_arsenal:0 "Ішапурський арсенал"
 RAJ_jet_tac_bomber_equipment_2_short:0 "Canberra"
 RAJ_light_cruiser_2:0 "$ENG_light_cruiser_2$"
 RAJ_linlithgows_declaration_of_war_desc:0 "Як частина [ENG.GetAdjective] Імперії, нашим обов'язком є взяти зброю та приєднатися до них у їхніх війнах. Немає часу витрачати на прохання дозволу у лідерів Конгресу. Потрібно брати бика за роги. Підготувати декларації та готуватися до війни з ворогами [ENG.GetNameDef]."
 RAJ_local_leaders_investments_mils:0 "[?RAJ_local_leaders_mils|0+]"
 RAJ_local_leaders_investments_tt:0 "Кількість уже завершених інвестицій."
