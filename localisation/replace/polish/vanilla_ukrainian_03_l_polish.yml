 mounted_infantry_anti_mechanized_cavalry_groups:0 "Протимеханізовані кавалерійські групи"
 mtg_britain.23.d:0 "Представники держави [From.GetNameDefCap] зв'язалися з нами і попросили, щоби ми піддали італійців дипломатичної ізоляції. Якщо ми прислухаємося до їхніх порад, то вони готові розглянути варіант укладання з нами союзу в майбутньому."
 mtg_britain.24.t:0 "[From.GetName] залишає державу [ITA.GetName]"
 mtg_britain.3.t:0 "Кабінет іде у відставку"
 mtg_britain.36.d:0 "[From.GetAdjective] дипломати зв'язалися з нами і запропонували хитромудрий план. Вони укладуть союз проти тих, хто досягає гегемонії в Європі, а в обмін обіцяють розірвати всі можливі дипломатичні зв'язки з Францією."
 mtg_britain.41.d:0 "[From.GetNameDefCap] повідомляє нам про те, що вона прийняла рішення вступити в альянс в обмін на повернення Гібралтару."
 mtg_britain.55.a:0 "Зрадники!"
 mtg_britain.62.t:0 "[From.GetName] вживає заходів для забезпечення порядку в домініонах"
 mtg_britain.87.t:0 "Імперська конференція: торгівля"
 mtg_britain.95.t:0 "Імперська конференція: політика умиротворення"
 mtg_germany.3.a:0 "Отже, вони вибрали смерть."
 mtg_netherlands.1.c:0 "Передати контроль британцям — нехай ситуація ускладнюється."
 mtg_netherlands.11.t:0 "Японські інтереси у Вест-Індії"
 mtg_netherlands.12.b:0 "Нехай збережуть колонії за собою — у нас є альтернативні рішення."
 mtg_netherlands.13.a:0 "Це прийнятний компроміс."
 mtg_netherlands.36_tt_2:0 "Ми отримаємо цільовий бонус до захисту та атаки проти агресора протягом 180 днів після нападу провідної західноєвропейської держави.\n"
 mtg_netherlands.45.a:0 "Яка досада."
 mtg_netherlands.50.a:0 "Вже пізно щось змінювати..."
 mtg_news.24.desc:0 "Зробивши безпрецедентний крок, новий [Root.GetAdjective] уряд дистанціювався від союзників по Великій війні в державі [FRA.GetNameDef] і натомість уклав союз із італійцями. Така різка зміна вразила європейське дипломат підозріло до неї поставилися в державах [FRA.GetNameDef] та [GER.GetNameDef] — німців [From.GetLeader] регулярно критикує у своїх промовах."
 mtg_news.24.t:0 "Англо-італійський союз"
 mtg_news.27.b:0 "Та як вони посміли!"
 mtg_news.35.b:0 "Соціалісти не поважають людське життя!"
 mtg_news.38.desc:0 "Держава [From.GetNameDefCap] звинуватила державу [SOV.GetNameDef] у «зраді ідеалів Маркса» і повідомила, що має намір «позбавити соціалізм від його зрадників». Армія приведена в стан повної бойової готовності ситуація, що спочатку здавалася змаганням за лідерство у соціалістичному світі, загрожує ось-ось перерости у повномасштабну війну."
 mtg_news.47.a:0 "Це буде сучасним дивом світу."
 mtg_news.49.c:0 "Вони діють спільно."
 mtg_news.59.desc:0 "[ENG.GetAdjectiveCap]ий уряд підтвердив сьогодні інформацію про смерть короля Георга VI. Постійне куріння, викликане, ймовірно, стресом від війни, підірвало здоров'я монарха і в результаті призвело до розвитку раку легенів, артеріосклерозу та хвороби.\n\nВже почалися приготування до коронації дочки короля Елізабет, яка останнім часом виконувала багато королівських обов'язків батька."
 mtg_usa_civil_war_democrats.2.desc:0 "По всій країні набирають чинності протести проти політики президента [USA.GetLeader]. Сьогодні більше мільйона людей пройшли маршем вулицями Вашингтона; схожі виступи відбулися, як стверджується, мінімум у дев'яти інших місцях. І це не рахуючи менших маршів у столицях штатів і менших містах, які збирають тисячі прихильників. Протести почалися після серії непопулярних політичних рішень з боку адміністрації — за заявою протестувальників, вони підривають основи демократичного управління республікою.\n\n Якщо раніше народ вимагав, щоб президент дистанціювався від найбільш радикальних ідеологічних рухів, то тепер він прагне його негайної відставки."
 mtg_usa_diplomatic_protest.1.t:0 "[USA.GetNameDefCap] спрямовує ноту протесту"
 mtg_usa_diplomatic_protest.3.a:0 "Ми розглянемо можливі варіанти."
