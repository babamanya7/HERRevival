 INDUSTRIAL_ORGANIZATION_TOOLTIP_SIZE_DELAYED:0 "Щоразу як §Yвійськово-промислова організація§! збільшується в §Yрозмірі§!, Ви отримуєте бал риси, яким зможете відімкнути рису."
 INDUSTRIAL_ORG_DETAIL_TOOLTIP_DESIGN_TEAM_CHANGE_COST_DELAYED:0 "Коли Ви додаєте §Yвійськово-промислові організації§! до варіантів оснащення, це коштуватиме Вам §Yдосвіду§!. В залежності від типу оснащення, це буде досвід £GFX_army_experience армії, £GFX_navy_experience флоту чи £GFX_air_experience авіації."
