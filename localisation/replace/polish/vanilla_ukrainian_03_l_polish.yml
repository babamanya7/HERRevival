 liberate_mauritania_desc:0 "$liberate_angola_desc$"
 light_tank_destroyer_equipment_desc:0 "Винищувачі танків — це гусеничні машини з більшою за звичайну гарматою на стаціонарному кріпленні замість башти. Легкі винищувачі танків базуються на шасі легких танків, що означає, що вони досить мобільні, але не мають особливо потужних гармат порівняно з більш важкими ТД."
 local_resources_coal_factor_tt:0 " $local_resources_coal_factor$: $RIGHT|+=%1$"
 magnetic_detonator_desc:0 "Детонатор нової системи фіксує зміну магнітного поля землі при проходженні під метою. Вибух, вироблений безпосередньо під кораблем, завдає більшої шкоди і часто відриває кіль, що призводить до негайного затоплення."
 manage_occupied_territories:0 "§GКлацніть, щоби керувати Вашими окупованими землями.§!"
 mass_assault_desc:0 "«Ідеальна» зброя переоцінена. Велика кількість «достатньо хорошої» — ось шлях до перемоги!\n\n"
