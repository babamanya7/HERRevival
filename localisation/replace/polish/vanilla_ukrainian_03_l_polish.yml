 FIN_heavy_cruiser_1:0 "Клас «Väinämöinen»"
 FIN_heavy_cruiser_1_desc:0 "The Väinämöinen class consisted of two coastal defense battleships built and commissioned in Finland in the early 1930s. They were among the last coastal defense ships ever built, though their size and armament were closer to that of a heavy cruiser. They displaced only 3,900 tons and were fairly slow, but were armed with four 254mm/45 caliber Bofors guns."
 FIN_infantry_equipment_3:0 "KP m/44"
 FIN_instigate_a_new_karelian_uprising_desc:0 "Відроджуючи дух Братніх війн, ми повинні спробувати створити нове карельське повстання, і дозвольте карельському народу шукати незалежності, якої вони бажають."
 FIN_join_axis_desc:0 "Мало тих, хто зможе протистояти могутності держав Осі. Замість того, щоб залишатися осторонь, ми повинні приєднатися до їхнього альянсу та використовувати його для досягнення наших власних зовнішньополітичних цілей."
 FIN_joint_scientific_program_desc:0 "Розвиток технологічної переваги над ворогами може стати вирішальним чинником того, чи держава вийде переможцем із конфлікту. Об'єднавши наші наукові знання з нашими союзниками, ми можемо гарантувати, що технологічна перевага належатиме нам."
 FIN_mining_the_sea_decision_cost_pp_xp_cp_blocked:0 "£pol_power §R[?FIN.FIN_mining_the_sea_pp_xp_cost]§! £navy_experience §R[?FIN.FIN_mining_the_sea_pp_xp_cost]§! £command_power §R[?FIN.FIN_mining_the_sea_cp_cost]§!"
