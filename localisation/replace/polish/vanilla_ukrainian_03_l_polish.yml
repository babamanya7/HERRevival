 JAP_limit_military_power_desc:0 "Щоб запобігти ще одному державному перевороту, ми повинні перевести якомога більше військовослужбовців з владних посад, наскільки це можливо без провокування повстання. Зробивши це, ми зможемо не дати їм загасити смолоскип свободи."
 JAP_limit_the_emperors_power:0 "Обмежити владу Імператора"
 JAP_mechanized_equipment_2_short:0 "Type 1 Ho-Ha"
 JAP_medium_tank_destroyer_equipment_1_short:0 "Ho-Ni I"
 JAP_modern_shogunate_desc:0 "Посада імператора повинна залишитися швидше за символічну, тоді як від його імені правлять впливові намісники. Це дозволить слову імператора розноситися вшир і вдалину по всій країні."
 JAP_national_research_policy_desc:0 "Державні підтримка та контроль науково-дослідних інститутів значно підвищать гнучкість та продуктивність наших наукових розробок."
 JAP_occupy_indochina_tt:0 "Франція не володіє регіоном §YІндокитай§!"
 JAP_oppose_the_zaibatsus_desc:0 "Найбільші корпорації нашої нації довго мали безпрецедентну політичну та економічну владу. Ми повинні нагадати їм, що вони все ще підпорядковані бажанням Імператора, і гарантувати, що їхня жадібна капіталістична політика не зможе продовжувати забруднювати душу нашої нації."
 JAP_peace_out_soviets_dec_tt:0 "Відкриває рішення про підписання §Yсепаратного миру§! з §Y[SOV.GetNameDef]§! для отримання §YСибіру§!, якщо ми контролюємо його"
 JAP_promote_pan_asianism_tt:0 "Відкриває рішення для §Yінтеграції§! наших розвинених азійських суб'єктів з метою §Yоб'єднання Азії§! під однією державою"
 JAP_propagandize_the_nihon_shoki:0 "Пропаганда Ніхон Шьокі"
 JAP_publically_distance_from_sov_decision_tt:0 "Дозволить приймати подальші рішення після завершення певних фокусів, щоб збільшити шанси на успішну революцію"
 JAP_revere_the_emperor_shortcut:0 "Політика: імперський шлях"
 JAP_sea_sturdy_aircraft_desc:0 "Маневреність і дальність польоту є важливими, але не єдиними факторами, що визначають наш успіх у небі. Якби наші літаки були тонкими, як папір, ми б програли ще до початку будь-якої війни. Тому ми повинні інвестувати в розробку міцніших корпусів і товстішої броні, щоб ми могли панувати в небі протягом багатьох років."
 JAP_secretly_rebuild_the_party_tt:0 "Розблоковує рішення для §Yінфільтрації в контрольовані опозицією регіони§!, щоб гарантувати їхнє приєднання до §Yкомуністів§! під час §YГромадянської війни§!"
 JAP_secure_the_sea_lanes:0 "Убезпечити морські шляхи"
 JAP_ship_radar_4:0 "Радар «Type 33»"
 JAP_social_and_cultural_revolution:0 "Соціальна та культурна революція"
 JAP_sp_rockets_flying_bomb:0 "MXY-7 Ohka"
 JAP_strategic_offensives_desc:0 "[CHI.GetNameDefCap] виявився надскладною ціллю, і наше верховне командування закликало до більш скоординованих наступальних дій, спрямованих на різні ключові точки. Оскільки «Гекокуджьо» на місцях перешкоджає нашим вищим інтересам, ми повинні спочатку приборкати це явище, щоб нарешті розгорнути ці операції."
 JAP_strengthen_the_divine_wind:0 "Посилити божественний вітер"
 JAP_strike_south_doctrine_desc:0 "Незважаючи на всі свої багатства, Китай не задовольняє всі наші потреби в ресурсах. На південь лежить Нідерландська Ост-Індія та британські Малайя та Борнео. Для повної економічної незалежності нам потрібно відібрати у європейських імперіалістів контроль над цими землями."
 JAP_support_the_kodoha_faction:0 "Підтримати фракцію «Кодоха»"
 JAP_sway_disillusioned_young_officers_tt:0 "§YМолоді офіцери Кодоха§! стануть прихильними до нашої справи"
 JAP_sway_the_navy_moderates_tt:0 "Ми збережемо більшу частку §YІмператорського флоту§! та його сил для §YГромадянської війни§!"
 JAP_tauran_border_conflict_time_until_cancelled:0 "Завершити конфлікт"
 JAP_tauran_border_conflict_time_until_cancelled_desc:0 "При поточному темпі ми можемо підтримувати бойові дії лише певний час, перш ніж нам доведеться припинити бій."
 JAP_the_manchurian_project_desc:0 "На наших островах дуже мало придатних земель, проте їх достатньо у наших володіннях на континенті. Там ми можемо розвивати те, що не вдасться розвинути у нас «вдома». [MAN.GetNameDef] стане місцем повномасштабної індустріалізації."
 JAP_the_new_international:0 "Новий інтернаціонал"
 JAP_the_suiyuan_offensive_mission:0 "Кампанія в Суйюань"
 JAP_the_ultimate_tank_desc:0 "У наших інженерів виникла геніальна ідея. Замість того, щоб виставляти величезну кількість менших машин, ми повинні прагнути побудувати металеві бегемоти, які зможуть розчавити наших ворогів лише з мінімальною підтримкою. Їхня перша чернетка — це транспортний засіб, який вони називають танком О-І, і ми повинні почати працювати над втіленням цього бачення в реальність якомога швидше."
 JAP_train_equipment_1:0 "Клас «JNR D50»"
 JAP_transformation_of_nature:0 "Перетворення природи"
 JUNO_brazil_events.120.a:0 "Знання не знають кордонів."
 JUNO_brazil_events.133.a:0 "Нам і без них краще."
 JUNO_brazil_events.140.b:0 "Ввічливо відхилити пропозицію."
 JUNO_brazil_events.160.t:0 "Корпорації запрошені до [FROM.GetNameDefCap]"
 JUNO_brazil_events.163.a:0 "Запровадити законодавство Партії праці."
 JUNO_brazil_events.20.desc:0 "Під час нещодавніх зустрічей між [BRA.GetAdjective] та [USA.GetAdjective] президентами в Північно-Східній Бразилії, перший погодився виконати зобов'язання, викладені в угодах [USA.Capital.GetCapitalVictoryPointName]. Це означає, що вони тепер задіють свої військові сили до нашої триваючої війни проти тиранії по всьому світу."
 JUNO_brazil_events.30.desc:0 "Дипломати з [FROM.GetNameDef] звернулися до нас із пропозицією військової та економічної співпраці. Вони заявляють, що глибоко стурбовані станом світових справ і вважають, що єдиний шлях до тривалого миру — це об'єднання з нами та покладення кінця нашим спільним геополітичним ворогам."
 JUNO_brazil_events.37.desc:0 "Надходять повідомлення про зростання військової активності в Південній Бразилії. Недавні стосунки між нашими націями були, в кращому випадку, холодними, а їхня наполеглива риторика змушує багатьох припускати, що ми можемо бути на межі вторгнення. Багато військових поспішають підготувати оборону на випадок найгіршого. Але є й ті, хто наполягає на превентивному ударі, перш ніж [BRA.GetAdjective] будуть повністю готові."
 JUNO_brazil_events.45.desc:0 "[BRA.GetAdjective] посол у [ROOT.Capital.GetCapitalVictoryPointName] виступив із заявою від їхнього уряду. Очевидно, їхній уряд стурбований нестабільністю тут і бажає стабілізувати нашу націю за допомогою своїх військових. Насправді, це означало б зміну режиму під виглядом допомоги."
 JUNO_brazil_events.87.a:0 "Ми знали, що можемо розраховувати на наших [SOV.GetAdjective] товаришів!"
 JUNO_invite_japanese_army_advisors:0 "Запросити японських військових радників"
