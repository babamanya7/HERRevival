 INDUSTRIAL_ORG_QUEUE_SAVE_BEFORE_CREATE_NEW_DESC:0 "§YУ вас є незбережені зміни, які буде втрачено.§!\n\nБажаєте зберегти чи відхилити поточну чергу рис «$SAVED|Y$» перед створенням нової черги рис?\n\nЯкщо ви не збережете, §Rзміни до поточної черги рис буде втрачено§!."
