 operation_fork:0 "Операція «Fork»"
 operation_jericho_limited_success_tt:0 "Під час зухвалого бомбардувального нальоту вдалося пробити діру в стіні в'язниці. Однак багато в'язнів дістали поранень або не змогли втекти."
