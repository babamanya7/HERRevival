 BUL_infantry_equipment_1:0 "Karabiner 98k"
 BUL_internal_factions:0 "Керівництво фракціями"
 BUL_legislative_elections_desc:0 "Болгарська демократична партія здобула масову підтримку, і тепер вона має можливість тиснути на уряд, щоб він призначив парламентські вибори, цього разу вільні від фальсифікацій, яким вони зазнавали протягом багатьох років."
 BUL_macedonian_revolutionary_organizations_foreign_desc:0 "Проболгарська організація ВМРО, яка з давніх-давен отруює життя Балканам, отримала від Болгарії підтримку та озброєння для дестабілізації нашої країни та поширення проболгарських симпатій серед населення. З цією організацією і її терором час розквитатися."
 BUL_opression_anti_zveno_speech_desc:0 "Ми влаштуємо мітинг, де висловимо свій протест $BUL_zveno_name_dat$ і свою зневагу до його організації та антиурядової позиції."
 BUL_opression_destroy_bzns:0 "Знищити [GetBznsName]"
 BUL_opression_discredit_bs_leaders_desc:0 "Фракція [GetBsName] поширює серед населення небезпечні ідеї та розгромну критику нашого уряду, що для нас абсолютно неприйнятно. Ми мусимо публічно дискредитувати лідерів фракції, нашкодивши тим самим його популярності та публічному образу."
 BUL_opression_imprison_zveno_leaders:0 "Заарештувати лідерів $BUL_zveno_name_gen$"
 BUL_opression_repress_nsm_desc:0 "Не можна байдуже дивитися, як дисиденти й агітатори поділяють наш народ. Те, що роблять члени $BUL_nsm_name_gen$ з нашим урядом, спричинить серйозні наслідки."
 BUL_purchase_aircraft_naval_bomber_available:0 " або [?BUL_quantity_purchased_naval_bomber] од. §Yморських бомбардувальників§!"
 BUL_purchase_aircraft_only_fighter_available:0 ""
 BUL_repress_imro_destroy_organization_desc:0 "Ми проведемо вздовж македонського кордону військову операцію, щоб викорінити ВМРО раз і назавжди."
 BUL_seek_cooperation_with_the_tsar_desc:0 "Цар все ще має надто велику владу в уряді і може перешкодити всім нашим пропозиціям, якщо його спровокують, тому наш найкращий варіант — спробувати співпрацювати з ним, поки ми поступово збільшуємо свій вплив в уряді."
 BUL_soviet_military_exercises:0 "Радянські військові навчання"
 BUL_steel_plant_in_pernik_desc:0 "Болгарія не є найбагатшою країною на Балканах з точки зору ресурсів, і тому ми мусимо отримати максимум від скарбів, які приховує наша земля. Ми мусимо вдосконалити наші чавунні заводи та вуглевидобувні потужності в Перніку, а також побудувати там наш перший завод із виробництва сталі."
 BUL_the_path_towards_a_greater_bulgaria:0 "Шлях до Великої Болгарії"
 BUL_total_war:0 "Тотальна війна"
 BUL_ui_popularity_header:0 "Популярність"
 BUL_united_front_against_fascism_desc:0 "Наступним кроком після об'єднання буржуазного руху є створення антифашистського блоку, тактика, запропонована 7-м конгресом Комінтерну в 1935 році. Ми мусимо закликати аграріїв і навіть демократів приєднатися до нашого фронту проти болгарського фашизму."
 BUL_war_logistics_desc:0 "Ми програли Велику війну не через поразки на полі бою, а через неспроможність прогодувати свій народ і забезпечити наші війська. Ми мусимо поліпшити нашу логістику, щоб цього більше не повторилося."
