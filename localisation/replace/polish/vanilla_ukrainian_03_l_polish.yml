 GER_allied_civilian_administration_integration_tt:0 "Відкриває рішення для: §YІнтеграції цивільних адміністрацій наших суб'єктів§!, що дозволяє §YАнексувати§! наших §YМаріонеток§!."
 GER_anti_soviet_pact_unaligned_desc:0 "Слід підготуватися до військового конфлікту з комуністичним режимом, запропонувавши всім, хто підписав Антикомінтернівський пакт, погодитися з додатковим застереженням, яке закликає до військової підтримки проти будь-якої радянської агресії. Нас вже досить багато пов'язує, так що залишилася лише формальність."
 GER_anti_tank_equipment_1:0 "3,7 cm PaK 36"
 GER_ascended_advisor_2_name_text:0 "§Y[GetAscendedAdvisorName2]§!"
 GER_ascension_of_character_focus_tt:0 "§Y$CHARACTER$§! почне поступово виконувати фокуси у своїй гілці."
 GER_ascension_of_himmler_desc:0 "Під організацією та керівництвом Гайнриха Гіммлера SS з досить невеликої організації виросла в більш помітну силу в нашій країні. Його просування по службі дозволило б нам іще більше скористатися його навичками та краще використати SS в її нинішньому вигляді."
 GER_asian_allies_desc:0 "Є багато менших націй в Азії, які ще не підкорені нашими ворогами. Можливо, обіцянки безпеки та територіальної вигоди переконають їх приєднатися до нашої справи."
 GER_autarky:0 "Автаркія"
 GER_autobahn_democratic:0 "Autobahn"
 GER_bri_state_transfer_effect_tt:0 "Кожна виділена область перейде під контроль §Y[BRI.GetNameDef]§!"
 GER_construct_north_atlantikwall_tt:0 "Побудувати оборонну лінію вздовж §YНорвезького Узбережжя§! в кожній області повністю підконтрольній державі §Y[ROOT.GetNameDef]§!, [GER.GetAdjective]ій маріонетці або члену альянсу. Додасть §G1§! додаткове §Y$coastal_bunker$§! у провінціях із хоча б §Y1 $naval_base_ins$§!. Поточний ефект:\n"
 GER_create_asian_reichskommissariat_desc:0 "Звичайна колонія має багато переваг, але наш фюрер має ще більші плани щодо наших колоній в Азії. Прийняття його колоніального закону має бути вигідним для всіх учасників!"
 GER_currently_holding_backdoor_negitations_flag:0 "Зараз ведемо закулісні перемовини"
 GER_currently_relocating_industry_flag:0 " Наразі переміщуємо промисловість"
 GER_cv_CAS_equipment_3_short:0 "Ju 187 C"
 GER_danubian_membership_desc:0 "Придунайські спадкоємці Австро-Угорщини мусять добре пам'ятати, наскільки цінним є наш союзник. Ми запропонуємо їм членство у союзі та захист від загрози [GER.GetDanubianMembershipDesc]."
 GER_division_latvia_armored_tt:0 "§YТанкова§! частина §Y19. SS-Panzerdivision Latvia§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_scotland_mot_tt:0 "§YМоторизована§! частина §YGälische Freiwilligen-Division der Waffen-SS§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_enforced_german_leadership:0 "Німеччина проштовхнула німецьке лідерство в Угорщині"
 GER_establish_the_afrikakorps_desc:0 "Щоби мати змогу перервати лінії постачання ворога та захистити життєво важливі ресурси та стратегічні позиції, ми мусимо вивести війну з Європи на чужі береги!"
 GER_expand_the_truppenschulen_desc:0 "Щоби відповідати зростаючим потребам у спеціалізованих офіцерах, нашу мережу військових навчальних закладів необхідно значно розширити. Забезпечення найліпшого вишколу наших кандидатів на офіцерські посади забезпечить наш успіх на полі бою."
 GER_extend_mefo_bills_desc:0 "Відсунути термін сплати векселів «MEFO» ще на 3 місяці, що дозволить нам продовжувати користуватися їхніми перевагами протягом усього періоду. Однак це також підвищить вартість наших кінцевих платежів."
 GER_fan_prussian_militarism:0 "$GER_fan_the_prussian_militarism$"
