 FRA_allow_volunteer_work_tt:0 "Усі партії в громадянській війні в Іспанії отримають людські ресурси в залежності від відносної сили відповідної ідеології у Франції."
 FRA_arms_purchases_in_the_us_desc:0 "Наша військова промисловість просто не в змозі забезпечити наші сили необхідною сучасною зброєю. Однак у США є вільні виробничі потужності. Якщо вони не вирішать повернутися до свого ізоляціонізму, здавалося б, їх можна було б переконати продати нам необхідну зброю."
 FRA_ban_non_military_aid:0 "Заборонити невійськову підтримку"
 FRA_coup_in_central_africa_desc:0 "Багато французів у Центральній Африці прагнуть знову боротися із загарбником. Треба лише вийти з ними на зв'язок."
 FRA_family:0 "Сім'я"
 FRA_fatherland:0 "Батьківщина"
 FRA_form_the_state_arsenals_desc:0 "Щоб забезпечити нашу армію сучасною зброєю, ми не можемо чекати, поки приватні компанії створять необхідні виробничі потужності."
 FRA_heavy_tank_equipment_3:0 "AMX-M4"
 FRA_intervention_in_indochina:0 "Інтервенція в Індокитай"
 FRA_join_the_ententes_desc:0 "Франція не може виконувати два зобов'язання щодо взаємної оборони одночасно. Якщо ми не зможемо змусити британців також погодитися виконувати наші зобов'язання, нам доведеться вибирати. Об'єднуючи наші розрізнені мережі альянсів в єдине ціле, ми на порядок збільшуємо стримувальний чинник наших альянсів."
 FRA_light_tank_destroyer_equipment_3:0 "Renault UE 57"
 FRA_metropolitan_france_desc:0 "Інтереси метрополії завжди мусять бути передусім. Спершу слід поліпшити інфраструктуру, щоби створити робочі місця. Це дозволить швидше розгортати війська за необхідності."
 FRA_promise_independence_to_madagascar:0 "Пообіцяти незалежність Мадагаскару"
 FRA_strengthen_the_unions_desc:0 "Занадто довго право окремого працівника об'єднуватися зі своїми товаришами для колективних переговорів залишалося відкритим для нападу. Більше такого не буде."
 FRA_stresa_front:0 "Стрезький фронт"
