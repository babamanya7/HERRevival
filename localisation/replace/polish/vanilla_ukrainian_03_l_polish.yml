 FIN_winter_war_push_back_tt:0 "\nЯкщо ми відтіснимо [SOV.GetAdjective]і війська і окупуємо область §Y[195.GetName]§!, у нас з'явиться можливість вимагати переговорів про мир. \nЯкщо ми будемо також контролювати область §Y[213.GetName]§!, §Y[215.GetName]§! або §Y[216.GetName]§!, у нас з'явиться можливість вимогти від держави [SOV.GetNameDef] передати ці області нам як територіальні поступки."
