 PEACE_CONFERENCE_ON_CLICK_REMOVE_STACKABLE:0 "§GКлацніть§!, щоби прибрати всі додаткові вимоги з батьківських вимог."
 PEACE_CONFERENCE_PUPPETED:0 "Держава @$TAG$$COUNTRY|Y$ стала маріонеткою."
 PEACE_FILTER_LOSER_DESCRIPTION:0 "Оберіть державу, щоби показати лише вимоги, які ви можете пред'явити до неї."
