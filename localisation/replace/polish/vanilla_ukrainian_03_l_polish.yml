 AFG_agreement_with_germany_desc:0 "У ці бурхливі часи ми повинні шукати сильних та надійних союзників, щоб забезпечити наше місце як домінуючої сили в ісламському світі. Таким чином, ми звернемося до [GER.GetNameDef], щоб оцінити їхній інтерес до пакту про взаємну оборону."
