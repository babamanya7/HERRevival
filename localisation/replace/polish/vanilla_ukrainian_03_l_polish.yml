 INDUSTRIAL_ORG_TRAIT_TOOLTIP_NOT_ENOUGH_FUNDS:0 "§RРиси можна відкривати тільки збираючи кошти з роботи над дослідженнями та виробничими лініями.§!"
 INDUSTRIAL_ORG_UNLOCK_TRAIT_POPUP_UPGRADE_VARIANTS_TOOLTIP_COST:0 "Вартість: $XPCOST$"
 INITIAL_RESEARCH_STATE:0 "Початкове дослідження"
 INSHOL_emergency_dockyard_construction_desc:0 "Загрозу морського вторгнення неможливо недооцінити, ми повинні зробити морську оборону нашим головним пріоритетом."
 INSHOL_import_sugar:0 "Імпорт цукру"
 INSHOL_java_factories_desc:0 "Хоча це й банально, не можна заперечувати, що просте будівництво більшої кількості збройових заводів значно покращує силу армії. Як промисловий центр колонії, Ява є очевидним місцем для їх будівництва."
 INSHOL_linggadjati_agreement:0 "Переговори про угоди про припинення вогню"
 INSHOL_princely_authority_desc:0 "Рада радників — гарна річ на своєму місці, але султани, які позичили свої імена для заснування цієї нації, можуть дати ще більше. Парламент не стане на шляху тих, хто хотів би бачити одного з них піднесеним над іншими. Старі двори довго чекали, коли їм знову поставлять це запитання."
 INSHOL_seek_foreign_help:0 "Шукати іноземної допомоги"
 INSHOL_singapore_compromise:0 "Сінгапурський компроміс"
 INSHOL_the_war_in_europe:0 "Війна в Європі"
 INS_admiral_mas_pardi_desc:0 "Будь-якому хорошому флоту потрібен Адмірал, який буде ним командувати. Мас Парді — очевидний вибір."
 INS_chaos_events.3.desc:0 "Сьогодні було здійснено замах на життя Сукарно голландським солдатом, який вистрілив у машину Сукарно. На щастя, Сукарно не було в транспортному засобі, однак його шофер був важко поранений. Хоча ця спроба була невдалою, зрозуміло, що це буде не остання спроба, як з боку голландських солдатів, так і індонезійської опозиції."
 INS_communist_events.1.desc:0 "Ситуація погіршилася безповоротно. Місяці агітації [FROM.GetAdjective] зробили свою справу, і комуністичний рух у [ROOT.GetName] більше не можна стримати звичайними заходами. Загальні страйки паралізували міста, озброєні партизани панують над цілими провінціями, а уряд [FROM.GetAdjective] кинув усю свою вагу на підтримку революціонерів. Наші сили безпеки розпорошені, і їхня лояльність більше не є певною. Ми повинні вирішити зараз, чи боротися за виживання держави, чи прийняти неминуче до того, як проллється більше крові."
 INS_construction_focus:0 "Промисловий бум"
 INS_cost_text_oil_40_blocked:0 "£resources_strip|1 §R40§!"
 INS_cost_text_rubber_60_blocked:0 "£resources_strip|3 §R60§!"
 INS_developing_java_desc:0 "Ява є найбільш індустріалізованим островом на архіпелазі та джерелом більшої частини нашого багатства. Однак деякі міста, такі як Батавія, стають дедалі перенаселенішими через зростання кількості населення. Ми повинні розширити ці міста новими будинками, комерційними зонами, трамваями, поїздами та заводами, щоб підтримати зростаюче населення."
 INS_hatta_princely_advisors:0 "Інтеграція князівських держав"
 INS_heavy_tank_equipment_2:0 "Zware Tank II"
 INS_industrial_events.28.b:0 "Організувати ще одну партію."
 INS_industrial_events.5.c:0 "Ми прив'яжемо індійський гульден до долара США."
 INS_is_union_tt:0 "Створено Нідерландсько-Індонезійську унію"
 INS_land_reform:0 "Земельна реформа"
 INS_light_tank_destroyer_equipment_3:0 "Tankjager 5"
 INS_loyalist_events.14.desc:0 "Угоду прийнято. Сінгапур буде передано під наш контроль, тоді як колишні контролери збережуть свій комерційний та військовий доступ до порту. Наш прапор тепер майорить над однією з найважливіших гаваней в Азії."
 INS_loyalist_events.22.t:0 "[FROM.GetNameDefCap] вимагає Східний Тимор"
 INS_loyalist_events.23.t:0 "Східний Тимор здано"
 INS_loyalist_events.7.a:0 "Нехай вирішує народ."
 INS_marine_establishment_organization:0 "Морське відомство"
 INS_musso_ascends_desc:0 "Тан Малака — мрійник. Муссо приносить те, чого не можуть мрійники: повну підтримку Радянського Союзу та солідарність міжнародного комуністичного руху. Наша революція не обов'язково повинна стояти наодинці."
 INS_national_revolution_republic_warning_police_action:0 "[HOL.GetName] готує військову кампанію"
 INS_no_peta_tt:0 "Індонезія не зможе співпрацювати з іноземними загарбниками."
 INS_owned_states_at_game_start_tt:0 "Усі індонезійські регіони"
 INS_political_events.5.b:0 "Амір Шаріфуддін є справедливим компромісом між соціалістами та націоналістами."
 INS_political_events.6.a:0 "Ми повинні продовжувати діяти швидко."
 INS_political_events.8.t:0 "Окупація військами [?event_target:INS_invasion_event_invader.GetAdjective] неминуча"
 INS_reclaiming_the_dutch_navy_desc:0 "Голландці залишили багато кораблів, розміщених у портах, які ми зараз займаємо. Ми повинні забрати ці кораблі собі, поки є така можливість."
 INS_reduce_escalation_1_tt:0 "Знижує §YРівень ескалації§! на §G1§!"
 INS_revolution_events.20.desc:0 "[INS.GetLeader] повернувся із зустрічі з [HOL.GetLeader] з гарними новинами. Обидві сторони погодили рішення про дві держави, і ми негайно почнемо переміщувати наші війська відповідно до нових кордонів. Хоча ніхто не щасливий, що нам довелося залишити наших співвітчизників-індонезійців позаду, рішення припинити бойові дії зрештою є найкращим."
 INS_revolution_events.24.t:0 "[FRA.GetNameDefCap] відмовляється допомогти."
 INS_revolution_events.27.t:0 "Кінець війни в Індонезії"
 INS_revolution_events.32.a:0 "Це неприйнятно!"
 INS_revolution_events.35.t:0 "[USA.GetNameDefCap] оголошує про посередництво"
 INS_revolution_events.39.desc:0 "Всупереч усім очікуванням, голландці відхилили американський ультиматум. Їхні генерали, мабуть, вірять, що зможуть виграти цю війну до того, як Вашингтон почне діяти. Вони помиляються. Тепер, коли американці відкрито віддані нашій справі, баланс сил рішуче змінився. Хай приходять. Ми більше не воюємо самі."
 INS_revolution_events.5.t:0 "[HOL.GetNameDefCap] просить нашої допомоги"
 INS_revolution_events.8.a:0 "Ми повинні уважно стежити."
 INS_secularism:0 "Секуляризм"
 INS_strat_bomber_equipment_1_short:0 "B-17 Flying Fortress"
 INS_subsidize_local_business:0 "Субсидування місцевого бізнесу"
 INS_the_peoples_security_army:0 "Армія народної безпеки"
 INS_tighter_tkr_integration:0 "Тісніша інтеграція TKR і Ласкар"
 INS_timor_issue_scripted_desc_attack:0 "Східний Тімор вочевидь є законною індонезійською територією. Повстанці на острові можуть вимагати незалежності, але вони вочевидь не говорять від імені всього населення. Залишки португальського колоніалізму мають бути інтегровані в Республіку."
 INS_union_events.1.desc:0 "Зі втратою батьківщини, [HOL.GetNameDef] повідомили нас, що їхній уряд і королівський двір переїдуть до [1058.GetName]. Вони пишуть про необхідність, безперервність і потребу зберегти Королівство живим там, де все ще майорить прапор."
 INS_union_events.2.t:0 "[INS.GetNameDefCap] приймає пропозицію про переїзд"
 INS_unlock_naval_steal_raid_tt:0 "Розблоковує рейд §YЗахопити колоніальні кораблі§! у [1058.GetName], щоб захопити кораблі голландського флоту для нашої справи."
 INS_volksraad_events.70.desc:0 "[INS.GetLeader] схвалив петицію Фольксрааду про зняття обмежень на публічне демонстрування націоналістичних прапорів та символіки в публічних місцях у [INS.GetNameDef], значною мірою для того, щоб зменшити радикалізацію багатьох молодих націоналістів. [INS.GetLeader] наполягає на тому, що ми повинні зайняти оборонну позицію в цьому питанні, співпрацюючи з мирними націоналістичними лідерами, водночас викорінюючи революційні рухи, однак рішення зрештою залишається за нами."
 INS_volksraad_remove_education_quotas_desc:0 "Система освіти в Ост-Індії наразі функціонує за системою квот, згідно з якою має бути прийнята певна кількість індонезійських студентів і певна кількість нідерландських студентів. Це викликало суперечки у Фольксрааді через поширену думку, що система несправедливо перекошена на користь нідерландців. Хоча ми могли б дозволити Фольксрааду роками сперечатися про реформування системи, можливо, варто скасувати систему квот взагалі."
 INTEL_LEDGER_DEPLOYED_NAVY_MANPOWER_COUNT_WITH_CAP:0 "Розгорнуто флотських людських ресурсів: $AMOUNT|H$ (потрібні флотські розвіддані: $MIN|H.0%$)"
