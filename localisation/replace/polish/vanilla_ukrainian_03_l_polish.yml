 PEACE_WAR_REPARATION:0 "й ця область платитиме військові репарації"
 PEACE_WAR_SCORE_REDISTRIBUTION_TO_OVERLORD:0 "Передано володареві"
 PERMISSION_NOT_ENEMY_DESC:0 "Необхідно для ворожих стосунків"
 PER_add_panzer_leader_trait_tt:0 "§YДва§! випадково обрані армійські лідери отримають рису «Панцерний лідер»."
 PER_addressing_the_issue_flag:0 "Вирішення проблеми"
 PER_challenge_the_royal_navy_desc:0 "Тепер ми маємо технологічні та теоретичні знання, щоб протистояти нашому великому супротивнику. Однак нам бракує конкретного досвіду, необхідного для цього. Можливо, ми зможемо зібрати знання через невеликі провокації в Затоці?"
 PER_clergy_happy_tt:0 "§GПрийняття цього фокусу заспокоїть Духовенство. Вони більше не бачитимуть необхідності повставати проти вас.§!"
 PER_communist_events.1.desc:0 "Радикали, які виступають за незалежність від нас, були більш активними в останні дні. Ще незрозуміло, що спровокувало це зростання активності, але місцева влада висловлює занепокоєння щодо сплеску націоналістичної та соціалістичної риторики, що лунає на вулицях. Якщо ми хочемо запобігти ескалації ситуації, нам, ймовірно, доведеться розпочати придушення."
 PER_communist_events.10.a:0 "Ми вдаримо, поки маємо перевагу."
 PER_consolidate_british_territory:0 "Консолідувати [ENG.GetAdjective] територію"
 PER_deal_with_eitc_desc:0 "Наші сусіди на сході, здається, зайняті. [RAJ.GetNonIdeologyName] відновила Ост-Індійську торговельну компанію і стала загальнонаціональною мегакорпорацією. Було б розумно залучити їх до нашої нафтової монополії та укласти угоду з ними та рештою ОПЕК."
 PER_demand_afghan_territory:0 "Вимагати Афганську територію"
