 SEA_japan.1.e:0 "Народ повинен зрозуміти, що його підривають з усіх боків!"
 SEA_japan_air_accidents_events.01.desc:0 "Адмірал Ісороку Ямамото був збитий ворожим вогнем сьогодні раніше. Група [USA.GetAdjective]их винищувачів перехопила його після перехоплення наших розвідувальних передач. Назвавши свою зухвалу атаку «Операція Помста», вони явно мають намір надіслати повідомлення. Поки наша нація оплакує втрату цього великого воїна, ми не повинні забувати про свій обов'язок знищити цього безчесного ворога!"
 SEA_japan_foreign_policy.102.a:0 "Як це жалюгідно!"
 SEA_japan_foreign_policy.119.t:0 "[FROM.GetNameDefCap] приймає наше запрошення"
 SEA_japan_foreign_policy.125.t:0 "[FROM.GetNameDefCap] приймає наше запрошення"
 SEA_japan_foreign_policy.132.a:0 "Ми не маємо достатньо сил, щоб відхилити їхні вимоги"
 SEA_japan_foreign_policy.135.a:0 "Процвітання вже на горизонті!"
 SEA_japan_foreign_policy.17.desc:0 "Регіональні адміністратори області [729.GetName] забули своє місце і вирішили відхилити вимоги, раніше висунуті їм нашими губернаторами в [592.GetName]. Настав час знищити [FROM.GetAdjective]у імперію раз і назавжди!"
 SEA_japan_foreign_policy.20.desc:0 "[FROM.GetLeader] грубо вирішив відхилити нашу пропозицію про союз між нашими націями, заявивши, що це суперечило б їхньому принципу нейтралітету. Ми можемо лише уявити масштаби корупції, що призвели до цього помилкового рішення."
 SEA_japan_foreign_policy.28.a:0 "Чудово"
 SEA_japan_foreign_policy.3.a:0 "Вони виявили неповагу до Імператора, цього не можна терпіти!"
 SEA_japan_foreign_policy.40.a:0 "Верховна влада Імператора завжди повинна бути на першому місці!"
 SEA_japan_foreign_policy.42.a:0 "Це в наших інтересах"
 SEA_japan_foreign_policy.46.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прихильно відреагував на нашу пропозицію, і їхні дипломати прибули до нашої країни для підписання необхідних документів, що сприятимуть подальшій економічній інтеграції."
 SEA_japan_foreign_policy.50.desc:0 "Інтеграції наших економік виявилося недостатньо, щоб вдовольнити [FROM.GetAdjective]ів, оскільки [FROM.GetLeader] з [FROM.GetNameDef] сьогодні висунув вимогу нашої повної інтеграції до їхньої країни. Якщо ми негайно не розірвемо з ними стосунки, це стане кінцем нашого статусу незалежної нації. Як нам вчинити?"
 SEA_japan_foreign_policy.65.t:0 "[FROM.GetNameDefCap] відхиляє об'єднання"
 SEA_japan_foreign_policy.69.a:0 "Дайте їм відсіч, знищіть усіх зрадників!"
 SEA_japan_foreign_policy.75.desc:0 "Здається, нашим контактам у [FROM.GetNameDef] нарешті вдалося укласти угоду з керівництвом країни після того, як фракція Кодоха, до якої належала більшість наших контактів, нещодавно захопила уряд після успішного державного перевороту. Хай живуть два імператори!"
 SEA_japan_foreign_policy.88.a:0 "Чудово"
 SEA_japan_foreign_policy.98.t:0 "[FROM.GetNameDefCap] погоджується на торговельну пропозицію"
 SEA_japan_news_events.03.a:0 "Ще одна перемога над імперіалізмом!"
 SEA_japan_popup_events.17.desc:0 "Багато високопосадовців як в Імперській армії Японії, так і в Імперському флоті Японії заявили, що армія оголошує страйк після декларації нашого уряду покласти край їхньому впливу на нашу політику. Вони кажуть, що не будуть захищати нинішній уряд у разі нападу, і, ймовірно, вже планують черговий державний переворот, щоб усунути нашого прем'єр-міністра від влади."
 SEA_japan_popup_events.18.t:0 "Військові окопуються"
 SEA_japan_popup_events.2.a:0 "Він не був створений на віки"
 SEA_japan_popup_events.23.t:0 "Самозаспокоєний Імператор"
 SEA_japan_popup_events.29.t:0 "Інцидент у Міядзакі"
 SEA_japan_popup_events.3.t:0 "Дебати про харакірі"
 SEA_japan_popup_events.42.desc:0 "Оскільки театри бойових дій Східноазійської війни перетворюються на політичні мінні поля, а величезні території залишаються беззахисними перед ворогом, народ починає сумніватися в компетентності [ROOT.GetLeader] щодо перемоги у війні. Якщо ситуацію не вирішити терміново, або шляхом пожвавлення військових зусиль, або шляхом залучення більш компетентного кабінету міністрів, війну можна буде вважати фактично програною..."
