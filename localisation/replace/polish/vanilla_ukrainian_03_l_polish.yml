 denmark_overlord_events.20.desc:0 "Не секрет, що [FROM.GetnameDef] активно підтримує [FROM.GetRulingIdeologyNoun_RU_lower_Acc], а [ROOT.GetRulingIdeologyNoun_RU_lower_Nom] для них — лише об'єкт презирства. Тому нікого не здивувало те, як охололи стосунки держави з одним із сателітів, що дотримується якраз цієї ненависної ідеології. Наша метрополія недвозначно вказує нам на те, що [ROOT.GetRulingIdeologyNoun_RU_lower_Nom] бути нашою ідеологією не може."
