 WW_hungary.115.desc:0 "Керівництво [FROM.GetNameDef] публічно заявило про підтримку права народу [73.GetName] на самовизначення. «Настав час дозволити людям обирати свою державу», — сказав [FROM.GetLeader], фактично відмовившись від претензій на цей регіон."
 WW_hungary.12.desc:0 "Розсудливий [FROM.GetLeader] з [FROM.GetNameDef] погодився передати нам контроль над їхніми територіями в Словаччині та наказав своїм військам відійти. Ми знову здобули перемогу!"
