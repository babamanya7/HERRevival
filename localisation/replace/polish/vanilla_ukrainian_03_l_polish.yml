 SEA_border_incidents_events.7.a:0 "Це село все одно нічого не варте"
 SEA_china.15.desc:0 "Щоб задобрити тих у наших збройних силах, хто наполягає на війні, [CHI.GetName] передав контроль над [FROM.GetName] нам. Схоже, у нас не буде конфлікту в найближчому майбутньому."
