 NAVAL_BASE_TOOLTIP_SELECTION_INFO:0 "§GКлацніть§!, щоб обрати оперативні групи, які знаходяться або призначені до ремонту на цій базі.\n§GCtrl + клацніть§!, щоби перемкнути стан ремонту.\n§GShift + клацніть§!, щоби показати чергу на ремонт.\n§GCtrl + клацніть ПКМ§!, аби задати як §Gбазу приписки§!."
