 HUN_cruisers:0 "Крейсери"
 HUN_demand_the_vojvodina_desc:0 "Якщо ми зможемо повернути свої території без зайвого кровопролиття, для всіх буде тільки краще. Ми висунемо Югославії ультиматум із вимогою повернути нам наші законні землі."
