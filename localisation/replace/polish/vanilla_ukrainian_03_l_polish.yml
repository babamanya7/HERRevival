 LEND_LEASE_INFANTRY_BUTTON_DISABLED:0 "§TМи не виробляємо оснащення піхоти й артилерії та не маємо його на складах§!"
 LIB_democratic_DEF:0 "Ліберія"
 LIT_events.502.desc:0 "[From.GetNameDef], що не дивно, відмовляється виконувати вимоги, в яких [Root.GetLeader] наполягає на поверненні Вільнюса державі [Root.GetNameDef]. Хоча дипломатичні заходи й не мали успіху, [Root.GetLeader] може спробувати уникнути війни, яка тепер, коли на кордоні зростає напруга, практично гарантована."
 LIT_events.7.t:0 "[From.GetNameDefCap] просить вступу [POL.GetAdjective] держави до альянсу [Root.GetFactionName]"
 LIT_events.8.d:0 "[Root.GetAdjective] представники давно прагнуть відтворити минулу унію, але незмінно стикаються з відмовою литовців. Сьогодні ж [From.GetLeader] приймає історичне рішення — запропонувати возз'єднання Польщі та Литви. Як не дивно, ця пропозиція не ставить поляків і литовців на один рівень — [From.GetLeader] хоче бути абсолютним диктатором обох націй."
 LIT_organize_the_iron_wolf_desc:0 "Організація «Залізний вовк», як і раніше, розрізнена і неорганізована; до того ж, як і сам Вольдемарас, вона досі не вирішила, чи підтримати уряд, чи скидати його. Давши «Залізному вовку» і ціль, ми зробимо із заблукалих хлопчиків чоловіків."
 LIT_reminder_of_true_enemy_desc:0 "Під час війни 1918 року ми зіткнулися з жорстоким пригнобленням з боку Червоної армії та Добровольчого корпусу. Тепер, коли на горизонті замаячила війна, розуми литовських міністрів затьмарюють гіркі спогади про них. — головна загроза для нас і як слід готуватися до війни!"
 LIT_victory_in_trust:0 "Перемога в довірі"
 LOADING_SAVEGAME:0 "Завантаження збереженої гри: $NAME$"
