 JAP_advance_one_hundred_million_fireballs_desc:0 "Асоціація допомоги трону висунула гасло «Вперед, сто мільйонів вогняних куль», яке використовуватиметься для вираження гніву народу щодо Заходу та зростання бойового духу. Якщо для перемоги над нашими ворогами потрібні жертви, то наше населення неодмінно віддасть свої життя за Імперію!"
