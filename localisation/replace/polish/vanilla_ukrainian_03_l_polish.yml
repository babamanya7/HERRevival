 infantry_at_desc:0 "Обладнавши нашу піхоту протитанковими рушницями, ми дозволимо їй знищувати легку бронетехніку, не втрачаючи мобільності."
 infiltrate_military_ideological_supporter_desc:0 "Ми скористаємося таємними дипломатичними каналами, щоби знайти в [From.GetAdjective]ій адміністрації тих, хто не поділяє політичні погляди уряду, і спонукаємо цих людей працювати на нас."
