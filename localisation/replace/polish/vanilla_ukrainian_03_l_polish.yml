 SIA_prepare_to_drop:0 "Підготуватися до висадки"
 SIA_relocate_the_capital_to_phetchabun_desc:0 "Уряд під загрозою! Як довела історія, Бангкок вразливий до військово-морських атак, і хоча це, безперечно, буде непопулярним рішенням, перенесення столиці далі вглиб країни є рішенням, яке необхідно прийняти."
 SIA_sway_luang_haansongkhram_to_seri_thai_desc:0 "Залучити Луанга Хаансонгкрама на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_war_fervor_desc:0 "Барабани б'ють в очікуванні майбутнього конфлікту. Народ підготовлений, сірник запалений, і воєнний запал скоро досягне свого зеніту. Ми повинні подбати про те, щоб спрямувати цю енергію на гідну справу."
