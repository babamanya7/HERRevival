 BRA_imperial_house:0 "Імперці"
 BRA_invest_in_road_infrastructure_desc:0 "Автомобілі та вантажівки стають все більш важливими для економічного розвитку. Однак наші дорожні мережі недостатньо розвинені, щоб підтримати масове впровадження транспортних засобів у національному масштабі. Тому нам потрібно інвестувати у масштабну програму будівництва автомагістралей, перш ніж наша економіка буде стримуватися."
 BRA_invite_to_faction:0 "$DEN_invite_nordic_countries$"
 BRA_issue_lordships_desc:0 "Коли ми починаємо повертати контроль над нашими законними володіннями, тягар контролю над різноманітними регіонами стає обтяжливим для нашого дорогого монарха. Тому він проголосив, що нові земельні королівські титули будуть видані тим, кого вважатимуть надійними, щоб допомогти в управлінні королівством."
 BRA_license_soviet_designs_desc:0 "Наші дослідження відстають від великих держав. Нарощування потенціалу, щоб наздогнати їх, займе багато часу, але до тих пір ми можемо спробувати отримати дозвіл на виробництво обладнання від [SOV.GetNameDef] у [BRA.GetNameDef]. Враховуючи витрати на таку угоду, ми повинні спробувати домовитися про невелику знижку."
 BRA_organization_of_american_states_decision_cat:0 "Організація південних держав"
 BRA_political_military_balance:0 "Цивільний і військовий уряди"
 BRA_restore_the_coffee_barons_desc:0 "Колись могутні кавові барони, які десятиліттями контролювали [ROOT.GetAdjective] політику, були усунені від влади під час революції 1930 року. Багато хто зберігає значний економічний вплив і може бути переконаний підтримати наш рух за відновлення імперії в обмін на політичні поступки."
 BRA_rio_conference_desc:0 "Нещодавні конфлікти загострили давні прикордонні суперечки в нашому регіоні. Перш ніж ці суперечки загостряться ще більше, нації Південної Америки повинні об'єднатися та вирішити їх дипломатично."
 BRA_spirit_of_acre_war_desc:0 "Хоча регіон Акрі зараз перебуває під нашим контролем, ми могли б використати історичні прикордонні конфлікти там як виправдання, щоб відхопити більше Болівії. Це могло б дати нам доступ до великої кількості нерозвіданих природних ресурсів, забезпечуючи нашу промисловість на десятиліття вперед."
 BRA_spread_the_revolution_desc:0 "Революція, яку ми принесли в [BRA.GetNameDef], була дуже високо оцінена нашим народом. Тепер, коли ми стабілізували наші внутрішні справи, настав час мислити ширше і дивитися за межі наших кордонів."
 BRA_third_republic_democratic:0 "Третя Бразильська республіка"
 BRA_work_with_the_integralists_desc:0 "Цілі інтегралістського руху багато в чому збігаються з нашими власними, тому може бути розумно заручитися їхньою підтримкою, щоби зміцнити наш режим проти будь-яких подальших комуністичних повстань. З їхніми воєнізованими силами і глибоко вкоріненим націоналізмом вони стануть авангардом контрреволюції."
 BRI_fascism_party_long:0 "Бретонська національна партія"
