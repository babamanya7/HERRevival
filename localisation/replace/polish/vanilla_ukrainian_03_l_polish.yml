 anzac_tt:0 "Граючи як [AST.GetNonIdeologyName] або [NZL.GetNonIdeologyName], розгорніть генерала у [GRE.GetNonIdeologyAdjective]ій осердній області до 1 січня 1945 р. та запевніться, що [GRE.GetNonIdeologyName] не капітулювала."
