 DEN_avenging_1864:0 "Помста за 1864"
 DEN_avenging_1864_desc:0 "Принизлива поразка 1864 року вже понад півстоліття ранить нашу націю. Настав час раз і назавжди убезпечити наш південний кордон і гарантувати, що жоден ворог більше ніколи не зможе диктувати нам умови, яких ми повинні дотримуватися."
 DEN_bop_occupation_funnel_resources_danish_brigade_desc:0 "[?DEN.hosts_danish_brigades.GetNameDefCap] люб'язно погодився прийняти та навчити данські війська, які можуть допомогти у звільненні [ROOT.GetNameDef], коли прийде час. Але переконатися, що ці війська мають найкращі можливі шанси досягти успіху в завданні з визволення нашої країни, ми повинні допомогти грошима і матеріалами."
 DEN_bop_occupation_raid_depots_desc:0 "Наші вітчизняні збройові заводи виробляють і допомагають [?DEN.DEN_overlord_nation.GetNameDef] зброєю, зброєю, яка використовується у їхніх війнах. Напади на склади зброї зменшать поставки зброї, водночас посиливши наш рух опору."
 DEN_bop_speak_out_against_warfare:0 "£BoP_left_texticon Висловитися проти військового переозброєння"
 DEN_bop_speak_out_in_favor_of_disarmament_desc:0 "Як маленька держава, оточена великими державами, ми не маємо надії стримати вторгнення, тож навіщо витрачати гроші на оборону, яка ніколи нам не допоможе, але може й розлютити наших набагато більших сусідів?"
 DEN_bop_speak_out_in_favor_of_rearmament_desc:0 "Ми не можемо сидіти склавши руки, коли решта Європи перебуває в гонці озброєнь і попереду невизначені часи. Ми повинні підготувати нашу оборону та почати переозброєння якнайшвидше, бажано вчора!"
 DEN_buy_allied_weapons:0 "Закупівля зброї для союзників"
 DEN_danish_military_cooperation_program_desc:0 "Датська ініціатива з метою створення програми військового співробітництва для обміну технологіями."
 DEN_demand_norwegian_territory:0 "Вимогти [NOR.GetFlag][NOR.GetAdjective]і території"
 DEN_election_consequences_tt:0 "Будь-яка політична партія з §Y25% популярності§! або більше може сформувати уряд."
 DEN_escalate_the_sabotages_desc:0 "Стає все більш очевидним, що нам доведеться знову боротися за свою свободу. Ми повинні посилити наші диверсійні зусилля в напрямку [?DEN.DEN_overlord_nation.GetAdjective]ої окупації."
