 FIN_bop_modifier_strong_nation:0 "Дужа держава"
 FIN_cancel_motti_tactics_in_state_desc:0 "Наші війська більше не використовуватимуть тактику motti в області [FROM.GetName], тому військові ресурси можна перемістити в інше місце."
 FIN_children_destination_other:0 "нейтральні країни, не залучені до військових конфліктів"
 FIN_coastal_defense_desc:0 "Перед обличчям зовнішньої агресії дуже важливо забезпечити надійний захист узбережжя Фінляндії. Покращуючи інфраструктуру берегової оборони, ми можемо краще підготуватися до абияких можливих загроз із моря."
 FIN_cooperate_with_social_democrats_desc:0 "Хоча вони явно помиляються у своїй готовності йти на компроміс із капіталістами, ми не можемо заперечувати, що соціал-демократи користуються великою підтримкою з боку пролетаріату, і багато їхніх лідерів є експертами у своїх галузях. Ми повинні робити більше, щоб співпрацювати з їх у створенні нашої робітничої республіки."
 FIN_elijarvi_mine:0 "Шахта Еліярві"
 FIN_fight_alongside_country_comrades_baltic_desc:0 "$SOV_fight_alongside_country_comrades_baltic_desc$"
