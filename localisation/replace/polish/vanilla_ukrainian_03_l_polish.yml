 congo_independence_struggle.13.t:0 "Конго відступає і погоджується стати заморською територією"
 congo_independence_struggle.2.c:0 "Ми ніколи не дозволимо їм піти добровільно!"
 congo_independence_struggle.3.d:0 "Ми отримали новину від [BEL.GetName], і вони визнали, що епоха колоніальних імперій швидко добігає кінця. Тому вони запропонували нам приєднатися до [Bel.GetAdjective] Співдружності як вільна та незалежна нація, а отже — як рівний партнер. Ми все одно будемо зобов'язані виконувати ті ж умови, що й інші військові союзники, і, отже, повинні будемо вступити в будь-які війни разом. \n\nЦе, ймовірно, найбільш дипломатичний результат, на який ми могли б сподіватися, і це дозволить нам уникнути кровопролиття з нашими європейськими друзями, при цьому підтримуючи африканську гордість та незалежність."
 congo_independence_struggle.9.d:0 "Сьогодні вранці світанок розпочався з гучних пострілів, коли повстанці з Сил Публіки атакували урядові будівлі в Леопольдвілі. Лояльні охоронці дали відсіч і змогли відкинути повстанців, однак напруга надзвичайно висока, і є повідомлення про нові бунти серед підрозділів Сил Публіки, а також про те, що місцеві міліції почали озброюватись та збиратись по всьому Конго."
 conscription_exemptions_granted:0 "Надано звільнення від призову"
 construction1_desc:0 "Поліпшені методи та матеріали дозволяють нам швидше зводити цивільні та військові споруди."
 construction_tech:0 "Технології будівництва"
 control_newfoundland_bases_goal_desc:0 "Забезпечення баз на Ньюфаундленді дозволить нам здійснювати контроль над конвоями Північної Атлантики та проектувати повітряну та військово-морську силу вздовж життєво важливих судноплавних маршрутів."
 control_panama_canal_goal_name:0 "Контролювати Панамський канал"
 control_suriname_bauxite_goal_desc:0 "Володіння багатими родовищами баукситу Суринаму забезпечить сировиною, необхідною для зростаючої авіаційної промисловості нашого альянсу."
 convert_neighbours_baltic_cat_desc:0 "Революція мала приголомшливий успіх тут, у держави [Root.GetNameDef], усе, що залишається зараз, це поширити слово про революцію серед наших братів з Балтії. Робітники Балтії будуть звільнені від своїх буржуазних поневолювачів своїми руками, але певна [Root.GetAdjective]а допомога допоможе їм на цьому шляху."
