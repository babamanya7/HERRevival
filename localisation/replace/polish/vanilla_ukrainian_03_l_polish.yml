 ARG_political_events.28.t:0 "[CHL.GetNameDefCap] погоджується на умови ультиматуму"
 ARG_political_events.3.t:0 "[ARG.GetName] пропонує приєднатися до Союзників"
 ARG_political_events.32.a:0 "Прийняти їхні умови. У нас є більші загрози, з якими потрібно впоратися."
 ARG_political_events.38.b.tt:0 "Передає §YЕкваторіальну Гвінею§! до §Y[ARG.GetName]§!"
 ARG_political_events.43.a:0 "Фантастично!"
 ARG_political_events.6.desc:0 "Наша пропозиція взяти під контроль Фолклендські та Південна Джорджія острови була прийнята [FROM.GetAdjective] урядом. Тепер, коли острови по праву аргентинські, ми можемо почати працювати над захистом наших вод під час цього конфлікту."
 ARG_royal_airforce_influence_desc:0 "Тепер, коли наші зв'язки з Британією тісніші, ми повинні подивитися, чи можемо ми навчитися і з їхніх військових зусиль. Королівські повітряні сили широко поважаються, і вивчення їхніх операцій, ймовірно, буде корисним. Поки ми цим займаємося, ми повинні розглянути можливість придбання деяких схожих літаків."
 ARG_support_radical_nationalism:0 "Підтримати радикальний націоналізм"
 ARG_technical_schools_desc:0 "Розвиваючи технічні школи, ми можемо активно збільшити кількість технічних радників, яких ми можемо наймати в уряді. Подальше просування цього типу освіти, безсумнівно, допоможе підвищити нашу економічну майстерність."
 ARG_universidad_de_buenos_aires:0 "Universidad de Buenos Aires"
 ARG_usa_loan_repaid_flag:0 "[USA.GetAdjective]у позику сплачено"
 ARMY_LEDGER_THRESHOLD_TEMPLATE_COUNT:0 "Кількість дивізій за шаблонами"
 ARMY_NAVIES_MISSION_NO_REGIONS:0 "§RНе обрано стратегічний регіон у зоні досяжності.§!"
 ARMY_SORT_NAME:0 "Назва"
 ARM_UK_autonomy_colony_DEF:0 "Губернаторство Вірменія"
 AST_EQUIPMENT_VERSION_5:0 "Mk V"
 AST_a_convenient_disaster_tt:0 "\nЦя подія порушить роботу діючого уряду, що в кінцевому підсумку дозволить §Y[AST.GetFascistParty]§! стати правлячою партією."
 AST_abandon_the_westminster_system:0 "Покинути Вестмінстерську систему"
 AST_administer_the_mandate:0 "Керувати мандатом"
 AST_australia_first_party_focus_desc:0 "Кількість членів «Австралії понад усе» зросла настільки, що просування руху вже неможливо стримати. Настав час австралійській громадськості вітати новозареєстрований, найгучніший націоналістичний голос: Партію «Австралія понад усе»."
 AST_australia_formables_category_desc:0 "Хоча коріння [AST.GetName] завжди прив'язуватиме нас до далекого півдня, наші руки стали довгими й далекосяжними, і зробили неможливим для інших замітати наші погляди на світові справи під килим. Ми розширилися і можемо розширюватися далі, і нова назва нашої нації зробить це зрозумілим. З кокона [AST.GetName] ми виходимо, розправляючи крила, щоб світ міг захоплюватися та визнавати, називаючи наші кольори та візерунок новою нацією на півдні — Австралазією."
 AST_australian_pivot_modifier:0 "Австралійський розворот"
 AST_bring_on_the_giant_desc:0 "Як об'єднана та автономна нація, нарешті, ми незабаром пройдемо випробування нашої хоробрості. Інший берег Тихого океану, здається, поділяє наші інтереси, і з її розвиненою військовою промисловістю, [USA.GetNameDef] може принести велику користь і собі, і Австралії, надавши частину своїх багатих запасів у лізинг нашим військам."
 AST_bwc_accept_tt:0 "Прийняти виклик §Y[?var:AST_bwc_accept]§!/§Y3§! раз(и)"
 AST_cabinet_trust_decrease_tt:0 "\n§RЗменшити§! §YДовіру до Кабінету§!\n"
 AST_canberra_air_disaster_events.6.b:0 "Це не може залишитися без відповіді."
 AST_canberra_air_disaster_events.6.t:0 "[JAP.GetNameDefCap] відповідає ударом на удар"
 AST_council_for_scientific_and_industrial_research:0 "Рада з наукових і промислових досліджень"
 AST_cv_CAS_equipment_1:0 "Hawker Osprey"
 AST_daimler_dingo:0 "Daimler Dingo"
 AST_deteriorating_prime_minister_nerves_desc:0 "[AST.GetLeader] напружується під тиском неминучої війни. Якщо полегшення не знайдеться найближчим часом, його нерви можуть не витримати."
 AST_diplomatic_events.20.desc:0 "[GET_AST_BWC_COUNT][ENG.GetNameDefCap] викликає прем'єр-міністра Австралії до Британського воєнного кабінету. Ситуація у світі є жахливою, що спонукає Британію шукати спільні стратегії та військову співпрацю зі своїми союзниками.\n\nОднак Австралія має власні проблеми. Чи можемо ми виділити трохи часу прем'єр-міністра, щоб догодити британцям?"
 AST_diplomatic_events.26.desc:0 "[ENG.GetNameDefCap] погоджується; Тихоокеанський регіон буде зміцнений під централізованим контролем. Британські тихоокеанські території були передані під нашу владу."
 AST_diplomatic_events.28.desc:0 "Телеграфна суперечка прем'єр-міністра з [ENG.GetLeader] не принесла Австралії майже ніякого підкріплення, але посилила обурення британців щодо [AST.GetLeader] за просування інтересів Австралії."
 AST_diplomatic_events.30.desc:0 "Агресори-експансіоністи дивляться на Індокитай не лише заради самої території, а й заради ресурсів, якими він володіє. Якщо багатства потраплять у ворожі руки, вони лише затягнуть війну, тоді як в австралійських руках вони могли б допомогти її закінчити; принаймні, так стверджує уряд Австралії.\n\nЧи маємо ми погодитися надати їм права на ресурси на нашій території?"
 AST_diplomatic_events.45.desc:0 "[ENG.GetNameDefCap] відмовилася від передачі своїх територій у Південно-Східній Азії нам. Тим не менш, привабливість контролю над регіоном залишається для нас очевидною, і хоча він не стане нашим за запитом, він ще може стати нашим."
 AST_diplomatic_events.64.t:0 "Ірландія погоджується!"
 AST_diplomatic_events.66.desc:0 "Представники [FROM.GetLeader] передали його подяку за підтримку наших добровольців та за надані військові матеріали. Багатий [FROM.GetAdjective] досвід громадянської війни, безумовно, означає, що ці ресурси будуть використані ефективно."
 AST_election_events.2.desc:0 "$AST_democratic_party_long$ очолює [AST.GetName] з 1931 року, вивівши націю з Великої депресії та віддаливши від антидемократичних настроїв. Завдяки стабільному керівництву, консервативним поглядам і лояльності до Британії, ОАП зміцнила свою підтримку, і ще один термін стає все більш імовірним. Проте інша партія все ще має право голосу.\n\nВсе ще оговтуючись від вотуму недовіри, який усунув її від влади в 1931 році, $AST_labor_party_long$ починає відновлювати позиції. Коли комуністичні голоси змусили замовкнути, робочий клас шукає новий орієнтир. У своїй місії представляти кожного громадянина, АЛП прийняла інший погляд на імперіалізм та лояльність Австралії до Імперії. Внутрішні потреби мають бути на першому місці, а зовнішні інтереси більше не повинні бути пріоритетом.\n\nДо наступних федеральних виборів залишається півтора року. Якщо ОАП хоче забезпечити собі ще одну перемогу, її лідери повинні прискорити реформи, щоб зберегти підтримку громадськості. Інакше кампанія АЛП може знову відновити їхні позиції."
 AST_eng_as_faction_leader_tt:0 "\n[ENG.GetFlag]§Y[ENG.GetName]§! $AST_faction_leader_tt$."
 AST_free_the_colonies:0 "Звільнити колонії"
 AST_heavy_cruiser_3:0 "Клас «Admiral»"
 AST_heavy_tank_aa_equipment_1:0 "Matilda II Anti-Air"
 AST_heavy_tank_artillery_equipment_3_short:0 "Black Prince SPA"
 AST_japanese_war_mission_desc:0 "Австралія не хоче стикатися зі своїм переважним ворогом наодинці — [JAP.GetNameDef]. Вони тиснуть на нас, щоб ми зробили перший крок і врегулювали назріваючий конфлікт за першої ж нагоди."
 AST_jungle_tanks_if_sentinel_tank_development:0 "Якщо ми завершили «Розробка танка Sentinel»:"
 AST_m_special_unit:0 "Спецзагін M"
 AST_medium_tank_aa_equipment_1_short:0 "M3 Grant AA"
 AST_medium_tank_artillery_equipment_2_short:0 "Sentinel SPA"
 AST_medium_tank_destroyer_equipment_2:0 "AC I Sentinel Tank Destroyer"
 AST_medium_tank_equipment_2_short:0 "Sentinel"
 AST_mio_trait_commonwealth_exports:0 "Експорт до країн Співдружності"
 AST_mio_trait_nuffield_liberty_engine_refinement:0 "Вдосконалення двигуна Liberty"
 AST_mio_trait_nuffield_pursuit_doctrine_optimisation:0 "Оптимізація доктрини переслідування"
 AST_nauru_pact:0 "Пакт Науру"
 AST_political_events.2.desc.b:0 "Громадськість погодилася на впровадження нашої маркетингової реформи. Маючи повноваження регулювати сільськогосподарську продукцію та її збут, уряд тепер зможе стабілізувати ринки та покращити співпрацю між штатами. Доходи фермерів стануть стабільнішими, як і національна економіка."
 AST_political_events.5.a:0 "Тільки час покаже справжню природу руху."
 AST_radium_hill_desc:0 "У Південній Австралії було знайдено уран, і шахта Редіум-Гілл має значний потенціал для розширення. Хоча ми все ще розкриваємо всі можливості цих нових технологій, очевидно, що ми стоїмо на порозі Атомного віку, і це може стати нашим квитком до нього."
 AST_rationing_and_recycling_desc:0 "Нам потрібні усі ресурси до останнього. Ми введемо продаж продуктів за картками для громадян, повторно використовуватимемо весь доступний металобрухт і пропагуватимемо ощадливість у масштабах країни."
 AST_realize_the_value_of_british_citizenship:0 "Усвідомити цінність британського громадянства"
 AST_realize_the_value_of_british_citizenship_desc:0 "Панування [ENG.GetNameDefCap] над [AST.GetName] довго слугувало нашій нації як захисним щитом, так і дороговказом. Ми походимо від Британії, і ми залишимося з Британією — доки це буде нам на користь."
 AST_the_phosphate_commision_desc:0 "Після Великої війни Науру було передано під спільну опіку Австралії, Нової Зеландії та Великої Британії. У 1919 році права на весь продаж фосфатів на острові були передані цим опікунам, на чолі з Австралією. Використовуючи нашу лідерську позицію, ми можемо впливати на ціноутворення та забезпечити надзвичайно конкурентні ціни для нашого внутрішнього ринку."
 AST_the_swpa_menace:0 "Загроза для ЗПЗТО"
 AST_uap_70_discount:0 "\n\n§YЕфект від >70% Демократичних голосів§!:\nКластери фокусів §YУАП§!:\nСкорочення часу завершення на §Y10§! днів."
 AST_union_control_progressbar_pip_1:0 "Доступно"
 AST_union_control_tt:0 "Профспілки повинні закріпитися в штатах по всій Австралії, однак ветерани Нової гвардії працюють над тим, щоб перешкодити поширенню комунізму."
 AST_war_carriers:0 "Військові носії"
 AST_well-being_of_the_community_desc:0 "Християнські ідеали життя та сім'ї мають високо цінуватися австралійським населенням. Однак, з огляду на низький рівень народжуваності в останні роки, ці ідеали беззаперечно недостатньо шанувалися. Заради добробуту громади ми запустимо кампанію з популяризації сімейного життя."
 ASY_fascism_party:0 "ВР"
 ASY_neo_assyrian_empire_neutrality_ADJ:0 "Новоассирійськ"
 ASY_neutrality_ADJ:0 "Ассирійськ"
 AUS_STATE_9:0 "Бьомен"
 AUS_VICTORY_POINTS_619:0 "Нойзац"
 AUS_VICTORY_POINTS_9427:0 "Кракау"
 AUS_anschluss_risk_low_tt:0 "Ризик аншлюсу на даний момент §GНизький§!."
 AUS_austrian_empire_fascism:0 "Австрійська імперія"
 AUS_basic_tanks:0 "Удосконалення танків"
 AUS_becoming_grossosterreich_category:0 "Наша мрія, наша [GetGrossosterreichCosmeticIdeology]"
 AUS_bring_back_the_habsburg_rule:0 "Володар нашої Корони"
 AUS_centralize_the_industrial_sector_desc:0 "Минає час і комуністичні настрої вкорінюються в нації, тепер ми можемо вживати більш рішучих заходів. Кілька років тому наші люди не сприйняли саму ідею централізації галузі, однак тепер це здається наступним логічним кроком."
 AUS_dsn:0 "Direktion Staatsschutz und Nachrichtendienst"
 AUS_emergency_measaures:0 "Надзвичайні заходи"
 AUS_extend_italian_claims:0 "Поширити наші претензії на Італію"
 AUS_german_animosity_towards_high_command:0 "[GER.GetAdjective]а ворожість до нашого верховного військового командування"
 AUS_grossosterreich_fascism_ADJ:0 "Великоавстрійськ"
 AUS_habsburg_alliance:0 "Габсбурзький альянс"
 AUS_infantry_equipment_1:0 "Steyr Stutzen M95/30"
 AUS_integrate_northwest_desc:0 "Щоби якнайкраще використовувати території, які ми зараз повернули, слід переконатися, що нація залишається єдиною. Держави, які виявляться найбільш охочими та корисними, мають бути якомога швидше інтегровані власне до Імперії. Території, які ми вимагали від Чехословаччини, виявилися найбільш перспективними. Треба негайно починати інтеграційні зусилля!"
 AUS_join_the_allies_tt:0 "Імовірність того, що нас приймуть до членства, залежить від нашої демократичності та думки лідера альянсу щодо нас.\n\nЯкщо нам відмовлять, ми зможемо створити власну фракцію."
 AUS_join_the_research_program_desc:0 "Тепер, коли ми перебуваємо у фракції з нашими однодумцями, ми повинні намагатися отримати від цього якомога більше користі. Сформувавши групу для обміну технологіями для нас і наших союзників, ми зможемо зміцнити фракцію шляхом технологічному блиску."
 AUS_nazism_DEF:0 "Німецько-соціальна Австрія"
 AUS_news_events.12.b:0 "Прийнято"
 AUS_news_events.5.t:0 "Австрія скасовує Сен-Жерменський Договір"
 AUS_political_events.1.a:0 "Найбезпечніше залишити так, як є."
 AUS_political_events.114.t:0 "[FROM.GetNameDef] пропонує промислову підтримку"
 AUS_political_events.4.a:0 "Позбутися зрадника!"
 AUS_political_events.48.t:0 "[FROM.GetNameDefCap] садить Габсбурзького монарха на наш трон"
 AUS_political_events.50.a:0 "Гідна угода!"
 AUS_political_events.52.desc:0 "На основі давніх претензій і родинних зв’язків, [FROM.GetAdjective]ий монарх Австрії вимагає, щоб ми підкорилися його правлінню. Стверджуючи, що місто Габсбург, як старе володіння його родини, по праву належить його країні. По його словам, ми повинні негайно інтегруватися, або зіткнутися з гнівом його щойно відбудованої армії."
 AUS_political_events.55.desc:0 "[FROM.GetAdjective] керівництво звернулося до нас із пропозицією. Вони давно хотіли придбати у нас 2 регіони: [39.GetName] і [850.GetName]. Сьогодні їх дипломати відвідали нас, пропонуючи фінансування будівництва кількох заводів натомість, якщо ми практично передамо їм ці регіони."
 AUS_political_events.8.t:0 "[FROM.GetNameDefCap] відхиляє запропоноване партнерство"
 AUS_political_events.9.a:0 "Тож [GER.GetAdjective]і варвари не тільки вбивці, але й брехуни..."
 AUS_political_events.95.a:0 "[ROOT.GetNameDef] вітає вас!"
 AUS_political_events.98.b:0 "Значить, наша власна безпека лише в наших руках!"
 AUS_promote_admirals_fasc_com_tt:0 "Відкриває §YКарла Гайнца Бірнбахера§! (2-го рівня) в якості адмірал"
 AUS_raid_military_storages:0 "Спустошити старі військові запаси"
 AUS_reclaim_dockyards:0 "Перебудова старих верфей"
 AUS_seek_soviet_support_desc:0 "Якщо ми хочемо протистояти німецькій загрозі на півночі та перетворити нашу країну на комуністичне суспільство, якого ми заслуговуємо, нам знадобиться підтримка ззовні. У нас були невеликі ідеологічні розбіжності з Радянським Союзом, однак в нашій основі ми все ще маємо багато спільного."
 AUS_suddeutschland_neutrality_DEF:0 "Південна Німеччина"
 AUS_the_czechoslovakian_lands:0 "Богемія і Північна Угорщина"
 AUTONOMY_CAN_TAKE_DESC:0 "$OWNER|UH$ може отримати статус $NEXTLEVEL|lH$"
 AZR_neutrality:0 "Ісламська республіка Азербайджан"
 AZR_neutrality_ADJ:0 "Азербайджанськ"
 BALTIC_ENTENTE_FACTION:0 "Балтійська Антанта"
 BALTIC_align_paramilitarists:0 "Заручитися лояльністю бойовиків"
 BALTIC_events.301.d:0 "[Root.GetLeader] просить про пряме втручання, але наші друзі та союзники в державі [From.GetNameDef] відповіли відмовою. [From.GetLeader] заявляє, що, якщо [Root.GetAdjective] робітники хочуть свободи, вони повинні досягти її самі і будь-яке пряме втручання держави [From.GetNameDef] буде розцінено як акт імперіалізму."
 BALTIC_events.6.a:0 "[From.GetLeader] справа каже, ми мусимо об'єднатися!"
 BALTIC_events.701.d:0 "[From.GetNameDef] блокує [Root.GetAdjective] запит на вторгнення в державу [baltic_wargoal_target.GetNonIdeologyName]. [baltic_wargoal_target.GetNameDef] відмовляється боротися з комуністичними і виправдовує [From.GetAdjective] та [Root.GetAdjective] втрат."
 BALTIC_events_15_tt:0 "Станеться подія §Y[Root.GetNameDefCap] просить про вторгнення в Литву§!."
 BALTIC_renew_allied_trade:0 "[GetBalticRenewAlliedTradeTitle]"
 BALTIC_soviet_volunteer_forces_desc:0 "СРСР буквально сповнений тих, хто готовий боротися і вмирати за світову революцію. Хоча [Root.GetNameDef], по суті, лише чергова сходинка на шляху до світового комунізму, браку відважних російських соціалістів, готових загинути за нашу справу."
 BAN_fascism:0 "Бенгальська держава"
 BASE:0 "Базова величина:"
 BASE_STATE_SUPPLY:0 "Базова величина: $VAL|.2H$"
 BATTLE_FOR_THE_BOSPORUS:0 "Battle for the Bosporus"
 BBA_african_union_events.1.a:0 "Членство піде нам на користь."
 BBA_african_union_events.11.t:0 "Тиск з боку [FROM.GetAdjective]"
 BBA_african_union_events.14.t:0 "[FROM.GetNameDefCap] виходить з Організації Африканської Єдності"
 BBA_african_union_events.16.desc:0 "[FROM.GetNameDefCap] відмовилися від участі в оборонній угоді Організації Африканської Єдності. Залишається з’ясувати, чи це зміна їхнього довгострокового курсу, чи просто невдалий момент через внутрішньополітичні обставини."
 BBA_african_union_events.17.desc:0 "[FROM.GetNameDefCap] погодилися приєднатися до оборонного пакту Організації Африканської Єдності. Відтепер ми зобов’язані захищати один одного у випадку нападу."
 BBA_african_union_events.18.t:0 "Оборонна угода Організації Африканської Єдності активована"
 BBA_african_union_events.20.a:0 "Вони зрадили нас усіх."
 BBA_ethiopia_communist_events.30.a:0 "Ми припинимо бойові дії. Поки що."
 BBA_ethiopia_communist_events.35.t:0 "[ETH.GetNameDefCap] вимагає виведення з Африки"
 BBA_ethiopia_communist_events.53.t:0 "[SOV.GetNameDefCap] відмовляється надіслати радників"
 BBA_ethiopia_communist_events.55.a:0 "Ну, ця проблема вирішилася сама собою."
 BBA_ethiopia_communist_events.59.t:0 "[JAP.GetAdjective] ембарго"
 BBA_ethiopia_exile_events.17.c:0 "[FROM.GetLeader] потребує вражаючого флагмана"
 BBA_ethiopia_exile_events.24.desc:0 "У таємній угоді, укладеній главами держав [ROOT.GetNameDef] та [FROM.GetNameDef], ряд держав на Аравійському півострові було обіцяно [FROM.GetNameDef], якщо вони потраплять до рук уряду [ROOT.GetAdjective]. Територія буде передана, коли прийде час, але, безумовно, спочатку їх потрібно обезопасити."
 BBA_ethiopia_exile_events.41.c:0 "Та за кого себе має [FROM.GetLeader.GetSheHe] [FROM.GetLeader.GetSheHe]?"
 BBA_ethiopia_exile_events.44.a:0 "Вони ж не будуть оголошувати війну чи щось таке..."
 BBA_ethiopia_exile_events.55.desc:0 "Останні зусилля по просуванню нашої справи призвели до постійного притоку [?ETH.host_nation.GetAdjective]их найманців, які пропонують нам свої послуги в майбутніх боях. Звичайно, за певну плату."
 BBA_ethiopia_exile_events.57.t:0 "Допоміжний флот [ETH.GetName]"
 BBA_ethiopia_fascist_events.03.t:0 "Автономний $gojjam$?"
 BBA_ethiopia_fascist_events.23.a:0 "Дуже бажана допомога."
 BBA_ethiopia_military_and_tech_events.1.a:0 "Школа збереже наш акцент на атаці."
 BBA_italo_ethiopian_war_events.111.a:0 "Така собі перемога."
 BBA_italo_ethiopian_war_events.113.t:0 "[FROM.GetName] відмовляється виконувати резолюцію Ліги Націй"
 BBA_italo_ethiopian_war_events.13.t:0 "[FROM.GetName] закриває Суецький канал для держави [ITA.GetName]"
 BBA_italy_anti_colonialism_events.20.a:0 "Настав час все виправити!"
 BBA_italy_bop.3.a:0 "Ситуація змінюється на нашу користь!"
 BBA_italy_interaction_events.27.c:0 "Чорт забирай, яке нам діло до континенту?"
 BBA_italy_interaction_events.44.a:0 "Як на мене, звучить непогано."
 BBA_italy_interaction_events.60.t:0 "[ITA.GetName] підписує мирний договір"
 BBA_italy_interaction_events.72.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetName], вчора ввечері непомітно відвідав приватну резиденцію [ROOT.GetLeader], щоб тихо повідомити про своє рішення прийняти пропозицію італійців сформувати новий уряд під їхнім режимом. Він подякував нам за нашу щедрість у ці тривожні часи, але сказав, що він повинен дбати про те, що є кращим для його народу."
 BBA_italy_interaction_events_news.1.t:0 "Німеччина відступає"
 BBA_italy_missiolinis.112.desc:0 "Що передбачалося як стрімке вторгнення на узбережжя Адріатики, обернулося в нездоланну перешкоду. Наші війська загрузли в Далмації та не змогли надати величне завоювання, обіцяне італійському народові. Дуче кілька разів виявляли в майже кататонічному стані, бурмочучи про те, що Далмація по праву належить нам. Це була не та демонстрація сили, на яку дуче сподівався."
 BBA_italy_missiolinis.131.a:0 "Врятуйте італійців у Тічіно!"
 BBA_italy_missiolinis.23.desc:0 "Нам нарешті вдалося притлумити опір в Абіссінії: від високих гірських вершин до низьких пустельних рівнин народ Абіссінії знаходить своє місце у складі Італії. Задоволений Муссоліні оголосив, що нарешті може звернути свою увагу на інші справи, тож Італія зможе процвітати та здобути те, що їй належить по праву."
 BBA_italy_missiolinis.31.t:0 "Програма індустріалізації"
 BBA_italy_missiolinis.43.t:0 "Розширена армія Італії"
 BBA_italy_missiolinis.61.t:0 "Програма запасів пального"
 BBA_italy_missiolinis.91.a:0 "Розширмо нашу службу розвідки."
 BBA_italy_second_italo_ethiopian_war.1.a:0 "Значить, мир!"
 BBA_swiss_expansion.1.t:0 "Нам не вдалося достатньо вплинути на [SWI_influenced_state]"
 BBA_swiss_expansion.7.desc:0 "[FROM.GetAdjective] уряд категорично відхилив нашу вимогу, попри наші серйозні підстави та демократичну волю народу [848.GetName].\n\nМи не повинні дозволити такій образі залишитися без відповіді."
 BBA_switzerland.14.desc:0 "Федеральна рада отримала петицію, підписану 200 представниками кількох правих груп, які сподіваються підштовхнути [ROOT.GetNameDef] до більш приязних стосунків із [SWI_get_fascist_neighbor], залишаючись відносно нейтральними. Вони хочуть досягти цього шляхом суворої цензури будь-якої негативної преси щодо нього, щоб уникнути їхнього гніву."
 BBA_switzerland.17.desc:0 "Через наші таємні канали з [FROM.GetNameDef] ми отримали підтвердження, що вони погодилися на запропонований пакт. Відтепер вони підтримуватимуть нас проти наших ворогів і захищатимуть нас у разі загрози. Але це не означає, що ми в безпеці — ворог може розкрити наші дії і сприйняти їх як загрозу, тож слід зберігати обережність, поки ми готуємося до дій."
 BBA_switzerland.2.c:0 "Він зізнався, тож має негайно отримати максимальний вирок."
 BBA_switzerland.4.desc:0 "Лідер [?SWI.SWI_fascist_germany.GetNameDef], [?SWI.SWI_fascist_germany.Getleader], висловив [?SWI.SWI_fascist_germany.Getleader.GetHerHis] вдячність [SWI.GetNameDef] за швидке розв'язання справи вбивці Вільгельма Густлоффа, не залишаючи сумнівів у позиції [SWI.GetName] щодо подібних інцидентів. Відмова від прав людини та демократичних цінностей безперечно покращить ставлення [?SWI.SWI_fascist_germany.GetName] до нас.\n\nПопри позитивні коментарі [?SWI.SWI_fascist_germany.Getleader.GetHerHis], було чітко зазначено, що ідеальним варіантом для нацистської партії була б екстрадиція до [?SWI.SWI_fascist_germany.GetNameDef], навіть якщо зараз це неможливо для [SWI.GetNameDef]."
 BBA_switzerland.8.desc:0 "Вся [SWI.GetName] і її сусіди уважно стежать за судом над Давідом Франкфуртером. Результат цього суду покаже не лише долю того, хто сам визнав свою провину, але й долю [SWI.GetNameDef] загалом, і наскільки вона готова жертвувати своїми інституціями та традиціями.\n\nУсі ознаки вказують на справедливий тюремний термін, але вплив Ради може змінити вирок і, можливо, саму сутність країни."
 BBA_switzerland_fascist.7.a:0 "Корисно!"
 BECOME_SPY_MASTER_ALREADY_MASTER:0 "§RВи вже очолюєте розвідмережу.§!"
 BEL_adriaan_martens_crisis:0 "Криза Адріана Мартенса"
 BEL_aid_for_spain_desc:0 "Іспанські республіканці борються за свої демократичні ідеали проти небезпечних фашистських та анархістських радикалів. Ми повинні тихо запропонувати їм підтримку в їхній боротьбі, але бути обережними, щоб зберегти вигляд нейтралітету."
 BEL_antwerp_maritime_academy_desc:0 "Хоча академія більше орієнтована на цивільне і комерційне судноплавство, ми все одно можемо використати досвід викладачів для підготовки та розвитку нашої морської присутності на морі. Вони будуть особливо корисні, навчаючи наших офіцерів, як найкраще працювати з комерційними суднами, які підтримують наші торгові потоки."
 BEL_belgian_miracle:0 "Бельгійське диво"
 BEL_chasseurs_ardennais:0 "Chasseurs Ardennais"
 BEL_contradictions_in_socialism_desc:0 "Наші нещодавні успіхи в поширенні соціалістичних ідеалів у Конго явно дали результати, оскільки народ там процвітає більше, ніж будь-коли. Тому нам очевидно, що ми повинні розширювати нашу «Соціалізаційну місію» по всій Африці!"
 BEL_doctrinal_innovations_desc:0 "Доктрини допомагають направляти армію і забезпечувати, щоб всі йшли в одному напрямку, але іноді для того, щоб дійсно випередити інших, потрібно думати нестандартно. Ми хочемо йти далі, розбивати шаблони і робити все по-своєму. Наші вороги не зрозуміють, що сталося."
 BEL_eben_emael_fortress:0 "Фортеця Ебен-Емаель"
 BEL_fighter_equipment_0_short:0 "Av-F. Firefly"
 BEL_growing_threat_of_fascism:0 "Зростаюча загроза фашизму"
 BEL_la_belgique_et_le_congo_desc:0 "Роль Бельгії в Конго довгий час полягала в експлуатації та переслідуванні, коли вона повинна була бути спрямована на просування рівності та можливостей. З нашим відновленим акцентом на соціалістичні ідеали, настав час почати навчати наших колоніальних братів цій філософії і почати інвестувати в їхнє соціалістичне майбутнє."
 BEL_legacy_of_the_belgian_airforce:0 "Спадщина бельгійських Повітряних сил"
 BEL_minerva_imperia_motorized_organization:0 "Minerva-Imperia Automobiles"
 BEL_mio_trait_heavy_machine_guns:0 "Heavy Machine Guns"
 BEL_our_southern_neighbour_desc:0 "Завдяки нашому досвіду в останній війні більшість наших оборонних зусиль була спрямована на нашого східного сусіда, однак це не єдиний великий сусід, з яким ми маємо кордон. Ми повинні переконатися, що ми також зміцнили свої оборони на південь."
 BEL_plan_de_man_desc:0 "Хоча це і має велику політичну ціну, прем'єр-міністр працює над продовженням реформ Анрі де Мана та впровадженням додаткових заходів для боротьби з безробіттям. Метою є подальше зниження рівня безробіття з високих 23,5% у 1932 році до 15%."
 BEL_re_build_the_fleet_desc:0 "Перший крок до відновлення нашої морської сили — це створення нового флоту. Це вимагатиме значних інвестицій у нові доки та можливості для будівництва суден."
 BEL_royal_military_academy:0 "Королівська військова академія"
 BEL_spanish_intervention_tt:0 "Відкриває рішення для подальшого §Y$BEL_intervention_in_spain_cat$§!.\n\nМи зможемо надсилати обладнання, заохочувати еміграцію, щоб допомогти їх зусиллям, і підтримувати їх політично."
