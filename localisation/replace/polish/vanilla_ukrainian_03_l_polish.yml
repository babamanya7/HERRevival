 ARG_extinguish_south_american_communism_desc:0 "Червона загроза — це не просто бабай, вигаданий для лякання дітей. Комунізм поширився на Південну Америку і постійно наближається до [ARG.GetName]. Заради демократії та свободи ми повинні мобілізуватися, щоб придушити це червоне відродження, перш ніж воно пошириться по всьому континенту."
 ARG_firmes_volamos_desc:0 "[ENG.GetAdjective] громада, що проживає в [ARG.GetName], запропонувала профінансувати ескадрилью для Королівських повітряних сил. Відправивши цю ескадрилью до [ENG.GetName], ми зможемо тісніше співпрацювати з RAF та розвивати наші власні повітряні можливості."
 ARG_german_investments_bonus:0 "Німецькі інвестиції"
 ARG_implemented_rural_reforms:0 "Упроваджено сільські реформи"
 ARG_improve_patagonia_desc:0 "Оскільки анархо-синдикалісти під керівництвом Антоніо Сото взяли під контроль долю [ARG.GetNameDef], вони вирішили, що вкрай необхідно, щоб їхній рідний регіон Патагонія нарешті отримав увагу, якої він гостро потребував протягом десятиліть."
 ARG_in_memory_of_yrigoyen_tt:0 "§YМарсело Т. Де Альвеар§! стає лідером партії §Y$ARG_democratic_party_long$§!, а керівна партія переходить до §YДемократичної§!."
 ARG_independent_socialist_communism:0 "Південноамериканські соціалістичні республіки"
 ARG_intervenciones_federales_decisions_desc:0 "Зростаюча загроза переворотів проти нашого нового уряду призвела до активації intervenciones federales. Ми мусимо вибрати області, в яких запровадити цей новий законодавчий акт. Це дозволить нам ефективніше закликати та допомагати людям, готовим захищати свій уряд."
 ARG_juan_peron_elected:0 "Хуан Перон"
 ARG_military_union_south_america_fascism:0 "Легіонерська Південна Америка"
 ARG_more_communism_in_south_america_tt:0 "Отримати ціль війни §Y$annex_everything$§! проти всіх §YНекомуністичних§! націй у §YПівденній Америці§!"
 ARG_no_communism_in_south_america_tt:0 "Отримати ціль війни §Y$puppet_wargoal_focus$§! проти всіх §YКомуністичних§! націй у §YПівденній Америці§!"
 ARG_political_events.101.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
