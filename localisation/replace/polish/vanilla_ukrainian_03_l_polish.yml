 TUR_strat_bomber_equipment_3_short:0 "G.O. Evren"
 TUR_the_pontic_redoubt_desc:0 "Ми надто довго носилися з нашими західними оборонними рубежами, ігноруючи кордон із державою [SOV.GetNameDef], відкрито пропагуючим політику іредентизму! Навряд чи ми зможемо довго стримувати його війська біля кордонів, але, зміцнивши редут вздовж берегів річки, ми можемо сподіватися здолати ворога у війні на виснаження. Та й які у нас є ще варіанти?"
