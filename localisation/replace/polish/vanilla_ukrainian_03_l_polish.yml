 MAN_TSR_BLITZKRIEG_DESC:0 "Маньчжоу-го, колись окраїнна держава, вирізана з півночі Китаю японською армією, яка чіплялася за будь-яку ниточку легітимності, підтримуючи Пуї як імператора, тепер стала повноправним членом Великої східноазійської сфери співпроцвітання. Тепер питання полягає в тому, чи залишиться держава в руках Асоціації «Конкордія», чи вона потрапить до рук Пуї."
