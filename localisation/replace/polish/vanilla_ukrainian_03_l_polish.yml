 ETH_recruit_from_the_african_diaspora:0 "Вербувати людей із африканської діаспори"
 ETH_regional_training_centers_tt:0 "Змінити §Y[GetEthiopianArmySpiritName]§! на:\n $modifier_army_sub_unit_irregular_infantry_defence_factor$: §G+5%§!\n $modifier_army_sub_unit_irregular_infantry_speed_factor$: §G+10%§!\n $modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+15%§!"
 ETH_sabotage_italo-german_relations_desc:0 "Ми не можемо дозволити державам [GER.GetNameDef] і [ITA.GetName] розглядати одне одного як можливих союзників. Ми повинні зробити все, що в наших силах, щоби зірвати відносини між ними. Інакше ми можемо побачити, як Його Величність стане в'язнем [ITA.GetLeader], а мрія про вільний [ETH.GetName] буде зруйнована."
 ETH_set_up_gideon_force_decision_tt:0 "[?ETH.host_nation.GetAdjective]ий командувач спецпризначенців тимчасово приєднається до [ROOT.GetAdjective]ої армії."
 ETH_social_reforms_category_desc:0 "Нам потрібна хвиля соціальних реформ, щоб подолати культурні та релігійні розбіжності в державі [ETH.GetName], щоб ми могли залишатися єдиними."
