 usa.17.b:0 "Цього разу ми не втрутимося."
 usa.32.t:0 "Урядова фракція отримує більшість у Конгресі"
 usa.40.a:0 "Корисний союзник."
 usa.41.a:0 "Вона права, знаєте."
 usa.44.t:0 "Опозиція зазнає поразки в Сенаті"
 usa.47.a:0 "Полювання на відьом."
 usa.9.a:0 "ФДР перемагає Дьюї."
 vojvodina_YUG_subject_ADJ:0 "Воєводинськ"
 war_declaration_rules_applicability:0 "§gКоли активно, тільки країни, які виконують ці умови, можуть оголошувати війни:§!"
 war_initiator_desc:0 "$COUNTRY|UY$ веде наступальну війну."
 war_justification.12.d:0 "«У сучасній історії, можливо, навіть в історії в цілому, не було гіршої тиранії, ніж залізна хватка, в якій [From.GetRulingParty] зараз тримає [From.GetName]. Люди можуть стверджувати, що ми не повинні провокувати конфлікт, що ми повинні довіряти [From.GetLeader] в дотриманні договорів і обіцянок в майбутньому, але ці люди не бачать, що договори, укладені під час правління фашизму, є марними. Для цих безчесних брехунів сила має рацію, і папір, на якому написана угода, згорає так само легко, як і книги їхніх недоброзичливців».\n\nЛюдям, які довго сподівалися уникнути прямої конфронтації з [From.GetName], тепер рішуче протистоїть [ROOT.GetLeader], який стверджує, що ми, віроломно, просто відкладаємо війну на користь ворога. Такими темпами ми можемо завдати першого удару."
 war_justification.16.d:0 "«Мої опоненти хотіли б, щоб ви повірили, що моє правило схоже на правило [From.GetRulingParty] в [From.GetName]. Вони сильно помиляються. У той час як успіхи [From.GetLeader] є результатом нещодавньої примхи, деструктивного масового руху, спрямованого на залякування інших націй, щоб змусити їх підкоритися, [ROOT.GetRulingParty] стоїть в опозиції до цього руху, як той, хто не підкориться. Я готовий зробити все необхідне для усунення цієї загрози, навіть якщо це означатиме війну».\n\nРежим [ROOT.GetLeader] прийняв ворожу політику по відношенню до [From.GetAdjective]ої нації. Як би не називали наших лідерів, фашист — це слово, призначене для наших ворогів."
 war_justification.201.t:0 "[From.GetLeader] висловлюється проти держави [ROOT.GetName]"
 war_justification.204.d:0 "«[ROOT.GetAdjective]ий народ — із тих, який не буде легко розлучатися з владою. Однак вони також повинні усвідомлювати, що траєкторія наших двох народів може закінчитися лише зіткненням. Ми повинні загартувати себе для майбутньої боротьби. Бо [ROOT.GetName] не буде взято без бою».\n\nМожливість порозуміння між урядами [ROOT.GetName] і [From.GetName], що мислять однаково, поступилася місцем кампанії по захопленню їхньої території силою."
 war_justification.208.a:0 "Смерть комуністам!"
 war_justification.220.a:0 "Нам краще підготуватися. Війна наближається."
 war_on_communism_in_asia_goal_desc:0 "Є лише один спосіб по-справжньому перемогти комунізм: силою зброї. Ми повинні викорінити комунізм у всій Азії, якщо хочемо бути в безпеці від його впливу."
 wtt_britain.26.a:0 "Принаймні вони не потрапили до рук німців."
 wtt_britain.28.t:0 "Ірландія приймає пропозицію МакДоналда"
 wtt_china.3.t:0 "[From.GetLeader] відмовляється"
 wtt_china_shared.4.t:0 "[From.GetAdjectiveCap]ий рух за незалежність набирає силу"
 wtt_germany.1002.desc:0 "Сьогодні при спробі «Гінденбурга» пришвартуватись у лондонських доках сталася жахлива трагедія. За поки що нез'ясованими причинами дирижабль охопило полум'я, і він упав на землю, забравши життя пасажирів та екіпажу, включаючи майже всіх членів великого королівського сімейства Німецької імперії.\n\nБезпосереднє управління країною взяло він уряд, але це навряд чи означає повернення демократії найближчим часом."
 wtt_germany.14.b:0 "Ми ніколи не віддамо свої землі!"
 wtt_germany.23.t:0 "Німеччина запрошує Фінляндію"
 wtt_japan.117.a:0 "Як прикро."
 wtt_manchukou.1.t:0 "[From.GetNameDefCap] вимагає підкорення"
 wtt_manchukou.11.desc:0 "Уряд поступово розробляє п'ятирічний план, за яким має розвиватися наша економіка найближчими роками. Досі спостерігаються значні розбіжності між відомствами щодо того, чому слід приділити більшу увагу.\n\nВідповідно до загальної думки, акцент слід зробити на важкій промисловості, але що саме повинні виробляти заводи, поки обговорюється.\n\nЩоб вийти з глухого кута, необхідно прийняти рішення."
 wtt_news.16.desc:0 "Китайський уряд вирішив піти на поступки Німеччині, яка нещодавно зажадала передати їй її старий анклав у Ціндао.\n\nУ межах міста було негайно відновлено державний контроль із боку Німеччини."
 wtt_news.30.c:0 "Це матиме наслідки."
 wtt_news.32.desc:0 "Стверджується, що після арешту за наказом лідера [CHI_xian_instigator.GetLeader] та передачі комуністам, внаслідок тривалих переговорів [CHI.GetLeader] відпущено додому. Відомості надходять уривчасті, але, судячи з усього, [PRC.GetLeader] запропонував укласти союз проти японців. Обидві сторони спростовують ці чутки, та [PRC.GetLeader] стверджує, що він воліє побачити, як країна згоряє до попелу, аніж піде на переговори з націоналістами. [CHI.GetLeader] відповідає йому взаємністю."
 wtt_news.53.b:0 "Скандинавія сильніша разом."
 wtt_news.54.b:0 "Північ завдати багато клопоту своїм сусідам..."
 wtt_political_warlord_support.10.c:0 "Попросити про допомогу у реформуванні наших збройних сил."
 wtt_prc.23.t:0 "Підірвано міст"
 wtt_warlord_vs_prc.2.t:0 "[soviet.GetLeader] надсилає повідомлення"
 wuw_GER_diplomacy.107.c:0 "Несправедливо — більше ніколи таке не пропонуйте!"
 wuw_GER_diplomacy.107.t:0 "[FROM.GetAdjective]и пропонують ресурси в обмін на індустрію"
 wuw_GER_diplomacy.22.a:0 "Побачимо, скільки вони протримаються наодинці"
 wuw_GER_diplomacy.23.b:0 "Нам це зовсім не вигідно!"
 wuw_GER_diplomacy.3.t:0 "[FROM.GetNameDefCap] відхиляє нашу торговельну пропозицію"
 wuw_GER_diplomacy.31.a:0 "Їх втрата"
 wuw_GER_diplomacy.35.t:0 "[FROM.GetNameDefCap] просить повернути колишні колонії"
 wuw_GER_diplomacy.38.b:0 "Абсолютно ні!"
 wuw_GER_diplomacy.39.desc:0 "Наш ультиматум до [FROM.GetAdjective] керівництва дав результат. Хоча вони неохоче, та все ж погодились на передачу територій. Нам не важливо, що вони думають — важливо, що ми отримали те, що належить нам."
 wuw_GER_diplomacy.40.t:0 "[FROM.GetNameDefCap] відмовляється виконувати територіальні вимоги"
 wuw_GER_diplomacy.60.a:0 "Вони мають рацію"
 wuw_GER_diplomacy.82.t:0 "[FROM.GetAdjective] підтримка повстання"
 wuw_GER_diplomacy.83.t:0 "[GER.GetNameDefCap] запрошує нас до [GER.GetFactionName]"
 wuw_GER_diplomacy.87.t:0 "Честь у сфері впливу"
 wuw_GER_monroe.1.a:0 "Ми повинні втрутитися!"
 wuw_GER_monroe.1.b:0 "Кому яка справа?"
 wuw_GER_mutual_guarantees.2.a:0 "Чудово"
 wuw_GER_news.2.desc:0 "Вже вчетверте після підписання Версальського договору повстанці в німецькій Сілезії взялися за зброю проти уряду. Цього разу, [SIL.GetLeader] стверджує, що цілями їхніх військових дій є головним чином забезпечення повноцінної незалежності Сілезької держави та водночас захист її народу від жахів наслідків громадянської війни в Німеччині, хоча попередні повстання мали на меті отримання автономії саме в складі польської держави. Тільки час покаже, чи зможуть вони протистояти німецькій армії."
 wuw_GER_realpolitik.11.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що [FROM.GetAdjective] нація підкориться нашій владі, визнавши помилкою колишнього уряду зречення монархії та німецького претендента на трон."
 wuw_GER_realpolitik.29.a:0 "За революцію!"
 wuw_GER_realpolitik.36.b:0 "Ми не поступимось своєю незалежністю!"
 wuw_GER_realpolitik.5.b:0 "Можливо, краще зробити їх нашим клієнтським державним утворенням"
 wuw_GER_realpolitik.7.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб ми підкорилися їхній владі й стали їхньою державою-клієнтом, як це було передбачено в договорі Брест-Литовськ. Чи підкоримося ми цим вимогам?"
 wuw_GER_reichskommissariats.18.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Центральній Африці, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_reichskommissariats.24.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.27.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.8.t:0 "Керівництво Московії"
 wuw_HUN_a_revolutionary_greater_hungary_tt:0 "Ми станемо відомі як §YСоюз Паннонських Соціалістичних Республік§!"
 wuw_HUN_allied_manufacturing_programs_tt:0 "Лідер нашої фракції отримає 2 §Yпозаекранні цивільні фабрики§! і §Y1x§! §G+50%§! до швидкості дослідження §Yавіаобладнання§!"
 wuw_HUN_avoid_interventionalist_destablilization:0 "Уникнути дестабілізації через інтервенціонізм"
 wuw_HUN_claim_overlordship_over_slovakia_desc:0 "Решта Словаччини також має бути реінтегрована до угорської держави — безпосередньо або як залежна територія. Ми надішлемо ще один ультиматум."
 wuw_HUN_demand_szekely_autonomy_desc:0 "Секеї в Трансільванії прагнуть єдності з угорськими братами. Ми повинні домогтися їхньої автономії під нашим захистом."
 wuw_HUN_demand_the_vojvodina_tt:0 "Відкриває рішення вимагати §YЗахідний Банат§!"
 wuw_HUN_economic_intervention_desc:0 "Ми повинні спрямувати значні політичні ресурси для керування нашою економікою. Хоча вона й адекватна, ми можемо зробити її ще сильнішою та ефективнішою."
 wuw_HUN_expand_the_arpad_line_available_tt:0 "Можна збудувати щонайменше 2 §Yназемні форти§! вздовж північного та східного кордонів §Y[73.GetName]§! та §Y[76.GetName]§!"
 wuw_HUN_invite_otto_to_the_throne_desc:0 "Габсбурги довго правили Угорщиною, і за їхнього правління ми входили до великої імперії. Повернення Отто, спадкоємця Габсбургів, стане першим кроком до відновлення Австро-Угорщини."
 wuw_HUN_news_events.2.d:0 "Після підписання нового пакту про взаємодопомогу та співпрацю заради досягнення національних цілей, [GER.GetLeader] і [HUN.GetLeader] сьогодні оголосили про вступ держави [HUN.GetNameDef] до [GER.GetAdjective]ого альянсу."
 wuw_HUN_nimrod_aa_tt:0 "\nПісля дослідження технології §Y$improved_medium_tank_chassis$§!:\n"
 wuw_HUN_quantity_over_quality_desc:0 "Хоч наша армія не велика, ми можемо компенсувати це технологічною перевагою та сучасними підрозділами, які здатні протистояти чисельній перевазі ворога."
 wuw_HUN_restore_the_socialist_federative_republic:0 "Відновити Соціалістичну федеративну республіку"
 wuw_HUN_sway_the_count_desc:0 "Граф Фідель Палффі аб Ердьод — аристократ і великий прихильник німецького нацизму. Він користується повагою серед контактів НСДАП, і його варто залучити до наших лав для дипломатії з однодумними державами."
 wuw_HUN_ward_against_extremism_desc:0 "Країни Дунаю мають об’єднатись для захисту свободи та демократії. Ми будемо форпостом проти будь-яких ворогів волі."
 ww_BEL_event_diplomatic.28.desc:0 "Незважаючи на очевидні переваги, [FROM.GetNameDef] вирішили не приєднуватися до нашої ідеї федералізованої Європи. Вони стверджують, що їхній власний суверенітет важливіший за добробут усієї $EU_tech_sharing_group_name$, що є досить тривожним настроєм всередині союзу."
 ww_BEL_event_diplomatic.3.a:0 "Чудово"
 ww_BEL_event_diplomatic.31.a:0 "Чудова новина"
 ww_BEL_event_diplomatic.34.t:0 "[FRA.GetNameDefCap]: Друг чи ворог?"
 ww_BEL_event_diplomatic.5.d:0 "Запропонувати союз в обмін."
 ww_BEL_event_misc.3.t:0 "Cockerill: Серце бельгійської промисловості"
 ww_BEL_event_war.7.desc:0 "Наші провідні дипломати та генерали нещодавно зустрілися і порадили нам, що якщо цей конфлікт залишатиметься обмеженим за обсягом, тобто якщо не втрутяться інші великі держави, то ми могли б змусити [FRA.GetName] сісти за стіл переговорів і укласти швидку мирну угоду. Ми знаємо, що вони бояться зростаючих напружень і, як і ми, не хочуть бути втягнутими в ще один глобальний конфлікт. \n\nТому ми вважаємо, що якщо Париж впаде, це стане достатньою демонстрацією наших можливостей, щоб вони могли погодитися на переговори щодо передачі спірного Кале."
 ww_BEL_event_war.8.t:0 "Париж впав!"
 ww_congo.16.t:0 "Латинська Африка об'єднана"
 ww_congo.20.d:0 "З огляду на надзвичайно слабку владу нашого уряду над мандатом Руанда-Урунді та поширення націоналістичних настроїв у регіоні, Мвамі Мутара III Рудахіджа, король Руанди, оголосив націю незалежною, розірвавши зв'язки з нашим центральним урядом. Чи повинні ми втрутитися?"
 ww_congo.22.desc:0 "Наш губернатор у Конго, [COG.GetLeader], висловив бажання збільшити еміграцію [ROOT.GetAdjective] до цього регіону, з метою залучити людей з знаннями та коштами. Багаті та теплі землі Катанги можуть привернути багатьох з почуттям пригоди чи обов'язку, і якщо ми будемо підтримувати це, це, без сумніву, приверне ще більше людей."
 ww_congo.50.desc:0 "\n[FROM.GetNameDefCap] звернувся до нас з пропозицією встановити взаємний альянс. Вони почали процес мілітаризації та висловили бажання співпрацювати, щоб зміцнити обидві наші держави. Історично наші відносини були на межі конфлікту, але зараз найкращий час для примирення."
 ww_congo.52.t:0 "[FROM.GetNameDefCap] відмовляється від нашої пропозиції щодо альянсу"
 ww_congo.71.desc:0 "Наш ас пілот Ян Зумбах, який прибув до нас з Польщі, заявив, що хоче покинути нас і поїхати до Конго, щоб допомогти в створенні авіації там. Чи дозволимо ми йому це?"
 ww_congo.73.b:0 "У нас немає вибору, як погодитися."
 ww_congo.73.desc:0 "[FROM.GetAdjective] дипломати звернулися до нас з пропозицією миру. Пропозиція залежить від того, чи погодимося ми відмовитися від претензій на певні африканські володіння та вивести наші сили з цього регіону. Чи приймемо ми це?"
 yellow_river_blown:0 "Серйозне затоплення"
 yug_extreme_bravery_medal:0 "§Y[ROOT.GetNameDefCap]§! тепер зможе нагороджувати §Yпольових офіцерів§! §YМедаллю за надзвичайну хоробрість§!."
