 comintern_research_desc:0 "Скорочення часу дослідження технологій, уже вивчених іншими країнами-членами Комінтерну."
 commercial_nuclear_reactor_desc:0 "Ця споруда виробляє в області збагачений уран для ядерної зброї та виробляє електроенергію для цивільної економіки."
