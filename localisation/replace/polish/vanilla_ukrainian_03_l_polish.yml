 FIN_GATHERING_STORM_DESC:0 "Фінляндія — молода країна, яка здобула свою незалежність від Росії в 1917 році, після чого пережила криваву громадянську війну. Шрами війни досі свіжі, і коаліційному урядові країни досі складно працювати разом. Схоже, що Радянський Союз жадає фінські території поблизу Ленінграду; Фінляндія не готова до ймовірного конфлікту, але в неї є довга історія військової доблесті та рішучості, а її солдати шалено віддані своїй вітчизні.\n\nНапруга зростає, наближається загроза конфлікту. Майбутнє Фінляндії висить на волосині."
 FIN_ambitions_in_the_south_desc:0 "Сусіди із заздрістю дивляться на малі країни Балтії. Якщо їх потрібно перемогти, краще це буде на нашу користь, ніж на користь можливого супротивника."
 FIN_arm_the_lotta_svard:0 "Озброїти Lotta Svärd"
