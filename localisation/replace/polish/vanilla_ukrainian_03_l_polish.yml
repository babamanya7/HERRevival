 TUR_american_motor_factories_desc:0 "Більшість нашої важкої промисловості, що з виробництвом машин, залежить від співпраці з американцями. Ми зазвичай не відрізнялися згідливістю щодо міжнародних інвестицій, але якщо послабити наші норми заради американських друзів... Хто знає, що тоді буде?"
 TUR_approve_the_funkplan_desc:0 "Ми не брали участь у плані Шахта у Південній Європі. Ситуація змінилася, і ми вважаємо, що держава [GER.GetNameDef] має стати нам ще ближчим економічним партнером. [GER.GetAdjective] економіст Вальтер Функ розробив схему спеціально для нашої ситуації, і було б безглуздо не скористатися нею якнайшвидше."
 TUR_arctic_wolves_training_program:0 "Програма тренування «арктичних вовків»"
 TUR_balkan_defense_council_tt:0 "Як тільки §YБалканський договір§! буде ратифікований в союз, ми зможемо координуровати свій захист від іноземної агресії."
 TUR_entice_the_greeks_desc:0 "Відколи пала Османська імперія, наша влада не покладаючи рук трудилася задля зміцнення миру з державою [GRE.GetNameDef]. Поки що ми не маємо причин вважати, що десятки років дипломатичної роботи пішли даремно, але все може змінитися, якщо на війні ми опинимося по різні боки барикад. Сподіватимемося, що вони вчинять мудро і не будуть даремно ламати власне майбутнє."
 TUR_etatism_crisis_3_desc:0 "$TUR_etatism_crisis_1_desc$"
 TUR_fighter_equipment_2:0 "THK Fw 190"
 TUR_heavy_tank_equipment_3_short:0 "Suaygırı"
 TUR_hostile_kemalists_influenced_state_effect_tt:0 "£faction_tur_kemalist §YЗрадники-кемалісти§! закріпляться в області §Y[TUR_kemalist_state_event_target.GetName]§!."
 TUR_hunt_down_fifth_columnist_islamists_desc:0 "Поки Європа турбується про свою п'яту колону комуністів-інтернаціоналістів, ми боремося з п'ятою колоною власних інтернаціоналістів з самого заснування нашої нації. Немає більшої екзистенційної загрози нашій великій республіці, ніж радикальний іслам і ретрогради, що його пропагують. Ми роздавимо ці релікти Османської імперії як комах."
 TUR_increase_german_military_aid_desc:0 "Якщо [GER.GetAdjective]ий народ хоче, щоби ми не відставали від неї на фронті, нехай поділиться величезними запасами технологій, накопичених за довгі роки. Звісно ж ми хочемо боротися більш наполегливо, але без [GER.GetAdjective]ої військової допомоги втілити бажання в життя не так просто."
 TUR_integrate_diyarbakir:0 "£faction_tur_kurdish Інтегрувати Діярбакир"
 TUR_integrate_german_officers_into_the_army:0 "Інтегрувати німецьких офіцерів в армію"
 TUR_jet_fighter_equipment_1:0 "THK-16 Mehmetçik"
 TUR_join_the_allies:0 "Приєднатися до Союзників"
 TUR_nud_organization:0 "$nud$"
 TUR_provide_refuge_to_the_victims_of_fascism_desc:0 "Фашизм нерозбірливий у виборі жертв. Ці демагоги засліплюють народ грандіозними обіцянками, а самі тим часом випускають щурів із каналізації. Ми мусимо захистити тих, хто не в змозі захищатися."
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect:0 "Прийняти нові правила повітряної безпеки"
 TUR_reclaiming_our_lost_empire_desc:0 "Позбавлення кемалістів влади та відновлення влади султана — лише перші кроки нашого великого плану. Ми пройдемо маршем по всьому світу, доки наша імперія знову не стане єдиною!"
 TUR_reconfigure_our_foreign_policy_desc:0 "[TUR.GetAdjectiveCap]а зовнішня політика зосереджена на внутрішніх справах і тому, щоб обмежити політику спілкуванням із сусідами. Тепер часи змінилися і це треба враховувати. Нам давно час наростити взаємодію з провідними державами світу."
