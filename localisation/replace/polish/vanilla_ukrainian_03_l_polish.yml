 KHL_communism_DEF:0 "Соціалістична республіка Халістан"
 KHM_call_for_aid_desc:0 "З військами Шен Шицая на нашому порозі ми повинні кликати на допомогу наших співвітчизників, інакше ми зазнаємо краху."
 KHM_implement_jizyah_desc:0 "The rights of non-muslims were highly prescriptive under the old administration. It is time to adjust these matters for a modern world, and prove to all of our subjects that we are an enlightened realm."
