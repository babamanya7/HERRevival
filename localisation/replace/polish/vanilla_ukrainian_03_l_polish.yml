 SIA_STATE_1067_ALT:0 "Внутрішня Камбоджа"
 SIA_asian_democratic_compact_cat_desc:0 "Народи Азії мають право на самоврядування. Як прапороносець азійського самовизначення, ми можемо тиснути на колоніальні держави, щоб вони звільнили нації, які утримують."
 SIA_asian_financial_compact_desc:0 "Європейський капітал все ще домінує у значній частині азійської торгівлі, залишаючи нашу економіку вразливою до іноземного тиску. Шукаючи тісніших фінансових угод із нашими сусідами, ми можемо розширити наш доступ до кредитів, ринків та інвестицій, не відмовляючись від нашої незалежності."
 SIA_broadcast_weather_reports_to_the_allies:0 "Трансляція прогнозів погоди Союзникам"
 SIA_demand_independence_CAM:0 "Вимагати звільнення §Y[CAM.GetName]§!"
 SIA_demand_independence_LAO_tt:0 "Ми вимагатимемо, щоб контролери [LAO.GetName] звільнили їх"
 SIA_demand_independence_VIN_tt:0 "Ми вимагатимемо, щоб контролери [VIN.GetName] звільнили їх"
 SIA_demand_the_return_of_lost_territory_tt:0 "Ми попросимо власників §YІндокитаю§! та частин §Y[MAL.GetName]§! повернути нам §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! та §Y[670.Getname]§!.\n\nФактори впливу:\n-Бойова міць не менше 30% у порівнянні з власником\n-Власник у стані війни з мажором\n-Власник не у фракції\n-Власник — §YВішістська Франція§!\n-Ми у фракції\n-Власник недолюблює нас"
 SIA_expand_aircraft_workshops_desc:0 "Управління потребує більшого, ніж офіси та інспекторські папери. Нові майстерні, верстати та навчені механіки дозволять ремонтувати пошкоджені літаки всередині країни, тоді як прості компоненти можна буде виробляти, не чекаючи іноземних поставок."
 SIA_foreign_currency_exchange:0 "Обмін іноземної валюти"
 SIA_get_off_our_shores_desc:0 "Присутність іноземних військ на сіамській землі — це образа, яку не можна пом'якшити виправданнями. Силою зброї чи під тиском подій за кордоном, ми повинні наполягати на тому, щоб загарбник покинув наші береги і відновив гідність [ROOT.GetNameDef].\n\nВони боягузи, як і всі жорстокі люди. Тепер, забирайтеся з нашої землі!"
 SIA_gw_tank_equipment:0 "$gw_tank_equipment$"
 SIA_heavy_fighter_equipment_2_short:0 "Ki-45"
 SIA_japan_aid_request.4.desc:0 "Уряд [JAP.GetNameDef] відхилив наш запит на військову допомогу. Токіо заявляє, що Імперія не може надіслати людей і матеріали для нашої боротьби в цей час.\n\nБез іноземної допомоги [ROOT.GetNameDef] повинна тепер покладатися на власні сили, щоб пережити вторгнення."
 SIA_light_ship_engine_1:0 "«Brown-Curtis» 27 000 к. с. н. в."
 SIA_mahidol_university_desc:0 "Сучасна держава потребує лікарів, дослідників і адміністраторів так само, як солдатів та інженерів. Університет Махідол зміцнить вищу освіту і підготує кваліфіковані кадри, необхідні для національних реформ."
 SIA_medium_tank_equipment_1_short:0 "Type 89"
 SIA_pan_thaiism:0 "Пан-тайїзм"
