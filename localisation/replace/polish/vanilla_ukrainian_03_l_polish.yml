 lar_align_belgium.1.a:0 "У нас немає вибору, треба погоджуватися."
 lar_align_belgium.1.b:0 "Ми не схилилися в 1914 році, не схилимося і зараз!"
 lar_align_belgium.2.t:0 "[From.GetNameDefCap] підпорядковується"
 lar_appeal_to_overseas_territories.4.desc:0 "Місцевий керуючий у Сирії вирішив повністю проігнорувати наші заяви. Деякі джерела стверджують, що він провів коротку нараду за зачиненими дверима, але в результаті не було жодних офіційних коментарів по радіо і жодних дій на нашу підтримку."
 lar_arms_purchases.3.desc:0 "Незважаючи на тривале лоббіювання та підтримку кількох сенаторів-інтервенціоністів, наші спроби отримати дозвіл на експорт озброєння зі США зазнали невдачі. Ізоляційні лоббі в Конгресі успішно заблокували всі спроби поставити це питання на порядок денний, продаж зброї стане першим кроком до повномасштабного вторгнення."
 lar_congress_of_paris.2.a:0 "Мрія про Італійську імперію в Африці варта того, щоб трішки ризикнути."
 lar_end_the_occupation.4.desc:0 "Несподіваний поворот подій: [From.GetLeader] відправив до нас свого представника з пропозицією об'єднати зусилля. Відновивши армію в умовах найсуворішої таємності, [From.GetLeader] вважає, що настав час знову вступити у війну і звільнити рідну країну.\n\nНаші джерела в його уряді при цьому стверджують, що справжня його мотивація — переговори щодо повернення окупованих французьких територій, що завершилися невдачею."
 lar_france_french_union.2.t:0 "Північна Африка голосує за вступ до Союзу"
 lar_france_french_union.5.t:0 "Західна Африка голосує за вихід"
 lar_france_vichy_reunification.2.a:0 "Ми знову єдині."
 lar_france_vichy_reunification.2.desc:0 "Уряд Віші проголосував за саморозпуск і передачу влади нам. Більшість дрібних чиновників вирішили продовжити служити на колишніх місцях, а війська, що залишилися, перейшли під наше командування."
 lar_news.1.desc_franco:0 "Після довгої та жорстокої громадянської війни націоналісти, об'єднані під командуванням Франсіско Франко, нарешті перемогли ворогів-республіканців і захопили повний контроль над Іспанією. В ізольованих вогнищах республіканського опору досі йде партизанська війна, націоналістичному контролю в раніше республіканських районах, але малоймовірно, що вона переросте в масштабний скоординований опір. ними щедра військова допомога з-за кордону."
 lar_news.14.t:0 "[SPA.GetNameDefCap] вимагає Французьку Північну Африку"
 lar_news.2.desc_stalinist:0 "Після довгої та жорстокої громадянської війни Друга республіка нарешті перемогла своїх ворогів — анархістів та націоналістів — і захопила повний контроль над Іспанією. В ізольованих вогнищах націоналістичного опору досі йде партизанська війна, здатна контролювати в раніше націоналістичних районах, але малоймовірно, що вона переросте в масштабний скоординований опір.\n\nУ ході громадянської війни Іспанія мирно перейшла до комуністичного правління, що забезпечило їй активну радянську допомогу. Країна кинула всі сили на відновлення міст і промисловості, що постраждали від війни; іспано-радянські зв'язки неухильно посилюються, і очікується, що Радянський Союз буде активно залучений до програм післявоєнного відновлення нації."
 lar_news.23.a:0 "Тепер ми боротимемося разом."
 lar_news.28.f:0 "Рано чи пізно нам треба буде розправитися з фалангістами..."
 lar_news.6.c:0 "Що задумують французи?"
 lar_news.6.d:0 "Ми не дозволимо втягнути себе в чергову війну через якийсь дурний союз."
 lar_news.8.desc:0 "У церемонії, що пройшла в місті [This.GetFrenchCoronationCity], [FRA.GetLeader] офіційно отримав титул «[This.GetFrenchRoyalTitle]». \n\nЙого прихід до влади повсюдно вважається результатом нездатності Третьої республіки забезпечити політичну стабільність у середовищі, сформованому запеклими сутичками людей із протилежних кінців політичного спектра, тепер перед ним стоїть важке завдання щодо відновлення та возз'єднання глибоко розділеної країни, і багато спостерігачів вважають роль вкрай правих сил у його сходження ознакою того, що «[This.GetFrenchRoyalTitle]» насправді став правителем лише милістю натовпу правих."
 lar_portugal_iberian_summit.2.desc:0 "[From.GetAdjective] уряд прийняв нашу пропозицію на вступ до союзу [?global.POR_iberian_summit_target.GetFactionName]. Разом ми підписали запит, щоб якнайшвидше направити його державі [?global.POR_iberian_summit_target.GetNameDef]."
 lar_portugal_iberian_summit.5.c:0 "Що за дурна ідея!"
 lar_portugal_naval_blockade.1.desc:0 "[POR.GetAdjective] уряд оголосив, що він не зобов'язаний дотримуватися морської блокади, введеної проти нас державою [ENG.GetNameDef]. До нас прибув посол з пропозицією, згідно з якою [POR.GetAdject\" нашій військовій економіці і перевозитимуть товари туди, куди немає ходу нашим конвоям, а ми за це відправлятимемо дешеві товари масового споживання в державу [POR.GetNameDef]."
 lar_portugal_spanish_civil_war.2.a:0 "Краще їм не втручатися в ці справи..."
 lar_ratify_the_stresa_front.2.b:0 "Ситуація змінилася."
 lar_spain.10.desc:0 "Уряд Другої республіки, очевидно, незадоволений нашою зростаючою незалежністю, разом зі своїми союзниками-сталіністами спробував захопити контроль над ключовими стратегічними районами та будинками на нашій території. Захист території переріс у перестрілку з недавніми союзниками, яка потім у повномасштабні вуличні бої.\n\nУряд, не бажаючи йти на компроміс, фактично привів нас у стан війни з ним і тим самим значно посилив позицію націоналістів."
 lar_spain.19.b:0 "Ми можемо самі відстоювати свої інтереси."
 lar_spain.22.a:0 "Треба надати їм усю можливу допомогу."
 lar_spain.39.t:0 "[From.GetNameDefCap] вимагає Північну Африку"
 lar_spain.54.t:0 "Золотий запас захоплений!"
 lar_spain.6.desc:0 "Минуло всього тиждень боїв, але вже ясно, що сільська місцевість Іспанії погано підходить для перевезення великої кількості спорядження. Виявилися труднощі у постачанні фронтів та організації наступів, і якщо ми продовжимо спроби боротися відразу всюди, ці проблеми лише посиляться."
 lar_spain.64.desc:0 "Хоча політична ситуація в державі [From.GetNameDef] нестабільна вже давно, схоже, що конфлікту такого масштабу [From.GetAdjective] уряд не очікував. Він просить негайно надати йому всю можливу допомогу у боротьбі з фашизмом. \n\nСумнівно, що республіканський уряд зможе виграти громадянську війну, що йде зараз, без зовнішньої допомоги, і, хоч перемога демократичної Іспанії була б для нас бажаним підсумком, цілком імовірно, що, надавши запитану допомогу, ми заохочимо симпатизують комуністам у нашій власній країні."
 lar_worker_shortage.2.desc:0 "Всупереч явним протестам військових введені скорочення призову та надання відстрочки від нього досвідченим робітникам знизили нестачу робочих рук. Тепер статистика демонструє помітне поліпшення виробництва, яке швидко повертається на рівень, що спостерігався до розширення призову."
