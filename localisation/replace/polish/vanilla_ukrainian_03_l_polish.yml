 YUG_invite_bulgaria_desc:0 "Наші слов'янські брати в Болгарії вимагають від нашого керівництва знайти шлях до комунізму. Більше того, оскільки вони окупують наш східний фланг, залучення їх до складу дозволить нам перестати турбуватися про велику ділянку наших кордонів, а їхня військова сила буде дуже корисною для поширення Революції."
 YUG_invite_greece:0 "Запросити Грецію"
 YUG_limited_self_government:0 "Обмежене самоврядування"
 YUG_medal_for_extreme_bravery_desc:0 "Героїчні подвиги наших солдатів, які працювали під ударами з усіх боків, вимагають створення нової честі на честь їхнього стійкого духу."
 YUG_medium_tank_equipment_3:0 "Projekat M320"
 YUG_mountain_brigades_desc:0 "Велика частина нашої країни складається з гір, що потребує формування спеціальних бригад, які спеціалізуються на веденні бойових дій на цій місцевості."
 YUG_mutual_economic_aid:0 "Взаємна економічна підтримка"
 YUG_positive_discrimination_croat_desc:0 "Сама Хорватія є домом для багатьох культур і народів, крім хорватів. Можливо, запровадивши закони, які сприяють хорватам щодо можливостей працевлаштування та податкової поблажливості, ми можемо подарувати їм ілюзію самовизначення, яку обіцяють їм усташі."
 YUG_progress_crushing_decisions_desc:0 "Настав час знищити фашистську устаську групу, і хоча багато хто може вважати ці дії актами фашизму самі по собі, ми знаємо, що ці заходи є вкрай необхідними для забезпечення подальшої стабільності нашої держави."
