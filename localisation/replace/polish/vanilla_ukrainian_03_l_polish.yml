 PRC_strengthen_the_central_party_school:0 "Зміцнити Центральну партійну школу"
 PRC_subjugate_korea_desc:0 "Окупація Кореї [JAP.GetNameDef] та їхня подальша експансія в Маньчжурію показує, що союзна Корея має вирішальне значення для безпеки [ROOT.GetAdjective]ої держави. Якщо це наразі неможливо, ми повинні втрутитися."
 PRC_the_northeast_aviation_university_sea_desc:0 "Створення масштабного навчального центру для наших ВПС стало б великим кроком уперед. Нам більше не доведеться покладатися на школи за кордоном, щоб навчати наших офіцерів доктрині, тому, як керувати нашою технікою, або тому, як передавати ці навички нашим відважним пілотам."
 PRC_the_peoples_republic_desc:0 "Тепер, коли революція твердо закріпилася, ми можемо почати перехід від революційної держави до такої, що своїми реформами зможе запропонувати своїм громадянам стабільність і процвітання."
 PRC_to_support_the_army:0 "Підтримати армію"
 PRC_to_support_the_army_1_tt:0 "Із завершеним §Y$PRC_emergency_supply_protocols$§!:"
 PRC_urbanization_two_desc:0 "Розширення наших міст означає, що тепер ми можемо розміщувати більші будівельні проєкти для створення житла та робочих місць. Ми дозволимо більшій кількості людей переїхати до міст і забезпечимо їх роботою, поки триває будівництво."
