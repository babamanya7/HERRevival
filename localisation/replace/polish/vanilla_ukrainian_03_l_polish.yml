 SWE_CAS_equipment_3_short:0 "SAAB B18B"
 SWE_air_raid_shelters_revoke:0 "Скасувати: $SWE_air_raid_shelters_activate$"
 SWE_ebba_political_clout:0 "Зменшити бар'єри для вступу в політичну діяльність для жінок"
 SWE_en_svensk_tiger_desc:0 "Будь-яка інформація, яку можуть зібрати наші вороги про нас, може бути використана для підриву нашої національної безпеки. Щоб запобігти цьому, бути сильним і мовчазним, як могутній тигр, має стати частиною [SWE.GetAdjective]ого характеру."
 SWE_gengas_activate:0 "Автомобілі з генераторним газом"
 SWE_jet_fighter_equipment_1:0 "SAAB 21R"
 SWE_landsverk_is_siezed:0 "Заводи Landsverk захоплені диверсантами"
 SWE_lindholmens_varv_desc:0 "Останніми роками компанія Lindholmens Varv була зосереджена на будівництві цивільних кораблів. З деякими незначними модифікаціями їх верфі можна було б переобладнати для підтримки розширення та модернізації флоту."
 SWE_marauder_bombers_desc:0 "Останній досвід показав, що здатність знищувати наземні цілі з повітря часто може бути вирішальним фактором у битвах. Це навіть може виявитися засобом повного припинення війни."
 SWE_mechanised_equipment_1_short:0 "M/42"
 SWE_norma_projektilfabrik_desc:0 "Norma Projektilfabrik виробляє боєприпаси в [SWE.GetName] і [NOR.GetName] з минулого століття. Розширення їх виробничих можливостей значною мірою допоможе підтримувати стабільні постачання боєприпасів до наших збройних сил."
 SWE_ship_armor_cruiser_2:0 "70-мм пояс/30-мм палуба"
 SWE_ship_torpedo_sub_3:0 "6x 533-мм торпедний апарат"
 SWE_special_forces_desc:0 "Сучасна війна інколи потребує невеликих груп спеціалізованих сил, які можуть виконувати місії в суворій місцевості або діяти в тилу ворога без потреби у підкріпленні. Тому ми повинні створити відділення спеціальних сил, здатне діяти як авангард [SWE.GetAdjective]их військових, коли це необхідно."
 SWE_standardize_equipment:0 "Стандартизувати оснащення"
 SWE_time_until_can_pick_civilian_tires:0 "Час, поки ми не зможемо змінити політику вилучення цивільних шин"
 SWE_unrestricted_submarine_warfare:0 "Необмежена підводна війна"
 SWI_ITA_puppet_fascism:0 "Швайцарський протекторат"
 SWI_air_production_desc:0 "Наявність конструкцій літаків для польотів — це лише перша частина головоломки, наступна — виробити достатньо, щоби наші пілоти завжди могли бути в повітрі для боротьби з нашими ворогами на землі та в небі."
 SWI_centralize_switzerland_desc:0 "[ROOT.GetNonIdeologyName], до якого ми рухаємося, дуже далекий від старої Швайцарської Конфедерації, яку ми мали майже століття. Ми більше не будемо конфедерацією, а централізованою країною, влада якої буде виходити згори і просочуватиметься в маси."
 SWI_councilor2_loc_key:0 "[?SWI.SWI_councilor_2.GetName]"
 SWI_decision_add_medium_MR_max:0 "Збільшить Вашу §Yмаксимальну £GFX_SWI_military_readiness_text_icon бойову готовність§! на §G+[?ROOT.SWI_mr_medium_amount]§!."
 SWI_expand_covert_operations:0 "Розширити таємні операції"
 SWI_expand_federal_police_intelligence:0 "Розширити розвідку федеральної поліції"
 SWI_extended_supply_lines_desc:0 "У світі швидких наступів і тривалих операцій логістика постачання є більш важливою, ніж будь-коли, і в міру того, як ми віддаляємося від наших кантонів у своїх зусиллях, виникає потреба в нових і кращих лініях постачання. Ми повинні навчитися поліпшувати нашу логістику, щоби ми могли розширити наші лінії постачання та швидше будувати нові."
 SWI_generic_fascist_neighbor:0 "наш сусід-фашист"
 SWI_gold_seized_opinion_bad:0 "Захопили наші золоті резерви!"
