 STAT_NAVY_TORPEDO_HIT_CHANCE_DIFF:0 " $VALUE|=+1$"
 SUBDOCTRINE_DEEP_BATTLE:0 "Глибокий бій"
 SUBDOCTRINE_FIELD_ENGINEERING_DESC:0 "Роль військових інженерів полягає у будівництві мостів та встановленні мін, а також у знищенні подібних споруд ворога. З правильним обладнанням, навчанням і готовністю пролити піт, щоб заощадити кров, ми можемо домінувати на сучасному полі бою."
 SUBDOCTRINE_INFILTRATION_TACTICS:0 "Тактика інфільтрації"
 SUBDOCTRINE_PEOPLES_WAR:0 "Народне ополчення"
 SUBDOCTRINE_SCREEN_HUNTER_KILLERS_DESC:0 "Поки ворожі підводні човни загрожують задушити нашу військову економіку, добре організовані та агресивні супровідні-есмінці можуть перетворити мисливця на здобич."
 SUBDOCTRINE_SCREEN_PATROL_BOATS:0 "Патрульні катери"
 SUBDOCTRINE_SUBMARINE_FLEET_OPERATIONS_DESC:0 "Масова інтеграція підводних човнів в основний бойовий флот для ведення розвідки та влаштування засідки на ворожі кораблі під час загальної сутички."
