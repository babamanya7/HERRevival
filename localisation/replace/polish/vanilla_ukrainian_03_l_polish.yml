 HUN_mavag_assault_guns_organization:0 "$HUN_mavag_assault_guns$"
 HUN_medal_5:0 "Військовий орден Марії Терезії"
 HUN_motorized_logistics:0 "Логістика моторизації"
 HUN_naval_warfare_desc:0 "Повернувши собі вихід до моря, ми мусимо зосередитися на створенні флоту, що відповідає рівню світової держави."
 HUN_pressure_romania_desc:0 "Зосереджуючись на фашистській загрозі із заходу, ми не можемо допустити існування можливої загрози в тилу — особливо на прикордонній смузі між нами та нашими східними союзниками. У Румунії мусить бути встановлений дружній комуністичний режим, або наші союзники мусять встановити контроль над важливими наземними транспортними шляхами, щоби ми могли продовжувати отримувати їхню підтримку."
 HUN_proclaim_greater_hungary_desc:0 "Повернувши собі належні нам території, ми відновили історичні кордони нашої держави. Тепер ми можемо оголосити усьому світу про формування Великої Угорщини та замислитися над своїми подальшими планами."
 HUN_protect_czechoslovakia:0 "Захист Чехословаччини"
 HUN_reintigrate_carpathian_ruthenia:0 "Реінтегрувати область [73.GetName]"
 HUN_reintigrate_eastern_slovakia:0 "Реінтегрувати область [71.GetName]"
 HUN_restauration_desc:0 "Ми не можемо гаяти часу, експериментуючи з новими неперевіреними конструкціями. Натомість ми пустимо у справу надійні проєкти старої імперії."
 HUN_sweden_hungary_unified_democratic:0 "Сполучені королівства Швеції й Угорщини"
 HUN_the_botond_desc:0 "Розвиток логістики та підвищення навантаження на транспортні шляхи призвело до необхідності нового типу вантажівки. Перші зразки проєкту Raba 38M «Botond» успішно пройшли випробування; тепер, маючи достатню кількість ресурсів, ми можемо фіналізувати проєкт та розпочати масове виробництво."
 HUN_the_revolutionary_council:0 "Революційна рада"
 ICE_expand_the_fishing_industry:0 "Розширити рибальство"
 ICE_expand_the_industrial_base_desc:0 "Позбувшись залежності від промислових товарів нашого пана, ми отримаємо сильнішу промисловість, а отже, і сильніший робітничий клас. Революція не може відбутися без правильних інструментів, і знявши залежність від нашого сюзерена, ця країна може отримати те, що їй потрібно, в тому числі зброю власного виробництва для здійснення революції, а також нові світлі уми."
 ICE_iceland_defense_force:0 "Сили оборони Ісландії"
 ICE_infiltrate_the_british_isles_category_desc:0 "Робітнича революція має поширюватися. Ідеальною відправною точкою є пригноблені робітники на Британських островах. Антиімперіалістичні та антикапіталістичні настрої можна і потрібно використати в повній мірі."
 ICE_taking_the_fight_to_our_enemies_desc:0 "Море оточує нас, і протягом століть великі моря формували наш народ і те, ким ми є. Скориставшись знаннями, які ми отримали з цього, ми можемо вести боротьбу з нашими ворогами там, де вони найменше очікують."
 ICE_the_icelandic_police_force_desc:0 "Армія Ісландії ніколи не буде дуже великою. Але в якості альтернативи ми можемо розширити обов'язки національної поліції, включивши до них захист від вторгнення. Таким чином ми зможемо більш ефективно використовувати обмежені людські ресурси, які у нас є, і краще підготувати оборону острова"
 ICE_united_we_stand:0 "В єдності сила"
