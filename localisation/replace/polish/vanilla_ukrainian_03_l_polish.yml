 XIC_war_in_yanan_desc:0 "З початком відновлення війни в провінції Шеньсі це лише питання часу, коли війська Армії боротьби з бандитизмом здадуться і дезертирують. Якщо ми хочемо перемогти, ми повинні діяти швидко і рішуче."
