 RAJ_nationalize_gun_carriage_agency_desc:0 "Агентство з виробництва лафетів є одним із наших основних джерел озброєння, цю владу не можна залишати в руках приватної корпорації, її потрібно націоналізувати."
 RAJ_neutrality_party:0 "ВБ"
 RAJ_ordnance_factory_medak_organization:0 "Збройовий завод у Медаку"
 RAJ_revolt_of_the_princes_desc:0 "Туземні князівства, довго підкорені британському правлінню, повстануть, щоб повернути свою спадщину."
 RAJ_rolling_nuke_barrages:0 "Послідовний ядерний обстріл"
 RAJ_secular_rule_desc:0 "Імперія Моголів процвітає завдяки різноманітності, і світська адміністрація забезпечує справедливе управління для всіх підданих, незалежно від віри. Надаючи пріоритет заслугам та рівності, ми зміцнюємо єдність імперії та забезпечуємо лояльність у її великих та різноманітних володіннях."
 RAJ_seek_help_from_germany_promised:0 " Німецький Райх пообіцяв надати допомогу"
 RAJ_seven_shackles_desc:0 "В'явасайбанді обмежує індіанців у вільному виборі професій, прив'язуючи їх до експлуатаційних систем. Демонтувавши цей кайдани, ми звільняємо робітників та даємо їм можливість внести свій внесок у справді незалежну та справедливу економіку."
 RAJ_strat_bomber_equipment_3:0 "Avro Lincoln"
 RAJ_strat_bomber_equipment_3_short:0 "Lincoln"
 RAJ_tac_bomber_equipment_3_short:0 "Mosquito B"
 RAJ_the_burma_rifles_desc:0 "Бірманські стрільці є вирішальною силою для підтримки безпеки на складних територіях східного кордону. Зміцнюючи та модернізуючи цей полк, ми забезпечуємо стабільність, захищаємо ключові регіони та готуємося до майбутніх викликів у цьому стратегічному районі."
 RAJ_the_burma_road_desc:0 "Бірманська дорога — це життєво важливий маршрут постачання, що з'єднує Індію з Південно-Східною Азією та за її межами. Забезпечення та розширення цього шляху гарантує постійний потік ресурсів та підкріплень, зміцнюючи нашу позицію в регіоні та підтримуючи наших союзників."
 RAJ_the_enemy_of_my_enemy_tt_2:0 "§Y[JAP.GetAdjective]§! також спробує вторгнутися в §Y[733.GetName]§! та передати його нам."
 RAJ_the_second_gorkha_war:0 "Друга Гуркхська війна"
 RAJ_thunder_elephants_desc:0 "Величні слони, символи могутності Моголів, повертаються на поле битви як втілення сили та традиції. Їхня чиста міць та присутність надихатимуть наші армії та вселятимуть страх у серця наших ворогів, прокладаючи шлях до імперських перемог."
 RAJ_timurid_empire_communism:0 "Тімурідська соціалістична республіка"
 RAJ_uplifting_the_people_of_india_desc:0 "Індійський народ повинен бути рішучим у своєму русі до незалежності. Для цього їхні основні потреби повинні бути задоволені першими; тому ми запровадимо політики для досягнення цього."
