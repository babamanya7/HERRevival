 FRA_the_old_school:0 "Стара школа"
 FRA_west_africa_intervention.3.desc:0 "Розуміючи, що поставки запасів ненадійні, а підкріплень не вистачає, прихильники режиму Віші та союзники довго маневрували і проводили контрманеври, намагаючись втягнути один одного у вирішальний бій на своїх умовах. Довівши і людей, і техніку до межі і не добившись вирішальної переваги, обидві сторони зміцнилися і чекають, доки супротивник не зробить перший хід."
