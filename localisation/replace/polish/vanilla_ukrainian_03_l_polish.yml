 AFG_political_events.172.a:0 "Це не варте боротьби"
 AFG_political_events.21.t:0 "[FROM.GetName] погоджується інвестувати в нашу економіку"
 AFG_political_events.30.t:0 "Майбутнє [ROOT.GetNonIdeologyName]"
 AFG_political_events.41.desc:0 "[FROM.GetAdjective] уряд погодився на наші вимоги щодо припинення іноземного втручання в їхню країну, яке могло б підірвати наші інтереси в регіоні. Хоча вони, безумовно, незадоволені нашим втручанням, схоже, вони не мають бажання воювати найближчим часом."
 AFG_political_events.61.t:0 "[FROM.GetNonIdeologyName] приєднується до $AFG_turko_persian_union$"
 AFG_political_events.70.c:0 "Кордони — це вирішене питання, і воно більше не обговорюватиметься."
 AFG_political_events_110_desc_balochistan:0 "Уряд [FROM.GetNameDef] запросив території Белуджистану. Вони стверджують, що ці землі по праву повинні належати їм, і доводять, що нинішні кордони несправедливо розділяють їхній народ та територію."
 AFG_promote_the_counter_elite_desc:0 "Серед політичної еліти є багато тих, хто має радикальні ідеї модернізації нації, але вони не змогли реалізувати ці ідеї через консервативний політичний клімат. З розпуском старого уряду, можливо, настав час просувати цих радикалів."
 AFG_quami_category:0 "Куамі"
 AFG_raise_lashkar_regiments_desc:0 "Повстанці Факіра Іпі у пуштунських районах Британського Раджу називали себе Лашкар. Тепер, коли він править [ROOT.GetNameDef], можливо, настав час офіційно створити подібні полки на державній службі."
 AFG_reclaim_transoxiana_desc:0 "Старі землі Трансоксанії колись належали Імперії Тимуридів, спадкоємцями якої ми є. Ми повинні повернути ці землі, інакше наша спадщина буде заплямована слабкістю та нерішучістю!"
 AFG_reintroduce_war_elephants_desc:0 "Поки світ намагається створити дедалі більш складні моторизовані жахіття, ми використовуватимемо перевірені та надійні методи ведення війни та вселятимемо страх у наших ворогів, відновивши використання бойових слонів."
 AFG_relieve_quami_tt:0 "Розпустити всі нерегулярні війська на даний момент. Їх можна буде сформувати знову в майбутньому."
 AFG_research_bonus_1_desc:0 "Великі держави продаватимуть нам лише те, що вважають застарілим і не загрожує їхнім інтересам у регіоні. Якщо ми хочемо розвинути сучасний флот, здатний стримувати ці великі держави, ми повинні інвестувати у розробку власних конструкцій."
 AFG_sov_iran_war:0 "Повалити шаха [PER.GetNonIdeologyName]"
 AFG_support_nort_west_frontier_rebels_desc:0 "Пуштунські повстанці на [RAJ.GetAdjective] Північно-Західному кордоні все ще хоробро борються проти своїх гнобителів, незважаючи на те, що Факір пішов до [ROOT.GetNameDef]. Ми повинні втрутитися та захистити їх, навіть якщо це може означати війну з тими, хто зараз претендує на цю територію."
