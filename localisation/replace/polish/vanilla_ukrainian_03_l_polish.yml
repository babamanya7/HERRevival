 RULE_MAXIMUM_FORT_LEVEL_NORMAL_DESC:0 "Держави можуть будувати наземні та берегові укріплення відповідно до звичайних обмежень."
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI:0 "Демократичні визвольні рухи"
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC:0 "§HКомуністи§! повалять уряд і боротимуться з іспанськими націоналістами під час іспанської громадянської війни, після чого об'єднають Піренейський півострів до Союзу європейських соціалістичних республік, останній бастіон Європи у боротьбі з фашизмом."
 RULE_OPTION_COMMUNIST_USA_AI_DESC:0 "§HАмериканський§! ШІ намагатиметься перейти в комунізм, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEMOCRATIC_PER_DESC:0 "ШІ змусить шаха дотримуватися конституційних обмежень і йти шляхом демократії, перш ніж зрештою спробувати приєднатися до демократичного альянсу."
