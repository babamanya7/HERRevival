 HUN_an_unlikely_alliance_desc:0 "Наша країна фундаментально змінилася: ми далеко пішли від вояк минулих років. Настав час протягнути руку дружби нашому старому ворогові і зв'язати наше майбутнє воєдино."
 HUN_antal_freiherr_becomes_available_as_general_tt:0 "§YАнталь фон Легар§! стане доступним як генерал рівня 4"
 HUN_boost_hungarian_aviation_industry:0 "Посилення угорської авіаційної промисловості"
