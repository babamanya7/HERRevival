 BUL_abolish_the_monarchy_desc:0 "Монархія, можливо, була корисним інструментом для підтримки стабільності в Болгарії в перші роки Третьої Болгарської держави, але після руйнівних воєн і тиранічних режимів люди втратили віру в цю застарілу систему правління. Настав час її скасувати."
 BUL_an_aegean_sea_fleet:0 "Флот Егейського моря"
 BUL_approach_british_foreign_industry_tt:0 "Знижена вартість прийняття рішення для §YІноземні угоди§! із [ENG.GetNameDef] та збільшена межа [ENG.GetAdjective]их заводів."
 BUL_approached_italy:0 "Звернулися до Італії"
 BUL_approached_the_uk:0 "Звернулися до Великої Британії"
 BUL_balkan_confederation_balkan_summit_desc:0 "Ми запросимо всі незалежні балканські країни взяти участь у Балканському з'їзді. Ця подія дозволить нам поступово просувати свої ідеї та збільшувати вплив Болгарії у країнах регіону."
 BUL_balkan_federation_industrial_aid_desc:0 "Наразі ми підтримуємо [FROM.GetAdjective]ий уряд, щоб держава [FROM.GetNameDef] могла наростити промисловість, перш ніж приєднатися до альянсу [ROOT.GetFactionName]."
