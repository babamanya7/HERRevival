 MEX_focus_coastal_defence_plan_desc:0 "У 1846 році американці показали нам, що хоча у нас є пустелі та гори, які дають нам стратегічну глибину на півночі, наші прибережні фланги вразливі для вторгнення амфібій. Ми повинні додати берегову оборону до наших портів і міст у Перській затоці та Тихому океані."
 MEX_focus_national_bank_desc:0 "Створений у 1925 році для відновлення економіки, зруйнованої громадянською війною, Banco de México є нашим кредитором останньої інстанції, емітентом валюти та інвестором у всілякі підприємства в інтересах держави."
 MEX_focus_northern_steel_plants_desc:0 "Найбільш промислово розвинений регіон Мексики за межами столиці — це північний кордон з Америкою. Міста вздовж Ріо-Гранде, такі як Матаморос і Сьюдад-Хуарес, мають тісні економічні зв'язки з прикордонними містами, такими як Браунсвілл й Ель-Пасо. Ми повинні використовувати найкращу інфраструктуру в регіоні для подальшого розвитку нашої важкої промисловості."
