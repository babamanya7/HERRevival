 PER_imperial_events.60.desc:0 "Сьогодні вранці посланець з [PER.Capital.GetCapitalVictoryPointName] прибув до [GER.Capital.GetCapitalVictoryPointName] з пропозицією від шаха [PER.GetNameDef] підписати Пакт про ненапад для забезпечення безпеки наших двох націй. Враховуючи велике виробництво життєво важливих ресурсів, таких як нафта, у [PER.GetNameDef], ми повинні взяти це до уваги."
 PER_imperial_events.71.desc:0 "У відповідь на наш лист доброї волі до [GER.GetNameDef], [GER.GetLeader] висловив зацікавленість у нашому візиті до Берліна з надією покращити стосунки між нашими новими націями. Це має бути коротка поїздка, оскільки у нас багато справ у Тегерані, але варто мати [GER.GetNameDef] на нашому боці, враховуючи напружену світову ситуацію."
