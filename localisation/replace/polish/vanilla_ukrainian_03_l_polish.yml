 DEN_infantry_equipment_3:0 "Madsen M/45"
 DEN_luftstotte_desc:0 "Найкраще використання наших ВПС полягає в тому, щоб якомога краще підтримувати наші сухопутні війська. Авіація стала надзвичайно важливою в сучасній війні, але війни все ще виграються на землі."
