 soviet.10.a:0 "Ми врятуємо вас від капіталізму."
 soviet.20.a:0 "Ми зробили, що могли."
 soviet.26.d:0 "Червона армія завжди була домівкою для підривних елементів іще відтоді, як сам Троцький був військовим комісаром. Документи, здобуті НКВС, викрили кількох високопоставлених офіцерів не лише як зрадників, але і як шпигунів. Михайло Тухачевський — один із найвідоміших підозрюваних, від якого Сталін прагне очистити армію. Тим часом, часті контакти флоту з іноземцями призвели до того, що багато з них також були заарештовані.\n\nХоча існують документи від наших ворогів, які доводять їхню провину, невідомо, чи вони сфабрикували їх, чи їм надали неправдиву інформацію ті, хто хотів, щоби ця чистка почалася з самого початку."
 soviet.28.d:0 "Світ, можливо, ніколи не дізнається, чи були сталінські чистки спрямовані на правильних людей, чи він нажив більше ворогів, намагаючися знищити кожного троцькіста в партії. Відомо лише те, що те, чого він боявся, врешті-решт сталося. Сьогодні Лев Троцький повернувся з заслання та за підтримки кількох впливових членів партії й офіцерів НКВС здійснив переворот, поваливши правління Сталіна. На колишнього генерального секретаря напали в його будинку з льодорубом і швидко стратили разом з кількома його прихильниками. Руйнування культу особи, який він створив, займе багато часу, але тепер люди знають, принаймні, що він не був безсмертним.\n\nОдним із небагатьох, кому вдалося врятуватися, був Іван Конєв. Запеклий прихильник Сталіна зумів зібрати певну підтримку і оголосив війну уряду Троцького, намагаючися повернути собі владу та «здійснити задум товариша Сталіна»."
