 news.110.t:0 "Падіння Вашингтону"
 news.125.t:0 "Падіння Калкутти"
 news.139.d:0 "Зруйнована Варшава впала під натиском радянських військ після того, як залишки німецьких загонів, відступили з палаючих передмість. Місто лежить у руїнах ще з минулих боїв, і місцеві повстанці вибираються з-під завалів, щоби вітати визволителів.\n\nТепер, коли Варшава опинилася під контролем СРСР, позиції Німеччини у Східній Європі стали більш хиткими. Експерти сумніваються, що німцям вдасться відбити місто, проте залякане населення серйозно боїться цього."
 news.147.d:0 "Ленінград, колишня столиця Російської імперії, був зайнятий фінськими військами. Три мільйони жителів — це ледь не більше, ніж населення всієї Фінляндії, проте тих, хто нападав, це не збентежило.\n\nЗараз точаться суперечки про те, чи має місто бути включене до складу Великої Фінляндії, оскільки інгерманландські фіни становлять у цьому регіоні суттєву етнічну меншість. Зрозуміло, це має сенс лише в тому випадку, якщо радянські війська не відіб'ють місто."
 news.150.d:0 "Спроби югославського уряду домовитися з Німеччиною викликали активні протести у лавах національної армії, і сьогодні під час перевороту було повалено чинного правителя. На престол зійшов король Петар II.\n\nНасамперед було обірвано більшість зв'язків з Німеччиною — схоже, новий режим готовий воювати, а не співпрацювати."
 news.154.b:0 "Комуністи не мають ні честі, ні совісті!"
 news.158.a:0 "Здається, [From.From.GetAdjective]а демонстрація сили була успішною."
 news.161.d:0 "[From.GetLeader] та його кабінет оголосили про розпуск партії [From.GetCommunistParty]. Після підписання СРСР пакту про ненапад із нацистською Німеччиною йшли розмови про те, що комунізм у Франції слід заборонити. З розподілом Польщі між СРСР та Німеччиною цей закон набув чинності.\n[From.GetLeader] скористався можливістю, коли навіть ліві газети почали домагатися заборони діяльності партії [From.GetCommunistParty]."
 news.167.a:0 "Ми будемо стежити за цим"
 news.168.f:0 "Поганий результат для нас."
 news.175.t:0 "Франція та Велика Британія вступили в альянс"
 news.176.t:0 "Велика Британія відкидає союз із Францією"
 news.177.b:0 "Vive la France et L'Entente!"
 news.178.t:0 "Ліві стають популярнішими у Франції"
 news.181.b:0 "Вороги демократії стають сильнішими."
 news.185.a:0 "[From.GetName] веде нас!"
 news.201.f:0 "Туреччина стала жертвою хижацької політики [GER.GetFactionName]"
 news.203.b:0 "Це визнання сили альянсу [GER.GetFactionName]."
 news.207.c:0 "Ми поставимо їх на коліна"
 news.208.c:0 "Вони зрозуміли, що здобич треба шукати деінде"
 news.224.b:0 "За кого себе має [ENG.GetNonIdeologyName]?"
 news.226.d:0 "\nСередземномор'я здавна було регіоном великої стратегічної цінності для імперського впливу [ENG.GetNameDef]. Зараз [ENG.GetAdjective]ий уряд шукає подальшої підтримки від країн регіону. З цією метою він призначив «спеціального консула в державі [GRE.GetAdjective]». \n\nБільш ніж за століття після участі лорда Байрона в грецькій війні за незалежність, чи буде [ENG.GetNameDef] успішною, ще належить з'ясувати."
 news.228.e:0 "[ENG.GetNameDefCap] готує свою стратегію."
 news.23.c:0 "Хай живе король Зогу!"
 news.238.a:0 "Цікава стратегія."
 news.24.a:0 "Війна наближається."
 news.240.b:0 "Слід робити те, що необхідно для виживання."
 news.243.d:0 "Після нещодавніх перемог [AST.GetNameDef] і [JAP.GetNameDef] у Східній Азії та Тихоокеанському регіоні, багато спостерігачів очікували, що це лише питання часу, коли ці дві імперії, що зростають, зіткнуться в конфлікті. Однак замість цього країни досягли угоди про співпрацю, яку швидко назвали «Тихоокеанським бар'єром».\nДоговір не був опублікований жодною з країн, тому багато аспектів їхньої домовленості невідомі. Безперечно те, що обидві сторони пообіцяли одна одній військову підтримку, щоб «протистояти просуванню жадібних чужинців у наших відповідних регіонах».\n\nЗанадто рано говорити про те, як виглядає світовий порядок, передбачений [JAP.GetNameDef] і [AST.GetNameDef], але не може бути ніяких сумнівів, що [AST.GetFactionName] зараз є домінуючою силою в Тихому океані."
 news.248.a:0 "[ENG.GetNameDefCap] більше не має опори в Північній Америці..."
 news.250.c:0 "Це велика ціна для нашої країни, але вона має бути сплачена."
 news.251.b:0 "[ENG.GetNameDefCap] слабшає день у день."
 news.26.e:0 "Вирішимо ж це раз і назавжди."
 news.264.c:0 "Подивимося, чи збережеться їхній ідеалізм у майбутній війні."
 news.272.t:0 "Голод у Бенгалії накрив країну"
 news.30.a:0 "Уявіть, якби їм це вдалося..."
 news.300.b:0 "Ми мусимо думати швидко..."
 news.301.t:0 "[ROM.GetNameDefCap] повертає Трансільванію"
 news.306.t:0 "Угорщина вимагає Воєводину"
 news.309.b:0 "Це не дріб'язкова вимога..."
 news.330.desc:0 "Не погоджуючись з фундаментальними аспектами радянського комунізму, югослави обрали власний підхід до ідеології. Замість того, щоб бути членом Комінтерну, югославський уряд оголосив, що прагне очолити південних слов'ян у їхній боротьбі за права робітників. Цілком ймовірно, що незабаром вони спробують залучити до цієї боротьби своїх сусідів, що може серйозно порушити баланс сил у регіоні."
 news.333.b:0 "Це обурливо!"
 news.335.f:0 "Це може ускладнити ситуацію в Китаї"
 news.34.b:0 "Чудово!"
 news.48.t:0 "Амелія Ергарт зникає"
 news.60.t:0 "Доля Чехословаччини"
 news.62.d_2:0 "Після анексії Чехословаччини Німеччиною почалися суперечки про те, яким чином мають бути розділені ці території, але тепер, схоже, рішення знайдено.\n\nАнексована територія була поділена на два протекторати, підконтрольні Німеччині. Насправді це означає, що Німеччина приєднала до себе всю територію Чехословаччини."
 news.7.d:0 "Між радянськими та японськими військами на маньчжурському кордоні нещодавно стався серйозний інцидент.\n\nВеликий підрозділ радянської армії за підтримки монгольської кавалерії застав супротивника зненацька, і японці зазнали великих втрат.\n\nУ Токіо це викликало зрозумілу напругу, але поки що незрозуміло, чи переросте конфлікт у відкриту війну."
 night_vision_desc:0 "Можливість бачити ворога, залишаючись при цьому непоміченими, — запорука успіху нічної операції. З появою інфрачервоних датчиків ми можемо укомплектувати нашу армію пристроями, які роблять це можливим (нехай і громіздкими)."
