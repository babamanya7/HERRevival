 SDL_communism_DEF:0 "Судетська комуна"
 SEA_PHI_political_events.13.desc:0 "Комуністична партія [PHI.GetNameDef] неодноразово відкидала наших представників і погрожувала розірвати з нами всі відносини.\n\nВищі військові чини поклали військовий план на стіл [Root.GetLeader]. Прихильники плану стверджують, що комуністичні Філіппіни є загрозою нашій безпеці, і ми повинні втрутитися, щоб зупинити поширення комунізму."
 SEA_PHI_political_events.31.a:0 "Ласкаво просимо на Філіппіни!"
 SEA_PHI_political_events.43.t:0 "Облога Національних зборів"
 SEA_PHI_political_events.48.desc.3:0 "Раніше сьогодні ми отримали повідомлення про порушення в [FROM.GetNameDef]. Після цього ми отримали декларацію незалежності від їхнього уряду з чіткою заявою про підтримку від кількох південноамериканських урядів. Хоча заява закликає нас не втручатися, [FROM.GetAdjective]ий уряд чітко дав зрозуміти, що вони не ухилятимуться від боротьби за збереження своєї нової незалежності, маючи підтримку з Південної Америки."
 SEA_PHI_political_events.71.b:0 "Ми повинні наполягати"
 SEA_PRC_border_war_events.1.b:0 "Ми повинні відступити..."
 SEA_PRC_faction_events.10.b:0 "Ми ніколи не підкоримося їхньому керівництву!"
 SEA_PRC_faction_events.31.desc:0 "[FROM.GetNameDefCap] прийняв наш «запит» на передачу регіонів, в які ми успішно проникли, що призвело до збільшення наших офіційних володінь. [FROM.GetNameDefCap] не був у захваті від цього, але не наважився нам суперечити. Ця територія тепер офіційно перебуватиме під управлінням [ROOT.GetNameDef]."
 SEA_PRC_faction_events.71.b:0 "Ніколи, вони наші"
 SEA_PRC_faction_events.74.desc:0 "Незважаючи на пропозицію, [FROM.GetLeader] оголосив, що [FROM.GetNameDef] відмовляється від пропозиції [PRC.GetNameDef] приєднатися до новоствореного [PRC.GetFactionName], заявивши, що [FROM.GetAdjective]ий народ надає перевагу статусу-кво."
 SEA_PRC_fourth_army_incident.1.t:0 "Заворушення серед союзників"
 SEA_PRC_fourth_army_incident.2.a:0 "На щастя, ми можемо зосередитися на реальній загрозі"
 SEA_PRC_fourth_army_incident.2.desc:0 "Після кількох інцидентів між нашими командирами та командирами [FROM.GetNameDef], їхній уряд надіслав нам повідомлення з метою заспокоїти напруженість. Вони офіційно підтвердили, що ми можемо зберегти командування власними військами, і прагнуть налагодити більш двосторонню співпрацю шляхом координації наших планів."
 SEA_PRC_fourth_army_incident.6.desc:0 "Після нещодавнього інциденту, коли війська [ROOT.GetName] вступили в бій з військами [FROM.GetName], остання залишила [ROOT.GetFactionName]. Інцидент, у якому Нова 4-та армія [FROM.GetNameDef] зазнала дуже важких втрат, стався після розбіжностей щодо наказів про відступ, що призвело до того, що невідома сторона відкрила вогонь, коли наші відступаючі війська зустріли солдатів [FROM.GetName]."
 SEA_PRC_political_events.23.desc:0 "\nНезважаючи на придатність $SOV_vasily_chuykov$ як аташе в [ROOT.GetNameDef], [FROM.GetNameDef] вирішив не відправляти ні його, ні $SOV_aleksandr_cherepanov$, стверджуючи, що вони наразі задіяні у важливіших військових планах."
 SEA_PRC_political_events.8.b:0 "Це може змусити їх діяти агресивніше"
 SEA_PRC_request_aid.4.c.tt:0 "Ми погодимося виробити §R150 танків Т-34§! для §Y[FROM.GetName]§!"
