 JAP_ignite_the_korean_peninsula_desc:0 "[KOR.GetAdjective]ий народ ще не звільнений. Ми повинні встановити контакт з революціонерами на [KOR.GetAdjective]ому півдні і змусити їх розпочати революцію. Це має дати нам можливість втрутитися і захистити [KOR.GetAdjective]ий народ від громадянської війни, що послідує за цим."
