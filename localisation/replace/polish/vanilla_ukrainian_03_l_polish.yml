 YUG_expand_the_submarine_fleet_desc:0 "Замість того, щоби кидати ворогу лобовий удар нашим нижчим флотом, ми повинні зосередитися на підводних човнах, щоб турбувати ворога та націлюватися на його торгове судно."
 YUG_expand_the_university_of_belgrad_desc:0 "Розширюючи наш найпрестижніший університет, ми можемо збільшити приплив світлих умів до наших дослідницьких команд."
