 POL_SANATION_neutrality_DEF:0 "Польський санаціоністський уряд"
 POL_anti_air_equipment_1_short:0 "40mm wz. 36"
 POL_anti_blitz_tactics:0 "Антиблискавичні тактики"
 POL_anti_monarchist_purge:0 "Антимонархістська чистка в армії"
 POL_arm_monarchist_militants:0 "Озброїти бойовиків-монархістів"
 POL_armia_ludowa_desc:0 "Ми не можемо перевершити іноземних імперіалістів, але ми можемо організувати лівих бойовиків, які готові померти в боротьбі, незважаючи ні на що. Створивши Народну армію як військову структуру нашої партії, ми гарантуємо, що завжди матимемо армію, вірну амбіціям нашої соціалістичної революції!"
 POL_artillery_equipment_1_short:0 "75mm wz. 31"
 POL_authoritarianism_desc:0 "Демократія — це слабке рішення складних проблем. Якщо влада має бути силою, вона повинна бути звільнена від кайданів консенсусу."
 POL_central_defence_of_poland_desc:0 "Польщі не вистачає обладнання, необхідного для захисту від незліченних загроз на її кордонах. Розширивши Міністерство національної оборони, ми будемо краще озброєні для боротьби з будь-якою армією, яка намагатиметься жорстоко поводитися з Польщею в умовах окупації."
 POL_cv_nav_bomber_equipment_2:0 "PZL.60 Lew Morski Floty"
 POL_diplomatic_mission_to_YUG:0 "Дипломатична місія в державу [YUG.GetNameDef]"
 POL_expand_strikes_to_factories:0 "Розширити страйки на заводи"
 POL_german_staff_desc:0 "У Польщі проживає значна німецька меншина, і хоча німці намагатимуться використати цих молодих людей проти нас, наш нинішній стан співпраці з Німеччиною може зробити німецькі громади в Польщі більш прихильними до нашої справи."
 POL_habsburg_events.1.t:0 "[From.GetNameDefCap] вимагає правління Габсбургів!"
 POL_habsburg_events.2.b:0 "Нам це не цікаво."
 POL_heavy_fighter_concept:0 "Концепція важких винищувачів"
 POL_institute_royal_guards:0 "Утворити королівську гвардію"
 POL_invite_norway_desc:0 "Не секрет, що німці мають амбіції та плани щодо Норвегії, і в їхньому народі вже є люди, готові співпрацювати з цими іноземними загарбниками. Запросивши їх до Міжмор'я, ми пропонуємо норвежцям унікальну можливість протистояти німецькій агресії, не прогинаючись під неї."
 POL_liberalism_focus_desc:0 "$POL_liberalism_desc$"
 POL_monarchist_civil_war:0 "$ignite_the_fascist_civil_war$"
 POL_national_defence_fund_idea_desc:0 "Польща зробила значні інвестиції в національну оборону, привласнюючи активи з цивільного сектору для використання в будівництві об'єктів, корисних для військових."
 POL_nav_bomber_equipment_2_short:0 "Lew Morski"
 POL_polish_militarism:0 "Польський мілітаризм"
 POL_preserve_baltic_independence:0 "Зберегти балтійську незалежність"
 POL_raise_the_black_madonna_desc:0 "Чорна Мадонна — це священний портрет Пресвятої Богородиці, популярний серед польських нижчих класів як покровителька Польщі та її нижчих класів. Прийнявши Чорну Мадонну як символ нашого руху, наш народ знатиме, що Пресвята Богородиця буде на нашому боці, коли прийде час."
 POL_sanation_right_opposition_3_desc:0 "[Root.GetRightDesc] Наразі праві санаціоністи вважає, що Диктатура намагається підірвати авторитет військових і використовує свої позиції у вищому військовому командуванні, щоб підірвати польську армію."
 POL_seek_an_alliance_with_kaiser:0 "Шукати союзу з кайзером"
 POL_seek_german_alignment:0 "Шукати німецького зближення"
 POL_seize_equipment:0 "Захопити військове оснащення"
 POL_slavic_revanchism:0 "Польський реваншизм"
 POL_super_heavy_tank_equipment_1:0 "52TP Behemot"
 POL_supply_the_rail_nexus_desc:0 "Залізниці у Східній Польщі перебувають у жалюгідному стані, який не можна порівняти з центральним регіоном Польщі. Війна з державою [SOV.GetNameDef] може бути виграна або програна за умови контролю над постачанням, і гідний ланцюг постачання для наших власних людей був би чудовим місцем для початку."
 POL_the_north_sea_desc:0 "Перш ніж ми навіть почнемо розглядати можливість схилити нейтральні держави Півночі до приєднання до нашого альянсу, ми повинні закласти основу на світовій дипломатичній арені. Ми повинні повідомити північним державам про наше прагнення до співпраці і відправити Юзефа Бека з його навичками до Нордичних країн, щоб переконати їх у численних перевагах приєднання до Міжмор'я."
 POL_the_prusya_army:0 "Прусська гвардія"
 POR_bought_guns:0 "Придбали зброю"
 POR_const_kingdom_democratic_ADJ:0 "Португальськ"
 POR_evade_blockade_with_portuguese_convoys:0 "Уникнути блокади за допомогою португальських конвоїв"
 POR_iberian_summit_pro_allies_desc:0 "Ми повинні стати на бік [ENG.GetAdjective]их сил і протистояти всім тим, хто загрожує нашій свободі і прагне домінувати над нами.\nМи надішлемо послання [GetIberianSummitReceiverName]ії, закликаючи її обговорити спільну пропозицію з проханням до держави [ENG.GetNameDef] прийняти нас до альянсу [ENG.GetFactionName]."
 POR_infantry_equipment_0_short:0 "Espingarda m/04"
 POR_infantry_equipment_2_short:0 "Bergmann MP28"
 POR_light_aircraft_focus:0 "Акцент на легкі літаки"
 POR_luso_tropicalism_desc:0 "Ми повинні визнати мультикультурний характер Португалії з 15-го століття та підкреслювати національну єдність, інтегруючи наші африканські колонії на нашу територію та надаючи громадянство місцевому населенню. Звичайно, будуть недоброзичливці, але ми повинні робити те, що правильно для людей, які живуть на наших територіях."
 POR_modern_tank_equipment_1_short:0 "CDC-8"
 POR_national_cruiser_production_desc:0 "Ми повинні й надалі зосереджуватися на будівництві великих кораблів. Сучасні крейсери забезпечать нашому флоту велику вогневу міць."
 POR_naval_blockade:0 "Морська блокада"
 POR_recover_brazil_desc:0 "Щоби відновити славу старої Португальської імперії, ми повинні зосередитися на наших колишніх американських колоніях. Бразильська земля належить Португалії, і тому вона повинна бути відвойована силою."
 POR_restoration_of_the_monarchy:0 "Відновлення монархії"
 POR_standardization:0 "Стандартизація"
 POR_the_communist_threat:0 "Комуністична загроза"
 POR_the_empire_of_brazil:0 "Бразильська імперія"
 POWER_PROJECTION_BLURB:0 "\n§gПроєкція сили альянсу впливає на ймовірність того, що країни приймуть запрошення до альянсу, і слугує тай-брейкером під час мирних конференцій.§!"
 PRC_GATHERING_STORM_DESC:0 "Якісь два роки тому Комуністична партія Китаю зіштовхнулася з ризиком повного знищення. Щоб вижити, їй довелося пройти довгий шлях, пізніше відомий як Великий похід. Лише частина армії пережила негаразди цього маршу та майже повної відсутності промисловості, тож шанси на перемогу в громадянській війні в Китаї справді мізерні.\n\nАле з часом можна буде навернути населення на підтримку ідей комунізму, створити нові армії та бази на нових землях, і, коли настане час, поновити революційну боротьбу, поки не буде здобуто остаточну перемогу."
 PRC_a_modern_army:0 "Сучасна армія"
 PRC_ballistic_missile_equipment_2:0 "Dongfeng 2"
 PRC_ban_the_opium_trade_desc:0 "Опіум — інструмент західних держав, з допомогою якого планували поставити нас навколішки. Ми не дозволимо цьому злу вкорінитися в нашій країні."
 PRC_bolshevik_aid_default:0 "Допомога від радянських більшовиків"
 PRC_demand_warlord_loyalty:0 "Вимагати лояльності від мілітаристів"
 PRC_economy_shortcut:0 "Економіка"
 PRC_emphasize_urban_support:0 "£BoP_right_texticon Наголосити на підтримці міст"
 PRC_enforce_the_three_rules_desc:0 "Перше: виконувати накази.\nДруге: не чіпати майно селян.\nТретє: здавати владі всі захоплені трофеї.\nЦі прості правила мусять показати простому народу, що ми на його боці."
 PRC_establish_friendly_bases_2_tt:0 "§RОкуповані ворогом регіони§!, які мають §Y$PRC_guerilla_cells_active_2$§! або є §Yнаціональними регіонами§! суб'єкта з іноземним сюзереном, тепер можуть отримати §Y$PRC_anti_japanese_base$§!"
 PRC_guide_central_committee:0 "Спрямовувати Центральний комітет"
 PRC_heavy_tank_destroyer_equipment_2:0 "PTZ 41 D"
 PRC_infantry_equipment_2_short:0 "TsingTao MP18"
 PRC_infiltrate_hebei:0 "Проникнути в Хебей"
 PRC_infiltrate_hulunbuir:0 "Проникнути в Хулун-Буїр"
 PRC_infiltrate_jinan:0 "Проникнути в Цзінань"
 PRC_invite_otto_braun:0 "Запросити Отто Брауна"
 PRC_invite_soviet_general:0 "Запросити радянських генералів"
 PRC_know_the_enemy_desc:0 "Наші сусіди можуть бути дружніми зараз, але ми повинні вжити запобіжних заходів, щоб оглянути їхню оборону на випадок зміни ситуації."
