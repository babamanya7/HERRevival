 CHI_ledo_road_reopen_state:0 "Заново відкрити дорогу Ледо в цій області.\n"
 CHI_liberate_the_peoples_of_asia_tt_2:0 "Розблоковує рішення для створення маріонеткових урядів по всій §Y$asia$ §!"
 CHI_light_tank_equipment_3_short:0 "Type 41"
 CHI_local_arms_development_desc:0 "Виробництво грубих копій іноземного озброєння нас не влаштовує. Щоби не відставати від решти Китаю, ми маємо розпочати розробку власної зброї."
 CHI_minzu_focus:0 "Принцип Міньцзу"
 CHI_mission_to_the_soviet_union:0 "Делегація в Радянський Союз"
 CHI_opium_cat_desc:0 "Незаконна торгівля є хворобою нашого суспільства, що вражає як простих людей, так і найвищі щаблі влади. Ми повинні вжити рішучих заходів, щоб викорінити її та відновити доброчесність у наших громадах."
 CHI_power_struggle_defeated_democratic:0 "Республіканський уряд Китаю"
 CHI_reform_the_national_bank_desc:0 "Новий національний банк займеться координацією економічних операцій держави та розподілом фінансування."
 CHI_renegotiate_the_unequal_treaties:0 "Переоглянути несправедливі договори"
 CHI_retreat_to_taiwan_desc:0 "Наш відновлений конфлікт з [PRC.GetNameDef] розвивається не обов'язково на нашу користь, і ми втрачаємо позиції. Дедалі більше людей висловлюють своє занепокоєння і відкрито закликають нас до тактичного відступу на Тайвань, щоб відновити наші сили та вижити."
 CHI_root_out_corruption_desc:0 "Чиновники багато років зловживали своїм становищем, щоби набивати кишені та залякувати народ, заплющуючи очі на злодіяння злочинців. Час покласти цьому кінець."
 CHI_sea_50_cheaper_force_attack:0 "$CHI_50_cheaper_force_attack$"
 CHI_sea_defensive_posture:0 "$CHI_defensive_posture$"
 CHI_sea_fund_research_projects_desc:0 "Щоб зберегти перевагу над нашими супротивниками, важливо, щоб ми знали про новітні технологічні досягнення та могли їх використовувати. Фінансуючи дослідницькі проєкти, ми можемо забезпечити це, водночас допомагаючи нашому населенню."
