 PER_strengthen_iranian_parliament_desc:0 "З обмеженням повноважень шаха, ми можемо покращити наш демократичний процес, повернувши владу обраним палатам парламенту, де їй і місце."
 PER_war_plan_cambyses_desc:0 "Як безпосередній наступник Кіра Великого, Камбіз II був другим Царем Царів Імперії Ахеменідів. Оскільки його правління було відзначене завоюваннями в Північній Африці та Єгипті, наші кампанії в регіоні були названі на його честь, щоб вшанувати його славу."
 PER_we_survived_desc:0 "We have managed to survive against all odds! Now the time comes to create stability for our people."
