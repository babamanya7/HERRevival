 RULE_OPTION_OCEANIA_DECOLONIZED:0 "Океанія деколонізована"
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC:0 "Переможці з менш ніж 5% внеску у війну дають усі свої бали іншим переможцям.\nНе застосовується, якщо жоден із переможців не має принаймні 10% внеску у війну.\nНе застосовується до гравців-людей."
 RULE_OPTION_REVOLUTION_DEMOCRATIC_INS_AI_DESC:0 "The AI will start an early revolution. Sutan Sjahrir will take power and establish a democratic government."
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED_DESC:0 "Усі доступні для звільнення республіки, округи та території в складі Радянського Союзу будуть створені як вільні та незалежні нації після початку гри."
 RULE_OPTION_SWI_IMPERIAL_AI_DESC:0 "ШІ спробує утворити Альпійський протекторат, відмовившись від нейтралітету та демократії на користь мілітаристського та експансіоністського режиму."
