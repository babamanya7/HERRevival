 GER_german_monarchy_conservative_democratic_DEF:0 "Королівство Німеччина"
 GER_gw_armored_car_equipment:0 "Sonderkraftfahrzeug 222"
 GER_incorporate_the_polish_rump_state_desc:0 "Навіть останні залишки Польщі належать імперії, як це передбачено Брест-Литовським договором. Ми повинні повернути ці території, за потреби — силою."
 GER_infantry_equipment_2:0 "MP 38"
 GER_institute_price_controls_desc:0 "Ми мусимо вжити різних заходів для посилення нашого контролю над фінансами, щоб вони не прогиналися під нашими амбітними цілями стати самодостатніми. Ми мусимо мати можливість регулювати ціни на імпорт, товари першої необхідності та заробітну плату робітників, щоб приборкати інфляцію та забезпечити економічну стабільність."
 GER_integrate_war_economies_desc:0 "Інші нації у нашій сфері впливу залежать від нас у економічних питаннях. Цим можна скористатися, щоб установити щільніший контроль не лише над їхньою економікою, а й над зовнішньою політикою."
 GER_integration_of_puppet_economies_dec_cat:0 "$GER_integration_of_puppet_economies$"
 GER_invite_to_faction_cat:0 "Розширення нашого альянсу"
 GER_is_colonial_overlord_desc:0 "Ми боялися, що цей день настане. Лідер [FROM.GetNameDef] [FROM.GetLeader] вимагає, щоби ми, як підлеглі, здали нашу автономію та стали повноправною частиною [FROM.GetNameDef]. У нас немає вибору, окрім як підкоритися."
 GER_light_tank_artillery_equipment_3_desc:0 "Waffenträger Leopard був спланованою самохідною артилерійською машиною на базі запланованого шасі VK1602 Leopard."
 GER_light_tank_equipment_2:0 "Panzerkampfwagen II"
 GER_light_tank_equipment_2_short:0 "Panzer II"
 GER_mass_production:0 "Масове виробництво"
 GER_ministry_of_public_enlightenment:0 "Міністерство громадської просвіти"
 GER_mio_trait_involve_porsche_in_special_projects:0 "Залучення Porsche до спеціальних проєктів"
 GER_monroe_doctrine_countries_in_opposition:0 "Країни в опозиції:\n[GetMonroeOppositionGoodBad]"
 GER_monroe_doctrine_countries_in_the_doctrine:0 "Всього країн, яких включає Доктрина Монро:\n[?global.monroe_doctrine_countries_to_destabilize^num]"
 GER_operation_panzerfaust_events.09.desc:0 "Сьогодні ми отримали новину, що змову німців з метою усунення та викрадення Горті й його сина зірвано — їхні агенти були схоплені біля резиденції."
 GER_optimize_reich_labour_service_desc:0 "Імперська служба праці виконує важливу функцію з забезпечення зайнятості нашого населення, але ми вважаємо, що її можна використати для більшого. Ми могли б оптимізувати вжиток RAD, щоб отримати від неї максимальну віддачу в усіх аспектах: праці, пропаганді та підготовці до війни."
 GER_pool_technical_know_how_ww_desc:0 "$GER_pool_technical_know_how_desc$"
 GER_prepare_for_the_next_blockade_ww_desc:0 "Коли інші країни усвідомлять масштаби нашої підготовки, неминуче виникнуть заперечення з боку декотрих із них. Ми вже стикалися з блокадами раніше та знаємо, як їх долати. За належної підготовки, їхні блокади не матимуть на нас майже жодного впливу."
 GER_prioritize_the_army:0 "Надати перевагу армії"
 GER_rally_the_nation_tt:0 "Ми зможемо обрати національний дух, який доведеться або змінити, або видалити після завершення громадянської війни."
 GER_realize_mittelafrika:0 "Втілити Міттельафріку"
 GER_recalled_hans_krebs_from_russia_flag:0 "§YГанс Кребс§! відкликаний з §Y[SOV.GetNameDef]§!"
 GER_reichskommissariat_mittelafrika:0 "Райхскомісаріат Середня Африка"
 GER_reichskommissariats_desc:0 "Із захопленням нових територій виникає опір і потреба в ефективному адмініструванні. Тому райхсміністр Альфред Розенберг запропонував створити спеціальні окупаційні режими, які він називає райхскомісаріатами, що допоможуть контролювати місцеве населення та боротися з бійцями опору на більш локальному рівні, ніж це можуть зробити наші регулярні війська."
 GER_reorganize_african_schutztruppe_tt:0 "Додає §Y1 батальйон ополчення§!, §Y1 інженерний батальйон§! і §Y1 розвідбатальйон§! шаблону §YAfrikanische Schutztruppe§!. \nДодає §Y1 батальйон ополчення§! шаблону §YAskari Schutztruppe§!."
 GER_revive_the_schutztruppe_tt:0 "Відімкне колоніальні ополчення §YSchutztruppe§! та сукупність рішень для їхнього §Yвербування§! та §Yполіпшення§!."
 GER_secure_portugal_desc:0 "Іще під час Великої війни [POR.GetAdjective]ий народ був підданий пропаганді наших супротивників і повернувся проти нас. Деякі з наших старих кораблів досі стоять у їхніх гаванях, і жодного слова не було сказано про їхнє повернення. Хоча зараз вони виглядають досить дружелюбно, ми не можемо їм довіряти й маємо дати їм зрозуміти, що якщо вони не бажають війни, то настав час підкоритися нашій владі."
 GER_secure_the_new_state:0 "Безпека нової держави"
 GER_seize_foreign_industries_desc:0 "Інтегруючи іноземні галузі в нашу економіку, ми забезпечуємо життєво важливі ресурси, які сприяють нашим військовим зусиллям та виробництву."
 GER_shared_rd_programs_desc:0 "Заради загального блага ми маємо об'єднати зусилля та ділитися технологічним прогресом зі своїми новими союзниками."
 GER_shared_rd_programs_ww:0 "$GER_shared_rd_programs$"
 GER_social_ownership_desc:0 "Ми бачили, що відбувається, коли важливі державні служби контролюють ті, чиї цілі не збігаються з інтересами народу. Щоб це більше ніколи не повторилося, ми повинні перевести промисловість у суспільну власність."
 GER_state_controlled_economy:0 "Державна економіка"
 GER_state_development_central:0 "Програми громадських робіт в Центральній Німеччині"
 GER_strafbataillon:0 "Strafbataillon"
 GER_strengthen_the_proletarian_international_internationally_tt:0 "Кожна країна §Yпоза Європою§!, на яку §Y[GER.GetNameWithFlag]§! вплинув у напрямку §Yкомунізму§!, буде запрошена до §YПролетарського Інтернаціоналу§!. Цей ефект також поширюється на країни, які були схилені до комунізму §Yпісля цього фокуса§!."
 GER_sway_the_balkans:0 "Залучити Балкани"
 GER_the_fate_of_the_saf_area:0 "Передати південноафриканську адміністрацію райхскомісаріату Міттельафрика"
 GER_the_supreme_leader_desc:0 "Завдяки цілеспрямованим реформам і програмам із відродження лояльність Вермахту до [ROOT.GetLeader] та [ROOT.GetLeader.GetHerHis] справи досягла нової висоти. Цю тенденцію повної підтримки нашого лідера та Батьківщини необхідно продовжувати."
 GER_train_schutztruppe_in_bismarck:0 "Мобілізувати Шуцтруппе на архіпелазі Бісмарка"
 GER_unlocks_kremlin_raid_tt:0 "Відкриває можливість §Yавіаудару§! по §YКремлю§! під час війни з §Y[SOV.GetNameWithFlag]§!"
 GER_utilize_the_nordliche_gesellschaft:0 "Застосувати Nordische Gesellschaft"
 GER_war_against_european_communism_tt:0 "Здобуде ціль війни §YАнексія§! проти всякої §Yкомуністичної§! держави в §YЄвропі§!. Нинішні цілі:"
 GER_wolfpack_tactics_desc:0 "Ідея нападу на конвої підводними човнами не нова й застосовувалася під час Великої війни, але була запропонована нова тактика. Цей новий підхід передбачає, що наші підводні човни співпрацюватимуть у зграях (Rudel), щоби знайти та потопити торгові судна. Це може стати ключем до позбавлення ворога сировини й можливості продовжувати війну."
 GIE_REINSTATE_ENABLED_EXILE_VIEWING_LIBERATED:0 "Наша країна повністю звільнена, й §Hлегітимність§! зменшуватиметься щодня на $VALUE|H2$. Як тільки §Hлегітимність§! впаде до §H0§!, наш уряд буде відновлений автоматично."
 GNA_democratic_DEF:0 "Республіка Гвінея"
 GNB_democratic_ADJ:0 "Біссауськ"
 GOE_RAJ.16.t:0 "[FROM.GetNameDefCap] передає [992.GetName]"
 GOE_RAJ.2.desc:0 "[FROM.GetName] санкціонував наш запит на територіальну експансію. На нашому шляху має бути невеликий опір."
 GOE_RAJ.26.desc:0 "Ми успішно звільнили нашого лідера з в'язниці. Велика перевага, яка принесе структуру нашій справі."
 GOE_RAJ.27.t:0 "[RAJ.GetNameDefCap] бажає білого миру"
 GOE_RAJ.32.t:0 "Питання Адену"
 GOE_RAJ.38.t:0 "Імперія завдає удару у відповідь"
 GOE_RAJ.39.c:0 "Закінчити зустріч"
 GOE_RAJ.49.desc:0 "Пакистанські війська зберігають контроль над Калькуттою. Індійські сили відступили після важких боїв, і Пакистан продовжує утримувати регіон. Індійські радіопередачі цензурують цю невдачу, щоб уникнути національного збентеження."
 GOE_RAJ.5.t:0 "[FROM.GetName] відмовляє"
 GOE_RAJ_eic.2.t:0 "Призначити генерального директора"
 GOE_RAJ_eic.8.t:0 "[FROM.GetName] виключає будь-які передачі"
 GOE_RAJ_famine.11.a:0 "Чудово!"
 GOE_RAJ_famine.11.desc:0 "[FROM.GetName] щедро надала нам великий пакет допомоги, допомагаючи полегшити голод та запобігти його подальшому поширенню на сусідні штати."
 GOE_RAJ_famine.9.tt:0 "Активує рішення §YГолод§!"
 GOE_RAJ_goa.1.b:0 "Абсолютно ні. Гоа наш!"
 GOE_RAJ_loyalist.16.desc:0 "[FROM.GetNameDefCap] надав нам права на ресурси $state_resource_tungsten$ у [288.GetName]. Це має допомогти нам у наших військових зусиллях і допоможе нам продовжувати боротьбу в ім'я Корони."
 GOE_RAJ_navy.9.desc:0 "[FROM.GetLeader] відхилив нашу пропозицію придбати їхні кораблі, і тепер ми повинні шукати альтернативу для розширення нашого флоту."
 GOE_RAJ_partition.8.desc:0 "Чоловік, ідентифікований як Натхурам Годсе, намагався здійснити замах на Махатму Ганді під час міжконфесійної молитовної зустрічі, але був затриманий членами президентської охорони, перш ніж він зміг вистрілити. \nГанді підтверджено в безпеці та був доставлений у безпечне місце; прес-секретарі сказали, що він був стурбований випробуванням і, здається, занурився у глибокі роздуми про майбутній стан світу та своє місце в ньому."
 GOE_form_country_india_coring_states_tt:0 "Всі §Yіндійські§! області стають осердними."
 GOE_generic_events.4.t:0 "[FROM.GetAdjective] адміністрація оголошує незалежність"
 GOT_democratic:0 "Шведські вигнанці"
 GOW_communism:0 "Союз народних республік Борнео та Сулавесі"
 GOW_communism_DEF:0 "Союз народних республік Борнео та Сулавесі"
 GRAND_DOCTRINE_COST_REDUCTION:0 "Вартість §Hглобальної доктрини§!: $VALUE|%=-0$"
 GRE_HOL_autonomy_eu_member:0 "Європейська Греція"
 GRE_british_docking_rights_desc:0 "Ключем до перемоги Антанти на середньосхідному фронті Великої війни став доступ до грецьких портів. Ми живемо в часи, коли все більше стає очевидним, що Середземномор'я буде пороховим барило, від якого розгориться вся Європа. У такому разі Британія неодмінно отримає свою вигоду, знову отримавши доступ до наших портів."
 GRE_dominate_the_bulgarians_desc:0 "Знову і знову болгари загрожують безпеці Греції. Їх назвали Пруссією Балкан — подумати тільки. Ми не дозволимо їм знову підірвати нашу країну."
 GRE_encourage_tourism_tt:0 "§RМи втратимо нашу туристичну промисловість як тільки ввійдемо в стан війни!§!"
 GRE_faction_indifferent_manpower:0 "0"
 GRE_following_in_the_footsteps_of_giants:0 "По стопах гігантів"
 GRE_fund_the_hellenic_air_force_academy:0 "Фінансувати еллінську Академію ВПС"
 GRE_invest_back_into_neglected_siberian_regions:0 "Зробити зворотні інвестиції в закинуті сибірські землі"
 GRE_large_installment_payment_ITA:0 "Велика виплата боргу перед [FROM.GetAdjective]ою державою"
 GRE_megali_convention_a_failure:0 "Іракліонська конвенція завершилася провалом"
 GRE_paying_back_our_debts_in_bulk:0 "Масова виплата нашого боргу"
 GRE_republicans_name_text:0 "Республіканці"
 GRE_resurrecting_the_megali_idea:0 "Відродження Великої ідеї"
 GRE_securing_the_bulgarian_menace_desc:0 "Чи був час, коли болгари не загрожували б територіальній цілісності Греції? Звідки нам знати, що болгарський уряд не задумує проти нас разом з якоюсь великою державою? Хтось може вважати це параноєю, але ми називаємо це досвідом. Потрібно приструнити болгар, щоби захистити власні інтереси."
 GRE_trade_manufactured_ship_parts_for_investment:0 "Обміняти вироблені деталі кораблів на інвестиції"
 GRE_unlock_soviet_decision_tt:0 "Будуть відкриті рішення: §Y$GRE_host_soviet_bureaucrats_in_greece$§!"
 GRE_use_the_military_desc:0 "Ми вдаримо по них усім, що маємо! Ми переслідуватимемо їх на вулицях, ми переслідуватимемо їх у провулках, ми гнатимемося за ними до самого краю землі! Нехай жоден венізеліст не зможе сховатися від нашого пильного правління!"
 GRN_democratic_party_long:0 "Спільність"
 GRN_fascism_ADJ:0 "Калааллітськ"
 GRN_fascism_party:0 "Точка орієнтації"
 GUAY_disperse_military_power:0 "Розподілити військову владу"
 GUAY_heavy_industry_desc:0 "Хоча наша економіка переважно залежить від базових товарів, ми не можемо нехтувати важкою промисловістю. Надмірна залежність від іноземних товарів ставить нас у вразливе становище, якщо щось трапиться і порушить торгівлю."
 GUAY_national_academy_of_sciences_2_desc:0 "Майбутнє війни лежить у високотехнологічній війні. Нам потрібно, щоб люди залишали ферми та йшли у військову інженерію."
 GUAY_protect_domestic_industries_desc:0 "Беручи участь у зовнішній торгівлі, ми повинні бути дуже обережними, щоб не перевершити наші внутрішні галузі промисловості дешевими іноземними товарами. Нам потрібно запровадити низку імпортних податків, щоб насамперед захистити нашу внутрішню економіку."
 GUAY_volunteers_desc:0 "Ми можемо уникнути прямого конфлікту та потенційного знищення, надіславши добровольців, замість того, щоб безпосередньо втручатися у зовнішні справи. Можливо, це зможе схилити шальки терезів?"
 GUA_communism_DEF:0 "Гватемальський союз"
 GXC_autonomy_sea_integrated_warlord_subject_DEF:0 "Провінція Гуансі"
 GXC_formation_of_the_nraja:0 "Формування НРАЯ"
 GXC_infantry_equipment_3_short:0 "M42 Marlin"
 GXC_tac_bomber_equipment_0_short:0 "Type 16"
 GYA_communism_ADJ:0 "Індо-гаянськ"
 GetNorwegianClaims_denmark:0 "фактично всієї Данії. Оце сміливе твердження"
 HABSBURG_for_the_glory_of_the_empire_desc:0 "Тепер, коли наші армії можна вважати досконалими, настав час прищепити нашим громадянам патріотичне почуття обов’язку, щоб вони усвідомили, що саме вони захищають кожен окремий дім від ворога."
 HABSBURG_joint_industry_spirit_desc:0 "Кожна країна в нашій федерації повинна робити свій внесок у промисловість. Однак наразі ми всі працюємо за різними планами, що викликає труднощі для широкої співпраці. Спільно плануючи наші промислові зусилля, ми зможемо досягти максимальної ефективності."
 HABSBURG_joint_ventures_in_resource_extraction:0 "Спільні підприємства видобутку ресурсів"
 HABSBURG_optimizing_the_land_usage_desc:0 "З такою кількістю країн, які працюють разом у федерації, не дивно, що наше використання землі аж ніяк не ідеальне. Об’єднавши наші знання про те, як найкраще використовувати наші промислові території, ми, ймовірно, зможемо оптимізувати спосіб будівництва заводів."
 HABSBURG_part_of_something_bigger:0 "Єдині й нероздільні"
 HABSBURG_specializing_in_civilian_logistics:0 "Спеціалізація на цивільній промисловості"
 HAR_ETH_neutrality_subject_DEF:0 "Харерська автономна область"
