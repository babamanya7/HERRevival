 MTG_naval_treaty.8.desc:0 "Зараз, коли умови Лондонської морської угоди дотримуються лише двох країн, ясно, що рано чи пізно хтось із них виходить з договору, залишивши його безглуздим. [From.GetAdjectiveCap]ий уряд, очевидно, вирішив, що договір вже не відповідає заявленим цілям і що обмеження власного флоту — загроза національній безпеці. Експерти по всьому світу зараз пророкують різке збільшення фінансування флотів — багато країн захочуть компенсувати кілька десятиліть обмежень."
 MUN_czech.1016.d:0 "Продовжуючи базуватися на попередніх переговорах, які були скасовані після зміни планів зовнішньої політики, [FROM.GetNameDef] запропонувала відновити переговори щодо пакту про ненапад."
 MUN_czech.1020.a:0 "Чудова угода!"
 MUN_czech.1020.b:0 "Ці умови є неприйнятними"
