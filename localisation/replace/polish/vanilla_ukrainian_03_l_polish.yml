 BEL_strategic_doctrine_development_desc:0 "Невистачить думати тільки від битви до битви, ми повинні мати чітке уявлення про стратегічний рівень і організувати нашу армію згідно з конкретними доктринами, щоб усі наші сили прагнули до єдиної мети: перемоги."
