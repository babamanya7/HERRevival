 germany.103.d:0 "Греція відмовилася від нашої щедрої пропозиції про надання їй захисту та підтримки."
 germany.103.t:0 "Греція відмовилась"
 germany.1041.a:0 "У нас немає вибору."
 germany.1050.b:0 "$GER_albert_speer$ втілить амбіції Фюрера."
 germany.110.d:0 "Дирижабль «Гінденбург», що бездіяльно знаходився в Німеччині від початку війни, зустрів свій драматичний кінець, вибухнувши над Шотландією. Схоже, ним керував заступник фюрера Рудольф Гесс. Він зміг сам перелетіти Північне море з метою виконання особистої місії: обговорити можливий мир із Британією.\nБританські радари без проблем знайшли масивне повітряне судно, і кілька авіакрил Королівських повітряних сил вмить відправилися назустріч. Коли «Гінденбург» не відповів на радіоповідомлення, вони відкрили вогонь.\n\nРештки Гесса були знайдені серед уламків."
 germany.119.a:0 "Зробимо це заради тривалої співпраці."
 germany.122.c:0 "Ми мусимо віддати, що вимагає [FROM.GetLeader]."
 germany.122.desc_cze_subject_of_ger:0 "[FROM.GetAdjective] лідер, [FROM.GetLeader], висунув вимогу передати територію Судетів, аби «захистити німецьке населення» цього регіону.\n\nЗ огляду на обставини та жорсткий контроль, який [FROM.GetNameDef] здійснює над нашою країною, ми нічого не можемо вдіяти, щоб їм перешкодити. Вони отримають Судети, а нам лишається змиритися з цим болючим фактом."
 germany.20.c:0 "Трансільванія лишиться за Румунією."
 germany.201.a:0 "У цьому дійсно є переваги."
 germany.24.d:0 "Німеччина підтримувала хороші відносини з Китаєм ще від Великої війни навіть після втрати китайських територій. Німецька військова місія присутня в Китаї вже не перший рік, а Александер фон Фалькенгаузен зробив непогану роботу в реформуванні частин армії Гоміньдану.\n\nЦе, очікувано, напружує наші відносини з Японією, оскільки вона перебуває у стані війни з Китаєм. Японці вимагають відкликання всієї німецької підтримки Китаю."
 germany.26.a:0 "Молодець!"
 germany.27.a:0 "Цей вал стоятиме краще, ніж Лінія Зігфріда."
 germany.43.t:0 "Франція вийшла з Союзників"
 germany.47.a:0 "Час змусити їх підкоритися."
 germany.58.d:0 "Міністерство суспільного просвітництва та пропаганди Німеччини виконало відмінну роботу, сповістивши німецький народ — справді, весь світ — про несправедливість по відношенню до наших німецьких братів у Польщі. У нас тепер є повне виправдання для війни!"
 germany.72.a:0 "Хай живе фюрер!"
 germany.73.b:0 "Гіммлер усе розрулить!"
 germany.89.d:0 "Після успіху нашої недавньої співпраці німці надіслали нам інтригуючу пропозицію. Вони пропонують відкласти наші відмінності та замість витрачати сили на боротьбу між собою, поки західні демократії спостерігають і наживаються на цьому, об'єднати наші сили та натомість знищити їх!"
 germany.92.t:0 "Німеччина відхилила ультиматум"
 gibraltar_east_desc:0 "З моменту закінчення Великої війни ведуться роботи з перетворення Сінгапуру на провідну військово-морську базу. Цей порт стане бастіоном для Королівських ВМС і допоможе нам захищати наші інтереси в Азії. Завершіть роботи і зміцніть оборону Сінгапуру."
