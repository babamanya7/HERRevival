 SUPPLY_NODE_MOTORIZATION_PRIORITY:0 "§HРівень моторизації§!\nМоторизовані центри постачання використовують вантажівки з державних запасів, а їхні досяжність постачання та об'єм наданих провінціям припасів розширюється.\n§GКлацніть§!, щоби циклічно перебрати пріоритети."
