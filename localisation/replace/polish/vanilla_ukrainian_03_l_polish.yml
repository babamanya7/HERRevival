 SOS_navy_desertions_tt:0 "Морські військові частини з держави §Y[SOS.GetNameWithFlag]§! переходять на бік держави §Y[ROOT.GetNameWithFlag]§!."
 SOV_EQUIPMENT_VERSION_15:0 "Г-2"
 SOV_EQUIPMENT_VERSION_9:0 "В"
 SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST:0 "Пакт [GetMolotovInMRPact]а–[GetRibbentropInMRPact]а"
 SOV_VICTORY_POINTS_12446:0 "Южно-Сахалінськ"
 SOV_a_new_theory_of_revolution_desc:0 "Марксистська теорія революції була точною у XIX столітті, але реалії XX століття вимагають її повторного перегляду. Не завжди революція починається в найрозвиненіших країнах, і тому ми повинні скоригувати наш підхід."
 SOV_adjoined_battle_priests_desc:0 "Зважаючи на те, що останнім часом влада і вплив Церкви в країні зростають, можливо, настав час дозволити їй долучитися до військової справи. Взявши на себе роль бойових священиків у наших військових частинах, духовенство подбає про те, щоб солдати знали, що Бог на нашому боці, що може підвищити бойовий дух і змусить рядового солдата більш завзято боротися за свою країну."
 SOV_administrative_reforms:0 "Адміністративні реформи"
 SOV_amphibious_tank_equipment_1:0 "Т-40"
 SOV_approach_tukhachevsky:0 "Підступити до Тухачевського"
 SOV_autonomy_puppet:0 "$OVERLORDADJ$а Росія"
 SOV_battleship_3_desc:0 "The Lenin-class battleship was a hypothetical design to match and counter the German Bismarck and U.S. South Dakota class battleships. Its nine 406mm cannons in 3 triple turrets would provide adequate firepower, while its 130mm AA guns, thick armor, and large engines would ensure its survival in battle."
 SOV_beaten_but_not_defeated_tt:0 "Розпочне рух до §Y[GetSovietCivilWarName]§! між комуністами й опозицією у вигнанні."
 SOV_closed_city_network:0 "Мережа закритих міст"
 SOV_collectivist_propaganda_desc:0 "Численні виклики, що стоять перед нами, ніколи не стоять перед жодним громадянином наодинці. Вся наша боротьба — це спільна боротьба, отже, всі наші досягнення — це спільні досягнення."
 SOV_concessions_to_foreign_powers:0 "Поступки іноземним державам"
 SOV_curtailment_of_the_collective_farms_desc:0 "Масові колгоспи є типовим прикладом бюрократичного сталінського гігантизму. Вони відчужують селянина від продукту його праці і фактично перетворюють його на промислового робітника на полях. При цьому виробництво значно впало, а зрив виробництва продовольства вже призвів до катастрофи. Потрібно терміново скасувати цю нісенітницю."
 SOV_decision_will_be_locked_tt:0 "\nВирішення більше не буде доступне. Виставляти ультиматум державі можна лише один раз."
 SOV_demand_eastern_poland:0 "Вимогти Східну Польщу"
 SOV_divert_attention_towards_military_desc:0 "Якщо Сталін уважає, що збройні сили ним незадоволені, він нападе на них, а не на нас. І врешті-решт збройні сили будуть ним незадоволені..."
 SOV_fight_alongside_country_comrades_nordic:0 "$SOV_fight_alongside_country_comrades_baltic$"
 SOV_foreign_experts_desc:0 "Є багато іноземних експертів, які могли б багато чому навчити нас про те, як покращити нашу економіку. На щастя, багато з них є капіталістами, а отже, їх можна купити."
 SOV_heavy_cruiser_4:0 "Проєкт 66"
 SOV_increase_opposition_army_support_tt:0 "Підтримка опозиції в армії збільшиться на §G+10%§!."
 SOV_industry_relocation:0 "Евакуація промисловості"
 SOV_intervention_in_the_americas_tt:0 "Країни під нашим впливом із більшою ймовірністю стануть фашистськими.\nКраїни, які перейшли у фашизм унаслідок цього впливу, будуть запрошені в най альянс."
 SOV_leningrad_polytechnical_institute_desc:0 "[195.GetName]ський політехнічний інститут як провідна інженерна школа вже давно забезпечує нашу країну інженерами та промисловими дизайнерами. Ми мусимо розширювати його далі, щоб гарантувати, що ми завжди матимемо найкращих людей для заповнення будь-яких нових посад у наших зростаючих галузях промисловості."
 SOV_light_tank_equipment_1_short:0 "Т-26"
 SOV_long_live_the_workers_government:0 "Хай живе робітничий уряд"
 SOV_merge_ship_decision_ongoing_flag:0 "Інший завод уже об'єднується в конструктор кораблів"
 SOV_merge_ship_plant_1_baltic:0 "Об'єднати завод Nº 5"
 SOV_military_offensive_name_prague:0 "Празький наступ"
 SOV_mio_trait_gas_tank_protection:0 "Захист бензобаків"
 SOV_modify_fyp_ns_intro:0 "Змінити §Y[GetAppropriateFYPName]§! на:"
 SOV_national_academies_of_sciences_tt:0 "Відкриває доступ до рішень §Y$SOV_national_academy_of_sciences_dec_cat$§!, що дозволить нам будувати академії наук у союзних, маріонеткових або інтегрованих радянських республіках. Це збільшить §Gбонус до темпів дослідження§!, отриманої від національного духу §Y$SOV_ussr_academy_of_sciences_dynamic_modifier$§!."
 SOV_paranoia_system:0 "Політична параноя"
 SOV_paranoia_tooltip_beriya:0 "$SOV_lavrenty_beriya$ ($beriya_political_paranoia$): §R+2%§!"
 SOV_permanent_revolution:0 "Вічна революція"
 SOV_plan_start_of_uprising_archangelsk_desc:0 "Північний регіон має доступ до портів і знаходиться відносно близько до Москви, що робить його гарною базою. Однак він має погану внутрішню інфраструктуру і низький рівень розвитку, тому вести війну звідси буде дещо складно, якщо нічого не зробити для покращення ситуації."
 SOV_poster_no_text:0 ""
 SOV_poster_right_days_remaining_text:0 "Лишилося §Y[?SOV_propaganda_right_days_remaining_flag:days_left|Y0]§! дн."
 SOV_pressure_country_government_balkan_desc:0 "$SOV_pressure_country_government_baltic_desc$"
 SOV_pressure_government_cd_tt:0 "\nМи можемо тиснути на уряд країни лише раз на §Y[?SOV_pressure_government_cd]§! дн."
 SOV_propaganda_glory_to_partisans:0 "Слава героям-партизанам!"
 SOV_raskovas_aviation_group_ns_tt:0 "$SOV_modify_airforce_ns_intro$\n$MODIFIER_AIR_WING_XP_LOSS_WHEN_KILLED_FACTOR$: §G-10%§!\n$MODIFIER_AIR_STRAT_BOMBER_NIGHT_PENALTY$: §G-10.00%§!\n$MODIFIER_AIR_NIGHT_PENALTY$: §G-20.00%§!\n\n"
 SOV_rebuild_the_savior_cathedral:0 "Відбудувати Храм Христа Спасителя"
 SOV_reclaim_uryankhay_krai_desc:0 "Під час Монгольської революції 1911 року Урянхайська республіка та Богдо-ханство Монголії відкололися від імперії Цін, і ми стали на їхній захист, перетворивши регіон Урянхай на [ROOT.GetAdjective]у територію. Однак після нещодавніх потрясінь громадянської війни здається, вони прагнуть незалежності від нас, чого ми не можемо їм дозволити, інакше світові держави будуть століттями дивитися на нас згорда!"
 SOV_reconvene_the_zemsky_sobor_desc:0 "У минулі часи російський народ збирався у формі парламенту, який називався Земським собором, щоб обговорити справи і вирішити питання. Поки ми не вирішили, яким шляхом вести нашу країну, ми повинні дозволити людям вирішувати те, що стосується їх усіх."
 SOV_recover_alaska_desc:0 "Продаж Аляски американцям був зрадою російського народу з боку його керівництва. Давно настав час, щоб ця зрада була скасована, а земля повернута. Населення було б набагато щасливішим у складі нашого союзу, ніж у складі експлуататорської системи, в якій вони живуть зараз."
 SOV_restore_cossack_units_spawn_tt:0 "Буде створено §Y4 кавалерійські§! й §Y1 піхотну дивізії§! в м. §Y[ROOT.Capital.GetName]§!."
 SOV_restore_the_old_eastern_empire_desc:0 "Колись наша славетна імперія простягалася вздовж Тихого океану, проникаючи вглиб Америки. Непродумані рішення, прийняті з того часу, призвели до того, що ці володіння були проміняні на короткострокові грошові вигоди. Але під нашим керівництвом Росія може знову повернути свої американські володіння. Ми просто змусимо їхніх нинішніх власників піти з них."
 SOV_return_democracy_to_the_party:0 "Повернути демократію в партію"
 SOV_return_states_to_poland:0 "Повернути області державі [POL.GetNameDef]"
 SOV_secure_the_administration_mission_desc:0 "[FROM.GetLeader] працює над виконанням фокусу $SOV_secure_the_administration$."
 SOV_send_ultimatum_to_country_middle_east_desc:0 "$SOV_send_ultimatum_to_country_baltic_desc$"
 SOV_strat_bomber_equipment_1:0 "Пе-8"
 SOV_strengthen_the_mobilization_plan_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$\n$MODIFIER_MOBILIZATION_SPEED$: §G+5.00%§!\n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G3%§!\n"
 SOV_strengthen_the_trade_unions:0 "Зміцнити профспілки"
 SOV_synod:0 "Синод"
 SOV_tac_bomber_equipment_0_short:0 "ДБ-3"
 SOV_the_builder_of_the_red_army_desc:0 "Якою б вона не стала за цей час, Червона Армія завжди буде дітищем Лева Троцького. Настав час йому повернутися на свою колишню посаду і повести в бій нову, оновлену Червону армію."
 SOV_the_head_of_the_nkvd_yagoda_tt:0 "§Y$SOV_genrikh_yagoda$§! стане прихильником правої опозиції."
 SOV_the_military_conspiracy_mission_desc:0 "[FROM.GetLeader] працює над виконанням фокусу $SOV_the_military_conspiracy$."
 SOV_the_road_of_life_desc:0 "Оскільки декілька наших міст перебувають під загрозою і в облозі, ми мусимо зосередитися на наданні військовим, які там воюють, підтримки, необхідної для того, щоб вистояти, якою б ціною це не коштувало."
 SOV_ultimatum_to_greece_desc:0 "Егейські острови — останній стратегічний об'єкт, який нам потрібен для того, щоб Червоний флот міг вільно діяти. На греків тиснуть з усіх боків, і вони, швидше за все, віддадуть невелику територію, щоб уникнути повномасштабної війни."
 SOV_unification_of_the_exiles_desc:0 "Після революції та громадянської війни багато людей віддали перевагу вигнанню, а не так званому правосуддю нового режиму. Вони все ще там, мріючи про день, коли Росія знову стане вільною. Те, як виглядає політична система цієї Росії, для них другорядне. Перш ніж ми зможемо створити уряд, якого потребує країна, ми повинні взяти владу в свої руки, і ми зможемо зробити це краще разом."
 SOV_volunteers_allowed_sinkiang_tt:0 "$volunteers_allowed_intro$ §Y[SIK.GetNameDef]§!."
 SOV_war_with_japan_desc:0 "Схоже, японці не планують відступати. Єдиним ефективним стримуючим фактором буде війна. Вони пошкодують, що чинили опір нашим вимогам, коли Червона армія розтопче їх."
 SPA_all_shall_serve_desc:0 "Нова Іспанія є вираженням волі всіх іспанців, і тому всім має бути дозволено виконати свій обов'язок на її захист. Стандарти набору повинні бути відповідно розширені."
 SPA_embrace_the_spanish_destiny:0 "Прийняти іспанську долю"
 SPA_equipment_modernization_desc:0 "Лише найкраща зброя підійде для нашої нової армії, і ми повинні відповідно розробити нову зброю."
 SPA_expand_influence_in_the_asturias_garrison_mission:0 "Оспорюється вплив на гарнізон в Астурії"
 SPA_expand_influence_in_the_eastern_aragon_garrison_mission:0 "Оспорюється вплив на гарнізон у Східному Арагоні"
 SPA_expand_influence_in_the_navarra_garrison:0 "Розширити вплив на гарнізон у Наваррі"
 SPA_expand_spanish_bases:0 "Розширити іспанські бази"
 SPA_heavy_tank_equipment_1:0 "Tanque Pesado 1"
 SPA_imperial_security_desc:0 "Безпека Імперії полягає не в основних кораблях, а в достатній кількості крейсерів. Розробка нових моделей і нових доктрин захисту торгівлі має розпочатися негайно, щоби ми могли забезпечити постачання наших закордонних холдингів."
 SPA_improve_living_standards_desc:0 "Усім має бути дозволено ділитися перевагами економічного підйому нашої країни, незалежно від їх статусу."
 SPA_italian_shipbuilding_expertise_desc:0 "Запрошуючи італійських експертів, ми зможемо поліпшити наші кораблебудівні можливості, дозволяючи нам легше розширювати наш флот, особливо з точки зору найбільших суден."
 SPA_modern_tank_equipment_1:0 "Carro de Combate 52"
 SPA_negotiate_carlist_support_tt:0 "Із початком громадянської війни Ви отримаєте 5 добре тренованих частин із §Y3 піхотними§! батальйонами.\n"
 SPA_reassert_american_dominance_tt:0 "Відкриває доступ до рішень §Y$SPA_reassert_american_dominance$§!, які дозволяють мирно підкорити слабші американські держави.\n"
 SPA_restore_the_iberian_union:0 "Відновити Іберійську унію"
 SPA_restore_the_monarchy_tt:0 "Держава §Y[ROOT.GetName]§! буде зватися §YКоролівство Іспанія§!.\n"
 SPA_strengthen_the_empire:0 "Посилити імперію"
 SPA_submarine_2_desc:0 "The General Mola class was a class of four Italian Archimedes-class submarines commissioned in 1934 and transferred to the Nationalists in 1937. They were fairly large, displacing 880 tons, yet faster than most subs. They were armed with eight 533mm torpedo tubes and had a diving depth of 90m."
 SPECIAL_PROJECT_CAPTURE_FACILITY_PROGRESS_GAINED_TITLE:0 "Дослідження вкрадено"
 SPECIAL_PROJECT_REMOVE_SCIENTIST_DELAY:0 "Науковця буде усунуто за $DAYS|0Y$ дн."
 SPECIAL_PROJECT_RESEARCH_TIME_TOOLTIP_SCIENTIST_MODIFIER_ADDITIONAL:0 "As supportive scientist: ($SCIENTIST_NAME$) $SCIENTIST_TRAIT|Y$ $MODIFIER_NAME_AND_VALUE$"
 SPECIAL_PROJECT_SPECIALIZATION_FILTER_ACTIONS:0 "§GShift + клацніть§!, щоби збудувати: $FACILITY|Y$."
 SPM_STATE_158:0 "$ITA_STATE_158$"
 SPM_fascism_DEF:0 "Велике герцогство Савойське"
 SPR_a_new_way_of_warfare_desc:0 "Хоробрість нашої піхоти не викликає сумнівів, але реалії війни вийшли далеко за межі того, що може подолати піхота. Ми повинні розпочати розробку нових бойових машин, як на землі, так і в небі, щоби захистити наші комуни."
 SPR_all_must_bear_the_torch_desc:0 "Кожна людина сама по собі є революцією; якби не хоробрість і лютість окремої людини, колектив упав би перед обличчям своїх ворогів. Це повідомлення має бути принесене додому разом із усіма нашими прихильниками; кожен із нас повинен допомогти високо тримати факел анархізму."
 SPR_anarchism_knows_no_borders:0 "Анархізм не знає кордонів"
 SPR_anarchist_castille_neutrality_DEF:0 "Регіональна оборонна рада Кастилії"
 SPR_anti_fascist_unity:0 "Антифашистська єдність"
 SPR_appropriate_the_means_of_production:0 "Привласнення засобів виробництва"
 SPR_battleship_1_desc:0 "The España class was originally a class of three dreadnought battleships that were commissioned around the time of World War I, though one had wrecked by the time of the Spanish Civil War. The other two were lost during the war. They were fairly small for a battleship, displacing just over 15,400 tons. They had decent armor and decent speed, however, and had a main battery of eight 305mm/50 Vickers H guns."
 SPR_carlist_spain_neutrality_DEF:0 "Карлістська Іспанія"
 SPR_castille_ADJ:0 "Кастильськ"
 SPR_castille_DEF:0 "Кастилія"
 SPR_civil_war_offensives_map_category_name:0 "Оберіть, де би Ви хотіли підготувати наступ"
 SPR_fortify_the_iron_ring:0 "Укріпити «Залізне кільце»"
 SPR_government_crackdown_mission:0 "Насувається урядове придушення"
 SPR_ignite_uprising_timer_mission_tt:0 "§RДивізії анархістів повстануть у кількох контрольованих областях.§!\n"
 SPR_infantry_equipment_0_short:0 "Mauser M93"
 SPR_light_tank_equipment_2:0 "Verdeja 1"
 SPR_masters_of_our_own_fate_desc:0 "Сталіністи та їхні республіканські маріонетки все більше посягають на наші свободи, систематично підриваючи наші зусилля та усуваючи відомих прихильників нашої справи. Досить значить досить. Ми самі господарі своєї долі, навіть якщо це також вимагає боротьби з ними."
 SPR_masters_of_our_own_fate_tt_2:0 "Держава §Y[ROOT.GetName]§! буде зватися §YРегіональна оборонна рада Арагону§!.\n"
 SPR_provide_for_the_people_desc:0 "Першочерговим завданням є забезпечення наших людей продовольством. Наша перемога не повинна бути затьмарена лихом голоду."
 SPR_purchase_artillery_equipment:0 "Придбати артилерійське оснащення"
 SPR_reaffirm_the_popular_front_strategy:0 "Затвердити стратегію Народного фронту"
 SPR_republican_castille_democratic:0 "Кастильська республіка"
 SPR_ship_heavy_battery_1:0 "30.5 cm/50 Vickers H"
 SPR_stabilize_the_nation:0 "Стабілізувати націю"
 SPR_strengthen_the_euzko_gudarostea:0 "Посилити Euzko Gudarostea"
 SPR_submarine_1_desc:0 "The B class were the first submarines built within Spain for the Spanish Navy. The six ships of the class were commissioned between 1922 and 1925. They were designed as single-hulled ships, and consequently their reliability was subpar. They were medium-sized submarines, displacing over 550 tons. They were armed with four 450mm torpedo tubes."
 SPR_subvert_the_stalinists_desc:0 "Не ми почали цю сварку, але якщо сталіністи будуть наполягати, ми будемо грати в їхню гру. Ми послабимо їхню владу зсередини, схиляючи їхніх прихильників і викачуючи їхні запаси. Куди б вони не пішли, вони побачать, що ми протистоїмо їм."
 SPR_take_the_initiative_desc:0 "Ми не можемо сидіти без діла, поки наші вороги вибирають, коли і де напасти на нас. Війни виграються ініціативою, і це те, що ми повинні робити."
 SPR_the_maximum_concession_desc:0 "У дусі боротьби з фашизмом ми пішли на найбільшу можливу поступку: на співпрацю з капіталістами та авторитарними комуністами. Ця поступка — це те, на що ми готові піти, і вона не може тривати вічно. Ми максимально використаємо це, поки це так."
 SPR_unify_the_london_bureau_desc:0 "У відповідь на формування ІІІ Інтернаціоналу та боротьбу за владу між Троцьким і Сталіним було створено Міжнародне бюро революційної соціалістичної єдності, яке відкидало обидві інтерпретації марксизму. Ми простягнемося до наших контактів там, щоби створити єдиний фронт соціалізму проти троцькізму та сталінізму."
 SRL_communism_DEF:0 "Таміло-сінгальська соціалістична федерація"
 SSB_accept_tt:0 "Ми укладемо пакт про ненапад з усіма націями, які приймуть Саадабадський пакт. Ми отримаємо доступ до спільного дерева фокусів з іншими членами для допомоги у досягненні спільних цілей."
 SSB_combined_arms:0 "Об'єднані роди військ"
 SSB_expand_road_and_rail_connections:0 "Розширити автомобільні та залізничні сполучення"
 SSB_form_the_saadabad_alliance:0 "Пропозиція повного альянсу"
