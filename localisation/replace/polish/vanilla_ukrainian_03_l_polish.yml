 south_american_events.63.desc:0 "Фашисти з [MEX.GetNameDef] були помічені, що вони підбурюють демонстрації в межах наших кордонів. Як ми повинні реагувати на це?"
 south_american_news.14.desc:0 "Після зростання невдоволення керівництвом країни військові вжили заходів і призначили новим президентом Парагваю генерала Іхініо Морініго. Він симпатизує фашистській справі і, ймовірно, звернеться до Аргентини за взаємним захистом і допомогою, що в свою чергу може призвести до того, що Бразилія спробує зміцнити свої власні союзи, щоб убезпечити себе на випадок парагвайської або аргентинської агресії."
 south_american_news.3.b:0 "Безумовно, несподіванка, але приємна."
 south_american_news.50.d:0 "Сьогодні вранці президент [FROM.GetLeader] з [FROM.GetName] оголосив по радіо, що нація знову запроваджує надзвичайний стан через ризик перевороту з боку комуністичної партії. За словами президента, були знайдені документи, які вказували на те, що комуністи перебувають на пізніх стадіях планування повалення уряду. Багато хто ставить під сумнів достовірність цих документів, але члени опозиційних партій тепер переходять у підпілля, побоюючись арешту. Президент оголосив, що заснує нову державу з новою конституцією, яка надає йому більші повноваження. Що це означає для майбутнього демократії в [FROM.GetName], ще належить побачити."
 south_american_news.51.t:0 "Бразилія призупиняє демократію"
