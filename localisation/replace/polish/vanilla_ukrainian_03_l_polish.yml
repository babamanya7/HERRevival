 CZE_german_minor_ally_tt:0 "Ставши німецьким сателітом, ми отримаємо бонуси до ліцензування німецьких технологій в обмін на панування Німеччини над нашою державою."
 CZE_german_technology_desc:0 "Гарантії миру між нашими державами дозволяють зробити наступний крок: зробити обмін технологіями на користь обох сторін."
