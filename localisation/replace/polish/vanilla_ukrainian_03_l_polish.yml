 HOL_production_under_license_tt:0 "Це змусить нас зосередитися на придбанні ліцензій на виробництво замість внутрішнього розвитку оснащення в майбутньому.\n"
 HOL_ship_heavy_battery_2:0 "28 cm/55 Krupp"
 HOL_strength_over_blood_desc:0 "Кров не повинна впливати на те, чи є хтось лідером чи ні. Нехай наш народ ведуть ті, хто показав свою силу, а не ті, чия кров була блакитною при народженні."
