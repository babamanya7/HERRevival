 SUPPLYMODE_TOOLTIP_CAPITAL_MOVED_RECENTLY:0 "Столичний центр постачання нещодавно змінений.\nДнів до повної ефективності:$DAYS|H$\nПоточна ефективність: $PERCENTAGE|H$"
