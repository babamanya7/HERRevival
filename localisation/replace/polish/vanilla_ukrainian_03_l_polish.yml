 Optimaton:0 "Оптимати"
 PAR_get_rid_of_obsolete_guns_desc:0 "Озброєння нашої армії складається із застарілої зброї. Нам потрібно модернізуватися, позбувшись металобрухту, який нам заважає, та модернізувати наші склади."
