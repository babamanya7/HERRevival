 DLC_DESCRIPTION_dlc023:0 "Отримайте нові дизайни кораблів, риси та навички для адміралів, морську техніку, а також міни для захисту своїх морів і морських шляхів для уникнення небезпек. Включає нові дерева фокусів для Нідерландів, Сполученого Королівства, Мексики та США."
 DNZ_democratic_DEF:0 "Вільне місто Данциг"
 DNZ_fascism_DEF:0 "Вільне місто Данциг"
 DOD_hungary.112.desc:0 "Відвідавши нещодавно Москву, [HUN.GetLeader] провів напружені багатогодинні переговори, під час яких [SOV.GetLeader] кілька разів назвав його тупицею за спробу висунути настільки очевидно помилковий план. Схоже, ми не до кінця зрозуміли всю важливість національної території у революційній боротьбі і дійшли невірних висновків про те, як ми мусимо діяти."
 DOD_hungary.122.desc:0 "[CZE.GetAdjectiveCap]а влада без захоплення прийняла наші гарантії. Політичні поступки, на які піде в цьому випадку [CZE.GetNameDef], спричинили переполох у країні. Декілька високопоставлених генералів і чиновників пригрозили подати у відставку, якщо влада погодиться на ці вимоги.\n\nПосилавшись на те, що наша підтримка може виявитися запізнілою, уряд офіційно відхилив нашу пропозицію."
 DOD_hungary.140.a:0 "Вони мають право захищатися."
 DOD_hungary.140.desc:0 "Вказавши на політичну обстановку в Європі, що погіршується, і повну нездатність Ліги націй зупинити подальшу ескалацію, [HUN.GetLeader] публічно оголосив про те, що його уряд буде домагатися підтримки від сусідніх держав з метою перегляду Трианонського договору. [HUN.GetLeader] у своїй промові не торкнувся будь-яких територіальних домагань і говорив лише про обмеження, накладені на угорські збройні сили.\n\nДо нашої столиці прибула угорська делегація, яка розраховує отримати від нас дозвіл на переозброєння угорських ЗС."
 DOD_hungary.143.a:0 "Тим краще для них."
 DOD_hungary.153.b:0 "Ми не ризикуватимемо витоком інформації."
 DOD_hungary.2.t:0 "Схвалення на референдумі"
 DOD_hungary.20.t:0 "Війна в Угорщині"
 DOD_hungary.26.t:0 "Угорщина направила допомогу"
 DOD_hungary.42.desc:0 "Незважаючи на наші різкі заяви щодо Тріанонського договору, [From.GetNameDef] не намагається зупинити нас. Нещодавня прес-конференція показала, що [From.GetLeader] не може відповісти на жодне питання про наше рішення денонсувати договір. Це лише підтверджує загальну підозру: [From.GetNameDef] — не більше, ніж паперовий тигр."
 DOD_hungary.53.c:0 "Можливо, час знайти компроміс."
 DOD_hungary.54.t:0 "[ROM.GetNameDefCap] мобілізується"
 DOD_hungary.55.b:0 "Звернутися до Великої Британії"
 DOD_hungary.61.c:0 "Звернутися до посередників."
 DOD_hungary.68.desc:0 "Обидві сторони попросили нас вирішити, кому з них дістанеться Трансільванія. Міністерство закордонних справ підготувало таку заяву:\n\n«З урахуванням ситуації, що склалася, було б нерозумним віддавати всю Трансільванію одній із сторін. Слід вибрати непопулярний, але прийнятний компромісний варіант, який не здасться образливим жодній із сторін."
 DOD_hungary.74.t:0 "Конференція з Трансільванії: день 4"
 DOD_hungary.85.b:0 "Ми заберемо наші землі."
 DOD_romania.110.t:0 "Румунія пропонує розділити державу [CZE.GetNameDef]"
 DOD_romania.113.t:0 "[GER.GetLeader] відмовляється"
 DOD_romania.120.b:0 "Надійна німецька техніка «Opel»."
 DOD_romania.32.t:0 "[From.GetNameDefCap] відкидає нашу пропозицію"
 DOD_romania.51.t:0 "[From.GetNameDefCap] підкоряється"
 DOD_romania.64.desc:0 "У відносинах між Румунією та Югославією вибухнула криза, що відкрила перед нами вигідну можливість. [YUG.GetLeader] відповів відмовою, коли [ROM.GetLeader] зажадав від нього віддати країну. У відповідь [ROM.GetLeader] звернувся до нас із ідеєю розділу Югославії, він запропонував передати нам Далмацію і створити в Чорногорії маріонеткову державу під нашим контролем."
 DOD_romania.65.desc:0 "[From.GetLeader] повідомив про те, що приймає наші умови. [From.GetAdjective] уряд підтримає наші дії в Югославії."
 DOD_romania.69.desc_GER:0 "Ми отримали другий ультиматум. Цього разу до вимог додалося схоже по тексту послання від посла держави [GER.GetNameDef], який підтримав румунський план. Він вимагає, щоби наші війська не заважали окупації Словенії та Хорватії німецької армії."
 DOD_romania.84.a:0 "Пані Лупеску виконувала доручення короля."
 DOD_romania.85.t:0 "Король відправився на відпочинок до Ніцци"
 DOD_yugoslavia.1.t:0 "Військові влаштували переворот"
 DOD_yugoslavia.33.a:0 "Як мило з його боку."
 DOD_yugoslavia.40.desc:0 "Югославія є наріжним каменем нашої стратегії на Балканах. Вони продовжують зберігати нейтралітет і торгують з Німеччиною, але не приєдналися до країн Осі. Ми мусимо нагадати їм про те, що не потерпимо торгівлю з противником, якщо вибухне війна."
