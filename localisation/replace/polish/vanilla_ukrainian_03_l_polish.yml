 LAT_empower_democrats:0 "Уповноважити демократів"
 LAT_events.3.d:0 "У своїй мові про балтійську солідарність [From.GetLeader] особливо зазначає, що [Root.GetLeader] робить все для успіху націоналізму перед зростаючою більшовицькою загрозою. При цьому [From.Getleader.GetSheHe] стверджує, що поважає індивідуальність [From.GetAdjective]ого та [Root.GetAdjective]ого народів і закликає до співпраці держав [From.GetNonIdeologyName] і [Root.GetNonIdeologyName] з метою збереження незалежності. Не за горами пропозиція альянсу."
 LAT_events.6.t_lithuania:0 "[From.GetNameDefCap] просить взяти [LIT.GetAdjective] державу до альянсу [Root.GetFactionName]"
 LAT_formalize_baltic_entente_desc:0 "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LAT_latvia_for_latvians_desc:0 "Наша країна існує не для того, щоби служити інтересам німців чи росіян, — вона існує для латишів і тільки для латишів. Дехто вважає «Pērkonkrusts» ультранаціоналістичною організацією, але ми знаємо, що для виживання Латвії з ним потрібно співпрацювати."
