 political.14.d:0 "Дивно, але заклик до проведення більшої кількості референдумів і зменшення репресивних заходів проти опонентів режиму отримав певну підтримку у внутрішньопартійних дискусіях. Хоча керівництво [Root.GetRulingParty] залишається скептично налаштованим, кілька впливових членів партії підтримали зміни.\n\nМожливо, вони переконані, що на практиці мало що зміниться, або, ймовірно, вони є таємними зрадниками партійної справи, як це вважають багато їхніх опонентів. Хай там що, якщо пролунає публічний заклик до таких змін, дехто з лідерів держави [Root.GetName] готовий піти на компроміс."
 political.20.d:0 "Не дивно, що ідея про те, що народ керує країною, в якій він живе, може легко стати дуже популярною серед народу. Звісно, [Root.GetRulingParty] вважає ідею демократії, яку представляють ці рухи — свободу слова, публічні вибори, вільну пресу — лише популістською риторикою, покликаною послабити уряд [Root.GetLeader].\n\nОднак, не можна заперечувати, що ці ідеї прижилися серед [Root.GetAdjective]ого населення. В істинно демократичній манері вони закликають до проведення громадського референдуму про заміну нинішнього режиму. Хоча зараз ці ідеї легко ігнорувати, вони мають властивість ставати дуже стійкими. Що стане з нами, якщо ми зробимо мирну революцію неможливою?"
 political.23.t:0 "[Root.GetAdjectiveCap]а весна"
