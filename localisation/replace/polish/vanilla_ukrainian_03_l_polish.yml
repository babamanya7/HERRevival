 CZE_giant_of_central_europe_industry:0 "Гігант промисловості"
 CZE_import_foreign_bombers:0 "Імпортувати зарубіжні бомбардувальники"
 CZE_integrated_paramilitaries_desc:0 "Військові можуть бути не в захваті від цієї ідеї, але інтеграція воєнізованих груп до складу нашої армії дасть нам збільшений резерв тоді, коли він буде найбільше потрібен."
 CZE_joint_stock_schemes_desc:0 "Акціонерні схеми слугували джерелом економічного зростання, коли бракувало традиційних джерел фінансування. Подальше використання цих тактик призведе до подальшого зростання нашої економіки."
 CZE_kohler_faction:0 "Фракція Келера"
 CZE_logistics_beyond_the_sudetes_desc:0 "Якщо ми сподіваємося вести бойові дії за межами Судетських гір, нам потрібно навчитися того, як працює логістика на великих відстанях. Це суттєво відрізняється від дій виключно в нашому рідному регіоні."
