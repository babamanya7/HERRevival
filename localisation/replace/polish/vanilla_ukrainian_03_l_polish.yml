 bba_news.100.t_none_purged:0 "Чистка, котрої не було"
 bba_news.107.t:0 "Смерть Папи Римського"
 bba_news.2.desc:0 "\nНесподіваний розвиток подій: держава [ITA.GetName] погодилася на перемир'я з державою [ETH.GetName]. [ITA.GetAdjectiveCap]і війська також почали відступати до своїх початкових кордонів із державою [ETH.GetNameDef], кидаючи всі свої територіальні здобутки. Безсумнівно, що явна готовність держави [SOV.GetNameDef] заступитися за Ефіопію зіграла роль у рішенні [ITA.GetLeader] поступитися. Поки що невідомо, як [ITA.GetAdjective]а громадськість відреагує на це приниження."
 bba_news.7.t:0 "[ITA.GetName] збирається анексувати державу [AFA.GetNameDef]"
 bba_news.8.a:0 "Шкода, але очікувано."
 bftb_bulgaria_british_influence.4.desc:0 "[FROM.GetAdjectiveCap]ий уряд не виявив інтересу до посилення зв'язків між нашими країнами і відміло нашу пропозицію оформити угоду про підтримку незалежності держави [BUL.GetNameDef] та розвиток співпраці між нами."
 bftb_bulgaria_democratic_international_policies.6.a:0 "Вони порушують нашу територіальну цілісність!"
 bftb_bulgaria_factions.20.desc:0 "Широкі соціалісти та комуністи разом підбурюють робітників до страйків. Їхні таємні збіговиськи здобули серйозну підтримку та співчуття у болгарського пролетаріату.\nНаводити порядок у регіонах, де ці бунтівники особливо популярні, потрібно обережно. отримати щось набагато гірше, ніж прості страйки..."
 bftb_bulgaria_factions.21.a:0 "Невдалий підсумок..."
 bftb_bulgaria_factions.50.t:0 "Члени «Звена» репресовані"
 bftb_bulgaria_factions.55.a:0 "Хтось поплатиться за цей провал!"
 bftb_bulgaria_factions.65.desc:0 "Спроба захопити лідерів широких соціалістів обернулася грандіозним провалом. Поліцейські увірвалися на таємну зустріч, але їх було набагато менше, ніж змовників, тому нікого не вдалося затримати, і учасники зборів швидко розбіглися і звернулися по допомогу пролетарям На вулицях зав'язалися жорстокі зіткнення, і постраждали багато невинних жителів. Зіткнувшись з такою жорстокістю поліції, багато городян мимоволі віддали свої симпатії широким соціалістам і почали приховувати членів організації, а іноді й стали давати відсіч органам охорони порядку."
 bftb_bulgaria_nationalization.1.t:0 "[FROM.GetNameDefCap] захоплює наші філії"
 bftb_bulgaria_rearmament.5.t:0 "Обмеження на [BUL.GetAdjective]у армію знято"
 bftb_bulgaria_rearmament.6.a:0 "Не будемо втрачати жодної хвилини, починаємо переозброєння!"
 bftb_bulgaria_tsar_boris.2.a:0 "Справді тривожно..."
 bftb_greece.101.a:0 "Наші вороги тремтять, немов щури!"
 bftb_greece.15.desc:0 "Тема першого раунду голосування — чи потрібно дозволити державі [FRA.GetNameDef] отримати [FRA.GetAdjective]ий мандат у [TUR.GetAdjective]ому Курдистані при капітуляції держави [TUR.GetNameDef]. Більшість із [FRA.GetAdjective]их офіційних осіб вважають такий стан справ цілком логічним, враховуючи близькість держави [FRA.GetNameDef] до регіону і виразний націоналізм, уже помітний у [TUR.GetAdjective]ому Курдистані. Це показує, наскільки вже надмірно розтягнута [FRA.GetAdjective]а імперія.\n\nЯкщо [FRA.GetAdjective]ий народ отримає свою концесію в державі [TUR.GetNameDef], він буде зобов'язаний за умовами договору прийти на допомогу державі [GRE.GetNameDef] у війні з державою [TUR.GetNameDef]: Якщо ця пропозиція не пройде, то незалежно від результату Іракліонської конвенції держава [FRA.GetNameDef] не буде пов'язана зобов'язаннями з державою [GRE.GetNameDef], коли почнеться війна."
 bftb_greece.169.c:0 "Всі чудово попрацювали!"
 bftb_greece.171.a:0 "Можливо, [ITA.GetAdjective]і інвестори будуть більш прихильні?"
 bftb_greece.171.desc:0 "Можливо, ми надто напирали з питаннями про інвестиції: [FROM.GetAdjective]і інвестори вирішили, що їм нецікаво вкладати кошти в зростаючу промислову базу нашої країни. Якщо вони не бажають допомогти нам створити власне майбутнє, нам доведеться зробити це без них."
 bftb_greece.20.desc:0 "Більшість присутніх делегатів вирішила, що [ENG.GetNameDef] не мусить отримати маріонеткову вірменську державу на півночі держави [TUR.GetNameDef]. [ENG.GetAdjectiveCap]і представники спершу хотіли було повністю залишити конвенцію, назвавши хаосом, але потім вирішили залишитися і зберегти можливість впливати на те, що відбувається, навіть якщо їм нічого і не гарантують."
 bftb_greece.201.desc:0 "Іракліонська конвенція офіційно завершилася і пройшла з великим успіхом! Всі учасники, окрім держави [ENG.GetNameDef], залишили її, заручившись правами на територіальні претензії, а держава [GRE.GetNameDef], судячи з усього, згодом значно розширити свої кордони. Разом усі, хто підписався, помстяться за Севрський мирний договір негідній державі [TUR.GetName]."
 bftb_greece.203.t:0 "Іракліонська конвенція відбулася"
 bftb_greece.204.desc:0 "Іракліонська конвенція офіційно завершилася і пройшла... з прийнятним успіхом. Ні [ENG.GetNameDef], ні [FRA.GetNameDef] не братимуть участі у швидкій війні, оскільки жодному з них не були обіцяні території після перемоги над державою [TUR.GetNameDef]. [GRE.GetNameDef] ж, судячи з усього, активно бореться за значне розширення власних кордонів — за умови, що у нього вистачить сил здолати державу [TUR.GetNameDef] наодинці..."
 bftb_greece.21.t:0 "Іракліонська конвенція — [ITA.GetAdjective]і колонії в областях [342.GetName] та [345.GetName]"
 bftb_greece.233.desc:0 "Прем'єр-міністр і диктатор держави [ROOT.GetNameDef] помер після тривалої хвороби. Він помер за кордоном, вигнаний із завойованої країни. Хоча [ROOT.GetAdjective]ий народ не особливо його любив, він став символом національного єдності та опору в часи кризи. Еммануїл Цудерос, венізеліст і символ єдності, зайняв місце Метаксаса як прем'єр-міністра держави [ROOT.GetNameDef]."
 bftb_greece.3.t:0 "Анатолійські фашисти мобілізуються"
 bftb_greece.47.t:0 "[FROM.GetNameDefCap] прориває наші позиції в області [354.GetName]!"
 bftb_greece.48.desc:0 "Гидкий марксистський режим держави [FROM.GetNameDef] озброїв терориста Йосипа Броза Тіто і спонукав його розпочати повстання на півдні! Можливо, ми могли б знехтувати небезпекою, якби не той факт, що [FROM.GetAdject] Провокатори активно співпрацюють з новоявленим режимом на півдні, сподіваючись повалити наш уряд."
 bftb_greece.54.a:0 "Дуже прикро."
 bftb_greece.56.a:0 "Нарешті споріднені народи єдині!"
 bftb_greece.6.t:0 "Переговори з НСГ"
 bftb_greece.93.desc:0 "По країні прокотилася хвиля зіткнень членів НСГ з нашою поліцією, створивши картину політичного насильства, яка, як ми сподівалися, залишилася в минулому. Судячи з доповідей про госпіталізацію постраждалих та зростання насильства, цього не сталося.\n Деякі міністри пропонують зайняти з цього питання жорстку позицію і показати країні, що ми не потерпимо подібного бандитизму, інші ж зауважують, що битву з фашистами за принципом «око за око» нам не виграти. права на такі акти насильства."
 bftb_greece.94.desc:0 "Розігралася, на жаль, добре знайома нам сцена: прихильники НСГ вломилися на фабрики, що належать іноземцям, і роздають вироблені там речі біднякам і людям без громадянства. Георгіос Космідіс і верхівка НСГ стверджують, що нічого не знали про подію але при цьому палко захищають людей, які взяли участь в альтруїстичних, за їх розумінням, серіях грабежів. Таку поведінку терпіти не можна, ми вже отримуємо скарги від магнатів з таких держав, як [ENG.GetNameDef] і [FRA.GetNameDef]. Якщо ми виступимо від імені промисловців, ми будемо виглядати маріонетками іноземного капіталу; якщо ж ми дозволимо анархії продовжуватися, ми будемо виглядати некомпетентним урядом, нездатним керувати багатонаціональним суспільством."
 bftb_greece.96.t:0 "Арістотель Онассіс повертається до держави [ROOT.GetNameDef]"
 bftb_news.1.c:0 "Схоже, дні ВМРО закінчуються..."
 bftb_news.10.c:0 "Оце потрібно Балканам?"
 bftb_news.203.c:0 "Чорт забирай, це катастрофа..."
 bftb_news.4.a:0 "Ось правитель, якого потребує [BUL.GetNameDef]!"
 bftb_turkey.10.a:0 "Турецькі протоки не варті повномасштабної війни."
 bftb_turkey.103.a:0 "На таку зухвалість дадуть відповідь наші ятагани."
 bftb_turkey.116.b:0 "Вивести війська."
 bftb_turkey.135.t:0 "Смерть Мустафи Кемаля Ататюрка"
 bftb_turkey.140.a:0 "Ми чинимо як вважаємо за потрібне."
 bftb_turkey.19.desc:0 "Мітинг, проведений Аднаном Мендересом у глибинці країни, зібрав натовп, який можна порівняти з промовами Мустафи Кемаля Ататюрка в центрі Стамбула. [TUR.GetLeader] був приголомшений, коли почув звіт про мітинг, який пройшов без сутичок і на якому Мендерес оголосив, що його офіційна опозиційна партія буде представлена нації дуже скоро. На сцену вийшла низка промовців, кожен із яких проповідував важливість релігії в повсякденному житті та в політиці, і кожен із них загалом підтримував ідеологію традиціоналістичного консерватизму — дехто з них навіть говорив про давно переможений Османський султанат і халіфат у ласкавих виразах! Сам Мендерес вийшов на сцену останнім і говорив набагато стриманіше, ніж деякі з ораторів, чий виступ він продовжував. Мендерес бадьоро виклав аудиторії чесноти лібералізму laissez-faire і вихваляв кемалістів за все, що вони зробили для нації, перш ніж підірвати цю похвалу великою кількістю критики. Учасники мітингу залишили мітинг в екстазі і впевнені у своїх шансах на перемогу на виборах.\n\nВідданий кемалістський офіцерський корпус звернувся до уряду і в недвозначних виразах зажадав від ПНП зробити більше для стримування зростаючого впливу Мендереса і його консервативного популістського руху. Представник офіцерського корпусу заявив, що офіцери країни ніколи не служитимуть уряду Мендереса, і натякнув, що вони вдадуться до власних крайніх заходів, якщо ми не зможемо приборкати те, що вони вважають фундаментальною загрозою для кемалістської системи."
 bftb_turkey.26.a:0 "З поверненням на батьківщину, брати та сестри."
 bftb_turkey.30.t:0 "Угода за острови Онікі"
 bftb_turkey.49.desc:0 "[FROM.GetAdjectiveCap]ий посол назвав [ROOT.GetAdjective] пропозиції щодо [FROM.GetAdjective] територій в Аравії неприйнятними і зажадав негайно припинити їх обговорення. Наші експерти з оборони розчаровані. [FROM.GetAdjective] аравійськими територіями, але [FROM.GetAdjective] каже, що поки [ROOT.GetNameDef] залишається частиною держави [FROM.GetFactionName], ми зберігаємо свої права на стоянку та розміщення баз на територіях."
 bftb_turkey.55.desc:0 "У 1923 році новостворена Турецька республіка ратифікувала та затвердила законодавчий акт, який дозволяв нам розробляти нафтові родовища і залізниці держави [FROM.GetNameDef]. Сенат Сполучених Штатів, беручи до уваги збитки, яких завдала американській економіці Велика депресія, вирішив не ратифікувати договір. Держава [FROM.GetNameDef] скасувала своє рішення про анулювання договору та знову звернулася до нас із проханням виконати умови концесії, які були розроблені нами спочатку.\n\nНе можна заперечувати, що економічно ми знаходимося в набагато безпечнішому місці, ніж були в 1923 році, і було б великим благом, якби [FROM.GetNameDef] ідеологічно і військово приєдналася до нас. Однак, війна нависла над усім світом, і навіть із нашої позиції сили ми мусимо бути економними в тому, як ми витрачаємо наші ресурси. Наявність нафти в державі [FROM.GetNameDef] в майбутньому може бути досить цінним важелем впливу на державу [SOV.GetNameDef], але в короткостроковій перспективі ми також мусимо враховувати можливість того, що знайдена нафта може потрапити до рук наших ворогів. Можливо, було б розумно використати [FROM.GetAdjective]у потребу в нашій допомозі для досягнення наших власних цілей. [FROM.GetNameDefCap] містить багато хрому, в той час як наша держава, на жаль, його не має. Вибір за нами."
 bftb_turkey.58.a:0 "Добре бути [FROM.GetAdjective]им громадянином."
 bftb_turkey.62.desc:0 "[ROOT.GetLeader] влаштував полум'яний мітинг у Газіантепі, де заявив, що [FROM.GetNameDef] утискає турків за кордоном, і палко засудив сусідів. [ROOT.GetAdjective] народ підтримав обурення. Радники стверджують, що частина [ROOT.GetAdjective] населення підтримує ідею викорінити цю несправедливість вогнем і мечем.[FROM.GetNameDef] вважає, що може чинити опір нашій волі, але це дуже безглуздо — [ROOT.GetNameDef] не зазнає нападок від слабаків."
 bftb_turkey.71.t:0 "[IRQ.GetAdjective] фашисти захоплюють контроль у державі [IRQ.GetNameDef]"
 bftb_turkey.72.a:0 "Їхня відвага гідна похвали, і ми за неї вдячні!"
 bftb_turkey.79.desc:0 "Ми історично дуже близькі з державою [FROM.GetNameDef], оскільки вважаємо один одного близькими за духом антиімперіалістами, але за останні роки наші відносини були прохолодні.\n\nУ спробі досягти потепління у відносинах [FROM.GetLeader] запропонував продовжити пакт про ненапад, який ми підписали багато років тому, ця пропозиція світу слід розглядати як знак, що держава [FROM.GetNameDef] може бути відкрита до більш глибокої співпраці, але [ROOT.GetLeader] також ясно дає зрозуміти, що хоче отримати Турецькі протоки. Ми мусимо вирішити, що для нас краще: доброзичливо налаштований [FROM.GetAdjective] союзник або [FROM.GetAdjective] васал."
 bftb_turkey.81.a:0 "Ні до чого хорошого це не приведе."
 bftb_turkey.87.a:0 "Ми не послабимо натиск."
 bftb_turkey.92.a:0 "[ROOT.GetNameDef] завжди буде вважати вас близьким другом."
 bftb_turkey.98.b:0 "Не можна допустити повторення 1913 року..."
 bomber_veteran_initiative_desc:0 "Політика, за якою пілоти-ветерани передають свій досвід та знання молодим льотчикам, збільшить шанси новобранців на виживання."
 britain.1.b:0 "Ні, у британців є свої."
 britain.10.d:0 "Прем'єр-міністр Невілл Чемберлен нещодавно захворів, незважаючи на те, що раніше в цілому був здоровим для свого віку. Після того, як йому діагностували рак кишківника, посилення болю та втрата сну змусили його піти у відставку. Чемберлен усе ще користується сильною підтримкою народу і полишає свій пост вимушено, розуміючи, що він не зможе повернутися до роботи.\n\nЗалишається питання, хто прийде після цього великого державного діяча та поведе Британію через темні часи, які можуть бути попереду."
 britain.13.d:0 "Світ стає дедалі небезпечнішим. Велика Британія та Франція залишаються бастіонами демократії та свободи в Європі, і Франція тепер пропонує приєднатися до Союзників.\nЯк нам відповісти?"
 britain.15.t:0 "Франція покидає нас"
 britain.17.d:0 "Прем'єр-міністр Болдвїн чітко дав зрозуміти, що гідність короля-імператора буде порушена, якщо він одружиться не тільки з простолюдинкою, але ще й із розлученою, більш того — американкою. Після довгих душевних пошуків Його Величність обрав кохання замість обов'язку і вирішив зректися престолу. Його молодший брат Альберт прийме мантію як король Георг VI. Лондонські букмекери вже розраховують, чи буде присутній цей сором'язливий чоловік на власній коронації."
 britain.20.a:0 "Ні, Імперія має бути єдиною!"
 britain.26.t:0 "[ICE.GetNameDefCap] просить нашого захисту від [ENG.GetNameDef]"
 britain.7.t:0 "Закінчити торгівлю з Німеччиною"
