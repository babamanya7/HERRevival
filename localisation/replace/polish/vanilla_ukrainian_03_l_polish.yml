 SCIENTIST_TOOLTIP_SUPPORTIVE:0 "As a §HSupportive Scientist§!, they will work at $VALUE|.0Y$% effectiveness at the §Hfacility§!, in return once an §Hiteration§! is done their country will receive $PROG|.0Y$% of the §Hprogress§! to that §Hproject§! and will get $CONT|.0Y$ §Hcontribution§! per day in your faction.\n\nIn addition, each §HSupportive Scientist§! in your faction will increase the §HResearch Sharing§! bonus by §H5%§!."
