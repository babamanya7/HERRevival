 nsb_news.104.b:0 "[ENG.GetLeader] та [SOV.GetLeader] знайшли собі чергову жертву."
 nsb_news.104.desc:0 "Після кількох тижнів планування [ENG.GetNameDef] та [SOV.GetNameDef] розпочали спільну військову операцію в державі [PER.GetName], щоб швидко окупувати територію противника, який поступається ним технічно та чисельно. [ENG.GetLeader] стверджує, що ця операція дозволить їм захопити [PER.GetAdjective] нафтові родовища та отримати шляхи постачання до держави [SOV.GetNameDef], не давши при цьому можливому супротивнику просунутися з держави [TUR.GetNameDef] до держави [PER.GetName] до бакинської нафти та держави [RAJ.GetNameDef]."
 nsb_news.402.t:0 "Вісь Берлін–Москва"
 nsb_news.408.b:0 "Побачимо, чи довго протримається цей союз."
 nuclear_effort:0 "Розвиток ядерної енергетики"
 nuclear_missile_submarine_desc:0 "Підводні човни, здатні нести та запускати ядерні ракети проти наших цілей. Вони можуть стати справжньою смертю, руйнівниками світів – і ми навіть не помітимо, як це станеться."
 nuke_dropped.10.a:0 "The city of light has burned out."
 nuke_dropped.4.d:0 "Today, at [GetDateText], the German capital of Berlin was struck by a nuclear explosion, launched by [?global.nukecountry.GetNameDef]. The city has suffered several attacks, in this war and the last, but all else pale in comparison to this. Not since the Thirty Years' War has Berlin seen comparable devastation — considering its growth, this was seen as an impossibility.\n\nThe Führerbunker appears to have survived the blast at least partially due to the bomb detonating away from its planned epicenter, and [From.From.Owner.GetLeader] is rumored to still be alive, if outraged. How [From.From.Owner.GetAdjective] leaders should be evacuated and if they can be protected from the fallout is another matter, however."
