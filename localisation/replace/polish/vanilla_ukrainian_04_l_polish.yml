 CZE_revert_1926_anti_military_laws:0 "Скасувати Антивоєнні закони 1927 року"
 CZE_rule_the_air_desc:0 "Наші зусилля, докладені для розвитку військово-повітряних сил, дозволили досягти завидної ефективності виробництва в цій галузі."
 CZE_security_council_desc:0 "Рада безпеки Антанти відповідатиме за координацію дій союзників при проведенні спільних військових операцій."
 CZE_the_autonomous_bloc_demands:0 "Вимоги Блоку автономістів"
 CZE_the_broad_coalition_idea_1:0 "Широка коаліція"
 CZE_the_second_fortification_program_category_desc:0 "Невигідні кордони нашої країни є гострою проблемою національної безпеки. Держави, що нас оточують, дали чітко зрозуміти, що мають намір перекроїти їх на свою користь. Подальше укріплення наших рубежів змусить будь-якого потенційного ворога двічі подумати, перш ніж нападати на нас."
 CZE_the_slovak_arrow:0 "«Словацька стріла»"
 CZE_topple_the_king_desc:0 "Вплив $CZE_edvard_benesh$ на наш уряд є задушливим. Його влада є більшою, ніж його роль президента, завдяки легіону лоялістів у парламенті. Тепер, коли умови підходящі, ми можемо витіснити його вплив у Верхній палаті (Horní komora)."
