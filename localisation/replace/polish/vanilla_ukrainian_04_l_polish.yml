 RAJ_all_india_kisan_sabha_desc:0 "Селяни та фермери сільської Індії достатньо довго зазнавали експлуатації. Настав час їм організуватися та колективно висловити свої скарги."
 RAJ_appoint_soviet_friendly_government:0 "Призначити прорадянський уряд"
 RAJ_azad_hind_dlc_radio_desc:0 "Щоб поширити послання визволення, ми повинні створити Радіо Азад Гінд. Ця революційна трансляція нестиме наш заклик до свободи через кордони, об'єднуючи патріотів та розпалюючи боротьбу проти колоніального гніту. Боротьба потребує голосу, і це буде наш голос."
 RAJ_british_army_support_desc:0 "Британська армія добре вивчила Індію за 200 років окупації. Вони знають і людей, і землю, тож зможуть підтримати тренування індійських солдатів для боротьби вдома."
 RAJ_communism_transitional_council:0 "ПСР"
