 JAP_sue_for_peace_CHI:0 "Запропонувати умови капітуляції державі [From.GetNameDef]"
 JAP_sue_for_peace_MAN_desc:0 "Ми втратили контроль над материком. Військові вважають, що навряд чи вдасться повернути втрачені території. Цивільний уряд пропонує нам шукати умови, щоби принаймні зберегти наш суверенітет над островами."
 JAP_sway_the_navy_moderates_2_tt:0 "§G4§! §Yадмірали§! стануть лояльними до нас"
 JAP_taiheyo_belt_desc:0 "Наші економісти говорять про новий план створення зони урбанізації, яку вони називають поясом Тайхейо, що простягнеться від Токіо до Фукуоки, з'єднуючи ці райони в мегаполіс. Це забезпечить простіший рух товарів та економічну й промислову діяльність на більшій частині південних домашніх островів. Ми повинні втілити це в реальність!"
 JAP_the_pan_asian_revolutionary_front:0 "Паназійський революційний фронт"
 JAP_the_uno_school_of_economics_tt:0 "Запускає місію, яка знижуватиме наші $MODIFIER_CONSUMER_GOODS_FACTOR$ на §Y-2.5%§! щороку"
 JAP_the_war_has_not_necessarily_developed_focus:0 "Тверда опозиція східноазійському конфлікту"
 JAP_the_yamato_spirit_desc:0 "Серця і розуми [ROOT.GetAdjective]их людей єдині, з'єднані Душею Ямато, що пронизує наше суспільство. Ми повинні гарантувати, що всі наші громадяни знають про нашу минулу славу і знають, що потрібно зробити, щоб повернутися до нашого традиційного способу життя."
