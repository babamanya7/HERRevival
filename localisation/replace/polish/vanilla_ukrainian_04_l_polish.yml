 GRE_bedrock_of_balkan_financial_stability_tt:0 "Ми отримаємо §Yцивільні заводи§! поза мапою за кожну країну в §YЗахідних§!, §YСхідних§! і §YПівнічних Балканах§!, чия §Yдумка§! про нас — дуже дружня. Це також стосується держав §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§! та §Y[TUR.GetNameDef]§!."
