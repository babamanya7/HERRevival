 CZE_contact_henlein_desc:0 "$CZE_konrad_henlein$ вже багато років є постійною кісткою в горлі нашого уряду. Однак у світлі нещодавніх міжнародних подій, можливо, настав час розпочати з ним діалог."
 CZE_current_skoda_priority_dynamic_local_start:0 "Поточний пріоритет:"
 CZE_cut_carpathia_loose_desc:0 "Оскільки Словаччина тепер є федеративною державою, регіон Рутенія сподівається укласти подібну угоду. Хоча це здається нерозумним, без Словаччини під нашим прямим контролем спроби приборкати їх будуть складними. Можливо, нам слід просто поступитися їхнім вимогам."
