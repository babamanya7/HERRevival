 VIC_long_term_economic_planning_desc:0 "Хоча є спокусою вважати нинішню ситуацію настільки важливою, що вона витісняє всі інші проблеми, ми мусимо не забувати, що є речі, реалізація яких потребує багато часу. Створюючи низку економічних планів, ми можемо ефективно розвивати нашу економіку."
 VIC_mandatory_work_service_desc:0 "Нам вдалося домогтися від німців обіцянки, що ми зменшимо витрати на окупацію, якщо постачати їм робочу силу. Проте, здається, мало хто з людей готовий зробити потрібну роботу, щоби допомогти своїй батьківщині в скрутну годину. Там, де стимули виявилися невдалими, тепер ми, на жаль, мусимо використовувати примус."
