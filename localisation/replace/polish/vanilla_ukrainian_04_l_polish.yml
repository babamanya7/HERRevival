 HUN_protect_austria_desc:0 "Ми мусимо припинити плани Німеччини щодо возз'єднання з Австрією, щоби стримати їхню агресію. Ми можемо гарантувати австрійцям політичну підтримку у боротьбі з прогерманськими елементами всередині країни."
