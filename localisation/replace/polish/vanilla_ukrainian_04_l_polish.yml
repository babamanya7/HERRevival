 CHL_carabineros_secured_by_opposition:0 "Опозиця схилила карабінерів на свій бік"
 CHL_claim_the_mexican_throne_tt:0 "Буде відкрите рішення: §Y$CHL_integrate_the_kingdom_of_mexico$§!."
 CHL_commence_the_counter_revolution_desc:0 "Наші війська стоять напоготові та з нетерпінням чекають наказів, готові зайняти кожну важливу позицію в Сантьяго, а також мерії в інших містах. Все, що потрібно зараз, — це виконати план і чекати, аби побачити, яку підтримку населення ми матимемо, коли все це закінчиться."
 CHL_dario_mujica_gamboa:0 "Даріо Мухіка Гамбоа"
 CHL_devalue_the_peso_franc:0 "Девальвувати франк"
 CHL_development_inwards_idea:0 "Внутрішній розвиток"
 CHL_domestic_production_of_the_willys_mb_desc:0 "Ми можемо виробляти багато стрілецької зброї та набоїв у себе вдома, але нам бракує досвіду для виробництва належної мото- та бронетехніки. Щоби вирішити цю проблему, ми мусимо купити машини у всіх, хто готовий їх продати, і скопіювати їхні проєкти."
 CHL_eduardo_cruz_coke:0 "Едуардо Крус-Коке"
 CHL_embargo_strategies:0 "Стратегії ембарго"
 CHL_empower_the_preparation_department:0 "Посилити відділ підготовки"
 CHL_enforce_stricter_secularism_desc:0 "Ми вже встановили секуляризм у ліберальній конституції, але церква досі має велику владу як над народом, так і над окремими політиками. Тому ми мусимо вимагати дистанціювання від релігії в політиці від усіх, хто хоче брати в ній участь."
 CHL_expand_the_investigations_police_desc:0 "Слідча поліція Чилі була заснована в 1933 році і є одним із двох чилійських поліцейських органів, поряд з поліцією охорони правопорядку, Карабінерами Чилі. Слідча поліція поділяє свої напрямки розслідування відповідно до розслідуваних злочинів, нараховуючи при цьому кілька спеціалізованих підрозділів поліцейських розслідувань, в яких працюють фахівці-детективи."
 CHL_expand_the_officer_corps:0 "Розширити офіцерський корпус"
 CHL_fascist_assault_department:0 "Departamento de las Tropas Nacistas de Asalto"
 CHL_fascist_kingdom_DEF:0 "Королівство Чилі"
 CHL_guido_beck:0 "Гвідо Бенедікт Бек"
 CHL_guillermo_barrios_tirado:0 "Гільєрмо Барріос Тірадо"
 CHL_impose_new_taxes_desc:0 "Наша скарбниця виснажилася після численних зусиль, спрямованих на відновлення країни до колишнього стану, і щоби полегшити цю ситуацію, хорошим планом було б запровадити нові податки на доходи для нашого населення. Спочатку вони можуть не сподобатися, але пройде трохи часу, і вони заспокояться, а ми матимемо набагато більше грошей, які можна буде витратити."
 CHL_increase_spending_on_public_works_desc:0 "Якщо Алессандрі і довів щось під час свого президентства, то це те, що громадські роботи — чудовий спосіб омолодити економіку."
 CHL_joint_development_and_research:0 "Спільні розробки та дослідження"
 CHL_legacy_of_caupolican:0 "Спадщина Кауполікана"
 CHL_liberate_the_caribbean_desc:0 "Карибський басейн може бути не гіспанським чи навіть латиноамериканським, але він, тим не менш, мусить потрапити в нашу сферу впливу, і ми мусимо вжити всіх заходів, щоби закріпити за собою ці острови."
 CHL_mapuche_nationalism_decisions_desc:0 "Народ мапуче має спільну справу з будь-якими іншими народами, які страждали під гнітом імперіалізму, і настав час взяти справу у свої руки та звільнити всіх тих, хто прагне свободи."
 CHL_mapuche_reorganize_the_brazilian_government:0 "Реорганізувати [BRA.GetAdjective]ий уряд"
 CHL_mapuche_social_classes:0 "Соціальні класи та когендерні ідентичності мапуче"
 CHL_naval_mutiny_desc:0 "Зараз відбувається ще один заколот у ВМС на знак протесту проти приходу до влади наших рухів, і це сильно калічить нашу націю."
 CHL_new_fatherland_communism_ADJ:0 "Чилійськ"
 CHL_new_fatherland_neutrality_ADJ:0 "Чилійськ"
 CHL_news_events.4.a:0 "Тривожно..."
 CHL_news_events.6.desc:0 "Нейтральний чилійський конвой «SS Tolten» прямував без супроводу з Балтимора до Нью-Йорка, коли поблизу мосту його вразила торпеда з німецького підводного човна біля Барнегата, Нью-Джерсі. Корабель затонув за шість хвилин, і лише після його затоплення екіпаж підводного човна підтвердив, що корабель був чилійським. Це може стати дипломатичною катастрофою для німців."
 CHL_olegario_reyes:0 "Олегаріо Реєс Дель Ріо"
