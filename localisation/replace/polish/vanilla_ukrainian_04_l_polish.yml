 SOV_for_the_common_good_subjects:0 "$SOV_for_the_common_good_allies$"
 SOV_fortify_mongolian_border:0 "Зміцнити монгольський кордон"
 SOV_found_the_comecon_desc:0 "Війна показала, що нам потрібно покращувати нашу співпрацю та економічний розвиток наших друзів і партнерів. З цією метою ми створимо організацію, яка координуватиме торгівлю та економічний розвиток між нашими країнами."
 SOV_funds_for_the_cause_tt:0 "Дасть ідею §Y$SOV_foreign_funds_idea$§! на 365 днів, коли почнеться громадянська війна."
 SOV_gosproyektstroy_decision_category:0 "Госпроектстрой"
 SOV_great_commander_desc:0 "Досягнення товариша Сталіна у військовій теорії та лідерстві занадто великі, щоб їх перелічити. Хоча зрадник Троцький, можливо, і заснував Червону армію, саме товариш Сталін перетворив її на ефективну силу для захисту досягнень робітничого класу."
 SOV_gw_armored_car_equipment_short:0 "БА-20"
 SOV_has_active_tank_designer_any_tt_NOT:0 "Нема активного §Yконструктора танків§!"
