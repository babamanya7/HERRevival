 JUNO_already_invited_italian_advisors_completed:0 "Італійських радників уже запрошено"
 JUNO_brazil_events.12.desc:0 "Повідомляється, що люди подорожували днями з усієї нації, щоб стати свідками останнього мітингу інтегралістів у [FROM.FROM.GetName]. Сотні уніформованих членів намагалися підтримувати порядок у натовпі, коли прибуло дещо розгублене керівництво партії, а їхні промови ледь було чути через захоплення аудиторії. Схоже, що розгніваним масам нарешті набрид політичний статус-кво."
 JUNO_brazil_events.139.t:0 "[FROM.GetNameDefCap] відмовляється звільнити колонії"
 JUNO_brazil_events.15.a:0 "Ми вітаємо цю взаємовигідну угоду."
 JUNO_brazil_events.150.a:0 "Вони просто неприємність."
 JUNO_brazil_events.200.a:0 "$BRA_anisio_teixeira$"
 JUNO_brazil_events.50.desc:0 "Дипломати з [FROM.GetNameDef] звернулися до нас із пропозицією членства в наднаціональній організації, в якій держави-члени координують економічні та зовнішньополітичні рішення разом. Хоча є явні переваги для нашої економіки від гармонізації політики, а наша безпекова ситуація може бути покращена, дехто стверджує, що втрата суверенітету не варта переваг."
 JUNO_brazil_events.65.desc:0 "Наша контрпропозиція створити співдружність, замість того, щоб безпосередньо приєднатися до [BRA.GetNameDef], була погано сприйнята [BRA.GetAdjective] керівництвом. Вони відхилили ідею співдружності, посилаючись на побоювання, що вони знову потраплять під наш контроль як колонія."
 JUNO_brazil_news.1.a:0 "Це, безсумнівно, лише риторика?"
 JUNO_brazil_news.5.t:0 "[BRA.GetAdjective] Комуністична революція"
 JUNO_brazil_news.6.t:0 "Комуністичний переворот у [ROOT.GetNonIdeologyName]"
 JUNO_guay_events.1.a:0 "Чудово"
 JUNO_guay_events.6.desc:0 "[FROM.GetAdjective] армія, незважаючи на свій менший розмір, досягла значних територіальних та військових успіхів над нашими власними силами. Спірна територія тепер повністю в руках [FROM.GetName], що різко знижує нашу легітимність над регіоном. Ми повинні вибрати між продовженням цієї війни, яка, безсумнівно, деморалізує наші війська, або передачею території, яку ми втратили."
