 PER_half_stability_tt:0 "§RНаша стабільність впала нижче 50%! Якщо вона опуститься нижче 20%, ми ризикуємо революцією!§!"
 PER_idea_one_for_all_all_for_one:0 "Один за всіх, всі за одного"
 PER_imperial_events.1.t:0 "[FROM.GetNameDefCap] бажає домовитися про ненапад"
 PER_imperial_events.10.desc:0 "Сьогодні було отримано повідомлення від шаха [PER.GetNameDef], який вимагає, щоб ми відмовилися від нашого контролю над регіоном Белуджистан. За словами [PER.GetAdjective] уряду, ця територія належить їм за божественним правом. Ми повинні бути обережні, якщо ми спровокуємо їх, вони можуть оголосити нам війну."
 PER_imperial_events.101.a:0 "Ми поженемо їх до їхньої столиці!"
 PER_imperial_events.110.b:0 "$PER_imperial_events.80.b$"
 PER_imperial_events.112.t:0 "Невдалі переговори"
 PER_imperial_events.152.t:0 "[FROM.GetNameDefCap] відмовляється відступити"
 PER_imperial_events.170.t:0 "[FROM.GetNameDefCap] вимагає нашої здачі"
 PER_imperial_events.202.desc:0 "[FROM.GetLeader] написав довгий лист [ROOT.GetLeader], повідомляючи їм, що пропозиція про договір про дружбу та пакт про ненапад не варта паперу та чорнила, на яких вона була задумана. [FROM.GetLeader] продовжив писати, що будь-що, крім офіційного альянсу між [FROM.GetNameDef] та [ROOT.GetNameDef], — це просто марна трата часу, і що вони воліли б, щоб їх звільнили від будь-яких майбутніх [ROOT.GetAdjective] схем відтепер."
 PER_imperial_events.212.t:0 "[FROM.GetName] відмовляється від наших вимог!"
 PER_imperial_events.30.desc:0 "На честь заснування стародавньої Імперії Ахеменідів Кіром Великим шах [PER.GetNameDef] організував пишну демонстрацію, щоб підкреслити стародавню цивілізацію та історію [PER.GetNonIdeologyName], а також продемонструвати сучасні досягнення під його правлінням. Великі лідери з усіх головних націй світу запрошені взяти участь у цьому святкуванні, але невдоволення швидко поширюється серед бідних у [PER.GetNameDef], які вважають, що ця вистава є марною тратою грошей. Однак усі гості чудово провели час, скуштувавши вишукану їжу та ставши свідками видатного військового параду."
 PER_imperial_events.80.b:0 "Ні! Ми повинні просуватися вперед!"
 PER_imperial_state_of_iran:0 "Імперська держава Іран"
 PER_industrial_aid_desc:0 "Наші товариші в [SOU.GetNameDef] показали, що переважно сільськогосподарська економіка може бути швидко індустріалізована шляхом ретельного планування. Ми повинні звернутися до них і подивитися, чи готові вони поділитися своїм досвідом у цьому питанні."
 PER_industry_shortcut:0 "Економіка"
 PER_international_solidarity:0 "Міжнародна солідарність"
 PER_invite_foreign_investors:0 "Іноземні інвестиції"
 PER_islamic_republic_democratic_DEF:0 "Ісламська республіка Іран"
 PER_last_thousand_years:0 "Імперія, що проіснує тисячу років"
 PER_metropolitan_iran_idea_desc:0 "Ми успішно розширили [PER.GetAdjective] метрополію, вийшовши за межі Тегерана. Наші міста зростають і процвітають завдяки нашим масштабним зусиллям із модернізації. Це справді славетний день!"
 PER_officers_to_italy:0 "Відправити офіцерів на навчання до Італії"
 PER_opposition_modifier_desc:0 "У міру зростання невдоволення режимом Пехлеві все більше людей об’єднуються, щоб протистояти нинішньому уряду. Якщо це продовжить наростати, країна може зіткнутися з невизначеним майбутнім."
 PER_post_war_spoils:0 "Військова здобич після війни"
 PER_purchase_foreign_ships:0 "Придбати іноземні кораблі"
 PER_reintegrate_anatolia_desc:0 "Тепер, коли ми завоювали землю в межах колишніх кордонів [TUR.GetNameDef], ми можемо розпочати інтеграцію цієї території в [PER.GetNameDef] як офіційну, де-юре землю."
 PER_resistance_modifier:0 "Осередки опору"
 PER_resistance_modifier_desc:0 "Цей регіон охоплений осередками опору, організованими [PER.GetNameDef]."
 PER_reza_shah_pahlavi:0 "Реза-шах Пехлеві"
 PER_saadabad_pact_member:0 "Член Саадабадського пакту"
 PER_secure_coastline:0 "Забезпечити безпеку узбережжя"
 PER_shiraz_university_desc:0 "Коли справа доходить до фінансування нових університетів, ми повинні зосередити наші зусилля на створенні технічних шкіл з надією, що їхні випускники підуть далі, щоб закласти основи для сучасного [ROOT.GetNonIdeologyName]!"
 PER_ssb_events.10.a:0 "Цей пакт починає мати великий вплив на нашу економіку."
 PER_stand_our_ground:0 "Стояти на своєму"
 PER_tehran_armor_organization:0 "Тегеранський бронетанковий завод"
 PER_tehran_power_grid_idea:0 "Розширена електромережа Тегерана"
 PER_unification_initiative_idea:0 "Ініціатива об’єднання"
 PER_unification_initiative_idea_desc:0 "Не секрет, що наша нація частково роздроблена. Наше правління перебуває під загрозою потенційних повстань з боку курдів і азербайджанців, а також ізсередини нашого власного уряду. Ініціатива об’єднання спрямована на усунення цих загроз і забезпечення нашої гегемонії над [PER.GetNameDef]."
 PER_united_progressive_parties_desc:0 "Після зречення шаха ми маємо можливість побудувати більш прогресивне майбутнє для [ROOT.GetNonIdeologyName]. Але для цього ми повинні мати підтримку всіх прогресивних партій в одній великій коаліції, яка зможе здійснити нашу програму."
