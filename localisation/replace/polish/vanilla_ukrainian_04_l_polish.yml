 INS_loyalist_events.5.a:0 "Разом ми сильніші!"
 INS_mobilize_the_pemuda_trigger_tt:0 "Завершено щонайменше §Y3§! наземні рейди Пемуди"
 INS_national_revolution_dutch_cat_map:0 "Переглянути регіони, окуповані ополченням"
 INS_nav_bomber_equipment_0:0 "Fokker T.IV"
 INS_naval_steal_limited_success_tt:0 "§Y50%§! флоту [THIS.GetAdjective] захоплено."
 INS_oil_for_dockyard:0 "Продати нафту американським верфям"
 INS_political_events.1.t:0 "Новий генерал-губернатор"
 INS_political_events.2.a:0 "Добре, це не варте інциденту."
 INS_political_events.2.b:0 "Абсолютно ні!"
 INS_quinine_export_desc:0 "Хінінове бюро в Амстердамі має майже повну монополію на експорт хініну, що є особливо прибутковим, оскільки хінін користується великим попитом у всьому світі як засіб лікування малярії. Бюро отримує більшу частину свого хініну з Ост-Індії. Незважаючи на це, ми отримуємо дуже малу частину прибутку. Ми повинні використати наше виробництво хініну як важіль для ведення переговорів про більш справедливу угоду."
 INS_reform_education_system_2:0 "Реформа освіти"
 INS_republic_knip_party:0 "KNIP"
 INS_revolution_events.19.a:0 "Ми повинні погодитися. Занадто багато життів вже втрачено."
 INS_revolution_events.19.desc:0 "[HOL.GetLeader] був викликаний на зустріч із [INS.GetLeader] для обговорення потенційної мирної угоди. [INS.GetLeader] заявив, що було втрачено занадто багато життів, і запропонував рішення про дві держави, де кордони будуть збережені такими, якими вони є зараз, з невеликими коригуваннями, і щоб бойові дії припинилися назавжди."
 INS_revolution_events.22.b:0 "Це забагато вимагати від нас."
 INS_revolution_events.32.desc:0 "Переговори про припинення вогню пішли не за планом, і [HOL.GetLeader] відмовився підписати угоду та перервав переговори до того, як можна було знайти компроміс."
 INS_revolution_events.38.a:0 "Мердека!"
 INS_revolution_events.42.a:0 "Так починається остання битва."
 INS_revolution_events.7.a:0 "Це неприйнятно!"
 INS_revolution_planning_hq:0 "Створити революційний штаб у [FROM.GetName]"
 INS_revolution_planning_hq_desc:0 "Ми створимо наш штаб ополчення у [FROM.GetName], який буде функціонувати як наше центральне командування базами ополчення по всьому архіпелагу. Наш штаб і навколишня територія будуть пріоритетними в місіях інфільтрації та перебуватимуть під нашим твердим контролем."
 INS_state_militia_sabotage_3:0 "Диверсія ополчення"
 INS_state_revolution_hq_tt:0 "Регіон буде під нашим контролем після проголошення незалежності"
 INS_sumatra_railway_desc:0 "В рамках наших постійних зусиль із розвитку інфраструктури Суматри нам слід побудувати велику залізницю, що простягнеться від північного Ачеху до найпівденнішого порту Суматри, який дуже швидко з'єднується з Батавією кораблем. Таким чином, ресурси потрібно буде транспортувати лише до найближчої залізничної станції, після чого ми зможемо доставити їх до Батавії за лічені дні."
 INS_support_tan_malakas_coup_desc:0 "Сукарно проголосив нашу незалежність, але він проявив себе як людина напівзаходів і дипломатичних поступок. Тан Малака та його організація Persatuan Perjuangan вимагають того, чого вимагає народ: стовідсоткової незалежності, ніяких переговорів, ніяких компромісів. Якщо Сукарно не хоче боротися за революцію в повному обсязі, то революція має знайти лідера, який буде."
 INS_tac_bomber_equipment_1:0 "Fokker T.V"
 INS_the_indonesian_general:0 "Індонезійський генерал"
 INS_the_jewel_in_the_crown_desc:0 "Ост-Індія — найяскравіша перлина в голландській колоніальній короні, і ми маємо намір зберегти її такою. Через Фольксраад наш голос доноситься до Гааги."
 INS_the_proclamator:0 "Проголошувач"
 INS_the_timor_issue_desc:0 "[INS_timor_issue_scripted_desc]"
 INS_trusted_leader:0 "Успішний реформатор"
 INS_union_events.4.desc:0 "Прибули перші транспорти з батьківщини. Кораблі переповнені офіцерами, солдатами та залишками наших арсеналів. Як і очікувалося, деякі конвої не дійшли до порту. Те, що вціліло, сформує кістяк наших сил у [1058.GetName]."
 INS_volksraad_events.101.t:0 "Представники [INS.GetAdjective] тепер можуть подавати заявки на освітні субсидії"
 INS_volksraad_events.40.b:0 "Податки залишаться."
 INS_volksraad_events.41.t:0 "Приватний податок на експорт каучуку було зменшено."
 INS_volksraad_events.60.desc:0 "[INS.GetLeader] схвалив петицію Фольксрааду про зняття неписаного правила, яке обмежує звання, що можуть мати офіцери KNIL не голландського походження, і підвищення індонезійських офіцерів, які вважаються недооціненими за свої досягнення. Петицію було відправлено [HOL.GetLeader] на остаточне затвердження."
 INS_weapons_caches_unlock_tt:0 "Розблоковує рейд §YЗдійснити наліт на схованки зі зброєю§! в регіонах Яви під контролем Нідерландів. Може бути використано лише один раз."
 INS_will_keep_characters_tt:0 "Ми збережемо §Yусіх§! нідерландських персонажів у разі здобуття незалежності."
