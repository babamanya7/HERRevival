 JAP_form_the_central_economic_council_desc:0 "Щоб подолати економічний спад, з яким стикається наша країна через політичну нестабільність та війну, ми повинні створити при прем'єр-міністрі спеціальний дорадчий орган, метою якого буде розслідування та обговорення економічної політики між метрополією та заморськими територіями, а також розробка базових планів для їх реалізації."
 JAP_fortify_the_border_desc:0 "Наш північний кордон практично беззахисний. Потрібно зміцнити північні рубежі на випадок атаки із цього напрямку."
