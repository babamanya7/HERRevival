 ETH_an_ethiopian_navy_in_exile_desc:0 "Ставши свідком [JAP.GetAdjective]ої демонстрації військово-морської могутності, Його Величність [ETH.GetLeader] попросив допомоги у наших милостивих господарів для будівництва [ETH.GetAdjective]ого флоту, щоби допомогти у звільненні нашої батьківщини та захистити її від будь-які майбутні атаки."
