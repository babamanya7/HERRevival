 FIN_sotilaalliset_kappalaiset_desc:0 "Доступ до капелана є надзвичайно важливою послугою, на яку покладаються наші солдати. Багато з цих капеланів також справедливо стурбовані майбутнім нашої нації. Якби ми співпрацювали з ними, ми могли б отримати не лише очі та вуха на передовій але також забезпечити, щоб правильні повідомлення також доходили до військ."
