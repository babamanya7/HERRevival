 GRE_crack_down_on_foreign_monopolies_desc:0 "Надто довго ми терпіли закордонних лихварів та глобальні фінансові монополії. Досить! Більше ми не дозволимо зневажати цим підступним інститутам, тому що з цього дня Греція буде по-справжньому вільною!"
 GRE_faction_loyal_manpower:0 "§G+20%§!"
 GRE_factions_unlocked:0 "Фракції відкриті"
 GRE_fiscal_responsibility_desc:0 "Ми нарешті досягли стану фінансової рівноваги — можливо, вперше в сучасній грецькій історії. Немає сумніву, що це гідне святкування! Нам слід похвалити себе за майстерне управління державою, адже ми цього заслужили."
 GRE_foreign_monopolies_4_desc:0 "$GRE_foreign_monopolies_desc$"
 GRE_four_year_plan_desc:0 "Метаксас продумав чудовий план індустріалізації Греції. Взявши за основу італійську корпоративістську економічну модель, ми досягнемо певної автаркії та незалежності від сил, що нас стримують."
 GRE_hellenic_army_desc:0 "Можливо, випадкового спостерігача наші збройні сили не вразять, але в наших людях живе незламний бойовий дух, полум'я, яке не так легко погасити. Не можна нехтувати настільки рідкісною рисою — саме вона допомагає нам бути нарівні з ворогом."
