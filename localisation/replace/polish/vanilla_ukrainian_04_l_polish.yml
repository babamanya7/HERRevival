 SEA_PHI_political_events.13.c:0 "Надіслати листа із рішучим протестом"
 SEA_PHI_political_events.21.a:0 "Ласкаво просимо на Філіппіни, генерале!"
 SEA_PHI_political_events.4.desc:0 "[FROM.GetAdjective]і представники оголосили, що надішлють додаткових делегатів для створення торговельної угоди між нашими країнами. Така нова угода з [FROM.GetNameDef] обіцяє запропонувати нам більше варіантів щодо того, від кого ми отримуємо наші критично важливі ресурси."
 SEA_PHI_political_events.44.t:0 "Військовий надзвичайний стан"
 SEA_PHI_political_events.5.t:0 "[FROM.GetName] відхиляє торговельну угоду"
 SEA_PHI_political_events.50.t:0 "[FROM.GetName] б'ється за відновлення контролю над нами"
 SEA_PHI_political_events.52.t:0 "$USA_dwight_d_eisenhower$ відкликаний до [USA.GetNameDef]"
 SEA_PRC_faction_events.40.desc:0 "Ми стоїмо на роздоріжжі, де маємо вирішити, як будувати відносини з іншими китайськими державами. [ROOT.GetLeader] розмірковував над цим багато безсонних ночей, і здається очевидним, що є лише один шлях уперед для об'єднання всього Китаю..."
 SEA_PRC_faction_events.74.t:0 "[FROM.GetNameDefCap] відмовляється приєднуватися до [PRC.GetFactionName]"
 SEA_PRC_faction_events.80.b:0 "У нас немає іншого вибору, окрім як підкоритися"
 SEA_PRC_fourth_army_incident.10.desc:0 "Після інциденту з Новою 4-ю армією [FROM.GetNameDef] розцінив наші дії як акт агресії та відновив громадянську війну. Війська, які ще нещодавно оборонялися пліч-о-пліч, вже б'ються один з одним на фронті, а ситуація в тилу не набагато краща."
 SEA_PRC_misc_events.6.desc:0 "Після багатьох років роботи журналістом в інших частинах Китаю американець Едгар Сноу звернувся з проханням про інтерв'ю з Мао. У наступній серії інтерв'ю Мао і Сноу говорили переважно про [JAP.GetAdjective]ий імперіалізм і про те, як [ROOT.GetNameDef] і [CHI.GetNameDef] можуть організуватися для опору йому; Мао, зокрема, передбачив революцію в Японії, якщо вона зазнає серйозних військових поразок. Ці інтерв'ю та досвід Сноу в [ROOT.GetNameDef] стануть основою для книги, що представить його унікальний погляд на життя тут."
 SEA_PRC_misc_events.9.t:0 "7-й Національний з'їзд Комуністичної партії Китаю"
 SEA_PRC_political_events.32.desc:0 "[FROM.GetNameDefCap] відповів, що вони більше не хочуть використовувати дипломатичний варіант наших гарантій. Вочевидь, принцип становлення підлеглим суб'єктом був для них неприйнятним."
 SEA_PRC_political_events.9.a:0 "Це полегшення"
 SEA_PRC_request_aid.6.t:0 "[FROM.GetName] надсилає трохи танків"
 SEA_PRC_request_aid.8.t:0 "[FROM.GetName] відхиляє наш запит на танки"
 SEA_border_incidents_events.2.b:0 "Це не варте клопоту..."
 SEA_china.20.a:0 "Вітаємо рішучу перемогу"
 SEA_china.25.c:0 "$okmo$"
 SEA_china.3.t:0 "[FROM.GetNameDefCap] відхиляє наші запити"
 SEA_china.9.t:0 "[FROM.GetName] відхиляє пропозицію"
 SEA_china_warlords.5.a:0 "Єдність перемагає"
 SEA_generic_events.11.desc:0 "Робітники військово-морської промисловості, де підтримка [GetOppositionPartyName] є особливо сильною, розпочали великий страйк, який зараз зриває наші зусилля з суднобудування. Хоча навряд чи вдасться задовольнити всі їхні політичні вимоги, ми все ж можемо уникнути подальших заворушень, покращивши умови їхньої праці."
 SEA_generic_events.14.desc:0 "Величезна популярність [GetOppositionPartyName] за відсутності у неї значної влади в уряді призвела до численних великих протестів по всій країні. Задоволення деяких вимог протестувальників може розрядити ситуацію, але має свої недоліки."
 SEA_generic_events.7.desc:0 "[GetOppositionPartyAdjective] партія проводить сьогодні мітинг, і отримані звіти прогнозують відвідуваність такого ж масштабу, як і на мітингах [ROOT.GetRulingParty]. Ми можемо лише сподіватися, що наші прихильники не розділяють їхніх занепокоєнь."
 SEA_imperial_influence_events.242.t:0 "Фракція Флоту вимагає збільшення виробництва лінкорів"
 SEA_imperial_influence_failure_event_option_1:0 "Втрата вчить там, де гордість не може"
 SEA_japan.1.desc:0 "Посилаючись на загрози душі імперської нації, молоді офіцери, вірні фракції Кодоха в Імператорській армії, організували державний переворот з метою очищення уряду та військового керівництва від тих, хто виступає проти їхнього етосу мілітаризму та прямого імператорського контролю над державою. Вони вже оточили резиденції вищих посадовців і захопили урядовий центр Токіо. Однак Імператор мовчить, попри надії повстанців, що він виступить на їхню підтримку. Як розгортатиметься цей інцидент?"
 SEA_japan_foreign_policy.102.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] різко відреагував на наше прохання про прийняття спільної валюти в межах нашого альянсу, погрожуючи запровадити мита, якщо ми спробуємо просунути це питання силою. Схоже, [FROM.GetNameDef] не буде частиною світлого майбутнього, яке ми задумали."
 SEA_japan_foreign_policy.112.desc:0 "Дипломати, що належать до [FROM.GetNameDef], запропонували угоду, за якою їм надається сюзеренітет над нашими підданими в Бірмі та Малайзії в обмін на права на ресурси в деяких життєво важливих районах, стверджуючи, що це є частиною їхньої доктрини Захисника Тихого океану. Вони заявляють, що це дозволить нам зосередитися на Європі та Африці, поки вони захищатимуть Азію від комунізму. Що ми скажемо?"
 SEA_japan_foreign_policy.124.desc:0 "Делегація здалеку нещодавно прибула до нашої столиці, шукаючи аудієнції у [ROOT.GetLeader]. Вони заявляють, що представляють [FROM.GetNameDef], і прагнуть укласти альянс між нашими державами. Чи погодимося ми?"
 SEA_japan_foreign_policy.137.desc:0 "[JAP.GetLeader] has demanded that we merge our government with [MAN.GetNameDef], ending our independence and giving our leadership high-ranking positions within the [MAN.GetAdjective] government. Do we accept this proposal?"
 SEA_japan_foreign_policy.14.a:0 "Гаразд"
 SEA_japan_foreign_policy.15.desc:0 "Посилаючись на те, що місто може стати гарним плацдармом для удару ворогів за нагоди, [FROM.GetAdjective]і війська, що управляють регіоном [592.GetName], висунули нам ультиматум. Або ми впускаємо їх, по суті надаючи їм повноваження робити з містом усе, що вони забажають, або ми стикаємося з повною силою [FROM.GetAdjective]ої армії. Що нам робити?"
 SEA_japan_foreign_policy.16.desc:0 "Регіональні адміністратори області [729.GetName] вирішили впустити наші війська, розуміючи, що опір зрештою виявиться марним. Наш народ радіє, адже ще одну західну державу витіснено зі Східної Азії!"
 SEA_japan_foreign_policy.18.t:0 "[FROM.GetNameDefCap] запрошує нас до свого альянсу"
 SEA_japan_foreign_policy.28.desc:0 "Окупувавши законні монгольські землі, наш сюзерен [FROM.GetNameDef] передав управління територіями нам, як і обіцяв. Ми дуже вдячні за довіру, яку вони нам виказують!"
 SEA_japan_foreign_policy.32.t:0 "Японія прагне співпраці проти комуністичної загрози"
 SEA_japan_foreign_policy.38.desc:0 "[FROM.GetLeader] вирішив заблокувати наше втручання у [FROM.GetNameDef], вирішивши, що їхня незалежність якимось чином цінніша за божественну паназійську місію."
 SEA_japan_foreign_policy.46.a:0 "Ми вдячні за їхню наївність"
 SEA_japan_foreign_policy.55.t:0 "Чутки про вторгнення з Внутрішньої Монголії"
 SEA_japan_foreign_policy.58.a:0 "Чудово"
 SEA_japan_foreign_policy.6.a:0 "Готуйте війська до атаки!"
 SEA_japan_foreign_policy.79.desc:0 "[FROM.GetLeader] звернувся до нас із пропозицією, стверджуючи, що це на благо обох наших народів. Прохання полягає в тому, щоб наша нація з часом стала інтегрованою частиною [FROM.GetNameDef], що покладе край нашій автономії та зробить нас основною частиною їхньої держави. Чи справді це нам вигідно?"
