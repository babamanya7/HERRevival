 DOD_romania.114.desc:0 "До нашого кордону стягуються німецькі війська, а посли Німеччини та Румунії пред'явили нам спільний ультиматум: якщо ми не погодимося передати Словаччину Угорщини та зробити Румунію «протекторатом» Німеччини, німецькі люфтваффе «ліквідують» Прагу. Угорські війська вже готові вторгнутися до нашої країни з півдня."
 DOD_romania.120.c:0 "Серійне виробництво «Ford»."
