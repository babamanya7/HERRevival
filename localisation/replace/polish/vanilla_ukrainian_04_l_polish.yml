 BRA_license_soviet_designs_tt:0 "([SOV.GetFlag]§Y[SOV.GetName]§!) отримує подію «§Y[BRA.GetNameDefCap] прагне ліцензійної угоди на виробництво§!»\n\nВони, ймовірно, погодяться, якщо мають §Yвисоку думку про нас!§!"
 BRA_militant_communist:0 "Войовничий комуніст"
 BRA_nationalization_of_industry:0 "Націоналізація промисловості"
 BRA_nationalization_of_industry_desc:0 "Наша цивільна промисловість ще не була націоналізована. У руках приватних власників, які шукають прибутку, а не задоволення потреб нашого народу та країни, ефективність сильно страждає. Для блага всіх людей у [BRA.GetNameDef] ми повинні націоналізувати та розширити нашу промисловість."
 BRA_org_american_unity_warning_tt:0 "§RДержави-члени організації будуть викликані для захисту будь-якого іншого члена, на якого напали. Невиконання захисту члена, який потребує допомоги, або оголошення війни іншому члену призведе до виключення з організації!§!"
 BRA_radio_nacional_idea:0 "Radio Nacional"
 BRA_reclaim_territory_in_south_america_desc:0 "Ганьба Цисплатинської війни висить над Імператорським домом навіть через століття після закінчення цієї дорогої війни. Відновлення нашої претензії на землі Уругваю значно підвищило б гордість серед наших підданих та нагадало б світові, що ми не та сама занепала нація, якою колись були."
