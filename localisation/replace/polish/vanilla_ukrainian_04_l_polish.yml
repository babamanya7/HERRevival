 sp_commercial_nuclear_reactor_concerns_reward_desc:0 "[Character.GetName] вислови[Character.GetVerbGendEndA_RU] занепокоєння відсутністю фільтрів у градирнях наших нових реакторів. [Character.GetSheHeCap] наполягає на тому, що фільтри необхідно додати, щоби запобігти викиду радіації з реактора в разі аварії. Інженери тим часом стверджують, що це значно затримає реалізацію проєкту."
