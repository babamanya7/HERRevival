 GOE_RAJ_famine.7.desc:0 "Масові громадянські заворушення спалахнули в [?global.famine_state.GetName]. Брак основних запасів змусив велике сільське населення переїхати до переповнених міст у пошуках допомоги.\nЦе швидко вийшло з-під контролю, оскільки почали формуватися натовпи, які стикаються між собою."
