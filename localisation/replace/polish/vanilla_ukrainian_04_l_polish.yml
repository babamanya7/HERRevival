 WW_hungary.7.desc:0 "Інфантильний [FROM.GetLeader] нещодавно засудив нашу, як він заявив, незаконну окупацію угорської Південної Словаччини. Тепер ми отримали ультиматум від них остаточний ультиматум, їхні війська продовжують скупчуватися на нашому кордоні. Як нам реагувати?"
