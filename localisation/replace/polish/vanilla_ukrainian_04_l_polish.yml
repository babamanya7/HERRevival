 FIJ_DEF:0 "Фіджі"
 FIJ_fascism:0 "Імперія Морів"
 FIN_BLITZKRIEG_DESC:0 "Фінляндія опинилася затиснутою між Радянським Союзом і Нацистською Німеччиною, і напруга між цими двома все зростає. Переговори з Радянським Союзом не вдалися; тепер уряд стикається зі складними рішеннями щодо способу захистити суверенітет країни.\n\nБуло докладено зусиль для зміцнення фінської оборони, але її армія досі погано оснащена, а ВПС і ВМС практично не існують. Попри це, сильне почуття національної гордості та військова доблесть фінів додає країні суворої рішучості відстояти свою незалежність."
