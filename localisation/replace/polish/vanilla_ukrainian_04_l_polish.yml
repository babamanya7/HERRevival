 HUN_VICTORY_POINTS_3581:0 "Епер'єш"
 HUN_agrarian_tradition_desc:0 "Наші славетні сільськогосподарські традиції сягають давніх часів, ще до нашого прибуття до місцевості, яку ми нині називаємо домом. Ми повинні цінувати ці традиції та всіляко їх підтримувати."
 HUN_destroyer_desc:0 "Незважаючи на свою непримітність, есмінці є критичною складовою будь-якого флоту. Більше того, невисока вартість робить їх чудовим вибором для початку розвитку наших ВМС."
