 JAP_destroyer_3_desc:0 "Есмінці класу «Akizuki» були добре озброєні як надводними гарматами, так і торпедами, адекватним зенітно-ракетним озброєнням, а також вкрай необхідними додатковими глибинними бомбами. Із 39 запланованих есмінців лише 12 були завершені до того, як серію було скасовано."
