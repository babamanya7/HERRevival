 sp_land_reward_land_cruiser_engine_desc:0 "Перші випробування проєкту «[SpecialProject.GetName]» показали, що масивна рама прототипу створює навантаження на двигун, що робить техніку повільною та неповороткою. Команда пропонує два варіанти: розробити новий, потужніший двигун або спробувати модифікувати існуючий, щоби збільшити його потужність, але з ризиком виходу з ладу."
