 ETH_request_soviet_hulls_desc:0 "Якщо ми хочемо уникнути блокування в майбутніх конфліктах, нам потрібно навчитися виготовляти власні кораблі. [SOV.GetNameDefCap] нещодавно відмовився від деяких своїх проєктів лінкорів і, можливо, готовий купити недобудовані корпуси. Ми могли б багато чому навчитися з такої покупки."
 ETH_sabotage_italo-german_relations:0 "Саботувати італо-німецькі відносини"
 ETH_social_reforms_desc:0 "Без загрози спільного ворога, який об'єднає нас, ми часто опиняємось розділеними через історичні, культурні та релігійні образи. Нам потрібна хвиля соціальних реформ, щоби подолати ці розбіжності, щоби ми могли залишатися єдиними та продовжувати процес побудови кращого [ETH.GetName]."
