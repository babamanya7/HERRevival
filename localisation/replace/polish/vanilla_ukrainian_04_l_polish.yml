 CZE_anti_air_equipment_2:0 "7,5 cm kanon PL vz. 37"
 CZE_aristocratic_support:0 "Підтримка аристократії"
 CZE_assist_austria_desc:0 "Утримання Австрії осторонь будь-яких конфліктів є життєво важливим для нашої національної безпеки. [AUS.GetAdjective]і кордони є одним із найуразливіших місць у нашій обороні. Їхня економіка також була б цінним активом для наших ворогів, чого ми не можемо допустити."
