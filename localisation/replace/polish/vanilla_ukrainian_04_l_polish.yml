 CZE_placate_benes_faction_desc:0 "$CZE_milan_hodza$ повинен змиритися з тим, що його перебування на посаді міністра закордонних справ пройшло жахливо. $CZE_edvard_benesh$ готовий виступити зі своїми прихильниками серед аграріїв та зміцнити позиції $CZE_milan_hodza$ як прем'єр-міністра за умови, що той відмовиться від посади міністра закордонних справ."
 CZE_pressure_romania:0 "Тиск на Румунію"
 CZE_prime_minister_of_carpathian_ukraine:0 "Прем'єр-міністр Карпатської України"
 CZE_raiding_focus_desc:0 "Наш флот повинен використовувати тактику непрямих дій: уникати відкритого бою та заважати діяти кораблям супротивника."
 CZE_rearmed_and_retooled_desc:0 "Наше нинішнє важче танкове шасі демонструє потенціал для модернізації. Ми повинні продовжувати досліджувати цей напрямок, щоб забезпечити майбутнє розширення нашого танкового корпусу."
 CZE_recruit_communist_exiles:0 "Вербувати комуністів-вигнанців"
