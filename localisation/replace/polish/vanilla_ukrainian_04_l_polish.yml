 JAP_joshi_teishin_tai_desc:0 "Жіночий добровольчий корпус буде засновано, щоб дати жінкам шанс послужити Імперії до вступу в шлюб, залучаючи їх до виконання трудових обов'язків воєнного часу. Завдяки цьому більше громадян зможе бути мобілізовано для допомоги нашій військовій промисловості."
