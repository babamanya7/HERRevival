 PHI_second_republic_tag_tt:0 "§Y[PHI.GetName]§! буде називатися §YДруга Філіппінська Республіка§!"
 PHI_submarine_supplies:0 "Постачання підводними човнами"
 PHI_subsidies_desc:0 "Закон капіталу такий: щоб заробити гроші, потрібні гроші. Ми повинні використовувати наш бюджет для вливання коштів у сектори, де ми побачимо швидку віддачу. Надання цільових субсидій промисловості та розширення інфраструктури зробить багаті, але важкодоступні ресурси та населення більш досяжними."
