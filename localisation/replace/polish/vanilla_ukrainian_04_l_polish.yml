 GER_demonstration_of_military_achievements:0 "Демонстрація військових досягнень"
 GER_divide_and_conquer:0 "Розділяй і володарюй"
 GER_division_france_mot_tt:0 "§YМоторизована§! частина §YSS-Division Charlemagne§! and the §Ymotorized SS-Division Bretagne§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_eastern_duchies_name_neutrality:0 "Створити східні великі герцогства"
 GER_ensure_army_loyalty:0 "Забезпечити лояльність армії"
 GER_establish_night_fighter_squadrons_desc:0 "Наступним кроком у захисті Фатерланду має стати створення нічних ескадрилій винищувачів (Nachtjagdgeschwader). Використання бортових радарів зробить їх ефективними вдень і вночі при переслідуванні ворога, що зберігає наше небо вільним від ворога."
 GER_expand_kriegsmarinewerft_communism:0 "Volksmarinewerft"
 GER_finland_puppet_description_democratic:0 "[FIN.GetAdjective] народ може й бути нашими союзниками, але ми ніколи не можемо бути певні, що одного дня вони не зрадять. Ми повинні гарантувати, що цього не станеться — будь-якою ціною!"
 GER_fritz_duquesne:0 "Фриц Жубер Дюкен"
 GER_fuhrer_tooltip:0 "[GetFuhrerGenderedName] §Y[GetFuhrerName]§!."
 GER_goring_overseer_four_year_plan:0 "$GER_overseer_four_year_plan$"
 GER_hegemony_of_the_ss_desc:0 "Завдяки збільшеному набору та ліпшому оснащенню SS стала грізною силою на полі бою. Під керівництвом Гіммлера ця група перетворилася на один із наших найвидатніших активів, здатний на речі, які перевершують наші очікування. Довірити їм владу, яку вони зараз мають, було мудрим рішенням, і надалі ми мусимо продовжувати забезпечувати їх засобами, необхідними для успіху."
 GER_heinrich_himmler:0 "Гайнріх Гіммлер"
 GER_hold_joint_military_drills_tt:0 "Ми та всі східноєвропейські держави, яким ми гарантуємо незалежність або які є у нашій фракції, отримаємо наступний національний дух:"
 GER_inner_circle_industrial_reichsleiter_all:0 "$GER_fritz_todt$, $GER_albert_speer$ та $GER_hermann_goring$"
 GER_instigate_middle_eastern_revolutions:0 "Підбурити революції на Близькому Сході"
 GER_integrate_volkskommissariats:0 "Інтегрувати фолькскомісаріати"
 GER_invest_in_vereinigte_stahlwerke_desc:0 "Vereinigte Stahlwerke — один із найбільших і найважливіших виробників сталі. Вкладення в компанію, безсумнівно, призведуть до підвищення продуктивності та трансформації німецької сталеливарної промисловості."
 GER_invite_to_faction_cat_desc:0 "Запрошуючи нові країни до нашого союзу, не лише ми ставатимемо сильнішими з ростом нашої чисельності, але й наші вороги ставатимуть слабшими, оскільки ми позбавлятимемо їх можливих торговельних партнерів і союзників. «[ROOT.GetFactionName]» встановить Новий Світовий Порядок!"
 GER_jet_strat_bomber_equipment_1:0 "Horten H.XVIII"
 GER_legion_condor_desc:0 "Поки на Піренейському півострові триває громадянська війна, перед нами відкривається чудова можливість. Відправивши туди стільки добровольців, скільки зможемо, ми не тільки забезпечимо перемогу правильної сторони, але й запропонуємо нашим військам бойовий досвід і зблизимо [SPR.GetAdjective]ий народ, який поділяє наші ідеали."
 GER_military_modifier_submarine_speed_big_desc:0 "$GER_military_modifier_desc$"
 GER_ministry_of_public_enlightenment_desc:0 "Останнім часом Міністерство пропаганди дуже багато зробило для нас. Ребрендинг Міністерства пропаганди на Міністерство громадської просвіти дозволить нам розширити його функції, а також збільшити фінансування, не викликаючи при цьому занепокоєння."
 GER_mio_trait_sturmhaubitze:0 "Sturmhaubitze"
 GER_national_revitalization3:0 "$GER_national_revitalization$"
 GER_navy_communist_modifier_desc:0 "Народний флот завжди пильнує перед лицем імперіалістичної загрози. Він поширить пролетарську революцію морями й принесе новий світовий порядок."
 GER_navy_fascist_modifier:0 "Kriegsmarine"
 GER_no_balkan_communism_BUL_tt:0 "Отримати ціль війни §YПовалення уряду§! проти §YСоціалістичної республіки Болгарія§!.\n"
 GER_operational_planning_category:0 "Оперативне планування"
