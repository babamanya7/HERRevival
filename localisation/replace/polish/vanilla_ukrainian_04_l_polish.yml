 SOV_restore_the_glory_of_the_motherland_desc:0 "Під нашим новим керівництвом ми забезпечимо, щоб Росія стала славною, як ніколи раніше! Ми почнемо велику програму будівництва всіх видів, і зробимо нашу країну предметом заздрості західного світу!"
