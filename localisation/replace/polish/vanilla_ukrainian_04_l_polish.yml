 SPA_garrison_control_republicans_none_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Rжодний§!\nКількість дивізій на початку громадянської війни: §Y0§! націоналістичних — §Y3§! республіканські§!\n"
 SPA_light_tank_equipment_1_short:0 "Trubia Naval"
 SPA_martyrdom_for_primo_de_rivera:0 "Мучеництво Прімо де Рівери"
 SPA_primo_de_rivera_speech_desc:0 "Хосе Антоніо Прімо де Рівера — один із засновників Іспанської Фаланги. Він оратор, який критикує демократію; можливо, варто заохотити його до подальших виступів, щоби збільшити нашу народну підтримку та ще більше дестабілізувати країну."
 SPA_reassert_american_dominance:0 "Відновити американське панування"
 SPA_regional_agrarian_commissions_desc:0 "Сільська місцевість зруйнована війною. Щоб населення не голодувало, ми негайно створимо аграрні комісії для кожної області. Це максимізує продуктивність непошкоджених орних земель і дозволить нам нагодувати людей."
 SPA_sevilla_offensive:0 "Наступ у Севільї"
 SPA_the_iberian_pact:0 "Іберійський пакт"
 SPA_the_latin_bloc_desc:0 "У світі формуються блоки великої влади. Замість того, щоб втручатися в напругу, яка зростає між ними, ми повинні створити власний блок влади з тими націями, які культурно та ідеологічно схожі на нас: латиноамериканськими країнами навколо Середземномор'я."
