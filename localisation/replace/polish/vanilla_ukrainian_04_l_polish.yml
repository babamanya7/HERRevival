 SIA_thai_cultural_mandates_tt:0 "Відкриває рішення для ухвалення культурних мандатів, що дає різні посилення за ціною §YПолітичної влади§!. Перший мандат та перший інший мандат безкоштовні."
 SIA_unseat_the_government_desc:0 "Режиму, який прив'язав [ROOT.GetNameDef] до іноземного панування, не можна дозволити існувати вічно. Через опір, інтриги та своєчасні дії ми можемо усунути тих, хто скомпрометував націю, і відновити уряд, більш гідний Сіаму."
 SIA_use_ships_as_generators_desc:0 "Навіть старі судна ще можуть послужити нації, коли вони більше не придатні для бою чи торгівлі. Пришвартувавши кораблі як плавучі електростанції, ми зможемо забезпечити аварійною електроенергією порти та прибережну промисловість, зберігаючи при цьому дорогоцінне паливо та інфраструктуру."
