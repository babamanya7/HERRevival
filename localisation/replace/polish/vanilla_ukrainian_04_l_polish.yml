 mothership_equipment_desc:0 "Дуже великий літак, який несе до бою кілька винищувачів, що дозволяє досягти більшої відстані, ніж це було б зазвичай можливо. Авіаносець неба."
 motorbike_equipment_desc:0 "Швидкі та багатоцільові, військові мотоцикли часто оснащуються колясками та встановленими кулеметами, щоби служити в якості розвідки, зв'язку та підрозділів швидкого реагування."
 motorized_rocket_brigade_desc:0 "Реактивна артилерія дозволяє використовувати більші установки з безліччю ракет, які можуть швидко змінити дислокацію після удару."
 motorized_rocket_equipment_1:0 "$motorized_rocket_equipment$"
 mtg_britain.102.a:0 "Вони не бачать майбутнього..."
 mtg_britain.103.a:0 "Епохальна подія для імперії!"
 mtg_britain.11.t:0 "Вищі верстви налаштовані проти шлюбу"
 mtg_britain.12.t:0 "Робітничий клас підтримує шлюб"
 mtg_britain.15_tt_2:0 "Ми залишимося разом із британцями, навіть якщо Едуард VIII одружиться на Уолліс Сімпсон.\n"
 mtg_britain.33.t:0 "Політичне насильство переростає у громадянську війну"
 mtg_britain.36.b:0 "Ми не збираємося завдавати удару в спину союзникові."
 mtg_britain.51.t:0 "[From.GetName] відкидає пропозицію"
 mtg_britain.57.d:0 "Хід в області [ENG_blackshirt_march_state.GetName] пройшов з грандіозним успіхом; протести звелися до мінімуму, а наші чорносорочники поводилися зразково. Зростання популярності, до якого призвело успішне хода, дозволило нам у свого руху."
 mtg_britain.60.t:0 "Мослі висловлюється проти держави [GER.GetName]"
 mtg_britain.71.a:0 "Вони знають, що краще для них."
 mtg_britain.71.t:0 "[From.GetName] відступає"
 mtg_britain.73.b:0 "Це не варто війни."
 mtg_britain.74.a:0 "Час визнати їхню незалежність."
 mtg_britain.76.a:0 "Отже, ми проллємо кров."
 mtg_britain.77.a:0 "Час визнати їхню незалежність."
 mtg_britain.82.d:0 "Протягом двох наступних місяців представники уряду Великої Британії та домініонів обговорюватимуть у Лондоні питання, що стосуються всієї імперії. Це чудова можливість торкнутися таких тем, як оборона, торгівля або політика примирення. І це найкраща можливість для імперії пережити поточна криза.\n\nКрім того, це може виявитися найкращим моментом для обговорення питання федералізації імперії, яке неодноразово піднімалося на попередніх конференціях, хоч би який шлях вибрала для себе імперія — асоціація слабо пов'язаних між собою, незалежних і суверенних націй— у будь-якому випадку вона повинна залишатися сильною перед глобальними випробуваннями, і це вирішиться в наступні місяці."
 mtg_britain.82_tt:0 "Показник думки буде видалений після закінчення конференції. Чим вище думка учасників, тим вірогідніше, що вони погодяться з вашими пропозиціями.\n"
 mtg_britain.87.d:0 "Якщо імперія збирається процвітати, ми мусимо розширити вже наявні угоди про торгові привілеї. Ми пропонуємо домініонам збільшити свій експорт до індустріального центру, тобто до Великої Британії, щоби ми могли ефективно збільшити продуктивність."
 mtg_britain.89.a:0 "Разом ми досягнемо процвітання."
 mtg_britain.93.t:0 "Імперська конференція: економіка — [From.GetName] погоджується"
 mtg_exile_leader_added.1.a:0 "Ваша боротьба ще не закінчена."
 mtg_netherlands.49.t:0 "Принц Бернард допомагає виробити стратегію"
 mtg_netherlands.58.d:0 "Схоже, на нещодавній зустрічі з відомими іноземними діячами принц Бернард влаштував щось на кшталт дипломатичного скандалу. [HOL_bernhard_row_target.GetAdjective] представники звинуватили його у втручанні в їхні внутрішні справи, причому в самих."
 mtg_netherlands.60.a:0 "Побачимо, що буде далі."
 mtg_netherlands.62.d:0 "[From.GetAdjective] уряд пішов назад і повністю зняв з принца Бернарда всі звинувачення. Поки ще невідомо, чи справді він втручався в їхні внутрішні справи чи ні, але принаймні зараз йому краще не залучати до собі зайвої уваги цьому фронті."
 mtg_netherlands.66.d.b:0 "Британці розширили свій вплив на державу [HOL.GetNameDef] настільки, що [HOL.GetAdjective] уряд тепер змушений давати їм сприятливі умови в торгових переговорах."
 mtg_netherlands.79.d:0 "[From.GetAdjectiveCap]і представники повідомили, що не бачать необхідності в об'єднанні країн Бенілюксу. Вони продовжать співпрацювати з нами, але збережуть при цьому свій повний суверенітет."
 mtg_news.1.t:0 "Друга громадянська війна в США"
 mtg_news.23.a:0 "Ці випробування тільки загартують нас."
 mtg_news.3.g_tt:0 "Їхня гарантія нас §Rне§! впливає на це!"
 mtg_news.31.a:0 "Це необхідний захід."
 mtg_news.31.b:0 "Та як вони посміли!"
 mtg_news.36.a:0 "Ми вітаємо рівних собі з розпростертими обіймами."
 mtg_news.38.t:0 "[From.GetName] кидає виклик [SOV.GetAdjective]ому соціалізму"
 mtg_news.47.b:0 "Відчайдушний ризик."
 mtg_news.50.desc:0 "Новий [From.GetAdjective] уряд швидко дотримався своїх обіцянок дати незалежність різним територіям, що досі входять до [From.GetAdjective] колоніальної імперії.\n\nЦі держави негайно отримають повну незалежність, а Королівська нідерландська ост-індійська армія (КНОА) буде передислокована для посилення [From.GetAdjective] континентальної європейської армії."
 mtg_news.56.b:0 "«Помста за Бостонське чаювання»?! Ви серйозно?!"
 mtg_usa_canadian_corridor.3.b:0 "Ми не можемо дозволити собі війну з купою каміння та дерев."
 mtg_usa_civil_war_democrats.40.a:0 "Відчайдушні часи вимагають відчайдушних заходів."
 mtg_usa_civil_war_fascists.10.t:0 "Напад на склад зброї"
 mtg_usa_foreign_support.4.b:0 "Надіслати польові знаряддя"
 mtg_usa_secure_asia.2.a:0 "Чудово."
 mtg_usa_strategic_interests.1.t:0 "США вимагає території"
 mutiny_event.8.t:0 "Brother against Brother"
