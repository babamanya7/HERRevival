 neo_mesopotamia_DEF:0 "Месопотамія"
 netherlands_has_no_colonies_tt:0 "§YНідерланди§! або будь-який їхній суб'єкт не володіють своєю початковою §Yколоніальною територією§!."
 news.11.c:0 "Бессарабія наша!"
 news.115.d:0 "Італійські війська успішно штурмували Лондон, і тепер триколор майорить над Баштою Вікторії. Дрібні сутички ще тривають, і сьогодні вранці кілька берсальєрів були підстрелені снайперами, які засіли на Біг-Бені. Три спроби вибити їх звідти закінчилися невдачею, після чого вежа була підірвана. Італійські офіційні особи назвали це «прикрою гарячістю» місцевого командувача."
 news.122.d:0 "Владивосток, найбільше місто на Далекому Сході, база радянського тихоокеанського флоту, був захоплений японськими військами. Стратегічна позиція міста як кінцевого пункту Транссибірської магістралі робить його втрату ще більш чутливою для СРСР.\n\nЖителі міста пам'ятають японську окупацію часів громадянської війни. Цього разу багато хто побоюється, що загарбники не підуть ніколи."
 news.14.t:0 "[SOV.GetNameDefCap] анексовує державу [TAN.GetNameDef]"
 news.149.d:0 "Уперше, відколи Гібралтар був захоплений англійцями два століття тому, він знову став іспанським. За новинами, гарнізон, що охороняв місто, здався, хоча окремі групи ще ведуть бої в тунелях під Скелею.\n\nНа прес-конференції в Мадриді представник уряду заявив, що «відтепер і назавжди» Гібралтар залишиться іспанською територією. Британські дипломати, зрозуміло, охрестили це твердження «цілковитою нісенітницею»."
 news.158.a_usa:0 "Ми мусимо зберегти мир."
 news.170.d_ITA_BUL:0 "Запевняючи, ніби вона прагне міцного миру на Балканах, Німеччина змусила грецький уряд поступитися державам [BUL.GetName] і [ITA.GetName] всіма оспорюваними територіями. Враховуючи сильний [GER.GetAdjective]ий вплив на Балканах та грізних сусідів з боку Італії та Болгарії, [GRE.GetLeader] не бачить іншого виходу, крім як поступитися вимогам."
 news.172.b:0 "Ще один тріумф."
 news.180.t:0 "Францію вітають в Комінтерні!"
 news.183.a:0 "Як вони посміли!"
 news.19.e:0 "Добре, що вони вклоняються своїм господарям!"
 news.196.t:0 "[From.GetName] підбуює революціонерів"
 news.198.b:0 "[SOV.GetNameDef] як розпалювачі війни мають бути зупинені!"
 news.199.t:0 "[?SOV.former_controller_of_bessarabia.GetNameDefCap] передає Бессарабію державі [From.GetNameDef]"
 news.200.f:0 "Чудова новина, коли [Root.GetLeader] повернеться з відпустки в Мюнхені!"
 news.201.a:0 "Новий уряд Туреччини забезпечує нашу конкурентоспроможність у Середземномор'ї."
 news.203.d:0 "Після пред'явлення [GER.GetAdjective]ого ультиматуму державі [From.GetNameDef], [From.GetLeader] та [From.GetAdjective]ий уряд вирішили виконати всі вимоги, а не йти на війну.\n\nВони сподіваються, що з втратою Данцигу [From.GetNameDef] буде убезпечений від подальших територіальних амбіцій Німеччини. Однак ситуація залишається напруженою, і показовим є той факт, що польські прикордонні війська досі не отримали наказу відступити"
 news.204.d:0 "З огляду на вимоги, це здавалося неминучим.\n\n[From.GetNameDef] буде змушений віддати Данциг Німеччині, а польський уповноважений буде відправлений до Берліна для переговорів про подальші умови. [From.GetLeader] вказав на нещодавні дії [GER.GetNameDef], заявивши, що очевидно, що Німеччина не задовольниться лише Данцигом.\n\nНімецькі та польські війська готуються до війни, і вже надходять повідомлення про зіткнення на кордоні. Війна знову прийшла у Європу."
 news.205.b:0 "З миром удома, США зможе зосередитися на наших зовнішніх ворогах."
 news.210.t:0 "Японія змінює уряд у Китаї"
 news.216.t:0 "[TUR.GetName] опирається [GER.GetName]ому ультиматуму."
 news.23.a:0 "Скільки ще [ALB.GetNameDef] зможе опиратися?"
 news.232.t:0 "[GER.GetNameDefCap] шукає підтримку Скандинавії"
 news.237.d:0 "Після успішного державного перевороту, здійсненого місцевою нацистською партією в [From.Root.GetNameDef], німецькі війська перетнули кордон і встановили контроль над країною.\n\nНімецьких солдатів зустрічали радісні натовпи в містах, коли вони поспішали через всю країну, щоб приєднатися до [From.Root.GetAdjective], який брав участь у громадянській війні, що тривала. [GER.GetLeader] оголосив про аншлюс Австрії і підкреслив:\n\n«Боротьба народу скоро закінчиться! Найстаріша східна провінція німецького народу віднині буде найновішим бастіоном [GER.GetNameDef]!»"
 news.238.c:0 "Ми нарешті маємо засоби, необхідні для захисту континенту."
 news.248.d:0 "\nПісля посилення дипломатичного тиску з боку [CAN.GetNameDef], [ENG.GetNameDef] передала території Лабрадору та Ньюфаундленду [CAN.GetAdjective]ій владі. Метою [CAN.GetAdjective]их політиків вже давно було «об'єднати всю законну [CAN.GetAdjective]у територію», і тепер ця мета стала на крок ближчою до виконання.\n\nЗвісно, без відповіді залишається питання, що є «законно [CAN.GetAdjective]ою» територією. І [ENG.GetNameDef], і весь північноамериканський континент відтепер спатимуть з розплющеними очима."
 news.250.a:0 "Тривожний конфлікт, який може спустошити Мексику."
 news.251.f:0 "Від моря до моря, [CAN.GetNameDef] буде вільною!"
 news.262.desc:0 "Довготривала напруженість у [SAF.GetName] переросла у відкриту війну. Фашистські націоналісти стверджують, що політика демократичного юніоністського уряду загрожує способу життя [SAF.GetAdjective]. Вони кажуть, що юніоністи наносять удар у спину хоробрим воїнам англо-бурських воєн своєю беззастережною підтримкою [ENG.GetName].\n\nНаціоналістичний Тимчасовий уряд під керівництвом [SAF.GetLeader] закликав усіх справжніх патріотів приєднатися до них у відновленні свободи Південної Африки силою зброї. Юніоністський уряд у Преторії назвав націоналістів «повстанцями і зрадниками найгіршого ґатунку». Зважаючи на те, що військові сили однаково заявлені з обох сторін, конфлікт у Південній Африці може затягнутися на довгий час."
 news.272.c:0 "З цим нічого не поробиш."
 news.289.f:0 "Наш альянс міцнішає."
 news.291.desc:0 "За наполяганням угорців Австрія провела референдум щодо можливого возз'єднання двох націй під короною Габсбургів. Остаточний підрахунок голосів майже завершено, але вже зараз зрозуміло, що це переконлива перемога прихильників возз'єднання. Не було зафіксовано жодних порушень у процесі голосування, і австрійський уряд був змушений реформуватися в регіональний уряд угорської держави.\n\nХоча угорська громадськість щиро вітає цей крок, політичні наслідки референдуму, ймовірно, будуть гостро відчуватися в усій Європі."
 news.302.c:0 "Тупоголові дурні..."
 news.304.desc:0 "[From.GetName] офіційно визнала [HUN.GetAdjective]і вимоги щодо повернення Південної Словаччини і вже зробила поспішні кроки для того, щоб забезпечити негайне повернення цієї території Угорщині. Малоймовірно, що цей успіх утримає [HUN.GetAdjective]ий уряд від подальших вимог щодо решти втрачених територій."
 news.31.a:0 "Цікаво."
 news.316.desc:0 "Поляки і румуни оголосили про відновлення зобов'язань щодо захисту один одного. Хоча гарні відносини між двома країнами існують вже більше десяти років, сьогоднішня заява свідчить про те, що політика взаємної оборони все більше домінує у військовому плануванні як у Польщі, так і в Румунії."
 news.317.t:0 "Санітарний кордон"
 news.324.desc:0 "Зіткнувшись з румунськими вимогами «радикальної реструктуризації» своєї держави та загрозою застосування військової сили в разі відмови, Югославія не бачила іншого виходу, окрім як підкоритися. Оголошена «реструктуризація», однак, призвела не лише до розділу Югославії на складові держави, але й до встановлення маріонеткових урядів.\n\nОчевидно, що під приводом права на самовизначення обслуговувалися переважно румунські інтереси, і що румунський вплив в регіоні продовжує зростати."
 news.333.desc:0 "Учора, британські військово-морські підрозділи заблокували свої французькі колеги на важливих військово-морських базах у Північній Африці, висунувши французам ультиматум: негайно відплисти до британських портів і здати контроль над своїм флотом, інакше британці відкриють вогонь по їхньому колишньому союзнику. Після того, як французи відхилили британські вимоги, відбулася перестрілка, в результаті якої було потоплено щонайменше один французький лінкор і серйозно пошкоджено значну частину французького флоту."
 news.334.d:0 "Сьогодні [USA.GetAdjective]і та [ENG.GetAdjective]і канонерські човни були атаковані [JAP.GetAdjective]ими літаками під час евакуації західного цивільного населення з лінії фронту у війні між [JAP.GetName] та [CHI.GetName]. Незважаючи на те, що він був чітко позначений як судно [USA.GetAdjective], USS Panay був уражений двома бомбами і потоплений, в результаті чого троє [USA.GetAdjective]их і один [ITA.GetAdjective]ий громадянин були вбиті, а інші поранені. Під час окремої атаки на HMS Ladybird загинув один [ENG.GetAdjective]ий моряк.\n\n[USA.GetAdjective]ий і [ENG.GetAdjective]ий уряд висловили рішучі протести. Цей інцидент підкреслює зростаючу напруженість у відносинах між трьома провідними військово-морськими державами."
 news.337.d:0 "Імперія раса Алули відроджена!"
 news.350.b:0 "Це, безумовно, новий початок."
 news.39.d:0 "СРСР поширив фотографії трупа Льва Троцького, підтвердивши тим самим інформацію про те, що він був убитий при спробі таємно проникнути в [SOV.GetNameDef]. Тіло винесло на берег річки Атрек на радянсько-перському кордоні. Мабуть, Троцький збирався скористатися прийдешньою смутою в СРСР і знайти союзників, щоб влаштувати переворот і усунути свого давнього суперника Сталіна."
 news.43.t:0 "Інцидент на «Гінденбурзі»"
 news.46.d:0 "Дирижабль «Гінденбург» сьогодні зазнав драматичного кінця, вибухнувши над Шотландією.\nСхоже, він був захоплений заступником фюрера Рудольфом Гессом, якому вдалося самостійно пролетіти Північне море з особистою місією: домовитися про мир з Великою Британією.\nБританські радіолокаційні станції без проблем виявили масивний об'єкт, і кілька крил Королівських ВПС були негайно відіслані до його позиції. Коли «Гінденбург» не відповів по радіо, вони відкрили вогонь.\n\nГесс вистрибнув з парашутом, і тепер він ув'язнений у Лондонському Тауері."
 news.49.a:0 "Велике досягнення!"
 news.60.a:0 "Ось вам і мир."
 news.66.d:0 "Нещодавно в Берліні, Німеччина, пройшли одинадцяті Олімпійські ігри.\n\nЛітні Олімпійські ігри 1936 року, в яких брали участь спортсмени з 49 різних країн світу, були першими в історії, які частково транслювалися по телебаченню. Ігри були значною перемогою пропаганди німецького режиму, який вклав у них великі кошти.\n\nНайбільшого успіху досягли німецькі спортсмени, здобувши 33 золоті медалі, тоді як американці посіли друге місце з 24 медалями. Чотири з них отримали Джессі Оуенс, найуспішніший спортсмен Ігор."
 news.66.t:0 "XI Олімпійські ігри"
 no_focus_on_training_spirit_desc:0 "Практика? Нащо нам це? Це ж легко! Та ще й пальне зберігає."
 no_garrison:0 "Немає гарнізону"
 nsb_coup.3.desc:0 "Минулої ночі після декількох тижнів планування група офіцерів наказала виконати план, відомий як [Root.GetOperationName], із захоплення контролю над урядом.\n\nСхоже, що реалізація плану була розпочата передчасно, — події швидко вийшли з-під контролю [Root.GetLeader] уникнув і вбивства, і арешту, а мережа блокпостів навколо столиці не встигла розвернутися вчасно, і багато членів уряду змогли врятуватися.\n\nУряд держави [Root.GetNameDef] вистояв, і [Root.GetLeader] обіцяє будь-що покарати зрадників."
 nsb_news.1.t:0 "Повстання селян у місті [peasant_poland_target.Capital.GetName]"
 nsb_news.2.b:0 "Особисто я вітаю наших нових польських правителів."
 nsb_news.2.c:0 "Ліберія — це тільки початок."
 nsb_news.403.c:0 "Скоро вони побачать перевагу сильної руки."
 nsb_news.5.a:0 "Хай живе король!"
 nuclear_reactor_pl_gen:0 "ядерних реакторів"
 nyim_of_kuba:0 "Ньїм Куби"
 o_achse:0 "План «Вісь»"
 object_to_attaches:0 "Претензії щодо аташе"
 old_guard:0 "Стара гвардія"
 operation_steal_tech_navy:0 "Вкрасти флотські креслення"
 operation_zet_desc:0 "Японські фашисти розв'язали війну з метою завоювання всього Китаю. Зрозуміло, що це повністю суперечить інтересам Радянського Союзу. Ми мусимо допомогти китайцям. Можливо, імператорську армію Японії вдасться залучити до виснажливої операції, яка завадить їй будувати інші плани."
 operation_zet_jap:0 "$operation_zet_chi$"
 operational_integrity_tree:0 "Доктрина оперативної цілісності"
 org_loss_when_moving_tt:0 " $MODIFIER_ORG_LOSS_WHEN_MOVING$: $RIGHT|-=%1$"
 oriental_development_company:0 "Oriental Development Company"
 osaka_army_arsenal:0 "Армійський арсенал в Осаці"
 overbearing_army_spirit:0 "Владна армія"
 panay_incident.2.b.tt:0 "Наша вимога буде передана японському уряду, і ми чекатимемо відповіді.\n\n"
 panzer_leader_short:0 "Бронетанк. лідер"
 paratroopers2_desc:0 "Перехід від невеликих операцій за участю лише кількох десантників до використання дивізій дозволив здійснювати масштабні вторгнення з повітря. Ці війська перетворилися з дива на невід'ємну частину бойових дій."
 pavel_events.1.desc:0 "Тепер, коли всю долину Дону контролюють [Root.GetLeader] та [Root.GetLeader.GetHerHis] війська, у нас є можливість відродити Донську республіку і запросити її лідерів повернутися, щоби ті знову вели донських козаків у бій із червоними!\nЗалишається єдине питання: чи можна довіряти Війську Донському настільки, щоб оголосити його незалежною нацією, чи воно має стати маріонетковим урядом, яким керує [Root.GetLeader]?"
 pocket_defence_desc:0 "Може статися, що наші війська, що обороняться, опиняться в «котлі». У цьому випадку вони мусять протриматися доти, доки їх не витягнуть звідти в ході неминучого контрнаступу."
 poland.1502.a:0 "[Root.GetNameDef] та [From.GetNameDef] будуть єдиними!"
 poland.23.d:0 "[Root.GetAdjective]і війська входять в регіон [poland_state_withdrawn.GetName] і захоплюють контроль над залізницями та промисловими об'єктами — і тут ми з подивом виявляємо, що всі об'єкти заміновані. Очевидно, що таку пастку про нам [POL.GetAdjective]а армія і що подібного ми можемо очікувати скрізь, де спробуємо захопити [POL.GetAdjective]у індустрію."
 poland.26.d:0 "По всій Польщі, що знаходиться під [Root.GetAdjective]ою окупацією, ходять чутки про революцію, що назріває в підпіллі. На міських стінах розклеєні листівки «Niech żyje opor!» та інші гасла, що закликають повстати проти [Root.GetAdjective]ої влади. Донині діяльність спротиву обмежувалася поширенням пропаганди, шкідництвом на виробництві й іноді вибухами та саботажем, але тепер повстанці ведуть себе підозріло тихо, й атмосфера в Польщі переповнена підступністю та недовірою.\n[Root.GetAdjective]і агенти по всій Польщі передбачають повномасштабне повстання, яке фінансується [POL.GetAdjective]им урядом у вигнанні."
 political.12.a:0 "Ми станемо авангардом проти червоної загрози!"
 political.14.a.tt:0 "Уряд може організовувати вибори, коли політика отримує підтримку більшості."
 political.14.c:0 "Нам потрібен референдум."
 political.16.b:0 "Нехай народ буде почутий."
 political.17.b:0 "Реформи потребують ширшої підтримки, перш ніж вибори можна провести."
 political.23.b:0 "[Root.GetName] нарешті отримає свободу!"
 political.26.d:0 "Після кількох місяців гучної опозиції проти режиму [Root.GetLeader], закликів до публічних виборів і більш ліберальних законів про свободу зібрань і слова, рух, схоже, розпався. Люди тепер висловлюють більше занепокоєння щодо стабільності держави [Root.GetName] у випадку, якщо такі реформи відбудуться, а тих, хто кричить про демократію, вважають радше порушниками спокою, ніж кимось іншим.\n\nІще більш загадковим є те, що багато провідних діячів руху, схоже, зникли безвісти або раптово припинили свою роботу. Можливо, дехто з них вирішив піти в еміграцію, коли побачив, що їхні зусилля зазнали невдачі. Незважаючи на це, уряд партії [Root.GetRulingParty] заперечує будь-яку обізнаність і причетність."
 political.3.d:0 "Поки народний рух за комуністичну революцію був гучним і страхітливим, певна частина політичного руху була переважно тихою і вичікувальною. Тепер очікування закінчилося. Сьогодні, коли керівництво та армія партії [Root.GetRulingParty] готувалися до повстання в національному масштабі, декотрі чиновники в [Root.GetAdjective]ому уряді швидко помістили [Root.GetLeader] під домашній арешт і вступили в переговори з повстанцями.\n\nЗберігаючи вигляд охорони порядку, ці переговори фактично зводилися до того, щоби забезпечити посади в новій соціалістичній державі для тих, хто вирішив співпрацювати. Переворот було завершено до того, як хтось встиг зробити крок із метою зупинити його, а ті, хто міг би це зробити, зараз ув'язнені, заслані або страчені новим режимом."
