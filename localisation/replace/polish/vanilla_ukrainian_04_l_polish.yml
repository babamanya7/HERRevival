 SOV_infantry_at:0 "ПТРД"
 SOV_influence_army_opposition_desc:0 "Проникнення в армію означає, що тепер ми можемо почати знаходити офіцерів і рядових, які симпатизують нашій справі, і переконатися, що вони стануть на наш бік, якщо почнеться війна."
 SOV_into_central_asia_desc:0 "Завоювання Центральної Азії зробить нас здатними загрожувати Індії, а також забезпечить нам доступ до Перської затоки. Стратегічна необхідність очевидна, і наша імперія не знайде тут свого могили."
