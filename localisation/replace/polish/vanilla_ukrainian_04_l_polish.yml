 SIA_a_race_against_time:0 "Гонка з часом"
 SIA_artillery_reigns_supreme_desc:0 "Сучасна битва не виграється лише бойовим духом. Гармата залишається королем поля бою, розбиваючи опорні пункти, розтрощуючи атаки і прокладаючи шлях для нашої піхоти. Якщо ми хочемо тріумфувати, вогнева міць [ROOT.GetAdjective] має стати рясною та точною."
 SIA_ascend_the_throne_desc:0 "Роки регентства не можуть тривати вічно. Ананда досяг повноліття, щоб самостійно взяти на себе тягар королівської влади, і його формальне сходження на престол дозволить відновленій монархії перейти від опіки та інтриг до нового і легітимного правління."
 SIA_chairman_of_the_tobacco_bonopoly_bureau:0 "Голова Бюро тютюнової монополії"
 SIA_charun_rattanakun_seriroengrit:0 "Чарун Раттанакун Серіренгріт"
 SIA_death_to_the_communists_desc:0 "Поразка військової кліки не повинна відкрити двері для іншої тиранії. Комуністичні агітатори вірять, що криза послабила державу. Незабаром вони дізнаються, що цивільна демократія не є беззахисною."
 SIA_deficit_spending_tt:0 "Коли час дії духу вичерпається, ви отримаєте: "
 SIA_destroyer_1_desc:0 "The Phra Ruang was a former British R-class destroyer that was sold to The Royal Thai Navy in 1920. The ship displaced just over 1,000 tons and was armed with three 120mm/45 QF Mk IV guns and four 533mm torpedo tubes. They had good speed, range, and reliability for their vintage."
