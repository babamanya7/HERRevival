 FRA_revive_the_franco_polish_alliance:0 "Відродити французько-польський альянс"
 FRA_scw_intervention_nationalists_SPR:0 "Націоналістична інтервенція"
 FRA_scw_intervention_republicans_focus:0 "Втручання в громадянську війну в Іспанії"
 FRA_submarine_3_desc:0 "Підводні човни типу Roland Morillot (назва проєкту Z2) були великими океанськими підводними човнами, заснованими на попередніх підводних човнах класу Redoubtable. Це були великі підводні човни водотоннажністю 1800–2400 тонн і несли потужне озброєння з 10 торпедних апаратів. Падіння Франції відбулося до того, як усе було завершено."
 FRA_support_weapons4:0 "Hotchkiss M1922 & Brandt Mle 1942"
 FRA_surface_combat_desc:0 "Завдяки прогресу в артилерії стало майже неможливим побудувати корабель, який міг би сподіватися витримати тривалий поєдинок із іншим великим судном. Набагато краще мати флот сучасних есмінців і торпедних катерів, щоби здолати противника масованими залпами торпед."
 FRA_the_blum_viollette_proposal:0 "Проєкт Блюма–Віоллетта"
 FRA_the_council_of_rambouillet:0 "Рада Рамбує"
 FRA_the_council_of_rambouillet_desc:0 "Коли в країні панує неспокій, люди шукають сильного лідера. Стало зрозуміло, що республіканізм підвів французький народ, і настав час повернутися до природних правителів Франції. Але спочатку треба закласти основу для відновлення монархії."
 FRA_transport_plane_equipment_1:0 "Farman F.221"
 FRA_womens_suffrage_desc:0 "Настільки абсурдно, як і ганебно, що працьовитим жінкам Франції, які раз у раз воювали на барикадах, щоби заслужити свої права, не дозволяють голосувати на виборах. Ми викорінимо цю несправедливість."
