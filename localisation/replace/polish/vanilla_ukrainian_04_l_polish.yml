 ETH_military_advisors_desc:0 "Хоча багато наших офіцерів пристосувалися до вимог сучасної війни, очевидно, що їм здебільшого доводиться імпровізувати якомога краще. Ми могли б багато чого навчитися у наших бойових товаришів [SOV.GetAdjective]."
