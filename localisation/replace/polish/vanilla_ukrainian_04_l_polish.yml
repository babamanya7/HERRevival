 lar_align_belgium.3.desc:0 "Замість того щоби відповісти на нашу ноту дипломатичними каналами, [From.GetAdjective]ий уряд наказав привести свої війська в повну бойову готовність і закрив кордон. Хоча брюссельські газети реалістично оцінюють ймовірність перемоги, їх статті битві при Ватерлоо і пророкують французьким військам принизливу поразку в тому випадку, якщо ми вирішимо напасти."
 lar_communist_uprising_organize_strikes_desc:0 "Наш агент зв'яжеться з профспілками та політично надійними людьми, які працюють у ключових галузях індустрії, і допоможе їм організувати страйки, хід яким буде дано з початком війни."
 lar_fra_join_the_ententes.3.a:0 "Недалекоглядні дурні!"
 lar_france_political_violence.2.desc:0 "Коалиція профспілок та інтелігенції закликала влаштувати в столиці «День дії» у відповідь на нещодавні політичні рішення. Незважаючи на спроби стримати демонстрацію, невеликі групи анархістів та радикально налаштованих комуністів пробували розпалити бунт. В результаті були розграбовані магазини та перевернуті трамваї. Спроби протестувальників спорудити на Рю-Рояль барикади, блокуючі доступ до Національних зборів, були зупинені кінною поліцією.\n\nПісля того, як протестувальники у всій Франції розійшлись та повернулись до своїх станків, багато хто в країні почав задумуватися, чи здатний уряд підтримувати закон та порядок."
 lar_intervention_in_greece.1.t:0 "Франція пропонує втручання в Грецію"
