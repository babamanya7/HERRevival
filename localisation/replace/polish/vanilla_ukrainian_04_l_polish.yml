 BUL_balkan_federation_democratic:0 "Ліга балканських конфедерацій"
 BUL_balkan_federation_project_propaganda_desc:0 "Народна підтримка нового болгарського проєкту Балканської федерації швидко поширюється завдяки кампанії пропаганди по всій нашій країні, що фінансується болгарським урядом."
 BUL_brannik:0 "Бранник"
 BUL_built_ships:0 "Болгарські кораблі збудовані"
 BUL_bulgarian_academy_of_sciences_name:0 "Болгарська академія наук"
 BUL_bulgarian_administration_of_the_balkans_desc:0 "Щоб посилити наші претензії на Балкани, ми мусимо здійснити болгарську інтеграцію окупованих регіонів, щоб після перемоги [GetGermanFactionNameDef] війні [GetGermanOrIndependent] міг побачити болгарську природу цих територій і не наважився зламати нашу національну цілісність, як це зробили британці в 1878 році."
