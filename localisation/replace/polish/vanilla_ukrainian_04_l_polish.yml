 NZL_rail_standardization_desc:0 "В [ROOT.GetName] є низка майстерень по всій країні, які виготовляли локомотиви різної якості. Щоб зробити залізничну систему ефективнішою, ми встановимо кілька стандартних локомотивів для їхнього виробництва, кожен із яких спеціалізуватиметься на конкретних цілях."
 NZL_railways_board_desc:0 "Урядову раду залізниць було створено в 1931 році в результаті реструктуризації Департаменту залізниць з метою відокремити процес прийняття рішень від урядових відомств. Однак з моменту її створення майже не спостерігалося покращення залізничної мережі. Зростає тиск на уряд з вимогою скасувати раду та повернути прямий контроль."
