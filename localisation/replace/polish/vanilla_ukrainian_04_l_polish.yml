 SOV_soviet_civil_war_name:0 "Громадянська війна в СРСР"
 SOV_start_infiltrating_state_tt:0 "Починається робота по створенню комірки в [FROM.GetName]"
 SOV_strengthen_the_trade_unions_desc:0 "Під керівництвом Сталіна профспілки перетворилися з інструменту представництва робітників проти керівництва на інструмент маніпулювання робітниками. Хоча це може здатися одним із його менших злочинів, він повністю перевернув ідею демократичного самоврядувння робітників догори дригом і фактично позбавив робітників можливості скористатися плодами революції."
 SOV_superior_war_machines:0 "Передові бойові машини"
 SOV_system_decentralization_idea:0 "Децентралізація системи"
 SOV_the_declaration_tt:0 "§Y$SOV_patriarch_sergy$§!, §Y$SOV_metropolitan_nikolay$§! та §Y$SOV_metropolitan_aleksy$§! стануть доступні як радники."
 SOV_the_faithful_servant_of_lenin_desc:0 "Ленін залишив нам найбільше завдання у світовій історії: Побудувати суспільство, в якому всі люди дійсно рівні, суспільство без гноблення, страждань і матеріальних потреб. Не може бути кращої людини для втілення цього бачення, ніж товариш Сталін, який був з Леніним на кожному кроці цього шляху і який зараз готовий виконати обіцянку, дану під час революції."
 SOV_the_glory_of_the_red_army_name_exiles:0 "Імперськ"
 SOV_the_hands_do_desc:0 "Час настав. Ми повинні присвятити себе цій святій справі: прибрати радянську систему влади з нашої батьківщини. Щоб наші діти могли одного дня звільнитися від примари комунізму."
 SOV_the_politburo_good_dynamic_modifier:0 "Політбюро"
 SOV_the_red_fleet_surface_1_dynamic_modifier_alt:0 "$SOV_the_red_fleet_dynamic_modifier_alt$"
 SOV_the_socialist_bulwark:0 "Оплот соціалізму"
 SOV_the_stalin_constitution_mission:0 "$SOV_the_stalin_constitution$"
 SOV_the_workers_dictatorship_desc:0 "Вся влада в нашому Союзі мусить у кінцевому рахунку належати робітникам. Ми не можемо дозволити собі розколотися на фракції, і тому мусимо забезпечити, щоб воля робітників завжди була виражена в рішеннях Політбюро."
 SOV_the_zinovyevite_terrorist_center_desc:0 "Вбивство товариша Кірова в 1934 році показує, що є члени партії, які явно готують змову проти товариша Сталіна та Союзу в цілому. Ми отримали зізнання від кількох співучасників змови, що свідчить про причетність до неї ще кількох людей. Цю зінов'євську змову — без сумніву, організовану Троцьким або західними агентами (можливо, вони навіть працюють разом) — необхідно вирізати, як ракову пухлину, перш ніж вона пошириться."
 SOV_third_five_year_plan_desc_alt:0 "Ми розробили національну програму індустріалізації, яка дозволить нам збільшити як військове, так і цивільне виробництво в довгостроковій перспективі, без необхідності пригнічувати населення або ставити під загрозу його базові потреби."
 SOV_transpolar_flights_desc:0 "Наші найсміливіші пілоти тільки починають доводити, що сміливі маршрути через Арктику можливі. Використовуючи такі несподівані короткі шляхи при плануванні повітряної війни, ми зможемо здивувати ворога."
 SOV_ultimatum_baltic_effects_tt:0 "Ця подія змусить державу §Y[FROM.GetFlag][FROM.GetNameDef]§! бути інтегрованою у державу §Y[ROOT.GetNameDef]§! ([FROM.GetNameDefCap] все ще може відмовити)"
 SOV_victory_over_devastation_desc:0 "Колективні зусилля нашого народу дозволили нам рухатися вперед від руйнувань, спричинених громадянською війною. Швидкість, з якою відбудовувалася країна, назавжди залишиться пам'ятником майстерності та відданості наших робітників."
 SPA_activate_murcia_fifth_columnists:0 "Задіяти п'яту колону у Мурсії"
 SPA_adopt_the_26_points_desc:0 "Зручно видаливши застереження проти злиття політичних партій із «27 пунктів» Фаланги, отримані «26 пунктів» стали хорошим партійним маніфестом, який ми можемо запозичити для натхнення щодо політики уряду."
 SPA_banish_the_party_leaders:0 "Вигнати лідерів партії"
 SPA_claim_west_africa_desc:0 "Панування Франції в Західній Африці абсолютно незаслужене. Ця територія утворює природний географічний зв'язок із нашою колонією в Екваторіальній Гвінеї, і тому її слід вважати невід'ємною частиною Іспанської колоніальної імперії."
 SPA_cordoba_offensive:0 "Наступ у Кордові"
 SPA_defenses_against_strategic_bombing:0 "Оборона від стратегічного бомбардування"
 SPA_destroyer_1_desc:0 "The three destroyers of the Alsedo class were built for the Spanish Navy in Spain. They were based on the British L-class design, and were commissioned between 1924 and 1925. They displaced over 1,040 tons and had three 102mm/45 Vickers Mk LA guns as their main armament, as well as four 450mm torpedo tubes. They had decent speed and range for their vintage as well."
 SPA_directory_neutrality_DEF:0 "Іспанська директорія"
