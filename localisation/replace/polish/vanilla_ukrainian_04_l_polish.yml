 GER_send_military_aid:0 "Надіслати військову допомогу"
 GER_strengthen_the_proletarian_international_desc:0 "Робітники в сусідніх країнах піднімаються за свої права, і ми маємо унікальну можливість зміцнити свої позиції як надійного союзника. Запрошуючи новостворені комуністичні держави до Пролетарського Інтернаціоналу, ми зможемо стати ще сильнішими разом."
 GER_swedish_trade_agreement_desc:0 "Наша сталь низькоякісна, а для заправки нашої воєнної машини нам потрібен найліпший матеріал. На щастя, [SWE.GetName] на півночі є ідеальним партнером; доступні високоякісні ресурси, нейтральні і навряд чи спричинять багато проблем, коли наші майбутні плани матеріалізуються."
