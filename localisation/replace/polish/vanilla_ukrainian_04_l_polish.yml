 SEA_japan_popup_events.46.desc:0 "Після краху офіційного командування японської армії та громадянської війни, що вибухнула в Метрополії, наш колишній протекторат, відомий як Автономний уряд Східного Хебею, що лежить на південно-західному кордоні [MAN.GetNameDef], тепер залишається беззахисним. Тому вони вирішили завдати удару і забрати його, поки наш уряд має занадто багато інших проблем, щоб турбуватися про те, що відбувається на континенті."
