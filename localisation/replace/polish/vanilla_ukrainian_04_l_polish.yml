 FRA_BLITZKRIEG_DESC:0 "Велика війна ще свіжа в її пам'яті. Франція стикається з новим конфліктом після того, як Німеччина показала, що не має наміру зберігати мир. Посилення оборони кордону та мудрий вибір союзників цілком можуть стати для Франції способом уникнути катастрофічної війни.\n\nФранція колись перемагала, і цього разу не буде інакше!"
 FRA_EQUIPMENT_VERSION_2:0 "série B"
 FRA_army_reform:0 "Реформа армії"
 FRA_artillery_focus:0 "Grande Batterie"
 FRA_buy_time_desc:0 "Ми не готові протистояти німцям на полі. Наші союзники слабкі, наша армія застаріла. Можливо, нам доведеться пожертвувати, якщо хочемо вижити."
 FRA_capital_ship_focus_desc:0 "Удосконалення лінкорів дасть нам величезну тактичну перевагу. Якщо дальністю дії та міццю вони перевершуватимуть кораблі супротивника, ніхто не зможе піти з-під вогню їх знарядь."
 FRA_carrier_2:0 "Клас «Joffre»"
 FRA_carrier_3:0 "Клас «Jean Bart»"
 FRA_carrier_4_desc:0 "Авіаносець класу «Clemenceau» (назва проєкту PA-28) був першим післявоєнним авіаносцем французького флоту. Конструкція була б подібна до недобудованих авіаносців класу Joffre, хоча встановлене обладнання та озброєння були б сучасними французькими виробами. Придбання ескортних авіаносців USN і RN і економічний стан післявоєнної Франції запобігли закладці цих кораблів. Не плутати з останніми авіаносцями класу Clemenceau (проєктна назва PA-54), які були закладені в 1955 і 1957 роках."
 FRA_cv_CAS_equipment_3_short:0 "SO.8000 Narval"
 FRA_cv_fighter_equipment_0_short:0 "D.376"
 FRA_defensive_strategems:0 "Оборонні стратагеми"
 FRA_francois_darlan:0 "Франсуа Дарлан"
 FRA_freedom_front:0 "Фронт Свободи"
 FRA_heavy_bomber_focus_desc:0 "Сучасні важкі бомбардувальники мають бути досить добре озброєні, щоби постояти за себе у повітряному бою. Якщо наші конструктори розроблять нові технології, літакам стане простіше знищувати заводи супротивника."
 FRA_heavy_fighter_focus:0 "Акцент на важкі винищувачі"
 FRA_henry_freydenberg:0 "Анрі Фрейденбер"
 FRA_infantry_equipment_0_short:0 "Mle 1886 M93"
 FRA_infantry_tanks:0 "Піхотні танки"
 FRA_intervention_in_overseas_territories_desc:0 "Ті наші заморські території, які залишилися за урядом Віші, все ще можна повернути на наш бік. У нас є різні варіанти, залежно від місця, але деякі з них можуть мати наслідки в майбутньому."
 FRA_jacques_duclos:0 "Жак Дюкло"
 FRA_join_the_ententes:0 "Приєднатися до Антант"
 FRA_mechanized_focus_desc:0 "Роль бронемашин у війні стрімко зростає. Вони не такі грізні, як танки, зате куди більш маневрені у всьому, що стосується комунікацій, управління, мобільності та дій у міських умовах."
 FRA_national_regeneration_trigger_tt:0 "Об'єднана загальна підтримка нейтралів і фашистів перевищує 50%"
