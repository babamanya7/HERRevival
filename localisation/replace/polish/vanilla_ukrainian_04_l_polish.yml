 GER_can_delay_mefo_payment:0 "Можна відтягнути виплату за векселі «MEFO»"
 GER_carve_up_czechoslovakia_desc:0 "[CZE.GetAdjective] держава стоїть на заваді не лише нашим прагненням, але й прагненням наших союзників на півдні. Ми повинні розділити її між собою, щоб реалізувати Міттельєвропу."
 GER_case_yellow_belgium_luxembourg_desc:0 "Напад через лінію Мажіно є самогубством. Ми будемо обступати його з півночі й рухатися через Арденни, щоб обійти найважчі укріплення."
