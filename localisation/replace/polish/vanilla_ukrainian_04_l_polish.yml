 POL_com_independence:0 "Незалежність"
 POL_cv_CAS_equipment_1:0 "PZL.23 Karaś Floty"
 POL_cv_fighter_equipment_0:0 "PZL.11 Floty"
 POL_expand_northern_rail:0 "Розширити північні залізниці"
 POL_habsburg_events.102.desc:0 "Угорський уряд абсолютно не зворушений нашою вимогою зробити Отто фон Габсбурга королем Угорщини. Хоч наш ультиматум і провалився, тепер справа за армією."
 POL_habsburg_events.201.desc:0 "Схоже, що, незважаючи на наші сімейні узи, [From.GetNameDef] не хоче укладати союз із державою [Root.GetNameDef]."
 POL_heavy_tank_equipment_1:0 "27TP"
 POL_import_submarine_technology_desc:0 "Сучасна морська війна виграється як над хвилями, так і під ними, і якщо ми хочемо конкурувати з німецькими підводними човнами, ми повинні проєктувати і поширювати оригінальні польські підводні човни."
 POL_invest_anti_air:0 "Інвестувати в протиповітряні гармати"
