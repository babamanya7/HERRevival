 SWI_abandon_neutrality_desc:0 "По всій Європі боки перебирають, нас на плоскостопість не спіймають. Єдине очевидне рішення — відмовитися від нашої історичної нейтральної позиції та шукати захисту [SWI_get_fascist_neighbor] або ризикувати опинитися між молотом і ковадлом."
