 CHL_political_events.20.b:0 "Мармадюк Гроув Вальєхо"
 CHL_political_events.22.b:0 "Чому ми повинні піклуватися про Південну Америку?"
 CHL_political_events.29.t:0 "Чилійські фашисти хочуть нашої підтримки"
