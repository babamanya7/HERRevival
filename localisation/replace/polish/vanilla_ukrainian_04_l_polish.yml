 SWE_the_narvik_solution_desc:0 "Нарвік має вирішальне значення для транспортування нашої залізної руди, тому він став ціллю воюючих країн, які сподіваються захистити або зірвати ці транспортування. Щоб зберегти наш нейтралітет і наш експорт, ми повинні зменшити напругу в регіоні взявши на себе контроль над Нарвіком від імені [NOR.GetName]."
