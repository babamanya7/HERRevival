 SEA_warlords.58.b:0 "Їм доведеться брати [608.GetName] силою!"
 SEA_warlords.59.desc:0 "Нарешті настав час повернути втрачені території Фентяньської кліки. [608.GetName] тепер під нашим командуванням, і наш обов'язок з придушення бандитів у Шеньсі офіційно завершено. Скоро вся втрачена батьківщина знову буде під нашим контролем!"
