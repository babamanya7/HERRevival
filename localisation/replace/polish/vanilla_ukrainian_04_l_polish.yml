 JAP_enact_the_national_conscription_law_desc:0 "Було постановлено, що кожен придатний [ROOT.GetAdjective]ий чоловік має бути знайдений і призваний до армії. Ми повинні відправити вербувальників навіть у найвіддаленіші села, щоб ми могли швидко набрати більше людей."
 JAP_establish_showa_aircraft_idnsutry_desc:0 "Ми отримали запит на дозвіл заснувати Шьова Хікокі Когьо Кабушікі-гайшя в Акішімі, Токіо. Ця компанія бажає будувати військові літаки для наших збройних сил. Ми повинні схвалити їхній запит і доручити їм негайно розпочати роботу над забезпеченням нас авіаційною технікою."
