 ARMY_LEDGER_THRESHOLD_DEPLOYED_MANPOWER:0 "Армійські людські ресурси «в полі»"
 ARMY_NAVIES_DESTROYED_SHIP:0 "$SHIP_TYPE$ «$SHIP|H$» потоплений $KILLER_COUNTRY$им кораблем типу $KILLER_TYPE$ «$KILLER_SHIP|H$» під час бою в регіоні $REGION$ $DATE$."
 ARMY_RAILWAY_GUN_TOOLTIP_DETAILED_MULTIPLE_DESC:0 "У нас є $COUNT$ §Yзалізничних гармат§! в нашій армії."
 ARMY_UNIT_SUPPLY:0 "§TСтатус постачання:§! $VALUE|%0Y$"
 ASSIGN_UNITS_TO_FALLBACK_AG_ORDER:0 "Оберіть повну групу армій і §GCtrl + клацніть§!, щоби прикріпити всі військові частини без наказів армії до цьго наказу."
