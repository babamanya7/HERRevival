 DEN_trade_with_germany_desc:0 "[GER.GetNameDefCap] історично імпортувала велику кількість нашої сільськогосподарської продукції, і навіть Велика війна не зупинила цього. Але в останні кілька років торгівля між обома країнами скоротилася. Можливо, зараз саме час спробувати переломити цю тенденцію!"
