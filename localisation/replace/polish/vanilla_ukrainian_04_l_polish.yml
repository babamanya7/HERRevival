 FIN_crown_prince_of_finland_tt:0 "  - §YЗнижена вартість§! вимоги §YЗабрати область§! на мирних конференціях. Іще більше знижена вартість §Yестонських осердних земель§!."
 FIN_expand_air_bases_desc:0 "Оскільки напруга навколо [ROOT.GetName] зростає, ми повинні переконатися, що наші Сили оборони мають засоби для належної роботи.\nМи підтримуватимемо ВПС у їхньому зобов'язанні збільшити кількість авіабаз по всій країні, щоб гарантувати, що його пілоти здатні швидко розгортатися під час конфлікту."
 FIN_finnish_autonomy_desc:0 "Навіть деякі з найбільш відданих комуністів серед нас боялися, що співпраця з [SOU.GetNameDef] призведе до фактичного домінування Росії в нашій політиці. Але завдяки обережній дипломатії ми досягли рівня взаєморозуміння з нашими союзниками, який забезпечує наша автономія."
 FIN_finnish_learned_societies_desc:0 "Хоча багато інтелектуалів країни втекли за кордон, залишається значна кількість тих, хто мав мудрість прийняти соціалістичну думку. Ми повинні підняти цих інтелектуалів шляхом інвестицій у їхні дослідження."
