 OTHER_GATHERING_STORM_DESC:0 "Не всі держави світу, великі та малі, бажають сидіти затамувавши подих, чекаючи на спалах нового світового конфлікту. Від великих держав на межі громадянської війни до багатьох націй, сформованих і змінених Великою війною, — всім доведеться прийняти складні рішення та втримати баланс із прагматизмом, щоб якось вплинути на майбутнє світу."
