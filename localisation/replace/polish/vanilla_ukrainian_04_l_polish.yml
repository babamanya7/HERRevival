 PHI_encourage_foreign_investment:0 "Заохочувати іноземні інвестиції"
 PHI_filipino_polynesian_reunification:0 "Володарі Тихого океану"
 PHI_filipino_repatriation_act_desc:0 "Відповідно до Закону Тайдінгса-Макдаффі, який спрямував Філіппіни на шлях до незалежності, було додано пункт, що суворо обмежував в'їзд філіппінців до Сполучених Штатів. Ми не хочемо, щоб сім'ї були розділені, тому запропонуємо безкоштовну подорож в один бік назад на Філіппіни."
 PHI_focus_time_reduced_T3_tt:0 "§Y$PHI_open_borders$§! скоротить час, необхідний для цього фокусу, на 35 днів."
 PHI_investment_plan_3_tt:0 "Який буде успішним і надасть кращі винагороди, якщо ми побудуємо інфраструктуру в [1027.GetName] та [624.GetName], а також витратимо поїзди, вантажівки та конвої для подальшого покращення нашої інфраструктури під час плану."
