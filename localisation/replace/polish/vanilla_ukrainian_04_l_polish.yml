 HISTORY_ROSTER_WINDOW_TITLE:0 "Історія"
 HOA_research_exchange_programmes_desc:0 "Наша промисловість гостро потребує модернізації, створивши програму обміну, ми можемо отримати знання з-за кордону про те, як найкраще використовувати нові технологічні досягнення на наших заводах."
 HOA_that_which_is_rightfully_ours_desc:0 "[ROOT.GetNameDefCap] — це тінь того, що має бути. Історія показує, що наші предки володіли значно більшими ділянками землі, ніж наша нинішня адміністрація, але більшість із них було вкрадено у нас поколіннями. Настав час повернути те, що нам по праву належить."
