 ship_hull_cruiser_panzerschiff_desc:0 "У спробі досягти недосяжного німецькі інженери об'єднали корпус крейсера і озброєння, що майже не поступається лінкорам. В результаті був народжений корабель, що перевершує вогневою міццю будь-який інший лінкор, але при цьому вкрай дорогий, відносно не дорогий."
