 DEN_industrial_preparations_desc:0 "Ми повинні підготувати кожну сферу нашого суспільства до війни — ми не можемо ризикувати бути захопленими зненацька будь-якими несподіванками. Промисловість має бути підготовлена перш за все щоби зробити нас більш самодостатніми, що, в свою чергу, посилить нашу здатність стримувати будь-яких загарбників достатньо довго, поки допомога, як ми сподіваємось, не прибуде."
