 CZE_invest_in_vhht_desc:0 "VHHT — це компанія, яка об'єднує багато різних металообробних заводів по всій країні. Інвестиції та їх розширення допоможуть нам у майбутньому покращити багато різних напрямків нашого металургійного виробництва."
