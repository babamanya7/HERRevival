 JAP_sea_guide_the_zaibatsus:0 "Спрямування дзайбацу"
 JAP_sea_purge_the_kodoha_faction_desc:0 "Фракція Кодоха змарнувала свою можливість захопити владу, і це коштуватиме їм дорого. За їхню віроломність щодо Його Імператорської Величності ми позбавимо їх звань і судитимемо за державну зраду. Настав час для фракції Тосейха взяти під повний контроль Імперську армію!"
