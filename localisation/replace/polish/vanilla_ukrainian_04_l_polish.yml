 PRC_move_capital_desc:0 "Після утворення $PRC_proclaimed_communism$, цілком природно, що ми переносимо нашу резиденцію уряду і повертаємо місту назву Пекін."
 PRC_naval_infrastructure_effort_desc:0 "Щоб діяти на дуже великій відстані вздовж берегової лінії [ROOT.GetNonIdeologyName], ми повинні забезпечити флот інфраструктурою, яка дозволить їм швидко заправлятися або ремонтувати свої судна незалежно від їхнього місцеперебування."
