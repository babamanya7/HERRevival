 FER_JAP_fascism_subject_DEF:0 "Східносибірська армія"
 FE_IRONMAN_TOOLTIP:0 "У режимі Ironman консольні команди вимкнені, а гра автоматично та регулярно зберігається в один файл. У цьому режимі шляху назад немає."
