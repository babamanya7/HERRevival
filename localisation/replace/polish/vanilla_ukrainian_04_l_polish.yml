 JAP_operation_take_australia:0 "Операція «АН»"
 JAP_organize_the_student_movements_desc:0 "Студенти наших університетів незадоволені станом нації та дотримуються ідей, що збігаються з поглядами деяких найвідоміших членів КПЯ. Ми повинні організувати Загальноуніверситетські об'єднані комітети боротьби з метою поширення соціалістичної думки в наших кампусах."
