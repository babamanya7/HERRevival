 INDUSTRIAL_ORG_TRAIT_TOOLTIP_ORGANIZATION_NOT_AVAILABLE:0 "§RВійськово-промислова організація недоступна§!"
 INDUSTRY_TAB_LABEL:0 "Промисловість"
 INDUSTRY_TITLE:0 "ПРОМИСЛОВІСТЬ"
 INFRASTRUCTURE_COST_EFFECT:0 "£GFX_infrastructure_texticon Обласна інфраструктура: x$VAL|2H$"
 INSHOL_cruisers_desc:0 "Флот без лінкорів повинен спиратися на свої крейсери. Створення сильної ескадри крейсерів дає [ROOT.GetAdjective] флоту міцне ядро, здатне патрулювати великі відстані між островами та відповідати будь-якому рейдеру, який увійде в наші води."
 INSHOL_develop_fighters_desc:0 "Ми відправимо батавських інженерів до Амстердама для вивчення виробництва винищувачів Fokker з перших рук, щоб отримати доступ до його суворо охоронюваних секретів виробництва. Вони повернуться зі знаннями та технічним досвідом, необхідними для створення сучасної вітчизняної індустрії винищувачів в Ост-Індії."
 INSHOL_industrialized_colony:0 "Індустріалізована колонія"
 INSHOL_infantry_training_in_borneo:0 "Навчання піхоти на Борнео"
 INSHOL_infantry_training_in_borneo_desc:0 "Ост-Індія характеризується густими джунглями, пересіченими горами та суворим рельєфом. Наші солдати, що базуються переважно на Яві, прикро не підготовлені до бою в таких умовах. Ми повинні розширити військову підготовку за межі Яви та проводити навчання в більш суворих умовах. Мало місць на землі можуть зрівнятися з джунглями та горами Борнео, що робить його ідеальним місцем для навчання рейнджерів світового класу."
 INSHOL_nationalize_dutch_companies:0 "Націоналізувати голландські компанії"
 INSHOL_overallwagen_desc:0 "Танки — не обов'язково рішення для армії Ост-Індії. Нам не вистачає промислової потужності, необхідної для їх виробництва, а суворий рельєф робить їх вузькоспеціалізованими. Щоб заповнити цю прогалину, ми могли б інвестувати у створення бронеавтомобілів для Індонезії."
 INS_add_fully_trained_militia_unit_tt:0 "Створює один навчений підрозділ §YБорців за свободу§!.\n"
 INS_allow_local_autonomy:0 "Дозволити місцеву автономію"
 INS_armored_car_equipment_0:0 "Wilton-Fijenoord Pantserwagen"
 INS_asian_trade_investments_tt:0 "Кожні §Y420§! днів штраф до ринкових ресурсів від §YВеликої депресії§! буде §Gпокращуватися§! на §Y5%§!, доки негативні модифікатори не зникнуть."
 INS_bangka_bauxite_export_warning_tt:0 "§RБуде видалено, якщо ми не контролюватимемо Банка-Белітунг.§!"
 INS_communist_events.5.a:0 "Це неподобство!"
 INS_cost_text_oil_48_blocked:0 "£resources_strip|1 §R48§!"
 INS_cost_text_rubber_40_blocked:0 "£resources_strip|3 §R40§!"
 INS_darul_islam_focus:0 "Даруль Іслам"
 INS_darul_islam_focus_desc:0 "Хізбулла Картосувірйо проявили себе на пагорбах Західної Яви, і ми не можемо дозволити собі залишити таких бійців поза нашими лавами. Нехай його іррегулярні війська стоять серед наших, і нехай він сам носить звання, яке заслужив. Вірні незабаром відстоюватимуть свою справу в Республіці."
 INS_de_javasche_bank_name_nationalized:0 "Bank Indonesia"
 INS_declare_free_trade_desc:0 "Ми не повинні орієнтуватися виключно на одну країну, ми дозволимо ринку природним чином приймати найкращі рішення для [INS.GetNameDef]."
 INS_defenders_of_homeland:0 "Захисники Батьківщини"
 INS_deploy_the_kris:0 "Служба індонезійського народу Сулавесі"
 INS_electrical_investments:0 "Інвестиції в електроенергетику"
 INS_end_to_bloodshed_tt:0 "Війна закінчиться з новими кордонами, проведеними на основі поточної окупації. Ява, Суматра та Борнео будуть §Yанексовані§! тією стороною, яка наразі має найбільший контроль у цьому регіоні."
 INS_expand_batavia_technical_institute_desc:0 "Розширення Технологічного інституту Батавії дозволить більшій кількості студентів здобути освіту та збільшить темпи нашого технологічного розвитку."
 INS_fighter_equipment_3_short:0 "Fokker D.XXX"
 INS_guided_democracy_desc:0 "Демократія може бути ідеалом, але передача влади народу зараз призведе лише до хаосу. Ми піднесемо Сукарно до довічного Президента, який буде наглядати за демократичним парламентом і втручатися в разі необхідності."
 INS_happy_state:0 "Розвинений регіон"
 INS_heir_to_the_rooster_of_the_east:0 "Спадкоємець Півня Сходу"
 INS_industrial_events.6.a:0 "Інвестувати в наші міста."
 INS_invest_in_batavian_education_desc:0 "Фольксраад чітко дав зрозуміти, що волею індонезійського народу є те, щоб освіта стала доступнішою, оскільки наразі її можуть дозволити собі переважно голландські індонезійці та невелика група індонезійської еліти. Щоб виконати рішення Фольксрааду, ми повинні побудувати кілька початкових і середніх шкіл у Батавії та навколо неї."
 INS_limited_war_events.2.b:0 "Ми не здамося маріонеткам!"
 INS_limited_war_events.8.t:0 "[FROM.GetName] відмовляється схилитися"
