 HOL_WILHELMINISM_FASCISM:0 "Династичні зв'язки між нашим власним королівським домом і домом німецького кайзера, який проживав у Гейс-Доорні після закінчення Великої війни, все ще міцні. Можливо, ми зможемо використати популярність, якою він досі користується серед багатьох німецьких військових, для наших власних здобутків і, роблячи це, створити могутню державу, яка матиме причини бути вдячними нам, коли війна закінчиться."
 HOL_attract_foreign_investors:0 "Залучення іноземних інвесторів"
 HOL_colonial_shipbuilding_desc:0 "З падінням Нідерландів наші континентальні верфі були втрачені. Ми повинні відкласти ресурси для створення нових верфей на Сході, якщо ми хочемо розбудувати наші військово-морські сили."
 HOL_crack_down_on_pacifist_movements_desc:0 "Різні пацифістські рухи вже сильно заважають нашому курсу на переозброєння. Якщо народ не можна переконати, його можна змусити замовкнути силою."
 HOL_de_crisisjaren_desc:0 "Через особливості світової економіки Велика депресія дійшла до Нідерландів із суттєвим запізненням. Криза була посилена рішенням нідерландців зберегти «золотий стандарт», тоді як інші держави досить швидко від нього відмовилися. Всі можливості фінансової системи йдуть на боротьбу з девальвацією гульдена: для ослаблої ж економіки, не кажучи вже про збройні сили, що знаходяться в жалюгідному стані, ресурсів не залишається.\n\nВплив кризи можна знизити за допомогою інвестицій в цивільну інфраструктуру; сама криза стане для нас здебільшого неактуальною."
 HOL_de_vaarplicht_idea:0 "De Vaarplicht"
 HOL_domestic_vehicle_designs_desc:0 "Надання нашій автомобільній промисловості більшої свободи в поводженні з її конструкціями також може мати побічні ефекти щодо підвищення ефективності виробництва."
 HOL_expand_the_artillerieinrichtingen_desc:0 "Artillerie Inrichtingen виробляє боєприпаси та невелику кількість стрілецької зброї (за ліцензією) для наших сил. Його слід розширити, якщо ми прагнемо збільшити нашу армію."
 HOL_finish_the_noordoostpolder_desc:0 "Після того, як ми закрили Зьойдерзее, побудувавши Афсльойтдейк і тим самим створивши штучне озеро Ейсселмеер, тепер ми повинні завершити проєкт рекультивації землі «Ноордоостполдер». Це дасть нам кращу інфраструктуру та більше можливостей для промислового та сільськогосподарського розширення."
