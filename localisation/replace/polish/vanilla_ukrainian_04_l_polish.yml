 denmark_events.666.a:0 "Нехай промені нашої слави огорнуть цей світ!"
 denmark_expansion_event.1.b:0 "Ми не можемо підкорятися данцям!"
 denmark_expansion_event.20.a:0 "Нам залишається лише схилити коліно."
 denmark_expansion_event.20.desc:0 "З півдня прийшли похмурі новини: [DEN.GetNameDef] вимагає підпорядкування держави [NOR.GetNameDef] і нашого переходу під [DEN.GetAdjective]е правління — вперше з 1814 року. Нам уже доводилося відстоювати свою незалежність від шведів у відчайдушних боях, але чи зможемо ми боротися з данцями?"
 denmark_expansion_event.21.desc:0 "[NOR.GetNameDefCap] мудро приймає нашу пропозицію про окупацію. Тепер, коли землі на півночі наші, ми можемо зосередитися на розширенні кордонів з іншого боку."
 denmark_expansion_event.23.desc:0 "Оскільки [DEN.GetNameDef] зараз окупує державу [NOR.GetNameDef], їхня вимога віддати ці землі була лише питанням часу. Ці нахаби стверджують, що [NOR.GetNameDef] — технічно [DEN.GetAdjective]а територія. У нас є вибір: віддати данцям державу [NOR.GetNameDef] або відмовити їм і готуватися до можливої війни."
 denmark_expansion_event.23.t:0 "[FROM.GetNameDefCap] вимагає [NOR.GetAdjective]і землі"
 denmark_expansion_event.400.t:0 "Питання нейтралітету"
 denmark_expansion_event.401.t:0 "[FROM.GetNameDefCap] хоче союзу"
 denmark_expansion_event.802.desc:0 "Ми отримали відповідь від [FROM.GetAdjective]ого уряду щодо нашої пропозиції захисту. На жаль, вони відмовляються нам підкоритися. Скоро вони дізнаються, як нерозумно вони вчинили."
 denmark_occupation_event.100.b:0 "Ми впораємося і без їхньої жалюгідної армії"
 denmark_occupation_event.102.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію про союз"
 denmark_occupation_event.110.b:0 "Нам їхня вірність ні до чого"
 denmark_occupation_event.30.desc:0 "Цю операцію ретельно планували, і всі приготування та тривале очікування зрештою були не даремні. Ми влаштували диверсію на критично важливих промислових об'єктах, що постачали державу [?DEN.DEN_overlord_nation.GetNameDef] данськими товарами. Такий сміливий вчинок обмежить потік продукції, що йде від нас до наших так званих господарів."
 denmark_overlord_events.21.d:0 "Фашизм без кровопролиття"
 denmark_overlord_events.27.desc:0 "Нам вдалося переконати данський уряд заборонити комунізм на тлі нашої смертельної боротьби з цією ідеологією. У цій битві може бути тільки один переможець, і ми повинні взяти гору в ім'я добробуту [ROOT.GetAdjective]ого народу!"
 denmark_overlord_events.29.desc:0 "[FROM.GetNameDef] шле нам вимоги заборонити будь-яку фашистську активність у країні. [FROM.GetAdjective]і дипломати заявляють, що з нашого боку майже зрада дозволяти цій шкідливій ідеології пускати коріння в нашій державі, поки наші гегемони відважно захищають себе і весь вільний світ від держави, яка цілком прийняла фашизм як ідеологію."
 denmark_overlord_events.40.b:0 "[ROOT.GetAdjective]ий народ нізащо не змириться з цим!"
