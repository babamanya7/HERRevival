 SIK_pursue_further_soviet_integration_desc:0 "Коли битва закінчилася і пил осів, ми повинні звернути увагу на інші загрози. Під захисним крилом Радянського Союзу нам не загрожуватиме анексія з боку Центрального уряду, тож це, безумовно, найбільш розумний курс дій."
