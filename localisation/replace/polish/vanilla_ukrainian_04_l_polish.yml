 SUBDOCTRINE_DEFENSIVE_POSTURES_DESC:0 "Навчальний та доктринальний акцент на оборонній тактиці, спрямованій на завзяте утримання позицій, нанесення втрат та затримку нападника."
 SUBDOCTRINE_GRAND_ASSAULT_DESC:0 "Спираючись на важко здобуті уроки Першої світової війни, ми застосуємо обдуманий і методичний підхід до передбойового планування. Потім, коли кожна перевага буде використана, ми зійдемо на ворога як лавина."
 SUBDOCTRINE_LARGE_UNIT_TACTICS_DESC:0 "Якщо ми освоїмо концентровані операції на вузькому фронті, то зможемо створити локальну перевагу, щоб здолати ворога у точці головного удару і здійснити прорив."
