 USA_heavy_tank_artillery_equipment_2:0 "M43 Howitzer Motor Carriage"
 USA_heavy_tank_destroyer_equipment_1:0 "M9 Gun Motor Carriage"
 USA_income_tax_reform:0 "Реформа податку на прибуток"
 USA_institute_of_american_sciences_desc:0 "Зараз університети та наукові лабораторії всієї країни ведуть дослідження так, як їм заманеться. Потрібно покласти край цій практиці. Ми створимо нову організацію, яка координуватиме дії наших учених світового рівня."
 USA_intervention_in_asia:0 "Інтервенція в Азію"
 USA_light_tank_aa_equipment_3_short:0 "M19 MGMC"
 USA_light_tank_equipment_3_short:0 "Chaffee"
 USA_louisiana_maneuvers_desc:0 "Через бюджетні обмеження ми не брали участь у безлічі військових конфліктів і просто спостерігали за ними здалеку. Тепер ми нарешті можемо випробувати деякі наші теорії у справі."
 USA_magic_desc:0 "Офіцери нашого флоту впевнені, що зможуть розшифрувати японські коди. Це дозволить нам читати всі їхні повідомлення, у тому числі дані про переміщення кораблів."
 USA_mark_clark:0 "Марк У. Кларк"
 USA_medium_tank_aa_equipment_2_short:0 "M16 MGMC"
 USA_mio_trait_mass_production_of_armor:0 "Масове виробництво бронетехніки"
 USA_mio_trait_strict_design_specifications:0 "Суворі обмеження дизайнів"
 USA_preemptive_intervention_desc:0 "Ми не можемо сидіти склавши руки і спостерігати, як сусідні країни готуються до війни та накопичують арсенал для придушення наших союзників. Ми мусимо втрутитися заради нашої великої держави та всього світу."
 USA_raymond_a_spruance:0 "Реймонд Е. Спрюенс"
 USA_support_weapons3:0 "M1919 Browning MG & M1 mortar"
 USA_suspend_the_presecution_desc:0 "Переслідування громадян Америки за їхні політичні переконання, хоч би якими жахливими вони здавались, йде врозріз із основними цінностями нашої країни. Ми мусимо негайно припинити цю практику."
 USA_tac_bomber_equipment_1:0 "Douglas B-23 Dragon"
 USA_the_neighbors_desc:0 "Насамперед ми мусимо потурбуватися про безпеку сусідніх з нами держав. Раніше ворог міг нападати на нас через сусідів, але тепер будь-який удар по них ми розцінюватимемо як удар по собі."
 USA_war_plan_orange:0 "Воєнний план «Помаранчевий»"
 USA_war_plan_scarlet_garnet:0 "Воєнні плани «Ясно-червоний» і «Гранатовий»"
 USA_war_plan_scarlet_garnet_desc:0 "Австралія та Нова Зеландія, напевно, стануть на захист своєї метрополії в Тихоокеанському регіоні. Будь-який план боротьби з Великою Британією повинен враховувати її колонії."
 USA_war_plan_yellow:0 "Воєнний план «Жовтий»"
 USA_work_with_the_bund_tt:0 "Гарантує, що у разі громадянської війни ці штати залишаться вірними уряду: Огайо, Міссурі, Вісконсин, Іллінойс, Індіана та Мічиган."
