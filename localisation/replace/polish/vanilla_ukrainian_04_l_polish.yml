 SOV_muster_the_old_guard_desc:0 "Ще є багато тих, хто колись воював за царя і країну. Вони постаріли і пом'якшали, але досвід, якого вчить війна, є незамінним. Якщо ми зможемо достукатися до них, вони стануть досвідченим ядром нової армії, коли прийде час відвойовувати країну."
 SOV_naval_infantry:0 "Морська піхота"
 SOV_offensive_maritime_strategy:0 "Наступальна морська стратегія"
 SOV_offer_poland_protection_tt:0 "Польща отримає землі, на які претендувала за цією угодою у випадку радянського завоювання.\n"
 SOV_operation_iskra_activate_decision_tt:0 "\nАктивує завдання: §Y$SOV_operation_iskra_ongoing$§! (Щоб досягти успіху в цій місії, нам потрібно прорвати блокаду §YЛенінграду§! і відновити сухопутні шляхи між містом і нашою столицею до часу виконання місії поза."
 SOV_prepare_a_war_with_japan_desc:0 "Перш ніж завдати удару по Японії, ми мусимо переконатися, що на нас не чекають несподіванки, і активізувати наші розвідувальні зусилля."
 SOV_propaganda_knowledge:0 "Знання розірве ланцюги рабства"
 SOV_propaganda_victory_at_hand:0 "Перемога близька!"
 SOV_purged_junior_army_officers_1:0 "Молодші офіцери армії зачищені"
 SOV_reinforce_army_officer_ranks_with_veterans_dec_desc:0 "Ми поповнимо виснажені офіцерські лави армії загартованими і талановитими ветеранами."
 SOV_restore_cossack_units:0 "Відновити козацькі війська"
