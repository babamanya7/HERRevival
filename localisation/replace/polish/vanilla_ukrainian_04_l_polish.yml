 PRC_overthrow_the_ussr:0 "Повалити фальшивих комуністів"
 PRC_peoples_liberation_army_sea_desc:0 "Наша Робітничо-селянська Червона армія тепер містить усе більше досвідчених солдатів, і настав час повністю прийняти цю зміну характеру. Переходячи від сил ополчення до армії добре навчених і добре споряджених професійних солдатів, настав час сформувати Сухопутні війська Народно-визвольної армії."
