 ROM_basing_rights_for_soviet_union:0 "Надання баз державі [SOU.GetName]"
 ROM_claim_herzegovina:0 "Претендувати на область [804.GetName]"
 ROM_heavy_bombers_desc:0 "Наші стратегічні бомбардувальні сили потребують достатньої дальності та бомбового навантаження. Великі бомбардувальники є єдиним життєздатним варіантом досягнення цих вимог."
 ROM_institute_royal_dictatorship_desc:0 "Настав час ще більше збільшити і без того великі повноваження короля, забезпечивши політичну стабільність нації та дозволивши їй зосередитися на загрозах ззовні."
 ROM_king_carol_ii_hedonist_desc:0 "Король Кароль II дуже відомий своїми недешевими смаками та готовністю задовольняти ще дорожчі смаки своєї коханки. У минулому він викликав серйозні скандали, і з великою ймовірністю продовжить це робити, якщо його не замінити або не вказати йому на його помилки."
 ROM_mobile_tank_destroyers_desc:0 "У нас немає індустрії, щоби перевершити ворогів у танках. Натомість ми повинні зосередитися на виробництві зброї, яка може звести нанівець перевагу ворога в бронетанкових підрозділах."
 ROM_revise_the_constitution_desc:0 "Конституцію необхідно переписати, щоби зміцнити позицію короля як лідера нації. Крім того, небезпечні ультраправі рухи можна підірвати, забезпечивши більш безпечну альтернативу в молодіжній організації «Королівський вартовий Батьківщини»."
 ROM_secure_the_bosporus:0 "Контроль над Босфором"
 ROM_securitate:0 "Securitate"
 ROM_ship_torpedo_sub_2:0 "6x 533-мм торпедний апарат"
 ROM_the_maresal_desc:0 "У наших інженерів виникла ідея розмістити радянську 122-мм гаубицю в закритому казематі. Подальше вдосконалюючи цю конструкцію, ми цілком можемо стати на шляху до створення надзвичайно успішної моделі танка."
 ROM_vanatori_de_munte_desc:0 "Vanatori de munte — «гірські мисливці» — наша елітна гірська піхота. Їхня репутація випереджає їх, навіть за кордоном, і нам було б добре збільшити їх кількість найкращим, що ми можемо знайти."
 ROOT_invest_in_turkish_state_light_industry_desc:0 "Легка [FROM.GetAdjective]а промисловість залишається недорозвиненою в багатьох регіонах країни. Нам під силу це виправити."
 RULE_ALLOW_PARATROOPERS_ALLOWED_DESC:0 "Держави можуть використовувати десантування без обмежень."
 RULE_ALLOW_RELEASE_NATIONS_BLOCKED_TOOLTIP:0 "Правило гри: §R$RULE_ALLOW_RELEASE_NATIONS_BLOCKED_DESC$§!"
 RULE_ALLOW_TAKE_OVER_FACTION_ALLOWED_DESC:0 "Держави можуть переймати лідерство в альянсі при виконанні відповідних умов."
 RULE_DEMOCRATIC_ALTERNATE_USA_AI_DESC:0 "§HАмериканський§! ШІ намагатиметься брати активнішу участь у світових справах, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_HISTORICAL_DEN_AI_DESC:0 "Данський ШІ намагатиметься триматися осторонь будь-яких конфліктів і якомога більше слідувати історичним подіям. Якщо він стане підлеглим, то спробує поступово заручитися підтримкою іноземних держав, щоби зрештою знову заявити про свою незалежність."
 RULE_OPTION_ALTERNATE_GUOMAO:0 "Неохоча діархія"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI:0 "Варіантний історичний шлях — Östfrei!"
 RULE_OPTION_COMMUNIST_NZL_AI_DESC:0 "ШІ намагатиметься перейти в комунізм і приєлнатися до Комінтерну communist and join the Comintern, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI:0 "Захисні демократи"
 RULE_OPTION_DEMOCRATIC_GRE_AI:0 "Венізелістський шлях"
 RULE_OPTION_DEMOCRATIC_PAR_AI:0 "Демократичний шлях"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE:0 "П'ята імперія"
 RULE_OPTION_FASCIST_INDEPENDENT:0 "Фашизм: фалангістський інтернаціонал"
 RULE_OPTION_HIDE_DESC:0 "Певні застарілі гілки будуть приховані при певних обставинах для легшої навігації по дереві фокусів."
 RULE_OPTION_HISTORICAL_PER_AI:0 "Історичний шлях"
 RULE_OPTION_HISTORICAL_SIA_AI_DESC:0 "The AI will follow the historical outcome. The AI will go down the fascist tree, attack Indochina and join the Japanese faction."
 RULE_OPTION_HISTORICAL_TUR_AI:0 "Історичний шлях"
 RULE_OPTION_INDEPENDENT_COMMUNIST:0 "Незалежний комунізм"
 RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC:0 "§HГреція§! прийме абсолютну монархію і постарається приєднатися до Німеччини або Австро-Угорщини в союзі Центральних держав."
 SAB_democratic_DEF:0 "Республіка Сабаг"
 SAF_EQUIPMENT_VERSION_6:0 "Mk VI"
 SAF_artillery_equipment_3:0 "BL 5.5-inch Medium Gun"
 SAF_battleship_3:0 "Клас «Lion»"
 SAF_equipment_effort_desc:0 "Нам не можна недооцінювати важливість постачання армії. Зброя та танки хороші, але нам також потрібні обмундирування, рації, ремкомплекти та багато іншого."
 SAF_fighter_equipment_3:0 "Supermarine Spiteful"
 SAF_heavy_fighter_equipment_3_short:0 "Mosquito FB"
 SAF_jet_strat_bomber_equipment_1_short:0 "Valiant"
 SAF_medium_tank_equipment_2_short:0 "Cromwell LP"
 SAF_replace_the_blenheim_desc:0 "«Bristol Blenheim» вірою та правдою служив військово-повітряним силам Великої Британії та домініонів. Але, можливо, настав час знайти щось міцніше і з великим радіусом дії."
 SAF_robert_palmer:0 "Роберт Палмер"
