 AUS_VICTORY_POINTS_3583:0 "Острау"
 AUS_VICTORY_POINTS_6711:0 "Клаузенбург"
 AUS_a_royal_alliance_desc:0 "На самій вершині доволі самотньо. Як одна з небагатьох нині існуючих монархій, здається цілком правильним, щоб ми прагнули об’єднатися з браттями по зброї, з тими, хто все ще бачить цінність того, щоб сильний монарх керував їхньою країною. Ми повинні звернутися до тих, хто налаштований в нашу сторону, і запропонувати їм об’єднатися проти республіканського зла."
 AUS_against_fascism:0 "Австрійський антифашистський похід"
 AUS_anschluss_risk_critical_tt_NOT:0 "Ризик аншлюсу на даний момент не §RНеминучий§!."
 AUS_anschluss_risk_medium_tt:0 "Ризик аншлюсу на даний момент §YСередній§!."
 AUS_austria_against_fascism:0 "Австрійський Райхсбунд"
 AUS_austria_against_fascism_desc:0 "Поки наша нація оговтується від політичної ізоляції, яку ми пережили, не дивно спостерігати за появою політичних груп, оскільки люди нарешті наважуються висловити свою думку. Легітимістський «Австрійський Райхсбунд» є однією з таких груп. До речі, їхній політичні плани щоло країни збігаються з тим, що й ми плануємо для нації. Ми маємо подбати про те, щоб отримати максимум користі від нашої співпраці."
 AUS_clamp_down_on_dnsap:0 "Придушити НСРП"
 AUS_currently_reintegrating_state_flag:0 "Зараз реінтегруємо регіон у [ROOT.GetNameDef]"
 AUS_emergency_measaures_desc:0 "Хоча ми ніколи не були прихильниками революцій, стає дедалі очевиднішим, що ми не можемо покладатися на соціал-демократів у здійсненні змін, необхідних для того, щоб наша країна знову процвітала. Ми повинні підготуватися до боротьби за майбутнє австрійських працівників!"
 AUS_erwin_schrodinger:0 "Ервін Шрьодингер"
 AUS_expand_stpoltner_steelworks_desc:0 "Металургійний завод Санкт-Пьольтена показує дуже багатообіцяючі результати. Якщо ми будемо діяти швидко, ми зможемо переробити його на свій смак, щоб максимізувати виграш від заводу."
 AUS_farr_desc:0 "Скасувавши травневу конституцію та знову дозволивши політичні партії та проведення виборів, Австрія відродила те, що вважалося давно втраченою республікою."
 AUS_fighter_equipment_0_short:0 "D.III"
 AUS_hedy_lamarr:0 "Геді Ламарр"
 AUS_infantry_equipment_2_short:0 "Steyr MP34"
 AUS_intervention_in_spain_desc:0 "[SPR.GetAdjective]і республіканці наразі втягнуті в жорстоку громадянську війну, Піренейський півостров затягнутий хаосом. Незважаючи на нашу хитку ситуацію, ми все одно повинні прагнути допомогти їм. Зрештою, вони ведуть гідну битву проти націоналістів."
 AUS_invite_danubian_countries:0 "Запросити Придунайські країни"
 AUS_join_comintern:0 "Приєднатися до Комінтерну"
 AUS_neustadter_flugzeugwerke:0 "Neustädter Flugzeugwerke"
 AUS_phonix_fleugzeugwerke:0 "Phönix Fleugzeugwerke"
 AUS_political_events.10.desc:0 "Вчора ввечері гестапівці увірвалися в квартиру Вільгельма Ценера, зустрівшись з його охороною, яку ми поставили навколо нашого Верховного командування. Боротьба тривала недовго, і Ценер вийшов із сварки неушкодженим."
 AUS_political_events.100.a:0 "Має бути причина, чому вони так тиснуть на нас! Стоїмо твердо!"
 AUS_political_events.101.t:0 "[FROM.GetNameDefCap] залишає спроби просунути Артура Зейсса-Інкварта"
 AUS_political_events.11.a:0 "Наша внутрішня політика не має їх турбувати!"
 AUS_political_events.116.t:0 "[ROOT.GetAdjective]о-[FROM.GetAdjective]і спільні військові навчання проведені"
 AUS_political_events.18.a:0 "Чудненько."
 AUS_political_events.20.a:0 "Їхня незалежність має для нас величезне значення!"
 AUS_political_events.27.desc:0 "[AUS.GetNameDefCap] звернулась до нас із проханням отримати дозвіл на переозброєння та скасування Сен-Жерменського Договору. Заявляючи, що останнім часом «їхня сусідня територія стала набагато більш ворожою», вони висловлюють, що більше не почуваються в безпеці без власної армії. Запитання передано всім трьом великим державам, які підписали договір, Італії, Британії та Франції, а також Сполученим Штатам Америки. Відповідно до договору, будь-хто з нас може накласти вето по першому слову."
 AUS_political_events.29.c_tt:0 "§RВибравши цей варіант, ми будемо дотримуватись Сен-Жерменського Договору до 16 липня 1940 року.§!"
 AUS_political_events.52.b:0 "Габсбурги не мають прав на Габсбург!"
 AUS_political_events.53.t:0 "[FROM.GetNameDefCap] мирно інтегрується"
 AUS_political_events.59.a:0 "Вони мають прибрати його!"
 AUS_political_events.6.desc:0 "[FROM.GetNameDefCap] та їхні політики позитивно відреагували на нашу пропозицію щодо співпраці у розбудові наших військово-повітряних сил і обміну досвідом. Вони побачили труднощі, з якими ми зіткнулися після виходу з Сен-Жерменського договору, і запропонували нам можливість придбати у них зайве обладнання!"
 AUS_political_events.69.a:0 "Принаймні, золота клітка дає нам безпеку"
 AUS_political_events.74.desc:0 "Після довгих дебатів і багатьох дискусій, гаранти нарешті дійшли угоди. Нам буде дозволено частково переозброїтися з часом, відсьогодні більше жодних обмежень не буде стояти на нашому шляху щодо підготовки нових військ і збільшення кількості розміщених солдатів.\n\nПроте, до нашої промислової галузі все ще діють обмеження, нехай й менш суворі. Вони будуть остаточно зняті через рік. Авжеж, якщо сиутація у світі за цей час кардинально не зміниться."
 AUS_political_events.8.a:0 "А ЇМ яку користь принесе ця ситуація?"
 AUS_political_events.80.desc:0 "Посилаючись на незначні ідеологічні розбіжності та нашу нерішучість щодо революційного комунізму, [FROM.GetNameDef] відхилив наш заклик про допомогу. Ми самі по собі."
 AUS_political_events.85.2.a_tt:0 "Відмикає рішення §YВимогти звільнення [FROM.GetAdjective]их робітників§!."
 AUS_political_events.85.t:0 "[FROM.GetNameDefCap] не протидіє нашим зусиллям організації працівників"
 AUS_political_events.86.b:0 "Нехай тільки не кажуть, що вони не винні!"
 AUS_pulverfabrik_skodawerke_bonus:0 "Інвестиції в Skodawerke"
 AUS_reclaim_habsburg_tt:0 "Ми матимемо більше шансів на їхню згоду, якщо будемо §Gсильніші§! від них.\n\nВідкриває сукупність рішень §YРеінтеграції Швайцарських Земель§!."
 AUS_saved_creditanstalt_flag:0 "Пріоритет фінансування задано в бік Österreichische Creditanstalt"
 AUS_seek_agreement_for_rearmament_desc:0 "З огляду на те, що наша внутрішня політика зараз під нашим контролем, настав час поглянути назовні. Ми все ще зв’язані несправедливим Сен-Жерменським Договором, що перешкоджає нашому військовому розвитку та здатності захищати себе. Оскільки ми залежимо від інших підписантів, щоб забезпечити нашу безпеку було б розумно повідомити їх про наш намір переозброїтися та отримати від них згоду."
 AUS_seeks_a_deal_title_56:0 "[FROM.GetNameDefCap] передає територію в обмін на промислові інвестиції"
 AUS_steyr_arms_investment_tt:0 "Відкриває §YSteyr Arms§! в якості виробника §YПіхотної зброї§!"
 AUS_subjugate_lands_of_old_tt:0 "Відкриває сукупність рішень із §YПідпорядкування Старих Земель§! та окремі рішення для §YПоліпшення Вірогідності Мирного Результату§!."
 AUS_the_danubian_federation:0 "Дунайська Федерація"
 AUS_younger_prince_of_liechtenstein:0 "Молодший принц Ліхтенштайнський"
 AUTONOMY_COUNTRY_EFFECT:0 "Держава"
 Anchialus:0 "Анхіал"
 BAH_communism_DEF:0 "Багамська комуна"
 BALTIC_british_designers:0 "Запросити британських конструкторів"
 BALTIC_events.13.d:0 "Патрулюючи територію області [forest_brothers_raid_state_target.GetName], гарнізонні війська потрапили в засідку «лісових братів». Втрата, понесена нашою стороною, була здебільшого невелика, але новини про сутички швидко почали бачити в «лісових братів» воїнів [Root.GetAdjective] націоналізму і сумніватися в тому, що [Root.GetLeader] — легітимний правитель."
 BALTIC_events.301.t:0 "[From.GetNameDefCap] відмовляється втручатися"
 BALTIC_events.5.b:0 "Білорусь залишиться [Root.GetAdjective]ою."
 BALTIC_ford:0 "Ford Motor Company"
 BALTIC_ford_motors:0 "«Ford» — [Root.Capital.GetName]"
 BALTIC_forest_brother_resistance_cat:0 "Спротив лісових братів"
 BALTIC_original_designs_desc:0 "З самого народження нашої нації в 1918 року і дотепер держава [Root.GetNonIdeologyName] оснащувала свою армію британською зброєю, але більше цього не буде. Відтепер ми не можемо покладатися на британців. Потрібно дивитися в майбутнє та почати виробництво озброєння [Root.GetNonIdeologyAdjective]ого зразка."
 BALTIC_path_to_the_north_sea_desc:0 "У зрілому глобальному конфлікті Данія залишається обурливо нейтральною, а тим часом її протоки — все, що відокремлює світ соціалізму від Північного моря."
 BALTIC_promote_communism_desc:0 "Багато селян держави [From.Owner.GetNameDef] все ще бачать у соціалізмі ворога свого способу життя. Хоча ми можемо ніколи не залікувати шрами, які залишила по собі Червона армія, ми можемо переконати їх, що наш смак революції не такий кривавий."
 BALTIC_promote_communism_militancy_desc:0 "Соціалістичний запал так яскраво горить у серцях багатьох [From.Owner.GetAdjective]их робітників, що їм потрібна лише підтримка зовнішньої сили, щоби почати робити кроки для повалення диктатури."
 BASIC_RESEARCH_TECHNOLOGY_BONUS:0 "Отримує додатковий бонус $AMOUNT|1%G$ від досліджень науковців"
 BAS_democratic_DEF:0 "Республіка Британські Антили"
 BAY_democratic_DEF:0 "Вільна держава Баварія"
 BBA_african_union_events.2.t:0 "[FROM.GetNameDefCap] приєднується до Організації Африканської Єдності"
 BBA_african_union_events.23.a:0 "Чудово."
 BBA_african_union_events.5.t:0 "[FROM.GetNameDefCap] відмовляється від членства в [ETH_GetCentralBankName]"
 BBA_african_union_events.7.t:0 "Виконавча рада Організації Африканської Єдності"
 BBA_ethiopia_balance_of_power_events.55.a:0 "Ми мусимо показати приклад."
 BBA_ethiopia_communist_events.23.desc:0 "Радянський Союз зробив крок назад щодо своєї нещодавньої войовничої риторики і повернувся до рішучих протестів проти наших дій в Ефіопії. Схоже, що їхня загроза війни була лише блефом."
 BBA_ethiopia_communist_events.30.t:0 "[ETH.GetNameDefCap] просить про перемир’я"
 BBA_ethiopia_communist_events.58.a:0 "Чого ще чекати від тих, хто знищує власну спадщину."
 BBA_ethiopia_communist_events.58.desc:0 "Як і слід було очікувати, революційна влада в [ETH.GetNameDef] відмовилася екстрадувати [JAP.GetAdjective] дисидентів, які прибули до країни. Їхня відповідь, крім зухвалого порушення дипломатичного етикету, також містила низку погроз на адресу нашого славетного імператора!"
 BBA_ethiopia_communist_events.61.b:0 "У нас немає вибору, як погодитися."
 BBA_ethiopia_exile_events.02.desc:0 "[ETH.GetLeader] втік із країни, але все ще закликає своїх прихильників атакувати переможні армії [ROOT.GetAdjective]. Ці виступи призвели до зростання активності опору в північній та центральній частинах [ETH.GetName]."
 BBA_ethiopia_exile_events.15.t:0 "[FROM.GetNameDefCap] погоджується"
 BBA_ethiopia_exile_events.21.t:0 "Кораблів немає"
 BBA_ethiopia_exile_events.30.b:0 "Ні, це був би занадто великий крок"
 BBA_ethiopia_exile_events.55.a:0 "Наші сили стають сильнішими з кожним днем."
 BBA_ethiopia_exile_events.58.a:0 "Добре витрачені гроші"
 BBA_ethiopia_exile_events.59.desc:0 "Нещодавно закуплене нами допоміжне обладнання для військових вже доставлено. Можливо, це не найсучасніше обладнання у світі, але воно буде дуже корисним на передовій."
 BBA_ethiopia_fascist_events.10.t:0 "Ворогів схоплено"
 BBA_ethiopia_fascist_events.23.desc:0 "Організовані групи бійців опору піднялися в тилу ворога. Ці нерегулярні формування борються разом з нами проти своїх [ITA.GetAdjective]их гнобителів. Їхня бойова цінність може бути не найвищою, але вони, безсумнівно, вносять плутанину і дезорганізацію у збройні сили ворога."
 BBA_ethiopia_fascist_events.50.desc:0 "Поки ми зосередилися на справах ближче до дому, [ETH.GetAdjective]ий уряд скористався ситуацією і оголосив [ROOT.GetAdjectiveCap]ий Сомаліленд своєю територією. Відрізана від світу і майже не маючи надії на опір, [Root.GetAdjective]а влада в цьому районі просто погодилася на передачу території. Ми мусимо вирішити, чи формально визнати це приниження, чи рішуче відвоювати нашу законну територію."
 BBA_ethiopia_fascist_events.71.a:0 "Це краще, ніж нічого."
 BBA_ethiopia_imperial_events.10.a:0 "У нас немає вибору..."
 BBA_ethiopia_imperial_events.12.desc:0 "Держава [FROM.GetNameDefCap] визнала необхідність реінтеграції з державою [THIS.GetName]. [FROM.GetLeader] присягнув на вірність Його Величності імператорові [THIS.GetLeader]."
 BBA_ethiopia_imperial_events.2.desc:0 "Переговори з [FROM.GetAdjective]им урядом щодо можливої купівлі колонії [268.GetName] завершилися успішно. [FROM.GetNameDefCap] погодилася негайно передати порт Джібуті та прилеглу територію державі [ROOT.GetName], що дасть нам доступ до порту та об'єднає афарський народ під владою одного правителя."
 BBA_ethiopia_imperial_events.20.a:0 "Чероний рас мусить правити державою [ETH.GetNameDef]."
 BBA_ethiopia_imperial_events.6.desc:0 "Незважаючи на всі наші зусилля, нам не вдалося переконати [FROM.GetAdjective]ий уряд, що [689.GetName] є частиною [ROOT.GetAdjective]ої імперії. Вони посміялися з нашого прохання, навіть поставивши під сумнів божественність нашого великого лідера."
 BBA_ethiopia_industrial_financial_events.3.t:0 "[FROM.GetName] відмовляється співпрацювати"
 BBA_italo_ethiopian_war_events.100.b:0 "Ми не можемо цього дозволити"
 BBA_italo_ethiopian_war_events.102.a:0 "Нам варто спитати деінде"
 BBA_italo_ethiopian_war_events.203.a:0 "Ми проженемо загарбників за море."
 BBA_italo_ethiopian_war_events.301.a:0 "Ми мусимо переломити хід війни!"
 BBA_italo_ethiopian_war_events.302.desc:0 "Наші марні намагання в [ETH.GetName] почали мати ефект хвилі в інших місцях; ми отримуємо повідомлення з колоній про те, що наші піддані перестали слухатися місцеву владу в малих і великих масштабах. Вони, мабуть, розглядають нашу відсутність прогресу у війні як слабкість і випробовують нашу силу."
 BBA_italo_ethiopian_war_events.501.b:0 "Ми будемо боротися!"
 BBA_italo_ethiopian_war_events.502.t:0 "Мирного договору не буде"
 BBA_italy_air_accident.11.desc:0 "Під час польоту на інспекцію французького кордону у літака командувача ВПС Альдо Пеллегріні та генерала П'єтро Пінтора виникли проблеми з двигуном. Літак розбився, не залишивши на борту нікого живого."
 BBA_italy_anti_colonialism_events.02.b:0 "Ми повинні здатися..."
 BBA_italy_anti_colonialism_events.13.b:0 "Не на цій Землі!"
 BBA_italy_anti_colonialism_events.21.t:0 "Деколонізація Африки"
 BBA_italy_anti_colonialism_events.52.a:0 "Ласкаво просимо, брати та сестри!"
 BBA_italy_anti_colonialism_events.57.t:0 "Західна Африка голосує за вихід з держави [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.58.desc:0 "Жителі Центральної Африки побачили, як доброзичливо та ефективно ми управляємо їхніми землями, і проголосували за те, щоб приєднатися до нашої адміністрації! Здається, що наші інвестиції та турбота про їхні провінції окупилися. Це, безумовно, піде на користь усім нам."
 BBA_italy_civil_war.2.a:0 "Вони не можуть ховатися вічно"
 BBA_italy_civil_war.2.desc:0 "Схоже, що новостворена група опору завдає шкоди за лінією фронту. З того, що ми можемо сказати про цю групу, здається, що вона складається переважно з колишніх армійських офіцерів, які перейшли на бік сепаратистів. Ми намагаємося виманити їх звідти, але наразі у нас надто мало інформації, щоб передбачити їхні наступні дії."
 BBA_italy_communist_events.02.desc:0 "Наші товариші з новоствореної держави [FROM.GetName] звернулися до нас з проханням надати допомогу. [FROM.GetAdjective]ий народ був розірваний на частини в громадянській війні, щоб забезпечити своє комуністичне правління, і тепер звертається до інших урядів-однодумців, щоб вони могли відновити й захистити нову республіку."
 BBA_italy_interaction_events.33.desc:0 "[GetItalyWantsSocotra]"
 BBA_italy_interaction_events.4.desc:0 "Ми отримали вимоги від [ITA.GetLeader] офіційно коронувати італійського принца, відомого як принц Аймоне, королем Хорватії Томіславом II. Якщо ми приймемо ці вимоги, ми, безсумнівно, втратимо частину нашої незалежності, але, можливо, це буде варте того, щоб відвернути будь-яку італійську агресію в найближчому майбутньому."
 BBA_italy_interaction_events.667.t:0 "[FROM.GetName] передає [454.GetName]"
 BBA_italy_interaction_events.668.a:0 "Така образа для Бога!"
 BBA_italy_missiolinis.51.a:0 "Принаймні це не 5000 вантажівок."
 BBA_italy_missiolinis.82.a:0 "Усього лише мала перешкода."
 BBA_italy_naval_cooperation_programs.01.t:0 "Італійська програма морського співробітництва"
 BBA_italy_naval_cooperation_programs.07.desc:0 "Наші адмірали раді повідомити, що наші нещодавні морські навчання пройшли з великим успіхом! Ми отримали багато нових знань і краще підготовлені до майбутніх операцій у відкритому морі."
 BBA_italy_recognize_the_empire.1.t:0 "Визнання Італійської імперії"
 BBA_swiss_expansion.17.t_alps:0 "[FROM.GetName] Надала нам незалежність, але залишила Альпи собі"
 BBA_swiss_expansion.3.a:0 "Ми не піддамося!"
 BBA_switzerland.11.desc_SWI:0 "Оскільки Рада вирішила не втручатися в справу та залишити її судам і законам Граубюндена, Давіда Франкфуртера, який навмисно вбив Вільгельма Густлоффа, засуджено до 18 років ув’язнення.\n\nМи знаємо, що [?SWI.SWI_fascist_germany.GetNameDef] очікувала значно суворішого вироку, тож нашим дипломатам доведеться докласти зусиль для їхнього заспокоєння, але ми не могли дозволити собі виглядати упередженими у такі часи. Наш нейтралітет — це те, що може зберегти [SWI.GetAdjective] народ у буремні часи."
 BBA_switzerland.21.desc:0 "Оскільки [?FROM.SWI_angriest_country.GetNameDef] погрожує війною проти [FROM.GetName], звинувачуючи їх у дедалі більшій кількості порушень нейтралітету, [From.GetNameDef] просить нас гарантувати їхню незалежність та захистити їх від агресора."
 BBA_switzerland_trade.12.a:0 "Вони за це поплатяться"
 BBA_switzerland_trade.14.a:0 "Це чудова новина!"
 BBA_switzerland_trade.2.t:0 "[FROM.GetName] передчасно розриває торговельну угоду"
 BBA_switzerland_trade.3.b:0 "Ні, це занадто ризиковано"
 BBA_switzerland_trade.7.desc:0 "Попри наші найкращі зусилля, [FROM.GetAdjective]ий уряд вирішив відхилити нашу пропозицію про взаємовигідну торговельну угоду. \n\nЦе ставить [ROOT.GetName] у вразливе становище, оскільки ситуація в Європі ускладнює забезпечення стабільного джерела постачання цивільних і військових ресурсів для нашої оборони та виживання."
 BEL_BLITZKRIEG_DESC:0 "Нестабільність усе ще охоплює Бельгію всередині країни, але це ніщо в порівнянні з нестабільністю, яка зараз відчувається на світовій арені. Національна армія зазнала модернізації та розширення, з великою увагою до могутніх Льєзьких фортифікацій, які конкурують навіть із французьким Мажіно.\n\nБельгійський уряд відмовився від альянсів і проголосив абсолютний нейтралітет, однак це не завадило підписанню кулуарних угод на випадок нападу. Бельгія з великим занепокоєнням спостерігає за зростаючим мілітаризмом свого агресивного сусіда."
 BEL_allied_donations:0 "Допомога союзників"
 BEL_belgian_special_forces_desc:0 "[ROOT.GetAdjective] солдати завжди були стійкими і відданими, але ми повинні задуматися, на що вони здатні, якщо їх очолить такий компетентний лідер, як Едді Блондель, і тоді можна уявити, якими спеціальними можуть бути ці сили."
 BEL_beligca_fascism:0 "Белгіка"
 BEL_constitutional_crisis_desc:0 "Юбер Пірло, публічний критик фашизму і Леона Дегреля, голосно виступав проти рішення короля призначити останнього прем'єр-міністром. Він мобілізував підтримку в парламенті та провів екстрену ухвалу, оголосивши короля тимчасово нездатним правити та оголосивши призначення недійсним, поки воно не отримає королівського схвалення."
