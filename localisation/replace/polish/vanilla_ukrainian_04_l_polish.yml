 ICE_conscription_idea_desc:0 "Кожна молода людина в Ісландії зобов'язана пройти 4-річну військову службу у віці від 18 до 22 років, щоби захистити суверенітет своєї країни."
 ICE_drilling_for_oil_off_shore:0 "Буріння для видобутку нафти та газу на шельфі"
 ICE_einar_arnorsson:0 "Ейнар Арнорссон"
 ICE_international_relations_desc:0 "Наш шлях попереду буде важким, це безсумнівно. Якщо ми пройдемо його наодинці, він буде ще складнішим. Тому нам потрібно шукати нових союзників. Комуністичний Інтернаціонал — одне з таких місць, де ми можемо спробувати шукати нових союзників, але є й інші варіанти. Важливим є активне прокладання нових шляхів, що ми повинні почати робити негайно."
 ICE_olafur_thors:0 "Улафур Торс"
 ICE_patrolling_the_atlantic_desc:0 "Щоб захистити наш торговельний флот, нам потрібні океанські судна супроводу. Ми повинні працювати разом з Данією над розробкою нових моделей."
 ICE_support_equipment_desc:0 "Кожен підрозділ армії, а також спецпідрозділи могли б використовувати більш важкі боєприпаси, а також належні аптечки першої допомоги та зброю для придушення. Тому ми повинні подбати про те, щоб інвестувати в це якнайшвидше."
 ICE_transformation_of_nature_desc:0 "Електроенергія — ключ до індустріалізації. Природа Ісландії має служити державі так само, як і громадяни. Річки та водоспади можна перетворити на греблі, каміння можна видобувати, а гарячі джерела використовувати для опалення. Ніщо не повинно зупинити нас на шляху до прогресу."
 ICE_viking_spirit:0 "Ásatrú"
 IMPORTING_REQUEST_NO_INFLUENCE:0 "Ми отримуємо лише $VALONE|0H$ із $VALTWO|H$ домовлених од. ресурсу $TYPE|H$ через низький §Hторговий вплив§!."
