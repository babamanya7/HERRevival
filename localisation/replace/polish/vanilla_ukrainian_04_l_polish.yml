 AST_call_on_fascists:0 "[GET_AST_CALL_ON_FASCISTS]"
 AST_canberra_air_disaster_events.1.t:0 "Авіакатастрофа в Канберрі"
 AST_challenge_government_narrative_desc:0 "Деталі, якими поділився уряд щодо авіакатастрофи в Канберрі, здаються незвичними, неминуче викликаючи припущення, що деяка інформація може приховуватися. Як міг досвідчений офіцер Королівських ВПС Австралії (RAAF) розбити свій літак в ідеальних умовах для польоту? Необхідно вимагати від уряду відповідей."
 AST_commonwealth_aircraft_corporation_taog_desc:0 "У зв'язку зі зростаючим інтересом до війни в повітрі, ми повинні переконатися, що не залишимося позаду. Цивільні ентузіасти та інноватори вже почали бачити потенціал аеронавігаційної індустрії; надавши їм початкове фінансування, ми можемо сприяти розвитку та розширенню цього нового сектора."
 AST_cv_fighter_equipment_0:0 "Hawker Nimrod"
 AST_department_of_supply_and_development_taog:0 "Міністерство постачання та розвитку"
 AST_diplomatic_events.2.desc:0 "Делегація, відправлена до [FROM.GetNameDef], телеграфувала відповідь країни на нашу пропозицію щодо пакту про ненапад. Ми знали, що ця ініціатива була амбітною, тому відмова лідера [FROM.GetLeader] не стала великою несподіванкою."
 AST_diplomatic_events.20.a:0 "[AST.GetLeader] вирушить до Британії."
 AST_diplomatic_events.32.desc:0 "[FROM.GetNameDefCap] погоджується, що ресурси Індокитаю краще використовувати в австралійських руках, і надала нам права на них."
 AST_diplomatic_events.4.t:0 "Австралія просить Сінгапур"
 AST_diplomatic_events.41.t:0 "Повернення Науру в німецькі руки"
 AST_diplomatic_events.43.a:0 "Оскільки наша увага зосереджена в іншому місці, це буде на краще."
 AST_diplomatic_events.45.t:0 "Південно-Східна Азія залишається як є"
 AST_diplomatic_events.50.desc:0 "Хоча захист Південно-Східної Азії та Тихого океану в інтересах Британії, цей регіон знаходиться далеко від Британських островів; це розуміє і [FROM.GetName]. В обмін на нашу підтримку в постачанні, вона запропонувала взяти на себе командування обороною території, що дозволить нам спрямувати нашу увагу на інше."
 AST_diplomatic_events.54.a:0 "Так ми і зробимо."
 AST_diplomatic_events.57.t:0 "Віші передає африканські території"
 AST_diplomatic_events.7.a:0 "Ми можемо."
 AST_dorothy_tangney:0 "Дороті Тенгні"
 AST_eureka_stockade_monument_rally_desc:0 "У 1854 році, в Битві за Еврикський частокіл, австралійські золотошукачі запекло боролися проти колоніальних військ через нерозумну вартість ліцензій на видобуток і оподаткування золотих копалень. Невдоволення британським пануванням було очевидним тоді, і таким воно є зараз. Ми зберемося біля пам'ятника тій битві і виступимо за розрив з Британією."
 AST_fascism_party_long:0 "Партія Центру"
 AST_forging_australias_future_spirit_tt:0 "Змінює §Y$AST_forging_australias_future_spirit$§! на:"
