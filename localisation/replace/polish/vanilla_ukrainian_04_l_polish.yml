 DOD_hungary.24.c:0 "Ми боротимемося пліч-о-пліч зі шведами."
 DOD_hungary.25.t:0 "Угорщина відмовилася допомогти"
 DOD_hungary.45.desc:0 "[From.GetNameDefCap] готується до військового вторгнення після того, як [HUN.GetNameDef] відкрито денонсувала Тріанонський договір. Нас попросили надати допомогу і розправитися з [HUN.GetAdjective]ою державою до того, як вона поверне собі силу."
 DOD_hungary.45.t:0 "Втручання в державу [HUN.GetNameDef]"
 DOD_hungary.50.b:0 "Інакше що?"
 DOD_hungary.53.t:0 "[HUN.GetNameDefCap] мобілізується"
 DOD_hungary.55.desc:0 "Ситуація напружена до межі, але у нас ще є шанс залагодити все мирним шляхом. Інша сторона звернулася до нас неофіційними каналами, натякнувши, що не заперечуватиме, якщо проблему вирішить група непричетних до цього питання країн. До кого слід звернутися за допомогою?"
 DOD_hungary.58.t:0 "[HUN.GetNameDefCap] шукає посередника"
 DOD_hungary.62.c:0 "Звернутися до посередників."
 DOD_hungary.82.b:0 "Це не наш конфлікт."
 DOD_hungary.83.desc:0 "[SLO.GetName] останнім часом зазнає жорсткого тиску — [HUN.GetNameDef] вимагає повернути землі вздовж південного кордону, що раніше належали Угорщині. [HUN.GetAdjectiveCap]ий уряд чітко дав зрозуміти, що готовий вирішити питання силою, якщо це знадобиться. \n\nНам не можна допустити, щоб у цьому регіоні спалахнула війна через таку дрібницю. Ми маємо наполягати на дипломатичному вирішенні суперечки."
 DOD_hungary.92.b:0 "Звернутися до Німеччини за підтримкою."
