 DOD_romania.51.desc:0 "Усвідомивши всю неможливість і безглуздість військового протистояння, угорське керівництво вирішило виконати наше прохання і перейшло під наш контроль. [HUN.GetLeader] пообіцяв, що буде консультуватися з нами перед прийняттям будь-яких важливих рішень."
 DOD_yugoslavia.32.desc:0 "Тепер, коли [CZE.GetNameDef] більше не становить загрози, співвідношення сил у Південно-Східній Європі різко змінилося. Країни, які раніше покладалися на чеську зброю та гроші, тепер змушені шукати нових партнерів. Можливо, [YUG.GetLeader] встиг призабути про це. Час би йому нагадати."
