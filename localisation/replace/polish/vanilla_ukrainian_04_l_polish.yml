 GXC_rumors_of_deposition_desc:0 "Ходять чутки, що Чан Кайші вважає Ченя Цзітана занадто незалежним і тому прагне приборкати провінцію, змусивши його піти у відставку. Якщо це правда, це дуже тривожно, і ми повинні діяти негайно!"
 GXC_strat_bomber_equipment_2:0 "CAMCO Type 240"
