 CHL_political_events.38.a:0 "Разом ми можемо повалити США!"
 CHL_political_events.58.desc:0 "Наші війська повідомили про зіткнення з [CHL.GetAdjective] військами поблизу Лаго-дель-Десіерто в Санта-Крус. Вони заявляють, що [CHL.GetAdjective] війська просуваються все далі на схід, очевидно, намагаючись окупувати всю провінцію."
 CHL_political_events.72.t:0 "Перша сесія Арауканійського Конгресу"
 CHL_political_events.83.d:0 "Після кількох днів протестів та страйків соціалісти, комуністи та фашисти нарешті вирішили завдати удару по нашому уряду, побачивши, що перед ними з'явилося вікно можливостей. Вони вимагали від Карлоса Ібаньєса дель Кампо якнайшвидше передати владу Хорхе Гонсалесу фон Мареесу, але ми не здамося без бою. Надходять повідомлення про сутички по всій країні, і, ймовірно, у нас громадянська війна..."
 CHL_restore_the_old_kingdom_desc:0 "Тепер, коли ми контролюємо всі території іредентистського регіону Королівства Чилі, який колись входив до складу Віцекоролівства Перу, ми можемо докласти зусиль для інтеграції цих територій і, можливо, навіть піти трохи далі, ніж ці історично визнані кордони."
 CHL_ship_medium_battery_2:0 "20.3-см/45 Cannon"
 CHL_socialist_youth_idea:0 "Соціалістична молодь"
 CHL_spirit_of_the_pacific_war_desc:0 "Колись ми перемогли [BOL.GetAdjective]у та [PRU.GetAdjective]у армії, незважаючи на значну перевагу в чисельності. Тепер ми використовуємо це як пропаганду, щоби надихнути наших солдатів йти вперед!"
 CHL_strengthen_the_carabinieros:0 "Зміцнити Карабінерів Чилі"
 CHL_the_international_revolution_desc:0 "Ми мусимо переконатися, що революційне полум'я, яке колись розгорілося за кордоном, ніхто не зміг загасити."
 CHL_the_might_to_defend_our_homes_desc:0 "Нашому життю постійно загрожують великі держави світу, і неможливо переоцінити важливість того, щоби наш народ відчував себе захищеним своїм урядом. Ми мусимо зміцнювати наші сили, щоб війни ніколи не змогли постукати в наші двері."
 CHL_unite_hispanic_america_desc:0 "Час нарешті настав! Сьогодні ми є свідками історії, коли велика частина гіспанських американців знову возз'єдналася, але вже під нашим власним урядом, а не під Іспанською імперією. Радійте, бо це прихід нової ери для континенту!"
