 IRQ_expanded_anglo_iraqi_oil_company:0 "Expanded the Anglo-Iraqi Oil Company"
 IRQ_great_iraqi_statesman:0 "Великоіракський державник"
 IRQ_hashemite_arab_federation_communism_ADJ:0 "Арабськ"
 IRQ_hashemite_arab_federation_neutrality:0 "Гашімітська Арабська Федерація"
 IRQ_infantry_at2:0 "PIAT"
 IRQ_infantry_equipment_0_short:0 "Rifle No.1 MkIII"
 IRQ_iran_ultimatum_desc:0 "Значна частина арабського населення проживає в західних регіонах [PER.GetName]. Можливо, настав час вимагати їхнього об'єднання з нашою нацією, щоб захистити їх від [PER.GetAdjective] правління."
 IRQ_kamil_al_jaderji:0 "Kamil Chadirj"
 IRQ_kingdom_of_iraq_tag_neutrality_DEF:0 "Гашімітське Королівство Ірак"
 IRQ_kurd_communism_party_long:0 "Комуністична партія Курдистану"
 IRQ_kurdish_women_in_military_desc:0 "Застарілий погляд, що жінок потрібно тримати подалі від конфлікту, має бути усунений, якщо ми хочемо розвинути сильну армію, здатну протистояти нашим сусідам."
 IRQ_kurdistan_events.2.a:0 "Це чудова новина!"
 IRQ_pan_arab_crackdown:0 "Придушення панарабізму"
 IRQ_political_events.15.t:0 "Напруга з [FROM.GetNameDef] спадає"
 IRQ_political_events.20.a:0 "Несподівано, звичайно."
 IRQ_political_events.22.desc:0 "[FROM.GetAdjective] уряд планує вийти з [ROOT.GetName] і передати управління [IRQ.GetNameDef]. Якщо ми негайно не розробимо плани, щоб зірвати цей процес, ми отримуватимемо накази від [IRQ.Capital.GetCapitalVictoryPointName] протягом декількох днів."
 IRQ_political_events.41.a:0 "Нам буде краще."
 IRQ_political_events.72.t:0 "Смерть Газі I"
 IRQ_political_events.74.desc:0 "Наші нові [FROM.GetAdjective] друзі пропонують місію нафтових магнатів та промислових керівників для залучення інвестицій у їхні великі ресурсні родовища. Договір має бути забезпечений початковим, взаємовигідним обміном зброї на нафту."
 IRQ_royal_army_modifier_desc:0 "Заснована в 1921 році під пильним наглядом [ENG.GetAdjective], іракська армія слугувала стримуючим фактором проти агресії з боку сусідніх держав. Однак старші офіцери армії прагнуть можливості розширити та модернізувати свої сили, щоб не лише стримувати сусідів, але й домінувати над ними."
 IRQ_strenghtened_the_dinar:0 "Зміцнення динара"
 IRQ_strengthen_relations_with_iran_desc:0 "Хоча [IRQ.GetAdjective] та [PER.GetAdjective] народи не завжди погоджувалися, ми маємо спільну мету в модернізації наших націй та опорі західному пануванню в регіоні. Настав час побудувати конструктивні стосунки одне з одним, щоб ми могли досягти наших цілей разом."
 IRQ_strengthen_the_iraqi_dinar_KUR:0 "Зміцнити Курдський динар"
 IRQ_united_arab_republic_fascism_DEF:0 "Об'єднана Арабська Республіка"
 IRQ_werner_junck:0 "Вернер Юнк"
 ISR_sp_rockets_medium_range_ballistic_missile:0 "Проєкт «Jericho II»"
 ITA_SH_battleship_2:0 "Клас «Regina Elena»"
 ITA_STATE_115:0 "Січілія"
 ITA_STATE_163:0 "Дзара"
 ITA_VICTORY_POINTS_11564:0 "Фіуме"
 ITA_a_colonial_empire_claims_tt:0 "Отримає претензію на §Yкожну [EGY.GetAdjective]у, [KEN.GetAdjective]у, [SUD.GetAdjective]у, [SOM.GetAdjective]у, [DJI.GetAdjective]у, [ETH.GetAdjective]у, [ERI.GetAdjective]у або [UGA.GetAdjective]у територію§!, на яку [ROOT.GetFlag][ROOT.GetNameDef] ще не має претензію або яка знаходиться під [ROOT.GetFlag][ROOT.GetAdjective]им контролем.\nПоточні ефекти:"
 ITA_alberto_da_zara:0 "Альберто да Дзара"
 ITA_aldo_pellegrini:0 "Альдо Пеллегріні"
 ITA_all_roads_lead_to_rome:0 "Усі дороги ведуть у Рим"
 ITA_bandits_war:0 "$ITA_a_bandits_war$"
 ITA_battle_cruiser_2:0 "Клас «Principe Amedeo»"
 ITA_bersaglieri:0 "Bersaglieri"
 ITA_bersaglieri_desc:0 "Берсальєри, наша елітна легка піхота, вже давно відзначилася в боях. Хоча майбутнє війни може бути механізованим, якість окремого солдата все ще буде вирішальним фактором."
 ITA_bolstered_military_high_command_desc:0 "Компетентне керівництво має вирішальне значення для того, щоб армія функціонувала оптимально та була успішною на полях битв."
 ITA_bop_take_over_ministry_of_corporations_desc:0 "Призначення себе міністром корпорацій дозволить Беніто Муссоліні здійснювати прямий контроль над фінансовою системою та установами Італії."
 ITA_caligulas_pride_dynamic_modifier_tt:0 "§Y$ship_hull_super_heavy_1$§!: $production_cost_tt$ §G-15.00%§!\n§Y$ship_hull_super_heavy_1$§!: Броня: §G+10%§!\n"
 ITA_carrier_1_desc:0 "Клас «Giuseppe Miraglia» — гіпотетичний клас ранніх міжвоєнних авіаносців. Його можна порівняти з американськими авіаносцями класу «Lexington» та японськими «Kaga» або «Akagi»."
 ITA_carrier_3_desc:0 "«Aquila» була запланованою реконструкцією океанського лайнера Roma. Переобладнання мало розпочатися у 1941 році, але проєкт так і не був завершений. Якби він був завершений, «Aquila» мала би водотоннажність 23 500 тонн і був би порівнянний з японськими лайнерами класу «Hiyo» та британськими «Indomitable»."
 ITA_cede_aquila_class_destroyers_to_spanish_tag:0 "Передати есмінці класу «Aquila» державі [FROM.GetNameDef]"
 ITA_comitato_di_liberazione_nazionale:0 "Комітет національного визволення"
 ITA_common_ground:0 "Спільне підґрунтя"
 ITA_cooperatives_for_intensive_exploitation_dm:0 "$ITA_cooperatives_for_intensive_exploitation$"
 ITA_cooperatives_for_intensive_exploitation_tt:0 "§YРіст підпорядкування§!, §Yоб'єм місцевих припасів§! і §Yмісцевих ресурсів§! буде збільшено в §Yкожній африканській області у власності та під контролем, де видобуваються ресурси§!."
 ITA_crda_cant:0 "CRDA-CANT"
 ITA_cruiser_submarines:0 "Крейсерські підводні човни"
 ITA_demand_ticino_desc:0 "У гірській Швайцарії проживає багато різних етнічних груп, але серед них є й італійці, які здебільшого проживають у південних кантонах країни, як-ось Тічіно. Щоби створити велику італійську державу, ми мусимо гарантувати, що всі наші люди зможуть жити в межах однієї країни."
 ITA_democrazia_cristiana_long:0 "Християнська демократія"
 ITA_divisioni_alpine_desc:0 "У нашій пам'яті про Велику війну назавжди залишаться жорстокі бої у високогір'ї Альп. Якщо нам коли-небудь знову доведеться захищати нашу країну від іноземного вторгнення, воно, безумовно, прийде з півночі, та вимагатиме більше боїв у непривітних горах. Ми мусимо мати солдатів, здатних ефективно воювати в цій місцевості."
 ITA_fanti_dell_aria_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_SPECIAL_FORCES_CAP$: §G+2.0%§!\n$MODIFIER_SPECIAL_FORCES_OUT_OF_SUPPLY_FACTOR$: §G-10.00%§!\n$modifier_army_sub_unit_paratrooper_max_org_factor$: §G+5.00%§!\n\n"
 ITA_fight_alongside_country_comrades_balkan_desc:0 "$SOV_fight_alongside_country_comrades_balkan_desc$"
 ITA_grand_council_total_control_range:0 "Повний контроль Великої ради"
 ITA_gruppi_di_difesa_della_donna:0 "Gruppi di Difesa della donna"
 ITA_iberian_protection_desc:0 "У недалекому минулому іберійські народи жили у відносній безпеці, але очевидно, що зараз вони не зможуть самостійно захистити себе від великих ворожих держав. Ми мусимо запропонувати їм свій захист, поки ще не пізно."
 ITA_increase_production_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §G+20.00%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5.00%§!\n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §R-4.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.00%§!\n\n"
 ITA_incrociatori_pesanti_dynamic_modifier_tt:0 "§Y$capital_ship$§!: $production_cost_tt$ §G-5.00%§!\n§Y$capital_ship$§!: Броня: §G+5%§!\n"
 ITA_italia_libera_desc:0 "Ми мусимо взяти на себе ініціативу та запропонувати дружнім сусіднім урядам сформувати альянс в Європі, який дозволить нам співпрацювати та захищатися від численних загроз, які нас оточують."
 ITA_italian_ljubljana_name:0 "Любляна"
 ITA_joint_maneuvers_with_country_desc:0 "Щоби будь-які збройні сили були ефективними і оперативними, вони повинні бути підготовленими і готовими. Спільні навчання з іншою країною допоможуть саме в цьому."
 ITA_king_total_control_range:0 "Панівний Савойський дім"
 ITA_libyan_refineries_desc:0 "Оскільки в Лівійській пустелі виявлені великі поклади нафти, нашим наступним кроком має стати збільшення потужностей із переробки нафти в регіоні."
 ITA_long_range_aircraft_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$\n$MODIFIER_STRAT_BOMBING_VISIBILITY$: §G-5%§!\n$MODIFIER_AIR_RANGE$: §G+5%§!\n$MODIFIER_STRATEGIC_BOMBER_BOMBING$: §G+5.0%§!\n\n"
 ITA_mechanized_equipment_1:0 "CVP-4"
 ITA_missiolini_strengthen_the_airforce_bombers_goal_tt:0 "Вироблено або здобуто [?ROOT.ITA_missiolinis_bombers_to_produce|Y] нових §Yштурмовиків§!, §Yморських бомбардувальників§! або §Yтактичних бомбардувальників§! (лиш одного типу).\nНаразі розгорнуто штурмовиків: [?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe|G] - Наразі штурмовиків у запасі: [?ROOT.num_equipment@small_plane_cas_airframe|G] - Загальна ціль штурмовиків: [?ITA_missiolinis_cas_goal|Y]\nНаразі розгорнуто морських бомбардувальників: [?ROOT.num_deployed_planes_with_type@small_plane_naval_bomber_airframe|G] - Наразі морських бомбардувальників у запасі: [?ROOT.num_equipment@small_plane_naval_bomber_airframe|G] - Загальна ціль морських бомбардувальників: [?ITA_missiolinis_naval_bombers_goal|Y]\nНаразі розгорнуто тактичних бомбардувальників: [?ROOT.num_deployed_planes_with_type@medium_plane_airframe|G] - Наразі тактичних бомбардувальників у запасі: [?ROOT.num_equipment@medium_plane_airframe|G] - Загальна ціль тактичних бомбардувальників: [?ITA_missiolinis_tactical_bombers_goal|Y]"
 ITA_modernized_army_desc:0 "Ліпша артилерія значно збільшить нашу бойову ефективність, але в нас також є потреба в нових тактиках і доктринах."
 ITA_naval_power_projection_desc:0 "Наслідуючи спадщину наших предків, ми мусимо забезпечити наявність необхідної промисловості для розвитку грізних ВМС, здатних підтримувати панування Італії в Середземному морі над будь-яким іншим флотом."
 ITA_novus_ordo_irregulars_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+5.0%§!\n\n"
 ITA_papal_state_catholic_dominion_desc:0 "Зі сходженням папства як великої світової держави, ми повинні виконувати волю Бога і, як пастир, який веде свою отару, захищати вірних християн від зла."
 ITA_planned_economy_desc:0 "Представники нашої нової Конфедерації запропонували економічну ініціативу, яка, на їхню думку, дозволить регулювати та стимулювати економіку всіх країн-членів у ефективний та сталий спосіб."
 ITA_preserve_army_traditions:0 "Зберегти армійські традиції"
 ITA_randolfo_pacciardi:0 "Рандольфо Паччарді"
 ITA_regia_aeronautica_dynamic_modifier:0 "Regia Aeronautica"
 ITA_regia_marina_3_dynamic_modifier_desc:0 "$ITA_regia_marina_dynamic_modifier_desc$"
