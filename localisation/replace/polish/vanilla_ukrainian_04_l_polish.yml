 test_the_chinese_focus_short_desc:0 "§LСпровокуйте конфлікт, посиливши військову присутність біля кордону з Китаєм.§!"
 tfv_australia.3.d:0 "Незважаючи на нашу серйозну занепокоєння щодо життєздатності Сінгапурської стратегії, наші пропозиції змінити її були відхилені в [From.GetAdjective]ому парламенті.\nЗдається, це результат військового консерватизму, який домінує в [From.GetAdjective]ому верховному командуванні, але справа в тому, що якщо наші страхи справляться, нам, можливо, доведеться зіткнутися з ворожими силами на наших берегах."
 tfv_australia.60.b:0 "[Root.GetNameDefCap] ніколи не здасться!"
 tfv_canada.1.t:0 "[From.GetNameDefCap] пропонує створити Північноамериканський альянс"
 tfv_canada.30.d:0 "Зі зростанням впливу синархістів зростають і їхні вимоги. Схоже, що наш уряд більше не може стримувати їхню праву політику, оскільки зіткнення між синархістами та прихильниками уряду відбуваються по всій державі [Root.GetNameDef]. Це включає використання летальної зброї з обох сторін.\n\nХоча незрозуміло, коли і як відбулася мілітаризація синархістської партії, вони становлять реальну та безпосередню загрозу для нинішнього уряду.\n\nГромадянська війна на порозі."
 tfv_new_zealand.1.desc:0 "Революція досягла успіху в державі [From.GetNameDef]! Новий комуністичний уряд узяв на себе відповідальність за країну і прагне членства в Комінтерні."
 tfv_raj.1.desc:0 "По всій імперії в місцевих громадах було організовано збори коштів на нові винищувачі для Королівських ВПС. Багаті особи також робили внески на придбання літаків для армії. Нізам Гайдарабада пожертвував достатньо грошей, щоби профінансувати купівлю 2 повних ескадрилій. Питання в тому, де їх розмістити."
 tfv_raj.34.t:0 "Свобода для Індії"
 tfv_raj.44.desc:0 "Цей день знаменує початок нової доби в історії Індії. Після століть під іноземним пануванням ми нарешті досягли повної незалежності. Місцеві [ENG.GetAdjective]і держслужбовці отримали наказ допомогти в переході до [RAJ.GetAdjective]ого самоврядування та будуть відправлені додому протягом наступних кількох місяців.\n\nІз допомогою наших нових [GER.GetAdjective]их друзів ми тепер можемо зосередитися на завданні, яке стоїть перед нами — побудові держави для нашого народу."
 tfv_south_africa.10.a:0 "Нам слід підступити до німців."
 tfv_south_africa.11.b:0 "Надішліть їм танки."
 tfv_south_africa.16.desc.b:0 "Після довгих обговорень з нашими [HOL.GetAdjective]ими друзями, вони погодилися надіслати нам партію експериментальних легких танків. Хоч їх і небагато, але саме вони можуть вирішальним чином схилити чашу терезів на нашу користь."
 tfv_south_africa.32.t:0 "[From.GetNameDefCap] відмовляє"
 tfv_south_africa.50.t:0 "Підтримка для Іспанії"
 tfv_south_africa.64.c:0 "$tfv_south_africa.60.c$"
 tfv_south_africa.77.d:0 "Звільнившися з-під влади колоніальних гнобителів, [RWA.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [RWA.GetAdjective]ого уряду."
 tfv_south_africa.89.t:0 "Свобода для держави [GHA.GetName]"
