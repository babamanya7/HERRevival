 GUAY_the_stuff_of_legends_desc:0 "Те, що починалося як мрія, стало реальністю. Під нашим керівництвом ми отримали міцний контроль над континентом та сформували унікальну ідентичність. Це буде записано в підручниках історії та стане тим, з чого складаються легенди."
 GUAY_urbanization_desc:0 "Щоб вивести наших громадян із бідності, ми приведемо їх до великого міста, де можна знайти доступ до більшого багатства та освіти."
