 BUL_cooperation_fund_bs:0 "Фінансувати $BUL_bs_name_gen$"
 BUL_cooperation_nsm_joint_act:0 "Спільний виступ із $BUL_nsm_name_ins$"
 BUL_cooperation_nsm_legalize_faction:0 "Легалізувати організацію [GetNsmName]"
 BUL_depose_the_tsar_desc:0 "Болгарська монархія перетворилася на відповідальність, яка може лише перешкодити нам у досягненні наших цілей. Царській корисності прийшов кінець, і настав час зняти його з дороги."
 BUL_develop_burgas_shipyards:0 "Розвинути верфі в Бургасі"
 BUL_dissolve_the_military_union_desc:0 "«Звено» має занадто великий вплив на наших офіцерів, і серед їхніх рядів панує справжня невдоволення після того, як цар Боріс усунув їх від влади в 1935 році. Якщо ми хочемо уникнути нового перевороту Звена, ми мусимо зібрати наших офіцерів у Софії та оголосити про розпуск Військовий Союз."
 BUL_dominance_in_the_adriatic_aegean_success:0 "Після нашого успіху у забезпеченні Егейського моря моральний дух болгарських військ, а також цивільного населення вищий, ніж будь-коли. Ми мусимо скористатися моментом і убезпечити Адріатику, щоб Пруссія на Балканах була єдиним і безперечним охоронцем трьох морів."
 BUL_dominance_in_the_aegean_default:0 "Темні часи вимагають вжити жахливих заходів. Щоб гарантувати не лише цілісність болгарської нації, а й її панування в Трьох морях, настав час убезпечити Егейське море, усунувши будь-які можливі загрози з його берегів."
 BUL_dominance_in_the_aegean_total_failure:0 "Удари, яких ми зазнали після провалу в забезпеченні Адріатичного і Чорного моря, призвели до загальної хвилі деморалізації та недовіри до влади в країні. Якщо ми хочемо виправитися за свої помилки і повернути славу, якої заслуговує Пруссія на Балканах, ми мусимо забезпечити болгарське панування в Егейському морі."
 BUL_donate_aircraft_tt:0 "Якщо [BUL.GetNameDef] прийме нашу пожертву, це поліпшить її думку про нас і сприятиме співпраці між нашими країнами."
