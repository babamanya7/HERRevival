 POR_research_agreements_desc:0 "Ми повинні укласти угоду з Німеччиною, яка надасть нам доступ до її передових військових технологій, що прискорить наші дослідження та дозволить нам розгорнути краще обладнання на полі бою."
 POR_ship_anti_air_2:0 "40-мм/40 двофунтова гармата"
 POR_support_a_spanish_monarchy_in_the_war_desc:0 "Не те, щоби ми дуже цінували карлістів, але, звичайно, іспанська монархія була б набагато кращою, ніж присутність фашистського чи комуністичного режиму на півострові. Треба віддавати перевагу меншому злу..."
 POR_unstable_republic_desc:0 "Епоха Республіки, оголошена в 1910 році, описується як час «нескінченної анархії, корупції в уряді, бунтів і пограбувань, вбивств, арештів і переслідування на релігійному ґрунті». Республіка пережила інаугурацію дев'яти президентів, 44 реорганізації кабінету, 21 революцію. Навіть після військового перевороту 1926 р. сталося кілька невдалих переворотів."
