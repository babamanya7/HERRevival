 idea_SIA_songsuradet_ascendant_0_desc:0 "Успішно переживши гнів уряду, Пхрая Сонгсурадет зміцнив свої позиції і вийшов із ситуації ще сильнішим. Тепер він те, що люди назвали б «недоторканним», занадто відомим і вкоріненим, щоб його позбутися.\nВін, швидше за все, втручатиметься в урядову політику, сповільнюючи прийняття рішень, щоб переконатися, що він знову не стане мішенню чисток."
