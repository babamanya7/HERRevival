 tsr_manchukuo_border_war.2.b:0 "Калган стоїть!"
 tsr_manchukuo_border_war.3.desc:0 "Після тріумфального маршу [MAN.GetAdjective]ої армії до Пекіна, [CHI.GetAdjective]а армія відступила на південь до більш зручних для оборони позицій."
 tsr_manchukuo_border_war.5.desc:0 "Після повного захоплення Хебею було досягнуто перемир'я з домовленістю, що [MAN.GetAdjective]а армія не просуватиметься далі вглиб китайських земель без провокації."
 tsr_the_true_china:0 "Справжній Китай"
 tut_13_text_1:0 "Ви перемогли! Війна завершена, а Ефіопія переможена.\n\nУ мирний час Ви можете захотіти §Yпереправити війська§! через океан, щоби розмістити їх в інших місцях: можливо, для підготовки до війни.\n\nТепер, коли Ефіопія переможена, Вам не потрібно втримувати тут так багато дивізій.\n\nОберіть принаймні §Y4 дивізії§! та перемістіть їх у §Yвказаний порт§!, §Gклацнувши правою кнопкою миші§! по провінції."
 tut_1_zoom:0 "Наблизити\nВіддалити"
 tut_4_text_1:0 "Добре! Створення армії — це перший крок.\n\n§YАрмії§! можна призначити наказ за допомогою намалювання §Yпланів бою§!.\n\nКлацніть по кнопці §YЛінія фронту§!, а далі клацніть на кордон з Ефіопією. Наведіть курсор по кнопці §YЛінія фронту§!, щоб дізнатися подальшу інформацію, як малювати лінії фронту. Якщо Ви захочете видалити лінію фронту, клацніть по кнопці §YВидалити наказ§!."
 type_ii_class:0 "Тип II"
 uk_asia_focus:0 "Укріпити Східну Азію"
 uk_burma_focus_desc:0 "Ми мусимо допомогти китайцям у їхній боротьбі проти Японії, побудувавши дорогу — і пов'язану з нею інфраструктуру — між Бірмою і Китаєм, щоб вантажі могли надходити до них суходолом, у безпеці від японського хижацтва."
 uk_scandinavian_focus_desc:0 "Скандинавія не мала б великого стратегічного імпорту, якби не одна річ — шведський експорт заліза. Ми мусимо чинити тиск як на Швецію, так і на Норвегію, щоб не допустити потрапляння цього життєво важливого ресурсу до Німеччини. Якщо вони відмовляться, нам доведеться бути готовими до вторгнення..."
 unite_guiana:0 "Об'єднати Гвіану"
 united_guiana_communism_DEF:0 "Гвіанська радянська соціалістична республіка"
 united_guiana_fascism_ADJ:0 "Гвіанськ"
 united_guiana_neutrality_DEF:0 "Велике царство Ельдорадо"
 united_ma_clique_tag_communism:0 "Хуейська народна республіка"
 united_mahgreb_neutrality_DEF:0 "Магрибський емірат"
 uniter_of_akhand_bharat:0 "Об'єднувач Акханд Бгарату"
 unscrupulous_orchestrator_no_lar:0 "$unscrupulous_orchestrator$"
 upgrade_army_department_desc:0 "§LНам надзвичайно важливо мати розвіддані про війська супротивника. Також необхідно заснувати відділ військової розвідки. Наші агенти навчатимуться впровадженню у ворожу армію, будуть служити солдатами і генералами і передавати нам секрети, знайдені в тилу ворога.§!"
 upgrade_commando_training:0 "Тренування командос"
 usa.10.d:0 "Незважаючи на те, що багато аспектів Нового курсу [Root.GetLeader] зберіг, Рузвелт усе ще бачить можливість втілити свої початкові плани щодо подальшого розвитку програм у реальність. Незважаючи на погіршення стану здоров'я, йому вдалося зберегти значну частину підтримки, завдяки якій він раніше був президентом, і тепер знову проводить кампанію за демократів.\n\n[Root.GetLeader] стверджує, що зміна керівництва в складній ситуації в Америці призведе до бути безвідповідальним, що є певною іронією, оскільки така ж заява була зроблена до його попередньої перемоги над Рузвелтом. Незважаючи на це, він може мати рацію."
 usa.17.t:0 "[From.From.GetName] оголошує війну державі [From.GetName]"
 usa.20.a:0 "У наших серцях ми завжди будемо [Root.GetAdjective]им народом."
 usa.45.desc:0 "Результатом останнього раунду слухань у Комітеті Палати представників із шляхів і засобів є звіт, у якому політика Президента заслуговує на значне поліпшення всіх доступних показників економіки. Не дивлячись на відверту похвалу, звіт, тим не менш, стає ударом для тих, хто критикував Президента та вимагав реформ.\n\nБагато представників уже публічно заявили, що хоча вони все ще сумніваються щодо порядку денного Президента, вони тепер будуть голосувати на підтримку."
 usa.61.b:0 "Пахне корупцією."
 vanguard_class:0 "Клас «Vanguard»"
 volunteers_allowed_intro:0 "£GFX_trigger_yes£ Може надсилати добровольчі війська державі"
 volunteers_initiator_extended_desc:0 "У державі $COUNTRY2|Y$ є добровольці з держави $COUNTRY1|Y$."
 war:0 "Війна"
 war_declaration_rule_independent_countries_only:0 "Оголошувач є незалежний"
 war_justification.201.d:0 "«Чи належить [ROOT.GetName] до [ROOT.GetAdjective]? Поставмо собі краще питання: чи належить майбутнє [ROOT.GetAdjective]ій державі, чи [From.GetName]?»\n\n[From.GetLeader] у своїй сьогоднішній промові припустив, що [From.GetName] знаходиться на шляху до війни. Політична напруженість зростала протягом останнього місяця і, здається, [From.GetAdjective]ий народ погодився з тим, що війна неминуча. [ROOT.GetName] також повинен підготуватися."
 war_justification.218.t:0 "[ROOT.GetLeader] ставить під сумнів мотиви [From.GetName]"
 war_justification.6.d:0 "«Чи є більша брехня, ніж уявна свобода [From.GetAdjective]их людей? Там, де вони колись були рабами під владою князів і герцогів, які претендували на володіння землею, тепер вони змушені продавати свою працю тим, хто претендує на володіння фабриками. Їхню свободу обирати одного господаря замість іншого навряд чи можна назвати свободою. Так само їхня свобода обирати своїх лідерів є фальшивим вибором, оскільки пропаганда ніколи б не дозволила справжнім соціалістам прийти до влади. Народ, настільки ретельно індоктринований, може бути врятований лише [ROOT.GetAdjective]им втручанням».\n\n[ROOT.GetLeader] довгий час полемізував проти уряду в [From.GetName] на партійних зборах, але зараз ця риторика все частіше використовується публічно. Існує мало підстав вважати, що цей конфлікт може бути вирішений мирним шляхом."
 war_reparation_receiver_desc:0 "Держава $COUNTRY|UY$ отримує цивільні заводи в якості військових репарацій."
 water_deep_ocean_icon:0 "GFX_modifiers_terrain_icons:2"
 wilhelmina:0 "Вільгельміна"
 wtt_border_incident_defender_warning.1.desc:0 "Раніше вчора [their_country.GetAdjective]і солдати були помічені при перетині кордону з області [attacker_state.GetName] в [defender_state.GetName]. Протягом ночі більше [their_country.GetAdjective]их сил «вилилося» туди та зайняли оборонні позиції на нашій території.\n\nЦе слідує за серією незначних сутичок і порушень кордону силами під командуванням [their_country.GetLeader] уздовж нашого спільного кордону.\n\nОднак цього разу очевидно, що [their_country.GetAdjective]і сили тут думають залишитися. Ми мусимо якомога швидше направити сили в область, щоби перевірити їхнє просування."
 wtt_britain.24.b:0 "Нагорода не варта такої ціни."
 wtt_burma_road.4.desc:0 "Сьогодні в Юньнань прибула перша транспортна колона знову відкритою бірманською дорогою. На повне відновлення вантажопотоку піде якийсь час, але постачання вже почалося."
 wtt_china_shared.14.desc:0 "[From.GetLeader] залишив наше прохання без відповіді. Декотрі високопоставлені американські військові виявили бажання прийняти призначення, але військовий міністр і президент [From.GetLeader] наклали вето на цю пропозицію, назвавши її непрактичною й такою, що не відповідає національним інтересам."
 wtt_germany.1003.a:0 "Як недоречно..."
 wtt_germany.15.t:0 "Польща приймає пропозицію"
 wtt_germany.52.desc:0 "Демократичні сили у державі [From.From.GetName] розпочали громадянську війну з метою провести вільні вибори та повернути владу народу. Їм може бути потрібна наша допомога, і в разі успіху вони стануть нашими союзниками."
 wtt_germany.999.b:0 "Ми так не думаємо."
 wtt_hanoi_route.2.desc_war_with_from:0 "[From.GetAdjective]і війська, що окупували Ханой, перехопили низку вантажних транспортів, які перевозили вантажі нам. Судна, які досі перебувають у морі, розвертаються і прямують до нейтральних гавань.\n\nПодальші поставки цим шляхом неможливі."
 wtt_japan.111.t:0 "Троїстий пакт підписано"
 wtt_japan.12.t:0 "[From.GetNameDefCap] приймає пакт про ненапад"
 wtt_news.11.a:0 "Невже нарешті відтіснили їх якнайдалі?"
 wtt_news.19.t:0 "Польща повертає Данциг і Познань"
 wtt_news.24.b:0 "Вони дотримали слова."
 wtt_news.3.a:0 "Хай живе кайзер!"
 wtt_news.32.t:0 "Чан Кайші відпущено з-під домашнього арешту"
 wtt_news.41.d:0 "Флот відрізаний на дальній стороні!"
 wtt_news.41.desc_not_usa:0 "Держава [From.GetNameDef] провела сміливу та блискучу операцію, перекривши важливий комунікаційний шлях, що проходить крізь Суецький канал. При цьому вона скористалася затопленими суднами, підривними зарядами та мінами. Пошкодження досить великі, і швидше за все, відновні роботи займуть місяці."
 wtt_news.42.desc:0 "Завдяки неймовірним зусиллям державі [From.GetNameDef] вдалося відновити Суецький канал. Сьогодні вранці, лише через півроку інтенсивних робіт, відбулося повторне відкриття важливої комерційної артерії Середземномор'я."
 wtt_news.44.d:0 "Ось це повернення."
 wtt_news.45.b:0 "Вражаючий успіх."
 wtt_news.45.c:0 "Усе краще насильства."
 wtt_news.50.b:0 "Ситуація не поліпшала."
 wtt_news.54.a:0 "Об'єднана Північ стане сильніша!"
 wtt_news.55.desc:0 "Заволодівши всіма землями, що колись належали старої Великої Колумбії, [From.GetOldAdjective]а держава розпочала реінтеграцію нових територій. Щоб заручитися широкою підтримкою населення, було проведено націоналістичну кампанію пропаганди з недвозначним закликом підтримати уряд.\n\nПредставники [From.GetOldAdjective]ої влади неодноразово стверджували, що всі країни на півночі Південної Америки мусять згадати свою спільну історію та створити об'єднану державу. Тепер [From.GetOldAdjective]ий уряд зробив ще один крок до цієї мети, заявив про «відродження спадщини Болівара» і змінив назву країни на «[From.GetNameDef]»."
 wtt_news.59.t:0 "Відродження держави [From.GetNameDef]"
 wtt_news.60.desc:0 "Заволодівши всіма землями, що належали балтійським державам, [From.GetOldAdjective]а держава розпочала реінтеграцію нових територій. Щоб заручитися широкою підтримкою населення, було проведено націоналістичну кампанію пропаганди з недвозначним закликом підтримати уряд.\n\nЯк висловився представник [From.GetOldAdjective]ої влади, «балтійські країни здавна тяглися одна до одної, і цілком природно, що вони прагнуть об'єднання, особливо у світлі загрози біля своїх кордонів. Тільки разом наші народи можуть зберегти незалежність та свободу». Уряд заявив про «істинно балтійську єдність» і змінив назву країни на «[From.GetNameDef]»."
 wtt_news.8.desc:0 "Спустошена Німеччину громадянську війну закінчено. Через запеклий опір нацистів битви часом досягали масштабів Великої війни.\n\nГітлер, швидше за все, мертвий, а нацистські керівники взяті в полон або страчені. Тимчасовий уряд заявив, що необхідно спочатку забезпечити контроль над державою та стабільну обстановку, а вже потім розпочинати конституційні реформи."
 wtt_news.9.d:0 "Вони не допомагають розрядити обстанову..."
 wtt_political_organisation.10.a:0 "Неприйнятно."
 wtt_political_organisation.11.t:0 "Повідомлення з області [state.GetName]"
 wtt_political_organisation.2.desc:0 "За повідомленнями від наших джерел із області [state.GetName], [majority_country.GetNameDef] проводить сплановану акцію, щоби заручитись додатковою підтримкою. Їх, як і раніше, підтримує переважна кількість громадян."
 wtt_political_warlord_support.2.desc:0 "В особистому посланні лідеру [Root.GetLeader] правитель [warlord_asked_for_support.GetLeader] дякує нам за щедру підтримку його адміністрації. Далі у листі йдеться, що після довгих роздумів [warlord_asked_for_support.GetLeader] дійшов висновку, що на користь Китаю загалом буде краще, щоб у оформленні його політичного майбутнього велику роль зіграв лідер [Root.GetLeader].\n\nУ підсумку [warlord_asked_for_support] обіцяє з цього часу підтримувати нас у нашій політичній боротьбі."
 wtt_political_warlord_support.22.a:0 "Вони нам знадобляться."
 wtt_political_warlord_support.3.t:0 "[warlord_asked_for_support.GetNameDefCap] відмовляється"
 wtt_the_hump.3.a:0 "$wtt_burma_road.3.a$"
 wtt_warlord.3.t:0 "[From.GetNameDefCap] відмовляється"
 wuw_GER_civil_war.2.desc:0 "Група комуністичних партизанів здійснила напад на в'язницю в Бауцені, звільнивши відомого комуніста та колишнього лідера КПН Ернста Тельмана. Його партійний суперник Вальтер Ульбріхт назвав цю акцію терористичним актом, ймовірно, побоюючись, що популярний Тельман знову очолить партію."
 wuw_GER_diplomacy.111.desc:0 "Дипломати з [FROM.GetNameDef] наполягають на підписанні Договору про розвиток економічних відносин між Німеччиною та Румунією. Вони стверджують, що ця угода вигідна обом сторонам: їм потрібні наші природні ресурси, а ми отримаємо вигідніші умови на німецьке озброєння. Угода не здається нам настільки вигідною, як її подають німці, але відмова напевно розгніває їх..."
 wuw_GER_diplomacy.119.t:0 "[FROM.GetNameDefCap] відмовляється підкоритись"
 wuw_GER_diplomacy.36.desc:0 "Ми ясно дали зрозуміти [FROM.GetNameDef], що передача наших колоній не є предметом обговорення. Проте вони вперто відмовляються визнати очевидну істину. Нам доведеться шукати інші способи повернути те, що по праву належить нам."
 wuw_GER_diplomacy.53.b:0 "Вигоду отримає лише одна сторона..."
 wuw_GER_diplomacy.67.b:0 "Це неетично!"
 wuw_GER_diplomacy.68.b:0 "Добре. Та спершу — терпіння."
 wuw_GER_diplomacy.71.a:0 "Це в інтересах народу."
 wuw_GER_diplomacy.76.a:0 "Це ціна за нашу свободу."
 wuw_GER_diplomacy.85.desc:0 "Ми отримали різко сформульовану вимогу від [FROM.GetAdjective]. Їх не влаштовує рівень поточної співпраці — вони хочуть повної інтеграції. Наслідки відмови не зазначені, але очевидно, що слід бути обережними."
 wuw_GER_diplomacy.90.b:0 "Ми не будемо себе обмежувати"
 wuw_GER_realpolitik.12.t:0 "[FROM.GetNameDefCap] відкидає наші вимоги"
 wuw_GER_realpolitik.18.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що [FROM.GetAdjective] нація поверне нам наші старі східні імперські володіння. Нарешті історичні несправедливості Версаля скасовано!"
 wuw_GER_realpolitik.28.t:0 "Громадянська війна в [ROOT.GetNameDef]"
 wuw_GER_realpolitik.29.t:0 "Громадянська війна в [ROOT.GetNameDef]"
 wuw_GER_realpolitik.3.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] з великим обуренням відповів на нашу пропозицію про альянс і заявив, що жодне партнерство між нашими країнами не можливе ні зараз, ні в майбутньому. Вони думають, що ми якісь загарбники?"
 wuw_GER_realpolitik.33.a:0 "Надто вигідна пропозиція, щоб відмовитися"
 wuw_GER_realpolitik.35.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] рішуче відкинув нашу пропозицію про інтеграцію, заявивши, що жодне економічне зближення між нашими державами неможливе ні зараз, ні в майбутньому. Схоже, вони здогадалися про наші справжні наміри..."
 wuw_GER_realpolitik.39.a:0 "Час повернути нашу спадщину!"
 wuw_GER_realpolitik.39.t:0 "[FROM.GetNameDefCap] запрошує нас до альянсу"
 wuw_GER_realpolitik.44.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] з обуренням відкинув наше запрошення до альянсу, заявивши, що жодне партнерство між нашими країнами неможливе. Схоже, вони не хочуть нашої допомоги у поверненні австро-угорських земель..."
 wuw_GER_realpolitik.47.a:0 "Чудово"
 wuw_GER_realpolitik.60.a:0 "Нам доведеться це прийняти"
 wuw_GER_realpolitik.8.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що [FROM.GetAdjective] нація підкоряється нашій владі, оскільки не має змоги протистояти нам, а боротьба лише принесе страждання їхньому народу."
 wuw_GER_reichskommissariats.13.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.19.t:0 "Керівництво Кляйн-Фенедігу"
 wuw_GER_reichskommissariats.21.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.23.desc:0 "Після захоплення стратегічної зони Західного узбережжя США постало питання, як слід чинити з цим регіоном. Деякі плани включають його до складу Північної Америки, інші пропонують приєднати до Колумбуса. Дехто навіть виступає за передачу території [JAP.GetNameDef]. Що скажемо?"
 wuw_GER_reichskommissariats.5.desc:0 "Ми встановили нову цивільну адміністрацію в Остланді..."
 wuw_GER_weltpolitik.7.b:0 "Ми не можемо це прийняти — до зброї!"
 wuw_HUN_a_hungarian_galicia_desc:0 "Колись Галичина та Буковина перебували під управлінням Цислайтанії, але тепер, коли ми є домінуючим партнером у імперії, було б логічно, щоб саме ми управляли та охороняли ці території."
 wuw_HUN_a_new_pride_of_the_fleet_desc:0 "Історія нашого флоту — це історія випробувань і зрад. Щоб повернути гордість, наші адмірали пропонують побудувати новий флагман — символ національного відродження."
 wuw_HUN_abide_by_the_little_ententes_stipulations_desc:0 "З моменту завершення Великої війни Мала Антанта, що складається з Румунії, Чехословаччини та Югославії, наполягає, що ми ніколи більше не можемо мати Габсбурзького короля. Відверто кажучи, це нам навіть на руку, адже ми маємо іншого кандидата на трон."
 wuw_HUN_aid_the_carlist_struggle_desc:0 "Іспанські карлісти борються за відновлення традиційної монархії. Якщо ми хочемо союзника в регіоні, слід підтримати цю близьку до нас ідеологічну силу в їхній боротьбі під час громадянської війни в Іспанії."
 wuw_HUN_budapest_university_of_technology_and_economics:0 "Розширити Технічний університет Будапешта"
 wuw_HUN_crack_down_on_radicals:0 "Придушити радикалів"
 wuw_HUN_dissolve_the_volksbund_desc:0 "Фольксбунд — організація етнічно [GER.GetAdjective]их громадян у нашій країні, пов’язана з DNSAP. Вона фінансується з [GER.GetNameDef] і виконує тамтешні доручення. Ми повинні її розпустити, поки вона не дестабілізувала нашу державу."
 wuw_HUN_establish_the_mavag_army_division_desc:0 "Королівські заводи заліза, сталі та машин MÁVAG постачають нашій армії багато озброєння. Ми повинні розширити їхні потужності для виробництва штурмових гармат і зенітних танків."
 wuw_HUN_magyar_kiralyi_csendorseg_desc:0 "Ми повинні розширити жандармерію та надати їй більше автономії у боротьбі з повстаннями та ворожими диверсіями."
 wuw_HUN_news_events.4.a:0 "Їх потрібно знищити!"
 wuw_HUN_politicize_the_levente_associations:0 "Політизувати асоціації Левенте"
 wuw_HUN_promote_hungarianism:0 "Пропагувати гунгаризм"
 wuw_HUN_quantity_over_quality:0 "Якість понад кількість"
 wuw_HUN_restore_the_lombardo_venetian_kingdom:0 "Відновити Королівство Ломбардія-Венеція"
 wuw_HUN_restore_the_lombardo_venetian_kingdom_desc:0 "Королівство Ломбардія-Венеція було складовою частиною нашої імперії з 1815 до 1866 року, допоки його не захопило новостворене Королівство Італія під час Третьої італійської війни за незалежність. Настав час повернутися на півострів і спробувати відновити владу Габсбургів над цими старими коронними землями."
 wuw_HUN_seek_an_alliance_with_the_kaiser_desc:0 "Із відновленням старої [GER.GetAdjective] імперії буде розумним відновити наші старі зв’язки з [GER.GetLeader], щоб виправити лихо, яке нам обом було заподіяне наприкінці Великої війни."
 wuw_HUN_the_hungarian_life_and_renewal_party_desc:0 "Щоб краще контролювати суспільство, наш прем'єр-міністр має створити нові політичні партії як авангард проти радикальної лівиці."
 wuw_HUN_the_old_habsburg_king_desc:0 "Архикнязь Йосиф Август був останнім палатином Угорщини та регентом Карла до його зречення під тиском Антанти. Тепер він готовий повернутися на трон як король Угорщини. Його досвід фельдмаршала буде надзвичайно цінним."
 wuw_HUN_undermine_the_volksbund:0 "Підірвати фашистські парамілітарні формування"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil:0 "Weiss Manfréd WM-23 Ezüst Nyíl"
 wuw_HUN_wherever_the_cross_points_desc:0 "Символ нашого руху — хрест зі стрілами. Угорщина повинна повернути своє право народження та розширюватись у всіх напрямках, куди вказують стріли. Настав час повернути те, що по праву належить нам!"
 ww_BEL_event_diplomatic.10.t:0 "Франція прийняла!"
 ww_BEL_event_diplomatic.11.b:0 "Тож вони вибрали війну!"
 ww_BEL_event_diplomatic.12.t:0 "[FROM.GetNameDefCap] Просить нашу допомогу"
 ww_BEL_event_diplomatic.26.a:0 "Заради кращого майбутнього [FROM.GetFactionName]"
 ww_BEL_event_diplomatic.28.t:0 "[FROM.GetNameDefCap] Відмовляє від обмеженої федералізації"
 ww_BEL_event_diplomatic.29.t:0 "Отто фон Габсбург пропонує свою підтримку"
 ww_BEL_event_diplomatic.36.a:0 "Чудово!"
 ww_BEL_event_diplomatic.7.a:0 "Ні, Кале для нас цінніше."
 ww_BEL_event_diplomatic.9.a:0 "Знову доведеться оновлювати наші карти..."
 ww_BEL_event_political.7.t:0 "Дострокові вибори"
 ww_BEL_event_spanish_interaction.4.desc:0 "Нам повідомили, що кілька годин тому в [FROM.GetNameDef] відбувся мітинг і промова на нашу підтримку. Керівництво [FROM.GetAdjective] знову підтвердило свою підтримку нас, сподіваючись, що це дасть нам більше можливостей діяти, оскільки наш народ отримує більше віри в нас."
 ww_BEL_event_spanish_interaction.6.a:0 "Чудова ідея!"
 ww_BEL_event_spanish_interaction.7.desc:0 "Відповідь [FROM.GetAdjective] на нашу пропозицію щодо утворення [ROOT.GetFactionName] була ствердною. Ми будемо разом стояти проти націоналістичної загрози!"
 ww_BEL_event_war.4.b:0 "Забезпечити легітимну лінію з Шарлем"
 ww_congo.15.a:0 "Дурні!"
 ww_congo.29.b:0 "Немає причин втручатися"
 ww_congo.35.b:0 "Час Африки настав"
 ww_congo.36.t:0 "[FROM.GetName] відхиляє мирну пропозицію"
 ww_congo.38.a:0 "Героїчна перемога проти імперіалізму!"
 ww_congo.43.b:0 "Ми їм покажемо!"
 ww_congo.55.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], відмовився передати нам території з великою кількістю бурундійців. Як ми повинні відповісти на гноблення наших людей чужими державами?"
 ww_congo.56.t:0 "[FROM.GetLeader] вимагає об'єднання народу Руанди"
 ww_congo.59.a:0 "Це можливість, яку не можна пропустити"
 ww_congo.65.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], відмовився від нашої пропозиції щодо контрабанди урану до їх країни за певну ціну, стверджуючи, що вони не опустяться до рівня міжнародного злочинця."
 zastava_arms:0 "Zastava Oružje"
