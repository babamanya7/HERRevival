 engine_1_6x_desc:0 "Маючи шість двигунів, кожен літак можна змусити нести значний вантаж на великі відстані з пристойною швидкістю."
 entrenched_old_guard_spirit:0 "Закріплена стара гвардія"
 expand_german_coal_mines:0 "Розширити вугільні шахти в області [FROM.GetName]"
 expand_iceland_bases_goal_desc:0 "Розширення баз в Ісландії дозволить нам краще захистити Данську протоку та посилити вплив на коридор Північної Атлантики."
 expand_the_luftwaffe_desc:0 "Версальський договір не дозволяв Німеччині утримувати військово-повітряний флот, тому нам довелося створювати Люфтваффе за рекордно короткий час. Ми багато зробили, але ще більше належить зробити. Продовжуйте посилювати Люфтваффе і перетворите ці війська на провідні ВПС."
 fake_intel_plant_evidence_outcome:0 "Проведена нами операція увінчалася успіхом, і противник зібрав безліч доказів, що вказують на нас. Перші звіти повідомляють, що деякі війська вже були переміщені."
 fake_intel_press_releases_outcome:0 "Наш відділ пропаганди забезпечив потрібне нам освітлення у дружній та нейтральній пресі."
 fall_rot_desc:0 "Тепер ми готові здійснити вторгнення до Франції по широкому фронту. Рухайтеся на південь, перейдіть Марну і захопіть Париж. Необхідно також зайняти узбережжя Ла-Маншу, а при першій нагоді — обійти і знищити лінію Мажіно."
 fall_weiss_desc:0 "Необхідно розпочати вторгнення до Польщі. Серед ключових стратегічних цілей: Варшава, Краків і Львів. Ми маємо якнайшвидше створити наземний коридор для перекидання наших військ у Східну Пруссію. Тим часом потрібно будь-якою ціною захищати наш кордон із Францією. Не дайте Мозелю або Вюртембергу потрапити до рук французів!"
 fascism:0 "Фашизм"
 fighter_ace_initiative_desc:0 "Видаючи нагороди та звання пілотам, які отримали статус асів за п'ять збитих літаків ворога, ми заохочуємо ризиковані дії і наділяємо їх почуттям приналежності до еліти. Щоправда, це означає, що досвідчені пілоти продовжуватимуть бойові вильоти."
 finland.1.b:0 "Нехай приходять, якщо наважаться!"
 finland.2.d:0 "Фінляндія і Радянський Союз перебувають у стані війни. Після лише кількох десятиліть суверенітету ми знову ризикуємо стати підданими одного з наших сусідів.\n\nЗагроза нашого ворога, однак, виходить за межі наших кордонів. Наші сусіди у Швеції все ще зберігають нейтральну позицію щодо Радянського Союзу, але, можливо, їх можна було б переконати приєднатися до нас у захисті нашої спільної спадщини і забезпечити свій власний стратегічний буфер."
 finland.2.t:0 "Запит на шведську допомогу в війні"
 flag_franco_british_union:0 "Франко-британська унія"
 flag_second_mexican_civil_war:0 "Друга громадянська війна в Мексиці почалася"
 floating_airfield:0 "Плавучі аеродроми"
 floating_airfield_desc:0 "Поліпшена інтеграція авіаносців у наш флот дозволяє нам завдавати ударів з моря і повітря. Це — ключ до забезпечення переваги в повітрі скрізь, де б ми не були."
