 JAP_purge_the_kodoha_faction:0 "Чистки у фракції «Кодоха»"
 JAP_rely_on_supremacy_of_the_will_desc:0 "Генерал Хідекі Тоджьо якось запропонував, що війни слід вигравати вирішальними попереджувальними ударами, а битви — славетними масовими атаками та перевагою волі. Ми повинні підтримати цю ідею, оскільки вона добре відповідає нашій нинішній військовій доктрині."
 JAP_reorganized_national_government:0 "Реорганізований національний уряд"
