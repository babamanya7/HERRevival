l_polish:
 325_yunnan_points:0 "([?325.state_political_support_value|+0]) "
 AAT_MIO_events.2.a:0 "Інвестувати у $CZE_skoda_shipyards$."
 AAT_Sweden.11.desc:0 "Після початку бойових дій між державами [SWE.GetNameDef] та [GER.GetNameDef] німецьким військовим вдалося тимчасово захопити заводи Landsverk і забарикадуватися всередині комплексів. Очікується, що військові візьмуть контроль над комплексом у належний час, але під час сутички було завдано певних пошкоджень, і, таким чином, фабрики деякий час не працюватимуть у повному обсязі.\nНебагато відомо про фабрику Landsverk, розташовану в самій Німеччині, але шведська влада не має сумнівів, що у відповідь на це вона буде захоплена [GER.GetAdjective]им урядом."
 AAT_Sweden.21.b:0 "Чудова пропозиція."
 AAT_Sweden.25.a:0 "Рейнджери будуть найефективнішими, враховуючи наш рельєф."
 AAT_Sweden.38.desc:0 "У безпрецедентному кроці [FROM.GetName] вимагає від нашого уряду передати їм усі свої функції й установи. Наш голова держави висловив рішучий протест їхньому послу, але так сталося, що [SWE.GetAdjective]і лінкори були помічені неподалік від Копенгагена. [DEN.GetAdjectiveCap]ий уряд виявився безсилим відповісти на таку загрозу, і 6 годин по тому було підписано офіційну капітуляцію."
 AAT_Sweden.42.t:0 "[FROM.GetName] відмовляється передавати область [145.GetName]"
 AAT_Sweden.47.desc:0 "Зрозуміло, що «турбота» наших сусідів про їхню безпеку була лише вивертом. Позбавлені волі і втративши стратегічну перевагу, наші військові не були організовані відповідно до нових географічних реалій. Біля нашої столиці були помічені [FROM.GetAdjective]і військові кораблі, [FROM.GetAdjective]і війська перетнули демілітаризовану зону на півночі, а нам було надіслано ультиматум про капітуляцію. Міжнародна спільнота покинула нас."
 AAT_Sweden.7.desc:0 "12 осіб були заарештовані сьогодні біля будівлі Ріксдагу, очевидно, намагаючись прорватися всередину. Коли їх затримала поліція, вони заявили, що просто хотіли прискорити прийняття рішення, заявивши, що соціальні служби, на які вони покладаються, зникли в політичному безладі.\nЇх зупинили у вестибюлі через те, що один із 12 осіб, Рікард Перссон, розшукується поліцією за незаконну контрабанду тютюнових виробів. Перссону довелося скористатися громадською вбиральнею, де його впізнав офіцер і затримав.\nПерссону загрожує 2 роки ув'язнення, решті 11-ти — до 6 місяців і штраф за дрібне правопорушення."
 AAT_Sweden_ball_bearing.1.desc:0 "Наші кулькові вальниці — найліпші у світі, і їх шукають найбільші держави світу для своїх військових машин. Ми розпочинаємо переговори з державою [FROM.GetName], щоб обміняти ці безцінні товари. Але спочатку ми мусимо вирішити, що ми хочемо отримати натомість."
 AAT_Sweden_communism.4.t:0 "[ROOT.GetFascistParty] та військові захоплюють Стокгольм"
 AAT_Sweden_flashpoints.35.c:0 "Наш нейтралітет не похитнути."
 AAT_Sweden_flashpoints.56.t:0 "Готландська пропозиція"
 AAT_Sweden_flashpoints.81.desc:0 "[FIN.GetName] визнає, що дасть Оландські острови, але наразі вони досить обмежені в коштах.\nВони готові надати нам контроль над островами за певну суму з наших державних резервів, щоби компенсувати свої втрачені доходи."
 AAT_Sweden_nationalists.13.a:0 "Давно пора"
 AAT_Sweden_nationalists.19.a:0 "Ми доведемо королю, що не все втрачено для нашої великої нації."
 AAT_Sweden_nationalists.24.a:0 "Складний, але необхідний крок."
 AAT_Sweden_nationalists.4.desc:0 "Націонал-соціалістичний рух надто роз'єднаний, щоби захопити владу в державі [SWE.GetName]. Аби змінити стан речей, рух повинен припинити дрібні чвари та об'єднатися навколо нашого єдиного істинного лідера."
 AAT_Sweden_strike.2.t:0 "Загальнонаціональний страйк"
 AAT_finland_continuation_war.02.desc:0 "[FROM.GetLeader] дає зелене світло нашій військовій співпраці проти держави [SOV.GetNameDef]. Наші офіцери отримали запрошення до міста [FROM.Capital.GetCapitalVictoryPointName], щоб розпочати там координацію об'єднаних збройних сил."
 AAT_finland_diplomacy.10.t:0 "[FROM.GetName] відхиляє наші вимоги"
 AAT_finland_diplomacy.18.t:0 "[FROM.GetName] віддає [GetBalticOrNordic]і території"
 AAT_finland_diplomacy.19.a:0 "З цим нічого не поробиш"
 AAT_finland_kinship_war.05.desc:0 "Останні кілька місяців [FIN.GetAdjective]і війська раз у раз підходили до міст Східної Карелії, щоб знайти способи дестабілізувати регіон і посіяти хаос серед наших гарнізонів. Але відважний опір [SOV.Adjective] військ був занадто сильним. \n\nБагатьох фінських агітаторів і бунтівних карелів було заарештовано, депортовано або вони змушені були втекти назад до Фінляндії, не встигнувши спровокувати повстання. Народ радіє, адже нарешті в регіон повернулося мирне життя!"
 AAT_finland_national_defense.02.b:0 "Добре, але більше не турбуйте мене повідомленнями про схованки."
 AAT_finland_political.02.b:0 "Призначити Кюесті Калліо, у нього є підтримка центристів і демократів!"
 AAT_finland_the_white_death.10.t:0 "Біла Смерть продовжує переслідувати здобич"
 AAT_nordic_cooperation.3.desc:0 "Незважаючи на наші найкращі наміри, здається, що [FROM.GetNameDef] не потребує або не хоче нашу допомогу. Тільки вони знають причини цього загадкового рішення.\n\nЦе не означає, що ми повинні припинити підтримувати їх іншими способами, або що [?FROM.NORDIC_attacker.GetName] може вирішити назвати нас воюючою стороною."
 AAT_nordic_cooperation.5.a:0 "Чудові новини!"
 AAT_norway.5.desc:0 "Інші можуть назвати докази, знайдені в будинку Кнудсена, хиткими, несуттєвими або навіть сфабрикованими, і вони можуть мати рацію, але, можливо, колись, за певних обставин, суддя визнає їх достовірність. Крім того, факт залишається фактом: ми не можемо ризикувати відчуженням «Національної єдності» в даний момент. Ось чому [NOR_lev_trotsky.GetName] був взятий під варту негайно.\n\nКоли і як він знову побачить світ, наразі не має великого значення, але ми подбаємо про те, щоб він принаймні мав кращі умови, ніж у Сибіру."
 AAT_norway.6.t:0 "Доля Троцького"
 AAT_norway_communist.7.desc:0 "Давно минули ті часи, коли [NOR.GetAdjective]а монархія була однією з найулюбленіших королівських родин на континенті. Хоча наполягання короля Гокона займати трон лише після референдуму і його прихильність до доброзичливого нехтування були благородними прагненнями, монархія є монархія, і їй немає місця в рівноправному суспільстві, яке ми сподіваємося побудувати в Норвегії.\n\nКороль Гокон VII і принц Олав, разом з іншими членами королівської сім'ї, були заарештовані і мирно відправлені в дорогу, а їхні конфісковані активи будуть використані для будівництва нашого комуністичного проєкту.\n\n[NOR_GetExiledMonarchyLastParagraph]."
 AAT_norway_rikstanken.4.a:0 "Укладімо торговельну угоду."
 ABDA_events.2.a:0 "Бажаний розвиток подій."
 ABDA_events.3.t:0 "[FROM.GetName] відмовляється приєднатися"
 ABILITY_EXTRA_MEDICS_DESC:0 "Ваша армія тимчасово буде нести менше втрат людських ресурсів у бою."
 ACE_PILOT_WING_SIZE_EFFECT_BIGGER:0 "Ас призначений до крила з більш ніж $DEFINE|0Y$ літаками, тож усі ефекти збільшуються на $MOD|0%Y$ для компенсації."
 AFG_armored_car_equipment_1:0 "ACV-IP I"
 AFG_armored_car_equipment_1_short:0 "ACV-IP"
 AFG_can_core_once_controlled_tt:0 "Відмикає сукупність рішень, яка інтегровує області з претензією по їхньому завоюванні."
 AFG_central_asia_communism_ADJ:0 "Центральноазійськ"
 AFG_chaki_dam_desc:0 "Оскільки попит на електроенергію зростає, ми повинні забезпечити постійне постачання. За допомогою іноземних експертів ми можемо створити гідроелектростанцію на річці Чак, яка могла б забезпечувати навколишній район, включаючи Кабул, електроенергією на роки вперед."
 AFG_concessions_to_pashtuns:0 "Поступки пуштунам"
 AFG_confederation_pak_DEF:0 "Афгано-пакистанська конфедерація"
 AFG_crackdown_on_nomadic_practices:0 "Придушити кочові практики"
 AFG_crushing_the_heirs_of_the_marathas:0 "Придушення спадкоємців маратхів"
 AFG_electrification_tt:0 "\n§YЕлектрифікація почне поширюватися з Кабула з часом, причому одна нова осердна область отримуватиме модифікатор кожні два місяці.§!"
 AFG_expand_karakul_lambskin_industry_desc:0 "Продукти з каракульського хутра є одними з небагатьох товарів, які наразі експортуються у великих кількостях з [ROOT.GetNonIdeologyName]. Ми могли б використати це як можливість для розширення нашої молодої промислової бази шляхом створення фабрик для переробки та експорту таких продуктів."
 AFG_fascism_influence:0 "Іноземний фашистський вплив"
 AFG_fruit_packing_desc:0 "Народ [ROOT.GetNonIdeologyName] — здібні фермери, ми повинні скористатися будь-яким надлишком, який вони виробляють, упаковуючи його для експорту. Для цього ми повинні створити більше промислових переробних потужностей."
 AFG_gw_armored_car_equipment:0 "Lancia 1ZM"
 AFG_industrial_events.14.desc:0 "Зарозумілий [FROM.GetAdjective] режим оголосив про свій намір повалити наш праведний уряд за злочин використання наших природних ресурсів на благо нашого власного народу. Ще не ясно, як вони мають намір здійснити свої погрози, але ми повинні розпочати підготовку до військового вторгнення на нашу територію."
 AFG_industrial_events.59.desc:0 "Уряд [FROM.GetNameDef] відхилив нашу нещодавню мирну пропозицію. Вони явно вважають, що все ще мають можливість витіснити нас з нашої законної території."
 AFG_inyatullah_khan:0 "Інаятулла-хан"
 AFG_mechanized_equipment_3_short:0 "M5 Half-Track"
 AFG_mohammed_daoud_khan_available_as_general_tt:0 "§YМохаммед Дауд Хан§! стає доступним як Генерал §Y2-го§! рівня"
 AFG_political_events.140.a:0 "Юнацького шарму Мохаммада Дауда-хана."
 AFG_political_events.172.t:0 "[FROM.GetNameDefCap] окупує Вазиристан!"
 AFG_political_events.40.a:0 "Ми не в змозі сперечатися."
 AFG_political_events.43.a:0 "Ми будемо стежити за ситуацією."
 AFG_political_events.51.t:0 "$AFG_amunullah_khan$ з [AFG.GetNonIdeologyName] просить допомоги"
 AFG_political_events.52.desc:0 "Уряд [FROM.GetAdjective] відповів на наш запит і з жалем відмовляється надати підтримку відновленню $AFG_amunullah_khan$ на троні [ROOT.GetNonIdeologyName]. Посилаючись на занепокоєння щодо потенційних ускладнень та поточного геополітичного клімату, [FROM.GetAdjective] вирішив зосередитися на інших стратегічних пріоритетах."
 AFG_political_events.70.desc:0 "Лінія Дюранда, встановлена у 1893 році як кордон між Британською Індією та [FROM.GetNonIdeologyName], довгий час була джерелом суперечок. Зі зростанням [FROM.GetAdjective] націоналізму та бажанням об'єднати паштунські племена по обидва боки кордону, уряд [FROM.GetLeader] офіційно відхилив Лінію Дюранда. [FROM.Capital.GetCapitalVictoryPointName] тепер вимагає перегляду кордонів, посилаючись на історичні образи та несправедливий поділ паштунських земель. Вони навіть зайшли так далеко, що погрожують війною, якщо ми не досягнемо угоди."
 AFG_political_events.80.a:0 "Це в наших найкращих інтересах."
 AFG_political_events.85.desc:0 "У таємному повідомленні, [FROM.GetAdjective] уряд звернувся до нас із пропозицією про оборонний пакт. Вони прагнуть взаємної угоди про захист одне одного у разі війни, визнаючи стратегічні переваги партнерства з нами над нашими ворогами. Амбіції Афганістану стати домінуючою силою в ісламському світі можуть узгоджуватися з нашими ширшими геополітичними інтересами."
 AFG_political_events.91.a:0 "Ми повинні придушити повстання та відновити нашу владу."
 AFG_proclaim_the_second_afghan_empire_desc:0 "У 1747 році Ахмад-шах Дуррані об'єднав афганські племена та організував їх в імперію. На своєму піку вона правила більшою частиною Центральної Азії, Східної Індії та Ірану. Вона стояла поруч з Османською імперією як найзначніша ісламська імперія другої половини 18-го століття, і ми повинні відновити цю спадщину!"
 AFG_propose_peace_for_state:0 "Запропонувати мир за §Y[FROM.GetName]§!"
 AFG_purchase_capital_ships_desc:0 "Наш флот починає формуватися з недавнім придбанням менших суден, проте нам все ще бракує військово-морської вогневої потужності більших кораблів, і ми повинні почати шукати будь-які, які ми можемо придбати."
 AFG_rail_construction:0 "Створити Афганську залізничну компанію"
 AFG_rehabilitate_the_saqqawists_desc:0 "Саккавісти успішно повалили декадентське правління Аманулли Хана у 1929 році, але удача відвернулася від них, і вони були майже знищені через кілька років. Можливо, настав час вшанувати цих героїв, які доблесно боролися за захист наших традиційних цінностей."
 AFG_renato_bardolucci:0 "Ренато Бардолуччі"
 AFG_republic_democratic_DEF:0 "Республіка Афганістан"
 AFG_republic_idea_desc:0 "Наша нова республіка запропонує нашому народу більше свободи та рівності, ніж будь-що раніше. Зі збільшенням стабільності ми тепер можемо зосередитися на розвитку освіти та економіки."
 AFG_shadow_operation_in_progress:0 "Операція в процесі"
 AFG_sinkiang_intervention:0 "Втручання у Сіньцзян"
 AFG_state_atheism:0 "Державний атеїзм"
 AFG_state_atheism_desc:0 "Пуштунвалі, Іслам та всі інші традиційні опіати мас мають бути відкинуті, якщо ми хочемо модернізувати економіку та суспільство. Тому ми повинні обмежити ці застарілі практики та просвіщати народ світським чином."
 AGENCY_BRANCHES:0 "Філії агентства"
 AIRWING_MISSION_DAY:0 "Завдання виконуються лише §Hвдень§!."
 AIRWING_MISSION_TYPE_BARRAGE:0 "Вогненний шквал"
