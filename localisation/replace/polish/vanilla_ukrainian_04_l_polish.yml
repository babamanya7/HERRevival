 NORDIC_nuclear_research_desc:0 "Науковці не можуть мовчати про новий світ, який неодмінно приземлиться на нас, коли розщеплення атома нарешті буде використано як зброя. Чому ми маємо бути утримані від цього технологічного дива, яке може спричинити та припинити війну одним ударом наліт."
 NORDIC_railway_expansion_desc:0 "Залізниці — це артерії наших націй, і зараз, як ніколи, нам потрібні якнайширші шляхи транспортування. Тепер, коли ми об'єднані метою, ми повинні бути об'єднані фізично завдяки сталі та швидкості локомотивів."
 NORDIC_second_selector_left:0 "[NORDIC_get_second_selector_left]"
 NORDIC_to_arms_against_tyranny_desc:0 "Плейсголдер"
 NOR_alt_dem_economic_relief_measures_desc:0 "Населення втомлюється від нарощування нашої військової сили. Вони можуть не бачити того, що бачимо ми, і можуть не знати, що потрібна їхня жертва; адже щоби забезпечити перемогу, наша військова машина має йти вперед. Неважливо, поки що ми заспокоїмо їхні потреби."
 NOR_alt_dem_naval_expansion_desc:0 "Розвиток наших військово-морських сил життєво важливий не тільки тому, що це означатиме захист нашої страхітливо великої берегової лінії від загарбників, але й тому, що його можна використовувати як стартовий майданчик для перенесення битви на їхні батьківщини."
 NOR_alt_dem_prioritize_production:0 "Надати пріоритет виробництву"
 NOR_anti_communist_sentiment_ns:0 "Антикомуністичні настрої"
 NOR_appoint_prince_olav_to_army_staff_desc:0 "Тепер, коли королівська родина долучилася до нашого проєкту, ми маємо скористатися їхніми навичками та поставити їх усіх на захист нашого королівства. Якщо ми призначимо принца Олава керівництвом армії, ми можемо гарантувати він може використати свою повну підготовку та досвід і мати справу з нашими ворогами на землі."
 NOR_army_air_force_dmod_desc:0 "Поки що завданням наших новостворених ВПС буде підтримка наших сухопутних військ, куди б вони не йшли, тому поки що немає потреби в окремій ієрархії."
 NOR_communist_civil_war_start_TT:0 "Запускає §Yкомуністичну революцію§!.\n§RЦе призведе до комуністичної громадянської війни проти Демократичної партії.§!"
 NOR_consolidate_kingdom_desc_alt:0 "Now that our rightful queen, Mathilde I, dutifully oversees the extensive lands of our crown, we must look inwards to consolidate our gains and rule over our subjects with velvet gloves and a steady hand."
 NOR_crush_stalin_generic:0 "Розбити червоного ведмедя"
 NOR_democratic_party_long:0 "Робітнича партія"
 NOR_empower_sivorg:0 "Розширити можливості Sivorg"
 NOR_exile_decisions_category_desc:0 "Ми опинилися в найтяжчих обставинах. Після втрати нашої землі ворогом у нас не було іншого виходу, як жити у вигнанні. Ми можемо принаймні бути вдячними за нашого милостивого господаря, і, сподіваюся, одного дня, з їхнім допоможіть, ми знову будемо в нашому улюбленому [NOR.GetNonIdeologyName]."
 NOR_expand_industrial_capacity:0 "Інвестувати в промислові потужності"
 NOR_fascist_deploy_prep_decisions_category_desc:0 "Час переховування закінчився. Ми зібрали достатньо підтримки, щоб почати наше захоплення держави [NOR.GetName]. Тепер ми повинні розгорнути наші приготування на кожній із територій нашої Батьківщини.\n\nМи створили нашу підтримку з нуля, і створили клітини, які готові захопити свої території за командою нашого великого Фьорера та проти боягузливих сил демократії."
 NOR_fascist_dilettante:0 "Фашист-дилетант"
 NOR_fascist_military_collaboration_desc:0 "Фашисти з-за кордону допомогли нам досягти нашого нинішнього режиму, і, на щастя, тепер ми можемо створити тіснішу військову співпрацю майже на рівних."
 NOR_fascist_preparation_decisions_category:0 "Ховається в тіні"
 NOR_field_hospitals:0 "Польові шпиталі"
 NOR_increase_air_production_desc:0 "[NOR.GetName] потребує літаків, і вони потрібні йому зараз! Якщо ми докладемо зусиль до виробництва літаків, тоді ми зможемо захистити себе та пробити оборону ворога."
 NOR_independent_norway_dmod:0 "Незалежна Норвегія"
 NOR_independent_norway_dmod_desc:0 "Ми є незалежними від Швеції з 1905 року, і з того часу ми пройшли довгий шлях. Тепер нам належить створити [NOR.GetAdjective]у державу, про яку мріяли наші предки."
 NOR_invite_cadillac_to_norway:0 "Запросити Cadillac до Норвегії"
 NOR_karljohansvern_verft_organization:0 "Karljohansvern Verft"
 NOR_ketsen_plus_KK_fake_ns:0 "$NOR_kretsen_ns$ §Wі§! $NOR_coordinating_committee$"
 NOR_norgesveldet_fascism_DEF:0 "Норвезька імперія"
 NOR_oppportunistic_officer:0 "Офіцер-опортуніст"
 NOR_permanent_revolution_ns:0 "Вічна революція"
 NOR_porsche_norge_organization:0 "$GER_porsche_organization$"
 NOR_prosecute_the_nkp_desc:0 "Лейбористська партія відкололася від НКП, коли стала очевидною їхня відданість Сталіну, а не працівникам [NOR.GetName]. Ми дозволили її гнилому трупу гноїтися надто довго. Ми повинні розчавити цих зрадників з усією силою, перш ніж вони зраджують нас [SOU.GetName]."
 NOR_raufoss_ammunisjonsfabrikker_organization:0 "Raufoss Ammunisjonsfabrikker"
 NOR_ship_torpedo_1:0 "2x 533-мм торпедний апарат"
 NOR_ship_torpedo_sub_1:0 "2x 450-мм торпедний апарат"
 NOR_sivorg_ns_desc:0 "Збірка груп цивільного опору, включаючи Координаційний комітет і Kretsen. Це чоловіки і жінки з тилу, які повинні зберігати надію на те, що ми переможемо фашизм і повернемо свободу в державу [NOR.GetName]."
 NOR_the_administrative_council_desc:0 "Справда, [NOR.GetAdjective]а окупація могла б піти краще. Можливо, зміна підходу допоможе, тож замість того, щоб керувати напряму, ми можемо призначити раду місцевих колабораціоністів, щоб надати населенню подобу автономії."
 NOR_the_stumbling_storting_desc:0 "Ми побачили світло в кінці тунелю політичної нестабільності, але тепер воно мерехтить у бік подальшого хаосу. Незважаючи на всі зусилля Югана Нюгошволда, внутрішні суперечки Стортінгу наближають його до хаосу."
 NOR_ulfhedhnar_wolf_coats_desc:0 "Подібно до старих Вовчих Мундирів, які були загоном берсерків, що захищали короля Гаральда Прекраснокосого, ці нові Ульфхеднари будуть елітною кастою воїнів, які очолитимуть наші сили для захисту та розширення наших земель."
 NO_MODIFIERS:0 "§gЖоден модифікатор не діє. Просуньте поступ маніфесту!§!"
 NO_MOVE_HEADING_HOME_TO_REPAIR_STAY:0 "Після цього він залишиться на базі.\n"
 NSB_poland_communist_events.202.desc:0 "[From.GetNameDefCap] не приймає нашу пропозицію захисту і наполягає на збереженні незалежності. [Root.GetAdjective] верховне командування вже почало приготування, щоби досягти успіху там, де не досяг успіху МЗС. [Root.GetLeader, що достатньо лише віддати команду, і почнеться повномасштабне вторгнення в державу [From.GetNameDef]."
 NSB_poland_communist_events.401.t:0 "[From.GetNameDefCap] погоджується"
 NSB_poland_communist_events.502.b:0 "Ми оголошуємо про свою повну незалежність."
 NSB_poland_events.102.desc:0 "Неймовірно, але [From.GetAdjective] уряд не бажає підкорятися нашим вимогам і поступатись Словаччині. Спроби знайти дипломатичне рішення успіхом не увінчалися — тепер справа за армією."
 NSB_poland_events.4.t:0 "Польща хоче придбати територію [POL_colony_purchase.GetName]"
 NSB_poland_monarchist_events.3.a:0 "Прокляття!"
 NSB_poland_royal_election.1.desc:0 "Маркграф Майссену і принц Саксонський Альберт Леопольд Фрідріх Крістіан Сільвестр Анно Макаріус хоче додати до списку своїх престижних титулів звання короля Польщі., Фрідріх Крістіан здається найочевиднішим і найзаконнішим кандидатом. володар престижного родоводу, Фрідріх Крістіан має всі шанси правити Королівством Польща."
 NSB_polish_fascist_events.2.c:0 "Ні."
 NSB_polish_fascist_events.301.desc:0 "[From.GetNameDefCap] погоджується значно збільшити нашу автономію. Ми, як і раніше, залишаємося [From.GetAdjective] маріонеткою, але будемо набагато незалежнішими у промисловому та дипломатичному плані."
 NSB_polish_fascist_events.4.t:0 "Післявоєнна Польща"
 NSB_polish_fascist_events.5.b:0 "Я так не думаю."
 NSB_soviet_civil_war_common.002.a:0 "Москва — наше найважливіше місто."
 NSB_soviet_civil_war_common.002.e:0 "Владивосток буде нашою новою східною столицею."
 NSB_soviet_civil_war_common.010_exiles:0 "Більшовики намагалися змінити державну релігію на комунізм і створили культ його лідерів. Вони дійшли навіть до того, що перейменували російські міста. В імперії потрібно відновити порядок, і почати слід зі старого міста Царицина, перейменувати."
 NSB_soviet_civil_war_common.110.a:0 "Це дуже хороша пропозиція, щоби від нього відмовитися."
 NSB_soviet_civil_war_common.111.a:0 "Будемо сподіватися, що все вийде."
 NSB_soviet_civil_war_common.118.t:0 "Радянська опозиція просить підтримки"
 NSB_soviet_civil_war_common.121.b:0 "Не будемо в це встрявати."
 NSB_soviet_civil_war_common.125.desc:0 "Після того, як ми взяли регіон [?SOV.SOV_defections_army_state.GetName], армія, яку веде [SOS.GetLeader], здригнулася. Її солдати масово дезертують, хтось із них просто склав а хтось навіть перейшов на наш бік."
 NSB_soviet_civil_war_common.127.desc:0 "Після нашої перемоги в регіоні [?SOV.SOV_defections_navy_state.GetName] кілька флотських офіцерів зрозуміли, що борються за безнадійну справу."
 NSB_soviet_fascist_tsarist.1.a:0 "Ми братимемо участь у цій великій уніфікації слов'янських народів!"
 NSB_soviet_fascist_tsarist.17.t:0 "Троїстий союз — пропозиція прийнята"
 NSB_soviet_fascist_tsarist.7.a:0 "Дурні!"
 NSB_soviet_foreign_politics_events.153.t:0 "Англо-[SOV.GetAdjective] вторгнення в Іран"
 NSB_soviet_foreign_politics_events.200.a:0 "У нас немає вибору."
 NSB_soviet_foreign_politics_events.285.b:0 "Настав час шукати нових друзів!"
 NSB_soviet_paranoia_system_events.12.desc:0 "НКВС виявив докази великомасштабної змови в лавах чиновників. Схоже, частина бюрократів із Держплану заспівала з директорами заводів і занизила норму п'ятирічного плану. Це, за заявою НКВС, наглядна ознака або наглядна ознака.\n\nНа допитах заарештовані зловмисники швидко розкрили інших учасників змови."
 NSB_soviet_paranoia_system_events.12.t:0 "Змова серед чиновників"
 NSB_soviet_paranoia_system_events.22.desc:0 "Анонімний інформатор повідомив про існування підпільної групи студентів в одній із наших найпрестижніших військових академій. Ця група, судячи з усього, вирішила не обмежуватися навчальною програмою і обговорювала ідеї ворожих та реакційних теоретиків. студентів праці цих теоретиків, але ретельне розслідування і допит ватажків осередку допоможуть нам досягти істини."
 NSB_soviet_policies_of_collective_security.7.desc:0 "[FROM.GetAdjectiveCap]ий посол повідомив нас, що його країна уклала пакт про взаємодопомогу з державою [SOV.GetNameDef]. За умовами договору сторони не будуть нападати один на одного і намагатимуться допомогти один одному у випадку війни.\n\nПосол також повідомив, що уряд підписав договір лише за явної обіцянки, що ми за бажанням теж зможемо приєднатися до пакту."
 NSB_soviet_policies_of_collective_security_poland_included_effects_from_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! і [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! відкличуть усякі претензії та цілі війни, спрямовані один проти одного, підпишуть пакт про ненапад і гарантують один одному виконання його умов."
 NSB_soviet_propaganda_capmaign_events.1.a:0 "Вони побудують своє світле майбутнє."
