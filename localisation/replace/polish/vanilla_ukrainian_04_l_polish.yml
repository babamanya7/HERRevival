 ARG_ADJ:0 "Аргентинськ"
 ARG_a_call_to_reform_desc:0 "Протягом останнього десятиліття було зрозуміло, що політика в [ARG.GetNameDef] була безладом. Відверта демократія померла разом з Іполіто Ірігоєном і спричинила лише хаос та корупцію в [ARG.GetAdjective] уряді. Настав час почати прагнути швидкої та необхідної реформи, щоб повернути нашу країну на правильний шлях."
 ARG_antonio_parodi:0 "Антоніо Пароді"
 ARG_argentine_metropole_idea:0 "Аргентинська метрополія"
 ARG_british_cooperation:0 "Британська економіка"
 ARG_consolidating_power_desc:0 "Рамон Кастільйо стверджує своє президентство більш авторитарною політикою, ніж попередні президенти. Його мета — консолідувати свою владу через Національно-демократичну партію та повільно розпустити «Конкордансію». Це не залишилося непоміченим політичними та військовими суперниками."
 ARG_eden_malbran_treaty_idea:0 "Угода Ідена–Мальбрана"
 ARG_eden_malbran_treaty_idea_desc:0 "У відповідь на жорсткі обмеження, накладені угодою Роки–Рансимена, було укладено нову угоду, яка отримала назву «Угода Ідена–Мальбрана». Це дозволило державі [ENG.GetNameDef] отримати додаткові поступки, одночасно знизивши вартість фрахтових ставок на пшеницю."
 ARG_extinguish_south_american_communism:0 "Знищити південноамериканський комунізм"
 ARG_german_loan_flag:0 "[GER.GetAdjective]а позика"
 ARG_immigration_wave:0 "Хвиля імміграції"
 ARG_in_memory_of_yrigoyen:0 "В пам'ять про Ірігоєна"
 ARG_invest_in_the_roads_desc:0 "Інфраструктура в [ARG.GetName] гостро потребує переробки. Якщо ми докладемо зусиль для фінансування наших доріг, це допоможе місцевому взаємозв'язку по всій провінції."
 ARG_island_negotiations_decisions:0 "Переговори про острови"
 ARG_leon_scasso:0 "Леон Скассо"
 ARG_military_coup_decisions_desc:0 "Поки наш новообраний уряд святкує перемогу на виборах, серед військових починає зростати почуття невдоволення. З такою великою корупцією в Конкордансії та багатьма членами військової еліти, які змагаються за владу, є лише питанням часу, коли вони підуть на Буенос-Айрес."
 ARG_military_union_south_america_DEF:0 "Легіонерська Південна Америка"
 ARG_political_events.12.desc:0 "Сьогодні ми отримали повідомлення від [ARG.GetAdjective] дипломата про те, що їхній уряд прагне подати заявку на приєднання до Осі. Якщо ми приймемо, це буде плацдармом на континенті Південної Америки. Як ми відповімо?"
 ARG_political_events.120.desc:0 "Сьогодні вранці дивний німецький чоловік, який говорив сумнівною іспанською, увійшов до Каса Росада, вигукуючи, що має великі плани на майбутнє [ARG.GetNameDef]. Здається, він має кваліфікацію для цієї роботи, і дуже переконливий. Чи передамо ми йому уряд?"
 ARG_political_events.14.desc:0 "Незважаючи на нашу рішучу спробу, [GER.GetAdjective] уряд відхилив нашу заявку на приєднання до Осі. Здається, ми повинні зіткнутися зі світом наодинці."
 ARG_political_events.3.a:0 "Це було лише питанням часу."
 ARG_political_events.60.a:0 "Давайте стояти разом!"
 ARG_political_events.62.desc:0 "[FROM.GetNameDefCap] відхилила нашу пропозицію об'єднатися як союз соціалістичних республік. Хіба вони не розуміють, хто має владу на цьому континенті? Можливо, згодом ми їм покажемо."
 ARG_political_events.72.desc:0 "Всупереч очікуванням, Антоніо Сото вдалося перемогти на конференції, і він був затверджений як новий лідер у [ARG.GetNameDef], титул, який він прагнув згодом розпустити. Сото бажає повести країну новим шляхом, дотримуючись анархо-синдикалізму та згодом скасувавши будь-яку форму ієрархії в країні."
 ARG_political_events.73.c:0 "Це вже занадто."
 ARG_political_events.80.desc:0 "Однією з найважливіших політик новообраного уряду є майбутнє освіти в [ARG.GetNameDef]. Не секрет, що наше фінансування академічної сфери останнім часом дещо відстає, і тому ми повинні вирішити, куди ми хочемо спрямувати гранти і, зрештою, на чому зосередиться наша шкільна система."
 ARG_secure_the_opposition_desc:0 "Певна кількість опозиції є чудовою для наших демократичних цінностей. Нинішня опозиція, з якою ми стикаємося, досить сильна, але наша головна проблема в тому, що вони не грають чесно. Ми не можемо дозволити їм встановити цей небезпечний приклад, політичну опозицію потрібно регулювати, заради безпеки всіх."
 ARG_seek_american_support_desc:0 "Оскільки по всьому світу наростає тінь війни, ми повинні бути готові протистояти будь-якому конфлікту, який загрожуватиме нашим кордонам. [USA.GetNameDefCap] може бути сплячим гігантом на півночі, але як дружня демократична нація, ми можемо багато чого навчитися з їхньої зовнішньої політики та програм цивільної оборони. Ми повинні звернутися до них і почати налагоджувати стосунки з нашими північноамериканськими сусідами."
 ARG_support_the_farmers_desc:0 "[ARG.GetNameDefCap] завжди мав сильний сільськогосподарський сектор, а наша яловичина особливо популярна у всьому світі. Під гнітом нашого попереднього уряду багато з цих фермерських громад залишилися без підтримки. Настав час запровадити зміни та покращити наше фінансування сільського господарства та підтримати робітників пролетаріату в сільській [ARG.GetNameDef]."
 ARG_united_workers_decisions_tt:0 "Відмикає сукупність рішень §Y$ARG_unite_the_workers_decisions$§!."
 ARG_worst_timeline_flag:0 "§YСеньйор Гілтер§! є лідером §Y[ARG.GetNameDef]§!"
 ARMY_AIR_MISSION_ENTRY:0 "$MISSION|Y$"
 ARMY_DIVISONS_FILTER_DESC:0 "Уведіть частину назви військової частини, типу дивізії, театру, області, імені командувача, назви оснащення або рівня"
