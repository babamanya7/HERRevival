 AIR_MISSION_INTEL_RANGE_GUNS:0 "$RANGE|H$ гармат(и) призначені на завдання $MISSION|H$ в цьмоу регіоні."
 AIR_REINFORCE_OBSOLETE_ONLY:0 "Дозволити тільки застарілі літаки для підкріплення §Hавіакрила§!."
 AIR_VIEW_DAMAGE_DISRUPTED_PLANES_BY_ENEMY:0 "§HДружніх літальних апаратів перервано§!\nНанесено достатньо шкоди, щоби змусити літальний апарат повернутися на базу, перш ніж він виконав своє завдання."
