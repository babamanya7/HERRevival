 JUNO_license_idea:0 "Іноземні ліцензії"
 JUNO_minister_of_war_and_navy:0 "Міністр війни та флоту"
 JUNO_promote_immigration_cat_desc:0 "Наша країна була відносно захищена від цього, але всі бачать, що світ навколо нас стає дедалі більш радикалізованим. Ми спостерігаємо потік іммігрантів, котрі шукають новий дім у державі [From.GetNameDef], і за правильних зусиль з нашого боку це може дати нам велику вигоду!"
