 SOM_democratic:0 "Сомалі"
 SOV_ARTICLE_124_DESC_COMMUNIST:0 "Можливо, що в гонитві за марксистсько-ленінськими ідеалами ми були... надто ревними в переслідуванні релігії. Можливо, вона все ще відіграє певну роль у радянському суспільстві. У нашій новій конституції буде стаття, яка гарантуватиме свободу віросповідання для всіх радянських громадян."
 SOV_BULWARK_NAME_COMMUNIST:0 "Оплот антибільшовизму"
 SOV_CHURCH_CANDIDATES_DESC_FASCIST:0 "Важливість релігії в нашому суспільстві не можна применшувати. Настав час державі визнати і підтримати цю першість — і зробити перші кроки до об'єднання Церкви і держави."
 SOV_RUSSIANS_DEMONYM_RUSSIANS:0 "росіяни"
 SOV_SH_battleship_2_desc:0 "The Project 23bis-class battleships were a modified and improved version of the previous Sovetsky Soyuz-class (Project 23). Compared to their predecessors, they carried four triple turrets of the same 406mm caliber cannons, thickened belt armor, a revised layout of secondary guns, and stronger AA armament."
 SOV_Yekaterinburg:0 "Єкатеринбург"
 SOV_administrative_reforms_idea:0 "Адміністративні реформи"
 SOV_aleksandr_novikov:0 "Олександр Новіков"
 SOV_all_power_to_the_soviets_desc:0 "Революція почалася з простої ідеї, що людям слід дозволити вирішувати власну долю, сформувавши ради робітників, солдатів, селян. Лише згодом ця система була змінена на систему, в якій невиборні бюрократи приймали рішення здалеку. Коли ці рішення неминуче призводили до негативних наслідків, то, як правило, карали робітників. Досить!"
 SOV_anti_colonialist_rebels_desc:0 "Оскільки капіталістична система вступає в період остаточного краху, правильною позицією для всіх комуністичних партій має бути вкрай агресивна, войовнича, ультраліва лінія. Зокрема, ми закликаємо комуністичні партії світу присвятити свою енергію знищенню поміркованих лівих."
 SOV_anton_denikin:0 "Антон Дєнікін"
 SOV_armored_battery_35:0 "Броньована батарея 35"
 SOV_ballistic_missile_equipment_2:0 "Р-5 «Победа»"
 SOV_baltic_security_desc:0 "Доля країн навколо Балтійського моря тісно пов'язана з нашою. Ми не можемо допустити ворожий уряд на наших кордонах."
 SOV_battle_cruiser_1:0 "Клас «Бородино»"
 SOV_build_national_academy_of_sciences_integrated_republic_ARM_desc:0 "Ми збудуємо [ARM.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_build_national_academy_of_sciences_integrated_republic_LAT:0 "Збудувати [LAT.GetAdjective]у $SOV_build_national_academy_of_sciences_integrated_republic_default$"
 SOV_build_national_academy_of_sciences_integrated_republic_POL_desc:0 "Ми збудуємо [POL.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_build_national_academy_of_sciences_integrated_republic_UKR_desc:0 "Ми збудуємо [UKR.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_carry_revolution_east_desc:0 "Жорстока експлуатація африканських колоній призвела до того, що ці суспільства не змогли розвинутися до рівня, на якому революція може легко перемогти. Це не стосується більш розвинених суспільств Азії, де існує великий революційний потенціал, який тільки й чекає, щоби його вивільнити."
 SOV_destroyer_2_desc:0 "The Gnevny class (Project 7) destroyers were authorized under the 1933-1938 shipbuilding program. The class itself was heavily influenced by the Italian destroyer Maestrale and considered a successful design. Their displacement were in the range of 1,600-2,000 tons, they were well-armed and they had adequate AA and torpedo armament. Due to the powerful engines they were fast but short-ranged vessels."
 SOV_eliminate_the_left_desc:0 "Хоча нашим головним опонентом є Сталін, ми повинні визнати, що в партії є багато тих, хто просто вичікує свого часу і своїми безперервними суперечками підриває наші зусилля по встановленню контролю над країною. Оскільки Сталін стає все більш параноїдальним щодо наших дій, з'являється можливість вбити двох зайців одним пострілом."
 SOV_expand_nkvd_opposition_tt:0 "Додає 5 дивізій НКВС, які залишаться лояльними, коли почнеться [GetSovietCivilWarName]."
 SOV_expand_red_fleet:0 "Розширити Червоний флот"
 SOV_expand_the_agitprop:0 "Розширити Агітпроп"
