 SPECIAL_PROJECT_UNASSIGNED_SCIENTIST_ALERT_DELAYED_TT:0 "Призначте науковця, щоби розпочати §Yбазові дослідження§! або новий спеціальний проєкт для:"
 SPR_FRAGMENTATION_STATUS:0 "Роздробленість Іспанії"
 SPR_a_new_military_academy_desc:0 "Щоб досягти нашої мети справді професійної національної армії, ми повинні заснувати нову академію, щоби наші офіцери були найкращими, якими вони можуть бути."
 SPR_anarchist_society:0 "Анархістське суспільство"
 SPR_anarchist_uprising_mission_desc:0 "Наші «союзники»-анархісти продовжують поводитися з невиправданими очікуваннями незалежності та автономії. Що більше ми намагаємося організувати утримувані анархістами регіони для військових дій, то більше вони підбурюють свій народ проти законного іспанського уряду. Ми мусимо бути готові до повномасштабного анархістського повстання, якщо ситуація розвиватиметься далі."
