 GER_prepare_italian_coup_ww:0 "Підготувати італійський переворот"
 GER_re_establish_free_elections_ww_desc:0 "$GER_reestablish_free_elections_desc$"
 GER_re_establish_the_seekriegsleitung_desc:0 "Відновлення Морського військово-морського командування (Seekriegsleitung) поліпшить планування та виконання морських наказів і безпосереднього розгортання."
 GER_re_ratify_the_locarno_treaty_tt:0 "§Y[FRA.GetNameDefCap]§! буде більш схильною підтримати наші дипломатичні ініціативи"
 GER_reach_out_to_scandinavia_desc:0 "Гори та холод не є захистом від загрози [GER.GetGreatRedMenaceName]. Скандинави повинні це розуміти. Ми запропонуємо їм членство у нашій фракції та захист від [SOV.GetAdjective]их сил."
