 rank2:0 "Генерал-лейтенант"
 rebuild_panama_canal_desc:0 "Панамський канал має величезне значення для наших військових зусиль. Ми повинні виділити будь-які ресурси, необхідні для відновлення цього великого каналу, щоби ми могли використовувати його для вільного пересування кораблів і військ між Тихим і Атлантичним океанами."
