 GER_second_vienna_award_desc:0 "Угорці становлять більшість населення Трансільванії, отже, ця земля має відійти дружній нам Угорщині. Проте важко сказати, як відреагує на таку вимогу народ Румунії та її уряд."
 GER_see_to_the_eastern_front_ww_desc:0 "Наші дії у попередній війні досі живі в пам’яті багатьох. Ми маємо переорієнтувати страх континенту на справжню загрозу — велику [GER.GetGreatRedMenaceDesc], що нависає зі Сходу. Ми розпочнемо масштабну пропагандистську кампанію."
