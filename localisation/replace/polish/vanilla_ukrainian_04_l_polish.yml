 AST_jet_plane:0 "de Havilland Vampire"
 AST_jet_tac_bomber_equipment_1:0 "English Electric Canberra"
 AST_lithgow_saf_organization:0 "$lithgow_saf$"
 AST_maritime_commission_desc:0 "$USA_maritime_commission_desc$"
 AST_medium_tank_destroyer_equipment_1_short:0 "M3 Grant TD"
 AST_mio_trait_light_vehicle_standardization:0 "Стандартизація легкої техніки"
 AST_mio_trait_yeramba_engineering:0 "Інженерія САУ «Yeramba»"
 AST_natunity_becomes_ruling_party:0 "\n[GET_AST_RULING_PARTY] запросить [GET_AST_NON_RULING_PARTY] приєднатися до Уряду національної єдності.\n\n[GET_AST_NON_RULING_PARTY] Отримує §Y1§! Перемогу на виборах\n\n"
 AST_nauru_pact_desc:0 "З початковою перешкодою у вигляді здобуття влади все ще попереду, питання незалежності здається далеким; однак австралійська автономія цікавить не лише нас. В обмін на гарантії суверенітету від [GER.GetNameDef] на випадок опору Британії руху «Австралія понад усе» або остаточного виходу зі Співдружності, ми, після приходу до влади, повернемо один з їхніх втрачених тихоокеанських островів: Науру."
 AST_nav_bomber_equipment_3_short:0 "Beaufort"
 AST_naval_auxiliary_patrol_taog_desc:0 "Поки наші професійні сили зайняті іншим, ми можемо звернутися до охочих місцевих добровольців, щоб захистити наші порти та прибережні об'єкти. Їхнє глибоке знання місцевих водних шляхів робить їх безцінними, і ніхто не запідозрить місцевого рибалку в роботі на нашу користь."
 AST_naval_expansion:0 "$NOR_alt_dem_naval_expansion$"
 AST_never_another_gallipoli:0 "Не допустимо нового Галліполі"
 AST_new_general_tt:0 "У Вас з'явиться новий генерал із §Y3 рівнем навичок§! на ім'я §Y$AST_iven_mackay$§!."
 AST_northern_advancement_desc:0 "Хоча Австралія воліла б займатися власними політичними справами, ми не можемо очікувати, що нас залишать у спокої, якщо ми не становитимемо загрози. [INS.GetNameDefCap] — нація, подібна до нашої, жертва європейських загарбників, які не йдуть. Заявляючи власні претензії на цю територію, ми посилаємо чіткий сигнал: тихоокеанські нації слід залишити в спокої."
 AST_percy_fascism_DEF:0 "$AST_DEF$"
 AST_pig_iron_protests_desc:0 "Наші докери багато в чому не згодні зі своїм урядом, а надто у питанні продажу чавуну воюючим країнам. Австралійці не зацікавлені брати участь в агресії чи транспортуванні обладнання, яке використовується проти мирних громадян, тому [AST.GetName] цього не робитиме; закликайте до страйку."
 AST_political_events.6.t:0 "Півторастолітній ювілей 1938 року"
 AST_sentinel_tank_project:0 "Проєкт танка «Sentinel»"
 AST_subject:0 "$OVERLORDADJ$а $AST$"
 AST_take_it_to_the_streets_desc:0 "Промислові акції — один із найпотужніших інструментів, які ми маємо для стимулювання змін у суспільстві, і ми повинні застосувати його проти системи, створеної лише для експлуатації. Настав час повернути засоби виробництва, робітники Австралії, єднайтеся!"
 AST_the_south_west_pacific_initiative_desc:0 "Ми створили політичну основу і зміцнили вплив на створення власної мережі альянсів, які дозволять вберегти південно-західну частину моря від ворожих держав. Ми мусимо знайти союзників, які розділяють наші переконання, і зробити Австралію великим гравцем на міжнародній арені."
 AST_transport_plane_equipment_2_short:0 "C-47 Skytrain"
 AST_united_states_as_our_keystone:0 "Сполучені Штати як наша опора"
 AST_volunteer_defence_corps_desc:0 "До складу добровольчого оборонного корпусу входять старі ветерани та інші громадяни, які не покликані на службу в регулярну армію. Ці загони займуться забезпеченням місцевої оборони та дозволять нашій армії вести прямі бойові дії проти ворогів."
 AST_walls_and_whispers:0 "Стіни та шепіт"
 AST_whyalla_steelworks_ic_tt:0 "Ефекти від промислового концерну §Y$AST_whyalla_steelworks_ic$§! покращено"
 AST_womens_auxilliary_australian_air_force:0 "Жіноча служба ВПС Австралії"
 AST_wool_agreement_idea_desc:0 "[ENG.GetNameDefCap] отримала права на все щорічне виробництво вовни Австралії, що гарантує, що наші солдати будуть одягнені та екіпіровані протягом усього їхнього розгортання."
