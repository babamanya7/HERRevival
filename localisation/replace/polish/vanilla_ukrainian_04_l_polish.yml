 GXC_the_japanese_visit_desc:0 "Японці вже досить давно цікавляться нашими двома державами, сподіваючись, що наша опозиція до Центрального уряду відкриє шлях для подальшої експансії в Китаї. Хоча ми не погоджуємося з японцями і категорично проти їхнього просування на нашу землю, було б розумно прийняти подарунки, які вони пропонують, щоб ми могли використати їхню власну зброю проти них, коли настане час."
 GetNorwegianClaims_sweden:0 "Бугуслену, Даларни та Ємтланду; які, за їхніми словами, шведська корона вкрала"
 GetOppositionPartySupportersName_communism:0 "Комуністи"
 HABSBURG_mechanized_initiative_desc:0 "Деякі вчені почали обговорювати варіант напівгусеничних вантажівок, здатних перевозити війська та мати більш важке бронювання. Цей варіант, швидше за все, виявиться дешевшим, ніж танк, міцнішим, ніж вантажівка, і здатним долати складнішу місцевість. Можливо, варто запропонувати фінансування цього проєкту."
