 DEN_neglected_military_dynamic_modifier_desc:0 "Ми проводили політику роззброєного нейтралітету протягом багатьох років, щоби не провокувати німців. Збройні сили майже не більше, ніж символічна сила, яка формально захищає наш суверенітет. Протягом років армія зазнавала постійного скорочення фінансування — що залишило її цілковито неготовою до будь-якого можливого конфлікту."
 DEN_new_artillery_tactics_desc:0 "Сьогодні Hærens Tekniske Korps виробляє гармати, артилерію та боєприпаси. Але, створивши експериментальний підрозділ у складі Hærens Tekniske Korps, ми, можливо, зможемо розробляти і виробляти власну артилерію, що було б дуже корисно для армії."
