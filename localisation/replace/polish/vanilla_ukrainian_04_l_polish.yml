 POL_underground_conscripts:0 "Підпільні призовники"
 POL_underground_conscripts_desc:0 "Призов із числа осередків Польської підпільної держави значно підвищить боєздатність нашого війська у боротьбі з поневолювачами."
 POL_wojtek:0 "Войтек"
 POL_woo_morges_staff_desc:0 "Наше повстання не матиме успіху без підтримки принаймні частини військових.Хоча більшість з них залишаються вірними одному з трьох крил Санації, Фронт Морж зацікавлений у відновленні демократії в Польщі і можуть дружньо співпрацювати з нами з цією метою."
 POPS_NO_MESSAGE:0 "Сталася неочікувана помилка"
 POR_a_powerful_merchant_marine:0 "Могутній торговий флот"
 POR_deal_with_fascism_desc:0 "Фашизм — це біда, яка принесла людству горе і нещастя. Нам час протистояти йому, вдаривши прямо в саме його джерело. Коли ми переможемо, ми змінимо світ за власним бажанням, і це буде на краще."
 POR_haven_of_neutrality_macau_desc:0 "With our current neutral stance and the conflict currently raging across Asia, Macau has become a beacon of hope and stability during these turbulent times. We should invest in expanding this province."
 POR_infantry_equipment_1_short:0 "Espingarda m/04/39"
 POR_join_the_axis_desc:0 "Ми повинні приєднатися до німців і підтримати їх у майбутніх конфліктах. Німеччина може бути головною державою в Центральній Європі, але Португалія стане наймогутнішою заморською імперією!"
 POR_jose_vicente_de_freitas:0 "Жузе Вісенте де Фрейташ"
