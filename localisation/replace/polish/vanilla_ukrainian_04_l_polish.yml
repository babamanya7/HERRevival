 PER_align_with_axis_desc:0 "Поки війна вирує в Європі, наші [GER.GetAdjective] друзі потребують союзників, щоб допомогти у їхніх військових зусиллях. Настав час нам приєднатися до війни на боці Осі."
 PER_azadi_desc:0 "Азаді — перське слово, що означає «свобода», і це буде фраза, навколо якої ми згуртуємося, готуючись протистояти нашим окупантам. [ROOT.OVERLORD.GetNameDefCap] очікує, що ми будемо підкорятися, але ми завжди мали намір захищати наш суверенітет. Можливо, ми програли битву, але ми все одно вестимемо війну."
 PER_civil_unrest_category_desc:0 "Оскільки ми консолідували більше влади в руках шаха, багато груп у нашому уряді висловлюють невдоволення та недовіру до нашого керівництва. Оскільки кожна з них планує наш повал, ми повинні знайти спосіб придушити це інакомислення, перш ніж воно стане справжньою проблемою.\n\n§RМи повинні завершити національний фокус 'Оцінка опозиції' перед тим, як зможемо зупинити це повстання.§!"
 PER_communist_events.11.b:0 "Ми не будемо обмінювати державні секрети."
 PER_communist_events.13.desc:0 "[FROM.GetAdjective] уряд відхилив наш запит на технології, які допомогли б нам краще захистити Перську затоку від зовнішніх військово-морських держав. Це удар для наших інженерів, але вони мають намір продовжувати розробку самостійно."
 PER_communist_events.9.a:0 "Це їм буде уроком."
