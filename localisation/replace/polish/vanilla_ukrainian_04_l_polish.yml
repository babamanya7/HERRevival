 RAJ_seek_japanese_support_desc:0 "Ворог нашого ворога може бути нашим найсильнішим союзником. Шукаючи підтримки Японії, ми можемо отримати доступ до ресурсів, навчання та живої сили, щоб кинути виклик британському правлінню. Хоча шлях сповнений ризиків, такий альянс може переломити ситуацію на нашу користь."
 RAJ_shut_down_black_markets:0 "Закрити чорні ринки в [FROM.GetName]"
 RAJ_sir_frank_messervy:0 "Сер Френк Мессерві"
 RAJ_skibedi_san_ma_desc:0 "Мілітаристи Сібей сань Ма є перешкодою на шляху домінування Імперії Моголів у Центральній Азії. Розпочавши рішучу кампанію, ми можемо демонтувати їхню владу, забезпечити стратегічні торговельні шляхи та розширити вплив імперії в регіоні."
 RAJ_south_east_asia_command_dm_desc:0 "Завдяки створенню Командування Південно-Східної Азії ми змогли поширити свій військовий вплив на весь регіон. Це, безсумнівно, допоможе нам у плануванні військових кампаній на континенті"
