 COARSE_COUNTER_KNOWN_UNITS:0 "§HВідомі частини:§!"
 COG_an_expansionist_state_desc:0 "Кожна держава повинна постійно розвиватися, якщо вона хоче задовольнити потреби своєї популяції, і ми не виняток. Ми повинні швидко розширити наші кордони, щоб задовольнити тих, хто постійно прагне до більшого."
 COG_brown_water_navy_idea_desc:0 "The rivers that weave through the jungles of Central Africa are not being adequately utilized by our military. We shall expand our brown water fleet with a number of small river attack boats to aid in the support of our soldiers when they are far from reinforcements or supply."
 COG_command_post_goma:0 "Командний пункт Гома"
 COG_congo_stanleyville_neutrality:0 "Конго-Стенлівіль"
 COG_establish_the_anc_modifier_tt:0 "Знімає національний дух §YForce Publique§! і замінює його на §YArmée Nationale Congolaise§!, зберігаючи близько половини раніше отриманих бонусів."
 COG_forces_terrestres:0 "Сухопутні війська"
 COG_forces_terrestres_desc:0 "Найважливіша частина будь-якої армії — це сухопутна компонента, і наша залишає бажати кращого. Ми повинні інвестувати в неї, щоб вона могла протистояти нашим ворогам."
 COG_found_cominor:0 "Заснувати Compagnie Minière du Nord de l'Ituri"
 COG_invest_in_the_textile_industry_desc:0 "Для того, щоб наша нація процвітала, ми повинні інвестувати в створення традиційних текстилів Куба і продавати їх на міжнародному ринку."
 COG_invite_the_general_labour_federation_of_belgium:0 "Запросити Генеральну федерацію праці Бельгії"
 COG_join_the_comitern_desc:0 "Ми маємо ідеологічних союзників у Радянському Союзі, які хочуть лише одного — покласти край епосі колоніалізму. Тому нам слід встановити більш тісні дипломатичні зв’язки з ними, можливо, навіть шукаючи союз."
 COG_lecho_du_katanga_desc:0 "L'Écho du Katanga — це газета, що видається в Елісабетвілі соціальним колоністом Жаном Декостером і редактором Альбертом Декостером. Разом вони пропагують європейське заселення Конго, що може бути корисним для швидшого розвитку нашої зростаючої нації."
