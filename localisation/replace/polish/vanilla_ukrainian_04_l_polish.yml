 CONGO_cheap_labor:0 "Дешева праця"
 CONGO_chefs_coutumiers_desc:0 "Чефи Кутум'єри — це клас племінних вождів, яких адміністрація [BEL.GetAdjective] доручила наглядати за місцевим управлінням. У зв'язку з останніми інвестиціями в регіон, ми повинні забезпечити, щоб наші племінні союзники були належним чином заохочені та підтримані у виконанні цієї важливої ролі."
