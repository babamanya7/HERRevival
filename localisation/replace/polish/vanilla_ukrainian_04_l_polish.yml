 siam.11.desc:0 "Всупереч очікуванням, армія [FROM.GetAdjective] перехитрила наші сили і захопила контроль над спірним регіоном. Їхня окупація послабила наш авторитет і поставила під сумнів наші претензії на цю територію. Продовження конфлікту загрожує подальшою втратою дисципліни та впевненості, проте здача території була б публічним визнанням поразки."
