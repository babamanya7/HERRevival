 ETH_offer_peace_DJI_tt:0 "Запропонувати власнику [DJI.GetAdjective]ої території мир, якщо він погодиться відмовитися від претензій на територію, яку наразі контролює [ETH.GetName]. [DJI.GetAdjectiveCap]а територія, яку наразі контролює [ETH.GetAdjective]а влада, стане [ETH.GetAdjective]ою маріонеткою."
