 ss_recruitment_event.26.desc:0 "Коли дим у штабі фюрера розвіявся, Гайнріх Гіммлер вийшов із хаотичної перестрілки єдиним, хто вижив. За його свідченнями, фюрер, явно охоплений божевіллям, оголосив його повною невдачею людини і солдата, зрадником і шпигуном, якого треба розстріляти на світанку. Розуміючи, що він повинен вибрати між своєю особистою честю і виживанням нації, Гіммлер вирішив діяти негайно і застрелив його. Після цього члени гвардії фюрера намагалися вбити Гіммлера як вбивцю. Лише вчасне прибуття власних охоронців Гіммлера врятувало райхсфюрера SS.\n\nУ Німеччині звістка про смерть фюрера, очевидно, послужила сигналом для того, щоби почати давно підготовлені дії. Підрозділи SS і регулярної армії мчалися, щоби зайняти мости, телефонні станції та перехрестя, а десантники Люфтваффе швидко мобілізувалися, щоби захопити аеродроми по всьому Райху.\n\nНімеччина стоїть на межі громадянської війни, і всі три фракції будуть покладатися на цивільний уряд, щоби фактично керувати країною."
 stability.21.desc.b:0 "Неефективна офіційна реакція на масове ухиляння від призову лише посилила проблему. Дедалі більше призовників не з'являються після отримання повістки. Контррозвідка перехопила професійно виготовлену брошуру, яка давала людям поради, як уникнути призову, пропонуючи такі речі, як підкуп лікарів, щоби ті визнали призовника непридатним за станом здоров'я. Винятки для батьків сімей призвели до того, що вдови з дітьми опинилися завалені пропозиціями одруження, а кількість людей, які просять про винятки з етичних міркувань, досягла рекордних показників.\n\nВійськове керівництво запропонувало ліквідувати останні кілька винятків і зробити приклади з кількох ухилянтів, яких вдалося спіймати. Інші урядовці пропонують звернутися до почуття громадянського обов'язку наших громадян і вказати на наслідки поразки у цій війні."
 stability.21.f:0 "Настав час для суворіших заходів."
 stability.22.desc.a:0 "За останні кілька днів виробництво на кількох заводах різко вповільнилося, оскільки робітники оголосили страйк на всіх воєнних підприємствах. Вимагаючи «миру та хліба!», вони поки що відкидають усі спроби домовитися про врегулювання. Дехто в уряді виступає за різку військову відповідь із подальшою хуткою стратою ватажків як ворожих агентів і зрадників. Однак інші урядовці рекомендують більш виважений підхід, вказуючи на те, що жорстка відповідь може мати зворотні наслідки, якщо задіяні солдати не настільки лояльні, як ми думали."
 stalingrad_tractor_factory:0 "Сталінградський тракторний завод"
 steal_blueprints_infiltrate_naval_design_office_desc:0 "Наш агент обійме скромну посаду в невеликій компанії-постачальнику для флоту і зробить копії доступних планів."
 steal_blueprints_infiltrate_naval_design_office_outcome:0 "Наш агент проник у компанію-постачальника для флоту і зробив копії креслень важливих компонентів."
 steal_blueprints_seduction_desc:0 "Наш агент близько зійдеться з людиною, задіяною в проєкті, і скористається своєю чарівністю, щоб отримати додаткову інформацію. Ми, звичайно, не чекаємо, що за добре проведений час хтось вручить повний комплект креслень, і все ж у таких обставинах люди бувають відвертішими від звичайного."
