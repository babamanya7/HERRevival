 TUR_ataturk_health_terminal_tt:0 "§YМустафа Кемаль Ататюрк§! буде переведений на паліативну допомогу у зв'язку з його §Yневиліковним захворюванням§!."
 TUR_avenge_the_treaty_of_sevres:0 "Помститися за Севрський договір"
 TUR_balkan_academy_of_sciences_desc:0 "Місце, де найбільші уми Південної Європи можуть зустрічатися та розвивати науку оборони."
 TUR_choosing_a_successor_desc:0 "Ні для кого не секрет, що здоров'я Мустафи Кемаля Ататюрка, Батька Турків та рятівника Турецької Республіки останнім часом постійно погіршується. Він уже обезсмертив себе, як Газі, вічний воїн Туреччини, і його пам'ять завжди буде жива в умах турецького народу. На жаль, ми маємо бути прагматичними і вибрати того, хто найкраще продовжить справу Ататюрка на посаді нашого лідера."
 TUR_continue_the_sumerbank_industrialization_scheme_tt:0 "Якщо ідея §Y$TUR_first_five_year_plan$§! §Gдіє§!:"
 TUR_discuss_investment_possibilities_with_FROM:0 "Обговорити можливості інвестицій із державою [FROM.GetNameDef]"
 TUR_disorganised_armed_forces_1:0 "$TUR_disorganised_armed_forces$"
 TUR_disorganised_armed_forces_5_desc:0 "$TUR_disorganised_armed_forces_desc$"
 TUR_embed_kemalist_propagandists_into_state:0 "£faction_tur_kemalist Впровадити в державу кемалістську пропаганду"
 TUR_emergency_fortification_directive_desc:0 "Скрутні часи вимагають жахливих заходів, і ми були змушені швидко виділити ресурси на будівництво укріплень. Саме наше існування може бути під загрозою."
 TUR_expanding_our_navy_desc:0 "Ми боремося пліч-о-пліч з одними з найсильніших морських держав, і нам є чому в них повчитися. До кінця війни наш флот увійде до великих."
 TUR_fevzi_cakmak:0 "Февзі Чакмак"
 TUR_fighter_equipment_3:0 "THK P47"
 TUR_first_five_year_plan_desc:0 "Створений за зразком [SOV.GetAdjective]их п'ятирічних планів та за участю експертів як [SOV.GetAdjective]их, так і [USA.GetAdjective]их, наш перший п'ятирічний план набув чинності 17 квітня 1934 року. Завдяки цьому плану ми прагнемо побудувати 20 нових заводів до початку реалізації другого плану."
 TUR_guarding_our_western_frontiers_desc:0 "Найбільша загроза нашому суверенітету походить від Заходу. Нехай західні народи приходять до нас — ми готові відкинути їх назад, у морські безодні, що породили їх."
 TUR_hava_okulu_desc:0 "Ми пишаємося нашою старовинною та шановною академією військової та цивільної авіації. Варто приділити особливу увагу повітряній війні."
 TUR_integrate_hakkari:0 "£faction_tur_kurdish Інтегрувати Хаккярі"
 TUR_light_ship_engine_2:0 "«Parsons» 40 000 к. с. н. в."
 TUR_medium_tank_equipment_2:0 "Koç Panzerkampfwagen IV Ausf G."
 TUR_mehmet_ali_ulgen:0 "Мехмет Алі Улген"
 TUR_mehmet_fahri_engin:0 "Мехмет Фахрі Енгін"
 TUR_millet_mektebi_focus:0 "Millet Mektepleri"
 TUR_peninsular_network_of_factories_desc:0 "Поодинці ніхто з нас не вистоє проти більших і промислово розвинених держав таких як [GER.GetNameDef] та [SOV.GetNameDef]. Якщо ж ми об'єднаємо свої ресурси та доведемо наш потенціал до піку, з нами будуть рахуватися."
 TUR_preempt_bulgarian_alignment:0 "Завадити амбіціям Болгарії"
 TUR_provide_refuge_to_the_victims_of_fascism:0 "Надати притулок жертвам фашизму"
 TUR_rebuke_the_treaty_of_kars:0 "Розкритикувати Карську угоду"
 TUR_reclaim_macedonia:0 "Повернути Македонський санджак"
 TUR_red_officers:0 "Червоні офіцери"
 TUR_reinvigorate_turkish_nationalism:0 "Пожвавити турецький націоналізм"
 TUR_stoked_populism_flag:0 "Нещодавно розпалено популістські настрої"
 TUR_subject_DEF:0 "$OVERLORDADJ$а $TUR$"
 TUR_the_guardians_of_kemalism_desc:0 "У здатності кемалістського офіцерського корпусу поширювати ідеї кемалізму країною є своя межа. Уряду час більш активно допомагати кемалізму завойовувати серця та голови турецького населення."
 TUR_the_revolutionary_officer_college_of_kars_desc:0 "Карс — місто з багатозначною історією, а його близькість до держави [SOV.GetNameDef] робить його ідеальним місцем для створення нової політизованої офіцерської школи. Наших офіцерів навчать не просто основам ведення війни, а й тонкощам марксистської доктрини."
 TUR_the_treaty_for_prosperity_and_trade_desc:0 "Ми очолимо колективний договір, що просуває торгівлю за принципами вільного ринкового лібералізму. Не варто очікувати, що всі наші товариші за договором зможуть повністю перебудувати свою економіку під вільну торгівлю, але принаймні ми зможемо покінчити з протекціонізмом на Балканах."
 TUR_thwarting_kemalist_infiltration:0 "£faction_tur_traditionalist Відображення спроб впровадження кемалістів"
 TUR_turkish_workers_militia_desc:0 "Люди в найкращому становищі для захисту прав робітників — це самі робітники. Звісно, невелика вказівка нашого уряду та дивна записка з Москви лише поліпшили їхню ефективність як робочої міліції."
