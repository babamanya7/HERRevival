 JAP_minshu_shugi_desc:0 "Хоча до цього часу ми дотримувалися політичної доктрини Мінпон Шюгі, справжня демократія лежить у межах Міншю Шюгі. Зрештою, «за законом суверенітет нації належить народу», що не так у доктрині Мінпон, оскільки вона наголошує на монархічному суверенітеті понад усе. Ми повинні закріпити ці нові ідеї в конституції!"
