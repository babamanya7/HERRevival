 MEX_destroyer_1:0 "Клас «Guanajuato»"
 MEX_focus_aztec_eagles_desc:0 "Ми — одна з найвпливовіших держав Латинської Америки. Ми повинні продемонструвати нашу відданість безпеці світу, допомагаючи Америці в її боротьбі проти іноземних розпалювачів війни, які загрожують загальному миру своїм експансіонізмом."
 MEX_focus_catholic_politics_desc:0 "У більшості політичних партій у Мексиці домінували антиклерикали, які отримали владу після революції 1911 року. Якщо ми, католики, хочемо взяти й утримати владу законним шляхом, необхідно буде створити партію побожних мас."
 MEX_focus_gulf_coast_naval_yards_desc:0 "Наше узбережжя Мексиканської затоки виходить на Європу та східне узбережжя Сполучених Штатів, наших основних торгових партнерів. Нашій нафтовій промисловості, що розвивається, сприяло б розширення верфей у Веракрусі."
