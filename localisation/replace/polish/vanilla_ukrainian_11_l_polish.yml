 SPA_activate_salamanca_fifth_columnists:0 "Задіяти п'яту колону у Саламанці"
 SPA_democratic_ADJ:0 "Іспанськ"
 SPA_develop_all_talent_desc:0 "Усім, хто цього заслуговує, буде забезпечений легкий доступ до вищої освіти, а також необхідне фінансування для реалізації ідей, які можуть становити інтерес для держави. Інвестиції у створення нових науково-дослідних і дослідницьких об'єктів, безсумнівно, принесуть нам багато винагород у багатьох різних галузях."
