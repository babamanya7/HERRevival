 GER_offer_trade_proposal:0 "Запропонувати торговельну угоду"
 GER_operation_panzerfaust_events.02.desc:0 "Сьогодні ми дізналися, що німці вимагають, аби Міклош Горті пішов у відставку на користь Ференца Салаші, якого вони вважають надійнішим. Вони також заявили, що в разі відмови може знадобитися інтервенція в нашу країну."
