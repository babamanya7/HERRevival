 YUG_naval_bombers_desc:0 "Адріатика довга, але вузька, що робить її легко доступною для літаків, що базуються з наших аеродромів. Розробка спеціальних моделей військово-морських бомбардувальників може значно підвищити шанси нашого флоту проти більш потужних супротивників."
