 lar_appeal_to_overseas_territories.13.t:0 "Північна Африка міняє сторону"
 lar_congress_of_paris.4.t:0 "[From.GetNameDefCap] відмовляється"
 lar_end_the_occupation.1.desc:0 "Через кілька років [From.GetLeader] та уряд офіційно оголосили про успіх своєї програми національної революції. Як заявив глава держави у своєму зверненні по радіо, слабкість та занепад старої французької політичної системи викорінені, і на зміну їм прийде нова перероблена система, яка більше пасуватиме до благородної та войовничої французької нації.\n\nУ рамках цієї програми уряд офіційно запитав про зняття з нього будь-яких зобов'язань та обмежень, що мають на увазі угоду про припинення вогню, яке також запропонувало передати під його повний контроль усі французькі території. \n\nВ обмін на це лідер держави запропонував знову вступити у війну і покарати тих, хто залучив дві наші країни до другої кривавої війни за одне покоління."
 lar_france_vichy_reunification.1.b:0 "Він зрадник і не має права нічого вимагати."
 lar_news.11.b:0 "Тим чи іншим способом їхнє втручання закінчиться."
 lar_news.16.desc:0 "Після багатьох місяців тиску з боку [SPB.GetAdjective] уряду держава [POR.GetNameDef], ізольована, позбавлена союзників і зіткнулася з переважаючими військовими силами держави [SPB.GetAdjective], змушена була прийняти претензії [SPB.GetLeader] заявив на [POR.GetAdjective] престол. В результаті держава тепер стала лише провінцією зростаючої держави [SPB.GetNameDef]."
 lar_news.291.new_zealand_desc:0 "Коли острови Гаваї, Аотеароа, Таїті та Самоа міцно перейшли під [From.GetOldAdjective] контроль, [From.GetLeader] проголосив, що держава тепер буде відома як [From.GetNameDef] і стане домом для всіх тихоокеанських народів.\n\nВраховуючи довгу історію колоніальної експлуатації, маорі довго відмовлялися пропонувати свою вірність або підтримку уряду, але після укладання рухом «Ратана» союзу між лідерами Нової Зеландії та маорі і збільшення частки маорі в уряді, держава [From.GetNameDef] стала зразком постколоніального мультикультуралізму."
 lar_news.3.a:0 "Незабаром вони з'являться за нами."
 lar_news.3.desc:0 "Після тривалих переговорів між представниками держав [FRA.GetNameDef], [ITA.GetNameDef], [POR.GetNameDef] та [SPA.GetNameDef] Паризький конгрес вирішив заново визначити африканські кордони. [FRA.GetLeader] назвав результат «найбільшим успіхом французької дипломатії в історії».\n\nУряди інших колоніальних держав одразу засудили угоду, назвавши її «загрозою миру та порядку на континенті».\n\nОскільки в цій угоді великі території відводяться країнам, які не мають, малоймовірно, Що план, складений у Парижі, можна реалізувати без кровопролиття."
 lar_news.5.e:0 "Італія — незмінно надійний союзник."
 lar_portugal_iberian_summit.7.desc:0 "[From.GetAdjective] уряд заявляє, що наші шанси на вступ до союзу [?global.POR_iberian_summit_target.GetFactionName] зростуть, якщо ми порадимося з [?global.POR_iberian_summit_target.GetAdjective]ими дипломатами, перш ніж надсилати нашу пропозицію державі [?global.POR_iberian_summit_target.GetNameDef]."
 lar_portugal_naval_blockade.1.t:0 "[POR.GetNameDefCap] відмовляється дотримуватися [ENG.GetAdjective] морської блокади"
 lar_portugal_navy_mutiny.2.a:0 "Будемо сподіватися, що вони повернуться в цілості та безпеці..."
 lar_portugal_navy_mutiny.4_extra.desc:0 "Бажаючи допомогти Іспанській республіці в боротьбі з повстанням націоналістів, на кількох португальських військових кораблях збунтувалися моряки. Заарештувавши своїх офіцерів, вони спробували покинути порт, але зустріли запеклий опір під силою. артилерії, кораблі ([?POR.POR_ships_revolted]) змогли піти і тепер прямують до Іспанії.\n\nНе зумівши придушити цей бунт, португальський уряд зажадав від нас компенсації їх втрат після закінчення війни.\n\nЗараз ми мусимо привітати наших товаришів і віддати данину відважним морякам за їхні жертви, адже багато з них було заарештовано або поранено під час повстання."
 lar_portugal_navy_mutiny.6.desc:0 "Тепер, коли заколот націоналістів пригнічений, хоробрим португальським морякам, що прийшли нам на допомогу в перші місяці конфлікту, час нарешті повернутися на батьківщину.\nМи проведемо огляд, щоб вирішити, які з португальських кораблів перебувають у достатньо хорошому стані, щоби повернутися до Португалії, а які повинні бути замінені нашими.\n\nМи багатьом зобов'язані цим хоробрим морякам і ніколи не забудемо їхню відвагу."
 lar_portugal_purchase_ships.1.a_tt:0 "Ми отримаємо §Y1§! §Yцивільний завод§! поза мапою на сплату після того, як [POR.GetNameDef] прийме рішення."
 lar_spain.19.a:0 "Нам потрібен сильний лідер — чому б і не вони?"
 lar_spain.2.f:0 "...яку ми і виграємо, ведучи революційну боротьбу!"
 lar_spain.24.t:0 "[From.GetNameDefCap] не надсилає допомогу"
 lar_spain.32.a:0 "Можливо, пізніше вони змінять свою думку."
 lar_spain.38.desc:0 "[From.GetAdjective] уряд, як ми й очікували, продемонстрував слабкість і не наважився заперечувати проти нашої окупації Танжера. Тепер ми можемо глибше інтегрувати місто до складу нашої нації."
 lar_spain.43.a:0 "Саме так і має бути."
 lar_spain.48.a:0 "Навіщо їм треба було втягувати в це нас?!"
 lar_spain.52.a:0 "Можливо, це наш шанс..."
 lar_spain.60.a:0 "Разом ми станемо сильнішими."
 last_stand_digging_in:0 "Скупчення в окопах"
 lc_stabilizers:0 "Стабілізатори"
 liangguang_clique_autonomy_sea_warlord_subject:0 "Лянгуанська кліка"
 liberate_sierra_leone:0 "Звільнити державу [SIE.GetName]"
 light_tank_aa_equipment_desc:0 "Зенітна артилерія в основному призначена для знищення літаків противника, хоча скорострільні гармати також можуть бути ефективними проти наземних цілей. Дана модель встановлена на шасі легкого танка."
 little_entente_goal_desc:0 "Паризькі мирні договори встановлюють кордони [GER.GetName], [HUN.GetName], [BUL.GetName] та [AUS.GetName]. Наша головна мета — забезпечити, щоб ці країни не почали анексувати прикордонні території та знову не зруйнували мир у Європі."
 machinefabriek_braat:0 "[INS_machinefabriek_braat_name]"
 manage_occupied_territories_no_occupation:0 "§RНа даний момент Ви не контролюєте жодні неосердні території.§!"
 manifest_fulfilled:0 "Маніфест утілений"
 marines_desc:0 "Війська, що спеціалізуються на морських десантних операціях, стають все більш незамінними. Імпровізовані тактичні прийоми та спорядження йдуть у минуле — наша морська піхота тепер проходить спеціальну підготовку і оснащена спеціальними десантними кораблями."
 mass_destruction:0 "Масове знищення"
 mechanized_attack_factor_tt:0 " $MODIFIER_MECHANIZED_ATTACK_FACTOR$: $RIGHT|+=0%$"
 mexico.1.title:0 "Заколот генерала Седільйо"
 mexico.19.p:0 "Хесус Дегольядо Гісар, генерал крістерос."
 mexico.20.a:0 "Давай, біжи до своїх янкі."
 mexico.24.b:0 "Що нам робити?"
 mexico.25.a:0 "Будь-яка допомога цінна."
 mexico.46.b:0 "Чисельність цим пихатим ідіотам не допоможе."
 mexico_snubbed_stalin:0 "Сталіну дали відсіч"
 middle_east_coring_states_tt:0 "Усі §Yблизькосхідні§! області стануть осердними."
 militarism_desc:0 "Ті, хто дивляться на армію як на необхідне зло, приречені вагатися перед обличчям війни. Ми вбудуємо мілітаризм у нашу культуру, щоби стати народом солдатів."
 military_order_of_the_white_lion:0 "Військовий орден Білого лева"
 minotor_class_1942:0 "Клас «Minotor» 1942 р."
 mio_header_armament_and_ammunition:0 "Озброєння та набої"
 mio_header_engines_department:0 "Відділ двигунів"
 mio_header_helicopter_construction:0 "Будівництво вертольотів"
 mod_grand_doctrine_mastery_gain_factor:0 "£doctrine_mod $ARG|H$ (глобальна доктрина) приріст майстерності"
 moderatism_desc:0 "Модератизм — це форма уряду, що уникає крайньо лівих і правих поглядів, обираючи політично помірні рішення иа дії."
 modifier_army_sub_unit_marines_defence_factor:0 "Захист морської піхоти"
 modifier_army_sub_unit_marines_max_org_factor:0 "Організація морської піхоти"
 modifier_army_sub_unit_marines_speed_factor:0 "Швидкість морської піхоти"
 monkey_king:0 "Король мавп"
 motorized_equipment_1_desc:0 "Моторизація піхоти — перший етап на шляху до механізації армії. Цивільні вантажівки легко пристосувати для потреб армії: транспортування солдатів, буксирування гармат, перевезення оснащення та припасів. Це значно збільшує стратегічну мобільність піхотних військ, яким інакше довелося би покладатися на ходьбу."
 motorized_rocket_equipment:0 "Моторизована ракетна артилерія"
 mtg_britain.10.d:0 "Різні члени парламенту сьогодні рішуче виступили проти планів Короля одружитися з місіс Сімпсон, залучивши до своєї справи багатьох своїх колег. Таким чином, політична опозиція до одруження Короля помітно зросла."
 mtg_britain.102.d:0 "[From.GetAdjective] уряд повідомив нас про те, що він відхилив нашу пропозицію щодо створення імперської федерації. Вони вважають, що дана концепція є неприйнятним посяганням на права їхніх народів. Самоврядування — єдино можливий шлях здійснення невід'ємного права націй на самовизначення."
 mtg_britain.16.t:0 "Едуард VIII наполягає на шлюбі"
 mtg_britain.26.a:0 "Такий варіант принесе більше проблем..."
 mtg_britain.26.t:0 "[From.GetName] підтримує державу [ITA.GetName]"
 mtg_britain.32.t:0 "[From.GetNameDefCap] відкидає пропозицію про невтручання"
 mtg_britain.55.t:0 "Комуністична громадянська війна"
 mtg_britain.61.t:0 "[From.GetName] підтримує імперських лоялістів"
 mtg_britain.89.d:0 "[From.GetAdjective] Уряд повідомив нас про те, що погоджується з нашою пропозицією щодо збільшення експорту. Вони негайно відкоригують свої торгові постанови."
 mtg_britain.98.t:0 "Імперська конференція: політика умиротворення — [From.GetName] відмовляється"
 mtg_britain.99.d:0 "Концепція федеральної держави, що охоплює всю Британську імперію, існує вже понад півстоліття, але на попередніх імперських конференціях не вдавалося досягти рішення з цього питання. У нас залишився останній шанс, перш ніж ми надамо самоврядування домініонам. Ми мусимо переконати їх у тому, що це найкраще рішення як для їх народів, так і для Співдружності націй загалом."
 mtg_exile_government.2.b:0 "Час ще не настав."
 mtg_exile_government.5.a:0 "Вони ставлять свою гордість вище за інтереси альянсу."
 mtg_netherlands.33.t:0 "[From.GetNameDefCap] погоджується скласти спільний план оборони"
 mtg_netherlands.41.b:0 "Слабка держава [From.GetName] — хороша держава [From.GetName]."
 mtg_netherlands.42.a:0 "Це дозволить нам значно модернізувати наші військові сили."
 mtg_netherlands.49.d:0 "Схоже, принц Бернард останнім часом бере досить активну участь у розробці планів бойових операцій. На щастя, всі його поради відрізняються розумністю, а плани дають чудові результати."
 mtg_netherlands.54.b:0 "Це занадто небезпечно, треба йому це заборонити!"
 mtg_netherlands.56.d:0 "Намагаючись організувати опір, принц Бернард отримав поранення. Його вдалося евакуювати на підводному човні, але має пройти деякий час, щоб він повністю відновив свої сили."
 mtg_netherlands.62.a:0 "Чудово."
 mtg_netherlands.9.d:0 "[From.GetNameDefCap] вирішує не ділитися з нами своїми кресленнями лінійного крейсера класу «Scharnhorst»."
 mtg_news.10.desc:0 "[HOL.GetAdjective] уряд намагається підтримати торговий нейтралітет, але їхні зусилля не увінчалися успіхом, а недавні заходи дають зрозуміти, що вони будуть проводити політику, яка сприятиме державі [GER.GetName]. Мабуть, в результаті [GER.GetAdjective] вплив на державу [HOL.GetNameDef] буде збільшено."
 mtg_news.16.a:0 "Час умиротворення минув. Усьому є своя межа."
 mtg_news.17.desc:0 "[From.GetAdjective] уряд оголосив сьогодні про намір вжити жорстких заходів щодо порушників Вашингтонського морського договору 1922 року. Будь-яка держава, що підписала його, порушила встановлене співвідношення основних кораблів (5:5:3:1,75:1,75), негайно отримає [From.GetAdjective] ультиматум із вимогою зменшити кількість кораблів.\n\nПоки що світова спільнота не схильна думати, що Британія здатна розв'язати війну через порушення договору."
 mtg_news.20.desc:0 "Дипломатичні відносини між державами [ITA.GetNameDef] і [GER.GetNameDef] нещодавно погіршилися після того, як ряд дрібних дипломатичних інцидентів був використаний [GER.GetAdjective]им урядом як привід до ворожої риторики. Німецькі відносини в останні роки почали поліпшуватися, новий стан справ, судячи з усього, дуже ускладнить будь-яку співпрацю між двома європейськими державами в майбутньому.\n\nКритики вказують на одночасне поліпшення англо-німецьких відносин і «зручність» [ITA.GetAdjective] дипломатичної ізоляції для Британії, що дозволяють припустити таємну змову двох держав."
 mtg_news.26.c:0 "Всіх нас чекає те саме."
 mtg_news.26.desc:0 "\nПроімперські елементи у державі [From.GetName] підняли відкрите повстання проти уряду, вимагаючи негайного повернення до домініонів Британської імперіїn. Ситуація призвела до повномасштабної громадянської війни, і [From.GetAdjective] уряд звинуватив державу [ENG.GetNameDef] у постачання бунтівникам сучасної зброї та боєприпасів. [ENG.GetAdjectiveCap]ий уряд категорично відкинув звинувачення."
 mtg_news.33.desc:0 "Якби намагаючись отримати підтримку своєї програми переозброєння, [From.GetAdjective] уряд почав переговори з профспілками і пропонує піти на поступки в обмін на їхню лояльність. Очікується, що це помітно підвищить вплив соціалістів на уряд."
 mtg_news.35.c:0 "Вони отримали по заслугах."
 mtg_news.46.t:0 "[From.GetName] переносить уряд у Батавію"
 mtg_news.48.desc:0 "[From.GetAdjective]ий і [JAP.GetAdjective]ий уряди виступили із спільною заявою про повний перехід Нідерландської Ост-Індії під [JAP.GetAdjective] контроль. Ця масштабна територіальна зміна на Далекому Сході почне діяти незважаючи на протести третіх сторін, таких як американці та британці."
 mtg_news.58.b:0 "Та як вони посміли?!"
 mtg_usa_civil_war_democrats.2.t:0 "Десятимільйонний марш"
 mtg_usa_civil_war_democrats.27.desc:0 "Невада, Арізона, Юта, Нью-Мексико і Колорадо заявили про свою підтримку повстанців. Офіційні особи штатів, які відмовилися виконувати накази щодо забезпечення проходу повстанських сил з Каліфорнії, були показово відсторонені від взяті під варту."
 mtg_usa_civil_war_democrats.31.a:0 "Це лише останні з довгого ряду зрадників, з якими потрібно буде розквитатися."
 mtg_usa_civil_war_democrats.41.a:0 "Він виконав свій обов'язок."
 mtg_usa_civil_war_fascists.13.t:0 "Губернатор мобілізує Національну гвардію"
 mtg_usa_diplomatic_protest.4.a:0 "Їх попередили. Вони вирішили не дослухатися до попередження."
 mtg_usa_foreign_support.13.a:0 "Їх чекатимуть з нетерпінням."
 mtg_usa_north_american_dominion.1.t:0 "[USA.GetNameDefCap] хоче контролювати нашу зовнішню політику"
 mtg_usa_north_american_dominion.2.desc:0 "Уряд лідера [From.GetLeader] погодився на наше прохання і надав нашому послу право вето щодо будь-якого великого політичного рішення."
 mtg_usa_senate_large_support_tt:0 "До §Y30 сенаторів§! §Gпідтримають§! уряд.\n"
 mtg_usa_southern_threat.2.a:0 "Першинг пишався б нами."
 mtg_usa_southern_threat.3.desc:0 "У довгій промові, насиченій згадками героїчних подвигів минулих поколінь мексиканців перед лицем «шаленої американської агресії», [MEX.GetLeader] відмови[MEX.GetLeader.GetVerbGendEndA_RU]ся навіть задуматися про виконання наших вимог і повідоми[MEX.GetLeader.GetVerbGendEndA_RU] наш народ, на коліна перед чужоземними загарбниками."
 murder_trotsky_attack_desc:0 "Наш агент ізолює Троцького від охорони, запропонувавши обговорити наодинці статтю. Коли вони залишаться одні, агент уб'є Троцького кригорубом."
 mutiny_3:0 "Масові бунти"
 mutiny_event.5.a:0 "This disrespect for laws is deeply worrying."
 mutiny_event.5.t:0 "Crackdown Attempt Fizzles"
 naval_effort_desc:0 "Розширення нашого флоту має бути нашою першочерговою задачею. Слід виділити всі доступні ресурси на будівництво нових верфей і дослідження легких кораблів розвідки."
 news.113.d:0 "Сьогодні тріумфуючі італійські солдати увійшли до Каїра, майже переслідуючи по п'ятах англійців, які відступали з міста.\n\nНегайно був влаштований парад перемоги, і італійці попрямували до пірамід у Гізі, щоби сфотографуватися на тлі пам'яток.\n\nЗдобувши Каїр, [ITA.GetLeader] тепер ще на крок ближче до того, щоб об'єднати італійську Східну Африку з італійською Лівією та створити єдину африканську колонію."
 news.116.d:0 "Італія отримала контроль над Гібралтаром після затяжних боїв на околицях Скелі та затоки. Часом із підземних військових тунелів, що йдуть далеко вглиб, ще лунають вибухи, але офіційно італійці стверджують, що з організованим опором покінчено.\n\nТепер, коли брами Середземномор'я опинилися під владою італійців, британському флоту буде складніше кидати їм виклик у регіоні."
 news.162.b:0 "Одного дня, ми повернемо собі всю Іспанію."
 news.164.e:0 "Перші до битви!"
 news.168.h:0 "Не пощастило."
 news.168.t:0 "Перший Люблянський арбітраж"
 news.170.t:0 "Другий Люблянський арбітраж"
 news.190.t:0 "Балеарські острови відійшли до держави [Italy.GetName]"
 news.206.e:0 "[USA.GetAdjective]ий режим не викликає занепокоєння."
 news.208.a:0 "Чи справді вони здатні загрожувати нашим володінням?"
 news.211.d:0 "Вважаючи свою військову перевагу у Східній Азії беззаперечною, [JAP.GetLeader] оголосив, що [JAP.GetNameDef] розглядає весь регіон як сферу своїх інтересів. Без точної інформації про ступінь спроможності Японії проєктувати силу, все ще незрозуміло, що саме [JAP.GetNameDef] вважає законною частиною нещодавно створеного [JAP.GetLeader] регіону [JAP.GetFactionName]."
 news.215.c:0 "Хай знекровлять один одного."
 news.218.d:0 "Хоча наша сувора програма раціонування не поширюється на свіжі фрукти, тінь війни означає, що нам бракує більшої частини наших можливостей для імпорту. Тому багато колишніх товарів з тропіків стали недосяжною розкішшю, в тому числі лимони і банани.\n\nЗберігаючи дух воєнного часу, власники магазинів почали вивішувати на своїх вітринах вивіски, що нагадують веселу мелодію старого доброго шоу.\n\nНа жаль, також не вистачає стручкової квасолі і цибулі, капусти і цибулі-шалот, а також всіх видів фруктів, але британський дух не падає духом!"
 news.22.c:0 "Ще одна перемога нашого друга [From.GetLeader]!"
 news.221.c:0 "Але ж Троцький прямо тут, у... Ох."
 news.224.c:0 "[ENG.GetAdjective]а влада чинить свій вплив."
 news.228.a:0 "Сподіватимемося, вони зможуть захистити нас від фашистської хвилі."
 news.233.d_no_war:0 "[GER.GetAdjective]а риторика по відношенню до Нордичних країн в останні тижні посилилася. Послання зрозуміле: [DEN.GetNameDef] і [NOR.GetNameDef] не повинні жодним чином, чи то протидією, чи то бездіяльністю, перешкоджати німецькому імпорту.\n\nХоча очевидної причини для таких вимог немає, оскільки імпорт все ще вільно надходить до Німеччини, наші дипломати занепокоєні тим, що це прелюдія до дій [GER.GetAdjective]их сил у регіоні."
 news.236.a:0 "Не хваліть день до того, як він закінчиться."
 news.237.a:0 "Якщо вони цього хочуть..."
 news.247.c:0 "Братерські народи стоять разом!"
 news.251.a:0 "Тоді вони можуть впоратися самі."
 news.253.a:0 "The [Root.GetFactionName] will have to do without [AST.GetNameDef]."
 news.260.c:0 "Чи це початок кінця Імперії в Африці?"
 news.270.a:0 "То ось що називається танком!"
 news.271.t:0 "«Big Bob» виходить на сцену"
 news.286.b:0 "Свобода!"
 news.290.desc:0 "У пошуках відповідного короля Угорське королівство запросило Отто фон Габсбурга повернутися на землі, які донедавна належали його родині. Отто, який жив у вигнанні по всій Західній Європі після закінчення Великої війни та розпаду імперії свого батька, вирішив прийняти цю пропозицію. Сьогодні, під гучні фанфари та урочистості, він був коронований королем Угорщини на урочистій церемонії в Королівському палаці в Будапешті.\n\nПід час своєї коронаційної промови король Отто подякував угорському народу за вірність і відданість, і пообіцяв побачити землі Габсбургів знову об'єднаними, пообіцявши, що на цей раз Угорщина буде домінуючою складовою частиною."
 news.290.t:0 "Отто приймає угорську корону"
 news.303.a:0 "Їм пощастило, що це все, що ми вимагаємо."
 news.307.desc:0 "Югославія вирішила поступитися [HUN.GetAdjective]им вимогам і домовилася про швидку передачу Воєводини своєму сусідові. Хоча це вимагало широкого застосування дипломатії канонерських човнів, не можна заперечувати, що Угорщина перетворилася на нову регіональну потугу."
 news.319.t:0 "Болгарія відхиляє вимоги Румунії"
 news.324.a:0 "Яка майстерність!"
 news.33.b:0 "Радійте поки можете, більшовики..."
 news.332.e:0 "Вони продовжать боротьбу під проводом британців."
 news.40.d:0 "У тимчасовій радянській столиці спалахнули масові заворушення. Як з'ясувалося, Лев Троцький таємно проникнув у країну, повернувшись із багаторічного вигнання.\n\nЗаручившись підтримкою вищих чинів комуністичної партії, він успішно зрік Сталіна з престолу.\n\nПісля короткого судового процесу Сталін був засуджений до смерті через повішення. Вирок був виконаний сьогодні вранці."
 news.409.a:0 "Зрозуміло."
 news.48.d:0 "Знаменита Амелія Ергарт, перша авіаторка, що пролетіла наодинці через Атлантику, зникла безвісти разом зі своїм штурманом Фредом Нунаном поблизу острова Гауленд у Тихому океані. Вдвох вони планували здійснити навколосвітню подорож на двомоторному літаку «Lockheed Electra».\n\nПошуки зниклих авіаторів ведуться ВПС і береговою охороною США, але надія на їхній порятунок мала."
 news.6.a:0 "Вони ж не посміють... так?"
 news.6.c:0 "Ми мусимо готуватися."
 nsb_coup.0.a:0 "Треба розібратися."
 nsb_news.100.desc:0 "Лев Троцький, що колись виступав соратником і можливим спадкоємцем Володимира Ілліча Леніна, був атакований у себе на віллі озброєною групою. Вбивці увірвалися в кімнату, де знаходився більшовик, і негайно відкрили вогонь, після чого поспішали. був смертельно поранений і помер через кілька годин у лікарні в Мехіко. Після невдалої боротьби за контроль над комуністичною партією Радянського Союзу, противником у якій виступали $SOV_iosif_stalin$ і його союзники, Троцький провів усі тридцяті роки у вигнанні. він жив у Туреччині, Франції та Норвегії, поки нарешті не опинився в Мексиці. \nВін невпинно критикував Сталіна і Радянський Союз, називаючи останній «виродженою робітничою державою»."
 nsb_news.103.b:0 "Чи довго воно триватиме?"
 nsb_news.3.a:0 "Ми знову єдині."
 nsb_news.4.d:0 "Довго вони місто не утримають."
 nsb_news.400.t:0 "Коронація Володимира III"
 nsb_news.402.a:0 "Наш славний альянс створений!"
 nsb_news.407.t:0 "Троїстий союз?"
 nsb_news.409.b:0 "Несподіваний поворот подій!"
 nsb_news.409.t:0 "Вісь Берлін–Москва: Токіо приєднується"
 nsb_news.5.t:0 "[POL.GetNameDefCap] коронує монарха!"
 nsb_news.8.t:0 "Королівство Литва"
 nuclear_missile_equipment_1_desc:0 "Балістична ракета середньої дальності, здатна нести ядерну боєголовку."
 nuke_dropped.11.t:0 "Атомне бомбардування Москви"
 nuke_dropped.13.d:0 "The beautiful city of Stockholm, proud Venice of the North, was struck by a nuclear bomb launched by [?global.nukecountry.GetNameDef] today. Despite their best efforts to stay neutral in the past, the Swedes have now paid the ultimate price for international conflict. The epicenter of the blast was in the middle of south central Stockholm, an area intended for future development and grand construction projects, now irreversibly destroyed.\n\nMuch of the city is beyond recognition, but the old structures at Slussen seem to have survived the blast better than expected. It has been decided that it should stand untouched forever as a monument to the city's resilience."
 nuke_dropped.2.b:0 "We must act quickly to aid the victims."
 nukes:0 "Ядерні бомби"
 occupy_north_italy_fra_desc:0 "Знову настав час французької армії увійти до Північної Італії. Тут зосереджена більша частина італійської промисловості, а без неї Рим буде знекровлений. Прорвіть хвалений Альпійський вал і увірвіться в долину річки По. Хай живе Франція!"
 operation_huansheng_critical_success_tt:0 "Під час зухвалого бомбардувального нальоту вдалося розкидати листівки над усіма визначеними містами. Усі вони потрапили в доступні та густонаселені райони, де їх миттєво підібрали місцеві жителі, поширюючи звістку про японське вторгнення повсюди."
 operation_seelowe_desc:0 "Повної перемоги на Заході ми доб'ємося, лише захопивши Велику Британію. Ми мусимо перекинути наземні війська крізь Ла-Манш і зайняти берегові плацдарми. Потім наші передові частини заглибляться на територію ворога, доки не займуть усю Британію. Імперія картковий будиночок."
 pakistan_RU_Acc:0 "Пакистан"
 paras_combat_1_desc:0 "Ніщо не може зрівнятися з ідеальною лінією зв'язку з нашими військами в тилу. Підготовка роти зв'язку до десантування дозволить підтримувати цей важливий зв'язок навіть у найгірших умовах."
 paras_combat_drop:0 "Упровадження боєм"
 paratroopers_1_reward_5:0 "$paras_keystone_1$"
 phased_array_desc:0 "На відміну від традиційних радарів, які покладаються на механічне обертання, фазовані решітки використовують електроніку для керування променем, що дозволяє їм виконувати кілька функцій одночасно, наприклад відстежувати кілька цілей."
 poland.1302.a:0 "Що ж, було варто спробувати."
 poland.2102.a:0 "Ласкаво просимо в Райх."
 poland.25.t:0 "[hosting_country_target.GetNameDefCap] вимагає, щоб [Root.GetLeader] пішов у відставку!"
 political.12.t:0 "Загроза комунізму"
 political.15.t:0 "Формується демократична опозиція"
 political.17.a:0 "Лояльні до партії [Root.GetRulingParty] підтримають рішення зараз."
 political.28.d:0 "Жахлива громадянська війна, що спустошила нашу землю, добігає кінця, і ми нарешті досягли політичної угоди. Тепер ми бачимо віч-на-віч із нашими [Root.GetAdjective]ими співвітчизниками, і разом ми відбудуємо нашу велику країну. Вороги, які прагнули нажитися на нашій міжусобиці, тепер мусять зіткнутися з об'єднаною [Root.GetAdjective]ою державою.\n\nНова держава [Root.GetName], де панує [Root.GetRulingIdeology], ніколи більше не буде розділеною!"
 political.33.a:0 "Шедевр."
 political.8.t:0 "Фашистські симпатії в армії"
 populism_desc:0 "Політичний рух із нечіткими ідеологічними рамками. Популісти виступають за політику з усього спектру, яка популярна серед електорату або сприймається як така, що суперечить уподобанням політичної «еліти»."
