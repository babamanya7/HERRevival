 XIC_sixth_encirclement_campaign_desc:0 "Незважаючи на великі втрати, завдані нам загрозою з боку КПК, ми повинні готуватися до чергового наступу, оскільки [CHI.GetLeader] знову наказав нам продовжувати кампанії оточення. Тільки зробивши це, [CHI.GetAdjective]е керівництво буде задоволене і дозволить нам зосередити нашу увагу на північному сході."
