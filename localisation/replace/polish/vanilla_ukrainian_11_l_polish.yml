 DEN_cancel_trade_with_denmark:0 "Скасувати торгову угоду з державою [DEN.GetName]"
 DEN_collaboration_government_desc:0 "Підписання мирного договору та співпраця з [?DEN.DEN_overlord_nation.GetNameDef] — єдиний спосіб врятувати наш народ від знищення та руйнації. Створивши уряд співпраці, який тісно співпрацюватиме з окупаційними військами [?DEN.DEN_overlord_nation.GetAdjective], ми отримаємо набагато більше незалежності та суверенітету, ніж більшість інших націй у подібній ситуації."
