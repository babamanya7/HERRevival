 COG_improve_the_civil_administration_desc:0 "Адміністрація в багатьох віддалених регіонах залишає бажати кращого. Ми повинні прагнути до її поліпшення, якщо хочемо, щоб наша країна працювала так ефективно, як ми бажаємо."
