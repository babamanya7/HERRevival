 HINT_AIR_BASE_TEXT:0 "Світ поділений на заздалегідь окреслені §Yстратегічні регіони§!. §YАвіакрило§! — це оперативна група з літаків одного типу (як-от винищувачів або бомбардувальників), яке можна прикріпити до стратегічного регіону.\n\nКлацнувши на §Yавіабазу§! на мапі, відкриється віконце авіабази й автоматично будуть виділені всі авіакрила на ній.\n\nЩоб прикріпити обране авіакрило до страт. регіону або передислокувати його на іншу авіабазу, §Gклацніть правою кнопкою миші§! на обраний страт. регіон або авіабазу.\n\nВи також можете прикріплювати авіакрила до армій, обравши авіакрило та клацнувши §Gправою кнопкою миші§! на армії внизу екрану."
 HINT_DIVISION_DESIGNER:0 "Підказка: Конструктор дивізій"
 HINT_LOW_SUPPLY:0 "Підказка: Постачання"
 HOA_african_cooperation:0 "Африканська співпраця"
 HOA_develop_indigenous_models_desc:0 "Покладаючись на іноземні проєкти піхотної техніки, ми ризикуємо залишитися технологічно позаду. Цю загрозу безпеці можна належним чином усунути лише шляхом збільшення внутрішнього досвіду у сфері розробки стрілецької зброї."
 HOA_the_state_bank_of_name_desc:0 "Розширивши ресурси центрального банку [ROOT.GetNameDef], ми можемо надати людям нову кредитну лінію та діяти як фінансовий сечогінний засіб для хворої [ROOT.GetAdjective]ої економіки."
 HOL_cave_to_the_germans:0 "Прогнутися під німців"
 HOL_caved_to_the_british_eng:0 "Прогнулися під британців"
 HOL_caved_to_the_germans_ger:0 "$HOL_caved_to_the_germans_eng$"
 HOL_continue_the_war_in_batavia_tt:0 "Що дасть:\n"
 HOL_cruiser_ship_engine_3:0 "«Parsons» 78 000 к. с. н. в."
 HOL_expand_the_amsterdam_petroleum_harbor_desc:0 "Збільшення розміру нашого флоту вимагає порівнянного збільшення розміру наших запасів пального, щоб у нас не залишилися кораблі, які ми не можемо собі дозволити використовувати. Амстердамська нафтова гавань уже є центром імпорту пального; ми ще більше збільшимо його ємність для зберігання."
 HOL_fokker_organization:0 "$fokker$"
 HOL_heavy_cruiser_1_desc:0 "The Dutch cruiser Soerabaja, originally named De Zeven Provinciën, was a coastal defense ship ('panterschip') built and commissioned in the Netherlands prior to World War I. She displaced over 6,500 tons and was armed with two 280mm and four 150mm guns as her main armament. She served during World War II until she was sunk by Japanese bombers in 1942."
 HOL_join_germany_desc:0 "Ми — ті, хто має споріднену душу, — повинні триматися разом проти світу. Настав час подати запит на членство в Осі."
 HOL_light_cruiser_3:0 "Клас «Tromp»"
 HOL_modern_tank_equipment_1_short:0 "GVT-8"
 HOL_placate_the_japanese:0 "Угамувати японців"
 HOL_production_under_license_desc:0 "Оскільки у нас немає вітчизняної збройової промисловості, ми повинні дивитися на нові моделі як стрілецької зброї, так і артилерії за кордоном. Якщо пощастить, ми зможемо отримати права виробляти їх усередині країни за ліцензією."
 HOL_protect_against_britain_desc:0 "Справжній нейтралітет означає, що ми будемо захищати наш суверенітет від усіх, хто його порушить... Навіть якщо це будуть британці, які намагаються захистити наші порти та аеродроми від німців."
 HOL_royal_arms_purchases:0 "Королівська закупівля зброї"
 HOL_ship_light_battery_1:0 "120mm/50 W-Fijenoord 5"
 HOL_the_battlecruiser_plan_desc:0 "Почали з'являтися голоси на користь створення трійки лінійних крейсерів; кораблі, більші за все, що ми створювали чи проєктували раніше. З доброї волі Німеччини вони могли б надати нам плани німецького лінійного крейсера «Scharnhorst», дозволивши нам використовувати їх як основу для створення наших власних проєктів. Ці кораблі напевно стримають будь-який напад на наші колонії."
 HOL_the_foundations_of_defense_tt:0 "Встановити §Yморську базу§! в Сурабаї на максимальний рівень.\n"
 HOL_the_zuiderzee_works:0 "Продовжити роботу над Зьойдерзее"
 HOL_unsinkable_aircraft_carriers_desc:0 "З появою третього виміру війни ми повинні подбати про забезпечення належного повітряного прикриття для нашого флоту. Проте прості сталеві потоплювані авіаносці — це така мінлива інвестиція... Скоріше, тисячі островів, що розкинулися через Ост-Індію, могли б служити «непотоплюваними авіаносцями», якби ми тільки поставили на них аеродроми."
