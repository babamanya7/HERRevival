 UNASSIGN_ARMY:0 "§RВідкріпити армію§!"
 UNITS_HAS_NO_ORDERS_WARNING:0 "§RДивізія належить до армії, але не має наказів!§!\nНамалюйте оборонні/наступальні лінії та прикріпіть військові частини до них."
 UNITS_VIEW_BTN_DRAW_OFFENCE_FRONT_LINE_FIRST:0 "§RСпершу Вам треба створити лінію фронту.§!"
 UNITS_VIEW_BTN_DRAW_PARADROP:0 "§HПовітряний десант§!\nКрок 1) §GКлацніть§! по своїй авіабазі, щоб указати точку зльоту. Авіабаза мусить мати доступні транспортні літаки.\nКрок 2) §GКлацніть ПКМ§! по провінції, що знаходиться в зоні досяжності місцевих транспортних літаків, щоб указати точку висадки.\n§gПам'ятайте, що транспортуватимуться лише війська з можливістю десанту.§!"
 UNIT_CANT_MOVE_TO_OCCUPIED_NEUTRAL:0 "§RНе можна ввійти в провінцію§!, контрольовану державою $OWNER|Y$.\nМи мусимо спершу попросити в них §Gправо проходу військ§!."
