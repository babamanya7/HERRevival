 CZE_align_with_germany_desc:0 "Новий уряд в [GER.GetNameDef] може й не бути менш експансіоністським, але він може виявитися більш прагматичним у тому, з ким укладати союзи, а кого засуджувати. Ми повинні докласти зусиль, щоб опинитися в першій групі."
 CZE_anti_tank_equipment_3_short:0 "6,6cm 5/800"
 CZE_appeal_to_the_castle_desc:0 "«Град» у Чехословаччині — це розгалужена мережа впливових організацій та людей, які підтримують її президентів. Ця влада, у свою чергу, дозволяє президентам здійснювати більший вплив, ніж передбачають їхні обмежені конституційні обов'язки. Звернення за підтримкою до цієї групи дало б неймовірний поштовх нашій заявці на лідерство."
 CZE_artillery_equipment_1_short:0 "8 cm vz. 30"
