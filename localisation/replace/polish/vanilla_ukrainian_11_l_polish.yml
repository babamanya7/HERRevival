 USA_transport_plane_equipment_3:0 "Douglas C-47 Skytrain"
 USA_unholy_alliance_tt:0 "У разі спільної оборони поліпшує думка та торгове ставлення до держави [SOV.GetNameDef] або Німеччини, якщо вони воюють."
 USA_war_department_desc:0 "В епоху воєн, де все вирішує промисловість, ми мусимо створити департамент, здатний повністю розкрити ресурсний потенціал нашої великої країни."
 USA_war_plan_green_desc:0 "Після революції в Мексиці не припиняються заворушення. Ми мусимо бути готові до оперативного втручання в ситуацію."
