 CHI_send_the_urban_students_to_the_countryside:0 "Відправити міських студентів у село"
 CHI_the_political_tutelage_cat:0 "Політична опіка"
 CHI_the_sky_cannot_have_two_suns_desc:0 "Комуністична підривна діяльність загрожує самій основі китайського суспільства. Лише довівши нашу вищість і знищивши їхню справу, Китай виживе, об'єднаний під одним прапором. Два сонця можуть зайти, але лише одне зійде на світанку."
 CHI_tour_the_west:0 "Поїздка на захід"
 CHI_train_for_asymmetry:0 "Тренування асиметрії"
 CHI_truly_free_speech_desc:0 "Хоча ми захищаємо людей від переслідування за їхні погляди, дискурс залишається вузьким. Нам потрібно заохочувати більше людей брати участь у публічному діалозі, щоб можна було почути безліч голосів і зайняти позицію."
 CHI_tsr_establish_the_tewu_desc:0 "Ми не повинні покладатися лише на японські спецслужби для пошуку дисидентів, тому ми повинні створити власні. За допомогою японських радників ми зможемо не тільки підготувати власних шпигунів, але й незабаром матимемо власне агентство."
 CHI_unemployment_assistance_desc:0 "Безробіття не повинно перетворювати людей на злиденних жебраків. Голод — найкращий союзник комуністів."
 CHI_use_expat_community_for_more_cic_decision:0 "Домовитися про економічну підтримку від §Y[FROM.GetNameWithFlag]§!"
 CHI_war_in_south_halting:0 "Зростаюча опозиція війні"
 CHL_align_with_the_russian_soviet_desc:0 "[SOU.GetNameDefCap] є близьким нам ідеологічним товаришем. Треба обов'язково звернутися до них із пропозицією взаємодопомоги в обмін на вступ до альянсу [SOU.GetFactionName]."
 CHL_ban_liberalism_desc:0 "Незважаючи на те, що ми викинули лібералів з уряду, вони продовжують існувати, немов нескінченні піщинки. Ми мусимо придушити їхні угруповання та не допустити, щоби вони стали настільки сильними, щоб загрожувати нашому правлінню."
 CHL_claim_the_mexican_throne_desc:0 "Колись мексиканський трон належав французькому імператору, хоч і недовго. Ми мусимо використати цей факт і ствердити, що ми є їхніми нащадками, готовими повернути країну за першої ж нагоди."
 CHL_communism_DEF:0 "Чилійська соціалістична республіка"
 CHL_crown_antoine_as_sovereign_king_desc:0 "Жак Антуан Бернар повернувся сюди з Франції з допомогою для нашого уряду під час громадянської війни, але за це ми мусимо були віддати йому владу і надати титул суверенного короля Арауканії і Патагонії. Що може піти не так?"
 CHL_democratic_alliance_party_long:0 "Демократичний альянс"
 CHL_devalue_the_peso_peso:0 "Девальвувати песо"
 CHL_dispute_over_tierra_del_fuego_desc:0 "Уряд Аргентини досі вважає східну частину Вогняної Землі своєю, незважаючи на те, що не має з нею жодного сухопутного зв'язку, а ми, очевидно, маємо більш давні та легітимні права на цю територію. Ми мусимо негайно почати діяти, щоби захистити її."
 CHL_enaer_organization:0 "ENAER"
 CHL_establish_a_royal_guard:0 "Заснувати королівську варту"
 CHL_establish_corfo:0 "Заснувати CORFO"
 CHL_expand_southern_infrastructure:0 "Розширити інфраструктуру на півдні"
 CHL_expand_the_naval_arsenal:0 "Розширити Морський арсенал"
 CHL_government_mandated_contracts:0 "Субсидовані урядом контракти"
