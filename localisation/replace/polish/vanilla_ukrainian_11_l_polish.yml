 CHI_breach_the_yellow_river_desc:0 "Жовта річка, або Хуанхе, є джерелом життєдіяльності навколишніх регіонів, але стоїть на шляху наступаючого вторгнення. Як крайній засіб проти повільного вторгнення, було запропоновано підірвати складну систему гребель і гребель.\n\nЕфективність цієї акції важко визначити, але наслідки будуть серйозними."
 CHI_bring_the_revolution_further_tt_2:0 "Маніфест нашого альянсу також включатиме §Y$Australia$ §!\nРозблоковує рішення для створення маріонеткових урядів навколо §Y$Australia$ §!"
 CHI_but_a_night_breeze_soon_falls:0 "Але нічний бриз швидко вщухає"
 CHI_controlling_our_skies_desc:0 "Перш ніж домінувати за кордоном, ми повинні панувати в небі вдома. Дисциплінована мережа протиповітряної оборони є основою національної безпеки."
 CHI_cooperation_with_the_nationalists:0 "Співпраця з націоналістами"
 CHI_counter_fascist_infiltration_measures:0 "Заходи протидії проникненню [CHI.GetRulingIdeology]"
 CHI_crush_the_communists:0 "Знищити [PRC.GetNameDef]"
 CHI_decisive_battles:0 "Вирішальні битви"
 CHI_declare_war_zone_flag_tt:0 "Вже оголошено зону бойових дій. \n Днів до повторного ввімкнення: [?CHI_declare_war_zone_flag:days_left|Y0]"
 CHI_demand_regional_adherence_desc:0 "Тепер, коли ми можемо довести регіональним правителям Китаю, що ми належним чином запровадили Три народні принципи, у нас є можливість чинити на них тиск, щоб вони зробили те саме. Це з часом має призвести до їхнього підкорення та інтеграції в республіку під керівною рукою нашої центральної влади."
 CHI_develop_hunan_tungsten_mines:0 "Розвивати вольфрамові копальні Хунаню"
 CHI_develop_southern_naval_logistics_desc:0 "Наше південне узбережжя, всіяне колоніальними ексклавами, захищене вкрай погано. Якщо ми коли-небудь збираємося зустрітися із західними державами на рівних, повернення та розвиток цієї ключової зони є необхідністю."
 CHI_draw_support_from_the_big_families:0 "Залучити підтримку великих родин"
 CHI_embrace_the_opium_trade_desc:0 "Країна потребує фінансів, і ситуації, що склалася, ми не можемо дозволити собі ретельно вибирати джерела фінансування."
 CHI_eternal_revolution:0 "Вічна революція"
 CHI_examination_yuan:0 "Екзаменаційний Юань"
 CHI_foreign_threats:0 "Зовнішні загрози"
 CHI_formalise_training_regime_desc:0 "Послідовний і суворий режим тренувань є ключем до зменшення втрат і покращення результатів. Стандартизація починається зараз."
 CHI_heavy_fighter_equipment_3:0 "CAMCO PF-98"
 CHI_heavy_weapons:0 "Важке озброєння"
 CHI_hire_soviet_designer_desc:0 "Радянці вже давно займаються розробкою бронетехніки. Допомога кращих радянських конструкторів була б безцінною для наших власних проєктів."
 CHI_industrial_evacuations_from_qingdao:0 "Евакуація промисловості з Ціндао"
 CHI_infantry_equipment_3_short:0 "ZB vz. 26"
 CHI_inflation_up_tt:0 "§RЗбільшує§! інфляцію.\n"
 CHI_internal_politics_cat_desc:0 "Подолання недбалості та відсталості Цін зайняло багато часу, але після Північного походу ми неухильно досягали прогресу. Однак наші зусилля з модернізації ще не завершені, і ми повинні прискоритися, якщо хочемо йти в ногу з рештою світу."
 CHI_introduce_income_tax_desc:0 "Спосіб фінансування держави є архаїчним і непридатним для сучасного світу. Хоча ми кілька разів намагалися запровадити прибутковий податок за останні півстоліття, цього разу ми маємо сильний уряд, який може довести справу до кінця."
 CHI_judiciary_reforms:0 "Судові реформи"
 CHI_left_kmt_party:0 "Лівий Гоміньдан"
 CHI_leverage_contacts:0 "Використати зв'язки"
 CHI_light_tank_destroyer_equipment_3_short:0 "PTZ 41"
 CHI_light_tank_equipment_3:0 "Type 41 Xiao"
 CHI_minzu_focus_desc:0 "Ідея приналежності до нації — а не до племені чи релігії — це те, що перетворює групу людей на державу. Тому ми повинні запровадити принцип Міньцзу (Націоналізм) і переконатися, що всі люди нації відчувають сильне почуття націоналізму та патріотизму, а також почуття єдності під керівництвом центрального уряду."
 CHI_move_mios_tt_no_aat:0 "Перемістить фабрики з §Y[?var:selected_mio.GetName]§! до §Y[FROM.GetName]§!"
