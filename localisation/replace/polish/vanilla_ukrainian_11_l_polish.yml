 BRA_equality_for_women_desc:0 "Старий буржуазний лад, у всіх його проявах, має бути зруйнований. З цією метою, жінки та меншини в Бразилії довгий час були ігноровані державою, і настав час нам вирішити їхні історичні скарги. Ми також повинні заохочувати їх використовувати свої здібності для розвитку нашої пролетарської республіки."
 BRA_estado_novo:0 "Estado Novo"
 BRA_fabrica_nacional_de_motores_desc:0 "Автотранспортні засоби — це складні машини, імпорт яких коштує дорого. Це може стримувати наше економічне зростання у довгостроковій перспективі. Найкращий спосіб запобігти цьому — розробити власні автомобілі, вироблені всередині країни."
 BRA_international_brigades_desc:0 "У світі, що оточує нас, вирують війни, і хоча ми не беремо в них активної участі, як добрі товариші, наш обов'язок — надіслати допомогу тим, хто її потребує, коли це в наших силах. Нерозумно було б необдумано вступати у війни, тому наразі ми повинні прагнути надіслати добровольців."
 BRA_jaguar_diplomacy:0 "Дипломатія ягуара"
 BRA_kgbrazil_just_add_operatives_desc:0 "Розвідувальна інформація про наших ворогів є критично важливим компонентом нашої здатності захищати нашу країну та інтереси, коли це необхідно. Наше Агентство доклало багато зусиль останнім часом, але воно могло б стати ще кращим, якби ми залучили до нашої справи досвідчених радянських оперативників."
 BRA_organization_of_american_states_decision_cat_desc:0 "Ми будемо намагатися заснувати й утримувати «Лігу Націй» Америки, сприяючи регіональному співробітництву та зменшуючи потребу в насильницькій конфронтації між державами-членами."
