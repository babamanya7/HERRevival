 TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_STANDARD:0 "Погляд назовні"
 TUR_counter_the_rebels_in_erzurum_desc:0 "Ерзурум — колиска курдського політичного активізму, але насильством на цьому ґрунті він не відрізняється. З іншого боку, світ постійно змінюється..."
 TUR_deal_for_the_oniki_islands:0 "Угода за острови Онікі"
 TUR_entrench_kemalism_in_state_desc:0 "Заради свого виживання ми мусимо докласти всіх зусиль, щоб ідеологія кемалізму оселилася в серцях якомога більшої кількості людей."
 TUR_extend_an_olive_branch_to_bulgaria:0 "Простягнути оливкову гілку Болгарії"
 TUR_form_the_redshirts_desc:0 "Кожен легітимний фашистський рух у всьому світі має організацію з сорочками! В англійців й італійців є чорні сорочки, у німців — коричневі, а в китайців — сині. Турецьку республіку найкраще символізує червоний колір, тому ми утворюємо рух червоносорочників! За словами «Червона сорочка» всі одразу представлятимуть людей, які підтримують нашу справу! Це ж геніально!"
 TUR_fortifying_contentious_areas_desc:0 "Балкани не просто так називають «пороховою діжкою Європи». У кожній із наших країн є як мінімум один осередок напруженості, провісник конфлікту з більшою державою. Ми мусимо переконатися, що ці осередки належним чином укріплені та захищені."
 TUR_industrial_projects_category_desc:0 "Враховуючи, наскільки молода [ROOT.GetAdjective]а держава, її новим індустріальним проєктам часто потрібна допомога уряду."
 TUR_infantry_equipment_0_short:0 "Mauser 93"
 TUR_kemalism_and_the_modern_movement_tt:0 "Усі §Yфашистські§! країни §YЄвропи§! поліпшать свою думку про державу [ROOT.GetNameDef] на +25§!."
 TUR_kemalist_officers_made_hostile_tt:0 "§RОфіцери-кемалісти будуть протидіяти уряду.§!"
 TUR_mechanising_our_army_desc:0 "Ми замахнулися високо, але інакше не можна. Механізація армій неминуча. Головне — вирішити, чи готові ми до модернізації чи варто дочекатися більш сприятливого стану справ."
 TUR_mediterranean_merchant_fleet_desc:0 "Конвої — це артерії цього альянсу, і ми мусимо об'єднаними зусиллями збільшити їх кількість. Якщо ж новий торговий флот стане таємним джерелом інформації про флотські розробки, вигода від нього суттєво зросте."
 TUR_nav_bomber_equipment_1_short:0 "Nu.D Fok"
 TUR_nav_bomber_equipment_3_short:0 "Nu.D Denizanası"
 TUR_partnership_pact_with_bulgaria:0 "Пакт про партнерство з Болгарією"
 TUR_purify_the_diyanet_desc:0 "Діянет сповнений людей, які жодного разу за своє порожнє життя не молилися до Всевишнього. У Діянеті мають бути люди віри, люди, які служать державі та звертаються до Аллаха за порадою та допомогою!"
 TUR_reuniting_thrace_through_force_desc:0 "У Фракії досі живе чимало [ROOT.GetAdjective] людей. Більшість їх ми тримаємо в Едірні, але [GRE.GetAdjective] влада продовжує наполягати на розділі території. Час нам наполягти на зворотному."
 TUR_saadabad_pact_faction_tt:0 "Ми запросимо всіх підписантів §YСаадабадського пакту§! у формальний альянс."
 TUR_ship_secondaries_2:0 "152mm/50 RF. Cannon"
