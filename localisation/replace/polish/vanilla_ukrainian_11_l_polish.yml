 taog_news.2.desc:0 "Революціонер [INS.GetAdjective] [INS.GetLeader] виступив сьогодні на Яві з промовою, проголосивши незалежність новоствореної Республіки Індонезія. [HOL.GetNameDef] не визнає суверенітет цієї нової республіки, але республіканські ополчення вже де-факто контролюють певну територію."
 targeted_sabotage_resources_2_tt:0 "Місцевий опір у державі [From.From.GetName] зосередить основні сили на саботажі місцевого видобутку ресурсів."
 tech_logistics_company2_desc:0 "Адаптувавши нашу систему аналізу ризиків до нових умов війни, ми зможемо краще убезпечити систему постачання."
 tech_maintenance_company:0 "Ремонтна рота I"
 tech_mountaineers_desc:0 "Бойові дії в горах пов'язані з високою небезпекою для піхоти, але часом їх не уникнути. Ми можемо мінімізувати ризик, провівши серед наших солдатів спеціальну підготовку для ведення бою в цих умовах."
 tech_recon3:0 "Розвідрота III"
 tech_signal_company_desc:0 "Для встановлення та підтримки зв'язку на полі бою завжди були потрібні особливі навички. З виникненням нових засобів зв'язку та виявлення під час Великої війни відкрилися нові практичні можливості."
 tfv_australia.61.a:0 "Ізнизу підніметься червона хвиля, щоби поглинути світ!"
 tfv_australia.61.d:0 "Визнаючи правдивість і праведність комуністичної справи, держава [From.GetNameDef] погодилася з необхідністю об'єднати наші зусилля під спільним прапором Океанії."
 tfv_australia.61.t:0 "[From.GetNameDefCap] приєднується до революційної боротьби!"
 tfv_australia.95.a:0 "Дуже тривожно."
 tfv_canada.72.desc:0 "[FROM.GetAdjectiveCap]а влада — ті, кого ми вважали нашими великими друзями, — відхилила нашу пропозицію про об'єднання з Ньюфаундлендом і Лабрадором. Її вперті законодавці та політики продемонстрували нам свою позицію з цього питання, і ми знаємо, як мусимо діяти з ними в майбутньому."
 tfv_new_zealand.7.t:0 "Майкл Джозеф Севедж помирає"
 tfv_raj.211.a:0 "Невже їх ніхто не зупинить?"
 tfv_south_africa.1.t:0 "[From.GetNameDefCap] просить африканський мандат"
 tfv_south_africa.40.d:0 "Після успішної військової місії в державу [From.GetNameDef] їхній уряд запропонував укласти офіційну угоду про дослідження між нашими країнами."
 tfv_south_africa.50.a:0 "Можливо, кількох наших солдатів зацікавить відпустка в Іспанії?"
 tfv_south_africa.78.d:0 "Звільнившися з-під влади колоніальних гнобителів, [BRD.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [BRD.GetAdjective]ого уряду."
 tfv_south_africa.98.d:0 "Звільнившися з-під влади колоніальних гнобителів, [LIB.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [LIB.GetAdjective]ого уряду."
 the_501st_legion_tt:0 "Повністю контролює столичні області держав §Y[FRA.GetNameDef]§!, §Y[LUX.GetNameDef]§!, §Y[HOL.GetNameDef]§! та §Y[GER.GetNameDef]§!"
