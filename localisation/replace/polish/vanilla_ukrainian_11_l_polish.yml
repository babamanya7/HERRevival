 PRC_appeal_for_foreign_aid_t34:0 "Попросити танки Т-34"
 PRC_burn_the_paper_tigers_desc:0 "Ми звернемося до [CHI.GetName] та всіх інших, щоб спробувати сформувати Другий Об'єднаний фронт проти наших спільних ворогів."
