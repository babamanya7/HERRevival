 INDUSTRIAL_ORG_TRAIT_TOOLTIP_PICK_CENTRAL_TREE:0 "Оберіть або перегляньте §Yспеціалізацію§!, щоби побачити риси."
 INSHOL_bangka_production_lines_desc:0 "Стрімкий розвиток інфраструктури Банки в результаті проєкту Банка перетворив цей колись крихітний, здебільшого неважливий острів на ідеальний майданчик для нових промислових проєктів. Ми маємо можливість зміцнити KNIL, побудувавши новий збройовий завод у Банці, який завдяки концентрованим дорогам, залізницям та портам острова працюватиме ефективніше, ніж якби ми побудували його в іншому місці."
 INSHOL_develop_bombers:0 "Розробка нових бомбардувальників"
 INSHOL_emergency_powers_gov_general_desc:0 "Триваюча війна вимагає прийняття жорстких рішень без зволікань, що неможливо, коли всі рішення в Ост-Індії повинні заздалегідь проходити через Нідерланди. Ми маємо надати надзвичайні повноваження [INS.GetLeader], щоб він міг діяти не гаючись."
 INSHOL_military_equipment_contracts_desc:0 "Ост-Індія — це величезний архіпелаг із десятками мільйонів громадян. Нам ще далеко до промислового потенціалу, необхідного для самозахисту. Проте в нас достатньо ресурсів, щоб забезпечити торгівлю по всьому світу. Шляхом укладання контрактів з демократіями по всьому світу нашу проблему можна вирішити."
 INSHOL_mountaineers_desc:0 "Ми повинні навчати гірських стрільців, які готові воювати у ворожому рельєфі нашого архіпелагу."
 INSHOL_outsourced_navy:0 "Аутсорсинг виробництва корпораціям"
 INSHOL_purchase_american_tanks_desc:0 "Хоча Ост-Індії не вистачає промисловості, необхідної для виробництва танків, ми можемо купувати їх безпосередньо у США, фінансуючи за рахунок гумової промисловості Ост-Індії."
 INS_CAS_equipment_0_short:0 "Fokker C.X"
 INS_HOL_FLAG:0 "$INS_HOL$"
 INS_HOL_FLAG_autonomy_dominion:0 "$INS_HOL_autonomy_dominion$"
 INS_agrarian_reform_desc:0 "Три століття земля Індонезії годувала плантації чужинців. Селяни, які її обробляли, мало що інше знали. Революція, яка залишає це незмінним, не є революцією взагалі. Ми доб'ємося, щоб земля перейшла до тих, хто її обробляє."
 INS_arm_the_revolutionaries:0 "Озброїти революціонерів"
 INS_arm_the_students:0 "Озброїти студентів"
 INS_chaos_events.4.t:0 "Вбивство Сукарно"
 INS_communist_events.5.desc:0 "Адміністрація в [FROM.GetName] здалася комуністичним повстанцям без бою. Губернатор і його співробітники були заарештовані, наш прапор спущено, а натомість проголошено революційний уряд. Все це організовано [FROM.FROM.GetNameDef] та їхніми агентами, які місяцями працювали над підривом нашого авторитету там. Це не що інше, як крадіжка, і вона не залишиться без відповіді."
 INS_coopereate_with_chinese_businessmen_desc:0 "Заможний і добре пов'язаний купецький клас здавна сприяв торгівлі по всьому архіпелагу. Замість того, щоб усувати ці налагоджені мережі, ми повинні працювати з ними. Їхній капітал і комерційний досвід можуть виявитися неоціненними для виведення нашої економіки з нинішнього застою."
