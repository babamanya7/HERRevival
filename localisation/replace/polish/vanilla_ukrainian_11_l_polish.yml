 ENG_bermuda_invasion_launch_point_desc:0 "Вторгнення в Північну Америку буде нелегким завданням. Ми мусимо розбудувати наші володіння на Бермудських островах, щоб мати змогу розмістити сили вторгнення на необхідний час, перш ніж їх можна буде відправити для поширення революції безпосередньо на американські береги."
 ENG_blackshirt_march_in_lanark:0 "Марш чорносорочників у Ланарку"
 ENG_british_commonwealth_air_training_plan_desc:0 "Наш військовий успіх залежить від нашого володіння повітрям, а отже, від майстерності наших екіпажів. Ми розпочнемо наймасштабнішу програму авіаційної підготовки, яку коли-небудь бачив світ, щоб забезпечити наявність усіх підготовлених льотчиків та екіпажів, необхідних для оволодіння цим новим виміром ведення війни."
 ENG_demand_treaty_compliance_tt2:0 "Розмір флоту в §Yлінкорах§!, §Yлінійних крейсерів§! і §Yавіаносцях§! порівняно з державою §Y[Root.GetName]§! — більш ніж §Y100%§!."
 ENG_destroyer_1:0 "Клас «V»/«W»"
 ENG_discuss_imperial_economy_desc:0 "Ми висунемо пропозицію, згідно з якою всі члени Співдружності повинні будуть зробити значний внесок у свою економіку, щоб менше залежати від наших інвестицій та посилити економічну міць Імперії в цілому."
 ENG_discuss_imperial_federation_desc:0 "Ще з попереднього століття були чутні пропозиції об'єднати всі частини Імперії в єдину федеративну імперію, а не розвивати автономність та незалежність усіх домініонів. Ми підготуємо підсумкове обговорення з цього питання."
 ENG_england_democratic_ADJ:0 "Англійськ"
 ENG_england_neutrality_ADJ:0 "Англійськ"
 ENG_foundations_for_an_indian_state_desc:0 "Якщо вона хоче функціонувати як незалежна держава, ми мусимо подбати про підвищення рівня індустріалізації Індії, а також про радикальну реструктуризацію її уряду. Виклики управління цілим субконтинентом, як ми з'ясували, не є простими, і Індія мусить бути готова до них, якщо хоче досягти успіху."
 ENG_harland_wolff_organization:0 "$harland_wolff$"
 ENG_imperial_federation_unified_communism:0 "Співдружність народів"
 ENG_impose_martial_law_on_australia_desc:0 "Народ Австралії введений в оману, і його потрібно захистити від самого себе. Ми відкриємо йому очі і візьмемо владу у свої руки."
 ENG_invoke_the_alliance_of_1373:0 "Нагадати Альянс 1373 року"
 ENG_light_tank_destroyer_equipment_2_short:0 "Valiant"
 ENG_medium_tank_destroyer_equipment_3_short:0 "Contentious"
 ENG_mi6_ns:0 "MI6"
 ENG_narvik_crisis_cat:0 "Нарвіцька криза"
 ENG_prepare_for_the_inevitable_desc:0 "Здається, майже напевно, що наша країна буде втягнута в черговий світовий конфлікт. Ми мусимо збільшити наші промислові витрати, щоб прискорити темпи нашого переозброєння."
 ENG_preparing_the_second_front_desc:0 "Коли почнеться війна, ми мусимо відкрити другий фронт для допомоги нашим радянським союзникам. Підготовка до цього має розпочатися вже зараз."
 ENG_reclaim_the_jewel_in_the_crown:0 "Повернути перлину британської корони"
 ENG_sp_land_flamethrower_tank:0 "Проєкт «Ronson Flamethrower»"
 ENG_sp_thermo_nuclear_bomb:0 "Green Granite"
 ENG_support_imperialist_coup_in_australia_desc:0 "Настав час підтримати лоялістів в Австралії, які готуються розпалити повномасштабну громадянську війну."
 ENG_support_imperialist_coup_in_australia_mission_2_desc:0 "Канадський уряд придушило рух наших лоялістів. Потрібно терміново відповісти на це, інакше вся надія на повстання буде втрачена."
 ENG_support_weapons:0 "Vickers MG & Stokes mortar"
 ENG_support_weapons3:0 "Bren Mk I & ML 3 inch mortar"
 ENG_take_out_the_regia_marina:0 "Знищити Regia Marina"
 ENG_transport_plane_equipment_3:0 "Handley Page Hastings"
