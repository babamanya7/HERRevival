 PRC_confrontation_with_the_warlords_desc:0 "У Китаї залишилися елементи, що ігнорують центральний уряд і тримаються осторонь протиборства. Дехто з них може навіть будувати плани захоплення країни за підтримки японських агресорів. Ситуацію потрібно виправляти."
