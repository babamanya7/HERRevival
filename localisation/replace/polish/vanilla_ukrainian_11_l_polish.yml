 war_justification.10.a:0 "[From.GetName] — це сумнівна демократія."
 war_justification.301.c:0 "Ми не можемо дозволити людям звинувачувати [ROOT.GetLeader] у боягузтві!"
 war_justification.4.t:0 "[ROOT.GetName] готується до великої боротьби"
 war_justification.5.t:0 "[ROOT.GetLeader] несе революцію в державу [From.GetName]"
 war_justification.7.a:0 "Ще є час врятувати їхню спробу соціалізму."
