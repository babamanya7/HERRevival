 SIA_allies_integration_desc:0 "Наші сили повинні навчитися битися пліч-о-пліч із Союзниками. Структури управління, зв'язок, процедури постачання та стандарти озброєння повинні бути узгоджені, перш ніж Сіам зможе стати чимось більшим, ніж просто символічним партнером."
 SIA_and_spring_the_trap:0 "І закрити пастку"
 SIA_conventional_tank_construction_desc:0 "Бронетехніка стала загальноприйнятим родом військ у сучасній війні, і імпровізовані рішення далеко нас не заведуть. Тому ми повинні створити належну танкову промисловість на основі надійних принципів, стандартних конструкцій та перевірених методів виробництва, гідних сучасної армії."
 SIA_death_to_the_communists:0 "Смерть комуністам"
 SIA_drum_up_irredentism_desc:0 "Недостатньо заручитися підтримкою військових для майбутньої війни, ми також повинні здобути підтримку населення загалом. Через вірші, фільми та промови ми підготуємо [SIA.GetName] до розплати з імперіалістичними державами, які вкрали наші історичні землі."
 SIA_expand_upon_the_dossier_desc:0 "Жовте досьє було написано під час крихкого моменту. Цей момент минув. Після поразки військової кліки ми можемо піти далі: глибша земельна реформа, сильніший захист праці та держава, здатна перебудувати Сіам з нуля."
 SIA_fortress_hanoi_desc:0 "Південь Імперії захищатиме Сайгон. Це місто-фортеця стане вартовим Бангкока, захищаючи Сіамську затоку [ROOT.GetName] від загарбників."
 SIA_heavy_tank_equipment_2:0 "Churchill Mk VII"
 SIA_increase_military_approval_2_tt:0 "Збільшує схвалення крила §YВійськових§! на §GЗначну величину§!"
 SIA_medium_tank_equipment_1:0 "Type 89 I-Go"
 SIA_medium_tank_equipment_3:0 "Type 3 Chi-Nu"
 SIA_order_discipline_and_unity:0 "Порядок, дисципліна та єдність"
 SIA_promote_military_wing_desc:0 "Потураючи вимогам офіцерів і демонструючи силу збройних сил, ми зможемо завоювати прихильність фракції Пхібуна. Однак такий фаворитизм не залишиться непоміченим: реорганізація внесе безлад у рутину армії, а порушення звичного управління дорого нам коштуватиме, поки все не вляжеться. Грубий інструмент, придатний лише для того, щоб утримати крило від межі повстання."
 SIA_public_credit_repayment_tt:0 "Ми погасимо весь наш борг за державним кредитом одразу, знявши всі борги ціною великого тимчасового штрафу на §YСпоживчі товари§!."
