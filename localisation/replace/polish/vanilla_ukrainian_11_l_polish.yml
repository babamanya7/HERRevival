 HABSBURG_an_empire_not_just_in_name_no_puppets_tt:0 "Усі підлеглі держави, які мають це §Yспільне дерево фокусів§!, здобудуть:"
 HABSBURG_the_strength_of_the_common_man_desc:0 "Навіть найкрупніший механізм спирається на найменші гвинтики. Для нас, а зокрема для нашої армії, це означає залежність від простої людини, від наших солдатів. Ми повинні переконатися, що кожен солдат нашої військової організації розуміє тягар, який лежить на його плечах, а також факт, що він має силу його нести, і що це його обов’язок."
 HAI_democratic_party:0 "Венсан"
 HAR_ETH_neutrality_subject:0 "Харерська автономна область"
 HAW_communism_party_long:0 "Комуністична партія Гаваїв"
 HAW_democratic_DEF:0 "Гавайська республіка"
 HBC:0 "Хебей-Чахар"
 HBC_fascism_ADJ:0 "Хебей-чахарськ"
