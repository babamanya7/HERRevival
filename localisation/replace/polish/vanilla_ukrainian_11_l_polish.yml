 RAJ_battleship_4_desc:0 "The Vanguard-class battleship was the last battleship to be built for the Royal Navy. A single ship was ordered but four more were considered for the Pacific theater. Ordered under the 1940 Emergency War Program, construction did not gain a high priority and was finished after the war. The class had a sleek hull, giving excellent stability and seaworthiness. The armament was the same as the Queen Elizabeth and Revenge class battleships, providing considerable firepower. Strong engines and good armor made the vessel fast and well protected."
 RAJ_carrier_3:0 "$ENG_carrier_3$"
 RAJ_combined_arms_academy_desc:0 "Нова загальновійськова академія допоможе збільшити ефективність радянської військової підготовки. Ми розширимо наші знання в галузі сучасної війни, повітряних, наземних та морських битв."
 RAJ_continue_the_five_year_plan_tt:0 "Помножить усі модифікатори в нашому §YП'ятирічному плані§! на §G+30%§!"
 RAJ_corporate_expansion_desc:0 "Економічне зростання нашого основного портфеля призвело до буму населення. Щоб забезпечити тривале зростання, ми розширимо нашу інфраструктуру, щоб розмістити наших майбутніх співробітників."
 RAJ_cripps_mission_desc:0 "Ми мусимо простежити, щоб Індія зберігала вірність Союзникам та Великій Британії, незважаючи на посилення націоналістичних рухів за незалежність. Сер Стаффорд Кріппс — досвідчений переговорник, який зможе переконати націоналістичних лідерів у тому, що їхні вимоги будуть виконані."
 RAJ_deathknell_to_the_raj:0 "Похоронний дзвін Раджу"
 RAJ_fighter_equipment_3:0 "Supermarine Spiteful"
 RAJ_hindu_mahasabha_desc:0 "Всеіндійська індуїстська велика асамблея підтримує незалежність туземних князівств, називаючи їх «основою індуїстської влади». Надавши цим штатам незалежність, ми можемо отримати від них більше фінансування та консолідувати решту нації."
 RAJ_inclusive_nationalism_desc:0 "Націоналізм та гордість за свою країну не обов'язково є поганими речами, якщо ми зможемо сприяти тому, щоб він був інклюзивним для всіх. Зв'язки не розірвуться, якщо ми всі поділяємо одну й ту ж любов до нашої нації."
 RAJ_indian_national_congress_desc:0 "Індійський національний конгрес переміг на виборах по всьому субконтиненті. Він виступає за незалежну Індію чи, як мінімум, за розширення прав автономії у складі Імперії."
