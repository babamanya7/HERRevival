 JAP_army_faction_demands_military_factories:0 "$JAP_army_faction$ вимагає більше військових заводів"
 JAP_army_securing_army_arsenals_mission:0 "Армія забезпечує контроль над життєво важливими армійськими арсеналами"
 JAP_ashigaru_category:0 "Ашігару"
 JAP_attract_foreign_investments_decision:0 "Залучити іноземні інвестиції від §Y[FROM.GetNameWithFlag]§!"
 JAP_balance_range:0 "Equilibrium"
 JAP_battleship_2_desc:0 "Лінкори «Kongo» були побудовані для Імперського союзу Японії напередодні Першої світової війни як крейсери, але наприкінці 1930-х років вони були значно модернізовані і перекласифіковані в першокласні швидкісні лінкори. Їхню броню, гармати і двигуни було радикально модернізовано, і «Kongo» стали найшвидшими японськими лінкорами часів війни."
 JAP_border_conflict_escalation_warning_MON_desc:0 "Повітряна розвідка підтвердила значні переміщення військ з [JAP.GetAdjective]ого боку. Ми не знаємо, чи вирішили [JAP.GetAdjective]і війська завдати удару і коли, але ми маємо бути готовими."
 JAP_carrier_3_desc:0 "Авіаносці класу «Shokaku» були спроєктовані для високої швидкості, великого радіусу дії, потужного захисту і великої авіаційної місткості, що робило їх чудовими авіаносцями. Завдяки вдосконаленим методам будівництва, вони могли витримувати повне навантаження в 33 000 тонн і могли витримати більше пошкоджень, ніж більшість сучасних авіаносців."
 JAP_civilian_nuclear_reactor_investments_tt:0 "Замінює §Y$JAP_early_industrialization_efforts_dm$§! на §Y$JAP_the_economic_mirale_dm$§!, ефект зміни:"
 JAP_claim_the_scripech_desc:0 "Наш Божественний Імператор стоїть вище за всіх інших, і ті, хто цього не розуміє, мають бути знищені. Ми повинні вдертися в [NEP.GetNameDef] і забрати їхній трон собі."
 JAP_contact_the_masterless_samurai_desc:0 "Ронінкай — це ультранаціоналістична антидемократична політична група, яка має багато спільних членів зі схожими організаціями, такими як Товариство темного океану та Товариство чорного дракона. Це таємне товариство, засноване Танакою Хіроюкі у 1908 році, зараз впливає на більшість наших правих політиків. Ми повинні звернутися до них і встановити зв'язки між ними та нашим урядом."
 JAP_core_MAN_state:0 "Реорганізувати §Y[FROM.GetName]§! у новий адміністративний підрозділ"
 JAP_coup_mongolia_trigger_tt:0 "Сумарна підтримка нейтральних і фашистів перевищує 40%"
 JAP_coup_the_mongolian_government_decision_tt:0 "§RЦе може призвести до війни з [MON.GetNameDef] та їхніми союзниками!§!"
 JAP_cruiser_ship_engine_3:0 "«Kampon» 102 000 к. с. н. в."
 JAP_democratic_foreign_exchange_allocation_policy_desc:0 "Фондовий ринок — це потужний інструмент. Ми повинні використовувати потік іноземного капіталу та гарантувати, що наші економісти та промисловці зможуть інвестувати якомога більше коштів у нашу націю, що розквітає."
 JAP_distribute_rations_decision:0 "Роздавати пайки"
 JAP_draft_the_showa_constitution_desc_key_emperor_showa:0 "Ми приймаємо і поважаємо імперську історію нашої нації. Однак авторитаризму немає місця в Японії, яку ми хочемо побудувати. Ми збережемо Імператора як номінального лідера, але обмежимо його владу в конституції, як це є в багатьох західних країнах."
 JAP_educate_the_peasants_tt:0 "Бонус до швидкості досліджень від §Y$JAP_educating_the_peasants_modifier$§! зростає на §G1%§! за кожного нового члена альянсу, до максимуму §G10%§!"
 JAP_empower_the_shogun:0 "Наділити владою Сьогуна"
 JAP_empower_the_thought_police_desc:0 "Спеціальна вища поліція існує з метою забезпечення дотримання цивільного законодавства, контролю над політичними групами та ідеологіями, що вважаються загрозою громадському порядку Японської імперії, а також для контррозвідки, внутрішніх кримінальних розслідувань, вищої поліцейської діяльності та громадської безпеки. Ми повинні зміцнити цю організацію, щоб вони могли виконувати свою роботу ефективніше."
 JAP_escort_efficiency:0 "Інвестувати в повітряний супровід"
 JAP_escort_efficiency_desc:0 "Ми повинні зберігати перевагу над нашими ворогами у всіх сферах, включаючи повітряну війну, щоб наші бомбардувальники і транспортні літаки не були перехоплені та збиті. Модернізовані винищувачі є важливими для досягнення цього і ключем до майбутніх перемог."
 JAP_expand_boeitai_recruitment:0 "Розширити набір до Боейтай"
 JAP_expand_the_showa_steel_works:0 "Розширити Металургійний комбінат Шьова"
 JAP_formalize_japan_china_manchukuo_alliance:0 "Альянс Японія – Китай – Маньчжоу-го"
 JAP_found_the_great_japan_press_association:0 "Заснування Асоціації преси Великої Японії"
 JAP_fund_propaganda_films:0 "Фінансування пропагандистських фільмів"
 JAP_fund_resistance_groups_in_asia:0 "Фінансувати групи опору в Азії"
 JAP_further_rural_investments_tt:0 "Розблоковує рішення для §Gпокращення§! §Yкатегорії регіону§! для зазначених вище регіонів, якщо вони мають рівень §Yінфраструктури§! §Y4§! або більше"
 JAP_greater_army_dominant_fascism:0 "Велика Японська імперія"
 JAP_guardian_of_INS:0 "Перейняти панування над Індонезією"
 JAP_hakko_ichiu_tt:0 "Відкриває рішення для інтеграції §Yазійських§! регіонів, які або §Yналежать§! нам, або §Yконтролюються нами та на які ми маємо претензії§!"
 JAP_hold_a_peoples_tribunal:0 "Провести народний трибунал"
 JAP_hydroelectric_dams_in_korea:0 "Гідроелектростанції"
 JAP_hydroelectric_dams_in_korea_desc:0 "Індустріалізація та електрифікація Кореї різко припиняться, якщо ми не втрутимося і не зробимо щось із цією ситуацією. Ми повинні побудувати нові гравітаційні греблі в регіоні; наші інженери з Гідроелектричної компанії річки Хан вже розробили складні плани будівництва греблі, яку вони називають Хвачхон."
 JAP_increase_takahashi_korekiyo_security_decision_tt:0 "Охорону Такахаші Корекійо буде посилено, щоб захистити його у разі будь-яких нападів армійських радикалів, але в результаті вони можуть змінити пріоритети у своєму списку цілей і кинути більше сил на усунення когось іншого"
 JAP_light_cruiser_4_desc:0 "Клас «Agatsuma» був легким крейсерським класом, в якому до кінця війни не було побудовано жодного корабля. Крейсери були спроєктовані як швидкі і добре озброєні, але легкоброньовані, для захисту флотів і авіаносців від ворожої авіації."
 JAP_light_industry_development_desc:0 "Легка промисловість задовольняє базові потреби наших збройних сил, тому її слід розвивати."
 JAP_light_tank_artillery_equipment_2_short:0 "Ke-Nu"
 JAP_mobilize_the_proletariat:0 "Мобілізувати пролетаріат"
 JAP_modern_shogunate:0 "Сучасний шьогунат"
 JAP_mongol_autonomous_state:0 "Монгольська автономна держава"
 JAP_mongol_autonomous_state_desc:0 "[MON.GetNameDefCap] стверджує, що є справжнім монгольським урядом — ідея, проти якої категорично виступає князь Де. Ми повинні провести подальшу реорганізацію та перейменування його володінь, щоб він міг висунути більш легітимні претензії на всі монгольські землі."
 JAP_naval_faction_demands_dockyards_tt:0 "Має більше ніж §Y[?JAP_desired_naval_factories]§! $dockyard$"
 JAP_organize_underground_resistance_tt:0 "Розблоковує рішення для §Yнальотів на армійські склади зброї§! та отримання спорядження на початку революції, накладаючи незначний штраф на протилежну сторону"
 JAP_pacific_union_fascism:0 "Велика Паназійська імперія"
 JAP_pacific_union_neutrality_DEF:0 "Велика Паназійська держава"
 JAP_pre_emptive_coup:0 "Превентивний переворот"
 JAP_pressure_france:0 "Вимогти Індокитай"
 JAP_raid_a_truck_depot_decision_tt:0 "Коли почнеться громадянська війна, ми отримаємо §G250§! §Yвантажівок§!, а наш супротивник отримає невеликий штраф на 180 днів"
 JAP_raise_support_within_the_proletarian_class:0 "Здобути підтримку серед пролетаріату"
 JAP_return_manchuria:0 "Повернути Маньчжурію"
 JAP_rocket_artillery_equipment_1:0 "20-см ракетний міномет «Type 4»"
 JAP_sea_rekindle_the_old_alliance:0 "Відродити старий альянс"
 JAP_seek_strength_in_numbers:0 "Шукати силу в кількості"
 JAP_send_jonjurjab_to_mongolia_decision:0 "Відправити Джонджуржаба до Монголії"
 JAP_ship_torpedo_sub_4:0 "6 x 53.3cm w/P.Loading"
 JAP_showa_restoration_communism:0 "Японська народна республіка"
 JAP_showa_restoration_communism_DEF:0 "Японська народна республіка"
 JAP_showa_restoration_desc:0 "Час символізму минув; імператор повинен взяти під особистий контроль державні відносини. Лише так наша імперія зможе вистояти проти імперіалістичного Заходу."
 JAP_sp_land_land_cruiser:0 "Проєкт надважкого танка «O-Ni»"
 JAP_strenghten_manchukuo_imperial_airforce:0 "Зміцнення Імперських ВПС Маньчжоу-го"
 JAP_strengthen_civilian_government:0 "Посилити цивільний уряд"
 JAP_strike_the_southern_road:0 "Удар на південному напрямку"
 JAP_subject_DEF:0 "$OVERLORDADJ$а $JAP$"
 JAP_submarine_4:0 "Клас «Sen-Toku»"
 JAP_support_the_kodoha_faction_desc:0 "З'явилося нове угруповання, що прагне захопити владу і завдати удару на північ по СРСР. Ми мусимо всіма силами сприяти її перемозі — на благо імператора та майбутнього імперії."
 JAP_tauran_border_incident_forgotten:0 "Вікно можливостей"
 JAP_technological_exchange:0 "Технологічний обмін"
 JAP_the_labor_farmer_faction_ascendant_desc:0 "У дебатах перемогла більш ідеалістична та орієнтована на селян фракція Роно-ха, яка дивовижним чином здолала Кодза-ха. Хоча цей об'єднаний рух і вийшов переможцем, головне питання залишається відкритим: хто стане наступним прем'єром республіки?"
 JAP_the_manchurian_project:0 "Маньчжурський проєкт"
 JAP_the_spirit_of_the_imperial_nation:0 "Дух Імперської нації"
 JAP_the_unthinkable_option_desc:0 "Майбутнє нашої нації вимагає від нас піти шляхом, яке ніколи не розглядалося нашими керівниками. Тепер нам доведеться серйозно його обдумати."
 JAP_tojos_premiership_desc:0 "З огляду на поточну ситуацію, життєво важливо обрати прем'єр-міністра, який зможе згуртувати Імператорську армію (IJA) навколо себе та керувати як військовий лідер, так і як цивільний. Тому генерал Хідекі Тоджо буде обраний, щоб вести націю до слави."
