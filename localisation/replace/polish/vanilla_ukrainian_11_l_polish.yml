 NOR_alt_dem_expedite_training_desc:0 "Ми опинилися в жахливій ситуації. Якщо незабаром ми не навчимо нових військ, ми всі можемо бути приречені."
 NOR_assure_the_population:0 "Запевнити населення"
 NOR_buy_aa_from_sweden_desc:0 "Наш східний сусід, [SWE.GetName], протягом тривалого часу досягає успіху у виробництві протиповітряної зброї, що набагато перевищує все, що ми можемо виготовити. Ми могли б звернутися до них із проханням придбати ці гармати Bofors, щоб захистити нашу небо під час неминучого вторгнення."
 NOR_claims_on_denmark_desc:0 "[NOR_GetDanishClaimsDesc]"
 NOR_claims_on_ireland_desc:0 "Те, що колись було просто чорною лагуною, яку оселили наші скандинавські предки і назвали Дуйблін. З цього, здавалося б, незначного місця багато вікінгів процвітали, здійснювали набіги та змішувалися з гельськими племенами. Звичайно, вони не заперечуватимуть, якщо ми повернемо його, словом чи через сила."
