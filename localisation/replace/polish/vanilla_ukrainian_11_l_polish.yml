 siam.38.desc:0 "[SIA.GetAdjective] Уряд прийшов до нас із закликом про умови. Їхні міністри тепер визнають те, що наші гармати вже довели: [ROOT.GetNameDef] утримує ініціативу в цій боротьбі. Ми можемо прийняти їхню капітуляцію і звести їх до покірності, зв'язати їх із нашим альянсом, щоб їхній уряд служив нашій ширшій справі, або відкинути будь-який компроміс і продовжити кампанію, поки Сіам не буде повністю окупований."
