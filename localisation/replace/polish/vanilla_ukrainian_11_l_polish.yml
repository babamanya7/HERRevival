 GOT_newsevents.1.desc:0 "[FROM.GetAdjective] вдалося підкорити європейців і встановити свою гегемонію над континентом, а також вжити заходів для інтеграції нещодавно завойованих територій. Уряд [FROM.GetAdjective] спробував об'єднати народ навколо державних і соціалістичних ідеалів, розпочавши кілька загальнонаціоналістичних пропагандистських кампаній з метою збільшення підтримки пролетаріату. \n\n[FROM.GetLeader] оголосив, що об'єднані пролетарі Європи відтепер будуть відомі як «[From.GetNameDef]»."
