 resistance_contacts_briefings:0 "Обговорення стратегії"
 resistance_support_distribute_weapons_desc:0 "Наші агенти організують та скоординують кілька викидів зброї. Ця зброя потім буде передана надійним членам місцевого опору."
 resistance_support_pidgeons_outcome:0 "Ми залишили в тилу ворога кілька голубів, а також інструкції про те, як годувати їх та доглядати за ними."
 reunified_germany_fascism:0 "Німецький Райх"
 rocket_artillery_equipment_short:0 "Ракетна артилерія"
 rocket_interceptor_2_desc:0 "Реактивні перехоплювачі, як і раніше, вважаються вкрай небезпечними у використанні, але тепер вони оснащені автопілотом, а їх буксують інші літаки. Це дозволяє з максимальною вигодою використовувати їхню високу швидкість і компенсувати обмежений запас пального."
