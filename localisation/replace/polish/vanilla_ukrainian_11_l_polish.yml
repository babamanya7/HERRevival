 SOV_build_national_academy_of_sciences_integrated_republic_FIN_desc:0 "Ми збудуємо [FIN.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_carefully_planned_assassination_tt:0 "Агент НКВС спробує проникнути у внутрішнє коло Троцького та вбити його.\n\nШанси на успіх у вбивстві Троцького зростуть, якщо §Y[FROM.GetFlag][FROM.GetNameDefCap]§!:\n- Має високу підтримку комуністів\n- Має добрі стосунки з [ROOT.GetFlag][ROOT.GetNameDefCap]\n- Перебуває в альянсі з державою [ROOT.GetFlag][ROOT.GetNameDefCap]\n- Є суб'єктом держави [ROOT.GetFlag][ROOT.GetNameDefCap]\n- Вже здійснено рейд на віллу Троцького\n"
 SOV_carrier_1_desc:0 "The Ismail class aircraft carrier was the direct conversion of the unfinished hull of her Borodino-class battlecruiser namesake. Due to the nature of conversion, the ship would have a thick armor belt and strong anti-surface and AA armament for her time. A moderately-sized air group would provide her fleet the necessary air cover. The project was not carried out due to costs and the state of the Soviet shipbuilding industry after the October Revolution."
 SOV_comecon_industrialization_program_modifier_tt:0 "Ідею §Y$SOV_comecon_sov_default$§! буде змінено:\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y+8.0%§!\n§YЦільова країна§!:\nІдею §Y$SOV_comecon_sov_default$§! буде змінено:\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-5.0%§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+20.00%§!"
 SOV_comecon_joint_military_program_modifier_tt:0 "Ідею §Y$SOV_comecon_sov_default$§! буде змінено:\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y+3.0%§!\n $MODIFIER_COMMAND_POWER_GAIN_MULT$: §R-15%§!\n§YКожен суб'єкт§!:\nІдею §Y$SOV_comecon_sov_default$§! буде змінено:\n £army_experience£ Досвід армії: §G0.50§! щодня\n £navy_experience£ Досвід флоту: §G0.50§! щодня\n £air_experience£ Досвід авіації: §G0.50§! щодня\n $MODIFIER_TRAINING_TIME_FACTOR$: §R+10.00%§!\n $MODIFIER_COMMAND_POWER_GAIN$: §G0.10§!"
 SOV_covert_operations_tt:0 "Відкриває §Yрішення§! з метою підставити партійців і військовослужбовців."
