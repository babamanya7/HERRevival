 PER_communist_events.12.a:0 "Чудово!"
 PER_communist_events.3.desc:0 "Активність серед курдських сепаратистів та соціалістів досягла апогею в останні дні. Також зростає кількість доказів того, що по всій країні розподіляється зброя для підготовки до повстання в найближчі тижні. Якщо ми не почнемо діяти незабаром, повномасштабної війни може не уникнути."
 PER_dig_and_defend_desc:0 "Оскільки ворожі сили стікаються на територію нашої великої нації з усіх боків, ми повинні діяти швидко, якщо хочемо врятувати [PER.GetNameDef]. Замість того, щоб переходити в наступ, вкрай необхідно окопатися для захисту та створювати проблеми для загарбників. Інакше ми ризикуємо зазнати великих втрат."
 PER_end_civil_war_tt:0 "Виконання всіх трьох рішень припинить загрозу громадянської війни."
 PER_expand_oil_production:0 "Розширити видобуток нафти"
 PER_expand_oil_production_desc:0 "[PER.GetNonIdeologyName] багатий на нафту, і ми були б дурнями, якби не використовували це на власну користь. Давайте розширимо наш видобуток нафти, щоб ми могли мати хороші позиції для переговорів із Заходом пізніше."
 PER_fascist_secularism_desc:0 "Насильницьке навернення Перської імперії до Ісламу знищило нашу колись велику культуру. Ми повинні повернутися до нашого коріння та відкинути цю іноземну релігію з усіх аспектів публічного життя, запровадивши суворий кодекс секуляризму."
 PER_forced_secularization:0 "Примусова секуляризація"
