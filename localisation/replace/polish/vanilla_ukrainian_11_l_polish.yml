 SPA_motorization:0 "Моторизація"
 SPA_restore_the_empire:0 "Відновити імперію"
 SPA_unify_the_nationalist_front_desc:0 "Повстанці, або «націоналісти», як вони почали себе називати, являють собою вільний набір груп, об'єднаних лише бажанням повалити Республіку. Шлях до успіху полягає в уникненні внутрішньої боротьби та зосередженні на боротьбі з нашими спільними ворогами."
