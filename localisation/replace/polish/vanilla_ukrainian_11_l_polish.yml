 PAR_reach_out_to_european_contacts_desc:0 "Армія надто сильна порівняно з нашими нашвидкуруч зібраними силами. Нам потрібно проковтнути нашу гордість і звернутися по допомогу до [USA.GetName] та переконати їх, що комуністична держава на їхньому подвір'ї є небажаною."
