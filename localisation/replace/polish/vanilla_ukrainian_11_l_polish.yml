 PRC_reinforce_teachings_from_USSR:0 "£BoP_right_texticon Посилити вчення з СРСР"
 PRC_reorganize_divisions_desc:0 "Щоб і надалі модернізувати нашу армію, ми повинні реорганізувати будь-яке ополчення, що залишилося, у дивізії та переконатися, що наявні дивізії є однаковими за своєю силою. Це дозволить нам створити чіткий ланцюг командування, що, своєю чергою, полегшить координацію наших військ."
 PRC_sea_anti_japanese_expedition_desc:0 "$PRC_anti_japanese_expedition_desc$"
 PRC_sea_reforming_our_ranks_desc:0 "Щоб забезпечити успіх нашої революції, ми повинні реорганізувати наші лави і, у свою чергу, згуртувати сільський клас. Без їхньої допомоги ми просто не матимемо дієздатної армії, але з ними на нашому боці ми зможемо отримати перевагу над нашими супротивниками."
 PRC_seek_support_from_ussr:0 "Шукати підтримки у [SOU.GetNameDef]"
 PRC_strat_bomber_equipment_3_short:0 "H-7"
 PRC_submarines_desc:0 "Використання підводних човнів у наших прибережних водах було б економічно ефективним і живучим способом захисту нашої прибережної інфраструктури. Хоча ці підводні човни не будуть призначені для великих глибин, вони принаймні стануть кроком до розробки більш досконалих моделей."
 PRC_the_fight_of_a_people_desc:0 "Наш народ повинен чинити опір наступу наших ворогів, навіть опинившись на окупованій ними території. Ми повинні посилати невеликі загони для згуртування місцевого опору, щоб ефективно підривати діяльність окупанта і, зрештою, звільнити батьківщину."
 PRC_the_peoples_doubt_tt:0 "Коли §Y[PRC.GetNameWithFlag]§! приєднається до боротьби проти загарбників, або загарбники будуть у мирі з усім Китаєм."
