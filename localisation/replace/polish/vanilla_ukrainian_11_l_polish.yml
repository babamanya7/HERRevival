 bba_news.200.d:0 "Це ніщо не міняє. Ми боротимемося до останнього."
 bba_news.3.desc:0 "Усвідомивши, що війна проти держави [ETH.GetNameDef] перетворюється в війну на виснаження, [ITA.GetAdjective]а влада була змушена вступити в переговори про перемир'я. Більшість уважала, що [ETH.GetAdjective]а армія просто розсиплеться після нещодавнього комуністичного повстання в країні, але [ETH.GetLeader] успішно обернув курс війни, врятувавши більшу частину країни від [ITA.GetAdjective]ої окупації. Однак, значна частка Східної Африки досі перебуває від [ITA.GetAdjective]им управлінням, через що неясно, як довго цей хиткий мир проіснує."
 befriend_siam_focus_desc:0 "Сіам уникнув європейської колонізації і не звик бути чиїмось васалом. Ми не станемо його завойовувати і спробуємо схилити до співпраці, щоби зберегти звичний стан справ."
 bftb_bulgaria_balkan_federation.17.t:0 "[TUR.GetNameDefCap] поступається балканськими землями"
 bftb_bulgaria_balkan_federation.9.t:0 "[FROM.GetNameDefCap] просить військової допомоги"
 bftb_bulgaria_british_influence.1.c:0 "У нас є важливіші справи."
 bftb_bulgaria_equipment_purchases.3.c_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_heavy_armor]§! од. §Yважких танків§!"
 bftb_bulgaria_equipment_purchases.6.c_tt:0 "[FROM.GetNameDef] побудує §Yлегкий крейсер§! для [ROOT.GetAdjective]ого флоту."
 bftb_bulgaria_equipment_purchases.8.t:0 "Завершено будівництво кораблів — підводні човни"
 bftb_bulgaria_factions.17.a:0 "То нехай ці уми приймаються за роботу!"
 bftb_bulgaria_factions.47.a:0 "Продовжуємо твердити, що це на краще..."
 bftb_bulgaria_factions.54.a:0 "Яке розчарування..."
 bftb_bulgaria_fate_of_the_balkans.10.a:0 "[BUL.GetNameDef] за це поплатиться!"
 bftb_bulgaria_italian_influence.1.b:0 "Ми не будемо ділитися технологічними відкриттями з [BUL.GetAdjective]им народом!"
 bftb_bulgaria_tsar_boris.2.desc:0 "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 bftb_greece.101.desc:0 "Якщо раніше і були сумніви щодо можливості альянсу комуністів і венізелістів, то тепер вони зникли. Нам повідомили, що комуністи потай провезли Елефтеріоса Венізелоса назад в країну, сподіваючись зробити його кимось ніби тимчасовим правителем. як вони скинуть монархію.\n\nВельми необачний план — навіть для купки червоних зрадників. З чого вони взагалі взяли, що Венізелос поверне їм владу після того, як її отримає? Це безумство. З іншого боку, ні комуністи, ні Венізелос ніколи не відрізнялися особливою розсудливістю. Ми мусимо готуватися до громадянської війни."
 bftb_greece.168.c:0 "Ми ніколи не піддамося на [FROM.GetAdjective]ий шантаж!"
 bftb_greece.174.desc:0 "$bftb_greece.167.desc$"
 bftb_greece.182.a:0 "Натхненний успіх!"
 bftb_greece.187.t:0 "[FROM.GetAdjectiveCap]і інвестори вкладають кошти!"
 bftb_greece.191.b:0 "Ні, цього разу ми не будемо робити інвестиції..."
 bftb_greece.192.c:0 "[ROOT.GetNameDefCap] більше не веде справи з державою [FROM.GetNameDef]."
 bftb_greece.200.a:0 "Ми можемо похвалити себе за це."
 bftb_greece.202.desc:0 "Іракліонська конвенція офіційно завершилася та пройшла з великим успіхом! Всі учасники, крім держави [FRA.GetNameDef], залишили її, заручившись правами на територіальні претензії, а держава [GRE.GetNameDef], зважаючи на все, згодом значно розширити свої кордони. Разом усі, хто підписався, помстяться за Севрський мирний договір негідній державі [TUR.GetName]."
 bftb_greece.217.t:0 "Велика фашистська рада в Галікарнасі"
 bftb_greece.218.t:0 "Анатолійські фашисти бунтують!"
 bftb_greece.220.t:0 "[FROM.GetNameDefCap] погоджується на енозіс!"
 bftb_greece.232.a:0 "Хай живе василевс Адолфос I!"
 bftb_greece.234.desc:0 "З Іракліонської конвенції повідомляють, що головні країни схвалили [GRE.GetAdjective]у пропозицію так званої Великої ідеї. Мало того, що стабільність регіону поставлена під загрозу, — в не такому вже далекому майбутньому [GRE.GetNameDef] і [TUR.GetNameDef] можуть почати повноцінну війну.\n\nНе можна закривати очі на те, що [GRE.GetNameDef] ось-ось отримає військову підтримку. [ENG.GetNameDef], — згідно з поточними військовими зобов'язаннями ми і [TUR.GetNameDef] — союзники, а значить, у майбутній війні можемо виявитися не на тому боці і виявити, що нас атакує провідна держава, а то й обидві Наші воєначальники наполегливо радять не забувати про це та переглянути домовленості, згідно з якими [TUR.GetNameDef] знаходиться під нашим захистом."
 bftb_greece.32.desc:0 "Офіційні особи нашої країни обурилися, прочитавши абсолютно нереалістичні та нерозумні вимоги жалюгідних марксистів з країни [FROM.GetNameDef]. Заявивши, що діє від імені держави [SOV.GetNameDef], [FROM.GetNameDef] вимагає від нас виконати всі вимоги Лозаннського мирного договору і допустити в нашу країну солдатів як «надійну і неупереджену третю сторону», щоб вони могли забезпечити дотримання нами умов договору.\n\nЧого [FROM.GetAdjective]а держава сподівається досягти такого Абсурдними вимогами, якщо не конфлікту на наших кордонах?Ми щосили намагалися забезпечити мир, але, схоже, їм він був не потрібен... Якщо держава [SOV.GetNameDef] і справді діє [FROM.GetAdjective]ими руками, то, можливо, лише капітуляція врятує нас і не дозволить [SOV.GetAdjective]им солдатам силою захопити владу в нашій країні, але раніше ми ніколи не відмовлялися від боротьби за праву справу. Що вже боротися за свої цінності?"
 bftb_greece.46.a:0 "Когось слід за це розстріляти!"
 bftb_greece.53.t:0 "[FROM.GetNameDefCap] шле нам допомогу!"
 bftb_greece.65.a:0 "Разом ми творитимемо історію!"
 bftb_greece.68.desc:0 "Ми зустрілися з делегатами з держави [FROM.GetNameDef] і з полегшенням дізналися, що [FROM.GetAdjective]а адміністрація виявила бажання бачити державу [FROM.GetNameDef] в альянсі [ROOT.GetFactionName]. Сюрпризом це не назвеш: [FROM.GetAdjective]а позиція без нас була неспроможна. Треба вирішити, на користь або на шкоду нашим цілям піде їхнє партнерство в нашому альянсі."
 bftb_greece.8.t:0 "Запрошення на Іракліонську конвенцію"
 bftb_news.11.b:0 "Це переконає [BUL.GetAdjective]ий уряд підтримати нас!"
 bftb_news.201.b:0 "Відмінний день для збереження миру."
 bftb_news.202.a:0 "Вони не дарма боялися нашої сили."
 bftb_news.302.d:0 "Овва."
 bftb_news.5.t:0 "Кампанія з болгарської реінтеграції на Балканах"
 bftb_news.6.desc:0 "Із підтримкою уряду Болгарський екзархат змусив константинопольського патріарха визнати автокефалію Болгарської православної церкви. \nЗіткнувшись з подібними вимогами і дізнавшись, що їх підтримує [BUL.GetLeader], Вселенський патріархат Константинополя був змушений дозволити Священному синоду прийняти новий статут, який дозволяє обрати главу Болгарської церкви і, таким чином, уперше за сім століть відновити Болгарський патріархат."
 bftb_turkey.101.t:0 "[FROM.GetNameDefCap] продовжує чинити опір"
 bftb_turkey.103.t:0 "[FROM.GetNameDefCap] відмовляє нам!"
 bftb_turkey.117.b:0 "Воля народу понад усе..."
 bftb_turkey.129.t:0 "[FROM.GetNameDefCap] інвестує у нашу легку промисловість"
 bftb_turkey.2.t:0 "[ENG.GetName] надає підтримку"
 bftb_turkey.24.f:0 "Реджеп Пекер — той, хто об'єднає фашизм і кемалізм."
 bftb_turkey.27.t:0 "[FROM.GetName] зберігає впевнений контроль над Хатаєм"
 bftb_turkey.29.a:0 "Приємно бачити, що стільки сміливців з'явилися на захист нації."
 bftb_turkey.49.a:0 "Дуже шкода."
 bftb_turkey.59.desc:0 "[FROM.GetAdjectiveCap]ий уряд відхилив справедливі умови, висунуті в обмін на нашу допомогу. Якби [FROM.GetAdjective]ий уряд просто погодився взяти свою частку, всі були б у виграші. Тепер їм доведеться чекати ще кілька років, перш ніж вони взагалі зможуть знайти чорне золото."
 bftb_turkey.69.t:0 "[IRQ.GetAdjective] фашисти перемагають"
 bftb_turkey.72.t:0 "[FROM.GetNameDefCap] підтримує нас"
 bftb_turkey.81.desc:0 "Ми дізналися, що [FROM.GetNameDef] не збирається відновлювати пакт про ненапад. Навпаки, [FROM.GetAdjective] влада вже відмовилася від колишніх домовленостей, остаточно розвіявши ілюзії, що [FROM.GetNameDef] цікавиться з нами."
 bftb_turkey.87.desc:0 "Підлі [BUL.GetAdjective]і боягузи знайшли спільників у марній боротьбі за безпеку! Ми, звичайно, хотіли уникнути подібних ускладнень. Необхідно вирішити, чи продовжимо ми натиск і змусимо їх прийняти наші вимоги або час відступити велику війну."
 boost_party_popularity_initiator_desc:0 "Держава $COUNTRY|Y$ підтримує зростання популярності зарубіжної політичної партії"
 branch_crypto:0 "Відділ криптології"
 britain.12.b:0 "Ні."
 britain.21.d:0 "Уряд США не тільки погодився на нашу початкову пропозицію, але навіть запропонував більш довгострокову співпрацю між дослідниками в наших країнах."
 britain.9.t:0 "Чемберлен іде у відставку"
 bulgaria.2.t:0 "Крайовський договір: Румунія відмовляється"
 byz_triumph_for_italy:0 "Тріумф в Італії"
 can_flood_plains_tt:0 "Відмикає рішення §Y$IRQ_flood_the_plains$§! у разі вторгнення."
 capital_hunters_quick_reload_procedures:0 "Тренування швидкого перезаряджання"
 carrier_armor_upgrade:0 "Броня"
 carrier_operations:0 "Операції авіаносців"
 cat_deep_battle_cost_factor_tt:0 " $cat_deep_battle_cost_factor$: $RIGHT|-=%1$"
 cat_mobile_warfare:0 "Доктрина мобільної війни"
 cataract_dam_mountain_desc:0 "Завершена в 1907 році гребля Катаракт є одним із видатних ранніх досягнень інженерії колоніальної Австралії. Зведена на річці Катаракт у Південному нагір'ї штату Новий Південний Уельс, вона й досі залишається одним із чотирьох основних водосховищ, що забезпечують місто Сідней прісною водою."
 category_heavy_fighter:0 "Важкі винищувачі"
 category_special_forces:0 "Спецпризначенці"
 change_leader_rule_influence:0 "Кандидат перевершує лідера по впливі в альянсі"
 china.10.d:0 "Заздалегідь отримавши інформацію про наш наступ, Червона армія приготувалася до нашої атаки. Війська, які ми зібрали на цій території, де наш контроль слабкий, не змогли перемогти комуністичну армію.\nНа жаль, атака була обернена проти нас, і це знак, що Червона армія відновлюється після Великого походу."
 china.111.a:0 "У нас більше нема спільного ворога."
 china.16.a:0 "Цій революції ще далеко до смерті!"
 china.5.d:0 "Червона армія пережила той стан, що здавався безнадійним, і ситуація з часів Великого походу сильно змінилася. Після значного територіального розширення наша роль невдах лишилася в минулому. Борячись у цей неспокійний час, наші найбільші проблеми тепер позаду. Мао Цзедун із лідера армії партизан перетворився на голову партії."
 china_wang_front_expansion_desc:0 "Настав час протистояти впливу колоніальних держав на Східну Азію. Ми повинні створити власний силовий блок у регіоні, щоб над нами більше ніколи не домінували."
 churchill_plan_germany_tt:0 "Німеччина буде розділена на три країни: Західнонімецьку державу, Північногерманську державу та Південнонімецьку державу, яка також включатиме частину колишньої Австро-Угорської імперії. Усі вони увійдуть до сфери впливу Союзників, у той час як решта Центральної та Східної Європи увійде до сфери впливу [yalta_partner.GetAdjective]. "
 civil_war_short_desc:0 "Завдяки цій цілі війни анексія на мирній конференції буде дешевшою."
 civil_war_surprise_attack_plan:0 "План несподіваної атаки"
 civilian_industry:0 "Цивільна промисловість"
 coastal_command_focus_desc:0 "Наша промисловість спирається на доставку ресурсів із усіх куточків Імперії. [Root.GetCoastalCommandDesc]"
 communism:0 "Комунізм"
 condemn_japan_short_desc:0 "§LЗасудіть агресію Японії проти Китаю.§!"
 congo_independence_struggle.20.d:0 "Ми вжили всіх можливих заходів, щоб зберегти контроль над ситуацією, яка швидко погіршується, зокрема систематично усунули зрадницькі елементи в Силі Публіки. На жаль, цей більш явний акт був сприйнятий як агресія, і заколотні підрозділи відкрили вогонь по своїх офіцерах, щойно побачили їх наближення. Саме з цією перестрілкою почалася Війна за незалежність, яка швидко вийшла з-під контролю обох сторін. \n\nЄ регіони, які залишилися лояльними до нас, відчувши найбільші переваги від колонізації, проте більшість країни тепер виступає проти нас."
 congo_independence_struggle.4.a:0 "Ми зберемо капітал, яким би способом це не сталося"
 congo_independence_struggle.6.c:0 "Залишимося дипломатичними. Можливо, вони будуть готові стати домініоном?"
 continuous_naval_production_desc:0 "Концентруючи ресурси на наших верфях і не закликаючи досвідчених суднобудівників до армії, ми можемо різко скоротити терміни будівництва кораблів."
 continuous_tech_share_desc:0 "Ми заохочуватимемо обмін технологіями наших науково-дослідних інститутів та університетів із їхніми закордонними колегами. Це підштовхне темп нашого технічного прогресу."
 control_all_ukrainian_states_tt:0 "Контролювати або зробити маріонетками всі §Yукраїнські§! території, крім Південної Бессарабії."
 control_azores_goal_desc:0 "Стратегічне розташування Азорських островів дозволяє розширити охоплення через середню Атлантику, закриваючи прогалину для покриття підводних човнів та протичовнового покриття, та забезпечуючи безперервне повітряне прикриття для конвоїв."
 control_crete_goal_name:0 "Контролювати Крит"
 control_persian_oil_goal_name:0 "Контролювати перську нафту"
 control_trinidad_goal_name:0 "Контролювати Тринідад"
 convoy_escorts:0 "Супровід конвоїв"
 cv_CAS_equipment_2_short:0 "Палуб. штурмовик II"
 cv_fighter_equipment_0_short:0 "Палуб. винищувач"
 cv_plane_range_upgrade:0 "Дальність"
 czech.10.d:0 "Наприкінці Великої війни Польща окупувала німецькі землі. Найгірше вона регулярно нападала на наших сусідів, агресивно розширюючи свої володіння. Наші [From.GetNameAdj] союзники дійшли того ж висновку, що і ми: світ запанує в Європі тільки тоді, коли польська держава перестане існувати."
 czech.7.d:0 "З самого початку нашої боротьби за звільнення світового пролетаріату Польща створювала одні проблеми, проте наші [From.GetNameAdj] союзники зробили цікаву пропозицію. Польща позбавила земель обидві наші країни. Чому б нам не відплатити їй тією ж монетою і не провести поділ її території?"
 dalmatia_fascism:0 "Далматська ліга"
 dam_mountain:0 "$dam$"
 day_bombing:0 "Денне бомбардування"
 decision_cost_CP_15_tooltip:0 "Прийняття цього рішення коштує £command_power£ §Y15§!"
 decision_cost_convy_army_xp_blocked:0 "£GFX_topbar_convoys §R50§! £GFX_army_experience §R80§!"
