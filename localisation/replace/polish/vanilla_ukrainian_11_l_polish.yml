 FUEL_DESC:0 "§HПальне§! створюється з невикористаної нафти у вашій країні. Кожна країна має максимальну місткість §Hпального§!. Її можна збільшити, будуючи §Hсховища§!. §HПальне§! потрібне для роботи різних видів техніки, як-от танків, кораблів і літаків. Доставляється §Hлініями постачання§!."
