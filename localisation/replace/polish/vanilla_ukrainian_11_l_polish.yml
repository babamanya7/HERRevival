 GER_the_end_to_fascist_europe:0 "Кінець фашистській Європі"
 GER_the_fate_of_the_south_ural_area:0 "Доля Південного Уралу"
 GER_the_first_berlin_award_desc:0 "Поляки займають не лише наші землі, а й землі Австро-Угорщини. Ми повинні змусити їх повернути ці регіони до складу Міттельєвропи, інакше вони зіткнуться з гнівом німецької армії."
 GER_the_monarchy_compromise:0 "Монархічний компроміс"
 GER_the_monarchy_compromise_desc:0 "Серед наших збройних сил, які скинули нацистську диктатуру, переважають монархічні настрої. Щоб вони залишалися задоволені новим шляхом нашої держави, ми підемо на компроміс та дозволимо реставрувати монархію."
 GER_the_prussian_legacy:0 "Прусська спадщина"
 GER_unlock_operational_planning_bewegungskrieg_tt:0 "Відімкне рішення: §Y$GER_operational_planning_category$§!, яке після прийняття дасть на §Y90 днів§!:"
 GER_uplift_the_rosenberg_office:0 "Підняти офіс Розенберга"
 GER_weltpolitik_cat:0 "[GetColonialDecisionName]"
 GER_weserubung_sud_desc:0 "Щоб отримати хороший плацдарм для вторгнення до Норвегії, нам потрібно спершу рушити на Данію."
 GER_zentrale_planung_desc:0 "Війна виявила недоліки в наших зусиллях із озброєння; недоліки, які ми мусимо усунути! Утворивши Центральну планову раду з представників уряду, промисловостей і військових, ми зможемо координувати економічну політику й ефективно перерозподіляти ресурси для посилення виробництва озброєння та підтримки наших національних цілей і військової переваги."
 GLC_fascism:0 "Держава Галлеція"
 GNB_neutrality:0 "Конституційна держава Гвінея-Біссау"
 GOE_RAJ.29.desc:0 "Оскільки термін Фрімана-Фрімана Томаса як віце-короля Індії добігає кінця, ми повинні вирішити, чи хочемо ми замінити його на відповідного кандидата, чи хочемо продовжити термін Маркіза Віллінгдона."
