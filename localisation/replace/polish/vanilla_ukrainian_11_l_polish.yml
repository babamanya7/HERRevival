 CZE_divide_nation_title_dynamic_slovakia_states:0 "$MUN_czech.1032.t$ у [SLO.GetNonIdeologyName]"
 CZE_feeding_the_alligator_desc:0 "Претензії [GER.getname] на Судетську область є загрозою самому існуванню нашої нації. Можливо, якщо ми віддамо їм те, чого вони бажають, вони дадуть нам спокій."
