 GER_experimental_rotorcrafts:0 "Експериментальні гвинтокрили"
 GER_form_agricultural_cooperatives_desc:0 "Сільське господарство є одним з найважливіших секторів. Багато галузей залежать від праці фермерів, і залишати їх наодинці — безвідповідально. Кооперативи допоможуть об'єднати зусилля аграріїв і підвищити ефективність."
 GER_franco_germanic_pact_desc:0 "Після нормалізації відносин із [FRA.GetAdjective], варто поглибити співпрацю та формалізувати пакт дружби й взаємної допомоги, щоби разом протистояти [SOV.GetAdjective] на сході."
