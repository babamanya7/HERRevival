 GSM_neutrality:0 "Ганьсуські Ма"
 GUAY_adopt_minority_languages_desc:0 "Щоб зміцнити моральний дух та зменшити ризик провалів військової розвідки, ми приймемо власну мову по всій армії."
 GUAY_enact_martial_law:0 "Запровадити воєнний стан"
 GUAY_rekindle_old_gripes_ARG_PAR_tt:0 "Якщо ми контролюватимемо §Y[957.GetName]§! протягом §Y365 днів§! з моменту початку війни, [ARG.GetName] доведеться укласти білий мир або зіткнутися з катастрофічною втратою морального духу."
 GUM_communism_party:0 "МЛП"
 GXC_declare_opposition_desc:0 "Настав час. Ми повинні оголосити про свою опозицію Центральному уряду і рушити на північ, щоб або змусити їх до переговорів, або скинути їх раз і назавжди. Що може статися далі, невідомо, але якщо ми зазнаємо невдачі, ми все одно надішлемо рішучий сигнал!"
 GXC_fighter_equipment_2:0 "Chu X-P0"
