 BRA_attack_chile_desc:0 "Доки [CHL.GetAdjective] залишається за своїми горами, наш західний фланг ніколи не буде повністю захищеним. Таким чином, ми повинні ліквідувати [CHL.GetAdjective] державу та інтегрувати її територію в нашу власну."
 BRA_boost_integralist_support_tt:0 "Відмикає рішення «Інтегралістський мітинг» для підвищення фашистської підтримки у великих містах та містечках нації."
