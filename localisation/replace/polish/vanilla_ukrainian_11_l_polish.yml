 COG_the_african_union_desc:0 "Настав час для народів Африки об’єднатися в Африканський Союз. Більше ніколи ми не будемо піддані загрозам від імперіалістів чи фашистів, оскільки ми прагнемо стати першою супердержавою Африки."
 COG_the_intore_lion_dancers_desc:0 "Танцюристи львів Інторе — це елітна королівська охорона руандійського Мвамі, їх часто називають Обраними серед традиційної руандійської армії. Було б краще, якщо цей збройний підрозділ підпорядковувався центральному уряду."
