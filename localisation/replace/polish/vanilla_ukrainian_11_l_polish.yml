 BUL_ff_civil_war_flag:0 "Вітчизняний фронт розпочав громадянську війну"
 BUL_ff_deal_the_final_blow_desc:0 "Ми серйозно послабили комуністів, доля революції Вітчизняного фронту тепер висить на волосині — і цю волосину час обрубати!"
 BUL_former_leader_before_ferdinand_generic:0 "болгарським прем'єр-міністром"
 BUL_high_popularity_decrease_tt:0 "[?BUL.BUL_faction_high_decrease|=R0] популярність фракції."
 BUL_illusions_of_a_non_partisan_system_desc:0 "Цар потребує підтримки своїх демократичних підданих, щоб реалізувати своє бачення об'єднаної Болгарії. Ми мусимо провести те, що буде ілюзією парламентських виборів, заборонити популярні опозиційні партії та забезпечити, щоб проурядові кандидати отримали більшість місць."
 BUL_internal_factions_desc:0 "Численні громадські та політичні фракції Болгарії щосили намагаються схилити на свій бік уряд або налаштувати проти нього народ. Болгарський уряд має визначитися з цілями і вирішити, хто служить його інтересам, а хто становить загрозу і повинен зникнути на благо нації."
 BUL_join_the_tripartite_pact_desc_central_powers:0 "Кайзер повернувся, і ми мусимо знову прагнути відновити наш старий союз. Цього разу ми виправимо кривди, заподіяні нашим гордим країнам. Цього разу ніщо не стане на шляху до слави та величі. Цього разу ми вийдемо переможцями!"
 BUL_kicked_us_from_faction:0 "Виключили нас із їхнього альянсу"
 BUL_loyalty_status_crushed:0 "§gРозбиті§!"
 BUL_medium_loyalty_decrease_tt:0 "[?BUL.BUL_faction_medium_decrease|=R0] лояльність фракції."
 BUL_military_secrets_sharing_desc:0 "Німецькі технології набагато перевершують наші, і для нас може бути дуже корисно підписати угоду, яка дозволить болгарським вченим та інженерам отримати доступ до деяких технологічних чудес Німеччини, що прокладає нам шлях до подальшого розвитку власних досліджень."
 BUL_national_submarine_production_desc:0 "Наш флот надто слабкий, щоби кинути виклик іноземним флотам і боротися з пануванням на морях над поверхнею. Проте ми можемо зосередитися на виробництві підводних човнів, які будуть турбувати ворожі флоти та загрожувати їхнім судноплавним маршрутам з-під води."
 BUL_opression_imprison_bs_leaders:0 "Заарештувати лідерів $BUL_bs_name_gen$"
