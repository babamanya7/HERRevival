 PHI_malayo_polynesia:0 "Малайо-Полінезія"
 PHI_national_defense_act_desc:0 "Закон про національну оборону був прийнятий 21 грудня 1935 року, і разом з ним збройним силам Філіппін було виділено суму в 16 000 000 песо. Залишилося лише визначити, як і куди витратити цю суму. Кожна гілка збройних сил волає про інвестиції, так само як і оборонні споруди, критично важливі для нашої безпеки."
