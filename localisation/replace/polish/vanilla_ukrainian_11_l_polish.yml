 SUBDOCTRINE_BOMBER_INTERCEPTION_DESC:0 "Хоча їхня нестача маневреності може бути недоліком проти легших літаків, важкі винищувачі можуть нести руйнівну протибомбардувальну вогневу міць."
 SUBDOCTRINE_MOUNTAINEERS_1:0 "$ski_troops$"
 SUBDOCTRINE_SELF_PROPELLED_SUPPORT_DESC:0 "Забезпечення гусеничної мобільності та захисту для якомога більшої кількості важкої допоміжної зброї армії: шлях майбутнього."
 SUBDOCTRINE_SUBMARINE_COASTAL_MINELAYING_DESC:0 "Завдяки своїй непомітності та маневреності, підводні човни є ідеальною платформою для мінування морських шляхів та обмеження свободи пересування ворога."
