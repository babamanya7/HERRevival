 SWE_all_cards_on_deck_desc:0 "Затяжні сутички на морі мало впливають на хід війни. Коли наш флот відпливає, це буде з метою розтрощити ворога одним вирішальним ударом."
 SWE_appeal_to_aristocracy:0 "Зверніться до аристократії"
 SWE_approach_the_allies_desc:0 "[ENG.GetNameDefCap] та їхні союзники зрештою вийдуть переможцями будь-якого конфлікту в Європі. Тому було б розумно з нашого боку дати зрозуміти, що ми не маємо наміру ставати їхніми ворогами."
 SWE_armored_car_equipment_1:0 "Pansarbil m/39 Lynx"
 SWE_deep_mining_complexes_desc:0 "[SWE.GetName] має велику кількість природних ресурсів під землею. Ми повинні збільшити інвестиції в гірничий сектор, щоб краще використовувати ці ресурси. Крім того, ми можемо стримувати атаки проти нас, знищуючи шахти, забороняючи ворогам доступ до самого те, що вони, ймовірно, хотіли."
 SWE_defense_in_depth:0 "Поглиблений захист"
 SWE_domestic_designs:0 "Конструкції вітчизняних літаків"
 SWE_dp_light_battery_2:0 "12cm/45 Bofors M24C DP"
 SWE_ebba_add_research:0 "Заохотити жінок до наукового мистецтва"
 SWE_establish_politburo:0 "Створити Політбюро"
 SWE_greater_nordic_reich_tag_ADJ:0 "Шведськ"
 SWE_has_picked_war_cabinet_trait_tt:0 "§YМи можемо вибрати лише одну рису для нашого лідера§!"
 SWE_infantry_equipment_0_short:0 "Mauser m/38"
 SWE_jagartrupper_desc:0 "Коли протистоїть кількісно переважаючим силам, необхідно вирівняти ігрове поле, обмеживши їх пересування або доступ до припасів. Використовуючи невеликі команди спецпризначенців, ми можемо проникнути в лінію ворога та саботувати його інфраструктуру в ключових місцях."
 SWE_left_coalition:0 "Ліва коаліція при владі"
 SWE_light_tank_equipment_3_short:0 "Strv m/40"
 SWE_marauder_bombers:0 "Мародерські бомбардувальники"
 SWE_meet_with_the_king:0 "Зустріч із королем"
 SWE_meet_with_the_king_desc:0 "Розвиток націоналізму в [SWE.GetName] привернув увагу Короля. Він попросив, щоб провідні діячі, які залучили цю підтримку, зустрілися з ним у королівському палаці, щоб обговорити свої наміри."
 SWE_nordic_defense_fleet:0 "Нордичний оборонний флот"
 SWE_promote_nordic_identity:0 "Сприяти скандинавській ідентичності"
 SWE_rapid_response_force:0 "Сили швидкого реагування"
 SWE_refuge_from_war_desc:0 "Війна неминуче призводить до відтоку тих, хто боїться за своє життя під новим режимом. Багато з тих, хто втікає, мають навички, які могли б нам принести користь. Таким чином, ми точно можемо знайти взаємовигідну домовленість."
 SWE_reichs_protectorate_DEF:0 "Райхспротекторат Швеція"
 SWE_restoring_order_desc:0 "Порядок у суспільстві розпався після нашого героїчного захоплення влади. Щоб схилити населення до нашої справи, ми повинні показати їм, що ми можемо відновити нашу націю до величі. А тих, хто все ще протистоїть нам, буде викорінено. і ліквідовано."
 SWE_retool_dockyards:0 "Переобладнати верфі"
 SWE_revoke_anti_militia_laws:0 "Скасувати закони проти міліції"
 SWE_revoke_research_exchange:0 "$SWE_revoke_food_trade$"
 SWE_right_coalition:0 "Права коаліція при владі"
 SWE_scandinavian_defense_union_desc:0 "Нещодавні конфлікти показали, що вперте дотримання ізольованого нейтралітету є надзвичайно небезпечним. Якщо ми хочемо уникнути оточення ворогів у майбутньому, нам слід укласти угоду з нашими північними сусідами, щоб захищати один одного, якщо хтось із нас зазнає нападу."
 SWE_ship_torpedo_3:0 "5x 533-мм торпедний апарат"
 SWE_united_kingdoms_of_sweden_and_norway_desc:0 "Після кризи в Нарвіку та наших наступних здобутків [NOR.GetName] залишився ослабленим і пригніченим. Тепер ми повинні завдати останнього удару [NOR.GetAdjective]ій незалежності та змусити возз'єднати наші нації під одним правителем."
 SWITCH_STRATEGIC_REDEPLOYMENT_MODE_DETAILED:0 "Стратегічна передислокація — це швидкий шлях переміщення військ. Вони намагатимуться використати існуючі §Yзалізниці§! й §Yінфраструктуру§!, щоб швидко дістатися пункту призначення, але отримають $ORG|R%$ штрафу до організації під руху в цьому режимі."
 SWI_ENG_puppet_fascism:0 "Британські альпійські території"
 SWI_FRA_puppet_fascism:0 "Швайцарська держава"
 SWI_SOV_puppet_communism_DEF:0 "Союз швайцарських соціалістичних республік"
 SWI_all_adults_training_desc:0 "У нинішньому стані світу немає місця випадковості. Кожна здатна доросла людина повинна бути готова взятися за зброю проти будь-якої сили загарбника, Швайцарія належить усім нам, тому її всі повинні захищати."
 SWI_decision_add_high_MR:0 "Збільшить £GFX_SWI_military_readiness_text_icon §Yбойову готовність§! на §G+[?ROOT.SWI_mr_high_amount]§!."
 SWI_decision_add_var_MR:0 "Збільшить £GFX_SWI_military_readiness_text_icon §Yбойову готовність§! на §G+$RIGHT|0$§!."
 SWI_defense_fund_drive_desc:0 "Захист від наших можливих загарбників вимагає грошей, яких Федеральний уряд Швайцарії не має, але ми можемо закликати громадян Швайцарії надати ці кошти в рамках справжньої ініціативи «знизу вгору»."
 SWI_diplomatic_visit:0 "Дипломатичний візит"
 SWI_gotthard_union_desc:0 "Час суперечок і фракційності минув. Настав час для [ROOT.GetNonIdeologyName] об'єднатися в рамках єдиної демократії з категоричними повноваженнями вживати масштабних заходів. Усе в ім'я виживання наших [ROOT.GetAdjective] традицій і цінностей. Ми дамо опір і переможемо!"
 SWI_heer_und_haus:0 "Heer und Haus"
 SWI_infantry_equipment_3:0 "SIG MP46"
 SWI_investments_in_country:0 "Інвестиції в Швайцарію"
 SWI_isolate_switzerland_desc:0 "Ми можемо зосередитися на тому, щоб зробити все можливе, щоби переконатися, що [SWI.GetName] може бути самостійною та незалежною; це може бути нашим єдиним шансом не втратити нашу незалежність, яку ми так міцно тримали."
 SWI_light_sentence_for_frankfurter:0 "Легкий вирок для Франкфуртера"
 SWI_luftschutz_desc:0 "Війна змінилася, повітря є новим царством війни, і ми не можемо дозволити йому стати нашою ахіллесовою п'ятою. Необхідно створити місцеві сили протиповітряної оборони, укомплектувати їх цивільними особами та забезпечити їх інструментами для виявлення та боротьби з повітряними загрозами. Немає сенсу захищати гору, якщо вони можуть йти вище гір!"
 SWI_mountaneer_paratroopers_desc:0 "[ROOT.GetNonIdeologyName] відомий у всьому світі своїми величними вершинами, і багато хто з нашого населення називає гори своїм домом. Ми можемо використати цю перевагу, щоби навчити найкращий десантник, силу, яка може скинутися з чужого неба та захопити чужі гори на славу [ROOT.GetNameDef]."
 SWI_naval_industry_tt:0 "Додати §G1§! комірку для будівництва й §Y1 верф§! у кожному узбережному регіоні (максимум 10)."
 SWI_no_confederation_councilor:0 "Немає канцлера Конфедерації"
 SWI_oasis_of_democracy_desc:0 "Вороги демократії оточують [ROOT.GetName], тому в ці бурхливі часи ми повинні твердо дотримуватися наших цінностей. [ROOT.GetName] і його демократія нероздільні, тому немає сенсу виживати як країна, якщо наша демократія гине заради її захисту."
 SWI_purchase_fascist_planes_unlock_TT:0 "Будуть відкриті рішення з придбання §Yвинищувачів і штурмовиків§! від держави §Y[?SWI.SWI_biggest_fascist.GetFlag][?SWI.SWI_biggest_fascist.GetNameDef]§!."
 SWI_research_slot_tooltip:0 "При підвищенні до §Yпрезидента Конфедерації§! буде відкрите рішення §Y$SWI_expand_arms_industry$§!, яке дає додаткову §Gкомірку для досліджень§!."
 SWI_spouse_fascism_desc:0 "Зважаючи на те, що відбувається у світі, приєднання до фашистських сил може бути найбезпечнішим вибором, ми можемо почати поширювати фашистську пропаганду, щоб люди були готові до нашої переорієнтації цінностей."
 SWI_strengthen_military_high_command:0 "Зміцнити вище військове командування"
 SWI_submarine_raiders:0 "Підводні рейдери"
 SWI_take_over_france_desc:0 "[FRA.GetNonIdeologyName] завжди була мінливою нацією з частими потрясіннями, коли підкидання монети вирішує, чи буде результатом революції du jour слабка демократія чи мілітаристський режим. Під захистом [ROOT.GetAdjective] люди [FRA.GetAdjective] могли б процвітати, керуючись нашою демократичною стабільністю."
