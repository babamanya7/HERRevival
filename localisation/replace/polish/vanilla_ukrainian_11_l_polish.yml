 SPR_CAS_equipment_1_short:0 "HS-36"
 SPR_appropriate_the_means_of_production_desc:0 "Минули ті часи, коли ми працювали на багатих. Минули ті часи, коли наша праця не винагороджувалася. Ми захопимо фабрики й майстерні, ферми й магазини, знищимо класи й поставимо робітника розпоряджатися своєю долею."
 SPR_beacon_of_socialism:0 "Маяк соціалізму"
 SPR_communal_autarky:0 "Комунальна автаркія"
 SPR_connect_the_country_desc:0 "Великий проєкт інфраструктурних робіт по всій країні забезпечить швидке переміщення товарів між найвіддаленішими районами півострова. Це принесе нам лише користь у довгостроковій перспективі."
 SPR_crush_the_revolution_desc:0 "Незалежність, якою вели себе анархістські комуни, була для нас шипою в боці, і, відверто кажучи, їхній слабкий захист є критичною слабкістю на наших фронтах. Нам краще без них, тому настав час придушити цю революцію раз і назавжди."
 SPR_has_eliminated_guerrillas_tt:0 "[SPR.GetNameDef] ліквідувала всіх партизанів на своїй території"
 SPR_ignite_uprising_timer_mission:0 "Насувається повстання анархістів"
 SPR_imprison_primo_de_rivera_tt:0 "Запобігає подальшим запальним промовам Прімо де Рівери.\n"
 SPR_improve_military_infrastructure_desc:0 "Щоби вчасно дістатися до обложених комун, ми повинні значно поліпшити нашу міжобщинну інфраструктуру. Це повинно дозволити Раді оборони в цілому швидко реагувати на будь-які зовнішні загрози, з якими будь-яка окрема громада може не мати можливості впоратися."
 SPR_militarize_the_people:0 "Мілітаризувати народ"
 SPR_rebuild_the_nation:0 "Відбудувати націю"
 SPR_reprofessionalize_the_military_desc:0 "З потреби наша армія була відбудована з тих, хто не був вихований у суворій дисципліні військового життя. Щоб перетворити нашу армію з тимчасової надзвичайної сили на справжню національну армію, ми повинні перепрофесіоналізувати її та прищепити належну дисципліну та командні структури."
 SPR_seize_public_transport_desc:0 "Усі хочуть зробити свій внесок у боротьбу за свободу. Серед наших союзників багато тих, хто працює в секторі громадського транспорту, і вони готові поставити свої транспортні засоби на службу нашим відважним солдатам. Це може дати нам нестандартну тактичну перевагу проти наших ворогів."
 SPR_submarine_3:0 "Клас «G»"
 SPR_submarine_3_desc:0 "The Spanish G-class submarines were a pair of German VIIC-class submarines licensed-built by Nationalist Spain. Only one was ever completed, however, and was not transferred to the Spanish Navy until 1947. The subs displaced 770 tons and were armed with five 533mm torpedo tubes. They had excellent speed and range, as the Type VIICs were the workhorse of the German submarine fleet."
 SPR_the_stalinist_doctrine:0 "Сталіністська доктрина"
 SPR_united_under_socialism:0 "Об'єднані під крилом соціалізму"
 SSB_baghlan_sugar_factory_branches:0 "Нові філії цукрової компанії Баглан"
 SSB_expand_iranian_oil_fields:0 "[PER.GetAdjective] Експорт нафти"
 SSB_integration_of_our_infrastructure_desc:0 "Зі зростанням напруги по всьому світу і оточенням наддержавами з усіх боків, простого економічного та військового пакту вже недостатньо. Ми повинні завершити повну інтеграцію нашої інфраструктури та скасувати всі тарифи між нашими націями, а також об'єднати наші ресурси."
 SSB_savak_protect_us_desc:0 "САВАК чудово захищає нашу велику націю за допомогою контррозвідки, ми маємо можливість запропонувати захист решті пакту, поділившись нашими знаннями з контррозвідки, що принесе користь нашим союзникам майже без витрат для нас самих."
