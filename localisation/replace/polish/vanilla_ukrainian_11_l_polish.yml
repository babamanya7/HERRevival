 PHI_share_military_experience_tt:0 "Розблоковує рішення: §YОбмінятися військовим досвідом з [temp_host.GetName]§!"
 PHI_soldiers_in_hiding:0 "Солдати в підпіллі"
 PHI_thalassocracy_desc:0 "Концепція «Армії з державою» добре відома і часто приписується Пруссії. Однак ми повинні прагнути бути «Флотом із державою», з флотом, чиї можливості затьмарюють навіть британські у розквіті їхньої могутності."
 PHI_usa_focus_done_T2_alt_tt:0 "Завершено принаймні два з фокусів: §Y$PHI_declare_military_emergency$§!, §YПрив'язати песо до долара§!, §YПро-хасендадос§! або §YЗакон про громадянство§!."
