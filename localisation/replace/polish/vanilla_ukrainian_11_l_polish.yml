 NOR_the_kings_line_desc:0 "Бункери та доти, що пролягають навколо кордонів нашого королівства, є фізичним проявом стійкості та волі короля. Нехай наші люди проллють свою кров, щоб лінія короля трималася, а його королівство залишалося недоторканим."
