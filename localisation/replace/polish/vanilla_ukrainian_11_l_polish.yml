 INS_volksraad_knil_rank_limit:0 "Прийняти антидискримінаційні закони для військових звань"
 INS_war_escalation_level_tt:0 "§YПоточна ескалація§!\n\nРівень ескалації зростає з часом, а також коли ополчення §Yокупує нові регіони§!, а [HOL.GetNameDef] вживає заходів для протидії діяльності ополчення. Якщо ситуація загостриться сильніше, вона може перерости в §Rтотальну війну§!."
