 ITA_bersaglieri_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_SPECIAL_FORCES_ATTACK_FACTOR$: §G+3.0%§!\n$MODIFIER_SPECIAL_FORCES_DEFENCE_FACTOR$: §G+3.0%§!\n$MODIFIER_SPECIAL_FORCES_CAP$: §G+5.0%§!\n\n"
 ITA_bop_criticize_the_war:0 "£BoP_left_texticon Розкритикувати військові зусилля"
 ITA_bop_question_the_navy_desc:0 "Нещодавні події, які продемонстрували неефективність ВМС, змусили багатьох людей замислитися над тим, наскільки саме ці війська лояльні до Італії та фашистської системи."
 ITA_bop_resign_ministry_of_corporations_position:0 "£BoP_left_texticon Залишити посаду в Міністерстві корпорацій"
 ITA_colonial_management_dec_cat_desc:0 "$ITA_ministry_of_italian_africa_desc$"
 ITA_compagnie_auto_avio_sahariane_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-5.0%§!\n$MODIFIER_OUT_OF_SUPPLY_FACTOR$: §G-5.0%§!\n\n"
 ITA_complied_to_church_demands:0 "Виконали вимоги Церкви"
 ITA_cooperate_with_the_mafia_desc:0 "Мафіозні організації, що розрослися під час громадянської війни, можуть стати можливістю для поліпшення роботи приватного та державного бізнесу на їхніх територіях, якщо ми будемо готові надати їм певні привілеї та поступки."
 ITA_cv_CAS_equipment_1_short:0 "Ba.65bis"
 ITA_defense_against_capitalism_desc:0 "Фашизм — наш перший і найбільший ідеологічний ворог, але не єдиний. Капіталісти становлять страшну загрозу для нашої країни та пролетарської революції. Ми мусимо бути готові зустріти їх віч-на-віч."
 ITA_demand_dalmatia:0 "Вимогти область [103.GetName]"
 ITA_develop_ethiopia:0 "Розвиток Ефіопії"
 ITA_empower_the_carabinieri_desc:0 "Карабіньєри відіграють ключову роль у викоріненні мафії та збереженні миру і безпеки в країні. Настав час посилити цей поліційний підрозділ і дати йому можливість виконувати додаткові обов'язки."
 ITA_empower_the_unions_desc:0 "Італійський пролетарський клас має великий потенціал. Ми мусимо забезпечити профспілки засобами та повноваженнями для регулювання та оптимізації робочої сили в нашій країні."
 ITA_ethiopian_railways_desc:0 "Слаборозвинена ефіопська мережа залізниць стримує економічний розвиток колонії. Відрядивши італійських фахівців, ми зможемо швидко привести її до італійських стандартів і гарантувати, що поїзди завжди ходитимуть вчасно в будь-якій точці Імперії."
 ITA_expand_foggia_farm_fields:0 "Розширити фермерські поля у Фоджі"
