 POR_stir_monarchist_sentiment_in_portugal_desc:0 "Ми повинні закликати народ прийняти дома Дуарте як законного короля Португалії."
 POR_strict_neutrality_in_the_spanish_civil_war:0 "Суворий нейтралітет у громадянській війні в Іспанії"
