 AAT_Sweden.17.a:0 "Nu har du skitit i det blå skåpet, Norge."
 AAT_Sweden.21.t:0 "[FROM.GetName] запрошує нас до альянсу $scandinavian_defense_union$"
 AAT_Sweden.26.desc:0 "Сталося немислиме. Наші збройні сили втратили контроль над областю [195.GetName], ключова пам'ятка російського народу тепер у руках ворога. Це не тільки стратегічна втрата, але й величезна моральна втрата для нашої національної гордості та нашої армії. Вже зараз спостерігається значне падіння морального духу серед пересічних солдатів, поширюються чутки про дезертирство; якщо ми продовжимо цю війну, ми будемо воювати з солдатами, які більше не вірять, що їхнє життя варте того, щоби витрачати його на безглузду війну."
 AAT_Sweden.28.t:0 "[SWE.GetNameDefCap] просить повернення втрачених територій"
 AAT_Sweden.39.a:0 "Більше ніколи вони не вийдуть на лід!"
 AAT_Sweden_ball_bearing.6.t:0 "$AAT_Sweden_ball_bearing.5.t$"
 AAT_Sweden_flashpoints.15.t:0 "[SWE.GetName] надсилає військову допомогу"
 AAT_Sweden_flashpoints.30.desc:0 "Хоча ми успішно закріпилися в Скандинавії, транспортування військ і техніки через Данські протоки може бути небезпечним. У відкритому морі конвої часто стають жертвами повітряних і морських атак супротивника. Тому зведення до мінімуму використання морських шляхів, наскільки це можливо, було б корисним для наших військових зусиль.\n\nТаким чином, можливо, варто натиснути на сусідню державу [SWE.GetName], щоби та дозволила нам доступ до своїх залізничних і комунікаційних мереж. Однак, ми повинні бути тактовними і поступово руйнувати їхній нейтралітет, якщо ми хочемо, щоб вони не стали базою операцій для наших ворогів."
 AAT_Sweden_flashpoints.36.desc:0 "Нещодавня напруга з державою [GER.GetNameDef], на щастя, починає розсіюватися. Незважаючи на всі їхні галасливі заяви, здається, нам вдалося зорієнтуватися в дуже складній дипломатичній ситуації. Однак нам слід бути пильними, оскільки наші нещодавні дії, ймовірно, викликали велике обурення в місті [GER.Capital.GetCapitalVictoryPointName]."
 AAT_Sweden_flashpoints.41.desc:0 "Зв'язок між містом [GER.Capital.GetCapitalVictoryPointName] і нашими силами в державі [NOR.GetName] значно спростився завдяки співпраці з урядом Швеції. Можливо, нам слід уникати подальшого протистояння, щоби не втратити наші поступки."
 AAT_Sweden_flashpoints.50.t:0 "Ворог усередині"
 AAT_Sweden_flashpoints.76.t:0 "[ENG.GetName] повертає човни"
 AAT_Sweden_flashpoints.78.desc:0 "[SWE.GetName] висловлює глибоку стурбованість щодо стратегічно важливих Оландських островів, які можна використати для встановлення контролю над Балтійським морем.\nВраховуючи цей факт і переважно шведське населення островів, уряд Швеції цікавиться, чи можемо ми передати острови їхній державі, поки світова ситуація не стабілізується. Вони не хочуть, аби острови потрапили під ворожу окупацію та щиро бажають оборонити власних громадян."
 AAT_Sweden_nationalists.1.a:0 "Ми не можемо виділити війська, але ми допоможемо їм."
 AAT_Sweden_nationalists.28.t:0 "$AAT_Sweden_nationalists.21.t$"
 AAT_Sweden_nordic_defense_council.1.t:0 "Швеція запрошує нас до Нордичної ради безпеки"
 AAT_USA_events.02.t:0 "[FROM.GetNameDefCap] окуповує Фарерські острови"
 AAT_USA_events.04.b:0 "Вони самі напросилися."
 AAT_finland_continuation_war.04.t:0 "Пакт про війну з Союзом порушено"
 AAT_finland_continuation_war.08.t:0 "[FROM.GetName] бажає перемир'я"
 AAT_finland_continuation_war.13.t:0 "[FIN.GetName] хоче приєднатися до Союзників"
 AAT_finland_diplomacy.01.desc:0 "До нас звернулися дипломати з держави [FROM.GetNameDef]. Вони обмірковують ідею національного об'єднання для взаємного захисту і процвітання. Це означає злиття наших урядів, армій і промисловості в єдиний фронт, спрямований проти тих, хто загрожує безпеці такого союзу. У тому, щоб об'єднатися за часів міжнародної нестабільності, може бути свій сенс, але рішення в підсумку ухвалювати нам."
 AAT_finland_diplomacy.15.t:0 "[FROM.GetName] відтепер частина держави [ROOT.GetNameDef]"
 AAT_finland_misc_events.03.a:0 "Так, ми повинні звернутися до держави [?FIN_faction_leader_recieving_resource_rights.GetNameDef] за інвестиціями."
 AAT_finland_political.08.desc:0 "Ми дуже вдячні за всі ті звершення, за якими стоїть [ROOT.GetLeader], адже очевидно, що без [ROOT.GetLeader.GetHerHis] лідерства ми не вистояли б у неспокійний період, і нашу націю було б втрачено.\n\nТеперь, проте ж, треба прийняти непросте рішення. Чи варто попросити маршала залишитися на посаді або ж йому слід залишити посаду, поступитися волі народу і повернути країні цивільний уряд?"
 AAT_finland_the_white_death.8.t:0 "Незважаючи на великі втрати, нашим солдатам вдалося поранити Білу Смерть"
 AAT_nordic_cooperation.6.a:0 "Шкода."
 AAT_norway.1.c:0 "Дайте цьому чоловікові посаду!"
 AAT_norway.18.desc_monarchist:0 "Нам вдалося довести [FROM.GetAdjective]ій владі, що наші претензії правомірні, і вони погодилися віддати землі, на які ми претендуємо, нашій короні."
 AAT_norway.4.a:0 "Вигнанець у одній державі — рятівник у іншій!"
 AAT_norway_allied.3.a:0 "Доведеться шукати допомогу деінде."
 AAT_norway_communist.7.t:0 "Падіння норвезької королівської родини"
 AAT_norway_fascist.2.a:0 "Вони про це пошкодують!"
 AAT_norway_fascist.4.t:0 "Наші [NOR.GetAdjective]і колеги просять нас про допомогу"
 ABK_democratic_party_long:0 "Народні збори Абхазії"
