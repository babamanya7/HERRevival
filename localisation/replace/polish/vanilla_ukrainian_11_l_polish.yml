 URG_import_substitution:0 "Заміщення імпорту"
 URG_ministry_of_public_works_desc:0 "Для підживлення індустріалізаційних зусиль нашої країни ми створимо масштабну програму доріг та житла для робітників через Міністерство громадських робіт."
 URG_revaluation_law_desc:0 "Закон про переоцінку 1935 року потрібно додатково розширити, щоб Департамент випуску грошей монополізував всю банківську діяльність."
 URG_ruralism_desc:0 "Наша виборча база знаходиться в сільській місцевості країни, і нам вкрай необхідно інвестувати в неї значні кошти."
 URG_ship_torpedo_1:0 "2x 450mm Torpedo Launcher"
 USA_SAF_EDW_autonomy_integrated_puppet_DEF:0 "Земля королеви Уолліс"
 USA_SH_battleship_2_desc:0 "The Montana Class was bigger and more armored than the Illinois Class, sacrificing speed to accommodate the increase. Its main armament of 12 x 18\"/50 caliber guns and with our latest fire control system the Montana's firepower will be unmatched. Initial designs included 6\" guns, but this was changed to return to the dual purpose 5\" twin turret emplacements."
 USA_TAC_desc:0 "Створення літаків, здатних знищувати тактичні цілі супротивника, забезпечить безпечне просування наших військ."
 USA_UK_autonomy_dominion:0 "Домініон Північна Америка"
 USA_adjusted_compensation_act_desc:0 "Ми обіцяли виплачувати гідну пенсію нашим ветеранам світової війни. Багато хто з них став жертвами недавньої депресії. Ми мусимо докласти всіх зусиль, щоб підтримати тих, хто прийшов на допомогу нашій республіці у важку хвилину."
 USA_advanced_mahanian_doctrine:0 "Удосконалена доктрина Мегена"
 USA_anti_bolshevist_aid:0 "Анти-[GetSovietThreatNameAlt]а підтримка"
 USA_armored_car_equipment_1:0 "M3 Scout Car"
