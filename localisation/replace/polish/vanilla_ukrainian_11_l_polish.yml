 NSB_Soviet_fascist_civil_war.002.a:0 "Відмінно."
 NSB_poland_communist_events.2.desc:0 "[From.GetNameDefCap] пропонує нам повний військовий захист в обмін на зовнішнє управління державою [Root.GetNonIdeologyName]. Посилаючись на те, що [Root.GetNonIdeologyName] ось-ось зіткнеться з боку і Німеччини, політики з держави [From.GetNameDef] пропонують нам стати протекторатом. Якщо прийняти цю пропозицію, [Root.GetNonIdeologyName] стане державою-маріонеткою, і держава [From.GetNonIdeologyName] навряд чи задовольниться відмовою."
 NSB_poland_events.6.b:0 "Ні."
 NSB_poland_events.701.a:0 "Можливо, нам допоможуть британці."
 NSB_polish_fascist_events.203.t:0 "[From.GetNameDefCap] погоджується"
 NSB_polish_fascist_events.302.desc:0 "[From.GetNameDef] агресивно відмовляє нам у проханні про автономію. [From.GetAdjective] радники роздратовані самим фактом такого прохання. Вони стверджують, що наше тривале підпорядкування — необхідна частина війни В найближчому майбутньому ми так і залишимося їх маріонетками."
 NSB_polish_fascist_events.401.desc.blacksea:0 "Польща днями висунула нам пропозицію щодо повоєнної розмітки кордонів. Згадавши про землі, що відійшли державі [Root.GetNameDef] в результаті пакту Бека — Ріббентропа, [опрос] певні територіальні поступки після перемоги у війні. Вони хочуть заглибитися на південь у Крим і реалізувати давню амбіцію про Польщу від моря до моря."
 NSB_soviet_atomic_bomb_project.3.a:0 "Добре хоч, нічого не зникло."
 NSB_soviet_civil_war_common.003.a:0 "Тоді це війна."
 NSB_soviet_civil_war_common.102.t:0 "Японці відмовляються від Владивостока"
 NSB_soviet_civil_war_common.118.a:0 "Давайте забезпечимо їх гвинтівками."
 NSB_soviet_civil_war_common.127.a:0 "Дареному коневі в зуби не дивляться"
 NSB_soviet_fascist_tsarist.13.a:0 "Варто відреагувати на цю інформацію..."
 NSB_soviet_fascist_tsarist.20.a:0 "Разом ми сильніші!"
 NSB_soviet_fascist_tsarist.22.b:0 "Альянс? Ну вже ні."
 NSB_soviet_fascist_tsarist.22.desc:0 "[SOV.GetAdjective] представники звернулися до нас із пропозицією утворити альянс. У них нового уряду є схожі з нашими інтереси та погляди на світ, і тому адміністрація вважає, що з нашого боку буде завбачливо ближче співпрацювати з нею в економічній та військовій сферах."
 NSB_soviet_fascist_tsarist.25.b:0 "Боюся, наші інтереси не збігаються з інтересами Японії."
 NSB_soviet_fascist_tsarist.3.t:0 "Панслов'янський союз — [FROM.GetNameDef] відхиляє пропозицію"
 NSB_soviet_fascist_tsarist.30.desc:0 "[JAP.GetName] повідомляє нам про рішення прийняти [SOV.GetAdjective] пропозицію і готується вступити до нашого альянсу за першої можливості."
 NSB_soviet_fascist_tsarist.5.b:0 "Не можна, щоб росіяни були сильні!"
 NSB_soviet_foreign_politics_events.1.b:0 "Потрібно, щоби наш уряд йшов одним курсом з їхнім урядом."
 NSB_soviet_foreign_politics_events.200.t:0 "[FROM.GetNameDefCap] висуває вимоги"
 NSB_soviet_foreign_politics_events.251.a:0 "Ми будемо готові."
 NSB_soviet_foreign_politics_events.265.a:0 "Хіба [FROM.GetLeader] не розуміє, чим це все закінчиться для його країни?"
 NSB_soviet_foreign_politics_events.272.desc:0 "[SIK.GetAdjective] консул, що працює в Семипалатинську, зв'язався з нашими дипломатами, щоби повідомити, що [SIK.GetAdjective] уряд вирішив відхилити [ROOT.GetAdjective]у ініціативу з розширення Транскаспійського шляху до [SIK.GetAdjective] столиці Урумчі."
 NSB_soviet_foreign_politics_events.280.t:0 "[FROM.GetAdjectiveCap]а підтримка територіальної експансії"
 NSB_soviet_foreign_politics_events.285.desc:0 "Здається, що після величезних втрат, завданих у війні, колапс держави [SOV.GetNameDef] куди ближче, ніж сама вона це демонструє. Кілька членів нашого уряду стверджують, що такий поворот подій загрожує нашій країні, і пропонують негайно скасувати [SOV.GetAdjective] угоди і розпочати натомість працювати над зміцненням відносин з китайцями, вони зауважують, що заради безпеки держави [ROOT.GetNameDef] ми мусимо робити все можливе, щоби знайти сильних і здатних підтримати нас союзників, і що [SOV.GetNameDef], враховуючи поточний стан справ, навряд чи зможе якось помститися нам за такий демарш."
 NSB_soviet_paranoia_system_events.13.desc:0 "[Root.GetLeader] прийняв групу молодших офіцерів НКВС, які надали доказ того, що глава НКВС планує захопити владу в столиці «у разі великих заворушень». Офіцери вважають, що це лише привід для .\n\nПри пред'явленні доказів голова НКВС спершу намагався пояснити, що це стандартні та давно існуючі інструкції, які просто недавно оновили, однак у ході подальшої бесіди і при докладних допитах він зізнався у існуванні в НКВС великої мережі іноземних агентів, які виношують спільно із закордонними. ворогами задум за поваленням уряду."
 NSB_soviet_paranoia_system_events.30.t:0 "Чистка серед флоту"
 NSB_soviet_paranoia_system_events.49.t:0 "Генерали ВПС замішані в змові"
 NSB_soviet_policies_of_collective_security.12.desc:0 "[FROM.GetAdjectiveCap]ий уряд у принципі погодився приєднатися до нашого пакту. Залишаються деякі деталі, які потрібно утрусити, але вони не завадять ратифікації договору."
