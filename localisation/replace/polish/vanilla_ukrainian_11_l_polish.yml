 ALL_FACTION_MEMBERS_WITH_AMPHIBIOUS_TECH:0 "§YКожен член альянсу§! з відімкнутими технологіями §Yамфібійних§! підрозділів"
 ANG_neutrality_DEF:0 "Ангола"
 ARCHETYPE_DESC_ENTRY:0 "    - $COUNT|0$ $NAME|H$"
 ARG:0 "Аргентина"
 ARG_argentina_for_all_desc:0 "Як колишня колонія, [ARG.GetNameDef] є домом для багатьох різних людей з усього світу. У нашому баченні майбутнього нашої нації, ми хочемо, щоб кожен, хто живе в її межах, міг називати себе [ARG.GetAdjective] та пишатися тим, що називає цю країну своїм домом. Ми повинні працювати над тим, щоб забезпечити, що [ARG.GetNameDef] є для всіх, хто вирішить тут жити."
 ARG_empower_the_fjc_desc:0 "Комуністична молодіжна федерація — це молодіжна та революційна політична організація, яка була заснована для просування політики КПА серед [ARG.GetAdjective] молоді. Щоб закріпити нашу соціалістичну ідеологію по всій нації, було б розумно залучити дітей нашої країни якомога раніше."
 ARG_expand_aluminum_extraction_desc:0 "Алюміній є важливим ресурсом для розвитку наших транспортних сил. Ми повинні розвивати наші гірничодобувні операції та збільшувати норми видобутку цього корисного металу."
 ARG_expand_steel_extraction_desc:0 "Гірничодобувна промисловість була головною галуззю для [ARG.GetName] з моменту її заснування як землі Срібла. Однак наша увага більше зосереджена на розширенні видобутку сталі на наших гірських територіях."
 ARG_hitler_4_desc:0 "За словами Сеньйора Гілтера, вкрай важливо, щоб ми відновили уламки Graf Spee, першого [GER.GetAdjective] лінкора, затопленого під час війни. Коли його запитали про це, він пробурмотів щось про «гідність» і «не розпитуйте мене» ламаною іспанською. У будь-якому випадку, давайте піднімемо Graf Spee!"
 ARG_intervenciones_federales_decisions:0 "Intervenciones federales"
 ARG_invest_in_the_railways_desc:0 "Маючи історію розвитку залізниць від [ENG.GetName], логічно, що ми продовжуємо процес модернізації наших залізниць. Це допоможе з'єднати всю країну через одну мережу та зробити [ARG.GetName] більш уніфікованою країною."
 ARG_jet_fighter_equipment_2:0 "FMA IAe 33 Pulqui II"
 ARG_medium_tank_equipment_2:0 "Nahuel D.L. 43"
 ARG_political_events.16.desc:0 "Уряд [PAR.GetAdjective] вирішив погодитися на умови, які ми висунули в нашому ультиматумі. Ми негайно зробимо їхні землі маріонетковими та встановимо [ARG.GetAdjective] правління якомога швидше."
 ARG_political_events.31.b:0 "Залишити його у в'язниці. Стояти на своєму."
 ARG_political_events.4.a:0 "Це прикро."
 ARG_political_events.43.t:0 "[SOV.GetNameDefCap] погоджується надіслати допомогу"
 ARG_political_events.5.c:0 "Абсолютно ні."
 ARG_political_events.52.desc:0 "Скандування та крики розгніваного натовпу невдоволених робітників залучили масову хвилю підтримки КПА. Фабричні цехи спорожніли, офіси залишилися покинутими, а сільські фермери об'єдналися, щоб відстоювати свої права та висловити свій гнів проти керівного класу. Чутки про наш вплив ширяться, оскільки підтримка революції зростає щодня..."
 ARG_political_events.74.t:0 "[FROM.GetNameDefCap] погоджується на гарантування нашої незалежності та Пакт про ненапад"
 ARG_political_events.8.desc:0 "На жаль, наша пропозиція не була почута. [FROM.GetAdjective] уряд вирішив, що острови краще залишаться під їхнім захистом. Хоча це розчаровує, принаймні ми знаємо, що наші союзники поруч."
 ARG_reestablish_ligas_patrioticas:0 "Відновити Ligas Patrióticas"
 ARG_ship_torpedo_sub_3:0 "6x 533-мм ТА з заряд. порш."
 ARG_south_american_unity_decisions_desc:0 "Тепер, коли ми об'єднали народи Південної Америки під одним прапором, ми можемо ствердити своє панування на континенті, приєднуючи до себе території колишніх великих держав одна за одною."
 ARG_subdue_dissension_desc:0 "Досить. Військові повстанці вийшли з-під контролю, і нам потрібно рішуче придушити цей переворот, перш ніж він отримає шанс піднятися. Це може на короткий час зашкодити нашому військовому зростанню, але це того варте, щоб мати лояльну армію на нашому боці."
 ARG_tech_initiative_bonus:0 "Технологічна ініціатива"
 ARG_the_american_push:0 "Американський тиск"
 ARG_unify_the_continent_tt:0 "Прийняття цього фокусу надішле пропозицію приєднатися до нашої §YФракції§! будь-якій §YКомуністичній§! країні у §YПівденній Америці§!."
 ARG_union_nacional_fascista_tt:0 "§YНіміо де Анкін§! стає лідером партії §Y$ARG_fascism_party_long$§!, а керівна партія переходить до §YФашизму§!"
 ARG_workers_rights:0 "Права робітників"
 ARG_yacimientos_petroliferos_fiscales_desc:0 "Yacimientos Petrolíferos Fiscales — це державна [ARG.GetAdjective] енергетична компанія, що займається розвідкою, видобутком, переробкою та комерціалізацією нафти. Ми повинні інвестувати більше грошей у компанію, щоб мати кращий контроль над нашим виробництвом нафти."
 ARG_yacimientos_petroliferos_fiscales_tt:0 "Відмикає рішення: §YЕксплуатувати Вака Муерта§!"
 ARMOUR_TITLE_MEDIUM:0 "СЕРЕДНЯ"
 ARMY_AIR_BUTTON:0 "§GКлацніть§!, щоб обрати.\n§GКлацніть§!, утримуючи §HShift§!, щоб обрати кілька авіакрил.\n§GКлацніть ПКМ§!, щоби перейти до авіабази."
 ARMY_AIR_CATEGORY_TOOLTIP_ITEM_NO_AREA:0 "немає зони виконання завдань"
 ARMY_LEADER_CURRENT_PREFERRED_TACTIC:0 "Назавжди вибрана переважна тактика командувача: $TACTIC|H$\n"
 ARMY_LEDGER_ARMIES:0 "Дивізії"
 ARMY_SORT_TYPE:0 "Тип"
 ASSIGN_MEDAL_TOOLTIP:0 "§HПрисудження нагороди§!\n\nКлацніть, щоби присудити командувачеві цієї частини нагороду за цю дію."
 AST_EQUIPMENT_VERSION_8:0 "Mk VIII"
 AST_a_collapsing_league_of_nations_desc:0 "Ліга Націй розпадається — ініціатива з добрими намірами, на жаль, ґрунтувалася на нереалістичних сподіваннях. Політика санкцій легко перетворюється на порожні жести, особливо коли немає збройних сил для стримування непокірних країн. Наше переозброєння повинно розпочатися."
 AST_anti_tank_equipment_1_short:0 "QF 2-pounder"
 AST_anti_tank_equipment_2:0 "QF 6-pounder"
 AST_bring_on_the_giant:0 "Викликати гіганта"
 AST_call_for_a_referendum_desc:0 "Ми хочемо збільшити контроль федерального уряду; однак спочатку нам потрібне схвалення виборців. Скликавши референдум, ми можемо отримати їхню згоду."
 AST_cv_fighter_equipment_0_short:0 "Nimrod"
 AST_cv_nav_bomber_equipment_2_short:0 "Roc"
 AST_demand_resources:0 "Вимагати ресурси"
 AST_diplomatic_events.10.a:0 "Ми маємо погодитися."
 AST_diplomatic_events.3.t:0 "Хай живе Тихоокеанський пакт"
 AST_diplomatic_events.32.a:0 "Вони стануть у великій нагоді."
 AST_diplomatic_events.42.t:0 "[AST.GetFascistParty] порушує свою обіцянку"
 AST_diplomatic_events.53.b:0 "Ризик того, що [AST.GetName] використає це проти нас, занадто великий."
 AST_diplomatic_events.79.desc:0 "Не лише нам зрозуміло, що втручання [USA.GetNameDef] у дипломатію Азії та Океанії є небажаним і неприйнятним. [JAP.GetNameDefCap] погодилася надати гарантії нашій нації, дозволяючи нам високо тримати наш стяг проти ворогів, знаючи, що союзник прийде на допомогу, якщо американці виявляться занадто могутніми, щоб подолати їх наодинці."
 AST_dividing_the_pacific:0 "Розділення Тихого океану"
 AST_dividing_the_pacific_ast_gain_tt:0 "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_election_events.1.t.b:0 "Перемога лейбористів!"
 AST_empire_air_training_scheme_taog_desc:0 "План підготовки льотчиків Британської Співдружності пропонує значне фінансування та досвід одній з країн Співдружності для підготовки великої кількості пілотів та екіпажів. Конкуренція за право її проведення дуже висока, а головними претендентами є Австралія та Канада. Ми подали власну заявку в рамках Імперської схеми підготовки льотчиків."
 AST_fighter_equipment_2:0 "CAC Boomerang"
 AST_heavy_tank_aa_equipment_2_short:0 "Churchill AA"
 AST_heavy_tank_equipment_1:0 "Matilda II"
 AST_integrate_the_fort_desc:0 "Оскільки ми керували Новою Гвінеєю за мандатом Ліги Націй з 1920 року, а Папуа майже з часів Федерації була зовнішньою територією [AST.GetName], східна частина Папуа Нової Гвінеї стала б природним доповненням до основних територій [AST.GetName]. В рамках наших зусиль з об'єднання австралійської культури, це був би наступний крок."
 AST_introduce_unconventional_warfare_desc:0 "Тихоокеанські джунглі вимагають нового підходу до ведення війни. Ми мусимо пересуватися тихо і швидко крізь густі зарості, щоби застати ворогів зненацька, і чекати того ж від них."
 AST_labor_party:0 "Лейбористи"
 AST_light_cruiser_2_desc:0 "$ENG_light_cruiser_2_desc$"
 AST_mio_trait_acf_production_pipeline:0 "Виробничий конвеєр"
 AST_mio_trait_better_ammo_supply:0 "Покращене постачання боєприпасів"
 AST_mio_trait_vulcan_jungle_assault_modifications:0 "Штурмові модифікації для джунглів"
 AST_modern_tank_aa_equipment_1:0 "Centurion Marksman"
 AST_modify_offshore_advancements_spirit_tt:0 "Змінює §Y$AST_offshore_advancements_spirit$§! на:"
 AST_national_defense:0 "Національна оборона"
 AST_nationalizing_process_ends_tt:0 "§RВиконання цього фокусу заблокує всі фокуси вище!§!"
 AST_political_events.4.t:0 "Прем'єр-міністр помирає"
 AST_political_events.6.desc:0 "Сьогодні, коли розгорталося святкування півторастолітнього ювілею, а процесія 'Австралійський марш до нації' пройшла головними вулицями Сіднея, в 'Австралія Гол' відбувся протест.\n\nАктивісти за права аборигенів та різні групи зібралися, щоб привернути увагу до того факту, що 150-річчя не лише знаменує початок британської колонізації, але й конституційну дискримінацію аборигенних народів. Активісти вимагали нових законів для освіти та піклування про аборигенів, а також нової політики, що дозволить надати корінним народам статус повноправних громадян."
 AST_protect_the_homeland:0 "Захист Батьківщини"
 AST_remove_vichy_out_of_africa_decisions:0 "\nВидалити рішення §YВіші геть з Африки§!.\n"
 AST_repeal_immigration_restrictions_desc:0 "Департамент імміграції обмежений застарілими законами, що визначають, кому дозволено іммігрувати до [AST.GetName]. Незважаючи на ризик спровокувати суперечки, ми скасуємо ці закони і натомість запровадимо систему квот для контролю потоку іммігрантів."
 AST_research_city_excursions:0 "Екскурсії наукоградами"
 AST_resist_western_intruders_desc:0 "Західні країни здаються змушеними втручатися у справи Тихого океану, але цьому треба покласти край. Перш ніж вони досягнуть наших берегів, ми досягнемо їхніх, доводячи, що [AST.GetName] не та нація, яка підкоряється вимогам."
 AST_rocket_artillery_equipment_2_short:0 "RP-3 HE/SAP"
 AST_scale_up_middleback_mines_steel_decision_1:0 "Розширити шахту Айрон-Ноб"
 AST_sever_ties_with_uk_desc:0 "Настав час відокремитися від Сполученого Королівства. Австралія прокладе власний курс без вказівок з Лондона і стане господаркою своєї долі в регіоні, що належить їй."
 AST_soothing_australian_fears_desc:0 "Хоча деякі урядовці вірять у можливість співпраці між Австралією та Японією, австралійська громадськість у це не вірить. Після тривалого страху перед японським вторгненням, ідею об'єднання зусиль із тим самим потенційним агресором для більшості важко осягнути. Тому ми заспокоїмо їхні страхи, готуючись до війни."
 AST_state_research_funding_desc:0 "Щоб максимізувати ефективність наших дослідницьких установ, держава повинна стати їхнім основним джерелом фінансування, спрямовуючи зусилля туди, де вони найбільш потрібні, і гарантуючи, що інформація залишається під жорстким контролем. Зрештою, ми не можемо ризикувати, щоб наших громадян турбували неправильні ідеї."
 AST_support_the_centre_party_desc:0 "У Новому Південному Уельсі виник потужний антикомуністичний рух. Підтримувана союзниками з «Нової Гвардії» Центристська партія може стати ключем до посилення Австралії."
 AST_taking_the_helm_desc:0 "Оскільки наш вплив розширюється по всій Південно-Східній Азії, наші військово-морські можливості повинні зростати для його захисту. Ми визначимо пріоритетом постійні інвестиції в Королівський австралійський флот і затвердимо контроль над східними морями."
 AST_the_bolsheviks_counterforce:0 "Протидія більшовикам"
 AST_the_gathering_storm:0 "Буря насувається"
 AST_the_manpower_directorate:0 "Управління трудовими ресурсами"
 AST_toe_the_line_desc:0 "Комфорт, до якого австралійці звикли в роки процвітання, тепер має бути відкладений убік. Нормування, подовжений робочий день і призов на службу — це ціна незалежності. Ті, хто відгукнеться, побачать, що нація готова стояти за ними. Але держава матиме мало терпіння до тих, хто вважає, що жертвувати повинні інші."
 AST_torres_strait_battalion:0 "Батальйон Торресової протоки"
 AST_uap_popularity_decrease_5:0 "Голоси §Y$AST_ruling_party$§! §Y$AST_uap$§!: §R-5.00%§!\n\n"
 AST_union_control_1_cat_desc:0 "Члени наших профспілок почали мобілізувати підтримку серед широких верств населення по всій Австралії. Ми можемо проникнути в законодавчі органи кожного окремого штату, створюючи підтримку комуністичного уряду зсередини. Це коштуватиме значної політичної сили та загрожує дестабілізацією нації. \n\nВетерани Нової гвардії уважно стежать за нашими рухами, і якщо уряд не вживе заходів вчасно, або якщо нація стане занадто нестабільною, цей конфлікт може розірвати націю на частини.\n\nПідтримка комуністів: [?party_popularity_100@communism|Y]§Y%§!\n\n§RГромадянська війна вибухне, якщо стабільність впаде нижче 40%, або якщо час на Повстання ветеранів вичерпається.§!"
 AST_vichy_claim_tt:0 "Претензії [AST.GetFlag]§Y[AST.GetName]§! додано до §YДосить втручатися§!."
 AST_vichy_req_ongoing_flag:0 "Запит на території §YТриває§!"
 AST_we_endured_desc:0 "Передбачення майбутнього конфлікту могло спочатку приголомшити, але використання його для прискорення розвитку нашої обороноздатності зрештою принесло користь. Ми вистояли, і ми продовжимо боротьбу, тепер повністю віддані нашому головному завданню: перемогти у війні."
 ATJ_fascism:0 "Величний Султанат Ачег"
 ATTRITION_STATE:0 "\n - Область: $ATT|=-1%0$"
 AUS_align_with_ussr_desc:0 "Нам стало ще зрозуміліше, чому [SOV.GetNameDef] працює саме так. Хоча спочатку у нас були сумніви щодо радянської системи, тепер ми бачиом, що це може бути найкращий спосіб керувати країною. Приєднавшись до доктрини, єдиною з товаришем [SOV.GetLeader], ми можемо отримати як більш стабільну країну, так і, ймовірно, їхню ласку."
 AUS_anschluss_ratio_ticking_down:0 "§YЗагальна Боєздатність Армії§!, необхідна для початку фокусу §YАншлюс§! буде понижатися щотижня. Її остаточний рівень відповідатиме рівню популярності §YНейтралітету§! в державі §Y[AUS.GetNameWithFlag]§!."
 AUS_arms_industry_effort_effort:0 "Надзвичайні заходи будівництва військової промисловості"
 AUS_austrian_empire_neutrality_ADJ:0 "Австрійськ"
 AUS_crusade_on_communism_d_tt:0 "Дає ціль війни §YПовалення уряду§! проти всіх §YКомуністичних§! націй в §YЄвропі§!"
 AUS_danubian_observers_tt:0 "§YНЕдунайські§! країни, що історично §Yзацікавлені в дунайських землях§!"
 AUS_danubian_state_DEF:0 "Дунайська держава Австрія"
 AUS_end_european_fascism_d_tt:0 "Ми отримаємо ціль війни §YПовалення уряду§! проти всіх §YФашистських§! країн в §YЄвропі§!"
 AUS_federal_state_DEF:0 "Федеративна держава Австрія"
 AUS_focus_on_domestic_production_desc:0 "Побудова та утримання повітряних сил повністю самотужки — величезне і складне завдання. Але в такій непростій ситуації, як ця, ми не можемо дозволити, щоб наші ВПС залежали від інших країн, адже вони — невід’ємна частина наших збройних сил. Незважаючи на високі початкові витрати, ми маємо зробити наші повітряні сили повністю самостійними."
 AUS_liechtenstein_neutrality:0 "Ліхтенштайн"
 AUS_military_exercises_on_border_decision_tt:0 "Принаймні 3 дивізії в одній області на кордоні з державою [FROM.OWNER.GetNameDef]"
 AUS_mio_trait_range_speed:0 "Оптимізація двигуна"
 AUS_news_events.1.desc:0 "Навіть перед обличчям значно сильнішого ворога, уряд Австрії зміг знайти сили не піддаватися німецьким вимогам; підкоритися та приєднатися до Райху. [GER.GetNameDef]і армії вишикувалися на спільному кордоні, однак ще невідомо, чи дійсно Німеччина буде готова розпочати повномасштабне вторгнення.\n\nЦі події стали наслідком багаторічного погіршення відносин між країнами та посилення тиску з боку Німеччини щодо інтеграції Австрії в себе."
 AUS_news_events.9.c:0 "Нарешті!"
 AUS_political_events.109.t:0 "[FROM.GetNameDefCap] озброює прикордонників"
 AUS_political_events.111.a:0 "Не будемо жити минулим, де розписатися?"
 AUS_political_events.115.a:0 "Чому б ні?"
 AUS_political_events.119.desc:0 "Хоча вони вже заявили значні претензії на Балкані, [FROM.GetAdjective]і імперіалісти захотіли більшого. Вимоги, які вони висувають цього разу, напряму стосуються нашої сфери інтересів. У той же час, нам не двояки натякнули, що наслідки у випадку нашої відмови будуть для нас значно більш катастрофічними, ніж від прийняття ультиматуму."
 AUS_political_events.14.a:0 "Сміливий і приємний крок від такої маленької Австрії"
 AUS_political_events.18.t:0 "[FROM.GetNameDefCap] призначає Артура Зейсса-Інкварта радником"
 AUS_political_events.37.a:0 "Ми не просто так відкололися від них тоді!"
 AUS_political_events.37.b:0 "Вони знищать нас, це безнадійно..."
 AUS_political_events.58.desc:0 "[FROM.GetNameDefCap] звернулася до нас із загрозою. Вони без жодних добрих слів повідомляють нам, що хочуть отримати контроль над [39.GetName] і [850.GetName], які, як вони стверджують, належать їм по праву. Ці області колись дійсно були частиною [FROM.GetAdjective]их центральних земель, однак після Великої Війни отримали нового володаря."
 AUS_political_events.60.desc:0 "З боку [FROM.GetNameDef]ого уряду було подано офіційну скаргу щодо нашої нещодавньої прихильності оборонному плану, запропонованому Альфредом Янси. Вони стверджують, що ця дія явно вчинена через неприязнь до них, як країни, і що вона стане перешкодою на шляху до наших майбутніх дипломатичних відносин. Хоча дійсно, ми не сильно впевнені, чому це викликало таку гарячу реакцію."
 AUS_political_events.75.t:0 "Гаранти відмовляються переглядати договір"
 AUS_reclaiming_yugoslavian_territories:0 "Претензії до балканських територій"
 AUS_sending_invite_to_danubian_federation_flag:0 "Зараз запрошуємо країну в §Y[ROOT.GetFactionName]§!."
 AUTONOMY_CAN_LOSE_DESC:0 "$OWNER|UH$ може бути знижено до статусу $PREVLEVEL|lH$"
 AUTONOMY_PROGRESS_DESC:0 "Держава $OWNER|H$ набрала £autonomy_texticon $CURRENT|H0$/$TOTAL|H0$ балів для отримання статусу $NEXTLEVEL|H$"
 AUTOSAVING_OOS_DUMP:0 "Іде автозбереження позасинхронного дампу...\n$DUMP_NAME$"
 AZR_democratic_party_long:0 "Партія рівності"
 BAH_neutrality_DEF:0 "Багами"
 BALTIC_axis_investments_desc_jap:0 "Держава [JAP.GetName] довела всім свою економічну та військову міць, і, хоч вона не дуже близька нам, не можна заперечувати, що торгівля з [JAP.GetAdjective] державою та її інвестиції значно посилять [ROOT.GetNonIdeologyAdjective] економіку."
 BALTIC_crossley_motors_desc:0 "Тепер, коли в нас щосили інвестують інші країни та розвинулася автопромисловість, ми можемо у співпраці з «Crossley Motors Company» створювати власні проєкти автомобілів для [Root.GetNonIdeologyAdjective] армії!"
 BALTIC_events.101.d:0 "[From.GetLeader] оголошує про свою підтримку [Root.GetAdjective] незалежності і братиме участь у будь-яких конфліктах, що загрожують існуванню держави [Root.GetNameDef]."
 BALTIC_events.14.t:0 "«Лісові брати» крадуть спорядження"
 BALTIC_events.203.t:0 "Ідея Балтійської Антанти не прийнята!"
 BALTIC_events.4.t:0 "Комуністи йдуть на місто [Root.Capital.GetName]"
 BALTIC_events_10_tt:0 "Станеться подія §Y[Root.GetNameDefCap] просить про вторгнення в Польщу§!."
 BALTIC_focus_on_the_interior_desc:0 "Багато робітників готові хоч зараз іти маршем на сусідні країни і принести нашу славну революцію всім народам Балтики, але натомість нам варто зосередитися на внутрішніх справах нації та стабілізувати режим після революції."
 BALTIC_renew_allied_trade_desc_international:0 "З самого зародження нашої держави ми сподівалися на торгову та військову підтримку інших країн, і було б нерозумно зараз від неї відмовлятися. Щоб пережити тиск німців та росіян на наші кордони, ми мусимо залучити закордонні інвестиції в країну."
 BALTIC_rsaf_enfield_organization:0 "$BALTIC_RSAF_enfield$"
 BALTIC_soviet_volunteer_forces:0 "Радянські добровольчі війська"
 BAR_communism:0 "Народні незалежні комуни Баротселенду"
 BAR_communism_party_long:0 "Лозійська народна партія"
 BAR_fascism_party_long:0 "Баротсейські імперські реставратори"
 BAY_VICTORY_POINTS_9515:0 "Ренгшбурх"
 BBA_african_union_events.13.a:0 "Маємо погодитись не погоджуватись."
 BBA_african_union_events.16.t:0 "[FROM.GetNameDefCap] відмовляється від оборонної угоди"
 BBA_african_union_events.18.a:0 "Звісно, ми захистимо їх."
 BBA_african_union_events.6.desc:0 "[FROM.GetNameDefCap] погодилися приєднатися до [ETH_GetCentralBankName] і вже розпочали процес узгодження своєї валюти з нашою. Незабаром торгівля між нашими країнами стане значно простішою."
 BBA_ethiopia_anti_colonialism_events.3.t:0 "[?global.african_supporting_country.GetAdjectiveCap]і посередники досягли успіху!"
 BBA_ethiopia_balance_of_power_events.24.a:0 "Час на нашому боці."
 BBA_ethiopia_balance_of_power_events.54.a:0 "Треба щось робити."
 BBA_ethiopia_communist_events.09.desc:0 "[SOV.GetName] надіслали нам запрошене стрілецьке озброєння для підтримки у боротьбі проти [ITA.GetName]. Це значно посилить наші шанси на перемогу над фашистами."
 BBA_ethiopia_communist_events.17.desc:0 "Делегація з [ETH.GetNameDef] наполягає, щоб ми надіслали надлишкову бронетехніку для допомоги у війні з [ITA.GetName]. [ETH.GetAdjective] війська явно поступаються у боях з [ITA.GetAdjective] бронею. Надсилання техніки могло б суттєво допомогти, але й підвищить напругу між [SOV.GetNameDef] і [ITA.GetName]."
 BBA_ethiopia_communist_events.28.a:0 "Ми мусимо це дозволити. Поки що."
 BBA_ethiopia_communist_events.38.desc:0 "Після нещодавньої боротьби з фашизмом на своїй землі, добровольці з [ETH.GetNameDef] прибули до Іспанії, щоб допомогти нам у нашій боротьбі. [ETH.GetLeader] пообіцяв підтримку нашій справі та надання матеріальної допомоги в найближчі місяці."
 BBA_ethiopia_communist_events.50.b:0 "У нас немає вибору, як погодитися."
 BBA_ethiopia_communist_events.62.a:0 "Героїчна перемога над імперіалізмом!"
 BBA_ethiopia_exile_events.03.t:0 "Комуністичні партизани на півдні [ETH.GetName]"
 BBA_ethiopia_exile_events.13.t:0 "Не пощастило."
 BBA_ethiopia_exile_events.47.a:0 "Треба провчити [FROM.GetLeader.GetHerHim]"
 BBA_ethiopia_exile_events.57.a:0 "Будемо сподіватися, що кораблі залишаться мореплавними..."
 BBA_ethiopia_fascist_events.06.t:0 "Італійці відмовляються співпрацювати"
 BBA_ethiopia_fascist_events.22.t:0 "Боротьба продовжується"
 BBA_ethiopia_fascist_events.61.desc:0 "[ETH.GetAdjective] дипломати таємно звернулись до нас із проханням про постачання зброї. Схоже, в [ITA.GetName] не все гаразд на щойно захоплених територіях, і місцева адміністрація шукає іноземну підтримку для повстання проти своїх господарів. Навіть якщо повстання зазнає поразки, це, без сумніву, відверне увагу та ослабить [ITA.GetAdjective] армію. Однак, якщо стане відомо про нашу участь, це може мати наслідки."
 BBA_ethiopia_fascist_events.70.a:0 "Прекрасно."
 BBA_italo_ethiopian_war_events.301.t:0 "Африканська армія зневірена"
 BBA_italo_ethiopian_war_events.500.a:0 "Гіркий мир, але він є."
 BBA_italo_ethiopian_war_events.503.t:0 "[ETH.GetNameDefCap] відмовляється від мирних переговорів"
 BBA_italy_air_accident.03.t:0 "Трагедію дружнього вогню відвернуто"
 BBA_italy_anti_colonialism_events.01.t:0 "$ITA_the_ethiopian_question$"
 BBA_italy_anti_colonialism_events.20.desc:0 "Здавалося б, що новостворена держава [FROM.GetName] має віднайдене почуття чесноти та мети і взяла на себе зобов'язання демонтувати чужі колоніальні імперії. Італійська делегація звернулася до нас із закликом відмовитися від імперських підходів і прийняти майбутнє співпраці та свободи замість придушення та підкорення."
 BBA_italy_anti_colonialism_events.21.desc:0 "[GetDecolonizationEventDesc]"
 BBA_italy_anti_colonialism_events.63.t:0 "Близький Схід голосує за вихід з держави [ROOT.GetNameDef]"
 BBA_italy_civil_war.4.t:0 "Антипартизанські заходи в [FROM.GetName]"
 BBA_italy_civil_war.5.a:0 "Надати їм незалежність"
 BBA_italy_communist_events.05.a:0 "Це посилює нас!"
 BBA_italy_communist_events.06.t:0 "[FROM.GetAdjective]а пропозиція про співпрацю"
 BBA_italy_council_deposes_duce.2.desc:0 "Через останні випробування та негаразди, з якими зіткну[ROOT.Leader.GetVerbGendEndA_RU]ся [ROOT.GetLeader], Велика рада почала плести інтриги, щоби відібрати владу та захопити її для себе. Це непопулярний крок, який зрештою може навіть призвести до громадянської війни в нашій країні. Ми мусимо зробити все, що в наших силах, щоб зменшити ризик такого розвитку подій."
 BBA_italy_democratic_events.05.a:0 "Покидьки — ось хто вони!"
 BBA_italy_interaction_events.2.t:0 "Боягузлива [SWI.GetName] складається"
 BBA_italy_interaction_events.32.desc:0 "Сьогодні італійський уряд звернувся до нас з цікавою пропозицією. Вони кажуть, що хочуть ратифікувати Фронт Стрези, забезпечивши свою підтримку нашій стороні на випадок, якщо в Європі почнеться війна. Однак для того, щоб підписати цю угоду, вони вимагають територіальних поступок, а саме регіон [268.GetName]. Як ми повинні відповісти? Вони принаймні тимчасово платитимуть нам, якщо ми погодимося."
 BBA_italy_interaction_events.39.t:0 "Плата за африканські колонії"
 BBA_italy_interaction_events.4.b:0 "Італійці зустрінуть свою загибель на берегах Далмації"
 BBA_italy_interaction_events.43.a:0 "Вони пошкодують про цей день!"
 BBA_italy_interaction_events.5.desc:0 "Сьогодні в Загребі б'ють дзвони: італієць, раніше відомий як принц Аймоне, коронується на Томіслава II, короля Хорватії. Наш вплив тепер пошириться далі на Балкани, оскільки дні нашої слави добігають кінця."
 BBA_italy_local_rulers.4.c:0 "$ETH_seyoum_mengesha$ та його послідовники мають бути підкорені."
 BBA_italy_missiolinis.02_north.b:0 "Нам потрібна зміна керівництва!"
 BBA_italy_missiolinis.02_north.desc:0 "Очікуваний успіх нашого контрнаступу на півночі Абіссінії годі відшукати. Дуче стверджує, що весь світ насміхається над ним і відсутністю поступу у війні. Він розглядає ідею взяти особистий контроль над північним наступом, аби запевнитися, що війська належно мотивовані та керовані."
 BBA_italy_missiolinis.102.desc:0 "Факт, що нашим солдатам так важко далося просування в Албанію, спантеличило дуче, який називає це ганьбою для нації. На самоті він із люттю буркоче про те, що це мусив бути славетний момент для Італії — а також самого себе — і як він мусив виправдати наш принизливий вихід звідти майже 20 років тому. Натомість, як він каже, нас зрадили некомпетентність і боягузтво."
 BBA_italy_missiolinis.113.t:0 "Далмацію завойовано"
 BBA_italy_missiolinis.33.desc:0 "Муссоліні прозвав новозведені заводи першим кроком у модернізації італійських індустрій. Дуче дуже вдоволений тим, як це збільшує виробничий потенціал країни та дозволить йому просувати своє бачення великої Італії."
 BBA_italy_research_agreement.1.b:0 "Нам така програма не потрібна."
 BBA_italy_sends_military_support.1.t:0 "[FROM.GetNameDefCap] надсилає військову підтримку"
 BBA_swiss_expansion.16.desc:0 "Попри наш захист і підтримку, наш підконтрольний суб'єкт [FROM.GetName] тепер вимагає звільнення від своїх обов'язків і привілеїв у наших володіннях, щоб знову стати незалежною нацією.\n\n[GetDemandingAlpsParagraph]"
 BBA_swiss_expansion.6.b:0 "[ROOT.GetNameDefCap] ніколи не віддасть жодного клаптя землі!"
 BBA_swiss_expansion.9.desc:0 "Після вимоги передати [848.GetName] на досить сумнівних підставах, [FROM.GetNameDef] пропонує забрати наші території, нібито щоб захистити нас від [GER.GetNameDef], який, за їх словами, найближчим часом спробує анексувати [ROOT.GetNameDef].\n\nХоча це звучить доволі правдоподібно, і разом ми мали б більше шансів відбити вторгнення, платити за це нашою суверенністю — надто висока ціна.\n\nЗвісно, якщо ми відмовимо, вони, ймовірно, нападуть на нас."
 BBA_switzerland.12.desc:0 "Тепер, коли війна завершена, а $GER_fascism_DEF$ більше не існує, Давід Франкфуртер за допомогою свого адвоката Георга Бруншвіга подав запит на помилування за вбивство Вільгельма Густлоффа у 1936 році.\n\nОскільки ми більше не оточені фашистськими режимами, а злочин Франкфуртера було переосмислено через звірства нацистів, виявлені під час війни, майже не існує ризику надати йому помилування. Ми також можемо заборонити йому повертатися до [ROOT.GetName], на випадок чого."
 BBA_switzerland.2.a:0 "Він отримає справедливий суд."
 BBA_switzerland.21.b:0 "Ми не можемо ризикувати конфліктом із [?FROM.SWI_angriest_country.GetName]"
 BBA_switzerland.97.t:0 "Ветеран австрійського флоту пропонує свої послуги"
 BBA_switzerland_fascist.3.desc:0 "[FROM.GetNameDef] стверджує, що має законні права на [848.GetName], посилаючись на вибори 1919 року, коли більшість регіону проголосувала за приєднання до тодішньої Швайцарської Конфедерації. Попри те, що вони вже відмовились від демократії, а голосування відбулося десятиліття тому, передача їм цього регіону може зекономити нам ресурси, витрачені на його утримання, і стати випробуванням для перевірки можливостей і, головне, вірності [FROM.GetName]."
 BBA_switzerland_trade.1.t:0 "[FROM.GetNameDefCap] прагне укласти торговельну угоду з [ROOT.GetName]"
 BBA_switzerland_trade.8.b:0 "Ми не можемо знати, на чиєму вони боці"
 BECOME_SPY_MASTER_DESC:0 "На посаді §Hкерівника розвідмережі альянсу§! ви зможете мати більше агентів у залежності від розміру альянсу.\n§HКерівник розвідмережі§! може бути тільки один на альянс і якщо у вашому альянсі вже є §Hкерівник§!, він мусить дозволити вам перейняти цю посаду."
