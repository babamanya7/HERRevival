 PRC_limited_infiltration_efforts_desc:0 "Ми повинні зробити все можливе, щоб об'єднати Китай, будь-якими необхідними засобами. Народ Китаю має знати, що ми не забули про нього, і надати йому як матеріальну, так і нематеріальну підтримку, якщо настане день, коли це знадобиться."
