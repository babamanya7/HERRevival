 FIN_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1:0 "Генерал-бригадир"
 FIN_ambitions_in_the_south_claims_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! отримує претензію в §Yкожних [EST.GetAdjective]их§!, §Y[LAT.GetAdjective]их§! і §Y[LIT.GetAdjective]их осердних землях§! ще не заявлено [ROOT.GetNameDef]."
 FIN_appeal_to_the_middle_class:0 "Звернення до середнього класу"
 FIN_appeal_to_the_middle_class_desc:0 "Основна підтримка фінських правих організацій надходить від середнього класу. Ми повинні закликати заможних фермерів, освічених буржуазії, державних службовців, священнослужителів і студентів університетів приєднатися до нашого руху та поширювати наші принципи та ідеологію серед населення."
 FIN_appoint_yrjo_leino_as_president_desc:0 "Урйо Лейно — це той, хто справді може привести наш народ до процвітання, і варто розглянути питання про призначення його президентом якомога швидше."
 FIN_bop_modifier_caretaker:0 "Доглядач"
 FIN_defensive_preparations_desc:0 "Незалежно від ідеології, здається, ми приречені на конфлікт із нашим східним сусідом. Ми повинні підготуватися до неминучого та швидко розширити нашу оборону. Якщо ми зазнаємо невдачі, наша держава знову може бути захоплена нашими ворогами."
 FIN_elijarvi_mine_desc:0 "Ми отримали зразки, знайдені під час розкопок поблизу Еліярві, які вказують на існування хромової руди, яка може бути дуже багатою на хром. Ми повинні розпочати нові видобувні роботи в цьому районі та забезпечити надійне джерело хрому для військових промисловість."
 FIN_fascism_party_long:0 "Патріотичний народний рух"
 FIN_fighter_equipment_0_short:0 "IVL Haukka"
 FIN_finnish_legion_of_honor:0 "Фінський орден Почесного легіону"
 FIN_finnish_supremacy_in_the_north_unlock_decisions_tt:0 "Відмикає рішення §YНадавати тиск на уряд§! і §YСприяти ідеологічним мітингам§! у країнах Північної Європи та Балтії."
 FIN_finno_estonian_union:0 "Фіно-естонський союз"
 FIN_good_side:0 "§GВисока довіра громадськості§! до: [FIN.GetLeader]"
 FIN_helsinki_air_defense_desc:0 "Оскільки над [ROOT.GetName] нависла війна, Гельсінкі необхідно укріпити. Місто та його узбережжя вразливі для нападу, і для їх захисту доручено [ROOT.GetAdjective]им військовим. Покращений протиповітряний захист і берегові укріплення не тільки захистити місто, але й зміцнити рішучість нації протистояти будь-якому нападу."
 FIN_industrialize_the_region_building_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! і §YКожен північноєвропейський союзник§!:\nДодає §G2§! комірки для будівництва та §G2§! §Y$industrial_complex_pl_acc$§! у повністю підконтрольній осердній області.\n\nПоточні ефекти:"
 FIN_infantry_equipment_1:0 "M/39 Ukko-Pekka"
 FIN_infantry_equipment_2:0 "Suomi KP/-31"
 FIN_integrate_oy_tikkakoski_desc:0 "Щоб зміцнити [ROOT.GetAdjective]у збройову промисловість, Oy Tikkakoski буде інтегровано в державний завод військової зброї. Цей крок збільшить виробництво зброї та розробку нової вогнепальної зброї для [ROOT.GetAdjective]ої армії."
 FIN_makola_mine_desc:0 "Багаті родовища нікелю та міді були знайдені в Маколі та Гітурі. Наші експерти вважають, що ці родовища містять великий потенціал для економічного зростання нашої країни та військової промисловості, що швидко розвивається, і вони радять розпочати будівельні роботи на шахті Маколи, щоб якнайшвидше забезпечте постійне джерело дорогоцінних мінералів."
 FIN_military_aid_subsidies_tt:0 "Додавання субсидії на обладнання до §Y[ROOT.GetName]§! з [?ROOT.FIN_basic_subsidies_value|Y2] £GFX_civ_factory_output для §Y$small_plane_airframe$§!, §Y$medium_plane_airframe$§!, §Y$light_tank_chassis$§!, §Y§Y$medium_tank_chassis$§!§!, §Y$artillery_equipment$§!, §Y$anti_air_equipment$§! та §Y$anti_tank_equipment$§!, націлені на §Yкожного головного союзника§!."
 FIN_mio_trait_contract_with_yhteissisu:0 "Контракт із «Yhteissisu»"
 FIN_moderate_politics_desc:0 "Оскільки між великими державами зростає напруженість, нам потрібно забезпечити, щоб наш уряд не сприймався як надто поблажливий до ідеологій будь-якої фракції. Тому ми повинні проводити політику внутрішньої поміркованості."
 FIN_modernize_the_industry_desc:0 "Плоди нашої технологічної праці знаходять застосування не лише для бойових застосувань. Багато з них можна використати, щоб зробити нашу галузь більш ефективною. З деякими інвестиціями ми могли б розпочати масштабну програму промислової модернізації з нашими новими знаннями."
 FIN_motti_tactics_cost_increase_tt:0 "Вартість рішень §YПідготувати тактику motti§! буде §Rпомножено§! на §Y[?FIN_motti_decision_cost_increase]§!.\n"
 FIN_neutrality_party_progressive:0 "НПГ"
 FIN_northern_defense_front:0 "Північний оборонний фронт"
 FIN_parmis_devils_desc:0 "Штрафний батальйон Нікке Пярмі довів ефективність використання живої сили, яка б інакше сиділа за ґратами. Нам слід розширити його роботу, створивши підрозділ із ув'язнених, які готові воювати за свою країну."
 FIN_prepare_a_military_coup:0 "Підготувати військовий переворот"
 FIN_preserve_sapmi_event_tt:0 "Кожна нейтральна чи союзницька країна, яка контролює будь-яку осердну землю саамів, отримує подію §Y$AAT_finland_diplomacy.05.t$§!."
 FIN_pressure_country_government_nordic:0 "$SOV_pressure_country_government_baltic$"
 FIN_promote_ideology_rallies_nordic:0 "$SOV_promote_ideology_rallies_baltic$"
 FIN_repurpose_small_industries:0 "Перепрофілювати малі підприємства"
 FIN_socialist_welfare_traits_upgrade_tt:0 "\nПокращити рису лідера країни поточного лідера."
 FIN_strengthen_military_administration_desc:0 "Маннергейм героїчно провів нашу країну в ці бурхливі часи, розбиваючи політичні догми з мілітаристською точністю. Заради подальшого виживання нації ми повинні дати йому та військовим повноваження керувати так, як вони вважають за потрібне."
 FIN_tac_bomber_equipment_1:0 "Bristol-VL Blenheim"
 FIN_tac_bomber_equipment_1_short:0 "Blenheim"
 FIN_the_merchant_fleet_ns_tt:0 "$FIN_the_merchant_fleet_dynamic_modifier_tt$\n"
 FIN_valtion_tykkitehdas_organization:0 "Valtion Tykkitehdas"
 FIN_winter_warfare:0 "Зимова війна"
 FLEET_OUT_OF_RANGE_TOOLTIP_ENTRY_ZERO_DIST:0 "  $FLAG$ $NAME$: найближча морська база §Gзнаходиться поруч§!\n"
 FLEET_OUT_OF_RANGE_TOOLTIP_SOME_SHIPS:0 "\n  $NUM|Y$/$MAX|Y$ §Rобраних оперативних груп не можуть переміститися сюди.§!"
 FOCUS_FILTER_FRA_OCCUPATION_COST:0 "Витрати на окупацію"
 FOCUS_NO_PREREQ:0 "Немає передумов для виконання"
 FOCUS_STATUS_INPROGRESS_TOOLTIP:0 "Час виконання: $DAYS|H0$ дн. (лишилося $LEFT|H0$ дн.)"
 FOCUS_STATUS_TOOLTIP:0 "Час виконання: $DAYS|H0$ дн."
 FRA_AUS_autonomy_eu_member_DEF:0 "Європейська Франція"
 FRA_CAS_equipment_2_short:0 "LN.401"
 FRA_EQUIPMENT_VERSION_13:0 "série M"
 FRA_anti_air_equipment_1_short:0 "Hotchkiss 25 mm"
 FRA_continue_the_fight:0 "Продовжити боротьбу"
 FRA_coup_in_madagascar_desc:0 "Багато французів на Мадагаскарі прагнуть знову боротися із загарбником. Треба лише вийти з ними на зв'язок."
 FRA_decolonization:0 "Деколонізація"
 FRA_destroyer_1_desc:0 "Есмінці типу «Bourrasque» були частиною 1500-тонної серії і спущені на воду в середині 1920-х років. Разом із попереднім класом Chacal і наступним L'Adroit вони становили основу нового сучасного післявоєнного французького флоту. Вони були швидкісні та добре озброєні для свого часу, але їх торпедне озброєння менше порівняно з аналогічними кораблями інших флотів."
 FRA_dirigisme_desc:0 "Хоча повна планова економіка радянської моделі явно є надто крайнім заходом, для оптимізації нашої економіки потрібні певні планування та напрям."
 FRA_economic_devolution:0 "Економічна деволюція"
 FRA_firepower_kills:0 "Убивча вогнева міць"
 FRA_form_the_national_committee_desc:0 "Мало хто міг повірити, що наша справа може мати успіх. Але тепер ми нарешті достатньо сильні, щоб оголосити про формування повністю функціонуючого уряду у вигнанні, готового взяти під контроль будь-яку французьку територію, звільнену від ворога."
 FRA_go_with_britain_desc:0 "Росія змінилася безповоротно, і від колишньої Антанти залишилися лише Франція та Велика Британія. Якщо історія приречена повторюватися, ці дві держави — цитаделі демократії та свободи в Європі — мусять залишатися союзниками."
