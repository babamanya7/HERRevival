 wtt_border_conflict_canceled_defender.1.t:0 "Патова ситуація в області [their_state.GetName]"
 wtt_border_conflict_won_attacker.1.desc:0 "Сутичка на кордоні між областями [our_state.GetName] і [their_state.GetName] закінчилася рішучою перемогою наших військ над армією [their_country.GetLeader]. [their_country.GetAdjective]і війська відступили, щоби перегрупуватися, а наші солдати взяли контроль над спірною територією."
 wtt_border_incident_defender_warning.1.t:0 "[From.GetNameDefCap] загрожує нашим кордонам"
 wtt_britain.27.d:0 "Французи відкинули наші вимоги. Тепер ми поставлені перед неприємним вибором — розвернутися та піти чи відкрити вогонь за нашими колишніми союзниками..."
 wtt_britain.28.d:0 "Уряд Ірландії прийняв пропозицію та приєднався до нашої боротьби в обмін на Північну Ірландію."
 wtt_britain_lease_azores.2.t:0 "[From.GetNameDefCap] погоджується"
 wtt_china.2.desc:0 "[From.GetLeader] відправив посланця назад з особистою обіцянкою виконати всі наші вимоги та координувати свої дії з нашим урядом."
 wtt_china.3.a:0 "Іще побачимо."
 wtt_china_shared.11.desc_b:0 "Війна, що триває в Китаї, важко позначилася на стані [From.GetAdjective]их ВПС, які намагаються захищати повітряний простір та надавати підтримку наземним військам. [From.GetLeader] особисто звертається до лідера [SOV.GetLeader] з проханням надати їм близько 50 середніх бомбардувальників та 100 винищувачів.\n\nЗаодно у нас з'явиться можливість випробувати новітнє обладнання у бойових умовах."
 wtt_germany.1001.desc:0 "Сьогодні при спробі «Гінденбурга» пришвартуватись у лондонських доках сталася жахлива трагедія. За поки що нез'ясованими причинами дирижабль охопило полум'я, і він упав на землю, забравши життя пасажирів та екіпажу, включаючи майже всіх членів великого королівського сімейства Німецької імперії.\n\nЖивими залишилася лише принцеса Вікторія-Луїза, яка виїхала раніше для допомоги у підготовці церемонії. Таким чином, принцеса, третя в сімействі, що носить ім'я Вікторія на честь своєї бабусі, імператриці Німеччини Вікторії, і своєї прабабки королеви Вікторії, тепер єдина спадкоємиця. Не одужавши до кінця від потрясіння, вона, проте, вже зійшла на трон під ім'ям Вікторії I."
 wtt_germany.1002.a:0 "Трагедія!"
 wtt_germany.59.desc:0 "Уряд Німеччини вирішив прийняти свої старі території та урочисто поклявся захищати польських мешканців цього регіону."
 wtt_germany.64.a:0 "Що нам робити?"
 wtt_infiltration.3.desc:0 "У ході наших недавніх рейдів тими місцями, де зазвичай ховалися комуністи, нікого виявити не вдалося. Ми знаємо, що агенти комуністів досі діють у нашій країні, але, схоже, вони не організували жодних нових осередків, про які нам не було б відомо."
 wtt_japan.110.desc:0 "[JAP_initiator.GetNameDefCap] промацує настрої, намагаючись дізнатися, наскільки нас зацікавить пакт між нами, [JAP_initiator.GetAdjective]ою та [GER_fascism.GetAdjective]ою державами. [JAP_initiator.GetAdjective]е керівництво стверджує, що в обстановці зростаючої світової ворожості до наших дій дуже важливо підтримувати одне одного. [GER_fascism.GetAdjective]е керівництво вже повідомило, що підтримує цю ідею."
 wtt_manchukou.1.desc:0 "Схоже, [From.GetLeader] вирішив нарешті поширити свою владу до далеких куточків Китаю. Представники [From.GetAdjective]ого уряду зажадали, щоби ми схилилися перед істинним імператором Китаю, Сином неба на ім'я [From.GetLeader]. У разі відмови нас, за його запевненнями, судитимуть за державну зраду."
 wtt_news.27.d:0 "Несподіваний поворот."
 wtt_news.34.b:0 "Ми їм дуже раді."
 wtt_news.38.desc:0 "Внутрішні чвари між фракціями комуністичної партії Китаю, схоже, припинилися з появою рішучого лідера, яким став [PRC.GetLeader]. Мао Цзедун і помірні фракції втратили свій вплив, оскільки за підтримки Радянського Союзу [PRC.GetLeader] переграв їх усіх. Яку роль у цьому зіграв [SOV.GetLeader], якщо взагалі зіграв, залишається лише здогадуватися."
 wtt_news.41.desc_usa:0 "Не маючи можливості захистити Панамський канал і щоби не ризикувати цим важливим комунікаційним шляхом, держава [From.GetNameDef] вирішила зруйнувати канал, скориставшися затопленими суднами, підривними зарядами та мінами. Пошкодження досить великі, і швидше за все, відновні роботи займуть місяці."
 wtt_news.50.d:0 "Він сам змусив їх."
 wtt_news.53.a:0 "Славний день для всіх скандинавів!"
 wtt_news.53.desc:0 "Завдяки силі своєї зброї держава [From.GetOldName] об'єднала під своїм пануванням усі скандинавські народи, і тепер його уряд займається включенням до складу нових територій. Щоб заручитися широкою підтримкою населення, було проведено кампанію пропаганди з недвозначним націоналістичним змістом.\n\nЯк додаткові засоби прихильники об'єднання Скандинавії вже почали посилатися на історичні паралелі і доводити, що справжня ситуація в регіоні — це лише продовження тенденцій минулого. [From.GetOldAdjective]ий уряд охоче вхопився за їх міркування, офіційно заявив про «відновлення Кальмарської унії» і змінив назву країни на «[From.GetNameDef]»."
 wtt_news.61.b:0 "Вічна держава постала знову..."
 wtt_news.62.a:0 "Невже це кінець усім війнам у Європі?"
 wtt_news.64.b:0 "Вони ж це невсерйоз!"
 wtt_news.9.c:0 "Сподіватимемося, німці нас не підведуть..."
 wtt_prc.2.desc:0 "Після довгого роздуму [From.GetLeader] вирішив відхилити нашу пропозицію. Наші джерела в уряді повідомляють, що йому всюди здається змова комуністів і що він вважає, ніби ми хочемо захопити уряд і відібрати у нього контроль над країною."
 wtt_the_hump.3.desc:0 "Через Гімалаї полетіли перші [From.GetAdjective]і літаки, що доставляють важливі вантажі. Їм досі загрожують ворожі ВПС, але принаймні постачання відновилося."
 wtt_xian_incident.6.t:0 "[From.GetLeader] відмовляється від союзу з комуністами"
 wuw_GER_civil_war.2.a:0 "Цікава подія"
 wuw_GER_civil_war.7.t:0 "Лояльність Крігсмаріне"
 wuw_GER_diplomacy.100.desc:0 "Посол [FROM.GetName] повідомив, що ми більше не отримуватимемо платежі за окупаційні витрати, які були погоджені раніше."
 wuw_GER_diplomacy.32.t:0 "[FROM.GetAdjective] просять поновити оренду [743.GetName]"
 wuw_GER_diplomacy.54.t:0 "[FROM.GetNameDefCap] приймає нашу торговельну пропозицію"
 wuw_GER_diplomacy.55.t:0 "[FROM.GetNameDefCap] відхиляє нашу торговельну пропозицію"
 wuw_GER_diplomacy.60.b:0 "Вони з глузду з’їхали?"
 wuw_GER_diplomacy.68.a:0 "Час діяти!"
 wuw_GER_monroe.1.desc:0 "Ми отримали тривожні повідомлення про те, що [FROM.GetNameDef] почав проявляти зростаючий інтерес до дестабілізації Доктрини Монро. Ця доктрина була запроваджена з метою запобігання втручанню іноземних держав на американському континенті, який ми вважаємо нашою сферою впливу. Судячи з попередніх зустрічей з [FROM.GetNameDef], ми можемо лише припустити, що їхні наміри є недобрими."
 wuw_GER_monroe.8.desc:0 "[FROM.GetLeader] особисто звернувся до нас, підтвердивши, що Доктрина Монро й далі діє, попри спроби [GER.GetAdjective] її зруйнувати. Вони наголосили, що ми користувалися їхнім захистом, і тепер наш обов’язок — разом з ними підтримати Доктрину."
 wuw_GER_monroe_news.1.c:0 "Великий день!"
 wuw_GER_mutual_guarantees.2.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прийняв нашу пропозицію про взаємну співпрацю та гарантії, тепло зустрівши наших дипломатів, заявивши, що лише разом ми зможемо захистити свої країни від зовнішніх загроз."
 wuw_GER_realpolitik.39.b:0 "Нам не потрібна їхня дружба!"
 wuw_GER_realpolitik.46.b:0 "Ми ніколи не здамося!"
 wuw_GER_realpolitik.50.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 wuw_GER_reichskommissariats.19.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.23.t:0 "Статус Західного узбережжя США"
 wuw_GER_weltpolitik.10.t:0 "Конголезька криза"
 wuw_GER_weltpolitik.12.desc:0 "\n[FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із цікавим запитом. Він просить повернути старі [FROM.GetAdjective] колоніальні території в обмін на поглиблення відносин між нашими країнами та офіційну підтримку нашого уряду на світовій арені. Це виглядає дещо односторонньо, але можливо, так буде краще?"
 wuw_GER_weltpolitik.21.t:0 "[FROM.GetNameDefCap] не відступає в Анголі"
 wuw_GER_weltpolitik.5.t:0 "[FROM.GetLeader] вимагає здати Конго"
 wuw_HUN_absolute_rule_of_the_national_unity_party:0 "Національна партія єдності"
 wuw_HUN_demand_austrian_restoration_desc:0 "Австрія, або ж Цислайтанія, була невіддільною частиною нашої федеративної імперії. Настав час знову забезпечити владу Габсбургів у цій державі та об'єднати наші королівства в одну федерацію."
 wuw_HUN_demand_wiedist_restoration:0 "Вимогти відновлення Відської династії"
 wuw_HUN_elect_a_fascist_king_desc:0 "Нашій нації потрібен сильний лідер, який проведе її через буремні часи. Цей правитель має викликати повагу народу та страх у ворогів."
 wuw_HUN_establish_the_mavag_army_division:0 "Створити військовий підрозділ MÁVAG"
 wuw_HUN_expand_the_arpad_line_can_have_more_tt:0 "Також будує §Yфорти§! рівня 2 вздовж південного та східного кордонів §Y[84.GetName]§!, якщо повністю контролюється §Y[ROOT.GetNameDef]§!"
 wuw_HUN_hold_territorial_referendums:0 "Провести територіальні референдуми"
 wuw_HUN_invest_in_the_special_forces_desc:0 "Наша армія має достатньо солдатів для справжнього бою, але буде надзвичайно корисно підготувати їх якнайкраще, інвестуючи в нові програми підготовки спецпризначенців."
 wuw_HUN_invite_german_investors_desc:0 "Як передбачено у наших торговельних угодах, лише [GER.GetAdjective] та [ROOT.GetAdjective] можуть інвестувати в нашій країні. Ми повинні скористатися цією можливістю."
 wuw_HUN_license_fiat_tankettes_desc:0 "Для посилення механізованих частин доцільно налагодити виробництво легких танків і танкеток у співпраці з [ITA.GetAdjective] компанією Fiat."
 wuw_HUN_magyar_cserkeszszovetseg:0 "Угорська скаутська асоціація"
 wuw_HUN_news_events.2.a:0 "Цікаво, чим це закінчиться..."
 wuw_HUN_news_events.2.c:0 "Корисний пішак."
 wuw_HUN_reclaim_the_slovak_possessions:0 "Повернути словацькі володіння"
 wuw_HUN_royal_hussars:0 "Королівські гусари"
 wuw_HUN_the_second_northern_campaign:0 "Друга Північна Кампанія"
 wuw_HUN_the_turan_43_tt:0 "\nПісля дослідження технології §Y$advanced_medium_tank_chassis$§!:\n"
 ww_BEL_event_diplomatic.10.desc:0 "Ми отримали повідомлення від нашої делегації в Парижі, що [FRA.GetName] вирішила прийняти нашу пропозицію, і процес передачі адміністрації Кале та прилеглих територій уже розпочато!"
 ww_BEL_event_diplomatic.11.t:0 "Ескалація напруженості через Кале"
 ww_BEL_event_diplomatic.16.b:0 "Ми не маємо можливості допомогти"
 ww_BEL_event_diplomatic.36.t:0 "[FROM.GetNameDefCap] Погоджується"
 ww_BEL_event_diplomatic.9.desc:0 "Наш колоніальний губернатор щойно отримав повідомлення, що [BEL.GetName] уклала угоду з [FRA.GetName] щодо обміну Кале на кілька наших штатів, а саме Кокільятвіль та Стенлівіль. Знову ж таки, європейські правителі змінюють кордони Африки без будь-якого вкладу з нашого боку, тих, хто тут насправді живе!"
 ww_BEL_event_spanish_interaction.9.a:0 "Справжня шкода"
 ww_congo.15.t:0 "[FROM.GetNameDefCap] відмовляє в наших вимогах"
 ww_congo.58.a:0 "Ми не можемо багато зробити"
 ww_congo.71.t:0 "Ян Зумбах хоче поїхати до Конго"
