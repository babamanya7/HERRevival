 GER_restore_the_brest_litovsk_borders:0 "Відновити кордони Брест-Литовського договору"
 GER_reverse_the_brain_drain_desc:0 "Розробившись із зовнішніми загрозами та авторитарними режимами, ми можемо залучити вчених, що емігрували, переконавши їх знову працювати на благо батьківщини."
