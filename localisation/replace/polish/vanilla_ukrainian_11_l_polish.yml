 sp_naval_nuclear_torpedo_unique_reward_a_desc:0 "Оскільки розробка ядерних торпед наближається до фінальної мети проєкту, ми маємо прагнути..."
 sp_naval_proximity_fuze_desc:0 "Завдяки вдосконаленій і більш надійній радіотехнології ми можемо розробити новий тип детонаторів, які вибухатимуть, просто перебуваючи поблизу цілі, і пошкоджуватимуть її."
 sp_nuclear_isotope_separation_choice_reward_desc:0 "Щоби забезпечити наші реактори ядерним паливом, нам потрібно визначитися з процесом відокремлення корисних ізотопів урану від решти. Існує низка пропозицій щодо засобів розділення, але двома провідними є газовий і відцентровий."
