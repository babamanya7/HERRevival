 GER_assist_our_eastern_comrades_desc:0 "Боротьба наших товаришів на далекому сході завдала їм чималих втрат. Ми повинні допомогти їм усім, чим зможемо. Відправка загартованих у боях солдатів може змінити хід подій на їхню користь."
 GER_austrian_army_does_not_exist:0 "Нині §Y[AUS.GetnameDef]§! не має жодну постійну армію."
 GER_ballistic_missile_equipment_1:0 "Aggregat 4"
 GER_battleship_2_desc:0 "Лінкори класу «Scharnhorst» були першими сучасними лінкорами, побудованими для Крігсмаріне. Вони були побудовані як відповідь на французькі лінійні крейсери класу «Dunkerque», які в свою чергу були відповіддю на німецькі кишенькові лінкори класу «Deutschland» (Panzerschiffe). Клас «Scharnhorst» озброєний дев'ятьма 283-мм (11-дюйм.) гарматами в трьох потрійних баштах. Планувалося озброїти їх спареними 380-мм (15-дюйм.) гарматами, але з початком війни це так і не сталося."
 GER_black_front:0 "Чорний фронт"
 GER_build_the_eastern_bulwark_tt:0 "Будує §Y2 рівень наземних укріплень§! у всіх областях, що належать §Y[ROOT.GetNameDef]§! або країнам, яким ми гарантуємо незалежність чи які є в одній фракції з нами, що межують із §Y[SOV.GetNameDef]§!."
 GER_cancel_mefos_desc:0 "Ми надто довго покладалися на Райхсбанк у відбудові нашої збройової промисловості. Настав час нам укласти вексель із нашими виробниками зброї та покінчити з цією шарадою з векселями «MEFO»."
 GER_case_anton_tt:0 "Анексує Вішістську Францію за 7 днів і захопить французький флот.\n\n§RФранція матиме можливість затопити свій флот, якщо німецькі війська не прибудуть у Тулон за 2 дні!§!\n"
