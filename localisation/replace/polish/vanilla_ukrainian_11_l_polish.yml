 ITA_mussolini_stands_trial_tt:0 "Нехай Суд справедливості вирішує його долю — до тих пір, поки ми керуємо Судом справедливості."
 ITA_new_ricostruzione_industriale_desc:0 "Досі Instituto per la Ricostruzione Industriale відігравав важливу роль у порятунку, реструктуризації та фінансуванні збанкрутілих банків і приватних компаній. Із деякими корективами ми подбаємо про те, щоби він продовжував працювати без фашистських відтінків минулого."
 ITA_occupation_tt:0 "Технічно [ITA.GetName] продовжуватиме воювати з урядом у вигнанні [ETH.GetName], доки [ETH.GetName] не втратить контроль над усіма областями."
 ITA_oil_in_tripoli:0 "Нафта в Тріполі"
 ITA_preserve_army_traditions_desc:0 "Сьогодні існує багато ідей щодо нових способів ведення війни. Хоча деякі з них, можливо, мають певні переваги, основа будь-якої успішної армії не змінилася з часів Гая Юлія Цезаря: дисципліна, індивідуальна відвага та вміле керівництво."
