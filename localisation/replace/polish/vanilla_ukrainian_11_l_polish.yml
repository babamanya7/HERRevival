 BEL_free_belgian_forces_tt:0 "2 §YПіхотні дивізії§! з'являться в випадковій провінції на батьківщині країни, що прийняла вигнання."
 BEL_interpreters_desc:0 "Однією з великих перепон, з якими стикалися наші збройні сили, була двомовна вимога для офіцерського корпусу, щоб він міг командувати як фламандськими, так і валлонськими солдатами. Тепер це може стати однією з наших найбільших переваг, оскільки ми можемо діяти майже без обмежень на територіях наших сусідів, без мовних бар'єрів."
 BEL_kings_abdication_desc:0 "Після публічного розриву відносин між парламентом та монархом, на короля Леопольда чинився тиск абдикувати. Сподіваємося, що він піде мирно."
 BEL_maritime_phoenix_desc:0 "З нуля наш флот розцвів. Наші суднобудівні верфі освітлені вогнями промисловості, нові кораблі залишають slipways зі зростаючою швидкістю, і наші стратегічні інтереси за кордоном тепер задоволені нашими флотами, що носять прапор [ROOT.GetAdjective]."
 BEL_monetary_reconstruction:0 "Монетарна реконструкція"
 BEL_perpetual_neutrality:0 "Вічний нейтралітет"
 BEL_relocate_air_production_desc:0 "Виробництво літаків вимагає значних кількостей спеціалізованих компонентів і залежить від рідкісних аеронавтичних інженерів. Проте, як тільки літаки виготовлені, їх можна розгорнути майже в будь-якому місці. Ми повинні укласти контракти з іноземними фірмами для виробництва наших літаків за кордоном, щоб захистити наші виробничі лінії."
