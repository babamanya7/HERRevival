 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC:0 "Конголезький ШІ спробує якнайшвидше здобути незалежність мирним шляхом, а згодом спробує поширити комунізм по всій Африці."
 RULE_OPTION_COMMUNIST_TUR_AI:0 "Прорадянський комунізм"
 RULE_OPTION_EXILES_FASCIST_SOV_AI_DESC:0 "§HРадянський§! ШІ вижене комуністів під час громадянської війни та встановить фашистський уряд, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_FASCISM_PER_AI:0 "Фашизм: НСРПІ"
 RULE_OPTION_FASCISM_PER_DESC:0 "ШІ об'єднає націоналістів країни й утворить НСРПІ, встановивши в країні фашистський режим. Той спробує приєднатися до фашистського альянсу й оголосить війну своїм сусідам."
 RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA_RAJ_AI_DESC:0 "Індія піде шляхом опору і обере Саваркара своїм лідером, зайнявши більш войовничу позицію щодо незалежності та спробує сформувати Акханд Бгарат."
 RULE_OPTION_HUN_HABSBURG_HUNGARY:0 "Габсбурзька Угорщина"
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY_AI_DESC:0 "Король Віктор Еммануїл скине Муссоліні, намагатиметься утворити незалежний альянс і повести Італію в напрямі конституційної монархії, сприяючи християнсько-демократичній партії на чолі з Альчіде де Гаспері."
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC:0 "Італійські антифашисти об'єднають сили для повалення фашистського режиму силою, сформують соціал-демократичний уряд і спробують утворити конфедерацію з колишніми африканськими колоніями."
 RULE_OPTION_LEFT_OPPOSITION:0 "Ліва опозиція"
 RULE_OPTION_MONARCHIST_HENRIQUE_DESC:0 "ШІ намагатиметься відновити Бразильську імперію, заручившися підтримкою Педру Енрікі як законного спадкоємця на престол. Тоді він намагатиметься завоювати або інтегрувати сусідів Бразилії."
 RULE_OPTION_NOR_STALINIST_AI_DESC:0 "ШІ намагатиметься підвищити популярність комунізму, при цьому наближаючи Норвегію до Радянського Союзу Сталіна або до найбільшої нетроцькістської комуністичної країни, якщо Сталіна буде усунуто."
 RULE_OPTION_ROMANIA:0 "Монархізм: династія Гогенцоллернів"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER:0 "Шлях зрадливого райхскомісаріату"
 RULE_OPTION_SWI_IMPERIAL:0 "Імперський шлях"
 RULE_OPTION_TUR_FASCISM_ALTERNATE_DESC:0 "Февзі Чакмак перетворить §HТуреччину§! на консервативну квазі-фашистську диктатуру і спробує утворити союз із Італією."
