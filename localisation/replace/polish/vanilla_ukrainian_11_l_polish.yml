 USA_civil_war_fired_democrats:0 "Бостонське повстання почалося\n"
 USA_de_regulate_the_banking_sector_desc:0 "Після корекції фінансових ринків, яка є звичайним явищем для економічного циклу, попередній уряд наклав надмірні обмеження на фінансову діяльність. Ці обмеження були продиктовані добрими намірами, але в результаті завдали більшої шкоди, ніж користуватися."
 USA_department_of_defense:0 "Департамент оборони"
 USA_desegregate_the_armed_forces:0 "Десегрегація військових сил"
 USA_destroyer_1_desc:0 "The Clemson Class destroyer continued with many design elements of its immediate predecessor, the Wickes Class. The Clemson had improved sea handling over the Wickes Class and was armed with 4\"/50 caliber main guns, a 3\"/23 caliber AA gun and 12 torpedo tubes. The class was aging and was nearly obsolete, but still comprised the bulk of the US Navy's Destroyer force."
 USA_embargo_USSR_desc:0 "Ми маємо повністю припинити торговельні відносини з Радянським Союзом. Це не тільки створить для Совєтів проблеми у галузі військової економіки, а й доведе переваги нашої економічної моделі."
 USA_indonesian_liberation:0 "Індонезійське визволення"
 USA_intervention_in_europe_desc:0 "Не минуло й кількох десятиліть після закінчення світової війни, як країни Європи знову готуються до конфлікту. Ми мусимо бути готові до вторгнення, якщо ситуація виможе оперативного втручання."
 USA_intervention_mandate_desc:0 "Хоча ми, можливо, вирішили більше брати участь у світових справах, ми все ще мусимо працювати з Конгресом, щоб отримати дозвіл на абиякі військові дії."
