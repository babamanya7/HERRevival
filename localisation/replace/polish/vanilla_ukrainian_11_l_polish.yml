 SOV_intensify_pilot_training_program_ns_tt:0 "$SOV_modify_airforce_ns_intro$\n$MODIFIER_AIR_ACE_GENERATION_CHANCE$: §G+15%§!\n$MODIFIER_AIR_WING_XP_LOSS_WHEN_KILLED_FACTOR$: §G-15%§!\n$MODIFIER_AIR_ACCIDENTS$: §G-25.0%§!\n$MODIFIER_AIR_NIGHT_PENALTY$: §G-10.00%§!\n$MODIFIER_AIR_WEATHER_PENALTY$: §G-15.00%§!\n$MODIFIER_AIR_FUEL_CONSUMPTION_FACTOR$: §R+10.00%§!\n\n"
 SOV_intervention_in_the_americas_desc:0 "Багато малих країн Карибського басейну та Латинської Америки в цілому вже давно страждають від нестабільних урядів. Настав час напружити наші політичні м'язи і «заохотити» їх внутрішньополітичну еволюцію в напрямку сили і стабільності. Як тільки вони створять уряди, подібні до нашого, їм буде запропоновано місце в нашому зростаючому військовому альянсі."
 SOV_kakhovka_dam:0 "Каховська гребля"
 SOV_left_purges_desc:0 "Є багато інших, хто затаїв образу на Сталіна. Поки ми все ще зміцнюємо нашу владу, ми не мусимо дозволити цим людям почати формувати контрреволюційні осередки, щоб не допустити нової громадянської війни в найближчому майбутньому."
 SOV_light_cruiser_3_desc:0 "The Chapayev class (Project 68) cruisers were based on the Kirov class (Project 26) cruisers and authorized in the 1938-43 shipbuilding program. As the first true light cruisers of the Soviet navy, they carried a strong anti-surface and anti-air armament together with an adequate torpedo armament. Overall, these were good ships with a thick armor belt, high speed, a good operational range, and a displacement of 10,500 to 14,000 tons. Due to the war and the invasion of the German forces, many ships of the class were cancelled and the rest were finished after the hostilities ended."
 SOV_lonely_island_desc:0 "Настав час відплатити за образу, яку японці завдали нам у 1905 році. Цього разу ніщо не завадить нам панувати в Японському морі і поставити їх на коліна!"
 SOV_merge_aircraft_plant_3_tt:0 "$SOV_merge_aircraft_plant_intro_tt$$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+5%§!\n$radar_tech_research$: §G+10%§!\n"
 SOV_modern_tank_artillery_equipment_1_short:0 "СУ-152-54"
 SOV_modify_defense_industry_ns_intro:0 "Змінити ідею §Y$SOV_defense_industry_dynamic_modifier$§! на:"
 SOV_new_soviet_man_desc:0 "Нова радянська людина — самовіддана, освічена, дисциплінована і здорова; жива перемога над ницими інстинктами і фальшивою свідомістю. Чоловіки з радістю віддадуть своє життя заради загального блага, а жінки народжуватимуть багато дітей заради майбутнього радянського суспільства."
 SOV_northern_crackdown_timer:0 "Репресії в Північному регіоні"
 SOV_organize_the_wreckers:0 "Організувати шкідників"
 SOV_paranoia_is_medium_level_tt:0 "£SOV_paranoia_text_icon Політична параноя — між [?SOV_paranoia_lower_threshold|Y] і [?SOV_paranoia_higher_threshold|Y]"
 SOV_paranoia_text_tooltip:0 "[GetAppropriateParanoiaTooltip]"
 SOV_pc_of_the_ussr_navy_ns_tt:0 "Отримає ідею §Y[GetAppropriateRedFleetNsName]§!, що дає §g(§!$MODIFIER_INDUSTRIAL_REFIT_IC_COST_FACTOR$: §G-5%§!, $MODIFIER_REPAIR_SPEED_FACTOR$: §G+5%§!§g)§!\n\n"
 SOV_peace_deal_for_hokkaido:0 "Запропонувати мир в обмін на Сахалін, Курили та Хоккайдо"
 SOV_plan_start_of_uprising_omsk_desc:0 "Омськ добре розташований у Західному Сибіру, також межує з Уральським регіоном і Великим степом. Незважаючи на те, що місто дещо недорозвинуте, тут буде відносно легко побудувати хорошу міцну базу для повстання, а потім почати похід на Москву."
 SOV_planned_economy_dynamic_modifier_tt:0 "\nОтримає ідею §Y$SOV_planned_economy_dynamic_modifier$§!, що дає §g(§!$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!, $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!§g)§!\nЗа кожного суб'єкта, який прийме §Y$new_economic_policy$§!, ви отримаєте додатково:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!\n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!\n§g(§!Додаткові бонуси застосовуються до максимуму — $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §Y+10.00%§!, $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §Y-10.00%§!§g)§!\n\n"
 SOV_propaganda_campaign_locked_slot_focus_collectivist_possitive:0 "\n  $SOV_positive_heroism$\n  $SOV_collectivist_propaganda$"
 SOV_propaganda_victory_at_hand_available_tt:0 "[ROOT.GetFlag][ROOT.GetNameDefCap] воює з великою державою, яка зірвала третій п'ятирічний план"
 SOV_reconcile_japan:0 "Примиритися з Японією"
 SOV_reconcile_japan_desc:0 "Основна загроза для нас походитиме з Європи. Ми мусимо вирішити всі невирішені питання з Японією, щоб мати можливість зосередитися на наших західних кордонах і не боятися удару в спину."
 SOV_recover_the_kuril_islands:0 "Повернути Курильські острови"
 SOV_rehabilitated_military_desc_alt:0 "Більшовики надзвичайно ревно стежили за військовими, і яка їм від цього користь? Хоча ми мусимо зберегти фігуру політрука, щоб забезпечити викорінення комуністичних думок, під час війни ми мусимо дозволити військовим офіцерам приймати рішення, виходячи з військової ситуації, а не з політичних міркувань."
 SOV_reinstate_ilyushin_design_bureau_desc:0 "$SOV_reinstate_mig_design_bureau_desc$"
 SOV_reinstate_mig_design_bureau:0 "Відновити конструкторське бюро «МіГ»"
 SOV_research_city_experiment_desc:0 "Один із найвидатніших наших вчених, Курчатов, зазначив, що при розщепленні ядер в кілограмі урану енергія, що виділяється, мусить дорівнювати вибуху 20 000 тонн тротилу. Ми мусимо використати цю енергію раніше за наших ворогів, щоб забезпечити виживання вітчизни."
 SOV_secure_finland:0 "Захопити Фінляндію"
 SOV_send_infantry_equipment_poum_desc:0 "Поставка нових гвинтівок та боєприпасів дозволить нашим іспанським товаришам продовжити війну проти фашизму та контрреволюційної буржуазії."
 SOV_send_ultimatum_to_country_baltic_desc:0 "За допомогою ультиматуму ми будемо тиснути на [FROM.GetAdjective]ий уряд, щоби той пішов назустріч нашим вимогам."
 SOV_sinkiang_military_aid_sik:0 "Військова допомога державі [SIK.GetNameDef]"
 SOV_sp_thermo_nuclear_bomb:0 "РДС-6с"
 SOV_spheres_of_influence_in_china_desc:0 "Останньою точкою розбіжностей між нами залишається ситуація в Китаї. Наші власні інтереси в регіоні обмежені, і якщо ми можемо купити підтримку Японії, домовившись про сфери інтересів, то ми мусимо зробити це без вагань."
 SOV_the_iron_wall_of_russian_resolve:0 "Залізна стіна російської рішучості"
 SOV_the_molotov_line_name_left:0 "Лінія Троцького"
 SOV_the_onslaught_on_colonialism_decision_tt:0 "Відмикає рішення §YОрганізувати п'яту колону§! та §YРозбурхати пролетаріат§! для африканських сусідів."
 SOV_the_right_oppositionvw_desc:0 "Параноїдальне керівництво Сталіна руйнує країну. Його перехід до масової колективізації та жорсткої індустріалізації — ще більше. Треба щось робити, і якнайшвидше. Ті, хто може привести цю країну до слави, загоїти рани, завдані безгосподарністю, і відновити економіку, — це члени правої опозиції на чолі з Бухаріним."
 SOV_third_five_year_plan_available_tt:0 "[ROOT.GetFlag][ROOT.GetNameDefCap] не перебуває у стані війни з великою державою\n§RЦей фокус буде назавжди заблокований, якщо [ROOT.GetNameDef] вступить у війну з великою державою.§!"
 SOV_transformation_of_nature_alt_desc:0 "$SOV_transformation_of_nature_desc$"
 SOV_trigger_third_moscow_trial_tt:0 "Станеться подія §YТретій московський процес§!."
 SOV_westward_bound_desc:0 "Значна частина наших західних володінь була втрачена з розпадом імперії, спричиненим революцією. Настав час розбудовувати нашу інфраструктуру, готуючись до повернення наших законних володінь."
 SOV_women_in_aviation_ns_tt:0 "$SOV_modify_airforce_ns_intro$\n$MODIFIER_AIR_ACE_GENERATION_CHANCE$: §G+25.00%§!\n$MODIFIER_AIR_TRAINING_XP_FACTOR$: §G+5%§!\n$MODIFIER_AIR_MISSION_XP_FACTOR$: §G+5%§!\n$MODIFIER_AIR_WEATHER_PENALTY$: §G-5.00%§!\n\n"
