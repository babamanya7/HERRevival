 SOV_THE_DECLARATION_DESC_EXILES:0 "Сумнозвісна «Декларація» Патріарха Сергія 1927 року присягала на вірність Радянському Союзу, незважаючи на їхні релігійні відмінності. Незважаючи на цей боягузливий вчинок, інфраструктура Російської православної церкви спирається на людей, які підтримали цю Декларацію, і тому у нас немає іншого вибору, окрім як вітати їх назад у лоні Церкви."
