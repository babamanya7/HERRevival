 CHL_nacistas_approaching_ibanez_mission:0 "Нацисти підступають до Карлоса Ібаньєса дель Кампо"
 CHL_news_events.5.a:0 "Що?"
 CHL_political_events.15.t:0 "Битва при Сегуро Обреро"
 CHL_political_events.24.a:0 "Нас обдурили, ударили ножем у спину і, можливо, навіть ошукали..."
 CHL_political_events.36.a:0 "Майбутнє виглядає світлим"
 CHL_political_events.47.desc:0 "[CHL.GetName] уклала угоду з [FROM.GetName]. Вони переконали [FROM.GetName], що майбутнє за Віссю. Нам залишається лише підписати їхню згоду."
 CHL_political_events.48.desc:0 "На жаль, незважаючи на наше емоційне звернення до них, [FROM.GetLeader] та їхній народ вирішили, що їм буде краще без нас, і не вдавалися в подробиці, чому вони прийняли таке рішення. Ми не возз'єднаємося з [FROM.GetNameDef] наразі."
 CHL_political_events.49.b:0 "Майбутнє лише наше"
 CHL_political_events.54.desc:0 "[FROM.GetAdjective] уряд вперто чіпляється за фальшивий договір Ліми і відмовляється передати нам [947.GetName]. Ми повинні вдатися до демонстрації сили і забрати у них регіон, будь-якими необхідними засобами..."
 CHL_political_events.6.desc:0 "[ARG.GetName] залишається непохитною у своїх позиціях щодо володіння спірним островом і стверджує, що нам доведеться забрати його силою, якщо ми його хочемо. Наш народ згуртувався навколо цієї справи, і політики почали виступати за розпад Аргентинської держави."
 CHL_political_events.64.desc:0 "Диктатор [FROM.GetNameDef], [From.GetLeader], мав нахабство здійснити великий напад на наші сили на Панамському каналі з найближчих позицій. Їхня операція була успішною, і наші війська відступають у замішанні. [FROM.GetAdjective]s не перетинають наші інші території, тому це не було прелюдією до загального вторгнення, але напад послабив нашу здатність проектувати силу по всьому світу та принизив нас на міжнародній арені."
 CHL_political_events.68.t:0 "[FROM.GetName] відхиляє наші вимоги"
 CHL_political_events.70.desc:0 "Отримавши владу в Чилі через об'єднання під єдиним прапором, багато різних фашистів знову почали практикувати власні ідеї та ідеали, без належного нагляду чи контролю з боку уряду. Настав час нації зробити вибір і вирішити, хто буде керувати, бо лише через сильного лідера апарат виживе! Хто візьме на себе цю роль?"
 CHL_political_events.71.t:0 "Державний переворот генерала Карлоса Ібаньєса дель Кампо"
 CHL_political_events.75.t:0 "[CHL.GetNameDefCap] бажає продати нам Аріку"
 CHL_political_events.99.desc:0 "[GER.GetName] прийняла пропозицію. Це нова ера, керована сильними, і дипломатична перемога для нашого уряду."
 CHL_preparing_another_naval_mutiny_mission:0 "Готується черговий заколот у флоті"
 CHL_promote_immigration_to_chile:0 "$BRA_promote_immigration_to_brazil$"
 CHL_released_itza_flag:0 "Іцу звільнено"
 CHL_reorganized_mexico_flag:0 "Мексику реорганізовано"
 CHL_request_assistance_in_the_war_desc:0 "У світі є багато країн, які б виграли від іще одного дружнього до Європи уряду. Ми мусимо шукати їхню підтримку в перемозі над ворогами нашого уряду."
 CHL_request_foreign_support:0 "Попросити підтримку з-за рубежу"
 CHL_resistance_support_progress_flag:0 "Наразі тренує місцевий спротив"
 CHL_the_latin_american_alliance:0 "Латинський американський альянс"
 CHL_unified_by_will_desc:0 "Амеріндські та полінезійські народи зараз об'єднані нашими антиімперіалістичними зусиллями, але цього недостатньо. Якщо ми хочемо вберегтися від вторгнень європейців на довгі століття, ми мусимо об'єднатися та сформувати одну націю, адже всі наші народи, об'єднані в одне ціле, за нашою волею мати державу, якою не будуть керувати європейці."
 CHL_unite_with_our_brothers_in_hispania_desc:0 "Наші давно втрачені брати в старій Іспанії ідеологічно близькі з нами, але вагаються щодо приєднання до Німеччини у будь-якій війні. Ми могли б стати тим поштовхом, якого вони потребують, щоби нарешті стати частиною німецького альянсу."
