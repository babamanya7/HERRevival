 tsr_manchukuo.19.a:0 "Кляті більшовики..."
 tsr_manchukuo.2.b:0 "Ми ніколи не віддамо нашу територію просто так!"
 turkestan_united_ADJ:0 "Тюркськ"
 uk_india_focus_desc:0 "Стан наших колоній в Індії залишається суперечливим як за кордоном, так і всередині країни, але що б їх не чекало, зміцнення їхнього промислового потенціалу є пріоритетом на сучасному етапі."
 uk_south_africa_focus_desc:0 "Політична ситуація в Південній Африці є нестабільною. Ми не можемо повністю довіряти тому, що вони підтримають наші військові зусилля, але, допомагаючи їм у зміцненні їхньої промисловості, ми можемо сподіватися на збільшення підтримки британської справи."
 uk_spain_focus:0 "Примусити Іспанію"
 ultranationalist_coup_desc:0 "Слабкий [From.GetAdjective]ий уряд не заслуговує на нашу підтримку. Потрібно проголосити нову еру для його народу!"
 uncontrolled_exports:0 "Економіка під ембарго"
 united_guiana_fascism_DEF:0 "Гвіанська імперія"
 united_ma_clique_tag_democratic_DEF:0 "Республіка Хуей"
 united_mahgreb_neutrality_ADJ:0 "Магрибськ"
 uruguay_cisplatina_DEF:0 "Сісплатіна"
 us_research_name:0 "Дослідження США"
 usa.11.b:0 "МакАртур — людина миру так само, як і війни."
 usa.18.t:0 "[From.GetName] втручається у війну проти держави [being_attacked.GetName]"
 usa.2.d:0 "Унікальна основа та історія Сполучених Штатів робить наш обов'язок зберігати демократію та свободу у світі. Останнє десятиліття довело, що цю місію неможливо виконати, не взявши зброї проти тих, хто прагне її знищити. Відтепер кожен гнобитель відповідатиме перед нами, а наші збройні сили визволятимуть людей по всій земній кулі."
 usa.20.d:0 "Відстоювання демократії державою [From.GetName] починає впливати на нашу країну. Радіопередачі дозволяють промовам [From.GetLeader] донестись до наших людей, і ми виявили, що багатьох [Root.GetAdjective]их громадян приваблює [From.GetAdjective]ий спосіб життя. [Root.GetName] не є маріонеткою, і ми не дозволимо, щоби наша політика була продиктована державою [From.GetName]. Однак ми не можемо заперечувати вплив [From.GetAdjective]ої політики на нашу країну."
 usa.30.a:0 "Народ висловився."
 usa.31.desc:0 "З приходом нового президента колишня опозиція в Конгресі значною мірою перейшла на підтримку нової адміністрації. Президент [USA.GetLeader] може розраховувати на підтримку [?senators_support] сенаторів і [?representatives_support] представників."
 usa.4.a.tt:0 "Ми отримаємо 43 американські есмінці.\nКанада отримає 7 американських есмінців."
 usa.64.b:0 "У нас є більші проблеми."
 usa.65.desc:0 "До нас надійшла надзвичайна історія від ВПС. Після невдалого бомбардування [GER.GetAdjective]ого військового заводу наш бомбардувальник «Ye Olde Pub» зазнав серйозних пошкоджень, втратив одного члена екіпажу, а решта отримали важкі травми. Екіпаж на чолі з другим лейтенантом Чарлзом «Чарлі» Брауном відмовився покинути літак і залишити тих, хто не міг здійснити безпечну посадку, щоб піти на дно разом з літаком.\n\nКоли літак, що відставав, знову опинився в зоні перехоплення ворожим винищувачем, маючи в своєму розпорядженні лише незначну кількість боєприпасів для самооборони, екіпаж був шокований, побачивши, що винищувач не відкриває вогню. За допомогою жестів і жестикуляції [GER.GetAdjective]ий пілот намагався встановити зв'язок з екіпажем. Незважаючи на великі зусилля з обох сторін, встановити зв'язок не вдалося. Винищувач супроводжував «Ye Olde Pub» за межі [GER.GetAdjective]ого повітряного простору, і коли екіпаж повернув свою єдину залишилася гармату на винищувач, щоб сигналізувати, що вони більше не потребують його підтримки, пілот винищувача віддав честь і повернувся до держави [GER.GetNameDef].\n\nЦя історія вселяє надію, що навіть серед наших супротивників є хороші люди, але поширення цієї історії серед населення та наших військ може мати небажані побічні ефекти."
