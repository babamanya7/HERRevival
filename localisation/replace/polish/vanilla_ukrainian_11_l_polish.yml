 SEA_generic_events.12.c:0 "Відмовитися від коментарів"
 SEA_generic_events.7.a:0 "Організуймо власний мітинг, заснований на їхніх проблемах"
 SEA_imperial_influence_events.110.desc:0 "Армія висунула свої вимоги. Схоже, вони прагнуть розширити свої виробничі можливості та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми побудували більше військових заводів для збільшення випуску продукції. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.240.t:0 "Фракція Флоту вимагає збільшення виробництва авіаносців"
 SEA_imperial_influence_events.500.t:0 "Фракція флоту вимагає удару на південь"
 SEA_japan.1.a:0 "Покладіть край цьому фарсу, негайно!"
 SEA_japan_foreign_policy.114.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] влаштував ганебну виставу і показав нам, наскільки затьмареним і зіпсованим є західне мислення. Ми зробили їм пропозицію, від якої вони не могли відмовитися і яка зробила б Азію кращим місцем, але вони якимось чином знайшли спосіб. Сьогодні похмурий день для нашого альянсу."
 SEA_japan_foreign_policy.120.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися до нас"
 SEA_japan_foreign_policy.130.t:0 "[FROM.GetLeader] відхиляє наші вимоги"
 SEA_japan_foreign_policy.141.t:0 "[JAP.GetLeader] Rejects our Proposal"
 SEA_japan_foreign_policy.50.a:0 "Ми змушені змиритися з ситуацією"
 SEA_japan_foreign_policy.58.t:0 "[FROM.GetNameDefCap] передає китайські регіони"
 SEA_japan_foreign_policy.64.a:0 "Ми розуміємо, чому вони погодилися"
 SEA_japan_foreign_policy.66.a:0 "Процвітання вже близько!"
 SEA_japan_news_events.02.desc:0 "\nЗ проголошеними цілями забезпечення економічної самодостатності та співпраці між країнами-членами, а також протистояння впливу західного імперіалізму та радянського комунізму, [JAP.GetLeader] сьогодні оголосив про заснування Дай Тоа Кьоейкен. Чи є це справжньою метою союзу, чи просто ще одним хитрим ходом [JAP.GetAdjective]ої пропагандистської машини — це питання, яке зараз найбільше хвилює всіх."
 SEA_japan_popup_events.26.t:0 "Державний переворот Квантунської армії"
 SEA_japan_popup_events.37.a:0 "Дозволити їм продовжувати"
 SEA_japan_popup_events.50.a:0 "Дуже добре, якщо вони хочуть такого прем'єр-міністра..."
 SEA_japan_tokko_arrest_events.5.desc:0 "Спеціальна вища поліція Йокогами заарештувала майже три десятки інтелектуалів за звинуваченням у спробі відродити Комуністичну партію, яка раніше була примусово розпущена Токко. Серед підозрюваних — редактори журналів «Тюо Корон», «Кайдзо» та «Ніппон Хьорон». Схоже, наші правоохоронні органи добре справляються із захистом душі нашої нації від цієї духовної загрози."
 SEA_japan_tokko_arrest_events.6.desc:0 "Накано Сейго, засновника та лідера ультраправої політичної партії «Тохокай», було заарештовано. Це сталося після того, як партія нібито не змогла продовжувати свою законну діяльність через репресії, і, схоже, вони планували вдатися до незаконних прямих дій через сприйняття «політичних репресій» з боку нашого Кабінету. Як безчесно!"
 SEA_japan_tokko_arrest_events.8.desc:0 "Багато співробітників Відділу розслідувань Південно-Маньчжурської залізниці були заарештовані вже двічі військовою поліцією Квантунської армії; їх утримують за підозрою в поширенні антияпонської та комуністичної пропаганди. [JAP.GetNameDefCap] доручив нам розібратися з ситуацією належним чином, але не втручатиметься безпосередньо. Як слід вирішити цю ситуацію?"
 SEA_warlords.1.a:0 "[ROOT.GetNameDefCap] виконав своє призначення."
 SEA_warlords.14.desc:0 "$wtt_political_warlord_support.10.desc$"
 SEA_warlords.17.b:0 "Неприйнятно."
 SEA_warlords.18.desc:0 "$wtt_political_warlord_support.3.desc$"
 SEA_warlords.2.b:0 "Що ж."
 SEA_warlords.36.t:0 "Дезертирство і зрадник"
 SEA_warlords.49.desc:0 "З посиленням тиску з боку наших політичних опонентів та падінням бойового духу серед наших військ стає зрозуміло, що ми повинні припинити нашу безплідну боротьбу і звернути увагу на більші загрози, що нависли на сході. День втрачено, сили [GDC.GetLeader] поки що продовжуватимуть окупувати південні частини Китаю."
 SEA_warlords.68.desc:0 "Фен Юйсян та його солдати, колись вірні Гоміньцзюню — організації, яка свого часу повстала проти нас і приєдналася знову після того, як ми їх розбили, — тепер переходять на бік [FROM.GetNameDef], оскільки [FROM.GetLeader] оголосив про відродження цієї військової організації."
