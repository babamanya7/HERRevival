 XSM_the_military_governor_desc:0 "Хоча нашу країну номінально очолює Ма Лінь, цивільний губернатор Цінхаю, військовий губернатор і племінник Ма Ліня, Ма Буфан, вже деякий час змагається за повний контроль над провінцією. Чи вдасться йому усунути свого дядька, поки невідомо, але за допомогою певних маневрів це, безумовно, можливо."
