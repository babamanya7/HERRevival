 GRE_force_the_farmers_into_factories_desc:0 "Населення в масі своїй дотримується чудової думки, що можна до кінця своїх днів працювати на фермах і не постраждати в майбутньому конфлікті. Це не так. Нам зараз залишається лише реквізувати ферми та насильно переселяти фермерів у міста, щоби ті могли займатися роботою, яка безпосередньо приносить користь державі."
 GRE_gnaf_organization:0 "$gnaf$"
 GRE_italian_influence_shunned_tt:0 "Якщо ганити §Y[FROM.GetAdjective]ий§! вплив після того, як ми скористались їх щедрістю, це може стати приводом до §Yвійни§!!\n"
 GRE_light_cruiser_1_desc:0 "The Elli was a light cruiser built by the U.S. in 1914. It was originally intended for the Chinese Navy, but was eventually delivered to Greece. It was small for a cruiser, displacing only 2,600 tons. It had two 152mm/45 caliber guns as its main armament. The ship served during World War II and was sunk by an Italian sub prior to the Axis invasion of Greece."
 GRE_lignite_liquefaction_desc:0 "Наша країна багата на лігнітові шахти, і ми вже знаємо, як перетворювати лігніт на пальне. Уряду слід заохотити відкриття нових комплексів зі зрідження лігніту."
