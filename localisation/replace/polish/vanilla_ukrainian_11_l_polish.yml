 IRQ_kurdistan_tag_democratic:0 "Курдистан"
 IRQ_local_arms_industry_desc:0 "Якщо спалахне війна, ми не зможемо залежати від постачання військового обладнання з-за кордону. Таким чином, ми повинні швидко створити власну внутрішню збройову промисловість, щоб підтримати наші сили у час кризи."
