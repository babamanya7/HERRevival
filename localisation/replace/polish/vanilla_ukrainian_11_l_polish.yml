 sp_aip_engine_advanced_tech:0 "Високошвидкісні двигуни Walter"
 sp_air_axial_jet_engine_desc:0 "Перші розроблені реактивні двигуни можуть стискати повітря лише до певної міри. Можливо, можна буде встановити кілька компресорів послідовно, щоб іще більше збільшити тягу."
