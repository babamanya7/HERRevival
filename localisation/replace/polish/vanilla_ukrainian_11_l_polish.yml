 MAN_tsr_raise_the_yong_ying_desc:0 "Юн Ін, буквально «Табори сміливців», були свого роду регіональною армією в імперії Цін. Вони складалися з місцевих ополченців і, на відміну від регулярної армії, фінансувалися на місцях. Ці ополчення часто служили цілям місцевої самооборони в провінціях і дуже добре нам послужили. Ми повинні прагнути відновити цю систему, але пристосувати її до умов сучасної війни."
