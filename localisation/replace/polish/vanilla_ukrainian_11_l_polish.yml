 SOV_heavy_tank_equipment_3:0 "ИС"
 SOV_ignite_revolutionary_uprisings_desc:0 "[FROM.GetAdjectiveCap]і робітники вже почали демонструвати своє невдоволення партією [FROM.GetRulingParty] та її буржуазною політикою. Настав час просувати комуністичну ідеологію серед [FROM.GetAdjective]ого робітничого класу."
 SOV_ignite_uprising_timer_mission:0 "Насувається революційне повстання"
