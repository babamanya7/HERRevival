 PER_ssb_events.8.a:0 "Сподіваємось, це не переросте у повний крах пакту..."
 PER_strengthen_iranian_parliament_tt:0 "\n\n§RЯкщо демократична партія має менше 30% підтримки, шах розпочне проти нас громадянську війну!§! \n\n§RЯкщо спалахне громадянська війна, ви не зможете повністю здійснити Ісламську революцію.§!"
 PER_trial_fifty_three_desc:0 "Комуністичні політичні організації створюють проблеми в нашому процесі забезпечення правління Пехлеві в [PER.GetNameDef]. Ми не можемо дозволити цим антимонархічним настроям назрівати та потенційно призвести до масових демонстрацій. Натомість ми повинні віддати цих дисидентів під суд і дозволити трибуналу вирішити їхню долю."
 PER_we_will_survive:0 "Ми виживемо"
 PER_white_peace_tt:0 "Надішле нашим ворогам §Yподію§!, що вимагає §Yбілого миру§!, дозволяючи нам §Yзберегти наші попередні території§!."
