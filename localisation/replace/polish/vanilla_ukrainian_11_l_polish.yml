 RULE_ALLOW_LEND_LEASE_FREE_DESC:0 "Держави можуть постачати озброєння за ленд-лізом куди завгодно при будь-якому рівні світової напруженості."
 RULE_ALLOW_WARGOALS_LIMITED_DESC:0 "Виправдання цілей війни обмежене ідеологіями та світовою напруженістю."
 RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC:0 "§HІталійський§! ШІ намагатиметься усунути Муссоліні від влади й натомість привести до влади Діно Гранді, щоби той спробував зміцнити зв'язки з Союзниками."
 RULE_BERMONDT_POL_AI_DESC:0 "§HПольський§! ШІ коронує Павла Бермондта-Авалова та спробує приєднатися до Осі."
 RULE_FASCISM_BRA_AI_DESC:0 "Інтегралістський рух зрадить Варгаса та встановить лідером одного зі своїх членів. Тоді він намагатиметься запанувати Південною Америкою шляхом дипломатії та сили."
 RULE_HISTORICAL_CHL_AI_DESC:0 "Чилійський ШІ зміцнить демократичну систему та вирішить підтримати соціал-демократичну політику, водночас зберігаючи рівновагу сил, і приєднається до світової війни тільки якщо вона затягнеться."
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC:0 "§HФранцузький§! ШІ намагатиметься відновити французьку монархію та посадити претендента-орлеаніста на трон, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_4:0 "4 рівень"
