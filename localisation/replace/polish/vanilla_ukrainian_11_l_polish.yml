 IS_ATWAR:0 "У стані війни"
 ITA_SH_battleship_1_desc:0 "Клас «Regina Margherita» — це гіпотетичний клас важких лінкорів, які були б спущені на воду незадовго до початку війни. Їх можна було би порівняти з японськими лінкорами класу «Yamato». Вони були б дуже добре броньовані, водотоннажністю близько 60 000 тонн і озброєні 406-мм гарматами."
 ITA_autonomy_collaboration_government_DEF:0 "$OVERLORDADJ$а $NONIDEOLOGY$"
