 ROM_exploit_the_baita_mines_desc:0 "Починає ставати очевидним, що уран має життєво важливе значення для деяких із найбільш різких технологічних досягнень у зброї з моменту винаходу вогнепальної зброї. Нам пощастило мати велике родовище речовини в межах наших кордонів, і ми мусимо створити шахту для його розробки."
