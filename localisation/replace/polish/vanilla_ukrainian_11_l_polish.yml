 MUN_czech.1009.b:0 "Ми приєднаємося після визнання наших претензій"
 MUN_czech.1010.d:0 "Після недавньої спроби перетворити угоди Малої Антанти на справжній альянс [FROM.GetNameDef] виступила з пропозицією: вони хочуть, щоб ми очолили цю нову фракцію. Вони поступляться лідерством і натомість отримають у нашій особі цінного захисника — угода, яка розширить нашу сферу впливу, але потенційно за рахунок країн, що перебувають під загрозою."
 MUN_czech.1012.d:0 "Підбадьорена своїм новоствореним альянсом, [FROM.GetNameDef] висунула низку вимог, що рівнозначно втраті нашого суверенітету. Враховуючи підтримку з боку [SOV.GetName] через його інтерес до регіону, ми маємо зараз вирішити, чи можемо дозволити собі відмовити."
 MUN_czech.1026.france_refuses_to_lead:0 "Незважаючи на керівну роль, яка була запропонована [FROM.GetAdjective]ій стороні в обмін на приєднання до нашого союзу, вони вирішили цього не робити. Здається, [FROM.GetNameDef] намагається зберегти нейтралітет або вичікує слушного моменту."
