 IRQ_BLITZKRIEG_DESC:0 "Останніми роками Ірак опинився в періоді зростаючого безладу. Переворот 1936 року на чолі з Бакром Сідкі похитнув крихку владу Гашімітської монархії і створив небезпечний прецедент військового втручання в політику. Під поверхнею тліє напруженість між племінними вождями, які чинять опір централізації, реформаторами, що прагнуть модернізації, і невгамовними військовими, підбадьореними новознайденою владою. Панарабський націоналізм зростає, кидаючи виклик британському впливу і підживлюючи мрії про регіональну єдність. У той час як світ стає все більш нестабільним, Ірак стоїть на роздоріжжі, його майбутнє невизначене, а народ розділений."
 IRQ_ensure_sunni_dominance:0 "Ensure Sunni Dominance"
 IRQ_expand_membership_desc:0 "Хоча дехто глузував з ідеї нашої федерації, інші з подивом дивилися на наші досягнення. Можливо, настав час розширити членство для тих, хто достатньо мудрий, щоб усвідомити, що разом ми сильніші."
