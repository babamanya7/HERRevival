 DOD_hungary.106.a:0 "Виразити протест найрішучішим чином."
 DOD_hungary.108.a:0 "Відмінно."
 DOD_hungary.122.t:0 "Чехословаччина не приймає нашу пропозицію"
 DOD_hungary.143.desc:0 "[From.GetAdjectiveCap]ий посол передав нам таку заяву: \n«[From.GetNameDef] висловлює глибоке занепокоєння останніми подіями, в центрі яких знаходиться [HUN.GetNameDef]. Тріанонський договір є гарантією миру та стабільності регіону. [From.GetAdjectiveCap]ий уряд переконаний, що всі нації мають право на самовизначення, але ми рішуче закликаємо владу держави [HUN.GetNameDef] дотримуватися умов цього договору. Подальша дестабілізація ситуації в регіоні може призвести до непоправних наслідків»."
 DOD_hungary.21.t:0 "Швеція відмовилася допомогти"
 DOD_hungary.22.t:0 "Швеція направила допомогу"
 DOD_hungary.23.a:0 "Чи встигнуть вони прибути сюди вчасно?"
 DOD_hungary.45.a:0 "Ми мусимо завдати удару, поки не пізно."
 DOD_hungary.54.desc:0 "У відповідь на наші військові приготування, [ROM.GetLeader] підписує Загальне розпорядження Nº 1 про приведення румунської армії в бойову готовність. [ROM.GetAdjectiveCap]і льотчики зайняли свої бойові пости, їх винищувачі відпрацьовують маневри у навчальних боях із застосуванням наших літаків [ROM.GetAdjectiveCap]ий посол зажадав свій паспорт, кулі поки що не свистять, але згодом ця криза неминуче обернеться війною. Якщо ми хочемо вирішити ситуацію силою, не можна зволікати з атакою."
 DOD_hungary.71.a:0 "Віддати Трансільванію цілком Угорщини."
 DOD_romania.113.a:0 "Час переглянути наш підхід."
 DOD_romania.162.a:0 "До зброї!"
 DOD_romania.3.t:0 "[From.GetNameDefCap] відхиляє пропозицію про альянс"
 DOD_romania.52.a:0 "Це прийнятний компроміс."
 DOD_romania.71.desc:0 "Югославська армія зайняла позиції вздовж нашого кордону, а частини Югославських ВПС прибули до місць дислокації і, схоже, готові до бою. \n\nОднак наше джерело в югославському міністерстві оборони стверджує, що це лише жест демонстративної непокори — [YUG.GetLeader] твердо впевнений у тому, що ми блефуємо і що жодної війни не буде."
 DOD_yugoslavia.10.b:0 "Насправді, вони мають рацію..."
 DOD_yugoslavia.19.desc:0 "Зійшовши на трон набагато дочасно через світовий конфлікт, що спалахнув, король [Root.GetLeader] нарешті подорослішав і показав себе мудрим і вмілим лідером. Тепер, коли на троні є законний спадкоємець правильного віку, народ держави [YUG.GetNameDef] знайшов символ своєї національної ідентичності, навколо якого можна об'єднуватись і за який варто боротися."
 DOD_yugoslavia.20.d:0 "Перейти на виробництво винищувачів, щоб виконати їх замовлення."
 DOD_yugoslavia.40.a:0 "Надіслати їм звістку."
 DOD_yugoslavia.45.a:0 "Ми мусимо зробити вибір."
