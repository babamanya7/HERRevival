 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_JOIN_ALLY:0 "\nПопри те, що їм вочевидь потрібна наша допомога, держава §Y$COUNTRY$§! §Rвідхилила§! нашу пропозицію приєднатися до їхньої війни."
