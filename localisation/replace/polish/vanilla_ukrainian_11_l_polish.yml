 germany.104.a:0 "Припускаю, вони можуть забрати Савою."
 germany.118.c:0 "Ми мусимо дотримуватися плану Моргентау."
 germany.26.d:0 "Німеччина та Китай знаходяться у стані війни, тож китайці затримали німецьких військових радників, що займалися реформуванням їхньої армії. Фон Фалькенгаузен та декотрі близькі до нього офіцери змогли уникнути арешту і тепер повертаються в Європу."
 germany.42.d:0 "Недавно були висунуті вимоги німців до Чехословаччини про передачу Судетської області, де проживає помітна кількість етнічних німців. [GER.GetLeader] розмістив війська на чехословацькому кордоні, готуючись до війни. Зараз у Мюнхені проводяться переговори між Британією, Францією, Італією та Німеччиною для досягнення мирного закінчення Судетської кризи.\n\nБританці відмовилися поступитися, а натомість погрожують Німеччині війною, якщо вона порушить кордони з Чехословаччиною. Схоже, війна тепер неминуча."
 germany.45.a:0 "Хай живе Франція!"
 germany.53.a:0 "Здатися німцям."
 germany.56.t:0 "Розподіл Чехословаччини"
 germany.63.a:0 "Так! Із Німеччиною треба розквитатися зараз."
 germany.68.a:0 "Мабуть, це було неминучо."
 germany.80.b:0 "Ми не віддамо того, що праву наше, за вкрадені землі!"
 germany.83.a:0 "Ми станемо на бік Німеччини та її союзників проти СРСР."
 germany.91.t:0 "Франція бажає приєднатися до альянсу"
 germany.99.d:0 "Коли ми запропонували, що, мабуть, грецькі прикордонні території слід відкоригувати, італійський посол заявив, що вони збудують Римську імперію на руїнах Греції."
