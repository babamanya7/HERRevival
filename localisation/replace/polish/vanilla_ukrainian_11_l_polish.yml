 LIT_events.101.d:0 "З 1920 року Вільно був під контролем держави [Root.GetNameDef] — до постійного невдоволення держави [LIT.GetNameDef], яка вважає місто легітимною столицею своєї нації. Тепер напруга досягла апогею, і литовці, яким допомогли не хто інший, як [SOV.GetLeader], вимагають розділити Східну Польщу між [SOV.GetAdjective] державою та Литвою. LIT.GetAdjective] коаліції."
 LIT_events.104.d:0 "Незважаючи на те, що всі шанси не на його користь, держава [POL.GetNameDef] відмовляється підкорятися нашим вимогам!"
