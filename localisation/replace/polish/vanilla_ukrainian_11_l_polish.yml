 CHI_reinstate_the_inter_party_coordination_council:0 "Відновити Міжпартійну координаційну раду"
 CHI_revive_the_western_hills_group_desc:0 "[ROOT.GetNameDefCap] занадто довго перебував під впливом іноземних сил. Потрібне повернення до традицій — лінії, якої дотримувалися Лінь Сень і Дай Цзітао. Це дозволило б нам реалізувати ідеї доктора Суня так, як вони були задумані, без викривлень."
