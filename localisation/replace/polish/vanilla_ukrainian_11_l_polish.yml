 POR_annex_wargoal:0 "Анексія"
 POR_brazil_supports_monarchism_flag:0 "Бразилія підтримує монархізм"
 POR_british_light_cruiser_construction_progress:0 "Поступ збірки [ENG.GetAdjective]ого легкого крейсера"
 POR_expand_the_chinese_territories_desc:0 "Тепер, коли азійські країни ослаблені війною, настав час для нас розширити нашу територію від Макао до Китаю. Змучені китайські та японські армії не зрівняються з нами!"
 POR_fight_alongside_the_nationalists:0 "Приєднатися на боці націоналістів"
 POR_gw_tank_equipment:0 "Carro de Combate A"
 POR_infrastructure_in_angola_desc:0 "Ангола має багато незвіданих багатств. Ми повинні розвивати інфраструктуру в регіоні, щоб використовувати його ресурси в майбутньому."
 POR_instituto_superior_tecnico:0 "Instituto Superior Técnico"
 POR_latin_america_desc:0 "Тепер, коли наша імперія консолідована, ми можемо подивитися на території, що оточують наші американські володіння, і повернути собі землі, які колись володіли Бразильською імперією."
