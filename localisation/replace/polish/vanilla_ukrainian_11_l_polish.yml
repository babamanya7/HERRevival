 PRC_aggressive_pursuit_of_diplomacy_desc:0 "Хоча ми хотіли б вдатися до більш цивілізованих форм дипломатії, іноді загроза насильства — це те, що потрібно, аби наша воля перемогла. А якщо погроза не спрацює..."
