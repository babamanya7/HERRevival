 AFG_a_royal_successor_decision:0 "Королівський наступник"
 AFG_ally_the_sikhs_desc:0 "Сикхи — важлива релігійна меншина на Індійському субконтиненті та відважні воїни. Ми повинні використати їхню допомогу для завоювання регіону для себе."
 AFG_central_asia_democratic_ADJ:0 "Центральноазійськ"
 AFG_central_asia_democratic_DEF:0 "Федеративні Республіки Центральної Азії"
 AFG_chromite_mines_desc:0 "Хром стає все більш затребуваним ресурсом у промислово розвиненому світі. Ми повинні розпочати видобуток власних хромітових ресурсів для експорту, а потім використовувати отримане багатство для продовження нашої власної програми індустріалізації."
 AFG_contact_rural_loyalists_tt:0 "§YБільше дивізій пуштунського ополчення приєднається до нашого боку у майбутній громадянській війні.§!"
 AFG_crackdown_on_dissent:0 "Придушити інакомислення в §Y[FROM.GetName]§!"
 AFG_cross_border_ties:0 "Транскордонні зв'язки"
 AFG_cross_border_ties_category_desc:0 "$AFG_cross_border_ties_desc$"
 AFG_demand_end_to_communist_influence:0 "Вимагати припинення комуністичного впливу в Афганістані"
 AFG_education_for_women_and_girls:0 "Освіта для жінок та дівчат"
 AFG_enforce_western_attire_desc:0 "Король та його найближче оточення незадоволені традиційним одягом, якого дотримується більшість населення. Вони вважають це ознакою застарілого суспільства і тому бажають замовити текстильну фабрику та нові закони для запровадження західного одягу."
 AFG_expand_the_madrasas:0 "Розширити медресе"
 AFG_exploit_turko_persian_heritage_tt:0 "Відмикає рішення §Y$AFG_turko_persian_heritage_category$§! для запрошення націй до нашої фракції або отримання цілей війни проти них."
 AFG_industrial_events.21.t:0 "[FROM.GetAdjectiveCap]ий уряд оголошує про інвестиції"
 AFG_industrial_events.32.desc:0 "Уряд [FROM.GetNameDefCap] запропонував укласти договір про воду між нашими націями для регулювання кількості води, яку вони можуть використовувати для іригаційних проєктів, одночасно гарантуючи мінімальний потік води через кордон до нас. Хоча пропозиції здаються розумними, ймовірно, це вимагатиме від нас погодитися на певну втрату потоку порівняно з тим, що ми мали історично."
 AFG_industrial_events.35.desc:0 "[FROM.GetNameDefCap] відмовився прийняти будь-який договір і натомість вимагає повного скасування будь-яких проєктів уздовж річки Гільменд, які зменшують її потік до них. Схоже, вони готові застосувати силу, якщо ми відмовимося."
 AFG_industrial_events.40.desc:0 "Наші зусилля з розширення вищої освіти призвели до негативної реакції з боку нових випускників, які виявляються нездатними знайти роботу, яка б відповідала їхнім навичкам. Це призвело до розчарування серед випускників, які тепер звертаються до радикальної політики, щоб висловити своє невдоволення."
 AFG_invite_foreign_corporations_desc:0 "Ми продовжуємо відставати в промисловості порівняно з іншими націями, побічним ефектом цього є невелика внутрішня виробництво зброї. Щоб змінити це та модернізувати нашу промисловість, ми запросимо корпорації з усього світу відкрити тут свою діяльність."
 AFG_khorasan_democratic_DEF:0 "Республіка Хорасан"
 AFG_khyber_pass_rifling_org:0 "Зброярі Хайберського проходу"
 AFG_new_army_desc:0 "Хоча залишається опір нашим військовим реформам з боку сільського населення, ми повинні рухатися вперед та запровадити широкомасштабну програму підготовки для останнього призову."
 AFG_occupy_waziristan_tt:0 "§RЦе може призвести до війни з власником [987.GetName]!§!"
 AFG_political_events.100.t:0 "Буферна держава Хорасан"
 AFG_political_events.132.desc:0 "Уряд [FROM.GetAdjective] відхилив нашу пропозицію про створення конфедерації. Це величезна зовнішньополітична невдача для нас і викликало тривогу щодо того, якими будуть наші довгострокові стосунки з [FROM.GetNameDef]."
 AFG_political_events.60.desc:0 "Уряд [FROM.GetNameDef] створює нове політичне утворення, яке вони називають Тюрко-Перським союзом. Схоже, що це використання їхньої тюркської та перської спадщини для об'єднання всіх наших народів під одним урядом. Першим кроком до цього є створення військового альянсу між нами. Якщо ми погодимося, безсумнівно, з часом вони будуть наполягати на більшій інтеграції під їхнім керівництвом."
 AFG_proclaim_a_new_caliphate_tt:0 "Отримує ціль війни §YЗахопити заявлену область§! проти кожної країни, що окупує області, на які цей фокус дає вам претензії"
 AFG_reinforce_the_royal_guard_tt:0 "Відмикає рішення §Y$AFG_shadows_of_the_emir_category$§! для придушення інакомислення та підвищення стабільності."
 AFG_reintroduce_heavy_cavalry_desc:0 "Наші предки неодноразово в'їжджали на конях у рівнини Індії та Центральної Азії, захоплюючи землі та ресурси, коли їхні правителі були слабкими. Оскільки наші сусіди втягуються у конфлікт, можливо, наближається ще один такий момент."
 AFG_republic_of_afghanistan_tt:0 "§YМи зможемо обрати нову ідентичність для нашої нації, яка може змінити те, що вважається нашими осердними областями, або може додати нові ідеї.§!"
 AFG_research_bonus_1:0 "Розвивати власну військово-морську промисловість"
 AFG_resistance_active_here:0 "Осередок опору створено тут"
 AFG_revive_the_workshop_of_the_world_desc:0 "Ми наслідуватимемо наших предків, модернізувавши наші фабрики та відродивши наші торговельні шляхи. Ця трансформація утвердить нашу економіку як центр сили, конкурентоспроможний з великими націями світу."
 AFG_secure_iran:0 "Захистити Іран"
