 PAR_by_all_means_which_to_win_desc:0 "Доки війна не закінчиться, нам потрібно, щоб уся економіка була зосереджена на поточному конфлікті. Населення постраждає в результаті, але якщо ми програємо війну, їм буде ще гірше під ярмом комуністів..."
 PAR_discipline_hierarchy_and_order:0 "Дисципліна, ієрархія та порядок"
 PAR_ensure_army_loyalty_desc:0 "Невдоволення зростає, і люди чинять масовий опір та загальні страйки. Щоб уникнути такого ж перевороту, як у нашого попередника, військові отримають значну частину ВВП нашої країни."
