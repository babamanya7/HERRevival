 SPA_extremadura_offensive:0 "Наступ в Естремадурі"
 SPA_garrison_control_nationalists_strong_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Yсильний§!\nКількість дивізій на початку громадянської війни: §Y2§! націоналістичні — §Y1§! республіканська§!\n"
 SPA_heavy_cruiser_2:0 "Клас «Canarias»"
