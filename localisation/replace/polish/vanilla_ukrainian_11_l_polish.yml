 sp_naval_anechoic_tiles_unique_reward_a_desc:0 "Під час розробки протигідролокаційного покриття ми з'ясували, що отримані знання можна застосувати у будівництві звичайних підводних човнів для посилення скритності або для деякого заощадження коштів зі збереженням поточного рівня помітності."
