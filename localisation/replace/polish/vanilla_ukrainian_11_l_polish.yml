 BEL_air_doctrine_desc:0 "Сучасна війна постійно змінюється та еволюціонує. Ми повинні профінансувати дослідження поточних доктрин, що використовуються іншими військовими силами, і подивитись, які уроки можна взяти і застосувати для нашої авіації."
 BEL_belgian_maginot_available_tt:0 "Контролює і може побудувати щонайменше §Y3 наземних укріплень§! в провінціях §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! або §Y[977.GetName]§! на §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! кордоні."
 BEL_belgian_maginot_desc:0 "Бельгія є буферною державою між двома могутніми військовими націями і протягом своєї історії була під загрозою з боку обох. Тому ми стали майстрами оборонної війни. Французька лінія Магіно досягає нашого кордону, і нам потрібно продовжити її для захисту нашої власної нації. Якщо ми зробимо себе нездоланними, нас навіть не атакують."
