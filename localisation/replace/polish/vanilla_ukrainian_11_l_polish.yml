 SOV_aviation_cult_desc:0 "Радянський Союз вразить світ приголомшливими авіаційними подвигами. Наші героїчні пілоти — лицарі більшовицької культури і прогресу, що демонструють нашу технологічну перевагу над природою. Як далеко ми просунулися з часів царя!"
