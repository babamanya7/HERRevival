 HUN_artillery_equipment_3:0 "21cm 40M Nehéz Tarack"
 HUN_artillery_equipment_3_short:0 "21cm 40M"
 HUN_created_bohemian_monarchy:0 "Альбрехт Франц на богемському троні"
 HUN_created_georgian_monarchy:0 "Георгій Багратіон-Мухранський на грузинському трон"
 HUN_ferenc_szombathelyi_becomes_a_general:0 "§YФеренц Сомбатгейї§! стане доступним як генерал рівня 3"
 HUN_indigenous_designs_desc:0 "Наш рівень технічного розвитку адекватно відповідає нашим потребам. Контроль над конструкторськими бюро дозволяє управляти потоками ресурсів, збільшуючи швидкість розробки нових проєктів."
 HUN_kingdom_of_hun_and_rom_fascism_DEF:0 "Легіонерський союз Угорщини та Румунії"
 HUN_light_infantry_divisions_doctrine_tech_tt:0 "Відкриє доступ до: §HДоктрина легких піхотних дивізій§!\n§HПіхота\n    Ліс§!\n      Атака: §G+2%§!\n      Рух: §G+5%§!\n    §HМісто§!\n      Атака: §G+5%§!\n      Рух: §G+5%§!\n"
 HUN_light_infantry_tech_desc:0 "Зниження частки допоміжних з'єднань дозволить нам зробити піхотні дивізії більш гнучкими та підвищити їх ефективність на складному рельєфі місцевості — у лісах та містах."
 HUN_light_tank_artillery_equipment_2_short:0 "Toldi Rohamlöveg"
 HUN_mobile_corps_doctrine:0 "Доктрина мобільних корпусів"
 HUN_place_a_habsburg_on_the_lombardo_venetian_throne:0 "Посадити Габсбурга на ломбардо-венеціанський трон"
 HUN_place_a_habsburg_on_the_ukrainian_throne_decision:0 "Встановити королівство Україна"
 HUN_reaffirm_territorial_claims:0 "Підтвердити територіальні претензії"
 HUN_reclaim_the_empire_desc:0 "Щоб остаточно оформити наші територіальні претензії, ми маємо заявити про права нашого монарха-Габсбурга на різні титули у Німеччині, Італії та Палестині."
 HUN_refused_alliance:0 "Відхилили альянс"
 HUN_soviet_hungarian_military_academy_desc:0 "Без компетентного командування армія нічого не варта. У радянців набагато більше досвіду у військовій справі, а тому, можливо, варто домовитися з ними про навчання наших військових кадрів. Для цього ми створимо спільний військовий навчальний заклад із досвідченими викладачами з обох держав."
 HUN_sweden_hungary_unified:0 "Угро-Швеція"
 HUN_synthetic_oil_tt:0 "Додає нафтопереробний завод у випадково обраному регіоні. Його місцезнаходження відобразиться, коли вчені доведуть ефективність виробництва синтетичного пального.\n"
 HUN_the_empire_category_desc:0 "Щоб відновити імперію та повернути їй колишню славу, ми повинні покращити та розширити ідею федерації далі."
 HUN_volksbund_militia_recruitment_tt:0 "Отримати чотири підрозділи §Yополчення Фольксбунду§!"
 HUN_war_games:0 "Військові вчення"
 ICE_an_airbase_in_the_sea:0 "Авіабаза в морі"
 ICE_an_airbase_in_the_sea_desc:0 "Домінуючи в небі над островом і навколишнім морем, ми можемо гарантувати, що жоден ворог не зможе висадитися тут силою. І навіть якщо це станеться, військово-повітряні сили можуть гарантувати, що ворог завжди буде відчувати нестачу необхідних припасів. Таким чином, природним шляхом розбудови збройних сил Ісландії є створення сучасних військово-повітряних сил."
 ICE_emergency_conversions_tt:0 "Відкриває §Yрішення§! конвертувати §Yконвої§! у §Yесмінці§! або §Yкрейсери§!"
 ICE_fighting_as_equals:0 "Боротьба на рівних"
 ICE_prepare_for_the_revolution:0 "Підготуватися до революції"
 ICE_prepare_for_the_revolution_desc:0 "Успішна революція не відбувається сама по собі. До неї потрібно ретельно готуватися. Насіння має бути посаджене і полите. Люди повинні знати, коли піднятися, а революціонери повинні вести їх до цього. Потрібно надрукувати плакати. Професійні революціонери повинні бути завербовані і навчені, зброя належним чином схована, а лідери повинні бути готові взяти владу в свої руки."
 ICE_the_kingdom_of_iceland_desc:0 "Ця країна пройшла довгий шлях до незалежності. Створення Королівства слід розглядати як останній крок до свободи. Зараз ми поділяємо з Данією лише короля та зовнішню політику. Поступово цей зв'язок може розмитися і перетворитися на формальність."
 ICE_the_merchant_fleet_desc:0 "Кораблі колись були ключовою частиною створення цієї нації. Кораблі будуть частиною майбутнього. Сильний торговельний флот стане основою майбутньої ісландської економіки."
 ICE_uprising_scotland_tt:0 "§Y[121.owner.GetName]§!: Понад [?ICE.communism_support_needed|%Y0] підтримки партії [121.owner.GetCommunistParty]"
 IMO_fascism_party:0 "IRF"
 IMPORTED_FILM_INDUSTRY_DESC:0 "Наші благодійники та союзники стратегічно використовують пропагандистські фільми. З невеликими інвестиціями, ми зможемо показувати ці картини в нашій країні для того, щоби розворушити військові зусилля серед нашого народу."
