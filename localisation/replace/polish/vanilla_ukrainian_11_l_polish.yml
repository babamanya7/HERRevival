 INS_loyalist_events.28.b:0 "Про це не може бути й мови."
 INS_loyalist_events.28.desc:0 "[FROM.GetNameDefCap] офіційно попросили, щоб ми дозволили провести референдум у [PHI.GetName] з питання об'єднання. Їхні дипломати наголошують на спільному австронезійському походженні обох народів і штучному характері колоніальних кордонів, що їх розділяють. Якщо голосування відбудеться, результат, ймовірно, буде на користь [FROM.GetNameDef]."
 INS_loyalist_events.3.t:0 "[HOL.GetLeader] відмовляється перевести Анрі Вінкельмана"
 INS_loyalist_events.5.t:0 "[FROM.GetNameDefCap] приймає об'єднання"
 INS_militias_basic_summon_desc:0 "Ми залучимо молодь та студентів, які пристрасно прагнуть незалежності Індонезії, приєднатися до TKR у якості озброєного ополчення."
 INS_mixed_economy_system:0 "Система змішаної економіки"
 INS_national_revolution_peace_negotiation:0 "Вести переговори про виведення військ з [FROM.GetName]"
 INS_netherlands_can_remove_autonomy_tt_250:0 "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -250.00§!"
 INS_papua_referendum_decision:0 "$INSHOL_papua_referendum$"
 INS_political_events.2.desc:0 "Новий республіканський уряд у колишній Індії оголосив весь архіпелаг своєю територією. [FROM.GetLeader] надіслав нам офіційну вимогу відмовитися від [721.GetName], погрожуючи військовими діями у разі відмови."
 INS_realign_supply_chains_cat:0 "Ресурсні контракти"
 INS_recognize_moestopos_batallion_desc:0 "Революціонер на ім'я Мустопо проголосив себе 'виконувачем обов'язків міністра оборони' в Сурабаї, зберігаючи контроль над ополченням у Сурабаї. Його зусилля заслуговують на офіційне визнання, ми маємо офіційно підвищити його до генерал-майора TKR."
 INS_recovering_from_the_great_depression_desc:0 "Велика депресія мала руйнівний вплив на [INS.GetNameDef]. Оскільки наша економіка орієнтована переважно на експорт, протекціонізм у всьому світі підірвав наші сили. Зараз, коли світова торгівля, схоже, готова знову відкритися, ми повинні шукати нові ринки та працювати над відновленням наших старих торговельних шляхів."
 INS_revolution_events.1.desc:0 "Як і очікувалося, голландський уряд відреагував на нашу вимогу незалежності, надіславши солдатів до [1058.GetName] і розповсюджуючи антиреспубліканську пропаганду через засоби масової інформації."
 INS_revolution_events.27.desc:0 "Сили [HOL.GetAdjective] та республіканські ополченці воювали набагато довше, ніж будь-яка зі сторін очікувала, і незважаючи на зусилля [HOL.GetNameDef] і наше власне військове втручання, величезна кількість сил ополчення та партизанський характер їхньої армії призвели до того, що конфлікт зайшов у глухий кут, з сильною перевагою республіканців. Таким чином, [HOL.GetLeader] сьогодні оголосив, що [HOL.GetLeader.GetHeShe] підписав(ла) мирну угоду з Республікою, нав'язуючи рішення про дві держави на користь республіканців. Те, що залишилося від Індії, є оболонкою її колишньої слави. [HOL.GetLeader] заявив, що оскільки конфлікт закінчився поразкою, він не зможе надати нам обіцяну територію за наші військові внески."
 INS_revolution_events.31.a:0 "Сподіваємося, вони виконають свою частину угоди."
 INS_scout_plane_equipment_2:0 "Dornier Do 24"
 INS_seize_oppurtunity_desc:0 "[JAP.GetNameDefCap] програє, і їхній окупаційний уряд слабкий. Вперше за багато століть ми маємо реальний шанс розірвати кайдани навколо Індонезії назавжди, створивши незалежну державу. Якщо ми не скористаємося цією можливістю оголосити незалежність зараз, невідомо, скільки часу знадобиться до наступної."
 INS_spend_profits_on_rural:0 "Витрачати прибутки на розвиток сільських територій"
 INS_tac_bomber_equipment_2_short:0 "Fokker T.IX"
 INS_timor_issue_scripted_name_attack:0 "Атака на Східний Тімор"
 INS_tin_mining_desc:0 "Історія видобутку олова на островах Банка-Белітунг передує європейській присутності на архіпелазі. Тому не дивно, що олов'яна промисловість на островах давно потребує модернізації. Модернізація виробничих потужностей є дорогою справою, і наша існуюча олов'яна промисловість не працюватиме деякий час, поки ми її перебудовуємо. Однак існує значний потенціал для довгострокового прибутку."
 INS_union_events.1.t:0 "[HOL.GetNameDefCap] вимагає перенесення уряду до [1058.GetName]"
