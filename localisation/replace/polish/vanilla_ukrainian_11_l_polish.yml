 CAPITAL_BOX_TOOLTIP:0 "§YБойова лінія§! забезпечує основну бойову міць флоту і зазвичай представлена лінкорами та важкими крейсерами. Також вона не дає основним кораблям противника атакувати §Yавіаносці§!."
