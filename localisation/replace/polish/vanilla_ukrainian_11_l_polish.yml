 GOE_RAJ_partition.5.desc:0 "У міру того, як голоси мусульман у [GetRajName] все більше закликають до окремої батьківщини, відокремленої від Індії, індуїстські націоналісти вийшли на вулиці, щоб протестувати проти зростаючого впливу мусульман у країні, що часто призводить до насильницьких зіткнень."
 GOE_RAJ_partition.7.b:0 "Людина, яка так багато пожертвувала, Ганді"
