 GER_rebuild_the_high_seas_fleet_ww:0 "$GER_rebuild_the_high_seas_fleet$"
 GER_rebuild_the_nation_desc:0 "Після важкого періоду громадянської війни ми маємо зайнятися відродженням нашої держави. Ми попросимо наших громадян на деякий час забути про власний комфорт, щоби ми могли зосередити всі наші ресурси на досягненні цієї мети."
 GER_reichskommissariat_muscovy_effect_tt:0 "Усі необхідні області, окрім §Y[219.GetName]§!, перейдуть під контроль [RKM.GetNameDef]"
 GER_reinstate_imperial_possessions_desc:0 "Повернення історичних німецьких земель завершено успішно. Тепер ми можемо розпочати процес відновлення колишніх кордонів: [Root.GetName] поверне собі свої провінції, і про ганьбу Версальського договору можна буде забути!"
