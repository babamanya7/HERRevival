 ITA_via_della_vittoria_extra_states_tt:0 "\nДодати §Y1 інфраструктуру§! в кожну північноафриканську область у Середземномор'ї, підконтрольну державі §Y[ROOT.GetFlag][ROOT.GetNameDef]§! або §Y[ITA.GetFlag][ITA.GetAdjective]ому суб'єкту§!.\nПоточні ефекти:"
 JAM_fascism:0 "Хаймаканська імперія"
 JAP_7075_aluminium_alloy_desc:0 "Сама лише дальність польоту не принесе нам користі, якщо наші моделі не зможуть конкурувати з ворогом, коли той прибуде. Ми повинні виробляти літальні апарати з вищою маневреністю, щоб їх ніколи не могли перевершити в маневрах. Наші інженери в Міцубіші розробили новий алюмінієвий сплав, який революціонізує літакобудування, яким ми його знаємо."
 JAP_EQUIPMENT_VERSION_11:0 "Kai K"
 JAP_EQUIPMENT_VERSION_12:0 "Kai L"
 JAP_STATE_527:0 "Хейан-Коукай"
 JAP_align_the_concordia_association_desc:0 "Асоціація злагоди, політична партія під нашим контролем у Маньчжурії, дотримується ідеалів паназіатизму та створення багатоетнічної національної держави, а також створення структури, яка б поступово замінила військове правління над Маньчжоу-го цивільним контролем. Ми повинні запропонувати об'єднання наших двох націй заради просування паназійської справи."
 JAP_amphibious_mechanized_equipment_2_short:0 "Ka-Tsu Kai"
