 WW_hungary.115.a:0 "Розумна відповідь"
 WW_hungary.18.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] благородно погодився на наші вимоги щодо окупації Західного Банату й передав нам цю територію. Вони воліють умиротворити нас, а не протистояти, що лише сприятиме досягненню цілей Італії на Балканах."
 WW_hungary.39.t:0 "[FROM.GetNameDefCap] приєднується до Центральних держав"
 WW_hungary.45.desc:0 "Мудре керівництво [FROM.GetNameDef] погодилось коронувати Вільгельма Віда згідно з нашими вимогами та склало повноваження на користь нового короля. Новий світанок постає над нашою імперською федерацією!"
 WW_hungary.48.t:0 "[FROM.GetNameDefCap] приймає монарха з династії Габсбургів"
 WW_hungary.83.desc:0 "Уряд [HUN.GetAdjective] і досі вважає [975.GetName] невід'ємною частиною своєї держави, зазначаючи, що ця територія колись була частиною Угорщини в часи Імперії. Вони звернулися до нас із пропозицією викупити її за гарну ціну."
