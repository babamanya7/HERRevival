 EQUIPMENT_IN_GARRISON_HEADER:0 "Озброєння в гарнізонах"
 EQUIPMENT_TRANSPORT:0 "Транспорт"
 EQUIPMENT_UPGRADE_CURRENT_MAX_LEVEL:0 "Поточний максимальний рівень: $LEVEL|H0$"
 EST_corporate_chambers_desc:0 "Ліві давно протистоять ідеї корпоративізму, але тепер, коли в Riigikogu їх більше не чути, ми можемо нарешті заснувати трудові спілки. Робітники будуть розділені не ідеологією, а ремеслом; приватні підприємці стануть представляти їх інтереси."
 EST_events.10.d:0 "У державі [FIN.GetNonIdeologyName] почалася громадянська війна, але, як і раніше, неясно, яку роль гратиме в цьому конфлікті [Root.GetNameDef]. Зараз співпраця вапсів з [FIN.GetNonIdeologyAdjective] фашист лише у постачанні зброї та організаційної допомоги у захопленні влади, але, оскільки вапси вже боролися за [EST.GetAdjective] незалежність у минулому, ймовірно, [Root.GetLeader] визнає це можливістю сплатити борг держави [EST.GetNonIdeologyName] фінам."
 EST_events.5.t:0 "[From.GetNameDefCap] Encroaches on [Root.GetAdjective] Independence"
 EST_glory_of_war_desc:0 "Ми — уряд ветеранів, але багато вапсів занадто старі або втомилися від ран, щоби повернутися на дійсну військову службу. Можливо, ці досвідчені вояки можуть знайти себе, навчаючи військовій справі нове покоління естонських солдатів."
 EST_hold_saaremaa_desc:0 "Ми мусимо бути готові до довгого і завзятого опору. Естонському архіпелагу бракує материкової промислової потужності, але, підготувавши острови до оборони за всяку ціну, ми отримаємо плацдарм, з якого зможемо підтримувати бійців опору і з часом повернути."
 EST_prepare_covert_resistance:0 "Підготувати таємний спротив"
 EST_rally_the_nation_desc:0 "Вапси — рух ветеранів естонської визвольної війни; ми задихаємося під гнітом режиму Константіна Пятса. Якщо ми хочемо створити Естонію для естонців, треба заявити про себе світові. Ми мусимо пройти маршем по всій країні і дати знати про себе всім.\" ті люди, що боролися за незалежність Естонії, і ми заслуговуємо, щоби нас вислухали."
 EST_unite_our_nations:0 "Об'єднати наші нації"
 EST_vaps_uprising_desc:0 "Незважаючи на те, що вони є нелегальною організацією, Вапси продовжують проводити марші та демонстрації по всій Естонії. Що довше ми залишатимемо цю групу націоналістів гноїтися, то більше ми ризикуємо, що інші приєднаються до їхньої справи."
 EST_womens_defence_league:0 "Жіноча ліга оборони"
 ETH_African_Union_neutrality_ADJ:0 "Африканськ"
 ETH_BoP_expand_black_lions:0 "Збільшити кількість дивізій Чорних левів"
 ETH_BoP_purge_anarchists:0 "Провести чистки серед анархістів"
 ETH_african_union_desc:0 "Настав час для народів Африки об'єднатися в Африканський союз. Ніколи більше нам не загрожуватимуть імперіалісти чи фашисти, коли ми прагнемо стати першою наддержавою Африки."
 ETH_african_union_tt:0 "Відкриває рішення по інтеграції членів §YВиконавчої ради§! в §YАфриканський Союз§!."
 ETH_alternate_neutrality_party_long:0 "Прихильники $ETH_haile_selassie$"
 ETH_an_audience_with_countryleadertitle:0 "Аудієнція з [GetGermanCountryLeaderTitle]"
 ETH_asmera_naval_college_desc:0 "Простого виробництва та обслуговування кораблів недостатньо для створення військового флоту. Нам потрібні офіцери та спеціалісти, які добре навчені тому, як використовувати військово-морські засоби в бою. Тому ми заснуємо першу військово-морську академію [ETH.GetName]."
 ETH_bop_increase_anarchist_influence:0 "Збільшити підтримку анархістів"
 ETH_bop_increase_the_power_of_the_mekwanint_desc:0 "Призначені міністри повинні мати більше влади над місцевими справами. Ми мусимо працювати над тим, щоб передати владу від месафінтів до мекванінтів, поступово передаючи контроль центральному уряду і лідеру [ROOT.GetLeader]. Це, звичайно, засмутить расів, але це необхідно, якщо ми хочемо побудувати сильну державу [ROOT.GetName]."
 ETH_communist_tax_exemption_desc:0 "Щоб запобігти «витоку мізків», який зазнав Радянський Союз після революції, нам потрібно створити податкову систему, яка заохочуватиме спеціалістів залишатися в [ETH.GetNameDef]. Принаймні, поки ми не виростимо нове покоління пролетарських спеціалістів..."
 ETH_cooperation_jimma:0 "Співпраця з арабами"
 ETH_empower_the_chambers:0 "Уповноважити Палати"
 ETH_falling_back_desc:0 "Наші лінії фронту швидко стають незахищеними, а наші лінії постачання розтягнуті, організований відступ до [ROOT.Capital.GetCapitalVictoryPointName] може бути розумним, але ми повинні бути обережними та не вибиватися з поля повністю."
 ETH_forced_ITA_peace_achievement:0 "Змушено італійців просити миру"
 ETH_hold_the_south_mission_desc:0 "На південному фронті досі було тихо, але італійці, безумовно, готуються до нового наступу зі своїх володінь на півдні. Ми мусимо стримати їх і показати світові, що претензії, які висувають вони та їхні сомалійські маріонетки, є незаконними."
 ETH_invite_italian_settlers_desc:0 "Бачити, як наша велика держава стає ще одним місцем для європейської колонізації, для багатьох буде гіркою пілюлею. Однак недавня історія показала слабкість нашої промисловості та інфраструктури, і нам потрібні радикальні заходи для їх поліпшення. Тому ми скористаємося ситуацією, використовуючи досвід і багатство наївних [ITA.GetAdjective], запросивши їх тут оселитися."
 ETH_medal_gain_tt:0 "Збільшує кількість досвіду, отриманого командирами дивізій при нагородженні медаллю, на §G+75%§!."
 ETH_mekwanint_dominant_range:0 "Мекуанинт панують у політиці"
 ETH_mekwanint_side:0 "§YМекуанинт§!"
 ETH_military_advisors_tt:0 "\nЯкщо §Y[SOV.GetFlag][SOV.GetNameDef]§! погодиться, §Y[ETH.GetFlag][ETH.GetName]§! отримає фельдмаршала (§Y$SOV_semyon_budyonny$§!) та генерала (§Y$SOV_vasily_kuznetsov$§!)."
 ETH_new_weapons_and_tactics:0 "Нові зброя й тактики"
 ETH_provisonal_government:0 "Тимчасовий уряд"
 ETH_purchase_obsolete_ships_tt:0 "Відмикає рішення про купівлю старих кораблів у великих держав."
 ETH_reach_out_to_the_italians:0 "Звернутися до італійців"
 ETH_recall_balco_safo_decision:0 "Відкликати Балчу Сафо з відставки"
 ETH_reclaim_the_empire_targets:0 "[ETH.GetName] може відвоювати ось ці області"
 ETH_recruit_aircrews_from_host:0 "Найняти [?ETH.host_nation.GetAdjective]их пілотів"
 ETH_replace_the_abuna_desc_gojjam:0 "Лідер православної церкви, $ETH_abuna_qerellos_iv$, занадто тісно пов'язаний із $ETH_haile_selassie$. $ETH_abuna_abraham$ є ідеальним кандидатом на його заміну, зробивши Годжам політичним і релігійним центром імперії."
 ETH_request_soviet_hulls:0 "Попросити радянські корпуси лінкорів"
 ETH_restore_the_empire_of_axum_desc:0 "Від земель Судану до Аравійського півострова в один момент усі вони контролювалися нашими предками. Наше панування було розрубано протягом століть, роблячи нас уразливими для примх європейців. Настав час змінити ситуацію. Ми приймемо нашу спадщину, реформуючи Аксумську імперію та повернувши землі наших предків."
 ETH_support_spain_desc:0 "Іспанія постраждала від рук доморощених фашистів. Однак є ті, хто вірить, як і ми, що фашизму необхідно зустріти суворий опір і що народ може керувати собою. Ми використаємо уроки, отримані під час нашої війни з [ITA.GetAdjective], щоби допомогти опору [SPC.GetAdjective]."
 ETH_taxing_the_nobility_desc:0 "[ETH_GetTaxNobilityDesc]"
 ETH_the_new_administration_desc:0 "Серед останніх потрясінь багато хто зробив все можливе, щоби захистити нашу країну. Деякі, такі як Сенеду Гебру, також мають навички та знання, щоб кардинально поліпшити суспільство. Тепер ми дамо їм можливість це зробити."
 ETH_the_state_court_desc:0 "[ETH.GetAdjectiveCap]а правова система ґрунтується на архаїчних практиках, що сягають у минуле століть. З нашою нещодавньою хвилею реформ настав час кодифікувати більше законів у відповідності до конституції та створити сучасний державний суд для розгляду справ національного значення."
