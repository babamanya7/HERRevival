 PER_imperial_events.13.desc:0 "Чудова новина! Шах [PER.GetNameDef] погодився заплатити нам за передачу Белуджистану під їхній контроль. Можливо, ми втратили невеликий шматок нашої території, але гроші допоможуть нашим власним зусиллям."
 PER_imperial_events.132.a:0 "Настали темні часи..."
 PER_imperial_events.181.desc:0 "Схоже, [FROM.GetAdjective] погодилися на нашу пропозицію та почали розробляти наші умови здачі. Хоча це не найідеальніша ситуація, ми врятуємо незліченну кількість життів, дозволивши собі підкорятися [FROM.GetNameDef]."
