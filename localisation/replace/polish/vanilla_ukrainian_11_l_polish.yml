 COG_an_independent_colonial_cabinet_desc:0 "Для належного управління країною нам потрібно створити тимчасовий кабінет міністрів і наш парламент у Леопольдвілі. Тим часом Флещаувер здійснить державні візити до наших різних союзників в надії укласти вигідні торгові угоди з ними."
 COG_approach_the_disfavored_mwami_tt:0 "Коли війна за визволення почнеться, ми отримаємо 2 §YРуандські дивізії§!, а монархічні настрої в нашій країні почнуть зміцнюватися з часом."
 COG_centralize_military_structure_desc:0 "Щоб краще координувати наші армії, ми повинні встановити централізовану військову структуру, те саме, що колись дозволяло нам легко завойовувати всі наші сусідні королівства."
