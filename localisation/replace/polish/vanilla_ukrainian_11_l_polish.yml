 SIA_the_songsuradet_rebellion_desc:0 "Старший офіцер Прая Сонгсурадет є загрозою для нинішнього режиму, якщо він цього захоче. Ця небезпека для режиму не може залишатися непоміченою, і як головний супротивник Пібуна він повинен піти.\nБезсумнівно, існує вдосталь компрометуючих матеріалів, які можна використати проти Сонгсурадета та його прихильників, що допомогло б нам консолідувати нашу владу та усунути наших внутрішніх опонентів."
