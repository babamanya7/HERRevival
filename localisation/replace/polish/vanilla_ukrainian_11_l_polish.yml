 PER_officers_to_italy_desc:0 "[ITA.GetNameDefCap] — це місце, де ми вперше придбали деякі кораблі, які зараз знаходяться на наших верфях, і тому у нас, природно, є зв'язок щодо військово-морського розвитку. Ми повинні звернутися до [ITA.GetAdjective] уряду та попросити відправити наших офіцерів на військово-морську підготовку."
 PER_push_negotiations:0 "Наполягати на переговорах"
 PER_saadabad_pact:0 "Запит на Саадабадський пакт"
 PER_secure_afghanistan_desc:0 "[AFG.GetNameDefCap] — це один із відкритих шлюзів [PER.GetNameDef] на схід. Забезпечення цього коридору для наших союзників має першочергове значення. Це також дозволить нам забезпечити захист [AFG.GetNameDef] під нашим наглядом. Це, безсумнівно, на благо [AFG.GetAdjective] народу."
