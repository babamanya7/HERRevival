 POL_pzl_organization:0 "Państwowe Zakłady Lotnicze"
 POL_sabotage_polish_industry_desc:0 "Наші вороги мають набагато сильніші армії, ніж у нас, і їх більше. Хоча було б приємно втішатися думкою, що ми не втратимо свої позиції, правда полягає в тому, що ми навряд чи зможемо протриматися вічно. Однак, замінувавши наші заводи та залізниці вибухівкою, ми можемо зробити їх марними для наших ворогів у разі окупації."
 POL_segregated_seating_abolished:0 "Сегрегована освіта скасована"
 POL_silesia_fortified_area_desc:0 "Більше фортів, побудованих на півдні, забезпечать додаткову оборону."
 POL_strat_bomber_equipment_1:0 "PZL.58 Pszczoła"
 POL_study_foreign_built_ships_desc:0 "Британський флот був союзником Польщі протягом десятиліть, але останнім часом британська політика умиротворення ставить Польщу в непевне становище, коли немає друзів, на яких можна було б покластися. Можливо, вивчаючи проєкти британців, ми зможемо почати виробляти кораблі такої ж ефективності та величі."
