 CZE_STATE_72:0 "Тєшінсько"
 CZE_air_intelligence_desc:0 "Знання кількості літаків у ворожих ВПС є критичним компонентом для перемоги в повітряній війні. Точна інформація про повітряні сили противника є ключовою при зіткненні з ними в регіоні."
 CZE_ally_russia_desc:0 "Тепер, коли уряд [SOV.GetNameDef] тісніше узгоджується з нашим, ми могли б спробувати розширити розмиту угоду, підписану з їхнім попереднім урядом."
 CZE_armored_car_equipment_1:0 "OA vz. 30"
 CZE_balanced_1_desc:0 "Щоби знизити напруженість між чехами та словаками, пропонується рівномірно розподілити нові промислові об'єкти між відповідними частинами країни, хоча це менш ефективно."
