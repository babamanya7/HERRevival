 PER_ssb_events.3.desc:0 "Зустріч завершилася, і, на жаль, ми не змогли переконати [FROM.GetLeader] приєднатися. Наша існуюча військова та економічна співпраця триватиме, але [FROM.GetLeader] заявляє, що офіційний Саадабадський альянс не відповідає найкращим інтересам [FROM.GetNameDefCap]."
