 ICE_keflavik_airbase_desc:0 "Американці хочуть побудувати більшу авіабазу, щоб краще патрулювати Атлантику. Ми повинні схвалити це, оскільки це тільки зробить нашу країну сильнішою."
 ICE_neutrality_DEF:0 "Ісландія"
 ICE_recruiting_international_workers_desc:0 "Перетворивши нашу країну на взірець для наслідування як для комуністів, так і для соціалістів, і підтримуючи революційне полум'я так само яскраво, як і раніше, ми зможемо залучити міжнародних революціонерів, як це було на початку становлення радянської держави. Ми повинні показати робітникам і солдатам революції, незалежно від того, звідки вони походять, що [ROOT.GetName] несе факел, і це те місце, де їм належить бути."
