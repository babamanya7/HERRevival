 massed_bomber_formations_desc:0 "Зберігаючи бойовий порядок, наші бомбардувальники зможуть захищатися і підвищать шанс успішного бомбометання."
 max_command_power_tt:0 " $MODIFIER_MAX_COMMAND_POWER$ $RIGHT|+=0$"
 medium_armor_desc:0 "Середні танки гнучкі й можуть виконати майже будь-яке завдання."
 medium_tank_artillery_equipment_1:0 "Середня САУ I"
 medium_tank_equipment_desc:0 "Середні танки — це досить маневрені багатоцільові машини, які можуть виконувати різноманітні функції, наприклад розвідку, підтримку піхоти або боротьбу з іншими танками."
 mega_carrier_desc:0 "$ship_hull_mega_carrier_desc$"
 mexico.1.desc:0 "Протягом деякого часу генерали та місцеві правителі стежили за тим, як центральний уряд послаблює їхню владу і бере під контроль непокірних каудільйо. Схоже, епоха регіональних повстань добігає кінця. На жаль, ми не змогли убезпечити генерала Седільйо з Сан-Луїс-Потосі, який зберіг достатній вплив серед помилуваних повстанців і нещадних бандитів, щоби спробувати повалити центральний уряд, усунути лідера [Root.GetLeader] та зміцнити свою вислизну владу."
 mexico.19.d:0 "Хуан Андреу Альмасан, правий підприємець."
 mexico.19.i:0 "Вісенте Ломбардо, радикальний профспілковий діяч."
 mexico.22.desc:0 "У світлі зростаючих антисталінських настроїв у Радянському Союзі керівна кліка вирішила повернути Троцького з вигнання і поставити його на чолі уряду. Наша розвідка припускає, що Лев Троцький, здебільшого, стане маріонеткою інших сил у Росії, але сам він непохитний у своєму рішенні повернутися на батьківщину Жовтневої революції."
 mexico.26.desc:0 "[From.GetLeader] вітає пропозицію президента Мексики підтримати нас у війні проти Німеччини. Німецькі підводні човни нещодавно потопили нейтральні мексиканські нафтові танкери «Potrero del Llano» та «Faja de Oro», і мексиканський уряд висловив бажання раз і назавжди припинити їхню активність у Карибському морі.\n\nМексиканський уряд має намір отримати визнання світових держав і вірить, що, надавши допомогу Америці та альянсу [From.GetFactionName], він покаже себе гравцем на міжнародній арені."
 mexico.4.a:0 "Добре, ми можемо торгувати на цих умовах."
 mexico.45.c:0 "Мексика пішла на значний ризик цією авантюрою."
 mexico.54.a:0 "Прийняти його вимоги."
 mexico.54.desc:0 "У своїй палкій промові, що тривала більше чотирьох годин, [MEX.GetLeader] зажадав, щоби ми залишили всі свої колонії в Карибському морі, оскільки вони, на його думку, «найочевидніший доказ нашого імперіалістичного тиску на регіон.» Існують думки, що в даний момент ми не можемо дозволити собі конфліктувати з Мексикою, але більш впевнені радники наполягають, що нам цілком під силу чинити опір її тиску і що нашою територіальною цілісністю жертвувати не можна."
 mexico_extradited_trotsky:0 "Троцький екстрадований"
 middle_east_expansionism:0 "Близькосхідний експансіонізм"
 miedzymorze_faction:0 "Міжмор'я"
