 SOV_covert_support_for_spanish_poum_tt:0 "Надання таємної підтримки дозволить РПМО стати панівною фракцією під час повстання анархістів у межах громадянської війни в Іспанії, що зробить повстання §Yкомуністичним§! замість §gнейтрального§!.\n\n"
