 IRQ_political_events.77.t:0 "[IRQ.GetNameDefCap] завойовує область [680.GetName]"
 IRQ_purchase_alternative_aricraft:0 "Придбати альтернативні літаки"
 IRQ_refuge_for_the_grand_mufti:0 "Притулок для Великого Муфтія"
 IRQ_request_syria_from_vichy_desc:0 "Французи ніколи не були такими розділеними та слабкими. Це ідеальна можливість вимагати передачі їхньої сирійської території під наш контроль."
 IRQ_support_from_the_mountains_desc:0 "З кількома суворими гірськими хребтами, що оточують нас, підготовка та обладнання, пристосовані для боїв у цих регіонах, будуть великою допомогою. Початкова вартість може не бути стримуючим фактором."
 ISR_DEF:0 "Ізраїль"
 ISR_VICTORY_POINTS_9570:0 "Бреслой"
 ISR_fascism_DEF:0 "Ізраїльський тоталітаріат"
 ISR_neutrality_DEF:0 "Вільна Єрусалимська держава"
 ITA_CAS_equipment_2_short:0 "Ba.88 Lince"
 ITA_GATHERING_STORM_DESC:0 "Із піднесенням фашизму Італія вступила в нову, славетну епоху. Її війська зараз у процесі приєднання Ефіопії до зростаючої італійської колоніальної імперії, але цим амбіції Муссоліні не обмежуються.\n\nПанування над Середземномор'ям завжди було призначенням Італії, а в Європі саме вибудовується новий порядок речей. Коли хлине припливна хвиля змін, Італії треба буде зайняти місце на її гребені, інакше її може знести."
 ITA_HOL_autonomy_eu_member_DEF:0 "Європейська Італія"
 ITA_VICTORY_POINTS_6889:0 "Рагуза"
 ITA_balbo_high_control_range:0 "$ITA_mussolini_high_control_range$"
 ITA_boost_the_grand_council_of_fascism_missiolinis_tt:0 "\nВідкриває можливість заміни Великою фашистською радою завдань, виданих Муссоліні, на нові."
 ITA_communism_side:0 "Комуністична фракція"
 ITA_country_supports_new_italian_government_tt:0 "[FROM.GetNameDefCap] отримає від нас деяку підтримку у вигляді §Yспорядження§! та невеликого тимчасового бонусу §Yспоживчих товарів§!."
 ITA_crda_cant_organization:0 "$ITA_crda_cant$"
 ITA_cv_nav_bomber_equipment_3_short:0 "SM.89-II"
 ITA_diplomacy_balkan_decision_category:0 "Балканська дипломатія"
 ITA_discredit_haile_selassie_desc:0 "Інформуючи ефіопів про те, що Хайле Селассіє втік як боягуз і веде занепадницький спосіб життя в далекій країні, ми, можливо, зможемо схилити деяких людей на нашу сторону і завдати шкоди репутації колишнього імператора."
 ITA_ethiopian_war_logistics_bba:0 "$ITA_ethiopian_war_logistics$"
 ITA_ethiopian_war_logistics_bba_desc:0 "Відсутність поступу в Ефіопії свідчить про те, що ми недооцінили, як багато поставок насправді потрібно сучасній армії. Ми мусимо докласти цілеспрямованих зусиль для поліпшення доріг і портів у наших володіннях у Східній Африці, щоби забезпечити доставку необхідних вантажів на фронт."
 ITA_ferrea_mole_ferreo_cuore_desc:0 "Наш танковий корпус, безсумнівно, буде покликаний здійснювати великі подвиги військової відваги. Для цього буде недостатньо просто їздити залізними корпусами — вони мусять мати ще й залізні серця."
 ITA_heavy_tank_equipment_2:0 "P26"
 ITA_industrial_socialization_factories_tt:0 "Додасть §Y2 комірки для будівництва§! та §Y2 цивільні заводи§! в щонайбільше двох осердних областях.\nДодасть §Y2 комірки для будівництва§! та §Y2 військові заводи§! в щонайбільше двох інших осердних областях."
 ITA_international_support_arrives_tt:0 "Від наших товаришів за кордоном ми отримаємо наступну допомогу: "
 ITA_italo_balbo_focus:0 "Італо Бальбо"
 ITA_joint_military_programs_two_allies_tt:0 "Ефекти подвоєні, бо §Y[ROOT.GetNameWithFlag]§! знаходиться в одному альянсі і з державою §Y[ENG.GetNameWithFlag]§!, і з державою §Y[FRA.GetNameWithFlag]§!."
 ITA_liberate_gramsci:0 "Звільнити Грамші"
 ITA_mare_nostrum_bba:0 "$ITA_mare_nostrum$"
 ITA_military_agreements:0 "Військові угоди"
 ITA_military_cooperation:0 "Військова співпраця"
 ITA_missiolini_conquer_ethiopia_desc:0 "Які б абіссінські твердині не залишилися, їх потрібно знищити, щоби забезпечити перемогу Італії."
 ITA_missiolini_occupy_albania_desc:0 "Міцні зв'язки між Італією та Албанією сягають глибини тисячоліть, ще з часів Римської імперії. Ми повинні приєднати Албанію до Італії, щоби забезпечити вхід до Адріатичного моря."
 ITA_missiolini_strengthen_the_army:0 "Посилити армію"
 ITA_mussolini_resigned_minister_of_education_position_flag:0 "Минуло §Y365 днів§! відтоді, як §Y[ROOT.ITA_benito_mussolini.GetName]§! залишив посаду в Міністерстві освіти\n(наразі минуло [?ITA_mussolini_resigned_minister_of_education_position_flag:days|Y0])"
 ITA_power_to_the_king_desc:0 "У цей час великої соціальної та політичної напруженості єдиний спосіб гарантувати, що жоден екстремістський режим, чи то фашистський, чи то комуністичний, не візьме гору в Італії, — це збільшити концентрацію влади в руках короля, який, безсумнівно, є найбільш підходящою людиною для керівництва нашою країною."
 ITA_pressure_country_government_balkan_desc:0 "$SOV_pressure_country_government_baltic_desc$"
 ITA_proclaim_the_italian_empire:0 "Проголосити Італійську імперію"
 ITA_romania_friend_desc:0 "У наших інтересах було би залучити наших далеких родичів у Румунії до сфери нашого впливу. Дуче бачить великий потенціал у їхній «Залізній гвардії»."
 ITA_rsi_DEF:0 "$RSI_DEF$"
 ITA_scout_plane_equipment_1:0 "Caproni Ca.310"
 ITA_seize_old_equipment_desc:0 "На різних арсеналах по всій країні зберігається велика кількість старої військової техніки. Незважаючи на її вік, вилучення цієї техніки та передача її нашим військам зробить значний внесок у перемогу у війні."
 ITA_ship_armor_cruiser_3:0 "150-мм пояс/70-мм палуба"
 ITA_strat_bomber_equipment_2:0 "Piaggio P.108"
 ITA_tac_bomber_equipment_1_short:0 "BR.20 Cicogna"
 ITA_the_eastern_threat_claims_tt:0 "Отримає претензію на §Yкожну чорноморську область, яка належить державі [SOV.GetFlag][SOV.GetNameDef]§!.\nПоточні ефекти:"
 ITA_the_enemies_of_capitalism_desc:0 "Радянський комунізм становить велику загрозу для всієї Європи, а отже і для італійської держави. Прийшов час подбати про них."
 ITA_the_fight_overseas_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_HEAT_ATTRITION_FACTOR$: §G-10.00%§!\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-5.0%§!\n$MODIFIER_ACCLIMATIZATION_HOT_CLIMATE_GAIN_FACTOR$: §G+15.0%§!\n\n"
 ITA_the_italian_legions_desc:0 "Можливо, в недалекому минулому наші збройні сили не були на висоті, але зараз, коли італійський народ як ніколи пишається своєю римською спадщиною, ми мусимо нав'язати нові доктрини нашим збройним силам, щоби гарантувати, що наші легіони будуть такими ж страшними сьогодні, як і тисячі років тому."
 ITA_topple_amhara_rulers:0 "Повалити амхарських правителів"
 ITA_triumph_in_africa_bba:0 "$ITA_victoryinETH$"
 ITA_we_will_transfer_the_following_states_tt:0 "Ці області буде передано державі §Y[RDS.GetFlag][RDS.GetNameDef]§!:"
 JAN_fascism_ADJ:0 "Полярн"
 JAP_abe_isoo_focus:0 "Прем'єрство Абе Ісоо"
 JAP_amphibious_mechanized_equipment_1:0 "Type 4 Ka-Tsu"
 JAP_appoint_new_generals:0 "Призначити нових генералів"
 JAP_approach_the_young_officers:0 "Підступити до молодих офіцерів"
 JAP_battle_cruiser_2:0 "Проєкт «B-65»"
 JAP_break_the_london_naval_treaty:0 "Порушити Лондонський морський договір"
 JAP_challenge_the_zaibatsus:0 "Кинути виклик дзайбацу"
 JAP_civilian_nuclear_reactor_investments:0 "Інвестиції в цивільні ядерні реактори"
 JAP_conquer_the_army_remnants_desc:0 "Настав час завершити боротьбу, яку ми почали, і покласти край останнім залишкам Імператорської армії та нашій громадянській війні. Ми повинні знищити Квантунську армію та відвоювати Маньчжурію!"
 JAP_coup_the_tibetan_government_decision:0 "Здійснити переворот в [TIB.GetAdjective]ому уряді"
 JAP_cruiser_ship_engine_2:0 "«Mitsubishi» 90 000 к. с. н. в."
 JAP_crush_the_internal_factions_desc:0 "Суперництво між фракціями всередині країни, кожна з яких змагалася за схвалення імператора, мало руйнівні наслідки. Тепер, коли уряд знову повністю контролює ситуацію, настав час закріпити, хто має реальну владу, і показати іншим внутрішнім угрупованням, що з нами жарти погані."
 JAP_develop_aluminum_sources_desc:0 "Наша авіабудівна програма потребує величезної кількості алюмінію. Ми мусимо розпочати масові розробки родовищ у Маньчжурії."
 JAP_develop_mindanao_steel_deposits:0 "Розвиток залізних родовищ на Мінданао"
 JAP_develop_tuban_oil_deposits:0 "Prospect the Tuban Oil Fields"
 JAP_divert_military_funds_desc:0 "Оскільки повстання здається дедалі ближчим, якщо ми хочемо послабити військових настільки, щоб вони не змогли завдати нам удару, ми повинні перенаправити їхнє фінансування на інші джерела. Через це вони опиняться в дефіциті на досить тривалий час."
 JAP_end_the_interservice_rivalry:0 "Покласти край міжвідомчому суперництву"
 JAP_escalate_incident_to_border_conflict_MON:0 "Ескалувати інцидент"
 JAP_establish_manchuria_airplane_manufacturing_company_desc:0 "Щоб виробляти наше обладнання ближче до місць видобутку ресурсів, Авіабудівна компанія Накаджіма запропонувала відкрити під нашим наглядом у Маньчжурії дочірнє підприємство, яке вони наразі називають Маншю. Ми повинні підтримати цю блискучу ідею."
 JAP_first_strike_principle_tt:0 "Коли §Y[ROOT.GetNameDef]§! §Rоголошує війну§! §Yсусідній країні§! або сусідній країні маріонетки, отримує на §Y90 днів§!:\n §Y$JAP_first_strike_principle_dm$§!\n $MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!\n  $MODIFIER_BREAKTHROUGH_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!"
 JAP_form_a_labor_patriot_corps_decision:0 "Сформувати Трудовий патріотичний корпус"
 JAP_further_rural_investments:0 "Подальші інвестиції в сільську місцевість"
 JAP_further_urban_investments_desc:0 "Наші міські центри вкрай потребують інвестицій. Якщо ми хочемо, щоб промисловість, розташована в містах, мала ефективність і робітників, необхідних для виконання виробничих квот, ми повинні втрутитися і допомогти їм."
 JAP_generic_mio_trait_high_speed_mine_hunting_equipment:0 "Середнє тральне спорядження Тип 3"
 JAP_grand_army_purge_desc:0 "Щоб гарантувати, що наш контроль над армією є абсолютним, ми повинні позбавити країну зрадників, які намагаються підтримувати ідеї олігархії Мейджі та протистоять нам на шляху до влади, включаючи мерзенних офіцерів Тосейха, які прагнули контролювати Імператора заради власної вигоди. Будь-якими засобами армія має бути очищена від цих негідників!"
 JAP_grand_army_purge_tt:0 "§RЧистки§! серед різних §Yчленів Тосейха§! та офіцерів §Yсамурайського походження§!, а також §Gпросування§! §Yмолодих офіцерів§!, які брали участь у державному перевороті. Серед відомих командирів, яких буде §Rусунуто§!:\n"
 JAP_greater_east_asian_federation_tt:0 "Ми будемо відомі як §YВелика Східноазійська Федерація§!"
 JAP_guide_the_lesser_states_desc:0 "Менш розвинені азійські держави не мають передумов для здійснення революції та успішного створення власних робітничих республік. Ми повинні направляти їх і показувати їм, як правильно керувати державою."
 JAP_guide_the_zaibatsus:0 "Спрямування дзайбацу"
 JAP_has_already_attracted_inestments_from_here_flag:0 " Вже залучили інвестиції від цієї країни"
 JAP_hasten_the_integration_of_taiwan_desc:0 "Наші зусилля з інтеграції Тайваню просуваються добре, маючи лише кілька основних невдач. З часом острів стане такою ж невіддільною частиною Японії, як і Рюкю. Однак нам слід поспішити, якщо ми хочемо незабаром перемикнути увагу на інші регіони."
 JAP_hokushin_ron_started_flag:0 "Завершено фокус §Y$JAP_hokushin_ron$§!"
 JAP_imperial_navy_low_control_range:0 "Growing Navy Influence"
 JAP_implement_army_reforms_desc:0 "З усуненням старого військового штабу також настав час усунути їхні застарілі уявлення про війну. Армія повільно реорганізовуватиметься в сили самооборони, а «принцип першого удару» незабаром стане ще однією ідеєю минулого."
 JAP_improve_the_type_91_aerial_torpedo_desc:0 "Ми повинні прагнути розробити торпеди, спеціалізовані для ураження кораблів на мілководді, щоб покращити наші можливості ударів по портах. Ці авіаційні торпеди будуть натхненні нашою найдосконалішою торпедою «Довгий спис» і принесуть нам плоди перемоги швидше, ніж ми могли собі мріяти."
 JAP_increase_takahashi_korekiyo_security_decision:0 "Посилити охорону $JAP_takahashi_korekiyo$"
 JAP_influence_mongolian_people_decision:0 "Впливати на [MON.GetAdjective]ий народ"
 JAP_kodoha_neutrality:0 "Японський шьогунат"
 JAP_launch_an_offensive_in_core_state_decision:0 "Почати наступ у [FROM.GetName]"
 JAP_liberate_manchuria_desc:0 "Маньчжурія продовжує існувати в умовах авторитаризму — огидний пережиток нашої колоніальної політики. Ми маємо виправити ситуацію, повернувши регіон Китаю, його законному власнику."
 JAP_organize_a_general_election_desc:0 "Тепер, коли громадянські чвари нарешті закінчилися, настав час підготуватися до відбудови та повернення до наших демократичних традицій. Вперше з часів самого Мейджі ми повинні провести вибори, вільні від впливу та корупції з боку військових, і дозволити народу самому вирішувати своє майбутнє!"
 JAP_pacific_union_fascism_ADJ:0 "Азійськ"
 JAP_redistribute_land_and_wealth_desc:0 "Більша частина землі по всій країні досі належить родинам, пов'язаним із даймьо минулого, які правили величезними володіннями. Ці землі мають бути перерозподілені між нашими фермерами, а також вилучені державою для будівництва нових міст і промислових об'єктів."
 JAP_rekindle_the_old_alliance:0 "Повернення до старих союзів"
 JAP_relentless_divine_nationalism_decision:0 "Надихнути невпинний божественний націоналізм"
 JAP_rockets_development_desc:0 "Хідео Івакуро мав багато геніальних ідей щодо керованих ракет «повітря-земля» та зенітних ракет «земля-повітря». Ми повинні просувати його ідеї та розробляти нові форми ракетобудування, які зможуть допомогти нам у наших майбутніх перемогах."
 JAP_sea_exploit_southern_resource_area_desc:0 "Тепер, коли ми підкорили південь, ми повинні значно розширити експлуатацію багатих ресурсів Південно-Східної Азії та Ост-Індії, щоб живити наші війська у цій війні."
 JAP_sea_supremacy_of_will_desc:0 "Найсучасніше спорядження марне без запеклої людини, яка ним володіє, а запеклість може перетворити найпростіший камінь на найсмертоноснішу зброю. Тільки завдяки духу стрімкості, культу наступу, можна вигравати війни."
 JAP_sea_tripartite_pact_desc:0 "Оскільки наші вороги об'єднуються проти нас, завдання перемогти їх стає складнішим. Ми повинні звернутися до інших урядів зі схожими цілями, щоб домовитися про певну міру співпраці."
 JAP_sessho_title_text:0 "Сешшьо"
 JAP_ship_fire_control_system_2:0 "Type 98 DCT/Computer"
 JAP_sp_naval_submarine_carrier:0 "$sp_naval_submarine_carrier$ класу «I-400»"
 JAP_spread_revolutionary_flames_to_south_asia:0 "Поширити полум'я революції на Південну Азію"
 JAP_strategic_bomber_effort_desc:0 "Як би нам того не хотілося, війну не можна виграти лише на полі бою. На її результат значною мірою впливають промислові потужності, тому нам потрібні нові моделі стратегічних бомбардувальників, здатні завдавати ударів по ворожих тилах."
 JAP_strenghten_manchukuo_imperial_army:0 "Зміцнення Імперської армії Маньчжоу-го"
 JAP_strenghten_the_supply_lines:0 "Зміцнення ліній постачання"
 JAP_support_weapons4:0 "Type 1 HMG & Type 2 12 cm Mortar"
 JAP_supremacy_of_will_desc:0 "Навіть найсучасніше спорядження марне, якщо той, у чиїх руках воно знаходиться, не здатний боротися. У той час як воля до перемоги здатна перетворити навіть простий камінь на смертоносну зброю."
 JAP_tauran_border_conflict_warning_MON_desc:0 "Сталася сутичка між нашим військовим контингентом, який нещодавно увійшов у Тауран, та [MAN.GetAdjective]ими солдатами на нашому спільному кордоні в [761.GetName]. Джерела розвідки в [MAN.GetNameDef] повідомляють, що це може бути лише першим кроком у масштабнішому протистоянні. Ми повинні негайно посилити кордон із [MAN.GetNameDef]."
 JAP_the_eternal_kingdom_desc:0 "Японія — це нація, якою править божественний Імператор, і як така, вона є країною під захистом богів. З їхньою допомогою наша божественна країна безсмертна і стоятиме непохитно вічно. Хай живе Його Величність Імператор, і хай живе Велика Японська Імперія!"
 JAP_the_fate_of_the_imperial_family:0 "Доля імператорської сім'ї"
 JAP_the_imperial_defense_plan:0 "[JAP_the_imperial_defense_plan_key]"
 JAP_the_labor_farmer_faction_ascendant:0 "Сходження Робітничо-селянської фракції"
 JAP_the_surrender_broadcast:0 "Радіотрансляція про капітуляцію"
 JAP_to_rival_zheng_yi_sao:0 "Змагатись із Чжен Ши"
 JAP_transport_plane_equipment_1:0 "Ki-56"
 JAP_unity_cabinet_party_long:0 "Кабінет державної єдності"
 JAP_uplift_labor_unions_desc:0 "Профспілки допомагають нашому народу в самоврядуванні та сприяють відбудові й ремонту промисловості, яка була пошкоджена військовими як до, так і під час громадянської війни. Ми повинні підтримувати ці організації й надалі, доки одного дня не зможемо створити японське суспільство загального добробуту."
 JAP_yasuhito_takes_up_the_throne_tt:0 "§YЯсухіто§! замінить §YХірохіто§! у розділі Імператорського впливу"
 JAP_yokosuka_naval_air_technical_arsenal:0 "Військово-морський авіаційно-технічний арсенал Йокосука"
 JOR_emirate_ADJ:0 "Зайорданськ"
 JOR_fascism_ADJ:0 "Йорданськ"
 JUNO_already_invited_german_naval_advisors_completed:0 "Німецьких морських радників уже запрошено"
 JUNO_already_invited_italian_naval_advisors_completed:0 "Італійських морських радників уже запрошено"
 JUNO_army_modernization_initiative:0 "Ініціатива модернізації армії"
 JUNO_brazil_events.133.desc:0 "Як і слід було очікувати, після нашого недавнього нападу на іншу державу-члена в рамках Організації американських держав, нас виключили з неї. Як відреагують держави-члени, що залишилися, ще належить побачити."
 JUNO_brazil_events.191.a:0 "У майбутньому ми повинні використовувати альтернативні методи."
 JUNO_brazil_events.32.a:0 "Гвіани не варті того, щоб за них воювати."
 JUNO_brazil_events.36.desc:0 "Схоже, що ми на порозі ще більшого конфлікту після нашої відмови передати територію [FROM.GetNameDef]. Хоча ми сподівалися, що вони блефують, розвідувальна інформація з регіону свідчить про те, що [BRA.GetAdjective] військові готуються забрати територію силою."
 JUNO_brazil_events.44.a:0 "Ми забезпечимо, що історія повториться знову."
 JUNO_brazil_events.44.t:0 "[FROM.GetName] готується до війни"
 JUNO_brazil_events.46.desc:0 "[FROM.GetNameDefCap] мудро вирішили підкоритися нашим збройним силам, замість того, щоб ризикувати конфліктом. Зараз ми перебуваємо у процесі встановлення нового режиму в країні, який більше відповідає нашому власному."
 JUNO_brazil_events.62.a:0 "Звичайно, це може принести нам таку ж користь!"
 JUNO_brazil_events.74.desc:0 "Як і очікувалося, [FROM.GetNonIdeologyName] погодилася на нашу вимогу про їхнє підкорення. У міру поширення новин, сумний настрій охопив колишню націю [FROM.GetNonIdeologyName], де багато хто бореться з новою реальністю. Тим часом патріотичний запал охопив народ [ROOT.GetNonIdeologyName]."
 JUNO_brazil_events.74.t:0 "[FROM.GetNameDefCap] приймає підкорення"
 JUNO_brazil_events.81.a:0 "Чудово!"
 JUNO_guay_events.5.desc:0 "Настав час повернути наші борги [?var:old_world_power.GetName]. Хоча це завдасть шкоди нашій економіці на деякий час, як скаже будь-який хороший економіст, борг не завжди поганий, якщо він інвестований, що ми й зробили."
