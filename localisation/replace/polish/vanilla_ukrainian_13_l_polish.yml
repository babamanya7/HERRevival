 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC:0 "Бразилія відродить НВА та спробує повалити демократичний уряд. Його замінить рада НВА, яка впроваджуватиме комуністичні реформи, перш ніж урешті-решт спробує звільнити континент від фашизму й імперіалізму."
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC:0 "Бразилія намагатиметься повалити демократичний уряд і замінити його прихильним до Радянського Союзу комуністичним урядом на чолі з Луїс Карлусом Пресчісом. Тоді вона приєднається до Комінтерну та надасть допомогу Радянському Союзу."
 RULE_OPTION_COMMUNIST_CAN_AI_DESC:0 "§HКанадський§! ШІ намагатиметься перейти в комунізм і підтримувати робітників усього світу в їхній боротьбі, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEFAULT_COLONIZATION_DESC:0 "Світ колонізований згідно з історією."
 RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC:0 "ШІ уникатиме світових справ і зосередитися на внутрішній індустріалізації, привівши до влади партію «Бланко». Країна приєднається до Союзників тільки наприкінці війни."
 RULE_OPTION_DEMOCRATIC_PER_AI:0 "Демократія: конституційна монархія"
 RULE_OPTION_DEMOCRATIC_SOCIALIST:0 "Демократичний соціалізм"
 RULE_OPTION_DEN_REARMAMENT_AI_DESC:0 "Данія намагатиметься шукати союзників серед сильніших країн і протистояти всяким спробам вторгнення."
 RULE_OPTION_FIN_FASCIST_PLAN_DESC:0 "Фінські праві, очолювані Патріотичним народним рухом, повалять колишню консервативну демократію, намагаючись зміцнити зв'язки з Німеччиною і спираючись на такі організації, як Mustapaidat і Suojeluskunta, щоби створити могутню армію та розширити кордони країни відповідно до ідеї Великої Фінляндії."
 RULE_OPTION_FOCUSES_ONLY_40:0 "Лише за фокусами (до 1940 р.)"
 RULE_OPTION_GOE_INDIA_MUGHAL:0 "GOE — Імперія Великих Моголів"
 RULE_OPTION_HISTORICAL_SIA_AI:0 "$RULE_OPTION_HISTORICAL$"
