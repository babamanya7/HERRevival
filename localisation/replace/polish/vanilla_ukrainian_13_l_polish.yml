 SUBDOCTRINE_SCREEN_ANTI_AIRCRAFT_CRUISERS_DESC:0 "Легкі крейсери не мають достатньої стійкості, щоб стояти в лінії бою, але їх можна оснастити великою кількістю зенітних знарядь, що забезпечить потужний зенітний захист флоту."
