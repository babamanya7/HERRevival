 RAJ_quinine_desc:0 "Забезпечення наших військ хініном та подібними ліками дозволить нашим військам воювати в тропічних умовах, не страждаючи від малярії."
 RAJ_regimental_loyalty_desc:0 "Зв'язки полкової лояльності плекають єдність та дисципліну серед наших військ. Підтримуючи гордість за ці традиції, ми створюємо силу, пов'язану честю, довірою та непохитною прихильністю до перемоги."
 RAJ_restore_the_timurid_empire_desc:0 "Прапори Тимура знову майорять, і імперія, яка колись вселяла страх у серця султанів та королів, повстала з попелу історії. Наше правління простягається через землі, які колись формувалися його завоюваннями, пов'язуючи Схід та Захід під єдиним пануванням. Нехай світ зверне увагу — Тимуриди повернулися, і цього разу ми не зникнемо в минулому."
 RAJ_royal_indian_navy_dlc_desc:0 "$RAJ_royal_indian_navy_desc$"
 RAJ_secular_rule_alt_desc:0 "Настав час повернути нашу родову серцевину, створюючи нову еру з тих самих гір, що породили нашу династію. Закріпивши імперію у суворому серці Афганістану, ми забезпечуємо наше панування та відновлюємо основу імперського правління."
