 sp_land_generic_reward_major_progress_1_desc:0 "[Character.GetName] здійснює великий прорив, що значно просуває проєкт уперед, підтверджує [Character.GetHerHis] авторитет і надихає дослідницьку групу. Завдяки цьому прогресу проєкт наближається до мети, увічнюючи ім'я [Character.GetName] як новатора."
