 MEX_focus_new_world_order_desc:0 "Німці однозначно є господарями Європи. Нам точно буде місце в їхньому Новому світовому порядку, якщо ми допоможемо їм проти британців і американців. Стара телеграма Ціммермана була надіслана неспроста: Америку можна знищити лише наземним вторгненням..."
