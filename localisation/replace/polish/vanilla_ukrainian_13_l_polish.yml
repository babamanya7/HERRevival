 italy.16.t:0 "Німеччина частково нас підтримує"
 italy.7.a:0 "Тепер нам краще сподіватися тільки на себе."
 italy.9.d:0 "Під час громадянської війни Італія запропонувала добровольців боротися за націоналістичну справу. Хоча ідеологічні мотиви були першочерговими, Італія також мала стратегічну зацікавленість у результаті. Оборона Балеарських островів, особливо Майорки, представляла особливий інтерес для Італії через їхнє положення в Середземному морі, особливо по відношенню до західноєвропейських колоній.\n\nТепер [From.GetLeader] запропонував передати острови під італійський контроль назавжди. Враховуючи їхній внесок у нашу перемогу, пропозиції можуть бути й достоїнствами."
 its_all_coming_together_tt:0 "Граючи як [CHI.GetNonIdeologyName], поністю контролюйте всі осердні землі самостійно або посередництвом підлеглих"
 jet_fighter_equipment_1_desc:0 "Реактивний двигун дозволяє винищувачу розвивати раніше небачену швидкість. Ранні зразки не дуже ефективні, але звичайним винищувачам за ними не наздогнати."
 jet_fighter_equipment_desc:0 "Винищувачі — літаки швидкі, маневрені та підходять для різних завдань: це перевага в повітрі, супровід союзних бомбардувальників та перехоплення бомбардувальників ворога."
 jet_strat_bomber_equipment_1_short:0 "Реакт. страт. бомбардувальник I"
 jet_tac_bomber_equipment:0 "Реактивний тактичний бомбардувальник"
 knight_cross_of_the_southern_constellation:0 "Лицарський хрест кавалерів Ордену Південного Сузір'я"
 land_facility:0 "Інститут наземної війни"
 landmark_hagia_sophia:0 "Агія-Софія"
 landmark_kremlin:0 "Кремль"
 lar_decryption_bonus_tech_desc:0 "Ми отримаємо §G+10 швидкості розшифрування§!."
 lar_france_french_union.11.desc:0 "Результати референдуму, що прийшли з Індокитаю, описують більш похмуру картину, ніж очікувалося. Хоча в столиці мало хто вірив у те, що в осередках націоналізму проголосують за вступ до Союзу, виявилося, що вплив націоналістичних ідей На жодній із територій не набралося більшості голосів за вступ. Націоналістичні активісти вже борються за негайне відділення від Франції, нехай навіть ціною війни."
 lar_france_political_violence.1.t:0 "Протести переростають у насильство"
 lar_france_vichy_reunification.3.t:0 "Уряд Віші залишається"
 lar_heavy_water.1.desc:0 "Командир гарнізону в Телемарку повідомляє, що минулої ночі на гідроелектростанції Веморк прогримів сильний вибух, який знищив споруди, в яких робили важку воду. Розслідування ще ведеться, але наявні докази з усією очевидністю вказують на дії еліт. \n\nСудячи з усього, командос десантувалися з літака на околицях ГЕС, проникли туди, скориставшись кричущою некомпетентністю охорони, встановили вибухівку поруч із ємностями для зберігання і зникли вночі за лічені хвилини до вибуху.\n\nПовідомлень про жертв серед громадян, Що дає командиру привід думати, що місцевий опір знало про підготовку нальоту."
 lar_news.20.a:0 "¡Por la libertad!"
 lar_news.21.t:0 "Об'єднання Лондонського бюро"
 lar_news.28.c:0 "Нехай вони порвуть один одного на частини, впиваючись перемогою!"
 lar_news.4.c:0 "Питання легітимності треба вирішувати."
 lar_news.5.d:0 "Наш південний фланг захищений."
 lar_news.6.t:0 "Франція змінила свою зовнішню політику"
 lar_portugal_iberian_summit.2.a:0 "Надіслати запит негайно."
 lar_portugal_iberian_summit.4.a:0 "Ми приймаємо запит. Вони можуть бути нам корисні."
 lar_portugal_iberian_summit.8.desc:0 "Іспанія та Португалія відправили нам спільний запит на вступ до альянсу [Root.GetFactionName]. Вони чекають, що ми приймемо в нього обидві іберійські нації. \n\nМи оцінюємо потенціал доступу до Середземного моря, а наші військові командири тим часом стурбовані імовірним відкриттям нових фронтів, на захист яких ми можемо не вистачити ресурсів..."
 lar_portugal_iberian_workers_united.1.t:0 "Союз робітників Іберії"
 lar_spain.2.a:0 "...яку ми, об'єднаний Націоналістичний фронт, і виграємо!"
 lar_spain.26.desc:0 "[From.GetNameDefCap] повідомляє нам про беззастережне прийняття запропонованого Іберійського пакту. Ця держава надалі буде підтримувати нас у будь-якому союзі або війні, в якій ми опинимося."
 lar_spain.44.desc:0 "Незважаючи на справедливість претензій на французьку корону, які висуває король [Root.GetLeader], [From.GetAdjective] уряд, схоже, в останню хвилину проявив малодушність. Посилаючись на побоювання громадських заворушень через можливий контроль Іспанії над Францією, воно «при всій повазі змушене відкинути» коронацію."
 lar_spain.49.desc:0 "Відтоді, як [Root.GetAdjective]і конфлікти стали спалахувати поблизу [From.GetAdjective]ого кордону, під наші знамена почали стікатися місцеві анархісти. Завдяки добре спланованому та проведеному «заохоченню» проанархістські настрої поширилися серед [From.GetAdjective]ої молоді зі швидкістю лісової пожежі.\n\nВ результаті передачі [Root.GetAdjective]их схованок зі зброєю [From.GetAdjective]им анархістським осередкам ситуація в державі [From.GetNameDef] дійшла вже до того, що уряд пригнічує повномасштабне повстання. Лідери цього повстання тепер просять нашу пряму й офіційну підтримку, пропонуючи нам очолити глобальну анархістську боротьбу та заручитися їхньою допомогою після закінчення боїв."
 lar_spain.57.a:0 "Це прогрес!"
 lar_spain.71.b:0 "Союз із республіканцями? Ніколи!"
 lar_spain.73.a:0 "Що ж вони задумали?"
 lar_spain.83.t:0 "Ознаки зради"
 lar_spain.84.a:0 "Напруга зростає. Треба терміново втілювати свої плани!"
 lar_spain.88.t:0 "[SPD.GetNameDefCap] захоплює регіон [SPR_stolen_state_name.GetName]"
