 FILTER:0 "Фільтр"
 FIN_academic_karelian_society_desc:0 "Протягом понад десятиліття організація інтелектуалів і студентів Гельсінського університету стає дедалі впливовішою. Їхні основні цілі добре збігаються з нашими власними, а саме прагнення покращити Фінляндію відповідно до нашої історії. Можливо, ми зможемо знайти спосіб співпраці."
