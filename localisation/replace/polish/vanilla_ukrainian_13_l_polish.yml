 MAN_tsr_promote_manchu_identity_desc:0 "Маньчжурський народ — це не просто ще одна китайська нація. Ми повинні прагнути зміцнити цей зв'язок із землею та заохочувати маньчжурський націоналізм, щоб відокремити нас від решти Китаю. Таким чином, ми зможемо легше зберегти нашу незалежність, водночас пов'язуючи нас тісніше з великими націями Азії."
 MAN_tsr_question_the_emperors_authority_desc:0 "Хоча Пуї все ще має певну підтримку серед тих, хто виступає проти уряду, його також широко критикують за бездіяльність проти японців. Ми повинні скористатися цією хвилею і повністю прибрати його з картини вільної Маньчжурії."
 MAN_tsr_raise_the_yong_ying_tt:0 "Розблоковує рішення §YЗібрати ополчення§! під час війни"
 MAN_tsr_request_our_lost_territories_desc:0 "Радянський Союз нині володіє кількома територіями, які колись були китайськими та маньчжурськими. Якщо ми хочемо мати функціональні відносини з їхньою державою, було б справедливо попросити про їх повернення або принаймні врегулювати цю суперечку."
