 LIT_arrest_nazis_in_memel_desc:0 "У Мемелі повно нацистів і співчуваючих фашистам — це створює прецедент для німецького вторгнення. Якщо ми бажаємо утримати Мемель і околиці, потрібно зробити членство в партії нацистів кримінально караним і як слід підготуватися до можливого вторгнення нацистів."
 LIT_events.104.b:0 "Це не варте таких зусиль."
 LIT_events.3.t:0 "[From.GetNameDefCap] просить про вічний мир"
 LIT_indivisible_power_of_the_state_desc:0 "Я — це держава, держава — це я. Тепер, коли зміцнені закони і правила диктатури, залишається лише переконатися, що влада диктатора абсолютна. Деякі бажають повернення до демократії, але ми знаємо, що в ті часи, коли в Литві дихають одночасно російський ведмідь і німецький орел, такі ідеї небезпечні і безрозсудні."
 LIT_invade_poland:0 "Вторгнення в Польщу"
 LIT_promote_alternative_paramilitaries_desc:0 "Хоча ми хотіли би, щоби наші громадяни вступали до лав офіційних литовських збройних сил, не можна уникнути того, що декотрі з них віддадуть перевагу вірності групі, відокремленій від уряду. Можливо, просуваючи інші групи, такі як Союз литовських стрільців, ми зможемо відвернути деяких націоналістів від вступу до «Залізного вовка»."
 LIT_soviet_mutual_assistance_desc:0 "Польща стала основною метою як СРСР, так і Німеччини, і всім про це відомо. Ходять чутки, що дві держави планують розділити Польщу, і, можливо, ми переконаємо радянців шукати у цій справі литовської підтримки в обмін на повернення Вільнюса своїм законним господарям."
