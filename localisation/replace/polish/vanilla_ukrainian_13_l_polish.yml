 RAJ_hedgemony_of_the_subcontinent_desc:0 "Ми досягли промислового домінування на субконтиненті, відштовхуючи всіх інших, хто міг би претендувати на такий титул. Ми стали неприступними, залишаючи інших відокремлених позаду."
