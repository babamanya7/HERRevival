 CHI_tsr_five_races_under_one_union_desc:0 "Якщо наша нова династія хоче пережити майбутні роки, ми повинні включити принципи Республіки, з якої Юань Шикай прийшов до влади. Завдяки принципам п'ятикольорової республіки можна досягти гармонійного співіснування різних груп регіону в одній нації."
 CHI_tsr_reestablish_the_beiyang_army_desc:0 "Північна океанська армія була створена Юань Шикаєм у 1895 році і виступала центральним елементом загальної перебудови застарілої військової системи Цін. Ми повинні зробити те саме і перебудувати армію, щоб уникнути корупції та неефективності, властивих системі, створеній Гоміньданом."
 CHI_united_front_desc:0 "Щоб мати можливість дати відсіч японській загрозі, ми готові прийняти допомогу від будь-кого — навіть від комуністів."
