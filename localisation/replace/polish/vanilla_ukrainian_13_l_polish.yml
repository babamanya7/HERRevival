 NZL_CAS_equipment_1_short:0 "Hector"
 NZL_GATHERING_STORM_DESC:0 "Ця мала держава на півдні Тихого океану хоробро билася у Великій війні й зазнала великих втрат у кривавих битвах на Галліполі та на західному фронті. Майже половина чоловіків призовного віку служила за морем, і багато з них не повернулися.\n\nЯкісь двадцять років по тому народ Нової Зеландії тривожно дивиться на світову арену, поки загроза війни все ближче підходить до їхнього дому..."
 NZL_anti_tank_equipment_1:0 "QF 2-pounder"
 NZL_arrest_pacifist_leaders:0 "Заарештувати лідерів пацифістів"
 NZL_carrier_3:0 "$ENG_carrier_3$"
 NZL_charlton_automatic_rifle_desc:0 "Один із наших громадян модифікував стандартну гвинтівку «Lee-Enfield», зробивши її повністю автоматичною. Це яскравий приклад винахідливості новозеландців, і ми мусимо заохочувати такі новаторські ініціативи."
 NZL_light_cruiser_4_desc:0 "The Black Prince class was the Canadian designation for British Minotaur-class (or Swiftsure-class) light cruisers. These cruisers were designed as a modified version of the Crown Colony class, incorporating war modifications that were authorized in 1941. They had a longer operational range and more numerous AA weaponry than the Crown Colony class, while the main armament was reduced to three triple turrets. Built too late to affect the outcome of the war, most of the ordered vessels were cancelled afterwards. "
