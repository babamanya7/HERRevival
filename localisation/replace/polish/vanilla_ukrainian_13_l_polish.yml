 SUBDOCTRINE_ARMORED_SPEARHEAD_DESC:0 "Танк дає можливість створити війну руху, а не виснаження. Наша доктрина повинна наголошувати на швидкому використанні проривів для оточення та знищення ворога."
 SUBDOCTRINE_CARPET_BOMBING_DESC:0 "Спроба влучити в точкові цілі з 30 000 футів — це, як правило, марна трата бомб. Політ у лінії та створення широкої смуги руйнування — надійніший спосіб влучити... хоча б у щось."
 SUBDOCTRINE_FLYING_ARTILLERY_DESC:0 "Універсальний підхід до пріоритизації ударів, ураження цілей по всій оперативній глибині, від передової лінії до тилу."
 SUBDOCTRINE_NAVAL_TORPEDO_TACTICS_DESC:0 "Від кількох торпед можна ухилитися. Десятки, запущені одночасно, можуть потопити навіть найміцнішу ціль завдяки чистому об'єму."
