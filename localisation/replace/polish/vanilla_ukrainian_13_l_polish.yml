 CZE_bribery_investigations_desc:0 "Ми отримали анонімний лист щодо харчування та поводження з солдатами. Деякі докази вказують на неналежну поведінку певних офіцерів інтендантської служби. Ми повинні покласти цьому край, поки це не завдало більшої шкоди нашому війську."
