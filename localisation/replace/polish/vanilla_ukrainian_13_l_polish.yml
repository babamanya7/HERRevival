 PAP_democratic:0 "Римська республіка"
 PAR_BLITZKRIEG_DESC:0 "With the Feberista coup successfully ousting Ayala and his liberal cronies, many are now looking to Rafael Franco to avenge the nation's numerous humiliations and once again strike at Bolivia, though this seems all the more unlikely. \n\nSome officers are already plotting to overthrow and replace him with Higinio Morinigo using the aid of the fascist paramilitary organization Guión Rojo, seeking closer ties to the Axis powers."
