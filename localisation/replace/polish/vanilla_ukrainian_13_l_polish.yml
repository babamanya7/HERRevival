 KUB_democratic_party_long:0 "Кубанська рада"
 KUM_VICTORY_POINTS_4704:0 "Кумул"
 KUM_restore_yettishar_desc:0 "Маючи повний контроль над провінцією Сіньцзян, ми тепер повинні прагнути реалізувати амбіції Мухаммеда Якуб-бека та об'єднати мусульманські провінції Північного Заходу."
 KUW_communism_party:0 "КПР"
 KUW_fascism:0 "Диктаторський Кувейт"
 LAO_fascism_DEF:0 "Королівство Луангпхабанг"
 LAT_BEL_autonomy_eu_member_ADJ:0 "Латвійськ"
 LAT_GER_fascism_autonomy_colony_DEF:0 "Райхсланд Леттланд"
 LAT_avenge_the_ancestors_desc:0 "Латвія не знала світла незалежності з часів балтійських племен через нескінченні завоювання німцями, шведами та росіянами. Ми не можемо ризикувати жити ще тисячу років у придушенні — треба змусити всіх іноземних імперіалістів стати перед Латвією!"
 LAT_baltic_stronger_together:0 "Об'єднані, але розділені"
 LAT_belarus_fascism_DEF:0 "Латвійсько-білоруська націоналістична асамблея"
