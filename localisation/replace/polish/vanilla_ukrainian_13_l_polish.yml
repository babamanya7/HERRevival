 ADD_GOAL_TITLE:0 "Додати ціль"
 AFA_neutrality:0 "Султанат Аусса"
 AFG_adopt_nufus_desc:0 "Багатовікова система збору нерегулярних військ для захисту царства вже давно відслужила своє і навряд чи витримає вторгнення професійних ворожих сил. Тому ми повинні замінити цю систему на формальний призов та підготовку."
 AFG_aircraft_organization:0 "Афганська авіаційна компанія"
 AFG_ally_basmachi_remnants:0 "Союз із залишками басмачів"
 AFG_armored_car_equipment_2_short:0 "ACV-IP"
 AFG_axis_airforce_desc:0 "Співпрацюючи тісно з [GER.GetAdjective] повітряними силами, ми вважаємо, що могли б створити функціональні власні сили за їхнім зразком. Все, що нам потрібно, — це обладнання для цього."
 AFG_central_asia_communism:0 "Соціалістичні Республіки Центральної Азії"
 AFG_central_asia_fascism_DEF:0 "Королівство Дар'я"
 AFG_chromite_mines:0 "Створити хромітові шахти"
 AFG_confederation_pak_communism_ADJ:0 "Афгано-пакистанськ"
 AFG_confederation_pak_fascism:0 "Афгано-пакистанський халіфат"
 AFG_crown_the_golden_emir:0 "Коронувати Золотого еміра"
 AFG_darulaman_university:0 "Університет Даруламан"
 AFG_democratic:0 "Королівство Афганістан"
 AFG_development_in_taj_desc:0 "Таджикистан — це тінь того, чим він міг би бути. З інтеграцією в нашу економіку він може стати цінним джерелом алюмінію та інших критично важливих ресурсів для наших зусиль з модернізації."
 AFG_encourage_jezail_production_desc:0 "Джезаїл довгий час був улюбленою зброєю пуштунських племен завдяки його дешевому виробництву, і він був дуже корисним для нас під час Англо-афганських воєн. Ми повинні заохочувати племена підтримувати цю традицію, щоб мати можливість виставити більший військовий збір."
 AFG_enforce_the_pashtunwali:0 "Запровадити Пуштунвалі"
 AFG_future_of_balochistan_desc:0 "Хоча ми співпрацюємо зі Союзниками, ми повинні думати про довгострокову політику нашого регіону. Тому ми повинні наполягати на незалежному Белуджистані, на який ми зможемо впливати, перш ніж його поглине більша держава."
 AFG_industrial_events.20.a:0 "Посилення нашого впливу в регіоні є важливим."
 AFG_infantry_equipment_0_short:0 "Rifle No.1 MkIII"
 AFG_invite_waziristan_rebels:0 "Запросити повстанців Вазиристану"
 AFG_kabul_conference_desc:0 "Після десятиліть боротьби, затиснуті між [ENG.GetAdjective] та [SOU.GetAdjective]s, ми тепер маємо можливість стати поруч із правителями нового світового порядку та вимагати те, що належить нам по праву."
 AFG_look_to_other_partners_tt:0 "Головні нації матимуть можливість інвестувати в [ROOT.GetNameDef], надаючи нам §Yодну зовнішню цивільну фабрику за кожну країну, яка погодиться§! в обмін на §Rвплив на нашу політику протягом одного року.§!"
 AFG_naval_academy_desc:0 "Наш історичний брак узбережжя означає повну відсутність офіцерів з будь-яким військово-морським досвідом. Тому ми повинні створити військово-морську академію та спробувати залучити офіцерів з-за кордону для навчання першого покоління [AFG.GetAdjective] моряків."
 AFG_parliamentary_democracy_tt:0 "§YЯкщо підтримка демократії перевищує 50%, ми уникнемо спричинення громадянської війни.§!"
 AFG_political_events.102.desc:0 "Уряд [FROM.GetNameDef] з жалем відхилив нашу пропозицію про передачу запитаних територій у Східному [PER.GetNonIdeologyName]. Вони висловили занепокоєння щодо наслідків такої передачі та потенційного впливу на регіональну стабільність."
 AFG_political_events.140.b:0 "Завжди послідовного Сардара-шаха Махмуда-хана."
 AFG_political_events.159.t:0 "[FROM.GetNameDefCap] відхиляє план"
 AFG_political_events.53.t:0 "[FROM.GetNameDefCap] погоджується підтримати нас"
 AFG_proclaim_a_new_caliphate_desc:0 "Після розпуску Османської імперії не було оголошено жодного нового халіфату. Щоб вести втрачених і заблукалих, ми повинні взяти на себе цю нову мантію та відповідати спадщині праведних халіфів минулого."
 AFG_requested_our_aid:0 "Афганістан попросив нашої допомоги"
 AFG_return_to_delhi:0 "Повернення до Делі"
 AFG_savior_of_the_holy_lands:0 "Рятівник Святих Земель"
 AFG_spinzar_cotton_factory_desc:0 "Бавовняна фабрика «Спінзар» у Кундузі наразі є однією з наших найприбутковіших фабрик, і її власники прагнуть розширити свій бізнес. Однак без державної підтримки вона не зможе зрости набагато більше свого поточного розміру. Ми повинні прагнути створити нові філії та інвестувати в майбутнє нашої бавовняної промисловості."
 AFG_support_weapons3:0 "Bren Mk. I & ML 3 inch mortar"
 AFG_the_conquerors_of_persia:0 "Завойовники Персії"
 AFG_truck_factory_desc:0 "У партнерстві з нашими [SOU.GetAdjective] благодійниками ми маємо можливість створити нашу першу велику фабрику з виробництва транспортних засобів. Вантажівки, розроблені там, можуть задовольнити внутрішній попит на такі транспортні засоби в промисловості та військових."
 AGENCY_UPGRADE_NEXT_LEVEL:0 "§HНаступний рівень:§!\n"
 AIRWING_CREATE_NO_MANPOWER:0 "§RНе можна створити авіакрило! Для нього недостатньо службових людських ресурсів.§!"
 AIRWING_DISBAND:0 "Розформувати авіакрила"
 AIRWING_MISSION_TYPE_DROP_NUKE:0 "Ядерний удар"
 AIR_BASE_LEVEL_UNKNOWN:0 "§HАвіабаза§! в області $NAME|H$"
 AI_MESSAGE_CAT1_MES6:0 "I bet $OTHER$ didn't even spend 2 hours configuring their OOB. Scrub!"
 ALB_VICTORY_POINTS_833:0 "Дібер"
 ALB_autonomy_collaboration_government:0 "$OVERLORDADJ$а $NONIDEOLOGY$"
 ALB_wiedist_principality_neutrality:0 "Князівство Албанія"
 ALERT_PRIORITY_NORMAL:0 "Нормальний"
 ALG_DEF:0 "Алжир"
 ALLOWED_EQUIPMENT_OF_TYPE:0 "Кількість дозволених типів оснащення в цій категорії."
 ALT_communism_party_long:0 "Горно-Алтайська регіональна більшовицька партія"
 ANU_fascism_DEF:0 "Велике царство айнів"
 AOI_ITA_neutrality_subject:0 "Італійська Східна Африка"
 AOI_communism_ADJ:0 "Італо-ефіопськ"
 ARG_a_true_democracy:0 "Справжня демократія"
 ARG_agricultural_improvements:0 "Покращення сільського господарства"
 ARG_core_conquered_state:0 "Інтегрувати область [FROM.GetName]"
 ARG_corporatism_desc:0 "Корпоратизм є фундаментальною ідеєю фашизму, і ми повинні запровадити його якомога швидше. Однак для цього нам доведеться покладатися на місцеві еліти та таланти та відкрити двері для просування в новій фашистській ієрархії [ARG.GetNameDef]. Ось як ми поведемо нашу країну в майбутнє, наповнене лояльністю та ефективністю."
 ARG_democratic_party_long:0 "Цивільний радикальний союз"
 ARG_economic_reactivation_act_desc:0 "Акт про економічну реактивацію слугуватиме пріоритетом розвитку нашої цивільної інфраструктури, збільшуючи швидкість, з якою ми можемо будувати нові фабрики в містах."
 ARG_fascist_researchers_desc:0 "Оскільки наша країна повільно наближається до фашистського шляху, було б розумно інвестувати в розширення наших національних досліджень. Зрештою, встановлення порядку та лояльності в [ARG.GetNameDef] — це лише початок. Якщо все піде за планом, то нам, можливо, знадобиться набагато сильніша військова технологія, ніж та, яку ми зараз використовуємо."
 ARG_fourth_reich_fascism_DEF:0 "Четвертий Райх"
 ARG_gen_nazism_party_long:0 "Національна гвардія"
 ARG_guardia_nacional_desc:0 "Настав час нам повалити «Конкордансію» і натомість поставити [ARG.GetNameDef] під захист військового уряду. Guardia Nacional боролася за наш суверенітет під час Аргентинської війни за незалежність, і тепер, під керівництвом Педро Пабло Раміреса, вона поведе [ARG.GetNameDef] у нову еру процвітання."
 ARG_improving_the_islands_desc:0 "Тепер, коли ми володіємо Фолклендськими та Південною Джорджією островами, ми повинні зосередитися на покращенні їхньої військової інфраструктури, щоб забезпечити їхнє перебування під нашим контролем."
 ARG_infantry_equipment_2:0 "Hafdasa C-4"
 ARG_light_cruiser_1_desc:0 "The Libertad-class ships were given the designation of 'River Battleship' but were actually more comparable to the smaller, more lightly armed protected cruisers of the early 1900s. Two ships of the class were built in the late 1890s and were still in commission at the start of World War II."
 ARG_military_union_south_america_fascism_DEF:0 "Легіонерська Південна Америка"
 ARG_news_events.1.t:0 "[ARG.GetNonIdeologyName] розпочинає агресивну зовнішню політику"
 ARG_no_fascism_in_south_america_tt:0 "Отримати ціль війни §Y$puppet_wargoal_focus$§! проти всіх §YФашистських§! націй у §YПівденній Америці§!"
 ARG_political_events.10.a:0 "Це було близько..."
 ARG_political_events.102.desc:0 "[FROM.GetNameDefCap] відхилила нашу пропозицію приєднатися до нашого альянсу. Хіба вони не розуміють, що разом ми сильніші? Сподіваємося, вони не пошкодують про день, коли відмовили нам."
 ARG_political_events.110.desc:0 "Схоже, наші страхи стали реальністю, оскільки [FROM.GetNameDef] зайняла агресивну позицію проти [URG.GetNameDef]. Оскільки вони є нашим близьким сусідом, ми не можемо ризикувати втратити їх через іноземну агресію. Якщо ми не будемо обережними, [FROM.GetNameDef] буде стукати і в наші двері."
 ARG_political_events.24.desc:0 "Ми отримали повідомлення від [ARG.GetNameDef] про те, що вони прагнуть запросити нас приєднатися до них в альянс. Вони запропонували поступитися нам Вогняною Землею та Санта-Крус, якщо ми погодимося. Це дуже спокуслива пропозиція..."
 ARG_political_events.33.a:0 "Перемога наша!"
 ARG_political_events.33.desc:0 "Сьогодні Фолклендські та Південна Джорджія острови нарешті потрапили до [ARG.GetAdjective] рук. [ENG.GetNameDefCap] віддала обидва острови в обмін на мир. Ми можемо забезпечити це, особливо тепер, коли ця законна [ARG.GetAdjective] територія нарешті належить нам."
 ARG_political_events.36.t:0 "[ARG.GetNameDefCap] погоджується на мир"
 ARG_political_events.60.desc:0 "[ARG.GetNameDefCap] звернулася до нас, запрошуючи приєднатися до їхнього комуністичного союзу. Чи об'єднаємо ми зусилля з нашими революційними братами?"
 ARG_political_events.75.tt:0 "Ми уклали §YПакт про ненапад§! з [FROM.GetFlag]§Y[FROM.GetNameDefCap]§!!"
 ARG_political_events.8.a:0 "Розчаровує."
 ARG_political_events.90.a:0 "Наші сили міцніші, ніж будь-коли."
 ARG_royal_navy_influence:0 "Вплив Королівського флоту"
 ARG_russian_manufacturers:0 "[SOU.GetAdjective] виробники"
 ARG_ship_light_battery_1:0 "120mm/45 Vickers Mk E"
 ARG_social_welfare_fund_desc:0 "Наш бюджет на витрати на соціальне забезпечення традиційно був дуже низьким. Хоча, дивлячись на можливі прибутки, які приносить збільшення бюджету на соціальне забезпечення, ми починаємо вірити, що, можливо, так не має бути. Створення фонду для витрат на соціальне забезпечення може бути вартим зусиль."
 ARG_the_war_machine_desc:0 "У міру зростання влади нашого нового режиму нам потрібні військові, які б відповідали йому. Вкрай важливо, щоб ми інвестували у створення більшої кількості військово-промислових комплексів по всій країні, а не лише в місті [ARG.capital.GetCapitalVictoryPointName]. Нехай зростає [ARG.GetAdjective] військова машина!"
 ARG_unite_the_workers_of_argentina:0 "Об'єднати робітників Аргентини"
 ARG_us_marine_program_desc:0 "Морські піхотинці США — це елітні війська та символ військової могутності [USA.GetAdjective]. Нам є чого в них навчитися, і тепер, коли ми тісніше співпрацюємо з [USA.GetName], ми маємо можливість це зробити."
 ARG_usa_loan_flag:0 "[USA.GetAdjective]а позика"
 ARG_war_division_desc:0 "Усі війни ґрунтуються на хорошій підготовці. У міру того, як ми створюємо наш кабінет та виробляємо нашу військову машину, ми з кожним днем наближаємося до наших експансіоністських цілей."
 ARMS_AGAINST_TYRANNY:0 "Arms Against Tyranny"
 ARMY_BUTTON_DIV_COMMAND_TOOLTIP_NO_LEADER:0 "$ARMY_NAME|H$\nНема командувача"
 ARMY_LEDGER_THRESHOLD_TECH_COUNT:0 "Кількість армійських доктрин і технологій"
 AST_armored_car_equipment_0:0 "Vickers Crossley"
 AST_artillery_equipment_3:0 "BL 5.5-inch Medium Gun"
 AST_ben_chifley_votes:0 "\n $AST_ben_chifley$: §G+0.01§!"
 AST_cabinet_trust_complete_1_flag:0 "Прийнято рішення: §YСтворити спільного ворога§!"
 AST_centralized_production:0 "Централізоване виробництво"
 AST_civil_war_in_nation_desc:0 "Насіння, яке ми посіяли, готове дати плоди. Підтримка комуністів у [FROM.GetName] зросла до такого рівня, що відкрита революція в межах досяжності. За допомогою фінансування, агітаторів та ретельно спланованого поштовху ми можемо перетворити народне невдоволення на збройне повстання, наблизивши [FROM.GetName] ще на один крок до робітничої держави, на яку вони заслуговують."
 AST_death_from_down_under_taog_desc:0 "З далеких просторів Південної півкулі ми створили військово-повітряні сили, яким немає рівних. Наші літаки літають по всій земній кулі, завдаючи точних та руйнівних ударів, де б не ховалися наші вороги, смерть прийде з півдня."
 AST_diplomatic_events.1.a:0 "Безсумнівно — ні."
 AST_diplomatic_events.26.t:0 "Тихоокеанська Співдружність"
 AST_diplomatic_events.28.t:0 "[ENG.GetLeader] кидає слухавку"
 AST_diplomatic_events.34.t:0 "[AST.GetNameDefCap] пропонує розділити тихоокеанські території"
 AST_diplomatic_events.48.t:0 "Британо-австралійський пакт"
 AST_diplomatic_events.50.a:0 "Допомога [FROM.GetName] буде вітатися."
 AST_diplomatic_events.58.a:0 "Мирним шляхом чи ні, [AST.GetName] розширюватиметься."
 AST_diverse_army_desc:0 "Захист своєї країни — це не лише привілей, але й право. Кожен охочий австралієць матиме змогу записатися на службу, і кожен амбітний солдат повинен мати можливість підніматися в званнях."
 AST_election_events.1.t.a:0 "Перемога ОАП!"
 AST_guaranteed_employment_desc:0 "Соціалізм надто часто відкидають через звинувачення в лінощах або залежності, спрямовані на тих, хто потребує допомоги. Це має припинитися. Все, чого ми прагнемо — це справедливий шанс на працю та справедливу оплату, щоб утримувати наші сім'ї."
 AST_heavy_fighter_equipment_3_short:0 "Mosquito"
 AST_integrate_indonesia:0 "Інтегрувати [INS.GetNonIdeologyName]"
 AST_motorized_equipment_1:0 "Ford F30 AP"
 AST_new_south_wales_government_railways:0 "Урядові залізниці Нового Південного Уельсу"
 AST_political_events.9.a:0 "І ми її займемо."
 AST_prospect_pilbara_iron_decision_desc:0 "Регіон Пілбара має величезні запаси залізної руди, одні з найбільших у світі. Однак у цій надзвичайно віддаленій частині країни інвестиції, необхідні для освоєння цього ресурсу, були б величезними... але, з іншого боку, такими ж були б і прибутки."
 AST_protect_the_homeland_desc:0 "Австралія — велика держава, та її берегову лінію можна захистити. Забезпечення державної безпеки є нашим головним завданням."
 AST_soothing_australian_fears:0 "Заспокоєння австралійських страхів"
 AST_strat_bomber_equipment_2:0 "Avro Lancaster"
 AST_super_heavy_tank_equipment_1_short:0 "Tortoise"
 AST_support_indonesian_uprising:0 "Підтримати індонезійське повстання"
 AST_the_pacific_resistance:0 "Тихоокеанський опір"
 AST_the_winner_takes_it_all:0 "Переможець отримує все"
 AST_union_control_events.2.desc:0 "Агенти австралійського комуністичного уряду прибули в наші міста. Вони не ховаються — біля воріт заводів лунають брошури, на площах звучать промови, а між австралійськими агентами та місцевими радикальними групами встановлюються мережі солідарності. Наявні мережі іноземного впливу нібито активізувалися за одну ніч. Це скоординована кампанія, і уряд повинен вирішити, як реагувати, перш ніж народне невдоволення перетвориться на щось важко кероване."
 AST_union_control_events.3.desc:0 "Робітники [MAL.GetNonIdeologyName] повстали. Комуністичні осередки, які ми підтримували впродовж нашої довгої кампанії, взялися за зброю по всій країні — але картина з місця подій тривожна. Революційні сили опинилися сконцентрованими в невідповідних районах, відрізані від центру півострова водою і джунглями. Без плацдарму на материку уряд просто перечекає їх і заморить революцію голодом ще до того, як вона встигне поширитися. Австралія повинна діяти таємно і швидко, щоб висадити бійців на півострів і дати революції землю, необхідну для виживання."
 AST_we_endured:0 "Ми вистояли"
 ASY_neo_assyrian_empire_communism:0 "Союз ассирійських радянських соціалістичних республік"
 ATTRITION_WEATHER_MODIFIERS:0 "\n - Погодні модифікатори:"
 AT_LEAST_500_FACTORIES:0 "§YКожен член альянсу§!, котрий володіє принаймні §Y500 $arms_factory_pl_ins$, $industrial_complex_pl_ins$ та $dockyard_pl_ins$§! разом узятими"
 AUS_HOL_autonomy_eu_member_DEF:0 "Європейські Нідерланди"
 AUS_STATE_152:0 "Оберьостеррайх"
 AUS_VICTORY_POINTS_11411:0 "Штаніслау"
 AUS_VICTORY_POINTS_6562:0 "Ольмюц"
 AUS_VICTORY_POINTS_6626:0 "Тріест"
 AUS_aligned_with_our_values:0 "Відповідають нашим цінностям"
 AUS_anti_FROM_speech_decision:0 "Влаштувати мітинг проти [FROM.OWNER.GetAdjective]ого уряду"
 AUS_bleiberger_mines_developed:0 "Модернізувати шахти Блайбергу"
 AUS_demand_hungarian_submission_desc:0 "Довгий час ми процвітали як подвійна монархія разом із Угорщиною в виді Транслайтанії. Хоча ця домовленість спрацювала тоді, вони виявилися менш вправними до державного самоуправління, ніж ми, і ті дрібниці, що вони зробили для нашої нації, залишало бажати кращого. Зробивши їх нашим маріонетковим режимом, ми могли б мати найкращі частини подвійної монархії, уникаючи найгірших."
 AUS_follow_the_jansa_plan_desc:0 "Досвідчений фельдмаршал Альфред Янса вже давно працює над планом захисту Австрії у разі нападу Німеччини. З огляду на нинішню ситуацію в світі, здається, нам, на жаль, може знадобитися цей план."
 AUS_invite_spanish_exiles_desc:0 "Ми... сподівалися на інший кінцевий результат громадянської війни в Іспанії. Подібно до того, як ми пропонували свою допомогу на полі бою, тепер ми повинні запропонувати свою допомогу в інших місцях і прийняти тих, хто тікає від панування націоналістів."
 AUS_light_ship_bonus_desc:0 "Нашим кораблебудівникам не знадобилося багато часу, щоб прискорити виробництво невеликих кораблів і підводних човнів. Стандартизувавши ці методи, ми зможемо побудувати значний флот для захисту нашого узбережжя."
 AUS_news_events.11.t:0 "[AUS.GetNameDefCap] формує Дунайський Блок"
 AUS_offer_nap_decision:0 "Запропонувати країні [FROM.OWNER.GetNameDef] пакт про ненапад"
 AUS_osterreichische_akademie:0 "Австрійська Академія"
 AUS_osterreichische_fallschirmsjager:0 "Österreichische Fallschirmjäger"
 AUS_osterreichische_seebataillon:0 "Österreichisches Seebataillon"
 AUS_political_events.1.c:0 "Wiener Bankverein не підведе нас."
 AUS_political_events.12.t:0 "[FROM.GetNameDefCap] пропонує нам піхотне спорядження"
 AUS_political_events.122.a:0 "Фантастично, наш флот знову стане легендарним!"
 AUS_political_events.122.t:0 "Гул [ROOT.GetAdjective]ий субмарин?"
 AUS_political_events.15.t:0 "[FROM.GetNameDefCap] забороняє про-німецьку НСРП"
 AUS_political_events.16.t:0 "Нацисти в уряді"
 AUS_political_events.2.b:0 "Ми покриємо виплати з держбюджету!"
 AUS_political_events.28.t:0 "Гаранти дають зелене світло на наше переозброєння"
 AUS_political_events.41.desc:0 "[FROM.GetAdjective] уряд з ентузіазмом відгукнувся на наше прохання приєднатися до них і вітає нас у своєму альянсі. Ми більше не будемо боротися поодинці з тими, хто нам загрожує!"
 AUS_political_events.43.a.tt:0 "Держава §Y[Get43PuppetOrNotTt]§! вірогідно буде примушена вступити в [FROM.GetAdjective]кий альянс"
 AUS_political_events.49.desc:0 "Світ навколо нас змінюється із зростанням напруженості. Причому настільки, що сьогодні ми отримали повідомлення, в якому [FROM.GetAdjective]ий уряд вимагав У НАС передати їм Сілезію. Сілезія історично була частиною їхньої колишньої імперії, після закінчення Великої війни опинилася під нашим контролем і з тих пір залишається під нашим контролем.\n\nАвстрія запропонувала фінансувати будівництво кількох заводів в обмін на землі Нижньої та Верхньої Сілезії в надії, що це може полегшити наше рішення."
 AUS_political_events.57.a:0 "Варто було спробувати."
 AUS_political_events.64.a:0 "Який приємний сюрприз!"
 AUS_political_events.65.a:0 "Неважливо, все одно це буде нам корисно!"
 AUS_political_events.66.desc:0 "[FROM.GetLeader] із держави [FROM.GetNameDef] звернувся до нас із незвичайною пропозицією. У міру того, як міцніє наша федерація, стає все більш важливим, щоб усі залучені країни безперебійно працювали разом. Для спрощення цієї задачі, [FROM.GetLeader] запропонував нам об’єднатися під прапором їхньої країни.\n\nЗа ціну поступок з нашого боку щодо суверенітету, ми, як частина однієї федеративної нації, також насолоджувалися безпекою, яка приходить із більшою армією та інтенсивнішою дипломатичною діяльністю."
 AUS_political_events.76.t:0 "Гаранти погоджуються на перегляд Договору із призначенням наглядача"
 AUS_political_events.81.desc:0 "Протягом тривалого часу австрійці вперто дотримувалися власної форми комунізму, яку вони звуть «австромарксизмом». Цей маячня являє собою форму поєднання соціал-демократії та справжнього комунізму, їх ідеології було явно не по нашому щляху. Здається, тепер вони нарешті схаменулися та скасували цей сюрреалістичний безлад, щоб приєднатися до нас у спробі отримати нашу підтримку, оскільки вони сподіваються на наш захист у випадку нападу ворожих сил на них."
 AUS_protector_of_the_danube:0 "Вартовий Дунаю"
 AUS_rapid_revolutions:0 "Стрімка революція"
 AUS_rapid_revolutions_desc:0 "Хоча наша ситуація погіршилася через наші дії щодо спроб звільнення іноземних робітників і забезпечення для них засобів виробництва, часу на відпочинок немає. Ми повинні якнайшвидше звільнити наших товаришів від кайданів капіталізму, навіть якщо це призведе до легкого, тимчасового удару по добробуту нашого народу."
 AUS_reintegrate_FROM_switzerland_decision:0 "Реінтегрувати [FROM.GetName]"
 AUS_repeal_the_habsburgergesetz_desc:0 "Закон Габсбургів був прийнятий у 1919 році після Великої Війни та суттєво обмежив права та повноваження родини Габсбургів. Незалежно від того, хто зараз керує нашою країною, цей закон став плямою на репутації Астрії як монархії, його потрібно негайно скасувати."
 AUS_seek_to_purchase_alaska_desc:0 "У 1867 році Олександр II запропонував нам придбати Аляску. Тоді ми пропустили цю пропозицію, адже не бачили в цьому сенс. Однак часи змінилися, і нам варто звернутися до власника Аляски, щоб спробувати домовитися про угоду."
 AUS_subjugate_lands_of_old_desc:0 "Вирішивши негайну проблему, ми маємо розпочати зв до наших колишніх кордонів. Хоча ми повністю віримо в наших дипломатів, і якщо до цього дійде, — армії -, було б мудро з нашого боку спланувати таке розширення поетапно, замість того, щоб розпочинати самогубний наступ по всім фронтам."
 AUS_tighten_control_of_subjects_tt:0 "Якщо §YОтто фон Габсбург§! є нинішнім правителем §Y[ROOT.GetNameWithFlag]§!, будуть відкриті рішення для §YВстановлення Габсбургської монархії§! в державах §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! і §Y[POL.GetNameWithFlag]§! як тільки ми їх підпорядкуємо."
 AUS_union_of_danubian_socialist_republics_desc:0 "Зараз наш вплив поширюється по всій Європі, оскільки робітники навколо нас рвуть кайдані неволі. Наше старе ім’я більше не описує того, ким ми є насправді, нам слід подумати про те, як ми хочемо бути відомими цьому світу."
 AUS_union_of_danubian_socialists_communism:0 "Союз Дунайських Соціалістів"
 AUS_universitat_graz_desc:0 "Університет у Граці приніс нам багато світлих умів і кількох лауреатів Нобелівської премії. Тісніша співпраця з університетом могла б значно пришвидшити наші власні дослідження."
 AUS_volkschule:0 "Народні школи"
 AUS_war_against_bolshevism:0 "Війна з більшовизмом"
 AZR_democratic:0 "Азербайджанська демократична республіка"
 BALTIC_crush_forest_brothers_desc:0 "Лісові брати — сіль у нашому оці з тих самих пір, як ми прийшли до влади. Вони саботують наше виробництво, ламають залізниці і заважають офіційним урядовим демонстраціям. Ми мусимо вирушити в ліси держави [Root. розправитися з цими заблудлими."
 BALTIC_events.1.t:0 "[From.GetNameDefCap] шукає гарантії"
 BALTIC_events.11.a:0 "Зрадники!"
 BALTIC_events.2.a:0 "Ми приєднаємось до них!"
 BALTIC_events.5.t:0 "[From.GetNameDefCap] бажає заснувати [From.GetAdjective]о-білоруську державу"
 BALTIC_events.601.b:0 "Зрештою, вони мають право на самовизначення."
 BALTIC_rebuild_forts:0 "Відбудувати укріплення в області [Root.Capital.GetName]"
 BALTIC_renew_allied_trade_desc_default:0 "З самого зародження нашої держави ми сподівалися на торгову та військову підтримку Британії, і було б нерозумно зараз від неї відмовлятися. Щоб пережити тиск німців та росіян на наші кордони, ми мусимо залучити інвестиції Союзників у країну."
 BAL_UNIFIED_fascism:0 "Балтійська унітарна держава"
 BAS_autonomy_collaboration_government_DEF:0 "$OVERLORDADJ$і $NONIDEOLOGY$"
 BBA_african_union_events.14.desc:0 "[FROM.GetLeader] оголосив про вихід [FROM.GetNameDef] з Організації Африканської Єдності. Вони висловили занепокоєння щодо напрямку, в якому рухається організація, та звинуватили нас у зраді цінностей, на яких вона була заснована."
 BBA_ethiopia_balance_of_power_events.01.t:0 "Правління оспорене"
 BBA_ethiopia_balance_of_power_events.25.desc:0 "Оскільки ми все більше централізуємо політичний та економічний контроль над державою [ETH.GetName], залишається велика тривога щодо військових. Якщо вони підуть проти нас, у нас буде мало шансів протистояти їхнім вимогам. Тому ми почали вводити до складу збройних сил політичних офіцерів, щоби гарантувати, що в армії не буде ніяких несанкціонованих ідей."
 BBA_ethiopia_communist_events.04.desc:0 "[SOV.GetName] погодилися надіслати нам матеріальну допомогу протягом найближчих місяців, а також дозволили 'добровольцям' зі складу [SOV.GetAdjective] армії воювати разом із нами в боротьбі проти [ITA.GetName]. Це, безумовно, змінить хід війни на нашу користь, але неясно, як [ITA.GetAdjective] відреагують на участь [SOV.GetAdjective] військ."
 BBA_ethiopia_communist_events.08.b:0 "Звісно, ми допоможемо."
 BBA_ethiopia_communist_events.30.b:0 "Перемога вже близько — не зупинятися!"
 BBA_ethiopia_communist_events.30.desc:0 "Представники [ETH.GetNameDefCap] звернулися до нас із проханням про припинення вогню у нашому поточному конфлікті. Війна не завершилася так швидко, як ми сподівалися, і це дає нам можливість зміцнити свої позиції в регіоні або зосередитися на інших нагальних питаннях."
 BBA_ethiopia_communist_events.37.b:0 "Ми не повинні тиснути на них."
 BBA_ethiopia_communist_events.46.b:0 "У нас немає вибору, як погодитися."
 BBA_ethiopia_exile_events.10.desc:0 "Під час зустрічі з [ROOT.GetAdjective]им Міністром закордонних справ у тимчасовій резиденції [FROM.GetLeader], [FROM.GetLeader] попросив передати [FROM.GetName] під владу [FROM.GetName] всі сомалійські землі, оскільки в Ефіопії вже проживає велика кількість сомалійського населення, а прикордонні суперечки були одним з приводів для початку конфлікту. Передача всіх цих територій [FROM.GetNameDef], на думку [FROM.GetLeader], усунула б цю причину для майбутнього конфлікту."
 BBA_ethiopia_exile_events.41.t:0 "[FROM.GetAdjective]е посередництво"
 BBA_ethiopia_exile_events.51.a:0 "Це явно [GER.GetAdjective]а змова."
 BBA_ethiopia_fascist_events.05.desc:0 "Місія до [FROM.GetAdjective]ого штабу пройшла з великим успіхом. [ITA.GetLeader] схвалив план повстання та погодився на збереження напівавтономної держави після війни. Треба поспішати з початком повстання, поки вони не передумали."
 BBA_ethiopia_fascist_events.22.a:0 "Ми виграємо нашу свободу."
 BBA_ethiopia_fascist_events.66.desc:0 "[ITA.GetName] великодушно погоджується передати нам запитувані території. Це знаменує початок нової епохи в італо-[ETH.GetAdjective] відносинах."
 BBA_ethiopia_imperial_events.1.t:0 "[FROM.GetName] хоче придбати Джібуті"
 BBA_ethiopia_imperial_events.7.b:0 "Вони зовсім з глузду з'їхали."
 BBA_ethiopia_industrial_financial_events.5.a:0 "Це на користь усім."
 BBA_italo_ethiopian_war_events.10.a:0 "Цілком правильне рішення."
 BBA_italo_ethiopian_war_events.121.a:0 "Це свідчить про новий старт для Африки."
 BBA_italo_ethiopian_war_events.204.a:0 "Перемога вже близько."
 BBA_italo_ethiopian_war_events.500.c:0 "Ми занадто багато боролися!"
 BBA_italo_ethiopian_war_events.502.desc_territories:0 "Італійський уряд відхилив нашу вимогу укласти мир із державою [ETH.GetNameDefCap] в обмін на частину наших колоніальних територій. Це свідчить лише про те, що з такими злочинцями не може бути ніяких угод!"
 BBA_italy_anti_colonialism_events.01.b:0 "Ми звільнимо робітників Ефіопії!"
 BBA_italy_anti_colonialism_events.01.f:0 "Ми повинні покласти край деспотичному правлінню [ETH.GetLeader]!"
 BBA_italy_anti_colonialism_events.13.a:0 "Звучить непогано!"
 BBA_italy_bop.3.desc:0 "Наші переможні сили відвоювали [?ITA.ITA_reclaimed_core.GetName], піднявши дух італійців по всьому світу! Це може стати моментом, коли ми переломимо хід війни та витіснимо ворогів з нашої Батьківщини — [ITA.GetNameDef]."
 BBA_italy_civil_war.6.t:0 "Незалежність для [ROOT.GetNameDef]"
 BBA_italy_interaction_events.24.t:0 "Німеччина намагається анексувати Австрію"
 BBA_italy_interaction_events.28.b:0 "Якщо вони укладуть мир з [ETH.GetNameDefCap]"
 BBA_italy_interaction_events.44.t:0 "[FROM.GetName] запрошує нас до альянсу"
 BBA_italy_interaction_events.45.t:0 "[FROM.GetName] приймає нашу пропозицію"
 BBA_italy_interaction_events.5.t:0 "Коронація принца Аймоне"
 BBA_italy_interaction_events.50.t:0 "Італійська пропозиція"
 BBA_italy_interaction_events_news.2.a:0 "Дивовижно."
 BBA_italy_local_rulers.1.desc:0 "Хайле Селассіє Гугса, командувач абіссинської армії, а також член імператорської сім'ї, звернувся до нас з надією укласти угоду. Це дійсно великий момент для нас і принизливий для абіссинців. Хоча ми можемо скористатися цією нагодою і використати її для власної вигоди, було б мудро пам'ятати, що ця людина є зрадником в очах багатьох абіссинців, тому підтримувати його слід з певними застереженнями."
 BBA_italy_local_rulers.2.b:0 "Зробити $ETH_abba_jofir$ губернатором регіону."
 BBA_italy_local_rulers.3.t:0 "$ETH_hailu_tekle_haymanot$ звертається до італійських урядовців"
 BBA_italy_local_rulers.4.a:0 "Надання деяких поступок могло б задовольнити місцевих жителів."
 BBA_italy_missiolinis.03_north.desc:0 "Муссоліні висловлює лише хвалу та захоплення арміями на півночі Абіссінії та їхнім успіхом у відтісненні своїх лютих ворогів. Він, звісно ж, ніколи не сумнівався в доблесті наші солдатів — допоки в них є належна мотивація від свого дуче та для знаряддя для здобуття перемоги."
 BBA_italy_missiolinis.123.a:0 "За минулу та майбутню славу!"
 BBA_italy_missiolinis.72.desc:0 "Дуче планував, що збірка нових літаків стане потужним символом пропаганди, але тепер йому довелося скоротити свої початкові наміри. Відсутність великої кількості нових літаків розлютила дуче, і тепер він шукає винуватців цього фіаско."
 BBA_italy_naval_cooperation_programs.01.b:0 "Італійці не мають що нам запропонувати."
 BBA_italy_naval_cooperation_programs.11.a:0 "Ми вдячні за цей жест!"
 BBA_italy_second_italo_ethiopian_war.3.a:0 "Ми переломимо хід війни!"
 BBA_swiss_expansion.16.b:0 "Вони стануть незалежною країною разом із нашими альпійськими регіонами"
 BBA_swiss_expansion.8.t:0 "[FROM.GetAdjective] уряд погодився на нашу вимогу щодо свободи [848.GetName]"
 BBA_switzerland.2.b:0 "Приховати все, завербувати його як агента!"
 BBA_switzerland_fascist.5.a:0 "Чудово"
 BBA_switzerland_trade.12.t:0 "[FROM.GetNameDefCap] захоплює наші золоті резерви!"
 BBA_switzerland_trade.13.t:0 "[FROM.GetName] хоче, щоб ми інвестували в їхню країну"
 BECOME_SPY_MASTER_COOLDOWN:0 "§RІнша країна очолила розвідмережу нашого альянсу менш ніж $COOLDOWN|H$ дн. тому. Зачекайте до $DATE|H$, щоби отримати можливість стати новим керівником.§!"
 BECOME_SPY_MASTER_COST:0 "Вартість §Hочолення розвідмережі§!: £pol_power $VALUE$."
 BEG_fascism_ADJ:0 "Фунджійськ"
 BEL_GER_fascism_autonomy_colony_DEF:0 "Райхсланд Бельгія"
 BEL_anti_tank_equipment_1:0 "47mm Model 1931"
 BEL_better_than_maginot_desc:0 "Наші укріплення повинні стати не лише світовими лідерами, а й світовими переможцями. Ми ніколи не знаємо, звідки прийде наступний напад, тому ми повинні бути готові до всього. Нам потрібно будувати траншеї, підтримувані траншеями, бункери поверх бункерів, і найголовніше — нам потрібно більше зброї. Багато зброї. Великої зброї."
 BEL_british_guarantee_desc:0 "Наші добрі стосунки з [ENG.GetNameDef] ніколи не були таємницею, тому давайте зробимо ці відносини офіційними та надамо взаємні військові гарантії."
 BEL_chasseurs_ardennais_ncns_tt:0 "§Y$ranger_battalion$§!:\n§YПагорби§!:\n Фактична зміна руху: §G+10%§!\n Фактична зміна атаки: §G+15%§!\n Фактична зміна захисту: §G+15%§!\n§YГори§!:\n Фактична зміна руху: §G+5%§!\n Фактична зміна атаки: §G+5%§!"
 BEL_early_helicopters:0 "Ранні гелікоптери"
 BEL_expedite_fort_construction:0 "Прискорити будівництво укріплень"
 BEL_expression_of_belgian_unity_desc:0 "Культури, що складають [BEL.GetAdjective] ідентичність, є нашою найбільшою силою, адже саме з різних ідеалів, поглядів і навіть мов ми можемо знайти справжнє розуміння. Те, що нас розділяє, об'єднує нас."
 BEL_fonderie_royale_de_canons_liege_desc:0 "Заснована Наполеоном Бонапартом у 1803 році, коли Льєж був частиною Франції, королівська збройова кузня в Льєжі є основним розробником важкого озброєння в Бельгії. Завдяки високій якості металургії в регіоні, важка артилерія має певну славу, і ці виробничі потужності лише чекають на подальші інвестиції для розширення наших можливостей."
 BEL_free_belgian_forces:0 "Вільні бельгійські сили"
 BEL_government_in_exile_tt:0 "Відкриває §Y$BEL_government_in_exile_cat$§! для посилення легітимності [ROOT.GetName] та спротиву."
 BEL_increased_length_of_service_desc:0 "У зв'язку з зростанням напруженості у світі та нашим стратегічним положенням між військовими гігантами ми повинні продемонструвати готовність захищати себе і забезпечити нашу територіальну суверенітетність. Тому ми підвищимо рівень готовності наших резервів та збільшимо тривалість служби для тих, хто зараз перебуває на службі."
 BEL_infantry_equipment_1_short:0 "Mauser M35"
 BEL_invest_congo_diamonds_into_construction_decision:0 "Оплатити будівельні фірми готівкою з алмазів [COG.GetNameDef]"
 BEL_investigate_bribery_charges_desc:0 "Звинувачення в корупції не залишають уряд, і вимоги до розслідування посилюються. Леон Дегрель, лідер фашистів Рексистів, навіть прямо звинуватив самого Поля ван Зееланда в отриманні хабарів."
 BEL_legacy_of_the_belgian_airforce_desc:0 "Наші пілоти вважались одними з найсміливіших серед тих, хто бився над полями боїв Великої війни, і ця горда традиція зберігається і сьогодні."
 BEL_light_tank_destroyer_equipment_2:0 "T13 B1/B2"
 BEL_mio_trait_excellent_machining_tools:0 "Excellent Machine Tools"
 BEL_our_southern_neighbour:0 "Наш південний сусід"
 BEL_prisoner_king_desc:0 "Король Леопольд III, бажаючи відбувати покарання разом з його народом, вирішив залишитися в [BEL.GetNameDef] як полонений. Тепер названий «Король у полоні», його народ зустрів цей крок схваленням і почав об'єднуватися навколо його прикладу в ці важкі часи."
 BEL_raise_the_red_flag:0 "Підняти червоний прапор"
 BEL_request_equipment_decision:0 "Попросити оснащення в держави [FROM.GetNameDef]"
 BEL_soviet_guarantee_tt:0 "Вони будуть більш схильні §Gприйняти§!, якщо ми завершимо §Y$BEL_raise_the_red_flag$§!."
 BEL_transport_plane_equipment_1_short:0 "F.VII"
 BHR_fascism_ADJ:0 "Бахрейнськ"
 BHU_communism_ADJ:0 "Бутанськ"
 BIA_fascism_DEF:0 "Великий Ігболенд"
 BLI:0 "Балі"
 BLR_GER_autonomy_dominion:0 "Біла Русь"
 BLR_GER_fascism_autonomy_puppet_DEF:0 "Райхспротекторат Остланд"
 BM_ENCIRCLEMENT_PENALTY:0 "Штраф від оточення"
 BM_ENVELOPMENT_PENALTY:0 "Кілька нападників"
 BOL_bolivian_irredentism:0 "Болівійський іредентизм"
 BOL_communism:0 "Лівацька Болівія"
 BOP_CHANGE_RATE_DAILY:0 "$VALUE|2%H$ за день"
 BOS_DEF:0 "Боснія"
 BOS_neutrality:0 "Боснія"
 BRA_const_kingdom_democratic_ADJ:0 "Бразильськ"
 BRA_counter_influence_cat:0 "Протистояння комуністичним впливам"
 BRA_defense_spending_desc:0 "Світ палає, і жодна країна більше не може вважати себе в безпеці. Тому ми повинні збільшити наші витрати на оборону країни. Чи то на заводи, які виробляють нашу зброю, чи то на будівництво нових укріплень, ми захистимо суверенітет Бразилії, навіть якщо це буде останнє, що ми зробимо!"
 BRA_empire_of_brazil_desc:0 "З владою, надійно закріпленою в руках монарха та призначених ним міністрів, настав час відновити колишню славу нації. Першим кроком до цього буде відновлення Імперії Бразилії та повернення до традиційних цінностей, на яких вона була побудована."
 BRA_establish_trade_relationships:0 "$CHL_establish_trade_relationships$"
 BRA_federal_employment_plan:0 "Федеральний план працевлаштування"
 BRA_good_neighbor_decisions:0 "Політики доброго сусіда"
 BRA_greater_federalism:0 "Більший федералізм"
 BRA_greater_federalism_desc:0 "Централізація політичної влади несумісна з нашими демократичними цінностями. Ми повинні зламати задушливий контроль політичної еліти в місті [ROOT.Capital.GetCapitalVictoryPointName] та повернути владу штатам республіки."
 BRA_invest_in_road_infrastructure:0 "Інвестувати в дорожню інфраструктуру"
 BRA_italian_cooperation:0 "Розподіл Африки між [ITA.GetAdjective] та [ROOT.GetAdjective]"
 BRA_military_party:0 "Армія"
 BRA_oil_industry_bonus:0 "Бонус до нафтової промисловості"
 BRA_oust_prestes_desc:0 "Комуністичним суспільством не повинні керувати лише кілька осіб. Хоча, безумовно, існують країни, які керують таким чином, ми боїмося, що це буде лише питанням часу, перш ніж ці країни перетворяться на культи особистості. Задля запобігання цій долі, ми повинні, щоб рада Національного визвольного альянсу взяла під контроль політичні справи країни."
 BRA_romanticize_the_old_empire_desc:0 "Не бракує незадоволених політиків, бізнес-лідерів чи громадян, які з тієї чи іншої причини бажають побачити кінець цієї невдалої республіки. Можливо, об'єднавшись навколо нашої імперської історії та минулої слави, ми зможемо згуртувати їх усіх в єдиний злагоджений рух."
 BRA_ship_armor_cruiser_1:0 "31-мм пояс/19-мм палуба"
 BRA_ship_heavy_battery_1:0 "30.5 cm/45 Elswick L"
 BRA_smash_democracy_desc:0 "Буржуазна демократія та капіталізм продовжують руйнувати права та умови життя багатьох південноамериканців. Ми повинні зробити все можливе, щоб звільнити наших товаришів по всьому континенту від їхніх гнобителів."
 BRA_strong_military_influence:0 "Сильний вплив армії"
