 taog_news.1.desc:0 "Королева Вільгельміна вчора зробила заяву в [1058.GetName], оголосивши про несподіване створення держави Нідерландсько-Індонезійського Союзу. Поки батьківщина перебуває під окупацією, уряд [HOL.GetAdjective] у вигнанні та адміністрація [INS.GetAdjective] погодилися керувати як єдине ціле під владою Корони. Чиновники обох країн описують цей крок як вимушений захід, а не вибір, як відчайдушну спробу зберегти єдність і авторитет Королівства на двох континентах."
 taog_news.1.t:0 "Світанок союзу Нідерландів та Індонезії"
 targeted_sabotage_destroy_bridge_desc:0 "Місцеве опір виявило міст, який особливо важливий для постачання в цьому регіоні. Наші агенти обрушать його, заклавши кілька фунтів потужної вибухівки."
 tfv_australia.22.d:0 "Не визнаючи свого нестабільного положення в геополітичному ландшафті Тихого океану, [From.GetAdjective]ий уряд відмовився від нашої пропозиції зробити Нову Зеландію однією з головних провінцій держави [Root.GetNameDef].\nНе розуміючи, що вони є лише британськими собачками, [From.GetAdjective]ий прем'єр-міністр [From.GetLeader] процитував принципи [From.GetAdjective]ої «свободи та незалежності».\n\nЗдається, ми мусимо нагадати державі [From.GetNameDef], що саме ми маємо на увазі, описуючи їхню позицію як «геополітично нестабільну»."
 tfv_australia.31.t:0 "[Root.GetNameDefCap] як глобальний лідер"
 tfv_australia.95.desc:0 "Протягом останніх тижнів по всій Індонезії спостерігається помітне зростання націоналістичної агітації. За оцінками розвідки, кількість прихильників націоналістів зросла до загрозливих розмірів. Особливе занепокоєння викликають повідомлення про те, що деякі націоналістичні лідери відкрито обговорюють можливість збройного повстання. Просто вчора військовий корабель перехопив підозріле рибальське судно південніше від Яви. На борту було виявлено зброю та набої без офіційного маркування. Допит екіпажу поки що не дав жодних результатів, але схоже, що хтось намагається підняти бунт."
 tfv_canada.30.t:0 "Синархістська революція"
 tfv_canada.50.d:0 "Сьогодні на одному з наших заводів стався вибух, і хоча спочатку здавалося, що це був нещасний випадок на виробництві, розслідування показало, що вибухівка була навмисно розміщена вздовж виробничих ліній.\n\nХоча ми оплакуємо загибель людей, напад на військовий комплекс не можна ігнорувати.\n\nХто би не стояв за цим нападом, він становить загрозу для всієї держави [Root.GetNameDef]!"
 tfv_canada.62.t:0 "Імперська пиха"
 tfv_canada.70.t:0 "[FROM.GetNameDefCap] хоче союз із Ньюфаундлендом"
 tfv_new_zealand.3.desc:0 "Нашій делегації довелося вислухати довгу лекцію голови Комінтерну, який пояснював, що така маленька країна, як наша, не може бути розвиненою індустріальною державою, здатною здійснити комуністичну революцію. Ми, мабуть, є чимось іншим. У будь-якому разі, ми не можемо бути частиною Комінтерну."
 tfv_new_zealand.4.t:0 "[From.GetNameDefCap] хоче долучитися до нашої справи"
 tfv_new_zealand.92.desc:0 "[Root.GetAdjectiveCap]а делегація до держави [From.GetNameDef] повернулася з невтішною новиною: [Root.GetNameDef] не отримає жодної з [From.GetAdjective]их територій у Полінезії."
 tfv_raj.211.desc:0 "Всього через кілька тижнів після першого вибуху раптово було зруйновано другу фабрику, знову ж таки відразу після того, як робітники вийшли з головної будівлі на обід. Немає жодних сумнівів, що це робота організованої групи опору, яка проводить добре сплановану кампанію саботажу та тероризму. Зухвалі напади серед білого дня свідчать про те, що нападники, схоже, дуже впевнені в собі."
 tfv_south_africa.101.d:0 "Звільнившися з-під влади колоніальних гнобителів, [ALG.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [ALG.GetAdjective]ого уряду."
 tfv_south_africa.12.desc:0 "У Південній Африці спалахнули запеклі бої між націоналістами та юніоністами. Націоналісти, які значно переважають чисельно та озброєні, звернулися до нас, батьківщини своїх предків, за підтримкою."
 tfv_south_africa.14.t:0 "[HOL.GetAdjective]а відповідь"
 tfv_south_africa.2.t:0 "[From.GetNameDefCap] погоджується"
 tfv_south_africa.31.d:0 "[From.GetAdjectiveCap]ий уряд мудро вирішив дозволити нам мирну окупацію Мадагаскару."
 tfv_south_africa.60.d:0 "Звільнившися з-під влади колоніальних гнобителів, [ANG.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [ANG.GetAdjective]ого уряду."
