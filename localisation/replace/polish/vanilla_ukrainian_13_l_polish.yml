 NOR_nortraship:0 "Nortraship"
 NOR_pilot_training:0 "Навчання пілотів"
 NOR_rebuild_the_royal_navy_desc:0 "Ми далеко від нашої країни, тому дістатися до неї знову, мабуть, доведеться морем. Відбудова Королівського флоту рівнозначна відбудові нашої нації."
 NOR_rikstanken_turret:0 "Імпровізована башта"
 NOR_ship_light_battery_2:0 "120 mm/44 Bofors"
 NOR_submarine_fleet:0 "Флот підводних човнів"
 NOR_support_finland_in_winter_war_desc:0 "Більшовики йдуть до Фінляндії, і ми не маємо підстав вірити, що вони на цьому зупиняться. Ми повинні підтримати наших фінських братів проти червоного ведмедя на сході, перш ніж він нас усіх пожер."
 NOR_the_administrative_council:0 "Адміністративна рада"
 NOR_the_royal_norwegian_navy:0 "$NOR_royal_navy_dmod$"
 NOR_the_seeds_of_the_revolution_desc:0 "Капіталізм створив засоби для свого власного знищення, і ось тут ми вступаємо. Тепер наше завдання посіяти зернята яскравішого майбутнього серед народів [NOR.GetName]. Тоді ми чекатимемо свого часу, поки ми не зможемо пожинати плоди нашої власної праці."
 NOTIFICATION_MILESTONE_UNLOCKED:0 "Віха доктрини відімкнена"
 NOTIFICATION_OUR_GENERAL_CAPTURED_DESC:0 "Непохитно ведучи наші війська в бою, §H[This.GetName]§! потрапи[This.GetVerbGendEndA_RU] у полон до [From.GetAdjective]их сил і ста[This.GetVerbGendEndA_RU] в'язнем держави §H[From.GetNameDef]§!. За нашими відомостями, [This.GetHerHis] втримують у: $LOCATION|H$."
 NOT_ENOUGH_TASK_FORCES_FOR_CONVOY_ESCORT_DETAILED:0 "Оперативна група супроводу не готова, якщо вже бере участь у бою або пішла на ремонт."
