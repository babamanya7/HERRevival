 RAJ_forging_the_mughal_arsenal_desc:0 "Війни минулого були виграні палицями та камінням, ці дні минули. Якщо наша імперія має протистояти великим державам сучасного світу, ми повинні побудувати промислову базу, здатну підтримувати величезну військову машину. Складальні лінії гудітимуть від звуку промисловості, і незабаром наші армії маршируватимуть зі зброєю, викованою нашими власними руками."
 RAJ_forward_bloc:0 "Передовий блок"
