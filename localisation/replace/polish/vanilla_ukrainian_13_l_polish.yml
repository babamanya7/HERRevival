 GRE_following_in_the_footsteps_of_giants_desc:0 "Метаксас показав нам деякі з вигод фашизму, але виявився занадто боягузливим, щоб пройти з нами до кінця. Нам потрібен свій справжній фашизм — грецький фашизм, а не якась дешева копія італійської чи німецької моделі."
