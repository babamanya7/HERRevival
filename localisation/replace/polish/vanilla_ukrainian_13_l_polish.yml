 RULE_OPTION_NOR_FASCIST_AI_DESC:0 "ШІ дозволить фашизму з часом посилити свій вплив і зрештою приєднається до Третього Райху або діятиме самостійно, якщо Німеччина перестане бути фашистською."
 RULE_OPTION_SECOND_REPUBLIC_DESC:0 "Демократичний уряд Іспанії збереже §HДругу республіку§!, відхиляючи як фашизм, так і комунізм."
