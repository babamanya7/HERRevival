 ETH_take_DJI_cancel_tt:0 "\n§RБуде скасовано, якщо $FRA_VICHY_fascism$ більше не контролює Французький Сомаліленд або розмістила дивізії в області!§!"
 ETH_take_loans:0 "Особисті позики"
 ETH_volunteers_desc:0 "По всьому світу пригноблені народи дивляться на [ETH.GetName] як на символ надії в боротьбі проти непереборної імперіалістичної агресії. Тепер люди з-за меж нашого кордону почали гуртуватися під прапорами [ETH.GetAdjective], щоби боротися разом з нами. Здається, все ще є ті, хто не бажає, щоб мрія про свободу була знищена через примхи [ITA.GetLeader]."
