 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc:0 "Під час вирішального випробування катастрофічний вибух сколихнув полігон, знищивши гармату та завдавши значних руйнувань прилеглій інфраструктурі. Команда [Character.GetName] з'ясовує причини вибуху та ліквідує наслідки інциденту, зокрема пильну увагу громадськості та ймовірні затримки в графіку проєкту."
