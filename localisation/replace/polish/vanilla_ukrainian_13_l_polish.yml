 RAJ_break_the_zamindars_desc:0 "Поміщики — це кістяк старого режиму.\nМи демонтуємо їхні маєтки, конфіскуємо їхню землю та розвіємо їхню владу по вітру."
 RAJ_burn_down_the_cellular_jail_desc:0 "Центральна в'язниця є образою для кожного, хто коли-небудь боровся за незалежність Індії, її потрібно знищити."
 RAJ_chindits_desc:0 "Індії потрібна група спецпризначенців, тому ми створили «Чіндітів». Вони діють у глибокому ворожому тилу серед джунглів Азії. Це небезпечна операція, і виживуть лише небагато, але вона може сильно вплинути на перебіг війни."
