 MEX_decision_attend_public_mass_desc:0 "Протягом двадцяти років мексиканські президенти відкрито чи мовчазно вороже ставилися до церкви. Кілька простих жестів можуть зробити великий внесок у примирення наших політичних і релігійних систем."
