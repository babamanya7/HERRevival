 SOV_two_red_flags_desc:0 "Хоча революція в Китаї не зовсім вдалася, це не є несподіванкою. Країна ще не має індустріального суспільства, необхідного для справжньої соціалістичної революції. Тим не менш, комуністична партія є найкращим шансом для китайського народу досягти комуністичного майбутнього."
 SOV_undermine_stalins_authority:0 "Підірвати авторитет Сталіна"
 SPA_absorb_carlist_remnants_desc:0 "Оскільки карлізм майже переможений, менш фанатичні елементи фракції все ще можуть бути корисними на передовій. Ми не повинні дозволити цій нагоді пройти повз нас — кожен здатний орган, який ми зможемо зібрати, сприятиме цілям Фаланги в цілому."
 SPA_activate_burgos_fifth_columnists:0 "Задіяти п'яту колону у Бургосі"
 SPA_destroyer_2_desc:0 "The Spanish Churruca class included sixteen destroyers launched between 1925 and 1933, two of which were later sold to Argentina. The ships were designed based on the British S-class destroyers and made up the backbone of the Spanish Navy during the Civil War. They displaced over 1,500 tons and were armed with five 120mm/45 Vickers-Armstrong guns in their main armament, as well as six 533mm torpedo tubes. They had good speed and excellent range. "
