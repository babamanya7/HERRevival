 YUG_contest_the_adriatic_desc:0 "Захист наших берегів починається в морі, що лежить за ними. Ми повинні розробити нову морську тактику та стратегію, щоб вирвати контроль або принаймні боротися з Адріатичним морем."
 YUG_coronation_desc:0 "Наш народ давно без короля, і нам час виставити вічність корони. Коронуючи нашого короля в соборі Білого Міста, ми дамо нашому народу впевненість, що корона вічна і ми не впадемо перед іноземними загарбниками."
 YUG_expand_the_submarine_fleet:0 "Розширити підводний флот"
 YUG_fighter_equipment_3:0 "Ikarus S-49"
 YUG_fortress_yugoslavia_desc:0 "Ми не можемо допустити, щоби нацистська загроза на нашому кордоні залишилася без контролю! З італійцями в Зарі та німцями в Австрії ми повинні гарантувати, що наші кордони захищені, а солдати на них мають усе необхідне для боротьби з фашистами."
 YUG_light_tank_equipment_1_short:0 "LT M34"
 YUG_modernize_the_air_force_desc:0 "Наші ВПС страшенно застаріли. Якщо ми хочемо мати хоч якийсь розумний шанс захистити повітряний простір над нашою власною територією, а тим більше вести бій із ворогом, нам потрібна рішуча програма модернізації."
 YUG_motorize_the_cavalry_desc:0 "Нові розробки в автомобільній інженерії революціонізували швидкість і мобільність армійських підрозділів. Наші кавалерійські підрозділи повинні відмовитися від коней і натомість використовувати вантажівки."
