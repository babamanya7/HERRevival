 COG_recall_fredrik_valdemar_olsen_to_active_service:0 "Відкликати Фредріка-Вальдемара Ольсена назад до активної служби"
 COG_recall_leopold_de_koninck_to_active_service:0 "Відкликати Леопольда де Конінка назад до активної служби"
 COG_societe_nationale_chemins_du_congo_desc:0 "З огляду на те, наскільки велика наша країна, було б важливо створити національну агенцію, яка займатиметься нашими численними залізницями, більшість з яких нині знаходяться в поганому стані, щоб наша країна могла бути більш зв'язана, ніж будь-коли раніше."
