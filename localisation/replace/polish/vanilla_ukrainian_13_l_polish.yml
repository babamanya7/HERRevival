 CHL_crown_antoine_as_sovereign_king:0 "Коронувати Антуана як суверенного короля"
 CHL_crusade_against_imperialism_desc:0 "Нарешті настав час, коли ми готові вийти на весь світ в ім'я справедливості! Настав час показати занепалим європейцям, що ми більше не будемо лягати під них. Озброймо чоловіків, бо цього разу ми принесемо їм боротьбу!"
 CHL_devalue_the_peso:0 "[CHL_devalue_the_peso_key]"
 CHL_dissolve_covensa:0 "Розпустити COVENSA"
 CHL_electing_a_toqui_tt:0 "Ми зможемо вибрати лідера з унікальною рисою."
 CHL_enlarge_the_textile_industries:0 "Збільшити текстильні індустрії"
 CHL_escalate_the_laguna_del_desierto_issue_desc:0 "Демаркація навколо Лагуна-дель-Десьєрто є дуже нечіткою і до того ж упередженою на користь аргентинців. Ми мусимо просунутися, щоби зайняти ту частину регіону, яка належить нам по праву, і, можливо, навіть зайти трохи далі."
 CHL_expand_chilean_forestry_decision:0 "Розширити лісництво в області [279.GetName]"
 CHL_expand_the_mountain_regiments_desc:0 "Найбільш елітні війська, якими ми володіємо, — це наші спеціалізовані гірськострілецькі полки, придатні для жорстоких боїв у будь-якій точці країни. Ми мусимо зробити обов'язковими для наших генералів ротацію та тренування з цими військами, а також забезпечити їх будь-яким спеціальним обладнанням, яке їм може знадобитися."
 CHL_honor_the_legacy_of_caupolican:0 "Ушанувати спадщину Кауполікана"
 CHL_ibanez_as_prime_minister_desc:0 "Немає сумнівів, що Антуан III не може правити повністю одноосібно, оскільки йому бракує державного мислення і знань, які має Ібаньєс. Тому монархія має бути конституційною."
 CHL_ibanezs_coup:0 "Переворот Ібаньєса"
 CHL_integrate_southern_france:0 "Відновити правління в південній Франції"
 CHL_introduce_the_franc_desc:0 "Чилійський песо — слабкий і неплатоспроможний, а також асоціюється зі старою чилійською державою. Ми мусимо прагнути запровадити франк, щоби замінити цю валюту на краще для нації."
 CHL_invite_peter_adolf_ceasar_to_chile:0 "Запросити до Чилі Петера Адольфа Цезаря Гансена"
 CHL_joint_invasion_of_mexico:0 "Спільне вторгення в Мексику"
 CHL_la_corporacion_araucania:0 "La Corporación Araucana"
 CHL_news_events.1.a:0 "Безумовно, цікавий розвиток подій"
 CHL_political_events.10.b:0 "Ми не підкоряємося таким слабким, як вони"
 CHL_political_events.24.desc:0 "[SOV.GetLeader] оголосив сьогодні політбюро, що Союз відхилив наш запит на приєднання до їхньої фракції, заявивши, що це загрожуватиме глобальній безпеці та порушить баланс між ними та їхніми ворогами у невигідний спосіб."
 CHL_political_events.3.desc:0 "Підлий [ARG.GetLeader] відхилив наш справедливий і розумний запит на спільну заявку до союзників, і настав час йому усвідомити, що він втратив. Ми все одно сильніші самі по собі, і вони ніколи не були нам потрібні..."
 CHL_political_events.35.a:0 "Разом ми здобудемо перемогу"
 CHL_political_events.37.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] нерозумно вирішив відхилити нашу пропозицію про приєднання до нашої фракції, Іспанського альянсу. Бог судитиме їх згодом."
 CHL_political_events.40.a:0 "Ну що ж..."
 CHL_political_events.42.desc:0 "[URG.GetLeader] сьогодні офіційно оголосив про свою відставку з посади президента [URG.GetNameDef] і передає владу підтримуваному [GER.GetAdjective] Арнульфу Фурману."
 CHL_political_events.44.desc:0 "Нерозумний [URG.GetLeader] вирішив виступити проти нового світового порядку, задуманого [CHL.GetAdjective] та [GER.GetAdjective] мислителями й політиками. Він не бачить, як накочується хвиля, і він не побачить, як вона розіб'ється об берег."
 CHL_political_events.47.a:0 "Підписано та скріплено печаткою"
 CHL_political_events.49.a:0 "Разом ми здобудемо перемогу"
 CHL_political_events.59.desc:0 "Боягузливі [ARG.GetAdjective] війська відступили після провокацій наших прикордонників, і наші солдати почали входити у майже покинуту провінцію Санта-Крус. Ми здобуваємо перемоги на всіх фронтах і повинні молитися, щоб усе не рухнуло найближчим часом."
 CHL_political_events.61.desc:0 "[CHL.GetLeader] з [CHL.GetNameDef] заявив, що ми надто довго загрожуємо безпеці [CHL.GetAdjective] народу, і що настав час покласти цьому край, стверджуючи, що необхідно, щоб ми приступили до демілітаризації регіону Патагонії. Як ми відповімо на це?"
 CHL_political_events.63.desc:0 "[FROM.GetLeader] засудив наші явні провокації і заявив, що легко побачити, що наш намір цими діями — швидко і легко напасти на них, коли вони будуть беззахисними. Однак, нам це не потрібно, щоб перемогти."
 CHL_political_events.64.a:0 "У нас є більш нагальні проблеми, на жаль. Ембарго має бути достатнім."
 CHL_political_events.7.a:0 "Це не віщує нічого доброго"
 CHL_political_events.8.d:0 "Сьогодні раніше відбулося коротке повстання артилерійського полку Такна, очолюване генералом Аріосто Еррерою. Еррера відомий як прихильник колишнього президента Карлоса Ібаньєса дель Кампо і, здається, перебував під сильним впливом свого часу військовим аташе в Італії. 21 травня 1939 року, коли генерал Еррера прибув до Президентського палацу на церемонію, він побачив червоний прапор, що висів на одному з балконів, і раптово схопив його та зірвав, і це був перший раз, коли проти нього виникла справжня підозра. Незважаючи на все це, він не мав широкої підтримки, і все знову в порядку."
 CHL_political_events.82.d:0 "Равсон — хороший східний кандидат"
 CHL_political_events.87.t:0 "[FROM.GetName] приймає наш запит"
 CHL_propose_closer_cooperation_tt:0 "Усі §Yкомуністичні держави§! в §YПівденній і Центральній Америках§! отримають подію, в якій від них вимагається підкорення."
 CHL_public_works_desc:0 "Відтоді, як США закрили свої кордони та припинили експорт, наша економіка була зруйнована, а люди розкидані. Щоби якомога ефективніше оговтатися від цієї катастрофи, ми мусимо заохочувати широкомасштабні програми громадських робіт, подібні до американського «Нового курсу», щоби наші люди знову знайшли роботу, а економіка знову запрацювала."
