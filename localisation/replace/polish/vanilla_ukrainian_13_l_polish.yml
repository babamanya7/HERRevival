 PRC_adopt_sun_yat_sens_principles_desc:0 "Принципи Сунь Ятсена: націоналізм, демократія та добробут — аж ніяк не суперечать комуністичним цінностям, яких ми прагнемо. Його бачення того, що стабілізований Китай може розвиватися далі, тепер може бути реалізоване."
