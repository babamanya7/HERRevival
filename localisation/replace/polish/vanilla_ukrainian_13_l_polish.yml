 PER_communist_events.2.a:0 "Ми подвоїмо наші зусилля."
 PER_communist_events.7.t:0 "[FROM.GetNameDefCap] відмовляється від виведення"
 PER_communist_events.9.desc:0 "Здається, недавня бравада [FROM.GetNameDef] була розбита нашою непохитною прихильністю захищати наші інтереси в цьому районі. У принизливій промові [FROM.GetLeader] підтвердив своє непохитне бажання підтримувати мир у регіоні. Їхні союзники, ймовірно, оговтуються від очевидної відмови від [FROM.GetAdjective] принципів."
 PER_communist_naval_bomber_design_desc:0 "За допомогою наших [SOU.GetAdjective] друзів ми майже готові розгорнути сили військово-морських бомбардувальників, які знищать будь-який флот, настільки нерозумний, щоб зайти в Перську затоку без нашого дозволу."
 PER_czech_tanks_desc:0 "Перш ніж ми зможемо думати про проєктування та виробництво власних механізованих сил, ми повинні звернути увагу на нації, які відомі своїм виробництвом танків. Звернувшись до [CZE.GetNameDef], ми можемо отримати ліцензію на виробництво танків з їхнього знаменитого Škoda Works."
 PER_establish_motor_arms:0 "Створити автомобільну збройову промисловість"
 PER_establish_nuclear_program:0 "Створити [PER.GetAdjective] ядерну програму"
 PER_expert_raiders:0 "Досвідчені рейдери"
 PER_finding_a_shah_tt:0 "Ми зможемо обрати, хто стане новим шахом [ROOT.GetNameDef], у наступній події."
 PER_foreign_policy_events.3.desc:0 "Ми отримали дипломатичну ноту від [FROM.GetNameDef], яка пропонує спільну військову операцію проти [PER.GetNameDef]. [FROM.GetAdjective] командування стверджує, що ця операція дозволить нам забезпечити іранські нафтові родовища та наші лінії постачання до [FROM.GetNameDef], водночас запобігаючи потенційному наступу ворога з [TUR.GetNameDef] через [PER.GetName] до бакинських нафтових родовищ та [RAJ.GetNameDef]."
 PER_glory_of_cyrus:0 "Слава Кіра Великого"
 PER_imperial_events.10.a:0 "У нас немає іншого вибору, окрім як піддатися їм."
 PER_imperial_events.120.desc:0 "Сьогодні вранці ми отримали повідомлення від [PER.GetAdjective] уряду з наміром здатися та розпочати процес капітуляції. В рамках цього вони готові дозволити нам окупувати їхні землі, поки вони зберігають свою монархію як маріонеткового лідера. Як ми відповімо?"
 PER_imperial_events.140.desc:0 "[FROM.GetLeader] оголосив, що [FROM.GetNameDef] більше не прийматиме [ROOT.GetAdjective] сюзеренітет. [FROM.GetNameDefCap] бажає підтримувати добрі стосунки з [ROOT.GetNameDef], якщо це можливо, але [FROM.GetLeader] заявляє, що вони готові взятися за зброю та боротися за свою незалежність, якщо це необхідно."
 PER_imperial_events.220.b:0 "Можливо, Форугі буде кращим варіантом?"
 PER_invite_oil_nations_desc:0 "ОПЕК був успішним у створенні прибутку для світового ринку нафти, але наша організація має засоби для зростання. Давайте звернемося до інших нафтовидобувних націй по всьому світу та попросимо їх об'єднатися з нами в ОПЕК."
 PER_islamic_council:0 "Ісламська рада"
 PER_middle_east_protectorate_faction:0 "Протекторат Близького Сходу"
 PER_national_iranian_radio:0 "[ROOT.GetAdjective] національне радіо"
 PER_persian_empire_ADJ:0 "Перськ"
 PER_plant_resistance_cat_desc:0 "Якщо ми хочемо збільшити наші шанси на успіх у превентивному ударі проти наших ворогів, ми повинні працювати над тим, щоб держави, які межують з нами, мали власні проблеми у вигляді про-[PER.GetAdjective] груп опору та осередків."
 PER_rally_behind_mosaddegh:0 "Згуртуватися навколо Мосаддика"
