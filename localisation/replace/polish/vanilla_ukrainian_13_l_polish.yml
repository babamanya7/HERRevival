 FIN_communism_party_long:0 "Фінляндська комуністична партія"
 FIN_crack_down_on_the_military:0 "Розправитися з військовими"
 FIN_expansion_towards_the_atlantic_desc:0 "[ROOT.GetAdjective]і кораблебудівники відпливуть до Атлантики, розширивши свої військово-морські можливості та побудувавши більші кораблі, щоб передати силу через океан. З додаванням лінійних кораблів і авіаносців ВМС [ROOT.GetName] стати силою, з якою потрібно рахуватися на світовій арені."
 FIN_finnish_democratic_republic_ADJ:0 "Фінськ"
 FIN_finno_soviet_kinship_war_desc:0 "Під час російської громадянської війни фіни брали участь у своїх споріднених війнах, під час яких вони вторглися на нашу територію, щоб вкрасти у нас наші землі, а тепер вони знову почали робити те саме."
 FIN_improves_nokia_designer_tt:0 "\nВплив на §Y$FIN_nokia$§! Промисловий дизайнер:"
 FIN_infantry_equipment_2_short:0 "Suomi KP/-31"
 FIN_instigate_a_new_karelian_uprising:0 "Створити нове карельське повстання"
 FIN_jet_fighter_equipment_1:0 "VL Pyörremyrsky"
 FIN_long_range_patrols_desc:0 "Тепер, коли [ROOT.GetAdjective]а армія стикається з викликами сучасної війни, патрулі дальньої дії стануть важливим елементом розвідки та диверсій. Ці висококваліфіковані підрозділи спеціалізуються на проникненні в лінію противника, зборі розвідданих і розпочинати нищівні раптові атаки, що робить їх ключовим активом у військових зусиллях."
 FIN_maan_turva_desc:0 "Тільки шляхом ретельного моніторингу населення ми можемо переконатися, що не відбувається зради чи підривної діяльності. У свою чергу, ми можемо захистити режим і забезпечити, щоб держава не була знищена зсередини."
 FIN_military_aid:0 "Військова допомога"
 FIN_military_research:0 "Військові дослідження"
 FIN_modernize_production_lines:0 "Модернізація виробничих ліній"
 FIN_neutrality_party_military_long:0 "Безпартійний військовий уряд"
 FIN_our_snipers_will_be_more_deadly_tt:0 "Наші §Yснайпери§! стануть іще небезпечнішими."
 FIN_prepare_a_military_coup_desc:0 "[FIN.GetNameDef] потребує сильного, рішучого керівництва, здатного приймати важкі рішення під час кризи. Єдині люди, які зараз здатні на це, — це військові. Замість того, щоб чекати, поки держава розпадеться під керівництвом демократів і соціалістів, ми закладе основу для військового перевороту."
 FIN_prepare_construction_workers_actions:0 "Підготувати дії будівельників"
 FIN_pressure_country_government_baltic:0 "$SOV_pressure_country_government_baltic$"
 FIN_push_for_cabinet_participation_desc:0 "Соціалістів не допускають до кабінету з 1929 року. Настав час чинити тиск на [ROOT.GetLeader], щоб він нарешті поважав принципи парламентаризму."
 FIN_search_for_weapon_caches_decision_cost_cp:0 "£command_power §Y[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
 FIN_ship_armor_cruiser_1:0 "55-мм пояс/20-мм палуба"
 FIN_socialist_welfare_if_leino_tt:0 "\nВпливає, якщо §Y$FIN_yrjo_leino$§! буде призначено лідером країни до завершення цього фокусу:"
 FIN_suomalainen_sosialismi_desc:0 "Жахливе нещастя капіталізму продовжує пронизувати наше суспільство через контрреволюційне спустошення, розв'язане Маннергеймом та його союзниками під час громадянської війни. Ми не можемо допустити цього, ми повинні знайти спосіб звільнити робітничий клас."
 FIN_the_merchant_fleet_desc:0 "У рамках військових зусиль торговельний флот [ROOT.GetName] повинен бути в змозі йти в ногу, щоб забезпечити транспортування життєво важливих припасів, де це необхідно. Інвестуючи у виробництво нових суден, ми можемо посилити нашу здатність підтримувати себе і захищати свою позицію в будь-якому конфлікті."
 FIN_we_will_be_more_likely_to_put_down_the_finnish_snipers_tt:0 "Полювання на фінських снайперів з великою ймовірністю буде успішним"
 FIN_winter_warfare_desc:0 "Готуйтеся до найгіршого, бийтеся як найкращі. Нам потрібно зміцнити шляхи постачання для суворих зимових умов і навчити наші війська витримувати холод і продовжувати боротьбу на передовій."
 FOCUS_AND_PREREQ_HAS:0 "§G- $FOCUS$§!\n"
 FOCUS_FILTER_MEX_CAUDILLO_REBELLION:0 "Повстання каудільйо"
 FOCUS_SIDE_MESSAGE_UNLOCKED_DESC:0 "$FOCUS|H$ було виконано державою $ORIGINATOR|Y$."
 FOCUS_STATUS_COST:0 "$TOT|0$ дн."
 FOREIGN_EXILE_TEMPLATE_DESC:0 "Це — шаблон держави $COUNTRY|H$, чий уряд у вигнанні розміщений у нас. Ми можемо скопіювати цей шаблон і створити війська вигнанців на їхній основі. Війська з цим шаблоном братимуть людські ресурси від відповідного уряду у вигнанні."
 FOR_fascism_DEF:0 "Держава Формоза"
 FRA_CAS_equipment_2:0 "Loire-Nieuport LN.401"
 FRA_VICTORY_POINTS_13068:0 "Лувен"
 FRA_air_ground_cooperation_desc:0 "Бойові дії в повітрі дають реальні військові результати, лише якщо вони переслідують ціль на землі. Чим краще ми поєднуємо битву в повітрі та битву на землі, тим ефективніше ми стаємо."
 FRA_armored_car_at_equipment_short:0 "V.S. 207"
 FRA_coup_in_indochina:0 "Підготувати переворот в Індокитаї"
 FRA_coup_in_west_africa_desc:0 "Багато французів у Західній Африці прагнуть знову боротися із загарбником. Треба лише вийти з ними на зв'язок."
 FRA_cv_CAS_equipment_1_short:0 "Ni.140"
 FRA_dp_ship_secondaries:0 "130mm/45 Model 1932 DP"
 FRA_fighter_equipment_0_short:0 "NiD 62"
 FRA_flying_artillery_desc:0 "У сьогоднішніх битвах, що стрімко розвиваються, повільні артилерійські установки на землі можуть не встигати. Літаки з бомбами можуть взяти на себе їх роль."
 FRA_foreign_guest_workers_desc:0 "Нестача працівників є основною перешкодою в розширенні нашої промисловості та зростанні наших збройних сил. Запрошення кваліфікованих робітників з наших союзників працювати на наших заводах вивільняє робочу силу для відправки в армію."
 FRA_france_first_desc:0 "Ми — Франція! Переможці Великої війни! Рятівники Європи! Наша країна дала світові найвидатніших мислителів. Забагато націй бажають занурити світ у хаос, а отже, людству потрібні ми. І ми відгукнемося на поклик. Ми встанемо біля керма, подолаємо шторми та виведемо людство на потрібний курс!"
 FRA_french_forces_of_the_interior_desc:0 "Спротив має тисячі людей під зброєю по всій Франції. Коли ми і наші союзники просуваємося по всій країні, ми змітаємо їх і перетворюємо на солдатів нашої армії."
 FRA_french_union:0 "Французький союз"
 FRA_general_work_council_desc:0 "Ми створимо національне агентство для розгляду суперечок між роботодавцями та найманими працівниками, а також для забезпечення найефективнішого працевлаштування наших працівників."
 FRA_go_with_britain_reject:0 "Відхилили приєднання Франції в Союзники"
 FRA_gw_armored_car_equipment_short:0 "S15"
 FRA_heavy_armor_focus_desc:0 "Виробництво танків — запорука успіху французької армії. Ми хочемо контролювати поле бою, а це неможливо без нових потужних танків!"
 FRA_heavy_tank_equipment_1_short:0 "B1"
 FRA_infantry_equipment_3:0 "MAS-40"
 FRA_je_suis_la_deluge_desc:0 "Французька революція була потопом, який знищив старі та слабкі режими, які так довго контролювали Європу. Тепер тут новий потоп."
 FRA_military_factories_desc:0 "Наша військова промисловість буксує. Потрібно зосередитися на виробництві військової техніки та боєприпасів на рідній землі, щоб у нашої армії не було перебоїв із новим озброєнням."
 FRA_motorized_focus:0 "Акцент на моторизацію"
 FRA_panhard_organization:0 "$FRA_panhard$"
 FRA_pre_empt_the_fascist_attack:0 "Запобігти нападу фашистів"
 FRA_promise_independence_to_west_africa:0 "Пообіцяти незалежність Західній Африці"
 FRA_scuttle_the_fleet_desc:0 "Іноземні сили намагаються силою взяти під контроль наші військово-морські сили. Ми не можемо допустити, щоб це сталося, і повинні затопити наші кораблі!"
 FRA_syria_intervention.3.desc:0 "Просування союзників у Сирію застопорилося, і військам режиму Віші вдалося зміцнити лінію оборони. Навіть після безлічі добре скоординованих атак сили союзників не змогли зрушити обороняючихся з місця. Обидві сторони окопалися і домовилися про припинення вогню. райони досі перебувають під контролем режиму Віші."
 FRA_tac_bomber_equipment_0:0 "Bloch MB.200"
 FRA_the_regiment_normandie_desc:0 "Дуже важливо, щоби ми, французи, воювали на всіх фронтах. Оскільки совєти зараз брали участь у боротьбі проти нашого спільного ворога, ми могли відправити невелику групу льотчиків-винищувачів на допомогу."
 FRA_west_africa_intervention.2.desc:0 "Після серії невдалих штурмів і запеклих боїв місцевий командир союзників зупинив наступ у районі і наказав військам, що залишилися без захисту, відступати на території, більш придатні для оборони. Вішісти об'єднали сили і закріпилися в ключових."
 FREQUENCY_WEEKLY:0 "щотижня"
 FSA_communism:0 "Південний Ємен"
 FUEL_DAILY_GAIN:0 "Щоденний приріст: $NUM|H$"
 GAM_neutrality_DEF:0 "Ісламська республіка Гамбія"
 GARRISON_CONF_AIRBASE:0 "Захищати §Hавіабази§!"
 GBA_democratic:0 "Гамбельська федерація"
 GDC_autonomy_sea_integrated_warlord_subject_DEF:0 "Провінція Гуандун"
 GEN_STATE_89:0 "Штаніслау"
 GEO_DEF:0 "Грузія"
 GER_HERMANN_GORING_WERKE_NAME_FASCIST:0 "Hermann Göring-Werke"
 GER_STATE_67:0 "Обершлезіен"
 GER_VICTORY_POINTS_3581:0 "Еперіес"
 GER_align_czechoslovakia_desc:0 "Чехословаччина багата на індустріальні можливості та природні ресурси, будучи однією з центральних територій індустріалізації в Австро-Угорщині. Ми повинні залучити їх до Міттелеуропи, щоб скористатися їхніми багатствами."
 GER_align_italy:0 "Налагодити відносини з Італією"
 GER_align_italy_desc:0 "Італія могла зрадити нас під час Великої війни, але ми не повинні забувати, що у них є вражаючий флот, який може скласти конкуренцію нашим ворогам. Тому ми повинні відновити наші старі союзницькі відносини з ними."
 GER_ascended_character_trait_swap_tt:0 "§Y$CHARACTER$§! підноситься у §YВнутрішньому колі§!:"
 GER_ascension_of_todt:0 "$GER_inner_circle_member_title$ Тодт"
 GER_battleship_4:0 "Клас «Hindenburg»"
 GER_befriend_turkey:0 "$GER_turkey_friend$"
 GER_bring_turkey_into_the_fold:0 "Повернути [TUR.GetNameDef] до складу"
 GER_bulwark_against_bolshevism:0 "[GER.GetBulwarkName]"
 GER_carve_up_congo:0 "Поділ Конго"
 GER_case_yellow_netherlands_desc:0 "Атака через Бельгію змушує нас йти через занадто вузький фронт. Ми повинні розширити наш військовий план, щоб включити Нідерланди, щоб уникнути помилок, зроблених у 1914 році."
 GER_civil_liberties:0 "Громадянські свободи"
 GER_concentrated_armament_program:0 "Зосереджена програма переозброєння"
 GER_destroyer_3_desc:0 "Есмінці «Zerstörer 1936A», відомі союзникам як есмінці класу «Narvik», були спроєктовані під нові 150-мм (5,9-дюйм.) гармати. Спершу їх було спроєктовано з трьома одинарними гарматами на кормі та спареною гарматою в носовій частині, але згодом було оснащено однією гарматою в носовій частині. Пізніше чотири з восьми кораблів класу були переобладнані здвоєними баштами. Друга група з семи есмінців була побудована за дещо зміненим проєктом зі спареними гарматами в носовій частині."
 GER_division_france_infantry_tt:0 "Ветеранська частина §Y33. SS-Waffen-Grenadier-Division Charlemagne§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_establish_eastern_grand_duchies:0 "[GetEasternDuchiesName]"
 GER_expand_generalgouvernement_adminsitrative_area:0 "Розширити адміністративну зону Генерал-губернаторства"
 GER_expand_kriegsmarinewerft_fascism:0 "Kriegsmarinewerft"
 GER_expand_the_reichsautobahn_east_tt:0 "Буде додано §G1§! рівень §Yінфраструктури§! в областях §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[807.GetName]§!, §Y[85.GetName]§! і залізницю §Y1-го§! рівня від області §Y[63.GetName]§! до §Y[85.GetName]§!, якщо §Y[ROOT.GetName]§! або підлеглий Німеччини контролює області. Нинішній ефект:"
 GER_fascism_leader_title:0 "фюрером"
 GER_germaniawerft_organization:0 "$germaniawerft$"
 GER_glorious_mechanical_machinations:0 "Славетні механічні винаходи"
 GER_has_capitulated_to_germany:0 "капітулював перед державою §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!, §Y[ROOT.GetAdjective]ою маріонеткою§! або §Yсоюзником§!"
 GER_heavy_cruiser_3:0 "Клас «Prinz Eugen»"
 GER_heavy_tank_equipment_2:0 "Panzerkampfwagen VI Tiger"
 GER_heavy_tank_equipment_3:0 "Panzerkampfwagen Tiger Ausf. B"
 GER_heavy_tank_equipment_3_short:0 "King Tiger"
 GER_industrial_relocation_cat:0 "Переміщення промисловості"
 GER_influence_balkans_neutrality_decision:0 "$GER_influence_baltics_decision$"
 GER_intrigue_replacing_advisor_new_ascending_tt:0 "§Y$CHARACTER$§! підноситься у §YВнутрішньому колі§! як:\n$IDEA$.\n§Y$CHARACTER$§! зможе завершити фокус §Y$FOCUS$§!. §Y$CHARACTER_2$§! і §Y$CHARACTER_3$§! більше не намагатимуться виконати свої взаємовиключні фокуси."
 GER_italy_ally_desc:0 "Досвід Великої війни показав, що покладатися на італійців не можна, але тепер там є Муссоліні та його фашисти; отже, для Італії не все втрачено. Чи може бути вигідно Німеччині взяти Італію до союзників?"
 GER_light_tank_aa_equipment_3_short:0 "FlakPz 1602"
 GER_medium_tank_aa_equipment_3_short:0 "Wirbelwind"
 GER_mio_trait_racing_pedigree:0 "Гоночний родовід"
 GER_mitteleuropa_desc:0 "Головна сфера інтересів німецького народу — Центральна Європа. Початково задумана пруссаками як пангерманська імперія, ця ідея потребує доопрацювання, але є хорошою основою для створення нового європейського порядку."
 GER_mitteleuropa_economic_integration_decision:0 "Запропонувати економічну інтеграцію державі §Y[FROM.GetName]§!"
 GER_nationalize_ford_factories_desc:0 "Захоплення заводів Ford в області [51.GetName] і передача їх під контроль держави зміцнить наш промисловий потенціал і забезпечить стабільне постачання життєво важливого озброєння та транспортних засобів для підтримки наших збройних сил і логістики."
 GER_operation_1:0 "Unternehmen Walküre"
 GER_organize_worker_rally_decision:0 "Організувати робітничий мітинг"
 GER_our_place_in_the_sun_ww:0 "Наше місце під сонцем"
 GER_peoples_republic_communism_DEF:0 "Народна республіка Німеччина"
 GER_plan_z_desc:0 "Адмірал Редер переконаний, що найпростіше розгромити англійців за допомогою морських рейдів. Для цього доведеться побудувати безліч лінкорів та авіаносців, що вимагатиме часу... можливо, забагато часу. З іншого боку, зараз наш флот виглядає просто жалюгідним."
 GER_prepare_for_the_next_naval_blockade_desc:0 "Ми знаємо, що сталося минулого разу, коли ворог мав флот більший за наш. Тепер, маючи більше знань, ми можемо заздалегідь підготуватись і уникнути тих самих помилок."
 GER_proletarian_dictatorship_desc:0 "Щоб забезпечити нашому народу найкращі можливості й рівень життя, нам потрібне стабільне керівництво, що діє в інтересах народу. [ROOT.GetLeader] — давній борець за пролетаріат і має всі якості для цієї ролі."
 GER_re_establish_the_landwehr_desc:0 "Ландвер існує з 1813 року й був ефективним засобом самооборони, зокрема за Ваймарської Республіки. Ми також маємо створити власні підрозділи Ландверу та Ландешутцену."
 GER_rebuild_the_nation:0 "Відбудова нації"
 GER_recruit_asian_schutztruppe_smaller_tt:0 "Мобілізувати одну дивізію §YAsiatische Schutztruppe§! в обраному регіоні\n"
 GER_reichskommissariat_grossbritannien:0 "Райхскомісаріат Велкиа Британія"
 GER_reichskommissariat_kaukasien:0 "Райхскомісаріат Кавказія"
 GER_reorganize_secret_services_desc:0 "$GER_wilhelm_canaris$ показав себе неефективним, або навіть відверто нелояльним до нинішнього уряду. Нам потрібно усунути його та реорганізувати Абвер у більш компетентну установу."
 GER_strengthen_the_welfare_state_desc:0 "Наша держава давно відома як соціальна, і ми не збираємось це змінювати. Ми повинні залишатися вірними своїм принципам і забезпечити нашому народові якомога кращі умови життя."
 GER_subduing_the_baltic_states:0 "Підкорення Балтійських держав"
 GER_subduing_the_baltic_states_tt:0 "Отримати три підрозділи §Yпіхоти Балтійського ландесверу§!.\nЯкщо §YПольща§! не §YВідновила бермонтіанців§!, §YРюдігер фон дер Гольц§! приєднається до нас як фельдмаршал 3 рівня."
 GER_tactical_bombers:0 "Тактичні бомбардувальники"
 GER_thalmann_freed_from_prison_tt:0 "§YЕрнст Тельман§! звільнений з в'язниці комуністичними партизанами"
 GER_the_fate_of_turkey_area:0 "Передати турецьку адміністрацію Арабії"
 GER_the_iberian_problem_desc:0 "У Європі ще залишилися бастіони комунізму. Ми мусимо порозумітися з ними, починаючи з Іспанії."
 GER_the_peoples_victory_desc:0 "Народ висловився — і був почутий. Наша стара та корумпована влада показала слабкість, і ми повинні скористатися цією можливістю, щоб вимагати її відставки й взяти владу в свої руки — в ім'я народу!"
 GER_total_control_over_domestic_affairs_chancellors_tt:0 "Залежно від призначеного партійного канцлера у §YВнутрішньому колі§!:"
 GER_transport_plane_equipment_1:0 "Junkers G 24"
 GER_unrestricted_convoy_raiding_desc:0 "Ми мусимо подвоїти ефективність наших рейдів на конвої та потроїти наші зусилля з планування, щоби повернути моря під наш повний контроль!"
 GER_war_with_france_threat:0 "Претензії на французькі території"
 GER_weserubung_tt_complete:0 "§YОфшорні цивільні заводи§!, здобуті наразі від контролю над §YНарвіком§!: §G[?GER_narvik_civs]§!\nПрогрес поставок до наступного заводу: [?GER_narvik_shipments]/6"
 GER_west_wall_forts:0 "Буде додано §Y12 наземних укріплень§! на кордоні з Францією.\n"
 GER_west_wall_tt:0 "§RЯкщо Райнланд ремілітаризований, Ви також отримаєте:§!\n"
 GNB_DEF:0 "Гвінея-Біссау"
 GOE_IRQ_news.1.t:0 "Велике палестинське повстання"
 GOE_RAJ.15.desc:0 "[RAJ.GetNameDefCap] повідомив нам, що вони мають намір зберегти Порт Аден під своїм контролем, незважаючи на попередні плани передати його під контроль корони.\nЯк і слід було очікувати, це викликало неабиякий ажіотаж у парламенті, особливо у Вінстона Черчилла, але наразі не планується жодних дисциплінарних заходів."
 GOE_RAJ.43.a:0 "Революція рухається вперед."
 GOE_RAJ.47.a:0 "Ми будемо уважно стежити за ними."
