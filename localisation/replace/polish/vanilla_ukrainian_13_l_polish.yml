 COG_freedom_at_gunpoint_dynamic:0 "Визволити державу [FROM.GetNameDef] з-під [FROM.Capital.OWNER.GetAdjective]ого§! ярма"
 COG_great_cattle_chiefs_desc:0 "Те, що виділяло нас у минулому, це наші великі вожді, які мали хист до організації та адміністрації. Вони могли зробити наше сільське господарство сильнішим за будь-чиє, і це те, що ми повинні відновити."
