 CHL_the_scouts_monarchist_youth_organization_desc:0 "Ми мусимо заснувати воєнізовану організацію, яка зможе навчити молодь виконувати свої обов'язки у воєнний час, якщо це буде потрібно, і яка зможе навчити наших людей способам виживання і ведення війни."
