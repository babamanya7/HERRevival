 POL_empower_falangist_militants_desc:0 "Серед фалангістів існує низка воєнізованих організацій, які озброюються для неминучої битви з комуністами. За підтримки уряду ці ентузіасти могли б перетворитися на грізне озброєне крило фалангістської партії."
 POL_escelate_the_strike:0 "DEBUG: Escalate the Strike"
 POL_expand_lithuanian_shipyards_desc:0 "Ми більше не повинні обмежуватися портами Гдиня і Гданськ. З Литвою під нашим контролем ми отримали можливість значно розширити наш військово-морський потенціал і конкурувати за домінування в Балтійському морі."
 POL_foreign_army_support_desc:0 "Щодня з Польщі прибувають біженці, щоби служити в наших лавах. Нам потрібно лише дати їм гвинтівку, і вони будуть готові підкорити будь-яку гору за обіцянку повернутися додому. Все, що нам потрібно — це вимогти подальший контроль над промисловістю наших союзників."
 POL_fortification_of_ukraine:0 "Укріплення в Україні"
 POL_go_right:0 "Піти праворуч"
 POL_infantry_equipment_3_short:0 "Wz. 43 Błyskawica"
 POL_integrate_the_endecja_desc:0 "Хоча осередок Націонал-демократичної партії веде переговори про створення коаліції з Санацією, більша частина партії все ще залишається в опозиції. Запросивши до уряду ключових членів Ендеції, ми, можливо, ще зможемо сформувати уряд, об'єднаний під гаслом польського націоналізму."
 POL_join_CZE_industry_desc:0 "Промисловість Богемії та Польщі роз'єднана і незгуртована, і ми повинні працювати над тим, щоб виправити це, щоб отримати максимальну вигоду від наших тепер об'єднаних націй."
 POL_kings_guard_desc:0 "Король має амбіції військового лідера, і хто може бути кращим для нього, ніж його власна королівська гвардія?"
 POL_light_cruiser_4:0 "Клас «Poznań»"
 POL_merge_civilian_industries_desc:0 "Тепер, коли наші країни об'єднані, Литві немає сенсу будувати тільки для Литви, а Польщі — тільки для Польщі. Наші індустрії повинні стати єдиним цілим заради добробуту нації."
 POL_modernising_the_cavalry:0 "Модернізація кавалерії"
 POL_morges_pact:0 "Морзький пакт"
 POL_ozon_desc:0 "Хоча угода передбачає, що Мосціцький складає свої повноваження під час війни, очевидно, що загрози на нашому кордоні є більшими, ніж ми можемо протистояти, і війна вже на горизонті. Коли Сміглий повністю контролюватиме націю, наш військовий і цивільний уряди будуть єдиним цілим, і ми будемо готові боротися з будь-ким, хто загрожуватиме польському суверенітету."
