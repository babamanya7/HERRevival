 WW_hungary.108.desc:0 "\nОскільки керівництво [FROM.GetAdjective] під проводом [FROM.GetLeader] тепер тісно пов’язане з нами, вони звернулись із проханням коронувати німецького короля, який займе символічне місце на [FROM.GetAdjective] троні. Їхній вибір — Герман Герінг, і вже навіть пишуть його «спорідненість» із угорським вождем Арпадом. Чи дозволимо ми йому виїхати до [FROM.GetNameDef]?"
 WW_hungary.114.desc:0 "Протягом останнього місяця в [73.GetName] тривав публічний референдум щодо приєднання до [HUN.GetNameDef]. За оцінками міжнародних спостерігачів, суттєвих фальсифікацій не було. Результати показали, що значна частина населення проголосувала за вихід із нашої держави. Чи визнаємо ми це?"
 WW_hungary.14.desc:0 "Уряд [HUN.GetAdjective] посилив тиск щодо Воєводини, стверджуючи, що ця територія раніше належала Угорщині під час Імперії, а отже має бути повернена. Вони заявляють, що об'єднання із Сербією після Великої війни було «недійсним через зовнішній тиск», а отже Воєводина досі є юридично [HUN.GetAdjective]."
 WW_hungary.23.t:0 "[FROM.GetNameDefCap] вимагає Бургенланд"
 WW_hungary.3.desc:0 "До нас дійшал новина; наш прем’єр-міністр, військовий офіцер і лідер Асоціації національної оборони Угорщини Дюла Гьомбьош помер від раку яєчок під час дипломатичної місії в Мюнхені. Хоча [ROOT.GetLeader] уже має на думці нового прем’єр-міністра, а саме центриста Калмана Дарані, все ще залишається питання, що робити з фашистською воєнізованою організацією вже покійного Гьомбьоша. Завдяки їхній з нашим лідером спільній антикомуністичній позиції можливо ми могли б переконати їх працювати на нас, але через невпевненість в їх справжньої лояльності, це може бути небезпечним для нас у майбутньому, якщо ми включимо їх до наших збройних сил. Як нам діяти щодо MOVE (Magyar Országos Véderő Egyesület)?"
 WW_hungary.38.b:0 "Вони лише тягар"
 WW_hungary.53.t:0 "[FROM.GetNameDefCap] відмовляється від монарха Габсбургів"
 WW_hungary.58.a:0 "Не варто проливати кров"
 WW_hungary.66.a:0 "Ми завжди цього прагнули!"
 WW_hungary.67.t:0 "[FROM.GetNameDefCap] приймає Габсбурзького монарха"
 WW_hungary.77.t:0 "[FROM.GetNameDefCap] стоїть на своєму щодо Святої Землі"
 WW_hungary.8.t:0 "[HUN.GetNameDefCap] пропонує захист в обмін на [975.GetName]"
 WW_hungary.80.t:0 "[HUN.GetNameDefCap] хоче інтегрувати нас"
 WW_hungary.84.desc:0 "Розсудливий [FROM.GetLeader] із [FROM.GetNameDef] погодився передати нам [975.GetName], отримавши відповідну оплату. Сьогодні — великий день для [ROOT.GetAdjective] народу!"
 WW_hungary.90.desc:0 "Було вирішено офіційно відновити монархію, однак виникла проблема — відсутність гідних кандидатів. Регент має зробити вибір: коронувати себе, що буде непопулярним, або передати трон своєму сину Іштвану Горті, який користується підтримкою народу. Кого обрати?"
 WW_hungary.91.b:0 "Та вони самовпевнені занадто"
