 GRE_the_backbone_of_our_army_desc:0 "Наш процес призову на військову службу трохи застарів у порівнянні з тим, як відбувається заклик у сусідів; наше спорядження вкрай несучасне. Нам час модернізувати і заклик, і спорядження, яке отримають призовники."
 GRE_third_hellenic_civilization_desc:0 "Світ, як і раніше, не бачить у нас спадкоємців Візантії та Еллади. Всі так шанують наших предків, а на нас дивляться з погордою. Ми покажемо їм: ми не Візантійська імперія і не Греція минулих часів, ми — Третя еллінська цивілізація, і ми прославимося своїми великими діями!"
 GRE_tow_the_stalinist_line_desc:0 "Своєю революцією ми зобов'язані великим умам Радянського Союзу. Якби не їхній внесок, ми ніколи б не здобули владу над Грецією! Ми солідарні з нашими товаришами у Москві."
