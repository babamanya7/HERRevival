 germany.100.t:0 "Розподіл Греції з державою [BUL.GetNameDef]"
 germany.1050.c:0 "$GER_heinz_guderian$ виведе нас із цього хаосу."
 germany.1190.desc:0 "Оскільки війна проти [GER.GetNameDef] наближається до свого неминучого завершення, [yalta_origin.GetNameDef] звернулась до нас із пропозицією провести конференцію щодо майбутнього Європи.\n\nВони пропонують тристоронній поділ [GER.GetNameDef], за яким ми отримаємо обмежений вплив на східну частину. Основний промисловий регіон перейде під контроль союзників, а також вони матимуть обмежений контроль над південним регіоном. Це зменшить потугу Німеччини, однак наш вплив на Центральну Європу залишатиметься невизначеним."
 germany.122.t:0 "[From.GetNameDefCap] вимагає Судетську область"
 germany.125.a:0 "Ми б упоралися з цим інакше, якби справа стояла за нами."
 germany.126.b:0 "Ні, доля Австрії буде іншою."
 germany.126.warning:0 "§RМоже призвести до війни§!\n"
 germany.127.b:0 "Ми не матимемо жодних зобов'язань перед ними."
 germany.16.t:0 "[From.GetNonIdeologyName] не дотрималась умов пакту"
 germany.200.b:0 "Ні, це занадто ризиковано."
 germany.202.b:0 "Не варто витрачати зусилля на їх утримання."
 germany.52.t:0 "Анексія Заолшя"
 germany.79.d:0 "Греція знаходиться під контролем Німеччини, і [From.GetLeader] тепер тисне на наш уряд, вимагаючи приєднання до їхнього альянсу. Радянсько-німецький альянс поставив нас у позицію, в якій нейтралітет більше не варіант, і нам з Берліну надійшов ультиматум з вимогою передачі наших східних територій їхнім радянським союзникам і приєднання до того ж пакту, яким вони користуються, щоби примусити нас підкоритися.\n\nХоча ми й не можемо зберігати нейтралітет, у нас є інші варіанти. Один з них — це пошук підтримки від Британії, інший — стояти на своєму. Жоден з них, однак, не забезпечить впевнене майбутнє для Республіки."
 germany.82.a:0 "Схоже, саме час розглянути інші варіанти."
 germany.84.a:0 "Наша передбачливість окупається."
 germany_mefo_bills.1.desc:0 "Фінансове навантаження від програми переозброєння загрожує обвалом нашої економіки. Якщо ми хочемо зберегти виробництво озброєнь на попередньому рівні, нам потрібно шукати нові джерела фінансування — або змінити наші пріоритети."
 germany_mefo_bills.2.t:0 "Зростаючі витрати на переозброєння"
 goal_construction4_desc:0 "$goal_construction1_desc$"
 goe_japan.1.desc:0 "Субгас Чандра Бос, лідер Індійської національної армії, звернувся до нас із пропозицією: його сили готові допомогти нашому просуванню в [BRM.GetName]. Він бачить у цьому перший крок до звільнення Індії від [ENG.GetAdjective] правління, і він вважає, що ударом по Бірмі ми можемо послабити Британський Радж. Його люди — загартовані націоналісти, і їхнє знання місцевості може виявитися безцінним. Чи приймаємо ми?"
