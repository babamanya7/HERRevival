 SOV_closed_city_network_desc:0 "Ми мусимо створити закриті міста для досліджень, які потребують більше місця, ніж ми маємо на наших військових базах. Обмеження доступу до міст гарантує, що наші дослідження залишаться в таємниці, водночас надаючи нашим вченим достатньо простору для проведення масштабних експериментів."
