 SOV_approach_semyonov_desc:0 "Григорій Семьонов обійняв посаду радника в державі [MAN.GetName]. Оскільки справа стає сильнішою з кожною годиною, ми повинні переконати його повернутися. Його першим завданням буде організація великої кавалерійської армії для нової Російської імперії."
