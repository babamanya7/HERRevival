 rocket_artillery_equipment_desc:0 "Ракетна артилерія менш точна і має набагато нижчу швидкість стрільби, ніж батареї традиційних артилерійських знарядь. Однак вони мають можливість одночасно вражати ціль декількома ракетами з нищівним ефектом."
