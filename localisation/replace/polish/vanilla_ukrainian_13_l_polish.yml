 heavy_mg_4x_desc:0 "Квартет важких кулеметів пропонує жахливу вогневу міць як в індивідуальному виконанні, так і в чистому обсязі вогню."
 heavy_water_raid_desc:0 "§LНімці почали виробляти важку воду на заводі в Норвегії. Можливо, це пов'язано з програмою розробки атомної бомби. Навіть якщо виробленої важкої води буде недостатньо для спорудження такої зброї, вона в будь-якому разі дозволить їм просунутися в дослідженнях.§!"
