 MEX_category_hispanic_solidarity_desc:0 "Наші дипломатичні зусилля потрібно спрямувати на інші країни Латинської Америки. Нас об'єднує наша «hispanidad» (гіспанськість), і ми мусимо утворити належний альянс, якщо хочемо протистояти іноземному впливу."
