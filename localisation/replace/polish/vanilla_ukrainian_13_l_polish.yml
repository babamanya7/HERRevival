 NOR_SOV_communism:0 "Норвезька радянська республіка"
 NOR_alt_dem_integrate_militias_desc:0 "$NOR_dem_his_integrate_militias_desc$"
 NOR_build_supplies_network_desc:0 "Нашим захоплюючим горам, озерам і фйордам позаздрив увесь світ, але вони також ускладнюють переміщення запасів. Нам потрібно докладати свідомих зусиль, щоб запаси швидше доставлялися до наших фронтів."
 NOR_building_an_independent_norway:0 "Розбудова незалежної Норвегії"
 NOR_coastal_defense:0 "Берегова оборона"
 NOR_communism_party:0 "НКП"
 NOR_communist_preparation_decisions_category_desc_other:0 "Революція має виникнути знизу вгору, від мас, які відкладають своє життя за поміщика чи промисловця.\n\nБагато наших братів і сестер-пролетарів не знають, яку владу вони мають, тому ми повинні піти вперед і розбудити пролетаріат, щоб вони могли об'єднатися проти Осло, щоб зруйнувати ланцюги капіталізму, одну державу за раз.$NOR_revolution_support_counter$"
 NOR_consolidate_power_desc:0 "Тепер, коли у нас є влада, щоб забезпечити майбутнє, якого ми прагнемо, настав час переконатися, що ми можемо його зберегти. Завдяки чисткам і новим призначенням ми приведемо цей стан до форми, яка дозволить нам досягти успіху та процвітати."
 NOR_cut_military_budget_desc:0 "Світ може виглядати так, ніби він горить у вогні, але це не означає, що нам потрібна армія. У нас є чітка політика нейтралітету, тож ми можемо заощаджувати ресурси, які раніше були використані для озброєння та захисту, які ми можемо перенаправити на створення більш справедливим і процвітаючим [ROOT.GetName]."
 NOR_destroyer_3_desc:0 "The Ålesund class consisted of two destroyers laid down in 1939 but never completed before the German occupation. Had they been completed, they would have been the first Norwegian destroyers that were comparable in size to the destroyers of most major nations, displacing over 1,200 tons. They were to be armed with four 120mm/40 Bofors cannon in their armament and four 533mm torpedo tubes."
 NOR_eirik_raudes_land:0 "Земля Ейріка Раудеса"
 NOR_empower_large_industrial_groups:0 "Розширення можливостей великих промислових груп"
 NOR_empower_large_industrial_groups_desc:0 "Великі промислові підприємства мають досвід будівництва та обслуговування заводів, що виробляють повсякденні потреби пересічного [ROOT.GetAdjective]ого громадянина. Безсумнівно, довіряти їм — це правильний шлях до [ROOT.GetNonIdeologyAdjective]ого шляху до промислової незалежності."
 NOR_heavy_tank_equipment_2_short:0 "Stv. m/41"
 NOR_hurtigruten:0 "Hurtigruten"
 NOR_kystvakten_desc:0 "Щоб захистити наше широке узбережжя, нам потрібна кількість, щоб ми могли бачити кожен дюйм горизонту. Створімо мережу суден, які охоронятимуть нашу землю від ворожих кораблів."
 NOR_light_tank_equipment_1_short:0 "Eks. Strv."
 NOR_modernize_armed_forces_decision:0 "Модернізувати збройні сили"
 NOR_modernize_fortifications_desc:0 "Дехто називає наші фортифікації «наполеонівськими», що в цьому контексті є чим завгодно, але не безкоштовним. Наші бункери можуть бути старовинними, але зброя наших ворогів — ні. Зусилля та ресурси, щоб привести наші форти на відповідний рівень, безсумнівно, окупляться майбутнє."
 NOR_modify_fascism_support_mod_TT:0 "§Y$NOR_prep_fasc_dmod_1$§! змінено:"
 NOR_nav_bomber_equipment_1_short:0 "M.F. 11"
