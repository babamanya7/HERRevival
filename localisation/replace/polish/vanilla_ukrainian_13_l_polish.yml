 KHM_shizangs_coup_desc:0 "With the preparations made and the 24th and 25th Uyghur regiments under Muhiti's control on their way to surround Khotan, we can begin to make our move and oust the Hui leadership from the city. Glory to Mahmut Shizhang, and long live the Khotan Emirate!"
