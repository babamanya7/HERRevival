 SEA_warlords.65.desc:0 "[FROM.GetLeader], наш вірний підданий, який зараз контролює [FROM.GetNameDef] після військового перевороту в провінції за підтримки НКВС, висловив бажання об'єднати провінцію з Киргизстаном, щоб краще розвивати регіони та об'єднати розсіяний народ під одним прапором. Що скажемо?"
