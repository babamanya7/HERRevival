 MAN_GATHERING_STORM_DESC:0 "Скинутий із Драконового Трону у віці шести років останній китайський імператор, Пуї, чекав свого часу. Поки його старе царство розривала Громадянська війна в Китаї, Пуї знайшов нового союзника — Японію.\n\nДля Пуї створення Імперії Маньчжоу-го в 1932 році стало першим кроком до повернення вітчизни його предків. Поки що він залежний від підтримки Армії Японії, але з часом може з'явитися можливість скинути рабські кайдани та стати тим, ким він мав бути з народження..."
 MAN_alliance_with_the_kwantung_army_desc:0 "Розміщені нашій країні японські війська часто не поділяють наші ідеї. Потрібно йти на тісніший контакт із ними, щоби гарантувати максимально безконфліктну взаємодію."
 MAN_develop_liaotung_iron_ore_deposits:0 "Розвиток залізних родовищ у Ляодуні"
 MAN_five_people_armies_desc:0 "Якщо всі громадяни рівні, то кожен з них має бути рівно готовий захищати батьківщину від зовнішніх ворогів."
