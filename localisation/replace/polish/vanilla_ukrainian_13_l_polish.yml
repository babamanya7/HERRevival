 industrial_expansion_goal_desc:0 "Найкращий спосіб створити міцний альянс — мати міцну промислову базу. Ми повинні забезпечити промислову міць, необхідну для того, щоб стати важливою державою."
 infiltration_submarine:0 "Висадка з підводного човна"
 infrastructure_desc:0 "Ця споруда дозволяє поліпшувати інфраструктуру області, збільшує об'єм постачання у стратегічних регіонах і швидкість Ваших дивізій, а також базовий об'єм видобутку ресурсів."
