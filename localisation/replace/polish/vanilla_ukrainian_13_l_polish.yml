 SCREENING_TOOLTIP_LOW_INFO:0 "Пробіли у §Yгрупі прикриття§! призводять до низької ефективності прикриття, що дозволяє підводним човнам супротивника націлюватися на наступну бойову лінію."
 SEA_PHI_political_events.10.t:0 "[FROM.GetName] погоджується придбати кораблі"
 SEA_PHI_political_events.18.a:0 "Вітаємо [FROM.GetName] у Комінтерні"
 SEA_PHI_political_events.20.desc:0 "Президент [USA.GetLeader] повернув Дагласа МакАртура на дійсну службу та призначив його командувачем новостворених Збройних сил США на Далекому Сході, що дислокуються на Філіппінах. Президент здійснив це призначення, оскільки МакАртур працював військовим радником на Філіппінах протягом кількох років і добре обізнаний з оборонною ситуацією там. \n \nЩоб дати йому змогу краще керувати військами на місцях, ми більше не матимемо прямого контролю над ним. Однак ми зможемо відкликати його, якщо нам знадобляться його таланти тут. Втім, нам слід добре подумати перед тим, як це робити, оскільки його від'їзд з Філіппін може бути розцінений як відхід від американських інтересів і відмова від наших обов'язків у Тихоокеанському регіоні в цей критичний час."
 SEA_PHI_political_events.31.t:0 "Дуайт Д. Айзенгауер прибуває на Філіппіни"
 SEA_PHI_political_events.42.b:0 "Рікарте має незламну відданість нашій справі, яка нам потрібна."
 SEA_PHI_political_events.43.a:0 "Тепер все залежить від [MacOrGarrison]."
 SEA_PHI_political_events.48.desc.2:0 "Раніше сьогодні ми отримали повідомлення про порушення в [FROM.GetNameDef]. Після цього ми отримали декларацію незалежності від їхнього уряду з чіткою заявою про підтримку від [JAP.GetAdjective]ого уряду. Хоча заява закликає нас не втручатися, [FROM.GetAdjective]ий уряд чітко дав зрозуміти, що вони не ухилятимуться від боротьби за збереження своєї нової незалежності, маючи [JAP.GetAdjective]у підтримку."
