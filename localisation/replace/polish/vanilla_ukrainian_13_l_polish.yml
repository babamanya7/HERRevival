 RAJ_GOE_princely_state_timeout_tt:0 "Тиснучи на них, ми можемо дипломатично анексувати їхні території. Якщо ми матимемо явну перевагу в тиску, [FROM.GetName] напевно приєднається до нас.\n\nНаприкінці місії кожна держава вирішить, до кого приєднатися. Якщо країна матиме більш ніж 25% тиску порівняно з іншими країнами в державі, ця держава добровільно приєднається до [ROOT.GetName].\n\n"
