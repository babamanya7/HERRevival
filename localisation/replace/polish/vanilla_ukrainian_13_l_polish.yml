 WTT_build_support_in_gansu_desc:0 "§W§H[283.GetStateMajorityCountryName]§! має §Hбільшість в області§! й отримує [?283.state_political_support_value|+0] §Hбалів політичної підтримки§!, поки інша країна не отримає більшу §Hмісцеву підтримку§!\n\n§HМісцева підтримка§!:\n[283.GetLocalStateSupport_CHI][283.GetLocalStateSupport_PRC][283.GetLocalStateSupport_GXC][283.GetLocalStateSupport_YUN][283.GetLocalStateSupport_SHX][283.GetLocalStateSupport_XSM][283.GetLocalStateSupport_SIK]§!"
