 iceland_events.1.desc:0 "[?ICE.overlord_attacker.GetAdjective]і війська атакували Данію. [ROOT.getName] заявляє про свій нейтралітет, очікуючи, що його поважатимуть усі сторони, які беруть участь.\n$ICE_sveinn_bjornsson$ оголошений регентом за відсутності короля і фактично керує зовнішньою політикою держави [ROOT.GetName]. Зрозуміло, це слід вважати тимчасовим заходом, поки ситуація не стабілізується і світ не стане більш мирним, але поки що [ROOT.GetName] фактично поводиться, як суверенна держава."
 iceland_events.13.a:0 "Наша імперія зростає"
 iceland_events.17.desc_generic:0 "[FROM.GetAdjective]ий парламент оголосив державу [FROM.GetNameDef] повністю незалежною та суверенною, без будь-яких зв'язків із будь-якою іншою нацією. Це означає, що вони офіційно порвали з нами і в односторонньому порядку оголосили незалежність."
 iceland_events.5.a:0 "Це знак згори"
 iceland_events.5.d:0 "От би жити в більш освічені часи"
 iceland_events.7.a:0 "Нам не потрібен король"
 iceland_events.9.b:0 "Чудово. Треба простежити, щоб його повноваження були обмежені."
