 bba_news.105.desc:0 "[ROOT.GetNameDefCap] та [FROM.GetNameDef] підписали пакт про ненапад, який гарантує мир між двома країнами. Це дозволить їм зосередитися на чомусь іншому, але всім цікаво, як довго протримається цей хиткий пакт."
 bba_news.109.desc:0 "Безпрецедентним кроком Велика фашистська рада держави [FROM.GetName] захопила владу і скинула [?ITA.ITA_var_deposed_leader.GetName] та помістила його під домашній арешт. Ця дія була мотивована намаганням урятувати країну від військових невдач і некомпетентності дуче, що викликало напругу всередині держави [FROM.GetName] та деякі побоювання, що це може призвести до громадянської війни, якщо не буде вжито заходів для пом'якшення ситуації."
 bella_ciao:0 "Bella Ciao"
 between_the_seas_goal_name:0 "Між морів"
 bftb_bulgaria_balkan_federation.1.a:0 "За таку мрію варто боротися!"
 bftb_bulgaria_balkan_federation.10.desc:0 "Сьогодні [FROM.GetAdjective]а делегація, яку очолює [FROM.GetLeader], прибула до міста [ROOT.Capital.GetName], де вони та [ROOT.GetLeader] мусять обговорити умови, за дотримання яких [FROM.GetNameDef] увійде до Об'єднаної балканської федерації, схоже, [FROM.GetAdjective]ий уряд хоче зберегти часткову незалежність і право на самоврядування, вступивши до федерації як неповний учасник із певним ступенем автономності."
 bftb_bulgaria_balkan_federation.12.desc:0 "[BUL.GetAdjectiveCap]і дипломати передали вимогу свого уряду віддати [ROOT.GetAdjective]і землі Балкан балканським народам, яким, згідно з [BUL.GetAdjective]им посланням, вони законно належать. Загалом [BUL.GetNameDef] витримує доброзичливий тон, але деяким нашим дипломатам у ньому чуються загрозливі нотки, особливо у світлі відмови [ITA.GetAdjective]их міністрів."
 bftb_bulgaria_equipment_purchases.3.t:0 "Закупити [FROM.FROM.GetAdjective]у бронетехніку"
 bftb_bulgaria_factions.20.b:0 "Їх треба роздавити! За будь-яку ціну!"
 bftb_bulgaria_factions.37.t:0 "Землеробський національний союз інтегрований"
 bftb_bulgaria_factions.40.b:0 "Треба заткнути їм рота, поки вони не стали небезпечнішими"
 bftb_bulgaria_factions.51.desc:0 "Наша служба безпеки провела серйозні репресії проти організації, відомої як «Звено». Керівництво операції стверджує, що поліцейським вдалося захопити багатьох бунтівників на таємних зборах організації, і, таким чином, операція завершилася приголомшливим успіхом."
 bftb_bulgaria_fate_of_the_balkans.2.t:0 "[FROM.GetNameDefCap] погоджується приєднатися до альянсу [BUL.GetFactionName]"
 bftb_bulgaria_german_influence.6.a:0 "Пішак тут тільки один — це Георгій Кьосеіванов!"
 bftb_bulgaria_greek_influence.1.b:0 "[BUL.GetAdjectiveCap]ому слову довіряти не можна!"
 bftb_bulgaria_imro.2.a:0 "Настав час знову розквитатися з ВМРО..."
 bftb_bulgaria_nationalization.1.desc_tsar_loyalists:0 "вірні міністри"
 bftb_bulgaria_rearmament.6.t:0 "[ENG.GetNameDefCap] знімає обмеження на нашу армію"
 bftb_bulgaria_soviet_influence.4.a:0 "Ми мусимо об'єднатися з болгарськими та радянськими братами."
 bftb_bulgaria_uranium_mining_concessions.1.t:0 "[FROM.GetNameDefCap] укладає концесію про видобуток урану"
 bftb_bulgarian_claims.5.desc:0 "Як і було обговорено, ми поступаємося контролем над територіями, які нині займає [GER.GetFactionName] і на які претендує [ROOT.GetNameDef]. Відтепер тут розпоряджається [ROOT.GetAdjective]ий уряд."
 bftb_greece.15.t:0 "Іракліонська конвенція — [FRA.GetAdjective]ий мандат у Курдистані?"
 bftb_greece.166.c:0 "Nein, ми нізащо не вкладемося в цю жалюгідну країну!"
 bftb_greece.178.a:0 "Можливо, варто спробувати укласти угоду з росіянами?"
 bftb_greece.180.a:0 "Oui, ми інвестуємо в державу [FROM.GetNameDef]."
 bftb_greece.19.a:0 "Перемогли голоси за!"
 bftb_greece.195.t:0 "[FROM.GetAdjectiveCap]ий уряд не приймає наших делегатів та виганяє наших дипломатів!"
 bftb_greece.217.b:0 "Меркуріс принесе нам імперію!"
 bftb_greece.223.a:0 "Перемогли голоси за!"
 bftb_greece.23.a:0 "Перемогли голоси проти!"
 bftb_greece.232.b:0 "Ем, стривайте... Що якщо він просто божевільний?"
 bftb_greece.236.t:0 "[SOV.GetNameDefCap] відмовляється допомагати супроти держави [TUR.GetNameDef]"
 bftb_greece.26.desc:0 "Більшість присутніх делегатів вирішила, що державі [GRE.GetNameDef] не можна давати право на утворення Великої Греції, що лежить в основі їх так званої Великої ідеї. Наші представники, будучи в шоці та жаху одночасно, підтвердили це рішення делегатів і відправили всіх додому з новинами про те, що Іракліонська конвенція зазнала невдачі.[ROOT.GetLeader] змушений був говорити перед столичним народом і зізнатися, що вся конвенція пішла прахом. вже бачимо, як у всій країні утворюються протести, і ситуація загрожує стрімко вийти з-під контролю."
 bftb_greece.58.d:0 "Жадібні греки не отримають нічого!"
 bftb_greece.58.t:0 "[FROM.GetNameDefCap] пропонує енозіс із Кіпром"
 bftb_news.13.a:0 "[BUL.GetNameDef] багато виграє від цієї угоди!"
 bftb_news.15.t:0 "Салонікська угода"
 bftb_news.202.d:0 "Принаймні вдалося уникнути війни..."
 bftb_news.208.a:0 "Ми не можемо турбуватися через [TUR.GetAdjective]і плани."
 bftb_turkey.113.a:0 "Ну що ж, добре, ми поступимося з поваги до їхніх звичаїв."
 bftb_turkey.138.desc:0 "Як і пророкували наші експерти із зовнішньої політики, [FROM.GetNameDef] атакує власних союзників. Ми засудили [FROM.GetAdjective] послів за безрозсудне рішення їхнього уряду, але не схоже, щоб це справило на них враження."
 bftb_turkey.24.e:0 "Февзі Чакмак стане нашим Франсіско Франко."
 bftb_turkey.31.a:0 "Ми приймаємо права на ваші ресурси у відповідь на архіпелаг Додеканес."
 bftb_turkey.33.a:0 "Будемо сподіватися, що це забезпечить нам військовий союз..."
 bftb_turkey.5.t:0 "[SOV.GetName] виступає проти нашої ремілітаризації проток!"
 bftb_turkey.51.desc:0 "Ми отримали партію [FROM.GetAdjective] танків прямо з їх запасів! Це найсучасніші моделі, ранні випробування виявили їх універсальність. Вони дуже знадобляться у наших збройних силах."
 bftb_turkey.60.t:0 "[FROM.GetName] наполягає на вирішенні проблеми з Хатаєм"
 bftb_turkey.66.a:0 "Цілком справедлива пропозиція щодо майбутнього держави [GRE.GetNameDef]."
 bftb_turkey.67.a:0 "Машалла, ми боротимемося проти фашизму і за душу Іраку!"
 bftb_turkey.67.desc:0 "Прибули шокуючі новини з області [676.GetName]: колишній прем'єр-міністр Рашід Алі аль-Гайлані спробував повалити уряд, який очолює [ROOT.GetLeader]. Аль-Гайлані підтримує більша частина армії та навіть народ.\n\nПрактично немає сумнівів, що ключову роль в організації перевороту та постачанні зброєю зрадників із Золотого квадрата зіграло іноземне втручання. Вважається, що з усіх імовірно залучених у переворот державних діячів найважливішу роль у підтримці фашистського перевороту.\n\nЗолотий квадрат твердо стоїть на позиції насильницького видалення [ENG.GetAdjective] імперіалістів за допомогою держави [GER.GetNameDef], і багато хто в народі знаходять таку позицію дуже похвальною. Можливо, тільки з фашизмом ми утворимо вільну Аравію..."
 bftb_turkey.94.t:0 "Економіка руйнується"
 boost_party_popularity_general_desc:0 "Підсилює певну політичну групу в країні, що означає, що вони можуть перемогти під час виборів або зробити майбутній переворот більш потужним"
 boost_party_popularity_receiver_extended_desc:0 "Держава $COUNTRY1|Y$ підтримує зростання популярності політичної партії в державі $COUNTRY2|Y$"
 bravery_before_the_enemy:0 "Медаль «За хоробрість перед ворогом»"
 britain.23.b:0 "Ми скористаємося можливістю!"
 britain.25.desc:0 "Уряд [ENG.GetAdjective], який, здається, стурбований падінням [DEN.GetNameDef] та присутністю [GER.GetAdjective] дипломатів в [ICE.GetNameDef], запросив нас приєднатися до союзників як співучасників війни. Вони посилаються на занепокоєння щодо своєї національної безпеки, оскільки [GER.GetNameDef] потенційно може використовувати ісландські бази як плацдарм для нальотів на англійські конвої або міста.\nЇхні погрози були ледь прихованими, посилаючись на поточну світову ситуацію, що будь-які заяви про «нібито нейтралітет» з нашого боку затьмарюються безпекою британських громадян і війною проти фашизму."
 britain.3.a:0 "Ті негідники!"
 britain.8.b:0 "Ми не можемо їх змушувати."
 broken_diesel:0 "Дизельний двигун зламаний"
 buddhist_socialism:0 "Буддійський соціалізм"
 build_infrastructure_short_desc:0 "§LРозширте інфраструктуру нашої країни.§!"
 bulgaria.4.t:0 "Крайовський договір"
 bulgarian_territorial_expansion_arranged:0 "Домовлена територіальна експанія Болгарії"
 captured_ethiopian_commanders_jimma_tt:0 "$ETH_seyoum_mengesha$, $ETH_ayalew_birru$, $ETH_balcho_safo$, $ETH_tadesse_birru$ та $ETH_ras_kassa$ будуть заарештовані."
 carrier_4_desc:0 "У міру того, як угоди втрачають свою силу, ми отримуємо можливість розробляти більш сучасні та місткі авіаносці, щоби завоювати перевагу в повітрі."
 cat_armored_cars:0 "Бронемашини"
 cat_deep_battle_cost_factor:0 "Вартість доктрини глибокого бою"
 cat_mass_mobilization_cost_factor_tt:0 " $cat_mass_mobilization_cost_factor$: $RIGHT|-=%1$"
 category_rocket_artillery:0 "Уся ракетна артилерія"
 cavity_magnatron_desc:0 "Використовуючи трубку, яка створює мікрохвилі, названу магнетроном, ми можемо значно поліпшити здатність існуючих радіолокаційних систем виявляти об'єкти, відбиваючи хвилі від них."
 china.102.a:0 "Разом ми — сила!"
 china.12.d:0 "Спротив атаці Гоміньдану завершився на нашу користь. Місцеві війська, надіслані для нападу на Червону армію, не були готові, що ми знаємо про атаку, і були переможені. Це послужило попередженням для сусідніх воєначальників, що атакувати нас буде дорого.\n\nНаціоналісти сильно недооцінили нас як противника, і Народна республіка знову на підйомі."
 china.200.t:0 "Приєднання до Китайської народної республіки"
 china.7.b:0 "Відступити в ізоляцію."
 china_wang_front_expansion_name:0 "Тріумф над імперіалізмом"
 coastal_minelaying_placement_for_effect:0 "Розміщення для ефекту"
 combat_stat_heavy_guns_info:0 "§HВажкі гармати§!\n\nВажкі гармати найефективніші для ботьби з §Yосновними кораблями§!. Вони можуть уразити дві найближчі групи противників, при  цьому ваші кораблі будуть обирати найбільші цілі.\n"
 complexity_small:0 "Мала"
 compliance_25:0 "Місцева поліція"
 concentrated_industry2_desc:0 "Подальша концентрація промисловості дозволить скоротити витрати."
 congo_independence_struggle.7.a:0 "Наша місія завершена, але наші прибутки ще не закінчились!"
 congo_independence_struggle.7.d:0 "Ми щойно отримали звістку від нового посла від [COG.GetNameDef], що вони прийняли пропозицію купити свою незалежність від нашого колоніального правління. Тепер починається робота з виведення адміністрації з Колоніального офісу та передачі цієї відповідальності їхньому новому уряду, а також створення банківських рахунків і холдингів для отримання належних платежів."
 congo_independence_struggle.9.t:0 "Сили Публіки атакують наші сили в Леопольдвілі"
 congress_medium_support_trigger_tt:0 "Потрібна підтримка принаймні §Y[?USA.quorum_medium] сенаторів§! (зараз: [?USA.senators_support]) і §Y218 представників§! (зараз: [?USA.representatives_support])\n"
 construction3_desc:0 "Застосування сучасної техніки та досвіду, накопиченого за час будівництва, дозволить різко скоротити терміни ремонту."
 construction_effort_desc:0 "Потужність громадянської промисловості не варто недооцінювати навіть коли війна нависає над світом."
 construction_effort_tt:0 "Недостатньо комірок для будівництва §Yцивільних заводів§!"
 control_mexican_oil_goal_name:0 "Контролювати мексиканську нафту"
 control_strait_of_hormuz_goal_name:0 "Контролювати Ормузьку протоку"
 control_suez_canal_goal_name:0 "Контролювати Суецький канал"
 coordinated_strike_scout_target:0 "Розвідати цілі"
 czech.1.t:0 "Вступ до Комінтерну"
 czech.14.a:0 "Якщо їм так хочеться війни, вони її отримають."
 czech.15.a:0 "Перемога!"
 czech.32.a:0 "Ми приймаємо їхню пропозицію."
 decision_cost_CP_75_blocked:0 "£command_power£ §R75§!"
 decision_cost_alt_dem_prepare_convoy_pp_blocked:0 "£GFX_topbar_convoys §R[?NOR.NOR_prep_alt_dem_convoy_cost]§! £pol_power §R[?NOR.NOR_prep_alt_dem_pp_cost]§!"
 demobilization:0 "Демобілізація"
 democratic:0 "Демократія"
 denmark_expansion_event.2.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію про реінтеграцію"
 denmark_expansion_event.200.a:0 "Ми повинні підкоритися їхнім вимогам..."
 denmark_expansion_event.201.t:0 "[FROM.GetNameDefCap] погоджується з нашими домаганнями на [ICE.GetAdjective]у землю"
 denmark_expansion_event.222.t:0 "[FROM.GetNameDefCap] відкидає [FIN.GetAdjective]і претензії"
 denmark_expansion_event.400.c:0 "Можливо, нам поки що краще діяти поодинці..."
 denmark_fascist_event.20.a:0 "Погодимося. Такий союз зробить сильнішими обидві держави."
 denmark_fascist_event.3.desc:0 "На жаль, [FROM.GetAdjective]ий уряд відмовився допомогти нам повалити парламент. Тепер ми ризикуємо наштовхнутися на збройний опір, і здійснити захоплення влади буде складніше. Це дуже прикро."
 denmark_occupation_event.111.desc:0 "[FROM.GetLeader] радіє тому, що [ROOT.GetLeader] пропонує свою вірність. Також цей лідер цінує нас і наш внесок у партнерство. Наші країни стануть ще ближчими і тому ще сильнішими."
 denmark_occupation_event.6.desc_asks_for_independence:0 "Наша вірна маріонеткова держава [FROM.GetNameDef] відправила до нас делегацію, очолює яку особисто [FROM.GetLeader]. Делегація хоче обговорити вихід з-під залежності — і [ROOT.GetLeader] бачиться їм ключем до свободи."
 denmark_overlord_events.12.desc:0 "Демократія прекрасна тим, з якого різноманіття кандидатів вона дає змогу обирати."
 denmark_overlord_events.2.desc:0 "Наш лідер, [ROOT.GetLeader], надсилає королю держави [FROM.GetNameDef] щиру телеграму з привітаннями до дня народження, але у відповідь отримує лише холодну і коротку відписку. Пізніше данці розуміють серйозність такого проступку і пропонують, щоб [ROOT.GetLeader] і кронпринц Фредерік зустрілися і спадкоємець престолу особисто вибачився за образу.\nАле ми можемо використати цей інцидент як привід посилити контроль над нашою залежною державою, що має під нашим заступництвом доволі серйозні привілеї."
 denmark_overlord_events.43.b:0 "Ми будемо битися за свободу!"
 denmark_protection_event.102.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 denmark_protection_event.8.t:0 "[FROM.GetNameDefCap] підписує дослідницьку угоду"
 denmark_resistance_event.5.desc:0 "[FROM.GetAdjective]а адміністрація вирішила допомогти нам зі зброєю і планує закидати її повітрям. Члени опору вже домовилися про місце і час доставки з агентами [FROM.GetAdjective]ої розвідки."
