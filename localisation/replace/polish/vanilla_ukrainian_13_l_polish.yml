 modern_tank_destroyer_equipment_desc:0 "Сучасні винищувачі танків є еволюцією попередніх легких і середніх ВТ, які віддають перевагу мобільності та непомітності над важкою бронею."
 modifier_coastal_bunker_max_level_terrain_limit_tt:0 " $modifier_coastal_bunker_max_level_terrain_limit$: $RIGHT|G=0$"
 modifier_state_production_dockyard_factor_desc:0 "Модифікатор швидкості будівництва §Yверфей§! у цій області."
 modify_taxation_fourth_bracket:0 "Модифікує ставку оподаткування для §Y4-ї податкової групи§! на:"
 molotov_ribbentrop_pact_desc:0 "Підписавши договір про дружбу і ненапад із СРСР, ми можемо дійти згоди про те, як вчинити з державами, що розділяють нас, а також збільшити взаємну торгівлю. Крім умов про ненапад, договір містить таємні пункти про поділ територій Румунії, Польщі, Литви, Латвії, Естонії та Фінляндії між сферами впливу Німеччини та Радянського Союзу, що призведе до територіального та політичного переділу цих країн."
