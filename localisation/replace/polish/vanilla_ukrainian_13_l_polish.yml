 PER_third_persian_empire_desc:0 "Щоб забезпечити майбутнє нашого народу, Мохаммед Реза Пехлеві оголосив про створення Третьої Перської імперії, яка прагне наслідувати та поважати історію наших стародавніх попередників — Ахеменідів. Це нова ера для [PER.GetNameDef], яка має привести нас до величі."
 PHI_america_declare_war:0 "[USA.GetNameDefCap] може оголосити війну"
 PHI_cobalt_supremacy_desc:0 "Я став смертю, руйнівником світів."
 PHI_encourage_asian_trade_desc:0 "Існують значні історичні морські зв'язки між азійськими країнами, і попри всі намагання колоніальних держав обмежити їх, вони залишаються міцними. Ми повинні плекати ці зв'язки та заохочувати торгівлю між нашими країнами заради спільного зростання та процвітання."
 PHI_expand_gold_mining_desc:0 "Іспанія завжди була напрочуд проникливою, коли справа доходила до пошуку запасів золота та срібла, і на Філіппінах вони не розчарувалися. Однак вони були б дуже розлючені, дізнавшись, що найбагатші золоті жили розробляються лише зараз, і цей процвітаючий експорт приносить нашій країні рекордні доходи."
