 ENG_reassess_continental_commitments_desc:0 "Хоча наша нещодавня політична позиція щодо Європи полягала у підтримці наших союзників у Великій війні, протистоянні відродженню держав [GER.GetName] і насуванню держави [SOV.GetName], політичні розбіжності між нами та нашими старими союзниками стали більш помітними. Можливо, настав час переглянути, кому ми віддані."
