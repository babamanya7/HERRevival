 CONGO_cobalt_mine_tt:0 "Відкриває рішення для §YРозширення кобальтових шахт§!"
 CONGO_dominion_of_congo_desc:0 "Наш статус зразкової колонії добре витримав випробування часом, і нація зросла через спільні труднощі між Конго та [BEL.GetName]. Тому досягнуто певного рівня рівності."
 CONGO_jungle_fighting_desc:0 "Величезні площі Конго покриті, здавалося б, непрохідними джунглями, і все ж люди живуть і процвітають серед них. Ми повинні набирати таких людей, щоб вони служили провідниками та інструкторами, щоб краще підготувати наші збройні сили до розгортання в таких умовах."
 CONGO_jungle_figthing_random_generals_tt:0 "§YДва§! випадково обрані військові лідери отримають §YДжунгле́вого щура§!"
 CONGO_modernize_force_publique_desc:0 "Хоча Force publique продемонстрував себе відмінно, не секрет, що йому потрібна модернізація. Це найбільш сприятливий момент для інвестицій у це."
 CONGO_symbiotic_industrialization_desc:0 "Один фактор живить інший: розвиваючи бельгійську індустрію, зростає потреба в ресурсах. Ці ресурси ми можемо імпортувати з Конго та прискорити індустріалізацію, що в свою чергу потребує ще більше ресурсів. Процвітання обох тісно пов'язане."
