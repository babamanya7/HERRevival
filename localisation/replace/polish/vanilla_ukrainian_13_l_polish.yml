 DOD_hungary.110.t:0 "Угорщина хоче чинити тиск на Румунію"
 DOD_hungary.115.a:0 "Вони того не варті."
 DOD_hungary.126.t:0 "[CZE.GetAdjectiveCap]а влада відповіла відмовою"
 DOD_hungary.146.desc:0 "Угорський уряд намагається змінити умови тріанонського договору, щоб Угорщина змогла відновити свою армію. На переговорах у Бледі вже кілька днів панує тупикова ситуація. Угорський посол звернувся до нашого уряду з проханням чинити тиск на інший бік.\n\nМіністерство закордонних справ попереджає про те, що допомога Угорщини, поза сумнівом, погіршить наші відносини з її сусідами та змінить співвідношення сил у регіоні. Але якщо ми відповімо відмовою, Угорщина може відмовитися від дипломатії та вдатися до агресії, дестабілізуючи цим весь регіон."
 DOD_hungary.161.t:0 "Конкурс на легкі бомбардувальники"
 DOD_hungary.33.a:0 "Потрібно дозволити Угорщині провести обмежене озброєння."
 DOD_hungary.33.desc:0 "Останнім часом угорці почали звертатися до своїх сусідів із проханням послабити обмеження, накладені на них за підсумками останньої війни. Зокрема, вони хочуть повернути заклик на військову службу та розширити свої військові заводи. Угорщина стверджує, що мир з кожним днем стає дедалі небезпечнішим, і їм потрібна повноцінна армія, здатна захистити країну. [From.From.GetNameDefCap] вважає інакше."
 DOD_hungary.50.t:0 "[HUN.GetNameDefCap] вимагає Трансільванію"
 DOD_hungary.54.a:0 "Ситуація виходить із-під контролю."
 DOD_hungary.68.a:0 "Віддати Трансільванію повністю Угорщини."
 DOD_hungary.7.desc:0 "Запропонувавши провести референдум, Угорщина поставила нас у незручне становище перед іншими країнами. Ми не можемо позбавити людей права голосу, але при цьому маємо сумнів, що вони зроблять потрібний нам вибір. На щастя, цю проблему можна вирішити різними. способами. Які результати референдуму нам потрібні?"
 DOD_hungary.73.a:0 "Віддати Трансільванію цілком Угорщини."
 DOD_hungary.73.c:0 "Трансільванія залишиться у складі Румунії."
 DOD_hungary.84.desc:0 "[From.GetName] відмовляється навіть обговорювати наші вимоги, стверджуючи, що ця територія завжди була частиною держави [From.GetName] і що за неї будуть боротися «до останнього солдата, до останньої кулі, до останнього подиху»."
 DOD_hungary.94.desc:0 "\nПереговори, які ми і [From.GetNameDef] провели неофіційними каналами, дозволили дійти згоди про те, що Югославію слід повністю розділити або хоча б сильно зменшити в розмірах. \n\nЗаручившись підтримкою нових союзників, ми тепер зможемо розмовляти з [YUG.GetAdjective]ою владою з позиції вищої сили. Ми також можемо вирішити питання військовим шляхом, доки югославська армія не готова до війни."
 DOD_hungary.96.t:0 "Ультиматум із Будапешта"
 DOD_romania.83.b:0 "Уряд не обговорює особисті справи короля."
 DOD_romania.83.desc:0 "Незважаючи на те, що офіційні публікації про нещодавній прийом у королівському палаці були схвалені самим королем, вони викликали гучне невдоволення публіки. Фотографії коханки короля в дорогій вечірній сукні від французького кутюр'є та докладний опис вечері з 7 змінами страв на золотих тарілках ще сильніше розгнівали громадян, які досі не оговталися від Великої депресії.\n\nКороль зажадав, щоби ми терміново випустили публічну заяву на його підтримку."
