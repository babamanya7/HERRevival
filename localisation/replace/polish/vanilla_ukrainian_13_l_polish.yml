 DIPLOMACY_OFFER_JOIN_FACTION_TITLE:0 "Запросити в альянс"
 DIPLOMACY_REQUEST_INTERNATIONAL_MARKET_ACCESS_RIGHTS_ACTION_DESC:0 "Дати доступ до ринку та виставлене на міжнародний ринок оснащення один одного.\n\nЧленство в одному альянсі дає доступ автоматично. Доступ до ринку лідера альянсу також доступ до ринків усіх членів."
 DIPLOMACY_REQUEST_LICENSED_PRODUCTION_REQUEST_DESC:0 "Держава $COUNTRY|Y$ просить ліцензії на виробництво: $LIST|Y$\nВони платитимуть нам $COST|Y$ £civ_factory£, поки ліцензії активні."
