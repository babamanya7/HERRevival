 SPR_engineering_advances_desc:0 "Нові досягнення в техніці дозволяють будувати вдосконалену промисловість, а також нові типи літаків і броні."
 SPR_fortify_the_coastlines:0 "Укріпити берегові лінії"
 SPR_government_crackdown_mission_desc:0 "Від початку громадянської війни сталінські та республіканські репресії проти нашого руху постійно посилювалися. Ми проливали кров, щоби зупинити початковий фашистський переворот, але наша подальша автономія є сіллю в оці уряду, і очевидно, що вони радше воліли би позбутися нас, аніж продовжувати користуватися нашою допомогою. Ми мусимо бути готові захищати нашу свободу силою, якщо вони не залишать нам вибору."
 SPR_heavy_cruiser_2_desc:0 "The two heavy cruisers of the Canarias class were built to the specifications of the Washington Naval treay. They were launched in the early 1930s but not completed until 1936. They displaced nearly 10,700 tons and had good speed. They were relatively lightly armored but sported eight 203mm/50 Vickers-Armstrong Mk D guns as their main armament."
