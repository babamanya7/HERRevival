 RAJ_appoint_soviet_friendly_government_desc:0 "Щоб забезпечити тривалу підтримку з Москви, ми встановимо уряд, повністю узгоджений з радянською ідеологією. Їхня лояльність забезпечить економічну допомогу, військову співпрацю та ідеологічну послідовність у нашій новій державі."
