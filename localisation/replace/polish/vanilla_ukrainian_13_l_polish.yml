 SEA_china.12.b:0 "Ми йтимемо власним шляхом"
 SEA_china.4.desc:0 "Надійшов запит від [FROM.GetLeader] з [FROM.GetNameDef], який просить фінансової та матеріальної допомоги в їхньому конфлікті проти [JAP.GetNameDef]. Повідомлення було передано не просто по радіо чи через посланця, а через не менш важливу особу, ніж $CHI_soong_mei_ling$, яка збирає чималий натовп під час подорожі через [ROOT.GetName]. Хоча стримування [JAP.GetNameDef] принесло б користь лише нам, ми також могли б отримати вигоду з популярності цього туру."
 SEA_china_democratic.10.desc:0 "Делегація з далеких країв нещодавно прибула до нашої столиці, шукаючи аудієнції у [ROOT.GetLeader]. Вони стверджують, що прибули від [FROM.GetNameDef], і бажають, щоб ми приєдналися до їхньої війни проти [JAP.GetNameDef]. Чи приймемо ми пропозицію?"
 SEA_china_democratic.17.t:0 "[FROM.GetName] вимагає нашого підкорення"
 SEA_china_democratic.3.t:0 "[FROM.GetNameDefCap] приймає наше запрошення"
 SEA_china_democratic.9.desc:0 "Відповідь на наші вимоги до [FROM.GetNameDef] звільнити [CHI_country_to_be_liberated.GetNameDef] щойно надійшла. Заявляючи, що їхні закордонні справи нас не стосуються, вони відкидають ідею надання колоніям їхньої законної незалежності."
 SEA_china_warlords.1.t:0 "[FROM.GetName] вимагає нашого підкорення"
 SEA_generic_events.13.desc:0 "Ще до того, як поліція встигла повідомити нас про це, урядовці доповіли, що зіткнулися із заворушеннями під час роботи в [root.capital.GetCapitalVictoryPointName]. Схоже, те, що починалося як велика політична демонстрація проти [ROOT.GetRulingParty], перетворилося на мародерство, завдаючи шкоди по всьому місту."
 SEA_imperial_influence_events.340.desc:0 "Лідери Дзайбацу висунули свої вимоги. Схоже, вони бажають, щоб принаймні одна з їхніх компаній отримала прямі контракти від [GetImperialInfluenceRulerTitle], аби вони могли керувати індустріалізацією та курсом нації. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_failure_event_option_10:0 "Причина породжує наслідок"
 SEA_japan_air_accidents_events.02.desc:0 "Адмірал Ісороку Ямамото потрапив під ворожий вогонь під час перельоту сьогодні раніше. Вдавшись зв'язатися з морською авіацією в регіоні та тримаючись осторонь від обстрілу, Ямамото зумів вислизнути та успішно посадити свій літак. Адмірала вітають за його хоробрість і за те, що він зберігав спокій у такій гарячій ситуації."
 SEA_japan_foreign_policy.111.a:0 "Вони загрожують єдності організації!"
 SEA_japan_foreign_policy.112.b:0 "Компроміс щодо нашої Імперії? Ніколи!"
 SEA_japan_foreign_policy.134.a:0 "Тоді ми повинні звільнити їхній народ силою!"
 SEA_japan_foreign_policy.16.a:0 "Великий день для [ROOT.GetAdjective]ого народу"
 SEA_japan_foreign_policy.22.desc:0 "У межах наших кордонів було помічено агентів, які, ймовірно, діють за [FROM.GetAdjective]им наказом, і, схоже, намагаються встановити контакт із дворянами та заманюють наших громадян великими обіцянками співпроцвітання. Як нам вчинити в цій ситуації?"
 SEA_japan_foreign_policy.35.a:0 "Як вони сміють!"
 SEA_japan_foreign_policy.60.t:0 "Японія створює Державу Бірма"
 SEA_japan_foreign_policy.62.b:0 "Сунь Дяньїн більш здібний"
 SEA_japan_foreign_policy.62.t:0 "Ван Цзінвей переходить на наш бік"
 SEA_japan_foreign_policy.70.desc:0 "[FROM.GetAdjective]і дипломати передали нам ультиматум, вимагаючи перекроїти наші східні кордони та підписати з ними умовний мир, по суті відмовившись від азійських справ. Це дасть нам можливість повністю зосередити наші зусилля на поверненні наших європейських земель і, можливо, дозволить нам повернутися, щоб відвоювати схід, коли всі інші наші вороги впадуть."
 SEA_japan_foreign_policy.89.desc:0 "Ми отримали пропозицію від [FROM.GetNameDef]. Вони зацікавлені в довгостроковій торгівлі ресурсами в обмін на частину їхнього промислового потенціалу. Наразі вони націлилися на низку ресурсів у [FROM.FROM.GetName]."
 SEA_japan_foreign_policy.9.t:0 "[FROM.GetLeader] відмовляється підкоритися"
 SEA_japan_foreign_policy.95.t:0 "[FROM.GetLeader] підписує оборонну угоду"
 SEA_japan_news_events.02.a:0 "Ми принесемо процвітання всій Азії!"
 SEA_japan_popup_events.1.desc:0 "Наші агенти затримали [SOV.GetAdjective]ого перебіжчика, який називає себе Генріхом Самійловичем Люшковим, у Посьєті на маньчжурському кордоні. Схоже, він є високопоставленим офіцером НКВС, який, очевидно, володіє цінними секретними документами про [SOV.GetAdjective]у військову міць у регіоні. Він стверджує, що тікає від Великого терору; можливо, це цінна можливість отримати уявлення про внутрішню кухню [SOV.GetNameDef]?"
 SEA_japan_popup_events.14.t:0 "Завершення загальних виборів 1936 року"
