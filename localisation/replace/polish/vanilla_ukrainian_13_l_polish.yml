 INS_defenders_of_homeland_tt:0 "Цей фокус буде автоматично завершено, якщо буде створено «Захисників Батьківщини»."
 INS_exile_cat:0 "Уряд Ост-Індії у вигнанні"
 INS_first_come_first_serve_desc:0 "Хоча протекціонізм часів Великої депресії слабшає, зростання виробництва та переоцінений гульден залишили голландський експортний ринок у руїнах, оскільки наші старі торговельні партнери на заході звернулися до Південної Америки для задоволення свого попиту. Замість того, щоб переслідувати їх заради нових торговельних угод, ми могли б використати це як можливість для виходу на нові ринки в Азії."
 INS_fokker_organization:0 "[INS_fokker_name]"
 INS_guerilla_industry_desc:0 "Ми використаємо наші партизанські сили по всьому архіпелагу, щоб захопити контроль над фабриками, що дозволить нам виробляти нову зброю для озброєння нашого ополчення."
 INS_has_changed_leader:0 "Вибори відбулися менше 120 днів тому"
 INS_industrial_events.28.a:0 "Прийнято."
 INS_industrial_events.28.desc:0 "Конвої завантажили останній каучук і вийшли в море. Наші покупці отримають те, за що заплатили, а в наших книгах буде відображена узгоджена компенсація в належний час. Протягом наступних двох років витрати на цю транзакцію будуть на наших балансах, як нагадування про те, чого вимагає від нас Депресія."
 INS_industrial_events.6.b:0 "Розвивати віддалені острови."
 INS_instigate_chaos_sulawesi_desc:0 "Ми співпрацюватимемо з місцевими націоналістами на Сулавесі, організовуючи страйки, заворушення та радикалізуючи населення."
 INS_instigate_in_country:0 "Спровокувати революцію в [FROM.GetName]"
 INS_invest_in_batavian_education:0 "Інвестиції в освіту Батавії"
 INS_laskar_rakjat:0 "Ласкар Рак'ят"
 INS_loyalist_events.19.desc:0 "[FROM.GetNameDefCap] вимагає, щоб ми дозволили провести референдум у східному Папуа. На боці [FROM.GetAdjective] через джунглі прокладені нові дороги, клініки укомплектовані державними лікарями, а школи навчають місцевими мовами. На нашому боці останній губернатор відвідував Порт-Морсбі двічі за три роки. Послу [FROM.GetAdjective] не потрібно було говорити набагато більше."
 INS_loyalist_events.22.desc:0 "Уряд [FROM.GetAdjective] висунув офіційну вимогу здати Східний Тимор. Їхній посол зазначив, що наш гарнізон там налічує менше двохсот чоловік, і що Лісабон роками майже нічого не виділяв цій території. Потім він запитав, за що саме ми думаємо, що тримаємося."
 INS_loyalist_events.29.t:0 "Референдум про об'єднання схвалено"
 INS_loyalist_events.6.t:0 "[FROM.GetNameDefCap] відхиляє об'єднання"
 INS_mechanized_equipment_2_short:0 "Overvalwagen II"
 INS_mechanized_equipment_3_short:0 "Overvalwagen Braat"
 INS_medium_tank_artillery_equipment_3_short:0 "PTH-5"
 INS_no_more_political_chaos_tt:0 "Події політичного хаосу перестануть спрацьовувати."
 INS_renville_explain_USA_tt:0 "Якщо конфлікт не вирішиться протягом §Y365 днів§!:\n\n"
 INS_revolution_events.28.a:0 "Але нам обіцяли територію!"
 INS_revolution_events.33.desc:0 "Індонезійські республіканці офіційно попросили нашої допомоги в укладенні угоди з голландцями. Наші радники в регіоні повідомляють, що ситуація швидко погіршується, і що тривалі голландські військові операції ризикують загнати націоналістів в обійми Рад. Нідерланди є цінним союзником у Європі, але ми не можемо ігнорувати політичні реалії в Південно-Східній Азії. Якщо Індонезія впаде перед комунізмом через те, що ми стояли осторонь, це буде нашою провиною."
 INS_revolution_events.40.desc:0 "Гаага прийняла наш ультиматум. Голландські війська в Індонезії складуть зброю, і суверенітет буде передано Індонезійській республіці. Це задовільне завершення неприємного епізоду. Нашим інтересам у регіоні тепер набагато краще служить стабільна, незалежна Індонезія, ніж підтримка колоніального підприємства, яке голландці більше не могли підтримувати."
 INS_subsidize_laskar_armament:0 "Субсидування озброєння Ласкар"
 INS_subsidize_local_business_desc:0 "Ми повинні надавати субсидії місцевому бізнесу для стимулювання економічного зростання, що в довгостроковій перспективі зміцнить нашу економіку."
 INS_take_batavia_desc:0 "Нідерландська жадібність, яка змусила їх інвестувати майже виключно в Яву, ігноруючи східні острови, перетворила Яву на ахіллесову п'яту всієї колонії. Це стане їхнім крахом! Ми повинні кинути наші сили на штурм Яви і знищити нідерландські мережі зв'язку та постачання, унеможлививши роботу адміністрації Ост-Індії."
 INS_tin_to_japan:0 "Продати олово до [JAP.GetNameDef]"
 INS_tkr_steal_general_desc:0 "Якщо ми зможемо переконати високопоставлених членів Ост-Індійської армії приєднатися до нашої справи, ми одночасно покращимо нашу армію і саботуємо їхню."
 INS_volksraad_events.11.a:0 "Фольксраад виконує своє призначення."
