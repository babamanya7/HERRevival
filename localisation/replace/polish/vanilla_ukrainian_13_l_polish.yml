 SPA_found_the_academia_vazquez_de_mella_desc:0 "Ми повинні створити великий центр традиційного мислення, який також може бути використаний карлістськими мислителями для досягнення нових досягнень і розвитку, які можуть принести користь новій іспанській монархії."
 SPA_garrison_control_nationalists_weak_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Oслабкий§!\nКількість дивізій на початку громадянської війни: §Y1§! націоналістична — §Y2§! республіканські§!\n"
