 DEN_appropriate_odense_staalskibsvaerft_desc:0 "Щоб по-справжньому збільшити чисельність нашого флоту, нам потрібні додаткові виробничі потужності. Захоплення верфей A.P. Møller-Mærsk в Оденсе значно прискорить наші засоби виробництва."
 DEN_bop_criticize_our_preparedness_desc:0 "Над Європою знову збираються темні хмари, і ми зовсім не готові до майбутньої бурі! Ми повинні почати підготовку якнайшвидше, якщо ми хочемо пережити цю бурю."
 DEN_bop_defend_our_chosen_path_neutrality_desc:0 "На краще це чи на гірше, але ми почали йти шляхом, відхилятися від якого зараз було б дуже нерозумно. Ми повинні вірити прийнятим рішенням, які привели нас сюди, і сподіватися, що вибраний шлях є правильним."
 DEN_bop_speak_out_against_welfare_desc:0 "Перш ніж витрачати гроші на що-небудь інше, ми повинні спершу звернути увагу на нашу оборону, щоб забезпечити нашу незалежність. Зрозуміло, що без данської нації немає данців, на яких можна було б витрачати ці гроші."
