 PHI_mio_trait_naval_caliber_artillery:0 "Артилерія корабельного калібру"
 PHI_philippine_army_orchestra_desc:0 "Оркестр філіппінського констеблярства є одним із найвидатніших військових оркестрів у світі, і він був удостоєний честі грати на інавгурації президента США. Ми повинні інтегрувати оркестр в армію, щоб краще використовувати силу музики для наших солдатів, і використовувати його надихаючу енергію, щоб вселити національну бадьорість і спонукати їх до ще більших подвигів хоробрості."
