 ENG_VANGUARD_DESC_HISTORICAL:0 "Ми мусимо не бути переважені нашими ворогам в морях. У нас досі зберігаються кілька 15-дюймових гармат, які можна використати для заміни трудомістких 16-дюймових гармат, необхідних для наших наступних запланованих лінкорів, що значно прискорить будівництво головного корабля класу: HMS Vanguard."
