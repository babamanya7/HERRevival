 DEN_prospecting_new_sites:0 "Пошук нових ділянок"
 DEN_refortify_tunestillingen_desc:0 "Востаннє, коли Європа була охоплена війною, ми підготувалися до оборони, збудувавши Тунестіллінген — серію укріплень для захисту Копенгагена. Відтоді ці укріплення занепали, але, відбудувавши та модернізувавши їх, ми б забезпечили безпеку нашої столиці."
 DEN_secure_our_supply_lines_desc:0 "Армія марширує на своїх шлунках — це так само вірно сьогодні, як і тисячі років тому. На щастя, ми є великим виробником продуктів харчування, і з деякими вдосконаленнями нашої логістики ми можемо забезпечити стабільне постачання військам."
 DEN_seek_military_investments_desc:0 "Присягнувши на вірність і зміцнивши відносини з [?DEN.DEN_overlord_nation.GetNameDef], ми тепер маємо прихильність [?DEN.DEN_overlord_nation.GetLeader]. Це дозволяє нам звернутися безпосередньо до нього з проханням про [?DEN.DEN_overlord_nation.GetAdjective] інвестиції в наше військове виробництво."
 DEN_sign_a_trade_deal_desc:0 "Ми рішуче налаштовані переозброїти наші збройні сили, але на це потрібен час — час, якого у нас може не бути. Ми повинні купувати більше техніки швидше. Ми повинні звернутися до дружньо налаштованих країн і закупити те, що нам потрібно, оскільки наші власні виробничі можливості обмежені."
