 PHI_treaty_of_manila_subject_desc:0 "Довга боротьба за незалежність наближається до кінця. Від революції проти Іспанії до важкої війни проти Сполучених Штатів і довгих років у статусі Співдружності, Філіппіни вистояли. З підписанням Манільського договору наша країна нарешті постає як вільна і суверенна нація, чия незалежність офіційно визнана світом."
