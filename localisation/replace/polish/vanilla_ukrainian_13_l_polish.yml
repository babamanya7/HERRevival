 mtg_britain.2.d:0 "Посеред величезного обурення, викликаного рішенням короля, лунають голоси на підтримку короля Едуарда. Хоча вони ізольовані від основних політичних партій, їхні імена, тим не менш, мають вагу: Вінстон Черчилл, Освалд Мослі та Дейвід Ллойд Джордж.\n\nХоча спочатку і невпевнено, ця група малоймовірних політичних союзників починає знаходити підтримку в народі, і за їхнім прикладом все більше людей наважуються публічно підтримати Едуарда в його рішенні.\n\nТаким чином, зміцнившись у своїй рішучості, Король дав зрозуміти, що не має наміру змінювати свою думку в цьому питанні. Шлюб відбудеться, як і було заплановано."
 mtg_britain.30.t:0 "[From.GetName] просить погодитися на невтручання"
 mtg_britain.69.t:0 "Держава [USA.GetName] висловлює несхвалення [CAN.GetAdjective]им комунізмом"
 mtg_britain.93.d:0 "[From.GetAdjective] уряд повідомив нас про те, що погоджується з нашим проханням збільшити інвестиції у внутрішню промисловість. Вони негайно виділять кошти."
 mtg_britain.96.b:0 "Ми мусимо стійко дотримуватися політики умиротворення."
 mtg_britain.98.a:0 "Безхребетні слабаки!"
 mtg_netherlands.19.a:0 "Це чудова ідея!"
 mtg_netherlands.26.b:0 "Не їм вказувати, що в наших інтересах."
 mtg_netherlands.35.d:0 "[From.GetNameDefCap] пропонує обмінятися розвідувальними даними про можливих ворогів, з якими ми можемо зіткнутися разом у бою."
 mtg_netherlands.36.a:0 "Це багаторазово посилить нашу спільну оборону."
 mtg_netherlands.56.t:0 "Принца Бернарда поранено під час організації опору"
 mtg_netherlands.78.d:0 "[From.GetAdjectiveCap]ий уряд повідомив, що він схвалює нашу пропозицію про об'єднання країн Бенілюксу. Якщо його приймуть усі сторони, ми зможемо розпочати реалізацію наших планів."
 mtg_news.12.c:0 "Ми самі господарі своєї долі."
 mtg_news.25.c:0 "Цікаво..."
 mtg_news.26.b:0 "Кляті британці, всюди вони лізуть!"
 mtg_news.28.c:0 "Нас змусили."
 mtg_news.29.d:0 "Британці вийшли на стежку війни."
 mtg_news.34.a:0 "Скатертиною дорога."
 mtg_news.37.a:0 "І ми справді готові."
 mtg_news.37.c:0 "Британці брязкають зброєю перед усім світом."
 mtg_news.40.c:0 "Це буде дуже відважна спроба."
 mtg_news.50.a:0 "Тепер ми зможемо сконцентруватися на материку."
 mtg_news.55.desc:0 "В результаті недавньої бомбардування в Лондоні загинули король Едуард і його дружина Уолліс. Приблизно о 3 годині дня раптовий наліт бомбардувальників змусив їх сховатися в підвалі палацу. Одна з бомб потрапила в будівлю і обрушила стелю підвалу його свиту.\n\nПоки народ оплакує втрату монарха, його брат Альберт готується успадкувати за ним трон під ім'ям Георга VI."
 mtg_usa_civil_war_democrats.31.t:0 "Середній Захід виходить із Союзу"
 mtg_usa_civil_war_fascists.11.t:0 "Держава втручається у збір податків"
 mtg_usa_civil_war_fascists.202.desc:0 "Зайнявши території так званої держави [USA_liberated_state.GetName], наші війська зустріли велику кількість громадян, налаштованих доброзичливо та бажаючих допомагати нам. У патріотичному пориві вони заявили про те, що готові вступити до нашої армії."
 mtg_usa_diplomatic_protest.1.desc:0 "Прибув лист, який надіслав особисто [USA.GetAdjective] президент [USA.GetLeader]. Не соромлячись висловлювань, президент засудив «недавні дії, з якими не можна миритися» і які дестабілізують ситуацію в регіоні. Як стверджується у листі, держава [From.GetNameDefCap] зберігає вірність справі миру та стабільності в регіоні і вживе всіх необхідних заходів, включаючи військові, якщо ми наполягатимемо на своєму."
 mtg_usa_diplomatic_protest.4.desc:0 "Назвавши нашу ноту «неприйнятним втручанням у міжнародні справи держави [From.GetNameDef]», [From.GetAdjective] уряд прямо відмовився обговорювати питання суверенітету своїх американських володінь."
 mtg_usa_pacific_pacification.2.a:0 "Чудово."
 mtg_usa_protect_south_america.3.t:0 "[From.GetNameDefCap] відмовляється від нашого керівництва"
 mtg_usa_senate_large_opposition_tt:0 "До §Y25 сенаторів§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_senate_medium_opposition_tt:0 "До §Y8 сенаторів§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_strategic_interests.3.b:0 "Ці території не варті такої ціни."
 mtgnavalsupportfolder_desc:0 "Корабельне озброєння та спеціалізоване корабельне оснащення. Досліджуйте нові модулі, щоби налаштовувати Ваші кораблі."
 murder_trotsky_attack:0 "Убивство"
 murder_trotsky_outcome_tt:0 "Ми спробуємо вбити Троцького, впровадивши агента в його оточення."
 mutiny_event.9.desc:0 "Despite strong objections from the military, every unit in the [Root.GetAdjective] Army carried out elections to select their commander. The results have been very surprising, as most of the elected are accomplished soldiers with plenty of experience in the field. While many professional officers still consider this to be a personal insult, there can be little doubt that most soldiers dramatically prefer this situation."
 naval_air:0 "Морська авіація"
 naval_air_effort_desc:0 "Американці продемонстрували ефективність авіаударів проти морських цілей ще в 1921 році. Нерозумно нехтувати цим видом авіації, якщо ми плануємо змагатись із морською державою."
 naval_strike_torpedo_tactics_oi_desc:0 "$naval_strike_torpedo_tactics_desc$"
 needs_approval:0 "§R[This.GetName] має затвердити угоду, щоби бонуси почали діяти.§!\n"
 neo_assyrian_empire_category_desc:0 "На піку своєї могутності Новоассирійська імперія домінувала над більшою частиною Близького Сходу. Ми повинні прагнути відновити нашу державу до її давньої слави та відвоювати нашу імперію минулого."
 neo_assyrian_empire_decision:0 "Повернути нашу давню славу"
 neo_mesopotamia_neutrality_ADJ:0 "Месопотамськ"
 neo_mesopotamia_neutrality_DEF:0 "Королівство Месопотамія"
 news.105.d:0 "Наступальні німецькі війська зуміли оволодіти Сталінградом — містом на березі Волги, названим на честь Сталіна. З важкими боями пробившися крізь руїни тракторного заводу і захопивши стратегічну висоту на Мамаєвому кургані, німці витіснили залишки радянських військ на східний берег Волги. За непідтвердженими відомостями, частина бійців разом із партизанами сховалась у каналізації та підвалах, щоб продовжувати боротьбу.\n\nАле ніякого суттєвого опору поки непомітно."
 news.114.d_leader:0 "Останнє вогнище французького опору було придушене сьогодні в Парижі, і тепер місто перебуває під контролем італійців.\n\n[ITA.GetLeader] прилетів, щоб особисто провести парад перемоги на Єлисейських полях й очолив його верхи на білому коні. У своїй урочистій промові він порівняв французьку кампанію з завоюванням Галлії Цезарем і пообіцяв, що це лише початок відродження величі Італії.\n\nЧас покаже, чи правий він."
 news.12.a:0 "Це погано закінчиться."
 news.123.t:0 "Падіння Гонконгу"
 news.128.b:0 "Усе пройшло як треба!"
 news.137.t:0 "Звільнення Лондона"
 news.152.d:0 "Після спроби Німеччини порушити умови Версальського договору та провести ремілітаризацію Райнланду Францією було направлено ультиматум, який змусив Берлін відступити. Велика Британія відмовилася втручатися, але Франція пригрозила війною у разі, якщо Німеччина продовжуватиме свої дії, і незабаром стало очевидним, що німці не готові до військового зіткнення.\n\nРайнланд залишиться демілітаризованим згідно з угодою, інакше Німеччину чекає війна."
 news.159.d_02:0 "[From.GetLeader] повідомив сьогодні, що [From.GetName] бажає укласти новий союз. [From.GetFactionName] заявляє про свою готовність до співпраці у разі війни.\n\nХоча великі коаліції можуть стримувати агресію, ми бачили, до яких наслідків це призводить, коли конфлікт таки виникає. Наміри держав, які створили новий альянс, поки що неочевидні, але ніхто, навіть його засновники, не може передбачити, яким цілям він слугуватиме в підсумку."
 news.166.t:0 "Лондонська угода"
 news.168.i:0 "Силу Італії по-справжньому визнають."
 news.170.c:0 "Це недобре."
 news.173.d_1:0 "Комуністичні делегації зі всього світу зібралися сьогодні у Парижі на установчий з'їзд. Його скликали прихильники теорій Троцького, які заклали основу Четвертого інтернаціоналу.\n\nХоча поки що і невідомо, як організаторські зусилля змінять сили на міжнародній політичній арені, ця новина викликала занепокоєння Сталіна. Він підозрював, що багато високопоставлених членів партії та військові потай підтримують Троцького, і багато з них досі живі. Знову охоплений параноєю, Сталін став частіше усамітнюватися. Його підозри та неврівноваженість привели до кризи радянської влади. Такими темпами в країні може спалахнути громадянська війна."
 news.179.a:0 "Французький уряд є ворогом власного народу!"
 news.180.a:0 "Єдині на шляху до світової революції!"
 news.180.c:0 "Не можна дозволити, щоб вороги демократії ставали сильнішими."
 news.181.d:0 "Після чергового посилення диктаторського режиму [France.GetName] оголошує, що настав час знайти союзників у боротьбі з загрозою світового комунізму. Як виявилося, цей союзник — [From.GetName].\n\nУ своїй ранковій заяві [From.GetLeader] повідомляє про те, що [France.GetName] та [From.GetName] відтепер є братами. «Наше спільне минуле робить нас не ворогами, а союзниками! Титани Європи стануть пліч-о-пліч»."
 news.201.b:0 "Жахлива сила [GER.GetFactionName] руйнує країни, як доміно."
 news.202.a:0 "Справедливий обмін для виправлення помилок Версалю."
 news.204.b:0 "Значить, війна."
 news.207.d_fascism:0 "\nУ відповідь на дедалі агресивнішу риторику [SOV.GetNameDef], [USA.GetLeader] виступив проти того, що він називає «найбільшою небезпекою для людської цивілізації» — комунізму».\n\nНе тільки [USA.GetNameDef] буде проводити захисну політику, щоб запобігти поширенню світового соціалізму в Америці, але прагне знищити саме серце комунізму.\n\nЗ потужністю військової машини [USA.GetAdjective], повне знищення всього комунізму здається — вперше — цілком можливим."
 news.209.e:0 "Війна в Сибіру здається неминучою"
 news.217.c:0 "Якщо вони відхилять мирну співпрацю..."
 news.223.c:0 "[ENG.GetNameDefCap] повинна зробити важкий вибір."
 news.24.t:0 "Польське питання"
 news.253.t:0 "[AST.GetNameDefCap] Дистанціюється від Співдружності"
 news.254.c:0 "Це зрада!"
 news.264.a:0 "Африканці? Самоврядування?!"
 news.280.d:0 "Не наш зоряний час."
 news.286.c:0 "Австралія покидає Співдружність."
 news.287.c:0 "Фашисти наступають — поки що."
 news.292.a:0 "Братські зв'язки та кілька зручних хабарів..."
 news.293.a:0 "Дуже прикро."
 news.301.a:0 "Ми на шляху до величі!"
 news.303.desc:0 "Дотримуючись своїх обіцянок виправити Тріанонський договір, Угорщина зажадала від [From.GetName] повернення Південної Словаччини. [From.GetAdjective]а влада ще не відповіла, але загроза війни в [HUN.GetAdjective]ій риториці є надто очевидною. Відмова може призвести до нової війни в регіоні."
 news.317.desc:0 "Посилаючись на зростаючу небезпеку, яку несуть ідеології на сході та заході країни, румуни оголосили про створення «Санітарного кордону». Альянс вітає всіх, хто опинився під гнітом фашизму та комунізму у Східній Європі, і вже зараз деякі країни розглядають можливість об'єднати свої зусилля з Румунією."
 news.317.g:0 "Це псує наші плани..."
 news.319.b:0 "Приходьте і забирайте!"
 news.32.c:0 "Підіймемо бокал за наших нових німецьких друзів!"
 news.327.b:0 "Вони можуть спробувати!"
 news.328.c:0 "Назріває ще один конфлікт."
 news.332.a:0 "Мудре рішення."
 news.337.desc_some_states:0 "Сьогодні було підписано мирний договір між [ETH.GetLeader] та [ITA.GetLeader], який припиняє військові дії між двома країнами. Незважаючи на величезну різницю в силі між королівством, що не має виходу до моря, та імперією, що охоплює весь світ, ефіопський уряд, безумовно, вийшов переможцем у цих переговорах. Італія не тільки повинна укласти перемир'я з Ефіопією, але й деякі з колишніх італійських територій у Східній Африці були офіційно передані державі [ETH.GetNameDef].\n\nЦе вже друга поразка італійських збройних сил в Ефіопії, уряд [ITA.GetLeader] перебуває в руїнах, і, ймовірно, пройде багато років, перш ніж поранена італійська гордість по-справжньому оговтається від цієї поразки."
 news.337.title:0 "Приниження в Африці"
 news.36.t:0 "Аншлюс Австрії"
 news.47.b:0 "Божевільний..."
 news.58.f:0 "Вільний світ залежить від нас."
 news.63.d:0 "В Іспанії спалахнула громадянська війна! Декілька генералів вирішили повалити уряд у Мадриді і закликали до повстання, після чого на їхній бік перейшли майже всі іспанські війська.\n\nПраві націоналісти захопили більшу частину території країни, включно з островами.\nЛоялісти та добровольці збираються під прапори лівого республіканського уряду. Вони мають намір боротися до останнього подиху.\n\nБитва за Іспанію почалася."
 news.66.b:0 "Ми показали світу свою найкращу сторону."
 news.9.a:0 "Можливо, за цим послідує довгий мир."
