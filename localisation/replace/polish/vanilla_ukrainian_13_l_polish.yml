 ENG_britain_demands_treaty_compliance_desc:0 "[ENG.GetNameDefCap] has demanded that we reduce the numbers of our capital ships to bring us back in line with the stipulations of the Washington Naval Treaty."
 ENG_concessions_to_the_trade_unions_tt_2:0 "§RЯкщо деколонізація не була досягнута протягом 2 років із переходу на комунізм, у країні почнеться громадянська війна!§!\n"
 ENG_enforce_decolonization_desc:0 "Так само, як деколонізувалися ми, так само мусять зробити й інші народи світу. Ми висунемо ультиматум, і ті, хто не бачить мудрості наших слів, будуть змушені її побачити."
 ENG_enforce_the_naval_treaties_desc:0 "Нам стало відомо, що певні держави вирішили проігнорувати положення Вашингтонського морського договору. З цим не можна миритися. Якщо ми хочемо зберегти перевагу і не допустити, щоб у інших виникла така ж ідея, ми мусимо завдати швидкого удару і показати приклад тим, хто нехтує нашою волею."
 ENG_every_man_will_do_his_duty:0 "Кожен мусить виконувати свій обов'язок"
 ENG_follow_moscow_desc:0 "У своєму корінні комунізм у Британії завжди виконував накази міста [SOU.Capital.GetCapitalVictoryPointName]. Продовжувати робити це зараз не тільки логічно, але й необхідно. Між Червоною армією і нашим флотом ми поширимо слово Маркса далеко і широко, і ніхто не зможе нас зупинити."
