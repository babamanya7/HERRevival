 NSB_poland_communist_events.4.a:0 "Ми згодні."
 NSB_poland_royal_election.2.a:0 "Об'єднати наше правління? Чудова ідея!"
 NSB_poland_royal_election.4.a:0 "Нашим королем стане останній із роду Романових. Ймовірно."
 NSB_polish_fascist_events.302.t:0 "[From.GetNameDefCap] посилює хватку"
 NSB_polish_fascist_events.7.t:0 "Національні вибори у Польщі"
 NSB_soviet_civil_war_common.001.desc_right_no_concessions:0 "Наші переможні армії проходять маршем біля Кремля. Ми перемогли!\nСьогодні починається нова ера в історії держави [ROOT.GetNameDef]. [ROOT.GetLeader] і його мудре керівництво допоможуть відновити країн ніж раніше."
 NSB_soviet_civil_war_common.106.b:0 "Дуже добре. Ми навіть відправимо туди військових радників."
 NSB_soviet_civil_war_common.107.desc_advisors:0 "[FROM.GetAdjectiveCap]ий уряд погодився допомогти нам нарощувати військову міць в обмін на права на видобуток нафти в майбутньому. Крім того, він погодився відправити нам кілька військових «радників», які залишаться з нами протягом усієї громадянської війни."
 NSB_soviet_civil_war_common.114.c:0 "[SOS.GetLeader] серйозно постраждає від таких подій."
 NSB_soviet_civil_war_common.120.t:0 "[FROM.GetAdjectiveCap]ий уряд не підтримає нас"
 NSB_soviet_communist_civil_war.003.c:0 "Нам потрібен хтось із військовим досвідом."
 NSB_soviet_communist_civil_war.004.c:0 "Ось як."
 NSB_soviet_communist_civil_war.005.t:0 "Міжнародні бригади прибувають"
 NSB_soviet_fascist_tsarist.19.a:0 "Ми погодимося — заради майбутньої стабільності Європи."
 NSB_soviet_fascist_tsarist.2.desc:0 "Ми отримали новини від [FROM.GetAdjective] уряду: [FROM.GetNameDef] приймає нашу пропозицію вступити до Панслов'янського союзу."
 NSB_soviet_foreign_politics_events.12.b:0 "Так ми створимо лише марну напругу у відносинах із сусідом."
 NSB_soviet_foreign_politics_events.155.t:0 "[FROM.GetAdjectiveCap]ий уряд відповідає відмовою."
 NSB_soviet_foreign_politics_events.200.b:0 "Можливо, ми зможемо знайти компроміс?"
 NSB_soviet_foreign_politics_events.281.desc:0 "[SIK.GetLeader] приймає нашу пропозицію логістичної та військової допомоги в територіальній експансії на схід. Нам дозволять побудувати на їх новонабутих територіях інфраструктуру та оборонні об'єкти, а також розробляти Натомість [SIK.GetAdjective] уряд дасть нам фінансові пільги на своєму ринку і збільшить обсяг експорту в нашу країну."
 NSB_soviet_foreign_politics_events.30.desc:0 "Кілька тижнів тому [FROM.GetAdjective]а пропаганда та про-[FROM.GetAdjective]і ЗМІ розпочали кампанію з повернення до порядку денного питання про Аляску. Якщо казати стисло, вони стверджують, що продаж проведено або шахрайським шляхом, або під тиском, також вони стверджують, що жителі регіону — як місцеві, так і переселенці — краще почуватимуться громадянами держави [FROM.GetNameDef]., в якій стверджувалося, що так званий «уряд Аляскинської Автономної Республіки у вигнанні» офіційно запросив перехід під управління держави [FROM.GetNameDef] і що [FROM.GetLeader] цей запит схвалює. Тепер, як стверджує посол, залишилося лише обговорити деталі цього переходу."
 NSB_soviet_nationalist.004.b:0 "Мабуть, доведеться трохи зачекати"
 NSB_soviet_paranoia_system_events.01.t:0 "[Root.GetLeader] турбується про роздробленість"
 NSB_soviet_paranoia_system_events.12.b:0 "Така реакція абсурдна і надмірна."
 NSB_soviet_paranoia_system_events.19.t:0 "[GetMoscowTrialPurgeName]"
 NSB_soviet_paranoia_system_events.31.a:0 "На флоті таким людям не місце."
 NSB_soviet_planned_economy.1.desc:0 "[SOV.GetLeader] представляє нову схему спільної планової економіки.\nПлан НЕП не позбавлений недоліків, але [FROM.GetAdjective] уряд вірить, що має і сильні сторони. Він має намір створити модель планової економіки, в якій буде збільшена взаємозалежність держави [FROM.GetNameDef] та її партнерів, і таким чином прокласти дорогу до істинно соціалістичного суспільства."
 NSB_soviet_spanish_civil_war.6.desc_1:0 "Сьогодні вранці в нашу організацію доставили лист, який написав сам [SPC.GetLeader]. У ньому іспанський лідер оголошує, що його народ ніколи не забуде про підтримку, отриману від справжніх радянських революціонерів, і що коли ми станемо на боротьбу з тиранією Сталіна, РПМО зробить все можливе, щоби допомогти радянському народу боротися за свободу та справжню революцію."
