 norwegian_defense_cross_of_honor:0 "Почесний хрест захисників Норвегії"
 nsb_news.2.e:0 "Це... безумовно імперіалізм."
 nsb_news.303.a:0 "Нарешті Сибір вільна від ярма імперіалізму!"
 nsb_news.402.b:0 "Відмінна ідея від наших нових союзників зі сходу."
 nsb_news.404.desc:0 "Відтоді, як остання громадянська війна поставила країну на коліна, російська православна церква швидко набирала впливу. Тепер, коли завоювання старої Візантії завершено, зроблено останні кроки з об'єднання церкви та держави.\n\nОтримавши відразу титули патріарха і Царя Всія Русі, [SOV.GetLeader] очолює країну, охрещену як «[SOV.GetNameDef]», слідуючи, як він сам каже, «волі Божій»."
 nsb_news.5.desc.cossack:0 "5 листопада 1916 року німецький Вільгельм II та австрійський Франц Йосип підписали спільну декларацію про створення нової держави з польських земель, окупованих Росією, — Королівства Польща. Проте молода держава не змогла знайти оголосив Другу Польську республіку.\n\nТепер же, здається, Польща нарешті знайшла собі короля — ним буде [POL.GetLeader]! [POL.GetLeader] — козак, аристократ і воєначальник. бажання мати особисті володіння в Балтиці дуже імпонує польським міністрам, у чиїх серцях ще живі амбіції щодо відновлення Унії."
 nsb_news.9.i:0 "Шляхетна справа, але чи зможуть вони перемогти?"
 nuke_dropped.12.d:0 "Today, the city of Copenhagen was struck by a nuclear explosion, launched by [?global.nukecountry.GetNameDef]. Having grown after escaping destruction in the Great War thanks to Denmark's neutrality, the capital has never experienced an attack close to this devastating since the Napoleonic Wars. The surrounding area of Öresund has also seen significant fallout and survivors have begun escaping to Fyn and the mainland in fear of further attacks.\n\nKing Christian X's whereabouts are currently unknown, and the nation's morale has been severely damaged by the attack. It remains to be seen if this is the beginning of the end for one of Europe's oldest nations."
 occupied_countries.1.b:0 "Вони поки що не готові."
 occupy_south_italy_fra_desc:0 "Необхідно захопити південну частину Італії разом із Сицилією та Сардинією. Займіть всі цілі, але не відволікайтеся від основної — Риму. Окупувавши Вічне місто, продовжіть наступ уздовж узбережжя, пригнічуючи осередки, що залишилися."
 operation_herkules:0 "Операція «Геркулес»"
 operation_ikarus_desc:0 "Для підтримки операцій кригсмарині в Північній Атлантиці Верховне головнокомандування вермахту схвалило вторгнення до Ісландії. Контроль над цим островом дозволить нам проводити операції далі на захід і сприятиме успішному завершенню битви за Атлантику."
