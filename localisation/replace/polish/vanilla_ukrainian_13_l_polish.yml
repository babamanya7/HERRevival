 plane_designer_fighter:0 "Винищувач"
 plane_tac_bomb_upgrade_desc:0 "$plane_bomb_upgrade_desc$"
 poland.17.d:0 "Валерій Славек нарешті повернув собі місце голови уряду держави [Root.GetNameDef]. [Root.GetLeader] тепер займає швидше роль радника, але багато хто часто сумнівається в політичній орієнтації Славека. Хтось вважає його соціалістом, який бажає реформ, але багато хто з його критиків вважають його черговим авторитарним політиком, таким же, як [Root.GetLeader] або Ридз-Сміглий. Славек покінчить із цими питаннями, коли він знову внесе поправки до конституції Польщі."
 poland_goal_1:0 "Підготовка до війни"
 political.1.d:0 "«Поки робітники повстають проти своїх гнобителів по всьому світу, ті, хто стверджує, що досягли класової свідомості в державі [Root.GetName], сидять склавши руки та чекають на зміни зсередини політичної системи настільки корумпованої, що тільки революція може врятувати нас від неї!»\n\nТак кажуть нові голоси в [Root.GetAdjective]ому комуністичному русі. Називаючи правління партії [Root.GetRulingParty] диктатурою буржуазії, вони почали закликати до її усунення від влади будь-якими засобами. Чи прийдуть ці засоби зсередини, чи ззовні, ще невідомо."
 political.15.d:0 "Послаблення обмежень на те, яку пропаганду проти партії [Root.GetRulingParty] можна публічно поширювати, очікувано призвело до збільшення кількості публічних висловлювань незгоди. Організовані демонстрації та розповсюдження брошур поки що відбуваються переважно в академічних установах і деяких неблагополучних районах держави [Root.GetName], але немає жодних сумнівів, що рух поширюється.\n\nЛідери країни розриваються над цим питанням. [Root.GetLeader], який зберігає залізну хватку партійного керівництва, не має особливого бажання врізноманітнювати публічні дебати. Однак перші кроки вже зроблено, і шляху назад може не бути."
