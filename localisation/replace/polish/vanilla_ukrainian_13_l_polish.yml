 GOE_RAJ_loyalist.03.desc:0 "Сьогодні вранці керівні офіси [RAJ.GetNameDef] звернулися до нас із пропозицією, яка вимагає дозволу на початок повномасштабного вторгнення в [PER.GetNameDef]. Вони називають кілька причин, включаючи захист Перського коридору та превентивне захоплення нафтових родовищ [PER.GetNameDef], перш ніж будь-хто з наших ворогів добереться до них. Таке вторгнення може викликати гнів у світової спільноти, але було б нерозумно заперечувати переваги. Як ми повинні діяти?"
