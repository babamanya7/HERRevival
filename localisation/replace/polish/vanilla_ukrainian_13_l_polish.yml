 CZE_embrace_corporatism_desc:0 "Ми могли б домовитися з промисловцями, щоб вони допомогли відновити наше переозброєння, якщо ми погодимося на деякі їхні умови. Певні зміни в політиці на їхню користь є цілком розумними і в наших інтересах."
 CZE_enlarge_smaller_wells_desc:0 "Незважаючи на свій розмір, наші менші свердловини можуть давати набагато більше, ніж та мізерна кількість нафти, яку вони виробляють зараз. Усе, що нам потрібно зробити, — це інвестувати час, щоб втілити це в життя."
 CZE_enter_exile:0 "Піти у вигнання"
 CZE_german_czechoslovak_equipment_design_group_desc:0 "The scientists of [GER.GetNameDef] and [CZE.GetNameDef] has begun to cooperate in the design of tanks and planes."
 CZE_german_puppet_desc:0 "Німеччина не зупиниться, поки не підкорить нас собі. Можливо, схиливши коліна заздалегідь, ми зможемо зберегти певну автономію?"
 CZE_increase_food_and_resource_imports_desc:0 "Оскільки наші нові союзники мають потужну сільськогосподарську промисловість, тепер менше потреби субсидувати власну. Дешевий імпорт ресурсів не лише заощадить наші гроші, але й дасть поштовх економіці наших союзників."
 CZE_inf_and_artillery_advancement_desc:0 "Піхота — найважливіший рід військ у нашій армії, а тому поліпшення піхотної зброї серйозно підвищить обороноздатність країни."
