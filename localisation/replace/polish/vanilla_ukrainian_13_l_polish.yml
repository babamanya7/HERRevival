 INVITE_DECLINED_RESOLUTION:0 "Запрошення відхилене"
 IRQ_armored_car_equipment_1_short:0 "Humber"
 IRQ_axis_training_desc:0 "Наші союзники готові поділитися частиною досвіду, який вони здобули за останні роки конфлікту з нашими ворогами. Ми приймемо цю допомогу, щоб якнайкраще підготувати наші війська до фронтової служби."
 IRQ_extensive_irrigation_projects_desc:0 "Велика частина нашої землі посушлива та несприятлива для сільського господарства. Однак, за допомогою масових іригаційних проєктів, ми зможемо перетворити такі райони на пишні орні поля."
 IRQ_fascism_party_long:0 "Партія національного братерства"
 IRQ_greater_iraq_tag_neutrality_DEF:0 "Великий Ірак"
 IRQ_liberate_levant_desc:0 "Левант був розділений переможцями Великої війни, що призвело лише до кровопролиття та страждань для народів регіону. Ми більше не можемо стояти осторонь, поки наші родичі страждають від такої долі."
 IRQ_political_events.29.a:0 "Яка недалекоглядність..."
 IRQ_political_events.33.a:0 "Арабська солідарність перемогла сьогодні."
