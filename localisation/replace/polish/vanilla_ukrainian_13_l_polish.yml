 super_heavy_tank_equipment_desc:0 "Надважкі танки є еволюцією концепції важких танків. Більші, краще озброєні, з більшою бронею, вони також повільніші та мають серйозні проблеми з м'яким ґрунтом. Лише деякі мости можуть сподіватися витримати їх вагу."
