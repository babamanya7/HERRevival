 AAT_Sweden.19.t:0 "[SWE.GetNameDefCap] повертає Нарвік"
 AAT_Sweden.19_tt:0 "§Y[ROOT.GetNameDefCap]§! зможе нагороджувати §Yпольових командирів§! §YХрестом Пошани Норвезької оборони§!."
 AAT_Sweden.22.t:0 "[FROM.GetName] відхиляє пропозицію оборонного союзу"
 AAT_Sweden.24.t:0 "[FROM.GetName] відхиляє членство в альянсі"
 AAT_Sweden.3.b:0 "[AAT_Sweden_3_b_loc]"
 AAT_Sweden.3.d:0 "Ганссон спричинив цей хаос. Вігфорс мусить очолити соціал-демократів замість нього."
 AAT_Sweden.32.a:0 "«Безпрецедентний», хай йому грець."
 AAT_Sweden.51.a:0 "Відмінно."
 AAT_Sweden_BoP.14.d_democratic:0 "День виборів настав, і виборці зробили свій вибір. $SWE_democratic_party_long$ сформує мажоритарний уряд найближчими днями. Дехто вважав, що обіцянки Folkhemmet застаріли, але цей результат доводить помилковість цього ствердження. Все, що їм залишається, — це завершити розпочате."
 AAT_Sweden_communism.5.a:0 "Притягнути їх до відповідальності."
 AAT_Sweden_communism.6.a:0 "Конфіскуйте їхні активи, вони можуть працювати, як і усі інші"
 AAT_Sweden_flashpoints.10.c:0 "Із конфронтації з радянцями ми мало отримаємо."
 AAT_Sweden_flashpoints.37.b:0 "Розпочинайте вторгнення в державу [SWE.GetName]."
 AAT_Sweden_flashpoints.53.t:0 "Спалахує [SWE.GetAdjective]а громадянська війна"
 AAT_Sweden_flashpoints.56.a:0 "Ми не можемо покинути материк."
 AAT_Sweden_flashpoints.57.a:0 "Який безлад."
 AAT_Sweden_flashpoints.80.t:0 "[FIN.GetName] погоджується"
 AAT_Sweden_nationalists.16.desc:0 "Сьогодні антимонархічній групі вдалося зірвати візит короля до провинції [FROM.FROM.GetName]. Незважаючи на всі зусилля поліції стримати їх, протестувальникам вдалося заблокувати запланований маршрут королівського автомобіля, що змусило скасувати поїздку, побоюючись ще більшої небезпеки."
 AAT_Sweden_nationalists.29.desc:0 "$AAT_Sweden_nationalists.22.desc$"
 AAT_Sweden_nationalists.5.desc:0 "Побоювання, що контр-протестувальники зірвуть марш штурмовиків у регіоні [FROM.FROM.GetName], здійснилися сьогодні, коли дві групи жорстоко зіткнулися на вулицях. Багато людей було поранено та вбито з обох сторін, але, зрештою, громадська думка виявилася на боці антифашистів, тож штурмовики були змушені сховатися в місцевому магазині до прибуття поліції."
 AAT_britain_narvik.4.t:0 "[ENG.GetName] виводить свої війська"
 AAT_finland_continuation_war.06.desc:0 "[FROM.GetAdjective]і війська почали свої заплановані атаки на [SOV.GetAdjective]і позиції відповідно до нашої угоди про співпрацю. [FROM.GetAdjective]і брати по зброї допомогли нам розтягнути радянський фронт ще сильніше, і прорив уже близький."
 AAT_finland_diplomacy.12.desc:0 "[FROM.GetLeader] погоджується на нашу пропозицію про об'єднання зі східними карелами і передає нам їхні території. Великий [FROM.GetAdjective]ий народ — друг народу фінського!"
 AAT_finland_diplomacy.16.b:0 "Вони ганьблять себе!"
 AAT_finland_diplomacy.17.b:0 "Вони занадто багато про себе загордилися"
 AAT_finland_diplomacy_baltic:0 "балтійськ"
 AAT_finland_misc_events.05.a:0 "Відмінно"
 AAT_finland_national_defense.03.a:0 "Жахливі новини!"
 AAT_germany.10.desc:0 "З недавньою окупацією області [144.GetName] [FROM.GetAdjective]ими силами та їхніми поплічниками, [GER.GetLeader] посили[GER.Leader.GetVerbGendEndA_RU] тиск на нас, щоби ми торгували з ними більшою кількістю ресурсів для забезпечення їхніх військових машин. Пропонована угода не є повністю односторонньою, і відмова від неї може призвести до того, що ми будемо втягнуті у війну..."
 AAT_germany.3.t:0 "[FROM.GetName] приймає нашу угоду"
 AAT_norway.13.c:0 "Ми мусимо зробити все в наших силах, щоби затримати їх!"
 AAT_norway.14.b:0 "Цей блазень? Ми подбаємо про державу [NOR.GetNonIdeologyName] самі."
 AAT_norway.17.desc_monarchist:0 "Посилаючись на багатовікові документи, [FROM.GetAdjective]а корона стверджує, що ми контролюємо території, які де-юре є частиною королівських титулів, успадкованих королем Норвегії Гоконом VII.\n\nЯкщо конкретніше, то вони мають на увазі землі [GetNorwegianClaims]."
 AAT_norway.2.t:0 "Троцький під домашнім арештом на фермі"
 AAT_norway.8.desc_NOR:0 "Неспокійного колишнього революціонера Лева Троцького доставили до Москви, де його утримуватимуть, а може й стратять, залежно від забаганок лідера [SOU.GetLeader].\n\nНезалежно від його долі, ми можемо нарешті вмити руки від цієї тривалої справи, з додатковою перевагою — стати ближче до держави [SOU.GetNameDef]."
 AAT_norway_allied.1.b:0 "Це може бути небезпечно."
 AAT_norway_communist.1.b:0 "Торгівля — це буржуазне поняття!"
 AAT_norway_rikstanken.3.a:0 "Єдиний танк не зашкодить."
 AAT_trotsky_sent_to_stalin:0 "[get_trotsky_lastname] екстрадований до держави [SOV.GetNameDef]"
 ABDA_spirit_tooltip:0 "Змінює §YВерховне командування ABDA§!:"
 ACE_ASSIGNED_TO:0 "Призначено до авіакрила $NUM|H$x $UNIT|H$ ($LOC|H$)"
