 RAJ_the_defense_of_hong_kong_desc:0 "У міру зростання тиску в [CHI.GetNonIdeologyName], [ENG.GetAdjective] корона турбується про долю своїх володінь у Гонконгу. Ми займаємо ідеальне положення, щоб допомогти захистити місто від вторгнення, і якщо ми досягнемо успіху, це принесе нам прихильність та схвалення від [ENG.GetAdjective] уряду."
 RAJ_the_punjab_accord:0 "Пенджабська угода"
 RAJ_the_second_duar_war_desc:0 "[BHU.GetAdjective] народу більше не можна дозволяти бути незалежною державою, враховуючи ситуацію у світі. Нам потрібно поглинути їх до складу Індії."
 RAJ_theocratic_rule_alt:0 "Спадщина монголів"
