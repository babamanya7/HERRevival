 SIA_develop_northern_indochina:0 "Розвиток Північного Індокитаю"
 SIA_direct_army_fundings_towards_the_navy_desc:0 "Армія довго споживала левову частку військових витрат, проте стратегічні потреби [ROOT.GetNameDef] не є суто континентальними. Перенаправивши кошти на флот, ми зможемо почати виправляти цей дисбаланс і убезпечити моря, які захищають нашу торгівлю та узбережжя."
 SIA_exclusivity_resource_contract:0 "Контракт на ексклюзивні ресурси"
 SIA_finish_the_triangular_defense_network_desc:0 "Після завершення двох фортець на Півночі та Півдні ми можемо об'єднати їх з Бангкоком, щоб створити трикутну оборонну мережу. Якщо впаде одна, інші все одно залишатимуться в робочому стані."
