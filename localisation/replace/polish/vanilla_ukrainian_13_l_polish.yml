 tsr_manchukuo.14.desc:0 "Після численних обговорень з японцями нарешті було погоджено переведення $JAP_naoki_hoshino$ до нашого кабінету. Він добре послужить нам, допомагаючи зростанню нашої економіки на посаді директора Ради із загальних справ."
 tsr_manchukuo_border_war.6.b:0 "Хебей все ще стоїть!"
 tut_12_text_1:0 "Ефіопія здалася! Ви перемогли!\nТепер Ви можете висунути вимоги під час §Yмирної конференції§!. Ми радимо обрати варіант §YЗабрати всі землі§!.\n\nКожна вимога збільшуватиме £world_tension_icon£ §Yсвітове напруження§! на певну величину. Що більша §Yсвітова напруженість§!, то ближчий світ до нової §Yсвітової війни§!.\n\nУ деяких держав певні §Yдипломатичні дії§! будуть заблоковані до досягнення певного рівня світової напруженості. Прочитайте більше в підказці внизу."
 tut_3_text_2:0 "Обравши дивізії, клацніть по кнопці §YНова армія§! в нижній частині екрану. Зробіть те ж саме з дивізіями на півдні, в §YСомаліленді§!."
 tut_8_text_1:0 "Добре! Тепер у Вас є §Yавіакрила§!, призначені до §Yстратегічного регіону§! Східна Африка. Однак, перш ніж вони почнуть щось робити, потрібно дати Вашим авіакрилам §Yзавдання§!, які вони виконуватимуть. Якщо авіакрило не має активного завдання, літаки в його складі будуть простоювати на авіабазі.\n\nЄ кілька різних §Yповітряних завдань§!, і їхня доступність залежить від типу літаків у складі авіакрила. §YАвіакрила підтримки§!, наприклад, можуть виконувати завдання §YПовітряна підтримка§!, що дозволяє літакам брати участь у наземних боях й атакувати Ваших ворогів.\n\nЩоби відправити авіакрило на завдання, клацніть по кнопці з зображенням відповідного завдання у віконці авіації (вгорі зліва)."
 uk_carrier_focus:0 "Акцент на авіаносці"
 uk_protect_suez:0 "Захистити Суец"
 unite_latin_africa:0 "Об'єднати Латинську Африку"
 united_arab_republic_cat:0 "$IRQ_proclaim_united_arab_republic$"
 united_guiana_democratic_ADJ:0 "Гвіанськ"
 united_ma_clique_autonomy_sea_warlord_subject:0 "Сібей сань Ма"
 unity_parade_desc:0 "Воїни-ветерани [From.GetAdjective]их добровольчих формувань здобули багато перемог над ненависним ворогом, і наші спільні жертви є предметом гордості. Ми покажемо подвиги наших військ і продемонструємо нашу невтомну міць! Критики легітимного [From.GetAdjective]ого уряду можуть заперечити, що це марна трата ресурсів, але наші успіхи змусять замовкнути тих, хто сумнівається."
 upgrade_form_department_desc:0 "§LКриптологія — метод створення кодів та шифрів для підтримки секретного зв'язку. Не маючи правильного коду, прочитати зашифроване повідомлення майже неможливо. Однаково важливо як зашифровувати свої повідомлення, так і вміти дешифрувати повідомлення ворогів.§!"
 uruguay_cisplatina_ADJ:0 "Сісплатінськ"
 usa.23.t:0 "Захист США"
 usa.62.desc:0 "Сенатори штату [USA_congress_investment_state.GetName] звернулися до уряду, запропонувавши свою підтримку президенту в обмін на неофіційну гарантію того, що [USA_congress_investment_state.GetName] стане місцем будівництва нового заводу з виробництва боєприпасів для армії. Вони стверджують, що будівництво заводу в цьому штаті створить багато робочих місць і забезпечить армії таку необхідну підтримку в дедалі небезпечнішому світі. Обидва сенатори також згадали про свої чудові робочі відносини з кількома впливовими членами Палати представників."
 usa.64.t:0 "Комітет Сенату розслідує суднобудування в штаті [USA_congress_investment_state.GetName]"
 victor_emmanuel_desc:0 "$vittorio_emanuele_desc$"
 wachtamrhein:0 "Die Wacht am Rhein"
 war_escalation_3_or_more_tt:0 "Ескалація становить щонайменше §Y3§!"
 war_justification.10.t:0 "[ROOT.GetLeader] закликає до інтервенції в державу [From.GetName]"
 war_justification.20.a:0 "Вся держава стоїть за цим важливим рішенням."
 war_justification.218.a:0 "Саме тому нам потрібно бути готовими."
 war_justification.9.t:0 "Дипломатія з [From.GetName] зазнає краху"
 war_on_communism_goal_name:0 "Оголосити війну комунізму"
 war_propaganda_against_warmonger_neighbor_desc:0 "Завтра [From.GetName] може стати нашим ворогом. Потрібно, щоби ТИ захистив свою країну СЬОГОДНІ!"
 war_propaganda_radio_industry_desc:0 "Технології розвинулися настільки, що значна частина нашого населення має доступ до домашнього радіо. Спонсоровані державою ЗМІ є ідеальним інструментом для розпалення воєнних настроїв у серцях наших людей."
 war_support_during_war:0 "Підтримка війни"
 warlord_monarchy_neutrality_party:0 "Guóhuì"
 warlord_support_from_YUN:0 " [YUN.GetNameDefCap]([?YUN.warlord_political_support_value|+0])"
 warsaw_liberated_self_tt:0 "Польща повстала проти країни-окупанта, з якою Ви воюєте"
 weather_rain_light:0 "Дощ"
 wehrmacht_demands:0 "Вимоги Вермахту"
 why_die_for_danzig_tt:0 "Зроблено так, щоби Франція стала фашистською, не влаштовуючи з нею війну"
 wtt_britain.27.b:0 "Це надто неприємно. Ми мусимо відступитися."
 wtt_burma_road.1.a:0 "Це не зробить речі простішими."
 wtt_china_shared.13.desc:0 "[From.GetLeader] розглянув наше прохання про допомогу, і генерал [CHI_USA_General.GetName] отримав наказ якнайшвидше прибути на службу до Китаю.\n\nПередбачається, що він буде не просто радником за лідера [Root.GetLeader], але ще й візьме він командування військами, завдяки чому отримає досвід безпосереднього ведення сучасної війни."
 wtt_germany.12.a:0 "Монархія засяє знову!"
 wtt_germany.15.a:0 "Версальське прокляття нарешті подолано!"
 wtt_germany.24.d:0 "Як офіційними, так і неофіційними каналами німці дали ясно зрозуміти, що [GER.GetGreatRedMenaceEventDesc1]. Вони закликали нас згадати, що ми не самотні перед [GER.GetGreatRedMenaceEventDesc2] і що якщо наші наміри сходяться, то ми мусимо покінчити з російським ведмедем."
 wtt_germany.25.a:0 "Це ми ще подивимось."
 wtt_germany.40.desc:0 "[From.GetNameDefCap] повністю відхиляє наші вимоги щодо повернення Ціндао. Ми не маємо вибору, крім як добиватися його повернення в майбутньому."
 wtt_germany.42.desc:0 "Німецька імперія відхилила нашу пропозицію провести переговори щодо повернення Ціндао. Можливо, німці не так вже й сильно бажають повернути собі свій анклав."
 wtt_germany.53.a:0 "Так, обмежитися малонімецьким шляхом об'єднання Німеччини було б помилкою."
 wtt_germany.63.t:0 "[GER.GetName] проводить реінтеграцію Ельзасу–Лотарингії"
 wtt_germany.67.desc:0 "Держава [From.GetNameDef] відхилила нашу пропозицію вступити у війну і, як і раніше, закриває свої межі для наших військ. Якщо поляки продовжать капризувати, нам доведеться діяти силою."
 wtt_germany.68.a:0 "Чудова ідея! Звичайно, ми погодимося."
 wtt_germany.68.desc:0 "[From.GetAdjective]ий уряд звернувся до нас із пропозицією відновити Австро-Угорську імперію. Оскільки в наших державах ще сильні проімперські настрої, їхні представники стверджують, що таке рішення піде на користь нашим народам."
 wtt_infiltration.6.a:0 "Це великий крок назад для революції."
 wtt_manchukou.11.a:0 "Розбудуймо нашу авіаційну промисловість."
 wtt_news.12.c:0 "І ось ми знову в 1914-му."
 wtt_news.42.t:0 "Суецький канал відновлен"
 wtt_news.43.c:0 "Це значно допоможе нашим зусиллям."
 wtt_news.46.t:0 "[From.GetLeader] проголошує політику Єдиного Китаю"
 wtt_news.67.b:0 "Чи приведе це до тривалого миру в регіоні?"
 wtt_political_warlord_support.10.d:0 "Нас так легко не купиш!"
 wtt_soviet_hold_city_d_fail:0 "Мобілізувавши всі доступні сили, [controller.GetAdjective]і загарбники розтрощили наші оборонні споруди навколо міста [soviet_city.GetName]. [controller.GetAdjective]і загони ввійшли на вулиці. Наші захисники продовжують доблесно боротися, але очікується, що місто впаде з дня на день."
 wtt_soviet_hold_city_t_success:0 "[soviet_city.GetName] тримається"
 wtt_take_national_leadership.2.a:0 "Слава [new_leader.GetLeader]!"
 wtt_warlord.2.desc:0 "[From.GetAdjective]ий уряд прийняв нашу пропозицію. В обмін на їхній захист ми обіцяємо «уважно прислухатися до їхніх порад» щодо того, як нам чинити. До нас прибув представник [From.GetAdjective]ого уряду для координації нашої політики."
 wtt_xian_incident.1.desc:0 "[From.GetLeader] надіслав формальне запрошення лідеру [CHI.GetLeader] з проханням зустрітися в Сіані для обговорення поточної обстановки та майбутніх кроків щодо вирішення конфлікту з комуністами.\n\nУ разі відмови він вважатиме, що [From.GetLeader] образив його особисто, і це, поза сумнівом, врахують інші місцеві правителі."
 wtt_xian_incident.7.e:0 "$PRC_mao_zedong$ and $PRC_zhang_guotao$ both agree that [CHI.GetLeader] cannot be trusted."
 wuw_GER_chinese_diplomacy.6.a:0 "Чудово"
 wuw_GER_diplomacy.103.t:0 "[FROM.GetNameDefCap] відкидає пакт про ненапад"
 wuw_GER_diplomacy.11.desc:0 "[FROM.GetLeader] з [FROM.GetName] у досить чітких словах дали зрозуміти, що вони думають про наші спроби вплинути на їхню внутрішню політику. Нашим дипломатам довелось дещо «пом’якшити» повідомлення перед тим, як представити його [ROOT.GetLeader]."
 wuw_GER_diplomacy.28.a:0 "Дуже прикро"
 wuw_GER_diplomacy.33.a:0 "Яка зухвалість!"
 wuw_GER_diplomacy.40.desc:0 "Попри наш тиск, [FROM.GetAdjective] лідер [FROM.GetLeader] відмовляється задовольнити наші вимоги. Нам не вдасться мирно повернути колонії, які, як ми вважаємо, по праву наші."
 wuw_GER_diplomacy.70.desc:0 "Пропагандисти з [FROM.GetAdjective] держави почали активно впливати на наш народ, закликаючи до союзу з їхньою країною. Це може бути шансом на нового союзника, але очевидно — [FROM.GetLeader] не зупиниться на цьому."
 wuw_GER_diplomacy.72.a_tt:0 "§RЯкщо комуністи виграють громадянську війну, [FROM.GetNameWithFlag] може спробувати підкорити нас!§!"
 wuw_GER_diplomacy.77.b:0 "Абсолютно ні!"
 wuw_GER_diplomacy.81.t:0 "Інтеграція [ROOT.GetNameDef]"
 wuw_GER_diplomacy.84.b:0 "Це вигідно тільки їм."
 wuw_GER_diplomacy.90.a:0 "Це зміцнить наші позиції"
 wuw_GER_german_politics.01.b:0 "Нам потрібен прогресивний соціаліст"
 wuw_GER_legions.4.a:0 "Вони зробили фатальний вибір"
 wuw_GER_legions.4.desc:0 "Нам стало відомо, що [GER.GetAdjective] армія створила автономію Локот у прикордонному регіоні між Брянськом, Курськом і Орлом за участі таких колаборантів, як Костянтин Воскобойник і Броніслав Камінський. Вони взяли на себе керівництво регіоном і боротьбу з партизанами. Ми маємо якомога швидше знищити цю фальшиву державу!"
 wuw_GER_monroe.5.t:0 "Втручання [FROM.GetNameDefCap] у [ROOT.GetAdjective] політику"
 wuw_GER_monroe.6.b_tt:0 "Ми не займатимемо чіткої позиції. §Y[GER.GetNameWithFlag]§! ще може спробувати нас переконати."
 wuw_GER_realpolitik.20.b:0 "Цього разу вони зайшли надто далеко!"
 wuw_GER_realpolitik.24.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 wuw_GER_realpolitik.37.a:0 "Великий день для [ROOT.GetAdjective] нації!"
 wuw_GER_realpolitik.42.a:0 "Час повернути нашу спадщину!"
 wuw_GER_realpolitik.42.b:0 "Нам не потрібна їхня дружба!"
 wuw_GER_realpolitik.45.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із цікавою пропозицією — розділити старі чехословацькі землі між нашими державами. Звучить заманливо, чи не так?"
 wuw_GER_realpolitik.49.b:0 "Нехай спробують узяти нас силою!"
 wuw_GER_realpolitik.57.t:0 "[FROM.GetNameDefCap] інтегрує нашу економіку"
 wuw_GER_realpolitik.61.a:0 "Чудово!"
 wuw_GER_reichskommissariats.16.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію у Великобританії, нам слід визначити не лише її призначення, а й те, хто очолить місцеве населення та забезпечить виконання нашої політики. Чи слід нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще використати місцевого колаборанта?"
 wuw_GER_reichskommissariats.20.t:0 "Керівництво Анд"
 wuw_GER_reichskommissariats.22.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.24.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Аравії, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_reichskommissariats.25.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.27.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.5.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_the_battle_of_britain.01.a:0 "Нехай спробує"
 wuw_GER_weltpolitik.11.desc:0 "Наші губернатори в Конго повідомили, що не приймуть долю, яку ми їм обрали, і стоятимуть за автономію [COG.GetAdjective]. Ми повинні придушити їхній опір, інакше це стане загрозою для нашої нації — особливо якщо [ENG.GetNameDef] і [GER.GetNameDef] вважатимуть це актом спротиву з нашого боку."
 wuw_GER_weltpolitik.13.a:0 "Імперіалізм знову в моді!"
 wuw_GER_weltpolitik.5.b:0 "Ми не можемо з цим погодитись"
 wuw_GER_weltpolitik.7.a:0 "Ми не в силах цьому протистояти..."
 wuw_HUN_a_mobile_army_desc:0 "Оскільки ми не зможемо перевершити світові держави кількістю солдатів, нам слід зробити ставку на технологічну перевагу. Бронетехніка та інші машини, здатні пробивати оборону та оточувати супротивника — це майбутнє війни."
 wuw_HUN_crack_down_on_radicals_desc:0 "В країні є чимало мілітаризованих угруповань і політичних сил, що проти відновлення монархії. Ми маємо обмежити їх вплив та розпустити всі подібні формування."
 wuw_HUN_establishing_a_new_dynasty_desc:0 "Оскільки Габсбургам не дозволяють повернутися на трон, немає чіткого претендента на нашу корону. Один із варіантів — коронувати регента, хоч він і непопулярний, або ж піти на безпечніший шлях і зробити королем його сина, популярного й улюбленого Іштвана Горті."
 wuw_HUN_expand_on_the_weiss_wm_16:0 "Удосконалити Weiss WM-16"
 wuw_HUN_government_of_national_unity_desc:0 "Гьомбьош посилив і озброїв Партію Національної Волі, щоби відібрати регентство у Горті. Але він не зрозумів, що тепер саме вони мають справжню владу, і ніщо не завадить лідерові партії Ференцу Салаші піднятися до влади."
 wuw_HUN_integrate_the_volksbund:0 "Інтегрувати Фольксбунд"
 wuw_HUN_intervene_in_czechoslovakia_desc:0 "Чехословаччина отримала наші землі після Тріанону. Можливо, ми можемо обміняти їх на радянські гарантії у разі німецької агресії."
 wuw_HUN_outlaw_the_party_of_national_will_desc:0 "Націонал-соціалістична Партія національної волі на чолі з Ференцем Салаші є загрозою для нашої влади, особливо через її зв'язки з [GER.GetAdjective] нацистами."
 wuw_HUN_press_maximilians_and_the_iturbides_claims:0 "Висунути претензії Максиміліана та Ітурбіде"
 wuw_HUN_reclaim_the_holy_city_desc:0 "Королівство Єрусалим припинило існування після завоювання мамлюками в 1291 році, але наш імператор досі носить титул Короля Єрусалима завдяки Леопольду I з династії Лотарингенів. Настав час, щоб ми — захисники католицької віри — повернули Єрусалим і зробили те, чого не змогли хрестоносці."
 wuw_HUN_revenge_for_the_brusilov_offensive:0 "Помста за Брусиловський прорив"
 wuw_HUN_strengthen_horthys_reign:0 "Зміцнити владу Горті"
 wuw_HUN_the_march_on_budapest:0 "Марш на Будапешт"
 ww_BEL_event_diplomatic.17.a:0 "Чудова ідея!"
 ww_BEL_event_diplomatic.19.desc:0 "Наші запропоновані зусилля щодо зміцнення нашої позиції та відновлення армії для повернення батьківщини були відхилені [FROM.GetNameDef]. Ми сподівалися, що це стане кроком до майбутнього, але, схоже, ці плани були зруйновані."
 ww_BEL_event_diplomatic.22.t:0 "[FROM.GetNameDefCap] Відмовляє від нашого запрошення до [ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.25.a:0 "Що ж..."
 ww_BEL_event_diplomatic.26.desc:0 "Ми отримали запит від [FROM.GetNameDef]. Як президент [ROOT.GetFactionName], вони дійшли висновку, що більш федералізована Європа покращить оборонні та комерційні зусилля блоку і запросили нас приєднатися до цього процесу."
 ww_BEL_event_spanish_interaction.4.a:0 "Передати наші подяки [FROM.GetAdjective]!"
 ww_BEL_event_war.9.desc:0 "Сьогодні ми отримали французьку делегацію, яка приїхала для переговорів про мирне врегулювання поточного конфлікту після падіння їхньої столиці. Після кількох обговорень вони запропонували передати нам Кале в обмін на негайне припинення вогню. \n\nЗазначимо, що це одноразова пропозиція, і якщо ми відмовимося, вони стануть більш рішучими у своїй обороні і навряд чи знову це запропонують."
 ww_congo.19.b:0 "Ми перемогли!"
 ww_congo.25.t:0 "Альбер де Влішауер їде за кордон, щоб лобіювати підтримку"
 ww_congo.37.b:0 "Ми не маємо вибору, окрім як погодитись."
 ww_congo.42.t:0 "[FROM.GetLeader] передає території баконго"
 ww_congo.45.a:0 "Він той, хто принесе нам велич!"
 ww_congo.49.a:0 "Він буде змушений підійти..."
 ww_congo.51.t:0 "[FROM.GetNameDefCap] погоджується на створення альянсу"
 ww_congo.52.a:0 "Ми їм покажемо"
 ww_congo.62.desc:0 "Бельгійський військовий офіцер Рауль ван Оверстретен, який служив у нашій державі до недавнього часу, після втрати їхньої батьківщини був відкликаний до [BEL.GetName]. Він служив нам добре, і ми сподіваємося, що він допоможе вигнати загарбників."
