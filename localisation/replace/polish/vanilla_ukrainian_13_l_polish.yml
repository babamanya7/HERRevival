 SIA_print_additional_money_tt:0 "Ми надрукуємо ще більше грошей для Японії."
 SIA_release_contigency_funds_tt:0 "Модифікує §Y$idea_SIA_contingency_funds$§! на\n"
 SIA_sell_bangkok_dock_co_desc:0 "Приватний капітал може здійснити те, що державне управління робить занадто повільно. Продавши компанію Bangkok Dock Company у надійні руки, ми можемо залучити інвестиції, стимулювати ефективність і перенаправити державні кошти на більш нагальні військові потреби."
 SIA_ship_torpedo_4:0 "5x 533-мм ТА (пневм.)"
 SIA_silpakorn_university_desc:0 "TODO_CM"
 SIA_singaporean_reinforcements_desc:0 "Боротьба в Малайї та за її межами невіддільна від нашої власної безпеки. Підкріплення, залучені з сил, що збираються навколо Сінгапуру, могли б зміцнити нашу лінію, розширити співпрацю з Союзниками і зв'язати театр воєдино спільною метою."
 SIA_stronger_together:0 "Сильніші разом"
 SIA_the_end_of_gunboat_diplomacy_desc:0 "Більше ніколи іноземні військові кораблі не диктуватимуть умови з гирла Чаопхрая. Сіам повинен мати гармати, доки, міни та берегову оборону, необхідні для того, щоб будь-яка загроза Бангкоку стала актом божевілля."
 SIA_to_forge_a_king:0 "Викувати короля"
 SIA_to_forge_a_king_tt:0 "Майбутній король Ананда Махідол наразі молодий і навчається в [SWI.GetName]. Ми можемо вплинути на його майбутні інтереси та навчання, гарантуючи, що він стане великим королем.\n\nКожного року в день його народження, поки йому не виповниться 15 років, ми зможемо обирати для нього інтерес до вивчення, що дасть різні бонуси, коли він зрештою зійде на престол.\n\nЙого день народження 20 вересня, а його вік — §Y[?var:SIA_anandas_age]§!"
 SIA_to_lay_the_bait_desc:0 "Жовте досьє закликає до економічних реформ, але військові назвуть їх комуністичними. Спершу випустивши підроблений радикальний проект, ми можемо спровокувати їхнє обурення, а потім дискредитувати їх, коли буде випущено справжню, м'якшу версію."
 SIA_use_abandoned_french_tools_desc:0 "Французи залишили частину своїх важких інструментів на наших окупованих територіях. Ми можемо використовувати їх для себе."
 SIA_war_fervor_coup_dummy:0 "Воєнний запал закипає"
 SIC_DEF:0 "Сичуань"
 SIC_autonomy_sea_integrated_warlord_subject:0 "Провінція Сичуань"
 SIC_develop_xikang:0 "Розвивати Сікан"
 SIK_a_new_xinjiang_desc:0 "Тепер, коли нашу промисловість модернізовано, а наших людей навчено читати, наша провінція готова зробити наступний крок на шляху до майбутнього. Тепер ми розпочнемо великий проєкт інтеграції Сіньцзяну та його народу в сучасний світ, готуючись зайняти своє місце на світовій арені!"
 SIK_heavy_fighter_equipment_2_short:0 "PF-77"
 SIK_light_tank_destroyer_equipment_3:0 "PTZ 41"
 SIK_march_into_khotan_tt:0 "З часом прибуде §Yдодаткове постачання§! від §Y[SOV.GetNameDef]§!"
 SIK_nav_bomber_equipment_2:0 "CAMCO N-650"
 SIK_six_great_policies_desc:0 "Шість великих політик — антиімперіалізм, дружба з Радянським Союзом, расова та національна рівність, чистий уряд, а також мир і відбудова, що просуваються через Народну антиімперіалістичну асоціацію, — є фундаментом правління Шен Шицая в кліці Сіньцзян. Завдяки їм ми забезпечимо процвітання провінції та уникнемо повернення до феодального правління."
