 ETH_italian_occupation_category_desc:0 "Хоча ми були змушені піти з нашої батьківщини, війна ще далека від завершення. Ми використаємо всі доступні нам засоби, щоби знову забезпечити свободу для [ETH.GetAdjective]ого народу."
