 raid_type_gun_emplacement_raid_desc:0 "Екіпаж бомбардувальників, оснащених сейсмічною бомбою, намагається знищити позицію для $mega_gun_emplacement_gen$."
 raid_type_pathfinder_raid_desc:0 "Група десантників висаджується в тилу ворога, щоби підготуватися до майбутнього вторгнення, знищуючи важливі мости, влаштовуючи засідки та загалом відволікаючи увагу."
