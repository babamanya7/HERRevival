 CHI_seek_out_western_fascist_cooperation_desc:0 "Через іноземне втручання в минулому ми відстали в технічному розвитку. Як би огидно нам це не було, можливо, було б розумно шукати співпраці із західними країнами, які симпатизують нашій справі, щоб ми могли наздогнати їх, перш ніж ми повернемо ситуацію проти них..."
