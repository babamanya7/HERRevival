 SPA_retake_the_spanish_netherlands_desc:0 "Колись наша імперія простягалася до самих кордонів Німеччини. Немає жодних причин, щоби не зробити це ще раз і дозволити нам помститися за Вісімдесятирічну війну."
 SPA_the_condor_legion_desc:0 "Наші прихильники в державі [GER.GetNameDef] надіслали нам Legion Condor, щоби допомогти нам у нашій боротьбі, але якщо ми хочемо досягти успіху, його доведеться значно розширити. Ми надішлемо дипломатичного представника до держави [GER.GetNameDef], щоби захистити нашу справу та отримати подальшу військову допомогу від нашого імені."
 SPA_the_corpo_truppe_volontarie_desc:0 "Наші прихильники в державі [ITA.GetNameDef] надіслали нам Corpo Truppe Volontarie, щоби допомогти нам у нашій боротьбі, але якщо ми хочемо досягти успіху, його доведеться значно розширити. Ми надішлемо дипломатичного представника до держави [ITA.GetNameDef], щоби захистити нашу справу й отримати подальшу військову допомогу від нашого імені."
