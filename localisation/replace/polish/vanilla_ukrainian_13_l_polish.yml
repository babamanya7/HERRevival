 TUR_invite_bulgaria:0 "Запросити Болгарію"
 TUR_joint_budgets_on_fortifications:0 "Спільний бюджет укріплень"
 TUR_karabuk_iron_steel_factory_modernised_flag:0 "§YКарабюкський металургійний завод§! було модернізовано за допомогою §Yпромисловців§!."
 TUR_kemalism_and_the_modern_movement_desc:0 "Коли Реджеп Пекер повернувся з Італії і розповів, як можна пристосувати фашизм до кемалізму, його звільнили з посади. Фашизм — кредо ХХ століття, і з нашого боку було безглуздо не помічати ідеологію, яка найкраще підходить Туреччині, коли та була так близько — за Адріатикою!"
 TUR_konfederasyon:0 "Konfederasyon"
 TUR_liberalism_decision_desc:0 "В основі наших мрій про майбутнє країни — свобода самим визначати своє життя. Вільна торгівля, вільні вибори, свобода релігії, свобода можливостей — ось чого ми прагнемо."
 TUR_modernize_our_tactics_desc:0 "Багато з наших військовослужбовців — ветерани Війни за незалежність, але вони не розуміють, що будь-яка нова війна буде зовсім не такою, як у 1922 році."
 TUR_officers_of_the_revolution:0 "Офіцери революції"
 TUR_regional_force_of_stability:0 "Джерело стабільності в регіоні"
 TUR_reinstate_the_darulfununu_sahane_desc:0 "Ми визнаємо, що багато наших інститутів та технологій... дещо застаріли. Ми ж тим часом живемо за доби сучасної війни. Добре, що наша промисловість і модернізація нашої країни перебуває на нинішньому рівні — за це слід дякувати наполегливій праці османської бюрократії! Ми створимо в Стамбульському університеті школу, яка заохочуватиме технологічну та наукову співпрацю з націями, подібними до нашої за духом."
 TUR_republican_victory_tt:0 "£faction_tur_kemalist §YНРП§! має бути наділений §Yдемократичним§! мандатом на управління нацією."
 TUR_scrapping_our_debts:0 "Ліквідація наших боргів"
 TUR_secure_the_iraqi_oil_desc:0 "Навіщо довіряти комусь справу, яку робиш найкраще? Не пройде й місяця, як наші чоботи топчуть землю Багдада. Інакше й бути не може."
 TUR_soviets_allow_militarisation_tt:0 "§YТурецькі протоки§! будуть ремілітаризовані, а §Y[TUR.GetNameDef]§! отримає повноваження регулювати прохід кораблів крізь них."
 TUR_sub_ship_engine_1:0 "Дизельний «MAN» 1 100 к. с. н. в."
 TUR_the_constitutional_arrows_category:0 "Закон Nº 3115"
 TUR_the_german_turkish_friendship_treaty_desc:0 "[GER.GetNameDefCap] й [ROOT.GetNameDef] — добрі друзі. Ми не радимося з кожної дрібниці, адже останнім часом наші історичні шляхи надто вже схожі. [ENG.GetAdjective] спроби контролювати нашу зовнішню політику марні: ми доведемо це, уклавши договір про дружбу, який підпишуть [GER.GetLeader] й [ROOT.GetLeader]."
 TUR_the_kirikkale_tank_desc:0 "Чому ми так сильно покладаємось на чужоземних конструкторів бронетехніки? Нам потрібен проєкт власного [ROOT.GetAdjective] танка — «Kırıkkale»!"
