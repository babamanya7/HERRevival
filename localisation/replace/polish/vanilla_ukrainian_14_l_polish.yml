 CZE_cooperation_with_the_ussr_desc:0 "Навіть найпалкіші прихильники [SOV.GetNameDef] серед керівництва партії усвідомлюють недоліки її колективізації після відвідин країни. Навіть у цьому випадку співпраця з ними в колективізації означає, що ми зможемо ретельно проаналізувати, що пішло не так, а що спрацювало, і як це найкраще втілити для [ROOT.GetNameDef]."
 CZE_diversify_refinery_processes:0 "Диверсифікувати процеси нафтопереробки"
 CZE_embezzle_quatermaster_funds:0 "£BoP_left_texticon Розкрадання інтендантських коштів"
 CZE_expand_praga_desc:0 "Компанія «Прага» вже роками є джерелом різноманітних комплектуючих для нашої військової промисловості. Логічно винагородити їх додатковими контрактами, щоб допомогти їм зростати й надалі."
 CZE_favor_czechs_2_desc:0 "Дальші вкладення в промисловість Богемії та Моравії набагато ефективніші, ніж ширший підхід до розвитку."
