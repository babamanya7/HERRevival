 germany.1003.desc:0 "Незважаючи на рішення передати Східну Польщу [SOU.GetNameDef], наші союзники з [From.GetNameDef] вирішили продовжити окупацію Польщі, фактично порушивши пакт Молотова-Ріббентропа!"
 germany.1043.desc_ally:0 "Попри те, що це лежить в інтересах усіх членів альянсу [ROOT.GetFactionName], [FROM.GetAdjective]і дипломати відхилили наші вимоги з передачі Судетської області. Багато тут зробити не вдасться, оскільки ми мусимо поважати автономію наших союзників."
