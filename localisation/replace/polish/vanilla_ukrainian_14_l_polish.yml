 JUNO_brazil_events.14.desc:0 "[FROM.GetAdjective] Президент, [FROM.GetLeader], оголосив, що їхній уряд має намір прагнути більшої співпраці з націями Південної Америки в рамках того, що називають політикою «доброго сусідства». Яку форму матиме ця співпраця, ще належить побачити, але це помітне відхилення від попередніх антагоністичних відносин між іспаномовними та португаломовними націями континенту."
