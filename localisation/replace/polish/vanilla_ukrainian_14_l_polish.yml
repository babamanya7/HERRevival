 ITA_mobilize_the_railway_guns:0 "Мобілізувати залізничні гармати"
 ITA_modern_tank_equipment_1:0 "P45"
 ITA_moschettieri_del_duce_desc_alt:0 "Moschettieri della Republica — це загін елітних стрільців, що склали присягу захищати Республіку від усякої загрози, яка з'явиться ззовні чи зсередини держави. Цих зразкових солдатів можна також використати для ліпшого вишколу наших регулярних військ, що збільшить їхню ефективність у бою."
 ITA_moschettieri_del_duce_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5.0%§!\n$modifier_army_sub_unit_militia_max_org_factor$: §G+5.00%§!\n\n"
 ITA_mussolini_medium_control_range:0 "Консолідована влада дуче"
 ITA_novus_ordo_desc:0 "Доля Італії тісно пов'язана з Лівією, і тому ми мусимо ще більше інтегрувати її в нашу сферу впливу. Цього можна досягти, запропонувавши «особливе громадянство» кожному лівійцю, який готовий воювати за нас, і таким чином забезпечити наш контроль над Середземномор'ям і Північною Африкою."
 ITA_pope_medium_control_range:0 "Консолідований вплив Папи"
 ITA_reinforce_the_gustav_line_desc:0 "Ми мусимо зміцнити наші оборонні лінії, щоби запобігти просуванню будь-яких ворожих частин. Італійська соціалістична республіка не мусить похитнутися!"
 ITA_russian_government_ideology_alt:0 "Боротьба зі сталінізмом"
 ITA_social_stability_desc:0 "Ми залишили позаду жахи громадянської війни, а наше суспільство стало більш справедливим і егалітарним. І хоча нам іще належить пройти довгий шлях до досягнення соціалізму, ми можемо з гордістю сказати, що італійський народ нарешті досягнув соціального миру."
 ITA_solid_progress:0 "Упевнений прогрес"
 ITA_steel_industry_in_terni_desc:0 "Сталеливарні заводи у Терні вже давно становлять основу італійського виробництва сталі. У майбутніх війнах нам доведеться покладатися на них іще більше. Невеликі інвестиції, зроблені зараз, безсумнівно, окупляться в майбутньому."
 ITA_strengthen_ascari_corps_libya_tt:0 "Створити §Y1 піхотну§!, §Y1 кавалерійську дивізію§! та §Y2 дивізії верблюдової кавалерії§!."
 ITA_superaereo:0 "Superaereo"
 ITA_supremacy_in_the_skies:0 "Перевага в небесах"
 ITA_the_fight_against_stalinism:0 "[GetAppropriateRussianGovernmentIdeology]"
 ITA_the_italian_liberation_war:0 "Італійська визвольна війна"
 ITA_the_popular_front_desc:0 "Громадянська війна показала, що комуністи здатні не тільки привести італійський народ до перемоги над фашизмом, а й до соціального та промислового прогресу, так відчайдушно потрібного нашій країні."
 ITA_the_social_republic_prevails_desc:0 "Ми пролили забагато крові в цій жорстокій війні, розпочатій купкою зрадників-маніпуляторів, але настав час покласти їй край. Італійська держава відродиться знову, сильнішою, ніж будь-коли!"
 ITA_vallo_alpino_settentrionale_east_desc:0 "Ми можемо вбезпечити наш північно-східний кордон, побудувавши там низку укріплень."
 ITA_war_with_the_uk_desc:0 "$ITA_anti_uk_war_goals_desc$"
 ITA_yugoslavia_friend:0 "Подружитися з Югославією"
 ITZ_neutrality_ADJ:0 "Іцинськ"
 JAP_VICTORY_POINTS_10110:0 "Кошю"
 JAP_aizawas_trial_over_flag:0 "Суд над Сабуро Айзавою завершився, і стався §YІнцидент 26 лютого§!"
 JAP_an_integrated_union_2_tt:0 "Розблоковує рішення запросити союзників до §Yвсе більш глибокої інтеграції економіки§! з нашою, що дозволить нам згодом §Yспробувати дипломатично підкорити їх§!"
 JAP_anti_militarist_speeches_in_the_diet_desc:0 "Зважаючи на зростання антивійськових настроїв у країні, було б доцільно повернути людей, критично налаштованих до їхнього фанатичного націоналізму, далі вліво, доручивши Ісоо виступати з промовами, що критикують наші традиції, і поширюючи комуністичну пропаганду на вулицях в міру можливостей партії."
 JAP_army_expansion_law:0 "Закон про розширення армії"
 JAP_army_politically_purging_disloyal_young_officers_mission_tt:0 "Трохи більша частина §YІмперської армії§! перейде на бік IJA у випадку §YГромадянської війни§!"
 JAP_assault_tauran_decision:0 "Підготуватися до штурму [MON.GetAdjective]их позицій"
 JAP_border_conflict_time_until_cancelled:0 "Завершити конфлікт"
 JAP_build_up_the_manchurian_army:0 "Вибудувати Маньчжурську армію"
 JAP_coal_liquification_desc:0 "[JAP.GetNameDefCap] гостро потребує нафти. Ми мусимо подвоїти наші зусилля у галузі її синтезування."
 JAP_crackdown_on_foreign_agents:0 "Придушення діяльності іноземних агентів"
 JAP_destroyer_4:0 "Клас «Shimakaze»"
 JAP_destroyer_4_desc:0 "На момент завершення будівництва есмінець класу «Shimakaze» був найшвидшим есмінцем у світі. Це був прототип есмінця для випробування нових високотемпературних турбін високого тиску. Він був надзвичайно швидким і добре озброєним торпедами, але це означало менший радіус дій."
 JAP_develop_the_south_seas_mandate_desc:0 "Японський мандат на управління островами Південних морів, наданий нам Лігою Націй після Великої війни, — це величезна і значною мірою недосліджена територія, дозріла для експлуатації. Якщо ми подбаємо про розвиток цих регіонів і спеціалізуємо їх на забезпеченні наших людей своїми багатствами, Уряд Нанйо, що керує регіоном, можливо, навіть зможе схилити місцевих жителів до належної інтеграції в нашу державу."
 JAP_emperor_hirohito_has_abdicated_flag:0 "§YХірохіто§! зрікся престолу"
 JAP_estabish_a_trongdra_regiment_in_exile:0 "Створити полк Тронгдра у вигнанні"
 JAP_extensive_navy_maneuvers:0 "Розпочати масштабні військово-морські маневри"
 JAP_form_national_cooperatives:0 "Створити національні кооперативи"
 JAP_formalize_the_tonarigumi:0 "Формалізація Тонарігумі"
 JAP_give_it_your_all_for_the_emperor_tt:0 "Відкриває рішення для будівництва §G1§! §Yцивільної фабрики§! у початкових національних регіонах з рівнем §Yінфраструктури§! §Y4§! або вище. \n§RЦе рішення можна прийняти лише один раз для кожного регіону§!"
 JAP_heavy_cruiser_2:0 "Клас «Mogami» (важк.)"
 JAP_heavy_tank_destroyer_equipment_2_short:0 "Ho-Ri"
 JAP_hirohito_has_been_killed_flag:0 "§YХірохіто§! загинув"
 JAP_increase_jotaro_watanabe_security_decision_tt:0 "Охорону Дзьотаро Ватанабе буде посилено, щоб захистити його у разі будь-яких нападів армійських радикалів, але в результаті вони можуть змінити пріоритети у своєму списку цілей і кинути більше сил на усунення когось іншого"
 JAP_infantry_equipment_2:0 "Type 100/40"
 JAP_invite_demo_or_na_asian_nation_to_faction_decison:0 "Запросити §Y[FROM.GetNameDef]§! до нашого альянсу"
 JAP_isolate_oceania_desc:0 "Наше верховне командування визнало недоцільною висадку та окупацію [AST.GetNameDef] і [NZL.GetNameDef] та запропонувало краще вирішення проблеми цих ворожих націй. Ми повинні окупувати менш захищені острови навколо цих держав і відрізати їх від союзників, щоб повільно позбавити їх волі до боротьби з нами."
 JAP_jet_prototypes:0 "Прототипи реактивних літаків"
 JAP_lifetime_employment_desc:0 "Шюшін койо використовується нашими великими компаніями вже деякий час, починаючи з перших економічних успіхів у 1920-х роках. Ми повинні переконатися, що ця визначальна характеристика японської корпоративної культури допоможе нам досягти економічного дива, щоб ми могли одного дня перевершити навіть економіки Заходу."
 JAP_military_power_balance:0 "Interservice Rivalry"
 JAP_mio_trait_special_government_contracts_nissan_trait:0 "$JAP_mio_trait_special_government_contracts_mitsubishi_trait$"
 JAP_nationalize_the_zaibatsus_desc:0 "Найбільші корпорації в нашій країні мають безпрецедентну політичну та економічну силу. З цим треба покінчити: нікому не дозволено стояти на заваді державного контролю."
 JAP_occupy_siam_desc:0 "Сіам, хоча й є нашим потенційним союзником, може стати слабким місцем, яким неодмінно скористаються наші супротивники. Тому ми повинні втрутитися й окупувати його безпосередньо, щоб вони ніколи не мали можливості змовитися з нашими ворогами."
 JAP_okadas_military_purge_speech:0 "Промова Окади про чистку в армії"
 JAP_open_factory_in_state_decision:0 "Відкрити державні фабрики в §Y[FROM.GetName]§!"
 JAP_organize_the_fifth_column_decision:0 "Саботаж у тилу ворога"
 JAP_organize_the_fifth_column_decision_desc:0 "Лояльні партизани, що діють у тилу ворога, можуть бути використані для порушення ворожих комунікацій у [FROM.GetNameDef]. Удари по командних пунктах, перерізання телеграфних проводів або підрив поїздів роблять ворога менш підготовленим до атак наших підрозділів і збільшують шанси на успішне звільнення Японії."
 JAP_people_owned_mines:0 "Народні шахти"
 JAP_publically_distance_from_sov_decision:0 "Публічно дистанціюватися від радянського більшовизму"
 JAP_pursue_international_trade:0 "Розвивати міжнародну торгівлю"
 JAP_raise_ashigaru_tt:0 "Розгорнути всі дивізії ополчення до нашої поточної межі."
 JAP_reinforce_the_beijing_garrison:0 "Посилити гарнізони у Східному Хебеї"
 JAP_reinforce_the_beijing_garrison_tt:0 "§RМоже призвести до війни з [CHI.GetNameDef]§!"
 JAP_sea_unify_the_air_forces:0 "Об'єднати військово-повітряні сили"
 JAP_ship_management_committee_desc:0 "З недавньою ратифікацією Наказу про контроль судноплавства у воєнний час ми можемо санкціонувати створення спеціальної корпорації, відповідальної за управління судноплавною галуззю, щоб контролювати її та співпрацювати в реалізації національної політики щодо судноплавства з метою максимізації повного потенціалу цієї галузі у воєнний час."
 JAP_sonnou_joui_desc:0 "Ми знову втілили в життя ідеали періоду Бакумацу про можутьного Імператора і готові протистояти іноземному імперіалізму. Подібно до того, як сьогунат Токугава був колись вигнаний, ми виженемо всіх, хто виступає проти правління великого Імператора. Шануй Імператора, виганяй варварів! Настав час повернути нашу небесну долю."
 JAP_soviet_japanese_neutrality_pact:0 "Радянсько-японський пакт про нейтралітет"
 JAP_spread_revolutionary_flames_to_west_asia:0 "Поширити полум'я революції на Західну Азію"
 JAP_state_shintoism_decisions_desc:0 "Шінтоїзм був релігією японців принаймні з періоду Яйой, з часом синкретизувавшись із дзен-буддизмом. В епоху Мейджі святилища потрапили під зростаючий вплив уряду, і громадян заохочували поклонятися імператору як камі. Завдяки цьому ми тепер можемо посилити державний контроль над віросповіданням і схилити бажання людей на свою користь."
 JAP_strenghten_manchukuo_imperial_airforce_desc:0 "Імперські військово-повітряні сили Маньчжоу-го були створені лише нещодавно, і їхнім офіцерам ще багато чому треба навчитися. Ми повинні відправити офіцерів для їх навчання, а також поставити їм армійські винищувачі Накаджіма Тип 91 та легкі бомбардувальники Кавасакі Тип 88 для посилення їхніх сил."
 JAP_subdue_the_kwantung_army:0 "Підкорення Квантунської армії"
 JAP_the_five_great_cities:0 "П'ять великих міст"
 JAP_the_harakiri_debate:0 "Дебати про харакірі"
 JAP_the_imperial_colors_desc:0 "На честь наших співвітчизників, які намагалися і не змогли здійснити державний переворот у 1931 році, так само як ми зараз, ми повинні перетворити 21 жовтня на національне свято, під час якого ми підіймаємо імператорський прапор і згадуємо жертви, принесені ними в ім'я нашого Імператора."
 JAP_the_zero:0 "«Zero»"
 JAP_tokugawa_iesato_focus_desc:0 "Надзвичайно популярний Токугава Ієсато, голова Палати перів і спадкоємець сьогунату Токугава, має сформувати новий кабінет, який наполягатиме на прийнятті нашої нової конституції. Завдяки цьому ми більше не матимемо тимчасового прем'єр-міністра, і порядок, що існував до початку міжусобиць, буде нарешті відновлено."
 JOR_neutrality_DEF:0 "Гашімітське королівство Йорданія"
