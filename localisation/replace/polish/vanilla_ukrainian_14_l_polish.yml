 INDUSTRIAL_ORG_EQUIPMENT_light_tank_amphibious_chassis:0 "$light_tank_amphibious_chassis$"
 INDUSTRIAL_ORG_POLICY_DESCRIPTION_TT:0 "Політика допомагає §Yвійськово-промисловій організації§! в спеціалізації в певних галузях досліджень або виробництва."
 INDUSTRIAL_ORG_POLITICAL_SCREEN_OPEN_ROSTER_WITH_FILTER:0 "§GКлацніть, щоби показати військово-промислові організації за категорією §Y$CATEGORY$§!.§!"
 INFLUENCE_TOP_THREE:0 "§Y3 члени альянсу§! з найбільшим впливом:"
 INSHOL_bandung_aircraft_facility_desc:0 "Хоча креслення та секрети виробництва корисні, вони нічого не варті, поки ми не побудуємо за ними літаки. Ми відкриємо нові авіаційні заводи в Бандунзі, щоб задовольнити поточні потреби ML-KNIL."
 INSHOL_borneo_and_the_grote_oost_desc:0 "$HOL_borneo_and_the_grote_oost_desc$"
 INSHOL_eastern_conscription_desc:0 "На Яві та Мадурі є кілька туземних допоміжних корпусів, які контролюються місцевими правителями-князями. У ці важкі часи ми могли б укласти угоду з місцевими правителями, згідно з якою ці дивізії перебуватимуть під нашим командуванням."
 INSHOL_investments_in_civ_railways_desc:0 "Завоювання підтримки населення Ост-Індії вимагає інвестицій у цивільну інфраструктуру. Наразі наші залізниці використовуються переважно для вантажних перевезень. Ми повинні закупити пасажирські потяги для курсування нашими існуючими залізницями на Яві та Суматрі."
 INSHOL_netherlands_indies_air_doctrine_desc:0 "Ми вивчимо військово-повітряні сили країн, які стикаються з викликами, подібними до наших, спираючись на їхній важко здобутий досвід, щоб сформувати доктрину, що відповідає реаліям Ост-Індії, не повторюючи цих історичних помилок."
 INSHOL_request_naval_control_desc:0 "[HOL.GetNameDefCap] пала і не в змозі керувати цілим флотом. Ми повинні взяти його під свій контроль до кінця війни."
