 SWE_attack_Landsorganisationen_desc:0 "Соціал-демократи є головною перешкодою, яку потрібно подолати, якщо ми хочемо врятувати націю від більшовизму. Замість того, щоб боротися з ними безпосередньо на дрібних виборах, ми використаємо наші ресурси, щоб налаштувати громадськість проти профспілок, які фінансують партію."
