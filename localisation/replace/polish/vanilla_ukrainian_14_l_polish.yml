 bftb_bulgaria_equipment_purchases.1.a_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_artillery]§! од. §Yбуксованої артилерії§!"
 bftb_bulgaria_equipment_purchases.1.t:0 "Закупити [FROM.FROM.GetAdjective]у артилерію"
 bftb_bulgaria_equipment_purchases.3.a:0 "Закупити легку бронетехніку"
 bftb_bulgaria_factions.12.a:0 "Зітремо їх на порох!"
 bftb_bulgaria_factions.29.desc:0 "В останні кілька тижнів поліція відловлювала залишки широких соціалістів, які, втративши керівництво після недавньої черги арештів, помітно ослабли і розгубилися. і від цього наша країна та уряд тільки виграють."
 bftb_bulgaria_factions.30.desc:0 "Землеробський національний союз веде незаконну пропаганду в сільських районах країни. Вони переконують тисячі фермерів, що тільки в їхніх лавах вони досягнуть успіху, а уряду вірити не можна. їх словами, призвела Болгарію до розрухи та принижень, при цьому вони шукають будь-яку дрібницю, яка дозволить пов'язати дії нинішнього уряду із чудовиськами з минулого та посіяти в народі невдоволення та невпевненість."
 bftb_bulgaria_factions.80.t:0 "Націонал-соціалістичний рух репресований"
 bftb_bulgaria_fate_of_the_balkans.6.desc:0 "Після тривалої дискусії з [BUL.GetAdjective]ою дипломатичною місією, що прибула в [BUL.GetAdjective]у столицю, [FROM.GetLeader] упирається і заявляє, що [FROM.FROM.FROM.GetName] державі [BUL.GetNameDef]."
 bftb_bulgaria_german_influence.4.desc_no_tsar:0 "[BUL.GetLeader]"
 bftb_bulgaria_greek_influence.1.a:0 "Відтепер [GRE.GetNameDefCap] та [BUL.GetNameDef] співпрацюватимуть!"
 bftb_bulgaria_greek_influence.2.desc:0 "[FROM.GetAdjectiveCap]ий лідер [FROM.GetLeader] приймає нашу пропозицію і хоче закріпити нашу дружбу юридично. [BUL.GetNameDef] і [FROM.GetNameDef] укладуть мирний договір."
 bftb_bulgaria_nationalization.3.desc_no_allies:0 ""
 bftb_bulgarian_claims.9.a:0 "Ну, може, пізніше..."
 bftb_greece.10.desc:0 "Запрошення на Іракліонську конвенцію щодо зміни меж держави [TUR.GetNameDef] були надіслані всім цікавим нам державам. Ми очікували, що на нашу зустріч з'являться всі запрошені, але схоже, що там буде лише держава [FRA.GetNameDef]. Реакцію [ROOT.GetAdjective]их представників на такі звістки найкраще описує слово «журбота» Ні наша політична еліта, ні наші військові фахівці не впевнені, що Іракліонська конвенція дасть бажані результати, якщо з нами буде тільки держава [FRA.GetAdjective], але все ж таки ми продовжимо діяти за планом."
 bftb_greece.14.t:0 "На нашу конвенцію не приходить ніхто!"
 bftb_greece.167.desc:0 "[FROM.GetAdjectiveCap]і організатори  влаштували нам славне уявлення! Вони, без сумніву, дуже намагаються залучити наші інвестиції, але у нас є свої пріоритети. Нам вирішувати, чи інвестуємо ми в [FROM.GetAdjective]у націю."
 bftb_greece.169.b:0 "Натхненний успіх!"
 bftb_greece.191.t:0 "[ROOT.GetAdjectiveCap]і бюрократи повертаються після візиту до держави [FROM.GetNameDef]"
 bftb_greece.195.desc:0 "Можливо, ми надто напирали з питаннями про інвестиції: [FROM.GetAdjective]і інвестори вирішили, що їм нецікаво вкладати кошти в зростаючу промислову базу нашої країни. Якщо вони не бажають допомогти нам створити власне майбутнє, нам доведеться зробити це без них."
 bftb_greece.2.a:0 "Нарешті ми повернулися!"
 bftb_greece.20.t:0 "Іракліонська конвенція — [ENG.GetAdjective]а держава не отримує маріонетку!"
 bftb_greece.201.a:0 "Ура!"
 bftb_greece.203.desc:0 "Іракліонська конвенція офіційно завершилася та пройшла з великим успіхом! Всі учасники, крім держави [ITA.GetNameDef], залишили її, заручившись правами на територіальні претензії, а держава [GRE.GetNameDef], зважаючи на все, згодом значно розширити свої кордони. Разом усі, хто підписався, помстяться за Севрський мирний договір негідній державі [TUR.GetName]."
 bftb_greece.224.a:0 "Перемогли голоси проти!"
 bftb_greece.228.desc:0 "До нашої столиці дійшли неймовірні новини: непереможні війська [SOV.GetNameDef] не змогли пробити [TUR.GetAdjective]у оборону. Вони не будуть допомагати нам у вторгненні, скасували свої плани та наступи і дали [TUR.GetAdjective]им військам можливість робити з нами все, що завгодно."
 bftb_greece.234.a:0 "Нехай турки виживають як хочуть."
 bftb_greece.26.a:0 "Просто марнування часу..."
 bftb_greece.34.desc:0 "Будь проклята наша наївність! Держава [SOV.GetNameDef] скористалася свободою пересування крізь наші кордони, щоб установити ворожий комуністичний уряд неподалік своєї території, і явно має намір захопити від його імені всю нашу країну! передбачити це з самого початку.. Дійшло до того, що деякі члени нашого уряду перейшли до ворожого уряду на півночі, заявивши, що ситуація безнадійна. Можливо, проста капітуляція врятує нашу націю від марних жертв..."
 bftb_greece.61.desc:0 "Схоже, ми даремно довіряли такому союзнику, який ми обожнюємо: [FROM.GetNameDef] відмовляється навіть розглянути саму ідею передачі [ROOT.GetAdjective]ого острова Кіпр під наш контроль. Вони посилаються на стратегічне значення острова та [ROOT.GetAdjective]ий реваншизм — через це, на їхню думку, ми не заслуговуємо на острови.\n\nНе можна сказати, що ми зовсім не очікували такого повороту подій, але наше загальне розчарування від цього не стало менше. Скільки років ми чекали, коли Кіпр повернеться на батьківщину? Скільки ще років нам доведеться чекати через таку затримку? Не варто й казати, що наш інтерес у відносинах з державою [FROM.GetNameDef] тепер значно вщух."
 bftb_greece.7.a:0 "Ми запросимо [FRA.GetAdjective]их і [ENG.GetAdjective]их делегатів."
 bftb_greece.91.t:0 "НСГ відкриває центр допомоги для біженців з Анатолії"
 bftb_greece.95.t:0 "НСГ присвячує себе нашій боротьбі!"
 bftb_news.10.desc:0 "Колишній уряд держави [BUL.GetOldNameDef] оголосив те, що відтепер їх країна називається [BUL.GetNameDef]. Так вони мають намір зробити наступний крок після створення альянсу [BUL.GetFactionName] і запропонувати своїм союзникам об'єднатися владою одного централізованого уряду.\nЯк заявляє [BUL.GetLeader], [BUL.GetNameDef] прагне досягти повної співпраці між балканськими країнами, забути про конфлікти минулого та зміцнити єдність балканських народів."
 bftb_news.2.a:0 "Болгари грають з вогнем!"
 bftb_news.208.b:0 "Ембарго здається адекватним рішенням."
 bftb_news.301.desc:0 "У державі [GRE.GetNameDef] вибухнула громадянська війна між прокоролівськими силами, що розпустили еллінський парламент, і республіканцями з комуністами, що відстоюють принципи демократії в державі [GRE.GetNameDef]. Незважаючи на колишні протиріччя останні об'єдналися заради спільної мети — повалення ненависного короля-чужоземця, тирана та деспота всього народу.\n\n[GRE.GetLeader] обіцяє, що ні він сам, ні вірні йому монархісти не заспокояться, поки не знищать усіх антимонархістів до єдиного."
 bftb_news.7.b:0 "Схоже, [BUL.GetLeader] перебуває у полоні ілюзій про власну велич..."
 bftb_turkey.117.a:0 "Зупиніть їх будь-якою ціною."
 bftb_turkey.137.b:0 "Вони зрадили справу Революції!"
 bftb_turkey.141.t:0 "[FROM.GetNameDefCap] виганяє нас із альянсу [FROM.GetFactionName]!"
 bftb_turkey.34.a:0 "Велика перемога!"
 bftb_turkey.6.t:0 "[SOV.GetName] погоджується на ремілітаризацію проток!"
 bftb_turkey.63.desc:0 "[FROM.GetLeader] і [ROOT.GetLeader] провели зустріч, щоб обговорити всеосяжний середземноморський союз, учасники якого поділяють позицію щодо криз із військовим вторгненням. Є думка, що якщо [FROM.GetNameDef] добровільно себе з нами союзом, це додасть більше легітимності нашим регіональним цілям, навіть якщо доведеться відмовитися від підтримки більших держав. Вони зможуть конвертувати репутацію в дипломатичну перемогу, заручившись підтримкою країн, які в іншому випадку не стали б мати з нами справи. Вони спрямовують свій меч для боротьби з іншими великими державами, чи то зв'язатися з огидними тевтонами і скосити під корінь, немов бур'яни в саду, всі слабкі держави, що волають до нам? Ми і тільки ми можемо вирішити долі балканських націй — ми або врятуємо їх від [GER.GetAdjective] і [SOV.GetAdjective] гегемонії, або допоможемо загарбникам і прискоримо падіння наших сусідів. Вибір за нами."
 bftb_turkey.66.desc:0 "[FROM.GetNameDefCap] пропонує, визнаючи всю прикрість такого стану справ, знищити регіони держави [GRE.GetNameDef] заради національної безпеки. Наші представники щиро і цілком згодні з думкою наших [FROM.GetAdjective] союзників та нагадують їм, що саме такою і була наша офіційна позиція з самого початку. і [182.GetName], що закріпить наше домінування над Східним Середземномор'ям та Іонічним морем. Із цими землями межують багато територій держави.\n\nУгода складена здебільшого справедливо — справедливіше, ніж у принципі можна очікувати для такої ситуації. І все ж таки ми давно мріяли зробити місто [47.Capital.GetName] перлиною нашою імперії, а такий план безумовно змусить нас відмовитися від цієї мрії на найближче майбутнє. Чи готові ми розлучитися з планами на місто [47.Capital.GetName] заради миру в Середземномор'ї?"
 bftb_turkey.71.desc:0 "[IRQ.GetAdjective] фашисти успішно вигнали колишній уряд і захопили контроль над усією країною. [IRQ.GetAdjective] фашисти ясно дали зрозуміти, що одна з головних цілей — за будь-яку ціну позбавити Аравію від [ENG.GetAdjective] впливу. Вони вважають, що найкраще цього можна домогтися [ROOT.GetAdjective] втручанням."
 britain.17.t:0 "Король Едуард зрікається престолу"
 britain.7.b:0 "Ми будемо торгувати з ким захочемо!"
 broad_naval_support_escorts_in_battle:0 "Самодостатність ескортних авіаносців"
 bruneval_exfiltration:0 "Евакуація на десантному кораблі"
 bruneval_raid_outcome_tt:0 "Ми спробуємо захопити елементи ворожої РЛС, щоби поліпшити власні розробки у цій галузі."
 bunker_plural:0 "Наземні укріплення"
 canal_kiel:0 "Шлюзи Кільського каналу"
 capital_ship_raiders_desc:0 "Тепер, коли полюванням на ворожі конвої займаються наші найпотужніші кораблі, ворога не врятує навіть чисельну перевагу. Йому залишиться лише молитися, щоби ми його не знайшли."
 capture_tito:0 "Операція «Хід конем»"
 cat_superior_firepower_research:0 "Доктрина переважаючого вогню"
 category_army:0 "Армія"
 change_leader_rules_applicability:0 "§gКоли активно, тільки країни, які виконують ці умови, будуть припустимі на лідерство в альянсі:§!"
 china.111.d:0 "Альянс [Root.GetFactionName] відбув своє. Більше немає ворога, проти якого треба об'єднатися. Ми мудро використали час для розширення нашої підтримки в Північному Китаї та Маньчжурія, і тепер час формалізувати наш контроль над цим регіоном."
 china.7.a:0 "Чинити опір наступу всім, чим зможемо!"
 china_territorial_integrity_goal_desc:0 "Китай має бути визволений та об'єднаний під однією керівною партією. Лише відновивши контроль над нашими територіями від зовнішніх та внутрішніх ворогів, ми зможемо повернути Китаю його славу."
 chinese_war_focus_desc:0 "Інцидент на мості Марко Поло показав, що китайці не зацікавлені у співпраці. Угода про припинення вогню може бути порушена будь-якої миті. Можливо, війна — це єдиний засіб навести в Китаї порядок."
 cittadina_irresistibile:0 "Cittadina Irresistibile"
 claim_outer_manchuria_tt:0 "Розблоковує рішення для інтеграції претензій у §YЗовнішній Маньчжурії§!"
 clearing_kurdish_resistance_flag:0 "Придушення курдського опору"
 coastal_bunker_pl_gen:0 "прибережних укріплень"
 coastal_defence_fleet_aging_navy:0 "Курс на модернізацію"
 codebreaking_bonus:0 "Бонус до зламу шифрів"
 communist_infiltration_in_hulunbuir:0 "Комуністичне проникнення в Хулун-Буїрі"
 concentrated_industry_desc:0 "Розмістивши наше виробництво в кількох ключових центрах, ми різко збільшимо його ефективність.\n\n"
 congo_independence_struggle.10.b:0 "Ні, ми можемо штовхати їх до подальшої інтеграції"
 congo_independence_struggle.15.a:0 "Ми переможемо!"
 congo_independence_struggle.16.a:0 "Сьогодні день святкування!"
 congo_independence_struggle.2.b:0 "Добре, але тільки якщо вони заплатять нам велику компенсацію"
 congo_independence_struggle.20.a:0 "До зброї, брати!"
 congo_independence_struggle.21.d:0 "Наша швидка реакція на поточну ситуацію в Конго, здається, вгамувала напруження там. [BEL.GetAdjective] офіцери швидко взяли під контроль відомі заколотні елементи Сили Публіки. Завдяки забезпеченню їх лояльності, полум’я повстання швидко згасло, а найбільш гучні голоси були вгамовані — в більшості випадків товстими стінами в'язниць. \n\nКолоніальна адміністрація використала надану їй можливість і взяла під контроль всі рівні уряду, завдяки чому ми маємо значно більше контролю над колонією, ніж раніше."
 congo_independence_struggle.23.d:0 "Наша зустріч з дипломатами [BEL.GetName] принесла плоди, і здається, вони все ж хочуть йти дипломатичним шляхом. Вони запропонували нам збільшену автономію як домініону, подібно до британської моделі. Ми все ще повинні будемо слідувати дипломатії [BEL.GetAdjective], однак ми отримаємо значно більше прав на самоврядування, перебуваючи під їхньою охороною."
 congo_independence_struggle.23.t:0 "[FROM.GetNameDefCap] хоче, щоб ми стали домініоном"
 continuous_boost_freedom_desc:0 "Перетворюючи колоніальні органи влади та наймаючи місцевих управлінців, ми згодом зможемо самостійно вирішувати наші проблеми."
 control_cyprus_goal_desc:0 "Контроль над Кіпром дозволить підтримувати операції у східному Середземномор'ї та забезпечувати життєво важливі повітряні маршрути до та з Близького Сходу."
 convoy_sufficiency_goal_name:0 "Достаток конвоїв"
 cost_reduced_last_stand_2:0 "Дозволяє використовувати здатність командування §YОстанній бій§! зі значно меншими витратами, одночасно продовжуючи її тривалість на §G3§! дні\n"
 country:0 "Держава"
 country_capitulated.0.d_negative_collab_diff_ideology:0 "\n[Root.GetNameDef] оголосив про свою повну капітуляцію перед [From.From.GetNameDef]. Очевидно, що поблажливість [Root.GetAdjective]ого уряду до внутрішніх симпатиків ідеології [From.From.GetRulingIdeology] сприяла падінню [Root.GetName], оскільки [Root.GetFascistLeader] прийшов до влади, щоб керувати країною від імені режиму [From.From.GetLeader].\n[Root.GetLeader] стверджує, що це не кінець суверенітету [Root.GetAdjective], і що уряд буде підтримувати всі зусилля опору навіть у вигнанні з батьківщини."
 create_one_units_tt:0 "Створити §Y1§! підрозділ §Yополчення§!."
 cv_CAS_equipment_1:0 "Палубний штурмовик I"
 czech.24.a:0 "Почекаємо і побачимо."
 d_add_fake_armies_DESC:0 "Створює війська в підробних розвідданих для гравця"
 dalmatia_neutrality:0 "Королівство Далмація"
 damage_control_1_desc:0 "Кожен член екіпажу судна, від капітана до рядового матроса, мусить могти долучитися до стримання та гасіння пожеж на борту судна."
 decision_cost_20_convoy_10_NavXP:0 "£GFX_topbar_convoys §Y20§! £navy_experience §Y10§!"
 decision_cost_25_convoy_20_pp_blocked:0 "£GFX_topbar_convoys §R25§! £pol_power §R20§!"
 decision_cost_CP_25_army_exp_35:0 "£command_power §Y25§! £army_experience §Y35§!"
 decision_cost_CP_50_pp_50_ArmXP_50:0 "£command_power£ §Y50§! £pol_power£ §Y50§! £army_experience£ §Y50§!"
 decision_cost_ie_500:0 "£infantry_equipment_text_icon£ §Y500§!"
 decision_cost_ie_500_MP_500_CP_25_tooltip:0 "Прийняття цього рішення коштує £infantry_equipment_text_icon£ §Y500§! £manpower_texticon£ §Y500§! £command_power£ §Y25§!"
 denmark_events.300.desc:0 "По крихтах ми змогли відновити нашу економіку: щодня з'являються нові компанії, і країна процвітає. Також спостерігається технологічний прогрес: деякі компанії почали експериментувати з пластмасами."
 denmark_expansion_event.14.a:0 "[SWE.GetAdjective]ий метал для [DEN.GetAdjective]их печей."
 denmark_expansion_event.15.a:0 "Значить, війна."
 denmark_expansion_event.15.t:0 "[FROM.GetNameDefCap] відмовляється передавати [SWE.GetAdjective]і землі"
 denmark_expansion_event.2.desc:0 "Цього ранку ми отримали новини: [ICE.GetAdjective]ий уряд люб'язно прийняв нашу пропозицію реінтегрувати їхню територію до складу держави [DEN.GetNameDef]. Такий захід допоможе обом нашим державам боротися з ворогом."
 denmark_expansion_event.210.desc:0 "Здається, [DEN.GetNameDefCap] вважає, нібито в них є історичні права на нашу [SWE.GetAdjective]у територію. Якщо піти в них на поводу, ми ризикуємо втратити свої землі через [DEN.GetAdjective]ий експансіонізм. Якщо ж відмовитися, не минути великої війни."
 denmark_expansion_event.221.desc:0 "[FROM.GetNameDefCap] завбачливо погоджується з нашими справедливими претензіями на їхню територію. Це дуже далекоглядно з боку уряду."
 denmark_expansion_event.300.b:0 "Нам це не потрібно."
 denmark_occupation_event.1.desc:0 "Хоч ми недвозначно оголошували про свій нейтралітет, війна прийшла і в державу [DEN.GetNameDef]. Здавшись одразу, ми, можливо, захистимо народ від її жахів. У такому разі наша країна могла б розраховувати на поблажки і діяти відносно незалежно."
 denmark_occupation_event.3.desc:0 "Уклавши з державою [FROM.GetNameDef] сприятливу для нас мирну угоду на ранніх етапах війни, ми змогли частково втримати незалежність і зберегти свою форму правління. Щоб і надалі користуватися відносною свободою в ролі фактичного [FROM.GetAdjective]ого протекторату, ми змушені співпрацювати з ними та будувати на цьому свою політику — принаймні, поки що."
