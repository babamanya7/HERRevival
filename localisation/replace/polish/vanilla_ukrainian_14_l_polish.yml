 MEX_focus_andean_offensive_desc:0 "Тепер, коли ми закріпилися на північ від Андських гір, наша доля — продовжити наступ через складний рельєф тропічної зони та завершити об'єднання Латинської Америки."
 MEX_focus_communist_revolution_desc:0 "Революція проти Діаса перетворилася на справжню соціальну революцію, яка розв'яже протиріччя капіталізму, скасувавши виробництво для обміну та започаткувавши новий спосіб життя."
