 GOE_RAJ_navy.4.desc:0 "Чиновники з [RAJ.GetNameDefCap] попросили нас перевести одного з наших військово-морських командирів для служби в Королівському індійському флоті, щоб допомогти їм у їхніх зусиллях з розширення та навчання нових морських піхотинців. Це дорога справа, але вони пропонують велику оплату."
