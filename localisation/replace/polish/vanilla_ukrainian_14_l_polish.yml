 SWI_declare_the_alpine_union:0 "Проголосити Альпійський союз"
 SWI_democratic_subject:0 "$OVERLORDADJ$а Гельвеція"
 SWI_diplomatic_mission_desc:0 "Ми можемо вирушати в дипломатичні поїздки до інших країн, щоб налагодити з ними більш тісні відносини і розвіяти будь-які сумніви, які вони можуть мати щодо нашого нейтралітету, уникнувши всякого можливого вторгнення з їхнього боку."
 SWI_frontier_defense_plan:0 "План оборони кордону"
 SWI_infantry_equipment_2:0 "Hispano-Suiza MP43/44"
 SWI_integrate_refugees_into_the_army_desc:0 "Як оазис миру та демократії серед океану фашизму та війни, багато хто збирається в [ROOT.GetName] у пошуках безпечного притулку. Деякі з них сподіваються приєднатися до зусиль, щоб перемогти тих, хто змусив їх покинути батьківщину, а багато навіть є професійними військовими. ми можемо дозволити їм приєднатися до боротьби за Швайцарію та краще майбутнє."
 SWI_license_axis_plane_designs_desc:0 "Найшвидший спосіб піднятися в небо — це придбати проєкти літаків у фашистських країн. Тільки вони мають недавній бойовий досвід, необхідний, щоб визначити пріоритети того, що справді виграє битву, і це зробить нас ближчими до них, можливо, стримає їх від вторгнення."
 SWI_limited_censorship_of_the_press_desc:0 "Сили, які хочуть побачити [ROOT.GetName], використовуватимуть будь-що, щоб виправдати вторгнення до нас. Свобода преси, незважаючи на те, що вона життєво важлива для здорової демократії, поки що має відійти на другий план, тож ми можемо переконатися, що не даємо патронів амбіціям наших сусідів."
