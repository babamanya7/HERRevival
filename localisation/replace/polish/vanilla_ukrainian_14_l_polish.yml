 GUAY_enact_martial_law_desc:0 "Невдоволення зростає. Нам потрібно контролювати ситуацію та тримати людей під контролем, щоб уникнути непотрібного кровопролиття, яке може зірвати ситуацію."
 GUAY_laissez_faire_desc:0 "Уряд не має підстав втручатися в економіку, окрім виняткових обставин. Вільний ринок переможе!"
 GUAY_mythologize_the_father_of_the_nation_par:0 "Франсіско Лопес очолив країну проти Потрійного Альянсу, відмовившись здатися, незважаючи на наступ трьох націй. Така рішучість і воля будуть закріплені в кожному солдаті."
 GUAY_penal_battalions_desc:0 "Наша армія знаходиться у жахливому стані, і лише небагато людей записуються. Дозвіл набирати із в'язниць може бути саме тим рішенням."
