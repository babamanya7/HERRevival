 SWE_integrate_fin:0 "Інтегрувати державу [FIN.GetName]"
 SWE_merge_army_complexes:0 "Об'єднати армійські комплекси"
 SWE_military_integration_desc:0 "Шведи забули, як вести війну, але ми маємо можливість відновити ці знання, спираючись на наші зв'язки з [GER.GetNameDef]. Інтегруючи наші війська з їхніми, ми можемо зробити свій внесок у звільнення Європи від більшовизму та посилимо [SWE.GetAdjective]их людей у процесі."
 SWE_modern_tank_artillery_equipment_1_short:0 "Ikv m/53"
 SWE_nordljus_desc:0 "Наш флот не може конкурувати з іншими державами Балтії, і існує потреба в новому флагмані, щоб протистояти найсильнішим супротивникам. Такий великий проєкт негативно вплине на економіку скандинавських країн, але іноді це так просто:\n\nСилу треба зустрічати силою"
 SWE_preemptive_strike_desc:0 "Хоча багато хто хоче залишити конфлікт позаду, ми не можемо дозволити собі повторювати ті самі помилки. Нам потрібно вдарити по наших супротивниках, перш ніж вони стануть надто могутніми або ще гірше, розробити власну атомну зброю. Якщо ми будемо вдаряти швидко і важко, ми можемо застати їх зненацька."
 SWE_refuge_from_war_tt:0 "Збільшує робочу силу для кожної країни, яка зараз не є комуністичною, пропорційно до комуністичної підтримки цієї країни. §YNordics§! і §Ymajors§! забезпечують більшу можливу частку робочої сили, а §Yminors§! забезпечують меншу можливу частку частка, для загального можливого приросту робочої сили: §G+80000§!\nЗагальна кількість набраних робочої сили на основі поточної світової ситуації: §G+[?SWE_refugee_from_war_total_manpower_gained]§!\nКраїна, що забезпечує найменшу кількість робочої сили: §Y[?SWE_refugee_min_manpower_country.GetName]§!: §G+[?SWE_refugee_min_manpower_gained]§!\nКраїна, що надає найбільшу кількість робочої сили: §Y[?SWE_refugee_max_manpower_country.GetName]§!: §G+[?SWE_refugee_max_manpower_gained]§!\nСередня кількість робочої сили, набрана країною: §G+[?SWE_refugee_from_war_average_manpower_per_country]§!"
 SWE_reject_saltsjobaden:0 "Відхилити Сальтшьобаденську угоду"
 SWE_revoke_food_trade:0 "Видалити торгівлю кульковими вальницями з державою [SWE.GetNameDefCap]"
