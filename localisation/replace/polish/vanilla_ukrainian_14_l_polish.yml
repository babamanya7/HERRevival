 INS_communist_events.4.t:0 "Громадянська війна спалахує в [FROM.GetName]"
 INS_indonesian_naval_doctrine:0 "Індонезійська військово-морська доктрина"
 INS_integrate_subject:0 "Інтегрувати [FROM.GetName]"
 INS_invite_foreign_companies_desc:0 "З 1930 року Standard Oil California працює в нашій країні через свою голландську дочірню компанію Nederlandsche Pacific Petroleum Maatschappij. Їхні дослідження в Ріуві є багатообіцяючими, ми повинні підтримати їхні видобувні операції будь-яким можливим способом — велике відкриття одночасно збільшить наші доходи та заохотить інші міжнародні компанії інвестувати в нашу країну."
 INS_light_tank_equipment_1_short:0 "PVT-1"
 INS_militias_railway_pemuda_mission:0 "Молодіжний залізничний загін вимагає бою"
 INS_mobilize_the_pemuda_desc:0 "Тепер, коли ми успішно заслужили довіру найбільших груп Пемуда, ми повинні розпочати плани щодо їх мобілізації до TKR."
 INS_national_revolution_republic_sukarno_threatened:0 "Сукарно загрожують спроби замаху"
 INS_political_events.1.b:0 "[INS.GetLeader] добре впорався, він має відслужити ще один термін."
 INS_political_stabilization_desc:0 "Наша країна стає все більш нестабільною з кожним днем. Якщо ми не відреагуємо найближчим часом, громадянська війна буде майже неминучою. Ми маємо розпочати переговори між Національним комітетом, Президентом та лідерами ополчень, щоб знайти рішення."
 INS_renville_wont_happen_neutral_tt:0 "Конфлікт закінчиться до завершення американських переговорів, вони не зможуть втрутитися."
 INS_revolution_events.3.t:0 "[ENG.GetNameDefCap] погоджується на Лондонсько-Батавську угоду"
 INS_rubber_for_civ:0 "Продати каучук для субсидування цивільної промисловості"
 INS_seize_oppurtunity_refuse_warn_tt:0 "§RПочнеться національна революція, яка може призвести до війни з [HOL.GetNameDef]§!."
 INS_set_leader_to_sjahrir:0 "Обрати $INS_sutan_sjahrir$"
 INS_strat_bomber_equipment_0:0 "Fokker F.XVIII"
 INS_sukarno_is_dead:0 "Сукарно мертвий"
 INS_sukarnos_industrialization_desc:0 "Промисловість Яви — це основа нашої економіки та армії. Усі дороги мають вести до Риму."
 INS_take_batavia:0 "Захопити контроль над Явою"
 INS_union_of_indonesia_faction:0 "Індонезійський союз"
 INS_volksraad_events.31.desc:0 "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_events.41.desc:0 "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
