 SIA_achieve_domestic_legitimacy:0 "Досягнення внутрішньої легітимності"
 SIA_ananda_trait_tt:0 "Коли Ананда зійде на престол, він отримає: "
 SIA_appeal_to_navy_clique_tt:0 "Ми заручимося підтримкою військово-морської кліки.\n\nВони допоможуть нам у громадянській війні, надавши весь свій флот та дивізію морської піхоти. Однак вони очікуватимуть від нас вигідної військово-морської політики шляхом виконання фокусу §Y$SIA_thonburi_class_coastal_defense_ship$§! протягом §Y720 днів§! після здобуття влади.\n\nНевиконання цього призведе до падіння §YСтабільності§! та §YПідтримки війни§!\n\nНа початку громадянської війни ми отримаємо:\n§YВесь наш флот§!\nДивізію морської піхоти §YКоролівського корпусу морської піхоти Таїланду§!\nТехнологію §YМорська піхота§!"
 SIA_develop_phibunsongkhram:0 "Розвиток [1067.GetName]"
 SIA_divert_army_funds_to_navy_toggle_do_tt:0 "Ми перенаправимо частину армійських коштів на флот, щоб прискорити його розвиток."
