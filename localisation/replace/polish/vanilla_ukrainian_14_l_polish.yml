 MEX_focus_liberate_the_antilles:0 "Звільнити Антили"
 MEX_focus_march_southwards_desc:0 "Після боротьби за незалежність Мексика втратила південні провінції. Некомпетентна Мексиканська імперія завдала шкоди нашій історії, але ми можемо виправити її помилки. Південні штати мають вирішальне значення для нашої оборони, і ми їх повернемо."
 MEX_focus_national_bank:0 "Національний банк"
 MEX_focus_repeal_the_calles_law_desc:0 "Кальєс підбурив крістерос до повстання шляхом жорсткого застосування антирелігійних статей Конституції. Закон Кальєса принижує духовенство, забороняючи носіння церковного одягу в публічних місцях і ув'язнюючи релігійних діячів, які критикують уряд. Ми згодні з тим, що політичний вплив Церкви потребує обмеження, але це напади на особисту свободу, а не на церковну владу."
 MEX_focus_royal_dutch_shell:0 "Royal Dutch Shell"
 MEX_focus_tank_workshops:0 "Танкові майстерні"
 MEX_focus_unify_centroamerica_desc:0 "Маленькі бананові республіки Нікарагуа, Панама та Коста-Ріка занадто малі, щоби бути життєздатними країнами. Ми повинні поглинути їх у нашу власну націю і тим самим принести славу Мексиці та мексиканському народу."
