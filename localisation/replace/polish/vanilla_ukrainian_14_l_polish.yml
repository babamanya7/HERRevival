 GRE_absolute_monarchy_opposition_tt:0 "§RЦе рішення призведе до громадянської війни!§!\n§YВенізелісти§! стануть §Rворожими§!!\n§YКомуністи§! стануть §Rворожими§!!"
 GRE_appeal_to_the_soviet_union_desc:0 "З Радянським Союзом справи треба вести обережно, інакше ми потрапимо прямо в лігво вовків, готових обковтати нас до кісток. Але краще ми прийдемо до них, ніж вони прийдуть до нас..."
 GRE_attack_the_fascists:0 "Атакувати фашистів"
 GRE_battleship_1_desc:0 "The Kilkis class consisted of two U.S. Mississippi-class battleships that were commissioned in 1908 and sold to Greece in 1914. They were the last pre-dreadnought battleships built by the U.S. They displaced only 13,000 tons and were armed with four 10 in./45 caliber Mk V guns in their main armament. They had average armament, speed, and range for their vintage. Both ships were retired by 1936."
 GRE_bolster_the_schachtplan:0 "Поліпшити план Шахта"
 GRE_british_armenia_option_tt:0 "Якщо пропозиція буде прийнята, а Іракліонська конвенція завершиться успіхом, то, коли §Y[TUR.GetNameDefCap]§! капітулює, §Y[ENG.GetNameDefCap]§! створить §YВірменський§! 354.GetName]§!."
