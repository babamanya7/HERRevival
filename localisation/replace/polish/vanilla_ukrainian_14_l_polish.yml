 MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR_DESC:0 "Модифікатор ефективності, отримуваної, масово виробляючи оснащення на одній виробничій лінії."
 MODIFIER_SUPPLY_CONSUMPTION_FACTOR_DESC:0 "Модифікатор споживання потрібних військам для ефективних дій припасів."
 MODIFIER_TRANSPORT_CAPACITY_DESC:0 "Скільки місця потрібно військам на транспортних суднах. Чим менша величина, тим ефективніше ми зможемо рухати великі армії морем."
