 adu_restore_sultanate_of_africa_desc:0 "Колись давно маври Північної Африки були об'єднані в єдиний султанат — Африканський султанат, важливу гілку Омейядського халіфату. Тепер, коли Андалусія відновлена і всі мавританські народи співіснують в межах нашої держави, ми можемо об'єднати мавританську ідентичність."
 adu_restore_umayyad_caliphate_desc:0 "Нарешті святі міста Багдад, Мекка та Єрусалим об'єднані в єдину державу. Тепер, коли серцевина Аравії в наших руках, ми можемо заявити, що ми не просто союз маврів, а відновлений Халіфат, батьківщина для всіх ісламських народів і культур."
