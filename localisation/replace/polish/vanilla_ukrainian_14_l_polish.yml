 CZE_no_time_to_lose_tt:0 "Наш час на завершення фортифікаційних проєктів до того, як виникне загроза, тепер дуже обмежений."
 CZE_prioritize_export_contracts_desc:0 "Саме наша експортна промисловість допомогла нам вибратися з Великої депресії. Чому ми повинні змінювати свою поведінку зараз? Будь-яка загроза нашій нації все одно перебільшена. Армія може й почекати."
 CZE_raider_lineage:0 "Родовід рейдерів"
 CZE_strat_bomber_equipment_1:0 "Aero B-36"
 CZE_the_lions_roar_desc:0 "Символ чехословацького лева уособлює найкращі якості нашої армії. Мужність, силу та героїзм найвищого ступеня. Усі дізнаються про незрівнянний дух наших збройних сил."
