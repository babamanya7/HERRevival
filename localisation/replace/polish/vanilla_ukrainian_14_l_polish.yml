 STAT_COMMON_RELIABILITY_DESC:0 "Чим нижча величина, тим більша ймовірність того, що оснащення зазнає випадкових збоїв і нещасних випадків або вибухне вогняною кулею смерті при легкому ударі. Надійність не впливає вище 100%."
