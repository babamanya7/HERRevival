 MUN_czech.1021.t:0 "Повернення Австро-Угорського митного союзу?"
 MUN_czech.1025.d.2:0 "Незважаючи на доблесну боротьбу [ROOT.GetAdjective]их сил у громадянській війні в Іспанії, сторона, яку ми підтримували, зазнала поразки. Попри це, наші війська і особливо їхні медичні команди засвоїли цінні уроки."
 MUN_czech.1033.a:0 "Ще один союзник проти [GER.GetAdjective]ої держави"
 MUN_czech.1033.t:0 "[FROM.GetAdjective]ий уряд у вигнанні просить про визнання"
 MUN_czech.1039.d:0 "У світлі Угоди про автономію, яку ми надали [SLO.GetAdjective]им представникам, $RUT_augustin_voloshyn$ запитав про можливість для свого регіону укласти таку ж угоду про федералізацію з нами. Це здається абсурдним, але за нинішніх обставин ми змушені сприймати ці вимоги всерйоз."
