 MAN_tsr_move_capitals_desc:0 "Стародавньою столицею всього Китаю завжди був Пекін. Тепер, коли його повернуто, ми можемо з тріумфом повернути Імператора до його старого дому."
 MAN_tsr_reestablish_the_qing_army_desc:0 "Без армії ми ніколи не зможемо возз'єднати Імперію, яка колись існувала. Ми повинні черпати натхнення в нашій старій армії, але також не надто заглиблюватися в традиції. Військове мистецтво змінюється, і ми повинні слідувати за ним."
 MAN_yong_ying_category_desc:0 "Юн'їн, або табори сміливців, — це форма ополчення, що використовувалася за часів ери Цін, де сміливцями були ополченці, набрані з місцевого населення. Фінансуючись за рахунок державних коштів, а не як частина регулярної армії, вони служили незалежно, часто з метою самооборони. Ми повинні прагнути вдосконалити цю систему, щоб ефективно використовувати її в майбутніх війнах."
