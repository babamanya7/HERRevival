 SOV_addressing_internal_affairs_desc:0 "Хоча у революції все ще багато ворогів по всьому світу, а мільйони трудящих все ще прагнуть звільнення, ми не мусимо забувати про численні проблеми, які чекають на нас вдома."
 SOV_align_admiral_stalin:0 "[ROOT.GetLeader] забезпечує лояльність адмірала"
 SOV_align_the_zinovyevites_desc:0 "Колись Григорій Зінов'єв став на бік Сталіна проти Троцького. Відразу після цього Сталін зрадив його і усунув від будь-якої посади. Він не забув цієї образи, і якщо ми дамо Зінов'єву можливість помститися, він нею скористається."
 SOV_an_adaptable_army_desc:0 "Ця війна простягається через кілька кліматичних зон і безліч різноманітних місцевостей. Якщо ми хочемо перемогти у цій війні, ми мусимо бути здатні воювати на будь-якій місцевості і за будь-якої погоди."
 SOV_an_empire_in_the_pacific_tt:0 "Буде отримано §Gпретензії§! на всі землі §YВеликого Китаю§!."
