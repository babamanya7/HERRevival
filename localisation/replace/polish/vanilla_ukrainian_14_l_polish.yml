 CHI_power_struggle_desc:0 "Наш вплив на політичні процеси у державі помітно зріс. Тепер ми можемо розмовляти на рівні з іншими державами."
 CHI_preempt_the_inevitable:0 "Випередити неминуче"
 CHI_projecting_power_desc:0 "Розширюючи нашу повітряну досяжність за межі лінії фронту, ми готуємося завдати удару там, де з'явиться можливість. Проєкція повітряної сили — це більше не амбіція, а стратегічна необхідність."
 CHI_public_works_desc:0 "Населення має зрозуміти, що ми працюємо заради його ж добра. Наша пропаганда ґрунтуватиметься на кількох масштабних проєктах — нехай усі бачать, яким міг стати весь Китай, якби ми отримали велику підтримку."
 CHI_rapid_mobilization_desc:0 "Нам потрібна сильна армія, щоби ми могли заявити свої права на верховенство у Китаї. Ми розробимо нові методики тренувань та створимо армію, здатну виконувати будь-які поставлені завдання."
 CHI_reach_out_to_france_desc:0 "Нехай раніше Франція неодноразово принижувала нас, постійно змушуючи йти на поступки, у поточній ситуації нам може знадобитися навіть її допомога."
 CHI_reeducate_sun_tongxuan_decision:0 "Перевиховати [SND.GetFlag] $CHI_sun_tongxuan$"
 CHI_republicanism:0 "Республіканізм"
 CHI_sea_anti_imperialism:0 "$CHI_anti_imperialism$"
 CHI_sea_bureau_of_investigation_and_statistics:0 "$CHI_bureau_of_investigation_and_statistics$"
 CHI_sea_fortification_efforts_desc:0 "Хоча наша позиція наразі залишається безпечною, може настати час, коли нам доведеться захищати наші кордони до останньої людини. Тому очевидно, що нам доведеться укріпити наші кордони та окопатися."
 CHI_sea_infantry_efforts_desc:0 "Піхота служить хребтом нашої армії. Покращуючи наші методи підготовки та стандарти, ми зможемо гарантувати, що вони діятимуть ще краще в активному бою."
 CHI_sea_institute_cross_border_raids_desc:0 "$CHI_institute_cross_border_raids_desc$"
 CHI_sea_long_term_economic_planning:0 "$CHI_long_term_economic_planning$"
 CHI_sea_mission_to_the_us:0 "$CHI_mission_to_the_us$"
 CHI_sea_modern_logistics_desc:0 "$CHI_modern_logistics_desc$"
 CHI_sea_rely_on_our_infantry:0 "Покладатися на нашу піхоту"
 CHI_sea_root_out_corruption:0 "$CHI_root_out_corruption$"
 CHI_sea_small_arms_expertise_desc:0 "$CHI_small_arms_expertise_desc$"
 CHI_sea_war_of_national_liberation_desc:0 "$CHI_war_of_national_liberation_desc$"
 CHI_secure_the_soviet_border:0 "Убезпечити радянський кордон"
 CHI_seek_party_support_tt:0 "Збільшує вартість прийняття цього рішення на §R25§!"
 CHI_set_up_an_nco_school_desc:0 "Переважній частині наших військових бракує формальної освіти, що для звичайного солдата можна пробачити, але стає проблемою при просуванні по службі. Нам потрібно створити систему підготовки наших унтерофіцерів, щоб ми могли переконатися в їхній якості."
 CHI_stalemate_tt:0 "Війна зайде в глухий кут, і війська повернуться на вихідні позиції"
 CHI_strenghten_warlord_authority_desc:0 "Щоб убезпечити нашу зону контролю та гарантувати, що нас не підірвуть Гоміньдан, комуністи чи японці, [ROOT.GetLeader] мусить зміцнити свій авторитет."
 CHI_strike_at_what_is_weak_desc:0 "Ми не будемо зустрічати силу в лоб. Натомість наша доктрина повинна наголошувати на ураженні найбільш вразливих точок ворога з точністю та наполегливістю."
 CHI_super_heavy_tank_artillery_equipment_1_short:0 "PLZ 44"
 CHI_take_advantage_of_dus_contacts_desc:0 "Лідер Зеленої банди має друзів у багатьох місцях і ноу-хау, якими володіють одиниці. Така мережа могла б принести нам користь, якби ми використали її належним чином, навіть якщо це принесе прибуток деяким підозрілим особам."
 CHI_tsr_coronation_at_the_temple_of_heaven_desc:0 "Щоб зміцнити нашу владу, [ROOT.GetLeader] повинен подбати про відновлення елементів державного конфуціанства та відродження релігійних обрядів держави Цін. Тому в інтересах [ROOT.GetLeader] взяти участь як імператор у ритуалах, що проводяться в цінському Храмі Неба, і згодом коронуватися там."
 CHI_tsr_power_struggle_cat_desc:0 "Розгорілася боротьба за політичний контроль над Китаєм. Ми повинні заручитися підтримкою воєначальників та всередині партії, щоб вийти переможцями."
 CHI_tsr_tianxia:0 "Тянься"
 CHI_wargaming_division_desc:0 "Потрібно сформувати відділ генштабу, завданням якого буде передбачати майбутні війни та працювати над тактикою та стратегією. Найімовірніше, для імітації світової війни їм знадобиться якийсь обчислювальний пристрій."
 CHL_ADJ:0 "Чилійськ"
 CHL_a_joint_application_to_the_allies_desc:0 "У нас із Аргентиною завжди були досить добрі відносини з давніми Союзниками, і нарешті настав час об'єднатися з ними і працювати разом заради світлого майбутнього."
 CHL_advancements_in_telecommunications_desc:0 "Наші науковці, які працюють у галузі досліджень і розробок, почали розробляти кращі методи використання не лише радіо, але й розширювати можливості використання телевізорів, і завдяки цьому ми зможемо легше доносити загальні знання до населення, а також краще обмінюватися результатами досліджень між далекими відділами наукових лабораторій країни."
 CHL_amerindian_federation_communism:0 "Велика федерація америндських народів"
 CHL_arsenales_de_marina_organization:0 "Arsenales de Marina"
 CHL_bolster_revolutionaries_americas:0 "Підсилити революційні сили в державі [FROM.GetNameDef]"
 CHL_counter_operation_bolivar:0 "Працювати на протидію операції «Болівар»"
 CHL_crackdown_on_fascists_bad_mission:0 "Спроба придушення нашої партії"
 CHL_fascist_and_communist_joint_civil_war_started:0 "Антиібаньїстська громадянська війна вже розпочалася"
 CHL_ibanez_outlaw_socialism_mission:0 "Ібаньєс оголошує соціалізм поза законом"
 CHL_integrate_the_kingdom_of_mexico:0 "Інтегрувати мексиканську державу"
 CHL_international_loans:0 "Міжнародні позики"
 CHL_issue_bonds_desc:0 "Спогади про нещодавню економічну кризу призвели до того, що наші люди дуже бояться інвестувати свої гроші, а це стримує економічне зростання. Заохочуючи наших людей купувати державні облігації з обіцянкою реінвестувати гроші назад у країну, ми зможемо швидше побудувати сильнішу [CHL.GetAdjective]у державу."
 CHL_mapuche_reorganize_the_canadian_government:0 "Реорганізувати [CAN.GetAdjective]ий уряд"
 CHL_mapuche_state_neutrality_ADJ:0 "Мапуцьк"
 CHL_mobilize_the_veteran_legionaries_desc:0 "Французькі іноземні легіонери, яких король Антуан III залучив для вишколу та допомоги в мобілізації нових військ, зараз відчайдушно потрібні на фронті, і їхній набір до регулярної армії мусить бути серйозно розглянутий."
 CHL_nacista_decisions:0 "Національна держава Чилі"
 CHL_neutrality:0 "Чилійська республіка"
 CHL_open_investigations_against_the_nacistas:0 "Відкрити розслідування проти Хорхе Гонсалеса фон Марееса"
 CHL_political_events.27.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вирішив прийняти нашу пропозицію про домінування, і їхня нація відповідно стане невід'ємним партнером нашої. Хай живе революція!"
 CHL_political_events.33.a:0 "Справді славетний день!"
 CHL_political_events.46.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вирішив прийняти нашу пропозицію і приєднується до нас в альянсі з [GER.GetNameDef]. Ми, давно втрачені брати, возз'єдналися, але цього разу на більш рівних та справедливих умовах!"
 CHL_political_events.52.desc:0 "Після недавньої широкомасштабної мобілізації на нашому кордоні та тижневих протестів [CHL.GetAdjective] народу, [CHL.GetLeader] оголосив, що настав час, щоб [CHL.GetNameDef] відновила контроль над територією [947.GetName], від якої вони відмовилися в договорі Ліми, який вони тепер вважають несправедливим, недійсним та нікчемним."
 CHL_political_events.54.a:0 "Ми змусимо їх заплатити за свою нахабність!"
 CHL_political_events.67.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] зв'язався з нами, заявивши, що їхня регіональна охорона знаходиться в процесі виведення з Гвіан, і що відбудеться церемонія передачі території нам, оскільки вона не варта боротьби в їхніх очах."
 CHL_political_events.86.a:0 "Ми сильніші разом"
 CHL_political_events.99.t:0 "[GER.GetName] приймає вступ до Осі"
 CHL_proliferate_national_populism:0 "Поширювати націонал-популізм"
 CHL_promote_pan_hispanic_rhetoric:0 "Просувати пангіспанську риторику"
 CHL_radical_party_long:0 "Радикальна партія"
 CHL_reclaiming_quebec_tt:0 "Буде відкрите рішення: §YІнтегрувати Квебек§!."
 CHL_reestablish_the_republican_guard_desc:0 "Тепер, коли ми знову під загрозою, Республіканська гвардія мусила бути зібрана знову, щоби боротися з загрозою високого рівня, яка вирішила полювати на нас. До зброї, до бою за свою республіку!"
 CHL_state_catholicism:0 "Державний католицизм"
 CHL_strike_down_south_american_fascism_desc:0 "У Південній Америці є багато людей, яких приваблює фашизм, і ми мусимо переконатися, що в нашому регіоні немає таких, які загрожують нашій безпеці, що ускладнює співіснування з ними. Тому ми мусимо знищити їх ще до того, як вони зможуть навіть подумати про те, щоб заподіяти нам якусь шкоду."
 CHL_sub_ship_engine_4:0 "Двигун 5 000 к. с. н. в."
 CHL_unify_the_fascist_movements:0 "Об'єднати фашистські рухи"
 CHL_we_will_be_puppeted_tt:0 "Ми станемо §RМаріонеткою§! §Y[CHL.GetNameDef]§!"
 CHU_fascism_party_long:0 "Чуваський національний шовінізм"
 CIC_BANK_CURRENT_VALUE:0 "Поточна величина: $VAL|2H$"
 CIVIL_WAR_TENSION_DESC:0 "Щоб приєднатися до громадянської війни, світова напруженість мусить бути не нижче $MIN|0H%$. На даний момент це лише $CURRENT|0R%$."
 CIV_LEDGER_THRESHOLD_FACTORY_COUNTS:0 "Кількість та історія споруд"
 CIV_LEDGER_THRESHOLD_FUZZY_TOTAL_MANPOWER:0 "Приблизно всього людських ресурсів"
 CLEAR_OVERRIDE_TOOLTIP:0 "Очистити закони, які замінюють поточний вибір закону."
 CLICK_TO_ASSIGN:0 "Клац — признач."
 CLICK_TO_TOGGLE_ALL_CATEGORY_DECISION_TRACKING:0 "§GКлацніть§!, щоби перемкнути статус сповіщення для всіх рішень у цій категорії."
 CMR_neutrality:0 "Камерун"
 COG_AI_BEHAVIOR:0 "@COG Бельгійське Конго"
 COG_BLITZKRIEG_DESC:0 "Із завершенням італійського завоювання Абіссінії та здобуттям Німецьким Райхом нових територій в Європі, ситуація виглядає небезпечною. Колоніальні амбіції Італії не зупиняються на Східній Африці, і цілком можуть загрожувати нам у найближчому майбутньому, в той час як Гітлер активно придивляється до наших бельгійських володарів як до кроку в своєму плані гегемонії на європейському континенті.\n\nЗдається, що війна скоро прийде до нас, якщо ми не прийдемо до них перші..."
 COG_academie_militaire_de_kananga:0 "Військова академія Кананга"
 COG_allow_local_autonomy:0 "Дозволити місцеву автономію"
 COG_anti_colonialism_decision_desc:0 "[FROM.GetAdjective]ому імперіалізму в Африці настане кінець. Світ має відкрити очі, усвідомити, що часи [FROM.GetAdjective]ого колоніалізму минули! Народ держави [FROM.GetNameDef] повинен чинити тиск на своїх лідерів, щоб звільнити їхні придушені африканські колонії."
 COG_anti_colonialism_map_category_name:0 "Окуповані колоніальні території, де ми можемо підтримати місцеввий опір"
 COG_arm_resistance_decision_desc:0 "Озброїти сили опору в цьому регіоні."
 COG_boma_accords_faction:0 "Бома-Угоди"
 COG_enter_the_sterling_area_desc:0 "Британці вимагають, щоб ми, в обмін на збереження нашої незалежності, поки наш володар під іноземною окупацією, приєдналися до стерлінгової зони та сплачували субсидії, а також дотримувалися колоніальних цін на ринок. Це не буде вигідно для нас економічно, але це ціна, яку ми повинні заплатити."
 COG_establish_the_west_african_national_secretariat_desc:0 "Настав час реалізувати те, що було вирішено на Пан-африканському конгресі. Ми повинні постачати зброю революціонерам і допомагати в глобальній боротьбі з колоніалізмом, щоб ця темна ера нарешті завершилась!"
 COG_french_as_martial_language_desc:0 "Традиційно Force publique використовувала французьку як основну мову в армії. Це виявилося ефективною концепцією, і немає причин змінювати її найближчим часом."
 COG_invest_in_urban_centers:0 "Інвестувати в міські центри"
 COG_move_the_capital_to_bujumbura:0 "Перенести столицю до Бужумбура"
 COG_sell_diamonds_on_the_black_market_decision:0 "Виставити алмази на чорному ринку"
 COG_strike_while_the_iron_is_hot_tt:0 "Наші війська почнуть марш до Леопольдвіля, офіційно починаючи війну за незалежність. Ми зможемо примусити наших колишніх сюзеренів до миру і отримати повну незалежність, якщо контролюємо §YЛеопольдвіль§!, §YЕлізабетвіль§! та §YСтенлівіль§!, або якщо зможемо капітулювати нашого ворога та примусити його до миру.\n\nТим часом вони зможуть примусити нас до миру та зберегти контроль над нашою країною, контролюючи §YЛеопольдвіль§!, §YЕлізабетвіль§! та §YSСтенлівіль§!."
 COG_the_empain_group_decisions_desc:0 "Уклавши договір з групою Empain з метою полегшити нам пошук інвестицій і розвиток наших галузей промисловості та природних ресурсів, ми могли б забезпечити процвітання нашої країни протягом багатьох років."
 COLLECTION_ALL_SAME_CONTINENT_COUNTRIES:0 "Усі країни на тому ж континенті"
 COLLECTION_FACTION_CONTROLLED_STATES_IN_EUROPE:0 "Підвладні нам області в Європі"
 COLLECTION_FACTION_STATES_IN_EUROPE_OR_ASIA:0 "Підвладні альянсу області в Європі або Азії"
 COLLECTION_OP_OWNED_STATES:0 "Області у власності"
 COLLECTION_UNCAPITULATED_DEMOCRATIC_FACTION_MEMBERS:0 "Демократичні члени альянсу, що не капітулювали"
 COL_communism_ADJ:0 "Колумбійськ"
 COMBAT_COMMITED_LABEL:0 "Дивізії: $COUNT$"
 COMBAT_DEFENDER_WINNING:0 "§YЗахисник виграє.§!"
 COMBAT_LOG_TAB_EQUIPMENT:0 "Оснащення"
 COMMAND_POWER_ALLOCATED_TOOLTIP_ENTRY:0 "         - $NAME|0$: $VALUE|=+0$"
 CONFIRMDELETE_ARMY_GROUP_TEXT:0 "Усі військові частини в цих арміях будуть відкріплені, а всі намальовані накази — видалені.\nВи справді хочете §Rвидалити§! цю §Rгрупу армій§!?"
 CONFIRM_DELETE_ORDER:0 "Видалити наказ"
 CONFIRM_DELETE_ORDER_AREA_DEFENSE:0 "намальований наказ про §Yоборону території§!"
 CONGO_appoint_van_overstraeten_desc:0 "Рауль ван Оверштретен, ймовірно, один з найбільш здібних офіцерів у [BEL.GetAdjective] армії, але проблема в тому, що він сам це знає. Його особистість зробила його непопулярним у рідній країні, однак він служив у Конго під час Великої війни. Ми можемо використати цю ностальгію, щоб повернути цього талановитого офіцера."
 CONGO_belgian_devaluation_desc:0 "Уряд [BEL.GetAdjective] здійснив політику девальвації, що дозволило Генерал-губернатору знизити мита на імпорт і підвищити їх на експорт. Це повинно суттєво покращити колоніальний бюджет."
