 NOR_alt_dem_focus_on_defense_desc:0 "Ще зовсім недавно [NOR.GetName] була мирною та роззброєною нацією, ми вичерпалися. Нам потрібно зосередитися на захисті того, що ми маємо на даний момент."
 NOR_alt_democratic:0 "Норвезький воєнний кабінет"
 NOR_anti_air_construction:0 "Протиповітряна конструкція"
 NOR_artillery_development:0 "Розвиток артилерії"
 NOR_continue_nygaardsvold_government:0 "Продовжити уряд Нюгошволда"
 NOR_exiled_pp_TT:0 "§G+$RIGHT|0$§! £pol_power після вигнання"
 NOR_field_hospitals_desc:0 "Населення [NOR.GetName] не є бездонним, як в інших країнах. Матеріальні засоби можна замінити, але втрачений товариш означає одну душу менше для міжнародної боротьби проти капіталізму. Ми повинні зосередити наші зусилля на порятунку будь-якого пораненого солдата. відправте їх назад на лінію фронту якомога швидше, щоб ми не ризикували втратити і людей, і землю."
 NOR_iceland_desc:0 "Після розпаду Кальмарської унії Ісландія була несправедливо відібрана в нас. Незважаючи на те, що це було багато століть тому, ми не забули. [NOR_GetIcelandClaimDesc]"
 NOR_invested_in_our_country:0 "Інвестують у нас"
 NOR_invite_foreign_investment_desc:0 "Нашою промисловістю нехтували десятиліттями, тому нам бракує капіталу, необхідного для індустріалізації до рівня інших країн Європи. На щастя, за кордоном є багато жадібних інвесторів, які готові інвестувати в наше майбутнє за певну ціну."
 NOR_invite_transnational_manufacturers_desc:0 "Ми настільки зосередилися на торгівлі, що не використали всі можливості виробництва в нашій країні. Тепер, коли ми мали справу з профспілками, іноземні компанії стікатимуться в нашу країну, щоб отримати безперешкодний доступ до робочої сили."
 NOR_leaving_the_hard_thirties_behind_desc:0 "Роками ми терпіли поштовхи великої депресії, і без необхідних інструментів і промислової бази мало шансів поставити нашу молоду націю на міцну землю. Настав час почати будувати базу, з якої [ROOT.GetName] може рости й процвітати."
 NOR_liberal_conservative_alliance_desc:0 "Незважаючи на те, що Høyre та Venstre означають праві та ліві відповідно, наші дві партії мають достатньо спільних інтересів, щоб ми могли сформувати урядову коаліцію та відбити будь-які атаки цієї метушливої Лейбористської партії. Разом ми сформуємо [ROOT.GetName] націю, яка дружній до капіталу і готовий вести війни тут і за кордоном."
 NOR_modernize_armed_forces_decision_desc:0 "[ROOT.GetAdjectiveCap]ими збройними силами так довго нехтували, що наші збройні сили більше придатні для музею, ніж для поля бою."
 NOR_moscows_education_centers:0 "Центри комуністичної освіти"
 NOR_norsk_spraengstofindustri_organization:0 "Norsk Sprængstofindustri"
 NOR_norwegian_carriers_desc:0 "Ми знову і знову бачили, що майбутнє війни значною мірою залежить від контролю над повітряним простором, навіть у морі. Авіаносці допоможуть нам панувати в небі над ворожими кораблями та швидко їх перемогти."
 NOR_norwegian_reichsprotectorate:0 "Норвезький райхспротекторат"
