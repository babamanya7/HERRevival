 ENG_danish_intervention_desc:0 "Данська підтримка ворогів миру в усьому світі продовжує зростати. Існує лише один спосіб переконатися, що вони залишаться на нашому боці. Ми мусимо використати Данію для створення стратегічного плацдарму в регіоні на випадок, якщо виникне необхідність сухопутного вторгнення в Європу."
