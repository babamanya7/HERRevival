 SIA_focus_on_commercial_civilian_ships:0 "Зосередитися на комерційних цивільних суднах"
 SIA_joint_asian_military_command:0 "Об'єднане азійське військове командування"
 SIA_mandate_7:0 "Сьомий мандат"
 SIA_pan_asian_weapon_standardization_desc:0 "Кожен союзник, який використовує різні гвинтівки, калібри, рації та транспортні засоби, — це запрошення до логістичного провалу. Стандартизована зброя та спільні плани виробництва зроблять нашу коаліцію сильнішою, дешевшою та швидшою в озброєнні."
 SIA_press_censorship_desc:0 "Вільна преса ризикує підірвати стабільність держави. Хоча певна свобода дій повинна існувати, нам потрібно переконатися, що голос і воля уряду є пріоритетними в засобах масової інформації."
 SIA_shuffle_pridi_to_the_minister_of_interior_desc:0 "Перевівши Пріді на посаду міністра внутрішніх справ з міністра закордонних, він зможе ефективніше контролювати розподіл урядових ресурсів і слугувати гальмом для зростаючого впливу військових."
 SIA_standardize_aircraft_maintenance:0 "Стандартизація технічного обслуговування літаків"
 SIA_stronger_together_desc:0 "Війна перетворила далекі обіцянки та паралельні альянси на не більше ніж перешкоди. Якщо [ROOT.GetNameDef] хоче визначати курс Азії, ми повинні попросити наших партнерів прив'язати їхню фракцію до нашої і прийняти єдине командування в майбутній боротьбі."
 SIA_submarine_day_desc:0 "Введення підводної війни в наш флот заслуговує на суспільне визнання і національний ентузіазм. Святкуючи день підводного флоту, ми можемо стимулювати набір персоналу, підняти престиж і закріпити в суспільній свідомості думку про те, що Сіам входить у нову військово-морську епоху."
