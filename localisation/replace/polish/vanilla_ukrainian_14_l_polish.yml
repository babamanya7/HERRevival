 DIPLOMACY_GUARANTEE_DESC:0 "Гарантія незалежності держави $COUNTRY|H$ означає, що Ви оголосите війну будь-якій державі, яка нападе на неї. Це зменшить §Yсвітову напруженість§! на $THREAT|Y%$."
 DIPLOMACY_GUARANTEE_NO_THREAT_DESC:0 "Гарантія незалежності держави $COUNTRY|H$ означає, що Ви оголосите війну будь-якій державі, яка нападе на неї."
