 IRE:0 "Ірландія"
 IRE_BEL_autonomy_eu_member:0 "Європейська Ірландія"
 IRQ_arab_free_legion_tt:0 "Відмикає рішення §Y$IRQ_arab_free_legion_cat$§! для вербування дивізій з усього арабського світу."
 IRQ_carve_up_syria_desc:0 "Сирія по праву мала бути включена до нашого королівства, але була відібрана у нас французами. Крім того, наші друзі в [TUR.GetNonIdeologyName] також претендують на частини цього району. Можливо, настав час нам спільно вимагати цю територію, поки світ відволікається."
 IRQ_demand_syria_hashemite_desc:0 "Сирія недовго перебувала під правлінням Фейсала I у 1920 році, але була відібрана у нас через французьку підступність. Тепер ми можемо вести переговори з позиції сили та вимагати повернення нашої законної території."
 IRQ_found_southern_steel_plants_desc:0 "Сталь має вирішальне значення для економічного розвитку, а також виробництва військового обладнання. Поки що з'явилося мало внутрішніх виробників, які могли б підтримати наші потреби, що робить нас залежними від імпорту. Це не може тривати, оскільки світ стає все більш ворожим."
 IRQ_infantry_equipment_2_short:0 "Sten MkII"
 IRQ_infantry_equipment_3:0 "Sterling MkI"
 IRQ_invite_oil_mission_ctt:0 "Ми запропонуємо §Y[GER.GetNameDef]§! права на нашу §YНафту§! у §Y[676.GetName]§! в обмін на:"
 IRQ_iraqi_al_futuwwa_desc:0 "Щоб наша нація стала сильною, ми повинні заснувати молодіжні організації, які навчатимуть наш народ боротися за більш славетне майбутнє!"
 IRQ_kurd_democratic_party:0 "ДПК"
 IRQ_kurdish_reject_ankara_treaty_desc:0 "Анкарський договір зруйнував попередні спроби створити націю для курдського народу. Ми повинні дати зрозуміти світові, що відхиляємо кордони, встановлені цим договором, і не заспокоїмося, доки курдський народ не об'єднається."
 IRQ_kurdish_united_desc:0 "Через великі труднощі та боротьбу ми нарешті об'єднали курдський народ під нашим правлінням. Незалежно від того, що буде далі, ми стоїмо як один об'єднаний народ."
 IRQ_kurdistan_events.4.desc:0 "У світлі нашого недавнього поштовху до індустріалізації ми побачили зростання кількох різних профспілок. Фабричні робітники об'єдналися, вимагаючи того, що вони вважають справедливими умовами праці. Нам може бути вигідно їх заспокоїти, але хто знає, як це вплине на нас політично."
 IRQ_kurdistan_tag_communism_ADJ:0 "Курдськ"
 IRQ_march_on_syrian_kurdistan_mission:0 "Проникнення в західний Курдистан"
 IRQ_nationalized_our_oil:0 "Nationalized the Anglo-Iraqi Oil Company!"
 IRQ_political_events.23.a:0 "Арабська солідарність перемогла сьогодні."
 IRQ_political_events.26.t:0 "[FROM.GetNameDefCap] пропонує членство у Федерації"
 IRQ_political_events.40.desc:0 "Уряд [FROM.GetNameDef] офіційно вимагає, щоб ми передали контроль над Сирією їхній владі. Вони стверджують, що Сирія, як невід'ємна частина арабського світу, має бути об'єднана з [FROM.GetNameDef] під єдиною адміністрацією для забезпечення стабільності та процвітання регіону. Хоча вони оформлюють свою вимогу як крок до панарабської єдності, поступка Сирією значно зменшить наш вплив на Близькому Сході. Відхилення їхньої пропозиції може ще більше напружити стосунки та потенційно призвести до ескалації."
 IRQ_political_events.60.b:0 "Їм не можна довіряти."
 IRQ_political_events.60.t:0 "[FROM.GetNameDefCap] пропонує мир"
 IRQ_political_events.61.t:0 "[FROM.GetNameDefCap] приймає мирну угоду"
 IRQ_reapproachment_with_the_tribes_desc:0 "Все ще є багато племінних лідерів, які не повністю довіряють нашому уряду. Ми повинні заспокоїти їх та інвестувати в їхні місцеві регіони, щоб забезпечити, що їхня лояльність належить лише нам."
 IRQ_royal_iraqi_army_desc:0 "Загроза війни, чи то від наших сусідів, чи то з-за кордону, стає дедалі ймовірнішою. Крім того, існує велика кількість внутрішніх фракцій, які готові розірвати нашу націю на частини. Усе, що може їх стримувати, — це сила наших збройних сил."
 ITA_VICTORY_POINTS_665:0 "Марбурго"
 ITA_a_colonial_empire_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_GLOBAL_NON_CORE_MANPOWER$: §G+15.00%§!\n\n"
 ITA_a_greater_purpose:0 "Вища мета"
 ITA_a_greater_purpose_desc:0 "Нещодавні чвари всередині партії показали нам недоліки надто тісної прив'язки ідеї фашизму до якоїсь однієї людини. Ми мусимо зосередитися на просуванні фашизму як більш широкої концепції, як того, що виходить за межі смертного життя кожної окремої людини — ідеї, навколо якої люди можуть згуртуватися."
 ITA_anti_tank_equipment_2:0 "Cannone da 47/32 mod. 35"
 ITA_appease_the_military:0 "Умиротворити армію"
 ITA_armored_car_at_equipment_short:0 "AS.42 47/32"
 ITA_armored_effort_desc:0 "Воювати в Ефіопії — це добре, але наші танки просто не відповідають стандартам, необхідним для боротьби з занепадаючими, але все ще потужними плутодемократичними країнами Європи."
 ITA_army_leaders:0 "Керівництво армії"
 ITA_ascari:0 "Аскарі"
 ITA_battaglioni_d_assalto_desc:0 "Наші чорносорочники продовжують горду традицію штурмових загонів часів Великої війни. Інтегрувавши їх до складу нашої армії, ми надамо їм потужного наступального удару в бою."
 ITA_befriend_portugal_desc:0 "$ITA_portugal_friend_desc$"
 ITA_bop_revoke_the_lateran_treaty:0 "£BoP_right_texticon Скасувати Латеранський договір"
