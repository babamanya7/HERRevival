 backhand_blow_desc:0 "Замість того, щоби боротися за кожен клаптик землі, в основному можна ігнорувати вклинювання ворога доти, доки він не просунеться занадто глибоко — тоді його можна відрізати і знищити в ході контрнаступу."
 baltic.7.a:0 "[Root.GetName] стоїть пліч-о-пліч зі своїми побратимами."
 baltic.7.d:0 "Після підписання договору про дружбу між нашими країнами [From.GetName] звернулася до держави [Root.GetName] з проханням приєднатися до альянсу [From.GetFactionName], щоб об'єднатися проти зростаючих загроз, які оточують наші країни. Незалежно від того, комуністична вона чи фашистська, [From.GetName] обіцяє відстоювати [Root.GetAdjective]і інтереси."
 ban_fascist_party:0 "Заборонити фашизм"
 basic_secondary_battery_desc:0 "Невеликі знаряддя, що встановлюються всередині корпусу, дають додатковий захист від малих кораблів, але мають дуже обмежені кути наведення.\n\nУстановка модуля §YДопоміжна батарея§! дає §Yкрейсеру§!, §Yавіаносцю§! або §Yважкому кораблю§! обмежену можливість §Yобстрілу з легких знарядь§! і дозволяє йому атакувати в бою другу мету."
 bba_news.102.desc_guilty:0 "Можливо, ні для кого не стало несподіванкою, що колишній лідер Італії був визнаний винним за всіма звинуваченнями. Колишній дуче не визнав себе винним, але був засуджений до довічного ув'язнення. Можна лише припустити, що нова влада вплинула на судовий процес і, мабуть, задоволена його результатом."
 bba_news.201.b:0 "Союзникам не можна довіряти."
 benghazi_oil_developed:0 "Розвинуто нафтові родовища в Бенгазі"
 between_the_seas_goal_desc:0 "Створивши міцну стіну союзної території, від Чорного до Балтійського моря, ми зможемо протистояти будь-якій потенційній загрозі."
 bftb_bulgaria_balkan_federation.11.desc:0 "[FROM.GetAdjectiveCap]ий уряд відмовився вступати в Об'єднану балканську федерацію, але бажає зберегти альянс наших народів. \nПри цьому [FROM.GetLeader] публічно заявляє, що реакція болгар на відмову [A покаже, чи справді Болгарія прагне до єдності балканських країн незалежно від їх членства у федерації або просто прагне без міри розширити власні межі."
 bftb_bulgaria_balkan_federation.7.t:0 "[FROM.GetNameDefCap] вимагає промислову допомогу"
