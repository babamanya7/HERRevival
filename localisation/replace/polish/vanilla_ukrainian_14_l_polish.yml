 WW_hungary.109.t:0 "[FROM.GetLeader] дозволяє коронацію Герінга"
 WW_hungary.26.desc:0 "[FROM.GetLeader] звернувся до нас після візиту до нашої великої столиці, заявивши, що виступає від імені всього [FROM.GetAdjective] народу, і бажає об'єднати наші держави у військовий союз із метою подальшого розширення територій обох націй."
 WW_hungary.33.desc:0 "Мудре керівництво [FROM.GetNameDef] погодилось на коронування монарха з династії Габсбургів згідно з нашими вимогами й склало повноваження на користь нового короля. Новий світанок постає над нашою імперською федерацією!"
 WW_hungary.47.desc:0 "Імператор [FROM.GetLeader] з [FROM.GetNameDefCap] вимагає відновлення правління Габсбургів на наших землях, як було передбачено Актом 5 листопада. Це дозволить нам приєднатись до їхнього альянсу без повної втрати незалежності."
 WW_hungary.66.desc:0 "Імператор [FROM.GetLeader] із [FROM.GetNameDefCap] вимагає повернення правління Габсбургів, як це було до розпаду Австро-Угорської імперії. Вони обіцяють більше автономії у межах Троїстої монархії. Що скажемо?"
 WW_hungary.7.b:0 "Так прийдіть і заберіть!"
 WW_hungary.74.a:0 "Вони пожалкують про це!"
 WW_hungary.82.a:0 "Вони за це поплатяться"
 WW_hungary.87.a:0 "Вони бажані союзники"
