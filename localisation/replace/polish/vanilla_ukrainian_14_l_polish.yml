 EST_events.901.a:0 "Як несподівано!"
 EST_fight_vaps_decisions_desc:0 "Руху вапсів необхідно протидіяти, якщо ми хочемо досягти успіху в боротьбі з ними. Дії, спрямовані проти вапсів, різко зменшать їхній вплив у нашій країні і зроблять їхнє насильницьке витіснення ще більш плавним."
 EST_fortify_the_border_desc:0 "Ми зустрінемо наших ворогів на кордоні і віритимемо, що наші брати в Латвії та Литві вистоять. Як би не був амбіційний цей план, ми мусимо не більше віддавати ні п'яді землі ні радянській, ні німецькій окупації."
