 GOE_RAJ.7.desc:0 "У своїх зусиллях здобути незалежність для [GetRajName] націоналістичний лідер Чандра Бос звернувся до нас із пропозицією дестабілізувати [GetRajAdjective] континент. Якщо ми погодимося, нас покличуть допомогти у поваленні імперської окупації [GetRajAdjective], коли настане слушний час."
