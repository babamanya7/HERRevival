 south_american_news.12.a:0 "Я би такий хід не робив."
 south_american_news.51.a:0 "Більшовицькі зрадники отримали те, на що заслуговували."
 south_american_news.60.a:0 "Чи знайде Бразилія коли-небудь мир?"
 south_american_news.7.b:0 "Нарешті ми вільні від кайданів імперіалізму!"
 south_american_news.9.t:0 "Повстання парагвайських офіцерів розбито"
 soviet.12.a:0 "Ми чекали, що вони будуть опиратися..."
 soviet.16.d:0 "Верховна Рада СРСР отримала офіційний запит від тувинського парламенту на членство в Радянському Союзі. Вони будуть організовані як Тувинська автономна область у складі РРФСР."
 soviet.19.a:0 "Наразі ми приймемо перемир'я."
 soviet.2.a:0 "Добре спрацьовано!"
 soviet.24.a:0 "Чи підтримують Зінов'єв і його оточення зв'язки з Троцьким?"
 soviet.32.d:0 "Естонія не зможе опиратися силі Червоної армії. Якщо ми надішлемо їм вимогу прав на стоянку та контролю над прикордонними військами, ми зможемо по суті анексувати їх без війни."
 soviet.5.t:0 "Румунія відхиляє наші вимоги"
 soviet.72.desc:0 "Нелегітимна адміністрація держави [POL.GetName] відмовляється визнати владу комуністичної партії, демонструючи безглузду буржуазну зарозумілість. Ми не можемо дозволити цим дурням знову перетворити Польщу на плацдарм для фашистського вторгнення в державу [SOV.GetNameDef]. Це питання найвищої національної безпеки, щоби ми негайно повернули державу [POL.GetName] у сферу нашого впливу."
