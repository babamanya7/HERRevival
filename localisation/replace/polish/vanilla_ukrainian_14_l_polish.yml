 GER_HERMANN_GORING_WERKE_NAME:0 "Підконтрольна державі промисловість"
 GER_VICTORY_POINTS_11539:0 "Зиллайн"
 GER_abolish_price_controls_desc:0 "Заходи з контролю над цінами, запроваджені для стимулювання переозброєння, душать економіку. Скасування цих заходів може зменшити державні кошти, але дасть змогу людям розпочати новий бізнес і дати поштовх економіці."
 GER_advanced_panzer_research_desc:0 "Виділення ресурсів на дослідження та розробку передових танкових технологій дасть нам нові знання та проривні результати. Це посилить наші бойові можливості, зробить наші танки ще більш смертоносними."
 GER_aerodynamic_research_institute:0 "Аеродинамічний науково-дослідний інститут"
 GER_align_czechoslovakia:0 "Налагодити відносини з Чехословаччиною"
 GER_align_south_america:0 "Залучити Південну Америку"
 GER_alliance_with_portugal_desc:0 "Історично в нас були не найліпші стосунки з державою [POR.GetNameDef]. Однак, незважаючи на те, що ми були запеклими ворогами під час Великої війни, вони, здається, змінили свою думку. Підтримавши націоналістів в Іспанії, ми вважаємо, що у нас можуть бути ідеологічні подібності, і що ми можемо дійти згоди з [POR.GetAdjective]ою нацією."
 GER_ally_the_shade:0 "Альянс із тінню"
 GER_amerikabomber_junkers_flag:0 "§Y$GER_junkers_organization$§! призначено для розробки §YАмерікабомбера§!"
 GER_amphibious_mechanized_equipment_2:0 "Land-Wasser-Schlepper II"
 GER_anschluss_old:0 "Аншлюс"
 GER_backdoor_negotiations_desc:0 "Ми можемо спробувати обійти західне втручання в низькі землі, не нападаючи на всі з них, а замість цього спровокувати одну країну напасти на іншу, а потім приєднатися до однієї зі сторін, фактично розділивши старі нації в регіоні Великої Нідерландії."
 GER_baltic_membership:0 "Членство Балтії"
 GER_break_anglo_french_colonial_hegemony_ww_desc:0 "$GER_break_the_anglo_french_colonial_hegemony_desc$"
 GER_cannot_join_oppossing_civil_war_side_tt:0 "Ці персонажі не зможуть приєднатися до ворожої сторони у можливій §Yгромадянській війні§!:"
 GER_clamp_down_on_fascism_desc:0 "За останні роки стала остаточно зрозуміла деспотична та антироялістська природа нашого націонал-соціалістичного уряду. Ми мусимо докласти всіх зусиль, щоби поставити хрест на фашистській ідеології."
 GER_coal_liquidization_desc:0 "Німеччині не вистачає нафти. Ми мусимо подвоїти наші зусилля у галузі її синтезування."
 GER_construct_the_reichsautobahn_desc:0 "$GER_autobahn_desc$"
 GER_core_german_switzerland_tt:0 "Якщо [ROOT.GetnameDef] §Yне в фракції§! з [SWI.GetNameDef] і §Yповністю контролює§! [3.GetName], [847.GetName] та [151.GetName]:"
 GER_create_rustungsstab_desc:0 "Наші зусилля з оптимізації виробництва озброєнь виявилися успішними, але потрібні подальші вдосконалення! Створення Штабу озброєнь дозволило б нам розробити стратегію розподілу ресурсів і визначити пріоритети проєктів для збільшення виробництва озброєння."
 GER_cruiser_warfare_desc:0 "Наші легкі крейсери можуть бути кориснішими, ніж просто ескортами; ми мусимо відправити їх у відкрите море, щоби переривати конвої наших ворогів і підривати їхню промислову спроможність."
 GER_current_future_volkskommisariats_tt:0 "Усі поточні та майбутні §Yфолькскомісаріати§!:"
 GER_czech_friend_desc:0 "Чехи та словаки — це працьовиті народи, гідні пошани. Прикро, що їхні територіальні амбіції перетинаються з нашими, але ще не пізно налагодити дружні стосунки замість взаємної агресії."
 GER_defend_the_vaterland_desc:0 "Перед загрозою, що нависла над нашими кордонами, ми мусимо твердо стояти на захисті Фатерланду! Щоби захистити німецький народ, нам треба укріпити наші позиції та згуртувати наші війська — [ROOT.GetNameDef] вистоїть і переможе!"
 GER_division_britain_mech_tt:0 "§YМеханізована§! частина §YSS-Division Oliver Cromwell§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_latvia_mot_tt:0 "§YМоторизована§! частина §Y15. SS-Division§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_eastern_state_development:0 "Розвивати Східну Німеччину"
 GER_establish_the_skijager:0 "Заснувати Skijäger"
 GER_expand_the_reichsautobahn_south_desc:0 "Розширення мережі автобанів на південь стимулюватиме економічне зростання і розвиток регіону. Це також посилить наші військові спроможності завдяки швидкому перекиданню військ до Альп."
 GER_expand_ukraine_adminsitrative_area:0 "Розширити адміністративний округ України"
 GER_expatriate_the_communists_desc:0 "Нашій нації продовжує загрожувати комуністична зараза. Ми мусимо позбутися її: нехай прихильники комунізму знайдуть собі новий притулок."
 GER_experimental_rotorcrafts_desc:0 "Вкладаючись у передові розробки та розвиваючи нові технології, ми прагнемо розробити ранні прототипи, які революціонізують повітряну мобільність на полі бою. Ми прагнемо ефективно трансформувати можливості вертикального зльоту та посадки так званих «гелікоптерів»."
 GER_factories_for_resources:0 "Фабрики в обмін на ресурси"
 GER_fate_of_czechoslovakia:0 "$GER_end_of_czechoslovakia$"
 GER_first_vienna_award_GER:0 "Перший Віденський арбітраж"
 GER_first_vienna_award_desc:0 "Угорці стали одними з тих, хто найбільше постраждав у Великій війні. Після розпаду Австро-угорської імперії виявилося, що тепер багато угорців проживають на території інших держав, хоча ця земля здавна належала їхнім предкам. Ми могли б поліпшити відносини з угорцями, передавши їм низку територій Чехословаччини."
 GER_fourth_silesian_uprising_mission:0 "Сілезії повстає"
 GER_fuhrerprinzip_desc:0 "Фюрер очікує повної вірності від найближчого оточення, але ті, хто входить до числа його довірених осіб, мусять пам'ятати, що жоден із них не вартий більше від каміння, на якому стоїть. Один-єдиний крок за межі дозволеного або нездатність діяти відповідно до волі фюрера може мати жахливі наслідки. Один лише фюрер визначатиме наш курс."
 GER_german_monarchy_democratic:0 "Королівство Німеччина"
 GER_german_socialist_union_communism_DEF:0 "Німецький соціалістичний фольксуніон"
 GER_heavy_tank_destroyer_equipment_3_short:0 "Jagdtiger"
 GER_housing_developments_desc:0 "Ми можемо оживити нашу економіку, запустивши програму розвитку житлового будівництва, спрямовану на реконструкцію та створення сучасних будинків і встановлення нового рівня життя."
 GER_infantry_equipment_3:0 "MP 43"
 GER_integrate_war_economies_tt:0 "Якщо §Y[HUN.GetName]§! та §Y[Root.GetName]§! — союзники, вони отримають по §Y4 військові заводи§!, а §Y[HUN.GetName]§! стане маріонеткою держави §Y[Root.GetName]§!.\n"
 GER_integration_of_puppet_economies:0 "Інтеграція маріонеткових економік"
 GER_invest_in_vereinigte_stahlwerke:0 "Вкластись у Vereinigte Stahlwerke"
 GER_is_forming_hre_without_victoria:0 "Велич нашої влади не знає меж, так само як і кордони нашої держави. Тепер коли вони розширилися до меж колишньої Священної Римської імперії, і країни, що стояли на нашому шляху, більше не в змозі протистояти нашій владі. Відтепер проголошено, що наша держава повинна стати духовною спадкоємицею Священної Римської імперії. Aquila Elegit Iovis Omnia Vincit!"
 GER_low_countries_membership_desc:0 "Нехай країни Бенілюксу знаходяться далеко від східних кордонів Європи, вони добре розуміють: якщо Центральна Європа впаде, вони будуть наступними. Ми запропонуємо їм членство в союзі та можливість разом протистояти комуністичній загрозі."
 GER_mio_trait_experienced_manufacturer:0 "Досвідчений виробник"
 GER_mio_trait_high_test_peroxide:0 "Висококонцентрований пероксид водню"
 GER_no_reds_in_western_europe_desc:0 "Вплив комунізму проникає у Західну Європу. Ми не можемо цього допустити, а тому маємо знищити загрозу перш, ніж вона пустить коріння."
