 PER_a_modern_iran:0 "A Modern Iran"
 PER_a_modern_iran_desc:0 "After all this effort into modernizing, we can finally be said to stand proud and strong among other nations."
 PER_consolidate_british_territory_desc:0 "Надто довго [ENG.GetNameDef] мала присутність на Близькому Сході; місце, якому вони справді не належать. Тепер, коли ми боролися за незалежність, давайте зробимо те саме для інших націй у цьому регіоні та забезпечимо їхній захист нами, замість того, щоб ними правив [ENG.GetNameDef]."
 PER_construct_naval_bases_desc:0 "Наш поточний військово-морський потенціал нижчий, ніж нам хотілося б. Щоб збільшити його, ми повинні побудувати більше верфей уздовж наших двох узбереж, які можуть забезпечити розгортання військових кораблів."
 PER_establish_cells_tt:0 "§RВартість політичної сили для захоплення держав після цього зросте на [?ROOT.PER_opposition_increment_cost].§!"
 PER_expand_tehran_armor_desc:0 "Оскільки «Тегеран Армор» працює над виробництвом нових танкових конструкцій для наших військових зусиль, було б мудрим рішенням прискорити цей процес шляхом швидкого розширення їхніх виробничих потужностей. З більшою кількістю виробничих площ, присвячених будівництву нашої бронетехніки, ми зможемо швидше виводити танки на поле."
 PER_first_iranian_empire_desc:0 "Реза-шах Пехлеві завжди віддавав перевагу тому, щоб його націю називали [PER.GetNameDef], і саме він відновив цю назву як офіційну назву нації у 1935 році. Таким чином, основою його нових імперських прагнень буде створення абсолютно нової Іранської імперії, замість того, щоб безпосередньо наслідувати попередніх Персів."
 PER_foreign_policy_events.2.desc:0 "Наші спроби вирішити наші невирішені проблеми з [FROM.GetNameDef] дипломатичним шляхом, здається, провалилися. Коли наш посол звернувся до [FROM.GetLeader] для чергового раунду переговорів, йому різко відповіли, що [FROM.GetAdjective]s чітко висловили свою позицію, і що більше немає про що говорити."
 PER_form_oil_company:0 "Створити власну нафтову компанію"
 PER_great_persian_empire_DEF:0 "Велика Перська імперія"
 PER_imperial_events.12.c:0 "Це все надто ризиковано. Припинити переговори."
 PER_imperial_events.130.a:0 "Так, це здається прийнятним"
 PER_imperial_events.210.t:0 "[FROM.GetName] вимагає наших прикордонних територій!"
 PER_imperial_events.3.a:0 "Прикрий поворот подій..."
 PER_imperial_events.50.desc:0 "Сьогодні вдень у центрі Тегерана пролунали постріли, коли під час промови до нації Реза-шах Пехлеві ледь не був уражений кулею в результаті невдалої спроби вбивства. Злочинців негайно затримали, і ними виявилися офіцери [PER.GetAdjective] армії, які були незгодні з керівництвом шаха. Шах використав цю спробу замаху як спосіб згуртувати народ навколо своєї справи."
 PER_imperial_events.60.a:0 "Ми згодні. Так буде краще."
 PER_imperial_funded_universities_desc:0 "Намагаючись довести, що [PER.GetNameDef] здатний стояти серед великих гігантів цього світу, шах пожертвував велику суму грошей на фінансування університетів країни. Завдяки цьому щедрому дару наш народ матиме більший доступ до якісної вищої освіти."
 PER_increase_oil_sales_desc:0 "Оскільки ми вже співпрацюємо з [ENG.GetNameDef] щодо наших нафтових запасів, має сенс використовувати наші нововидобуті ресурси та збільшити обсяг продажів їм. Це взаємовигідна угода, зрештою."
 PER_islamic_revolution_events.1.a:0 "Ми повинні бути обережними з тим, як ми діємо."
 PER_military_excellency_desc:0 "Коли справа доходить до переможної армії, сила, яка є найбільш добре навченою, обов'язково вийде на перше місце. Завдяки суворому та жорсткому навчанню, чудовому обладнанню та нестримній тактиці, давайте доведемо світові, що [PER.GetAdjective] армія — це сила, з якою слід рахуватися."
 PER_root_out_conspiracies:0 "Викорінити змови"
 PER_send_weapons_to_kurds:0 "Поставити зброю курдам у [FROM.OWNER.GetName]"
 PER_spoils_of_war:0 "Військова здобич"
 PER_state_atheism_desc:0 "У сучасній [PER.GetNameDef] нам не потрібно, щоб релігія відігравала таку велику роль, як раніше. Замість того, щоб включати її в наше повсякденне життя, ми повинні заохочувати форму атеїзму серед нашого населення, що дозволить нам зосередитися на наших ініціативах з модернізації. Однак це, безумовно, засмутить наше духовенство, що займає високе становище."
 PER_strike_first_tt:0 "Просування цією гілкою §Rзавадить вам§! прийняти будь-які інші фокуси §YСаадабадського пакту§!!"
 PER_subserviant_to_noone:0 "Ми нікому не підкоряємося"
 PER_ultra_nationalists:0 "Націоніалісти"
 PHI_10_year_training_plan:0 "10-річний план підготовки"
 PHI_american_intervention_forbid_advisor:0 "Вислати комуністичного радника"
 PHI_battalion_combat_teams:0 "Батальйонні бойові групи"
 PHI_conquest_of_japan_desc:0 "Японія довго була нашим головним конкурентом у плані морського контролю в цьому регіоні, тож настав час покласти край цій конкуренції та встановити наше панування над ними раз і назавжди."
 PHI_convoys_for_trucks:0 "Звернутися до [FROM.GetNameDef] з пропозицією обміняти наші конвої на вантажівки"
 PHI_encourage_gold_exports_desc:0 "Ми зараз переживаємо золоту лихоманку, і вона не могла прийти в кращий час. Наша внутрішня пропозиція повністю насичена, на щастя, світ жадає золота. Населення світу, що виходить з Великої депресії, прагне більш відчутних символів власного багатства, а немає нічого більш відчутного, ніж зливки золота."
 PHI_fast_attack_craft_desc:0 "Ідеальною еволюцією патрульного катера є швидкісний ударний катер. Маючи значно покращену швидкість і вогневу міць, ці судна можуть кружляти навколо наших берегів і нести загибель нашим ворогам, які підійдуть занадто близько, а потім втекти, перш ніж надійде допомога."
 PHI_filipino_repatriation_act:0 "Закон про репатріацію філіппінців"
 PHI_hispanic_empire_tag_communism:0 "Гіспанський союз"
 PHI_japanese_observers_desc:0 "Оскільки відносини між нами стають дедалі тіснішими, японці погодилися надіслати військовий загін до нашої країни. Це робиться для того, щоб вони могли з перших рук дізнатися, як функціонують командні структури європейського зразка в дружній обстановці, тоді як ми можемо повчитися в них виняткової бойової майстерності і тим самим передати цю мудрість нашим військам."
 PHI_makapili_desc:0 "Зростання фашизму всередині філіппінської нації було стрімким, і це, на жаль, супроводжувалося певним хаосом. Наші друзі за кордоном запропонували зброю та навчання для створення «Армії миру» для підтримання порядку, боротьби з бандитизмом та придушення заколотів."
 PHI_manila_tag_war_communism_ADJ:0 "$PHI_manila_tag_communism_ADJ$"
 PHI_philippine_military_academy_desc:0 "Роками Академія філіппінського констеблярства слугувала центральною школою підготовки офіцерів у нашій країні, але нам бракувало офіційного місця військової освіти. Ми повинні включити цю установу до складу армії та офіційно визначити її як нову Філіппінську військову академію, присвячену освіті та розвитку військової еліти завтрашнього дня."
