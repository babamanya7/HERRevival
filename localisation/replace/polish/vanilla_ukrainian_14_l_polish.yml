 SWI_armed_neutrality:0 "Озброєний нейтралітет"
 SWI_build_naval_bases_tt:0 "Додати §Y2 морські бази§! до кожної існуючої §Yмооської бази§! (максимум 15)."
 SWI_case_north_desc:0 "Ми не можемо виключити війну проти [?SWI.SWI_biggest_fascist.GetNameDef], ми повинні бути до неї готові. Треба розробити плани, виділити припаси, вирити окопи, озброїти солдатів."
