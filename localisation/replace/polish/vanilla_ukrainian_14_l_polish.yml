 DEN_adjust_industrial_prioritize:0 "Коригування промислових пріоритетів"
 DEN_align_industries_desc:0 "Потреба в ефективному розподілі ресурсів і цілеспрямованому промисловому виробництві стала першочерговою. Координуючи наші зусилля та оптимізуючи виробництво, ми забезпечимо, щоб кожна фабрика, кожен працівник і кожен ресурс використовували свій потенціал на повну потужність для досягнення наступних цілей [DEN.GetNameDef]."
 DEN_annexation_low_range:0 "Низький вплив володаря"
 DEN_bop_expand_the_welfare:0 "£BoP_left_texticon Розширити систему соціального забезпечення"
