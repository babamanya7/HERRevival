 PAR_union_nacional_revolucionaria_desc:0 "Наша нова партія стане єдиною легальною партією в країні. Новий початок Революційного національного союзу, в якому влада та інститути країни походять від партійного керівництва."
 PEACE_BIDDINGS_POPUP_DESCRIPTION:0 "Ваша вимога ($BIDNAME|Y$) була £peace_conf_icons|3 §Rоспорена§!, оскільки на цю територію претендує інша держава. Пред'явіть нову вимогу, щоби зберегти претензії на територію, або відмовтеся від них. \nОскаржені претензії не вважаються такими, що входять до списку ваших вимог. Якщо ви не оновите цю вимогу, вона не буде включена до списку задоволених вимог."
 PEACE_BIDDINGS_POPUP_FORFEIT:0 "Відмовитися"
 PEACE_BIDDINGS_POPUP_REFUNDED_SCORE_TOOLTIP_DELAYED:0 "У разі заперечення ваших вимог більшість витрачених вами на них балів буде повернуто. При цьому чим довше заперечується вимога, тим більше знижується відсоток повернення. Це стосується всіх сторін думки."
