 SPR_political_arrest_desc:0 "Наші політичні вороги вдаються до вбивств, щоби донести свою думку до людей. Ми не можемо з цим миритися — винні мають бути притягнуті до відповідальності!"
 SPR_secularize_the_new_state_desc:0 "У новому суспільстві, яке ми будуємо, немає місця для релігії. Вони служать лише для зміцнення класових структур або заспокоєння робітників до покори. Лише звільнивши свій розум від цих забобонів, ми зможемо бути справді вільними."
