 FACTION_EXECUTE_BALANCED_DESC:0 "Діють стандартні правила виконання бойових планів. Підрозділи намагатимуться просуватися таким чином, щоб лінія фронту залишалася якомога коротшою, і можуть атакувати укріплені місця.\n\n§gЗверніть увагу, що це вплине лише на союзні підрозділи, керовані ШІ, в межах театру, а не на будь-які підрозділи, керовані гравцем.§!"
