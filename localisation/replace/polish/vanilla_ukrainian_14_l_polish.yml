 ensure_marshal_loyalty_for_fascist_civil_war_desc:0 "Може бути, певні фельдмаршали таємно висловлюються на користь фашизму. Ми мусимо підступити до них і забезпечити їхню вірність на випадок, якщо почнеться боротьба."
 escort_carrier_desc:0 "Менший і дешевший авіаносець, який зазвичай використовується для супроводу конвоїв та протичовнової оборони, а не для безпосередніх бойових дій у складі флоту. Він має на борту невелику, але корисну авіаційну групу."
 escort_patrols:0 "Патрулі супроводу"
 excavation3_desc:0 "Останні досягнення в галузі геології допомагають нам виявляти запаси ресурсів. Тепер ми можемо зосередити наші зусилля в тих районах, де велика можливість знайти велике скупчення природних копалин."
