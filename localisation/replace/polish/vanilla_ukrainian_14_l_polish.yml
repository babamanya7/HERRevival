 GER_subduing_the_baltic_states_desc:0 "Балтійські держави є нелегітимними утвореннями, що претендують на території нашого Об’єднаного Балтійського Герцогства. Ми повинні їх підкорити та передати ці землі балтійсько-німецькій аристократії."
