 SOV_build_national_academy_of_sciences_integrated_republic_KAZ_desc:0 "Ми збудуємо [KAZ.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_carry_revolution_east_decision_tt:0 "Відмикає рішення §YОрганізувати п'яту колону§! та §YРозбурхати пролетаріат§! для азійських сусідів."
 SOV_claim_on_sinkiang_threat:0 "Радянці висунули претензії на Сіньцзян"
 SOV_claims_in_baltic_desc:0 "Колись країни Балтії були неподільною частиною Росії. Їхні народи потребують захисту великої держави, яка може захистити їх від експлуатації. Якщо країни Балтії не погодяться на ці умови, нам, можливо, доведеться вдатися до сили, щоб забезпечити свій захист."
