 EST_events.102.d:0 "Як не намагається [Root.GetLeader], схоже, що [From.GetNameDef] залишається ворогом державі [Root.GetNonIdeologyName]. На перший погляд, така відмова незначна, але можливо, що у випадку майбутнього [SOV.GetAdjective] вторгнення [From.GetNameDef] не допомагатиме, а лише байдуже спостерігати."
