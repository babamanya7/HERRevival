 sp_land_flamethrower_tank_desc:0 "Броньована машина, оснащена нищівною на близькій відстані вогневою міццю, призначеною випускати потоки полум'я на ворожі позиції."
 sp_land_generic_reward_armor_bonus_3:0 "Поліпшені сплави для броні"
 sp_land_reward_land_cruiser_track_desc:0 "Вага техніки перевантажила ходову систему, що призвело до постійних поломок під час випробувань проєкту «[SpecialProject.GetName]». Варіанти — посилити гусениці, що вимагатиме значної переробки, або зменшити броню транспортного засобу, щоби зменшити навантаження."
