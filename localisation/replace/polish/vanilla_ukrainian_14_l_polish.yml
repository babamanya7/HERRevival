 YUG_defence_army_of_yugoslavia:0 "Армія оборони Югославії"
 YUG_enforced_neutrality_desc:0 "Ми не можемо допустити, щоб Балкани стали частиною цього гострого глобального конфлікту. Ми повинні проголосити свій нейтралітет і уникати будь-яких дій, які могли б звести нас на один із ворогуючими світовими державами."
 YUG_federal_defense_council_desc:0 "Усі регіони повинні мати голос на захист нашої великої нації. Це значною мірою допоможе гарантувати, що якомога більше голосів буде почуто, і що дискримінація не зупинить заслуги в зародковому стані."
 YUG_greater_yugoslavia_desc:0 "Ми не можемо заспокоїтися, поки всі південні слов'яни не об'єднаються під нашим прапором. Можливо, болгари не вважають себе частиною нашої нації, але ми точно вважаємо себе частиною нашої нації."
 YUG_guarantee_religious_liberties_desc:0 "Усім має бути дозволено сповідувати обрану релігію. Для цього ми запровадимо правові гарантії."
