 FRA_anti_tank_equipment_1:0 "Canon de 25 mm SA mle 1934"
 FRA_anti_tank_equipment_3:0 "Canon de 76 mm modèle 1943"
 FRA_army_of_aggression:0 "Агресивна армія"
 FRA_army_of_aggression_desc:0 "Ми більше не можемо сидіти за застарілою стіною, поки наші вороги заправляють балом у всій Європі. Настав час зміцнювати армію і розширювати свої межі. Франція має залишатися великою державою."
 FRA_autonomy_collaboration_government:0 "$OVERLORDADJ$а $NONIDEOLOGY$"
 FRA_begin_rearmament:0 "Почати переозброєння"
 FRA_begin_rearmament_desc:0 "20-річне перемир'я, яке передбачив маршал Фош у 1919 році, швидко добігає кінця, і в найближчі кілька років світ має дедалі більше шансів вибухнути війною. Ми мусимо бути готові."
 FRA_capital_ship_focus:0 "Акцент на основні кораблі"
 FRA_cas_focus_desc:0 "Підтримка кораблів та наземних військ із повітря стала ефективним доповненням військової стратегії та обійшлася порівняно недорого. Тепер з'явилися пропозиції щодо поліпшення цих літаків. Нехай наші інженери займуться розробкою нового покоління штурмовиків."
 FRA_coup_in_indochina_flag:0 "Підготувати переворот в Індокитаї"
 FRA_indochina_intervention.3.a:0 "Багато зусиль, але мало результатів."
 FRA_invite_communist_ministers:0 "Запросити комуністичних міністрів"
 FRA_jet_fighter_equipment_1:0 "Dassault Ouragan"
 FRA_join_comintern_desc:0 "Вороги оточують з усіх боків, і нам потрібні надійні союзники. Ми зміцнили зв'язки з Комінтерном, тепер настав час беззастережного об'єднання."
 FRA_light_cruiser_4:0 "Клас «Colbert»"
 FRA_medium_tank_destroyer_equipment_2_short:0 "SAu 40"
 FRA_national_uprising_desc:0 "Час настав. Зараз настав час взяти зброю і вийти з тіні, яка прикривала вас протягом багатьох років!"
 FRA_nav_bomber_equipment_2:0 "SNCAO CAO.600"
 FRA_orleanist_restoration_desc:0 "Орлеанський дім користується значною підтримкою серед роялістів у Франції. Хоча деякі недоброзичливці вважали за краще іншого кандидата на престол, можна не сумніватися, що орлеанський спадкоємець має найкращі шанси мирно об'єднати країну, яка стоїть за ним.."
 FRA_polish_guarantee:0 "Гарантія Польщі"
 FRA_reorganize_aviation_industry_south_east:0 "Реорганізувати авіаційну промисловість на південному сході"
 FRA_review_foreign_policy_desc:0 "Континентальний порядок, встановлений у 1919 році, стає все більш загрозливим. Настав час переглянути наші варіанти зовнішньої політики, щоб убезпечити нові союзи, щоби подолати майбутній шторм."
