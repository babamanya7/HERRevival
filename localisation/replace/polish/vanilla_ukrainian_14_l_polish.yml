 ENG_soviet_cooperation_desc:0 "Хоча у нас є відмінності, у нас також є спільний ворог. Ми запропонуємо атакувати з обох боків, розчавивши німців до того, як вони зрозуміють, що сталося."
 ENG_support_imperialist_coup_in_new_zealand_desc:0 "Настав час підтримати лоялістів у Новій Зеландії, які готуються розпалити повномасштабну громадянську війну."
 ENG_take_out_the_regia_marina_desc:0 "Настав час подбати про загрозу в Середземному морі. Ми убезпечимо судноплавні шляхи, що проходять через життєво важливий для нашої імперії Суецький канал, ліквідувавши флот, який його перекриває."
