 ITA_caligulas_pride_desc:0 "Настав час розробити найбільший військовий корабель, який коли-небудь існував. Наші найліпші військово-морські інженери вдосконалювали дизайн та випробовували прототипи, і тепер певні, що «Neptunus» стане королем не тільки Середземного моря, а й інших морів."
 ITA_carica_di_isbuscenskij_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_cavalry_attack_factor$: §G+3.00%§!\n$modifier_army_sub_unit_cavalry_speed_factor$: §G+3.00%§!\n$modifier_unit_cavalry_design_cost_factor$: §G-25.00%§! \n$modifier_unit_camelry_design_cost_factor$: §G-25.00%§!\n\n"
 ITA_carrier_2_desc:0 "«Falco» — гіпотетичний клас міжвоєнних італійських авіаносців. Їх можна було порівняти з американськими авіаносцями класу «Yorktown» і британським авіаносцем «Ark Royal». Вони мали водотоннажність близько 21 000 тонн, пристойну броню і середній склад літаків."
