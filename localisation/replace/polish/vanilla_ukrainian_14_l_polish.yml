 special_forces_desc:0 "У нас є потреба в силах спеціальних операцій. Гірська та десантна піхота для нас — в пріоритеті."
 special_forces_paratroopers_desc:0 "Немає нічого більш жахливого, ніж небо, що темніє від погляду тисячі транспортних літаків, наповнених військами. Наша доктринальна філософія повинна скористатися шоком і трепетом, які вселяє повітряний десант."
 stability.21.d:0 "Нам слід арештовувати кожного, кого впіймали на ухилянні!"
 stability.35.t:0 "591-ий штрафний батальйон"
 stability.37.desc:0 "\"Of course I want to live. I want to go and finish school, I want to meet girls, I want to start a family - but if we lose this war, I won't be able to do these things, either. So I fight.\"\n\nThe letter, sent anonymously to every major newspaper in the country, has made huge waves. Claiming to be from a soldier who at first tried to avoid the draft, but then realized that he must fight to save his country, it has apparently struck a nerve with many others who felt similarly. Draft boards across the country report that the number of people who still refuse to answer their summons has been more than made up for by new volunteers who will no longer wait until they are called, while others go and fight to save their country and their way of life."
 stability.38.desc:0 "\"They led him to the wall at the break of dawn. He refused a last cigarette, but accepted the blindfold. His last words were an apology to his mother for causing her so much pain. The firing squad aimed well. A few minutes later, the doctor present declared him dead.\"\n\nWhile unable to catch all people who have been evading the draft, authorities have been able to make a number of arrests. Given the grave situation we are in, the War Office has decided that these men be tried under military law for failing to report to duty. The first series of death sentences has been handed down and the condemned have been excuted by firing squad. These measures have evidently had the desired effect. It appears that most people decided to choose the possibility of death on the battlefield over the certainty of dishonorable death as a coward."
 stability.39.t:0 "Мученик миру"
 steal_blueprints_steal_prototype:0 "Вкрасти прототип"
 strategic_destruction_tree:0 "Доктрина стратегічного знищення"
 strikes_event.2.desc:0 "Moving quickly, Military High command mobilized a number of training units for service and formed ad-hoc groups of soldiers on leave. Moving these formations to the affected cities proved a lot more difficult than expected, however, as the strikers blocked railway lines and forced the troops to march in on foot, giving them ample time to prepare. When our troops reached the barricaded factories, they found the strikers ready for them. Attempts to clear roads were met with furious attacks by the workers throwing stones and bottles at the soldiers.\n\nIn several instances, the troops opened fire to defend themselves, killing a number of strikers and wounding scores more. this only enraged the mob even further, with screams of \"Murderers!\" filling the air from bystanders. The mood in the capital turned dramatically in favor of the strikers. At nightfall, the soldiers retreated, leaving the barricades intact.\n\nThere have been no further attempts to force the situation. The strikers remain in control of the factories, and no work is being done."
 strikes_event.5.desc:0 "[Root.GetLeader] today announced some small changes to the draft. While skilled workers were previously exempted from the military draft, this exception has now been removed and all exempt men drafted immediately. At the same time, the War Office has been authorized to take direct control of any factory that produces goods relevant to the war effort if the leadership of those factories has shown a lack of ability.\n\nThe announcement was met with great laughter in the affected cities, especially once it was announced that anyone resisting would be treated the same as a soldier who refused to follow orders. Policemen sent to deliver draft notices to workers were told to come back with more than ink on paper."
 sub_stealth_upgrade_desc:0 "Найбільша сила підводного човна полягає в його здатності залишатися непоміченим і завдавати удару лише тоді, коли вона має перевагу."
 submarine_4_desc:0 "Сучасні субмарини використовують новітні розробки в області двигунів і озброєння, мають оптимальні обводи і здатні занурюватися на велику глибину."
 submarine_fleet_operations_long_range_patrol_schedule:0 "Графік далекобійного патрулювання"
 success_modifier_INS_marine_modifier_improvement:0 "- Використовувати §YБатальйони морської піхоти§!"
 success_modifier_air_defence:0 "§Hпротиповітряний захист§! юніта"
 success_modifier_organisation_negative:0 "низька §Hорганізація§! юніта"
 super_heavy_armor_desc:0 "Надважкі танки жертвують мобільністю та швидкістю заради вогневої потужності та броні, що перевершують показники стандартних важких танків."
 super_heavy_tank_destroyer_equipment_1_desc:0 "$super_heavy_tank_destroyer_equipment_desc$"
 tactic_backhand_blow:0 "Удар у тил"
 tank_designer_land_cruiser_role_disallowed:0 "Установіть модуль, який дозволяє роль §Hсухопутного крейсера§!, щоби могти змінити її."
 targeted_sabotage_burn_storage_outcome:0 "Загін підпалив місцеві склади, знищивши сотні тонн ресурсів, що зберігаються там, і сильно підірвавши здатність противника до створення запасів."
 targeted_sabotage_immobilize_rolling_stock_outcome:0 "Загін проник у залізничне депо та зіпсував кілька одиниць рухомого складу. Ефект від диверсії проявиться лише після пари кілометрів пробігу, після чого будуть заблоковані шляхи."
 targeted_sabotage_plant_explosives_outcome:0 "Загін заклав вибухівку і обрушив будівлю. За повідомленнями, шкода, завдана технікою, невелика, але все ж таки потрібен час, щоб її усунути."
 tech_military_police3_desc:0 "Співпрацюючи з місцевими агентурними мережами та інформаторами, запровадженими до початку окупації, наша військова поліція зможе заздалегідь дізнаватися про акції опору, що готуються."
 tfv_australia.33.d:0 "Побачивши очевидні переваги транстихоокеанського партнерства, держава [From.GetNameDef] погодилася на нашу пропозицію регіонального альянсу."
 tfv_australia.62.t:0 "[From.GetNameDefCap] намагається зірвати революцію"
 tfv_canada.61.t:0 "Доля здійснилася"
 tfv_canada.71.a:0 "Прекрасно!"
 tfv_new_zealand.2.t:0 "Членство в Комінтерні прийняте"
 tfv_new_zealand.6.a:0 "Грубо."
 tfv_new_zealand.9.b:0 "Острови занадто цінні."
 tfv_new_zealand.9.desc:0 "Держава [From.GetNameDef] спрямувала дипломатичний запит до держави [Root.GetNameDef] з проханням передати контроль над своїми тихоокеанськими володіннями. Посилаючися на тісні стосунки свого уряду з власним народом маорі, [From.GetAdjective]і міністри стверджують, що вони мають розуміння та глибокі особисті стосунки з тихоокеанськими народами, які дадуть їм відчуття приналежності і заохотять їх боротися за справу альянсу [From.GetFactionName]. Багато хто вважає, що [From.GetLeader] має амбіції перетворити державу [From.GetNameDef] на щось на кшталт об'єднаної полінезійської держави. Чи принесе це користь державі [Root.GetNameDef], ще належить визначити."
 tfv_raj.33.desc:0 "Субгас Чандра Бос намагався переконати [SOV.GetAdjective]ий уряд допомогти нашій боротьбі, але його зусилля не увінчалися успіхом. Після кількох днів очікування на розмову з лідером [SOV.GetLeader], він отримав шанс на зустріч, яка тривала заледве десять хвилин.\n\nХоча [SOV.GetLeader] висловив велике захоплення революційною боротьбою нашого народу, він також дав зрозуміти, що не вважає нашу країну готовою до наступного кроку на шляху до повного комунізму."
 tfv_raj.40.b:0 "$tfv_raj.30.b$"
 tfv_raj_focus_paratrooper_tt:0 "Десантники з §HBattaglione Azad Hindoustan§! будуть розміщені в Італії."
 tfv_south_africa.14.b:0 "$tfv_south_africa.13.b$"
 tfv_south_africa.42.d:0 "Після кількох стадій переговорів [SOV.GetAdjective]а делегація пішла, зіславшися на сумніви в нашій здатності тримати їхні дослідження в таємниці. Схоже, нам не дозволять ділитися технологіями з нашими союзниками."
 tfv_south_africa.62.a:0 "$tfv_south_africa.60.a$"
 tfv_south_africa.63.b:0 "$tfv_south_africa.60.b$"
 tfv_south_africa.69.d:0 "Звільнившися з-під влади колоніальних гнобителів, [TZN.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [TZN.GetAdjective]ого уряду."
 tfv_south_africa.79.t:0 "Свобода для держави [RCG.GetName]"
 tfv_south_africa.81.d:0 "Звільнившися з-під влади колоніальних гнобителів, [EQG.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [EQG.GetAdjective]ого уряду."
 tfv_south_africa.81.t:0 "Свобода для держави [EQG.GetName]"
 tfv_south_africa.85.d:0 "Звільнившися з-під влади колоніальних гнобителів, [NGA.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [NGA.GetAdjective]ого уряду."
 the_red_tide_goal_desc:0 "Солдати на землі — ось що має найбільше значення. Потрібна армія чисельністю десять мільйонів. Ось як насправді забезпечується виживання."
 the_winter_war:0 "Зимова війна"
 threat_from_red_sea:0 "Загроза з Червоного моря"
 threaten_japan_desc:0 "Щоб показати Японії серйозність наших намірів, ми мусимо утримувати потужний військовий флот у Перл-Харборі."
 threaten_org_member:0 "Пригрозити керівництву держави [FROM.GetName]"
 tiny_island:0 "Крихітний острів"
 tizard_mission_name:0 "Місія Тізарда"
 tokyo_arsenal:0 "Токійський арсенал"
