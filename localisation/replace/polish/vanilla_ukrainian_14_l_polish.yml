 HOL_BEL_autonomy_eu_member_DEF:0 "Європейські Нідерланди"
 HOL_EQUIPMENT_VERSION_3:0 "No. 3"
 HOL_GER_fascism_autonomy_colony_DEF:0 "Райхсланд Нідерланди"
 HOL_beginnings_of_a_dutch_blitzkrieg_tt_1:0 "Буде отримано §Yліцензію на виробництво§! найкращої моделі §Yсереднього танку§!, дослідженого наразі державою §Y[GER.GetNameDef]§!.\n"
 HOL_gateway_to_europe_decisions_tt:0 "Якщо держава [HOL.GetNameDef] поступиться нашим вимогам, ми отримаємо §Yполітичну владу§! у розмірі, що дорівнює кількості очок, вкладених усіма учасниками §Y«Ворота в Європу»§!. Наразі ця сума становить:\n"
 HOL_heavy_tank_equipment_2_short:0 "ZT-II"
 HOL_inundate_the_water_lines_desc:0 "Ретельно підготовлену Голландську водну лінію тепер потрібно затопити, щоби зупинити просування ворога — навіть якщо це завдасть шкоди сільській місцевості."
 HOL_light_cruiser_1_desc:0 "The Dutch commissioned two Java-class light cruisers in the mid-1920s. The ships were designed in Germany but constructed in the Netherlands. They displaced nearly 6,700 tons and had a main armament of ten 150mm Bofors guns. They were lightly armored and had decent speed for their vintage."
 HOL_maintain_trade_neutrality:0 "Зберігати торговий нейтралітет"
 HOL_medium_tank_artillery_equipment_3_short:0 "PTH-6"
 HOL_placate_the_british:0 "Задобрити Велику Британію"
 HOL_pre_empt_western_intervention:0 "Превентивна західна інтервенція"
 HOL_propose_benelux_unification_desc:0 "Наближаються глобальні потрясіння, а ми — малі народи серед великих. Щоб вистояти в бурі, що насувається, нам потрібно об'єднатися на всіх рівнях управління, навіть якщо при цьому доведеться позбутися власної незалежності."
 HOL_recall_conrad_helfrich_desc:0 "У ці скрутні часи ми повинні ставити батьківщину понад усе. Конрад Гелфріх, як найкращий адмірал Королівського флоту Нідерландів, має повернутися до Нідерландів."
 HOL_ship_armor_bc_1:0 "225-мм пояс/100-мм палуба"
 HOL_taog_guarantee_colonial_loyalty_tt:0 "§WГарантує, що в [INS.GetNameDef] не відбудеться революції.§!\n[INS.GetNameDefCap] спробує оголосити незалежність мирним шляхом. Це можна зупинити, завершивши фокус §Y$INSHOL_industrialized_colony$§!, який вимагатиме значних інвестицій в колонію."
 HOL_the_fourth_ally_desc:0 "Незважаючи на наш скромний початок, наш внесок незаперечний. Настав час стати четвертим союзником у війні проти фашистів — поряд з Великою Британією, США та Радянським Союзом."
