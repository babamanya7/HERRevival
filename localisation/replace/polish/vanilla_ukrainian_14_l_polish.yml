 SPA_the_army_of_africa_tt:0 "Із початком громадянської війни Ви отримаєте 5 добре тренованих частин із §Y7 піхотними§! та §Y2 артилерійськими§! батальйонами, §Yрозвідротою§! та §Yротою інженерів§!, а також гарантованим контролем над областю §Y[290.GetName]§!.\n"
 SPA_the_crusade_against_democracy_desc:0 "Лише законний спадкоємець карлістів був наділений самим Богом божественним правом правити. Демократія — це не лише образа короля, це також богохульство проти самої волі Бога. Не можна дозволити цій поразці більше існувати в цьому світі."
