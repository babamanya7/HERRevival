 SOV_seek_a_defense_pact_with_the_allies_target_fallback_caps:0 "Вони можуть"
 SOV_send_infantry_equipment_poum:0 "Надати гвинтівки та боєприпаси"
 SOV_shift_to_armaments_production_desc:0 "Війна назріває. Ми не знаємо, хто вдарить першим, але рано чи пізно ми опинимося під ударом. Ми мусимо готуватися до цього зараз, щоб бути готовими, коли прийде час."
 SOV_sinkiang_support_expansion_sik_desc:0 "Наші торгові агенти в державі [SIK.GetNameDef] вимагають більше політики для збільшення експорту в державу [ROOT.GetNameDef], тепер, коли територіальна експансія Сіньцзяну надала їм більше товарів для торгівлі."
 SOV_strengthen_the_mobilization_plan_desc:0 "Нашою найбільшою військовою перевагою завжди була величезна територія країни та кількість населення, що проживає в ній. Але коли справа доходить до відправки солдатів на фронт, ці дві речі можуть працювати один проти одного. Ми мусимо постійно вдосконалювати і оновлювати наші мобілізаційні плани, щоб у разі війни ми могли швидко сконцентрувати наші сили."
 SOV_submarine_warfare_ns_tt:0 "$SOV_modify_red_fleet_ns_intro$\n$SOV_the_red_fleet_submarine_1_bonus_tt$\n\n"
