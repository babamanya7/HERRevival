 LIT_iron_wolf_appeasement_desc:0 "Ми повинні докласти зусиль, щоби перешкодити діяльності «Залізного вовка» в нашій країні. Хоча жоден із цих заходів не викорінить їх повністю, ми можемо відкласти їхні зусилля достатньо довго, щоби знайти остаточне рішення."
