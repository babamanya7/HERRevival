 iceland_events.21.desc:0 "Слабкі лідери держави [FROM.GetNameDef] вирішили віддати нам контроль над Гренландією, оскільки, імовірно, не ризикують вплутуватися в конфлікт із нами. Це доводить, що наша слава ще прийде!"
 iceland_events.22.a:0 "Вони зникнуть з лиця землі!"
 iceland_events.4.a:0 "Тоді нам доведеться шукати інші рішення."
