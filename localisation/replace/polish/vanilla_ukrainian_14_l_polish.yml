 ALL_FACTION_MEMBERS_WITH_MOUNTAINEERS_TECH:0 "§YКожен член альянсу§! з відімкнутою технологією §Yгірської піхоти§!"
 ARG_a_new_trading_partner:0 "Переглянути договір Роки–Рансимена"
 ARG_align_with_the_soviets_desc:0 "З грандіозним успіхом революції настав час вирішити, як ми хочемо формувати майбутнє [ARG.GetNameDef]. Товариш Родольфо Гйольді був людиною, яка очолила революцію після свого повернення, і тому є прекрасним кандидатом на керівництво [ARG.GetNameDef]. Гйольді має намір тісніше співпрацювати з [SOU.GetNameDef] і вважає, що наша нова соціалістична держава перетвориться на центр сили, наслідуючи їх."
 ARG_balancing_act_desc:0 "Тепер, коли військові контролюють уряд, ми можемо звернути свій погляд на бурю, що насувається в Європі. Оскільки як Союзники, так і країни Осі мають стосунки з [ARG.GetName], ми повинні бути обережними, щоб не відштовхнути жодну зі сторін."
 ARG_cruiser_ship_engine_2:0 "«Parsons» 85 000 к. с. н. в."
 ARG_destroyer_1:0 "Клас «Catamarca»"
 ARG_develop_civilian_economy:0 "Розвивати цивільну економіку"
 ARG_encourage_italian_argentine_diplomacy:0 "Італійсько-аргентинська дипломатія"
 ARG_intervenciones_federales_desc:0 "У міру зростання загрози військового перевороту для нашого уряду, ми повинні прийняти рішення про запровадження Intervenciones Federales. Витративши час на ухвалення цього законодавства в кожному штаті, [ARG.GetName] може бути краще підготовлена до захисту від повстань."
 ARG_invest_in_construction_guilds_desc:0 "Будівельні гільдії є основою міського розвитку. Нашим наступним завданням має бути спрямування фінансування в гільдії [ARG.GetName], щоб гарантувати, що наша будівельна технологія здатна не відставати від решти світу."
 ARG_news_events.2.a:0 "Будемо сподіватися, що [ENG.GetAdjective] також втекли."
 ARG_news_events.2.b:0 "[GER.GetAdjective]s не мають права тут знаходитися."
 ARG_pay_back_germany:0 "Сплатити позику від держави [GER.GetFlag]§Y[GER.GetName]§!."
 ARG_peronism:0 "Перонізм"
 ARG_political_events.10.desc:0 "Сьогодні вранці Президент [ARG.GetLeader] зібрав своїх радників та завершив розробку акта Intervenciones Federales. Роблячи це, уряд нарешті приборкав тих військових, хто підбурював до повстання. Може знадобитися деякий час, щоб відновити лояльність наших військових, але це того варте, щоб уникнути загальнонаціональної катастрофи, такої як громадянська війна."
 ARG_political_events.110.b:0 "Це занадто ризиковано, щоб діяти..."
 ARG_political_events.12.a:0 "Ми привітаємо наших нових союзників."
 ARG_political_events.13.a:0 "Excelente!"
 ARG_political_events.15.a:0 "Ми не можемо їх стримати"
 ARG_political_events.19.a:0 "Ми не можемо їх стримати"
 ARG_political_events.23.desc:0 "Після того, як ми відстояли свою позицію, здається, [ARG.GetAdjective] уряд вирішив, що продовжувати цей курс дій не варто. Тепер ми можемо спокійно відпочити, знаючи, що загроза наразі придушена."
 ARG_political_events.23.t:0 "[ARG.GetNameDefCap] відступає"
 ARG_political_events.30.a:0 "Яке полегшення..."
 ARG_political_events.44.desc:0 "Прикра новина, товаришу. [SOV.GetNameDefCap] відмовився надіслати добровольчі сили у разі спалаху громадянської війни в нашій країні. Схоже, якщо наша славетна революція стане насильницькою, ми будемо протистояти нашим буржуазним гнобителям наодинці..."
 ARG_political_events.71.t:0 "Фанні Едельман залишається прем'єром"
 ARG_political_events.75.a:0 "Краще, ніж нічого..."
 ARG_political_events.76.desc:0 "Ми щойно отримали відповідь від [FROM.GetNameDef]. Вони вітають наші зусилля відновити нашу демократію, але не вважають вигідним для себе гарантувати нашу незалежність, ані укладати з нами пакт про ненапад."
 ARG_political_events.9.t:0 "Насувається громадянська війна"
 ARG_promote_urbanization_desc:0 "Поки світ навколо нас індустріалізується та урбанізується, [ARG.GetNameDef] залишалася майже незмінною. Це зробило нас залежними від інших націй для підтримки нашої економіки. Визнання цього та поштовх до урбанізації має швидко покласти край цій залежності."
 ARG_soviet_industrial_model:0 "Радянська промислова модель"
 ARG_sub_ship_engine_1:0 "Двигун «Tosi» 1 500 к. с. н. в."
 ARG_submarine_1:0 "Клас «Santa Fe»"
 ARG_war_division:0 "Військовий поділ"
 ASSAULT_LABEL_TT:0 "Ставка на безпосередні та фронтові атаки бронетехнікою."
 AST_COMINWEALTH_FACTION:0 "Комінвелт"
 AST_EQUIPMENT_VERSION_3:0 "Mk III"
 AST_a_democratic_bulwark:0 "Демократичний оплот"
 AST_a_national_housing_commission_desc:0 "Житло давно є суперечливим питанням. Кожен заслуговує мати дах над головою, але занадто часто цю базову потребу використовують проти робітників, а його вартість є формою економічного гноблення. Цьому кінець. Ми вимагатимемо справедливого доступу до житла для всіх."
 AST_additional_militia_training_desc:0 "Багато наших ополченців непридатні до несення служби: вони або хворі або погано оснащені. Зважаючи на те, в якому небезпечному світі ми живемо, цей промах потрібно виправити."
 AST_against_war_and_fascism_desc:0 "Рух проти війни та фашизму є австралійським відділенням фінансованої Комінтерном міжнародної ініціативи з мобілізації робітників проти реакційних сил. Хоча останніми роками він втратив оберти, ми повинні знову понести цей прапор вперед."
 AST_at_the_gates_desc:0 "Світ рухається до війни, і Австралія не повинна виявитися неготовою. Заводи та верфі країни повинні переключитися на вищу передачу. Це не підготовка до чужого конфлікту, це підготовка до власного виживання."
 AST_australian_army_catering_corps_desc:0 "Австралійська армія страждає через низьку якість їжі, основною причиною якого є слабка підготовка кухарів. Реорганізувавши цей процес, ми підвищимо бойовий дух та ефективність солдатів."
 AST_bring_home_the_farmers_desc:0 "Під час Великої депресії наші великі міста значно знелюдніли, оскільки робітники переїжджали до сіл у пошуках роботи в сільському господарстві. Тепер, коли умови починають покращуватися, ми повинні стимулювати повернення нашої робочої сили, щоб ми могли знову запустити фабрики і відновити виробництво."
 AST_british_pacific_fleet_desc:0 "Британська присутність у Тихому океані є критично важливою для стримування та захисту від ворожих кораблів, що розширюють своє панування на південь. Як частина альянсу, ми вживемо заходів для створення спільної командної структури з метою захисту наших прибережних вод."
 AST_canberra_air_disaster_flag:0 "$AST_canberra_air_disaster_events.1.t$"
 AST_carrier_4:0 "$ENG_carrier_4$"
 AST_cominwealth_tech_sharing_tt:0 "Ми укладемо §Yугоду про обмін технологіями§! з усіма членами нашого альянсу."
 AST_cv_CAS_equipment_3:0 "Hawker Sea Fury"
 AST_de_havilland_australia_organization:0 "de Havilland Australia"
 AST_delegation_to_china:0 "Делегація в Китай"
 AST_devalued_currency:0 "Девальвована валюта"
 AST_diplomatic_events.1.t:0 "Австралійський пакт про ненапад"
 AST_diplomatic_events.16.desc:0 "Незважаючи на тиск з боку Австралії, [NZL.GetName] вирішила не проводити референдум щодо застосування статті 6 Конституції Австралії. [NZL.GetNameDefCap] залишиться окремою нацією."
 AST_diplomatic_events.17.t:0 "Австралійське партнерство"
 AST_diplomatic_events.25.desc:0 "Зростаюча напруга серед тихоокеанських націй викликає занепокоєння, і оскільки Британія зайнята у власних битвах, наша здатність прийти на допомогу нашим підданим виглядає неправдоподібною; або, принаймні, так стверджує [AST.GetName].\n\nВони прагнуть реконструювати Британську Співдружність так, щоб нації Тихого та Індійського океанів управлялися безпосередньо з Канберри. Чи маємо ми погодитися?"
 AST_diplomatic_events.29.t:0 "Британія поспішає на допомогу"
 AST_diplomatic_events.40.a:0 "[AST.GetFascistParty] діятиме без німецької підтримки."
 AST_diplomatic_events.80.a:0 "Так ми і зробимо."
 AST_diplomatic_events.80.desc:0 "Втручання [USA.GetNameDef] у дипломатію Азії та Океанії є небажаним і неприйнятним, але, схоже, це зрозуміло лише нам. [JAP.GetNameDefCap] відмовляється гарантувати нашу незалежність, змушуючи нас кидати виклик нашим ворогам без них."
 AST_establish_advisory_war_council:0 "Консультативна військова рада"
 AST_expanding_influence_desc:0 "Стоячи на правильному боці історії, наші ідеї говорять самі за себе. Обіцянка робітничого раю — це не сон, а реальність, що створюється. Ми можемо поширити це бачення назовні, запрошуючи інших приєднатися до нас у побудові спільного майбутнього."
 AST_expeditionary_leader_plural:0 "Обидва §YГенерали§! матимуть рису §YЕкспедиційний лідер§!, яка покращує їхні можливості за кордоном, але обмежує кількість дивізій, якими вони можуть командувати."
 AST_fight_work_or_perish_desc:0 "Наш ворог несе пряму загрозу існуванню домініону, і кожен австралієць має зробити вибір: боротися, працювати чи загинути."
 AST_infantry_equipment_1_short:0 "LSAF Rifle No.6 MkI"
 AST_ireland_anti_british_pact_offer_accept_tt:0 "Якщо вони погодяться:"
 AST_kangaroo_point_dry_dock_taog_desc:0 "Хоча Evans Deakin and Company — це насамперед інженерна фірма, вони справедливо визначили потребу в розширенні суднобудівних потужностей у міру зростання глобальної напруженості, націлившись на Кенгуру-Пойнт. Ми повинні сприяти тому, щоб вони зайняли цю ділянку для підтримки подальшого зростання нашого флоту."
 AST_lang_is_right:0 "Ланг правий"
 AST_medium_tank_equipment_3:0 "AC III Thunderbolt"
 AST_mio_trait_corrugated_iron_ingenuity:0 "Винахідливість із гофрованого заліза"
 AST_mio_trait_defensive_emplacements:0 "Оборонні укріплення"
 AST_mio_trait_jet_transition_pathway:0 "Шлях переходу на реактивну авіацію"
 AST_modern_tank_destroyer_equipment_1_short:0 "Centurion Malkara"
 AST_natunity_effect_update_tt:0 "Список фокусів оновлюється на основі поточної §YОпозиційної партії§! та її вже розблокованих кластерів фокусів."
 AST_new_south_wales_government_railways_desc:0 "Майстерні урядових залізниць Нового Південного Уельсу забезпечують унікальну можливість: великі сталеві компоненти, відлиті одним шматком. Як одна з небагатьох націй Співдружності, здатна виготовляти повністю литі корпуси та башти танків, ми маємо використати цей потенціал з користю."
 AST_ratify_westminster_adoption_act_desc:0 "Незважаючи на суперечки, які може викликати зміна давно усталених політик, нам давно час ратифікувати Акт про прийняття Вестмінстерського статуту. Ми самі обиратимемо, які війни є нашими."
 AST_rats_of_tobruk_effect_2:0 "Отримає елітну військову частину в Сіднеї."
 AST_scrap_iron_flotilla:0 "Флотилія «Scrap Iron»"
 AST_solidarity_by_the_empire_modifier:0 "Солідарність Імперії"
 AST_submarine_4_desc:0 "$ENG_submarine_4_desc$"
 AST_support_weapons2:0 "Lewis Mk. III DEMS & SBML two-inch mortar"
 AST_the_pacific_resistance_tt1:0 "§YАвстралія§! приєднується до альянсу §Y[USA.GetFactionName]§!."
 AST_the_phosphate_commision:0 "Фосфатна комісія"
 AST_the_south_west_pacific_initiative:0 "Південно-Західна Тихоокеанська ініціатива"
 AST_union_control_1_cat_name:0 "Виберіть, де підбурювати профспілки на вашу підтримку"
 AST_union_control_events.2.t:0 "Агітатори за підтримки [AST.GetAdjective] на наших вулицях"
 AST_westward_battles:0 "Битви на заході"
 AST_workers_defence_corps_sparks_anew_desc:0 "Робітничий корпус оборони спочатку був створений для захисту пікетів і страйків. Зі зростанням агресії з боку таких груп, як «Нова гвардія», його було перегруповано, щоб знову діяти як щит для тих, хто протестує за кращі права та можливості."
 ATJ_communism:0 "Революційна держава Ачег"
 AUS_GER_cannot_take_a_no:0 "Незважаючи на постійний і зростаючий тиск на Австрію, [FROM.GetLeader] тримає свою позицію і не йде нам на зустріч. Артура Зейсса-Інкварта не було допущено радником в уряді, незалежно від наших дій і погроз. Нам доведеться змиритись з цим, це залишиться лише невеликою неприємністю."
 AUS_VICTORY_POINTS_3585:0 "Карлсбад"
 AUS_VICTORY_POINTS_3609:0 "Шабац"
 AUS_anschluss_risk_critical_tt:0 "Ризик аншлюсу на даний момент §RНеминучий§!."
 AUS_anti_tank_equipment_2:0 "47mm Böhler Modell 35"
 AUS_coastal_defence_forts_desc:0 "Те, що ми робимо в морі, - це лише частина того, що визначає наші шанси на успіх. Інша частина - це наша берегова лінія і те, наскільки влучно вона укріплена. Кілька вдало розташованих прибережних фортів можуть, зрештою, зупинити навіть найбільш ретельно сплановане вторгнення."
 AUS_defence_of_the_homeland_desc:0 "Тепер, коли ми нарешті можемо відновити нашу армію, нам потрібно шукати, як її спеціалізувати. Наше географічне положення є досить вразливим, тож наша армія є майстром оборони, слід навчити її використовувати наш унікальний ландшафт у своїх інтересах було б корисно."
 AUS_establish_rote_hilfe:0 "Відновити «Роте Хільфе»"
 AUS_follow_the_jansa_plan_tt2:0 "Стане доступний в якості §YГоловнокомандувача Армії§!:"
 AUS_great_austrian_economic_push:0 "Великий австрійський економічний бум"
 AUS_heeding_the_call_of_duty_desc:0 "Народ Австрії повинен змиритися з положенням нашої країни. Хоча ніхто не бажає, щоб до нас прийшла війна, ніхто не може гарантувати, що вона не відбудеться. Переконавшись, що наша нація довіряє нашим судженням і готова воювати, якщо виникне така потреба, ми значно підвищимо нашу готовність."
 AUS_join_comintern_desc:0 "Після приєднання до СРСР для нас тепер прокладено дуже чіткий шлях. Треба приєднатися до наших товаришів по Комінтерну, адже цього хоче і заслуговує наш народ!"
 AUS_join_the_allies:0 "Приєднатися до Союзників"
 AUS_mio_standardize_cheaper_ammunition:0 "Дешевші боєприпаси"
 AUS_mio_trait_production_speed:0 "Оптимізоване виробництво"
 AUS_news_events.12.t:0 "[AUS.GetNameDefCap] знову проводить демократичні вибори"
 AUS_news_events.8.desc:0 "Під правлінням Отто фон Габсбурга, [AUS.GetNameDef] повертає собі місто Габсбург, паралельно підпорядкувавши Швайцарію своїй волі. Метою цього було зміцнення влади родини Габсбургів. Це знаменує, що [AUS.GetName] різко повернеться до набагато більш імперіалістичної політики."
 AUS_political_events.100.t:0 "Подальший тиск для посади для Артура Зейсса-Інкварта"
 AUS_political_events.102.a:0 "Яка чудова ідея!"
 AUS_political_events.112.t:0 "[FROM.GetNameDefCap] підписує Пакт про ненапад"
 AUS_political_events.16.desc:0 "Як і очікувалося, [FROM.GetNameDef] погано відреагував на нашу нещодавню заборону НСРП. Окрім очевидної вимоги негайного скасування заборони, вони також вимагають, щоб ми призначили Артура Зейсса-Інкварта радником в уряді. Однак нам відомо, що він дуже любить сучасні [FROM.GetAdjective]і ідеї. Вони дуже наполегливі щодо цього, що викликає запитання; нащо це їм?"
 AUS_political_events.32.t:0 "[FROM.GetNameDefCap] пропонує допомогу у будівництві нового заводу"
 AUS_political_events.44.t:0 "[FROM.GetNameDefCap] підкоряється нашим вимогам"
 AUS_political_events.54.desc:0 "Ми отримали відповідь від [FROM.GetAdjective] керівництва, вони не підкоряться нашим вимогам. Нехтуючи нашими сімейними претензіями на місто Габсбургів, вони відмовляють нам у законному володінні землею та завдають плями нашій честі. Цього не можна було терпіти!"
 AUS_political_events.56.desc:0 "[GetHostilityItalianClaimDesc56]"
 AUS_political_events.58.a:0 "Ладно, ладно."
 AUS_political_events.60.t:0 "[FROM.GetNameDefCap] виступає проти оборонного плану Альфреда Янси"
 AUS_political_events.79.t:0 "[FROM.GetNameDefCap] пропонує свою підтримку"
 AUS_political_events.82.desc:0 "Наше рішення узгодити політичну ідеологію, зробити її більш ідентичною до тої, якої дотримується [FROM.GetLeader], дає свої плоди. [FROM.GetNameDefCap] запропонував нам гарантію та готовий підтримати нас, якщо ми станемо жертвою будь-яких бойових дій."
 AUS_political_events.93.a:0 "Чудово"
 AUS_rapid_rearmament_desc:0 "Нарешті звільнившись від кайданів Договору, ми маємо шанс негайно переозброїтися. За останнє десятиліття нашою армією та військово-повітряними силами серйозно знехтували, тож знадобляться значні зусилля, щоб знову вивести нас на прийнятний рівень."
 AUS_rebellious_rearmament:0 "За-договірне переозброєння"
 AUS_reforming_the_central_powers_tt:0 "Ми запросимо спадкоємців мертвих імперій, а саме §Y[GER.GetNameWithFlag]§!, §Y[TUR.GetNameWithFlag]§! й §Y[BUL.GetNameWithFlag]§! в новостворені §YЦентральні Держави§!, однак лише тих, чия ідеологія §YФашистська§! або §YНейтральна§! і хто вже не знаходиться в альянсі."
 AUS_renounce_the_treaties:0 "Відмовитись від договору"
 AUS_sturmscharen_support_desc:0 "Штурмшарен завжди діяв, як проміжний шлях між соціал-демократичним Шуцбундом і націоналістичним Гаймвером. Хоча історично очолюваний нашим опонентом, Куртом Шушнігом, ми віримо, що завдяки політичному збігу та нашим традиційним цінностям, ми могли б отримати їх підтримку і змусити працювати на нас."
 AUS_via_danube_to_europe_desc:0 "Ми зібрали досить поважну фракцію навколо себе, і хоча ми могли б зупинитися тут, ми могли б також подивитися за межі Дунаю. Загальноєвропейська фракція, зосереджена на співпраці та співтоваристві в Європі, може виявитися дуже вартісною справою."
 AUTONOMY_MOVING_DESC:0 "§GЗмінити рівень автономії на: $LEVEL|lH$§!"
 AUTOSAVE_TOCLOUD:0 "Хмарні автозбереження"
 AZR:0 "Азербайджан"
 Attalis:0 "Атталіда"
 BALTIC_attract_workers_to_capital:0 "Залучити робітників у область [Root.Capital.GetName]"
 BALTIC_axis_investments_desc:0 "[GetBalticAxisInvesmentsDesc]"
 BALTIC_belarus_ssr_desc:0 "Концепція об'єднання Білорусі та Балтики не нова. Давним-давно існувала Литовсько-Білоруська РСР — гармонійний сплав двох на перший погляд різних народів. Соціалізм не знає культурних і мовних кордонів, і ми не бачимо причин, з яких [Root.GetAdjective]і та білоруські робітники не могли б співіснувати."
 BALTIC_events.14.d:0 "За останні тижні до [Root.GetAdjective] Червоної армії не дійшло із заводів кілька гвинтівок та інше військове спорядження. Встановлено, що у зникненні винні «лісові брати». Хоч уряд тепер і знає винуватця, на те, щоб «закрутити гайки» на виробництві та переконатися, що жодна куля більше не потрапить у ствол зброї «лісових братів», знадобиться кілька тижнів."
 BALTIC_events.501.d:0 "З держави [From.GetNameDef] прийшли новини щодо [Root.GetAdjective] прохання про освіту [Root.GetNonIdeologyName]-Білоруської РСР. [From.GetLeader] радіє можливостям, що випливають з об'єднання основних територій Європи та балтійського народу, і стверджує, що такий союз неминуче згладить протиріччя між Сходом та Заходом і сприятиме поширенню революції по континенту."
 BALTIC_events.701.a:0 "Ну що ж..."
 BALTIC_free_the_workers_of_poland:0 "Звільнити робітників у Польщі"
 BALTIC_german_tank_licences_desc_alt:0 "Танки наших фашистських покровителів відмінно проявили себе, пройшовшись блицем по завойованих територіях, заставши противників зненацька і розметавши їх. Якщо ми зможемо використовувати таку ж тактику в майбутніх війнах на Сході, це піде на користь держав."
 BAN_neutrality_DEF:0 "Султанат Бангладеш"
 BAS_neutrality_ADJ:0 "Британо-антильськ"
 BAY_VICTORY_POINTS_692:0 "Мінга"
 BBA_SWI_annual_election.1.b:0 "Обрати [SWI_GetCouncilor2name]"
 BBA_african_union_events.12.a:0 "Ми знали, що цей день настане."
 BBA_african_union_events.4.desc:0 "Організація Африканської Єдності створила [ETH_GetCentralBankName], що має мандат на управління валютою для зростаючої організації. Мета — впровадження єдиної валюти серед усіх учасників та інтеграція економік. У довгостроковій перспективі це повинно принести економічні вигоди, однак у короткостроковій перспективі впровадження нової валюти створить значні труднощі."
 BBA_african_union_events.8.desc:0 "Уряд [FROM.GetNameDef] погодився приєднатися до виконавчої ради Організації Африканської Єдності. Вони вже розпочали підписання відповідних угод, що визнають повноваження ради в усіх юридичних питаннях."
 BBA_ethiopia_balance_of_power_events.30.desc:0 "Колишній шум Сідамо, а колись Деджазмач [FROM.GetAdjective]ої армії, прийняв заклик [FROM.GetLeader] знову стати до зброї за свою країну. Герой Адви приводить із собою рекрутів зі своїх особистих володінь. Сподіваємося, що це допоможе відбити [ITA.GetAdjective]е вторгнення."
 BBA_ethiopia_balance_of_power_events.52.a:0 "Все це добре."
 BBA_ethiopia_communist_events.02.t:0 "[SOV.GetName] відмовляє у допомозі"
 BBA_ethiopia_communist_events.05.a:0 "Не можна втрачати підтримку народу. Вигнати його у вигнання."
 BBA_ethiopia_communist_events.06.a:0 "Зрадники отримали по заслузі."
 BBA_ethiopia_communist_events.14.b:0 "Нам потрібно зберегти власний авіапарк."
 BBA_ethiopia_communist_events.27.t:0 "[SOV.GetNameDefCap] не зупинив [ITA.GetAdjective]у агресію"
 BBA_ethiopia_communist_events.36.t:0 "[SPC.GetNameDefCap] погоджується звільнити Риф"
 BBA_ethiopia_communist_events.49.a:0 "Ми не віддамо наші землі."
 BBA_ethiopia_communist_events.52.a:0 "У нас є важливіші справи."
 BBA_ethiopia_communist_events.60.desc:0 "Посли з [FROM.GetNameDef] відкинули нашу мирну пропозицію. Вони стверджують, що наш напад на них був абсолютно необґрунтованим, і тому вони погодяться лише на безумовну капітуляцію з нашого боку за те, що ми загрожуємо регіональній безпеці."
 BBA_ethiopia_communist_events.61.t:0 "[FROM.GetNameDefCap] пропонує мир в обмін на незалежність [?ETH.ETH_disputed_colony.GetAdjective]"
 BBA_ethiopia_exile_events.32.t:0 "Спільна заява про вступ від [FROM.FROM.GetName] та [FROM.FROM.GetName]"
 BBA_ethiopia_exile_events.44.desc:0 "Аргументи, висунуті [ROOT.GetLeader], розбилися об глухий кут. [FROM.GetLeader] пустився в тираду, стверджуючи, що висунута пропозиція відповідає інтересам усіх сторін, а [ROOT.GetLeader] невдаха, оскільки [ROOT.GetLeader.GetHerHis] не зміг перемогти в Африці. [FROM.GetAdjective], безсумнівно, розчавить [ROOT.GetAdjective]у армію за лічені тижні, — вигукнув [FROM.GetLeader]."
 BBA_ethiopia_exile_events.50.desc:0 "[ROOT.GetAdjectiveCap]ий прикордонний пост потрапив під обстріл з боку [ITA.GetAdjective]их військ. [ROOT.GetAdjectiveCap]і прикордонники у відповідь відкрили вогонь по [ITA.GetAdjective]их снайперах, і зав'язалася тривала перестрілка. Поранення отримали військовослужбовці з обох сторін. [ITA.GetAdjectiveCap]ому уряду було подано офіційний протест. Однак вони заявляють про свою невинуватість, натомість звинувачують наші війська в тому, що інцидент почався саме з їхньої вини."
 BBA_ethiopia_fascist_events.02.a:0 "Узагалі, це доволі вигідно."
 BBA_ethiopia_fascist_events.02.b:0 "Ні, дякую. Нам не потрібна жодна допомога."
 BBA_ethiopia_fascist_events.51.desc:0 "Держава [FROM.GetName] офіційно визнала наш контроль над колишньою територією в [FROM.GetAdjectiveCap]ому Сомаліленді. Маючи мало засобів для повернення території, вона, здається, воліла б зосередитися на справах ближче до дому, а не грузнути в конфлікті з нашими героїчними збройними силами."
 BBA_ethiopia_fascist_events.66.t:0 "[ITA.GetName] погоджується на територіальну компенсацію"
 BBA_ethiopia_imperial_events.21.t:0 "Опір у державі [ETH.GetName]"
 BBA_ethiopia_industrial_financial_events.4.t:0 "[FROM.GetName] схоже зберегти частковий контроль"
 BBA_italo_ethiopian_war_events.112.a:0 "Доведеться боротися ще наполегливіше."
 BBA_italo_ethiopian_war_events.201.a:0 "Ми мусимо розвивати це, щоб витіснити ворога з держави [ROOT.GetName]."
 BBA_italo_ethiopian_war_events.204.t:0 "Народна війна"
 BBA_italo_ethiopian_war_events.305.desc:0 "Те, що почалося як громадянська непокора в колоніях, майже переросло в справжнє повстання! Наша неспроможність закінчити триваючу боротьбу в державі [ETH.GetName] переконала наших підданих, що ми слабкі й що їм було б краще без нашого управління."
 BBA_italy_air_accident.02.t:0 "Трагічна загибель $ITA_giuseppe_tellera$"
 BBA_italy_anti_colonialism_events.20.t:0 "[FROM.GetNameDefCap] засуджує колоніалізм"
 BBA_italy_anti_colonialism_events.59.t:0 "Центральна Африка голосує за вихід з держави [ROOT.GetNameDef]"
 BBA_italy_communist_events.01.a:0 "Антоніо Грамші є законним лідером."
 BBA_italy_communist_events.06.b:0 "[FROM.GetAdjective]і справи нас не стосуються."
 BBA_italy_decide_the_fate_of_mussolini.1.c:0 "Вбити його."
 BBA_italy_interaction_events.13.a:0 "Жалюгідно!"
 BBA_italy_interaction_events.16.t:0 "[FROM.GetName] відмовляє нам у праві відчувати себе в безпеці!"
 BBA_italy_interaction_events.18.b:0 "Ми не будемо кланятися італійцям, незважаючи ні на які умови!"
 BBA_italy_interaction_events.21.a:0 "Цю Грецію ми взяли першими!"
 BBA_italy_interaction_events.23.desc:0 "Турецькі зрадники відкинули нашу пропозицію продати їм острови в обмін на союз. Це свідчить лише про некомпетентність і слабкість їхніх урядів."
 BBA_italy_interaction_events.26.desc:0 "Італія оголосила, що не виступить проти нас, тепер, коли їм доведено, що якщо вони не відступлять, то буде бій, якщо вони не відступлять. Сьогодні славний день для батьківщини!"
 BBA_italy_interaction_events.31.desc_no_peace_deal:0 "Попри наші наполягання, невдячний [ETH.GetLeader] відмовився вступати в мирні переговори з [ITA.GetAdjective]им урядом, вважаючи, що він має перевагу у війні. Це не залишає нам іншого вибору, окрім як вислати ефіопського лідера з нашої країни, щоб ми могли зосередитися на італійській пропозиції, яка більше відповідає нашим національним інтересам."
 BBA_italy_interaction_events.41.a:0 "Пропозиція занадто хороша, щоб від неї відмовитися."
 BBA_italy_interaction_events_news.2.t:0 "Великобританія гарантує незалежність Австрії"
 BBA_italy_local_rulers.2.t:0 "$ETH_abba_jofir$ звертається до італійських урядовців"
 BBA_italy_local_rulers.4.desc:0 "Під час нашої приголомшливої перемоги над абіссинцями нам вдалося захопити в полон одного з головнокомандувачів їхньої армії та члена імператорської сім'ї — Сеюма Менгешу. Нам сказали, що абіссинський імператор Хайле Селассіє дуже поважає цю людину. Ми можемо використати цього бранця, щоб ще більше принизити імператора і, можливо, забезпечити лояльність народу. Звичайно, він не матиме реальної влади, але робитиме те, що йому скажуть."
 BBA_italy_missiolinis.04_south.desc:0 "Південний контрнаступ в Абіссінії не досяг поставлених дуче завдань, через що він протягом годин лаявся, що його оточують некомпетентність та ідіотизм. Схоже, він переконаний, що вище військове командування проти нього і що генерали бажають програти всю війну."
 BBA_italy_missiolinis.81.t:0 "Технологічні інновації"
 BBA_italy_naval_cooperation_programs.14.t:0 "[ITA.GetName] експортує карликові підводні човни"
 BBA_italy_naval_cooperation_programs.16.desc:0 "[FROM.GetAdjective] Флот не побачив жодної вигоди від купівлі наших карликових підводних човнів. Це тому, що вони обмежені та, відверто кажучи, простодушні, оскільки наші підводні човни мають найвищу якість."
 BBA_italy_pact.1.a:0 "Нам би це підійшло."
 BBA_italy_second_italo_ethiopian_war.1.desc:0 "[FROM.GetName] тікає! Наші могутні армії завдали таких важких втрат, що [FROM.GetAdjective]і солдати повзають навколішках, благаючи про мир. Наша країна виснажена війною, і мир був би дуже бажаним, але це також може бути чудовою можливістю ще більше закріпити нашу перемогу — переконатися, що жодна інша дурна європейська країна не спробує знову завоювати непереможну Ефіопію!"
 BBA_swiss_expansion.17.desc_alps:0 "Це визначний день, навіть якщо ми ще не досягли всіх своїх цілей. [FROM.GetNameDefCap] неохоче дозволила нам відокремитися, надавши нам довгоочікувану незалежність. І водночас вони ганебно відмовилися передати нам свої альпійські території.\n\nМи мусимо знайти інший спосіб об’єднати Альпи під нашим прапором."
 BBA_swiss_expansion.6.a:0 "Ризик не вартий такого дрібного штату"
 BBA_switzerland.13.desc:0 "Представник, якого ми надіслали консультувати вдову Густлоффа, повернувся з чудовими новинами. Вирок суддів у [SWI.GetName] дав Давіду Франкфуртеру суворе покарання, майже таке, як ми вимагали."
 BBA_switzerland.24.desc:0 "Наш нейтралітет залежить не лише від нашої рівної політики до всіх країн, але й від їхнього сприйняття цього. Згідно з [?SWI.SWI_angriest_country.GetNameDef], ми порушили обіцянку нейтралітету та стали на бік їхніх ворогів. Вони попередили, що якщо ми їх не заспокоїмо, то більше не вважатимуть нас нейтральними — і навіть можуть оголосити нам війну."
 BBA_switzerland_trade.4.d:0 "Воно того вже не варте"
 BECOME_SPY_MASTER_BUTTON:0 "Очолити розвідмережу"
 BEL_GER_fascism_autonomy_reichsprotectorate:0 "Райхспротекторат Бельгія"
 BEL_available_secretaries_general_tt:0 "§YГенеральні секретарі§! тепер доступні як §YЗакон окупації§! у Бельгії"
 BEL_belgian_tank_development_desc:0 "Попри наші потужні автомобільні виробництва, ми ніколи не виявляли особливого інтересу до розвитку броньованих сил. З огляду на останні військові досягнення, очевидно, що настав час інвестувати в нашу власну програму розвитку танків."
 BEL_broken_neutrality:0 "Порушений нейтралітет"
 BEL_civil_service_purge:0 "Чистка цивільної служби"
 BEL_communist_constitution_decision:0 "Комуністична конституція"
 BEL_defense_bill_desc:0 "Наше оголошення про вічний нейтралітет не було сприйняте позитивно на міжнародній арені, однак реальність така, що це було необхідно для концентрації політичної підтримки на значній програмі переозброєння."
 BEL_foreign_plane_purchases_desc:0 "На жаль, через стан [ROOT.GetAdjective] авіаційної промисловості, ми змушені шукати літаків за кордоном. Давайте оголосимо конкурс і дозволимо іншим країнам брати участь у тендерах."
