 FIN_suomen_ilmavoimat:0 "Suomen ilmavoimat"
 FIN_the_path_to_socialism_desc:0 "Через кілька років, спільними зусиллями людей, ми досягнемо справжнього соціалізму, хоча шлях до цього місця може бути тернистим і важким. Однак ми повинні продовжувати ним йти, незалежно від ціни."
 FIN_the_peoples_democratic_league_desc:0 "Народно-демократична ліга була в авангарді координації різних лівих фракцій у [FIN.GetNameDef]. Вони створили основи справжнього альянсу робітників, який може забезпечити виконання волі пролетаріату."
 FIN_the_red_watch:0 "Червона варта"
 FIN_the_red_watch_desc:0 "Є ті, хто хоче підірвати все, що ми створили після громадянської війни, щоб відновити капіталістичну тиранію. Завдяки створенню Червоної гвардії ми можемо забезпечити викорінення такої зрадницької діяльності, перш ніж вона пошириться по нашій республіці.."
 FIN_tire_factory_at_nokia:0 "Шинний завод у Нокіа"
 FIN_trade_agreements_desc:0 "Хоча і не завжди підтримують наші внутрішні політичні рішення, є багато країн, які хотіли б укласти торгові угоди для підтримки нашої військової модернізації. Головним чином, щоб ми могли підірвати безпеку наших менш смачних сусідів."
