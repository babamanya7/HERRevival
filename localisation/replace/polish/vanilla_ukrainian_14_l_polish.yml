 denmark_resistance_event.23.desc:0 "Нам нанесла таємний візит данська делегація. Вона цікавиться, чи не хочемо ми продати їхній країні кілька старих есмінців. [DEN.GetNameDefCap] зараз під тиском держави [?DEN.DEN_overlord_nation.GetNameDef], і такий запит може означати, що готується боротьба за незалежність. Чи варто нам допомогти цій країні здобути свободу?"
