 mtg_britain.30.b:0 "Ми не бажаємо зв'язувати собі руки таким чином."
 mtg_britain.33.a:0 "Під загрозою майбутнє нашої держави!"
 mtg_britain.35.d:0 "Наша хода на Даунинг-стріт обернулася неймовірним успіхом, і при такому неймовірному громадському тиску лідер [Root.GetLeader] не міг зробити нічого іншого, крім як оголосити дострокові вибори. Праві на них здобули чудову перемогу, і з благословення короля Освалд Мослі сформував свій кабінет. У своїй сьогоднішній заяві новий прем'єр-міністр оголосив про початок широкомасштабних економічних реформ і про новий підхід до європейської дипломатії.\n\nТим часом невдоволення в домініонах, як і раніше, залишається високим, а заклики до здобуття незалежності лунають все голосніше. Наступні кілька місяців матимуть критичне значення для долі імперії."
 mtg_britain.36.t:0 "[From.GetName] просить укласти союз"
 mtg_britain.45.a:0 "Настав час показати цим мисливцям, хто тут видобуток."
 mtg_britain.46.d:0 "Держава [From.GetNameDefCap] поставила ультиматум з вимогою, щоби ми негайно наслідували його приклад і надали незалежність усім нашим колоніальним володінням. В іншому випадку вона стверджує, що повно рішучості домогтися виконання своїх вимог військовою силою."
 mtg_britain.57.t:0 "[ENG_blackshirt_march_state.GetName]: мирна хода"
 mtg_britain.59.t:0 "[ENG_blackshirt_march_state.GetName]: хода з жорстокими зіткненнями"
 mtg_britain.60.d:0 "У відповідь на звинувачення в тому, що їм командує [GER.GetLeader], Освалд Мослі сьогодні вибухнув натхненною промовою. У ній він міркував про унікальність і неповторність британського фашизму, спираючись на відмінності між своїми політичними. і політичними поглядами німецького диктатора. На закінчення він сказав: «Ніхто, крім британців, немає права правити Британією!»."
 mtg_britain.62_tt:0 "Британці зможуть привести нас до своєї ідеології протягом наступних 180 днів.\n"
 mtg_britain.66.d:0 "[ENG.GetAdjective] уряд зазнав серйозних політичних змін. Ми мусимо вирішити, чи залишатися лояльними до нього тепер, коли його ідеологічні погляди настільки різняться."
 mtg_britain.7.t:0 "Газети підтримують шлюб"
 mtg_britain.74.t:0 "[PAK.GetName]: громадянська війна заходить у глухий кут"
 mtg_britain.86.t:0 "Імперська конференція: оборона — [From.GetName] відмовляється"
 mtg_britain.91.t:0 "Імперська конференція: економіка"
 mtg_britain.92.a:0 "Наша економіка має бути сильною, щоб у майбутньому перенести можливі бурі."
 mtg_britain.97.d:0 "[From.GetAdjective] уряд також вважає, що політика умиротворення вичерпала себе і що для захисту наших глобальних інтересів необхідно дотримуватися суворішого тону, навіть якщо це може призвести до війни."
 mtg_netherlands.1.b:0 "Ні! Вони хочуть самі отримати ці острови."
 mtg_netherlands.16.a:0 "Чудові новини."
 mtg_netherlands.19.d:0 "[HOL.GetAdjective] представники зв'язалися з нами і запропонували тісне співробітництво між так званими «Нижніми землями». Тепер вони бажають отримати наше офіційне схвалення цього проєкту."
 mtg_netherlands.19.t:0 "[From.GetNameDefCap] запрошує нас вступити до Бенілюксу"
 mtg_netherlands.29.c:0 "Передати їм артилерійське оснащення."
 mtg_netherlands.60.d:0 "[HOL.Adjective] влада пішла на загострення дипломатичного скандалу, в досить різких висловах вимагавши від нас вибачень."
 mtg_netherlands.61.d:0 "Представники держави [From.GetNameDef] не пішли назад і відмовилися вибачитися за образи і наклеп щодо принца Бернарда. Чи праві вони і чи справді принц Бернард втручався в їхні внутрішні справи— зараз неважливо; переломного моменту у міжнародних відносинах."
 mtg_netherlands.74.a:0 "Ми виконаємо свої зобов'язання."
 mtg_news.14.desc:0 "У своїй сьогоднішній промові [From.GetLeader] проголосив зміни в колоніальній політиці держави. «[From.GetAdjective] уряд визнає право всіх народів на самовизначення та вирішує спрямувати всіх підданих імперії на шлях незалежності, яка має настати у найближчому майбутньому».\n\nУ відповідь на занепокоєння сильним послабленням світових позицій держави [From.GetNameDef], до яких може привести такий захід, [From.GetLeader] зауважив, що «всі народи, які висловили таке побажання, можуть залишитися у складі новоствореної співдружності націй, причому як повністю рівноправних та незалежних його учасників». Поки невідомо, чи скористається якась держава такою можливістю."
 mtg_news.19.desc:0 "Після укладення шлюбу з Уолліс Сімпсон король [From.GetLeader] доручив лідерам новоствореної Партії короля Вінстону Черчиллу, Освалду Мослі та Дейвіду Ллойду Джорджу утворити новий уряд.\n\nТі, чиї інтереси висловлює [From.GetLeader], раді створенню лояльного уряду, критики вказують на те, що він безоглядно виконує бажання короля, якого вже можна де-факто визнати абсолютним монархом."
 mtg_news.21.c:0 "Треба застерегтися..."
 mtg_news.26.t:0 "Імперіалістична громадянська війна в державі [From.GetName]!"
 mtg_news.27.t:0 "[ENG.GetName] укладає союз із [From.GetAdjective]ими імперськими лоялістами"
 mtg_news.39.b:0 "Ми їх не боїмося."
 mtg_news.41.b:0 "Британці знищують себе самі..."
 mtg_news.41.t:0 "Громадянська війна в державі [From.GetName]"
 mtg_news.46.a:0 "Ми продовжимо боротися!"
 mtg_usa_civil_war_democrats.2.a:0 "Цікаво, як вони збираються здійснити свої вимоги?"
 mtg_usa_civil_war_democrats.41.b:0 "Він досі потрібний республіці."
 mtg_usa_civil_war_fascists.2.desc:0 "Ескалація напруженості продовжилася черговими протестами в столиці, які проводить, крім інших організацій, Срібний легіон Америки. Повторивши свої минулі вимоги про арешт і видачу низки конгресменів, протестуючі висунули ультимату або вони через годину візьмуть Капітолій штурмом і просто викинуть з нього вказаних осіб.\n\nКоли відповіді на ультиматум не було, невеликі загони Срібного легіону прорвали шик поліцейських. інші групи проникли в будинок, переходячи з приміщення до приміщення, вони знайшли деяких зі своїх передбачуваних жертв, але їх зупинили озброєні поліцейські. сторони звинувачують в ескалації одна одну. едель покажуть, чи була так звана «Битва за Капітолій» кінцем протестів чи просто прелюдією до більшого конфлікту."
 mtg_usa_civil_war_fascists.201.t:0 "Добровольці з держави [CSA_liberated_state.GetName]"
 mtg_usa_foreign_support.14.desc:0 "Засумнівавшись у придатності кандидатів, [From.GetAdjective] уряд відмовився надати нам дозвіл на проведення програми з підготовки пілотів."
 mtg_usa_foreign_support.17.a:0 "Дуже шкода."
 mtg_usa_foreign_support.17.t:0 "[From.GetNameDefCap] відмовляє у фінансуванні"
 mtg_usa_pacific_pacification.2.t:0 "[From.GetNameDefCap] погоджується"
 mtg_usa_pacific_pacification.3.a:0 "У нас немає іншого вибору, крім силового."
 mtg_usa_secure_asia.1.desc:0 "Президент [USA.GetLeader] направив особливого представника до столиці на зустріч, де буде присутній лідер [This.GetLeader], для обговорення нових інтересів держави [USA.GetNameDef] у цьому регіоні. [This.GetNameDefCap], мабуть, займає ключове місце в [USA.GetAdjective] стратегії. [USA.GetNameDefCap] більше не зазнають недружнього чи ворожого уряду в регіоні [This.GetNameDef]."
 mtg_usa_secure_asia.7.a:0 "Нехай беруть собі В'єтнам."
 mutiny_event.6.a:0 "Terrible shame."
 mutiny_event.7.desc:0 "Despite a few instances in which small groups of mutineers decided to make a fight out of it, our operation to crush the rebellion has been a stunning success. Relying on numbers rather than skill, loyalist militias surrounded the mutineers' strongholds and demanded their surrender. Most soldiers decided not to take up arms against their own countrymen and surrendered peacefully.\n\nThe ringleaders will be tried in secret court martials, but the average soldier will be sent back to the front, albeit in a different unit to prevent mutineers from forming new cells."
 mutiny_event.8.desc:0 "Our attempts to prevent the elections for the Worker and Soldier Councils have escalated the situation beyond even the most pessimistic estimation. Rather than surrendering, the mutineers have formed provisional Councils, elected field commanders and set up defenses in the streets. It is clear that they aim to make a fight out of this.\n\nThe rifts in the army now run through every unit and often even between members of the same family. [Root.GetNameDefCap] stands poised at the edge of a civil war."
 mutiny_mission:0 "Наведення порядку в армії"
 naval_effort:0 "Розвиток флоту"
 naval_hit_chance_tt:0 " $MODIFIER_NAVAL_HIT_CHANCE$: $RIGHT|+=%1$"
 naval_innovations_focus_desc:0 "Тепер, коли флот досяг переважаючого становища в імперії, нам слід спрямовувати більше ресурсів на розробку нових типів кораблів."
 naval_manufacturer_cost_factor_tt:0 " $naval_manufacturer_cost_factor$: $RIGHT|-=%1$"
 naval_repair_support_value_factor:0 "(Ремонтні кораблі) Величина ремонту: $RIGHT|+=%$"
 naval_torpedo_hit_chance_factor_tt:0 " $MODIFIER_NAVAL_TORPEDO_HIT_CHANCE_FACTOR$: $RIGHT|+=%1$"
 navy_primancy_focus:0 "Верховенство флоту"
 neo_mesopotamia_democratic:0 "Республіка Родючого Півмісяця"
 neo_mesopotamia_democratic_DEF:0 "Республіка Родючого Півмісяця"
 neutrality_drift_factor_tt:0 "$neutrality_drift$: $RIGHT|+=2$"
 new_ideas:0 "Доступні нові міністри.\n"
 news.107.t:0 "Падіння Севастополя"
 news.12.f:0 "Вони скоро визнають свою помилку."
 news.126.d:0 "В Індії продовжується наступ японських військ, яким недавно вдалося захопити Нью-Делі. Столиця Британської Індії мала величезне стратегічне значення, і її втрата може стати вирішальним фактором в індійській кампанії.\n\nЗа чутками, віцекороль був захоплений ударними японськими загонами під час завантаження його майна для евакуації, проте це ще не підтверджено."
 news.152.c:0 "Франція сама, але сильна."
 news.152.e:0 "Наше втручання не потрібно, це ж очевидно."
 news.155.t:0 "Німеччина знову у війні"
 news.156.a.2.tt:0 "Мені все одно не подобалася та ваза.\n"
 news.164.a:0 "Думаю, це означає війну"
 news.174.b:0 "Сподіваємося, що їх дослідження принесуть свої плоди."
 news.182.a:0 "Ніщо не може загрожувати альянсу [From.GetFactionName]!"
 news.185.c:0 "Це може стати приводом для занепокоєння."
 news.199.a:0 "Це важливо для [From.GetAdjective]ої стратегії."
 news.205.d_america:0 "Дивлячись на конфлікти на інших континентах, [USA.GetLeader] оголосила про нову зовнішньополітичну програму, спрямовану на збереження миру всередині країни.\nБудь-який уряд на американському континенті може звернутися до США за військовим захистом, якщо відчує загрозу з боку своїх сусідів. Хоча це не є гарантією для будь-якої конкретної держави, прагнення до миру в Америці більше не є просто мрією, а офіційною американською політикою"
 news.206.c:0 "Глобальна рівновага під загрозою."
 news.209.d:0 "Збройні сили Японії давно визнали, що [JAP.GetNameDef] не володіє природними ресурсами, необхідними для ведення тривалої війни. Зі зростанням напруженості та спалахами збройних конфліктів за участю великих світових держав, загроза втрати імпорту здається більшою з кожним днем.\nЩоб протистояти цьому, японські стратеги розробили стратегічний план захоплення сибірських шахт і нафтових родовищ у [SOV.GetNameDef]. Теоретично вважається, що швидке просування дозволить Японії взяти під контроль ключову територію до того, як можна буде провести належну контратаку [SOV.GetAdjective]. На той час японська армія матиме всі необхідні ресурси, щоб підтримувати полум'я війни аж до капітуляції [SOV.GetAdjective]."
 news.21.t:0 "Крайовська угода"
 news.220.t:0 "Путч офіцерів у [SOV.GetNameDef]!"
 news.225.t:0 "[ENG.GetNameDefCap] впливає на державу [TUR.GetNameDef]"
 news.234.b:0 "[GER.GetNameDefCap] слід тримати на відстані!"
 news.236.e:0 "Це може бути кінцем держави [GER.GetNonIdeologyName]..."
 news.241.b:0 "У нас не було вибору, тож... за революцію."
 news.246.b:0 "Брати по землі, брати по зброї!"
 news.249.a:0 "Ми бачили це раніше, це може закінчитися тільки слізьми."
 news.249.d:0 "Сьогодні вранці [USA.GetAdjective]і політики прокинулися від тривожних новин, оскільки [CAN.GetNameDef] і [MEX.GetNameDef] оголосили про новий оборонний пакт, спрямований на «протидію і стримування безпосередніх загроз подальшому суверенітету обох наших країн». Тонко завуальована загроза мало приховує наміри перешкоджати військовим зусиллям [USA.GetNameDef] на американському континенті і, можливо, за його межами.\n\nПолітичні коментатори порівнюють ситуацію з Європою перед Великою війною: дві сторони, яким є що втрачати, і немає способу послабити напруженість. Питання полягає не стільки в тому, хто кому становить більшу загрозу, скільки в тому, яка сторона першою завдасть превентивного удару."
 news.260.desc:0 "\nСьогодні на офіційній церемонії [SAF.GetLeader] підписав договір, який надасть його уряду контроль над британськими залежними територіями в Африці. Території Бечуаналенду, Родезії та Кенії тепер будуть управлятися з Преторії.\n\nВиступаючи перед Палатою громад, [ENG.GetLeader] заперечив, що цей крок послаблює позиції Британії на континенті, назвавши його «найбільш розумною зміною, яка дозволить ефективніше управляти та захищати ці території»."
 news.283.b:0 "Чи ці голоси дійсно щось змінюють?"
 news.284.a:0 "Свобода в межах досяжності!"
 news.292.c:0 "Вакуум влади імперії ще може бути заповнений..."
 news.292.e:0 "Зневага до демократії!"
 news.294.b:0 "Ми захищатимемо Відень до останьої людини!"
 news.298.b:0 "Вони втручаються у світопорядок..."
 news.301.desc:0 "Держава [ROM.GetNameDef] оголосила, що прийме [HUN.GetAdjective]і вимоги про повернення Трансільванії. Відповідно, ця територія тепер возз'єдналася з країною, значно збільшивши її розмір і силу. Малоймовірно, що успіх такого масштабу утримає угорців від подальших вимог щодо решти втрачених територій."
 news.319.c:0 "Ще одна Балканська війна...?"
 news.320.f:0 "Вони можуть не надіятися, що протримаються довго."
 news.335.a:0 "Що це значить для Тихоокеанського регіону?"
 news.35.b:0 "Вони думають, що будуть у безпеці під іншим прапором?"
 news.45.d:0 "Заступник фюрера Рудольф Гесс загинув сьогодні біля берегів Шотландії під час перехоплення королівськими ВПС важкого винищувача, яким він керував.\n\nМета цього польоту залишається неочевидною. Хоча Гесс був досвідченим пілотом, він летів сам і, наскільки відомо, літак не був споряджений жодною зброєю.\nЙого останки було виявлено британською владою, проте похорон у Берліні з порожньою труною вже призначений.\n\nЗа чутками, Гітлер вражений загибеллю свого старого товариша."
 news.56.b:0 "Принаймні поки що мир..."
 news.6.e:0 "Ще один хоробрий крок наших друзів."
 non_aggression_pact_active:0 "має пакт про ненапад із державою"
 north_america_adj:0 "Північноамериканськ"
 north_atlantic_treaty_org:0 "НАТО"
 nsb_news.2.desc.dem:0 "Сьогодні Польща заволоділа Ліберією! З 1932 року Ліберія вважала Польщу головним інвестиційним партнером і вірила, що ця країна практично не має колоніальних амбіцій, проте угода, укладена між Польщею, Ліберією та Лігою Націй, фактично зробила Ліберію маріонеткою Польщі. Представники США не згодні з таким рішенням: вони вважають ліберійську незалежність необхідним компонентом основоположних принципів країни."
 nsb_news.3.desc:0 "Тепер, коли Центральноазійський регіон міцно перебуває під [From.GetOldAdjective] контролем, [From.GetLeader] своєю владою об'єднує тюркські народи. Нова тюркська адміністрація оголосила, що держава [From.GetOldNameDef] відтепер буде відома як [From.GetNameDef] і послугує домом для всіх тюркських народів.\n\nНавіть за межами цієї нової країни багато тюрків починають вважати державу [From.GetNameDef] своїм істинним будинком, і [From.GetLeader] може скористатися цим, щоби розширити зростаючу націю."
 nsb_news.301.d:0 "Натхненні Тапою Чермоєвим Горські республіки знову об'єдналися, і очолює їх тепер [FROM.GetLeader]. Вони оголосили, що будуть боротися зі всякими іноземними загарбниками і що народжена гірська республіка Північний Кавказ займе своє місце в історії."
 nsb_news.400.b:0 "Підбурювання до війни!"
 nsb_news.400.c:0 "Збочення!"
 nsb_news.402.desc:0 "Виступивши сьогодні із спільною заявою, представники держав [GER.GetNameDef] та [SOV.GetNameDef] оголосили про створення «Осі Берлін–Москва». Дві держави співпрацюватимуть в економічній, політичній та військовій сферах, щоб «захищати свої інтереси». Стверджується, що вони «зацікавлені у стабільності Східної та Центральної Європи».\n\nТакі їх реальні мотиви, покаже час."
 nsb_news.403.b:0 "Вони провертають свої махінації прямо у нас під носом?!"
 nsb_news.404.t:0 "Підйом Третього Риму"
 nsb_news.6.a:0 "Польща переродилася і стала сильнішою."
 nsb_news.6.t:0 "Націоналісти захоплюють польський уряд"
 nuclear_facility_desc:0 "Експериментальні центри для ядерних досліджень дозволяють розпочати дослідницькі проекти, пов'язані з використанням ядерної енергії."
 nuclear_reactor_heavy_water_desc:0 "Ця споруда виробляє в області збагачений уран для використання в ядерній зброї.\nЯдерні реактори, які працюють на важкій воді, дещо дешевші в будівництві від графітових реакторів, але виробляють менше матеріалу, який можна використати у виробництві ядерної зброї."
 nuke_dropped.6.a:0 "Legacy and beauty mean nothing in a war like this."
 nuke_dropped.8.d:0 "A nuclear bomb was detonated today over the capital of the United States. In an attack clearly directed at the political center and historical legacy of the US, the White House, the Capitol and a number of monuments and memorials were wiped off the face of the Earth by their enemy, [?global.nukecountry.GetNameDef]. Even the Burning of Washington over a century ago pales in comparison to the destruction visited upon the city by this devastating weapon.\n\nAlthough President [From.From.Owner.GetLeader] has been brought to safety, the nation has been shaken to its core. No doubt, the US hoped to be the first and only country to wield such a weapon. Those hopes have now been shattered in the worst possible way."
