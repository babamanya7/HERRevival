 GetNorwegianClaims_iceland:0 "Ісландії. [NOR.GetAdjectiveCap]а влада наполягає на тому, що вони були неправомірно утримані данською короною, коли був сформований нинішній норвезький королівський дім."
 HABSBURG_discounted_licenses_desc:0 "Ми можемо не мати найсучаснішої доступної зброї, але це не проблема, оскільки наші політики підтримують контакти з людьми, які можуть допомогти нам отримати доступ до кращих іноземних технологій для виробництва на наших власних підприємствах. Використовуючи цю розгалужену мережу, ми отримаємо права на виробництво найкращого обладнання, а використовуючи нашу величезну промисловість, ми матимемо можливість забезпечити ним всю армію."
 HABSBURG_joint_consumer_goods_endeavors:0 "Дунайський Центральний Банк"
 HABSBURG_joint_ft_unlock_tt:0 "Відкриває Австро-Угорське §YОб'єднане дерево фокусів§!"
 HABSBURG_motorizing_the_armies:0 "Моторизація військ"
 HABSBURG_offensive_hussars_desc:0 "Наша відроджена гусарська сила має зазнати деяких змін, щоб бездоганно ввійти в нашу тепер більш сучасну армію. Нинішня польська важка кіннота та її крилаті гусари колись вселили страх і пошану в серця ворогів. Зважаючи на це, стає абсолютно очевидним, що наші нові гусари повинні діяти за тією ж моделлю."
 HABSBURG_reinforced_industry:0 "Посилена промисловість"
 HABSBURG_technology_sharing_desc:0 "Наша федерація повна світлих умів. Ми повинні об’єднати й організувати їх для подальшого розвитку нашого регіону та просування нашої федерації до майбутнього, якого вона заслуговує."
 HAN_communism_DEF:0 "Народна республіка Нижня Саксонія"
 HAS_AT_LEAST_5K_INFANTRY_EQUIPMENT:0 "§YКожен член альянсу§!, який має в запасі щонайменше 5000 $infantry_equipment$"
