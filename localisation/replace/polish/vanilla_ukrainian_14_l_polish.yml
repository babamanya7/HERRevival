 SCORCHED_EARTH_STATE_ALREADY_SCORCHED:0 "£trigger_no! Земля в цій області вже випалена.\n"
 SEA_PHI_political_events.10.a:0 "Це має бути взаємовигідно"
 SEA_PHI_political_events.14.a:0 "Ми чинитимемо опір нашим колишнім господарям"
 SEA_PHI_political_events.20.a:0 "Хай щастить, генерале!"
 SEA_PHI_political_events.47.t:0 "[FROM.GetName] відмовляється підтримати плани незалежності"
 SEA_PHI_political_events.7.desc:0 "Представники [FROM.GetLeader] передали його подяку за підтримку наших добровольців та надані військові матеріали. Великий досвід громадянської війни в [FROM.GetNameDef], безсумнівно, означає, що ці ресурси будуть використані ефективно."
 SEA_PRC_faction_events.10.desc:0 "Повідомлення від [FROM.GetLeader] надійшло до нас через неофіційні канали, і, схоже, ізоляція у гірських селах змінила наміри лідера [FROM.GetNameDef]. Тепер він шукає нашої допомоги, щоб об'єднати Китай і захистити його народ від зовнішніх загроз. Це інтригуюча пропозиція, але чи можна довіряти комуністам?"
 SEA_PRC_faction_events.2.desc:0 "Схоже, що [FROM.GetLeader] з [FROM.GetName] та [PRC.GetLeader] з [PRC.GetNameDef] об'єдналися, щоб розділити нашу територію між собою, як змії, якими вони і є. Їхні армії готові перетнути наші кордони будь-якої миті, якщо ми не завадимо їхнім боягузливим спробам. Питання в тому, чи зможемо ми довго стримувати їх обох?"
 SEA_PRC_faction_events.22.a:0 "Сліпий дурень залишається дурнем"
 SEA_PRC_faction_events.3.desc:0 "Схоже, що [FROM.GetLeader] з [FROM.GetName] настільки дурний, наскільки це можливо, адже він відіслав наших посланців з порожніми руками. Наша щедра пропозиція розділити слабшого сусіда між нами наштовхнулася на глуху стіну."
 SEA_PRC_faction_events.30.a:0 "У нас насправді немає великого вибору..."
 SEA_PRC_fourth_army_incident.6.a:0 "Це непотрібне відволікання від нагальних проблем"
 SEA_PRC_fourth_army_incident.6.t:0 "[FROM.GetName] залишає [ROOT.GetFactionName] після інциденту з дружнім вогнем"
 SEA_PRC_political_events.27.desc:0 "\nНезважаючи на підтримку, раніше надану [FROM.GetNameDef], вони відмовилися припинити місію $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ в [CHI.GetNameDef], позбавивши нас можливості розмістити командирів як аташе тут. Вони стверджують, що армія [CHI.GetNameDef] наразі має велике значення для [FROM.GetNameDef]."
 SEA_PRC_request_aid.35.a:0 "Це чудові новини, ми знайдемо їм чудове застосування!"
 SEA_PRC_request_aid.9.desc:0 "Ми отримали телеграму від [FROM.GetLeader] із запитом на укладення угоди про технологічну співпрацю. Ця угода сприяла б «товариському шляху поширення засобів революції через знання та вдосконалення людства»."
 SEA_PRC_zhang_guotao_events.4.a:0 "Зрадник нашої справи"
 SEA_border_incidents_events.6.a:0 "Краще програти з честю, ніж ніколи не спробувати взагалі"
 SEA_china.13.a:0 "Як трагічно"
 SEA_china.15.t:0 "Контроль над [FROM.GetNameDef] передано нам"
 SEA_china_democratic.7.a:0 "Нам все одно не дуже потрібні ці колонії."
 SEA_china_improvement.2.a:0 "Нехай почнеться довга боротьба"
 SEA_china_warlords.1.desc:0 "Надійшло повідомлення з Нанкіна з безпомилковою печаткою центрального уряду. За витіюватою мовою про єдність і національну долю ховається вимога — ми повинні підкоритися [FROM.GetLeader] і визнати владу [FROM.GetNameDef] над нашими володіннями. Жодного місця для переговорів, лише послух або наслідки."
 SEA_china_warlords.5.desc:0 "Визнаючи необхідність національної єдності, [FROM.GetLeader] погодився розпустити [FROM.GetNameDef] і передати всі повноваження [ROOT.GetNameDef]. Їхні збройні сили інтегруються в національну структуру командування, а адміністративні органи розформовуються."
 SEA_imperial_influence_events.230.desc:0 "Флот висунув свої вимоги. Вони бажають, щоб ми збільшили масштаби призову до армії та відправили представників флоту в села, щоб залучити більше молодих чоловіків для майбутніх військових дій. Незважаючи на привід простого зміцнення наших збройних сил, вони, очевидно, також хочуть посилити свій контроль і вплив на [GetImperialInfluenceRulerTitle]. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.500.a:0 "Приготування слід розпочати негайно!"
 SEA_japan_foreign_policy.110.a:0 "Чудово!"
 SEA_japan_foreign_policy.116.a:0 "Мудре рішення"
 SEA_japan_foreign_policy.118.t:0 "[FROM.GetNameDefCap] запрошує нас до свого альянсу"
 SEA_japan_foreign_policy.13.a:0 "За це не варто воювати"
 SEA_japan_foreign_policy.13.desc:0 "\nРаніше цього тижня сили, що належать [JAP.GetNameDef], увійшли та окупували нашу територію [721.GetName], заявивши, що вони виконують місію із захисту регіону від потенційної окупації ворогами. Це явно акт війни, однак ми, ймовірно, можемо просто проігнорувати його, оскільки вони не є ворогом, з яким ми можемо дозволити собі воювати на даний момент."
 SEA_japan_foreign_policy.140.t:0 "[MAN.GetLeader] Seeks to Merge Puppet Administrations"
 SEA_japan_foreign_policy.21.a:0 "Якщо вони цього хочуть"
 SEA_japan_foreign_policy.24.t:0 "[FROM.GetNameDefCap] встановлює контакт із Тубтеном Кунпхелою"
 SEA_japan_foreign_policy.4.desc:0 "[FROM.GetAdjective]а делегація звернулася до нас із пропозицією про співпрацю в їхньому прагненні домінувати на азійському континенті, вимагаючи, щоб ми приєдналися до них у їхніх нинішніх і майбутніх війнах, поки вони переслідують цю мету. Схоже, вони не сприймуть відмову, але чи справді це нам вигідно?"
 SEA_japan_foreign_policy.6.desc:0 "[FROM.GetLeader] відмовляється слухати голос розуму і заявив, що [FROM.GetNameDef] не вступатиме з нами в союз. Чого вони не знають, так це те, що ми не маємо наміру дозволяти їм залишатися нейтральними в майбутньому світовому конфлікті..."
 SEA_japan_foreign_policy.66.t:0 "Проголошення Тимчасового уряду Вільної Індії"
 SEA_japan_foreign_policy.69.t:0 "Японія створює Другу Філіппінську Республіку"
 SEA_japan_foreign_policy.92.t:0 "[FROM.GetAdjective]а влада бажає тісніших зв'язків"
 SEA_japan_foreign_policy.93.a:0 "Відмінно!"
 SEA_japan_news_events.03.t:0 "Падіння Рангуна"
 SEA_japan_popup_events.12.b:0 "Знайдіть винних, Нагако вимагає відповідей!"
 SEA_japan_popup_events.30.b:0 "Ідеали Роно-ха сяють сьогодні найяскравіше"
 SEA_japan_popup_events.32.b:0 "Кансон Арахата має підтримку народу"
 SEA_japan_popup_events.36.t:0 "[FROM.GetNameDefCap] розпалює комуністичні настрої"
 SEA_japan_popup_events.4.t:0 "Переконуючи Імператора"
 SEA_japan_popup_events.43.desc:0 "Дізнавшись про бажання Імператора офіційно оголосити про завершення Східноазійської війни, кілька путчистів під командуванням майора Кендзі Хатанаки зробили крок, щоб переконати Імператорську гвардію допомогти їм зайняти Токійський імператорський палац і помістити Імператора під домашній арешт. Генерали Сідзуїті Танака і Такеші Морі підготувалися швидко покласти край цій спробі державного перевороту, але хто знає, чия сторона візьме гору?"
 SEA_japan_popup_events.6.b:0 "Помістити його під домашній арешт!"
 SEA_japan_tokko_arrest_events.3.a:0 "Нехай з цим розбирається Квантунська армія"
 SEA_japan_tokko_arrest_events.3.c:0 "Вони не становлять для нас загрози, ігнорувати їх"
 SEA_warlords.10.desc:0 "Після падіння Кумульського ханства $KUM_yulbars_khan$ зумів уникнути полону і втік до нас, щоб продовжити боротьбу проти нашого спільного ворога. Ми повинні прийняти його з розпростертими обіймами."
