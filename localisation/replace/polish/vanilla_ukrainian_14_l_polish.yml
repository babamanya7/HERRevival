 LIT_victory_in_trust_desc:0 "У нашому уряді немає нікого, кому ми могли б довіряти, — не можна вірити ні Казісу Грінюсу, ні Аугустінасу Вольдемарасу, ні навіть Раштікісу. Могутні люди боягузливі і віроломні, зате гвинтівці і доброму солдатові вірити можна завжди. Вони принесуть нам перемогу."
