 SWI_secret_pact_with_the_allies_desc:0 "[ROOT.GetName] не готовий до повної війни чи навіть до відкритого приєднання до фракції, але ми можемо бути впевнені, що без друзів ми не будемо в безпеці. Щоб захистити нашу демократію в разі раптового вторгнення, ми можемо таємно зустрітися з [?SWI.SWI_best_dem_ally.GetNameDef] і укласти угоду. Ми пообіцяємо таємно підтримати їх у підготовці до війни, в обмін на те, що вони захистять нас, якщо на нас нападуть."
