 XSM_send_ma_lin_on_hajj_desc:0 "Ма Лінь знає, що його час вийшов, але його усунення без будь-якої причини все одно розлютить населення. Тому ми повинні змусити його відмовитися від своєї посади під приводом паломництва в хадж."
