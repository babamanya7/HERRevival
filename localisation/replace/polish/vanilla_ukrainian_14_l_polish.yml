 germany.98.d:0 "Ми завжди знали, що Югославія, вирізана з Імперії Габсбургів, — штучна держава, що не могла довго протягнути. Етнічні конфлікти, що зріли там, досягли точки закипання, і держава тріщить по швах. Потрібно втрутитися й виправити ситуацію."
 germany.98_tt:0 "§YЯкщо Югославія погодиться, станеться ось що:§!\n"
 get_SOV_ideology_london_desc:0 "Наступ комуністів триває, радянські війська нещодавно зайняли Лондон. Парад перемоги був поспіхом організований Червоною армією ще до того, як були придушені останні осередки опору в місті.\n\nПрихильники комуністів спішно видали списки відомих антикомуністів радянській військовій адміністрації, і на Трафалгарській площі було зібрано Народний суд, щоби покарати винних."
