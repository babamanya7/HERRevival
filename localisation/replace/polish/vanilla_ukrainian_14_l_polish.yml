 ITA_italy_first_desc:0 "Наш славетний дуче ніколи не буде вічно миритися з примхами Гітлера! Ми мусимо прислухатися до уроків Римської імперії; втручання тевтонців у італійські справи ніколи не закінчується добре..."
 ITA_liberation_or_death:0 "Визволення або смерть!"
 ITA_missiolini_conquer_ethiopia:0 "Завоювати Ефіопію"
