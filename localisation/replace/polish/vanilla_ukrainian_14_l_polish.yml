 INTERNATIONAL_MARKET_DRAFT_TOTAL_CONTRACT_COST_TT:0 "Загальна вартість контракту."
 INTERNATIONAL_MARKET_HINT_SCREEN_TEXT:0 "Це екран §Yміжнародної торгівлі§!. Тут ви можете купувати обладнання в інших країн і продавати своє за £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$, що тимчасово збільшить швидкість будівництва.\n\nКоли ви купуєте обладнання, вам потрібно призначити £GFX_civ_factory §Yцивільні фабрики§! до контракту, які вироблятимуть £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$, необхідні для оплати обладнання. Чим більше заводів ви призначите, тим менше буде поставок, і ви швидше отримаєте загальну кількість обладнання. Зверніть увагу, що коли ви призначаєте свої £GFX_civ_factory §Yцивільні фабрики§! для оплати контрактів, вони не можуть бути використані для будівництва будівель.\n\nНа кнопці §YМіжнародний ринок§! з'явиться попередження §YНеефективний контракт§! щоразу, коли один з ваших контрактів не постачає очікувану кількість обладнання або не виробляє очікувану кількість £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$. Контракт продовжуватиметься, але для його завершення знадобиться більше поставок."
 INTERNATIONAL_MARKET_NO_ONGOING_CONTRACTS:0 "У Вас нема активних контрактів."
 INTERNATIONAL_MARKET_ONE_CONVOY_FOR_CONVOYS:0 "Тільки один конвой буде виділений на конвойні контракти."
 INTERNATIONAL_MARKET_SUBSIDIES_ENTRY_NAME:0 "$ARCHETYPE|Y$"
 INTERNATIONAL_MARKET_SUBSIDIES_ENTRY_TRIGGER_TT:0 "    - $DESC$"
