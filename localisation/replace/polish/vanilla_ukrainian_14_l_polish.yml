 SEA_warlords.48.b:0 "Було б розумно не провокувати їх..."
 SEA_warlords.50.desc:0 "Делегація з Сіаню сьогодні прибула до нас, бажаючи обговорити подальші антияпонські заходи на найближчі місяці. Схоже, що [FROM.GetLeader] встановив контакт з КПК у горах Шеньсі і бажає створити з ними альянс. Для цього [FROM.GetLeader] хоче, щоб ми використали наші контакти з [SOV.GetNameDef], щоб отримати прихильність, яка може допомогти в майбутньому конфлікті."
