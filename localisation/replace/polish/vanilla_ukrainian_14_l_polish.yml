 siam.10.a:0 "За [ROOT.GetName]!"
 siam.31.desc:0 "Розширення флоту вимагає наявності підводних човнів, і ми повинні вирішити, де закуповувати наші судна. І [ENG.GetNameDef], і [JAP.GetNameDef] зробили пропозиції — але вибір має наслідки, що виходять за межі суднобудівні."
 siam.4.a:0 "Сюжет ускладнюється."
 siam.42.a:0 "Вітаємо розвиток наших торговельних відносин."
 siam.45.b:0 "Наш альянс залишається нашим власним."
 siam.9.t:0 "Кінець повстання Сонгсурадета"
 siam_adc.1.desc:0 "Надійшла офіційна нота від [FROM.GetNameDef], де [FROM.GetLeader] засуджує нашу триваючу окупацію азійських країн як нестерпну образу їхнього права на самовизначення. Повідомлення стверджує, що Азія — це не приз, який можна розділити або адмініструвати за іноземним бажанням, і вимагає, щоб ми негайно вивели наші сили та відновили незалежний уряд у [?var:SIA_adc_demand_country_to_be_released.GetNameDef].\n\nВимога не залишає місця для непорозумінь. [FROM.GetNameDefCap] очікує виконання, і будь-яка відмова з нашого боку буде пам'ятатися як зумисна образа їхньої нації."
 sinkiang_ma_neutrality:0 "Сіньцзянські Ма"
