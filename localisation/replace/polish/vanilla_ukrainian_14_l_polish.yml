 43TtIsPuppet:0 "[FROM.FROM.OWNER.GetNameDefCap]"
 807_german_name:0 "Готенгафен"
 AAT_Sweden.23.a:0 "Вони будуть загрозою для нашої безпеки."
 AAT_Sweden.30.desc:0 "Держава [FROM.GetNameDef] прийняла наш запит і тепер передає наші старі колонії — на превеликий подив нашого уряду, який очікував більшої відсічі. Це викликало протести на наших нових територіях, але з часом вони, безсумнівно, заспокояться."
 AAT_Sweden.31.b:0 "Це просто смішно."
 AAT_Sweden.33.a:0 "Ми знову перетнемо протоку."
 AAT_Sweden.36.a:0 "Тоді ми візьмемо їх силою."
 AAT_Sweden_ball_bearing.1.d:0 "Поки що припинити переговори."
 AAT_Sweden_ball_bearing.8.desc:0 "Не дивно, що з початком війни між нашими країнами обидва уряди примусово скасували торгівлю кульковими вальницями. Ця торговельна угода, яку колись вітали як сходинку на шляху до послаблення повільного просування до глобальної війни, безсумнівно, провалилася.\nТепер ці ключові інструменти будуть перетворені на машини війни, які в кінцевому підсумку не принесуть нічого, окрім крові, болю та страждань."
 AAT_Sweden_communism.3.t:0 "Зброєві склади зникли"
 AAT_Sweden_flashpoints.13.a:0 "Ми вважатимемо задачу вирішеною."
 AAT_Sweden_flashpoints.51.a:0 "Надішліть армії на підтримку поліції."
 AAT_Sweden_nationalists.26.t:0 "[FROM.GetName] повстає"
 AAT_Sweden_nationalists.4.t:0 "Об'єднати націонал-соціалістичний рух"
 AAT_Sweden_nationalists.6.a:0 "Вони потроху набирають обертів."
 AAT_Sweden_nationalists.6.desc:0 "Сьогоднішній марш штурмовиків у регіоні [FROM.FROM.GetName] був напрочуд нудним. Організатори змогли зібрати лише жменьку учасників, і повели строкату команду ходою центральними вулицями, в той час як люди продовжували займатися своїми справами. Незважаючи на низьку явку, штурмовики дедалі набирають обертів у державі [SWE.GetAdjective]."
 AAT_Sweden_nordic_defense_council.1.a:0 "Маємо інші плани."
 AAT_Sweden_strike.1.desc:0 "Імовірна загроза продовольчої блокади, подібної до тієї, що була під час Великої війни, призвела до протестів серед [SWE.GetAdjective]ої робочої сили. Підбурювані місцевими підпільниками, заворушення поширилися з заводів і стали загальнонаціональною проблемою. Ми повинні стабілізувати ситуацію та переконатися, що уряд сприймається як сильна керівна рука в ці непевні часи."
 AAT_britain_narvik.2.b:0 "Ми повинні їх зупинити!"
 AAT_finland_continuation_war.13.desc:0 "Схоже, що представники держави [FIN.GetNameDef] звернулися до основних демократичних держав у спробі ухилитися від війни з нами, пропонуючи їм свій вступ до війни проти [GER.GetAdjective]ої держави й у такий спосіб фактично переходячи на інший бік. Якщо союзники погодяться на це, нам залишиться лише скаржитися і вимагати компенсації — але у нас, принаймні, з'явиться новий напарник у боротьбі з фашизмом."
 AAT_finland_diplomacy.01.b:0 "Ми можемо співпрацювати, зберігаючи автономію."
 AAT_finland_diplomacy.03.t:0 "[FROM.GetName] приєднується до альянсу [ROOT.GetFactionName]"
 AAT_finland_diplomacy.08.a:0 "У нас немає можливості опиратися їхнім вимогам."
 AAT_finland_diplomacy.16.desc:0 "[FROM.GetAdjective]ий уряд заявив, що наші нові пропозиції порушують підписані раніше угоди між нашими державами, і послався на міжнародні закони, зазначивши, що наші ідеї щодо уніфікації є незаконними та несправедливими."
 AAT_finland_diplomacy.18.a:0 "Це правильне рішення"
 AAT_finland_diplomacy.19.b:0 "Нехай знають, що ми йдемо за ними"
 AAT_finland_kinship_war.02.b:0 "Ми дозволимо фінським агітаторам перетнути кордон."
 AAT_finland_misc_events.04.t:0 "Виплата за допомогу"
 AAT_finland_motti.01.a:0 "Будьте напоготові та готуйтеся до бою!"
 AAT_finland_the_white_death.2.t:0 "[FIN.GetAdjective]і снайпери вселяють страх у серця наших солдатів"
 AAT_finland_the_white_death.9.desc:0 "Наші офіцери в державі [FIN.GetNameDef] повідомили про успішне усунення [FIN.GetAdjective]ого снайпера на прізвисько Біла Смерть. Під час цього полювання ми зазнали великих втрат, але зате держава [ROOT.GetNameDef] позбулася небезпечного ворога і солдати тепер зможуть зітхнути спокійно."
 AAT_nordic_shared.1.desc_non_faction_member:0 "[FROM.GetNameDefCap] працює над налагодженням глибокої співпраці між усіма Нордичними країнами. Вона хоче створити альянс [NORDIC_get_alliance_name] і запрошує нас приєднатися до них."
 AAT_norway.6.desc:0 "Минув деякий час відтоді, як ми помістили Лева Троцького під домашній арешт на фермі в Гурумі, і, схоже, це не дуже влаштовує жодну зі сторін, котрі беруть участь у справі. [SOV.GetNameDefCap] вимагає екстрадиції, «Національна єдність» хоче, щоби його повісили, а всі інші, хто не є затятим троцькістом, хочуть, щоб його випустили. Нам потрібно вирішити, що робити з цим проблемним вигнанцем.\n\nПрезидент Мексики [MEX.GetLeader] запропонував прийняти його, якщо ми вирішимо дозволити йому продовжити вигнання, але ми також можемо просто відправити його лідеру [SOV.GetLeader] на знак дружби."
 AAT_norway.9.desc:0 "Уряд, очолюваний Лейбористською партією на чолі з Юганом Нюгошволдом, є першим стабільним урядом з явною більшістю, який коли-небудь мала наша молода країна. Кабінет міністрів наполегливо працював протягом минулого року, просуваючи заходи, які, хоч і повільно, але допоможуть державі [NOR.GetName] вийти з глибокої економічної кризи, в якій зараз перебуває країна, забезпечивши добробут людей, що живуть в ній.\n\nЗвісно, ці заходи здійснюються ціною будь-яких військових приготувань, які можуть знадобитися нам, якщо ми опинимося в оточенні війни. Залишається лише сподіватися, що вони не знадобляться."
 AAT_norway_allied.1.t:0 "[FROM.GetName] шукає інвестиції"
 AAT_norway_allied.2.desc:0 "Наші заклики до [FROM.GetAdjective]ого уряду увінчалися успіхом, і вони погодилися інвестувати в нашу економіку. Це також означатиме, що ми станемо ближчими до них і, можливо, навіть розглядатимемо їх як наших союзників у майбутньому."
 AAT_norway_communist.4.desc:0 "Наші товариші в державі [FROM.GetName] потребують нашої допомоги. Оскільки їхня революція зблизила їх з нами, є сенс підтримати їхні зусилля з модернізації армії.\n\nБуде політичною перемогою для нас, якщо ми підтримаємо комуністичну країну і покажемо їхнім робітникам, як це робить [ROOT.GetNameDef]."
 AAT_norway_rikstanken.1.c:0 "[?NOR_fascist_tank_seller.GetAdjectiveCap]і танки перспективні."
 AAT_norway_rikstanken.2.desc_NORDIC:0 "Наш сусід, [?NOR_nordic_tank_seller.GetName] — Нордична країна, як і ми — безумовно, має розвинену військову промисловість, яку ми могли б використовувати для постачання наших бронетанкових військ, але це було б дуже дорого для нашої маленької країни.\n\nУ нас також є можливість купити один танк і подивитися, куди ми зможемо рухатися далі."
 ABDA_maintain_strategic_flexibility:0 "Збереження стратегічної гнучкості"
 ABK_communism_ADJ:0 "Абхазьк"
 ABORT_DISMANTLE_FACILITY_DESC_TT:0 "§GКлацніть§!, щоби скасувати демонтаж комплексу."
 ADD_DEFENSE_SKILL:0 "Додати навичку оборони: $NUM|+$"
 ADD_FACILITY_DESCRIPTION:0 "Ви впевнені, що хочете витратити £faction_initiative_texticon $COST|.0$ на додавання вашого комплексу $FACILITYNAME|H$ в області $STATE|H$ до $FACTIONNAME|H$, щоб інші могли підтримувати ваші дослідження?"
 ADD_GOAL:0 "§GКлацніть, аби додати ціль.§!"
 ADD_PLANNING_SKILL:0 "Додати навичку планування: $NUM|+$"
 AFA_GATHERING_STORM_DESC:0 "The Afar people have long lived in the vast Danakil desert, spanning from Djibouti in the east to Ethiopia in the west. Recently however, Italy has been gaining increased influence over the state, with Mohammed Yayyo favoring Benito Mussolini over Haile Selassie. \n\nWith the second Italo-Ethiopian war now raging, it seems as though a stance will need to be taken in the near future, will the future of the Afar lie with Italy, or will they be better off on their own?"
 AFA_communism_party:0 "АРФДЄ"
 AFG_BUK_emirate_neutrality_DEF:0 "Емірат Афганістан"
 AFG_a_royal_successor_decision_desc:0 "Якщо ми хочемо надійно закріпити свою владу над цією країною, нам слід вирішити, хто займе посаду прем'єр-міністра, оскільки лідерські здібності $AFG_mohammad_hashim_khan$а наразі ставляться під сумнів як на міжнародному, так і на внутрішньому рівні."
 AFG_alliance_with_turkik_peoples_desc:0 "У рамках наших стратегічних цілей на півночі важливо послабити існуючі владні структури, розпалюючи заворушення серед тюркських народів у регіоні. Використовуючи існуючі скарги та плекаючи інакомислення, ми можемо дестабілізувати місцеві уряди та створити більш сприятливе середовище для нашої експансії."
 AFG_communism_ADJ:0 "Афганськ"
 AFG_cross_border_target_state:0 "Сприяти опору в §Y[FROM.GetName]§!"
 AFG_establish_darulaman:0 "Створити Даруламан"
 AFG_form_the_khuddamul_furqan:0 "Сформувати Худдамуль Фуркан"
 AFG_implement_currency_controls_desc:0 "Нашій економіці бракує сильного фінансового сектору, який міг би підтримати економічний розвиток нації. Тому ми повинні співпрацювати з приватним сектором для створення спільного банку, який може пропонувати послуги нашим новим галузям промисловості та підприємствам."
 AFG_increase_agricultural_exports_desc:0 ""
 AFG_industrial_events.22.desc:0 "$bftb_greece.194.desc$"
 AFG_industrial_events.33.b:0 "Тоді ми виправимо ситуацію силою."
 AFG_khorasan_neutrality_DEF:0 "Хорасан"
 AFG_linchpin_of_global_defense_desc:0 "Союзники продовжують розглядати нашу відданість як актив у їхньому геополітичному протистоянні з нашими спільними супротивниками. Ми повинні скористатися цим, забезпечивши більше інвестицій у військову інфраструктуру, що буде взаємовигідним для всіх нас."
 AFG_militia_cavalry:0 "Кіннота Катгані"
 AFG_mughal_emirate_neutrality:0 "Емірат Великих Моголів"
 AFG_mughal_party:0 "House of Babur"
 AFG_parliamentary_democracy:0 "Парламентська демократія"
 AFG_political_events.01.b:0 "У нас є альтернативні плани щодо регіону."
 AFG_political_events.111.a:0 "Чудово!"
 AFG_political_events.157.a:0 "Чудово!"
 AFG_political_events.158.a:0 "Нам може знадобитися більше союзників у регіоні."
 AFG_political_events.173.desc:0 "Оскільки багато хто ставить під сумнів рішення, які принйяв $AFG_mohammad_hashim_khan$, було вирішено зміцнити королівську владу шляхом призначення одного з його братів або сестер новим лідером, підпорядкованим $AFG_mohammed_zahir_shah$у. Хто ж замінить його?"
 AFG_political_events.51.a:0 "Нам знадобиться більше союзників у регіоні."
 AFG_political_events.62.a:0 "З часом вони зрозуміють свою помилку."
 AFG_political_events.73.t:0 "[FROM.GetNameDefCap] приймає територіальну поступку"
 AFG_political_events.75.a:0 "Тоді ми повинні готуватися до війни."
 AFG_political_events.80.t:0 "[FROM.GetNameDefCap] вимагає узгодження зовнішньої політики"
 AFG_political_events.86.desc:0 "[FROM.GetNameDefCap] погодився на нашу пропозицію про оборонний пакт. Цей пакт гарантує, що обидві наші нації підтримуватимуть одна одну у разі війни, посилюючи наше стратегічне становище. З військовою силою [FROM.GetNameDef], що підтримує нас, наші амбіції стати домінуючою силою в ісламському світі тепер більш досяжні."
 AFG_prepare_for_operation_countenance:0 "Підготуватися до операції «Зіткнення»"
 AFG_recruit_foreign_experts:0 "Набрати іноземних експертів"
 AFG_red_threat_desc:0 "З нашими таємними союзниками в Центральній Азії ми стикаємося з унікальною можливістю послабити [SOU.GetAdjective] вплив та розширити наш власний. Ми скоординуємо наше вторгнення з осередками опору по всьому регіону, поваливши ворога, перш ніж вони навіть зрозуміють, що відбувається."
 AFG_relieve_quami:0 "Демобілізувати нерегулярні війська"
 AFG_repeal_the_durand_line_desc:0 "Ми довели себе як надійний друг у регіоні для Союзників. Можливо, зараз слушна нагода переглянути Лінію Дюранда, яку нам жорстоко нав'язали багато років тому."
 AFG_revive_the_workshop_of_the_world:0 "Відродження майстерні світу"
 AFG_topple_iran:0 "Повалити Іран"
 AFG_unify_the_islamic_world_desc:0 "Надто довго мусульманські держави сперечалися через несуттєві питання, нехтуючи своєю відповідальністю за співпрацю. Нарешті настав час для нас простягнути запрошення мусульманським державам світу, щоб об'єднатися у великий альянс."
 AFG_united_islamic_world_faction:0 "Іттехад-е Ісламі"
 AIRWING_ATTACHED:0 "§HПрикріплені авіакрила:§!"
 AIRWING_CREATE_EMPTY:0 "§RНе можна створити порожнє авіакрило!§!"
 AIRWING_DELETE:0 "Видалити авіакрило"
 AIRWING_MISSION_TYPE_AIR_SUPERIORITY:0 "Перевага в повітрі"
 AIRWING_MISSION_TYPE_INTERCEPTION_DESC:0 "Намагатися перешкоджати ворожим літакам виконувати завдання в регіоні, як-от бомбардування та підтримка з повітря."
 AIRWING_MISSION_TYPE_TRAINING_DESC:0 "Збільшувати досвід цього §Hавіакрила§! та §Hдосвід авіації§!.\nЛітаки споживатимуть §Hпальне§!, а ризик §Hнещасть у повітрі§! буде збільшений, поки проводяться §Hтренування§!.\n§RАктивація цього завдання деактивує всі інші.§!"
 AIRWING_MOVE_EQUIPMENT_ALL:0 "Перемістити все оснащення"
 AIRWING_SET_REINF_LIMIT_HEADER:0 "Установити межу підкріплень."
 AIR_ASSIGN_ALL_INSTANT_DISABLED:0 "§Rнемає неприкрілених авіакрил у зоні досяжності.§!"
 AIR_CANNOT_SELECT_ALL:0 "§RНічого вибирати.§!"
 AIR_LEDGER_THRESHOLD_FUZZY_TOTAL_AIRWING_COUNT:0 "Приблизна кількість авіакрил"
 AIR_LEDGER_THRESHOLD_TECH_COUNT:0 "Кількість авіаційних доктрин і технологій"
 AIR_OVERVIEW_CATEGORY_REGULAR_4:0 "$COUNT|H$ §Hтактичних бомбардувальників§!"
 AIR_REGION_RIGHT_CLICK_NOT_ALL:0 "§RНе всі вибрані авіакрила можна призначити сюди:§!"
 AIR_SHOW_EMPTY_CARRIERS:0 "Порожні авіаносці"
 AIR_STICKY_MISSION_AREA_CHOICE_YES:0 "Авіакрила слідуватимуть за цим авіаносцем, якщо він покине регіон, у якому вони працюють."
