 NSB_Soviet_fascist_civil_war.001.t:0 "[GetSovietCivilWarName]!"
 NSB_poland_communist_events.202.t:0 "[From.GetNameDefCap] відмовляється"
 NSB_poland_communist_events.4.desc:0 "[From.GetNameDefCap] пропонує здати нам Східну Польщу в обмін на статус протекторату та близьку інтеграцію з СРСР. Якщо ми приймемо пропозицію, [From.GetNameDef] стане маріонеткою, якою керує держава [Root.GetNameDef], а білоруські та українські землі, окуповані зараз Польщею, відійдуть СРСР.\n\nЦе здається очевидним вибором, але німецькі амбіції в Польщі можуть призвести до неминучої війни між державами [Root.GetNameDef] та [GER.GetNameDef]."
 NSB_poland_communist_events.501.a:0 "Отже, бути війні."
 NSB_poland_communist_events.601.a:0 "Наша нація знову єдина."
 NSB_poland_events.201.t:0 "Угорщина поступається"
 NSB_poland_events.3.a:0 "Ми згодні."
 NSB_poland_events.8.a:0 "Спаліть докази. Світ не повинен дізнатися про це."
 NSB_poland_monarchist_events.1.a:0 "Ми мусимо чинити опір."
 NSB_polish_fascist_events.202.desc:0 "Схоже, що Німеччина має інші плани на Литву. Наша пропозиція анексії одноголосно відкинута."
 NSB_soviet_academy_of_sciences.1.t:0 "Закладення [THIS.GetAdjective] академії наук"
 NSB_soviet_civil_war_common.010.c:0 "Троцький — істинний герой революції"
 NSB_soviet_civil_war_common.106.desc_right_opp_before:0 "Групи опозиціонерів у державі [FROM.GetNameDef] задумують переворот проти Сталіна. Вони звернулися до нас із проханням про таємну допомогу в нарощуванні військової могутності в обмін на майбутні права на нафту з місця."
 NSB_soviet_civil_war_common.109.a:0 "Буде цікаво."
 NSB_soviet_civil_war_common.109.t:0 "Надсилання «радників» до держави [SOV.GetNameDef]."
 NSB_soviet_civil_war_common.113.a:0 "Тепер у тебе, [SOS.GetLeader], одним ворогом більше."
 NSB_soviet_civil_war_common.115.desc:0 "Радянські опозиціонери звернулися до нас із проханням про таємну підтримку. В обмін на припаси та нарощування військової потужності вони готові прийняти повернення [BLR.GetAdjective] засланого уряду."
 NSB_soviet_civil_war_common.120.desc:0 "Ми успішно зібрали кошти в державі [FROM.GetNameDef], але його уряд відмовляється забезпечити нас зброєю."
 NSB_soviet_fascist_tsarist.10.desc:0 "[FROM.GetNameDef] нарешті приймає фашизм, проте, незважаючи на всю нашу допомогу у посиленні їхньої фашистської партії та пропозицію місця в нашому альянсі, держава відкинула нашу пропозицію і вирішила діяти самостійно."
 NSB_soviet_fascist_tsarist.6.desc:0 "[FROM.GetNameDef] приймає нашу пропозицію і вступає до нашого альянсу!"
 NSB_soviet_for_the_common_good.1.desc:0 "Колектив сильніший за одинаки. Це ж вірно і для економіки. [SOV.GetNameDefCap] збирається реорганізувати економіку всіх своїх союзників так, щоб вона краще служила всьому альянсу, а не одній конкретній країні. Це означає, що нам треба буде перебудувати економіку і, можливо, спершу зіткнутися з труднощами, але потім усім буде краще."
 NSB_soviet_foreign_politics_events.10.t:0 "[FROM.GetNameDefCap] хоче інвестувати в нашу економіку"
 NSB_soviet_foreign_politics_events.152.desc:0 "Схоже, що наші спроби вирішити проблеми з державою [FROM.GetNameDef] дипломатично зайшли в глухий кут. Зателефонувавши нашим партнерам в надії, що [FROM.GetLeader] погодиться на новий раунд переговорів, наш посол отримав : [FROM.GetAdjective] уряд ясно виклав свою позицію, і більше обговорювати нічого."
 NSB_soviet_foreign_politics_events.270.t:0 "[FROM.GetAdjectiveCap]е розширення Транскаспійської залізниці"
 NSB_soviet_foreign_politics_events.272.b:0 "Вони грають з вогнем!"
 NSB_soviet_nationalist.002.t:0 "[FROM.GetNameDefCap] вимагає підпорядкування"
 NSB_soviet_paranoia_system_events.23.b:0 "У сучасній армії така не рідкість."
 NSB_soviet_paranoia_system_events.38.desc:0 "Після доповідей політруків про незвичайну діяльність на флоті НКВС почав ретельне розслідування і виявив велику мережу офіцерів, налаштованих вкрай критично і навіть вороже до радянської системи. Більшість з них стверджують, що [Root.Get] і що вони самі вірні Радянському Союзу, але очевидно, що їх легко могли завербувати іноземні розвідки. Більше того, допити показали, що деякі з заарештованих вже шпигуть за нами на користь капіталістичних країн."
 NSB_soviet_policies_of_collective_security.1.t:0 "[FROM.GetNameDefCap] пропонує пакт про взаємодопомогу"
