 LIT_promote_fascism_desc:0 "Протягом десятиліть фашизм витіснявся на узбіччя польської політики. Хоча ми хотіли б, щоби поляки повстали за себе, у них навряд чи буде шансів, якщо ми відкрито не пропагуємо фашизм в їхній країні."
