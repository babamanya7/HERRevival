 DEN_neutrality_monarchist_party:0 "Монархісти"
 DEN_north_sea_oil_drilling:0 "Буріння нафти у Північному морі"
 DEN_sanction_sabotages_desc:0 "Навіть якщо ми співпрацюємо з [?DEN.DEN_overlord_nation.GetNameDef], це не обов'язково означає, що ми не можемо чинити опір окупації мирним шляхом. Можна стверджувати, що наш обов'язок — чинити опір, не наражаючи на небезпеку наших людей."
 DEN_secure_the_norwegian_coast_desc:0 "Данія та Норвегія були об'єднані протягом століть, і якщо ми хочемо контролювати Північне море або розширюватися далі, ми повинні знову об'єднати наші країни. Норвезьке узбережжя є життєво важливим плацдармом, якщо ми хочемо домінувати в Атлантиці."
 DEN_swedish_steel_production_category:0 "Пропонувати шведську сталь для захисту"
 DEN_unlock_stalvalsevaerket_tt:0 "Відкриває промисловий концерн §Y$DEN_danske_stalvalsevaerket_ns$§!"
 DEN_welfare_high_range:0 "Високі витрати на добробут"
 DEPLOYMENT_HOW_TO_DESC:0 "Виберіть військові частини зі списку та §Gклацніть§! по виділених провінціях, щоби розгорнути їх.\n§gВійськові частини, не до кінця укомплектовані оснащенням, отримають її крізь запити на поповнення.\nЧастини, розгорнуті раніше належного, не пройшли належну підготовку.§!"
 DEPLOYMENT_TEMPLATE_ITEM_VIEW:0 "§GКлацніть, щоб оглянути шаблон дивізій.§!"
