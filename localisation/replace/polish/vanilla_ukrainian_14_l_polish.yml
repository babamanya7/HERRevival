 ETH_executive_council_desc:0 "Ми повинні сприяти більшій співпраці в Організації африканської єдності, створивши виконавчий орган, який діятиме відповідно до волі народу та зможе швидко реагувати на загрози стабільності в нашому регіоні."
 ETH_formal_request_unlocked_tt:0 "Відмикає §Yрішення§! подати офіційний запит до приймаючої країни щодо приєднання до війни, якщо уряд у вигнанні"
 ETH_gets_the_following_states_tt:0 "[ETH.GetNameDefCap] отримає ось ці області:"
 ETH_harar_lost_tt:0 "Втрата контролю над Харером знизить підтримку війни серед народу."
 ETH_improve_country_category_desc:0 "[ETH.GetNameDefCap] — переважно сільськогосподарська економіка, яку ведуть фермери, що ведуть натуральне господарство. Щоб індустріалізуватися, нам потрібні величезні інвестиції в електрифікацію і транспортну інфраструктуру, щоб більше робітників змогли перейти з сільського господарства на заводи і фабрики."
 ETH_international_brigades_communist_desc:0 "У всьому світі є багато тих, хто співчуває нашій боротьбі проти [ITA.GetAdjective]ої армії. Ми повинні скористатися їхньою симпатією і дати їм можливість виступити разом із нами проти фашизму."
 ETH_invite_italian_settlers_tt:0 "§Y2 області у власності§! отримають кілька поселенців із держави [ITA.GetName], змінивши їх із сільських чи пасовиських регіонів і надавши §Yнові комірки для будівництва.§!"
 ETH_italian_control_mission_desc:0 "[ITA.GetName] намагається встановити контроль над нашою територією за допомогою грубої сили. Ми повинні дати їм відсіч."
 ETH_liberate_SOM_tt:0 "Отримає ціль війни проти власників [SOM.GetAdjective]ої території."
 ETH_move_capital_to_axum:0 "Перемістити столицю в Аксум"
 ETH_new_weapons_and_tactics_desc:0 "Не відставати від технологічного прогресу інших армій вимагає постійних інвестицій у нашу власну, щоб вони завжди були оснащені та навчені протистояти останнім загрозам."
 ETH_raise_the_chitet_effect_tt:0 "Піднімає ополчення."
 ETH_rally_around_the_emperor:0 "Згуртуватися навколо імператора"
 ETH_regional_training_centers:0 "Регіональні центри тренування"
 ETH_support_anti-colonialist_resistance_desc:0 "Загроза конфлікту висітиме над нами нескінченно довго, якщо колоніальні держави збережуть свою опору в Східній Африці. Ми повинні витіснити їх з регіону, розбудивши маси та давши їм засоби відновити свою незалежність."
 ETH_the_one_true_heir_of_solomon_desc:0 "Його Величність [ETH.GetLeader] може простежити свій королівський родовід аж до великого царя Соломона. Хоча багато країн відвернулися від Бога, ми — [ETH.GetAdjective]ий народ — залишаємося непохитними у своїй вірі. У цю добу хаосу цілком правильно, щоб єдиний справжній спадкоємець Соломона правив над святою землею, щоби захистити її від руйнівного впливу створених людиною ідеологій."
