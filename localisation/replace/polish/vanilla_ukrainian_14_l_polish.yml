 OPERATIVE_NATIONALITY_DESC:0 "Агент має перевагу, проводячи діяльність у країні, громадянство якої він має.\n\nЗауважте: для завдань £operative_mission_icons_small|1£ $OPERATIVE_MISSION_BUILD_INTEL_NETWORK_TITLE$, £operative_mission_icons_small|2£ $OPERATIVE_MISSION_QUIET_INTEL_NETWORK_TITLE$ та £operative_mission_icons_small|4£ $OPERATIVE_MISSION_ROOT_OUT_RESISTANCE_TITLE$ враховується окупована країна, а якщо такої немає — країна-розпорядник."
