 MAN_TSR_GATHERING_STORM_DESC:0 "Маньчжурська імперія стоїть на хиткому фундаменті. Створена як спосіб легітимізувати своє панування над Маньчжурією в 1932 році, японці вирішили дозволити Пуї стати імператором нової держави.\n\nПитання полягає в тому, чи буде Пуї продовжувати залишатися в тіні, поки Асоціація «Конкордія» і японська армія керують країною, або ж він спробує повернути собі владу, і, в свою чергу, потенційно втратить її повністю через групу бандитів, які також претендують на цю роль?"
