 ENG_continental_intervention_desc:0 "Очевидно, що ми не зможемо зберегти баланс сил на європейському континенті, якщо не будемо діяти. Ми мусимо розгромити експансіоністські режими, які з'явилися останнім часом, гарантуючи, що ми ніколи не зіткнемося з загрозою об'єднаної Європи, здатної підготувати вторгнення на Британські острови, не відволікаючись на сторонні справи."
