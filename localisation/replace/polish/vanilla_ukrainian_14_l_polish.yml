 FOREIGN_TEMPLATE_DESC:0 "Це — шаблон нашого суб'єкта $COUNTRY|H$. Ми можемо скопіювати цей шаблон і створити колоніальні війська на його основі. Війська з цим шаблоном братимуть людські ресурси своєї батьківщини в залежності від рівня автономії."
