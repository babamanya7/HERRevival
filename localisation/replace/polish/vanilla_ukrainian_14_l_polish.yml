 PRC_naval_infrastructure_effort:0 "Розвиток морської інфраструктури"
 PRC_noteable_guotao_support_range:0 "Notable support of Guotao"
 PRC_petition_for_freedom_not_subject_tt:0 "§YНе має ефекту, якщо країна не є суб'єктом§!"
 PRC_raid_weapon_depots_tt:0 "Розблоковує §Y$raid_type_PRC_weapons_depot_raid$§! там, де [ROOT.GetNameWithFlag] створила §Yпартизанські осередки§! або §Y$PRC_anti_japanese_base$§!, щоб отримати §Y$infantry_equipment$§! та §Y$artillery$§!"
 PRC_resource_extraction_focus:0 "Видобуток ресурсів"
 PRC_role_of_kangda_desc:0 "Наша головна військова школа, Школа Червоної армії в [622.GetName] — також відома як Канда (Kàngdà) — раніше зосереджувалася на навчанні. Тепер вона стане центром інновацій зі збільшеним фінансуванням, зосереджуючись на доктринах і розробці обладнання, як вітчизняного, так і іноземного."
 PRC_sea_enforce_the_three_rules:0 "$PRC_enforce_the_three_rules$"
