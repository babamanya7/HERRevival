 ETH_ITA_fascism_autonomy_dominion_DEF:0 "Королівство Ефіопія"
 ETH_amedeos_feast_of_maskal_desc:0 "Щоб забезпечити подальшу стабільність [ETH.GetName], ми зберемо решту расів до мескельського бенкету принца Амедео в м. [ETH.Capital.GetCapitalVictoryPointName]. Там ми зустрінемося з віце-королем [ITA.GetAdjective]ої Східної Африки й обговоримо майбутнє регіону."
 ETH_an_audience_with_countryleadertitle_desc:0 "[GER.GetLeader] має амбіційні плани щодо зміни порядку не лише [GER.GetNameDef], а й усього світу. Отримавши аудієнцію з лідером [GER.GetAdjective], світ і надалі бачитиме Його Величність [ETH.GetLeader] єдиним справжнім правителем [ETH.GetName]."
