 rocket_interceptor_desc:0 "Реактивні перехоплювачі, створені на основі спеціальних корпусів, здатні деякий час летіти швидше за будь-який інший літак. Нестабільність палива робить ці літаки небезпечними, зате вони можуть злітати і відповідати на атаки швидше, ніж чекає противник."
