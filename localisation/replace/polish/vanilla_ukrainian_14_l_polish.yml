 YUG_allied_air_combat_school_desc:0 "Наші нові союзники мають великий досвід ведення повітряних боїв. Наполягаючи на створенні спільної повітряної бойової школи союзників, ми можемо гарантувати, що наші новобранці-пілоти зможуть вільно навчати цінних уроків, які наші союзники виклали кров'ю."
 YUG_armored_cavalry:0 "Бронекавалерія"
 YUG_army_maneuvers_desc:0 "Щоб привести нашу армію у форму, необхідно провести нові маневри. Цей досвід також, безсумнівно, приведе до нових уявлень про сучасну війну."
