 POLITICS_PAUSED_NO_POLITICAL_POWER:0 "§RЦя дія призупинена через відсутність політичної влади.§!"
 POLITICS_STAGE_COUP_INVALIDATE:0 "\n\n§HПереворот буде автоматично скасовано, якщо ціль опиниться у стані громадянської війни, змінить ідеологію на вибрану або приєднається до однакового альянсу.§!"
