 RAJ_GOE_hostile_takeover_decision:0 "[FROM.owner.GetFlag] Купити [FROM.GetName] у [FROM.owner.GetName]"
 RAJ_GOE_vie_for_princes_tt:0 "\nДодає §Y1§! тиску на [THIS.GetName], спонукаючи їх приєднатися до нас. Зменшує нашу доступну можливість тиснути на держави на §Y1§! (Наразі [?ROOT.pressure_left]/[?ROOT.default_pressure]) \n\n§YПоточний тиск на державу:§![GetPressureTextRAJ]"
 RAJ_SH_battleship_1_desc:0 "The Centurion was a class of hypothetical heavy battleships of the Royal Navy built to counter the large vessels of the German and Japanese navies. Large 18 in. guns and thick armor provide the ship with the necessary firepower and protection to battle these vessels. Strong AA armament, long range, and good speed were a necessity to cover the vast seas of the British Empire."
 RAJ_SH_battleship_2:0 "$ENG_SH_battleship_2$"
 RAJ_a_tiger_unchained_desc:0 "Ми створимо елітні підрозділи, здатні освоїти найсуворіші гірські місцевості. Ці тигри вершин вселятимуть страх у наших ворогів та забезпечать наше домінування в горах."
 RAJ_agricultural_cooperatives_desc:0 "Сільськогосподарські кооперативи, що належать кільком фермерам, є ключем до стійкості, самодостатності та розширення можливостей."
 RAJ_akhand_bharat_tt:0 "Відмикає рішення про претензії на штати в [AFG.GetName], [MLD.GetName], [NEP.GetName], [PAK.GetName], [BAN.GetName], [BHU.GetName], [SRL.GetName] та формування Акханд Бгарат. Ми можемо обирати країну для претензій по черзі, після чого нам потрібно окупувати всі існуючі ключові території, щоб претендувати на більше."
 RAJ_armoured_corps_center_and_school:0 "Центр бронетанкового корпусу"
 RAJ_azad_hind_dlc_desc:0 "Азад Гінд представляє кульмінацію нашої боротьби за визволення — уряд у вигнанні, присвячений припиненню британського правління. З мобілізованими силами та чітким баченням, він готовий вести Індію до свободи через силу та рішучість."
 RAJ_bhutanese_protectorate_desc:0 "Нам потрібно поважати ізоляцію [BHU.GetAdjective] народу, але водночас ми не можемо заперечувати реальність того, що маленькі країни будуть поглинені тими, хто має імперські амбіції. Ми запропонуємо їм захист під Індійським крилом."
 RAJ_conquerors_of_turkey_desc:0 "Анатолія колись була полем битви для імперій, і історія пам'ятає тріумф Тимура над Османами. Проте наступник цього розбитого султанату все ще стоїть, чіпляючись за землі, які по праву належать нашому правлінню. Рухаючись на захід знову, ми зруйнуємо їхню оборону та повернемо наші минулі завоювання."
 RAJ_creative_accounting:0 "Творчий облік"
 RAJ_cruiser_effort:0 "Розвиток крейсерів"
 RAJ_dividend_status_small:0 "Ми виплатили §Yневелику суму§! дивідендів інвесторам, що дає невеликий бонус на наступний §Yфіскальний рік§!."
 RAJ_exploit_the_frontier_desc:0 "Великі поклади ресурсів лежать у віддалених та недостатньо використовуваних регіонах субконтиненту та за його межами. Розширюючи операції та утверджуючи більший контроль над територіями, такими як [BRM.GetNonIdeologyName], ми можемо забезпечити критично важливі матеріали, такі як вольфрам, та підживити нашу зростаючу військову машину."
 RAJ_funnel_british_investments_into_princely_states_desc:0 "Корона наказала, щоб кожна інвестиція в компанію була витрачена всередині Індії, але корона не уточнила, що це має бути всередині компанії."
 RAJ_gw_tank_equipment:0 "Mark V"
 RAJ_halls_of_knowledge_2_desc:0 "Знання — це ключ до тривалої влади. Створивши імперські академії по всій Імперії Моголів, ми виховуємо вчених, науковців та адміністраторів, які сприятимуть інноваціям, зміцнюватимуть управління та забезпечуватимуть спадщину мудрості та прогресу імперії."
 RAJ_hand_over_aden_to_the_crown:0 "Передати Аден Короні"
 RAJ_heavy_tank_aa_equipment_2_short:0 "Churchill (зеніт.)"
 RAJ_hindustan_aircraft_organization:0 "$hindustan_aircraft$"
 RAJ_imperial_service_troops:0 "Імперські війська обслуговування"
 RAJ_india_united:0 "Об'єднана Індія"
 RAJ_indian_gurkhas:0 "Індійські гуркхи"
 RAJ_indian_legion_desc:0 "Індійський легіон, що складається з іноземних індійських дисидентів під контролем [GER.GetName], пройшов обширну підготовку у війні в пустелі. Ми можемо використовувати їхній досвід для покращення наших власних сил."
 RAJ_infantry_equipment_0:0 "GRI No. 1 Mk III"
 RAJ_land_reforms:0 "Земельні реформи"
 RAJ_local_leaders_investments_defenses_chance:0 "[?RAJ_local_leaders_defenses_chance|%+]"
 RAJ_military_pensions_desc:0 "Надання військових пенсій як частини армійського пакету зміцнить військовий комплекс в цілому, утримуючи персонал довше."
 RAJ_nav_bomber_equipment_3_short:0 "Barracuda"
 RAJ_navy_shortcut:0 "Індійські ВМС"
 RAJ_nothing_personal_desc:0 "Корона надто довго нав'язувала нам свою волю, стримуючи наше зростання шляхом запровадження архаїчних заходів. Це нічого особистого, але уряд не може бути причиною незадовільного зростання."
 RAJ_open_up_new_markets_desc:0 "Ми ризикуємо наситити наш поточний ринок у найближчі роки, якщо не вживемо рішучих заходів для його розширення. Тому ми розпочнемо вороже поглинання сусідніх територій."
 RAJ_ordnance_factory_medak:0 "Збройовий завод Медак"
 RAJ_prioritize_civilian_cargo:0 "Пріоритет цивільного вантажу"
 RAJ_procure_the_armor_desc:0 "Варуна потребує важкої броні, дуже важкої броні. Прототипування її на менш дорогому проєкті є необхідністю для зниження витрат."
 RAJ_provincial_autonomy:0 "На шляху до незалежності"
 RAJ_provincial_elections_desc:0 "Новий закон про уряд Індії наказує проведення виборів у провінціях і вводить якусь подобу місцевої влади, яка відповідає за благополуччя індійського населення. Подивимося, як цей закон вплине на позиції британців."
 RAJ_red_in_the_shadows:0 "Червоні в тіні"
 RAJ_renegotiate_adens_control_desc:0 "Хоча план полягав у тому, щоб передати Аден [ENG.GetName], є суттєва перевага в наявності торгового порту біля Червоного моря. Нам потрібно переглянути цю політику та зберегти його під нашим контролем."
 RAJ_royal_indian_navy_dlc:0 "$RAJ_royal_indian_navy$"
 RAJ_stopping_the_japanese_threat_into_central_asia:0 "Зупинити японську загрозу в Центральній Азії"
 RAJ_the_aden_protectorate_desc:0 "Провінція Аден на Аравійському півострові підпадає під нашу юрисдикцію. Таким чином, життєво важливо, щоб ми забезпечили її захист, намагаючись довести [ENG.GetNameDef], що [RAJ.GetNameDef] здатна захищати інтереси [ENG.GetAdjective] Імперії у водах Близького Сходу."
 RAJ_the_legacy_of_babur_tt:0 "Кожна область, у якій були заворушення, отримає: "
 RAJ_the_smiling_buddha:0 "Усміхнений Будда"
 RAJ_the_varuna_class_desc:0 "Наш останній лінійний корабель став колосальним інженерним досягненням. Таким чином, єдина відповідна назва для цього судна — ім'я бога."
 RAJ_theocratic_rule:0 "Повторно кодифікувати Дхіммі"
 RAJ_timurid_empire_neutrality_DEF:0 "Тімурідська імперія"
 RAJ_trade_protection_desc:0 "Щоб забезпечити процвітання нашої економіки, ми повинні захищати життєво важливі торговельні шляхи та галузі промисловості від іноземної експлуатації. Посилення захисту торгівлі забезпечує ресурси Індії, плекає внутрішнє зростання та захищає наші ринки від зовнішніх загроз."
