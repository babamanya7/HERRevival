 PRODUCTION_EQUIPMENT_FILLED:0 "На даний момент наша потреба §Gзадоволена§!."
 PRODUCTION_FACTORY_ASSIGN_DESC:0 "Клацніть, щоби призначити $FACTORIES|Y$ £factory_item£ §Yвійськових заводів§! до цієї виробничої лінії. Це дасть базовий об'єм виробництва £production_cost $OUTPUT|Y$ за день.\nНа загальний об'єм впливають §Yресурси§!, §Yефективність виробництва§! й інші §Yмодифікатори виробництва§!."
