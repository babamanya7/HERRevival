 CZE_internal_redoubts_desc:0 "Будь-який оборонний рубіж може бути прорваний. На цей випадок ми можемо зміцнити свої найбільш важливі міста з тим, щоб противник, який прорвався на нашу територію, не зміг легко ними заволодіти."
