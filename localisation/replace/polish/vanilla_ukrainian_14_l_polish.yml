 XIC_form_the_anti_japanese_comrades_association_desc:0 "Щоб наростити нашу силу і переконати армію припинити боротьбу з КПК, ми повинні створити таємну стрижневу організацію, щоб об'єднати Північно-Східну армію та поглинути тих, хто має активні антияпонські ідеї — те, що Чжан назвав Товариством антияпонських товаришів. Чжан буде головою товариства, об'єднаного з комуністами для боротьби проти Японії та підготовки антияпонських кадрів."
