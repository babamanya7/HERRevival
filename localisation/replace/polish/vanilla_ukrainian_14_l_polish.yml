 HUN_reintegrate_the_railroads_desc:0 "Мережа залізниць, що охоплювали Австро-Угорщину, після розпаду імперії на незалежні держави виявилася розділеною. Нам слід звернутися до сусідів з пропозицією зв'язати залізниці в єдину мережу, поліпшивши тим самим загальну інфраструктуру."
 HUN_reintigrate_southern_slovakia:0 "Реінтегрувати область [664.GetName]"
 HUN_secret_rearmament_tt:0 "§GВідкриває закон §YЧасткова мобілізація§!.§!\n"
 ICE_ADJ:0 "Ісландськ"
 ICE_BLITZKRIEG_DESC:0 "With the recent demands from Germany, it is becoming more clear by the day that the situation in Europe is untenable, and that an attack on Denmark is more than likely inevitable.\n\nWith that in mind, Iceland's future hangs on the brink, and she will likely need to seek protection by the Americans if she wishes to stay out of the conflict which is soon to begin."
 ICE_advanced_technology_desc:0 "Острів маленький. Він ніколи не зможе на рівних конкурувати з величезними індустріальними державами. Ми повинні знайти свою нішу і процвітати там. Щось відносно нове, де ми не будемо відставати від конкурентів. Передові технології та електроніка — це те, де ми можемо процвітати і процвітати."
 ICE_anti_capitalist_propaganda:0 "Антикапіталістична пропаганда"
 ICE_hrafninn_flygur:0 "Hrafninn flýgur"
 ICE_low_cost_aircrafts_desc:0 "У нас немає великої індустрії, але у нас є кілька обраних людей, які знають, як оптимізувати будівництво літаків. Ми повинні використовувати їхні таланти, щоб, навіть зважаючи на нашу слабку економіку, не відставати в гонці повітряних озброєнь."
 ICE_off_shore_oil_drilling:0 "Морське буріння нафти"
 ICE_state_corporatism_desc:0 "Тепер, коли ми звільнилися від останніх залишків слабкого данського ярма, настав час створити нову державу. Найкращий спосіб забезпечити безпеку нашої нації — це об'єднатися навколо сильного лідера, коли профспілкові лідери, промислові магнати та партія працюватимуть разом заради спільного блага всіх ісландців. Держава підтримає промисловців, а вони, в свою чергу, підтримають державу."
 ICE_state_owned_enterprises:0 "Державні підприємства"
 ICE_the_might_of_thor:0 "Могутність Тора"
 INDUSTRIAL_ORG_DETAIL_TOOLTIP_FUNDS_VALUES_DELAYED:0 "§YКошти§! відображають прогрес §Yвійськово-промислової організації§! в збільшенні в §Yрозмірі§!. При збільшенні Ви отримаєте бал риси, яким зможете відімкнути рису."
