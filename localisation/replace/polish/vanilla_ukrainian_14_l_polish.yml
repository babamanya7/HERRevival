 form_ottoman_britain_coring_states_tt:0 "Усі §Yбританські§! території в Єгипті, на Близькому Сході та в Східному Середземномор'ї стануть осердними.\n"
 france.18.d:0 "Наш план не допустити розпаду Малої Антанти і віддалення від нас досягає успіху. [From.GetLeader] схвалює наші зусилля та прийняв наше запрошення до альянсу."
 french_arms_industry_desc:0 "В даний час ймовірність чергової війни з Німеччиною вкрай висока. Ми мусимо розширити виробництво озброєнь. Лише французька армія перегороджує шлях Німеччини, що рветься до панування в Європі!"
 fuel_refining2_desc:0 "Поліпшена конструкція нафтопереробних заводів дозволяє знизити втрати нафти під час переробки."
 gen_nazism_desc:0 "Коріння націонал-соціалізму — крайній націоналізм та ідеї про расову перевагу. Він закликає до агресивного розширення кордонів і до побудови тоталітарної держави, всі громадяни якої об'єднані під керівництвом лідера з абсолютною владою."
 generic.16.t:0 "[From.GetName] зберігає аташе"
 generic.22.a:0 "Як шкода."
 generic.23.d:0 "Сьогодні до нас прибула ворожа делегація з держави [From.GetNameDef], яка претендує на володіння всією областю [demanded_prov_target.GetName]. [From.GetLeader] вимагає, щоб ми негайно повернули територію, інакше війна буде неминучою. [From.GetLeader.GetSheHeCap] стверджує, що [demanded_prov_target.Owner.GetAdjective]а влада володіє регіоном незаконно і що [demanded_prov_target.GetName] є невід'ємною частиною [From.GetAdjective]ої держави.\n\nЯкщо ми приймемо їхні вимоги, [demanded_prov_target.GetName] буде передано державі [From.GetNameDef], але ми збережемо статус осердної землі та претензії, які маємо на цей регіон. Якщо ми відмовимося, війна між нашими країнами неминуча."
