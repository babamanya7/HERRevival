 political.17.d:0 "У міру того, як свобода слова і зборів ставали все більш прийнятними в державі [Root.GetName], фракція всередині [Root.GetRulingParty], яка закликáла до проведення виборів, перетворилася з таємних змовників на реформаторів, яких підтримує громадськість. Незважаючи на те, що [Root.GetLeader] висловлює протести, протягом останніх місяців країна повільно, але впевнено рухається до демократії, і вибори зараз здаються природним наступним кроком.\n\nУтім, далеко не всі [Root.GetAdjective]і громадяни підтримують демократичні реформи. У партії досі тривають дебати стосовно того, чи варто зачекати з виборами, поки ми не зможемо забезпечити стабільний розвиток."
