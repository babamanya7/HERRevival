 DOCTRINE_TRACK_NUM_REWARDS:0 "Шлях $TRACK_NAME|H$: \n - Досягнуто $NUM_REWARDS|H$/$TOTAL_REWARDS|H$ рівнів £doctrine_mastery §Hмайстерності§!"
 DOD_hungary.102.desc:0 "Переговори про передачу Словаччини майже відразу зайшли в глухий кут. [From.GetAdjectiveCap]а делегація оголосила, що має намір зберегти поточний статус-кво без жодних серйозних змін. Наша делегація, зрозуміло, ще раз нагадала, що ми вважаємо Словаччину своєю територією, незаконно вилученою наприкінці Великої війни.\n\nНам не вдалося досягти прогресу і, судячи з роздратування обох сторін на переговорах, це навряд чи вдасться."
 DOD_hungary.104.desc:0 "Німецький уряд надіслав нам секретну депешу із запевненням, що врахує наші інтереси, коли вирішуватиме долю держави [CZE.GetNameDef]. Але коли саме це станеться, поки що невідомо."
 DOD_hungary.110.desc:0 "[HUN.GetLeader] знаходиться в Москві для обговорення ситуації в Румунії. Після закінчення Великої війни Румунія незаконно окупувала низку територій, у тому числі Бессарабію та Трансільванію. Наші угорські товариші запропонували нам чинити тиск на Румунію, щоб та повернула ці землі їхнім законним власникам."
 DOD_hungary.113.c:0 "Повторити нашу початкову пропозицію з більшою агресією."
 DOD_hungary.120.b:0 "Навіщо нам вплутуватися у війни імперіалістів?"
 DOD_hungary.128.desc:0 "На зустрічі з нашим послом [GER.GetLeader] дав ясно зрозуміти, що [CZE.GetNameDef] входить у сферу інтересів його уряду і що будь-яке порушення кордонів цієї держави розглядатиметься як ворожі дії."
 DOD_hungary.143.t:0 "[From.GetNameDefCap] передає ноту протесту"
 DOD_hungary.145.c:0 "Радянський Союз."
 DOD_hungary.150.b:0 "Великий важкий винищувач."
 DOD_hungary.43.t:0 "[HUN.GetNameDefCap] відмовляється поступатися"
 DOD_hungary.53.b:0 "Вони не пройдуть!"
 DOD_hungary.54.b:0 "Отже, бути війні."
 DOD_hungary.6.b:0 "Ось вона, типова «демократія»."
 DOD_hungary.6.t:0 "Відмова від проведення референдуму"
 DOD_hungary.60.b:0 "Нам слід підтримати Румунію."
 DOD_hungary.70.a:0 "Це найкраще, на що ми могли розраховувати."
 DOD_romania.20.desc:0 "Протягом кількох місяців ми намагалися укласти союз із державою [ROM.GetNameDef], щоб їхня нафта не дісталася ворогам. Тепер [ROM.GetLeader] заявляє, що ми мусимо дати офіційні гарантії військової допомоги на випадок війни. Перш ніж його уряд почне хоч якось обговорювати вступ до нашого союзу."
 DOD_romania.67.desc:0 "Ми заручилися додатковою дипломатичною підтримкою, і тепер настав час повідомити Югославії про те, що ситуація кардинально змінилася. Їхні війська розосередилися вздовж довгого кордону, погіршивши і без того слабку оборону країни."
 DOD_romania.69.t:0 "Оточення"
 DOD_yugoslavia.20.t:0 "[YUG.GetName] просить продажу літаків"
 DOD_yugoslavia.30.desc:0 "\nТепер, коли Австрія знову увійшла до Райху, у нас з'явився спільний кордон із державою [YUG.GetNameDef]. Уряд, яким керує [YUG.GetLeader], не поспішає висловлювати свою думку щодо нашого плану переділу Європи. Можливо, час нагадати їм про необхідність зробити вибір."
