 FIN_defense_in_depth_desc:0 "У міру того, як ворог стає сильнішим і рішучішим, стає зрозуміло, що однієї статичної лінії фронту може бути недостатньо, щоб стримати його. Ми повинні будувати нові укріплення та менші оборонні лінії за основною лінією фронту, забезпечуючи кілька рівнів захисту та надаючи нашим силам гнучкість для контратаки за потреби. Ми змусимо ворога платити за кожен дюйм [ROOT.GetAdjective]ого ґрунту, який він спробує захопити."
 FIN_finnish_learned_societies:0 "Фінські наукові товариства"
 FIN_found_pohjolan_voima_factories_tt:0 "\nДодає §G2§! комірки для будівництва та §Y1 $industrial_complex$§! до §Y5 повністю контрольованих осердних областей§! із інфраструктурою принаймні 3 рівнями."
 FIN_industrial_development:0 "Промисловий розвиток"
 FIN_industrial_upgrade_in_harjavalta_desc:0 "У Гар'явалті вживаються зусилля для модернізації та оптимізації нікелевої та мідної промисловості. За допомогою передових технологій і вдосконалених методів виробництва мета полягає в тому, щоб максимізувати обсяг виробництва та зміцнити позицію [ROOT.GetName] як провідного виробника ці життєво важливі мінерали."
 FIN_integrate_veps_states_desc:0 "Вепси ніколи не мали власної держави, але настав час дати їм саме це."
