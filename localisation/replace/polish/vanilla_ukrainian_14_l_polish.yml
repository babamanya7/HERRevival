 DEN_democratic_venstre_party:0 "Ліві"
 DEN_develop_state_iceland:0 "Розвинути область $STATE_100$"
 DEN_domestic_designs_desc:0 "Нашим військово-повітряним силам катастрофічно не вистачає можливостей. Це здебільшого пов'язано з тим, що ми не виробляємо власні літаки, а отже, не маємо достатньої кількості, щоб вести боротьбу, якщо станеться найгірше. Нам потрібно налагодити внутрішнє виробництво наших власних літаків."
 DEN_flyvertroppernes_organization:0 "Flyvertroppernes Værksteder"
 DEN_march_on_the_capital_desc:0 "Нарешті настав час для нашої партії піднятися і взяти під контроль майбутнє [DEN.GetNameDef]. Ми повинні йти до [ROOT.capital.GetCapitalVictoryPointName] і зробити так, щоб наші голоси були почуті! Це буде початком сильної та безпечної ери в історії [DEN.GetAdjective]!"
 DEN_mechanized_equipment_1_short:0 "PMV. I"
 DEN_mechanized_equipment_2:0 "Pansret Mandskabsvogn II"
