 SOV_concessions_germany_baku_SCW:0 "Права на нафту Баку в обмін на військове будівництво"
 SOV_cv_nav_bomber_equipment_1_short:0 "Ил-4 (П)"
 SOV_depoliticize_the_military_desc:0 "Основна мета армії — захищати робітничий клас. Наші солдати значною мірою вже є членами робітничого класу, а тому не потребують, щоб хтось за ними наглядав. Ще важливіше те, що Червона армія зосереджена на своїй основній місії, і їй не дозволяється гратися в політику."
