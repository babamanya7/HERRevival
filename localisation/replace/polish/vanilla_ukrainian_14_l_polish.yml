 YUG_rare_minerals_exploitation_desc:0 "Раніше невикористані родовища рідкісних металів раптово набули великого значення. Ми повинні негайно побудувати необхідні шахти та інфраструктуру, щоби скористатися ними."
 YUG_recognize_the_soviet_union_desc:0 "Хоча ми історично відмовлялися визнавати більшовицьку державу на Сході, можливо, настав час для нас переглянути нашу позицію щодо цього питання. Хоча західні демократії здаються надто слабкими, щоби захищати другорядні держави, Радянський Союз цілком може виявитися більш надійним другом."
