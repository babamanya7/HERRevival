 POL_KINGDOM_DEF:0 "Королівство Польща"
 POL_PEASANT_communism:0 "Польська селянська республіка"
 POL_SANATION_fascism:0 "Польська санаціоністська хунта"
 POL_april_constitution_left_desc:0 "$POL_april_constitution_1_desc$"
 POL_artillery_modernisation_desc:0 "Ми не повинні нехтувати поліпшенням і модернізацією підтримки, необхідної нашим солдатам для ефективного розгортання."
 POL_baltic_security:0 "Безпека Балтії"
 POL_central_defence_of_poland:0 "Оборона Центральної Польщі"
 POL_codify_national_unity:0 "Кодифікувати Табір національного єднання"
 POL_committee_of_national_liberation:0 "Комітет національного визволення"
 POL_complete_plan_east_desc:0 "Польське військове командування задоволене тим, що ми розробили адекватні плани на випадок неминучого конфлікту з [SOV.GetAdjective]ою державою та що час плану «Схід» підійшов до кінця."
 POL_defensive_focus:0 "Акцент на оборону"
 POL_defensive_plans:0 "Оборонне планування"
 POL_demand_slovakia:0 "Вимогти Словаччину"
 POL_diplomatic_mission_to_DEN:0 "Дипломатична місія в державу [DEN.GetNameDef]"
 POL_empower_the_morges_desc:0 "Фронт Морж зарекомендував себе як союзники демократії, і все, чого ми досягли до цього часу, було б неможливим без їхньої підтримки. Можливо, ці генерали заслужили право очолити власний рід військ."
 POL_exile_democratic_party_long:0 "Ліберально-демократична партія"
 POL_falangist_international_desc:0 "Протистояння нацизму та італійському фашизму ставить нас у вразливе становище, але ми повинні шукати союзників у нашій боротьбі проти німців. Можливо, представивши фалангізм як альтернативу, ми зможемо сформувати альянс націй-однодумців."
 POL_four_year_plan_complete_3:0 "$POL_four_year_plan_idea$"
 POL_habsburg_events.101.t:0 "[From.GetNameDefCap] коронує Габсбурга"
 POL_heavy_fighter_equipment_2:0 "PZL.54 Ryś"
 POL_invite_foreign_motor_decisions_desc:0 ""
 POL_looming_peasants_strike:0 "Наближається селянський страйк"
 POL_merge_internal_governments:0 "Об'єднати внутрішні уряди"
 POL_peasant_division_tt:0 "Отримати 4 військові частини з §Y6§! батальйонами §Yпіхоти§!.\n"
 POL_polish_peoples_republic:0 "Польська радянська соціалістична республіка"
 POL_press_the_habsburg_claim:0 "Висунути претензію Габсбургів"
 POL_remove_colony_purchase_tt:0 "Видалити рішення: §YПридбати область [POL_colony_purchase.GetName]§!"
 POL_reopen_national_elections_desc:0 "Метою Ендеції є відновлення демократії в Польщі, водночас гарантуючи, що уряд служитиме інтересам польського націоналізму. Ми повинні знову відкрити вибори, але таким чином, щоб непатріотичні партії не могли потрапити до виборчих бюлетенів."
 POL_restore_the_diet_of_galicia:0 "Відновити Галицький сейм"
 POL_root_out_monarchists:0 "Викоренити монархістів"
 POL_sanation_left_opposition_3:0 "Висока опозиція лівої санації"
 POL_sanationist_army_desc:0 "З лояльним вищим командуванням Санації під нашим контролем, настав час використати досвід старої гвардії у військах."
 POL_supply_the_rail_nexus:0 "Зорганізувати постачання залізничного вузла"
 POL_support_monarchy_in_ROM_tt:0 "Відкриває доступ до рішень §YНаша претензія на Румунію§!."
 POL_support_weapons2:0 "Rkm Browning wz. 1928 & Granatnik wz. 36"
 POL_the_mediterranean:0 "Середземномор'я"
 POR_AUS_autonomy_eu_member:0 "Європейська Португалія"
 POR_allow_free_elections_desc:0 "Вплив Сполученого Королівства нарешті процвітає в Португалії, і наш народ вимагає права обирати уряд, який найкраще представлятиме їхні інтереси."
 POR_arsenal_alfeite_organization:0 "$arsenal_alfeite$"
 POR_camisas_azuis:0 "Camisas Azuis"
 POR_evade_blockade_flag:0 "Активно здійснюється обхід блокади за допомогою португальських конвоїв"
 POR_evade_blockade_with_portuguese_convoys_desc:0 "Ми приймемо пропозицію використовувати португальські конвої для перевезення вантажів туди, куди наші власні кораблі не можуть дістатися. Моральний дух наших військ підвищиться, коли вони нарешті побачать, що їхні основні проблеми з постачанням вирішені."
 POR_iberian_summit_proposal_delayed_desc:0 "Наразі іберійські дипломати зустрічаються з [?global.POR_iberian_summit_target.GetAdjective]ими міністрами і розробляють привабливу угоду, яка прокладе шлях для нашого вступу до альянсу [?global.POR_iberian_summit_target.GetFactionName]."
 POR_infrastructure_in_angola:0 "Інфраструктура в Анголі"
 POR_light_tank_destroyer_equipment_3_short:0 "VAT-5"
 POR_medium_tank_artillery_equipment_1:0 "Artilharia autopropulsada 3"
 POR_oppose_germany_desc:0 "Військові дії Німеччини абсолютно нестерпні, але досі ніхто не зміг їх зупинити. Тепер, коли наша армія нарешті готова до війни, Португалія приєднається до боротьби та протистоїть усім тим, хто прагне позбавити нації їхньої свободи."
 POR_portugal_cancel_blockade_evasion_for_country_desc:0 "Угода, за якою ми використовуємо кілька наших конвоїв для обходу британської блокади для [From.GetAdjective]ого уряду, більше не є для нас вигідною, тому ми негайно її скасуємо."
 POR_portugal_promoting_monarchist_cause_in_brazil_desc:0 "Португальський уряд закликає населення країни прийняти монархізм і визнати принца Педру Енрікі законним правителем Бразилії."
 POR_recover_brazil:0 "Повернути Бразилію"
 POR_staff_wargames_desc:0 "Ми повинні зосередитися на підготовці наших офіцерів, щоб вони могли повною мірою скористатися перевагами сучасних доктрин, організації, навчання та обладнання."
 POR_stir_monarchist_sentiment_in_brazil_tt:0 "§Y[BRA.GetFlag][BRA.GetNameDefCap]§! отримає щоденну підтримку нейтралітету: §G+0.10§! §Yна 180 днів§!."
 POR_support_the_spanish_nationalists:0 "Підтримати іспанських націоналістів"
 POR_the_capital_of_espionage:0 "Столиця шпигунства"
 PRC_28_bolshevik_faction_decision_ask_for_support:0 "Переконати [FROM.GetName] у вашому лідерстві"
 PRC_appeal_for_foreign_aid_cat:0 "Звернення по іноземну допомогу"
 PRC_army_doctrines_mass_assault_tt:0 "За наявність §Y$GRAND_DOCTRINE_MASS_ASSAULT$§!:"
 PRC_bo_gu_review:0 "£BoP_right_texticon $PRC_bo_gu$ проведе огляд наших військових сил"
 PRC_bolshevik_world_revolution_desc:0 "Успіх нашої революції не повинен обмежуватися нашими кордонами. Ми повинні допомогти пролетаріату в інших націях."
 PRC_central_military_commision_desc:0 "Тепер, коли гілки наших збройних сил реорганізовані та модернізовані, можна створити орган для їх координації. Це дасть нам кращий нагляд за нашою армією, а також покращить нашу здатність виконувати об'єднані операції."
 PRC_communism_ADJ:0 "Китайськ"
 PRC_connecting_the_country_desc:0 "Розширення нашої промисловості та зростаюча потреба в розподілі товарів, які раніше вироблялися в самодостатніх, але менш ефективних громадах, зробили інфраструктуру важливішою, ніж будь-коли."
 PRC_currently_establishing_anti_japanese_base_state:0 " Наразі створює $PRC_anti_japanese_base$"
 PRC_establish_democratic_socialism_desc:0 "Наші головні досягнення для Китаю можуть бути увічнені в підручниках історії, але коли настануть важкі часи, ці досягнення не означатимуть багато. Тому люди повинні відчувати, що вони можуть спрямовувати революцію та притягувати уряд до відповідальності своїм голосом, якщо він колись не виконає свої обов'язки."
 PRC_establish_shorter_market_plans:0 "Встановити короткострокові ринкові плани"
 PRC_heavy_fighter_equipment_3:0 "JH-3"
 PRC_industrialization_efforts_desc:0 "Останнє зростання сільськогосподарського виробництва дозволяє частині наших людей працювати в інших галузях. Ми повинні визначити пріоритетом переміщення до тих галузей, які дозволяють подальше зростання, наприклад, виробництво будівельних матеріалів або інструментів для ферм."
 PRC_infantry_equipment_1:0 "Type 24"
 PRC_integration_decision_soviet_states:0 "Зробити національною територією та інтегрувати [FROM.GetName]"
 PRC_invite_pavel_mif_desc:0 "Павло Міф, наставник усіх 28 ½ більшовиків, має бути запрошений радником нашого уряду. Його присутність зміцнить наші зв'язки з [SOV.GetNameDef]."
