 lar_franco_soviet_treaty.2.desc:0 "[From.GetAdjective] уряд погодився на нашу пропозицію, але підкреслив, що ніколи не погодиться на війну, яка радикально змінює політичний ландшафт у Європі. Отже, наш союз буде суворо оборонним, і кожен його учасник прийде на допомогу іншому лише тому випадку, якщо цього нападе третя сторона."
