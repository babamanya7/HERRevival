 denmark_overlord_events.45.desc:0 "Схоже, наше бажання взяти під протекцію Ютландію зламало волю данського лідера. Почувши нашу пропозицію, [FROM.GetLeader] скорботно опустився у своє крісло і лише мовчки кивнув."
