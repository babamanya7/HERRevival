 ROM_expand_the_marine_regiment:0 "Розширити полк морпіхів"
 ROM_form_peasant_militias_desc:0 "З комуністичними ідеалами, які ми беремо від нашого сусіда, виникає обов'язок кожної людини захищати своїх товаришів, свою країну та революцію."
 ROM_heavy_fighter_equipment_3:0 "IAR 410"
 ROM_heavy_tank_equipment_2:0 "Iancu"
 ROM_iar_80_desc:0 "У наших інженерів є чудові ідеї, які вони прагнуть втілити в новий дизайн винищувача. Їм просто потрібні фінансування та дозвіл."
 ROM_join_comintern:0 "Приєднатися до Комінтерну"
 ROM_light_ship_engine_1:0 "«Tosi» 45 000 к. с. н. в."
 ROM_light_tank_destroyer_equipment_2:0 "TACAM R-1"
 ROM_malaxa:0 "MALAXA"
 ROM_nuclear_bomb_project_desc:0 "Ми ніколи не можемо сподіватися розбомбити наших ймовірних ворогів звичайними засобами. Тому ми повинні зосередитися на технологічних досягненнях, які дозволять нам досягти більшого руйнування з меншими витратами. Багато, набагато більше."
 ROM_sub_ship_engine_1:0 "«Sulzer» 800 к. с. н. в."
 ROOT_turkish_investment_ai_tt:0 "Чим більше будуть наші §Yінвестиції§! в державу §Y[TUR.GetNameDef]§!, тим ближче ми можемо стати до нього, настроївши його проти наших ворогів.\n"
 RULE_ALLOW_LEND_LEASE_BLOCKED_DESC:0 "Держави не можуть постачати озброєння за ленд-лізом жодній державі."
 RULE_ALLOW_RELEASE_NATIONS_NOT_GERMAN_CONSTITUENT_STATES_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! не може звільняти складові держави Німеччини."
 RULE_COUP_BLOCKED_TT:0 "Правило гри: §R$RULE_ALLOW_COUPS_BLOCKED_DESC$§!"
 RULE_DEMOCRATIC_ALTERNATE_AST_AI_DESC:0 "§HАвстралійський§! ШІ намагатиметься отримати повну незалежність від Сполученого Королівства та стати великою силою у своєму регіоні, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_FASCIST_ALTERNATE_KING_HUN_AI_DESC:0 "Угорський ШІ вибере фашистського короля та приєднається до Осі."
 RULE_GROUP_GAMEPLAY:0 "Правила гри"
 RULE_GROUP_RESEARCH:0 "Дослідження"
 RULE_HISTORICAL_SWE_AI_DESC:0 "ШІ намагатиметься розбудувати шведську армію, залишаючись нейтральним і демократичним. Він ретельно уникатиме конфліктів із Віссю та Комінтерном, але може надати обмежену підтримку Союзникам на пізніших етапах війни."
 RULE_MAXIMUM_FORT_LEVEL_DESC:0 "Держави можуть будувати наземні та берегові укріплення тільки до визначеного рівня. Це не впливає на укріплення на початку гри. Укріплення, отримані з національних фокусів, рішень та подій можуть перевищувати обмеження."
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI:0 "Комунізм проти Співдружності"
 RULE_OPTION_CARDENISMO:0 "Карденізм"
 RULE_OPTION_CARDENISMO_DESC:0 "§HЛасаро Карденас§! і його ліберально налаштовані послідовники створять Боліварійський альянс і завдадуть удару імперіалістичним американцям."
 RULE_OPTION_CHL_PAN_HISPANISM:0 "Пангіспанізм"
 RULE_OPTION_CHL_PAN_HISPANISM_DESC:0 "Чилійський ШІ піде шляхом фашизму, але врешті-решт вирішить не ставати на бік жодних великих держав. Згодом він відправиться завойовувати гіспанський світ або об'єднувати його дипломатично."
 RULE_OPTION_COMMUNIST_BEL_AI:0 "Соціалісти"
 RULE_OPTION_COMMUNIST_BEL_AI_DESC:0 "ШІ дозволить Лейбористській партії виграти вибори, а потім повільно почати приєднуватися до комуністичного блоку."
 RULE_OPTION_COMMUNIST_FRA_AI_DESC:0 "§HФранцузький§! ШІ намагатиметься перейти в комунізм і приєднатися до Комінтерну, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_SAF_AI_DESC:0 "§HПівденноафриканський§! ШІ якомога точніше слідуватиме історичному плану."
 RULE_OPTION_DEN_FASCIST_AI_DESC:0 "Фашистська партія спробує захопити владу в Данії та відродити стару Імперію Північного моря."
 RULE_OPTION_ENG_FRAGMENTED:0 "Велика Британія роздроблена"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0 "ШІ зрадить Хайле Селассіє та стане на бік італійців, у результаті чого Ефіопія стане фашистською маріонеткою. Однак вона спробує вирватися і стати незалежною фашистською нацією."
 RULE_OPTION_FASCIST:0 "Фашистський шлях"
 RULE_OPTION_FRA_FRAGMENTED:0 "Франція роздроблена"
 RULE_OPTION_GOE_INDIA_FASCISM_BOSE:0 "GOE — Незалучений Чандра Бос"
 RULE_OPTION_HIDE:0 "Приховувати"
 RULE_OPTION_HISTORICAL_COG_AI_DESC:0 "Конголезький ШІ залишиться з Бельгією і максимально використає свої відносини з цією країною, зрештою прагнучи до більшої автономії."
 RULE_OPTION_ICE_COMMUNIST_AI_DESC:0 "Ісландський ШІ засудить монархію і встановить в Ісландії комуністичний режим."
 RULE_OPTION_ICE_SUPPORT:0 "Підтримка Данії"
 RULE_OPTION_OCEANIA_UNITED_DESC:0 "Полінезія буде об'єднана в єдину країну після початку гри."
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE:0 "Вільні тубільні князівства"
 RULE_OPTION_RANDOM_AI_DESC:0 "ШІ випадковим чином обере ігровий план на початку гри та намагатиметься його виконати."
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_HUN_AI_DESC:0 "Угорський ШІ виступить проти Горті, принесе демократію в Угорщину, зрештою приєднається до Руху Дракона та спробує відновити Велику Угорщину."
 RUS_democratic_DEF:0 "Союзна держава Нордамеріка"
 RUT_fascism_party:0 "RNAP"
 RU_Adj_Ending_Oe:0 "е"
 RU_lower_Nom_communism:0 "комунізм"
 RWA_democratic:0 "Республіка Руанда"
 SAB_fascism_ADJ:0 "Сабазьк"
 SAF_artillery_equipment_1:0 "QF 18-pounder"
 SAF_defense_collaboration_initiative:0 "Оборонна ініціатива"
 SAF_emergency_workers_desc:0 "Настав час провести додаткову мобілізацію серед південноафриканців. Ми також можемо залучити жінок до роботи на заводах за менший оклад."
 SAF_equipment_effort:0 "Розвиток оснащення"
 SAF_fighter_equipment_1_short:0 "Hurricane"
 SAF_fighter_equipment_2:0 "Supermarine Spitfire"
 SAF_heavy_cruiser_4:0 "Проєкт «Churchill»"
 SAF_heavy_tank_equipment_2_short:0 "Churchill LP"
 SAF_light_cruiser_1_desc:0 "C-class light cruisers were a group of twenty-eight light cruisers of the Royal Navy. They were built before and during the First World War for the rough conditions of the North Sea. They proved to be rugged and capable vessels despite being somewhat small and cramped. Their armament was more than satisfactory, as they carried enough 6 in. guns to fight enemy surface targets and a heavy torpedo load. They saw extensive use during WWI and participated in many surface actions. Only the Caledon, Ceres, and Carlisle subclasses were in service by the mid 1930s."
