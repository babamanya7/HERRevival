 transcaucasia_unified_fascism:0 "Закавказька ультранаціоналістична держава"
 transport_plane_equipment_3_desc:0 "$transport_plane_equipment_1_desc$"
 tsr_manchukuo.20.desc:0 "Вирішивши не передавати Зовнішню Маньчжурію, вважаючи її занадто російською, совєти принаймні погодилися передати Монголію і Туву, оскільки наші претензії на ці території значно свіжіші."
 tsr_manchukuo_border_war.6.t:0 "[MAN.GetNameDefCap] відступає з [614.GetName]"
 turko_persian_empire_fascism:0 "Турко-перська імперія"
 uk_amphibious_focus:0 "Земноводна війна"
 uk_amphibious_focus_desc:0 "Правити хвилями — це добре, але іноді доводиться промочити ноги. Ми не мусимо нехтувати нашою здатністю висаджувати десант на ворожій території."
 uk_new_zealand_focus_desc:0 "Нова Зеландія зберігає тісний зв'язок із нашим народом і застерігає від фашистської загрози. Їхній внесок у разі війни є безсумнівним, і ми мусимо допомогти їм підготуватися до нього."
 united_french_monarhcist_faction:0 "Франкофонська гегемонія"
 upgrade_decryption_boost:0 "Група радіоперехоплення"
 usa.18.d:0 "[From.GetName] незадоволені нашою конфліктною війною проти держави [being_attacked.GetName]. Вони погрожують нам власною війною, якщо ми негайно не підпишемо мирну угоду з державою [being_attacked.GetName].\nЧи повинні ми відступити?"
 usa.3.a:0 "Хто знає, як довго триватиме ця можливість?"
 usa.6.b:0 "Республіканці. Ми мусимо зберегти ідеали американської системи."
 usa.63.a:0 "Похвальна ініціатива."
 usa.65.t:0 "Несподіваний прояв [GER.GetAdjective]ого милосердя"
 value_limit_exact:0 "рівно $MIN$"
 volunteers_initiator_desc:0 "Держава $COUNTRY|Y$ відправила добровольців до інших держав"
 war_escalation_text:0 "£generic_war_escalation_text_icon Рівень ескалації війни: §Y[?ETH.ETH_war_escalation_level]§!"
 war_justification.15.t:0 "[ROOT.GetLeader] хоче відновити лад у державі [From.GetName]"
 war_justification.201.a:0 "Чому нам не дають жити у мирі?"
 war_justification.205.d:0 "«Хоча ми зміцнили соціалістичне суспільство в [From.GetName], багато народів все ще страждають під владою старих деспотій. Робітники [ROOT.GetName] не мають права голосу, не мають засобів для організації, і будь-які спроби встановити соціалізм будуть жорстоко придушені режимом [ROOT.GetLeader]. Ми не можемо чекати, поки шестерні міжнародної революції повернуться на користь [ROOT.GetAdjective]ого народу. Ми довели, що можемо розгромити капіталістичних гнобителів тут, і ми розгромимо гнобителів в [ROOT.Capital.GetName] також!»\n\n[From.GetLeader] відмовився від усіх спроб дипломатії з нашим урядом. Комуністичне завдання ліквідації всіх кордонів тепер суворо зосереджене на ліквідації наших кордонів."
 war_justification.214.a:0 "Голоси за мир серед [From.GetAdjective]их людей, звісно ж, замовкають."
 war_justification.220.d:0 "«Якщо ми хочемо мати стратегічну перевагу в осяжній, якщо не казати неминучій, війні з державою [ROOT.GetName], не можна зволікати. Йдеться про захист майбутнього наших дітей і забезпечення того, щоб [From.GetName] мав місце у світі завтра. Це питання відданості нашій справі та ідеалам, які ми сприймаємо як належне. Настав час діяти».\n\nСерія запальних промов лідерів [From.GetRulingParty], особливо [From.GetLeader], закликала громадськість підтримати вторгнення в [ROOT.GetName]. Геополітичні мотиви вторгнення менш помітні в риториці патріотичних настроїв, але ця кампанія видається дуже ефективною в переконанні громадськості в його необхідності."
 war_justification.8.t:0 "[ROOT.GetLeader] закликає до знищення [From.GetAdjective]ого націоналізму"
 war_on_communism_goal_desc:0 "Ми повинні зупинити поширення комунізму будь-якими необхідними засобами."
 war_propaganda_bombing_desc:0 "Хоча навколо нас падають бомби, наші хоробрі робітники продовжують боротися. Саме завдяки цьому духу ми переможемо."
 western_pacific_sphere:0 "Західнотихоокеанська сфера"
 wtt_border_conflict_lost_attacker.1.desc:0 "Війська під командуванням [their_country.GetLeader] успішно витіснили нас із спірної території між областями [our_state.GetName] і [their_state.GetName]. Наші солдати організовано відступили й тепер перегруповуються, щоб у майбутньому поновити боротьбу."
 wtt_britain.24.d:0 "Поточні військові дії створюють чимало труднощів для британських конвоїв, а наші східні сусіди все активніше намагаються заволодіти нашими повітряними та морськими базами, за допомогою яких вони хочуть посилити захист своїх морських шляхів. Малкольм МакДоналд, який прибув як посол, запропонував повернути Північну Ірландію під контроль Ірландії в обмін на участь у війні на боці Сполученого Королівства."
 wtt_britain_lease_azores.1.t:0 "[From.GetNameDefCap] бажає орендувати Азорські острови"
 wtt_china.12.desc:0 "Зміст нашої дипломатичної ноти державі [From.GetNameDef], мабуть, просочилося в пресу, викликавши справжній скандал. Навіть міжнародні газети надрукували досить несприятливі статті, називаючи наші розумні вимоги «втручанням у внутрішні справи», «небезпечним прецедентом» і навіть «шаленим імперіалізмом».\n\n[From.GetAdjective]ий уряд, природно, відмовився від подальших обговорень і дав зрозуміти, що у разі повторення такого повністю призупинить дипломатичні контакти."
 wtt_china.3.desc:0 "[From.GetLeader] відправив нашого посланця назад, заявивши, що центральний уряд не має повноважень замінювати керуючого провінцією. Його лист супроводжувався докладним звітом про бойову готовність місцевих військ."
 wtt_china_shared.2.t:0 "[From.GetNameDefCap] приймає нашу підтримку"
 wtt_denmark.1.a:0 "Хай щастить."
 wtt_denmark.1.t:0 "Незалежність Ісландії"
 wtt_germany.1.d:0 "Приховане невдоволення політикою Гітлера виявилося у кризі, викликаному наміром адміністрації провести ремілітаризацію Райнланду. Ряд генералів Вермахту приєдналися до прославленого фельдмаршала Августа фон Макензена, який розробив план по повалення Гітлера та усунення нацистів від влади в Німеччині.\n\nКоли про розкол у вищому керівництві Німеччини стало відомо навіть за кордоном, інші країни вирішили не протестувати проти ремілітаризації, стурбовані зростаючою нестабільністю всередині Німеччини. Старіючий фельдмаршал не став зволікати і вже створив тимчасовий уряд, під прапори якого стікаються супротивники нацистів.\n\nВійськовий переворот не за горами."
 wtt_germany.10.a:0 "Як недоречно."
 wtt_germany.20.d:0 "Продовжуючи наклепницьку кампанію проти нас, Німеччина заявила про створення нового альянсу. Поза сумнівом, це означає, що вони мають намір вторгнутися в нашу сферу впливу."
 wtt_germany.24.t:0 "Велика [GER.GetGreatRedMenaceName]а загроза"
 wtt_germany.43.a:0 "Вимогти від німців натомість відкликати фон Фалькенгаузена"
 wtt_germany.52.b:0 "Нехай самі вирішують свої проблеми."
 wtt_germany.53.desc:0 "У нашій південній сусідці Австрії після укладання союзу посилюються пронімецькі настрої. Цілком можливо, що серед австрійського населення отримає підтримку ідея референдуму щодо об'єднання з Німеччиною. Запропонувати австрійському уряду провести такий референдум?"
 wtt_germany.57.desc:0 "У війні з Радянським Союзом Польща програє і ризикує втратити все, і її уряд секретними каналами запропонував нам швидко повернути наші старі території, Данциг і Познань. Поляки вважають, що їх населенню, безперечно, буде краще під демократичним управлінням Німеччини, ніж під гнітом радянського ярма."
 wtt_japan.112.desc:0 "[From.GetAdjectiveCap]ий уряд відхилив пропозицію укласти Троїстий пакт, воліючи діяти поодинці."
 wtt_japan.114.a:0 "Більш ніколи нами не правитимуть військові!"
 wtt_japan.127.a:0 "Вони нас здолали... поки що."
 wtt_japan.2.a:0 "Мудре рішення."
 wtt_japan.41.desc:0 "Імператорський штаб Японії вирішив докорінно змінити стратегічну перспективу. На нараді з імператором військовий міністр представив новий план, згідно з яким у найближчому майбутньому вибухне війна з Радянським Союзом. З метою підготовки до цієї війни керівництво Імператорської армії Японії вирішило, що наші війська мають захистити ділянки фронту. Для цього було виділено велику кількість лише трохи застарілого озброєння."
 wtt_news.15.c:0 "На щастя, німці виявилися розсудливішими від французів..."
 wtt_news.35.b:0 "Все йде за планом."
 wtt_news.36.a:0 "Однією проблемою менше."
 wtt_news.37.b:0 "Не більше ніж формальність."
 wtt_news.45.d:0 "Можливо, вони щойно уникнули громадянської війни."
 wtt_political_warlord_support.10.desc:0 "Ми вирішили поки що забути про поточну політичну боротьбу. Схоже, що це не залишилося непоміченим із боку лідера [From.GetLeader]. У своєму посланні він запитує, що буде потрібно з його боку, щоби ми висловили йому свою підтримку.\n\nМи мусимо ретельно зважити всі варіанти, щоби не здешевити."
 wtt_warlord_vs_prc.3.t:0 "[SOV.GetLeader] відмовляється"
 wtt_warlord_vs_prc.36.desc:0 "[From.GetNameDefCap] не бачить очевидних переваг, які дало б створення єдиного Народного фронту для боротьби з націоналістами, реакціонерами та іноземними загарбниками, і заявляє, що наш альянс йде «врозріз із [From.GetAdjective]ими інтересами»."
 wtt_xian_incident.10.t:0 "[PRC.GetLeader] пропонує альянс"
 wuw_GER_chinese_diplomacy.4.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 wuw_GER_diplomacy.11.t:0 "[FROM.GetNameDefCap] зриває наші плани"
 wuw_GER_diplomacy.111.a:0 "У нас немає іншого вибору..."
 wuw_GER_diplomacy.22.t:0 "[FROM.GetNameDefCap] відхиляє наше запрошення"
 wuw_GER_diplomacy.26.t:0 "Пропозиція про спільні дослідження"
 wuw_GER_diplomacy.34.desc:0 "[FROM.GetAdjective] виявилися вірними партнерами. Ми підписали 99-річну оренду [743.GetName] у 1898 році, але її перервала Велика війна. Після періоду окупації [JAP.GetNameDef] територія була повернута [FROM.GetNameDef], і, на щастя, вони вирішили дотриматися нашої угоди."
 wuw_GER_diplomacy.53.t:0 "[FROM.GetNameDefCap] пропонує торговельне партнерство"
 wuw_GER_diplomacy.55.a:0 "Їхня втрата"
 wuw_GER_diplomacy.62.t:0 "[FROM.GetNameDefCap] стоїть на своєму щодо [912.GetName]"
 wuw_GER_diplomacy.75.t:0 "Громадянська війна у [ROOT.GetNameDef]"
 wuw_GER_diplomacy.77.t:0 "[FROM.GetNameDefCap] вимагає провести референдум щодо приєднання"
 wuw_GER_diplomacy.85.t:0 "[FROM.GetNameDefCap] вимагає нашої інтеграції"
 wuw_GER_diplomacy.87.a:0 "Потрібно дотриматись слова"
 wuw_GER_diplomacy.92.a:0 "Ульбріхт підходить — міняємо"
 wuw_GER_monroe.2.a_tt:0 "§YДоктрина Монро§! буде скасована у всіх країн, які ще її мають. Гарантує країни, які не виступили проти Доктрини, за вартістю £GFX_pol_power §Y25 політичної влади§! §Rза кожну гарантовану країну§!!\n\nНаразі §Y[?global.monroe_countries_in_support^num] країн§! підтримують Доктрину, ще §Y[?global.monroe_doctrine_countries_to_destabilize^num]§! — підтримують її пасивно.\n\nПоточна вартість гарантій: £GFX_pol_power §Y[?USA.monroe_countries_all_in_support_guarantee_cost]§!"
 wuw_GER_monroe_news.1.t:0 "Занепад Доктрини Монро"
 wuw_GER_realpolitik.14.t:0 "[FROM.GetNameDefCap] приймає наші вимоги"
 wuw_GER_realpolitik.15.a:0 "Вони ще пошкодують про це"
 wuw_GER_realpolitik.17.b:0 "Нехай забирають силою!"
 wuw_GER_realpolitik.23.t:0 "[FROM.GetNameDefCap] запрошує нас до альянсу"
 wuw_GER_realpolitik.51.a:0 "Це не варте пролиття крові"
 wuw_GER_realpolitik.62.b:0 "Ми будемо пильно за ними спостерігати"
 wuw_GER_realpolitik.8.t:0 "[FROM.GetNameDefCap] приймає наші вимоги"
 wuw_GER_realpolitik.9.a:0 "Вони ще пошкодують про це"
 wuw_GER_reichskommissariats.12.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.3.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_reichskommissariats.4.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_the_battle_of_britain.01.b:0 "Він обіцяє забагато"
 wuw_GER_uncertain_future.02.desc:0 "Після завершення громадянської війни Німеччина поступово відновлюється, але її народ прагне стабільності та безпеки. [ROOT.GetLeader] не робить кроків уперед і не виявляє інтересу до формування майбутнього нової німецької держави. Це викликає серйозне занепокоєння серед населення, яке хоче залишити минуле позаду."
 wuw_GER_weltpolitik.12.a:0 "Все для наших друзів"
 wuw_GER_weltpolitik.16.t:0 "[FROM.GetNameDefCap] встановлює сфери впливу"
 wuw_GER_weltpolitik.6.b:0 "Не варто тиснути далі"
 wuw_GER_weltpolitik.9.t:0 "[BEL.GetNameDefCap] відмовляється здати Конго"
 wuw_HUN_a_holy_empire_desc:0 "Тепер, коли Святу Землю контролює справжній Король Єрусалима, ми можемо звернутися до Папи Римського з проханням про благословення. Королівство Єрусалим нарешті відновлено, і наш народ має зрозуміти, що їх монархи справді обрані Богом."
 wuw_HUN_absolute_rule_of_the_national_unity_party_desc:0 "Завдяки нинішній керівній партії прем'єр-міністра — Партії єдності — [ROOT.GetLeader] може зберегти повний контроль над політикою, не скасовуючи формально вибори."
 wuw_HUN_announce_the_gyor_program_desc:0 "Наша армія критично слабка, і ми мусимо збільшити її чисельність і боєздатність. Для цього потрібно значно посилити промисловість, щоб задовольнити зростаючі потреби в обладнанні. П’ятирічна програма Дьорі передбачає збільшення державних витрат не лише на військову галузь, а й на суміжні — промисловість, сільське господарство, інфраструктуру та освіту."
 wuw_HUN_cancel_the_german_trade_deal:0 "Скасувати торгівельну угоду з [GER.GetAdjective]"
 wuw_HUN_construct_the_szeretfalva_deda_railway_line_tt:0 "Будує §Yзалізницю§! рівня 2 з Будапешта до Деди"
 wuw_HUN_danuvia_submachine_guns:0 "Пістолети-кулемети Danuvia"
 wuw_HUN_establishing_a_new_dynasty:0 "Заснування нової династії"
 wuw_HUN_expand_the_ganz_muvek_desc:0 "Завод Ganz and Partner Iron Mill and Machine Factory слід розширити, включивши до його складу менші підприємства, щоб централізувати промислові потужності та ефективніше спрямовувати фінансування на розвиток."
 wuw_HUN_expand_the_hungarian_academy_of_sciences:0 "Розширити Угорську академію наук"
 wuw_HUN_invest_in_destroyer_models_desc:0 "Міноносці — життєво важлива, але часто недооцінена частина флоту. Їхня дешевизна робить їх хорошим стартом для флотської програми."
 wuw_HUN_magyar_cserkeszszovetseg_desc:0 "Угорська скаутська асоціація, заснована в 1912 році, підготувала чимало талановитих молодих [ROOT.GetAdjective]их громадян до самозахисту й парамілітарних операцій. Ми повинні офіційно інтегрувати її до королівської гвардії, надаючи лідерам аристократичні титули."
 wuw_HUN_march_south_desc:0 "Ми втратили території не лише на півночі, сході та заході, а й на півдні, зокрема через утворення Югославії. Ми повинні відновити справедливість для нашого народу у Войводині та Банаті."
 wuw_HUN_news_events.7.b:0 "Що ж вони задумали?"
 wuw_HUN_promote_increased_urbanization:0 "Сприяти урбанізації"
 wuw_HUN_reinstate_the_pragmatic_sanction:0 "Відновити Прагматичну санкцію 1713 року"
 wuw_HUN_reintigrate_the_imperial_railroads_desc:0 "Залізничні мережі, що охоплювали колишню Австро-Угорську імперію, розділилися після її розпаду на незалежні держави. Ми повинні звернутися до колишніх суб’єктів імперії та запропонувати реінтеграцію залізничної мережі для загального покращення інфраструктури."
 wuw_HUN_renew_the_rome_protocols_desc:0 "У світлі постійного ревізіонізму з боку [GER.GetNameDef], ми маємо оновити Римські протоколи, підписані у 1934 році. Ці угоди допоможуть ізолювати загрози з боку [GER.GetAdjective] та [YUG.GetAdjective] і можуть стати основою для майбутнього альянсу."
 wuw_HUN_soviet_hungarian_war_indsutry:0 "Радянсько-угорська військова промисловість"
 wuw_HUN_subvert_gombos_troops_desc:0 "Фашистський прем’єр-міністр Дюла Гьомбьош керує численними парамілітарними формуваннями, зокрема Угорською національною оборонною асоціацією. Ми повинні нейтралізувати ці групи до того, як вони стануть загрозою нашому королівству."
 wuw_HUN_the_spirit_of_the_aster_revolution_desc:0 "Після Великої війни Карої та народ шукали демократію. Ми повинні згадати той дух солідарності та разом будувати майбутнє."
 wuw_HUN_the_toldi:0 "Toldi"
 wuw_HUN_the_turan:0 "Turán"
 wuw_HUN_undermine_the_volksbund_tt:0 "Коли почнеться §Y[ROOT.GetAdjective]а громадянська війна§!, противник не отримає жодного додаткового підрозділу §YФольксбунд§!, а ми отримаємо §G+15%§! підтримки війни та §G+75§! політичної влади"
 ww_BEL_event_diplomatic.12.b:0 "Ми не можемо їм допомогти"
 ww_BEL_event_diplomatic.13.t:0 "[FROM.GetNameDefCap] Гарантує нашу незалежність"
 ww_BEL_event_diplomatic.28.a:0 "Це дуже тривожно"
 ww_BEL_event_diplomatic.34.b:0 "Французів не можна довіряти!"
 ww_BEL_event_diplomatic.34.desc:0 "Неважливо, як добре ми озброєні, ми повинні прийти до терміну з тим, що наш південний сусід, ймовірно, завжди буде мати більше можливостей, ніж ми. Ми повинні домовитись, чи вважаємо ми їх другом, чи ворогом?"
 ww_BEL_event_misc.1.a:0 "Його наступник — це людина, яка може виконати роботу!"
 ww_BEL_event_political.4.desc:0 "Попри початкові ознаки економічного відновлення, ми знову стикаємось з фінансовою кризою. Прем'єр-міністр [BEL.GetLeader] не зміг провести свій бюджет через парламент, не здобувши широку підтримку необхідних податкових реформ, що призвело до погіршення стану державних фінансів та знову до падіння уряду. \n\nЦе призвело до швидкого переходу влади до Поля-Анрі Спака, зірки Лейбористської партії та першого соціалістичного прем'єр-міністра Бельгії."
 ww_BEL_event_spanish_interaction.5.desc:0 "Нещодавно ми побачили збільшення імміграції громадян [FROM.GetAdjective]. Багато з цих іммігрантів висловили бажання приєднатися до наших збройних сил, якщо ми потребуватимемо їхньої допомоги. Можна лише уявити, що це свідоме зусилля з боку [FROM.GetAdjective]."
 ww_BEL_event_war.7.t:0 "Потенційна обмежена війна — Париж повинен впасти!"
 ww_congo.1.a:0 "Чудове підсилення"
 ww_congo.16.a:0 "Вони приречені на невдачу"
 ww_congo.40.a:0 "Каса-Вубу дійсно є ідеальним кандидатом для цієї посади"
 ww_congo.41.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef] та Альянсу баконго, звернувся до нас з вимогою передати їм будь-які території з переважною кількістю баконго. Як ми повинні відповісти?"
 ww_congo.42.a:0 "Чудово!"
 ww_congo.44.t:0 "Дім Агуа Розада"
