 SOV_the_military_conspiracy_desc:0 "Троцькістська змова в нашій країні дісталася і до військових. Ми маємо докази того, що провідні генерали і навіть маршали вступили в змову з іноземними спецслужбами з метою повалення влади! Ми не можемо допустити, щоб офіцери, лояльність яких викликає навіть легку підозру, залишалися на посадах, де вони можуть ще більше послабити нашу армію."
