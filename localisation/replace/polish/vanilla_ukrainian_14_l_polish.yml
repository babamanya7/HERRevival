 SWI_purchase_german_planes_desc:0 "Маючи застарілі військово-повітряні сили та брак промисловості та технологій для виробництва літаків у будь-якій значній кількості, ми змушені покладатися на закупівлю їх у наших сусідів. Придбання потрібних нам літаків у [GER.GetName] не лише забезпечить нас необхідним обладнанням, але й допоможе залишатися на їхньому доброму боці."
