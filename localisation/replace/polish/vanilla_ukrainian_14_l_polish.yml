 GRE_megali_idea_approved:0 "§YВелика ідея§! прийнята"
 GRE_nationalized_banks_desc:0 "«Deutsche Bank» і «Bank of England» надто довго експлуатували грецький народ, позбавляючи його і без того мізерного заробітку і караючи його за дії диктаторського уряду, який той не обирав! Ми вважаємо, що грекам більше не потрібно терпіти експлуатацію, а їхні кошти мусять іти на потреби власного уряду!"
 GRE_no_debt_paid:0 "§YБорг не сплачений§!"
 GRE_protecting_our_skies:0 "Захист нашого неба"
 GRE_renegotiate_debt_with_france_desc:0 "Французи, здається, не можуть розквитатися зі своєю зовнішньою політикою на Балканах. Що ж, запропонуємо їм угоду настільки просту, що навіть вони не зможуть зрозуміти її неправильно. Забудьте про наш обов'язок, а ми пустимо свої сили на те, щоби допомогти французькому режиму."
