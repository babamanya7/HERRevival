 HINT_NATIONAL_FOCUS_RECOMMENDED_TEXT:0 "Рекомендований національний фокус"
 HINT_NO_TEMPLATE_HAVE_XP_TEXT:0 "Ви клацнули на сповіщення §YШаблон відсутній§!, яке вказує, що Ви виробляєте невикористовуване озброєння.\n\nЩоб Ваші дивізії почали використовувати новий тип озброєння, Вам потрібно відредагувати який-небудь §Yшаблон дивізії§!. Редагування шаблону коштує £army_experience£ §Yдосвіду армії§!.\n\nПерейдіть в екран §Yтренування та розгортання§! й оберіть шаблон для §Yредагування§!.\n\nНавівши курсор на сповіщення, Ви можете побачити, яке невикористовуване озброєння Ви виробляєте."
