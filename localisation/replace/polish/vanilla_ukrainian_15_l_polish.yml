 SSB_expand_turkeys_military_infrastructure_desc:0 "[TUR.GetNameDefCap] сповнена гір, і в результаті [TUR.GetAdjective] армія добре обізнана у веденні гірських боїв. Обмін цією інформацією та технологіями з пактом вигідний для всіх."
 SSB_military_cooperation_desc:0 "Перед обличчям зростаючої загрози закінчення «Великої гри» нашим підкоренням великою державою, військова співпраця в рамках Саадабадського пакту ніколи не була такою життєво важливою. Якщо ми не об'єднаємо нашу оборону, ми ризикуємо бути розгромленими поодинці."
