 ITA_emilio_de_bono:0 "Еміліо Де Боно"
 ITA_export_midget_submarines:0 "Експортувати карликові підводні човни"
 ITA_fanti_dell_aria_desc:0 "Кривава патова ситуація на фронті Ізонцо під час Великої війни змусила нас піти в лобові атаки проти добре підготовленого ворога. Єдиним способом досягти прориву було перетнути нейтральну зону та захопити ворожу траншею. Сучасні літаки можуть швидко доставити групу солдатів далеко в тил ворога. Десантуючися на парашутах, вони можуть зайняти стратегічні об'єкти для дестабілізації лінії фронту противника."
 ITA_fiocchi_munizioni:0 "Fiocchi Munizioni"
 ITA_franco_italian_pact_desc:0 "Військове співробітництво з Францією, як і пакт про ненапад, має велику цінність. Ми би не лише убезпечили наш західний фланг у Європі, але й значну частину наших африканських володінь, що дозволило б нам зосередитися на інших напрямках."
 ITA_giovanni_messe:0 "Джованні Мессе"
 ITA_giuseppe_borea:0 "Джузеппе Бореа"
 ITA_has_completed_cooperation_programs_focus_tt:0 "\nКоли буде завершено фокус §Y$ITA_cooperation_programs$§!:"
 ITA_heavy_cruiser_1:0 "Клас «Trento»"
 ITA_incrociatori_leggeri:0 "Incrociatori Leggeri"
 ITA_incrociatori_leggeri_desc:0 "Досить швидкі та потужні, щоби боротися з іншими легкими крейсерами та змітати есмінці перед ними, але досить дешеві, щоби збирати їх у великій кількості, легкі крейсери важливі для захисту наших морських шляхів і для боротьби з ворожими конвоями. Спираючись на наш досвід з класами «Condottieri», «Montecuccoli» та «Garibaldi», ми можемо створити крейсерські сили, які пануватимуть морями між Європою й Африкою."
 ITA_infantry_equipment_0:0 "Carcano M91"
