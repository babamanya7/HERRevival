 WW_hungary.103.desc:0 "Після озброєння своїх прихильників для захоплення влади, Гьомбош вирішив позбутися їх. Але зранку вони оточили палац і вимагають його відставки на користь Ференца Салаші. Країна — на межі розвалу. Що робити?"
