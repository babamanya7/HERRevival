 SOV_found_the_comecon:0 "Заснувати РЕВ"
 SOV_fyp_controlled_factories_tier_1_tt:0 "Більш ніж §Y[?ROOT.SOV_fyp_factory_requirement_tier_1]§! заводів під контролем (наразі §[GetColorControlledFactoriesTier1][?ROOT.num_of_controlled_factories]§!)"
 SOV_gain_support_from_party_members_desc:0 "Деякі сталінські маріонетки поводяться так переважно тому, що вони бояться. Ми мусимо переконати їх, що наш план матиме успіх, і що вони можуть стати героями, навіть не докладаючи особливих зусиль. Для цього є способи..."
 SOV_gosproyektstroy_bring_foreign_experts_desc:0 "Ми підпишемо угоду з великими [FROM.GetAdjective]ими промисловими підприємствами, щоби залучити інженерів-експертів і архітекторів із держави [FROM.GetNameDef] в якості консультантів для наших промислових проєктів."
 SOV_great_purge_tt:0 "Буде проведено серію §Yпоказових судових процесів§! з метою очищення від підозрюваних троцькістських міністрів та лідерів.\n"
