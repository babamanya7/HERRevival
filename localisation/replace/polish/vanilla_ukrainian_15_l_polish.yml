 SOV_pressure_country_government_middle_east_desc:0 "$SOV_pressure_country_government_baltic_desc$"
 SOV_progress_cult_desc:0 "Ми мусимо відзначати інновації видатних радянських вчених і заохочувати правильне вільне мислення. СРСР завжди буде попереду занепадаючого Заходу, коли справа доходить до сміливих нових галузей науки; тільки-но подивіться на блискучу роботу товариша Лисенка!"
