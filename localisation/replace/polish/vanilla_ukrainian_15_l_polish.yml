 GER_anschluss_army_trigger_tt:0 "§Y[ROOT.GetAdjectiveCap]а§! армія принаймні в §Y[?global.deployed_manpower_ratio_needed_for_anschluss]§! разів переважає §Y[AUS.GetAdjective]у§! армію, якщо лічити лише належне оснащені частини.\n\nЗа нашими оцінками, ми [GetAnschlussProgress]."
 GER_anschluss_rejected:0 "Австрія відхилила аншлюс"
 GER_army_indoctrination_desc:0 "Хабарництво та грошові заохочення чудово працюють для наших старших офіцерів та окремих осіб у Вермахті. Однак для рядового солдата ми не можемо покладатися на хабарі, інакше наша економіка буде в руїнах. Переконати їх у повній згоді з нашими рішеннями за допомогою пропагандистських зусиль може бути більш розумним варіантом дій."
 GER_army_innovation_2:0 "Інновації в армії II"
 GER_asian_allies_faction_tt:0 "Незалежні азійські малі держави, які не входять до фракцій, отримують наступну подію:"
 GER_bulwark_against_bolshevism_tt:0 "§RЦей національний дух буде втрачено, якщо ви опинитеся в альянсі або у війні на одному боці з державою [SOV.GetNameDef].§!\n"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "Ми мусимо добитися від нашого нового союзника дозволу на свободу дій щодо повернення Ельзасу–Лотарингії та захоплення своєї частки африканських колоній."
 GER_communist_intel_modifier_desc:0 "Наявність належного Розвідувального крила зробить наш збір, обробку та аналіз інформації більш ефективними."
