 EST_UGRA_democratic_DEF:0 "Фінська республіка"
 EST_alex_nirk:0 "Алекс Нірк"
 EST_baltic_unification:0 "Об'єднання Балтії"
 EST_break_the_silence_desc:0 "Константін Пятс встановив свою диктатуру під приводом захисту Естонії від фашизму та комунізму. Тепер, коли ці ідеології більше не актуальні, немає жодної причини зберігати диктатуру. Настав час провести вільні вибори."
 EST_convert_FIN_cat:0 "Марш крізь Фінляндію"
 EST_delay_the_crackdown_desc:0 "Хоча ми хотіли би, щоб із вапсами було покінчено якнайшвидше, ми не можемо ризикувати, кидаючи країну в хаос; репресії необхідно відстрочити."
 EST_empower_finnish_militants:0 "Посилити фінських бойовиків"
 EST_events.4.d:0 "The Baltic States have often shared a history of being suppressed under foreign powers; Poles, Germans, Russians, but [From.GetLeader] declares this no more! Though the virtues of nationalism and self-determination burn in the hearts of all Baltic peoples, [From.GetLeader] makes the compelling claim that our history of foreign rulership can be singularly attributed to our lack of unity, and as much as many thirst for independence, the growing threat of a [SOV.GetAdjective] invasion calls for a form of pan-nationalism to be adopted by our governments.\n\n[From.GetLeader.GetSheHeCap] proposes a [BAL_UNIFIED_fascism] to keep our people safe and strong against the foreigners who would dare to attempt to enslave us."
 EST_events.802.a:0 "Цікаво."
 EST_forest_brothers_desc:0 "Ми чуємо історії про партизан-антикомуністів, які ховаються в зимових лісах по всій Балтії і здійснюють наліт за нальотом на війська окупантів. Ми мусимо налагодити зв'язок із цими борцями за свободу і всіляко їх підтримувати."
 EST_leo_sepp:0 "Лео Сепп"
 EST_national_council:0 "Убезпечити Національну раду"
 EST_put_vaps_leaders_on_trial_desc:0 "Не секрет, що деякі члени уряду симпатизують руху вапсів. Цього не можна допустити; членів нашого військового персоналу необхідно судити як зрадників за зв'язок із вапсами."
 EST_ship_torpedo_sub_4:0 "6x 533-мм ТА з P.Loading"
 ETH_African_Union_democratic_DEF:0 "Африканський Союз"
 ETH_BoP_purge_communists_tt:0 "Непростий мир між Чорними левами та офіцерами-комуністами починає руйнуватися. Офіцери явно мають намір централізувати владу і створити авторитарну державу, лояльну до себе. Ми повинні усунути їх, поки вони не зруйнували все, що ми побудували."
 ETH_african_central_bank:0 "[ETH_GetCentralBankName]"
 ETH_anarchist_influence_range:0 "Анархісти впливають на політику"
 ETH_balcho_safo:0 "Балча Сафо"
 ETH_boots_on_the_shore_desc:0 "Ми маємо довгу історію торгівлі та культурного обміну з народами Аравійського півострова. На жаль, вони залишаються в пастці своїх феодальних систем правління. Якби ми звільнили людей півострова, ми змогли б контролювати життєво важливий торговельний шлях уздовж Червоного моря та спрямувати свій вплив глибоко на Близький Схід."
 ETH_bring_in_foreign_advisors:0 "Привести іноземних радників"
 ETH_build_local_resistance_force_increase_tt:0 "Буде завербовано §G1§! дивізію арбеньйоків, яка може повстати в області."
 ETH_cede_states_tt:0 "\nПісля скінчення війни §Y[ITA.GetNameWithFlag]§! отримає ось ці області:"
 ETH_conquer_harar_mission_desc:0 "Ефіопи перегруповуються в горах. Нам потрібно захопити місто [835.GetCapitalVictoryPointName] до того, як вони встигнуть закріпитися на своїх позиціях."
 ETH_copy_plane_designs:0 "Скопіювати дизайни літаків"
 ETH_demoralized_ras_idea:0 "Деморалізоване вище командування"
 ETH_destroyers_tt:0 "[ETH.GetName] отримує 5 есмінців від [JAP.GetName]."
 ETH_ecole_learn_tt:0 "Ідею §Y[GetEthiopianArmySpiritName]§! буде змінено:\n$MODIFIER_XP_GAIN_ARMY$: §G+5%§!"
 ETH_ethiopian_industrial_research_institute_desc:0 "Якщо ми хочемо уникнути того, щоб індустріально завжди залишатися на крок позаду інших націй, ми повинні поліпшити наші вітчизняні дослідницькі установи. Таким чином ми почнемо створювати власні інновації, а не імпортувати ідеї з-за кордону."
 ETH_ethiopian_shipbuilding_desc:0 "Тепер, коли ми створили власний порт, було б розумно закласти основи для будівництва та підтримки власного флоту. Нам, безперечно, знадобляться власні кораблі, якщо ми хочемо зберегти доступ до глобальних судноплавних шляхів."
 ETH_freedom_at_gunpoint_category:0 "Свобода під дулом рушниці"
 ETH_international_red_cross_dynamic_modifier:0 "Міжнародний Червоний хрест"
 ETH_invest_in_state_industry_tt:0 "Змінити §Y$ETH_state_development_dynamic_modifier$§! на:\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+20%§!"
 ETH_japanese_dockyard_investments_decision:0 "Японські кораблебудівні інвестиції"
 ETH_learning_from_the_enemy_tt:0 "Змінити §Y$ETH_industrialization_dynamic_modifier$§! на:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10%§!"
 ETH_local_committees:0 "Місцеві комітети"
 ETH_local_development_state_grows_mission_desc:0 "[?ETH.ETH_local_state.GetName] процвітає за нинішнього правління. Сільськогосподарське виробництво зростає, а міста та села розростаються."
 ETH_local_weapons_manufactories_idea:0 "Місцеве виробництво зброї"
 ETH_max_japanese_investments_tt:0 "Інвестиції можуть бути зроблені у не більш ніж §Y3§! областях. Кількість областей, у які інвестується: §Y[?ETH_japanese_invesment_states]§!"
 ETH_menen_asfaw:0 "Імператриця Менен Асфау"
 ETH_mutual_defense:0 "Взаємна оборона"
 ETH_offer_peace_ERI_tt:0 "Запропонувати власнику [ERI.GetAdjective]ої території мир, якщо він погодиться відмовитися від претензій на територію, яку наразі контролює [ETH.GetName]. [ERI.GetAdjectiveCap]а територія, яку наразі контролює [ETH.GetAdjective]а влада, стане [ETH.GetAdjective]ою маріонеткою."
 ETH_peace_negotiations_desc:0 "Наш народ багато чим пожертвував, щоби зупинити [ITA.GetAdjective]е вторгнення. Тепер, коли ми довели [ITA.GetAdjective], що не впадемо перед ними, у нас є можливість укласти мир. Або, принаймні, угоду про припинення вогню."
 ETH_reclaiming_ethiopia_desc:0 "Ми поступово схиляємо наших господарів до офіційного визнання [ETH.GetLeader] як подальшого законного правителя [ETH.GetName], незважаючи на незаконну окупацію [ITA.GetName]. Їм потрібен ще один поштовх, і ми нарешті зможемо розпочати довгоочікувану визвольну кампанію."
 ETH_reintegrate_former_territory_category:0 "Відвоювати імперію"
 ETH_retake_territory_mission_desc:0 "Половина держави [ROOT.GetName] перебуває під контролем ворога. Місцеві раси засмучені тим, що їхня територія покинута, і ставлять під сумнів центральну владу. Йдуть розмови про укладення угоди з італійцями. Повернення контролю над [ROOT.GetAdjective]ою територією — єдиний спосіб переконати людей у перемозі."
 ETH_scavenging_tactics:0 "Тактика збирання"
 ETH_seize_the_means:0 "Захопити засоби виробництва"
 ETH_soviet_mediation_desc:0 "Незважаючи на героїчні зусилля нашого народу, щоби зупинити [ITA.GetAdjective]е вторгнення, ми далекі від того, щоби досягти повної перемоги над ними. Ліга Націй продемонструвала своє небажання допомагати нам, тому наша єдина надія — [SOV.GetNameDefCap]."
 ETH_start_civil_war:0 "§Y$ETH_haile_selassie_gugsa$§! розпочне §Yгромадянську війну§! проти §Y$ETH_haile_selassie$§! після завершення фокусу §Y$ETH_declare_for_italy$§!."
 ETH_support_from_the_japanese_communists_tt:0 "§Y$IA_sakutaro_iwasa$§! та §Y$IA_sanshiro_ishikawa$§! стануть доступні як радники."
 ETH_supported_independence:0 "[ETH.GetName] підтримала боротьбу за незалежність"
 ETH_tactical_training_desc:0 "Дуже часто підготовка наших збройних сил є непослідовною та застарілою. Нам потрібно стандартизувати тактичну підготовку, яку проходять усі наші війська, щоб вони були більш ефективними на полі бою."
 ETH_tadesse_birru:0 "Тадессе Бірру"
 ETH_tax_exemption_default_title:0 "Розгорнути податкові пільги"
 ETH_the_italo-ethiopian_empire_tt:0 "Відмикає рішення §YІтало-[ETH.GetAdjective]а імперія§!, щоби зробити осердними заявлені області після їхнього захоплення.\nВони будуть передані, якщо в заявленій області чи будь-якій суміжній області немає ворожих дивізій."
 ETH_the_lion_stands_firm_tt:0 "\nЗмінити §Y$ETH_army_1_dynamic_modifier$§! на:\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+5%§!"
