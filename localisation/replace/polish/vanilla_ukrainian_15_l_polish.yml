 POR_air_naval_research_desc:0 "Ми повинні зібрати наших найкращих пілотів і морських офіцерів, щоби розробити нові способи координації нашої зростаючої авіації та флоту."
 POR_british_investment_in_mines_desc:0 "Британський уряд продемонстрував свою зацікавленість в інвестуванні в розробку ресурсів нашої країни. Це може бути цінною можливістю поліпшити наші видобувні потужності та наші досягнення в дослідженнях і розробках."
