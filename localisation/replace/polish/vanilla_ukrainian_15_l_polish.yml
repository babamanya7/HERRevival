 BUL_condemn_macedonian_organizations_rearmament_tt:0 "\nВиконання цього фокусу зробить §Y[ENG.GetNameWithFlag]§! більш схильним до зняття обмежень з болгарської армії крізь рішення §YОбговорити переозброєння Болгарії§!."
 BUL_consolidate_dominance_of_the_seas_desc:0 "Якщо ми хочемо убезпечити Балкани, недостатньо розгорнути велику армію на півострові, нам також потрібно побудувати потужний флот, який охороняє моря, які його оточують."
 BUL_context_of_death_assassinated:0 "Кілька годин тому цар Боріс III виходив з Софійського університету після відвідування щорічного Національного конгресу візантиністів, коли до царя стрімко наблизився чоловік, витягнув зброю й кілька разів вистрілив у Боріса, перш ніж був застрелений силами безпеки. Кілька хвилин по тому і цар Боріс III, і його вбивця лежали мертві."
 BUL_cooperation_bzns_legalize_faction:0 "Легалізувати організацію [GetBznsName]"
 BUL_cooperation_fund_zveno:0 "Фінансувати $BUL_zveno_name_gen$"
 BUL_cooperation_fund_zveno_desc:0 "Для підтримки наших політичних союзників ми забезпечимо фракцію [GetZvenoName] коштами на кампанію пропаганди, що збільшить її популярність."
