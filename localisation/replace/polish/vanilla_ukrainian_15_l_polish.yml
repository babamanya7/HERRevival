 BRA_posts_for_generals:0 "Міністерські посади для генералів"
 BRA_rapid_industrialization_desc:0 "Інвестиції, які ми зробили в нашу цивільну промисловість, виявилися дуже вигідними як для наших робітників, так і для країни. Можливо, ми повинні розглянути можливість подібних інвестицій у нашу внутрішню військову промисловість."
 BRA_reject_cosmopolitanism_desc:0 "Нещодавня тенденція до космополітизму є нічим іншим, як троянським конем для комуністичного втручання в нашу велику націю. Ми — [BRA.GetAdjective]а нація, і ми мусимо захищати нашу культуру та ідеали, поки їх не знищили."
 BRA_rome_accords:0 "Укласти Римські угоди"
 BRA_royal_colleges_desc:0 "Імператор нещодавно виявив гострий інтерес до академічного стану нашої нації і тому видав указ про створення нового Королівського коледжу в столиці для сприяння більшим внутрішнім технологічним інноваціям."
 BRA_silvio_de_noronha:0 "Сілвіу джі Нороня"
 BRA_spread_the_revolution:0 "Розширити революцію"
