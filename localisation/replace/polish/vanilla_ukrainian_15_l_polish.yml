 heavy_water_raid_outcome_tt:0 "Ми спробуємо знищити німецький завод з виробництва важкої води, не давши противнику добитися прориву у розробці ядерної зброї."
 helicopter_recon_desc:0 "Спеціально підготовлені об'єктиви, встановлені на вертольотах, здатні швидко розвідувати місцевість незалежно від рельєфу і завдавати точних ударів там, де це необхідно."
