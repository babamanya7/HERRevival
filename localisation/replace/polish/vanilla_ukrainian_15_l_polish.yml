 sp_air_supersonic_jet_speed_factor_tt:0 " $sp_air_supersonic_jet_speed_factor$: $RIGHT|+=%1$"
 sp_armored_motorized_military_police_tech_desc:0 "Оснащені військовими мотоциклами, ці підрозділи мають завдання підтримувати порядок в тилу, супроводжувати конвої та проводити патрулювання. Їх швидкість та мобільність дозволяють швидко реагувати на порушення порядку та, за необхідності, проводити розвідку в зонах активних бойових дій."
 sp_land_generic_reward_armor_tech_2:0 "Інновативні здобутки"
 sp_land_generic_reward_critical_failure:0 "Критична несправність"
 sp_land_reward_land_cruiser_suspension_desc:0 "Команда проєкту «[SpecialProject.GetName]» вдосконалила передову гідропневматичну підвіску, яка врівноважує величезну вагу техніки, забезпечуючи стабільність і зменшуючи навантаження на ходову систему навіть при пересуванні пересіченою місцевістю. [Character.GetName] вважає, що ця підвіска може бути надійно впроваджена для кращої продуктивності в польових умовах."
 sp_land_reward_option_land_cruiser_communication_redesign:0 "Перероблена внутрішня схема"
 sp_naval_generic_reward_major_progress_2:0 "Величезний успіх!"
 sp_naval_midget_submarine_speed_factor_tt:0 " $sp_naval_midget_submarine_speed_factor$: $RIGHT|+=%1$"
 sp_naval_modern_battleship:0 "Сучасний лінкор"
 sp_naval_proximity_fuzes_unique_reward_a_desc:0 "Неконтактні підривники значно зменшують кількість снарядів, необхідних для ураження ворожої авіації. Готуючись застосувати їх у наших мобільних підрозділах протиповітряної оборони, ми можемо скоригувати обсяг постачання боєприпасів, зберігаючи очікуваний щоденний коефіцієнт влучань."
 sp_naval_submarine_carrier_eq_bonus_stealth:0 "Submarine Carrier - Reduced Visibility"
 sp_naval_super_heavy_battleship_unique_reward_b:0 "Питання пріоритетів: захист"
 sp_naval_support_ships_unique_reward_b_desc:0 "The key question for our repair ship organization: either a larger number of small repair crews, able to service a great number of ships slowly, or a smaller number of more lavishly equipped crews that can repair fewer ships more comprehensively."
 sp_nuclear_bomb_espionage_threats_reward_no:0 "Не посилювати безпеку"
 sp_nuclear_engines:0 "Ядерні двигуни"
 sp_nuclear_generic_industry_tech_reward:0 "Технологічні здобутки"
 sp_refined_pykrete_desc:0 "Завдяки подальшому вдосконаленню пайкериту, ми тепер можемо забезпечити набагато кращу ізоляцію та захист для наших літаків на борту льодового авіаносця."
 sp_rockets_dual_chamber_rocket_engine_2_desc:0 "Подальше вдосконалення подвійного двигуна внутрішнього згоряння може призвести до ще більшого підвищення ефективності конструкції."
