 USA_anti_bolshevist_aid_desc:0 "Кожна зброя, снаряд, куля і пара чобіт, які ми можемо передати тим, хто намагається зупинити таку загрозу, як [GetSovietThreatNameAlt], зрештою допоможуть нам захистити свої рубежі."
