 NO_THREAT_SOURCES_WINDOW:0 "Хроніка порожня."
 NSB_poland_communist_events.5.a:0 "Про незалежність не може бути й мови."
 NSB_poland_events.101.desc:0 "[From.GetNameDefCap] приймає нашу недавню вимогу про поступку всієї Словаччини. [Root.GetAdjectiveCap]і війська вже заповнюють регіон, щоб у зародку придушити будь-який опір. Ця перемога невелика, але вона означає, що світ хоча би трохи боїться [Root.GetAdjective]ої військової машини!"
 NSB_poland_monarchist_events.6.desc:0 "Посилаючись на те, що [Root.GetNameDef] відчуває сильний недолік оборони, представники держави [From.GetNameDef] вимагають, щоб уся держава [Root.GetNameDef] перейшла під польську окупацію. Польща, очевидно ідеями так званого короля Анастасії, плекає ненаситні амбіції щодо уніфікації слов'янських держав. У разі відмови вона недвозначно загрожує нам вторгненням. Що ми відповімо?"
 NSB_poland_royal_election.5.t:0 "Кандидат із Габсбургів"
 NSB_polish_fascist_events.101.a:0 "Ми отримаємо безпеку, але якою ціною?"
 NSB_polish_fascist_events.402.desc:0 "[From.GetNameDef] приймає нашу пропозицію про нові кордони Польщі, і згадані нами регіони вже переходять під наше управління. Нехай ми ніколи і не повернемо собі захід країни, нові землі з лишком компенсують нам територіальні втрати попередніх років."
 NSB_polish_fascist_events.5.a:0 "Відмінна ідея."
 NSB_soviet_academy_of_sciences.1.desc:0 "Сьогодні в пишній церемонії [THIS.GetLeader] та [SOV.GetAdjective] посол офіційно відкрили [THIS.GetAdjective] академію наук. Цей новий інститут, заснований на [SOV.GetAdjective] академії проводити дослідження вищого рівня під наставництвом експертів з держави [SOV.GetNameDef]."
 NSB_soviet_civil_war_common.006.t:0 "Партизани приєднуються до повстання"
 NSB_soviet_civil_war_common.103.b:0 "Мабуть, ми можемо щось їм виділити."
 NSB_soviet_civil_war_common.103.d:0 "Нагорода не варта ризику. Не варто вплутуватися в цей конфлікт."
 NSB_soviet_civil_war_common.108.t:0 "[FROM.GetNameDefCap] відмовляється допомогти"
 NSB_soviet_communist_civil_war.003.b:0 "Народ піде за Риковим."
 NSB_soviet_communist_civil_war.009.t:0 "Смерть Сталіна"
 NSB_soviet_fascist_tsarist.12.t:0 "[FROM.GetAdjectiveCap]а антияпонська пропаганда"
 NSB_soviet_fascist_tsarist.18.a:0 "Повний дипломатичний провал..."
 NSB_soviet_fascist_tsarist.29.desc:0 "[GER.GetAdjective] уряд зв'язався з нами, щоб обговорити пропозицію альянсу наших трьох держав."
 NSB_soviet_fascist_tsarist.3.desc:0 "Представники [FROM.GetAdjective] уряду повідомили нам, що категорично відхиляють будь-яку можливість свого добровільного вступу до Панслов'янського союзу."
 NSB_soviet_fascist_tsarist.32.t:0 "Власов потрапив у полон"
 NSB_soviet_foreign_politics_events.266.desc:0 "[FROM.GetAdjectiveCap]ий уряд досить нашим настроєм на примирення і прийняв нашу пропозицію.\nВсього кілька годин тому [FROM.GetAdjective] і [ROOT.GetAdjective] дипломати підписали пакт про ненапад, [FROM.GetAdjective] посла, може почати нову еру у співпраці на Сході."
 NSB_soviet_foreign_politics_events.282.a:0 "У нас немає іншого вибору."
 NSB_soviet_foreign_politics_events.286.desc:0 "Вчора в офіційній заяві [SIK.GetLeader] запевнив нас у вірності Сіньцзяну державі [ROOT.GetNameDef] і у своєму особистому бажанні продовжувати співпрацю між нашими країнами. Однак, очевидно, що занепокоєні представники держави [SIK.GetNameDef] серйозно нашкодили образу держави [ROOT.GetNameDef] та [SIK.GetLeader] вже далеко не так популярний у партії [SIK.GetRulingParty], як раніше."
 NSB_soviet_foreign_politics_events.31.a:0 "Виправлено ще одну помилку царського режиму."
 NSB_soviet_policies_of_collective_security.5.t:0 "[FROM.GetNameDefCap] відмовляється включати державу [POL.GetNameDef] до складу пакту"
 NSB_soviet_propaganda_capmaign_events.2.a:0 "Час вибраний дуже недоречним."
 NSB_soviet_soviet_german_trade_agreement.3.a:0 "Уперті дурні!"
 NSB_soviet_spanish_civil_war.5.t:0 "Радянські агенти впроваджуються до лав сталінісського командування"
 NUKE_BUTTON_WAR_SUPPORT_DESC:0 "Вплив на підтримку війни буде найбільшим у провінціях з $INFRA|H$ рівнем §Hінфраструктури§! та принаймні $VP|H$ переможними балами"
 NZL_EQUIPMENT_VERSION_7:0 "Mk VII"
