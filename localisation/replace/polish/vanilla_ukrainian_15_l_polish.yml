 ENG_heavy_cruiser_3_desc:0 "Важкі крейсери класу «Admiral» (не плутати з лінійними крейсерами класу «Admiral») були останньою спробою Королівського флоту спроєктувати та побудувати крейсери, озброєні 8-дюймовими гарматами. Дослідження дизайну почалися в 1938 році і закінчилися в 1941 році, в результаті чого з'явилися різні пропозиції. Остаточні пропозиції включали нові 8-дюймові гармати в потрійних баштах, важке зенітне озброєння, товсту броню та хорошу швидкість. Брак ворожих крейсерів і економічна ефективність цих суден призвели до того, що натомість зосередилися на будівництві більш легких крейсерів."
 ENG_heavy_tank_equipment_1:0 "Vickers A1E1 «Independent»"
 ENG_imperial_conference_desc:0 "Востаннє керівники урядів усіх наших самоврядних колоній і домініонів зустрічалися для обговорення питань, що становлять імперський інтерес, у 1932 році. Настав час провести ще одну конференцію, особливо якщо ми хочемо зміцнити Імперію в найближчому майбутньому."
 ENG_imperial_trade:0 "Імперська торгівля"
 ENG_imperialist_new_zealand_neutrality_DEF:0 "Імперіалістично-новозеландськ"
 ENG_isolate_the_mediterranean_threat:0 "Ізолювати середземноморську загрозу"
 ENG_jock_campbell:0 "Джок Кемпбелл"
 ENG_liberate_the_home_of_marx_desc:0 "Батьківщина Карла Маркса заражена фашизмом, що не лише паплюжить його пам'ять, але й слугує вічною образою для всього соціалізму. Настав час вигнати цю злу силу з німецької землі, звільнивши її народ від лжепророків, які ведуть його за собою."
 ENG_light_cruiser_3_desc:0 "Легкі крейсери класу «Crown Colony» були вдосконаленими версіями раннього класу «Town», але зі спрощеною конструкцією для прискорення будівництва та зниження витрат. Кораблі мали ті самі гармати, що й їхні попередники, чотири потрійні башти з 6-дюймовими гарматами. Вони були так само броньовані, але через менші двигуни їх радіус дії дещо зменшений. Тип включав два підкласи: «Fiji» та «Ceylon»."
 ENG_light_tank_aa_equipment_3_short:0 "Valentine (зеніт.)"
 ENG_light_tank_artillery_equipment_1_short:0 "Birch"
 ENG_light_tank_equipment_1:0 "Vickers Medium Mark II"
 ENG_maintaining_the_balance_of_power_bad:0 "Зберігають баланс сил"
 ENG_medium_tank_aa_equipment_1_short:0 "Crusader I (зеніт.)"
 ENG_medium_tank_artillery_equipment_2:0 "Avenger"
 ENG_narvik_crisis:0 "Запустити План R 4"
 ENG_parachute_regiments_desc:0 "Після успіху перших повітряно-десантних операцій на ворожій території стало зрозуміло, що за парашутно-десантними полками — майбутнє. Створення спеціальних тренувальних центрів та обладнання допоможе нам впровадити ці нові технології в нашу загальну стратегію."
 ENG_restoring_public_order:0 "Відновлення громадського порядку"
 ENG_richard_oconnor:0 "Річард О'Коннор"
 ENG_secure_the_oil_imports_desc:0 "Ми не можемо покладатися на мінливий характер торговельних угод з іноземними урядами щодо імпорту нафти. Краще вибороти контроль над нафтовими родовищами, щоб ми могли зберігати повний контроль над ними незалежно від політичного керівництва в інших країнах."
 ENG_submarine_1_desc:0 "Клас «L» були човнами середнього розміру, які спочатку планувалися згідно з Програмою надзвичайної війни як вдосконалена версія попередніх класів підводних човнів. Вони були побудовані наприкінці Першої світової війни та були оснащені новими, більшими 21-дюймовими торпедами. Вони служили до початку Другої світової війни, коли їх здебільшого використовували для середньої та навчальної роботи."
 ENG_tackle_fascism:0 "Побороти фашизм"
 ENG_the_kings_party_desc:0 "Тепер, коли криза минула і уряд впав, найпалкіші прихильники короля можуть сформувати свій власний уряд, набагато більш... прихильний до бажань короля. Ця Королівська партія складатиметься з Дейвіда Ллойда Джорджа, Вінстона Черчилла й Освалда Мослі, таким чином охоплюючи всі політичні партії та допомагаючи відновити єдність нашої нації."
 ENG_the_sun_never_sets_desc:0 "Імперія настільки велика, що над нею ніколи не заходить сонце. Її сила — це Королівські ВМС, які захищають торговельні шляхи та шляхи постачання, що сполучають її і є життєво важливими для нашого процвітання. Цей флот мусить навчитися долати ці величезні відстані з належною швидкістю, щоб ми могли швидко реагувати на будь-яку загрозу, де б вона не виникла."
 ENG_thomas_jacomb_hutton:0 "Томас Джейкомб Гаттон"
 ENG_trade_unions_demand_construction_safety_legislation_desc:0 "Щоб виконати вимоги профспілок, ми ухвалимо нові закони про охорону праці в будівництві, які додатково захистять будівельників."
 ENG_trade_unions_demand_minister_appointment_9:0 "$ENG_trade_unions_demand_minister_appointment_1_NOT$"
