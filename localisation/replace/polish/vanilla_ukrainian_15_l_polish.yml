 FACTION_ACCESS_TAB_LOCK:0 "Заблокувати $NAME|H$ для вашого альянсу."
 FACTION_COMMANDER_DESC:0 "Командувачі театру альянсу передають частину £doctrine_mastery §Hмайстерності§!, отриманої іншими членами альянсу в межах театру, до власної країни, на основі їхніх навичок §Hатаки§! та §Hзахисту§!.\nВони також зменшують §Hспоживання припасів§! на основі їхніх навичок §Hлогістики§! та §Hпланування§!.\n\n"
