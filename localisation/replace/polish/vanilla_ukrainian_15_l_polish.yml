 CHI_communist_infiltration_state_744:0 " [744.GetName][744.GetCommaIfMoreInfiltration]"
 CHI_cooperation_with_the_communists_desc:0 "Незважаючи на всі спроби, Гоміньдану не вдалося створити сучасну державу: країна жахливо роздроблена, селяни живуть у страху перед урядом, на всіх рівнях адміністрації процвітає корупція, а до наших кордонів підступили японські імперіалісти. Можливо, найкраще майбутнє — за комунізмом."
 CHI_coordinate_with_the_army_desc:0 "Перемога приходить через єдність зброї. Наші повітряні та наземні сили повинні діяти як єдине ціле заради однієї місії."
 CHI_defensive_posture_desc:0 "Цей конфлікт — не спринт, а марафон. Занадто рано кинути виклик іншим угрупованням буде згубно для нас, тому поки що ми обмежимося захистом."
 CHI_demand_regional_adherence_tt:0 "Розблоковує рішення для §Yрозвитку§! регіонів, контрольованих мілітаристами, та примусу їх до дотримання Трьох народних принципів, підвищуючи їхню §Yдемократичну§! підтримку та з часом §Yпідкорюючи й інтегруючи§! їх"
 CHI_democracy:0 "Демократія"
 CHI_electrification_and_mass_education_modifier:0 "Електрифікація та масова освіта"
 CHI_empower_the_mtac:0 "Розширити повноваження КСМТ"
 CHI_escort_efficiency_desc:0 "Винищувачі супроводу — це щит для наших бомбардувальників. Покращення координації та прикриття гарантує, що більше літаків повернуться на базу неушкодженими, готовими до наступного вильоту."
 CHI_examination_yuan_desc:0 "Багато століть китайські чиновники проходили відбір на основі суворих іспитів. Вимоги змінюються, але загальний підхід залишається незмінним."
 CHI_fighter_equipment_1:0 "CAMCO Hawk"
 CHI_finance_cooperatives_desc:0 "Кооперативи сповнені життєвої сили та винахідливості, але не мають доступу до кредитів. Хоча ми, можливо, не маємо величезних коштів, потреби кооперативів настільки малі, що ми могли б фінансувати їх самостійно і зробити наступний крок."
