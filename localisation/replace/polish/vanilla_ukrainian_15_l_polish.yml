 SIA_reverse_engineer_allied_tanks:0 "Зворотня розробка танків Союзників"
 SIA_royal_palace_bureau_directive_no_1523_desc:0 "Зі сплеском націоналізму в країні навіть корона виступила на підтримку уряду, попросивши кожного співробітника Королівського палацу пожертвувати 10% свого доходу на купівлю сучасного озброєння."
 SIA_securing_the_rubber_islands:0 "Захоплення каучукових островів"
 SIA_ship_torpedo_1:0 "2x 533-мм торпедний апарат"
 SIA_sideline_disloyal_officers_desc:0 "Офіцерський корпус армії не є монолітом. У його лавах є люди, чия лояльність належить колишнім покровителям, конкуруючим фракціям або власним амбіціям, а не уряду. Завдяки обережним перепризначенням та адміністративному тиску ці фігури можуть бути переведені на посади, де вони не становлять загрози, тоді як ті, хто довів свою надійність, отримають обов'язки, на які вони заслуговують."
 SIA_standardize_aircraft_maintenance_desc:0 "Наші літаки надходять з багатьох джерел, кожне з яких має власні запчастини, інструменти та звички ремонту. Стандартизувавши процедури технічного обслуговування під егідою Управління, [ROOT.GetNameDef] зможе утримувати більше літаків у повітрі та зменшити втрати, спричинені плутаниною на землі."
 SIA_thammasat_university_desc:0 "Таммасат, як новостворений університет, може і повинен бути розширений, щоб прокласти шлях для нової ери тайських інновацій."
 SIA_the_builder:0 "Будівничий"
 SIA_the_learned:0 "Вчений"
 SIA_the_midnight_meeting_desc:0 "Фельдмаршал Сонгсурадет спостерігає, як Пібун зосереджує у своїх руках все більше влади, і бачить у цьому обіцянку розплати. Якщо монархія і Сонгсурадет мають вижити, то роялісти, старші офіцери та цивільні посадовці повинні таємно зустрітися і домовитися про усунення Пібуна, перш ніж він виступить проти них."
 SIA_the_sacred_hierarchy_desc:0 "Боворадет вважає, що королівство найсильніше, коли кожен стан знає своє місце, а Корона стоїть вище будь-яких світських амбіцій. Монархію, віру та природну ієрархію [ROOT.GetNameDef] слід знову розглядати як священні стовпи, а не як реліквії, які можна продати."
 SIC_develop_chongqing_desc:0 "Чунцін є серцем Сичуаню, і ми повинні прагнути до його подальшої індустріалізації. Якщо ми хочемо протистояти зовнішнім або внутрішнім загрозам, ми також повинні мати промислову підтримку для цього."
 SIC_develop_xikang_desc:0 "Сікан малонаселений і гористий, що означає, що його часто ігнорували, коли йшлося про розвиток провінцій. Ми повинні намагатися інвестувати в цей район, щоб здобути прихильність людей і, у свою чергу, покращити нашу економічну базу."
