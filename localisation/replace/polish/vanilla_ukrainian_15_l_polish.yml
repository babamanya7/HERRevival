 GER_legacy_of_the_spartacus_league:0 "Спадщина Спартакістської ліги"
 GER_liberate_oppressed_people_desc:0 "У [SOV.GetNameDef] є багато людей, налаштованих до нас прихильно, які понад усе прагнуть звільнення. Можливо, варто звільнити їх від гнобителів і перетворити на наших нових союзників на сході."
