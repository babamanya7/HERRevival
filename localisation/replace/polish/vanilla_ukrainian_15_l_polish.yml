 SOV_military_offensive_ongoing_trigger_default:0 "Контролює §Y[?SOV_military_offensive_states^0.GetName]§! та §Yвсі сусідні області§!, які мають обласний модифікатор §Y$SOV_soviet_military_offensive$§!.\n Контроль над областю §Y[?SOV_military_offensive_states^0.GetName]§! не дасть нам зазнати жодних санкцій, якщо ми не зможемо контролювати жодну з сусідніх областей."
 SOV_military_reorganization:0 "Реорганізація армії"
 SOV_modernize_the_far_eastern_fleet_desc:0 "Цушіма навчила нас, що не можна покладатися на вагу цифр. Для того, щоб по-справжньому виграти морську битву, нам потрібні добре підготовлені екіпажі і бездоганні, сучасні військові кораблі, на яких вони зможуть плавати. Новий флот, який ми будуємо, повинен бути здатним протистояти технологічно розвиненим супротивникам у Тихому океані."
 SOV_nikolay_voznesensky:0 "Микола Вознєсєнський"
