 RAJ_cv_nav_bomber_equipment_2:0 "Blackburn Roc"
 RAJ_east_india_railways_dlc_desc:0 "Розширюючи та модернізуючи Східноіндійські залізниці, ми можемо зміцнити торгівлю, покращити зв'язок та прокласти колії для більш процвітаючої та інтегрованої нації."
 RAJ_education_efforts:0 "Зусилля з освіти"
 RAJ_every_man_a_leader:0 "Кожен чоловік — лідер"
 RAJ_famine_desc:0 "Непрофесіоналізм, байдужість та розбещена корупція колоніальної влади та керівництва індійських залізниць перетворили складну ситуацію на масштабну катастрофу. Країна ще не швидко оправиться від наслідків цієї трагедії."
