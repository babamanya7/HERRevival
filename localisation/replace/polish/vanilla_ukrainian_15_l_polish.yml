 SPR_the_red_tide_desc:0 "Наші люди знають, що наша справа справедлива і правильна, і все, що нам потрібно зробити, це використати ці почуття, щоби забезпечити постійний потік рішучих новобранців для нашої армії. Як червона хвиля, наші сили захлиснуть усіх, хто протистоїть нам."
