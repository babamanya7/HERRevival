 SWE_allow_landsverk_to_operate_desc:0 "Landsverk протягом тривалого часу працював як лазівка для [GER.GetAdjective]их військових, щоб обійти обмеження Версальського договору щодо розробки бронетехніки. Ми повинні й надалі дозволяти їм працювати, щоб ми могли підтримувати тісні зв'язки з [GER.GetName] і скористатися їхніми технологічними розробками."
 SWE_anti_air_equipment_2:0 "20 mm automatkanon m/40"
 SWE_appeal_for_support_desc:0 "Аристократичний істеблішмент [SWE.GetName] бачив, як їхня влада та вплив зменшилися протягом десятиліть, але вони ще не згасли. Згуртувавши їх підтримку та ресурси, ми можемо повернути націю до більш природної форми правління."
 SWE_as_the_barometer_falls:0 "Як падає барометр"
