 LEADER_DEPLOY_REQUISITION_INFO:0 "Коли армійський штаб буде готовий прибути, він реквізує решту спорядження та людських ресурсів з інших дивізій армії, залишаючи щонайменше $PERCENT|0H$§H%§! від максимальної кількості спорядження та живої сили в кожній дивізії."
