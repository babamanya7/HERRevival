 GER_demand_lithuanian_integration_desc:0 "Колись планувалося, що Литовське королівство буде напівавтономною частиною нашої держави — і так воно й буде. Ми маємо приєднати литовські землі та коронувати Міндаугаса герцогом цих територій."
 GER_destroyer_4:0 "Клас «Zerstörer 1944»"
 GER_dismantle_czechoslovakian_forts:0 "Знищення чехословацьких укріплень"
 GER_eben_emael_entry:0 "Узяли участь у німецькому нальоті на Ебен-Емаель"
 GER_eleysa_bazna:0 "$TUR_elyesa_bazna$"
 GER_erich_mielke:0 "Ерих Мільке"
 GER_establish_buna_werke_desc:0 "Масштабна моторизація та авіація потребують великої кількості каучуку, якого ми не маємо у власній Німеччині. Щоби зменшити залежність від зовнішньої торгівлі, ми мусимо будувати заводи з виробництва синтетичного каучуку."
 GER_expand_kummersdorfs_capacity_desc:0 "Ми мусимо очолити розробку танків та впровадити інновації, щоби забезпечити наше домінування на полі бою. Вивчаючи конструкції ворожих танків на об'єктах у Куммерсдорфі та використовуючи найсучасніші технології, ми станемо першопрохідцями, котрі перевершать усіх суперників."
 GER_exploit_puppet:0 "Експлуатувати [FROM.GetName]"
 GER_fan_the_prussian_militarism_desc:0 "Щоб оговтатися від втрат громадянської війни та забезпечити себе новими рекрутами, ми маємо звернутися до прусського мілітаризму. Те, що наші військові сили позбавили нас від нацистської диктатури, помітно спонукало популярність прусських ідеалів."
 GER_flanders_state_transfer_effect_tt:0 "Кожна виділена область перейде під контроль §YФландрівський Державі§!"
 GER_formalize_the_intelligence_wing_desc:0 "Країна сильно постраждала від правителів, які не мали на меті інтереси народу. Щоб ми могли відбудувати націю, спершу треба знати, з чим ми працюємо. Функціональний розвідувальний підрозділ — гарний початок!"
 GER_grosraumwirtschaft_desc:0 "Німеччині судилося стати центром Європи. Наша інфраструктура зв'яже воєдино захід із сходом і південь із північчю."
 GER_heavy_tank_destroyer_equipment_1_desc:0 "Selbstfahrlafette auf VK3001(H) Sturer Emil (з нім. — «Упертий Еміль») — німецька самохідна протитанкова гармата на базі шасі Henschel VK3001."
