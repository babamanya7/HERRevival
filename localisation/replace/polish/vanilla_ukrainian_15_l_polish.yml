 control_bahamas_bases_goal_desc:0 "Володіння базами на Багамах дозволить більш ефективно контролювати морські шляхи Карибського моря та захищати морські підходи до Північної та Південної Америки."
 control_mexican_oil_goal_desc:0 "Забезпечення мексиканських запасів нафти гарантує достатнє постачання палива для промислових та військових потреб."
 control_suez_canal_goal_desc:0 "Володіння життєво важливим Суецьким каналом дасть нам одноосібний контроль над головною транспортною артерією між Європою та Азією, забезпечуючи швидку передачу сил та ресурсів."
