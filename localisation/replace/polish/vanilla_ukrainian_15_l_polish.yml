 FIN_urho_kekkonen:0 "Урго Кекконен"
 FIN_weapon_caches_desc:0 "На випадок, якщо наші збройні сили будуть переповнені і уряд впаде, ми повинні мати план на випадок непередбачених обставин, щоб ми могли відвоювати націю. Однією з пропозицій для цього є таємне розміщення схованок зброї для використання майбутніми силами опору."
