 PRC_destroyers:0 "Есмінці класу «Аньшань»"
 PRC_destroyers_desc:0 "Хоча й застарілі, отримання надлишкових радянських есмінців класу «Гнєвний» створить основу для нашого флоту, яка не вимагатиме багатьох років будівництва великих суден. Ми також можемо капітально відремонтувати та модернізувати ці кораблі після вивчення їхньої роботи."
 PRC_dissent_in_the_united_front_desc:0 "Навіть коли ми воюємо пліч-о-пліч із нашими союзниками, ми повинні підкреслювати переваги нашої ідеології. Це може залучити нам прихильників, можливо, навіть серед фігур, які відіграють важливу роль на іншому боці альянсу."
 PRC_embrace_stalinism:0 "Прийняти сталінізм"
 PRC_embrace_stalinism_tt:0 "Залежно від поточного значення §Y$PRC_communist_power_struggle$§!, §Y$PRC_bolshevik_dominance$§! отримає різні модифікатори.\nПоточний ефект:"
