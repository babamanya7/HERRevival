 matome_ugaki:0 "$JAP_matome_ugaki$"
 maud_focus:0 "Комітет MAUD"
 mechanized_equipment_desc:0 "Механізована піхота оснащена бронетранспортерами (БТР) або бойовими машинами піхоти (БМП) для транспортування та ведення бою. Механізована піхота відрізняється від мотопіхоти тим, що її транспортні засоби забезпечують певний ступінь захисту від ворожого вогню, на відміну від колісних транспортних засобів з м'яким покриттям (вантажівок або джипів) для мотопіхотних військ."
 media_personality_desc:0 "§LЦей генерал лізе зі шкіри, щоб опинитися в променях уваги преси, і часто спілкується з журналістами.§!"
