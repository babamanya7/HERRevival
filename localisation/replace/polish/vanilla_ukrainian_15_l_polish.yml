 modern_naval_mines_desc:0 "Ця високоточна міна виявляє найменші зміни в щільності води, викликані кораблем, що проходить повз."
 modifier_RAJ_ENG_anti_communist:0 "Антиіндійська комуністична програма"
 modifier_production_speed_naval_supply_hub_factor:0 "Швидкість будівництва §Yморських центрів постачання§!"
 modifier_state_production_nuclear_reactor_factor_desc:0 "Модифікатор швидкості будівництва §Yядерних реакторів§! у цій області."
 modifier_state_production_speed_rocket_site_factor_desc:0 "Модифікатор швидкості будівництва §Y$rocket_site_pl_gen$§! у цій області."
 mot_fire_support:0 "Моторизована важкозбройова рота"
 motorized_rocket_equipment_1_short:0 "$motorized_rocket_equipment_short$"
 mountaineers_keystone_2_desc:0 "Маючи знання, які набули наші гірські війська, було би нерозумно не використати їх із користю для інших родів військ сил спеціальних операцій. Ми запровадимо програму ротації інструкторів з надією на поліпшення наших загальних інституційних знань."
 mountainous_republics_unified_neutrality_DEF:0 "Північнокавказький емірат"
 mtg_britain.1.d:0 "Деякий час король Едуард VIII плекав надії одружитися з американкою Уолліс Сімпсон. Тепер виникла конституційна криза, оскільки місіс Сімпсон не тільки розлучена зі своїм попереднім чоловіком, але й фактично все ще перебуває у шлюбі зі своїм теперішнім чоловіком, який зараз перебуває в процесі другого розлучення. Загальне обурення виникло на тій підставі, що, будучи Королем і главою Церкви Англії, Едуард не може одружуватися з розлученою жінкою.\n\nКороль, однак, чітко дав зрозуміти, що він дуже любить місіс Сімпсон і має намір одружитися з нею, незважаючи на думку своїх урядів або підданих. Таким чином, для нього залишаються тільки три варіанти.\n\nБританський уряд і уряди домініонів вже заявили, що будь-яка альтернатива зреченню від престолу буде неприйнятною, і наслідки спроби нав'язати шлюб, навіть спроби компромісу, швидше за все, будуть жахливими не тільки для самої Британії, але і для її зв'язків з Співдружністю. Поки найближчі радники короля продовжують свої спроби переконати його, громадськість, затамувавши подих, чекає на вирішення цього конфлікту між королем і його кабінетом."
 mtg_britain.107.a:0 "Нехай більше такого не повторюється."
 mtg_britain.3.d:0 "Оскільки король не виявив жодного наміру прислухатися до свого уряду, [ROOT.GetLeader] не бачить іншого рішення, окрім як розпустити його. У своїй заяві він сказав: «Очевидно, що уряд не може функціонувати без довіри монарха. Неодноразово відкидаючи одностайну пораду своїх міністрів, він дав зрозуміти, що ця порада не бажана і не виконується, і тому сьогодні ввечері я зустрінуся з Його Величністю, щоб запропонувати відставку кабінету». \n\nОчевидно, що ця заява призначена для остаточного протесту проти рішення Короля, але невідомо, чи буде вона успішною. Також невідомо, кого король оголосить спадкоємцем в уряді і коли."
 mtg_britain.39.d:0 "[From.GetNameDefCap] повідомляє нам про те, що ми відтепер не представляємо для нього безпосереднього інтересу і що вона вирішила «переосмислити» зв'язки, встановлені між нами у Великій війні. Натомість вона тепер укладає союз із Італією."
 mtg_britain.66.c:0 "Our government might not yet share [ENG.GetAdjective] beliefs, but the winds are shifting."
 mtg_britain.69.a:0 "Нехай намагатимуться простежити за виконанням цієї вимоги."
 mtg_britain.97.t:0 "Імперська конференція: політика умиротворення — [From.GetName] погоджується"
 mtg_netherlands.1.a:0 "Не ідеально, але у нас немає вибору."
 mtg_netherlands.11.b:0 "Пообіцяти їм масовий імпорт важливих ресурсів."
 mtg_netherlands.14.d:0 "Стомившись від поразницьких настроїв, що просякнули уряд, королева Вільгельміна наполягла на відставці винних у їхньому поширенні міністрів. Міністру-президенту де Гееру, щоб він зберіг свою репутацію, дозволили піти «за станом здоров'я». Залишається надія що більше він не завдасть нам неприємностей у майбутньому... Пітер Шурдс Гербранді вже відзначився тим, що відмовився від поразкової тактики де Геера, якщо він збереже такий настрій і під час війни, то послужить чудовим прикладом для інших членів кабінету."
 mtg_netherlands.23.a:0 "Світ збережено."
 mtg_netherlands.27.d:0 "Держава [From.GetNameDefCap] вирішила захистити Вест-Індію. Наші колонії можуть не боятися нападу."
 mtg_netherlands.32.t:0 "[From.GetNameDefCap] пропонує скласти спільний план оборони"
 mtg_netherlands.32_tt:0 "§Y[From.GetNameDefCap]§! отримає бонус до захисту дивізій на національній території протягом 180 днів після нападу провідної західноєвропейської держави.\n"
 mtg_netherlands.34.t:0 "[From.GetNameDefCap] відхиляє пропозицію скласти спільний план оборони"
 mtg_netherlands.46.t:0 "Принц Бернард справляє гарне враження"
 mtg_netherlands.72.a:0 "Тепер наш пакт з його батьком поширюється на нього."
 mtg_news.2.desc:0 "Після багатьох місяців протестів і зростаючої напруги між прихильниками президента [USA.GetLeader] та його противниками з так званого «табору конституціоналістів», політики-конституціоналісти оголосили про створення нового уряду в Бостоні, батьківщині першої американської революції. Розділ суспільства проходить по сім'ях та громадських інститутах, схоже, трохи більше половини військових вирішили виступити заодно з конституціоналістами, а уряди штатів по всій країні клянуться у вірності тій чи іншій стороні."
 mtg_news.24.a:0 "Від французів все одно не було сенсу."
 mtg_news.29.b:0 "Нехай приходять!"
 mtg_news.4.desc:0 "\nМирний рух у державі [USA.GetNameDef] зазнав ряд серйозних поразок, коли Конгрес прийняв спільну резолюцію, що дозволяє президентові за необхідності використовувати військову силу для забезпечення [USA.GetAdjective] інтересів у всьому світі.\n\nСхоже, багато членів Конгресу вважають, що саме через [USA.GetAdjective] нерішучість Велика війна тривала так довго і забрала стільки життів, які вказують на той факт, що вона закінчилася через кілька місяців після прибуття до Європи військ США. вони прибули раніше, то, за їхніми словами, вдалося врятувати сотні тисяч життів."
 mtg_news.41.a:0 "Ми переможемо."
 mtg_news.44.c:0 "Невже це наша вина?"
 mtg_news.48.t:0 "[JAP.GetName] отримує Ост-Індію"
 mtg_news.49.desc:0 "[From.GetAdjective]ий і [JAP.GetAdjective]ий уряди виступили із спільною заявою про торгову угоду між двома державами. З цього часу Японія отримує ексклюзивні права на всі ресурси, що експлуатуються в Індонезійському архіпелазі.\n\nЦя безпрецедентна угода — безперечно, спроба [From.GetAdjective] уряду запобігти всім майбутнім загрозам з боку Японії, хоч вона й стурбувала вкрай інші зацікавлені сторони, зокрема, держави [USA.GetNameDef] та [ENG.GetNameDef]."
 mtg_news.59.a:0 "Вона хоч і молода, але сильна."
 mtg_news.63.t:0 "[Root.GetName] оголошує про незалежність"
 mtg_news.8.b:0 "Створюється нова наддержава..."
 mtg_usa_civil_war_democrats.41.d:0 "Попросити Чарлза Ліндберга сформувати новий уряд."
 mtg_usa_civil_war_fascists.1.desc:0 "Під керівництвом американського Срібного легіону низка центристських і правих організацій сьогодні влаштували марш під час однієї з найбільших демонстрацій, що будь-коли відбувалися у Вашингтоні.\n\nМарш закінчився перед Капітолієм, де натовп у Капітолії комуністів», щоби ті постали перед «Великим народним журі» за звинуваченням у державній зраді.\n\nУ приватних бесідах окремі члени адміністрації підтримали деякі із законослухняних вимог протестувальників про верховенство закону та прихильність до системи конституційних противаг та засобів стримування. Через кілька тижнів очікується ще більший наплив протестувальників, тому ми мусимо прийняти виважене рішення."
 mtg_usa_congress_medium_opposition_tt:0 "До §Y8 сенаторів§! і §Y40 представників§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_diplomatic_protest.2.a:0 "Ці території не стоять війни через них."
 mtg_usa_foreign_support.11.desc:0 "Від нашої делегації в державі [From.GetNameDef] надійшло повідомлення. Наші представники не змогли отримати у лідера [From.GetLeader] дозвіл на створення тренувальних таборів і чекають подальших розпоряджень."
 mtg_usa_foreign_support.2.desc:0 "Делегація, яку ми відправили до держави [From.GetNameDef], повідомляє про успішне завершення компанії зі збору коштів. Повідомляється, що значний внесок зробив сам [From.GetLeader]."
 mtg_usa_protect_south_america.2.t:0 "[From.GetNameDefCap] погоджується на наше керівництво"
 mtg_usa_protect_south_america.3.a:0 "Ми не можемо дозволити цим відступникам загрожувати регіону."
 mtg_usa_secure_asia.7.t:0 "[USA.GetNameDefCap] вимагає передачі Індокитаю"
 mtg_usa_secure_asia.9.a:0 "Ми не пожертвуємо національною безпекою."
 mtg_usa_southern_threat.1.a:0 "Ми мусимо погодитися на неприйнятне, щоб уникнути кровопролиття."
