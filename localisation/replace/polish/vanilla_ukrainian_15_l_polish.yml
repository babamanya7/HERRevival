 ARG_accept_german_advisors_desc:0 "Ми завжди підтримували тісні зв'язки з [GER.GetName], і ми, безумовно, можемо отримати вигоду від запрошення багатьох їхніх яскравих умів до [ARG.GetName], щоб допомогти нам у подальшому розвитку наших цілей."
 ARG_counter_intelligence_program:0 "Програма контррозвідки"
 ARG_cut_ties_with_britain_idea:0 "Розірвано зв'язки з Британією"
 ARG_extinguish_south_american_fascism_desc:0 "Пляма, яку фашизм залишив у світі, поширилася на Південну Америку. Ми не можемо стояти осторонь і дозволяти цьому прогресувати. Ми повинні повстати і впоратися з тими країнами, які відмовилися від демократії на користь авторитарної диктатури, перш ніж це пошириться по всьому континенту."
 ARG_fabricaciones_militares_art_organization:0 "Fabricaciones Militares — Departamento de Artillería"
 ARG_fascism_party_long:0 "Національний фашистський союз"
 ARG_federal_intervention_modifier_desc:0 "У цьому штаті було запроваджено федеральне втручання, що означає, що ми змогли захистити його від будь-якого зростання непокори та бунту."
 ARG_generic_democratic_reformer:0 "$ARG_alberto_gilbert$"
 ARG_heavy_cruiser_1:0 "Клас «Garibaldi»"
 ARG_hitler_2_tt:0 "Отримати ціль війни §Y$annex_everything$§! проти всіх §YНефашистських§! націй у §YПівденній Америці§!"
 ARG_hitler_3_desc:0 "Arma Maravillosa — також відома як «Чудо-зброя» — це програма, в рамках якої ми спробуємо розробити потужніші ракети та зброю, які можуть змінити хід війни. Наш Президент звернувся до нас із серією пошкоджених водою документів із неймовірними ідеями, які ми можемо негайно втілити в життя."
 ARG_military_coup_happens_tt:0 "Завершить місію «Неминучий військовий переворот» з відліком часу, дозволивши військовим взяти владу."
 ARG_military_state_absorption_timer_tt:0 "One state in [ARG.GetName] will become aligned with the military."
 ARG_political_events.24.a:0 "Буде вигідно приєднатися до них."
