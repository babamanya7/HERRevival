 UNITS_TOO_WEAK_TO_ATTACK:0 "§RОрганізація військової частини надто низька для просування.§!\nЗачекайте, поки війська реорганізуються або поміркуйте над зміною §Yагресивності§! виконання планів бою."
 UNITS_VIEW_BORDER_CONFLICT:0 "Ця армія бере участь у прикордонному конфлікті"
 UNITS_VIEW_BTN_DRAW_BLITZ_FRONT_LINE_FIRST:0 "§RСпершу Вам треба створити лінію фронту.§!"
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP:0 "§HЛінія фронту§!\n - §GКлацніть§! по одному з кордонів з іншою країною, щоби створити фронт уздовж усього кордону.\n - §GShift + клацніть§! по одному з кордонів з іншою країною, щоби створити фронт без коротших окремих армійських фронтів уздовж усього кордону.\n - §GКлацніть ПКМ та переміщуйте мишу§! по одному з кордонів з іншою країною, щоби створити коротший фронт.\n - §GКлацніть ПКМ та переміщуйте мишу§! по одному з кордонів з іншою країною, щоби створити коротший фронт без коротших окремих армійських фронтів.\n - §GКлацніть ПКМ§! по існуючих кінцях лінії фронту та §Gпереміщуйте мишу§!, щоби змінити їх.\n\nЛінії фронту — це стартові точки для атак по ворожій території в напрямі ліній наступу, але вони також дозволяють Вам швидко розмістити дивізії по іноземному кордоні."
 UNITS_VIEW_BTN_UNITS_UNASSIGN:0 "§HВідкріпити дивізії§!\nНатисніть по цій кнопці, щоби відкріпити вибрані наразі дивізії від своїх наказів."
