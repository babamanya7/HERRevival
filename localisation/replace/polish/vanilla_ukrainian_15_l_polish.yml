 NORDIC_will_autocomplete_once_valid:0 "§YБуде автоматично виконано, коли буде виконано умови або крізь певні фокуси§!"
 NOR_abandoning_nynorsk_desc:0 "Незважаючи на свою націоналістичну мету, нюношк — це лише змішана мова, що складається з багатьох залишків сільських глухих і міських діалектів. Нам було б краще зосередитися на мові, якою більшість [NOR.GetAdjective]а громадськість уже пише та читає. Його носіям просто доведеться адаптуватися до нашого порядку."
 NOR_artillery_equipment_3:0 "BL 5.5-inch Medium Gun"
 NOR_axel_aubert:0 "Аксел Обер"
 NOR_claims_on_denmark_desc_fasc:0 "Колись монархи [DEN.GetNonIdeologyName] були нашими господарями, але ніколи більше. Зараз вони слабкі та незначні, тому ми можемо забрати землю. З нашою новою силою їхня армія розсиплеться, як пісочне тісто з маслом. руки дитини!"
 NOR_claims_on_faroe_islands:0 "Претензії на Фарерські острови"
 NOR_communism_party_long:0 "Норвезька комуністична партія"
 NOR_communist_agitator:0 "Комуніст-агітатор"
 NOR_communist_prep_join_light_damage:0 "§RОтримаєте незначну шкоду заводам та інфраструктурі§!"
 NOR_crumbling_fortifications_ns:0 "Зруйновані укріплення"
 NOR_defensive_rearmament_ns:0 "Оборонне переозброєння"
 NOR_destroyer_4:0 "Клас «Stord»"
 NOR_elevate_hirden_desc:0 "Гірден добре послужив нам як парамілітарна гілка Nasjonal Samling, але оскільки ми опинились перед фашистським режимом, що розвивається, нам слід розглянути питання про зміцнення його позицій у структурі влади [NOR.GetAdjective]ого уряду."
 NOR_empower_sivorg_desc:0 "Тепер, коли Kretsen і Координаційний комітет об'єднали наші зусилля, настав час змусити їх працювати разом під однією парасолькою. Sivorg буде організацією, яка охоплюватиме цивільних осіб усіх видів, щоб організувати цивільний опір у [NOR.GetName]."
 NOR_exile_decisions_unlock_TT:0 "§GРішення щодо кращого продовження боротьби з-за кордону буде відімкнено у вигнанні.§!"
 NOR_fighter_equipment_0:0 "F.F. 7 Hauk"
 NOR_hjalmar_riiser_larsen:0 "Ялмар Ріісер-Ларсен"
 NOR_invasion_focus_TT:0 "§YБуде автоматично заповнено, коли нападе фашистська країна.§!"
 NOR_jonas_lie_coup_desc:0 "Здається, бездарність Квіслінга не має меж. Він завдавав шкоди нашому режиму ще до того, як він почався, і він є слабкою ланкою в нашому командуванні. З іншого боку, ми маємо Юнаса Лі, який із самого початку був рішучий прихильник окупації [GetNorwegianFascistOverlord] [ROOT.GetName] і непримиренний агент порядку, коли це необхідно. Він має бути тим, хто веде свій народ у досягненні цілей нашого союзника."
 NOR_kystvakten:0 "Берегова охорона"
 NOR_medium_tank_equipment_1_short:0 "Pansv. m/39"
 NOR_monarchist_preparation_decisions_category_desc:0 "Оскільки ще до свого сходження на трон наш скромний король Гокон VII передав свої повноваження Стортингу та його складовим. Це було добре і добре в той час, але ми повинні показати йому, що ми підтримуємо його захоплення прямого контролю над [ROOT.GetName], перш ніж контролювати нічого.\n\n\nПовна підтримка монархії: [?NOR.NOR_country_preparedness]/30"
 NOR_norwegian_engineering_desc:0 "Якщо ми хочемо досягти справжньої Перманентної революції, нам потрібно відмовитися від знарядь війни, створених з експлуатованими братами та сестрами. Нам потрібно розробити власні проєкти та виготовити власне обладнання, якщо ми хочемо назвати цю революцію справді нашою."
 NOR_ole_reistad:0 "Оле Рейстад"
 NOR_pilot_training_desc:0 "Незважаючи на те, що наші початкові військово-повітряні сили невеликі та недостатньо розвинені, ми можемо взяти участь у наших традиціях авіаторів і дослідників, щоб надихнути нове покоління пілотів [NOR.GetAdjective], які забезпечать нам нашу подальшу незалежність."
 NOR_prepare_a_mobile_government_desc:0 "Тепер, коли почалася війна, наш уряд має ціль на спині. Ворог піде на все, щоб знищити наших лідерів і підпорядкувати собі людей [NOR.GetName]. Важливо, щоб ми були готові рухатися найважливіші функції уряду уникати небезпеки."
 NOR_prepare_historical_unlock_TT:0 "Будуть відкриті рішення §YРозвивати область§!, які дозволяють прискорити §Gбудівництво фабрик§!, але накладає штрафи на §Rвійськове будівництво та оборону§!."
 NOR_prepare_state_communist_desc:0 "Людей області [FROM.GetName] надто довго експлуатували уві сні. Посіймо збудливе насіння нашої революції."
 NOR_ship_medium_battery_1:0 "20.9 cm/44 EOC 1899"
 NOR_support_rebellion_desc:0 "Наші зусилля опору в області [FROM.GetName] окупилися. Люди там готові вжити заходів проти своїх гнобителів. Нехай вони починають бій, і як тільки вони це зроблять, ми будемо готові повернутися додому і боротися."
 NOR_weapons_for_the_resistance:0 "Здобувати та розповсюджувати зброю"
 NOR_worker_armies_desc:0 "Потрібно виконати багато роботи, а населення недостатньо, щоб зробити все відразу. Встановивши ієрархію працівників, наче це військові компанії та підрозділи, ми можемо почати повертатися на ноги один проєкт за раз."
 NOTIFICATION_REWARD_UNLOCKED:0 "Нагорода майстерності відімкнена"
 NOT_ALLOWED_TO_CHANGE_COUNTRY:0 "§RВи ще не можете змінити країну.§!"
 NO_CURRENT_XP_GAIN_OC:0 "Наш офіцерський корпус наразі не генерує жоден досвід."
