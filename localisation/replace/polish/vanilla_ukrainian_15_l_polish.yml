 FIN_anti_soviet_sentiment_desc:0 "Жителі цієї держави відчувають глибоку неприязнь до держави [SOU.GetNameDef], вбачаючи в ній не що інше, як ребрендинг Російської імперії або загрозу своїм традиційним цінностям."
 FIN_approach_the_soviets_desc:0 "Наші товариші в [SOU.GetNameDef] знаходяться в авангарді пролетарської боротьби проти буржуазного імперіалізму. Ми повинні зв'язатися з їхнім керівництвом і спробувати отримати підтримку для нашої боротьби проти буржуазії в [FIN.GetNameDef]."
