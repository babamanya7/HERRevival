 ITA_peace_preservation_ns_tt:0 "\nОтримає національний дух §Y$ITA_peace_keepers_of_europe$§!, що дасть §g(§!$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-2.00%§! за кожну гарантовану державу (щонайбільше §Y-10.00%§!), Підтримка війни: §G+1.00%§! за кожну гарантовану державу (щонайбільше §Y+10.00%§!), $MODIFIER_WEEKLY_MANPOWER$: §G+100§! за кожну гарантовану державу (щонайбільше §Y+1000§!)§g)§!."
 ITA_polizia_dell_africa_italiana_desc:0 "Наша колоніальна поліція досі показувала себе дієвою силою. З деякими подальшими реформами вона зможе забезпечувати, що ми отримаємо від наших колоній стільки ж, скільки вкладемо."
 ITA_prepare_for_the_coming_wars:0 "Підготуватися до майбутніх воєн"
 ITA_prioritizing_the_military_desc:0 "Відволікаючи кошти та ресурси з інших місць, ми зможемо зосередитися на наших збройних силах. Хоча певні райони постраждають від цього протягом короткого часу, ми можемо виграти більше в довгостроковій перспективі."
 ITA_secret_weapons:0 "$secret_weapons$"
 ITA_ship_armor_bb_1:0 "250-мм пояс/30-мм палуба"
 ITA_ship_armor_cruiser_2:0 "100-мм пояс/50-мм палуба"
 ITA_slovenia_dalmatia_claims_threat:0 "Італійські претензії на Югославію"
 ITA_socialist_republic_communism_DEF:0 "Соціалістична італійська республіка"
 ITA_strengthened_the_army_desc:0 "Розширення армії навчило нас дуже багато речей щодо мобілізації військ і організації їх у злагоджену бойову силу."
 ITA_superesercito:0 "Superesercito"
 ITA_tac_bomber_equipment_2:0 "Cant Z.1007bis Alcione"
 ITA_the_fourth_shore:0 "Четверте узбережжя"
 ITA_the_southern_farmlands_desc:0 "Незважаючи на марні зусилля фашистського режиму, Італія залишається практично сільською країною. Ми мусимо покладатися на селянство, щоб успішно здійснити нашу революцію, і, безумовно, саме на півдні Італії селяни є найбільш потужними."
 ITA_to_live_as_a_lion_desc:0 "Італійський народ не був створений бути вівцями. Він не призначений для того, щоб сидіти тихо та змагатися в другому ряді історії. Він був створений узяти власну долю у свої руки! Беніто Муссоліні — людина, яка змусить їх це зробити та нагадає їм, що ліпше прожити один день левом, аніж сто років вівцею."
 ITA_vallo_alpino_del_littorio_dec_cat_desc:0 "$ITA_vallo_alpino_del_littorio_desc$"
 ITA_vallo_alpino_del_littorio_desc:0 "Наші сухопутні кордони майже повністю вкриті Альпами. Хоча ці гори самі по собі є грізною перешкодою, під час останньої війни ми дізналися, що вони не зовсім непрохідні. Будівництво низки укріплень допоможе нам утримати лінію проти будь-якого ворожого вторгнення з суші."
 JAP_STATE_525:0 "Кейкі"
 JAP_a_pan_asian_diet:0 "Паназійський сейм"
 JAP_ally_the_philippines_desc:0 "Нещодавно відновивши зв'язки з їхніми колишніми сюзеренами, можливо, настав час зробити пропозицію [PHI.GetAdjective]ому уряду, запросивши їх приєднатися до нашого альянсу. Як ми бачимо, ми обидва отримаємо велику вигоду від цієї угоди."
 JAP_army_securing_navy_support_mission:0 "Армія забезпечує підтримку флоту"
 JAP_artillery_equipment_1:0 "Type 95 75 mm"
 JAP_balanced_naval_approach:0 "Збалансований морський підхід"
 JAP_children_of_the_sun:0 "Діти Сонця"
 JAP_create_a_manchurian_imperial_air_force:0 "Створити Маньчжурські імперські ВПС"
 JAP_democratic_research_slot_desc:0 "Токійський імператорський університет досі працює за принципами нашої старої системи освіти. Щоб отримати нове покоління інтелектуальних талантів, які зможуть допомогти нашій країні досягти кращого майбутнього, ми повинні інвестувати в нього і змінити навчальну програму, щоб вона була менше контрольована національною політикою."
 JAP_develop_sufu_materials_decision:0 "Розробити матеріали «суфу»"
 JAP_educate_the_peasants_desc:0 "Освітою селян континенту нехтували занадто довго. Настав час почати координувати зусилля між членами альянсу, щоб ми могли підвищити рівень знань серед робочої сили."
 JAP_embodying_empress_jinguu_desc:0 "Так само як чоловіка імператриці Нагако було вбито, так само було вбито чоловіка імператриці Джінгу. Вона розпочала кампанію помсти, а потім звернула свою увагу на землю обітовану. Через три роки вона перемогла своїх ворогів і повернулася з тріумфом. Ми повинні продовжити цю легенду і довести її до кінця."
 JAP_establish_guerilla_units_in_state_decision_tt:0 "Ми отримаємо §G2§! §Yополчення§! у цьому регіоні після початку §YГромадянської війни§!"
 JAP_expand_navy_technical_department_desc:0 "Ми повинні видати нові розрахунки щодо розміру збільшення нашого флоту і, відповідно, верфей, які будуть потрібні для забезпечення цього збільшення. Першим кроком до приведення наших об'єктів у відповідність до сучасних вимог буде розширення Технічного департаменту флоту."
 JAP_fascism_party_kodoha_long:0 "Фракція імперського шляху"
 JAP_form_greater_east_asian_currency_union:0 "Створити Великий східноазійський валютний союз"
 JAP_form_the_dai_nippon_fujinkai_desc:0 "Ямаучі Сачіко зголосилася створити Жіночу асоціацію Великої Японії — запропоноване об'єднання трьох інших націоналістичних жіночих асоціацій, з метою мобілізації жінок на військові роботи, зміцнення бойового духу армії, підтримки скромного способу життя задля збереження ресурсів нації, підвищення рівня виробництва та підтримки військових."
 JAP_fushimi_hiroyasu:0 "Принц Хіроясу Фушімі"
 JAP_generic_mio_trait_hardened_critical_components:0 "Глибокий поділ машинних відділень"
 JAP_government_faction_tier_2:0 "$JAP_imperial_influence_tier_2$ $JAP_government_faction$"
 JAP_greater_tohokai_rule_fascism_DEF:0 "Велика Японська імперія"
 JAP_guide_the_chinese_desc:0 "Революція в Китаї досі не досягла успіху. Ми повинні втрутитися і особисто направити китайський народ до процвітання та звільнити його від феодального і застарілого способу життя."
 JAP_guide_the_lesser_states:0 "Скерувати малі держави"
 JAP_gw_tank_equipment:0 "Ko-Gata Sensha"
 JAP_has_recently_tried_to_block_usa_support_for_china_flag:0 "Японія нещодавно використала Японський комітет з торгівлі та інформації, щоб відвернути Сполучені Штати від підтримки Китаю"
 JAP_heavy_cruiser_1:0 "Клас «Furutaka»"
 JAP_heavy_cruiser_3_desc:0 "Важкі крейсери класу «Tone» спочатку проєктувалися як легкі крейсери, але були модернізовані з більш важким озброєнням. Вони були унікальні тим, що все озброєння було розташоване в носовій частині, а кормова частина корабля використовувалася для перевезення і обслуговування плавучих літаків, які вели розвідку сил противника."
 JAP_hideo_itokawa:0 "Хідео Ітокава"
 JAP_imperial_influence_communist_dm_desc:0 "Різні фракції в країні змагаються за владу і вплив на [GetImperialInfluenceRulerTitle], продовжуючи традицію олігархів і військових клік, заснованих в епохи Мейджі і Тайшьо."
 JAP_imperial_influence_title_text_communist:0 "НАЦІОНАЛЬНИЙ ВПЛИВ"
 JAP_industrial_investment_descision_tt:0 "§G10§! одиниць обраних ресурсів буде надано §Y[ROOT.GetNameWithFlag]§!, натомість §Y1§! цивільну фабрику буде демонтовано та передано §Y[FROM.OWNER.GetNameWithFlag]§!"
 JAP_issue_the_shinmin_no_michi_manifesto_desc:0 "Наших людей треба навчити шляху підданих. Це буде зроблено через ідеологічний маніфест, спрямований до народу, щоб чітко пояснити, чого від них очікують «як від народу і нації». Видання такого маніфесту буде обов'язком Міністерства освіти."
 JAP_japanese_settlement_desc:0 "Переселення нашого власного народу до Маньчжурії забезпечить нас додатковою робочою силою, дозволивши нам побудувати більше фабрик та заводів у відповідних місцях."
 JAP_kokura_arsenal_organization:0 "$kokura_arsenal$"
 JAP_kwantung_army_decisions_desc:0 "Наші сили, що діють у Маньчжурії та Китаї, Канто-гун, наразі діють вкрай автономно і відомі тим, що вживають заходів без схвалення вищого керівництва. Спочатку створені як сили безпеки для орендованої території Квантун, вони тепер значно перевищили свій початковий розмір і можуть втягнути нас у масштабний конфлікт, якщо ми не візьмемо ситуацію під жорсткий контроль."
 JAP_launch_an_offensive_in_chinese_state_decision:0 "Почати наступ у [FROM.GetName]"
 JAP_light_cruiser_4:0 "Клас «Agatsuma»"
 JAP_manchuria_five_year_plan_desc:0 "Хоча наші острови бідні на придатну землю, наші володіння на материку — ні. Те, що ми не можемо побудувати у себе, ми можемо натомість побудувати на материку. Ми розпочнемо масштабну програму індустріалізації для [MAN.GetNameDef]."
 JAP_medium_tank_artillery_equipment_2:0 "Type 4 Ho-Ro"
 JAP_naval_faction_tier_1_lesser_1:0 "$JAP_imperial_influence_tier_1$ $JAP_naval_faction$"
 JAP_non_aggression_pact_with_the_soviet_union_desc:0 "Щоби ми могли вільно діяти на південному напрямку, наш північний кордон має бути у безпеці. Ми і [SOV.GetNameDef] повинні укласти пакт про ненапад якнайшвидше."
 JAP_nuke_1:0 "Зроблено перший ядерний удар по Японії"
 JAP_one_people_united_under_shinto_decision:0 "Один народ, об'єднаний під шінтоїзмом"
 JAP_operation_take_australia_desc:0 "Нарешті настав час. Верховне командування санкціонувало операцію з висадки в Австралії під кодовою назвою «Операція АН». Ми розгромимо наших ворогів і візьмемо під контроль підчерев'я Азії!"
 JAP_organizing_tonarigumi_in_progress:0 " Триває організація Тонарігумі."
 JAP_osaka_army_arsenal_organization:0 "$osaka_army_arsenal$"
 JAP_pivot_towards_defensive_measures_desc:0 "Війна розвивається не обов'язково на нашу користь. Стає все більш імовірним, що наші вороги висадяться на рідних островах — те, чому ми наразі погано підготовлені протистояти. Ми повинні взятися за вирішення цієї проблеми, щоб не зазнати століття приниження, створеного нашими ж руками!"
 JAP_popular_front_incident_tt:0 "Різні комуністичні політики та агітатори будуть заарештовані"
 JAP_promote_meritocracy_desc:0 "Країна не буде функціонувати ефективно, якщо ми не просуватимемо тих, хто добре працює, на відповідні посади. Людина, яка знається на електроніці, повинна очолювати електронну промисловість, а не якийсь політик зі зв'язками в кабінеті міністрів. Настав час викорінити традиції Амакударі та прийняти меритократію на благо нації!"
 JAP_radical_nichiren_preacher:0 "Радикальний проповідник нічірен"
 JAP_radio_guided_missiles:0 "Ракети з тепловим наведенням"
 JAP_reclaim_lost_territories:0 "Повернути втрачені території"
 JAP_reclaim_lost_territories_desc:0 "Настав час повернутися до регіонів, які відкололися від нашої сфери, і повернути їх до нашої республіки. Тільки шляхом військового втручання ми можемо гарантувати, що люди в цих регіонах зможуть процвітати."
 JAP_reform_the_education_system:0 "Реформувати систему освіти"
 JAP_revere_the_emperor_destroy_the_traitors:0 "Шануй Імператора, знищуй зрадників"
 JAP_revoke_the_peace_preservation_law:0 "Скасувати Закон про збереження миру"
 JAP_rikken_minseito_victory_desc:0 "Результати виборів вирішено. Ліберально-прогресивна партія Ріккен Мінсейто здобула переконливу перемогу і, схоже, матиме чітку більшість надалі. Схоже, народ вирішив, у якому напрямку він хоче бачити рух країни."
 JAP_seek_strength_in_numbers_tt:0 "Розблоковує рису MIO §Y$JAP_mio_trait_strength_in_numbers$§! для всіх §Yморських конструкторів§!. §RОднак її можна застосувати лише до одного з них§!."
 JAP_showa_restoration_democratic:0 "Японська держава"
 JAP_showa_restoration_neutrality:0 "Японська імперія"
 JAP_spread_revolutionary_flames_to_south_asia_2_tt:0 "Розблоковує рішення для §Yрозпалювання комуністичних настроїв§! всередині §Yпівденноазійських§! націй"
 JAP_strike_down_the_enemy_of_the_people:0 "Уразити ворога народу"
 JAP_sway_the_navy_moderates_desc:0 "У флоті є багато високопосадовців, які є набагато розсудливішими, ніж ті, що в армії. Якщо ми звернемося до колишніх членів фракції договору, ми, можливо, зможемо отримати їхнє схвалення, а може, навіть підтримку у випадку громадянської війни."
 JAP_the_courage_to_defend_the_revolution:0 "Мужність захищати революцію"
 JAP_the_first_five_year_plan:0 "Перший п'ятирічний план"
 JAP_the_flying_geese:0 "Летючі гуси"
 JAP_the_korean_question_desc:0 "Ми вже якийсь час контролюємо Корейський півострів, і питання самовизначення Кореї стає все більш гострим. Як ми можемо стверджувати про прихильність до демократії, якщо не даємо нашим сусідам права на самоврядування?"
 JAP_the_long_march_to_victory_desc:0 "Щоб зламати китайські уряди, нам потрібно пройти глибоко в континентальну Азію. Ми повинні провести пропагандистські кампанії з посиланням на великий похід, сподіваючись, що це збільшить готовність наших солдатів продовжувати марш стільки, скільки буде потрібно!"
 JAP_tokko_chief:0 "Начальник Токко"
 JAP_tokugawa_iesato_focus:0 "Прем'єрство Токугави Ієсато"
 JAP_unlock_the_surrender_subbranch_tt:0 "Розблокує фокуси §Y$JAP_the_koiso_cabinet$§!, §Y$JAP_the_war_has_not_necessarily_developed_focus$§!, §Y$JAP_japans_longest_day$§! та §Y$JAP_the_surrender_broadcast$§!, які дозволяють прибрати національний дух §Y$JAP_crumbling_military_cabinet_idea$§! та потенційно вийти зі Східноазійської війни"
 JAP_utilize_our_polish_friendship:0 "Використати нашу дружбу з поляками"
 JAP_war_communism_desc:0 "Ми повинні прийняти версію економічної та політичної системи, що існувала в Радянській Росії під час Громадянської війни 1918–1921 років, яку вони називали воєнним комунізмом. Це дозволить нам зберегти контроль і приймати рішення, необхідні для поширення революції на решту Азії силою зброї."
 JAP_yasuhiko_asaka:0 "Принц Ясухіко Асака"
 JAP_yoshijiro_umezu:0 "Йошіджіро Умедзу"
 JAP_zengo_yoshida:0 "Дзенго Йошіда"
 JUNO_brazil_events.10.desc:0 "Незважаючи на велику роботу з планування, вкладену в нещодавній мітинг у [FROM.FROM.GetName], подія була досить млявою. Очікувані натовпи прихильників не зібралися, а ті, що прибули, були строкатим набором людей, які мало або зовсім не розуміли партійної платформи. Багато спостерігачів, здавалося, просто збентежені присутністю наших уніформованих членів, які марширували їхніми вулицями."
 JUNO_brazil_events.11.t:0 "Мітинг інтегралістів у [FROM.FROM.GetName]"
 JUNO_brazil_events.138.desc:0 "Відповідь на наші вимоги до [FROM.GetNameDef] звільнити їхній [BRA_country_to_be_liberated.GetNameDef] щойно надійшла до нас. Можливо, дещо несподівано, вони погодилися, що найкращий спосіб — дозволити їм піти та звільнити їх як незалежну націю."
 JUNO_brazil_events.141.a:0 "Чудова новина!"
 JUNO_brazil_events.15.b:0 "Їхні гарантії нічого не варті."
 JUNO_brazil_events.15.t:0 "Угоди [ROOT.Capital.GetCapitalVictoryPointName]"
 JUNO_brazil_events.161.b:0 "Стимулювати виробництво літаків."
 JUNO_brazil_events.162.a:0 "Ми будемо шукати корпоративних партнерств в іншому місці."
 JUNO_brazil_events.170.b:0 "Ми ніколи не погодимося на таку домовленість!"
 JUNO_brazil_events.170.t:0 "[FROM.GetNameDefCap] пропонує об'єднання"
 JUNO_brazil_events.190.a:0 "Ми приймемо нашу імперську спадщину!"
 JUNO_brazil_events.20.t:0 "Конференція на річці Потенжі"
 JUNO_brazil_events.33.t:0 "[FROM.GetName] погоджується передати територію"
 JUNO_brazil_events.39.desc:0 "Поки що немає жодних ознак того, що [ARG.GetAdjective]s готуються завдати удару через наші кордони. У кращому випадку, вони, здається, нарощують власну оборону, що ускладнює будь-які дії з нашого боку. У певний момент нам доведеться або вдарити першими, або відступити."
 JUNO_brazil_events.45.b:0 "Ми не відмовимося від нашого суверенітету."
 JUNO_brazil_events.62.b:0 "Співдружність з нашим старим колонізатором? Абсолютно ні."
 JUNO_brazil_events.64.desc:0 "Наша контрпропозиція створити співдружність, замість того, щоб безпосередньо приєднатися до [BRA.GetNameDef], була добре сприйнята [BRA.GetAdjective] керівництвом. Вони відмовилися від ідеї об'єднання та погоджуються, що співдружність буде чудовою для нас обох."
 JUNO_brazil_events.80.a:0 "Ми погоджуємося на їхню пропозицію."
 JUNO_brazil_events.80.desc:0 "[FROM.GetNameDefCap] запропонувала угоду про взаємні гарантії захисту. Вони стверджують, що мир у Південній Америці став крихким і що єдиний спосіб зберегти його — це зміцнення зв'язків між нашими націями. Якщо ми погодимося на цю пропозицію, вони очікуватимуть, що ми прийдемо їм на допомогу у разі нападу на них."
 JUNO_brazil_events.87.desc:0 "Як ми й сподівалися, [SOV.GetAdjective] керівництво запропонувало нам підтримку в ці важкі часи. Звичайно, ми не можемо покладатися на них у повному вирішенні всіх наших проблем, але їхня підтримка знову є дуже бажаною допомогою."
