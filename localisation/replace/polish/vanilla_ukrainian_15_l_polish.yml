 CHI_administer_cooperatives_desc:0 "Природа кооперативів означає, що вони швидко ростуть і поширюються, але часто працюють ізольовано. Національне управління координуватиме та підтримуватиме кооперативні мережі по всьому [ROOT.GetName]."
