 idea_SIA_unified_khana_ratsadon:0 "Єдина Народна партія"
 idea_group_nuclear_desc:0 "Ідеї та люди, які пожвавлюють розвиток ядерних технологій."
 idea_weapons_for_the_resistance_desc:0 "Наші союзники відправляють боєприпаси відважним борцям за свободу, що борються з ненависним ворогом на нашій Батьківщині."
 ideological_crusader:0 "Ідеологічний борець"
 ideological_fanaticism:0 "Ідеологічний фанатизм"
 il_duce_providence_strengthen:0 "$il_duce$"
 improve_alpine_line_desc:0 "Так званої «малої лінії Мажіно», що захищає наш південний кордон з Італією, наше військове командування завжди приділяло другорядну увагу. Але останнім часом фашистська Італія веде себе все більш агресивно, а ми знаємо, що вона має територію. Франції. Зміцнення Альпійської лінії повинні відповідати стандартам лінії Мажіно."
