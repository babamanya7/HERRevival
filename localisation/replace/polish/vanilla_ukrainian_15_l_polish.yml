 iceland_events.11.desc:0 "Незважаючи на всі наші зусилля, [FROM.GetName] відмовляється приймати той факт, що [ROOT.GetName] більше не бажає підкорятися наказам, які видає [FROM.Capital.GetCapitalVictoryPointName]. Ба більше, вони навіть погрожували нам застосувати силу. Втім, тепер, коли [ROOT.GetName] будує свою оборону, навряд чи ця погроза до чогось призведе."
 iceland_events.12.desc:0 "[FROM.GetLeader] просить компенсацію за [FROM.GetAdjective]у допомогу державі [ROOT.GetName] всі ці роки та особливо у нещодавні важкі часи. Як стверджує [FROM.GetLeader], це допоможе державі [FROM.GetNameDef] зростати і підтримувати здатність допомагати державі [ROOT.GetName] в майбутньому, а також захищати ці острови."
 idea_CHI_troop_inspection:0 "Інспекції військ"
 idea_RAJ_debt_relief:0 "Полегшення боргового тягаря"
 idea_SIA_a_modern_economy:0 "Сучасна економіка"
 idea_SIA_bloodlusted_irredentism_desc:0 "Територіальні амбіції переросли в щось жорстокіше. Армія б'ється з переконанням тих, хто вірить, що повертає те, що належить їм по праву."
 idea_SIA_cemented_control_3:0 "Закон про обов'язок тайців під час війни"
 idea_SIA_civilian_wing_unrest_desc:0 "Фракція Пріді знову втратила віру в уряд. Позбавлене другого шансу на владу, цивільне крило вдається до страйків, бюрократичного саботажу та заворушень у містах. Економіка зупиняється, а країна стає некерованою, поки пристрасті не вщухнуть."
