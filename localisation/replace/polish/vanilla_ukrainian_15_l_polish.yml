 DEN_bop_ban_oppositions_uniforms_desc:0 "Ми не можемо дозволити нашим політичним опонентам маршувати у своїй формі та хизуватися. Це лише поширює незадоволення та розбрат. Ми повинні заборонити будь-яку політичну форму — окрім тих, хто перебуває при владі, звичайно."
 DEN_bop_landstorm:0 "£BoP_right_texticon Відновити Landstorm"
 DEN_bop_speak_out_against_welfare:0 "£BoP_right_texticon Виступити проти системи соціального забезпечення"
 DEN_coastal_forts_in_norrejylland:0 "Збудувати прибережні форти в $STATE_99$"
 DEN_develop_iceland_desc:0 "Розташування Ісландії в Північній Атлантиці робить її головним кандидатом для запуску морських експедицій із метою контролювати відкрите море. Спрямовуючи ресурси і гроші в регіон, ми могли б тісніше інтегрувати його в ширший простір і краще використовувати його стратегічне положення"
 DEN_develop_state_gotland:0 "Розвинути область $STATE_124$"
 DEN_development_projects_state_modifier_desc:0 "Промисловий сектор потребує розширення та розробки більш економічно ефективних процесів і продуктів. Ми інвестували ресурси сюди, щоб дати можливість галузям процвітати та сприяти зростанню економіки регіону."
 DEN_economic_mobilization_strategy_desc:0 "Ми повинні підготувати економіку і маси до майбутньої війни. Нам потрібно буде впровадити нову економічну стратегію, щоб забезпечити максимально ефективну роботу промисловості, одночасно переконуючи данський народ виконати свій обов'язок перед королем і країною."
 DEN_erik_with:0 "Ерік Віт"
 DEN_establish_danske_flotille_desc:0 "Заснувавши флотилію у вигнанні, ми зможемо навчати людей і проводити військово-морські навчання, які відточать їхні навички, щоб допомогти у визволенні наших земель. Наш флот зіткнеться з серйозним опором флоту [?DEN.DEN_overlord_nation.GetAdjective], і ми повинні взяти гору будь-якими способами."
 DEN_expand_kobenhavns_university:0 "Розширення Копенгагенського університету"
 DEN_expand_the_industries:0 "Розширити нашу промисловість"
 DEN_experimental_technology_desc:0 "Розвиваючи нашу військову машину, ми також повинні забезпечити, щоб наш сектор досліджень і розробок продовжував розвивати свої експерименти. Вкрай важливо, щоб ми забезпечили університети і лабораторії фінансуванням, необхідним їм для подальшого просування нашого розвитку."
 DEN_foreign_designs:0 "Іноземні дизайни"
 DEN_full_employment_desc:0 "Не шкодуючи коштів на інвестиції в промисловість та сільське господарство, ми зараз пожинаємо плоди. Ми залишили позаду роки економічної кризи та високого рівня безробіття. Нація працює на повну потужність, і навіть закінчуються люди, яких ми можемо найняти на роботу. Попереду нас чекає процвітання."
 DEN_hjemmevaernet:0 "Hjemmeværnet"
 DEN_industrial_investments:0 "Індустріальні інвестиції"
 DEN_limited_market_regulations_desc:0 "Промисловий сектор за ці роки набув важливого значення в економіці країни і навіть процвітає. Ми повинні стримувати і контролювати його настільки, щоб не зашкодити його зростанню, але достатньо, щоб він не став загрозою для безпеки нації."
 DEN_limited_social_mobilization:0 "Обмежена соціальна мобілізація"
 DEN_niels_bohr:0 "Нільс Бор"
 DEN_northern_technological_advancements_group_invite:0 "Запросити державу [FROM.GetNameDef] до §Y$DEN_northern_technological_advancements_group$§!"
 DEN_overthrow_the_government:0 "Повалення уряду"
 DEN_petition_for_independence_desc:0 "Ми відіграли свою роль і допомагали нашим [?DEN.DEN_overlord_nation.GetAdjective] господарям у всіх їхніх починаннях. Ми показали, що нам можна довіряти і на нас можна покластися, тому настав час подати прохання про незалежність, залишаючись при цьому вірним союзником [?DEN.DEN_overlord_nation.GetNameDef]."
 DEN_remove_the_home_guard:0 "Відкликати домашню гвардію в області [FROM.GetName]"
 DEN_securing_norway_ns_desc:0 "Норвежці були частиною нашого Царства сотні років. Час настав повернути Норвегію до складу [DEN.GetNameDefCap]. Наша армія ретельно готувалася до цього дня, щоб знищити будь-які ворожі норвезькі сили."
 DEN_seek_an_alliance:0 "Шукати альянс"
 DEN_sovaernet_dynamic_modifier_improved:0 "$DEN_sovaernet_dynamic_modifier$"
