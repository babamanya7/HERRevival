 NZL_national_broadcasting_service_desc:0 "Після втручання Поштового відділення у вибори 1935 року та його нагляду за державними службами мовлення, стає очевидним, що нам потрібно реформувати керівництво цієї організації. Ми також повинні інвестувати в оновлення її телерадіомовного обладнання."
 NZL_ratana_alliance_desc:0 "Альянс із рухом «Rātana» дозволить залучити до уряду новозеландських маорі і, можливо, залікує частину ран, нанесених ним британськими завойовниками."
 NZL_schofield_tank_desc:0 "Танк «Bob Semple» не відповідав нашим потребам, але, можливо, їх задовольнить танк із повноцінною гарматою. Його своєрідна колісно-гусенична система може підвести нас до створення нових моделей танків."
 NZL_strat_bomber_equipment_2:0 "Avro Lancaster"
 NotMainInvader190:0 "Сьогодні вранці ми отримали повідомлення від [PER.GetAdjective] уряду з пропозицією припинити воєнні дії. Хоча для нас немає негайної вигоди чи відшкодування, це принесе швидке завершення війни та дозволить нам зосередитися на наших більших цілях."
 OBSERVER_MODE_DESC:0 "Режим спостерігача дозволяє Вам спостерігати за грою з перспективи іншого користувача, але не взаємодіяти з нею."
