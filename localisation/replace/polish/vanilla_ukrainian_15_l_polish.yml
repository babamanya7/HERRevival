 germany.40.a:0 "Чехи будуть самі по собі."
 germany.75.d:0 "Незважаючи на сувору попередню риторику проти як народу, так і ідеологічного лідерства держави [Root.GetName], [From.GetLeader] і Німеччина звернулися до нас, пропонуючи взаємовигідний дослідницький договір. І хоч обмін знаннями й допоможе нам у розробці нових танкових дизайнів, у купі з обіцянками інших дослідницьких переваг у майбутньому, все ще є певні сумніви, враховуючи попередні твердження, що німці це роблять для самих себе. Чи варто приймати угоду попри ризик, що так ми тільки допоможемо амбіціям [From.GetLeader]?"
 germany.86.t:0 "Данциг або війна"
 germany.88.a:0 "Вони дуже добре знають альтернативу."
 germany.88.d:0 "Попри наші спроби вмовити Польщу мирно передати Данциг, в обмін навіть поклявшися зняти претензії на інші німецькі території, вони відповіли відмовою. Очікувано, світ не віддасть нам нічого з того, що ми не заберемо силою."
