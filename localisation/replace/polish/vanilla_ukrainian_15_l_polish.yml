 RAJ_league_against_gandhism:0 "Ліга проти Гандизму"
 RAJ_legacy_of_military_service_desc:0 "Є багато сіл навколо [GetRajName], де батьки служили у військових, тому їхні сини також відчувають тиск. Зрештою, це традиція, і ми можемо використовувати це для залучення більшої кількості новобранців, ніж зазвичай."
 RAJ_light_tank_artillery_equipment_1:0 "Birch"
 RAJ_litteracy_effort_desc:0 "Неосвічене населення — це як відкритий, незахищений розум. Вміння читати — це ключова навичка, необхідна кожній людині, зрештою, хто програє від поінформованої отари, якщо не пастух?"
 RAJ_local_leaders_investments_defenses_tt:0 "Розвиток територіальної оборони: \nПобудувати до §G2§! §YАвіабаз§!, §G1§! §YПротиповітряної оборони§! та §Y1§! §YРадиолокаційної станції§! в державі."
