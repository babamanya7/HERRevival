 CHI_zhou_fohai:0 "Zhou Fohai"
 CHL_aid_araucania:0 "Допомога для Королівства Арауканія та Патагонія"
 CHL_align_with_the_russian_soviet:0 "Зблизитися з державою [SOU.GetNameDef]"
 CHL_araucania_establish_inca_kingdom:0 "Заснувати інкське королівство-сателіт"
 CHL_chilean_anti_communist_action:0 "Acción Chilena Anticomunista"
 CHL_cooperate_with_operation_bolivar:0 "Співпрацювати в операції «Болівар»"
 CHL_dispute_over_tierra_del_fuego:0 "Суперечка за Вогняну Землю"
 CHL_domestic_production_of_the_willys_mb:0 "Вітчизняне виробництво Willys MB"
 CHL_electing_a_toqui_desc:0 "Відповідно до традиції мапуче, токі обирається лідером під час війни зборами лонко, які очолюють різні реуе та айлареуе. Ці токі відігравали найвищу роль у суспільстві мапуче і керували воїнами та лонко під час війни, і настав час обрати нового токі — того, хто зможе очолити нашу священну війну проти імперіалізму!"
 CHL_enact_stricter_labor_laws:0 "Принйяти суворіші трудові закони"
 CHL_gabriel_gonzales_videla:0 "Габріель Гонсалес Відела"
 CHL_has_left_wing_government:0 "Має лівий уряд"
 CHL_hub_of_the_world_revolution_tt:0 "Комуністичні радники з інших країн перейдуть до держави [CHL.GetName], в залежності від політичної ситуації на батьківщині. Нараз до держави [CHL.GetName] перейдуть оці радники:"
 CHL_invited_french_academia_desc:0 "Важливою частиною перебування у франкомовній сфері є однакове мислення, і для цього ми заохочуватимемо французьку академічну спільноту перейти до держави [CHL.GetNameDef]."
 CHL_jaime_quintana:0 "Хайме Альфонсо Кінтана"
 CHL_land_reforms_desc:0 "Система асьєнд і інкілінахе сильно застаріла та спричиняє великий поділ між соціальними класами в нашому суспільстві. Ми мусимо прагнути перерозподілу землі власників асьєнд і покінчити з цією жорстокою системою кріпацтва раз і назавжди!"
 CHL_liberate_the_caribbean:0 "Визволити Кариби"
 CHL_ligas_patrioticas:0 "Ligas Patrióticas"
 CHL_national_falange:0 "Національна фаланга"
 CHL_news_events.2.a:0 "Звичайно, надумано..."
 CHL_news_events.2.d:0 "[CHL.GetLeader] оголосив про відновлення старого Королівства Чилі, ірредентистської ідеї чилійців, які претендують на великі частини Аргентини з часів старого Іспанського віце-королівства Перу, і [CHL.GetNameDef] розпочало інтеграцію заявлених територій. Проте їхні амбіції не зупиняються на цьому, оскільки вони претендують на більшу частину регіону Ріо-де-ла-Плата."
 CHL_news_events.7.desc:0 "[CHL.GetLeader] з [CHL.GetNameDef] оголосив, що країна запровадить політику проактивного захисту суверенітету [CHL.GetAdjective] та [RAP.GetAdjective] шляхом офіційного оголошення війни націям, які вона вважає потенційними загрозами на Тихоокеанському театрі, обираючи перенести війну на своїх потенційних агресорів, а не вести її на власній території."
 CHL_peter_hansen:0 "Петер Адольф Цезар Гансен"
 CHL_political_events.1.a:0 "Ми не бачимо в цьому жодної шкоди"
 CHL_political_events.16.a:0 "Хуан Антоніо Ріос"
 CHL_political_events.32.a:0 "Ми дозволимо це"
 CHL_political_events.33.desc:0 "[GER.GetLeader] з [GER.GetNameDef] оголосив, що від сьогодні [CHL.GetNameDef] буде важливим союзником для них, який може допомогти у спробі отримати повний контроль над Америкою. Він заявив, що сьогодні — це день, який знаменує початок кінця для демократій Америки, і що сьогодні — славетний день."
 CHL_political_events.41.desc:0 "[CHL.GetLeader] та [GER.GetLeader] виступили зі спільною вимогою підкорення Уругваю. Здається, вони вимагають від нас стати протекторатом [GER.GetAdjective]. Чи піддамося ми їхньому тиску?"
 CHL_political_events.52.b:0 "Це наш шанс повернути Аріку!"
 CHL_political_events.53.desc:0 "Нинішній уряд у [FROM.GetNameDef] слабкий, і ми всі це знаємо. Було зрозуміло, що вони не можуть протистояти нам, і вони самі це усвідомили. Таким чином, станом на сьогодні, вони підписали новий договір, офіційно передавши департамент [947.GetName] нам!"
 CHL_political_events.61.a:0 "Це розумно"
