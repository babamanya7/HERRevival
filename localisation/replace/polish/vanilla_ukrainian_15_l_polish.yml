 ROM_preserve_greater_romania_desc:0 "Нарешті нам вдалося об'єднати всіх румуномовних у нашій країні. Тепер ми мусимо забезпечити, щоби наші діти могли успадкувати нашу спадщину Румунії для всіх румунів."
