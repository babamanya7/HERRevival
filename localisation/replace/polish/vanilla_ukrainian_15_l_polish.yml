 FRA_agricultural_protectionism_desc:0 "Світова економіка стає все більш ворожою до наших традиційних способів виробництва. Якщо ми не вживемо заходів для захисту наших фермерів, незабаром ми зіткнемося з кризою невимовних масштабів, оскільки наші фермери не зможуть залишатися конкурентоспроможними перед обличчям масового виробництва харчових продуктів, які надходять з-за кордону."
 FRA_air_focus:0 "Акцент на авіацію"
 FRA_anti_fascist_immigrants:0 "Антифашистські іммігранти"
 FRA_ban_sending_weapons:0 "Заборонити надсилання зброї"
 FRA_battle_cruiser_1_desc:0 "Проєкт лінійного крейсера Durand-Viel був пропозицією в серії досліджень часів Першої світової війни. По суті, це були лінійні крейсерські версії лінійних кораблів класів Normandie і Lyon, які мали ті ж чотирикутні башти та гармати, хоча й у зменшеній кількості. Як і сучасні лінійні крейсери інших флотів, вони були б швидшими, але менш броньованими, ніж лінійний корабель. Вони були скасовані перед початком Першої світової війни."
 FRA_battleship_4_desc:0 "Лінкори класу «Alsace» повинні були замінити кораблі «Richelieu». Було замовлено чотири кораблі, дослідження дизайну були завершені в 1939 році, дозволені в 1940 році, і, як очікується, будуть закладені в 1941 році, хоча падіння Франції завадило цьому статися. Він удосконалює конструкцію Richelieu з більш важкими та більшими основними гарматами, потужнішим зенітним озброєнням, товщими броньовими пластинами та більшими двигунами."
 FRA_carrier_1:0 "Клас «Béarn»"
 FRA_central_africa_intervention.2.desc:0 "Французькі війська в Центральній Африці чинили несподівано сильний опір. Кілька колон союзників потрапили в засідку і зазнали великих втрат. Місцевий командувач союзними військами явно недооцінив противника, тому, зіткнувшись з такою позиції і наказав закріпитися там і чекати наказів."
 FRA_central_africa_intervention.3.a:0 "Ми нічого не досягли."
 FRA_coup_in_west_africa_flag:0 "Підготувати переворот у Західній Африці"
 FRA_destroy_the_counter_revolution:0 "Знищити контрреволюцію"
 FRA_destroyer_1:0 "Клас «Bourrasque»"
