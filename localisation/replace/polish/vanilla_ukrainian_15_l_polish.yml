 tactic_attacker_sb_hold:0 "Утримання мосту"
 tactic_guerrilla_tactics:0 "Партизанська тактика"
 tactic_sf_barrage:0 "Повуличний обстріл"
 take_core_state:0 "Повернення осердної землі"
 tank_designer_heavy_tank_chassis:0 "Важкий танк"
 tank_reliability_upgrade:0 "Надійність"
 targeted_sabotage_burn_storage_desc:0 "Місцеве опір виявило сховище з горючими речовинами. Наші агенти під покровом ночі підпалять його і підуть, скориставшись метушні."
 tech_engineers_desc:0 "Інженери, що займаються зведенням укріплень і захисту від проривів, незамінні на полі бою. Оскільки вони універсальні, їх можна використовувати в різних ситуаціях."
 tech_maintenance_company4_desc:0 "Досвід створення техніки з навантаженим резервом, накопичений у Велику війну, можна застосувати, щоби спростити процедуру ремонту більш сучасної техніки."
 test_the_ussr_focus:0 "Зміцнити радянський кордон"
 tfv_australia.21.d:0 "[From.GetAdjective]а держава схилилася перед нашим ультиматумом і приймає їх новий статус як провінцію держави [Root.GetNameDef]. Хоча [From.GetAdjective]ий прем'єр-міністр [From.GetLeader] оплакує втрату [From.GetAdjective]ої «незалежності», цей момент знаменує початок нової ери для Океанії.\n\n[From.GetNameDef], як і ми, ми тепер покінчено бути болонками Імперії, яка не має в основі наших інтересів."
 tfv_canada.1.d:0 "Оскільки дипломатичні інтереси в Північній Америці збігаються, а Європа з кожним днем переживає дедалі більші потрясіння, держава [From.GetNameDef] запропонувала радикальний політичний крок.\nУклавши пакт про взаємну оборону, ми зможемо забезпечити безпеку та цілісність Америки, водночас значно розширивши наші політичні та військові можливості в будь-якій ситуації. [From.GetLeader] заявив, що це «очевидний вибір» для забезпечення процвітання як держави [Root.GetNameDef], так і держави [From.GetNameDef], і [Root.GetLeader], схоже, погоджується, що дуже важко заперечити."
 tfv_canada.12.d:0 "Побоюючися впливу, який це матиме на «глобальну стабільність», [From.GetLeader] публічно відхилив наш запит на членство в альянсі [From.GetFactionName].\nБачачи, що [From.GetNameDef] не знаходиться вище дрібного політиканства старого світу, наші революційні зусилля були б витрачені на них у всякому разі.\n\nНавіть якщо [Root.GetNameDef] стоїть наодинці у фашистському світі, ми не здамося, доки не принесемо справжній соціалізм кожному робітникові в усіх землях нашої планети!"
 tfv_canada.22.d:0 "Не здатні навіть поглянути за межі своїх мізерних кордонів, [From.GetLeader] і [From.GetLeader.GetHerHis] [From.GetName] відхилили нашу пропозицію про союз.\nЗвісно, з огляду на ймовірний розпад [From.GetAdjective]ої держави й усієї Європи під вагою власних народів, нам, можливо, було б краще обійтися без них."
 tfv_canada.51.d:0 "На [Root.GetAdjective]ій території сталася чергова атака, цього разу безпосередньо на один із наших військових заводів!\nВиробництво зупинено, оскільки починаються репарації, але винуватці все ще на волі.\n\nПринаймні, стало зрозуміло, що це робота групи, а не однієї людини."
 tfv_canada.60.d:0 "Давно висловлюючи бажання «репатріювати» колоніальні території Лабрадор і Ньюфаундленд до складу своєї країни, [From.GetNameDef] тепер перейшла до кроків із їхнього вимагання.\n[From.GetLeader] дав зрозуміти, що [From.GetNameDef] вважає їх [From.GetAdjective]ою територією, і що вони «зроблять ті кроки, які необхідні для досягнення цього»."
 tfv_canada.60.t:0 "[From.GetNameDefCap] вимагає Лабрадор і Ньюфаундленд"
 tfv_canada.71.t:0 "[FROM.GetNameDefCap] підписує Закон про Ньюфаундленд"
 tfv_new_zealand.1.t:0 "[From.GetNameDefCap] просить членство в Комінтерні"
 tfv_raj.42.a:0 "$tfv_raj.32.a$"
 tfv_south_africa.11.desc:0 "У державі [From.GetName] розгорілася жорстока боротьба. Оскільки вони борються за виживання свого способу життя, вони відчайдушно потребують будь-якої підтримки, яку ми можемо надати. Це також буде можливістю випробувати нашу нову зброю й отримати цінного союзника в Південній Африці."
 tfv_south_africa.16.desc.c:0 "До нас прибув корабель із держави [HOL.GetNameDef]. У своєму трюмі він перевозив тонни гвинтівок і кілька важких гармат для волонтерів із держави [HOL.GetNameDef], які дісталися до нас іншими шляхами."
 tfv_south_africa.3.d:0 "Посилаючися на відсутність прямої загрози своїм колоніям в Африці, держава [From.GetNameDef] чітко дала зрозуміти, що не має наміру передавати нам управління своїми володіннями."
 tfv_south_africa.30.b:0 "Кожна п'ядь [Root.GetAdjective]ої землі священна. Ми не поступимося!"
 tfv_south_africa.32.a:0 "Тоді ми мусимо застосувати силу."
 tfv_south_africa.40.a:0 "Ми будемо раді надати будь-яку допомогу, яку маємо."
 tfv_south_africa.50.c:0 "Навіщо брати участь у війні за півсвіту звідси?"
 tfv_south_africa.60.c:0 "Поточна ситуація не дозволяє це зробити."
 tfv_south_africa.61.b:0 "$tfv_south_africa.60.b$"
 tfv_south_africa.66.d:0 "Звільнившися з-під влади колоніальних гнобителів, [BOT.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [BOT.GetAdjective]ого уряду."
 tfv_south_africa.73.t:0 "Свобода для держави [ERI.GetName]"
 the_bloody_professor:0 "Кривавий професор"
 the_juannines_tt:0 "Граючи як [PHI.GetNonIdeologyName], контролюйте та майте осердними всі [SPR.GetAdjective]і очердні землі в Європі"
 tier_two_threshold_tt:0 "Підвищує поріг для перебування в §Y$tier_one_threshold$§! на: §Y$RIGHT|+=.0$§! §YЦивільних фабрик§!"
 tooltip_mexico_reform_the_cristero_guard:0 "Реформування §YГвардії крістерос§!:\nРозмістити §Y8 дивізій§! із §Y10 піхотними§! батальйонами та підтримкою §Yартилерії§!."
 tooltip_mexico_they_may_declare_war:0 "§RНафтові барони можуть переконати їх оголосити війну!§!\n"
 tooltip_raid_category_land_infiltration_raids:0 "§HСухопутні нальоти§!\nНальоти малих масштабів, які проводяться сухопутними силами в тилу ворога з застосуванням прихованості та підступів для проведення швидких тактик удару і втечі."
 trait_SOV_determined_desc:0 "Наполегливість деяких людей виходить за межі того, що інші вважають розумним."
 trait_TUR_kemalist_champion:0 "Борець-кемаліст"
 treaty_org.3.desc:0 "Останньої ночі уряди держави [USA.GetNameDef] та [FROM.GetNameDef] оголосили про заснування Організації Північноатлантичного договору — цей дипломатичний маневр був довгоочікуваним. Пообіцявши прихід сприятливої епохи співробітництва цивільних, військових і розвідувальних служб, це рішення було негативно оцінене вищими чинами держави [SOV.GetNameDef].\n\nСхоже, мир може проіснувати не дуже довго."
 tsr_manchukuo.1.c:0 "Імператору не можна довіряти, Пуцзє — правильний вибір"
 tsr_manchukuo.13.a:0 "Він добре їм послужить"
 tsr_manchukuo.14.a:0 "Чудово"
 tsr_manchukuo.16.desc:0 "Після проголошення Національного уряду співробітництва [FROM.GetLeader] звернувся з проханням об'єднати наші китайські володіння не під керівництвом [RNG.GetLeader], а під його владою. Хоча це, можливо, не зовсім те, що ми планували, у цьому випадку, ймовірно, буде ефективніше керувати через одну маріонеткову державу, аніж через кілька."
 tsr_manchukuo.7.b:0 "Ніколи!"
 tsr_manchukuo_news.1.desc:0 "Після періоду зростання насильства та сутичок між японськими адміністраторами та різними бандитськими угрупованнями, один із таких бандитів на ім'я [MAN.GetLeader] зумів захопити Сіньцзін і, своєю чергою, переконав Імператора перейти на його бік. \n\nКоли Імператор став на бік повстанців, армія незабаром наслідувала його приклад, і тепер Маньчжурія стоїть на роздоріжжі: чи будуть японці вигнані, чи повстання буде придушено так само швидко, як і почалося?"
 turkey.1.d:0 "\nРеспубліка сумує.\n\nПомер герой війни, революціонер, президент і Батько Турків — Мустафа Кемаль Ататюрк.\n\nВін залишався вірним турецькому народу і республіці, яку заснував, до самого кінця. Тисячі скорботних вшанували його пам'ять у Стамбулі, перш ніж його тіло було перевезено кесоном, кораблем і потягом до Анкари. Там відбувся його державний похорон за участю всього парламенту та високопоставлених осіб із усього світу.\n\nТепер, коли батька сучасної турецької нації вже немає, Республіка мусить рухатися далі. Великі національні збори вирішили, що [Root.GetLeader] стане його спадкоємцем."
 turkey.1.t:0 "Смерть Мустафи Кемаля Ататюрка"
 uk_australia_focus_desc:0 "Інвестиції в австралійські суднобудівні заводи та промисловість дадуть поштовх економіці країни і дозволять їй зробити більший внесок у разі війни."
 uk_colonial_focus:0 "Заохотити колоніальну еліту"
 uk_service_focus:0 "Служба в заморських територіях"
 united_polynesia_democratic_ADJ:0 "Тихоокеанськ"
 upgrade_plastic_explosives_desc:0 "§LЗавдяки своїй мастикоподібній текстурі пластична вибухівка ідеально підходить для підриву ворожих виробничих об'єктів, і тому буде логічно озброїти їм партизанів за кордоном. Вибухівку можна легко розмістити поза полем зору ворога в уразливих місцях...§!"
 uruguay_third_republic_democratic_DEF:0 "Третя Уругвайська республіка"
 us_pilot_training_tt:0 "Коли почнеться війна, буде доставлено невелику ескадрилью з 25 винищувачів."
 usa.24.b:0 "Залишаймося вірними комунізму."
 usa.24.t:0 "Червоні сутінки"
 usa.5.t:0 "Британія відмовляється від пропозиції"
 usa_congress_elections_tt_good:0 "Інерція, отримана після президентських виборів, швидше за все, перенесеться на вибори до Конгресу.\n"
 vichy_france:0 "Є Вішійською Францією"
 vichy_in_africa_trigger:0 "§YВішістська Франція§!: Будь-який контрольований регіон:\n Знаходиться в §YАфриці§!"
 vickers_armstrong_eng:0 "Vickers-Armstrong"
 vojvodina_communism:0 "Соціалістична провінція Воєводина"
 war_declaration_generated_tension_10:0 "Цільова країна витворила принаймні 10% світової напруженості"
 war_justification.12.a:0 "Не може бути миру в наш час, доки їх не буде."
 war_justification.13.d:0 "«Хоча ми можемо бути мирним народом, наша природа сама по собі не визначає, яким шляхом ми повинні йти в історії. Це час війни. Занадто довго [From.GetAdjective]і політики володіли засобами, необхідними для того, щоби пройти крізь випробування, з якими ми можемо зіткнутися, і очевидно, що вони не збираються розлучатися з ними мирно. Незважаючи на всі наші зусилля, спрямовані на побудову сучасної держави, деякі питання можуть бути вирішені лише старим випробуванням битвою».\n\nВорожа риторика [ROOT.GetLeader] по відношенню до [From.GetName], багато чого зробила, щоб виправдати вторгнення. Деяка частина населення підтримує цей курс, але рішення лежить на землях нашого лідера."
 war_justification.205.a:0 "[ROOT.GetLeader] — кращий правитель, ніж будь-який революційний опортуніст!"
 war_justification.219.t:0 "[ROOT.GetLeader] гнівається з [From.GetAdjective]ої політики"
 war_justification.7.d:0 "«Товариші, хоча найбільших революціонерів колись називали зрадниками, тепер стало очевидно, що зрадили саму революцію. Як інакше пояснити правління [From.GetRulingParty] з [From.GetName], які відкинули будь-який натяк на марксистські ідеї, щоб побудувати вироджену робітничу державу, де вони зможуть панувати на фальшивих підставах? Зміцнюючи власну владу ціною міжнародної революції, вони показали, що їх мало хвилюють ідеали, які вони нібито сповідують. Ми повинні принести їм справжню революцію».\n\nХоча спочатку підтримуючи революцію [From.GetAdjective], [ROOT.GetLeader] висловлює дедалі більше розчарування тим, як вона розвивається. Можливо, [ROOT.GetRulingParty] доведеться втрутитися, поки не стало надто пізно."
 war_propaganda_radio_industry:0 "Радіопропаганда"
 war_with_germany:0 "Війна з Німеччиною"
 warning_to_japan:0 "Попередження Японії"
 wings_of_youth:0 "Крила юності"
 wolfpacks_improvisation:0 "Культура імпровізації"
 wolfpacks_rough_weather_procedure:0 "Процедури для поганої погоди"
 wtt_britain.27.a:0 "Ми не можемо дозволити французькому флоту слугувати німецьким інтересам!"
 wtt_britain_lease_azores.2.a:0 "Це піде нам на користь."
 wtt_britain_lease_azores.5.t:0 "Британія йде з Азорських островів"
 wtt_china_shared.10.desc_a:0 "Сун Мейлін, вдова Чана Кайші та одна з найбільш відданих йому осіб, прибула до Вашингтона, щоби домагатися підтримки Китаю у його боротьбі проти Японії. ВВС Китаю вкрай необхідні сучасні літаки та досвідчені пілоти.\n\nЗаклик Сун був широко підхоплений публікою, і кілька наших пілотів залишили службу, щоби записатися в ряди інструкторів для тренування та навчання китайських льотчиків.\n\nПісля вирішення питання з пілотами Сун Мейлін попросила нас надати китайським ВПС близько 150 сучасних винищувачів."
 wtt_germany.1001.a:0 "Кайзер помер... Нехай живе кайзерина!"
 wtt_germany.16.a:0 "Ми ніколи не відмовимося від своїх домагань!"
 wtt_germany.53.b:0 "Ні, домагатися великонімецького шляху об'єднання Німеччини було б помилкою."
 wtt_germany.54.t:0 "Уряд Німеччини пропонує провести референдум щодо об'єднання"
 wtt_germany.6.d:0 "Наші війська, очистивши прилеглу до маєтку Дорн територію від нідерландських військ, виявили кайзера в доброму здоров'ї та супроводили його до Німеччини. Кілька годин тому Вільгельм II перетнув кордон і урочисто заявив, що після прибуття до Берліна прийме повноваження кайзера Німецької імперії.."
 wtt_germany.8.a:0 "Ми маємо підготуватися до повернення монархії."
 wtt_infiltration.1.t:0 "Боротьба з групами проникнення противника"
 wtt_infiltration.2.a:0 "Направити війська."
 wtt_japan.11.t:0 "Пакт про ненапад із державою [From.GetNameDef]"
 wtt_japan.122.desc:0 "Після захоплення Токіо фашистський уряд впав, і його прихильники і військові загони, що залишилися, бігли в державу [MAN.GetName], яке взяло під свій контроль віддалені острови та території в Кореї та Китаї.\n\nГромадянська війна загалом закінчена, але перемир'я вкрай ненадійне, і фашисти ще розгромлені остаточно."
 wtt_japan.126.b:0 "Ми задовольнимося лише повною перемогою!"
 wtt_news.11.c:0 "Разом ми вистоїмо проти них!"
 wtt_news.17.t:0 "Японія відновлює німецьке правління в Ціндао"
 wtt_news.23.a:0 "Великий успіх!"
 wtt_news.24.t:0 "Французи затопили флот"
 wtt_news.31.t:0 "Чан Кайші страчений"
 wtt_news.33.t:0 "[PRC.GetLeader] звинувачує націоналістів у зраді"
 wtt_news.36.t:0 "Чан Кайші загинув в авіакатастрофі"
 wtt_news.5.c:0 "Певно, до цього приклали руку німці..."
 wtt_news.51.t:0 "[GER.GetLeader] переживає замах"
 wtt_political_organisation.9.a:0 "У коханні та на війні всі засоби хороші, а політика поєднує і те, і інше."
 wtt_prc.12.a:0 "Поставимо [From.GetLeader.GetHerHim] навколішки."
 wtt_prc.23.desc:0 "Минулої ночі один із головних залізничних мостів у державі [JAP.GetManchuriaPuppet] впав під вагою поїзда, що проїжджав, з боєприпасами. Операцію з порятунку та відновлення ускладнив вибух боєприпасів. Персонал поїзда досі не знайдено, найімовірніше, усі загинули.\n\nВійськова розвідка відразу ж, як ситуація стала відносно безпечною, вислала групу слідчих з метою з'ясувати, чому обрушилася така міцна споруда.\n\nОчевидці стверджують, що за день до обвалення бачили у долині невелику групу людей. В даний час їхнє місцезнаходження невідоме."
 wtt_prc.24.desc:0 "Один із наших патрулів у державі [JAP.GetManchuriaPuppet] не вийшов на зв'язок. Вислана пошукова група виявила сліди перестрілки, що говорять про те, що патруль потрапив у засідку та загинув у жорстокому бою.\n\nЧи зазнали втрат нападники, невідомо, оскільки були виявлені лише трупи японських солдатів.\n\nВони виглядають так, ніби були залишені навмисно, як попередження."
 wtt_warlord.1.a:0 "Нарешті хтось зі здоровим глуздом!"
 wtt_warlord_vs_prc.1.desc:0 "До Москви прибула делегація лідера [warlord.GetLeader] з проханням підтримати їх у внутрішній боротьбі влади. Члени делегації стверджують, що [communist_china.GetLeader] не настільки поділяє ідеї комунізму, як заявляє, і може навіть дотримуватися реакційної позиції, а отже, зрадить революцію під час її самої критичної фази.\n\n[warlord.GetLeader] пропонує замість цього підтримати його, обіцяючи безмежну відданість ідеям комунізму загалом та лідеру [SOU.GetLeader] зокрема."
 wtt_warlord_vs_prc.35.t:0 "[From.GetAdjectiveCap]ий альянс"
 wtt_xian_incident.3.desc:0 "Пославшись на тяжку застуду, [CHI.GetLeader] «із жалем» відмовився від зустрічі. Залишається гадати, що це означає — чи збирається він встановити над нашими землями безпосередній контроль, чи хтось видав йому наші плани?"
 wtt_xian_incident.7.d:0 "Reject these notions of a Second United Front"
 wuw_GER_chinese_diplomacy.1.t:0 "[FROM.GetNameDefCap] надсилає зброю та матеріали"
 wuw_GER_chinese_diplomacy.4.desc:0 "\nНаша делегація повернулась з невтішними новинами. Уряд [FROM.GetAdjective] відмовився підписати угоду, звинувативши нас у спробі експлуатації під прикриттям індустріальної допомоги."
 wuw_GER_civil_war.3.desc:0 "Політики та генерали обговорюють ідею створення парамілітарних крил у нашій армії. Консерватори підтримують відновлення Бісмаркської молоді, тоді як інші пропонують розширити соціал-демократичний рух Залізного фронту."
 wuw_GER_civil_war.5.a:0 "Вони не повинні перемогти!"
 wuw_GER_diplomacy.110.desc:0 "Нашу абсолютно справедливу пропозицію [FROM.GetAdjective]и зустріли з холодом і гнівом. Вони чітко заявили, що не бажають більше чути про це. Якщо ми хочемо ці ресурси — доведеться діяти інакше..."
 wuw_GER_diplomacy.58.a:0 "Великий день для [ROOT.GetAdjective] народу!"
 wuw_GER_diplomacy.81.a:0 "Не зовсім нагорода, але що поробиш?"
 wuw_GER_diplomacy.86.a:0 "Чудово!"
 wuw_GER_diplomacy.86.desc:0 "Ми отримали добру звістку — [FROM.FROM.GetNameDef] передав нам [FROM.GetAdjective] землі, що входять у нашу сферу впливу. Вони дотрималися домовленості."
 wuw_GER_diplomacy.87.b:0 "Ми заслужили ці землі!"
 wuw_GER_diplomacy.98.desc:0 "Наші товариші з [FROM.GetNameDef] запропонували створити платформу для обміну знаннями в галузі промисловості та виробництва. Вигоду від цього отримає як наша економіка, так і добробут робітників."
 wuw_GER_monroe.4.t:0 "[FROM.GetNameDefCap] Вимагає від нас відмови від Доктрини Монро"
 wuw_GER_monroe.7.b:0 "Нехай лише спробують нас залякати!"
 wuw_GER_realpolitik.16.b:0 "До зброї, чоловіки!"
 wuw_GER_realpolitik.17.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб ми повернули їм їхні старі східні імперські володіння — провінції Західна Пруссія, Сілезія та Познань. Це велика територія, але можливо, її повернення — єдиний спосіб уникнути підкорення."
 wuw_GER_realpolitik.21.a:0 "Великий день для [ROOT.GetAdjective] нації!"
 wuw_GER_realpolitik.23.a:0 "Час повернути нашу спадщину!"
 wuw_GER_realpolitik.39.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прибув до нашої столиці з пропозицією приєднатися до їхнього альянсу, взяти участь у всіх існуючих союзах і партнерствах. Вони також обіцяють допомогти нам у поверненні наших старих угорських земель і відновленні Великої Угорщини. Чи приймемо ми цю пропозицію?"
 wuw_GER_realpolitik.44.a:0 "Вони не розуміють, що краще для їхнього народу"
 wuw_GER_realpolitik.47.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] підкорився нашим вимогам, хоч якими суворими вони були. Наші війська вже в русі — час відновити давно втрачену славу."
 wuw_GER_realpolitik.59.desc:0 "Попри очевидні переваги для об'єднання, [FROM.GetNameDef] відкинув нашу пропозицію щодо подальшої інтеграції. Можна лише здогадуватися про їхні причини, але схоже, вони не дбають про єдність союзу."
 wuw_GER_reichskommissariats.19.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.2.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_reichskommissariats.26.t:0 "Керівництво Східної Азії"
 wuw_GER_reichskommissariats.7.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.7.desc:0 "Ми встановили нову цивільну адміністрацію в Туркестані..."
 wuw_GER_releasable.2.c:0 "У ці небезпечні часи монархи повинні діяти!"
 wuw_GER_weltpolitik.18.a:0 "Яка грубість!"
 wuw_GER_weltpolitik.3.a:0 "Цьому не судилося збутися..."
 wuw_GER_weltpolitik.4.t:0 "[FROM.GetLeader] хоче поділити Конго"
 wuw_GER_weltpolitik.8.t:0 "[BEL.GetNameDefCap] здає Конго"
 wuw_HUN_a_declaration_of_intentions:0 "Декларація намірів"
 wuw_HUN_a_holy_empire:0 "Священна імперія"
 wuw_HUN_approach_the_diasporas:0 "Налагодити зв'язок із діаспорами"
 wuw_HUN_continue_the_regency_desc:0 "Відколи адмірал Горті взяв владу під час громадянських воєн 20-х, [HUN.GetNameDef] стабілізувалась. Регентство має тривати для подальшого процвітання."
 wuw_HUN_demand_carpathian_ruthenia_desc:0 "Угорці Карпатської Русі надто довго перебувають під владою чужинців, починаючи з моменту проголошення незалежності Гуцульської Республіки у 1919 році. Ми мусимо повернути ці землі задля нашого народу!"
 wuw_HUN_doctrinal_studies_desc:0 "Ми багато чого дізнались через обміни офіцерами та стратегічні сесії з союзниками, а також завдяки військовій розвідці. Об’єднання цих поглядів наблизило нас до доктринального прориву."
 wuw_HUN_expand_the_arpad_line:0 "Розширити лінію Арпада"
 wuw_HUN_expand_the_arpad_line_desc:0 "Лінія Арпада показала свою ефективність, але щоб дійсно стримати ворожий наступ, її потрібно розширити як за масштабами, так і за географією."
 wuw_HUN_instate_a_socialist_economy_desc:0 "Щоб справді змінити суспільство на краще, потрібно змінити, як циркулюють гроші, й усунути керівників-корупціонерів. Робітники знову матимуть голос, і всі [ROOT.GetAdjective] будуть рівні!"
 wuw_HUN_institute_corporatism:0 "Запровадити корпоративізм"
 wuw_HUN_light_infantry_divisions_doctrine_desc:0 "Маючи обмежений людський ресурс, ми повинні створювати менші, але ефективні підрозділи. Легка піхота — оптимальне поєднання сили й розміру."
 wuw_HUN_news_events.6.a:0 "Нарешті — король!"
 wuw_HUN_news_events.8.a:0 "Нарешті!"
 wuw_HUN_renovato_imperii:0 "Renovatio Imperii"
 wuw_HUN_renovato_imperii_desc:0 "Renovatio imperii Romanorum — оновлення імперії римлян — це формула, яка проголошує намір відновити Римську імперію, й використовувалася багато разів у минулому. Ми маємо зробити те саме та офіційно проголосити своє прагнення відновити Австро-Угорську імперію й повернути їй велич!"
 wuw_HUN_the_balkan_pact_invitation_tt:0 "[ROM.GetNameDef] отримає подію: §Y[ROOT.GetNameDefCap] запрошує [ROM.GetNameDef] до Балканського пакту§!"
 wuw_HUN_the_kingdom_of_ukraine:0 "Королівство Україна"
 wuw_HUN_uplift_the_dragon_movement_desc:0 "Рух Дракона — представники середнього класу, що виступають за Велике Угорське суспільство з національними цінностями. Їхній шлях збігається з нашим."
 wuw_connected_autobahn:0 "Підключили до нас автобан"
 ww_BEL_event_diplomatic.32.t:0 "[FROM.GetNameDefCap] Відмовляє нам в членстві в [FROM.GetFactionName]"
 ww_BEL_event_diplomatic.5.b:0 "Конго за Кале."
 ww_BEL_event_diplomatic.8.b:0 "Це здається справедливою ціною!"
 ww_BEL_event_spanish_interaction.3.a:0 "Чудово!"
 ww_BEL_event_spanish_interaction.9.desc:0 "З завершенням нашої громадянської війни [FROM.GetAdjective] вирішили, що настав час розірвати наше партнерство. Хоча це припиняє наш альянс на цей час, вони дуже наполегливо заявляли, що це не означає, що ми ніколи не будемо союзниками знову."
 ww_BEL_event_war.10.desc:0 "Цілі, поставлені перед нами на початку війни проти [FRA.GetAdjective], були досягнуті. Париж тепер під нашим контролем, і можна припустити, що [FRA.GetAdjective] тепер достатньо стурбовані, щоб погодитися на відведення наших військ в обмін на передачу нам Кале. \n\nВодночас піднімаються голоси: ми досягли цього, і [FRA.GetAdjective] явно не можуть нас зупинити. Чому зупинятися зараз?"
 ww_BEL_event_war.4.desc:0 "Після його зради, коли він віддав країну загарбникам, король був поміщений під домашній арешт, позбавлений посади головнокомандувача збройними силами, позбавлений титулів і, звичайно ж, корони. Однак народ все ще потребує правителя, і тепер ми маємо вибір, хто повинен очолити регентство, поки його син не стане достатньо дорослим, щоб взяти трон. Є два варіанти: \n\nПерший — Леон Дегрель, прем'єр-міністр і законно призначений лідер нашого народу. Інший варіант — Шарль, граф Фландрії, брат Леопольда, що надасть легітимності та безперервності з короною."
 ww_congo.18.a:0 "Ера імперіалізму ще не закінчена"
 ww_congo.24.t:0 "Бельгійці відхиляють нашу схему імміграції"
 ww_congo.39.a:0 "Каса-Вубу — хороший державний діяч, нам потрібен він"
 yasuda_zaibatsu:0 "Yasuda"
 zaibatsu_bank:0 "Банк-дзайбацу"
