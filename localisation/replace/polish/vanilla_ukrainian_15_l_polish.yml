 RAJ_partition_1.desc:0 "Те, що починалося як громадянський протест, переросло у насильство, коли місцеві поліцейські сили вступили у сутичку з позбавленим прав населенням. [ENG.GetAdjective] поліція стверджує, що діяла під загрозою насильства, тоді як протестувальники наполягають на тому, що вони суворо дотримувалися ненасильства.\nНіхто не загинув, але 2 місцеві офіцери отримали легкі травми, а 1 протестувальника було доставлено до місцевої лікарні із струсом мозку."
 RAJ_princely_states_donations:0 "$RAJ_princely_states$"
 RAJ_rani_of_jhans_desc:0 "Лакшмі Баї, рані з Джгансі, стала національним героєм під час Сіпайського повстання 1857 року. Її хоробрість і гордість за рідну країну стали прикладом для всіх жінок Індії, які вирішили взяти в руки зброю та сформувати власний полк."
 RAJ_request_transfer_of_british_commanders_desc:0 "Ми попросимо [ENG.GetNameDefCap] перевести одного зі своїх військово-морських командирів до нас, щоб допомогти в навчанні наших нових морських піхотинців."
 RAJ_rifle_factory_ishapore_west_bengal_desc:0 "Збройова фабрика Ішапур працюватиме в тандемі з фабрикою Хадкі, щоб забезпечити армію стрілецькою зброєю."
 RAJ_secure_weapons_desc:0 "Наше військове обладнання — це безлад невідповідних зразків з різних країн. Однак за невеликої допомоги іноземних країн ми можемо отримати обладнання для підготовки до звільнення."
