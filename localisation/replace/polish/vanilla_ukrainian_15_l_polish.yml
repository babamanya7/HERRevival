 landmark_bojnice_castle_desc:0 "Колись у Бойницькому замку мешкали угорські королі та інші високопоставлені дворяни, але після відокремлення від Угорщини в 1920 році він став однією з найкрасивіших споруд Словаччини."
 lar_appeal_to_overseas_territories.6.a:0 "Та у них у всіх разом сил не вистачить!"
 lar_arms_purchases.2.desc:0 "Президент [From.GetLeader] підтримав Сенат США, який провів законопроєкт, що дозволяє нам розміщувати замовлення на зброю на американських заводах, але при цьому різко обмежив фінансові можливості. Ізоляційні в США досі переконані, що саме через величезні борги, накопичені нами під час Великої війни, Америка була змушена оголосити війну Німеччині. Тепер вони вимагають від нас платити за зброю у валюті, що конвертується."
 lar_compensate_italy.1.b:0 "Нас так просто не купити."
 lar_compensate_italy.3.a:0 "Як ми вчинимо тепер?"
 lar_concessions_to_italy.4.desc:0 "[This.GetLeader] та посли держав [ENG.GetNameDef] та [FRA.GetNameDef] провели зустріч і обговорили ратифікацію угод, укладених у Стрезі. Дипломати перейшли в наступ, пропонуючи віддати території на Сході, зокрема, потрібно буде розлучитися з Джібуті та британською частиною Сомалі.\n\nРатифікація союзного договору буде можлива після передачі цих територій."
 lar_dominate_the_middle_east.1.desc:0 "Уряд країни, яку очолює [From.GetLeader], призначив нового повноважного представника на Близькому Сході. [This.GetLeader] і французький представник зустрілися сьогодні в нашій столиці, і останній помітив, що уряд Франції бажав більш активну роль у регіоні і очікує, що з ним безпосередньо радитимуться з усіх питань, що стосуються регіональної стабільності.\n\nУмовчавши про наслідки невиконання цього прохання, французький представник зауважив, що його уряду буде «проблематично» прийняти незалежну зовнішню політику нашого уряду."
 lar_france_french_union.10.t:0 "Індокитай голосує за вступ до Союзу"
 lar_france_french_union.11.t:0 "Індокитай голосує проти Союзу"
 lar_france_french_union.7.t:0 "Центральна Африка голосує за вихід"
 lar_non_intervention.1.b:0 "Ця витівка марна, і ми не станемо в ній брати участь!"
 lar_operative_event.3.a:0 "Героїчна смерть наздогнала [This.GetHerHis]."
 lar_operative_event.6.desc:0 "[This.GetName] трапляється при спробі проникнути в нашу адміністрацію та передати секретну інформацію своєму начальству. На допиті [This.GetSheHe] визнається, що працює іноземним агентом на агентство [From.GetAgency], що діє на [From.From.GetAdjective] території. Поки неясно, яка саме природа [From.GetAdjective] інтересу до нашої нації і які відділи нашої адміністрації могли вже потрапити на очі [From.GetAdjective] розвідки.[This.GetName] знаходиться у в'язниці та очікує подальших допитів: можна лише сподіватися, що рано чи пізно [This.GetSheHe] розповість усе, що потрібно знати про [From.GetAdjective] операції в державі [From.From.GetNameDef]."
 lar_portugal_navy_mutiny.3_no_ships_tt:0 "§GЗаколот пригнічений§!"
 lar_portugal_overseas_provinces.2.t:0 "Інтеграція мозамбіцької території"
 lar_ratify_the_stresa_front.1.a:0 "Це тріумф [This.GetAdjective]ої дипломатії."
 lar_rescue_mussolini.1.a:0 "Спробувати все одно варто."
 lar_spain.100.a:0 "Вони розпадуться наново."
 lar_spain.12.desc:0 "Більшість фалангістів здалися після захоплення їх останньої основної фортеці. Незважаючи на те, що окремі вогнища опору все ще тліють, це знаменує кінець організованої армії Фаланги. Хоч це і значно спростило нам війну, ми, як і раніше, боремося з ворогами, що залишилися."
 lar_spain.18.desc:0 "Наші плани реалізовані, і ми тепер можемо починати переворот. При цьому, щоби не повторився сумний результат «санхурхади», повстання 1932 р., ми мусимо дочекатися відповідного політичного клімату. Ми витратимо свої ресурси на те, щоби приховати сліди своєї діяльності, а самі вичікуватимемо..."
 lar_spain.2.b:0 "...яку ми і виграємо під керівництвом Фаланги!"
 lar_spain.28.a:0 "Ми виконаємо зобов'язання."
 lar_spain.34.a:0 "Воля короля має бути виконана. Хав'єр стане нашим новим королем!"
 lar_spain.51.b:0 "Ми надішлемо золотий запас до держави [SPR_relocated_gold_reserves_selection_1.GetNameDefCap]."
 lar_spain.58.a:0 "Вони нам не довіряють?"
 lar_spain.58.desc:0 "Наші представники в державі [From.GetNameDefCap] повідомляють, що [From.GetAdjective] уряд відхилив наше прохання про більшу автономію."
