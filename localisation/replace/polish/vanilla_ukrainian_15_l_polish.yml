 SEA_china.21.a:0 "Наполягати на своєму"
 SEA_china.23.desc:0 "[FROM.GetAdjective]ий уряд оголосив ембарго проти нас як покарання за нашу відмову від Договору дев'яти держав, і начальники портів з [FROM.GetNameDef] тепер відвертають кожне китайське вантажне судно. Вітчизняна преса засуджує цей захід як економічне задушення, останній подих епохи імперіалізму, яка інакше давно минула."
 SEA_china.5.tt:0 "Збільшує винагороду §Y$CIC_BANK_HEADER$§! від фокусу §YDemonstrate our Resolve§! на §Y1000§!"
 SEA_china_democratic.20.b:0 "Тут щось нечисто!"
 SEA_china_democratic.8.desc:0 "Відповідь на наші вимоги до [FROM.GetNameDef] звільнити [CHI_country_to_be_liberated.GetNameDef] щойно надійшла. Можливо, дещо несподівано, але вони погодилися визнати [CHI_country_to_be_liberated.GetNameDef] незалежною державою."
 SEA_generic_events.15.b:0 "Звинуватити протестувальників"
 SEA_generic_events.5.b:0 "Раді за них"
 SEA_imperial_influence_events.1.t:0 "Спалахує внутрішня боротьба за владу"
 SEA_imperial_influence_events.140.t:0 "Фракція Армії планує розширення"
 SEA_imperial_influence_events.210.t:0 "Фракція Флоту прагне розширити виробництво на верфях"
 SEA_imperial_influence_events.242.desc:0 "Флот висунув свої вимоги. Схоже, вони прагнуть розширити свій флот лінкорів та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми замовили будівництво більшої кількості лінкорів для задоволення їхніх потреб у розширенні. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.501.a:0 "Який безчесний вчинок!"
 SEA_imperial_influence_failure_event_option_5:0 "Зробити або не зробити. Вони не зробили."
 SEA_imperial_influence_failure_event_option_8:0 "Вітер завтрашнього дня повіє завтра"
 SEA_japan.1.c:0 "Військових треба приборкати!"
 SEA_japan_foreign_policy.108.desc:0 "Незважаючи на очевидні переваги і те, що це явно найкраще для союзу, [FROM.GetNameDef] відхилив нашу пропозицію про подальшу інтеграцію. Можна лише здогадуватися про їхні причини, але, схоже, вони не дбають про найкращі інтереси союзу."
 SEA_japan_foreign_policy.12.desc:0 "Керівництво в [FROM.GetNameDef] відмовилося прислухатися до голосу розуму, заявивши, що не віддасть жодного дюйма землі в Індокитаї. Це значно перешкоджає нашій подальшій експансії на південь... Чи повинні ми змиритися з цим, чи, можливо, настав час завдати удару по заходу?"
 SEA_japan_foreign_policy.126.a:0 "Це їхня втрата"
 SEA_japan_foreign_policy.19.t:0 "[FROM.GetNameDefCap] приймає наше запрошення"
 SEA_japan_foreign_policy.21.desc:0 "Наш милостивий сюзерен [FROM.GetNameDef] вирішив нарешті узаконити наші претензії на те, що ми є справжньою монгольською державою, і запропонував ще одну реорганізацію нашого уряду та установ, щоб сприяти цій зміні політики. Сьогодні великий день для [ROOT.GetAdjective]ого народу!"
 SEA_japan_foreign_policy.47.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 SEA_japan_foreign_policy.53.t:0 "Підривних елементів помічено в аймаку Хан-Хентій-Уул"
 SEA_japan_foreign_policy.8.a:0 "І порядок відновлено"
 SEA_japan_foreign_policy.84.t:0 "[FROM.GetLeader] відхиляє пакт"
 SEA_japan_foreign_policy.94.a:0 "Жахливо"
 SEA_japan_popup_events.11.desc:0 "Оскільки Імператор все ще перебуває під домашнім арештом, незважаючи на тривалий час, що минув після встановлення нашого уряду, невдоволення зростає дедалі швидше. Схоже, наш народ бажає бачити Хірохіто належним чином відновленим на троні, і вони можуть навіть готуватися до дій для його звільнення, якщо ми незабаром нічого не зробимо з цією ситуацією. Можливо, вони трохи заспокоїлися б, якби не було такої фігури, яку можна було б відновити на троні, хоч би яким непопулярним для нас було б втілення цього в життя. Як нам підійти до цього?"
 SEA_japan_popup_events.2.t:0 "Оборонне братство на межі розпаду!"
 SEA_japan_popup_events.29.desc:0 "Сьогодні рано-вранці сили, що належать до Імперської армії, зайняли склад на околиці Міядзакі, де перебували комуністичні революціонери, намагаючись їх заарештувати. Кюїті Токуда був врятований з в'язниці Абасірі місцевими комуністичними партизанами, і після перестрілки на складі в Міядзакі Токуда передав по радіо наказ негайно розпочати революцію. Здається, настав час діяти."
 SEA_japan_popup_events.30.desc:0 "Оскільки ситуація стала стабільнішою після поразки Імперської армії, у національному сеймі розгорілися дебати щодо того, який шлях обрати. Кодза-ха стверджують, що тільки використовуючи пролетаріат і авторитарну керівну руку для управління народом, ми можемо досягти нашого ідеального майбутнього, тоді як Роно-ха стверджують, що м'якший і менш нав'язливий об'єднавчий рух був би ідеальним для управління державою. Яку ідею слід втілити?"
 SEA_japan_popup_events.38.desc:0 "Після тривалого періоду зростання комуністичних настроїв здається, що [ROOT.GetAdjective]ий пролетаріат втомився чекати мирної зміни уряду. Після напружених дискусій, схоже, дипломатія зазнала краху, і почався збройний конфлікт."
 SEA_japan_popup_events.45.t:0 "Окупація Автономного уряду Східного Хебею"
 SEA_japan_popup_events.47.t:0 "[FROM.GetNameDefCap] скасовує наші права на ресурси в [655.GetName]"
 SEA_japan_popup_events.5.t:0 "Хірохіто вирішує підтримати новий уряд"
 SEA_japan_tokko_arrest_events.5.a:0 "Більше інакомислення придушено"
 SEA_warlords.26.t:0 "[FROM.GetLeader] вимагає нашого підкорення"
 SEA_warlords.29.b:0 "Ми ніколи не здамося!"
 SEA_warlords.33.t:0 "[FROM.GetLeader] погоджується передати [434.GetName]"
 SEA_warlords.36.desc:0 "Після заяви Нанкіна про те, що вони не відступлять перед жодними нашими погрозами, і нашої подальшої декларації про опозицію, частина нашої армії дезертирувала, а генерал Юй Ханьмоу пригрозив, що якщо [ROOT.GetLeader] не піде у відставку, він піде маршем на Гуанчжоу і змусить це зробити силою."
 SEA_warlords.4.a:0 "Тоді ми розчавимо і їх!"
 SEA_warlords.41.a:0 "Що ж"
 SEA_warlords.52.t:0 "[FROM.GetLeader] бажає зупинити кампанію оточення"
 SEA_warlords.59.a:0 "Ми на крок ближче до відновлення нашої честі!"
