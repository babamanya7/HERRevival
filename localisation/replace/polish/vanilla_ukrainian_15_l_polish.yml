 DEN_agricultural_subsidies_desc:0 "Наші фермери борються з борговою кризою та вилученням заставного майна. Почуття безпорадності та гніву вже давно назріває серед них і ризикує перерости у щось більш небезпечне, якщо його не зупинити. Ми повинні вирішити цю ситуацію і допомогти аграрному сектору якнайкраще."
 DEN_alsing_andersen:0 "Альсінг Андерсен"
 DEN_ask_for_support_desc:0 "[GER.GetAdjective] є яскравим прикладом того, яку країну ми хочемо побудувати. Тому ми не можемо уявити собі кращих людей, щоб звернутися до них за підтримкою в цей неспокійний час в уряді. Ми повинні відправити делегацію до [GER.capital.GetCapitalVictoryPointName] якомога швидше!"
