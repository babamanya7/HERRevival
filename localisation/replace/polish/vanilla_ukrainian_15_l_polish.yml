 RULE_OPTION_COMMUNIST_POL_AI_DESC:0 "§HПольський§! ШІ намагатиметься прийти до порозуміння з СРСР і захиститися від агресії, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_AST_AI_DESC:0 "§HАвстралійський§! ШІ намагатиметься слідувати історичній низці подій і рішень у дереві національних фокусів."
 RULE_OPTION_FASCIST_ALTERNATE:0 "Альтернативний фашистський шлях"
 RULE_OPTION_FASCIST_GER_AI_DESC:0 "Німецький ШІ залишить країну фашистською і намагатиметься завоювати Європу, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_FASCIST_PHI_AI_DESC:0 "Філіппіни приєднаються до японців, що може призвести до того, що вони самі стануть жертвами фашизму."
 RULE_OPTION_FASCIST_POR_AI_DESC:0 "Рафаель Перейра захопить контроль над §HПортугалією§! як фашистський диктатор і підтримуватиме націоналістів у ході іспанської громадянської війни, а згодом спробує вступити до складу Осі."
