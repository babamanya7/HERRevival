 DOD_hungary.103.desc:0 "Угорський уряд запропонував нам розділити державу [CZE.GetNameDef]. Нам дістануться західні райони країни, Угорщина отримає більшу частину Словаччини, а демаркаційна лінія між нашими державами розділить державу майже навпіл. \n\nУгорці запевнили нас, що залишають за нами право зробити перший крок, аби їм у результаті дісталася обіцяна частка."
 DOD_hungary.111.a:0 "У нас немає вибору."
 DOD_hungary.120.a:0 "Відмінна думка."
 DOD_hungary.124.desc:0 "[From.GetAdjectiveCap]ий міністр закордонних справ прибув до Берліна, щоб обговорити план розділу держави [CZE.GetNameDef] на дві частини. Уклавши запропоновану угоду, кожна зі сторін отримає повний контроль над своєю частиною країни., нам при цьому дістануться західні області Богемії та Моравії, а їм відійде Словаччина."
 DOD_hungary.128.a:0 "Яка грубість."
 DOD_hungary.145.b:0 "Франція."
 DOD_hungary.148.b:0 "Час розмов пройшов. Час діяти!"
 DOD_hungary.160.b:0 "Великий літак із великою дальністю дії."
 DOD_hungary.30.b:0 "А навіщо вони хочуть збільшити армію?"
 DOD_hungary.55.t:0 "Виберіть посередника"
 DOD_hungary.60.c:0 "Це лише чергова безглузда суперечка на Балканах."
 DOD_hungary.72.t:0 "Конференція з Трансільванії: день 2"
 DOD_hungary.90.desc:0 "[HUN.GetAdjectiveCap]а влада почала активно мусувати питання про належність Воєводини, стверджуючи, що вона колись входила до Угорщини як частина імперії і тому має бути повернена. Вони стверджують, що об'єднання Сербії наприкінці Великої війни відбулося «під тиском ззовні» і тому не має сили, а отже, ця територія досі є [HUN.GetAdjective]ою."
 DOD_hungary.94.a:0 "Послати ультиматум до Белграду!"
 DOD_romania.2.desc:0 "Наша делегація повернулася з Варшави з договором про взаємодопомогу, гарантом якого виступає [POL.GetLeader]. Наші країни зобов'язуються захищати одна одну у разі війни."
 DOD_romania.81.a:0 "Уряд купив цей будинок і дозволив пані Лупеску в ньому оселитися."
 DOD_yugoslavia.1.a:0 "Нам слід було послухати офіцерів."
 DOD_yugoslavia.183.d:0 "Поки в нашій країні продовжують зростати комуністичні настрої, серед вкрай лівих починають формуватися невеликі парамілітаристські групи. Озброєні вони, зважаючи на все, зброєю з Югославії, і багато хто підозрює, що [From.GetLeader] зі своїм режимом планує скинути [This.GetAdjective] уряд, щоб провести у владу тих, кому близька його нова ідеологія — [From.GetRulingIdeology]."
 DOD_yugoslavia.30.b:0 "Їхня думка не відіграє жодної ролі."
 DOD_yugoslavia.31.desc:0 "Кілька днів тому німецький посол та [YUG.GetLeader] поспілкувалися на дипломатичному прийомі. Посол зауважив, що після аншлюсу Австрії [YUG.GetNameDef] та [GER.GetNameDef] безпосередньо межують один з одним. [YUG.GetLeader] отримав запевнення у тому, що Німеччина, зрозуміло, бажає розвивати добросусідські відносини. \n\nПосол попросив враховувати цей факт при ухваленні важливих рішень у майбутньому."
 DOD_yugoslavia.34.b:0 "Тигру байдуже, про що думають миші."
 DOD_yugoslavia.503.desc:0 "Хоча король [Root.GetLeader] і переконував свою обраницю у справжньому коханні, зарубіжну принцесу не зачепили його почуття. Після кількох тижнів інтенсивних залицянь та люб'язностей [From.GetPrincessName] відвернув угодою від [From.GetAdjective] уряду, король, зрозуміло, засмучений відмовою, але все одно вірить, що одного разу знайде відповідну королеву для свого королівства."
 DOD_yugoslavia.60.paul:0 "Уперше з початку ХХ століття монарх держави [YUG.GetNameDef] коронований у Белградському соборі в ході традиційної сербської православної церемонії. Багато хто досі вважає короля Павле узурпатором і більше фашистом-диктатором, ніж гідним королем тепер він носить корону, і майбутнє Югославії, чи на добро, чи на зло, знаходиться в його руках."
