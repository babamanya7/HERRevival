 PRC_the_first_premier_desc:0 "$PRC_zhou_enlai$ буде призначений першим прем'єром $PRC_proclaimed_communism$, що закріпить його позицію як одного з провідних політиків Партії."
 PRC_the_general_secretary:0 "Генеральний секретар"
 PRC_the_internal_enemy_tt:0 "Бонус атаки проти всіх §Yкитайських країн§!: §G+5%§!\nБонус прориву проти всіх §Yкитайських країн§!: §G+5%§!"
 PRC_the_march_to_victory_desc:0 "Похід до перемоги неминучий. Те, що починалося як Небажане двовладдя, призвело до створення сильної та об'єднаної партійної структури. Тепер ми повинні поглянути назовні, на наших внутрішніх ворогів."
 PRC_the_response_to_a_threat_desc:0 "Ми зробимо все необхідне, щоб відповісти на всі загрози, що нас оточують. Ми повинні підготуватися до атаки."
 PRC_to_steal_an_army_desc:0 "Оскільки наша обмежена промисловість не встигає за потребами нашої армії, вкрай важливо використовувати трофейне спорядження, коли це можливо. Це може створити логістичні проблеми, але за належної підготовки та таких заходів, як забезпечення постачання запасних частин, їх можна подолати."
