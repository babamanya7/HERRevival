 ROM_EQUIPMENT_VERSION_10:0 "J"
 ROM_change_sides_to_commintern_desc:0 "Зміни в нашому уряді зажадали змін у нашому ставленні до війни. Приєднавшись до Комуністичного інтернаціоналу, наші сьогоднішні \"товариші\" у глобальному конфлікті будуть чимало здивовані, коли румунські кулі знайдуть нову мету."
 ROM_coastal_defense_navy:0 "Флот берегової оборони"
 ROM_expand_the_marine_regiment_desc:0 "Оволодіння Чорним морем відкриває нові можливості для наступу. Морські вторгнення тепер є життєздатним варіантом, що вимагає створення нових моделей транспорту, а також спеціальних підрозділів морської піхоти, які можуть спеціалізуватися на цій формі війни."
