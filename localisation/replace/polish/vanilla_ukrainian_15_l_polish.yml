 DEN_strengthen_the_officer_corp_desc:0 "Офіцери відіграють ключову роль в успіху військових операцій, і для забезпечення ефективності наших збройних сил ми повинні приділяти більше уваги зміцненню нашого офіцерського корпусу. Ми повинні виховати нове покоління кваліфікованих і відданих своїй справі лідерів."
 DEN_sub_ship_engine_2:0 "«Burm. & Wain» 1 200 к. с. н. в."
 DEN_support_schleswigian_farmers_desc:0 "У Південній Ютландії зростає кількість маргінальних рухів, що були спричинені напруженою економічною ситуацією та суперечками щодо їхньої колективної ідентичності: хто вони — німці чи данці? Ми могли б пом'якшити деякі з цих розбіжностей, збільшивши наше економічне стимулювання в регіоні."
