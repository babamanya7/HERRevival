 SIA_achieve_domestic_legitimacy_tt:0 "Система §YКхана Ратсадон§! буде відключена.\n§YВійськове крило§! буде остаточно розпущено, що повністю вилучить його національний дух.\n\n§YЦивільне крило§! буде остаточно реорганізовано в §Y$idea_SIA_unwavering_civilian_support$§!."
