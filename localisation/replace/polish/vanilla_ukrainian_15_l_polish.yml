 RAJ_attract_scientists_desc:0 "З нашим великим багатством ми тепер можемо залучати найкращих вчених з усього світу."
 RAJ_automating_the_army_desc:0 "Ми надамо пріоритет механізації та передовим бронетанковим дивізіям, прокладаючи шлях до повністю модернізованої армії."
 RAJ_battle_cruiser_2_desc:0 "The Princess Royal was a class of hypothetical battlecruisers that were a faster and cheaper version of the King George V-class battleships. These vessels carried a similar but reduced armament for both surface and anti-air combat: two triple 14 in. cannons and six twin 5.25 in. AA guns. Their fast speed and long range would provide the Royal Navy quick strike capabilities and convoy protection, but their limited armor would prove problematic if they had to fight modern battleships."
 RAJ_battleship_2_desc:0 "$ENG_battleship_2_desc$"
 RAJ_carrier_1:0 "Клас «Courageous»"
 RAJ_chindits_dlc:0 "$RAJ_chindits$"
 RAJ_circuvment_demobilization_restrictions_desc:0 "Уряд все ще зберігає сувору стелю на те, скільки чоловіків ми можемо мобілізувати. Корона має смертельно боятися армії, яка не під їхнім контролем. Нічого, є способи обійти ці обмеження, або за допомогою хабарів, або не враховуючи певних релігійних працівників як частину збройних сил."
 RAJ_colonial_cadet_exchange_desc:0 "Ми відправимо наших найяскравіших кадетів тренуватися разом із британськими офіцерами, забезпечуючи нашу армію передовими методиками."
