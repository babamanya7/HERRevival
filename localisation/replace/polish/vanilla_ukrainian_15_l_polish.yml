 ITA_late_to_the_atomic_party_flag:0 "§RДержаву [ROOT.GetNameWithFlag] більше не можна вважатипровідною в дослідженні технології $atomic_research$§!"
 ITA_missiolini_pacify_ethiopia_vanilla_desc:0 "$ITA_missiolini_pacify_ethiopia_desc$"
 ITA_missiolini_strengthen_the_airforce_fighters_goal_tt:0 "Вироблено або здобуто [?ROOT.ITA_missiolinis_fighters_to_produce|Y] нових §Yвинищувачів§!.\nНаразі розгорнуто винищувачів: [?ROOT.num_deployed_planes_with_type@small_plane_airframe|G] - Наразі винищувачів у запасі: [?ROOT.num_equipment@small_plane_airframe|G] - Загальна ціль винищувачів: [?ITA_missiolinis_fighters_goal|Y]\n\n"
