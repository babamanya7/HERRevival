 INS_volksraad_reduce_rubber_export_tax_desc:0 "Наразі існує надзвичайно високий податок на приватні компанії, що експортують каучук, що дозволяє нам утримувати монополію на ринку. Однак це призвело до економічного застою в деяких регіонах через неможливість роботи приватних плантацій. На момент впровадження це вважалося доцільним, але міжнародний протекціонізм часів Великої депресії зробив нашу економіку експорту каучуку набагато менш прибутковою. Можливо, варто знизити податок, щоб стимулювати економіку."
