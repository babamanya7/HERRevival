 IRQ_political_events.11.t:0 "[FROM.GetNameDef] висловлює дипломатичний протест"
 IRQ_political_events.50.desc:0 "Уряд [FROM.GetNameDef] офіційно вимагає, щоб ми передали контроль над Кувейтом їхній владі. Вони стверджують, що Кувейт, як невід'ємна частина арабського світу, має бути об'єднаний з [FROM.GetNameDef] під єдиною адміністрацією для забезпечення стабільності та процвітання регіону. Хоча вони оформлюють свою вимогу як крок до панарабської єдності, поступка Кувейтом значно зменшить наш вплив на Близькому Сході. Відхилення їхньої пропозиції може ще більше напружити стосунки та потенційно призвести до ескалації."
 IRQ_political_events.78.a:0 "Тимчасова перешкода..."
 IRQ_royal_air_force_intro_tt:0 "Модифікувати §Y$IRQ_air_force_modifier$§! на:"
 IRQ_strengthen_mesopotamian_farming_desc:0 "Як і багато її попередників, [ROOT.GetNonIdeologyName] зосереджена навколо двох великих річок, Тигру та Євфрату. Земля між цими річками ідеально підходить для сільського господарства, однак, можливо, ми могли б використовувати сучасні методи для збільшення врожайності."
 IRQ_united_arab_republic_fascism_ADJ:0 "Арабськ"
 ISR_neutrality_ADJ:0 "Єрусалимськ"
 ITA_aid_for_the_spanish_republic:0 "Допомога для Іспанської республіки"
 ITA_alpine_defense:0 "Альпійська оборона"
 ITA_anti_partisan_measures:0 "Антипартизанські заходи"
 ITA_armored_car_equipment_1_short:0 "AB40"
 ITA_autonomy_collaboration_government:0 "$OVERLORDADJ$а $NONIDEOLOGY$"
 ITA_auxiliaries_desc:0 "Як і за часів наших римських предків, допоміжні війська продовжують відігравати важливу роль сьогодні, коли йдеться про підтримку регулярних військових частин, розвідку місцевості та переслідування ворога. Ми мусимо розширювати ці воєнізовані формування, щоби зміцнити нашу армію."
 ITA_balkan_ambition_desc:0 "Настав час розширити кордони Італії на схід, у Словенію та, що більш важливо, до узбережжя Далмації. Ми зробимо акцент на венеційській культурній спадщині Далмації і покажемо світові, що венеційський уряд був не лише корисним для далматів у минулому, але й дуже добре сприймався ними."
 ITA_battaglia_del_grano_desc:0 "Щоб бути по-справжньому незалежними, ми не можемо покладатися на іноземні держави щодо нашого продовольства, але повинні стати сільськогосподарськими самодостатніми. У битві за зерно ми станемо самозабезпеченими, і наша сила буде ще більше зростати."
 ITA_battaglia_per_la_nascite_desc:0 "Для того, щоб Італія справді процвітала, нам потрібно більше солдатів. Щоб отримати більше солдатів, нам потрібно більше населення. Для того, щоб отримати більше населення, нам потрібні матері. Матерям потрібно, щоби ми виграли битву за народження."
 ITA_bop_send_support_desc:0 "Наші ідейні побратими опинилися у стані війни. Як засновники фашизму, ми зобов'язані зробити так, щоб вони перемогли!"
 ITA_caproni_organization:0 "$caproni$"
 ITA_carica_di_isbuscenskij_desc:0 "Дехто каже, що дні коня та вершника на полі бою минули. Що роль кавалерії перебрали на себе танки та літаки. Але вони помиляються: кінь не потребує пального, не потребує наземного екіпажу, не потребує жодних запчастин, окрім нової підкови час від часу. Це дає кінноті явну перевагу навіть на сучасному полі бою."
 ITA_carlo_vecchiarelli:0 "Карло Векк'яреллі"
 ITA_claims_on_turkey:0 "Претензії на Туреччину"
 ITA_comandante_diavolo_eritrea_tt:0 "Створити §Y1 дивізію нерегулярної піхоти§! та §Y2 кавалерійські дивізії§!."
 ITA_conquer_the_south_mission:0 "Завоювати Південну Ефіопію"
