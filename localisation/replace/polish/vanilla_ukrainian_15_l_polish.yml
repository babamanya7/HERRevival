 PER_develop_oil_fields:0 "Розвивати нафтові родовища"
 PER_establish_opec_desc:0 "З повністю створеною нашою нафтовою промисловістю настав час звернути увагу на інші багаті нафтою країни, щоб побачити, чи зможемо ми об'єднатися під одним прапором для монополізації цього стратегічного ресурсу. Звернувшись до [IRQ.GetNameDef], [SAU.GetNameDef] та [VEN.GetNameDef], було одноголосно вирішено, що ми створимо Організацію країн-експортерів нафти."
 PER_foreign_policy_events.2.a:0 "Ми не будемо тиснути на них далі... поки що."
 PER_free_elections:0 "Вільні вибори"
 PER_fund_imperial_excellency_desc:0 "Імперія прийняла шлях демонстрації нашого багатства нашим менш заможним сусідам. Настав час витратити частину його на покращення палацу. Наймання більшої кількості охоронців, схоже, допоможе!"
 PER_idea_reject_foreign_dominance_desc:0 "Незважаючи на загрозливу присутність іноземних держав на наших кордонах, ми не піддамося, ми будемо стояти на своєму і захищати себе до кінця. [ROOT.GetAdjective] суверенітет та ідентичність виживуть, незалежно від ціни»."
 PER_imperial_events.1.a:0 "Ми згодні. Так буде краще."
 PER_imperial_events.12.a:0 "Гаразд, якщо ми мусимо."
 PER_imperial_events.152.a:0 "Вони пошкодують, що не скористалися шансом відступити!"
 PER_imperial_events.160.desc:0 "У міру того, як війна просувалася, ми не змогли досягти наших цілей у встановлений термін. Фактично, ті, на кого ми намагалися вторгнутися, зуміли відкинути нас назад на наші власні землі. Таким чином, ми нещодавно отримали повідомлення від [FROM.GetAdjective] уряду з вимогами припинити воєнні дії. Якщо ми здамося, [PER.GetNameDef] вимагає, щоб ми поступилися їм нашими прикордонними територіями як репарації. Ми могли б продовжувати тиснути, однак ми повинні враховувати наші власні втрати."
 PER_imperial_events.192.a:0 "Це прикро..."
 PER_imperial_events.201.t:0 "[FROM.GetName] підписує Саадабадський пакт"
 PER_imperial_events.232.desc:0 "Після плану відновлення династії Каджарів на троні [PER.GetNameDef] було вирішено, що найкращим результатом для майбутнього нашої країни є вислання сім'ї Пехлеві до [SAF.GetNameDef]. Роблячи це, ми заручимося прихильністю [ENG.GetNameDef], якого ми зможемо переконати надати нам більше автономії в майбутньому."
 PER_industrial_events.1.a:0 "Це схоже на хорошу ділову угоду"
 PER_invite_foreign_investors_desc:0 "Завдяки зверненню до інших демократичних країн світу ми змогли запустити та влити ресурси в нашу економіку, що розвивається."
 PER_irandokht_married:0 "Ірандохт одружена"
 PER_islamic_republic_neutrality:0 "Ісламська республіка Іран"
 PER_jafar_kavian:0 "Джафар Кавіан"
 PER_kurdistan_resistance_idea_desc:0 "[PER.GetNameDefCap] охоплює деякі території, які колись належали курдському народу. Через це існує значна діаспора людей, які незадоволені нашим правлінням. У попередні роки наш уряд зміг придушити низку повстань у цьому регіоні [PER.GetNameDef], але бунтівні настрої зберігаються."
 PER_mahmud_jam:0 "Mahmud Jam"
 PER_oil_baron_desc:0 "Замість того, щоб використовувати нашу нафту для фінансування війни, яку ведуть інші нації по всьому світу, було б краще заощадити її для власного використання. Якщо ми будемо накопичувати нафту в [ROOT.GetNonIdeologyName], то ми зможемо забезпечити її продаж тим, хто її потребує, за завищеною ціною."
 PER_opec:0 "ОПЕК"
 PER_opposition_hq_established:0 "Встановлено базу операцій опозиції."
 PER_organize_protest_in_state:0 "Організувати протест у [FROM.GetName]"
 PER_pahlavis_exiled_flag:0 "Династія Пехлеві вигнана"
 PER_prepare_for_worst_desc:0 "Оскільки ми отримали інформацію про потенційне вторгнення в [PER.GetNameDef], розумно почати робити приготування, якщо станеться найгірше. Хоча ми відчували, що це наближається, ми не можемо дозволити собі підкоритися. Натомість ми повинні нарощувати наші сили, щоб допомогти нашим зусиллям, коли настане час для нашого превентивного удару."
 PER_profit_from_war_tt:0 "Відмикає рішення §Y$PER_profit_from_war_category$§!, яке дозволить [PER.GetNonIdeologyName] надати права на ресурси іншій нації, отримавши при цьому зовнішню фабрику."
 PER_restructure_army:0 "Реструктуризувати армію"
 PER_revive_old_ways:0 "Відродити старі звичаї"
 PER_royal_visit_germany_desc:0 "Протягом правління Рези-шаха ми підтримували добрі стосунки з лідером [GER.GetNameDef]. Це відобразилося в їхньому бажанні прийняти нас із королівським візитом до їхньої країни. Якщо ми погодимося на це, ми, безсумнівно, продовжимо покращувати наші стосунки з [GER.GetNameDef], але ще належить побачити, чи буде це допомогою, чи перешкодою!"
 PER_secularized_state_idea:0 "Секуляризована держава"
 PER_ssb_events.6.t:0 "[FROM.GetNameDefCap] відхиляє."
 PER_the_peoples_airforce:0 "Революційні повітряні сили народу"
 PER_there_can_be_only_one_desc:0 "Хоча ми можемо поділяти багато тих самих цінностей, що й [GER.GetNameDef], стає все очевидніше, що вони вважають себе вищими за всі нації світу. Це образа нашого народу та нашої спадщини, і ми повинні виправити їхні хибні уявлення силою."
 PER_ultra_nationalists_long:0 "Ультранаціоналістичний рух"
 PER_war_elephant_desc:0 "Хоча в Перській імперії минулого вони не були так широко використовувані, ми були відомі тим, що виставляли невелику групу бойових слонів у наших стародавніх завоюваннях. Наші вчені розробили ідею дуже важкого танка, натхненного формою індійського слона, і він, безсумнівно, вселятиме страх у наших ворогів так само, як це робили вони тисячі років тому."
 PHI_american_intervention_change_value_large_decrease_tt:0 "Змінити §Yрівень загрози [USA.GetNameDefCap]§! на §G-25%§!"
 PHI_american_intervention_change_value_large_increase_tt:0 "Змінити §Yрівень загрози [USA.GetNameDefCap]§! на §R15%§!"
 PHI_develop_naval_infrastructure_desc:0 "Оскільки наші морські амбіції зростають, наші можливості суднобудування повинні розширюватися відповідно."
 PHI_generic_fascist_demagogue:0 "Хосе П. Лаурел"
 PHI_hacendado_improved:0 "$PHI_hacendado$"
 PHI_heraclio_alano:0 "Heraclio Alano"
 PHI_increase_sugar_exports:0 "Збільшити експорт цукру"
 PHI_investment_plan_1_tt:0 "Який після завершення надасть 2 §Y$industrial_complex$§!, а також бонуси до ресурсів та будівництва у кожному регіоні з новими залізничними сполученнями, побудованими під час плану."
 PHI_japanese_advisors_desc:0 "Японія досягла неможливого, перетворившись із феодального суспільства на сучасне за абсолютно рекордний час. Хоча це було певний час тому, вони все ще зберігають значний промисловий та військовий досвід, який ми могли б використати завдяки нашим дедалі теплішим відносинам."
 PHI_luce_celler_act_desc:0 "Закон Люса-Селлера — це імміграційний закон у Сполучених Штатах, який збільшив квоту дозволених філіппінських мандрівників і вперше дозволив натуралізацію філіппінців як американських громадян. Це знаменує початок нової ери транстихоокеанської міграції."
 PHI_pedro_abad_santos:0 "Педро Абад Сантос"
 PHI_permanent_usa_naval_bases:0 "Створені постійні [USA.GetAdjective]і військово-морські бази"
 PHI_philippine_american_educational_foundation_desc:0 "Завдяки нашим дуже тісним зв'язкам із [USA.GetNameDef], ми започаткували різні академічні контакти. Ми повинні створити організацію, відповідальну за адміністрування програм обміну стипендіями, спрямованих на сприяння двостороннім дослідженням, культурному взаєморозумінню та вільному обміну ідеями між нашими двома націями."
 PHI_polynesia_tag_war_democratic:0 "$PHI_polynesia_tag_democratic$"
 PHI_request_indefinite_stay_for_macarthur:0 "Запитати безстрокове перебування для МакАртура"
 PHI_resistance_connections:0 "Зв'язки з рухом опору"
 PHI_seized_migrant_property:0 "Seized Migrant Property"
 PHI_self_reliance_defense_desc:0 "Ми були надзвичайно залежними від внесків інших країн у безпеку нашої нації, однак це виявило серйозну стратегічну слабкість. Ми повинні створити власні засоби для самозахисту, і це починається з розвитку промислової бази, здатної підтримувати наші новонароджені сили будь-яким необхідним спорядженням."
 PHI_share_military_experience:0 "Обмінятися військовим досвідом з [?host.GetName]"
 PHI_submarine_supplies_desc:0 "Присутність ворожого флоту значна, що дуже ускладнює отримання підтримки з-за кордону. Ми можемо реквізувати кілька підводних човнів для надання таємної підтримки; на нашому архіпелазі є безліч схованок, а також багато охочих рибалок, здатних перевезти припаси на будь-які острови, де вони потрібні."
 PHI_sugar_barons_tt:0 "§YОдин випадковий генерал§! отримає §G+2§! до навички планування"
 PHI_united_states_army_forces_in_the_far_east:0 "Збройні сили США на Далекому Сході"
 PHI_united_states_asiatic_fleet_desc:0 "Армія Сполучених Штатів — не єдиний військовий орган, зацікавлений у Далекому Сході, флот теж має свої інтереси. Манільська затока є ідеальною базою для розміщення Азійського флоту США та ідеальним центром для розширення його можливостей."
 PHI_war_for_oceania:0 "Війна за Океанію"
 PLAN_VALUE_STILL_PLANNING:0 "Дивізії все ще готуються: $VAL|0+%$"
 PLAYER_AI_PREFS_OPTION3_DESC:0 "Чи буде ШІ намагатися досягти миру у війнах якомога швидше"
 POLITICS_ADVISOR_CP_COST_SHORT:0 "£command_power $VALUE|-0$"
 POL_PEASANT_democratic:0 "Польський селянський союз"
 POL_STATE_66:0 "Дольний Сльонськ"
 POL_STATE_67:0 "Гурний Сльонськ"
 POL_anti_air_equipment_1:0 "Armata plot. 40mm wz. 36 Bofors"
 POL_april_constitution_dem_left:0 "$POL_april_constitution_dem$"
 POL_carrier_1:0 "Клас «Jan Sobieski»"
 POL_committee_of_international_liberation:0 "Комітет міжнародного визволення"
 POL_cruiser_tank_experiments_desc:0 "Маючи основи проєктування танків, ми тепер готові почати торувати свій власний шлях у заплутаній сфері механізованого проєктування."
 POL_cv_nav_bomber_equipment_1_short:0 "Foka Floty"
 POL_dabrowszczacy_desc:0 "Існують міжнародні бригади польських добровольчих сил, які борються за соціалістичні та демократичні рухи в усьому світі, і з соціалістичним урядом, який зараз контролює Польщу, ми можемо заручитися підтримкою польської держави за спиною цих хоробрих добровольців."
 POL_defend_in_west_state:0 "$POL_defend_in_east_state$"
 POL_destroyer_4:0 "Клас «Burza»"
 POL_develop_gdansk_ship_building_desc:0 "Тепер, коли Гданськ знову під нашим контролем, ми можемо надати йому морські інвестиції, яких він так відчайдушно потребує, щоб розпочати будівництво величезного балтійського флоту, якого потребує Польща!"
 POL_diplomatic_mission_to_FIN_desc:0 "Якщо ми хочемо переконати інші держави приєднатися до Міжмор'я, ми мусимо переконати їх, що вони від цього виграють. Надіславши Юзефа Бека на дипломатичні місії, в нас буде більший шанс збудувати оборонний альянс, про який ми так мріємо."
 POL_diplomatic_mission_to_NOR:0 "Дипломатична місія в державу [NOR.GetNameDef]"
 POL_elect_a_PSL_leader:0 "Обрати лідера з ПНП"
 POL_german_staff:0 "Volksdeutscher Selbstschutz"
