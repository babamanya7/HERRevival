 ITA_new_industrialization_program_factories_required_tt:0 "Більш ніж §Y[?ROOT.ITA_new_industrialization_program_factories_required]§! заводів під контролем (наразі §[GetColorControlledFactoriesForNewIndustrializationProgram][?ROOT.num_of_controlled_factories]§!)"
