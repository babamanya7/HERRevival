 CHI_integrate_the_army:0 "Інтегрувати [From.GetAdjective]у армію"
 CHI_joining_the_international_community:0 "Міжнародна спільнота"
 CHI_joining_the_international_community_desc:0 "Занадто довго ми дивилися всередину себе, що лише давало іншим можливість експлуатувати нас. Тепер ми повинні вийти у світ і приєднатися до тих, хто прагне свободи, до тих, хто підтримав нас у найважчу хвилину!"
 CHI_know_thy_enemy_desc:0 "Ми повинні знати, як знаходити точки у ворожих лініях, де ми можемо застосувати силу та використати прориви."
 CHI_light_tank_artillery_equipment_2:0 "PLZ 36"
 CHI_local_arms_production_desc:0 "Поки світ вважає нас лише одним із дрібних угруповань у цій війні, ми не можемо покладатися на допомогу ззовні. Нам слід зайнятися будівництвом арсеналів та самостійним виробництвом зброї."
 CHI_long_term_economic_planning_desc:0 "Наш бюрократичний апарат куди скромніший за центральний уряд. Це дозволяє нам уникнути безлічі формальностей, що стоять на шляху економічного розвитку, і досягати значних успіхів дуже скромними зусиллями."
 CHI_militarize_desc:0 "Наше населення стало байдужим до свого місця в історії, і його потрібно пробудити. Ми змусимо їх відчути запал революції та підготуємо їх до знищення ворогів, як внутрішніх, так і іноземних."
 CHI_negotiate_the_nine_powers_treaty:0 "Переглянути Договір дев'яти держав"
 CHI_preempt_the_inevitable_desc:0 "Ми знаємо, що [JAP.GetNameDef] наближається до нас, вважаючи нас слабкими й готовими до захоплення. Можна уявити їхнє здивування, якби ми завдали удару першими."
 CHI_prepare_for_a_change_in_leadership_dai_li:0 "§R[CHI_chiang_kaishek.GetName] буде замінений під час Сіаньського інциденту на [CHI_dai_li.GetName]§!"
 CHI_prepare_the_war_zones_desc:0 "Нам потрібно реорганізувати наші армії за регіональним принципом, щоб знати, хто несе відповідальність за яку територію. Це дозволить нам спланувати відповідні операції для даного району та максимізувати нашу здатність до прориву."
