 RULE_ALLOW_LEND_LEASE_SAME_FACTION_DESC:0 "Держави можуть постачати озброєння за ленд-лізом лише державам в одному альянсі."
 RULE_DEMOCRATIC_ARG_AI_DESC:0 "ШІ намагатиметься перетворити країну на демократичну та приєднається до Союзників, щоби захистити демократію та свободу в Південній Америці."
