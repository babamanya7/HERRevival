 AST_medium_tank_equipment_1:0 "M3 Grant"
 AST_nationalizing_process_tt:0 "Розблоковує рішення §YПочати націоналізацію§!, застосовуючи §YНаціоналізація триває§!. Необхідно для фокусів нижче та видаляється після завершення §YНародна Австралія§!. §RНевибрані фокуси тоді будуть заблоковані!§!"
 AST_neutrality_party_long:0 "Аграрна партія Австралії"
 AST_organize_in_nation_desc:0 "Робітничий рух не знає кордонів. Спрямовуючи ресурси в мережі наших товаришів, ми можемо впровадити комуністичних організаторів у профспілки [FROM.GetName], створюючи низову підтримку революції зсередини робітничого класу."
 AST_out_of_the_den:0 "Вихід із лігва"
 AST_political_events.2.t:0 "Успішний референдум"
 AST_protect_overseas_commerce_desc:0 "Острівна держава покладається на ресурси, що доставляють з інших країн морем. Захист конвоїв та торгових шляхів — не просто стратегія, а життєва необхідність."
 AST_public_works_desc:0 "Велика депресія залишила австралійську економіку у важкому стані. Ми започаткуємо низку програм громадських робіт, щоб повернути людей на роботу та відновити споживчі витрати."
 AST_rocket_artillery_equipment_2:0 "RP-3 High Explosive/Semi Armor-Piercing"
 AST_seize_civilian_industry:0 "Конфіскувати цивільну промисловість"
 AST_seize_local_leadership_in_state_major:0 "Захопити місцеве керівництво у штаті [FROM.GetName]"
 AST_specialize_on_desert_combat:0 "Спеціалізація на бою в пустелі"
 AST_specialize_on_jungle_combat:0 "Спеціалізація на бою в джунглях"
 AST_standing_with_canberra_state_modifier:0 "Підтримка Канберри"
 AST_support_weapons:0 "Vickers MG & Stokes mortar"
 AST_tac_bomber_equipment_3_short:0 "Baltimore"
 AST_the_irish_anti-britain_pact_desc:0 "Британія надто довго залишалася оплотом капіталізму, захищена своїм острівним становищем і морською міццю. Провокуючи заворушення серед докерів Ірландії та Північної Ірландії, ми можемо прорвати її оборону і відкрити шлях через Ірландське море для наших сил."
 AST_the_ultimate_overseas_duty_desc:0 "Прем'єр-міністр Британії настільки погано виконував свої обов'язки, що серед його власних міністрів поширилася недовіра. Мензіс справив неймовірно сильне враження під час своїх візитів на засідання Британського воєнного кабінету, і тепер дехто припускає, що він цілком може бути кращим варіантом для Британії. З ним на чолі Співдружності ми зможемо використати лояльність Мензіса до Австралії щоб підвищити свій авторитет."
 AST_union_control_2_foreign_cat:0 "Придушення комунізму"
 AST_vichy_out_of_africa_cat:0 "Віші, геть з Африки!"
 AST_vickers-ruwolt_organization:0 "Vickers-Ruwolt"
 AST_walls_like_uluru_desc:0 "Австралія — це континент сам по собі. Якщо ми збираємося стояти без щита Імперії, ми повинні створити свій власний. Берегова лінія буде укріплена, порти захищені, а підступи зроблені небезпечними для будь-кого, хто вважає цю націю легкою здобиччю."
 AST_war_angst_cat:0 "Страх війни"
 AST_wool_agreement:0 "Вовняна угода"
 AST_workers_educational_association_desc:0 "Робітнича освітня асоціація — це міжнародна організація, що займається забезпеченням доступності освіти для робітників. Ми маємо створити власне відділення, адже справжня рівність можливостей починається в класі."
 AT_LEAST_70_OIL:0 "§YКожен член альянсу§! із принаймні 70 од. нафти:"
 AUS_STATE_83:0 "Крайшгебіт"
 AUS_VICTORY_POINTS_9692:0 "Пресбург"
 AUS_abolished_austrofascism:0 "Австрофашизм ліквідовано"
 AUS_annexing_the_lands_of_old_decision_tt:0 "[GetAnnexOrIntegrateDecision] §Y[FROM.OWNER.GetNameDef]§!"
 AUS_ansaldo_organization:0 "Ansaldo"
 AUS_approach_democratic_guarantors_tt:0 "§YЕфекти до нашої країни, якщо вони погодяться:§!"
 AUS_architechtual_advancements_desc:0 "Нещодавно нам повідомили про присутність одного надзвичайно кваліфікованого архітектора в одному з наших університетів. Його будівлі володіють як структурною цілісністю, так і елегантністю, яких заслуговує така країна, як наша. Ми повинні розглянути можливість найму цієї особи."
 AUS_artillery_equipment_1_short:0 "7,5 cm M. 15"
 AUS_austrian_aggression:0 "Австрійська агресія"
 AUS_bring_phonix_insurance_from_the_ashes:0 "Реінкарнація страхувань Phönix"
 AUS_cut_ties_with_the_church_desc:0 "Наш державний зв'язок із церквою — не більше ніж пережиток так званого клерикального фашизму. Фашизм уже усунено від політичної влади, тепер час духовенства."
 AUS_diplomatic_effort_tt:0 "З §Yпоступовим Розширенням нашої Федерації§! ми будемо дипломатичними зусиллями §Yполіпшувати відносини з іншими членами§!."
 AUS_elizabeth:0 "Елізабет..?"
 AUS_ernst_hammer:0 "Ернст Гаммер"
 AUS_extend_the_traun_line_tt:0 "Буде збудовано 3-ій рівень §YНаземних укріплень§! уздовж німецького кордону від Зальцбургу до Іннсбруку в провінціях, де для цих є місце."
 AUS_federal_state_ADJ:0 "Австрійськ"
 AUS_heeding_the_call_of_duty:0 "Поклик Батьківщини"
 AUS_invite_spanish_refugees:0 "Запросити іспанських націоналістів"
 AUS_inviting_the_observers_desc:0 "У міру зростання нашої фракції стає все більш очевидним, що ми можемо стати силою, з якою потрібно рахуватися в Європі. Дунай відіграє важливу роль не лише для країн, через які він протікає, а й для тих, які покладаються на нього для торгівлі й зв'язку. Ми повинні розглянути можливість запросити ці країни до нашої Федерації."
 AUS_join_the_axis:0 "Сила в кількості"
 AUS_legitimistische_studentenverbindung:0 "Легітимістське студентське товариство"
 AUS_marianne_pollak:0 "Маріанне Поллак"
 AUS_pardon_political_exiles:0 "Помилування політичних засланців"
 AUS_peoples_army_desc:0 "Згуртування мас призвело до сильної присутності міліції (ополчення) в країні. Ополченці завичай погано навчені та бідно оснащені для швидкого розгуртовування. В результаті також пожвавився набір до регулярної армії."
 AUS_political_events.10.a:0 "Прокляття! Цього варто було від них очікувати!"
 AUS_political_events.104.t:0 "[GER.GetAdjective]ий біженець?"
 AUS_political_events.111.desc:0 "До нас дійшло заспокійливе повідомлення від [FROM.GetAdjective]ого керівництва. В якомусь сенсі «заспокійливе». Вони вимагають, щоб ми підписали взаємну угоду про мир і ненапад між нашими країнами. Вони визнають, що в минулому ми мали неабияку частку труднощів, проте зараз вони бачать в майбутньому більш конструктивний діалог між нами."
 AUS_political_events.111.t:0 "[FROM.GetNameDefCap] пропонує пакт про ненапад"
 AUS_political_events.118.c.tt:0 "Держава §Y[FROM.FROM.GetNameDefCap]§! буде примушена вступити в §Y[ROOT.GetAdjective]ий альянс§!"
 AUS_political_events.22.a:0 "Не те, чого ми просили, але краще, ніж нічого."
 AUS_political_events.62.a:0 "Як вони сміють?"
 AUS_political_events.7.desc:0 "[FROM.GetNameDefCap] та їхні політики досить добре відреагували на нашу нещодавню пропозицію співпраці у розбудові наших повітряних сил. Хоча вони не можуть запропонувати жодної матеріальної підтримки, вони погодилися поділитися деякими зі своїх нещодавніх методів навчання пілотів."
 AUS_political_events.70.b:0 "Наша відповідь залишається актуальною. Ні."
 AUS_political_events.71.desc:0 "Наші зусилля переконати лідера [FROM.GetAdjective], [FROM.GetLeader], окупилися. Ми повинні будемо підтримати будівництво двох заводів для них, і хоча це, швидше за все, завадить нашим власним промисловим зусиллям, тепер ми можемо спокійно видихнути, знаючи, що за нашими спинами є той, хто допоможе нам захистити нашу незалежність."
 AUS_political_events.73.b:0 "Ні, договір залишається таким самим."
 AUS_political_events.82.a:0 "Тост за наших братів!"
 AUS_political_events.83.t:0 "[FROM.GetNameDefCap] схвалює наші політичні зміни"
 AUS_promote_admirals_tt:0 "Відкриває §YЙоганна Ліхтенштайнського§! (3-го рівня) і §YКарла Гайнца Бірнбахера§! (2-го рівня) в якості адміралів"
 AUS_protector_of_the_danube_tt:0 "Відкриває сукупність рішень для §YПропонування об’єднання у федеративну державу§! і §Yперехилення членів на нашу сторону§!\n\n§RВеликі держави навряд чи приймуть цю пропонову, якщо тільки вони не суттєво ослаблені або [AUS.GetNameDef] є значно більшою силою!§!"
 AUS_rearmament_and_guarantees_tt:0 "§RПорушення волі гарантів може призвести до дипломатичних наслідків, від простого зниження думки до відкликання гарантій!§!"
 AUS_rebellious_rearmament_desc:0 "Занадто довго [AUS.GetNameDef] була пов’язана глибоко несправедливим і ганебним Сен-Жерменським Договіром, яким була загнана в куток. Відновивши монархію, ми вже певною мірою порушуємо договір, тож для нас також не повинно бути причин дотримуватися решти його пунктів. Пора остаточно скасувати цей згубний договір!"
 AUS_rejected_air_force_partnership:0 "Партнерство ВПС відхилено"
 AUS_seek_international_partners_tt:0 "§YЕфекти для будь-якої країни, яка погодиться!§!:"
 AUS_subjugate_lands_of_old:0 "Підпорядкувати старі землі"
 AUS_suddeutschland_fascism_ADJ:0 "Південнонімецьк"
 AUTONOMY_PROGRESS_PREV_DESC:0 "Держава $OWNER|UH$ має $CURRENT|H0$ балів, тож вона не може бути знижена до статусу $PREVLEVEL|H$"
 AUTONOMY_RELATION_DESC2:0 "$SUBJECT|UH$ — $LEVEL|lH$ іноземної держави"
 AUTO_COMPLETE_FOCUS_HEADER:0 "Пропущено, оскільки:\n"
 Aulon:0 "Авлон"
 BAH_communism:0 "Багамська комуна"
 BALTIC_allied_shipments:0 "Збільшити постачання від Союзників"
 BALTIC_arms_industry_desc:0 "Тепер, коли модернізація нашої промисловості завершена і в країні діє безліч військових заводів, [Root.GetAdjective] збройове виробництво розкриє свій дійсний потенціал!"
 BALTIC_belarus_ssr:0 "[Root.GetNonIdeologyAdjective]о-білоруська РСР"
 BALTIC_british_aircraft_desc:0 "[GetBritAircraftManufDesc]"
 BALTIC_forest_brothers_idea:0 "Лісові брати"
 BALTIC_rebuild_forts_desc:0 "Під час визвольних війн місто [Root.Capital.GetName] було не стільки поселенням, скільки фортецею. Хоча його зміцнення давно розібрані та забуті, їх потрібно відбудувати заново і підтримувати у стані готовності до війни."
 BALTIC_restore_workers_republic:0 "Відновити робітничу республіку"
 BALTIC_seek_support_of_soviets_desc:0 "Хоча Червона армія і розтрощила державу [Root.GetNameDef] і привела нашу націю в нову еру російського імперіалізму, у нас немає шансів принести в державу [Root.GetNameDef] соціалізм без допомоги радянців."
 BAR_DEF:0 "Баротселенд"
 BAR_communism_DEF:0 "Народні незалежні комуни Баротселенду"
 BAR_fascism_ADJ:0 "Баротсейськ"
 BAS_democratic_ADJ:0 "Британо-антильськ"
 BAY_DEF:0 "Баварія"
 BBA_african_union_events.4.t:0 "Членство в [ETH_GetCentralBankName]"
 BBA_ethiopia_anti_colonialism_events.6.a:0 "Іще одну країну звільнено від імперіалістів."
 BBA_ethiopia_anti_colonialism_events.6.desc:0 "Після сильного дипломатичного тиску з боку [ROOT.GetName], включаючи прямі зустрічі між лідерами [ROOT.GetLeader] та [?global.african_colonial_country.GetLeader], [?global.african_colonial_country.GetAdjective]ий уряд вирішив відступити та визнати [?global.african_revolt_country.GetAdjective]у незалежність.\nЗавдяки прямому втручанню [ROOT.GetAdjective]их сил війна за [?global.african_revolt_country.GetAdjective]у незалежність нарешті завершена. [?global.african_revolt_country.GetNameDefCap] — вільна країна, а [ROOT.GetLeader] певно назавжди залишиться героєм у державі [?global.african_revolt_country.GetNameDef]."
 BBA_ethiopia_balance_of_power_events.10.b:0 "Знищити їх."
 BBA_ethiopia_balance_of_power_events.26.a:0 "Меритократія в армії має важливе значення."
 BBA_ethiopia_communist_events.10.desc:0 "[SOV.GetName] відмовилися надсилати нам стрілецьке озброєння. Попри зусилля нашої делегації в [SOV.capital.GetCapitalVictoryPointName], схоже, вони надто зайняті власними справами, щоб допомогти нам."
 BBA_ethiopia_communist_events.18.t:0 "[SOV.GetNameDefCap] відмовляється надсилати бронетехніку"
 BBA_ethiopia_communist_events.25.t:0 "[ETH.GetNameDefCap] просить про посередництво"
 BBA_ethiopia_communist_events.32.desc:0 "[ITA.GetAdjective]ий уряд відмовився брати участь у перемир’ї. Схоже, вони мають намір повністю знищити [ETH.GetNameDefCap]. Тепер народ дізнається, що з фашистами неможливо домовитися і що наша свобода залежить від того, наскільки ми зможемо подвоїти свої зусилля."
 BBA_ethiopia_communist_events.33.desc:0 "Під час нашого конфлікту з [ITA.GetAdjective]ою нацією нам вдалося звільнити Еритрею від фашистів. Тепер ми маємо можливість надати народу регіону незалежність. Проте [ITA.GetAdjective]и, без сумніву, розлютяться через цей крок, що може дестабілізувати наш крихкий мир із ними."
 BBA_ethiopia_communist_events.47.b:0 "У нас немає вибору, як погодитися."
 BBA_ethiopia_communist_events.48.a:0 "Ми не віддамо наші землі."
 BBA_ethiopia_communist_events.54.t:0 "Таємна допомога від [JAP.GetNameDef]"
 BBA_ethiopia_exile_events.05.t:0 "$RAJ_orde_wingate$ перекинутий до Бірми"
 BBA_ethiopia_exile_events.10.c:0 "Ці вимоги заходять занадто далеко"
 BBA_ethiopia_exile_events.22.c:0 "[543.GetName] — це острів, я так розумію?"
 BBA_ethiopia_exile_events.22.d:0 "Вони можуть мати [?ETH.japanese_island.GetName]."
 BBA_ethiopia_exile_events.22.t:0 "[ROOT.GetLeader] обіцяє [FROM.GetLeader] острів"
 BBA_ethiopia_exile_events.40.b:0 "[ITA.GetLeader] повинен щось запропонувати"
 BBA_ethiopia_exile_events.56.desc:0 "Ми бачимо, що багато [?ETH.host_nation.GetAdjective]их пілотів відгукнулися на заклик допомогти нам у майбутньому звільненні нашої Батьківщини. Вони принесли з собою багатий досвід, яким вони зараз діляться з нашими майбутніми пілотами."
 BBA_ethiopia_fascist_events.01.b:0 "Нехай їде $ETH_hailu_tekle_haymanot$ із $gojjam_RU_Gen$."
 BBA_ethiopia_fascist_events.06.desc:0 "На жаль, [FROM.GetLeader], схоже, зациклився на завоюванні всієї Ефіопії. [FROM.GetNameDefCap] категорично відмовляється обговорювати будь-який мирний договір, фактично вбиваючи всі спроби знайти мирне вирішення конфлікту. Наша єдина надія зараз — згуртуватися навколо імператора та спробувати досягти військової перемоги."
 BBA_ethiopia_fascist_events.10.desc:0 "Після капітуляції ворожих сил до наших рук потрапило кілька високопоставлених офіцерів. Наразі вони перебувають у в'язниці, але ми сподіваємося, що декого з них вдасться переконати приєднатися до нашої справи пізніше."
 BBA_ethiopia_fascist_events.20.a:0 "Їх треба провчити."
 BBA_ethiopia_fascist_events.51.t:0 "[FROM.GetName] приймає [ETH.GetAdjective]ий контроль над Сомалілендом"
 BBA_ethiopia_fascist_events.57.b:0 "Ми не можемо ризикувати, що наші розробки потраплять до ворога."
 BBA_ethiopia_fascist_events.58.a:0 "Великий день для [ETH.GetName]"
 BBA_ethiopia_fascist_events.61.b:0 "Ми не станемо допомагати можливому ворогу."
 BBA_ethiopia_imperial_events.10.b:0 "Не дозволимо нам погрожувати."
 BBA_ethiopia_imperial_events.21.desc:0 "Наші війська продовжують прориватися крізь [ETH.GetAdjective]і сили, звільняючи місце для нашого панування. Однак, ми спостерігаємо зростання активності опору в наших нових володіннях. Здається, слова колишнього правителя, $ETH_haile_selassie$, під час виступу в Лізі Націй, розбурхали багатьох наших нових підданих до нестями. Здається, що поки їхній імператор живий, опір буде сіллю в оці нашої колоніальної адміністрації."
 BBA_ethiopia_imperial_events.5.t:0 "Держава [FROM.GetNameDef] прийняла наш запит"
 BBA_italo_ethiopian_war_events.102.desc:0 "На жаль, [FROM.GetAdjective]ий уряд не наважується засмутити [ITA.GetLeader]. Вони відхилили наш запит створити в них тимчасовий уряд, якщо [ETH.GetName] впаде."
 BBA_italo_ethiopian_war_events.113.a:0 "Тільки якщо сила — це єдина мова, яку вони розуміють."
 BBA_italo_ethiopian_war_events.120.t:0 "Проблема в державі [FROM.GetName]"
 BBA_italo_ethiopian_war_events.20.a:0 "Боротьба продовжується"
 BBA_italo_ethiopian_war_events.401.t:0 "Ультиматум від держави [FROM.GetName]"
 BBA_italy_anti_colonialism_events.01.a:0 "Ми повинні припинити цей фарс негайно!"
 BBA_italy_anti_colonialism_events.01.c:0 "Ми повинні інтегрувати ефіопські території."
 BBA_italy_anti_colonialism_events.06.t:0 "[FROM.GetAdjective]а інтеграція в державу [ROOT.GetNameDef]"
 BBA_italy_communist_events.08.desc:0 "Дурний [FROM.GetAdjective]их уряд занадто недалекоглядний, щоб бачити, що для них краще! Разом нам було б легше стримати капіталізм і фашизм, але ми все одно досягнемо успіху!"
 BBA_italy_decide_the_fate_of_mussolini.2.desc:0 "Ось-ось розпочнеться судовий процес століття, на якому Беніто Муссоліні звинувачують за численними пунктами звинувачень, серед іншого, у корупції та державній зраді. Судовий процес — це лише театр для публіки, щоб надати йому видимість легітимності. Насправді ж результат у наших руках."
 BBA_italy_democratic_events.01.desc:0 "Тепер, коли наші нещодавні випробування залишилися позаду, настав час зібратися разом і об'єднатися, залікувати наші рани та розпочати довгий шлях до відновлення. Наша демократія все ще молода і крихка, тому ми потребуємо сильної, але лагідної руки, яка б вела нас вперед."
 BBA_italy_human_torpedo_raid.1.desc:0 "Італійцям вдалося обійти захист нашої гавані в [?ITA.ITA_raided_state_var.GetName] і проникнути на морську базу на дуже малих суднах, щоб здійснити напад на наші кораблі, що стояли там у доках. Хоча рейд не потопив жодного з кораблів, йому вдалося пошкодити їх, що займе деякий час на ремонт."
 BBA_italy_interaction_events.17.t:0 "[ITA.GetName] передає регіон [45.GetName] в руки [HUN.GetName]"
 BBA_italy_interaction_events.19.t:0 "[GRE.GetNameDef] Приймає нашу пропозицію"
 BBA_italy_interaction_events.20.desc:0 "Грецькі зрадники відкинули нашу пропозицію продати їм острови в обмін на союз. Це свідчить лише про некомпетентність і слабкість їхніх урядів."
 BBA_italy_interaction_events.20.t:0 "[GRE.GetNameDef] невдячно відхилила нашу пропозицію"
 BBA_italy_interaction_events.22.t:0 "[TUR.GetNameDef] приймає нашу пропозицію"
 BBA_italy_interaction_events.8.a:0 "Нехай забирають."
 BBA_italy_missiolinis.101.a:0 "Слава Італії!"
 BBA_italy_missiolinis.103.desc:0 "Муссоліні з піднесенням оголосив, що наші війська здобули перемогу Албанії, перед захопленим натовпом. Він продовжив тим, що вся країна опинилася в нашій хватці та як це приведе Італію до подальших величі та слави. Дні старих імперій спливають, а дні Італії — ще попереду, виголосив він."
 BBA_italy_missiolinis.111.t:0 "Завоювання Далмації"
 BBA_italy_missiolinis.12.t:0 "Війна триває"
 BBA_italy_missiolinis.203.desc:0 "У нещодавній промові, зверненій до політичного кабінету, Муссоліні сказав, що лише найвидатніші уми Італії придатні служити в ньому. Потім він похвалився, що доклав усіх зусиль, щоб знайти потрібних людей для посилення кабінету міністрів, і що його сила духу слугуватиме Італії в довгостроковій перспективі."
 BBA_italy_missiolinis.23.a:0 "Італія править переможно."
 BBA_italy_missiolinis.82.t:0 "Незадовільний технологічний прогрес"
 BBA_italy_naval_cooperation_programs.09.a:0 "Хороша угода!"
 BBA_italy_naval_cooperation_programs.16.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 BBA_swiss_expansion.15.t:0 "[FROM.GetName] Намагаться налаштувати [AUS.GetName] проти нас!"
 BBA_swiss_expansion.9.b:0 "Це ціна, яку ми не готові платити!"
 BBA_switzerland.12.a:0 "Він буде помилуваний"
 BBA_switzerland.24.t:0 "[?SWI.SWI_angriest_country.GetNameDefCap] вважає, що ми порушили нейтралітет"
 BBA_switzerland_fascist.3.a:0 "Це справедливо — це їхня земля"
 BBA_switzerland_trade.10.t:0 "[FROM.GetNameDefCap] відмовляється від нашої банківської системи"
 BBA_switzerland_trade.13.a:0 "Ми маємо допомогти їм стримати фашизм"
 BBA_switzerland_trade.14.desc:0 "Ці інвестиції допоможуть покращити нашу економіку та дозволять протистояти труднощам, які фашизм може принести [ROOT.GetName]. Вони також зблизять наші країни, можливо, навіть у спільному опорі фашизму в майбутньому."
 BBA_switzerland_trade.6.desc:0 "Наша делегація повернулася з [FROM.GetName] з чудовими новинами. Ця торговельна угода дозволить нам забезпечити необхідні ресурси для підтримки нашої промисловості та населення. \n\nІнші країни можуть вважати це порушенням нейтралітету, але для [ROOT.GetName] — це лише ціна збереження незалежності у ці непевні часи."
 BEG_communism:0 "Соціалістичний союз фунджійських і гумузських народів"
 BEG_democratic_DEF:0 "Республіка Бенішангул-Гумуз"
 BEL_auguste_piccard:0 "Огюст Піккар"
 BEL_austrian_resistance_active_state_dynamic_modifier:0 "Австрійський фронт свободи"
