 SOV_clandestine_cells:0 "Підпільні осередки"
 SOV_clandestine_cells_desc:0 "Сталіністи всюди бачать руйнівників, шпигунів і диверсантів. Вони робили це так довго, що більшість людей вже не вірить їм, коли вони називають вовка вовком. Ми можемо використати це для створення осередків на великих промислових підприємствах для здійснення диверсійних актів у випадку, якщо Сталін буде протистояти нашому захопленню."
 SOV_comecon_joint_military_program_desc:0 "Ми розвинемо спільну військову програму з нашими партнерами для поліпшення їхніх навчальних можливостей."
 SOV_common_economic_space_desc:0 "Програма технологічного співробітництва країн Ради економічної взаємодопомоги та допомоги його відстаючим учасникам."
 SOV_covert_support_for_spanish_poum_desc:0 "В Іспанії повним ходом іде контрреволюція. Фашисти та реакційні сили підтримують іспанських націоналістів. Хоча іспанські республіканці мають достатньо завзяття, це, на жаль, не замінить зброї та боєприпасів, а також не замінить добре розвиненої політичної свідомості. Ми можемо забезпечити все це."
 SOV_cv_nav_bomber_equipment_3:0 "Іл-6 палубний"
 SOV_expand_shipbuilding_plants_tt:0 "Додати §Y1 комірку для будівництва§! й §Y1 верф§! у кожній області, де морську базу було розширено в межах попередніх фокусів."
