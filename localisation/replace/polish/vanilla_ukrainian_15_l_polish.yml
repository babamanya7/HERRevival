 USA_currently_demanding_monroe_adherence_flag:0 "[ROOT.GetNameDefCap] зараз вимагає від країни дотримання Доктрини Монро."
 USA_edward_curtis_wells:0 "Едвард Кертіс Уеллс"
 USA_execute_war_plan_ruby:0 "Виконати воєнний план «Рубіновий»"
 USA_fair_labour_standards_act_desc:0 "Наша економіка повільно, але вірно відновлюється, і ми мусимо зробити так, щоб робітники стали учасниками цього процесу. Необхідно заборонити такі експлуататорські методи, як неоплачуваний понаднормовий час, і встановити мінімальний розмір оплати праці."
