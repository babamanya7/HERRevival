 PRC_anti_japanese_expedition_desc:0 "Вступати з японцями у відкрите протистояння у поточній ситуації буде безглуздо. Спочатку потрібно приготувати плацдарми, відправивши невеликі групи на територію ворога. Коли настане слушний момент, ми влаштуємо повстання."
