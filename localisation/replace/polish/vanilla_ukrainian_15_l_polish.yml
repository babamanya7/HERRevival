 COG_invest_in_urban_centers_desc:0 "Наша країна велика, а людей багато. Однак, грошей недостатньо для всіх, і якщо ми інвестуватимемо куди-небудь, сільські райони залишаться без уваги. Однак це не завадить нам інвестувати в два найбільші міста — Леопольдвіль та Елісабетвіль."
