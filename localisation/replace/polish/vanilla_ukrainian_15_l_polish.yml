 MEX_focus_engineering_school_desc:0 "Escuela Superior de Ingenería Mecánica y Eléctrica, що є частиною Національного політехнічного інституту в Мехіко, навчає нове покоління піонерів у галузі машинобудування та електроніки."
 MEX_focus_exile_calles_desc:0 "Колишній президент Плутарко Кальєс відбував свій термін між 1924 і 1928 роками. Його неправильне правління спровокувало Війну крістерос та незліченну кількість дрібних повстань. Тепер він прагне домінувати над президентом Карденасом, як він контролював кількох останніх маріонеткових президентів. Карденас має власний демократичний мандат, власний план на майбутнє, а Кальєс має піти заради стабільності Мексики."
 MEX_focus_falangist_veterans_desc:0 "Фалангісти — організація фашистських воєнізованих формувань в Іспанії. Вони борються за Бога і Націю, хоча багато з них монархісти, що прикро. Тим не менше, ми повинні налагодити контакти з фалангістськими ветеранами громадянської війни в Іспанії та вчитися на їхньому досвіді."
 MEX_focus_hispanic_culture_desc:0 "Народи Латинської Америки мають сильну культуру, сформовану із завоювань і виживання, повстання та твердого правління. Наша спільна культура є джерелом гордості та дороговказом для нашого майбутнього прогресу."
 MEX_focus_international_peacekeepers:0 "Міжнародні миротворці"
 MEX_focus_purge_the_bureaucracy:0 "Чистки в рядах бюрократів"
 MEX_idea_vanguard_of_the_4th_international_desc:0 "Наша революція стала вітром змін, що надихає робітників усього світу на подвиги. 4-й Інтернаціонал звільнить людство від ланцюгів фашистської, буржуазної та бонапартистської реакції."
 MEX_infantry_equipment_3:0 "Mendoza RM2"
 MEX_othon_blanco:0 "Отон П. Бланко Нуньєс де Касерес"
 MEX_plutarco_e_calles:0 "Плутарко Е. Кальєс"
 MEX_social_catholicism_desc:0 "Промислова революція поставила робітників у нелюдські умови. Щоби протистояти вимогам соціалістів, був зроблений особливий наголос на необхідності керуючим показувати співчуття до працівників. Це дало початок свого роду нереволюційному християнському соціалізму — соціал-католицизму."
