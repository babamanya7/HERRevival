 LIT_exploit_the_international_bank_desc:0 "Будучи учасником Міжнародного банку, Антанас Смєтона може використати банківський сектор на користь державі. З огляду на те, що насувається війна, хіба у нас є інший варіант?"
 LIT_iron_wolf_appeasement:0 "Відкласти повстання «Залізного вовка»"
 LIT_join_the_allies_desc:0 "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LIT_lithuanian_rail_desc:0 "Якщо ми хочемо по-справжньому об'єднати Польщу та Литву, пересування між країнами цього союзу має бути простим. Об'єднавши наші залізниці, ми помітно поліпшимо свої канали постачання та підвищимо промисловий потенціал."
 LIT_merge_civilian_industries:0 "Об'єднати громадянські промисловості"
 LIT_monarchy_events.101.desc:0 "Незважаючи на всі наші зусилля досягти мирного рішення, [From.GetLeader] відмовляється від близьких відносин з нашою нацією, стверджуючи, що «у державі [From.GetNonIdeologyName] є лише один король». Схоже, [From.GetNameDef] тепер неминуче воюватиме з нами."
 LIT_monarchy_events.2_tt:0 "§YМіндаугас III§! стає королем держави [Root.GetNonIdeologyName]. §Y[Root.GetLeader]§! при цьому залишається лідером партії [Root.GetRulingParty]."
 LIT_purge_resistance_idea_desc:0 "За допомогою серії рейдів і пропаганди ця нація очищає весь народний ідеологічний опір режиму."
 LIT_state_media_desc:0 "Газети надто часто напхані фашистською та комуністичною пропагандою. Населенню слід пропонувати лише схвалені державою публікації — єдине надійне джерело істини."
