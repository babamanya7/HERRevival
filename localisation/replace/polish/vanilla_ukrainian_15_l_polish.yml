 SEA_PHI_political_events.11.desc:0 "На жаль, [FROM.GetNameDef] відмовився надати нам [PHI_GetTradedEquipment] в обмін на деякі з наших суден."
 SEA_PHI_political_events.5.a:0 "Ми знайдемо когось іншого, у кого купувати ресурси"
 SEA_PHI_political_events.59.desc:0 "Хоча [USA.GetNameDef] розпочали військову інтервенцію проти [PHI.GetNameDef] з метою повалення нового уряду, цей план не мав успіху. Оскільки обидві сторони визнали, що війна лише затягується, розпочалися переговори про її завершення, і [PHI.GetAdjective]а незалежність тепер визнана."
