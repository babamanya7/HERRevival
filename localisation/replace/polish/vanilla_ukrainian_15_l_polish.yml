 PRC_hundred_regiments_offensive:0 "Битва ста полків"
 PRC_indirect_fire_desc:0 "Ми зосередимося на створенні вдосконалених артилерійських сил, орієнтованих на ведення вогню по ворогу із закритих позицій."
