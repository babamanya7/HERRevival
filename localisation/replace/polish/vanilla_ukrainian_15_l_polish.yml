 SWE_fighter_equipment_0_short:0 "ASJA SA-14"
 SWE_finlands_cause_is_ours_desc:0 "[SOV.GetAdjective]а агресія, спрямована на [FIN.GetName], колись неминуче буде спрямована проти нас. Замість того, щоб залишатися осторонь поточного конфлікту, ми повинні приєднатися до фінів у відсічі старій загрозі."
 SWE_folkhemmet:0 "Folkhemmet"
 SWE_ga_pa_tactics_desc:0 "Колись [SWE.GetName] був піонером у використанні високомобільних сил на полі бою, задовго до появи танків. Настав час відродити інноваційний дух і розробити власну форму бліцкригу."
 SWE_generic_democratic_reformer:0 "$SWE_tage_erlander$"
 SWE_hungershield_instant_desc:0 "Якщо стабільність упаде нижче §Y68%§!, є ризик спалахування страйків або бунтів.\n§YБуде видалено, якщо щось із цього буде виконано:§!\n- Має більш ніж §Y45§! цивільних заводів (з урахуванням торгівлі)\n- Споруджено більш ніж §Y14§! цивільних заводів (без урахування торгівлі)\nПри видаленні буде отримано §G120§! од. §Yполітичної влади§!."
