 SOV_brilliant_genius:0 "Блискучий геній"
 SOV_build_national_academy_of_sciences_integrated_republic_KYR:0 "Збудувати [KYR.GetAdjective]у $SOV_build_national_academy_of_sciences_integrated_republic_default$"
