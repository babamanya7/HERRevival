 ARG_political_events.4.t:0 "[USA.GetName] накладає на нас ембарго"
 ARG_political_events.61.desc:0 "[FROM.GetNameDefCap] люб'язно вирішила прийняти нашу пропозицію приєднатися до нашого союзу, і тепер ми стоїмо разом у літописах історії."
 ARG_political_events.80.c:0 "Фінансувати дослідження синтетики."
 ARG_preparation_for_the_elections:0 "Підготовка до виборів"
 ARG_reach_out_to_the_soviet_union_tt:0 "Узяття цього фокусу відімкне шаблон дивізії §YVanguardia Socialista§!, коли спалахне §Yгромадянська війна§!, і набере §Yп'ять§! підрозділів Vanguardia Socialista у §Y[955.GetName]§!."
 ARG_siam_di_tella:0 "SIAM Di Tella"
 ARG_soviet_industrial_model_desc:0 "Після революції в Росії [SOU.GetNameDef] досягла великих успіхів у модернізації свого військово-промислового комплексу. Ми повинні взяти натхнення з цього та наслідувати їх, збільшуючи кількість фабрик, орієнтованих на військове виробництво, у країні."
 ARG_the_clean_election:0 "Чисті вибори"
 ARG_uraguayan_ultimatum.tt:0 "([URG.GetFlag]§Y[URG.GetNameDefCap]§!) отримує подію «§Y$ARG_political_events.19.t$§!», яка вимагатиме, щоб вони стали нашою §Yмаріонеткою§!. Вони, ймовірно, погодяться, якщо мають §Gвисоку думку про нас§!."
