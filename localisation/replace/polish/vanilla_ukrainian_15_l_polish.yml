 POL_press_the_habsburg_claim_desc:0 "Угорщина занадто довго живе без короля, а ерцгерцог Отто фон Габсбург залишається без трону, який можна було б назвати своїм. Ми повинні відстоювати права нашого родича на трон і забезпечити правління Габсбургів у Європі!"
