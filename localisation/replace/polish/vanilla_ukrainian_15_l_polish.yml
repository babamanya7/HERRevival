 INS_integrate_sarekat_islam:0 "Інтегрувати Сарекат Іслам"
 INS_japanese_export_contracts_desc:0 "Ми укладемо велику торговельну угоду з [JAP.GetNameDef], продаючи весь каучук у [1049.GetName] та [672.GetName]. Хоча ми продаватимемо його за дуже низькою ціною, нам буде гарантовано, що все буде продано."
 INS_loyalist_events.1.t:0 "[INS.GetLeader] вимагає переведення Анрі Вінкельмана"
 INS_loyalist_events.16.desc:0 "Уряд [FROM.GetAdjective] зробив офіційний запит на передачу Цейлону. Їхні дипломати посилаються на давні торговельні та етнічні зв'язки між островом і малайським світом. Відверто кажучи, претензія є слабкою, але [FROM.GetNameDef] стали настільки могутніми, що такі прохання потрібно розглядати серйозно."
 INS_loyalist_events.3.desc:0 "[INS.GetLeader] повернувся з [HOL.GetNameDef], де він зустрівся з [HOL.GetLeader]. На жаль, Анрі Вінкельман не буде відправлений до Індії, і нам доведеться захищатися без нього."
 INS_maphilindo_communism_DEF:0 "Союз малайських народів"
 INS_militia_increase_activity_raid_unlock_tt:0 "Розблоковує рейд §YЗдійснити наліт на бази KNIL§! у сусідніх регіонах під контролем Нідерландів, що дає бойові модифікатори регіону в разі успіху."
 INS_militia_warning_tt:0 "Ополчення — це §Yнапівавтономні§! групи борців за свободу. Вони боротимуться за нас, але їхня допомога не безкоштовна. Вони очікуватимуть компенсації за свої зусилля. §RЯкщо вимоги не будуть виконані, стабільність різко впаде!§!"
 INS_murk_boersta:0 "Мурк Бурстра"
 INS_national_revolution_republic_win_ins_tt:0 "[INS.GetAdjective] республіканські загони ополчення встановлять §Gде-факто контроль§! над регіоном, і конфлікт закінчиться §Gперемогою Республіки§!."
 INS_new_bauxite_routes_desc:0 "Наша стратегія заниження цін на ринку з метою збільшення обсягів експорту бокситів виявилася успішною, і ми суттєво збільшили наш загальний дохід. Проте ми не повинні зупинятися на досягнутому. Ми повинні продовжувати розширювати наші торговельні мережі, оптимізувати ланцюжки постачання та шукати будь-які інші можливості для максимізації прибутків."
 INS_no_raids_allowed_tt:0 "§W§RРейди будуть недоступні, поки це рішення активне.§!§!"
 INS_political_events.9.a:0 "Вводьте танки!"
 INS_prioritize_sugar_economy_desc:0 "Ми повинні скоротити наш урядовий бюджет на промисловий розвиток Батавії; вона і так набагато більш індустріалізована, ніж будь-яке інше місто на архіпелазі. Замість цього ми повинні використати ці гроші для створення багатьох невеликих пальмових плантацій по всій країні. Ці плантації вироблятимуть пальмовий цукор, який є товаром з високим міжнародним попитом."
 INS_propoganda_mission:0 "Поширювати комунізм у [FROM.GetName]"
 INS_resist_occupation_desc:0 "Гнів багатьох індонезійців проти Нідерландів не може дозволити нам скотитися до фашизму. Ми повинні зробити все можливо за для опору японському вторгненню та захисту батьківщини."
 INS_revolution_events.23.t:0 "[FRA.GetNameDefCap] погоджується допомогти нам!"
 INS_revolution_events.38.desc:0 "Все скінчено. Голландський уряд прийняв американський ультиматум і визнав наш суверенітет. Триста п'ятдесят років колоніального панування завершилися не лише на полі бою, але й за столом переговорів за підтримки найвеличнішої держави світу. Республіка наша, по-справжньому і повністю, нарешті."
 INS_revolution_events.42.t:0 "Останній кидок кісток"
 INS_seize_oppurtunity_tt:0 "§Y[JAP.GetFlag][JAP.GetName]§! відкинута назад і контролює менше ніж §Y[?var:temp_states_plus_more]§! регіонів.\nнаразі: §Y[?var:JAP.num_controlled_states]§!"
 INS_silence_nationalists_desc:0 "Японське вторгнення змусило революційні націоналістичні рухи почати підтримувати японських загарбників через їхнього спільного ворога в особі Нідерландів. Нестабільність, викликана вторгненням, призвела до того, що ці рухи почали зростати такими темпами, яких ніколи раніше не бачили. Якщо ми не зробимо щось із цим зараз, це може повністю вийти з-під нашого контролю."
