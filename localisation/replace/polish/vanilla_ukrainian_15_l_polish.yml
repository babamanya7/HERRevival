 BRA_anaue_idea_desc:0 "Індіанське привітання «Anauê!» отримало нове життя як гасло інтегралістського руху. Вигукуване на вулицях членами партії в зеленій уніформі, воно вселяє гордість у націоналістично налаштованих людей і тривогу в опозиціонерів."
 BRA_armored_car_equipment_1:0 "M3 Scout Car"
 BRA_banco_do_brasil_desc:0 "Переваги центрального банку, що випускає та контролює пропозицію валюти для економіки, стали очевидними з часів Великої депресії. Банк Бразилії довгий час діяв як такий, але настав час формалізувати цю угоду."
 BRA_collective_bargaining_desc:0 ""
 BRA_combat_separatism_desc:0 "Щоразу, коли нація стикається з політичними заворушеннями, люди зі скаргами за межами столиці починають переслідувати сепаратистські програми, які загрожують розірвати [ROOT.GetNonIdeologyName]. Ми повинні робити більше для просування спільної [ROOT.GetAdjective] ідентичності по всій нації."
