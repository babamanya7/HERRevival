 GER_neutrality_party_civil_war:0 "Військовий уряд"
 GER_operation_green_desc:0 "На підтримку операції «Морський лев» наше оперативне командування на західному фланзі має спланувати повномасштабні операції в Ірландії та підготуватися до окупації острова, щоби забезпечити повний перехід Британських островів під наш контроль. Для цього наше верховне командування розробило план «Зелений» як детальний план операцій."
 GER_operation_panzerfaust_events.07.a:0 "Вони залишаться поза нашою досяжністю... поки що"
 GER_otto_von_bolschwing:0 "Отто фон Большвінг"
 GER_party_chancellor_hess:0 "Партійний канлцер Гесс"
 GER_paul_von_lettow_vorbeck:0 "Пауль фон Леттов-Форбек"
 GER_peoples_republic_communism:0 "Народна республіка Німеччина"
 GER_prepare_italian_coup_ww_desc:0 "Падіння Італії в фашизм має бути скасоване. Ми звернемося до [ITA.GetAdjective] королівських прихильників з пропозицією перевороту з нашою підтримкою."
 GER_pride_of_the_modern_germany:0 "Гордість сучасної Німеччини"
 GER_rebuild_the_nation_cat_desc:0 "З метою відновлення від громадянської війни, і щоб наш народ знову з гордістю називали себе німцями, ми повинні докласти зусиль до відбудови та громадських робіт."
 GER_reich_security_main_office_director_no_lar:0 "$GER_reich_security_main_office_director_lar$"
 GER_reichskommissariat_iberien:0 "Райхскомісаріат Іберія"
 GER_reichskommissariat_ostland:0 "Райхскомісаріат Остланд"
 GER_reichskommissariat_ural_effect_tt:0 "Усі необхідні області, окрім §Y[251.GetName]§!, перейдуть під контроль [RKL.GetNameDef]"
 GER_reichsprotektor_trait:0 "Райхспротектор"
 GER_reichswerke_conglomerate:0 "$conglomerate$"
 GER_return_of_the_kaiser_desc:0 "Кайзеррайху потрібен кайзер. Вільгельм II все ще живий і перебуває у вигнанні у Нідерландах. Ми скасуємо його вигнання і запропонуємо йому повернутися на трон, хоч би як до цього віднеслися західні демократії."
 GER_rhineland_desc:0 "Райнланд був демілітаризований іще з кінця Великої війни, але такого більше не буде! Німеччина — суверенна держава і вона може сама рухати війська будь-куди в межах своїх кордонів!"
 GER_safeguard_poland:0 "Захистити Польщу"
 GER_safeguard_poland_desc:0 "Поляки вразливі перед загрозою зі сходу. Ми повинні захищати їх будь-якою ціною, щоб зберегти буферну державу між нами та [SOV.GetAdjective]ою нацією."
 GER_seize_foreign_industries:0 "Захоплення іноземних підприємств"
 GER_southern_state_development:0 "Розвивати Південну Німеччину"
 GER_soviet_ally:0 "Альянс із [GER.GetTheUSSRName]"
 GER_spark_the_flame_of_revolution_tt:0 "Відкриває рішення для §YПоширення комуністичних настроїв§! у §Yменших сусідніх країнах§!. Коли комуністи здобудуть більшість підтримки — вибухне §YГромадянська війна§! для встановлення §YКомуністичної влади§!"
 GER_strike_eastward_desc:0 "Зміцнивши кордони, настав час знищити нашого головного ворога — того, хто порушив Брест-Литовський договір і загрожує стабільності Східної Європи — [SOV.GetNameDef]. Настав час захопити Москву та поставити [SOV.GetAdjective] гіганта на коліна."
 GER_subjugate_romanian_economy_desc:0 "Держава [ROM.GetNameDef] стала для нас важливим торговельним партнером. Величезна кількість сирої нафти, що видобувається в країні, стимулювала економіку країни, і тепер вони починають підвищувати ціни. Напевно, ми могли б натиснути на них, щоби забезпечити найліпші ціни для таких старих, постійних клієнтів, як ми?"
 GER_submarine_3:0 "Тип «VIIC»"
 GER_support_finland:0 "Підтримати Фінляндію"
 GER_support_the_finns_desc:0 "Фінам дуже загрожує [GER.GetRussiansDemonym]. Ми гарантуємо їм захист від комуністичної отрути та надаємо скромну промислову допомогу."
 GER_tend_to_the_future_of_germany_tt:0 "Будь-які спроби сепаратистського повстання буде успішно зупинено."
 GER_thalmann_freed_from_prison_flag:0 "§YЕрнст Тельман§! звільнений з в'язниці"
 GER_the_fate_of_the_north_ural_area:0 "Передати Північно-Уральську адміністрацію Московії"
 GER_the_proud_eagle_and_the_resurgent_dragon:0 "Гордий орел і відроджений дракон"
 GER_total_control_over_domestic_affairs_desc:0 "Ідея повністю передати внутрішні справи райхсканцлеру може здатися ризикованою. Однак Фюрер переконаний — обов’язки, які досі виконував партійний канцлер, були здійснені блискуче, і [ROOT.GetLeader] почувається спокійно, довіривши йому цю справу, щоб зосередитись на важливішому."
 GER_treaty_of_craiova_other:0 "Крайовська угода"
 GER_urbanization:0 "Урбанізація"
 GER_war_production_desc:0 "Війна знову охопила нас, але ми не зламаємося і не впадемо! Ми мобілізуємо нашу індустріальну міць і перевершимо будь-якого ворога, який буде настільки нерозумним, що подумає, ніби зможе зламати незламну волю німецького народу!"
 GIE_AIRWING_SELECT_MANPOWER_BUTTON_OWN:0 "Наразі ми використовуємо §H$COUNTRYADJ$і§! §Hлюдські ресурси§!."
 GIE_EXILE_ARMY_LEADER_UNLOCKED_WE_RECEIVE:0 "Ми отримали §H$EXILEADJ|l$ого§! §Hкомандувача армії у вигнанні§!."
 GNB_fascism:0 "Диктаторська Гвінея-Біссау"
 GOE_IRQ_news.2.d:0 "Рішучим кроком уряд [FROM.GetNameDef] офіційно відхилив Анкарський договір, відкинувши його територіальні угоди як пережитки минулої епохи. Це рішення безпосередньо кидає виклик встановленим кордонам та угодам між [TUR.GetNameDef], [PER.GetNameDef] та [FROM.GetNonIdeologyName], кидаючи регіон у політичну невизначеність. Як у [TUR.Capital.GetCapitalVictoryPointName], так і в [PER.Capital.GetCapitalVictoryPointName] виникло публічне обурення цією непокорою, а напруга зростає на тлі закликів до рішучої відповіді на односторонні дії [FROM.GetNameDef]."
 GOE_RAJ.15.a:0 "Що вони планують?"
 GOE_RAJ.28.a:0 "Зловісно"
 GOE_RAJ.4.b:0 "Нам доведеться поступитися"
 GOE_RAJ.43.b:0 "Гірка втрата"
 GOE_RAJ.6.a:0 "Чудово!"
 GOE_RAJ_famine.10.desc:0 "[FROM.GetName] повідомила нам, що не надасть нам жодної допомоги, заявивши, що відхиляє думку про те, що вона має будь-яке зобов'язання перед нашою державою під час такої світової кризи."
 GOE_RAJ_famine.10.t:0 "[FROM.GetName] відмовляється допомогти нам"
 GOE_RAJ_goa.1.desc:0 "[RAJ.GetLeader] вимагає повернути Гоа. [RAJ.GetLeader] наполягає, що Гоа — це [RAJ.GetAdjective] територія, і погрожує військовими діями, якщо ми його не віддамо."
 GOE_RAJ_goa.3.t:0 "[FROM.GetNameDefCap] відмовляється від передачі Гоа"
 GOE_RAJ_loyalist.03.a:0 "Ця війна може бути вигідною для нас. Діяти."
 GOE_RAJ_loyalist.09.desc:0 "На жаль, незважаючи на наші найкращі зусилля, [FROM.GetNameDef] відхилив нашу пропозицію захисту. Схоже, що нашого оборонного плану було недостатньо, щоб спокусити їх під нашу опіку."
 GOE_RAJ_navy.11.t:0 "[ENG.GetNameDefCap] погоджується надати нам контракти на сучасні кораблі!"
 GOE_RAJ_navy.12.desc:0 "Чиновники з [ENG.GetNameDefCap] відповіли на наш запит та відмовилися надати нам покращені контракти на кораблі, заявивши, що наша пропозиція надто низька, щоб вони могли її розглянути."
 GOE_RAJ_princely.2.b:0 "Магараджа Харі Сінгх має волю народу!"
 GOE_RAJ_princely.3.c:0 "Магараджа Джаячамараджендра Вадіяр — найкращий."
 GOE_form_hindustan_category_desc:0 "With the conquest of all Indian lands on the way, it is high time that [ROOT.GetLeader] declares the unification of Hindustan, to gather both support and attention towards our great nation."
 GOT_GER_fading_eagle.03.a:0 "Вони ще пошкодують про це"
 GRAND_DOCTRINE_BASE_STRIKE:0 "Удар по базах"
 GRAND_DOCTRINE_BENEFIT_DESCRIPTION:0 "§gПризначте §Hглобальну доктрину§!, щоб зробити доступним набір шляхів §Hпіддоктрин§!. Розвивайте свої піддоктрини, здобуваючи £doctrine_mastery §Hмайстерність§! від підрозділів у бою. Завершені піддоктрини активують §Hвіхи§!, що ще більше підсилює вашу §Hглобальну доктрину§!.§!"
 GRE_GATHERING_STORM_DESC:0 "Греція — це країна в кризовому стані. Роялісти та республіканці продовжили палку боротьбу за душу нації, що призвело до ліквідації Другої Грецької республіки в 1935 році. Король, автократичний іноземець, залишається фігурою, яка викликає дуже розбіжності з невизначеним майбутнім.\n\nВідволікаючись на дрібну внутрішню політику, злоякісній і реваншистській Болгарії дозволили гноїтися на півночі, в той час як давній ворог Греції та нещодавно знайдений союзник Туреччина переживає політичну метаморфозу на сході, і це вже не кажучи про хвилююче чудовисько по той бік Адріатики..."
 GRE_abandon_french_italian_debt_tt:0 "Ми відмовимося виплачувати борги §YФранції§! й §YІталії§!.\n"
 GRE_anatolian_fascists_in_play_tt:0 "§YФракція фашистів§! починає §Rсуперництво§!. \n§YФракція монархістів§! розколюється, частина прихильників примикає до §Yфашистів§!, решта — до §Yвенізелістів§!."
 GRE_com_independent_communism:0 "Народна республіка Еллада"
 GRE_depose_the_reactionaries_desc:0 "Ми досить довго терпіли союз із венізелістами. Їхня ліберальна повістка йде врозріз із нашим марксистським кредо, союз із ними — фарс, і нам час покласти йому кінець. За Революцію!"
 GRE_dimitrios_holevas:0 "Дімітріос Холевас"
 GRE_epameinondas_kavvadias:0 "Епамінондас Каввадіас"
 GRE_fighter_equipment_2:0 "EAF Hawker Hurricane"
 GRE_go_to_paris_to_negotiate_investment_talks:0 "Відправитись в Париж на перемовини про інвестиції"
 GRE_konstantinos_tsaldaris:0 "Константінос Цалдаріс"
 GRE_light_ship_engine_1:0 "Двигун «Parsons» 22 000 к. с. н. в."
 GRE_light_ship_engine_2:0 "«Parsons» 34 000 к. с. н. в."
 GRE_loyal_republicans:0 "Лояльні £faction_gre_venezelist республіканці"
 GRE_metaxism_5_desc:0 "$GRE_metaxism_desc$"
 GRE_monarchists_manpower_status_amount:0 "[ROOT.GetMonarchistManpowerBonus]"
 GRE_monarchists_stability_status_amount:0 "[ROOT.GetMonarchistStabilityBonus]"
 GRE_new_weapons_old_tricks_desc:0 "Ми набрали чимало досвіду, влаштовуючи артобстріли та проводячи розвідку на Великій війні. Нехай технологія та спорядження змінилися, але тактика точно залишилася незмінною. Скористаємося нашими сильними сторонами і покажемо світові, що з Грецією не так легко тягатися."
 GRE_open_up_the_country_desc:0 "Сумно, але факт: ми не зможемо провести індустріалізацію самотужки. Ми давно були залежні від капіталу та індустріальних потужностей великих держав; цей час — не виняток. Запросімо сьогодні ж до Греції чужий капітал та інвестиції, бо завтра й згодом вони нам уже ніколи не знадобляться!"
 GRE_paying_off_debt_large:0 "Великі платежі на рахунок боргу"
 GRE_political_instability_fascism:0 "$GRE_political_instability$"
 GRE_protecting_our_skies_desc:0 "У нас ніколи не було достатньо ресурсів, щоб одночасно захищати своє небо та бомбити противників. Якщо доведеться робити вибір між тим, щоби знищити більше ворогів, і тим, щоб уберегти більше своїх людей від їхніх атак, ми завжди обиратимемо порятунок співвітчизників."
 GRE_pyrkal:0 "Pyrkal"
