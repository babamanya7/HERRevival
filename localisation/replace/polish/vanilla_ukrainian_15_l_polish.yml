 CHI_select_mios_tt_aat:0 "Дозволить вам перемістити ВПО, розташовану в цьому регіоні, та її фабрики в інший регіон."
 CHI_ship_armor_cruiser_1:0 "76-мм Belt/25-мм палуба"
 CHI_the_peoples_front:0 "Народний фронт"
 CHI_the_three_year_plan_tt:0 "§RБуде видалено після вступу у війну.§!"
 CHI_towards_a_professional_army_desc:0 "Наша армія велика, але її ефективність спірна. Група німецьких військових радників рекомендувала нам скоротити армію та зосередитися на створенні менших, краще оснащених сил з високим моральним духом та бойовою ефективністю."
 CHI_tsr_form_a_preparatory_committee:0 "Створити Підготовчий комітет"
 CHI_tsr_repoen_the_natioal_assembly_desc:0 "Національна асамблея була законодавчою гілкою Бейянського уряду, яку назавжди закрив Юань Шикай і яку пізніше замінив Законодавчий Юань. Якщо ми хочемо мати справді вільний демократичний законодавчий орган у країні, ми не можемо задовольнятися лише дозволом Юаню продовжувати свою роботу. Необхідно запровадити багатогранну систему, щоб гарантувати панування волі народу!"
 CHI_tsr_zhonghua_minzu:0 "Чжунхуа міньцзу"
