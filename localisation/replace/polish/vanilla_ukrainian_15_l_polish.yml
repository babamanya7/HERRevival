 TUR_hold_a_march_in_state:0 "£faction_tur_kemalist Провести марш у фундаменталістському землі"
 TUR_kemalist_army_officers_powerful_disloyal:0 "Офіцери-кемалісти"
 TUR_kemalist_army_officers_powerful_neutral:0 "Офіцери-кемалісти"
 TUR_lift_the_turkiye_komunist_partisis_exile_desc:0 "Багато членів Турецької комуністичної партії досі перебувають у вигнанні на землях держави [SOV.GetNameDef] або ховаються у таємних європейських осередках. Можливо, ми не у всьому згодні з ТКП, але залишаємось їх товаришами з класової боротьби. Час їм повернутися додому."
 TUR_medium_tank_equipment_3_short:0 "Kırıkkale"
 TUR_nationalise_all_private_industry:0 "Націоналізувати всю приватну промисловість"
 TUR_nationalism_decision_desc:0 "Нам уже доводилося битися і вмирати за свою країну, ми маємо бути готові зробити це знову."
 TUR_nav_bomber_equipment_2_short:0 "Nu.D Köpekbalığı"
 TUR_nejdet_sancar:0 "Недждет Санчар"
 TUR_offer_conscription_exceptions_to_kurdish_groups_desc:0 "Багато курдських груп не потребує повної незалежності — лише певної міри автономності. Ми, щоби досягти миру, можемо надати її, звільнивши населення від призову."
 TUR_repeal_the_faith_tax:0 "Скасувати податок на віру"
 TUR_repeal_the_faith_tax_desc:0 "Податок на релігійні інституції безперспективний, і, хоча ми переслідували шляхетні цілі, істина в тому, що держава [ROOT.GetNameDef] не готова до такої радикальної політики. Розумно буде скасувати податок."
 TUR_root_out_kemalists_in_state:0 "£faction_tur_traditionalist Викорінити кемалістів у області"
 TUR_seizing_the_romanian_oil_fields:0 "Узяття нафтових родовищ у Румунії"
 TUR_ship_torpedo_4:0 "5x 533-мм ТА (пневм.)"
 TUR_stop_the_stalinist_charade_desc:0 "Справжня революція має повертатися до витоків. [SOV.GetNameDef] більше не дотримується своєї мети і не прагне колишніх ідеалів. Ми мусимо допомогти їм повернути втрачений ідеалізм."
 TUR_subject:0 "$OVERLORDADJ$а $TUR$"
 TUR_support_the_golden_square_desc:0 "Ми виявили групу однодумців, що має помітний вплив на політику, яку проводить [IRQ.GetNameDef]. Ми мусимо підтримати їх та заручитися їхньою допомогою у боротьбі проти імперіалістів у регіоні."
 TUR_the_batumi_accord:0 "Батумський договір"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact:0 "Зкоординовані збройні сили Балканської Антанти"
 TUR_the_damascus_diktat:0 "Дамаський диктат"
 TUR_the_montreux_convention_desc:0 "Жахливо, що, незважаючи на все, що трапилося після Великої війни, ми досі позбавлені прав управління власними протоками. Замість того, щоб в односторонньому порядку захоплювати протоки силою, випробуймо хитріший дипломатичний підхід, щоб уникнути кризи і не стати новим вигнанцем Європи."
 TUR_turkic_volunteers_from_abroad_desc:0 "Наші брати і сестри-тюрки приїздять із усіх куточків Євразії, щоб підтримати нашу спільну боротьбу. Разом ми забезпечимо Епоху Вовка."
 TUR_turkish_air_defense_platforms:0 "Турецькі платформи ППО"
 TUR_turkish_interventionism_desc:0 "Мир удома, мир у світі — так постановив Ататюрк, і тепер ми кодифікували це як саму основу нашої зовнішньої політики. Ми більше не можемо сидіти склавши руки та дозволити світу впасти в халепу, поки ми стоїмо осторонь і нічого не робимо. Єдиний спосіб забезпечити наш мир удома — це боротися за мир у світі."
