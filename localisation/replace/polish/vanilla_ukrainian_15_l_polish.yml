 nsb_news.8.a:0 "Ще одна держава піддалася монархізму."
 nuclear_missile_equipment_1_short:0 "Ядерна ракета I"
 occupy_north_italy_fra:0 "Окупувати Північну Італію"
 offer_military_access_receiver_extended_desc:0 "Держава $COUNTRY2|Y$ має право проходу військ крізь територію держави $COUNTRY1|Y$."
 officers_purged_5:0 "$officers_purged$"
 on_fire:0 "Сильна пожежа"
 only_big_guns_spirit_desc:0 "Лінкори — це беззаперечні королі морів."
 operation_coup_government_desc:0 "§LДержава [From.GetNameDefCap] дозріла для зміни режиму. Кілька надійних людей за належної підтримки можуть знести прогниву структуру, що підтримує [From.GetAdjective]ий уряд.§!"
 operation_gertrude_desc:0 "Окупація Туреччини дозволить нам швидше переміщати війська з Європи на Близький Схід і забезпечить контроль над єдиним проходом у Чорне море. Туреччина за жодних умов не повинна стати на бік Союзників!"
 operation_knickerbocker_short_desc:0 "§LЗахопіть бази в Атлантиці для підготовки до вторгнення в США.§!"
 operation_laudabiliter_desc:0 "Незалежність Ірландії — пляма на репутації Великої Британії. Ірландією, заради її власного блага, повинна керувати тверда рука з Лондона. В даний час розробляються плани вторгнення, завдяки якому нам вдасться повернути заблудлу вівцю назад у стадо."
 operative_tough_desc:0 "Цей агент не здається під катуванням."
 oust_germans_focus_desc:0 "Німецькі військові радники були присутні в Китаї щонайменше з 1920-х років і надавали значну підтримку Гоміньдану. Нині це неприпустимо. Ми маємо право вимогти негайного припинення військової підтримки Китаю з боку Німеччини. Німеччині час вибрати, на чиєму вона боці."
 paras_combat_2_desc:0 "Масштаби наших десантних операцій зросли настільки, що навіть найнеобхідніше медичне обладнання мусить бути заздалегідь підготовлене до повітряного десанту."
 pashtun_nationalist:0 "Пуштунський націоналіст"
 pavel_events.302.a:0 "Нашим вимогам підкоряться на полі бою."
 plane_bomb_upgrade_desc:0 "Більший бомбовий відсік для доставки більшого корисного вантажу."
 poland.1502.t:0 "[From.GetNameDefCap] опирається!"
 poland.3.a:0 "Допоки вони визнають нашу претензію, проблем немає."
