 AST_clare_stevenson:0 "Клер Стівенсон"
 AST_comintern_tt:0 "Якщо §Y[AST.GetName]§! очолює альянс, він зіллється з Комінтерном. В іншому разі, §Y[AST.GetName]§! приєднається до Комінтерну самостійно."
 AST_department_of_supply_and_development:0 "Відділ постачання та розвитку"
 AST_diplomatic_events.11.desc:0 "[USA.GetNameDefCap] погодилися об'єднати зусилля. Як члени [AST.GetFactionName], [AST.GetName] та [USA.GetName] допомагатимуть одна одній у нинішніх та майбутніх конфліктах."
