 RAJ_incorporation_of_the_east_india_company_desc:0 "Після шоку від Великої депресії та дедалі гучніших закликів до незалежності зрозуміло, що [ENG.GetAdjective] корона більше не може нести тягар управління Індією. Це може призвести до тимчасової нестабільності, але статус-кво нежиттєздатний."
 RAJ_indian_air_force_desc:0 "Небо — це новий рубіж сучасної війни. Створивши сильні та незалежні Індійські повітряні сили, ми забезпечимо наш суверенітет, домінування в повітрі та підготуємося до викликів майбутніх конфліктів."
 RAJ_indian_independence_act_desc:0 "Настає момент, який трапляється рідко в історії, коли ми виходимо зі старого до нового, коли епоха закінчується, і коли душа нації, довго пригнічена, знаходить вираз."
