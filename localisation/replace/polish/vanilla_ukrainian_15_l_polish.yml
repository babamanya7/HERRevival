 BRA_support_weapons2:0 "M1917 Browning MG & M2 60 mm mortar"
 BRA_use_the_national_security_law_desc:0 "Незважаючи на слабкий опір, запропонований членами Національного Конгресу, наша нова Рада Міністрів успішно встановила себе як легітимний уряд нації. Тепер вони використають закони про національну безпеку, прийняті режимом $BRA_getulio_vargas$, щоб встановити абсолютну владу над політичними справами."
