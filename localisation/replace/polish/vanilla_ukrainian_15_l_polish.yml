 ARM_neutrality_ADJ:0 "Вірменськ"
 AST_administer_the_mandate_desc:0 "Оскільки ми керували Новою Гвінеєю за мандатом Ліги Націй з 1920 року, а Папуа майже з часів Федерації була зовнішньою територією [AST.GetName], східна частина Папуа Нової Гвінеї стала б природним доповненням до основних територій [AST.GetName]. Тепер, коли Ліга Націй розпущена, з'явилася можливість здійснити таку федеральну реорганізацію."
 AST_adopt_westminster:0 "Вестмінстерський статут"
 AST_aid_australian_military_construction_desc:0 "Британія не готова до війни. Допомагаючи Австралії з військовим будівництвом, ми можемо пом'якшити їхнє нетерпіння."
 AST_an_uncle_for_father_figure:0 "Дядько замість батька"
 AST_australasia_flag:0 "Утворено §YАвстралазію§!"
 AST_australia_first_desc:0 "Ультраправа енергія Центристської партії була недовговічною, закінчившись її розпуском у 1935 році. Однак щось нове починає закипати, походячи від ідей бізнесмена та політичного активіста Вільяма Джона Майлза. Якщо не вжити заходів для мобілізації цих настроїв, вони можуть згаснути так само швидко, як і виникли. Тому ми будемо діяти."
