 INSHOL_ai_pyrotechnische_desc:0 "Продовжуючи розширення виробничих потужностей Artillerie Inrichtingen в Ост-Індії, ми повинні профінансувати створення ост-індського філіалу піротехнічної дочірньої компанії Artillerie Inrichtingen."
 INSHOL_bangka_production_lines:0 "Виробничі лінії Банки"
 INSHOL_east_indies_artillery:0 "Виробництво артилерії в Ост-Індії"
 INSHOL_east_indies_artillery_desc:0 "Відкриття артилерійських заводів на Яві дозволить нам менше залежати від зовнішньої торгівлі у наших військових зусиллях."
 INSHOL_purchase_british_artillery:0 "Купівля британської артилерії"
 INSHOL_work_with_oil_barons_desc:0 "Велика депресія залишила нашу експортну економіку в гнітючому стані. Можливо, настав час розглянути можливість перекласти частину торговельних переговорів на нафтових баронів Суматри, щоб гарантувати, що нафта буде продана. Однак це матиме свою ціну, оскільки для того, щоб вони погодилися на цю угоду, нам потрібно буде продавати нафту за цінами, значно нижчими за ринкові."
 INS_HOL_FLAG_DEF:0 "$INS_HOL_DEF$"
 INS_a_cheap_navy:0 "Дешевий флот"
 INS_assist_the_pemuda_desc:0 "Ява повна різноманітних студентських ополчень Пемуда. Об'єднання зусиль з ними та надання військової допомоги в їхніх місіях проти голландців може забезпечити нам корисного союзника."
 INS_australian_weapons_desc:0 "Таємні операції нелегко проводити, і нам знадобиться належне спорядження, щоб досягти успіху. Ми можемо ліцензувати австралійські заводи та перепрофілювати їх для виробництва зброї для NEFIS."
