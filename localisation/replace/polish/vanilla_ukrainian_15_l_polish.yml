 GRE_small_installment_payment_ENG:0 "Мала виплата боргу перед [FROM.GetAdjective]ою державою"
 GRE_the_hellenic_navy_desc:0 "У нас, греків, міцні славні традиції мореплавства ще з тих часів, коли ми вперше відвоювали свою незалежність у Османської імперії. Наш флот потужніший за флоти наших сусідів, і нам потрібно лише культивувати свою морську спадщину, щоби стати великим регіональним гравцем у Середземномор'ї."
 GRE_the_macedonian_farmlands_desc:0 "Основний експорт області [731.GetName] — це сільськогосподарська продукція. На відміну від багатьох інших частин наших земель, цей регіон чудово підходить для рільництва, і ми мусимо зосередитися на цьому, щоби зробити майбутнє нашої країни якомога кращим."
