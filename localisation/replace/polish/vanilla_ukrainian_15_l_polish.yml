 ship_hull_submarine_2_desc:0 "$submarine_2_desc$"
 shock_and_awe_desc:0 "Величезне зосередження вогневої сили, що завдає противнику потужного удару негайно або достатньо своєчасно, щоби позбавити його здатності до подальших дій."
 sholto_douglas:0 "$ENG_sholto_douglas$"
 siam.16.b:0 "Ми ніколи не здамося!"
 siam.18.desc:0 "Перехоплені повідомлення ворожого командування підтвердили наші найгірші побоювання: ніяких переговорів, ніяких поступок для завершення цієї війни не буде. Вони вимагають нічого меншого, як повної капітуляції нашої нації, прирікаючи нас на життя під чоботом чергового імперіаліста. Якщо така їхня мета, то відповідь у нас одна: ми відмовляємося підкоритися."
 siam.23.b:0 "Прив'язати до єни"
 siam.25.desc:0 "Король Прачадіпок помер. Колишній король, чиє ім'я несло пам'ять про старий порядок крізь роки вигнання та потрясінь, відходить зі справ людських в історію. Для декого його смерть закриває останній розділ боротьби, що почалася з кінця абсолютного правління. Проте справа, яку він уособлював, не вмирає разом з ним. Трон вистоїть, династія залишиться, і робота з відновлення гідності та стабільності [ROOT.GetName] повинна тепер продовжитися в ім'я молодого короля Ананди."
 socialist_science_pool_name:0 "$ENG_socialist_science_pool$"
 south_american_events.13.a:0 "Ми мусимо допомогти людям!"
 south_american_events.14.d:0 "Президентські вибори нарешті відбулися, і останній термін повноважень президента Артуро Алессандрі добіг кінця. У країні все ще зростає невдоволення і радикалізм як справа, так і зліва — і ніхто не знає остаточної відповіді, як врятувати країну від економічної катастрофи. Хто мусить прийняти мантію Алессандрі і повести країну в майбутнє?"
 south_american_events.31.a:0 "Зарозумілі імперіалісти!"
 south_american_events.31.desc.b:0 "[FROM.GetAdjective] дипломати залишили своє посольство в [ROOT.Capital.GetCapitalVictoryPointName] сьогодні, видавши сувору заяву від свого уряду. Вони заявляють, що більше не прийдуть нам на допомогу, якщо ми опинимося в конфлікті з іншими націями, і вони не визнають нас законним урядом нації. \n\nХоча було очевидно, що [FROM.GetNameDef] буде ворожим до нашого режиму, швидкість та рішучість їхніх дій стали шоком для багатьох."
 south_american_events.52.t:0 "[FROM.GetNameDefCap] погоджується припинити воєнні дії"
 south_american_events.63.a:0 "Дозволити їм продовжувати."
 south_american_news.2.a:0 "Молодці."
 south_american_news.60.t:0 "[BRA.GetAdjective] військові розпочинають переворот"
 south_american_news.7.d:0 "Гвіанський регіон довгий час був розділений між окупаційними колоніальними державами, що окупували субрегіони Каєнну, Гаяну, Амапу, Сурінам і Гуаяну. Однак зараз жителі регіону об'єдналися у спільній боротьбі проти імперіалізму і заявили, що знищать усіх, хто виступає проти їхнього об'єднання і незалежності."
 south_american_news.8.t:0 "Лютнева революція"
 south_pacific_mandate_SUCCEEDED:0 "Південний Тихоокеанський мандат був укріплений"
 soviet.100.a:0 "Яке щастя позбутися їх!"
 soviet.14.d:0 "Москва тисне на нас, закликаючи офіційно приєднатися до СРСР. Чи варто нам погоджуватися на це?"
 soviet.17.d:0 "Завершено ретельну ревізію оборонних укріплень уздовж наших західних прикордонних областей, і засуджені з виправно-трудових таборів готові пристати до роботи. Незабаром лінія Сталіна буде відповідати своєму славному тезкові!"
 soviet.27.b:0 "Як ми й підозрювали, вороги повсюди."
 soviet.27.t:0 "Процес над двадцять одним"
 soviet.30.d:0 "Румунія не зможе опиратися силі Червоної армії. Якщо ми надішлемо їм вимогу на законно нашу землю в Бессарабії, вони можуть навіть віддати її без бою."
 soviet.31.a:0 "$soviet.30.a$"
 soviet.50.d:0 "Заснування Четвертого інтернаціоналу відродило страх Сталіна перед зрадниками в партії та військовому командуванні. Бачачи судові процеси та страти під час Великої чистки, багато хто підозрював, що наближається ще одна чистка. У відповідь ряд генералів на чолі з Андрієм Власовим створили Комітет визволення народу Росії з метою повалення сталінського режиму до того, як він зможе завдати ще більшої шкоди.\n\nХоча заявленою довгостроковою метою є перехід до демократії, точна форма поки що неясна. Зрозуміло лише те, що вони мають намір усунути Сталіна від влади і покласти край правлінню більшовиків."
 soviet.72.b:0 "Народ стомився від війни. Ми мусимо знайти інший спосіб."
 soviet.8.t:0 "[FROM.GetNameDefCap] підкорюється"
 soviet_volunteers_tt:0 "Вони отримають 100 винищувачів і 50 бомбардувальників від нас.\n"
 sp_aip_engine_improved_tech_desc:0 "З подальшим вдосконаленням технології AIP ми спостерігаємо поліпшення як в плані продуктивності, так і в плані споживання матеріалів, що використовуються двигунами."
