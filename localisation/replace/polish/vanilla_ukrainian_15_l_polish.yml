 SOV_select_state_text:0 "Створюйте нові осередки, щоби розширити вплив, на мапі:\n\n £infiltrate_state_texticon£\n\n"
 SOV_shipyard_staff_purged_desc:0 "Після широкомасштабного розслідування численних звинувачень у диверсіях та інших підозрілих діях на флоті НКВС здійснив численні арешти, внаслідок чого деякі з наших верфей і військово-морських баз серйозно залишилися без персоналу."
 SOV_south_manchuria_railway_desc:0 "Японська Південно-Маньчжурська залізнична компанія — це держава в межах держави [MAN.GetName]. З їхньою підтримкою ми зможемо підготувати мережу постачання, необхідну для майбутньої боротьби."
 SOV_soviet_academies_of_sciences_joint_program_desc:0 "Спільна програма технологічного розвитку та досліджень, що проводиться різними академіями наук радянських республік."
 SOV_soviet_airforce_dynamic_modifier:0 "Радянські ВПС"
 SOV_spanish_general_rovira:0 "§Y$SPR_jose_rovira$§! ([SPC.GetFlag])"
 SOV_support_afghan_ideology:0 "Підтримати афганський [GetIdeologyNameWithCaps]"
 SOV_support_weapons2:0 "ДП & 50-мм РМ-38"
 SOV_supreme_soviet:0 "Верховна Рада"
 SOV_the_gobi_gambit:0 "Гобійський гамбіт"
 SOV_the_molotov_line_name_right:0 "Лінія Бухаріна"
 SOV_the_southern_thrust:0 "Південний поштовх"
 SOV_the_third_rome_desc:0 "З нашою роллю захисників святих місць ми є незаперечними захисниками віри. Цілком справедливо, що ми повинні поводитися відповідно до цього. Після падіння Константинополя Москва, без сумніву, стала Третім Римом."
 SOV_the_vanguard_of_the_true_revolution:0 "Авангард істинної революції"
 SOV_the_zinovyevite_terrorist_center_mission_tt:0 "   "
 SOV_train_equipment_3:0 "Тип «PR-43»"
 SOV_ukraine_insurrection_tt:0 "[ROOT.GetName] навчатиме українських ополченців в обмін на §Yправа на видобуток ресурсів§! в Україні в майбутньому.\n"
 SOV_urals_crackdown_timer_desc:0 "НКВС вирішив зосередитися на Уралі та Заураллі, проводячи масові арешти та допити, щоби забезпечити вірність населення регіону."
 SOV_war_economy_desc:0 "Зрозуміло, що капіталістичні та реакційні країни на наших кордонах планують завдати удару в момент нашої слабкості. Чим швидше ми переведемо нашу економіку на військові рейки, тим краще."
 SOV_war_economy_stability_tt:0 "Буде отримано штраф до §Yстабільності§!, якщо [ROOT.GetNameDef] не перебуває у стані війни:"
 SOV_war_economy_stability_war_tt:0 "§G[ROOT.GetNameDefCap] перебуває у стані війни, тож не отримає штраф до §Yстабільності§!.§!\n\n"
 SOV_war_with_germany_tt:0 "Пакт Молотова–Ріббентропа не діє"
 SOV_war_with_uk:0 "Війна зі Сполученим Королівством"
 SOV_warsaw_pact_faction:0 "Варшавський договір"
 SOV_will_trigger_a_great_purge_tt:0 "Сталін розпочне Велику чистку. §RЦієї чистки не можна уникнути.§!"
 SPA_a_great_maritime_power:0 "Велика морська держава"
 SPA_absorb_the_portuguese_empire_desc:0 "Настав час не лише контролювати португальський материк, але й по-справжньому згуртувати наші нації в одне ціле. Першим кроком буде їхня повна інтеграція в нашу державу, а другим — завоювання португальської колоніальної імперії, яка також є частиною нашої нової іберійської гегемонії, навіть якщо вони ще не бачать цього. Це легко виправити."
 SPA_angel_salas_larrazabal:0 "Анхель Салас Ларрасабал"
 SPA_arms_modernization_desc:0 "Наші війська можуть бути найбільш відданими, лояльними, відданими, палкими та найкраще навченими, але вони все одно потребують відповідної зброї для захисту християнства. Ми забезпечимо, щоб вони мали те, що їм потрібно."
 SPA_burgos_offensive:0 "Наступ у Бургосі"
 SPA_catalunya_offensive_mission:0 "Насувається наступ у Каталонії"
 SPA_embrace_pan_hispanism_tt:0 "Ми контролюємо кожну осердну область держав §Y[CHL.GetName]§!, §Y[ARG.GetName]§!, §Y[ECU.GetName]§!, §Y[PRU.GetName]§!, §Y[URG.GetName]§!, §Y[PAR.GetName]§!, §Y[BOL.GetName]§!, §Y[COL.GetName]§!, §Y[VEN.GetName]§!, §Y[PAN.GetName]§!, §Y[COS.GetName]§!, §Y[NIC.GetName]§!, §Y[HON.GetName]§!, §Y[ELS.GetName]§!, §Y[GUA.GetName]§!, §Y[MEX.GetName]§!, §Y[DOM.GetName]§!, §Y[CUB.GetName]§! та §Y[PUE.GetName]§!"
 SPA_embrace_the_spanish_destiny_desc:0 "На Іспанію чекає особлива доля: дати всім іспанцям свободу належати до сильної та вільної нації; знову зайняти наше провідне становище у світі всупереч запереченням наших ворогів; і захищати християнський спосіб життя."
 SPA_emilio_mola_vidal:0 "Еміліо Мола Відал"
 SPA_enrique_canovas_lacruz:0 "Енріке Кановас Лакрус"
 SPA_expand_influence_in_the_baleares_garrison:0 "Розширити вплив на гарнізон Балеарських островів"
 SPA_expand_influence_in_the_eastern_aragon_garrison:0 "Розширити вплив на гарнізон у Східному Арагоні"
 SPA_expand_spanish_bases_desc:0 "Імперіалісти, з якими ми об'єдналися, бажають використовувати наші бази для поширення свого впливу по всьому світу. Щоб прийняти їх, ми повинні розширити наші континентальні повітряні та військово-морські бази."
 SPA_fransisco_moreno_fernandez:0 "Франсіско Морено Фернандес"
 SPA_garrison_control_nationalists_total_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Gповний§!\nКількість дивізій на початку громадянської війни: §Y3§! націоналістичні — §Y0§! республіканських§!\n"
 SPA_heavy_cruiser_2_desc:0 "The two heavy cruisers of the Canarias class were built to the specifications of the Washington Naval treay. They were launched in the early 1930s but not completed until 1936. They displaced nearly 10,700 tons and had good speed. They were relatively lightly armored but sported eight 203mm/50 Vickers-Armstrong Mk D guns as their main armament."
 SPA_no_compromise_on_carlist_ideals_tt_2:0 "Держава §Y[ROOT.GetName]§! буде зватися §YКарлістська Іспанія§!.\n"
 SPA_strengthen_the_supreme_reality_of_spain_desc:0 "Занадто довго сепаратизм, незгода та місцева автономія послаблювали іспанську державу. Ми позбудемося цих дурних уявлень і представимо нову реальність для об'єднаної Іспанії, яку всі, незалежно від групи чи класу, зможуть сприймати та сприяти цьому."
 SPA_suppress_the_strikes_desc:0 "Страйки спричиняють масові заворушення та економічні збитки нашій країні. Ми відправимо наші загони ополчення, щоби розігнати їх і забезпечити повернення людей до роботи."
 SPA_supremacy_of_the_communion:0 "Верховенство «Причастя»"
 SPA_the_duty_to_work:0 "Робочий обов'язок"
 SPB_democratic:0 "Іспанія"
 SPECIAL_PROJECT_AVAILABLE_PROJECTS:0 "Доступні проєкти: $AMOUNT|Y$"
 SPECIAL_PROJECT_CANT_START:0 "§RЦей проєкт недоступний.§!"
 SPECIAL_PROJECT_RESOURCE_USAGE_NONE:0 "Використання ресурсів: §Yжодне§!"
 SPM_subject:0 "Сардинія-П'ємонт"
 SPQR_UNIFIED_fascism_DEF:0 "Римська імперія"
 SPR_against_trotskyism_and_stalinism:0 "Проти троцькізму та сталінізму"
 SPR_antonio_ortega_gutierrez:0 "Антоніо Ортега Гутьєррес"
 SPR_arm_the_tide_desc:0 "Без відповідного обладнання індивідуальне завзяття соціалістичного робітника не може досягти успіху в бою. Ми дамо їм необхідні інструменти ведення війни."
 SPR_casa_organization:0 "$casa$"
 SPR_disband_the_army_tt:0 "§GЗменшує частку армії, яка стане на бік націоналістів на початку громадянської війни, з §Y50%§! до §Y20%§! і зменшує кількість їхніх дивізій Африканської армії з §Y5§! до §Y3§!.§!\nЛоялістські §Y80%§! будуть §Rрозформовані§!, але їхнє оснащення повернеться на склади.\n\nЯкщо не взяти цей фокус, уряд розформує армію на початку громадянської війни без жодних додаткових переваг.\n\n§RНелояльні залишки армії спровокують негайний початок громадянської війни!§!\n"
 SPR_enlist_the_carabineros_desc:0 "Як проміжний захід для укомплектування фронту, ми повинні звернутися до неортодоксальних рішень. Без армії карабінери, воєнізована прикордонна та митна служба, будуть такими ж хорошими силами для укомплектування окопів."
 SPR_fortify_the_coastlines_tt_1:0 "Розмістити §Y1 узбережне укріплення§! в узбережних провінціях у §YГалісії§!, §YАстурії§! та §YКраїні Басків§!.\n"
 SPR_habsburg_neutrality_DEF:0 "Габсбурзьке Королівство Іспанія"
 SPR_increase_arms_production:0 "Збільшити виробництво зброї"
 SPR_increase_arms_production_desc:0 "Для захисту ідеалів комунізму нашій армії потрібна зброя. Наш великий національний промисловий потенціал має бути поліпшений, щоби ми могли постачати цю зброю."
 SPR_jose_diaz:0 "Хосе Діас"
