 PRC_medium_tank_artillery_equipment_1_short:0 "PLZ 39"
 PRC_naval_ocean_navy_desc:0 "Реформи нашого флоту тепер повинні дозволити йому ефективно діяти на великих відстанях від наших баз постачання. Це дозволить нам стримувати ворожі сили ще до того, як вони досягнуть сусідніх морів."
