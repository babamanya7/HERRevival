 SWI_DEF:0 "Швайцарія"
 SWI_alpine_fascism:0 "Альпійська наддержава"
 SWI_close_ties:0 "Тісні зв'язки"
 SWI_considerable_breach_of_neutrality:0 "Значне порушення нейтралітету"
 SWI_council_not_filled_TT:0 "Є порожнє місце в Раді"
 SWI_decision_cost_max_MR:0 "£GFX_SWI_military_readiness_text_icon£ [?ROOT.SWI_mr_max_amount]"
 SWI_decision_remove_councilor_3_text:0 "Усунути канцлера [?SWI.SWI_councilor_3.GetName]"
 SWI_empower_the_council_desc:0 "Небезпека підстерігає нас усюди, і коли вона накинеться на нас, ми будемо безсилі, якщо почнемо сваритися між собою, наші вороги зітруть [ROOT.GetName] з карти. Сильний централізований уряд, безумовно, єдиний шлях у ці нестабільні часи."
 SWI_ernst_wetter:0 "Ернст Веттер"
 SWI_expanded_military_support:0 "Розширена підтримка армії"
 SWI_fascism_DEF:0 "Імперська гельветська конфедерація"
 SWI_fight_until_death_desc:0 "Шанси проти нас, [ROOT.GetName] перевершує чисельність, озброєння та недостатньо готовий до того, що насувається. Ось чому кожен [ROOT.GetAdjective]ий громадянин повинен бути готовий віддати своє життя за свій Кантон і Конфедерацію."
 SWI_first_election_text:0 "Після того як радника обрано Президентом Конфедерації, він більше не зможе бути призначеним політичним радником, проте отримає у розпорядження потужне Рішення. Якщо посада політичного радника залишається вакантною занадто довго, ви зазнаєте штрафів, тож не забувайте її швидко заповнювати.\n\n"
 SWI_fortify_border_with_germany:0 "Зміцнити кордон із Німеччиною"
 SWI_infantry_equipment_1_short:0 "Karabiner K31"
 SWI_no_alps_independence:0 "Нехай знову стануть незалежними"
 SWI_no_confederation_councilor_desc:0 "Якщо посада канцлера залишатиметься порожньою надто довго, це неодмінно призведе до появи некомпетентних опортуністів, які намагатимуться обійняти цю посаду заради власної вигоди."
 SWI_panoramaheim_branch_desc:0 "У Штутгарті є будинок, який вони називають «Панорамним будинком», і він був джерелом багатьох оперативників п'ятої колони з метою дестабілізації [ROOT.GetAdjective] уряду, відкриваючи двері для режиму під керівництвом фашистів."
 SWI_president_gave_MR_speech:0 "Поточний президент заохотив до створення громадянських ополчень"
 SWI_prolonged_service:0 "Подовжена служба"
 SWI_purchase_democratic_planes_cas_desc:0 "Поки наші промислові можливості все ще обмежені, ми повинні покладатися на державу [FROM.GetName] для забезпечення наших військово-повітряних сил бомбардувальниками, необхідними для підтримки наших військ на полі бою."
 SWI_rejected_our_request:0 "Вони відхилили наш запит"
 SWI_renounce_guiding_principles:0 "Відмовитися від керівних принципів"
 SWI_renounce_guiding_principles_desc_cantons:0 "Наше початкове зобов'язання продовжувати передачу влади кантонам і Федеральним зборам, можливо, було передчасним. Нинішні обставини дають зрозуміти, що для нашого виживання необхідна більш енергійна і повноважна Федеральна Рада."
 SWI_rolf_henne:0 "Рольф Генне"
 SWI_seek_trade_agreement_with_germany_desc:0 "Фашизм продовжує своє жахливе зростання, і хоча це може бути пігулкою, яку важко проковтнути, дозволити певну економічну співпрацю може бути тим, що нам потрібно, щоб тримати їхній приціл подалі від нас."
 SWI_slow_retribution_for_gustoff:0 "Покарали вбивцю Густлоффа"
 SWI_spouse_fascism:0 "Прийняти фашистські ідеали"
 SWI_support_humanitarian_efforts:0 "Підтримати гуманітарні зусилля"
 SWI_suspicious_preparations:0 "Підозріла підготовка"
 SWI_swiss_democratic_tradition_campaign_desc:0 "Ми можемо нагадати швайцарському населенню про нашу історичну демократичну традицію, найстарішу демократію в Європі, і, можливо, єдину справжню демократію."
 SWI_the_alpine_confederation_chance_TT:0 "\nВони, швидше за все, нададуть нам незалежність на основі §Yрозміру§! наших збройних сил, і це також збільшить наші шанси на те, що вони нададуть нам додаткові альпійські території разом зі своєю §Yдумкою§! про нас."
 SWI_the_petition_of_the_200:0 "Петиція двохсот"
 SWI_total_defense_desc:0 "Тотальна війна означає, що нам потрібна повна оборона, якщо кожне ополчення буде готове та віддасть усе, що має, проти загарбників, у нас буде шанс вижити."
 SWI_train_navy_staff_desc:0 "Військово-морська інфраструктура створена не тільки зі сталі та бетону, вона також вимагає чоловіків і жінок, які володіють сміливістю та підготовкою для досягнення перемоги на морях і океанах."
 SWI_withdraw_from_the_league_of_nations_desc:0 "Наше членство в Лізі Націй несумісне з нейтралітетом, який ми прагнемо мати в [ROOT.GetName], тому нам життєво важливо залишити цю вмираючу організацію. Це також буде сигналом про нашу прихильність справжньому нейтралітету перед нашими сусідами, сподіваємося, що ми переконаємо їх, що [ROOT.GetName] не є ціллю."
