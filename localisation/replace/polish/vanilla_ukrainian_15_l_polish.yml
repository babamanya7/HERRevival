 FIN_take_over_the_suojeluskunta_desc:0 "Suojeluskunta діяла як допоміжна сила резервістів, яких можна закликати допомогти захистити націю під час кризи. Якщо ми візьмемо організацію під свій контроль, ми зможемо використати її, щоб навчити тисяч людей нашій справі."
