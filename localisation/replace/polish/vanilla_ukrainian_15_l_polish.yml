 news.127.t:0 "Падіння Панамського каналу"
 news.130.d:0 "Французькі війська успішно взяли штурмом столицю Німеччини після відчайдушних боїв на вулицях міста. Велика група солдатів SS забарикадувалася на Олімпійському стадіоні, проте їх захопили загони Іноземного легіону за підтримки артилерії.\n\nФранцузький триколор майорить тепер над Райхсканцелярією, і хоча місцями в передмісті ще трапляються перестрілки, можна говорити про те, що з організованим опором покінчено."
 news.143.a:0 "Чи це початок кінця...?"
 news.15.b:0 "Мапа Європи буде перемальована."
 news.157.a:0 "Здається, [FROM.FROM.GetName] хоче забруднити руки."
 news.169.d_puppet_CRO_annex_YUG:0 "Нещодавні територіальні втрати спричинили розділ югославської держави, за яким послідували етнічний конфлікт та послаблення центральної влади. Німеччина створила «незалежну» державу Хорватію та анексувала решту країни"
 news.170.a:0 "Все, щоби зберегти мир."
 news.199.c:0 "[?SOV.former_controller_of_bessarabia.GetNameDefCap] перебуває в жалюгідному становищі."
 news.2.d:0 "Японські та китайські сили зіткнулися в районі мосту Марко Поло, який має стратегічне значення через розташування на південний захід від Пекіну.\n\n[CHI.GetNameDef] взяв на себе всю відповідальність за інцидент і вибачився перед державою [JAP.GetNameDef], а також погодився на значні територіальні поступки. Це здивувало багатьох експертів, упевнених, що ось-ось має вибухнути війна.\n\nЧи можливий довгостроковий мир в Азії?"
 news.201.e:0 "Цей альянс ізміцнює наші позиції."
 news.212.d_axis:0 "Між Токіо та Берліном розвивається нове партнерство. Розпочалися переговори про укладення пакту між двома державами, посилаючись як на стратегічні інтереси, так і на спільні цінності. Поки що невідомо, що стане результатом цих переговорів, але перспектива дружби між одними з найсильніших збройних сил на кожній півкулі є приводом для радості для їхніх союзників і приводом для занепокоєння для їхніх численних ворогів."
 news.213.e:0 "Мирного рішення не буде!"
 news.214.e:0 "[POL.GetFactionName] може бути нашим найбезпечнішим вибором."
 news.215.a:0 "Це єдиний спосіб протистояти комуністичній загрозі."
 news.215.d_not_soviet:0 "[GER.GetNameDefCap] давно засуджує комунізм у всіх його формах і робить дипломатичні кроки, щоб інші країни також виступили проти нього.\n\nТепер [GER.GetName] запропонувала «державам, котрі перебувають під безпосередньою загрозою комунізму», шанс сформувати пакт проти [SOV.GetName]. Будь-яка країна в пакті буде зобов'язана вести війну проти [SOV.GetName], якщо настане час, коли на члена пакту нападуть."
 news.219.d:0 "Невизначеність довгий час панувала у [SOV.GetNameDef]. Хоча подробиць мало, відбулася серія таємних судових процесів на найвищому рівні, і генерали та міністри зникли з поля зору громадськості.\nПриродним припущенням є те, що в Комуністичній партії було розкрито якусь велику змову, але жодної офіційної заяви не було зроблено. Крім того, дипломатичні звіти, до яких ми маємо доступ, вказують на те, що докази, представлені на цих процесах, були далеко не беззаперечними.\n\nЩо б не відбувалося, [SOV.GetAdjective]а структура вищого командування змінилася безповоротно."
 news.225.b:0 "$news.224.b$"
 news.225.c:0 "$news.224.c$"
 news.226.c:0 "$news.225.c$"
 news.230.t:0 "Повстання в Америці"
 news.244.d:0 "Крок, який здивував небагатьох спостерігачів, [AST.GetNameDef] оголосив про створення власної, незалежної договірної організації. [AST.GetLeader] оголосив, що [AST.GetNameDef] шукатиме союзників у спробі підтримати стабільність у Південно-Східній Азії та Тихоокеанському регіоні і за його межами, а також, за необхідності, протидіяти агресії з боку [AST.GetAdjective]ої держави та інших.\n\nПісля нещодавнього відходу від зв'язків зі Співдружністю, це здається природним наступним кроком, оскільки [AST.GetNameDef] прагне стати одноосібним господарем своєї долі."
 news.245.a:0 "Захоплюючий хід..."
 news.270.b:0 "ЯК там вони назвали цю штуку?"
 news.280.desc:0 "Після напруженої зустрічі між [GER.GetAdjective]ом послом та міністром закордонних справ [ENG.GetAdjective]ого уряду, Парламент держави [ENG.GetNameDef] сьогодні оголосив, що відтепер [RAJ.GetNameDef] буде дозволено визначати власну політику. Століття британського панування на субконтиненті підійшли до кінця напрочуд швидко — державним службовцям наказано повернутися додому, а колоніальна адміністрація передана корінним індійцям.\n\nОдним з перших кроків нового індійського керівництва стало оголошення про широкомасштабну угоду про співпрацю з [GER.GetNameDef]. Індійський уряд відмовився коментувати звинувачення в тому, що це була ціна, яку вони заплатили за німецьку підтримку."
 news.291.t:0 "Австрія голосує за об'єднання з Угорщиною"
 news.314.b:0 "Революцію не зупинити!"
 news.325.t:0 "Югославія претендує на Болгарію"
 news.329.desc:0 "Югославія, навіть більш стоїчно, ніж інші країни, роками відмовлялася визнавати комуністичну [SOV.GetAdjective]у державу. З сьогоднішньою заявою про те, що уряд Югославії відтепер встановить офіційні відносини з Радянським Союзом, цій політиці нарешті прийшов кінець. Чи означає це відкриття югославської держави для комуністичного впливу, ще належить з'ясувати, але тон оголошення був напрочуд привітним."
 news.33.t:0 "СРСР окупував Східну Польщу"
 news.330.a:0 "Ми поведемо за собою братів-слов'ян!"
 news.336.b:0 "Ми забули."
 news.36.c:0 "Ми мусимо укріпити наші північні кордони!"
 news.38.a:0 "Цікаво."
 news.409.c:0 "Гуманітарна трагедія."
 news.43.a:0 "Це було близько."
 news.49.d:0 "Знаменита авіаторка Амелія Ергарт, відома багатьом як «Королева повітря», завершила кругосвітню подорож разом зі своїм штурманом Фредом Нунаном.\n\nДобряче стривоживши публіку короткостроковим зникненням поблизу острова Гауленд у Тихому океані, вони без перешкод завершили подоож на літаку «Lockheed Electra» в Окленді, штат Каліфорнія.\n\nНа наступному тижні в Білому домі відбудеться церемонія, в ході якої президент особисто привітає Ергарт з успіхом."
 news.58.d:0 "Німецькі претензії на Судетську область, що у Чехословаччині та котра населена великою кількістю етнічних німців, останнім часом посилилися.\n\nНа зустрічі в Мюнхені глави Німеччини, Великої Британії, Франції й Італії спробували знайти рішення так званої Судетської кризи.\n\nВідбувся розкол між Францією та Великою Британією: англійці визнали вимоги німців законними, а французи — ні. Вони створили новий альянс із чехами та пригрозили Німеччині війною, якщо її війська перейдуть кордон Чехословаччини."
 news.6.b:0 "Ці уперті дурні заплатять за свою помилку."
 news.60.e:0 "Угорщина поверне собі колишню славу!"
 news.62.d:0 "Німецькі війська вторглися до Богемії та Моравії з метою підтримання порядку після падіння чеського уряду.\n\nУ Празі окупаційні сили заявили про створення «автономного протекторату» Третього Райху.\n\nДругий протекторат був створений на основі Словаччини, про що було оголошено в Братиславі. Тепер уся Чехословаччина фактично анексована Німеччиною."
