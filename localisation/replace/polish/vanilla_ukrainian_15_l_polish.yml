 BUL_democratic_principles:0 "Демократичні принципи"
 BUL_dest_haskovo:0 "Хасково"
 BUL_dest_varna:0 "Варна"
 BUL_fate_of_the_balkans_influence_government:0 "Вплинути на [FROM.GetAdjective]ий уряд"
 BUL_fight_tyranny_desc:0 "Настав час протистояти великим європейським державам, які дотримуються тривожної фашистської політики і чиї лідери мріють ні про що інше, як про розширення своїх володінь і підкорення світу."
 BUL_foreign_aircraft_designers_desc:0 "Навіщо нам витрачати час і сили на розвиток національної авіаційної галузі, коли ми можемо просто найняти іноземних конструкторів із десятиліттям досвіду виробництва військових літаків?"
 BUL_foreign_industrial_concern_requirements_sov_tt:0 "Болгарія збудувала принаймні [?BUL.BUL_industrial_investments_medium_cap|Y0] [SOV.GetAdjective]их цивільних заводів шляхом рішень §Y$BUL_foreign_agreements$§!"
 BUL_found_the_brannik:0 "Заснувати «Бранник»"
 BUL_georgi_petsov_bftb:0 "Георгій Пецов"
 BUL_has_banned_faction_media_trigger_tt_NOT:0 "Не: За останні §Y365§! днів було заборонено ЗМІ будь-якої фракції"
 BUL_honored_bulgarian_claims:0 "Ушанували болгарські претензії"
 BUL_increase_industry_investments_desc:0 "Ми мусимо розвивати важку промисловість, здатну підтримувати наш великий промисловий і військовий розвиток. Потрібні великі національні інвестиції, але це наблизить нас до нашої остаточної економічної незалежності."
 BUL_internal_affairs_ongoing_flag:0 " Наразі взаємодіє з фракцією"
 BUL_invigorate_national_industry:0 "Пожвавити національну промисловість"
 BUL_is_not_alone_in_faction_tt:0 "Будь-яка країна: В альянсі з державою §Y[ROOT.GetNameWithFlag]§!"
 BUL_join_the_tripartite_pact_desc:0 "[GetJoinTripartitePactFocusDesc]"
 BUL_leader_is_regency_council:0 "болгарська регентська рада"
 BUL_legalize_the_agrarian_party_desc:0 "Ідеї Болгарського Землеробського національного союзу в економічних питаннях можуть дещо відрізнятися від наших, але якщо ми залишимо ці дрібниці позаду, його члени могли б приєднатися до нашої політики. Тому ми мусимо приступити до легалізації цієї організації та шукати співпраці між нашими партіями, бо якщо ми хочемо привести Болгарію до справжньої демократії, нам потрібна вся підтримка, яку ми можемо отримати..."
 BUL_liberation_of_the_proletariat_desc:0 "Наш обов'язок — покінчити з репресивними режимами, яким підпорядковується робітничий клас сусідніх країн. Болгарська народна армія не заспокоїться, доки ці тиранічні уряди не будуть повалені, навіть якщо їй доведеться воювати проти великих європейських держав, які їх підтримують."
 BUL_national_military_academy:0 "Національна військова академія"
 BUL_negotiate_claims_in_the_balkans_desc:0 "Перш ніж йти одним курсом з будь-якої з провідних держав, ми мусимо обговорити з Німеччиною наші територіальні претензії. Напруга в міжнародних відносинах зростає, і Болгарія підтримає лише ту країну, яка запропонує їй кращі."
 BUL_nikola_zhekov:0 "Нікола Жеков"
 BUL_nikola_zhekov_desc:0 "Нікола Тодоров Жеков"
 BUL_opression_imprison_bzns_leaders:0 "Заарештувати лідерів $BUL_bzns_name_gen$"
 BUL_persuade_bzns_members:0 "$BUL_bzns_name_gen$"
 BUL_plot_against_boris_desc_plot:0 "Ми думали, що цар Боріс — монарх, який приведе країну до величі, але його авторитарний режим, близький до диктатури, доводить, що ми помилялися і загрожує ще більше дестабілізувати країну. Наш обов'язок як вірних слуг Болгарії — позбавити наш народ від цього негідного правителя і сформувати новий уряд, гідний довіри народу."
 BUL_purchase_ships_submarines_tt:0 "Ми отримаємо §Y3 підводних човни§!."
 BUL_regnalname_simeon:0 "Сімеон"
 BUL_repress_imro_destroy_organization:0 "Знищити залишки ВМРО"
 BUL_research_sharing:0 "Обмін дослідженнями"
 BUL_secure_occupation_in_balkan_state_desc:0 "Ми мусимо зіграти роль миротворців на Балканах і запропонувати союзникам дарувати нам право на управління їх окупованими територіями в регіоні. Таким чином [ROOT.GetFactionName] зможе передислокувати гарнізони для зміцнення позицій."
 BUL_stefan_nedev:0 "Стефан Недев"
 BUL_support_macedonian_organizations_desc:0 "Якщо ми хочемо здійснити наші мрії про об'єднання та анексію Македонії, нам буде вигідніше співпрацювати з лідерами ВМРО в еміграції, які можуть прокласти шлях для можливої болгарської окупації Македонії в майбутньому."
 BUL_the_bulgarian_threat:0 "Болгарська загроза"
 BUL_the_fight_against_bolshevism_desc:0 "[GetObliterateTheBolshevikThreatFocusLoc]"
 BUL_the_unification_of_the_balkans_event_tt:0 "\nБудь-яка балканська нація, пов'язана з §Y[ROOT.GetFlag][ROOT.GetNameDef]§! отримає подію §YОб'єднання Балкан§!.\nВідмикає рішення щодо роботи з [TUR.GetAdjective]ими територіями."
 BUL_total_war_join_wars_tt:0 "§Y[ROOT.GetNameWithFlag]§! §Rвступить у всі війни проти ворогів свого лідера фракції, за винятком§! §Y[SOV.GetNameWithFlag]§!."
 BUL_ultimatum_opinion_medium:0 "\n- §YДумка про державу [ROOT.GetFlag][ROOT.GetNameCap]§!"
 BUL_uranium_prospecting_desc:0 "Уран стає надзвичайно цінним ресурсом для створення потужної та руйнівної нової зброї, і ми відкрили ймовірно багаті родовища в Бухові. Ми мусимо обстежити територію та подумати, чи буде нам вигідніше використовувати ресурс самостійно чи надати права на експлуатацію нашим союзникам."
