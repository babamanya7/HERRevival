 dod_news.2.c:0 "Дуже тривожні новини..."
 dod_news.4.d:0 "Держава [CZE.GetName] шокувала багатьох, оголосивши про те, що в односторонньому порядку передає Судетську область Німеччині. Відповідаючи на запитання, джерело в [CZE.GetAdjective]ому міністерстві закордонних справ відповіло, що «ми зрозуміли, з якого боку дме вітер, і це був наш єдиний спосіб вижити».\n\nЗа чутками, неназваний французький чиновник засудив [CZE.GetAdjective]ий вчинок, зазначивши, що західні держави підтримали б державу [CZE.GetName], якби на неї натиснула Німеччина."
 early_ship_hull_carrier_desc:0 "Переобладнання старих корпусів дозволяє з мінімальними витратами будувати експериментальні зразки авіаносців і набиратися найціннішого досвіду в області палубної авіації. Перероблені кораблі будуть поступатися справжнім авіаносцям, але створювати їх набагато швидше."
 election.15.d:0 "З наближенням виборів люди починають ставити під сумнів здатність нинішньої адміністрації продовжувати війну. Держава [Root.GetName] сильно постраждала, і громадська думка обернулася проти тих, хто, здається, веде нашу країну до поразки. Хоча наш народ сповнений рішучості довести війну до кінця, він волів би, щоби її закінчив інший уряд."
 election.7.d:0 "Прийняття фашистів до нашої політичної коаліції вплинуло на нашу зовнішню політику. Незважаючи на їхній запеклий націоналізм, вони мають симпатиків за кордоном, які схвалюють вплив, який вони отримали в державі [Root.GetName]. Тоталітарні уряди зі схожими ідеологічними поглядами бачать у нас можливих союзників. Підтримка зв'язків із цими країнами, незважаючи на те, що [Root.GetRulingParty] може відчувати огиду до їхніх ідеалів, може бути необхідною, щоби зберегти підтримку фашистів, які підтримують наш уряд."
 election.8.b:0 "На цьому шляху лежить розпад самої держави [Root.GetName]."
