 GUARANTEEE_COST2:0 "Наразі ми гарантуємо незалежність $COUNT|Y$ держав(и), і гарантія держави $NAME|Y$ коштуватиме $COST|Y$£pol_power£, оскільки кожна гарантія збільшує вартість наступної.\n"
 GUAY_appease_the_generals_tt:0 "Генерали отримають додаткові навички та одну випадково призначену рису."
 GUAY_long_term_contracts_desc:0 "Ми не можемо сподіватися конкурувати з нашими сусідами щодо передових технологій виробництва зброї. Однак отримання довгострокових ліцензійних контрактів з великими державами дозволить нам виробляти ці предмети за зниженою ціною."
 GUAY_mythologize_the_father_of_the_nation_urg:0 "Хосе Артігас вважається батьком нашої нації, який боровся за нашу незалежність проти ворожих сусідів та європейських держав. Його спадщина та ідеали будуть інституціоналізовані та стануть частиною того, що означає бути уругвайцем."
 GUAY_no_second_american_colonization_desc:0 "Наш континент коливається між Віссю та Союзниками, і в той час як наші сусіди бачать лише себе під гнітом інших. Південна Америка заслуговує на кращу долю, не скуту старими державами, щоб формувати нашу власну долю, не обмежену спадщиною колонізації, і якщо нам доведеться топтати тих, хто має менш амбітне бачення, щоб досягти цього, нехай буде так."
