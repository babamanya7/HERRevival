 denmark_expansion_event.231.desc:0 "[FROM.GetNameDefCap] завбачливо погоджується з нашими справедливими претензіями на їхню територію. Це дуже далекоглядно з боку уряду."
 denmark_expansion_event.5.t:0 "[FROM.GetNameDefCap] погоджується на наші вимоги [ICE.GetAdjective]их земель"
 denmark_expansion_event.601.t:0 "[FROM.GetNameDefCap] приєднується до нашої дослідницької угоди"
 denmark_expansion_event.700.t:0 "[FROM.GetAdjective]е втручання"
 denmark_political_events.8.desc:0 "Данські вибори завершено. Різні партії робили все можливе, щоб переконати народ голосувати за свою програму. Є думка, що найважче тільки починається, адже потрібно сформувати уряд. Вибір прем'єр-міністра диктуватиме шлях держави [DEN.GetNameDef] у найближчому майбутньому."
 denmark_protection_event.120.a:0 "Чудова ініціатива!"
 denmark_resistance_event.10.desc:0 "Нам стало відомо, що держава [FROM.GetNameDef] підписала угоду з державою [DEN.GetNameDef], щоб підтримати декларацію незалежності та об'єднати війська. [FROM.GetLeader] тепер наполягає на дотриманні нами умов угоди."
 denmark_resistance_event.11.a:0 "Як то кажуть, ворог мого ворога..."
 denmark_resistance_event.11.desc:0 "До агентів нашої розвідки звернулися їхні данські колеги: вони пропонують ділитися розвідданими між двома країнами. Це, без сумніву, піде на користь нашим розвідувальним операціям і обом державам загалом."
 denmark_resistance_event.3.t:0 "[FROM.GetNameDefCap] відхиляє наше прохання про допомогу"
 denmark_trade_deal.7.a:0 "Що ж, нам більше дістанеться!"
