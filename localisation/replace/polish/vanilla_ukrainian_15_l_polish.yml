l_polish:
 ---_communist:0 "будь-яка комуністична країна"
 890_autenticite_name:0 "Букаву"
 AAT_Sweden.14.a:0 "Почнімо з надсилання гуманітарної допомоги."
 AAT_Sweden.19.a:0 "Норвегія знову ціла."
 AAT_Sweden.28.b:0 "Ціна, яку доводиться платити за союзника."
 AAT_Sweden.28.desc:0 "Оскільки риторика лідера [SWE.GetLeader] стає дедалі більш імперіалістичною, можливо, не варто дивуватися з того, що [SWE.GetSheHe] тепер вимагає повернення своїх втрачених імперських володінь. Будь-яка видимість претензій явно застаріла і в кращому випадку є фальшивою, але під час конфлікту ми не можемо дозволити собі втрачати союзників. Можливо, жест доброї волі порадує їхнього лідера?"
 AAT_Sweden.3.desc:0 "Сьогодні люди по всій державі [ROOT.GetNameDef] збираються, щоби віддати свої голоси на національних виборах. Очікується, що соціал-демократи повернуться, оскільки прогнози вказують на те, що вони можуть отримати кілька місць у Ріксдазі.\nВтім, як Фермерська ліга, так і Права партія сподіваються, що несподіваний поворот може привести до влади будь-яку з них. Але з більшою кількістю маргінальних партій, які, за прогнозами, можуть здобути незначні успіхи в умовах неспокійної ситуації у світі, все можливо."
 AAT_Sweden.35.t:0 "[FROM.GetName] передає [DEN.GetAdjective]і заморські території"
 AAT_Sweden.39.desc:0 "У безпрецедентному кроці [FROM.GetName] вимагає від нашого уряду передати їм усі свої функції й установи. Тепер зрозуміло, що замість допомогти нам, [FROM.GetAdjective]ий уряд руйнує нашу цілісність допоки не відчує себе досить упевнено, щоби встановити свій контроль над нами."
 AAT_Sweden.42.desc:0 "Держава [FROM.GetName] повідомила нам, що категорично відмовляється поступитися областю [145.GetName], стверджуючи, що це питання вже вирішено Лігою Націй. Очевидно, [FROM.GetName] переоцінює свій вплив. Ми мусимо вказати державі [FROM.GetName] на їхню помилку або на їхні шляхи."
 AAT_Sweden.50.desc:0 "[SWE.GetName] вимагає повного контролю над портом або Нарвіком. Їхній уряд виправдовує цю риторику побоюваннями, що противник може висадитися в Нарвіці й атакувати шведські залізорудні шахти. Розбіжності можуть призвести до подальшої ескалації конфлікту."
 AAT_Sweden_ball_bearing.1.a_tt:0 "\n$we_will_gain_tt$\n  Стабільність: §G+2%§!\n  Людські ресурси щотижня: §G+15§!. \nЕфекти можуть накладатися."
 AAT_Sweden_ball_bearing.5.b:0 "Радарні технології."
 AAT_Sweden_flashpoints.39.desc:0 "Держава [SWE.GetName] дозволила нашим пораненим і тим, хто перебуває у відпустці, подорожувати своєю мережею залізниць назад до держави [GER.GetNameDef]. Однак вони наполягають на тому, що це може робити лише неозброєний особовий склад, і буде встановлено суворі квоти, щоби гарантувати, що у Швеції ніколи не буде забагато військових у будь-який момент часу."
 AAT_Sweden_flashpoints.52.b:0 "Ми мусимо припинити арешти: ми нищимо державу."
 AAT_Sweden_flashpoints.64.a:0 "Вони напросилися."
 AAT_Sweden_flashpoints.72.t:0 "[ENG.GetName] викрадає наші нові кораблі"
 AAT_Sweden_nationalists.23.b:0 "Всі фашисти будуть притягнуті до відповідальності"
 AAT_Sweden_nationalists.27.t:0 "[FROM.GetName] отримує [FIN.GetAdjective]у землю"
 AAT_Sweden_nationalists.3.a:0 "Ми повстанемо з попелу сильнішіми, ніж будь-коли!"
 AAT_USA_events.02.a:0 "Принаймні, наші люди в надійних руках..."
 AAT_finland_diplomacy.17.t:0 "[FROM.GetAdjective]а вимога [GetBalticOrNordic]их територій"
 AAT_finland_diplomacy.19.desc:0 "[FROM.GetLeader] відмовляється передавати нам свої [GetBalticOrNordic]і території, заявляючи, що наші претензії на них анітрохи не більш правомірні, ніж будь-які інші. Як же нам відповісти на таке ганебне рішення?.."
 AAT_finland_diplomacy.22.a:0 "Та як вони посміли!"
 AAT_finland_diplomacy.28.t:0 "[ROOT.GetName] не може розраховувати на [FROM.GetAdjective]ий захист"
 AAT_finland_diplomacy_nordic:0 "нордичн"
 AAT_finland_the_white_death.2.b:0 "Пора з ними кінчати!"
 AAT_finland_winter_war.08.desc:0 "Ці дурні з держави [FROM.GetNameDef] відповіли відмовою на нашу щедру пропозицію миру. Їхній зневірений уряд чіпляється за абсурдну ідею про те, що ще здатен перемогти. Їхня верхівка усвідомлює, що якщо правда про істинний стан справ стане відома, їй доведеться мати справу з масовими повстаннями і, можливо, навіть з революцією.\n\nНаші солдати залишаються на полі бою, їхній дух, як і раніше, високий, вони знають, що б'ються за праве діло, і готові битися далі, не сумніваючись у власній перемозі."
 AAT_nordic_cooperation.5.t:0 "[FROM.GetAdjectiveCap]і інвестиції починають прибувати"
 AAT_norway.4.desc:0 "Розгадка [NOR.GetAdjective]их народних бід була прямо у нас під носом. [NOR_lev_trotsky.GetName] — не тільки один з найвидатніших марксистських письменників нашого часу, але й харизматичний революціонер та видатний полководець.\n\nЦе, звичайно, викличе деяку напругу з державою [SOV.GetNameDef], але воно того варте. Зрештою, його досвід може привести нашу молоду націю та робітників Скандинавії до величі."
 AAT_norway_allied.3.desc:0 "Незважаючи на наші зусилля, [FROM.GetAdjective]а адміністрація не буде допомагати нам розвивати промисловий потенціал, необхідний для захисту у випадку війни.\n\nМи повинні пам'ятати про це."
 AAT_norway_allied.4.a:0 "[NOR.NOR_carl_gustav_fleischer.GetName] буде сміливим вибором."
 AAT_norway_allied.4.desc:0 "Крістіан Локе служив у [NOR.GetAdjective]ій армії довгий час, і був призначений на посаду командувача майже десять років тому, в мирний час, і за роки до того, як ризик для нашої країни став очевидним.\n\nОскільки ми втратили будь-яку впевненість в його здібностях, якщо йому доведеться керувати зусиллями у воєнний час, його доведеться замінити, питання полягає в тому, хто приведе [NOR.GetName]і війська до перемоги?"
 AAT_norway_monarchist.4.t:0 "Матильда I, королева Норвегії"
 AAT_norway_monarchist.5.t:0 "Наміри регента"
 AAT_norway_rikstanken.3.b:0 "Це не варте нашого часу."
 AAT_norway_rikstanken.9.a:0 "Тепер [FROM.GetRulingIdeologyNoun_RU_lower_Nom] запанує."
 AAT_norway_rikstanken.9.desc:0 "[FROM.GetAdjectiveCap]е керівництво погодилося продати нам свої танки, а разом з ними приходить формальний договір, який зробить політику держави [ROOT.GetName] більш узгодженою з [FROM.GetAdjective]ими ідеалами [FROM.GetRulingIdeologyNoun_RU_lower_Gen], а отже, зробить нас ближчими один до одного."
 ABDA_events.4.t:0 "Оборона Сінгапуру"
 ABDA_keep_trade_open_desc:0 "Гума та нафта з [INS.GetNonIdeologyName] є критично важливими для військових зусиль Союзників. ABDACOM має захистити морські шляхи, якими перевозяться ці життєво важливі ресурси, оберігаючи конвої від ворожого перехоплення та підтримуючи потік торгівлі до наших підприємств."
 ABDA_keep_trade_open_modifier_tt:0 "Змінює §Y$ABDA_supreme_command$§! на:\n §G+10%§! Ефективність прикриття\n §G+10%§! Захист прикриття"
 ABDA_malay_barrier_modifier_tt:0 "Змінює §Y$ABDA_supreme_command$§! на:\n §G+15%§! Швидкість ремонту\n §G+10%§! Ефективність супроводу конвоїв"
 ABK_democratic_DEF:0 "Абхазія"
 ABK_fascism_ADJ:0 "Абхазьк"
 ACCLIMATIZATION_PENALTY_ENTRY:0 "  $NAME$: $PENALTY|%1=R$ £right_arrow£ $AFTER_RED|%1=Y$"
 ACE_FULL_NAME_WITH_CALLSIGN:0 "$NAME$ «$CALL$» $SUR$"
 ACE_PILOT_STATUS_ACTIVE:0 "§GАктивний§!"
 ACHIEVEMENTS:0 "Досягнення"
 ACTION_UNIT_MOVE:0 "$COUNT|H$ — рухаються"
 ADDRESS_STATE:0 "Регіон"
 ADD_AUTONOMY_SCORE_DESC:0 "Додає £autonomy_texticon $VALUE|H2$."
 ADU_fascism_DEF:0 "Кордовський халіфат"
 AFG_GATHERING_STORM_DESC:0 "Під владою короля Захір-шаха та його дядьків Афганістан вступає в епоху відносної стабільності. Але під поверхнею вічного королівства продовжують вирувати потоки гніву і недовіри. Дехто сподівається на радикальну модернізацію, яку намагається здійснити вигнаний Аманулла-хан, який, як дехто вважає, готується повернутися на свій трон. Тим часом інші вважають, що льодовиковий темп змін за часів Захір-шаха все ще надто швидкий і що держава потребує повернення до своїх традиційних коренів. Але, можливо, коли світ навколо дестабілізується, народ Афганістану зможе об'єднатися, щоб скористатися ситуацією"
 AFG_alternative_partnerships:0 "Шукати альтернативні партнерства"
 AFG_asymmetric_warfare:0 "Асиметрична війна"
 AFG_communism:0 "Демократична республіка Афганістан"
 AFG_cross_border_ties_category:0 "Транскордонні зв’язки"
 AFG_custail_pashtunwali_primacy_desc:0 "Традиційний моральний кодекс пуштунів, Пуштунвалі, не має місця в новій державі короля. Буде запроваджено нову низку законів, які закріплюють владу пуштунів, водночас модернізуючи цей застарілий набір кодексів."
 AFG_electrical_company_idea:0 "Кабульська електронна компанія"
 AFG_expand_quami_template_desc:0 "Система куамі, звичайно, добре служила нам протягом багатьох років, але є місце для вдосконалення. Реструктуризуючи підрозділи, коли вони набираються, вони зможуть краще захищати [AFG.GetNonIdeologyName]."
 AFG_expel_allied_nationals_desc:0 "Держави Осі представили нам сумнівні докази того, що нашому режиму загрожує узурпація з боку Союзників. Вони стверджують, що єдиний спосіб запобігти цьому — це вислати всіх громадян націй Союзників, щоб виявити будь-яких їхніх шпигунів у країні."
 AFG_forge_a_national_identity:0 "Сформувати національну ідентичність"
 AFG_from_the_ashes_desc:0 "Після розпаду Османської імперії в ісламському світі виник вакуум влади. Тепер, коли великі держави знову відволікаються на глобальний конфлікт, ми маємо можливість утвердити себе як переважну силу в ісламському світі."
 AFG_generic_american_1:0 "Джеймс Сміт"
 AFG_industrial_events.22.t:0 "$bftb_greece.194.t$"
 AFG_industrial_events.31.b:0 "Вода наша, і ми можемо робити з нею, що нам заманеться."
 AFG_industrial_events.53.desc:0 "Відволікаючись на більш нагальні проблеми в іншому місці, уряд [FROM.GetNameDef] погодився передати частину своєї території, де паштунські заворушення вийшли з-під контролю. Однак ми, можливо, непоправно погіршили стосунки з нашими [FROM.GetAdjective] сусідами через наше втручання в їхні внутрішні справи."
 AFG_introduce_national_service:0 "Запровадити національну службу"
 AFG_junaid_khan:0 "Джунаїд-хан"
 AFG_khorasan_buffer_state:0 "Створити буферну державу Хорасан"
 AFG_khorasan_buffer_state_desc:0 "З поточною загрозою [PER.GetNonIdeologyName] для наших військових зусиль, майже усуненою, ми повинні почати дивитися в майбутнє. Через історичну напругу між нашими націями та нашу участь в Операції «Зіткнення», ми повинні зробити кроки для створення буфера між собою та, можливо, мстивим [PER.GetAdjective] урядом майбутнього."
 AFG_officialize_the_turkish_afghan_defense_treaty_desc:0 "З 1933 року турецький військовий персонал допомагав навчати наступне покоління афганських солдатів. Настав час використати ці зв'язки, запросити оборонний договір, у якому ми обидва були б зобов'язані захищати одне одного від іноземної агресії."
 AFG_political_events.110.b:0 "Ми не поступимося ні на дюйм."
 AFG_political_events.130.desc:0 "Уряд [FROM.GetNonIdeologyName] проконсультувався з нами щодо пропозиції зміцнити свою націю шляхом формування конфедерації з частиною нашої території вздовж [ROOT.GetAdjective] кордону. Це призведе до коригування наших кордонів, але може допомогти створити сильного союзника в регіоні."
 AFG_political_events.41.t:0 "[FROM.GetNameDefCap] погоджується на вимоги"
 AFG_political_events.54.t:0 "Надходить [GER.GetAdjectiveCap] підтримка"
 AFG_political_events.81.t:0 "[FROM.GetNameDefCap] погоджується приєднатися"
 AFG_political_events.95.t:0 "[GER.GetAdjectiveCap] війська активні в [FROM.GetNonIdeologyName]"
 AFG_promote_the_counter_elite:0 "Просувати контр-еліту"
 AFG_propose_oil_concession_deal:0 "Запропонувати угоду про нафтові концесії §Y[FROM.GetName]§!"
 AFG_recruit_turkestan_legion:0 "Набрати Туркестанський легіон у §Y[FROM.GetName]§!"
 AFG_reform_1:0 "Освітня реформа"
 AFG_scavenging_desc:0 "Обладнання, яке ми не можемо виробляти самі, часто з'являється тут у руках іноземних агресорів. Тому ми повинні навчити наші сили розпізнавати та захоплювати цінне військове обладнання, коли воно доступне."
 AFG_secure_army_support_tt:0 "§YБільше армійських дивізій приєднається до нашого боку у майбутній громадянській війні.§!"
 AFG_sher_khan_nashir:0 "Шер-хан Нашір"
 AFG_support_nort_west_frontier_rebels:0 "Підтримати повстанців Північно-Західного кордону"
 AFG_support_weapons:0 "Vickers MG & Stokes mortar"
 AFG_utilize_cameleers_desc:0 "Наші погоничі верблюдів були експортовані далеко за межі країни, їх наймала Британська імперія для подорожей та постачання у небезпечні регіони Великої австралійської пустелі. Ми повинні найняти цих кваліфікованих робітників, щоб вони допомагали нашим військам на наших власних землях."
 AGGRESSIVE_MED:0 "§HЗвичайний режим§!"
 AGGRESSORS:0 "§TАгресори§!"
 AIRBASE_CAPACITY_LIMITED_BY_DAMAGE:0 "§RМісткість обмежена пошкодженнями!§!"
 AIRWING_DEPLOYMENT_CANCELED:0 "Розгортання скасоване, повернення в резерви ($PERC|%H$, очікуване прибуття:$ETA|%H$)"
 AIRWING_MISSION_NIGHT_BOMBING_DESC:0 "\n\nПри виконанні цього завдання вночі, у літаків є менший шанс бути поміченими, але вони отримують штраф до виконання завдань."
 AIRWING_MISSION_SET_REINF_LIMIT_RCLICK:0 "§GКлацніть ПКМ, щоб установити межу на поточну кількість літаків.§!"
 AIRWING_MISSION_TYPE_AIR_SUPERIORITY_DESC:0 "Намагатися досягти переваги в повітрі, вступаючи в бій із передусім ворожими винищувачами, а далі ворожими бомбардувальниками й іншими літаками."
 AIRWING_MISSION_TYPE_NAVAL_PATROL_DESC:0 "Патрулювати море, не вступаючи в бій із ворожими кораблями, та допомагати помічати ворогів дружнім оперативним групам, які патрулюють область."
 AIRWING_MISSION_TYPE_PORT_STRIKE:0 "Удар по портах"
 AIRWING_MISSION_TYPE_RECON_DESC:0 "Проводити повітряну розвідку та збір розвідданих.\n\nНерозвідувальні літаки можуть виконувати це завдання лише на підконтрольних ворогу землях."
 AIRWING_MISSION_TYPE_STRATEGIC_BOMBER_DESC:0 "Бомбардувати ворожі споруди, інфраструктуру та промисловість."
 AIRWING_MOVE_EQUIPMENT_DESC:0 "Перемістити §H1§! оснащення\n§GCtrl + клацніть, щоби перемістити §H10§!§!\n§GShift + клацніть, щоби перемістити §H100§!§!"
 AIR_CAN_NOT_PERFORM_PORT_STRIKE:0 "§RЗавдання не буде виконуватися§!\nВорожа §Yперевага в повітрі§!: $CURRENT|H2%$.\nДля завдання потрібно щонайбільше $REQUIRED|H2%$."
 AIR_INVASION_PLAN_CAP_REACHED:0 "§RДосягнуто межі планів повітряного десанту ($CAP|Y$).§!"
 AIR_OVERVIEW_CATEGORY_5:0 "Ми маємо $COUNT|H$ §Hстратегічних бомбардувальників§! у нашій авіації:"
