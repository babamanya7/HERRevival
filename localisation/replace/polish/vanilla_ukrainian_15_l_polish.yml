 AST_diplomatic_events.2.t:0 "Опір Тихоокеанському пакту"
 AST_diplomatic_events.27.a:0 "Тим не менш, Австралія вистоїть."
 AST_diplomatic_events.36.desc:0 "[JAP.GetNameDefCap] не погоджується розділити тихоокеанські території між нашими двома націями; японський уряд буде розширюватися так, як вважає за потрібне."
 AST_diplomatic_events.37.desc:0 "З невідомих причин [AST.GetName] вирішила передати контроль над нашими землями до [JAP.GetNameDef]. Щось зловісне назріває за лаштунками, і це лише питання часу, коли світ дізнається, що саме."
