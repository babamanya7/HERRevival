 FRA_disunite_germany_tt:0 "§YКонтинентальну систему§! буде перейменовано на §YРайнську конфедерацію§!."
 FRA_eugene_schneider_ii:0 "Ежен Шнайдер II"
 FRA_form_the_popular_front:0 "Створити Народний фронт"
 FRA_french_union_desc:0 "Настав час проголосити нову Францію, Францію, яка охоплює земну кулю, в якій об'єднані всі частини нашого царства. Ми проведемо референдуми в кожній частині, щоб підтвердити волю людей стати частиною цієї нової, великої Франції."
 FRA_heavy_cruiser_2_desc:0 "Важкий крейсер типу Algérie був подальшим удосконаленням попередніх класів Suffren і Duquesne, але розроблений, щоби стати противником нових італійських важких крейсерів класу Zara. Істотно посилено як основний броньовий пояс, так і підводний захист. Його зенітне озброєння відповідає своєму часу, але через ці зміни стандартна водотоннажність перевищує 10 000 тонн."
 FRA_heavy_cruiser_3_desc:0 "Важкі крейсери типу Saint Louis базувалися на класі Algérie, але загальний вигляд був ближчим до головних кораблів класу Dunkerque і Richelieu. У військово-морській програмі 1940 року було замовлено три кораблі, але у зв'язку з падінням Франції жоден із них не був закладений. Вони поставили б нові гармати та поліпшили зенітне озброєння, але броня була б такою ж, як на класі Algérie. Це був останній важкий крейсер конструкції ВМС Франції."
 FRA_heavy_fighter_equipment_3_short:0 "Bre 700 C2"
 FRA_heavy_fighter_focus_desc:0 "Наші важкі винищувачі мусимо бути здатні підтримати вразливіші бомбардувальники. Їм потрібно поліпшити озброєння та підвищити дальність польоту, нехай навіть ціною швидкості."
 FRA_henri_edmond_fouche:0 "Анрі-Едмон Фуше"
 FRA_improved_screen_ships:0 "Поліпшені кораблі прикриття"
 FRA_improved_screen_ships_desc:0 "Есмінці та легкі крейсери відіграють ключову роль у захисті більш важких лінкорів та авіаносців. Якщо ми втратимо свою лінію оборони, то ризикуємо втратити всі судна та особовий склад. Наші кораблі мають бути найсучаснішими."
 FRA_indochina_intervention.1.a:0 "Важливий успіх."
 FRA_invest_in_our_weaker_allies:0 "Інвестувати в наших слабших союзників"
