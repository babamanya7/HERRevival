 SOV_rebuild_the_far_eastern_fleet:0 "Відбудувати Далекосхідний флот"
 SOV_relocate_industry_from_moscow_desc:0 "Евакуація важкого машинобудування наших московських заводів на Урал — це величезна справа, але вона необхідна для забезпечення нашого військового виробництва."
 SOV_research_city_experiment:0 "Експеримент наукоградів"
