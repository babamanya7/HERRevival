 SUBDOCTRINE_DEEP_AIR_RAIDS_DESC:0 "З правильним обладнанням і навчанням, немає цілі, яка була б надто глибоко у ворожому тилу, щоб по ній не завдати удару. Ворог дізнається, що жодне місце не захищене від наших бомб."
 SUBDOCTRINE_ESCORT_FIGHTER_DESC:0 "Щоб наші ударні літаки діяли безкарно, необхідно, щоб їх тісно підтримували винищувачі, які очищують небо від ворожої авіації."
