 mexico.14.a:0 "Можливо, [From.GetAdjective]а влада нам зовсім не друг."
 mexico.16.b:0 "Такий капіталізм."
 mexico.19.f:0 "Франсіско Мухіка, революційний генерал та соціальний реформатор."
 mexico.19.o:0 "Хуан Андреу Альмасан, правий підприємець та революційний генерал."
 mexico.40.title:0 "Операція «Справедлива справа» пройшла успішно"
 mexico.53.desc:0 "Ми довго вірили, що наші лідери несли в маси правильне тлумачення праць Маркса, Енгельса та Леніна, але тепер вони змушені були розглянути власні твердження критично та публічно визнати, що єдино правильний шлях до тріумфу соціалізму описаний в інтерпретації Леніна Троцьким: Через це ми раптово опинилися в ізоляції. Наш союз зруйнований, і ми стоїмо перед корнеліанською дилемою: визнати правильність поглядів Троцького або залишитися в ізоляції та потрапити в немилість партії [MEX.GetFactionName]."
