 SWE_mines:0 "$SWE_blow_up_the_mines$"
 SWE_national_socialist_range:0 "Націонал-соціалісти при владі"
 SWE_nordic_defense_council_group_desc:0 "Цілком природно, що ми, як союзники, ділимося один з одним своїми проривами та інноваціями."
 SWE_operation_save_norway:0 "Операція «Порятунок Норвегії»"
 SWE_peoples_commissar_for_defense_desc:0 "Колись усі кордони зникнуть, коли робітники всього світу об'єднаються. До цього дня ми повинні залишатися пильними та готовими до будь-якого вторгнення на нашу територію. Щоб контролювати нашу оборону, нам потрібно створити нову оборону міністерство, вільне від впливу колишніх аристократів."
 SWE_refit_gotaverken_for_rapid_repairs:0 "Перемонтувати Götaverken для швидкого ремонту"
 SWE_refit_gotaverken_for_rapid_repairs_desc:0 "Призначення верфей для ремонту може зменшити швидкість, з якою ми можемо будувати кораблі, але це суттєво покращить нашу здатність підтримувати флот у бойовому стані."
 SWE_special_forces:0 "Інвестувати в ССО"
 SWE_starve_the_fascists_of_iron:0 "Позбавити наших ворогів заліза"
 SWE_swedish_finnish_defense_agreement_desc:0 "Поки загроза [SOV.GetNameDef] не буде усунена, у наших інтересах співпрацювати з [FIN.GetAdjective]ими силами у військовій сфері. Одного дня ми повернемо їх під нашу владу, але зараз у нас є серйозніші проблеми з чим боротися."
 SWE_the_new_order:0 "Новий порядок"
