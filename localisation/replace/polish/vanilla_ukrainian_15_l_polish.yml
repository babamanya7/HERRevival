 IRE_douglas_hyde:0 "Douglas Hyde"
 IRQ_assassination_of_sidqi_desc_not_leader:0 "Бакра Сідкі явно планує державний переворот проти нашого уряду, і багато наших офіцерів повідомляють, що він робить кроки, щоб заручитися їхньою лояльністю на випадок такої події. Нам доведеться усунути його, якщо ми хочемо зберегти наше правління."
 IRQ_decouple_from_the_pound_desc:0 "Наша валюта залишається прив'язаною до Британського фунта стерлінгів, що обмежує нашу здатність запроваджувати економічні політики, які відповідають нашим потребам. Ми повинні розірвати цей зв'язок та створити власну валютну раду для контролю над динаром."
 IRQ_demand_palestine:0 "Вимагати Палестину"
 IRQ_fligerfuhrer_irak:0 "Fliegerführer Irak"
 IRQ_golden_square_desc:0 "Золотий квадрат, кліка високопоставлених іракських військових офіцерів, залишається загрозою для стабільності нації. Їхні симпатії схиляються до антибританських режимів Європи, і вони покладають надії на те, що ці режими допоможуть скинути ярмо британського впливу, коли з’явиться така можливість."
