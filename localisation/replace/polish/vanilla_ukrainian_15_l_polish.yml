 infantry_equipment_2_short:0 "Зброя II"
 infiltration_paradrop_desc:0 "Агенти будуть скинуті з парашутами в район завдання вночі та з малої висоти, що допоможе уникнути зустрічі з винищувачами супротивника."
 infrastructure_effort_2_desc:0 "Подальше розширення нашої інфраструктури дозволить задіяти транспорту та комунікацію, необхідну для високотехнологічних таємних проєктів."
 inspirational_bagpiper_desc:0 "Цей командир наполягає, що носити з собою на битву волинку, лук і широкий меч — це єдиний правильний спосіб вести війну. Справді надихає."
 integrated_convoy_defence_desc:0 "Тісніша координація зусиль авіації та флоту дозволяє нам атакувати ворогів задовго до того, як вони наблизяться до наших торгових суден. Це різко підвищує ефективність кораблів супроводу."
