 BEL_naval_doctrine_desc:0 "Наші цивільні тренери можуть навчити нас лише так багато, щоб справді розширити наше розуміння морських справ, ми повинні звернутися до іноземних фахівців, щоб покращити наші знання та можливості навчання."
 BEL_port_of_antwerp:0 "Порт Антверпен"
 BEL_pressurized_cabins_ns_desc:0 "Для того, щоб наблизити Бельгію до наших колоніальних володінь у Конго, ми стали піонерами у використанні пресуризованих кабін для наших літаків."
 BEL_royal_intervention:0 "Королівське втручання"
 BEL_the_council_of_europe_desc:0 "Все більш очевидно, що нейтралітет не є захистом від військового експансіонізму агресивних сусідів. Тому єдиним способом забезпечити мир в Європі є єдність. Ми повинні зібрати дипломатів і глав держав за одним столом і заснувати Раду Європи."
