 hq_paratrooper_desc:0 "Дозволяє штабу безпосередньо брати участь у повітряно-десантних операціях, а також забезпечує додаткову охорону."
 hq_recon_desc:0 "Збирає та аналізує розвідувальні дані, отримані з поля бою."
 hq_support_company_desc:0 "Спеціальна штабна рота забезпечення, яка адмініструє та підтримує діяльність з'єднання."
