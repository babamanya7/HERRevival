 SPR_new_leadership:0 "Нове керівництво"
 SPR_red_bulwark_in_the_west:0 "Червоний оплот на Заході"
 SPR_repair_and_expand_the_dockyards:0 "Відремонтувати та розширити верфі"
 SPR_secure_democratic_principles:0 "Забезпечити демократичні принципи"
 SPR_ship_armor_cruiser_1:0 "50-мм пояс/38-мм палуба"
