 LAT_GATHERING_STORM_DESC:0 "Минуло два роки після травневого перевороту, а Латвія залишається в невизначеному стані. Карліс Улманіс, який колись обіймав посаду прем'єр-міністра Латвії, тепер називає себе диктатором, а прихильники демократів різко виступають проти цього нападу на свободу Латвії. Фашистська організація «Pērkonkrusts» схвилювалася арештом свого лідера Густавса Целміньша, і якщо диктатура швидко не знищить цю загрозу, Латвія ризикує громадянською війною.\n\nЗ загрозами на сході та на заході Латвія опиняється на лезі бритви між перемогою та забуттям."
 LAT_aizsargi_desc:0 "Айзсарги, створені тимчасовим урядом у 1919 року, — офіційне урядове воєнізоване угруповання. За підтримку перевороту Улманіса його слід всіляко підтримати."
