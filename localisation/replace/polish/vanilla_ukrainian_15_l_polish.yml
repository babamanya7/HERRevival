 SOV_a_global_class_struggle_decision_tt:0 "Відмикає рішення §YРозбудити пролетаріат§!, спрямовані на дестабілізацію європейських сусідів та виправдання війни проти них."
 SOV_accepted_OKMO:0 "[SOV.GetNameDefCap] надіслав команду від $okmo$."
 SOV_agents_in_the_stalinist_command_poum_desc:0 "Радянській правій опозиції вдалося проникнути кількох агентів серед останньої групи військових радників, надісланих до Іспанської Республіки лідером СРСР, [SOU.GetLeader]. Ці агенти створили мережу інформаторів, яка дозволяє нам дізнаватися про плани противника ще до їх реалізації."
 SOV_agreed_anglo_soviet_invasion_of_iran_flag:0 "Узгоджено спільне англо-радянське вторгнення в Іран"
 SOV_alexander_rado:0 "Олександр Радо"
 SOV_assassinate_stalin_outcome_tt:0 "---\nЯкщо спроба буде успішною, §Y$SOV_lavrenty_beriya$! візьме тимчасовий контроль, створюючи можливість для успішного перевороту.\nЯкщо спроба провалиться, $SOV_paranoia_very_high_increase_effect_tt$."
 SOV_autonomy_colony:0 "$OVERLORDADJ$а Росія"
 SOV_baltic_security:0 "Балтійська безпека"
 SOV_battle_cruiser_1_desc:0 "The Borodino-class battlecruisers were class of four vessels authorized in 1914, just before WWI. They were based on the Imperatritsa Mariya class battleships. They followed the contemporary Russian capital ship building practices of using four triple turrets to house the heavy main armament, strong secondary armament in casemates, and an overall flush-deck. They had a low profile with low draught to fight in the shallow waters of the Baltic Sea. Like many Russian ships of this period, the outbreak of WWI and the Russian Revolution doomed these ships from ever being finished."
 SOV_behead_the_snake_lar_has_agency:0 "."
