 TUR_VICTORY_POINTS_6727:0 "Аккерман"
 TUR_balkan_defense_council_desc:0 "Усі країни Балканської Антанти близько знайомі з війною. Ми знаємо, що не можемо починати загарбницьку війну, і тому маємо спільно утворити найпотужніший оборонний союз."
 TUR_britain_stands_up_for_turkey_tt:0 "\n§Y[TUR.GetNameDef]§! отримає нашу підтримку, навіть якщо це призведе до війни. Держава §R[SOV.GetNameDefCap] матиме останню можливість розрядити обстановку!§!"
 TUR_collectivising_our_agriculture_desc:0 "[ROOT.GetNameDef] багато в чому покладається на сільське господарство. Досить дармоїдам-гнобителям зневажати тих, хто обробляє землю власними руками. Відтепер фермер сам оцінює свою працю та контролює засоби виробництва."
 TUR_counter_the_rebels_in_van_desc:0 "Ван — одна з наших східних областей. Він практично у всьому відрізняється від західних областей."
 TUR_crowning_ourselves_with_the_fin_ugor_desc:0 "Для тураністів [FIN.GetNameDef] цінніше будь-яких коштовностей. Завоювати [FIN.GetAdjective] землі — межа бажань, і ми щиро віримо, що, досягнувши його, братерство тураністів досягне досконалості."
