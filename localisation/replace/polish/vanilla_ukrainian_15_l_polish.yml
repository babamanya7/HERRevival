 anglo_mexican_technical_mission_desc:0 "Програма взаємного обміну технологіями та інноваціями між Мексикою та Великою Британією."
 anti_revisionism_desc:0 "Антиревізіонізм — реакція на багато ідеологій, що постулюють себе наступниками марксизму, і прагнення дотримуватися ключових положень початкової революційної теорії. Здебільшого він протистоїть включенню капіталістичних економічних елементів до соціалістичних держав і визначає себе через їх заперечення."
 apply_integration_effects_retroactively:0 "\nЦе буде §Hзворотним числом§! застосовано до всіх областей, у яких це рішення було прийнято раніше."
 architect_of_finnish_coporatism:0 "Архітектор фінського корпоративізму"
 armored_car_recon_desc:0 "Розвідрота, забезпечена бронемашинами, може нав'язувати бій ворогові і не давати ворожим розвідникам збирати цінну інформацію."
 army_intel_to_others_tt:0 " $MODIFIER_ARMY_INTEL_TO_OTHERS$: $RIGHT|-=%%1$"
 army_leader_start_defense_level_tt:0 " $MODIFIER_ARMY_LEADER_START_DEFENSE_LEVEL$: $RIGHT|G=0$"
 army_org_factor_tt:0 " $MODIFIER_ARMY_ORG_FACTOR$: $RIGHT|+=%1$"
 army_primancy_focus_desc:0 "Якщо вважати, що в імперії дві руки — армія і флот, то немає сумнівів, яка з них важливіша і сильніша! Армія захоплює землю та утримує її... А що може флот? Якщо визнати цей простий факт і надати армії більше ресурсів, наші можливості будуть безмежні."
 assault_gun_manufacturer:0 "Виробник штурмових гармат"
 autarkic_economy:0 "Автаркія"
 ban_communist_party_desc:0 "Комуністична партія не перестає протестувати проти уряду на кожному кроці, сіючи невдоволення й ускладнення нашого управління. Час розправитися з цим."
 basic_decryption_desc:0 "Криптоаналіз стає серйозною математичною наукою. Системи на кшталт каталожних карток і пристрої, подібні до циклометрів, допомагають у роботі."
 basic_naval_mines:0 "Контактні міни"
 basileus:0 "Василевс"
 battle_cruiser_1:0 "Лінійний крейсер I"
 bba_news.0.desc:0 "Із оголошенням війни державою [?global.LoN_attacker_country.GetNameDef] державі [?global.LoN_defender_country.GetNameDef], Лізі Націй не вдалося зберегти мир. [?global.LoN_attacker_country.GetLeader] відкрито висміяв неспроможність Ліги зробити що-небудь, і за тим вивів країну з Ліги. Інші світові лідери засумнівалися з суті Ліги Націй, якщо та не може уникнути конфліктів, і цим доба Ліги фактично скінчилася.\nХоча Рада Ліги продовжує організовувати зустрічі, ніхто більше не ні на що не сподівається. Якою би повагою Рада не тішилася раніше, від неї нічого не лишилося."
 bba_news.1.t:0 "[SOV.GetName] вимагає закінчити війну в Ефіопії"
 bba_news.100.desc_many_purged:0 "Кілька високопоставлених членів фашистської партії нещодавно були усунуті від влади, оскільки [Root.GetLeader] стає абсолютним лідером держави [ROOT.GetNameDef]. Ця чистка усуває абияких можливих союзників старого дуче, Беніто Муссоліні, а відтак будь-які надії на те, що він знову стане лідером Італії."
 bba_news.110.b:0 "Ми мусимо стабілізувати ситуацію!"
 bba_news.111.desc:0 "[GetAnarchistConfederationEventDesc]"
 bba_news.2.t:0 "[ITA.GetName] погоджується на мирну угоду з державою [ETH.GetNameDef]"
 bftb_bulgaria_balkan_federation.4.desc:0 "[BUL.GetAdjectiveCap]і активісти проникли крізь кордон нашої країни, щоб озброїти прихильників Балканської федерації в державі [ROOT.GetNameDef] і влаштувати безлади в країні. \nПоліція вдень і вночі шукає ці підриви в'язниці, але поки що їх зусилля не приносять особливих результатів. Багато [ROOT.GetAdjective]их громадян, особливо представників робітничого класу, приєднуються до прихильників [BUL.GetAdjective]ого проєкту Балканської федерації."
 bftb_bulgaria_balkan_federation.8.a:0 "Ми мусимо надати економічну допомогу [FROM.GetAdjective]ій державі."
 bftb_bulgaria_democratic_international_policies.6.desc:0 "На жаль, наша делегація в державу [ENG.GetNameDef] не зуміла переконати [ENG.GetAdjective]ий уряд передати нам адміністративний контроль над колишніми болгарськими територіями, окупованими військами Союзників."
 bftb_bulgaria_democratic_international_policies.6.t:0 "[ENG.GetNameDefCap] відмовляється визнати територіальну цілісність Болгарії"
 bftb_bulgaria_equipment_purchases.2.b_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_mechanized]§! од. §Yбронетранспортерів§!"
 bftb_bulgaria_equipment_purchases.3.b:0 "Закупити середню бронетехніку"
 bftb_bulgaria_factions.64.a:0 "Яке розчарування..."
 bftb_bulgaria_fate_of_the_balkans.7.b:0 "[ROOT.GetNameDefCap] нізащо не здасться чужинцям!"
 bftb_bulgaria_fatherland_front.2.desc_partisans_gre:0 "грецькі"
 bftb_bulgaria_german_influence.5.t:0 "[BUL.GetLeader] погоджується замінити Кьосеіванова"
 bftb_bulgaria_german_influence.7.desc:0 "Дипломат із держави [GER.GetNameDef] сьогодні прибув до міста [ROOT.Capital.GetCapitalVictoryPointName], щоб пред'явити свої вимоги: [ROOT.GetNameDef] мусить забезпечити безперешкодний прохід для [GER.GetAdjective]их військ.\nДля проведення бойових операцій на Балканах [GER.GetAdjective]им військам необхідно пройти крізь землі держави [ROOT.GetNameDef] до кордону з нашими сусідами Якщо [ROOT.GetNameDef] стане перешкодою на шляху [GER.GetAdjective]ої військової машини, [GER.GetLeader] не зрадіє..."
 bftb_bulgaria_german_influence.9.desc:0 "Ми відправили дипломата до міста [BUL.Capital.GetCapitalVictoryPointName], щоб обговорити використання [BUL.GetAdjective]ої території як плацдарм наших військ. Результат невтішний: [BUL.GetLeader] відмовляється пропускати [ROOT.GetAdjective]і війська на свою територію, і це ставить під загрозу наші операції на Балканах в найближчому майбутньому. і ніколи вже не стане могутньою балканською державою."
 bftb_bulgaria_imro.1.t:0 "ВМРО повернулася!"
 bftb_bulgaria_nationalization.1.desc_regency_council:0 "Богдан Філов та [BUL.GetLeader]"
 bftb_bulgaria_rearmament.7.a:0 "Погрозами нас не взяти!"
 bftb_bulgaria_soviet_influence.5.t:0 "[FROM.GetNameDefCap] піддається [ROOT.GetAdjective]ому тиску"
 bftb_greece.1.a:0 "Велика перемога для Греції..."
 bftb_greece.1.desc:0 "Греки були анітрохи не здивовані, коли дізналися, що консерватори, лояльні королю Георгу II, виграли грецькі вибори 1936. Очікується, що прем'єр-міністр Константінос Демердзіс збереже за собою свою посаду. Сам король вважає, що робота Демердзіса на посаді прем'єра буде довгою і успішною. Лише час покаже, чи мав рацію король у своїх припущеннях..."
 bftb_greece.11.a:0 "Добром це не скінчиться. Конвенцію треба скасувати."
 bftb_greece.186.c:0 "Ну ні, від васальної залежності так просто не втекти!"
 bftb_greece.57.t:0 "[CYP.GetNameDefCap] відхиляє пропозицію енозісу!"
 bftb_greece.58.desc:0 "[FROM.GetAdjectiveCap]ий делегат прибув до нас, щоб обговорити майбутнє кіпрської королівської колонії. [FROM.GetAdjectiveCap]ий представник заявив, що спроби побудувати кіпрську націю приречені на провал, оскільки кіпрський народ насправді — [FROM.GetAdjective]ий народ.\n\n[FROM.GetAdjectiveCap]ий посланець пред'явив лист від [FROM.GetAdjective]ого прем'єр-міністра, в якому [FROM.GetLeader] докладно викладає історію концепції так званої енозісу і закликає до союзу Кіпру та держави [FROM.GetNameDef]. [FROM.GetAdjectiveCap]ий делегат спробував запевнити нашого представника, що справа тут не в грубому іредентизмі з [FROM.GetAdjective]ого боку, що Кіпр і [FROM.GetNameDef] ділять загальну культурну спадщину, історію, мову і, в [FROM.GetAdjective]ій перспективі, спільну долю.\n\nНаші військові чиновники підкреслили важливість Кіпру як стратегічної військової бази в Середземномор'ї, радники ж із зовнішньої політики відзначають, що сильний [FROM.GetAdjective]ий союзник сам собою означає ого більше, ніж дасть нам Кіпр у ролі авіабази та морської бази. Вибір в кінцевому рахунку повинен буде прийняти [ROOT.GetAdjective]ий кабінет міністрів, але слід простежити, щоб [FROM.GetAdjective]ий представник не чекав нашої відповіді надто довго."
 bftb_greece.60.desc:0 "[FROM.GetAdjectiveCap]ий уряд запропонував цікавий компроміс у відповідь на нашу початкову пропозицію енозісу. Вони готові виконати наше прохання за умови, що ми співпрацюватимемо з кіпрським урядом, надавши йому той самий статус, що й [FROM.GetAdjective]ому домініону. Не сказати, що такий поворот подій поганий, але все ж таки він... несподіваний. Захищаючи цю націю, вони в майбутньому розглянуть можливість повного енозісу."
 bftb_greece.8.b:0 "Це призведе до дестабілізації всього Середземномор'я!"
 bftb_news.10.b:0 "Чи це потребує [THIS.GetNameDef]?"
 bftb_news.13.t:0 "[SOV.GetAdjective]о-[BUL.GetAdjective]ий договір про взаємодопомогу"
 bftb_news.14.t:0 "Договір про вічну дружбу на Балканах"
 bftb_news.2.t:0 "[BUL.GetAdjective]ий уряд підтримує ВМРО"
 bftb_news.203.t:0 "[TUR.GetAdjectiveCap]о-[SOV.GetAdjective]а війна"
 bftb_news.208.desc:0 "[TUR.GetNameDefCap] повідомляє про свої наміри переглянути національні кордони та повернути їх до стану до принесення Національної клятви. [TUR.GetAdjective]ий уряд заявив про претензії на всі сусідні регіони та не побажав відмовлятися від них.\n\nМіжнародне співтовариство в цілому засуджує [TUR.GetAdjective]у адміністрацію за подібне рішення, і багато хто побоюється, що безрозсудні дії [TUR.GetAdjective]ого керівництва лише загострять і без того непросту світову обстановку, що склалася останніми роками. [TUR.GetNameDefCap] стає на шлях реваншизму, але тільки час покаже, якими будуть наслідки обраного курсу."
 bftb_news.209.b:0 "Як?.."
 bftb_news.302.a:0 "Нарешті наша мрія здійснилася!"
 bftb_news.302.b:0 "Зазвичай ми не схвалюємо подібну поведінку, але..."
 bftb_news.4.c:0 "Несподіваний поворот подій..."
 bftb_news.5.desc:0 "[BUL.GetAdjective]ий уряд розпочав масштабну кампанію з реінтеграції окупованих балканських територій, заохочуючи розселення болгарських переселенців, змінюючи назви міст і місць на традиційні болгарські та перебудовуючи управління землями за зразком Болгарії.\nТаким чином [BUL.GetLeader] сподівається продемонструвати болгарську природу цих регіонів і надати законність їхній майбутній анексії державою [BUL.GetNameDef]."
 bftb_turkey.111.t:0 "Заколотники перемогли в області [TUR_kurdish_state_event_target.GetName]"
 bftb_turkey.139.a:0 "Ми їх попереджали!"
 bftb_turkey.24.h:0 "Тільки Ісмет Іньоню може заснувати унікальний [TUR.GetAdjective]ий соціалізм."
 bftb_turkey.3.desc:0 "[ENG.GetLeader] написав великий лист, адресатом якого став сам [TUR.GetLeader]. У листі йдеться, що [ENG.GetNameDef] зараз не може дозволити собі вплутуватися в міжнародну кризу. Причинами відмови [ENG.GetLeader] оголосив недостатню громадську підтримку війни в державі [ENG.GetNameDef] та власну невпевненість у [TUR.GetAdjective] готовності воювати проти держави [SOV.GetNameDef].\n\n[ENG.GetName] визнає наш контроль над Турецькими протоками, але у цьому вся підтримка закінчується."
 bftb_turkey.37.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 bftb_turkey.57.a:0 "Добре, дайте імперіалістичним мерзотникам те, що вони хочуть."
 bftb_turkey.75.b:0 "Ця нафта не повинна потрапити до рук фашистів!"
 bftb_turkey.75.e:0 "Це їхнє право як суверенної нації."
 bftb_turkey.8.desc:0 "[SOV.GetName] заперечує план держави [TUR.GetNameDef] щодо повернення контролю за протоками, але [TUR.GetNameDef] не реагує на [SOV.GetAdjective] загрози. [TUR.GetNameDef] прагне затвердити свій суверенітет, [SOV.GetNameDef] бажає домінувати в регіоні, і ситуація загрожує вилитися в збройний конфлікт., або вмити руки і спостерігати, як обидві країни лавірують, щоб уникнути зіткнення, якого самі ж і прийшли."
 bftb_turkey.84.t:0 "[FROM.GetNameDefCap] вимагає нашої покірності"
 bftb_turkey.88.a:0 "Ми перемогли!"
 bftb_turkey.88.desc:0 "«Тріумф» — ось слово, що добре описує настрої в наших верхах. [FROM.GetAdjectiveCap]і уряд і збройні сили відступили і намагаються загасити конфлікт на користь [ROOT.GetAdjective] народу."
