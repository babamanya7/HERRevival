 SOV_secure_moscow_opposition_desc:0 "Використати наші зв'язки в Москві, щоби переконатися, що партизани піднімуть повстання в цьому районі, намагаючись захопити столицю."
 SOV_set_up_puppet_state_in_turkey:0 "Установити маріонеткову державу в Туреччині"
 SOV_socialist_emulation_desc:0 "У капіталістичній системі робітники мусять конкурувати один з одним, щоб заробити собі на хліб насущний, тоді як власники фабрик отримують вигоду від будь-яких удосконалень, зроблених робітниками, що призводять до підвищення продуктивності праці. Це марнотратно і негуманно. Соціалістична система дозволить тим, хто ще не є найкращим, отримати підтримку, необхідну для розвитку своїх здібностей, навчаючись у тих, хто досягає успіху."
