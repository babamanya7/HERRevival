 CHI_army_reform_desc:0 "В армії на всіх рівнях панують корупція, некомпетентність та боягузтво. Виправлення ситуації буде нешвидким та нелегким процесом."
 CHI_bog_them_down_in_the_centre_desc:0 "Ми знаємо, що не можемо зупинити [JAP.GetNameDef] на кордоні, і що нам потрібно ретельно вибрати іншу лінію оборони. Зосередження навколо річки Янцзи було б ефективним способом зупинити агресорів і зробити цей район опорою всієї нашої оборони. Однак процес планування нашої оборони для конкретних районів йде далі."
 CHI_border_clashes_desc:0 "Місцевість Китаю змушує кожного ретельно вибирати свої битви. Це дає нам можливість захопити деякі вразливі території, не вступаючи в повну війну."
 CHI_concessions_docking_rights:0 "Запропонувати права на швартування, щоб виграти час"
 CHI_conserve_our_pilots_desc:0 "Пілотів нелегко замінити. Зменшуючи ризики та підвищуючи виживаність, ми зберігаємо досвід і підтримуємо боєздатність."
 CHI_counter_infiltration_measures_level_3:0 "$CHI_counter_infiltration_measures$"
 CHI_cradle_of_civilization_desc:0 "З мулистих вод Хуанхе виникла цивілізація, яка сформувала людство. Імперії піднімаються і падають, але слава стародавнього Китаю сяє над землею вічно, і так само буде з нашою вищістю."
 CHI_destroyer_1_desc:0 "The Jianwei-class was a class of large torpedo boats built for the Nationalist Chinese navy and commissioned in 1904. Two ships of the class were modernized and still in service at the time of the Japanese invasion. Once modernized, they displaced 870 tons and were armed with two 4.7 in. main guns."
