 TUR_battle_cruiser_1:0 "Клас «Yavuz»"
 TUR_border_conflicts_in_trabzon_tt:0 "Розумно було б розмістити війська вздовж кордону з областями §Y[354.GetName]§! і §Y[187.GetName]§!, доки не почалося чергове неминуче загострення."
 TUR_carve_up_greece_desc:0 "На жаль, в найближчому майбутньому [GRE.GetNameDef] не зможе пережити цю епоху, залишаючись незалежною державою. Тут немає жодного злого наміру — ми діємо виключно заради виживання. Світ знову запанує на Егейському узбережжі, але не в цю жорстоку, невблаганну епоху."
 TUR_construct_the_zonguldak_coal_refinery_desc:0 "$TUR_open_the_nazilli_callico_factory_desc$"
 TUR_continue_to_prioritise_balkan_integrity:0 "Продовжити акцент на цілісності Балкан"
 TUR_covenant_of_the_mediterranean:0 "Середземноморський ковенант"
 TUR_destroyer_1_desc:0 "The Peyk-class consisted of a pair of large, fast torpedo boats commissioned for the Ottoman Navy in 1907. The ships were built in Germany and survived World War I, but were obsolete by World War II. The ships displaced 775 tons and were armed with twin 105mm/37 SK L/40 guns, as well as three 450mm torpedo tubes. They had decent range but were fairly slow for a destroyer."
 TUR_edirne_research_exchange:0 "Обмін дослідженнями в Едірне"
 TUR_etatism_abolished:0 "§YЕтатизм§! був відкинутий."
 TUR_expand_the_golcuk_naval_base:0 "Розширити морську базу в Гьольджюку"
 TUR_integrate_kurdish_state_desc:0 "Співпраця з місцевими лідерами дозволить нам пристойно повернути курдські землі до структури нашої національної держави."
 TUR_intervene_in_the_spanish_civil_war_desc:0 "Громадянська війна в Іспанії стала справжнім полігоном для конкуруючих ідеологій. Ми ділимо з іншими країнами Середземне море, і це дає нам більше прав втручатися у війну від імені обраних союзників, ніж багатьом іншим."
 TUR_jihad_decision:0 "Джіхад"
 TUR_kemalist_infiltration_mission_desc:0 "Кемалісти, незадоволені відкиданням суспільства, взялися за старе. Вони бажають монополізувати владу на заході, і їх треба зупинити."
