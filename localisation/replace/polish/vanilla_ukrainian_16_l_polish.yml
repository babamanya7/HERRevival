 uruguay_third_republic_democratic_ADJ:0 "Уругвайськ"
 usa.40.t:0 "Сенатор голосує за пропозицію уряду"
 usa.6.d:0 "Настав день президентських виборів. Чинний президент Франклін Делано Рузвелт уже реалізував кілька програм, які разом називають Новим курсом, спрямованих на те, щоб вивести США з Великої депресії.\n\nХоча багато з цих заходів були популярними, його плани щодо подальшого розширення ролі та влада уряду була зустрінута критикою з боку його опонента, республіканця Алфа Лендона. Лендон, представник нафтової промисловості, хоче бачити більшої економічної свободи, тоді як Рузвелт і Демократична партія хочуть розширити соціальне забезпечення та забезпечити економічну стабільність. Вибори можуть стати невирішеною проблемою або серйозною перемогою демократів."
 war_declaration_rule_any_country:0 "Абияка країна"
 war_justification.202.t:0 "[ROOT.GetLeader] засуджує [From.GetAdjective]і ідеали"
 war_justification.203.d:0 "«Чи є більша загроза нашому способу життя, чи навіть самому способу життя, ніж комунізм? Ця чума, яка загрожує зробити рабів, а не господарів, правителями кожної нації, скасувати саму націю, скасувати людей та їхню історію. Ми візьмемо [From.GetName] і знищимо комуністичну чуму».\n\nНенависть нашого лідера, [From.GetLeader], до комуністів була добре відома ще до приходу [From.GetRulingParty] до влади, але, схоже, останнім часом вона посилилася в конкретному випадку з урядом [ROOT.GetAdjective]. З цього можна почати наше прагнення стерти марксизм з лиця землі."
 war_justification.209.t:0 "Дипломатія з [ROOT.GetName] зазнає краху"
 war_justification.210.a:0 "[From.GetName] в будь-якому випадку є сумнівною демократією, якщо вдається до таких агресивних дій."
 war_justification.215.a:0 "Вже надто пізно зупиняти досягнутий прогрес."
 war_justification.3.a:0 "Ті, хто відкидає народи, побачать, як загинуть їхні власні."
 war_will_cancel_deal_tt:0 "§YВійна між нашими країнами розірве цю угоду§!"
 water_modifier_shark_infested_icon:0 "GFX_modifiers_weather_icons:6"
 we_shall_fight_on_the_beaches:0 "Ми битимемося на пляжах"
 wolfpacks:0 "Вовчі зграї"
 won_british_civil_war:0 "Перемога у громадянській війні здобута менше року тому.\n"
 wtt_britain.30.t:0 "Американські надзвичайні поставки озброєння"
 wtt_burma_road.3.a:0 "Хороший перший крок."
 wtt_china.11.desc:0 "[From.GetAdjective]ий уряд відповів на нашу ноту і пообіцяв надалі консультуватися з нами з усіх своїх рішень. Наш посол у державі [From.GetNameDef] підвищений до особливого представника, і йому доручено простежити, щоб [From.GetAdjective]е керівництво не заходило надто далеко."
 wtt_china_shared.1.b:0 "Ми цілком задоволені нашою поточною ситуацією."
 wtt_china_shared.11.t:0 "Радянська добровольча група"
 wtt_china_shared.3.a:0 "Шкода."
 wtt_germany.14.d:0 "Представники держави [From.GetNameDefCap] зробили нам пропозицію, яка, на їхню думку, виявиться вигідною для обох сторін. У світлі поточної політичної ситуації та загроз на нашому східному кордоні німці гарантують нам військову підтримку у разі, якщо ми вступимо у війну з державою [SOV.GetNameDef]. В обмін нас просять тільки повернути території — Данциг і Познань."
 wtt_germany.20.t:0 "Німеччина створює Центральноєвропейський альянс"
 wtt_germany.21.t:0 "Німеччина запрошує країни Балтії"
 wtt_germany.48.t:0 "[From.GetNameDefCap] приймає вимоги"
 wtt_germany.65.t:0 "[From.GetName] вимагає участі у війні"
 wtt_germany.8.t:0 "Німеччина підтримує монархічний переворот"
 wtt_japan.105.a:0 "Принаймні вони мають глузд."
 wtt_japan.124.t:0 "Добровольці повертаються додому"
 wtt_japan.3.a:0 "Побачимо, що це їм дасть."
 wtt_japan.31.b:0 "Обезголовте їх!"
 wtt_news.11.d:0 "Невже це та іскра?"
 wtt_news.12.b:0 "Вони нас змусили!"
 wtt_news.13.a:0 "Ми не мали іншого вибору."
 wtt_news.23.c:0 "Німці нещадні."
 wtt_news.27.a:0 "Бандзай!"
 wtt_news.34.d:0 "Кінець ізоляції США?"
 wtt_news.43.b:0 "Ми знову можемо переходити з Тихого океану до Атлантичного."
 wtt_news.43.t:0 "Панамський канал відновлен"
 wtt_news.9.a:0 "Вони зіграли просто нам на користь!"
 wtt_political_organisation.12.t:0 "Репресії в області [state.GetName]"
 wtt_political_organisation.2.a:0 "Боротьба продовжується."
 wtt_political_organisation.7.desc:0 "Мирна демонстрація в області [state.GetName] обернулася кривавими безпорядками, коли протестуючих атакувала група людей у масках. Нападники, схоже, досягли свого, оскільки опозиція швидко втратила будь-яку підтримку.\n\nДоказів, які доводять нашу причастність до цього інциденту, ні, однак наш натяк, схоже, був прийнятий до уваги."
 wtt_political_warlord_support.2.t:0 "[warlord_asked_for_support.GetLeader] підтримує нас"
 wtt_prc.11.desc:0 "[From.GetLeader] прислухався до голосу розуму і вирішив приєднатися до нашого союзу. Його війська підтримають нас у майбутніх битвах."
 wtt_soviet_hold_city_d_success:0 "Незважаючи на натиск ворога, [soviet_city.GetName] тримається, і захисники відбивають одну атаку за іншою. Знекровлений ворог платить непомірно високу ціну за кожен сантиметр зайнятої землі. [soviet_city.GetName] збереже пам'ять про своїх героїв на багато поколінь!"
 wtt_the_hump.4.t:0 "[From.GetNameDefCap] поновлює авіаперевезення через «Горб»"
 wtt_warlord_vs_prc.22.a:0 "Нехай молиться, що ми не змінимо умови знову."
 wtt_warlord_vs_prc.36.a:0 "Нам просто доведеться покластися на себе."
 wtt_xian_incident.8.t:0 "[From.GetLeader] заарештував лідера [CHI.GetLeader]!"
 wuw_GER_chinese_diplomacy.5.desc:0 "Наші великі союзники на Заході, [FROM.GetAdjective]и, надіслали нам делегацію з пропозицією розпочати спільну розробку нових технологій. Вони назвали свою ініціативу 'Китайсько-німецькою програмою спільних досліджень'. Чи варто нам приєднатися?"
 wuw_GER_chinese_diplomacy.5.t:0 "Китайсько-німецька програма спільних досліджень"
 wuw_GER_civil_war.3.a:0 "Новий Bismarckjugend — наш пріоритет"
 wuw_GER_civil_war.5.desc:0 "Надійшли повідомлення про те, що сілезькі та польські партизани напали на німецьких солдатів у Сілезії. Вони прагнуть незалежності, скориставшись нашою громадянською війною. Ми не можемо дозволити їм досягти своєї мети!"
 wuw_GER_diplomacy.103.desc:0 "Попри всі вигоди, [FROM.GetNameDef] відмовились підписати пакт про ненапад. Причини невідомі, але ситуація викликає занепокоєння."
 wuw_GER_diplomacy.108.desc:0 "[FROM.GetAdjective]и погодилися на нашу угоду. Ми отримаємо ресурси, а вони — перенесену промисловість. Все виглядає чудово."
 wuw_GER_diplomacy.108.t:0 "[FROM.GetAdjective]и погоджуються на перенесення індустрії"
 wuw_GER_diplomacy.118.t:0 "[FROM.GetNameDefCap] підкорюється"
 wuw_GER_diplomacy.119.desc:0 "Уперті [FROM.GetAdjective]и відхилили нашу пропозицію об’єднати країни в єдину потужну державу. Невже ось така вдячність за все, що ми для них зробили?"
 wuw_GER_diplomacy.21.a:0 "Ласкаво просимо до кола!"
 wuw_GER_diplomacy.36.a:0 "Ці землі наші!"
 wuw_GER_diplomacy.59.a:0 "Тоді ми вирвемо цю землю з їхніх холодних рук!"
 wuw_GER_diplomacy.61.a:0 "Чудовий день для [ROOT.GetAdjective] народу!"
 wuw_GER_diplomacy.75.desc:0 "Після тривалого посилення комуністичних настроїв, [ROOT.GetAdjective] пролетаріат більше не хоче чекати. Дипломатія провалилась, настав час збройної боротьби."
 wuw_GER_diplomacy.83.a:0 "Звісно, ми приєднуємось"
 wuw_GER_diplomacy.84.a:0 "Ми згодні, солідарність понад усе!"
 wuw_GER_diplomacy.85.b:0 "Якщо треба битися — ми будемо!"
 wuw_GER_legions.4.t:0 "Колаборанти в Локоті!"
 wuw_GER_legions.5.a:0 "Ми переможемо!"
 wuw_GER_legions.6.t:0 "Знищення автономії Локот"
 wuw_GER_legions.7.desc:0 "Після створення Сербського уряду національного порятунку в окупованих територіях, кілька білоемігрантів запропонували сформувати Російський охоронний корпус. Вони допомагатимуть охороняти заводи, державні установи та боротися з четниками й іншими повстанцями. Чи варто скористатися їхньою допомогою?"
 wuw_GER_legions.8.desc:0 "З оголошенням про наші плани щодо [SOV.GetNameDef], багато ветеранів Громадянської війни в Росії звернулись до нас із проханням допомогти повалити [SOV.GetAdjective] уряд. Серед них — донський та кубанський козаки [SOV.SOV_pyotr_krasnov.GetName] та [SOV.SOV_andrey_shkuro.GetName], які хочуть воювати на нашому боці. Чи приймемо ми їхню допомогу?"
 wuw_GER_monroe.1.t:0 "Інтерес [FROM.GetAdjectiveCap] до Доктрини Монро"
 wuw_GER_monroe.10.t:0 "[FROM.GetNameDefCap] Частково скасовує Доктрину Монро"
