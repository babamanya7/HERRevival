 CHI_subjugate_korea_desc:0 "$PRC_subjugate_korea_desc$"
 CHI_the_chinese_hindenburg_line_desc:0 "Наші німецькі радники поділилися з нами досвідом будівництва укріплень, який вони отримали за час Великої війни. Будь-яка спроба наступу через Шанхай розіб'ється про наші оборонні рубежі."
 CHI_the_greater_game:0 "Велика гра"
 CHI_the_hanoi_route:0 "Ханойський маршрут"
 CHI_the_seas_of_tomorrow_desc:0 "Ми мріємо про майбутнє, в якому Китай лідируватиме у світі за м'якою силою та технологічною майстерністю. Ми витратили роки, щоб наздогнати величезні флоти колоніальних держав та наших регіональних суперників, але тепер настав час самим прокладати курс у майбутнє."
 CHI_train_for_asymmetry_desc:0 "Війна ніколи не буває чесною, і ми ніколи не можемо очікувати, що вона такою буде. Є ті, хто має сильніші армії і намагатиметься підкорити нас, і нам потрібно знайти спосіб зрівняти шанси. Навчання наших військових та їхніх лідерів пошуку нових способів ведення бою буде важким, але користь беззаперечна."
 CHI_tsr_a_new_chinese_identity_desc:0 "Тепер, коли доля Китаю в наших руках, ми повинні прагнути зміцнити нашу позицію і довести, що ми є гідним партнером і справжньою Китайською Республікою, яку бачив Сунь Ятсен."
 CHI_tsr_expand_the_nanjing_army_desc:0 "Ми можемо розраховувати, що не більше десятої частини наших номінальних сил будуть лояльні до нас, тому перед лицем цього ми повинні прагнути створити справді вірну силу, керовану нашим великим лідером."
 CHI_tsr_our_place_in_the_sphere:0 "Наша роль у Сфері"
 CHI_tsr_outlaw_the_kmt_and_cpc_desc:0 "Республіканізм не відповідає національним умовам Китаю. Тому революційним елементам, які колись повалили Імперію і повстали з її попелу, не можна дозволити знову взяти гору. Країні можна повернути колишню славу лише за умови єдиного керівництва, тому з внутрішнім інакомисленням потрібно розправлятися швидко."
 CHI_tsr_pan_asianism:0 "Паназіатизм"
 CHI_tsr_reestablish_xinhua_palace:0 "Відновити палац Сіньхуа"
 CHI_utilize_the_albazinian_contact_desc:0 "Єпископ Симеон Ду є нинішнім протодияконом Китайської православної церкви. Як албазинець, що подорожував усім Китаєм, єпископ підтримує тісні контакти з багатьма представниками старих білогвардійських сил. Можливо, він зможе переконати росіян надіслати допомогу нашій нації?"
 CHL_BLITZKRIEG_DESC:0 "Після нещодавньої спроби державного перевороту Хорхе Гонсалеса фон Марееса та його соратників-нацистів Артуро Алессандрі пішов у відставку, а новим президентом Чилі був обраний Педро Агірре Серда. Однак військова загроза все ще нависає над країною, і здається, що генерал Аріосто Еррера і його прихильники неминуче спробують здійснити власний державний переворот.\n\nВійна також маячить над горизонтом, оскільки напруга зростає не лише в Європі та Азії, але й в Амазонії, неподалік од чилійського центру країни."
 CHL_a_french_alliance_desc:0 "Після того, як наші друзі-монархісти у Франції взяли владу в свої руки, було б мудро шукати союз із ними, оскільки вони мають ті ж наміри й цілі, що й ми, а також спільну спадщину і мову. Разом нас не зупинити."
 CHL_conservative_party:0 "КП"
 CHL_demand_the_fireland_desc:0 "Вогняна Земля по праву належить нам, і Аргентина не може претендувати на легітимність своїх володінь, оскільки вона навіть не сполучена з нею. Ми мусимо запевнити населення, що ми не бажаємо йому зла, та вирвати регіон з пазурів Аргентини."
 CHL_enforce_the_chilean_identity_desc:0 "Наразі чилійський народ розділений, і ми мусимо зробити що-небудь, аби об'єднати його під нашим прапором. Іспанці, мапуче, чилійці — вони нічим не відрізняються, бо всі вони є нашими громадянами, і вони однакові. Хтось може відхилити наше послання, але загалом нова чилійська ідентичність має сподобатися більшості."
 CHL_establish_the_ministry_of_mining:0 "Заснувати міністерство видобутку"
 CHL_established_the_guianas_flag:0 "Гвіану реорганізовано"
 CHL_found_the_contraloria_general_de_la_republica_desc:0 "Головний ревізор Чилі буде конституційно автономним органом чилійського уряду. Він відповідатиме за контроль правових аспектів, управління, функції попереднього та наступного аудиту всієї діяльності централізованої та децентралізованої державної служби, незалежно від її організаційної форми, а також за інші повноваження, надані законом."
 CHL_ibanez_approaching_argentinian_army_mission:0 "Ібаньєс підступає до аргентинської армії"
 CHL_invite_carlist_refugees:0 "Запросити біженців-карлістів"
 CHL_invite_french_academia_desc:0 "Аби люди в нашій країні могли вчитися та досягати великих успіхів, і аби наша країна досягла прориву, необхідного для конкуренції на світовій арені, ми мусимо запросити французьку інтелігенцію з материка, щоби допомогти навчати і організовувати."
 CHL_joint_research_initiatives_desc:0 "Тепер, коли ми союзники, ми мусимо докласти зусиль для взаємного створення лабораторій і програм науково-дослідницької співпраці з метою подальшої розробки зброї, яка виходить за межі того, на що здатні капіталісти та імперіалісти світу."
