 MAN_infantry_equipment_0:0 "Type 38 Rifle"
 MAN_invite_japanese_settlers_desc:0 "У нас набагато більше простору, ніж людей, здатних його заселити — значні частини країни є практично безлюдними. Ми маємо запросити нових поселенців, щоб підштовхнути економічний розвиток на всій території."
 MAN_light_tank_equipment_1_short:0 "Type 94"
 MAN_light_tank_equipment_3:0 "Type 98 Ke-Ni"
 MAN_mamc_heavy_organization:0 "$MAN_mamc_heavy$"
 MAN_march_on_beijing:0 "Марш на Пекін"
 MAN_prepare_to_seize_arms_desc:0 "Розкидані по країні склади та звалища постачання погано охороняються. Добре спланований і розрахований штурм міг би взяти їх з мінімальними втратами, давши нам доступ до сучасної зброї і в той же час позбавивши японців боєприпасів і припасів. Витрачаючи на це більше часу та ресурсів, ми зможемо захопити більше складів."
 MAN_reclaim_the_empire:0 "Відродження імперії"
 MAN_social_research_unit_desc:0 "Ми сформуємо спеціальну групу для вивчення традицій та звичаїв нашого народу, щоби допомогти людям стати продуктивними громадянами великої нації."
 MAN_staff_the_court_with_manchus_desc:0 "Династія Цін не одне століття правила Китаєм. Щоб повернути собі колишню славу, ми мусимо якомога точніше наслідувати її приклад."
 MAN_the_two_emperors:0 "Два імператори"
 MAN_tsr_bandit_recruitment_desc:0 "Багато так званих бандитів, що блукають нашими землями, насправді є партизанами, які беруть активну участь у конфлікті проти Японії. Ми повинні об'єднатися з ними та використати їхній досвід, якщо хочемо мати шанс проти Японської імперії."
