 CHI_reclaim_what_was_lost_desc:0 "Цин успадкувала найбільшу імперію, яку ми коли-небудь бачили, і розтринькала її на користь іноземних держав. Це принесло ганьбу нам як народу, нації та партії. Ми повинні виправити цю пародію і відновити гідність Китаю."
