 SOV_merge_materiel_plant_1_motorized:0 "Об'єднати Автомобільно-інструментальний завод"
 SOV_military_reorganization_desc:0 "Наші спроби створити велику механізовану армію були благородними, але більше, ніж ми могли собі дозволити. Щоб виграти цю війну, нам доведеться зосередитися на родах військ, які століттями приводили російські армії до перемоги: піхоті та артилерії. Це обов'язково виможе від нас певної дезорганізації існуючих формувань."
 SOV_military_support_desc:0 "Заручитися підтримкою з боку збройних сил може бути дуже корисно, навіть якщо це означає ризик того, що сталінські інформатори дізнаються про нашу змову. Сподіваємося, що коли це станеться, для нього буде запізно."
 SOV_modify_the_red_army_ns_intro:0 "Змінити ідею §Y[GetAppropriateRedArmyNsName]§! на:"
 SOV_naval_infantry_desc_alt:0 "Якщо ми хочемо розширити наші кордони, сили спеціальної морської піхоти можуть бути дуже корисними для здійснення рейдів на берегові об'єкти противника, створення загрози для берегової лінії противника і підтримки основних сил вторгнення."
