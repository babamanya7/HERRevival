 BRA_ford_mio_tt:0 "Відкриє військово-промислову організацію §Y$USA_ford_motor_company_organization$§!."
 BRA_german_cooperation_desc:0 "Надто довго Атлантичним океаном домінували ВМС Америки та Британії. Завдяки нашій співпраці з [GER.GetNameDef], ми готові витіснити їх і взяти під контроль Атлантику."
