 GRE_realign_ourselves_with_the_central_powers_desc:0 "Якимось чином сталося неможливе! Фюрера більше нема, замість нього знову кайзер! У зв'язку з цим змінилася британська зовнішня політика і такі зміни не обов'язково на нашу користь. Можливо, нам слід налагодити зв'язки зі своїми родичами в Берліні та боротися за божественне право королів панувати у всій Європі."
