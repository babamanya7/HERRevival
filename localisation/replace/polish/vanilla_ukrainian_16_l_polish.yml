 mountaineers_combat_3_desc:0 "Хоча наші елітні полки діють на дуже незалежній основі, посилення їхньої підготовки зі ставкою на операції зі спільнодією родів військ підвищить їхню корисність на полі бою."
 mountainous_republics_unified_neutrality:0 "Північнокавказький емірат"
 mtg_britain.108.t:0 "[From.GetName] не підкоряється умовам договору"
 mtg_britain.40.a:0 "Чудова ідея!"
 mtg_britain.56.d:0 "Після виснажливої громадянської війни нам вдалося відновити контроль над ситуацією. Тепер ми мусимо очистити нашу державу від цих зрадників..."
 mtg_britain.62.d:0 "Новий [From.GetAdjective] уряд заявив про свої наміри придушити будь-яку незгоду в домініонах, за необхідності навіть за допомогою військової сили. Хоча їхня армія надто розосереджена по всій імперії, вони явно збираються здійснити свій намір."
 mtg_britain.77.d:0 "Наша війна з державою [BAN.GetNameDef] заходить у глухий кут, кінця їй не видно, і громадська думка все частіше ганьбить безглузду втрату життів. Можливо, настав час переговорів про мир?"
 mtg_britain.79.t:0 "[From.GetNameDefCap] вимагає підпорядкування"
 mtg_britain.83.d:0 "У світлі поточної глобальної кризи ясно, що ми більше не можемо нести виняткову відповідальність за безпеку імперії і маємо все більше покладатися на домініони. Кожна держава має збільшити свої витрати на оборону, щоби загалом сильніше протистояти будь-яким випробуванням, які готує нам світ."
 mtg_britain.83.t:0 "Імперська конференція: оборона"
 mtg_britain.88.d:0 "[From.GetAdjective] уряд висловив бажання розширити обсяг вже існуючих угод про торгові привілеї та збільшити імпорт до Великої Британії. Вони стверджують, що сильна Британія означає сильну імперію в цілому."
 mtg_britain.92.b:0 "Для цього прямо зараз у нас немає коштів."
 mtg_netherlands.22.t:0 "[From.GetNameDefCap] переносить столицю в Батавію"
 mtg_netherlands.55.t:0 "Принц Бернард організовує опір"
 mtg_netherlands.63.t:0 "Золотий запас евакуйований"
 mtg_netherlands.64.a:0 "Це чудова ідея!"
 mtg_netherlands.65.d:0 "Робота над Флевополдером триває, і індустрія, що забезпечує цей масштабний проєкт, розвивається разом з ним. Інженери, що працюють над поставками будівельних матеріалів, розробили нові методи будівництва заводів та верфей. Інвестувавши в них, ми можемо досягти значного поліпшення у цих областях у найближчому майбутньому."
 mtg_netherlands.69.t:0 "Місцеве населення проти «безглуздого» затоплення"
 mtg_netherlands.70.d:0 "Велика кількість німецьких перебіжчиків організувалася у повноцінну військову частину. Залишилося лише екіпірувати їх, і можна відправляти битися за нас."
 mtg_netherlands.77.t:0 "[From.GetNameDef] пропонує заснувати федерацію"
 mtg_news.27.d:0 "Хитромудра тактика."
 mtg_news.29.c:0 "Вони не залишили нам вибору."
 mtg_news.3.c:0 "Ну, значить, своєю бездіяльністю вони підтримують фашистів."
 mtg_news.3.e:0 "Вони знають, як важливо зберігати нейтралітет."
 mtg_news.30.desc:0 "Нещодавні дії [From.GetAdjective]ого уряду чітко дали зрозуміти, що він все більше обмежує автономію домініонів. За готовністю відправити за море армію ясно, що для придушення будь-яких думок про незалежність може навіть використовуватись військове втручання."
 mtg_news.31.d:0 "Британці міцно взялися за свої домініони."
 mtg_news.32.desc:0 "\nВдавшись до безпрецедентних заходів, держава [ENG.GetNameDef] провела нові вибори в державі [From.GetNameDef], де з великою перевагою перемогли лоялістські про[ENG.GetAdjective] партії.\n\nОгляд у результатах виборів і підозрюють, що мала місце великомасштабна фальсифікація. Ці підозри категорично відкидає [ENG.GetAdjective] уряд, тоді як новий [From.GetAdjective] уряд вже розпочав роботу і проводить відверто пробританську політику."
 mtg_news.35.t:0 "Зникнення [ENG.GetAdjective]ої королівської сім'ї"
 mtg_news.39.a:0 "Так і є."
 mtg_news.44.a:0 "Незалежність чи смерть!"
 mtg_news.52.desc:0 "На запит [From.GetAdjective] уряду держава [USA.GetNameDef] випустила прокламацію, заявивши, що вона вважає Нідерландську Вест-Індію важливою частиною сфери своїх інтересів. Воно обіцяло захищати територію від усіх, хто може напасти на її законних власників."
 mtg_news.54.t:0 "Утворення Європейського Союзу"
 mtg_news.57.a:0 "Це дуже допоможе в управлінні імперією."
 mtg_news.62.b:0 "Імперія в кризі."
 mtg_news.8.a:0 "Великий крок уперед для наших народів."
 mtg_usa_canadian_corridor.1.a:0 "Вони його отримають."
 mtg_usa_civil_war_democrats.15.desc:0 "В умовах зростаючої нестабільності в країні багато підприємців починають потроху доглядати інші місця для свого бізнесу. Зокрема, спостерігається зростання виробництва озброєнь у південних штатах США, а деякі компанії переводять в іншу частину країни цілі заводи."
 mtg_usa_civil_war_democrats.29.a:0 "Повернути цю територію буде легко."
 mtg_usa_civil_war_democrats.40.t:0 "МакАртур пропонує очолити уряд"
 mtg_usa_civil_war_fascists.201.a:0 "Сформувати окремі загони."
 mtg_usa_civil_war_fascists.22.a:0 "Вони точно труси, але, принаймні, не вороги."
 mtg_usa_congress_large_opposition_tt:0 "До §Y25 сенаторів§! і §Y100 представників§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_foreign_support.15.a:0 "Гідні інвестиції"
 mtg_usa_foreign_support.4.d:0 "Доведеться їм справлятися самим."
 mtg_usa_pacific_pacification.3.t:0 "[From.GetNameDefCap] відмовляється"
