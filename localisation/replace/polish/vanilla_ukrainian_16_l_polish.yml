 TUR_treaty_of_saadabad_desc:0 "Зберігши дружні стосунки з нашими сусідами на сході, ми нічого не втратимо і багато чого придбаємо. Зараз обмірковується ідея про пакт, який формалізує нашу дружбу, і Туреччині давно настав час взяти на себе ініціативу і переконатися, що ця дружба офіційно закріплена в договорі."
