 NOR_GATHERING_STORM_DESC:0 "З моменту здобуття незалежності від Швеції в 1905 році Норвегія намагалася знайти свою політичну опору, і лише зараз вона починає демонструвати ознаки політичної стабільності та відновлення після важких тридцятих років.\n\nТепер, коли її південні сусіди починають сваритися, війна здається ближчою, ніж будь-коли, Норвегія повинна знайти шлях для збереження своєї крихкої незалежності, кабінет Нюгошволда робить ставку на нейтралітет і роззброєння, щоб здаватися якомога більш нешкідливою для великих європейських держав, але переваги такого підходу ще належить побачити."
 NOR_SOV_morozov_design_bureau_organization:0 "$NOR_morozov_design_bureau_nord_organization$"
 NOR_a_new_norway:0 "Нова Норвегія"
 NOR_consolidate_kingdom_desc_PAWJ:0 "Тепер, коли наш милостивий маркіз Педер Анкер Ведель-Ярлсберг, королівський камергер і права рука нашого улюбленого Гокона VII розширив землі нашої корони, ми повинні дивитися всередину, щоб консолідувати наші здобутки та правити нашими підданими з позолоченою та стійкою, якщо трохи сувора, рука."
 NOR_fascist_industrial_investments_desc:0 "Наші друзі-фашисти мають кмітливість і капітал, необхідні для розвиненої промисловості, яка потрібна сучасній країні, щоб конкурувати. Ми можемо використати це як спосіб стати ще більш корисним союзником."
 NOR_for_the_king_and_prince_desc:0 "Наш король Гокон і його син принц Олав є джерелом натхнення для кожного [NOR.GetAdjective]ого громадянина. Ми повинні нагадати нашим солдатам, що кожен крок вперед, кожен убитий ворог і кожен літр пролитої крові не є марними. Це все для нашої королівської родини, дворян [NOR.GetName] і того, що вони представляють."
 NOR_kickstart_military_industry_desc:0 "[ROOT.GetName] протягом тривалого часу був підпорядкованим іншим державам, і тому ніколи не розвивав внутрішню військову промисловість. Щоб захистити нашу свободу, ми повинні припинити покладатися на інші країни для нашого оборонного виробництва та розпочати розбудову нашого бойова машина."
 NOR_medium_tank_equipment_1:0 "Panservogn m/39"
 NOR_medium_tank_equipment_2_short:0 "Pansv. m/41"
 NOR_naval_air_force_desc:0 "Наші літаки можуть зробити різницю між флотом, який підтримує вторгнення в [ROOT.GetName], і мирними водами біля нашого узбережжя. Якщо ми зможемо домінувати в небі над морями, ми зможемо знову панувати над хвилями."
 NOR_prince_olav_to_navy_staff_desc:0 "Незважаючи на їхній постійний опір нашому проєкту, принц Олав відкритий для ідеї керувати військово-морськими силами нашого королівства. Зрештою, він виграв золоту медаль з вітрильного спорту на Олімпійських іграх 1928 року, тому ми знаємо, що він єдиний із хвилями. Він зосередився на керівництві нашими військово-морськими силами, ми знаємо, що наші вороги стануть їжею для лосося, який ловлять наші піддані."
 NOR_rebuild_the_royal_navy:0 "Відновити Королівський флот"
 NOR_ship_torpedo_4:0 "5x 533-мм торпедний апарат"
 NOR_the_kingdom_of_norway_desc:0 "Настав час, знає про це король Гокон чи ні. Позбудьмося будь-яких претензій на демократію та народне правління та дозволимо рукавичці монархії вщент розбити наших ворогів. Король не матиме іншого вибору, окрім як відвідувати своє перекоронування."
 NOR_weathering_the_storm_to_come_desc:0 "Незважаючи на наші попередні спроби покращити добробут наших людей, тепер ми повинні зіткнутися з реальністю зростаючих загроз звідусіль. Ми повинні почати готуватися до шторму, який наростає по всій Європі. Усе, що ми створили, буде намарно, якщо ми не можемо захистити це."
 NOT_ENOUGH_PP_TO_DISBAND_POTF:0 "\n\n§RНедостатньо політичної влади для відпризначення §Hгордості ВМС§!§!"
 NO_AIR_INTEL_WITH_CAP:0 "Нема розвідданих (потрібні авіаційні розвіддані: $MIN|H.0%$)"
 NO_WAR_WIL_ACC:0 "Прохід військ непотрібний у стані миру"
 NSB_Soviet_fascist_civil_war.001.desc:0 "Час політичних маневрів закінчено. Збройна боротьба з комунізмом триває. Утворено комітет, що допоможе нам вести цю війну. Тепер ми боротимемося до кінця і нізащо не програємо. Тепер ми повернемо собі імперію!"
 NSB_Soviet_fascist_civil_war.002.desc:0 "Дивізія «Руки» готова піднятися на бій із комуністами-окупантами."
 NSB_poland_communist_events.1.t:0 "Сварки в КПП"
 NSB_poland_communist_events.602.t:0 "[From.GetNameDefCap] відхиляє пропозицію"
 NSB_poland_democratic_events.1.a:0 "У Вітоса є досвід — це наш лідер."
 NSB_poland_events.3.c:0 "Передайте Данциг — і по руках!"
 NSB_poland_events.303.a:0 "Обмін цього неспокійного міста на армію здається цілком вигідною угодою."
 NSB_poland_events.4.a:0 "Вони його отримають."
 NSB_poland_monarchist_events.5.a:0 "Ми здаємося!"
 NSB_poland_monarchist_events.601.t:0 "[From.GetNameDefCap] погоджується!"
 NSB_polish_fascist_events.1.desc:0 "[From.GetAdjective]ий уряд запропонував укласти пакт, щоб підтримати нашу мету глобальної гегемонії., і тому міністр закордонних справ Польщі Юзеф Бек був відправлений запропонувати поправки до домовленості. Польща погоджується поступитися західними територіями — Познань, Данциг і Верхню Сілезію — в обмін на взаємний пакт про ненапад і німецький захист і допомогу за будь-якої спроби [SOV.GetAdjective] Пакт фактично перетворить Польщу на маріонетку Німеччини і позбавить оспорюваних територій на кордоні."
 NSB_soviet_civil_war_common.002.d:0 "Нехай їй так і буде [?SOV_civil_war_start_state.GetName]."
 NSB_soviet_civil_war_common.002.desc:0 "Війна закінчена. Необхідно прийняти рішення про те, де буде столиця держави."
 NSB_soviet_civil_war_common.010.t:0 "Десталінізація"
 NSB_soviet_civil_war_common.100.t:0 "Владивосток в обмін на підтримку"
 NSB_soviet_civil_war_common.101.t:0 "[FROM.GetName] підтримує нашу справу"
 NSB_soviet_civil_war_common.106.desc_right_opp_civil_war:0 "[SOV.GetNameDefCap] повстає, а [SOV.GetLeader] стає на чолі цього заколоту. майбутньому права на нафтові родовища Баку в обмін на допомогу у нарощуванні їхньої військової могутності."
 NSB_soviet_civil_war_common.110.t:0 "Допомога в розпалюванні бунту в Україні"
 NSB_soviet_civil_war_common.119.desc:0 "[FROM.GetAdjectiveCap]ий уряд погодився таємно забезпечити нас зброєю."
 NSB_soviet_comecon.1.a:0 "Ось так і виглядає взаємодопомога на практиці!"
 NSB_soviet_communist_civil_war.002.b:0 "Це має бути Риков."
 NSB_soviet_communist_civil_war.008.a:0 "Це може все ускладнити."
 NSB_soviet_fascist_tsarist.17.desc:0 "[FROM.GetNameDefCap] повідомляє нам, що вони приймають нашу пропозицію укласти союз і негайно почнуть працювати наш зміцненням наших дипломатичних зв'язків."
 NSB_soviet_fascist_tsarist.32.b:0 "Йому не варто довіряти!"
 NSB_soviet_foreign_politics_events.158.desc:0 "Після невдалих переговорів з нашими послами і під величезним тиском преси та населення колишній лідер [FROM.GetAdjective]ого уряду вирішив піти у відставку та влаштувати нові вибори. Як і очікувалося, ці вибори виграла партія, чиї інтереси — [FROM.GetRulingParty], якою керує [FROM.GetLeader]."
 NSB_soviet_foreign_politics_events.282.t:0 "[SOV.GetNameDefCap] вимагає формально визнати, що [ROOT.GetNameDef] — радянська республіка"
 NSB_soviet_paranoia_system_events.19.desc_2:0 "Після процесу над першою групою троцькістів і терористів слідчі НКВС виявили нові докази. Карл Радек був заарештований і згодом на допиті зізнався у всьому. Він розкрив існування широкої мережі агентів, повністю або частково співпрацюючих. урядовим питанням, включаючи військові. Ватажки вже заарештовані і в усьому зізналися на допитах."
 NSB_soviet_paranoia_system_events.24.desc:0 "У верховне армійське командування надійшла доповідь. У ньому [?ROOT.SOV_accuser_character_for_loc.GetName] стверджує, що його товариш по службі, генерал [?ROOT.SOV_accused_character_for_loc. SOV_accuser_character_for_loc.GetName] пише, що [?ROOT.SOV_accused_character_for_loc.GetName] співпрацює з іноземними агентами та реакційними елементами і передає інформацію зарубіжній розвідці. Так обвинувач вказує на велику кількість нещасних випадків на навчаннях і вважає, що їх причиною став саботаж, за яким стоять сам обвинувачений та його військові спільники. Після ретельного допиту зазначені особи підтвердили всі підозри."
 NSB_soviet_soviet_german_trade_agreement.3.t:0 "[GER.GetNameDefCap] відкидає $NSB_soviet_soviet_german_trade_agreement.1.t$"
 NSB_soviet_spanish_civil_war.5.a:0 "Час завдати вирішального удару!"
 NSB_soviet_spanish_civil_war.5.desc:0 "До Іспанії нещодавно прибула нова група радянських військових аташе та радників, щоби допомогти буржуазному республіканському уряду. \nЦі агенти вийшли на зв'язок і завербували чимало офіційних осіб, солдатів, бійців міжнародних бригад і ополченців, які співчувають справі РПМО і воюють зараз у буржуазній республіканській армії, створивши таким чином вражаючу мережу інформаторів, що дозволить нам з перших рук отримувати інформацію про переміщення розпланованих ворожим командуванням."
