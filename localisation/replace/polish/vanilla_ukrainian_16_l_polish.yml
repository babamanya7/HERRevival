 TUR_patrol_the_seas_desc:0 "Наш океан — природна перешкода для загарбників, і ми мусимо дбати про водний кордон не менше, ніж про наземний."
 TUR_pay_off_our_debts_desc:0 "За період свого існування Османська імперія накопичила великий борг, на відновлення нації теж пішло чимало коштів. Зараз у нас є хороша можливість виплатити частину боргу!"
 TUR_readdress_the_montreux_convention_desc:0 "Мабуть, ми дуже жорстко поставилися до [SOV.GetAdjective] позиції першої конвенції Монтрьо. В ім'я дружби та співробітництва необхідно переглянути підписану декларацію та внести корективи, про які просить [SOV.GetNameDef]."
