 germany.1050.t:0 "Смерть фюрера"
 germany.106.b:0 "Ми не підтримаємо жодної болгарської претензії."
 germany.115.t:0 "Польща передала Данциг"
 germany.116.a:0 "Вони дорого заплатять за недотримання угоди."
 germany.117.d:0 "Держава [From.GetName] погодилася на передачу Данцига в обмін на підтримку в громадянській війні. Наші запит і обіцянка були закріплені в Данцигській угоді. Тепер потрібно забезпечити перемогу держави [From.GetName] в цьому конфлікті."
 germany.121.t:0 "Розподіл Німеччини"
 germany.201.desc:0 "[FROM.GetName] вирішила припинити окупацію Німеччини та надати німцям самоуправління у вигляді нової республіки під назвою [WGR.GetNameDef]. Вони стверджують, що це зроблено для створення бастіону проти комунізму, аргументуючи це тим, що сильна демократична Німеччина є кращим захистом від поширення комунізму, ніж слабка та роздроблена держава.\nНас попросили підтримати це, об'єднавши наші німецькі території з новоствореною [WGR.GetName]. Народна підтримка цього рішення є сильною."
 germany.4.a:0 "Як хтось може казати, що Австрія — не німецька?!"
