 CZE_apart_but_togather:0 "Окремо, але разом"
 CZE_armour_bonus_ii_desc:0 "Військово-технічний інститут продовжує співпрацювати із заводом Škoda, створюючи нові поліпшені моделі танків."
 CZE_artillery_equipment_2:0 "10,5 cm hrubý kanón vz. 35"
 CZE_balkan_union_desc:0 "Хоча тепер більше країн регіону приймають комунізм, ми не зможемо захистити себе від великих держав без міцної співпраці. Союз був би найефективнішим способом досягти цього."
 CZE_capitulated_germany:0 "Змушено капітулювати Німеччину"
 CZE_consolidate_mining_operations:0 "Консолідувати гірничодобувні операції"
 CZE_czech_fascism_desc:0 "Підтримка фашизму серед населення зростає; чим більше влада виявляється у фашистської течії, тим активніше можна боротися з дисидентами."
