 EST_FIN_fascism:0 "Естонсько-фінська ліга"
 EST_crackdown_on_vaps_desc:0 "Вапси стають занадто зухвалими. Ми мусимо провести рейд на їхніх членів, якщо хочемо зменшити їхній зростаючий вплив."
 EST_democratic_party_long:0 "Народна центристська партія"
 EST_events.402.d:0 "Unmoved by [Root.GetLeader]'s rhetoric of Baltic solidarity, [From.GetNameDef] has refused to unify with [Root.GetNameDef] believing our unification to be nothing more than an act of imperialism meant to impede the [From.GetAdjective] people's right to a [From.GetNonIdeologyName] for [From.GetNonIdeologyAdjective]s."
 EST_events.801.d:0 "Демонстрація партії [Root.GetFascistParty] у місті [?ROOT.vaps_from.GetName] була зустрінута місцевими жителями зі змішаними почуттями. Влада ж поставилася до неї різко негативно. Мало хто з перехожих міг бодай розповісти, чого вимагають протестувальники, і першому плані вийшла насильницька боротьба демонстрантів та його противників.[Root.GetAdjective] уряд вже розробляє заходи для повного викорінення партії [Root.GetFascistParty], і сьогоднішні події напевно прискорили цей процес, анітрохи не сприявши популярності партії."
 EST_events.803.a:0 "Дуже цікаво."
 EST_march_in_FIN_capital_desc:0 "Коли ми відчуємо, що ветерани Фінляндії достатньо підбадьорилися, нам потрібно лише дати сигнал напасти на державу [FROM.GetName], і Фіни нарешті отримають силу під фашизмом."
 EST_march_in_FIN_state:0 "Марш у державі [FROM.GetName]"
 EST_national_pride_in_finland_desc:0 "Фінським ветеранам бракує тієї організованості, яка була у нас, так що, можливо, однієї лише нашої пасивної підтримки недостатньо, щоби досягти там тих самих змін, що трапилися в Естонії. Організувавши у Фінляндії марші, ми, можливо, дочекаємось у майбутньому об'єднання двох наших націй під проводом героїв минулої війни."
 EST_vapsid_youth_desc:0 "Вапси в масі своєї немолоді, але наша молодь захопилася їх історіями про героїчну боротьбу за незалежність Естонії кілька десятків років тому. Якщо залучити в наші ряди молодих ентузіастів, у них з'явиться надія досягти тієї ж."
 ETH_a_guiding_hand:0 "Керівна рука"
 ETH_airbase_name_fallback:0 "([ETH.GetName])"
 ETH_aircraft_tt:0 "Створити варіант (§Y$small_plane_airframe_0$§!): §Y[ITA.GetFlag] CR.32§!\n Створити варіант (§Y$medium_plane_airframe_0$§!): §Y[ITA.GetFlag] Ca.101§!"
 ETH_anti_imperialist_agitation_desc:0 "Лояльність людей до [ROOT.GetLeader] коливається. Не виконавши свій найважливіший обов'язок, захистити людей, наші передбачувані лідери повністю продемонстрували свою бездарність. На передовій і на вулицях відкрито обговорюють те, що колись було неможливо уявити. Нація без імператора."
 ETH_assertiveness_gojjam:0 "Годжам Негаш"
 ETH_buy_rifles_from_host_desc:0 "Для того, щоб профінансувати відвоювання держави [ROOT.GetName], необхідні жертви. Витрачати особисте багатство монарха на зброю, можливо, і відчайдушно, але відчайдушні часи вимагають відчайдушних заходів."
 ETH_buy_support_equipment_desc:0 "Нам потрібна не лише зброя: нам украй необхідні засоби зв'язку та додаткове обладнання загалом. Отримання більшої кількості цього обладнання є питанням найвищого пріоритету."
 ETH_callout_to_the_world_tt:0 "§Y$ENG_sylvia_pankhurst$§! і §Y$IA_emma_goldman$§! стануть доступні як радники."
 ETH_camouflage_air_tt:0 "Змінити §Y[GetEthiopianAirforceSpiritName]§! на:\n $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G-15%§!"
 ETH_closer_cooperation:0 "Більш тісна співпраця"
 ETH_defending_our_homes_desc:0 "Імперська кліка в м. [ROOT.Capital.GetCapitalVictoryPointName] турбується лише про свою безпеку. Тим часом наші домівки та родини були зруйновані. Ми не можемо допустити, щоб це продовжувалося. Ми будемо захищати кожну п'ядь нашої Батьківщини не для імператора, а для себе."
 ETH_establish_a_naval_base_desc:0 "З нещодавнім придбанням порту ми відкрили собі інший театр війни. Ми повинні створити нашу власну військово-морську базу та розпочати будівництво військово-морських сил для захисту наших нових берегових ліній."
 ETH_events.101.d:0 "Незважаючи на втрату контролю над усіма територіями в Східній Африці, [From.GetLeader] відхилив нашу пропозицію білого миру. Здавалося б, повна капітуляція — це єдиний спосіб, яким ця війна коли-небудь закінчиться."
 ETH_increased_factory_output_tt:0 "Змінити §Y$ETH_industrialization_dynamic_modifier$§! на:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+10%§!"
 ETH_italian_general_staff:0 "Італійський генштаб"
 ETH_liberate_SOM:0 "Звільнити державу [SOM.GetName]"
 ETH_local_development_arms_industry_grows_mission_desc:0 "Місцеві зброярі в області [?ETH.ETH_local_state.GetName] значно збільшили виробництво. Це досягає рівня, коли вся країна може отримати вигоду."
 ETH_mutual_defense_desc:0 "Народ Африки ніколи не матиме тривалого миру, доки нації світу не зрозуміють, що ціна спроби нас колонізувати надто велика. Щоб досягти цього, члени Організації африканської єдності повинні укласти угоду про взаємну оборону, пообіцявши захищати один одного, якщо хтось із нас зазнає нападу."
 ETH_new_weapons_and_tactics_bonus:0 "Дослідження нових зброї та тактик"
 ETH_northern_thrust_desc:0 "Нашим першочерговим завданням має бути захоплення Ерітреї. Якщо ми зможемо відрізати італійців від їхніх портів на півночі, їм буде набагато важче постачати свої сили, і тоді ми зможемо мати справу зі слабшим південним фронтом."
 ETH_raid_italian_depots_tt:0 "Рейди відбуватимуться спорадично протягом наступного §Yроку§!, кожного разу додаючи §Y[ITA.GetFlag][ITA.GetAdjective]§! обладнання для [ETH.GetFlag]§Y[ETH.GetName]§! до запасів."
 ETH_reach_out_to_the_italians_desc:0 "Зрозуміло, що ми більше не маємо надії подолати [ITA.GetAdjective]і армії на полі бою. Однак [ETH.GetLeader] продовжує посилати наших солдатів на смерть у безрезультатних наступальних операціях. Настав час для нового керівництва під керівництвом сильнішого лідера, того, хто зможе працювати з італійцями і принести мир на нашу батьківщину."
 ETH_scavenging_tactics_desc:0 "Поки ми розширюємо нашу промислову базу, ми повинні навчати наші війська виявляти те, що корисно та можна відновити на полі бою. Це значною мірою сприятиме їх забезпеченню, поки ми не зможемо стабільно виробляти та транспортувати наше власне обладнання."
 ETH_support_resistance_decision:0 "Підтримати анти[FROM.OWNER.GetAdjective]ий спротив у області [FROM.GetName]"
 ETH_support_resistance_decision_cost_blocked:0 "£command_power §R25§!"
 ETH_victory_in_the_desert_desc:0 "Огаден — найслабша частина італійського фронту. Ми повинні зосередити свої зусилля на тому, щоб перемогти їх там, а потім захопити їхні порти на півдні. Це має звільнити наші спини та дати нам можливість рухатися до Ерітреї."
