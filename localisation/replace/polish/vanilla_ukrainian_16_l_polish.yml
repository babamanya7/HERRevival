 SAF_battleship_4:0 "Клас «Vanguard»"
 SAF_battleship_4_desc:0 "The Vanguard-class battleship was the last battleship to be built for the Royal Navy. A single ship was ordered but four more were considered for the Pacific theater. Ordered under the 1940 Emergency War Program, construction did not gain a high priority and it was finished after the war. The class had a sleek hull, giving excellent stability and seaworthiness. The armament was the same as the Queen Elizabeth and Revenge class battleships, providing considerable firepower. Strong engines and good armor made the vessel fast and well protected."
 SAF_commemorate_the_battle_of_blood_river_desc:0 "В 1838 вагонфорт, побудований бурами-переселенцями, стримав атаку більш ніж десяти тисяч зулуських воїнів і завдав нищівного удару по панування зулусів в Наталі. Це, поза всяким сумнівом, був знак згори, що наша справа — права."
 SAF_cv_fighter_equipment_2_short:0 "Fulmar"
 SAF_liberate_belgian_desc:0 "Багато хто вважає історію Бельгійського Конго одним із найжорстокіших прикладів експлуатації та придушення. Ми поставимо остаточну точку у цій хроніці."
 SAF_light_tank_equipment_3:0 "Valentine"
 SAF_nav_bomber_equipment_1_short:0 "Swordfish"
 SAF_reclaim_boer_colonies_desc:0 "Колишня бурська колонія Трансвааль та інші регіони по праву належать вільним спадкоємцям цих заповзятливих людей."
 SAF_rocket_artillery_equipment_2:0 "RP-3 High Explosive/Semi Armor-Piercing"
 SAF_south_african_soviet_research_treaty:0 "Договір про дослідження з СРСР"
 SAF_sp_nuclear_bomb:0 "Проєкт бомби «Hamerkop»"
 SAF_support_axis_interests_desc:0 "Країни Осі мають можливості та ідеологія, які допоможуть Південній Африці зайняти своє місце у світі. Ми маємо надати їм повну дипломатичну підтримку."
 SAF_support_the_policy_of_appeasement_desc:0 "Німеччина має підстави для законного невдоволення, а домініонам міцно дісталося в попередній війні. Ми мусимо використовувати всі можливості для підтримки миру."
 SAF_tac_bomber_equipment_3_short:0 "Mosquito B"
 SAR_fascism_DEF:0 "Північноборнейська імперія"
