 SOV_rehabilitated_military_desc:0 "[GetRehabilitatedMilitaryName]"
 SOV_reinforce_northern_naval_bases_desc:0 "Незважаючи на те, що Мурманськ розташований на північ від Полярного кола, за іронією долі він є єдиним портом, який залишається вільним від криги цілий рік і має доступ до відкритого океану. Ми мусимо розвивати його далі, щоб забезпечити кращий доступ до решти світу."
