 ROM_change_sides_to_axis_desc:0 "Зміни в нашому уряді зажадали змін у нашому ставленні до війни. Приєднавшись до країн Осі, наші сьогоднішні «товариші» у глобальному конфлікті будуть чимало здивовані, коли румунські кулі знайдуть нову мету."
 ROM_demand_a_western_guarantee:0 "Вимогти гарантії від Заходу"
 ROM_fighter_equipment_3:0 "IAR 109G"
 ROM_militarize_the_sentinels_desc:0 "Воєнізована організація «Вартові» може бути легко перетворено на повноцінну військову організацію, якщо ми виділимо відповідні ресурси."
 ROM_mio_trait_mobile_tank_destroyers:0 "$ROM_mobile_tank_destroyers$"
 ROM_submarine_1:0 "Клас «Delfinul»"
 ROM_submarine_3:0 "Клас «Requinul»"
 ROM_tac_bomber_equipment_2:0 "IAR 633"
 RULE_ALLOW_GUARANTEES_BLOCKED_DESC:0 "Держави не можуть гарантувати жодні держави. Це не впливає на гарантії на початку гри та надані крізь спеціальні національні фокуси."
 RULE_ALLOW_LEND_LEASE_LIMITED_DESC:0 "Ленд-ліз обмежений рівнем світової напруженості та правилами ідеології."
 RULE_ALLOW_PARTY_BOOSTING_FREE_DESC:0 "Держави можуть збільшувати популярність партії в будь-якій іншій державі."
 RULE_ALLOW_RELEASE_NATIONS_NOT_TRANSYLVANIA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! не може дати незалежність цій державі."
 RULE_ALLOW_REVOKE_GUARANTEES_ALLOWED_DESC:0 "Гарантії незалежності можна скасовувати."
 RULE_FASCIST_USA_AI_DESC:0 "§HАмериканський§! ШІ намагатиметься перейти у фашизм і захопити світ крізь дерево національних фокусів."
 RULE_HABSBURG_HUNGARY_HUN_AI_DESC:0 "Угорський ШІ вибере своїм королем Йозефа Августа та відновить Велику Угорщину, але з правлінням Габсбургів."
 RULE_HORTHYIST_KING_HUNGARY_HUN_AI_DESC:0 "Угорський ШІ коронує або Міклоша Горті, або його сина як короля Угорщини та намагатиметься заснувати Велике Угорське королівство."
 RULE_KAISER_GER_AI_DESC:0 "Німецький ШІ намагатиметься повернути на престол кайзера, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI:0 "Австрійська демократія — федерація"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT:0 "Комунізм: Національно-визвольний альянс"
 RULE_OPTION_COMMUNIST_AST_AI_DESC:0 "§HАвстралійський§! ШІ намагатиметься перетворити країну на комуністичну та вступити в союз із Комінтерном, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_COMMUNIST_PHI_AI_DESC:0 "Над Філіппінами зійде червоне сонце, коли морський комунізм зміцнить свої позиції й почне поширювати дух рівності по всіх океанах світу."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS:0 "Продовження роботи над Зьойдерзее"
 RULE_OPTION_DICTATORSHIP_WARMONGER_AI_DESC:0 "ШІ піде шляхом авторитарної диктатури і намагатиметься розширити свої терени."
 RULE_OPTION_FASCISM_TUR_AI_DESC:0 "Реджеп Пекер перетворить §HТуреччину§! на фашистську диктатуру і спробує приєднатися до Осі."
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC:0 "§HПортугальський§! уряд прийме ідеологію фашизму, боротиметься з республіканцями в громадянській війні в Іспанії і намагатиметься повернути собі втрачені території в Африці, Азії та Америці, щоб країна знову стала наддержавою."
 RULE_OPTION_FOCUSES_ONLY:0 "Лише за фокусами"
 RULE_OPTION_FOCUSES_ONLY_38:0 "Лише за фокусами (до 1938 р.)"
 RULE_OPTION_GER_ALT_FASCIST:0 "$RULE_OPTION_FASCIST_ALTERNATE$"
 RULE_OPTION_HISTORICAL_IRQ_AI:0 "Історичний шлях"
 RULE_OPTION_JAP_FASCIST:0 "Асоціація допомоги трону"
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY:0 "$HOL_legacy_of_the_de_zeven_provincien_mutiny$"
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI:0 "Монархізм — анексія"
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI:0 "Фашисти-націоналісти (рексисти)"
 RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0 "Франко візьме контроль над §HНаціоналістичним фронтом§! й об'єднає ідеології фалангістів і карлістів у нову й об'єднану Іспанію та намагатиметься лишатися нейтральним у світовій війні, якщо тільки на країну не нападуть."
 RULE_OPTION_OCEANIA_DECOLONIZED_DESC:0 "Усі доступні для звільнення колонізовані нації в Океанії будуть створені як вільні та незалежні держави після початку гри."
 RULE_OPTION_REVOLUTION_UNALIGNED_INS_AI:0 "Sukarno's Revolution (нейтралітет)"
 RULE_OPTION_SAPMI_RELEASED_DESC:0 "Сапмі буде звільнено на територіях Фінляндії, Швеції та Норвегії."
 RULE_OPTION_SOV_FRAGMENTED_DESC:0 "Усі РСР Радянського Союзу будуть звільнені після початку гри. Регіон виглядатиме так само, як відразу після розпаду СРСР наприкінці Холодної війни."
 RULE_OPTION_SPR_FAMILIAR_DESC:0 "Кордони Іспанії будуть перемальовані на щось знайоме."
 RULE_OPTION_SWE_DEM_ALT_DESC:0 "Шведський ШІ піде демократичним шляхом, але, ймовірніше, буде активніше брати участь у війні, швидше переозброюючись і схиляючись до правої політики."
 RULE_OPTION_THEOCRATIC_ORDER_DESC:0 "Синархісти та крістерос прийдуть до влади в Мексиці та створять новий латиноамериканський орден для зачистки континенту від єретиків."
 RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC:0 "§HБританський§! ШІ намагатиметься зробити поступки профспілкам і зробити країну комуністичною, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_VOLUNTEERS_SOVIET_CHINA_ONLY_ONE_TT:0 "§RМи не можемо надсилати добровольців більш ніж одній китайській фракції.§!"
