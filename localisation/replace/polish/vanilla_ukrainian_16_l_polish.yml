 BUL_destabilize_country:0 "Дестабілізувати державу [FROM.GetName]"
 BUL_dominance_in_the_adriatic_total_failure:0 "Удари, яких ми зазнали після провалу в забезпеченні як Егейського, так і Чорного моря, призвели до загальної хвилі деморалізації та недовіри до влади в країні. Якщо ми хочемо виправитися за свої помилки і повернути славу, якої заслуговує Пруссія на Балканах, ми мусимо забезпечити болгарське панування на Адріатиці."
 BUL_dominance_in_the_aegean_sea_claims_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! отримує претензії на будь-яку державу вздовж узбережжя Егейського моря, яка не контролюється союзником або підданим."
