 SWE_support_danish_communists_desc:0 "Стратегічне положення [DEN.GetName] між Балтійським і Північним морями дає йому неприйнятний рівень контролю над нашою національною безпекою. Єдиний спосіб переконатися, що вони не зрадять нас, це підтримка [DEN.GetAdjective]ого комуністичного руху і встановлення там дружнього режиму."
