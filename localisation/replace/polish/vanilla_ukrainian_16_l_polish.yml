 news.10.d:0 "Перекинувши війська до румунського кордону, [SOV.GetNameDef] висунув ультиматум Бухаресту про негайну передачу контролю над Бессарабією, яка раніше була частиною Російської імперії. Румунія заявила, що в неї немає іншого вибору, як прийняти вимоги СРСР і залишити Бессарабію."
 news.111.t:0 "Падіння Нью-Йорка"
 news.112.t:0 "Падіння Гібралтару"
 news.13.f:0 "Наші товариші показують свою силу!"
 news.132.b:0 "Велика перемога!"
 news.138.b:0 "[GetSOVIdeologyLondonResponse]"
 news.164.b:0 "Вони зіткнуться з нашим гнівом"
 news.166.b:0 "Ми їх розчавимо."
 news.170.b:0 "Ми міцнішаємо."
 news.177.t:0 "Маленька Антанта"
 news.179.c:0 "Трагічний розвиток подій для Третьої республіки."
 news.189.d:0 "Згідно з Лондонською угодою 1915 року турецька провінція Анатолія мала відійти Італії. Інші договори мають більш високий пріоритет, але [From.GetAdjective]а влада не забула про ті обіцянки.\n\n[From.GetLeader] публічно заявляє про те, що оскільки узбережжя Анатолії є стратегічно важливим районом, [From.GetName] неодмінно забере те, що «по праву належить Італії»."
 news.192.c:0 "Ці території здаються більше італійськими, аніж югославськими."
 news.203.e:0 "Вочевидь, «демократії» Європи не здатні зупинити фашистську загрозу."
 news.21.d:0 "Держава [ROM.GetNameDef] була змушена піти на чергові поступки, коли держава [BUL.GetNameDef] вимагала повернення Південної Добруджі. Ця територія була анексована Румунією в 1913 році після Другої Балканської війни. Основним населенням там досі є етнічні болгари й турки. Незалежно від причин цього рішення, держава [ROM.GetNameDef] значно ослабла."
 news.210.b:0 "Ми повинні стежити за нашими південно-східними кордонами"
 news.22.a:0 "Іще одна жертва амбіцій Італії."
 news.228.d:0 "\n[ENG.GetNameDef] — не єдина держава, хто бачить зростання загрози в Центральній Європі.\n\nМаючи статус незалежної держави, гарантований Версальським договором, який нині оскаржується, або фашистські держави, які у своїй агресивній риториці заявляють про свої права на їхню територію, деякі держави побачили необхідність проводити про[ENG.GetAdjective]у політику.\n[ENG.GetNameDef] відреагував на цей розвиток подій, подвоївши свої дипломатичні зусилля в регіоні."
 news.230.a:0 "Вони поставлять нашу країну на межу загибелі!"
 news.240.t:0 "Джаяпурський договір"
 news.241.t:0 "[NZL.GetNameDefCap] підпорядковується [AST.GetAdjective]ому впливу"
 news.247.e:0 "Чорт забирай ці мінливі [CAN.GetAdjective]!"
 news.252.f:0 "Ми стаємо все сильніші!"
 news.261.b:0 "Яка безглузда домовленість."
 news.265.desc:0 "Після приголомшливої поразки, якої Франція зазнала на своїй батьківщині, легітимність її колоніальної імперії була поставлена під сумнів. Уряди [SOV.GetNameDef] і [SAF.GetNameDef] виступили зі спільною заявою, в якій заявили, що Франції більше не можна довіряти підтримання порядку на Мадагаскарі, і вимагають передати острів під контроль [SAF.GetNameDef].\n\nУряд вільної Франції зібрався для обговорення цього питання. Військові експерти вважають малоймовірним, що виснажені французькі війська зможуть захистити острів, якщо розпочнеться війна."
 news.289.e:0 "Війна загострюється..."
 news.291.a:0 "Наші братні зв'язки не були забуті."
 news.311.b:0 "Ми стоїмо як один. Нехай приходять!"
 news.317.f:0 "І хто ж тепер ворожий?"
 news.318.desc:0 "У відповідь на румунський ультиматум і під загрозою негайних військових дій із боку Румунії у разі відмови, болгари внесли значні зміни до складу свого уряду, щоб зробити його більш дружнім до Румунії. Болгарія прийняла всі вимоги свого сусіда, і малоймовірно, що вона відмовиться від подальших прохань. Як наслідок, тепер її можна розглядати лише як румунську маріонетку."
 news.321.desc:0 "За підбурюванням Румунії, Югославії було висунуто ультиматум із закликом до «реструктуризації держави». Зіткнувшись з тиском з боку кількох сусідів одночасно, югослави не бачили іншої альтернативи, окрім як погодитися, і наразі відбувається розкол нації."
 news.328.t:0 "Югославія претендує на італійський кордон"
 news.329.a:0 "У них є цікаві ідей."
 news.335.e:0 "Погані новини для Японії — хороші новини для нас"
 news.63.a:0 "Що це означатиме для Іспанії?"
 news.64.a:0 "Цікавий розвиток подій."
 nsb_news.104.c:0 "Нечесна битва..."
 nsb_news.301.t:0 "Гірські республіки об'єднуються"
 nsb_news.303.b:0 "Вплив Росії на сході падає..."
 nsb_news.4.c:0 "Від Польщі ми очікували більшого."
 nsb_news.403.t:0 "[SOV.GetAdjective] втручання у справи Американського континенту"
 nsb_news.5.b:0 "Царство прийшло."
