 TUR_sectarian_woes_desc_tt:0 "§WВнутрішня розділеність держави [TUR.GetNameDefCap] географічно відображена крізь §Yобласні модифікатори§!: £faction_tur_kemalist §Yкемалістів§! можна знайти на заході та на півночі, релігійних £faction_tur_traditionalist §Yтрадиціоналістів§! — на внутрішніх землях і на півдні, а £faction_tur_kurdish §Yкурдів§! — на південному сході держави.\n\nВзаємодії з різними §Yфракціями§! доступні у §Yвкладці рішень§!, а також крізь §Yефекти деяких фокусів§! і §Yваріантів у подіях§!.§!"
