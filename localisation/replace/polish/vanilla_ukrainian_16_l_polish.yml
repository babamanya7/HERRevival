 CHL_political_events.74.desc:0 "Коли люди зібралися перед Президентським палацом у Сантьяго на тлі війни, що роздирає націю, Президент Карлос Ібаньєс дель Кампо оголошує, що він і парламент обрали Жака Антуана Бернара новим королем, повернувши його роду давно втрачений титул, втрачений у 1862 році. Ібаньєс заявив, що Антуан III є єдиним порятунком, який може знайти нація зараз, і тим, хто знову збере нашу розколоту війною спільноту."
 CHL_political_events.78.a:0 "Дуже добре. Ми допоможемо їм."
