 CHI_sea_rely_on_our_infantry_desc:0 "Армії, орієнтовані на піхоту, ще не підводили нас і ніколи не підведуть. Тому логічно буде інвестувати в них більше, щоб мати перевагу проти будь-якого потенційного ворога."
