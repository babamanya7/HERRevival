 SWI_basic_council_TT:0 "\n\nТри призначені §Yполітичні радники§! обіймають почаду §Yпровідних канцлерів§!, і щороку одного з них можна вибрати §Yпрезидентом Конфедерації§!, що відкриває особливе рішення. §RПосада політичного радника не мусить бути порожньою, інакше на країну накладуться штрафи.§!"
 SWI_buy_foreign_surplus_ships_desc:0 "Надлишок однієї країни — це флот іншої. Зараз у багатьох великих морських держав світу є флоти, наповнені абсолютно новими кораблями, а це означає, що старі кораблі майже застаріли, і все ж коштує їх обслуговування. Якщо ми хочемо швидко наростити військово-морську міць, немає кращого способу, ніж купити у них непотрібні кораблі."
 SWI_centralization_bop_very_cantons:0 "Сильна влада кантонів"
 SWI_concessions_to_democrats_desc:0 "[SWI_concessions_to_political_party_desc]"
 SWI_emergency_industry_desc:0 "Тепер, коли ми змушені знищити свій власний промисловий потенціал, коли ворог вторгнеться в наші штати, ми повинні переконатися, що у нас є запасний варіант, який ми зможемо використати, щоби підкріпитися тим, що у нас залишилося, і дати відсіч загарбникам. Таємні тунелі та фабрики заселятимуть серця наших гір і долин, деякі з них можуть навіть перебувати за межами наших кордонів."
 SWI_heer_und_haus_desc:0 "Народ Швайцарії, а отже, і її армію, потрібно заохочувати зсередини до опору та боротьби за захист своєї батьківщини. Щоб нагадати про те, що поставлено на карту, Pro Helvetia за допомогою групи Aktion Nationaler Widerstand є ключовими для них, щоб думати та діяти по-[ROOT.GetAdjective]и."
 SWI_jump_into_action:0 "Перейти до дії"
 SWI_martial_law:0 "Воєнний стан"
 SWI_military_collaboration:0 "Військове співробітництво зі Швайцарією"
 SWI_military_police_desc:0 "Наших давніх федеральних інституцій буде недостатньо для підтримки порядку, який нам потрібен у ці непевні часи. Військова поліція буде потрібна, якщо ми хочемо зберегти нашу єдність."
 SWI_neutral_entente:0 "Нейтральна Антанта"
 SWI_press_for_vorarlberg_desc:0 "Оскільки [AUS.GetAdjective]ий уряд залишається в руїні, ми повинні виконати демократичну волю [848.GetName], висловлену на референдумі 1919 року, та інтегрувати їх у нашу демократію. Обов'язком [ROOT.GetNameDef] є захистити їх від фашизму та автократії."
 SWI_promote_tobler_desc:0 "Як єдиний член фашистської партії, обраний до парламенту [ROOT.GetAdjective] і лідер Національного фронту, Роберт Тоблер є очевидним кандидатом очолити [ROOT.GetNonIdeologyName] повільний, але стабільний перехід від демократичної плюралістичної нації до [SWI_get_fascist_neighbor_adjective] Союзник, керований залізною рукою. Це, звичайно, означатиме виключення Рольфа Генне з партії, фюрер може бути лише один."
 SWI_recruited_assasin_as_agent:0 "Завербували відомого вбивцю як агента"
 SWI_submarine_raiders_desc:0 "Нехай старі військово-морські держави мають свої величезні купи сталі. У той час як вони б'ються грубою силою на морях, ми будемо битися з хитрістю під поверхнею за допомогою наших підводних човнів, знищуючи їх стару та занепалу морську міць."
