l_polish:
 AAT_Sweden.22.desc:0 "Сьогодні [FROM.GetAdjective]і дипломати повідомили нам, що їхній уряд не бажає вступати до альянсу $scandinavian_defense_union$. Вони стверджують, що їхні інтереси будуть краще захищені поза межами такої організації; принаймні, на даний момент."
 AAT_Sweden.43.a:0 "Маленький жест може знизити напругу."
 AAT_Sweden_flashpoints.34.b:0 "Це не варте ризику."
 AAT_Sweden_flashpoints.40.t:0 "[GER.GetName] просить доступ до телефонних і телеграфних мереж"
 AAT_Sweden_flashpoints.53.a:0 "Ця революція вже давно назріла."
 AAT_Sweden_flashpoints.82.a:0 "Виправдана ціна."
 AAT_Sweden_flashpoints_tt_arne_beurling:0 "Відкриває §YАрне Бьорлінга§! ($MODIFIER_DECRYPTION_POWER$: §G+15§!) в якості радника."
 AAT_Sweden_nationalists.1.desc:0 "Представники провідної націонал-соціалістичної партії у державі [SWE.GetName] звернулися до нас із пропозицією. Вони готують повалення нинішнього уряду і звернулися до нас за підтримкою у цій спробі. В обмін на військову підтримку вони погодилися на перехід країни в нашу сферу впливу."
 AAT_Sweden_nationalists.29.a:0 "$AAT_Sweden_nationalists.22.a$"
 AAT_Sweden_nationalists.5.t:0 "Катастрофічний марш штурмовиків у регіоні [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.7.a:0 "Вони перебудують державу [SWE.GetName]"
 AAT_Sweden_nordic_defense_council.1.b:0 "Ми долучимося як члени ради."
 AAT_USA_events.09.t:0 "[FROM.GetNameDefCap] повертає територію Данії"
 AAT_britain_narvik.1.b:0 "Продовжити кампанію."
 AAT_finland_continuation_war.08.a:0 "Давайте підпишемо перемир'я"
 AAT_finland_diplomacy.05.desc:0 "Схоже, [FROM.GetName] бере на себе роль охоронця свободи і культури саамських народів, корінного населення земель на півночі Європи. [FROM.GetNameDefCap] просить нас віддати територію, яку традиційно населяють саами, щоб їхні інтереси були краще захищені, а самі ці народи возз'єдналися."
 AAT_finland_diplomacy.13.desc:0 "[FROM.GetLeader] заявляє, що не буде віддавати нам свої східнокарельські території і що наше прохання не принесло б їм нічого, окрім горя для [FROM.GetAdjective]ого народу."
 AAT_finland_diplomacy.23.a:0 "Ми візьмемо їх під своє крило"
 AAT_finland_diplomacy.28.a:0 "Значить, ми самі по собі!"
 AAT_finland_kinship_war.02.a:0 "Ми цілком підтримуємо наших карельських братів!"
 AAT_finland_political.04.desc:0 "У нас трагічні новини. Президент держави [ROOT.GetName], [ROOT.GetLeader], більше не з нами. Здоров'я лідера вже давно погіршувалося, через інсульт настав параліч правої руки.\n\nСмерть настала внаслідок серцевого нападу по дорозі додому після відставки з поста президента за станом здоров'я, прямо на центральному вокзалі Гельсінкі. Під час прощання з главою держави почесна варта грала патріотичний фінський марш Porilaisten marssi, проводжаючи президента у відставку."
 AAT_finland_the_white_death.5.t:0 "Сімо Гяюгя отримав прізвисько Біла Смерть."
 AAT_germany.1.a:0 "Це не в наших найкращих інтересах."
 AAT_nordic_cooperation.1.a:0 "Ми не можемо дозволити собі подальшу ескалацію цього конфлікту."
 AAT_nordic_cooperation.8.a:0 "Чудові новини!"
 AAT_norway.14.a:0 "Він стане в нагоді."
 AAT_norway.15.a:0 "Майбутнє [NOR.GetAdjective]ої держави, на жаль, може бути за Квіслінгом."
 AAT_norway_communist.2.desc:0 "Як і їхні предки, наші товариші з держави [FROM.GetNameDef] прагнуть торгувати з нами через наші найпівнічніші береги. Це буде взаємовигідна угода, яка покаже робітникам обох наших країн переваги нашої комуністичної дружби."
 AAT_norway_fascist.4.b:0 "Ми з цього нічого не виграємо."
 ABANDON_GAME:0 "Покинути гру"
