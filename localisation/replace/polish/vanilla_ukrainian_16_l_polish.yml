 ITA_albanian_fascist_militia_occupation_law_tt:0 "Відкриває доступ до окупаційного закону в §Yалбанських§! областях: §Y$colonial_police$§!.\n"
 ITA_anti_partisan_measures_state_modifier_rsi_tt:0 "$ITA_modify_partisan_state_modifier_intro$\n$MODIFIER_REQUIRED_GARRISON_FACTOR$: §G-10%§!\nШвидкість росту спротиву $ITA_in_our_controlled_states_cw$: §G-5%§!\n\n"
 ITA_army_primacy:0 "Верховенство армії"
 ITA_bop_criticize_the_war_desc:0 "Наші доблесні війська зазнають труднощів через некомпетентне керівництво, погану логістику та недостатнє оснащення. Ці проблеми мають бути виправлені!"
 ITA_bop_question_the_airforce_desc:0 "Нещодавні події, які продемонстрували неефективність ВВС, змусили багатьох людей замислитися над тим, наскільки саме ці війська лояльні до Італії та фашистської системи."
 ITA_bring_back_exiled_intellectuals:0 "Повернути засланих інтелектуалів"
 ITA_by_blood_alone_desc:0 "Завдяки силі нашої армії та безмежному фанатизму лояльних нашому режиму італійських іредентистів, Італія нарешті поставить свій підпис в анналах історії — і не як простий другорядний персонаж, а як головний герой.\nОдна лише кров рухає колеса історії!"
 ITA_cacciatorpediniere_di_scorta_desc:0 "Одним із головних завдань [GetAppropriateRegiaMarinaNsName] є захист морських шляхів між Італією, Північною Африкою та нашими середземноморськими островами. Будуючи малі есмінці з акцентом на боротьбу з півдодними човнами й ефективно тренуючи їхні екіпажі, ми зможемо ліпше підтримувати потік припасів для наших військ за морем."
 ITA_citta_dell_aria:0 "Città dell'Aria"
 ITA_compagnie_auto_avio_sahariane:0 "Розширити Compagnie Auto-Avio Sahariane"
 ITA_conquer_the_south_mission_desc:0 "Ефіопи, ймовірно, не очікують наступу на півдні. Ми повинні деморалізувати їхню армію і зменшити їхню підтримку в Лізі Націй, швидко захопивши області [837.GetName] і [836.GetName]."
 ITA_cooperate_with_moderates_desc:0 "Немає причин не співпрацювати з менш радикальними елементами колишнього фашистського режиму. Є дуже здібні люди, які могли би допомогти рухати оновлену італійську державу вперед."
 ITA_cooperation_programs_deal_sweden_tt:0 "([ROOT.GetFlag]§Y[ROOT.GetName]§!): Передасть §Y2 есмінці класу «Curtatone»§! and §Y2 есмінці класу «Maestrale»§! державі §Y[SWE.GetFlag][SWE.GetNameDef]§!."
 ITA_destroyer_2_desc:0 "Клас «Soldati» — це група есмінців, побудованих наприкінці 1930-х років. Існувало дві партії. Дванадцять кораблів склали першу партію в 1938-39 роках. П'ять кораблів були завершені в другій партії в 1941-42 роках. Перша партія мала водотоннажність трохи більше 1800 тонн і була озброєна чотирма 120-мм гарматами Ansaldo."
 ITA_economic_reforms_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-2.5%§!\n$modifier_production_speed_arms_factory_factor$: §G+5.00%§!\n$modifier_production_speed_industrial_complex_factor$: §G+5.00%§!\n\n"
 ITA_forza_navale_especiale_desc:0 "Здатність здійснювати морські висадки, ймовірно, виявиться безцінною для будь-якого конфлікту в Середземному морі. Створивши спеціальні військово-морські сили, підготовлені й оснащені для проведення десантних операцій, ми зможемо проєктувати силу з моря в будь-яку точку довгого середземноморського узбережжя."
 ITA_gloria_al_regno_d_italia:0 "Gloria al Regno d'Italia"
 ITA_grandi_high_control_range:0 "$ITA_mussolini_high_control_range$"
 ITA_grandi_total_control_range:0 "$ITA_mussolini_total_control_range$"
 ITA_heavy_fighter_equipment_3:0 "Savoia-Marchetti SM.92"
 ITA_infantry_equipment_2:0 "MAB-38"
 ITA_invite_france_to_military_partnership:0 "Запросити Францію до військового партнерства"
 ITA_italian_ajaccio_name:0 "Аяччо"
 ITA_italian_tankettes_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$ITA_military_industry_dynamic_modifier_tankettes_tt$\n"
 ITA_japan_friend_desc:0 "Японці багато в чому схожі на нас: молода, голодна держава з позитивною демографією, викуплена торгівлею в занепадаючих плутодемократичних країн, таких як Сполучене Королівство та Нідерланди. Ми мусимо об'єднатися з ними, щоби сформувати потужну військово-морську вісь крізь океани!"
 ITA_keep_specialization_desc:0 "Тим часом як решта світу, мабуть, забула про цінність майстерності, точності та якості, ми в Італії цього не забули. Наші майстри завжди приділяють увагу найменшим деталям і створюють те, що, безперечно, є найліпшим прикладом будь-якого обладнання, над яким вони працюють."
 ITA_libyan_infrastructure_bba:0 "$ITA_libyan_infrastructure$"
 ITA_medium_tank_artillery_equipment_2_short:0 "Semovente M 41 75/18"
 ITA_midget_submarines_decision_tt:0 "\nКоли буде завершено фокус §Y$ITA_cooperation_programs$§!: \nВідкриває доступ до: §Y$ITA_export_midget_submarines$§!."
 ITA_missiolini_pacify_ethiopia:0 "Утихомирити Ефіопію"
 ITA_multirole_aircraft:0 "Багатоцільові літаки"
 ITA_negotiations_with_albania:0 "Переговори з Албанією"
 ITA_new_ricostruzione_industriale_train:0 "$ITA_new_ricostruzione_industriale$ (потяги)"
 ITA_prepare_for_the_coming_wars_desc:0 "Війна насувається на нас звідусіль, і нам потрібна потужна військова промисловість, щоби задовольнити потреби наших військових."
 ITA_raise_the_peoples_spawn_divs_tt:0 "Створити §Y6§! дивізій §YCamicie Rosse§! в області §Y[THIS.GetName]§!."
 ITA_reduced_chance_of_air_accidents_tt:0 "\nЗнижує ймовірність загибелі персонажів унаслідок історичних нещасть."
 ITA_russian_government_ideology_desc_alt:0 "На жаль, капіталізм і фашизм — не єдині вороги, з якими нам доводиться стикатися. Послідовники сталінської доктрини бачать у нашому уряді та нашій країні загрозу своїм інтересам і готові знищити нас будь-якими засобами. Ми не можемо бездіяльно чекати, поки вони нападуть — ми мусимо завдати удару першими!"
 ITA_scientific_cooperation_allies_ns_tt:0 "Дасть національний дух §Y$ITA_scientific_cooperation$§! державі §Y[ROOT.GetNameDef]§! та §Yкожному [ROOT.GetAdjective]ому союзнику§!."
 ITA_solid_progress_desc:0 "Ми впевнено просуваємося в Ефіопії, не перенапружуючи наші позиції і не наражаючи наші сили на ефіопські контратаки. Хоча перемогу ще не досягнуто, це лише питання часу."
 ITA_specialization_desc:0 "Як би ми не намагалися, ми ніколи не зможемо зрівнятися з великими державами за обсягами виробництва. Єдиний спосіб конкурувати в повітрі — будувати ліпші літаки, ніж будь-хто інший. Кожен із них мусить могти виграти бій, навіть якщо їхня чисельність буде втричі чи вчетверо меншою."
 ITA_strengthen_the_blackshirts_spawn_divs_tt:0 "Створити §Y3§! дивізії §YCamicie Nere§! в області §Y[THIS.GetName]§!."
 ITA_submarine_4_desc:0 "Підклас «Pietro Calvi» передбачав лише незначні покращення у порівнянні з попереднім класом «Flutto», який належав до класу середніх підводних човнів. Лише кілька з них були спущені на воду, оскільки більшість корпусів були захоплені німцями після італійського перемир'я. Перероблена версія підводного човна «Pietro Calvi» була остаточно введена в експлуатацію в 1961 році."
 ITA_supermarina_desc:0 "Необхідно створити сучасний оперативний центр для головнокомандувача Regia Marina, щоби координувати операції наших військово-морських формувань у всьому Середземномор'ї та за його межами."
 ITA_supremacy_in_the_skies_desc:0 "Сучасна армія не може успішно діяти без підтримки потужних ВПС. Надзвичайно важливо, щоби наша країна мала найсучасніші літаки та технології для панування в небі."
 ITA_the_new_emperor_of_ethiopia_king_trait_tt:0 "$vittorio_emanuele$ як лідер нейтралів:"
 ITA_the_papacy_reborn_desc:0 "Тепер, коли Його Святість скинув короля і взяв повний контроль над Італією, настав час італійському народу приєднатися до бачення та цілей Церкви."
 ITA_the_path_to_progress:0 "Шлях до прогресу"
 ITA_the_southern_farmlands_tt:0 "§YКоли почнеться громадянська війна§!:\nМи візьмемо контроль над §Yпівнічноіталійськими областями§!.\nБуде створено §Y5§! додаткових §Yдивізій ополчення§!.\nФашистська сторона зазнає пошкоджень інфраструктури та центрів постачання. Фашистські дивізії будуть пошкоджені виснаженням."
 ITA_train_irregulars:0 "Тренувати нерегулярні війська"
 ITA_undermine_the_duce:0 "Підірвати посаду дуче"
 ITA_unlocks_decision_cede_aquila_class_destroyers_to_spain_tt:0 "Відкриває доступ до: §YВіддати есмінці класу «Aquila»§!.\n\n"
 ITZ_democratic_DEF:0 "Іцинська федерація"
 JAP_STATE_1031:0 "Чюсей-Дзенра"
 JAP_VICTORY_POINTS_1150:0 "Рьоджюн"
 JAP_authorize_aid_to_ethiopia_desc:0 "Наша фракція підтримувала контакти з [ETH.GetAdjective]им урядом протягом багатьох років, що врешті призвело до того, що ми схилили уряд до допомоги в модернізації [ETH.GetNameDef]. Тепер вони опинилися під ударом західної держави. Ми повинні негайно надіслати їм допомогу!"
 JAP_border_conflict_escalation_warning_MON:0 "[JAP.GetAdjective]а підготовка"
 JAP_build_an_anti_army_coalition:0 "Створити антиармійську коаліцію"
 JAP_cast_the_die:0 "Кинути жереб"
 JAP_crackdown_on_foreign_agents_desc:0 "Бюро розвідки при Кабінеті міністрів виявило безліч підозрілих осіб, що нишпорять довкола. Деякі з них сповідують небажані ідеології, а деякі є очевидними агентами іноземних держав. Можливо, настав час для бюро вжити заходів і розпочати кампанію із захисту нашої нації та її народу?"
 JAP_cruiser_ship_engine_4:0 "«Kampon» 152 000 к. с. н. в."
 JAP_democratic_foreign_exchange_allocation_policy:0 "Політика розподілу іноземної валюти"
 JAP_democratic_state_flipping_cost_cost_increase_tt:0 "Вартість прийняття цього рішення §Rзросте на 15§!"
 JAP_develop_tonkin_aluminium_deposits:0 "Розвиток родовищ бокситів у Тонкіні"
 JAP_development_for_the_undeveloped:0 "Розвиток для нерозвинених"
 JAP_embrace_amakudari_desc:0 "Амакударі, що буквально означає «спуск із небес», описує практику, коли наші відставні високопоставлені чиновники займають керівні посади в приватних компаніях, часто в тій самій галузі, яку вони раніше регулювали. Хоча це може значно погіршити ефективність нашої промисловості, це дає нам значне розуміння нашого суспільства та контроль над ним."
 JAP_empower_the_yi_dynasty_decision:0 "Надати владу династії Лі"
 JAP_establish_kingdom_of_kampuchea_decision:0 "Створити Королівство Кампучія"
 JAP_establish_manchuria_airplane_manufacturing_company:0 "Створити Маньчжурську авіабудівну компанію"
 JAP_foreign_tank_modernization_cooperation:0 "Ініціатива іноземної модернізації танків"
 JAP_fund_propaganda_films_tt:0 "Оновлює рішення §Y[ROOT.GetImportOrDomesticFilmIndustry]§!"
 JAP_fund_the_riken_institute_tt:0 "Якщо $JAP_zaibatsu_faction$ має рівень §Y$JAP_imperial_influence_tier_3$§!, також додається §G1§! §Yоб'єкт ядерних досліджень§!"
 JAP_ganbarou_desc:0 "[ROOT.GetAdjective]і чоловіки та жінки — це працьовиті люди, які віддадуть усе, щоб забезпечити державу. Ми повинні пропагувати це і просувати сумлінну працю та старанність як основну частину [ROOT.GetAdjective]ого суспільства."
 JAP_gather_royal_pacifists_support_tt:0 "Якщо §YІмператор Хірохіто§! стане на бік військових під час §YГромадянської війни§!, ми зможемо зберегти §Yпідтримку двору§! від його молодшого брата §YНобухіто§! та його матері §YСадако Кудзьо§!"
 JAP_greater_army_dominant_fascism_ADJ:0 "Імперсько-японськ"
 JAP_greater_east_asian_federation_desc:0 "Нарешті настав день, коли ми можемо об'єднати азійські народи в одній державі! Ми повинні діяти швидко, щоб інтегрувати наші складові частини та сформувати Велику Східноазійську Федерацію, поширюючи демократію в усі куточки Азії."
 JAP_greater_navy_dominant_fascism:0 "Велика Японська імперія"
 JAP_growing_unrest_in_the_shanghai_concession_desc:0 "Після того, як нам передали великі ділянки землі, здається, що [CHI.GetAdjective]е населення, яке живе у міжнародній концесії, стає неспокійним і нетерплячим через боягузтво режиму. Вони можуть спробувати щось зробити найближчим часом..."
 JAP_guardian_of_MAL:0 "Перейняти панування над Малайєю"
 JAP_gw_tank_equipment_short:0 "Ko-Gata"
 JAP_heavy_cruiser_3:0 "Клас «Tone»"
 JAP_heavy_cruiser_4:0 "Клас «Ibuki»"
 JAP_hold_a_peoples_tribunal_tt:0 "Кілька §Yвійськових радників§! засуджені за співпрацю зі старим урядом і відправлені у відставку з активної служби:"
 JAP_invite_com_south_ame_nation_to_faction_decison:0 "Запросити §Y[FROM.GetNameDef]§! до Інтернаціоналу"
 JAP_kawanishi_aircraft_company_organization:0 "$kawanishi_aircraft_company$"
 JAP_light_ship_engine_3:0 "«Kampon» 52 000 к. с. н. в."
 JAP_military_doctrine_shortcut:0 "Військові сили"
 JAP_minshu_shugi:0 "Міншю Шюгі"
 JAP_mio_trait_special_government_contracts_mitsubishi_trait:0 "Спеціальні державні контракти"
 JAP_mio_trait_torpedo_reloads:0 "Запасні торпеди"
 JAP_mountain_village_operation_units_desc:0 "Сандзо Носака дозволив створення підпільних воєнізованих загонів і таємних осередків у сільських та віддалених селах з метою проведення партизанських операцій проти уряду та підготовки до загальнонаціональної комуністичної революції. Для сприяння цьому по всій країні розпочато розповсюдження брошури «Як вирощувати цибулини квітів»."
 JAP_nanshin_ron_desc:0 "Хоч Китай і Сибір багаті, вони не володіють усіма необхідними нам ресурсами. Однак неподалік на півдні лежать Філіппіни, Нідерландська Ост-Індія та британські колонії Малайя і Борнео. Для справжньої самодостатності ми повинні вирвати контроль над цими територіями з рук європейських імперіалістів."
 JAP_pacific_guardian_desc:0 "Ми візьмемо він роль опікуна всіх азійських країн Тихоокеанському регіоні. Скинувши пута західного імперіалізму, вони тепер потребують керівництва на шляху становлення повноцінної демократії."
 JAP_preemptive_war_desc:0 "Сфальсифікувавши про наростаючу [SOV.GetAdjective] агресії біля наших північних кордонів ми забезпечимо собі привід для превентивного удару заради нейтралізації загрози з півночі."
 JAP_prepare_the_northern_front_desc:0 "Квантунська армія вже дуже давно прагне вступити в справжній бій проти [SOV.GetNameDef], але їй бракує військової інфраструктури, необхідної для успіху. Ми повинні інвестувати в розширення доріг і залізниць у Маньчжурії, щоб ми могли зрештою успішно вигнати [SOV.GetAdjective]і війська із Сибіру."
 JAP_prepare_the_southern_front:0 "Підготовка Південних фронтів"
 JAP_promulgate_the_military_ministers_system:0 "Система військових міністрів із діючих офіцерів"
 JAP_raid_category_fluff_text_paratrooper_raids:0 "§LТейшін Шюдан§!"
 JAP_reduce_zaibatsu_focus_cost_tt:0 "Виконання фокусів §Y$JAP_sea_guide_the_zaibatsus$§! або §Y$JAP_democratic_work_with_the_zaibatsus$§! зменшить час, необхідний для виконання цього фокусу, до §G35§! днів."
 JAP_reeducation_campaign_desc:0 "Після великої революції у всій країні спостерігаються народні заворушення. Ми мусимо провести просвітницьку кампанію, щоби сформувати найбажанішу поведінку."
 JAP_return_to_sakoku_ron_desc:0 "Наша нація припинила свою ізоляцію лише через комодора Перрі та [USA.GetAdjective]у дипломатію канонерок. Оскільки зовнішній вплив зараз розбещує і руйнує душу нашої нації, ми повинні запровадити другу еру ізоляції."
 JAP_rocket_suicide_equipment_1_desc:0 "Yokosuka MXY7 Ohka — протичовновий реактивний літак-камікадзе спеціального призначення, який використовувався Японією ближче до кінця Другої світової війни."
 JAP_sea_long_operational_range_desc:0 "Як би ми не бажали швидких перемог, війни нелегко виграти лише прямими військовими зіткненнями. Відстані, пов'язані з війною на Тихоокеанському театрі, величезні, і тому нам потрібні моделі, здатні долати ці відстані, якщо ми хочемо досягти успіху."
 JAP_sea_purge_the_kodoha_faction_tt:0 "§YСадао Аракі§! та §YШігеру Хонджьо§! будуть відправлені у відставку з дійснї служби"
 JAP_sea_sturdy_aircraft:0 "Міцні літаки"
