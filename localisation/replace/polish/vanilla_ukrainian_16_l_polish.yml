 ENG_dominions_stayed_with_fascist_britain_flag:0 "Залишилися з фашистською Великою Британією."
 ENG_enforce_the_naval_treaties_tt:0 "Цим можна скористатися, щоби вимогти від країн, які мають забагато §Yосновних кораблів§! порівняно з ними, §Gзменшити§! їхню кількість. У випадку відхилення ми отримаємо ціль війни §YМаріонетка§!.\n"
