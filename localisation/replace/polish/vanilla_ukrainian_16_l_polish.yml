 lar_split_belgium.3.desc:0 "[From.GetAdjective]ий уряд жорстко відреагував на розмови про возз'єднання Валлонії та Франції, пройшовшись по штабах груп, що виступають за об'єднання, і заарештувавши їх лідерів. Подавши офіційний протест, наш посол отримав різку відповідь: [From.GetAdjective]ий уряд відповідає за підтримання порядку в країні і тому не має наміру піддаватися агентам іноземного впливу."
