 PER_greater_iran_ADJ:0 "Іранськ"
 PER_gulf_decisions_cat:0 "[ROOT.GetAdjective] проекція сили"
 PER_imperial_events.100.a:0 "Нехай вони більше ніколи не намагаються напасти."
 PER_imperial_events.100.desc:0 "Після того, як вдалося витіснити загарбників і відправити їх далі назад на їхні власні землі, ми змогли звернутися до наших ворогів, щоб запросити їхніх дипломатів до Тегерана для початку мирних переговорів. На щастя, вони були сприйнятливі до пропозиції, і після годин обговорень ми домовилися, що вони припинять напад на [PER.GetNameDef], поступаючись своїми прикордонними територіями як наслідок."
 PER_imperial_events.110.desc:0 "$PER_imperial_events.80.desc$"
 PER_imperial_events.130.t:0 "[PER.GetNameDefCap] домовляється про свою здачу"
 PER_imperial_events.142.desc:0 "У досить несподіваному повороті подій, [FROM.GetLeader] прийняв [ROOT.GetAdjective] декларацію незалежності. З цього моменту [FROM.GetNameDef] не має жодного впливу на [ROOT.GetAdjective] політику, ні внутрішню, ні зовнішню. Масовий натовп, що святкує керівництво [ROOT.GetLeader], зібрався на головній площі [ROOT.Capital.GetCapitalVictoryPointName]."
 PER_imperial_events.16.desc:0 "Здається, [RAJ.GetAdjective] уряд категорично відмовився віддавати Белуджистан. Настав час нам триматися своєї зброї та оголосити війну [RAJ.GetNameDef]!"
 PER_imperial_events.171.a:0 "Це можна вважати перемогою!"
 PER_imperial_events.182.a:0 "Як прикро..."
 PER_imperial_events.20.t:0 "Реза-шах Пехлеві вбитий!"
 PER_imperial_events.201.a:0 "Ви завжди будете дорогим другом для [ROOT.GetNameDef]."
 PER_imperial_events.40.c:0 "Шах одружиться з Ірандохт Каджар"
 PER_import_rocketry:0 "Імпортувати ракетні конструкції"
 PER_invite_british_investors_desc:0 "Щоб покращити нашу економіку та відновитися після вторгнення, ми можемо спробувати лобіювати [ROOT.OVERLORD.GetNameDef], щоб вони надали нам інвесторів, які допоможуть нашій промисловості повернутися до нормального стану."
 PER_iranian_culture:0 "Об'єднати ультранаціоналістів"
 PER_islamic_revolution_events.2.b:0 "Негайно заспокоїти духовенство."
 PER_orchestrating_rebellions:0 "Організація повстань"
 PER_pan_iranianism_desc:0 "За межами наших кордонів залишаються анклави іранських народів, ситуація, яку не можна допустити. Настав час просувати більшу іранську ідентичність та починати сприяти об'єднанню нашого народу."
 PER_proclaim_greater_iran:0 "Проголосити Великий Іран"
 PER_promise_clergy_power:0 "Обіцяти владу духовенству"
 PER_provisional_government_long:0 "Тимчасовий уряд"
 PER_radio_boost_active:0 "Радіокампанія триває"
 PER_reach_to_seperatists_desc:0 "Робітничий клас не повністю усвідомив свої соціально-економічні умови, і тому йому бракує сил, щоб подолати вкорінену владу шаха. Однак є багато людей на півночі та сході, яких підбурюють азербайджанські чи курдські настрої, яких можна схилити до нашої справи."
 PER_reintegrate_anatolia_tt:0 "Відмикає рішення §YРеінтегрувати Анатолію§!, які дозволяють нам інтегрувати завойовані території в нашу націю."
 PER_retake_north_iran_desc:0 "Під час нашої початкової капітуляції та прохання про здачу, у нас не було вибору, окрім як поступитися нашими північними територіями [SOU.GetNameDef]. Тепер, коли ми набрали більше сили, настав час вдарити по цих загарбниках та повернути те, що належить нам по праву."
 PER_soviet_alignment_desc:0 "Світ швидко змінюється, і нам потрібні могутні союзники, щоб стримувати наших ворогів. Партія Туде — єдина соціалістична партія, яка має зв'язки з [SOU.GetNameDef], і як така, може сприяти міцним стосункам з ними."
 PER_ssb_events.1.t:0 "[SSB_leader.GetNameDefCap] запрошує нас до Саадабадського альянсу"
 PER_viceroyalty_of_iran_ADJ:0 "Іранськ"
 PHI_GATHERING_STORM_DESC:0 "У 1935 році Сполучені Штати нарешті погодилися на мирний перехід до незалежності протягом десяти років. Філіппіни все ще перебувають на початку цього процесу, але зараз вони все більше контролюють власну долю.\n\nЧи будуть вони підтримувати зв'язки з США, чи натомість шукатимуть іноземної підтримки, щоб прискорити процес на шляху до свободи? Філіппіни з нетерпінням чекають на процвітаюче майбутнє, але чи є акули, які вже кружляють навколо цієї молодої країни?"
 PHI_american_capital_injection_desc:0 "Америка славиться своїми інвестиціями, тож давайте скористаємося цим ресурсом капіталу і пустимо його в філіппінську економіку. Хто знає, які дива зможуть створити ці капіталістичні підприємці без прямого державного втручання."
 PHI_beach_defense_strategy_desc:0 "Маючи достатньо гармат і солдатів, ми зможемо утримати периметр Філіппін, і тому ми повинні розробити нашу оборонну стратегію з урахуванням цієї мети. Таким чином ми можемо гарантувати, що Філіппіни в цілому залишатимуться задіяними в будь-якій потенційній довгостроковій військовій кампанії."
 PHI_conquest_of_japan:0 "Завоювання Японії"
 PHI_department_of_foreign_affairs:0 "Департамент закордонних справ"
 PHI_japanese_advisors:0 "Японські радники"
 PHI_leverage_the_peso_desc:0 "Наша валюта належить нам, і ми повинні працювати над тим, щоб відрізнити її від долара США. Це дозволить нам проводити коригувальну фінансову політику, яка найкраще відповідатиме подальшому розвитку нашої економіки."
 PHI_manila_tag_communism_ADJ:0 "Філіппінськ"
 PHI_manila_tag_fascism_DEF:0 "Філіппінська держава"
 PHI_manila_tag_war_democratic_ADJ:0 "$PHI_manila_tag_democratic_ADJ$"
 PHI_maphilindo_tag_communism_ADJ:0 "Малайськ"
 PHI_maritime_communism_desc:0 "У той час як багато комуністичних держав зосереджуються на мобілізації своїх людей для масових переміщень військових на суші, ми натомість повинні використати масову мобілізацію нашої морської могутності і випустити це морське воїнство в океани світу, об'єднавши всіх під прапором Морського комуністичного руху."
 PHI_peace_with_philippines:0 "Погодитися на білий мир з [PHI.GetNameDef]"
 PHI_polynesia_tag_fascism_ADJ:0 "Австронезійськ"
 PHI_pro_hacendados:0 "Підтримка асьєндадо"
 PHI_pro_hacendados_desc:0 "Багата земельна еліта, успадкована від іспанської колоніальної епохи, залишається значною силою впливу та багатства на Філіппінах. Ми повинні загравати з цими старими родинами і в обмін на збереження статус-кво отримати їхнє заступництво."
 PHI_pt_boat_development:0 "Розробка торпедних катерів"
 PHI_second_philippine_republic_desc:0 "Хоча вона ще не досягнута, наша мета — незалежність — стає дедалі ближчою. Наступним кроком є створення нової республіки для офіційного проголошення нашого відокремлення, а звідти — початок роботи над атрибутами нашого нового уряду, і, звісно ж, новим прапором."
 PHI_secure_japanese_guarantees:0 "Заручитися гарантіями Японії"
 PHI_thats_not_an_island:0 "Це не острів!"
 PHI_thats_not_an_island_desc:0 "Хоча наш архіпелаг дає нам велику гнучкість, це пов'язано з деякими обмеженнями. Наприклад, що, якщо ми захочемо провести операції далеко від наших рідних островів? Ну, тоді нам просто доведеться взяти один із тих островів із собою і таким чином отримати оперативну можливість завдати удару в будь-якій точці світу, де це необхідно."
 PHI_united_states_army_forces_in_the_far_east_desc:0 "Філіппінський департамент довго був американським командуванням на Філіппінах, однак зі зростанням напруженості настав час розширити його до більшого формування армії Сполучених Штатів. Це вимагатиме створення нових командних структур і переведення значної кількості американського персоналу зі США."
 PHI_usa_focus_done_T1_tt:0 "Завершено принаймні один із фокусів: §YПрив'язати песо до долара§!, §YПро-хасендадос§! або §YЗакон про громадянство§!."
