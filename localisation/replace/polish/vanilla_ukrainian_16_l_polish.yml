 SEA_china_democratic.15.t:0 "[FROM.GetNameDefCap] відхиляє наш запит"
 SEA_china_warlords.6.a:0 "Вони пошкодують про це"
 SEA_imperial_influence_demand_event_option_10:0 "Відкладений вибір — це теж вибір"
 SEA_imperial_influence_events.161.desc:0 "Армія висунула свої вимоги. Схоже, вони прагнуть розширити можливості виробництва артилерії та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми виготовляли більше артилерії для задоволення їхніх потреб у розширенні. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.300.t:0 "Фракція Дзайбацу втрачає вплив"
 SEA_imperial_influence_failure_event_option_4:0 "Ганебне видовище"
 SEA_imperial_influence_failure_event_option_9:0 "Впади сім разів, піднімися вісім"
 SEA_japan_foreign_policy.105.a:0 "Жахливі новини..."
