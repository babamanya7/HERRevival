 PER_abolish_feudalism_desc:0 "Протягом багатьох років [ROOT.GetNonIdeologyName] функціонувала в рамках феодальної системи, де землевласники володіли майном, на якому працювали численні селяни в сільських регіонах. Це застаріла система, і наш обов'язок як уряду — викупити цю землю у власників та продати її селянам за набагато нижчою ціною. Це ефективно принесе свободу значній частині нашого населення."
 PER_absorb_byzantines_tt:0 "Відмикає рішення §YПоглинути Візантію§!, які дозволяють нам інтегрувати завойовані території в нашу націю."
 PER_assassinate_reza_shah:0 "Вбивство Рези-шаха"
 PER_civil_war_imminent:0 "Громадянська війна неминуча!"
 PER_communist_events.13.t:0 "[FROM.GetNameDefCap] відхиляє передачу технологій"
 PER_construct_air_bases_desc:0 "Нашим літакам потрібне місце для базування, якщо вони мають ефективно виконувати свої місії. Тому вкрай важливо, щоб ми витратили час на розробку нових авіабаз по всьому [PER.GetNonIdeologyName] та розширення потенціалу наших повітряних сил."
 PER_establish_motor_arms_desc:0 "Щоб підтримати нашу піхоту, ми повинні розглянути можливість виробництва низки різних транспортних засобів, щоб забезпечити, що їхня здатність долати поле битви є сучасною та максимально гладкою. Створивши промисловість для такого роду обладнання, ми готуємося до майбутньої модернізації наших збройних сил."
 PER_foreign_schools:0 "Взяти під контроль іноземні школи"
 PER_form_sumka:0 "Сформувати СУМКА"
