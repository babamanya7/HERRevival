 FRA_anti_tank_equipment_1_short:0 "Canon de 25 mm"
 FRA_battleship_1_desc:0 "Лінкори типу Courbet були першими супер-дредноутами, побудованими для ВМС Франції до та під час Першої світової війни. Уповноважені у військово-морських програмах 1910 та 1911 років, вони мали обмежену службу під час Першої світової війни, але були активними під час Другої світової війни. Хоча вони мали товщу броню та міцніші гармати, ніж попередні лінкори класу «Данте», вони все одно поступалися сучасним лінкорам USN та RN. Вони водотоннажністю трохи більше 22 000 тонн, і їх єдиними модернізаціями до Другої світової війни були поліпшене зенітне озброєння та вдосконалені котли."
 FRA_colonial_military_factories_tt:0 "$production_effort_tt$ у французьких колоніях"
 FRA_constitutional_convention_desc:0 "Фундаментальну зміну в природі нашої республіки неможливо зробити за одну ніч, і це неможливо зробити без переговорів про нову конституцію."
 FRA_cv_nav_bomber_equipment_3:0 "Dewoitine D.750P"
 FRA_form_the_provisional_government_of_the_republic_desc:0 "Після звільнення Парижа ми більше не є урядом у вигнанні. Настав час розпочати важку роботу з відбудови нашої країни."
 FRA_indochina_intervention.1.desc:0 "Штурмові колони союзників дійшли до основних міст Індокитаю, змусивши місцевого губернатора просити про припинення вогню. Оскільки оборонні розрізнені і погано організовані, будь-який подальший опір визнано марним. Залишилися захисники склали зброю."
 FRA_initiate_government_reform:0 "Реформа уряду"
 FRA_legitimist_faction:0 "Альянс легітимістів"
 FRA_medium_tank_equipment_3:0 "SARL 42"
 FRA_mio_trait_l_35:0 "L/35"
 FRA_non_intervention:0 "Держава віддана невтручанню"
 FRA_promote_entrepeneurship_desc:0 "Серцем динамічного ринку завжди була людина, яка, побачивши можливість, швидко рухається, щоб її використати. Останніми роками цей дух був придушений непотрібними правилами. Ми мусимо відкотити їх назад."
 FRA_west_africa_intervention.1.a:0 "Ще одна частина світу тепер може зітхнути вільно."
 FRA_west_africa_intervention.1.desc:0 "Швидко переміщаючись відкритою територією, війська союзників змогли підібратися з флангу до оборонних французів і змусили їх капітулювати. Залишившись без резервів, здатних зупинити союзників, місцевий губернатор офіційно здав територію."
