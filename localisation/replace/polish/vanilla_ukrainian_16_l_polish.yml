 modernize_the_succession_laws_desc:0 "Нинішній син кайзера, майбутній Вільгельм IV, має лише двох спадкоємців. Ми повинні забезпечити лінію спадкоємства, і тому закони про престолонаслідування мають бути модернізовані, щоби дозволити принцесі Фелісітас правити, коли прийде час."
