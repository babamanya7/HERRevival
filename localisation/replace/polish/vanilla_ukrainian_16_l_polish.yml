 CZE_BEL_autonomy_eu_member_ADJ:0 "Чехословацьк"
 CZE_GER_fascism_autonomy_puppet:0 "Райхспротекторат Богемія та Моравія"
 CZE_a_divided_nation_fake_category_desc:0 "У різних рухах всередині країни зростає невдоволення урядом, яке більше не можна ігнорувати чи відкидати. Вирішення цих проблем послабить сили, що намагаються розірвати країну на частини. Принаймні в найближчому майбутньому."
 CZE_a_divided_nation_slovakia_states:0 "Додаткові економічні інвестиції у регіон §Y[FROM.getname]§!"
 CZE_a_modern_navy_desc:0 "Тепер, коли ми досягли успіхів у наших військово-морських технологіях, ми нарешті можемо сказати, що маємо сучасний і боєздатний флот."
 CZE_a_strong_poland_desc:0 "Володіючи однією з найсильніших армій Східної Європи, [POL.GetNameDef] має потенціал стати цінним союзником."
 CZE_access_to_the_sea:0 "Доступ до моря"
 CZE_access_to_the_sea_desc:0 "Ми більше не є державою без виходу до моря! Отримавши у своє розпорядження берегову лінію, ми можемо піти далі і почати планувати створення власних військово-морських сил."
