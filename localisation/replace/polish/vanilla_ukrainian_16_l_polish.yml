 reintegrate_austro_hungarian_empire_desc:0 "Ми відвоювали достатньо територій, щоб реінтегрувати старі австро-угорські землі в нашу імперію. Тож зробімо це негайно."
 reintigrate_hispania:0 "Реінтегрувати Іспанію"
 remove_theorist:0 "§RУсуває§! з посади §Yтеоретика§!:\n"
 resistance_support_distribute_weapons:0 "Поширити зброю"
 resistance_support_distribute_weapons_outcome:0 "Команда поширила в кількох осередках опору зброю і навчила повстанців ним користуватися."
 restore_roman_rule_to_gaul:0 "Відновити римське панування в Галлії"
