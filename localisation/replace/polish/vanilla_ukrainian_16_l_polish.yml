 GER_antischluss_progress_minimal:0 "зробили §Rнайменший§! поступ у цьому"
 GER_armored_car_equipment_2:0 "Sonderkraftfahrzeug 234 «Puma»"
 GER_atlantikwall:0 "Атлантичний вал"
 GER_ballistic_missile_equipment_1_desc:0 "Також відома як ракета «V2». Безпілотна балістична ракета для стратегічного бомбардування."
 GER_befriend_japan_desc:0 "$GER_japan_friend_desc$"
 GER_combined_arms_desc:0 "Стрімкий розвиток технологій змінив спосіб ведення війни, і нам слід цим скористатися. Прийнявши принцип спільнодії родів військ і розробивши комплексну стратегію синхронізації піхоти, бронетехніки та повітряної підтримки, ми створимо грізну бойову силу та забезпечимо її перевагу."
 GER_controls_the_alps_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]а маріонетка або член альянсу повністю контролює всі регіони §YАльп§! від §Y[845.GetName]§! до §Y[976.GetName]§!."
 GER_create_one_motorized_units_tt:0 "Буде створено §Y1 німецьку§! частину §Yмоторизованої піхоти§!."
 GER_crossing_the_atlantic_2_factories_tt:0 "Прибирає по §Y2 військові заводи§! з материкової області за кожну берегову область, у які з'являться ці верфі.\n"
 GER_defense_of_the_reich_neutral:0 "Імперії"
 GER_demand_slovenia_desc:0 "За умовами Сен-Жерменського мирного договору багато історичних земель Австрії перейшли до держав-спадкоємців. Тепер, коли Австрія знову стала частиною німецької нації, настав час відновити справедливість. Ми мусимо повернути собі історичні провінції Крайна та Штірія, нині відомі як Словенія."
 GER_dp_ship_medium_1:0 "15cm/48 Tbts KC/36T DP"
 GER_establish_the_reichswerke_desc:0 "$GER_hermann_goring_werke_desc$"
 GER_expanding_the_luftwaffe:0 "Розширення Luftwaffe"
 GER_extra_funds_to_waffenamt_desc:0 "Waffenamt, або Агентство озброєння, контролює проєктування та розробку військової техніки. Воно співпрацює з виробниками зброї та науково-дослідними інститутами, і, надавши йому додаткові кошти, ми могли би прискорити темпи прогресу."
 GER_finnish_membership_desc:0 "Фінляндія знаходиться далеко від центру Європи, і фіни мусять розуміти: їм не вистояти наодинці з [GER.GetFinnishMembershipDesc]. Ми запропонуємо їм членство в союзі та можливість разом протистояти з боку [GER.GetDanubianMembershipDesc]."
 GER_heavy_tank_destroyer_equipment_2:0 "Panzerjäger Tiger (P)"
 GER_heavy_tank_destroyer_equipment_2_desc:0 "Elefant (з нім. — «слон») був важким винищувачем танків на базі шасі скасованого проєкту Porsche Tiger та оснащений 88-мм гарматою Panzerabwehrkanone 43/2."
 GER_hegemony_over_europe_desc:0 "Стара, імперіалістична Європа руйнується. Ми створимо новий соціалістичний порядок, де робітники дивитимуться на нас як на провідника у боротьбі проти буржуазного гніту. Перемога пролетаріату встановить нашу гегемонію на континенті."
 GER_industrial_expansion_desc:0 "Сильна промисловість, здатна конкурувати на міжнародному рівні та впроваджувати нові технології, матиме вирішальне значення для нашого подальшого зростання. [ROOT.GetNameDefCap] стане синонімом якості."
 GER_industrial_relocation_descision_tt:0 "5 із вибраних ресурсів буде надано державі §Y[ROOT.GetNameWithFlag]§!, натомість ми отримаємо §Y1§! Цивільний Завод. Його буде демонтовано у них і передано §Yнам§!"
 GER_inner_circle_title_text:0 "ВНУТРІШНЄ КОЛО"
 GER_integrate_czech_manufacturers_no_aat_tt:0 "§GДоступно§! як §Yконструкторські бюро§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§! та §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
 GER_integrate_czechoslovakia:0 "Інтегрувати Чехословаччину"
 GER_integrate_war_economies:0 "Інтеграція військової економіки"
 GER_integration_of_puppet_economies_decisions_tt:0 "Ці рішення дозволяють нам розвивати або експлуатувати економіки наших маріонеток."
 GER_kreigsmarine_revolt_mission:0 "Крігсмаріне повстають"
 GER_liberate_oppressed_people_cossacks_tt:0 "Відкриває можливість відновлення південноросійських §Yкозацьких республік§!"
 GER_mackensen_went_into_retirement:0 "§YАвгуст фон Макензен§! пішов у відставку"
 GER_mio_trait_aerodynamic_research_insitute:0 "Інтегрований відділ аеродинамічного науково-дослідного інституту"
 GER_mio_trait_krupp_guns:0 "Гармати Круппа"
 GER_mio_trait_policiary_equipment:0 "Поліцейське спорядження"
 GER_mio_trait_u_boat_yards:0 "Верфі для підводних човнів"
 GER_mio_trait_upgrade_panzerschiffs:0 "Модернізація панцершифів"
 GER_mitteleuropa_cooperation_sphere_desc:0 "Центральна Європа має багато талановитих людей. Але через бажання урядів зберігати знання при собі, вони не можуть ефективно співпрацювати. Ми повинні заохочувати тіснішу наукову кооперацію з нашими союзниками."
 GER_motorized_equipment_0_short:0 "ALZ 13"
 GER_occupy_kosovo_decision:0 "Окупувати Косово"
 GER_operational_planning_category_desc:0 "Ми повинні ретельно планувати наші наступальні операції, щоб знайти, де зосередити наші сили. Головні точки удару звуться Шверпунктами. Це дозволить нам скористатися будь-якими слабкими місцями в обороні наших ворогів і пробити їх лінії, заставши їх зненацька."
 GER_prepare_for_the_next_blockade_ww:0 "Приготуватися до наступної блокади"
 GER_prioritize_economic_growth_desc:0 "Роки недбалої фіскальної політики майже зруйнували нашу економіку. Ми мусимо будувати трактори замість танків, роздавати лопати замість гвинтівок і надавати пріоритет економічному зростанню, а не розвитку військової промисловості!"
 GER_proletarian_dictatorship:0 "Диктатура пролетаріату"
 GER_promised_erich_raeder_a_great_navy_tt:0 "Еріх Редер і більшість Крігсмаріне приєднаються до нас під час перевороту. Але якщо ми не виконаємо фокуси §Y$GER_rebuild_the_high_seas_fleet_ww$§!, або §Y$GER_high_seas_fleet$§! та §Y$GER_re_establish_the_seekriegsleitung$§! за два роки, він може §RПідняти заколот проти нашого режиму§!"
 GER_raid_category_fluff_text_paratrooper_raids:0 "§LПарашутисти (Фальширм'єгери)§!"
