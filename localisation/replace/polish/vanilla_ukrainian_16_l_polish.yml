 siberian_tiger_tt:0 "Сформовано Сибір"
 sinkiang_ma_communism_DEF:0 "Сіньцзянська кліка Ма"
 sinkiang_ma_neutrality_ADJ:0 "Сіньцзянськ"
 siphon_equipment_stockpiles_for_communist_civil_war_desc:0 "$siphon_equipment_stockpiles_for_fascist_civil_war_desc$"
 socialism_desc:0 "Прагнучи досягти рівності та встановлення соціалістичної держави шляхом реформ, демократичний соціалізм має на меті скасувати або пом'якшити ефекти капіталізму з державним мандатом."
 south_american_events.14.c:0 "Карлос Ібаньєс дель Кампо."
 south_american_events.18.desc:0 "За нашої згоди держава [ECU.GetNameDef] вирішила віддати Пастасу в обмін на білий мир. Ми дещо мирно анексували область і розпочали зусилля з інтеграції. Це знаменує новий початок для області Пастаса!"
 south_american_events.18.t:0 "[ECU.GetNameDefCap] віддає Пастасу в обмін на мир"
 south_american_events.2.c:0 "Ми мусимо бути здатні спинити танки."
 south_american_events.21.t:0 "[ECU.GetNameDefCap] приймає нашу пропозицію миру"
 south_american_events.32.b:0 "Ми не можемо втручатися."
 south_american_events.61.a:0 "Вимагати, щоб він покинув наш порт"
 south_american_news.3.a:0 "Цікаво."
 south_american_news.52.desc:0 "У зв'язку з тим, що світ знову занурився у глобальний конфлікт, місто Ріо-де-Жанейро вирішило призупинити знамениті щорічні карнавальні святкування. Оскільки мир стає далеким спогадом, незрозуміло, коли свята повернуться. Однак багатьох більше турбує те, чи дійде війна і до самої [BRA.GetNonIdeologyName]."
 south_american_news.8.d:0 "Президент Парагваю Еусебіо Аяла офіційно подав у відставку на вимогу військових, які окупували столицю Парагваю Асунсьйон, і влада перейшла до революційних фебреристів на чолі з генералом Рафаелем Франко. Після багаторічної війни з Болівією парагвайський народ, схоже, втомився від слабкої влади; багато хто вийшов на вулиці, щоби відсвяткувати своє нове керівництво."
 sov_ger_treaty:0 "Радянсько-німецький договір"
 soviet.25.c:0 "Зізнання Радека вказує на декількох членів партії."
 soviet.4.t:0 "[FROM.GetNameDefCap] здає Бессарабію"
 soviet.70.desc:0 "Незважаючи на звільнення нашої батьківщини від [GER.GetAdjective]ої окупації, нам усе ще доводиться боротися з державою [SOV.GetName]. Зараз вони відмовляються визнати легітимність нашого уряду, якщо про-[SOV.GetAdjective]им політикам не буде дозволено відігравати більш помітну роль в управлінні країною. Насправді, це погано завуальована погроза з [SOV.GetAdjective]ого боку; вони очікують, що ми приєднаємося до них. Тим часом, наші західні партнери, схоже, не бажають надавати нам жодної підтримки у протистоянні вимогам лідера [SOV.GetLeader]."
 soviet.73.desc:0 "Нещодавня напруга навколо зовнішньополітичного курсу держави [POL.GetName] зменшилася, оскільки держава [SOV.GetNameDef] відійшла від своєї попередньої агресивної риторики. Хоча ймовірність нового вторгнення зменшилася, ми мусимо залишатися пильними щодо нашого східного сусіда та його пішаків."
 soviet.9.a:0 "[FROM.GetAdjectiveCap]ий народ необхідно визволити."
 sp_air_air_equipment_tech_bonus:0 "Спеціальні проєкти: бонус до літаків"
 sp_air_bouncing_bomb_aircraft_modifications_reward:0 "Модифікації літака"
 sp_air_earthshaker_bomb_preference_naval_targetting:0 "Точність — це головне"
 sp_air_jet_engine_bomber_2:0 "Осьовий реактивний двигун: ставка на бомбардувальники"
 sp_commercial_nuclear_reactor_concerns_reward:0 "Занепокоєння ядерною безпекою"
 sp_helicopter_transport_pods_tech_desc:0 "Вертольоти, оснащені транспортними контейнерами або буксируючими під ними вантажами на тросі, можуть швидко переміщати матеріали та обладнання, не зважаючи на рельєф місцевості. Застрягання в болоті залишилося в минулому!"
 sp_land_generic_reward_option_resource_scarcity_desc:0 "Команда [Character.GetName] стикається з нестачею критично важливих матеріалів для розробки проєкту «[SpecialProject.GetName]», що змушує [Character.GetHerHim] шукати альтернативні джерела постачання та розробляти нові методи виробництва для задоволення потреб."
 sp_land_generic_reward_option_scientist_xp:0 "Знання — це сила!"
 sp_land_reward_land_cruiser_communication_desc:0 "Величезні розміри техніки проєкту «[SpecialProject.GetName]» вимагають складну систему внутрішнього зв'язку для координації роботи екіпажу. Поточна система виявляється недостатньою: накази затримуються або губляться. Команда пропонує переробити внутрішню схему, щоби поліпшити потік комунікації, або встановити досконалішу, але ще неперевірену систему."
 sp_land_reward_land_cruiser_overheating:0 "Перегрів під час випробувань"
 sp_land_reward_land_cruiser_turret:0 "Складний баштовий механізм"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc:0 "Один із молодших інженерів відкрив новий метод армування, який можна застосувати до стандартних фортифікацій. Задокументувавши його зараз, наші науковці та інженери можуть отримати перевагу в майбутніх дослідженнях."
 sp_naval_cruiser_submarine_preference_b:0 "Озброєння"
 sp_naval_generic_failure_torpedo_accident:0 "Вибух торпеди"
 sp_naval_generic_reward_navy_xp_2:0 "Хвиля ідей"
 sp_naval_ice_carrier_speed_factor_tt:0 " $sp_naval_ice_carrier_speed_factor$: $RIGHT|+=%1$"
 sp_naval_modern_carrier_free_design:0 "Сучасний авіаносець"
 sp_naval_support_ships_preference_a_b:0 "Wider Coverage"
 sp_nuclear_missile_submarine_eq_bonus_strength:0 "Nuclear Missile Submarine - підвищена міцність"
 sp_nuclear_reactor_desc:0 "Експерименти довели, що при розщепленні атомів вивільняється величезна кількість енергії, яку можна використати для вироблення електроенергії. Або, можливо, як паливо для бомб..."
 sp_refined_pykrete:0 "Удосконалений пайкерит"
 sp_rockets_generic_avionics_advancements_reward_desc:0 "Під час нашої роботи ми зробили багато відкриттів у загальній галузі авіоніки та аеродинаміки, які можуть принести користь нашому літакобудуванню."
 sp_surface_air_missile_warhead_detonation_bonus:0 "Ракета «земля-повітря»: вдосконалена детонація боєголовки"
 spain.1.a:0 "Націоналістів!"
 special_forces_marines_desc:0 "Морська піхота служить там, де інші не наважуються. Від рідного берега до чужого клімату, ці фахівці досягають успіху в проникненні та десантних діях. Широке охоплення та гнучка філософія мусять стати основою нашої військової доктрини."
 special_forces_min_tt:0 " $MODIFIER_SPECIAL_FORCES_MIN$: $RIGHT|+=0$"
 specialization_naval_short:0 "Флот"
 ss_recruitment_event.10.desc:0 "Сьогодні на зустрічі з лідером [GER.GetLeader] ряд високопоставлених офіцерів Вермахту у верховній команді вермахту висловили занепокоєння з приводу того, що вони називають «політичним фаворитизмом» від імені SS. Зокрема, вони з глибоким занепокоєнням спостерігають за розвитком паралельних збройних сил у Waffen-SS.\n\nРозмірно оснащені дивізії SS, як вони стверджують, лише забирають вкрай необхідні ресурси у регулярних військових.\n\nНарешті, незалежний набір може призвести до окремих командних структур, що призведе до розподілу зусиль, коли для досягнення остаточної перемоги потрібно об'єднати всі сили."
 ss_recruitment_event.23.b:0 "Цього разу він зайшов надто далеко."
 stability.22.e:0 "Запропонуймо збільшити пайки для робітників."
 stability.23.d:0 "Публічно оголосімо, що всякого, хто допомагає бунтівникам, звинуватять у зраді."
 stability.23.desc.c:0 "Оскільки уряд явно не бажає або не може вирішити їхні проблеми, бунтівники вирішили взяти владу в свої руки. Були оголошені вибори до «робітничих і солдатських рад» із чітко вираженою метою захопити владу в країні та укласти мир із ворогом.\n\nЯкщо не вжити термінових заходів, ці ради цілком можуть замінити наш уряд у деяких регіонах країни і зробити нас нездатними продовжувати війну."
 stalingrad:0 "Stalingrad"
 state_majority_country_rules:0 "§H[This.GetStateMajorityCountryName]§! має §Hбільшість в області§! й отримує [?This.state_political_support_value|+0] §Hбалів політичної підтримки§!, доки інша країна не досягне більшою §Hмісцевою підтримкою§!.\n\n"
 strat_bomber_equipment_3_desc:0 "Щоби знизити втрати від вогню знарядь ППО та перехоплювачів, потрібно підвищити максимальну висоту польоту. Нова модель буде ще більшою і зможе нести збільшене бомбове навантаження та великий запас палива, щоб підвищити дальність польоту."
 strat_dest_bonus:0 "Бонус до доктрини стратегічного знищення"
 strongest_claimant_GER:0 "Найсильніші претензії у §YНімеччині§!"
 submarine_3_desc:0 "Досі немає ясності щодо ролі підводних човнів у складі флоту, за винятком атак на конвої. Новий проєкт намагається знайти баланс між швидкістю, дальністю та озброєнням."
 success_modifier_INS_defense_modifier_improvement:0 "- Зменшити ворожі §YДивізії§!"
 success_modifier_INS_infrastructure_modifier_militia_counterplay:0 "§HЗбільшити інфраструктуру в регіоні§!"
 success_modifier_intel_improvement:0 "- Збільште §Hвідомості про ціль§!"
 supply_factor_tt:0 " $MODIFIER_SUPPLY_FACTOR$: $RIGHT|+=%0$"
 support_communism_desc:0 "В даний час політичне керівництво дотримується кількох невідповідних поглядів. За допомогою невеликих маніпуляцій, легкої пропаганди і, можливо, скандалу-другого можна змусити піти зі сцени нинішній уряд і привести до влади партію, яка більш схиляється до комунізму."
 support_fascism:0 "Підтримати фашизм"
 support_weapons2_desc:0 "Розробка моделей, що поєднують властивості легкої та важкої автоматичної зброї, дозволяє гнучкіше екіпірувати нашу піхоту."
 tactic_sf_ambush:0 "Тактика міської засідки"
 tank_designer_medium_tank_chassis:0 "Середній танк"
 targeted_sabotage_destroy_bridge:0 "Підірвати міст"
 targeted_sabotage_destroy_mining_equipment_desc:0 "Місцеві групи опору звернули нашу увагу на те, що важке обладнання, яке використовується в гірській справі, є вразливим. Наші агенти підірвуть кілька його критично важливих елементів, щоби зупинити гірські роботи."
 tech_logistics_company4_desc:0 "Розробка стандартної номенклатури для ресурсів зменшить плутанину і зробить планування більш ефективним."
 tech_logistics_company_desc:0 "Якщо в нас є спеціальний офіцер з питань тилу, мережа постачання буде функціонувати ефективніше."
 tech_mountaineers:0 "Гірська піхота I"
 tech_recon_desc:0 "Відправивши невеликий загін бійців на розвідку, перш ніж висунути основну групу військ, ми отримаємо інформацію про кількість та розташування ворожих частин."
 technology:0 "Технології"
 tfv_australia.32.b:0 "Ми можемо краще захистити свої інтереси самостійно."
 tfv_australia.33.t:0 "[From.GetNameDefCap] погоджується на тихоокеанське співробітництво"
 tfv_australia.51.t:0 "Брати революції"
 tfv_canada.11.a:0 "Ми покажемо цьому континенту, що справді означає революція!"
 tfv_canada.30.c:0 "Віддати владу націоналістам."
 tfv_canada.61.d:0 "Після того, як держава [From.GetNameDef] поступилася Лабрадором і Ньюфаундлендом, [Root.GetNameDef] нарешті стала єдиною. Воістину, від моря до моря; кожен справжній [Root.GetAdjective]ий громадянин тепер живе в межах наших кордонів, де йому й належить.\nНашим наступним кроком має бути забезпечення безпеки та захисту [Root.GetAdjective]ої держави!"
 tfv_raj.2.t:0 "Індійський князь дарує винищувачі"
 tfv_raj.30.desc:0 "Субгас Чандра Бос, лідер Усеіндійського прогресивного блоку, приїхав до Москви, щоби попросити нашу допомогу в боротьбі за свободу Індії. Посилаючися на традиційні конфлікти між Росією та Британією в Індії, що сягають часів «великої гри», він уважає, що ми є природним вибором для того, щоби допомогти індійцям досягти незалежності від Британії."
 tfv_raj.40.desc:0 "Субгас Чандра Бос, лідер Усеіндійського прогресивного блоку, прибув до Берліна, щоби попросити нашу допомогу в боротьбі за свободу Індії. У листі до лідера [GER.GetLeader] він висловив своє захоплення та припустив, що незалежна Індія буде цінним союзником у наших зусиллях відновити державу [GER.GetNameDef] на її законному місці у світі."
 tfv_raj.41.desc:0 "[GER.GetAdjectiveCap]ий посол сьогодні відвідав Міністерство закордонних справ, щоб обговорити питання незалежності Індії. Під час зустрічі він чітко дав зрозуміти, що [GER.GetLeader] вважає наше подальше панування над Індією абсолютно неприйнятним. Схоже, Бос пообіцяв, що незалежна Індія буде підтримувати [GER.GetAdjective]і інтереси в регіоні.\n\nПосол відмовився чітко сказати, що його уряд готовий зробити, якщо ми відмовимося, але ми мусимо припустити, що він може навіть удатися до війни."
 tfv_raj.42.desc_GER_helps:0 "Після зустрічі з [GER.GetAdjective]им міністром закордонних справ і аргументації своєї позиції, Субгас Чандра Бос зумів переконати [GER.GetAdjective]у владу підтримати нас. Бос також зустрівся з німецьким лідером, [GER.GetLeader], і протягом кількох годин обговорював питання, що становлять спільний інтерес, зокрема, формування загону індійських добровольців із британських військовополонених."
 tfv_raj.44.a:0 "$tfv_raj.34.a$"
 tfv_raj_quit_india_unrest_tt:0 "Очікується, що прибічники руху вимагатимуть зміни."
 tfv_south_africa.100.d:0 "Звільнившися з-під влади колоніальних гнобителів, [WES.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [WES.GetAdjective]ого уряду."
 tfv_south_africa.101.t:0 "Свобода для держави [ALG.GetName]"
 tfv_south_africa.68.t:0 "Свобода для держави [MLW.GetName]"
 tfv_south_africa.94.d:0 "Звільнившися з-під влади колоніальних гнобителів, [GNA.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [GNA.GetAdjective]ого уряду."
