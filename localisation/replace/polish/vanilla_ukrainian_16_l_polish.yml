 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_4_DESC:0 "Оперативна група буде сильно ризикувати при вступі до бою й атакувати групи, рівні їй по силі."
 SHX_heavy_tank_aa_equipment_1_short:0 "PGZ 34 D"
 SHX_heavy_tank_equipment_3:0 "Type 43 Dà"
 SHX_medium_tank_destroyer_equipment_3:0 "PTZ 43"
 SIA_ask_for_the_release_of_american_commodities_desc:0 "Американські запаси, обладнання і товари можуть надати перепочинок, якого потребує наша нація. Завдяки обережній дипломатії ми можемо подати запит на розблокування таких товарів, зменшивши дефіцит і зміцнивши матеріальну базу наших військових зусиль."
 SIA_celebrating_the_constitution:0 "Святкування Конституції"
 SIA_contingency_funds_desc:0 "Процвітання в мирний час має невелику цінність, якщо держава входить у кризу непідготовленою. Створюючи резервні фонди вже зараз, ми гарантуємо, що блокада, неврожай або раптова війна не зупинять одразу роботу державного механізму."
 SIA_directorate_of_aeronautical_engineering_desc:0 "Майбутнє повітряних сил [ROOT.GetNameDef] не забезпечуватиметься лише пілотами. Воно потребує інженерів, інспекторів, майстерень та центрального органу, здатного перетворювати іноземні закупівлі на справні літаки. Управління авіаційної інженерії стане фундаментом цих зусиль."
 SIA_end_factionalism_mission:0 "Утримання коаліції разом"
 SIA_end_military_grift:0 "Кінець військовому розкраданню"
 SIA_farmers_into_the_city:0 "Фермерів до міста"
 SIA_fortress_saigon:0 "Фортеця Сайгон"
 SIA_fuel_oil_act:0 "Акт про мазут"
 SIA_fuel_oil_act_desc:0 "Сучасний транспорт, промисловість і оборона залежать від палива, однак доступ до нього може бути перекритий у разі війни. Акт про паливо поставить під жорсткіший державний нагляд споживання, зберігання та надзвичайний розподіл, щоб дефіцитні запаси не були змарновані."
 SIA_hold_military_parades_desc:0 "Щоб підняти бойовий дух військових, винагородити наших лояльних генералів і нагадати нашим громадянам про міць збройних сил Сіаму, ми проведемо грандіозний парад у Бангкоку. Нехай газетам буде про що писати!"
 SIA_implement_industrialists_reforms_countdown_trigger:0 "Побудувати §Y2 цивільні фабрики§! (Крім фабрик, отриманих від фокусів та торгівлі)"
 SIA_license_modern_airframes_desc:0 "[ROOT.GetNameDefCap] ще не може сама спроектувати кожен потрібний їй літак. Більш практичним курсом є ліцензування іноземних моделей, вивчення їхньої конструкції та адаптація їх до нашого клімату, аеродромів та умов постачання під наглядом Управління."
 SIA_mandate_1_tt:0 "§Y[THIS.GetName]§! буде відома як §Y$SIA_thailand$§!"
 SIA_meet_with_king_prajadhipok_desc:0 "Змова без короля — це лише ще одна військова інтрига. Зустрівшись із королем Прачадіпоком у вигнанні, ми можемо поставити їхню справу під мантію королівської легітимності і заручитися благословенням єдиної людини, чиє повернення може згуртувати вагаючихся і розколоти режим."
 SIA_mobilize_the_defenders_of_siam:0 "Мобілізація захисників Сіаму"
 SIA_nav_bomber_equipment_2:0 "Mitsubishi G4M"
 SIA_order_discipline_and_unity_desc:0 "Хаос фракційної політики та громадянської війни ледь не знищив державу. Відповідь Сонгсурадета проста: порядок в уряді, дисципліна в суспільстві та єдність у меті, щоб королівство могло перетворитися на сильнішу і сучаснішу державу."
 SIA_pacific_war:0 "Війна на Тихому океані"
 SIA_phibuns_premiership_desc:0 "Коли прем'єрство [SIA_phraya_phahon.GetName] добігає кінця, обраний партією наступник Плаєк Пібунсонгкрам готовий перейняти владу. Це значно покращить ставлення до нас військових, але змусить цивільне крило здійнятися з тривогою.\nДля нас є лише один шлях вперед у цю нову епоху; з великою переконаністю!"
 SIA_prajadhipok_audience_with_churchill_tt2:0 "На початку громадянської війни."
 SIA_promote_civilian_wing:0 "Загравати з цивільним крилом"
 SIA_promote_civilian_wing_desc:0 "Кинувши всю вагу уряду на підтримку програми цивільного крила щодо земельної реформи, судів та конституції, ми зможемо завоювати вдячність фракції Пріді. Однак такий фаворитизм не залишиться непоміченим: офіцерський корпус буде дутися, а порушення звичного управління дорого нам коштуватиме, поки все не вляжеться."
