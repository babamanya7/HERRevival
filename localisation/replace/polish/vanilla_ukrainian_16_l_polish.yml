 TUR_the_legacy_of_osmanli_donanmasi_desc:0 "Ставитися до падіння імперії Османа можна по-різному, але її прославлений флот і до цього часу згадують із побожністю. Ми можемо вшанувати цю пам'ять та створити могутній сучасний флот."
