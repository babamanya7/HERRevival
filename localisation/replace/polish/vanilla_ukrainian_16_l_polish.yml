 HABSBURG_bring_back_royal_and_imperial_hussars_desc:0 "Колись у старій Австро-Угорській імперії були свої королівські та імперські гусари. Гусарський дух живе й донині, незважаючи на те, що більшість їх підрозділів давно розформовано. Підрозділи, які заслужили таку повагу як у нашого населення, так і у наших ворогів, принесуть нам велику користь навіть зараз."
