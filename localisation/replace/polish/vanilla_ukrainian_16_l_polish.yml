 AFG_political_events.153.a:0 "Нам може знадобитися більше союзників у регіоні."
 AFG_political_events.30.a:0 "Це новий початок, і ми будемо [ROOT.GetAdjective] Республікою"
 AFG_political_events.87.desc:0 "У ретельно сформульованій відповіді [FROM.GetNameDef] відхилив нашу пропозицію про оборонний пакт. Незважаючи на визнання потенційних стратегічних переваг, вони вирішили надати пріоритет іншим партнерствам та залишаються обережними щодо зобов'язань перед нами в цей час."
 AFG_purchase_tanks:0 "Придбати іноземні танки"
 AFG_radical_students_category:0 "Університетські випускники"
 AFG_reclaim_moghulistan:0 "Повернути Моголістан"
 AFG_reclaim_the_emperors_lost_domain:0 "Повернути втрачені володіння Імператора"
 AFG_reform_4_desc:0 "Зі стабілізацією [ROOT.GetNonIdeologyName], інвестиції та діловий інтерес до неї зросли. Щоб розпочати економіку, ми інвестуємо в модернізацію сільського господарства та наших обмежених галузей промисловості."
 AFG_request_japanese_support_tt:0 "Якщо §Y[JAP.GetNonIdeologyName]§! прийме нашу пропозицію, вони забезпечать нас зброєю та надішлють добровольців для допомоги нам, коли почнеться громадянська війна."
