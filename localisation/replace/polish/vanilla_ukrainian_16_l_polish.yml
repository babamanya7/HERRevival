 COG_form_the_gecamines_desc:0 "Наступним кроком є націоналізація Géomines шляхом об'єднання її з нашою новоствореною державною компанією La Générale des Carrières et des Mines. Це дозволить нарешті забрати ресурси нашої країни під наш контроль."
