 BUL_carry_the_revolution_abroad_alternative_invitation_tt:0 "Якщо [ROOT.GetFlag]§Y[ROOT.GetName]§! є лідером альянсу, незалежні комуністичні балканські країни отримають подію по запрошенню їх у болгарський альянс."
 BUL_darzhavna_aeroplanna_rabotilnitsa_desc:0 "Ми не мусимо покладатися на іноземних конструкторів, щоби забезпечити наші ВПС необхідними літаками. Ми проведемо велике розширення та модернізацію потужностей нашого Державного авіаційного цеху в Божурищі."
