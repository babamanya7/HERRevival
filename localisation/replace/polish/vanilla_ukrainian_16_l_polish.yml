 FIN_acquire_andros_dockyards:0 "Придбати верфі Andros"
 FIN_aid_for_entrepreneurs_desc:0 "Хоча нам потрібно позбутися найгірших елементів капіталізму, наша економіка може отримати значну користь від збільшення підприємницької діяльності. Встановлюючи інвестиційні гранти та позики для важливих галузей, ми можемо стимулювати таку діяльність."
 FIN_align_the_trade_unions_desc:0 "Підтримка профспілок може виявитися дуже необхідною для нашого уряду. Ми повинні піти на поступки, щоб вони залишилися на нашому боці."
