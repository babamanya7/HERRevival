 AFG_expand_academy_desc:0 "З розширенням більш професійної армії зростає потреба у добре навчених офіцерах. Розвиток національної військової академії був би розумним кроком для забезпечення армії керівництвом та досвідом, які їй потрібні для захисту наших кордонів."
 AFG_expand_border_guards_desc:0 "Ми повинні навчити прикордонну поліцію основам війни, щоб їх можна було залучати до більшої відповідальності в часи кризи та зменшити навантаження на традиційні збройні сили. Королівська гвардія є елітою наших збройних сил і має відповідну підготовку та досвід. Однак, у міру того, як наші сусіди занурюються у конфлікт, виникає занепокоєння щодо їхньої обмеженої чисельності."
 AFG_expand_education_facilities:0 "Розширити державну освіту"
 AFG_expand_state_education:0 "Розширити державну освіту"
 AFG_expansion_claim_in_progress:0 "Переговори в процесі"
 AFG_fascism:0 "Нова афганська імперія"
 AFG_hone_the_shamshir_desc:0 "Шамшір, символ сили та непокори, має бути заточений для майбутніх битв. Модернізуючи наші сили та вдосконалюючи наші стратегії, ми забезпечуємо готовність [ROOT.GetNameDef] завдати рішучого удару, коли цього вимагає момент."
