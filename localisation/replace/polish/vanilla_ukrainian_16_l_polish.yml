 KHM_raise_additional_dungan_regiments_desc:0 "The army is still composed to a large extent by Hui people, swearing absolute loyalty to their commanders. Though not ideal,  we must make use of this, as they will prove very useful in the coming years."
 KHM_take_control_of_zakat_and_waqf_desc:0 "In order to fund our new rule, we may need to bend some rules and take control over the Khotan's zakat and waqf charities, redirecting the wealth of local shrines to textbooks, policing, soldiers and teachers."
