 SOV_approach_tukhachevsky_desc:0 "Михайло Тухачевський, без сумніву, — один із найвидатніших військових мислителів. Хоча його теорія швидкохідних загальновійськових з'єднань, що наносять удари глибоко в тилу ворога, не позбавлена критики, він все ще користується підтримкою деяких дуже здібних генералів. Якщо нам вдасться переконати його підтримати нашу справу, він стане неоціненним надбанням."
