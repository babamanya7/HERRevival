 tsr_manchukuo.10.t:0 "[SOV.GetLeader] передає нашу територію"
 tsr_manchukuo.11.desc:0 "Після страти Ліншена, губернатора провінції Сін'ань і панмонгольського політика, руками Квантунської армії, країною прокотилася хвиля заворушень. Армія Сін'ань, а також монгольські та бурятські генерали, такі як $MAN_urzhin_garmaev$ і $MAN_jonjurjab$, погрожують піти у відставку, якщо це питання не буде вирішено, але водночас спроба залагодити ситуацію може призвести до гніву Японії."
 tsr_manchukuo.13.desc:0 "З огляду на стрімкий промисловий розвиток Маньчжурії, [MAN.GetLeader] вже деякий час розглядає $JAP_naoki_hoshino$ як можливого члена кабінету міністрів. Тому він попросив перевести його до [MAN.GetNameDef], щоб він очолив Раду із загальних справ."
 tsr_manchukuo.2.a:0 "Ну, чому б і ні?"
 tsr_manchukuo.6.desc:0 "Після перемоги у війні проти японців місцеве відділення КПК у Маньчжурії запропонувало нам об'єднатися в боротьбі за панування над Китаєм. Чи це лише спроба захопити владу, ще належить з'ясувати, але це може бути золотою можливістю."
 tsr_manchukuo.8.desc:0 "Не в захваті від нашої позиції, [FROM.GetLeader] відповів, що наша щедра пропозиція була лише черговою спробою підкорити решту, і що вони не братимуть участі в цьому фарсі. Тому вони не залишили нам іншого вибору, окрім як вторгнутися і забрати те, що належить нам по праву."
 tsr_sichuan_border_war.1.b:0 "Це недобре"
 type_xxi_class:0 "Тип XXI"
 udc_tnk_tt:0 "Вартість дизайну танков"
 uk_embargo_focus_desc:0 "Найкращий спосіб перемогти диктаторів — червоних чи коричневих — це просто позбавити їх ресурсів, необхідних для ведення війни. Проблема полягає лише в тому, щоб обдурити банкірів і корпорації, які ведуть з ними бізнес..."
