 JAP_the_south_pacific_soviet_desc:0 "Тепер, коли союз засновано, ми повинні створити нові Радянські Республіки та залучити їх до нашої спільноти. Ми повинні створити Південно-Тихоокеанську Раду, щоб виправдати нашу окупацію регіону."
