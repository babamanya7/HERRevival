 HUN_heavy_tank_destroyer_equipment_2_short:0 "Tas Rohamlöveg"
 HUN_invite_foreign_investors_desc:0 "Угорщина знаходиться в самому серці Східної Європи. Вигідне географічне положення може дозволити нам залучити іноземних інвесторів для розвитку промисловості та інфраструктури."
