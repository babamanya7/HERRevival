 INDUSTRIAL_ORG_DETAIL_WINDOW_HISTORY_TAB:0 "Історія"
 INDUSTRIAL_ORG_DETAIL_WINDOW_SAVE_QUEUE_DESCRIPTION:0 "§HЗберегти до файлу§!\nЗберегти цю чергу рис до файлу, щоби мати до неї доступ у майбутніх іграх."
