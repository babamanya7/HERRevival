 BEL_belgica:0 "Белгіка"
 BEL_burgundy_rising_desc:0 "Золота ера фламандської влади та впливу була тоді, коли ми домінували в герцогстві Бургундія. Якщо ми хочемо відновити наш глобальний престиж, ми повинні підтримувати військові та фінансові традиції наших предків. Перший крок до цього буде, звісно, повернення цих територій."
