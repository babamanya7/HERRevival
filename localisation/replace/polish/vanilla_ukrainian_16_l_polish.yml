 SEA_japan_foreign_policy.127.b:0 "Так, вони заплатять за це!"
 SEA_japan_foreign_policy.13.b:0 "Ким вони себе вважають?"
 SEA_japan_foreign_policy.13.t:0 "[FROM.GetNameDefCap] окуповує область [721.GetName]!"
 SEA_japan_foreign_policy.141.a:0 "We will have to try again later..."
 SEA_japan_foreign_policy.23.a:0 "Сфера співпроцвітання вабить їх..."
 SEA_japan_foreign_policy.34.a:0 "Вони пошкодують про своє рішення"
 SEA_japan_foreign_policy.43.t:0 "[FROM.GetLeader] підписує пакт"
 SEA_japan_foreign_policy.50.t:0 "[FROM.GetNameDefCap] вимагає повної інтеграції"
 SEA_japan_foreign_policy.57.b:0 "Ми повинні захистити революцію!"
 SEA_japan_foreign_policy.62.desc:0 "Ван Цзінвей, колишній високопоставлений член Гоміньдану, прибув до Шанхаю і бажає працювати з нами. Враховуючи його становище та популярність, можливо, було б розумно надати йому високу посаду в нашому уряді, оскільки він зможе добре керувати нами."
 SEA_japan_foreign_policy.67.t:0 "Японія створює Тимчасовий уряд Вільної Індії"
 SEA_japan_foreign_policy.76.a:0 "Ми змушені змиритися з ситуацією"
 SEA_japan_foreign_policy.98.a:0 "Чудово"
 SEA_japan_news_events.01.desc:0 "\nУ пристрасній промові, виголошеній [JAP.GetLeader], він вигукує, що військові зайшли надто далеко цього разу, після недавньої спроби державного перевороту фракцією Кодо-ха в армії. Він також стверджує, що «якщо незліченних вбивств і спроб усунення нашого уряду маргінальними елементами було недостатньо, тепер вони також прагнуть використати недавній інцидент, щоб зміцнити свою владу і вирвати контроль над нашою нацією з рук її народу. Цьому не можна дозволити тривати!» \n\nСхоже, в [JAP.GetNameDef] назріває конфлікт."
 SEA_japan_popup_events.15.desc:0 "Сьогодні вранці прем'єр-міністр Кейсуке Окада був застрелений офіцерами таємної поліції Токко, коли чекав на посадку на лінії Яманоте на станції Токіо. Незабаром після цього військові висунули погрозу Імперському сейму, заявивши, що будь-яка спроба виключити їх буде зустрінута силою. Це явна ескалація ситуації, і тимчасовий прем'єр-міністр Мачіда Тюдзі звернувся до Імператора з проханням визнати ситуацію та зробити заяву. Тільки час покаже, яку сторону він займе."
 SEA_japan_popup_events.21.t:0 "[FROM.GetLeader] підписує ультиматум Хункоу"
 SEA_japan_popup_events.31.t:0 "Лідер для Кодза-ха"
 SEA_japan_popup_events.33.desc:0 "Коли влада тепер твердо перебуває в руках народу, питання колишньої імператорської сім'ї все ще висить над нашими головами. Існує багато різних думок щодо того, як найкраще з ними вчинити: дехто пропонує перевиховання та зниження їхнього статусу до звичайних робітників, тоді як інші стверджують, що вони повинні понести суворіше покарання за свої злочини проти народу як під час війни, так і задовго до неї. Яким буде вибір, ще не вирішено, але хоч би яким він був, існуватимуть розбіжні думки, з якими доведеться мати справу."
 SEA_japan_popup_events.37.t:0 "[FROM.GetNameDefCap] розпалює комуністичні настрої"
 SEA_japan_popup_events.44.b:0 "Ні, він повинен залишатися на полі бою!"
 SEA_japan_popup_events.50.b:0 "Ми не виконаємо їхніх вимог!"
 SEA_warlords.11.t:0 "$KUM_yulbars_khan$ прибуває"
 SEA_warlords.15.desc:0 "$wtt_political_warlord_support.11.desc$"
 SEA_warlords.4.desc:0 "З початком нашого маршу на Хотан Юлбарс-хан оголосив про свою підтримку Ма Хушаня і закликав до повстання проти нашої адміністрації в Хамі. Тепер ми воюємо на два фронти."
 SEA_warlords.44.a:0 "Так, тільки завдяки глибшій співпраці ми зможемо досягти успіху!"
 SEA_warlords.47.t:0 "Лідерство у кліці Лянгуан"
 SEA_warlords.55.desc:0 "З посиленням тиску з боку Центрального уряду, який вимагає результатів, але безрезультатно, та падінням бойового духу серед наших військ, стає зрозуміло, що ми повинні припинити нашу безплідну боротьбу і звернути увагу на більші загрози, що нависли над Китаєм. День втрачено, [PRC.GetNameDef] стійко тримається перед обличчям незгод, і їхні сили поки що продовжуватимуть окупувати північні частини нашої провінції."
 SEA_warlords.56.a:0 "Активний підхід до оборони? Чудово!"
 SEA_warlords.62.a:0 "Вони провалили свою місію, приборкайте їх"
 SEA_warlords.64.t:0 "$KHM_ma_hushan$ прибуває з [KHM.GetAdjective]им золотом"
 SEA_warlords.74.a:0 "We welcome you brothers"
