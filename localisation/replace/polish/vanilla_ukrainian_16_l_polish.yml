 ARG_pay_back_britain:0 "Сплатити позику від держави [ENG.GetFlag]§Y[ENG.GetName]§!."
 ARG_peronist_party_long:0 "Хустісіалістська партія"
 ARG_political_events.111.t:0 "[FROM.GetNameDefCap] вимагає, щоб ми вийшли з [URG.GetNameDef]"
 ARG_political_events.22.t:0 "[ARG.GetNameDefCap] здійснила колоніальний план"
 ARG_political_events.30.t:0 "[ARG.GetNameDefCap] відступає"
 ARG_political_events.34.a:0 "Війна триває"
 ARG_political_events.41.a:0 "Це допоможе нашому шляху до Революції!"
 ARG_revive_the_colonial_plan:0 "Відродити колоніальний план"
 ARG_roberto_maria_ortiz_desc:0 "Роберто Марія Ортіс переміг на виборах з явною більшістю, а це означає, що коаліція «Конкордансія» продовжує своє управління [ARG.GetName]. У своїй інавгураційній промові він наголосив на ратифікації своєї віри в демократію, пообіцявши повагу до свободи та гарантій, які Конституція встановлює для [ARG.GetAdjective] народу."
 ARG_subject_DEF:0 "$OVERLORDADJ$а $ARG$"
 ARG_tac_bomber_equipment_1_short:0 "FMA AeMB.2"
 ARG_the_castillo_cabinet:0 "Кабінет Кастільйо"
 ARG_university_reforms_desc:0 "У міру посилення нашої системи освіти, це була б чудова можливість реформувати й наші університети. Розвиток вищої освіти дозволить нам краще використовувати дослідницькі відділи наших університетів."
 ARMY_DIVISIONS_THEATRES:0 "Активні в $N$ театрах"
