 WW_hungary.101.desc:0 "[FROM.GetLeader] із [FROM.GetNameDef] відмовив у створенні автономного протекторату для секеїв. Народ лишився незахищеним. Якщо їхні правителі не дбають про них, чи не маємо ми втрутитися?"
 WW_hungary.106.desc:0 "Хоч це й не стало несподіванкою, нерозумний [FROM.GetLeader] із [FROM.GetNameDef] підняв війська по тривозі після нашого ультиматуму й надіслав посланця з заявою, що не відступить ні на крок у цій суперечці."
 WW_hungary.5.desc:0 "Замість того, щоб протистояти могутності наших армій, [FROM.GetAdjective]ий трухливий уряд вирішили повернути наші законні території. Усі контрольовані ними території в Трансільванії були передані нашій адміністрації, наші сили поступово беруть їх під повний контроль."
 WW_hungary.50.desc:0 "[FROM.GetNameDefCap] призначив Карла Пія Габсбурга новим королем нашої нації. Це безумовно зміцнить наш режим."
 WW_hungary.51.a:0 "Це наш обов'язок"
 WW_hungary.70.desc:0 "Мудре керівництво [FROM.GetNameDef] погодилося коронувати монарха з династії Габсбургів і склало повноваження на його користь."
 WW_hungary.76.desc:0 "Розсудливий [FROM.GetLeader] із [FROM.GetNameDef] погодився передати нам Палестину та наказав своїм військам відступити. Ми знову святкуємо перемогу!"
 WW_hungary.77.a:0 "Вони пожалкують про це!"
 WW_hungary.90.b:0 "Іштван Горті має підтримку народу"
