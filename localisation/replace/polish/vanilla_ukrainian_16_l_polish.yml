 form_eu_portugal_coring_states_tt:0 "Усі §Yпортугальські§! території в Європі стануть осердними.\n"
 form_majapahit_empire_category_desc:0 "Багато століть тому велика імперія простягалася на Індонезійському архіпелазі та домінувала в його торгівлі. Нам вдалося розширити наші кордони, щоб охопити територію цієї імперії, і використання їх у якості підґрунтя для нової нації цілком може послугувати символом єдності регіону."
 form_maphilindo_category_desc:0 "Хоча наші етнічні зв'язки з народами Індонезії та Малайзії не такі міцні, як між цими країнами, слід визнати, що наші кордони були накреслені колоніальними державами, і лише разом ми можемо захиститися від зовнішнього впливу на наш стратегічно важливий регіон."
 form_persia_britain_coring_states_tt:0 "Усі §Yбританські§! території в Єгипті, на Близькому Сході та в Східному Середземномор'ї стануть осердними."
 form_rattanakosin_kingdom:0 "Зміцнити спадщину Раттанакосін"
 form_roman_empire_flag:0 "Держава §Y[ITA.GetFlag][ITA.GetNameDefCap]§! сформувала §YРимську імперію§!"
 form_siberian_republic:0 "Сформувати Сибірську державу"
 form_transcaucasus_category_desc:0 "Закавказька республіка, яка нещодавно була розпущена відповідно до радянської Конституції 1936 року, все ще залишається ідеєю, що закарбувалася у свідомості людей. Якщо країні вдасться об'єднати ці території, є шанс, що федерація держав може бути відновлена, і що Закавказзя знову стане єдиним і сильним."
 form_united_central_america:0 "Відновити Сполучені Провінції"
 formalize_the_entente_desc:0 "Ми не наважувалися оголосити Балтійську Антанту належною фракцією, але ми впевнені, що отримали достатньо членів, щоби самостійно протистояти зростаючому імперіалізму на наших кордонах."
 france.13.t:0 "Британія відмовляється зливатися"
 france.16.a:0 "Ми проходили крізь гірше!"
 france.20.a_tt:0 "§YШарль де Голль стає лідером Франції§!"
 france.20.d:0 "Після перемир'я Франції з Німеччиною та встановлення нового уряду у Віші група старших офіцерів повстала проти нового французького уряду. Шарль де Голль виступив з радіопередачею, закликаючи до опору проти колабораційного режиму Віші. Де Голль фактично бере на себе керівництво силами Вільної Франції і продовжує боротьбу з німцями."
