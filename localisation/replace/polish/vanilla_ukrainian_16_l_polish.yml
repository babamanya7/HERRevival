 CHL_political_events.95.t:0 "Націонал-соціалістичний рух посилює діяльність"
 CHL_public_works:0 "Проєкти громадських робіт"
 CHL_revise_the_social_classes_desc:0 "Тепер, коли ми знову маємо власне суспільство, настав час реструктурувати соціальні класи, щоб вони краще відповідали нашим поглядам та ідеалам. Час європейців скоро закінчиться!"
