 SWE_reclaiming_the_rus_desc:0 "Наші предки колись відвідували річки західної Росії та України, селившись уздовж їхніх берегів. Настав час інтегрувати ці регіони до наших володінь і завершити те, що вони почали шляхом колонізації."
 SWE_rockets_desc:0 "Хоча літаки з реактивними двигунами вражають, ракетна технологія дає нам можливість створювати одноразову зброю з набагато більшою швидкістю та радіусом дії без необхідності дорогого навчання пілотів."
