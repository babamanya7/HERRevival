 SEA_PRC_faction_events.60.t:0 "$generic.2.t$"
 SEA_PRC_faction_events.80.desc:0 "Надійшло повідомлення з [FROM.capital.GetName], що має безпомилкову печатку [FROM.GetLeader]. За витіюватою мовою про єдність і національну долю ховається вимога — ми повинні підкоритися і визнати владу [FROM.GetNameDef] над нашими володіннями. Жодного місця для переговорів, лише послух або наслідки."
 SEA_PRC_fourth_army_incident.4.a:0 "Дуже добре"
 SEA_PRC_misc_events.11.desc:0 "Сумна звістка надійшла до [ROOT.Capital.GetName]. Лікар Норман Бетьюн — після самовідданої допомоги нашому народу протягом понад двох років — помер після, здавалося б, незначного порізу пальця, що призвів до інфекції, яка виявилася фатальною. [ROOT.GetLeader], отримавши цю новину, написав некролог, вихваляючи роботу Бетьюна. У цій письмовій данині підкреслюється готовність лікаря подорожувати світом на підтримку своїх товаришів і те, як він подав приклад співпраці між пролетаріатом різних країн."
 SEA_PRC_misc_events.17.a:0 "Сліпий дурень — це і сліпець, і дурень"
 SEA_PRC_misc_events.19.desc:0 "Нам пощастило, що [FROM.GetNameDef] погоджується на наші вимоги."
 SEA_PRC_political_events.1.a:0 "Нехай веде $PRC_wang_ming$"
 SEA_PRC_political_events.13.b:0 "Ми почекаємо свого часу..."
 SEA_PRC_political_events.31.b:0 "Якщо подумати... давайте не будемо"
 SEA_PRC_request_aid.33.desc:0 "Відповідаючи на наш запит щодо танків БТ-7, [FROM.GetName] погодився надіслати лише символічну кількість. Цього недостатньо для повного оснащення танкової дивізії, але достатньо, щоб розпочати. Принаймні ми можемо використати ці 100 машин для навчання наших екіпажів, поки шукатимемо інші способи отримати сучасні танки."
 SEA_PRC_request_aid.5.t:0 "[FROM.GetName] надсилає танки"
 SEA_PRC_request_aid.8.desc:0 "[FROM.GetName] відхилив наш запит на танки, посилаючись на те, що їхні власні нагальні потреби не дозволяють їм виділити будь-які активні або резервні машини. Хоча це прикро, [FROM.GetName] все ж надіслав нам кілька навчальних посібників. Тож хоч щось ми отримали."
 SEA_PRC_request_aid.9.b:0 "У нас немає на це часу"
 SEA_PRC_zhang_guotao_events.3.t:0 "$PRC_zhang_guotao$ та Четверта фронтова армія прибули до [ROOT.capital.GetName]"
