 DOD_hungary.103.b:0 "Вони нічого не отримають."
 DOD_hungary.111.b:0 "Можливо ми зможемо знайти компроміс."
 DOD_hungary.112.a:0 "Ми продовжимо гнути свою лінію поодинці."
 DOD_hungary.113.b:0 "Змусити їх віддати Бессарабію"
 DOD_hungary.113.desc:0 "Румунський уряд, який очолює [ROM.GetLeader], відправив до Москви делегацію на переговори про статус спірних територій. Судячи з усього, вони впевнені, що зможуть досягти компромісу: віддати одну половину спірних земель і іншу. Якщо ми погодимося, то яку область нам слід вимогти?"
 DOD_hungary.120.t:0 "Угорщина пропонує підтримати Чехословаччину"
 DOD_hungary.129.b:0 "Викинути його у вікно!"
 DOD_hungary.129.desc:0 "Сьогодні німецький посол передав нам послання, в якому [GER.GetLeader] вимагає негайно передати йому всі державні повноваження як нового «райхспротектора» і чекати на прибуття затвердженого ним керуючого з Берліна. У тому ж посланні посол зажадав, щоб держава [From.From.GetNameDef] отримала аналогічні права щодо Словаччини.\n\nНам загрожують «швидкими та рішучими військовими діями» у разі відмови."
 DOD_hungary.24.t:0 "Напад на Швецію"
 DOD_hungary.25.a:0 "Ми відбиватимемося самотужки."
 DOD_hungary.41.a:0 "Вони явно блефують."
 DOD_hungary.46.desc:0 "Натовп боягузів і зрадників, відомий як [From.GetNameDef], не хоче йти з нами на війну! Замість дати відсіч задирам із Будапешта, вони прогнулися й кинули нас наодинці з [HUN.GetAdjective]ими силами."
 DOD_hungary.55.d:0 "Звернутися до Франції"
 DOD_hungary.58.desc:0 "Ситуація на Балканах загрожує незабаром перерости у військовий конфлікт, і Угорщина запропонувала нам стати посередником на переговорах щодо суперечки про Трансільванію. Нас попросили увійти до складу групи, яка вирішить долю Трансільванії. Угорці вважають, що ми зможемо захистити їх інтереси на майбутній конференції."
 DOD_hungary.65.desc:0 "Дізнавшись про рішення посередницької групи про спірні території, [HUN.GetLeader] відмовився його підписати. Він стверджує, що будь-який результат, крім відновлення Угорщини в її колишніх межах, ображає почуття всіх угорців, живих або мертвих.\" \n\nВін пішов ще далі і заявив про те, що оскільки переговори і дипломатія вичерпали себе, є тільки один спосіб вирішити цю суперечку.\n\nВлада Румунії звернулася до нас за нашою точкою зору в цьому питанні, пам'ятаючи про те, що ми раніше погодилися надати їм підтримку."
 DOD_hungary.69.desc:0 "Багатогодинні переговори, здається, дозволили знайти свого роду рішення. На жаль, нам доведеться віддати угорцям частину своєї території. Їм дістанеться північна частина Трансільванії, а ми збережемо південну. Ми сподівалися на інший результат, але якщо тверезо оцінювати ситуацію, це — найкращий із можливих результатів."
 DOD_hungary.81.desc:0 "Держава [From.GetName] віддала нам південну Словаччину та відвела війська за демаркаційну лінію. Тепер цей регіон повністю належить нам."
 DOD_hungary.95.b:0 "Отже, ми все зробимо самі!"
 DOD_romania.10.a:0 "Ми будемо разом."
 DOD_romania.110.b:0 "Навіщо домовлятися про те, що ми можемо захопити самі?"
 DOD_romania.53.a:0 "Це не варте ні часу, ні зусиль."
 DOD_romania.83.t:0 "Король влаштував пишний прийом"
 DOD_yugoslavia.1.a.tt:0 "§Y$YUG_peter_ii$§! стане лідером партії з ідеологією §Y[YUG.GetIdeologyNameWithCaps]§!.\n"
 DOD_yugoslavia.183.a:0 "Потрібно бути обережними."
 DOD_yugoslavia.36.a:0 "Якщо вони не з нами — вони проти нас!"
 DOD_yugoslavia.44.desc:0 "Війна триває вже кілька місяців, але [YUG.GetLeader] як і раніше не хоче підтримати будь-яку зі сторін і продовжує торгувати з Німеччиною, дотримуючись при цьому жорсткого нейтралітету. Їхня допомога Німеччині зараз навряд чи є важливою проблемою, але нам потрібно вирішити, чи дозволимо ми їм підтримувати країну, з якою ведемо війну."
