 denmark_protection_event.120.b:0 "Вони хочуть роздобути наші знання"
 denmark_protection_event.122.desc:0 "Лідер держави [FROM.GetNameDef] [FROM.GetLeader] зарозуміло відкидає нашу пропозицію обмінюватися технологіями, заявивши, що його країна не отримає вигоди від такого обміну, і що ми лише хочемо загарбати їх наукові здобутки."
