 FIN_defensive_preparations:0 "Приготування до оборони"
 FIN_defensive_preparations_mining_the_sea_dec_tt:0 "[GetMiningTheSeasDecTooltipFromPoliticalBranch]"
 FIN_dominate_the_skies_desc:0 "[ROOT.GetAdjective]е небо буде належати нам! Виробництво нових винищувачів та інвестиції в дослідження та розробку сучасних технологій повітряного бою дозволять нам забезпечити перевагу в повітрі та захистити нашу батьківщину. Наші досвідчені пілоти пануватимуть у небі і принести бій ворогові."
 FIN_finnish_democratic_republic_DEF:0 "Фінська демократична республіка"
 FIN_finnish_neutrality_desc:0 "Сила та рішучість нашого народу боротися за свою свободу неможливо стерти. Однак ми повинні проводити політику нейтралітету, щоб у наших сусідів не було причин позбавлятися нашої важко здобутої незалежності."
 FIN_finno_estonian_union_desc:0 "У нас є довга історія з народом Естонії, тому нам боляче бачити, як вони потрапили в пастку між великими державами, очікуючи, що їхній дім стане ще одним полем битви в міжнародній боротьбі. Можливо, через союз ми зможемо врятувати їх від такої доля."
 FIN_form_a_military_government_desc:0 "Нинішній цивільний уряд продемонстрував слабкість перед обличчям ворожості та труднощів. $FIN_carl_mannerheim$ добре служив нашій країні раніше і, безсумнівно, зробить це знову. Він повинен сформувати військовий уряд, щоб захистити кожного нашого ворога."
 FIN_heimosodat_dec_tt:0 "Відмикає сукупність рішень §Y$FIN_the_last_kinship_war$§!, які дозволяють §Y$FIN_stir_anti_soviet_sentiment_in_karelia$§! в областях, контрольованих Радянським Союзом §Y[215.GetName]§! та §Y[216.GetName]§!, а також для §Y$FIN_instigate_a_new_karelian_uprising$§! проти [SOV.GetNameDef].\n\n"
 FIN_in_a_defensive_war_against_a_major_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! веде оборонну війну проти §Yвеликої країни§!"
 FIN_increase_military_budget:0 "Збільшити військовий бюджет"
 FIN_keepers_of_the_baltic_countries_desc:0 "Люди Балтії мало зацікавлені в тому, щоб бути включеними до [GER.GetNameDef] або [SOU.GetNameDef]. Ми самі, з нашою спільною історією та світоглядом, здатні мирно керувати цими державами у спосіб, який не знищити їх."
 FIN_maan_turva:0 "Maan Turva"
 FIN_military_aid_desc:0 "Союзники мають величезну кількість виробників зброї, ми повинні використати їх для швидкої модернізації наших збройних сил."
 FIN_mining_the_sea_unlocked:0 "\nВартість і час для завершення §Y$FIN_mining_the_sea$§! рішення зменшено вдвічі."
 FIN_national_defense_category:0 "Національна оборона"
 FIN_national_unity_desc:0 "Оскільки війна наближається, ми об'єднаємо людей нашої великої нації та ще раз продемонструємо світові, що означає бути фіном."
 FIN_secure_the_baltic_sea_dockyards_tt:0 "\n§YДодати§! §G2§! §Y$dockyard_pl_acc$§! до §Y2§! повністю контрольованих областей у Балтійському морі.\nПоточні ефекти:"
 FIN_seek_german_protection_desc:0 "Ліга Націй абсолютно не дотримується міжнародного права. Ми повинні визнати, що сила збройних сил є єдиним визначальним фактором у міжнародних відносинах. Щоб наша держава вижила, ми повинні шукати допомоги у наших сильніших сусідів, таких як як [GER.GetNameDef]."
 FIN_soviet_threat:0 "Радянська загроза"
 FIN_submarine_1_desc:0 "The Vetehinen class consisted of three medium submarines built for the Finnish Navy. They were based on the German WWI-era UB III subs. They displaced just under 500 tons and were armed with four 533mm torpedo tubes."
 FIN_suomalainen_sosialismi:0 "Suomalainen sosialismi"
 FIN_support_for_ground_forces_desc:0 "У міру того, як триває війна, стало зрозуміло, що сухопутні сили потребують більшої підтримки з повітря. З цією метою ми будемо інвестувати в розробку та виробництво літаків ближнього повітряного супроводу, щоб забезпечити важливе повітряне прикриття наших військ на Це дасть їм необхідну підтримку, щоб утримувати свої позиції та відбиватися від ворога."
 FIN_the_second_finnish_civil_war:0 "Друга громадянська війна у Фінляндії"
 FLEET_NAME:0 "$NUMBER$ флот держави $COUNTRY$"
