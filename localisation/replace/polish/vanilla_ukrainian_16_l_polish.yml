 INDUSTRIAL_ORG_OPEN_DETAILS_WINDOW_TOOLTIP:0 "Відкрити подробиці про військово-промислову організацію."
 INDUSTRIAL_PROGRESS:0 "Споруда $BUILDING|H$ завершена на $PROGRESS|0H$/$COST|0H$ ($VALUE|0%H$)."
 INIT_MAP_LOGIC:0 "Ініціалізація логіки мапи"
 INSHOL_agricultural_subsidies_desc:0 "Дозволяючи створення приватних ферм різних розмірів, ми можемо прискорити розвиток інфраструктури в недофінансованих сільських регіонах, одночасно збільшуючи доходи уряду. Для досягнення цього ми створимо структуровану податкову систему, за якої весь податковий дохід, отриманий цими фермами, перераховуватиметься безпосередньо до Нідерландів, а не проходитиме спочатку через Ост-Індію."
 INSHOL_bio_pharma_desc:0 "Розширення фармацевтичної промисловості Ост-Індії є очевидним наступним кроком у реформуванні KNIL, щоб гарантувати, що поранені солдати отримають належне лікування та безпечно одужають. Поширеність хініну в Ост-Індії робить вартість цього проєкту суттєво нижчою, ніж зазвичай."
 INSHOL_destroyers:0 "Есмінці"
 INSHOL_domestic_ship_production_desc:0 "Якщо ми хочемо, щоб наш флот протистояв сусідам, ми повинні почати нарощувати вітчизняне суднобудування."
 INSHOL_marines_desc:0 "Ми повинні створити спеціальний Корпус морської піхоти Ост-Індії в рамках нового флоту та відправляти морських піхотинців на навчання на голландських кораблях."
 INSHOL_naval_program_transfer_100_tt:0 "Передає §Rвесь наш флот§! до [INS.GetNameDef]."
 INSHOL_no_compromise:0 "Ніяких компромісів, ніякої капітуляції"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc:0 "Гульден Ост-Індії втратив більшу частину своєї вартості під час великої депресії, а наше economic зростання зайшло в глухий кут. Найпростіше рішення — прив'язати ост-індський гульден до голландського гульдена, набагато стабільнішої валюти. Це також сильніше прив'яже нас до нашого сюзерена."
 INSHOL_reduce_land_ownership_taxes_desc:0 "Ми повинні зменшити податок на індонезійських громадян, які володіють землею, заохочуючи розвиток фермерських господарств і бізнесу."
 INSHOL_undermine_the_militias_desc:0 "ЗМІ перебільшують серйозність цієї ситуації, ополчення — це лише група повсталої молоді, яка намагається досягти чогось недосяжного. Нам не потрібно спрямовувати всі наші ресурси на їх зупинку, ми маємо просто тримати лінію і чекати, поки вони втомляться."
 INS_GATHERING_STORM_DESC:0 "Протягом понад трьох століть Нідерландська Ост-Індія була перлиною колоніальної імперії Нідерландів. Її величезний архіпелаг островів, мов і культур був пов'язаний лише колоніальною адміністрацією, яка ним править.\n\nВлада Гааги з кожним днем стає все менш надійною. Населення, втомиле від експлуатації, стає все більш сприйнятливим до націоналістичних рухів. Але ці рухи далеко не єдині, кожен з яких має суперечливе бачення Індонезії. Чи зможуть вони відкинути свої розбіжності та говорити як один, цілком може вирішити долю Індії."
 INS_artillerie_inrichtingen_organization:0 "[INS_artillerie_inrichtingen_name]"
 INS_assist_the_pemuda:0 "Допомога Пемуда"
 INS_expand_batavia_med_school_tt:0 "§Y$INS_dutch_east_indies$§!: Модифікатор швидкості дослідження становить принаймні §G1.00%§!."
 INS_federation_of_aslia_desc:0 "Нації, які ми звільнили, не повинні стояти наодинці. Тан Малака завжди уявляв собі щось більше, ніж одну республіку. Федерацію від материка до Тихого океану, об'єднану проти будь-якої колоніальної держави, яка наважиться повернутися. Ми запропонуємо їм повноправне членство в нашій державі."
 INS_focus_time_reduce_fokker_tt:0 "§Y$INSHOL_east_indies_fokker_division$§! скоротить час, необхідний для цього фокусу, на 35 днів."
 INS_fra_treaty_holside_tt:0 "§Y[FRA.GetNameDefCap]§! офіційно оголосить про свою підтримку на нашому боці конфлікту та надасть суттєву допомогу. Якщо війна закінчиться перемогою, §Y[FRA.GetNameDefCap]§! матиме право на північно-східну Суматру."
 INS_greater_indonesia_desc:0 "Стародавня імперія Нусантара колись об'єднала малайський світ як єдине ціле, один народ. Звільнивши Малайю від колоніальної тиранії, ми маємо зробити так, як наші предки в Нусантарі, проголосивши весь малайський світ єдиною об'єднаною нацією."
 INS_guerilla_industry:0 "Партизанська промисловість"
 INS_has_gotten_invasion_event:0 "Індонезія була захоплена"
 INS_hatta_focus_2:0 "Наступні кроки"
 INS_industrial_events.36.b:0 "Організувати ще одну партію."
 INS_infantry_equipment_2:0 "Johnson M41"
 INS_infantry_equipment_2_short:0 "Johnson M41"
 INS_instigate_chaos_medan:0 "Спровокувати хаос у Медані"
 INS_invite_foreign_companies:0 "Підтримка американських нафтових підприємств"
 INS_is_noncore_but_indonesian_trigger_tt:0 "Є національним індонезійським регіоном"
 INS_limited_war_events.3.desc:0 "Надійшли звістки з Куала-Лумпура. Маріонетковий уряд, покинутий у вирішальний час своїми лондонськими господарями, прийняв наші умови, щоб не бачити, як горять їхні міста. Спірні землі — наші. Цей урок не пройде повз інші клієнтські держави регіону."
 INS_limited_war_events.4.desc:0 "[FROM.GetName] кинула нашу пропозицію нам в обличчя. Маріонеткові міністри, читаючи за сценарієм, написаним у Вайтголлі, заявляють, що жодної п'яді землі не буде здано, і що сама Республіка повинна бути підкорена до того, як замовкнуть гармати."
 INS_loyalist_events.13.t:0 "[FROM.GetNameDefCap] пропонує компроміс щодо Сінгапуру"
 INS_loyalist_events.23.desc:0 "Контролери Східного Тимору почали виводити свій гарнізон і згортати колоніальну адміністрацію. Весь острів незабаром буде під владою [INS.GetAdjective]."
 INS_loyalist_events.33.t:0 "[PHI.GetNameDefCap] відмовляється від об'єднання"
 INS_medium_tank_destroyer_equipment_1:0 "Tankjager 3"
 INS_netherlands_can_remove_autonomy_tt_75:0 "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -75.00§!"
 INS_not_industry_desc:0 "Ява — це б'юче серце нашої нації, де проживає більша частина нашого населення та розташований уряд. Перш ніж ми зможемо розпочати серйозну індустріалізацію острова, ми повинні спочатку підготувати ґрунт. Геодезичні дослідження, виділення зон та очищення ділянок гарантують, що коли заводи з'являться, вони будуть побудовані там, де принесуть найбільшу користь."
 INS_ongoing_influence_process:0 "Ще не створює базу ополчення"
 INS_political_events.11.t:0 "[HOL.GetNameDefCap] визнає суверенітет Індонезії"
 INS_political_events.19.desc:0 "До [1058.GetName] дійшли звістки, що адмірала Конрада Гелфріха, командувача нашими військово-морськими силами і найздібнішого офіцера, який у нас є в цих водах, наказано повернути додому. Гаага посилається на нагальні потреби в метрополії і не дає жодних подальших пояснень. Його від'їзд залишає архіпелаг слабо захищеним у момент, коли наші позиції тут далеко не є безпечними, і кажуть, що в кают-компанії в Сурабаї панують похмурі настрої."
 INS_political_events.7.t:0 "Петиція Сутарджо"
 INS_revolution_events.42.desc:0 "Звіти від наших розвідувальних служб у Батавії описують підготовку ворога, подібної до якої ми ніколи не бачили від республіканців. Схоже, вони готують операцію з дестабілізації, щоб штурмувати Яву і знищити всю нашу інфраструктуру зв'язку, ефективно гарантуючи свою перемогу. Однак ця операція вкрай ризикована і вимагає переміщення майже всіх їхніх ресурсів на неї. Наші генерали оцінюють, що вони можуть утримувати цю позицію лише близько двох років і не зможуть легко відступити. Якщо ми стримаємо їх достатньо довго, ми зможемо розчавити їхній уряд і революцію, як перестиглий помідор."
 INS_revolution_events.43.t:0 "База ополчення в [FROM.GetName] була створена"
 INS_revolution_planning_influence_state_points_notif_tt_1:0 "Ми зможемо створити базу ополчення лише в §Y1§! додатковому регіоні §Rза межами Яви§!."
 INS_rubber_for_pp:0 "Використати каучук для підкупу"
 INS_set_leader_to_INS_iskandar_sjah:0 "Обрати $INS_iskandar_sjah$"
 INS_soetardjo_petition_refresh_tt:0 "Повторно активує місію: §YПетиція Сутарджо очікує на затвердження§! тривалістю §Y120 днів§!."
 INS_support_tan_malakas_coup:0 "Підтримка перевороту Тана Малаки"
 INS_tac_bomber_equipment_2:0 "Fokker T.IX"
 INS_tac_bomber_equipment_3_short:0 "B-25 Mitchell"
 INS_tan_malakas_faction:0 "Аслійський підготовчий фронт"
 INS_tkr_professional_army_desc:0 "Ми не повинні покладатися лише на ополчення, ми повинні створити професійну Республіканську армію для підтримання порядку."
 INS_union_events.10.desc:0 "[INS.GetNameDefCap] відхилили пропозицію про союз. Люди і лідери [INS.GetAdjective] не бачать у цьому довгострокової перспективи і виступають проти будь-яких пропозицій щодо відмови від влади."
 INS_union_events.2.a:0 "Єдиний фронт проти наших спільних ворогів."
 INS_union_events.5.desc:0 "Світові зрозуміло, що війна складається не на нашу користь. Наша країна впала, і наша база операцій перемістилася на схід. Міністри в [INS.GetName] надіслали нам пропозицію сформувати спільну союзну державу на чолі з королевою Вільгельміною, щоб гарантувати максимально можливу співпрацю. Хоча, здається, ніхто не в захваті від цієї пропозиції, це може бути нашим ключем до виживання."
 INS_union_events.8.t:0 "[HOL.GetNameDefCap] пропонує Нідерландсько-Індонезійський союз"
 INS_volksraad_education_subsidies_for_indonesians_desc:0 "У Фольксрааді тривають дебати щодо субсидій та стипендій, які надаються нідерландським студентам в Ост-Індії. Кілька представників корінних громад у Фольксрааді стверджують, що цю систему слід поширити на будь-кого зі студентів, незалежно від походження. Це принесло б нам прихильність населення, хоча й коштувало б недешево."
 INS_win_condition_base_republic_warning:0 "Знищити Ост-Індію"
 INTEL_LEDGER_MIL_INDUSTRY_TOOLTIP:0 "  Військові заводи: $RANGE|H$"
 INTEL_THRESHOLD_HEADER_AIRFORCE:0 "§HЗвіти по авіаційних розвідданих:§!\n\n"
 INTERNATIONAL_MARKET_CIV_AND_CONVOY_ALLOCATION_DELAYED_TOOLTIP:0 "Це виділені §Yцивільні заводи§! та §Yконвої§!, використовувані для активних контрактів."
 INTERNATIONAL_MARKET_PRICE_LEVELS_WIDGET_INSTANT_MIXED_TOOLTIP:0 "§YНалагоджувач вартості в економічному потенціалі§!\nПоточна вартість — Змішана.\n\n$LOW$\n$NORMAL$\n$HIGH$\n"
 INTERNATIONAL_MARKET_PRICE_LEVELS_WIDGET_PRICE_LABEL_HIGH:0 "Висока: $FACTOR|%H$"
 INTERNATIONAL_MARKTE_SUBSIDIES_ENTRY_DRAFT_APPLIED_TT:0 "Застосована кількість: £civ_factory_output£ $APPLIED|Y$"
 INVALID_EMAIL:0 "§RНеправильна адреса ел. пошти§!"
 INVASION_CONDITION_PREP_MORE:0 "готово на більш ніж $VAL|%0$"
 IRQ_approach_tribes_for_support_desc:0 "Є багато сільських громад, які дотримуються традиційного племінного способу життя, і з моменту заснування нашої держави вони були переважно ворожими до нас. Можливо, ми просто ще не знайшли правильних стимулів, щоб їх переконати."
 IRQ_arab_league_faction:0 "Арабська ліга"
 IRQ_increase_anglo_iraqi_economic_ties_desc:0 "Було б нерозумно не скористатися тісними економічними зв'язками, які ми налагодили з [ENG.GetAdjective]."
 IRQ_iraqi_al_futuwwa:0 "Сформувати Іракський аль-Футувва"
 IRQ_kurdish_revolt:0 "Розпочати повстання"
 IRQ_kurdish_revolt_tt:0 "Ми оголосимо незалежність від §YІракської Держави§!, що призведе нас до §RВійни за незалежність§! проти них."
 IRQ_political_events.28.desc:0 "[FROM.GetNameDefCap] нерозумно вирішив відхилити членство у федерації. Однак вони не вказали, що проти приєднання в майбутньому, коли їхній народ може бути більш сприйнятливим."
 IRQ_political_events.31.a:0 "Домовитися про передачу, але спочатку проконсультуватися з місцевими жителями."
 IRQ_political_events.71.desc:0 "Багато хто в нашій нації досі не визнає «Золотий квадрат» своїми законними правителями, і вважає нас узурпаторами та нелегітимними негідниками. Щоб вирішити цю проблему, наші міністри запропонували кілька варіантів. Або ми просто ігноруємо заклики народу і сподіваємося, що вони згаснуть з часом, або ми призначимо Еміра Таїфа новим регентом для Фейсала II. Однак завжди є можливість реформуватися в республіку, хоча це може бути широко непопулярним серед нашого релігійного населення..."
 IRQ_purchase_foreign_equipment_desc:0 "Хоча у нас є орні землі та багато районів для зрошення, нам бракує механізованих інструментів промислових держав. Якби ми інвестували в імпорт такої техніки, ми могли б різко збільшити виробництво врожаю та промисловий випуск."
 IRQ_purchase_small_ships:0 "Придбати невеликі кораблі"
 IRQ_raf_levies_focus_desc:0 "[ENG.GetAdjective] підтримує ряд мобілізованих військ на нашій території для забезпечення безпеки своїх авіабаз. Можливо, ми могли б покращити наші оборонні можливості, краще співпрацюючи з такими силами."
