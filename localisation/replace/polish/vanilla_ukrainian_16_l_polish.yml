 lar_congress_of_paris.3.t:0 "[From.GetNameDefCap] погоджується"
 lar_end_the_occupation.5.t:0 "[From.GetLeader] погоджується"
 lar_france_french_union.3.desc:0 "Не дивлячись на всі зусилля місцевих урядів, голосуючі в Алжирі, Марокко та Тунісі більшістю відмовилися вступати у Французький Союз. Зразу після цього, як оголосили результати голосування, в декількох великих містах цих країн пройшли масові демонстрації. Групи націоналістів, скориставшись своєю перемогою, вимагали повної й негайної незалежності своїх держав.\n\nКомандуючий французькими військами в Північній АФриці послав негайне прохання про підкріплення, оскільки є ймовірність, що радикальні елементи можуть спробувати взяти ініціативу у свої руки."
 lar_france_vichy_reunification.1.a:0 "Час покінчити з цим неприродним розколом."
 lar_news.1.desc_franco_uprising:0 "Розбіжності серед націоналістів виявилися непереборними, але після довгої та жорстокої громадянської війни націоналісти під командуванням Франсіско Франко нарешті перемогли ворогів — карлистів і республіканців — і захопили повний контроль над Іспанією. пір йде партизанська війна, здатна завадити націоналістичному контролю в раніше республіканських районах, але малоймовірно, що вона переросте в масштабний скоординований опір. з-за кордону."
 lar_news.13.desc:0 "[From.GetNameDef], як і раніше, оговтується від громадянської війни. Тепер країна, як це не дивно, веде переговори про вступ до альянсу [From.GetFactionName]. Співпраця почалася ще під час громадянської війни, в під час якої держава [From.GetNameDef] отримала велику військову допомогу від держави [From.GetFactionName], і це, схоже, сповіщає про початок ще тіснішого зближення двох держав."
 lar_news.281.t:0 "Андалусію відновлено!"
 lar_news.29.desc:0 "Громадянська війна в Іспанії, здається, закінчилася. націоналістичні війська, що залишилися, або капітулювали, або пішли в підпілля. Лідери республіканців швидко скористалися ситуацією і оголосили про кінець громадянської війни, але експерти вказують на зростаючі розбіжності серед самих республік припускають, що війна просто переходить на новий етап, вони передбачають, що зі втратою загального ворога ці розбіжності лише посилять розкол серед Другої республіки. війни для боротьби з націоналістами, не розпущені та уважно стежать за сусідами."
 lar_news.4.a:0 "Ми вітаємо наших братів по зброї!"
 lar_portugal_iberian_summit.7.t:0 "Іберійський самміт — [From.GetNameDef] відкладає запит"
 lar_portugal_naval_blockade.2.t:0 "[From.GetName] приймає нашу пропозицію про уникнення морської блокади"
 lar_portugal_navy_mutiny.4.desc:0 " Бажаючи допомогти Іспанській Республіці в боротьбі з повстанням націоналістів, португальські моряки влаштували бунти на кількох військових кораблях. Вони заарештували офіцерів і, очікуючи потужного опору власних берегових батарей, приготувалися якомога швидше. \n\nОднак, на подив моряків, португальський уряд, бажаючи уникнути подальшої ескалації конфлікту, пішов на компроміс і дозволив морякам залишити порт і боротися за нашу справу за умови, що кораблі будуть повернуті назад після завершення громадянської війни.\n\nПісля цього частина моряків вирішила залишитися в Португалії і вимогти від урядів більш рішучих дій проти націоналістів, а кораблі ([?POR.POR_ships_revolted]) зараз прямують до наших портів. Ми мусимо привітати товаришів і подякувати їм за сміливість."
