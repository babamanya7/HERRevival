 LIT_events.302.a:0 "Дуже прикро."
 LIT_events.401.d:0 "[From.GetNameDefCap] відмовляється від нашої щедрої пропозиції, стверджуючи, що не хоче вплутуватися в конфлікти від імені держави [Root.GetNonIdeologyName]."
 LIT_events.902.d:0 "[Root.GetAdjective] прохання про головну роль в окупації Польщі не була задоволена державою [From.GetNameDef]. Спроба контролювати окупацію була розцінена ось яким чином: [Root.GetLeader] намагається прибрати до рук основні польські області та підірвати [From.GetAdjective]і претензії на польську територію."
 LIT_fortify_memel:0 "Укріпити Мемель"
 LIT_institute_royal_guards:0 "Створити королівську гвардію"
 LIT_integrate_the_opposition_desc:0 "Хоч Антанас Смєтона і вважав колишній уряд кабінетом некомпетентних політиків і співчуваючих радянцям, важко заперечувати, що серед них вистачало й грамотних управлінців. Нерозумно було б не задіяти цих людей у нашому новому сеймі."
 LIT_merge_the_military_and_civilian_governments:0 "Об'єднати військовий і цивільний уряди"
 LIT_presidential_reform:0 "[GetLithuanianPowerIdeaAdj]а реформа"
 LIT_propose_baltic_union_desc:0 "Тепер, коли різні організації діють у наших країнах спільно, схоже, що створення офіційного Балтійського союзу неминуче. Союз дасть усім його громадянам право голосу та вето в його межах і зробить наші народи ще ближчими."
 LIT_purge_popular_resistance:0 "Позбутися народного спротиву"
 LIT_support_monarchism_in_POL_desc:0 "Як і Литва, Польща мала обрати собі нового короля. При цьому, на відміну від Литви, поляки не змогли знайти собі відповідного монарха, але ми можемо забезпечити польському народові сильного правителя, який і був йому обіцяний, — того, хто зможе захистити країну від німецького імперіалізму."
 LIVONIA_democratic:0 "Сполучені республіки Лівонії"
 LOADING_TIP_120:0 "«Нас не мусить здолати страх будь-якої загрози, якій ми готуємося протистояти. Єдине, чого нам є боятися, — це самого страху».\n(Франклін Д. Рузвелт)"
 LOADING_TIP_156:0 "«Я проходжу крізь найсумнішу мить свого життя, адже я виконую найблючіший обов'язок — обов'язок, який для мене гірший від смерті».\n(Ян Сировий після схвалення Мюнхенської угоди, 1938 р.)"
 LOADING_TIP_159:0 "«Народе Філіппін: я повернувся».\n(Даглас МакАртур)"
 LOADING_TIP_55:0 "«Один удар німецької та другий удар радянської армій покінчили з цим потворним наслідком Версальського договору».\n(В'ячеслав Молотов після падіння Польщі)"
 LOADING_TIP_60:0 "«Якби Гітлер вторгся в пекло, це стало б вигідним відсиланням на диявола в Палаті громад».\n(Вінстон Черчилл, 21 червня 1941 р.)"
 LOADING_TIP_69:0 "«Усі ви закінчите тим, що будете чистити німцям чоботи!»\n(Італо Бальбо)"
 LOADING_TIP_94:0 "«Мене або нагородять, або віддадуть під трибунал. Вогонь!»\n(Біргер Еріксен)"
