 RAJ_GOE_orchestrate_train_robberies_desc:0 "Порушення залізничних перевезень послаблює колоніальну логістику, водночас надаючи нам ресурси для фінансування подальших операцій."
 RAJ_GOE_vie_for_princes:0 "Змагатися за князівські держави"
 RAJ_UK_neutrality:0 "Британська Індія"
 RAJ_akhand_bharat_claim_nep:0 "Вимагати [NEP.GetAdjective] держави"
 RAJ_akhand_bharat_claim_tib:0 "Вимагати [TIB.GetAdjective] держави"
 RAJ_army_motorization_desc:0 "Територія Індія надто велика, щоб її можна було ефективно подолати поїздом або конем. В армії повинні з'явитися моторизовані дивізії та вантажний транспорт."
 RAJ_congress_pass_working_conditions_legislation_desc:0 "Щоб виконати вимоги Конгресу, ми ухвалимо нове законодавство, яке покращить умови праці для будівельників."
 RAJ_consult_with_congress_leaders:0 "Проконсультуватися з лідерами Конгресу"
 RAJ_debt_manipulation_desc:0 "Ми можемо використовувати існуючий борг, щоб фальсифікувати збитки, що означає, що ми платимо менше податків і можемо накопичувати надлишкові прибутки."
 RAJ_demobilize_desc:0 "Однією з ключових умов уряду є те, що ми повинні демобілізувати армію, залишивши лише мінімальні сили підтримки миру. Чи вони бояться, що наша армія перевершить їхню власну?"
 RAJ_enrollment_of_dali_children_desc:0 "Даліти, «недоторканні», найнижчий прошарок каст, живуть у постійній бідності. Кастова система, пляма на нашій нації, може почати руйнуватися лише через зарахування їхніх дітей до школи."
 RAJ_expand_industry_in_hyderabad:0 "Розширити промисловість у Хайдарабаді"
 RAJ_free_abyssinia_desc:0 "Надто довго ми дозволяли регіону Абіссінія залишатися в руках ворога. Ми доведемо нашу цінність Короні, здійснивши потужне військово-морське вторгнення на Африканський Ріг через Аден, щоб звільнити його народ від окупантів."
 RAJ_frontier_corps:0 "Прикордонний корпус"
 RAJ_heavy_cruiser_3:0 "Клас «Admiral»"
 RAJ_heavy_cruiser_4:0 "Проєкт «Churchill»"
 RAJ_help_from_the_nagas:0 "Допомога від Нага"
 RAJ_hidden_pressure_PAK_BAN_exists:0 "$RAJ_hidden_pressure_PAK_BAN_does_not_exist$\n$RAJ_hidden_pressure_ban_exists$"
 RAJ_indian_institute_of_science_desc:0 "В Індійському науковому інституті, який знаходиться в Бангалорі, найкращі уми Індії працюють на благо нашого прогресу."
 RAJ_indian_territorial_force_desc:0 "[ROOT.GetAdjective] Територіальні сили забезпечать життєво важливий резерв навчених громадян, готових захищати батьківщину."
 RAJ_infantry_equipment_2_short:0 "GRI Sten Mk II"
 RAJ_integrate_the_princes2:0 "Підкорення князів"
 RAJ_join_the_shadow_scheme:0 "Приєднатися до Тіньової схеми"
 RAJ_jungle_training:0 "Навчання війні в джунглях"
 RAJ_khadi_movement:0 "Рух Хаді"
 RAJ_kingmaker_desc:0 "Надсилаючи добровольців у закордонні конфлікти, ми розширюємо наш вплив та отримуємо цінний бойовий досвід. Ці зусилля не лише підтримують наших союзників, але й позиціонують нас як вирішальну силу у формуванні результатів глобальних протистоянь."
 RAJ_lobby_for_increased_policing_responsibilities:0 "Лобіювати збільшення відповідальності поліції"
 RAJ_model_after_soviet:0 "Взяти за зразок Радянський Союз"
 RAJ_navy_funding:0 "Фінансування флоту"
 RAJ_planned_but_decentralized_desc:0 "Ми збережемо економічне планування, але надамо місцевим колективам автономію.\nЕфективність через ідеологію, а не бюрократію."
 RAJ_privatized_tutelage_desc:0 "Освіта буде зарезервована для тих, хто цього гідний, шляхом підтримки суворо приватизованої системи шкіл та коледжів, вільних від простолюду."
 RAJ_punjab_autonomy:0 "Автономія Пенджабу"
 RAJ_quit_india_movement_desc:0 "Кампанія Ганді за здобуття Індією незалежності досягла свого апогею, вилившись у заклик до британців забиратися додому. Важко уявити, що британці відмовляться від панування до закінчення війни, але ситуація загострюється з кожним днем."
 RAJ_rashtriya_swayamsevak_sangh:0 "Раштрія Сваямсевак Сангх"
 RAJ_return_churchill:0 "Повернути $ENG_winston_churchill$ до [ENG.GetNameDef]"
 RAJ_revive_the_screw_guns_desc:0 "Гірський рельєф Північної Індії дозволив розробити артилерійську зброю, яку можна розібрати і перевезти верхи на мулах в потрібну точку. Ця 7-фунтова гармата, звичайно, трохи застаріла, але не можна забувати про її."
 RAJ_reviving_the_workshop_of_the_world_desc:0 "До британського правління Індія була світовим центром промисловості, текстилю та торгівлі. Тепер, з відродженням Імперії, настав час відновити цю спадщину. Модернізуючи наші фабрики та відроджуючи наші торговельні шляхи, ми перетворимо нашу економіку на центр сили, що конкурує з великими націями світу."
 RAJ_revolt_of_the_princes:0 "Повстання князів"
 RAJ_royal_indian_air_force_dlc:0 "Королівські [ROOT.GetAdjective] Повітряні сили"
 RAJ_shaheed_and_swaraj_desc:0 "Жертви наших мучеників надихають невпинне прагнення до Свараджу. Їхня кров підживлює нашу революцію, нагадуючи нам, що незалежність не дарується — її забирають. Нехай їхня пам'ять зміцнить нашу рішучість досягти вільної та суверенної Індії."
 RAJ_south_east_asia_command_desc:0 "У міру зростання напруги зростає попит на централізований командний центр для Південно-Східної Азії. Ми можемо бути ініціаторами такого руху, побудувавши базу операцій, яку ми можемо використовувати для планування наших військових кампаній на континенті."
 RAJ_south_east_asia_command_rename_dm_tt:0 "Перейменовує Національний дух §Y$RAJ_indian_gentlemen_officers_goe$§! на §Y$RAJ_south_east_asia_command_dm$§!."
 RAJ_the_bangalore_torpedo:0 "Бангалорська торпеда"
 RAJ_the_integrity_of_india_act_desc:0 "Щоб протистояти зростаючій загрозі підбурювання до заколоту та зберегти імперську владу, ми запровадимо Акт про цілісність Індії. Це законодавство надає нам повноваження затримувати агітаторів, обмежувати політичне інакомислення та забезпечувати лояльне управління по всьому субконтиненту. Єдність, зрештою, іноді доводиться забезпечувати силою."
 RAJ_the_riches_of_the_raj_desc:0 "Під широкими рівнинами та суворими пагорбами [ROOT.GetNameDef] лежать ресурси, необхідні для живлення імперії у стані війни. Сталь, нафта та інші життєво важливі матеріали будуть видобуті, перероблені та використані для захисту царства."
 RAJ_trade_route_protection_desc:0 "На сході та заході формуються ворожі сили. Нам потрібно бути в змозі діяти як засіб стримування проти будь-кого, хто наважиться захопити товари, що переміщуються у наших водах."
 RAJ_water_privatization_desc:0 "Ми укладемо державно-приватні партнерства з місцевими постачальниками води для підвищення ефективності та якості послуг."
 RAJ_womens_auxiliary_corps:0 "Жіночий допоміжний корпус"
 RAJ_work_with_local_leaders_desc:0 "Співпрацюючи з впливовими провінційними діячами, ми можемо розширити наше охоплення, не перенапружуючи наші ресурси. Ці лідери розуміють потреби своїх регіонів і можуть впроваджувати покращення, які служать як їхньому народові, так і інтересам Корони."
