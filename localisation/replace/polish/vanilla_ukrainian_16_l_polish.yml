 ARMY_LIST_SHIFT_CLICK_RANGE:0 "§GShift + клацніть§!, щоб обрати цю дивізію і всі між ними."
 ARM_neutrality:0 "Вірменські незалежні території"
 ARTILLERY_TITLE_AT:0 "ПРОТИТАНКОВА"
 AST_adela_fascism_ADJ:0 "$AST_ADJ$"
 AST_amphibious_mechanized_equipment_1_short:0 "LVT-2"
 AST_army_inventions_directorate_taog:0 "Управління армійських винаходів"
 AST_australasia:0 "Австралазія"
 AST_broken_hill_propietary_company_desc:0 "Компанія «Broken Hill Proprietary» є одним із провідних виробників корисних копалин і сталі в Австралії. Названа місцевими жителями «Великим Австралійцем», вона домінує в галузі. З різким збільшенням попиту на сировину, компанія має хороші позиції для ще швидшого зростання."
 AST_carrier_1_desc:0 "These three aircraft carriers were converted battlecruisers and were the first fleet carriers of the Royal Navy. Their conversion was the result of the Washington Naval Treaty of 1922 and the work was finished in 1925. They were moderately-armored but well-armed vessels, with long range and good speed, but due to the nature of the conversion their aircraft complement was limited. Nonetheless, they gave the Royal Navy important experience in aircraft carrier construction and fleet air projection."
 AST_commitment_to_the_cause:0 "Відданість справі"
 AST_cv_fighter_equipment_1_short:0 "Sea Gladiator"
 AST_death_from_down_under_taog:0 "Смерть з півдня"
 AST_democratic_party:0 "ОАП"
 AST_diplomatic_events.27.t:0 "Британія відхиляє наш запит"
 AST_diplomatic_events.33.desc:0 "[FROM.GetNameDefCap] не погоджується, що ресурси Індокитаю краще використовувати в австралійських руках, і відмовляється надати нам права на них."
 AST_diplomatic_events.35.desc:0 "[AST.GetNameDefCap] і [JAP.GetNameDefCap] домовилися, на які тихоокеанські території може поширювати свою експансію кожна країна. Сподіваємось, це дозволить запобігти будь-яким потенційним майбутнім конфліктам між нашими двома державами."
 AST_diplomatic_events.4.desc:0 "[AST.GetNameDefCap] давно ставить під сумнів надійність Сінгапурської стратегії; за словами австралійських чиновників, наша здатність прийти їм на допомогу у разі війни на Тихому океані є невизначеною. Передача військово-морської відповідальності в Тихому океані [AST.GetName] зменшила б тягар на британських плечах, але водночас переклала б його на австралійські.\n\nЧи можемо ми бути впевнені, що посилення австралійського контролю забезпечить нашим тихоокеанським підданим і територіям сильніші позиції, ніж якби Сінгапур залишився з нами?"
 AST_diplomatic_events.44.desc:0 "[ENG.GetNameDefCap] мудро погодилася на передачу своїх територій у Південно-Східній Азії нам. У міру розширення австралійських кордонів зростає і наш вплив, і це лише питання часу, коли світ опиниться біля наших ніг."
 AST_diplomatic_events.53.a:0 "Ми вітатимемо їхню підтримку."
 AST_diplomatic_events.55.t:0 "З дозволом або без"
 AST_diplomatic_events.56.t:0 "[AST.GetName] вимагає африканські території"
 AST_diplomatic_events.65.a:0 "Хороший старт для співпраці з нашими [FROM.GetAdjective] товаришами"
 AST_diplomatic_events.67.desc:0 "Представники [FROM.GetLeader] передали його подяку за підтримку наших добровольців та за надані військові матеріали. Багатий [FROM.GetAdjective] досвід громадянської війни, безумовно, означає, що ці ресурси будуть використані ефективно."
 AST_diplomatic_events.69.a:0 "Так і буде."
 AST_diplomatic_events.72.desc:0 "Оскільки у них і так повно клопоту, тихоокеанські острови виявилися невеликою ціною для [USA.GetNameDef], щоб заспокоїти ворожість Австралії. Їхні тихоокеанські острови тепер наші."
 AST_diplomatic_events.75.t:0 "Передача [PHI.GetNameDef]"
 AST_diplomatic_events.78.desc:0 "[AST.GetNameDefCap] ділиться з нами своїми сміливими планами:\n\n'Тінь [USA.GetNameDefCap] нависла над нами, загрожуючи втрутитися щоразу, коли наші дії не збігаються з її інтересами. З глобальною державою такого масштабу, яка втручається у справи Австралії та Японії, Східна Азія ніколи не належатиме нам по-справжньому. Тому [AST.GetName] вступить у війну.'\n\nПрем'єр-міністр [AST.GetLeader] чітко висловлює свої наміри: [AST.GetName] збирається кинути виклик [USA.GetNameDef], і просить нашої допомоги у випадку, якщо американці виявляться занадто могутніми, щоб подолати їх наодинці."
 AST_goods_standard_desc:0 "Основним принципом економічної теорії Джека Ланга є скасування Золотого стандарту в Австралії та заміна його Товарним стандартом, який прив'язує грошову масу до фактичної кількості вироблених товарів. Це гарантує, що рух капіталу прив'язаний безпосередньо до внутрішньої продуктивності, а не до зовнішніх факторів."
 AST_heavy_tank_aa_equipment_1_short:0 "Matilda II AA"
 AST_homeland_defense_tt:0 "Зміцнить оборону Бтьківщини за допомогою §Yукріплень на суші та узбережжі§!, щоби захистити ймовірні місця висадки та порти."
 AST_labor_campaign_tour_mission:0 "Передвиборчий тур лейбористів"
 AST_land_development_desc:0 "В обмін на те, що [ROOT.GetFascistParty] проводитиме вигідну для них політику, провідні діячі бізнесу погодилися інвестувати в галузеві реформи, які узгоджуються з цілями партії.\n\nЗанадто багато територій [ROOT.GetName] залишаються неіндустріалізованими та нерозвиненими. Розвиваючи ці регіони, ми зробимо їх придатними для будівництва."
 AST_lang_is_right_desc:0 "Що ж, виявляється, що Ланг мав рацію! Відмовляючись ставити в пріоритет іноземних кредиторів і замість цього агресивніше використовуючи нашу власну банківську систему, ми можемо вивільнити значні кошти. Потім їх можна спрямувати у внутрішню економіку, забезпечуючи такі необхідні інвестиції та стимулюючи зростання."
 AST_light_tank_aa_equipment_2_short:0 "M3 Light AA"
 AST_light_tank_destroyer_equipment_2:0 "M3 Light Tank Destroyer"
 AST_malaya_communist_foothold_raid:0 "Забезпечити комуністичний плацдарм у Малайї"
 AST_malaya_foothold_raid_unlock_tt:0 "Розблоковує рейд §YЗабезпечити комуністичний плацдарм у Малайї§! проти регіонів під контролем малайського уряду."
 AST_mechanized_equipment_1_short:0 "Bren Carrier"
 AST_mechanized_equipment_3_short:0 "Kangaroo Carrier"
 AST_medium_tank_destroyer_equipment_1:0 "M3 Grant Tank Destroyer"
 AST_mio_trait_commonwealth_procurement_office:0 "Бюро закупівель Співдружності"
 AST_overseas_loyalties_desc:0 "Ми продовжуватимемо робити свій внесок у війни за кордоном, знову доводячи, що жодна територія не є чужою для австралійських солдатів. Війни не трапляються з нами — ми трапляємося з ними."
 AST_public_institutions:0 "Державні установи"
 AST_ratify_westminster_adoption_act:0 "Ратифікувати Вестмінстерський статут"
 AST_rats_of_tobruk:0 "Щури Тобрука"
 AST_reestablish_central_flying_school_desc:0 "Ще одна австралійська льотна школа, що працює паралельно з 1-ю льотною тренувальною школою, Центральна льотна школа допоможе задовольнити зростаючі потреби сучасних військово-повітряних сил. В умовах зростання напруженості ми маємо забезпечити наш персонал необхідним обладнанням."
 AST_refuse_british_wars:0 "Відмовитися від британських війн"
 AST_research_collaboration:0 "Наукове співробітництво"
 AST_research_cooperation:0 "Наукова співпраця"
 AST_rocket_artillery_equipment_1_short:0 "RP-3 HE/GP"
 AST_ruling_party_alp:0 "$AST_ruling_party$ $AST_alp$"
 AST_seven_million_britishers_reinforcements_tt:0 "\n§YЯкщо $AST_reinforcements$ не завершено§!:"
 AST_solidarity_by_the_empire_desc:0 "До цього часу Британська імперія вела нас через війни та мир. Ми продовжуватимемо цінувати її поради та співпрацювати у підготовці до потенційних конфліктів."
 AST_stephensen:0 "П. Р. Стівенсен"
 AST_summon_the_cabinet_mission_desc:0 "Скликати дипломатів, чиновників і теоретиків до Канберри; перспектива вторгнення повинна бути обговорена."
 AST_tac_bomber_equipment_0:0 "Westland Wapiti"
 AST_the_gathering_storm_desc:0 "На горизонті збирається шторм. Наша зростаюча повітряна міць несе дедалі більший тиск зверху, б'ючи туди, де ворог найслабший, і підтримуючи наш наступ. Те, що починається як далекий гуркіт, незабаром перетвориться на невпинну бурю руйнувань."
 AST_the_pacific_pact:0 "Тихоокеанський пакт"
 AST_the_swpa_menace_desc:0 "Японія створює імперію, що загрожує безпеці Австралії та свободі в регіоні. Ми мусимо знайти союзників серед країн, які розділяють наші побоювання."
 AST_uap_increase_votes_daily_impact:0 "\n Через зміни в §YУАП§!: §R[?AST_uap_votes_daily_impact_var|2R]%§!"
 AST_union_control_events.5.desc:0 "Операція закінчилася катастрофою. Наші війська так і не дісталися берега. Вони були відкинуті лоялістськими патрулями, загубилися в протоках або були захоплені до того, як змогли закріпитися на позиціях. Деталі неясні, але результат очевидний. Гірше того, до преси дійшли чутки про цю справу. Тепер у парламенті лунають питання про те, що саме робили наші сили в тих водах. Реакцією громадськості стали шок і збентеження. Які б здобутки ми не сподівалися забезпечити для революції, нам доведеться шукати інший шлях."
 AST_union_control_progressbar_pip_3:0 "Доступна громадянська війна"
 AST_union_strike_desc:0 "Наші робітники залишили свої робочі місця, вимагаючи кращих умов та прав. Це неодмінно чинитиме тиск на уряд, щоб запровадити нові реформи."
 AST_western_australian_government_railways:0 "Західноавстралійські урядові залізниці"
 AST_z_special_unit:0 "Спецзагін Z"
 AST_z_special_unit_desc:0 "Спецзагін Z стане нашим загоном командос, головним завданням яких будуть розвідка та диверсії у ворожому тилу. Нам будуть потрібні відважні бійці, готові пройти неймовірно складний курс підготовки."
 ASY_communism_party:0 "АСП"
 ASY_neo_assyrian_empire_democratic_ADJ:0 "Новоассирійськ"
 AUS_VICTORY_POINTS_3581:0 "Еперіес"
 AUS_VICTORY_POINTS_665:0 "Марбург"
 AUS_an_improved_german_state:0 "Краща німецька держава"
 AUS_autobahn_west:0 "Розширити автобани на захід"
 AUS_banned_dnsap:0 "Заборонена НСРП"
 AUS_bring_hungary_back_into_the_fold:0 "Повернути Угорщину в наше лоно"
 AUS_bring_phonix_insurance_from_the_ashes_desc:0 "Наша економіка йшла на поправку, доки на початку 1936 року нас не вразив скандал із Phönix. Їхнє страхування учасників війни забезпечувало нам людей, яких можна було набирати в армію, і підтримувало націю задоволеною навіть перед обличчям війни. Було б розумно відродити Phönix, подібно фенікса з попелу."
 AUS_british_monarch:0 "Лідер походить з давньої лінії британських монархів"
 AUS_central_european_alliance:0 "Центральноєвропейський альянс"
 AUS_centralize_the_industrial_sector:0 "Централізація промислового сектору"
 AUS_danubian_federation:0 "Дунайська федерація"
 AUS_demand_liberation_of_workers_desc:0 "Настав час діяти. Зміцнюючи дух комунізму вздовж Дунаю, ми повинні тепер визволити тих, хто опинився з нами в згоді!"
 AUS_economic_resuscitation:0 "Реанімація економіки"
 AUS_industrial_help:0 "Промислова підтримка"
 AUS_integrating_german_cores_decision:0 "[FROM.GetName] у новому домі"
 AUS_medium_specialization_bonus:0 "Ініціатива Schlachtfliegerkompanie"
 AUS_news_events.3.a:0 "Він добре служив нам, спочивай з миром..."
 AUS_osterreichische_fallschirmsjager_desc:0 "Відновивши нашу армію та повітряні сили, настав час зрозуміти, як найкращим чином ми можемо поєднати два види озброєних сил для загального блага."
 AUS_political_events.104.desc:0 "Сьогодні вранці відбулася дуже незвичайна зустріч. Наше керівництво зіткнулося віч-на-віч з незнайомою людиною, яку, ми не могли позбутися відчуття, що бачили раніше, навіть його голос і акцент був такий знайомий... Цей чоловік стверджує, що він — художник-початківець, він прибув до нас із Німеччини і бажає нам допомогти. Також він заявляє, що є вмілим лідером, якого наша країна зараз гостро потребує.\n\nНаші прикордонники заперечують, що хтось із таким іменем перетинав кордон, єдине, що можна знайти щось схоже в списках: Елізабет Гідлер."
 AUS_political_events.110.a:0 "Напруга зростає."
 AUS_political_events.117.a:0 "Не важливо..."
 AUS_political_events.121.desc:0 "Незважаючи на наші повністю законні претензії на території, якими зараз володіє [FROM.GetAdjective]ий уряд, [FROM.GetLeader] вирішив вчепитися за контроль над запитаними територіями. Це, звичайно, засмучує, однак ми маємо повернути ці землі. Незважаючи ні-на-що."
 AUS_political_events.15.desc:0 "Щойно до нас дійшла інформація, що [FROM.GetAdjective]ий уряд остаточно заборонив лояльну нам НСРП. М’яка заборона вже діяла з 1934 року, хоча здебільшого ігнорувалась як політичними партіями, так і урядом. Це означає зміну тону [FROM.GetAdjective]ого керівництва щодо нас. \n\nКрім очевидної образи, це також може перешкодити нашому впливу на них."
 AUS_political_events.23.t:0 "[FROM.GetNameDefCap] умовно надає гарантію"
 AUS_political_events.34.t:0 "[FROM.GetNameDefCap] відмовляється компенсувати нам витрати"
 AUS_political_events.36.a:0 "У свій час ми будемо відомі як [GetGrossosterreichCosmeticIdeology]"
 AUS_political_events.37.t:0 "Ультиматум від [FROM.GetNameDef]"
 AUS_political_events.61.t:0 "[FROM.GetNameDefCap] заміняє Альфреда Янсу"
 AUS_political_events.78.a:0 "Авжеж, усім, чим зможемо!"
 AUS_political_events.83.desc:0 "Наше рішення більш узгодити політичну ідеологію, зробити її більш ідентичною до тої, якої дотримується [FROM.GetLeader], дає свої плоди. [FROM.GetNameDefCap] озвучив, що вони оцінюють цей крок як крок у правильному напрямку та сподіваються бачити в нас союзників у майбутньому."
 AUS_political_events.89.desc:0 "Незважаючи на чіткі ознаки, чого насправді хоче їхній народ, [FROM.GetAdjective]ий уряд та їхній лідер, [FROM.GetLeader], вчепилися у владу й не збираються формувати новий відповідний уряд. Мм повинні переглянути можливі варіанти і зробити те, що потрібно. Для добробуту людей."
 AUS_political_events.97.a:0 "У нас не було вибору."
 AUS_political_events.99.desc:0 "[GetRejectionAmounts]"
 AUS_raid_military_storages_desc:0 "По всій країні на старих складах лежить багато військової техніки. Нехай вона застаріла, з нашою поточною ситуацією ми віримо, що ліпше ними будуть озброєні наші люди, ніж лежать без діла. Настав час якнайкраще використати ці ресурси."
 AUS_rebuild_the_armada:0 "Відбудова Армади"
 AUS_saved_bankverein_flag:0 "Пріоритет фінансування задано в бік Wiener Bankverein"
 AUS_schutzbund_support:0 "Заручитися підтримкою Шуцбунду"
 AUS_sent_industrial_help_flag:0 "Вже підтримали промисловість [FROM.GetNameDef]"
 AUS_stalinism:0 "Австрійська радянська республіка"
 AUS_state_garrison:0 "Гарнізони в області [FROM.GetName]"
 AUS_the_danubian_federation_category:0 "Дунайська федерація"
 AUS_the_right_to_rearm:0 "Право на переозброєння"
 AUS_war_against_guarantors_desc:0 "Тексти мерзенного Сен-Жерменського договіру були чіткими: якщо нам потрібна буде допомога, щоб захистити нашу незалежність, нам це нададуть. Як виявилось, порожні слова, щоб утримати нас. Тепер, коли ми поступово повертаємося до своєї величі, настав час солодкої помсти. Ми навчимо їх більше ніколи не тягати за носа славетну Австрію!"
 AUS_womens_education_initiative_desc:0 "З початку 1900-х років жінкам було дозволено здобувати освіту в університетах, але лише на окремих факультетах. Прагнення до того, щоб університети були відкритими для всіх, окрім відповідності нашій ідеологічній доктрині, принесе багато користі в майбутньому."
 AZR_neutrality_DEF:0 "Ісламська республіка Азербайджан"
 BAH_autonomy_collaboration_government_DEF:0 "$OVERLORDADJ$і $NONIDEOLOGY$"
 BALTIC_arm_the_nation:0 "Озброїти націю"
 BALTIC_crossley_motors:0 "«Crossley Motors» — [Root.Capital.GetName]"
 BALTIC_entente_events.1.t:0 "[From.GetNonIdeologyName] інвестує в Балтійську Антанту"
 BALTIC_events.19.extra:0 "Крім того, нам передали контроль над окупованими [BALTIC_loose_territory_country.GetNonIdeologyAdjective]ими територіями. Нам потрібно й надалі доводити, що ми гідні стати постійними наглядачами держави [BALTIC_loose_territory_country.GetNonIdeologyName]."
 BALTIC_events.503.a:0 "Ми скоро про це подбаємо."
 BALTIC_focus_on_the_interior:0 "Зосередитися на внутрішніх справах"
 BALTIC_reached_out:0 "Дипломатична пропозиція"
 BALTIC_sieze_the_means_of_production_desc:0 "Старий уряд запрошував зарубіжних інвесторів експлуатувати плоди праці [Root.GetAdjective] народу. Ми не можемо і надалі допускати, щоб руки пролетаріату працювали на благо іноземної буржуазії, і всі заводи, побудовані цими багатонаціональними копрораціями, треба передати під контроль держави [Root.GetNameDef]."
 BALT_belarus_claims_tooltip:0 "Поточні §Yбалтійські претензії§! — §Y[?BALTIC_claims]§!"
 BALT_current_claims_tt:0 "[Root.GetBelarusClaimStrength]"
 BAR_fascism_party:0 "БІР"
 BASE_CONTRIBUTION:0 "\nБазова величина: $VALUE|H%$\n"
 BAY_VICTORY_POINTS_11666:0 "Веан"
 BBA_SWI_annual_election.2.desc:0 "Після безпрецедентного усунення [?SWI_ousted_president.GetName] і періоду політичної нестабільності у Федеральній Раді, настав час обрати нового Президента Конфедерації. Сподіваймося, що він зможе виправити курс [SWI.GetNameDef] і що він не стане останнім, хто обійме цю посаду."
 BBA_african_union_events.10.t:0 "[FROM.GetNameDefCap] просуває Організацію Африканської Єдності"
 BBA_african_union_events.14.b:0 "Це обурливо!"
 BBA_ethiopia_anti_colonialism_events.4.b:0 "Тоді нам доведеться примусити їх."
 BBA_ethiopia_balance_of_power_events.01.desc_fascism:0 "Зростаюча децентралізація держави [THIS.GetName] в поєднанні з відсутністю широкої підтримки керівної влади та загальною нестабільністю в регіоні вилилась у відкрите повстання проти центрального уряду. Прихильники $haile_selassie_gugsa$ взялися за зброю з наміром посадити його на [THIS.GetAdjective]ий трон."
 BBA_ethiopia_balance_of_power_events.10.a:0 "Нічого не поробиш, напевно..."
 BBA_ethiopia_communist_events.04.a:0 "Разом ми здолаємо фашизм в Африці."
 BBA_ethiopia_communist_events.07.desc:0 "[SOV.GetNameDefCap] вимагає припинити бойові дії між нами та [ETH.GetAdjective]ою державою. [SOV.GetAdjectiveCap]і політики активно підтримують комуністичний режим у [ETH.Capital.GetCapitalVictoryPointName] і тепер вважають його частиною своєї сфери впливу. Вони навіть погрожують вступити у війну. Ми ризикуємо втратити авторитет удома, якщо підкоримося, але ризикуємо більш широким конфліктом, якщо відмовимося."
 BBA_ethiopia_communist_events.16.desc:0 "Наші так звані друзі в [SOV.Capital.GetCapitalVictoryPointName] відмовилися надіслати військових радників для підтримки нашої модернізації. Попри цю невдачу, ми переможемо фашистів і самі оновимо армію."
 BBA_ethiopia_communist_events.24.t:0 "[SOV.GetNameDefCap] бере під контроль зовнішню політику"
 BBA_ethiopia_communist_events.32.t:0 "[ITA.GetNameDefCap] відмовляється від пропозиції перемир’я"
 BBA_ethiopia_communist_events.39.t:0 "Риф звільнено"
 BBA_ethiopia_communist_events.40.t:0 "[ETH.GetNameDefCap] просить припинити бойові дії"
 BBA_ethiopia_exile_events.02.a:0 "Ми маємо бути насторожі."
 BBA_ethiopia_exile_events.11.desc:0 "[FROM.GetAdjective]а держава погодилася передати нам контроль над усіма сомалійськими землями. Це означає, що [ROOT.GetName], швидше за все, контролюватиме більшу частину Африканського Рогу після закінчення війни."
 BBA_ethiopia_exile_events.20.t:0 "[ROOT.GetAdjective]ий лінкор"
 BBA_ethiopia_exile_events.21.desc:0 "Незважаючи на обіцянки [FROM.GetLeader] [ROOT.GetLeader] кораблів, стан [FROM.GetAdjective]ого флоту такий, що [FROM.GetName] наразі не може розлучитися з жодним кораблем. Щоб якось компенсувати це, [FROM.GetAdjective]е адміралтейство дозволило державі [ROOT.GetName] вивчати [FROM.GetAdjective]і проєкти кораблів та методи їх виробництва, щоби передати знання з кораблебудування [ROOT.GetName]."
 BBA_ethiopia_exile_events.24.t:0 "Оперативна база для Ефіопії"
 BBA_ethiopia_exile_events.42.t:0 "[FROM.GetLeader] хоче більше"
 BBA_ethiopia_exile_events.46.a:0 "Ми покладали на це набагато більші надії"
 BBA_ethiopia_fascist_events.20.t:0 "[FROM.GetNameDefCap] проголошує незалежність"
 BBA_ethiopia_fascist_events.57.t:0 "[FROM.GetName] просить про угоду з аутсорсингу озброєнь"
 BBA_ethiopia_fascist_events.59.desc:0 "Наші жалюгідні дипломати не змогли переконати [ITA.GetLeader] у необхідності нашої угоди з аутсорсингу озброєнь. Це нищівний удар для нашого військового та промислового розвитку."
 BBA_ethiopia_fascist_events.61.t:0 "[FROM.GetName] просить зброю для повстання проти [ITA.GetAdjective] влади"
 BBA_ethiopia_fascist_events.63.desc:0 "[FROM.GetAdjective] дипломати проігнорували наші спроби отримати таємні поставки зброї. Схоже, вони не впевнені в нашій надійності, поки ми все ще під впливом [ITA.GetAdjective]. Вони також можуть побоюватися розлютити режим [ITA.GetAdjective] у ці неспокійні часи."
 BBA_ethiopia_imperial_events.11.t:0 "[FROM.GetNameDefCap] відхиляє ультиматум"
 BBA_ethiopia_imperial_events.4.t:0 "[FROM.GetNameDefCap] просить область [689.GetName]"
 BBA_ethiopia_imperial_events.6.t:0 "[FROM.GetNameDefCap] відмовляється передавати область [689.GetName]"
 BBA_italo_ethiopian_war_events.13.desc:0 "Після прийняття резолюції в Лізі Націй [FROM.GetLeader] публічно оголошує, що [ITA.GetAdjective]е судноплавство крізь Суецький канал більше не дозволяється. Будь-які [ITA.GetAdjective]і кораблі, що намагатимуться пройти через канал, будуть захоплені, а їхній вантаж конфіскований, поки [ITA.GetName] не припинить свою агресію проти держави [ETH.GetNameDef]."
 BBA_italo_ethiopian_war_events.304.a:0 "Боягузи всі вони!"
 BBA_italo_ethiopian_war_events.304.desc:0 "Ситуація в [ETH.GetName] жахлива, бойовий дух солдатів продовжує падати! Армія загрузла в кількох місцях і стикається з масовим дезертирством, що зменшує чисельність нашить військ навіть без допомоги [ETH.GetAdjective]их вояк! У нас навіть є повідомлення про те, що офіцера збила вантажівка. Ми кваліфікували це як нещасний випадок."
 BBA_italy_anti_colonialism_events.05.a:0 "Ми з радістю підкоримося."
 BBA_italy_anti_colonialism_events.09.c:0 "Такі зарозумілі європейці!"
 BBA_italy_anti_colonialism_events.103.desc:0 "Очевидно, що [FROM.GetAdjective]им народом править нерозумний і егоїстичний лідер. [FROM.GetLeader] відмовляється побачити розум і об'єднати з нами зусилля, що зміцнило б обидві країни та забезпечило б вічний мир між нашими народами."
 BBA_italy_anti_colonialism_events.60.t:0 "Південна Африка голосує за вступ до держави [ROOT.GetNameDef]"
 BBA_italy_bop.2.t:0 "Падіння [?ITA.ITA_lost_colony.GetName]"
 BBA_italy_civil_war.101.a:0 "Avanti!"
 BBA_italy_civil_war.101.desc:0 "Мудрий лідер держави [FROM.GetName], [FROM.GetLeader], великодушно повернув нам контроль над італійською територією! Це не лише значно підніме бойовий дух військ, але й посилить наші можливості та зміцнить наші зусилля для звільнення всієї Італії."
 BBA_italy_civil_war.2.t:0 "$ITA_fronte_militare_clandestino$"
 BBA_italy_civil_war.300.desc:0 "Наші зусилля за об'єднання [FROM.Adjective]ого народу проти фашизму досягли свого апогею! Ми більше не можемо сидіти склавши руки та спостерігати, як наша прекрасна країна стікає кров'ю. З нашою зібраною силою у нас тепер є засоби, щоб раз і назавжди повалити фашистський режим і звільнити всю Італію від його тиранії!"
 BBA_italy_colonial_management.1.desc:0 "Наші колоніальні володіння значно зросли з часу формування нашої нації, менш ніж століття тому. Однак це зростання почало створювати навантаження на наші людські ресурси. Існують способи пом'якшити ці обмеження, використовуючи місцеві поліційні сили, такі як мехаристи, саварі, спагі та інші. Вербування цих груп було б менш обтяжливим для наших власних сил, і вони мають перевагу в тому, що є уродженцями своїх земель, з усіма наслідками, які з цього випливають."
 BBA_italy_communist_events.01.desc:0 "Коли наша молода республіка звільнена з лап фашистів, ми можемо нарешті визначити новий курс для нашої країни! Зараз нам потрібен твердий лідер, настільки ж мудрий, наскільки й відданий нашій справі. Той, хто зможе провести нас через тривожні часи, які нас чекають, і не похитнеться у своїй вірі у світле майбутнє."
 BBA_italy_interaction_events.13.t:0 "[FROM.GetName] відмовляється передати Чорногорію"
 BBA_italy_interaction_events.15.t:0 "[FROM.GetName] виконує наші вимоги"
 BBA_italy_interaction_events.2.desc:0 "Президент держави [SWI.GetNameDef] сьогодні оголосив про кінець епохи для країни. Вони передадуть нам італійську область [846.GetName] і відмовляться від своїх претензій на будь-які італомовні міста в регіоні. Сьогоднішній день знаменує собою зменшення розміру та багатоетнічної цінності держави [SWI.GetName], оскільки згодом вони також скасували італійську мову як офіційну."
 BBA_italy_interaction_events.3.t:0 "[SWI.GetNameDef] залишається непокірним!"
 BBA_italy_interaction_events.33.desc_continued_negotiation:0 "Італійці повернулися до нас з черговою вимогою. Тепер вони хочуть отримати у власність острів [906.GetName]. Вони стверджують, що так вони зможуть легше регулювати потоки товарів, що імпортуються та експортуються в італійській Східній Африці, і контролювати один з входів до Червоного моря, так само як ми контролюємо інший. Якщо ми віддамо його їм, вони заявляють, що тимчасово платитимуть нам за наші зусилля."
 BBA_italy_interaction_events.37.desc:0 "Протягом останніх кількох тижнів наші дипломати наполегливо працювали у Франції та Британії, щоб закріпити територіальні здобутки Італії в найближчому майбутньому. Наразі переговори завершені, документи підписані."
 BBA_italy_interaction_events.666.b:0 "Старий може горіти в пеклі!"
 BBA_italy_interaction_events.70.t:0 "Очікування відповідей"
 BBA_italy_interaction_events.9.t:0 "[FROM.GetName] приймає наші вимоги"
 BBA_italy_interaction_events_news.2.desc:0 "Британський уряд сьогодні оголосив, що підтримає незалежність Австрії та буде разом з Італією протистояти будь-яким загрозам суверенітету країни."
 BBA_italy_local_rulers.1.d:0 "Ніяких переговорів з місцевими правителями не буде."
 BBA_italy_missiolinis.02_north.c:0 "Разюча невдача!"
 BBA_italy_missiolinis.63.t:0 "Успішне збільшення запасів пального"
 BBA_italy_missiolinis.72.a:0 "Прикро."
 BBA_italy_missiolinis.91.desc:0 "Дуче схилили до виокремлення додаткових ресурсів на нашу службу розвідки, пообіцявши, що вона стане одною з найдосконаліших у світі. Це у свою чергу призвело до того, що він став відкрито вихвалятися тим, як наші агенти проникли в кожен аспект італійського суспільства, щоби вивести комуністів, злочинців та інших шкідливих елементів на очі та притягти до справедливості, роблячи Італію безпечнішою."
 BBA_italy_naval_cooperation_programs.04.desc:0 "[FROM.GetNameDefCap] пропонує нам взяти участь у спільних морських навчаннях, кажучи, що тільки готуючись до війни, ми будемо готові зустріти наших ворогів, якщо вони прийдуть."
 BBA_italy_naval_cooperation_programs.05.t:0 "[ROOT.GetAdjective]о-[FROM.GetAdjective]і маневри тривають"
 BBA_italy_naval_cooperation_programs.12.a:0 "Arriverderci!"
