 germany.90.d:0 "Радянський Союз відхилив нашу пропозицію. Якщо нам знадобляться ресурси держави [SOV.GetNameDef], нам доведеться взяти їх силою!"
 germany.999.desc:0 "Після приголомшливої перемоги німецької армії настав час знищити останні пам'ятки більшовицького панування в Європі. Імена Леніна та Сталіна досі ганьблять два великих міста нового німецького Лебенсрауму — це глузування над солдатами, що віддали свої життя для захоплення цих міст.\n\n«Товариство ветеранів Великої війни» надіслало урядові пропозицію для виправлення цього непорозуміння."
