 POL_a_leftist_sejm:0 "Лівий Сейм"
 POL_anti_imperialism_desc:0 "Протистояння імперіалістичній війні є похвальним принципом, але недостатньо просто засудити імперіалістичну війну, світова революція вимагає протистояння самому імперіалізму!"
 POL_assert_eastern_claims_desc:0 "Польща в її поточному стані — це тінь імперії, якою вона колись була. Польща — це не просто місце, де живуть поляки, Польща — це спадщина Речі Посполитої, і ми повинні відновити старі кордони на Сході."
 POL_austro_hungarian_alliance_desc:0 "Хоча Австро-Угорщина колись втягнула польський народ у свою імперію, зараз вони стоять під прицілом німців, так само, як і ми. Співпраця здається їм майже неминучою, але, можливо, якщо ми запропонуємо їм інший варіант, вони уникнуть імпульсу віддати ключі від свого королівства лідеру [GER.GetLeader]."
 POL_beck_ribbentrop:0 "Пакт Бека–Ріббентропа"
 POL_demand_LIT_pavel_desc:0 "Минулого разу бермонтам не вдалося анексувати Литву, але тепер, маючи за спиною польську армію, Павло має таку силу, що цілком може залякати литовців, щоб вони здалися на срібній тарілочці. Король не принижується і не благає про своє королівство, він бере його як своє право."
 POL_department_for_home_defence_desc:0 "Польщі вже давно не вистачало внутрішньої оборони, необхідної для захисту від ворогів по обидва боки наших кордонів. Створивши Відділ оборони вітчизни, ми опануємо методи ведення війни, необхідні для захисту нашої держави."
 POL_develop_gdansk_ship_building:0 "Розвинути кораблебудування у Гданську"
 POL_german_training_desc:0 "Наші «партнери»-німці тримають свої військові таємниці досить близько при собі, але, можливо, запросивши їх до управління деякими нашими внутрішніми військовими справами, їм не залишиться іншого вибору, окрім як злити нам деякі військові секрети."
 POL_go_right_desc:0 "Сила — це єдина якість, до якої варто прагнути. Наші сусіди зрозуміли цю істину, і ми повинні це зробити."
 POL_governorate_livonia_desc:0 "Коли Павло вторгся в Литву і Латвію багато років тому, він мав можливість повернути собі Лівонську губернію як свою особисту вотчину. Тепер, коли Латвія ослаблена, а за спиною Павла стоїть могутня Польща, мало що може завадити відновленню Ліфляндської губернії."
 POL_gw_tank_equipment:0 "Renault FT"
 POL_heavy_tank_equipment_2:0 "32TP"
 POL_integrate_gdansk_industries:0 "Інтегрувати промисловість у Гданську"
 POL_interacting_with_peasants_flag:0 "Рішення «Селянський страйк» активне"
 POL_invite_greece:0 "Запросити Грецію"
 POL_invite_romania_to_morges:0 "Запросити Румунію в Пакт"
 POL_light_tank_equipment_2_short:0 "7TP"
 POL_lithuanian_alliance_desc:0 "Ми помирилися з нашими колишніми ворогами на півночі, але тепер ми повинні навчитися рухатися вперед разом, як друзі. Наші вороги і союзники спільні, тому цілком природно, що литовці приєдналися до тих же сил, що і ми."
 POL_local_eastern_plans:0 "Місцеві східні плани"
 POL_mechanized_equipment_2_short:0 "C2P"
 POL_merge_the_arms_industries:0 "Об'єднати збройову промисловість"
 POL_pacify_zamosc:0 "Утихомирити Замостя"
 POL_pan_slavic_revanchism:0 "Панслов'янський реваншизм"
 POL_peasant_strike_category_desc:0 ""
 POL_plan_east_desc:0 "Ми входили і виходили з військових конфліктів з росіянами протягом століть і можемо сміливо припустити, що [SOV.GetLeader], як і [SOV.GetLeader.GetHerHis] попередники, спробує здійснити вторгнення в Польщу. Цього разу вони не повинні досягти успіху. Необхідно розробити плани для забезпечення рішучої перемоги Польщі наддержавою [SOV.GetNameDef]!"
 POL_polish_militarism_desc:0 "Минулі війни, можливо, принизили нас, але ми не переможені. Ми піднімемося знову, завдяки хоробрості наших солдатів і хитрості наших офіцерів."
 POL_protect_yugoslavia:0 "Захистити Югославію"
 POL_restoration_of_the_royal_sejm:0 "Відновлення Королівського сейму"
 POL_restore_the_diet_of_galicia_desc:0 "Сейм Галичини і Володимирії представляв правління Габсбургів над Польщею, і тепер, коли Габсбург сидить на нашому троні, видається правильним, щоб сейм був відновлений як Сейм Польщі."
 POL_san_left_desc:0 "Ліві санаціоністи — прихильники реформ — вважають, що Валерій Славек є справжнім спадкоємцем попереднього диктатора, Юзефа Пілсудського."
 POL_ship_light_battery_2:0 "120mm/50 Bofors M34/36"
 POL_sp_nuclear_bomb:0 "Проєкт «Polonium»"
 POL_support_monarchy_in_CZE_tt:0 "Відкриває доступ до рішень §YНаша претензія на Чехословаччину§!."
 POL_the_between_the_seas_concept:0 "Концепція «Між морями»"
 POL_the_bombe_no_mtg_desc:0 "$POL_the_bombe_desc$"
 POL_the_north_sea:0 "Північне море"
 POL_unite_west_slavia:0 "Об'єднатися з Богемією"
 POL_warsaw_to_crimea_railway_desc:0 "У нашому прагненні панувати від моря до моря життєво важливо, щоб кожна територія, яку ми захопимо, стала повністю інтегрованою частиною нашої нації. Наші природні кордони простягаються з півночі на південь, зі сходу на захід, і це прагнення з'єднати Крим нашою залізницею зміцнить наші позиції в регіоні."
 POR_Iberian_Summit_Receiver_Spain:0 "Іспан"
 POR_arms_trade:0 "Торгівля зброєю"
 POR_assist_the_requetes:0 "Допомогти рекете"
 POR_destroyer_1:0 "Клас «Douro»"
 POR_election_opinion_democratic:0 "Демократична думка"
 POR_empire_neutrality:0 "П'ята Португальська імперія"
 POR_field_maneuvers:0 "Польові маневри"
 POR_fuzileiros_desc:0 "Добре підготовлені морські сили є фундаментальними для безпеки наших заморських володінь."
 POR_generic_infantry_equipment_organization:0 "$POR_fabrica_material_guerra_organization$"
 POR_heavy_tank_equipment_3:0 "Tanque Pesado III"
 POR_iberian_summit_desc:0 "Піренейські країни повинні працювати разом, якщо ми хочемо перемогти, незважаючи ні на що. Ми повинні закликати [GetIberianSummitReceiverName]ію обговорити, яку сторону конфлікту ми повинні підтримати в ці непевні часи."
 POR_industrial_modernization_desc:0 "Більшість нашої цивільної промисловості все ще застаріла. Він може стати набагато ефективнішим, якщо ми витратимо час і ресурси на його оновлення."
 POR_light_tank_equipment_3_short:0 "CDC-5"
 POR_medium_tank_destroyer_equipment_2:0 "Destruidor de Tanques 4"
 POR_modern_tank_equipment_1:0 "Carro de Combate 8"
 POR_monarchist_uprising_in_brazil:0 "Монархістське повстання в Бразилії"
 POR_our_comrades_overseas_tt:0 "Будь-яка незалежна §Yкомуністична§! нація в Латинській Америці отримає подію §YПортугалія запрошує нас до Блоку Народного фронту§!."
 POR_potential_civil_war_high_requirement_tt:0 "§RЯкщо §Yстабільність§! буде нижча ніж §Y60%§! на момент завершення цього фокусу, в країні почнеться громадянська війна!§!"
 POR_recover_the_east_indies_desc:0 "Ми мусимо вимогти те, що належить нам по праву. Ост-Індія знову буде під контролем Португалії."
 POR_research_collaboration_desc:0 "Наші товариші в Радянському Союзі мають амбіційну, добре фінансовану програму досліджень і розробок. Угода поділитися з нами своїми технологічними досягненнями буде взаємовигідною в нашій пролетарській війні."
 POR_strengthen_the_regime_desc:0 "Є ще багато дисидентів, які плетуть змови проти режиму. Ми зміцнимо таємну поліцію, забезпечивши її засобами для викорінення підривних організацій."
 POR_the_eastern_menace_desc:0 "Успіх держави [JAP.GetName] в Китаї та Південно-Східній Азії головним чином був зумовлений поганим станом ворожих військ, з якими вони зіткнулися. Ми повинні запобігти тому, щоб це сталося на наших східних територіях. Ми зміцнимо наші колонії та завдамо першого удару до того, як це зробить [JAP.GetAdjective]а армія."
 POR_the_fifth_empire_desc:0 "П'ята імперія представляє остаточне злиття інтелектуальних і духовних знань, Віри й Імперії. Тільки португальська нація може прокласти шлях до цієї реальності, об'єднавши весь світ не лише територією, але й духом і культурою."
 POR_the_popular_front_bloc:0 "Блок Народного фронту"
 PRC_CAS_equipment_1_short:0 "Q-1"
 PRC_appeal_for_foreign_aid_bt7_all_tanks_tt:0 "Отримати §Y350§! [SOV.GetAdjective]их §Yлегких танків БТ-7§!"
 PRC_asian_democratic_union_desc:0 "Щоб сприяти рівності, ми повинні співпрацювати з нашіми азійськими партнерами, аби гарантувати їм сильну переговорну позицію на світовій арені."
 PRC_bop_right_side:0 "The 28½ Bolsheviks"
 PRC_bring_war_to_neighboring_warlords:0 "Принести війну сусіднім мілітаристам"
 PRC_cmc_military_industry_bureau_organization:0 "Бюро військової промисловості Центральної військової ради"
 PRC_factory_617_organization:0 "Завод Nº 617"
 PRC_first_automative_works_organization:0 "Перший автомобільний завод"
 PRC_heavy_tank_aa_equipment_2_short:0 "PGZ 41 D"
 PRC_internationalism_desc:0 "Робітники та селяни всього світу мають об'єднатися, щоби скинути свої пута. Згуртувавши ряди, ми побудуємо світле майбутнє."
 PRC_mobilization_of_the_people_tt:0 "Створити §Y4 китайські§! підрозділи ополчення"
 PRC_modern_tank_destroyer_equipment_1:0 "PTZ 59"
 PRC_naval_capstone:0 "Сучасний флот"
 PRC_promote_regular_army:0 "Розвивати регулярну армію"
 PRC_propaganda_efforts_1_tt:0 "Отримуйте §G[?PRC_gain_faction_inluence_number|%]§! §Yвпливу на фракцію§! за кожне рішення §Y«Партизанська війна»§! та §Yінфільтрацію§! в [CHI.GetAdjective]і регіони"
 PRC_reappoint_jinguang_as_admiral_desc:0 "Оскільки наші військові не мають досвіду ведення морської війни, найкращим кандидатом на посаду командувача нашого нового флоту може бути досвідчений командир сухопутних військ."
 PRC_reinforce_base_area_desc:0 "Щоб уникнути ще однієї кампанії націоналістичних сил проти наших баз, ми повинні розглянути всі можливі варіанти їх захисту."
 PRC_rural_surveys:0 "Провести дослідження села"
 PRC_scholarly_revolution:0 "Вчена революція"
 PRC_sea_inward_focus_desc:0 "Шлях уперед не полягає у сліпому слідуванні радянській лінії. Ми повинні довести свою незалежність від них і прокласти власний шлях, щоб забезпечити успіх нашої революції."
 PRC_sea_peoples_war:0 "$PRC_peoples_war$"
 PRC_sea_proclaim_the_peoples_republic:0 "$PRC_proclaim_the_peoples_republic$"
 PRC_sea_revolutionary_military_commission:0 "$PRC_revolutionary_military_commission$"
 PRC_social_democracy_desc:0 "Радикальні рішення партії лише посилили і так непросту ситуацію. Націоналісти за всіх їхніх недоліків є нашими союзниками у боротьбі за світле майбутнє. Ми маємо бути ближче до них у політичних питаннях."
 PRC_tac_bomber_equipment_1_short:0 "H-2"
 PRC_the_end_of_capitalism_desc:0 "Наша тісна співпраця з [SOV.GetNameDef] зміцнила наш альянс настільки, що тепер він може кинути виклик капіталістичним державам. Разом ми можемо поширити революцію і звільнити їхні колоніальні землі."
 PRC_the_response_to_a_threat:0 "Відповідь на загрозу"
 PRC_the_unwilling_diarchy_focus_desc:0 "Відчайдушні часи вимагають відчайдушних заходів — ми повинні замінити існуючі партійні органи, щоб гарантувати, що нове керівництво матиме можливість швидко діяти проти будь-якого ворога народу. \n\nМао та Готао повинні відкласти свої розбіжності та працювати разом."
