 JUNO_brazil_events.11.a:0 "Ми набираємо обертів серед мас."
 JUNO_brazil_events.122.t:0 "[FROM.GetNameDefCap] відхиляє обмін технологіями"
 JUNO_brazil_events.142.desc:0 "Нещодавній звіт нашої дипломатичної делегації приносить прикрі новини. Нашу пропозицію ягуара, символу нашого бажання дружби та доброї волі, несподівано відхилила [FROM.GetNameDef]. Разом із відмовою від цього заповітного подарунка, наші пропозиції щодо посилення торгівлі та співпраці у зовнішній політиці також були відхилені."
 JUNO_brazil_events.37.a:0 "Це, мабуть, хитрощі."
 JUNO_brazil_events.37.t:0 "Підозріла активність у [BRA.GetNameDef]"
 JUNO_brazil_events.42.b:0 "Вони відчують наш гнів."
 JUNO_brazil_events.43.t:0 "[FROM.GetName] відступає"
 JUNO_brazil_events.61.desc:0 "Наша пропозиція про об'єднання з [POR.GetNameDef] була зустрінута з ентузіазмом. Це знаменує початок великої нової ери для нашої країни!"
 JUNO_brazil_events.63.a:0 "Хіба вони не бачать, як багато можна було б отримати від цього?"
