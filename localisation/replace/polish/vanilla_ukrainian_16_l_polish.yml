 landmark_berlin_reichstag_desc:0 "Пленарна площа будівлі Райхстагу, також відомий як Райхстаг, є історичною будівлею законодавчого уряду на Площі Республіки. До пожежі Райхстаг 1933 року він використовувався федеральною радою Німеччини, але навіть незважаючи на це він є символічна будівля, яка має велике значення в серцях і умах людей."
