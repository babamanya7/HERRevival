 COMMAND_POWER_TOOLTIP_AIR_MISSION:0 "$MISSION_TYPE$ ($WING_NAME|H$ у: $LOCATION|H$)"
 COMPLIANCE_EFFECTS:0 "Ефекти підпорядкування:"
 CONGO_bakwanga_mine_desc:0 "Було виявлено, що регіон Бакванга надзвичайно багатий на діаманти. Хоча це не такі великі камені, як у Південній Африці чи Індії, це надзвичайно великий депозит найтвердішого мінералу в світі, який можна використовувати для широкого кола промислових цілей."
 CONGO_expand_villages_desc:0 "Конго має великий потенціал, але для його розвитку потрібна велика та активна робоча сила. Ми повинні заснувати нові села в районах, де плануємо розвиток, щоб сприяти цьому зростанню."
 CONGO_research_grants_desc:0 "Ресурси — не єдине багатство Конго, у нас також є великий потенціал у вигляді інтелектуальних ресурсів. Цей найцінніший ресурс ще не був належно використаний. Нам слід запропонувати наукові гранти, щоб стимулювати розвиток інтелектуальної галузі."
 CONGO_separate_corporations_from_politics_desc:0 "Ще з часів Вільної держави Конго, країна перебувала під впливом великих корпорацій. В результаті інтереси корпорацій проникли на політичний рівень. Ми повинні вжити заходів, щоб відокремити ці групи від державної влади."
 CONGO_smuggle_diamonds_desc:0 "Діаманти є цінною, практично неконтрольованою валютою, тому вони стали надзвичайно затребуваними в деяких колах. Ми повинні вкласти частину своїх діамантів у цей підпільний рух і зібрати вигоду."
 CONGO_soviet_interest_desc:0 "Існує кілька великих конкурентів, які прагнуть вплинути на ситуацію в Конго, і жоден з них не настільки впертий, як [SOV.GetNameDef]. Нам слід хоча б послухати, що вони можуть запропонувати!"
 CONSTRUCTION_INFO_MASTER:0 "Ми будуємо цю споруду на території держави $WHO|H$. Якщо ми не задіємо всі заводи, вони можуть допомогти нам своїми."
