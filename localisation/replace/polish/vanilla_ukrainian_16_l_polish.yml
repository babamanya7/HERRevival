 GOE_RAJ_loyalist.05.desc:0 "На жаль, схоже, наше прохання про вторгнення в [PER.GetNameDef] не було почуте. Корона вирішила, що ми не повинні розпочинати жодних військових операцій, і хоча ми можемо не погоджуватися, розумно, щоб ми виконували накази [ENG.GetAdjective] уряду."
 GOE_RAJ_loyalist.08.desc:0 "В ім'я захисту, [FROM.GetNameDefCap] пропонує передати [event_target:RAJ.RAJ_annexing_country_target.GetName] під [FROM.GetAdjective] адміністрацію для забезпечення розвитку її оборони. Хоча цей сценарій може бути не ідеальним з точки зору нашого суверенітету, ми можемо лише припустити, що це тимчасовий захід. Або принаймні, ми сподіваємося."
