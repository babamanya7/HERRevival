 raid_type_CHI_hakko_ichiu_bombing:0 "Бомбардування пам'ятника «Хакко Ічіу»"
 raid_type_CHI_huansheng_raid_desc:0 "Наша розвідка стверджує, що металургійний завод Явата і військово-морський арсенал Сасебо, хоч і є цінними цілями, але на даний момент є надто складними для наших ВПС, щоби завдати по них належного удару. Тому було вирішено, що найефективнішим способом зупинити цю війну буде пробудження свідомості японського народу проти звірств, скоєних імперіалістичними японськими агресорами в Китаї, шляхом скидання листівок над такими містами, як Нагасакі, Фукуока, Сага й Осака."
 raid_type_INS_militia_port_raid:0 "Захопити військово-морську базу"
 raid_type_facility_strike_desc:0 "Авіаудар по ворожому експериментальному комплексі з ціллю завдати комплексу серйозної шкоди й абияким проєктам, які там реалізуються."
 raid_type_oilfield_raid:0 "Наліт на нафтове родовище"
 rangers_desc:0 "Спеціалізуючися на проникненні та тактичній обізнаності, ми отримаємо користь від акценту на підготовці наших рейнджерів у ворожому середовищі."
