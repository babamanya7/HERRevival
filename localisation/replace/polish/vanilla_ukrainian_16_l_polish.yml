 ARG_argentine_island_sovereignty.tt:0 "Якщо наразі не перебуваємо у стані війни з ([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!), ми отримаємо ціль війни §YЗавоювати§! проти них."
 ARG_cruiser_ship_engine_3:0 "Двигун 95 000 к. с. н. в."
 ARG_cut_ties_with_britain_desc:0 "Хоча це правда, що острівна нація [ENG.GetNameDef] була нашим найближчим торговельним партнером, їхній договір щодо нашої яловичини лише перешкоджає можливості нашого власного народу забезпечувати свою країну. Ми повинні розпалити антибританські настрої серед населення та довести світові, що ми можемо стояти на власних ногах без колоніальних держав Європи."
 ARG_heavy_ship_engine_1:0 "«Curtiss» 39 500 к. с. н. в."
