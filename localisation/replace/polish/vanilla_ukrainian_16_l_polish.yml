 BUL_petorka_desc:0 "Ми отримали пропозицію співпрацювати з певними політичними групами, які, як і ми, прагнуть захищати демократичні принципи від усіх тих політичних сил, які намагаються встановити диктаторський режим, будь то царський, фашистський чи комуністичний. Цю коаліцію складатимуть п'ять організацій, у тому числі Радикально-демократична партія, Національно-ліберальна партія і, звісно, Болгарська демократична партія."
