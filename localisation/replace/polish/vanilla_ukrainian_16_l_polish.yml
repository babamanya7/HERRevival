 denmark_resistance_event.1.desc:0 "Ми отримали повідомлення, доставлене в обстановці найсуворішої секретності з держави [DEN.GetNameDef]. Там потай шукають союзників, здатних підтримати їхні претензії на суверенітет, і хочуть повернути незалежність від держави [?DEN.DEN_overlord_nation.GetNameDef]. Чи варто нам ставати на чийсь бік у цьому конфлікті?"
 denmark_resistance_event.2.desc:0 "[FROM.GetLeader] погоджується таємно забезпечити нам [FROM.GetAdjective]у підтримку в боротьбі за свободу! Це буде дуже доречно, коли ми зберемося оголосити незалежність від своїх жорстоких колонізаторів."
 denmark_resistance_event.25.t:0 "[FROM.GetNameDefCap] відмовляється продати нам есмінці"
 denmark_resistance_event.4.desc:0 "Ми отримали повідомлення з-за кордону: [DEN.GetNameDef] просить постачати їм зброю, щоб видати її опору, який бореться за свободу."
 denmark_trade_deal.7.desc:0 "[ROOT.GetLeader] отримує персональну телеграму, якою [FROM.GetLeader] сповіщає, що торговельна угода між двома країнами скасовується. Жодного пояснення цьому вчинку не дано і про його причину залишається тільки гадати."
