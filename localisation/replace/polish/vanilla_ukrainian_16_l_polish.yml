 EQUIPMENT_DESIGNER_IS_SCREEN_SHIP_EFFECTS_TOOLTIP:0 "§HКораблі прикриття§! проявляють різну поведінку в бою і на них впливає інший набір модифікаторів, ніж інші категорії кораблів."
