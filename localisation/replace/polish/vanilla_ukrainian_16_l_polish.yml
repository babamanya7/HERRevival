 wuw_GER_the_battle_of_britain.01.t:0 "Битва за Британію"
 wuw_GER_weltpolitik.11.a:0 "Ми мусимо їх знищити заради безпеки нашого народу!"
 wuw_GER_weltpolitik.11.t:0 "Конголезька криза"
 wuw_GER_weltpolitik.4.b:0 "Ми не підтримаємо цю агресію"
 wuw_HUN_a_danubian_federation:0 "Дунайська федерація"
 wuw_HUN_assault_gun_focus:0 "Акцент на штурмових гарматах"
 wuw_HUN_avoid_interventionalist_destablilization_desc:0 "Ми повинні максимально використати наявні ресурси. Добре спланований і збалансований бюджет — ключ до успіху нашого уряду."
 wuw_HUN_cancel_the_german_trade_deal_desc:0 "Фашист Дюла Гьомбьош, наш колишній прем’єр, уклав угоду з дияволом, підписавши торгівельний договір із [GER.GetAdjective]им урядом. Це зобов’язання зв’язує нас із ними та повільно, але невблаганно знищує душу нашої нації. Ми маємо припинити цю угоду якнайшвидше."
 wuw_HUN_construct_the_arpad_line_desc:0 "Щоб захистити наш народ від східної загрози, ми збудуємо систему укріплень у горах Трансільванії. Назвемо її на честь великого князя Арпада — очільника конфедерації мадярських племен."
 wuw_HUN_demand_the_return_of_slovakia_desc:0 "[SLO.GetNameDef] довгий час була частиною Великої Угорщини. Настав час знову заявити про наші права на ці землі."
 wuw_HUN_denounce_marxism_leninism_desc:0 "Йосип Сталін давно зрадив наші ідеали. Його фашистська, авторитарна політика показує, що він не більше ніж зрадник революції. Ми повинні покласти край його обману."
 wuw_HUN_enact_agrarian_reform:0 "Провести аграрну реформу"
 wuw_HUN_guarantee_religious_liberties:0 "Гарантувати релігійні свободи"
 wuw_HUN_joint_air_development:0 "Спільна авіаційна розробка"
 wuw_HUN_license_fiat_tankettes:0 "Ліцензування танкеток Fiat"
 wuw_HUN_manred_weiss_steel_and_metal_works_desc:0 "Сталеливарні та металургійні заводи Манфреда Вайсса, більш відомі як Csepel Művek, мають великий потенціал і повинні бути максимально розширені для підтримки розвитку нашої нації."
 wuw_HUN_news_events.5.c:0 "Імовірний союзник?"
 wuw_HUN_news_events.7.t:0 "Відновлення Угорської Радянської Республіки"
 wuw_HUN_reclaim_the_pannonian_steppe_desc:0 "Мадяри оселились у Паннонській низовині тисячі років тому. Тепер ці землі окуповані. Ми повинні повернути наші предковічні території."
 wuw_HUN_reinstate_the_pragmatic_sanction_tt:0 "Члени §YМалої Антанти§! зможуть §Yоголосити ембарго§! проти нас"
 wuw_HUN_revive_the_tribal_consolidation:0 "Відродити угорську націю"
 wuw_HUN_sailing_the_danube:0 "Плавання по Дунаю"
 wuw_HUN_soviet_hungarian_military_academy:0 "Радянсько-угорська військова академія"
 wuw_HUN_szent_laszlo_infantry_division:0 "Піхотна дивізія Святого Ласла"
 ww_BEL_event_diplomatic.1.t:0 "[FROM.GetNameDefCap] Відмовляється від наших гарантій"
 ww_BEL_event_diplomatic.27.desc:0 "[FROM.GetNameDefCap] схвалив наш запит на більш тісний зв'язок з [FROM.GetFactionName]. Нам буде надано деякі повноваження щодо їхньої зовнішньої політики, а торгівля між нами буде спрощена."
 ww_BEL_event_diplomatic.7.b:0 "Добре, це справедливий обмін."
 ww_BEL_event_misc.3.desc:0 "Cockerill — компанія, що знаходиться в центрі бельгійської промисловості. Протягом свого існування вона займалася не тільки виробництвом заліза та сталі, але й виготовленням точно налаштованих машин, включаючи парові двигуни, потяги та навіть лінійні кораблі. Вона здобула блискучу репутацію і стала однією з провідних сил у сталеливарній промисловості Західної Європи. \n\nАдольф Грейнер, генеральний директор, серед інших членів керівництва, залишався на своїх постах під час облоги Льєжа в часи Великої війни, забезпечуючи відкритість роботи для своїх працівників, як тільки це було можливо. Після окупації компанія відмовилася виробляти для окупаційних сил і була спустошена через більшість свого обладнання для важкої металургії. \n\nВона відновилася в міжвоєнний період і залишилася однією з провідних промислових компаній."
 ww_BEL_event_political.3.a:0 "Призначити стабільного лідера, ліберала Поля-Еміля Янсона"
 ww_BEL_event_political.6.desc:0 "З самого початку Бельгія була країною, розділеною між двома мовними групами: валлонами, які говорять французькою, та фламандцями, які говорять нідерландською. Це призвело до цілої низки проблем у нашій країні, від простих непорозумінь між друзями до неправильного виконання військових наказів, а також до помилок у правосудді через те, що підсудні не розуміють мову суду.\n\nЧас подолати це розділення раз і назавжди та вирішити, як найкраще об'єднати нашу країну за єдиною мовною моделлю."
 ww_BEL_event_political.7.a:0 "Губерт П'єрло та католицька партія залишаються непохитними перед тими, хто загрожує нам."
 ww_BEL_event_spanish_interaction.1.t:0 "[FROM.GetNameDefCap] Надсилає обладнання"
 ww_BEL_event_spanish_interaction.2.t:0 "Подальші поставки обладнання до республіканців [SPR.GetAdjective]"
 ww_BEL_event_spanish_interaction.3.desc:0 "Ми отримали ще одну партію обладнання від [FROM.GetAdjective]. Їхня підтримка буде дуже корисною у боротьбі з націоналістичним чумою, яка спустошує наші землі."
 ww_BEL_event_spanish_interaction.6.t:0 "[FROM.GetNameDefCap] Пропонує альянс"
 ww_congo.15.d:0 "[FROM.GetNameDefCap] безпардонно відмовилися від наших вимог! Здається, якщо ми хочемо [772.GetName], нам доведеться забрати його силою!"
 ww_congo.17.c:0 "Можливо, це було на краще..."
 ww_congo.23.t:0 "Бельгійці схвалюють нашу схему імміграції"
 ww_congo.28.t:0 "Зростаюча підозра до Національного комітету"
 ww_congo.4.desc:0 "Бельгійський військовий офіцер Рауль ван Оверстрейтен, який служив в нашій країні до нещодавно, тепер після новин про нашу новопридбану незалежність вирішив повернутися додому на європейський материк. Нам більше не потрібні європейці на кшталт нього, і ця втрата, без сумніву, зробить нас сильнішими."
 ww_congo.4.t:0 "Рауль ван Оверстрейтен повертається до Бельгії"
 ww_congo.40.desc:0 "Наш президент [ROOT.GetLeader] зараз формує наш перший офіційний кабінет після перемоги на нещодавніх виборах. Оскільки він надзвичайно популярний по всій нації, він, безсумнівно, стане відомим як батько-засновник нашої сучасної держави для майбутніх поколінь!"
 ww_congo.43.t:0 "[FROM.GetLeader] не передає території баконго"
 ww_congo.44.a:0 "Він найбільш легітимний кандидат, якого ми можемо отримати!"
 ww_congo.45.b:0 "Ні, нам потрібен хтось інший!"
 ww_congo.49.desc:0 "Рада вирішила, що, оскільки більше не залишилось інших варіантів, останнім можливим правителем Конго може стати Юхі V Мусінга, Умвамі Королівства Руанда, королівства на сході, якого було вигнано з влади бельгійськими губернаторами після Великої війни через його співпрацю і захоплення Німецькою колоніальною імперією. Це може бути ризикована ставка, але хоча б у нього є великі амбіції..."
 ww_congo.63.t:0 "[FROM.GetLeader] хоче продати нам уран"
 yuan_summer_capital_name:0 "Шанду"
 zbrojovka_brno:0 "Zbrojovka Brno"
