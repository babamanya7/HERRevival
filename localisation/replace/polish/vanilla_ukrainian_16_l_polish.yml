 SPA_expand_the_slipways_desc:0 "Раніше ми купували найбільші кораблі в інших держав. Нам слід збільшити розміри наших власних стапелів, щоби ми мали свободу будувати ці кораблі самостійно."
 SPA_gw_tank_equipment:0 "Trubia A4"
 SPA_imprison_primo_de_rivera_mission_desc:0 "Уряд, схоже, вирішив, що Прімо де Рівера спричинив достатньо заворушень, і видав ордер на його арешт!"
 SPA_navarra_offensive_mission:0 "Насувається наступ у Наваррі"
 SPA_neutrality:0 "Націоналістична Іспанія"
 SPA_prosperity_of_the_empire_desc:0 "Відновлення та процвітання Імперії є першорядним, і завдяки додатковій зосередженості на поліпшенні інфраструктури нашої країни та, таким чином, заохочуючи торгівлю та промисловий розвиток, ми забезпечимо якнайшвидше досягнення цієї мети."
 SPA_retake_gibraltar_desc:0 "Минуло понад два століття відтоді, як Гібралтар було вирвано з гостинного лона Іспанії. Ця британська рана на обличчі Іберії не може продовжувати існувати."
 SPA_save_the_alcazar:0 "Урятувати алькасар!"
