 ENG_jet_strat_bomber_equipment_1:0 "Vickers Valiant"
 ENG_maintaining_the_balance_of_power_desc:0 "Сила імперії полягає у слабкості та паралічі Європи. Якщо ми хочемо зосередитися на глобальних питаннях, ми мусимо переконатися, що Європа занадто зайнята своїми справами, щоб дивитися на наші. Ми залишатимемося осторонь європейських справ, за винятком дій проти будь-яких експансіоністських режимів, які можуть загрожувати цьому крихкому балансу сил, якого ми прагнемо."
 ENG_motorized_equipment_0:0 "FWD Model B"
 ENG_motorized_focus:0 "Моторизована армія"
 ENG_operation_4:0 "Operation Prominence"
 ENG_pre_empt_the_ideological_threat_desc:0 "Імперію зсередини атакують ті, хто думає інакше. Ми знаємо, що ця «п'ята колона» отримує накази з Москви, і тому ми можемо змусити їх замовкнути, вдаривши по джерелу цього зла."
 ENG_pre_empt_the_strategic_threat:0 "Випереджальний удар по стратегічній загрозі"
 ENG_raid_category_fluff_text_paratrooper_raids:0 "§LОсоблива повітряна служба (SAS)§!"
 ENG_railway_gun_equipment_1_short:0 "BL 9.2 inch"
 ENG_replace_government_in_british_raj_fascism:0 "Установити фашистський уряд у Британській Індії"
 ENG_replace_government_in_canada_communism:0 "Установити комуністичний уряд у Канаді"
 ENG_request_trade_union_dockyard_worker_support_desc:0 "Ми скористаємося своїми зв'язками та репутацією у профспілках, щоби переконати їх у важливості якнайшвидшого збільшення продуктивності верфей. Підтримка профспілок дозволить нам мотивувати робітників на верфях."
 ENG_revisit_colonial_policy_desc:0 "Часи змінюються. Очевидно, що рухи за незалежність будуть продовжувати виникати по всій імперії, причому в дедалі сильніших формах. Якщо ми не хочемо, щоб нас змушували витрачати дедалі більше ресурсів на придушення цих рухів, ми мусимо визнати, що наша імперія вичерпала себе, і тепер ми мусимо дозволити їй знайти свій власний шлях у світі."
 ENG_rocket_artillery_equipment_2_short:0 "RP-3 HE/SAP"
 ENG_support_imperialist_coup_in_australia:0 "Влаштувати імперіалістичне повстання в Австралії"
 ENG_the_british_communist_alternative_desc:0 "Замість стати на бік Москви, ми розпочнемо власну співпрацю між комуністичними державами. Британці не мають собі рівних на світовій арені, і ми не будемо кланятися Москві; ні зараз, ні коли-небудь."
 ENG_the_mosley_plan_desc:0 "Сміливі економічні реформи поряд із масштабною пропагандою та державними інвестиціями мають згуртувати народ у єдиному пориві, щоби відновити велич нації та почати переозброєння."
 ENG_trade_unions_demand_increase_in_paid_leave:0 "Прийняти закон про збільшення оплачуваної відпустки"
 ENG_urge_restraint_desc:0 "Наш наступний марш має пройти ідеально, тому що його насильницький розгін розбурхає всю країну і призведе до масштабних заворушень або навіть до громадянської війни. Треба попередити учасників маршу, щоби ті за будь-яку ціну утримувалися від насильства, хоча, звичайно, нашим радикальним прихильникам це не сподобається."
 EQUIPMENT_ANTI_AIR:0 "Зенітна артилерія"
