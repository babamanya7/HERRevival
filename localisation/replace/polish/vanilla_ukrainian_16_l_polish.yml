 HUN_nav_bomber_equipment_1_short:0 "RMI-1"
 HUN_proclaim_the_restoration_of_austria_hungary_desc:0 "Об'єднання двох наших народів під владою Габсбурга дозволяє нам урочисто оголосити про відродження Австро-Угорщини та заявити права на провінції, що історично належали нашій державі!"
 HUN_recall_kocsard_janky_to_active_service_tt:0 "§YКочард Янкі§! стане генералом"
 HUN_secure_the_ragged_guards:0 "Забезпечити лояльність «Обірваної гвардії»"
