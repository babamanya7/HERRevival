 HINT_ARMY_PLANNER_TEXT_2:0 "Дивізії можна виробляти серіями і/або паралельно одна одній.\n\nДивізії, що тренуються паралельно, отримуватимуть §Yозброєння§! однаково, тож будуть готові до розгортання приблизно в однаковий час. Коли дивізія отримала потрібне оснащення й завершила тренування, її буде розгорнуто в указаній точці.\n\nКлацніть на §YДодати дивізію§!, щоби додати ще одну дивізію для паралельного тренування.\n\nЯкщо ситуація у війні складається не на Вашу користь, у Вас є можливість розгорнути дивізії §Yдо того, як вони отримають оснащення та завершать тренування§!. За можливості, цього слід уникати.\n\nВи можете більше прочитати про те, які війська створювати, у вікі HOI4!"
 HISTORICAL_DIVISION_LORE_PLACEHOLDER_TEXT:0 "§gЦе текст-плейсголдер опису, який стисло розповідає кілька слів про цю історичну дивізію.§!"
 HISTORICAL_TEMPLATE_ENABLED:0 "Створити шаблон $ROLE|H$, якомога точніше відтворити $NAME|H$."
 HOA_a_jagged_alliance_desc:0 "Хоча ми не завжди бачимо віч-на-віч з іншими державами, ми часто стикаємося з тими самими загрозами. Зосередження на цих спільних питаннях може стати основою довгострокових союзів і посилення національної безпеки."
 HOA_construct_great_monuments:0 "Спорудити величні монументи"
 HOA_modern_infantry:0 "Сучасна піхота"
 HOA_reform_the_conscription:0 "Реформувати призов"
 HOA_the_capital_city_airport_desc:0 "Повітряний транспорт все більше пов'язує міста світу зі світовою економікою. Ми повинні створити власний аеропорт, щоби скористатися цією тенденцією."
 HOL_abandon_the_gold_standard_desc:0 "За останні роки відмова від золотого стандарту коштувала нам величезних ресурсів. Тепер, коли Франція покинула Золотий блок, залишилися лише швайцарці та ми. Настав час дозволити девальвацію гульдена та використати вивільнені ресурси для поліпшення жалюгідного стану нашої оборони."
 HOL_american_west_indies_protectorate_tt:0 "§R[USA.GetNameDefCap] має схвалити угоду, щоби бонуси набули чинності.§!\n"
 HOL_antilles_defenses_taog_desc:0 "$HOL_antilles_defenses_desc$"
 HOL_continue_the_public_works_desc:0 "Ми повинні продовжувати великі громадські роботи, розпочаті наприкінці 1920-х років. Рекультивація землі та будівництво нових каналів, доріг і тунелів не тільки створює робочі місця, але й сприяє поліпшенню нації."
 HOL_continue_the_war_in_batavia_taog:0 "$HOL_continue_the_war_in_batavia$"
 HOL_curtail_colonial_autonomy_taog:0 "$HOL_curtail_colonial_autonomy$"
 HOL_destroyer_4_desc:0 "The Piet Hein class consisted of three British S-class destroyers transferred to the Royal Dutch Navy shortly after the war. The ships displaced over 1,800 tons, were armed with four 120mm/45 QF Mk IX guns, and had a wide array of ASW armaments."
 HOL_domestic_innovation:0 "Вітчизняні інновації"
 HOL_dp_light_battery_2:0 "120mm/45 W-F Mk 8 DP"
 HOL_for_the_common_good_tt:0 "§Y[HOL.GetName]§! й усі члени приєднаються до групи §YКомуністичного технологічного обміну§!.\n"
 HOL_form_new_government:0 "Сформувати новий уряд"
 HOL_foundations_for_a_european_union_desc:0 "Зі скромних початків нашого Бенілюксу ми повинні створити загальноконтинентальний Союз Націй, стоячи пліч-о-пліч проти безперервного розпалювання війни великих держав. Європейський Союз забезпечить мир і процвітання для всіх."
 HOL_french_military_mission_desc:0 "Французькі військові славляться на всьому континенті. Ми запросимо військову місію, щоб виховати наших військових мислителів і поліпшити організацію нашої армії."
 HOL_further_reinforce_the_ports:0 "Подальше зміцнення портів"
 HOL_further_reinforce_the_ports_desc:0 "Ми повинні ще більше зміцнити нашу берегову оборону, щоби перешкодити будь-якій британській ідеї «надавати нам свою допомогу» без нашого прямого дозволу."
 HOL_heavy_tank_equipment_1_short:0 "ZT-I"
 HOL_hih_siderius_organization:0 "$hih_siderius$"
 HOL_lead_the_minor_democracies:0 "Очолити лігу малих демократій"
 HOL_modernize_our_infantry_equipment_tt:0 "Це змусить нас зосередитися на внутрішньому розвитку оснащення замість придбання ліцензій на виробництво в майбутньому.\n"
 HOL_oranje_boven_desc:0 "Історія нашої країни пов'язана з королівською родиною Ораньє–Нассау. Таким чином, помаранчевий колір став національним символом, що відображено як у звичаї додавати помаранчевий вимпел до прапора в дні національних свят, так і в коротких патріотичних піснях, таких як «Oranje boven», або «Помаранчевий угорі», вшанування королеви та королівської родини в цілому."
 HOL_prepare_evacuation_of_gold_reserves_tt_2:0 "Дасть §Y100 од. політичної влади§! і підвищує £legitimacy §Yлегітимність§!, коли держава стане §Yурядом у вигнанні§!.\n"
 HOL_pull_strings_with_british_industrialists_desc:0 "Англо-нідерландська промислова співпраця триває вже багато років і породила різні мультинаціональні корпорації, такі як Philips і Royal Dutch Shell. Можливо, тепер ми зможемо скористатися їх зв'язком з Британією, щоби постачати наші війська."
 HOL_rely_on_submarines_desc:0 "Навіть сучасні крейсери не допоможуть проти величезних військово-морських сил, із якими нам доведеться воювати. Натомість ми будемо інвестувати в сучасні підводні човни, щоби затримати наступ противника, поки не прибуде флот могутнішого союзника."
 HOL_request_equipment:0 "Попросити техніку"
 HOL_ship_light_medium_battery_1:0 "14.9 cm/50 W-Fijen'd 6"
 HOL_sub_ship_engine_4:0 "«Sulzer» 5 000 к. с. н. в."
 HOL_sumatra:0 "Суматра"
 HOL_taking_back_french_flanders_desc:0 "Історичні межі Нижніх земель відтоді були розділені великими державами, які їх оточували. З них Франція все ще володіє значною кількістю землі, яка вважається частиною історичної Фландрії. Зараз ми достатньо сильні, щоби повернути це назад, і тому повинні."
 HOME_BASE_TITLE:0 "§HБаза приписки§!"
 HRZ_fascism:0 "Нове герцогство Св. Сави"
 HUN_EMPIRE_neutrality_ADJ:0 "Австро-угорськ"
 HUN_a_new_flagship_desc:0 "Багата на події історія наших морських традицій була сповнена випробувань, нещасть і зради. Прагнучи відновити гордість за нашу спадщину, наші адмірали пропонують новий флагман, який надихне всю націю."
 HUN_bohemia_and_silesia_tt:0 "§YЧехословаччина§! буде відома як §YКоролівство Богемія-Моравія та Сілезія§!.\n"
 HUN_capital_ships_desc:0 "Головною опорою флоту є лінкори. Щоб надолужити згаяний час, ми мусимо якнайшвидше розпочати будівництво нових суден."
