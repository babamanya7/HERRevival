 HUN_take_austria_by_force:0 "Узяти Австрію силою"
 HUN_the_danubian_federation_decision:0 "Запросити державу [FROM.GetNameDef] до альянсу [ROOT.GetFactionName]"
 HUN_theoretical_air_efforts_desc:0 "Ми мусимо вкласти значні ресурси у розвиток нових теорій, що стосуються ведення війни у повітрі. У разі реальної війни це дасть нам неоціненну перевагу."
 HUN_unify_with_austria_tt:0 "\nВони з більшою ймовірністю підкоряться, якщо:\n - їхня §Hпідтримка війни§! — нижче §H50%§!\n - вони не є членом §Hальянсу§!\n - вони мають §Hхорошу думку§! про нас\n - їхня §Hармія слабша§! від нашої"
 HYD_democratic:0 "Телангана"
 HouseElectionGained:0 "отримала [?ror_loc] місць"
 IAS_neutrality_ADJ:0 "Істмо-америндськ"
 ICE_banking_on_the_future_desc:0 "Банківський сектор — це сектор, який не потребує величезних ресурсів. Все, що нам потрібно — це залучити іноземний капітал. Субсидуючи наш банківський сектор і роблячи все можливе, щоб зробити ісландські банки привабливими для інвесторів, ми можемо перетворити цей острів на фінансовий хаб, який принесе свої плоди в найближчі роки."
 ICE_declare_absolute_neutrality_desc:0 "Що би не сталося з Данією, Ісландія повинна зробити все, що в її силах, щоб залишитися осторонь європейської війни. Проголошуючи абсолютний нейтралітет, ми даємо зрозуміти всім, що не дозволимо втягнути наш острів у що-небудь."
 ICE_drilling_for_oil_off_shore_repeat_tt:0 "Це рішення можна повторно прийняти через §Y180§! днів."
 ICE_expand_industrial_complexes_desc:0 "Наша військова промисловість сильно відстає від інших європейських держав, будучи настільки ж недорозвиненою і недозавантаженою, як і вони, і якщо ми не будемо інвестувати значні кошти в розширення і субсидування наших військово-промислових організацій, наша промисловість може ніколи не наздогнати їх."
 ICE_flying_boats:0 "Летючі човни"
 ICE_flying_boats_desc:0 "Якщо ми не можемо змагатися з нашими ворогами на воді, тоді ми вдамося до наступної найкращої речі — неба. Бо якщо ми контролюватимемо небо, нашим ворогам не знадобляться їхні кораблі, оскільки вони будуть потоплені в одну мить."
 ICE_joint_military_training_desc:0 "Ми не маємо достатнього досвіду на острові, щоб належним чином підготувати армію до ведення сучасної війни. Тому співпраця з Данією є найкращим підходом для такого маленького острова, як наш."
 ICE_joint_shipbuilding_programme:0 "Спільна програма суднобудування"
 ICE_the_fertility_of_freya_desc:0 "Фрейя, крім усього іншого, є богинею кохання, краси та родючості. Ми мусимо закликати її ім'я, щоб переконатися, що у наших людей є діти, які одного дня зможуть вирости великими воїнами."
 ICE_the_icelandic_police_force:0 "Поліція Ісландії"
 ICE_the_kingdom_of_iceland:0 "Королівство Ісландія"
 IDEOLOGY:0 "Ідеологія"
 IMPORT_EQUIPMENT_DESIGN_SUCCESS_MANY_DESC:0 "Успішно імпортовано дизайни: $NUM|Y$."
 INC_DEF:0 "Неоінкська держава"
 INC_democratic_DEF:0 "Неоінкська держава"
