 Sweden_rearnament.4.desc:0 "Згідно з вашим запитом, ви просили нагадати, коли наступного разу збирається комітет із питань переозброєння. Цей час настав, і це наша можливість визначити політику озброєнь на наступний рік.\nНеобхідні уважність і ясність мислення, оскільки це забезпечить нам план на осяжне майбутнє, в той час як світ наближається до переломного моменту."
