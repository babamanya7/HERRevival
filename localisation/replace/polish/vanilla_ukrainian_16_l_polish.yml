 scope_SIK_GetNameDef:0 "[scope_SIK.GetNameDefCap]"
 secure_the_oil_supply_tech_bonus:0 "Бонус до цілі забезпечення постачання нафти"
 ship_armor_ice_carrier_deck_2_desc:0 "Армований сталлю пайкерит забезпечує міцнішу конструкцію, здатну витримувати більші пошкодження, одночасно забезпечуючи кращу ізоляцію."
 ship_armor_ice_carrier_deck_3_desc:0 "Використані матеріали та методи забезпечують найкращу міцність конструкції та зменшують вплив погодних умов на експлуатацію судна."
 ship_hull_cruiser_1_desc:0 "Навіть з урахуванням усіх обмежень Вашингтонського морського договору крейсер залишається найуніверсальнішим кораблем ВМС. На основі цього корпусу можна побудувати легкий крейсер для ескортних та розвідувальних завдань або важкий крейсер для підтримки ударної групи."
 ship_hull_cruiser_2:0 "Базовий крейсер"
 ship_hull_cruiser_coastal_defense_ship:0 "Корабель берегової оборони"
 ship_hull_escort_carrier:0 "$escort_carrier$"
 ship_torpedo_sub_nuclear_desc:0 "Торпеди, що несуть ядерну боєголовку, є високоефективною зброєю проти ворожих кораблів, але мають вищий ризик аварій."
 ship_torpedo_upgrade_desc:0 "Торпеда — це потужна атака, яку можуть завдати невеликі кораблі, коли вони знаходяться в зоні дії, з високим шансом критичного влучення."
 shortcircuited_radar_4:0 "$shortcircuited_radar_1$"
 siam.11.t:0 "Стратегічний прорив [FROM.GetAdjective]"
