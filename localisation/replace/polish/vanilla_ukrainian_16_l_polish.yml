 LAT_banish_clemens_desc:0 "Густавс Целміньш — небезпечний фашист, який загрожує стабільності диктатури та безпеки латвійських меншин по всій нашій великій країні. Його треба вигнати з держави, поки «Pērkonkrusts» не завдав нації ще більшої шкоди."
 LAT_belarus_fascism:0 "Латвійсько-білоруська націоналістична асамблея"
