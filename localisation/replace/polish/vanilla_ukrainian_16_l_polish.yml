 SOV_infantry_equipment_1:0 "СВТ-38/40"
 SOV_inheritor_of_the_mantle_of_lenin_desc:0 "Товариш Сталін завжди був найближчим соратником і найвірнішим учнем Леніна. Як найвірніший послідовник вчення Леніна, цілком природно, що він успадкував важкий обов'язок вести націю до комунізму, а також готувати неминучу світову робітничу революцію."
 SOV_integrate_smirnovs_bloc_desc:0 "У нас є кілька старих троцькістів, яких нещодавно заарештували і посадили у в'язницю за їхній спротив сталінському гніту. За допомогою кількох вдало підібраних слів у правильні вуха, ми могли б побачити їх звільненими і відправленими у вигнання, де вони зможуть організуватися, будучи в безпеці від політичної параної. Вони не забудуть, хто допоміг їм втекти."
