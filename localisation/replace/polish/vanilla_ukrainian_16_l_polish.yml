 denmark_events.1.desc:0 "Нарешті, після довгих років економічних труднощів ми подолали страждання, які принесла світу Велика депресія. У кризові часи ми наполегливо працювали, щоб стабілізувати [DEN.GetAdjective]у економіку і пом'якшити шкоду, завдану катастрофою нашій країні."
 denmark_expansion_event.502.t:0 "[FROM.GetNameDefCap] відмовляється вступити в альянс"
 denmark_occupation_event.10.a:0 "Як... несподівано"
 denmark_occupation_event.100.desc:0 "Схоже, данський уряд усвідомив свої інтереси і поміняв свою політику так, щоб вона йшла курсом, паралельним нашому. [FROM.GetLeader] просить у нас дозволу об'єднати війська — тоді Данія зможе сповідувати більш агресивну зовнішню політику і стати більш незалежною від нас."
