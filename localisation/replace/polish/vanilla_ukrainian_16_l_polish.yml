 ger_sov_buddies_tooltip:0 "§RЯкщо [SOV.GetAdjective]і дипломати прийме нашу пропозицію, ми зазнаємо певної втрати стабільності через таку зміну політики. Зрозуміло, що наші колеги-фашисти і демократичні держави також будуть засмучені таким поворотом подій.§!\n"
