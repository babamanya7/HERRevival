 MTG_naval_treaty.11.desc:0 "З початком війни [From.GetAdjective]ий уряд офіційно повідомив учасників Лондонської морської угоди, що, згідно зі статтею 24, обмеження цієї Угоди більше не задовольняють її національним інтересам. [From.GetAdjectiveCap]ий посол оголосив: дія Морської угоди буде припинена на час війни. Чи буде вона відновлена після війни, поки неясно, але зараз нам немає необхідності дотримуватися її обмежень щодо проєктування та будівництва кораблів."
