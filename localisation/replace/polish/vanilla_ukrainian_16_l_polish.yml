 germany.64.d:0 "Не зважаючи на відсутність підтримки війни в Британії, її уряд розглянув загрозу з боку Німеччини та запропонував нам повну підтримку. Ми надішлемо Німеччині остаточний ультиматум про виведення військ із демілітаризованої зони. Якщо вони відмовляться, наші війська ввійдуть на німецькі землі та покладуть кінець цьому царству терору!"
