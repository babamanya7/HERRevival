 FRA_BEL_autonomy_eu_member:0 "Європейська Франція"
 FRA_GATHERING_STORM_DESC:0 "Попри спустошення Великої війни, Франція йде шляхом до відновлення завдяки сильній економіці. Однак, Велика депресія все ще стримує державу, а новий німецький уряд не зацікавлений у виплаті військових репарацій, передбачених Версальським договором.\n\nКоли договір був підписаний, французький маршал зазначив, що це не мир, а перемир'я на 20 років. Тепер ці 20 років стрімко спливають."
 FRA_GER_fascism_autonomy_reichsprotectorate:0 "Вішістська Франція"
 FRA_STATE_1017:0 "Північний Аннам"
 FRA_central_africa_intervention.1.desc:0 "Зустрівши лише помірний опір, союзні війська глибоко проникли в утримувані вишистами райони Центральної Африки. Незважаючи на наказ вішістів триматися якомога довше, французькі війська в цих районах вже не противяться просуванню союзників."
 FRA_cv_nav_bomber_equipment_2:0 "Latécoère 312C"
 FRA_egalite_liberte_solidarite_desc:0 "Перша Французька революція змела режими, які проіснували тисячоліття, і назавжди змінила ландшафт Європи. Ми закінчимо те, що вони почали."
 FRA_form_the_state_arsenals:0 "Сформувати державні арсенали"
 FRA_grow_the_empire_desc:0 "Абсурдно, щоб країні розміром з Бельгію було дозволено зберегти колонію, у багато разів її розмір. Ми набагато краще підходимо для управління такою територією."
 FRA_invest_in_syria:0 "Інвестувати в Сирію"
 FRA_invest_in_the_metropole_desc:0 "Нашим першим кроком у відбудові наших галузей має бути поліпшення нашої промислової бази в наших континентальних холдингах."
 FRA_leftist_rhetoric_communism:0 "$FRA_leftist_rhetoric_democratic$"
 FRA_mechanized_equipment_1_short:0 "Citroën P107"
 FRA_medium_tank_artillery_equipment_1:0 "ARL V39"
 FRA_nuclear_effort_desc:0 "Перші ядерні випробування показали найцікавіші результати. Якщо ми зуміємо приборкати цю енергію, то отримаємо зброю, рівних якій людство не знало."
 FRA_reorganize_aviation_industry_north:0 "Реорганізувати авіаційну промисловість на півночі"
 FRA_reorganize_the_aviation_industry:0 "Реорганізувати авіаційну промисловість"
 FRA_revive_the_franco_polish_alliance_tt:0 "\nПольщу запросили б до нашого альянсу, якби ми були його лідером."
 FRA_right_wing_rhetoric_desc:0 "Ми мусимо докласти всіх зусиль, щоби зміцнити патріотичний дух французів, і показати, що саме ми— ті сильні лідери, яких потребує народ. З нами Франція поверне собі колишню славу, а її громадяни — колишню гордість."
 FRA_rush_the_richelieus_desc:0 "Оскільки ситуація в Європі стає все більш і більш відчайдушною, ми не встигаємо будувати наші нові наземні підрозділи звичайними засобами. Ми мусимо визначити пріоритети матеріалів, щоби наші нові лінкори були введені в експлуатацію якомога швидше."
 FRA_the_maquis_desc:0 "Сільські райони Франції пропонують прикриття для всіх, хто хоче втекти від окупанта або його колабораціоністів. Ми маємо підтримати людей, які відмовляють ворогові у своїй праці в акті опору, щоби з часом перетворити ці території на вогнища опору."
 FRA_the_young_school:0 "Молода школа"
 FRA_undersea_combat_desc:0 "Підводний човен набув зрілості в останнє десятиліття. Тепер він становить смертельну загрозу для будь-яких надводних кораблів, але його все важче виявити та знищити."
