 RAJ_jet_fighter_equipment_1:0 "Gloster Meteor"
 RAJ_jet_tac_bomber_equipment_1_short:0 "Venom"
 RAJ_jugantar:0 "Югантар"
 RAJ_jugantar_tt:0 "Після оголошення війни [PAK.GetName] ми отримаємо дивізії навколо Бангладеш"
 RAJ_jungle_training_desc:0 "Індія, Бірма й Індокитай вкриті джунглями, і потрібно підготувати солдатів, щоб вони діяли ефективно в цих небезпечних умовах."
 RAJ_land_grab_desc:0 "Щоб задовольнити потреби швидкої індустріалізації, ми повинні придбати та перепрофілювати землю по всьому субконтиненту. Експансія не залишає місця для вагань, коли прогрес має бути на першому місці."
 RAJ_legacy_of_timur_desc:0 "Імперія Тимура ніколи не мала зникнути в історії. Повернувши наші родові землі та об'єднавши їх під єдиним правлінням, ми відродимо спадщину Тимуридів та започаткуємо нову еру сили та амбіцій. Світ знову тремтітиме перед синами Тимура."
 RAJ_light_tank_equipment_2:0 "Matilda Local Pattern"
 RAJ_local_leaders_investments_infra:0 "[?RAJ_local_leaders_infra|0+]"
 RAJ_mahatma:0 "Махатма"
 RAJ_mechanized_equipment_1_short:0 "Bren Carrier"
 RAJ_medium_tank_destroyer_equipment_1_short:0 "Cavalier"
 RAJ_mixed_economy:0 "Змішана економіка"
 RAJ_mobilization_of_the_indian_army_desc:0 "Наші сили численні, і наш дух зміцнений на захист нашої славетної імперії. Хоча може знадобитися час, щоб зібрати наші сили з усіх куточків субконтиненту, вкрай важливо, щоб ми розпочали мобілізацію [RAJ.GetAdjective] армії. Настав час стати і боротися за [RAJ.GetNameDef] та [ENG.GetNameDef]."
 RAJ_modify_south_east_asia_command_dm_tt:0 "Модифікувати §Y$RAJ_south_east_asia_command_dm$§! на:"
 RAJ_ordnance_factory_kanpur_uttar_pradesh_desc:0 "Збройовий завод у Канпурі є наріжним каменем оборонного виробництва Індії. Розширюючи його потужності та модернізуючи його об'єкти, ми забезпечуємо постійне постачання зброї та обладнання, надаючи нашим силам можливість захищати та забезпечувати націю."
 RAJ_pledge_for_the_allies_desc:0 "З фашизмом та комунізмом, що піднімаються по всьому світу, Індія не може стояти наодинці. [ENG.GetName], можливо, не був другом Індії, але зрозуміло, що інші є нашим ворогом."
 RAJ_research_collaboration:0 "Наукова співпраця"
