 GRE_the_double_headed_aquila_desc:0 "Ми нанесемо двоголового орла на кожен літак, що злітатиме в небеса і поливатиме ворогів вогнем. Світ побачить, як далеко простягаються наші крила..."
 GRE_the_kings_government_desc:0 "Своєчасне втручання Його Величності не дало венізелістам утворити новий уряд і дуже до речі! На нас чекає чимала робота. Демердзіс виконав свою роль центристського посередника, але тепер Греції потрібен сильніший глава уряду."
 GRE_theban_warriors_desc:0 "Ми не ставимо собі за мету створити суспільство, що спирається на військових; суспільство, де понад усе ставиться сила. Ми активно протистоїмо будь-яким спробам наслідувати систему Муссоліні! Ми — греки, а не римляни! Замість того, щоби створювати культ поклоніння кровожерливим спартанцям, давайте краще почитати жителів Фів, які силою кмітливості повалили гегемонію Спарти!"
