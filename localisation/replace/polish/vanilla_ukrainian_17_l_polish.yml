 SEA_PHI_political_events.13.t:0 "Проблема з [PHI.GetCommunistParty]"
 SEA_PHI_political_events.18.desc:0 "Ми з великим інтересом спостерігали за підйомом фермерів, фабричних робітників та рибалок у [PHI.GetNameDef], і тепер вони звернулися до нас із дипломатичними пропозиціями, висловлюючи зацікавленість у вступі до Комінтерну. Як нам відповісти?"
 SEA_PHI_political_events.45.t:0 "[FROM.GetName] просить підтримки незалежності"
 SEA_PHI_political_events.48.a:0 "Ми все одно збиралися надати їм це"
 SEA_PHI_political_events.54.desc:0 "З нещодавньою втратою регіону Маніла наші війська втратили віру в перемогу у війні за допомогою традиційної тактики. Оскільки армія офіційно капітулює, а уряд евакуюється, вже формуються нові організації для опору ворогу."
 SEA_PHI_political_events.57.a:0 "Це чудове посилення наших військових спроможностей"
 SEA_PHI_political_events.6.t:0 "[FROM.GetName] надає підтримку"
 SEA_PHI_political_events.67.t:0 "[FROM.GetName] підписує договір про взаємодопомогу"
 SEA_PHI_political_events.69.desc:0 "З моменту здобуття незалежності [FROM.GetNameDef] зробив багато кроків для її зміцнення, і тепер бажає розширити співпрацю з іншими іспаномовними країнами. Це вилилося у пропозицію об'єднати наші країни в Іспаномовну імперію."
 SEA_PRC_border_war_events.3.desc:0 "Після прикордонних сутичок вздовж кордону [615.GetName], [PRC.GetNameDef] вдалося прорвати оборонні рубежі та витіснити ворога. [PRC.GetNameDefCap] тепер оголошує регіон своїм."
 SEA_PRC_faction_events.21.desc:0 "Схоже, що нещодавня промова [ROOT.GetLeader], в якій він розкритикував лідерство [?PRC_faction_leader_var.GetNameDef] у [ROOT.GetFactionName], зачепила струни душі [FROM.GetLeader] з [FROM.GetName]. [FROM.GetLeader] запевнив, що ми маємо підтримку [FROM.GetName]."
 SEA_PRC_fourth_army_incident.1.desc:0 "Наші командири доповідають, що наш союз із [PRC.GetNameDef] призвів до тертя. Командири, що представляють [PRC.GetNameDef], за повідомленнями, вагаються виконувати наші накази, а іноді й відверто не підкоряються їм, погрожуючи створити проблеми для наших власних підрозділів."
 SEA_PRC_fourth_army_incident.10.a:0 "Ми завжди знали, що це зрештою станеться"
 SEA_PRC_fourth_army_incident.10.t:0 "[FROM.GetName] відновлює громадянську війну"
 SEA_PRC_fourth_army_incident.8.t:0 "[FROM.GetName] відмовляється вибачатися"
 SEA_PRC_misc_events.18.d:0 "Передати все"
 SEA_PRC_request_aid.10.desc:0 "[FROM.GetNameDefCap] погодився підписати угоду про технологічну співпрацю, яка значно збільшить нашу спроможність розвивати націю."
 SEA_PRC_request_aid.32.t:0 "[FROM.GetName] надсилає танки"
 SEA_PRC_request_aid.35.desc:0 "Вантаж прибув до [ROOT.Capital.GetName] з [SOV.GetNameDef], доставивши наші 150 новозбудованих танків БТ-7. Серед тих, хто приймав вантаж, були представники уряду [ROOT.GetName], а також провідні офіцери Сухопутних військ НВАК. Оглядаючи танки зі свіжонанесеною емблемою НВАК, офіцери прагнули розгорнути їх — після періоду навчання та ознайомлення для танкових екіпажів."
 SEA_PRC_request_aid.35.t:0 "Прибули новозбудовані танки від [FROM.FROM.GetName]"
 SEA_PRC_request_aid.4.t:0 "[FROM.GetName] просить танки"
 SEA_PRC_zhang_guotao_events.1.b:0 "Можливо, він має рацію?"
 SEA_PRC_zhang_guotao_events.4.b:0 "Переконати його залишитися"
 SEA_border_incidents_events.6.desc:0 "Після зіткнення між [MON.GetAdjective]ими та [JAP.GetAdjective]ими силами в прикордонній зоні навколо озера Буїр, [JAP.GetAdjective]ий посол в Улан-Баторі попросив про припинення вогню.\n\nКілька [JAP.GetAdjective]их штурмів на [MON.GetAdjective]і позиції провалилися з великими втратами під час бою, що викликало занепокоєння в [JAP.GetAdjective]ій армії щодо можливостей їхніх сил."
 SEA_china.17.a:0 "Чудово!"
 SEA_china.26.desc:0 "Ми отримали відповідь від [SOV.GetNameDef], в якій вони погоджуються надіслати нам групу експертів. Допомога має надійти незабаром, і коли це станеться, ми зможемо залучити фахівців до посилення нашого танкового корпусу."
 SEA_china.7.b:0 "Ми не проміняємо незалежність на обіцянки"
 SEA_china_democratic.17.desc:0 "Надійшло повідомлення з Нанкіна з безпомилковою печаткою центрального уряду. За витіюватою мовою про єдність і національну долю ховається вимога — ми повинні підкоритися [CHI.GetLeader] і визнати владу [CHI.GetNameDef] над нашими володіннями. Жодного місця для переговорів, лише послух або наслідки."
 SEA_china_democratic.3.desc:0 "[FROM.GetLeader] люб'язно прийняв нашу пропозицію офіційно оформити союз між нашими країнами і вже розпочав ініціативи щодо інтеграції в нашу сферу впливу. Сьогодні день для святкування!"
 SEA_china_warlords.5.t:0 "[FROM.GetNameDefCap] погоджується на інтеграцію"
 SEA_generic_events.2.desc:0 "[GetOppositionPartyAdjective] робітники на місцевій фабриці ненадовго зупинили виробництво, протестуючи за кращі умови праці та більшу політичну свободу. Хоча страйк мав обмежений масштаб, він демонструє популярність [GetOppositionPartyName]."
 SEA_generic_events.5.desc:0 "[GetOppositionPartyName] сьогодні провела один із найбільших мітингів за останній час, обіцяючи запропонувати сильну альтернативу уряду [ROOT.GetLeader]. Уряд наразі не впевнений, чи варто просто ігнорувати мітинг, чи запобігти поширенню новин про нього, оскільки інакше це може залучити нових прихильників до справи [GetOppositionPartyAdjective]."
 SEA_generic_events.9.desc:0 "Після нещодавніх повідомлень про заворушення армія та поліція незалежно одна від одної дійшли висновку, що члени [GetOppositionPartyName] перебувають під впливом інших країн, які прагнуть підірвати наш уряд або шпигувати за ним."
 SEA_generic_events.9.t:0 "Іноземні агенти використовують популярність [GetOppositionPartyAdjective]"
 SEA_imperial_influence_demand_event_option_3:0 "Велике починається з малого"
 SEA_imperial_influence_events.1.a:0 "Відкинути фракцію Армії"
 SEA_imperial_influence_events.160.desc:0 "Армія висунула свої вимоги. Схоже, вони прагнуть розширити можливості виробництва танків та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми будували більше танків для задоволення їхніх потреб у розширенні. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.240.desc:0 "Флот висунув свої вимоги. Схоже, вони прагнуть розширити свій авіаносний флот та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми замовили будівництво більшої кількості авіаносців для задоволення їхніх потреб у розширенні. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.310.desc:0 "Лідери Дзайбацу висунули свої вимоги. Схоже, вони прагнуть розширити свої холдинги та виробництва, а також свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми побудували більше цивільних фабрик для збільшення нашої промислової бази. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_japan_foreign_policy.102.t:0 "[FROM.GetNameDefCap] відхиляє валютний союз"
 SEA_japan_foreign_policy.11.t:0 "[FROM.GetNameDefCap] передає область [671.GetName]"
 SEA_japan_foreign_policy.117.desc:0 "[From.GetNameDefCap] ретельно розглянули нашу пропозицію «підтримувати порядок» у їхніх колоніях і вирішили відхилити її. Схоже, вони не дбають про інтереси азійських народів."
 SEA_japan_foreign_policy.130.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef], на жаль, відхилив наші вимоги про підкорення, заявивши, що воля народу — це незалежна демократія, а не революційна держава в [ROOT.GetAdjective]ій сфері. Вони зробили неправильний вибір..."
 SEA_japan_foreign_policy.29.a:0 "Принаймні тепер ми можемо зосередитися на інших напрямках"
 SEA_japan_foreign_policy.33.desc:0 "[FROM.GetLeader], лідер [FROM.GetNameDef], прийняв нашу пропозицію і пообіцяв заборонити протести проти нашої держави, а також готується придушити комуністичну діяльність у країні. Незабаром ми зможемо оформити з ними союз, щоб знищити гнійну виразку, яка загрожує привести всі народи Азії до неминучої загибелі."
 SEA_japan_foreign_policy.52.a:0 "Вони загрожують єдності Азії!"
 SEA_japan_foreign_policy.57.t:0 "[FROM.GetAdjective]ий тиск з метою підкорення"
 SEA_japan_foreign_policy.60.a:0 "Дайте їм відсіч, знищіть усіх зрадників!"
 SEA_japan_foreign_policy.68.a:0 "Процвітання вже близько!"
 SEA_japan_foreign_policy.74.desc:0 "[FROM.GetLeader], лідер [FROM.GetNameDef], розчарований відвертою зрадою колишніх союзників [FROM.GetName], звернувся до нас із проханням взяти на себе нову роль захисника їхніх земель і народу. Чи погодимося ми?"
 SEA_japan_foreign_policy.77.a:0 "Чудово!"
 SEA_japan_foreign_policy.81.a:0 "Ми розберемося з ними пізніше"
 SEA_japan_foreign_policy.89.t:0 "[FROM.GetAdjective]а делегація пропонує промисловість за ресурси"
 SEA_japan_foreign_policy.96.t:0 "[FROM.GetLeader] підписує всеосяжну дипломатичну угоду"
 SEA_japan_popup_events.11.t:0 "Чутки про народне повстання"
 SEA_japan_popup_events.23.a:0 "Дуже добре, Нобухіто займе його місце"
 SEA_japan_popup_events.3.a:0 "Це катастрофа!"
 SEA_japan_popup_events.32.c:0 "Ямакава Кікуе має найбільш революційні ідеї"
 SEA_japan_popup_events.37.desc:0 "Нам стало відомо, що в нашій країні зараз діють [FROM.GetAdjective]і осередки, які поширюють комуністичні настрої. Хоча саме по собі це здається досить нешкідливим, виглядає так, що частина пропаганди має досить революційний характер. Повідомлення про те, що робітників заохочують організовуватися та об'єднуватися, стають все частішими, і, судячи з недавньої історії, ми не можемо бути впевнені, що це не хитрий план [FROM.GetAdjective]ого керівництва з нашої остаточної інтеграції."
 SEA_japan_tokko_arrest_events.2.b:0 "Намагайтеся не розлютити [ENG.GetAdjective]ий уряд"
 SEA_japan_tokko_arrest_events.4.a:0 "Іноземні агенти отримують по заслугах!"
 SEA_warlords.10.t:0 "$KUM_yulbars_khan$ прибуває до Хотана"
 SEA_warlords.13.b:0 "Він отримає свій другий шанс"
 SEA_warlords.31.a:0 "Вони не залишають нам вибору"
 SEA_warlords.32.t:0 "[FROM.GetLeader] відмовляється"
 SEA_warlords.36.b:0 "Ми не відступимо!"
 SEA_warlords.36.c:0 "Тільки разом ми зможемо відбити цю загрозу!"
 SEA_warlords.37.desc:0 "Після заяви Нанкіна про те, що вони не відступлять перед жодними нашими погрозами, і нашої подальшої декларації про опозицію, є ті, хто побоюється, що Центральний уряд змусить нас підкоритися їхньому правлінню військовою силою."
 SEA_warlords.45.t:0 "[FROM.GetLeader] погоджується на об'єднання"
 SEA_warlords.6.desc:0 "[FROM.GetLeader] попросив нашої допомоги у боротьбі проти [SIK.GetLeader]. Хоча втрата їх означатиме втрату нашої опори в провінції, також життєво важливо не розгнівати Совєтів, оскільки це означатиме втрату потенційного партнера та гаранта."
