 INSHOL_economic_integration_desc:0 "Нідерландська Ост-Індія — це сяюча перлина нашої Імперії, її процвітання забезпечується впевненим керівництвом Королеви, Прем'єр-міністра та Генерал-губернатора. Ця стабільність не повинна піддаватися загрозі через безрозсудні заклики до незалежності, які принесуть лише безлад та занепад. Ми зв'яжемо економіки Нідерландів та Ост-Індії ще міцніше, забезпечуючи тривалу стабільність та велич."
