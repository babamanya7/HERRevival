 FIN_VICTORY_POINTS_3151:0 "Піетарі"
 FIN_bop_modifier_concerning_support_for_socialists:0 "Занепокоєння підтримкою соціалістів"
 FIN_confederated_finno_russian_republics_dec_cat_tt:0 "Рішення §Y$FIN_confederated_finno_russian_republics_category$§! дозволяють нам інтегрувати колишні [SOV.GetAdjective]і регіони з фінським населенням як осердні землі держави §Y[ROOT.GetNameDef]§!."
 FIN_deep_sea_raiders_desc:0 "Враховуючи військові зусилля, [ROOT.GetAdjective]і ВМС мусять нарощувати виробництво сучасних підводних човнів, щоб перервати ворожі лінії постачання та захистити наші власні торговельні шляхи. Ці гладкі та смертоносні судна вселять страх у серця ворогів моряків і допомогти захистити місце [ROOT.GetName] як морської держави."
 FIN_expand_air_force_academy_desc:0 "У рамках національних зусиль з удосконалення ВПС ми розпочнемо значне розширення Академії ВПС. Розширення включатиме не лише нові об'єкти, а й модернізацію підготовки пілотів із будівництвом нових повітряних полів у Каухаві та Тіккакоскі."
 FIN_expand_state_military_factories_desc:0 "Нашим державним заводам важко йти в ногу з вимогами, які висувають до них військові під час цієї кризи. Якщо ми хочемо зберегти лінії постачання, нам потрібно розширити наші виробничі потужності."
 FIN_finnish_supremacy_in_the_north:0 "Перевага Фінляндії на півночі"
 FIN_funds_from_kalevala_koru_oy_desc:0 "Kalevala Koru Oy, виробник вишуканих ювелірних виробів, заснований членами Соціал-демократичного жіночого союзу, досяг приголомшливого успіху. Використовуючи їхній досвід, ми можемо стимулювати нашу економіку та використовувати багатство для фінансування інших ініціатив."
 FIN_integrate_ingria_states_desc:0 "Існує більше регіонів, які можна інтегрувати до нашої новоствореної Інгерської Республіки, і [FROM.GetName] є одним із них."
 FIN_janiskoski_power_plant_desc:0 "Ми побудуємо електростанцію в Яніскоскі, щоб забезпечувати надійною енергією електроплавильний завод нікелевої шахти Колосйокі та сприяти зростанню території [722.GetName], що, у свою чергу, сприятиме економічному розвитку Північної [ROOT.GetName]."
 FIN_keepers_of_the_baltic_countries_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! вимагає анексії кожного суб'єкта або союзника Балтії у [ROOT.GetAdjective]ому альянсі.\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! вимагає кожну балтійську область, контрольована союзником.\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! претендує на кожну балтійську область, контрольовану нейтральною або ворожою країною.\n§YКожна балтійська область, яка вже контролюється [ROOT.GetFlag] [ROOT.GetNameDefCap]§!: Додається §G+30,0%§! підпорядкування."
 FIN_mio_trait_salvaged_and_retooled:0 "Відновлення та застосування"
 FIN_modernize_the_industry:0 "Модернізувати промисловість"
 FIN_nav_bomber_equipment_1:0 "VL Kotka"
 FIN_naval_airforce:0 "Морська авіація"
 FIN_search_for_weapon_caches_decision_cost_cp_blocked:0 "£command_power §R[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
 FIN_set_up_weapon_caches_in_state:0 "Налаштувати схованки зброї в області [FROM.GetName]"
 FIN_socialist_welfare_desc:0 "Завдяки дбайливому управлінню економікою та захистом нашої нації ми тепер маємо ресурси, щоб винагородити трудящих створенням справжньої соціальної держави. Ми гарантуємо, що наші люди проживуть довге та щасливе життя."
 FIN_socialist_welfare_if_kuusinen_tt:0 "\nВпливає, якщо §Y$FIN_otto_wille_kuusinen$§! буде призначено лідером країни до завершення цього фокусу:"
 FIN_subsidized_national_industrialization:0 "Субсидована національна індустріалізація"
 FIN_the_cold_front_desc:0 "Суворі зимові умови на фінському фронті вимагають належної підготовки. Необхідно забезпечити шляхи постачання та покращити тактику маскування, щоб забезпечити стійкість сил оборони перед обличчям зимового виклику."
 FIN_tire_factory_at_nokia_desc:0 "Під час конфлікту [ROOT.GetName] потребує джерела шин для військових, тому забезпечення надійного постачання для забезпечення мобільності та готовності наших збройних сил має бути пріоритетом.\nУ нас є план розширення Suomen шинного заводу Gummitehdas у Nokia та модернізувати виробничі лінії для використання синтетичного каучуку та перероблених матеріалів, щоби подолати ймовірну нестачу."
 FIN_utilize_the_sami_desc:0 "Ми повинні визнати унікальні навички саамів, які є досвідченими навігаторами в суворій арктичній місцевості. Використовуючи їхні знання про землю, ми можемо покращити наші розвідувальні можливості, а використовуючи їх як оленярів, ми можемо покращити наші лінії постачання у віддалених районах. Саами можуть відігравати важливу роль у нашій оборонній стратегії, і ми повинні забезпечити повне використання їхнього досвіду."
 FOCUS_FILTERED_CYCLE:0 "Відфільтр. $CUR$/$NUM$"
 FOCUS_FILTER_SOV_POLITICAL_PARANOIA:0 "Політична параноя"
