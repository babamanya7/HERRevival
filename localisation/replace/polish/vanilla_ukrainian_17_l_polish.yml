 PAP_communism:0 "Римська народна республіка"
 PAP_neutrality_ADJ:0 "Папськ"
 PAR_access_the_sea_desc:0 "Наша нація ніколи не мала порту з солоною водою, але очевидно, що будь-якій великій державі він потрібен для її національної безпеки. Ми повинні придбати його за будь-яку ціну."
 PAR_aftermath_of_the_coup_desc:0 "Країна спустошена, переживши удар за ударом. Війна Потрійного Альянсу, Чакський конфлікт, а тепер і друга громадянська війна залишили нашу землю спустошеною, але що ми можемо зробити, окрім як вистояти? Сьогодні починається велике відновлення, ¡Paz y justicia! За Парагвай!"
 PAR_brazilian_road_finance_desc:0 "[USA.GetName] переконав [BRA.GetAdjective] уряд інвестувати в розширення нашої дорожньої інфраструктури."
 PAR_get_rid_of_obsolete_guns:0 "Позбутися застарілої зброї"
 PASSWORD:0 "Пароль"
 PEACE_BIDDINGS_POPUP_REFUNDED_SCORE_TOOLTIP_DECREASE:0 "§HПовернені бали§! £victory_points $AMOUNT_REFUNDED$\n§HВитрачені бали§! £victory_points $AMOUNT_SPENT$\n§RВтрачені бали§! £victory_points $AMOUNT_LOST|R$\n\nЯкщо продовжити заперечення, з кожним разом повертатиметься все менше очок."
 PEACE_COST_BREAKDOWN_MAX_VALUE:0 "Межа вартості: $VAL|H$"
 PEACE_PUPPET_ALL_STATES_LABEL:0 "Маріонетка (всі області)"
 PEACE_RESOURCE_RIGHTS:0 "й ця область надасть права на видобуток ресурсів"
 PEACE_WAITING_PLAYERS_MAKE_DEMANDS:0 "Чекаємо на £players_icon£ гравців для пред'явлення вимог"
 PEACE_WINNERS:0 "Переможці"
 PER_abolish_feudalism:0 "Скасувати феодалізм"
 PER_bolster_infantry:0 "Посилити піхоту"
 PER_communist_events.12.desc:0 "Наші інженери з нетерпінням очікують надходження конфіденційних [FROM.GetAdjective] досліджень та розробок після рішення [FROM.GetAdjective]s поділитися з нами деякими військовими технологіями. Це значно прискорить наші власні розробки."
 PER_communist_events.12.t:0 "[FROM.GetNameDefCap] погоджується на передачу технологій"
 PER_construct_air_defenses_desc:0 "Нам потрібно встановити більше зенітних гармат уздовж кордонів, щоб захистити наші наступаючі війська від ворожих літаків."
 PER_donate_oil_fields:0 "Пожертвувати нафтові родовища [GER.GetNameDef]"
 PER_fascist_events.1.t:0 "Імперська рада скликається"
 PER_fascist_reach_out_to_japan_desc:0 "[JAP.GetAdjective] знають боротьбу за модернізацію своєї нації, водночас захищаючи свою культуру від руйнівних сил вестернізації. Ми повинні об'єднатися з ними, щоб зламати західний контроль над глобальною владою."
 PER_feat_of_engineering:0 "Інженерний подвиг"
 PER_food_for_all_desc:0 "На жаль, ми не чужі голоду. Завдяки роботі, яку ми проводимо для покращення економіки в рамках наших зусиль з модернізації, ми маємо можливість покращити розподіл продовольства та забезпечити, щоб кожен [PER.GetAdjective] мав доступ до однієї з наших основних людських потреб."
 PER_greater_iran_DEF:0 "Великий Іран"
 PER_imperial_events.10.b:0 "Можливо, ми можемо змусити їх заплатити за це?"
 PER_imperial_events.121.a:0 "Це полегшення..."
 PER_imperial_events.130.b:0 "Абсолютно ні, просуватися до столиці."
 PER_imperial_events.140.a:0 "Їх потрібно провчити"
 PER_imperial_events.162.t:0 "Відмова [FROM.GetNameDefCap] відступити"
 PER_imperial_events.180.b:0 "Це не варіант, продовжуйте війну."
 PER_imperial_events.200.b:0 "Ми не рідня, [SSB_leader.GetLeader]: ми вас не знаємо."
 PER_increase_faculty_staffing_budget_tt:0 "Модифікує §Y$PER_technological_modifier$§! на:\n"
 PER_international_solidarity_desc:0 "Хоча ми скинули імперіалістичні кайдани в межах наших кордонів, ми не будемо справді вільними, доки імперські держави не будуть витіснені з нашого регіону. Але ми ще не готові до повномасштабної конфронтації. Таким чином, ми почнемо підривати їхні володіння."
 PER_iranian_culture_desc:0 "Незважаючи на всю риторику політиків та шаха, жоден з них не бажає робити те, що необхідно для захисту нашої культурної спадщини та територіальної цілісності. Ми об'єднаємо розрізнених письменників та націоналістів у новий політичний рух, який відновить велич нації."
 PER_islamic_republic_neutrality_DEF:0 "Ісламська республіка Іран"
 PER_islamic_revolution_events.1.desc:0 "Здається, деякі рішення, які ми приймали щодо розвитку нашої нації, почали засмучувати низку представників духовенства. Оскільки їхня відраза продовжує поширюватися, ми повинні проявляти обережність, щоб не відштовхнути їх ще більше."
 PER_modify_opposition_tt:0 "Модифікувати §Y$PER_opposition_modifier$§! на:"
 PER_motor_organization:0 "Iran National Corp"
 PER_nationalize_oil_fields_desc:0 "Ми витратили багато років, торгуючи нашою нафтою в несправедливих угодах із жадібними націями. Настав час [PER.GetNameDef] націоналізувати свій видобуток нафти, а це означає, що ми нарешті отримаємо повний контроль над нашими власними природними ресурсами."
 PER_preparatory_mobilization_desc:0 "Не зумівши підготуватися, ми готуємося до поразки. Не секрет, що іноземні держави дивляться на [PER.GetNonIdeologyName] із заздрісними очима, і якщо вони захочуть її забрати, ми будемо битися до кінця. Здійснюючи підготовку до мобілізації нашої армії, ми будемо готові до всього, що наші вороги можуть нам кинути."
 PER_raiding_fleet_boost:0 "Досвідчені рейдери"
 PER_rally_the_reformers_desc:0 "У всій країні не бракує фракцій, які хотіли б побачити різкий кінець шаха або інституту монархії. У міру того, як світ починає дестабілізуватися, нові можливості можуть з'явитися для таких фракцій, щоб вони почали діяти."
 PER_ssb_events.10.t:0 "[PER.GetName] підписує угоду про експорт нафти"
 PER_ssb_events.2.a:0 "Чудово!"
 PER_strengthen_iranian_parliament:0 "Зміцнити Іранський парламент"
 PER_take_regional_tour:0 "Здійснити регіональний тур"
 PER_tehran_moscow_pact_desc:0 "Не секрет, що [SOV.GetNameDef] нависає над нами, як гігантський ведмідь на півночі. Якщо ми хочемо реалізувати наші експансіоністські ідеали, ми повинні якнайшвидше вирішити цю проблему. Ми можемо надіслати дипломатичного посланця до Москви, сподіваючись, що [SOV.GetAdjective]s будуть прихильними до пакту про ненапад."
 PER_upscale_military_production:0 "Збільшити військове виробництво"
 PER_venerate_islam_desc:0 "Іслам був основою нашого суспільства з часів, коли Стара Імперія була майже повністю зруйнована під час мусульманського завоювання Персії. З того часу він відіграє важливу роль у повсякденному житті більшості наших громадян. Замість того, щоб протистояти духовенству, можливо, настав час нам шанувати нашу релігію та показати світові, наскільки ми віддані Ісламу."
 PER_white_revolution_desc:0 "Модернізація [ROOT.GetNonIdeologyName] — нелегке завдання. Швидше, вона вимагатиме значної кількості агресивних реформ для досягнення цієї грандіозної мети. Ми назвемо це Білою революцією, або Революцією шаха та Народу, і вона приведе [PER.GetNameDef] на один рівень з великими націями на заході."
 PHI_align_with_japan_desc:0 "Попри свої заяви, Сполучені Штати Америки все ще є колоніальним господарем і можуть будь-якої миті відмовитися від своїх обіцянок. Тому було б розумно знайти нових друзів на міжнародній арені, і наразі Японія видається найбільш розсудливим вибором."
 PHI_american_intervention_change_value_small_decrease_tt:0 "Змінити §Yрівень загрози [USA.GetNameDefCap]§! на §G-10%§!"
 PHI_anti_intervention_strategies:0 "Стратегії протидії втручанню"
 PHI_anti_intervention_strategies_desc:0 "Зі зростанням напруженості між нами та Сполученими Штатами ми повинні зробити все можливе, щоб забезпечити довгострокову життєздатність нашої новонародженої комуністичної держави, чи то шляхом цільових поступок, чи то забираючи від них те, що можемо, перш ніж ця напруженість переросте у ворожнечу."
 PHI_decision_cost_convoys_icon_large_blocked:0 "[?PHI_convoy_vars_large_cost|0R] £GFX_topbar_convoys"
 PHI_department_of_foreign_affairs_desc:0 "Твердо ставши на міжнародну арену як незалежний суб'єкт, ми тепер відповідальні за власні дипломатичні дії. Ми повинні створити департамент закордонних справ, завданням якого буде керувати нашими дипломатичними зв'язками та розміщувати дипломатичний персонал по всьому світу."
 PHI_end_colonialism_desc:0 "Колоніалізм — це хвороба, якій дозволили гноїтися занадто довго. Усі люди заслуговують на право жити у свободі та демократії, і ми повинні будемо нав'язати це силою."
 PHI_has_built_at_least_one_infrastructure:0 "Побудовано щонайменше одну $infrastructure$"
 PHI_investment_fund:0 "Інвестиційний фонд"
 PHI_land_of_the_setting_sun_desc:0 "Наші приготування завершено. Час завдати удару настав! Час сонцю зайти востаннє над [JAP.GetNameDef], щоб ніколи більше не зійти."
 PHI_manila_tag_tt:0 "§Y[PHI.GetName]§! буде називатися §YФіліппіни§!"
 PHI_pan_pacific_trade_union_secretariat:0 "Секретаріат Пан-Тихоокеанських профспілок"
 PHI_reunite_madagascar_desc:0 "Хоча нас розділяють величезні відмінності, корінний народ малагасійців має змішане австронезійсько-африканське походження, що означає, що вони мають напрочуд тісні зв'язки з нашим народом. Ми повинні подолати цю відстань між нами."
 PHI_sea_of_cobalt_desc:0 "Дайте мені достатньо ядерної зброї, і я створю кобальтове море, через яке жоден ворог не зможе дістатися до нас."
 PHI_self_reliance_defense:0 "Оборона власними силами"
 PHI_subject_surrender_desc:0 "«Стало очевидним, що гарнізон цих сил зрештою буде знищений повітряним та артилерійським бомбардуванням, а також піхотою за підтримки танків, які нас переважають». Це було повідомлення, щойно отримане з одного з наших останніх укріплень, і з ним стає зрозуміло, що ми втратили контроль над [PHI.GetNameDef]."
 PHI_sugar_excise_divisions:0 "Фінансувати військові навчання із Цукрового фонду"
 PIERCING_THRESHOLD_TO_DAMAGE:0 "§Y> $THRESHOLD|%0$§! пробито = $DAMAGE|%H0$ шкоди"
 PLANE_COUNTS_PASSING_THROUGH_REGION:0 " ($COUNTS$)"
 PLAN_VALUE_LARGE_RIVER:0 "Форсування великої річки: $VAL|0+%$"
 POLITICS_GOAL_FAILED:0 "Ціль провалена!"
 POLITICS_GOAL_NOTIFY_FACTION:0 "Буде оповіщено Ваш альянс."
 POLITICS_IDEA_CANCEL_DESC:0 "Буде скасовано, якщо:"
 POLITICS_REMOVE_IDEA_TILE:0 "Видалити ідею"
 POLITICS_WARGOAL_INSTANT:0 "Стане ціллю війни відразу після підготовки."
 POL_CAS_equipment_1_short:0 "Karaś"
 POL_CAS_equipment_2:0 "PZL.46 Sum"
 POL_POWER_TOTAL_GAIN:0 "Загальний приріст: $VAL|2=+$"
 POL_ROM_UNION_democratic_DEF:0 "Польсько-румунська федерація"
 POL_align_with_habsburgs_desc:0 "Габсбурги сидять на тронах Польщі та Угорщини, можливо, настав час оформити наші родинні зв'язки у вигляді союзу."
 POL_april_constitution_5_desc:0 "$POL_april_constitution_1_desc$"
 POL_army_modernisation_desc:0 "Сучасна зброя для сучасних людей!"
 POL_beck_ribbentrop_desc:0 "Не секрет, що німці жадають анексії Гданську й інших колишніх німецьких територій, але, можливо, це не обов'язково має відбутися через кривавий конфлікт. Можливо, Юзефу Беку вдасться знайти дипломатичне вирішення суперечки на нашому кордоні."
 POL_clamp_down_on_danzig:0 "Затиснути Данциг"
 POL_clamp_down_on_danzig_desc:0 "Офіційно Данциг є вільним містом під польським захистом, але останнім часом місто потрапило під контроль нацистів і є маріонеткою Адольфа Гітлера в усьому, окрім назви. Ця вада на нашому північному кордоні є нічим іншим, як перешкодою для польської торгівлі, і ми повинні відновити контроль над містом, або ж ризикувати, що воно буде передане німцям."
 POL_cv_fighter_equipment_1:0 "PZL.50 Jastrząb Floty"
 POL_danzig_decisions_desc:0 "Данциг занадто довго був терном у польській економіці! Настав час взяти під контроль місто, але цього можна досягти лише за певної міри співпраці з місцевими жителями..."
 POL_declare_independence:0 "Проголосити незалежність"
 POL_demand_yugoslav_subjugation_desc:0 "Якщо наше прагнення до всеслов'янського об'єднання коли-небудь здійсниться, ми не повинні нехтувати південними слов'янами. Хоча між нами стоять державні кордони і великі гори, ми все одно є слов'янами."
 POL_dismantle_capitalist_empires:0 "Ліквідувати капіталістичні імперії"
 POL_exile_democratic_party:0 "ЛДП"
 POL_fighter_equipment_0_short:0 "PZL.11"
 POL_finno_polish_pact:0 "Фіно-польський пакт"
 POL_four_year_plan_complete_4:0 "$POL_four_year_plan_idea$"
 POL_infantry_at2:0 "ET-38 anti-tank grenade"
 POL_infantry_equipment_2_short:0 "Wz. 38 Mors"
 POL_invite_denmark:0 "Запросити Данію"
 POL_medium_tank_equipment_3:0 "41TP Husarz"
 POL_modernize_congressional_factories_desc:0 "Конгресова Польща є найбільшим та найбільш об'єднаним регіоном нашої країни і має найбільший потенціал для зростання у всій Польщі. Модернізуючи такі великі міста, як Варшава, ми перетворимо Конгресову Польщу на індустріальне серце нашої країни."
 POL_nav_bomber_equipment_1_short:0 "Foka"
 POL_non_discriminatory_recruitment:0 "Скасувати дискримінаційний призов"
 POL_push_for_ruthenia_desc:0 "Залізничні мережі України та Білорусі були вкрай занедбані, але ці території є такою ж частиною Речі Посполитої, як і будь-яка інша. Ми повинні інвестувати в східні рейки, якщо хочемо прорватися крізь радянську систему і повернути собі те, що належить нам."
 POL_restore_the_sejm_desc:0 "Прийняття Квітневої конституції була очевидною помилкою, яка потребує швидкого виправлення. Влада має бути повернута до Сейму, і вже звідти ми повинні вирішувати майбутнє нашої держави демократичним шляхом."
 POL_riot_of_37:0 "Варшавський бунт"
 POL_sanation_right_opposition_3:0 "Висока опозиція правої санації"
 POL_seek_accommodation_with_USSR:0 "Шукати зв'язки з СРСР"
 POL_seek_accommodation_with_USSR_desc:0 "СРСР хотів війни так само мало, як і ми. Можливо, є спосіб примирити нашу історію без кровопролиття."
 POL_ship_anti_air_3:0 "40mm/56 Bofors M36"
 POL_ship_torpedo_2:0 "4x 450-мм торпедний апарат"
 POL_smpa_organization:0 "SMPA"
 POL_soviet_military_staff_desc:0 "Зі створенням Другої Польської республіки багато лівих польських генералів втекли до СРСР, щоб продовжити боротьбу за світову революцію. Тепер, коли при владі перебуває союзний Радянському Союзу уряд, ці хоробрі вигнанці можуть повернутися додому."
 POL_the_defence_of_poland:0 "Оборона Польщі"
 POL_treaty_with_lithuania_desc:0 "Старі образи повинні залишитися в минулому. Кожен друг потрібен у темні часи, що попереду."
 POL_woo_the_sanation_generals_desc:0 "Військові-санаціоністи незадоволені і нелояльні до режиму. Хтось скаже, що чистка військовослужбовців викликана власною пихою Санації, але ми знаємо, що ці люди занадто цінні, щоб їх можна було замінити."
 POR_atlantic_defense_strategy:0 "Стратегія оборони Атлантики"
 POR_camisas_azuis_desc:0 "Camisas Azuis були озброєним ополченням націонал-синдикалістів, але групу було засуджено та розпущено через їхні ідеали. Ми повинні знову дозволити створення цієї організації, оскільки мобілізація синьосорочників забезпечить нашу армію цінним джерелом живої сили."
 POR_colonial_assimilation_policy_desc:0 "На відміну від інших країн, португальська нація визначається не расою, а спільною культурою та цивілізаційною місією. Замість расових упереджень нам потрібне змішання порід."
 POR_develop_south_angola_desc:0 "Пошуки ресурсів на півдні Анголи були успішними. Тепер ми можемо розвивати необхідну промисловість експлуатації."
