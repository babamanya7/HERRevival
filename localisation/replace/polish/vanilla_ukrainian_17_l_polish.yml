 GUAY_meet_with_the_old_powers_desc:0 "Наша країна невелика, але має великі амбіції, тому нам потрібні знання від великої держави, як отримати перевагу над нашими сусідами."
 GUAY_nationalize_foreign_owned_companies_desc:0 "Надто довго іноземні компанії експлуатували наші ресурси заради власної вигоди, більше цього не буде."
 GUAY_rekindle_old_gripes_BRA_PAR_tt:0 "Якщо ми контролюватимемо §Y[504.GetName]§! протягом §Y365 днів§! з моменту початку війни, [BRA.GetNameDef] доведеться укласти білий мир або зіткнутися з катастрофічною втратою морального духу."
 GUAY_the_stuff_of_legends_cores_tt_bol:0 "Контролює всі початкові претензії §YБолівії§!"
 GUAY_wool_makers_desc:0 "Вовна є важливим товаром для всіх, і ми готові її надати. Зрештою, всім потрібно залишатися в теплі взимку."
