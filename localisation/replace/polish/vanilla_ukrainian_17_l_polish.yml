 HND_UNIFIED_democratic_DEF:0 "Індостанська федерація"
 HOA_countryadjective_loyalist_advisors_desc:0 "Ми не можемо допустити, щоби наша держава та наша культура були захоплені імперіалістами. Нам потрібно привести тих, хто лояльний до [ROOT.GetNameDef], до керівних посад і розпочати процес відновлення нашої свободи."
 HOA_strengthen_the_irregulars_desc:0 "Система нерегулярнів й ополченців служила нам протягом століть. Існує мало причин змінювати те, що, як було доведено, працює."
