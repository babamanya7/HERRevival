 GER_uncertain_future_cat_desc:0 "Оскільки громадянська війна нарешті закінчилася, німецька нація повільно відбудовується. Але, здається, наче ми дрейфуємо без мети чи цілі на майбутнє, поки наші люди жадають стабільності та безпеки. Населення втомлюється від цієї невизначеності та вимагає стабільного курсу."
