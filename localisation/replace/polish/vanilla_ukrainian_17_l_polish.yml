 PRC_dalian_shipbuilding_company_organization:0 "Даляньська суднобудівна компанія"
 PRC_demand_warlord_loyalty_desc:0 "Ми повинні об'єднати Китай під єдиним керівництвом — і ми повинні чітко дати зрозуміти всім, чиє це буде керівництво.\n\nМи надішлемо повідомлення мілітаристам — пропозицію створити Уряд національної оборони. [CHI.GetLeader] може це не схвалити, але це необхідно."
 PRC_empower_the_guerillas_tt:0 "§GЗменшує вдвічі вартість§! прийняття рішень §Y$PRC_guerilla_warfare_sea_cat$§! та розблоковує рішення для заміни §Y$PRC_guerilla_cells_active_1$§! на §Y$PRC_guerilla_cells_active_2$§!. Чинні зміни:"
