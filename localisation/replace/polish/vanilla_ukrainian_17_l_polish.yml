 sp_nuclear_minor_progress_generic_reward_desc:0 "Під час роботи над останнім прототипом наші вчені зробили кілька дійсно проривних відкриттів. Їхні знахідки значно поглибили наші знання та дослідження в цій галузі."
 sp_rockets_dual_chamber_rocket_engine_1_desc:0 "Додавши до двигуна другу камеру згоряння, ми можемо покращити час польоту та ефективність наших ракетних двигунів."
 sp_rockets_flying_bomb_mass_production_scaling_reward_desc:0 "Нам вдалося розробити способи підвищення ефективності виробництва, які дозволять нам набагато швидше перейти до масового виробництва."
 sp_tag_helicopter:0 "Проєкти вертольотів"
 spain.11.a:0 "О ні!"
 spain.9.b:0 "Об'єднати консервативні групи під знаменом Фаланги."
 special_forces_bonus:0 "$special_bonus$"
 special_forces_mountaineers_desc:0 "Негостинне середовище та запеклі конфлікти приваблюють до наших елітних сил найсильніших солдатів. Закріплення їхньої першості в нашій доктринальній філософії гарантує, що ми й надалі отримуватимемо вигоду від набору найкращих."
 special_forces_rangers_desc:0 "Light infantry is key to our success. Sharpshooter traditions, and infiltration tactics should be core in building our elite formations."
 spy_master_goal_name:0 "Призначити керівника шпигунством"
 ss_recruitment_event.20.a:0 "Він забуває своє місце."
 ss_recruitment_event.8.t:0 "Вербувальна кампанія в Литві"
 stability.21.i:0 "Ми мусимо дати народу щось, за що варто воювати."
 stability.22.d:0 "Призовімо працівників на військову службу та помістіть заводи від контроль армії."
 stability.23.f:0 "Мобілізуймо лоялістські ополчення й арештуймо всіх солдатів не на місці ведення служби."
 stability.32.desc:0 "Our attempts at resolving the situation through military force have not been met with success. It appears that someone in our administration has leaked our planned operation to the public, which responded quickly. When military police and other law enforcement agencies tried to apprehend known draft dodgers, they found their way blocked by angry mobs, demanding an end to the war and to forced conscription. In several cases, street battles erupted between the police and the protesters, leading to a number of fatalities when the soldiers were forced to use their weapons to defend themselves. It took several hours until the police gained full control over the situation.\n\nAn ugly mood has settled over the capital as the barricades are cleared away and the dead are buried. Reports from the War Office show no change in the number of recruits reporting for duty. Many in the government wonder how much longer we can continue fighting under these circumstances."
 stalin_paranoid:0 "Параноїк"
 strikes_event.3.a:0 "Герої, всі вони."
 strikes_event.9.t:0 "Закон про захист прав трудящих"
 submarine_operations_desc:0 "Нам необов'язково вступати у відкриту битву з ворожими кораблями, щоби перемогти у війні. Можна завдавати ударів по чужих торгових суднах і йти на глибину перш ніж противник схаменеться. Важко воювати з тим, чого не бачиш."
