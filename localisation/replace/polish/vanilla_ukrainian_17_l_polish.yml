 MEX_decision_support_spanish_loyalists_desc:0 "Ми відправимо партію гвинтівок республіканському уряду для захисту демократії від незаконних узурпаторів Франко та його фашистських поплічників."
 MEX_focus_cientifico_camarilla_desc:0 "Режим Діаса підтримувався клікою технократів у кабінеті та приватному бізнесі. Непопулярний клієнтелізм і системи патронажу, які вони створили, були однією з причин краху режиму. Однак у нас є любов і підтримка людей, і Сентіфіко мають деякі вкрай необхідні навички..."
 MEX_focus_compensation_desc:0 "Нафтові концесії були законно продані «Royal Dutch Shell» і «Standard Oil». Ми не можемо звинувачувати іноземні фірми в пошуку прибутку. Ми повинні підтримувати цілісність нашої правової системи, компенсуючи іноземцям націоналізацію концесій."
