 HINT_PRODUCTION_LINES_TEXT_1:0 "Це екран §Yвиробництва§!, де показані Ваші виробничі лінії. Вони виробляють оснащення, потрібне для ведення війни. Рекомендовано виробляти оснащення і потрібне зараз, і яке знадобиться в майбутньому.\n\nЄ два типи виробничих ліній: військові та морські. Військові використовують £factory_item£ §Yвійськові заводи§!, а морські — £naval_factory_icon£ §Yверфі§!. Що більше заводів призначено для виробничої лінії, то швидше на ній вироблятиметься потрібне озброєння.\n\nВиробничу лінію можна створити, клацнувши по одній із чотирьох виділених кнопок угорі."
 HISTORICAL_FOCUS:0 "Цей фокус є частиною історичного шляху."
