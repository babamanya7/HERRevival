 BUL_dominance_in_the_black_sea_desc:0 "Темні часи вимагають вжити жахливих заходів. Щоб гарантувати не лише цілісність болгарської нації, а й її гегемонію, настав час убезпечити Чорне море, усунувши будь-які можливі загрози з його берегів."
 BUL_ff_deal_the_final_blow_tt:0 "Ми викорінимо Вітчизняний фронт раз і назавжди!"
 BUL_found_dvf_sopot_desc:0 "Будівництво фабрики боєприпасів у Сопоті було розпочате в 1935 році, але ще не завершене. Ми мусимо укласти договір на придбання решти машин й обладнання для введення комплексу в експлуатацію якомога швидше."
 BUL_freedom_of_press_desc:0 "Тепер, коли конституція відновлена, ми мусимо гарантувати її права та принципи. Дозвіл розповсюдження заборонених наразі газет може стати першим кроком до співпраці з певними організаціями."
 BUL_german_industrial_agreements_category_desc:0 "Поточні [GER.GetAdjective]і заводи: [?BUL.BUL_german_industrial_investments|Y0]\nБазова межа: [?BUL.BUL_industrial_investments_basic_cap|R0]\nВиконайте фокус §Y$BUL_approach_germany$§!, щоби збільшити межу до [?BUL.BUL_industrial_investments_medium_cap|G0].\nПриєднайтеся до альянсу §Y[GER.GetFactionName]§!, щоби збільшити межу до [?BUL.BUL_industrial_investments_max_cap|G0]."
