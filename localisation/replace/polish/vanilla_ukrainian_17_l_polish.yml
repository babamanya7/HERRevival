 EST_submarine_2:0 "Клас «Kalev»"
 ETH_a_guiding_hand_desc:0 "Роз'єднана коаліція комун без вищої влади є надто ідеалістичною. Нам потрібен кабінет представників та експертів, щоб керувати економічною політикою та швидко реагувати на надзвичайні ситуації. Ми ніколи не можемо дозволити собі повторити провали імперської адміністрації під час кризи."
 ETH_anarchist_bank:0 "Банк Африканського співтовариства"
 ETH_arms_purchases_tt:0 "Відмикає рішення про купівлю зброї у міжнародних торговців зброєю."
 ETH_assertiveness_desc:0 "Ми погодилися співпрацювати з [ITA.GetAdjective], щоби захистити нашу велику націю від знищення, тепер вони побачать, що нас позбавлять нашої ідентичності та культури, і ми станемо не більш ніж колонією. Ми не можемо допустити цього. Ми змусимо їх зрозуміти, хто ми є, і будемо протистояти їхній колонізації на кожному кроці."
 ETH_balance_range_tt:0 "\n§YОбласні модифікатори:§!\n$MODIFIER_LOCAL_BUILDING_SLOTS_FACTOR$: §Y0%§!\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §Y0%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §Y0%§!\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §Y0%§!\n$MODIFIER_ARMY_SPEED_FACTOR$: §Y0%§!"
 ETH_bop_increase_anarchist_influence_desc:0 "Ми мусимо забезпечити анархістам достатній вплив, щоби запобігти повторному обмеженню прав народу центральним урядом. Ми повинні розпочати кампанію пропаганди, щоби збільшити підтримку нашої справи серед людей."
 ETH_bop_increase_mesafint_privileges_desc:0 "Місцеві раси найкраще підходять для управління регіонами. Центральна влада в місті [ROOT.capital.GetCapitalVictoryPointName] не повинна перейматися дрібними деталями. Однак ми мусимо бути обережними, щоби не рухатися занадто швидко, інакше вони використають свою владу, щоб повністю вирватися на свободу."
 ETH_buy_tanks_from_host:0 "Придбати надлишкові [?ETH.host_nation.GetAdjective]і танки"
 ETH_buy_tanks_from_host_desc:0 "[ROOT.GetAdjectiveCap]ій армії катастрофічно не вистачає танків. На ринку є старі надлишкові танки, витративши частину імперської скарбниці на придбання кількох з них, можна дещо виправити ситуацію. Старі танки краще, ніж їх відсутність."
 ETH_communist_side:0 "Комуністи"
 ETH_develop_the_capital_region_tt:0 "Відмикає рішення про розширення електромережі, щоб охопити всю область [271.GetName]."
 ETH_ethiopias_cause_is_ours_desc:0 "[SWE.GetAdjectiveCap]ий уряд відходить від нейтралітету, оскільки він починає визнавати, що фашистський успіх в Африці також матиме наслідки в Європі. Наші цілі щодо самовизначення та поваги до міжнародного права збігаються, тому є сенс, щоби ми продовжували поглиблювати нашу співпрацю у зовнішній політиці."
 ETH_exploit_french_weakness:0 "Скористатися слабкістю французів"
 ETH_false_flag_border_incident:0 "Італо-німецький прикордонний інцидент"
 ETH_ger_and_ita_have_same_dieology_tt:0 "§Y[GER.GetFlag][GER.GetName]§! має ту ж ідеологію, що й §Y[ITA.GetFlag][ITA.GetNameDef]§!"
 ETH_horn_of_africa_tt:0 "Відкриває доступ до §Yрішення§!, яке дозволяє сформувати державу Африканський Ріг."
 ETH_international_brigades_communist:0 "Міжнародні бригади"
 ETH_invite_foreign_industrialists:0 "Запросити іноземних [ETH_GetInvestorName]"
 ETH_invite_foreign_prospectors_tt:0 "Відкриває доступ до рішень §Y$ETH_prospect_for_resources$§! на півночі держави [ROOT.GetName]. Для прийняття рішень потрібні технологія §Y$excavation2$§! та більш ніж §Y2§! доступні §Yцивільні заводи§!.\n\n"
 ETH_organization_of_african_unity_faction:0 "Організація африканської єдності"
 ETH_renewed_offensive_tt_1:0 "Змінює §Y$ETH_army_1_dynamic_modifier$§!:\n"
 ETH_seek_new_trading_partners_desc:0 "Люди по всьому світу жадають багатств, які може запропонувати наша країна, але ми застрягли в торгівлі виключно з [SOV.GetAdjective]. Ми повинні звернутися до інших країн, щоби показати, що ми не просто розширення [SOV.GetName], і почати повертати багатство людям [ETH.GetAdjective]."
 ETH_set_up_a_customs_barrier:0 "Установити митний бар'єр"
 ETH_social_reforms:0 "Соціальні реформи"
 ETH_the_defense_of_addis_ababa_desc:0 "Аддіс-Абеба є історичною столицею. Це також промисловий центр Ефіопії. Якщо місто впаде, наша справа програна. Ми повинні зробити все можливе, щоб утримати місто."
