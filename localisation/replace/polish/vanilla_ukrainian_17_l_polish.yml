 POR_they_need_our_help_desc:0 "Ситуація в Іспанії критична. Ми повинні діяти зараз, якщо ми хочемо запобігти тріумфу націоналістів. Ми приєднаємося до нашої іспанської родини в їхній боротьбі; разом ми переможемо повстанців!"
 POR_workers_of_iberia_unite:0 "Робітники Іберії, єднайтеся!"
 PRC_28_bolshevik_faction_decision_backstab_desc:0 "Хоча ми в одній фракції з [FROM.GetNameDef], ми підкупимо їхніх чиновників, щоб вони закривали очі, якщо ми захочемо залучити до роботи наших агентів"
 PRC_abolish_the_land_rent:0 "Скасування земельної ренти"
 PRC_asymmetric_warfare_desc:0 "Протягом століть армії, що поступалися чисельністю, прагнули подолати неможливі шанси, і ми повинні робити так само, використовуючи переваги, яких не мають наші вороги. Краще знання місцевості, зв'язки з місцевим цивільним населенням і партизанська тактика можуть бути використані для отримання переваги."
 PRC_bolshevik_urbanization_completed:0 "Пролетарі, єднайтеся!"
 PRC_commission:0 "Центральна військова комісія відділу розвідки"
