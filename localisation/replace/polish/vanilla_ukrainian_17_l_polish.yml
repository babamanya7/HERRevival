 sp_land_reward_option_stronghold_network_collapse_01_desc:0 "Тунель під одним із головних бункерів несподівано обвалився, внаслідок чого під завалами опинилися кілька робітників і провідний науковець, [Character.GetName], який керував роботами. Необхідно вжити екстрених заходів для порятунку персоналу, але інцидент вже призвів до затримки загального прогресу."
