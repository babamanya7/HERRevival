 NORDIC_becomes_military_industry_member_tooltip:0 "§Y$NORDIC_mil_industry_member_dmod$§! буде замінено на §Y$NORDIC_mil_industry_originator_dmod$§!, а §Rперестане очолювати [NORDIC_get_adjective]ої військової промисловості§!."
 NORDIC_court_foreign_power_desc:0 "Якщо ми хочемо досягти наших цілей щодо домінування, нам потрібна підтримка іноземних держав, таких як [FROM.GetName]. Приєднання до їхнього альянсу дасть нам перевагу, необхідну для змін на півночі."
 NORDIC_expand_volunteer_program:0 "Сприяти волонтерству для [FROM.GetAdjective]ого фронту"
 NORDIC_joint_military_exercises_desc:0 "Наші солдати й офіцери ніколи не стикалися з альянсом, подібним до того, у якому ми зараз, їх потрібно тренувати як одне ціле, доки спільна робота не стане другою натурою. Як тільки це станеться, сили [NORDIC_get_alliance_name] буде неможливо зупинити."
 NORDIC_mio_department_design_infantry_name:0 "Відділ піхотного спорядження"
 NORDIC_mio_department_design_tank_general_name:0 "Танковий відділ"
 NORDIC_naval_construction_desc:0 "Мати давні традиції мореплавства та моряків світового класу — це добре, але це нічого не означає, якщо у нас немає кораблів, щоб використовувати їх проти наших ворогів. Створімо разом великий флот і використаємо його розгромити будь-яку країну, яка загрожує нам."
 NORDIC_nordic_airforce_monarchist:0 "Сполучені королівські ВПС"
 NORDIC_shared_intelligence:0 "Спільна розвідка"
 NOR_anti_air_equipment_1:0 "7.5 cm L/45 M/16"
 NOR_anti_air_equipment_1_short:0 "7.5 cm L/45 M/16"
 NOR_anti_air_support_desc:0 "Незалежно від того, звідки походить загарбник, одне можна сказати напевно: вони намагатимуться використати свої літаки, щоб отримати контроль над небом і бомбити наші міста та війська. Це якщо ми не створимо протиповітряну оборону, щоб нейтралізувати будь-яку спробу з повітря."
 NOR_army_air_force_dmod_name_change_TT:0 "§Y$NOR_army_air_force_dmod$§! тепер називатиметься §Y$NOR_royal_air_force_dmod$§!"
 NOR_bought_tanks_from_us:0 "Придбали танки в нас"
 NOR_contain_the_labor_movement:0 "Стримувати робітничий рух"
 NOR_convert_merchant_ships_desc:0 "Наш торговельний флот є гордістю нашої економіки, але це не принесе нам нічого доброго, якщо загарбники знищать наші землі. Наші судноплавні магнати повинні будуть пожертвувати заради [ROOT.GetName] і дозвольте нам зробити ці судна боєздатними."
 NOR_destroyer_3:0 "Клас «Ålesund»"
 NOR_enhance_coastal_defense:0 "Покращити берегову оборону"
 NOR_heavy_cruiser_1:0 "Клас «Norge»"
 NOR_increase_research_funding:0 "Збільшити фінансування досліджень"
 NOR_lurk_in_the_shadows_desc:0 "Поки Стортінг їсть сам себе, ми скористаємося цим у своїх інтересах. Постійний провал парламенту є точкою згуртування, яка нам потрібна, щоб завербувати [NOR.GetAdjective]ий народ до Nasjonal Samling і в кігті фашизму."
 NOR_lynrytter:0 "Lynrytter"
 NOR_lynrytter_desc:0 "Тепер, коли було доведено, що бліцкриг є кращою стратегією, ми повинні прийняти її та проїхати на наших танках через лінію фронту наших ворогів. Сам Одін буде на нашому боці, коли наша броня принесе швидку перемогу [NOR.GetNameDef]"
 NOR_nationalize_the_hydro_plants:0 "Націоналізувати гідростанції"
 NOR_norges_rikstanksfabrikk_desc:0 "Тепер, коли ми навчилися основам бронетехніки, ми готові розробити власну національну програму виробництва танків, або Rikstanksfabrikk. Це єдиний спосіб гарантувати безперебійне постачання бронетехніки."
 NOR_soviet_industrial_cooperation_desc:0 "Немає сорому шукати допомоги у більших, розвиненіших країн. У війні за захист революції кожен робітник, селянин та інженер є нашим товаришем, і ми будемо вітати їхню допомогу для розвитку нашої промисловості, як і хотілося б якби ролі помінялися."
 NOR_stay_democratic_TT:0 "Прихильники фашистів §R[NOR.GetFascistLeader] повстають проти вас і підтримують фашистів-окупантів§!"
 NOR_the_voice_of_the_people_desc:0 "Ми повинні прислухатися до людей і створити інструменти для посилення цього голосу та поширення істин Маркса. Тільки тоді наша революція буде досягнута знизу вгору. Нехай люди вигукують свої вимоги щодо свободи від гніту капітал."
 NOR_trotsky_communism_DEF:0 "Північний революційний фронт"
 NOR_valuable_fascist_partner:0 "Цінний фашистський партнер"
 NOTIFICATION_OUR_GENERAL_WOUNDED_DESC:0 "[This.GetRank] §H[This.GetName]§! отримує поранення й відправляється в тил на лікування. [This.GetHerHisCap] ефектинвість упаде нижче звичного, допоки рана не загоїться."
