 PRC_form_the_5th_research_institute_desc:0 "Новини з останніх конфліктів надихнули на план будівництва дослідницького центру, зосередженого на реактивних та ракетних двигунах. Цей об'єкт можна використовувати для вдосконалення конструкцій наших літаків, а пізніше — для виробництва ракет."
