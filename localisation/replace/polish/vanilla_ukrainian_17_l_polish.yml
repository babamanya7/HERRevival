 AFG_caliphate_core_state:0 "Інтегрувати §Y[FROM.GetName]§! до нового Халіфату"
 AFG_claim_state_middle_east:0 "$AFG_claim_state$"
 AFG_encourage_jezail_production:0 "Заохочувати місцеве виробництво джезаїлів"
 AFG_establish_naval_bases_desc:0 "Зі створенням нашої першої військово-морської бази для постачання кораблів уздовж нашого нещодавно звільненого узбережжя, ми можемо розпочати важке завдання розвитку власного флоту."
 AFG_expand_the_kings_powerbase:0 "Розширити базу влади короля"
 AFG_graveyard_of_empires:0 "Кладовище імперій"
 AFG_ideology_on_the_rise_tt:0 "§R\n\nВеликі держави, які не поділяють ідеологію [THIS.GetNameDef], можуть захотіти вторгнутися в [ROOT.GetNameDef], якщо їхній вплив на нас стане надто високим! (Якщо [THIS.GetIdeologyNameWithCaps] перевищує 40%, інші держави можуть напасти на нас!)§!"
 AFG_industrial_events.10.desc:0 "Уряд [FROM.GetNameDef] запропонував спільне підприємство, в якому ми допоможемо їм у розробці нещодавно знайдених нафтових родовищ в обмін на довгострокові концесії на будь-яку видобуту нафту. Хоча пропозиція здається щирою, ми не можемо гарантувати, що збережемо доступ до нафти, якщо примхи [FROM.GetAdjective] уряду зміняться."
 AFG_industrial_events.15.desc:0 "Уряд [FROM.GetNameDef] висловив жорстку риторику щодо нашої націоналізації нафтової промисловості. Однак немає жодних ознак того, що вони мають намір вживати подальших заходів."
 AFG_industrial_events.31.desc:0 "Уряд [FROM.GetNameDefCap] запросив переговори щодо наших недавніх змін у річці Гільменд. Вони стверджують, що наші греблі та іригаційні системи знижують потік річки через кордон до небезпечного рівня. Деякі члени нашого кабінету запропонували укласти договір для регулювання потоку води через кордон. Це, ймовірно, означатиме зменшення переваг наших поточних змін уздовж річки, але також зменшить їхній вплив на [FROM.GetAdjective] народ за кордоном."
 AFG_industrial_events.32.b:0 "Нас задовольнить лише повне скасування змін."
 AFG_industrial_events.50.t:0 "Паштунський опір вкорінюється"
 AFG_industrial_events.52.desc:0 "Через триваючу напруженість уздовж деяких наших переважно паштунських територій, [FROM.GetAdjective] уряд мав нахабство звернутися до нас із пропозицією взяти під контроль неспокійні регіони. Ширяться підозри, що вони весь час стояли за останніми заворушеннями."
 AFG_integrate_tajik_and_uzbek_republics_desc:0 "Ми довели себе як безцінний актив для [SOU.GetNameDef]. Таким чином, здається справедливим, щоб ми вимагали територіальних поступок за наші зусилля. Це також має допомогти заспокоїти непуштунські меншини на півночі."
 AFG_kabul_conference_category:0 "Кабульська конференція"
 AFG_khorasan_communism_DEF:0 "Соціалістична республіка Хорасан"
 AFG_khorasan_fascism_ADJ:0 "Хорасанськ"
 AFG_mechanized_equipment_2:0 "Universal Carrier"
 AFG_ministry_of_supply:0 "Міністерство постачання"
 AFG_modifiy_amanullah_insurrection_modifier_tt:0 "Модифікувати §Y$AFG_amanullah_insurection_modifier$§! на:\n"
 AFG_motorized_equipment_0_short:0 "ZIS-5"
 AFG_political_events.101.t:0 "[FROM.GetNameDefCap] погоджується створити буферну державу"
 AFG_political_events.111.desc:0 "[FROM.GetNameDefCap] погодився передати штати, які ми у них просили. Після десятиліть суперечок ми нарешті можемо вітати наш давно втрачений народ."
 AFG_political_events.150.desc:0 "Уряд [FROM.GetNonIdeologyName] звернувся до нас із пропозицією зміцнити обидві наші нації шляхом незначної інтеграції наших військових економік. Це означало б, що обидві наші країни будуть зобов'язані допомагати одна одній у разі війни, але, можливо, це прийнятна ціна за тіснішу співпрацю?"
 AFG_political_events.150.t:0 "[FROM.GetNameDefCap] просить оборонний договір"
 AFG_political_events.157.desc:0 "Як було попередньо домовлено, [FROM.GetAdjective] обладнання було надано нам з моменту спалаху громадянської війни. Їхні оперативники в [ROOT.Capital.GetCapitalVictoryPointName] також запевнили нас, що таємні [FROM.GetAdjective] війська незабаром прибудуть до країни, щоб допомогти нам у боротьбі."
 AFG_political_events.52.a:0 "Як вони сміють зрадити нас!"
 AFG_political_events.85.t:0 "[FROM.GetNameDefCap] просить захисту"
 AFG_political_events.91.t:0 "Середньоазіатські республіки повстають"
 AFG_reclaim_the_emperors_lost_domain_desc:0 "Нарешті настав час. Оскільки нинішня світова ситуація є такою, якою вона є, немає кращого часу для удару по [SOV.GetNameDef]. Ми звільнимо всю Центральну Азію раз і назавжди!"
 AFG_restore_herat_desc:0 "Наперекір старому центру влади в Кабулі, настав час перенести столицю до головної резиденції Імперії Дуррані, Герату. Роблячи це, ми зможемо зміцнити нашу претензію на те, щоб бути наступниками цієї колись великої імперії."
 AFG_utilize_cameleers:0 "Використати погоничів верблюдів"
 AFG_work_with_gestapo:0 "Співпрацювати з [GER.GetAdjective] розвідкою"
 AIRBASE_DROP_PLANE:0 "§GПеремістіть обрані літаки сюди, щоби почати їхнє переміщення на базу $AIRBASE|H$.§!"
