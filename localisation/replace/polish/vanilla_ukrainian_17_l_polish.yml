 IRE_fascism_ADJ:0 "Ірландськ"
 IRQ_anglo_iraqi_oil_expansion_desc:0 "Нинішня домовленість з Англо-іракською нафтовою компанією може засмучувати наш народ, але вони недалекоглядні та не можуть осягнути переваг, які це приносить нашій економіці та захисту, який ми отримуємо від [ENG.GetAdjective]."
 IRQ_anti_western_alliance_tur_tt:0 "§Y[TUR.GetNameWithFlag]§! запрошується до нашої фракції"
 IRQ_approach_tribes_for_support:0 "Звернутися до племен по підтримку"
 IRQ_armored_car_equipment_1:0 "Humber"
 IRQ_demand_palestine_desc:0 "Британці виявилися ненадійними щодо захисту палестинського народу на мандатних територіях. Поки погляди світу спрямовані на них, ми можемо змусити їх до передачі мандату під наш контроль."
 IRQ_expand_habbaniya_airbase:0 "Розширити авіабазу Хаббанія"
 IRQ_extensive_irrigation_projects_413_tt:0 "Якщо ми контролюємо §Y[413.GetName]§!, ми отримаємо §G2§! додаткові слоти для будівництва в цій області"
 IRQ_kurdish_attack_iran:0 "Визволити курдів Ірану"
 IRQ_political_events.13.desc:0 "Уряд [FROM.GetNameDefCap] погодився передати територію, яку ми вимагали у них. Хоча наші військові були готові йти на війну за регіон, схоже, ми перемогли без бою."
 IRQ_political_events.15.a:0 "Справді полегшення."
 IRQ_political_events.16.desc:0 "Довівши свою лояльність до нас шляхом усунення [GER.GetAdjective] орієнтованих офіцерів зі своїх військових, [FROM.GetAdjective] уряд попросив можливість інтегрувати сусідній штат [455.GetName]. Зв'язки між королівськими родинами обох націй вже існують, і це зняло б з нас частину адміністративного тягаря."
 IRQ_political_events.17.t:0 "[FROM.FROM.GetNonIdeologyName] хоче керувати нами"
