 AIR_CATEGORY_UNKNOWN:0 "??? ($VAL$)"
 AIR_LEDGER_THRESHOLD_RESEARCHED_AND_CURRENT_TREE:0 "Досліджувані авіаційні доктрини й технології"
 AIR_MISSION_INTEL_RANGE_MISSILES:0 "$RANGE|H$ ракет(и) призначені на завдання $MISSION|H$ в цьмоу регіоні."
 AIR_REASSIGN_NO_WING_IN_REGION:0 "§TДо цього регіону не прикріплені жодні авіакрила.§!"
 AIR_REASSIGN_WING_IN_REGION:0 "§GКлацніть ЛКМ, а далі ПКМ по цільовому регіоні, щоби переприкріпити авіакрила.§!"
 AIR_SORT_BASE:0 "База"
 AIR_SUPERIORITY_FRIENDLY_PRESENCE_TYPE_4:0 "У зоні є активні дружні протиповітряні гармати"
 AIR_VIEW_AIRPLANES_IN_COMBAT:0 "Кількість літальних апаратів, які виконують §Hназемні завдання§! впродовж останнього періоду.\n\nЧисло в (§Hдужках§!) вказує на літаки, що пролітають через цей регіон для виконання завдань далі."
 AIR_VIEW_DAMAGE_TO_RAILWAY_GUNS_BY_ENEMY:0 "§HДружніх залізничних гармат розбомблено§!"
