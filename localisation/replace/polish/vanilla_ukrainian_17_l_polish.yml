 PRC_revolutionary_war_of_the_masses_desc:0 "Ми повинні чітко дати зрозуміти, що наша партія представляє звичайну людину більше, ніж це роблять корумповані та елітарні націоналістичні держави. Наша мета — боротися з цими силами та створити кращу систему."
