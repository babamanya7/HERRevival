 AUS_VICTORY_POINTS_6670:0 "Франкенштадт"
 AUS_bbo_focus:0 "Інвестиції в Bundesbahnen Österreich"
 AUS_danubian_communism_category:0 "Європейський комунізм"
 AUS_democratic_party_long:0 "Соціал-демократична робітнича партія Австрії"
 AUS_disregard_the_treaties:0 "Відмовитись від договору"
 AUS_establish_bohme_plan_tt:0 "§RНазавжди усуне Альфреда Янсу як можливого Головнокомандувача Армією!§!"
 AUS_guarantor_is_not_italy_key:0 "[FROM.GetNameDefCap] надіслав нам посла з проханням про допомогу. [FROM.GetAdjective] керівництво помітило тривожні тенденції з боку Німеччини, і оскільки Сен-Жерменський договір забороняє їм мобілізуватися, щоб протистояти загрозі, тепер вони більш офіційно просять нашої підтримки. У договорі та наступних контрактах ми погодилися їм допомагати... хоча немає жодної згадки, як саме має проявлятися ця «підтримка»."
 AUS_gw_armored_car_equipment_short:0 "ADGZ"
 AUS_hirtenberger_artillery:0 "Інвестувати в Hirtenberger Artillery"
 AUS_if_we_request_now_tt:0 "Якщо ми відправимо запит зараз, [GetAUSDiplomaticOutcome]\n\nЯкщо вони відмовляться, ми отримаємо §YЦіль війни§! на §Y[FROM.OWNER.GetNameWithFlag]§!"
 AUS_infantry_equipment_0_short:0 "Steyr M95/30"
 AUS_invest_in_kapsch_desc:0 "Щоб залишатися конкурентоспроможними на міжнародному ринку, нам постійно потрібно впроваджувати інновації та впроваджувати нові рішення. Інвестування в таку компанію, як Telefon- und Telegrafen-Fabriks-Aktiengesellschaft, яка займається як електронікою, так і радаром, може дати нам таку ширину в наших знаннях, з якою мало хто з опонентів може зрівнятися."
 AUS_liechtenstein_neutrality_ADJ:0 "Ліхтенштайнйськ"
 AUS_meticulous_preparations:0 "Ретельна підготовка"
 AUS_meticulous_preparations_desc:0 "Нехай в нашому уряді й народу існує спокуса якнайшвидше звільнити працівників навколо нас, але таким шляхом ми ризикуємо залишити наш внутрішній фронт відкритим. Наші зусилля в інших країнах спричинили певний галас у Австрії, ми повинні подбати про це, перш ніж допомагати іншим."
 AUS_motorized_equipment_1_short:0 "ADGR"
 AUS_news_events.9.desc:0 "Після збільшення підтримки [FROM.GetCommunistParty] у Австрії протягом тривалого періоду часу, [FROM.GetNameDef] зазнала мирного перевороту. Комуністи без жодного пострілу захопили владу в країні і з невеликим опором зайняли місце в уряді. \n\nЦе знаменує різкий поворот від того, чим австрійська держава було протягом останніх десятиліть."
 AUS_political_events.102.t:0 "Плани фюрера щодо експансії"
 AUS_political_events.105.b:0 "Як і слід було очікували. Нехай приходять!"
 AUS_political_events.106.desc:0 "У світлі нещодавньої напруги із Німеччиною, [ITA.GetAdjective]ий уряд звернулися до нас, щоб підтвердити свою підтримку. Незважаючи на загрози, вони гарантуватимуть нашу незалежність до кінця, а якщо справа дійде до збройного конфлікту, вони воюватимуть пліч-о-пліч з нами."
 AUS_political_events.11.a_tt:0 "Запускає місію щодо §Y[GER.GetAdjective]ої ворожості до нашого верховного військового командування§!\n\nНаша нездатність запобігти смерті Ценера, крім втрати військового радника, призведе до §Yзниження§! необхідної §YЗагальної Боєздатності Армії§! для §YАншлюсу§!."
 AUS_political_events.110.t:0 "В державі [FROM.GetNameDef] посилюються анти[ROOT.GetAdjective]і настрої"
 AUS_political_events.118.t:0 "Організація Імперії"
 AUS_political_events.123.a:0 "Разом ми повернемо нашу колишню велич!"
 AUS_political_events.13.desc:0 "Ми отримал протест проти ембарго, яке ми, як і вся Ліга Націй, встановили проти італійської країни. Стверджуючи, що ембарго необґрунтоване та безпідставне, керівництво Австрії вимагало його скасування з нашого боку.\n\nЩодо питання, чим саме уряд Австрії незадовольнило ембарго проти Італії, вони відмовляються уточнювати подробиці."
 AUS_political_events.25.t:0 "[FROM.GetNameDefCap] відкликає претензії на наші території"
 AUS_political_events.27.b:0 "Ми не допустимо ще однієї Великої Війни."
 AUS_political_events.35.t:0 "Воєнізована діяльність спричиняє громадянські заворушення"
 AUS_political_events.4.desc:0 "Фашистський кардинал Австрії, Теодор Інніцер, нещодавно радикально змінив свою риторику. Від голосної та публічної підтримки нацизму та [GER.GetAdjective]ого фюрера, під час масового мітингу 7-го жовтня він залізно зайняв анти-німецьку позицію. Замість своїх звичайних проповідей, цього разу він направляв натовп до релігії та віри в Бога, поки [GER.GetLeader] в його промові був зображений як безбожник. \n\nКерівництво Райху розлючене і потребує від нас певних заходів щодо нього."
 AUS_political_events.40.desc:0 "[FROM.GetNameDefCap] звернулася до нас із проханням приєднатися до нашого союзу. Вони розпочали зусилля з мілітаризації та висловили бажання працювати разом, щоб зробити нас обох сильнішими. Історично, їх нація була головною силою, з якою доводилося рахуватися на полі бою, але, хоча зараз вони ослаблені, вони все ще переконані, що будуть для нас найкориснішими союзниками."
 AUS_political_events.41.a:0 "Сила в кількості!"
 AUS_political_events.53.a:0 "Нарешті!"
 AUS_political_events.6.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію та надає нам доступ до придбання обладнання"
 AUS_political_events.65.t:0 "[FROM.GetNameDefCap] пропонує ринкову підтримку"
 AUS_political_events.69.desc:0 "[GetHowAvoidedAnschluss]"
 AUS_political_events.91.t:0 "[ROOT.GetLeader] бажає відвідати поле битви"
 AUS_political_events.96.desc:0 "[FROM.GetLeader], лідер нещодавно переробленій в демократичну націю Австрії, звернувся до нас із проханням приєднатися до нашого союзу, [ROOT.GetFactionName]. Незважаючи на те, що після закінчення Великої Війни вони залишалися самотніми, поточний політичний клімат і зростання напруженості у світі змусили їх змінити свої погляди. Переконавшись у своїй демократичності, вони вирішили звернутися до нас, запевнивши, що вони стануть великою перевагою для нашої фракції!"
 AUS_political_events.97.t:0 "[FROM.GetNameDefCap] вітає нас у альянсі"
 AUS_revitalize_austrian_air_industry_desc:0 "Колись в Австрії було кілька виробників літаків до та під час Великої Війни. Однак, через нав'язаний нам Сен-Жерменський Договір, це стало неможливим. Тепер, коли угоду анульовано, ми повинні швидко відновити нашу галузь і оживити її з нуля, якщо нам це знадобиться."
 AUS_second_brothers_war:0 "Остання братська війна"
 AUS_spur_the_communist_resistance_desc:0 "Навколишній світ став значно ворожішим як до простої людини, так і до робітника. Хоча нас самих, на щастя, ще не торкнулось найгірше, ми не можемо нехтувати стражданнями наших братів і сестер навколо нас."
 AUS_subject_DEF:0 "$OVERLORDADJ$а $AUS$"
 AUS_supporting_italy_in_ethiopia_focus_desc:0 "Довгий час Італія був на нашому боці. Як один з гарантів нашої незалежності, надзвичайно важливо, щоб ми залишалися з ними в хороших стосунках і не дозволяли німецькому мовленю вплинути на них. Допомагаючи Італії в Ефіопії, ми збудуємо довіру між нашими країнами та підвищуємо ймовірність того, що вони прийдуть нам на допомогу, якщо виникне така потреба."
 AUS_the_right_to_self_determination_desc:0 "Раніше ми покладалися на право на самовизначення, воно було нашим головним щитом перед загрозами. Тепер ми стоїмо по той бік; ми станемо захисниками тих націй, які зараз борються за своє виживання перед обличчям насильницької тиранії!"
 BAD_TEMPORARY_BUFF_NEGATIVE:0 "$BUFF_REASON$: $VALUE|%-1$ ($NUM_DAYS|0H$ дн.)\n"
 BAH_neutrality_ADJ:0 "Багамськ"
 BALTIC_allied_shipments_desc:0 "З 1918 року [Root.GetNonIdeologyAdjective]а армія отримувала спорядження з Великої Британії. Нам потрібно донести до Союзників, що якщо обсяг цих поставок не буде значно збільшений, [Root.GetNonIdeologyName] може стати черговою."
 BALTIC_baltic_fleet_desc:0 "[Root.GetNonIdeologyAdjective]ий флот не особливо розвинений, але при правильному інвестуванні він, можливо, ще зможе захистити державу [Root.GetNonIdeologyName] від вторгнення з моря."
 BALTIC_belarus_democratic:0 "$NONIDEOLOGYADJ$о-білоруська республіка"
 BALTIC_entente:0 "Балтійська Антанта"
 BALTIC_entente_desc:0 "Ми, балти, поділяємо братерство, яке характеризується нашою довгою історією страждань під іноземним імперіалізмом. Ми не можемо знову піддатися іноземним державам, зробити це означало б передати ключі від нашого суверенітету ще одній імперіалістичній силі. Лише об'єднавшись, ми можемо сподіватися зберегти незалежність."
 BALTIC_events.13.a:0 "Розробити з ними!"
 BALTIC_events.18.d:0 "[From.GetNameDefCap] починає впливати на [Root.GetAdjective] політику, розповсюджуючи на наших вулицях комуністичну пропаганду та озброюючи дисидентів. Лише протистоїть цій пропаганді, ми можемо сподіватися заборонити її і позбутися [From.GetAdjective]ої загрози."
 BALTIC_german_war_economics_desc_default:0 "Німці зараз перебувають у процесі швидкої військової індустріалізації, яку рідко бачила Європа. Правильно скористатиметься їх прикладом і запитатиме інвестиції у Райхсбанку."
 BAN_communism_ADJ:0 "Бенгальськ"
 BAS:0 "Британські Антили"
 BAS_communism:0 "Британо-антильська комуна"
 BAS_fascism:0 "Звільнені держави Британської Вест-Індії"
 BAY_fascism_ADJ:0 "Баварськ"
 BBA_SWI_annual_election.1.a:0 "Обрати [SWI_GetCouncilor1name]"
 BBA_african_union_events.1.desc:0 "Організація Африканської Єдності проголосувала за надання нам статусу члена. Метою Організації є об'єднання африканських націй задля обговорення та співпраці у спільних питаннях. Якщо ми приєднаємося, це може привести до угод про взаємну оборону між державами-членами. Водночас, нам доведеться дотримуватись правил організації."
 BBA_african_union_events.10.desc:0 "[FROM.GetNameDefCap] розпочали пропагандистську кампанію на нашій території, щоб покращити сприйняття Організації Африканської Єдності. Без сумніву, це зроблено з метою тиску на нас для активнішої інтеграції в організацію."
 BBA_african_union_events.12.desc:0 "Африканський Союз розпочав процес повної інтеграції нашої країни в їхній союз. Сподіваємося, що це стане початком нового позитивного розділу в історії нашого народу, хоча остаточна мета Африканського Союзу ще залишається незрозумілою."
 BBA_african_union_events.9.desc:0 "Уряд [FROM.GetNameDef] відмовився приєднатися до виконавчої ради Організації Африканської Єдності. [FROM.GetLeader] заявив про [FROM.GetLeader.GetHerHis] занепокоєння щодо суверенітету та бажання укладати угоди з іншими країнами без узгодження з радою."
 BBA_ethiopia_anti_colonialism_events.2.a:0 "Вони праві. Нам слді закінчити цей колоніальний конфлікт негайно."
 BBA_ethiopia_anti_colonialism_events.4.a:0 "Принаймні ми спробували."
 BBA_ethiopia_balance_of_power_events.54.b:0 "На жаль, наразі ми мало що можемо зробити."
 BBA_ethiopia_balance_of_power_events.56.desc:0 "Робота, проведена центральним урядом для поліпшення управління держави [ROOT.GetName] та інтеграції різних регіонів, призвела до економічного буму в області [?ROOT.ETH_bop_state.GetName]. Регіон приваблює іммігрантів з інших частин країни, а промисловість розширюється."
 BBA_ethiopia_communist_events.03.a:0 "Вони заплатять за цю агресію."
 BBA_ethiopia_communist_events.18.a:0 "Мусимо знайти інший шлях."
 BBA_ethiopia_communist_events.25.b:0 "Ми допоможемо їм. За відповідну ціну."
 BBA_ethiopia_communist_events.27.desc:0 "[SOV.GetNameDefCap] відступили від своєї обіцянки припинити загарбницьку війну [ITA.GetName]. Схоже, їхня готовність до війни була лише блефом. Тепер нам доведеться самотужки намагатися завершити цю війну."
 BBA_ethiopia_communist_events.31.a:0 "Нарешті, кінець кровопролиття."
 BBA_ethiopia_communist_events.52.desc:0 "[ETH.GetAdjective] адміністрація організувала операцію з метою розірвати наш контроль над справами держави. [SOV.GetAdjective] персонал по всьому [ETH.Capital.GetCapitalVictoryPointName] був під конвоєм [ETH.GetAdjective] військ доставлений до імпровізованих центрів утримання, після чого [ETH.GetLeader] повідоми[ETH.GetLeader.GetVerbGendEndA_RU] нашого посла, що відтепер [ETH.GetLeader.GetSheHe] особисто контролюватиме всі справи [ETH.GetAdjective]. Якщо ми діятимемо швидко, ще є шанс повернути контроль над ситуацією. Однак вікно можливостей стрімко закривається."
 BBA_ethiopia_exile_events.02.t:0 "Зросла активність бойовиків на півночі [ETH.GetName]"
 BBA_ethiopia_exile_events.03.desc:0 "Є кілька повідомлень про напади на [ROOT.GetAdjective]і сили на півдні [ETH.GetName]. Вважається, що за цими нападами стоїть організація, яка називає себе \"Чорні льви\""
 BBA_ethiopia_exile_events.11.a:0 "Це чудова новина!"
 BBA_ethiopia_exile_events.20.a:0 "Чудова новина"
 BBA_ethiopia_exile_events.22.desc:0 "Судячи з усього, [ROOT.GetLeader], пообіцяв [FROM.GetLeader] один з островів [ROOT.GetName] для використання в якості бази для уряду, і для початку реконкісти [FROM.GetName]. Це є офіційним визнанням [FROM.GetLeader] правителем [FROM.GetNameDef], і буде сприйнято як оголошення війни [ITA.GetName]. Однак, це також можливість розширити вплив [ROOT.GetNameDef]."
 BBA_ethiopia_exile_events.45.t:0 "Посередництво пройшло успішно"
 BBA_ethiopia_exile_events.51.desc:0 "[GER.GetAdjectiveCap]ий уряд висловив гнівний протест після інциденту на італійсько-німецькому кордоні. Хтось відкрив вогонь. Повідомлення вкрай суперечливі, деякі стверджують, що перестрілка почалася з італійської сторони, в той час як жоден з прикордонників, що залишилися в живих, не зізнався, що стріляв до того, як німці відкрили по них вогонь. Той факт, що італійські солдати не перебували за будь-яким укриттям, ще більше посилює ці свідчення."
 BBA_ethiopia_exile_events.54.t:0 "Зусилля зі збору коштів"
 BBA_ethiopia_fascist_events.71.desc:0 "[FROM.GetName] відмовився надсилати своїх офіцерів до нашого генерального штабу. Нам повідомили, що вони зараз потрібні в інших місцях. Проте, на знак підтримки, ми отримали додаткову партію піхотного обладнання."
 BBA_ethiopia_imperial_events.11.b:0 "У нас є важливіші справи."
 BBA_ethiopia_imperial_events.21.a:0 "Вони підкоряться нашому правлінню, хай там що."
 BBA_ethiopia_military_and_tech_events.1.t:0 "[GetEthiopianMilitaryAcademyName] випускає перший клас"
 BBA_italo_ethiopian_war_events.112.desc:0 "Незважаючи на загрозу війни з боку членів Ради Ліги Націй, [FROM.GetLeader] залишається націленим на знищення держави [ROOT.GetName]. Рада наказала негайно припинити військові дії, але [FROM.GetName] демонстративно відмовляється підкорюватися."
 BBA_italy_anti_colonialism_events.01.e:0 "Ми збережемо статус-кво."
 BBA_italy_anti_colonialism_events.06.a:0 "Favoloso!"
 BBA_italy_anti_colonialism_events.101.desc:0 "Великий і мудрий [FROM.GetLeader] з [FROM.GetAdjective]ого народу погодився приєднатися до нас і об'єднатися в одну країну! Це знаменний день як для держави [ROOT.GetName], так і для держави [FROM.GetName]!"
 BBA_italy_anti_colonialism_events.62.desc:0 "Жителі Близького Сходу побачили, як доброзичливо та ефективно ми управляємо їхніми землями, і проголосували за те, щоб приєднатися до нашої адміністрації! Здається, що наші інвестиції та турбота про їхні провінції окупилися. Це, безумовно, піде на користь усім нам."
 BBA_italy_civil_war.6.a:0 "Ми знову господарі власної долі"
 BBA_italy_civil_war.7.b:0 "Нам треба погодитись..."
 BBA_italy_communist_events.05.desc:0 "Нещодавно ми завершили спільні навчання з [FROM.GetAdjective]ими військовими. Наші генерали та адмірали раді повідомити, що вони пройшли з великим успіхом і що наші військові показали себе дуже добре. Це зміцнить наші зв'язки з державою [FROM.GetName] і наші власні можливості."
 BBA_italy_decide_the_fate_of_mussolini.2.a:0 "Виправдати його."
 BBA_italy_interaction_events.24.b:0 "Попросити про допомогу."
 BBA_italy_interaction_events.25.t:0 "Італійці виступають проти нас"
 BBA_italy_interaction_events.38.a:0 "На все воля Божа!"
 BBA_italy_interaction_events.43.desc:0 "Держава [FROM.GetName] грубо відкинула нашу пропозицію захисту, і ми покажемо їм, що означає йти проти нас у прямому сенсі цього слова. Вони схиляться перед нами!"
 BBA_italy_interaction_events.667.a:0 "Благословенне [FROM.GetAdjective]е керівництво!"
 BBA_italy_local_rulers.3.desc:0 "З нами зв'язався повалений абіссинський вельможа Хайлу Текле Гайманот, який стверджує, що ми можемо бути корисними один одному. Він пропонує нам свої послуги в обмін на посаду в нашому уряді в Абіссинії. Оскільки він є колишнім правителем, це може слугувати нашим цілям, але те, що він є колишнім правителем, матиме наслідки для місцевого населення, яке, можливо, виступить проти його правління."
 BBA_italy_missiolinis.133.a:0 "Блискуча перемога."
 BBA_italy_missiolinis.211.desc:0 "Дуче постійно наголошує на браку компетентності та досвіду у вищому військовому командуванні ще з часів італо-абіссинської війни. Він хотів би виправити це, просуваючи гідних кандидатів на вищі військові посади, щоб посилити наші стратегічні й тактичні міркування в майбутніх конфліктах."
 BBA_italy_missiolinis.61.desc:0 "Сучасна армія живиться не тільки харчами, але й пальним. Якщо нічого з цього не буде, вся воєнна машина просто стане. Вище командування Італії нарешті переконало дуче, що сучасна армія просто не зрушить із місця від нестачі пального. Воно необхідне всім відділам збройних сил, і ми мусимо могти надати пальне у великих об'ємах, якщо хочемо здобути перемогу на полі бою."
 BBA_italy_missiolinis.73.desc:0 "Муссоліні особисто зацікавився зміцненням ВПС і використав збірку нових літаків як можливість представити італійський індустріалізм. Уже зроблено кілька пропагандистських праць, які хвалять італійські авіацію та машинобудування, ставлячи Regia Aeronautica в центр уваги."
 BBA_italy_missiolinis.83.desc:0 "Розрекламований технологічний стрибок, який була здатна здійснити фашистська система, окупився, і Муссоліні без вагань представив інновації, досягнуті під його керівництвом. Послання однаково стосується фашизму, як і Муссоліні та його бачення Італії. Чи згуртує й об'єднає це італійців так, як дуче на це сподівався, іще не очевидно."
 BBA_italy_naval_cooperation_programs.04.t:0 "Спільні маневри з [FROM.GetAdjective]им ВМС"
 BBA_italy_research_agreement.1.a:0 "Це може послужити нам на користь."
 BBA_swiss_expansion.14.t:0 "[FROM.GetName] Відкинув наші претензії на Альпи"
 BBA_switzerland.14.a:0 "Заспокоїмо їх, але проігноруємо вимоги"
 BBA_switzerland.16.t:0 "[FROM.GetNameDefCap] пропонує таємний пакт"
 BBA_switzerland.17.t:0 "[FROM.GetNameDefCap] погодився на таємний пакт"
 BBA_switzerland.4.a:0 "Це вже зроблено."
 BBA_switzerland.9.a:0 "Вони за це заплатять!"
 BEL_AUS_danubian_state_ADJ:0 "Бельгійсько-дунайськ"
 BEL_HOL_autonomy_eu_member_ADJ:0 "Бельгійськ"
 BEL_belgian_gates:0 "Бельгійські ворота"
 BEL_cockerill_shipyards:0 "Суднобудівні верфі Cockerill"
 BEL_develop_belgian_air_industry_desc:0 "Ми не маємо багато досвіду у виробництві власних літаків, оскільки авіаційна промисловість була слабо розвинута після останньої війни. Однак є багато інноваційних молодих дизайнерів та стартапів, яких ми могли б субсидіювати та допомогти розвивати."
 BEL_develop_home_support:0 "Розвиток підтримки вдома"
 BEL_dissolve_political_parties:0 "Розпустити політичні партії"
 BEL_eben_emael_fortress_bypass_tt:0 "Неможливо побудувати щонайменше 2 §Y$bunker$и§! в §YЛьєж§!"
 BEL_embrace_export_economy_desc:0 "Хоча ми ніколи не були настільки відомі в цьому, як наші північні сусіди, [ROOT.GetNameDef] має горду традицію торгівлі, зосередженої в місті Антверпен. Давайте скористаємося цією потенційною вигодою — зрештою, це просто вигідний бізнес."
 BEL_european_community_desc:0 "Початкові етапи Європейського проєкту пройшли успішно, тому ми повинні розглянути можливість розширення нашого членства і ратифікації низки угод, що визначають майбутнє нашої спільноти. Ми навіть можемо розглянути можливість рухатися до більш федеральної моделі, з Бельгією в ролі лідера в самому серці цієї спільноти."
 BEL_gold_reserves_industry:0 "Схвалити національну промислову програму"
