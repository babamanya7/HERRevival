 RAJ_the_bangalore_torpedo_desc:0 "Одним із головних внесків Британської Індії у військову справу стала бангалорська торпеда — конструкція зі з'єднаних труб, що дозволяла саперам підривати перешкоди, перебуваючи під ворожим вогнем. Цей пристрій набув великої популярності у всьому світі."
 RAJ_the_peoples_liberation_army_desc:0 "Дисциплінована та ідеологічно віддана сила, Народна Визвольна Армія очолить наступ на національне визволення. Сформована з робітничого класу та селянства, вона готова захищати революцію та створювати новий лад."
