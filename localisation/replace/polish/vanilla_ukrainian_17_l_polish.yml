 HABSBURG_industrializing_our_capitals_desc:0 "Більшість столиць нашої федерації — старі, історичні міста. Хоча це добре і говорить про довгу та багату історію наших членів, рівня індустріалізації в них зараз... міг би бути ліпше. Спільні зусилля щодо подальшої індустріалізації цих міст можуть виявитися дуже корисними."
 HABSBURG_meeting_the_logistical_challenge_desc:0 "Логістичні проблеми зростають разом із нашою федерацією. Зараз постачанню потрібно більше часу, щоб дістатися до наших військ, і ми боїмося, що якщо це не зупинити, то це може стати проблемою в майбутньому. Наші війська мають бути навчені робити більше з меншими витратами, а розподіл постачання військам має бути покращений."
