 COG_offer_uranium_sales_decision:0 "Запропонувати продаж урану §Y[FROM.GetNameWithFlag]§!"
 COG_reclaim_kigali_desc:0 "Ми не можемо вважати себе новим Королівством Руанда, якщо не контролюємо нашу стару столицю. Ми повинні зробити все можливе, щоб повернути цей регіон!"
 COG_reestablish_the_royal_council_desc:0 "Королівська рада Королівства Конго, яку часто називали вершинами влади, була керівним органом чиновників і дворян колись. Ми повинні відновити її, адже жоден король не може правити самотужки."
