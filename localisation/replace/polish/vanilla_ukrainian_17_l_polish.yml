 raid_type_nuclear_strike_desc:0 "Стратегічний бомбардувальник і його супровід долетять до визначеної цілі та скинуть атомну бомбу. Потім бомбардувальник намагатиметься покинути зону, щоби не потрапити у вибухову хвилю."
 raid_type_rescue_captured_general_desc:0 "Група бійців проникає в тил ворога, щоб знайти та врятувати командира, якого супротивник тримає в полоні."
