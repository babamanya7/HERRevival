 CLEAR_ALL_OVERRIDE_LAWS_AUTO_DESC:0 "Чи хочете Ви прибрати всі перелічені заміни закону та змінити закон на стандартний?"
 COG_a_german_protectorate:0 "Німецький протекторат"
 COG_a_multiethnic_conglomeration_desc:0 "Наша суспільство завжди складалося з багатьох етнічних та лінгвістичних груп, і це йшло йому на користь. Ми повинні заохочувати таку поведінку і змінювати стосунки між завойовниками і підкореними."
 COG_african_research_and_development_department_desc:0 "Щоб досягти прогресу, ми повинні створити спільний африканський підрозділ наукових досліджень і технологічного розвитку, який об’єднає технічні знання багатьох африканських держав."
