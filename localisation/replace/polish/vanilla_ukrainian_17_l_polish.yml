 HUN_arrow_cross_party_hungarist_movement_long:0 "Націонал-соціалістична угорська партія — гунгаристський рух"
 HUN_balkan_ambitions_desc:0 "Балканські робітники знаходяться під п’ятою капіталістів, монархістів та фашистів — ворогів світової революції. Ми повинні звільнити їх, якщо хочемо миру на Балканах."
 HUN_dismissed_fascist_generals_flag:0 "Фашистських генералів звільнено"
 HUN_establish_the_air_force_desc:0 "Оскільки легальні обмеження більше не перешкоджають нам шлях, настав час офіційно заснувати військово-повітряні сили Угорщини."
 HUN_every_vitez_tt:0 "Кожен §YВітез§!:"
 HUN_form_parachute_battalions_desc:0 "Висадка піхотних частин з повітря дозволить нам швидко реагувати на несподівані загрози або тактичні можливості."
 HUN_national_academy_of_sciences_category_desc:0 "Для подальшого розвитку та прогресу нашої нації, ми зосередимось на розширенні нашої національної академії наук."
 HUN_reintigrate_crisana:0 "Реінтегрувати область [83.GetName]"
 HUN_submarines_desc:0 "У попередній війні підводні човни майже впоралися з одним із найпотужніших флотів. Щоби не стати посміховиськом у сучасному світі, нам необхідні власні підводні сили."
 HUN_support_urbanization_desc:0 "Все більша частина населення залишає села та селища, щоб осісти у великих містах у пошуках роботи на нових заводах. Забезпечити роботою всіх бажаючих неможливо, але ми можемо розпочати будівництво нових житлових районів, заклавши фундамент для майбутнього розширення."
 HUN_sweden_hungary_unified_fascism:0 "Пан'європейський національний рух"
 HUN_tac_bomber_equipment_2:0 "RMI-13 X/H"
 HUN_the_balkan_pact:0 "Балканський пакт"
 HUN_the_balkan_pact_desc:0 "Демократичні західні держави надто далеко, щоби надавати нам допомогу, тому слід знайти союзників серед сусідів. У ролі лідера Балканського пакту ми об'єднаємо їх, захистимо та поведемо у світле майбутнє!"
 HUN_the_danubian_federation_category:0 "Дунайська федерація"
