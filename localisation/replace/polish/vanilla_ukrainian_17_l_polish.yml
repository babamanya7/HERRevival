 AST_mechanized_equipment_1:0 "Bren Carrier LP"
 AST_mio_trait_acf_arsenal_of_the_pacific:0 "Арсенал Тихого океану"
 AST_mio_trait_morts_dock_convoy_protection_protocols:0 "Протоколи захисту конвоїв"
 AST_modern_tank_artillery_equipment_1:0 "Centurion AVRE"
 AST_no1_flying_training_school:0 "1-ша льотна тренувальна школа"
 AST_off_leash:0 "Зірватися з ланцюга"
 AST_overseas_loyalties:0 "Заморська лояльність"
 AST_promote_reservists:0 "Підвищити резервістів"
 AST_reinforcements:0 "Підкріплення"
 AST_research_collaboration_desc:0 "Британці показали нам, який зиск дає обмін науковими розробками між найближчими союзниками. Весь наш альянс зможе ефективніше проводити дослідження у воєнний час, якщо ми зуміємо скоординувати цей процес."
 AST_scale_up_pilbara_mines_steel_decision_desc:0 "Тепер, коли регіон Пілбара відкрито для великомасштабного видобутку, настав час дозволити інвестиціям текти рікою!"
 AST_scrap_iron_flotilla_taog_desc:0 "Розкритикована як застаріла і зношена, низка наших старих есмінців була тим не менш об'єднана в одне з'єднання. Хоча цим кораблям не вистачає престижу сучасних суден, вони є винахідливим використанням того, чим ми вже володіємо."
 AST_strongholds_desc:0 "Щоб закріпити нашу позицію на цьому новому театрі, ми повинні підтримати ірландських товаришів проти імперіалістичного серця капіталізму. Їхня попередня боротьба за незалежність дає цінні уроки для нашої спільної підготовки до наступного етапу глобального конфлікту."
 AST_summon_the_cabinet_mission:0 "Скликати Кабінет міністрів"
 AST_support_the_policy_of_appeasement_desc:0 "Наша країна й досі дорого розплачується за попередню війну. Якщо територіальні поступки в іншій половині земної кулі допоможуть врятувати Австралію від війни, слід розглянути такий варіант."
 AST_support_weapons3:0 "Bren Mk. I & ML 3 inch mortar"
 AST_the_australian_commonwealth_desc:0 "Британія колись претендувала на мантію лідера Співдружності, але її бачення було зіпсоване капіталістичними інтересами. Ми перехопимо цю роль і поведемо нації до спільної соціалістичної утопії."
 AST_the_winner_takes_it_all_desc:0 "Хоча колись пожертвувати островом Науру заради німецької співпраці здавалося розумним, тепер це не так. Довівши свою могутність, ми прагнутимемо до експансії на Соломонові острови та Нову Зеландію, навіть якщо перше може додатись до нашої зради Пакту Науру. Зрештою, Соломонові Острови стануть ще однією німецькою територією, втраченою на користь Австралії."
 AST_transport_plane_equipment_3:0 "Avro York Type 685"
 AST_union_control_progressbar_pip_2:0 "Під впливом"
 ASY_DEF:0 "Ассирія"
 ATTRITION_MULMOD_BY:0 " помножений на $MOD|Y$ через:\n$WHY$"
 ATTRITION_NAVAL_TRANSFER:0 "Морське транспортування: $ATT|=-1%0$"
