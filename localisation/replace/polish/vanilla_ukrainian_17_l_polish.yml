 CHI_sea_war_of_resistance:0 "$CHI_war_of_resistance$"
 CHI_secure_the_northern_front_desc:0 "Ми вже втратили Маньчжурію на користь японців, безумовно, нашого найсильнішого і найнебезпечнішого сусіда. Ми повинні убезпечити північний кордон, щоб ми могли стежити за японцями і переконатися, що у них не виникне ідей просуватися далі на південь..."
 CHI_sp_rockets_ground_to_air_missile:0 "Проєкт «Sky Bow»"
 CHI_the_chu_x_po:0 "Chu XP-0"
 CHI_the_hump_closed_state:0 "Повітряний маршрут закритий у цій області."
 CHI_the_seas_of_tomorrow:0 "Моря завтрашнього дня"
 CHI_three_principles_of_the_people_desc:0 "Сунь Ятсен, засновник республіки, заклав три фундаментальні принципи: «міньцзу», «міньцюань» та «міньшен», тобто: націоналізм, народовладдя та народний добробут."
 CHI_toward_a_socialist_economy:0 "До соціалістичної економіки"
 CHI_train_marines_desc:0 "Наша довга берегова лінія вразлива для ворожих висадок із моря. При цьому, однак, вона дає нам можливість атакувати з несподіваних напрямів, якщо раптом опиниться на нашій території."
 CHI_tsr_anti_communism:0 "Антикомунізм"
 CHI_tsr_industrial_expansion_cooperation:0 "Промислове розширення"
 CHI_tsr_peace:0 "Мир"
 CHI_tungsten_and_antimony_extraction_desc:0 "Стратегічні метали приносять стратегічні перемоги, і ми маємо величезні родовища — родовища, які можна було б використати з великою користю, якби ми могли дістати руду із землі."
 CHI_warlord_PRC_democratic_ADJ:0 "Китайськ"
 CHI_warlord_PRC_neutrality:0 "Китай"
 CHI_xian_incident_desc:0 "Наша країна ослаблена внутрішньою боротьбою, тоді як Японія явно має плани на нашій території. Ми повинні змусити націоналістів і комуністів прислухатися до здорового глузду та сформувати єдиний фронт."
 CHL_advancements_in_telecommunications:0 "Телекомунікаційні досягнення"
 CHL_alianza_popular_libertadora_as_a_vanguard_desc:0 "Оскільки важко керувати виключно на власний розсуд, було б розумно сформувати коаліційний уряд із залученням радників від різних правих політичних партій, щоби ті могли висловити свою думку."
 CHL_construct_the_estadio_nacional:0 "Збудувати Estadio Nacional"
 CHL_controlled_education:0 "Суворо контрольована освіта"
 CHL_counterract_nationalist_thought_in_universities:0 "Поширити антифашистські погляди по університетах"
 CHL_defense_of_the_hemisphere_desc:0 "У нашій півкулі є багато країн, які б дуже виграли від захисту від США, і це саме те, що ми з німцями можемо їм запропонувати."
 CHL_demand_demilitarization_of_patagonia:0 "Демілітаризація Патагонії"
 CHL_departamento_de_la_juventad_nacista_desc:0 "Інші країни, такі як Німеччина, досягли успіху в мілітаризації своєї молоді, і ми не мусимо вчиняти інакше, адже нам потрібно більше чоловіків на полі бою, і нам це потрібно зараз."
 CHL_establish_the_royal_mountaineers:0 "Заснувати королівську гірську піхоту"
 CHL_government_funds_being_extracted_mission:0 "Алессандрі видобуває державні кошти"
 CHL_ibanez_alianza_popular_libertadora_mission:0 "Ібаньєс застосовує Народний визвольний альянс як партію-авангард"
 CHL_incorporated_mapuche_organizations:0 "Організації мапуче включено"
 CHL_intigrate_tierra_del_fuego_fascist:0 "Інтегрувати Вогняну Землю"
 CHL_je_suis_le_deluge_tt:0 "§Y$CHL_antoine_iii$§! отримає рису §Y$emperor_of_france_and_the_americas$§!."
 CHL_nationalize_foreign_industries_desc:0 "Капіталісти, які ще залишилися в нашій країні, напевно, спітніли від страху, коли зрозуміли, яким буде наш наступний крок. Ми мусимо конфіскувати все майно, яким вони володіють, і перерозподілити його серед людей."
 CHL_new_fatherland_democratic_ADJ:0 "Чилійськ"
 CHL_news_events.1.b:0 "Ми відновимо нашу славу!"
 CHL_news_events.5.b:0 "Ми повернулися і сильніші, ніж будь-коли!"
 CHL_political_events.2.a:0 "Ласкаво просимо"
 CHL_political_events.29.desc:0 "Фашисти, що належать до чилійської партії «Націонал-соціалістичний рух», звернулися до нас, розповідаючи про плани здійснити державний переворот проти чилійського уряду. Вони просять нашої підтримки в цьому починанні у вигляді людей, обладнання та політичної допомоги. Чи повинні ми їм допомогти?"
 CHL_political_events.37.a:0 "Хіба вони нас не бояться?"
 CHL_political_events.48.a:0 "Тоді нам доведеться робити це наодинці"
 CHL_political_events.58.t:0 "Наші війська зіткнулися поблизу Лагуна-дель-Десіерто"
 CHL_political_events.65.b:0 "Нашому суверенітету загрожували. Це вимагає військової відповіді."
 CHL_political_events.74.t:0 "Коронація Антуана III"
 CHL_political_events.76.desc:0 "[PRU.GetLeader] заявив, що нація [PRU.GetName] радо приймає нашу пропозицію продати їм Аріку, і надіслав посланця з коштами, які ми вимагали взамін."
 CHL_political_events.91.a:0 "Ну, доведеться обійтися тим, що маємо..."
 CHL_political_events.96.desc:0 "Наші вірні солдати безкарно виконали наші плани та окупували Паласіо де Ла Монеда, де перебувають Артуро Алессандрі та його кабінет. Вони наказали президенту піти у відставку на користь Хорхе Гонсалеса фон Марееса. Тепер ліберальний уряд мало що може зробити, щоб нас зупинити!"
 CHL_political_events.99.a:0 "У майбутнє!"
 CHL_popular_freedom_alliance_party:0 "НВА"
 CHL_protect_the_easter_island_desc:0 "Острів Пасхи, який місцеві жителі називають Рапа-Нуї, постійно перебуває під загрозою з боку фашистів із заходу. Ми мусимо не тільки укріпити острів і побудувати гавані, але й завдати превентивного удару по будь-кому, хто претендуватиме на Тихий океан."
 CHL_push_past_the_darien_gap:0 "Подолати Дар'єнський розрив"
 CHL_reapproach_america_tt:0 "Будуть відкриті рішення §YПридбати зброю§! від §YСполучених Штатів Америки§!."
 CHL_requires_bra_states_tt:0 "Контролює всі §Yпідсвічені бразильські землі§!"
 CHL_strengthen_the_carabinieros_desc:0 "Карабінери Чилі були вперше створені в 1927 році не ким іншим, як самим Ібаньєсом, і значна частина організації досі дуже лояльна до нього. Тому, можливо, варто переконатися, що лояльними є ті, хто має владу в організації."
