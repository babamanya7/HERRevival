 siam.17.desc:0 "[FROM.GetName] прямо заявила, що краще побачить свою країну в руїнах, ніж поступиться нам хоча б чимось. Війна продовжується."
 siam.19.a:0 "Це не варте війни."
 siam.27.c:0 "Спрямувати його до адміністрації та постачання."
 siam.28.desc:0 "Довгі роки регентства добігають кінця. У Бангкоку, перед принцами, ченцями, міністрами та державними офіцерами, Ананда сходить на трон за власним правом і отримує почесті, належні королю з династії Чакрі. Церемонії проголошують наступність там, де були потрясіння, і священний порядок там, де були чвари. Для королівства ця коронація — не просто видовище, а декларація того, що Корона вистояла, що держава не була зламана вигнанням і громадянською війною, і що починається нове правління над [ROOT.GetNameDef]."
 siam.29.a:0 "Ми вчитимемося у німців"
 siam.34.t:0 "Вимоги [FROM.GetAdjective] біля наших берегів"
 siam.45.a:0 "Єдиний фронт необхідний."
 siam.46.t:0 "[FROM.GetNameDefCap] приймає об'єднання"
 siam.47.a:0 "Тоді ми діємо самі."
 siam.47.desc:0 "[FROM.GetLeader] відхилив нашу пропозицію про злиття альянсів. Їхній уряд стверджує, що співпраця може тривати там, де інтереси збігаються, але вони не розмістять свій альянс у межах ширшої коаліції під керівництвом з [ROOT.Capital.GetCapitalVictoryPointName].\n\nНаразі поділ між нашими блоками залишається. Ми повинні досягати наших цілей, не розраховуючи на їхню повну відданість."
 siam.5.a:0 "Цю справу завершено."
 siam_adc.2.b:0 "Ми залишатимемося під захистом [FROM.GetAdjective]."
