 promote_baltic_fascism_cat_desc:0 "Балтія характеризується своїми слабкими інфантильними режимами, нездатними репрезентувати кров балтів, що тече в жилах їхнього народу. Литві, Естонії і навіть декому в Польщі треба нагадати про славу їхніх предків, які протистояли германцям і слов'янам, які тепер знову прагнуть нас гнобити."
