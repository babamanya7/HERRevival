 MTG_naval_treaty.2.a:0 "Ми уникнули ще однієї гонки озброєнь."
 MTG_naval_treaty.4.desc:0 "[From.GetAdjective] посол звернувся сьогодні до нашого лідера. [This.GetLeader] отримав ноту від його уряду. Їх дуже непокоїти наше розширення флоту, вони вважають це «дестабілізуючим фактором у регіоні».\n\nДалі в ноті сказано, що якщо ми продовжимо розвивати потокову програму розширення флоту, [From.GetAdjective] уряд буде змушений обміркувати всі можливі заходи впливу."
 MUN_czech.1017.a:0 "Ми завдамо удару по [GER.GetNameDef] разом із ними"
 MUN_czech.1026.b:0 "Тривожний розвиток подій"
 MUN_czech.1028.d:0 "Багато хто в країні зараз задається питанням, чому уряд не продовжив фортифікаційні проєкти, які він розпочав наприкінці минулого року. Уряд виділив кошти на додаткові проєкти з будівництва фортець через Раду з фортифікації. Оскільки жодного прогресу в реалізації програми не спостерігається, люди вимагають або продовжити проєкт, або повернути кошти. Якщо ми все ж бажаємо продовжувати наші програми фортифікації, не можна втрачати ані хвилини, щоб відновити проєкти і завершити їх вчасно."
 MUN_czech.1038.t.3:0 "[FROM.GetName] пропонує продати артилерію"
 MUN_czech.news.2.t:0 "[FROM.GetNameDefCap] вторгається в [RUT.GetAdjective]і території"
 MUN_slovakia_little_war.2.d:0 "Незважаючи на всі наші зусилля, наші сили зазнали поразки в регіоні [71.Getname]. Нездатність вчасно зібрати достатню кількість боєприпасів та моторизованої техніки для конфлікту стала ключовим фактором нашої невдачі. Попри цю невдачу, командири, які брали участь у битві, засвоїли кілька дуже важливих уроків."
 MUN_slovakia_little_war.4.a:0 "Прикро."
