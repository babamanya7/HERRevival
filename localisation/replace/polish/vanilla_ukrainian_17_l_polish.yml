 landmark_colosseum_desc:0 "Колізей розташований у центрі Риму. Це найбільший стародавній амфітеатр, коли-небудь побудований, який використовувався римлянами та жителями міста після падіння римлян для розваг з моменту його завершення імператором Титом."
 landmark_colosseum_plural:0 "$landmark_colosseum$"
 landmark_cristo_redentor_desc:0 "Христос-Спаситель височіє над Ріо-де-Жанейро, його будівництво було завершено в 1931 році. Це національний символ Бразилії та має велике значення серед католиків у регіоні."
 landmark_kremlin_plural:0 "$landmark_kremlin$"
 lar_concessions_to_italy.6.desc:0 "[From.GetAdjective]ий уряд у принципі погодився на запропонований нами обмін територіями і обіцяв ратифікувати Стрезьку угоду, коли всі умови будуть остаточно затверджені. Переговори щодо них залишаться на відкуп дипломатичній службі. Передача територій розпочнеться лише після підписання договору."
 lar_congress_of_paris.2.desc:0 "В першому раунді перемовин французька делегація запропонувала просто розділити континент посередині, віддавши нам права на Єгипет, Судан і території аж до Кенії. Хоча у цій пропозиції мало конкретики та загалом вона стосується земель, які ніхто не контролює, з її допомогою можна заручитися підтримкою французів у завоюванні великої Африканської імперії."
 lar_fra_coup_pre_position_units:0 "Підготувати бойові загони"
 lar_france_political_violence.3.t:0 "Бунти правих"
 lar_news.10.desc_2:0 "Карлістські війська за керівництвом Мануеля Фал Конде, незадоволені тим, що їх постійно відсувають убік і дедалі більше позбавляють впливу на молодий повоєнний націоналістичний уряд, відкликали свою підтримку нового уряду. Влаштувавши чергове повстання, в основному на півночі країни, карлистські рекете пішли проти своїх колишніх союзників, оголосивши про створення нового уряду. Лідери націоналістів швидко засудили дії Фал Конде, звинувативши його в тому, що він «вкинув Іспанію в чергову громадянську війну». що лідери націоналістів із часів перемоги над республіканцями систематично намагаються ліквідувати рух, через що їм залишається лише захищатися."
 lar_news.16.t:0 "Іберійський Союз"
 lar_news.2.a:0 "Не можна дати цій «перемозі» закріпитися!"
 lar_news.2.h:0 "Вплив [SOV.GetAdjective] держави на державу [SPD.GetNameDef] насторожує..."
 lar_news.21.d:0 "Розкол серед комуністів зростає!"
 lar_news.24.b:0 "Тепер наші вороги згинуть!"
 lar_news.27.a:0 "Це лише початок."
 lar_news.4.t:0 "Французький уряд повертається до Парижа"
 lar_operative_event.5.a:0 "Хіба не правильніше було померти?"
 lar_portugal_iberian_summit.2.t:0 "Іберійський самміт — [From.GetNameDef] приймає пропозицію"
 lar_portugal_iberian_summit.5_a_tt:0 "Ми негайно надішлемо пропозицію державі [ENG.GetFlag][ENG.GetNameDefCap].\n"
 lar_portugal_iberian_summit.9.desc:0 "Показавши явне нерозуміння ситуації, що склалася, і відсутність намірів співпрацювати з нами, [From.GetAdjective] уряд відхилив нашу пропозицію про вступ до альянсу [?global.POR_iberian_summit_target.GetFactionName собі союзників..."
 lar_portugal_naval_blockade.1.a:0 "Ми подумаємо над цією пропозицією..."
 lar_portugal_navy_mutiny.1_stop_tt:0 "Ми спробуємо зупинити бунтівників.\nКораблі, що збунтувалися, отримають шанс перемогти нас і успішно піти в державу [SPD.GetNameDefCap].\n§RПідтримка комуністів§! вплине на кількість бунтівних корабів"
 lar_portugal_navy_mutiny.6.t:0 "Час попрощатися з нашими португальськими товаришами"
 lar_portugal_overseas_provinces.3.a:0 "This is for the sake of Portugal."
 lar_portugal_overseas_provinces.3.t:0 "Timorese Territory Integrated"
 lar_portugal_purchase_ships.5.a:0 "Добре."
 lar_ratify_the_stresa_front.4.desc:0 "[FRA.GetNameDefCap] та [ITA.GetNameDef] вже підписали Стрезький договір й оформили свій союз. Тепер наша черга виконати свої зобов'язання, підписати договір та передати володіння в Сомалі під контроль [ITA.GetAdjective]ого уряду."
 lar_spain.18.t:0 "Повсталі чекають свого часу"
 lar_spain.20.desc:0 "На нашу вимогу [From.GetAdjective] уряд погодився на наше лідерство в іспанському світі в тому, що стосується міжнародної політики."
 lar_spain.36_tt:0 "Якщо §Y[SPA.GetName]§! не відступиться, ми отримаємо:\n"
 lar_spain.52.t:0 "[From.GetNameDefCap] переміщує золотий запас"
 lar_spain.55.a:0 "Дуже прикро..."
 lar_spain.62.desc:0 "Завдяки постійному [From.GetAdjective] втручанню та підпільним осередкам, які отримують незаконну підтримку від держави [From.GetNameDef], за останні місяці зміцнилися місцеві комуністичні групки, з якими ми боролися роками. Ці групки, яким, без сумніву, пообіцяли додаткову допомогу з-за кордону, тепер взяли зброю та разом з нелояльними армійськими елементами влаштували повномасштабне повстання, маючи намір силою повалити уряд."
 lar_spain.62.t:0 "Повстання комуністів!"
 lar_spain.76.desc:0 "Незважаючи на наші прохання, держава [From.GetNameDef] відмовилася якось допомагати у боротьбі з радянцями. Усі спроби отримати корисну інформацію про радянський фронт також натрапили на стіну мовчання."
 lar_spain.8.a:0 "Їхня дурість обійдеться їм дорожче, ніж нам!"
 lar_spain.9.t:0 "Повстання анархістів!"
 large_unit_tactics_large_front_offensive:0 "Наступ широким фронтом"
 large_unit_tactics_motorization_initiative:0 "Ініціатива моторизації"
 last_repeatable_decision_tt:0 "Ця дія більше §Yне§! повторюється."
 lc_aircraft_catapult_desc:0 "Система запуску для невеликих розвідувальних літаків, що дозволяє сухопутному крейсеру розвідувати віддалені райони та надавати оперативну інформацію про ситуацію на полі бою."
 lc_heavy_anti_air_battery:0 "Важка зенітна батарея"
 lc_heavy_anti_air_platform:0 "Важка установка ППО"
 lc_obstacle_clearance_gear_desc:0 "Важке навісне обладнання, таке як масивні бульдозерні відвали та крани, призначене для розчищення завалів, прокладання шляхів через важкодоступну місцевість та надання допомоги в операціях з окопування."
 liberate_botswana:0 "Звільнити державу [BOT.GetName]"
 liberate_cameroon:0 "Звільнити державу [CMR.GetName]"
 liberate_togo:0 "Звільнити державу [TOG.GetName]"
 liberate_togo_desc:0 "$liberate_angola_desc$"
 light_tank_aa_equipment:0 "Легка ЗСУ"
 light_tank_aa_equipment_1:0 "Легка ЗСУ I"
 light_tank_amphibious_chassis:0 "Легкі танки-амфібії"
 light_tank_artillery_equipment_1:0 "Легка САУ I"
 light_tank_destroyer_brigade_desc:0 "Винищувачі танків — це танки з більшою, ніж зазвичай, гарматою у фіксованій надбудові на місці башти. Легкі винищувачі танків створюються з шасі легких танків, через що вони є досить мобільними, але не оснащені особливо потужними гарматами в порівнянні з важчими винищувачами танків."
 low.1.d:0 "Французи вирішили продовжити свою лінію Мажіно на захід аж до протоки Ла-Манш! Це чітко показує їхню готовність покинути нас у випадку німецького вторгнення. Наше посольство в Парижі опубліковало офіційну скаргу, але навряд чи це матиме якийсь ефект."
 massed_strikes_desc:0 "Пілоти, навчені здійснювати вильоти з авіаносців, дозволяють нормально функціонувати навіть перевантаженому авіаносця — вони тиснуть ворога числом і дуже ефективно діють у морських битвах. Авіаносець повинен працювати як годинник, де кожен механізм чітко виконує свою роль."
 matrosenlied:0 "Wir fahren gegen Engeland"
 mech_army_bonus:0 "Бонус до механізованої піхоти"
 medal_of_merit:0 "Медаль «За заслуги»"
 medium_decrease:0 "$small_decrease$"
 medium_tank_destroyer_equipment_desc:0 "Винищувачі танків — це гусеничні машини з більшою за звичайну гарматою на стаціонарному кріпленні замість башти. Середні винищувачі танків базуються на шасі середніх танків, тобто вони досить мобільні та мають поважну вогневу міць."
 mexico.19.j:0 "Франсіско Мухіка, революційний генерал та соціальний реформатор."
 mexico.19.m:0 "Лев Троцький, герой Жовтневої революції."
 mexico.33.title:0 "Виступи проти «зутерів»"
 mexico.35.desc:0 "[From.GetLeader] погодився передати нам креслення останніх німецьких легких та середніх танків. Сподіваємось, це перший крок назустріч тіснішим відносинам між Мексикою та Німеччиною, а також шанс поліпшити наші військові технології."
 mexico.41.b:0 "Наш суверенітет під загрозою. Це вимагає військової відповіді."
 mexico.44.desc2:0 "[From.GetLeader] підтвердив повідомлення про те, що [From.GetAdjective]і війська вторглися на американську військову базу біля Панамського каналу, і заявив, що пішов на це, щоби зберегти [From.GetAdjective] інтереси у Центральній Америці в умовах внутрішньої неспокійної ситуації в Сполучених Штатах Органи пропаганди партії [From.GetRulingPartyLong] зажадали, щоб усі американські солдати, що залишилися в цьому районі, склали зброю і забезпечили «мирну передачу влади» в Зоні каналу. те, що він не виявив завзятість, не захистив національні інтереси і не відповів на [From.GetAdjective] напад загальною мобілізацією проти держави [From.GetNameDef]."
 mexico.45.desc1:0 "Американські війська на південному кордоні приведені в стан бойової готовності, оскільки недавній [From.GetAdjective]ий напад на американську військову базу біля Панамського каналу підвищив ймовірність великомасштабної війни між двома сусідами. І хоча атака, на яку так сподівався [From.GetLeader], провалилася, стверджується, що американський президент вирішив покарати нахабного південного сусіда. У жовтій пресі партія [From.GetRulingPartyLong] називається «зграєю бандитів», які не поважають міжнародне право, лунають заклики до повалення режиму.\n\nЯкщо? Друга Американо-мексиканська війна, то вона вестиметься в суворих умовах гір і пустель зі значно більшими втратами, ніж невелика сутичка 1847, що передувала передачі Мексикою її володінь."
 mexico.54.b:0 "Ми не ведемо переговорів із революціонерами!"
 military_governor_occupation:0 "Військовий губернатор"
 mio_cat_tech_all_carrier_and_modules:0 "Усі технології авіаносців"
 mio_cat_tech_light_armor_and_modules:0 "Технології легкої бронетехніки"
 mio_header_supremacy_focus:0 "Ставка на перевагу"
 mio_header_wings:0 "Крила"
 mio_policy_land_cutting_corners:0 "Економія на виробництві"
 mobile_recon_and_assault_motorization_support:0 "Органічне моторизоване постачання"
 modifier_army_sub_unit_armored_car_max_org_factor_tt:0 " $modifier_army_sub_unit_armored_car_max_org_factor$: $RIGHT|+=%1$"
 modifier_experience_gain_light_cruiser_mission_factor:0 "Приріст досвіду легких крейсерів від завдань"
 modifier_out_of_power_impact_factor_tt:0 " $MODIFIER_OUT_OF_POWER_FACTOR$: $RIGHT|+=%2$"
 moscow_strikes_back:0 "Москва наносить удар у відповідь"
 mothership_equipment_short:0 "Літак-матка"
 mountaineers_combat_1_desc:0 "Наші елітні сили мусять зосередити свої зусилля на утриманні територій, на яких вони спеціалізуються. Поєднання тактики засідок і поліпшеної полкової організації гарантує, що наші спецпризначенці забезпечать значну глибинну оборону проти загарбницьких сил."
 mtg_britain.38.t:0 "[From.GetName] відкидає пропозицію вступити до альянсу"
 mtg_britain.54.t:0 "[From.GetName] відмовляє у проханні"
 mtg_britain.69.b:0 "У нас не залишається іншого вибору, крім як підкоритися."
 mtg_britain.79.a:0 "Принаймні, нам не доведеться боротися з радянцями самотужки."
 mtg_britain.85.t:0 "Імперська конференція: оборона — [From.GetName] погоджується"
 mtg_germany.1.t:0 "[From.GetName] вимагає підпорядкування"
 mtg_netherlands.13.t:0 "[From.GetNameDefCap] пропонує розширити імпорт із Вест-Індії"
 mtg_netherlands.27.t:0 "[From.GetNameDefCap] приймає прохання захистити Вест-Індію"
 mtg_netherlands.3.t:0 "[From.GetNameDefCap] відкидає нашу пропозицію"
 mtg_netherlands.36.d:0 "[From.GetNameDefCap] погоджується обмінятися розвідувальними даними про можливих ворогів, з якими ми можемо разом зіштовхнутися у бою."
 mtg_netherlands.47.d:0 "Спілкуючись зі своїми товаришами-пілотами, принц Бернард подає гарний приклад поведінки в бойових умовах. Командири вже відзначили невелике, але помітне поліпшення дій наших пілотів у повітряному бою."
 mtg_netherlands.59.d:0 "Під час нещодавньої зустрічі з деякими з наших видатних діячів стався дипломатичний скандал за участю принца Бернарда. Схоже, один із наших представників звинуватив принца в тому, що він «суєт ніс не у свої справи»."
 mtg_netherlands.6.d:0 "Держава [From.GetNameDefCap] відмовилася взяти на себе відповідальність за острови Ей-Бі-Сі. Його представники стверджують, що не можуть дозволити собі втручатися в те, що називають «місцевими територіальними суперечками»."
 mtg_netherlands.63.a:0 "Добре, що ми передбачали такий результат і були готові до нього."
 mtg_news.1.c:0 "Кожен крок у напрямку прогресу має бути куплений кров'ю."
 mtg_news.10.c:0 "У нас не було вибору..."
 mtg_news.10.t:0 "[HOL.GetName] поступається вимогам Німеччини"
 mtg_news.22.t:0 "Англо-німецький пакт"
 mtg_news.23.desc:0 "Під проводом Освалда Мослі Британський союз фашистів почав проводити організовані марші по всій країні, щоби набрати у свої ряди прихильників фашизму. \n\nЗапекла реакція антифашистів вже призвела до вуличних зіткнень, і незрозуміло, чи буде відновлено стабільність чи заворушення стануть лише гіршими. Лідери БСФ, зі свого боку, пообіцяли не зупинятися «допоки вони не пройдуть маршем по Даунинг-стріт і не вимагатимуть зміни уряду»."
 mtg_news.24.c:0 "Англійцям вірити не можна!"
 mtg_news.3.b:0 "Нехай велетень і далі спить."
 mtg_news.30.c:0 "Відчайдушні заходи..."
 mtg_news.35.desc:0 "Минув іще тиждень із моменту останньої появи на публіці членів [From.GetAdjective] королівської сім'ї. Про їхню долю вже ходять різні чутки. Уряд навідріз відмовився коментувати ситуацію, що склалася, і почала вживати жорстких заходів щодо ЗМІ, Мовчання уряду тим більше помітне у світлі анонімних заяв певних людей, які стверджують, що вони працювали в будинку королівської сім'ї і бачили, як кілька тижнів тому «їх насильно вивели з Бакингемського палацу люди в масках»."
 mtg_news.44.t:0 "Громадянська війна в Індії"
 mtg_news.45.d:0 "Усього цього легко можна було уникнути..."
 mtg_news.52.c:0 "А вони дуже серйозно ставляться до «сфери своїх інтересів»."
 mtg_news.6.d:0 "Залишається тільки сподіватися, що переміг правильний бік."
 mtg_usa_canadian_corridor.1.desc:0 "Нашого посла в державі [USA.GetNameDef] сьогодні викликали до Держдепартаменту і пред'явили йому ультиматум. Згідно з врученою йому нотою, уряд держави [USA.GetNameDef] відтепер не погоджується із суверенітетом Канади на території між Вашингтоном і Аляскою.\n\nПропозиція надати право проходу військ (і звільнити їх від прикордонного контролю) була відкинута. [USA.GetAdjectiveCap]ий уряд очікує відповіді до півночі."
 mtg_usa_civil_war_democrats.15.t:0 "Промисловці переносять виробництво зброї"
 mtg_usa_civil_war_democrats.28.t:0 "Південний Захід заявляє про підтримку уряду"
 mtg_usa_civil_war_democrats.31.desc:0 "Посилаючись на брак співпраці з боку уряду та «слабкі лідерські якості, які виявив колишній президент [USA.GetLeader]», губернатори Огайо, Міссурі, Вісконсину, Іллінойсу, Індіани та Мічигану заявили про свою підтримку Бостонського уряду. Відносини всередині повстанського табору, швидше за все, будуть розпалюватися, оскільки всі ці губернатори раніше вважалися переконаними прихильниками президента."
 mtg_usa_civil_war_fascists.22.b:0 "Вони вибрали бік."
 mtg_usa_foreign_support.2.a:0 "Це виявиться корисним у майбутньому."
