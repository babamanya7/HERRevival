 ROM_the_armored_division_desc:0 "Танки — це шлях вперед, і ми повинні створити спеціалізовані підрозділи, які б використовували переваги цієї нової зброї."
 ROM_torpedo_bombers_desc:0 "Ми можемо компенсувати нашу слабкість у військово-морських силах, виділивши частину наших військово-повітряних сил на морські обов'язки. Для цього знадобиться нова модель літака, який може нести торпеду."
 ROM_trade_treaty_with_germany:0 "Торговий договір із Німеччиною"
 RULE_ALLOW_LEND_LEASE_SAME_FACTION_TT:0 "Правило гри: §R$RULE_ALLOW_LEND_LEASE_SAME_FACTION_DESC$§!"
 RULE_CAVE_TO_THE_GERMANS_HOL_AI_DESC:0 "§HНідерландський§! ШІ намагатиметься прогнутися під німців у торговій війні та вступити з ним в союз після переходу у фашизм, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_ETH_IMPERIAL_AI_DESC:0 "ШІ Ефіопії спробує перемогти Італію самостійно, без допомоги Ліги Націй. Опісля він спробує розширити свою імперію."
 RULE_OPTION_ALTERNATE:0 "Альтернативний шлях"
 RULE_OPTION_ALTERNATE_SOV_AI_DESC:0 "§HРадянський§! ШІ зосередиться спершу на боротьбі з капіталістами та спрямовувати свої удари до слабших цілях на Близькому Сході, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_ALWAYS_FREE:0 "Без обмежень"
 RULE_OPTION_ANARCHIST_DESC:0 "§HАнархістські комуни§! в Арагоні та Каталонії об'єднаються воєдино, щоби здолати як фашистів, так і комуністів, а також протистоятимуть самій ідеї національної держави."
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI_DESC:0 "The voice of the people matters most in Democratic Australia, to whose will the fate of the nation is beholden."
 RULE_OPTION_CHL_ANTI_IMPERIALISM:0 "Антиімперіалізм"
 RULE_OPTION_CHL_OPERATION_BOLIVAR:0 "Співробітництво в операції «Болівар»"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0 "§HБолгарія§! спробує створити балканський альянс, переконати сусідів прийняти ідеї революції і зрештою об'єднати Балкани."
 RULE_OPTION_COMMUNIST_SAF_AI_DESC:0 "§HПівденноафриканський§! ШІ намагатиметься перейти в комунізм і звільнити народи Африки від колоніального панування, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_ETH_ANARCHIST:0 "Анархо-комунізм: заклик до всього світу"
 RULE_OPTION_EXILES_TSARIST_SOV_AI_DESC:0 "§HРадянський§! ШІ вижене комуністів під час громадянської війни та відновить царську Росію, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_NOR_TROSTSKYIST:0 "Троцькістський шлях"
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE_DESC:0 "Тубільні князівства в Індії буде звільнено після початку гри."
 RULE_OPTION_SWI_FASCIST_AI_DESC:0 "ШІ змусить Швайцарію приєднатися до Німеччини та повільно перетворити країну на фашистську, зрештою або приєднавшися до Осі, або ставши німецькою маріонеткою."
 RULE_OPTION_THE_KINGS_PARTY_ENG_AI_DESC:0 "§HБританський§! ШІ намагатиметься підтримувати шлюб короля Едуарда VIII з Уолліс Сімпсон і посилювати Партію короля, рухаючися відповідною гілкою дерева національних фокусів."
