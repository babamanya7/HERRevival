 GER_plenipotentiary_of_the_four_year_plan_desc:0 "Стало зрозуміло, що робота з нагляду за виконанням чотирирічного плану та підвищення його ефективності є більш масштабним завданням, ніж уважалося на початку. Призначаючи Германа Гьоринга імперським уповноваженим, ми надаємо велику владу одній людині, але фюрер упевнений, що він досягне великих результатів. Герман Гьоринг занадто корисний для нас, щоби не надати йому повні дипломатичні права в цьому питанні."
