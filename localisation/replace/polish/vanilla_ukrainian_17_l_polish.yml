 BUL_appoint_communist_ministers_desc:0 "Ми мусимо тиснути на болгарський уряд, щоб він призначив міністрів, які прагнуть змінити курс від диктаторського режиму царя. Тільки зсередини уряду ми зможемо зруйнувати царизм."
 BUL_appoint_georgiev_desc:0 "Кімон Георгієв перетворився на одну з найбільш значущих фігур Вітчизняного фронту. Враховуючи всі його переваги, настав час визнати, що [ROOT.GetNameDef] заслуговує саме на такого прем'єр-міністра."
