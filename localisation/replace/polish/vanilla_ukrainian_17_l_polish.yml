 SPA_save_the_alcazar_desc:0 "Алькасар у Толедо все ще утримується силами, вірними нашій справі, але вони в облозі! Звільнення їх, хоч і не важливе стратегічно, було б великою перемогою пропаганди та зміцнило б позицію Франсіско Франко як фактичного лідера військової хунти."
