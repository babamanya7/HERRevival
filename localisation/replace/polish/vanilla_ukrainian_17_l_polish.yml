 super_heavy_tank_destroyer_brigade_desc:0 "Шасі надважкого танка з великокаліберним знаряддям, закріпленим у корпусі замість башти."
 superior_firepower_desc:0 "Ця доктрина зосереджується на закидуванні ворога снарядами, а не людьми. Наші солдати безцінні, снаряди ж — дешеві.\n\n"
 suppress_asian_communism_goal_desc:0 "Комунізм є загрозою традиційному способу життя, природному порядку речей. Ми повинні об'єднатися, щоб перемогти комунізм скрізь, де він показує свою потворну голову"
 take_state:0 "Завоювання"
 tank_designer_heavy_tank_chassis_role_disallowed:0 "Приберіть модуль, який забороняє роль §Hважкого танка§!, щоби могти змінити її."
 taog_news.1.a:0 "Цікавий розвиток подій."
 targeted_sabotage_destroy_mining_equipment:0 "Знищити гірське приладдя"
 tech_recon2:0 "Розвідрота II"
 tech_recon2_desc:0 "Розвідувальні операції смертельно небезпечні. Якщо ми навчимо наші патрулі швидко переміщатися та відступати і оснастимо засобами для усунення перешкод, створених противником, то збільшимо їх шанси на успішне повернення."
 tech_recon4_desc:0 "Розвідоперації в глибокому тилу, що поєднують шпигунство, партизанську боротьбу та диверсійні дії, розширять наші тактичні можливості та дозволять швидше приймати рішення."
 tfv_australia.34.b:0 "Ми зазнали невдачі."
 tfv_australia.51.d:0 "Держава [From.GetNameDefCap] розглянула наш запит на членство в альянсі [From.GetFactionName] й оголосила нас цінним союзником цієї справи!"
 tfv_canada.10.a:0 "Ми радо вітаємо істинних революціонерів!"
 tfv_canada.10.d:0 "Після виходу зі Співдружності, [From.GetNameDef] веде переговори про вступ до альянсу [Root.GetFactionName] в якості одного з наших союзників. Їхні комуністичні переконання сильні, і незаперечно, що союзник на американському континенті принесе велику користь справі світової революції...\nХоча їхня концепція патріотичного соціалізму, незалежний характер і спроба лідера [From.GetLeader] здійснити «диво індустріалізації» можуть спричинити проблеми в майбутньому, ця можливість здається надто гарною, щоб її втратити."
 tfv_canada.30.a:0 "Підтримати націоналістів."
 tfv_canada.72.t:0 "[FROM.GetNameDefCap] відмовляється підписувати Декларацію"
 tfv_raj.201.desc:0 "Набрані з військовополонених, солдати Battaglione Azad Hindoustan присягнулися віддати життя за свободу Індії. Навчені саботажу та проникненню, ці елітні солдати також здатні десантуватися з парашутом, щоби сіяти хаос у тилу ворога."
 tfv_raj.210.a:0 "Тривожно."
 tfv_south_africa.15.c:0 "Ми дуже цінуємо їхню підтримку."
 tfv_south_africa.20.t:0 "[From.GetNameDefCap] просить членство в Комінтерні"
 tfv_south_africa.21.t:0 "Членство в Комінтерні схвалене"
 tfv_south_africa.22.d:0 "Посилаючись на нерозв'язні розбіжності між нашим особливим поглядом на вчення Маркса та ортодоксальними інтерпретаціями, Комінтерн відхилив нашу заявку. Не заходячи так далеко, щоб назвати нас соціал-фашистами або ще гірше, вони, тим не менш, ясно дали зрозуміти, що ми не можемо очікувати від них ніякої допомоги."
 tfv_south_africa.60.b:0 "Ми вітаємо їх із розкритими обіймами!"
 tfv_south_africa.92.t:0 "Свобода для держави [MLI.GetName]"
