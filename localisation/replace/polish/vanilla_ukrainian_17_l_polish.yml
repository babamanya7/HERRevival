 CAN_canadian_citizenship_act_desc:0 "У нинішньому вигляді визначення того, хто є і хто не є громадянином Канади, ґрунтується на британських законах, і громадянин Канади нічим не відрізняється від британського підданого. Ми мусимо забезпечити, щоби канадські громадяни та піддані більше не розглядалися просто як підкласи статусу британських підданих."
 CAN_carrier_1_desc:0 "These three aircraft carriers were converted battlecruisers and were the first fleet carriers of the Royal Navy. Their conversion was the result of the Washington Naval Treaty of 1922 and the work was finished in 1925. They were moderately-armored but well-armed vessels, with long range and good speed, but due to the nature of the conversion their aircraft complement was limited. Nonetheless, they gave the Royal Navy important experience in aircraft carrier construction and fleet air projection."
 CAN_cv_fighter_equipment_0_short:0 "Nimrod"
 CAN_demand_labrador_tooltip:0 "§H[ENG.GetName]§! §Rнавряд чи§! погодиться на наші вимоги, якщо тільки вони не перебувають у безвихідній ситуації.\n\n"
 CAN_dominion_rifle_association_desc:0 "Стрілецька асоціація Домініону Канада була заснована в 1868 році та зареєстрована парламентським актом у 1900 році. Ми мусимо підтримати розширення цієї організації, щоби більше канадських чоловіків могли навчитися поводитися зі зброєю."
 CAN_heavy_tank_destroyer_equipment_2_short:0 "Churchill Gun Carrier"
 CAN_if_day_desc:0 "Канадці не сприймають серйозно загрозу вторгнення ззовні. Щоб вселити страх у громадян, ми зімітуємо окупацію Вінніпега нацистами. Це неодмінно спонукає до продажу облігацій військової позики."
