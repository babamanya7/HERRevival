 bba_news.109.b:0 "Чудово!"
 bba_news.111.desc_joint_proclamation:0 "[From.GetName] та [SPC.GetName] зробили спільну заяву про створення Анархістської конфедерації, в якій вони зобов'язуються допомагати одне одному та прийти на допомогу, якщо на них нападе іноземна держава. Тисячі анархістів з'їхалися до Італії, щоби підтримати цю спільну декларацію."
 bba_news.201.t:0 "[POL.GetAdjectiveCap]ий уряд зближається з державою [SOV.GetNameDef]"
 bba_news.666.a:0 "Безумовно, несподівано."
 bba_news.666.desc:0 "Папа Римський [FROM.GetLeader] шокував світових лідерів, скинувши короля [?ITA.ITA_var_deposed_leader.GetName] в державі [FROM.GetName] та перебравши владу на себе, стверджуючи, що так хоче Бог. Хоча багато італійців також шоковані, Папа має широку підтримку в країні, і дехто вітає цю раптову зміну влади як початок нової і славної ери для держави [FROM.GetNameDef]."
 bftb_bulgaria_equipment_purchases.3.b_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_medium_armor]§! од. §Yсередніх танків§!"
 bftb_bulgaria_equipment_purchases.4.a:0 "Закупити винищувачі"
 bftb_bulgaria_factions.31.a:0 "Гидкі щури!"
 bftb_bulgaria_factions.62.a:0 "Як обурливо..."
 bftb_bulgaria_factions.72.t:0 "Члени Землеробського союзу репресовані"
 bftb_bulgaria_factions.73.a:0 "Ось і кінець їхньої підривної діяльності!"
 bftb_bulgaria_factions.81.a:0 "Чудова новина!"
 bftb_bulgaria_fate_of_the_balkans.4.b:0 "Не бувати цьому!"
 bftb_bulgaria_fate_of_the_balkans.6.t:0 "[FROM.GetNameDefCap] відмовляється віддати державі [BUL.GetNameDef] область [FROM.FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.7.desc:0 "Нарешті [BUL.GetAdjective]ий уряд виявив свої справжні наміри і відправив делегацію, яка заявила, що [BUL.GetNameDef] має стати володарем держави [ROOT.GetNameDef]. Таким чином, вони вимогли капітуляцію [ROOT.GetAdjective]ого уряду та визнання, що відтепер усім розпоряджається [GetBulgarianLeader]."
 bftb_bulgaria_fatherland_front.2.a:0 "Отже, буде громадянська війна!"
 bftb_bulgaria_fatherland_front.2.desc_partisans_both:0 "грецькі та югославські"
 bftb_bulgaria_german_influence.1.a:0 "Ми з радістю погоджуємося!"
 bftb_bulgaria_german_influence.7.t:0 "[GER.GetNameDefCap] вимагає право проходу військ"
 bftb_bulgaria_greek_influence.3.a:0 "Вони занадто горді, щоб усвідомити необхідність співпраці!"
 bftb_bulgaria_greek_influence.3.t:0 "[FROM.GetAdjectiveCap]ий уряд відхилив нашу пропозицію"
 bftb_bulgaria_imro.1.desc:0 "З надійних джерел стало відомо, що члени ВМРО, оснащені болгарською зброєю, перетнули кордон і організують анти-[ROOT.GetAdjective]ий рух на македонських землях."
 bftb_bulgaria_nationalization.2.t:0 "[FROM.GetAdjectiveCap]е торгове ембарго проти Болгарії"
 bftb_bulgaria_rearmament.1_refuse_tt:0 "[BUL.GetNameDefCap] поки не може розпочати переозброєння."
 bftb_bulgaria_rearmament.4.a:0 "За діло!"
 bftb_bulgaria_rearmament.9.b:0 "Вони за це поплатяться!"
 bftb_bulgaria_rearmament.9.desc_reason_faction:0 " тепер, коли [BUL.GetFactionName] підтримує їх, [BUL.GetNameDef] припиняє виконувати обмеження, накладені на їх збройні сили"
 bftb_bulgaria_soviet_influence.6.a:0 "Цим рішенням [FROM.GetNameDef] прирікає себе на незавидну долю..."
 bftb_bulgaria_soviet_influence.6.desc:0 "[FROM.GetLeader] відмовляється приймати наших дипломатів, відправлених до держави [FROM.GetNameDef], щоб обговорити єднання наших країн замість розсіювання сил. [FROM.GetAdjectiveCap]ий уряд відкинув запрошення в альянс, і, що варіантів, за яких [ROOT.GetNameDef] та [FROM.GetNameDef] можуть співпрацювати, просто немає."
 bftb_bulgaria_tsar_boris.3.a:0 "Утворити уряд, прихильний країнам Осі."
 bftb_bulgaria_yugoslavian_influence.3.t:0 "[FROM.GetNameDefCap] відмовляється підписувати договір про вічну дружбу"
 bftb_greece.13.a:0 "Це обіцяє бути цікавим..."
 bftb_greece.202.a:0 "Відмінна ініціатива!"
 bftb_greece.202.t:0 "Іракліонська конвенція відбулася"
 bftb_greece.203.a:0 "Видатний результат!"
 bftb_greece.205.c:0 "Ми не потерпимо другої зради!"
 bftb_greece.205.t:0 "Іракліонська конвенція відбулася"
 bftb_greece.24.b:0 "Ми голосуємо проти!"
 bftb_greece.25.a:0 "Благословенні будьте розпалювачі війни!"
 bftb_greece.56.desc:0 "[FROM.GetAdjectiveCap]і представники повідомили нам, що хочуть укласти давно очікуваний союз, в якому два наші народи об'єднаються в одну державу під нашим контролем. Весь народ почав святкувати, сам [ROOT.GetLeader] відправився в Нікосію і сказав там промову на честь історичного дня."
 bftb_greece.63.desc:0 "Успіх! [FROM.GetAdjectiveCap]ий посол передав, що його уряд згідно з запропонованим нами пактом про дружбу. Працюючи в тісному тандемі з фашистською державою, ми неодмінно будемо у виграші."
 bftb_greece.9.desc:0 "Запрошення на Іракліонську конвенцію щодо зміни меж держави [TUR.GetNameDef] були надіслані всім цікавим нам державам. Ми очікували, що на нашу зустріч з'являться всі запрошені, але схоже, що там буде лише держава [ENG.GetNameDef] У наших відносин з державою [ENG.GetNameDef] довга історія, тому багато наших чиновників переконані, що Іракліонську конвенцію можна буде провести так, щоб обидва наші народи витягли з неї свою вигоду."
 bftb_news.12.a:0 "Це буде плідна співпраця!"
 bftb_news.204.desc:0 "[TUR.GetNameDef] здригається від конфлікту: консервативна керівна партія та кемалісти, що поступилися їй владою, розв'язали громадянську війну. Кемалісти, завдяки яким держава [TUR.GetNameDef] зберегла незалежність після падіння Османської імперії, заявиди, що за багаторазові кричущі порушення конституції поточний режим підлягає негайному поваленню. Знаменитий воєначальник і відкритий кемаліст Казім Орбай був обраний вождем військової хунти, яка має намір добитися відставки ісламського уряду, який очолює [TUR.GetLeader].\n\n[TUR.GetLeader] у свою чергу заявив, що дії кемалістів суперечать принципам істинної демократії, і клянеться відновити закон і лад у розколотій нації."
 bftb_news.301.d:0 "Чи настане в Греції перепочинок?"
 bftb_news.8.desc:0 "Вітчизняний фронт — це болгарська антифашистська політична організація, до складу якої входять представники низки політичних груп, але особливо сильним впливом користуються комуністи. Ця організація була створена для боротьби з авторитарною диктатурою, яку [FROM.GetLeader] встановив у Болгарії.\nПісля повстання, влаштованого цією організацією, в країні спалахнула громадянська війна між військами, вірними болгарському уряду, та прихильниками Вітчизняного фронту.\nНарешті війна завершилася, [FROM.GetLeader] скинутий, а країна перейменована в Народну республіку Болгарія."
 bftb_news.9.c:0 "Чергова приречена на невдачу спроба об'єднати Балкани..."
 bftb_turkey.102.b:0 "З османською гегемонією давним-давно час покінчити."
 bftb_turkey.126.t:0 "[FROM.GetNameDefCap] пропонує інвестиційний портфель"
 bftb_turkey.133.t:0 "Хвороба Мустафи Кемаля Ататюрка"
 bftb_turkey.139.t:0 "[FROM.GetNameDefCap] знову порушує суверенітет члена альянсу!"
 bftb_turkey.16.a:0 "Це супротив конституції! Заборонити їх!"
 bftb_turkey.19.t:0 "Проведено величезний мітинг на підтримку руху Мендереса"
 bftb_turkey.24.b:0 "Джеляль Баяр — очевидний кандидат."
 bftb_turkey.46.desc:0 "[FROM.GetLeader], прем'єр-міністр держави [FROM.GetNameDef], заявив, що сама думка про здачу [FROM.GetAdjective] територій у Леванті державі [ROOT.GetNameDef] неприпустима і що в регіоні слід залишити [FROM.GetAdjective] управління.[FROM.GetAdjective] війська в Леванті були приведені в повну бойову готовність на випадок [ROOT.GetAdjective] вторгнення в регіон.\n\nБагато наших урядовців висловили своє розчарування [FROM.GetAdject рішенням, заявивши, що це доказ [FROM.GetAdjective] недовіри до нас як до союзників.[ROOT.GetLeader] також висловив своє невдоволення [FROM.GetAdjective] рішенням і попросив у радників рекомендацій щодо заходів у відповідь."
 bftb_turkey.54.a:0 "Їхні танки все одно б зламалися."
 bftb_turkey.58.t:0 "[FROM.GetNameDefCap] виконує наші вимоги"
 bftb_turkey.65.t:0 "[FROM.GetNameDefCap] не бажає вступати до альянсу [ROOT.GetFactionName]"
 bftb_turkey.68.desc:0 "Наші зусилля щодо влаштування фашистського перевороту в державі [IRQ.GetNameDef], здається, окупилися. [IRQ.GetAdjective] фашисти тепер борються з колишнім урядом за контроль над усією державою, і так чи інакше у нас будуть всі можливості затвердити свій контроль над регіоном."
 bftb_turkey.73.t:0 "[IRQ.GetAdjective] фашисти захоплюють контроль у державі [IRQ.GetNameDef]"
 bftb_turkey.84.a:0 "[SOV.GetNameDefCap] стане чесним посередником у цьому питанні."
 bftb_turkey.85.desc:0 "[FROM.GetNameDefCap] сподівається на наш захист проти [TUR.GetAdjective] агресії. [FROM.GetAdjective] чиновники у фарбах описали, як сильно похитнеться рівновага на континенті, якщо [FROM.GetNameDef] [TUR.GetAdjective] сфери впливу, і емоційно заявили про своє право на самоврядування в надії, що ми допоможемо їм його захистити."
 bomber_veteran_initiative:0 "Програма підтримки бомбардувальників-ветеранів"
 britain.15.a:0 "Їх треба поставити на місце."
 britain.27.desc:0 "Уряд [ICE.GetAdjective] відхилив наш ультиматум про дотримання вимог, посилаючись на свою віру в нейтралітет і рішучу опозицію до втягування у війну, до якої вони не мають відношення. Вони стверджують, що цей наказ є посяганням на їхню незалежність і її грубим порушенням. На жаль, це сучасна війна, а в сучасній війні не може бути нейтральних сторін; хоча ми шкодуємо про такий хід подій, ми мусимо робити те, що мусимо робити."
 britain.9.d:0 "Оскільки війна розвивається на шкоду нам і нашим союзникам, прем'єр-міністр потрапив під обстріл як у мирний, так і у воєнний час на критичних вузлах. У момент, коли Британії як ніколи потрібно бути єдиною, вона виявляється розділеною, оскільки частина парламенту зневажає Чемберлена.\n\nНе маючи життєво важливої підтримки з боку лейбористів, прем'єр-міністр прийняв рішення піти у відставку, віддаючи перевагу лорду Галіфаксу як його заміні. Однак Галіфакс був налаштований скептично, і Чемберлен порадив королю звернутися до Вінстона Черчилла. Вважається, що Черчилл, який давно попереджав про війну, яка зараз йде, здатний провести нас крізь неї."
 bruneval_exfiltration_desc:0 "Флотилія десантних кораблів, що несуть війська для прикриття евакуації, висадить і підбере штурмовий загін. Також буде організовано ескорт із союзних кораблів."
 brussels_to_has_already_happened:0 "Конференція в Брюсселі не була скликана"
 byz_triumph_for_middle_east:0 "Тріумф у Леванті"
 c_class:0 "Клас «C»"
 capture_cyphers_raid_outcome:0 "Невеликий загін командос штурмував радіостанцію і зміг отримати копії актуального шифру, перш ніж його встигли знищити."
 cat_special_forces_generic:0 "Спецпризначенці"
 category_carrier_nav_bomber:0 "Палубні морські бомбардувальники"
 category_mobile_anti_tank:0 "Рухома протитанкова артилерія"
 category_tac_bomber:0 "Тактичні бомбардувальники"
 category_tanks:0 "Танки"
 centralized_fire_control_desc:0 "Система централізованого контролю артилерії дозволяє обробляти всі запити на ведення артилерійського вогню в єдиному командному пункті. При необхідності вся вогнева міць дивізій може бути зосереджена на одній меті замість того, щоби військова частина могла просити вогонь лише у прикріпленої до неї артилерії.\n\n"
 china.106.t:0 "Китай об'єднується"
 china.107.d_PRC_joined:0 "Альянс [Root.GetFactionName] відбув своє. Більше немає ворога, проти якого треба об'єднатися. Мао Цзедун посилює свій контроль над територіями в Північному Китаї. Однак, яка надія в них є проти наших переможних армій..."
 china.109.a:0 "До бою!"
 china.13.t:0 "Сутичка з партизанами-комуністами"
 china.16.t:0 "Поразка в області [From.GetName]"
 china.2.d:0 "Німеччина підкорилася дипломатичному тиску з боку Японії та відкликала своїх військових радників з нашої країни! Фон Фалькенгаузен пообіцяв на прощальному обіді, що він не розкриє японцям жодних військових планів, але завершення німецької підтримки точно вдарить по нашій армії."
 chinese_border_incident_SUCCEEDED_DESC:0 "У спробах встановити контроль над важливим стратегічним мостом Марко Поло на південь від Пекіна наші війська були залучені до жвавої перестрілки. Результат цього конфлікту неоднозначний, але ми вимагали вибачень та додаткових територіальних поступок."
 chinese_coastal_regions_short_desc:0 "§LІзолюйте Китай, захопивши його узбережжя.§!"
 chinese_interior_desc:0 "Настав час покласти край опору китайців і відтіснити їх углиб країни. Покажіть їм, що наш наступ не зупинити. Так ми зміцнимо панування Японії в Азії."
 coastal_fort_tech_1:0 "Поліпшені прибережні укріплення"
 coastal_fort_tech_1_desc:0 "Завдяки більш ефективному використанню земель, що оточують наші прибережні укріплення, та впровадженню нових технологій ми можемо зміцнити існуючі споруди та розширити їх ще більше."
 comintern_victoryuponus:0 "Перемога за нами"
 commonwealth_research_name:0 "Дослідження Співдружності"
 congo_independence_struggle.2.a:0 "Тільки якщо вони будуть продовжувати боротися пліч-о-пліч з нами"
 congo_independence_struggle.7.t:0 "Відпускати [FROM.GetNameDef]"
 continuous_reduce_training_time_desc:0 "Основуючи кожну дивізію бійцями, які пройшли спеціальну підготовку, ми зможемо відправляти на фронт навіть ті частини, які раніше доводилося затримувати до закінчення навчання."
 continuous_tech_share:0 "Обмін технологіями"
 control_the_chinese_capitals_goal_desc:0 "Якщо ми отримаємо контроль над історичними столицями Китаю, опір нашим планам безсумнівно зменшиться."
 control_wake_island_goal_desc:0 "Утримання острова Уейк уможливить розширення розвідки та повітряного покриття через центральні тихоокеанські маршрути."
 country_capitulated.0.d_neutral_prev_faction:0 "\n[Root.GetAdjective]ий уряд пішов у вигнання, а його основні сили капітулювали перед [From.From.GetNameDef], який тепер контролює їхню територію.\n\nБоротьба між [From.From.GetNameDef] і [Root.GetNameDef] була лише невеликою частиною конфлікту. Війна між [From.From.GetFactionName] і тим, що залишилося від [Root.GetFactionName], триває деінде."
 cruiser_submarine_specialization_desc:0 "Крейсерські підводні човни є вершиною важких підводних рейдів. Те, чого їм бракує в маневреності та непомітності, вони з лишком компенсують дальністю дії."
 czech.16.t:0 "Чехія вступає у Вісь?"
 decimetric_radar_desc:0 "Багато видів військ покладаються на елемент раптовості, що робить їх більш ефективними. З появою дециметрового радару вони втратили цю перевагу."
