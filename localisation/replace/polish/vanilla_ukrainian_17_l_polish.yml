 SIA_choose_new_leader_tt:0 "Оскільки старий режим зломлений, переможці повинні обрати, хто очолить новий уряд."
 SIA_diversity_foreign_reserves_desc:0 "Для [ROOT.GetNameDef] небезпечно довіряти свою фінансову безпеку валюті або кредитам однієї іноземної держави. Диверсифікуючи наші резерви, ми зменшуємо ризик зовнішніх потрясінь і зберігаємо більшу свободу дій у торгівлі та дипломатії."
 SIA_factionalism_overcome:0 "Фракційність подолано"
 SIA_heavy_fighter_equipment_3:0 "Kawasaki Ki-102"
 SIA_irrigation_desc:0 "Доля селянина все ще залежить від повеней та посух. Ширша система зрошення стабілізує врожаї, розширить площі оброблюваних земель і зробить сільську місцевість міцнішою базою для національного розвитку."
 SIA_join_the_united_front:0 "Приєднатися до Об'єднаного фронту"
 SIA_joint_asian_military_command_desc:0 "Наші зусилля будуть сильнішими, якщо їх координувати з зусиллями наших регіональних партнерів. Структура об'єднаного командування обіцяє більшу ефективність, чіткіше планування та спільний напрям кампаній, які інакше ризикують бути змарновані через суперництво та плутанину."
 SIA_license_modern_airframes:0 "Ліцензування сучасних корпусів"
 SIA_mandate_11:0 "Одинадцятий мандат"
 SIA_mandate_12_desc:0 "У громадських місцях або на дорогах люди повинні допомагати і захищати дітей, людей похилого віку або осіб з інвалідністю.\n\nКожен, хто дотримується пункту 1, вважається культурною людиною, яка заслуговує на повагу тайського народу."
 SIA_nav_bomber_equipment_3:0 "P1Y Ginga"
 SIA_royal_palace_bureau_directive_no_1523:0 "Директива Бюро Королівського палацу № 1523"
 SIA_royal_thai_ordnance_factory_desc:0 "Безпечна держава потребує більшого, ніж імпортна зброя та розкидані ремонтні майстерні. Королівський тайський збройовий завод зосередить навички, обладнання та нагляд під керівництвом корони, даючи [ROOT.GetNameDef] постійний центр для виробництва зброї та боєприпасів."
 SIA_secure_the_state_desc:0 "Перемога в громадянській війні не означає стабільності. Залізниці, порти, арсенали та вузли зв'язку повинні бути убезпечені до того, як реакційні офіцери зможуть перегрупуватися. Бангкок має залишатися спокійним, на зв'язку та під твердим цивільним контролем."
 SIA_the_bank_of_siam:0 "Банк Сіаму"
 SIA_the_royal_police_counterweight:0 "Королівська поліція"
 SIA_turn_off_the_khana_ratsadon:0 "Кхана Ратсадон деактивована"
 SIA_war_material_substitutions:0 "Замінники військових матеріалів"
 SIC_democratic_DEF:0 "Сичуаньська республіка"
 SIK_autonomy_sea_integrated_warlord_subject:0 "Провінція Сіньцзян"
 SIK_cooperate_with_the_nkvd_desc:0 "Щоб зміцнити наші відносини з [SOV.GetNameDef], одночасно забезпечуючи наше правління та захищаючи Урумчі від іноземних змовників, ми повинні співпрацювати з НКВС і допомагати їм у встановленні належної присутності в нашій країні."
 SIK_heavy_tank_aa_equipment_3:0 "PGZ 43 D"
 SIK_heavy_tank_artillery_equipment_1:0 "PLZ 34 D"
 SIK_light_tank_aa_equipment_2_short:0 "PGZ 36"
 SIK_super_heavy_tank_destroyer_equipment_1:0 "PTZ 44"
 SIK_transformation_of_nature_desc:0 "Азія багата на природні ресурси, які тільки й чекають, щоб їх використали. Оскільки наша наукова спільнота розсуває межі того, що раніше вважалося можливим, навіть найбільші, найбільш інвазивні проєкти стають здійсненними. Довкілля має бути сформоване та змінене в маштабних обсягах, щоб працювати на користь Народу!"
