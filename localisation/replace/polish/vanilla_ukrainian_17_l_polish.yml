 CHI_develop_counterinsurgency_tactics_desc:0 "Партизани діють нетрадиційними, непередбачуваними способами, і нам потрібно навчитися з ними боротися. Ми повинні організувати комісії та групи для розробки методів та адаптації до нової форми війни."
 CHI_form_the_chinese_womens_national_war_relief_society_desc:0 "Багато хто втратив усе в нашій боротьбі проти імперіалізму, і ми повинні задовольнити їхні потреби. Китайське національне товариство допомоги жінкам під час війни продемонструвало багатообіцяючі результати і має бути розширене для підвищення ефективності."
 CHI_fortify_shanghai:0 "Укріпити Шанхай"
 CHI_french_military_mission:0 "Французька військова місія"
 CHI_give_protection_of_civil_rights_desc:0 "Сун Цінлін та Китайська ліга захисту громадянських прав діяли на початку 1930-х років, борючись проти автократичних заходів Гоміньдану. Справу, яку вони розпочали, ми продовжимо, закріпивши права простої людини."
