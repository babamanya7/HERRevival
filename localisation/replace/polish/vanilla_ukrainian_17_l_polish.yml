 CHI_highlight_the_hump_decision_tt:0 "Поки ворог не контролює\n§Y-[601.GetName]\n-[434.GetName]\n-[747.GetName]§!,\nмаршрут через Горб безпечний"
 CHI_industrial_evacuations_from_guangzhou:0 "Евакуація промисловості з Гуанчжоу"
 CHI_industrial_evacuations_from_shandong:0 "Евакуація промисловості з Шаньдуну"
 CHI_light_tank_aa_equipment_3:0 "PGZ 41"
 CHI_light_tank_artillery_equipment_3_short:0 "PLZ 41"
 CHI_nationalize_desc:0 "Ми живемо в критичний час для нашої партії, нації та народу, тому приватні інтереси повинні поступитися національній необхідності. Під нашим безпосереднім керівництвом ми будемо використовувати ці фабрики з максимальною ефективністю!"
 CHI_one_nation_undivided_desc:0 "Об'єднавши провінції під однією неподільною владою, ми подолаємо регіональні розбіжності та закладемо основу для сильної та гордої нації. Тоді ми зможемо протистояти будь-яким загрозам, зовнішнім і внутрішнім."
 CHI_one_nation_undivided_tt:0 "Запросить кожного мілітариста до Об'єднаного фронту, за винятком [PRC.GetName] та [HBC.GetName]"
