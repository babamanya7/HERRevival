 ICE_communist_tech_sharing_group_desc:0 "Спільна програма соціального та технологічного розвитку зі штаб-квартирою в Рейк'явіку, Ісландія."
 ICE_iceland_air_desc:0 "Сьогодні бути островом не означає бути відрізаним від світу. Завдяки сучасним літакам ми можемо наблизитися як до європейського, так і до американського континенту. Повітря — це морські шляхи завтрашнього дня."
 ICE_neutrality_ADJ:0 "Ісландськ"
 ICE_republicanism_desc:0 "Ісландії не потрібен король. Регентство показало, що ми можемо добре обійтися без нього. Настав час усунути цей середньовічний інститут і підготуватися до республіки."
