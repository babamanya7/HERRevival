 NAVY_EXPERIENCE_DESC:0 "По мірі використання кораблів у бою або §Hморських навчаннях§!, Ви отримуєте досвід флоту. Певні §Hнаціональні фокуси§! дають додатковий досвід, а декотрі §Hміністри§! можуть збільшити розмір отримуваного досвіду.\n\nДосвід флоту використовується для розробки кращих моделей кораблів, проєктування нових і відмикання §Hдоктрин§!."
