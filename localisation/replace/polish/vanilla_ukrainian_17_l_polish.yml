 usa.64.a:0 "Критична слабкість."
 value_limit_min:0 "$MIN$"
 war_escalation_3_tt:0 "§HРівень 3§!\n §YЛіга Націй§!: Ефіопія може надіслати запит на введення ембарго\n §YЕфіопія§!: Міжнародна репутація росте, фокус §YПопросити ембарго§! відкритий"
 war_justification.11.d:0 "«Без сумніву, [From.GetName] комунізм є однією з найбільших загроз свободі та порядку в цю епоху. Невблаганний і безжалісний, він загрожує поглинути не лише надію [From.GetAdjective]ого народу на процвітаюче, демократичне суспільство, але й надію його сусідів. Якщо ми не будемо діяти зараз, ми можемо побачити, як це перше доміно впаде занадто пізно, залишивши по собі ще більше невдалих соціальних експериментів. Скільки ще має загинути, перш ніж ми втрутимося?»\n\nЗагроза підривної діяльності, що підриває нашу демократію, підживлювана амбіціями [From.GetAdjective], стала останнім часом гаряче обговорюваною темою. В той час як представники опозиції називають це червоною загрозою, спрямованим на війну з [From.GetName], риторика [ROOT.GetRulingParty] до цього часу була дуже успішною."
 war_justification.20.d:0 "«Якщо ми хочемо мати стратегічну перевагу в осяжній, якщо не казати неминучій, війні з державою [From.GetName], не можна зволікати. Йдеться про захист майбутнього наших дітей і забезпечення того, щоб [ROOT.GetName] мав місце у світі завтра. Це питання відданості нашій справі та ідеалам, які ми сприймаємо як належне. Настав час діяти».\n\nСерія запальних промов лідерів [ROOT.GetRulingParty], особливо [ROOT.GetLeader], закликала громадськість підтримати вторгнення в [From.GetName]. Геополітичні мотиви вторгнення менш помітні в риториці патріотичних настроїв, але ця кампанія видається дуже ефективною в переконанні громадськості в його необхідності."
 war_justification.202.d:0 "«[ROOT.GetAdjective]і політики стверджують, що мають свободу і демократію, стверджують, що хочуть миру, але всі ці речі, якими вони пишаються, є порожніми. Їхня демократія роз'єднує людей там, де вони мали б бути єдиними, а їхня свобода видає лише брак дисципліни. Ми, [From.GetAdjective]ий народ, бачимо цю брехню наскрізь... і ми бачимо, що цей мир, мир на їхніх умовах, також є брехнею».\n\n[From.GetRulingParty] вже давно висміює слабкість нації [ROOT.GetAdjective], але останнім часом риторика стала більш агресивною. День збройного конфлікту наближається."
 war_justification.203.t:0 "[From.GetLeader] застерігає від [ROOT.GetAdjective]ого комунізму"
 war_justification.214.d:0 "«[ROOT.GetName] можуть вважати себе більш сучасними і просунутими, ніж ми, але правда полягає в тому, що їхня держава не пройшла таких випробувань, як наша, і вони не готові до загроз, які зараз ясно видно на горизонті. Своєю зневагою до нас і перешкоджанням нам забрати те, що по праву належить нам, вони перетворили нас на одну з цих загроз для себе. Їхня слабка і розділена держава навряд чи зможе протистояти нашим вимогам».\n\nЗнущальна думка про [ROOT.GetName], якої довгий час дотримувалася [From.GetRulingParty], переросла від критики до ворожості. Хоча популярна думка, що [ROOT.GetAdjective]ий народ хоче уникнути війни, [From.GetLeader] стверджує, що наші обрані лідери спровокували її своєю зарозумілістю."
 war_justification.214.t:0 "[ROOT.GetLeader] ставить під сумнів [From.GetAdjective]і претензії"
 war_on_communism_in_asia_goal_name:0 "Оголосити війну комунізму в Азії"
 warlord_support_from_SHX:0 " [SHX.GetNameDefCap]([?SHX.warlord_political_support_value|+0])"
 water_deep_ocean_desc:0 ""
 weltpolitik_tt:0 "Контролює всі старі §Y[GER.GetAdjective]і§! колонії"
 working_on_the_pan_american_highway:0 "Розпочато роботу над Панамериканським шосе"
 wtt_border_conflict_lost_attacker.1.a:0 "Потрібно контратаувати якомога раніше!"
 wtt_border_conflict_won_attacker.1.t:0 "Перемога в області [their_state.GetName]"
 wtt_burma_road.1.t:0 "Бірманську дорогу закрито"
 wtt_burma_road.3.desc:0 "Після успішного захоплення більшої частини бірманської дороги [From.GetAdjective]а влада дозволила транспортний рух нею. Загроза з боку ворожих військ зберігається, але постачання нею знову надходить."
 wtt_germany.13.a:0 "На наш бік перейшов давній союзник."
 wtt_germany.22.t:0 "Німеччина запрошує Польщу"
 wtt_germany.24.a:0 "Сподіватимемося, що вони мають рацію."
 wtt_germany.28.d.2:0 "Німецька імперія скасувала вигнання Вільгельма II і звернулася до Нідерландів із вимогою повернути колишнього кайзера. Нідерландці відмовилися, і ця суперечка переросла у військовий конфлікт!"
 wtt_germany.33.a:0 "Ми не відступимо! Хай живе кайзер!"
 wtt_germany.7.d:0 "У міру того, як ми все глибше залучаємось до сфери впливу держави [From.GetNameDef], наша економіка все більше залежить від нашого союзника. Коли сьогодні німці зробили черговий крок щодо зміцнення контролю за нашою економікою, ми нічого не змогли їм протиставити. В результаті вони тепер мають безпрецедентний вплив і на нашу зовнішню політику."
 wtt_infiltration.2.t:0 "В області [infiltrated_state.GetName] виявлено комуністичний осередок"
 wtt_japan.113.t:0 "[From.GetNameDefCap] підписує Троїстий пакт"
 wtt_japan.122.t:0 "Фашисти тікають до Маньчжурії"
 wtt_japan.128.a:0 "Тоді ми воюватимемо до останнього!"
 wtt_japan.3.desc:0 "Уряд держави [From.GetNameDef] ретельно обміркував нашу пропозицію щодо «підтримання порядку» в їхніх колоніях і вирішив відмовитися."
 wtt_news.11.e:0 "Ми мусимо готуватися до війни!"
 wtt_news.3.c:0 "Ми виконали нашу роботу, тримавши його в безпеці."
 wtt_news.38.t:0 "[PRC.GetLeader] перемагає у внутрішній боротьбі за владу"
 wtt_news.41.b:0 "$wtt_news.40.b$"
 wtt_news.59.b:0 "Сходження чергових «Сполучених Штатів Америки»."
 wtt_news.60.b:0 "Але чи буде нова держава досить сильною?"
 wtt_news.64.t:0 "Підйом держави [From.GetNameDef]"
 wtt_news.65.a:0 "Наша сила продовжує зростати!"
 wtt_news.69.b:0 "Невже колоніальні імперії розсипаються?"
 wtt_news.7.c:0 "Німці встряють у нашу сферу впливу..."
 wtt_political_organisation.3.a:0 "Вони стали прихильниками більш прогресивної теорії."
 wtt_prc.12.t:0 "[From.GetNameDefCap] відмовляється"
 wtt_prc.20.a:0 "Вимогти вибачення."
 wtt_prc.30.desc:0 "Під покровом ночі наші товариші з держави [JAP.GetManchuriaPuppet] влаштували саботаж на японському заводі. Подробиці про нанесену шкоду вкрай убогі, і імперіалісти заявляють лише, що весь район закритий.\n\nОдин цей факт говорить про те, що операція пройшла вдало. Залишається перевірити, чи змусить це японців перейти до рішучих дій."
 wtt_take_national_leadership.3.a:0 "Тоді ми захопимо владу силою!"
 wtt_warlord.1.desc:0 "В умовах, коли центральний уряд Китаю не здатний захистити свій народ від бандитів та комуністів, [From.GetLeader] нарешті усвідомив своє справжнє становище і звернувся до нас у спробі убезпечити себе. Він готовий на повну співпрацю та надасть нашим військам право на вільний прохід. В обмін він просить лише виділити йому частину військ для захисту його території та не забувати про ту роль, яку він зіграв, коли ми повністю реорганізуємо Китай."
 wtt_xian_incident.4.t:0 "[From.GetLeader] пропонує альянс із комуністами"
 wuw_GER_civil_war.4.a:0 "Розпустити всі без винятку"
 wuw_GER_civil_war.8.desc:0 "Через кілька років після нашої обіцянки відновити флот Еріх Редер і Крігсмаріне спробували переворот. На щастя, він провалився, але тепер нам потрібно провести чистку серед вищих офіцерів, щоб це не повторилося."
 wuw_GER_diplomacy.104.desc:0 "[FROM.GetAdjective]и погодились із нашою пропозицією встановити сфери впливу. Це має знизити ризики конфліктів за території."
 wuw_GER_diplomacy.109.a:0 "Спробуємо знову пізніше..."
 wuw_GER_diplomacy.111.t:0 "Договір про розвиток економічних відносин"
 wuw_GER_diplomacy.35.a:0 "Ці землі не їхні!"
 wuw_GER_diplomacy.64.desc:0 "\n[FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із пропозицією захисту від східної загрози. Проте ця безпека матиме свою ціну — ми повинні платити данину [FROM.GetAdjective] державі, якщо хочемо скористатися її щитом."
 wuw_GER_diplomacy.96.a:0 "Чудово!"
 wuw_GER_realpolitik.29.b:0 "Ми повинні зупинити цю дурницю!"
 wuw_GER_realpolitik.29.desc:0 "Після тривалого періоду зростання фашистських настроїв, фашистські елементи [ROOT.GetAdjective] втомилися чекати мирної зміни влади й підірвали поліцейську дільницю, що стало початком вуличних боїв. Після інтенсивних сутичок дипломатія остаточно провалилася, і почався збройний конфлікт. Ми можемо лише з затамованим подихом чекати, яким буде майбутнє [ROOT.GetAdjective] нації."
 wuw_GER_realpolitik.35.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 wuw_GER_realpolitik.49.desc:0 "Наш сюзерен зрадив нас повністю і вирішив передати наші землі [GER.GetNameDef]. Чи скоримося ми їхньому вибору, чи чинитимемо опір?"
 wuw_GER_realpolitik.51.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] нещодавно засудив нашу, як вони стверджують, незаконну окупацію галицьких земель, які, за їхніми словами, досі є законною частиною колишньої Австро-Угорської імперії — претензії на які висувають [FROM.GetNameDef] та їхні союзники. Тепер ми отримали ультиматум від [FROM.GetAdjective], і їхні війська концентруються на нашому кордоні. Як нам діяти?"
 wuw_GER_realpolitik.7.b:0 "Ми ніколи не віддамо свою свободу!"
 wuw_GER_reichskommissariats.10.desc:0 "Після захоплення стратегічної зони Південного Уралу постає питання щодо подальшої долі регіону. Деякі плани пропонують включити його до Московії, інші ж хочуть створити окремий рейхскомісаріат або включити його до Туркестану. Як вирішимо?"
 wuw_GER_reichskommissariats.12.t:0 "Керівництво Генеральної губернії"
 wuw_GER_reichskommissariats.14.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.2.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.20.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Андах, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_reichskommissariats.23.a:0 "Договори з Японією мають бути виконані"
 wuw_GER_reichskommissariats.24.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.26.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_weltpolitik.21.desc:0 "Як і слід було очікувати, нерозважний [FROM.GetLeader] з [FROM.GetNameDef] привів свої війська у повну бойову готовність після отримання нашого ультиматуму. Вони надіслали посланця із заявою, що не зроблять і кроку назад у цьому питанні."
 wuw_HUN_abide_by_the_little_ententes_stipulations:0 "Виконати умови Малої Антанти"
 wuw_HUN_allied_manufacturing_programs:0 "Союзницькі виробничі програми"
 wuw_HUN_demand_the_return_of_slovakia:0 "Вимогти [SLO.GetAdjective]у інтеграцію"
 wuw_HUN_demand_the_vojvodina:0 "Вимогти Воєводину"
 wuw_HUN_demand_wiedist_restoration_desc:0 "Принц Вільгельм фон Від правив Князівством Албанія як союзник Центральних держав. Після війни його було скинуто, а згодом трон захопив узурпатор Ахмет Зогу. Ми повинні негайно виправити цю історичну несправедливість!"
 wuw_HUN_develop_the_weiss_wm_21_solyom:0 "Розробити Weiss WM-21 Sólyom"
 wuw_HUN_dissolve_the_volksbund:0 "Розпустити Фольксбунд"
 wuw_HUN_end_the_white_terror_desc:0 "Хоча багато хто вважає, що Білий терор уже завершено, ми знаємо правду... Міклош Горті та його парамілітарні банди досі полюють на тих, хто мріє про краще завтра. Ми повинні покласти край його правлінню насильницькою революцією."
 wuw_HUN_joint_air_development_desc:0 "Найефективнішим шляхом до створення нових моделей літаків є співпраця з нашими союзниками. Об'єднуючи найкращі уми з усіх країн, ми досягнемо найкращих результатів."
 wuw_HUN_kadars_hussars_desc:0 "Пуфайкаші — це революційна поліція нашої Червоної Армії. Її завдання — придушення інакодумства. Ми повинні розширити ці підрозділи, щоб забезпечити повну безпеку нашої держави."
 wuw_HUN_legacy_of_the_black_legion_desc:0 "Щоб підвищити ефективність нашої кавалерії та військової поліції, ми повинні брати приклад з Чорної армії короля Матяша Корвіна, натхненої легіонами Юлія Цезаря."
 wuw_HUN_magyar_kiralyi_csendorseg:0 "Magyar Királyi Csendörség"
 wuw_HUN_negotiate_the_restrictions_desc:0 "Таємне переозброєння маломасштабне і недостатнє. Ми повинні звернутись до сусідів з вимогою перегляду умов договору, накладених на нас після Великої війни. Угорщина має таке ж право на озброєння, як і інші країни."
 wuw_HUN_news_events.7.a:0 "Пролетарі всіх країн, єднайтесь!"
 wuw_HUN_pass_statute_xix_desc:0 "Оскільки [ROOT.GetLeader] слабшає, варто прийняти статут XIX про створення Національної ради у разі вакантного регентства. Ця Országtanács обере нового регента. Дехто побачить у цьому спробу встановити династію — і нас це влаштовує."
 wuw_HUN_pressure_romania_desc:0 "Фокусуючись на загрозі з Заходу, ми не можемо допустити небезпеку позаду. Румунія має або стати комуністичною, або передати контроль над важливими маршрутами."
 wuw_HUN_reenlist_the_sich_riflemen:0 "Знову завербувати Січових стрільців"
 wuw_HUN_repulo_muszaki_intezet_desc:0 "Повітря стає новою площиною війни, і його значущість недооцінена. Ми повинні оволодіти цим виміром і виділити ресурси на розробку доктрин та оснащення, які нам це дозволять."
 wuw_HUN_revive_the_tribal_consolidation_desc:0 "Дехто забув про велич угорської нації, але Рух Дракона — ні. Ми переформуємо суспільство згідно з його ідеалами."
 wuw_HUN_strengthen_the_turani_vadaszok_desc:0 "У 1927 році Гюла Гьомбьош заснував фашистське формування Туранських мисливців, що протистоять німецькому нацизму, спираючись на угорський туранізм. Ми можемо використати їх для власної вигоди."
 wuw_HUN_the_balkan_pact_tt:0 "Відкриває рішення для §Yзапрошення балканських країн§! до нашої фракції"
 wuw_HUN_the_old_grand_alliance_desc:0 "У 1689 році ми уклали союз із Вільгельмом III від імені Голландської республіки та Англії, щоб стримати експансію Франції. Сьогодні світ знову палає, і настав час відновити цю стару угоду."
 wuw_HUN_undoing_the_yugoslav_mistake_desc:0 "Створення Югославії стало однією з найбільших помилок в історії людства, і ми повинні зробити все можливе, щоб повернути старі землі Держави словенців, хорватів і сербів. Угорщина знову постане!"
 ww_BEL_event_diplomatic.15.c:0 "Ми надішлемо їм $support_equipment$!"
 ww_BEL_event_diplomatic.16.desc:0 "Ми отримали запит від керівництва [FROM.GetAdjective] щодо використання наших фабрик для виробництва обладнання для їхніх залишкових військ. Вони прагнуть повернути свої землі, і для цього їхні війська потребують техніки."
 ww_BEL_event_diplomatic.17.b:0 "Це не варте часу"
 ww_BEL_event_diplomatic.18.a:0 "Чудова новина!"
 ww_BEL_event_diplomatic.20.a:0 "Чудова ініціатива!"
 ww_BEL_event_diplomatic.33.desc:0 "Нейтралітет приносив нашій країні велику користь, але залишатися нейтральними може змусити інших сприймати нас лише як пасивного спостерігача та мішень. Ми повинні ретельно розглянути майбутнє нашої зовнішньої політики та нашу позицію стосовно збройних конфліктів, оскільки конфлікт, схоже, наближається до нас."
 ww_BEL_event_diplomatic.35.t:0 "[FROM.GetNameDefCap] Звертається до нас"
 ww_BEL_event_political.1.t:0 "Уряд йде у відставку та дострокові вибори"
 ww_BEL_event_political.5.a:0 "Прем'єр-міністр має піти у відставку та оголосити дострокові вибори"
 ww_BEL_event_war.3.b:0 "Продовжимо боротьбу!"
 ww_congo.11.d:0 "Французи погодилися з нашими вимогами, і їхні бази та установи в [772.GetName] тепер у нашому повному розпорядженні. Вони фактично передали нам повний контроль над їхньою колонією."
 ww_congo.13.b:0 "Ніколи!"
 ww_congo.20.a:0 "Це не наша справа, щоб їх зупиняти"
 ww_congo.31.a:0 "Справжнє жалю"
 ww_congo.41.a:0 "Це на благо народу"
 ww_congo.53.t:0 "[FROM.GetLeader] вимагає об'єднання народу Бурунді"
 ww_congo.6.t:0 "Бельгійці відхиляють нашу схему виробництва їжі"
 ww_congo.61.a:0 "Сьогодні день, який запам'ятається..."
 ww_congo.64.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], погодився підписати угоду з ураном, яку ми їм запропонували, і надіслав нам необхідні платежі, які ми запросили."
 ww_congo.72.a:0 "Ми його поставимо на роботу"
 ww_congo.72.desc:0 "Польський пілот винищувача Ян Зумбах щойно прибув до нашої країни і заявив, що хоче приєднатися до нашого повітряного флоту і боротися за нас. Напевно, є якась роль, яку ми можемо йому доручити?"
