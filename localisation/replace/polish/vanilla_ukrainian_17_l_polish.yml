 OVERWRITE_EXISTING_DESIGN_DESC:0 "§GКлацніть§!, щоби перемкнути опцію перезапису дизайну.\nЦей дизайн було створено з існуючого шаблону. Якщо це задіяно, існуючий дизайн буде перезаписано."
