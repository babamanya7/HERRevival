 neutral_to_fascist_tt:0 "Уся популярність §Yнейтралітету§! стає популярністю §Yфашизму§!."
 news.10.e:0 "Тішся тимчасовою перемогою, Москва."
 news.102.t:0 "Падіння Лондона"
 news.109.d:0 "Війська німецького африканського корпусу з боями увійшли до столиці Єгипта, Каїру.\n\nСили Союзників відступили в напрямку пустелі, і німців, що входять до міста, жителі вітали як визволителів, що позбавили Єгипет від гнобителів-англійців.\n\nПадіння Каїру стало істотним ударом для Союзників, і багато експертів стверджують, що тепер ніщо не заважає Німеччині просуватися на Близький Схід."
 news.11.d:0 "Перекинувши війська до кордону держави [ROM.GetNameDef], [SOV.GetNameDefCap] висунув ультиматум румунському уряду про негайну передачу контролю над Бессарабією, яка раніше була частиною Російської імперії.\n\nВиявивши несподівану незгідливість, Бухарест відкинув ці територіальні претензії й оголосив загальну мобілізацію.\n\nМіжнародні спостерігачі стверджують, що [SOV.GetAdjective]і війська будь-якої миті можуть перейти кордон."
 news.123.d:0 "Війська Японської імперії захопили Гонконг, перлину колоніальної Британії, прорвавши «Лінію любителів джину» та висадившись безпосередньо на острові. Стримувати натиск захисники змогли недовго, і губернатор особисто здався японцям у готелі «Пенінсула Гонконг», де вони влаштували свою штаб-квартиру.\n\nПісля короткої церемонії було призначено нового японського губернатора, який оголосив усьому світу про те, що «Новий Гонконг» нарешті «звільнений від західного колоніалізму»."
 news.146.d:0 "Радянські війська підступили до Токіо, і по всьому місту йдуть запеклі бої. Зараз майже все місто під контролем радянських військових, за винятком східних передмість, де все ще вирують пожежі.\n\nГоворять, що коли бої змістилися в бік імператорського палацу, члени імператорської гвардії кинулися в штикову атаку. Палац був узятий загонами повітряного десанту, яким довелося пробиватися із боєм крізь кожне приміщення. Полонених вони не брали, але, за чутками, імператор був своєчасно евакуйований із палацу, задовго до падіння міста."
 news.163.b:0 "Справедливість."
 news.164.d_FRA_abandoned_yugoslavia:0 "Включивши Австрію до свого складу, держава [GER.GetName] використала це для виправдання подальших претензій та назвала «правомірним» повернення колишніх австрійських територій, зокрема Словенії, яка зараз належить державі [YUG.GetName].\n\nУ відповідь на це в Лондоні була скликана конференція для обговорення «словенського питання», куди прибули делегати країн, які підписали Версальський договір.\n\nБитанія вимагала дотримання Версальського договору, проте Франція вирішила погодитися на вимоги німців заради збереження миру в Європі."
 news.174.t:0 "[From.GetName] досліджує ядерні технології"
 news.184.a:0 "Наші країни мають багато спільних інтересів."
 news.185.d:0 "Прагнучи змінити баланс сил у Середземномор'ї, [From.GetName] робить політичні кроки до створення нового альянсу в регіоні.\n\nЗдебільшого маючи військовий характер, [From.GetFactionName], за словами [From.GetLeader], поставить Італію в центр нової світової держави."
 news.19.t:0 "[GER.GetNameDefCap] вимагає Мемель"
 news.207.f:0 "[USA.GetNameDefCap] повині зробити все можливе, щоб захистити себе"
 news.214.d_baltic:0 "[POL.GetName] поступово дистанціюється від міжнародної спільноти, добре розуміючи, що не може покладатися на політиканство «великих держав», щоб запобігти агресорам знову зруйнувати польську державу.\n\nНатомість [POL.GetLeader] представив плани альянсу для зміцнення Балтійського регіону, який, як ми сподіваємося, стримуватиме агресію зі сходу чи заходу.\n\nВ умовах погіршення європейської стабільності такий альянс може бути в наших інтересах."
 news.214.d_not_baltic:0 "\"Для нас не існує жодного результату, який би не загрожував ще більшим пригніченням польського народу.\"\n\nПісля дистанціювання [POL.GetName] від міжнародної спільноти, польські політики переслідують ідею потуги \"Міжмор'я.\"\n\nХоча сподівання полягають у створенні альянсу від Балтійського до Чорного моря, їхнім заявленим пріоритетом залишається зміцнення своїх позицій проти загрозливих впливів як на сході, так і на заході. З цією метою [POL.GetName] шукає тісніших зв'язків зі своїми сусідами на Балтиці."
 news.221.d:0 "[SOV.GetNameDefCap] пережила велике потрясіння, оскільки Сталін був скинутий фракцією, яка підтримувала його старого політичного суперника [SOV.GetLeader]!\nЩодо того, де зараз перебуває старий диктатор, або як саме відбувся перехід, подробиць все ще мало.\nВсе вказує на те, що це не був мирний перехід, оскільки деякі лоялісти Сталіна підняли свої прапори в знак протесту проти нового режиму Троцького."
 news.235.d:0 "Радісна новина для нашого лідера, [GER.GetLeader]: його улюблена кінозірка, єдиний і неповторний Чарлі Чаплін, був знайдений у Каліфорнії. Під час втечі в сільську місцевість його зупинив [GER.GetAdjective]ий патруль, який одразу впізнав його за культовими вусами. Після того, як він повторив фінальний монолог свого майстерного «Великого диктатора», шановного актора «переконали» поїхати з ним, щоб розважити [GER.GetAdjective]і війська, дислоковані в регіоні.\n\nТепер його збираються відправити до Берліну, де [GER.GetLeader] нарешті зустрінеться зі своїм героєм. Хоча політичні розбіжності можуть завадити зустрічі, [GER.GetLeader] чекає на неї з дитячим нетерпінням."
 news.237.e:0 "Це порушує Версальський договір!"
 news.237.t:0 "Аншлюс Австрії"
 news.264.b:0 "Перший крок на шляху до справжньої свободи."
 news.27.d:0 "Нещодавно німецькі війська перетнули Райн і розташувалися неподалік від французького кордону, демонстративно порушивши Версальський договір. Велика Британія відреагувала стримано, тоді як Франція розпочала мобілізацію військ для вторгнення до Німеччини.\n\nВ Європі знову війна!"
 news.296.b:0 "Ще один слабак встає."
 news.296.c:0 "Ще один, хто буде нести смолоскип."
 news.312.desc.b:0 "З [HUN.GetAdjective]ої ініціативи Італія й Угорщина поновили дію Римських протоколів, первісно підписаних у 1934 році. Угоди стосуються економічного розвитку та зближення. По суті, це декларація про дружбу, але є ознаки того, що вона може призвести до офіційного союзу, спрямованого на протидію зростаючим ревізіоністським та експансіоністським тенденціям держави [GER.GetNameDef]."
 news.317.b:0 "Ми на боці Румунії."
 news.328.b:0 "Ми розчавимо їх, якщо вони спробують!"
 news.38.d:0 "Сьогодні, після відчайдушної боротьби у власному будинку в Мехіко, Лев Троцький прикінчив невдалого вбивцю його власним льодорубом. Нападником виявився іспанський націоналіст, що перебуває на службі НКВС. Троцький колись був соратником і можливим спадкоємцем Леніна, але після безуспішної боротьби за владу був видворений із Радянського Союзу Йосипом Сталіним.\n\nУ зверненні до преси Троцький оголосив, що цей замах став «ще однією жалюгідною спробою Сталіна заткнути рота супротивникам свого режиму»."
 news.56.e:0 "Це не угода, це диктат!"
 news.61.d_2:0 "Після анексії Чехословаччини Німеччиною почалися суперечки про те, яким чином мають бути розділені ці території, але тепер, схоже, рішення знайдено.\n\nУгорські війська за підтримки німців захопили Словаччину і приєднали її до Угорщини."
 news.7.t:0 "Радянсько-японська сутичка"
 no_one_will_notice_the_difference_tt:0 "Граючи як [INS.GetNonIdeologyName], розгорніть Густава Адолфа Ілгена в області [141.GetName]"
 nsb_news.103.desc:0 "[SOV.GetNameDef] і [GER.GetNameDef] підписали торгову угоду. [SOV.GetAdjective] держава має намір з її допомогою посилити свій промисловий і військовий розвиток, [GER.GetAdjective] держава зможе збільшити імпорт вкрай потрібної їй сировини, зокрема зерна, нафти та залізняку."
 nsb_news.12.b:0 "З вогню та в полум'ї."
 nsb_news.403.d:0 "Поширення фашизму вийшло з-під контролю!"
 nsb_news.5.c:0 "Що це за безумство?"
 nsb_news.5.desc.saxon:0 "5 листопада 1916 року німецький Вільгельм II та австрійський Франц Йосип підписали спільну декларацію про створення нової держави з польських земель, окупованих Росією, — Королівства Польща. Однак молода держава не змогла знайти оголосив Другу Польську республіку. Тепер же, здається, Польща нарешті знайшла собі короля — ним буде [POL.GetLeader]!"
 nuclear_bomb:0 "Ядерна бомба"
 nuke_dropped.12.c:0 "With plutonium we bring the Danes to their knees!"
 nuke_dropped.2.t:0 "Атомне бомбардування Хірошіми"
 offensive_formations_desc:0 "Навчившись дотримуватися наступального бойового порядку, наші пілоти стануть ефективнішими в бою."
 offer_military_access_active:0 "надає право проходу військ державі"
 offer_military_access_receiver_desc:0 "Держава $COUNTRY|UY$ має право проходу військ крізь територію інших країн."
 operation_barbarossa_desc:0 "Ми збираємося провести найбільшу військову кампанію в історії — захопити Радянський Союз! Ми зробимо те, що не вдалося Наполеону. Наступайте від кордонів, оточуйте радянські війська і рухайтеся вперед. Операція закінчиться успішно, якщо ми займемо Москву і встановимо лінію фронту осі Архангельськ-Астрахань. На Схід!"
 operation_coordinated_strike:0 "Зкоординований удар"
 operation_huansheng_failure_tt:0 "Наліт був повною катастрофою. Жоден бомбардувальник не досяг своєї зони скидання, і багато з них було збито корабельною ППО."
 opqr_class:0 "Клас «O»/«P»/«Q»/«R»"
 order_of_the_civil_union:0 "Герой Данського народного союзу"
 paraguay.1.a:0 "Чудова ідея"
 pavel_events.2.desc:0 "Кубанська народна республіка — нація-перебіжчик, яка спочатку боролася за білих, а потім — за червоних. [Root.GetLeader] збирається відновити Кубанську республіку з новим, білим урядом.\nХоча одного разу кубанці вже зрадили біле рух, новий ватажок запевняє нас, що уряд зробить все, що в його силах, щоби позбавити колишню верхівку будь-якої підтримки."
 peasant_militia_civil_war_tt:0 "Коли почнеться §Yгромадянська війна§!, отримати 4 військові частини з §Y6§! батальйонами §Yпіхоти§!.\n"
 penal_infantry_desc:0 "Штрафні батальйони дають можливість ув'язненим солдатам й офіцерам Червоної армії вмерти за свою вітчизну і спокутувати себе за ганебні чи нечесні дії, скоєні в минулому."
 peoples_army:0 "Народна армія"
 peoples_war_quick_decision_offensive_warfare:0 "Наступальна війна швидких рішень"
 poland.11.a:0 "Тільки тримаючися разом ми будемо в безпеці."
 poland.11.d:0 "У безглуздому акті уявного самозбереження [From.GetLeader] сьогодні оголосив, що [From.GetName] утримуватиметься від будь-яких дипломатичних дій, які можуть бути розцінені як загроза їхнім могутнім сусідам. Тому [From.GetAdjective]а влада відхилила наше прохання приєднатися до альянсу [Root.GetFactionName]."
 poland.16.b:0 "Не бачу причини укладати союз із поляками."
 poland.2102.d:0 "[DNZ.GetLeader] продемонстрував свою користь у боротьбі з державою [POL.GetNameDef], але сама автономна область нам більше не потрібен, і [DNZ.GetLeader] стане гаулайтером райхсгау «Данциг–Східна Пруссія», інтегрованого в державу [Root.GetNameDef]."
 poland.6.t:0 "[FROM.GetNameDefCap] приймає захист"
 poland.9.a:0 "Ситуація, схоже, вирішена — і обидві сторони задоволені."
 political.1.a:0 "Дехто в самому уряді може підтримати ці ідеї."
 political.13.d:0 "«Якщо ми змусимо замовкнути голоси людей, як кожен із нас може стверджувати, що він сам є голосом держави [Root.GetName]? Якщо ми боїмося інакомислення, якщо ми боїмося бути публічно засудженими або зміщеними шляхом голосування, то насправді ми боїмося того, що нас ненавидять і зневажають наші власні громадяни. Чи справді [Root.GetRulingParty] так мало довіряє своїм принципам?»\n\nОбережна і слабко організована, але пристрасна фракція в уряді почала наполягати на менш репресивній політиці проти ворогів держави. Вони хочуть залучити громадськість до прийняття рішень крізь референдуми та місцеві партійні збори, навіть якщо це означає ризик для долі поточного порядку денного."
 political.18.t:0 "Фашисти вимагають референдум"
 political.19.a:0 "Анти-[Root.GetAdjective]у активність треба спинити!"
 political.29.t:0 "Кінець громадянського конфлікту"
 political.7.a:0 "Верхи можуть тихо мати симпатії."
