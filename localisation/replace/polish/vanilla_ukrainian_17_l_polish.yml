 INS_expand_sea_routes:0 "Розширення морських шляхів"
 INS_governor_general_de_jonge_desc:0 "Боніфацій Корнеліс де Йонге відомий тим, що правив залізною рукою, виступав проти будь-яких форм націоналізму і часто ігнорував побажання Фольксрааду. Його правління над Ост-Індією тривало довго, а його досвід сягає ще часів великої війни, де він служив міністром оборони Ост-Індії."
 INS_govt_relocated_tt:0 "§Y[HOL.GetNameDefCap]§! переносить свій Уряд на Яву."
 INS_gradual_escalation_HOL_desc:0 "Звіти з наших резидентур погіршуються з кожним тижнем. Повстанці завдають ударів у районах, де, як вважалося, вони не діють, а військове командування в Батавії наполягає на застосуванні більш жорстких заходів, ніж будь-коли раніше. У Гаазі тих, хто колись закликав до терпіння, стає менше на кожному засіданні кабінету міністрів."
 INS_guided_economy:0 "Керована економіка"
 INS_guided_economy_desc:0 "Ми безпосередньо контролюватимемо економіку Індонезії, щоб гарантувати збереження контролю. Ми націоналізуємо всі банки, а також нафтовий та сільськогосподарський сектори."
 INS_improve_the_category_of_state_decision:0 "Інвестувати в урбанізацію §Y[FROM.GetName]§!"
 INS_industrial_events.6.c:0 "Зміцнювати нашу військову промисловість."
 INS_instigate_chaos_sulawesi:0 "Спровокувати хаос на Сулавесі"
 INS_launch_revolution_desc:0 "Умови в [FROM.GetName] дозріли. Наші агенти повідомляють про зростання заворушень на фабриках і полях, а місцеві партійні осередки готові діяти. Настал час закликати робітників і селян [FROM.GetName] піднятися і захопити те, що належить їм по праву."
 INS_loyalist_events.18.a:0 "Можливо, іншим разом."
 INS_loyalist_events.25.b:0 "Ми занадто важко боролися за цю республіку."
 INS_loyalist_events.9.t:0 "[FROM.GetNameDefCap] голосує проти об'єднання"
 INS_maphilindo_fascism:0 "Малайська імперія"
 INS_maphilindo_neutrality:0 "Федерація малайських народів"
 INS_militias_pki_uprising_mission:0 "Комуністичне повстання неминуче"
 INS_modern_tank_equipment_1:0 "Gevechtstank 8"
 INS_modern_tank_equipment_1_short:0 "GVT-8"
 INS_national_revolution_cat_desc:0 "Після 350 років нідерландської тиранії ми взяли справу у свої руки й проголосили незалежність. Нідерланди не визнають нашу владу, продовжуючи правити Ост-Індією як своєю колонією та ставлячись до нас як до злочинців.\n\nМи повинні продовжувати брати під контроль нові регіони та важливі міста і повалити нідерландський уряд зсередини. Однак нам слід бути обережними, щоб не діяти занадто агресивно без ретельного планування, оскільки стрімка ескалація з нашого боку може спровокувати військові дії Нідерландів."
 INS_naval_steal_success_tt:0 "§Y35%§! флоту [THIS.GetAdjective] захоплено."
 INS_negotiate_new_contracts:0 "Переговори про нові контракти"
 INS_oil_for_plane:0 "Продати нафту американським авіабудівним компаніям"
 INS_organize_jakarta_pemuda_desc:0 "На Яві є багато груп Пемуда будь-яких розмірів. Хоча ми мобілізували та набрали більшість із них, у Джакарті є десятки невеликих, які все ще діють самостійно. Ми маємо зв'язатися з ними та налагодити співпрацю."
 INS_pledge_to_allies:0 "Присяга Союзникам"
 INS_political_events.14.a:0 "Шкода, він був би цінним союзником."
 INS_reduce_land_taxes:0 "Зниження податків на землю"
 INS_reform_education_system:0 "Обов'язкова ідеологічна освіта"
 INS_renville_tt_HOL:0 "§W§Y[USA.GetFlag][USA.GetNameDefCap]§! висуне нам ультиматум. Якщо ми не здамося і не вийдемо з Індонезії, вони §Rоголосять нам війну§!.§!"
 INS_reorganize_freedom_fighter_militia_recon:0 "Реорганізувати розвідувальні підрозділи борців за свободу"
 INS_revolution_events.20.t:0 "[HOL.GetNameDefCap] погоджується на рішення про дві держави!"
 INS_revolution_events.5.a:0 "Якщо революціонери досягнуть успіху, громадяни в наших колоніях можуть надихнутися зробити те саме."
 INS_revolution_planning_hq_DONE_desc:0 "Це наш революційний штаб, куди звітують наші загони ополчення. Цей регіон буде під нашим контролем, як тільки ми проголосимо незалежність."
 INS_revolution_points_remaining_tt:0 "Можна побудувати ще принаймні §Y1§! базу ополчення (зараз залишилося §Y[?INS_revolution_points_remaining]§!)"
 INS_revolutionary_sentiment_desc:0 "У [FROM.GetName] є ті, хто вже самостійно взявся за справу. Їм бракує організації та ресурсів, але не переконань. Координуючи свої дії з цими групами, ми можемо прискорити крах існуючого порядку, навіть якщо викликана цим нестабільність ускладнить управління країною в короткостроковій перспективі."
 INS_scout_plane_equipment_2_short:0 "Dornier Do 24"
 INS_set_leader_to_oerip:0 "Обрати $INS_oerip_soemohardjo$"
 INS_sleeper_informant_network:0 "[GetInformantNetworkName]"
 INS_sukarnos_industrialization2_desc:0 "Військові зусилля — пріоритет номер один цієї нації, а тому пріоритет номер один кожного індонезійця — зробити свій внесок. Розкіш — це ворог, військово-промисловий комплекс має зростати."
