 BRA_kgbrazil_cangaco:0 "Rede Coiteiros"
 BRA_seek_soviet_support_desc:0 "Якщо ми хочемо досягти успіху та перетворити нашу країну на комуністичне суспільство, на яке заслуговує наш народ, нам знадобиться підтримка ззовні. [SOV.GetNameDefCap] вже допомагав нам раніше, здається, це єдино правильним — знову попросити їхньої підтримки для забезпечення нашого успіху."
 BRA_socialist_latin_american_cooperative:0 "Латиноамериканський соціалістичний кооператив"
 BRA_submarine_2:0 "Клас «Tupy»"
 BRA_support_the_landowners_desc:0 "Світовий попит на цукор продовжував зростати протягом десятиліть, що призвело до появи класу заможних землевласників у [ROOT.GetNonIdeologyName], які вирощують цю культуру, відомих як «Цукрові барони». Ми повинні спробувати завоювати їхню прихильність, припинивши заклики до земельної реформи серед селянства."
 BRA_united_states_of_south_america_cos_tag_fascism:0 "Велика Південна Америка"
 BRA_washington_accords_desc:0 "В обмін на американські військові гарантії ми спрямуємо нашу економіку на виробництво військового обладнання, щоб підтримати їх у захисті наших спільних цінностей."
