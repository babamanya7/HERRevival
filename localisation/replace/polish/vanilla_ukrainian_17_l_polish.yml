 USA_emergency_arms_deliveries_desc:0 "Франція впала, і Британія тепер стоїть одна проти агресора, намагаючись захистити свої береги від вторгнення. За допомогою палкої риторики вони показали, що їхня рішучість така ж сильна, як ніколи, і вони не мають наміру мовчки йти в ніч. Ми повинні перед демократією забезпечити їм засоби для захисту своєї свободи."
