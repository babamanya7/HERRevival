 COMBAT_EXILES_ON_CORES_DESC:0 "§HВетерани у вигнанні§! борються на осердній землі. Атака: $ATK_ON_CORE|%+$ Оборона: $DEF_ON_CORE|%+$."
 CONFIRMCHANGE_HQ_TEMPLATE_SINGLE:0 "Ви дійсно хочете §YЗМІНИТИ§! §Yшаблон штабу§! на $TEMPLATE|H$ для цього §Yпідрозділу§!? Може знадобитися певний час, перш ніж надійде нове спорядження."
