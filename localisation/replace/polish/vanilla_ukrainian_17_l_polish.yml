 SOV_the_supreme_soviet_desc:0 "Представництво однією людиною цілої країни — по своїй суті недемократично, а отже, контрреволюційно. Натомість ми покінчимо з такою окультною поведінкою і заявимо, що наш союз назавжди буде представлений колективною волею народу, зібраною у Верховній Раді."
