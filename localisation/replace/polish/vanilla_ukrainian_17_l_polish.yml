 GOE_RAJ_partition.3.desc:0 "Напруга в [?unrest_target_state.GetName] досягла критичного рівня, оскільки місцева поліція намагається стримати дедалі більш неспокійні натовпи. Фабрики, пов'язані з урядом, стали ключовими мішенями для агітаторів, які часто зазнають актів саботажу на тлі ескалації заворушень."
