 GRE_republican_national_socialism_tt:0 "Король-чужоземець §YГеорг II§! мусить §Yзникнути§!.\nЦе практично каструє §Yфракцію монархістів§!, і згодом її буде неважко знищити. Найближчим часом вона почне §Rпротистояння§! з фашистським! "
