 WW_hungary.103.b:0 "Погодимось, але з умовою"
 WW_hungary.108.t:0 "[FROM.GetNameDefCap] хоче коронувати Германа Герінга"
 WW_hungary.13.b:0 "Нам доведеться це відпустити"
 WW_hungary.17.t:0 "[HUN.GetName] вимагає окупацію Західного Банату"
