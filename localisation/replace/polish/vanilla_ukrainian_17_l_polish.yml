 YUG_air_research_group_desc:0 "Велика Британія та Югославія обмінялися літаковими технологіями."
 YUG_arm_communist_militants:0 "Озброїти [YUG_communist_coup_target.GetAdjective] бійців"
 YUG_armored_cavalry_desc:0 "Прибивання броні до транспортних засобів значно поліпшує їх живучість, бойову силу та моральний дух. Однак для цього потрібен новий тип принаймні частково гусеничного транспортного засобу, який може нести додаткову вагу, не застрягаючи на місцевості, а також мати власну зброю."
 YUG_banat_for_support:0 "Банат в обмін на підтримку"
 YUG_divide_bosnia_desc:0 "У ландшафті боснійського регіону існують культурні та релігійні відмінності; серби, хорвати, мусульмани, християни та незліченна кількість інших народів. Єдиний спосіб належним чином захистити регіон — це належним чином розділити його між окремими державами Боснії та Герцеговини, які працюють у гармонії з нашим союзом."
 YUG_expand_the_split_shipyards_desc:0 "Наша вже існуюча суднобудівна галузь у Далмації є головним кандидатом на розширення, і вона має достатньо можливостей для більших військових кораблів. Проте вимоги Хорватії щодо збільшення автономії цілком можуть призвести до того, що ми зрештою втратимо прямий контроль над об'єктами."
 YUG_fighter_license:0 "Ліцензії на винищувачі"
 YUG_instigate_in_bulgaria_desc:0 "Наша держава звільнила майже всіх південнослов'янських робітників, крім болгар. Лише спонукавши їх повстати проти своїх гнобителів, ми зможемо з повним правом стверджувати, що звільнили слов'янських робітників на Балканах."
 YUG_instigate_in_romania:0 "Підбурювати селянські повстання в Румунії"
 YUG_modern_tanks:0 "Сучасні танки"
 YUG_peasant_uprisings:0 "Підбурювати селянські повстання"
 YUG_raid_croat_villages_desc:0 "Усташі водночас і скрізь, і ніде: будь-хто може бути прихильником їхньої марки фашизму. Ми мусимо здійснити рейд по всіх містах і селах Хорватії і винюхати там зрадників."
