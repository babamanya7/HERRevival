 MAN_research_and_education_department_desc:0 "Разом із зростанням країни ми маємо забезпечити розвиток і у питаннях науки та освіти. Потрібно докласти всіх зусиль для того, щоби науковий прогрес йшов у найважливішому для нас напрямі."
