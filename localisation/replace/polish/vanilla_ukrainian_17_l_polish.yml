 SOV_the_enemies_of_the_people_desc:0 "Сили реакції все ще на волі і готуються до того дня, коли вони зможуть звести нанівець усе, чого ми досягли. Ми і наші союзники повинні бути завжди пильними перед цією загрозою і готуватися до того, що нам доведеться боротися, щоб захистити революцію."
