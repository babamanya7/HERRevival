 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_NONAGGRESSIONPACT:0 "\nДержава §Y$COUNTRY$§! §Gпогодилася§! підписати з нами пакт про ненапад.\n\nТепер між нашими двома державами не буде війни."
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_OFFER_DOCKING_RIGHTS:0 "\nДержава §Y$COUNTRY$§! §Gприйняла§! наше прохання і надала нам право на стоянку в портах.\n\nТепер вони можуть розміщувати свої кораблі"
