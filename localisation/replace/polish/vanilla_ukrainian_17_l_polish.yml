 DEN_develop_iceland:0 "Розвивати Ісландію"
 DEN_expand_the_ivittuut_mine_desc:0 "Шахта в Івіттууті є нашим єдиним джерелом алюмінію, який є найважливішим компонентом у виробництві сучасних літаків. Розширивши цю шахту, ми могли б або збільшити внутрішнє виробництво літаків, або експортувати алюміній до інших країн."
 DEN_full_social_mobilization_desc:0 "Війна стоїть на нашому порозі, і щоб захистити нашу свободу, ми повинні мобілізувати всі верстви суспільства. Кожен чоловік, жінка і дитина повинні знати свої обов'язки та відповідальність. Це вимагатиме певних витрат, але весь наш промисловий потенціал має бути спрямований на підтримку переозброєння та безпеки данського народу."
 DEN_generalkommandoen_desc:0 "Добре підготовлені, дисципліновані та добре функціонуючі офіцери — це коріння успішної армії. Ми повинні прагнути випускати найефективніших і найкомпетентніших офіцерів у світі і наповнювати ними наш генеральний штаб."
 DEN_german_danish_joint_military_program_desc:0 "Спільна військова програма для обміну технологічними досягненнями."
 DEN_greater_denmark_communism_DEF:0 "Північногерманська народна республіка"
 DEN_increase_warfare_bop_cost_tt:0 "\nВартість рішень §Y$DEN_welfare_side$§! зросте на £pol_power §R+50§!.\n\n"
 DEN_intel_sharing_desc:0 "Поглиблення співпраці з нашими союзниками проти [?DEN.DEN_overlord_nation.GetNameDef] шляхом обміну розвідданими між нашими країнами зміцнить наші зв'язки і здатність врешті-решт повалити гніт [?DEN.DEN_overlord_nation.GetAdjective]."
 DEN_mio_trait_madsen_20_mm:0 "Покращені бронебійно-фугасні боєприпаси"
 DEN_northern_national_front_invitation:0 "Запросити державу [FROM.GetNameDef] до §Y$DEN_northern_national_front$§!"
 DEN_recall_landstormen:0 "Відкликати всіх ополченців Landstormen"
 DEN_scandinavian_security_desc:0 "Скандинавія і Балтійське море були головними геополітичними центрами для [DEN.GetNameDef] протягом останніх кількох століть. Перш ніж переключити нашу увагу на основні європейські держави на континенті, ми повинні спочатку підкорити і заспокоїти наш північний фланг."
 DEN_seek_foreign_support_decision:0 "Звернутися за підтримкою до держави [FROM.GetNameDef]"
 DEN_seek_guarantor:0 "Шукати [FROM.GetAdjective]ий захист"
 DEN_seek_protection_desc:0 "Хоча ми можемо готуватися скільки завгодно, нас оточують більші та сильніші сусіди, в намірах яких ми не можемо бути достеменно впевненими. Тому для забезпечення нашої незалежності доцільно шукати захисту деінде."
 DEN_ship_secondaries_1:0 "150mm/49 L/50 M.06"
 DEN_side_with_unions:0 "Стати на бік профспілок"
 DEN_sign_non_aggression_deal_desc:0 "Ми багато виграємо, якщо нам вдасться подружитися з сильнішою країною і підписати з нею пакт про ненапад. Можливо, найближчим часом це не змінить нашої нестабільної ситуації, але в майбутньому ці тісніші зв'язки можуть принести нам користь, відкриваючи різні торговельні угоди та збільшуючи співпрацю."
 DEN_welfare_max_range:0 "Найвищі витрати на добробут"
 DEPLOYMENT_RAIDS_DESC:0 "§YНальоти§!\n§TУстановіть пріоритет надсилання оснащення на підготовку нальотів.§!"
