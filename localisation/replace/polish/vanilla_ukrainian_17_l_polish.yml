 GER_african_allies_faction_tt:0 "Незалежні африканські малі держави, які не входять до фракцій, отримують наступну подію:"
 GER_agricultural_reforms_desc:0 "Наш аграрний сектор здебільшого складається з невеликих сімейних фермерських господарств, які використовують багато ручної праці. Ми можемо реформувати весь аграрний сектор, запровадивши сучасне обладнання та збільшивши виробництво кожної окремої ферми. Від цього виграє вся наша нація!"
 GER_aided_in_ceremony_preparations:0 "Допомога в підготовці до церемонії"
 GER_anti_comintern_pact_unaligned:0 "Ідеологічна оборона"
 GER_anti_soviet_pact_tt_3:0 "Буде отримано національний дух §YАнтирадянський пакт§!.\n"
 GER_ascension_of_speer:0 "$GER_inner_circle_member_title$ Шпеер"
 GER_assassinate_mussolini_ww:0 "Вбивство Муссоліні"
 GER_break_anglo_french_colonial_hegemony_ww_tt:0 "Якщо ми підписали договір про співпрацю з §YФранцією§!, ми не отримаємо воєнної цілі проти неї"
 GER_bypass_maginot_in_the_south:0 "Обійти Мажіно з півдня"
 GER_carl_walther_organization:0 "$GER_carl_walther$"
 GER_carrier_3:0 "Клас «Graf Zeppelin»"
 GER_challenge_the_monroe_doctrine_desc:0 "Хоча країни Центральної та Південної Америки віддалені від нас географічно, деякі з них дуже близькі до нас ідеологічно. Встановлення та підтримка добрих відносин з ними може принести нам обом велику користь. Більше того, закріплення на ще одному континенті може виявитися дуже цінним для майбутнього."
 GER_construct_the_north_atlantikwall:0 "Фінансування Північного Атлантичного валу"
 GER_controls_atlantic_coast_jylland_vlaanderen_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]а маріонетка або член альянсу повністю контролює всі регіони вздовж §YАтлантичного узбережжя§! від §Y[99.GetName]§! до §Y[6.GetName]§!."
 GER_crushed_the_monroe_doctrine_good:0 "Знищив Доктрину Монро"
 GER_cv_fighter_equipment_1_short:0 "Ar 197"
 GER_danzig_for_guarantees_ww:0 "$GER_danzig_for_guarantees$"
 GER_danzig_for_slovakia:0 "$GER_danzig_vs_slovakia$"
 GER_denazification_campaigns:0 "Кампанії з денацифікації"
 GER_develop_modern_maneuver_warfare:0 "Розробити сучасну маневрену війну"
 GER_division_wiking_mech_tt:0 "Елітна §Yмоторизована§! частина §Y5. SS-Division Wiking§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_effectivize_the_volkswerke_desc:0 "Так званий Volkswerke був одним із небагатьох корисних задумів попереднього режиму — державний промисловий концерн для нагляду за зростанням і виробництвом у видобувній і сталеливарній галузях. Ця структура заслуговує на подальший розвиток."
 GER_establish_greater_brittany_decision:0 "Заснувати Велику Бретань"
 GER_expand_social_welfare_desc:0 "Після Великої війни ми почали розвивати систему соціального забезпечення, але вона стала обмеженою після Великої депресії. Ми повинні вкладати ресурси в її відновлення і зробити її символом гордості кожного німця — доказом переваги комунізму."
 GER_expand_the_truppenschulen:0 "Розширити Truppenschulen"
 GER_expatriate_the_communists:0 "Вигнання комуністів"
 GER_extend_mitteleuropas_bounderies_tt:0 "Запрошує гарантовані східноєвропейські держави до §YМіттельєвропи§!"
 GER_fate_of_yugoslavia_desc:0 "Югославія завжди була штучним утворенням, і тепер позиції її уряду похитнулися. Ми мусимо втрутитися та навести лад. Залишилося лише вирішити, як це краще зробити."
 GER_first_ljubljana_award_tt:0 "Усі початкові [YUG.GetAdjective]і осердні землі знаходяться у власності держави §Y[YUG.GetName]§! або якогось із її суб'єктів.\n"
 GER_form_organization_todt:0 "Утворити Organisation Todt"
 GER_form_the_jagdwaffe_desc:0 "Нам слід утворити Jagdwaffe, спеціальні сили винищувальної авіації, щоби забезпечити перевагу в повітрі. Поєднуючи ретельну підготовку, передову тактику та найсучасніші технології, ми будемо панувати в небі та дозволимо нашим сухопутним військам прокотитися полем бою, стрясаючи землю як грім."
 GER_franco_germanic_pact:0 "Франко-німецький пакт"
 GER_german_kaiserreich_neutrality:0 "Німецький кайзеррайх"
 GER_greater_proletarian_german_state:0 "Велика німецька держава"
 GER_guns_before_butter:0 "Програма «Масло або Рушниці»"
 GER_heavy_armored_car_recon_company_tt:0 "\n§Y$armored_car_recon$§!:\n§YБроня§!: §G+5%§!\n§YЛіс§!:\n Зміна персування: §G+5%§!\n§YПустеля§!:\n  Зміна персування: §G+10%§!\n§YРівнини§!:\n Зміна персування: §G+10%§!\n"
