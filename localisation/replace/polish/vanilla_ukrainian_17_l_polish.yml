 RAJ_standardized_rations:0 "Стандартизовані пайки"
 RAJ_stir_unrest_in_the_north_cat:0 "Розпалювання заворушень на півночі"
 RAJ_stir_unrest_in_the_north_tt:0 "Ми збережемо контроль над цією державою, коли відокремимося від Британського Раджу після завершення §Y$RAJ_the_mughal_uprising$§!"
 RAJ_strat_bomber_equipment_1_short:0 "Halifax"
 RAJ_supply_center_fortifications:0 "Укріплення центрів постачання"
 RAJ_supply_center_fortifications_desc:0 "Захист наших центрів постачання є критично важливим для підтримки воєнних зусиль. Укріплюючи ці вузли, ми забезпечуємо безперебійний потік ресурсів та захищаємо основу наших військових операцій від ворожих вторгнень."
