 SOV_anti_capitalist_diplomacy_desc:0 "Найстрашнішими перешкодами на шляху глобальної революції, без сумніву, є товсті банкіри США та безжальні колоніальні гнобителі Великої Британії. Нашим першочерговим завданням завжди має бути дати їм по руках і підірвати їхню лібералістичну пропаганду."
