 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_CREATE_FACTION:0 "\nДержава §Y$COUNTRY$§! §Rвідмовилася§! вступати в наш новий альянс.\n\nНам доведеться шукати союзників деінде."
