 GRAND_DOCTRINE_GRAND_BATTLEPLAN_DESC:0 "За достатньої підготовки жодна перешкода не є нездоланною — Глобальне планування характеризується терплячою, ретельною підготовкою всіх родів військ, як в атаці, так і в обороні."
