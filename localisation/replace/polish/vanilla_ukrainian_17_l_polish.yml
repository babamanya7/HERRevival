 NSB_poland_communist_events.301.t:0 "[From.GetNameDefCap] відмовляється"
 NSB_poland_communist_events.4.t:0 "[From.GetNameDefCap] пропонує нам Схід"
 NSB_poland_communist_events.602.desc:0 "[From.GetNameDefCap] відмовляється поступатись Східній Польщі державі [Root.GetNameDef]. Такий результат цілком передбачуваний, але багато поляків тим не менш розчаровані ним, і все частіше чуються заклики відокремитися від держави [From.GetNameDef]."
 NSB_poland_royal_election.1.a:0 "Він наш король!"
 NSB_poland_royal_election.2.b:0 "Ми не можемо ризикувати своїми відносинами з Румунією."
 NSB_polish_fascist_events.203.a:0 "Чудово."
 NSB_polish_fascist_events.7.desc:0 "Тепер, коли санаціоністи все більше переймають політику та переконання націонал-демократичної партії, багато хто вважав, що нові національні вибори в республіці — лише питання часу. З підписанням третьої Національної Конституції Польщі вибори були відновлені, але з До числа «непатріотичних» партій входять ПКП, а також багато інших левофлангових і центристських партій, що майже не залишає виборцям варіантів крім націонал-демократів. з великим відривом від санаціоністів та інших конкурентів, що дало їх партії майже повний контроль над Республікою."
 NSB_soviet_atomic_bomb_project.1.a:0 "Чергова перемога миру."
 NSB_soviet_civil_war_common.002.f:0 "Санкт-Петербург був столицею імперії."
 NSB_soviet_civil_war_common.105.desc:0 "Незважаючи на те що [FROM.GetLeader] отримав від нас пропозицію, яка безумовно відповідає [FROM.GetAdjective] інтересам, делегація повернулася додому ні з чим."
 NSB_soviet_civil_war_common.111.t:0 "[FROM.GetNameDefCap] навчатиме українське ополчення"
 NSB_soviet_civil_war_common.113.b:0 "Приємно це знати."
 NSB_soviet_civil_war_common.123.a:0 "Ми цього не забудемо!"
 NSB_soviet_communist_civil_war.002.a:0 "Бухарін — ідеальний кандидат."
 NSB_soviet_fascist_tsarist.16.desc:0 "Припинивши свої внутрішні чвари, щоби заснувати новий, дружній нам уряд, [SOV.GetNameDef] пропонує нам реформувати наш старий союз для стримування [GER.GetAdjective] агресії в Європі."
 NSB_soviet_foreign_politics_events.153.a:0 "Ми маємо захопити Перський коридор!"
 NSB_soviet_foreign_politics_events.251.t:0 "[FROM.GetNameDefCap] готується до війни з державою [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.261.desc:0 "Після захоплення Курил і Південного Сахаліну, а також висадки на Хоккайдо [FROM.GetAdjective] командувач запропонував припинити вогонь і підготуватися до перемир'я. Ймовірно, що в ході перемир'я Курили і територією, а Хоккайдо перейде під [FROm.GetAdjective] управління."
 NSB_soviet_foreign_politics_events.279.a:0 "Мудре рішення."
 NSB_soviet_foreign_politics_events.280.b:0 "Досить. Більше вони нам не потрібні!"
 NSB_soviet_nationalist.004.desc:0 "Незважаючи на тиск і повне розуміння того, в якій важкій ситуації знаходиться [FROM.GetLeader.GetHerHis] країна, [FROM.GetLeader] відмовляється приймати нашу щедру пропозицію автономії у перебудованій Російській імперії."
 NSB_soviet_paranoia_system_events.13.a:0 "Такі немислимі злочини мусять бути суворо покарані."
 NSB_soviet_paranoia_system_events.21.b:0 "Очевидно, що розслідування велося із зайвим завзяттям."
 NSB_soviet_permanent_revolution.1.t:0 "Троцькістські революціонери агітують маси"
