 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "Наші конвої — це наша кров, і вони мусять бути захищені як Королівськими ВМС, так і Королівськими ВПС. Ми мусимо створити спеціальне формування КВПС для захисту підходів до наших портів!"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "Королівські ВМС"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL:0 "Королівський арсенал у Вулиджі не спроможний виробляти так потрібні боєприпаси та піхотну зброю"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST:0 "Революційні заводи боєприпасів"
 ENG_ally_the_canadian_imperialist_uprising_desc:0 "Ми не кинемо наших канадських лоялістів напризволяще. Вони отримають від нас військову допомогу, а після перемоги у війні — наш захист і заступництво."
 ENG_artillery_equipment_2:0 "QF 25-pounder"
 ENG_battleship_1_desc:0 "Лінкори типу «Revenge» були замовлені в 1913 році як дешеві версії швидкісних дредноутів типу «Queen Elizabeth». Незважаючи на схоже озброєння та броню, їхня значно нижча швидкість відсунула їх до другорядних завдань під час Другої світової війни. Із запланованих 8 кораблів цього класу було закінчено лише 5."
 ENG_blackshirt_march_in_cornwall_desc:0 "Тепер готується великий марш чорносорочників у Корнуоллі. Він, безсумнівно, приверне на нашу сторону місцеве населення."
 ENG_blackshirt_march_in_gloucestershire_desc:0 "Тепер готується великий марш чорносорочників у Глостерширі. Він, безперечно, приверне на наш бік місцеве населення."
 ENG_bring_the_dominions_back_into_the_fold_desc:0 "Дошка розставлена, фігури на своїх місцях. Настав час привести наш план у дію і «виправити» поняття незалежності, присутнє в головах лідерів домініонів."
 ENG_cv_CAS_equipment_3:0 "Hawker Sea Fury"
 ENG_dp_ship_secondaries:0 "5.25in DP Mk I"
 ENG_heavy_cruiser_1_desc:0 "Крейсери типу «Hawkins» були першими важкими крейсерами у світі. Вони базувалися на попередніх легких крейсерах класу «Town», зокрема підкласу «Birmingham», але були оснащені 7,5-дюймовими гарматами та товстішим броньовим поясом. Вони були розроблені для боротьби з великими рейдерами конвоїв Німеччини. Вони були добре озброєні, мали прийнятну швидкість і дальність польоту, а також хороший захист. Всього було введено в експлуатацію п'ять кораблів, але на початку Другої світової війни діяли лише чотири."
 ENG_imperial_federation_india_unified_democratic_ADJ:0 "Співдружн"
 ENG_imperialist_australia_fascism_ADJ:0 "Імперіалістична Австралія"
 ENG_impose_martial_law_on_australia:0 "Увести воєнний стан в Австралії"
 ENG_light_tank_aa_equipment_2:0 "Matilda (зенітна)"
 ENG_march_on_downing_street:0 "Марш на Даунинг-стріт"
 ENG_march_on_downing_street_desc:0 "Великий марш до будинку Nº 10 по Даунинг-стріт, безсумнівно, змусить уряд провести референдум про майбутнє нації. Він не ризикне опиратися волі народу."
 ENG_medium_tank_aa_equipment_3:0 "Comet Marksman"
 ENG_medium_tank_artillery_equipment_3:0 "Sexton"
 ENG_renew_support_for_imperialist_coup_in_new_zealand:0 "Посилити підтримку повстання в Новій Зеландії"
 ENG_restrained_march_flag:0 "Уже закликано до стриманості."
 ENG_self_government_for_africa_desc:0 "Країни Африки готові отримати широку автономію в рамках підготовки до повної незалежності. Це, ймовірно, призведе до припливу іммігрантів, які бажають отримати британське громадянство до того, як незалежність буде офіційно оформлена."
 ENG_sub_ship_nuclear_engine_1_short:0 "PWR1"
 ENG_support_imperialist_coup_in_canada_mission_1_desc:0 "Імперські лоялісти підбурюють до заколоту! Якщо їм це вдасться, вони повалять всю країну в безодню громадянської війни!"
 ENG_trade_unions_demand_increase_in_paid_leave_desc:0 "Щоб виконати вимоги профспілок, ми ухвалимо закон про збільшення оплачуваної відпустки."
 ENG_transport_plane_equipment_3_short:0 "HP.67"
 ENG_war_with_japan_desc:0 "Всі інші можливості вичерпані, а японці відмовляються відмовитися від своїх експансіоністських планів. Заради безпеки Британської імперії та народів Азії ми мусимо підкорити японців."
