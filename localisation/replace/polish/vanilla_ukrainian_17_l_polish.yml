 CZE_the_polish_division_desc:0 "Мало того, що Польща перекриє шлях радянським військам, коли нам буде потрібна їхня допомога, так поляки досі не можуть пробачити нам звільнення Заолшя і плекають плани помсти. Можливо, варто вжити превентивних заходів."
