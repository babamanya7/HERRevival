 advanced_infantry_weapons2_desc:0 "Індивідуальна та колективна стрілецька зброя, а також інші елементи оснащення піхотинця. Включає штурмові гвинтівки та протитанкові гранатомети. Зброя, яка раніше поставлялася в обмеженій кількості, тепер більш доступна."
 advanced_medium_battery_desc:0 "Завдяки автоматам заряджання та віддаленому управлінню наведенням сучасні крейсери демонструють небачені раніше точність і скорострільність.\n\nУстановка модуля §YЛегка середня батарея§! посилює §Yобстріл з легких знарядь§! Встановлення модуля §YСередня батарея§! посилює §Yобстріл з важких знарядь§!, що допомагає атакувати ворожі §Yосновні кораблі§!."
