 CONGO_establish_cometro:0 "Створити Кометро"
 CONGO_expand_metallurgical_industry_desc:0 "Бельгія давно відома своєю відмінною металургійною промисловістю, однак вона не завжди мала необхідну сировину для справжнього процвітання. Тепер, з імпортованими ресурсами з Конго, у них є засоби для процвітання."
 CONGO_french_congo_desc:0 "Французи вирізали частину басейну Конго і відділили наші землі. Зараз є вдалий момент, щоб виправити цю історичну несправедливість. Має бути лише одна країна!"
 CONGO_requisition_funds:0 "Запитати кошти"
 CONGO_whispers_of_independence_desc:0 "Ми чуємо їх вже деякий час. Поширені чутки незадоволених. Ледь помітний натяк на бунт у повітрі. Легке збудження заради іншого майбутнього. Нам слід прислухатися і подивитися, куди нас приведе ця підводна течія незадоволення."
