 DIVISION_TEMPLATE_HEADER_NEUTRAL:0 "$AMOUNT|H$ $TEMPLATE|H$ ($COUNTRY$)"
 DLC_DESCRIPTION_dlc031:0 "Додає окремі дерева національних фокусів для малих держав на березі Чорного й Егейського морів. Болгарія, Греція та Туреччина можуть створити унікальні історичні й альтернативні шляхи, протистоячи намаганням великих держав панувати над стратегічно важливими морськими шляхами на Босфорі й Дарданеллах."
 DLC_MISSING_ITEM:0 "$NAME|R$"
 DNZ_GER_fascism_subject_DEF:0 "Райхсгау Данциг"
 DOCTRINE_TRACK_NOT_ACTIVATED:0 "§RШлях не діє:§!"
 DOD_hungary.100.desc:0 "Угорська влада звернулася до нас із питанням про подальший статус Словаччини. Вони вважають, що Словаччина має повністю перейти під їхній контроль, оскільки раніше Словаччина була частиною імперської Угорщини.\n\nУгорська делегація утрималася від відвертих загроз, але, як повідомляє наша розвідка, у лавах угорської армії спостерігається підозріло бурхлива активність."
 DOD_hungary.111.c:0 "Комуністичний уряд, можливо, доб'ється кращого результату."
 DOD_hungary.115.t:0 "Румунія відкинула наші вимоги"
 DOD_hungary.116.desc_transylvania:0 "Вислухавши нашу делегацію, [SOV.GetLeader] пропонує нам свого роду компроміс. [SOV.GetNameDefCap] в принципі не проти того, щоб Бессарабія залишилася у нас, але «незалежна прикордонна комісія», до якої входять офіційні представники Радянського Союзу та Танну-Тува, вважає, що більша частина Трансільванії має відійти до Угорщини."
 DOD_hungary.12.desc:0 "Обережно балансуючи між республіканцями і монархістами в уряді країни, [CZE.GetLeader] погоджується на компромісний варіант. [HUN.GetLeader] стане королем Богемії і Моравії, але [CZE.GetAdjective] - будь-які його рішення мають бути схвалені парламентом."
 DOD_hungary.126.desc:0 "Як нам повідомили, [CZE.GetAdjective] уряд відмовився від запропонованих нами гарантій, заявивши, що не піде на такі «жахливі» поступки.\n\nТим часом, наш посол у державі [SOV.GetNameDef] повідомив про підвищену активність [SOV.GetAdjective] міністерства закордонних справ. У дипломатичних колах обговорюють чутки про можливий договір з Німеччиною."
 DOD_hungary.141.b:0 "Заявити офіційний дипломатичний протест."
 DOD_hungary.142.desc:0 "Нам вдалося заручитися [From.GetAdjective]ою підтримкою для часткового перегляду умов Тріанонського договору. Усі обмеження, накладені на наші війська, знято. Міжнародна група інспекторів з озброєнь покинула нашу країну, а міністерство оборони підготувало обмеженого розширення наших збройних сил."
 DOD_hungary.146.a:0 "Угорщина має отримати право на переозброєння."
 DOD_hungary.32.c:0 "Звернутися по допомогу до Великої Британії."
 DOD_hungary.32.desc:0 "Влада держави [From.GetNameDef] не захотіла робити поступки в питанні недоозброєння. Переговори були перервані майже відразу. [From.GetAdjective] делегати тягли час щосили, влаштовуючи багатогодинні дебати через дріб'язкові питання, як-от порядок розсадки. Очевидно, що вони не допустять нашого озброєння, але хочуть, щоби ми першими покинули зал переговорів."
 DOD_hungary.33.t:0 "Угорщина звертається за підтримкою"
 DOD_hungary.61.desc:0 "Сьогодні вранці наше міністерство закордонних справ відвідав [From.GetAdjective] посол. Він зазначив, що його уряд із тривогою спостерігає за ескалацією кризи. Наша загроза оголосити війну через Трансільванію змусила [From.GetAdjective]у владу замислитися про військове втручання на боці Угорщини."
 DOD_hungary.66.b:0 "Ми готові підтримати їх."
 DOD_hungary.71.desc:0 "Після всіх протокольних формальностей делегати, яких направили Угорщина, Румунія та [ROM_mediator.GetNameDef], сіли за стіл переговорів для обговорення проблеми. Було вирішено, що оскільки ми представляємо інтереси Угорщини, ми озвучимо свою пропозицію першими."
 DOD_hungary.73.desc:0 "Оскільки ми відхилили пропозицію Угорщини, ми тепер маємо висунути альтернативні умови."
 DOD_hungary.93.desc:0 "На зустрічі в Цюриху представники [HUN.GetAdjective]ої влади запитали нас, як ми ставимося до спільних дій, метою яких стане [YUG.GetNameDef]. [YUG.GetAdjectiveCap]а влада не реагує на [HUN.GetAdjective]і вимоги повернути території, анексовані державою [YUG.GetNameDef] після закінчення Великої війни, оскільки ми також претендуємо на територію, яку зараз окупує [YUG.GetNameDef], наші країни зможуть об'єднатися та висунути спільний ультиматум, але це може обернутися для нас війною."
 DOD_romania.1.desc:0 "За останні роки старий альянс із Румунією втратив своє значення. Загроза з боку Німеччини та Угорщини вже не видається такою явною. Але після недавніх подій [ROM.GetLeader] прибув до Варшави, щоб обговорити відновлення альянсу між Румунією і Польщею, зараз він носить лише оборонний характер — обидві сторони зобов'язуються підтримувати один одного у разі війни."
 DOD_romania.120.t:0 "Запрошення іноземних автовиробників"
 DOD_romania.3.a:0 "Дуже шкода."
 DOD_romania.32.desc:0 "Переговори про розміщення [SOV.GetAdjective] військ у Румунії тривали лише кілька годин. [SOV.GetAdjective] влада заявила, що гарантія цілісності наших кордонів не співпадає з їхніми інтересами.\n\nБагато наших генералів стривожені цією відмовою. На їхню думку, радянцям не подобаються наші нинішні кордони, і вони хотіли б їх змінити.."
 DOD_romania.50.a:0 "У нас немає вибору."
 DOD_romania.62.b:0 "Потрібно звернутися за допомогою."
 DOD_romania.63.t:0 "[From.GetLeader] бажає розділити Югославію"
 DOD_romania.65.t:0 "[From.GetNameDefCap] погоджується"
 DOD_yugoslavia.32.b:0 "У нас інші плани."
