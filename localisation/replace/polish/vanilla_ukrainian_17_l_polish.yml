 DIPLOMACY_GENERATE_WARGOAL_TITLE:0 "Виправдати ціль війни"
 DIPLOMACY_JOIN_FACTION_ACTION_DETAILED_DESC:0 "Підготовка переворотів між вашими державами буде автоматично скасована, якщо ви вступите до альянсу супротивника"
