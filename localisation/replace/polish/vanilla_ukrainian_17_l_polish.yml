 SOV_concessions_japan_sakhalin_SCW:0 "Сахалін в обмін на зброю"
 SOV_concessions_uk_belarus_SCW_desc:0 "[ENG.GetAdjectiveCap]ий уряд із розумінням ставиться до закликів [BLR.GetAdjective]ого уряду у вигнанні до незалежності. Якщо ми пообіцяємо їм звільнити державу [BLR.GetNameDef] після війни, вони напевно захочуть надати нам зброю."
 SOV_covert_operations:0 "Таємні операції"
 SOV_defense_of_moscow:0 "Оборона Москви"
 SOV_destroyer_3_desc:0 "The Soobrazitelnyi (Project 7U) destroyers were an improved version of the previous Gnevny class. Their engines were redesigned and they had a stronger AA armament. They displaced between 1,900 and 2,400 tons, and their speed and range were similar to the Gnevny class."
 SOV_development_of_tankograd_desc:0 "Наша країна простягається на величезні відстані, що робить недоцільним транспортування комплектуючих від заводу до заводу. Натомість ми мусимо інтегрувати наші танкові заводи вертикально — сталь заходить з одного кінця, а готові танки виходять з іншого."
 SOV_dismantle_the_zemsky_sobor_desc:0 "Земський собор відслужив своє. Занадто багато демократії може бути небезпечною річчю, як показав 1917 рік. Ми не повинні повторювати помилок минулого."
 SOV_dp_ship_secondaries:0 "130mm/50 B13 B-2-U"
 SOV_eastern_expansion:0 "Східна експансія"
 SOV_eradicate_western_fascism_desc:0 "Ми не можемо чекати, поки фашистські режими в Західній Європі зволять напасти на нас у зручний для них момент. Найкращий спосіб мати справу з фашистами — вдарити першими, і вдарити сильно."
 SOV_expand_aviation_institutes_ns_tt:0 "$SOV_modify_airforce_ns_intro$\n$MODIFIER_AIR_WING_XP_LOSS_WHEN_KILLED_FACTOR$: §G-15%§!\n$MODIFIER_AIR_TRAINING_XP_FACTOR$: §G+5%§!\n$MODIFIER_AIR_ACCIDENTS$: §G-25.0%§!\n$MODIFIER_AIR_WEATHER_PENALTY$: §G-10.00%§!\n\n"
 SOV_focus_select_effect_tt:0 "Миттєвий ефект на початку фокусу:"
 SOV_for_the_common_good_desc:0 "Керівним принципом будь-яких рішень, прийнятих нашими союзниками, має бути прагнення зробити якомога більше добра, коли це можливо. Навіть якщо на перших порах жертви не принесуть негайного покращення, необхідно чітко усвідомлювати, що в довгостроковій перспективі це принесе найбільше користі."
 SOV_found_the_comecon_program_tt:0 "\n§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! та §Yкожний [ROOT.GetAdjective]ий суб'єкт§! приєднаються до: §Y[GetComeconName]§!\n\n"
 SOV_found_the_pcdi:0 "[GetFoundThePcdiName]"
 SOV_fourth_five_year_plan_desc:0 "Мине ще деякий час, перш ніж наслідки війни будуть повністю виправлені, але, поставивши правильні цілі, ми вже можемо отримати певний приріст продуктивності."
 SOV_gosproyektstroy_focus_civ_desc:0 "Під час масштабної промислової модернізації ми надаватимемо пріоритет модернізації цивільної важкої та легкої промисловості."
