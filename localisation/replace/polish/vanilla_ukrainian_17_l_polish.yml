 WW_hungary.29.t:0 "[FROM.GetNameDefCap] хоче відновити правління Габсбургів"
 WW_hungary.33.a:0 "Вони зробили правильний вибір"
 WW_hungary.38.t:0 "[FROM.GetNameDefCap] запрошує нас до Центральних держав"
 WW_hungary.42.desc:0 "Великий [FROM.GetLeader] з [FROM.GetNameDef] погодився створити новий військовий альянс. Наш народ святкує — починається нова епоха!"
 WW_hungary.47.b:0 "Смерть монархам!"
 WW_hungary.56.desc:0 "Після нічних переговорів, [CZE.GetAdjective]ий уряд вирішив прийняти нашу пропозицію й проголосив Альбрехта Франца королем Богемії, маркграфом Моравії та герцогом Тешенським. Солдати колишньої чеської армії присягнули новому королю та імператору, адміністрація формально інтегрована."
 WW_hungary.57.desc:0 "[CZE.GetNameDefCap] відмовився від будь-якого обговорення нашої майбутньої співпраці. Нашого посла навіть не вислухали. Чехи заявили, що хочуть мирних відносин, але ніякої інтеграції з Австро-Угорщиною не буде."
 WW_hungary.60.b:0 "Ми повинні відступити"
 WW_hungary.65.desc:0 "[FROM.GetNameDefCap] призначив Йосифа Франца фон Габсбурга новим королем нашої нації. Це безперечно зміцнить наш режим."
 WW_hungary.89.t:0 "[FROM.GetNameDefCap] відмовляє нам"
