 germany.11.a:0 "Підписати договір."
 germany.113.d:0 "Держава [GER.GetNameDef], для якої підтримка армії необхідна для будь-якого успіху в нашій громадянській війні, опублікувала плани по встановленню [GER.GetAdjective]ого контролю над Данцигом після завершення бойових дій. Вони також ясно дали зрозуміти, що залежність держави [Root.GetNameDef] від підтримки їхньої армії ставить [Root.GetLeader] у ситуацію з єдиним варіантом — підписання цієї «Данцигської угоди»."
 germany.114.a:0 "Вони отримають Данциг, як ми й домовлялись."
 germany.118.a:0 "Нам потрібна ця конференція для визначення майбутнього Європи."
 germany.118.d:0 "Війна в Європі просувається дуже швидко, і саме час майбутнім переможцям обдумати майбутнє Європи.\n\nМи можемо запропонувати державі [yalta_partner.GetNameDef] провести конференцію по розподілу держави [GER.GetNameDef] після війни, щоб окреслити наші сфери апливу на континенті.\n\nНаш «друг», [yalta_partner.GetNameDef], вказав, що його цікавить така конференція. Безсумнівно, він захоче якусь нагороду за всі свої жертви."
 germany.125.d:0 "Наші [FROM.GetAdjective] володарі вирішили передати Судети державі [GER.GetNameDef]. Вони заявляють, що цей крок зроблено задля збереження миру в регіоні, і що будь-яке інше рішення призвело б до значно гірших наслідків для нас. Нас не було залучено до цього обговорення, і тепер ми можемо лише спостерігати, як нашу законну територію відривають від нас."
 germany.13.a:0 "Хай їм грець!"
 germany.28.d:0 "У країні розпочалися неспокій серед громадян та акти насильства, коли протестуючі оголосили своє бажання об'єднати Австрію з Німеччиною в союз німецьких держав. Берлін наполягає на аншлюсі, що призведе до приєднання Австрії в склад їхньої країни."
 germany.6.a:0 "Приєднатися"
 germany.83.d:0 "Підписавши Антикомінтернівський пакт, держава [From.GetNameDef] забезпечила родюче підґрунтя для вжиття заходів щодо стримування радянської загрози. Однак, пакт не включає створення військового альянсу та не має чітко визначених зобов'язань від держав, що підписали пакт. Тепер [From.GetLeader] шукає можливості розширити пакт до антирадянської коаліції — об'єднуючої угоди про спільне приєднання до війни з Радянським Союзом, якщо якась із держав, що підписала пакт, опиниться у стані війни з ним.\n\nХоч це істотно небезпечніше, і швидше за все призведе до завершення всіх дипломатичних відносин з СРСР, це також наш шанс забезпечити сильних союзників у випадку війни."
 germany.97.a:0 "Ми розіб'ємо їх обох."
