 RAJ_empower_provincial_authorities_chances_tt:0 "§Y$RAJ_investments_from_local_leaders$§! розподілить фокус порівну між §Yцивільною промисловістю§!, §YВійськовою промисловістю§! та §YОборонною інфраструктурою§!."
 RAJ_every_man_a_gun:0 "Кожному чоловіку — рушницю"
 RAJ_expand_industry_in_hyderabad_desc:0 "Розширення фабрик у Хайдарабаді значно покращить наш промисловий потенціал без великих інвестицій."
 RAJ_five_year_plan_desc:0 "Будь-яка комуністична держава потребує п'ятирічного плану! Ми повинні почати розробляти наш, щоб промисловість [RAJ.GetNameDefCap] могла процвітати!"
 RAJ_focus_on_the_countryside_desc:0 "Наша сила полягає в мільйонах, які називають ґрунт своїм домом.\nДавайте інвестувати в них, озброювати їх та організовувати їх — революція належить селам."
 RAJ_fortify_el_alamein_desc:0 "Ель-Аламейн є стратегічно важливим місцем, коли справа доходить до утримання та забезпечення безпеки Єгипту. Корона високо оцінить наші зусилля з укріплення цього регіону та запобігання тому, щоб наші вороги закріпилися в [ENG.GetAdjective] Північній Африці."
 RAJ_founding_of_the_peoples_republic:0 "Заснування народної республіки"
 RAJ_great_depression_price_controls_desc:0 "Велика депресія сильно вдарила по субконтиненту. Прив'язавши рупію до стерлінга та запровадивши різноманітний контроль над цінами, ми сподіваємося стабілізувати ситуацію."
 RAJ_ignite_the_sino_indian_war:0 "Розпалити Китайсько-індійську війну"
 RAJ_imperial_industry_initiative:0 "Імперська промислова ініціатива"
 RAJ_increase_funding_for_the_GRSE:0 "Збільшити фінансування GRSE"
 RAJ_indian_armor_desc:0 "Індія повинна приділити увагу розробці своєї бронетехніки та створити танкову дивізію."
 RAJ_indian_cruiser_development:0 "[ROOT.GetAdjective] розробка крейсерів"
