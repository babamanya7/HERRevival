 south_american_news.20.a:0 "Приречена ідея."
 soviet.10.d:0 "Наш запит на військові бази в державі [FROM.GetNameDef] було задоволено, але, на жаль, їхній уряд розпався. Ми створили Народний парламент, щоб уникнути анархії, і той одноголосно проголосував за те, щоби звернутися до Верховної Ради з проханням про членство в нашому союзі. Це прохання було задоволено."
 soviet.14.t:0 "Членство в СРСР"
 soviet.18.t:0 "Сіанський інцидент"
 soviet.25.b:0 "Хрущов випробовував троцькізм у минулому. Він мусить піти."
 soviet.29.a:0 "Чудовий здобуток."
 soviet.33.a:0 "$soviet.30.a$"
 soviet.33.d:0 "Латвія не зможе опиратися силі Червоної армії. Якщо ми надішлемо їм вимогу прав на стоянку та контролю над прикордонними військами, ми зможемо по суті анексувати їх без війни."
 soviet.37.d:0 "Наші нові офіцери добре вправляються з завданням і адаптуються до своїх нових ролей у вищому військовому командуванні. З лояльним офіцерським корпусом на чолі нашої армії чистка лідера [Root.GetLeader], схоже, має певний ефект, на який ми сподівалися. Червона армія відновлює свою міць і незабаром стане сильнішою, ніж будь-коли."
 soviet.4.a:0 "Чудово."
