 ROM_danubian_transport_network_desc:0 "Наші транспортні можливості вздовж Дунаю можна суттєво поліпшити, як за рахунок більш ефективного використання самої річки, так і за рахунок її зв'язку з нашими автомобільними та залізничними мережами."
