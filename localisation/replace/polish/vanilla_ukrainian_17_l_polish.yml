 NZL_medium_tank_equipment_2:0 "Cromwell Local Pattern"
 NZL_project_seal_desc:0 "Проєкт «Seal» — наша спільна програма з США зі створення зброї, що викликає цунамі. У нього складний принцип дії, але розроблена нами бомба, що відскакує, подає великі надії."
 NZL_strengthen_the_commonwealth:0 "Зміцнити Співдружність"
 NZL_submarine_effort_desc:0 "Оскільки противник вторгнеться до нас із моря, океанські вовки дадуть йому гідну відсіч. Діючи потай невеликими групами, підводні човни охоронятимуть наші морські шляхи."
 NZL_tac_bomber_equipment_3:0 "de Havilland Mosquito B"
 NZL_women_in_the_workforce_desc:0 "У міру того як нестача робочої сили посилюється, жінки виходять уперед, щоб заповнити життєво важливі ролі на фабриках, фермах і в державних службах, гарантуючи, що виробництво не занепаде під тягарем воєнного часу. Розширення можливостей навчання і працевлаштування дозволить нам підтримувати обсяги промислового виробництва при збереженні національної оборони."
