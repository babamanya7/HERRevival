 IRQ_training_desc:0 "The training of troops in [IRQ.GetNonIdeologyName] is antiquated and could be improved with the introduction of reforms that mirror those of other nations. As such we should educate our soldiers in light weapons and infantry tactics at the Al-Wash Light Weapons School."
 IRQ_united_arab_republic_democratic:0 "Об'єднані Арабські Держави"
 IRQ_united_arab_republic_neutrality_ADJ:0 "Арабськ"
 IS_IN_PHASE:0 "У фазі: $PHASE|H$"
 ITA_VICTORY_POINTS_6780:0 "Торіно"
 ITA_auxiliaries:0 "Допоміжні війська"
 ITA_battleship_4:0 "Клас «Impero»"
 ITA_befriend_japan_desc:0 "$ITA_japan_friend_desc$"
 ITA_bomber_effort_desc:0 "Минула та епоха, коли армії могли вигравати війни, не дивлячись у небо. Ми мусимо розвивати наші тактичні бомбардувальники, щоби забезпечити наших солдатів необхідною повітряною підтримкою."
 ITA_boost_the_grand_council_of_fascism:0 "Посилити Велику фашистську раду"
 ITA_breda_organization:0 "$breda$"
 ITA_carrier_4:0 "Клас «Sparviero»"
 ITA_comandante_diavolo_desc:0 "Під час завоювання Ерітреї та війни в Ефіопії ми часто стикалися зі швидкістю та завзятістю місцевих вершників. Боротьба з ними принесла б нам чимало користі, якби ми змогли залучити їх на свій бік, а який-небудь заповзятливий молодий офіцер міг би стати нашим власним «командиром-дияволом»."
 ITA_cooperation_programs:0 "Програми співпраці"
 ITA_defend_the_land_faction_tt:0 "Станеться подія §Y[ROOT.GetName] запрошує нас в $ITA_united_socialist_front$§!."
 ITA_defy_the_duce_desc:0 "Настав час повстати проти фашистського режиму та викорінити лихо, яке він представляє для італійського народу.\nРобітники та селяни Італії, до зброї!"
 ITA_deus_vult_desc:0 "Католицька Церква була маяком надії та стабільності в Європі протягом століть, і оскільки ми стикаємося з темними часами попереду, ми мусимо знову стати цим маяком світла.\nТак бажає Бог!"
 ITA_establish_the_regno_albania:0 "Установити Албанське королівство"
 ITA_fiat_organization:0 "$fiat$"
 ITA_fighter_equipment_3:0 "Fiat G.55 Centauro"
 ITA_foreign_affairs_desc:0 "Кожна велика держава мусить ставити перед собою чіткі зовнішньополітичні цілі, а також мати талановитих людей, навчених вести дипломатію таким чином, щоби досягти цих цілей."
 ITA_forza_navale_especiale_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$\n$MODIFIER_NAVAL_INVASION_PREPARATION$: §G-10.0%§!\n$MODIFIER_NAVAL_INVASION_DIVISION_CAP$: §G+2§!\n$MODIFIER_AMPHIBIOUS_INVASION$: §G+5.0%§!\n$MODIFIER_SPECIAL_FORCES_CAP$: §G+2.0%§!\n\n"
 ITA_german_rd_treaty_desc:0 "Ми мусимо попросити німців обмінятися технологічними секретами на благо обох наших великих народів."
 ITA_heavy_fighter_equipment_2_short:0 "Ro.58"
 ITA_infantry_equipment_1_short:0 "Carcano M38"
 ITA_italian_hegemony:0 "Італійська гегемонія"
 ITA_italian_hegemony_desc:0 "У світі, охопленому війною, ми мусимо надихнути та об'єднати всі різні нації та культури під нашою гегемонією, щоби показати їм, яку користь приносять фашизм та [ROOT.GetNameDef]. Ми мусимо очолити шлях до світлого майбутнього!"
 ITA_italian_irredentism:0 "Італійський іредентизм"
 ITA_italian_savoy_name:0 "Савоя"
 ITA_king_high_control_range:0 "Переважаючий Савойський дім"
 ITA_mare_nostrum_bba_desc:0 "Саме завдяки морській силі Стародавній Рим уперше переміг Карфаген. Інвестуючи в морську міць, Італія зможе претендувати на контроль над Середземним морем і знову зробити його Mare Nostrum — «нашим морем»."
 ITA_missiolini_stockpile_fuel:0 "Збільшити запаси пального"
 ITA_missiolini_stockpile_fuel_desc:0 "Сучасна армія марширує не лише на своєму шлунку, але й на своєму пальному, і якщо його немає, то вся військова машина зупиняється. Пальне потрібне всім родам військ, і ми повинні мати можливість забезпечити його у великих кількостях, якщо хочемо досягти успіху на полях битв."
 ITA_mussolini_resigned_minister_of_foreign_affairs_position_flag:0 "Минуло §Y365 днів§! відтоді, як §Y[ROOT.ITA_benito_mussolini.GetName]§! залишив посаду в Міністерстві закордонних справ\n(наразі минуло [?ITA_mussolini_resigned_minister_of_foreign_affairs_position_flag:days|Y0])"
 ITA_naval_air_coordination_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$\n$MODIFIER_NAVAL_STRIKE_AGILITY$: §G+5%§!\n$MODIFIER_NAVAL_COORDINATION$: §G+5%§!\n$MODIFIER_SPOTTING_CHANCE_FACTOR$: §G+10%§!\n\n"
 ITA_negotiate_italian_claims_desc:0 "Наша опозиція до Німеччини поставила нас у позицію влади над колишніми країнами Антанти, які відчайдушно шукають розриву між італійським та німецьким режимами. Ми мусимо використати цю ситуацію на свою користь і повернути собі колоніальні володіння, які втратили після Великої війни."
 ITA_pope_low_control_range:0 "Низький вплив Папи"
 ITA_prospect_for_oil_desc:0 "Наші геологи вважають, що під лівійською пустелею можуть бути значні запаси нафти. Ми мусимо провести ретельну розвідку, щоби перевірити, чи мають вони рацію."
 ITA_redirect_alfa_romeo_production:0 "Переспрямувати виробництво «Alfa Romeo»"
 ITA_romania_friend:0 "Подружитися з Румунією"
 ITA_rsi_overlord_tt:0 "Ми станемо суб'єктом держави §Y[?ITA_rsi_overlord.GetFlag][?ITA_rsi_overlord.GetNameDef]§!."
 ITA_sea_wolves:0 "Морські вовки"
 ITA_standardization_ra_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §R+25%§!\n$ITA_standardization_dynamic_modifier_tt$\n"
 ITA_strengthen_northern_industry:0 "Зміцнити північну промисловість"
 ITA_super_heavy_railway_gun_equipment_1:0 "Cannone da 381/40 AVS"
 ITA_suppress_mafia_in_state:0 "Придушити мафію в області [FROM.GetName]"
 ITA_tac_bomber_equipment_0:0 "Caproni Ca.101"
 ITA_the_new_emperor_of_ethiopia_has_idea_vittorio_emanuele_tt:0 "Є національний дух §Y$vittorio_emanuele$§!"
 ITA_united_anarchist_confederations_tt:0 "\nЯкщо [SPC.GetNameDef] існує, ефекти буде збільшено й ми зв'яжемося з ними з пропозицією надати взаємні гарантії."
 ITA_via_della_vittoria:0 "Via della Vittoria"
 ITA_victoryinETH:0 "Тріумф у Африці"
 ITA_withdraw_from_ethiopia_desc:0 "Війна проти Ефіопії була помилкою; настав час вирішити цю суперечливу справу."
 JAM_ADJ:0 "Ямайськ"
 JAP_GEACPS_economic_integration_decision:0 "Вимагати інтеграції §Y[FROM.GetAdjective]ої§! економіки"
 JAP_VICTORY_POINTS_12068:0 "Такао"
 JAP_a_free_asia_pacific_desc:0 "Нарешті настав день, коли люди по всій Азії зможуть жити вільно, без експлуатації іноземцями та урядами, які мало дбають про їхній добробут. Хай живе [ROOT.GetNameDef], і хай живуть робітники Азії!"
 JAP_a_pan_asian_diet_desc:0 "Щоб зблизити революційні держави Азії, ми повинні створити урядовий орган, до якого входитимуть представники всіх держав-членів, де вони голосуватимуть за те, які закони та інституції впроваджувати в наших братніх республіках."
 JAP_adopt_new_air_doctrine:0 "Прийняти нову повітряну доктрину"
 JAP_agricultural_protectionism_desc:0 "Світова економіка стає все більш ворожою до наших традиційних способів виробництва. Якщо ми не вживемо заходів для захисту наших фермерів, ми скоро зіткнемося з кризою небачених масштабів, оскільки наші аграрії не зможуть залишатися конкурентоспроможними перед лицем масового імпорту харчових продуктів з-за кордону."
 JAP_armored_divisions:0 "Бронетанкові дивізії"
 JAP_battleship_4:0 "Клас «Iwami»"
 JAP_bomber_modernization_desc:0 "Для ефективної підтримки наших військ на полі бою потрібні модернізовані тактичні бомбардувальники."
 JAP_can_no_longer_manually_promote_zaibatsus_tt:0 "Ми більше не зможемо §Rвручну підтримувати§! §Yфракцію Дзайбацу§!"
 JAP_carrier_4_desc:0 "Авіаносець класу «Taiho» був першим повністю броньованим авіаносцем Імперського флоту, з броньованою польотною палубою, що витримувала численні бомбові та торпедні влучання і продовжувала ефективно функціонувати. Велика авіаційна група разом з важким зенітно-ракетним озброєнням могла би забезпечити не лише самооборону, але й проєкцію сили на ворожі сили."
 JAP_cv_fighter_equipment_0_short:0 "A4N"
 JAP_develop_aluminum_sources:0 "Розробка родовищ алюмінію"
 JAP_develop_the_yen_bloc:0 "Розвиток єнового блоку"
 JAP_fighter_modernization_desc:0 "Ми мусимо зберігати перевагу над ворогами скрізь — навіть у повітрі. Для цього нам потрібні найсучасніші винищувачі."
 JAP_fund_propaganda_films_desc:0 "Наш флот запропонував збільшити інвестиції в кіноіндустрію, щоб мотивувати людей продовжувати боротьбу. У зв'язку з цим вони уклали контракт з Лабораторією рухомих зображень на створення анімаційного пропагандистського фільму, який посилює наратив Імператорського флоту (IJN), водночас дискредитуючи Імператорську армію (IJA)."
 JAP_greater_emperor_dominant_fascism_ADJ:0 "Імперсько-японськ"
 JAP_guardian_of_indochina:0 "Перейняти панування над Індокитаєм"
 JAP_if_man_accepts:0 "Якщо §HМаньчжоу-го§! погодиться, станеться ось що:\n"
 JAP_imperial_headquarters_liasion_conference:0 "Координаційна нарада Імператорської Ставки"
 JAP_implementing_unos_economic_reforms_mission:0 "Впровадження економічних реформ Кодзо Уно"
 JAP_indoctrination_in_the_military_academy_desc:0 "Важливо, щоб радикальні елементи в армії не виступили проти уряду, як це колись зробили ми. Ми повинні забезпечити високу дисципліну і те, що кожна людина присягає на вірність Імператору, а не будь-якій групі чи фракції!"
 JAP_interfered_in_imperial_influence_flag:0 " $JAP_imperial_influence_ruler_name_text$ нещодавно втрутився у справи фракції «$JAP_imperial_influence_faction_names_text$»"
 JAP_japans_longest_day:0 "Найдовший день Японії"
 JAP_kikues_new_model_desc:0 "Ямакава Кікуе давно просуває ідею піднесення японських жінок до рівноправної частини нашого суспільства і бажає гарантувати рівну оплату праці та права на працевлаштування, одночасно скасовуючи патріархальну сімейну систему. Настав час перетворити ці ідеали на реальність!"
 JAP_liaison_conference_desc:0 "Зібравши конференцію з представників усіх гілок уряду та збройних сил, ми можемо значно підвищити швидкість прийняття рішень."
 JAP_liberate_manchuria_tt:0 "Рішення можна прийняти після завоювання Маньчжурії.\n"
 JAP_light_industry_development:0 "Розвиток легкої промисловості"
 JAP_luxury_is_the_enemy_decision:0 "Розкіш — це ворог!"
 JAP_machida_chuuji_focus_desc:0 "Мачіда Чюджі, нинішній лідер керівної партії Ріккен Мінсейто, має сформувати новий кабінет, який наполягатиме на прийнятті нашої нової конституції. Завдяки цьому ми більше не матимемо тимчасового прем'єр-міністра, і порядок, що існував до початку міжусобиць, буде нарешті відновлено."
 JAP_mio_trait_enhanced_optics:0 "Покращена оптика"
 JAP_mitsubishi_heavy_industries_organization:0 "$mitsubishi_heavy_industries$"
 JAP_nationalize_the_zaibatsus:0 "Націоналізація дзайбацу"
 JAP_nationalize_war_industry_desc:0 "Посилення держконтролю над оборонною промисловістю значно підвищить ефективність роботи — і, як наслідок, її результати."
 JAP_nippon_sharyo_organization:0 "Nippon Sharyō Seizō Kaisha"
 JAP_okadas_military_purge_speech_desc:0 "Цього разу військові зайшли занадто далеко. Якщо незліченних вбивств і спроб усунення нашого уряду маргінальними елементами було недостатньо, тепер вони також прагнуть використати недавній інцидент, щоб зміцнити власну владу і вирвати контроль над нашою нацією з рук її народу. Настав час Окаді чітко дати зрозуміти, хто керує державою, і вжити заходів проти зростання влади військових."
 JAP_pacific_union_democratic_DEF:0 "Велика Східноазійська федерація"
 JAP_research_spending:0 "Науково-дослідний бюджет"
 JAP_resource_security:0 "Ресурсна безпека"
 JAP_sea_exploit_southern_resource_area:0 "Експлуатація Південної ресурсної зони"
 JAP_sea_greater_east_asian_co_properity_sphere_tt:0 "Звільнення та створення маріонеток з §Yазійських§! держав та країн §YОкеанії§! стає дешевшим на §G25%§!."
 JAP_sea_unify_the_air_forces_desc:0 "Занадто довго ми страждали від розділених досліджень і розробок авіації між армією і флотом. Ми повинні об'єднати ці програми, щоб забезпечити як уніфікацію озброєння, так і краще використання наших обмежених дослідницьких ресурсів."
 JAP_send_home_boeitai_tt:0 "Розпустити все ополчення на цей час. Його можна буде знову підняти в майбутньому."
 JAP_ship_anti_air_1:0 "13mm/76 Type 93"
 JAP_ship_depth_charge_3:0 "15cm rocket-prop'ld DC"
 JAP_subdue_the_kwantung_army_2_tt:0 "Кілька генералів §YКвантунської армії§! понижені в званні та відправлені у відставку з дійсної служби:"
 JAP_subject:0 "$OVERLORDADJ$а $JAP$"
 JAP_sue_for_peace_with_soviet_TT:0 "Жоден із заявлених §Yсибірських§! регіонів не контролюється §Y[SOV.GetNameDef]§! або будь-яким із їхніх суб'єктів."
 JAP_support_resistance_decision:0 "Підтримати опір проти §Y[FROM.OWNER.GetAdjective]ої§! влади в [FROM.GetName]"
 JAP_tauran_border_incident_forgotten_1:0 "Війська втрачають бойовий дух"
 JAP_technological_exchange_desc:0 "Нам потрібні союзники у протистоянні із ведмедем. Німеччина не просто підходящий кандидат, а має також значні технічні ноу-гау, які допомогли б нам у війні."
 JAP_the_eternal_kingdom:0 "Вічна Імперія"
 JAP_the_long_march_to_victory:0 "Великий похід до перемоги"
 JAP_the_pan_asian_revolutionary_front_desc:0 "Щоб керувати різними азійськими революційними партіями, ми повинні організувати альянс і наднаціональну організацію, яка даватиме директиви менш розвиненим державам і координуватиме інвестиції для швидшого вдосконалення їхніх суспільств."
 JAP_the_red_sun_over_asia_decisions:0 "Червоне сонце над Азією"
 JAP_transformation_of_nature_desc:0 "Азія багата на природні ресурси, які просто чекають, щоб їх використали. Завдяки нашій науковій спільноті, яка розширює межі того, що раніше вважалося можливим, навіть найбільші, найбільш втручальні проєкти стають здійсненними. Навколишнє середовище має бути сформоване та змінене в величезних масштабах, щоб працювати на користь Народу!"
 JAP_transport_plane_equipment_3_short:0 "Ki-74"
 JOR_fascism_DEF:0 "Йорданська імперія"
 JUNO_GER_immigration_completed:0 "Уже підтримано імміграцію з держави [GER.GetFlag]§Y[GER.GetName]§!"
 JUNO_brazil_events.120.desc:0 "[FROM.GetNameDefCap] запропонувала партнерство для навчання на науковому досвіді одне одного. Хоча наші вчені загалом виступають за розширення доступу до знань, військові обережні щодо надання інформації, яка може зрештою зашкодити нашій національній безпеці."
 JUNO_brazil_events.121.t:0 "[FROM.GetNameDefCap] підтримує обмін технологіями"
 JUNO_brazil_events.134.desc:0 "Ми отримали запит на ліцензійне виробництво від наших товаришів у [BRA.GetNameDef]. Вони бажають укласти довгострокову угоду про ліцензування виробництва від нас, але взамін просять про знижку. Ми заробимо менше, ніж зазвичай, за кожну ліцензовану конструкцію, але отримаємо певну довіру та прихильність [BRA.GetAdjective] керівництва."
 JUNO_brazil_events.17.a:0 "Тепер ми повинні діяти обережно."
 JUNO_brazil_events.48.t:0 "[FROM.GetNameDefCap] відступає"
 JUNO_brazil_events.52.desc:0 "Незважаючи на тривалі переговори та консультації, уряд [FROM.GetNameDef] відхилив членство в Mercosul. Незважаючи на обіцянки миру та процвітання, вони, здавалося, не були переконані у життєздатності організації, стверджуючи, що це спосіб для нас контролювати їх через чорний хід."
 JUNO_brazil_events.80.b:0 "Ми не будемо зв'язувати себе цим."
 JUNO_brazil_events.83.t:0 "[FROM.GetNameDefCap] запрошує нас приєднатися до Організації американських держав"
 JUNO_brazil_events.85.t:0 "[FROM.GetNameDefCap] приймає наше запрошення"
 JUNO_brazil_news.2.d:0 "Після послаблення підтримки та недавнього сплеску популярності руху за відновлення імперії, [BRA.GetAdjective] Національний Конгрес погодився на компроміс із народом. Буде коронований конституційний монарх, але Національний Конгрес все ще збереже свою політичну владу над країною. Номінальні обов'язки будуть передані новокоронованому королю у спробі стабілізувати ситуацію."
 JUNO_guay_events.7.a:0 "На крок ближче до домінування."
