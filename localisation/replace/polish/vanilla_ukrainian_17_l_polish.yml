 OPERATIVE_MISSION_CONTROL_TRADE_PROGRESS:0 "Досі ми поліпшили наші торгові відносини на $CURRENT|H$/$MAX|H$. Ми наразі маємо всього $EFFECTIVE|=H$ од. торгових відносин."
 OPERATIVE_MISSION_CONTROL_TRADE_VALID_TARGET:0 "Призначити агента $CODENAME$ на £operative_mission_icons_small|6£ контроль над торгівлею в державі $COUNTRY|H$"
 OPERATIVE_MISSION_QUIET_INTEL_NETWORK_DESC:0 "§LПідтримувати мережі з місцевих інформаторів й інших зв'язків, при тому мінімізуючи ризик виявлення.§!\nЗупиняє втрату §Yсили розвідмережі§!, поки мережа неактивна."
 OPERATIVE_SLOT_LOCKED_DESC:0 "Завербувати агента і призначити його в цю комірку. Комірка стає доступною через деякий час після отримання. Якщо агента буде вбито або, будучи керівником розвідки, альянс втратить членів, комірки будуть знову заблоковані."
 ORDER_CONNECT_CANT_CONNECT_HERE:0 "§RПомістіть курсор на наказ, із яким можна з'єднатися.§!"
