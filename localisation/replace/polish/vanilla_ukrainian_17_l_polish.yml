 CZE_GATHERING_STORM_DESC:0 "Під час Великої війни чеські та словацькі війська воювали на боці Антанти та побували в усіх закутках Європи з метою здобути визнання своєї нації. Їхні намагання були успішними, і Чехословаччина була створена з попелу Австро-Угорщини.\n\nЗ тих часів, коли була утворена ця нова держава, вона створила «Малу Антанту» — альянс із Югославією та Румунією з метою придушити спроби Угорщини відновити Австро-угорську імперію. Однак, із посиленням Німеччини політичний ландшафт Європи почав змінюватись."
 CZE_GER_fascism_autonomy_reichsprotectorate_DEF:0 "Райхспротекторат Богемія та Моравія"
 CZE_agrarian_reform_desc:0 "Нещодавно розформоване земельне управління відповідало за перерозподіл переважно сільськогосподарських земель; настав час реформувати цю установу для більш рішучих заходів."
 CZE_ally_austria:0 "Укласти союз із [AUS.GetName]"
 CZE_armour_bonus_1_desc:0 "Незважаючи на те, що в нашій армії використовуються найсучасніші танки, прогрес не стоїть на місці, і ми не можемо дозволити собі відставати від нього."
 CZE_avia_organization:0 "$CZE_avia$"
 CZE_balanced_2_desc:0 "Організувавши комісію, до якої входять політики з обох частин нашої країни, ми забезпечимо рівномірний розвиток її промисловості."
 CZE_bop_army_readiness_of_power_category_desc:0 "Чеська армія єдина і готова протистояти майбутнім викликам. Однак внутрішня політика та міжнародні події можуть підірвати впевненість армії в тому, що вона здатна належним чином захистити країну."
 CZE_bop_army_very_low_confidence:0 "Вкрай непідготовлена армія"
 CZE_closer_ties_with_the_moderate_germany_parties:0 "Згуртувати помірковані партії Судетської області"
 CZE_comprise_with_the_carpathians_desc:0 "Регіон Рутенія прагне до угоди про федералізацію, подібної до тієї, яку ми надали [SLO.getnamedef]. Це значно послабило б наші позиції в регіоні та в [9.getname]. Укласти з ними угоду може бути краще, ніж повністю поступитися їхнім вимогам."
 CZE_continue_industrial_relocation_schemes_desc:0 "Заради нашої національної безпеки ми повинні продовжувати переміщувати наші найвразливіші заводи в райони, де вони будуть краще захищені від повітряних та наземних атак. Ми не можемо ризикувати, піддаючи небезпеці таку критично важливу галузь."
 CZE_deal_with_bulgaria:0 "Ліквідувати Болгарію"
 CZE_denounce_stalinism:0 "Засудити сталінізм"
 CZE_double_down_on_heavy_industry_desc:0 "Нові угоди з нашими союзниками дозволять нам зосередитися на найбільш конкурентоспроможних галузях, таких як збройова промисловість. Будь-які надлишки потім можна буде продати."
 CZE_elevate_the_vsv:0 "Підняти статус Військової академії"
 CZE_german_ally:0 "Цінний партнер Німеччини"
 CZE_gottwald_faction:0 "Фракція Готвальда"
 CZE_guardian_of_central_europe_desc:0 "Зараз ми маємо можливість стати наглядачем за демократією в центрі Європи. Ми можемо бути вартовим для націй, які не можуть постояти за себе, і забезпечити непохитність демократії."
 CZE_hungarian_line:0 "Угорська лінія"
 CZE_increase_bauxite_imports_desc:0 "Можливо, наша країна не багата на алюміній, але, використовуючи певні процеси переробки та збільшивши імпорт бокситів, ми можемо виробляти невелику кількість цього ресурсу на внутрішньому ринку. Це допомогло б зменшити дефіцит ресурсів."
 CZE_increase_food_and_resource_imports:0 "Збільшити імпорт продовольства та ресурсів"
 CZE_integrate_lost_territories_desc:0 "Історичні землі Богемського королівства простягалися від Балтійського аж до Адріатичного моря; настав час звернутися до цієї історії під час інтеграції наших нових володінь."
 CZE_lessons_of_war_desc:0 "Маючи за плечима бойовий досвід проти рівного суперника, ми можемо використати ці уроки для вдосконалення нашого вищого командування. Ніщо не замінить уроків, отриманих у реальних зіткненнях армії."
 CZE_medium_tank_equipment_2_short:0 "T-23M"
 CZE_polish_line:0 "Польська лінія"
 CZE_projekt_l_52_desc:0 "Технологія реактивних двигунів — це майбутнє військової авіації. Наразі ця технологія ще трохи сира, але якщо ми знайдемо час для розробки спеціального проєкту та сконструюємо корпус літака, створений саме під неї, ми зможемо випередити час."
