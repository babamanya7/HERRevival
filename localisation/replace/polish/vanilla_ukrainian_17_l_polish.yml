 ARG_a_red_south_america:0 "Ocaso Escarlata"
 ARG_argentina_first:0 "Аргентина понад усе"
 ARG_argentinian_volunteers_in_spain_flag:0 "§Y[ARG.GetName]§! надіслала добровольців до §Y[SPA.GetName]§!"
 ARG_close_ties_with_america_idea:0 "Mutually Beneficial Support"
 ARG_conquer_paraguay_desc:0 "Немає місця для переговорів. Країна [PAR.GetNameDef] стоїть на нашому шляху домінування в Південній Америці. Замість того, щоб надсилати ультиматум, краще взяти бика за роги та оголосити війну нашому сусідові."
 ARG_destroyer_2:0 "Клас «Buenos Aires»"
 ARG_end_operation_bolivar_desc:0 "Ми виявили безперервний потік шпигунських місій, що спрямовуються в країну з [GER.GetName]. Вони жартівливо назвали це «Операція Болівар». Це неприйнятно, і ми повинні негайно припинити всі [GER.GetAdjectives] операції в [ARG.GetName]."
 ARG_ghioldi_returns:0 "Родольфо Гйольді повернувся до [ARG.GetNameDef]"
 ARG_help_the_allies_desc:0 "У міру подальшої ескалації війни, тиск з боку [USA.GetName] зростає, щоб ми відмовилися від нейтралітету та офіційно приєдналися до Союзників. Якщо ми вирішимо це зробити, ми офіційно станемо гравцем у цьому глобальному конфлікті."
 ARG_hitler_2_core_tt:0 "Отримати §YПретензії§! на всі колишні §YНімецькі§! штати."
 ARG_independent_democracy_democratic_DEF:0 "Друга Аргентинська республіка"
 ARG_invite_ghioldi_back_to_argentina_desc:0 "Родольфо Гйольді був видатним комуністом у [ARG.GetNameDef], який, на жаль, був змушений тікати з країни через переслідування з боку нашого уряду. Оскільки ми починаємо зміщувати ставлення до лівих у [ARG.GetNameDef], можливо, настав час запропонувати Гйольді помилування та запросити його назад на батьківщину."
 ARG_nationalist_state_fascism_ADJ:0 "Аргентинськ"
 ARG_peace_out:0 "Провести переговори з державою [ENG.GetNameDef]"
 ARG_political_events.40.desc:0 "Надійшла чудова новина, [SPA.GetNameDef] погодилася на наші вимоги, і нам було надано право власності на Екваторіальну Гвінею як винагороду за нашу допомогу в їхній недавній громадянській війні."
 ARG_political_events.51.a:0 "Ми набираємо обертів серед мас."
 ARG_political_events.60.t:0 "[ARG.GetNameDefCap] запрошує нас до своєї фракції"
 ARG_political_events.74.tt:0 "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! тепер гарантує нашу незалежність!\nМи уклали §YПакт про ненапад§! з [FROM.GetFlag]§Y[FROM.GetNameDefCap]§!!"
 ARG_political_events.9.desc:0 "Внаслідок консолідації влади Рамоном Кастільо в уряді, було підкинуто дров у постійно зростаюче полум'я невдоволення серед військових лідерів країни. Вони вирішили, що досить, і, зібравши стільки сил, скільки змогли, розпочали повстання, щоб рушити маршем на Буенос-Айрес! Схоже, розпочалася [ARG.GetAdjective] громадянська війна."
 ARG_roberto_maria_ortiz_tt:0 "§Y$ARG_roberto_maria_ortiz$§! стає лідером партії §Y$ARG_neutrality_party_long$§!"
 ARG_secure_the_borders_desc:0 "Було б розумно забезпечити, щоб наші нинішні кордони залишалися в безпеці проти наших найнебезпечніших суперників. Ми повинні працювати над встановленням лінії оборони вздовж наших спільних кордонів з [CHL.GetNameDef] та [BRA.GetNameDef], а також навчати наших військових лідерів воювати у численних лісах, що вкривають північ. Захист є першочерговим!"
 ARG_ship_armor_bb_1:0 "280-мм пояс/76-мм палуба"
 ARG_us_marine_program_doctrine:0 "Підготовка морської піхоти США"
 ARMY_DIVISION_TOOLTIP_DETAILED_DESC:0 "У нас є лише $TYPE|Y$ дивізія в нашій армії."
 ARMY_HQ_DIVISION_NAME:0 "Штаб ($LEADER_NAME$)"
 ARMY_HQ_TEMPLATES_TOGGLE_TOOLTIP:0 "§GКлацніть§!, щоби перемкнути список §Yшаблонів армійських штабів§!, де можна переглядати та керувати шаблони армійських штабів."
 ARMY_LEDGER_THRESHOLD_KILL_ENEMY_FAKE_INTELS:0 "Виявлення та знищення ворожих підробних військ"
 AST_CSIR_desc:0 "Державне об'єднання наукових і прикладних досліджень (ДОНПД) — урядове науково-дослідне бюро, яке займається підвищенням ефективності науки та промисловості в Австралії. Збільшивши його підтримку, ми отримаємо нові ресурси для ведення війни."
 AST_SH_battleship_2:0 "$ENG_SH_battleship_2$"
 AST_a_democratic_bulwark_desc:0 "Щоб міцно стояти проти фашистських і комуністичних загроз, демократія повинна вказувати шлях. Уряд має вжити активних заходів, щоб громадяни були представлені в апараті управління, а невдоволення політиків могло бути задоволене через вступ до різних демократичних партій замість шкідливих ідеологій."
 AST_aerial_defense_desc:0 "Якщо ми не можемо дозволити собі флот, рівний світовим державам, в наших силах утримування повітряного флоту, рівному будь-якому, що може бути висунутий проти нас."
 AST_aerodrome_of_democracy_desc:0 "Досягнувши передових рубежів в авіаційних можливостях, ВПС Австралії заслужили звання '[GET_AERODOME_NAME].' Наші льотчики вступають у повітряні бої по всій земній кулі, в той час як наші бомбардувальники кидають смертельну тінь на промисловість наших ворогів."
 AST_aid_australian_military_construction:0 "Допомогти австралійському військовому будівництву"
 AST_an_uncle_for_father_figure_desc:0 "Нам бракує сучасного озброєння, тому ми звернемося до [USA.GetName] з проханням про постачання."
 AST_australia_formables_category:0 "Австралазія"
 AST_australian_regular_army:0 "Австралійська регулярна армія"
 AST_battleship_3_desc:0 "The Lion-class battleships were the follow-up class to King George V battleships, incorporating many of their features. Six ships were ordered in the 1938 Naval Program to replace the aging Revenge-class battleships but none were finished due to the erupting hostilities. The vessels would have been general similar to the King George-class, but the main armament would be heavier, introducing a new 16 in. cannon. They would also have thicker armor and more powerful engines."
 AST_canberra_air_disaster_events.3.a:0 "Нове керівництво на допомогу Австралії."
 AST_centralized_production_desc:0 "Ринкові сили хаотичні й нерівноправні. Якщо ми збираємося побудувати справді справедливе суспільство, держава повинна взяти на себе центральну роль у визначенні того, що, ким і де виробляється. Наша бюрократія веде ретельний облік і найкраще підходить для встановлення виробничих квот."
 AST_defence_citizen_military_forces_act:0 "Закон про оборону громадянських збройних сил"
 AST_dingo_scout_car:0 "Розвідувальна машина Dingo"
 AST_diplomatic_events.1.desc:0 "У рамках своїх недавніх дипломатичних зусиль уряд Австралії прагне підписати угоди про ненапад з кількома обраними азійськими країнами; ми — одна з них. Чи викриває ця спроба уникнути війни австралійських чиновників як відірваних від реальності, чи малює їх у благородній невинності, наша відповідь частково вирішить це.\n\nЧи підпишемо ми пакт про ненапад з [AST.GetName]?"
 AST_diplomatic_events.17.b:0 "Надати право проходу військам."
 AST_diplomatic_events.34.b:0 "[JAP.GetNameDefCap] буде розширюватися так, як вважає за потрібне."
 AST_diplomatic_events.6.a:0 "Сінгапурська стратегія просто повинна вистояти."
 AST_diplomatic_events.65.t:0 "[FROM.GetName] надає підтримку"
 AST_diplomatic_events.67.a:0 "Відмінний перший крок"
 AST_diplomatic_events.68.t:0 "Австралійські вимоги"
 AST_diplomatic_events.74.t:0 "Австралійська вимога про передачу Філіппін"
 AST_diverse_army:0 "Різноманітна армія"
 AST_election_events.2.b:0 "Агітаційний тур Австралією підвищить підтримку АЛП."
 AST_for_greater_good_desc:0 "Наше бачення світової революції вимагає крові та жертв. У багатьох місцях факел соціалізму блимає; ми повинні відповісти на заклик і надіслати свою підтримку, щоб він не згас. Зрештою, це заради вищого блага вищого блага."
 AST_form_australasia_new_zealand_required_states_tt:0 "Контролює всі області §Y[NZL.GetNonIdeologyName]§!."
 AST_government_aircraft_factories:0 "Урядові авіазаводи"
 AST_graziers_to_industry:0 "Скотарів – у промисловість"
 AST_industries_assistance_corporation_desc:0 "Нещодавня світова економічна криза призвела до послаблення інвестиційної та ділової активності в Австралії. Корпорація зі сприяння промисловості надасть малому бізнесу фінансову та консультативну допомогу, щоб оздоровити економіку."
 AST_invest_in_victory:0 "Інвестиції в перемогу"
 AST_jet_tac_bomber_equipment_1_short:0 "Canberra"
 AST_john_brown_and_company_organization:0 "Джон Браун та компанія"
 AST_light_tank_destroyer_equipment_1_short:0 "Vickers Mk VI TD"
