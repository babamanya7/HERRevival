 762_german_name:0 "Каттовіц"
 AAT_Sweden.18.b:0 "Ми заберемо Нарвік у якості плати за наші зусилля."
 AAT_Sweden.5.t:0 "Політика знайшли схованим у кущах"
 AAT_Sweden_communism.7.t:0 "Кілбом намагається усунути Флюга"
 AAT_Sweden_flashpoints.11.t:0 "Держава [SWE.GetName] обурена бомбардуванням Паяли"
 AAT_Sweden_flashpoints.21.t:0 "[SWE.GetAdjectiveCap]о-[FIN.GetAdjective]ий альянс"
 AAT_Sweden_flashpoints.42.b:0 "Ми мусимо відхилити цю вимогу, якщо не хочемо бути втягнуті в цю війну."
 AAT_Sweden_flashpoints.57.t:0 "Король Швеції поранений при спробі евакуації"
 AAT_Sweden_flashpoints.74.desc:0 "[SWE.GetAdjectiveCap]ий уряд, схоже, відмовився від спроб повернути свої кораблі. Після кількох незначних модифікацій кораблі готові до служби в нашому флоті."
 AAT_Sweden_flashpoints.75.a:0 "Вони заробили собі нового ворога."
 AAT_Sweden_flashpoints.76.desc:0 "Після повернення наших кораблів напруженість у відносинах між державами [ENG.GetName] та [SWE.GetName] нарешті спала. Очевидно, що [ENG.GetAdjective]а влада хотіла уникнути конфлікту з нами через кілька старих кораблів."
 AAT_Sweden_nationalists.10.a:0 "[SWE.GetName] стане великою знову."
 AAT_Sweden_nationalists.2.desc:0 "[GER.GetAdjective]ий уряд відхилив нашу пропозицію підставі небажання створювати ще один фронт для своєї армії. Однак вони відправили кілька гвинтівок та добровольців на жест доброї волі."
 AAT_Sweden_nationalists.23.t:0 "Ніж у темряві"
 AAT_Sweden_nationalists.3.desc:0 "[GER.GetAdjective]ий лідер hпогодився надати нам військову підтримку для нашої справи. В обмін на їхню підтримку ми погодилися стати частиною їхньої великої сфери впливу на континенті. Сподіваємося, що колись вони побачать у нас рівних."
 AAT_Sweden_nordic_defense_council.3.desc:0 "[FROM.GetName] відхиляє нашу пропозицію, попри зростаючу світову напругу. Вони обрали інший шлях, тож нехай він не нашкодить нам"
 AAT_Sweden_strike.1.b:0 "Ми мусимо морально заспокоїти людей"
 AAT_USA_events.01.t:0 "[USA.GetNameDefCap] окуповує Гренландію"
 AAT_USA_events.05.desc:0 "[FROM.GetLeader] від держави [FROM.GetNameDef] закликає нас виконати наші обіцянки та, як було домовлено, повернути їм Гренландію, тепер, коли вони знову вільні від гніту."
 AAT_finland_continuation_war.01.a:0 "Добре, тільки простежте, щоби про цю угоду не було записів!"
 AAT_finland_continuation_war.07.desc:0 "Незважаючи на всі наші дипломатичні спроби завадити співпраці держав [GER.GetNameDef] і [FIN.GetNameDef], наші зусилля, схоже, виявилися марними. [FIN.GetAdjective]а армія разом із [GER.GetAdjective]ими військовими атакували нас настільки злагоджено, що стало ясно: таке могло трапитися, тільки якщо вони вже давно координують спільні дії."
 AAT_finland_continuation_war.10.desc:0 "Радянські представники помітили, що ми не дотримуємося перемир'я. У його умовах чітко заявили, що ми повинні видалити зі своєї території всі війська супротивника, а [GER.GetAdjective]а армія користується нашою зброєю і ресурсами, які ми повинні передати Союзу. Щойно наша армія приступила до роззброєння [GER.GetAdjective]их солдатів, почалися перестрілки. [GER.GetAdjective]і війська тепер випалюють нашу землю і мінують наші води."
 AAT_finland_diplomacy.05.t:0 "[FROM.GetAdjective]а петиція про збереження Лапландії"
 AAT_finland_diplomacy.10.b:0 "Доведеться взяти контроль силою, мобілізувати війська!"
 AAT_finland_diplomacy.13.b:0 "Цей блазень поплатиться за це!"
 AAT_finland_diplomacy.20.desc:0 "[FIN.GetLeader] просить нас підписати пакт про ненапад і вічний мир між нашими державами. Цю пропозицію висунуто в рамках нового курсу, взятого [FIN.GetAdjective]им урядом — країна бажає примиритися з сусідами і заново налагодити відносини з нами."
 AAT_finland_kinship_war.04.t:0 "Повстання в Східній Карелії придушене!"
 AAT_finland_national_defense.03.desc:0 "Незважаючи на всі наші зусилля заховати схованки зі зброєю в області [FROM.FROM.GetName] від ворогів, їхні агенти зуміли відшукати та конфіскувати заховане. Частина запасів могла вціліти, але їх занадто мало, щоб хоч на щось вплинути."
 AAT_finland_political.01.a:0 "Калліо є чим зайнятися!"
 AAT_finland_the_white_death.4.t:0 "Сімо Гяюгя отримав прізвисько Біла Смерть."
 AAT_finland_the_white_death.6.t:0 "Сімо Гяюгя отримав прізвисько Біла Смерть."
 AAT_finland_the_white_death.7.t:0 "Біла Смерть прийшла по наші душі!"
 AAT_nordic_cooperation.2.a:0 "Їхня допомога не завадить."
 AAT_norway.20.t:0 "Наша королева померла!"
 AAT_norway.3.a:0 "Це заради виживання Норвегії."
 AAT_norway.4.t:0 "Троцький долучається до нашого уряду!"
 AAT_norway.6.a:0 "Йому сподобається мексиканське сонце."
 AAT_norway_allied.3.t:0 "[FROM.GetName] не інвестує в нашу економіку"
 AAT_norway_allied.4.c:0 "[NOR.NOR_otto_ruge.GetName] — безпечний варіант."
 AAT_norway_communist.8.t:0 "Прибуває норвезька королівська родина"
 AAT_norway_fascist.3.desc:0 "Представники [FROM.GetAdjective]ої фашистської партії зв'язалися з нами і запевнили нас, що [FROM.GetNameDef] надасть нам необхідну підтримку в захопленні контролю над урядом.\n\nЦе може дозволити нам вийти з тіні і захопити владу в державі [ROOT.GetName]."
 AAT_norway_news.1.t:0 "$AAT_norway.7.t$"
