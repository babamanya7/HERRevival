 SHIP_ENGAGEMENT_BUTTON_FIRE_AT_WILL_DESC:0 "Оперативна група завжди вступатиме до бою з ворожими групами. Рухаючись крізь провінцію, де був помічений ворог або очікується битва, оперативна група вступить до бою."
 SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE_DESC:0 "Оперативна група намагатиметься не вступати до бою з ворогом, рухаючись крізь провінцію, де є ворожі кораблі та ведеться битва...\nЯкщо тільки ворог не помітить нас і атакує першим."
