 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_STANDARD:0 "Середземномор'я — наш дім і дім мільйонів інших. Ми завжди прагнули зберегти мир у нашому маленькому куточку Землі, але нашим гідним похвали цілям постійно заважають ті, хто виношує лихі задуми. Ми більше не можемо здаватися без бою і віддавати себе чи своїх сусідів на наругу негідникам. Час стати за праву справу."
 GRE_anti_italian_stratagems:0 "$GRE_anti_german_stratagems$"
 GRE_border_war_possible_tt:0 "Якщо обстановка розпалиться, нам доведеться мати справу з §Rприкордонними конфліктами§! на кордонах з державою §Y[TUR.GetNameDef]§!."
 GRE_bring_home_the_exiled_republicans_desc:0 "Тепер, коли при владі знову наш лідер Елефтеріос Венізелос, ми можемо запросити до себе товаришів із довгого заслання, в яке їх змусили піти монархісти. Щоб повернути країну на праведний шлях, нам знадобиться будь-яка допомога!"
 GRE_cement_greco_german_ties_desc:0 "Істина, яку багато хто з лівих вважає за краще забувати, полягає в тому, що якби не щедра фіскальна політика Німеччини щодо нас, нас би давно чекав на черговий крах. Ніщо з того, чого ми досягли, не було б можливим без німців! Вони потрібні нам більше, ніж ми їм, але ми ще можемо досягти від них кращих умов на честь нашої дружби."
