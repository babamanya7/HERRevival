 USA_recruit_the_free_corps:0 "Завербувати фрайкори"
 USA_secure_asia_desc:0 "Колоніальні держави Європи не бажають або не можуть ефективно захищати свої колонії в Азії. Ми мусимо взяти на себе цю ношу, інакше ці регіони стануть плацдармом для подальшої агресії."
