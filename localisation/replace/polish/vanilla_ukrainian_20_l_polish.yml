 raid_type_INS_militia_port_raid_desc:0 "Ми відправимо ополченців під виглядом рибалок на невеликих човнах, сподіваючись, що їх не виявлять. Після висадки вони спробують створити партизанські осередки і за сприятливої нагоди за підтримки місцевих партизанів захоплять військово-морську базу. Це дуже ризикована справа: якщо ополченців помітять, операція неодмінно зазнає краху.\n\n§YЕфекти:§!\n§RПризначена дивізія витрачається§!\n§YУспіх:§!\n        §WСтає власником і контролером регіону\n        Збільшує ескалацію на §R1§!§!.\n§YЧастковий успіх:§!\n        §WДодає §Yодин рівень§! активності ополчення, збільшуючи шанси на успіх майбутніх спроб.§!\n§YНевдача:§!\n        §WБез ефектів§!."
