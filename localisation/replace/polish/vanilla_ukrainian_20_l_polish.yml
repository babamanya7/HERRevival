 BUL_approached_greece:0 "Звернулися до Греції"
 BUL_balkan_trade_union_secretariat_desc:0 "Ми мусимо створити Секретаріат профспілок, який визначатиме директиви, яких мають дотримуватися різні профспілки, з метою піднесення економіки та сприяння співпраці між країнами нашої [GetFederationOrConfederation]."
 BUL_ban_media_prevents_cooperation_tt:0 "\n§RВиконання цього рішення покладе край можливій співпраці з цією фракцією.§!"
