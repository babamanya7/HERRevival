 army_motorization_focus_desc:0 "Слід зосередити зусилля на моторизації армії, щоби наша піхота швидше добиралася до полів битв — принаймні в тих місцях, де є дороги."
 arrow_cross_insurgency_happened:0 "Повстання «Стрілохреста» відбулося"
 artillery1_desc:0 "Використовуючи більш сучасні матеріали та механізми, ми можемо переробити гаубиці та польову артилерію, що залишилася після Великої війни, для ведення бойових дій у сучасних умовах."
 artillery5:0 "Модернізація вдосконаленої артилерії"
 artillery5_desc:0 "Артилерія з низьким силуетом стане менш помітною для ворога."
