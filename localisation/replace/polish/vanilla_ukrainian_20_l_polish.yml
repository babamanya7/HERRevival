 IRQ_construct_the_kut_barrage_desc:0 "Нещодавні невдачі у будівництві греблі Кут мають бути подолані якнайшвидше, якщо ми хочемо підтримувати належне водопостачання для зрошення вздовж річки Тигр."
 IRQ_coring_state_in_progress:0 "Триває інтеграція держави."
 IRQ_discuss_a_new_treaty_desc:0 "Англо-іракський договір був укладений, коли ми були лише молодою та слабкою нацією. Тепер ми є переважною силою ісламського світу, і такий договір є образою для нашого лідера. Тому настав час домовитися про новий договір з [ENG.GetAdjective]."
 IRQ_fighter_training_desc:0 "Усе наше військове та економічне планування буде марним, якщо наші пілоти не зможуть адекватно використовувати свої літаки для захисту нашого неба від ворожих бомбардувальників."
 IRQ_greater_iraq_tag_communism_ADJ:0 "Іракськ"
 IRQ_hashemite_arab_federation_communism_DEF:0 "Баасистський Арабський Союз"
 IRQ_kurdish_form_the_peshmerga:0 "Сформувати Пешмерга"
 IRQ_kurdish_oil_desc:0 "Нафтові поклади були розвідані в останні роки по всій нашій території, але багатство, яке вони генерували, було викачано з регіону. Тепер ми можемо нарешті створити власну нафтову промисловість та використовувати багатство на благо нашого власного народу."
 IRQ_nationalise_the_oil:0 "Націоналізувати нафту"
 IRQ_political_events.10.desc:0 "Англо-іракський договір був укладений у 1930 році, щоб надати молодій нації більшу автономію, водночас залишаючи її, по суті, пов'язаною з нашою зовнішньою політикою. Однак уряд відкликав договір і вимагає нашого повного виведення з [FROM.GetAdjective] території. Через нашу залежність від нафти з регіону, це може поставити під загрозу всю нашу національну безпеку, якщо [FROM.GetAdjective] уряд вирішить перекрити наші постачання."
 IRQ_political_events.12.t:0 "[FROM.GetNameDefCap] вимагає територію"
 IRQ_political_events.24.b:0 "Ми не будемо з цим миритися. Наша співпраця з [FROM.GetNameDefCap] закінчена."
 IRQ_political_events.40.b:0 "Абсолютно ні!"
 IRQ_political_events.43.desc:0 "[FROM.GetNameDef] погодився на нашу пропозицію передати Сирію нашій владі, що знаменує значний крок до об'єднання арабського світу. Ця історична угода зміцнює нашу позицію як лідера в регіоні та наближає нас до реалізації бачення об'єднаної та процвітаючої арабської нації."
 IRQ_support_from_skies_above_tt:0 "Перебування у фракції з §Y[SOV.GetNameWithFlag]§! та наявність у них літаків §YБлижньої повітряної підтримки§! надасть §Y100 літаків Ближньої повітряної підтримки§! для §Y[ROOT.GetNameWithFlag]§!"
 ISR_communism:0 "Левантський союз"
