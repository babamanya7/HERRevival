 SWI_alpine_fascism_DEF:0 "Альпійська наддержава"
 SWI_american_planes_desc_other:0 "Оскільки ми не можемо поступитися нашими демократичними цінностями для кількох літаків, важливо, щоби ми отримували обладнання з іншої демократії, і [?SWI.SWI_best_dem_ally.GetNameDef] здається найкращим вибором."
 SWI_anti_fascist_drive_desc:0 "Фашистам немає місця в державі [ROOT.GetName] як країні, що прагне до самовизначення та місцевої демократичної влади, і яка прагне стати раєм для людей, наш обов'язок — позбутися кожного фашиста, який усе ще перебуває в країні, де б він не був."
 SWI_attack_from_the_mountains:0 "Атака з гір"
 SWI_avoid_failing_country_angry_TT:0 "[?SWI.SWI_angriest_country.GetAdjective]а думка про державу [ROOT.GetName] вища ніж [?SWI.SWI_no_longer_angry_threshold]"
 SWI_build_up_military_readiness_desc:0 "Завдання підготовки населення Швайцарії ніколи не завершується. Ми не можемо заспокоїтися, доки загроза вторгнення не зникне, а цього може ніколи не зникнути. Ми повинні невідкладно орієнтувати нашу державу на оборонні приготування."
