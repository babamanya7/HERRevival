 NSB_poland_events.1.t:0 "[From.GetNameDefCap] вимагає передати Словаччину"
 NSB_poland_events.401.a:0 "Ласкаво просимо, народ держави [POL_colony_purchase.GetName]"
 NSB_poland_events.402.t:0 "[From.GetNameDefCap] відмовляється продавати територію [POL_colony_purchase.GetName]"
 NSB_poland_events.8.b:0 "Корону Польщі повинен носити хтось інший!"
