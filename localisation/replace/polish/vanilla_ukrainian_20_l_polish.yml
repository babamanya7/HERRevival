 PER_communist_liberate_pashtuns_tt:0 "Відмикає більше рішень §Y$PER_gulf_decisions_cat$§! для сприяння опору колоніальним державам уздовж афгано-іранського кордону."
 PER_foothold_in_indus_tt:0 "Відмикає §Yланцюжок подій§!, де §Y[PER.GetNameDefCap]§! та §Y[RAJ.GetNameDefCap]§! домовлятимуться про контроль над §YБелуджистаном§!."
 PER_foreign_policy_events.2.b:0 "Готувати вторгнення до [FROM.GetNameDef]!"
 PER_foreign_policy_events.2.t:0 "[FROM.GetNameDefCap] відмовляється"
 PER_foreign_policy_events.3.t:0 "Англо-[SOV.GetAdjective] вторгнення в Іран"
 PER_form_sumka_desc:0 "Давуд Моншізаде нещодавно провів час у [GER.GetNameDef] і ознайомився з тамтешнім Націонал-соціалістичним рухом. Тепер він, здається, готовий повернутися до Ірану, щоб використати нинішню хвилю націоналізму та запровадити новий іранський лад."
 PER_fund_state_intelligence:0 "Фінансувати державну розвідку"
 PER_imperial_events.111.desc:0 "Після того, як вдалося витіснити [SOV.GetAdjective]s і відправити їх далі назад на їхні власні землі, ми змогли звернутися до наших ворогів, щоб запросити їхніх дипломатів до Тегерана для початку мирних переговорів. На щастя, вони були сприйнятливі до пропозиції, і після годин обговорень ми домовилися, що вони поступляться своїми прикордонними територіями як компроміс, щоб уникнути тривалої війни."
 PER_imperial_events.120.t:0 "[PER.GetNameDefCap] домовляється про свою здачу"
 PER_imperial_events.150.a:0 "Ситуація не на нашу користь..."
 PER_imperial_events.153.a:0 "Негайно вивести всі війська."
 PER_imperial_events.153.t:0 "[FROM.GetNameDefCap] закликає до миру"
 PER_imperial_events.161.desc:0 "Чудова новина! [FROM.GetNameDefCap] погодився на наші вимоги миру та почав виводити свої війська з наших кордонів. Вони також розпочали процес передачі нам своїх сусідніх прикордонних територій. Ми довго і наполегливо боролися, щоб утримати їх на відстані, і цей день слід святкувати роками!"
 PER_imperial_events.231.a:0 "Чудово. Тепер ми повинні коронувати нового шаха-Каджара."
 PER_imperial_events.80.t:0 "Ситуація в [PER.GetNameDef]"
 PER_industrial_events.3.desc:0 "На жаль, [FROM.GetNameDef] відмовився від нашої щедрої торговельної угоди щодо [PER.GetAdjective] нафти. Можливо, нам краще шукати бізнес деінде?"
 PER_industrial_events.3.t:0 "[FROM.GetNameDefCap] відхиляє нашу торговельну пропозицію"
 PER_iran_for_iranians_desc:0 "Було справді прикро капітулювати перед імперіалістичними сюзеренами та поступатися нашою територією тим, хто бажає знищити наш суверенітет. Однак, якщо є щось, що відповідає істині, то це те, що наше бажання автономії ніколи не помре. Настав час нам повстати та проголосити незалежність!"
 PER_iranian_republic_democratic_DEF:0 "Республіка Іран"
 PER_modernizing_iran_desc:0 "Надто довго [ROOT.GetNonIdeologyName] була обтяжена дезорганізацією та дрібними чварами. Ми повинні навчитися дбати про себе, якщо хочемо створити націю, яка витримає випробування часом. Давайте будувати майбутнє, засноване на єдності та прийнятті сучасної епохи."
 PER_national_museum_desc:0 "Документування нашої історії є важливим, особливо з огляду на багату історію, яку [ROOT.GetNonIdeologyName] творив протягом століть. Плани відкрити музей у Тегерані існують вже роками — настав час нарешті їх реалізувати."
 PER_persian_gulf_fleet_desc:0 "Перська затока — це наш єдиний доступ до решти світу морем, і тому її варто захищати за будь-яку ціну. Якщо ми зосередимо наше навчання на діяльності в затоці, ми зможемо гарантувати, що будь-яким загарбникам з півдня буде важко висадитися з моря."
 PER_propagate_political_literature:0 "Створити місцеві опозиційні групи"
 PER_question_of_resources_desc:0 "Ми з'ясували, що існує висока ймовірність того, що потенційне вторгнення наших колишніх партнерів дуже вірогідне через те, наскільки багата на ресурси [PER.GetNameDef]. Наші нафтові родовища безцінні, і тому є велика ймовірність, що хтось прийде їх забрати. Їм не можна дозволити це зробити, тому замість цього давайте працювати над тим, щоб знищити ці потенційні загрози, перш ніж вони нападуть на нас..."
 PER_root_out_conspiracies_desc:0 "Протягом багатьох років ходили чутки про потенційні змови про вбивство Рези-шаха Пехлеві. Ми вважаємо цей ризик надто великим, і тому вкрай важливо, щоб ми викорінили ці змови для забезпечення безпеки шаха."
 PER_second_warning_flag:0 "Друге попередження про Ісламську революцію"
 PER_secure_iraq:0 "Забезпечити безпеку Іраку"
 PER_ssb_events.4.desc:0 "[FROM.GetLeader] організував зустріч між підписантами Саадабадського пакту, щоб обговорити пропозицію [FROM.GetAdjective] уряду. [FROM.GetLeader] заявляє, що ми перебуваємо в небезпечному становищі, коли нам загрожують великі держави з усіх боків, і пропонує ще тісніше інтегрувати наші економіки, при цьому [FROM.GetAdjective] уряд інвестує ресурси в розширення нашої промисловості та ділиться нашою промисловістю разом."
 PER_ssb_events.5.desc:0 "Після завершення зустрічі [FROM.GetLeader] висловив захоплення цією ідеєю, вважаючи її взаємовигідною угодою."
 PER_superior_firepower:0 "Розширені об'єкти для важкого озброєння"
 PER_trains_from_germany_desc:0 "Оскільки ми готуємося відкрити Трансіранську залізницю, нам потрібні потяги, щоб якнайшвидше розпочати проєкт. У нас є друзі в [GER.GetNonIdeologyName], напевно, якщо ми попросимо, вони будуть раді надати надлишок паровозів для нашого урочистого відкриття."
 PER_uphold_civil_rights:0 "Підтримувати громадянські права"
 PHASE_DEFAULT:0 "За замовчуванням"
 PHI_american_intervention_change_value_medium_increase_tt:0 "Змінити §Yрівень загрози [USA.GetNameDefCap]§! на §R10%§!"
 PHI_american_intervention_promise_bases:0 "Пообіцяти подальший доступ до військових баз"
 PHI_bastion_bataan_desc:0 "Півострів Батаан є природною оборонною позицією, що утворює одну зі сторін Манільської затоки. Поки ми утримуємо це місце, ми зможемо контролювати, хто і що може використовувати затоку та її споруди. Щоб забезпечити наше постійне домінування в цьому районі, нам потрібно розробити оборонні лінії з боку суші та розмістити артилерію на висотах."
 PHI_bring_in_eisenhower:0 "Залучити Айзенгауера"
 PHI_convoys_for_infrastructure_decision_cat:0 "Конвої для інфраструктури"
 PHI_develop_domestic_aircraft_industry:0 "Розвивати вітчизняну авіапромисловість"
 PHI_develop_japanese_trade_connections:0 "Розвивати японські торговельні зв'язки"
 PHI_election_overturned:0 "Вибори скасовано"
 PHI_election_overturned_desc:0 "Вибори 1935 року були переважно на користь Мануеля Кесона, навіть занадто переважно. Еміліо Агінальдо висловив серйозні занепокоєння і порушив це питання перед Сполученими Штатами, які пообіцяли ретельне розслідування можливих маніпуляцій на виборах."
 PHI_encourage_chinese_immigration:0 "Заохочувати китайську імміграцію"
 PHI_focus_time_reduced_T1_tt:0 "§Y$PHI_leverage_the_peso$§! скоротить час, необхідний для цього фокусу, на 35 днів."
 PHI_fortify_corregidor_bypass_tt:0 "У місті Маніла більше не можна будувати §Y$bunker$§! та §Y$coastal_bunker$s§!."
 PHI_fortify_corregidor_desc:0 "Острів Коррехідор стоїть прямо біля входу в Манільську затоку і тому є наріжним каменем нашого подальшого контролю над затокою та її військово-морськими активами. Ми повинні модернізувати укріплення самого острова та побудувати підземні споруди, щоб допомогти витримати тривалу облогу та бомбардування ворожими повітряними і морськими силами."
