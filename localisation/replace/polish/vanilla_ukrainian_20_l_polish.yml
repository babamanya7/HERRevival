 JUNO_brazil_events.163.t:0 "Вирішення трудових спорів"
 JUNO_brazil_events.18.desc:0 "[FROM.GetNameDefCap] вимагає, щоб ми виконали наші зобов'язання приєднатися до них військово у їхній триваючій війні. Ми пожинаємо плоди їхніх інвестицій у нашу економіку, але досі ми мало що зробили для виконання нашої частини угоди. Якщо ми не зробимо цього зараз, можуть бути серйозні наслідки."
 JUNO_brazil_events.33.desc:0 "Уряд [FROM.GetName] неохоче погодився передати нам право власності на свої території в Гвіанах, після наших нещодавніх вимог. Схоже, наш новознайдений метод дипломатичного балансування був успішним."
