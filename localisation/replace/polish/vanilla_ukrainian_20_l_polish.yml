 JUNO_brazil_events.14.b:0 "Це явно хитрість, щоб підірвати нас."
 JUNO_brazil_events.144.desc:0 "Наші операції в [FROM.GetNameDef] з посилення підтримки комуністичної партії зіткнулися з жорстким опором з боку місцевої поліції та служб безпеки. Нам потрібно буде спробувати нову тактику інфільтрації, якщо ми хочемо досягти подальшого прогресу на цьому фронті."
