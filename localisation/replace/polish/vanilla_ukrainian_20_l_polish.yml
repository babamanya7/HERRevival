 SWI_fortify_ticino:0 "Fortezza Ticino"
 SWI_helvetic_republic:0 "Гельветська республіка"
 SWI_join_the_allies_desc:0 "Матеріальні жертви та моральні компроміси, яких вимагає збереження нашого нейтралітету, стають нестерпними. Більше немає місця для нейтралітету, особливо в нинішньому політичному стані Європи. Незважаючи на їхні невдачі, союзники є нашим найкращим вибором, якщо ми хочемо зберегти нашу землю та нашу конфедерацію. Це дійсно такий час, як ніхто інший."
 SWI_ortswehren:0 "Ortswehren"
 SWI_renounce_guiding_principles_desc_council:0 "Наше початкове прагнення консолідувати владу у Федеральній Раді могло виявитися помилковим. Нинішня ситуація вимагає більш прямої та інклюзивної демократії, де стабільність та участь громадян є порядком денним."
 SWI_support_allied_espionage_desc:0 "Той факт, що ми дотримуємося нейтральної зовнішньої політики, не заважає нам підривно підтримувати інші демократичні країни в їхніх зусиллях придушити фашизм у Європі. Фактично, наш нейтралітет і близькість до [?SWI.SWI_biggest_fascist.GetNameDef] роблять нас життєво важливими в міжнародній боротьбі проти фашизму."
 SWI_swiss_guiding_principles_desc:0 "[ROOT.GetNameDefCap] є найстарішою демократією на континенті, але стрімкі темпи змін у Європі ставлять це під загрозу. Чи слід нам продовжувати курс, закладений Eidgenossenschaft і Конституцією 1848 року, чи нам відкриється новий шлях?"
 SWI_veteran_sharpshooter_divisions_desc:0 "Тисячі ветеранів-стрільців подали прохання дозволити їм служити в армії в якості допоміжних військ і зробити свій внесок у захист своєї країни та демократії. Їхній досвід та ентузіазм стануть благом для наших ополченців."
