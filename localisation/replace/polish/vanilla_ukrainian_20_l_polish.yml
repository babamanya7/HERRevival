 ITA_all_roads_lead_to_rome_iri_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$modifier_production_speed_infrastructure_factor$: §G+10.00%§!\n\n"
 ITA_appease_the_military_desc:0 "Багато офіцерів збройних сил незадоволені новою владою або своїм статусом після громадянської війни, тож було би розумно забезпечити викорінення невдоволення в армії й дати офіцерам відчути, що їхня роль у війні визнається."
 ITA_army_primacy_bba_desc:0 "Урешті-решт, війна виграється шляхом відправки солдатів на ворожу землю і захоплення речей, необхідних ворогові для ведення війни. Хоча флот і авіація, безумовно, є корисними організаціями, саме армія виграє війну."
 ITA_citta_dell_aria_tt:0 "Якщо в області §Y[2.GetName]§! нема інших §Yекспериментальних комплексів§!, ми отримаємо §G1§! §Yінститут аеродинаміки й авіоніки§! в області §Y[2.GetName]§!."
 ITA_cooperation_programs_desc:0 "Наша потужна суднобудівна і збройова промисловість має нещодавню історію будівництва військових кораблів для інших країн, як-от грецькі есмінці класу «Hydra», або надання допомоги в проєктуванні, як-от допомога, надана СРСР для їхніх кораблів проєкту «7». Пошук подібних можливостей міг би сприяти подальшому розвитку нашої промислової бази для майбутніх випробувань."
 ITA_crda_organization:0 "$crda$"
 ITA_cv_fighter_equipment_1:0 "Macchi IC.200"
 ITA_destroyer_4:0 "Клас «Medaglie d'Oro»"
 ITA_develop_libya_tt:0 "Додати §Y1 інфраструктуру§! й §G1§! комірку для будівництва в [LBA.GetAdjective]их областях (до §Y3§!), підконтрольних державі §Y[ROOT.GetFlag][ROOT.GetNameDef]§! або §Y[ROOT.GetAdjective]ому суб'єкту§!."
 ITA_discredit_haile_selassie:0 "Дискредитувати [ETH.GetLeader]"
 ITA_electrify_state:0 "$ETH_electrify_state$"
 ITA_end_fiat_ansaldo_duopoly_heavy_templates_tt:0 "\nКоли буде досліджено технологію §Y$improved_heavy_tank_chassis$§!:\n"
 ITA_enlist_the_bashkimi_kombetar_spawn_divs_tt:0 "Створити §Y4§! дивізії §YCamicie Rosse§! в області §Y[THIS.GetName]§!."
 ITA_expand_rome_flying_school_desc:0 "Зі зростанням складності сучасних літаків зростає ризик аварій, якщо пілоти недостатньо підготовлені. Ми мусимо забезпечити, щоби наші льотні школи йшли в ногу з технічним розвитком із точки зору якості підготовки, а також не відставали від попиту на нових пілотів, спричиненого зростанням чисельності нашої армії."
 ITA_follow_the_soviet_union_desc:0 "Існує чіткий шлях до комунізму, вже позначений Радянським Союзом, і ми мусимо йти ним, якщо хочемо, щоби наші зусилля, докладені в новій республіці, принесли свої плоди та дозволили досягти справжньої комуністичної держави."
 ITA_gloria_al_regno_d_italia_desc:0 "Ті, хто стверджує, що монархія є це застарілою системою правління, — дурні, котрі не бачать, як під благородною та твердою рукою скромна нація може стати однією з найбільших світових держав.\nХай живе король!"
 ITA_go_after_france:0 "Піти на Францію"
 ITA_granted_us_independence:0 "Надали нам незалежність"
 ITA_guarantee_austrian_independence_desc:0 "Ми не можемо миритися з німецьким втручанням в Австрію, адже воно становить велику загрозу для італійської нації та балансу сил в Європі. Ми гарантуватимемо незалежність Австрії та будемо протистояти будь-яким дипломатичним маневрам, які Німеччина має намір провести задля впливу на країну."
 ITA_gw_tank_equipment_short:0 "Fiat 3000"
 ITA_heavy_fighter_equipment_1:0 "IMAM Ro.57"
 ITA_heavy_fighter_equipment_2:0 "IMAM Ro.58"
 ITA_incrociatori_pesanti_desc:0 "Наразі Італії бракує промислової бази для збірки достатньої кількості лінкорів, щоби вони водночас були всюди, де нам потрібно. Збудувавши потужні, добре броньовані крейсери, такі як наш клас «Zara», ми матимемо кораблі для боротьби за контроль над морськими просторами в декількох зонах операцій."
 ITA_italian_chania_name:0 "Ла-Канея"
