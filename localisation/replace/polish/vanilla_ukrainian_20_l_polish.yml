 CZE_sudeten_promise_mission:0 "Судетська обіцянка"
 CZE_supply_fighters_for_allies_desc:0 "[FRA.GetAdjective]і та [ENG.GetAdjective]і уряди дуже бояться, що [GER.GetAdjective]і літаки швидко прорвуть їхню оборону та атакують їхні міста в разі початку конфлікту. Тому посилення їхніх ВПС може додати їм трохи впевненості у своїй здатності зупинити експансію [GER.GetNameDef] без значних людських втрат."
 CZE_the_lions_roar:0 "Рик лева"
 CZE_unify_the_fascist_parties_desc:0 "Ландшафт фашистських партій є роздробленим, багато з них є настільки екстремальними, що ніколи не можуть сподіватися на значну підтримку. Для захисту нації необхідно, щоб ці партії об'єдналися і створили бачення Чехословаччини, яке приваблювало б не лише маргінальні верстви суспільства."
