 fortify_bosporus_tooltip:0 "Кожна провінція в §YСтамбулі§!, що контролює протоку §YБосфор§!, має 1-й рівень §Yберегового форту§!, 1-й рівень §Yсухопутного форту§! і зайнята однією дивізією."
