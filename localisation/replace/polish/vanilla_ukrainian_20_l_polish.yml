 decisions.2.desc:0 "Декотрі офіцери у вищих ешелонах висловили «альтернативні» погляди на керівництво країни. Щоби знизити підозру, ми мусимо стримати свої зусилля та підтримати лише одного можливого прихильника, не шкодуючи ресурсів на забезпечення їх лояльності."
 defeat_of_anti_fascists_goal_desc:0 "Ми повинні прагнути знищити антифашистські уряди на нашому континенті."
 denmark_expansion_event.10.a:0 "Не можна дозволяти втягувати себе у війну з сусідом."
 denmark_expansion_event.600.desc:0 "Щоб підвищити дух співробітництва між двома нашими державами, [FROM.GetAdjective]ий уряд запропонував укласти дослідницьку угоду, щоб ми могли ділитися один з одним технічними відкриттями."
 denmark_fascist_event.21.desc:0 "Чудові новини! [FROM.GetNameDefCap] погоджується приєднатися до нашої дослідницької угоди. Це означає, що в нас буде доступ до їхніх технологій. Майбутньому країни такий пакт піде тільки на користь."
 denmark_fascist_event.22.a:0 "Гаразд, залиште свої таємниці при собі."
 denmark_occupation_event.110.desc:0 "Данська делегація, яку очолює особисто [FROM.GetLeader], прибула до нашої столиці, щоб [ROOT.GetLeader] та [ROOT.GetAdjective]а держава прийняли її клятву у вірності. Судячи з усього, данський уряд хоче повністю прийняти нашу співпрацю і допомагати нам усім, чим тільки може."
 denmark_occupation_event.112.desc:0 "[FROM.GetLeader] проявляє недалекоглядність і, не вірячи в наші здібності та зростаючу міць, відкидає клятву вірності, яку дає [ROOT.GetLeader]. У нас залишається лише один спосіб повернути собі свободу — війна."
