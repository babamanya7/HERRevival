 INS_dutch_events.1.desc:0 "Після падіння нашої батьківщини [INS.GetNameDef] звернулася до нас із проханням передати командування нашими військово-морськими силами до [INS.GetNameDef]. Вони стверджують, що об'єднане командування дозволить краще координувати дії в цей безпрецедентний час."
 INS_economic_cat:0 "Економіка Індонезії"
