 AAT_Sweden.13.t:0 "[SWE.GetNameDefCap] просить контроль над Північною Норвегією"
 AAT_Sweden.13.tt:0 "§R[SWE.GetName] може довести ситуацію до війни.§!"
 AAT_Sweden.36.t:0 "[FROM.GetName] відмовляється передавати [DEN.GetAdjective]і заморські території"
 AAT_Sweden.44.desc:0 "На знак доброї волі держава [FROM.GetName] погодилася демілітаризувати область [148.GetName]. Це величезний крок для нас у відновленні східного королівства, поступово наш вплив на державу [FROM.GetName] зростає."
 AAT_Sweden.47.t:0 "[FROM.GetName] хоче зробити нас маріонеткою"
 AAT_Sweden.6.desc:0 "Спікер закликав до нових правил щодо їжі в Ріксдазі після того, як Агда Сьолп «дуже голосно» сьорбнула супу під час чергового виступу політиків щодо обрання нового прем'єр-міністра. Він назвав це «навмисним відволіканням уваги», але пані Сьолп сказала, що через тривалі дебати їй останнім часом не вистачає часу на обід."
 AAT_Sweden_BoP.12.b:0 "Ми маємо зберігати нейтралітет і водночас розвивати потужне військо."
 AAT_Sweden_ball_bearing.3.a:0 "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.4.a:0 "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_communism.3.desc:0 "Урядове розслідування виявило, що з військових складів зникла висококласна військова зброя. У звіті зазначається, що поки що не вдалося встановити поточне місцезнаходження цих запасів, але до 60% зникло до того, як хтось про це дізнався."
 AAT_Sweden_flashpoints.18.b:0 "Ми не можемо ризикувати подальшою ескалацією з радянцями."
 AAT_Sweden_flashpoints.20.desc:0 "У зв'язку з нещодавньою ескалацією напруженості між державами [SWE.GetNameDef] та [SOV.GetNameDef], що переросла у відкритий конфлікт, [SWE.GetAdjective]і посли запропонували тісніше співпрацювати з ними у військовому союзі проти нашого спільного ворога."
 AAT_Sweden_flashpoints.32.a:0 "Повідомте їм, що [GER.GetLeader] починає сумніватися в їхньому нейтралітеті."
 AAT_Sweden_flashpoints.35.b:0 "Якщо війна неминуча, ми битимемося на наших умовах."
 AAT_Sweden_flashpoints.62.b:0 "Ескалація лише створить вигляд залежності від малих держав."
 AAT_Sweden_nationalists.11.desc:0 "Багато [SWE.GetName]их селян відчувають, що політика соціал-демократів їх оминула. Крім того, вони занепокоєні стрімкою індустріалізацією та бояться руйнації традиційного ладу життя. Посіявши серед них насіння невдоволення, нам вдалося створити хвилю підтримки націоналістичних рухів, які обіцяють інвестувати в сільську місцевість та відновити традиційні цінності."
 AAT_Sweden_nationalists.5.a:0 "Вони втратили момент."
 AAT_finland_political.06.a:0 "Цій країні більше не потрібна така людина, як Рюті."
 AAT_finland_the_white_death.12.a:0 "Нехай упокоїться його душа серед героїв минулих часів"
 AAT_finland_the_white_death.2.a:0 "Не варто про них турбуватися"
 AAT_finland_the_white_death.2.desc:0 "Наші бійці повідомляють про те, як цілі колони солдатів раптово потрапляють під обстріл у лісах держави [FIN.GetNameDef]. Серед солдатів ходять чутки про так звану Білу Смерть, втілення морозу, яким славиться [FIN.GetNameDef], і смертельно влучних снайперів [FIN.GetAdjective]ої армії. За бажання ми могли б витратити чималі ресурси на те, щоб позбутися цих перешкод, поки вони не завдали ще більшої шкоди."
 AAT_nordic_cooperation.6.desc:0 "Незважаючи на всі наші зусилля, ми не змогли переконати наших північних сусідів допомогти нам у подальшому розвитку нашої економіки. Звісно, ми завжди можемо спробувати ще раз із іншою країною."
 AAT_norway.13.t:0 "Переворот Квіслінга"
 AAT_norway.18.t:0 "Держава [FROM.GetName] прийняла наші вимоги"
 AAT_norway.3.desc:0 "Після сутички на віллі Кнудсена стало зрозуміло, що політична ситуація загрожує небезпекою через те, що комуністи і фашисти вчепилися одні одному в горлянку.\n\nСуперечки і політичний безлад необхідно припинити. Присутність Троцького ризикує накликати на нас гнів держави [SOU.GetNameDef], і в той же час Національна єдність при першій же нагоді обов'язково передасть країну [FGR.GetAdjective]ому лідеру [FGR.GetLeader], тому їхній вплив потрібно обмежити за будь-яку ціну.\n\nНайкращим варіантом дій буде відправити його в Мексику, де [MEX.GetLeader] погодився впустити його в країну."
 AAT_norway.7.desc:0 "Після років незручного вигнання в нашій країні, клопіткий вигнанець [NOR_lev_trotsky] прибув до Мексики, де його приймуть художники Фріда Кало і Дієго Рівера, які, безумовно, чудово порозуміються з ним і його дружиною.\n\nВін, ймовірно, буде в безпеці від [SOV.GetAdjective]их переслідувань, але, найголовніше, він більше не буде нашою проблемою."
 AAT_norway.9.t:0 "Кабінет Нюгошволда"
 AAT_norway_monarchist.3.b:0 "Ми не можемо розгойдувати човен."
 AAT_norway_news.1.sov:0 "З ним треба розквитатися!"
 AAT_norway_news.2.desc:0 "Перебуваючи з візитом в Англії, щоб побачити свою сім'ю і брата, король Сполученого Королівства Георг V, королева-консорт Норвегії, а до цього — принцеса Уельська, померла уві сні від серцевої недостатності. Вважається, що причиною стало ускладнення після операції на черевній порожнині на початку цього тижня.\n\nВона була улюбленою фігурою в Норвегії, і її, безсумнівно, буде не вистачати її синові принцу Олаву і її чоловікові Гокону VII, королю Норвегії."
 AAT_norway_rikstanken.11.a:0 "Більше танків!"
 AAT_norway_rikstanken.5.a:0 "Ми вітаємо іхню зацікавленість."
 ABDA_corps_expeditionnaire_desc:0 "Французький Індокитай знаходиться на північному фланзі оборонного периметра ABDACOM. Залучивши Французький Далекосхідний експедиційний корпус до активних операцій, [FRA.GetNameDef] принесе об'єднаному командуванню життєво важливу живу силу та досвід своїх колоніальних військ."
 ABDA_events.3.desc:0 "[FROM.GetNameDef] відхилила наше запрошення приєднатися до Верховного командування ABDACOM. Наразі їхні сили не будуть залучені до спільних зусиль, хоча двері все ще можуть залишатися відкритими."
 ABDA_naval_procurement_ast_ships_tt:0 "[AST.GetName] отримає §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
 ABDA_naval_procurement_generic_tt:0 "Залежно від складу §YABDACOM§!, [INS.GetNameDef], [HOL.GetNameDef] та [AST.GetNameDef] можуть отримати по §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
 ABK_SOV_communism_subject:0 "Автономна радянська соціалістична республіка Абхазія"
 ABK_communism_DEF:0 "Абхазька незалежна комуна"
 ABK_democratic_ADJ:0 "Абхазьк"
 ABK_fascism:0 "Православна абхазька держава"
 ABK_neutrality:0 "Абхазька військова адміністрація"
 ACE_PILOT_CANT_ASSIGN_KIA:0 "Неможливо призначити льотчика-аса, оскільки того було §Rвбито§!."
 ACHIEVEMENTS_LOGGED_IN_PARADOX:0 "Виконано вхід в аккаунт Paradox"
 ACHIEVEMENT_UNLOCKED_WHEN:0 "Умови отримання:"
 ADDRESS:0 "Адреса"
 AFG_alliance_with_turkik_peoples_tt:0 "Відмикає рішення §Y[AFG_get_turkik_people_name_key]§! для поширення осередків опору в [SOU.GetAdjective] середньоазійських землях. Штати, в які ми втручалися, приєднаються до нас, коли спалахне війна з [SOU.GetNameDef]."
 AFG_amanullah_caliphate_fascism:0 "Халіфат Аманулли-хана"
 AFG_biding_our_time:0 "Вичікувати час"
 AFG_central_asian_unification_tt:0 "Відмикає рішення §Y$AFG_develop_central_asia_category$§! для отримання претензій на колишні [SOU.GetAdjective] області в Центральній Азії, які були передані нам."
 AFG_clear_malarial_swamps_desc:0 "Малярія залишається лихом у багатьох районах нації. Очистивши території, де розмножуються малярійні паразити, ми можемо позбавити сільське населення історичної проблеми та відвоювати нові землі для розвитку."
 AFG_concessions_to_pashtuns_desc:0 "Пуштуни становлять більшість населення, і більшість їхніх сімей протягом століть дотримувалися вікових традицій Пуштунвалі. Тепер багато хто з них стурбований тим, що їхній спосіб життя руйнується. Це, ймовірно, зменшиться, якщо ми залучимо більше пуштунських націоналістів та практиків Пуштунвалі до уряду."
 AFG_confederation_pak_democratic_ADJ:0 "Афгано-пакистанськ"
 AFG_development_in_uzb_desc:0 "Узбекистан довгий час був занедбаний різними режимами, які його окупували. Якщо ми хочемо закріпити наш контроль над ним, ми повинні виправити цю несправедливість та посилити розвиток регіону, одночасно інтегруючи його в нашу економіку."
 AFG_establish_naval_bases:0 "Створити військово-морські бази"
 AFG_follower_of_islam_desc:0 "Іслам був основою нашої віри протягом більше тисячоліття, і ми повинні забезпечити, щоб наш лідер дотримувався його керівних принципів і таким чином вів нашу націю до нової золотої доби."
 AFG_fortify_pakistan:0 "Укріпити кордон"
 AFG_hold_elections:0 "Провести вибори"
 AFG_increase_land_and_animal_taxes_desc:0 "Сільське населення мало сприяє економічній життєздатності нації, і їхнє натуральне господарство дозволяє їм уникати більшості форм оподаткування. Щоб стимулювати більш сучасні сільськогосподарські практики, ми запровадимо нову податкову політику, яка змусить їх шукати більших прибутків, якщо вони хочуть мати їжу на столі."
 AFG_industrial_events.34.t:0 "[FROM.GetNameDefCap] погоджується на договір про воду"
 AFG_industrial_events.56.t:0 "[FROM.GetNameDefCap] відхиляє ультиматум"
 AFG_infantry_at:0 "Boys Anti-Tank Rifle"
 AFG_khyber_pass_riflining_desc:0 "Кустарні підприємства вздовж Хайберського перевалу десятиліттями виробляли копії іноземного озброєння. Хоча їхня зброя поступається якістю, вони компенсують це кількістю. Можливо, настав час нам інвестувати в регіон та розвинути вітчизняного виробника зброї для наших збройних сил."
 AFG_mechanized_equipment_3:0 "M5 Half-Track"
 AFG_pashtunistan_ascendancy_democratic:0 "Сполучені пуштунські республіки"
 AFG_political_events.111.t:0 "[FROM.GetNameDefCap] погоджується поступитися територією"
 AFG_political_events.122.a:0 "Зрада соціалістичних ідеалів."
 AFG_political_events.130.b:0 "Вони дурні, що взагалі консультуються з нами щодо цього."
 AFG_political_events.22.t:0 "[FROM.GetName] відмовляється інвестувати в нашу економіку"
 AFG_political_events.60.t:0 "Запрошення до $AFG_turko_persian_union$"
 AFG_political_events.71.t:0 "[FROM.GetNameDefCap] погоджується переглянути кордони"
 AFG_political_events.95.b:0 "[AFG.GetNonIdeologyName] нас не стосується."
 AFG_qargha_dam:0 "Побудувати дамбу Карга"
 AFG_rebuild_the_silk_road_desc:0 "Шовковий шлях колись приніс багатство та культуру до Імперії. Відновивши цю історичну торговельну мережу, ми повертаємо наше місце в центрі світової торгівлі, збагачуючи імперію та сприяючи процвітанню на її великих територіях."
 AFG_reorganize_the_royal_guard:0 "Реорганізувати Королівську гвардію"
 AFG_request_german_support:0 "Запросити німецьку підтримку"
 AFG_restore_the_timurid_empire:0 "Відновити Імперію Тимуридів"
 AFG_secure_baghdad_desc:0 "У міру того, як наш вплив на регіон розширюється, стає очевидним, що [IRQ.GetNameDef] має потенціал підірвати наші зусилля. Тому ми повинні вимагати узгодження їхньої зовнішньої політики, інакше вони зіткнуться з гнівом наших збройних сил."
 AFG_socialist_coup:0 "Соціалістичний переворот"
 AFG_socialist_coup_tt:0 "§YЯкщо підтримка комуністів перевищує 60%, ми уникнемо спричинення громадянської війни.§!"
