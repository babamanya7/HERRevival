 britain.23.d:0 "Азад Гінд, уряд Вільної Індії у вигнанні, заявив, що настав час для всіх справжніх патріотів підняти зброю проти британських владик. Доля Індії висить на волосині, і ми мусимо зробити вибір."
 britain.26.desc:0 "Наші дипломати, які зараз перебувають у [ICE.GetNameDef], надіслали нам низку повідомлень про те, що новостворений уряд [ICE.GetAdjective] отримав погрози окупації англійськими військами, якщо не підкориться. Не маючи інших реальних альтернатив, [ICE.GetLeader.GetName] попросив нашого захисту від англійської загрози. Можливо, база, розташована так близько до британського материка, буде для нас вигідною?"
