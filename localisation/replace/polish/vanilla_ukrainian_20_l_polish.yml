 DLC_DESCRIPTION_dlc049:0 "Прокладіть нові шляхи в історії Японії, Китаю та Філіппін у No Compromise, No Surrender — розширенні для Hearts of Iron IV. Скористайтеся поглибленим контролем над альянсами, створіть нові військові доктрини та виріштк долю Тихого океану, і не тільки."
