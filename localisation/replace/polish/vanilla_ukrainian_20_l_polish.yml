 SIA_activate_naval_raid_tt:0 "Розблоковує рейд §YРейд на тихоокеанський острів§! на тихоокеанських островах."
 SIA_all_weather_roads:0 "Всепогодні дороги"
 SIA_artillery_reigns_supreme:0 "Артилерія панує нероздільно"
 SIA_asian_democratic_compact_tt:0 "Відкриває можливість вимагати незалежності для азійських суб'єктних держав і дозволяє нам запрошувати їх до нашої фракції."
 SIA_asian_financial_compact:0 "Азійський фінансовий договір"
 SIA_broadcast_weather_reports_to_the_allies_desc:0 "Небо і моря регіону визначаються погодою не менше, ніж флотами та арміями. Надійні звіти з [ROOT.GetNameDef] можуть допомогти плануванню Союзників, захистити їхні операції від несподіванок і зробити нашу батьківщину мовчазним, але цінним партнером у їхній війні."
 SIA_chaiseri_organization:0 "Chaiseri"
 SIA_contact_the_south_east_asia_command_desc:0 "Якщо опір має стати чимось більшим, ніж просто сміливими жестами, він повинен бути прив'язаний до ширшої стратегії. Встановивши контакт з командуванням Союзників у Південно-Східній Азії, патріоти [ROOT.GetName] зможуть отримати керівництво, запаси і місце у великій боротьбі."
 SIA_demand_independence_LAO:0 "Вимагати звільнення §Y[LAO.GetName]§!"
 SIA_direct_funds_from_the_military_towards_development:0 "Спрямувати кошти з військових потреб на розвиток"
 SIA_drum_up_irredentism:0 "Розпалювання іредентизму"
 SIA_heavy_cruiser_1_desc:0 "The Sri Ayuthia class coastal defense ships were perhaps the last ships of this type built in the world, with both ships of the class built in Japan and commissioned for the Royal Thai Navy in 1938. The design was comparable to a small cruiser (or large destroyer) in size, to a battleship in speed, and to a heavy cruiser in armament. Its main guns were four 203mm/53 3-Shiki cannon. They were lightly armored compared to contemporary heavy cruisers."
 SIA_increase_civilian_approval_3_tt:0 "Збільшує схвалення крила §YЦивільних§! на §GВеличезну величину§!"
 SIA_increase_rice_exports_desc:0 "Рис є найнадійнішим джерелом іноземного доходу, доступним для [ROOT.GetNameDef]. Розширюючи експорт, поки ринки залишаються відкритими, ми можемо наростити резерви, профінансувати стратегічний імпорт і підготувати скарбницю до можливих потрясінь."
 SIA_industrialization_drive_trigger:0 "§YКхана Ратсадон§! активна"
 SIA_relocate_the_capital_to_phetchabun_tt:0 "Переміщує до §G3§! §YВійськових заводів§! з §Y[1076.GetName]§! до §Y[1077.GetName]§!\nПереміщує §G3§! §YЦивільні фабрики§! з §Y[1076.GetName]§! до §Y[1077.GetName]§!\nБудує форти рівня §G3§! навколо Пхетчабуна"
 SIA_renegotiate_teak_control:0 "Перегляд контролю над тиком"
 SIA_retake_lost_british_states_tt:0 "Відкриває можливість почати обмежені війни проти британських колоній у §YБірмі§! та §YМалайзії§!"
 SIA_reverse_engineer_allied_tanks_desc:0 "Інші вже понесли витрати на експерименти. Захоплені танки та імпортовані машини можна розібрати, вивчити та імітувати. Навчаючись на іноземних конструкціях, [ROOT.GetName] може скоротити шлях до створення власних бронетанкових сил."
 SIA_revise_the_taxation_system_desc:0 "Нинішня податкова структура не відповідає належним чином державі, яка готується до труднощів і самозабезпечення. Переглянута система збиратиме доходи більш рівномірно, зменшить марнотратство і спрямує тягар національної оборони та розвитку з більшою дисципліною."
 SIA_send_bureaucrats_abroad_desc:0 "Інші країни вже побудували міністерства, школи та технічні служби, які нам зараз потрібні. Відправляючи перспективних чиновників за кордон, ми можемо перейняти адміністративний досвід без нав'язування іноземного правління."
