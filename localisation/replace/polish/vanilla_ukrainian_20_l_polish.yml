 news.12.e:0 "Подивимося, що зможуть зробити більшовики..."
 news.129.d:0 "Британські війська увійшли до Берліну, і військовий кабінет оголосив про успішне захоплення німецької столиці після запеклих боїв. Удар був завданий на світанку, англійці захопили аеропорт Темпельгоф, тоді як колони бронетехніки просувалися Франкфурт-алеєю.\n\nРайсхканцелярія тепер знаходиться під контролем британців, і бої на вулицях практично затихли. Про уряд Німеччини нічого невідомо, але стверджується, що декільком міністрам вдалося врятуватися."
 news.13.t:0 "[FIN.GetNameDefCap] виконує радянські вимоги"
 news.135.d:0 "Американські війська увійшли до Токіо, і військове міністерство США повідомило про закінчення основних бойових дій у місті. Повідомляють, що бої були важкими, особливо на околицях імператорського палацу, який обороняла фанатична імператорська гвардія, хоча сам імператор, з чуток, покинув місто до початку штурму.\n\nПісля падіння Токіо, згідно з прогнозами експертів, організований опір на Японських островах швидко припиниться. Незабаром очікується початок мирних переговорів, якщо японські радикали не переконають імператора продовжувати боротьбу до останнього подиху."
 news.14.a:0 "Танну що?"
 news.161.e:0 "Це був єдиний вихід."
 news.164.c:0 "Ми будемо відстоювати справедливісит"
 news.170.d_ITA:0 "Запевняючи, ніби вона прагне міцного миру на Балканах, Німеччина змусила грецький уряд поступитися державі [ITA.GetName] оспорюваними територіями. І хоча держава [GRE.GetName] протестувала проти цього, німецький вплив на Балканах не залишив їй вибору. Єдиний спосіб уникнути прямої конфронтації з державами [GER.GetName] і [ITA.GetName] — це дозволити німцям диктувати власні умови."
 news.174.c:0 "З цього нічого не вийде."
 news.179.b:0 "Це може знову зробити Францію великою державою."
 news.179.d:0 "Після майже двох десятиліть політичної кризи [From.GetName] все ще намагається повернути те, що було втрачено у Велику війну. [From.GetAdjective]а влада має намір відновити [From.GetAdjective]у державу в усій її колишній [From.GetAdjective]ій величі.\n\nЦі політичні реформи посилили роль держави та армії, а [From.GetAdjective]і громадяни твердо вірять в майбутню велич, яку обіцяє [From.GetLeader]."
 news.188.b:0 "Як хтось може миритися з «[ITA.GetAdjective]ою співдружністю»?"
 news.197.d:0 "Держава [From.GetName] піддалася на [Soviet.GetAdjective]ий ультиматум і передав контроль над Егейськими островами [Soviet.GetName].\n\nЦим самим [Soviet.GetName] посилює свою присутність у Середземномор'ї і зміцнює себе як військово-морську силу в регіоні."
 news.2.a:0 "Неясно."
 news.2.b:0 "Це задовольнить нас... поки що."
 news.2.c:0 "У нас не було вибору."
 news.202.t:0 "Словаччина в обмін на Данциг"
 news.213.a:0 "[GER.GetName] стоятиме міцно тисячу років!"
 news.213.d_peace:0 "Як країна вільних, [USA.GetNameDef] вважає себе природним ворогом фашизму в усіх його формах у всьому світі. В умовах агресії німецького режиму вони є найбільшим ворогом світу, побудованого на ліберальних принципах, яких дотримується [USA.GetNameDef].\n\nЗ огляду на це, а також за схвалення Конгресу [USA.GetAdjective], [USA.GetLeader] виніс попередження [GER.GetNameDef]. Якщо [GER.GetNameDef] не змінить свій політичний курс, [USA.GetNameDef] вживе заходів проти нього.\n\nХоча ніяких заходів не було вказано, неявна загроза війни нависла над двома країнами."
 news.220.a:0 "Народ завжди тріумфує."
 news.220.b:0 "За державу [Root.GetNameDef]!"
 news.221.b:0 "На сцену виходить новий світовий лідер."
 news.225.d:0 "\nСередземномор'я здавна було регіоном великої стратегічної цінності для імперського впливу [ENG.GetNameDef]. Зараз [ENG.GetAdjective]ий уряд шукає подальшої підтримки від країн регіону. З цією метою він призначив «спеціального консула в державі [TUR.GetAdjective]»\"\n\nВраховуючи століття запеклої конкуренції за військово-морське панування в Середземному морі, чи вдасться їм зблизити свої дві країни, ще належить з'ясувати."
 news.229.a:0 "[GER.GetAdjective]у експансію треба зупинити!"
 news.229.d:0 "Незважаючи на те, що [GER.GetNameDef] був значно послаблений територіальними вимогами, які висунув [GER.GetNameDef], [GRE.GetNameDef] тепер накреслив лінію на піску. [GRE.GetLeader] дав зрозуміти, що [GRE.GetNameDef] не піде на подальші поступки і більше не буде підкорятися жодним вимогам [GER.GetAdjective].\n\nЦе все відбувається у відповідь на ультиматум від держави [GER.GetNameDef], щоби [GRE.GetAdjective]ий уряд пішов у відставку і прийняв заміну, затверджену [GER.GetAdjective]ою владою."
 news.241.c:0 "Я хочу почути, як ви скажете: «За революцію!»"
 news.248.t:0 "[ENG.GetNameDefCap] здає Північно-Східні Території"
 news.249.e:0 "Ми повинні швидко знайти спосіб протистояти цьому кроку."
 news.260.t:0 "[SAF.GetNameDefCap] переймає відповідальність за африканські колонії"
 news.261.a:0 "Цікаво."
 news.271.desc:0 "Після приголомшливого успіху танка Bob Semple, вище командування Сил оборони [NZL.GetName] зажадало виготовити його збільшену версію. З висотою понад 15 футів і вагою не менше 120 тонн, нова машина викликає трепет у всіх сенсах цього слова. Його озброєння, що складається з двох 17-фунтових протитанкових гармат, швидко впорається з будь-яким ворогом, в той час як його важка броня, що пройшла ретельні випробування на куленепробивність, дозволить йому без страху рухатися в гущавині бою.\n\nНа церемонії презентації один спостерігач назвав його «найвидатнішим танком, який коли-небудь вироблявся», а інший — «безпрецедентним».\nСерійне виробництво, як очікується, розпочнеться вже протягом місяця."
 news.281.b:0 "$news.280.b$"
 news.300.c:0 "Будем сподіватись, що мир збережеться"
 news.310.t:0 "[From.GetName] прогинається під Угорщиною"
 news.325.c:0 "Порохова діжка ніколи не підводить."
 news.337.a:0 "Чудово для Ефіопії!"
 news.337.c:0 "Ми ніколи від цього не оговтаємося."
 news.34.d:0 "Перемир'я між державою [From.GetName] та Третьою французькою республікою було підписано в Комп'єні, в тому ж залізничному вагоні, де обговорювалася капітуляція Німеччини у Великій війні.\n\nЗа умовами перемир'я, французький уряд під керівництвом [vichy_france.GetLeader] буде розташовуватися у Віші і керувати звідти переважно Південною Францією, тоді як решта території країни буде окупована Німеччиною. Ряд французьких офіцерів поклявся продовжувати спротив із-за кордону, проте боям на території Франції покладено край. Принаймні на деякий час."
 news.36.d:0 "Після успішно проведеного місцевими нацистами перевороту у Відні, німецькі війська перетнули кордон Австрії та захопили країну.\n\nЗа повідомленнями, жодного опору не було, німецьких солдатів зустрічав на вулицях захоплений натовп.\n\nПеред тими, хто зібрався на Гельденплац у Відні, Гітлер оголосив про аншлюс Австрії, тобто про приєднання її до Німеччини: «Найдавніша німецька східна провінція стане відтепер новим бастіоном Третього райху!»"
