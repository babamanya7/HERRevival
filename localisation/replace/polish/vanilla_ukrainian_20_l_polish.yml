 heavy_armor_desc:0 "Найсильніші танки з сильними бронею та зброєю, але повільні та тактично негнучкі."
 heavy_fighter_equipment_3_desc:0 "Хоча ескадрильї важких винищувачів непогано діють у різних ролях, нам слід розробити нові поліпшення, які підвищать їх шанси у сутичках з винищувачами, а також дозволять перехоплювати швидші та захищені бомбардувальники супротивника."
 hold_the_democratic_national_referendum_desc:0 "$hold_the_fascist_national_referendum_desc$"
 hospital_tech:0 "Польові шпиталі"
 iceland_events.12.c:0 "Можливо, якщо віддати їм один острів, шкоди не буде"
 iceland_events.24.t:0 "[FROM.GetNameDefCap] поступається нашим вимогам"
 idea_SIA_yielded_the_air_war_desc:0 "Поступившись контролем над небом, ресурси перенаправляються на протиповітряну оборону замість прямої боротьби за перевагу в повітрі."
 idel_ural_fascism_DEF:0 "Південноуральська імперія"
 imperial_glory_goal_name:0 "Захистити життєво важливі імперські активи"
 improve_stalin_line_desc:0 "Зведення Лінії Сталіна почалося в 1920-х роках уздовж західного кордону з буржуазними європейськими країнами, які мріють про знищення нашої країни. Ми мусимо зміцнити ці споруди."
 improved_infantry_weapons_2_desc:0 "Індивідуальна та колективна стрілецька зброя, а також інші елементи оснащення піхотинця. Поліпшені моделі зброї та більш спеціалізоване оснащення."
 improved_oil_processing_desc:0 "Використання раніше експериментальних методів очищення в промисловому масштабі дозволить нам швидше пристосовуватися до доступних матеріалів і вимог."
 in_60_days:0 "Через 60 днів:"
 india_the_japanese_cometh:0 "Японці йдуть"
 indigenous_mexico_democratic_ADJ:0 "Мексиканськ"
 indigenous_mexico_neutrality:0 "Тубільна Мексика"
 infiltrate_military_seduction_outcome:0 "Наш агент зв'язався з солдатом, який став досить надійним джерелом інформації."
 integrate_papua:0 "Інтегрувати Папуа"
 japan.11.d:0 "Збираючи війська в Індокитаї, недалеко від сіамського кордону, ми чітко дали зрозуміти, що наш намір використовувати їхню землю як базу для звільнення Південно-Східної Азії від європейського колоніалізму є справжнім. Сподіваємося, дозволивши їм приєднатися до нас у військовому альянсі, фактично перетворивши Сіам у маріонеткову державу Японської імперії, ми зможемо уникнути безглуздого одностороннього вторгнення. Звісно, якщо вони його відкинуть, це буде розцінюватися як оголошення війни."
 japan.9.d:0 "Німці відмовилися відкликати своїх радників з Китаю, незважаючи на те, що їхня військова місія прямо втручається в наші плани щодо Східної Азії! Хіба вони не бачать, що це руйнує фундамент для наших держав, на якому можна будувати дипломатію? Чи можна взагалі вірити німцям?"
 jimma_fascism_DEF:0 "Султанат Джімма"
 kingdom_of_araucania_and_patagonia_neutrality:0 "Королівство Арауканія та Патагонія"
 land_fort_tech_1_desc:0 "Завдяки більш ефективному використанню земель, що оточують наші укріплення, та впровадженню нових технологій ми можемо зміцнити існуючі споруди та розширити їх ще більше."
 landmark_great_wall_section_desc:0 "Велика китайська стіна, споруджена протягом сотень років і за часів десятків урядів, є шедевром інженерної думки. Сьогодні її можна вважати символом великої мужності та непокори китайського народу перед обличчям негараздів."
 landmark_sadabad_complex_desc:0 "Побудований династією Каджарів і розширений династією Пехлеві, Саадабадський комплекс на півночі Тегерана служить королівською резиденцією і центром влади. Його палаци й сади відображають мінливий політичний ландшафт Ірану, від консерватизму до модернізму."
 lar_appeal_to_overseas_territories.3.a:0 "Відмінно!"
 lar_arms_purchases.1.desc:0 "Помітивши, як швидко погіршується ситуація в Європі, французькі офіційні особи звернулися до нас за експортними ліцензіями на важке озброєння та сучасні літаки. При цьому замовлення розміщуватимуться на наших заводах відразу після отримання ліцензій. Хоча загальний обсяг замовлень занадто малий, щоби помітно вплинути на економіку, все ж таки вони створять чимало робочих місць."
 lar_concessions_to_italy.5.t:0 "Франція пропонує колоніальні поступки"
 lar_concessions_to_italy.6.a:0 "Треба довести справу до кінця."
 lar_congress_of_paris.1.desc:0 "[This.GetLeader] оголошує офіційне запрошення, і [ITA.GetLeader], [SPA.GetLeader] і [POR.GetLeader] прибувають до Парижа обговорити сфери колоніального впливу в Африці. Оскільки Франція й Італія — головні держави, зацікавлені в розширенні своїх імперій, необхідно піти на поступки для держав [SPA.GetNameDef] и [POR.GetNameDef], щоб вони вступили в союз та віправились на війну заради цих цілей.\n\n[POR.GetLeader], швидше за все, спробує заручитись підтримкою для втілення свого давнього плану з об'єднання Мозамбіку та Анголи. [SPA.GetLeader] виможе для себе частину французьких північноафриканських територій."
 lar_dominate_the_middle_east.1.t:0 "Франція вимагає покору"
 lar_dominate_the_middle_east.2.t:0 "[From.GetNameDefCap] підкорюється"
 lar_end_the_occupation.1.t:0 "Кінець окупації"
 lar_end_the_occupation.4.b:0 "Навіщо нам допомагати зрадникам і трусам?"
 lar_france_french_union.6.desc:0 "З величезного та слаборозвиненого регіону результати голосування надходять повільно, але схоже, що на референдумі з невеликою перевагою було прийнято рішення вступити до нового Французького Союзу. Групи націоналістів визнали свою поразку, але вимагали, щоб у нагороду за нова держава збільшила інвестиції у розвиток регіону."
 lar_france_french_union.9.t:0 "Сирія голосує проти Союзу"
 lar_franco_soviet_treaty.2.a:0 "Цього цілком достатньо."
 lar_franco_soviet_treaty.3.a:0 "Не зможуть чи їм просто незручно?"
 lar_news.12.c:0 "Отже, ми здолаємо і їх."
 lar_news.24.d:0 "Іберійські нації нарешті працюють спільно..."
 lar_news.28.e:0 "Треба діяти швидко, інакше карлисти та фалангісти знову розділять нашу націю!"
 lar_news.281.a:0 "Славний день!"
 lar_news.281.b:0 "Що це означатиме для Іспанії?"
 lar_news.291.a:0 "Kei whea mai!"
 lar_portugal_iberian_summit.5.a:0 "Ця пропозиція в наших інтересах."
 lar_portugal_iberian_workers_united.2.desc:0 "Тепер, коли ми нарешті прийшли до миру, держава [From.GetNameDefCap] звернулася до нашого уряду з пропозицією об'єднати Піренейський півострів під народним соціалістичним урядом. [Root.GetAdjective] Це буде згладжено: ми всі станемо громадянами Іберійського соціалістичного союзу."
 lar_portugal_navy_mutiny.3.desc:0 "Заколот був пригнічений завдяки швидкій реакції наших берегових сил. Заколотники заарештовані і понесли покарання відповідно до тяжкості їх провин. Щоб запобігти подальшому порушенню субординації, ми повністю замінили команди кораблів, що брали участь у морі нашими організаціями."
 lar_portugal_overseas_provinces.3.desc:0 "Our former colony of East Timor have finally been integrated into our nation. The local Timorese population has obtained Portuguese citizenship and now shares the same rights and duties as any other Portuguese citizen, including military service. This will lead to a new source of manpower to strengthen our army."
 lar_portugal_purchase_ships.1.a:0 "Це піде на користь нам обом."
 lar_portugal_purchase_ships.6.t:0 "Завершено будівництво корабля — легкий крейсер"
 lar_ratify_the_stresa_front.2.desc:0 "Настав час виконати обіцянку, яку ми дали [From.GetAdjective]ому уряду. Тепер, коли союз укладений, ми зобов'язані передати Джібуті під контроль наших партнерів."
 lar_spain.2.t:0 "Громадянська війна в Іспанії"
 lar_spain.30.desc:0 "[From.GetAdjective] уряд, бачачи, як активно розвивається наша співпраця, пропонує нам укласти повноцінний союз, до якого, крім нас та іспанців, можуть також увійти італійці та французи."
 lar_spain.42.a:0 "Його претензії справедливі, і ми охоче їх приймаємо. Vive le Roi!"
 lar_spain.42.t:0 "[From.GetNameDefCap] заявляє претензії на французький трон"
 lar_spain.50.t:0 "Португальський анархізм — закінчення громадянської війни"
 lar_spain.59.b:0 "Ми куди краще сприятимемо справі Революції самостійно."
 lar_spain.60.t:0 "Червона Іберія — [From.GetNameDefCap] приймає пропозицію"
 lar_spain.64.a:0 "Вони покладаються на нас, і ми мусимо допомогти їм, навіть якщо ризикуємо при цьому самі."
 lar_spain.75.a:0 "Безцінна допомога у нашій боротьбі з радянцями."
 latin_africa_category_desc:0 "Романомовні країни Центральної Африки мають багато спільного та сповідують одну державну релігію. Зараз, як ніколи, регіону необхідно об’єднатися, якщо він хоче протистояти могутності глобальних наддержав."
 latin_africa_communism_ADJ:0 "Латиноафриканськ"
 lc_heavy_anti_air_battery_desc:0 "Зенітна батарея, оснащена великокаліберними гарматами для ураження високошвидкісних і високошвидкісних літаків, що забезпечує захисну оболонку навколо транспортного засобу."
 lc_heavy_naval_guns:0 "Важкі морські гармати"
 liangguang_clique_neutrality_DEF:0 "Лянгуанська кліка"
 liberate_angola_desc:0 "Це займе приблизно 6 місяців."
 liberate_equatorial_guinea:0 "Звільнити державу [EQG.GetName]"
 liberate_liberia:0 "Звільнити державу [LIB.GetName]"
 liberate_senegal_desc:0 "$liberate_angola_desc$"
 license_purchase_cost_tt:0 " $MODIFIER_LICENSE_PURCHASE_COST$: $RIGHT|-=%1$"
 light_cruiser_2:0 "Легкий крейсер II"
 light_sp_anti_air_support:0 "Підтримка легких ЗСУ"
 light_tank_artillery_equipment_3_desc:0 "$light_tank_artillery_equipment_desc$"
 light_tank_destroyer_equipment_1_desc:0 "$light_tank_destroyer_equipment_desc$"
 line_of_battle_flagships:0 "Координація флагманів"
 lion_class:0 "Клас «Lion»"
 marines_recon_desc:0 "Ніщо не готує людину до війни, але наші бойові інструктори запевняють, що вони можуть підійти настільки близько, що лише найзагартованіші новобранці потрапляють туди, де все вирішується."
 marsh:0 "Болото"
 medium_tank_aa_equipment_2_desc:0 "$medium_tank_aa_equipment_desc$"
 medium_tank_flame_equipment_3:0 "Середній вогнеметний танк III"
 mexico.13.desc:0 "[From.GetLeader] погоджується передати нам контроль над колишньою колонією Британський Гондурас як жест доброї волі. Це маленька і нерозвинена держава без природних ресурсів (крім деревини), але вона поліпшить становище Мексики на міжнародній арені."
 mexico.15.title:0 "Помер архієпископ Паскуаль Діас"
 mexico.17.c:0 "Він організаційний геній, запросіть його в уряд."
 mexico.18.a:0 "Ця конституційна реформа необхідна для стабільності в країні."
 mexico.2.title:0 "[From.GetAdjective]а нафта націоналізована"
 mexico.20.desc:0 "Правий бізнесмен і революційний генерал Хуан Андреу Альмасан засудив результати нещодавніх виборів. Він стверджує, що його підтримка була більшою і що [Root.GetLeader] переміг лише завдяки фальсифікації. Хоча це може бути правдою, але Хуан Андреу, безумовно, поводиться як людина, що не вміє програвати. Він пішов у самочинне вигнання в Америку та намагається організувати переворот проти партії [Root.GetRulingPartyLong]. Було б розумно залишатися в хороших відносинах з Америкою."
 mexico.24.desc:0 "Мексиканські нафтові танкери «Potrero del Llano» і «Faja de Oro» потоплені в Карибському морі німецькими підводними човнами, що діють згідно з доктриною «необмеженої підводної війни». Ми маємо повне право нападати на будь-які німецькі судна, по зустрічах у морі.\n\nТакож ми мусимо подумати про вступ до альянсу з Америкою, що бореться проти німців. Це зробить янкі нашими боржниками і покаже світові, що Мексика є впливовим гравцем на міжнародній арені."
 mexico.3.title:0 "[From.GetAdjective]е ембарго"
 mexico.50.title:0 "Постачання мексиканського зброї"
 mexico.51.title:0 "Партія мексиканського зброї зникла"
 mexico.8.desc:0 "Лідер [From.GetLeader] звернувся з проханням вступити до альянсу [Root.GetFactionName]. Невідомо, чи прагне він до взаємного захисту або зовнішньої експансії, але мексиканська нафта — досить ласий шматок."
 midget_submarine:0 "$ship_hull_midget_submarine$"
 military_parade_desc:0 "Демократи, соціалісти, націоналісти та інші згубні плоди освіти докучають [From.GetAdjective]ому уряду. Ми проведемо свої непереможні війська маршем по столиці держави [From.GetNameDef] і покажемо всім [Root.GetAdjective] завист."
