 CHI_local_bomber_production_tt:0 "Виконано фокус §Y$CHI_local_bomber_production$§!"
 CHI_local_fighter_production_desc:0 "Оскільки наші робітники вже знайомі з базовими засадами обслуговування авіації, ми можемо переходити до виробництва всіх компонентів сучасного винищувача."
 CHI_medium_tank_equipment_3:0 "Type 43 Zhōng"
 CHI_mining_commission_desc:0 "Розробка підземних копалин грає найважливішу роль військової промисловості. Ми мусимо контролювати наші розробки, щоби забезпечити заводи необхідними ресурсами."
 CHI_mission_to_the_us:0 "Делегація в США"
 CHI_mission_to_the_us_desc:0 "США вже давно є вірним союзником Китаю. Найімовірніше, саме від американців ми матимемо необхідну підтримку."
 CHI_navy_spooks_desc:0 "Океани навколо Китаю є жвавими центрами торговельної діяльності. Де є торговці, там є чутки. Де є чутки, там є можливості..."
