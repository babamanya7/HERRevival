 SOV_reorganize_the_pc_of_heavy_industry_name_default:0 "Реорганізувати Наркомат важкої промисловості"
 SOV_return_states_to_poland_desc:0 "Як жест доброї волі та щоб продемонструвати, хто головний, ми повинні повернути всю територію на захід від [95.GetCapitalVictoryPointName], на яку претендує [POL.getNameDef], маріонетковому режиму [POL.GetAdjective]."
 SOV_right_opposition_name:0 "Права опозиція"
 SOV_rightful_heir_to_the_empire:0 "$SOV_the_rightful_heir_to_the_empire$"
 SOV_secure_leningrad:0 "Убезпечити [195.GetName]"
 SOV_staggered_retreat_desc:0 "Якщо ми змушені відступити під натиском ворога, ми повинні зробити це організовано, не залишаючи ізольованих підрозділів і не допускаючи, щоб наші війська потрапили в оточення ворога."
