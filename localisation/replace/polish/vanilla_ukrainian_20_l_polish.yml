 china.200.d:0 "Порвавши з Гоміньданом для звільнення нашого народу, тепер ми мусимо об'єднати війська з існуючою Китайською народною республікою, щоб уникнути розколу в нашому русі. Вороги Китаю завжди покладалися на наші міжусобиці для нашого послаблення; нова соціалістична держава не зробить такої помилки!"
