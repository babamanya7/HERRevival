 WW_hungary.1.t:0 "[HUN.GetName] Запускає союзницькі виробничі програми"
 WW_hungary.116.desc:0 "Керівництво [FROM.GetNameDef] публічно заявило, що референдум у [73.GetName] був нелегітимним. Вони стверджують, що явка виборців і міжнародні спостерігачі були явно упереджені на користь [ROOT.GetAdjective] уряду."
 WW_hungary.123.b:0 "Відкрити вогонь, щоб їх налякати"
 WW_hungary.124.a:0 "Негайно дайте цій людині посаду!"
 WW_hungary.19.desc:0 "Дурний [FROM.GetLeader] з [FROM.GetNameDef] відмовився віддати нам нашу законну землю, тож настав час завдати удару по [FROM.GetNameDef] швидко й рішуче. Це безумовно закріпить наші претензії на Західний Банат."
 WW_hungary.29.b:0 "Запровадити ембарго й протест"
 WW_hungary.3.a:0 "Ми повинні спробувати інтегрувати MOVE"
 WW_hungary.40.desc:0 "Підлий [FROM.GetLeader] з [FROM.GetNameDef] відмовився від нашої пропозиції. Ми змушені шукати інші альянси, бо вони не бажають долучатися до нашого."
 WW_hungary.41.a:0 "Ми раді вітати їх"
 WW_hungary.44.b:0 "Відів вигнали недарма!"
 WW_hungary.5.t:0 "[FROM.GetNameDefCap] передає Трансільванію"
 WW_hungary.52.a:0 "Вони зробили правильний вибір"
 WW_hungary.55.t:0 "Австро-Угорщина пропонує 'захист'"
 WW_hungary.60.a:0 "Вони пожалкують про це!"
 WW_hungary.67.a:0 "Вони зробили правильний вибір"
 WW_hungary.91.desc:0 "Уряд [HUN.GetAdjective] звернувся до нас із цікавою пропозицією об’єднати наші дві країни в одну. Вони, звісно, хочуть зробити це на своїх умовах, тобто їхній уряд керуватиме обома державами — але, можливо, це найбезпечніший варіант?"
 WW_hungary.91.t:0 "[FROM.GetNameDefCap] пропонує унію"
