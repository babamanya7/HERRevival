 RAJ_constitution_for_the_masses_desc:0 "Народна республіка не може спиратися на старий імперський закон.\nНова конституція має відображати волю робітників, фермерів та безземельних — а не примхи монархів чи колоніальних губернаторів."
 RAJ_court_the_princes:0 "Залучити князів"
 RAJ_cruiser_effort_dlc:0 "Крейсерська програма"
 RAJ_crush_the_anathema_desc:0 "Комунізм — це анафема для хорошого бізнесу. Гроші рухають світом, а світ, керований комуністами, призвів би до його стагнації. Нам потрібно випалити гниль."
 RAJ_debt_relief_desc:0 "Протягом тривалого часу заможні [ENG.GetAdjective] та [GetRajAdjective]s заманювали простий люд у боргові пастки, до того, що це стало ендемічним. Ми будемо лобіювати місцеві органи влади, щоб надати допомогу цим людям, аби полегшити тягар перебування в несправедливій системі."
 RAJ_east_india_railways_dlc:0 "Східноіндійські залізниці"
 RAJ_establish_the_reserve_bank_of_india_desc:0 "Щоб адекватно захистити нашу економіку від шокових ситуацій, ми створимо резервний банк з повноваженнями контролювати нашу валюту."
 RAJ_focus_on_military_industry:0 "Зосередитися на військовій промисловості"
 RAJ_found_scindia_shipyard_desc:0 "Нам потрібна суднобудівна компанія на східному узбережжі країни. Заклавши верф Скіндіа в місті Вішакхапатнам, ми зміцнимо майбутнє нашого флоту."
 RAJ_frontier_corps_desc:0 "Наша країна складається з кількох біомів, серед яких сувора прикордонна місцевість на сході. Зв'язок із місцевим ополченням та використання їхнього досвіду щодо суворих умов війни було б перевагою для нас."
 RAJ_garden_reach_shipbuilders_organization:0 "$garden_reach_shipbuilders$"
 RAJ_gurkhas:0 "Гуркхи"
 RAJ_handloom_weaving:0 "Ручне ткацтво"
 RAJ_haripura_session_of_the_indian_national_congress_desc:0 "З огляду на те, що капіталізм посилює глобальну напругу, настав час змінити Сварадж на боротьбу за робітників та селян. Друга сесія Харіпура об'єднає нас під революційним баченням, відкидаючи імперіалістичні альянси та приймаючи боротьбу за безкласову, самодостатню Індію."
 RAJ_heavy_tank_equipment_1:0 "Vickers A1E1 «Independent»"
 RAJ_his_majestys_loyal_government:0 "Вірний уряд Його Величності"
 RAJ_his_majestys_loyal_government_break_free_tt:0 "Щоб повністю звільнитися, нам потрібно завершити всі три ключові фокуси §Y$RAJ_the_dominion_of_india$§!, §Y$RAJ_keep_calm_and_carry_on$§! та §Y$RAJ_holding_the_gates_of_india$§!."
 RAJ_imperial_rail_renewal_act_desc:0 "Щоб забезпечити швидке переміщення товарів, військ та припасів по всьому субконтиненту, ми інвестуємо у всебічний перегляд залізничної інфраструктури [ROOT.GetNameDef]. Акт про оновлення імперської залізниці модернізує старі лінії, розширить логістичні потужності та пов'яже наші великі території разом сталістю та паром."
 RAJ_indian_armor:0 "Індійська бронетехніка"
 RAJ_indian_national_army_effect:0 "Прибічники фашистів розв'яжуть громадянську війну за визволення. Масштаб залежить від ступеня підтримки партії та статусу автономії."
 RAJ_indian_peoples_army_effect:0 "Прихильники комуністів розв'яжуть громадянську війну за визволення. Масштаб залежить від ступеня підтримки партії та статусу автономії."
 RAJ_institute_of_fundamental_research:0 "Інститут фундаментальних досліджень"
 RAJ_institute_of_fundamental_research_GOE_desc:0 "За підтримки провідних промисловців та наукових умів ми створимо Інститут фундаментальних досліджень для проведення передових теоретичних досліджень. Інститут слугуватиме ядром передових експериментів, включаючи вивчення атомної енергії."
 RAJ_join_the_co_prospherity_sphere:0 "Приєднатися до Сфери спільного процвітання"
 RAJ_league_against_gandhism_tt_event:0 "Додає додаткові §G+5%§! Підтримки війни через підтримку §Y$RAJ_league_against_gandhism$§!"
 RAJ_legalize_the_opium_trade_desc:0 "Хоча це суперечливо, легалізація опіуму обіцяє величезну економічну вигоду. Регулюючи його торгівлю, ми можемо перетворити ваду на прибутковий наріжний камінь нашої фінансової стратегії."
 RAJ_local_leaders_investments_mils_chance:0 "[?RAJ_local_leaders_mils_chance|%+]"
 RAJ_look_to_the_past_desc:0 "Контроль над цінами успішно пом'якшив один із факторів Великої депресії, але, як наслідок, ці заходи зараз сіють хаос в економіці з інфляцією, що виходить з-під контролю. Відчай призводить до інакомислення, і все більше місцевих лідерів здобувають політичну силу, розпалюючи населення розповідями про минулу велич.\nЧи може те, що було, відродитися знову?"
 RAJ_madras_ship_repair_factories:0 "Фабрики з ремонту кораблів у Мадрасі"
 RAJ_mobilization_of_the_indian_army:0 "Мобілізація Індійської армії"
 RAJ_model_after_germany_desc:0 "Ми можемо наслідувати дисципліновані та ефективні військові доктрини Німеччини, щоб перетворити наші сили на сучасну військову машину."
 RAJ_modernizing_navy:0 "Модернізація флоту"
 RAJ_mughal_breakaway_state_ADJ:0 "Індійськ"
 RAJ_mughal_empire_DEF:0 "Імперія Великих Моголів"
 RAJ_nationalize_tata_group:0 "Націоналізувати Tata Group"
 RAJ_obtain_british_naval_contracts_desc:0 "Ми звернемося до [ENG.GetNameDefCap], щоб забезпечити контракти на будівництво військових кораблів, використовуючи їхню промислову потужність для посилення нашого власного флоту, водночас зміцнюючи стратегічні зв'язки."
 RAJ_planned_economy2:0 "Консолідувати планову економіку"
 RAJ_princely_state_donations_desc:0 "Тубільні князівства давно забезпечують бійцями основну армію Індії, яку контролюють британці. Продовжуючи відправляти новобранців, ці місцеві правителі наочно доводять свою вірність Імперії."
 RAJ_productivity_mandate_desc:0 "Зв'язані нашими зобов'язаннями перед інвесторами, ми змушені максимізувати випуск продукції у всіх секторах. Продуктивність більше не є метою; це мандат, і він має бути досягнутий за будь-яку ціну."
 RAJ_purchase_destroyers_and_subs:0 "Придбати есмінці та підводні човни"
 RAJ_purna_swaraj:0 "Purna Swaraj"
 RAJ_rashtriya_swayamsevak_sangh_desc:0 "Ми організуємо молодь у дисципліновану силу, готову захищати нашу націю та відстоювати цінності Хіндутви за будь-яку ціну."
 RAJ_rebuilding_the_empires_roads:0 "Відбудова доріг Імперії"
 RAJ_reviving_the_workshop_of_the_world:0 "Відродження майстерні світу"
 RAJ_road_to_independence_shortcut:0 "Дорога до незалежності"
 RAJ_royal_indian_air_force:0 "Королівські індійські ВПС"
 RAJ_smiling_buddah_desc:0 "Проєкт «Усміхнений Будда» знаменує вступ Індії у сферу ядерного потенціалу. Опанувавши цю технологію, ми стверджуємо нашу незалежність на світовій арені та забезпечуємо потужний засіб стримування для захисту нашого суверенітету."
 RAJ_standardized_rations_desc:0 "Ефективність та послідовність є ключем до сильної армії. Запровадивши стандартизовані пайки, ми спрощуємо логістику, зменшуємо витрати та забезпечуємо, щоб кожен солдат отримував однакове харчування, плекаючи єдність та дисципліну по всіх лавах."
 RAJ_support_weapons3:0 "Bren Mk I & ML 3 inch mortar"
 RAJ_tenancy_reforms_desc:0 "Заможні негідники монополізують ринок житла, підвищуючи ціни та знижуючи рівень життя, водночас обманюючи простих людей. Конгрес рішуче лобіюватиме реформи оренди, встановлюючи обмеження на те, скільки орендодавець може стягувати за житло."
 RAJ_the_jewel_becomes_the_crown:0 "Перлина стає Короною"
 RAJ_the_red_curtain_falls_over_asia:0 "Червона завіса опускається над Азією"
 RAJ_timurid_empire_fascism:0 "Тімурідський союз"
 RAR_neutrality:0 "Велике герцогство Аравійське"
