 ALERT_ENEMY_CRYPTO_IS_BROKEN_TOOLTIP:0 "Ви успішно зламали шифри ось цих країн:"
 ALG_communism:0 "Алжирська комуна"
 ANG_democratic_DEF:0 "Республіка Ангола"
 ARG_2_fedint_decision_done:0 "Ужито 2 заходи федерального втручання"
 ARG_a_new_trading_partner_desc:0 "Договір Роки–Рансимена діє з 1933 року, забезпечуючи наш експорт яловичини з [ENG.GetName]. Однак, з огляду на недавній розвиток подій у всьому світі, було б розумно розірвати цей договір та укласти більш вигідний з нашими новими союзниками."
 ARG_battleship_1_desc:0 "The Rivadavia-class was a pair of U.S.-built dreadnought battleships built for the Argentine navy in the early 1910s. They displaced 27,500 tons and were armed with twelve 305mm/50 call cannon as their main guns. They remained in service until the 1950s."
 ARG_corporatism:0 "Корпоратизм"
 ARG_crack_down_on_corruption:0 "Покінчити з корупцією"
 ARG_independent_socialist_communism_DEF:0 "Південноамериканські соціалістичні республіки"
 ARG_invite_ghioldi_back_tt:0 "§YРодольфо Гйольді§! повернеться до [ARG.GetFlag]§Y[ARG.GetNameDef]§! і стане доступним як §YРадник§!. Як головний гравець в аргентинському комунізмі, він зможе очолити будь-яку майбутню §YРеволюцію§!."
 ARG_political_events.1.b:0 "Ми не можемо дозволити їм уникнути покарання!"
 ARG_political_events.11.t:0 "Військове повстання неминуче"
 ARG_political_events.17.desc:0 "Уряд [PAR.GetAdjective] вирішив відмовитися від умов, які ми висунули. Ми можемо або відступити і залишити це, або підготувати наші війська до війни."
 ARG_political_events.18.t:0 "[ARG.GetNameDefCap] відступає"
 ARG_political_events.2.b:0 "Ми поки що не хочемо розривати зв'язки."
 ARG_political_events.29.t:0 "[CHL.GetNameDefCap] відмовляється від умов ультиматуму"
 ARG_political_events.52.t:0 "Масовий страйк робітників у [FROM.FROM.GetName]"
 ARG_political_events.7.desc:0 "Незважаючи на наші зусилля переконати [FROM.GetAdjective], що острови повинні належати [ARG.GetName], їхній уряд запропонував передати землю в обмін на оплату. Це було б незначним ударом по нашій економіці, але володіння цією територією принесе нам більше користі в довгостроковій перспективі."
 ARG_political_events.74.desc:0 "Ми щойно отримали відповідь від [FROM.GetNameDef]. Вітаючи наші останні зусилля змінити нашу країну та повернутися до демократії, вони вирішили погодитися на наші запити. Завдяки цьому країна зміцнилася, і ймовірність оголошення нам війни має значно зменшитися."
 ARG_political_events.80.t:0 "Посилені освітні гранти"
 ARG_political_events.81.desc:0 "Коли ми відкрили наш новітній освітній грант, нас зустріли гучні похвали від науковців по всій країні. Оскільки ми вирішили зосередитися на навчанні людей чудесам електронних технологій, ми можемо очікувати стійкого буму прогресу в наших дослідницьких відділах."
 ARG_release_hellmuth:0 "Звільнити Гельмута"
 ARG_russian_manufacturers_desc:0 "Щоб підвищити нашу промислову майстерність та виділитися серед інших націй на континенті, ми повинні звернутися до [SOU.GetNameDef] та запросити низку їхніх виробників до [ARG.GetNameDef]. Зрештою, ми поділяємо ідеологію, тому логічно поділитися і військовими технологіями."
 ARG_sanction_the_generals:0 "Санкціонувати генералів"
 ARG_sanction_the_generals_tt:0 "Збільшує час до здійснення спроби державного перевороту, що дозволяє військовим лідерам повстанців провести менше підготовчих заходів заздалегідь."
 ARG_ship_secondaries_1:0 "152mm/50 Bethlehem"
 ARG_soviet_argentine_relations_idea_desc:0 "There has been an alignment of interests between [SOV.GetNameDef] and [ARG.GetNameDef]."
 ARG_support_the_spanish_republicans:0 "Підтримати іспанських республіканців"
 ARG_unite_the_workers_decisions:0 "Об'єднати робітників"
 ARG_us_army_training:0 "Навчання армії США"
 ARG_women_in_industry_desc:0 "Надто довго від жінок очікували, що вони залишатимуться вдома та піклуватимуться про сім'ю. Якщо жінка може бути лідером нашої країни, то справедливо дозволити їм працювати і в інших галузях промисловості. Це лише допоможе економічному майбутньому [ARG.GetNameDef], оскільки значно розширить нашу робочу силу."
 ARMY_NAVIES_BUTTON:0 "§GКлацніть§!, щоб обрати.\n§GКлацніть§!, утримуючи §HShift§!, щоб обрати кілька оперативних груп.\n§GКлацніть ПКМ§!, щоби перейти до оперативної групи (або порту)."
 ARMY_SORT_GROUP:0 "Армія"
 AST_anzac_spirit_desc:0 "Австралійський та новозеландський армійський корпус здобули грізну репутацію під час Великої війни, витративши багато зусиль і крові заради перемоги Імперії. Їхні якості були очевидні всім: витривалість, мужність, винахідливість і гарне почуття гумору — у поєднанні з недбалою непокорою перед лицем небезпеки та труднощів."
 AST_armored_car_equipment_1:0 "Daimler Dingo"
 AST_australia_first_party_focus:0 "Партія «Австралія понад усе»"
 AST_autarky_desc:0 "Покладання на зовнішню торгівлю є непевним, особливо в часи конфлікту; австралійська промисловість повинна бути пріоритетною, а не витіснятися імпортом. Лише обмежуючи наші торговельні закони, ми зможемо захистити вітчизняну економіку і гарантувати, що Австралія зможе забезпечити саму себе."
 AST_battle_cruiser_2:0 "Клас «Princess Royal»"
 AST_bound_once_more_desc:0 "Наші шляхи розійшлися, але зійдуться знову. [ENG.GetNameDefCap] та [AST.GetName] переживають зміни, але відстань між нами, до якої це призвело, є лише ненавмисним і несприятливим наслідком. Принаймні з нашого боку. Ми об'єднаємося знову і подолаємо перешкоди наших мінливих країн разом."
 AST_bwc_count_3:0 "Укотре [AST.GetLeader] просять перетнути океан, щоб підтримати співпрацю Співдружності. Однак, не варто очікувати багато таких запитів, доки ми чітко не визначимо, чи наші інтереси також пов'язані зі спільними зусиллями, чи з турботою про власні справи.\n\n"
 AST_cabinet_trust_increase_tt:0 "\n§GЗбільшити§! §YДовіру до Кабінету§!\n"
 AST_canberra_air_disaster_events.5.t:0 "Австралійські звинувачення"
 AST_claim_french_indochina:0 "Висунути претензії на Французький Індокитай"
 AST_covert_networks_desc:0 "Оскільки «Австралія понад усе» діє всередині Слідчого відділу, ми шукатимемо транскордонної співпраці з рухом однодумців у [ENG.GetNameDef]. Наш альянс з нашою метрополією може послужити нам ще в один спосіб, дозволяючи таємно зв'язуватися з ідеологічно близькими союзниками і розширювати наші розвідувальні можливості."
 AST_demand_new_zealand:0 "Вимогти Нову Зеландію"
 AST_diplomatic_events.2.a:0 "Принаймні, це була благородна спроба."
 AST_diplomatic_events.22.desc:0 "Протягом минулого року прем'єр-міністр Австралії регулярно відвідував Британський воєнний кабінет. Хоча самій [AST.GetNameDef] іноді доводилося платити за це ціну, наша нація тепер стала сильнішою завдяки військовій співпраці з Британією."
 AST_diplomatic_events.31.desc:0 "Агресори-експансіоністи дивляться на Індокитай не лише заради самої території, а й заради ресурсів, якими він володіє. Якщо багатства потраплять у ворожі руки, вони лише затягнуть війну, тоді як в австралійських руках вони могли б допомогти її закінчити; принаймні, так стверджує уряд Австралії.\n\n[ROOT.OVERLORD.GetNameDefCap] погодилася на цей запит."
 AST_diplomatic_events.35.a:0 "Все вирішено!"
 AST_diplomatic_events.37.a:0 "Очевидно, ми не маємо права голосу в цьому питанні."
 AST_diplomatic_events.45.a:0 "Так, може."
 AST_diplomatic_events.50.t:0 "Австралійський тихоокеанський гарнізон"
 AST_diplomatic_events.65.desc:0 "Зростаючий вплив [FROM.GetCommunistParty] у [FROM.GetNameDef] тепер приносить свої плоди: її представники перетнули Китай, щоб повідомити нас про формування [FROM.GetAdjective] добровольчих сил, які мобілізуються для підтримки наших військ. Крім того, ці добровольці привозять запасне спорядження, щоб допомогти оснастити наші власні сили."
 AST_diplomatic_events.68.a:0 "Як все змінилося."
 AST_diplomatic_events.69.t:0 "Знову пов'язані"
 AST_diplomatic_events.7.b:0 "Ми не можемо."
 AST_dividing_the_pacific_tt1:0 "§GМи отримуємо§!:"
 AST_dominate_the_skies:0 "Панування в небесах"
 AST_election_events.2.a:0 "ОАП запровадить свої останні реформи."
 AST_equal_training_desc:0 "Співпраця із союзниками має вдосконалюватися, а не просто сліпо вважатися дієвою. Австралія візьме на себе ініціативу з організації спільних тренувальних таборів для країн альянсу [ROOT.GetFactionName] та забезпечить, щоб усі солдати отримували однаково сувору підготовку."
 AST_expanding_into_new_markets_desc:0 "Перевага покладання на зовнішні ринки замість внутрішнього проста. Світовий ринок величезний. Завжди будуть нові ринки для освоєння; нам просто потрібно знайти свою перевагу і продемонструвати перевагу австралійських товарів і методів ведення бізнесу."
 AST_form_australasia:0 "Сформувати Австралазію"
 AST_free_healthcare_policy:0 "Політика безкоштовної медицини"
 AST_heavy_fighter_equipment_2:0 "Bristol Beaufighter"
 AST_infantry_at2:0 "PIAT"
 AST_james_scullin_votes:0 "\n $AST_james_scullin$: §G+0.01§!"
 AST_lang_plan:0 "План Ланга"
 AST_light_cruiser_4:0 "Клас «Minotaur»"
 AST_light_tank_destroyer_equipment_3_short:0 "Crusader II TD"
 AST_make_a_common_enemy:0 "Створити спільного ворога"
 AST_medium_tank_aa_equipment_2:0 "AC I Sentinel Anti-Air"
 AST_mio_trait_mosquito_local_production:0 "Місцеве виробництво «Mosquito»"
 AST_our_own_empire:0 "Наша власна імперія"
 AST_part_with_colonizer_desc:0 "Корінь нашої боротьби лежить у Британській імперії та капіталістичній системі, яку вона нав'язала здалеку. Більше цього не буде. Оскільки Британія відволікається на кризи ближче до дому, зараз настав час взяти свою долю у свої руки і прокласти власний курс як вільна та незалежна нація."
 AST_print_the_publicist_desc:0 "«The Publicist», інформаційний бюлетень руху «Передусім Австралія», відіграє важливу роль в охопленні потенційних прихильників. Випустивши ще один номер, ми можемо поширити наше повідомлення."
 AST_public_meetings_tt:0 "Розблоковує рішення §YРуху «Австралія понад усе»§! для мобілізації членів та підвищення підтримки фашизму."
 AST_public_works:0 "Громадські роботи"
 AST_push_foreign_overlord_out_of_target:0 "Витіснити [?FROM.AST_communist_civil_war_enemy_country.GetName] з [FROM.GetName]"
 AST_ratify_westminster_adoption_act_tt:0 "£GFX_trigger_yes Може відхилити заклик до війни"
 AST_research_city_excursions_desc:0 "У Радянському Союзі збудували безліч наукових містечок та дослідницьких лабораторій. Австралійських учених запросили до СРСР, щоб вони особисто ознайомилися із досягненнями комуністичної науки."
 AST_rile_up_veterans:0 "Збурити ветеранів"
 AST_smuggle_arms_to_ireland_ongoing_flag:0 "Контрабанда зброї §YТриває§!"
 AST_stretch_the_fleet:0 "Розширити флот"
 AST_the_pacific_garrison:0 "Тихоокеанський гарнізон"
 AST_the_threat_against_the_people_desc:0 "Войовничий фашизм імперської Японії становить небезпеку всім австралійців і порушує мирне співіснування пролетарів всіх країн. Австралія змусить цих ворогів народу відступити та повернутися на свої похмурі кам'янисті острови."
 AST_union_control_events.1.t:0 "Іноземні агенти в наших профспілках"
 AST_union_control_events.2.b:0 "Тривожний розвиток подій."
 AST_union_control_events.3.t:0 "Вибухає революція в [MAL.GetNonIdeologyName]"
 AST_volunteer_air_observers_corps_desc:0 "Дивіться за небом! Ми закликаємо всіх австралійців запам'ятати обриси найпоширеніших літаків та повідомляти про всі підозрілі та ворожі літаки на кордоні домініону."
 AST_westward_battles_desc:0 "Фашистські сили домінують на заході, загрожуючи самій основі нашого виживання. Тепер, бувши в союзі з Комінтерном, ми повинні перенести боротьбу на них і виступити проти тих, хто хотів би знищити робітничу утопію, яку ми будуємо."
 AST_yeramba:0 "Yeramba"
 ASY_neo_assyrian_empire_fascism_ADJ:0 "Новоассирійськ"
 ATTACHED_AIR_WING_DESC:0 "§HПрикріплене авіакрило§!"
 AUS_aerial_strategies:0 "Повітряні стратегії"
 AUS_alpine_federation:0 "Альпійська федерація"
 AUS_anschluss_ratio_ticking_down_monarchist:0 "§YЗагальна Боєздатність Армії§!, необхідна для початку фокусу §YАншлюс§! буде понижатися щотижня. Її остаточний рівень відповідатиме рівню популярності §YФашизму§! в державі §Y[AUS.GetNameWithFlag]§!."
 AUS_at_the_ready:0 "Завжди напоготові"
 AUS_autobahn_south:0 "Розширити автобани на південь"
 AUS_bring_back_the_habsburg_rule_tt:0 "Якщо ваш нинішній регент §YОтто фон Габсбург§! або §YЕрнст Рюдігер Штаремберг§!, один з них буде коронований ерцгерцогом Австрії та отримає наступну рису:\n\n §YЕрцгерцог Австрії§!:\n  - Приріст політичної влади: §G+10%§!\n  - Військовозабов'язане населення: §Y0.50%§!\n  - Стабільність: §G+5%§!\n  - Підтримка Війни: §G+5%§!\n  - Щоденна підтримка нейтралітету: §G+0.03§!"
 AUS_demand_liberation_of_workers_decision:0 "Вимагати звільнення робітників в [FROM.GetNameDef]"
 AUS_demand_part_of_spanish_winnings:0 "Запросити частину іспанських трофеїв"
 AUS_establish_bohme_plan:0 "Дотримуватись плану Франца Беме"
 AUS_establish_rote_hilfe_desc:0 "Австрійська «Роте Хільфе» (Österreichische Rote Hilfe) була заснована та очолена Мальке Шорр у 1925 році. Відтоді й до заборони корумпованою австрофашистським урядом, організація допомагала незліченній кількості політичних біженців та шукачів притулку в Австрії. Тепер, коли наш старий режим пішов в небуття, настав час дозволити їм знову діяти."
 AUS_evidenzbureau:0 "Evidenzbureau"
 AUS_fortify_the_traun_line:0 "Фортифікація лінії Траун"
 AUS_fortify_the_traun_line_available_tt:0 "Хоча б одна провінція в регіонах §Y[152.GetName]§! або §Y[4.GetName]§! на кордоні з державою §Y[GER.GetNameWithFlag]§! має місце для будівництва §YТрьох§! або більше §YНаземних укріплень§!"
 AUS_grossosterreich_neutrality_DEF:0 "Велика Австрійська імперія"
 AUS_heavy_specialization_desc:0 "Можна з упевненістю припустити, інші очікують, що ми матимемо повітряні сили, які складатимуться переважно з менших літаків. Важка авіація може здатися незручною і марною в застосуванні, але, правильно інвестувавши в неї, ми могли б перемогти більшість ворогів саме завдяки ній."
 AUS_improve_army_logistics_desc:0 "Наша країна багата прекрасними пейзажами, але, на жаль, це також означає, що вона багата непрохідною місцевістю та логістичними проблемами. Якщо ми не знайдемо, як вирішити це, ми ризикуватимемо, що наші можливі зусилля під час війни виявляться гіршими, ніж могли б бути."
 AUS_integration_target_is_poland_key:0 "Сьогоднішній ранок для нашої країни почався з жорсткого повідомлення від [FROM.GetAdjective]ого уряду. Вони вимагають, щоб ми передали їм [Get37PuppetOrNotDesc] і попередили нас про можливі наслідки, якщо ми спробуємо чинити опір.\n\nЦей акт агресії з боку Австрії не був зовсім неочікуваним після низки подібних вимог до інших країн поблизу них."
 AUS_invest_in_alpen_elektrowerke_desc:0 "Щоб залишатися конкурентоспроможними на міжнародному ринку, нам постійно потрібно впроваджувати інновації та впроваджувати нові рішення. Інвестування в таку компанію, як Alpen-Elektrowerke, яка значною мірою спеціалізується на розробці електроніки, може дати нам саме ту перевагу, яка нам потрібна."
 AUS_invite_the_entente:0 "Запросити Малу Антанту"
 AUS_naval_efficiency:0 "[ROOT.GetAdjective] військово-морська ефективність"
 AUS_nazism:0 "Німецько-соціальна Австрія"
 AUS_news_events.7.a:0 "Довгих років принцу Габсбургу!"
 AUS_news_events.7.b:0 "Нам вартувало підкреслити це в договорі!"
 AUS_osterreichische_saurerwerke_organization:0 "Österreichische Sauerwerke"
 AUS_political_events.113.desc:0 "Як виявляється, [FROM.GetAdjective]е керівництво не знайшли нашу пропозицію достатньо задовольняючу для них. Або вони прозріли наші плани на майбутнє, або самі мають злі плани щодо нас. Ми повинні підготуватися до такого випадку, і, якщо ми хочемо продовжувати наші плани, нам можуть знадобитися більш агресивні дії."
 AUS_political_events.118.a:0 "Їм доведеться до нас приєднатися."
 AUS_political_events.17.a:0 "Ким вони себе уявляють?"
 AUS_political_events.19.desc:0 "Наш найуспішніший ас-винищувач часів Великої війни звернувся до нас і знову запропонував нам свою службу, оскільки ми опинились у війні. Хоча він уже не молодий і не вміє літати, як міг би раніше, адже в 1936-ому році був майже не покинув цей світ, що має свої наслідки, він все одно запропонував вести наші повітряні сили до перемоги... з землі. Наші нинішні пілоти все ще ставляться до нього з великою повагою, і існує поширена думка, що він ще зможе вивчити наших авіаторів до величі, якої міг би позаздрити навіть він сам."
 AUS_political_events.21.desc:0 "Відповідно до Сен-Жерменського договору, [FROM.GetNameDef] погоджєуться гарантувати нашу незалежність. Для хорошої міри вони також виділяють нам кошти на придбання деякого обладнання, оскільки ми зараз не в змозі виробляти обладнання самостійно."
 AUS_political_events.24.desc:0 "Використовуючи безліч крайніх випадків, дрібних шрифтів і незрозумілих пунктів у Сен-Жерменському Договорі, [FROM.GetNameDef] та їх політики якимось чином викрутилися, відмовившись підтримати нас. У газетах чітко сказано, що ми отримаємо зовнішню допомогу в обмін на те, що нам не дозволять мати пристойну армію, але, як виявилося, [FROM.GetNameDef] вважає, що це їх не стосується. Нам доведеться обходитися своїми силами."
 AUS_political_events.24.t:0 "[FROM.GetNameDefCap] відхиляє наш запит на підтримку"
 AUS_political_events.32.desc:0 "Наш запит про компенсацію був почутий [FROM.GetAdjective]ими націоналістами, і, як спосіб подяки, вони позичили нам робітників і матеріали для будівництва нового заводу в Нідерьостеррайх. Це дозволить нам замінити втрачене обладнання та стане найбільш корисним у майбутньому."
 AUS_political_events.40.a:0 "Ми раді бачити їх з нами нас."
 AUS_political_events.40.t:0 "[FROM.GetNameDefCap] хоче приєднатися до нашого альянсу"
 AUS_political_events.60.a_tt:0 "§YФранц Беме§! §GСтане Доступний§! в якості §YГоловнокомандувача Армії§!.\n\n§YАльфред Янса§! §RНазавжди буде Заблокується§! в якості §YГоловнокомандувача Армії§!."
 AUS_political_events.85.a_tt:0 "Відмикає рішення §YВимогти звільнення робітників§!, як тільки однойменний фокус буде завершено"
 AUS_political_events.91.a:0 "Вперед, наш ерцгерцог! Ми знайдемо, кому зігріти ваше місце."
 AUS_political_events.92.t:0 "[FROM.GetNameDefCap] пропонує придбати Аляску"
 AUS_political_events.96.t:0 "[FROM.GetNameDefCap] прагне приєднатися до [ROOT.GetFactionName]"
 AUS_reclaim_habsburg:0 "Повернути Габсбург"
 AUS_revolution_tt:0 "Якщо ми заручились §Yпідтримкою ополчення§!, ми отримаємо 3 додаткові §Yдивізій Шуцбунду§! по початку громадянської війни."
 AUS_royal_scientific_grants_desc:0 "Наші інвестиції в Австрійську Академію Наук виявились дуже корисними як для нас, так і для самої академії. Зараз ми обмірковуємо, чи варто вивести це партнерство на наступний рівень. Багато талановитих науковців зараз працюють в академії. Якщо переконати їх до співпраці, ми зможемо залучити їх до роботи над нашими власними проєктами."
 AUS_seek_soviet_support:0 "Запросити радянської підтримки"
 AUS_sent_market_subsidies_flag:0 "Вже відправив [FROM.GetNameDef] зброю"
 AUS_suddeutschland_fascism:0 "Південна Німеччина"
 AUS_tighten_control_of_subjects_tt2:0 "Відкриває сукупність рішень для §YВстановлення Габсбургської монархії§! в державах §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! і §Y[POL.GetNameWithFlag]§! як тільки ми їх підпорядкуємо."
 AUS_wienfilm_propaganda_effort_desc:0 "Коли у світі вирує війна, нам необхідно тримати свою націю під контролем. Останнім часом ми бачимо, як країни використовують свою кіноіндустрію для підняття бойового духу своїх людей. Оскільки у нас є власний Wien-Film, чому б його не використати?"
 AZR_communism_ADJ:0 "Азербайджанськ"
 AZR_fascism_DEF:0 "Імперія Вогню"
 BAH_DEF:0 "Багами"
 BALTIC_concessions_for_catholics:0 "Поступки католикам"
 BALTIC_events.1.a:0 "Ми захистимо наших [From.GetAdjective] друзів."
 BALTIC_events.2.d_baltic:0 "[From.GetLeader] та [From.GetHerHis] кабінет звернулися до [Root.GetAdjective] уряду з пропозицією перетворити слабоорганізовану Балтійську Антанту на військовий союз. Укладання договору означатиме, що у разі війни наші армії разом виступлять проти того, хто загрожує нашому суверенітету.\n\n[From.GetLeader] за своєю природою вважає за краще оборонятися, а не нападати, але сподівається з часом розширити Балтійську Антанту на територію від Риги до Осло, хоча це навряд чи здійснимо на практиці."
 BALTIC_events.3.b:0 "Пролетаріат може звільнитися лише самостійно."
 BALTIC_events_16_tt:0 "Станеться подія §Y[Root.GetNameDefCap] просить про вторгнення в Латвію§!."
 BALTIC_events_9_tt:0 "Станеться подія §Y[Root.GetNameDefCap] просить про вторгнення у Швецію§!."
 BALTIC_forest_brother_resistance_cat_desc:0 "Соціалізм не всі прийняли в нашій країні, і ніхто не висловлює свою огиду до нової [Root.GetAdjective]ої держави так гучно й активно, як Лісові брати. Затяті прихильники [Root.GetAdjective]ого націоналізму, Лісові брати відкидають будь-який іноземний вплив у державі [Root.GetNonIdeologyName] та прагнуть усунути комуністичну партію від влади на користь більш націоналістичного уряду."
 BALTIC_request_german_support:0 "Попросити підтримку ([GetBalticAxisInvesmentsAdj])"
 BAL_UNIFIED_democratic_DEF:0 "Балтійська федерація"
 BAN_democratic:0 "Бангладеш"
 BAN_fascism_DEF:0 "Бенгальська держава"
 BAR_neutrality_DEF:0 "Королівство Баротселенд"
 BATALION_CAN_BE_PARCHUTED:0 "Цей батальйон §GМОЖЕ§! десантуватися."
 BBA_african_union_events.14.a:0 "Маємо погодитись не погоджуватись."
 BBA_african_union_events.17.a:0 "Чудова новина."
 BBA_african_union_events.19.desc:0 "[FROM.GetName] погодилися виконати свої оборонні зобов'язання як підписанти угоди про взаємну оборону Організації Африканської Єдності."
 BBA_african_union_events.23.desc:0 "Керівництво [FROM.GetNameDef] доклало зусиль, аби зняти наші побоювання щодо узгодженості політики в рамках Організації Африканської Єдності. Вони навіть пообіцяли консультуватися з нашими послами перед прийняттям будь-яких різких рішень у майбутньому."
 BBA_ethiopia_balance_of_power_events.53.desc:0 "Один із владик у області [?ROOT.ETH_bop_state.GetName] просить підтримки для налагодження місцевого виробництва гвинтівок та боєприпасів у області [?ROOT.ETH_bop_state.GetName]. Це могло б допомогти нашим збройним силам отримати краще спорядження та поліпшити бойові можливості [ROOT.GetAdjective]ої армії."
 BBA_ethiopia_communist_events.37.a:0 "Тоді ми звільнимо їх силою."
 BBA_ethiopia_communist_events.40.a:0 "У нас немає вибору."
 BBA_ethiopia_communist_events.56.t:0 "[JAP.GetAdjective] добровольці прямують до Східної Африки"
 BBA_ethiopia_exile_events.12.t:0 "Частковий успіх"
 BBA_ethiopia_exile_events.53.a:0 "Це того варте!"
 BBA_ethiopia_exile_events.58.t:0 "Доставлено партію зброї"
 BBA_ethiopia_exile_events.60.t:0 "Поставка танків"
 BBA_ethiopia_fascist_events.53.b:0 "Артилерія стримає наших ворогів."
 BBA_ethiopia_fascist_events.56.t:0 "[ITA.GetName] погоджується надіслати військове оснащення"
 BBA_ethiopia_fascist_events.71.t:0 "[FROM.GetName] відмовляється надсилати офіцерів"
 BBA_ethiopia_imperial_events.9.desc:0 "На жаль, держава [FROM.GetNameDef] відмовилася від люб'язної пропозиції стати суб'єктом імператора [ROOT.GetLeader]. Незважаючи на всі наші зусилля, ми не змогли переконати [FROM.GetAdjective]ий уряд, що це дійсно піде на користь обом сторонам."
 BBA_ethiopia_industrial_financial_events.4.a:0 "Це точно можна влаштувати."
 BBA_italo_ethiopian_war_events.101.a:0 "На одну проблему менше"
 BBA_italo_ethiopian_war_events.12.a:0 "Нікому не можна довіряти, правда ж?"
 BBA_italo_ethiopian_war_events.202.desc:0 "Поступово почало просочуватися як деякі нерегулярні підрозділи нашого ворога почали втрачати віру, а деякі з них перейшли на нашу сторону. Тепер солдати масово дезертирують, і не тільки нерегулярні. Деякі з дезертирів навіть везуть із собою важку техніку."
 BBA_italo_ethiopian_war_events.403.a:0 "Доведеться йти важким шляхом."
 BBA_italy_air_accident.01.desc:0 "Фельдмаршал Італо Бальбо був збитий дружнім вогнем у небі над Лівією. Помилкова ідентифікація призвела до того, що зенітні батареї відкрили вогонь і збили його літак з неба. Генерал Джузеппе Теллера, який летів іншим літаком, вижив, але був вражений пережитим."
 BBA_italy_air_accident.02.desc:0 "Після помилкової ідентифікації літак фельдмаршала Італо Бальбо потрапив під дружній вогонь зенітних батарей у небі над Лівією. На щастя, він залишився неушкодженим, але його начальнику штабу, генералу Джузеппе Теллера, не пощастило, і він був збитий і загинув. Розлючений Бальбо досить жорстко покарав усю роту, включно з офіцерами."
 BBA_italy_air_accident.12.t:0 "Авіакатастрофа"
 BBA_italy_civil_war_monarchist_tt:0 "Ми станемо §Y$RDS_RU_Inst$§!, повсталою стороною у громадянській війні проти §Yнейтральної§! ідеології. [GetRdsOverlord]"
 BBA_italy_communist_events.03.a:0 "Разом нас не перемогти!"
 BBA_italy_communist_events.06.a:0 "Будемо триматися разом!"
 BBA_italy_decide_the_fate_of_mussolini.1.desc:0 "Розібравшись із внутрішньою боротьбою за владу і зміцнивши нашу владу над Націонал-фашистською партією, ми можемо нарешті звернути увагу на старого дуче — Муссоліні. Його постійна присутність підриває наші позиції, і з цим потрібно боротися."
 BBA_italy_human_torpedo_raid.1.a:0 "На превеликий жаль."
 BBA_italy_interaction_events.1.desc:0 "Абсолютно несподіваним і обурливим кроком італійський лідер [ITA.GetLeader] осквернив наш багаторічний нейтралітет, висунувши нам ультиматум. Протягом двох тижнів ми повинні передати регіон [846.GetName] італійцям, інакше на нас чекає війна. Як ми повинні відповісти?"
 BBA_italy_interaction_events.30.a:0 "Звучить чудово!"
 BBA_italy_interaction_events.30.t:0 "Італія пропонує регіон [45.GetName] в обмін на взаємні гарантії"
 BBA_italy_interaction_events.35.a:0 "У них є кращі способи його використання."
 BBA_italy_interaction_events.36.t:0 "[ITA.GetName] хоче обговорити свої претензії на Балкани"
 BBA_italy_interaction_events.40.desc:0 "Тепер, коли рішення про територіальні поступки прийнято, [ITA.GetName] ініціювала процес, який об'єднає Італію та Францію у військовий альянс під назвою Фронт Стрези. Зараз не час сидіти склавши руки, адже Франція повинна діяти у власних інтересах і приєднатися до Італії проти німецької загрози."
 BBA_italy_interaction_events.50.desc:0 "Італійський уряд звернувся до нас з цікавою пропозицією. Вони кажуть, що хочуть ратифікувати Фронт Стрези, забезпечивши свою підтримку нашій стороні у випадку, якщо в Європі спалахне війна. Однак вони вимагають територіальних поступок — наразі це [269.GetName] та [903.GetName] — і вони перебувають у стані війни з [ETH.GetName], чий уряд ми приймаємо у себе. Вони принаймні тимчасово платитимуть нам, якщо ми погодимося."
 BBA_italy_interaction_events.8.b:0 "За кого вони себе мають?"
 BBA_italy_missiolinis.04_south.t:0 "Південний фронт стоїть"
 BBA_italy_missiolinis.103.t:0 "Албанію окуповано"
 BBA_italy_missiolinis.133.t:0 "Успішне звільнення Тічіно"
 BBA_italy_missiolinis.32.desc:0 "Дуче вважає відсутність прогресу розбудови промислового потенціалу держави тривожним. Він скаржиться на обмеження, які — не з власної вини — сковують його, що робить втілення в життя його бачення процвітаючої Італії значно складнішим."
 BBA_italy_missiolinis.71.a:0 "Aeronautica — наша гордість."
 BBA_italy_naval_cooperation_programs.17.desc:0 "[FROM.GetAdjective] карликові підводні човни нарешті прибули, щоб посилити наш морський потенціал! Вони, безсумнівно, стануть чудовим доповненням до нашого флоту, і ми знайдемо їм хороше застосування."
 BBA_italy_pact.1.b:0 "Ми не можемо їм довіряти!"
 BBA_italy_recognize_the_empire.1.b:0 "Ігнорувати проголошення."
 BBA_italy_second_italo_ethiopian_war.2.desc:0 "Наша щедра пропозиція миру була прийнята абіссінцями. Це далеко не та славетна перемога, яку ми уявляли собі на початку війни, але, можливо, ми можемо втішитися тим, що війна скінчилася. Ми подолаємо це приниження, як ми робили це багато разів раніше, і ми піднімемося — сильніші, ніж будь-коли!"
 BBA_italy_second_italo_ethiopian_war.3.t:0 "[FROM.GetName] відхиляє [ROOT.GetAdjective]у пропозицію миру"
 BBA_swiss_expansion.13.t:0 "[FROM.GetNameDefCap] Приймає наші вимоги!"
 BBA_swiss_expansion.3.desc:0 "Ці нібито нейтральні пройдисвіти з [FROM.GetName] насмілилися заявити, що [?SWI.SWI_state_being_claimed.GetName] — це їхня земля. Вони стверджують, що підтримка приєднання до [FROM.GetNameDef] настільки висока, що референдум точно буде на їхню користь, роблячи цей штат нібито «справедливо їхнім».\n\nМи можемо дозволити референдум, який ми, безумовно, програємо, або ризикувати війною, якщо відмовимо."
 BBA_switzerland.11.b:0 "Ми цього не забудемо!"
 BBA_switzerland.14.b:0 "У них є слушні думки"
 BBA_switzerland.3.t:0 "Суд над Давідом Франкфуртером наближається"
 BBA_switzerland.9.t:0 "[SWI.GetName] викликає наш гнів!"
 BBA_switzerland_fascist.6.b:0 "$BBA_switzerland_fascist.3.b$"
 BBA_switzerland_trade.11.t:0 "Ми можемо розширити торгівлю золотом через [FROM.GetAdjective] біржі"
 BBA_switzerland_trade.15.t:0 "[FROM.GetNameDefCap] відмовляється інвестувати"
 BEL_belgian_tank_development:0 "Розвиток бельгійських танків"
 BEL_boelwerf:0 "Булверф"
 BEL_currently_taking_eu_decision_flag:0 "Зараз приймається інше рішення ЄС"
 BEL_flanders_communism:0 "Соціалістична народна республіка Фландрія"
 BEL_force_congolese_capitulation_decision:0 "Форсувати капітуляцію держави Конго"
 BEL_fortify_liege_bypass_tt:0 "У жодній з провінцій §Y[34.GetName]§!, що межує з річкою Мьоз, немає місця для будівництва 1 §Y$bunker$§!"
 BEL_gold_reserves_cat:0 "Інвестувати золотий резерв"
 BEL_infantry_equipment_0:0 "Mauser M89"
 BEL_infantry_equipment_3_short:0 "FN FAL"
 BEL_kings_abdication:0 "Абдикація короля"
 BEL_lucien_lippert_tt:0 "§YЛюсьєн Ліпперт§! стає §YГенералом§!"
 BEL_medium_tank_destroyer_equipment_1_short:0 "T13 B3"
 BEL_military_service_for_all_in_exile_desc:0 "Є велика кількість [BEL.GetAdjective] в усьому світі. Ми повинні оголосити, що всі вони повинні бути негайно призвані на службу для звільнення нашої батьківщини. Патріотичний дух високий, і ми можемо очікувати великий потік підтримки."
 BEL_mio_trait_anti_submarine_expertise:0 "Anti-Submarine Expertise"
 BEL_mio_trait_browning_automatic_rifles:0 "Browning Automatic Rifles"
 BEL_multi_language_courses:0 "Курси з багатомовності"
 BEL_raise_the_red_flag_desc:0 "До цього часу більшість наших зусиль відповідала більш поміркованому соціалістичному ідеалу, однак, щоб краще синхронізуватися з радянським блоком, ми можемо збільшити підтримку Комуністичної партії. Першим кроком буде підтримка «Le Drapeau Rouge» (Червоний Прапор), комуністичної газети в Бельгії."
 BEL_raise_the_red_flag_tt:0 "Відкриває рішення для §Y$BEL_rekindle_the_red_flame_cat$§! і перетворює [BEL.GetNameDef] на §YКомуністичну§!."
 BEL_re_build_the_fleet:0 "Відбудова флоту"
 BEL_requisition_congolese_funds_decision:0 "Реквізувати кошти у [COG.GetAdjective]ого уряду"
 BEL_resist_and_bite:0 "Стійко і рішуче"
 BEL_secretaries_general_desc:0 "Хоча ми зробимо все, щоб захистити нашу націю, ми повинні бути реалістами, коли поглянемо на наших набагато більших сусідів, і прийняти важке рішення створити законодавство на випадок нашої капітуляції. Таким чином, ми створили Генеральних секретарів — це державні службовці, яким було юридично дозволено співпрацювати з будь-яким окупантом і забезпечити продовження роботи місцевого уряду."
 BEL_social_partners_desc:0 "Наш уряд скликав Національну трудову конференцію для об'єднання представників профспілок і компаній. Результатом стало впровадження мінімальної заробітної плати та шести днів оплачуваної відпустки на рік."
 BEL_strength_and_brotherhood_desc:0 "Ми будемо шукати тих, чиї ідеали сили та братерства збігаються з нашими, і, як леви, сформуємо своє власне стадо. Таким чином, ми зможемо нести вперед те, що робить нас потужними, і розривати на шматки тих, хто слабший за розумом і духом, як здобич."
 BEL_the_flemish_question:0 "Фламандське питання"
 BEL_transport_plane_equipment_3_short:0 "DC-3"
 BEL_unfit_to_reign_desc:0 "У зв'язку з безумовною капітуляцією, запропонованою королем Леопольдом III без схвалення парламенту, цивільний уряд оголосив його нелегітимним для правління і пообіцяв продовжити війну з-за кордону."
 BHR_neutrality_ADJ:0 "Бахрейнськ"
 BHU_fascism_ADJ:0 "Бутанськ"
 BLC_communism_DEF:0 "Белуджійська народна республіка"
 BLITZKRIEG_DESC:0 "За останні кілька років світ побачив нові локальні війни в Європі й Азії. Іспанією тепер керують націоналісти, а Японія конфліктує з Радянським Союзом і Китаєм через території, а війна з Китаєм іде їй на користь. Новий пакт про ненапад між Радянським Союзом та Німеччиною може означати погані новини для інших держав Європи."
