 YUG_the_ik_3_desc:0 "Працюючи таємно у вільний час, тріо інженерів запропонували чудову пропозицію щодо заміни наших нинішніх винищувачів іноземного виробництва. За наявності відповідної підтримки виробництво, ймовірно, скоро стане можливим."
