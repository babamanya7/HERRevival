 ETH_soviet_aid_tt:0 "\n§R[SOV.GetNameDefCap] очікуватиме більшого контролю над нашими справами в обмін на допомогу!§!"
 ETH_start_civil_war_jimma:0 "§Y$ETH_abba_jofir$§! із $jimma_RU_Gen$ розпочне §Yгромадянську війну§! проти §Y$ETH_haile_selassie$§! після завершення фокусу §Y$ETH_declare_for_italy$§!."
 ETH_support_anti-colonialist_resistance_tt:0 "Відкриває доступ до §Yрішень§! по посиленню спротиву в колоніальних областях §YСхідної Африки§!."
 ETH_the_american_radio_address:0 "Звернення по американському радіо"
 ETH_the_italo-ethiopian_empire_desc:0 "Поки ми повстаємо з попелу старої імперії, починає формуватися нова Італо-[ETH.GetAdjective]а. Хоча зовсім недавно ми билися один проти одного, стає все більш очевидним, що [ITA.GetName] і [ETH.GetName] тепер сильніші разом. Тепер наш обов'язок — розширити область нашої спільної імперії."
 ETH_the_junior_officer_corps:0 "Молодший офіцерський корпус"
