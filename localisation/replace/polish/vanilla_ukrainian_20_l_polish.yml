 CHL_political_events.67.a:0 "Вони тепер вільні від гніту"
 CHL_political_events.73.t:0 "Обрання Токі"
 CHL_political_events.89.desc:0 "Наш союзник [FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із простим проханням. Відмовитися від контролю над [270.GetName] на їхню користь, оскільки вона ближче до їхнього центру і їм легше її захищати, щоб вона не стала стратегічною лазівкою, якою ворог міг би скористатися проти них."
 CHL_protecting_mapuche_lands:0 "Захист земель корінних мапуче"
 CHL_releases_can_tt:0 "Необхідні землі буде передано підлеглій §Yреорганізованій Канаді§!."
 CHL_reorganized_canada_flag:0 "Канаду реорганізовано"
 CHL_reorganized_usa_flag:0 "США реорганізовано"
 CHL_request_foreign_support_desc:0 "Є багато країн, які вже контролюються людьми з подібними до нас ідеологічними поглядами, і може виявитися розумним бути на їхньому боці. Таким чином, ми можемо попросити у них зброю і солдатів, які допоможуть нам здійснити державний переворот."
 CHL_return_to_the_parliamentary_era_desc:0 "Існує лише одна універсальна істина, і вона полягає в тому, що влада розбещує, а абсолютна влада розбещує абсолютно. Тому ми мусимо зробити так, щоби парламент мав якомога більший вплив і божевільний президент не міг керувати всім майбутнім нашої нації."
 CHL_ship_medium_battery_1:0 "20.3-см/40 Armstrong T"
 CHL_strike_a_deal_with_the_mapuche_desc:0 "Саме мапуче колись дозволили Орелі-Антуану І стати першим королем Арауканії та Патагонії, і саме завдяки нашим зв'язкам з ними ми можемо залучити на свій бік нові організації мапуче."
 CHL_the_true_enemy:0 "Істинний ворог"
 CHL_towards_communism_tt:0 "Це підштовхне країну на крок до §Yмирної комуністичної революції§!."
 CHL_union_araucana_desc:0 "Арауканський союз є однією з найстаріших організацій мапуче в Чилі. Завдяки тісним зв'язкам із отцями-капуцинами, присутніми в Арауканії, вони просувають програму католицької євангелізації та інтеграції в чилійське суспільство, але підтримають наш шлях, якщо їх належним чином переконати."
