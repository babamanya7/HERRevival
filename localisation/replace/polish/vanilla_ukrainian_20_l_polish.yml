 FRA_armored_car_at_equipment:0 "Voiture spéciale 207"
 FRA_carry_the_revolution_south_desc:0 "Першою країною, яка впала під фашизм, була Італія. В результаті ідеологія міцно закріпилася в Італії. Наші світогляди не можуть мирно співіснувати. Вони знають це так само добре, як і ми, і, без сумніву, будуть готові діяти. Так і ми повинні."
 FRA_case_anton_mission_tt:0 "Анексії уникнули."
 FRA_central_africa_intervention.3.t:0 "Перемир'я в Центральній Африці"
 FRA_cooperation_with_the_communists_desc:0 "У нашій спільній боротьбі ми мусимо не відмовляти жодному союзнику, який пропонує себе — навіть якщо вони можуть називати себе товаришем."
 FRA_cv_fighter_equipment_0:0 "Dewoitine D.376"
 FRA_diplomatic_freedom:0 "Дипломатична свобода"
 FRA_fighter_equipment_0:0 "Nieuport-Delage NiD 62"
 FRA_form_the_popular_front_desc:0 "Із піднесенням фашизму в Німеччині та Італії стало зрозуміло, що боротьба ліворуч має припинитися, якщо наша справа вижити. Широкий народний фронт, що складається з усіх лівих партій, матиме народний мандат, щоби нарешті вирішити економічні умови, які породжують фашизм."
 FRA_form_the_provisional_government_of_the_republic:0 "Сформувати тимчасовий уряд"
 FRA_france_first:0 "Франція передусім"
 FRA_franco_soviet_treaty_desc:0 "[SOV.GetAdjective]а влада так само стурбована зростанням фашизму в Європі, як і ми. Можливо, ми змогли б переконати їх підтримати нас, якби настав час."
 FRA_global_integration_desc:0 "Британська імперія — це тонко налаштована система взаємодопоміжних частин. Нічого не говорить про те, що ми не можемо так само добре поводитися з нашими колоніями."
 FRA_heavy_fighter_equipment_2:0 "Breguet 690"
 FRA_heavy_tank_equipment_3_short:0 "AMX-M4"
 FRA_independence_for_central_africa_mission:0 "Рух за незалежність у Центральній Африці"
 FRA_industrial_expansion_desc:0 "Потрібно зміцнювати промисловість у межах. У нас достатньо робочої сили, але замало фабрик."
 FRA_initiate_government_reform_desc:0 "Світ стає дедалі небезпечнішим. Дрібні чвари мусять не заважати нам іти вперед. Настав час наділити політиків великими повноваженнями і віддати всі сили на благо рідної Франції."
 FRA_invasion_in_syria:0 "Вторгнення в Сирію"
 FRA_invest_in_indochina_desc:0 "Велика відстань між нашими володіннями в Індокитаї та нашим центром може здатися недоліком, але вона також захищає будь-яку промисловість там від ворожого нападу."
 FRA_invite_portugal_desc:0 "Хоча її колоніальна імперія значно зменшилася, полум'я розвідок і завоювань все ще горить у серці кожного португальця."
 FRA_latin_entente_desc:0 "Братство, яке існує між державами-спадкоємицями Римської імперії, є незаперечним. Германський народ Європи надто довго панував на континенті. Настав час повернути наше національне право народження."
