 SOV_concessions_japan_sakhalin_SCW_desc:0 "Для повстання потрібна зброя. Можливо, японці будуть готові дати нам її, якщо ми покажемо, що готові віддати їм решту Сахаліну."
 SOV_control_scandinavia_decisions_tt:0 "Будуть відкриті рішення §YНатиснути на уряд§! і §YПросувати ідеологічні мітинги§! в Нордичних країнах."
