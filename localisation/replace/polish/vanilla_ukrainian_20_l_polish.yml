 RAJ_assam_oil_dlc_desc:0 "Ми нещодавно виявили великі нафтові родовища в штаті Ассам. Створивши державну нафтову компанію та побудувавши нафтові вишки в Ассамі, ми можемо суттєво покращити нашу економіку."
