 DEN_pledge_allegiance:0 "Присягнути на вірність"
 DEN_reclaim_atlantic_islands_desc:0 "Фарерські острови та Ісландія, можливо, не мають жодних природних ресурсів, про які можна було б говорити, але, тим не менш, вони є частиною нашої держави і мають життєво важливе стратегічне значення, оскільки острови слугують сходинкою для домінування в Північній Атлантиці.\n\nГренландія — єдина частина нашої держави, яка фактично володіє будь-якими природними ресурсами, необхідними для утримання сучасної і ефективної армії, що робить її нашим найвищим пріоритетом."
 DEN_refortify_tunestillingen:0 "Укріпити Тунестіллінген"
 DEN_sikkerhedspolitiet:0 "Sikkerhedspolitiet"
 DEN_strengthen_the_danish_brigades_desc:0 "Ми не зможемо зібрати таку ж вогневу міць, яку має [?DEN.DEN_overlord_nation.GetNameDef], тому ми повинні воювати розумно і перехитрити їх. Ми повинні вивчати наших ворогів і знаходити їхні слабкі місця, щоб використовувати їх на полі бою."
 DEN_total_war:0 "Total krig"
 DEN_total_war_desc:0 "Наші нинішні втрати у цій війні є неприпустимими. Але це ще не кінець. Ми повинні згуртувати наші війська і готуватися до тотального кригу. Якщо ми зможемо відтіснити ворога і кинути на нього все, що у нас є, тоді у нас може з'явитися шанс вистояти в цій бурі. Згуртуймо народ, мобілізуймо останню нашу промисловість: ми мусимо вистояти!"
