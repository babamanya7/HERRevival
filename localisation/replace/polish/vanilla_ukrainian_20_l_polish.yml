 HAW_democratic_party:0 "ДПГ"
 HBC_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4:0 "Чжунцзян"
 HES_neutrality_DEF:0 "Велике герцогство Гессен"
 HINT_WAR_SCREEN_TEXT:0 "Це екран §Yвійни§!. Тут вказано прогрес війни та співвідношення сил.\n\nІталія розпочинає гру у стані війни з Ефіопією, але Вам зараз не треба хвилюватися про це. Поки ще перегляньте інші сповіщення."
 HND_UNIFIED_democratic_ADJ:0 "Індостанськ"
 HOL_GER_fascism_autonomy_integrated_puppet:0 "Райхскомісаріат Нідерланди"
 HOL_GER_fascism_autonomy_satellite:0 "Дітсланд"
 HOL_antilles_defenses_desc:0 "Враховуючи величезне значення наших нафтопереробних заводів на Арубі та Кюрасао, не дивно, що іноземні сторони, які зацікавлені в них, здається, дуже стурбовані слабким станом нашої оборони тут. Якщо ми хочемо уникнути того, щоб ці партії відчували потребу захищати острови за нас, можливо, нам слід самим подбати про поліпшення захисту..."
 HOL_artillery_equipment_3:0 "12 cm 12 lang 14"
 HOL_autonomy_collaboration_government:0 "$OVERLORDADJ$і $NONIDEOLOGY$"
 HOL_decolonization:0 "Деколонізація"
 HOL_depillarization:0 "Депілларизація"
 HOL_establish_pro_war_labor_indoctrination_desc:0 "Поки робітники на нашій стороні, можна не сумніватися, що й інші погодяться з нами. За рахунок невеликого зниження продуктивності ми зміцнимо в людях почуття патріотизму і допоможемо їм зрозуміти необхідність сильної армії для захисту наших цінностей."
 HOL_expand_curacao_oil_refineries_taog_desc:0 "$HOL_expand_curacao_oil_refineries_desc$"
 HOL_heavy_fighter_equipment_2_short:0 "Fokker G.1W"
 HOL_infantry_equipment_3_short:0 "Johnson M44"
 HOL_light_cruiser_2_desc:0 "The light cruiser De Ruyter was built and commissioned in the Netherlands during the mid-1930s. She served primarily in the Dutch East Indies. She displaced over 6,500 tons and was armed with seven 150mm guns in her main armament. She had below-average speed but good range."
 HOL_medium_tank_equipment_1_short:0 "GVT-3"
 HOL_obtain_dockyard_access_desc:0 "Під час вторгнення у нас будувалися кораблі. Ми змогли відбуксирувати частину незакінчених корпусів до Англії, але тепер нам потрібна британська допомога, щоби добудувати їх."
 HOL_ship_torpedo_sub_4:0 "6x 533-мм ТА з заряд. порш."
 HOL_the_foundations_of_defense_desc:0 "«Defensiegrondslagen van Nederlands-Indië» — це звіт, складений у 1927 році, в якому аналізується обороноздатність наших колоній. З огляду на нещодавнє посилення японської агресії та добре знаючи їхні задуми щодо Ост-Індії, можливо, з цього документа слід притерти пил, а визначені в ньому оборонні слабкі місця віддати пріоритет для розподілу наших щойно звільнених ресурсів."
 HOL_volk_en_vaderland_desc:0 "Наше рішення віддати перевагу одному сусідові над іншим означає, що ми остаточно відмовилися від свого нейтралітету. Посилення пронімецьких голосів і націоналістичної риторики в результаті нашого нещодавнього рішення починає ставати дуже помітним у нашій внутрішній політиці, наприклад, у формі ультраправої газети «Народ і Батьківщина»."
