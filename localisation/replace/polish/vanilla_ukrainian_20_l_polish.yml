 GER_MONROE_DOCTRINE_COUNTRIES_IN_SUPPORT_TOOLTIP:0 "[GetMonroeSupportGoodBad] країн зараз підтримують §YДоктрину Монро§!.\n\nЦі країни зайняли активну позицію, на них неможливо впливати далі[GetIsAnyoneSupportingMonroe][GetSupportingMonroeCountries]"
 GER_STATE_72:0 "Ользагебіт"
 GER_VICTORY_POINTS_11301:0 "Б'єлосток"
 GER_accept_british_naval_dominance_desc:0 "Для боротьби з комунізмом нам потрібні нові союзники, і Британія — найперший кандидат. Ми змиримося з їхнім пануванням на морі та відмовимося від створення потужного флоту, щоби поліпшити наші дипломатичні відносини."
 GER_antischluss_progress_significant:0 "зробили §Yзначний§! поступ у цьому"
 GER_asian_allies_tt:0 "Відкриває рішення §YПідтримати незалежність§! країн §YАзії§!."
 GER_assassinate_mussolini_ww_desc:0 "Час покласти край лінії підпор Муссоліні. Німецькі руки вб'ють лідера, після чого [ITA.GetAdjective] королівські прихильники захоплять владу одразу."
 GER_atlantic_naval_dominance:0 "Морське панування в Атлантиці"
 GER_befriend_poland:0 "$GER_poland_friend$"
 GER_bulwark_against_bolshevism_desc:0 "Наша держава — як щит проти [GER.GetBulwarkBolshevismDesc], що захищає країни Заходу від [GER.GetBulwarkCommunismDesc] впливу. Ми мусимо з гордістю виконувати цю роль і бути готовими використати силу, якщо доведеться."
 GER_carrier_1:0 "Flugzeugdampfer I"
 GER_carte_blanche_for_alsace_and_french_colonies_ww_desc:0 "$GER_carte_blanche_for_alsace_and_french_colonies_desc$"
 GER_china_friend:0 "Подружитися з Китаєм"
 GER_china_friend_desc:0 "Можливо, варто поглибити нашу довгу дружбу з Китаєм. Ця дія відштовхне Японію, але що таке Японія, якщо не Італія сходу?"
 GER_combined_arms:0 "Спільнодія родів військ"
 GER_controls_iberian_coast_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]а маріонетка або член альянсу повністю контролює всі регіони вздовж §YАтлантичного узбережжя§! від §Y[792.GetName]§! до §Y[169.GetName]§!."
 GER_crossing_the_atlantic_trigger_tt:0 "Не: $TRIGGER_ANY_enemy_COUNTRY_STARTS$:\n  $TRIGGER_IS_MAJOR$\n  $TRIGGER_ANY_CONTROLLED_STATE_STARTS$:\n     Знаходиться в §YЄвропі§!"
 GER_cv_fighter_equipment_0:0 "Arado Ar 168"
 GER_demand_slovenia_threat:0 "Німеччина вимогла Словенію"
 GER_extend_mitteleuropas_bounderies_desc:0 "Країни на сході — це не просто буферні зони. Ми повинні запросити їх до Міттельєвропи, щоб зміцнити наш союз та митний союз."
 GER_fate_of_yugoslavia:0 "Доля Югославії"
 GER_focke_achgelis_organization:0 "Focke-Achgelis"
 GER_form_the_reichskommissariats_desc:0 "Ми зможемо ефективніше розпоряджатися ресурсами, промисловими потужностями та робочою силою, якщо організуємо квазіавтономні підпорядковані нам уряди на окупованих територіях."
 GER_found_a_transcacuasian_satellite_state_decision:0 "Заснувати транскавказьку державу-сателіт"
 GER_german_empire_neutrality:0 "Німецька імперія"
 GER_high_seas_fleet:0 "Флот відкритого моря"
 GER_hold_joint_military_drills_desc:0 "Наші союзники на сході мають більш свіжий досвід боротьби з [SOV.GetAdjective]ими силами, ніж ми, і можуть володіти цінними знаннями. Ми повинні організувати спільні навчання, щоб обмінятися досвідом."
 GER_influence_the_baltics_desc:0 "Країни Балтії знаходяться між нами та державою [SOV.GetNameDef]. За допомогою певних дипломатичних зусиль і взаємовигідних пропозицій ми зможемо наблизити їх до себе без необхідності конфлікту."
 GER_is_not_colonial_overlord_desc:0 "Ми отримали ультиматум від [FROM.GetNameDef]. З історичних причин вони вимагають передачі контролю над колоніями. Хоча їхні вимоги різкі, у нас ще є вибір."
 GER_kaiserreich_decided_not_to_attack_poland:0 "Вирішено не атакувати §YПольщу§! через відмову повернути старі імперські володіння"
 GER_light_tank_artillery_equipment_1:0 "Sturmpanzer I Bison"
 GER_male_kaiser_title:0 "кайзером"
 GER_medium_tank_aa_equipment_2_desc:0 "Flakpanzer IV «Ostwind» (з нім. — «Східний вітер») — самохідна зенітна установка на базі танка Panzer IV. Він був розроблений у 1944 році як спадкоємець попереднього Flakpanzer IV. Башту Panzer IV було знято та замінено шестикутною баштою з відкритим верхом, яка містила 3,7-см FlaK 43. Кращою була б конструкція із закритим верхом, але це було неможливо через рясний дим, який утворювала гармата."
 GER_medium_tank_equipment_3_desc:0 "Panther — це загальна назва середнього танка, який використовувався Німеччиною під час Другої світової війни з середини 1943 року до кінця європейської війни в 1945 році. Він призначався як протидія російському Т-34 і як заміна Panzer III і Panzer IV. Хоча останній так і не замінив, він служив разом з ним і більш важкими танками Tiger до кінця війни. Чудове поєднання вогневої потужності, мобільності та захисту Panther стало еталоном для проєктів танків пізньої та післявоєнної війни інших країн, і його вважають одним із найкращих танків Другої світової війни."
 GER_mefo_bills_extended:0 "Розширені векселі «MEFO»"
 GER_middle_eastern_trade_decision:0 "Торгові переговори с державою §Y[FROM.GetName]§!"
 GER_mio_trait_lokomotivfabrik_floridsdorf:0 "Потужності підприємства «Lokomotivfabrik Floridsdorf»"
 GER_mio_trait_multi_role_tanks:0 "Багатоцільові танки"
 GER_mio_trait_work_horse_design_philosophy:0 "Філософія надійної робочої конячки"
 GER_mitteleuropa_customs_union_decision:0 "Запросити державу §Y[FROM.GetNameDef]§! до Митного союзу"
 GER_modern_tank_equipment_1_desc:0 "Серія Entwicklung була спробою Німеччини наприкінці війни створити стандартизовану серію танків. Мали бути стандартні конструкції в шести різних вагових категоріях. E-50 Standardpanzer задумувався як стандартний середній танк, який замінить серію танків Panther і Tiger і переобладнаних на основі цих танків."
 GER_nationalist_spain_ally_tt:0 "Поліпшує дипломатичні відносини з §YНаціоналістичною Іспанією§!."
 GER_negotiate_old_colonies_in_the_east_tt:0 "Any of the following states that they control will be transferred to us:\n§Y[684.GetName]\n[647.GetName]\n[646.GetName]\n[633.GetName]\n[743.GetName]\n[979.GetName]\n[737.GetName]\n[726.GetName]\n[725.GetName]\n[1070.GetName]§!"
 GER_offer_military_production_support:0 "Запропонувати підтримку у військовому виробництві"
 GER_operation_felix_desc:0 "Громадянська війна в Іспанії нарешті закінчилася, і настав час вирвати область [118.GetName] із [ENG.GetAdjective]ої влади. Оскільки ми не можемо атакувати з моря, ми мусимо спочатку забезпечити лояльність [SPR.GetAdjective]ого уряду, щоби вони дозволили нам пройти своєю територією. Враховуючи наші ідеології, змусити їх підкоритися не мусить бути складно."
 GER_operation_panzerfaust_events.05.desc:0 "Фюрер дотримався свого слова й оголосив про початок операції «Маргарет» — вторгнення до нашої країни з метою її підкорення. Ми повинні чинити опір!"
 GER_ostwall_forts_2:0 "§Y$STATE_813$§!, §Y$STATE_209$§!, §Y$STATE_210$§!, §Y$STATE_207$§!, §Y$STATE_206$§!, §Y$STATE_204$§!, §Y$STATE_194$§!, §Y$STATE_202$§!, §Y$STATE_203$§!, §Y$STATE_226$§!, §Y$STATE_200$§!\n"
 GER_prioritize_the_army_desc:0 "Німеччина, а до того й Пруссія, завжди була сухопутною державою й покладалася на армію для захисту свого суверенітету і безпеки. Ми мусимо переспрямувати наші промислові зусилля на те, щоби наша армія була добре оснащена та здатна підкорити всякого ворога."
 GER_protect_the_revolution:0 "Захистити революцію"
 GER_rally_the_industrialists:0 "Залучити промисловців"
 GER_reichskommissariat_turkestan_effect_tt:0 "Усі необхідні області, окрім §Y[405.GetName]§!, перейдуть під контроль [RKT.GetNameDef]"
 GER_restore_eastern_imperial_possessions:0 "Повернути східні імперські володіння"
 GER_scandinavian_membership:0 "Членство Скандинавії"
 GER_ship_torpedo_sub_3:0 "6x 533-мм ТА з заряд. порш."
 GER_solve_the_logistical_bottlenecks_desc:0 "Після завершення реорганізації військово-повітряних сил ми можемо звернути увагу на неефективну систему логістики та ланки постачання. Оптимізація цих питань дозволить вивільнити більше людей для виконання інших завдань і сприятиме швидшому ремонту наших літаків."
 GER_sp_land_super_heavy_railway_gun:0 "Schwerer Gustav"
 GER_subjugate_romanian_economy:0 "Підкорити румунську економіку"
 GER_submarine_3_desc:0 "Морський підводний човен типу «VIIC» був робочою конячкою німецьких човнів U-Boot, 568 з яких були введені в експлуатацію між 1940 і 1945 роками. Кораблі водотоннажністю 770 тонн були озброєні п'ятьма 533-мм торпедними апаратами."
 GER_super_heavy_tank_aa_equipment_1:0 "Flakpanzer VIII Maus"
 GER_super_heavy_tank_aa_equipment_1_desc:0 "Шасі Maus із установленими спареними 88-мм зенітними гарматами."
 GER_the_central_powers:0 "Центральні держави"
 GER_train_schutztruppe_in_tanganyika:0 "Мобілізувати Шуцтруппе в Танганьїці"
 GER_train_schutztruppe_in_tsingtao:0 "Мобілізувати Шуцтруппе в Ціндао"
 GER_transport_plane_equipment_2_short:0 "Ju 52"
 GER_treaty_with_the_ussr:0 "$GER_soviet_treaty$"
 GER_turkey_friend_desc:0 "Туреччина Ататюрка стала на шлях модернізації, крім того, ця країна контролює вихід у Чорне море через Босфор та Дарданелли. Пріоритетним завданням для нас є залучення Туреччини до своєї зони впливу!"
 GER_unlock_national_nuclear_corporation_tt:0 "Розблоковує промисловий концерн §Y$PRC_china_national_nuclear_corporation$§!"
 GER_workers_rights_desc:0 "За останні кілька років профспілки докорінно змінились і вже не схожі на ті, якими вони були раніше. Реформувавши їх, ми зможемо згуртувати робітників і отримати вигоду."
 GIE_LEGITIMACY_DAILY_TOTAL:0 "Зміна легітимності щодня: $VALUE|2+$"
 GNA_fascism_DEF:0 "Суверенна держава Гвінея"
 GNA_neutrality_ADJ:0 "Гвінейськ"
 GOE_RAJ.30_we_are_leaving_tt:0 "§Y[RAJ.GetName]§! тимчасово залишиться під нашим контролем, доки ми дозволимо їм розібратися зі своєю адміністрацією. Однак з часом вони, зрештою, вирвуться на свободу."
 GOE_RAJ.31.desc:0 "У міру того, як [RAJ.GetName] намагається оговтатися від Великої депресії, її ціновий контроль, здається, дестабілізував країну. Прив'язка рупії до стерлінга ризикує кинути обидві наші країни в економічні потрясіння.\nКонгломерат приватних осіб звернувся до нас із пропозицією розділити Радж на дві частини, полегшуючи фінансовий тягар держави. Одна частина під приватним контролем, а інша все ще під контролем корони.\nБездіяльність може призвести до ще гіршого результату."
 GOE_RAJ.43.desc:0 "Індійські війська взяли Калькутту. Пакистанські сили відступили після важких боїв, і над регіоном тепер майорять комуністичні прапори. Індійські радіопередачі називають це тріумфом народу."
 GOE_RAJ.46.a:0 "Вигнати червоних!"
 GOE_RAJ_eic.4.desc:0 "[FROM.GetName] відверто відмовляється від наших вимог і нагадує нам, що вони є суверенною країною зі своїми власними законами. Той факт, що ми намагаємося нав'язати їм наші вимоги, межує з блюзнірством."
 GOE_RAJ_eic.7.a:0 "Вони змінять думку"
 GOE_RAJ_famine.5.desc:0 "Оскільки ціна на зерно зросла, місцевий уряд намагався запровадити контроль над цінами, щоб допомогти місцевому населенню. На жаль, це призвело лише до того, що велика кількість зерна зникла на чорному ринку або була накопичена на великих складах.\nМісцевий уряд вже послабив заходи, але все ще існує широке переконання, що існує значний дефіцит зерна, що призводить до нестримної інфляції."
 GOE_RAJ_generals.8.t:0 "[ENG.GetNameDefCap] приймає!"
 GOE_RAJ_generals.9.t:0 "[ENG.GetNameDefCap] відхиляє нашу пропозицію."
 GOE_RAJ_loyalist.02.desc:0 "Відбулися ґрунтовні переговори щодо розвитку виробничих ліній по всій Імперії. Це дозволило нам створити та розширити промислові об'єкти в [?RAJ_crown_commodities_civ_built_flag.GetName]. Сподіваємось, це зміцнить Імперію перед обличчям зростаючих глобальних потреб."
 GOE_RAJ_loyalist.12.desc:0 "У ці важкі часи все ще є надія. Незважаючи на нашу капітуляцію, $ENG_winston_churchill$ зумів втекти з острова та дістатися до [RAJ.GetNameDef]. Звідси він може підтримувати [ENG.GetAdjective] інтереси та керувати військовими операціями, доки ми не зможемо повернути нашу батьківщину."
 GOE_generic_events.2.t:0 "[FROM.GetAdjective] адміністрація залишається лояльною"
 GOT_GER_integrated_puppet_economies.01.t:0 "Допомога у розвитку від [FROM.GetAdjective]"
 GOVERNMENT_IN_EXILE_LEGITIMACY:0 "Легітимність: $VALUE|H$"
 GRE_AUS_is_HUN_EMPIRE_tt:0 "Австрія утворила §Y$HUN_EMPIRE_neutrality_RU_Acc$§!"
 GRE_GREATER_GREECE_communism:0 "Егейська комуна"
 GRE_a_modern_navy_desc:0 "Обмеження, які накладає Греко-турецька морська угода на допустимий розмір наших кораблів, мало що означають, тому що, говорячи відверто, наші виробничі потужності не дозволяють нам ані розширити, ані просто підтримати флот з лінкорів та крейсерів. А ось підводні човни — це інша справа... Це і є відповідь на морське питання Греції."
 GRE_aegean_troublemakers:0 "Егейські обурювачі спокою"
 GRE_build_the_salamis_desc:0 "З німецькою допомогою стало можливо відновити наш старий лінкор «Саламіс», який ми недалекоглядно на брухт в 1932 році. На щастя, у нас залишились рештки корпусу, так що починати повністю з нуля не доведеться."
 GRE_faction_loyal_stability:0 "§G+10%§!"
 GRE_germany_rebuffed:0 "§YНімецькі§! інвестиції не прийняті"
 GRE_greek_autarky_desc:0 "Наша давня залежність від капіталів багатших країн принизлива. Ці держави дивляться на нас зверхньо, утискають і тримають нас у злиднях, щоби самим набивати кишені. Німці, італійці та росіяни показали нам, що є інший шлях — шлях до самодостатності та повної незалежності! Звичайно, це займе деякий час, адже ми, зрештою, не Німеччина..."
 GRE_hold_national_showcase_for_investors_ger:0 "Провести національну виставку для [FROM.GetAdjective]их інвесторів"
 GRE_host_soviet_bureaucrats_in_greece_desc:0 "Представники держави [FROM.GetNameDefCap] проїдуть по нашій державі та вирішать, чи хочуть вони зробити помірні інвестиції в нашу військову промисловість."
 GRE_metaxism_focus:0 "Метаксизм"
 GRE_no_central_powers_tt:0 "§YАвстро-Угорщина§! або §YКайзерівська Німеччина§! мусять існувати, щоб цей фокус мав якийсь ефект."
 GRE_paying_back_our_debts_in_bulk_FRA_tt:0 "Буде відкрите рішення: §YВелика виплата боргу перед [FRA.GetAdjective]ою державою§!.\n"
 GRE_protectors_of_the_mediterranean_desc:0 "[Root.GetProtectorsMediterraneanDesc]"
 GRE_reevaluating_the_drachma:0 "Девальвація драхми"
 GRE_reneged_on_debt:0 "Відмовилися виплатити борг"
 GRE_renegotiate_debt_with_france_tt:0 "Відкриває рішення: §YПідкупити французькі профспілки, щоби ті дошкуляли уряду§! \nОбнуляє весь §Yборг перед МФК§!, котрим завідує держава §Y[FRA.GetNameDef]§!."
 GRE_tac_bomber_equipment_1:0 "Avion Grecque"
 GRE_the_backbone_of_our_army:0 "Основа нашої армії"
 GRE_the_torpedo_desc:0 "Можливо, хтось із безлічі моряків, відправлених нами на дно, міг би нарешті привести нас до Атлантиди! Або, можливо, ми просто перетворили б на затоплене і загублене місто ворожу столицю..."
 GRE_trade_manufactured_ship_parts_for_investment_desc:0 "Допомагаючи британцям підтримувати міць Королівських ВМС, ми отрамємо більш вагомі інвестиції, ніж могли б за звичайних обставин."
 GRN_neutrality_DEF:0 "Королівство Гренландія"
 GSM_communism_party:0 "$CHI_communism_party$"
 GUAY_rekindle_old_gripes_ARG_URG_tt:0 "Якщо ми контролюватимемо §Y[510.GetName]§! протягом §Y365 днів§! з моменту початку війни, [ARG.GetName] доведеться укласти білий мир або зіткнутися з катастрофічною втратою морального духу."
 GUAY_volunteers:0 "[THIS.GetAdjectiveCap]і добровольці"
