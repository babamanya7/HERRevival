 siam.11.a:0 "Ми повинні мінімізувати втрати та відступити."
 siam.18.t:0 "[FROM.GetName] хоче нашої капітуляції!"
 siam.29.desc:0 "Звичайні танки все ще є королями поля бою, тому ми повинні вчитися у найкращих, щоб створити потужний танковий корпус."
 siam.43.t:0 "[FROM.GetNameDefCap] запитує інвестиції в розвиток"
 siam.48.b:0 "[JAP.GetName] не може виділити ресурси."
 siam.9.a:0 "Час будувати все заново."
 siam_adc.2.desc:0 "Після прийняття [FROM.GetAdjective] вимог [SIA.GetNameDef] щодо майбутнього [ROOT.GetNameDef], [FROM.GetLeader] ставить перед нами остаточне питання. Окупаційна влада готова вивести війська та визнати суверенний уряд [ROOT.GetAdjective], якщо ми вирішимо знову стояти самі.\n\nНезалежність пропонує гідність і свободу дій, але вона також залишає нас відбудовувати державу без гарантій [FROM.GetNameDef]. Залишатися під їхнім захистом — скромніший шлях, але такий, що може вберегти країну від подальшого безладу в ці невизначені часи."
 siam_dem.5.b:0 "Куанг Апхайвонг - постать, яку можуть прийняти всі фракції."
 siamese_puppet_focus:0 "Вчинити тиск на Сіам"
 sonar:0 "Пасивний сонар"
 sonar_desc:0 "Базовий набір гідрофонів дає змогу відстежувати підводні цілі за шумом, який вони видають.\n\nУстановка цього модуля в комірку §YЕлектроніка§! на §Yлегкі кораблі§! та §Yкрейсери§! допоможе їм виявляти ворожі §Yпідводні човни§!."
 sortie_efficiency_tt:0 " $CARRIER_SORTIE_EFFICIENCY_FACTOR$: $RIGHT|+=%1$"
 south_american_events.1.desc:0 "Незважаючи на те, що Габріель Терра є диктатором, який жорстко контролює політику країни, він оголосив, що знову проведе вибори. Однак багато хто вже знає їхній результат, оскільки партія Колорадо не відмовиться від влади, а єдиним реальним наступником Терри в партії є його зять Альфредо Бальдомір. Тим не менш, люди йдуть голосувати, щоби побудувати нове майбутнє для Уругваю."
 south_american_events.21.a:0 "Ми вибрали менше зло."
 south_american_events.51.b:0 "Це їх не стосується, перевірте їхній блеф."
 south_american_events.55.a:0 "Отже, ми самі по собі..."
 south_american_events.55.t:0 "[FROM.GetNameDefCap] ігнорує конфлікт"
 south_american_news.13.d:0 "Землетрус магнітудою 8,3 бали, максимальна інтенсивність за шкалою Меркаллі — X, залишив чилійські міста Чільян і Консепсьйон у повній руїні, а кількість загиблих перевищила 28000 осіб. Наразі тривають роботи з реконструкції та надання допомоги, але багато людей вже були змушені покинути свої домівки, і країни регіону не знають, як найкраще вирішити цю проблему."
 south_american_news.20.b:0 "Антильські острови для антильців!"
 south_american_news.51.b:0 "Тривожна ситуація."
