 DEN_collaboration_government:0 "Samarbejdsregering"
 DEN_conservatives_support_desc:0 "Хоча значна частина Консервативної партії ніколи б і не подумала співпрацювати з такими організаціями, як Bondepartiet або DNSAP, все ще є ті, хто бачить, наскільки беззахисною і непідготовленою є [DEN.GetNameDef] до майбутньої бурі. Ми повинні переконати їх приєднатися до нашої справи!"
