 CHI_reclaim_the_north:0 "Повернути Північ"
 CHI_repurpose_fort_artillery_desc:0 "Війна більше не може бути прив'язана до ключових укріплень, це показав кінець останньої великої війни. Хоча споруди можуть не мати великої цінності, артилерійські гармати в них все ще можуть стріляти по ворогу."
 CHI_request_territory_trigger_tt:0 "Будь-який контрольований регіон:\n      Є національним для §Y[ROOT.GetNameWithFlag]§!\n      Контролер: $is_literally_china_tt_NOT$\n      Одне з наведеного має бути істинним:\n          Не є власністю контролера\n          Контролер:\n             Поточна керівна партія — §Y[ROOT.GetRulingIdeology]§!"
 CHI_revive_the_new_culture_movement_desc:0 "Більшість ранніх революціонерів у КПК та Гоміньдані надихалися Рухом за нову культуру, який виступав як проти династії Цін, так і проти Юань Шикая. Тільки через дух Руху за нову культуру новий Китай повстане з попелу минулого!"
