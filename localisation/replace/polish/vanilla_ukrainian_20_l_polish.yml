 ITA_mussolini_resigned_minister_of_corporations_position_flag:0 "Минуло §Y365 днів§! відтоді, як §Y[ROOT.ITA_benito_mussolini.GetName]§! залишив посаду в Міністерстві корпорацій\n(наразі минуло [?ITA_mussolini_resigned_minister_of_corporations_position_flag:days|Y0])"
 ITA_nav_bomber_equipment_3:0 "Savoia-Marchetti SM.89"
 ITA_naval_power_projection:0 "Проєкція морської сили"
 ITA_novus_ordo_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+5.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+2.50%§!\n\n"
 ITA_potential_refinery_in_libya_tt:0 "Маючи дослідженими §Y$synth_oil_experiments$§!, буде додано §G1§! комірку для будівництва й §Y1 НПЗ§! в §Y$STATE_448$§!."
 ITA_purge_the_party_desc:0 "До наших вух доходять чутки, що дехто не бажає ніщо, крім повернення старого режиму. Незважаючи на те, що Муссоліні був скинутий і відсторонений від влади, його тінь постійно присутня в уряді та у свідомості людей. Ми мусимо продемонструвати силу й очистити партію від елементів, які не є по-справжньому лояльними до нас, але залишаються відданими старому дуче."
 ITA_refit_civilian_ships_desc:0 "Хоча власний авіаносний флот є набагато потужнішим, якщо ми хочемо отримати авіаносці хутко, потрібно спростити справу. Переобладнавши існуючі пасажирські лайнери, такі як «Rex» і «Conte di Savoia», ми можемо швидко забезпечити повітряне прикриття для нашого флоту."
 ITA_russian_government_ideology_default:0 "Боротьба з тими, хто нам протистоїть"
 ITA_sea_wolves_bba:0 "$ITA_sea_wolves$"
 ITA_secure_the_borders_forts_tt:0 "Додати §Y2 наземні укріплення§! в кожній провінції, що межує з недружньою країною.\nПоточні ефекти:"
 ITA_security_militias:0 "Охоронні ополчення"
 ITA_send_ultimatum_to_country_balkan_desc:0 "$SOV_send_ultimatum_to_country_balkan_desc$"
 ITA_socialist_republic_fascism_DEF:0 "Італійський національний союз"
 ITA_stalin_how_many_guns_achievement:0 "Граючи за державу §Y[ITA.GetFlag][ITA.GetNameDef]§!, змушено капітулювати державу §Y[SOV.GetFlag][SOV.GetNameDef]§!, маючи при владі Папу Римського"
 ITA_stop_the_squandering_desc:0 "Надто довго Муссоліні витрачав гроші і ресурси, які Італія не може собі дозволити — настав час покласти край цим нерозважливим марнотратствам! Ми мусимо обмежити наші витрати і зосередити наш капітал на поліпшенні інших областей."
 ITA_support_albanian_irredentism_subject_effects_tt:0 "\nБуде застосовано ось ці ефекти, якщо §Y[ALB.GetFlag][ALB.GetNameDefCap]§! є §Yсуб'єктом§! держави §Y[ROOT.GetFlag][ROOT.GetName]§!:"
 ITA_suppress_mafia_in_state_desc:0 "Ми мусимо зупинити поширення мафії, поки все не вийшло з-під контролю."
 ITA_tac_bomber_equipment_1:0 "Fiat BR.20 Cicogna"
 ITA_the_holy_lands_desc:0 "Такий важливий для християнської віри регіон, як Палестина, по праву належить Царству Божому. Ми мусимо запевнитися, що Свята Земля буде повернута нам без зволікань."
 ITA_the_new_emperor_of_ethiopia:0 "Новий імператор Ефіопії"
 ITA_topple_amhara_rulers_desc:0 "Ефіопія є набагато більш різноманітною та розколотою країною, ніж багато хто вважає. Є багато груп, які не є палкими прихильниками старого ефіопського режиму. Надання їм невеликих поступок могло би легко схилити їх на наш бік, що значно полегшило б умиротворення в регіоні."
 ITA_treaty_with_germany_desc:0 "$ITA_german_rd_treaty_desc$"
 ITA_vallo_alpino_settentrionale_west_tt:0 "Буде збудовано оборонну лінію в областях §Y[158.GetName]§! і §Y[159.GetName]§! вздовж північно-західного альпійського кордону з областями [846.GetName] та [151.GetName].\n"
 ITZ_fascism_ADJ:0 "Іцинськ"
 JAM_neutrality_DEF:0 "Ямайське князівство"
 JAP_a_truly_righteous_army_desc:0 "[ROOT.GetAdjective]а імператорська армія воює не просто заради завоювання чи слави. Вона бореться за свого Імператора, свою націю, свої ідеали та свій народ. Кожен солдат повинен знати ці речі й усвідомлювати, що все, що він робить під час виконання службових обов'язків, відображається на Імператорі та його народі, і що заради Його Величності будь-яка жертва є вартою."
 JAP_an_ode_to_showa_restoration_desc:0 "Військово-морський офіцер Мікамі Таку написав «Оду Реставрації Шьова» — приголомшливу тему для нашого руху, яка рішуче звертається до природних та релігійних образів. Тепер, коли ми відновили владу, інтронізували імператора Хірохіто та скасували ліберальну демократію Тайшьо, ми повинні зробити це другим державним гімном."
 JAP_anti_colonialism_category_desc:0 "Ми зробимо все можливе, щоб підтримати рухи опору в регіоні, доки зараза західного імперіалізму не буде остаточно усунена."
 JAP_approach_the_young_officers_desc:0 "Старше покоління дуже міцно тримається за минуле, щоби прийняти нові парадигми. Центром нашої уваги стане молодше покоління."
 JAP_armored_car_equipment_1_short:0 "Chiyoda"
 JAP_army_faction_demands_political_appointment:0 "$JAP_army_faction$ вимагає призначення головнокомандувача армії"
 JAP_army_politically_purging_disloyal_young_officers_mission:0 "Армія проводить політичну чистку нелояльних молодих офіцерів"
 JAP_artillery_equipment_2:0 "Type 91 10 cm"
 JAP_asian_communist_solidarity_desc:0 "Ми мусимо стояти пліч-о-пліч зі своїми побратимами. В Азії немає місця західній формі комунізму, однак, об'єднавшись, ми зможемо явити світові азійський комунізм, який відповідає нашим потребам."
 JAP_assure_superior_naval_quality_desc:0 "Хоча кількість має значення, ми не повинні дозволяти ворогові володіти кораблями, потужнішими за наші найкращі. «Ямато» був хорошим першим кроком, але ми повинні розвивати ці ідеї ще далі."
 JAP_battleship_2:0 "Клас «Kongo»"
 JAP_border_conflict_escalation_warning_SOV:0 "Підготовка Японії"
 JAP_break_the_london_naval_treaty_desc:0 "Обурливі обмеження Лондонського військово-морського договору є загрозою безпеці нашої країни. Ми повинні мати свободу побудувати флот, який зможе протистояти будь-якій нації, яка кине виклик тому, що нам по праву належить."
 JAP_build_up_korean_industries:0 "Розбудова корейської промисловості"
 JAP_build_up_the_manchurian_army_desc:0 "[MAN.GetNameDefCap] стане лінією фронту за будь-якої війни на північному напрямку. Війська там мають бути досить сильними, щоби відбити всякий можливий напад."
 JAP_carrier_1:0 "Клас «Kaga»"
 JAP_cleaning_up_our_own_mess:0 "Завершення того, що ми почали"
 JAP_colonial_independence:0 "Колоніальна незалежність"
 JAP_contact_former_sakurakai_members_desc:0 "Товариство цвіту сакури (Сакуракай) було ультранаціоналістичним таємним товариством, заснованим молодими офіцерами в 1930 році, яке було розпущене після Інциденту з імператорськими прапорами. Вони мали на меті реорганізувати державу за тоталітарними мілітаристськими лініями шляхом військового перевороту, якщо це буде необхідно. Тепер, коли ми досягли успіху, ми повинні звернутися до них, щоб знову запросити деяких із цих колишніх членів до нашого уряду."
 JAP_crackdown_on_foreign_agents_tt:0 "§YТокко§! активізує арешти дисидентів та шпигунів у спробі зміцнити національну безпеку та стабільність"
 JAP_create_greater_east_asian_treaty_organization_tt:0 "Розблоковує рішення запросити §Yнейтральні§! та §Yдемократичні§! §Yазійські§! та §Yокеанійські§! нації до нашого альянсу"
 JAP_currently_trying_to_become_a_nations_guardian_flag:0 " Наразі намагається стати опікуном нації"
 JAP_demand_tonkinese_bases_tt:0 "Франція володіє регіоном §YТонкін§!"
 JAP_destroyer_3:0 "Клас «Akizuki»"
 JAP_develop_new_fighters:0 "Розробка нових винищувачів"
 JAP_develop_sichuan_aluminium_deposits:0 "Розвиток родовищ бокситів у Сичуані"
 JAP_east_asia_development_board_desc:0 "Створення Коаін допоможе координувати політику уряду щодо Китаю, спрямовану на підтримку промислового та комерційного розвитку в Китаї для посилення підтримки японського правління на окупованих територіях. Її також можна використовувати як інструмент для забезпечення робочою силою наших шахт та військової промисловості."
 JAP_establish_state_of_ceylon_decision:0 "Створити державу Цейлон"
 JAP_expand_manchurian_railways_desc:0 "Інфраструктура в Маньчжурії гостро потребує розвитку, щоби відповідати потребам індустріалізації, що йде повним ходом."
 JAP_form_the_dai_nippon_fujinkai:0 "Сформувати Дай Ніппон Фуджінкай"
 JAP_further_increase_froms_dependency_decision:0 "Подальше збільшення §Y[FROM.GetAdjective]ої§! економічної залежності"
 JAP_gather_royal_pacifists_support_desc:0 "У імператорській родині є багато тих, хто не підтримує ідею військового домінування над політикою та доктрину тотальної війни. Ми повинні звернутися до Садако Кудзьо, Нобухіто та Коїчі Кідо, щоб заручитися їхньою підтримкою для усунення військових елементів з нашого уряду."
 JAP_give_it_your_all_for_the_emperor_desc:0 "[ROOT.GetAdjective]ий чоловік — це трудяга, який палко вірить у нашого великого імператора. Ми повинні пропагувати це і просувати сумлінну працю та старанність як основну частину [ROOT.GetAdjective]ого суспільства."
 JAP_heavy_tank_equipment_1_short:0 "Type 95"
 JAP_heavy_tank_equipment_3:0 "O-I"
 JAP_instill_the_spirit_of_bushido:0 "Прищепити дух Бушідо"
 JAP_instill_the_spirit_of_bushido_tt:0 "Вмикає тактику: §Y$tactic_grand_banzai_charge$§!"
 JAP_jungle_adaptation_desc:0 "Наша армія усвідомила, що не зможе проникнути в порослі джунглями регіони Бірми та Великої Індонезії, якщо не буде вжито рішучих заходів. Тому вони звернулися з проханням створити спеціальні дивізії для джунглів, щоб вони могли очолити атаку та прорвати ворожі лінії."
 JAP_kikues_new_model:0 "Нова модель Кікуе"
 JAP_kodoha_fascism_DEF:0 "Японський шьогунат"
 JAP_limit_the_emperors_power_desc:0 "Імператор залишається важливою частиною нашого суспільства, але все ще може бути загрозою для нашої демократії, якщо забажає. Ми повинні докласти зусиль, щоб обмежити владу нашого конституційного монарха, аби ніколи більше не втратити наші демократичні цінності."
 JAP_male_leader_2_text:0 "його"
 JAP_mio_trait_unified_research_and_development:0 "Єдині науково-дослідні та дослідно-конструкторські роботи"
 JAP_modern_escorts:0 "Сучасні кораблі супроводу"
 JAP_national_mobilization_law_desc:0 "Новий законопроєкт про військову службу покликаний до почуття обов'язку в наших громадянах, так само як і змусити їх усвідомити необхідність війни."
 JAP_pacific_union_communism:0 "Тихоокеанський Союз Радянських Соціалістичних Республік"
 JAP_pacific_union_democratic:0 "Велика Східноазійська федерація"
 JAP_public_works_desc:0 "Розширення інфраструктури в масштабах усієї країни принесе незаперечну користь і створить багато робочих місць."
 JAP_raid_category_fluff_text_nuclear_raids:0 "§LАвіаційна служба Імператорської армії§!"
 JAP_rebuild_the_civil_service_desc:0 "Ми поставимо на важливі посади найбільш здібних чиновників, щоби забезпечити найадекватніше керівництво країною."
 JAP_sea_fate_of_the_imperial_family_desc:0 "Настав час розглянути і ліквідувати останні залишки спадкового правління в Японії. Ми можемо діяти багатьма шляхами, хоча нам слід бути обережними, оскільки імператорська сім'я все ще користується великою популярністю серед нашого народу. Ми повинні вирішити, яка доля спіткає колишнього імператора та його родину."
 JAP_sea_tripartite_pact:0 "Запропонувати Троїстий пакт"
 JAP_seek_foreign_investments_desc:0 "Тепер, коли ми відкрилися ще більше, ми повинні використати наші новостворені зв'язки для залучення інвестицій іноземного капіталу та попутного розвитку власної промисловості."
 JAP_sent_jodbajab_to_mongolia:0 " Відправлено Джодбажаба до Монголії"
