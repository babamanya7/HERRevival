 mtg_britain.1.c:0 "Якщо він не змінить свою думку, король мусить зректися."
 mtg_britain.1000.d:0 "Цього ранку нам стало відомо про смерть короля Георга VI. Стрес від війни остаточно підірвав здоров'я монарха, що, разом з його постійним курінням і розвиненими через це артеріосклерозом і хворобою Бюргера, вже змусило його до взяти на себе багато з королівських обов'язків батька.\n\nТепер Елізабет зійде на батьківський трон під ім'ям Єлизавета ІІ. Її готували до цього моменту відтоді, як морганатичний шлюб її дядька визначив майбутню лінію спадкування, і очікується, що вона, незважаючи на свій юний вік, стане гарною королевою."
 mtg_britain.108.d:0 "[From.GetAdjective] представники завзято зберігають мовчання з приводу дотримання договору. Жодних ознак скорочення ними чисельності основних кораблів не виявлено."
 mtg_britain.15.b:0 "Він буде нашим королем незважаючи ні на що."
 mtg_britain.27.d:0 "Як згадувалося раніше, представники держави [From.GetNameDef] запропонували укласти союз із ціллю продовження співпраці та подальшої ізоляції італійців."
 mtg_britain.40.d:0 "[From.GetAdjective] уряд звернувся до нас із пропозицією повернути нам Гібралтар в обмін на вступ до альянсу."
 mtg_britain.46.a:0 "Отже, у нас немає вибору."
 mtg_britain.5.t:0 "Королівський шлюб Едуарда VIII"
 mtg_britain.52.b:0 "Їхній комунізм відрізняється від комунізму Сталіна."
 mtg_britain.57.a:0 "Вперед, до безумовної перемоги!"
 mtg_britain.65.d:0 "За підтримки нашого народу держава [From.GetNameDefCap] розпустила уряд і оголосила про проведення нових виборів. Втім, ці вибори — лише фарс, в якому лоялісти отримають нищівну перемогу."
 mtg_britain.70.a:0 "Ми мусимо зміцнити свою владу військовими методами."
 mtg_britain.73.d:0 "Напруга на півночі країни досягла кульмінації, і жорстокі зіткнення між мусульманами та індуїстами переросли у громадянську війну. Сформований тимчасовий мусульманський уряд проголосив незалежність Пакистану і висловив готовність захищати її військовими засобами."
 mtg_britain.75.d:0 "[RAJ.GetNameDef] нарешті визнає нашу незалежність. В умовах стрімкого ослаблення підтримки у них не залишається сенсу продовжувати цю виснажливу війну."
 mtg_germany.1.a:0 "Отже, ми приєднаємось до них."
 mtg_netherlands.21.d:0 "У процесі спілкування з представниками держави [From.GetNameDefCap] з'ясувалося, що вони прагнуть встановити контроль над нашими справами... Деякі другорядні комітети уряду вже вважаються «необов'язковими», і тому цими питаннями управляє безпосередньо Амстердам."
 mtg_netherlands.25.t:0 "[From.GetNameDefCap] відкидає нашу пропозицію"
 mtg_netherlands.26.a:0 "Ми не можемо дозволити іноземним силам втручатися у справи Карибського регіону."
 mtg_netherlands.3.d:0 "[HOL.GetAdjective] уряд відмовився від нашої пропозиції надати «захист» островам Ей-Бі-Сі."
 mtg_netherlands.34.a:0 "Це неможливо."
 mtg_netherlands.61.a:0 "Тоді це війна."
 mtg_netherlands.78.t:0 "[From.GetNameDef] приймає пропозицію про створення федерації"
 mtg_news.18.t:0 "[From.GetName] міркує про вторгнення на континент"
 mtg_news.24.b:0 "Ми, справжні фашисти, мусимо триматися разом."
 mtg_news.25.desc:0 "[Root.GetAdjective] та іспанські уряди виступили сьогодні із спільною заявою про повернення Гібралтару націоналістичної Іспанії та укладення нового союзу, спрямованого на військову співпрацю двох держав."
 mtg_news.43.c:0 "Червоні пішли один проти одного..."
 mtg_news.45.desc:0 "Насильницьке народження держави [From.GetNameDefCap] і досі викликає нестабільність у новоствореній нації, де сильна влада збройного ополчення, особливо на околицях країни. Стають все очевиднішими культурні відмінності між мусульманським населенням північного заходу і північного сходу Індії, зневажливе ставлення західних пакистанців до своїх східних земляків роздмухує пожежа, яка ще не повністю згасла з часів громадянської війни. Тепер схід, оголосивши, що з нього досить і що він теж хоче повної незалежності, взявся за зброю."
 mtg_news.47.desc:0 "У державі [From.GetNameDef] проводиться великомасштабний проєкт з освоєння земель, що отримав назву «Зьойдерзее». Після створення за допомогою греблі Афсльойтдейк озера Ейсселмер, розробки Вірінгермеера та Ноордоостполдера зараз району суші, який буде відвойований біля моря. Весь проєкт, без сумніву, розтягнеться на довгі роки, але осушення вже зробило доступними невеликі райони, і вигода для [From.GetAdjective] індустрії від цього відчутна."
 mtg_news.58.c:0 "І це м'яко кажучи. Нідерландці ще своє отримають."
 mtg_usa_canadian_corridor.3.t:0 "[CAN.GetNameDefCap] відмовляється"
 mtg_usa_civil_war_fascists.16.t:0 "Перенесення цивільного виробництва"
 mtg_usa_foreign_support.12.a:0 "Вони отримають свої крила."
 mtg_usa_foreign_support.15.desc:0 "Представник Срібного легіону звернувся з проханням допомогти їм профінансувати ряд проєктів з будівництва кораблів у державі [USA.GetNameDef]. За підтримки деяких членів [USA.GetAdjective] уряду Срібний легіон хоче скрити альтернативні джерела фінансування."
 mtg_usa_foreign_support.16.desc:0 "[From.GetAdjective] уряд схвалив виділення коштів на покупку кораблів. Згідно з поточним планом, кораблі та озброєння для них передбачається купувати окремо, а з початком війни поєднати їх. Цей процес, безсумнівно, займе якесь час."
 mtg_usa_pacific_pacification.1.desc_a:0 "Делегація [USA.GetAdjective] уряду прибула для обговорення безпеки наших тихоокеанських володінь у Тихому океані. Відзначивши продовження нестабільності в Китаї і ситуацію в Японії, президент [USA.GetLeader] побажав захист територій [GET_AUSTRALIA_NEW_ZEALAND_STATUS] в обмін на ряд привілеїв і прав.\n\n [USA.GetAdjective] сторона стверджує, що скористається цим правом тільки для забезпечення безпеки територій [GET_AUSTRALIA_NEW_ZEALAND_STATUS], у маріонетки."
 mtg_usa_pacific_pacification.3.b:0 "Ми не можемо дозволити собі війну."
 mtg_usa_secure_asia.2.desc:0 "Після тривалих переговорів, отримавши гарантії своєї особистої безпеки, [From.GetLeader] наділив нашого особливого посла винятковими консультаційними правами і дозволив нам значною мірою впливати на їхні внутрішні справи."
 mtgnavalfolder:0 "Флот"
 mughal_west_britain_company_ADJ:0 "Британськ"
 murder_trotsky_desc:0 "Лобовою атакою ми навряд чи досягнемо успіху. Потрібно використовувати більш тонкий підхід, щоб підібратися до Троцького впритул і потім ударити його в спину."
 murder_trotsky_exfiltration_outcome_fail:0 "Наш агент був затриманий охоронцями Троцького і переданий владі. Йому висунуто звинувачення у вбивстві."
