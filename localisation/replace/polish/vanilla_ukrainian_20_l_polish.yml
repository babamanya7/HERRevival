 LAT_state_paganism_desc:0 "Вплив діевтурібів на армію майже повністю затьмарив вплив будь-яких інших вірувань. Целміньша оточують фанатики, які заявляють, що готові боротися і вмирати за старих богів, тоді як насправді об'єктом їх поклоніння є сам Целміньш. ми можемо почати поширювати ідеологію «Перконкрустсу» у церквах та храмах по всій країні."
