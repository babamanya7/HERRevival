 sp_nuclear_war_support_generic_reward_desc:0 "Успішне випробування, а також пов'язане з ним жорстко контрольоване висвітлення в ЗМІ призвело до розуміння громадськістю того, що ми наближаємося до розробки якоїсь суперзброї, яка може бути використана для перемоги над усіма ворогами."
