 SOV_war_measures_in_the_east:0 "Військові заходи на сході"
 SOV_winter_warriors_desc:0 "$SOV_secure_finland_desc$"
 SOV_women_in_aviation_desc:0 "У минулому відсталі елементи суспільства вважали польоти суто чоловічою справою. Однак жінки по всьому світу проігнорували це і довели, що вони нічим не поступаються своїм колегам-чоловікам. Ми мусимо заохочувати наших жінок пробувати свої сили в польотах, відбирати серед них найбільш здібних пілотів."
 SOV_wreckers_sabotage_railways_desc:0 "Без припасів армії не можуть ні рухатися, на воювати."
