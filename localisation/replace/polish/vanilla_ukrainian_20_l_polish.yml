 DOD_hungary.123.a:0 "Можливо, це і справді не найкращий план."
 DOD_hungary.141.c:0 "Наслідувати [From.GetAdjective] приклад."
 DOD_hungary.145.e:0 "Велика Британія."
 DOD_hungary.146.t:0 "[HUN.GetLeader] звертається за дипломатичною підтримкою"
 DOD_hungary.150.desc:0 "Нещодавнє дослідження сучасних винищувачів виявило слабке місце наших ВПС. Наші винищувачі сильно відстають у розвитку техніки інших країн. Міністерство авіації розпочало реалізацію програми зі створення сучасного винищувача у найкоротші терміни. На розробку літака самотужки у нас піде неприйнятна кількість часу, тому ми вирішили придбати ліцензію за кордоном. На це виділено додаткові кошти.\n\nЕксперти не можуть зійтись на думку, який тип літака найкраще підходить для оновлення наших винищувальних авіакрил."
 DOD_hungary.152.desc_heavy_fighter:0 "Міністерство авіації бажає придбати новий важкий винищувач для перехоплення цілей на великій відстані та супроводу бомбардувальників, але міністерство закордонних справ відзначило, що політичні та дипломатичні мотиви також мусять впливати на вибір,"
 DOD_hungary.165.a:0 "Відмінно."
 DOD_hungary.55.e:0 "Звернутися до Італії"
 DOD_hungary.63.t:0 "Провал посередницьких зусиль"
 DOD_hungary.64.desc_ROM_refused:0 "Ми щосили намагалися заручитися підтримкою інших держав, але, схоже, сьогодні лише мало хто готовий захищати уклад, створений Версальським і Тріанонським договорами. Тепер, коли балом правлять такі задираки, як [HUN.GetLeader], всі питання можна вирішувати лише силою."
 DOD_hungary.65.b:0 "Угорщину потрібно зупинити, поки вона не підім'яла під себе весь регіон."
 DOD_hungary.67.t:0 "Переговори зірвані"
 DOD_hungary.70.t:0 "Трансільванський компроміс"
 DOD_hungary.81.t:0 "[From.GetNameDefCap] повертає Південну Словаччину"
 DOD_hungary.83.a:0 "Схвалити дії Угорщини."
 DOD_romania.11.t:0 "[From.GetNameDefCap] погоджується увійти до «санітарного кордону»"
 DOD_romania.86.desc:0 "У відповідь на чутки про корупцію у закупівельному процесі армії король пообіцяв провести незалежне розслідування. У пресу потрапив попередній текст доповіді, який не лише підтвердив чутки, а й безпосередньо пов'язав із розкраданнями найближчих радників короля.\n\nЦя історія стала ганьбою для всього уряду. Король вимагає від нас дій, але повністю підтримує радників, замішаних у справі."
 DOD_yugoslavia.1.desc:0 "Після того, як ми вирішили укласти пакт із Німеччиною, група офіцерів ВПС організувала переворот. Військові захопили низку опорних пунктів у Белграді. Короля Петара оголосили повнолітнім і, таким чином, [YUG.GetLeader] був усунений від влади.\n\nНаселення підтримало переворот. Натовпи на вулицях скандують «Краще війна, ніж пакт! Краще могила, ніж рабство!»\n\nПеред урядом стоїть непростий вибір. Ми можемо підтримати переворот, вступивши цим у війну з Німеччиною, або спробувати дати відсіч, започаткувавши кровопролитну громадянську війну."
 DOD_yugoslavia.184.t:0 "Бійці-комуністи вимагають зміни режиму"
 DOD_yugoslavia.30.t:0 "[YUG.GetNameDef] стоїть перед вибором"
 DOD_yugoslavia.31.t:0 "Німці чинять тиск"
 DOD_yugoslavia.46.a:0 "Їх уже можна записувати у вороги."
 DOD_yugoslavia.501.desc:0 "Карагеоргієвичі з держави [From.GetNameDef] бажають продовжити свій королівський рід та життя нації за допомогою королівського весілля. Схоже, що [From.GetLeader] захоплений: його серце вкрала принцеса [Root.GetPrincessName] з роду [Root.GetFamilyName]. Правитель просить її руки Якщо дівчина прийме пропозицію, [From.GetNameDef] і [Root.GetNameDef] породняться. союзу, він зробить його дуже ймовірним у найближчому майбутньому."
 DOD_yugoslavia.70.t:0 "[From.GetNameDefCap] бажає підписати Троїстий пакт"
 DOD_yugoslavia.802.desc:0 "Нарешті з напруженістю на [From.GetAdjective] межі буде покінчено. [From.GetAdjective] уряд погодився повернути окуповані далматські території законному югославському власнику. [Root.GetLeader] сьогодні оголошує, що [From.GetLeader] — справжній друг [Root.GetAdjective] свободи та самовизначення, і відтепер дві країни співпрацюватимуть як союзники."
