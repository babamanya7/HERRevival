 XIC_send_a_representative_to_sheng_shicai_desc:0 "Лі Кенун погодився домагатися співпраці між нами та КПК за умови, що обидві сторони шукатимуть контактів із [SOV.GetAdjective]ими представниками і спробують отримати їхню допомогу в боротьбі проти Японії. Ми повинні використати наші контакти в [SIK.GetNameDef], щоб здобути прихильність [SOV.GetLeader]."
