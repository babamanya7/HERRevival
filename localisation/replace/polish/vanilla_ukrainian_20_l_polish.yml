 NSB_poland_monarchist_events.1.desc:0 "Тепер, коли [From.GetLeader] стає королем держави [From.GetNonIdeologyName], [From.GetAdjective] уряд, швидше за все, скористається цим, щоби зміцнити свої претензії на державу [Root.GetNon. Пропагандою та провокаціями [From.GetNameDef] намагатиметься підготувати опозицію режиму, який очолює [Root.GetLeader], і підтримати переворот.\nЯкщо пропаганда виявиться ефективною, [Root.GetLeader] зіткнеться з переворотом, а [Root.GetNonIdeologyName] From.GetAdjective] маріонетки."
 NSB_poland_royal_election.3.a:0 "Божевільна ідея, але й часи нині божевільні. Отже, у нас є король!"
 NSB_polish_fascist_events.201.a:0 "У нас немає вибору."
 NSB_polish_fascist_events.4.desc.first:0 "Ми багатьом пожертвували у своїй боротьбі з більшовизмом — нашим західним кордоном, незалежністю, життям безлічі солдатів. Настав час попросити щось натомість. Тепер, коли [SOV.GetNameDef] наближається до поразки війні, ми бачимо багато можливостей для розширення польської території."
 NSB_soviet_academy_of_sciences.1.a:0 "Великий крок уперед!"
 NSB_soviet_civil_war_common.128.a:0 "Ми переможемо"
 NSB_soviet_communist_civil_war.004.t:0 "Звернення до міжнародних революційних бригад"
 NSB_soviet_communist_civil_war.006.b:0 "Їх потрібно зупинити, поки все не вийшло з-під контролю."
 NSB_soviet_fascist_tsarist.17.a:0 "Тепер німцям буде про що турбуватися."
 NSB_soviet_fascist_tsarist.28.a:0 "Шкода! Напевно, у них є для цього причини."
 NSB_soviet_foreign_politics_events.11.desc:0 "Війна все більш ймовірна, і [FROM.GetAdjective] уряд почав тиснути на нас, щоби ми підвищували свою боєздатність. Він хоче, щоби ми значно збільшили ополчення і знизили час навчання, а також щоб у нас було більше дивізій, готових виступити на фронт. Таким чином вони хочуть зняти навантаження з [FROM.GetAdjective] дивізій."
 NSB_soviet_foreign_politics_events.154.a:0 "Почати приготування!"
 NSB_soviet_foreign_politics_events.20.a:0 "Ми стоїмо пліч-о-пліч!"
 NSB_soviet_foreign_politics_events.210.a:0 "Опір буде марним."
 NSB_soviet_foreign_politics_events.265.desc:0 "[From.GetNameDef] відкидає нашу пропозицію миру і обіцяє продовжувати боротьбу, допоки [ROOT.GetAdjective]а окупація [FROM.GetAdjective]их територій не закінчиться і війна не прийде на нашу територію."
 NSB_soviet_foreign_politics_events.267.desc:0 "[FROM.GetAdjectiveCap]ий уряд не вразив нашим пропозицією про примирення і відкинув його.\nЗдається, [FROM.GetLeader] щось задумав, так що ми мусимо уважно стежити за його амбіціями надалі..."
 NSB_soviet_foreign_politics_events.272.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 NSB_soviet_foreign_politics_events.282.desc:0 "[FROM.GetNameDef] представляє нам офіційне комюніке, в якому вимагає інтеграції держави [ROOT.GetNameDef] як незалежну радянську соціалістичну республіку, керувати якою буде [FROM.GetNameDef]. [FROM.GetLeader обіцяє, що наша держава отримає певний ступінь автономії, а Червона армія буде готова захищати нашу територію як свою власну. вкладає в нашу країну, і зростання [FROM.GetAdjective] впливу на нашу економіку, варто ретельно подумати перед тим, як відповідати."
 NSB_soviet_foreign_politics_events.32.desc:0 "[FROM.GetAdjectiveCap]ий держсекретар не взяв на себе труд відповісти на наші вимоги особисто. Натомість до нашого посольства надійшов лист за підписом заступника міністра з культурного розвитку, в якому говорилося, що хоч вони і поважають наші у творі альтернативної історії, але просять не використовувати для цього офіційні канали зв'язку."
 NSB_soviet_paranoia_system_events.21.a:0 "У нашій армії таким не місце."
 NSB_soviet_paranoia_system_events.24_paranoia_accused_increase_tt:0 "£SOV_paranoia_text_icon Політична параноя підвищується, виходячи з рівня чистки командувача військової частини: §R[?SOV.SOV_accused_unit_leader_level]§!"
 NSB_soviet_policies_of_collective_security.11.a:0 "Марна трата часу."
 NSB_soviet_spanish_civil_war.2.desc:0 "Співчутливі з Радянського Союзу організували мобілізацію і підготовку сотень бійців міжнародних бригад, що підтримують наше прагнення виграти війну, не залишаючи революцію. Ці браві представники міжнародного пролетаріату і селянства готові."
