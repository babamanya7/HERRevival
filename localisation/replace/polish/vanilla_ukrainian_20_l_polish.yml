 LIT_claim_prussia_desc:0 "У Східній Пруссії проживає безліч представників литовських та польських меншин. Час об'єднати цих людей із їхніми товаришами під крилом держави [Root.GetNameDef]."
 LIT_events.3.d:0 "В останні десять років яблуком розбрату між державами [Root.GetNonIdeologyName] і [From.GetNonIdeologyName] є [Root.GetAdjective] окупація Вільнюса, історичної столиці держави [From.GetNonIdeologyName]. добре ставляться один до одного, [From.GetLeader] пропонує укласти вічний мир на умовах здачі державою [Root.GetNameDef] контролю над Вільнюсом та відмови від усіляких претензій на [From.GetAdjective] територію.[From.GetLeader] говорить, що незгода з такою пропозицією буде дуже прикро, але не призведе до розв'язання державою [From.GetNonIdeologyName] війни з державою [Root.GetNameDef]."
