 sp_land_generic_reward_engine_bonus_1_desc:0 "Останні доопрацювання експериментального двигуна для прототипу «[SpecialProject.GetName]» призвели до значного покращення загальної продуктивності танкових двигунів. Ретельна праця [Character.GetName] та [Character.GetHerHis] команди розширила межі інженерії, обіцяючи розширені можливості в разі впровадження цих інновацій у наші серійні танкові двигуни."
