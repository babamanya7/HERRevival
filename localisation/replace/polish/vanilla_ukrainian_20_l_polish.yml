 CZE_raise_more_industrial_funds_desc:0 "Від часів Австро-Угорщини і до наших днів промисловість була серцем нашої нації. Забезпечивши необхідний бюджет та фінансування, ми сприятимемо її подальшому процвітанню в цій неспокійній Європі."
