 ROM_a_deal_with_the_devil:0 "Угода з дияволом"
 ROM_artillery_equipment_1:0 "105mm Schneider M1913"
 ROM_claim_banat:0 "Претендувати на область [764.GetName]"
 ROM_claim_ljubljana:0 "Претендувати на область [853.GetName]"
 ROM_crack_down_on_extremism_desc:0 "Під правлінням короля наш політичний ландшафт різко змістився вправо. Тим не менш, екстремістські елементи суспільства все ще панують над серцями та умами наших людей. Ми повинні виступити проти цих шахраїв, щоби забезпечити більш помірковане майбутнє для нашого народу."
 ROM_expand_the_university_of_bucharest_desc:0 "Поліпшуючи якість і спроможність нашого університету, ми можемо збільшити список найкращих і найталановитіших, на яких ми покладаємося в наших технологічних досягненнях."
 ROM_join_allies_desc:0 "Гарантії недостатньо — настав час оголосити повну підтримку західних демократій і стати з ними на захист свободи."
 ROM_military_modernization_desc:0 "Навіть із підтримкою Заходу, ми мусимо подбати про модернізацію армії, щоби наші союзники встигли підтримати нас, поки все не буде втрачено."
 ROM_secure_greece_desc:0 "Грецію — хоча вона часто була союзником у минулому — потрібно змусити прийняти домінування Румунії в регіоні."
 ROM_submarine_3_desc:0 "The Requinul and Marsuinul submarines were built by the Germans for their Romanian allies. They were commissioned in 1943. The ships were based on the German Type VII submarines. The ships were medium-sized submarines, displacing 600 tons, and were armed with six 533mm torpedo tubes."
 ROOT_invest_in_turkish_state_heavy_industry_desc:0 "Важка [FROM.GetAdjective]а промисловість залишається недорозвиненою в багатьох регіонах країни. Нам під силу це виправити."
 ROOT_voted_nay_megali_effect:0 "Голоси проти!"
 RULE_ALLOW_PARATROOPERS_BLOCKED_DESC:0 "Держави не можуть використовувати десантування при жодних умовах. Десантні дивізії все ще можливо створювати, але вони не зможуть виконувати десантні операції."
 RULE_ALLOW_RELEASE_NATIONS_NOT_ETHIOPIA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! не може дати незалежність цій державі."
 RULE_ALLOW_RELEASE_NATIONS_NOT_ITALY_TOOLTIP:0 "§Y[ROOT.GetName]§! не може дати незалежність §YЮгославії§! як країні. Однак вона може відпустити будь-яку іншу країну з осердними землями в Югославії."
 RULE_ALLOW_RELEASE_NATIONS_NOT_YUGOSLAVIA_TOOLTIP:0 "§Y[YUG.GetName]§! може дати незалежність цій державі лише крізь гілку §Yсамоврядування§! в §Yдереві фокусів§!."
 RULE_ALLOW_RELEASE_NATIONS_NO_SLOVAKIA_TOOLTIP:0 "§Y[HUN.GetName]§! та §Y[CZE.GetName]§! можуть звільнити цю країну лише крізь події або фокуси."
 RULE_ALLOW_REVOKE_GUARANTEES:0 "Зняття гарантій"
 RULE_ALLOW_SCORCHED_EARTH_ALLOWED_DESC:0 "Держави можуть вільно випалювати землю."
 RULE_DEMOCRATIC_JAP_AI_DESC:0 "§HЯпонський§! ШІ намагатиметься реформувати країну в демократію, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_FASCIST_INDEPENDENT_POL_AI_DESC:0 "§HПольський§! ШІ намагатиметься прийняти фалангізм і протистояти Німеччині."
 RULE_HISTORICAL_SWI_AI_DESC:0 "Швайцарія зберігатиме нейтралітет, водночас будуючи свої війська та укріплення, готуючись до будь-якого нападу. Вони нададуть певну підтримку союзникам до кінця війни."
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI:0 "Випадкова соціал-демократія"
 RULE_OPTION_BALKAN_DOMINANCE_ROM_AI_DESC:0 "§HРумунський§! ШІ намагатиметься встановити панування над своїми балканськими сусідами, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_COMMUNISM_PER_AI:0 "Комунізм: Народна партія"
 RULE_OPTION_COMMUNIST_COMINTERN_DESC:0 "§HПортугалія§! стане на один курс із Радянським Союзом, підтримуватиме Іспанську республіку і спробує вступити в Комінтерн."
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC:0 "Під впливом Великої Британії §Hдемократичний уряд§! скине режим Салазара та з британською допомогою зосередиться на розвитку країни, а потім вступить до лав Союзників."
 RULE_OPTION_EMPIRE_AFG_AI_DESC:0 "Афганський ШІ спробує повалити короля Захіра-шаха і замінити його еміром Сеїдом Мір Мухаммадом Алімом-ханом, який потім спробує об'єднати афганські племена. Потім Афганістан буде прагнути розширити свої кордони, щоб зрештою утворити нову Афганську імперію."
 RULE_OPTION_ETH_ANARCHIST_desc:0 "ШІ спробує перетворити Ефіопію на анархо-комуністичну федерацію за підтримки комуністів й анархістів з усього світу."
 RULE_OPTION_FREE:0 "Вільно"
 RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY_RAJ_AI_DESC:0 "Індія розпадеться, а англійці відновлять Ост-Індійську компанію."
 RULE_OPTION_HISTORICAL:0 "Історичний шлях"
 RULE_OPTION_HISTORICAL_AFG_AI_DESC:0 "Афганський ШІ намагатиметься залишатися нейтральною протягом усього періоду, одночасно намагаючись отримати економічні поступки від Союзників, Комінтерну та країн Осі."
 RULE_OPTION_HISTORICAL_PHI_AI:0 "$RULE_OPTION_HISTORICAL$"
 RULE_OPTION_INDEPENDENCE_DEM_MAN_AI_DESC:0 "Маньчжурський ШІ спробує здобути незалежність і взяти на себе керівництво новим Бейянським урядом, рухаючись відповідною гілкою дерева національних фокусів."
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI:0 "Монархізм — підкорення"
 RULE_OPTION_ONE_YEARS:0 "1 рік"
 RULE_OPTION_PEACE_ONLY:0 "Лише в мирний час"
 RULE_OPTION_SAME_IDEOLOGY:0 "Лише при однаковій ідеології"
 RULE_OPTION_SPR_FRAGMENTED:0 "Іспанія роздроблена"
 RULE_VOLUNTEERS_BULGARIA_SCW_TT:0 "§RБолгарія не може надсилати добровольців іспанській фракції, яку не підтримує.§!"
 RULE_VOLUNTEERS_SOVIET_SCW_COVERT_POUM_TT:0 "§RРадянський Союз досі слідує сталіністській доктрині та не може надсилати добровольців іспанській фракції, яка повстала проти республіканського уряду.§!"
