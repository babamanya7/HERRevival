 JAP_super_heavy_tank_equipment_1:0 "Type 2604"
 JAP_the_crysanthemum_throne_desc:0 "Фракції в нашій армії надто багато сперечаються і не можуть дійти згоди щодо того, кого висунути на посаду наступного прем'єр-міністра. Оскільки ситуація настільки нестабільна, Імператору було б доцільно втрутитися і взяти її під прямий контроль."
 JAP_the_ie_system_and_socialism_desc:0 "Традиційна система Іє, що визначає організацію сімей, історично формувала соціальні структури, ділову практику і навіть організацію компаній у нашій країні. Ми повинні забезпечити її збереження, але з наголосом на тому, що держава є авторитетною фігурою в ній."
 JAP_the_spirit_of_the_ikko_ikki:0 "Відродити дух ікко-іккі"
 JAP_tokko_arresting_anti_army_disidents_mission:0 "Токко заарештовує дисидентів, налаштованих проти армії"
