 SEA_PHI_political_events.10.desc:0 "Як ми і пропонували, [FROM.GetNameDef] відправив нам партію [PHI_GetTradedEquipment] в обмін на торговельні та транспортні судна, які зараз пливуть до портів [FROM.GetNameDef]."
 SEA_PHI_political_events.42.a:0 "Агінальдо вже вів нас до незалежності раніше."
 SEA_PHI_political_events.45.desc:0 "[FROM.GetAdjective]ий уряд звернувся до нас із планами боротьби за незалежність проти [USA.GetNameDef]. Ці плани ще не приведені в дію, але вони просили, щоб коли [PHI.GetNameDef] таки вимагатиме незалежності, ми підтримали їхню вимогу і приєдналися до їхньої боротьби, якщо їм буде відмовлено."
 SEA_PHI_political_events.49.t:0 "[FROM.GetName] дозволяє незалежність"
 SEA_PHI_political_events.53.desc:0 "Приєднавшись до місії $USA_douglas_macarthur$ у [PHI.GetNameDef] і відіграючи в ній певну роль з 1935 року, а останнім часом — ще активнішу, $USA_dwight_d_eisenhower$ тепер повернувся додому. Під час місії він здобув цінний військовий досвід, зокрема вперше пілотував літак і працював з командирами на кшталт $USA_douglas_macarthur$, які мали фундаментально відмінні ідеї щодо реформування [PHI.GetAdjective]ої армії."
 SEA_PHI_political_events.63.desc:0 "Термін чинного президента [ROOT.GetLeader] добігає кінця, і незабаром відбудуться вибори наступного президента. Хоча успіхи керівництва [ROOT.GetLeader] формують багатообіцяючу картину можливості його подальшого лідерства, деякі виборці прагнуть нового напрямку для наших реформ і нового президента, який би їх вів."
 SEA_PRC_faction_events.11.t:0 "Дурень [FROM.GetLeader] відхиляє нашу пропозицію"
 SEA_PRC_faction_events.2.t:0 "Насування вторгнення"
 SEA_PRC_faction_events.20.a:0 "Ця людина каже правду!"
 SEA_PRC_faction_events.40.c:0 "Старі вірності лише стримуватимуть нас"
 SEA_PRC_faction_events.52.a:0 "Темні часи на них чекають, безсумнівно"
 SEA_PRC_faction_events.60.a:0 "Ми приймемо [FROM.GetName] до [ROOT.GetFactionName]"
 SEA_PRC_faction_events.70.desc:0 "[FROM.GetLeader] надіслав до нас делегацію, намагаючись переконати нас приєднатися до їхньої фракції. Вони кажуть, що ми стоїмо на роздоріжжі, де вирішується майбутнє Азії. За словами делегації [FROM.GetName], є лише один шлях уперед, щоб забезпечити нашу незалежність від західних колонізаторів — і це шлях разом."
 SEA_PRC_faction_events.71.desc:0 "У листі від [FROM.GetNameDef] [FROM.GetLeader] просить нас передати наших азійських підданих під їхню опіку в новоствореному [FROM.GetFactionName]."
 SEA_PRC_fourth_army_incident.5.a:0 "Вимагати дій від [CHI.GetLeader]"
 SEA_PRC_misc_events.8.desc:0 "Зі свого печерного житла на горі Фенікс у горах поблизу Яньаня — яке він ділив з іншими лідерами [ROOT.GetCommunistParty] — Мао, окрім складання віршів, писав про теми, що варіюються від військової тактики до політики."
 SEA_PRC_political_events.12.a:0 "Що за день!"
 SEA_PRC_political_events.13.t:0 "[FROM.GetName] відмовляється відпустити нас"
 SEA_PRC_political_events.19.desc:0 "Конфлікт між [PRC.GetNameDef] та [CHI.GetNameDef] підірвав нашу армію, оскільки деякі з наших командирів перейшли до комуністів. Чи справді вони підтримують [PRC.GetNameDef], чи просто слідують туди, куди дме вітер — ще належить з'ясувати."
 SEA_PRC_political_events.6.a:0 "Новий день"
 SEA_PRC_political_events.7.a:0 "Яка прикрість"
 SEA_PRC_request_aid.11.a:0 "Як шкода!"
 SEA_PRC_request_aid.3.t:0 "[FROM.GetName] відмовляється надсилати допомогу"
 SEA_PRC_request_aid.9.t:0 "[FROM.GetName] хоче підписати угоду про технологічну співпрацю"
 SEA_border_incidents_events.2.a:0 "Наказати війсьлам негайно висуватися!"
 SEA_china.24.t:0 "[FROM.GetName] скасовує Договір дев'яти держав"
 SEA_china_democratic.4.a:0 "Це їхня втрата"
 SEA_china_democratic.6.a:0 "Дозволити їм продовжувати"
 SEA_china_warlords.1.a:0 "Нехай приходять і спробують"
 SEA_imperial_influence_events.100.t:0 "Фракція Армії втрачає вплив"
 SEA_imperial_influence_failure_event_option_6:0 "І мавпи падають з дерев"
 SEA_imperial_influence_failure_event_option_7:0 "Розлиту воду не повернеш у тацю"
 SEA_japan_foreign_policy.10.t:0 "[FROM.GetNameDefCap] вимагає окупації області [671.GetName]"
 SEA_japan_foreign_policy.125.desc:0 "[FROM.GetLeader] люб'язно прийняв нашу пропозицію офіційно оформити альянс між нашими державами і вже розпочав ініціативи щодо інтеграції в нашу сферу. Сьогодні день для святкування!"
 SEA_japan_foreign_policy.127.desc:0 "Зрадливий [FROM.GetLeader] покинув нас на користь комуністів у [JAP.GetNameDef], порушивши угоди, підписані між нашими країнами наприкінці Громадянської війни в Росії. Чи варто нам покарати їх за це ренегатство?"
 SEA_japan_foreign_policy.127.t:0 "[FROM.GetNameDefCap] приєднується до П'ятого Інтернаціоналу"
 SEA_japan_foreign_policy.135.desc:0 "Раніше сьогодні [ROOT.GetLeader] та різні лідери [JAP.GetAdjective]ої армії провели спільне проголошення, оголосивши про створення нової [ROOT.GetAdjective]ої держави. Ми переможемо всіх наших ворогів!"
 SEA_japan_foreign_policy.40.desc:0 "Зі створенням Великої східноазійської сфери співпроцвітання виникло питання. Чи переслідуємо ми обіцяну мету азійського процвітання, чи забираємо те, що належить нам по праву, і стверджуємо наш контроль над Азією більш прямолінійно?"
 SEA_japan_foreign_policy.45.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прибув до нашої столиці сьогодні з пропозицією. Вони бажають, щоб ми розширили нашу спільну економічну діяльність і поглибили інтеграцію з ними. Це значно допомогло б нашій економіці, але в усьому цьому є щось підозріле..."
 SEA_japan_foreign_policy.50.b:0 "Перемога або смерть!"
 SEA_japan_foreign_policy.61.a:0 "Це було передбачувано"
 SEA_japan_foreign_policy.66.desc:0 "Сьогодні [ROOT.GetLeader] та різні командувачі [JAP.GetAdjective]ої армії зробили спільну прокламацію, оголосивши про створення нової [ROOT.GetAdjective]ої держави. Ми переможемо всіх наших ворогів!"
 SEA_japan_foreign_policy.73.a:0 "Вони покинули нас..."
 SEA_japan_foreign_policy.81.b:0 "Якщо таке їхнє бажання..."
 SEA_japan_foreign_policy.83.desc:0 "Наші великі друзі в [FROM.GetNameDef] люб'язно прийняли нашу пропозицію про створення взаємного анти-[SOV.GetAdjective]ого пакту. Делегати підписують необхідні документи, щоб втілити угоду в реальність прямо в цей момент, також триває підготовка до швидкого вторгнення в [SOV.GetNameDef], якщо це стане необхідним."
 SEA_japan_foreign_policy.83.t:0 "[FROM.GetLeader] підписує пакт"
 SEA_japan_foreign_policy.85.t:0 "Закликати учасників пакту до війни"
 SEA_japan_foreign_policy.90.t:0 "[FROM.GetAdjective]а згода на промислову торгівлю"
 SEA_japan_foreign_policy.96.a:0 "Відмінно!"
 SEA_japan_popup_events.10.a:0 "Як це безчесно! Ми повинні діяти негайно!"
 SEA_japan_popup_events.22.desc:0 "Почувши новину про скасування суперечливого Закону про збереження миру, армійський гарнізон у своїй штаб-квартирі в замку Осака відкрив вогонь по вірних уряду гарнізонах, розташованих за межами парку. Схоже, вони не відступлять без бою і готові розірвати душу нашої нації, якщо це означатиме збереження їхньої гегемонії. Ми повинні здолати їх!"
 SEA_japan_popup_events.24.a:0 "Ми повернули собі майбутнє!"
 SEA_japan_popup_events.26.b:0 "Настав час скинути це японське ярмо!"
 SEA_japan_popup_events.27.desc:0 "Оскільки в Японії зараз вирує громадянська війна між військовими та урядом, корейський народ зрозумів, що це момент, щоб повернути контроль над своєю країною та вигнати японських гнобителів. Корейський півострів знову розквітне під правлінням власного народу."
 SEA_japan_popup_events.28.b:0 "Сікоку досить віддалений"
 SEA_japan_popup_events.34.a:0 "Ми повинні використати їхні захоплюючі традиції"
 SEA_japan_popup_events.41.a:0 "Вони помиляються"
 SEA_japan_popup_events.48.desc:0 "Після висадки ворожих військ на нашій землі [ROOT.GetLeader] ввів воєнний стан і оголосив національну надзвичайну ситуацію, доки загарбники не будуть витіснені з нашої землі. Ніхто не знає, скільки часу це може зайняти, але всі знають, що земля знову опинилася під абсолютним контролем роду Токугава."
 SEA_warlords.14.b:0 "$wtt_political_warlord_support.10.b$"
 SEA_warlords.21.t:0 "$wtt_political_warlord_support.22.t$"
 SEA_warlords.27.a:0 "Чудові новини"
 SEA_warlords.37.b:0 "Ми здаємося"
 SEA_warlords.48.a:0 "Ми повернемо їх під наш контроль!"
 SEA_warlords.67.t:0 "[FROM.GetLeader] відхиляє наш запит"
 SEND_VOLUNTEERS_DESCRIPTION_NO_DIVISIONS_BUT_PLANES:0 "§RВам потрібно обрати одну або більше армій, або ж обрати добровольчі літаки, щоби надіслати пропозицію.§!\n$CURRENT|H$ з ваших дивізій є частиною добровольчих військ, а вашу підсумкову верхню межу — $MAX|H$ ($LIMITREASON$)."
 SEND_VOLUNTEERS_DESCRIPTION_TOO_MANY_DIVISIONS:0 "§RВи обрали більше дивізій ($SEND$), ніж Вам дозволено надіслати. Зніміть вибір із кількох армій або розділіть армії на менші.§!\n$CURRENT|H$ з ваших дивізій є частиною добровольчих військ, а вашу підсумкову верхню межу — $MAX|H$ ($LIMITREASON$)."
 SERVER_PRIVATE:0 "Особистий"
 SHIP_IS_PRIDE_OF_FLEET:0 "Судно $NAME|H$ призначене як §Hгордість ВМС§!"
 SHIP_REPAIR_NOW:0 "§HНегайний ремонт!§!\nКорабель відділиться як окрема оперативна група та повереться на близьку морську базу для ремонту.\nВін повернеться до поточної оперативної групи після повного ремонту.\n§GКлацніть§!, щоби відділити.\n§GShift + клацніть§!, щоби позначити кілька кораблів і відділити їх як одну оперативну групу, відпустивши §GShift§!."
