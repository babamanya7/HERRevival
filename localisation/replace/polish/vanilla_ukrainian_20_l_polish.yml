 SOV_leningrad_polytechnical_institute:0 "[195.GetName]ський політехнічний інститут"
 SOV_lessons_of_war_desc:0 "Які би плани ми не мали до війни, вони здебільшого не пережили контакту з ворогом. Ми мусимо бути відкритими до уроків, які дає нам ця війна, і не дотримуватися застарілих догм. Тільки тоді ми зможемо зупинити відступ і знову перейти в наступ."
 SOV_liberation_of_the_european_proletariat_desc:0 "Безхребетні буржуазні уряди Західної Європи продемонстрували цілковите небажання протистояти фашизму. У майбутній великій боротьбі між фашизмом і комунізмом вони не відіграватимуть жодної ролі. Проте робітники цих країн готові боротися разом з нами проти лиха фашизму. Ми просто мусимо дати їм уряди, які готові боротися."
 SOV_light_cruiser_2_desc:0 "The Komsomolets class light cruisers were series of hypothetical vessels. They were somewhat of a mix of older and new technologies. Using the incomplete hulls of the Svetlana and Admiral Nakhimov classes, the ship's construction costs were reduced. Equipped with six twin turrets of smaller, destroyer caliber guns and adequate AA armament they were suited for scouting and a destroyer flotilla leader role. The overall look of the ships bears similarities to the Kirov class cruisers."
 SOV_long_range_raiders_desc:0 "Зважаючи на відстань від наших військово-морських баз до основних судноплавних шляхів, нашим нинішнім підводним човнам буде важко дістатися до багатих мисливських угідь. Ми мусимо розробити підводні човни більшої дальності, щоб гарантувати, що зможемо атакувати наших ворогів там, де їм буде найболючіше."
 SOV_memories_of_1905:0 "Пам'ять про 1905-й"
 SOV_military_offensive_name_hamburg:0 "Гамбургський наступ"
 SOV_molotov_line_forts_4:0 "Додати §Y4 наземні укріплення§! $SOV_molotov_line_forts_where$"
 SOV_moscow_trial_real_name:0 "[GetMoscowTrialIndex] Московський процес"
 SOV_new_soviet_man:0 "Нова радянська людина"
 SOV_order_227:0 "Наказ Nº 227"
 SOV_organization_of_the_partisans_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$\n$MODIFIER_OPERATIVE_SLOT$: §G+1§!\n\n"
 SOV_panslavic_nationalism_desc:0 "Росія здавна була найбільшим і найстаршим братом у нашій слов'янській родині. Якщо є один урок, який ми мали б засвоїти вже давно, то це те, що на слов'ян завжди будуть нападати, знущатися і пригноблювати, якщо ми не будемо триматися разом."
 SOV_paranoia_medium_increase_effect_tt:0 "£SOV_paranoia_text_icon Політична параноя збільшується на [?SOV_paranoia_medium_increase|R]"
 SOV_pc_of_mortar_armament_name_default:0 "Наркомат мінометного озброєння"
 SOV_pc_of_the_ussr_navy_default:0 "Наркомат ВПС СРСР"
 SOV_plan_start_of_uprising_tashkent_desc:0 "Побудова нашої бази у регіоні Великого степу означає, що наші спини будуть у безпеці. Це означатиме довгий марш до Москви, але більша частина боїв відбуватиметься на нашому фронті. Крім того, заручитися підтримкою в цьому регіоні буде відносно легко."
 SOV_policy_of_collective_security:0 "Політика колективної безпеки"
