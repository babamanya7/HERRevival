 CHI_strat_bomber_equipment_1:0 "CAMCO Type 236"
 CHI_strengthening_our_resolve_desc:0 "Старі фракції сперечаються, а нинішнє керівництво недостатньо сильне, щоб об'єднати нас. Необхідна зміна курсу, оскільки Республіка повинна вистояти, а не розпастися."
 CHI_technological_cooperation:0 "Технологічне співробітництво"
