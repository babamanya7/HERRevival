 POL_anti_capitalist_decisions_desc:0 "Капіталізм — це хвороба на Землі. Хоча багато з цих країн називають себе «демократичними», вони просто поневолюють пролетаріат в умовах буржуазної демократії, і обов'язок кожного соціаліста — визволити своїх товаришів."
 POL_assemble_the_regency_council_desc:0 "Акт 5 листопада був обіцянкою Центральних держав звільнити вільне і незалежне Польське королівство з попелу Російської імперії. Утворена в результаті регентська влада не змогла знайти монарха перед тим, як передати всі повноваження Пілсудському, але оскільки Санація не змогла сформувати стабільний уряд, можливо, настав час відновити регентство, щоб знайти для Польщі її законного короля."
 POL_atomic_physics_institute_desc:0 "Ми мусимо не втратити наш шанс стати першими, хто приборкає енергію розщепленого атома."
 POL_claim_prussia:0 "Захопити Східну Пруссію"
 POL_divide_lit:0 "Розділити Литву"
 POL_expand_strikes_to_factories_tt:0 "Дозволяє залучити до страйку індустріальні області."
 POL_four_year_plan_mission:0 "Підготуватися до наступного чотирирічного плану"
 POL_invite_exiled_nobility:0 "Запросити дворянство у вигнанні"
 POL_local_eastern_plans_desc:0 "Часто нашим військовим можна довіряти розробляти плани між собою, але в такій війні, як ця, необхідне пряме втручання в невеликих масштабах. Кожен дюйм землі має значення, і ми повинні застосовувати наш досвід до найменших конфліктів, якщо ми хочемо спинити [SOV.GetAdjective]ий імперіалізм!"
 POL_looming_peasants_strike_mission:0 "Насувається селянське повстання"
 POL_medium_tank_equipment_1:0 "10TP"
 POL_morges_pact_desc:0 "З відновленням демократії в Польщі амбіції Фронту Морж майже завершені. Залишилося лише зміцнити наші відносини з Францією і відновити франко-польський альянс."
 POL_prepare_german_line_desc:0 "Кордон із Німеччиною є найбільш вразливою частиною нашої держави. Якщо ми хочемо утримати Варшаву від рук німців, ми повинні зустріти їх безпосередньо на кордоні і сміятися, коли вони намагатимуться зламати нашу волю."
 POL_promote_falangism_south_america:0 "Просувати фалангізм у §YПівденній Америці§!"
 POL_ship_torpedo_4:0 "5x 533-мм ТА (пневм.)"
 POL_soviet_industry_desc:0 "[GetSovietIndustrialInvestmentDesc]"
 POL_strat_bomber_equipment_1_short:0 "Pszczoła"
 POL_support_falangists_in_the_americas_desc:0 "Американський континент сповнений фалангістських рухів, в основному в країнах Латинської Америки. Розширення нашого альянсу на американський континент необхідне не лише для захисту інтересів фалангістів у всьому світі, але й для захисту наших побратимів від американського впливу."
 POL_the_national_commonwealth:0 "Національна співдружність"
 POL_the_prusya_army_desc:0 "Наш кордон з Пруссією до жаху незахищений. Всі наші інвестиції в прусські укріплення нічого не означатимуть без солдатів, які їх утримуватимуть."
 POPS_invalid-script-code:0 "Помилка клієнту (неправильний скрипт)"
 POR_arsenal_do_alfeite:0 "Arsenal do Alfeite"
 POR_buy_at_in_britain_desc:0 "Ми укладемо угоду з державою [ENG.GetNameDef] на придбання сучасних протитанкових гармат."
 POR_cooperate_with_french_militants:0 "Співпрацювати з французькими бойовиками"
 POR_fuzileiros:0 "Fuzileiros"
 POR_intervention_in_spain_desc:0 "Позиція іспанського уряду для нас неприйнятна. Їхні амбіції стали загрозою нашим ідеалам і нашому народу, тому ми повинні вжити заходів і силою викорінити це вороже ставлення."
 POR_invest_in_sandalwood_and_coffee_production_desc:0 "Our primary plantation company of Timor, the SAPT, stands to gain greatly from additional government investments. If we fund them now, their products may bring us great returns in the near future."
 POR_italian_destroyers_construction_progress:0 "Поступ збірки [ITA.GetAdjective]их есмінців"
 POR_join_the_comintern:0 "Приєднатися до Комінтерну"
 POR_light_aircraft_focus_desc:0 "Авіація постійно розвивається, і ми повинні розвивати відповідну авіаційну промисловість, щоб підтримувати нашу армію."
 POR_light_ship_engine_1:0 "«Parsons» 33 000 к. с. н. в."
 POR_major_cancel_portuguese_blockade_evasion_desc:0 "Нам не потрібно продовжувати використовувати португальські конвої для обходу британської блокади. Ми негайно скасуємо договір."
 POR_national_gold_reserves_desc:0 "У цій війні можна отримати прибуток, залишаючись нейтральним. Обидві сторони змагаються за нашу дружбу та наші товари, і якщо нам вдасться задовольнити їхні вимоги, наші золоті запаси можуть значно зрости."
 POR_ogme:0 "OGME"
 POR_restart_investment_into_timor:0 "Restart Investment into Timor"
 POR_securing_the_free_world_desc:0 "Якщо ми хочемо стати великою державою, було б добре почати діяти як така. Ми захистимо менші країни, які поділяють наші ідеали та інтереси, від абиякої можливої зовнішньої загрози."
 POR_ship_torpedo_sub_4:0 "6x 533-мм торпедний апарат"
 POR_staff_wargames:0 "Штабні військові ігри"
 POR_support_the_spanish_nationalists_desc:0 "Ми повинні продемонструвати нашу підтримку іспанським націоналістам, які борються за славу своєї країни проти комуністичної та анархічної загрози."
 POSITIONING_CARRIER_RATIO_PENALTY:0 "Більше ворожих палубних літаків: $NUM|+%$"
 PRC_AI_BEHAVIOR:0 "@PRC Китайська радянська республіка"
 PRC_avenge_the_century_of_humiliation_desc:0 "1800-ті роки стали століттям приниження з боку західних держав. Настав час повернути борг."
 PRC_capital_ships_desc:0 "Інформація, яку ми маємо щодо проєктів [SOV.GetAdjective]их лінійних крейсерів класу «Кронштадт», може стати гарною основою для розширення нашого флоту кораблями основного класу. Ці проєкти є настільки сучасними, що [SOV.GetAdjective]а промисловість мала з ними труднощі, але для нашого флоту, що розширюється, ці виклики варті результату."
 PRC_convince_wang_jiaxiang_desc:0 "£BoP_right_texticon $PRC_wang_jiaxiang$ був одним із 28-ми, переконаймо його приєднатися до нас знову"
 PRC_dockyard_construction_efforts_desc:0 "Оскільки ми прагнемо створити флот, нам потрібно буде зробити інвестиції в кілька галузей для виробництва суден, тоді як інші заводи — наприклад, ті, що виготовляють артилерію — повинні бути залучені до співпраці з цим абсолютно новим сектором."
 PRC_establish_domestic_aircraft_production:0 "Налагодити внутрішнє виробництво літаків"
 PRC_establish_friendly_bases:0 "Створити бази в тилу ворога"
 PRC_halt_land_revolution_desc:0 "Для збереження стабільності революційну земельну програму відкладено. Хоча селянство бурчить, місцеві еліти заспокоєні, і короткострокова внутрішня єдність збережена."
 PRC_heavy_tank_aa_equipment_3:0 "PGZ 43 D"
 PRC_hold_speech_questioning_tradition:0 "£BoP_left_texticon Поставити під сумнів старі традиції"
 PRC_infantry_equipment_0_short:0 "Type 88"
 PRC_infiltrate_state:0 "Проникнути в [FROM.GetName]"
 PRC_infiltrate_uprising_effect_3:0 "В області з'явиться комуністичне ополчення.\n"
 PRC_infiltration_only_level_2_bolshevik_tt:0 "Доступні лише рішення до §Yрівня 2§!. Розблокуйте §Yрівень 3§!, обравши фокус §Y$PRC_supreme_infiltration$§!."
 PRC_lessons_of_the_west_desc:0 "Ми поглянемо за межі наших кордонів, щоб побачити, які уроки можна винести з інших націй, навчаючись у тих, чия промисловість досягла меж, яких наша ще не досягла.\n\nМи повинні наздоганяти."
 PRC_literacy_programs:0 "Ліквідація безграмотності"
 PRC_make_agrarian_to_urban_tt:0 "Змінює §Y$PRC_agrarian_reform$§! на §Y$PRC_urban_society$§!, що дає:"
 PRC_medium_tank_equipment_3:0 "Type 43 Zhōng"
 PRC_night_attack_desc:0 "Навчання нашої армії нічним атакам дозволить ще більше використати наш досвід асиметричної війни."
 PRC_on_guerilla_warfare_desc:0 "Як теоретик і автор праць про партизанську війну, Мао та його новобута влада забезпечать належне використання наших невеликих незалежних сил."
 PRC_one_with_the_people:0 "Єдині з народом"
 PRC_rebuild_28_bolshevik:0 "Відновити 28 ½ більшовиків"
 PRC_strengthen_the_left_wing_of_the_kmt:0 "Посилити ліве крило Гоміньдану"
 PRC_the_long_march_towards_progress_desc:0 "Ми повинні продовжувати прогресувати. Ми можемо відставати технологічно, але ми не залишимося такими. Ресурси повинні бути спрямовані на зміцнення освітнього сектору в [ROOT.GetNameDef]."
