 BUL_the_eastern_front_stab_tt:0 "Втратити базову стабільність на основі §Yпідтримки комунізму§!."
 BUL_the_fatherland_front_desc_coup:0 "Лідери Вітчизняного фронту запланували переворот і тепер чекають відповідного моменту, щоб ударити.\nІмовірність перевороту:\nБазова величина: §Y10%§![GetAtWarFfPercentage][GetAllyAtWarFfPercentage][GetSovNeighborFfPercentage] [GetCommunistSovFfPercentage]"
