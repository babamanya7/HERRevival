 JAP_unlocks_pearl_harbor_raid:0 "Відкриває §Yрейд§!:\nУдар по Перл-Харбору на §Y[USA.GetNameWithFlag]§!"
 JAP_upgrade_the_oriental_development_company_desc:0 "Компанія східного розвитку наразі має дев'ять активних філій, що діють майже на всіх наших заморських територіях. Вони відіграють вирішальну роль у спрямуванні прогресу регіонів у руслі, що відповідає нашим амбіціям, і керують промисловим та сільськогосподарським розвиток, прагнучи насамперед ефективності. Тому для покращення наших колоній ми повинні розширити цю компанію та забезпечити її всіма необхідними ресурсами."
