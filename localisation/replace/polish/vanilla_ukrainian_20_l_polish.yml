 tfv_raj.43.a:0 "Дідько."
 tfv_south_africa.15.desc.b:0 "Після довгих дискусій з нашими [GER.GetAdjective]ими друзями, вони погодилися надіслати нам партію легких танків. Хоча їх і небагато, але саме вони можуть вирішальним чином схилити чашу терезів на нашу користь."
 tfv_south_africa.16.t:0 "$tfv_south_africa.15.t$"
 tfv_south_africa.64.t:0 "Свобода для Кенії"
 tfv_south_africa.65.t:0 "Свобода для держави [MAD.GetName]"
 tfv_south_africa.66.t:0 "Свобода для держави [BOT.GetName]"
 tfv_south_africa.80.d:0 "Звільнившися з-під влади колоніальних гнобителів, [GAB.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [GAB.GetAdjective]ого уряду."
 tfv_south_africa.92.d:0 "Звільнившися з-під влади колоніальних гнобителів, [MLI.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [MLI.GetAdjective]ого уряду."
