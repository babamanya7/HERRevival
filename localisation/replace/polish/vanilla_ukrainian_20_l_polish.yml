 CZE_destroy_the_fascist_threats_desc_enemy_ger:0 "Ми всі знаємо, хто є найбільшою загрозою миру в Європі. [GER.getnamedefCAP] потрібно зупинити чим швидше, тим краще. Якщо ніхто інший не бажає цього зробити, це доведеться зробити нам."
 CZE_establish_air_defense_zones_desc:0 "Ми могли б розмістити наші нові зенітні батареї в ключових точках і на заводах, а також створити зони протиповітряної оборони через вузли зв'язку на територіальному рівні для оптимізації точності нашої ППО."
 CZE_expand_the_rome_protocols_desc:0 "Наш новий уряд набагато більше солідарний з урядом у [ITA.capital.GetCapitalVictoryPointName], ніж у [GER.capital.GetCapitalVictoryPointName]. Враховуючи розбіжності між ними щодо Австрії, приєднання до Римських протоколів може дати [ITA.GetNameDef] необхідну впевненість, щоб дотримуватися свого нинішнього курсу замість того, щоб звертатися до [GER.GetNameDef]."
 CZE_fighter_equipment_1_short:0 "B-534"
 CZE_fortification_studies_desc:0 "Безперечно, ми мусимо зміцнювати свої межі, але як? Французи нещодавно побудували приголомшливий оборонний рубіж — лінію Мажіно; можливо, відправивши делегацію для вивчення їх успіхів, ми зможемо вирішити власне завдання."
 CZE_fourth_sudetenland_fortification_program_desc:0 "Судети мають міцну систему укріплень, але вона повинна стати ще сильнішою."
 CZE_german_minor_ally_desc:0 "Німеччина набирає сили, і ми можемо приєднатися до її слави. Ми готові наслідувати її приклад, переслідуючи попутно власні цілі."
 CZE_go_left_desc:0 "Майбутнє за комунізмом! Потрібно докласти всіх зусиль, щоби наше суспільство і наш уряд відповідали марксистським ідеалам."
 CZE_great_moravia:0 "Велика Моравія"
 CZE_inf_and_artillery_advancement_2_desc:0 "Королева поля бою, сучасна артилерія стане значним множником сили нашої армії."
 CZE_infiltrate_collaborationist_organizations_desc:0 "Призначення ([ROOT.GetAdjective]их) осіб, лояльних до уряду у вигнанні, на керівництво колабораціоністськими організаціями може здатися дивним, але це ідеальний спосіб підірвати їхню діяльність і бути в курсі подій."
 CZE_integrate_fortification_engineers_tech_tt:0 "Відкриває: §Y«Залучені інженери-фортифікатори»§!\n§YІнженерна рота§!:\nУкріплення §G+10.00%§!.\n§Y(Форт)§!\n Оборона §G+10.0%§!"
