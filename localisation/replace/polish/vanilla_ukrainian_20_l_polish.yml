 CHI_60_divisions_plan_desc:0 "Наші іноземні радники рекомендують відмовитися від вирішення проблеми чисельністю та пропонують натомість кардинально новий план: сформувати угруповання з навчених дивізій, які не поступаються ворогам умінням. Експериментальний проєкт уже запущено."
