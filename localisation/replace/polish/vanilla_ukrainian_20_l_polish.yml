 INS_realign_supply_chains:0 "Переорієнтація ланцюжків постачання"
 INS_reduce_land_taxes_desc:0 "Високі податки, накладені на володіння землею, ускладнили корінним індонезійцям володіння плантаціями та бізнесом. Хоча це полегшило нам утримання монополії на каучукову промисловість, це викликало економічні проблеми по всій країні. Нам слід розглянути можливість зниження цих податків до їхніх попередніх ставок, що уможливить роботу менших приватних каучукових плантацій."
 INS_reform_education_system_2_desc:0 "Якщо ми хочемо, щоб Індонезія в майбутньому стала багатою країною, усі індонезійці, незалежно від місця народження, повинні мати право на освіту."
 INS_reorganize_freedom_fighter_militia_2_tt:0 "Додає §Y3 $militia$ батальйони§! до шаблону §Y«Борці за свободу»§!."
 INS_republic_socialist_party_long:0 "Соціалістична партія Індонезії"
 INS_revolution_events.5.desc:0 "Революціонери в Голландській Ост-Індії проголосили незалежність від [HOL.GetNameDef] і окупували великі міста. [HOL.GetLeader] терміново звернувся до нас, просячи допомогти їм військово, поки вони готують вторгнення."
