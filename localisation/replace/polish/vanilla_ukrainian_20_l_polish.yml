 BUL_bulgarian_territorial_expansion_arranged_tt:0 "Землі з модифікатором §Y$bulgarian_territorial_expansion_arranged$§! будуть передані Болгарії, коли вони опиняться під контролем будь-якого члена альянсу, а Болгарія приєднається до альянсу з Німеччиною."
 BUL_communist_menace:0 "Комуністична загроза"
 BUL_cooperation_integrate_bzns_desc:0 "Донедавна ми співпрацювали з фракцією [GetBznsName] як із окремою, хоч і близькою нам організацією. Настав час нарешті ввести його в наш уряд."
 BUL_crush_the_communists_no_cooperation_tt:0 "\n§RЗавадити уряду Болгарії співпрацювати з фракцією [GetBsName] у майбутньому.§!"
 BUL_darzhavna_aeroplanna_rabotilnitsa:0 "Държавна аеропланна работилница"
 BUL_draw_up_a_plan_for_regicide_desc:0 "Час завершити останні приготування та визначити місце та час операції."
 BUL_ff_percentage_sov_communist:0 "\n[SOV.GetFlag][SOV.GetName] — комуністична держава: §Y15%§!"
 BUL_german_industrial_agreements_cap_approach_tt:0 "Поточні [GER.GetAdjective]і заводи: [?BUL.BUL_german_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_medium_cap|R0] (виконано фокус §Y$BUL_approach_germany$§!)\nПриєднання до альянсу §Y[GER.GetFactionName]§! збільшить межу до [?BUL.BUL_industrial_investments_max_cap|G0]."
 BUL_high_popularity_increase_tt:0 "[?BUL.BUL_faction_high_increase|=G0] популярність фракції."
 BUL_industrial_autarky_desc:0 "Наші протекціоністські реформи були надзвичайно успішними в підтримці економіки та промисловості країни, тому ми мусимо продовжувати цей курс дій і впроваджувати нові реформи, які наближають Болгарію до автаркії."
 BUL_light_metal_exploitation_desc:0 "Оскільки наша військова промисловість висуває великі вимоги до наших природних ресурсів, необхідно докласти зусиль для розширення внутрішнього виробництва. Хоча наші родовища залишаються невеликими, цей скрутний час, безумовно, вимагає їх експлуатації."
 BUL_mineral_extraction_in_the_rhodopes_desc:0 "Родопи багаті на корисні копалини, такі як хроміт, залізна руда, цинк і свинець, і наші експерти з оптимізмом переконані, що правильне розвідування території може привести до відкриття нових родовищ."
 BUL_nsm_media_banned_flag:0 "Заборонені ЗМІ £faction_bul_nsm §YНародного соціального руху§!."
 BUL_nsm_name_dat:0 "£faction_bul_nsm §YНародному соціальному руху§!"
 BUL_opression_imprison_bs_leaders_desc:0 "Ми заарештуємо лідерів $BUL_bs_name_gen$, тим самим відрубавши змії голову і завдавши організації потужного удару."
 BUL_opression_repress_bs_desc:0 "Не можна байдуже дивитися, як дисиденти й агітатори поділяють наш народ. Те, що роблять члени $BUL_bs_name_gen$ з нашим урядом, спричинить серйозні наслідки."
 BUL_peaceful_development:0 "Мирний розвиток"
 BUL_rearmament_desc:0 "Після поразки у Великій війні та укладення Ньойїського договору наша армія зазнала суворих обмежень. Зараз у Європі настають непрості часи, і, якщо ми хочемо зберегти територіальну цілісність Болгарії та свободу її народу, ми мусимо знайти спосіб позбавитися цих обмежень і на відновлювати армію."
 BUL_replace_national_naval_designer_tt:0 "Змінити ідею §Y$BUL_varna_naval_dockyard$§! на:\n$MODIFIER_INDUSTRIAL_REFIT_SPEED_FACTOR$: +10%§! \n$MODIFIER_REPAIR_SPEED_FACTOR$: +5%§! \n$naval_equipment_research$: +5%§!\n"
