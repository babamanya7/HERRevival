 CHI_tsr_national_construction:0 "Національне будівництво"
 CHI_tsr_reinstate_the_new_imperial_code:0 "Відновити Новий імперський кодекс"
 CHI_tsr_reinstate_the_new_imperial_code_desc:0 "Ближче до його сходження на престол юридичний радник Юаня, Аріга Нагао, розробив Новий імперський кодекс, заснований на японській імперській моделі. Хоча ми не бажаємо надто ретельно слідувати правовій основі такої держави-ізгоя, зрозуміло, що це матиме очікуваний ефект. З цією метою ми повинні взятися за розробку нової конституції на основі цього кодексу."
 CHI_tsr_the_reorganied_government_desc:0 "З розпадом режиму [CHI.GetLeader] та їхнім боягузливим відступом на захід ми залишаємося єдиною легітимною китайською державою. Щоб підтвердити це, [ROOT.GetLeader] відвідав гробницю Сунь Ятсена і заявив, що дотримуватиметься республіканських принципів, які той колись встановив."
 CHI_unlock_faction_goal_north_subjugated_tt:0 "Якщо цей фокус поїздки буде обрано першим, то буде розблоковано ціль альянсу §Y$faction_goal_north_subjugated_name$§!."
 CHL_a_french_alliance:0 "Об'єднати франкофонів"
 CHL_address_the_mapuche_conflict_desc:0 "Країна дестабілізована, але за Ібаньєса ситуація для мапуче все одно не стане кращою, тому ми мусимо діяти швидко. Тубільний активіст і політик Мануель Манкілеф почав збирати та об'єднувати численні розрізнені організації мапуче, щоби повалити чилійську державу раз і назавжди."
 CHL_align_the_police_desc:0 "$CHL_expand_the_investigations_police_desc$"
