 ETH_preparing_for_the_inevitable_desc:0 "Владці в усьому світі не потерплять наших радикальних реформ в [ETH.GetNameDef] через страх, що їх власний народ вимагатиме того ж. Ми повинні бути готові до їхньої неминучої спроби зруйнувати наш спосіб життя."
