 germany.102.t:0 "Греція відмовилась"
 germany.1042.desc_subject:0 "[ROOT.GetAdjectiveCap]а міць не знає меж. Нам було передано території Судетської області, первісно під [FROM.GetAdjective]им контролем. Наш маріонетковий правитель у державі [FROM.GetNameDef], [FROM.GetLeader], запевнився, щоби влада та [FROM.GetAdjective]і організації дотрималися умов договору без заперечень."
 germany.106.d_no_vienna:0 "Відколи відносини з Угорщиною охололи, і вона вирішила приєднатися до іншого альянсу, про наш первісний план про передачу їм частини Трансільванії довелося забути. Натомість, краще прислухатися до болгарів у їхньому територіальному спорі з Румунією щодо Південної Добруджі, яку Румунія відібрала в 1913 році."
 germany.106.d_second_vienna_accepted_north:0 "Після передачі Угорщині Північної Трансільванії Болгарія нагадала нам про їхній територіальний спір із Румунією щодо Південної Добруджі, яку Румунія відібрала в 1913 році."
 germany.111.d:0 "Югославія вчинила нерозумно, відхиливши нашу пропозицію розрядити напруженість у регіоні."
 germany.122.d:0 "Німеччина надіслала вимогу про передачу Судетської області з метою «захистити німецьке населення» в регіоні.\n\nУ даній ситуації ясно видно, що це безвихідь. Тут не буде жодних переговорів і дипломатії. Вони отримають Судетську область, або оголосять війну, щоб отримати своє."
 germany.25.t:0 "Військові радники відкликані"
 germany.28.b:0 "Ні, доля Австрії буде іншою."
 germany.51.d:0 "Чехословаччина — це ракова пухлина в серці Європи, і врешті-решт [GER.GetAdjective]ий народ вирішив ужити проти них заходів. Судетська область уже знаходиться під контролем Німеччини, і тепер унаслідок Мюнхенської угоди чехословацькі території, що законно належать Угорщині, будуть повернені в наш склад."
 germany.55.e:0 "Установити і Богемію, і Словаччину як маріонетки."
 germany.73.t:0 "Змова успішна"
 germany.85.a:0 "Держава [From.GetName] не лишиться сама!"
