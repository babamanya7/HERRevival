 INSHOL_loyalty_to_crown_desc:0 "Ост-Індія — це багато що, але перш за все ми лояльна голландська колонія. Королева Вільгельміна приведе нас до перемоги. Ми не повинні дозволити націоналізму покласти край майже 500-річній історії та продовжуватимемо підтверджувати нашу абсолютну вірність Короні."
 INSHOL_renville_agreement:0 "Ренвільська угода"
 INSHOL_sideline_the_volksraad_desc:0 "Петиція, подана Сутарджо, є явним порушенням статті 1 Конституції Нідерландів і лише спричинить труднощі для адміністрації Ост-Індії. На петицію має бути накладено вето."
