 CAN_mio_trait_cookie_carriers:0 "$CAN_cookie_carriers$"
 CAN_retool_angus_shops_desc:0 "Сучасній армії потрібна бронетехніка, і завод «Angus Shops», що належить Канадській тихоокеанській залізниці, може зайнятися її створенням. Необхідно переобладнати його та підготувати інфраструктуру для випуску танків."
 CAN_royal_regiment_of_canadian_artillery:0 "Королівський полк канадської артилерії"
 CAN_turner_valley_oilfield_desc:0 "Виявлене в 1914 нафтове родовище в Тернер-Веллі, що поруч із Калгарі, стало одним з найбільших в Імперії. Влада і промисловці повинні якнайшвидше активізувати його розробку."
