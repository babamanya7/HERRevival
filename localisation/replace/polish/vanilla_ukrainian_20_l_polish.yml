 SWE_five_year_plan_desc:0 "Зі створенням політбюро та націоналізацією всієї промисловості нам тепер потрібна агенція, яка могла б стежити за економічними справами та рекомендувати політичні рішення центральному комітету політбюро."
 SWE_food_stamps_revoke:0 "Скасувати: $SWE_food_stamps_activate$"
 SWE_form_rfsu_desc:0 "Нашою основною метою є забезпечення кращого медичного обслуговування наших громадян, ми створимо організації, які займатимуться сексуальним і репродуктивним здоров'ям. Це зменшить кількість захворювань і розширить можливості населення."
 SWE_ger_monument:0 "Пам'ятник лідеру Німеччини"
 SWE_gw_armored_car_equipment_short:0 "L-185"
 SWE_gw_tank_equipment:0 "Stridsvagn m/21"
 SWE_infrastructure_desc:0 "Значні частини [SWE.GetName] все ще знаходяться в сільській місцевості та на жаль недорозвинені. Ми повинні це виправити, щоб краще використовувати наші природні ресурси."
 SWE_italian_destroyers:0 "Купити італійські міноносці"
 SWE_nav_bomber_equipment_1_short:0 "Saab T18"
 SWE_nordland_ger_ADJ:0 "Нордичн"
 SWE_paid_holidays_desc:0 "Причиною великої напруги між працівниками та бізнесом стала проблема часу відпустки. Приватний сектор завжди робитиме найнеобхідніше, щоб підтримувати працівників, не порушуючи закону, водночас максимізуючи їхні прибутки. Настав час втрутитися державі регулюйте відпустки на користь працівників за зміну."
