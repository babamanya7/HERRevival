 NOR_a_valuable_partner_to_germany:0 "Цінний партнер для [GetNorwegianFascistOverlord]"
 NOR_alt_dem_military_industry_expansion_desc:0 "Ми не можемо покладатися на те, що інші країни постачають наше оснащення: зрештою, торговці війною сьогодні можуть стати військовими ворогами завтра. Ми повинні розширити наші промислові потужності, щоби виробляти матеріали, необхідні для ведення бою."
 NOR_alt_democratic_DEF:0 "Норвезький воєнний кабінет"
 NOR_broken_gun_policies_desc:0 "Щоб уникнути будь-яких майбутніх конфліктів, ми повинні довести, що ми лише прагнемо нейтралітету, а не готуємося вторгнутися в чужу країну. Тільки тоді великі держави не вбачатимуть у нас загрозу та залишать нашу країну в спокої. Ми віримо в це може бути досягнуто лише шляхом широкомасштабної демілітаризації, незважаючи на те, що думає [SWI.GetAdjective]а держава та їхня дурна Доктрина збройного нейтралітету."
 NOR_communist_preparation_decisions_category:0 "Розбурювання пролетаріату"
 NOR_convert_militias_to_regulars_TT:0 "Буде перетворено всі підрозділи §Yополчення§! на §Yрегулярну піхоту§!."
 NOR_convoy_defense_desc:0 "Перлиною нашої країни є її величезний торговельний флот, ось чому ми не можемо терпіти його марнування, нам потрібно покращити наші зусилля щодо його захисту, щоб він тривав і мав більший вплив на війну."
 NOR_crush_stalin:0 "[GetCrushStalinName]"
 NOR_demand_nationalizations:0 "Вимогти націоналізацію"
 NOR_denounced_tyranny:0 "Вони засудили тиранію"
 NOR_emergency_conversions_tt:0 "Будуть відкриті §Yрішення§! з переобладнання §Yконвоїв§! в §Yесмінці§!."
 NOR_expand_merchant_marine_desc:0 "Сучасна війна потребує ресурсів і обладнання, двох речей, яких [ROOT.GetName] відчайдушно не вистачає. Оскільки війна наближається, ми повинні бути впевнені, що у нас достатньо кораблів, щоб доставити все, що нам потрібно, щоб вижити. Так, у нас уже є більше цивільних кораблів ніж більшість націй, але ми очікуємо втратити багато з них на цьому шляху, і ми не можемо дозволити собі бути скороченими."
 NOR_expanded_conscription_drive_desc:0 "Поки боротьба не закінчиться, нам знадобляться свіжі війська, щоб живити поля битв, які формуватимуть історію відповідно до наших ідеалів. Кожен чоловік і жінка, здатні воювати, повинні приєднатися до наших лав, щоб наша батьківщина не була захоплена."
 NOR_fascist_deploy_prep_decisions_category:0 "Повстання з тіні"
 NOR_fascist_military_collaboration:0 "Військова співпраця фашистів"
 NOR_fighter_equipment_0_short:0 "Hauk"
 NOR_fortify_norway:0 "Зміцнення Норвегії"
 NOR_historical_deploy_prep_decisions_category:0 "Приготування до бурі"
 NOR_historical_deploy_prep_decisions_category_desc:0 "Незважаючи на всі наші зусилля, війна дійшла до наших берегів. Поки що ми зосереджували свою енергію на розвитку промисловості, економіки та інфраструктури нашої землі, але зараз вкрай важливо знайти способи використати це для захист [NOR.GetNameDef].\n\n\nІмовірна готовність держави [NOR.GetName]: [?NOR.NOR_country_preparedness]/30"
 NOR_investing_in_norway:0 "Інвестують у Норвегію"
 NOR_modify_prep_state_modifier:0 "Змінює §Yпідготовку області§!:"
 NOR_modify_royal_navy_dmod_TT:0 "Змінює §Y$NOR_royal_navy_dmod$§! на:"
 NOR_nasjonal_samling:0 "Nasjonal Samling"
 NOR_naval_expanion_desc:0 "Якщо ми хочемо вижити, нам потрібно захищати наші берегові лінії, і для цього нам знадобляться кораблі. Ми повинні перетворити кожен фйорд на верф."
 NOR_neutrality_party_long:0 "Ліві"
 NOR_norgesveldet_fascism:0 "Норвезька імперія"
 NOR_prepare_state_historical_desc:0 "Наша промислова база лежить у руїні, але ми готові докласти зусиль, щоб покращити ситуацію для людей держави [ROOT.GetName], і наші шанси на виживання, якщо станеться найгірше."
 NOR_radar_research:0 "Радарні дослідження"
 NOR_radar_research_desc:0 "Як країні з великою береговою лінією, життєво важливо, щоб ми могли її ефективно контролювати. Завдяки технологічному диву, яким є радар, ми можемо знати про наближення кораблів і літаків на великих відстанях."
 NOR_revolution_support_counter:0 "\n\n\nПовна підтримка нашої революції: [?NOR.NOR_country_preparedness]/[?NOR.NOR_comm_prep_max_preparedness]"
 NOR_submarine_4_desc:0 "KThe Utsira class consisted of four British Vampire-class submarines. They were built between 1943 and 1944, though only one was transferred to the Norwegian Navy in exile before the end of the war. The ships were only a moderate improvement over the preceding U-class. They displaced 545 tons, were armed with four 533mm torpedo tubes, and a diving depth of 90m."
