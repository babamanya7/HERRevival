 MUN_czech.1018.a:0 "Вони ніколи цього не очікуватимуть"
 MUN_czech.1033.d:0 "[FROM.GetAdjective]ий уряд у вигнанні під керівництвом $CZE_edvard_benesh$ просить нас прийняти їхню делегацію, оскільки вони ведуть боротьбу за відновлення суверенітету [CZE.GetNonIdeologyName]."
 MUN_czech.1045.d:0 "Зрозумівши, що під нашим захистом вони будуть у більшій безпеці, ніж наодинці, [FROM.getname] мудро приєдналася до нашої федерації. Це значно зміцнить наші позиції в Європі."
 MUN_czech.1052.d:0 "Після нової дипломатичної угоди між [FROM.GetAdjective]им та [SOV.GetAdjective]им урядами, [FROM.GetNameDef] впевнена, що [SOV.GetNameDef] захистить їх у разі конфлікту. Єдиною перешкодою є відсутність сухопутного зв'язку між ними. Тому [FROM.GetAdjective]і дипломати звернулися до нашого уряду з проханням дозволити прохід [SOV.GetAdjective]их військ через нашу територію до [FROM.GetAdjective]ої території у разі виникнення конфлікту."
 MUN_czech_bop.2.a_tt:0 "Зусилля наших сусідів із переозброєння змусили декого в нашій армії засумніватися в нашій здатності протистояти можливій агресії. Ми повинні заспокоїти армію своїми діями."
