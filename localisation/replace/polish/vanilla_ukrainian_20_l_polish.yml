 why_we_fight_effect:0 "Якщо в нас нема національного духу §Y$neutrality_idea$§!, ми зможемо створювати альянси.\n"
 wtt_border_conflict_escalate_to_war.1.desc:0 "Звіти розвідки вказують на те, що [From.GetAdjective]і сили зосереджені всередині області [their_state.GetName] для великої операції з просування в область [our_state.GetName]. З огляду на кількість ресурсів, які [From.GetLeader] готовий витратити на цю авантюру, зрозуміло, що це вже не просто суперечка щодо точного розташування лінії розмежування.\n\nПовномасштабна війна на горизонті."
 wtt_britain_lease_azores.5.desc:0 "Після закінчення воєнних дій у Європі [From.GetNameDef], згідно з укладеною угодою, збирається повернути нам Азорські острови. Ми вже надіслали групу для відновлення контролю над ними."
 wtt_china_shared.12.t:0 "Новий генерал для держави [From.GetNameDef]"
 wtt_china_shared.13.a:0 "Цінне надбання."
 wtt_germany.26.a:0 "Хай живе кайзер!"
 wtt_germany.31.d:0 "Англійці відмовилися нас підтримати, пославшись те що, що відновлення монархії — це внутрішня справа Німеччини. Якщо ми вирішимо воювати з німцями, то, схоже, доведеться робити це без союзника.\n\nГромадська думка у Франції проти війни, але Німеччина нарощуватиме сили, а повернення кайзера може пробудити колишні імперіалістичні настрої. Ультиматум буде не так категорично без підтримки Великобританії. Чи слід нам виступати проти німців самотужки?"
 wtt_germany.33.d:0 "Англійці та французи назвали саму думку про повернення нашого кайзера «крайнім неподобством»; за їх твердженням, не можна допустити, щоби передбачуваний розпал Великої війни знову повернувся на трон. Вони проводять мобілізацію і висунули ультиматум: ми маємо негайно відвести війська та повернути кайзери у місце посилання. Інакше війна неминуча."
 wtt_germany.43.desc:0 "Німецька імперія останнім часом посилила свою войовничу риторику, спонукаючи нас повернутися до часів колоніалізму. Незважаючи на втрату Ціндао, яку ми захопили у 1914 році, німці вирішили провести переговори, вимагаючи повернення свого старого анклаву. Можливо, за його допомогою нам вдасться укласти вигідну угоду..."
 wtt_germany.5.b:0 "Можливо, вони в чомусь мають рацію... У нас є інші кандидати."
 wtt_germany.5.d:0 "Боягузливі Нідерланди, які на протязі багатьох років так благородно надавали притулок Вільгельму II, відмовилися випустити його з країни і супроводили назад до його резиденції в Дорні. Своє рішення нідерландці пояснили тим, що стурбовані можливою дестабілізацією політичної ситуації в Європі.."
 wtt_germany.59.t:0 "Німеччина приймає Данциг і Познань"
 wtt_germany.68.t:0 "[From.GetName] пропонує відновити імперію"
 wtt_japan.126.t:0 "[From.GetName] пропонує укласти мир"
 wtt_japan.22.a:0 "Це зміцнить наш вплив на державу [Root.GetNameDef]."
 wtt_japan.31.desc:0 "Настав час визначити подальшу долю імператора та його сім'ї. У Японії, яку ми будуємо, спадковий статус не повинен відігравати жодної ролі."
 wtt_manchukou.3.desc:0 "[From.GetLeader] відповів на нашу великодушну пропозицію образами та прокльонами на адресу предків та особистих якостей Імператора, які не тільки не мають нічого спільного з реальністю, а й вкрай обурливі."
 wtt_news.10.d:0 "Ситуація стрімко загострюється..."
 wtt_news.14.c:0 "Дурні, вперті французи!"
 wtt_news.19.d:0 "Напрочуд хитра дипломатична угода..."
 wtt_news.21.desc:0 "[FROM.GetAdjectiveCap]а влада посилює свою риторику проти держави [SOV.GetNameDef], попереджаючи своїх східноєвропейських сусідів про навислу над континентом «Велику східну загрозу». І хоча щодо правомірності такої заяви можуть бути сумніви, ясно одне — [FROM.GetNonIdeologyName] має намір об'єднати Європу та налаштувати її проти Сходу."
 wtt_news.30.desc:0 "Надійшла звістка про те, що сьогодні вранці слідом за арештом, розпорядження про яке дав [CHI_xian_instigator.GetLeader], розстрільний взвод комуністів стратив Чана Кайші. Цю міру покарання після недовгого суду за звинуваченням у злочинах проти народу та партії проголосив [PRC.GetLeader]. Навіть безпосереднього втручання представника радянського уряду виявилося замало для скасування вироку.\n\nСтверджується, що [SOV.GetLeader] розлютився, почувши про «зраду» з боку лідера [PRC.GetLeader], і наказав заарештувати китайську делегацію Комінтерну.\n\nНовий лідер націоналістів [CHI.GetLeader] поклявся помститися за смерть Чана і «винищити» всіх комуністів."
 wtt_news.35.d:0 "Це здається спланованим заздалегідь."
 wtt_news.44.c:0 "Ким він себе уявив?"
 wtt_news.5.desc:0 "За повідомленнями з Рима, дуче сьогодні було застрелено прямо на вулицях міста. Після цього деякі представники уряду зробили низку кроків з метою вирвати владу з рук італійських фашистів. Було проведено низку арештів; військові загони оточили урядові будівлі та зайняли вулиці, оголосивши комендантську годину.\n\nЗмовники з уряду заприсяглися у вірності Віктору Еммануїлу III, і першим своїм указом як керівник Італії король підписав указ про укладання союзу з Німецькою імперією."
 wtt_news.50.c:0 "Хоч цього позбулися!"
 wtt_news.50.desc:0 "Сьогодні німецьке радіо повідомило про те, що змовники у лавах військового керівництва здійснили спробу перевороту. Слідом за вибухом у штаб-квартирі фюрера, внаслідок якого загинув сам Гітлер та отримали поранення кілька людей, армійські підрозділи атакували установи та загони SS.\n\n[GER.GetLeader] стверджує, що повністю контролює ситуацію в країні та армії, але досі з усієї Німеччини надходять повідомлення про сутички між прихильниками нинішнього уряду та заколотниками.\n\nХодять чутки, що деякі вищі керівники нацистської партії самі планують захопити владу, скориставшись хаосом."
 wtt_news.51.desc:0 "Сьогодні німецьке радіо повідомило про те, що змовники у лавах військового керівництва здійснили спробу перевороту. Слідом за вибухом у штаб-квартирі фюрера, який із чудової випадковості лише злегка поранив самого Гітлера та ще кілька людей, армійські підрозділи спробували захопити низку урядових установ у Берліні.\n\nЗвістка про те, що [GER.GetLeader] вцілів, поширилися швидко, і більшість підрозділів під командуванням бунтівників уже повернулися до казарм.\n\nДекілька вищих німецьких воєначальників скоїли самогубство, щоби не постати за звинуваченням у зраді перед сумнозвісним «народним судом»."
 wtt_news.54.t:0 "Об'єднання Нордики"
 wtt_news.57.t:0 "Відродження держави [From.GetNameDef]"
 wtt_news.63.a:0 "Африка — для африканців!"
 wtt_news.66.b:0 "Дивовижний поворот удачі..."
 wtt_news.9.t:0 "Радянці оголошують про широкомасштабні навчання"
 wtt_prc.20.desc:0 "Стали відомі нові подробиці останнього нападу на нашу територію. Поки що жодного з нападників не було затримано, але все говорить про те, що це навмисна провокація з боку Китаю. \n\nКитайський уряд підозріло довго тягнув із засудженням нападу, а в китайських газетах його описували як героїчний акт протидії «японському імперіалізму».\n\nКабінет міністрів зібрався для обговорення ситуації та вжиття заходів у відповідь на таке явне нахабство."
 wtt_take_national_leadership.2.desc:0 "На офіційній церемонії [old_leader.GetLeader] передав кермо влади республікою. Виступаючи перед прихильниками, новий розділ [new_leader.GetLeader] заявив ось що:\n\n«Ідеї та традиції, яких дотримується [old_leader.GetLeader], сформували нинішній вигляд Китаю. [old_leader.GetLeader], поза всяким сумнівом, щосили намагався зміцнити нашу країну. Він справжній патріот своєї батьківщини та увійде до історії як великий керівник. Але тепер ми маємо дати шанс новим ідеям. Разом ми збудуємо новий єдиний Китай. Він стане кращим і сильнішим від попереднього!» \n\n[old_leader.GetLeader] відмовився дати коментарі."
 wtt_warlord_vs_prc.1.b:0 "Нам не потрібен такий відвертий опортунізм."
 wtt_warlord_vs_prc.31.t:0 "[From.GetLeader] вимагає тісніше співробітництво"
 wtt_xian_incident.8.b:0 "Вони йому не зашкодять. Зачекаймо."
 wuw_GER_chinese_diplomacy.2.t:0 "[FROM.GetNameDefCap] пропонує промислову допомогу в обмін на ресурси"
 wuw_GER_chinese_diplomacy.7.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відхилив нашу пропозицію, заявивши, що вони самі впораються без західних технологій. Що ж, таке життя..."
 wuw_GER_diplomacy.105.t:0 "[FROM.GetNameDefCap] відкидає сфери впливу"
 wuw_GER_diplomacy.27.desc:0 "Керівництво [FROM.GetAdjective] з ентузіазмом прийняло нашу пропозицію про наукову співпрацю. Оскільки наші флоти розвивалися по-різному, вони також бачать користь у взаємному обміні знаннями, щоби стати ще сильнішими разом."
 wuw_GER_diplomacy.33.t:0 "[FROM.GetNameDefCap] відмовляється повернутись до угоди"
 wuw_GER_diplomacy.59.b:0 "Не варто ескалувати ситуацію..."
 wuw_GER_diplomacy.80.a:0 "Чудово!"
 wuw_GER_german_politics.01.a:0 "Нам потрібен обережний традиціоналіст"
 wuw_GER_legions.5.t:0 "Ліквідація автономії Локот"
 wuw_GER_military_events.2.c:0 "Жодного слова про це."
 wuw_GER_monroe.2.b_tt:0 "§YДоктрина Монро§! буде скасована у всіх країн, які ще її мають. Гарантує країни, що відкрито підтримали Доктрину, за вартістю £GFX_pol_power §Y25 політичної влади§! §Rза кожну гарантовану країну§!!\n\nНаразі §Y[?global.monroe_countries_in_support^num]§! країн підтримують Доктрину.\n\nПоточна вартість гарантій: £GFX_pol_power §Y[?USA.monroe_countries_strict_in_support_guarantee_cost]§!"
 wuw_GER_realpolitik.10.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб ми підкорилися їхній владі й стали їхнім васалом, згідно з початковим планом, коли ми погодилися прийняти Гессена на престол у 1918 році. Чи виконаємо ми ці вимоги?"
 wuw_GER_realpolitik.54.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] нещодавно засудив нашу, як вони стверджують, незаконну окупацію банатських і трансильванських земель, які, за їхніми словами, досі є законною частиною колишньої Австро-Угорщини. Тепер ми отримали ультиматум від [FROM.GetAdjective], і їхні війська стягуються до кордону. Як нам реагувати?"
 wuw_GER_realpolitik.61.t:0 "[FROM.GetNameDefCap] погоджується на повну інтеграцію"
 wuw_GER_reichskommissariats.17.a:0 "Угорщина повинна бути винагороджена"
 wuw_GER_reichskommissariats.18.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.24.t:0 "Керівництво Аравії"
 wuw_GER_reichskommissariats.26.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію у Східній Азії, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_releasable.2.t:0 "Вибори"
 wuw_GER_uncertain_future.01.t:0 "$GER_growing_public_dissent_mission$"
 wuw_GER_weltpolitik.5.a:0 "На жаль, ми нічого не можемо зробити"
 wuw_HUN_a_cult_of_personality_desc:0 "Народ потребує ідеала. Ми зосередимо владу навколо Матяша Ракоші, створивши культ особистості, що втілює революційні цінності."
 wuw_HUN_expand_the_aluminum_industry:0 "Розширити алюмінієву промисловість"
 wuw_HUN_hungarian_autarky:0 "[ROOT.GetAdjective]а автаркія"
 wuw_HUN_incorporate_the_hungarian_life_movement_desc:0 "Ми повинні включити правого політика Бейлу Імреді та його Рух Угорського Життя до нашої організації, надавши йому місце в уряді."
 wuw_HUN_initiate_army_maneuvers:0 "Розпочати армійські навчання"
 wuw_HUN_joint_hungarian_soviet_research_effort:0 "Спільні радянсько-угорські дослідження"
 wuw_HUN_kadars_hussars:0 "Гусари Кадара"
 wuw_HUN_news_events.4.desc:0 "[HUN.GetLeader] з [HUN.GetNameDef] оголосив про амбіції нації домінувати у світі й встановити [HUN.GetAdjective] гегемонію на всіх континентах. Вони заявляють, що це — спадкове право народу Апостольського королівства, і що вони ніколи більше не підкоряться чужинцям."
 wuw_HUN_news_events.8.b:0 "Миру не було й не буде..."
 wuw_HUN_promote_entrepreneurship_desc:0 "Нам потрібні підприємці, готові вкладати в націю. Ми заохотимо інвестування в країну для досягнення процвітання."
 wuw_HUN_renew_the_shipping_industry_desc:0 "Маючи чітку мету відновлення наших кордонів, ми повинні почати розбудову середземноморського флоту, гідного наших колишніх досягнень."
 wuw_HUN_restrict_voting_rights_desc:0 "Щоб ефективно зупинити зростання впливу комуністів та лівих демократів, необхідно обмежити виборчі права, зробивши вимоги суворішими та дозволивши брати участь у виборах лише тим, хто дійсно піклується про добробут нашої держави."
 wuw_HUN_salami_slicing_tactics_desc:0 "Серія малих антигортістських дій дозволить досягти великого результату, який було б складно або навіть незаконно реалізувати одразу. Це дозволить підірвати правління Горті настільки, що майже ніхто з солдатів не захоче його захищати."
 wuw_HUN_secure_army_loyalty_desc:0 "Щоб переконатися, що армія на нашому боці, і ми могли безпечно інвестувати в неї, ми повинні позбутися будь-яких командирів, чия лояльність до корони хоча б трохи викликає сумніви."
 wuw_HUN_the_war_on_atheism_desc:0 "В останні роки люди почали забувати про Бога. Якщо не зупинити, ця пошесть атеїзму буде лише поширюватися. Ми маємо знищити комуністів зараз, поки ця єресь не стала незворотною."
 wuw_HUN_transylvanian_mountaineers:0 "Трансільванські гірські стрільці"
 ww_BEL_event_diplomatic.24.desc:0 "Наша ініціатива створення платформи для обміну технологіями серед наших союзників була схвалена [FROM.GetNameDef]. Вони приєдналися до зусиль і будуть ділитися своїми технологічними досягненнями з нами та нашими спільними союзниками, як і ми будемо ділитися нашими з ними."
 ww_congo.1.desc:0 "Бельгійське колоніальне відомство сьогодні ухвалило закон, щоб виділити значно більші ресурси на наш промисловий розвиток, і почало будівництво промислових об'єктів у [295.GetName]."
 ww_congo.10.a:0 "У нас немає вибору, окрім як погодитись."
 ww_congo.10.t:0 "[FROM.GetNameDefCap] вимагає [772.GetName]"
 ww_congo.19.a:0 "Ера імперіалізму закінчена"
 ww_congo.19.d:0 "Нещодавно вільний конголезький уряд в Станлевілі розпочав війну за незалежність від бельгійської колоніальної імперії. Хоча це забрало деякий час, їхнє повстання зрештою змогло перебрати під контроль колоніальні війська, що були розміщені в регіоні, і захопити ключові міста в Конго. Тепер вони офіційно проголосили незалежність, і було ініційовано мирні переговори з їхніми колишніми гнобителями."
 ww_congo.22.t:0 "[COG.GetLeader] запитує про збільшення еміграції до Конго"
 ww_congo.26.a:0 "Це не варто боротьби"
 ww_congo.26.desc:0 "\nРаніше цього тижня сили [COG.GetNameDef] зайняли нашу територію [796.GetName], заявивши, що вони перебувають на місії для захисту регіону від потенційної окупації їхніми ворогами. Це очевидно є актом війни, однак ми можемо вибрати просто проігнорувати це, оскільки вони, ймовірно, не хочуть воювати з нами, а скоріше намагаються знову об'єднати басейн Конго."
 ww_congo.28.a:0 "Їх потрібно переконати, або звільнити силою"
 ww_congo.47.desc:0 "Рада вирішила, що ще одним можливим правителем Конго може бути Мвамбуца IV, Мвамі Королівства Бурунді, королівства на сході. Напевно, він може принести стабільність і досягти об'єднання з Бурундійською державою?"
 ww_congo.50.b:0 "Нам не потрібні вони."
 ww_congo.56.b:0 "Ні, ми не погодимося!"
