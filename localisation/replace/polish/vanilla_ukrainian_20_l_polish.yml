 congo_independence_struggle.16.d:0 "Нам вдалося уникнути війни з нашим колоніальним паном. А точніше, вже колишнім колоніальним паном. \n\nДелегація, яку ми направили для зустрічі з адміністрацією, сьогодні зустрілась з колоніальним губернатором, і обидві сторони підписали документи, що офіційно проголошують незалежність [COG.GetNameDef]. Тепер ми є власною вільною нацією, і передача влади вже розпочалась. \n\nТепер ми повністю контролюємо свою долю, і все це без крові, гордості чи грошей."
 congo_independence_struggle.18.a:0 "Сьогодні день для святкування!"
 congo_independence_struggle.21.t:0 "Конго відступає і погоджується стати заморською територією"
 congo_independence_struggle.22.t:0 "Формування нового заморського департаменту"
 congo_independence_struggle.9.a:0 "У Конго назріває криза"
 congolese_civil_war_starting_congo_side_tt:0 "Бельгійські лоялісти ініціюють громадянську війну проти нас. Ми зможемо примусити їх до миру і здобути повну незалежність, якщо контролюватимемо §YЛеопольдвіль§!, §YЕлізабетвіль§! і §YСтенлівіль§!. \n\nТе ж саме, вони зможуть примусити нас до миру і зберегти контроль над нашою країною, якщо контролюватимуть §YЛеопольдвіль§!, §YЕлізабетвіль§! і §YСтенлівіль§!."
 conquer_hibernia:0 "Завоювати Гібернію"
 conquest_of_albania:0 "Завоювання Албанії"
 continuous_suppression_desc:0 "Впровадившись в основні повстанські угруповання на окупованій території та завербувавши їх лідерів, ми помітно зменшимо збитки, які вони можуть завдати."
 control_crete_goal_desc:0 "Контроль над островом Крит дозволить домінувати над східним Середземномор'ям та сприяти операціям в Егейському морі та Північній Африці."
 control_iraqi_oil_goal_name:0 "Контролювати іракську нафту"
 control_ploiesti_oil_fields_goal_desc:0 "Як єдині нафтові родовища в Європі, контроль над родовищами Плоєшті є безцінним для забезпечення альянсу паливом, необхідним для продовження військових операцій."
 control_the_chinese_coast_goal_desc:0 "У разі нападу ми повинні прагнути зберегти доступ до моря якомога довше. Наше виживання пов'язане з нашою здатністю отримувати товари з-за моря."
