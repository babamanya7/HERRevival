 SPA_a_one_party_state_tt:0 "Половина поточної разом узятої підтримки §Yнефашистів§! буде застосована як штраф до §Rстабільності§!:\n"
 SPA_activate_valencia_fifth_columnists:0 "Задіяти п'яту колону у Валенсії"
 SPA_ciudad_real_offensive_mission:0 "Насувається наступ у Сьюдад-Реалі"
 SPA_claim_the_aragonese_possessions:0 "Претензії на арагонські володіння"
 SPA_concessions_to_the_left_mission:0 "Поступки лівим"
 SPA_contact_the_union_militar_espanola_desc:0 "Unión Militar Española, величезне таємне товариство офіцерів, які змовилися проти Республіки, має багато тих, хто може мати симпатії до нашої справи. Ми повинні зв'язатися з ними та отримати підтримку від якомога більшої кількості цих лідерів, коли прийде час."
 SPA_defenses_against_invasion_desc:0 "Берегові лінії Іспанії простягаються далеко й широко, і ми повинні зробити все можливе, щоби перспектива вторгнення стала неприємною для ворога. Сподіваюся, міцні укріплення зроблять приз невартим."
 SPA_directory_neutrality_ADJ:0 "Іспанськ"
 SPA_expand_influence_in_the_valencia_garrison_mission:0 "Оспорюється вплив на гарнізон у Валенсії"
 SPA_garrison_control_republicans_strong_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Yсильний§!\nКількість дивізій на початку громадянської війни: §Y2§! націоналістичні — §Y1§! республіканська§!\n"
 SPA_invest_in_naval_infrastructure:0 "Інвестувати в морську інфраструктуру"
 SPA_medium_tank_equipment_3:0 "Carro de Combate 44"
 SPA_political_arrest_mission_desc:0 "Влада прагне відплати за ліквідацію одного зі своїх прихильників і намагається заарештувати когось, щоби зробити з нього приклад."
 SPA_settle_the_succession_question_desc:0 "Причина карлістів розділена між таборами, які підтримують різні претензії на трон. Альфонсо Карлос, спадкоємець-карліст, помер без потомства наприкінці 1936 року, але не раніше, ніж призначив своїм спадкоємцем Хав'єра Бурбон-Пармського. Проте є ті, хто натомість підтримує претензії старого конституційного короля у вигнанні, Альфонсо XIII."
 SPA_the_phalanx_ascendant_desc:0 "Це підйом Фаланги. Неіснуюча Республіка переживає передсмертну агонію, і хоча боротьба буде довгою та важкою, ми зробили перші кроки на шляху до відродження Іспанської імперії."
 SPB_xavier_king2:0 "Хав'єр прийняв корону і королівський титул Хав'єра I. Іспанський престол нарешті зайнятий представником карлістської лінії."
 SPC_poum_communism:0 "Іспанська комуна"
 SPECIAL_PROJECT_RESEARCH_TIME_TOOLTIP_MODIFIER:0 "$MODIFIER_NAME$: $MODIFIER_VALUE$"
 SPOTTING_BASE_CHANCE_FROM_RADAR:0 "  Покриття радарів у регіоні: $VAL|1%+=$\n"
 SPR_against_trotskyism_and_stalinism_tt:0 "Отримає ціль війни §Y$puppet_wargoal_focus$§! проти §Yсталіністського§! або §Yтроцькістського Радянського Союзу§! або §YМексики§!."
 SPR_communal_autarky_desc:0 "Світ уникає нас, тому ми повинні задовольнитися природними ресурсами, які знаходимо на нашій території. Це вправа з оптимізації, у якій ми навчимося досягати успіху."
 SPR_crush_the_revolution:0 "Розбити революцію"
 SPR_demand_ministerial_positions:0 "Вимогти міністерські посади"
 SPR_demand_ministerial_positions_desc:0 "Якщо Республіка бажає нашої подальшої підтримки, вона повинна надати нашим політикам посади в уряді. Лише тоді вони дадуть зрозуміти, що бачать у нас цінних союзників у нашій спільній боротьбі."
 SPR_distribute_arms_to_the_people_mission_tt:0 "Коли почнеться громадянська війна, республіканці отримають 10 нетренованих дивізій із §Y3§! батальйонами §Yпіхоти§!.\n"
 SPR_ensure_loyalty:0 "Забезпечити лояльність"
 SPR_land_redistribution_desc:0 "Усім, хто хоче обробляти землю, має бути дозволено це робити. Земля, яка до війни була у тих, хто не вмів нею правильно користуватися, тепер буде виділятися в користування тим, хто вміє."
 SPR_masters_of_our_own_fate_tt_3:0 "Держава §Y[ROOT.GetName]§! буде зватися §YІспанська комуна§!.\n"
 SPR_mujeres_libres_desc:0 "Соціальна революція вдалася лише частково. Наступним кроком є звільнення, розширення можливостей і освіта жінки робітничого класу. Рівність принесе користь суспільству в цілому."
 SPR_nationalist_castille_neutrality_DEF:0 "Кастильська Корона"
 SPR_secure_leader_loyalty_desc:0 "До нас дійшли чутки, що лояльність одного з наших раніше відданих воєначальників під питанням. Ми мусимо забезпечити його лояльність, навіть якщо морквина, яку ми маємо перед ним підвісити, може бути досить дорогою..."
 SPR_seize_public_transport_tt:0 "§RЦей дух буде видалений після завершення громадянської війни!§!\n"
 SPR_strat_bomber_equipment_3_short:0 "CASA 18.500"
 SPR_support_french_communists_desc:0 "Держава [FRA.GetNameDefCap] нещодавно мала комуністичні настрої. Якщо вони побачать мудрість у нашій співпраці в досягненні цілей робітників, тоді ми об'єднаємо зусилля, але якщо вони не будуть такими освіченими, ми повинні принести їм соціалізм силою."
 SPR_the_popular_army:0 "Народна армія"
 SSB_coordinate_military_production_desc:0 "Минули великі дні імперії та домінування, ми стали слабкими порівняно з рештою світу. Але ми більше не самотні, тепер ми стоїмо разом, об'єднані Саадабадським пактом. Разом ми можемо знову повстати та зайняти наше місце як правителі цього регіону."
 SSB_form_the_saadabad_alliance_desc:0 "Саадабадський пакт розпочався як простий пакт про ненапад. Він став набагато більшим, завдяки спільній військовій та економічній співпраці, і з об'єднанням наших ресурсів настав час нарешті сформувати офіційний Саадабадський альянс."
