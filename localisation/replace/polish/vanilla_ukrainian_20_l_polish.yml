 ENG_appeal_to_imperial_loyalists_desc:0 "Незважаючи на номінальну незалежність домініонів, серед їхніх громадян все ще є багато лояльних до Корони. Якщо ми зможемо достукатися до них, ми зможемо підірвати уряди домініонів до вторгнення, яке буде необхідним для відновлення контролю над ними."
