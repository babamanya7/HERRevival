 CZE_ally_poland_desc:0 "Пам'ятаючи польсько-радянську війну та стикаючись зі зростаючою загрозою на заході, [POL.GetNameDef] перебуває в такому ж пошуку безпеки, як і ми. Ми повинні переконати [POL.GetAdjective]ий уряд в тому, що нейтралітет їх не врятує, і їм слід пов'язати свою долю з нами."
