 ETH_cie_stalinist:0 "[ETH.GetAdjectiveCap]а залізнична група"
 ETH_consolidate_east_africa_category:0 "Консолідувати Східну Африку"
 ETH_consolidate_east_africa_tt:0 "Отримає претензії на:\n§Y[SUD.GetName]§!\n§Y[SOM.GetName]§!\n§Y[ERI.GetName]§!\n§Y[DJI.GetName]§!\n§Y[KEN.GetName]§!\n§Y[UGA.GetName]§!\nОтримає доступ до рішень по націоналізації територій під [ETH.GetFlag][ETH.GetAdjective]им контролем."
 ETH_core_659:0 "Інтегрувати область [659.GetName] в імперію"
 ETH_declare_for_italy_desc:0 "Багато хто сприйме це як зраду і відвернеться від правди. Але саме тому нам судилося керувати цими землями. Тому що ми знаємо, що тільки ми маємо силу волі зробити те, що потрібно зробити для блага нашої нації. Настав час скинути [ETH.GetLeader]."
 ETH_ethiopia_recognized_tt:0 "[ROOT.GetLeader] визнаний справжнім лідером держави [ROOT.GetNameDef]:\n §Y[ROOT.GetName]§! може закликати союзників у війну."
 ETH_false_flag_operation_decision:0 "Розпочати операцію під чужим прапором"
 ETH_flames_across_the_sea_desc:0 "Від європейської гегемонії постраждала не лише Африка. Наші сусіди через Червоне море майже не мають реальної незалежності від вимог імперіалістів. Ми повинні поширити вогонь опору на Аравійський півострів, щоб люди могли мати шанс одного дня повністю керувати собою."
 ETH_hold_harar_mission_desc:0 "Раз ми втратили південь, нам слід спробувати вистояти в Харері та захистити наш шлях до моря."
 ETH_infrastructure_projects:0 "Інфраструктурні проєкти"
 ETH_invite_italian_settlers:0 "Запросити італійських поселенців"
 ETH_joint_swedish-ethiopian_intelligence_program_desc:0 "Пряма допомога [ETH.GetName] викликала б сумніви щодо нейтралітету [SWE.GetName]. Однак вони можуть бути готові запропонувати таємну підтримку, щоби зберегти правдоподібне заперечення. Використовуючи наші зв'язки в регіоні та ресурси [SWE.GetName], ми можемо подолати [ITA.GetAdjective]і армії колоніальне панування в Африці."
