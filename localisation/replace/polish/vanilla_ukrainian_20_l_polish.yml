 INS_HOL_DEF:0 "Нідерландська Ост-Індія"
 INS_arm_the_students_desc:0 "Студенти заклали фундамент революції ще десятиліття тому, і вони продовжуватимуть вести її вперед."
 INS_commander_sudirman_tt:0 "§YСудірман§![INS.GetFlag] отримує підвищення до §YФельдмаршала§!"
