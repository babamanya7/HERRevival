 tsr_manchukuo.22.desc:0 "На щастя, совєти виявилися достатньо люб'язними, щоб прийняти всі наші територіальні вимоги, додавши до наших володінь не лише Монголію і Туву, а й Зовнішню Маньчжурію. Це може принести лише користь."
 tsr_manchukuo_border_war.5.a:0 "На крок ближче до перемоги!"
 tsr_manchukuo_news.1.a:0 "Щеня гарчить?"
 turkestan_united_democratic_DEF:0 "Тюркська федеративна республіка"
 uk_battleship_focus_desc:0 "Поки теоретики сперечаються про панування в повітрі чи на морі, ніхто не хоче, щоби гармати лінкора були спрямовані на його палац. Навіть якщо ентузіасти авіаносців зрештою виявляться правими, лінкори все одно домінуватимуть в океанах іще довгі роки."
 undo_versailles_goal_desc:0 "Настав час скасувати цю пародію на 'Диктат'. Ми повернемо наші законні території!"
 united_polynesia_democratic:0 "Тихоокеанська федерація"
 upgrade_interrogation_techniques:0 "Техніки допиту"
 upgrade_suicide_pills_desc:0 "§LДеяка частина наших агентів буде схоплена ворогами — це, на жаль, неминуче. Ми мусимо запропонувати їм спосіб уникнути жаху, що чекає на них у кімнаті допитів. Цим крайнім способом стане пігулка з ціанідом у зубі.§!"
