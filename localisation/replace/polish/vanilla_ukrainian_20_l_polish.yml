 banda_carita_tt:0 "Не дозволяє Німеччині виконати її фокус §Y$GER_assassinate_mussolini$§!."
 bangladesh_RU_Dat:0 "Бангладеші"
 basic_cruiser_armor_scheme_desc:0 "Схема бронювання з окремими бронепоясом і бронепалубою, скопійована з конструкції основних кораблів. Захищає від осколків і малокаліберних гармат.\n\nУстановка цього модуля на §Yкрейсери§! §Rзнижує§! §Yшвидкість§!."
 basic_fire_control_system:0 "Базова система керування вогнем"
