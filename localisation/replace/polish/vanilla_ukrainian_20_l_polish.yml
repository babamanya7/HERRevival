 CHL_mapuche_establish_a_guianan_government:0 "Заснувати федерацію у Гвіані"
 CHL_mapuche_form_defense_groups:0 "Утворити групи місцевої оборони"
 CHL_new_fatherland_communism_DEF:0 "Сполучені колективи Південних Анд"
 CHL_news_events.1.d:0 "Надійшли повідомлення про те, що «Націонал-соціалістичний рух», очолюваний [CHL.GetLeader], успішно здійснив державний переворот і встановив [CHL.GetNameDef] як однопартійну державу, керовану ними. Вони мають зв'язки з глобальним фашистським рухом, але все ще невідомо, чи приєднаються вони до будь-якої зі світових держав, чи залишаться на своєму континенті."
 CHL_open_investigations_against_the_nacistas_tt:0 "Зменшує час до спроби державного перевороту, що гірше дозволяє нацистам підготуватися заздалегідь."
 CHL_political_events.14.t:0 "Повстання «Насіста»"
 CHL_political_events.15.desc:0 "Націонал-соціалістичний рух Чилі здійснив спробу державного перевороту, але безрезультатно. Наші карабінери придушили їхнє повстання, проте зазнали великих втрат під час того, що стало масштабною битвою за територію Чилійського університету, після того, як Насісти окупували його. Вони відступили наразі, але невідомо, чи спробують вони щось подібне пізніше."
 CHL_political_events.18.b:0 "Ескудеро Оскар Отарола"
 CHL_political_events.21.a:0 "Ми повинні відновити наші претензії на Такну"
 CHL_political_events.50.a:0 "Чудово"
