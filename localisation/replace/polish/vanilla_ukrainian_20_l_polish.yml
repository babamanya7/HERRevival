 YAK_communism_DEF:0 "Якутська народна рада"
 YUG_abolish_the_monarchy_desc:0 "Монархія навряд чи є придатною формою правління для сучасності, не кажучи вже про те, що вона абсолютно несумісна з нашими суспільними поглядами. Його потрібно скасувати, а королівське правління замінити голосом простої людини."
