 ICE_american_soldiers_desc:0 "Сполучені Штати прагнуть розширити свій вплив далеко і широко, щоб захистити цінності, які вони вважають найдорожчими. Ми могли б дозволити їхнім солдатам вільно дислокуватися на нашій землі, а деякі з них, у свою чергу, могли б залишитися тут і посилити наші власні сили."
 ICE_break_with_the_crown_workers_tt:0 "Коли буде виконано фокус §Y$ICE_rally_the_workers_of_reykjavik$§!:"
 ICE_general_strike_tt:0 "\nКоли §YЗагальний страйк§! завершено:"
 ICE_hydroelectric_power_desc:0 "Якщо ця країна і має якийсь інший ресурс, то це вода: річки та гарячі джерела. Розширення їхнього використання може сприяти індустріальному розвитку країни."
 ICE_incite_communist_uprising_wales:0 "Підбурити повстання в Уельсі"
 ICE_keflavik_airbase:0 "Кефлавіцький аеродром"
 ICE_not_our_king_desc:0 "Королівство Ісландія — така нісенітниця. Ісландії не потрібен король, і вже точно не данський. Настав час почати створювати підтримку серед ісландців для повного розриву з минулим, оскільки ми робимо крок у майбутнє."
 ICE_not_standing_idly_by_desc:0 "Війна наближається, хочемо ми цього чи ні. Ми повинні озброїти націю, якщо хочемо мати шанс захистити острів. Або переможемо, або помремо, це очевидно."
