 ENG_the_fate_of_the_royal_family_desc:0 "Думка про те, що одна людина варта більше, ніж інша, лише завдяки своєму народженню, викликає у нас огиду. Величезне багатство, яким продовжує хизуватися королівська родина, дратує і, безсумнівно, було б набагато корисніше витратити його на переозброєння та промислову експансію. Можливо, настав час убити двох зайців одним пострілом..."
 ENG_trade_unions_demand_minimum_pay_increase_desc:0 "Щоб виконати вимоги профспілок, ми ухвалимо закон про підвищення мінімальної зарплати у всіх секторах економіки."
