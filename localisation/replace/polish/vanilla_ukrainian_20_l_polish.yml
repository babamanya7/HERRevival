 denmark_protection_event.130.desc:0 "[FROM.GetAdjective]і дипломати зробили нам інтригуючу пропозицію. Вони кажуть, що ми можемо вступити в альянс із їхньою державою, що забезпечить мир і взаємовиручку та гарантує нашу безпеку. Що ми на це відповімо?"
