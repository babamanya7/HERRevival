 EST_join_the_allies_desc:0 "Союзники показали себе друзями [ROOT.GetAdjective]ої незалежності. Усе, що залишилося, — це закріпити цю дружбу офіційним вступом держави [ROOT.GetNameDef] до альянсу Союзників."
