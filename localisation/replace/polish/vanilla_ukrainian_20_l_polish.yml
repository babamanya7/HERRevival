 ship_hull_cruiser_4_desc:0 "Останнє покоління крейсерів, створене на основі досвіду військових дій, відрізняється переробленою конструкцією надбудови, що дозволило поліпшити сектори вогню знарядь ППО, а також новим набором обладнання — зокрема, радаром."
