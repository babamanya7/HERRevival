 URG_join_the_allies_desc:0 "Після тиску з боку [USA.GetName] зрозуміло, що ми більше не можемо залишатися поза війною. Той невеликий внесок, який ми можемо зробити, тепер буде спрямований на боротьбу."
 URG_merge_falangist_movements_desc:0 "За винятком уругвайського ревізіонізму, підживлюваного Адольфо Агоріо, фалангізм є найпопулярнішим авторитарним рухом у країні, але вони розділені на кілька груп. Ми об'єднаємо їх, щоб створити більший рух, ніж вони можуть бути окремо."
 URG_the_american_springboard_desc:0 "Зі встановленням контролю та потужним покровителем за нами, ми готові розпочати завоювання наших сусідів."
 URG_the_good_coup_desc:0 "Конституція зіткнулася з жорстоким опором. Ми не можемо зволікати з безглуздою політикою, якщо хочемо вивести Уругвай у майбутнє. Як і Терра раніше, ми здійснимо самопереворот, але замість масових арештів та насильства, ми зробимо це без кровопролиття та переслідувань."
