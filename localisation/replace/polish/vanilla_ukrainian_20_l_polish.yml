 CHI_avoid_another_crisis_desc:0 "У 1931 році ми були непідготовлені й захоплені зненацька [JAP.GetAdjective]ою армією. Хоча минуло пів десятиліття, ми не готові дати їм відсіч і повинні здобути більше того дорогоцінного ресурсу — часу. Ми можемо запропонувати символічні поступки, щоб задобрити [JAP.GetAdjective]у владу, що дозволить нам підготуватися до неминучої бурі зі сходу."
 CHI_bureau_of_investigation_and_statistics_desc:0 "Не можна припустити, щоб під час війни за майбутнє нації країні загрожували зрадники та шпигуни. Нове бюро вестиме справи нехай неприємними, але неминучими методами."
 CHI_camco_desc:0 "Щоби створити незалежну авіабудівну промисловість, спочатку слід вивчити методики збирання та обслуговування вже наявних у нас літаків."
 CHI_chemical_research_institute_desc:0 "Нехай ми ніколи не застосовуємо хімічну зброю першими, ми маємо бути готові захищатися від подібної атаки. Слід створити новий науково-дослідний інститут, який візьметься за вивчення відповідних методик і технологій."
 CHI_china_reborn:0 "Відроджений Китай"
 CHI_coastal_defence_desc:0 "Оптимізація використання простору в нашому підводному флоті означає менші та швидші субмарини. Нам довелося прибрати кілька несуттєвих речей, таких як ліжка... або будь-які інші зручності."
 CHI_communist_infiltration_desc:0 "Надходили повідомлення про те, що комуністичні угруповання створюють базові райони у віддалених районах країни. Ми повинні надіслати агентів, щоб підтвердити це, щоби ми могли нанести їм удар.\n[Root.GetDiscoveredInfiltration]"
