 CHI_a_control_yuan_with_teeth_desc:0 "Влада розбещує, тому нам потрібне щось, щоб тримати наших політиків чесними. За часів Чана Кайші організація, якій було доручено це завдання, була безсилою. Ми відновимо цю організацію, щоб вона могла виконувати свою місію в повній мірі."
 CHI_a_popular_movement_trigger:0 "Фактор призову від духу §Y«Корупція у збройних силах»§! більше ніж §Y0%§!"
