 PHI_second_republic_tag_war_neutrality:0 "$PHI_second_republic_tag_neutrality$"
 PHI_secure_japanese_guarantees_desc:0 "Якщо ми хочемо справді прискорити нашу незалежність від Сполучених Штатів, то нам потрібно підготуватися до цілком реальної перспективи війни, оскільки вони навряд чи легко відпустять свого підопічного. Ми повинні звернутися до наших спонсорів у Японії та заручитися більш офіційною військовою підтримкою на випадок бойових дій."
 PHI_sugar_barons_category_desc:0 "Наше виробництво цукру є дуже прибутковим сектором, де ми можемо отримати кошти для покриття нашого зростаючого оборонного бюджету, не вдаючись до скорочень інших витрат."
 PHI_sugar_barons_unlock_tt:0 "§YРозблоковує рішення про акциз на цукор§!"
 PHI_sunset_empires:0 "Імперії заходу сонця"
 PHI_support_for_chinese_communists_desc:0 "Комуністи продовжують свою боротьбу в Китаї як проти японських вторгнень, так і проти китайських мілітаристів. Ми маємо можливість контрабандою переправляти їм людей і матеріали вздовж Жовтої ріки, щоб безпосередньо підтримати їхню боротьбу або просто підкинути хмизу у вогонь конфлікту в регіоні."
 PHI_trucks_and_transport_requisition_desc:0 "Тепер, коли зброя надходить на Філіппіни, настав час подбати про логістику утримання армії в польових умовах. Завдяки бурхливому розвитку автомобільної та залізничної промисловості Сполучених Штатів, не повинно бути проблемою реквізувати частину транспорту для наших військових потреб."
