 EST_baltic_shield_desc:0 "Радянці бажають розтрощити Естонію своїм імперіалізмом, але ми не можемо цього допустити. Треба спорудити бункери вздовж усього кордону. Нехай ми і не зможемо перемогти радянців, але, можливо, вийде протриматися досить довго, щоб це зробив хтось ще."
 EST_events.11.d:0 "Набравши силу в Естонії, вапси погодилися підписати договір про співпрацю з партією [Root.GetFascistPartyName]. Вони вже підтримують фінські фашистські угруповання пропагандою та національними демонстраціями, але швидкі та рішучі дії уряду заборонені проблему назавжди."
 EST_events.601.a:0 "[From.GetLeader] не у своєму розумі чи просто не на своєму місці?"
 EST_events.601.t:0 "[From.GetNameDefCap] відмовляється пустити [FIN.GetAdjective] державу до альянсу [From.GetFactionName]"
