 YUG_expand_the_sarajevo_arsenals_desc:0 "Нам потрібні додаткові виробничі потужності, щоби відповідати зростаючим потребам нашої армії. Сараєвські арсенали є основним кандидатом на розширення, тому ми негайно виділимо ресурси."
