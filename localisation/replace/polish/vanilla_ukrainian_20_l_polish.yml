 MEX_focus_crusade_against_atheism_desc:0 "Більшість лідерів крістерос були переслідувані та вбиті урядом на початку 1930-х років. Однак дехто з них уникнув чисток і готовий знову очолити Вірних Мексики. Хай живе Цар Христос і Пречиста Марія Гуадалупська!"
 MEX_focus_depoliticised_army_desc:0 "Генерали не мають права на лояльність своїх солдатів. Основним джерелом легітимності є мексиканська держава. Ми повинні запобігти будь-яким думкам генералів про повстання, ротуючи їх між провінціями, щоб вони не могли створювати мережу патронажу чи забезпечити особисту лояльність своїх солдатів."
