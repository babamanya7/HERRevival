 SAF_GATHERING_STORM_DESC:0 "Коли почалася Велика війна, багато хто в Південній Африці відмовився ставати на бік своїх британських господарів. Південноафриканська армія впродовж більшої частини війни без особливих успіхів ганялася за німецькими військами в їхніх африканських колоніях.\n\nТепер на горизонті нависає нова війна. Як і тоді, частина населення вважає, що їхній країні взагалі не треба битись із Німеччиною. Дехто навіть вірить, що саме час нащадкам бурів зробити ставку на свободу, яка була недоступна їхнім предкам."
 SAF_cv_CAS_equipment_1_short:0 "Osprey"
 SAF_gw_tank_equipment_short:0 "Mark V"
 SAF_heavy_cruiser_4_desc:0 "$AST_heavy_cruiser_4_desc$"
 SAF_heavy_fighter_equipment_2:0 "Bristol Beaufighter"
 SAF_heavy_tank_artillery_equipment_1_short:0 "Gun Carrier Mk I"
 SAF_improve_the_hawker_hartbees_desc:0 "«Hawker Hartebeest» — не найсучасніший винищувач у світі, але нам підійде і такий. Поліпшивши механічну частину та підвищивши рівень підготовки, ми вичавимо максимум із цих біпланів."
 SAF_light_cruiser_1:0 "Клас «C»"
 SAF_light_tank_aa_equipment_3:0 "Valentine (зенітний)"
 SAF_light_tank_artillery_equipment_2_short:0 "Priest"
 SAF_police_windhoek_desc:0 "Колишня німецька колонія у Південно-Західній Африці знаходиться під нашим мандатним правлінням з часу закінчення попередньої війни. Ми мусимо виконати наш обов'язок, зайнятися поліпшенням ситуації та наведенням порядку у великому місті Віндхук."
 SAF_sa_engineer_corps:0 "Південноафриканський інженерний корпус"
 SAF_south_africa_first_desc:0 "Південна Африка — найнезалежніша держава на континенті. Воно може стати наріжним каменем фундаменту майбутньої Африки та колишніх колоній."
 SAF_special_service_battalion:0 "Батальйон спеціального призначення"
 SCREENING_TOOLTIP_CAPITAL_BOX_COMBINED:0 "Об'єднана ефективність прикриття поза §Yбойовою лінією§!: $NUM|%.0H$"
