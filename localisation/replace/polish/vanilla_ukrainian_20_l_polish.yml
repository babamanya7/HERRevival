 TUR_aiding_our_enemies:0 "Допомагають нашим ворогам"
 TUR_arctic_wolves_training_program_desc:0 "Наші солдати нишпорять снігом, мов вовки, що переслідують видобуток. Коли ми навчимо їх діяти в зимових умовах, ворог буде боятися їх більше, ніж холод."
 TUR_balkan_academy_of_sciences_name:0 "Балканська академія наук"
 TUR_brace_against_the_red_menace_communism:0 "Підготуватися до червоної загрози"
 TUR_cin_turkleri:0 "Çin Türkleri"
 TUR_discuss_investment_possibilities_with_FROM_desc:0 "У минулому, [ROOT.GetAdjective]ою політикою було по можливості уникати іноземних інвестицій та втручання, але зараз нам уже не треба цього боятися. Інвестори будуть спілкуватися з нами на рівних, і у нас з'явиться шанс розбагатіти."
 TUR_encourage_avid_fundamentalist_disciples_to_migrate_into_state:0 "£faction_tur_traditionalist Заохочувати міграцію затятих фундаменталістів у сприйнятливі до їхніх ідей спільноти"
 TUR_expand_the_air_bases_desc:0 "[ROOT.GetAdjective] територія величезна, і важливо, щоби наша авіація контролювала кожен її сантиметр."
 TUR_expand_the_golcuk_naval_base_desc:0 "Розширивши морську базу в Гьольджюку, ми зможемо підтримувати наші стратегічні цілі у протоці та Егейському морі."
 TUR_expanding_our_armaments_desc:0 "Світ змінюється, і ми будемо зобов'язані вийти зі зброєю проти тих, хто загрожує не лише Турецькій Республіці, а й самим ідеологічним підґрунтям, на яких вона зведена. Нам не знадобиться багато часу, щоби переконати в цьому промисловців та заручитися їхньою допомогою у захисті країни."
 TUR_fortifying_contentious_areas:0 "Укріплення спірних територій"
 TUR_joint_budgets_on_fortifications_desc:0 "Лінії укріплень — основа багатьох оборонних доктрин, і хоча сьогодні прийнято думати, що сучасні технології зробили такі стратегії застарілими, ми вважаємо, що форти ще можуть принести нам користь. Допомагаючи один одному будувати зміцнення, ми забезпечимо нашу спільну безпеку."
 TUR_millet_mektebi_focus_desc:0 "Хоча програма діє вже досить давно, реформи алфавіту та мови все ще впроваджуються по всій країні. Щоб подолати поширену неграмотність, слід залучити до роботи Товариство з дослідження турецької мови та національну шкільну програму. Крім того, необхідно виділити додаткове фінансування мобільним педагогічним бригадам, які подорожують між селами, де немає шкіл, з метою підвищення рівня писемності."
 TUR_no_current_integration_targets_available_tt:0 "£faction_tur_kurdish §YКурдську§! землю можна зробити осердною тільки після того, як §Yпідпорядкування§! досягне принаймні §Y70%§!, а §Yспротив§! знизиться принаймні до §Y30%§!."
 TUR_restack_the_officer_corps_desc:0 "Офіцерський корпус підтримує ключові цінності Туреччини, але ці цінності змінилися. Якщо офіцери не хочуть символізувати поточні цінності ідеології кемалізму, ми їх до цього примусимо."
 TUR_sanayiciler_liberals_tt:0 "\nРішення §YПромислові проєкти Sanayiciler§! стануть дешевшими за рахунок нашої ліберальної економічної моделі."
 TUR_sanayiciler_tt:0 "Використовуючи §Yполітичну владу§! та інші засоби у нашому розпорядженні, ми зможемо посилити наш зростаючий клас промисловців, щоб той вкладав ресурси у будівництво §Yцивільних фабрик§! та §Yвійськових заводів§! для держави.\n"
 TUR_sp_rockets_ballistic_missile:0 "Проєкт «J-600T Yıldırım I»"
 TUR_streamline_communication_methods_between_ships:0 "Поліпшити методи зв'язку між кораблями"
 TUR_submarine_2_desc:0 "The three submarines of the Saldiray class were launched in the late 1930s. Their design was heavily influenced by Germany, with the first ship of the class built in Germany, and the other two built under license in Istanbul. They were large ocean-going submarines, displacing over 930 tons and with excellent range. They were armed with six 533mm torpedo tubes."
 TUR_submarine_4_desc:0 "The Sakarya-class submarines were a series of U.S. Balao-class subs sold to Turkey after the war. They were very large submarines for their era, displacing over 1,520 tons. They had excellent range and speed, and were armed with ten 533mm torpedo tubes."
 TUR_superiority_of_arms_desc:0 "До чого вирішувати проблеми за рахунок людських життів, коли є витратний матеріал — кулі та снаряди? Нищівна вогнева міць — запорука життя наших солдатів!"
 TUR_turk_ulusu:0 "Türk Ulusu"
 TUR_ultranationalism_decision:0 "Ультранаціоналізм"
 TUR_united_against_imperialism_desc:0 "Усі ми побували жертвами махінацій сильніших держав. Занадто нас змушували укладати невигідні для нас угоди та домовленості, які послаблювали наші країни. Світ змінився, і ми більше не маємо наміру прогинатися під імперіалізм!"
