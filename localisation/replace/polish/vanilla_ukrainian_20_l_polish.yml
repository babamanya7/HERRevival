 stability.22.desc.c:0 "Те, що почалося як страйк у кількох ізольованих місцях, тепер поширилося на всю країну, зачепивши навіть галузі, пов'язані з військовими діями лише третинно. Постраждала навіть робота самого уряду, оскільки дедалі більше клерків, кур'єрів і водіїв відмовляються виходити на роботу.\n\nУ багатьох місцях робітничі ради зайняли фабричні будівлі. Звіти таємної поліції вказують на те, що подекуди, схоже, знову почалося виробництво зброї — задля великого повстання проти того, що називають «воєнним режимом».\n\nВище військове командування вважає, що рішучі дії лояльних військ іще можуть перемогти, тим часом як цивільна сторона уряду стверджує, що це загрожує громадянською війною та неминучою поразкою."
 stability.34.desc:0 "The social measures passed by the government as part of a larger process of reforming the military recruitment policy have proven surprisingly popular. Higher pay and more frequent leave are often cited as the biggest new benefits, but many also point to the new government programs to support war widows and orphans. Fewer and fewer men can justify refusing their country's call to the colors, and public support for draft-dodgers has all but disappeared.\n\nIndeed, there has been a recent upswing in public support for the government as more and more people realize that the [Root.GetAdjective] way of life is under attack."
 stability.38.a:0 "Прикро, що до цього дійшло."
