 HUN_mio_trait_naval_warfare:0 "$HUN_naval_warfare$"
 HUN_mobile_corps_doctrine_desc:0 "Почавши масове створення моторизованих та бронетанкових частин, ми можемо підвести теоретичну основу під їхню взаємодію на полі бою."
 HUN_reintigrate_banat:0 "Реінтегрувати область [82.GetName]"
 HUN_responsible_government:0 "Відповідальний уряд"
 HUN_seize_control_of_burgenland_dec:0 "Захопити контроль над Бургенландом"
 HUN_strat_bomber_equipment_2_short:0 "RMI-12"
 HUN_territorial_revision_category_desc:0 "З метою повернення собі минулої слави, ми продовжуватимемо шлях до Великої Угорщини та реінтегруємо наші відібрані регіони назад у Батьківщину."
