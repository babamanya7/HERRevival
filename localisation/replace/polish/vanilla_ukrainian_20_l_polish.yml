 HUN_alliance_with_italy_desc:0 "Ми можемо далі розвинути ідеї альянсу, закладені Римськими протоколами. Ми відправимо до Італії делегацію для обговорення угоди про розширене військове співробітництво у частині як оборони, так і наступальних дій."
 HUN_bringing_down_the_giants_tt:0 "Отримає §Y[GetWargoalBasedOnGovernment]§! казус беллі проти великих недемократичних держав у Європі:"
 HUN_capital_ships:0 "Основні кораблі"
 HUN_economic_intervention_desc:0 "Ми мусимо кинути наші багаті політичні ресурси на розвиток економіки. Нехай вона і так стабільна, але ми зможемо зробити її ще сильнішою та ще ефективнішою."
 HUN_increase_economic_cooperation_tt:0 "Ми отримаємо §Yцивільний завод поза мапою§! за кожну початкову країну в §YЗахідних Балканах§!, §YСхідних Балканах§! та §YПівнічних Балканах§!, яка має думку про нас вище ніж §G85§!. Це також стосується §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, §Y[TRA.GetNameDef]§! і §Y[SLO.GetNameDef]§!."
 HUN_join_allies_desc:0 "Майбутнє Угорщини та її демократичних цінностей — за зближенням з демократичними режимами Заходу. Увійшовши до їхнього спільного союзу, ми зможемо підтримувати їх, а також самі розраховувати на підтримку."
 HUN_join_axis_desc:0 "Наша економіка настільки залежить від Німеччини, що підтримка її військових дій є логічним кроком. Ми надішлемо запит на формальне включення до військового союзу країн Осі."
 HUN_kingdom_of_hun_and_rom:0 "Союз Угорщини та Румунії"
