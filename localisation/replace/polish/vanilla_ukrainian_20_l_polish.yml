 BOT:0 "Ботсвана"
 BOTTLENECK_CONNECTION_NAME_SINGLE:0 "$NAME|H$"
 BRA_anaue_tt:0 "Будуть відкриті рішення з вербування дивізій інтегралістського ополчення в областях після завершення в них мітингів.\nВербує нового генерала з рисою §Y$militias_officer$§!:\n Захист ополчень: §G+5%§!\n Швидкість ополчень: §G+5%§!\n Організація ополчень: §G+5%§!"
 BRA_autarky:0 "Бразильська автаркія"
 BRA_ban_the_communist_party_dynamic_tt:0 "§RЗниження стабільності буде масштабуватися з популярністю комуністичної партії!§!"
 BRA_cangaco_coup:0 "Переворот кангасу"
 BRA_const_kingdom_neutrality_DEF:0 "Королівство Бразилія"
 BRA_democratic_socialism_desc:0 "Невдала Intentona Comunista 1935 року та наступний надзвичайний стан змусили багатьох лівих політиків та активістів тікати з країни або перейти в підпілля, незалежно від того, підтримували вони насильницьку революцію чи ні. Зі стійким встановленням демократії, демократичні соціалісти нарешті мають можливість повернутися додому."
 BRA_disrupt_operation_bolivar_desc:0 "Нації старого світу довгий час втручалися у справи Південної Америки. Там, де колись вони надсилали солдатів та канонерки, тепер вони надсилають розвідувальних оперативників. Ми більше не можемо ігнорувати таку діяльність і повинні вистежити будь-яких таких оперативників у межах наших кордонів."
 BRA_dp_light_battery_2:0 "127mm/38 Mk 12, Mk 24 mt"
 BRA_estado_moderno_tt:0 "§Y$BRA_getulio_vargas$§! стане лідером партії §Y$BRA_fascism_party_long$§!."
 BRA_estado_moderno_tt_desc:0 ""
 BRA_foreign_legion_desc:0 "[ROOT.GetName] став притулком для іноземців у ці неспокійні часи. Серед них не бракує чоловіків, які готові віддати своє життя на захист наших спільних цінностей. Ми повинні надати їм можливість зробити це, завербувавши їх до іноземного легіону."
 BRA_german_tanks_tt:0 "Буде отримано §Y200§! од. [GER.GetAdjective]их §Yсередніх танків Panzer IV Ausf. A§!."
 BRA_infantry_equipment_0_short:0 "M1908"
 BRA_join_the_comintern_desc:0 "[BRA.GetNameDefCap] надто довго перебувала поза Комінтерном, але покладалася на його підтримку. Настав час належним чином прагнути приєднатися!"
 BRA_light_cruiser_1_desc:0 "The Bahia class was a class of two British-built scout cruisers built for Brazil and delivered in 1910. The ships were heavily refit and modernized in the 1920s but were still a relatively obsolete design by the start of World War II. During the war, the cruisers primarily performed convoy escort duties."
 BRA_potenji_river_conference_desc:0 "Знадобилися великі зусилля, щоб підготувати нашу економіку до війни, але настав час приєднатися до наших [USA.GetAdjective] союзників і повністю взяти на себе зобов'язання щодо захисту західної півкулі, навіть якщо це вимагатиме боротьби із загрозами по всьому світу."
 BRA_prepare_for_second_intentona:0 "Друга Intentona Comunista"
 BRA_smash_fascism_desc:0 "Є нації на континенті Південної Америки, до яких революція ще не дісталася. Пролетаріат у деяких із цих націй все ще піддається великому гніту під фашистськими правителями. Ми не можемо цього допустити, ми повинні звільнити наших товаришів-робітників!"
 BRA_soviet_arms_industry_desc:0 "Ми маємо сильну військову промисловість у [BRA.GetNameDef], але нещодавно ми шукали способи ще більше посилити її міцність. Деякі [SOV.GetAdjective] військово-промислові організації висловили зацікавленість у налагодженні роботи в [BRA.GetNameDef], ми повинні розглянути можливість їх запрошення."
