 FIN_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4:0 "Генерал-лейтенант"
 FIN_arm_the_lotta_svard_desc:0 "Лотта Сверд довела, що є великою перевагою у своїй ролі допоміжної сили. Враховуючи їхню майстерність і нашу жахливу ситуацію, можливо, настав час краще озброїти організацію та ефективніше інтегрувати її в збройні сили."
 FIN_collaboration_with_the_left_desc:0 "Відчуження лівих партій мало сприяє зміцненню нашого уряду. Але якщо ми знайдемо спосіб співпраці з ними, ми зможемо об'єднати більше населення для нашої справи."
 FIN_control_the_flux_of_iron_ore_desc:0 "Шведська залізна руда та її розподіл у Норвегії залишаються механізмом, за допомогою якого ведуться війни по всьому континенту та за його межами. Ми повинні взяти у власність цей критично важливий потік ресурсів, перш ніж він потрапить до рук наших ворогів."
 FIN_finnish_supremacy_in_the_north_influence_tt:0 "\n\nНе впливає на будь-яку незалежну скандинавську чи балтійську країну під фашистським режимом."
 FIN_finnish_supremacy_in_the_north_unlock_decisions_country_specific_tt:0 "Відмикає рішення §YНатиснути на уряд§! і §YПросувати ідеологічні мітинги§! в країні."
 FIN_german_military_advisors_desc:0 "Війна швидко змінюється через використання моторизованої техніки та авіації. Можливо, настав час дізнатися від наших [GER.GetAdjective]их товаришів по зброї, як найкраще використовувати ці нові ресурси на нашу користь."
 FIN_hold_leningrad_mission:0 "Утримати [195.GetName]"
 FIN_integrate_karelia_states:0 "Інтегрувати область [FROM.GetName] як частину Карельської Республіки"
 FIN_karelian_uprising_supported_by_finland:0 "\n\nThe situation has been further escalated when [FIN.GetAdjective] forces crossed the border broadening the conflict and bringing [FIN.GetNameDef] into the conflict against [SOS.GetNameDef]."
 FIN_keepers_of_the_north_desc:0 "Ми — єдиний режим на Півночі, який має силу волі керувати цим регіоном і захищати його від зовнішніх ворогів. Доки всі народи регіону не об'єднаються під нашим правлінням, ми ніколи не зможемо досягти тривалого миру."
 FIN_motti_tactics_category:0 "Тактика motti"
 FIN_power_from_the_dams_desc:0 "Використовуючи природні ресурси багатоводних річок [ROOT.GetName], було запропоновано суттєве розширення нашої гідроенергетичної інфраструктури. За словами наших експертів, інвестиції в будівництво нових гідроелектростанцій забезпечать засоби для різкого розширення нашої промислові потужності та стимулювати зростання нашої країни."
 FIN_prepare_construction_workers_actions_desc:0 "Робочі-будівельники можуть скалічити економіку своїми скоординованими зусиллями за один день, і настав час використати цих людей у повній мірі."
 FIN_proclaim_greater_finland_compliance_tt:0 "\nДодає §G70.0%§! підпорядкування у кожній необхідній території, який контролюється [ROOT.GetFlag][ROOT.GetNameDef].\n\n"
 FIN_secure_the_military_desc:0 "Військові завжди є корисним союзником для будь-якого початківця, який намагається здійснити державний переворот, як підтверджено історією. Тому життєво важливо забезпечити їхню підтримку, перш ніж ми спробуємо переворот."
 FIN_ship_light_battery_1:0 "102 mm/60 Pattern 1911"
 FIN_ship_torpedo_sub_4:0 "6x 533-мм ТА з P.Loading"
 FIN_socialist_wellfare_if_laaltonen_tt:0 "\nВпливає, якщо §Y$FIN_aimo_aaltonen$§! буде призначено лідером країни до завершення цього фокусу:"
 FIN_underground_resistance_cells_desc:0 "Коли ворог просувається, деякі фіни відмовляються підкорятися. Маленькі, спритні осередки опору беруть до рук зброю та влаштовують засідки, рейди та диверсії. Їхнє знання місцевості та відданість справі роблять їх грізною загрозою для будь-якого загарбника, яким би потужним він не був."
 FIN_union_of_finnish_brothers_in_arms_desc:0 "Союз фінських товаришів по зброї знаходиться в авангарді націонал-соціалістичного руху і отримує все більшу підтримку, оскільки нашій країні загрожує загроза з-за кордону. Якби ми співпрацювали з ними, ми могли б отримати велику підтримку захист нації."
 FIN_valtion_panssaritehdas_organization:0 "Valtion Panssaritehdas"
 FIN_viron_kansa_desc:0 "Хоча жителі [ROOT.GetName] і [EST.GetName] розділені Балтійським морем, вони мають довгу спільну історію. Крім того, ми стикаємося з майже тими самими проблемами, намагаючись зберегти незалежність. Можливо через мирним об'єднанням ми можемо врятувати наш народ від війни."
