 CHI_naval_aviation:0 "Морська авіація"
 CHI_new_model_province:0 "Приклад нової провінції"
 CHI_new_model_province_desc:0 "У той час як центральний уряд не справляється з модернізацією країни, ми проведемо менш масштабні реформи, але будемо виглядати світочами прогресу на тлі загальної відсталості нації."
 CHI_opposition:0 "Опозиція"
 CHI_order_destroyers:0 "Замовити есмінці"
 CHI_proclaim_a_new_chapter:0 "Проголосити нову главу"
 CHI_reach_out_for_help_desc:0 "Привид мілітаризму переслідує Китай зі сходу, і нам потрібно звернутися до наших американських контактів по допомогу. Вони повинні зрозуміти, що ми є їхньою першою лінією оборони проти японської загрози."
 CHI_rural_reconstruction_movement_sea_tt:0 "Зменшує час виконання рішень як §Yсільської, так і міської політичної опіки§! на §G10§! днів"
 CHI_sea_a_new_expedition_desc:0 "Оскільки Центральний уряд хитається, ми повинні згадати спадщину Північного походу і захопити столиці. Коли вони опиняться під нашою владою, визнання нас законною владою над Китаєм стане лише питанням часу."
 CHI_sea_gain_warlord_support_desc:0 "Щоб нас вважали легітимним правителем Китаю, ми спочатку повинні заручитися підтримкою інших мілітаристів."
 CHI_sea_power_struggle:0 "$CHI_power_struggle$"
 CHI_sea_renounce_the_mcmahon_line_desc:0 "$CHI_renounce_the_mcmahon_line_desc$"
