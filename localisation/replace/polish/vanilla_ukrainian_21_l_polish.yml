 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize:0 "Стандартизувати"
 sp_naval_escort_carrier_unique_reward_b_desc:0 "An escort carrier's air group is necessarily limited in size. Shall they specialize in antisubmarine warfare, or spotting surface targets, or adopt a generalized, multi-role approach?"
 sp_naval_fleet_submarine_unique_reward_a_desc:0 "Ми маємо знати, на чому зосередити зусилля під час проєктування нового типу далекохідних підводних човнів. Чи мають наші підводні човни бути безшумними й смертоносними мисливцями, чи ми прагнемо зробити їх надійнішими та стійкішими до загроз?"
 sp_naval_midget_submarine_unique_reward_a_desc:0 "Ми зрозуміли, що потенційно можемо спеціалізувати окремі вузли наших карликових підводних човнів, хоча це й вимагатиме певних компромісів."
 sp_naval_modern_carrier_desc:0 "Завдяки останнім досягненням у галузі суднобудування ми змогли побудувати нове покоління авіаносців, які значно відрізняються за розмірами та можливостями."
