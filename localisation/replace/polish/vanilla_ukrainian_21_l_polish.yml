 CHI_concerted_push_desc:0 "Раз за разом китайський народ демонстрував свою здатність до адаптації перед лицем негараздів. Ця ситуація нічим не відрізняється. Наше керівництво заявило про необхідність створення флоту, здатного конкурувати з великими державами, і наша економіка прийме цей виклик."
 CHI_conquer_tibet_desc:0 "Тибет займає стратегічно важливе становище між нами та Індією, будучи при цьому не в змозі захистити себе. Ми мусимо втрутитися та убезпечити свої південні кордони."
