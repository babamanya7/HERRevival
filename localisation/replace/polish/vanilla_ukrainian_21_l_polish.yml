 CHI_the_4_defence_areas:0 "4 оборонні райони"
 CHI_the_northern_mandate:0 "Північний мандат"
 CHI_the_political_tutelage_cat_desc:0 "Настав час повною мірою реалізувати ідеї Сунь Ятсена, підвищивши грамотність китайського народу та пробудивши його політичну свідомість, що дозволить створити та зберегти Республіку на нашій землі."
 CHI_the_soviet_volunteer_group_focus_desc:0 "За чисельністю наших ВПС ми жахливо відстаємо від інших держав регіону. Радянський Союз, можливо, не проти надіслати підкріплення з добровольців."
 CHI_utilise_the_terrain:0 "Використовувати місцевість"
 CHI_warlord_PRC_democratic:0 "Китайська республіка"
 CHI_warlord_PRC_fascism_DEF:0 "Китайська імперія"
 CHI_weaponise_the_faithful_desc:0 "Ті, хто вірить найпалкіше, битимуться найзапекліше. Наразі ми не маємо застосування для таких людей, але ми могли б створити його і поставити їх у перші лави. Їхня відданість стане нашим найгострішим лезом, що знищить кожного ворога."
 CHI_weaponise_the_hongmen_tt:0 "Кожен окупований китайський прибережний регіон та регіон з великим містом:\n  Опір: §R+30.0%§!"
 CHI_xian_fired:0 " Китайські лідери запрошені в Сіань"
 CHI_zhonghua_minzu_focus_desc:0 "Тепер, коли мілітаристи та регіональні губернатори повернулися під наш контроль, настав час розпочати належне возз'єднання і поглянути назовні. Багато наших законних територій були втрачені через націоналістичний набрід та іноземні держави, і ми тепер повинні зробити все можливе, щоб повернути їх у світло республіки."
 CHL_anti_fascist_coalition_forming:0 "Утворення Антифашистської коаліції"
 CHL_araucania_establish_a_guianan_government:0 "Заснувати Королівство Ель-Дорадо"
 CHL_attract_additional_french_investments:0 "Залучити додаткові інвестиції з Франції"
 CHL_avenge_the_pacification_of_araucania:0 "Помститися за втихомирення Арауканії"
 CHL_communist_but_democratic_party:0 "ДКП"
 CHL_cultivate_fanaticism_desc:0 "Без об'єднання народи Південної та Центральної Америки не мають майбутнього, і це мусить бути відомо всім. Якщо ми зараз не виступимо проти американців, то неодмінно потрапимо в їхні маніпулятивні та імперіалістичні лапи. Честь — це те, що робить нас гіспанцями, а жорстокість — це те, що чекає на кожного, хто буде проти нас."
 CHL_defense_of_the_hemisphere:0 "Оборона півкулі"
 CHL_denounce_the_anarchy_desc:0 "Той факт, що анархія, яка почалася після краху на Уолл-стріт, досі не подолана, є великим показником великої слабкості, притаманної нинішній владі та її пасивним ліберальним ідеалам. Ми мусимо публічно виступити проти них і запевнити людей, що майбутнє належить їм, якщо вони об'єднаються навколо нас."
 CHL_establish_conadi:0 "Заснувати Corporación Nacional de Desarrollo Indígena"
 CHL_establish_the_ministry_of_mining_desc:0 "Ми також мусимо створити національне міністерство, відповідальне за гірничодобувну промисловість нашої країни, щоби ми могли централізовано контролювати, де створюються шахти і як вони експлуатуються."
 CHL_expand_araucanian_steelworks_decision:0 "Розширити металургійний комбінат у Талькауано"
 CHL_expand_the_agricultural_field_desc:0 "Незважаючи на сучасні ідеї Венансіо Конюепана Уенчуала, є багато тих, хто хоче повернутися до старих укладів суспільства, заснованого на сільському господарстві, тільки цього разу з більшим державним втручанням для тих, хто не може утримувати себе особисто. Ми мусимо стежити за тим, чого хоче наше населення, щоб покращити національну стабільність."
