 lar_align_belgium.3.t:0 "[From.GetNameDefCap] клянеться воювати"
 lar_collab_gov.1.t:0 "[From.GetAdjective] Partisans in [Root.GetNameDef]"
 lar_compensate_italy.1.t:0 "Франція пропонує колоніальну компенсацію"
 lar_end_the_occupation.4.a:0 "Нарешті вони зрозуміли."
 lar_end_the_occupation.6.t:0 "[From.GetLeader] відмовляється"
 lar_fra_join_the_ententes.3.desc:0 "Після тривалих обговорень [From.GetAdjective] кабінет з невеликою перевагою проголосував за відхилення нашої пропозиції. В офіційній відповіді значиться, що союз між державами [From.GetNameDef] і [This.GetNameDef From.GetNameDef] захищати країни, з якими вона свідомо вирішила не пов'язувати себе, далі зазначається, що хоча ми, зрозуміло, вільні самостійно вибирати свій зовнішньополітичний курс, нам не варто чекати, що держава [From.GetNameDef] прийде до нас на допомогу, якщо ми будемо втягнуті у великий конфлікт."
 lar_france_political_violence.4.a:0 "Цих екстремістів треба зупинити."
 lar_france_political_violence.4.desc:0 "Схоже, після короткого періоду затишшя, коли стало очевидно, що [This.GetLeader] користується безпрецедентною підтримкою народу, знову повернулося політичне насильство, властиве протистоянню комуністів і реакціонерів. проти людей і підприємств, це нагадує нам про дні хаосу, які, як ми вважали, вже позаду."
 lar_news.4.e:0 "Ми повернулися туди, де й маємо бути."
 lar_non_intervention.2.desc:0 "Назвавши це важливим кроком з припинення насильства в Іспанії, [From.GetnameDef] офіційно вступає до Комітету з невтручання. Чи буде глава держави насправді виконувати умови Комітету, чи стане відомо в майбутньому."
 lar_operative_event.4.desc:0 "Після близької зустрічі з [From.From.GetAdjective]ою контррозвідкою агент [This.GetName] повідомляє, що на деякий час [This.GetSheHe] виходить з гри, щоби залікувати рани, отримані при спробі опиратися [This.GetHerHis] затриманню.\n\nЗараз [This.GetName] знаходиться в безпечному місці, заліковує рани і кілька тижнів буде поза доступом, поки не одужає."
 lar_portugal_iberian_summit.8.b:0 "Ми відхиляємо запит. Вони лише послаблять нас."
 lar_portugal_navy_mutiny.1.a:0 "Їхня справа справедлива. Не заважайте їм!"
 lar_portugal_promote_monarchist_cause.1.t:0 "Португалія пропагує монархізм!"
 lar_portugal_purchase_ships.1.t:0 "[From.GetNameDefCap] хоче придбати [Root.GetAdjective]і кораблі"
 lar_portugal_spanish_civil_war.2.desc:0 "[POR.GetAdjective] уряд проголосив свою підтримку іспанських націоналістів і оголосив, що [POR.GetNameDef] розглядає можливість вживання суворих заходів під час іспанської громадянської війни. Виступаючи з промовою, [POR.GetLeader] в Іберії ідей комунізму та анархізму, оголосивши, що борг держави [POR.GetNameDef] — допомогти іспанським сусідам у боротьбі з республіканцями."
 lar_ratify_the_stresa_front.1.b:0 "Цей договір нам більше не цікавий."
 lar_spain.100.t:0 "Об'єднання іспанського світу!"
 lar_spain.14.desc:0 "Опір анархістів, хоч і лютий, в останні тижні стає все більш неорганізованим. Сьогоднішня перемога нарешті спонукала Раду з оборони до безумовної капітуляції, але окремі комуни відмовляються підкорятися цьому наказу, і місцями бої ще продовжуються. Хоч це і значно спростило нам війну, ми, як і раніше, боремося з ворогами, що залишилися."
 lar_spain.40.a:0 "Дуже ефективно."
 lar_spain.71.a:0 "Знищення держави [SOV.GetNameDef] — головне завдання, все інше не так важливо."
 lar_spain.72.a:0 "Вони розуміють, звідки загрожує головна небезпека."
 lar_spain.76.t:0 "[From.GetNameDefCap] відмовляє у допомозі"
 lar_spain.78.a:0 "Він дуже ризикував."
 lar_spain.79.desc:0 "Сьогодні в Реймському соборі з великою помпою пройшла коронація, на якій [Root.GetLeader] був проголошений королем. Після офіційної церемонії король привітав натовп, що зібрався зовні, радіючи тому, що їх країна поверне.\n\nУ промові, зверненій до своїх підданих, король підкреслив єдність Франції й Іспанії, символом якої він виступає."
 lar_spheres_of_influence.2.desc:0 "[From.GetLeader] успішно завершує переговори: бесіда зайняла всього кілька хвилин, і обидва лідери швидко дійшли угоди з запропонованих питань. Єдиним спірним пунктом стала невелика німецькомовна громада в Бельгії. Вирішити це питання доручили диплом."
 lc_command_center_desc:0 "Повністю інтегрований командний центр, який перетворює сухопутний крейсер на мобільний штаб, оснащений сучасними системами зв'язку для координації масштабних військових операцій."
 lc_high_impact_obliterator_cannon_desc:0 "Ця зброя, спеціально розроблена для пробивання надзвичайно товстої броні, завдяки високій кінетичній енергії є потужною зброєю проти інших надважких танків."
