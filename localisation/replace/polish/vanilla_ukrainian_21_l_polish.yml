 NOR_prop_up_the_economy:0 "Підтримати економіку"
 NOR_protect_finnmark_from_the_bolsheviks_desc:0 "Як наш найпівнічніший і найсхідніший регіон, Фіннмарк стане очевидною точкою входу, якщо [SOV.GetNameDef] вирішить, що залякування [FIN.GetNonIdeologyName] недостатньо."
 NOR_ramp_up_naval_production:0 "Збільшити морське виробництво"
 NOR_request_reinstatement_desc:0 "Наш ворог втрачає позиції в [NOR.GetName], і ми вважаємо, що настав час знову відновити наш уряд на належному йому місці."
 NOR_rikstanken_turret_desc:0 "В ній розміщена гармата та її можна повертати. Коли тій заманеться."
 NOR_ship_medium_battery_3:0 "20.3 cm/50 RPC"
 NOR_squash_dissent_desc:0 "Ми не можемо дозволити, щоб плоди наших зусиль були вкрадені шкідниками. Вкрай важливо, щоб ми знайшли та стерли незгоду раз і назавжди. Зрештою, кожен, хто сумнівається в нашому уряді, є нашим ворогом."
 NOR_swedish_claims_desc:0 "[NOR_GetSwedishClaimsDesc]"
 NOR_tank_procurement_desc:0 "Нашої місцевої танкової програми явно недостатньо для бронетехніки XX століття. Радісний бік полягає в тому, що багато країн, які мають необхідний досвід і обсяги виробництва, можуть продавати свої бронетехніки, це було б чудовим скороченням для переведення [ROOT.GetAdjective]ої армії у це століття."
 NOR_the_kings_abdication:0 "Зречення короля"
 NOR_war_in_finland:0 "Війна у Фінляндії"
 NOR_war_in_finland_desc:0 "Народ Фінляндії досить довго страждав, ми повинні об'єднати наші сили з [SOU.GetName], щоб звільнити його від капіталізму. Це буде лише перший крок у звільненні всіх північних народів."
 NOTIFICATION_OUR_GENERAL_CAPTURED:0 "§R$NAME|H$ у полоні!§!"
