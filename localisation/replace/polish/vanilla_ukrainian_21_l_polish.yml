 political.1.t:0 "Комунізм на підйомі"
 political.11.d:0 "Політика й армія завжди були переплетені у фашизмі. Паралельно зі зростанням політичного руху фашистські партії почали формувати воєнізовані організації для захисту від внутрішніх і зовнішніх загроз, причому внутрішні загрози — це їхні політичні опоненти. Хоча багато хто вважає такий розвиток подій тривожним, хвиля мілітаристського фурору призвела до збільшення кількості добровольців, які вступають до наших збройних сил.\n\nПолітичні лідери руху зазначають, що їхні опоненти мають підстави побоюватися. Маючи армію, пронизану на декількох рівнях настільки явно політичними елементами, вороги держави [Root.GetName] та вороги фашизму починають виглядати дуже схожими."
 political.21.d:0 "Отримавши відмову у проведенні референдуму, майже символічної спроби захопити владу законним шляхом, фашисти використали свою значну громадську підтримку та зв'язки у [Root.GetAdjective]ому війську для спроби державного перевороту. Уряд [Root.GetRulingParty] відмовився від їхніх умов і заявляє, що буде боротися до кінця, щоби зберегти державу [Root.GetName] такою, якою ми її знаємо."
