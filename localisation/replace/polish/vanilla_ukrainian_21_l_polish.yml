 SIA_ship_medium_battery_3:0 "20.3 cm/50 w/RPC"
 SIA_siamese_youth_movement_desc:0 "Молодь [THIS.GetName] потрібно загартовувати, як сталь над гарячим полум'ям. Вони навчаться поважати державу, захищати батьківщину і стануть повноцінними членами тайського суспільства."
