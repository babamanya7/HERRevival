 SWI_build_naval_bases_desc:0 "Баз, які ми завоювали, недостатньо, і ми не можемо побудувати нові достатньо швидко, щоби наздогнати те, що нам потрібно. Необхідно докласти нових зусиль, щоби досягти наших військово-морських цілей."
