 establishing_vichy_tt:0 "§YВішістська Франція§! буде створена на півдні Франції. \n§YВішістська Франція§! отримає усі §Yфранцузькі колонії§!.\nЧастина §Yфранцузьких§! військ буде передана §YВішістській Франції §!\n(§YВішістська Франція§!):\n §YФрансистький рух§! стане керівною партією.\n §YФіліпп Петен§! стане лідером §Yфашистської§! партії.\n Отримає національний дух §YЦіна окупації§!, що дасть (Заводи, що виробляють споживчі товари: §Y20%§!)\n Столицею стане §YОвернь§!"
