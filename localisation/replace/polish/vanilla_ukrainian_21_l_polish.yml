 denmark_expansion_event.801.desc:0 "Ми отримали відповідь від [FROM.GetAdjective]ого уряду щодо нашої пропозиції захисту. Вони з радістю приймають наше заступництво!"
 denmark_occupation_event.20.t:0 "Успішний наліт на склади зброї"
 denmark_overlord_events.47.desc:0 "До нас з'явилася делегація з міста [FROM.GetCapitalVictoryPointName] і передала нам декларацію про те, що [ROOT.GetNameDef] офіційно увійде до складу великої держави [FROM.GetNameDef]."
 denmark_political_events.10.a:0 "Фашистська брехня!"
 denmark_political_events.3.desc_snap_election:0 "У державі [DEN.GetNameDef] оголошено позачергові вибори, і кандидати терміново організовують передвиборчі кампанії, щоб схилити електорат на свій бік."
 denmark_protection_event.111.desc:0 "[FROM.GetNameDefCap] приймає нашу пропозицію провести [ROOT.GetAdjective]о-[FROM.GetAdjective]і військові навчання — наші збройні сили стануть сильнішими."
 denmark_protection_event.130.a:0 "Ми станемо на захист один одного"
 denmark_protection_event.5.desc:0 "Надіслану нами [FROM.GetAdjective]ому уряду пропозицію було прийнято! Тепер ми можемо почати опрацьовувати нашу торговельну угоду."
 denmark_resistance_event.20.b:0 "Ми не можемо дозволити собі псувати відносини з їхньою метрополією"
 denmark_resistance_event.20.desc:0 "[DEN.GetLeader] надсилає нам секретний запит — пробну кулю щодо розміщення данських військ на [ROOT.GetAdjective]ій території в рамках підготовки до звільнення держави [DEN.GetNameDef]. Ми могли б приховати чисельність і справжнє призначення цих військ, назвавши їх військовою поліцією."
