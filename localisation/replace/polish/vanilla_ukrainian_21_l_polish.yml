 GOE_IRQ_news.2.a:0 "Ми повинні готуватися відповідно."
 GOE_RAJ.11.a:0 "Кров і Свобода!"
 GOE_RAJ.3.t:0 "[FROM.GetName] відхиляє"
 GOE_RAJ.39.b:0 "Гарантувати мінімальну заробітну плату"
 GOE_RAJ.48.a:0 "Тривожно"
 GOE_RAJ.7.a:0 "Ми допоможемо йому."
 GOE_RAJ.9.desc:0 "[FROM.GetName] заявила, що має плани, які будуть поставлені під загрозу, якщо вони втрутяться у війну проти [ENG.GetAdjective], і тому утримається від допомоги нам."
 GOE_RAJ_eic.2.desc:0 "Компанія потребує твердої руки, щоб керувати її зростанням, і нам потрібно обрати лідера, який забезпечить найвищу віддачу від інвестицій. Його особистість вплине на решту групи керівництва, тому важливо, щоб ми зробили правильний вибір."
 GOE_RAJ_eic.7.desc:0 "[FROM.GetName] не бажає розлучатися з цією ділянкою землі, але не виключає інших можливостей для передачі землі в майбутньому."
 GOE_RAJ_famine.9.a:0 "Вибачте, старий друже. Ми нічого не можемо виділити."
 GOE_RAJ_goa.1.a:0 "Це не варте потенційного конфлікту."
 GOE_RAJ_loyalist.11.desc:0 "Це чорний день для [ENG.GetAdjective] Імперії. Після падіння [ENG.GetNameDef] ми опинилися в дуже унікальному становищі, щоб прийняти їхнє вигнане керівництво. Це частково завдяки нашим зусиллям підтвердити нашу лояльність до Корони. $ENG_winston_churchill$ керував [ENG.GetNameDef] якнайкраще, і ми повинні вирішити, яку посаду він може обіймати в [RAJ.GetNameDef]."
 GOE_RAJ_navy.1.b:0 "Ми не зацікавлені."
 GOE_RAJ_partition.5.b:0 "Посилити зусилля поліції"
 GOE_RAJ_partition.9.desc:0 "[ENG.GetName] висловив глибоке занепокоєння щодо воєнних дій на Індійському субконтиненті. Їхній уряд чітко дав нам зрозуміти, що не бажає бачити, як обидві країни вступають у криваву війну, і втрутиться, якщо знадобиться, силою, щоб покласти цьому край."
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION_DESC:0 "Масове бомбардування заводів, нафтопереробних заводів та транспортної інфраструктури глибоко у ворожому тилу, щоб перерізати його військовий потенціал з середини."
 GRE_CAS_equipment_3:0 "Curtiss Shrike"
 GRE_STABILITY_TOOLTIP:0 "Бонус до стабільності"
 GRE_an_orthodox_state_desc:0 "Ми живемо в християнській православній державі, православ'я — важлива частина нашої національної ідентичності. Слава Тобі, Боже наш, слава Тобі!"
 GRE_anti_british_stratagems:0 "$GRE_anti_german_stratagems$"
 GRE_anti_bulgarian_stratagems:0 "$GRE_anti_german_stratagems$"
 GRE_befriend_monarchists:0 "Подружитися з £faction_gre_monarchist монархістами"
 GRE_destroyer_4_desc:0 "The Leon class was a class of U.S. Cannon-class destroyer escorts. They were commissioned in 1943 but not delivered to the Hellenic Navy until 1951. The ships were slower than a standard destroyer. They displaced 1,240 tons and had three 3 in./40 caliber guns as their main armament, as well as a strong complement of torpedoes and ASW equipment."
 GRE_encourage_tourism:0 "Заохотити туризм"
 GRE_faction_management_category_desc:0 "У внутрішній політиції Греції панує такий безлад, що без збереження цілісності нації необхідно пряме втручання держави."
 GRE_fascists_stability_status_amount:0 "[ROOT.GetFascistStabilityBonus]"
 GRE_fighter_equipment_1_short:0 "PZL P-24G"
 GRE_hold_national_showcase_for_investors_eng_desc:0 "Ми влаштуємо тут, в колисці західної цивілізації, масштабну демонстрацію, щоби залучити інвестиції в наш збіднілий промисловий сектор."
 GRE_infantry_equipment_1_short:0 "Mannlicher M95/24"
 GRE_king_arrested:0 "Король поміщений під домашній арешт"
 GRE_phoideratoi_desc:0 "Наші пращури співпрацювали з варварами, якщо виникала така потреба, і зараз ця потреба склалася знову. Ми мусимо дати всім колишнім підданим Імперії, які співчувають нашій боротьбі із сучасним світом, право боротися у лавах нашої славної армії! Разом у єдиному пориві ми маршируємо до перемоги!"
 GRE_prepare_against_the_mediterranean_threat:0 "Підготуватися до відбиття загрози Середземномор'ю"
 GRE_strat_bomber_equipment_2:0 "EAF Katapéltis"
 GRN_DEF:0 "Гренландія"
 GRN_democratic:0 "Гренландія"
 GRN_fascism:0 "Східне Інуїтське володарство"
 GUAY_adopt_minority_languages:0 "Прийняти мови меншин"
 GUAY_agricultural_colonization_desc:0 "Сільське господарство завжди було значною частиною нашої економіки. Розширення його за допомогою освоєння землі принесе подальші прибутки."
 GUAY_land_reforms_desc:0 "Нам потрібно покращити інфраструктуру в нашій країні, оскільки це перший крок будь-якого сучасного суспільства."
 GUAY_long_term_contracts:0 "Довгострокові контракти на зброю"
 GUAY_place_opposition_leaders_in_house_arrest_desc:0 "Нам потрібно діяти швидко, щоб зміцнити наш контроль над країною. Ми помістимо опозицію під домашній арешт, доки переворот не буде завершено."
 GUAY_the_permanent_leader_desc:0 "[ROOT.GetLeader] — це символічна фігура країни, і ми поставимо його на п'єдестал, щоб простий солдат мав за ким згуртуватися та за кого померти. Він стане постійним лідером нашої країни."
 GUAY_the_stuff_of_legends:0 "Те, з чого складаються легенди"
