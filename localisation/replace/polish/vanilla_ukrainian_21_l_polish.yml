 SPA_prepare_the_carlist_insurrection_tt:0 "Відкриває доступ до рішень §YПідготовка повстання карлістів§!, що дозволяють убезпечити контрольовані регіони для сторони карлістів у повстанні.\n\nКрім того, забезпечує §YБургос§! і §YНаварру§! для сторони карлістів, якщо вони контролюються."
 SPA_reclaim_spanish_africa_desc:0 "Немає причин, щоб нинішні кордони наших північноафриканських володінь були висічені в камені. З огляду на нинішню слабкість Франції, мабуть, немає кращого часу, щоби заявити наші права на територію, ніж зараз."
