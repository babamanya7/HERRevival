 SPR_political_assassination_mission_desc:0 "Кровожерлива риторика наших політичних ворогів закликала до усунення провідного прихильника нашої справи... Нічого дивуватися, якщо хтось вирішить діяти відповідно до цих слів."
 SPR_portuguese_anarchism_desc:0 "Наша війна за свободу перекинулася за португальський кордон, і уряд дестабілізується. При належній підтримці цілком можливо, що повномасштабне анархістське повстання може відбутися в їхніх межах. Ми повинні запалити це полум'я!"
 SPR_reeducate_the_bourgeoisie_desc:0 "Народний фронт закінчив свій курс, і настав час для буржуазії перевиховатися та звільнитися від її економічних і суспільних хибних уявлень. Ми ще зробимо їх справжніми громадянами держави."
