 tfv_australia.20.a:0 "У нас немає іншого вибору, окрім як прийняти наш новий статус провінції держави [From.GetNameDef]."
 tfv_australia.20.d:0 "Ми тривалий час із тривогою спостерігали за зростанням націоналістичного запалу в державі [From.GetNameDef], і здається, що нарешті настав день, коли він вилився за їхні власні кордони.\nНазиваючи спільну спадщину як «нації-піонери», є пропозиції було спущено на воду об'єднаної держави Океанії. Проте риторика ставала дедалі агресивнішою перед обличчям [Root.GetAdjective]ого опору.\n\nЗараз політичні спекуляції перетворилися на відкриту ворожість, і [From.GetLeader] публічно вимагає анексію всієї [Root.GetAdjective]ої території до складу держави [From.GetNameDef].\nЯкщо ми відмовимося, силове вторгнення здається цілком можливим."
 tfv_australia.3.t:0 "[From.GetNameDefCap] відхиляє стратегічні коригування"
 tfv_australia.50.a:0 "Будь-яку революційну націю вітають з розпростертими обіймами!"
 tfv_australia.60.t:0 "[From.GetNameDefCap] примушує верховенство"
