 SWE_universal_basic_income_desc:0 "Кожен чоловік і жінка мають бути впевнені, що вони можуть підтримувати принаймні мінімальний рівень існування, і держава зобов'язана піклуватися про своїх громадян. Загальний базовий дохід вирішує обидва проблеми."
 SWE_uranium_project_desc:0 "[GER.GetAdjective]і науковці займаються ядерними дослідженнями протягом багатьох років. Вони стверджують, що енергія атома може бути вивільнена в одній колосальній детонації. Маючи доступ до важкої води для експериментів і наш спільний науковий досвід, ми може допомогти їм створити таку дивовижну зброю."
