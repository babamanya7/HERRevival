 AFG_khorasan_neutrality:0 "Хорасан"
 AFG_political_events.101.a:0 "Наш західний фланг нарешті захищений."
 AFG_political_events.112.t:0 "[FROM.GetNameDefCap] відмовляється поступитися територією"
