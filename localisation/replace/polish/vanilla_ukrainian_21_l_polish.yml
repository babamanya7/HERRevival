 MEX_focus_state_education_desc:0 "Соціалістична освіта в Мексиці означає орієнтацію на раціоналізм і патріотизм, а не на прихильність догмам і диктатам Папи. Нам потрібно лише дати одному поколінню мексиканської молоді хорошу антицерковну освіту, і їхня народна підтримка зникне миттєво. Люди не будуть терпіти духовенство-паразита, коли знають, що можливий інший світ."
 MEX_focus_synarchist_youth_desc:0 "Молодь — це майбутнє нашої країни. Якщо їх правильно виховати, вони стануть втіленням наших ідеалів: сили, вірності та благочестя."
