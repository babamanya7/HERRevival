 ITA_STATE_39:0 "Альто-Адідже"
 ITA_a_bandits_war_desc:0 "Старі способи ведення війни мали би померти в окопах на Ізонцо. Декотрі з наших старих генералів досі вважають, що сучасну війну можна виграти, кинувши маси солдатів у м'ясорубку. Тепер ми знаємо ліпше: сучасну війну виграють швидкі маневри та гнучкі організації, здатні реагувати швидко. Ми мусимо готувати нашу армію до такої війни."
 ITA_anglo_italian_agreements_suez_unlocked_tt:0 "§GСуецький канал більше не буде заблокований для держави [ROOT.GetName]§!."
 ITA_ascari_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_infantry_defence_factor$: §G+3.00%§!\n\n"
 ITA_blackshirt_loyalty_desc:0 "Чорносорочники вже давно займають особливе місце в італійському фашизмі, і якщо ми хочемо викликати почуття натхнення у населення, нам варто було б завоювати лояльність цієї організації. Вони були б дуже корисними в поширенні божественного сприйняття славного нового дуче в збройних силах — і не тільки."
 ITA_bop_praise_the_army:0 "£BoP_right_texticon Похвалити армію"
 ITA_bop_praise_the_navy:0 "£BoP_right_texticon Похвалити флот"
 ITA_bop_resign_ministry_of_corporations_position_desc:0 "Відставка з посади міністра корпорацій відкриє доступ до неї іншим, і Беніто Муссоліні втратить контроль над фінансовою системою та інституціями Італії."
 ITA_bop_send_support:0 "£BoP_right_texticon Надіслати військову підтримку державі [FROM.GetName]"
 ITA_caligulas_pride_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$ITA_caligulas_pride_dynamic_modifier_tt$\n\n"
 ITA_comandante_diavolo_create_units_tt:0 "\nСтворити §Y[ROOT.GetFlag][ROOT.GetAdjective]і§! нерегулярні війська в колоніях, які Вам належать і Ви контролюєте:"
 ITA_condemn_colonialism_desc:0 "Настав час засудити колоніалізм і викликати європейські держави, які пригноблювали африканський народ незліченні роки. І якщо дійде до рукоприкладства, ми будемо боротися проти них на благо африканського народу."
 ITA_crush_opposition:0 "Розбити опозицію"
 ITA_expand_naval_facilities_desc:0 "Першокласні ВМС потребують не тільки потужний бойовий флот, але й порти та верфі для його забезпечення. Інвестуючи в морську інфраструктуру, наш флот матиме бази, будівельні та ремонтні потужності, необхідні йому на випадок війни."
 ITA_greece_war_goal:0 "Війна з Грецією"
 ITA_heavy_cruiser_4_desc:0 "Клас «Garibaldi» — це гіпотетичний клас важких крейсерів пізньої війни. Він мав водотоннажність близько 14 000 тонн, був добре озброєний вісьмома 203-мм гарматами OTO/Ansaldo і міг не відставати від більшості авіаносців та інших капітальних кораблів."
 ITA_heroes_of_the_nation_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_COMMAND_POWER_GAIN_MULT$: §G+15%§!\n$MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-20.0%§!\n\n"
 ITA_human_torpedo_raid_tt:0 "Цей рейд може бути проведений лише один раз."
 ITA_improve_the_industries_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$MODIFIER_CONVERSION_COST_CIV_TO_MIL_FACTOR$: §G-10.00%§!\n\n"
 ITA_italian_highways_bba_desc:0 "Стародавні римляни будували дороги, яким заздрив увесь світ. Сьогодні ж вискочки-німці вірять, що їхній автобан значно перевершує будь-що, що ми можемо збудувати. Ми доведемо, що вони неправі."
 ITA_italian_socialism:0 "Італійський соціалізм"
 ITA_joint_maneuvers_with_country_doctrine_bonus:0 "Спільні морські маневри"
 ITA_keep_specialization_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §R-20.00%§!\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+10.00%§!\n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+10.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.00%§!\n\n"
 ITA_king_side:0 "$ITA_vittorio_emanuele_iii$"
 ITA_liberate_the_workers_of_africa:0 "Звільнити робітників Африки"
 ITA_liberation_or_death_desc:0 "Ми завзято боролися за визволення італійського народу від фашистського гніту. Ми зазнали великих втрат, але це не було даремно: настав час зробити останній поштовх, щоби викорінити фашизм в Італії раз і назавжди!"
 ITA_masters_of_the_mediterranean_desc:0 "Сила держави пропорційна її морському положенню. Настав час заявити про повний контроль над Середземним морем, адже це право італійського народу — панувати над стародавнім морем, яке було колискою нашої цивілізації."
 ITA_missiolini_expand_intelligence_agency_desc:0 "Розширюючи нашу службу розвідки, ми будемо проникати в усі сфери італійського суспільства, щоб витягувати комуністів, злочинців та інші шкідливі елементи на чисту воду і притягати їх до відповідальності, роблячи Італію більш безпечною."
 ITA_modify_regia_marina_dynamic_modifier_ns_intro:0 "Змінити §Y[GetAppropriateRegiaMarinaNsName]§! на:"
 ITA_nav_bomber_equipment_1:0 "Savoia-Marchetti SM.79 Sparviero"
 ITA_new_colonial_policies:0 "Нова колоніальна політика"
 ITA_organize_strikes_in_the_north_desc:0 "Перед страйком ми зосередимо всі наші зусилля на тому, щоби заручитися підтримкою промислових робітників Італії та переконатися, що більш індустріальні райони півночі стануть разом з нами проти фашистського режиму."
 ITA_oto_naval_guns:0 "Морські гармати «OTO»"
 ITA_proper_carriers_desc:0 "Інноваційні дизайнери, такі як Луїджі Ганьйотто, створювали проєкти авіаносців протягом останнього десятиліття. Використовуючи цей досвід, а також існуючий корпус швидкісного лайнера «Roma» (але з новими, потужнішими двигунами), ми можемо отримати готовий до експлуатації авіаносець швидше, ніж якби будували його з нуля."
 ITA_raid_category_fluff_text_land_infiltration_raids:0 "§LАрдіті§!"
 ITA_railway_innovations_desc:0 "Навіть в епоху автомобілів потужна залізнична мережа залишається основою сильної економіки. Подальше розширення залізниць в Італії створить умови для майбутнього зростання."
 ITA_rds_DEF:0 "$RDS_DEF$"
 ITA_reclaiming_cores_tt:0 "Ефекти буде застосовано щоразу, коли [ROOT.GetName] відвоює §Yосередній регіон§! у ворога."
 ITA_reinforce_regia_aeronautica_desc:0 "Regia Aeronautica поважають і їм заздрять у всьому світі, але є ще багато можливостей для вдосконалення. Маючи більше доступних ресурсів, ми мусимо інвестувати в оснащення та тренування, щоби зробити її найстрашнішою військово-повітряною силою!"
 ITA_scout_plane_equipment_2:0 "Caproni Ca.311"
 ITA_sell_obsolete_escort_ships_to_country_only_once_tt:0 "\nМи можемо успішно продати наші кораблі лише раз.\n"
 ITA_stockpile_fuel:0 "Запастися пальним"
 ITA_strengthen_the_papacy_desc:0 "Зрозуміло, що вплив папи в італійському суспільстві дуже сильний. Єдиний спосіб зберегти національну стабільність — це розширити повноваження Церкви в межах Королівства Італія."
 ITA_subdue_the_sentinels:0 "Підкорити вартових"
 ITA_support_albanian_irredentism:0 "Підтримати албанський іредентизм"
 ITA_tac_bomber_equipment_3:0 "Cant Z.1018 Leone"
 ITA_the_italian_legions:0 "Італійські легіони"
 ITA_train_irregulars_create_units_tt:0 "Створити §Y[ROOT.GetFlag][ROOT.GetAdjective]і§! нерегулярні війська в колоніях у власності та під контролем:"
 ITA_turkey_friend_desc:0 "Після італо-турецької війни та Великої війни в турків немає причин нас любити. Однак реальна політика має перевагу над старими обрáзами, і нинішня ситуація в Середземномор'ї може привести наші дві зорі в одну смугу."
 ITA_united_anarchist_confederations:0 "Об'єднані анархістські конфедерації"
 ITA_vallo_alpino_settentrionale_west_desc:0 "Ми можемо вбезпечити наш північно-західний кордон, побудувавши там низку укріплень."
 ITA_vittorio_abdicate:0 "Зречення Віктора Еммануїла III"
 IVO_fascism_ADJ:0 "Івуарськ"
 JAM_communism:0 "Ямайська комуна"
 JAN_ADJ:0 "Полярн"
 JAP_SH_battleship_1_desc:0 "Клас «Yamato» складався з найважчих лінкорів, коли-небудь створених, водотоннажністю 72 000 тонн, і ці кораблі були спроєктовані як гордість і міць японського флоту в рамках плану «Богині миру». Кожен корабель ніс дев'ять 460-мм гармат, найбільшу морську артилерію, коли-небудь встановлену на військовому кораблі."
 JAP_a_truly_righteous_army:0 "Істинно праведна армія"
 JAP_achieving_joubukkokudo:0 "Проголосити Джьобуккокудо"
 JAP_ally_the_league_of_blood:0 "Союз із Лігою крові"
 JAP_amphibious_mechanized_equipment_2:0 "Type 6 Ka-Tsu Kai"
 JAP_anti_colonialism_map_category_name:0 "Колоніальні регіони, де можна підтримати опір"
 JAP_anti_communist_bulwark_desc:0 "Принципи демократії несумісні із існуванням комунізму. Ми мусимо дати бій ворожій ідеології, захистивши як себе, так і всіх, хто покладається на нас."
 JAP_approach_sumitomo_desc:0 "Дзайбацу Сумітомо сягає корінням книжкової крамниці в Кіото, хоча саме рафінування міді прославило компанію. Сьогодні вони спеціалізуються на видобутку корисних копалин, а також на банківській справі. Ми повинні заручитися їхньою підтримкою для нашого уряду, щоб ми могли максимально ефективно використовувати їхні активи."
 JAP_arm_anti_communist_mongol_dissidents_decision:0 "Озброїти антикомуністичних монгольських дисидентів"
 JAP_began_the_suiyuan_campaign:0 "Розпочато кампанію в Суйюань"
 JAP_build_up_korean_industries_desc:0 "Ми повинні докласти цілеспрямованих зусиль для розбудови промислової бази на Корейському півострові, особливо у сферах важкої промисловості та боєприпасів. Зрештою, це буде неоціненним у будь-яких майбутніх війнах з Китаєм або західними країнами. Цю політику спочатку запропонував Казушіге Угакі, і ми повинні продовжувати йти цим шляхом."
 JAP_carrier_ship_engine_1:0 "«Kampon» 65 000 к. с. н. в."
 JAP_chinese_japanese_neutrality_pact_flag:0 "Завершено фокус §Y$JAP_ensure_temporary_peace_with_china$§!"
 JAP_claim_the_scripech:0 "Претензія на Шріпеч"
 JAP_communist_volunteers_desc:0 "Наша боротьба не знає кінця. Ми маємо допомогти дружнім націям. Ми пошлемо до них найкращих, найдостойніших із нас на боротьбу за справу революції!"
 JAP_core_asian_state:0 "Інтегрувати народ §Y[FROM.GetName]§!"
 JAP_develop_kalimantan_oil_deposits:0 "Develop the Kalimantan Oil Fields"
 JAP_develop_shandong_aluminium_deposits:0 "Розвиток родовищ бокситів у Шаньдуні"
 JAP_empower_the_emperor:0 "Наділити владою Імператора"
 JAP_ensure_civil_liberties:0 "Забезпечити громадянські свободи"
 JAP_expand_hiratsuka_navy_arsenal_desc:0 "Військово-морський арсенал боєприпасів у Хірацуці, заснований у 1905 році, має потенціал для значного розширення. Вони зможуть спеціалізувати різні заводи для проєктування та інженерії, включаючи виробництво боєприпасів для кулеметів, морських артилерійських снарядів, відновлення розчинників та виробництво нітрогліцерину."
 JAP_expand_the_snlf:0 "Збільшення морської піхоти"
 JAP_female_leader_2_text:0 "її"
 JAP_form_the_kido_butai_desc:0 "Щоб максимізувати наступальну ударну міць, ми об'єднаємо найбільшу концентрацію авіаносців, яку коли-небудь бачив світ, в одну бойову групу. Розробивши доктрини, необхідні для проведення узгоджених наступальних операцій у такій формі, ми не залишимо нашим ворогам жодного шансу проти нашої переваги в морській авіації."
 JAP_found_the_boeitai_desc:0 "Оскільки оборонна війна на наших власних землях стає все більш реальною, ми повинні створити Корпус оборони, який можна буде швидко мобілізувати для захисту Японських островів у разі ворожого вторгнення. Сюди також увійдуть особи, які зазвичай не підлягають військовій службі згідно з японською системою призову."
 JAP_fukumotoism_tt:0 "Розблоковує рішення, яке можна прийняти до §G6§! разів, що надає §Yцивільні фабрики§! та бонуси до §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 JAP_german_rocketry_desc:0 "Нові німецькі технології припали б до наших збройних сил дуже до речі. Ми мусимо за будь-яку ціну отримати доступ до цих креслень."
 JAP_guardian_of_the_pacific_desc:0 "Ми візьмемо на себе роль захисника всіх азійських держав у Тихому океані та навколо нього. Звільнившись від західного імперіалізму, вони потребуватимуть керівної руки, яка підніме їх як повноцінні демократії. Першим кроком для досягнення цієї мети є пропозиція стати новим захисником тихоокеанських колоніальних підданих §Y[ENG.GetNameDef]§!."
 JAP_launch_the_income_doubling_plan:0 "Запустити план подвоєння доходів"
 JAP_merge_our_chinese_puppets_decision:0 "Об'єднати наші китайські маріонеткові адміністрації в одну"
 JAP_militarized_the_tibet_impr_party_flag:0 "Мілітаризовано Партію покращення Тибету"
 JAP_mio_trait_army_aircraft_manufacturer:0 "Виробник армійської авіації"
 JAP_mio_trait_special_government_contracts_taken_flag:0 " Цю рису вже відкрито в іншій організації Mitsubishi"
 JAP_national_defense_state:0 "Стан національної оборони"
 JAP_nationalize_western_corporations_desc:0 "Жадібні західні капіталісти прийшли в нашу країну, щоб експлуатувати наших людей і ресурси, залишаючи шрами в національній душі, які довго гоїтимуться. Ми повинні негайно ліквідувати корпорації та націоналізувати їхні фабрики, навіть якщо це означає роздратувати Захід."
 JAP_nissan_organization:0 "$nissan$"
 JAP_non_aggression_pact_with_china_desc:0 "Незважаючи на те, що наші відносини з Китаєм завжди були, м'яко кажучи, напруженими, нам потрібно укласти з ним пакт про ненапад, щоби перенаправити основні сили до північних кордонів."
 JAP_organize_the_fifth_column_decision_tt:0 "§YВорожі підрозділи§! отримують шкоду §Yорганізації§!"
 JAP_prepare_the_southern_front_tt:0 "Коли [ROOT.GetNameWithFlag] §Rоголошує війну§! країні, що контролює §Yрегіон Південно-Східної Азії§!:"
 JAP_raid_a_truck_depot_decision:0 "Рейд на автобазу"
 JAP_rethink_armor_doctrine:0 "Переосмислити танкову доктрину"
 JAP_return_of_the_manchukuo_exiles_2_tt:0 "§G5§! §Yвірних Імператорській армії генералів дворянського походження§! буде вислано до §YМаньчжурії§! в обмін на §Yсоціалістичних промисловців§!"
 JAP_rocket_suicide_equipment_1_short:0 "Ohka"
 JAP_sea_heavier_naval_guns_desc:0 "Здається, наші супротивники вклали значні кошти в броню для своїх морських суден. Ми повинні гарантувати, що зможемо не відставати від їхнього розвитку і пробивати їхні корпуси. З цією метою інвестиції у важчу морську артилерію здаються розсудливими."
 JAP_sea_mil_tech_coop_with_germany:0 "Військова співпраця з Німеччиною"
 JAP_sea_national_defense_state_desc:0 "[ROOT.GetLeader] проголосив Шінтайсей, перетворивши Японію на Державу національної оборони, де кожен чоловік, жінка і дитина мають бути мобілізовані для захисту нації. Згідно із Законом про національну мобілізацію, уряд також отримав абсолютну владу над активами країни. Завдяки цьому Імперія зможе існувати вічно!"
 JAP_ship_management_committee_tt:0 "§Y$convoy_1$§!:\n  £production_cost Вартість виробництва: §G-15.00%§!."
 JAP_showa_restoration_democratic_DEF:0 "Японська держава"
 JAP_spread_revolutionary_flames_to_south_asia_desc:0 "Полум'я революції поширюється далеко і широко, а наші успішні кампанії надихають пролетаріат усюди. Ми повинні почати фінансувати революційні групи в Південній Азії, щоб дестабілізувати регіон і залучити їх до П'ятого Інтернаціоналу."
 JAP_support_resistance_decision_desc:0 "Підтримати бійців опору для повалення [FROM.Owner.GetAdjective]ого правління."
 JAP_the_old_alliance:0 "Старий альянс"
 JAP_the_propaganda_department_decisions:0 "Відділ пропаганди"
 JAP_the_shuilikeng_power_plant_desc:0 "Наш розвиток Тайваню йде за планом, хоча проблема виробництва електроенергії стає дедалі нагальнішою. Це було частково вирішено будівництвом гідроелектростанцій, таких як електростанція Менпайтан. Ми повинні перейняти досвід наших минулих інженерів і продовжити будівництво цих гребель та станцій по всьому острову."
 JAP_tokyo_automobile_industries_organization:0 "$tokyo_automobile_industries$"
 JAP_tora_tora_tora_idea_desc:0 "За першим ударом японців слідує агресивна і стрімка військова кампанія, що спирається на авіаносці."
 JAP_train_equipment_3:0 "Тип «94»"
 JAP_uplift_ainu_revolution_theory_desc:0 "Багато наших політичних мислителів стверджують, що люмпен-пролетаріат є основною силою нашої революції, і що народ айнів також входить до цієї групи. Більше того, вони вважають, що айни жили в первісному комуністичному ладі, і вважають їх гідними бути «лідерами комуністичної революції». Ми повинні ширше підтримати цей рух."
 JAP_youth_league_for_buddhism_party:0 "Шінко буккьо сейнен домей"
 JOR_emirate:0 "Емірат Зайордання"
 JUNO_already_invited_german_advisors_completed:0 "Німецьких радників уже запрошено"
 JUNO_brazil_events.121.desc:0 "[FROM.GetNameDefCap] погодилася брати участь у нашій запропонованій програмі обміну технологіями. Члени нашої власної наукової спільноти в захваті від цієї новини та вже планують екскурсії до університетів та фабрик у [FROM.GetNameDef]."
 JUNO_brazil_events.139.a:0 "Ми повинні звільнити їх, незалежно від ціни."
 JUNO_brazil_events.140.a:0 "Вітати жест та зміцнити зв'язки."
 JUNO_brazil_events.151.desc:0 "Наші останні операції на Північному Сході Бразилії виявилися успішними у зриві операцій Кангасу. Їхня зона діяльності значно зменшилася наразі, але постійні інвестиції в правоохоронні органи будуть необхідні, якщо ми хочемо запобігти відродженню в майбутньому."
 JUNO_brazil_events.163.b:0 "Запровадити законодавство Республіканської партії."
 JUNO_brazil_events.170.desc:0 "[FROM.GetNameDefCap] запропонувала об'єднання нашої нації у їхню федерацію. Хоча ми тісно співпрацювали з [FROM.GetNameDef] останнім часом, багато хто зі старшого покоління неохоче відкладає свої історичні образи в обмін на економічну та політичну стабільність. Яким би не було наше рішення, воно, ймовірно, матиме наслідки на роки вперед."
 JUNO_brazil_events.171.desc:0 "[FROM.GetNameDefCap] погодилася на нашу пропозицію об'єднання після тривалих обговорень щодо їхнього становища в нашій політичній системі та захисту ключових інтересів їхнього народу."
 JUNO_brazil_events.18.a:0 "Ми виконаємо наші зобов'язання."
 JUNO_brazil_events.18.t:0 "[FROM.GetNameDefCap] вимагає військових зобов'язань"
 JUNO_brazil_events.19.a:0 "Можливо, настав час поставити більш згідливе керівництво в [FROM.Capital.GetCapitalVictoryPointName]."
 JUNO_brazil_events.42.desc:0 "Уряд [FROM.GetNameDefCap] нерозумно відхилив нашу пропозицію про державність у [ROOT.GetNameDef]. Схоже, нам доведеться або виконати нашу загрозу війни, або відступити і дозволити їм продовжувати керувати собою, принаймні, поки що."
 JUNO_brazil_events.43.a:0 "Ми повинні все одно стежити за ними."
 JUNO_brazil_events.47.t:0 "[FROM.GetNameDefCap] відхиляє пропозицію"
 JUNO_brazil_events.62.t:0 "[POR.GetNameDefCap] пропонує співдружність"
 JUNO_brazil_events.65.t:0 "[BRA.GetNameDefCap] відхиляє пропозицію про Співдружність"
 JUNO_brazil_events.75.desc:0 "Уряд [FROM.GetNonIdeologyName] рішуче відхилив наш ультиматум, посилаючись на давню історію та гордість нації. Патріотичний запал охопив їхні міста, і військові почали мобілізацію, готуючись до потенційного конфлікту через Атлантику."
 JUNO_brazil_events.84.a:0 "Справді прикро."
