 SIA_census_the_hill_tribes_desc:0 "Високогір'я залишаються поза зоною повного досяжності адміністрації, оподаткування та постачання. Належний перепис дасть уряду знання, необхідні для більш ефективного управління цими регіонами і залучення їхніх людей та ресурсів у ширше життя нації."
