 warsaw_pact:0 "Варшавський пакт"
 weapons_for_the_resistance:0 "Зброя для [From.GetAdjective]ого спротиву"
 widespread_bulgarian_sentiment_01:0 "Поширені проболгарські настрої"
 wtt_britain_lease_azores.1.a:0 "Краще, ніж втягувати нас у війну..."
 wtt_burma_road.1.desc:0 "[occupying_country.GetAdjective]і війська, що атакують область [state_occupied.GetName], дійшли до дороги з Бірми та перекрили її у кількох місцях. Тепер постачання нею недоступне."
 wtt_china_shared.10.desc_b:0 "Війна в Китаї важко позначилася на стані китайських ВПС, але їхні льотчики доблесно боролися в небі з противником, що перевершує за кількістю і якістю техніки. \n\nНезважаючи на доблесть пілотів, [From.GetAdjective]і ВПС відчайдушно потребують нових літаків та пілотів для поповнення втрат. [From.GetLeader] посилає делегацію до Вашингтона для переговорів про надання Китаю близько 150 сучасних винищувачів та такої ж кількості пілотів для їх обслуговування."
 wtt_germany.20.a:0 "Краще їм триматися подалі від нашої сфери впливу!"
 wtt_germany.35.d:0 "Незважаючи на всі загрози, що повернення кайзера розцінюватиметься нами як оголошення війни, Німеччина відмовилася поступитися і повернула Вільгельма II з вигнання. Це означає, що, як би нам не хотілося зберегти мир, у Європі знову вибухнула війна."
 wtt_germany.51.b:0 "Ні, нехай залишаються там, де вони зараз."
 wtt_germany.63.a:0 "Негідники! Це ще не кінець!"
 wtt_germany.65.b:0 "Ким вони себе уявили? Ніколи!"
 wtt_germany.73.t:0 "[From.GetName] приймає пропозицію щодо економічної інтеграції"
 wtt_germany.9.a:0 "Необхідно здійснити наші плани."
 wtt_japan.1.desc:0 "Скориставшись нашою слабкістю, [From.GetAdjective]і лідери запропонували допомогти нам «підтримати лад» у наших колоніях. Вони стверджують, що, втративши основну територію, ми втратили можливість постояти за себе.\n\nЦе явно хитрощі: вони сподіваються позбавити нас контролю над колоніями. Але який у нас залишається вибір?"
 wtt_japan.101.a:0 "Мабуть, із японцями справді можна розправитися."
 wtt_japan.106.a:0 "І вони себе звуть «захисниками свободи»?"
 wtt_japan.106.desc:0 "Держава [From.GetNameDefCap] відповіла на наші вимоги надати незалежність Філіппінам, заявивши, що ця країна є необхідною для захисту «життєво важливих інтересів Америки» у цьому регіоні."
 wtt_japan.118.b:0 "Це не є хороша угода для нас."
 wtt_japan.118.t:0 "[From.GetName] вимагає допомогу"
 wtt_japan.121.desc:0 "Війська держави [From.GetNameDefCap] зайняли японську столицю, та фашистський [From.From.GetAdjective]ий уряд впав. Якщо ми маємо намір діяти, треба діяти негайно. Необхідно забезпечити контроль над віддаленими японськими островами і, якщо ми збираємося протистояти комуністичній загрозі, прийняти командування над фашистськими елементами, що залишилися."
 wtt_ledo_road.3.a:0 "$wtt_burma_road.3.a$"
 wtt_manchukou.2.a:0 "[From.GetLeader.GetSheHeCap] знає своє місце."
 wtt_news.11.b:0 "Ми мусимо вбезпечити свої кордони!"
 wtt_news.20.desc:0 "В умовах зростаючої агресії з боку Радянського Союзу [GER.GetName] надає «країнам, яким безпосередньо загрожує комунізм» можливість укласти пакт проти держави [SOU.GetName]. У разі якщо [SOU.GetName] нападе на одну з країн, що підписали пакт, решта мають вступити у війну."
 wtt_news.30.a:0 "Він отримав за заслугами."
 wtt_news.30.t:0 "Чан Кайші страчений"
 wtt_news.34.a:0 "Вдалого полювання!"
 wtt_news.38.d:0 "Він успадкував дуже важку посаду."
 wtt_news.54.desc:0 "Після завоювання всіх країн Нордичного регіону [From.GetOldAdjective]ий уряд вирішив розпочати інтеграцію всіх нових територій. Щоб заручитися широкою підтримкою населення, було проведено націоналістичну кампанію пропаганди з недвозначним закликом підтримати уряд.\n\nЯк висловився представник [From.GetOldAdjective]ої влади, «країни Нордики здавна тяглися одна до одної, і цілком природно для них прагнути об'єднання, щоби наші народи жили разом в одній державі». Уряд використав цю спорідненість як аргумент для об'єднання, заявивши про створення «істинно нордичного союзу» та змінивши назву країни на «[From.GetNameDef]»."
 wtt_news.58.a:0 "Знову єдині, як і передбачалося в 1815 році..."
 wtt_news.6.a:0 "І ми ні кулі не витратили."
 wtt_news.63.desc:0 "У міру розростання [From.GetOldAdjective]ої держави, що поглинає своїх сусідів, стають дедалі очевиднішими спроби його уряду створити видимість якоїсь історичної наступності. Досягнення Великої імперії Зімбабве виставляються в самому романтичному світлі, але постійна пропаганда, схоже, справді діє на уми публіки.\n\nСьогодні [From.GetOldAdjective]ий уряд зробив наступний крок і змінив назву країни на «[From.GetNameDef]», що було зустрінуто тріумфуючими криками натовпу у великих містах."
 wtt_political_organisation.1.desc:0 "Місцеві партійні функціонери в області [state.GetName] повідомляють, що більшість громадян в області досі підтримують нас. Активна робота навіть призвела до зростання підтримки в цій області."
 wtt_political_organisation.3.desc:0 "Ми отримали гарну новину з області [state.GetName], де деякий час тому виникла «Організація з вивчення ідей лідера [Root.GetLeader]». Ця група зараз користується широкою підтримкою серед населення. При цьому [old_majority_country.GetLeader] більше ніде не згадується."
 wtt_political_organisation.3.t:0 "[state.GetName] підтримує нас"
 wtt_political_warlord_support.10.a:0 "Попросити публічно висловити підтримку."
 wtt_political_warlord_support.11.a:0 "Якщо це так необхідно..."
 wtt_political_warlord_support.22.desc:0 "Прибула перша партія гвинтівок та іншого піхотного озброєння з держави [From.GetNameDef]. Незважаючи на те, що зброя не найсучасніша, вона в робочому стані, і її можна передати військам найближчим часом.\n\nРазом із партією доставлено офіційне послання від лідера [From.GetLeader] з нагадуванням, щоби ми виконали свої обіцянки щодо цієї угоди."
 wtt_prc.1.t:0 "[From.GetLeader] натякає на створення альянсу"
 wtt_warlord_vs_prc.1.t:0 "[warlord.GetLeader] благає про підтримку"
 wtt_xian_incident.7.c:0 "Нам слід укласти з ним союз проти японців."
 wuw_GER_civil_war.4.b:0 "Можемо просто демобілізувати їх"
 wuw_GER_civil_war.8.b:0 "Держава пошкодує, що не стримала обіцянки"
 wuw_GER_diplomacy.24.a:0 "Чудові новини!"
 wuw_GER_diplomacy.30.t:0 "[FROM.GetAdjective] приймають торгову пропозицію"
 wuw_GER_diplomacy.33.desc:0 "Наша угода від 1898 року була чіткою — [743.GetName] мали залишатися в нашій оренді до 1997 року. Проте [FROM.GetAdjective] передумали. Вони вважають, що війна та наступна окупація з боку [JAP.GetAdjective] знецінюють нашу домовленість. Угода не містила таких умов, але, здається, у нас мало вибору. Якщо ми хочемо повернути [743.GetName], доведеться вдатися до радикальніших заходів."
 wuw_GER_diplomacy.35.b:0 "Краще не ризикувати"
 wuw_GER_diplomacy.56.a:0 "Нахабство!"
 wuw_GER_diplomacy.64.t:0 "[FROM.GetNameDefCap] пропонує захист в обмін на данину"
 wuw_GER_diplomacy.67.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] таємно запропонував нам розділити сусідні території, укласти альянс і встановити сфери впливу в Нижніх Землях. Прийняти цю тіньову угоду чи ні?"
 wuw_GER_diplomacy.67.t:0 "[FROM.GetNameDefCap] пропонує таємний пакт"
 wuw_GER_diplomacy.69.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що ідея поділити сусідні землі та зрадити союзників йому не до вподоби. Якщо ми шукаємо агресивних союзників — доведеться шукати в іншому місці."
 wuw_GER_diplomacy.83.desc:0 "Після нашої перемоги в громадянській війні та переходу до комунізму, [GER.GetNameDef] простягнув нам руку дружби. Наскільки важливою була їхня допомога — питання складне, але тепер, маючи спільну ідеологію, вони пропонують нам вступ до альянсу."
 wuw_GER_diplomacy.94.t:0 "[FROM.GetNameDefCap] відмовляється замінити Ернста Тельмана"
 wuw_GER_legions.2.a:0 "Нам знадобиться його військова розвідка"
 wuw_GER_legions.2.t:0 "Ганс Кребс відкликаний з [SOV.GetNameDef]"
 wuw_GER_monroe.4.a_tt:0 "Ми відкрито §Rвиступимо проти§! Доктрини Монро. Якщо Доктрина вціліє, ми залишимось §Rбез гарантій§!. §Y[USA.GetFlag][USA.GetNameDefCap]§! більше не зможе схилити нас на свій бік."
 wuw_GER_realpolitik.23.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прибув до нашої столиці з пропозицією. Вони хочуть, щоб ми приєдналися до їхнього альянсу, взяли участь у всіх вже існуючих союзах і партнерствах. Вони також обіцяють допомогти нам у відвоюванні старих оттоманських земель. Чи приймемо ми цю пропозицію?"
 wuw_GER_realpolitik.41.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відкинув наше запрошення до альянсу з обуренням, заявивши, що жодна співпраця між нашими країнами не є можливою ні зараз, ні в майбутньому. Схоже, вони не хочуть нашої допомоги у поверненні угорських земель..."
 wuw_GER_realpolitik.54.b:0 "Тоді нехай спробують!"
 wuw_GER_reichskommissariats.17.t:0 "Статус Словаччини"
 wuw_GER_reichskommissariats.22.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Північній Америці, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_uncertain_future.02.a:0 "Невдоволення серед людей, так?"
 wuw_GER_weltpolitik.14.t:0 "[FROM.GetNameDefCap] не повертає наші колонії"
 wuw_GER_weltpolitik.17.desc:0 "Ми отримали повідомлення від [FROM.GetAdjective], що вони схвалюють ідею створення сфер впливу. Це дозволить уникнути ворожнечі та зменшить ризик конфліктів за території у нашому регіоні."
 wuw_HUN_a_bulwark_against_communism:0 "Бастіон проти комунізму"
 wuw_HUN_a_grand_habsburg_alliance_desc:0 "Немає кращих союзників, ніж рідна кров, і історія навчила нас, що весь світ проти великої родини Габсбургів. Тож ми повинні триматися разом і створити союз, до якого увійдуть лише держави під владою Габсбургів."
 wuw_HUN_act_of_defense_desc:0 "Світ прямує до конфлікту, й ми маємо підготуватися до бурі. Час ухвалити нові закони, які дозволять нам захистити країну — до останнього солдата, якщо буде потрібно."
 wuw_HUN_bringing_down_the_giants_desc:0 "Великі держави загрожують нашій свободі. Ми не чекатимемо — завдамо удару першими, щоб позбутись загрози."
 wuw_HUN_construct_the_szeretfalva_deda_railway_line:0 "Залізниця Серецфалва–Деда"
 wuw_HUN_devalue_the_pengo_desc:0 "Пенге перебуває у критичному стані — це один із найгірших прикладів гіперінфляції в історії. Ми маємо вжити рішучих заходів для ревальвації та зміцнення валюти, попри те, що ці заходи будуть вкрай непопулярні."
 wuw_HUN_hold_war_games_desc:0 "Проведення військових навчань дозволить виявити слабкі місця в нашій армії та виправити їх на основі отриманого досвіду."
 wuw_HUN_news_events.6.t:0 "Йосиф Август приймає угорську корону"
 wuw_HUN_pressure_romania:0 "Тиск на [ROM.GetNameDef]"
 wuw_HUN_reclaim_the_holy_city:0 "Відвоювати Святе місто"
 wuw_HUN_reintigrate_the_imperial_railroads:0 "Реінтеграція імперських залізниць"
 wuw_HUN_reverse_the_risorgimento_tt:0 "§Y[ROOT.GetNameDefCap]§! випустить §Yдодержави Рісорджименто§! на §YІталійському півострові§! як §Yсуб'єктів§! і посилить їх"
 wuw_HUN_seek_german_contracts_desc:0 "Наша промисловість зростає, але щоб повністю забезпечити армію, вигідно буде запросити [GER.GetAdjective] фірми для будівництва нових об'єктів."
 wuw_HUN_spur_on_the_trianon_trauma_desc:0 "Усі знають, що [ROOT.GetNameDef] колись була великою. Тріанонський договір позбавив нас законних земель. Всі сусіди відчують жах, коли [ROOT.GetAdjective] армії повернуться по своє!"
 wuw_HUN_tap_newfound_oil_deposits_desc:0 "У країні було відкрито багато дрібних нафтових свердловин, наприклад компанією MAORT. Найбільш помітна з них — родовище в Будафапушташі, яке слід якнайшвидше розробити."
 wuw_HUN_the_cult_of_arpad_desc:0 "Арпад — великий вождь мадярських племен. Його спадщина надихає наш народ. Ми піднесемо його як легендарного героя й поведемо націю його шляхом."
 wuw_HUN_the_legacy_of_the_isonzo_front:0 "Спадщина фронту Ізонцо"
 wuw_HUN_the_szekel_command:0 "Секейське командування"
 wuw_HUN_undoing_the_yugoslav_mistake:0 "Скасування югославської помилки"
 ww_BEL_event_diplomatic.2.a:0 "Ми сильніші разом."
 ww_BEL_event_diplomatic.30.b:0 "Нам не потрібно їх приймати"
 ww_BEL_event_diplomatic.35.a:0 "Звісно!"
 ww_BEL_event_diplomatic.5.desc:0 "Ми вирішили вимагати Кале від Франції, однак нам ще потрібно вибрати, як саме це отримати. Звісно, наші могутні армії можуть захопити цю територію без проблем, однак ми повинні врахувати можливість побічних збитків, тому, можливо, варто шукати інший спосіб її здобуття. Спосіб об'єднання не важливий для нас, головне, щоб ми отримали те, що нам належить!"
 ww_BEL_event_political.3.t:0 "Королівське призначення"
 ww_BEL_event_war.1.desc:0 "Наше передбачення на користь налагодження хороших контактів з іноземними промисловими компаніями дало плоди. Їхні підприємства готові до негайного виробництва."
 ww_BEL_event_war.3.t:0 "Капітуляція короля"
 ww_BEL_event_war.9.b:0 "Продовжимо боротьбу! Ми можемо витримати більше."
 ww_congo.18.t:0 "Конголезьке повстання придушене"
 ww_congo.24.a:0 "Що ми взагалі могли очікувати?"
 ww_congo.29.a:0 "Безумовно"
 ww_congo.4.a:0 "Йди, імперіаліст!"
 ww_congo.40.t:0 "Перший кабінет Каса-Вубу"
 ww_congo.45.desc:0 "Рада вирішила, що наступним найбільш легітимним правителем Конго стане Мбоп Мабінк маМбеки, король Королівства Куба, маленької держави в наших центральних провінціях. Напевно, він може забезпечити стабільність і досягти того, чого не зміг би багато хто?"
 ww_congo.45.t:0 "Нім Ба Куба"
 ww_congo.46.desc:0 "Рада вирішила, що наступним найбільш легітимним правителем Конго стане Мо Поаті III, Ма Лоанго з Королівства Лоанго, держави, що існувала на наших західних провінціях, головно в тому, що зараз є Середнім Конго. Напевно, він може забезпечити стабільність і досягти об'єднання з західними провінціями Конго?"
 ww_congo.5.a:0 "Це знизить прибутки!"
 yellow_river_blown_desc:0 "Цей регіон сильно затоплений через саботаж гребель на річці Хуанхе."
