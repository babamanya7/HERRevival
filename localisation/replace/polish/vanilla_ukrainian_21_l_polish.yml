 SWI_liberate_italy_desc:0 "Протягом століть [ROOT.GetNonIdeologyName] бачила, як дрібні міста-держави та невеликі королівства на його півдні воювали одне з одним і зрештою були поглинені слабкою монархією. Цілком правильно, що [ITA.GetNonIdeologyName] звільнила від пут автократії та фашизму її старший брат."
