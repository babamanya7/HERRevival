 FRA_cv_fighter_equipment_2_short:0 "D.790"
 FRA_czech_guarantee_desc:0 "Напруга на чеському кордоні зростає. Не можна припустити, щоб агресивна держава напала на незалежну демократичну країну. Чехи мають залишатися вільними. Ми підтримаємо їх своїми гарантіями, це змусить передумати будь-кого, хто намагається їх захопити."
 FRA_france_leads:0 "Франція-лідер"
 FRA_guarantee_the_constitution_desc:0 "Перш ніж республіканська преса зможе навіть розпочати свої необгрунтовані кампанії проти легітимності королівського правління, ми мусимо підірвати їх репутацію, надавши залізні гарантії поваги індивідуальних прав людей."
