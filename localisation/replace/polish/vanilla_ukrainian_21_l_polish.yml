 FRA_invest_in_west_africa_desc:0 "Величезні запаси працівників і ресурсів у Західній Африці роблять її ідеальним кандидатом для інвестицій."
 FRA_invite_anti_fascist_emigrants_desc:0 "Перший крок, який робить кожен фашистський режим, — це вигнання своїх критиків і людей, які могли б представити альтернативне бачення того, як можна організувати країну. Однак ці люди також ідеально підходять для формування уряду у вигнанні, щоб підготуватися до дня звільнення їхньої країни."
