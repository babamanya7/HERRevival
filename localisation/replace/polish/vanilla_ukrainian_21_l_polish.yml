 siam.34.desc:0 "Сили [FROM.GetAdjective] тепер тиснуть на [ROOT.GetNameDef], і їхні дипломати говорять із впевненістю людей, які вірять, що питання вже вирішене. Вони пропонують нам звичну мову порядку та стабільності, проте насправді вони шукають покірності. Ми можемо підкоритися і зберегти державу в зменшеному вигляді, приєднатися до їхнього альянсу в надії зберегти деяку свободу дій, або відповісти на цей тиск відкритим викликом і наказати загарбнику забратися від наших берегів."
 siam.39.t:0 "Уряд [FROM.GetAdjective] приймає нашу капітуляцію"
 siam.9.desc:0 "Повстання розбите, і після захоплення Сонгсурадета залишився лише суд, хоча на даному етапі це лише формальність. Змову виявили не тільки в армії та на флоті, а й серед роялістів, причому принц Рангсіт відкрито підтримував бунтівників. Глибока чистка дисидентів стала необхідністю, а не альтернативою."
 small_decrease:0 "Погіршення думки"
 south_american_events.15.a:0 "Немає сенсу намагатися спинити їх..."
 south_american_events.20.b:0 "Нащо задовольнятися меншим, коли ми можемо взяти більше їхньої землі?"
