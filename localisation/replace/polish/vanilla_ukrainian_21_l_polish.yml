 FIN_crush_the_karelian_insurrection_desc:0 "Тепер, коли ми зібрали достатньо зброї та солдатів, щоб розгромити регіональне карельське повстання. Розпочнімо операцію!"
 FIN_expand_ship_building_industry_desc:0 "Оскільки зростає потреба у військових кораблях, зростає також потреба у верфях, здатних їх виробляти. Завдяки розширенню суднобудівної промисловості [ROOT.GetName] буде краще оснащений, щоб забезпечити свої збройні сили необхідними суднами проєктувати силу та захищати свої береги."
 FIN_fascism_party:0 "ПНР"
 FIN_finnish_democratic_republic:0 "Фінська демократична республіка"
 FIN_finnish_neutrality:0 "Фінський нейтралітет"
 FIN_funds_from_kalevala_koru_oy:0 "Кошти від Kalevala Koru Oy"
 FIN_german_military_advisors:0 "Німецькі військові радники"
 FIN_integrate_karelia_additional_states_desc:0 "Карельська республіка все ще не охоплює всі землі, населені карелами, і шляхом інтеграції області [FROM.GetName] до неї ми можемо спробувати вирішити ситуацію."
 FIN_integrate_veps_additional_states_desc:0 "Існує більше регіонів, які можна інтегрувати до нашої новоствореної Вепсської республіки, і [FROM.GetName] є одним із них."
 FIN_join_the_comintern_leader_tt:0 "\n§Y$FIN_otto_wille_kuusinen$§! стане лідером країни щойно комуністична §Y[ROOT.GetFlag][ROOT.GetNonIdeologyName]§! приєднається до фракції, очолюваної державою §Y[SOV.GetFlag][SOV.GetName]§! на чолі зі Сталіним."
 FIN_keepers_of_the_north:0 "Охоронці півночі"
 FIN_long_range_patrols_battalion_tt:0 "Відкриває батальйон підтримки §Y$long_range_patrol_support$§!."
 FIN_mannerheim_line_desc:0 "Намагаючись зміцнити нашу оборону, ми повинні звернути увагу на лінію Маннергейма. Складна мережа оборонних укріплень, лінія простягається через східний кордон країни та має бути захищена від вторгнень ворога. З цією метою армія працює над покращенням як самих укріплень, так і ліній постачання, які забезпечують їх запас і працездатність."
 FIN_mineral_wealth_development_desc:0 "Враховуючи наше географічне положення та сусідів, існує ймовірність того, що ми будемо відрізані від можливих союзників чи економічних партнерів. Тому ми повинні використовувати невикористані ресурси нашої нації, щоб забезпечити продовження боротьби, навіть будучи ізольованими."
 FIN_mining_the_sea:0 "Видобуток моря"
 FIN_mio_trait_repurposed_equipment:0 "Оновлене оснащення"
 FIN_motion_of_no_confidence_cost_bad_range_tt:0 "Вартість рішення §Y$FIN_motion_of_no_confidence_against_leader$§!: £pol_power $RIGHT|0Y$."
 FIN_naval_airforce_ns_tt:0 "$FIN_naval_airforce_dynamic_modifier_tt$\n"
 FIN_political_unity_desc:0 "Незалежно від політичної ідеології, ми всі хочемо найкращого для нашого народу. У цей час кризи ми повинні відкласти дрібні політичні чвари та працювати разом."
 FIN_pragmatic_socialism:0 "Прагматичний соціалізм"
 FIN_pressure_government_cd_tt:0 "\nМи можемо тиснути на уряд країни лише раз на §Y[?FIN_pressure_government_cd]§! дн."
 FIN_salvaged_and_retooled_desc:0 "Якщо наші збройні сили хочуть перемогти у війні, ми повинні зосередитися на максимізації ресурсів у воєнний час. Використання захопленої ворожої техніки, порятунок пошкодженої техніки та її перепрофілювання, коли це необхідно, щоб відповідати Фінській тактичній доктрині, дозволить нам забезпечити постачання нашої армії потреби та значно зміцнити наш військовий потенціал."
 FIN_sissi:0 "Sissi"
 FIN_strengthen_the_naval_bases:0 "Зміцнити військово-морські бази"
 FIN_sub_ship_engine_1:0 "Двигун «Atlas» 1 160 к. с. н. в."
 FIN_suomen_ilmavoimat_desc:0 "Ми повинні зосередитися на підвищенні ефективності [ROOT.GetAdjective]их повітряних сил шляхом інвестицій у дослідження та навчання.\nМета полягає у створенні сучасного та гнучкого підрозділу авіації, здатного відповідати викликам сучасної війни, а також надання важливої підтримки сухопутним військам під час бойових дій."
