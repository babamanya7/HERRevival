 tfv_south_africa.2.a:0 "Ми будемо доброзичливими господарями."
 tfv_south_africa.42.t:0 "[SOV.GetNameDefCap] відмовляється"
 tfv_south_africa.67.d:0 "Звільнившися з-під влади колоніальних гнобителів, [ZAM.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [ZAM.GetAdjective]ого уряду."
 tfv_south_africa.70.t:0 "Свобода для держави [UGA.GetName]"
 tfv_south_africa.72.d:0 "Звільнившися з-під влади колоніальних гнобителів, [EGY.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [EGY.GetAdjective]ого уряду."
 tfv_south_africa.88.d:0 "Звільнившися з-під влади колоніальних гнобителів, [TOG.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [TOG.GetAdjective]ого уряду."
