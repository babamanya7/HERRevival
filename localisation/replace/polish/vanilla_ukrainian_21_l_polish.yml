 BUL_LOYALTY_TOOLTIP:0 "§YЛояльність§! відображає бажання фракції співпрацювати з урядом.\nЧим вища §Yлояльність§!, тим менша ймовірність того, що фракція буде протистояти уряду.\nПерш ніж інтегрувати фракцію в уряд, необхідно виконати певні рішення для зближення її членів з урядом і збільшення її §Yлояльності§! до 100."
 BUL_approach_germany_desc:0 "У той час як британці та французи безперервно душили нашу економіку з моменту приниження Нейійського договору, німці не тільки демонстрували натяки на визнання наших територіальних претензій, але й допомогли нам розрахувати наші борги та купити значну частину нашого врожаю., стимулюючи нашу економіку та дозволяючи нам проводити важливі промислові й аграрні реформи."
 BUL_axis_research_name:0 "Німецько-болгарський обмін військовими технологіями"
 BUL_bs_popularity_status:0 "[GetBsPopularityStatus]"
