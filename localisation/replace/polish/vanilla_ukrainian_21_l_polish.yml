 heavy_battery_advice_tt:0 "\n\nУстановка модуля §YВажка батарея§! збільшує §Yатаку важких гармат§! §Yважких кораблів§!, що дозволить їм вступати в бій із і знищувати ворожі §Yосновні кораблі§!. §YВажкі батареї§!, як правило, погано працюють проти менших суден, таких як §Yлегкі кораблі§! та §Yлегкі крейсери§!."
