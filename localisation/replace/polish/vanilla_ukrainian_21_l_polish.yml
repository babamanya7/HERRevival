 liberate_dahomey_desc:0 "Це займе приблизно 6 місяців."
 liberate_egypt:0 "Звільнити державу [EGY.GetName]"
 light_mg_4x_desc:0 "Те, чого цьому набору з чотирьох кулеметів гвинтівкового калібру не вистачає руйнівності, він компенсує величезним об'ємом."
 long_range_submarines_ocean_patrols:0 "Марафонські патрулі"
 marines_commandoes_mechanised_desc:0 "Здатність закріпитися після успішної висадки може бути посилена лише шляхом належного оснащення нашого авангарду. Це вимагає змін у нашій виробничій стратегії та доктрині."
