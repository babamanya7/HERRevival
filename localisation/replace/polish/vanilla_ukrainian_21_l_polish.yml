 SWE_end_the_fubkrieg_desc:0 "За останні роки війна швидко змінилася, і ми не можемо дозволити собі, щоб усі наші зусилля були марними, оскільки військові готувалися до вчорашнього конфлікту. Забезпечення використання ними найсучаснішої тактики буде вирішальним для захисту нації."
