 news.11.a:0 "Цікаво."
 news.12.b:0 "Вони не мали б відхиляти наші вимоги."
 news.137.d:0 "Бої в Лондоні добігли кінця після придушення опору німецьких військ, що залишилися. Щойно було дано сигнал «все чисто», тріумфуючі городяни вийшли на вулиці, вітаючи визволителів-американців, і по всьому місту задзвеніли церковні дзвони.\n\nВизвольний настрій охопив усю Велику Британію, коли стало очевидно, що німецька окупація добігає кінця. У кількох регіонах, контрольованих німцями, почалися локальні повстання, які були жорстоко придушені. Невже Велика Британія скоро знову буде вільна?"
 news.156.d:0 "Поява на небі «Комети» стурбувала наших співгромадян. Ме.163 «Комета» — експериментальний ракетний винищувач, який здійснював випробувальний політ, — налякав сільських жителів, яким довелося побачити цей унікальний швидкісний літальний апарат. Його розробка була засекреченою, але незабаром буде представлена громадськості. Інцидент, що мав місце, лише зробить цю появу більш вражаючою."
 news.158.t:0 "[FROM.FROM.GetName] втручається в [FROM.GetAdjective]у війну"
 news.169.b:0 "Ми вибрали правильну сторону!"
 news.17.e:0 "Це ще не кінець."
 news.173.b:0 "Жорстокі часи для нашого Союзу."
 news.176.b:0 "Наші давні вороги роз'єднані."
 news.178.d:0 "Після майже двох десятиліть політичної кризи [From.GetName] все ще намагається повернути те, що було втрачено у Велику війну. [From.GetAdjective]і лідери мають намір відновити [From.GetAdjective]у державу з її громадянами для громадян.\n\nНові політичні реформи привели до розквіту профспілок і комуністичних організацій. Якщо Франція продовжить рухатися в цьому напрямі, її чекає серйозний крен ліворуч або навіть повномасштабна революція."
 news.196.e:0 "Зіткнення ідеологій — це остання битва цивілізацій."
 news.21.a:0 "Дрібниці."
 news.211.e:0 "Тривожний розвиток подій у Тихоокеанському регіоні"
 news.211.g:0 "Ми повинні стежити за цим"
 news.224.t:0 "[ENG.GetNameDefCap] тисне на державу [SPR.GetNameDef]"
 news.263.a:0 "Революція на порозі?"
 news.271.b:0 "Світ тремтить... від сміху."
 news.285.desc:0 "Відповідно до теорії двох націй, мусульманська меншина отримала суверенну батьківщину в районах, де мусульмани становлять більшість населення. Спочатку названа Пакстан, щоб показати поєднання пенджабців, афганців, кашмірців, сінгхів і белуджів, вона була перейменована на Пакистан, щоб полегшити вимову.\n\nНапруженість у відносинах між нещодавно звільненими Індією і Пакистаном зберігається, оскільки на частину прикордонних територій претендують обидві нові країни. Деякі спостерігачі навіть попереджають про відновлення війни на субконтиненті."
 news.287.b:0 "Решту візьмемо з часом..."
 news.295.c:0 "Чи будуть вони друзями або ворогами?"
 news.302.a:0 "Якщо сила — це все, до чого вони прислухаються..."
 news.306.desc:0 "У світлі своїх попередніх успіхів у поверненні втрачених територій, [HUN.GetAdjective]ий уряд тепер вимагає від Югославії повернути Воєводину. Поки югослави намагаються знайти дипломатичне рішення, [HUN.GetAdjective]е роздратування стає дедалі очевиднішим, і якщо югослави відкинуть вимоги, то навряд чи вдасться знайти мирне рішення."
 news.309.a:0 "Будемо сподіватися, сила не знадобиться."
 news.313.t:0 "Сформовано Римський пакт"
 news.328.desc:0 "Уряд Югославії останнім часом все частіше виступає проти італійського ставлення до слов'янських меншин у прикордонних регіонах Істрія і Зара. Сьогодні він оголосив, що вважає ці регіони, захоплені Італією після Великої війни і населені переважно етнічними слов'янами, невід'ємною частиною югославської нації. Крім того, для захисту прав мешканців цих регіонів югослави заявили, що не ухилятимуться від застосування військової сили."
 news.332.b:0 "На щастя, кровопролиття вдалося запобігти."
 news.336.a:0 "Ми пам'ятаємо."
 news.39.b:0 "Принаймні на одну загрозу менше."
 news.69.b:0 "[SOV.GetNameDefCap] розширюється."
 news.69.d:0 "З самого приходу до влади партії [From.GetRulingParty], [From.GetNameDef] активно прагне зміцнити зв'язки з державою [SOV.GetNameDef] і тепер стає його частиною.\n\nКілька днів тому [From.GetAdjective]ий уряд офіційно передав контроль над країною, яка тепер входить до складу [SOV.GetNameDef] як область.\n\nРадянські офіційні особи відмовляються вважати це агресією і стверджують, що передача території [From.GetNameDef] було здійснено добровільно, без будь-якого тиску."
