 SOV_fortify_mongolian_border_forts_tt:0 "§Y[MON.GetFlag][MON.GetNameDefCap]§!:\n  Додати §Y1 наземне укріплення§! в столичній провінції.\n  Додати §Y2 наземні укріплення§! в кожній провінції на кордоні з китайськими землями під контролем держави [JAP.GetNameWithFlag] або її союзників."
 SOV_fourth_international_bad:0 "Послідовники сталіністської доктрини"
 SOV_gosproyektstroy_upgrade_in_progress_flag:0 "Наразі працює над поліпшенням «Госпроектстрою»"
 SOV_ground_support:0 "Наземна підтримка"
 SOV_heavy_cruiser_1_desc:0 "The Krasnyi Kavkaz cruiser, originally the Admiral Nakhimov class light cruiser, was the half-sister of the Chervona Ukraina. Krasnyi Kavkaz was completed with a modified design that included larger-caliber 180mm guns and stronger AA armament. Because she was a rebuilt light cruiser, her armor was thinner compared to the heavy cruisers of other navies."
 SOV_heavy_tank_destroyer_equipment_3:0 "ИСУ-122"
 SOV_heavy_tank_equipment_3_short:0 "ИС"
 SOV_hold_leningrad_desc:0 "[195.GetName] не впаде!"
 SOV_incorporate_local_organizations_desc:0 "Місцеві організації зачасту краще розуміють проблеми, з якими стикаються робітники, ніж люди в столиці. Ми повинні зменшити роль міністрів та інших високопоставлених членів партії і надати більше повноважень місцевим організаціям."
 SOV_increase_opposition_army_support_small_tt:0 "Підтримка опозиції в армії збільшиться на щонайбільше §G+5%§!."
 SOV_influence_army_opposition_tt:0 "Підтримка армії збільшується"
 SOV_infrastructure_effort_nsb:0 "$SOV_infrastructure_effort$"
 SOV_inspection_in_the_army_desc:0 "Ми мусимо дозволити НКВС провести перевірку в армії, щоби знайти можливих дисидентів і саботажників."
 SOV_into_central_asia:0 "У Центральну Азію"
 SOV_jet_tac_bomber_equipment_1_short:0 "Ил-28"
 SOV_liberate_ryutin_desc:0 "Товариш Рютін ніколи не соромився викривати численні вади та недоліки Сталіна. Мабуть, не дивно, що Сталін вирішив зробити з нього приклад. Тепер, однак, ми повинні посмикати за деякі ниточки, щоб вивезти його за кордон, поки Сталіна не усунули, щоб він міг допомогти нам керувати країною після того, як Сталіна не стане."
 SOV_light_tank_aa_equipment_1_short:0 "ЗСУ-12.7"
 SOV_light_tank_artillery_equipment_2:0 "СУ-26"
 SOV_light_tank_destroyer_equipment_2_short:0 "СУ-5"
 SOV_long_range_aircraft_desc:0 "Технології розвинулися настільки, що наші бомбардувальники можуть дістатися до будь-якої точки на батьківщині ворога і за короткий час знищити його здатність вести війну. Армія існує насамперед для того, щоб утримувати лінію фронту, доки це не буде зроблено."
 SOV_merge_materiel_plant_1_artillery_tt:0 "$SOV_merge_materiel_plant_intro_tt$§YАртилерійське оснащення§!: £GFX_production_cost Вартість виробництва: §G-5.00%§!\n"
 SOV_merge_materiel_plant_2_tt:0 "$SOV_merge_materiel_plant_intro_tt$$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5%§!\n"
 SOV_military_engineering_university_desc:0 "Хоча багато хто проголошує кінець окопної війни з появою танка і літака, очевидно, що військова інженерія все ще має місце на сучасному полі бою. Ми мусимо сформувати інститут, який би вивчав сучасні методи будівництва сучасних польових укріплень."
 SOV_military_offensive_name_dublin:0 "Дублінський наступ"
 SOV_military_offensive_name_london:0 "Лондонський наступ"
 SOV_military_support_tt:0 "Збільшує підтримку з боку збройних сил у випадку громадянської війни.\nБудуть відкриті рішення для її подальшого збільшення."
