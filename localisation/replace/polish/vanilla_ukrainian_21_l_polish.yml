 war_escalation_7_or_more_tt:0 "Ескалація становить щонайменше §Y7§!"
 war_escalation_icon_tt:0 "§YЕскалація війни§!\nЕфекти, викликані збільшенням ескалації війни, за рівнем:\n Рівень 3:\n §YЛіга Націй§!: Запит ембарго відімкнений\n §YЕфіопія§!: Міжнародна репутація росте\nРівень 4:\n §YЛіга Націй§!: Закупівля зброї відімкнена\n §YІталія§!: Італійська громадськість стурбована\nРівень 5:\n §YЛіга Націй§!: Перекриття Суецу відімкнене\n §YІталія§!: Африканська армія зневірена\nРівень 6:\n §YЛіга Націй§!: Міжнародні бригади відімкнені\n §YЕфіопія§!: Моральний дух армії посилений\n §YІталія§!: Неспокій у колоніях\nРівень 7:\n §YЛіга Націй§!: Міжнародне посередництво відімкнене\n §YІталія§!: Італійська громадськість ставить під сумнів військові зусилля\nРівень 8:\n §YЕфіопія§!: Дезертирство в лавах ворога\n §YІталія§!: Масове дезертирство\nРівень 9:\n §YЕфіопія§!: Виживання всупереч усьому\nРівень 10:\n §YЕфіопія§!: Народна війна\n §YІталія§!: Заворушення в колоніях"
 war_justification.207.t:0 "[ROOT.GetAdjective]ий комунізм зазнає краху"
 war_justification.213.d:0 "«Хоча ми можемо бути мирним народом, наша природа сама по собі не визначає, яким шляхом ми повинні йти в історії. Це час війни. Занадто довго [ROOT.GetAdjective]і політики володіли засобами, необхідними для того, щоби пройти крізь випробування, з якими ми можемо зіткнутися, і очевидно, що вони не розлучаться з ними мирно. Незважаючи на всі наші зусилля, спрямовані на побудову сучасної держави, деякі питання можуть бути вирішені лише старим випробуванням битвою».\n\nУ нещодавній промові до [From.GetAdjective]ого народу ворожа риторика по відношенню до [ROOT.GetName] посилилася, а [From.GetLeader] зробив багато, щоб виправдати вторгнення. Деяка частина населення підтримує цей курс, але рішення лежить на землях їхнього лідера."
 war_justification.216.t:0 "[ROOT.GetLeader] кидає виклик [From.GetAdjective]им гнобителям"
 war_justification.301.d:0 "«У нас був шанс завдати удару по наших ворогах, але [ROOT.GetRulingParty] пропустила його повз вуха. Це не тільки ще один прикрий випадок у низці втрачених можливостей зміцнити позиції [ROOT.GetName] на міжнародній арені, але й ознака того, що їхні заяви про те, що вони діють в інтересах народу [ROOT.GetAdjective], здебільшого є пустопорожньою риторикою. Настав час змінити політику».\n\nНаша нездатність вести війну, якої багато хто очікував, стала об'єктом нищівної критики з боку наших політичних опонентів. Якщо ми не виконаємо наші військові плани, нам буде важче переконати людей, в якому напрямку ми рухаємося [ROOT.GetName].."
 war_justification.4.a:0 "Історія буде написана нашою перемогою."
 war_justification.5.d:0 "«Хоча ми зміцнили соціалістичне суспільство в [ROOT.GetName], багато народів все ще страждають під владою старих деспотій. Робітники [From.GetName] не мають права голосу, не мають засобів для організації, і будь-які спроби встановити соціалізм будуть жорстоко придушені режимом [From.GetLeader]. Ми не можемо чекати, поки шестерні міжнародної революції повернуться на користь [From.GetAdjective]ого народу. Революцією ми довели, що змогли розтрощити капіталістичних гнобителів тут, і ми розтрощимо гнобителів у [From.Capital.GetName] також!»\n\n[ROOT.GetLeader] відмовився від усіх спроб дипломатичної риторики по відношенню до [From.GetRulingParty], контрольованої [From.GetName]. Прагнення ліквідувати всі кордони тепер суворо зосереджене на ліквідації їхніх кордонів."
 war_justification.6.a:0 "Ми розчавимо їхню буржуазну диктатуру!"
