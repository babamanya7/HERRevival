 SOV_attempted_to_infiltrate_manhattan_project:0 "Спробували проникнути в Мангеттенський проєкт"
 SOV_autonomous_soviet_republics_desc:0 "У роки після революції сталіністи наполегливо працювали над усуненням регіональної ідентичності та придушенням робітничого самовизначення в деяких регіонах Союзу. Контрреволюційний характер цих дій є очевидним. Якщо робітники в деяких радянських республіках бажають більшої автономії, ми мусимо надати їм її без вагань."
 SOV_back_to_the_nep_desc:0 "Перш ніж будувати соціалістичне суспільство, ми мусимо окреслити основи і далі розвивати нашу економіку. В перші роки революції ми запровадили нову економічну політику, яка дозволила вільному ринку розвивати економіку. Ця політика була швидко скасована до того, як могла принести свої плоди. І ось ми знову при владі, можемо поновити цей процес переходу до кращого суспільства."
 SOV_build_national_academy_of_sciences_integrated_republic_EST:0 "Збудувати [EST.GetAdjective]у $SOV_build_national_academy_of_sciences_integrated_republic_default$"
 SOV_build_national_academy_of_sciences_integrated_republic_LAT_desc:0 "Ми збудуємо [LAT.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_claim_bessarabia_desc:0 "Чорне море навіть важливіше для нашої економіки, ніж Балтійське. Ми мусимо зробити все можливе, щоб забезпечити контроль над Босфором і Дарданеллами."
 SOV_comecon_dec_cat_desc_alt:0 "$SOV_the_common_economic_space_initiative$"
 SOV_concessions_japan_vladivostok_SCW:0 "Запропонувати Владивосток Японії"
 SOV_covert_support_for_spanish_poum:0 "Таємна підтримка для іспанської РПМО"
 SOV_daunt_generals_minor_tt:0 "До 2 командирів армії отримають рису §YЗаляканий Сталіним§!:\n- $MODIFIER_ARMY_MORALE_FACTOR$: §R-10.0%§! \n- $MODIFIER_LAND_REINFORCE_RATE$: §R-2.0%§!"
 SOV_diversify_the_programme:0 "Урізноманітнити програму"
 SOV_end_the_khalkhin_gol_conflict_desc:0 "Прикордонний конфлікт з Японією триває вже досить довго. Якщо ми не можемо довіряти японському уряду поважати визнаний кордон, тоді нам доведеться замінити цей уряд."
 SOV_expand_the_aircraft_industry:0 "Розширити авіаційну промисловість"
 SOV_far_east_fortification:0 "Далекосхідні укріплення"
