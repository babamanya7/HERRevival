 pavel_events.3.t:0 "[From.GetNameDefCap] вимагає Східну Німеччину!"
 pavel_events.302.desc:0 "Як і було передбачено, німці відкинули вимоги, які висуває [Root.GetLeader], вважаючи їх чимось на зразок хитромудрого жарту. Бачачи, що дипломатичним шляхом держава [From.GetNameDef] не переконати, [Root.GetLeader] осідлав коня і поскакав до кордону, особисто перевівши конфлікт у розряд військових."
