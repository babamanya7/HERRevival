 HUN_mio_trait_danuvia_two_part_lever_delayed_blowback_bolt:0 "Двоскладовий напіввільний затвор із важільним сповільненням"
 HUN_motorized_equipment_0_short:0 "Daimler Marienfelde"
 HUN_motorized_logistics_desc:0 "Ключ до мобільності в умовах воєнних дій — здатність швидко перекидати особовий склад та постачання на великі відстані. Кращий у світі танк виявиться марним, якщо залишиться без палива та снарядів."
 HUN_protect_czechoslovakia_tt:0 "\nВони з більшою ймовірністю підкоряться, якщо:\n - §Hсвітова напруженість§! висока\n - вони не є членом §Hальянсу§!\n - вони мають §Hхорошу думку§! про нас\n - вони мають §Hпакт про ненапад§! із нами\n - їхня §Hармія слабша§! від нашої"
 HUN_reclaim_venetia_desc:0 "Зрада Італії у Великій війні не забута. Настав час поставити їх на місце і відновити історичні межі нашої імперії."
 HUN_renew_the_rome_protocols_desc:0 "У світлі ревізіоністських настроїв у Німеччині ми маємо поновити Римські протоколи 1934 року. Завдання цієї угоди — не лише ізолювати загрозу з боку Німеччини та Югославії, а й підготувати ґрунт для майбутнього військового союзу."
 HUN_secure_the_ragged_guards_tt:0 "Фашисти не отримають додаткових дивізій на початку громадянської війни, а ми будемо на крок ближче до того, щоб остаточно викорінити їх, уникнувши відкритого конфлікту"
 HUN_stamped_down_on_the_arrow_cross_party_flag:0 "Партію «Стрілохрест» викорінено"
 HUN_sweden_hungary_unified_DEF:0 "Угро-Швеція"
 HUN_sweden_hungary_unified_neutrality:0 "Сполучені королівства Швеції й Угорщини"
 HUN_tac_focus_desc:0 "Перемоги можна досягти лише знищивши ворожі наземні війська. Для підтримки дій нашої армії ми мусимо завдавати тактичних ударів по об'єктах супротивника на лінії фронту і в глибокому тилу."
 HUN_the_hungarian_red_army_desc:0 "Обов'язок кожного патріота — захищати свою батьківщину. Скориставшись прикладом радянців, ми створимо Угорську Червону армію, яка стане на захист молодої революції."
 HUN_train_equipment_1:0 "MÁV Class 601"
 ICE_compensation:0 "Компенсація"
 ICE_compensation_desc:0 "Ми довели Данії та світу, що ми є нацією, з якою треба рахуватися. Ми приносили жертви, як нещодавно, так і протягом століть. Розташована в Атлантичному океані, Ісландія має всі можливості для захисту островів данської корони. Передавши нам захист цих островів, Данія отримає сильнішого партнера і зможе краще зосередитися на захисті своєї основної території."
 ICE_expand_industrial_complexes:0 "Розширення промислових комплексів"
 ICE_expanding_the_university_of_reykjavik_desc:0 "Знання — це ключ. Якщо країна хоче бути попереду світу, ми повинні зосередити наші зусилля. Збільшуючи фінансування Університету Рейк'явіка, ми створюємо платформу для майбутнього зростання."
 ICE_incite_communist_uprising_scotland_desc:0 "З невеликим поштовхом ми зможемо змусити шотландських робітників повстати в [121.GetCapitalVictoryPointName] і проголосити свою незалежність від уряду в м. [121.owner.capital.GetCapitalVictoryPointName]."
 ICE_infiltrating_the_british_isles_tt:0 "Відкриває §Yрішення§! розпочати комуністичні повстання в Уельсі, Шотландії та Північній Ірландії."
 ICE_joint_military_training:0 "Спільні військові навчання"
 ICE_local_arms_industry_desc:0 "Виробляючи озброєння на місцевому рівні, ми можемо як забезпечувати власні збройні сили, так і продавати його на міжнародному ринку, а це означає, що ми зміцнюємо не лише нашу обороноздатність, але й нашу економіку. Таким чином, ісландська оборонна промисловість має стати ключовим об'єктом для наших інвестицій."
 ICE_thungur_hnifur:0 "Þungur hnífur"
