 RAJ_asked_for_famine_help:0 "Попросили допомоги у боротьбі з голодом"
 RAJ_azad_hind_dlc_tt:0 "Ми отримаємо: "
 RAJ_ban_untouchability_once_and_for_all_desc:0 "Недоторканність — це пляма на нашому суспільстві, яка розділяє нас, коли єдність потрібна найбільше. Скасувавши цю практику, ми стверджуємо гідність кожного індійця та робимо рішучий крок до побудови справедливої та інклюзивної нації."
 RAJ_bhutanese_protectorate:0 "Бутанський протекторат"
 RAJ_british_rail_investors:0 "Британські інвестиції в залізниці"
 RAJ_coal_fire_and_steel_desc:0 "Вугілля живить двигуни, вогонь загартовує волю, а сталь будує майбутнє. Інвестуючи у важку промисловість, ми закладаємо основу для самодостатньої Індії, здатної захищати свій суверенітет та керувати своїм процвітанням."
 RAJ_contamination_cleanup_crew_desc:0 "Наші солдати повинні бути готові битися в найсуворіших умовах, навіть під ядерними опадами."
 RAJ_cruiser_effort_desc:0 "Для розвитку [ROOT.GetAdjective]ого флоту нам поки що вистачить і крейсерів."
 RAJ_crush_the_anathema:0 "Розгромити анафему"
 RAJ_deathknell_to_the_raj_trigger_tt:0 "Анексує залишки Раджу"
 RAJ_destroyer_of_worlds:0 "Руйнівник світів"
 RAJ_east_india_railways_desc:0 "Узявши контроль над Східноіндійською залізницею у свої руки, влада передала міністрам усі повноваження щодо її розвитку та модернізації."
 RAJ_establish_local_recruitment_offices_tt_2:0 "Досягнуто максимального ліміту"
 RAJ_every_man_a_gun_desc:0 "У Народній Республіці всі громадяни є солдатами.\nМи стандартизуємо навчання та масово озброїмо населення, перетворюючи націю на фортецю."
 RAJ_expand_mazagon_dock:0 "Розширити верф Мазагон"
 RAJ_expand_tax_loopholes:0 "Розширити податкові лазівки"
 RAJ_fascism_party_long:0 "Всеіндійські індуїстські збори"
 RAJ_fighter_equipment_2_short:0 "Spitfire"
 RAJ_freedom_of_the_press:0 "Свобода преси"
 RAJ_guarantee_nepalese_independence:0 "Гарантувати незалежність Непалу"
 RAJ_has_met_with_kremlin_flag_tt:0 "[MeetWithKremlinLocFlag]"
 RAJ_hidden_pressure_RAJ_BAN_does_not_exist:0 "\nНаш тиск на [THIS.GetName]: §O[?THIS.RAJ_pressure]§!\nТиск [PAK.GetAdjective] на [THIS.GetName]: §YНевідомо§!"
 RAJ_indian_defense_research:0 "Індійські оборонні дослідження"
 RAJ_instigate_in_nepal:0 "Підбурювати в [NEP.GetName]"
 RAJ_institute_of_fundamental_research_GOE:0 "Інститут фундаментальних досліджень"
 RAJ_integration_tooltip:0 "Рішення §H$RAJ_population_decisions$§! тепер дають:"
 RAJ_iron_will_indoctrination_desc:0 "Сила не лише в тілі — вона в переконанні.\nМи прищепимо абсолютну дисципліну, ідеологічну ясність та незламну волю до боротьби кожному солдату."
 RAJ_join_the_co_prospherity_sphere_desc:0 "Японія — єдина місцева сила, яка готова протистояти західним імперіалістам. Нам потрібно приєднатися до них заради більшої мети."
 RAJ_jungle_training_GOE_desc:0 "На таких обширних землях, як наші, нам пощастило мати велике біорозмаїття, яке можна використовувати на нашу користь. [RAJ.GetNonIdeologyName], [BRM.GetNonIdeologyName] та Індокитай покриті джунглями, і рекомендується спеціальна підготовка, щоб зробити наших солдатів ефективними в цій небезпечній місцевості."
 RAJ_khadi_movement_desc:0 "У рамках Свадеші символом незалежності став Хаді. Тканина, виткана вручну, є як символічним жестом опору, так і одягом, витканим із неї, що дає багато економічних можливостей для пригноблених та бідних."
 RAJ_learn_from_the_secret_intelligence_service:0 "Вчитися у Секретної розвідувальної служби"
 RAJ_light_tank_destroyer_equipment_1:0 "Deacon"
 RAJ_lions_of_the_great_war:0 "Леви Великої війни"
 RAJ_medium_tank_equipment_2_short:0 "Cromwell LP"
 RAJ_military_pensions:0 "Військові пенсії"
 RAJ_modernizing_navy_desc:0 "Більше сучасні двигуни, більше місця для екіпажів, більш скорострільні та великокаліберні знаряддя. Індійський флот скоро дорівнюватиме за силою кращими ВМС континенту."
 RAJ_modernizing_navy_dlc:0 "Модернізація флоту"
 RAJ_mountain_guns:0 "Гірські гармати"
 RAJ_mughal_court_tt:0 "Усі туземні князівства отримають Національний дух:"
 RAJ_mughal_empire:0 "Імперія Великих Моголів"
 RAJ_national_planning_committee_desc:0 "Економічна самодостатність — це основа справжньої незалежності. Створивши Національний комітет планування, ми можемо намітити курс на індустріалізацію, розвиток сільської місцевості та справедливе зростання. Єдиний план перетворить Індію на сучасну, самодостатню націю."
 RAJ_nav_bomber_equipment_1:0 "Fairey Swordfish"
 RAJ_night_shifts:0 "Нічні зміни"
 RAJ_protest_against_the_howell_monument:0 "Протест проти Монумента Голвелла"
 RAJ_rally_the_indian_left_desc:0 "Фрагментовані ліві сили мають об'єднатися, щоб очолити боротьбу за права робітників та справжню незалежність. Згуртувавши соціалістичні та комуністичні сили під одним прапором, ми можемо створити потужний фронт, щоб кинути виклик як імперіалізму, так і капіталізму."
 RAJ_rani_of_jhans:0 "Рані з Джгансі"
 RAJ_re_establish_the_khyber_rifles_desc:0 "Ми відновимо ополчення хайберських стрільців для захисту нашої суворої місцевості, і, можливо, ми зможемо навчитися у них чогось новому."
 RAJ_sideline_the_conflict:0 "Усунути конфлікт"
 RAJ_soviet_influence:0 "Радянський вплив"
 RAJ_soviet_influence_desc:0 "Радянський Союз є моделлю революційної трансформації. Прийнявши їхнє ідеологічне керівництво та інституційні рамки, ми можемо намітити схожий шлях для [RAJ.GetName]"
 RAJ_strat_bomber_equipment_2_short:0 "Lancaster"
 RAJ_tac_bomber_equipment_3:0 "de Havilland Mosquito B"
 RAJ_the_revolutionary_army_marches_desc:0 "З метою наша армія марширує, за революцію, за Індію та за простий люд."
 RAJ_trade_protection:0 "Захист торгівлі"
 RAJ_trainer_planes_desc:0 "Кваліфіковані пілоти — це основа сильних повітряних сил. Інвестуючи в навчальні літаки, ми забезпечуємо, що наші авіатори отримують найкращу підготовку, створюючи кадри елітних пілотів, готових захищати небо Індії."
 RAJ_united_bengal_tt:0 "§Y[BAN.GetName]§! буде вільною після поділу"
 RAJ_viceroys_body_guard_desc:0 "Особиста охорона віце-короля уособлює традицію, дисципліну та престиж. Підтримуючи та модернізуючи цей історичний кавалерійський підрозділ, ми зберігаємо символ влади та адаптуємо його до викликів мінливої епохи."
