 ETH_taxing_the_nobility:0 "[ETH_GetSeizeAssetsTitle]"
 ETH_the_lion_and_the_sun_desc:0 "Його Величність [ETH.GetLeader] та японський імператор [JAP.GetLeader] зуміли знайти багато спільного між нашими великими імперіями. [JAP.GetLeader] зайшов настільки далеко, що припустив, що його уряд інвестуватиме в [ETH.GetName], коли ми врешті-решт повернемо нашу батьківщину."
