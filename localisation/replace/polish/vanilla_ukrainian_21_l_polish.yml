 SWI_swiss_armored_divisions:0 "Швайцарські бронетанкові дивізії"
 SWI_tank_development_desc:0 "Ми не можемо ослабити свою пильність у розробці нових і вдосконалених танків, інакше ми ризикуємо витратити сталь на непотрібні та застарілі металеві черепахи."
 SWI_the_alpine_protectorate_desc:0 "Ніколи раніше Альпи не були об'єднані під єдиним режимом, аж понині. Завдяки об'єднаній силі ми можемо захистити себе від будь-якої загрози та розширити цей захист за межі Альп, з нашими вершинами як неприступною цитаделлю, звідки наше командування ніколи не похитнеться."
