 stability.21.desc.c:0 "Оскільки реакція уряду на ухиляння від призову не має жодних позитивних наслідків, дедалі більше людей починають задаватися питанням, чому вони мусять наражати себе на небезпеку, тим часом як інші залишаються в безпеці. Призовники, які все ж з'являються, часто повідомляють, що зазнають утисків або висміюються на вулицях як дурні, які воюють за приречену справу. Звідусіль надходять повідомлення про матерів, які забороняють своїм дітям приходити за повісткою, а Управління війни подало звіт, ц якому стверджує, що більше не впевнене, скільки людей вони мають призивати, оскільки їхня бюрократична система почала ламатися під навантаженням, пов'язаним з обробкою всіх зниклих безвісти солдатів."
