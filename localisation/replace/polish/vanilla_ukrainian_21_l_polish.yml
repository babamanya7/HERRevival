 PAR_neutrality_DEF:0 "Парагвай"
 PAR_rebuild_humaita_desc:0 "Фортеця Умайта була зруйнована під час Парагвайської війни, але вона слугувала оплотом проти будь-яких південних атак. Ми знову відбудуємо цю грізну фортецю, як знак витривалості та як ляпас ворогу."
