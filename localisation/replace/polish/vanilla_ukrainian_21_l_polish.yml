 TUR_secure_the_iraqi_oil:0 "Заволодіти іракською нафтою"
 TUR_seizing_the_romanian_oil_fields_desc:0 "Румунські нафтові родовища є дуже важливими для [GER.GetFactionName] військової промисловості. Відрізати доступ до нафти, якою володіє [ROM.GetNameDef], — все одно що позбавити серце припливу крови."
 TUR_ship_torpedo_1:0 "3x 533-мм торпедний апарат"
 TUR_strait_compromise_tt:0 "§Y[SOV.GetNameDefCap]§! і всі інші країни з виходом у §YЧорне море§! збережуть своє право вільного проходу §YТурецькими протоками§!."
