 MAN_recruit_bandits_west_desc:0 "Кожна куля, витрачена на знищення бандитів, могла б бути використана для боротьби в майбутньому. Замість боротися з нашими підданими, ми можемо дати їм можливість виправитися шляхом служби імператорові."
