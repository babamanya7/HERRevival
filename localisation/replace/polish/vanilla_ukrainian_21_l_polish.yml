 AFG_political_events.132.t:0 "[FROM.GetName] відхиляє конфедерацію"
 AFG_political_events.170.desc:0 "Мірза Хуршід Джа Багадур прибув до нашої нації лише кілька днів тому, і зараз проводиться грандіозна церемонія, на якій визнається його претензія на Могольську та Тимуридську імперії, водночас коронуючи його новим Еміром Афганістану. З часом ми, можливо, зможемо претендувати на славу цих стародавніх імперій."
 AFG_political_events.53.a:0 "Майбутнє [AFG.GetNonIdeologyName] належить нам!"
 AFG_political_events.70.a:0 "Ми не можемо дозволити собі конфлікт у цей час."
 AFG_renew_soviet_trade_agreement_desc:0 "Хоча наші ідеології протягом багатьох років відрізнялися, [SOU.GetName] був хорошим економічним партнером для нашої нації. Хоча дехто побоюється ризику [SOU.Adjective] впливу на наші внутрішні справи, ми не бачимо проблеми у відновленні торговельної угоди між нашими націями."
 AFG_second_empire_neutrality_ADJ:0 "Афганськ"
 AFG_secure_dynasty_desc:0 "Зі стабільною економікою та задоволеним народом ми можемо забезпечити династію Баракзаїв, усунувши менш лояльні елементи уряду та замінивши їх іншими членами сім'ї, які лояльні королю. Або, що важливіше, його дядькам."
