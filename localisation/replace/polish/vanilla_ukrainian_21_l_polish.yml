 BUL_expand_varna_naval_base:0 "Розширити морську базу у Варні"
 BUL_expand_varna_naval_base_desc:0 "Ми мусимо розширити потужності військово-морської бази у Варні та побудувати відповідні доки для виробництва військових кораблів."
 BUL_fate_of_the_balkans_demand_submission_desc:0 "[ROOT.GetAdjective]а делегація відправиться в [FROM.GetAdjective]у столицю та виможе визнати державу [ROOT.GetNameDef] володарем держави [FROM.GetName]."
 BUL_ff_deal_the_final_blow_bs_pop_tt:0 "Популярність фракції [GetBsName] — §Y0§!"
 BUL_ff_deal_the_final_blow_bzns_destroyed_tt:0 "Фракція [GetBznsName] була знищена"
 BUL_free_balkan_states_desc:0 "Наш обов'язок як балканської держави — захистити наших слабкіших сусідів від амбіцій будь-якої нації, яка прагне вторгнутися на нашу землю. Ми мусимо розвивати співпрацю між дружніми націями регіону та готуватися до оборони Балкан."
 BUL_germany_demand_replacement_of_bulgarian_prime_minister:0 "Домогтися заміни болгарського прем'єр-міністра"
 BUL_germany_demand_replacement_of_bulgarian_prime_minister_desc:0 "Болгарський прем'єр-міністр Георгій Кьосеіванов показав себе некомпетентним політиком. [BUL.GetLeader] може прислухатися до нашої пропозиції замінити його на когось більш здібного та ближчого до наших ідеалів, як-от Богдана Філова."
 BUL_italian_military_agreements_flag:0 "Угода про військову співпрацю з італійцями була підписана"
 BUL_low_loyalty_increase_tt:0 "[?BUL.BUL_faction_low_increase|=G0] лояльність фракції."
 BUL_nsm_loyalty_status:0 "[GetNsmLoyaltyStatus]"
 BUL_opression_discredit_nsm_leaders:0 "Дискредитувати лідерів $BUL_nsm_name_gen$"
 BUL_opression_raid_bzns_supporters_desc:0 "Після захоплення лідерів $BUL_bzns_name_gen$ помітно ослаблений. Настав час влаштувати облаву на решту його учасників, які, як і раніше, тримають організацію на плаву і активно задумують щось проти нас."
 BUL_promote_bulgarian_nationalism:0 "Пропагувати болгарський націоналізм"
 BUL_purchase_artillery_everything_available:0 ", §Yзеніток§! або §YПТГ§!"
 BUL_soviet_naval_agreements_flag:0 "Угода про морську співпрацю з радянцями була підписана"
 BUL_support_macedonian_organizations_tt:0 "Будуть відкриті рішення: §YПідтримати македонські революційні організації§!."
 BUL_the_anti_capitalist_fight_ns_tt:0 "\nОсь ці країни вважаються великими демократіями в Європі:\n"
 BUL_the_fate_of_the_balkans_dec_cat_desc:0 "Іноземні держави вже дуже давно не можуть відвести погляд від Балкан... \nАле часи змінилися: ми стали сильнішими, і тепер [ROOT.GetNameDef] цілком може претендувати на перевагу на Балканах."
 BUL_the_return_of_ferdinand_i:0 "Повернення царя Фердінанда I"
 BUL_the_return_of_ferdinand_i_desc:0 "Незважаючи на його похилий вік і той факт, що він був змушений зректися престолу в 1918 році після поразки Болгарії у Великій війні, політичний досвід і військова майстерність колишнього царя Фердінанда I зробили його найбільш підходящим кандидатом, щоби привести націю до величі. Ми мусимо зробити необхідні заходи, щоби повернути Фердінанда на болгарський престол."
 BUL_the_unification_of_the_balkans_cores_tt:0 "§YКожна балканська область§! стане осердною:"
 BUL_total_war_desc:0 "Ми мусимо формалізувати наші територіальні претензії в Румунії з метою забезпечення джерела нафти для підтримки наших військових зусиль, оскільки держава [ROOT.GetNameDef] нарешті готова вести тотальну війну проти ворогів своїх союзників."
 BUL_uk_demands_nap_with_balkan_nation_tt:0 "Національний дух §YОбмеження на армію§! буде прибрано після підписання §Yпакту про ненапад§! з державою [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] або [TUR.GetFlag][TUR.GetNameDefCap]."
 BUL_ultimatum_is_not_major:0 ""
 BUL_unify_the_bourgeois_movement_desc:0 "Якщо ми хочемо боротися з фашизмом у Болгарії, ми мусимо об'єднати ліберальний рух у спільний рух. Щоб досягти цього, болгарська комуністична партія повинна шукати співпраці з соціалістами, залишаючи позаду розбіжності між нами для загального блага."
 BUL_united_we_shall_prevail_desc:0 "Балкани довгий час були підпорядковані іноземним державам, але зараз настав час для наших народів об'єднатися проти загарбників і боротися за землю, яка за правом належить нам."
 BYA_JAP_fascism_subject:0 "Улан-Уденська автономна армія"
