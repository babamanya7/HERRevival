 AAT_Sweden.27.a:0 "Це однозначно посилить моральний дух армії."
 AAT_Sweden.30.a:0 "Помилки виправляються."
 AAT_Sweden.33.t:0 "[FROM.GetName] відмовляється здавати Борнгольм"
 AAT_Sweden.4.a:0 "Сподіваємося, ми скоро знайдемо прем'єр-міністра."
 AAT_Sweden.41.t:0 "[FROM.GetName] прогинається!"
 AAT_Sweden_ball_bearing.2.t:0 "[SWE.GetNameDefCap] просить харчові продукти в обмін на кулькові вальниці"
 AAT_Sweden_ball_bearing.3.b:0 "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_communism.4.desc:0 "[?global.date.GetDateStringShortMonth] кілька гучних вибухів було чутно з Ріксдагу, а невідомі озброєні люди у коричневих сорочках були помічені по всій столиці. Евакуйований уряд закликав місцеву поліцію та національну гвардію відновити порядок, але заклик ніби не був почутий. Ходять чутки, що фашистські коричневі сорочки об'єдналися з генералами вищого рангу у коаліційний уряд. Завдяки окремим військовослужбовцям, які залишилися лояльними урядові, весь персонал зміг втекти зі столиці."
 AAT_Sweden_flashpoints.15.desc:0 "[SOV.GetAdjectiveCap]і бомбардувальники нещодавно були помічені в перетині нашого повітряного простору в державу [SWE.GetName] і бомбардували село, вважаючи його [FIN.GetAdjective]ою ціллю. Відтоді між державами [SOV.GetNameDef] і [SWE.GetName] спалахнула дипломатична криза, яка зараз загострилася до такої міри, що [SWE.GetName] вирішила активно постачати нам зброю для боротьби з [SOV.GetAdjective]ими силами. Залишається побачити, як [SOV.GetAdjective]а влада відреагує на це."
 AAT_Sweden_flashpoints.17.t:0 "[SWE.GetName] підіймає напругу, озброюючи державу [FIN.GetName]"
 AAT_Sweden_flashpoints.30.a:0 "Підступимо до держави [SWE.GetName] з запитом на право користуватися їхньою мережею залізниць."
 AAT_Sweden_flashpoints.31.b:0 "Відхиліть запит і нагадайте їм про наш нейтралітет."
 AAT_Sweden_flashpoints.41.t:0 "[SWE.GetName] дає доступ до телефонних і телеграфних мереж"
 AAT_Sweden_flashpoints.61.b:0 "Не дивно, але прикро."
 AAT_Sweden_flashpoints.79.t:0 "[FIN.GetName] відмовляється"
 AAT_Sweden_flashpoints.80.a:0 "Чудово."
 AAT_Sweden_nationalists.11.a:0 "Селяни є основою нації."
 AAT_Sweden_nationalists.21.desc:0 "Берлін вирішив надати нам більше повноважень, передавши більшу частку північних територій, фактично сформувавши належний Райхскомісаріат Нордланд"
 AAT_Sweden_nordic_defense_council.1.desc:0 "Світ готується до неминучого зіткнення між великими європейськими державами, тож нордичні країни ризикуть втягнутись у те протистояння. Уряд [FROM.GetAdjective]ої держави пропонує нордичним країнам створити об'єднану армію задля згуртування нашої оборони."
 AAT_USA_events.02.desc:0 "[FROM.GetAdjective] заявили, що наразі вони окупували Фарерські острови, які належать Данії і є стратегічно важливим пунктом. Вони стверджують, що будуть захищати Фарерські острови від усіх небезпек війни й зручно розташуються там на морі та в повітрі, поки не настане момент, коли острови будуть повернуті нам, звільнені від брудного ярма, в яке вони були занурені [?DEN.DEN_overlord_nation.GetAdjective]ою агресією."
 AAT_finland_continuation_war.01.b:0 "[FROM.GetAdjectiveCap]і дрібниці нас не цікавлять."
 AAT_finland_diplomacy.09.a:0 "[FROM.GetAdjective]ий уряд вчинив в інтересах свого народу."
 AAT_finland_diplomacy.26.b:0 "Не наша проблема."
 AAT_finland_kinship_war.01.a:0 "Ми покінчимо з будь-якими бунтівниками!"
 AAT_finland_motti.01.t:0 "[FROM.GetAdjective]а тактика motti"
 AAT_finland_political.03.desc:0 "На жаль, ми повинні примиритися з похмурою реальністю: [ROOT.GetLeader] аж ніяк не блищить здоров'ям. У лідера нації вже паралізована права рука через перенесений інсульт, і лікарі побоюються сильного погіршення здоров'я, якщо [ROOT.GetLeader.GetSheHe] терміново не піде на спокій.\n\nЕдускунта, фінський парламент, скликав термінову раду, щоб оголосити президентові вотум недовіри та звільнити главу держави від займаної посади за станом здоров'я. Прем'єр-міністр Рісто Рюті вже взяв на себе кілька президентських обов'язків і готовий прийняти президентську посаду."
 AAT_finland_the_white_death.9.a:0 "Чесно кажучи, у нього не було шансів проти нас"
 AAT_norway.19.desc_fascist:0 "Очевидно, що [FROM.GetAdjective]а влада не розуміє, кому вона відмовляє. Ми не будемо сидіти склавши руки, поки вони окупують наші законні землі. Наш єдиний вибір зараз — забрати їх силою."
 AAT_norway_communist.4.b:0 "Ми не можемо ризикувати, щоби вони використали зброю проти нас."
 AAT_norway_monarchist.5.a:0 "Ярлсберг поведе державу як її істинний король."
 AAT_norway_rikstanken.2.d:0 "Попросімо про допомогу в розробці власних танків."
 AAT_norway_rikstanken.9.t:0 "[ROOT.GetAdjectiveCap]а та [FROM.GetAdjective]а держави зближуються завдяки танкам"
 ABDA_events.4.a:0 "Посилити військово-морські підступи. Сила Сінгапуру — його гавань."
