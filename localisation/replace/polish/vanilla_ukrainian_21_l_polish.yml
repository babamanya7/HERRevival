 EST_empower_finnish_militants_desc:0 "Рух вапсів не був би можливий без допомоги фінських ветеранів з півночі. Фінські добровольці допомогли Естонії домогтися незалежності, і тепер ці ветерани, як і ми, шукають способи повалити свій слабовільний уряд і затвердити на його місці таке пекло фінам."
 EST_establish_the_rahvuskogu_desc:0 "Оскільки стара Конституція Естонії виявилася нездатна захистити свій народ від фашизму та тиранії, було вирішено розробити нову конституцію, щоби захистити націю та з часом відновити демократичні традиції, за котрі естонський народ боровся та гинув у 1918 році."
 EST_events.4.t:0 "[From.GetNameDefCap] Seeks Baltic Unification"
 EST_fight_the_vaps:0 "Боротися з вапсами"
 EST_fortify_tallinn:0 "Укріпити Таллінн"
 EST_secure_the_straits_desc:0 "Данія блокує нам прохід до Атлантики. Щоб естонські кораблі могли ходити Північним морем, цю перешкоду потрібно усунути."
 EST_subject:0 "$OVERLORDADJ$а $EST$"
 EST_you_can_ban_fascism_tt:0 "Якщо прийняти рішення §YЗаборона фашизму§!, §Y[EST.GetNameWithFlag]§! більше не зможе заохочувати фашизм у нашій країні."
