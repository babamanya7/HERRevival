 form_siberia_category:0 "Сибірське об'єднання"
 form_siberia_category_desc:0 "Сибір ніколи не мав єдиної ідентичності, ні культурної, ні етнічної, ні політичної, окрім нинішньої російської. Однак, завдяки тому, що сибірський народ опинився в одному царстві руками росіян, він ще ніколи не був таким згуртованим, як зараз. Якби якась держава об'єднала Сибір і витіснила російських імперіалістів, багато людей, безсумнівно, прийняли б об'єднання під владою цієї нової держави, і багато хто просить, щоб це стало реальністю."
 form_united_netherlands_category_desc:0 "Лондонський договір 1839 року ганебно розділив північ і південь Нижніх земель після дуже короткого періоду єдності. Тепер під нашим керівництвом ми можемо відтворити ті дні і зайняти намічене місце противаги Франції та Німеччині."
 fortify_dardanelles_goal_name:0 "Укріплення Дарданелл посилить нашу здатність диктувати рух флоту та торгівлі з Чорного моря."
 france.20.a:0 "Боротьба за Францію продовжується."
 france.20.t:0 "Спротив перемир'ю"
 france.27.t:0 "Німеччина підтримує вимоги Італії"
 france.29.d:0 "«Історія показала, як багато можна зробити, коли наші великі нації стоять пліч-о-пліч. У дусі сердечної Антанти ми з гордістю вітаємо вас не лише як друзів, а й як союзників. Разом ми будемо сяючим маяком свободи у світі, охопленому темрявою гніту!»\n\nБританія погодилася на наше прохання стати їхнім союзником. Ми можемо розраховувати на їхню повну підтримку в ці неспокійні часи, що попереду."
 fraternal_republic_desc:0 "[From.GetAdjective]ий народ вимагає втручання наших військ, щоб вигнати пригнічуючих його паразитів-землевласників і капіталістів."
 free_operative_free_in_transit_desc:0 "Нашого шпигуна перевозять на автомобілі з в'язниці до місця допиту. Нам відомий маршрут, і ми відправимо невеликий загін, щоб влаштувати засідку, убити охоронців і звільнити нашого агента."
 generic.1.d_bad:0 "Уже досить довго [From.GetAdjective]ий уряд бажає зблизити шляхи наших держав і часто намагається втручатися в [Root.GetName]у політику. Віднедавна це помітно посилилося, коли партія [From.GetRulingParty] почала просувати пропаганду своєї ідеології ([From.GetRulingIdeology]) без уряхування [Root.GetAdjective]их політичних традицій. Деякі виступи та інші матеріали ідеології [From.GetRulingIdeology] вже розповсюджуються серед [Root.GetAdjective]ого народу. Схоже, що навіть низка політиків та інших чиновників піддається [From.GetAdjective]ій пропаганді й вони почали виступати за [From.GetRulingIdeologyNoun_RU_lower_Acc] в державі [Root.GetName]."
 generic.1.d_neutral_good:0 "Уже досить довго [From.GetAdjective]ий уряд бажає зблизити шляхи наших держав і виражає інтерес у [Root.GetAdjective]ій політиці. Віднедавна це помітно посилилося, коли партія [From.GetRulingParty] почала просувати пропаганду своєї ідеології ([From.GetRulingIdeology]) шляхом виступів з промовами та поширення друкованих матеріалів серед [Root.GetAdjective]ого населення.\n\nТепер навіть низка політиків та інших чиновників піддається [From.GetAdjective]ій пропаганді, і вони почали виступати за [From.GetRulingIdeologyNoun_RU_lower_Acc] у державі [Root.GetName]."
