 HOA_invite_foreign_settlers_desc:0 "Нам ще попереду великий шлях, коли мова йде про модернізацію нашої країни. Ми повинні використовувати навички наївних колоністів, створивши для них стимул для переїзду до [ROOT.GetNameDef]."
