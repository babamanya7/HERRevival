 SPA_submarine_4:0 "Клас «D»"
 SPA_the_fifth_column_desc:0 "За словами Еміліо Моли: «Коли мої чотири колони наближатимуться до Мадриду, п'ята колона підтримок підніметься зсередини міста та підірве республіканську оборону зсередини». Ми організуємо ці «п'яті колони» в усіх містах, до яких наблизимося, що дасть нам вирішальну перевагу."
