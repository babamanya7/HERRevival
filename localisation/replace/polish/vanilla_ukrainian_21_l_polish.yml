 GER_anglo_germanic_cooperation_program_desc:0 "Королівський флот має великий досвід у кораблебудуванні та морських битвах. Завдяки тісній співпраці, ми зможемо скористатися цими знаннями, які британці так довго зберігали в таємниці."
 GER_anti_tank_equipment_2:0 "7,5 cm PaK 40"
 GER_armament_rationalization_desc:0 "Наші виробничі лінії ледве встигають за потребами збройних сил. Ми мусимо впровадити заходи з раціоналізації озброєння, щоби збільшити ефективність і результативність нашої промислової військової машини."
