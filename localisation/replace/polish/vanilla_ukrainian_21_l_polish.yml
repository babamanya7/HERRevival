 DEFENDERS:0 "§TЗахисники§!"
 DEN_STATE_58:0 "Гольстен"
 DEN_air_force_power_projection_desc:0 "Тепер, коли ми об'єднали Flyvevåbnet у третій основний вид збройних сил, ми можемо зосередитись на захисті неба над нашою величезною територією. Великі та успішні військово-повітряні сили все ще залежать від авіабаз, з яких вони можуть приземлятися і злітати."
 DEN_annexation_medium_range:0 "Помірний вплив володаря"
 DEN_bop_occupation_criticize_collaboration_desc:0 "Ця ганебна капітуляція та нечестива співпраця між [ROOT.GetNameDef] і [?DEN.DEN_overlord_nation.GetNameDef] не варта паперу, на якому вона написана!"
 DEN_communism_party_long:0 "Комуністична партія Данії"
 DEN_danske_stalvalsevaerket_desc:0 "Деякі представники промислового сектору виступають за збільшення виробництва сталі. Якби ми побудували новий завод, це могло б стати поштовхом для економіки і зробити нас більш самодостатніми у виробництві сталі."
 DEN_demand_finnish_territory:0 "Вимогти [FIN.GetFlag][FIN.GetAdjective]і території"
 DEN_demand_troops:0 "Запит на данські війська"
 DEN_develop_greenland_desc:0 "Континентальна Данія має мало природних ресурсів, які ми можемо розробляти і використовувати у нашому внутрішньому виробництві. З іншого боку, Гренландія, якою ми володіємо, набагато багатша на ці ресурси, і якщо ми будемо інвестувати і розвивати Гренландію, ми зможемо пожинати плоди."
 DEN_economic_crisis_neutrality_drift_modifier:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$neutrality_drift$: §R-0.02%§!\n\n"
 DEN_jagerfly_desc:0 "Щоб захистити наші міста від руйнівних бомбардувань з неба, ми повинні зосередити наші авіаційні ресурси на створенні найкращих винищувачів, які ми можемо."
 DEN_neutrality_monarchist_party_long:0 "Монархісти"
 DEN_north_sea_ambitions_desc:0 "Наша країна має широку територію, від берегів Європи до морів Північної Атлантики. Щоб захистити цю величезну територію і убезпечити наші заморські території, ми повинні приступити до реалізації сміливого і амбітного плану. Побудова флоту в Північному морі, здатного змагатися в цих водах з будь-якою державою, що протистоїть нам, має бути нашою єдиною метою."
 DEN_protect_greenland:0 "Захист Гренландії"
 DEN_remove_declaration_of_neutrality_tt:0 "Видалити §Y$DEN_declaration_of_neutrality$§!"
 DEN_science_pact:0 "Участь у програмі досліджень та партнерства"
 DEN_seize_power:0 "Захопити владу"
 DEN_slaedepatruljen_sirius_desc:0 "На материковій частині Данії взимку випадає дуже мало снігу, і він рідко затримується надовго. Проте у нас є Гренландія, де сніг лежить кілометровою товщиною цілий рік. Ми можемо скористатися цим і тренувати там наших солдатів, щоб акліматизувати їх до холоду."
 DEN_start_the_rearmament_desc:0 "Занадто довго [DEN.GetNameDef] нехтували нашими військовими і віддавали наш суверенітет в руки наших сусідів. В умовах нестабільності, що охопила Європу, так далі не може тривати! Ми повинні знову нарощувати наш військовий потенціал і переконатися, що наша доля знаходиться в наших власних руках."
 DEN_submarine_1:0 "Клас «Rota»"
 DEN_trade_with_britain_desc:0 "[ENG.GetNameDefCap] історично була нашим найбільшим експортним ринком для сільськогосподарської продукції, але після Великої депресії ця торгівля майже припинилася. З девальвацією крони настав час звернутися до британців, щоб спробувати відновити наші колишні торговельні зв'язки."
