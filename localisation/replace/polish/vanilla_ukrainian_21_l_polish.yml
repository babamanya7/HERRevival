 ROM_his_majestys_loyal_government_desc:0 "Внутрішня лояльність має першочергове значення, і поки нація стоїть за своїм королем, прагматична зовнішня політика непотрібна."
 ROM_join_axis_desc:0 "Настав час приєднатися до Осі, so that we may carve out a glorious Romanian future alongside the Germans."
 ROM_military_modernization:0 "Військова модернізація"
 ROM_modern_submarines_desc:0 "Підводна війна — найцікавіша розробка військово-морських сил із часів винаходу торпедного катера. Нам було б добре не тільки захищати від підводних човнів, але й використовувати їх проти ворожих суден."
 ROM_seek_alliance_GER:0 "Бажання помститися Німеччині"
 ROM_strat_bomber_equipment_3_short:0 "IAR 979"
 ROM_white_squadron_focus_desc:0 "Біла ескадрилья, запропонована Маріною Штірбей — талановитим пілотом знатного походження, — це служба санітарних літаків, якими керують виключно жінки. Вже сама думка про те, що порятунок може бути близько, підтримувала у наших солдатів гарний настрій."
 RULE_ALLOW_KICK_FACTION:0 "Виключення з альянсу"
 RULE_ALLOW_RELEASE_NATIONS_WARLORD_CHINA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! не може давати незалежність державі §Y[CHI.GetNameDef]§! або §Y[PRC.GetNameDef]§!."
 RULE_ALLOW_TAKE_OVER_FACTION_BLOCKED_DESC:0 "Держави не можуть переймати лідерство в альянсі."
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_38_DESC:0 "Цілі війни можуть бути отримані лише з національних фокусів, подій та рішень до 1938 р."
 RULE_HISTORICAL_ETH_AI_DESC:0 "ШІ Ефіопії спробує перемогти Італію за допомогою Ліги Націй, і якщо це не вдасться, спробує піти у вигнання. Опісля він намагатиметься відновити свою рідну територію та відбудувати Ефіопію."
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL:0 "$RULE_OPTION_HISTORICAL$"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI:0 "Австрійська демократія — Альпійська федерація"
 RULE_OPTION_CARLIST:0 "Карлізм"
 RULE_OPTION_COMMUNISM_PER_DESC:0 "ШІ почне революцію, в результаті якої до влади прийде прорадянська Народна партія. Комуністичний режим спробує дестабілізувати ситуацію в регіоні."
 RULE_OPTION_DEMOCRATIC:0 "Демократичний шлях"
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT:0 "Кінець умиротворення"
 RULE_OPTION_DICTATORSHIP_NEUTRAL:0 "Нейтральна диктатура"
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC:0 "ШІ приєднається до фламандських націоналістичних фашистів і буде агресивно намагатися об'єднати Нідерланди, а потім обернеться проти Франції."
 RULE_OPTION_HISTORICAL_POL_AI_DESC:0 "§HПольський§! ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_OPTION_QUEBEC_DESC:0 "Квебек вільний на початку гри."
 RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "§HРадянський§! ШІ спробує привести до влади праву опозицію та включити інші опозиційні групи в партію, рухаючися відповідною гілкою дерева національних фокусів. Метою ШІ є формування Верховної Ради."
 RULE_OPTION_SPR_FAMILIAR:0 "11 листопада"
 RULOC_OnCap:0 "Він"
 RU_lower_Adherent_Nom_neutrality:0 "нейтрал"
 SAF_anti_tank_equipment_1_short:0 "QF 2-pounder"
 SAF_artillery_equipment_1_short:0 "QF 18-pounder"
 SAF_battleship_2:0 "$ENG_battleship_2$"
 SAF_carrier_1:0 "Клас «Courageous»"
 SAF_carrier_3_desc:0 "$ENG_carrier_3_desc$"
 SAF_defense_collaboration_initiative_desc:0 "Британці показали нам, який зиск дає обмін науковими розробками між найближчими союзниками. Весь наш альянс зможе ефективніше проводити дослідження у воєнний час, якщо ми зуміємо скоординувати цей процес."
