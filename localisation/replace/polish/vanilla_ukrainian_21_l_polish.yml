 PEACE_PASS_EMPTY:0 "§RНа цьому ході більше нíчого брати.§!"
 PEACE_WAR_REPARATION_LABEL:0 "Військові репарації"
 PERMISSION_CONTESTED_DESC:0 "через війну між розпорядниками: $SIDE1|H$ та $SIDE2|H$"
 PER_UNIFIED_fascism_DEF:0 "Перська імперія"
 PER_communist_education_reform:0 "Розширити систему освіти"
 PER_establish_air_academy_desc:0 "Ми вже створили базову підготовку пілотів як частину процесу вступу до повітряних сил, однак нам потрібна більш спеціалізована освіта, якщо ми справді хочемо контролювати небо. Створення офіційної повітряної академії в Тегерані прискорить цей процес та забезпечить належну підготовку наших пілотів."
 PER_expand_imperial_guard_tt:0 "Відмикає шаблон дивізії §YІранська імперська гвардія§! та набирає §Yдві§! одиниці у §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_imperial_events.14.desc:0 "Я боюся, що наша авантюра не окупилася, оскільки, отримавши наше повідомлення, шах [PER.GetNameDef] офіційно погрожував війною нашій нації. Їхні війська готуються штурмувати Інд та забрати те, що вони хотіли, силою. Це сумний стан справ."
 PER_imperial_events.170.b:0 "Ми повинні продовжувати тиснути! Ми переможемо!"
 PER_imperial_events.182.desc:0 "Настав темний день. Наш ворог вирішив продовжувати просування на нашу територію, незважаючи на їхні втрати та наші вимоги миру. Їхнє небажання дозволити нам закінчити війну їхньою перемогою розчаровує, і у нас немає вибору, окрім як продовжувати боротьбу."
 PER_imperial_events.191.a:0 "Це найкраще, що ми можемо зробити для [PER.GetNameDef]"
 PER_increase_faculty_staffing_budget_desc:0 "Якщо ми хочемо зберегти нашу технологічну майстерність та не відставати, ми повинні забезпечити залучення найрозумніших людей, яких може запропонувати наша країна. Вартість може бути високою, але ціна технологічної стагнації буде вищою."
 PER_industrial_aid:0 "Промислова допомога"
 PER_industrial_events.2.desc:0 "[FROM.GetNameDefCap] люб'язно прийняв нашу пропозицію щодо нещодавно отриманої нафти. Це лише сприятиме зростанню нашої великої нафтової імперії."
 PER_industrial_events.3.a:0 "Це їхня втрата!"
 PER_integrate_anatolia_decisions_category:0 "Реінтеграція Анатолії"
 PER_iranian_industrialization:0 "Індустріалізація"
 PER_islamic_rep_party_long:0 "Рада Ісламської революції"
 PER_islamic_revolution_events.2.c:0 "Нехай спробують!"
 PER_islamic_revolution_tt:0 "Розпочне §RГромадянську війну§! між [PER.GetNameDef] та Ісламськими революціонерами!"
 PER_kur_azr_independence_cat:0 "Сепаратистські рухи"
 PER_negotiate_tt:0 "Спробує укласти §Yмир§! з нашими ворогами, що може призвести до становлення §Rмаріонеткою§! [ENG.GetFlag]§Y[ENG.GetNameDef]§! та втрати території на користь [SOU.GetFlag]§Y[SOU.GetNameDef]§!!"
 PER_purchase_foreign_ships_desc:0 "Наш флот був сформований шляхом придбання нових, озброєних кораблів у [ITA.GetNameDef] кілька років тому. Ми можемо посилити наші військово-морські можливості, звернувшись до інших іноземних держав та придбавши більше. Це також сприятиме зміцненню відносин між націями."
 PER_reinstate_qajars_desc:0 "Династія Каджарів була останньою керівною родиною держави [PER.GetNameDef] до правління дому Пехлеві. Будучи скинутим у 1925 році самим Резою-шахом Пехлеві, спадкоємець сім'ї, Мохаммад Хассан Мірза, перебуває у вигнанні в [ENG.GetNameDef]. Оскільки Пехлеві не змогли захистити [ENG.GetAdjective] інтереси в [PER.GetNameDef], можливо, настав час відновити Каджарів та сподіватися, що це сподобається нашим новим сюзеренам."
 PER_reinstate_qajars_tt:0 "Активує §Yланцюжок подій§!, який дозволить нам відновити династію Каджарів на троні [PER.GetNameDef]."
 PER_royal_college_funding_desc:0 "Для нас вкрай важливо залишатися на вершині нашого інтелектуального розвитку. Спрямовуючи частину коштів, які ми взяли з гаманця шаха, в наші освітні установи, ми будемо в хорошому становищі, щоб не відставати від обличчя технологічного прогресу, що швидко змінюється."
 PER_sp_rockets_ballistic_missile:0 "Проєкт «Naze'at»"
 PER_stabilize_economy:0 "Економічна надійність"
 PER_the_pahlavi_imperium:0 "Імперіум Пехлеві"
 PER_war_elephant:0 "Бойовий слон"
 PER_wether_the_storm_desc:0 "Здається, наші спроби захистити себе дипломатично обернулися проти нас: колишні друзі звертають свої погляди на наші землі з надією запобігти тому, щоб ми не обернулися проти них. Хоча ми не мали такого наміру, ми повинні підготуватися до всього, що може статися."
 PHI_asean_tag_DEF:0 "Асоціація держав Південно-Східної Азії"
 PHI_declare_military_emergency_tt:0 "Це розблокувало нову гілку фокусів для ультралівих."
 PHI_devil_boats:0 "Диявольські човни"
 PHI_encourage_chinese_immigration_desc:0 "Китайські торговці виявили виняткову підприємливість у створенні малого бізнесу та крамниць. Ми повинні використати цей приплив талантів і грошей та заохочувати більше зростання в цьому секторі."
 PHI_expand_airbases_desc:0 "Навіть якби наші союзники хотіли розгорнути авіацію на наших островах, або якби ми розвинули здатність виробляти її самостійно, у нас немає місця, щоб фактично базувати літаки! Ми повинні негайно розпочати створення нових аеродромів та злітних смуг, щоб літаки могли тут легше розміщуватися."
 PHI_grassroot_guerillas_tt:0 "Створює 3 бригади партизанських військ за кожен завершений необхідний фокус. Як місце розташування пріоритет матимуть звільнені регіони, а потім регіони з невеликою кількістю ворожих військ."
 PHI_offshore_patrol_desc:0 "Закон про національну оборону також містив положення про морський захист Філіппінського архіпелагу. Очікується, що це буде не повноцінний океанський флот, а скоріше флот, побудований навколо захисту наших рідних берегів. Це не означає, що це не може бути лише першим кроком до більш домінуючого флоту."
 PHI_philippine_air_force_desc:0 "Настав час визнати військово-повітряні сили окремою одиницею, відокремленою від армії. Так організовані, вони матимуть набагато більше гнучкості у своїй організації та придбанні людей і матеріальних засобів. Вони більше не будуть залежати від потреб одного виду військ, а натомість зможуть літати на службу всім."
 PHI_polynesia_tag_tt:0 "§Y[PHI.GetName]§! отримає новий прапор і назву."
 PHI_quezon_city_desc:0 "Маніла добре служила нам столицею, проте вона потерпає від серйозних проблем, таких як перенаселення, брак житла, погана санітарія та затори. Нам потрібне місто, яке з самого початку планувалося б як столиця. Хоча на його будівництво та розвиток підуть роки, якщо не десятиліття, ми повинні почати зараз, щоб пізніше пожинати плоди нашої далекоглядності!"
 PHI_rebuild_sakdalistas:0 "Відновити сакдалістів"
 PHI_reconciliation_with_spain_loser:0 "Хоча наші добровольці билися проти них, іспанський уряд неохоче визнав спільні культурні та теологічні зв'язки між нами і вважав за потрібне включити це у свою пропаганду, наголошуючи на глобальній іспаномовній єдності."
 PHI_reconciliation_with_spain_winner:0 "Наші добровольці, що билися разом з переможним іспанським урядом, зміцнили нові, сильніші зв'язки між нашими націями, і ми повинні спиратися на них у більш офіційній якості, щоб об'єднати наші нації в майбутньому."
 PHI_return_of_the_exiles_desc:0 "Низка важливих людей із лівими поглядами була змушена покинути свої домівки по всій Південно-Східній Азії під загрозою з боку колоніалістів та капіталістів. Ми могли б відкрити для них кордони і запропонувати безпечний притулок."
 PHI_second_philippine_republic:0 "Друга Філіппінська Республіка"
 PHI_smugglers_desc:0 "Наша нація складається з безлічі островів та острівців, що пропонують багатий вибір прихованих куточків і щілин, які наші люди поколіннями використовували для контрабанди товарів поза досяжністю офіційної влади. Ми повинні використати цей досвід і обернути його на нашу користь!"
 PHI_sugar_excise_general:0 "Фінансувати курси підготовки офіцерів із Цукрового фонду"
 PHI_support_for_chinese_communists:0 "Підтримка китайських комуністів"
 PHI_treaty_of_manila:0 "Манільський договір"
 PLAN_PREPARATION:0 "Бонус до атаки від підготовки плану: $VALUE|0Y%$ (максимум: $MAX|0Y%$)"
