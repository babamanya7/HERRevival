 ETH_disband_the_chitet_mission_desc:0 "Настав час розформувати Чітет і дозволити солдатам повернутися до цивільного життя."
 ETH_empower_the_chambers_desc:0 "Конституція 1931 року не зайшла достатньо далеко в кодифікації ролі імператора. Він також не належним чином залучав людей до процесу прийняття рішень урядом. Нам потрібно розширити повноваження Палати депутатів, надавши їм більший контроль над державними справами, зберігаючи при цьому священну роль Імператора."
 ETH_exploit_french_weakness_tt:0 "Відмикає рішення щодо окупації §YФранцузького Сомалі§!\n§RПрийняття цих рішень ризикує війною з Вішістською Францією!§!"
 ETH_humanitarian_aid_desc:0 "Ворогові байдуже, скільки страждань вони завдають нашому народу. Якщо так триватиме й далі, не залишиться країни, яку потрібно захищати. Світ повинен побачити жахи, які тут відбуваються, і ми повинні негайно надіслати гуманітарну допомогу."
 ETH_international_brigades_desc:0 "Настав час для Ліги Націй не лише скасувати заборону на надсилання сил для підтримки нас у нашій боротьбі, але й заохотити країни-члени виступити проти загарбників!"
 ETH_japanese_industrial_investments_decision:0 "Японські промислові інвестиції"
 ETH_liberate_SUD_tt:0 "Отримає ціль війни проти власників [SUD.GetAdjective]ої території."
 ETH_liberate_aussa:0 "Принести революцію в Афар"
 ETH_medium_fundraising_effect_tt:0 "£GFX_ETH_imperial_treasury Скарбниця: §G+15§!\n"
 ETH_military_advisors:0 "Радянські генерали"
 ETH_mytishchi-ababa_plant_desc:0 "Ми повинні використати наші тісні зв'язки з Радянським Союзом, щоб отримати досвід у виробництві побутової та військової техніки. Ідеальним механізмом для отримання таких знань був би проєкт спільного заводу, а з ким краще співпрацювати, як не з Митищинським машинобудівним заводом."
 ETH_offer_peace_UGA_tt:0 "Запропонувати власнику [UGA.GetAdjective]ої території мир, якщо він погодиться відмовитися від претензій на територію, яку наразі контролює [ETH.GetName]. [UGA.GetAdjectiveCap]а територія, яку наразі контролює [ETH.GetAdjective]а влада, стане [ETH.GetAdjective]ою маріонеткою."
 ETH_officer_reforms_centralized_BoP_tt:0 "Щоби гарантувати, що військові не підуть проти нашого режиму, ми мусимо забезпечити їхню лояльність, запровадивши посади політичних офіцерів."
 ETH_rapid_industrial_expansion_desc:0 "Незважаючи на героїчні зусилля людей на внутрішньому фронті, нам потрібна ще більша промислова потужність, якщо ми хочемо залишитися вільними від іноземної окупації. Тому ми будемо прискорювати темпи наших економічних планів і проводити ще більш швидке промислове розширення."
 ETH_recruit_mercenaries_desc:0 "Зараз в армії існує велика напруга між солдатами різного походження. Багато з них лояльні до старого режиму і їм не можна довіряти. Поки ми не викорінимо ці нелояльні елементи, нам потрібні сили, які безсумнівно лояльні до нас. Найпростіший спосіб завоювати лояльність — це холодна готівка."
 ETH_request_italian_equipment:0 "Попросити італійське оснащення"
 ETH_state_owned_industry_tt:0 "Змінити §Y$ETH_state_development_dynamic_modifier$§! на:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+20%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+20%§!"
