 NORDIC_ask_for_investment_to_nordic_desc:0 "Очевидно, що нам бракує капіталу, щоби зробити інвестиції, необхідні для нашого розвитку та можливого приходу до влади. Ми можемо попросити нашого північного сусіда, державу [FROM.GetName], влити частину свого капіталу в нашу країну для досягнення цієї мети. Звісно, вони будуть винагороджені за свою підтримку."
