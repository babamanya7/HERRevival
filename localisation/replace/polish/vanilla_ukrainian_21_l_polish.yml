 POL_KINGDOM_neutrality_DEF:0 "Королівство Польща"
 POL_KPP_focus:0 "Зібрати лівий кабінет міністрів"
 POL_LIT_SUPREMACY_LEAGUE:0 "Ліга панування Речі Посполитої"
 POL_ROM_UNION:0 "Польща-Румунія"
 POL_april_constitution_fas_1_desc:0 "$POL_april_constitution_fas_desc$"
 POL_armia_ludowa:0 "Armia Ludowa"
 POL_baltic_navy_desc:0 "Ніхто не пройде повз наші клинки, ніхто не висадиться на берегах Польщі чи її союзників. Балтійське море належить Польщі, і нікому іншому."
 POL_baltic_socialism:0 "Затвердити балтійський соціалізм силою"
 POL_battle_cruiser_2:0 "Клас «Cieszyn»"
 POL_central_defence_of_poland_idea_desc:0 "Ця країна зосереджується на будівництві укріплень та піхотного спорядження для швидкої мілітаризації своєї держави."
 POL_coastal_defense_desc:0 "Ми — маленька економіка з невеликою береговою лінією, тому модернізація нашого флоту має бути скромною. Есмінці — це дешевий і ефективний спосіб захистити свою берегову лінію, і ми повинні зробити ставку на них."
 POL_complete_the_bermontian_mission:0 "Завершити місію Бермондта"
 POL_defend_in_west_state_desc:0 "На заході знаходиться більша частина нашої промисловості, й дуже важливо, щоби ми захищали її від німців. Ми мусимо розробити місцеві оборонні стратегії на заході, якщо ми хочемо боротися з переважною кількістю на нашому кордоні."
 POL_dismantle_fascist_empires_desc:0 "Фашизм — це зараза для світу. Вони привласнюють мову класової боротьби, щоб налаштувати пролетаріат проти своїх товаришів по той бік кордону. Вони є заклятими ворогами КПП і повинні бути швидко знищені."
 POL_draw_closer_to_britain:0 "Зближенння з Британією"
 POL_eastern_conscripts_desc:0 "Багато хто у Східній Польщі радше ідентифікує себе українцем чи білорусом, аніж поляком, але їх треба переконати боротися! Хоча ми можемо знайти небагато тих, хто воював би за Польщу, серед них незліченна кількість тих, хто охоче взяв би до рук гвинтівку проти [SOV.GetAdjective]их військ!"
 POL_eliminate_socialist_parties_desc:0 "Соціалізм — це ідеологія, яка стрімко завойовує світ, але вона принципово несумісна з ідеалами влади Замку. Ліві протистоять нам як у формі аграрних і соціал-демократичних партій, так і у формі зрадницьких комуністичних партій. Соціалізм у всіх його формах не повинен бути прийнятий, а всі соціальні партії повинні бути заборонені заради подальшої стабільності та безпеки польської держави."
 POL_expand_polish_intelligence:0 "Розширити польську розвідмережу"
 POL_greater_polish_SSR:0 "Велика Польська РСР"
 POL_habsburg_events.1.b:0 "Ми відмовляємось."
 POL_habsburg_monarchist_militants:0 "Озброїти габсбурзьких бійців"
 POL_heavy_fighter_equipment_3:0 "PZL.65 Lis"
 POL_invite_greece_desc:0 "Напруженість у відносинах між Грецією і Туреччиною залишається сильною, і з можливим італійським вторгненням на горизонті, греки, безсумнівно, могли б отримати користь від нашого захисту."
 POL_invite_to_faction_tooltip:0 "отримає запрошення в альянс держави §Y[Root.GetFlag][Root.GetName]§!.\n"
 POL_invite_vauxhall_desc:0 "Британці довели, що їхня мотортзована техніка набагато швидша та якісніша на дорозі, ніж будь-яка інша у світі."
 POL_jet_fighter_equipment_2:0 "PZL.76 Sęp"
 POL_jet_tac_bomber_equipment_1:0 "PZL.70 Borsuk"
 POL_join_CZE_rails_desc:0 "Перевезення вантажів через Судетські гори — дорога та неефективна справа. Ми повинні об'єднати ключові ділянки наших залізниць, якщо ми хочемо захистити всю нашу нову державу."
 POL_king_of_bohemia_desc:0 "Монархічні настрої в Чехословаччині високі; все, що нам потрібно зробити, це заявити про свої претензії на богемський трон, і чеський уряд, без сумніву, піде назустріч нашим вимогам."
 POL_legion_of_merit_desc:0 "За задумом Валерія Славека, Легіон заслуг надавав би привілейоване становище громадянам республіки, які довели, що вони принесли велику користь державі. Ця нагорода гарантувала б особі місце в сенаті, і будь-яка особа, запрошена до Легіону, безумовно, не мала б підстав для невдоволення режимом."
 POL_military_youth:0 "$military_youth$"
 POL_modus_vivendi_desc:0 "Ліва санація шукає порозуміння з опозицією в нашій державі, надаючи їй владні місця в уряді. Якщо члени опозиції отримають належне представництво, вони більше не будуть намагатися протистояти диктатурі."
 POL_peasant_strike_category:0 "Селянське повстання"
 POL_polish_revanchism_desc:0 "Небагато націй втратили так багато за такий короткий час. Якщо є справедливість, ми її відновимо, так чи інакше."
 POL_political_commissars:0 "$political_commissars$"
 POL_pressure_for_the_west:0 "Тиснути на Захід"
 POL_reopen_the_maritime_and_colonial_league:0 "Відновлення Польської колоніальної ліги"
 POL_riot_of_37_desc:0 "Санація ніколи не погодиться мирно передати владу фалангістам, але вплив фалангістів зростає далеко за межами контролю Санації. Одна жорстока демонстрація у Варшаві може бути достатньою для того, щоб Фаланга отримала прямий контроль над країною."
 POL_sanation_left_opposition_4:0 "Дуже висока опозиція лівої санації"
 POL_ship_anti_air_1:0 "13.2mm/76 Hotchkiss MG"
 POL_sp_air_radar:0 "Кодова назва «Hejnał»"
 POL_sub_ship_engine_2:0 "«Sulzer» 4 740 к. с. н. в."
 POL_support_falangists_in_the_americas:0 "Підтримати американських фалангістів"
 POL_support_global_falangism:0 "Підтримати фалангізм у світі"
 POL_the_baltic_alliance:0 "Альянс із балтійськими державами"
 POL_the_baltic_alliance_desc:0 "Друзів багато не буває."
 POL_the_national_commonwealth_desc:0 "Стара Річ Посполита була імперією поляків, які керували великими землями і народами. З Литвою в наших руках Польська імперія відроджується знову!"
 POL_the_sanation_right_desc:0 "Послідовники Едварда Ридза-Сміглого, праві санаціоністи складаються переважно з генералів та високопоставлених військових. Будучи військовою силою санаційного уряду, праві мають усі шанси взяти уряд під свій контроль, але надання їм певних повноважень і поступок може забезпечити їхню подальшу лояльність і можливе включення до лав Замку."
 POPS_invalid-ISO-8601-format:0 "Формат дати неправильний"
 POPS_unsupported-account-details-keys:0 "Помилка клієнту (непідтримувані ключі)"
 POR_anglo_portuguese_alliance:0 "Англо-португальський альянс"
 POR_corpo_do_estado_maior_desc:0 "Військова реформа відновила Головний штаб армії (Corpo do Estado Maior) як елітний заклад для вивчення сучасної війни. Ми повинні інвестувати в нові потужності, щоб підвищити його ефективність."
 POR_food_industries_desc:0 "Для Португалії настав час зробити крок вперед і активізувати свою обробну промисловість. Ми можемо почати з розвитку харчових заводів у північній частині країни."
 POR_heavy_tank_equipment_3_short:0 "TP-III"
 POR_iberian_communism:0 "Іберійський комунізм"
 POR_metropolitan_army:0 "Армія метрополії"
 POR_neutrality_opinion_trade:0 "Торгові відносини"
 POR_overseas_provinces_desc:0 "Ми повинні розглянути можливість інтеграції наших заморських територій в Африці в нашу загальну адміністрацію."
 POR_portuguese_artillery_desc:0 "Польова артилерія життєво необхідна на сучасних полях битв. Ми повинні інвестувати в будівництво нових потужностей, які дозволять збільшити виробництво артилерійського озброєння."
 POR_potential_civil_war_low_requirement_tt:0 "§RЯкщо §Yстабільність§! буде нижча ніж §Y40%§! на момент завершення цього фокусу, в країні почнеться громадянська війна!§!"
 POR_repress_brazilian_monarchists_desc:0 "Ми повинні протистояти монархічному рухові, який набирає сили серед нашого населення. Ми повинні знайти винних у поширенні цих роялістських настроїв і публічно покарати їх."
 POR_second_navy_reequipment_desc:0 "Перший етап програми переоснащення ВМС завершився. Тепер ми маємо приступити до другого етапу, удосконалити наші морські верфі та відкрити тендер на купівлю ряду сучасних кораблів за кордоном."
 POR_sold_ships:0 "Продали кораблі"
 POR_subject:0 "$OVERLORDADJ$а $POR$"
 POR_submarine_1_desc:0 "The Portuguese Foca-class represented three small submarines built in Italy for the Portuguese Navy shortly after World War I. They were enlarged versions of the Italian Espadarte class and the sister ships of the Spanish A-class. They displaced only 260 tons and were armed with two 450mm torpedo tubes. All three ships were decommissioned by the mid-1930s."
 POR_super_heavy_tank_equipment_1:0 "Tanque Pesado IX"
 POR_the_communist_threat_desc:0 "Комуністи непомітно поширюють свої оманливі ідеали серед населення не лише в Португалії, а й у всьому світі. Ми повинні зосередитися на викоріненні цієї глобальної загрози, перш ніж вона пожирає нас зсередини."
 POR_the_iberian_socialist_union_annex_puppets_tt:0 "Кожна іспанська маріонетка буде анексована."
 POR_the_iberian_socialist_union_cores_tt:0 "Уся Іберія, а також Канарські та Балеарські острови стануть осердними землями §YІберійського соціалістичного союзу§!."
 PRC_28_bolshevik_faction_decision_enlai_diplomatic_feelers_desc:0 "Відправляючи Еньлая на допомогу [FROM.GetNameDef], ми можемо підвищити наш статус у [ROOT.GetFactionName]"
 PRC_anti_air_effort_desc:0 "Великі масштаби нашого повітряного простору ускладнюють забезпечення достатньої кількості літаків та інфраструктури для його повного покриття. Натомість можна розгорнути зенітні гармати для забезпечення захисту від атак з повітря, що є дуже економічно ефективним рішенням."
 PRC_appoint_chang_qiankun:0 "Призначити Чан Цянькуня"
 PRC_assume_leadership_tt:0 "Залежно від поточного значення §Y$PRC_communist_power_struggle$§!, §Y[ROOT.GetLeader]§! отримає різні риси.\nПоточний ефект:"
 PRC_aviation_infrastructure_desc:0 "Масштаби [ROOT.GetNonIdeologyName] означають, що для захисту нашого повітряного простору недостатньо мати багато літаків. Вирішальне значення матимуть аеродроми в правильних місцях, а також відстеження активності в нашому повітряному просторі."
 PRC_border_wars_cat:0 "Прикордонні конфлікти"
 PRC_consolidate_politcal_power_tt:0 "Зсуває §Y$PRC_communist_power_struggle$§! в бік лідера. Поточний ефект:"
 PRC_empower_the_guerillas_desc:0 "У міру того як наші партизанські сили набираються досвіду, ми можемо дозволити їм діяти незалежно. Це дасть можливість силам проникати ще далі та уникнути викриття, якщо наш зв'язок із ними буде перехоплено."
 PRC_expel_the_occupiers:0 "Вигнати окупантів"
 PRC_government_of_national_defense_desc:0 "Поділена країна легко впаде жертвою агресорів. Ми маємо почати координувати дії з націоналістами."
 PRC_halt_land_revolution:0 "Зупинити земельну революцію"
 PRC_infiltrate_uprising_effect_2:0 "Комуністи переймуть контроль над областю.\n"
 PRC_literacy_programs_desc:0 "Перший крок до сучасного суспільства — вжити заходів для того, щоб кожен громадянин усвідомлював поточні проблеми та міг взяти участь у їх вирішенні."
 PRC_military_intelligence_department:0 "Відділ військової розвідки"
 PRC_propaganda_efforts_desc:0 "Пропаганда є ключовою частиною вербування послідовників нашої революції, а також підтримки впевненості вже завербованих прихильників. Наша пропаганда навіть може бути використана нашими союзниками, коли вони закликатимуть своє населення захищати Китай."
 PRC_purge_the_radicals_desc:0 "Деякі члени партії досі дотримуються доктрини класової боротьби та протидії так званим експлуататорам. Їх потрібно позбутися."
 PRC_remove_chiang_kai_shek_desc:0 "Незважаючи на всі наші старання, генералісимус бачить у нас комуністів. Його протидія об'єднанню стає справжньою проблемою. Необхідно вжити заходів."
 PRC_remove_yulin_garrison_desc:0 "Попри всі наші зусилля знищити їх, 86-та і 84-та дивізії під командуванням Цзін Юесюя і Гао Гуйцзи зуміли відбити наші атаки і фактично зберегли північ провінції під контролем Гоміньдану. Ми повинні відправити туди підрозділи, щоб вибити гарнізон Юйліня з [1046.GetName]."
 PRC_root_out_guerilla_fighters:0 "Викорінити партизанів у [FROM.GetName]"
 PRC_rural_recruitment:0 "Вербування в селах"
 PRC_sea_peoples_liberation_army:0 "$PRC_peoples_liberation_army$"
 PRC_sea_proclaim_the_peoples_republic_desc:0 "$PRC_proclaim_the_peoples_republic_desc$"
 PRC_sea_rally_the_industry:0 "Мобілізувати промисловість"
 PRC_sino_allied_pact_of_non_aggression_accept_tt:0 "Вони підпишуть §YПакт про ненапад§! із §Y[ROOT.GetName]§!"
 PRC_socialist_market_economy_desc:0 "Шлях до соціалізму та комунізму за визначенням пролягає крізь капіталізм. Повноцінної ринкової економіки в Китаї ніколи не було, тому наступ соціалізму в поточній ситуації практично неможливий. Ми маємо створити капіталістичні методи виробництва, щоб отримати можливість рухатися далі."
 PRC_soviet_battle_tactics_desc:0 "Наслідуючи тактику [SOV.GetNameDef], ми можемо прагнути використовувати нашу власну порівнянну чисельну перевагу на свою користь. У нас буде команда офіцерів, якій доручено вивчити уроки досвіду [SOV.GetNameDef]."
 PRC_soviet_technological_cooperation:0 "Радянська технологічна співпраця"
