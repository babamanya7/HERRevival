 denmark_expansion_event.4.desc:0 "Сьогодні вранці ми отримали новини: [DEN.GetAdjective]ий уряд бажає, щоб ми передали йому права на державу [ICE.GetNameDef]. Він стверджує, що територія острова по праву є частиною території цієї держави."
 denmark_expansion_event.502.a:0 "Дуже прикро."
