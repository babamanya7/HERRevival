 NOR_fascist_militia_in_state_TT:0 "§GВи зможете викликати підрозділ ополчення в цій території, коли почнеться війна.§!"
 NOR_fund_local_construction_desc:0 "Ми не можемо дозволити, щоби наша індустріалізація була зосереджена в столиці та кількох інших великих містах. Прогрес повинен охопити всю державу [ROOT.GetName] настільки рівномірно, наскільки це можливо. Тож інвестуймо в малі та середні міста, аби простимулювати місцеве будівництво, щоби створити більш розмаїту промислову базу та міцнішу економіку."
 NOR_heavy_tank_equipment_3_short:0 "Stv. m/43"
 NOR_hoyre_long:0 "Права партія (Гьойре)"
 NOR_improved_weapons_desc:0 "Обладнання, яке використовують наші сухопутні сили, знаходиться в жалюгідному стані. Це неприйнятна кількість недбалості, яка може коштувати нашої незалежності. Ми повинні поспішити, щоб змінити цю тенденцію, поки ми можемо."
 NOR_join_the_allies:0 "Приєднатися до Союзників"
