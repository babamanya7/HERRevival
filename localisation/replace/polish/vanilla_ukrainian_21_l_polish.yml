 CHL_request_assistance_in_the_war:0 "Попросити підтримку у війні"
 CHL_requires_mex_states_tt:0 "Контролює всі §Yпідсвічені мексиканські землі§!"
 CHL_rule_by_decree_desc:0 "Під час свого першого президентства, з 1927 по 1931 рік, Ібаньєс правив за указом, користуючися диктаторськими повноваженнями. Тепер він мусить зробити це знову, щоби спрямувати країну в правильному напрямку."
 CHL_sell_arica_to_peru_desc:0 "Один із чудових способів отримати значний приплив коштів для вирішення економічних проблем — розпродати шматки землі, захоплені у перуанців і болівійців під час Тихоокеанської війни, і повернути їх назад."
