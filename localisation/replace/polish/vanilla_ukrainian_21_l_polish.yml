 COG_31e_brigade_parachutiste:0 "31-а парашутна бригада"
 COG_BEL_negotiations_ongoing_flag:0 "Переговори про незалежність Конго тривають"
 COG_appoint_a_royal_council_desc:0 "Король може знати багато, але не все. Тому йому потрібна королівська рада радників, яка допоможе йому в управлінні королівством."
 COG_approach_the_barotse_litunga_tt:0 "Коли війна за визволення почнеться, ми отримаємо 2 §YДивізії Бароце§!, а також отримаємо основне право на §Y[981.GetName]§!"
 COG_attempt_to_ally_the_portuguese:0 "Спроба укласти союз з [POR.GetAdjective]"
 COG_cancel_the_trade_deal_decision:0 "Скасувати конголезьку торгівлю ураном"
 COG_claim_the_great_lakes:0 "Претендувати на Королівства Великих Озер"
 COG_congolese_bussinessowners_desc:0 "Для того, щоб наше суспільство відновилося після багатьох років інституціоналізованого пригноблення та зробило кроки до більш справедливого суспільства, ми повинні почати заохочувати конголезьких громадян відкривати власний бізнес, сподіваючись, що вони зможуть увійти на ринок."
 COG_emergency_powers_for_pierre_ryckmans_desc:0 "Наша адміністрація повністю заблокована з моменту, коли зв'язок з урядом у Бельгії був перерваний. Тому ми повинні надати надзвичайні повноваження Рікмансу та Флещауверу, щоб ми могли діяти з більшою владою."
 COG_german_east_africa:0 "Німецька Східна Африка"
 COG_governor_general_pierre_ryckmans_desc:0 "Хоча міністри в [BEL.GetNameDef] мають багато планів для нашої держави, вони не єдині. П'єр Рікманс також має свою велику візію, і було б розумно використати його адміністративні знання для покращення стану нації."
 COG_kingdom_of_kongo_neutrality:0 "Королівство Конго"
 COG_prepare_for_offensive_action:0 "Підготуватися до наступальної операції"
 COG_scouting_the_terrain_desc:0 "Наші величезні джунглі ускладнюють пересування по нашій території, і до того ж важко помітити ворога до того, як він наблизиться занадто близько до наших важливих міст. Тому авіація повинна грати велику роль в наданні повітряної розвідки."
 COG_supply_line_disruption_tactics_desc:0 "Лінії постачання ворога можна перервати одним точним ударом. Це буде виконано нашими підводними човнами і стане важливою частиною будь-яких майбутніх воєн, в яких ми братимемо участь."
 COG_the_arme_populaire_de_liberation_desc:0 "Революційна армія повинна бути доступною для всіх і досить сильною, щоб захистити наших громадян. З цією метою нам потрібно створити нашу власну Народну армію визволення, щоб наші люди більше ніколи не мали боятися за свою безпеку!"
 COG_the_executive_council_desc:0 "Ми повинні домогтися більшої співпраці в межах Організації африканської єдності, створивши виконавчий орган, який буде діяти за волею народу і може оперативно реагувати на загрози стабільності в нашому регіоні."
