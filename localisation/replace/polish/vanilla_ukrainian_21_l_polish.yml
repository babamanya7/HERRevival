 spain.4.d:0 "Громадянська війна в Іспанії стала мікрокосмом наших поглядів на глобальну ситуацію: комуністи та ліберали прагнуть знищити старі цінності, а ми беремося за зброю, щоби відновити їх. Не дивно, що націоналісти в Іспанії звернулися до нас і ще кількох країн по оснащення для майбутнього конфлікту."
 spain.6.a:0 "Будемо сподіватися, вони стримають червоний терор."
