 GER_see_to_the_eastern_front_tt:0 "Додати 6 §Yназемних укріплень§! у 3 провінціях на східному кордоні.\n"
 GER_send_military_aid_desc:0 "Наші [CHI.GetAdjective]і друзі оточені ворогами. Ми маємо відправити їм боєприпаси й обладнання, щоб зміцнити їхню оборону й забезпечити їм цінність як союзника в майбутньому."
 GER_sharpen_air_safety_regulations:0 "Загострити правила безпеки в повітрі"
