 CHL_integrate_the_south_atlantic_islands_araucania:0 "Інтегрувати острови в південній Атлантиці"
 CHL_light_cruiser_1:0 "Клас «Chacabuco»"
 CHL_mapuche_party_long:0 "Кауполіканська спільнота захисників Арауканії"
 CHL_militarize_the_state_desc:0 "Хоча ми вже перемагали у великих війнах, наша країна наразі не готова до ще одного масштабного конфлікту. Тому ми мусимо в першу чергу мілітаризувати державу, якщо хочемо, щоби наші війська знову були готові до бою."
 CHL_news_events.6.t:0 "Затоплення судна «SS Tolten»"
 CHL_no_more_advisors_tt:0 "Більшість доступних наразі §Yрадників§! стане §Rнедоступна§!."
 CHL_political_events.10.desc:0 "[CHL.GetAdjective] лідер [CHL.GetLeader] офіційно звернувся до нас, вимагаючи вибачень, а також компенсації за затоплення чилійського вантажного судна «SS Tolten» минулого тижня. Він заявляє, що наш обов'язок — дотримуватися міжнародних стандартів та розмірковувати над нашими непристойними діями підводної війни."
