 imperial_conference_ends_tt:0 "Імперська конференція завершилася.\n"
 imperial_glory_goal_desc:0 "Ключові бастіони нашої імперії та імперій наших союзників мають вистояти. Зберігаючи контроль над володіннями по всій земній кулі під час війни, ми можемо показати світові, що залишаємося силою, з якою треба рахуватися."
 improved_encryption:0 "Зашифрування — циклічні перестановки"
 improved_heavy_shell:0 "Надважкий бронебійний снаряд"
 improved_rubber_processing:0 "Поліпшена переробка каучуку"
 improving_our_army_category_desc:0 "Якщо ми хочемо, щоби наша армія мала шанс протистояти велетневі, яким є Сполучені Штати, ми мусимо швидко її модернізувати."
 infantry_equipment_1_short:0 "Зброя I"
 infantry_offensive_desc:0 "Наступальний дух піхоти — ключовий фактор, що вирішує результат бою. Наші бійці мусять вести всіх за собою.\n\n"
 infiltrate_military_bribe_outcome:0 "Наш агент переконав військовослужбовця співпрацювати з нами за солідну матеріальну винагороду."
 infiltrate_military_ideological_supporter_outcome:0 "Наш агент зв'язався з кількома офіцерами, які більше не підтримують поточний [From.GetAdjective]ий режим."
