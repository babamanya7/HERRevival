 sp_naval_nuclear_torpedo:0 "Ядерна торпеда"
 sp_naval_rocket_launching_submarine_preference_b:0 "Надійність"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc:0 "Нам потрібно відповісти на нагальне питання: який спосіб найкраще гарантуватиме, що випущені з підводних човнів ракети дістануться наших ворогів?"
 sp_naval_submarine_carrier_preference_b:0 "Reinforced Structure"
 sp_naval_super_heavy_battleship_preference_b_a:0 "Швидкість"
 sp_naval_super_heavy_battleship_preference_c_b:0 "Протиторпедний захист"
 sp_naval_support_ships_preference_b_b:0 "Find the balance"
 sp_nuclear_engines_desc:0 "Двигуни, які можуть працювати вічно, — без потреби в дозаправці. Така є обіцянка атомної енергії. Обіцянка, до виконання якої, за словами наших інженерів, ми дуже близькі."
