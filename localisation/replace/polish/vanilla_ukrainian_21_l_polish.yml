 CHI_dai_lis_peoples_state_fascism_DEF:0 "Китайська народна держава"
 CHI_deal_with_the_shadow_elements:0 "Розібратися з тіньовими елементами"
 CHI_develop_the_hanyan_arsenal_desc:0 "Ханьянський арсенал вже давно забезпечує нас зброєю. Його розширення дозволить нам краще задовольняти наші потреби у майбутньому."
 CHI_eternal_revolution_desc:0 "Наші успіхи показали ефективність нашої системи над старими та іноземними ідеями. Революційний вогонь палає в серці кожного співвітчизника, і ми повинні використати це, щоб поширити революцію ще далі."
 CHI_expand_academica_sinica:0 "Розширити Академію Сініка"
 CHI_expand_academica_sinica_tt:0 "§Y$CHI_neglected_countryside$§!$research_speed_factor_tt$ становить [?CHI_neglected_countryside_academia_sinica_trigger|R%] або більше"
 CHI_expand_the_cooperatives_desc:0 "Кооперативи вразили нас своєю ефективністю, але вони все ще малі за масштабом і охопленням. Якщо ми надамо їм нашу мережу зв'язків, вони зможуть рости і множитися ще більше."
 CHI_focus_on_meritocratic_principles_tt:0 "Дозволяє вручну прибрати дух армії §YПершість Вампу§!"
 CHI_form_x_force:0 "Сформувати сили X"
 CHI_fund_the_naval_air_establishment_desc:0 "Поєднані переваги морської та повітряної переваги — це занадто цінний приз, щоб його ігнорувати. Розширення нашого морського повітряного крила зменшує ризик міжвідомчих збоїв у комунікації."
 CHI_give_falkenhausen_citizenship:0 "Надати фон Фалькенгаузену громадянство"
 CHI_great_ma_fascism_DEF:0 "the Ma Empire"
 CHI_heavy_tank_artillery_equipment_3:0 "PLZ 43 D"
 CHI_highlight_the_hanoi_decision_tt:0 "Поки ворог не контролює\n§Y-[325.GetName]\n-[671.GetName]§!,\nХанойський маршрут безпечний"
 CHI_hongxiang_force_desc:0 "Завдяки співпраці з нашими союзниками та колегами в авіації ми змогли створити внутрішню програму підготовки для військових парашутних операцій."
 CHI_improve_opium_modifiers_cg_trigger:0 "Фактор споживчих товарів незаконної торгівлі є позитивним"
 CHI_industrial_evacuations_remove_IC:0 "Будуть видалені всі §Yцивільні заводи§!.\n"
 CHI_infiltrate_the_examination_yuan_desc:0 "Держава керується не просто роботою небагатьох, а невтомною працею маси державних службовців. Якби ми змогли проникнути в організацію, яка перевіряє кваліфікацію цих працівників, ми могли б отримати велику користь для нашого руху. Якби ми могли переконатися, що працівники поділяють нашу позицію, це стало б нездоланною силою."
 CHI_land_value_tax_desc:0 "Податок на вартість землі — система одночасно стабільна та справедлива: вона дозволяє нам брати гроші в тих, у кого їх і так достатньо."
 CHI_leverage_contacts_desc:0 "Наші співвітчизники розсіялися по всьому світу, а дехто навіть прибув до Америки. У Сполучених Штатах наші контакти лише чекають, коли ми попросимо про руку допомоги."
