 SOV_recover_the_kuril_islands_decisions_tt:0 "\nЩойно [SOV.GetNameDef] візьме області §Y[537.GetName]§! та §Y[555.GetName]§!, ми зможемо прийняти рішення про укладення миру з державою [JAP.GetNameDef] (зі збереженням цих територій)."
