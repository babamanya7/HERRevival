 ENG_BSA_COMPANY_DESC_COMMUNIST:0 "Революційні заводи боєприпасів не виробляють достатньо стрілецької зброї, але, як і у Великій війні, ми могли би підписати контракт із Birmingham Small Arms Company та розширити її можливості."
 ENG_CAS_equipment_2:0 "Hawker Typhoon"
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "Наш новий підхід до внутрішньої політики і міжнародних відносин вимагає здорової армії для його підтримки. Готуючись до цього, ми мусимо почати розвивати нашу цивільну промисловість, щоб вона могла стати стабільним фундаментом для майбутнього розширення нашої військової промисловості в належний час."
 ENG_MEX_dominion_neutrality:0 "Домініон Мексика"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST:0 "Революційний арсенал у Вулиджі не спроможний виробляти так потрібні боєприпаси та піхотну зброю"
 ENG_STATE_771:0 "Північно-Східна Родезія"
 ENG_abdication_crisis_changed_mind:0 "Едуард VIII не одружився на Уолліс Сімпсон"
 ENG_anti_air_equipment_1_short:0 "QF 3-inch"
 ENG_battle_cruiser_1_desc:0 "Лінійні крейсери класу «Renown» спочатку були закладені як вдосконалені версії лінійних кораблів класу «Revenge». З початком Першої світової війни їх будівництво призупинили. Адмірал Лорд Фішер зумів відновити їх будівництво як лінійних крейсерів. Ці кораблі були квінтесенцією лінійних крейсерів. Вони були добре озброєні, швидкі та маневрені, але мали тоншу броню та меншу дальність дії. Лише два з початкових трьох кораблів, Repulse і Renown, були завершені."
 ENG_blackshirt_march_in_aberdeenshire_desc:0 "Тепер готується великий марш чорносорочників в Абердіні. Він, безперечно, приверне на наш бік місцеве населення."
 ENG_blackshirt_march_in_northern_england_desc:0 "Тепер готується великий марш чорносорочників у Північній Англії. Він, безсумнівно, приверне на нашу сторону місцеве населення."
 ENG_britain_demands_treaty_compliance_tt_1:0 "Частка §Yлінкорів§! й §Yавіаносців§! порівняно з державою §Y[ENG.GetName]§! — щонайбільше §Y100%§!.\n"
 ENG_cannot_increase_conscription_law:0 "Ви обіцяли профспілкам не збільшувати масштаб призову.\n"
 ENG_carrier_1:0 "Клас «Courageous»"
 ENG_chiefs_of_staff_committee:0 "Комітет начальників штабів"
 ENG_concessions_to_the_trade_unions_tt:0 "Відкриває доступ до рішень §Y$ENG_concessions_to_the_trade_unions$§!, які необхідно виконати для переходу на комунізм.\n"
 ENG_consolidate_the_british_isles:0 "Укріпити Британські острови"
 ENG_consolidate_the_british_isles_desc:0 "Ірландці продовжують обстоювати свої безглузді уявлення про незалежність, і нашій терпимості настав кінець. Настав час придушити їхній опір і повернути всю країну в лоно Сполученого Королівства як невід'ємну частину."
 ENG_cv_CAS_equipment_3_short:0 "Sea Fury"
 ENG_cv_fighter_equipment_0:0 "Hawker Nimrod"
 ENG_enforce_the_naval_treaties:0 "Примусити дотримання морських угод"
 ENG_heavy_cruiser_2_desc:0 "Важкі крейсери типу «Surrey» були запропоновані в рамках військово-морської програми 1928 року. Вони були вдосконаленими версіями попередніх важких крейсерів типу «York». Якби вони були завершені, вони були оснащені чотирма подвійними 8-дюймовими гарматними турелями, важчою бронею та потужнішими двигунами. Було замовлено два кораблі, але жоден не був закладений."
 ENG_imperial_federation_desc:0 "Імперську федерацію вже давно розглядають як альтернативу самоврядуванню. Після тривалого періоду підготовки нарешті настав час об'єднати наш уряд із урядами наших домініонів і відновити нашу позицію провідної світової наддержави. Хай живе Британнія!"
 ENG_imperial_federation_unified_communism_ADJ:0 "Співдружн"
 ENG_imperial_federation_unified_neutrality:0 "Імперська федерація"
 ENG_imperialist_australia_neutrality_DEF:0 "Імперіалістично-австралійськ"
 ENG_light_tank_artillery_equipment_2_short:0 "Priest"
 ENG_light_tank_equipment_2:0 "Matilda"
 ENG_mechanized_equipment_2_short:0 "Universal Carrier"
 ENG_medium_tank_destroyer_equipment_3:0 "Contentious"
 ENG_replace_government_communism_tt:0 "Залишиться маріонеткою після завершення деколонізації.\n"
 ENG_replace_government_in_british_raj_fascism_desc:0 "Народ Індії готовий змінити уряд на... більш прихильне до нашого фашистського правління."
 ENG_sp_naval_nuclear_submarine:0 "Програма «HMS Dreadnought»"
 ENG_sub_ship_nuclear_engine_1:0 "Pressurized Water Reactor 1"
 ENG_submarine_4_desc:0 "Підводні човни класу «V», або «Vampire», базувалися на попередніх човнах меншого розміру класу «U». Вони були більші, але все ще відносно малі, з кращими морськими можливостями, але обмеженою дальністю дії та озброєнням."
 ENG_super_heavy_tank_destroyer_equipment_1_short:0 "Iron Duke"
 ENG_support_imperialist_coup_in_new_zealand_mission_1_desc:0 "Імперські лоялісти підбурюють до заколоту! Якщо їм це вдасться, вони повалять всю країну в безодню громадянської війни!"
