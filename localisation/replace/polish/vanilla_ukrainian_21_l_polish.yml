 USA_protect_south_america_desc:0 "Південна частина нашого подвійного континенту, щойно її відкрили, стала пісочницею для великих імперій. Час комусь проявити ініціативу і зробити так, щоби народи цих країн жили в мирі й ішли у світліше майбутнє."
