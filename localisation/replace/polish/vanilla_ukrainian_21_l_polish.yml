 SOV_the_head_of_the_nkvd_yezhov_desc:0 "Нинішній голова НКВС $SOV_genrikh_yagoda$ перебуває у дружніх стосунках із багатьма представниками правої опозиції. не повинно бути неможливо переконати його, що шлях, який ми обрали, є правильним для цієї країни."
 SOV_the_komsomol_desc:0 "Ми будуємо соціалізм не для сьогоднішніх дорослих, ми будуємо його для дітей і поколінь, які ще не народилися. Їх треба навчити, як удосконалювати і розвивати досягнення, які ми зробимо, щоб вони могли завершити розпочату нами справу. Ми мусимо створити спеціальну молодіжну організацію, яка не лише виховає їх, але й навчить, як бути добрими, комуністичними членами суспільства."
 SOV_the_means_to_wage_war_desc:0 "У той час як літаки, гармати і танки в армії часто привертають найбільшу увагу і найкраще виглядають на парадах, звичайний солдат набагато більше дбає про якість своєї гвинтівки і зручність черевиків. Ми мусимо визнати, що ці речі є щонайменше такими ж важливими для ведення війни, як винищувач або важка гаубиця."
 SOV_the_plan_for_the_coup:0 "Спланувати переворот"
 SOV_the_power_of_the_peasantry:0 "Влада селянства"
 SOV_the_power_of_the_peasantry_desc:0 "У той час як марксистська ортодоксія вбачає революційний потенціал у промислових робітниках, у нашій країні очевидно, що основну його частину становлять селяни. Ми повинні просвіщати мільйони селян і розвивати їхню класову свідомість, щоб вони були готові захищати революцію, коли вона буде під загрозою."
