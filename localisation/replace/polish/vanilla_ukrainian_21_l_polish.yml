 SPA_cultivate_fanaticism_desc:0 "Найбільш чудовими рисами карлістського солдата є його наполегливість і непохитна рішучість перед обличчям небезпеки й труднощів, усвідомлюючи, що Бог винагородить їх за їхній обов'язок, якщо вони впадуть. Цю самовідданість і жертовність загиблих слід вважати прикладом для всіх новобранців."
