 bba_news.0.t:0 "Кінець Ліги Націй"
 bba_news.107.b:0 "Божі дороги годі збагнути."
 bba_news.110.t:0 "[FROM.GetName] занурюється у громадянську війну!"
 bba_news.4.desc:0 "Члени армії й антифашистської організації, відомої як Чорні леви, влаштували переворот проти імперського уряду Хайле Селассіє. Імператор приїхав на обстеження військ, коли ті напали на нього та взяли його під арешт.\n\nТим часом у столичному місті [ROOT.Capital.GetCapitalVictoryPointName], Чорні леви захопили ключову інфраструктуру міста, в тому числі взявши резиденцію імператора. Багато лоялістів із армії та поліції полягло в дрібних сутичках, а залишки держави тепер під контролем прокомуністичного тимчасового уряду.\n\nПереважна більшість населення, виснажена війною з державою [ITA.GetName], просто змирилася з пануванням свого нового уряду."
 bba_news.7.desc:0 "Ширяться чутки, що анексія держави [AFA.GetNameDef] [ITA.GetAdjective]ими військами неминуча. Останніх нещодавно бачили на кордоні цієї ізольованої держави і, якщо вірити деяким джерелам, [ITA.GetNameDef] застосовує дипломатичний тиск на уряд міста [AFA.Capital.GetCapitalVictoryPointName], щоби досягти капітуляції без кровопролиття. Ще не ясно, чи зможе [AFA.GetLeader] опиратися [ITA.GetAdjective]ому тиску, але ситуація видається похмурою."
 belguique_toujours:0 "Бельгія завжди"
 betrayed_alliance:0 "Зрадили альянс"
 bftb_bulgaria_british_influence.2.desc:0 "[FROM.GetAdjectiveCap]ий уряд погодився підписати договір, який запропонував їм [BUL.GetLeader], і гарантувати незалежність нашої країни. Ми сподіваємося, що в майбутньому відносини між нами стануть ще міцнішими."
 bftb_bulgaria_equipment_purchases.2.t:0 "Закупити [FROM.FROM.GetAdjective]у військову техніку"
 bftb_bulgaria_factions.83.desc:0 "Захоплення лідерів націонал-соціалістичного руху пройшло успішно. Заарештовано більшість важливих постатей, включаючи самого Олександра Цанкова. Від такого удару організація навряд чи оговтається."
 bftb_bulgaria_german_influence.2.t:0 "[BUL.GetNameDefCap] приймає нашу допомогу"
 bftb_bulgaria_german_influence.7.b:0 "Нехай [GER.GetLeader] шукає інші способи."
 bftb_bulgaria_german_influence.9.t:0 "[BUL.GetNameDefCap] відхиляє наш запит на право проходу військ"
 bftb_bulgaria_italian_influence.1.a:0 "[ITA.GetNameDef] виграє від цієї угоди."
 bftb_bulgaria_tsar_boris.1.b:0 "Цей вечір вони запам'ятають надовго!"
 bftb_bulgaria_yugoslavian_influence.1.a:0 "Договір вигідний обом країнам!"
 bftb_bulgaria_yugoslavian_influence.1.b:0 "В даний час такий договір не в наших інтересах."
 bftb_greece.10.a:0 "Будуть тільки [FRA.GetAdjective]і представники? Час швидше з цим закінчувати."
 bftb_greece.179.a:0 "Oui, ми можемо вкласти невелику суму."
 bftb_greece.190.b:0 "Ні, цього разу ми не будемо робити інвестиції..."
 bftb_greece.236.a:0 "Ми все одно підемо далі."
 bftb_greece.32.a:0 "Ми мусимо підкоритися."
 bftb_greece.47.desc:0 "Мало кого з радників здивувало, що [FROM.GetAdjective]і війська змогли відтіснити наші війська на півночі, але розчарування це не применшує. [FROM.GetAdjectiveCap]і сили не припинили наміри на кордоні теренів області [354.GetName]: ми отримуємо доповіді про масштабні пересування військ біля наших кордонів і навіть повідомлення про [FROM.GetAdjective]их солдатів, що переходять демаркаційну лінію в державі [800.GetName]. Це означає одне: вторгнення. Ми мусимо готуватися до гіршого."
 bftb_greece.50.t:0 "Король розпускає еллінський парламент!"
 bftb_greece.91.b:0 "Закривайте центр."
 bftb_news.206.t:0 "Народження Середземноморського пакту"
 bftb_turkey.11.a:0 "Світ має боятися могутності держави [SOV.GetNameDef]."
 bftb_turkey.115.desc:0 "Напруга в області [TUR_fundamentalist_state.GetName] між релігійними фундаменталістами та урядом досягла точки кипіння. Фундаменталісти вимагають влади і права жити за власними законами. Це вже зовсім не мирні протести та беззубі гасла, з яких все починалося. \n\n[TUR_fundamentalist_state.GetName] виходить із-під нашого контролю, хай як болісно це визнавати, якщо ми дамо регіону автономність, це принаймні втихомирить бунтівників, і [TUR_fundamentalist_state.GetName] перестане бути проблемою. цьому дуже нагадують державну зраду..."
 bftb_turkey.119.desc:0 "Політика прозорого діалогу і спілкування з активним населенням окупилися сповна. [TUR_fundamentalist_state.GetName] більше не страждає від намірів радикалів — місцеве населення просто вигнало їх геть. Напруга нікуди не поділася, але, судячи з настрою лідерів громадської думки, вона більше не йде врозріз із політикою нашого уряду."
 bftb_turkey.12.desc:0 "[SOV.GetLeader] особисто зателефонував нам. [TUR.GetLeader] прийняв дзвінок і вислухав висловлене з холодною ввічливістю побажання налагодити стосунки та похвалу [TUR.GetAdjective] президенту за внесок у боротьбу з імперіалізмом. [SOV.GetAdjective] солдатам наказано знизити інтенсивність дій на [SOV.GetAdjective]ому кордоні. [SOV.GetNameDef] відкликає свої скарги про захоплення Турецьких проток державою [TUR.GetName]. за незалежність зовсім не тішила перспектива нового великого конфлікту, зітхнув із полегшенням, коли [TUR.GetLeader] оголосив нації, що в результаті переміг мир і завдяки відвазі [TUR.GetAdjective] народу за часів кризи [TUR.GetAdjective] суверенітет затверджений остаточно."
 bftb_turkey.14.a:0 "Боротьба на майбутніх виборах йтиме за серця жителів держави [TUR.GetName]"
 bftb_turkey.17.b:0 "Така співпраця може принести свої плоди в майбутньому!"
 bftb_turkey.23.a:0 "Звісно ж ми підпишемо цей пакт про дружбу!"
 bftb_turkey.30.b:0 "Ми запропонуємо промислову компенсацію."
 bftb_turkey.32.b:0 "Ми не віддамо ні п'яді землі! Ні зараз і ніколи!"
 bftb_turkey.39.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 bftb_turkey.4.t:0 "[TUR.GetNameDef] захоплює контроль над Босфором!"
 bftb_turkey.6.desc:0 "[SOV.GetAdjectiveCap]ий уряд випустив різку заяву з завуальованими натяками на майбутні наслідки і покарання за порушення миру, але віч-на-віч з нашими офіційними особами запевнили, що жодних заходів у відповідь держава [SOV.GetNameDef] У ньому він оголошував те, що сталося великою перемогою держави [TUR.GetNameDef] Уряд всіляко підтримав цей захід, і тепер можна чекати повсюдних святкувань."
 bftb_turkey.61.desc:0 "[ROOT.GetLeader] вимовив невелику промову в Антак'ї, заявивши, що [ROOT.GetNameDef] з радістю приймає жителів Хатаю до свого складу, і з вдячністю зазначивши, що [FROM.GetLeader], лідер держави [FROM.GetNameDef], поважає демократичну волю хатайського народу. Хоч сирійські офіційні особи зустріли цю заяву з люттю, об'єднання Хатаю і держави [ROOT.GetNameDef] було радісним, і багато [ROOT.GetAdjective]их громадян вирушили зі своїх будинків до регіону, щоби привітати новоявлених земляків з приєднанням до держави [ROOT.GetNameDef] і обмінятися подарунками. це лише тимчасово, і так чи інакше Хатай у майбутньому повернеться до них."
 bftb_turkey.72.desc:0 "[FROM.GetAdjectiveCap]а верхівка вирішила оголосити, що підтримує наш уряд. Такі оголошення дуже важливі для закріплення нашого суверенітету та легітимізації нашої ролі як окремої нації всупереч [ENG.GetAdjective] імперіалізму."
 bftb_turkey.8.b:0 "Підтримка [SOV.GetAdjective] територіальних претензій — невелика ціна за збереження світу!"
 bftb_turkey.90.a:0 "Іх звільнення нарешті відбулося."
