 WW_hungary.1.desc:0 "Наш угорський союзник ініціював програму спільного розвитку літаків у нашому альянсі, і таким чином почав інвестувати в наш розвиток авіації, щоб у майбутньому розвивати власну."
 WW_hungary.10.a:0 "У них щось не в порядку з головою..."
 WW_hungary.10.t:0 "[FROM.GetNameDefCap] відмовляється від нашого захисту"
 WW_hungary.103.a:0 "Відступити та зробити Салаші лідером"
 WW_hungary.113.desc:0 "Керівництво [FROM.GetNameDef] публічно заявило, що результати референдуму в [664.GetName] сфальсифіковані, а спостерігачі мали явну прихильність до [ROOT.GetAdjective] уряду."
 WW_hungary.20.desc:0 "[HUN.GetAdjective] уряд посилив тиск щодо Карпатської Русі, стверджуючи, що вона раніше належала Угорщині під час Імперії, а отже має бути повернена. Вони вважають, що Гуцульська Республіка та всі наступні держави в регіоні є нелегітимними, і цю несправедливість можна виправити лише поверненням регіону під [HUN.GetAdjective] контроль."
 WW_hungary.25.t:0 "[From.GetNameDefCap] відмовляється від наших вимог"
 WW_hungary.30.t:0 "Мала Антанта вимагає обіцянок миру"
 WW_hungary.42.a:0 "Захистимо наше майбутнє разом!"
 WW_hungary.53.desc:0 "Дегенеративне керівництво [FROM.GetNameDef] не погодилось скласти повноваження. Ми скинемо їх і посадимо Карла Пія на трон — хочуть вони того чи ні!"
 WW_hungary.70.t:0 "[FROM.GetNameDefCap] приймає Габсбурзького монарха"
 WW_hungary.77.desc:0 "Хоч це й не стало несподіванкою, нерозумний [FROM.GetLeader] із [FROM.GetNameDef] привів свої війська у бойову готовність після отримання нашого ультиматуму та надіслав посланника з заявою, що вони не поступляться ні кроком у цій суперечці."
 WW_hungary.87.t:0 "[FROM.GetNameDefCap] хоче приєднатися до нашої фракції"
