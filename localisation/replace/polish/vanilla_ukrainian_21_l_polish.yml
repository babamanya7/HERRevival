 TUR_super_heavy_tank_equipment_1_short:0 "İzdiham"
 TUR_the_fading_father_category_desc:0 "Батько Турків, Мустафа Кемаль Ататюрк, хворіє все частіше. Ми мусимо прийняти сумну реальність, в якій наш месія та батько-засновник країни може і не побачити, як [ROOT.GetNameDef] переживе нинішню світову кризу. \n\nТе стан здоров'я Ататюрка: [ROOT.GetAtaturkHealthBar].\n"
 TUR_the_mediterranean_entente:0 "Середземноморська Антанта"
 TUR_the_red_apples_of_sevres_desc:0 "Париж, Рим, Лондон — це kızıl elma («червоні яблука») відновленої Османської імперії. Ми підемо на все, щоби наші старі вороги, які прагнули нашого роз'єднання, приниження та знищення, були осоромлені та зламані за те, що планували зробити з нашою країною. Ми спалимо старий світовий порядок і створимо новий світ на останках їхніх загиблих імперій."
 TUR_united_against_imperialism_tt:0 "Зміна популярності демократії або нейтралітету в країн §YБалканського пакту§!: §G+10%§!.\n"
