 GER_czech_friend:0 "Подружитися з Чехословаччиною"
 GER_danubian_expansion_desc:0 "Нам потрібно поширити свій вплив на балканські держави, які можуть стати жертвою [SOV.GetAdjective] агресії. Ми запропонуємо членства в союзі, що залишилисяпридунайським націям, і захист від загрози, яку несе [GER.GetDanubianMembershipDesc]."
 GER_danzig_for_guarantees_desc:0 "Польща, поза сумнівом, теж усвідомлює загрозу з боку [GER.GetDanzigGuaranteesBolsheviksDesc]. Можливо, нам вдасться дійти згоди: повернення Данцига, Познані та Сілезького воєводства в обмін на гарантію військової допомоги у разі вторгнення [GER.GetDanzigGuaranteesRedsDesc]."
 GER_demand_the_return_of_southern_jutland_desc:0 "Власність на герцогство Шлезвіг завжди була предметом суперечки з Данією. Після Першої світової, попри те що ми не брали в ній участі, Антанта віддала Північний Шлезвіг Данії. Ми маємо виправити цю історичну несправедливість."
 GER_denazification_campaigns_desc:0 "Щоб повністю очистити Німеччину від нацистської зарази, ми повинні активно викривати та заарештовувати нацистів і їх прихильників."
 GER_destroyer_4_desc:0 "Хоча перший прототип дизельного есмінця («Zerstörer 1942») не був завершений, розробка цього типу кораблів тривала. Було зроблено кілька пропозицій, які врешті-решт призвели до проєкту «Zerstörer 1944». На додачу до важкого головного озброєння, кораблі мали збільшене у порівнянні з попередниками зенітне озброєння, в тому числі нову 5,5-см артилерійську установку ППО."
 GER_division_france_mech_tt:0 "§YМеханізована§! частина §YSS-Division Charlemagne§! and the §Ymechanized SS-Division Bretagne§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_employ_philipp_holzmann_desc:0 "Альберт Шпеер висунув ідею найняти Philipp Holzmann AG для кількох великих будівельних проєктів, які фюрер хотів би здійснити. Компанія має гарну репутацію та довгу історію, побудувавши такі архітектурні шедеври, як Гамбурзька ратуша та первісний Райхстаг. Вони добре підійдуть для наших потреб!"
 GER_establish_volkskommissariats:0 "Створити фолькскомісаріати"
 GER_establish_western_grand_duchies_desc:0 "Як це передбачалося в вересневому плані, ми повинні спробувати встановити наш контроль над західними регіонами, створюючи клієнтські держави, розділяючи кордони на свій розсуд."
