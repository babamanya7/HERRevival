 GER_stasi:0 "Stasi"
 GER_stop_progress_on_advisor_focus_tt:0 "§Y$CHARACTER$§! припиняє працювати над фокусом §Y$FOCUS$§!."
 GER_strategic_air_effort_desc:0 "Перемоги можна досягти, знищивши ворожу промисловість. Нам потрібно зосередити наші сили на розробці та виробництві стратегічних бомбардувальників."
