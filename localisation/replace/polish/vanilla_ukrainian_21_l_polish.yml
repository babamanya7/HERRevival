 SCO_BEL_autonomy_eu_member_ADJ:0 "Шотландськ"
 SCO_HOL_autonomy_eu_member_DEF:0 "Європейська Шотландія"
 SCREENING_TOOLTIP_BONUSES_CAPITAL:0 "Ваша ефективність прикриття дасть ось ці бонуси вашій §Yавіаносній групі§!:\n"
 SEA_PHI_political_events.21.desc:0 "Чудові новини! Президент [USA.GetLeader] призначив генерала Дагласа МакАртура командувати Збройними силами США на Далекому Сході. Ми добре знайомі з МакАртуром, оскільки після виходу на пенсію він діяв тут як військовий радник протягом кількох років, і його призначення та повернення на регулярну службу є вірним знаком того, що [USA.GetNameDef] серйозно ставиться до своєї відповідальності за нашу оборону. \n \nПісля прибуття до Маніли він негайно взявся за забезпечення ресурсів від [USA.GetNameDef] і особисто пообіцяв стояти пліч-о-пліч з нашим хоробрим філіппінським народом проти будь-якого вторгнення до самого кінця."
 SEA_PHI_political_events.40.b:0 "Шеф поліції Айзенгауер втрутиться!"
 SEA_PHI_political_events.56.t:0 "[FROM.GetName] просить контроль над Тихоокеанським флотом"
 SEA_PRC_faction_events.50.a:0 "Ні, [FROM.GetLeader] не заслуговує на довіру!"
 SEA_PRC_faction_events.81.desc:0 "Ультиматум відхилено. У зухвалому акті непокори [FROM.GetLeader] дав зрозуміти, що його народ не підкориться. Оскільки наших посланців відіслали, дипломатія поступиться місцем війні."
 SEA_PRC_fourth_army_incident.3.b:0 "Можливо, вони мають рацію"
 SEA_PRC_misc_events.12.desc:0 "Намагаючись убезпечити свій східний кордон, [SOV.GetNameDef] підписав «пакт про нейтралітет» з [JAP.GetNameDef]. Це, однак, означає, що [JAP.GetNameDef] отримає розв'язані руки для експансії в Азії, не турбуючись про втручання [SOV.GetAdjective]ої влади."
 SEA_PRC_misc_events.14.desc:0 "Наша делегація до [FROM.GetNameDef] повернулася з чудовими новинами! Наше прохання до [FROM.GetLeader] передати наші законні маньчжурські території було задоволено. [ROOT.GetLeader] розсипався в похвалах як [FROM.GetLeader], так і нашим дипломатам за досягнення цього результату."
 SEA_PRC_political_events.21.t:0 "[FROM.GetName] хоче, щоб $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ стали їхніми радниками"
 SEA_PRC_political_events.3.desc:0 "Наша місія до [FROM.GetNameDef] була успішною: вони пообіцяли захистити нас від будь-яких загроз, з якими ми можемо зіткнутися. Цей захист має дозволити нам зосередитися на довгострокових цілях, таких як розвиток [ROOT.capital.GetName] — справа, яка інакше була б поставлена під загрозу через потенційну необхідність чергового тактичного відступу."
 SEA_PRC_request_aid.1.t:0 "[FROM.GetName] просить зброю"
 SEA_PRC_request_aid.2.t:0 "[FROM.GetName] надсилає допомогу"
 SEA_PRC_zhang_guotao_events.3.desc:0 "Нарешті Великий похід для $PRC_zhang_guotao$ та Четвертої фронтової армії завершився — вони прибули відносно неушкодженими до наших базових районів. Опитування вже почалися, але Готао ще не відмовився від своїх претензій на лідерство. Натомість він стверджує, що підтримує те, що необхідно зробити, щоб допомогти виграти майбутню боротьбу, не уточнюючи, що він має на увазі під цим. [Root.GetLeader] має провести подальші засідання Політбюро, щоб розібратися з цим безладом."
 SEA_china.10.b:0 "Ми не можемо цього прийняти"
 SEA_china.14.desc:0 "У своєму відчаї задобрити [JAP.GetNameDef], центральний уряд запропонував їм сюзеренітет над нами. Це ганебний вчинок. Ми не очікували такої зухвалості від нового уряду."
 SEA_china.21.desc:0 "[FROM.GetNameDefCap] відмовляється скасувати Договір дев'яти держав, посилаючись на крихкий баланс сил у Тихому океані. Ця образа обурила б будь-яку смертну людину, але часи імперіалістичних маріонеток минули. Ми повинні вирішити, чи посилити тиск, чи відступити з дипломатичної арени."
 SEA_china.23.a:0 "Ми не дозволимо себе залякати"
 SEA_china_democratic.16.desc:0 "Промисловці, що належать до [FROM.GetNameDef], почали розвивати нашу місцеву промисловість і створювати нові корпорації в межах наших кордонів. Це неодмінно наблизить нас до процвітання."
 SEA_china_improvement.2_tt:0 "Негативний ефект від §Yнезаконної торгівлі§! зменшуватиметься кожні 6 місяців"
 SEA_china_warlords.6.desc:0 "У відкритій непокорі центральному уряду [FROM.GetLeader] відхилив ультиматум. [FROM.GetNameDefCap] залишається номінальним підданим, але їхні дії свідчать про прагнення до незалежності. Ця непокора не може залишитися без відповіді."
 SEA_generic_events.11.t:0 "[GetOppositionPartyAdjective] докери оголошують страйк"
 SEA_generic_events.12.t:0 "[GetOppositionPartySupportersName] виступають проти оборонних заходів"
 SEA_generic_events.7.t:0 "[GetOppositionPartyName] організовує великий мітинг"
 SEA_generic_events.8.t:0 "[GetOppositionPartySupportersName] залучені до вуличних сутичок"
 SEA_imperial_influence_events.300.desc:0 "Дзайбацу намагалися посилити свій вплив на [GetImperialInfluenceRulerTitle], але через свої недоліки їм це не вдалося. Через це вони втратили обличчя, а отже, і престиж, що означає зменшення їхнього впливу."
 SEA_imperial_influence_events.500.desc:0 "[ROOT.GetLeader] щойно отримав листа, підписаного штабом флоту, з вимогою розпочати підготовку до повномасштабного впровадження доктрини «Південного удару». Вони стверджують, що їхня потреба в ресурсах, які можна знайти в Ост-Індії, досягла критичної межі. Звісно, їх можна просто проігнорувати, але, можливо, було б нерозумно змушувати їх чекати."
 SEA_japan_air_accidents_events.02.a:0 "Його честь захищено"
 SEA_japan_foreign_policy.106.a:0 "Ми змушені змиритися з ситуацією"
 SEA_japan_foreign_policy.124.b:0 "Це суперечитиме нашим принципам нейтралітету..."
 SEA_japan_foreign_policy.140.desc:0 "[MAN.GetLeader] has requested that we merge other Chinese puppet governments with [MAN.GetNameDef], ending their autonomy and giving their lands to the [MAN.GetAdjective] government. Do we accept this proposal?"
 SEA_japan_foreign_policy.22.t:0 "Помічено підозрюваних [FROM.GetAdjective]их агентів"
 SEA_japan_foreign_policy.23.desc:0 "[FROM.GetAdjective]і агенти почали поширювати паназійську пропаганду по всій Лхасі та контрабандою ввозити кошти, щоб схилити місцевих дворян на свій бік. Схоже, ситуація незабаром може вийти з-під контролю..."
 SEA_japan_foreign_policy.30.t:0 "Кінець Суйюаньської кампанії"
 SEA_japan_foreign_policy.46.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 SEA_japan_foreign_policy.60.b:0 "Ми повинні приєднатися до них, процвітання вже близько!"
 SEA_japan_foreign_policy.71.desc:0 "Дурні в Москві відмовилися капітулювати перед нашими початковими вимогами. Це вимагає повного знищення їхньої держави та ще більших змін кордонів, ніж планувалося спочатку!"
 SEA_japan_foreign_policy.76.t:0 "[FROM.GetNameDefCap] вимагає повної інтеграції"
 SEA_japan_popup_events.24.desc:0 "Останні залишки Імперської армії в Метрополії викинули білий прапор, знаменуючи кінець багаторічного конфлікту, що вирував між урядом нашої країни та її власними військовими. Значна частина нації постраждала від бойових дій, але це сигнал про новий початок для [ROOT.GetAdjective]ого народу. За кордоном наш ворог все ще чигає, але зараз час для відновлення. Уряд вже склав плани щодо організації перших загальних виборів, тепер, коли корумповані елементи більше не можуть втручатися."
 SEA_japan_popup_events.40.a:0 "Ми не можемо продовжувати підтримувати їхню війну нашими матеріалами!"
 SEA_japan_popup_events.40.desc:0 "Поки [JAP.GetNameDef] стрімко розширюється в Азії, окуповуючи своїх сусідів і спустошуючи їхні нації, наша промисловість і природні ресурси продовжують підтримувати їхню економіку і надходити на їхні заводи, щоб перетворитися на зброю війни. Наші люди стають дедалі критичнішими до цього і вимагають вжити заходів. Що нам робити?"
 SEA_japan_popup_events.41.desc:0 "Обґрунтовуючи своє нерозважливе рішення нашою помірною експансією та умиротворенням наших ворогів, схоже, що войовничі [FROM.GetAdjective]і громадяни змусили [FROM.GetLeader] з [FROM.GetNameDef] накласти на нас ембарго. Вони вирішили, що торгівля між нашими країнами більше не веситиметься, що є явним порушенням їхнього нейтралітету щодо нас..."
 SEA_japan_popup_events.45.desc:0 "Після краху офіційного командування японської армії та громадянської війни, що вибухнула в Метрополії, японський протекторат, відомий як Автономний уряд Східного Хебею, що лежить на нашому південно-західному кордоні, тепер залишається беззахисним. Настав час завдати удару і забрати його, поки [JAP.GetAdjective]ий уряд має занадто багато інших проблем, щоб турбуватися про те, що відбувається на континенті."
 SEA_japan_popup_events.48.t:0 "[ROOT.GetLeader] оголошує національний надзвичайний стан"
 SEA_warlords.1.desc:0 "Зі смертю Лю Сяна і постійно зростаючим тиском з боку Центрального уряду стає дедалі очевиднішим, що [ROOT.GetNameDef] незабаром може бути розпущена. Однак є ті, хто вважає, що ця смерть не є випадковістю, а радше вбивством, і хотіли б продовжувати боротьбу, ризикуючи розгнівати Центральний уряд."
 SEA_warlords.11.a:0 "Час продовжувати боротьбу"
 SEA_warlords.12.a:0 "Ласкаво просимо додому"
 SEA_warlords.15.t:0 "$wtt_political_warlord_support.11.t$"
 SEA_warlords.18.a:0 "$wtt_political_warlord_support.3.a$"
 SEA_warlords.26.b:0 "Ми ніколи не здамося!"
 SEA_warlords.26.desc:0 "Після серії кроків, спрямованих на встановлення домінування в регіоні та в родині Ма, [FROM.GetLeader] вирішив, що в наших інтересах буде присягнути йому на вірність. [FROM.GetLeader] також заявив, що якщо ми відмовимося від його пропозиції, то будемо покарані, а наші армії знищені, але остаточний вибір за нами."
 SEA_warlords.33.a:0 "Чудово"
 SEA_warlords.40.desc:0 "Після того, як Чень Цзітан відмовився відступити, незважаючи на дезертирство на наш бік і погрози Юй Ханьмоу піти маршем на Гуанчжоу, провінція поринула в повномасштабну громадянську війну між проурядовими та антиурядовими силами. Ми повинні втрутитися, щоб зупинити цей хаос."
 SEA_warlords.42.t:0 "Хань Фуцзюй тікає з Цзінаня"
 SEA_warlords.46.a:0 "Тепер перемога або смерть!"
 SEA_warlords.5.t:0 "Конфлікт, що стагнує"
 SEA_warlords.60.a:0 "Привид Цзоліня все ще переслідує нас..."
 SELECT_NICHE_INDEX:0 "Обрати нішу"
 SEND_EXP_WE_NOT_AT_WAR:0 "Надсилання експедиційного корпусу — акт агресії. Спочатку ми мусимо вступити у війну на стороні держави @$TAG$$WHO|H$."
 SER_fascism_ADJ:0 "Сербськ"
