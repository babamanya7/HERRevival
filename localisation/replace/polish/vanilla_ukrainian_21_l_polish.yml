 GER_rebuild_the_high_seas_fleet_desc:0 "Нам потрібна програма відродження ВМС. Без нашого колись славного Флоту відкритого моря нам ніколи не вистачить сил, щоби кинути виклик західним державам."
 GER_reclaim_former_african_colonies:0 "Повернути колишні африканські колонії"
 GER_reichskommissariat_australasien:0 "Райхскомісаріат Австралазія"
 GER_reorganize_nationale_volksarmee_desc:0 "Корупція й фашистські настрої досі глибоко вкорінені в нашій армії. Щоб уникнути заколоту й зради, ми маємо очистити ряди від зловмисників. Це залишить у строю великі прогалини, тож потрібно буде призначити нових, лояльних генералів, щоб забезпечити захист народу."
 GER_restore_the_brest_litovsk_borders_desc:0 "Кордони, встановлені Брест-Литовським договором, були давно й незаконно скасовані Версальською угодою, хоча росіяни програли Велику війну та передали ці землі нам. Ми маємо прагнути повернути наші втрачені східні володіння, навіть якщо це призведе до війни."
 GER_rocket_artillery_equipment_1_short:0 "Nebelwerfer 41"
 GER_root_out_imperialism:0 "Викорінити імперіалізм"
 GER_salvage_captured_equipment_custom_tt:0 "Два випадкові [ROOT.GetAdjective]і генерали здобудуть рису §Y$scavenger$§!."
