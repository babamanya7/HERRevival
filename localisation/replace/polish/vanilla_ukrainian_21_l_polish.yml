 TUR_construct_the_zonguldak_coal_refinery:0 "Побудувати вуглепереробне підприємство у Зонгулдаку"
 TUR_controlling_the_skies_of_europe:0 "Контроль над небом"
 TUR_embrace_military_tradition_desc:0 "Колись Османську імперію боявся весь європейський континент. Звичайно, помилки траплялися, але, можливо, минуле може надихнути нас на створення нової армії, здатної дійти до Відня та далі."
 TUR_fighter_equipment_1_short:0 "TamTAS Hurricane"
 TUR_heavy_tank_equipment_2:0 "TÜLOMSAŞ Gergedan I"
 TUR_imperial_factories:0 "Імперські заводи"
 TUR_is_fundamentalist_state_tt:0 "Вважається £faction_tur_traditionalist §Yтрадиціоналістською областю§!"
 TUR_kurdish_state_management_category_desc:0 "Курдська проблема переслідує нас із самого заснування Республіки і стає все помітнішою. Буйний націоналізм і приречені спроби будівництва нації загрожують зруйнувати спадщину Війни за незалежність. Ми не можемо допустити жодного сценарію, в ході якого від нас від."
 TUR_learning_from_the_great_war_desc:0 "Хоч наша армія і перемогла у Визвольній війні Антанту та османів, за свободу нація заплатила кров'ю. Ми зробимо все можливе, щоби катастрофа таких масштабів ніколи не повторилася. Потрібно вчитися на помилках минулого та розуміти ціну перемог."
 TUR_liberate_the_kurdish_diaspora_desc:0 "Долі турецького та курдського народів переплетені, і якщо ми будемо порізно, то історія повторюватиметься століттями."
 TUR_lift_the_ban_on_other_political_parties_desc:0 "Щоразу, коли з'являється нова політична партія, що конкурує з РНП, на неї накидаються релігійні фундаменталісти, що перекручують суть республіки та її принципів заради власних потреб. Цього разу все буде інакше, але все ж ми мусимо зберігати пильність."
 TUR_light_tank_equipment_2_short:0 "Tavşan I"
 TUR_nationalise_all_private_industry_desc:0 "Ми не заперечуємо внесок промисловців та лібералів у нашу спільну боротьбу за захист турецької держави від пожадливих іноземних держав, але зараз вони надто розрослися. Захищаючи нас від акул-капіталістів, вони стали акулами-капіталістами. Більше це терпіти не можна — ми мусимо націоналізувати нашу промисловість та захистити робітників країни."
 TUR_permit_regional_elections:0 "Дозволити регіональні вибори"
