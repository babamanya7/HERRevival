 LIT_demand_vilnius:0 "Вимогти Вільнюс"
 LIT_enforce_military_rule:0 "Увести військове правління"
 LIT_grant_concessions_to_iron_wolf_desc:0 "Можливо, пропонуючи «Залізному вовку» якісь символічні жести, ми зможемо дещо вгамувати його хвилювання."
 LIT_look_north_desc:0 "[Root.Get_Look_North_Focus_desc_Loc]"
 LIT_merge_the_military_and_civilian_governments_desc:0 "Якийсь час поділ влади між військовими та президентом мав сенс, але тепер Смєтона швидко перестає бути корисним. Лише передача надзвичайних повноважень армії забезпечить безпеку Литви."
 LIT_patriotic_education:0 "Патріотична освіта"
 LIT_proclaim_greater_lithuania_desc:0 "Колись Литва була однією з найсильніших держав Європи, але відтоді, як століття тому нас оскопили поляки, ми довго не могли повернути собі минулу славу. Досить! Литва знову стане європейською наддержавою!"
 LIT_the_nation_and_its_power_desc:0 "Сейм з його суперечками — лише перешкода для влади, якої наділений [GetLithuanianLeaderTitle]. Якщо ми хочемо побудувати націю, здатну захистити себе, потрібно, щоб [GetLithuanianLeaderTitle] мав абсолютну владу."
 LIT_warsaw_to_crimea_railway_desc:0 "У наших устремліннях правити від моря до моря важливо, щоб кожна взята нами територія була повністю інтегрована в нашу країну. Наші природні кордони простягаються з півночі на південь, зі сходу на захід, і якщо ми з'єднаємо Крим із нашою залізницею наш контроль над регіоном зросте."
 LIVONIA_fascism_DEF:0 "Терра Маріана"
 LOADING_TIP_144:0 "«Кожен лякається у своїй першій битві. Якщо хтось каже, що не лякається, то бреше».\n(Джордж С. Паттон)"
 LOADING_TIP_150:0 "«Я абсолютно відхиляю нацизм в Австрії... Цей неавстрійський рух обіцяє всім усе, але насправді має за мету найбезжальніше підкорення австрійського народу!»\n(Отто фон Габсбург)"
 LOADING_TIP_155:0 "«Тому готуймося до виконання наших обов'язків, а відтак чинімо так, аби, якщо Британські імперія та її Співдружність проживуть тисячу років, люди й тоді казали: “Це була їхня зіркова година”».\n(Вінстон Черчилл)"
 LOADING_TIP_54:0 "«Я питаю вас: чи хочете ви тотальної війни? А якщо потрібно, чи хочете ви війни більш тотальної та радикальної, ніж ми нині взагалі можемо уявити?»\n(Йозеф Гьоббельс)"
 LOADING_TIP_64:0 "«Французи збрехали полякам, пообіцявши піти в атаку. Та вони не збиралися».\n(Едмунд Айронсайд)"
