 SOV_patriarch_of_all_russia_desc:0 "Хоча в освіченому комуністичному суспільстві немає причин для відсталих забобонів, ми також мусимо визнати, що багато людей знайшли силу і розраду у своїй вірі у важкі часи. Побудова суспільства нового типу не позбавлена труднощів, і тому, можливо, нам слід дозволити цим релігійним інституціям продовжувати функціонувати, доки вони залишаються лояльними до держави."
