 DOD_hungary.101.desc:0 "Словаччина знову перебуває під нашим контролем. Тепер треба вирішити, що з нею робити. Багато хто в уряді висловлюється за пряму анексію, називаючи її «поверненням до історичних кордонів», але є й ті, хто вважає, що інтеграція великої кількості громадян неугорського походження може обернутися провалом, вони пропонують створити автономну область з урядом у Братиславі, який самостійно вестиме деякі внутрішні справи, чітко дотримуючись нашої лінії у всіх інших питаннях."
 DOD_hungary.102.b:0 "Звернутися до Німеччини щодо розділу країни."
 DOD_hungary.11.desc:0 "Після переговорів на найвищому рівні, що тривали до глибокої ночі, [CZE.GetAdjective] уряд прийняв нашу пропозицію, за умовами якої [HUN.GetLeader] стає королем Богемії і губернатором Моравії. Війська колишньої чеської армії принесли на вірність новому королю та імператору, а цивільні адміністрації територій були об'єднані."
 DOD_hungary.118.t:0 "Радянці пішли на поступки"
 DOD_hungary.123.t:0 "[SOV.GetLeader] не приймає нашу пропозицію"
 DOD_hungary.130.t:0 "[From.GetAdjective] делегація залишає переговори"
 DOD_hungary.162.t:0 "Конкурс на середні бомбардувальники"
 DOD_hungary.24.desc:0 "Швеція виявилася втягнута в криваву війну. У рідкісному особистому зверненні до обох палат парламенту король заявив, що переживає за свою колишню батьківщину і стурбований долею, яка чекає на його батька та рідних у разі поразки Швеції. У зв'язку з цим уряд вирішив обговорити можливі заходи щодо надання допомоги Швеції."
 DOD_hungary.27.t:0 "Втручання Угорщини"
 DOD_hungary.33.b:0 "Нам не можна порушувати розташування сил у регіоні."
 DOD_hungary.40.b:0 "Нам зараз не потрібна війна."
 DOD_hungary.43.b:0 "Вони розкусили наш блеф."
 DOD_hungary.63.b:0 "Ми помремо, але повернемо собі наші землі!"
 DOD_hungary.69.a:0 "Це прийнятний варіант. Хоч і важко."
 DOD_hungary.71.c:0 "Трансільванія залишиться у складі Румунії."
 DOD_hungary.72.b:0 "Наполягати на більш вигідних умовах."
 DOD_hungary.80.c:0 "Звернутися до Німеччини."
 DOD_hungary.92.d:0 "Звернутися до Німеччини та Італії."
 DOD_hungary.94.t:0 "[From.GetNameDefCap] пропонує підтримку проти Югославії"
 DOD_romania.12.desc:0 "Переговори з державою [From.GetNameDef] про вступ до нашої спілки завершилися безрезультатно. Делегація держави [From.GetNameDef] висунула нам довгий список вимог для вступу до нашого союзу, у тому числі важливих зобов'язань щодо військової підтримки.\n\nГенштаб відкинув їх як нездійсненні, а у міністерстві закордонних справ вважають, що [From.GetLeader] навмисно висуває такі вимоги, щоби відповісти відмовою на нашу пропозицію та уникнути при цьому відповідальності."
 DOD_romania.120.a:0 "Швидкісна техніка «Vauxhall»."
 DOD_romania.120.desc:0 "Декілька іноземних компаній, що випускають вантажні автомобілі, бажають відкрити завод у Румунії для виробництва нових комерційних та військових моделей. Ми маємо вибрати одну з них для флагманського проєкту, який дозволить нам отримати кілька ліцензій на виробництво.\n\nХто цікавить нас найбільше?"
 DOD_romania.21.a:0 "Відмінно."
 DOD_romania.41.a:0 "Чудово."
 DOD_romania.601.a:0 "Чудова ідея!"
 DOD_romania.67.a:0 "Перемога не за горами."
 DOD_romania.70.desc:0 "Югославський уряд визнав свою поразку. Війська союзних держав взяли країну під контроль і окупували вибрані ними зони."
 DOD_yugoslavia.181.t:0 "У державі [This.GetNameDef] поширюються комуністичні настрої"
 DOD_yugoslavia.182.t:0 "Панслов'янська пропаганда"
 DOD_yugoslavia.20.b:0 "Дозволити продаж бомбардувальників з нашого резерву."
 DOD_yugoslavia.21.a:0 "Чудово."
 DOD_yugoslavia.35.b:0 "Ні, ми не станемо надалі їх задовольняти!"
 DOD_yugoslavia.60.t:0 "Коронація"
