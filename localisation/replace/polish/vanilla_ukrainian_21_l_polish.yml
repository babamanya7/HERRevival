 government_in_exile_allowed:0 "Уряди у вигнанні дозволені"
 governments_in_exile_ETH_desc:0 "[ROOT.GetLeader] на даний момент створив уряд у вигнанні з [ROOT.GetLeader.GetHerHis] бази в [?ETH.host_nation.GetNameDef]. Ситуація жахлива, але далеко не безнадійна, декільком воїнам вдалося втекти, і, сподіваємося, з часом до нас приєднається більше. Імператорська сім'я добре розташована, тому ми повинні мати можливість перенаправляти кошти, щоб покращити наші шанси відвоювати [ETH.GetName].\n\n Поточний баланс Імперської скарбниці: §Y[?ETH_treasury]§! £GFX_ETH_imperial_treasury£"
 grand_battle_plan_desc:0 "Ретельні планування та підготовка перед битвою — ось ключ до успіху."
 grand_siam_tt:0 "Граючи як [SIA.GetNonIdeologyName], змусьте капітулювати §Y4§! держави в межах одного року"
 great_empire_rises_again:0 "Wiederkehr"
 greater_hui_state_category_desc:0 "Китайські мусульмани-хуей зараз розсіяні по всіх північно-західних провінціях і в регіоні Чжун'юань. Багато хто бажає створення єдиної держави, яка могла б захистити їх від ватажного свавілля та іноземної агресії; навіть дунгани, пантайці та чін-хау шукають нашої допомоги. Ми повинні прагнути об'єднати наш народ якнайшвидше."
 greater_mongolia_category_desc:0 "Ідея возз'єднання розсіяного монгольського народу існувала ще з часів великої Монгольської імперії та династії Юань у Китаї. Настав час розділеним племенам знову зібратися разом, щоб ознаменувати новий світанок для народу Монголії."
 greater_mongolia_communism:0 "Велика Монгольська радянська республіка"
 greater_mongolia_democratic_DEF:0 "Велика Монгольська федерація"
