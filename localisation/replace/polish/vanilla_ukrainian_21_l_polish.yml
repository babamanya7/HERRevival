 SIA_khana_ratsadon_civilian_coup_mission:0 "Цивільне крило планує скинути уряд!"
 SIA_khana_ratsadon_civilian_coup_mission_desc:0 "Цивільне крило вбачає у політиці нинішнього уряду загрозу своїм інтересам. Вони активно планують усунути уряд, якщо їхнє становище не покращиться."
 SIA_night_time_training_desc:0 "Сміливі атаки серед білого дня проти підготовленого ворога запрошують до катастрофи. Навчаючи наших людей проникненню, пересуванню та атаці під покровом темряви, ми можемо перехопити ініціативу, коли ворог сліпий, розгублений і найменш підготовлений до відповіді нам."
 SIA_poster_no_text:0 ""
 SIA_retake_lost_british_states:0 "Повернення втрачених британських територій"
 SIA_river_patrols_desc:0 "Річки [ROOT.GetNameDef] — це дороги, кордони і лінії життя водночас. Патрульні катери на цих водах допоможуть нам підтримувати порядок, підтримувати місцеві гарнізони і поширювати вплив держави в регіони, де віддалена столиця інакше діє надто повільно."
