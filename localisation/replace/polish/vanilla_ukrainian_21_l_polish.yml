 NOR_allied_democratic_deploy_prep_decisions_category_desc:0 "Як ми і очікували, війна нарешті прийшла, але боятися нема чого. Останні кілька років ми зосереджували всі наші зусилля на тому, щоб підготувати державу [ROOT.GetName] до того, що би наші вороги не кинули в нас. Покажемо їм, з чого ми зроблені.\n\nНаціональна готовність: [?NOR.NOR_country_preparedness]/30"
