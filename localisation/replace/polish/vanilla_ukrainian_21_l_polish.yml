 ARG_astarsa_organization:0 "Astarsa"
 ARG_balancing_act_decisions_desc:0 "У міру того, як наш новий уряд оговтується, ми знову стикаємося з проблемою збереження відносин із країнами як Союзників, так і Осі. Ця війна, схоже, не має швидкого завершення, і тому важливо, щоби ми мудро збалансували свою відданість. Надаючи перевагу одній стороні, ми можемо засмутити іншу."
 ARG_counter_intelligence_program_desc:0 "Здається, шпигунство є значним гравцем у цій війні, і ми сильно відстаємо у нашій власній програмі розвідки. З чутками про [GER.GetAdjective] операції в [ARG.GetName] та інших південноамериканських націях, ми повинні підготуватися до протидії їм якнайшвидше."
 ARG_destroyer_2_desc:0 "Buenos Aires-class destroyers were built in the U.K. for Argentina between 1936 and 1938. They were based off the British G-class destroyers. They displaced over 1300 tons and were armed with four QF 4.7 in. Mark IX cannon as their main guns."
 ARG_england_demands_peace:0 "Провести переговори з державою [ARG.GetNameDef]"
