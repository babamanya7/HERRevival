 ARG_peronist_party:0 "Хустісіалістська партія"
 ARG_political_events.100.t:0 "[ARG.GetNameDefCap] запрошує нас до своєї фракції"
 ARG_political_events.111.b:0 "У нас немає іншого вибору, окрім як відступити."
 ARG_political_events.13.desc:0 "Ми отримали відповідь від [GER.GetAdjective] посольства і раді повідомити, що вони прийняли нас до Осі. Це початок потужного альянсу."
 ARG_political_events.19.t:0 "[ARG.GetNameDefCap] висуває ультиматум"
 ARG_political_events.21.desc:0 "Уряд [URG.GetAdjective] вирішив відмовитися від умов, які ми висунули. Якщо ми вважаємо, що цей курс дій негідний, то ми можемо просто відступити. Інакше, давайте готувати наші війська до вторгнення."
 ARG_political_events.22.a:0 "They are proving to be worthy allies."
 ARG_political_events.33.t:0 "[ENG.GetNameDefCap] погоджується поступитися островами"
 ARG_political_events.36.desc:0 "На щастя, [ARG.GetAdjective] уряд погодився припинити війну на умовах, які ми висунули. Буде прикро віддавати Фолклендські та Південна Джорджія острови, але ми повинні зосередити наші сили в іншому місці."
 ARG_political_events.38.t:0 "[ARG.GetNameDef] вимагає Екваторіальну Гвінею як компенсацію"
 ARG_political_events.73.t:0 "[FROM.GetNameDefCap] прагне тіснішої співпраці"
 ARG_political_events.74.a:0 "Фантастично!"
 ARG_political_events.81.t:0 "Грант на освіту в галузі електроніки"
 ARG_production_initiative:0 "Виробнича ініціатива"
 ARG_reform_our_industry_desc:0 "Надто довго наше промислове впровадження відставало від інших націй у світі. Настав час розширити промисловість [ARG.GetNameDef] та привести її до більш сучасного стандарту. Ми можемо почати з будівництва нових фабрик та негайно ввести їх у роботу."
 ARG_reinforce_the_education_system:0 "Посилити систему освіти"
 ARG_ship_heavy_battery_1:0 "30.5cm/50 Bethlehem"
 ARG_social_welfare_fund:0 "Фонд соціального забезпечення"
 ARG_south_american_alliance:0 "Панамериканська співпраця"
 ARG_subdue_dissension_tt:0 "Щоби відімкнути цей фокус, ви повинні були запровадити федеральні інтервенції принаймні 3 рази!"
 ARG_the_second_argentine_republic:0 "Друга Аргентинська республіка"
 ARG_union_nacional_fascista_desc:0 "Через нескінченну корупцію та внутрішні чвари, зрозуміло, що керівництво «Конкордансії» є марним. Настав час для головної зміни в [ARG.GetAdjective] політиці. Німіо де Анкін здобув достатню популярність як лідер Національного фашистського союзу і готовий очолити країну та повернути [ARG.GetNameDef] почуття націоналістичної гордості."
 ARMOR_DIRECTORY:0 "Танковий модуль"
 ARMY_AIR_LABEL:0 "Огляд авіації"
 ARMY_LEDGER_THRESHOLD_IDEAS:0 "Армійські міністри та закони"
 ARMY_MOTORIZATION_PRIORITY:0 "§HПріоритет моторизації§!\nМоторизація ставить у пріоритет постачання армії необхідними припасами за допомогою вантажівок. Вони постачатимуть вантажі з центрів, які без цього були б поза досяжністю.\n§GКлацніть§!, щоб обрати пріоритети."
 ARMY_NAVIES_TOOLTIP_DELAYED_TEMPLATE:0 "$NAME|H$ ($TYPE|H$)"
 ARMY_NAVIES_TOOLTIP_DETAILED_DESC:0 "У нас є всього 1 $TYPE$."
 ARMY_TAB:0 "Дивізії"
 ASSIGN_ADMIRAL_TO_NAVAL_HEADQUARTER:0 "§GКлацніть§!, аби призначити адмірала до штабу ВМС."
 AST_CAS_equipment_3:0 "CAC CA-11 Woomera"
 AST_UNION_CONTROL_STATUS_NAME_MAL:0 "Малайя"
 AST_a_comrade_emancipated_desc:0 "По всьому світу багато націй досі скуті ланцюгами капіталізму, а їхні народи позбавлені справжньої свободи. Як вільна соціалістична держава, наш обов'язок — допомогти їм звільнитися. Робітники всіх країн, єднайтеся, і ми разом скинемо ці ланцюги."
 AST_a_national_housing_commission:0 "Національна житлова комісія"
 AST_a_sound_voice_desc:0 "У цей період політичних потрясінь один впевнений голос, здається, вселяє довіру серед австралійського народу. Можливо, це голос наступного лідера [AST.GetName]?"
 AST_advance_pacific_initiatives_chi_2_tt:0 "§Y[CHI.GetName]§! пропонує:"
 AST_advanced_pilot_training_desc:0 "Оскільки літаки стають складнішими, швидшими та сучаснішими, майстерність наших пілотів має відповідно вдосконалюватися, щоб повною мірою використовувати ці технології."
 AST_afm_decisions_fascism_upgrade_tt:0 "\nПокращити щоденний приріст підтримки фашизму від рішень §YРуху «Передусім Австралія»§!.\n\n"
 AST_anzac_spirit:0 "Дух АНЗАК"
 AST_autonomy_associated_dominion_DEF:0 "Домініон Австралія"
 AST_battle_cruiser_2_desc:0 "The Princess Royal was a class of hypothetical battlecruisers that were a faster and cheaper version of the King George V-class battleships. These vessels carried a similar but reduced armament for both surface and anti-air combat: two triple 14 in. cannons and six twin 5.25 in. AA guns. Their fast speed and long range would provide the Royal Navy with quick strike capabilities and convoy protection, but their limited armor would prove problematic if they had to fight modern battleships."
 AST_big_business_pact_desc:0 "Оскільки Партія «Австралія понад усе» прагне захистити вітчизняну промисловість, вона знайшла багато прихильників серед топ-керівників бізнесу. В обмін на проведення політики, що збільшує їхні прибутки, вони підтримуватимуть наші політичні та військові цілі."
 AST_cabinet_trust_complete_not_tt:0 "Не взято фокус §YПередусім Австралія§!"
 AST_cac_woomera:0 "CAC Woomera"
 AST_conscription_level_allowed_limited_conscription_tt:0 "Розблокувати додатковий рівень §YЗакону про призов§!, який зробить доступним §YОбмежений призов§!"
 AST_cruisers_desc:0 "Залишимо лінкори та авіаносці іншим державам — нам більш ніж вистачить скупчення кораблів розміром з крейсер."
 AST_cv_CAS_equipment_2_short:0 "Skua"
 AST_diplomatic_events.12.desc:0 "[USA.GetNameDefCap] відхилили нашу пропозицію об'єднати зусилля. [AST.GetNameDefCap] та [USA.GetName] залишаться розділеними у своїх відповідних військових зусиллях."
 AST_diplomatic_events.13.t:0 "Стаття 6"
 AST_diplomatic_events.34.a:0 "Пакт здається розумним."
 AST_diplomatic_events.43.desc:0 "[AST.GetName] стверджує, що через свою експансію на північ, ми зможемо збільшити наш спільний вплив на дипломатію та конфлікти в Південно-Східній Азії. Хоча це і не пряма вимога, [AST.GetLeader] натякає, що відмова не буде прийнята."
 AST_diplomatic_events.49.a:0 "Так, ми справді повинні."
 AST_diplomatic_events.52.desc:0 "[FROM.GetNameDefCap] не погоджується; їм не потрібна допомога у захисті вод Південно-Східної Азії. Проте, з підтримкою Британії чи без неї, [ROOT.GetName] докладе зусиль для збільшення військово-морського домінування в сусідніх водах."
 AST_diplomatic_events.54.t:0 "Їм на допомогу"
 AST_diplomatic_events.74.desc:0 "У своїх амбіціях розширити свої території, [AST.GetName] вимагає контролю над [PHI.GetNameDef]. У разі нашої відмови [AST.GetName] погрожує війною, вважаючи просто неприпустимим те, що [USA.GetNameDef] зберігає території в межах сфери впливу [AST.GetName]."
 AST_diplomatic_events.78.a:0 "Ми гарантуємо їхню безпеку."
 AST_election_approaching_cat:0 "Наближення виборів"
 AST_equal_pay:0 "Рівна оплата праці"
 AST_expand_planned_extraction_pilbara_tt:0 "Фокус §Y$AST_planned_extraction$§! дозволить експлуатувати регіон Пілбара у штаті §Y$STATE_870$§!, відкриваючи майже невичерпне джерело §YСталі§!. Ми можемо використовувати це для підживлення нашої економіки."
 AST_final_reforms_mission_desc:0 "Завдяки стабільному керівництву, консервативним поглядам та лояльності до Британії, Об'єднана партія Австралії (UAP) зміцнила свою підтримку та зробила ще один термін дедалі більш імовірним. Щоб зберегти підтримку громадськості, її лідери повинні прискорити реформи.\n\n§YЕфекти, поки активно:§!\n§W(§YДемократичні§! фокуси):\n§Y7§! днів зменшення часу виконання§!"
 AST_form_australasia_malenesia_core_states_tt:0 "Отримує національні території на всі області регіону §YМеланезія (Malenesia)§!."
 AST_free_school_policy:0 "Політика безкоштовної освіти"
 AST_heavy_fighter_equipment_3:0 "de Havilland Mosquito"
 AST_infantry_equipment_3:0 "Electrolux SMLE-CAR"
 AST_jet_fighter_equipment_1_short:0 "Vampire"
 AST_jet_tac_bomber_equipment_2_short:0 "Canberra"
 AST_light_cruiser_2:0 "$ENG_light_cruiser_2$"
 AST_light_cruiser_4_desc:0 "Also known as the Swiftsure class, these cruisers were designed as a modified version of the Crown Colony class, incorporating war modifications that were authorized in 1941. They had a longer operational range and more numerous AA weaponry than the Crown Colony class, while the main armament was reduced to three triple turrets."
 AST_light_tank_artillery_equipment_3_short:0 "Crusader II SPA"
 AST_medium_tank_aa_equipment_3:0 "AC III Thunderbolt Anti-Air"
 AST_mio_trait_john_brown_capital_ship_heritage:0 "Спадщина капітальних кораблів"
 AST_mio_trait_pacific_overwater_endurance:0 "Тихоокеанська тривалість надводного польоту"
 AST_mio_trait_raf_doctrine_integration:0 "Інтеграція доктрини Королівських ВПС"
 AST_pacific_initiatives_modifier:0 "Дипломатичні ініціативи"
 AST_part_with_colonizer:0 "Розірвати зв'язки з колонізатором"
 AST_political_events.6.a:0 "Необхідно вжити заходів."
 AST_request_resource_rights_in_burma:0 "Запросити права на ресурси у [BRM.GetNameDef]"
 AST_scorch_the_north_desc:0 "Якщо ми підозрюємо вторгнення з півночі, існують способи зірвати такі просування, хоча вони мають свою ціну. Попри те, що розвиток наших північних штатів буде відкинутий назад політикою випаленої землі, це може бути саме тим, що необхідно для стримування агресорів."
 AST_seize_local_leadership_in_queensland:0 "Захопити місцеве керівництво у Квінсленді"
 AST_seize_local_leadership_in_state_mid:0 "Захопити місцеве керівництво у штаті [FROM.GetName]"
 AST_the_pacific_garrison_desc:0 "Хоча захист Південно-Східної Азії та Тихого океану входить до інтересів Британії, цей регіон знаходиться далеко від Британських островів. В обмін на їхню підтримку в постачанні ми запропонуємо взяти на себе командування обороною цієї території, що дозволить [ENG.GetNameDef] спрямувати свою увагу в інше місце."
 AST_uap_50_discount:0 "\n\n§YЕфект від >50% Демократичних голосів§!:\nКластери фокусів §YУАП§!:\nСкорочення часу завершення на §Y5§! днів.\n\nПідніміть Голоси вище §Y70%§!, щоб отримати скорочення часу завершення на §Y10§! днів для кластерів фокусів §YУАП§!."
 AST_union_control_events.4.a:0 "Дізнайтеся, хто за цим стоїть. Ці повстанці недовго утримуватимуть цю землю."
 AST_union_control_events.4.a.tt:0 "Антикомуністичні формування ополчення об'єдналися і сформувалися для опору комуністичній окупації."
 AST_vichy_out_of_africa:0 "Віші геть з Африки"
 AST_war_on_japan_desc:0 "Японська агресія триває надто довго. Вони розграбували всю Східну Азію, а тепер кинули погляди на землі та ресурси півдня. Ми не можемо стояти осторонь."
 ATJ_democratic_ADJ:0 "Ачезьк"
 ATTRITION_UPKEEP_MODIFIERS:0 "\n - Модифікатори підтримання частини:"
 AUS_BEL_autonomy_eu_member_DEF:0 "Європейська Австрія"
 AUS_HOL_autonomy_eu_member:0 "Європейські Нідерланди"
 AUS_VICTORY_POINTS_11542:0 "Праг"
 AUS_advanced_tanks_desc:0 "Дивлячись на наші танки, ми зрозуміли, що вони або справді важкоброньовані та повільні, або дуже легкі та спритні, але не такі міцні. Вибравши найкраще з обох концепцій дизайну, ми зможемо виробляти танки, які будуть міцними, але спритними, і важкоброньованими, але швидкими."
 AUS_an_improved_german_state_desc:0 "Ми завжди вважали себе кращою німецькою країною у світі, і останні наші дії довели нашу правоту. Ми більше не дозволимо ганебному берлінському уряду заплямувати репутацію нації німців. Настав час інтегрувати їх у нашу власну славетну країну та використати їхню могутність для себе!"
 AUS_approach_democratic_guarantors:0 "Звернутись до демократичних гарантів"
 AUS_austrian_empire_neutrality:0 "Австрійська імперія"
 AUS_autobahn_east:0 "Розширити автобани на схід"
 AUS_becoming_grossosterreich_category_desc:0 "Нас чекає довга боротьба за досягнення нашої мети, але разом, переконані в перемозі, нас нічого не зупинить. [GER.GetAdjective]им людям більше не доведеться жити під ганебним керівництвом, ми створимо нову націю, сильнішу й процвітаючу!"
 AUS_danubian_state:0 "Дунайська держава Австрія"
 AUS_defending_the_coast_bonus:0 "Захист узбережжя"
 AUS_gw_armored_car_equipment:0 "Steyr ADGZ"
 AUS_improved_warfare_strategies_desc:0 "Після багатьох років перебування під Сен-Жерменським Договором наші стратегії та доктрини дуже застаріли. Незважаючи на те, що ми досягли великого прогресу, без їх покращення — ми налаштовуємо себе на невдачу."
 AUS_industrial_coaxing_decision:0 "Надати промислову допомогу [FROM.GetNameDef]"
 AUS_industrialization_effort:0 "Зусилля індустріалізації"
 AUS_join_the_research_program:0 "Спільні дослідницькі програми"
 AUS_medium_specialization:0 "Ініціатива Schlachtfliegerkompanie"
 AUS_mio_trait_weight_optimization:0 "Оптимізація ваги"
 AUS_neutrality_herrenhaus_long:0 "Палата панів (Герренгаус)"
 AUS_news_events.11.b:0 "Як сміливо! Бажаємо успіхів!"
 AUS_news_events.12.desc:0 "\nВперше після 11 вересня 1930 року, [AUS.GetNameDef] проводить демократичні вибори. Явка виборців була високою, а коли підрахунок голосів завершився, [AUS.GetLeader], з партії «[AUS.GetDemocraticParty]» став переможцем. Тепер йому доведеться зіткнутися з важким завданням вивести країну на новий, більш демократичний шлях."
 AUS_news_events.5.a:0 "Тривожно"
 AUS_news_events.7.c:0 "Раді за них"
 AUS_news_events.9.b:0 "Побажаємо їм успіхів!"
 AUS_political_events.109.desc:0 "Останнім часом наші прикордонні патрулі повідомляють про значно більшу кількість прикордонних патрулів і навіть повноцінних дивізій на [FROM.GetAdjective]ому боці нашого спільного кордону. Що ще тривожніше, ці солдати озброєні доволі нелегким озброєнням, натомість носять гвинтівки, які можна було б очікувати від частин регулярної армії. Враховуючи їхні попередні заяви, в нашому уряді наростає занепокоєння."
 AUS_political_events.117.desc:0 "\nПопри найбільш очевидні переваги як для нас, так і для [FROM.GetNameDef], їх уряд відхилив нашу пропозицію щодо спільних військових навчань. Наші армії могли б багато чому навчитися одна в одної. Це також могло бути чудовою нагодою для нас повпливати на їх країну в напрямку, який ми спланували щодо їхнього майбутнього."
 AUS_political_events.2.a:0 "Який жах!"
 AUS_political_events.23.a:0 "Наша безпека важливіша за спроби зачепитися за минуле"
 AUS_political_events.30.c:0 "Більше ніяких гарантій для них!"
 AUS_political_events.39.a:0 "[ROOT.GetNameDef] вітає вас!"
 AUS_political_events.39.desc:0 "Відповідь [FROM.GetAdjective]ого керівництва вже святкують в нашому уряді. Вони складуть зброю і не чинитимуть опору, коли ми заберемо належне нам по праву. Очевидно, вони зрозуміли цінність того, щоб не втягнути свою націю в безглузду війну через такі питання."
 AUS_political_events.47.desc:0 "Незважаючи на всі наші зусилля заспокоїти Австрійський уряд, вони твердо вирішили, що єдиний прийнятний результат полягатиме в одному: повному підкоренню їхнім вимогам, що означає дозвіл встановити маріонетковий режим у нашій країні. Вони наголошують, що немає місця для компромісів. Або ми з ними, або проти них."
 AUS_political_events.5.a:0 "Воно того варте, ми допоможемо усім, чим зможемо."
 AUS_political_events.5.b:0 "Ми можемо навчитися працювати разом."
 AUS_political_events.5.c:0 "Ми не купимося на цю «оборонну» брехню."
 AUS_political_events.50.t:0 "[FROM.GetNameDefCap] передає Сілезію"
 AUS_political_events.52.a:0 "У нас немає іншого вибору, окрім як підкоритися."
 AUS_political_events.53.desc:0 "Ми отримали повідомлення про те, що [FROM.GetAdjective]ий уряд не збирається чинити опір анексії своєї країни і натомість мирно інтегрується в нашу славну Австрію. Ми нарешті відновили контроль і право власності на нашу стару Батьківщину, селище Габсбург."
 AUS_political_events.61.a:0 "Правильно."
 AUS_political_events.70.desc:0 "\n[FROM.GetLeader] із держави [FROM.GetNameDef] звернувся до нас особисто. Наша попередня взаємодія не вийшла такою, як вони сподівалися, і вони вирішили зробити нам нову пропозицію в надії змінити нашу думку.\n\nОскільки їх безпека, очевдино, дуже серйозна справа для них, вони запропонували допомогу в покритті витрати на два нових заводи в нашій країні. Вони запевняють нас, що ми мали б їхню вдячність, якби ми передумали та надали їм гарантію незалежності."
 AUS_political_events.84.a:0 "Ми не бачимо в цьому проблеми."
 AUS_political_events.87.t:0 "[FROM.GetNameDef] вимагає комуністичних реформ"
 AUS_political_events.92.a:0 "Ми не продаємо свою землю!"
 AUS_reach_out_to_italy:0 "Звернутись до Італії"
 AUS_saurerwerke:0 "Österreichische Saurerwerke"
 AUS_secret_rearmament_desc:0 "Протягом дуже тривалого часу обмеження на переозброєння унеможливлювали будь-яке нарощування армійської присутності. Хоча Сен-Жерменський Договір все ще діє, ми знайшли кілька лазівок, якими можемо скористатися, щоб виправдати таємне переозброєння."
 AUS_stabilize_the_political_climate:0 "Стабілізація політичного клімату"
 AUS_strike_deal_with_italy_desc:0 "У нас були бажання володіти Трентіно та Альто-Адідже в Північній Італії, оскільки вони були відібрані в нас наприкінці Великої Війни. Що ще краще, [ITA.GetAdjective]ий уряд висловили, що не сильно бажають, щоб ці території були нав’язані їм, вони більше тримають їх у себе нам на зло. Доклавши певних дипломатичних зусиль, ми зможемо укласти з ними угоду щодо цих регіонів."
 AUS_subjugating_the_lands_of_old_category_desc:0 "Наприкінці Великої війни ми втратили незлічені землі. Ця велика несправедливість залишила нас ослабленими, в негідному стані для такої країни, як наша. Ми повинні прагнути повернути ці землі, або словом, або силою."
 AUS_suddeutschland_fascism_DEF:0 "Південна Німеччина"
 AUS_the_correct_communism:0 "Правильна форма комунізму"
 AUS_the_matzen_oil_fields:0 "Експлуатація матценських нафтові родовищ"
 AUS_the_royals_of_liechtenstein_desc:0 "Ми історично мали тісні зв’язки з Ліхтенштайном, їхній нещодавній князь Франц Йосиф I навіть узяв австрійську жінку собі за дружину. Оскільки Фердинанд був бездітним, корону мали взяти на себе Алоїс або Йоганн фон унд цу Ліхтенштайн, проте обидва відмовилися від своїх претензій на корону. Тепер обидва князі пропонують нам свою допомогу, тож ми добре скористаємось цією пропозицією!"
 AUS_trade_coaxing_descision:0 "Відправити спорядження [FROM.GetNameDef]"
 AUS_union_of_danubian_socialist_republics:0 "Союз дунайських соціалістів"
 AUS_war_against_bolshevism_desc:0 "[SOV.GetAdjective]і більшовики на нашому сході були постійною шипою в нашому боці. Щоб не бути застигнутими зненацька, ми повинні бути тими, хто завдасть удару першими."
 AZR_democratic_ADJ:0 "Азербайджанськ"
 Aug:0 "сер"
 BALTIC_events.601.a:0 "Ми врятуємо їх від них самих."
 BALTIC_modernize_industry:0 "Модернізувати нашу промисловість"
 BALTIC_natural_resources:0 "Розробляти природні ресурси"
 BALTIC_red_army:0 "[Root.GetAdjective]і червоні стрільці"
 BALTIC_technology_sharing_desc:0 "Ми вже виробляємо чималу частку спорядження нашого партнера, але, можливо, вивчивши його проєкти, ми зможемо значно поліпшити якість [Root.GetNonIdeologyAdjective]их виробів."
 BALTIC_trade_with_neighbors:0 "Торгувати з сусідами"
 BAR_democratic:0 "Федеральна республіка Баротселенд"
 BATTLE_ATTACK:0 "Наступ"
 BAY_fascism_DEF:0 "Націонал-соціалістична держава Баварія"
 BBA_african_union_events.13.t:0 "[FROM.GetNameDefCap] виходить з Організації Африканської Єдності"
 BBA_african_union_events.15.b:0 "Нас не цікавить така домовленість."
 BBA_african_union_events.15.t:0 "Оборонна угода Організації Африканської Єдності"
 BBA_ethiopia_anti_colonialism_events.6.t:0 "Свободу державі [FROM.GetNameDef]"
 BBA_ethiopia_balance_of_power_events.26.t:0 "Меритократія в армії"
 BBA_ethiopia_balance_of_power_events.51.desc:0 "Місцевий владика в області [?ROOT.ETH_bop_state.GetName] запропонував зібрати загін і приєднати його до імперської армії. Люди будуть набрані з місцевих розбійників й іноземних добровольців, тому вони будуть повністю оснащені та готові до бою. Втрата влади зараз — це, звичайно, ризик, але отримання більшої кількості військ, безумовно, збільшить шанси на перемогу у війні."
 BBA_ethiopia_communist_events.07.a:0 "Ми не ведемо перемовин із комуністами."
 BBA_ethiopia_communist_events.11.desc:0 "Нове керівництво держави [ETH.GetNameDef] визнає слабкість своєї армії у веденні сучасної війни. Тому вони просять нас допомогти з реорганізацією збройних сил. Це чудова можливість для наших офіцерів отримати досвід у нових умовах, а також шанс вплинути на внутрішній баланс сил у [ETH.GetName]."
 BBA_ethiopia_communist_events.16.a:0 "На [SOV.GetAdjective] покладатися не можна."
 BBA_ethiopia_communist_events.22.a:0 "Вони пошкодують про це."
 BBA_ethiopia_communist_events.26.a:0 "Вони використовують нас, щоб виснажити [ITA.GetAdjective]ий народ."
 BBA_ethiopia_communist_events.38.a:0 "Дякуємо, товариші."
 BBA_ethiopia_communist_events.47.a:0 "Ми не віддамо наші землі."
 BBA_ethiopia_communist_events.49.desc:0 "[ETH.GetAdjective] дипломати звернулися до нас із пропозицією миру. Умова пропозиції — відмова від претензій на [KEN.GetAdjective] територію, яку ми втратили на користь [ETH.GetNameDef] під час цього конфлікту. Дипломати також заявляють, що в регіоні буде створено [KEN.GetAdjective]ий уряд. Наскільки незалежним буде цей уряд — ще належить побачити."
 BBA_ethiopia_exile_events.10.b:0 "Тереторій ворога можуть взяти собі"
 BBA_ethiopia_exile_events.34.t:0 "[FROM.GetNameDefCap] погоджується"
 BBA_ethiopia_exile_events.43.desc:0 "[FROM.GetLeader] розуміє необхідність для [ETH.GetName] поступитися територією, щоби закінчити конфлікт таким чином, щоби зберегти обличчя перед громадськістю. Незабаром ми зможемо залишити цей безлад вторгнення позаду з високо піднятою головою."
 BBA_ethiopia_exile_events.48.desc:0 "Як і очікувалося, [ROOT.GetNameDef] досяг успіху там, де всі інші зазнали невдачі. [FROM.GetLeader] прийняв умови, які були запропоновані [ROOT.GetLeader]. Між [FROM.GetNameDefCap] в [?global.ETH_peace_country.GetNameDef] буде мир. Тепер ми всі разом можемо перейти до більш важливих справ."
 BBA_ethiopia_exile_events.55.t:0 "[?ETH.host_nation.GetAdjectiveCap]е вербування найманців"
 BBA_ethiopia_fascist_events.03.b:0 "$BBA_ethiopia_fascist_events.02.b$"
 BBA_ethiopia_fascist_events.05.a:0 "Початок нової епохи."
 BBA_ethiopia_fascist_events.23.t:0 "Бійці опору"
 BBA_ethiopia_fascist_events.58.desc:0 "Завдяки зусиллям наших дипломатів, [ITA.GetLeader] дозволив [ITA.GetAdjective] компаніям відкрити заводи в нашій країні. Це значно пришвидшить наші дослідження та виробництво військового обладнання."
 BBA_ethiopia_fascist_events.60.b:0 "У майбутніх війнах авіація відіграватиме ключову роль."
 BBA_ethiopia_fascist_events.60.t:0 "Аутсорсинг виробництва озброєнь"
 BBA_ethiopia_imperial_events.4.desc:0 "Растафаріанський рух у області [689.GetName] стверджує, що $ETH_haile_selassie$ — це Месія, або Джа, їхнє ім'я для реінкарнації Бога. Дещо несподівано, $ETH_haile_selassie$ прийняв цю репутацію, і [FROM.GetAdjective]ий уряд звернувся до [FROM.GetAdjective]ої влади з проханням включити батьківщину руху, тобто [689.GetName], до складу [FROM.GetAdjective]ої імперії."
 BBA_italo_ethiopian_war_events.101.desc:0 "[FROM.GetAdjective]ий уряд схвально відповів на прохання виступити в якості приймаючої країни для [ROOT.GetLeader], якщо це буде необхідно."
 BBA_italo_ethiopian_war_events.111.t:0 "[FROM.GetLeader] погоджується на мир"
 BBA_italo_ethiopian_war_events.401.b:0 "Якщо вони хочуть нашу землю, їм доведеться брати її силою."
 BBA_italo_ethiopian_war_events.402.desc:0 "[FROM.GetNameDefCap] прийняв наші вимоги дозволити нам використовувати [FROM.GetAdjective]і землі як базу для операцій проти держави [ETH.GetName]. Це фактично поклало кінець незалежності держави [FROM.GetName]."
 BBA_italy_anti_colonialism_events.100.c:0 "Нісенітниця!"
 BBA_italy_anti_colonialism_events.102.a:0 "Ще одна перемога робітничого класу!"
 BBA_italy_anti_colonialism_events.13.t:0 "[FROM.GetName] Прагне зміцнити зв'язки"
 BBA_italy_anti_colonialism_events.20.b:0 "Вони збожеволіли?!"
 BBA_italy_anti_colonialism_events.55.t:0 "Східна Африка голосує за вихід з держави [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.60.desc:0 "Жителі Південної Африки побачили, як доброзичливо та ефективно ми управляємо їхніми землями, і проголосували за те, щоб приєднатися до нашої адміністрації! Здається, що наші інвестиції та турбота про їхні провінції окупилися. Це, безумовно, піде на користь усім нам."
 BBA_italy_anti_colonialism_events.63.desc:0 "Можливо, це не стало повною несподіванкою, але нам, на жаль, повідомили, що народ the Близького Сходу не бажає більше перебувати під нашим правлінням. Вони відчували себе знехтуваними та експлуатованими протягом тривалого часу і тому проголосували за вихід з-під нашого управління."
 BBA_italy_bop.1.t:0 "Падіння [?ITA.ITA_lost_core.GetName]"
 BBA_italy_civil_war.100.desc:0 "Ми контролюємо італійську територію, воюючи пліч-о-пліч з італійським союзником. Ми можемо вивільнити більше наших сил і спрямувати їх в інше місце, передавши ці території під контроль [RDS.GetName]."
 BBA_italy_civil_war.3.t:0 "$ITA_gappisti$"
 BBA_italy_colonial_management_albanian_states:0 "Албанські регіони"
 BBA_italy_communist_events.08.a:0 "Вони це не продумали..."
 BBA_italy_decide_the_fate_of_mussolini.1.a:0 "Нехай постане перед судом."
 BBA_italy_human_torpedo_raid.1.t:0 "Рейд проти [?ITA.ITA_raided_state_var.GetName]"
 BBA_italy_interaction_events.18.desc:0 "[ITA.GetNameDef] звернулася до нас із привабливою пропозицією. Вони пропонують нам право власності над Родосом та Додеканеськими островами в обмін на союз із ними. Ця пропозиція здається майже занадто гарною, щоб бути правдою, але це не так. Що ж нам робити?"
 BBA_italy_interaction_events.30.b:0 "І чому ми повинні довіряти італійцю?"
 BBA_italy_interaction_events.31.desc_no_war:0 "Сьогодні італійський уряд звернувся до нас з цікавою пропозицією. Вони кажуть, що хочуть ратифікувати Фронт Стрези, забезпечивши свою підтримку нашій стороні у випадку, якщо в Європі розпочнеться війна. Однак для того, щоб підписати цю угоду, вони вимагають територіальних поступок, наразі регіони [269.GetName] та [903.GetName]. Як ми повинні реагувати? Вони принаймні тимчасово платитимуть нам, якщо ми погодимося."
 BBA_italy_interaction_events.31.t:0 "[NegotiatingItalianClaimsTitle]"
 BBA_italy_interaction_events.42.t:0 "[FROM.GetName] приймає нашу пропозицію"
 BBA_italy_interaction_events.70.a:0 "Ми зачекаємо."
 BBA_italy_interaction_events.9.a:0 "Все йде за планом."
 BBA_italy_missiolinis.05_south.t:0 "Успіх на півдні Ефіопії"
 BBA_italy_missiolinis.121.t:0 "Підкорення Греції"
 BBA_italy_missiolinis.32.a:0 "Ми мусимо докласти більше зусиль."
 BBA_italy_missiolinis.72.t:0 "Мізерні ВПС"
 BBA_italy_naval_cooperation_programs.07.a:0 "Час застосовувати отримані знання на практиці!"
 BBA_italy_naval_cooperation_programs.10.desc:0 "Уряди держави [FROM.GetName] не так легко було переконати придбати наші старі та застарілі ескортні кораблі, як ми сподівалися. Ми мусимо звернутися до інших, щоб позбутися цих застарілих суден."
 BBA_italy_naval_cooperation_programs.12.t:0 "Есмінці класу \"Аквіла\" прибувають до Іспанії"
 BBA_italy_naval_cooperation_programs.17.t:0 "[ITA.GetAdjective]і карликові підводні човни прибувають до [ROOT.GetName]"
 BBA_italy_second_italo_ethiopian_war.2.t:0 "[FROM.GetName] приймає [ROOT.GetAdjective]у пропозицію миру"
 BBA_swiss_expansion.1.desc:0 "Попри всі зусилля наших пропагандистів, демократія не поширилася настільки, як ми очікували, у кантонах [?SWI.SWI_influence_target_state.GetName], тож, на жаль, ми вважаємо, що референдум щодо приєднання до нас не буде успішним.\n\nАле це не означає, що ми маємо зупинитися — ми посадили зерно, яке можна виростити далі, що підвищить наші шанси наступного разу."
 BBA_switzerland.5.desc:0 "Влада [SWI.GetName] оголосила, що Давід Франкфуртер, який зізнався у вбивстві представника Закордонної організації нацистської партії в Давосі, отримає справедливий суд згідно із законами Граубюндену, як і в будь-якій іншій справі про вбивство.\n\nЗ огляду на те, що Густлофф був офіцером нацистської партії, а також на наш вплив на беззахисного сусіда, ми могли б надіслати адвоката для представлення вдови Густлоффа та просування бажаного результату. Таким чином ми можемо гарантувати покарання, відповідне його злочину.\n\nЗ прагматичної точки зору, це також може змусити [SWI.GetNameDef] нарешті визначитися зі стороною, розбивши цю крихку завісу нейтралітету, якою вони так пишаються."
 BBA_switzerland.7.a:0 "Що ж, буває."
 BBA_switzerland.97.desc:0 "Під виглядом європейського туру зі своєю музично обдарованою родиною, ветеран-капітан підводного човна перетнув наш кордон з Австрії та пропонує свої послуги [ROOT.GetNameDef] в обмін на притулок.\n\nГеорг фон Трапп має вражаючий послужний список в австро-угорському флоті, але після закінчення Великої війни, розпаду імперії та втрати статків, він виступав зі своєю родиною співаків та музикантів. Після анексії Австрії [GER.GetNameDef], його намагаються примусово мобілізувати, тож він утік.\n\nБезперечно, його музичний талант буде не менш цінним, ніж досвід у флоті — особливо зважаючи на те, що ми маємо узбережжя, але не маємо персоналу для його оборони."
 BBA_switzerland_fascist.1.t:0 "[FROM.GetNameDefCap] просить нашого захисту"
 BBA_switzerland_trade.1.c:0 "Нам не потрібна допомога від безхребетної нейтральної країни"
 BBA_switzerland_trade.6.t:0 "[FROM.GetNameDefCap] приймає нашу торгову пропозицію!"
 BEG_communism_ADJ:0 "Фунджі-гумузьк"
 BEL_aid_for_spain:0 "Допомога Іспанії"
 BEL_autonomy_collaboration_government:0 "$OVERLORDADJ$а $NONIDEOLOGY$"
 BEL_belgian_special_forces:0 "[ROOT.GetAdjective] спеціальні сили операцій"
 BEL_closer_european_union_cat:0 "Розвиток Європейського Союзу"
 BEL_degrelle_desc:0 "Леон Дегрель, лідер партії Рексистів і один із найвідоміших фашистів в [BEL.GetName], деякий час агітував проти чинного керівництва, успішно розкривши їхню корупцію публіці. Після падіння уряду Ван Зееланда король втрутився та призначив Дегреля новим прем'єр-міністром."
 BEL_demand_further_gallic_concessions_tt:0 "Відкриває можливість приймати рішення для §YОтримати корони на галльські претензії§!, після того як ми візьмемо їх під контроль."
 BEL_develop_belgian_air_industry:0 "Розвивати бельгійську авіаційну промисловість"
 BEL_doctrinal_innovations:0 "Доктринальні інновації"
 BEL_dyle_plan_desc:0 "Незважаючи на всі наші публічні оголошення про нейтралітет та військовий неприєднання, за закритими дверима ми продовжуємо співпрацювати з нашими стратегічними партнерами та розробляти плани та контингентні заходи на випадок вторгнення. Загальна ідея полягає в тому, щоб триматися якомога довше за річкою Маас, поки експедиційні сили не зможуть прибратися для підкріплення наших оборонних ліній."
 BEL_emergency_measures_on_production_front:0 "Ввести надзвичайні заходи на виробничому фронті"
 BEL_fighter_equipment_1_short:0 "Fantôme"
 BEL_government_of_national_unity_desc:0 "Попри зростаючий опір з боку фашистського руху, демократичні Ліберальна, Соціалістична та Католицька партії об'єдналися під керівництвом Поля ван Зееланда, сформувавши новий Уряд національної єдності."
 BEL_invite_german_tank_organization:0 "Запросити [GER.GetAdjective] розробників танків"
 BEL_iron_wall_desc:0 "Наші Бельгійські ворота довели свою ефективність як серйозний бар'єр для маневрів ворога під час випробувань, тому ми повинні розгорнути їх по всій країні, щоб зупинити тих, хто наважиться нас атакувати."
 BEL_join_axis:0 "Приєднатися до Осі"
 BEL_la_dame_blanche_desc:0 "Ля Дам Бланш, або Біла Леді — це підпільна організація спротиву під час Великої війни. Вальтер Дюве, лідер руху того часу, тихо готувався до того, щоб Бельгія знову була окупована, і тепер настав час знову використати можливості цієї організації."
 BEL_maritime_phoenix:0 "Морський фенікс"
 BEL_mio_trait_fonderie_royale_canons:0 "Гармати Fonderie Royale"
 BEL_mobilize_the_nation:0 "Мобілізація нації"
 BEL_national_redoubt_at_antwerp_desc:0 "Історичним наріжним каменем нашої оборони завжди був Антверпен. Ми оновимо фортифікації в цьому місті і використаємо його як опору для зміцнення решти країни."
 BEL_naval_doctrine:0 "Морська доктрина"
 BEL_support_the_rexists_desc:0 "Тепер, коли Дегрель став прем'єр-міністром, пора нагородити партію, яка підтримала його в досягненні цієї посади, і просувати старших членів до кабінету."
 BEL_the_french_horse_and_the_red_rider:0 "Французький кінь і червоний вершник"
 BEL_the_king_surrenders_desc:0 "Несподівано король Леопольд III скористався своїми повноваженнями головнокомандувача, щоб запропонувати безумовну капітуляцію всіх бельгійських військових частин перед ворогом. Офіційно це було зроблено з метою збереження якомога більше життів, але ходять чутки про темніші мотиви."
 BEL_vickers_armstrong_bel_organization:0 "Vickers-Armstrong Belgium"
 BHR_fascism_DEF:0 "Новий Усфурідський емірат"
 BIA_democratic_DEF:0 "Республіка Біафра"
 BLC_fascism:0 "Белуджійське ханство"
 BM_AMPH_PENALTY_DESC:0 "Висадка з моря — важка операція. Для найкращого результату використовуйте легкі дивізії морської піхоти. За можливості проведіть бомбардування з моря корабельними гарматами."
 BM_HATES_COUNTRY_ON_CORE_DESC:0 "Ваші війська отримують бонуси на своїх національних землях, борючись з певними державами."
 BOOST_PARTY_SELECT_TT:0 "$NAME|Y$ (ідеологія — $IDE|Y$) має популярність §Y$CURR|2$%§! і під нашим впливом вона зміниться на §G+$CHANGE|2$§! завдяки:\n$WHY$"
 BRA_BLITZKRIEG_DESC:0 "Жетулью Варгас захопив контроль над урядом і призупинив демократичний процес. Після того, як його владні повноваження на певний час забезпечені, бразильський лідер зосередив свою увагу на міжнародних справах. Війна в Європі здається неминучою, і параноя щодо аргентинського вторгнення на бразильську територію не дає спокою керівництву країни. Але є надія, що союз зі Сполученими Штатами може допомогти забезпечити майбутнє Бразилії."
 BRA_German_tank_exchange:0 "Обмін інформацією про танки з Німеччиною"
 BRA_berlin_accords:0 "Укласти Берлінські угоди"
 BRA_counter_influence_decision:0 "Натиснути на про-[BRA.GetFlag]§Y[BRA.GetAdjective]их§! комуністів"
 BRA_demand_portugese_territory:0 "Вимогти португальські колонії"
 BRA_domestic_arms_industry_desc:0 "Міжнародна ситуація стає все більш напруженою, що призвело до того, що великі нації-виробники зброї у світі обмежують свій експорт обладнання. Нам потрібно швидко розвивати власну збройову промисловість, якщо ми хочемо підтримувати наші військові сили у повній міцності."
 BRA_establish_caloi:0 "Заснувати фабрику Caloi"
 BRA_expand_colonial_empire_desc:0 "З нашим недавнім розширенням за кордоном ми тепер маємо плацдарм, з якого можемо розширювати наше панування в Африці. Хоча більша частина континенту залишається під домінуванням європейських великих держав, є багато багатих на ресурси регіонів, готових до захоплення."
 BRA_financial_stimulation_desc:0 "В останні роки ми заклали основи міцної економіки, створивши нові галузі промисловості та інфраструктурні проєкти. Щоб підтримувати зростання, нам потрібно лише смикати важелі центрального банку та національних галузей промисловості."
 BRA_german_subs:0 "Німецька програма розробки субмарин"
 BRA_implement_article_138_desc:0 "Стаття 138 Конституції 1934 року стверджувала, що уряд повинен допомагати сім'ям із багатьма дітьми. Ця розмита стаття стосувалася б більшості сімей, що означало б, що будь-яка допомога призведе до значних витрат. Однак, запровадивши базові системи соціального забезпечення для таких сімей, ми могли б витягти мільйони з бідності за одне покоління."
 BRA_infantry_equipment_2:0 "M1 Thompson"
 BRA_integrity_of_the_fatherland_desc:0 "$BRA_getulio_vargas$ був корисним політичним союзником, але він дбає лише про владу й не є справжнім інтегралістом. З нашою широкою підтримкою по всій країні, нам слід зробити крок, щоб усунути президента й установити на посаді істинно віруючого, такого як $BRA_plinio_salgado$."
 BRA_international_brigades:0 "Інтернаціональні бригади"
 BRA_invest_in_railways_bonus:0 "Бонус до залізниць"
 BRA_launch_the_revolution_tt:0 "Розпочне §Yкомуністичну революцію§! в [BRA.GetNameDef]. Кількість дивізій, які ми отримаємо, залежатиме від висоти підтримки партії §Y[BRA.GetCommunistParty]§!.\n§RЦе призведе до комуністичної громадянської війни проти Демократичної партії!§!"
 BRA_paraguay_intervention_desc:0 "[PAR.GetNameDefCap] став надто нестабільним та непередбачуваним. Заради нашої власної національної безпеки ми повинні втрутитися в їхні національні справи та стабілізувати їхній уряд."
 BRA_promote_agriculture:0 "Відновити кавових баронів"
 BRA_promote_agriculture_desc:0 "Так звані «Кавові барони» були ключовими у допомозі нам отримати достатню підтримку для відновлення монархії. Тепер ми винагородимо їх, залучивши до уряду для нагляду за реконструкцією економіки."
 BRA_provoke_argentina_desc:0 "Зрозуміло, що [ARG.GetName] бажає ізолювати та знищити нас, але якщо ми діятимемо надто поспішно, щоб запобігти цьому, ми можемо постраждати від гніву [USA.GetName]. Натомість ми спровокуємо [ARG.GetAdjective]ий народ, щоб вони вистрілили першими, і ми нарешті помстимося за Цисплатинську війну!"
 BRA_radio_nacional:0 "Radio Nacional"
 BRA_revive_the_anl_tt_2:0 "Після успішного повалення нинішнього уряду стануть доступні радники, які підтримують §YНаціональний визвольний альянс§!."
