 CONFIRMDELETEUNITS:0 "Розформувати дивізії"
 CONGO_establish_cometro_desc:0 "Force publique виконала важливу роль у забезпеченні інтересів [BEL.GetAdjective] в Конго, однак це не є професійною військовою організацією, відповідною суворим стандартам європейських збройних сил. Час для реальної армії вступити в гру."
 CONGO_expand_force_publique_recruitment_desc:0 "Попит на сили Force publique зростає, тому потреба в нових призовах також збільшується. Ми повинні запропонувати більші стимули для заохочення місцевого населення приєднуватися до служби."
 CONGO_force_publique_desc:0 "Спочатку задуманий як колоніальна поліція, під час Великої війни він був мілітаризований і боровся проти німецької Африки з великим визнанням. Давайте продовжимо цю розбудову і доведемо колоніальну силу до сучасних стандартів."
