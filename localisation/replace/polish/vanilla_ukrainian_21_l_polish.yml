 MUN_czech.1030.d:0 "[FROM.GetNameDefCap] вимагає, щоб ми стали частиною їхнього союзу, оскільки вони прагнуть його розширити. Хоча вони апелюють до різних країн регіону з різних причин: панславізм, панбалканізм, а для інших — спільна історія в Австро-Угорській імперії, ця пропозиція також містить явну приховану погрозу на випадок нашої відмови."
