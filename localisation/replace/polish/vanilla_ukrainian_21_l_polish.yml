 IRQ_political_events.16.a:0 "Ми їх винагородимо, якщо місцеві жителі не матимуть заперечень."
 IRQ_political_events.34.a:0 "Арабський світ сьогодні плаче."
 IRQ_political_events.41.desc:0 "У несподіваному розвитку подій, уряд [FROM.GetNameDef] погодився передати владу над нами [FROM.FROM.GetNameDef]. Багато хто в нашому уряді ставить під сумнів, чи справді ця угода відповідає нашим інтересам, чи нас використовують як пішака у більшій геополітичній грі. Настав час вирішити, чи приймемо ми цю передачу, чи будемо чинити опір нав'язуванню іноземного контролю."
 IRQ_political_events.42.t:0 "[FROM.GetNameDefCap] відхиляє запит"
 IRQ_revoke_anglo_iraq_treaty:0 "Скасувати Англо-іракський договір"
 IRQ_united_arab_republic_democratic_DEF:0 "Об'єднані Арабські Держави"
 IRQ_united_arab_republic_neutrality:0 "Об'єднана Арабська Республіка"
