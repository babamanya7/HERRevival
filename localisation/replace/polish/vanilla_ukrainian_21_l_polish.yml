 PLU_neutrality:0 "Палау"
 PNG_democratic:0 "Папуа Нова Гвінея"
 PNG_neutrality_DEF:0 "Федерація папуаських народів"
 POLITICAL_EQUIPMENT_TYPE_BONUS_ENTRY:0 "$ARCHETYPE$:"
 POLITICS_GOAL_SUCCEEDED:0 "Ціль виконана!"
