 peace_conference_spiritual_mob_modifier_japan:0 "\nЯкщо ситуація розвиватиметься не на нашу користь, іноземним націям стане помітно дорожче виконати §Hаннексію§! наших земель на внутрішніх територіях."
 peninsular_focus_desc:0 "Ми мусимо упередити і сповільнити ворога, який спускається з півночі через Малайю, ще до того, як він досягне Сінгапуру."
