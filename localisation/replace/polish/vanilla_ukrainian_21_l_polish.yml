 MAN_tsr_chinese_leadership_tt:0 "Відмикає сукупність рішень, котрі дозволяють попросити державу [JAP.GetNameDef] об'єднати інші маріонеткові адміністрації в Китаї з нами."
 MAN_tsr_proclaim_the_republic_of_china_desc:0 "Маючи під контролем усі столиці, ми нарешті можемо проголосити себе Китайською Республікою та законним наступником Бейянського уряду. Що принесе майбутнє, ще належить побачити, але наразі ми принесли демократію всьому Китаю, і, сподіваємось, так залишатиметься тисячу років."
