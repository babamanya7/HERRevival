 GER_is_forming_hre:0 "Пишність нашої кайзеріни не знає меж, як і кордони нашої нації. Тепер вони виросли, щоб охопити межі старої Священної Римської Імперії, і нації на нашому шляху більше не можуть заперечувати проти нашої політики. Кайзерін постановив, що теперішня можливість буде використана, і що нація повинна прийняти свою роль як духовного наступника Священної Римської Імперії. Aquila Elegit Iovis Omnia Vincit!"
