 SIA_the_provincial_council_of_state:0 "Провінційна державна рада"
 SIA_the_provincial_council_of_state_desc:0 "Бої залишають державний механізм зламаним, а владу невизначеною. Поки молодий король Ананда не зможе правити від свого імені, Провінційна державна рада повинна виконувати функції тимчасового уряду і проголосити, що лоялісти борються не за себе, а за відновлення законної монархії."
 SIA_the_regency_of_songsuradet_desc:0 "Сонгсурадет — не ліберал, але він і не сліпий до потреб сучасної держави. Як регент, він може зберегти королівську владу, довіривши майбутнє [ROOT.GetNameDef] дисципліні, плануванню та військовій програмі національного розвитку."
 SIA_the_royal_police_counterweight_tt:0 "Якщо почнеться §YГромадянська війна§!, Королівська поліція підтримає нас, надавши §Y2§! додаткові дивізії."
 SIA_united_against_aggression_desc:0 "Жоден член нашого договору не залишиться наодинці. Незалежно від того, чи походить загроза від імперій, фашизму, мілітаризму або опортуністичних сусідів, нації Азії відповідатимуть разом."
 SIA_use_ships_as_generators_tt:0 "Розміщення §YВеликих кораблів§!, якими ми володіємо, у §YПортах національних регіонів§! дасть нам бонус §G-2%§! до Енергоспоживання фабриками на кожен §YВеликий корабель§!, максимум до §G-15%§!.\n\nКоли ці кораблі покинуть порт, бонус відповідно зменшиться, але його можна відновити, повернувши кораблі в порт."
