 knilm:0 "[INS_knilm_name]"
 landmark_hakko_ichiu_desc:0 "Вежа «Хакко Ічіу» була зведена на честь 2600-ї річниці заснування Японії та як пам’ятник, що символізує японське призначення — об’єднати вісім кутів світу під одним дахом."
