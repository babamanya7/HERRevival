 USA_main_battle_tanks_desc:0 "Накопичений бойовий досвід переконливо доводить, що танк повинен справлятися з безліччю різних завдань, від підтримки піхоти до знищення ворожих танків. Розробивши техніку з урахуванням цих вимог, ми зможемо спростити виробництво."
