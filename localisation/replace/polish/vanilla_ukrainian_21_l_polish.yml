 convoy_protection_focus_desc:0 "Хоча це підла та боягузлива тактика, не можна виключати, що вороги завдаватимуть ударів по нашим торговим судам, що перевозять товари та ресурси по всій імперії. Ми мусимо зрозуміти, як нам краще захистити свої кораблі, якщо це станеться."
