 MEX_decision_pardon_cristero_fighter_desc:0 "Президент Кальєс значною мірою винен у розпалюванні війни крістерос. Зараз він «відійшов від справ», тож ми можемо дотримуватися формальностей і залучати талановитих і відданих бійців крістерос до наших збройних сил."
