 LAT_GER_fascism_autonomy_dominion_DEF:0 "Латвія"
 LAT_baltic_unification:0 "Об'єднання Балтії"
 LAT_baltic_unification_desc:0 "$LIT_baltic_unification_desc$"
 LAT_consecrate_the_brotherhood_desc:0 "Хоч балтійські народи багато в чому несхожі, вони все одно брати. Наші культури різняться, але ми століттями воюємо із спільними ворогами і вирішуємо спільні проблеми. Щоби не дати чужинцям підкорити нас, ми мусимо об'єднатися в одну державу."
 LAT_empower_paramilitarists_desc:0 "Збройні сили Латвії корисні країні і, безперечно, перевищують за чисельністю будь-яке воєнізоване угруповання, але ми не можемо більше ігнорувати тих, хто готовий ризикувати життям заради країни, не розраховуючи на нагороди чи славу."
 LAT_events.1.a:0 "[SOV.GetNameDefCap] — ось хто справжня загроза!"
 LAT_events.5.d:0 "Тепер, коли Західна Білорусь міцно перебуває під контролем альянсу [Root.GetFactionName], диктатор держави [From.GetNonIdeologyName] оголошує про свій інтерес у підставі окупаційної зони Остланд під [From.GetAdjective]им управлінням. Пропозиція бул висунута через бажання пропагувати фашистську ідеологію по всій Балтії та Білорусі та просувати інтереси альянсу [Root.GetFactionName] на Сході."
 LAT_events.501.d:0 "Передача остландських територій у [Root.GetAdjective] руки пройшла успішно: [From.GetNameDef] погоджується, що окупація країн Балтії та Західної Білорусі має проводитись виключно державою [Root.GetNameDef]."
 LAT_events.7.b:0 "Можливо буде краще, якщо [Root.GetLeader] піде у відставку."
 LAT_ostland:0 "Остланд"
 LAT_promote_falange_militancy_desc:0 "У державі [From.Owner.GetNameDef] є ті, хто тримає гнів балтів у своїх серцях, і наш обов'язок — надати їм військову та політичну підтримку, на яку вони заслуговують."
 LAT_renew_kviesis_term_desc:0 "Албертс Квіесіс показав себе компетентним прем'єр-міністром, і, хоча сам він — реліквія колишнього демократичного уряду, Квіесіс так само лояльний Улманісу, як будь-хто з діючого кабінету."
 LBA_GER_autonomy_satellite_DEF:0 "Норд-Африка"
