 treaty_org.4.desc:0 "Останньої ночі уряд держави [FROM.GetNameDef] оголосив про заснування Організації Північноатлантичного договору — цей дипломатичний маневр був довгоочікуваним, але дещо беззубим. Пообіцявши прихід сприятливої епохи співробітництва цивільних, військових і розвідувальних служб, це рішення було негативно оцінене вищими чинами держави [SOV.GetNameDef].\n\nСхоже, мир може проіснувати не дуже довго."
 tsr_manchukuo.1.desc:0 "Позиція Імператора завжди була дещо болючим питанням для статусу Маньчжурії як імперії. Оскільки нація фактично діє як республіка під правлінням прем'єр-міністра Чжан Цзінхуея та Квантунської армії, Імператор є дуже слабким, виконуючи роль лише номінальної фігури. Однак все це може змінитися, оскільки деякі офіцери Квантунської армії переконані, що для процвітання нації трон повинен бути міцно в руках Імператора. Але є й ті, хто вважає Пуї слабким і ненадійним, і волів би, щоб трон дістався його брату Пуцзє, який здобув освіту в Японії."
 tsr_manchukuo.12.a:0 "Ці кляті бандити!"
