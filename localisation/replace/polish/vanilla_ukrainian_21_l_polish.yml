 usa.45.t:0 "Комітет Палати підтримує президентську політику"
 usa.61.desc:0 "Старший сенатор штату [USA_congress_investment_state.GetName] звернувся до уряду з пропозицією підтримки. Його держава страждає від критичної нестачі інвестицій, і ініційована урядом програма стимулювання економіки, безсумнівно, змусила б його переглянути свою позицію щодо певних пропонованих урядових стратегій. Сенатор бере участь у кількох важливих комітетах і досить відомий тим, що вміє укладати угоди, завдяки чому його голос коштує кілька разів більше в обох палатах."
 usa.61.t:0 "Сенатор штату [USA_congress_investment_state.GetName] пропонує підтримку"
 victory_parade:0 "Парад перемоги"
