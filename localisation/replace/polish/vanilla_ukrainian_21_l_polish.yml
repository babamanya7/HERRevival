 NSB_poland_communist_events.502.t:0 "[From.GetNameDef] приймає [Root.GetAdjective] незалежність"
 NSB_poland_democratic_events.1.b:0 "Міколайчик за народ, він наш лідер."
 NSB_poland_events.1.b:0 "Ми не боятися Польщі!"
 NSB_poland_events.202.a:0 "Вони не залишають нам вибору."
 NSB_poland_events.601.b:0 "Давайте не будемо ускладнювати ситуацію."
 NSB_poland_royal_election.4.b:0 "Можливо, ми надто рано відмовилися від Фрідріха Крістіана..."
 NSB_poland_royal_election.4.desc:0 "«Варшавський замок, прикрашені орли — так, я пам'ятаю. Я єдиний істинний король Польщі». Романових, як і раніше, має права на польський трон і вона, як остання з роду, має стати царицею. Претензії Анастасії засновані не тільки на праві Романових на престол Польщі, але й на легітимності її роду. справді та сама Анастасія, але багато хто вважає її ексцентричною, про що щосили трубить преса. Хоч її претензії і сумнівні, вона остання в списку кандидатів, і відкинути її — значить залишити Польщу такою, якою вона була спочатку: з порожнім троном, що пилиться."
 NSB_soviet_civil_war_common.006.a:0 "Добре"
 NSB_soviet_civil_war_common.114.t:0 "Українське повстання"
 NSB_soviet_civil_war_common.120.a:0 "Це погано."
 NSB_soviet_comecon.2.t:0 "[FROM.GetAdjectiveCap]а програма військового розвитку для країн РЕВ"
 NSB_soviet_communist_civil_war.001.desc:0 "Товариші! Настав час знову стати під прапори війни за революцію. Перш ніж ми зможемо врятувати пролетаріат, потрібно отримати контроль над державою [ROOT.GetNameDef]. Подібно до того, як ми перемогли білі армії, ми мусимо тепер тих, хто стоїть на шляху істинної революції для нашої батьківщини. Потрібно вирішити, хто стане нашим лідером у цій боротьбі."
 NSB_soviet_fascist_tsarist.24.a:0 "Дуже прикро. Це, звичайно ж, не тому, що вони щось задумують?"
 NSB_soviet_fascist_tsarist.25.t:0 "Токійська вісь"
 NSB_soviet_fascist_tsarist.31.a:0 "Ми впораємося і без них."
 NSB_soviet_fascist_tsarist.4.a:0 "Нам треба бути напоготові, інакше нас завоюють без бою."
 NSB_soviet_foreign_politics_events.260.b:0 "Війна ще може обернутися на нашу користь."
 NSB_soviet_foreign_politics_events.264.a:0 "[FROM.GetLeader] приймає мудре рішення."
 NSB_soviet_foreign_politics_events.267.t:0 "[FROM.GetNameDef] відкидає нашу пропозицію оборонного пакту"
 NSB_soviet_foreign_politics_events.277.a:0 "Хіба могли вони відмовитися від такої пропозиції?"
 NSB_soviet_nationalist.003.desc:0 "[FROM.GetLeader] не бачить причин відкидати наші законні вимоги. [FROM.GetNameDef] повернеться до складу імперії, зберігши певне право на самоврядування."
 NSB_soviet_paranoia_system_events.22.t:0 "Змова в академії"
 NSB_soviet_paranoia_system_events.28.desc:0 "Надходять доповіді про розвинену мережу офіцерів, які вважають, що [Root.GetLeader] не в змозі компетентно керувати військовими справами. Заарештовані за обвинуваченням у підбурюванні до заколоту, саботажі та антирадянському мисленні Ми давно сумнівалися в лояльності генералів, але тепер нам здається, що довіряти не варто навіть майорам і полковникам."
 NSB_soviet_paranoia_system_events.42.desc:0 "Недавні розслідування у ВПС виявили велику кількість аварій та нещасних випадків під час навчання. Більше того, багато наших найсучасніших літаків не повністю боєздатні і чекають ремонту. Поки неясно, як таке могло статися, але [Root.GetLeader] стурбований можливістю саботажу та вимагає провести повне розслідування."
 NSB_soviet_paranoia_system_events.48.b:0 "Їхня робота надто важлива."
 NSB_soviet_policies_of_collective_security.2.desc:0 "Уряд держави [FROM.GetNameDef] у принципі погодився на запропонований нами пакт про взаємодопомогу. Прибула делегація дипломатів, щоб обговорити подробиці втілення положень у життя."
 NSB_soviet_spanish_civil_war.3.t:0 "Радянські десантники прибувають до міста [ROOT.capital.GetName]"
