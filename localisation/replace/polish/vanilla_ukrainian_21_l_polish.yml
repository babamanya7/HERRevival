 CZE_aggressive_wars:0 "Загарбницькі війни"
 CZE_ally_with_moderate_socialists_desc:0 "Не кожна країна готова прийняти комунізм виборчим шляхом або розвинути захоплення таким лідером, як [SOV.GetLeader], тому нам не слід уникати співпраці з більш поміркованими рухами."
 CZE_ally_yugoslavia:0 "Укласти союз із [YUG.GetName]"
 CZE_balkan_tech_sharing_group_name:0 "Little Entente Science Committee"
 CZE_battleship_catchup_1_desc:0 "Необхідність будівництва флоту вилилася в стрімку розробку проєктів лінкорів."
 CZE_build_off_old_ganz_danubius_designs_desc:0 "Відродження проєктів компанії «Ганц-Данубіус» може виявитися корисним для будівництва нових кораблів класу крейсер. Люди, обізнані з цими проєктами, досі живуть у межах наших кордонів."
 CZE_build_skoda_office_middle_east:0 "Побудувати представництво «Шкоди» на Близькому Сході"
 CZE_continue_avia_expansion:0 "Продовжити розширення компанії «Авіа»"
 CZE_decrease_autonomy_tier:0 "Кожен суб'єкт рівня §Y$autonomy_dominion$§! або §Y$autonomy_puppet$§! втратить один рівень автономії."
 CZE_demand_overlordship_of_yugoslav_league_desc:0 "Хоча ми так само добре, як і [YUG.GetName], знаємо, що місцева автономія іноді необхідна в багатонаціональній країні, їхній альянс зараз занадто слабкий, щоб захистити себе. Ми повинні закликати [YUG.GetNameDef] визнати це і дозволити нам втрутитися."
 CZE_divide_nation_title_dynamic_ukrainian_states:0 "$MUN_czech.1032.t$ у регіоні [73.GetName]"
 CZE_establish_the_fall_backlines_desc:0 "Ми повинні бути реалістами щодо того, що в деяких місцях наша оборона буде прорвана. Якщо це станеться, наявність готових ліній відступу стане вирішальним фактором між перемогою та поразкою."
 CZE_exclude_the_slovaks:0 "Чеська єдність"
 CZE_focus_on_export_designs:0 "£BoP_left_texticon Фокус на експортних розробках"
 CZE_form_a_federation:0 "Формування Федерації"
 CZE_fortify_the_polish_border_with_72_desc:0 "Польська агресія не знає меж, але сподіваємося, що добре укріплений кордон змусить їх шукати легшу ціль."
 CZE_go_right_desc:0 "Лише фашизм може привести чеський народ до величі! Європейські демократії приречені на вимирання; лише сильні держави — фашистські держави — виявляться за столом переговорів, коли справа дійде до розділу держав, що програли!"
 CZE_gun_smuggling_tt:0 "Контрабанда зброї до країни"
 CZE_heavy_fighter_equipment_1_short:0 "E-49"
 CZE_infantry_equipment_3:0 "Koucký ZK 412"
 CZE_intervene_in_the_ussr:0 "Втрутитися у [SOV.GetAdjective]у громадянську війну"
 CZE_joint_equipment_designs_desc:0 "І [ROOT.GetNameDef], і [GER.GetNameDef] знаходяться в авангарді танко- та авіабудування, кожна зі своїми особливостями. Ми маємо прагнути ділитися інформацією, щоб і надалі зосереджуватись на тому, що в нас виходить найкраще."
 CZE_king_of_the_castle_desc:0 "Ми всі знаємо, хто насправді керує в нашому уряді. У час великої невизначеності варто припинити прикидатися і дозволити $CZE_edvard_benesh$ керувати більш прямо. Від цього залежить безпека нашої країни."
 CZE_mechanized_equipment_3_short:0 "V3S-O"
 CZE_merge_the_oil_companies:0 "Об'єднати нафтові компанії"
 CZE_political_direction_desc:0 "Наша демократія ще молода і недосвідчена. Дивлячись на розквіт фашизму та комунізму по всій Європі, ми змушені поставити запитання: чи правильним курсом ми йдемо, і якщо ні, то який курс правильний?"
 CZE_rally_against_germany_desc:0 "Чехословаки хоробро боролися за свою незалежність, і тепер ми повинні закликати всіх людей захистити цю незалежність."
 CZE_reassure_the_army:0 "Заспокоїти армію"
 CZE_rocket_artillery_equipment_1_short:0 "RKP 1"
 CZE_second_sudetenland_fortification_program:0 "Друга Судетська програма фортифікації"
 CZE_seek_french_leadership:0 "Шукати [FRA.GetAdjective]ого лідерства"
 CZE_send_observers_to_the_italo_ethiopian_war_desc:0 "Таємне відправлення осіб для спостереження та встановлення контактів з учасниками бойових дій на місцях забезпечить цінне розуміння сучасної військової доктрини. Це також може відкрити деякі інші можливості."
 CZE_shipbuilding_legacy:0 "Кораблебудівна спадщина"
 CZE_shrink_educational_disparities_desc:0 "Нашим сільським районам бракує належної освіти, яка пропонується в містах. Ми повинні боротися з цією нерівністю за допомогою великих освітніх програм, спрямованих на ці території."
