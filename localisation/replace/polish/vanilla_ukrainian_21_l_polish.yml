 mtg_britain.12.d:0 "Підтримка короля, здається, зростає серед нижчих класів народу. Вони не тільки не бачать нічого поганого в тому, що король одружується з «простолюдинкою», але, здається, навіть обожнюють казкову історію про «простолюдинку», яка завоювала серце короля і вийшла заміж за короля."
 mtg_britain.15.d:0 "Британський уряд був потрясений до глибини душі заявою про те, що король бажає одружитися з розлученою жінкою низького походження Уолліс Сімпсон. Це викликало обурення як серед членів парламенту, так і серед громадськості, оскільки опоненти стверджують, що обов'язок Короля — служити насамперед своєму народу і країні, а не власному щастю. Стверджується, що Король, як глава Англіканської Церкви, яка не дозволяє розлученим вступати в шлюб, не може одружитися з місіс Сімпсон.\n\nДебати зараз перекинулися на домініони, і оскільки Король не дав жодних ознак того, що він прислухається до порад свого кабінету, ми мусимо припустити, що плани щодо шлюбу не будуть змінені. Якщо ж він нав'яже свою волю, як ми мусимо реагувати?"
 mtg_britain.16.a:0 "Тоді ми мусимо порвати з Короною."
 mtg_britain.29.t:0 "[From.GetName] відкидає пропозицію вступити до альянсу"
 mtg_britain.33.d:0 "У ході недавньої ходи знову відбулися жорстокі сутички між чорносорочниками та їхніми супротивниками в особі комуністів та соціалістів. Але насильство цим не обмежилося. Немов іскра, воно спалахнуло ситуацію в країні, що ставала все більш напруженою протягом останніх місяців.\n\nПо всій країні створюються загони самооборони, що захоплюють контроль над містами та прилеглими до них районами, внаслідок чого військові змушені вирішувати, кого вони мають намір підтримувати. Якщо домініони та військово-морські сили досі підтримують те, що називає «законним демократичним урядом», то ситуація в армії не така однозначна, і багато формувань перейшли на наш бік.\n\nПочинають вимальовуватися контури поточного протистояння, а Освалд Мослі оголосив формування тимчасового уряду під керівництвом. Це допоможе тримати ситуацію під контролем до закінчення громадянської війни."
 mtg_britain.49.b:0 "Схоже на самогубство. Краще почекати."
 mtg_britain.5.a:0 "Але чи залагодить це розкол у нашій нації?"
 mtg_britain.56.a:0 "Жодної пощади."
 mtg_britain.70.t:0 "[From.GetName] відмовляється підкоритися"
 mtg_britain.95.d:0 "Політика умиротворення знаходить своїх критиків в імперії. Нам слід ще раз винести це питання на порядок денний і визнати, що зміни в дипломатичному тоні, мабуть, необхідні, але це вимагає підтримки з боку імперії."
 mtg_britain.98.d:0 "[From.GetAdjective] уряд не поділяє наших сумнівів щодо політики умиротворення, стверджуючи, що нас не можна втягувати у війну і що ми мусимо продовжувати політику умиротворення щодо тих, хто бажає перевірити нас на міцність."
 mtg_exile_leader_added.1.t:0 "[exile_nation.GetAdjective] лідер у вигнанні пропонує свої послуги"
 mtg_netherlands.1.e:0 "Передати контроль американцям — нехай ситуація ускладнюється."
 mtg_netherlands.11.a:0 "Передати їм контроль над островами."
 mtg_netherlands.12.d:0 "З метою збереження миру та визнаючи наші інтереси у багатому ресурсами регіоні, держава [From.GetNameDefCap] запропонувала передати під наш контроль всю Вест-Індію."
 mtg_netherlands.22.a:0 "Можливо, ми зможемо послужити новому уряду якось інакше..."
 mtg_netherlands.36_tt:0 "§Y[From.GetNameDefCap]§! отримає цільовий бонус до захисту та атаки проти агресора протягом 180 днів після оголошення війни проти провідної західноєвропейської держави.\n"
 mtg_netherlands.42.t:0 "[From.GetNameDefCap] ділиться військовими знаннями"
 mtg_netherlands.48.b:0 "Ми мусимо викрити \"вказівки\" принца, щоби поліпшити ситуацію."
 mtg_netherlands.5.a:0 "Все краще, ніж інший варіант."
 mtg_netherlands.50.t:0 "Принц Бернард заважає виробити стратегію"
 mtg_netherlands.53.d:0 "Схоже, відомості, надані принцом Бернардом, не відрізняються особливою точністю... Ворог постійно вдаряє по слабких ділянках, звідки ми відводимо підкріплення в райони передбачуваної атаки."
 mtg_netherlands.60.b:0 "Потрібно зняти напруженість."
 mtg_netherlands.64.d:0 "Робота над Флевополдером почалася успішно, і хоча до повного завершення проєкту ще кілька років, ми вже можемо пожинати плоди своєї наполегливої праці.\n\nОтримавши практичний досвід у такому масштабному проєкті з освоєння земель, інженери розробили нові методи будівництва доріг, залізниць і водних шляхів. Інвестувавши в ці дослідження, ми можемо досягти значного поліпшення в цих областях в найближчому майбутньому."
 mtg_netherlands.66.a:0 "Це насторожує."
 mtg_netherlands.67.b:0 "Не можна дозволити їм потрапити до [GER.GetAdjective] сфери впливу!"
 mtg_netherlands.69.a:0 "Їм доведеться потерпіти ще трохи."
 mtg_news.1.a:0 "Історія повторюється."
 mtg_news.19.a:0 "Боже, храни короля!"
 mtg_news.26.a:0 "Нехай звинувачують нас скільки їм завгодно."
 mtg_news.38.c:0 "У рядах червоних почалися зварювання..."
 mtg_news.51.a:0 "Допоможе."
 mtg_news.51.t:0 "Створення буферної держави Бенілюкс"
 mtg_news.63.desc:0 "[Root.GetAdjective]ий уряд сьогодні оголосив, що в односторонньому порядку розриває зв'язки з [ENG.GetAdjective]им урядом. Головною причиною розриву стала несумісність їхніх політичних поглядів з тим, що відбувається зараз у державі [ENG.GetName]."
 mtg_usa_civil_war_democrats.22.desc:0 "У той час, коли все більше штатів відмовляються виконувати постанови легітимного уряду, губернатори Огайо, Міссурі, Вісконсину, Іллінойсу та Мічигану прийняли спільну декларацію про те, що вони не мають наміру потурати. твердження, нова громадянська війна загрожує серйозно послабити США перед зовнішньої агресії."
 mtg_usa_civil_war_democrats.40.desc:0 "Коли уряд вирушив у вигнання, а більша частина країни перейшла під контроль повстанців, генерал МакАртур зв'язався з нами і зробив пропозицію. Вказавши, що тільки він один добре розуміє психологію американців і при цьому може забезпечити керівництво під час кризи, МакАртур запропонував себе на роль глави уряду Національної оборони до повного розгрому повстанців. За його словами, будучи генералом, він зможе скоротити розбіжності між цивільними та військовими керівниками.\n\nДеякі члени уряду вже висловили деяке занепокоєння тим, що він згадує про себе у третій особі."
 mtg_usa_civil_war_fascists.10.a:0 "Справді тривожні новини."
 mtg_usa_civil_war_fascists.10.desc:0 "Учора на армійський склад зброї в штаті [GetCSAState] було скоєно напад. Озброєний натовп напав на невелику групу охорони та вимагала передати ключі від складу. Коли з найближчого гарнізону прибуло підкріплення, нападники вже зникли, забравши з собою більшу кількість ручної стрілецької зброї.\n\nОскільки охоронці не постраждали, а підкріплення не з'являлося підозріло довго, деякі представники уряду припускають, що все було сплановано."
 mtg_usa_civil_war_fascists.12.a:0 "Його бракуватиме."
 mtg_usa_foreign_support.7.desc:0 "Наша делегація в державі [From.GetNameDef] повідомляє про свої успіхи. [From.GetAdjective] військові погодилися розлучитися з частиною старих польових знарядь і відправити їх нам. Щоб ворог нічого не запідозрив, вони будуть зберігатися в секретному місці до настання потрібного моменту."
 mtg_usa_foreign_support.9.t:0 "Срібний легіон хоче створити тренувальні табори"
 mtg_usa_pacific_pacification.1.b:0 "Ми чудово зможемо захищати ці території."
 mtg_usa_secure_asia.6.t:0 "[From.GetNameDefCap] відмовляється від обговорення"
 mtg_usa_secure_asia.8.a:0 "Наша присутність у В'єтнамі знаменує собою початок нової ери миру та процвітання в цьому регіоні."
 mutiny_event.4.t:0 "The Treason In War Act"
 naval_doctrine_folder_desc:0 "Морська доктрина, яка визначає спосіб ведення війни Вашим флотом."
 naval_folder_desc:0 "Кораблі та підводні човни."
