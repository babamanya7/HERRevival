 helicopter_brigade:0 "Вертолітна бригада"
 helicopter_equipment_1_desc:0 "Літальний апарат, який покладається на ротори, що швидко обертаються, а не на крила та поступальний рух. Це означає, що він може зависати на місці та має більший контроль над вертикальними змінами висоти."
