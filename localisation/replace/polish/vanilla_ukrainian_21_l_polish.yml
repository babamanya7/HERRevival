 AFG_industrial_events.14.t:0 "[FROM.GetName] оголошує війну [ROOT.GetName]"
 AFG_industrial_events.34.desc:0 "[FROM.GetAdjective] уряд погодився на договір про воду між нашими націями за умови, що він гарантує прийнятний мінімальний потік води через кордон до них. Хоча це змусить нас не використовувати наші греблі повністю, як ми це робили досі, це принаймні дозволить уникнути будь-якої можливості конфлікту через річку Гільменд у найближчому майбутньому."
 AFG_industrial_events.50.desc:0 "Використовуючи транскордонні зв'язки нашого паштунського населення, нам вдалося успішно спровокувати їхніх родичів за кордоном на антиурядові протести та вимоги об'єднання під нашим правлінням."
