 SWI_spab_counter_intelligence_agency:0 "SpAb"
 SWI_spab_counter_intelligence_agency_desc:0 "Ми знаємо, що [GER.GetNameDef] створив навчальний центр для підготовки диверсантів п'ятої колони в Штутгарті, який отримав назву Panoramaheim. Ось чому ми повинні уповноважити Федеральну поліцію з підрозділом шпигунського абверу для боротьби з цими загрозами та боротьби з іноземним шпигунством і диверсіями."
