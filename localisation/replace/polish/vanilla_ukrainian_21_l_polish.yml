 germany.1043.desc:0 "Попри явну нерівність сил, [FROM.GetAdjective]і дипломати відхилили наші вимоги про передачу Судетської області. Безсумнівно, ми мусимо відповісти війною."
 germany.111.t:0 "Югославія відмовилась"
 germany.115.d:0 "Відповідно до Данцигської угоди, держава [From.GetNameDef] погодилася на передачу Данцига під контроль держави [GER.GetNameDef]."
 germany.116.d:0 "Проігнорувавши цінну підтримку, яку ми надали їм у їхній громадянській війні, держава [From.GetName] вирішила проігнорувати наші претензії на Данциг."
 germany.127.d:0 "Об'єднані спільною війною проти держави [SOV.GetNameDef], можливо, час формалізувати наш альянс і запросити наших нових союзників приєднатися до війни."
 germany.49.a:0 "Чехи мають бути знищені."
 germany.5.a:0 "Приєднатися"
