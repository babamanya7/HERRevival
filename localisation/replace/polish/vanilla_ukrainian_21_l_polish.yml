 INDUSTRIAL_ORG_TRAIT_TOOLTIP_TRAIT_NOT_AVAILABLE:0 "§RЦя риса недоступна§!"
 INDUSTRIAL_ORG_UNLOCK_TRAIT_POPUP_UPGRADE_VARIANTS_TOOLTIP_NO_VARIANTS:0 "§gНаразі немає жодних варіантів оснащення, на які впливає ця риса. Поліпшення не потрібне.§!"
 INFANTRY_TITLE_WEAPONS:0 "ЗБРОЯ ТА СПОРЯДЖЕННЯ"
 INSHOL_encourage_further_investment_desc:0 "Умови, узгоджені у Фольксраді, наразі вирішили політичне питання, і голландський капітал взяв це до уваги. Тарифи будуть пом'якшені, гарантії розширені, а торгові палати в Амстердамі та Роттердамі переконані, що архіпелаг залишається відкритим для бізнесу. Те, що було прибутковим за старих угод, буде прибутковим і за нових."
 INSHOL_london_batavia_accord_desc:0 "Незважаючи на те, що наші солдати краще екіпіровані та організовані, ніж республіканські ополчення, їхня переважна чисельність повернула конфлікт проти нас. Для забезпечення перемоги нам потрібна підтримка ззовні, більша, ніж більшість готова дати. [ENG.GetNameDefCap] може бути зацікавлена через свою присутність у Малайї. Можливо, їх вдасться переконати, якщо ми запропонуємо щось натомість?"
 INSHOL_padang_port:0 "Міжнародний порт у Паданзі"
 INSHOL_propose_malay_unification:0 "Запропонувати об'єднання Малайї"
 INS_anti_colonialist_bonus_desc:0 "Народ [FROM.GetName] працює на благо іноземного господаря, змушений служити не своїм інтересам. Ми нагадаємо їм, що підкорення — це вибір, і що їхні господарі не такі сильні, як прикидаються."
 INS_australian_contracts_desc:0 "Наші запаси каучуку зросли далеко за межі внутрішніх потреб. Австралія, завжди голодна до сировини для забезпечення власної промисловості, є природним торговельним партнером. Закріплення довгострокових контрактів з австралійськими фірмами принесе стабільний дохід і зміцнить наші позиції в регіональній економіці."
 INS_bangka_bauxite_export_flag:0 "Завершено фокус §Y$INS_bauxite_export$§!:"
 INS_chaos_events.4.a:0 "Віце-президент Хатта візьме владу."
 INS_communist_events.2.a:0 "Революція крокує вперед."
 INS_communist_events.4.a:0 "Надішліть війська. [FROM.GetName] наша!"
 INS_cost_text_rubber_12:0 "£resources_strip|3 §Y12§!"
 INS_cost_text_rubber_16_blocked:0 "£resources_strip|3 §R16§!"
 INS_deescalate_the_conflict_2_desc:0 "Наші рейди зробили свою справу. Колоніальний гарнізон знає межі нашого впливу, а Гаага знає, що ми не залякані. Проте кожен удар дає Нідерландам новий привід відправляти більше людей і кораблів, а ми не готові до відкритої війни. Нашим командирам буде передано наказ утриматися від вогню. Наступний удар буде завдано тоді, коли скажемо ми, а не тоді, коли нідерландці підштовхнуть нас до цього."
 INS_defenders_of_homeland_desc:0 "Уряд Ост-Індії впав, і його місце зайняв новий режим. Очолювані націоналістами та японським урядом, ми створимо нову армію, що перевершуватиме KNIL, і виграємо війну. Однак не можна заперечувати, що цей союз між націоналістами та імперіалістами є крихким. Чи триватиме цей союз, чи все закінчиться кровопролиттям?"
 INS_escalation_has_less_9_tt:0 "Рівень ескалації нижчий за §Y9§!"
 INS_fokker_name_normal:0 "Fokker"
 INS_gradual_escalation_republic_desc:0 "Нідерландські заходи у відповідь ставали все жорсткішими після кожного нашого рейду, і їхні патрулі просуваються в райони, які вони покинули місяці тому. Наші командири повідомляють про запеклі бої в місцях, які давно вважалися умиротвореними, а наші втрати зростають швидше, ніж вербувальники встигають їх замінити. Конфлікт поширився на провінції, де минулого року було тихо."
 INS_heavy_fighter_equipment_1:0 "Fokker G.I Hispano"
 INS_heavy_fighter_equipment_3_short:0 "G.I Wasp"
 INS_heavy_fighter_equipment_4:0 "P82 Twin Mustang"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt:0 "§RЦе завершить гру для вас.§!"
 INS_indonesian_assault_doctrine:0 "Індонезійська штурмова доктрина"
 INS_industrial_events.28.t:0 "Партія каучуку відправлена"
 INS_infantry_equipment_1_short:0 "M1 Garand"
 INS_light_tank_destroyer_equipment_3_short:0 "TJ-5"
 INS_limited_war_events.1.desc:0 "Ворожі лінії прорвано, і наші люди безперешкодно просуваються вперед. По той бік протоки британська клієнтська держава руйнується під тягарем народного гніву. Маріонетки Лондона думали, що їхні багнети захистять їх від історії. Вони помилялися."
 INS_limited_war_events.4.t:0 "[FROM.GetName] відкидає наші умови"
 INS_limited_war_events.7.t:0 "Наш наступ зупиняється"
 INS_local_resistance_desc:0 "Ми створимо осередки опору на території, яка ще не була окупована, гарантуючи, що якщо вона буде окупована, ми будемо готові повернути її, коли прийде час."
 INS_loyalist_events.1.desc:0 "[INS.GetLeader] зв'язався з нами щодо поточних конфліктів у всьому світі та небезпечного становища, в якому опинилася [INS.GetNameDef]. [INS.GetLeader] запропонував офіційно перевести Анрі Вінкельмана, колишнього командувача Королівською армією Нідерландської Ост-Індії, назад до [INS.GetNameDef], щоб забезпечити безпеку колонії."
 INS_loyalist_events.2.t:0 "[HOL.GetLeader] погоджується перевести Анрі Вінкельмана."
 INS_medium_tank_equipment_3_short:0 "GVT-6"
 INS_mobilize_the_pemuda:0 "Мобілізація Пемуда"
 INS_musso_ascends:0 "Піднесення Муссо"
 INS_pacific_revolution_cat:0 "Тихоокеанська революція"
 INS_political_events.1.a:0 "Як бажає королева."
 INS_political_events.18.a:0 "Побажаємо йому удачі."
 INS_prime_minister_hatta:0 "Прем'єр-міністр Хатта"
 INS_prioritize_industrial_growth_desc:0 "Наша експортна економіка занадто нестабільна і тримає нас у залежності від голландської співпраці. Ми повинні працювати над створенням обробної промисловості, будуючи заводи по всій Батавії. Ми могли б стати найбільш індустріалізованою країною в Тихому океані."
 INS_reclaiming_the_dutch_navy:0 "Повернення голландського флоту Ост-Індії"
 INS_revolution_events.1.a:0 "Ми повинні діяти швидко."
 INS_revolution_events.14.desc:0 "Незважаючи на всі зусилля нашої колоніальної поліції та солдатів, республіканські ополченці успішно розпочали військову операцію з окупації [?event_target:INS_temp_occupied_state.GetName]. Наша поліція та солдати були змушені евакуюватися і оголосили про неможливість керувати регіоном через опір ополчення. Якщо ми дозволимо ополченцям і далі помикати нами, ми ризикуємо втратити нашу велику колонію назавжди."
 INS_revolution_events.19.b:0 "Якщо ви так сильно хочете миру, то можете здатися!"
 INS_revolution_events.2.t:0 "[HOL.GetNameDefCap] просить про додаткову допомогу"
 INS_revolution_events.23.a:0 "Тепер шанси на нашій стороні."
 INS_revolution_events.33.a:0 "Відправте посередників."
 INS_revolution_events.35.desc:0 "Американці втрутилися в індонезійське питання. Вашингтон стверджує, що діє як нейтральний посередник, але наслідки очевидні. Якщо ми не зможемо вирішити цей конфлікт на їхнє задоволення, вони використають свій значний вплив проти нас. Наші переговорники повинні діяти обережно. Американська прихильність — це не те, чим ми можемо дозволити собі розкидатися."
 INS_revolution_events.6.t:0 "[ENG.GetNameDefCap] погоджується допомогти нам"
 INS_revolution_planning_influence_state_desc:0 "Ми відправимо ополченців у [FROM.GetName] для створення бази ополчення, гарантуючи, що місцеві революціонери зможуть підтримувати зв'язок зі штабом і легше виконувати операції після проголошення незалежності."
 INS_revolutionary_sentiment:0 "Співпрацювати з [FROM.GetAdjective] революціонерами"
