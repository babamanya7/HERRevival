 african_union_category_desc:0 "Ми створимо інституції, які об'єднають таланти і ресурси всього континенту і наблизять нас до політичного об'єднання. Тільки тримаючись разом і співпрацюючи, народи Африки можуть сподіватися на те, що вони не опиняться знову в ролі підданих."
