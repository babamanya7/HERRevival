 lar_spheres_of_influence.3.desc:0 "У ході дуже напруженої зустрічі, в якій брали участь [From.GetLeader] та [This.GetLeader], за лічені хвилини зникла будь-яка надія на вирішення протиріч між нашими народами. Німецька делегація не стала поступатися своїми позиціями, оголосивши, що [From.GetNameDef] вважає Бельгію, країну з помітною німецькою меншістю, об'єктом своїх інтересів і що сама думка про надання нам свободи дій щодо цієї держави є абсолютно неприйнятною."
