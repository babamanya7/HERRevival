 ENG_anti_submarine_training_school_desc:0 "Однією з наших переваг є можливість залучати до підготовки нових екіпажів великий пул кваліфікованих офіцерів з досвідом минулої війни. Під керівництвом експерта з протичовнової війни командора Гілберта Стівенсона створення нової школи з протичовнової війни в Тоберморі забезпечить нашим екіпажам необхідні навички перед тим, як вони вирушать на службу супроводу в Атлантиці та зіткнуться з загрозою підводних човнів."
