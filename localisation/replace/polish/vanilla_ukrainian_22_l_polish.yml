 CZE_CKD_plzen_organization:0 "CKD-Плзень"
 CZE_POL_union_communism:0 "Польсько-чехословацьк союз"
 CZE_ally_romania_desc:0 "[ROM.GetNameDefCap] є однією з найбільш самодостатніх країн у регіоні, що виробляє продовольство та цінну нафту. Укладення союзу з ними не лише дасть нам легший доступ до ресурсів одне одного, але й позбавить наших ворогів сировини, необхідної для ведення війни проти нас."
 CZE_bop_army_very_high_confidence:0 "Відмінно підготовлена армія"
 CZE_car_and_oil_rationing:0 "Нормування автомобілів та нафти"
 CZE_cas_focus_desc:0 "Інститут військової авіації за підсумками випробувань дійшов висновку, що нам слід зосередитись на штурмовій авіації."
 CZE_confiscate_church_lands_desc:0 "Церква контролює набагато більше земель і багатств, ніж необхідно для її цілей. Ми повинні перерозподілити частину цих земель, як ми це зробили для фермерів."
 CZE_contact_henlein_cooldown_flag_tt:0 "Поточна кількість днів: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt:0 "Якщо ми виконаємо §Y«$CZE_no_compromise_with_the_sdp$»§!, нам доведеться чекати §Y350§! днів, перш ніж ми зможемо вибрати цей §Yнаціональний фокус§!."
 CZE_deal_with_hungary:0 "Усунути загрозу з боку Угорщини"
 CZE_deepen_ties_with_puppet_kingdoms:0 "Поглибити зв'язки з маріонетковими королівствами"
 CZE_devaluate_the_koruna_desc:0 "Мати сильну валюту — це небезпечне економічне становище для країни, значна частина економіки якої залежить від експорту. Ослаблення нашої валюти може призвести до короткочасних труднощів, але в довгостроковій перспективі це піде нам на користь."
 CZE_divide_germany:0 "Розділити Німеччину"
 CZE_divide_nation_title_dynamic_sudentenland:0 "$MUN_czech.1032.t$ у Судетській області"
 CZE_field_exercises:0 "£BoP_right_texticon Польові навчання"
 CZE_fight_over_silesia:0 "Боротьба за Сілезію"
 CZE_forgive_trading_debts:0 "Пробачити торгові борги"
 CZE_go_with_vojcechovskys_plan_dynamic:0 "[CZE_go_with_vojcechovskys_plan]"
 CZE_great_moravia_DEF:0 "Велика Моравія"
 CZE_guardian_of_central_europe:0 "Вартовий Центральної Європи"
 CZE_heavy_fighter_equipment_3:0 "Letov Š-49"
 CZE_heavy_fighter_focus_desc:0 "Інститут військової авіації дійшов висновку, що для наших завдань найкраще підходять важкі винищувачі, і кістяк ВПС слід сформувати з літаків цього типу."
 CZE_infantry_equipment_1_short:0 "ZB vz. 24"
 CZE_infantry_equipment_2_short:0 "ZK 383"
 CZE_mio_trait_low_profile_ambushers_tank_destoryer:0 "Низькопрофільні засадники"
 CZE_motorization_scheme_desc:0 "Нехай у нас не найбільша армія, але ми можемо досягти більшого, маючи можливість швидко перекидати війська за допомогою моторизованого транспорту."
 CZE_mountain_bonus_desc:0 "Значна частина нашого кордону складається з гір і пагорбів, тому нам необхідний спеціальний рід військ, підготовлений для ефективної оборони подібної місцевості."
 CZE_poland_alliance_monarchist:0 "Угода з Польщею"
 CZE_rally_against_germany:0 "Згуртуватися проти [GER.GetNonIdeologyName]"
 CZE_rapprochement_with_hungary_desc:0 "Угорський іредентизм представляє постійну загрозу для нас, але, можливо, в нас на цей раз вийде врегулювати ситуацію мирним шляхом?"
 CZE_restore_the_austro_hungarian_customs_union_desc:0 "Однією з незаперечних переваг Австро-Угорської імперії були обмежені торгові бар'єри для нашої промисловості. Відновлення цього союзу стало б першим кроком до залучення інших колишніх складових країн у нашу сферу впливу."
 CZE_restore_the_monarchy_desc:0 "Заручившись підтримкою нової системи, настав час запропонувати вдосконалену ідею народу. З обранням $CZE_karel_schwarzenberg$ монархом ми звертаємося як до старих прихильників монархії, так і до нових, оскільки він — [ROOT.GetAdjective]ий, а не [AUS.GetAdjective]ий монарх, яких раніше нам нав'язували."
 CZE_second_republic_neutrality:0 "Чесько-словацька республіка"
 CZE_skoda_select_country:0 "Вибрати [FROM.controller.GetName] для рішень про продаж"
