 INS_revolution_planning_hq_DONE:0 "Революційний штаб"
 INS_sjahrirs_continued_tenure_desc:0 "Прем'єр-міністр Шарір проявив себе як великий лідер, провівши нас через революцію, покращивши нашу економіку та встановивши демократію. Ми повинні переобрати його Прем'єр-міністром."
 INS_sleeper_informant_network_desc:0 "Ми створимо мережу інформаторів, впроваджену по всьому адміністративному апарату KNIL, що дасть нам завчасне попередження про плани ворога."
