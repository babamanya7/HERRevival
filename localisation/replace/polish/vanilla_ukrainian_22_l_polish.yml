 COG_approach_the_disfavored_mwami:0 "Звернутися до незадоволеного Мвамі"
 COG_approach_the_disfavored_mwami_desc:0 "Є багато тих, хто ненавидить бельгійських окупантів. Одним з них є Юхи V Мусінга, колишній Мвамі Руанди. Ми могли б заручитися його підтримкою та забезпечити, щоб він і його послідовники приєдналися до нашого повстання, коли настане час."
 COG_colonial_administration_desc:0 "Ми повинні використати те, що ми навчилися з німецького колоніального управління в нашій країні, щоб краще управляти Африкою самостійно."
 COG_communism:0 "Демократична республіка Конго"
 COG_invite_german_kasierist_exiles_desc:0 "Здається, німці здалися і відмовились від свого славного кайзера, обравши справжню посередність. Ми повинні запросити вірних німецьких монархістів до нашої нації і спробувати відновити справжній Міттелафріку!"
 COG_invite_german_kasierist_exiles_tt:0 "§YКарл Фрідріх Герделер§!, §YПауль Еміль фон Леттов-Форбек§! і §YАльфред Гугенберг§! приїдуть в Африку, щоб приєднатися до нас."
 COG_the_embodiment_of_god_desc:0 "[ROOT.GetLeader] є втіленням самого Бога і має унікальне божественне право правити всіма землями навколо Великих озер. Нехай живе його величність!"
 COG_traditional_masks_and_armor_desc:0 "Щоб підняти мораль наших військ, ми повинні забезпечити їх традиційною бронею Куба. Також ми можемо залякати наших ворогів, використовуючи наші традиційні маски."
