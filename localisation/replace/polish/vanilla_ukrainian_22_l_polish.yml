 DEN_destroyer_4:0 "Клас «Huitfeldt»"
 DEN_establish_the_danelaw_desc:0 "Був час, коли наші володіння простягалися по всьому Північному морю, а англійці підкорялися нашим законам. Настав час піднятися знову і забезпечити майбутнє нашого народу, захистивши хвилі. Ми відновимо Данелаген і змусимо всі інші країни прислухатися до нас!"
 DEN_expand_the_industries_desc:0 "Данія традиційно покладається на сільське господарство, яке залишається нашим найбільшим експортом. Якби ми диверсифікували та розширили інші галузі, ми б зміцнили економіку в цілому і зробили данське суспільство більш стійким до раптових змін."
