 SEA_PHI_political_events.51.t:0 "$USA_douglas_macarthur$ відкликаний до [USA.GetNameDef]"
 SEA_PHI_political_events.66.a:0 "Це забезпечить стабільність у регіоні"
 SEA_PHI_political_events.7.t:0 "[FROM.GetName] дякує нам за підтримку"
 SEA_PHI_political_events.9.b:0 "Нам потрібне це спорядження"
 SEA_PRC_border_war_events.1.t:0 "[PRC.GetNameDefCap] завойовує [1045.GetName]"
 SEA_PRC_faction_events.42.t:0 "[ROOT.GetNameDefCap] вигнано з [FROM.GetFactionName]"
 SEA_PRC_faction_events.50.desc:0 "[FROM.GetLeader] надіслав до нас делегацію, намагаючись переконати нас приєднатися до їхньої фракції. Вони кажуть, що ми стоїмо на роздоріжжі, де вирішується майбутнє Китаю. За словами делегації [FROM.GetName], є лише один шлях уперед для об'єднання всього Китаю — і це шлях разом. Неможливо не замислитися, які приховані мотиви має [FROM.GetLeader] у [FROM.GetLeader.GetHerHis] голові, і чи варто [FROM.GetLeader.GetSheHe] довіряти..."
 SEA_PRC_faction_events.53.a:0 "Це великий день для всього Китаю!"
 SEA_PRC_misc_events.11.a:0 "Гідний некролог"
 SEA_PRC_misc_events.14.a:0 "Крок до Об'єднаного Китаю!"
 SEA_PRC_misc_events.17.desc:0 "Наша делегація до [FROM.GetNameDef] повернулася у пригніченому настрої. Наше прохання до [FROM.GetLeader] передати наші законні території було зустрінуте відмовою та презирством. [ROOT.GetLeader] проклинає як [FROM.GetLeader], так і наших дипломатів за те, що вони не змогли забезпечити те, що належить нам по праву."
 SEA_PRC_political_events.20.a:0 "Обнадійливий знак!"
 SEA_PRC_political_events.21.b:0 "Нам потрібен їхній досвід удома"
 SEA_PRC_political_events.25.t:0 "[FROM.GetName] наказує $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ вирушити до [PRC.GetName]"
 SEA_PRC_political_events.3.a:0 "Це повинно гарантувати нам безпеку"
 SEA_PRC_request_aid.1.b:0 "Ми нічим не можемо поділитися"
 SEA_PRC_request_aid.31.t:0 "[FROM.GetName] просить танки"
 SEA_PRC_request_aid.32.desc:0 "Відповідаючи на наш запит щодо танків БТ-7, [FROM.GetName] погодився надіслати нам велику кількість — не менше 350 (переважно) новеньких БТ-7! Наші генерали розробляють план, як найкраще їх розгорнути, включаючи встановлення графіків тренувань для новобранців-танкістів."
 SEA_PRC_zhang_guotao_events.5.a:0 "Дозволити $PRC_zhang_guotao$ приєднатися до нас"
 SEA_PRC_zhang_guotao_events.5.t:0 "$PRC_zhang_guotao$ хоче приєднатися до нашої справи"
 SEA_PRC_zhang_guotao_events.7.desc:0 "$PRC_zhang_guotao$ оголосив про свій вихід з Комуністичної партії Китаю, посилаючись на невиправно зіпсовані стосунки з Центральним комітетом і $PRC_mao_zedong$, а також на своє розчарування в партії."
 SEA_border_incidents_events.1.b:0 "Ми повинні наказати їм негайно відступити!"
 SEA_border_incidents_events.3.t:0 "Інцидент у Таурані"
 SEA_border_incidents_events.6.t:0 "[JAP.GetAdjective]а поразка біля озера Буїр"
 SEA_china.19.b:0 "Відмовитися скасовувати договір"
 SEA_china.29.a:0 "Throw him in jail!"
 SEA_china.8.desc:0 "[FROM.GetLeader] погодився на нашу пропозицію. [FROM.GetNameDefCap] приєднається до нашого альянсу і стане поруч із нами в боротьбі за об'єднання нації та її захист від зовнішніх загроз. Це знаменує собою значний крок до більшої єдності Китаю."
 SEA_china_democratic.1.desc:0 "Нарешті настав час відновити вільні вибори в Китаї та відродити республіку, роздавлену як зовнішніми, так і внутрішніми силами. Проте залишається питання: хто перейме мантію доктора Сунь Ятсена і стане першим президентом цієї нової республіки?"
 SEA_china_democratic.8.t:0 "[FROM.GetNameDefCap] погоджується звільнити [CHI_country_to_be_liberated.GetNameDef]"
 SEA_china_improvement.3.a:0 "Чудова робота"
 SEA_imperial_influence_events.200.t:0 "Фракція Флоту втрачає вплив"
 SEA_imperial_influence_events.220.t:0 "Фракція Флоту вимагає політичних призначень"
 SEA_japan_foreign_policy.12.a:0 "Вони пошкодують про своє рішення!"
 SEA_japan_foreign_policy.12.b:0 "Ми повинні це облишити"
 SEA_japan_foreign_policy.122.desc:0 "[From.GetAdjective]а влада вирішила відкликати своїх лівих держслужбовців та генералів, а натомість надіслали нам своїх правих генералів та чиновників у неофіційне вигнання."
 SEA_japan_foreign_policy.126.desc:0 "[FROM.GetLeader] грубо вирішив відхилити нашу пропозицію про альянс між нашими державами, заявивши, що це суперечитиме їхньому принципу нейтралітету. Ми можемо лише уявити масштаби корупції, що призвели до цього помилкового рішення."
 SEA_japan_foreign_policy.129.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] розумно прийняв наші вимоги і підкорився нашій владі, знову повернувши [FROM.GetAdjective]у державу в нашу сферу впливу. Ми святкуємо перемогу в цей день, оскільки [FROM.GetAdjective]ий народ тепер звільнено від буржуазної диктатури!"
 SEA_japan_foreign_policy.2.desc:0 "[FROM.GetLeader] пішов у відставку на користь нашого кандидата на [FROM.GetAdjective]ий трон, принца Де. Регіон зараз перебуває під нашою окупацією, і реорганізація їхнього уряду відбудеться найближчим часом."
 SEA_japan_foreign_policy.23.t:0 "[FROM.GetNameDefCap] впливає на наш народ"
 SEA_japan_foreign_policy.25.t:0 "[FROM.GetNameDefCap] мілітаризує Партію покращення Тибету"
 SEA_japan_foreign_policy.34.t:0 "[FROM.GetLeader] відхиляє наші вимоги"
 SEA_japan_foreign_policy.36.a:0 "Їхня дружба стала б нам у пригоді"
 SEA_japan_foreign_policy.37.t:0 "[FROM.GetNameDefCap] дозволяє нашому впливу поширюватися"
 SEA_japan_foreign_policy.56.a:0 "Пан або пропав, готуйтеся до гіршого!"
 SEA_japan_foreign_policy.61.t:0 "Зрада Ван Цзінвея"
 SEA_japan_foreign_policy.62.a:0 "Він стане сильним лідером"
 SEA_japan_foreign_policy.8.t:0 "[FROM.GetNameDefCap] підкорюється нашим вимогам"
 SEA_japan_foreign_policy.86.desc:0 "Польсько-японський антирадянський пакт передбачає, що всі підписанти повинні приєднатися до будь-якого оборонного конфлікту з Радянським Союзом. [From.GetName] зазнала нападу з боку Совєтів і надіслала запит усім учасникам пакту негайно прийти їм на допомогу. Настав час продемонструвати відданість [Root.GetAdjective]ій справі захисту світу від загрози Радянського Союзу раз і назавжди."
 SEA_japan_foreign_policy.87.a:0 "Це те, під чим ми підписалися"
 SEA_japan_foreign_policy.90.a:0 "Чудово"
 SEA_japan_foreign_policy.92.d:0 "Ми повинні підписати всі запропоновані угоди!"
 SEA_japan_foreign_policy.93.desc:0 "Милостивий лідер [FROM.GetNameDef], [FROM.GetLeader], прийняв одну з наших пропозицій, погодившись встановити тісніші торговельні та наукові зв'язки з нашою нацією. Це великий день для [ROOT.GetNameDef] та її дипломатичних досягнень!"
 SEA_japan_foreign_policy.97.b:0 "Забирайте свої папери назад до Токіо!"
 SEA_japan_popup_events.11.b:0 "Ні, колишній Імператор має жити!"
 SEA_japan_popup_events.13.t:0 "Офіцерам Кодоха висунуто звинувачення у вбивстві Хірохіто"
 SEA_japan_popup_events.16.desc:0 "У відповідь на нещодавні заклики тимчасового прем'єр-міністра Мачіди Тюдзі, імператор Хірохіто виступив проти насильства, розпаленого триваючим конфліктом фракцій, і вирішив, кого він має призначити на цю роль, щоб стати новим прем'єр-міністром у ці важкі часи. Особа, яку він номінував, це..."
 SEA_japan_popup_events.17.t:0 "Військові оголошують страйк"
 SEA_japan_popup_events.2.desc:0 "Після нещодавніх внутрішніх суперечок між керівництвом Досікай (Товариство однодумців), здається, що організація ось-ось розпадеться. Посилаючись на відверту неповагу Кіші та його союзників до Тодзьо, а також на численні чутки про можливі плани вбивств, що ширяться довкола, у повітрі висить велика тривога. Не кажучи вже про чутки, що Кіші планує встановити технократичну диктатуру, яка піде проти волі імператора та Імперської армії. Чи краще просто відпустити цей тандем, чи він занадто цінний, щоб його втрачати?"
 SEA_japan_popup_events.24.t:0 "Імперська армія капітулює"
 SEA_japan_popup_events.33.d:0 "Відправити їх у вигнання"
 SEA_japan_popup_events.40.t:0 "Тривожні повідомлення про [JAP.GetAdjective]ий експансіонізм"
 SEA_japan_popup_events.41.t:0 "[FROM.GetAdjective]е ембарго"
 SEA_japan_popup_events.46.a:0 "Ми розберемося з ними пізніше..."
 SEA_japan_popup_events.9.desc:0 "Генерал Садао Аракі, відомий політичний філософ в армії, пов'язав стародавній кодекс самураїв Бусідо з ідеями, схожими на європейський фашизм, щоб сформувати філософську основу своєї ідеології, яка об'єднує Імператора, народ, землю і мораль як єдине і неподільне ціле. Щоб зміцнити ці ідеї, можливо, було б розумно прийняти форму правління, ближчу до західних зразків, на яких він будує свою ідеологічну модель. Що ми скажемо?"
 SEA_warlords.100.desc:0 "Надійшло термінове повідомлення від [XIC.GetNameDef], в якому йдеться про те, що [XIC.GetLeader] вивів свої війська з [1032.GetName], дозволивши силам [PRC.GetNameDef] хлинути в регіон і оголосити його своїм. Єдиною метою існування [XIC.GetName] було стримування [PRC.GetName] та їх знищення, а не допомога їм."
 SEA_warlords.24.desc:0 "[From.GetLeader] з ентузіазмом відгукнувся на нашу пропозицію об'єднатися проти центрального уряду і пообіцяв допомогти нам у цій боротьбі. Тепер ми на крок ближче до об'єднання нашої нації."
 SEA_warlords.33.desc:0 "Після кількох напружених днів [FROM.GetLeader] погодився передати [434.GetName] і відмовитися від лінії Мак-Магона, заявивши, що спроби забезпечити її дотримання принесуть більше проблем, ніж воно того варте. З цим наша країна стає ще більшою."
 SEA_warlords.47.a:0 "[ROOT.GetLeader] має залишитися"
 SEA_warlords.50.t:0 "Прибуває делегація від [FROM.GetLeader]"
 SEA_warlords.56.desc:0 "Молодий маршал [FROM.GetLeader] попросив перевести його до північно-східного гарнізону в [608.GetName], щоб бути ближче до японської загрози і діяти як бастіон проти їхньої агресії. Будучи колишнім лідером Фентяньської кліки, він, схоже, хоче зробити активний крок, щоб повернути свою втрачену батьківщину. Що скажемо?"
 SEA_warlords.69.t:0 "Розпуск Хебей-Чахарської політичної ради"
 SELECTED_SUBUNIT:0 "§G(зараз обрано)§!"
