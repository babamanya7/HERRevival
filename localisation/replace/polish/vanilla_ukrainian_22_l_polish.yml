 fascism_on_the_rise_desc:0 "Видні політичні елементи почали виступати на користь фашистських цінностей, знаходячи підтримку в дедалі більшої кількості населення. Шлях нації до фашизму відкритий; вона лише чекає на вибір мирного чи насильницького переходу."
 fighter_equipment_1:0 "Винищувач I"
 finland.1.t:0 "[FROM.GetNameDefCap] вимагає область [146.GetName]"
 finland.3.d:0 "Наш сусід Фінляндія відмовилася піддатися тиску з боку Радянського Союзу, і зараз країни перебувають у стані війни. Хоча між нашими країнами не було укладено формального союзу, фінський уряд звернувся до Швеції з проханням зробити внесок у спільну оборону Аландських островів, які залишаються переважно шведськомовними і стратегічно важливими для обох країн.\n\nХоча в уряді немає єдиної думки щодо того, які кроки ми повинні зробити, щоб допомогти Фінляндії, громадська підтримка їхньої оборони є помітною. Як далеко ми готові зайти, щоб захистити наших північних сусідів від східної агресії?"
