 ITA_strengthen_ascari_corps:0 "Зміцнити корпуси аскарі"
 ITA_strengthen_northern_industry_desc:0 "Північна Італія вже давно є промисловим центром нашої країни. Весь регіон має чудові можливості для подальшого розвитку з невеликими витратами часу та ресурсів."
 ITA_submarine_3:0 "Клас «Marconi»"
 ITA_tac_bomber_equipment_2_short:0 "Z.1007bis Alcione"
 ITA_the_enemies_of_capitalism:0 "Вороги капіталізму"
 ITA_the_fate_of_mussolini_desc:0 "Поки Муссоліні залишається під домашнім арештом, ми не можемо по-справжньому рухатися вперед, адже над нами постійно нависає його присутність. Ми забезпечили нашу позицію справжньої влади в партії, і тому настав час вирішити долю колишнього дуче!"
 ITA_the_path_to_progress_desc:0 "Ми звернемося до комуністичних і соціалістичних урядів по всьому світі, які, можливо, захочуть співпрацювати з нами та допомогти нам відновитися після руйнівної громадянської війни, яку ми були змушені пережити."
 ITA_the_republics_leadership_desc:0 "Ми мусимо вибрати правильну партію та політичного лідера, який поведе молоду Італійську республіку до соціалістичного суспільства, на яке заслуговує наш народ. І Ферруччо Паррі, і Іваное Бономі здаються гідними кандидатами, які мають високу кваліфікацію для виконання цього завдання."
 ITA_union_in_the_party_desc:0 "Єдність усередині партії є найважливішим фактором для розвитку нашої країни на шляху до комунізму. Ми мусимо гарантувати, що всі члени партії поділяють однакове бачення, мають однакові цілі та дотримуються процесів, установлених партією для їх досягнення."
 ITA_unite_the_opposition_cw_benefits_tt:0 "\nМи підступимо до низки військових офіцерів і спробуємо переконати їх стати на наш бік разом із кількома частинами, коли почнеться громадянська війна."
 ITA_vallo_alpino_orientale_tt:0 "Буде збудовано оборонну лінію в областях §Y[160.GetName]§!, §Y[736.GetName]§! й §Y[852.GetName]§! вздовж східного альпійського кордону з областями [153.GetName], [102.GetName], [853.GetName] та [103.GetName].\n"
 IVO_ADJ:0 "Івуарськ"
 IVO_democratic:0 "Республіка Кот-д'Івуар"
 JAM_neutrality_ADJ:0 "Ямайськ"
 JAP_ally_the_league_of_blood_desc:0 "Радикальний буддійський проповідник нічіренізму Нішшьо Іноуе заснував Лігу крові з наміром ліквідувати заможних бізнесменів та ліберальних політиків у ході подій, що стали відомі як Інцидент із Корпусом клятви на крові. Оскільки його звільнили, ми повинні зв'язатися з ним, оскільки він поділяє наші ідеали."
 JAP_anti_communist_volunteers:0 "Антикомуністичні добровольці"
 JAP_approach_yasuda_desc:0 "Дзайбацу Ясуда бере свій початок в епоху Мейджі і займається банківською справою з моменту заснування. Будучи основою банку Ясуда, вони тепер нерозривно пов'язані з усіма фінансовими секторами нашої нації. Ми повинні заручитися їхньою підтримкою для нашого уряду, щоб ми могли максимально ефективно використовувати їхні величезні статки."
 JAP_army_faction_demands_larger_army:0 "$JAP_army_faction$ вимагає більшої армії"
 JAP_army_faction_demands_more_artillery:0 "$JAP_army_faction$ вимагає більше артилерії"
 JAP_battleship_4_desc:0 "Клас «Iwami» був гіпотетичним класом лінкорів, який використовував нові методи для прискорення будівництва. Вони були добре озброєні новими гарматами і важкими артилерійськими установками, і за вогневою міццю могли зрівнятися з будь-якими аналогічно озброєними суднами. Однак, отримані вдосконалення означали, що клас кораблів став важчим, а отже, дещо повільнішим."
 JAP_border_conflict_escalate_conflict:0 "Ескалація конфлікту"
 JAP_bypass_the_philippines_desc:0 "Філіппіни лише відволікають нас на шляху до нашої справжньої мети. Поки що ми не звертатимемо на них своєї уваги."
 JAP_carrier_ship_engine_2:0 "«Gihon» 131 200 к. с. н. в."
 JAP_chairman_title_text:0 "Голова"
 JAP_conflict_between_faction_reaching_boiling_point_mission_desc:0 "Конфлікт між цивільним урядом і військовими стрімко наближається до критичної точки через боротьбу за владу, що, ймовірно, переросте в політичний інцидент, який кардинально змінить курс нашої країни в майбутньому."
 JAP_coup_the_mongolian_government_decision:0 "Здійснити переворот в уряді Монголії"
 JAP_create_greater_east_asian_treaty_organization_desc:0 "Власний альянс з іншими азійськими країнами дозволить нам твердо протистояти будь-яким потенційним загрозам нашому новому способу життя. Настав час прийняти нашу долю як охоронців континенту і почати вести його в майбутнє."
 JAP_develop_the_chinese_resources_desc:0 "Оскільки величезні ділянки китайської землі опинилися під нашим чоботом, ми повинні розробити багаті китайські ресурси, щоб вони могли стати в нагоді у майбутній війні."
 JAP_domestic_tank_modernization_program:0 "Програма вітчизняної модернізації танків"
 JAP_empress_title_text:0 "Імператриця"
 JAP_escalate_incident_to_border_conflict_SOV_desc:0 "Схоже, радянська влада не відступає від конфлікту. На цьому етапі ми повинні або перейти до збройного протистояння, або самі відступити."
 JAP_female_leader_3_text:0 "її"
 JAP_focus_on_aircraft_carriers_desc:0 "Лінкори — це реліквії минулої епохи. Ми повинні дивитися в майбутнє, а майбутнє — за авіацією. Авіаносці дозволять нам проєктувати цю повітряну міць через Тихий океан."
 JAP_form_greater_east_asian_currency_union_desc:0 "Ми повинні рухатися до використання єдиної валюти в усій Азії, що наші старі політичні теоретики називали Єновим блоком. Настав час зробити ще один крок до цієї мети і сформувати валютний союз для всіх наших нових союзників."
 JAP_fund_the_riken_institute_desc:0 "Заснований у 1917 році в епоху Тайшьо, Інститут фізико-хімічних досліджень наразі контролюється концерном Рікен — дзайбацу, що керує близько 121 фабрикою та 63 компаніями. Під керівництвом віконта Масатоші Окочі ми повинні намагатися розширити інститут, щоб ми могли проводити там нашу програму атомних досліджень."
 JAP_generic_mio_trait_fleet_escorts:0 "Якісна перевага"
 JAP_go_after_the_capitalists_desc:0 "Західні капіталісти прагнуть обкрадати народи Азії, нічого не даючи натомість. Ми повинні знищити їх, поки вони не почали експлуатувати людей до точки неповернення."
 JAP_guide_the_chinese:0 "Скерувати китайців"
 JAP_ichiro_hatoyama_focus_desc:0 "Ічіро Хатояма, нинішній лідер керівної партії Ріккен Сейюкай, має сформувати новий кабінет, який наполягатиме на прийнятті нашої нової конституції. Завдяки цьому ми більше не матимемо тимчасового прем'єр-міністра, і порядок, що існував до початку міжусобиць, буде нарешті відновлено."
 JAP_ignite_the_korean_peninsula_tt:0 "Починає громадянську війну в [KOR.GetNameDef], де комуністична сторона стає нашою маріонеткою"
 JAP_imperial_army_medium_control_range:0 "Strong Army Influence"
 JAP_imperial_army_side:0 "Imperial Army"
 JAP_imperial_headquarters_liasion_conference_desc:0 "З огляду на відновлення роботи Імператорської Ставки вперше з часів російсько-японської війни, настав час провести нараду між лідерами різних фракцій для сприяння співпраці та обміну розвідувальними даними між військовими та урядом."
 JAP_kodoha_fascism:0 "Японський шьогунат"
 JAP_kodoha_insurgency_decisions:0 "Імперський шлях"
 JAP_kodoha_neutrality_ADJ:0 "Японськ"
 JAP_konoes_first_cabinet:0 "Перший кабінет Коное"
 JAP_medium_tank_destroyer_equipment_2:0 "Type 3 Ho-Ni III"
 JAP_medium_tank_destroyer_equipment_3:0 "Type 5 Na-To"
 JAP_ministry_of_colonial_affairs_desc:0 "Почавши спочатку як Управління колонізації Хоккайдо, міністерство вже пройшло довгий шлях. Ми повинні розширити його обов'язки, щоб воно могло належним чином керувати Нанйо, Чьосен, Карафуто, Канто і Тайванем. Одного дня нехай усі називатимуть ці землі японськими!"
 JAP_mio_trait_foreign_research_and_development_cooperation:0 "Міжнародна співпраця в галузі НДДКР"
 JAP_mio_trait_naval_arsenal_trait:0 "Військово-морський арсенал"
 JAP_national_defense_brotherhood:0 "Братство національної оборони"
 JAP_nationalize_suzuka_naval_arsenal_desc:0 "Морський арсенал Сузука є виробничим об'єктом авіаційного озброєння, стрілецької зброї та боєприпасів для флоту. Ми повинні націоналізувати цей об'єкт, щоб контролювати його розширення та створити на цьому місці нові судноремонтні верфі."
 JAP_naval_armaments_program_tt:0 "Після завершення §Y$JAP_focus_on_aircraft_carriers$§!: Створити §Yваріант§! авіаносця та §Y4 виробничі лінії§! §Yкласу «Шьокаку»§!\nПісля завершення §Y$JAP_balanced_naval_approach$§!: Створити §Yваріанти§! авіаносця та надважкого лінкора та §Y2 виробничі лінії§! для §Yкласу «Шьокаку»§! та §Yкласу «Ямато»§!\nПісля завершення §Y$JAP_sea_battleship_initiative$§!: Створити §Yваріант§! надважкого лінкора та §Y4 виробничі лінії§! §Yкласу «Ямато»§!\n"
 JAP_occupy_indochina_desc:0 "Народи Індокитаю нині страждають від гніту колоніальних та імперіалістичних режимів, які мало дбають про їхній добробут. Ми повинні втрутитися і взяти цей регіон під контроль, щоб захистити його людей, а заразом отримати контроль над природними ресурсами території."
 JAP_preparing_an_offensive_in_progress:0 " Наразі готується наступ"
 JAP_reorganize_the_united_autonomous_government:0 "Об'єднаний автономний уряд"
 JAP_revitalize_rural_areas_desc:0 "Багато молодих офіцерів у нашому русі походять з бідних і сільських родин. Щоб зберегти їхню підтримку, ми повинні прагнути зупинити депопуляцію сільської місцевості та відродити сільські райони."
 JAP_sagami_army_arsenal_organization:0 "$sagami_army_arsenal$"
 JAP_sea_supremacy_of_will:0 "Перевага волі"
 JAP_seek_strength_in_numbers_desc:0 "Одного корабля недостатньо, щоб виграти бій. Нам потрібно урізноманітнити наші флоти та збільшити їхню чисельність, а не просто зосереджуватися на якості. Зрештою, кількість — це теж своєрідна якість."
 JAP_ship_radar_2:0 "Радар «Type 23»"
 JAP_social_and_cultural_revolution_desc:0 "Ми повинні розпочати монументальне завдання з усунення всіх залишків феодалізму, націоналізму та консервативних традицій, одночасно пропагуючи комуністичну ідеологію в усій державі. Ми повинні вилучити Бушідо з нашої освіти та заохочувати людей носити Йофуку, відмовившись від будь-якого традиційного одягу на користь західних зразків, щоб вивести нашу державу на один рівень з іншими революційними суспільствами."
 JAP_sonnou_joui_tt:0 "Цей дух оновлюється при захопленні столиці нації, на яку ми заявили права через §Y«Удар коштовного списа»§!, §Rякщо він все ще активний у цей час§!."
 JAP_sp_land_flamethrower_tank:0 "Sōkō Sagyō Ki «Otsu»"
 JAP_strengthen_the_divine_wind_effect_bba:0 "Стане доступний модуль §H$fixed_explosive_charge$§!."
 JAP_strike_down_the_enemy_of_the_people_tt:0 "Отримати мету війни §YАнексія§! проти будь-якої §Yазійської комуністичної§! нації. Поточні цілі:"
 JAP_strike_on_the_southern_resource_area_desc:0 "Настав час привести наш план у дію. Ми завдамо удару на південь і встановимо контроль над багатими західними колоніями."
 JAP_supported_the_kozaha_idea_tt:0 "Розблокує фокус §Y$JAP_the_lecture_group_ascendant$§!"
 JAP_sway_admiral_loyalty_decision:0 "Схилити лояльність адмірала"
 JAP_taiheyo_belt:0 "Пояс Тайхейо"
 JAP_the_imperial_defense_plan_desc:0 "Щоб захистити державу, ми повинні сформулювати новий план активної оборони. Усі війни будуть виграні раптовими масштабними вирішальними ударами, уникаючи затяжних воєн і змушуючи наших ворогів поступатися нашим вимогам."
 JAP_the_uno_school_of_economics_desc:0 "Політичний та економічний теоретик Козо Уно запропонував теорії про те, як трансформувати колишні капіталістичні моделі в реальний економічний розвиток та об'єкти, необхідні для побудови справжнього соціалізму. Настав час почати втілювати його теорії в реальність."
 JAP_torpedo_cruisers:0 "Торпедні крейсери"
 JAP_trans_pacific_influence_desc:0 "Полум'я революції поширюється далеко і широко, а наші успішні кампанії надихають пролетаріат усюди. Ми повинні почати фінансувати революційні групи по той бік океану, щоб дестабілізувати регіон і залучити їх до П'ятого Інтернаціоналу."
 JAP_utilize_ainu_expertise_desc:0 "Айни, корінні жителі Північної Японії, є експертами в навігації по снігу та суворій місцевості Хоккайдо. Можливо, ми могли б перейняти їхні методи, щоб зробити наше вторгнення в Сибір більш стрімким?"
 JAP_west_pacific_treaty_organization_desc:0 "Нам слід створити власний союз, що включає інші азійські країни, який стоятиме на варті нашого нового способу життя."
 JAP_yatagarasus_guidance_desc:0 "Трилапий бог-ворон Ятагарасу вів Джімму в його великому завоюванні Ямато і Нари як частина божественного втручання в людські справи. Оскільки ми самі гостро потребуємо керівництва, ми повинні назвати наші нові системи на честь цього бога-провідника."
 JAP_zaibatsu_faction_demands_industrial_company_employment:0 "$JAP_zaibatsu_faction$ вимагає контракту з промисловою компанією"
 JOR_fascism:0 "Йорданська імперія"
 JUNO_brazil_events.13.t:0 "Операція «Болівар» зірвана в Бразилії"
 JUNO_brazil_events.132.a:0 "Сподіваємося, така боягузливість не пошириться."
 JUNO_brazil_events.134.a:0 "Ми можемо піти на невеликі втрати заради наших товаришів"
 JUNO_brazil_events.139.desc:0 "Відповідь на наші вимоги до [FROM.GetNameDef] звільнити [BRA_country_to_be_liberated.GetNameDef] щойно надійшла до нас. Заявляючи, що їхні зовнішні справи не стосуються нас, вони відхиляють ідею надання їм їхньої законної незалежності."
 JUNO_brazil_events.15.desc:0 "В останні місяці [BRA.GetAdjective] уряд брав участь у низці спільних обговорень з членами нашого власного уряду щодо прийняття ними більш активної ролі у підтримці наших військових зусиль. Хоча вони ще не можуть задіяти військові сили, вони просили економічну підтримку в обмін на зобов'язання зробити це в найближчому майбутньому."
 JUNO_brazil_events.180.a:0 "Нам може знадобитися його досвід."
 JUNO_brazil_events.70.a:0 "Ці території не варті того, щоб за них воювати."
 JUNO_brazil_events.70.t:0 "[FROM.GetNameDefCap] вимагає заморські території"
 JUNO_purchasing_aircraft_flag:0 "Уже купує літаки"
 KAL_communism_party:0 "КНБС"
 KAR_STATE_213:0 "Куолан ніемімаа"
 KAZ_neutrality_ADJ:0 "Казахськ"
 KBK_fascism_DEF:0 "Черкеське царство"
