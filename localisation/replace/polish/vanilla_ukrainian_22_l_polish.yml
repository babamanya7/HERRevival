 SOV_alexander_novikov:0 "$SOV_aleksandr_novikov$"
 SOV_align_general_stalin_tt:0 "§Y[?SOV.SOV_selected_general_stalin.GetName]§! стає лояльним до лідера [ROOT.GetLeader]."
 SOV_anti_tank_equipment_3_short:0 "ЗиС-3"
 SOV_approach_primakov_tt:0 "§Y$SOV_vitaly_primakov$§! стане на бік лівої опозиції в громадянській війні, а також приведе з собою війська та лояльних генералів."
