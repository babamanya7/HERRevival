 secret_weapons_desc:0 "Було б спокусливо витратити всі додаткові ресурси на розробку танків і літаків, але секрет перемоги у війнах полягає в нових галузях науки: дослідженні електроніки, ракетної техніки та ядерних технологій."
 security_through_expansion_goal_desc:0 "Нам потрібно створити щит навколо нашої території та забезпечити кільце держав навколо наших поточних кордонів."
 seize_some_trains_woo_desc:0 "Нашу інфраструктуру займають цивільні залізничні компанії. Тепер, коли наближається війна, ми маємо повне право реквізувати їхню техніку для потреб держави."
 ship_designer_carrier:0 "$EQUIPMENT_CARRIER$"
 ship_engine_sub_aip_1_desc:0 "Перша версія нових типів двигунів, що дозволяє підводному човну залишатися в робочому стані під водою протягом більш тривалого часу, за рахунок значно збільшеного споживання палива та зменшеної дальності плавання."
 ship_light_battery_sub_desc:0 "Потужна палубна гармата калібру, який частіше зустрічається на легких крейсерах."
