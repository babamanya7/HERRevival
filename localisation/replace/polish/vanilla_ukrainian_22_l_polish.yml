 DESIGNER_SUPPORT_COLUMN_TITLE:0 "Роти підтримки. Це війська підтримки, які залишаються позаду фронтових військ і допомагаються їм.\n\nВи можете вибрати лиш одну роту кожного виду. Роти підтримки не впливають на §Yмежу швидкості§! дивізії (окрім як крізь ландшафтні бонуси) та не збільшують її §Yширину фронту§!."
