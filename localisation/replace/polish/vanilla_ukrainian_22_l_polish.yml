 CHI_send_the_first_lady_abroad_desc:0 "Все ще є ті, хто міг би підтримати нас перед обличчям агресії, але наразі вагається. Ми повинні відправити першу леді, щоб переконати їх, що хоча ми пролили океани крові й непохитно несли важкий тягар війни, ми все одно переможемо."
 CHI_send_the_urban_students_to_the_countryside_desc:0 "Хоча наші освітні зусилля принесли плоди, все ще існує велика розбіжність між містами та селом. Настав час застосувати більш прямий підхід і використати знання наших студентів вищих навчальних закладів у сільських школах."
