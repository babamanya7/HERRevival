 DEN_bop_defend_the_policy_of_neutrality_desc:0 "Нейтралітет нам добре послужив, не в останню чергу під час Великої війни, коли битви точилися по всій Європі. Але не тут, не в Данії. Нас врятували, нас пощадили. Нейтралітет нам справді добре послужив."
