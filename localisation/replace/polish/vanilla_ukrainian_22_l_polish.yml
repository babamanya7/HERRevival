 IRQ_purchase_mechanized_equipment_desc:0 "Повільний марш піхоти став кричущою слабкістю наших сил через появу механізованої піхоти за кордоном. Настав час нам інвестувати в механізацію наших власних сил, поки не стало надто пізно."
 IRQ_refuge_for_the_grand_mufti_desc:0 "Після нещодавніх заворушень у Палестині, Амін аль-Хусейні, суперечливий Великий Муфтій Єрусалиму, був вигнаний британцями. Щоб заспокоїти антибританські настрої в межах наших власних кордонів, можливо, ми могли б надати йому притулок на деякий час."
 IRQ_regional_economic_integration_desc:0 "Ми повинні організувати масові інвестиції в інфраструктуру регіону, щоб усі ми могли отримати вигоду від довгострокового економічного зростання."
