 NAVY_REPAIR_NOW:0 "§HНегайний ремонт!§!\nОперативна група повернеться на близьку морську базу для ремонту.\n§GКлацніть§!, щоби надіслати. Вона повернеться до поточного завдання після повного ремонту.\n§GCtrl + клацніть§!, щоби надіслати. Вона залишаться в морській базі після ремонту."
