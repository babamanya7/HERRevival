 CHL_connect_the_northern_railways_desc:0 "Залізниці та автодороги на півночі, особливо в Аріці, погано пов'язані з рештою наших інфраструктурних систем, тому необхідно докласти зусиль для покращення загальної інфраструктури найбільш північних регіонів."
 CHL_contract_efe_desc:0 "Empresa de los Ferrocarriles del Estado наразі керує нашими залізничними системами і, переконавшися, що маємо більш прямий контроль над ними та керуємо ними, ми можемо гарантувати, що їхні ресурси та пріоритети будуть спрямовані туди, куди ми хочемо."
 CHL_cultivate_fanaticism:0 "Культивувати фанатизм"
 CHL_democratic_alliance_party:0 "ДА"
 CHL_enact_stricter_labor_laws_desc:0 "Трудове законодавство наразі надто м'яке для справжнього демократичного суспільства, і ми мусимо переконатися, що корпорації та капіталісти не зможуть скористатися перевагами бідного робітничого класу Чилі. За більш рівне майбутнє!"
 CHL_expand_southern_infrastructure_desc:0 "Наразі на крайньому півдні Чилі практично відсутня будь-яка інфраструктура, а залізничних ліній немає взагалі. Тому ми мусимо докласти значних зусиль, щоби сполучити південні портові міста Пунта-Аренас і Пунта-Дельгада з нашими залізничними лініями."
 CHL_focus_on_cattle_and_wool_desc:0 "Дві найпоширеніші галузі тваринництва в країні сьогодні — це розведення корів та овець, і було б нерозумно намагатися це змінити. Натомість ми мусимо сприяти купівлі цих тварин фермерами по всій країні."
 CHL_found_the_contraloria_general_de_la_republica:0 "Заснувати Contraloría General de la República"
 CHL_grant_full_rights_to_the_mapuche_tt:0 "§YКонфлікт із мапуче§! більше §Gне буде актуальним§! для нашої держави."
 CHL_indigenous_union:0 "Союз корінних народів Америки"
 CHL_initiate_a_revolution_desc:0 "[ROOT.GetAdjectiveCap]і агенти розпочнуть революцію проти уряду держави [FROM.GetNameDef], що призведе до громадянської війни в їхній країні."
 CHL_integrate_mexico:0 "Інтегрувати Мексику"
 CHL_international_loans_desc:0 "Наш колишній президент Карлос Ібаньєс дель Кампо намагався вирішити економічну кризу за допомогою позик від іноземних держав та інвестував гроші в державу, сподіваючись, що зможе створити достатню вартість, щоби повернути їх пізніше, і ця стратегія була в певному сенсі успішною. Ми мусимо спробувати піти його шляхом і зробити те саме ще раз."
 CHL_izquierda_communist_party:0 "Комуністична лівиця"
 CHL_mapuche_nationalism_decisions:0 "Держава мапуче"
 CHL_military_excercises:0 "Військоі навчання"
 CHL_modern_conquistadors_desc:0 "Тепер, коли старе Королівство Чилі нарешті відновлено, настав час по-справжньому вшанувати наших предків і вдягнути мантію нашого першого в історії королівського губернатора, конкістадора Педро де Вальдівії. Вперед, назустріч невідомому!"
