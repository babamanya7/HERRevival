 SOV_expand_shipbuilding_plants_desc:0 "Наша географія змушує нас мати широко розкидані суднобудівні верфі для підтримки наших різних флотів. Тому будь-яка спроба збільшити наші суднобудівні потужності також має бути розпорошеною."
 SOV_expand_the_aircraft_industry_desc:0 "У майбутніх війнах нашим ВПС доведеться захищати небо від ворогів, оснащених найсучаснішою технікою. Ми мусимо забезпечити їх не лише рівноцінними літаками, але й достатньою кількістю."
