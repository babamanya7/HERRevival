 political.10.a:0 "Марно бажати влади, якщо вагаєшся її взяти."
 political.13.b.tt:0 "Збільшує ймовірність висловлення народом підтримки демократії та створення опозиції."
 political.19.d:0 "Марксистські ідеї вкоренилися в державі [Root.GetName] вже давно, але останнім часом отримали набагато ширшу підтримку. Рух вийшов за межі політичної теорії та перетворився на політичну практику, а невдоволені робітники й навіть декотрі відомі постави висловлюють свою підтримку. Комуністи називають це класовою свідомістю. Партія [Root.GetRulingParty] називає це швидким шляхом до заворушень і зради.\n\nПроявляючи слабку віру в те, що [Root.GetLeader] готовий здійснити реформи, яких вони вимагають, комуністи щодалі голосніше закликають до негайного референдуму, щоб усунути нинішній уряд. Хоча ми, можливо, зможемо змінити імпульс цього масового руху, якщо ми цього не зробимо, то, безсумнівно, це призведе до більш популярного серед комуністів методу відсторонення від влади: революції."
 political.2.a:0 "Із багатьох причин ми стежитимемо й за ними."
 political.21.t:0 "Фашисти марширують на м. [Root.Capital.GetName]"
 political.26.a:0 "Просто зграя боягузів."
 political.6.d:0 "Уявлення про те, що комуністичний рух представляє народ, безумовно, отримало підтримку в державі [Root.GetName], де громадська підтримка комуністичної партії стрімко зросла за останні місяці. Але ті, хто закликає до революції, вже не є розрізненою юрбою партизанів і незадоволених профспілок. Група, що стоїть за закликом до повстання, досить організована, щоб у разі успіху сформувати уряд.\n\nПроте, якби революція почалася зараз, її навряд чи можна було б здійснити без занурення держави [Root.GetName] у громадянську війну. Чи мусять революціонери ризикнути розірвати націю навпіл, щоби задовольнити своє нетерпіння, або почекати на кращу можливість у майбутньому?"
