 SHX_heavy_tank_artillery_equipment_3:0 "PLZ 43 D"
 SHX_heavy_tank_destroyer_equipment_3_short:0 "PTZ 43 D"
 SHX_light_tank_artillery_equipment_1:0 "PLZ 34"
 SIA_CAS_equipment_3_short:0 "Ki-66"
 SIA_and_spring_the_trap_desc:0 "Генерали клюнули на наживку. Їхнє обурення переросло в повстання, їхнє повстання викрило їхні амбіції, а цивільний уряд був готовий. Тепер пастка закривається, і майбутнє [ROOT.GetName] буде вирішуватися тими, хто відданий конституції."
 SIA_appeal_to_navy_clique:0 "Звернення до військово-морської кліки"
 SIA_jungle_armor_desc:0 "Джунглі нашого регіону — не місце для громіздких машин, створених для рівнин Європи. Якщо бронетехніка має служити [ROOT.GetNameDef], вона повинна бути адаптована до вузьких шляхів, поганого ґрунту і гнітючого клімату, промінявши вагу на мобільність там, де цього вимагають джунглі."
 SIA_limited_war_cat:0 "Обмежена війна"
 SIA_mountain_tanks:0 "Гірські танки"
 SIA_new_territories_administration:0 "Управління новими територіями"
 SIA_new_territories_administration_desc:0 "Повернення наших втрачених територій — це лише початок. Ми повинні довести тим, хто там живе, що ми — кращий вибір. Буде здійснено комплексну програму з підвищення рівня життя для всіх, гарантуючи, що кожен громадянин відчує себе рівним у цій новій великій країні."
 SIA_peoples_war_in_asia_idea_desc:0 "Війну підтримують не лише регулярні формування. Місцеві комітети, партизанські провідники та селянські колони постачання тепер служать армії в польових умовах. Кожне село стає складом, кожна дорога — можливою засідкою, а кожен відступ — шансом затягнути ворога глибше вглиб країни."
 SIA_prepare_to_drop_desc:0 "Коли настане час визволення, Союзники можуть спробувати спуститися на нашу батьківщину з неба. Тому ми повинні визначити майданчики для приземлення, підготувати контакти та організувати мережі підтримки, щоб повітряно-десантні війська можна було прийняти та спрямувати туди, де вони найбільше потрібні."
 SIA_public_credit_trigger:0 "$idea_SIA_public_credit_debt$ активний щонайменше §Y180 днів§!"
 SIA_recognize_manchukuo:0 "Визнання Маньчжоу-Го"
 SIA_siamese_development_cooperative_desc:0 "Приватний капітал обережний, і держава не може побудувати все сама. Національний кооператив розвитку дозволить чиновникам, купцям і землевласникам об'єднувати ресурси для проектів, що служать загальній економіці."
 SIA_tac_bomber_equipment_2:0 "Mitsubishi Ki-21"
 SIA_textile_mills:0 "Текстильні фабрики"
 SIA_textile_mills_desc:0 "Одяг — це щоденна необхідність, але надто багато його тчуть за кордоном і продають нам назад. Текстильні фабрики замінять імпортні товари, забезпечать роботою містян і дадуть [ROOT.GetNameDef] одну з базових галузей сучасного життя."
 SIA_thai_cultural_mandates_desc:0 "Ми можемо згуртувати тайський народ і побудувати сильну національну культуру, видаючи мандати, зміцнюючи єдність народу та формуючи єдину ідентичність."
 SIA_the_purge:0 "Чистка"
 SIA_the_regency_of_rangsit:0 "Регентство Рангсіта"
 SIA_urge_restraint:0 "Закликати до стриманості"
 SIA_war_fervor_cat:0 "Воєнний запал"
 SIA_war_fervor_coup_dummy_desc:0 "Якщо апетит народу до війни закипить і не знайде виходу, він неминуче буде спрямований на нас."
 SIA_when_civil_war_starts:0 "Коли починається Громадянська війна:"
 SIC_communism_DEF:0 "Сичуаньська радянська республіка"
 SID_communism:0 "Соціалістичний союз південних націй, національностей і народів"
 SID_communism_ADJ:0 "Південн"
 SIK_light_tank_aa_equipment_2:0 "PGZ 36"
 SIK_light_tank_equipment_1_short:0 "Type 34"
 SIK_medium_tank_destroyer_equipment_2_short:0 "PTZ 41 Z"
 SIK_medium_tank_equipment_2:0 "Type 41 Zhōng"
 SIK_soviet_intervention_desc:0 "Шен Шицай довів, що не заслуговує на довіру, постійно змінюючи свої прихильності. Тому ми повинні замінити його кимось, кому ми можемо довіряти керувати Сіньцзяном у напрямку, що не розходиться з лінією партії."
 SIK_super_heavy_tank_equipment_1_short:0 "Type 44"
 SIN_ADJ:0 "Сіндськ"
 SKK_fascism_ADJ:0 "Кіратськ"
 SLV_AUS_autonomy_eu_member:0 "Європейська Словенія"
 SMB_department_of_military_intelligence_default_desc:0 "Хоча ці слова можуть бути протилежними за змістом, важливо розуміти, що без належного знання позицій і мотивацій ворога буде важко перемогти його в прямому бою. Тому створення воєнної розвідки в армії є необхідністю."
 SMB_experimental_weapons_department_desc:0 "[SMB_experimental_weapons_department_desc_key]"
 SMB_mechanized_troops_default_desc:0 "Щоби розвивати наші збройні сили і правильно сприймати майбутнє війни, ми докладемо значних зусиль для механізації наших регулярних військ, щоб вони разом із танковими полками могли сіяти хаос на полі бою, перебуваючи в надійному «бронежилеті»."
 SMB_naval_arms_race:0 "Спричинено морську гонку обзроєнь у Південній Америці"
 SMB_naval_invasion_desc:0 "Для боротьби з ворожою державою часто доводиться висаджувати солдатів на її береги. Аби максимізувати нашу здатність проводити такі операції, ми розпочнемо вишкіл армії та флоту на спільних навчаннях."
 SMB_naval_support_default_desc:0 "Завдання наших літаків номер один — допомагати нам розчищати шлях і захищати наші флоти та цивільні конвої. Тому важливо розробляти літаки з урахуванням ролі морської підтримки та патрулювання, а також переконатися, що вони можуть уникнути збиття бортовими зенітними гарматами."
 SMB_purchase_obsolete_ships_tt:0 "Будуть відкриті рішення §Y$south_american_naval_arms_race_category$§!, які дозволяють придбати дредноути та інші старі основні кораблі у великих держав."
 SMB_reescalate_the_naval_arms_race_default:0 "Поновити морську гонку обзроєнь"
 SMB_special_forces_option_1_continuation_default_desc:0 "Задля підтримки наших альпіністів нам слід найняти рейнджерів — солдатів, спеціально навчених атакувати та розвідувати не тільки в горах, але й у лісах і джунглях Південної Америки."
 SMB_special_forces_option_3:0 "[SMB_special_forces_option_3_key]"
 SMB_special_forces_option_3_continuation_default:0 "Підтримка повітряних висадок"
 SMB_support_company_bra:0 "Вишкіл першопрохідців джунглів"
 SMB_war_planning_office_default_desc:0 "Нам також потрібно вже зараз подбати про те, щоб наша армія отримувала правильні та добре продумані плани і накази, аби не відставати в інформаційній війні та не отримувати застарілі дані, через які вона може потрапити в засідку і бути знищеною. Для цього ми мусимо заснувати управління військового планування, щоби краще координувати ці зусилля."
 SMB_winning_the_air_war:0 "[SMB_winning_the_air_war_key]"
