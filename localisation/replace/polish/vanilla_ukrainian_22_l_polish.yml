 RAJ_agrarian_socialism:0 "Аграрний соціалізм"
 RAJ_an_indian_sandhurst:0 "Індійський Сендгерст"
 RAJ_appoint_german_friendly_government:0 "Призначити пронімецький уряд"
 RAJ_assume_eastern_naval_responsibilities_desc:0 "Ніхто не сумнівається, що [JAP.GetNameDef] створює проблеми на сході. У міру того, як їхні плани проявляються, стає вкрай необхідним, щоб ми підготували наш флот для захисту [RAJ.GetAdjective] вод. Ми повинні звернутися до Корони та попросити їх надіслати кораблі [ENG.GetAdjective] флоту для допомоги в наших зусиллях."
 RAJ_capital_ship_effort_desc:0 "Будучи британським аванпостом, Індія добре знає, що основні кораблі — ключ до морського панування. Ми мусимо створити власний флот важких крейсерів та лінкорів."
 RAJ_circuvment_demobilization_restrictions:0 "Обхід обмежень"
 RAJ_defense_of_burma_desc:0 "[BRM.GetNonIdeologyName] лежить безпосередньо на схід від Бенгалії, а її джунглі слугують останнім природним бар'єром для захисту кордонів [RAJ.GetNonIdeologyName] від проникнення загрози зі сходу. Вкрай важливо, щоб ми мобілізували оборонні сили в регіоні, щоб стояти пліч-о-пліч з [BRM.GetAdjective] та утримувати Індійський субконтинент міцно в [ENG.GetAdjective] руках."
 RAJ_establish_local_recruitment_offices_tt:0 "Прогнозована кількість місяців до зменшення негативного ефекту від §Y$idea_RAJ_agrarian_society$§! через рекрутингові офіси: [?var:RAJ_projected_time_left]. Подальше розширення рекрутингових офісів прискорить цей процес.\n \nНаразі це зменшило ефекти на:\n$experience_gain_army_tt$ §R[?RAJ_agrarian_society_experience_gain_army_factor_offices]%§!\n$mobilization_speed_tt$ §G[?RAJ_agrarian_society_mobilization_speed_offices]%§!\n$conscription_factor_tt$§G[?RAJ_agrarian_society_conscription_factor_offices]%§!\n $mobilization_laws_cost_factor$: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_offices]%§!\n\nМаксимальний ліміт:\n$experience_gain_army_tt$ §R[?RAJ_agrarian_society_experience_gain_army_factor_offices_max]%§!\n$mobilization_speed_tt$ §G[?RAJ_agrarian_society_mobilization_speed_offices_max]%§!\n$conscription_factor_tt$§G[?RAJ_agrarian_society_conscription_factor_offices_max]%§!\n $mobilization_laws_cost_factor$: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_offices_max]%§!"
 RAJ_funnel_british_investments_into_princely_states_tt:0 "Кожен суб'єкт на Індійському субконтиненті отримає §G1§! §Yцивільну фабрику§! та §G3§! комірки для будівництва.\nСуб'єкти, які ще не звільнені, отримають бонус після звільнення."
 RAJ_german_technology:0 "[Root.GetGermanTechnologyName]"
 RAJ_german_technology_desc:0 "Німецькі вчені є найкращими у світі, а їхня військова машина використовує новітні конструкторські розробки. Вони готові поділитись своїми відкриттями з нами."
 RAJ_guided_democracy:0 "Керована демократія"
 RAJ_heavy_tank_destroyer_equipment_2:0 "Churchill Gun Carrier"
 RAJ_heavy_tank_destroyer_equipment_2_short:0 "Churchill Gun Carrier"
 RAJ_hindutva:0 "Хіндутва"
 RAJ_indian_gurkhas_desc:0 "Гуркхи з Пенджабу та Непалу славляться своєю військовою майстерністю. Вони зберігають вірність Британській Індії протягом багатьох років і здатні виконати будь-яке бойове завдання."
 RAJ_indian_national_highways:0 "Індійські національні автомагістралі"
 RAJ_infantry_at2:0 "PIAT"
 RAJ_land_reforms_desc:0 "Надання більшій кількості людей можливості використовувати землю, яку вони мають, підніме їх із злиднів."
 RAJ_league_against_gandhism_desc:0 "Політика ненасильства Махатми — чудова. На жаль, [ENG.GetAdjective] знову і знову доводили, що вони зустрінуть протести кулями. Тому потрібна нова тактика, за потреби, забарвлена кров'ю."
 RAJ_linlithgows_declaration_of_war_current_effects_tt:0 "§Y[ROOT.GetNameWithFlag]§! оголошує війну кожному поточному ворогу свого сюзерена"
 RAJ_netaji_desc:0 "Нетаджі Субгас Чандра Бос втілює дух невпинного опору імперському правлінню. Його бачення та лідерство надихають мільйони приєднатися до боротьби за суверенну Індію. Під його керівництвом мрія про незалежність наближається до реальності."
 RAJ_power_sharing_agreement_desc:0 "Мусульманська ліга дивиться на нас з підозрою, боячись того, що станеться з мусульманами в Індії, де домінують індуси. Ми укладемо з ними угоду про рівний розподіл влади."
 RAJ_procure_the_task_force:0 "Оперативна група Варуна"
 RAJ_provincial_autonomy_occupation_law_tt:0 "Відмикає закони про окупацію §Y$independent_rule$§! та §Y$princely_subjugation$§! для туземних князівств"
 RAJ_royal_indian_navy_desc:0 "Нам необхідно якнайшвидше розширити склад Королівського [ROOT.GetAdjective]ого флоту. Нові тактичні методи та нові кораблі повинні стати головним завданням."
 RAJ_royal_indian_navy_mutiny_desc:0 "Невдоволення назріває серед індійських моряків, висловлюючи підтримку нашій справі. Ми можемо використати це для захоплення влади та зупинення британських підкріплень. У них не буде іншого вибору, окрім як підкоритися."
 RAJ_secular_rule_alt:0 "Спадщина Тімурідів"
 RAJ_secure_west_bengal_decision:0 "Удар по Східному Пакистану"
