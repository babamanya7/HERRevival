 PRC_establish_sabotage_operations:0 "Створити $PRC_anti_japanese_base$ у [FROM.GetName]"
 PRC_form_central_social_affairs_department_desc:0 "Коригування мети нашої революції неминуче призведе до дискусій між її прихильниками та опонентами. Однак цей ідеологічний дискурс ризикує перерости в антиреволюційні теми, тому ми повинні створити розвідувальну службу для моніторингу наслідків утвердження маоїзму."
