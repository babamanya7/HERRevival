 SOV_preemtive_invasion_of_iran_desc:0 "$SOV_preemptive_invasion_of_iran_desc$"
 SOV_raskovas_aviation_group_desc_default:0 "Марина Раскова зарекомендувала себе як надзвичайно здібний штурман і пілот. Зважаючи на те, що наші ресурси в цій війні виснажені, ми не можемо дозволити комусь із таких досвідчених людей, як вона, сидіти осторонь. Ми мусимо дати їй ресурси для того, щоб вона змогла підняти кілька авіаційних підрозділів для підтримки боротьби."
