 SWE_finnish_integration_desc:0 "[FIN.GetAdjective]ий суверенітет був успішно розірваний нами в останні роки. Тепер ми повинні зробити останній поштовх і вимогти, щоби вони знову посіли своє місце як наших законних підданих. Якщо вони не зроблять цього добровільно, ми змусимо щоб вони побачили розум."
 SWE_five_year_plan:0 "Комітет державного планування"
 SWE_gotaverken_desc:0 "Для модернізації військово-морських сил нам потрібно розширити верфі Götaverken та інвестувати в нові технології виробництва для будівництва військових кораблів."
