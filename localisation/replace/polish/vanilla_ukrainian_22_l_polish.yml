 SOV_mine_warfare_desc:0 "Економічно невигідно намагатися захищати всю нашу берегову лінію за допомогою кораблів. Встановлюючи мінні поля в стратегічних місцях, ми можемо стримувати або принаймні завдавати шкоди будь-якому ворожому флоту, що намагається наблизитися до нашого узбережжя."
 SOV_modernize_aircraft_facilities_tt:0 "Якщо в області §Y[260.GetName]§! нема інших §Yекспериментальних комплексів§!, ми отримаємо §G1§! §Yінститут аеродинаміки й авіоніки§! в області §Y[260.GetName]§!."
