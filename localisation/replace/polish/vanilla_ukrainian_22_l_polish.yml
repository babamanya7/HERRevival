 attempt_coup_general_desc:0 "Підготуйте спробу державного перевороту проти цільової країни. Коли це буде зроблено, це спровокує громадянську війну. Сила повстання залежатиме від національної єдності нації та політичної популярності вашої ідеології"
 autonomy_annex:0 "Анексована держава"
 available_chief_of_navy:0 "§GМожна§! призначити §Yголовнокомандувачем флоту§!:\n"
 axis1march:0 "Марш Осі"
 balcho_safo_recalled_tt:0 "Отримає 1 військову частину §Yнерегулярної піхоти§!."
 baltic.1.t:0 "[FROM.GetAdjective]ий ультиматум"
 baltic.5.a:0 "Наше майбутнє краще забезпечене, якщо ми справді станемо частиною Вітчизни."
 ban_fascist_party_tt:0 "Зміна популярності фашизму: §G-[?.ROOT.party_popularity@fascism|%0]§!.\n"
 battle_cruiser_1_desc:0 "Післявоєнні лінійні крейсери являють собою важкоозброєні кораблі, що поступаються лінкорам у бронюванні, але виграють у швидкості."
 bba_news.1.desc:0 "Загроза спалахування великої війни стривожила світових лідерів. Глава СРСР [SOV.GetLeader] виміг від лідера Італії [ITA.GetLeader], щоби держава [ITA.GetName] зупинила незаконну війну проти держави [ETH.GetNameDef]. [SOV.GetLeader] ясно дав зрозуміти, що якщо [ITA.GetName] не виконає цієї вимоги, [SOV.GetLeader.GetHerHim] доведеться застосувати силу, щоби змусити їх зупинитися. Протягом останніх місяців, [SOV.GetAdjective]а влада щедро надсилала допомогу державі [ETH.GetNameDef] у вигляді озброєння та радників. Стає все зрозуміліше, що [SOV.GetNameDef] вважає країну частиною своєї сфери впливу."
 bba_news.106.a:0 "Кінець епохи."
 bba_news.106.t_king:0 "Король Італії"
 bba_news.5.desc_does_not_own_454:0 "[ETH.GetLeader] оголосив, що завдяки королівському родоводу, який нібито простягається в минуле аж до біблійного короля Соломона, саме він є законним правителем області [454.GetName]. Привид чергового невдоволення балансом сил у світі, без сумніву, посіє страх у столиці області, але які геополітичні наслідки буде мати це переродження Ефіопії, ще невідомо."
 bba_news.7.a:0 "Який жах."
 belgium_war:0 "Серця з колючого дроту"
 bftb_bulgaria_balkan_federation.3.t:0 "Пропаганда Балканської федерації"
 bftb_bulgaria_democratic_international_policies.5.desc:0 "Наша делегація, відправлена в державу [ENG.GetNameDef], повернулася після успішної петиції до [ENG.GetAdjective]ого уряду, що погодився передати державі [BUL.GetNameDef] адміністративний контроль."
 bftb_bulgaria_factions.10.t:0 "Розкрита змова «Звена»"
 bftb_bulgaria_factions.27.t:0 "Широкі соціалісти інтегровані"
 bftb_bulgaria_factions.29.a:0 "Це було нешвидко..."
 bftb_bulgaria_factions.72.desc:0 "Ми спробували завдати рішучого удару Землеробському національному союзу, але зазнали нищівної поразки. Поліція знайшла ймовірне місце таємної зустрічі аграріїв у сільській місцевості, де вони, за чутками, налаштовували фермерів проти уряду. Але виявилося, всього лише подискутувати про книгу Александира Стамболійського «Політичні партії чи станові організації». Ефектна поява поліції не принесла результатів. Чи треба говорити, що дії правоохоронців не викликали розуміння у народу і тим більше у аграріїв..."
 bftb_bulgaria_fate_of_the_balkans.9.a:0 "Не можна давати їм послаблень!"
 bftb_bulgaria_fate_of_the_balkans.9.t:0 "[FROM.GetNameDefCap] відмовляється прийняти вимоги держави [BUL.GetNameDef]"
 bftb_bulgaria_german_influence.1.desc:0 "[GetFirstDonation] між нашою країною та державою [GER.GetNameDef], Герман Гьорінг пропонує нам 12 [GER.GetAdjective]их винищувачів, очевидно, бажаючи схилити державу в альянс [GER.GetFactionName] і отримати могутнього союзника на Балканах і вартового [GER.GetAdjective]их інтересів у регіоні."
 bftb_bulgaria_german_influence.5.a:0 "[BUL.GetLeader] показав себе досить мудрою людиною."
 bftb_bulgaria_rearmament.8.desc:0 "[ROOT.GetAdjectiveCap]а делегація прибула в Лондон у спробі вимогти в [ENG.GetAdjective]ого уряду зняття обмежень з наших збройних сил. Новини невтішні: [ENG.GetNameDef] не збирається виконувати наші вимоги та не дозволить державі [ROOT.GetNameDef] переозброюватися."
 bftb_bulgaria_yugoslavian_influence.1.t:0 "Болгарський договір про вічну дружбу"
 bftb_greece.17.t:0 "Іракліонська конвенція — [FRA.GetAdjective]а держава не отримує мандат!"
 bftb_greece.180.t:0 "Наші представники відвідують національну виставку в державі [FROM.GetNameDef]"
 bftb_greece.184.a:0 "Можливо, варто спробувати укласти угоду з совєтами?"
 bftb_greece.184.desc:0 "Можливо, ми занадто напирали з питаннями про інвестиції: [FROM.GetAdjective]і інвестори вирішили, що їм нецікаво вкладати кошти в зростаючу промислову базу нашої країни. Якщо вони не бажають допомогти нам створити власне майбутнє, нам доведеться зробити це без них."
 bftb_greece.185.desc:0 "Коли [FROM.GetAdjective]ий уряд запросив нас обговорити наші економічні зв'язки, ми не могли відмовити. Що ж могло довести [FROM.GetAdjective]ий народ до такого відчаю, щоб його уряд з'явився до нас за фінансовою допомогою? Зрозуміло, нам переконливо обґрунтували, чому [FROM.GetAdjective]у промислову міць слід наростити — адже це піде на користь і нашій промисловості."
 bftb_greece.19.t:0 "Іракліонська конвенція — [ENG.GetAdjective]а держава отримує свій протекторат!"
 bftb_greece.200.desc:0 "Іракліонська конвенція офіційно завершилася і пройшла з великим успіхом! Всі учасники залишили її, заручившись правами на територіальні претензії, а держава [GRE.GetNameDef], зважаючи на все, відповідно значно розширити свої кордони. Разом ми помстимося за Севрський мирний договір негідній державі [TUR.GetName]."
 bftb_greece.30.b:0 "Вони — самі по собі."
 bftb_greece.37.a:0 "Ставте комуністів у лінію, ми їх скосимо одним ударом."
 bftb_greece.38.t:0 "Турки перемагають наші війська!"
 bftb_greece.44.desc:0 "Як і очікувалося, Червона армія швидко розправилася з жалюгідними [FROM.GetAdjective]ими гарнізонами в області [354.GetName] і проклала шлях для цілком натхненно рутинного вторгнення. Поки ми атакуємо їх з півночі, [GRE.GetAdjective]і війська нападуть із заходу. У ворога немає шансів."
 bftb_greece.47.a:0 "Невже Вітчизні загрожує лихо?"
 bftb_greece.51.a:0 "Їм, без сумніву, знадобляться гвинтівки."
 bftb_greece.55.a:0 "Чудова ідея!"
 bftb_news.11.desc:0 "\n[BUL.GetAdjective]ий уряд підписав торгові угоди з декількома [GER.GetAdjective]ими компаніями у спробі зміцнити зв'язки з державою [GER.GetNameDef] і водночас залучити до країни іноземний капітал.\nУ рамках цієї угоди [GER.GetAdjective]і інвестори отримають значні юридичні привілеї та податкові послаблення в державі [BUL.GetNameDef]."
 bftb_news.2.c:0 "Схоже, конфлікт на Балканах незабаром спалахне з новою силою..."
 bftb_news.201.t:0 "[TUR.GetNameDefCap] ремілітаризує Турецькі протоки"
 bftb_news.302.desc:0 "Весь світ ворожив про цілі закритої Іракліонської конвенції, численні учасники якої прибули з усієї Європи. Більше гадати не потрібно: сьогодні [GRE.GetLeader] оголосив, що [GRE.GetAdjective]а мрія про Велику Грецію нарешті буда реалізована. \n\nЕксперти дивувалися, наскільки стрімко розширюється [GRE.GetNameDef], і заявляли, що, враховуючи складну політичну обстановку та економічні труднощі, настільки серйозні зміни в [GRE.GetAdjective]і державі неможливі, але осттані події показали, що це не так."
 bftb_turkey.134.d:0 "Февзі Чакмак — той лідер, якого чекає [TUR.GetNameDef]."
 bftb_turkey.138.b:0 "Підтримка цих відступників не принесла нам нічого хорошого."
 bftb_turkey.24.j:0 "Хм... Можливо... Колишній халіф?.."
 bftb_turkey.29.t:0 "Колишні відмовники добровільно йдуть служити"
 bftb_turkey.39.a:0 "Дипломатичний тріумф!"
 bftb_turkey.41.a:0 "Об'єднавшись, ми зможемо захистити Балкани."
 bftb_turkey.46.a:0 "Ми намагалися і зазнали невдачі. Інших варіантів у нас немає."
 bftb_turkey.47.desc:0 "[FROM.GetLeader], президент держави [FROM.GetNameDef], зв'язався з нами і висловив стурбованість безпекою наших колоній у затоках Аравії. [FROM.GetAdjective] лідер запропонував: нехай [FROM.GetNameDef] візьме відповідальність за оборону та управління всім регіоном, це виправдано як самою історією держави [FROM.GetNameDef], так і її близькістю до області. просило передати йому контроль над Левантським регіоном. Аналітики стурбовані тим, що ці дипломатичні захоплення території стратегічно сплановані державою [FROM.GetNameDef] так, щоби затвердити новий статус-кво для регіону, де незаперечний вплив держави [FROM.GetNameDef] на весь субконтинент. Незалежно від майбутніх проблем держава [FROM.GetNameDef] все ж таки залишається нашим союзником, і якщо ми хочемо, щоб це тривало і далі, розумно буде поступитися її го прохання про контроль над нашими аравійськими колоніями."
 bftb_turkey.52.t:0 "[FROM.GetNameDefCap] відправляє легкі танки"
 bftb_turkey.71.a:0 "[IRQ.GetName]? Нас це не стосується."
 bftb_turkey.76.desc:0 "[FROM.GetAdjectiveCap]і представники поступилися нам повним контролем над нашими нафтовими родовищами. Наш суверенітет тепер належить нам, ми перемогли імперіалістів у їхній же грі!"
 bftb_turkey.97.desc:0 "Кажуть, історія йде по колу, але жоден учений, що заслуговує на повагу, не міг передбачити те, що зараз відбувається. Багато хто в уряді відчуває дежавю: [FROM.GetNameDef] надсилає нам ультиматум! [FROM.GetLeader] вимагає від нас покірності!\n\nЯкий абсурд!Як таке взагалі могло статися?Як це припустив турецький народ?Як ми дозволили собі опинитися в такому становищі?Ситуація безглузда, але загроза реальна. Необхідно вирішити, чи готові ми знову дати відсіч [FROM.GetAdjective] загрозі, як десятки років тому, або часи настільки змінилися, що ми не посміємо чинити опір їхнім незрозумілим ідеям, щоби не накликати на себе їхній гнів?"
 britain.14.b:0 "Історія нас не пробачить."
 britain.14.d:0 "Уряд Німеччини почав агітувати щодо зміни статусу Словенії, яка, на їхню думку, є історичною німецькою провінцією Карніола. Вони стверджують, що німців і словенців пригнічує югославський уряд. Уряд Його Величності запросив уряди Франції, Німеччини та Італії на конференцію в Лондоні для пошуку справедливого вирішення цього питання. Безсумнівно, що нечисленна німецька меншина бажає приєднатися до Німеччини, але бажання словенського населення менш ясні. Німеччина, схоже, готова спустити псів війни через це, і темні хмари війни знову збираються на європейському континенті."
 britain.18.d:0 "Ні для кого не секрет, що між Георгом VI і партією [Root.GetRulingParty] не найкращі стосунки. Голоси в парламенті зараз закликають його піти у відставку на користь свого брата у вигнанні Едуарда VIII. Цій людині менш чужі ідеї єдності крізь силу, і в нього є своє бачення Англії. Це ті якості, які ми шукаємо в лідері нашої нації!"
 bruneval_attack:0 "Захопити РЛС"
 byz_triumph_for_middle_east_desc:0 "Левант тепер під нашим контролем, і його слід реінтегрувати в нашу імперію на урочистій церемонії!"
 ca_tech:0 "Моделі крейсерів"
 capture_tito_exfiltration_desc:0 "Поєднавшись, два штурмові загони спільно зачистять район від бійців супротивника."
 carousel_bombing_desc:0 "Бомбардувальники найчастіше намагаються скоріше скинути всі свої бомби після прибуття в район мети і повернутися додому. Цей спосіб працює при майданному бомбометанні, але коли потрібно вразити невелику мету, краще затриматися над нею довше і скидати боєзапас по частинах, так точність."
 carrier_4:0 "Авіаносець IV"
 cat_ship_heavy_battery:0 "Важкі батареї"
 cavalry_desc:0 "Піхота верхи на конях. Дорожча, але більш мобільна."
 centimetric_radar:0 "Сантиметровий радар"
 centrism:0 "Центризм"
 chilean_trade_deals_opinion_modifier:0 "Вигідні торгові угоди"
 china.105.t:0 "Китай об'єднується"
 china.13.d:0 "І ми, і Червона армія ледь відновилися після попередньої сутички, а присутність наших військ на кордоні розпалила конфлікт знову. Разом з місцевими воєначальниками й військовими ми розглядаємо варіант віднести наші війська.\n\nХоч це й позбавить нас можливості роздавити комуністичну загрозу раз і назавжди, це буде великою ідеологічною перемогою, що покаже, що ми не дозволимо їм розширяться надалі."
 china.16.d:0 "Наші зусилля по проведенню непрямої війни проти розширеної присутності Гоміньдану обернулися катастрофою. Націоналісти були більш віддані нашому витісненню, ніж ми очікували, схоже, розраховуючи на великий удар по нашій репутації у випадку поразки. Хоч армія знову може безпечно відновитися, втрати не лишилися непоміченими місцевими і чутки про провал революції вже поширюються в сусідні села."
 china.6.b:0 "Найняти місцевих бандитів на наш бік."
 china_struggle_full_support_breakdown:0 "[Root.GetNameDefCap] має [?Root.total_political_support_points|+0] §Hбалів політичної підтримки§!\n[Root.GetStateSupport][Root.GetWarlordSupport][Root.GetOtherSupport]\n\n"
 cic_to_overlord_factor_tt:0 " $MODIFIER_CIC_TO_OVERLORD_FACTOR$: $RIGHT|Y=%1$"
 claim_karelia_desc:0 "Згідно з пактом Молотова-Ріббентропа, Фінляндія входить у сферу наших інтересів, і настав час переглянути її кордони. Південна ділянка фінського кордону підходить надто близько до Ленінграду, що загрожує безпеці нашої країни. Ми вимагаємо від фінського уряду повинні підготуватись до бойових дій на той випадок, якщо воно відповість відмовою."
 coastal_minelaying_covert_buildup:0 "Приховане накопичення"
 comintern_returningincoffins:0 "Повертаючись у трунах"
 commercial_nuclear_reactor_plural:0 "Цивільні ядерні реактори"
 computing_machine_desc:0 "Розробка теоретичної основи для сучасних комп'ютерів та створення електромеханічних машин для реалізації її на практиці стануть першими кроками у новий світ можливостей."
 concentrated_fire_plans_desc:0 "Синхронізувавши вогонь різних батарей, можна завдати супротивнику набагато серйозніших збитків.\n\n"
 congo_independence_struggle.11.t:0 "Створення Домініону Конго"
 congo_independence_struggle.2.t:0 "[FROM.GetNameDefCap] звертається до нас щодо їхньої незалежності"
 congo_independence_struggle.4.t:0 "[FROM.GetNameDefCap] дозволить нам бути вільними, якщо ми заплатимо компенсацію"
 conquest_of_abyssinia:0 "Завоювання Абіссінії"
 conquest_of_abyssinia_short_desc:0 "§LЗдійсніть вторгнення в Ефіопію.§!"
 conquest_of_albania_desc:0 "Італійські війська були змушені залишити землі Албанії, які вони зайняли в 1920 році, але зараз настав час повернутися. Анексія Албанії дасть нам повний контроль над Адріатикою, і ця територія послужить плацдармом для наших подальших кампаній на Балкан."
 continuous_non_factory_construct_desc:0 "Наша будівельна індустрія, як і раніше, неефективна. Зосередивши на ній основну увагу, ми зможемо значно прискорити темпи будівництва. На жаль, виробництво верстатів є серйозною проблемою нашої важкої промисловості, тому вона не отримає вигоди від зусиль у цій галузі."
