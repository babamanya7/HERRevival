 NOA_democratic_party:0 "ПО"
 NORDIC_ad_hoc_military_industry_desc:0 "Немає часу планувати та будувати монументальні фабричні кампуси чи простори з бетону та диму. Ми повинні будувати нашу галузь якнайшвидше, де це можливо, з невеликими заводами, розташованими навколо [NORDIC_get_alliance_name], щоб ми не ризикували програти все в одній битві."
 NORDIC_communist_second_selector_left:0 "Північна академія передових наук"
 NORDIC_economic_union:0 "Економічний союз"
 NORDIC_form_joint_alliance_desc_mon:0 "Однак королівська спадщина, що ґрунтується на наших давніх традиціях, які ми спільні, дозволяє нам побачити ширшу картину та працювати разом, як одне ціле, для збереження наших улюблених королів і королев."
 NORDIC_is_monarchist_tt:0 "Має право створити об'єднаний монархічний альянс"
 NORDIC_mechanized_infantry_desc:0 "Плейсголдер"
 NORDIC_military_construction:0 "Військове будівництво"
 NORDIC_nordic_construction_developments_desc:0 "Ще багато потрібно зробити в [NORDIC_get_alliance_name], і мало часу до настання страшної години. Нам доведеться працювати разом, щоб знайти покращення, необхідні для прискорення розвитку наших країн."
 NORDIC_nordic_mio:0 "Нордична ВПО"
 NORDIC_nordic_rocketry_desc:0 "Що, якби наші бомби можна було доставляти без втручання літака? Майбутнє — це самохідна зброя, ми могли б знищити ворога, не виходячи з [NORDIC_get_alliance_name], якщо забажаємо."
 NOR_GER_fascism:0 "Райхскомісаріат Норвегія"
 NOR_GER_fascism_autonomy_colony_DEF:0 "Райхсланд Норвегія"
 NOR_active_prep_flag_name_generic:0 "Робота над областю"
 NOR_adding_prep_mon_TT:0 "Загальна §YПідтримка монархії§! [NOR.GetName] зростає на §G$RIGHT|0$§!\n"
 NOR_anti_air_artillery_research_desc:0 "Оскільки нові технології розгортаються в повітрі, зброя, яка дозволяє нам захищати наш повітряний простір із землі, має відповідати їм, щоб ми не піддалися перевазі ворога в повітрі."
 NOR_arrest_quisling:0 "Заарештувати Квіслінга"
 NOR_arrest_quisling_desc:0 "Щоразу, коли складається список небезпечних осіб у [NOR.GetName], колишній міністр оборони Відкун Квіслінг рідко з'являється. Його партія зменшується, його друзів мало, і, перш за все, його сліпе поклоніння Адольфу Гітлеру — факт. це зробило б будь-кого іншого небезпечним для будь-якої країни — робить його ще більш жалюгідним. Але, незважаючи на його нікчемність, краще перестрахуватися, ніж шкодувати."
 NOR_bjarmeland:0 "Біармія"
 NOR_bring_back_quisling_desc:0 "Багато бачать у ньому безглуздого бовдура, але прихід Квіслінга до влади вказує на хитрий план, що стоїть за його ймовірними невдачами. Саме така людина має бути біля керма, щоб направляти [NOR.GetName] до нових і щедрі землі, як вікінги давнини."
 NOR_claims_on_faroe_islands_desc_ALT:0 "Наша добропорядна королева Матильда I заплатить кровну ціну, щоби забезпечити їхнє повернення до нас."
 NOR_communist_prep_level_1_TT:0 "$NOR_communist_prep_intro$\n $NOR_communist_prep_join_comm_side$\n $NOR_communist_prep_join_heavy_damage$"
 NOR_cultivate_the_conservative_parties_desc:0 "Незважаючи на низьку підтримку фашизму в [NOR.GetName], навколо Стортінгу кружляє багато консервативних груп. Ми можемо їх вирощувати, щоб посіяти насіння фашизму, а потім привести їх до нас, щоб зміцнити нашу владу в [NOR.GetAdjective]ій політиці."
 NOR_emergency_conversions:0 "Переобладнати цивільні кораблі"
 NOR_encourage_recruitment_desc:0 "Як любить казати наш улюблений камергер, король Гокон живе в наших серцях, тож будь-хто може боротися та померти за нього! Нехай його дух піднесе кожного суб'єкта в [ROOT.GetNameDef], щоб вони записалися на бій за свого сеньйора."
 NOR_establish_milorg_desc:0 "Опір окупації в [NOR.GetName] залишається жорстоким, але йому бракує організованості та дисципліни. Добре скоординований військовий опір, керований із вигнання, може закласти основу для повернення нашого уряду на [NOR.GetAdjective]і землі."
 NOR_get_rid_of_quisling_desc:0 "Переворот Квіслінга ніколи не мав тривати. Це був тимчасовий проміжок на випадок, якщо нашим фашистським союзникам знадобиться хтось, щоб надати вторгненню видимості легітимності. Тепер, коли ясно, що цей надто самовпевнений бовдур нам не знадобиться, ми повинні відмовитися від нього як якомога швидше."
 NOR_light_tank_equipment_1:0 "Eksperimentell Stridsvogn"
 NOR_modify_oppressed_civilians_TT:0 "Змінює §Y$NOR_oppressed_civilians_dmod$§! на:"
 NOR_prepare_for_war_desc:0 "Зараз це здається неминучим, тож навіщо обманювати себе, думаючи, що мир буде вічним. Війна може підкрастися до таких країн, як наша, тому ми повинні бути готові до всього."
 NOR_prepare_state_alt_dem_desc:0 "Ми жахливо не готові до того, що має статися. Ми повинні вжити відповідних заходів, щоб, як тільки почнеться війна, [FROM.GetName] міг зробити свій внесок у військові зусилля. Деякі люди не зрозуміють, але ми зробили свій вибір. Назад дороги немає."
 NOR_rule_the_northern_sea:0 "Панувати Північним морем"
 NOR_secure_the_swedish_iron_ore_desc:0 "[SWE.GetName] має величезну кількість високоякісної залізної руди під своєю землею, яка протікає через Нарвік взимку, коли їхні північні порти замерзають. Залишати це джерело руди відкритим і доступним для будь-якого іноземного тирана неприпустимо, ми повинні захопити його, перш ніж наші вороги подумають зробити те саме."
 NOR_ship_torpedo_2:0 "3x 533-мм торпедний апарат"
 NOR_the_weapons_of_conquest_desc:0 "Перемога над нашими ворогами вимагає не лише людей і бажання боротися. Багато хто загине, але створення інструментів для покращення їхніх шансів означає, що ми можемо розширити наші кордони ще далі."
 NOT_CAN_CONSTRUCT_BUILDING_IN_STATE:0 "Не можна збудувати споруду $BUILDING|Y$ в області $STATE|Y$"
 NOT_HAS_SCIENTIST_WITH_SKILL_IN_SPECIALIZATION:0 "Не має науковця зі спеціалізацією: $SPECIALIZATION$"
 NO_NAVAL_SUPREMACY_INFO:0 "У цьому регіоні немає ні ворожих, ні дружніх кораблів"
 NSB_poland_communist_events.601.t:0 "[From.GetNameDefCap] повертає Східну Польщу!"
 NSB_poland_events.2.a:0 "Думаю, ми мусимо прийняти їхні умови."
 NSB_poland_royal_election.1.b:0 "Ні, у нас є інша кандидатура..."
 NSB_poland_royal_election.2.desc:0 "Претензіям Гогенцоллернів на Польщу майже стільки ж років, скільки самій польській державі. Тепер, коли польсько-румунські відносини стають все більш важливими для виживання обох держав, логічно буде запропонувати наш трон колишньому королю і спадкоємцю.\nЗміщений в 1930 році на користь власного батька, король Міхай є можливість для ймовірного союзу польського і румунського правлінь.. Зараз, коли в Румунії міцніє вплив фашистської організації «Залізна гвардія», у нас є можливість воєнізувати антифашистський рух і знову змістити короля Каро, замінивши його Михаєм. Так ми створимо нероздільний союз націй, і з нашою спільною волею будуть змушені рахуватися наші вороги — [SOV.GetNameDef] і [GER.GetNameDef]."
 NSB_polish_fascist_events.3.b:0 "Ні. Польща наша."
 NSB_polish_fascist_events.402.a:0 "За майбутнє Польщі можна не переживати."
 NSB_soviet_civil_war_common.117.a:0 "Доведеться нам обійтися без них."
 NSB_soviet_civil_war_common.123.desc:0 "У найчорнішу для нас годину [FROM.GetLeader] вирішив відкликати підтримку, обіцяну державою [FROM.GetNameDef], хоча заради неї ми були готові на багато чого."
 NSB_soviet_fascist_tsarist.5.a:0 "Під [FROM.GetAdjective] лідерством ми станемо сильнішими."
 NSB_soviet_fascist_tsarist.5.t:0 "Запрошення до альянсу [FROM.GetFactionName]"
 NSB_soviet_fascist_tsarist.8.desc:0 "Визнавши, що тепер ми, нарешті, поділяємо погляди на світ, [FROM.GetNameDef] запрошує нас вступити до альянсу [FROM.GetFactionName], пропонуючи нам свою військову та економічну підтримку у розвитку нації, подібно до того як вони підтримали зростання нашої партії у державі [ROOT.GetNameDef]!"
 NSB_soviet_foreign_politics_events.20.desc:0 "Щоб підтримати нашу відчайдушну боротьбу за збереження демократії, [FROM.GetLeader] відправляє групу [FROM.GetAdjective] військових радників. Вони володіють багатим досвідом участі в збройних конфліктах і, без сумніву. нашої армії. Спорядження та тактика також допоможуть у боротьбі з так званими добровольчими дивізіями різних фашистських держав."
 NSB_soviet_foreign_politics_events.200.c:0 "Ми боротимемося за свободу!"
 NSB_soviet_foreign_politics_events.250.t:0 "[FROM.GetNameDefCap] відправляє військову допомогу"
 NSB_soviet_foreign_politics_events.264.desc:0 "Після того, як відбувається [GetAppropriateSovietProgressInJapan], [FROM.GetLeader] приймає нашу пропозицію миру і погоджується з нашими територіальними претензіями в обмін на негайне припинення військових дій. 537.GetName], [555.GetName] та [536.GetName] у державу [ROOT.GetNameDef]."
 NSB_soviet_foreign_politics_events.266.t:0 "Пакт про [ROOT.GetAdjective]о-[FROM.GetAdjective]у дружбу"
 NSB_soviet_foreign_politics_events.276.t:0 "[FROM.GetAdjectiveCap]ий видобуток копалин у області [618.GetName]"
 NSB_soviet_foreign_politics_events.283.t:0 "[SIK.GetNameDefCap]"
 NSB_soviet_foreign_politics_events.284.b:0 "Ми не залишимо таку образу безкарним!"
 NSB_soviet_foreign_politics_events.286.a:0 "Прикра ситуація..."
 NSB_soviet_foreign_politics_events.287.t:0 "[SIK.GetNameDefCap] залишає альянс [ROOT.GetFactionName]"
 NSB_soviet_foreign_politics_events.30.t:0 "[FROM.GetNameDefCap] вимагає повернення Аляски"
 NSB_soviet_paranoia_system_events.19.desc_1:0 "Розслідування вбивства товариша Кірова в 1934 року виявило багато зачіпок, що ведуть до змови Зінов'єва і Троцького. Після серії арештів і допитів докази стали ще очевиднішими.\n\n[Root.Get], і ті нарешті зізналися, що спільно з Троцьким планували повалити уряд, убити радянських лідерів і відновити в Радянському Союзі капіталізм. Тепер на них і 14 їхніх спільників-змовників чекає суд."
 NSB_soviet_paranoia_system_events.19.desc_3:0 "Слідство, проведене перед Другим московським процесом, виявило в армії та верхніх ешелонах влади велику мережу троцькістів, очолювану Бухаріним. Ці люди були заарештовані і допитані, після чого зізналися в найсерйозніших до замаху на вбивство, спільні змови із зарубіжними державами і навіть підмішування цвяхів в масло з метою поранити або вбити звичайних радянських громадян. Якщо обвинувачені будуть визнані винними, їх напевно чекає розстріл."
 NSB_soviet_paranoia_system_events.24.b:0 "Очевидно, що це наговор, який [?ROOT.SOV_accuser_character_for_loc.GetName] влаштував, щоб врятувати свою шкуру."
 NSB_soviet_spanish_civil_war.6.t:0 "Тріумф революції в Іспанії"
 NSE_UNIFIED:0 "Імперія Північного моря"
 NSE_UNIFIED_neutrality_DEF:0 "Королівство Північного моря"
