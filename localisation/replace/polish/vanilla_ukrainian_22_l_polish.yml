 GER_an_invincible_army_desc:0 "Численними здобутками та перемогами, які наша армія здобула на полі бою, ми довели всьому світові, що попри те, що кажуть ворожі демагоги, [ROOT.GetAdjective]а армія справді непереможна!"
 GER_anglo_german_naval_development_group:0 "Англо-німецька ініціатива з розвитку військово-морських технологій"
 GER_blr_state_transfer_effect_tt:0 "Кожна виділена область перейде під контроль §Y[BLR.GetNameDef]§!"
 GER_chose_to_not_placate_erich_raeder_tt:0 "Лише менша частина Крігсмаріне приєднається до нас під час перевороту, але ми не будемо пов'язані жодними обіцянками перед Редером"
 GER_conquer_italy_desc:0 "Італійці зрадили нас під час Великої війни, коли атакували Австро-Угорщину і стали на бік Антанти. Ми ніколи не забудемо і ніколи не пробачимо. Час показати їм, до чого призводить зрада та підступність."
 GER_construct_the_west_atlantikwall:0 "Фінансування західного Атлантичного валу"
 GER_controls_norway_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]а маріонетка або член альянсу повністю контролює всі регіони вздовж §YАтлантичного узбережжя§! від §Y[925.GetName]§! до §Y[110.GetName]§!."
 GER_create_rustungsstab:0 "Створити Rüstungsstab"
 GER_cv_fighter_equipment_3_short:0 "BV 155"
 GER_cv_nav_bomber_equipment_1:0 "Fieseler Fi 167"
 GER_defense_of_the_reich_desc:0 "Ми мусимо захистити Фатерланд від ворожих повітряних нальотів. Безпека неба над державою [ROOT.GetNameDef] та захист промисловості на землі мусять мати пріоритет над усім іншим!"
 GER_deutsche_werke_organization:0 "$GER_deutsche_werke$"
 GER_division_britain_armored_tt:0 "§YТанкова§! частина §YSS-Panzerdivision Oliver Cromwell§! and the §Yarmored SS-Panzerdivision Sankt Georg§! з'явиться без оснащення, але з повними запасами людських ресурсів."
