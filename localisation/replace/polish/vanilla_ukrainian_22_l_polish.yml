 SOV_request_imperial_protection_tt:0 "Якщо вони погодяться: §Y[JAP.GetNameDef]§! приєднається до війни. §Y[ROOT.GetNameDefCap]§! стане маріонеткою держави §Y[JAP.GetNameDef]§!."
 SOV_right_purges_desc:0 "Є ще кілька членів партії, які не повністю прийняли наші правила. Нам потрібно буде зробити з них приклад, щоб решта не відставали."
