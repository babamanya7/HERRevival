 sp_naval_modern_battleship_unique_reward_b_desc:0 "Щоб довести нашу правоту та втримати позиції, нам доведеться витримувати удари ворога. Що варто покращити, аби ми могли відповісти тим, хто наважиться стати на нашому шляху?"
 sp_naval_modern_carrier_unique_reward_a_desc:0 "З новим поколінням авіаносців ми можемо зосередитися на певних аспектах корабля, щоб краще відповідати нашим потребам. На чому саме слід сконцентрувати зусилля?"
 sp_naval_nuclear_missile_submarine_desc:0 "Якщо ми зможемо спливти на поверхню, випустити ракету з ядерним зарядом, а потім знову зануритися, наш потенціал першого удару стане практично необмеженим."
