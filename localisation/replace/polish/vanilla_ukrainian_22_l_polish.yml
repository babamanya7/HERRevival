 FRA_scw_intervention_republicans_SPA:0 "$FRA_scw_intervention_republicans_SPR$"
 FRA_sending_weapons_allowed:0 "Надсилання зброї дозволене"
 FRA_spanish_intervention_category_desc:0 "Групи з усього політичного спектру хочуть так чи інакше втрутитися в громадянську війну в Іспанії. Однак існує значне занепокоєння, що війна може поширитися на нашу країну, якщо ми займемо занадто відкриту позицію на підтримку однієї зі сторін. Ми мусимо бути обережними, щоби не ступити на вузьку стежку, якщо хочемо, щоб Іспанія залишилася під контролем дружнього уряду."
 FRA_strengthen_government_support_desc:0 "Ми склали плани на наступний рік, які відповідають інтересам усіх громадян Франції. Потрібно показати народу, що ми готові діяти та здатні керувати країною. Тільки так ми досягнемо єдності."
 FRA_sub_ship_nuclear_engine_1_short:0 "Реактор «K48»"
 FRA_the_free_french_navy:0 "Флот Вільної Франції"
 FRA_towards_a_new_europe_desc:0 "Франція знаходиться на роздоріжжі. Ми можемо прив'язати себе до старого порядку, а можемо прийняти новий. Оскільки німці готові переробити континент, нам було б вигідно бути на їхньому боці."
