 SOV_improve_the_stalin_line_desc:0 "Наш західний кордон занадто довгий, щоб укріпити його повністю. Але ми можемо побудувати комплекс укріплень, який спрямує будь-яку атаку ворога на передбачувані ділянки, де ми зможемо легко контратакувати його масованими силами."
 SOV_industry_relocation_trains_tt:0 "§R[?SOV_industrial_relocation_trains_decision_negative] потягів§! буде використано на тривалість цього рішення."
 SOV_infiltrate_the_nkvd:0 "Проникнути в НКВС"
 SOV_infiltrate_the_nkvd_desc:0 "Рядовий склад НКВС — це ті, хто виконує брудну роботу Сталіна; він часто діє в якості його вірних слуг. Але навіть стіна має тріщини. Ми мусимо зробити так, щоб якомога більше з них працювали на нас, замість того, щоб годувати тирана неправдивою інформацією."
