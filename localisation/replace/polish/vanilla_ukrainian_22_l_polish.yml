 YUG_local_militias_desc:0 "Людей заохочуватимуть формувати ополчення для захисту своєї батьківщини. Це дозволить згодом більшій частині населення отримати право призову на військову службу."
 YUG_modernize_the_air_force:0 "Модернізувати ВПС"
 YUG_positive_discrimination_croat:0 "Позитивна дискримінація хорватів"
 YUG_research_collaboration_desc:0 "Наші союзники мають у своєму розпорядженні набагато більші ресурси, ніж ми, тому ми повинні наполягати на дослідницькій співпраці, яка дозволить нам розділити їхні технологічні прориви."
 YUG_slovenia_for_support_desc:0 "Країни Осі задумали розділити нашу країну між собою. Можливо, передавши Словенію Італії, ми зможемо позбутися підривних елементів у Словенії та продемонструвати свою приязність до справи Осі."
 YUG_surrender_italian_claims:0 "Віддати італійські претензії"
 YUG_surrender_macedonia_desc:0 "Болгарія теж має підстави конкурувати з нами; претендуючи на південну Сербію та Македонію. Поступившись їхніми претензіями до них, ми одночасно замовчимо загрозу на нашому південному кордоні та зробимо македонський націоналізм проблемою Болгарії."
 YUG_tank_conversions_desc:0 "Хоча зараз нам можуть знадобитися танки, наступного місяця нам можуть знадобитися самохідні артилерійські установки чи винищувачі танків на тому ж шасі. Наша бронетехніка має залишатися гнучкою та адаптуватися до наших поточних потреб."
