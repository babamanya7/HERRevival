 MODIFIER_FACTION_SUBJECT_CONTRIBUTION_GAIN_DESC:0 "Зменшує приріст внеску від статусу підлеглої держави."
 MODIFIER_INDUSTRY_REPAIR_FACTOR_DESC:0 "Модифікатор швидкості ремонту §Hцивільними заводами§!."
 MODIFIER_LAND_EQUIPMENT_UPGRADE_XP_COST_DESC:0 "Множник вартості в досвіді при зміні наземного оснащення."
 MODIFIER_MINES_SWEEPING_BY_FLEETS_FACTOR_DESC:0 "Модифікатор загальної ефективності вилову морських мін нашими флотами."
 MODIFIER_NAVAL_INVASION_PREPARATION_DAYS:0 "Час підготовки морського вторгнення"
 MODIFIER_NAVY_ANTI_AIR_ATTACK_DESC:0 "Атака протиповітряних атак кораблів."
 MODIFIER_SPECIAL_FORCES_OUT_OF_SUPPLY_FACTOR_DESC:0 "Модифікатор штрафу до втрати та відновлення організації, який сили спеціальних операцій зазнають, коли в них закінчуються припаси."
 MODIFIER_STRATEGIC_BOMBER_DEFENCE_FACTOR_DESC:0 "Модифікатор оборонної величини бомбардувальників, який дозволяє їм довше прожити під час протиповітряної атаки."
 MODIFIER_THERMONUCLEAR_PRODUCTION_FACTOR:0 "Темпи виробництва §Hтермоядерних бомб§!"
 MODULE_NONE_FIXED:0 "жоден"
 MOVING_AMPHIBIOUS_INVASION:0 "Дивізія проводить морський десант. Її швидкість дорівнює $VALUE|H$ км/год."
 MTG_escalator_clause_invocation_mission_desc:0 "Одна з держав, що підписала угоду, вирішила більше не дотримуватися її умов і, напевно, вже будує нові, більш потужні кораблі. На щастя, умови угоди дозволяють нам автоматично задіяти в такому разі особливе застереження, що послаблює обмеження на розмір кораблів і озброєння для нас."
 MTG_naval_treaty.1.a:0 "Ці умови є прийнятними."
 MTG_naval_treaty.3.desc:0 "Делегація з держави [From.GetNameDef] вийшла з переговорів через, цитуємо, «повної відмови іншої сторони визнавати політичні та стратегічні реалії, які стояти перед державою [From.GetNameDef]».\n\n Мета зовнішньої політики, яка перебуває в контролі озброєння, очевидно, не була досягнута, і багато наблюдачів запитують — як довго ще інші сторони угоди будуть готові дотримуватися обмежень."
 MTG_naval_treaty.9.desc:0 "Делегації з Британії, Франції, Італії, Японії та США зустрілися в грудні 1935 року, щоб обговорити відновлення першої Лондонської морської угоди, яка обмежувала кількість і розмір крейсерів і підводних човнів. Через війну Італії в Ефіопії бажання Японії бути рівною Британії та США переговори вийшли досить напруженими.\n\nТепер, коли вони завершилися, країни, які підписали договір, дійшли згоди щодо обмежень на розмір лінкорів та авіаносців і сподіваються запобігти черговим руйнівним перегонам озброєнь."
 MUN_czech.1002.d:0 "Після експансії на південь [FROM.GetName] висунула незвичну вимогу. Вони вимагають не захоплення земель, а контролю над Югославською оборонною лігою, прагнучи стати захисником і сюзереном північнобалканських країн, які зараз є нашими суб'єктами. Вони стверджують, що будуть кращим захисником, ніж ми, але, звісно, це може бути лише відмовкою."
 MUN_czech.1021.d:0 "[CZE.GetNameDefCap] звернулася до нас із проєктом торговельної угоди між колишніми країнами Австро-Угорщини. Хоча новий [CZE.GetAdjective]ий уряд і задоволений своєю незалежністю, він, здається, особливо охоче бажає відновити вигідні елементи австро-угорської держави."
 MUN_czech.1026.white_peace:0 "Сьогодні наші представники повернулися з сумною новиною: незважаючи на окупацію [66.GetName], [FROM.GetAdjective]е керівництво не бажає підписувати мирний договір. Схоже, нам доведеться або просуватися далі в наших завоюваннях, або сподіватися, що ми їх виснажимо."
 MUN_czech.1032.d:0 "Нещодавні зусилля щодо вирішення проблем у [FROM.getname] увінчалися успіхом і дозволили знизити рівень невдоволення центральним урядом, принаймні на даний час. Ресурси нашого уряду тепер звільнилися для спрямування на інші соціальні чи економічні програми, які продовжуватимуть боротися з проблемами, що розколюють нашу країну."
 MUN_czech.1053.d:0 "Перетворивши Угорщину на підлеглу державу, [FROM.GetNameDef] тепер вимагає, щоб і ми змирилися з такою ж долею. Вони погрожують, що в разі нашої відмови вони підтримають [HUN.GetAdjective]і претензії на [ROM.GetAdjective]у територію. Тепер ми мусимо обирати між втратою нашого суверенітету або потенційною загрозою нашій територіальній цілісності."
 MUN_czech.1054.t:0 "Спільне вторгнення у Литву?"
 MUN_czech.2.d.2:0 "У світлі нещодавніх новин про наші плани щодо Чехії, судетські політичні партії швидко мобілізували свої воєнізовані формування — Судетський добровольчий корпус. Загони добровольчого корпусу по всій Судетській області розпочали напади на об'єкти, що належать [CZE.GetAdjective]ому уряду. Тепер вони просять про нашу повну підтримку в проведенні транскордонних рейдів та здійсненні диверсій проти [CZE.GetAdjective]ого війська."
