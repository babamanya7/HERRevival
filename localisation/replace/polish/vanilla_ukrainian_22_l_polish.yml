 BUL_found_the_brannik_desc:0 "Богдан Філов має цікаву пропозицію заснувати профашистську національну молодіжну організацію під назвою «Бранник» §g(чит. як §YБраннік§!)§!, близьку до влади і лояльну до царя, за зразком інших німецьких молодіжних організацій. Філов вважає, що «Бранник» може стати масовим, даючи нам значне джерело робочої сили.\n«Боріс, Болгарія, Бог!»"
