 STAT_NAVY_LG_ATTACK_DESC:0 "Пошкодження, завдані легкими гарматами. Легкі гармати краще націлюються на невеликі кораблі."
 STAT_NAVY_MAXIMUM_SPEED_DESC:0 "Швидшому кораблю легше позбутися переслідувачів, коли він намагається відступити від бою. Крім того, він має меншу ймовірність бути враженим вогнем противника, він може легше переслідувати поміченого ворога та швидше рухається поза боєм."
 STAT_NAVY_RAIDING_COORDINATION_DESC:0 "Як швидко флот може зібратися, коли ціль знайдена під час рейдів на конвої."
 STAT_RAILWAY_GUN_HOURS_TO_REDISTRIBUTE_DIFF:0 " $VALUE|=-0$"
 STAT_SUB_CARRIER_SIZE_DIFF:0 " $VALUE|=+0$"
 STAT_VALUE_CHANGE_PERC_NEG:0 "$VALUE|=-1%$"
 STRATEGICREGION_NAMIBIA:0 "Намібія"
 STRAT_RADAR_EFFICIENCY_DESC:0 "§HЕфективність дружніх радарів§!\nЧим вища §Yефективність радарів§! у цьому регіоні, тим легше перехоплювачам буде знаходити ворогів, а патрулювальникам — інші літаки. Щоб збільшити ефективність, будуйте радари вищого рівня в зоні досяжності."
 SUBDOCTRINE_ARMORED_INFANTRY_SUPPORT_DESC:0 "Завдяки своїй вогневій потужності та захисту танки можуть швидко знищувати кулемети та іншу зброю, що перешкоджає просуванню піхоти. Співпраця танків і піхоти має бути бездоганною."
 SUBDOCTRINE_FIELD_ENGINEERING:0 "Польове інженерне забезпечення"
 SUBDOCTRINE_LONG_RANGE_ESCORT:0 "Далекобійне супроводження"
 SUBDOCTRINE_MOBILE_INFANTRY_DESC:0 "Зосередити нашу піхоту на мобільності, щоб підтримувати темп наступу та уникати застрягання у важких позиційних боях."
 SUBDOCTRINE_THEATER_INTERDICTION:0 "Театральне перехоплення"
