 AAT_Sweden.18.a:0 "Звісно, Нарвік належить державі [NOR.GetName]."
 AAT_Sweden.52.a:0 "$AAT_Sweden.49.a$"
 AAT_Sweden_ball_bearing.6.a:0 "Чудові новини."
 AAT_Sweden_flashpoints.11.b:0 "Заперечмо причетність і звинуватьмо [SWE.GetAdjective]у владу в улаштуванні атаки."
 AAT_Sweden_flashpoints.14.b:0 "Ми не можемо ризикувати ескалацією ситуації."
 AAT_Sweden_flashpoints.20.a:0 "Разом ми зможемо подолати [SOV.GetAdjective]у загрозу."
 AAT_Sweden_flashpoints.22.a:0 "Прикре рішення."
 AAT_Sweden_flashpoints.32.b:0 "Забудьмо про це. Не можна ризикувати, щоби вони приєдналися до ворога."
 AAT_Sweden_flashpoints.37.a:0 "Ми не можемо ризикувати перевантаженням армії."
 AAT_Sweden_flashpoints.38.desc:0 "Здається, ми сильно недооцінили готовність [SWE.GetAdjective]ого населення до боротьби. Незважаючи на більш ніж сторічний нейтралітет, [SWE.GetAdjective]і збройні сили сьогодні завдали превентивного удару по наших силах у Норвегії, чим застали їх зненацька. Хоча результат конфлікту іще далеко не визначений, важко не поважати сміливість наших [SWE.GetAdjective]их колег."
 AAT_Sweden_flashpoints.57.desc:0 "Рано вранці уряд Швеції вирішив евакуювати короля зі столиці та перевезти його в безпечніше місце на Готланді. Колона була перехоплена партизанами, і королівський автомобіль був обстріляний, розбивши лобове скло.\nУ подальшій перестрілці король був важко поранений, назавжди пошкодивши своє ліве око. Коли уряд утік на острів, він пообіцяв повернутися до управління країною як законний уряд Швеції, але ходять чутки, що король сам фактично взяв владу в свої руки, набравшися нового завзяття після поранення."
 AAT_Sweden_flashpoints.65.a:0 "Тепер вони розуміють своє місце у світі."
 AAT_Sweden_flashpoints.65.t:0 "[FROM.GetNameDefCap] знімає ембарго"
 AAT_Sweden_flashpoints.71.t:0 "Колишні [ITA.GetAdjective]і кораблі прямують до держави [SWE.GetName]"
 AAT_Sweden_nationalists.23.desc:0 "[GER.GetAdjective]а маріонеткова держава — [SWE.GetName] — надіслала до нас посланця з таємною місією без відома свого володаря.  [SWE.GetAdjective]а держава передбачає майбутнє та вперто шукає вихід з цього конфлікту, тож завітала до нас з пропозицією. Наразі вона готується до масштабного дезертирства з метою захоплення [GER.GetAdjective]ого материка, поки її війська зайняті в інших місцях, але вони підкреслюють, що не можуть вести війну на два фронти проти нас та їхнього сюзерена. Вони пропонують, щоби коли настане момент,  вони перейдуть на інший бік, і ми підпишемо договір про білий мир та будемо битися пліч-о-пліч.\nІноді ніж у темряві ефективніший, ніж таран серед білого дня."
 AAT_Sweden_nationalists.27.a:0 "Чудова ідея"
 AAT_Sweden_nationalists.7.desc:0 "За підтримки місцевої поліції, яка стримувала контрпротестувальників, штурмовикам вдалося провести масовий марш у регіоні [FROM.GetName]. Проходячи місцевою центральною вулицею, учасники маршу підбадьорювалися радісною публікою, що вишикувалася вздовж вулиць."
 AAT_USA_events.01.a:0 "Принаймні, віддадуть потім..."
 AAT_USA_events.03.a:0 "Ми обіцяли."
 AAT_USA_events.04.t:0 "[FROM.GetName] відхиляє наші вимоги"
 AAT_USA_events.07.b:0 "Фарерські острови повертаються!"
 AAT_USA_events.09.a:0 "Як турботливо."
 AAT_USA_events.09.desc:0 "[FROM.GetLeader] від держави [FROM.GetNameDef] погодився повернути незаконно утримувану територію Данії її законному власнику."
 AAT_finland_continuation_war.05.a:0 "Приєднаймося до наших братів по зброї!"
 AAT_finland_continuation_war.09.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], відхиляє наш запит і стверджує, що ми маємо готуватися до руйнації — адже цього разу [FROM.GetAdjective] армія [FROM.GetAdjective] не залишить нас так легко. Сталося найгірше!"
 AAT_finland_diplomacy.24.a:0 "Наші рятівники"
 AAT_finland_diplomacy.27.desc:0 "[GER.GetNameDefCap] приймає нашу пропозицію ресурсів в обмін на захист і обіцяє прийти на допомогу в разі війни. Наш народ нарешті може зітхнути з полегшенням — його майбутнє тепер у безпеці."
 AAT_finland_national_defense.02.desc:0 "Після звітів про виявлення фінських схованок зі зброєю в області [FROM.FROM.GetName] наші війська провели масштабні обшуки. Вони доповідають про схованки, закопані під будівлями, прикриті деревами, що впали, і втоплені на дні озер у промаслених мішках. Ми конфіскували знахідки і припускаємо, що відшукали всі більш-менш значущі запаси."
 AAT_finland_the_white_death.4.desc:0 "Сімо Гяюгя, снайпер із Раутьярві, який за свою майстерність отримав від солдатів прізвисько Тайка Ампуйя (чарівний стрілець), зараз став також відомий, як Біла Смерть. Раніше цим ім'ям наші вороги називали сувору фінську природу і фінських бійців загалом. Преса з готовністю роздмухує сенсацію. Якою буде наша офіційна позиція?"
 AAT_finland_winter_war.03.b:0 "Ми змінимо хід війни!"
 AAT_nordic_cooperation.2.desc:0 "У ці підступні часи зв'язки, що пов'язують нас із державою [FROM.GetNonIdeologyName], виявилися безцінними. Вони надали свою підтримку у нашій війні проти держави [?NORDIC_attacker.GetName], а тепер вони готові піти ще далі і запропонували приєднатися до захисту нашої країни. Зрештою, напад на одного з нас — це напад на всі Нордичні країни."
 AAT_nordic_cooperation.4.t:0 "[FROM.GetName] шукає інвестиції"
 AAT_nordic_cooperation.9.desc:0 "Незважаючи на нашу мету мати справу з державою [FROM.GetName] на рівних, вони повідомили нам, що не зацікавлені в такій домовленості.\n\nМи завжди можемо спробувати ще раз, або з іншим нордичним колегою."
 AAT_nordic_shared.1.desc_faction_member:0 "[FROM.GetNameDefCap] хоче зробити наш альянс ще одним кроком уперед і поглибити нашу співпрацю на кількох рівнях. Вона бачить військовий альянс лише як перший крок до сильнішого, об'єднаного Нордичного регіону."
 AAT_norway.12.t:0 "Вотум недовіри проти Югана Нюгошволда"
 AAT_norway.16.t:0 "Ми вигнанці, та не з порожніми руками"
 AAT_norway.18.a:0 "Ласкаво просимо до нас."
 AAT_norway.7.t:0 "[get_trotsky_lastname] прибуває до Мексики"
 AAT_norway_fascist.6.a:0 "Ми знайдемо спосіб!"
 AAT_norway_rikstanken.2.desc_SOV:0 "Держава [?NOR_communist_tank_seller.GetName] захопила засоби виробництва в державі, а це означає, що вони мають можливість виробляти велику кількість танків — це дозволить нам наздогнати наших ворогів.\n\nМи також можемо використати цю можливість, щоб показати робітникам нашої країни, на що здатна комуністична держава, і збільшити підтримку комунізму в державі [ROOT.GetName]."
