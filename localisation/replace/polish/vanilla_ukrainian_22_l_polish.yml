 landmark_forbidden_city_desc:0 "Колишня резиденція династії Мін, Заборонене місто є символом багатовікової історії гармонії та процвітання Китаю. Сьогодні скарби та артефакти, що зберігаються там, були сховані на випадок чергового вторгнення японців..."
