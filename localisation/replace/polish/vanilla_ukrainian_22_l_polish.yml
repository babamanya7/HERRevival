 GXC_denounce_chiang_desc:0 "Позування Чана Кайші та його нездатність чинити хоч якийсь опір японцям лише довели, що він слабкий і непридатний для правління. Ми повинні засудити його і запропонувати альтернативне рішення, яке не буде слабким."
