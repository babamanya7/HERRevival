 FIN_expand_production_lines_desc:0 "[ROOT.GetAdjective]им повітряним силам необхідно розширити свої виробничі потужності, щоб задовольнити зростаючі потреби військових зусиль. Будуючи нові виробничі лінії, ми можемо збільшити випуск нових літаків і забезпечити, щоб наші ВПС залишалися потужними актив у боротьбі з нашими ворогами."
