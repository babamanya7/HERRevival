 lar_end_the_occupation.1.b:0 "Здається, він не цілком усвідомлює своє становище."
 lar_fra_join_the_ententes.1.desc:0 "[From.GetAdjective] уряд запропонував нам переглянути наші стратегічні інтереси. Він має намір виконувати свої дипломатичні та військові зобов'язання на континенті, але також йому відомо про наші спільні інтереси, що стосуються багатьох частин світу.\n\nУряд запропонував нам укласти союз, який забезпечить обом сторонам взаємну підтримку у випадку, якщо будь-яка зі сторін визнає, що її інтересам загрожують."
 lar_france_french_union.4.desc:0 "Після кампанії, котра тривала декілька тижнів, громадян всіх французьких територій в Західній Африці зірвали горлосування в новий Французький Союз. Результати попередніх опитувань показує, що помітна більшість підтримує цей Союз. Націоналістична повістка, судячи з усього, подавлена у зародку, та багато активістів, виступаючих за незалежність, готові боротися в Національних зборах за політичне самовизначення."
 lar_intervention_in_greece.2.a:0 "Необхідність майже напевно виникне."
 lar_news.14.desc:0 "Після довгих тижнів неослабного [SPA.GetAdjective] тиску, що вилилися в пред'явлений вчора ультиматум, [From.GetAdjective] уряд не бачить інших варіантів, крім як поступитися вимогам і віддати контроль над Північною Африкою в інтересах із сусідами."
 lar_news.2.b:0 "Цікава альтернатива формам комунізму, що укорінилися."
