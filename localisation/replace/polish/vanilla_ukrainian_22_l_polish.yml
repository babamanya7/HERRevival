 SPR_CAS_equipment_2:0 "Hispano HS-41"
 SPR_REPUBLICANS_INSTRUCTIONS:0 "Ми мусимо відкласти громадянську війну, наскільки це можливо, давши нам час підготуватися до націоналістичного повстання."
 SPR_anti_fascist_unity_desc:0 "Розбіжності між нашими союзниками-анархістами та антисталіністами та нами загострюються. Ми не можемо дозволити, щоб ця ескалація вийшла з-під контролю. Ми повинні знову зосередити свою увагу на справжньому ворогу, навіть якщо ціною внутрішнього миру будуть поступки на рівні уряду нашим норовливим союзникам."
 SPR_carlist_uprising_flag:0 "Карлісти повстали"
 SPR_civil_war_offensives_desc:0 "Проблеми з забезпеченням наших фронтових військ ускладнюють ефективний наступ на опорні пункти противника. Ми мусимо планувати й адекватно розширювати склади техніки на передовій задовго до підготовки будь-яких великих наступальних операцій."
 SPR_collectivize_industry_desc:0 "Колективізація промисловості сприятиме подальшому підвищенню продуктивності та морального духу робітників."
 SPR_expand_soviet_aid_tt:0 "\n§RРадянська допомога матиме значну ціну, яку доведеться заплатити після закінчення громадянської війни!§!\n"
 SPR_ideological_allies_desc:0 "Іспанія була перекована в горнилі громадянської війни — ми разом із нашими ідеологічними союзниками протистоятимемо екстремізму як правих, так і лівих."
 SPR_lessons_from_the_civil_war_desc:0 "Боротьба громадянської війни навчила нас багатьох уроків мистецтва ведення війни. Ми були б дурнями, якби не застосували це до нашої нової моделі армії."
 SPR_light_ship_engine_3:0 "Двигун 50 000 к. с. н. в."
 SPR_medium_tank_equipment_1:0 "Carro de Combate 39"
 SPR_nationalist_castille_neutrality_ADJ:0 "Кастильськ"
 SPR_navy_modernization_desc:0 "Однією з переваг втрат, яких ми зазнали, є те, що у нас немає причин утримуватися від будівництва нових і сучасних моделей кораблів. Ми повинні запитати про відповідні конструкції та негайно подбати про їх будівництво."
 SPR_remove_after_civil_war_tt:0 "§RЦі війська будуть видалені після завершення громадянської війни!§!\n"
 SPR_stabilize_the_nation_desc:0 "Ми вийшли з громадянської війни переможцями, але тепер ми повинні забезпечити повернення стабільності і щоб це не повторилося."
 SPR_wartime_industry:0 "Промисловість воєнного часу"
 SSB_basic_available_trigger_tt:0 "Не перебуває у стані війни з жодним членом Саадабадського пакту"
 SSB_combined_arms_desc:0 "З офіційним оформленням альянсу настав час зробити останній крок до об'єднання наших військових та забезпечення взаємного захисту."
 SSB_expand_iraqs_military_infrastructure_desc:0 "Щоб припинити залежати від сильніших націй, ми повинні розширити наше власне виробництво ресурсів, щоб забезпечити торгівлю в межах наших кордонів, коли це можливо, покращуючи нашу самодостатність."
 SSB_the_saadabad_pact_desc:0 "Нам нічого втрачати і все здобути, залишаючись дружніми з нашими сусідами. Ідея договору, що формалізує нашу дружбу, час від часу виникала, і настав час нам взяти ініціативу та переконатися, що ця дружба закріплена в договорі."
