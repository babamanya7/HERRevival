 socialist_education_desc:0 "Вороги [From.GetAdjective]ого народу проникають у лави наших союзників і сіють розбрат, налаштовуючи їх проти нашого демократичного руху. Ми мусимо допомогти законному уряду наново ознайомити народ із безсмертним вченням Маркса й Енгельса."
