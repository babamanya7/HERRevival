 ENG_guide_the_colonies_desc:0 "Робити перші кроки до повної незалежності після довгих періодів під нашим контролем нелегко. Наші домініони потребують нашої допомоги в реструктуризації їхніх урядів, щоб вони могли функціонувати так само добре, як зараз, під нашим керівництвом, коли стануть повністю незалежними."
