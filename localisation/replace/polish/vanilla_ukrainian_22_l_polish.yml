 MEX_focus_brown_water_navy_desc:0 "Мексика покладається на застарілі судна до Великої війни, щоби захистити нашу торгівлю поблизу узбережжя. Ми намагаємося придбати більш сучасні кораблі в Іспанії та інших держав, але прогрес йде повільно. Нам потрібно розробити наші військово-морські стратегії на випадок, якщо війна охопить Європу та перекинеться на Західну півкулю."
 MEX_focus_community_of_nations_desc:0 "Наша економічна залежність від британської торгівлі не повинна бути прокляттям. Приймаючи статус-кво, ми можемо брати участь у міжнародній дипломатії за підтримки наддержави."
 MEX_focus_liberate_the_antilles_desc:0 "Багато островів Карибського басейну все ще окуповані імперіалістичними державами, які продовжують свою гнітючу експлуатацію, що триває з моменту відкриття Америки. Ми назавжди покінчимо з несправедливістю колоніалізму!"
 MEX_focus_push_past_the_darien_gap_desc:0 "Після нашої кампанії з об'єднання Центральної Америки ми тепер повинні проштовхнутися через джунглі між Панамою та Колумбією, відомі як «Дар'єнський розрив», щоби ступити в Південну Америку."
 MEX_focus_rent_freeze_desc:0 "Міські робітники є ключовою складовою Нової Мексики, яку ми будуємо. Вони були мобілізовані в червоні батальйони під час революції і тепер вимагають компенсації, яку їм обіцяли. Однією з сфер негайного занепокоєння повинні бути паразитичні орендодавці, які витягують ренту з цих працьовитих творців багатства."
 MEX_focus_royal_dutch_shell_desc:0 "«Royal Dutch Shell» — британсько-нідерландська фірма, що володіє 60% нафтових концесій Мексики. Досягнувши компромісу з іноземними нафтовими компаніями щодо трудових спорів, ми можемо досягти угоди, яка буде вигідною для нас обох."
 MEX_focus_smash_the_bureaucrats_desc:0 "Після смерті Леніна корумпована бюрократія на чолі зі Сталіним сформувала бонапартистський режим у Радянському Союзі, викравши владу у трудящих. Отже, СРСР перетворився на вироджену робітничу державу, яка перекручує ідеали революції."
 MEX_focus_support_general_cedillo_desc:0 "Північний генерал Сатурніно Седільйо й інші каудільйо, як він, потребують гарантій того, що уряд поважатиме їхню автономію. Швидка централізація влади під керівництвом президентів Кальєса та Карденаса дозволила нам приділити значну увагу проблемам, з якими стикається нація, тому подальше позбавлення власності каудільйо не потрібне."
