 tsr_manchukuo.22.t:0 "Совєти поступаються всім нашим вимогам"
 tsr_manchukuo.6.a:0 "Звичайно, ми підтримаємо наших братів на півночі!"
 tsr_manchukuo.7.desc:0 "Після перемоги у війні проти китайського уряду та проголошення Китайської Народної Республіки [MAN.GetLeader] закликав усі інші відділення КПК інтегруватися в цю нову республіку з обіцянками високих посад в уряді. Якщо ми відмовимося, він стверджує, що нас вважатимуть зрадниками революції, і ми зіткнемося з повною військовою силою Народно-визвольної армії."
 tsr_manchukuo.9.a:0 "Вони нічого не отримають"
 tsr_manchukuo_border_war.4.b:0 "Пекін так легко не впаде!"
 tsr_manchukuo_news.1.b:0 "Ми здобудемо свою долю!"
 tsr_sichuan_border_war.1.desc:0 "Після стрімкої кампанії в [601.GetName] [SIC.GetAdjective]а армія під командуванням Лю Веньхуея захопила значні частини провінції і оголосила цю територію підконтрольною собі."
 turkestan_united_neutrality_DEF:0 "Тюркське ханство"
 tut_10_text_1:0 "Добре! Перед тим як розпочати наступ на Ефіопію, Вам варто призначити командира для Вашої армії, якщо Ви ще цього не зробили. Натисніть на §Yпорожньому портреті лідера§! у віконці армії (вгорі зліва) й оберіть командира зі списку.\n\nДалі натисніть по кнопці §YВиконати план§! у нижній частині екрану, щоби наказати Вашим військам розпочати вторгнення."
 tut_1_text_1:0 "Ласкаво просимо в навчання до гри §YHearts of Iron IV§!!\n\nВи гратимете за @ITA §YІталію§! в період напередодні війни. Читання підказок допоможе Вам зрозуміти речі під час гри, тож рекомендовано скористатися ними по максимуму."
