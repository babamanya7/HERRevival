 RAJ_soviet_indian_industrial_cooperation_desc:0 "Щоб прискорити наше економічне перетворення, ми створимо промислове партнерство з [SOU.GetNameDefCap]. Їхній технічний досвід та досвід у централізованому розвитку стануть інструментом для побудови соціалістичної економіки, адаптованої до наших потреб."
 RAJ_strike_against_china_desc:0 "Якщо [CHI.GetName] стане регіональною силою, вони нападуть на нас, можливо, не сьогодні, але безсумнівно завтра. Нам потрібно вдарити першими."
 RAJ_tac_bomber_equipment_1:0 "Vickers Wellington"
 RAJ_the_calcutta_line_desc:0 "У міру ескалації регіональної напруги, забезпечення східного кордону стає імперативним. Укріплення Лінії Калькутти створить оборонний оплот, захищаючи життєво важливу інфраструктуру та захищаючи нашу серцевину від зовнішніх загроз."
 RAJ_the_hindu_martial_tradition:0 "Індуїстська військова традиція"
 RAJ_the_varuna_class:0 "Клас «Варуна»"
 RAJ_two_nation_theory_desc:0 "Індія з давніх-давен є єдиною державою, але було б логічним розділити її на дві нації: індуїстську та мусульманську. Розділ країни не є єдиним рішенням, але будь-які переговори про незалежність Індії мають враховувати цей двоякий характер субконтиненту."
