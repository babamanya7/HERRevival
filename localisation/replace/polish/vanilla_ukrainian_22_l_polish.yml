 GRE_hold_national_showcase_for_investors_ger_desc:0 "Ми влаштуємо тут, в колисці західної цивілізації, масштабну демонстрацію, щоби залучити інвестиції в наш збіднілий промисловий сектор."
 GRE_last_country_standing_desc:0 "Співпраця з турецьким урядом було в наших інтересах, але нехай всі знають, що новий уряд Греції не боїться рішучих дій, коли цього вимагає ситуація. Хай змилостивиться над усіма нами Господь."
