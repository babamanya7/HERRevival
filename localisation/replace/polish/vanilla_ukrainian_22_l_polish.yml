 GOE_RAJ.18.b:0 "Ми не можемо дозволити собі війну так далеко від дому"
 GOE_RAJ.2.t:0 "[FROM.GetName] схвалює"
 GOE_RAJ.49.b:0 "[431.GetName] по праву наш."
 GOE_RAJ_eic.3.desc:0 "[FROM.GetName] вимагає, щоб ми дозволили опіуму вільно переміщуватися між нашими країнами. Якщо люди готові платити за це, то хто ми такі, щоб відмовляти їм у їхньому даному праві на споживання? Це може бути морально неправильним і згубним для окремих осіб, але хто ми такі, щоб зупиняти їх, якщо вони готові платити? Єдина проблема в тому, що [FROM.GetAdjective] уряд також вимагає договірного порту для подальшого поширення... товарів."
 GOE_RAJ_loyalist.06.c:0 "Повітряні сили [RAJ.GetAdjective] потребують підтримки."
 GOE_RAJ_loyalist.77.t:0 "Захист Бірми"
 GOE_RAJ_navy.7.a:0 "Ми все одно ними не користувалися!"
 GOE_RAJ_partition.6.desc:0 "Давним-давно ми уклали зустріч із долею, і тепер настає час, коли ми виконаємо нашу обіцянку, не повністю чи в повному обсязі, але дуже суттєво. Опівночі, коли світ спить, Індія прокинеться до життя і свободи. Настає момент, який трапляється рідко в історії, коли ми виходимо зі старого до нового, коли епоха закінчується, і коли душа нації, довго пригнічена, знаходить вираз."
 GOE_generic_events.1.c:0 "Ми позбудемося [FRA.GetAdjective]s разом!"
 GOW_communism_ADJ:0 "Сулавесійськ"
 GRAND_DOCTRINE_MOBILE_WARFARE_DESC:0 "Завдати удару там, де ворог не очікує — доктрина мобільної війни прагне подолати позиційний глухий кут Першої світової за допомогою агресивних маневрів, щоб випередити та дезорганізувати ворога."
 GRE_a_modern_navy:0 "Сучасний флот"
