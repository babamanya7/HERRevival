 GER_re_form_the_freikorps:0 "Відновити Фрайкор"
 GER_reach_out_to_scandinavia:0 "Звернутись до Скандинавії"
 GER_reichskommissariat_kolumbus:0 "Райхскомісаріат Колумбія"
 GER_reichskommissariat_nordamerika_effect_tt:0 "Усі необхідні області, окрім §Y[395.GetName]§!, перейдуть під контроль [RUS.GetNameDef]"
 GER_remilitarize_the_rhineland:0 "Ремілітаризувати Райнланд"
 GER_second_ljubljana_award_other:0 "Другий Люблянський арбітраж"
 GER_sentinels_of_the_pacific_tt:0 "Кожна підконтрольна область із цих: §Y\n[336.GetName]\n[335.GetName]\n[743.GetName]\n[633.GetName]\n[646.GetName]§!"
 GER_slovakia_rkc_effect_tt:0 "Кожна область у словацькій зоні інтересів перейде під контроль [RKC.GetNameDef]"
 GER_south_east_asian_natural_wealth_desc:0 "Регіон Південно-Східної Азії багатий на природні ресурси, які могли би принести нам велику користь. Їхні нинішні власники розробляють ці землі не найкращим чином, і хоча ці землі ніколи не належали нам, такі настрої не завадили так званим демократіям вкрасти колонії, які по праву належали нам, і це не зупинить і нас!"
 GER_soviet_reiterated_claims:0 "Багаторазові претензії"
 GER_soviet_treaty_research_nsb_tt:0 "\n\nЗавершення досліджень над §YБазового шасі середнього танка§! дозволить нам отримати вигоду з цього договору і використати два нових дизайни танків:\n"
 GER_spheres_of_influence:0 "Сфери впливу"
 GER_strengthen_kriegsmarine_communism:0 "Volksmarine"
 GER_submarine_2_desc:0 "Німецький підводний човен типу «IIA» був однокорпусним, суцільнозварним підводним човном прибережного базування з внутрішніми баластними цистернами. Він мав водотоннажність понад 250 тонн і п'ять 533-мм торпедних апаратів. Шість човнів було побудовано між 1934 і 1935 роками."
 GER_tactical_air_effort_desc:0 "Перемоги можна досягти, знищивши ворожу армію. Нам потрібно зосередитися на підтримці наших військ шляхом тактичних ударів по близьких і далеких цілях."
 GER_the_final_blow_to_communism_desc:0 "Подолання держави [SOV.GetNameDef] не може бути кінцем нашої священної війни проти комунізму в Європі. Поки комуністичні країни існують по сусідству з нами, ми мусимо продовжувати боротьбу. Ми не можемо заспокоїтися, поки червона загроза не буде повністю викорінена!"
 GER_the_german_stakhanovite_movement_tt:0 "Після завершення фокусів §Y$GER_establish_the_reichswerke$§! або §Y$GER_invest_in_vereinigte_stahlwerke$§! — цей фокус збільшить видобуток ресурсів на §G5%§!."
 GER_trade_agreements_desc:0 "Міттельєвропа — це не лише військовий союз, а й економічний. Ми повинні наголосити на цій ролі та використати її для встановлення зв’язків з країнами, багатими на природні ресурси."
 GER_transport_plane_equipment_1_short:0 "Ju 24"
