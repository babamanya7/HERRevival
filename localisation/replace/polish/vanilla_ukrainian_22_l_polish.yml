 SWI_allied_gold_desc:0 "Вир і санкції, які охоплюють поточні події, зробили торгівлю золотом більш обмеженою та ускладненою, але з нашою нейтральною позицією ми можемо відкрити можливість для збільшення торгівлі золотом з іншими демократичними країнами, підтримуючи демократичні економіки, щоби стримати фашизм."
