 ITA_independence_overlord_fallback_refuse_tt:0 "Отримає ціль війни §Y$independence_wargoal$§! проти [ROOT.GetAdjective]ого володаяр.\nОтримає модифікатор §Y$ITA_refused_to_grant_us_independence$§! (думка про §Yколишнього володаря§!: §Y-50§!)."
 ITA_ispettorato_dei_mezzi_antisommergibili:0 "Ispettorato dei Mezzi Antisommergibili"
 ITA_la_battaglia_per_la_terra_desc:0 "Основою сильного фашистського суспільства є сама земля та люди, що її обробляють. В Італії все ще є багато районів, де ми можемо отримати корисні землі, осушуючи болота та зрошуючи сільськогосподарські угіддя."
 ITA_mare_nostrum_desc:0 "Наші ресурси обмежені й ми мусимо зробити болючий вибір, але Британська імперія тримає нас у клітці в Середземному морі. Щоби вирватися на волю, нам знадобиться флот, здатний конкурувати навіть із їхнім..."
