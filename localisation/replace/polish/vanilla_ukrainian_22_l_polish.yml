 FIN_grand_finnish_federation_ADJ:0 "Фінськ"
 FIN_jaeger_movement:0 "Рух єгерів"
 FIN_military_promotions_desc:0 "Наші військові офіцери служили нації з великою честю та відданістю. Настав час винагородити найкращих із них за їхню участь у порятунку нас від поневолення руками наших історичних ворогів."
 FIN_mio_trait_modernization_program:0 "Програма осучаснення"
 FIN_nice_desc:0 "їхнє вагання можна зрозуміти"
 FIN_patriotic_peoples_movement:0 "Патріотичний народний рух"
