 germany.1042.a:0 "Відмінно."
 germany.118.e:0 "Черчилл має таку ідею..."
 germany.128.b:0 "У нас своя доля."
 germany.202.a:0 "Тоді створімо власну незалежну Німеччину."
 germany.22.d:0 "[FROM.GetAdjective]ий уряд погодився на наші вимоги, і Мемель буде повернено в склад Східної Пруссії. Ще одна незаконно відібрана провінція повернулася під контроль німецької нації!"
 germany.52.d:0 "Чехословаччина розпадається на частини, і нам треба діяти швидко, щоби захистити території зі значною кількістю польського населення до того, як їх забере Німеччина. Контроль Чехословаччини над Заолшям завжди оскражувався нами, і зараз час цій області приєднатися до нашої нації."
 germany.55.d_2:0 "Захопивши Чехословаччину, нам потрібно придумати найкращий варіант розподілу цих земель.\n\nБогемія буде анексована в якості протекторату, але що стане зі Словаччиною? Ми можемо встановити в ній маріонетковий режим на чолі з Йозефом Тісо."
 germany.60.a.tt:0 "§RЯкщо розпочнеться війна, у нас станеться громадянська війна через ідею §YРоз'єднаний уряд§!:§!\n"
 germany.74.d:0 "Австрійці прагнуть стати частиною Німецького Райху, але вперті політики у Відні донині чинять опір усяким спробам утворити унію. Потрібно посилити вплив фашизму в Австрії. Австрійська нацистська партія тоді стане хорошою альтернативою керівним австрофашистам.\n\nЗараз став доступним для шпигунської місії агент Абверу. Його можна використати для таємного збільшення популярності фашизму в Австрії."
 germany.74.t:0 "Підготовка підґрунтя"
 germany.79.c:0 "Якщо ці деспоти хочуть забрати нашу землю, їм доведеться повоювати за неї."
 germany.81.d:0 "Польща погодилася на обмін Данцига. Його буде передано під контроль держави [GER.GetNameDef], а Словаччина буде передана під контроль Польщі. Як наслідок цієї угоди, ми повернули Данциг, зберігши теплі, або принаймні не відкрито ворожі, відносини з нашим східним сусідом."
