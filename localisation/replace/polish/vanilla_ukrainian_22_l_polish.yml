 HUN_joint_oil_exploitation_company_desc:0 "Перспектива можливих нафтових родовищ на нашій території привернула до нас увагу з-за кордону. Дружні держави прагнуть підтримати нашу нафтову галузь своїми технічними ноу-гау, і це була б вигідна можливість перейняти їхній досвід."
