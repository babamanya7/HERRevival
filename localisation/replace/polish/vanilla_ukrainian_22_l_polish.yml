 POR_anti_fascism:0 "Антифашизм"
 POR_field_maneuvers_desc:0 "Corpo do Estado Maior розробив нові маневри, які допоможуть переоцінити та оновити наші найстаріші доктрини; необхідний крок для створення сучасної армії."
