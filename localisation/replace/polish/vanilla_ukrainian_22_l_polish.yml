 SOV_the_fate_of_romania:0 "Доля Румунії"
 SOV_the_fate_of_romania_desc:0 "Румунія має значну слов'янську меншину і блокує доступ наших земель до слов'янських народів на Балканах. Щоб вирішити обидві проблеми одним махом, румунській незалежності має бути покладено край, за необхідності, за допомогою військової сили."
 SOV_the_head_of_the_nkvd_yagoda_desc:0 "Можливо, $SOV_genrikh_yagoda$ і не в дружніх стосунках із лідерами правої опозиції, але принаймні з ним можна домовитися. Можливо, вдасться змусити Ягоду побачити цінності нашої пропозиції і переконати його в тому, що наша сторона виграє."
 SOV_the_triple_entente:0 "Перекувати Антанту"
 SOV_trigger_second_moscow_trial_tt:0 "Станеться подія §YДругий московський процес§!."
 SOV_tupolev_design_bureau_dissolved_days_tt:0 "Число днів від розпуску Бюро: [?SOV_tupolev_design_bureau_dissolved_flag:days|Y0]"
 SOV_ukraine_crackdown_timer:0 "Репресії в Україні"
 SOV_vasily_chuikov:0 "$SOV_vasily_chuykov$"
 SOV_war_measures_in_the_east_desc:0 "Глобальна боротьба проти фашизму та інших контрреволюційних ідеологій неодмінно незабаром досягне Азії. Ми мусимо дати зрозуміти нашим союзникам, що у відчайдушні часи можуть знадобитися відчайдушні заходи."
 SPAIN_GATHERING_STORM_DESC:0 "Уже в перші п'ять років свого існування молодій Другій іспанській республіці довелося пережити страйки, спробу військового перевороту та велике повстання революціонерів. Хоча Республіка й пережила ці випробування, іспанське суспільство продовжує страждати від політичної поляризації та насильства між анархістами, комуністами та фалангістами.\n\nОбидві сторони з надією дивляться на вибори 1936 року, але навряд чи перемога якоїсь із сторін поверне стабільність. І разом із насильством, армія чекає та планує свій хід..."
 SPA_activate_valladolid_fifth_columnists:0 "Задіяти п'яту колону у Вальядоліді"
 SPA_autarky_desc:0 "Щоб нашій позиції не загрожували інші, ми повинні забезпечити, щоби наша економіка була повністю самодостатньою."
 SPA_capitalist_economic_aid:0 "Капіталістична економічна підтримка"
 SPA_claim_the_french_throne_desc:0 "Іспанський і французький престоли були династично пов'язані понад півстоліття. Наш нинішній король нічим не відрізняється, і він також є законним претендентом на французький престол. Це такий стан речей, яким просто необхідно скористатися."
 SPA_con_paquito:0 "Con Paquito"
 SPA_concessions_to_the_left_tt:0 "Повністю поступилися лівим"
 SPA_defenders_of_catholicism_desc:0 "Як це було чотириста років тому, Іспанія знову повинна стати захисником католицької віри. Крім того, звичайний солдат повинен бути мечем і щитом своєї віри і пам'ятати про цей священний обов'язок, куди б король не послав його воювати."
 SPA_dios_patria_rey_desc:0 "Зборний клич карлістів повторюється в історії та є прикладом переконань, які ми вважаємо істинними. Це служить нагадуванням про те, що ми всі відіграємо лише малу роль у захисті католицизму, наших місцевих громад та іспанської нації в цілому, а також остаточного суверенітету нашого короля. Бог, Вітчизна та Король!"
 SPA_ensure_agricultural_self_sufficiency:0 "Забезпечити сільськогосподарську самодостатність"
 SPA_establish_valencia_carlist_cell:0 "Створити осередок карлістів у Валенсії"
 SPA_expand_influence_in_the_pais_vasco_garrison_mission:0 "Оспорюється вплив на гарнізон у Країні Басків"
 SPA_galicia_offensive_mission:0 "Насувається наступ у Галісії"
 SPA_militarize_the_masses:0 "Мілітаризувати маси"
 SPA_military_plot_nationalists:0 "Військова змова"
 SPA_motorization_desc:0 "Масова моторизація армії відкриває широкий спектр нових тактичних і стратегічних можливостей. Це перевага, яку ми не можемо пройти."
