 TUR_agitate_kurdish_state_effect_tt:0 "£faction_tur_kurdish §YКурдські повстанці§! інтенсивніше опиратимуться діям уряду в області §Y[TUR_kurdish_state_event_target.GetName]§!."
 TUR_appoint_nihal_atziz_as_president:0 "Призначити Ніхала Атсиза президентом"
 TUR_cin_turkleri_desc:0 "У Китаї турків утискають, а їх родичам за кордоном немає до них справи. Тягар звільнення та охорони китайських турків від тих, хто зневажає їхню спадщину, лежить на наших плечах."
 TUR_connect_capitals_romania_tt:0 "Оскільки §YРумунія§! реалізовувала інфраструктурні проєкти з власної волі, вона отримає додаткову інфраструктуру."
 TUR_democratic_capstone_focus:0 "[Root.GetDemocraticCapstoneFocusName]"
 TUR_etatism_crisis_1_desc:0 "Одночасно підтримувати етатистську модель економіки з військовою виявилося непросто."
 TUR_invite_bulgaria_desc:0 "Занадто давно [BUL.GetNameDefCap] живе на периферії. Їхнє майбутнє пов'язане з державою [GER.GetNameDef], у цьому немає сумнівів, але для початку [BUL.GetAdjective] влада повинна усвідомити, з ким вони. Ми допоможемо їм здобути мужність."
 TUR_joint_caucasian_turkish_officer_school_desc:0 "Карс — місто з прославленою історією; близькість до держави [SOV.GetNameDef] робить його ідеальним для створення нової офіцерської політшколи. Наших офіцерів навчатимуть не лише військовій справі, а й тонкощам марксистської доктрини."
 TUR_learning_from_the_great_war:0 "Уроки Великої війни"
 TUR_light_tank_equipment_3_short:0 "Tavşan II"
 TUR_modern_tank_equipment_1_short:0 "Orbay"
 TUR_patriotism_over_internationalism:0 "Патріотизм понад націоналізмом"
 TUR_preempt_bulgarian_alignment_desc:0 "Нехай Пруссія Балкан, як і ми, невелика, але амбіцій та бажань у неї вистачить на велику державу. Чи можемо ми бути впевнені, що болгари не всадять нам ніж у спину одразу ж, щойно з'явиться можливість? Відповідь — ні, а отже, залишається лише один варіант: Болгарія має бути знищена."
 TUR_seek_treatment_for_ataturk:0 "Шукати лікування для Ататюрка"
 TUR_ship_torpedo_3:0 "5x 533-мм торпедний апарат"
 TUR_streamline_communication_methods_between_ships_desc:0 "Більшість обладнання на наших кораблях застаріла і ненадійна."
 TUR_sub_ship_engine_4:0 "Дизельний «B&W» 3 500 к. с. н. в."
 TUR_subdue_the_magyars_desc:0 "Може, австрійський кулак і стиснув їх так сильно, що позбавив пам'яті на довгі століття, але для нас угорці — це турки, що забули своє коріння, вовки, що уявили себе яструбами. Ми нагадаємо мадярам про їхню справжню спадщину."
 TUR_tac_bomber_equipment_2:0 "THK Baltimore"
 TUR_the_batumi_accord_desc:0 "Ми маємо співпрацювати з грузинським регіональним урядом задля зростання індустрій наших країн. Від цієї угоди виграють обидві сторони, і відмовитися від неї можна хіба що з виключно політичних причин."
 TUR_the_hatay_issue_desc:0 "Ми більше не можемо не діяти і дивитися, як турецькі меншини пригнічуються арабськими іредентистами та французькими імперіалістами. Думка, ніби Хатай не є законною частиною Туреччини, смішно і має бути відкинуто як ревізіонізм. Час виправити помилки 1921 року."
 TUR_thk_bftb_organization:0 "$thk_bftb$"
 TUR_turk_ulusu_desc:0 "Щоб країна була відповідальною та сучасною, треба зуміти перевизначити поняття громадянина такої країни. Ми надто суворо ставилися до визначення того, хто такі турки, — це визначення давно настав час розширити, щоб воно правильно відображало нашу країну."
