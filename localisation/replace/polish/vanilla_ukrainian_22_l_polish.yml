 tfv_australia.1.b:0 "Сінгапурська стратегія залишиться як завжди."
 tfv_australia.12.d:0 "Вважаючи, що вони достатньо здатні захистити [From.GetAdjective]у територію у Південно-Східній Азії, держава [From.GetNameDef] відхилила нашу пропозицію спільної оборонної стратегії.\n\nБезсумнівно, мотивовані побоюваннями щодо колоніального контролю, їхні дії зрозумілі. Проте, якщо вони не в змозі захистити свою територію — як ми боїмося — ми можемо побачити, що вона буде використана як стартова платформа для нападу на австралійський континент."
 tfv_australia.3.a:0 "З [From.GetAdjective]ою підтримкою або без неї, [Root.GetNameDef] буде стояти на висоті!"
 tfv_australia.96.b:0 "Приєднаймося до повстання!"
 tfv_canada.60.a:0 "Дайте їм, чого вони хочуть. [Root.GetNameDefCap] наразі не може сперечатися за це."
 tfv_raj.21.t:0 "Голод у Бенгалії"
 tfv_south_africa.1.d:0 "Оскільки ми боремося з військовим покриттям усієї Імперії, держава [From.GetNameDef] звернулася до нас з пропозицією укласти адміністративну угоду. Наші колонії в Південній та Центральній Африці повинні бути передані їм з усіма правами та обов'язками щодо їх захисту."
 tfv_south_africa.11.a:0 "Надішліть їм винищувачі."
 tfv_south_africa.20.a:0 "Ми вітаємо наших нових товаришів у боротьбі з імперіалізмом!"
