 EXILES_VIEW_OCCUPIER_FLAG_TOOLTIP:0 "Держава $OCCUPIERNAMEDEF|UH$ окуповує осердну землю, якою володіє $EXILENAMEDEF|H$.\n$EXILEADJ|H$ §Hкадрові дивізії у вигнанні§! отримають бойові бонуси:\n - Атака: $ATK_VS_OCCUPIER|%0+$\n - Оборона: $DEF_VS_OCCUPIER|%+0$"
 FACTION_BUTTON_COMPLETED_HEADER:0 "£trigger_yes Виконані цілі альянсу:"
