 INS_develop_sulawesi_desc:0 "Сулавесі є центром архіпелагу і тому є важливим стратегічним місцем. Ми повинні побудувати дороги, лінії електропередач та зв'язок, щоб у разі війни його можна було використовувати як військовий вузол."
 INS_dissolve_national_party_desc:0 "Гібридна система була створена як необхідний компроміс для уникнення хаосу. Ми не повинні дозволити Президенту мати стільки влади недемократичним шляхом. Президент має бути усунутий парламентом, інакше ми ніколи не досягнемо демократії."
