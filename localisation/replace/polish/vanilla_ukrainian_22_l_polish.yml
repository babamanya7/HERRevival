 SWI_flood_the_valleys_desc:0 "Ми очікуємо, що через територію навколо Боденського озера прийде велика сила вторгнення, це ідеальне місце для встановлення каналів і гребель, щоби затопити сільськогосподарські угіддя та заболочити перешкод. Поки вони намагаються перетнути це підступне болото, ми можемо використати нагоду, щоби закидати їх усім, що у нас є. Вони пошкодують, що спробували вторгнутися до нас."
