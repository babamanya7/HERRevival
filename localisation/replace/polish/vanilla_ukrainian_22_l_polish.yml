 GRE_befriend_republicans:0 "Подружитися з £faction_gre_venezelist республіканцями"
 GRE_byzantine_themata_desc:0 "З часів падіння Константинополя світ значно змінився, а завойовницькі походи стали набагато складнішими. Ми не можемо очікувати, що нещодавно відвойований народ Імперії буде служити нам лише тому, що ми цього хочемо. Необхідно дозволити йому певну міру самоврядування та співпрацювати з адміністрацією завойованих регіонів. Це невелика ціна за здобуття нашої Імперії."
 GRE_civil_war_imminent_4:0 "$GRE_civil_war_imminent$"
 GRE_defending_our_seas:0 "Оборона наших морів"
 GRE_denied_our_ambitions:0 "Не визнали наші амбіції"
 GRE_disrupting_the_great_powers_desc:0 "Наша роль не в тому, щоби змагатися з великими державами, що демонструють свою перевагу в полях і на морях. Натомість ми вдаримо їх за найболючішим місцем — за шляхами постачання!"
 GRE_escorts_for_our_bombers_desc:0 "Мало виробляти бомбардувальники — потрібно ще забезпечити їх супроводом! Ми не можемо покладатися на стандартні літаки. Ми розробимо нові чудові винищувачі, здатні супроводжувати наші бомбардувальники до ворожих берегів."
