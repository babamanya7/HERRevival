 DEN_bop_occupation_remove_political_agitator_desc:0 "Деякі відомі політики не уникають критики наших [?DEN.DEN_overlord_nation.GetAdjective]их господарів, що сприяє посиленню напруженості між нашими країнами. Ми повинні усунути цих порушників спокою з їхніх політичних завдань до [?DEN.DEN_overlord_nation.GetNameDef] змушує нас."
 DEN_bop_occupation_switch_ideology_desc:0 "Якщо ми справді хочемо приєднатися до [?DEN.DEN_overlord_nation.GetNameDef] і заслужити їхню підтримку, ми повинні прийняти їхні ідеології та переконання."
 DEN_buy_foreign_aircraft:0 "Придбання іноземних літаків"
 DEN_connect_the_islands_desc:0 "[ROOT.GetNameDefCap] складається з безлічі островів, де єдина точка, що з'єднує нас з материком, знаходиться на півдні Ютландії. Щоб полегшити пересування нашою країною, а особливо між островами, ми повинні будувати мости, які зв'яжуть нас ближче один до одного."
 DEN_danish_security_category_desc:0 "Ми повинні шукати захисту та звертатися до інших країн, щоб захистити наш суверенітет."
