 EST_events.2.b:0 "Banish the Vaps immediately!"
 EST_events.402.a:0 "Would they rather join the [SOV.GetAdjective]s? Traitors!"
 EST_events.901.d:0 "Дивно, але сьогодні, коли загони партії [FROM.GetFascistParty] висунулися на [From.GetAdjective] столицю, колишній [From.GetAdjective] уряд не став, всупереч очікуванням, розпалювати громадянську війну, а поступ повноваження партії [FROM.GetFascistParty]."
 EST_fight_against_communism_desc:0 "Ми вже бачили, на що схоже життя в окупації, і багато наших земляків загинули в боях, щоби подібного не повторилося. Ми патріоти, і наша армія не здасться без бою."
 EST_republican_defence_league_desc:0 "Тепер, коли роль вапсів стає все менш значною, багато воєнізованих формувань залишилися без мотивації — їм більше нема за що воювати. Спробувавши об'єднати їх в один офіційний естонський підрозділ, ми отримаємо нову притоку відважних людей, готових битися і незалежність."
 EST_womens_defence_league_desc:0 "«Найскодукайтсе» — відділення Республіканської ліги оборони для патріотично налаштованих жінок, які бажають зробити свій внесок у захист будинку та сім'ї. Дуже важливо належним чином забезпечувати та фінансувати Жіночу лігу оборони, щоби наші будинки були захищені."
 ETH_AI_BEHAVIOR:0 "@ETH Ефіопія"
 ETH_BoP_purge_communists:0 "Провести чистки серед комуністів"
 ETH_ITA_fascism_autonomy_dominion:0 "Королівство Ефіопія"
 ETH_arm_resistance_decision_desc:0 "Озброїти борців спротиву в цій області."
 ETH_arms_purchases:0 "Закупівля зброї"
 ETH_bomb_proofing_desc:0 "Підтримання достатньої промислової потужності для підтримки сучасної армії є життєво важливим під час війни. Через це повітряна війна, ймовірно, відіграватиме вирішальну роль у будь-якому майбутньому конфлікті, оскільки авіація буде націлена на промислові центри ворожих країн. Тому ми повинні переконатися, що наші заводи можуть вижити під такими атаками."
 ETH_declare_for_italy:0 "Оголосити лояльність Італії"
 ETH_expand_the_coffee_industry_desc:0 "У всьому світі не бракує людей, які вимагають доступу до кави. Як одне з основних джерел смачного стимулятора, ми повинні скористатися цим попитом, інвестуючи в кавову промисловість і збільшуючи наш експорт."
 ETH_expand_the_levy_desc:0 "Завдяки кращій підтримці та навчанню [GetChitetName] став потужною та гнучкою військовою силою. Маючи цю міцну базу, на яку можна спиратися, ми розширимо [GetChitetName], щоби стримувати будь-якого іноземного агресора."
 ETH_improve_communications_in_state_tt:0 "Змінити §Y$ETH_state_development_dynamic_modifier$§! на:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!"
 ETH_international_brigades:0 "Міжнародні бригади"
 ETH_liberate_DJI:0 "Звільнити державу [DJI.GetName]"
 ETH_liberate_UGA:0 "Звільнити державу [UGA.GetName]"
 ETH_local_committees_desc:0 "У нас є можливість створити нову систему правління, вільну від безглуздих шарів ієрархії, які неминуче породжують корупцію та пригнічують волю народу. Ми повинні використати цю можливість для створення федерації комун, кожна з яких дотримується принципів анархо-комунізму."
 ETH_mercenaries:0 "Найманці"
 ETH_offer_peace_SUD:0 "Мир в обмін на [SUD.GetAdjective]у незалежність"
 ETH_officer_reforms_decentralized_BoP_tt:0 "Щоби забезпечити ефективність армії, ми мусимо збільшити меритократію офіцерського корпусу."
 ETH_our_own_path:0 "Наш власний шлях"
 ETH_protector_of_the_somalis:0 "Протектор сомалійців"
 ETH_purchase_obsolete_ships:0 "Придбати застарілі кораблі"
 ETH_raid_italian_depots_desc:0 "Італійські військові зосередили на складах по всій країні велику кількість техніки. Готуючись до неминучої конфронтації, ми можемо позбавити їх цього обладнання та зміцнити ним власні сили, здійснивши набіги на склади."
 ETH_rally_around_the_emperor_desc:0 "Його Величність [ETH.GetLeader] є стрижнем, що тримає разом нашу різноманітну імперію. У цей час кризи ми повинні відкинути наші дрібні образи та об'єднатися довкола Його Величності, адже на карту поставлено саме виживання держави [ETH.GetName] та її народу."
 ETH_rebuilding_the_country:0 "Відбудова країни"
 ETH_reclaim_the_empire_desc:0 "Під правлінням нашого великого лідера, [ETH.GetLeader], ми відкинули руйнівний вплив [ITA.GetName] на нашу велику націю та знову відкрили неперевершену силу нашого народу. Тепер велике завдання, яке стоїть перед нами, полягає у відновленні наших законних земель і об'єднанні людей [ETH.GetAdjective]."
 ETH_reclaiming_ethiopia_event_tt:0 "§Y[GetEthiopianHostName]§!:"
 ETH_reintegrate_aussa:0 "Інтегрувати Ауссу"
 ETH_reintegrate_aussa_desc:0 "Підступний султанат Аусса неодноразово зраджував нас, ставши на [ITA.GetAdjective]ий бік. Настав час розпустити султанат і інтегрувати регіон у [ETH.GetName]."
 ETH_request_italian_equipment_desc:0 "Хоча ми досягаємо значного прогресу в реформуванні нашої економіки та зміцненні нашої армії, ми все ще можемо отримати певну підтримку в цих завданнях. Завдяки нашим поглибленим стосункам із [ITA.GetAdjective]s, вони можуть бути готові надіслати нам частину свого надлишкового обладнання."
 ETH_risk_of_disintegration_tt:0 "§RРизик§! розпаду держави [ROOT.GetName]\n Країна розпадеться, якщо стабільність опиниться нижче §Y15%§! або популярність керівної партії опиниться нижче §Y40%§!."
 ETH_second_italo_ethiopian_war_category:0 "$WAR_NAME_ITA_ETH$"
 ETH_secure_arms_desc:0 "Незначна галузь [ETH.GetName] явно не здатна підтримувати армію. Ми повинні використати багатство імперської скарбниці, щоби придбати зброю та негайно доставити її нашим героїчним воїнам."
 ETH_soviet_rifles_tt:0 "\nЯкщо §Y[SOV.GetFlag][SOV.GetNameDef]§! погодиться, §Y[ETH.GetFlag][ETH.GetName]§! отримає §G10 000§! од. піхотного спорядження."
 ETH_tactical_training:0 "Стандартизовані тактичні тренування"
 ETH_the_abuna_desc:0 "Опір [ITA.GetAdjective]им загарбникам — це не лише питання лояльності до Імператора, але й питання моралі. Консультуючись із $ETH_abuna_qerellos_iv$, ми можемо продемонструвати людям справедливість нашої справи та необхідність виконання ними свого обов'язку в ім'я нашого бога."
 ETH_the_african_union_desc:0 "Ми вимагаємо покласти край колоніалізму, тому що панування одних людей над іншими — це неправильно. Скоординовані дії всіх африканців щодо спільних проблем є обов'язковими, якщо ми хочемо, щоби наші думки мали належну вагу. Таким чином, ми будемо діяти, керуючись цілісністю та переконанням наших найглибших переконань, борючись за звільнення всього африканського континенту."
 ETH_the_italian_language_desc:0 "Мова залишається однією з найбільших перешкод для поглиблення співпраці з [ITA.GetAdjective]. Тому ми приймемо [ITA.GetAdjective]у як другу мову в нашій адміністрації, включно з військовими. Сподіваюся, це прискорить культурний обмін між нами та зробить стратегічне планування ефективнішим."
 ETH_the_liberator_of_jimma:0 "Визволитель $jimma_RU_Gen$"
