 SWE_set_up_home_guard_forces_tt:0 "Створює осередок підрозділів Домашньої Охорони, які можуть бути активовані як дивізії надзвичайних ситуацій у разі війни.\nЦе можна зробити три рази на штат, збільшуючи кількість дивізій у разі війни.\nРівень Домашньої Охорони: §Y[?FROM.SWE_has_added_home_guard]/3§!"
 SWE_ship_secondaries_1:0 "15.2cm/44 Bofors M98"
 SWE_standardize_equipment_desc:0 "Занадто довго наші збройні сили працювали з безліччю стрілецької зброї, деякі з них були створені ще в минулому столітті. Це робить забезпечення військ боєприпасами надзвичайно складним і вразливим до збоїв. Ми повинні виправити це, стандартизувавши нашу зброю і боєприпаси."
