 FRA_aggressive_focus_desc:0 "Ми не можемо сидіти склавши руки, коли вороги тісняться біля наших кордонів. Ми також не можемо залишити союзників самотужки справлятися з військовою загрозою. Готуйте армію! Гамелен очолить її."
 FRA_armored_car_equipment_1_short:0 "Panhard 165"
 FRA_ban_communism:0 "Заборонити комунізм"
 FRA_carrier_focus:0 "Акцент на авіаносці"
 FRA_colonial_naval_bases:0 "Колоніальні морські бази"
 FRA_colonial_recruitment_desc:0 "Оскільки батьківщина недоступна для вербування, ми мусимо звернутися за допомогою до наших колоній. Багато наших підданих готові взяти в руки зброю, щоб воювати за нас."
 FRA_coup_in_syria_flag:0 "Підготувати переворот у Сирії"
 FRA_czech_guarantee:0 "Гарантія Чехословччини"
 FRA_dominate_the_middle_east:0 "Домінування на Близькому Сході"
 FRA_establish_spheres_of_influence_desc:0 "Протягом століть наш народ жив у вірі, що ми смертельні, спадкові вороги. Ця віра була заснована на ідеї, що наші інтереси несумісні. Але ми, безперечно, могли б дійти згоди, якби просто визначили наші сфери впливу і старанно утримувались від втручання."
 FRA_expand_the_citizenship_desc:0 "Для республіки неприпустимо, щоб деяким людям, які проживають на її території, не дозволили стати її громадянами, але такий стан речей був дозволений у нас. Ми мусимо негайно виправити це."
 FRA_extend_the_maginot_line:0 "Подовжити лінію Мажіно"
 FRA_extra_research_slot_2_desc:0 "Молоді таланти з'являються усюди. Ми маємо побудувати лабораторії, де вони займуться своїми дослідженнями. Найновіші технології дадуть нам перевагу в ключових областях."
 FRA_fcm_organization:0 "$fcm$"
 FRA_french_forces_of_the_interior_tt:0 "Створює слабкі піхотні підрозділи в кожному звільненому регіоні."
 FRA_invest_in_our_weaker_allies_trigger_tt:0 "Має менше військових заводів, ніж ми"
 FRA_invite_communist_ministers_desc:0 "Страх перед реакцією правих радикалів перешкодив включенню комуністів до реальної влади. Але страх — поганий порадник. Якщо у нас це зіткнення, нехай прийдуть."
 FRA_jet_effort:0 "Розвиток реактивних двигунів"
 FRA_medium_tank_artillery_equipment_2:0 "AMX 13 105 AM"
 FRA_national_champions_desc:0 "Вибравши кілька компаній, які мають потенціал для конкуренції на глобальному рівні, і підтримуючи їх у найвищому ступені, ми можемо створити сучасну економіку, рівну будь-якій іншій."
 FRA_orleanist_faction:0 "Антифашистський блок"
