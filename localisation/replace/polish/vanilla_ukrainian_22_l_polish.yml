 sp_helicopter_med_evac_tech_desc:0 "Надходять поранені! Надходять поранені! Вертольоти забезпечують ще швидшу евакуацію постраждалих, ніж звичайні карети швидкої допомоги."
 sp_land_generic_reward_armor_tech_1_desc:0 "Останні розробки в проєкті «[SpecialProject.GetName]» під керівництвом [Character.GetName] уможливили значний прогрес у суміжних галузях. Ці відкриття докорінно змінюють військові спроможності, торуючи шлях до ефективніших і грізніших стратегій сухопутної війни."
 sp_land_generic_reward_resource_scarcity_desc:0 "Команда [Character.GetName] стикається з нестачею критично важливих матеріалів для розробки проєкту «[SpecialProject.GetName]», що змушує [Character.GetHerHim] шукати альтернативні джерела постачання та розробляти нові методи виробництва для задоволення потреб."
