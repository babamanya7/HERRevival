 MODIFIER_AIR_SUPERIORITY_EFFICIENCY_DESC:0 "Поліпшення тактик винищувачів і збільшення їхньої ефективності в повітряних боях."
 MODIFIER_AI_CALL_ALLY_DESIRE_FACTOR_DESC:0 "Наскільки зацікавлена або неохоча країна буде закликати союзників у війну з поточним урядом."
