 INSHOL_divert_civilian_to_navy_desc:0 "За нинішнього стану у світі ризик морського вторгнення вищий, ніж будь-коли. Ми не можемо дозволити собі бути ощадливими, ми повинні перенаправити фінансування з усіх секторів уряду на флот."
