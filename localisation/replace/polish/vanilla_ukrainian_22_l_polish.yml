 ROM_invest_in_the_iar_desc:0 "Дуже важливо йти в ногу з вимогами сучасних повітряних сил. Наша галузь має бути спроможною не лише створювати машини, які нам потрібні перш за все, але й робити це досить швидко, щоб компенсувати експлуатаційні втрати."
