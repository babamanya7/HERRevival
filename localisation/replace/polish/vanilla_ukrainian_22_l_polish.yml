 ARG_close_ties_with_america_idea_desc:0 "A symbol of closer ties between [USA.GetNameDef] and [ARG.GetNameDef]."
 ARG_communism_ADJ:0 "Аргентинськ"
 ARG_communist_civil_war_tt:0 "§RСпричинить громадянську війну в§! §Y[ROOT.GetFlag][ROOT.GetName]§! §Rміж комуністами та нинішнім урядом!§!"
 ARG_establish_the_free_association_desc:0 "Вільна асоціація — це відносини між особами, де немає держави, соціального класу, ієрархії чи приватної власності на засоби виробництва. Це довгострокова мета анархо-синдикалістів, і настав час нам почати руйнувати ці кордони та створювати суспільство, де кожен може вільно задовольняти свої індивідуальні потреби."
 ARG_join_the_allies:0 "Приєднатися до Союзників"
 ARG_legitimize_the_PCA:0 "Легітимізувати КПА"
 ARG_liberation_theology:0 "Теологія визволення"
 ARG_maintain_the_status_quo_desc:0 "Продовжувати обережно. Немає прямої необхідності надто сильно розгойдувати човен після того, як тільки прийшли до влади. Якщо Кастільйо хоче залишитися в уряді, йому потрібно бути обережнішим у подоланні невдоволення, яке зростає у ворожих фракціях."
 ARG_military_owned_state_desc:0 "Ця область відзначається тим, що кишить бунтівними військовими осередками. Якщо ми дозволимо цьому зростати, ризик державного перевороту зросте."
 ARG_news_events.1.a:0 "Це, безсумнівно, лише риторика?"
 ARG_political_events.14.a:0 "Lamentable..."
 ARG_political_events.2.t:0 "[USA.GetName] вимагає ембарго проти [GER.GetAdjective]!"
 ARG_political_events.21.a:0 "Відступити, це того не варте..."
 ARG_political_events.24.t:0 "[ARG.GetNameDefCap] прагне альянсу"
 ARG_political_events.32.desc:0 "Сьогодні вранці ми отримали повідомлення від [ARG.GetAdjective] посла в [ENG.Capital.GetCapitalVictoryPointName] про те, що [ARG.GetNameDef] офіційно окупувала Фолклендські та Південна Джорджія острови. Таким чином, вони вимагають, щоб ми поступилися їм територією та припинили цю війну."
 ARG_political_events.38.a.tt:0 "Це може зашкодити нашим стосункам з §Y[ARG.GetName]§!..."
 ARG_political_events.51.t:0 "Страйк робітників у [FROM.FROM.GetName]"
 ARG_reestablish_ligas_patrioticas_desc:0 "Ligas Patrióticas були крайньо правою параполіцейською цивільною організацією, що діяла в [ARG.GetNameDef] протягом 1920-х років. З тих пір вони всі розпалися. Можливо, настав час відродити цей рух, щоб допомогти нам встановити порядок серед шаленої корупції в нашій країні."
 ARG_regulated_national_salaries:0 "Регульовані національні зарплати"
 ARG_support_the_spanish_coup:0 "Підтримати іспанський переворот"
 ARG_tac_bomber_equipment_3:0 "I.Ae 24 Calquin"
 ARG_towards_a_greater_argentina:0 "На шляху до Великої [ARG.GetName]"
 ARG_universidad_de_buenos_aires_desc:0 "З часів Університетських реформ 1918 року, Університет Буенос-Айреса зміг підтримувати спільно керовані, демократично обрані установи та органи влади. Будучи найбільшим університетом у [ARG.GetName], інвестування в його розвиток продовжуватиме випускати високоосвічених людей, здатних вести країну в майбутнє."
 ARG_us_army_training_desc:0 "[USA.GetNameDefCap] люб'язно запропонували надіслати нам свій військовий навчальний режим, щоб ми могли почати готувати наші власні сили до можливості війни. Це не лише створить більш досвідчену та загартовану армію, але ми також зможемо використати отримані знання для посилення нашої програми спеціальних сил."
 ARG_work_with_the_nationalists:0 "Працювати з націоналістами"
 ARMY_CLICK_HEADER:0 "§GКлацніть§!, щоб обрати дивізію.\n§GShift + клацніть§!, щоби перемкнути вибір.\n§GКлацніть двічі§!, щоб обрати всі дивізії з таким самим шаблоном.\n§GКлацніть правою кнопкою§!, щоби перемістити камеру до дивізії."
 ARMY_DIVISION_TOOLTIP_DETAILED_MULTIPLE_DESC:0 "У нас є $COUNT$ дивізій типу $TYPE|Y$ в нашій армії."
 ARM_ADJ:0 "Вірменськ"
 ARM_UK_autonomy_integrated_puppet_DEF:0 "$OVERLORDADJ$а Вірменія"
 AST_EQUIPMENT_VERSION_9:0 "Mk IX"
 AST_anti_air_equipment_1_short:0 "QF 3-inch"
 AST_british_pact_desc:0 "Незважаючи на наше недавнє відділення від Британської Співдружності, в інтересах [AST.GetName] продовжувати співпрацю зі своєю старою метрополією. З огляду на те, наскільки розпорошені сили [ENG.GetNameDef] по всьому світу, наша готовність розділити їхній тягар, запропонувавши військову співпрацю, має бути оцінена."
 AST_challenge_government_narrative:0 "£BoP_left_texticon Кинути виклик наративу уряду"
 AST_commonwealth_aircraft_corporation_taog:0 "Авіаційна корпорація Співдружності"
 AST_department_of_aircraft_production_desc:0 "Швидке розширення Королівських ВПС Австралії створило значне навантаження на наші виробничі потужності. Ми повинні мислити амбітніше, розширюючи та координуючи нашу промислову базу, щоб задовольнити попит і гарантувати, що ми зможемо затьмарити небо нашими літаками."
 AST_diggers:0 "Діггери"
 AST_diplomatic_events.19.desc:0 "[INS.GetName] відмовляється від нашого запиту; наші нації повинні будуть дбати про власну оборону самостійно."
 AST_diplomatic_events.43.t:0 "[AST.GetNameDefCap] вимагає Південно-Східну Азію"
 AST_diplomatic_events.63.desc:0 "Ірландія відмовилася підписувати Антибританський пакт."
 AST_diplomatic_events.73.a:0 "Острови ще можуть стати нашими."
 AST_done_meddling_desc:0 "Завжди лояльна старій батьківщині, [AST.GetName] продовжує битися у британських битвах з високо піднятою головою. Австралійці — надійний народ, але це не означає, що їх слід сприймати як належне. Поки [AST.GetName] б'ється за [ENG.GetNameDef], [ENG.GetNameDef] також битиметься за [AST.GetName]."
 AST_election_events.1.a:0 "Народ сказав своє слово."
 AST_establish_advisory_war_council_desc:0 "Політики Австралії повинні забути про свої ідеологічні та партійні розбіжності та разом створити консультативну раду з питань ведення війни."
 AST_free_school_policy_desc:0 "Щоб сформувати зразкового громадянина, ми повинні сформувати його ідеї. Від колиски до університету держава направлятиме те, чого навчають наших дітей. Таким чином ми зможемо гарантувати, що майбутні покоління зрозуміють важливість соціалістичного ідеалу і небезпеку вільних ринків... та вільних думок."
 AST_gw_tank_equipment:0 "Vickers II"
 AST_hmas_sydney:0 "HMAS Sydney"
 AST_increased_focuses_become_available:0 "Зазначені фокуси стануть §Gдоступними§!."
 AST_japanese_war_mission:0 "Японська війна"
 AST_jet_fighter_equipment_1:0 "de Havilland Vampire"
 AST_jet_fighter_equipment_2:0 "CAC CA-23"
 AST_mechanized_equipment_3:0 "Kangaroo Carrier LP"
 AST_medium_tank_artillery_equipment_1_short:0 "M3 Grant SPA"
 AST_mio_trait_owen_gun:0 "$AST_owen_gun$"
 AST_mio_trait_vulcan_slow_and_steady_resilience:0 "Повільна та стабільна живучість"
 AST_modern_tank_artillery_equipment_1_short:0 "Centurion AVRE"
 AST_naurus_return_to_german_hands_desc:0 "Тепер, коли «Австралія понад усе» повністю контролює країну, настав час виконати обіцянку щодо Науру, а нашим німецьким союзникам виконати свою частину угоди. [AST.GetName] нарешті звільниться від кайданів Співдружності, і британці не матимуть у цій справі права голосу."
 AST_no_foreign_battlefields:0 "Жодних чужих війн"
 AST_populate_or_perish_desc:0 "Коли вдарила Велика депресія, рівень народжуваності стрімко впав, і з тих пір ніяк не міг відновитися. З метою продовження внутрішнього розвитку, ми створимо федеральний Департамент імміграції для керівництва та контролю за новою імміграційною програмою."
 AST_preemptive_intervention:0 "Превентивна інтервенція"
 AST_reclaim_the_lost_territory_tt:0 "[NZL.GetFlag]§Y[NZL.GetName]§! Передає всі сухопутні, військово-морські та військово-повітряні сили до §Y[AST.GetNameDef]§!"
 AST_repeal_immigration_restrictions:0 "Скасувати імміграційні обмеження"
 AST_reverse_industry_tariffs:0 "Скасувати промислові мита"
 AST_scale_up_middleback_mines_steel_decision_2:0 "Відкрити шахту Айрон-Монарх"
 AST_seize_local_control_tt:0 "Комуністи беруть під контроль штат, гарантуючи, що він буде на нашому боці у разі громадянської війни.\n"
 AST_sentinel_tank_project_desc:0 "Австралія має створювати свою бронетехніку. Необхідно розвивати проєкт «Sentinel», який використовує німецькі та американські напрацювання."
 AST_the_guild_for_the_war_effort:0 "Гільдія для військових потреб"
 AST_the_swpa_menace_boycot_JAP:0 "$AST_the_swpa_menace$"
 AST_transport_plane_equipment_2:0 "Douglas C-47 Skytrain"
 AST_war_is_coming_desc:0 "Протягом останніх трьох десятиліть ми стикалися з одним викликом за іншим, проте попереду маячить ще один, останній, який назавжди випробує на міцність австралійську демократію. Колишній прем'єр-міністр Біллі Г'юз висловлюється з цього приводу дуже чітко, і було б безвідповідально з нашого боку ігнорувати його заяви про те, що — подобається нам це чи ні — війна наближається."
 AST_workers_defence_corps_sparks_anew:0 "Новий спалах Робітничого корпусу оборони"
 ATJ_ADJ:0 "Ачезьк"
 ATTRITION_SINGLE_UNIT:0 "§RЦя військова частина страждає від виснаження!\nПоточний рівень: $VALUE|Y0%$§!"
 ATTRITION_SOME_UNITS:0 "§R$COUNT|Y$ військ. част. страждають від виснаження!\nМаксимальний поточний рівень: $MAX|Y0%$§!"
 AUS_a_new_constitution:0 "Нова Конституція"
 AUS_air_research_boost:0 "Інноваційні ВПС"
 AUS_allied_tech_sharing_group_name:0 "Європейський комітет з питань досліджень союзників"
 AUS_bbo_focus_tt:0 "§GЗбільшує§! ефективність доступного §YІндустріального Концерну§!:"
 AUS_construction_guilds:0 "Створити будівельні гільдії"
 AUS_construction_guilds_desc:0 "Оскільки [AUS.GetNameDef] стає все більш привабливим місцем для промисловості, ми зрозуміли, що нашої швидкості будування нових заводів не вистачає. Створення будівельних цехів сприяло б прискоренню будівництва всередині країни."
 AUS_eiserne_legion:0 "Затвердити Залізний Легіон"
 AUS_eiserne_legion_desc:0 "Наше керівництво перероблено, а воєнізованим організаціям знову дозволено створити елітну охорону спеціально для нашого лідера. Невелика група колишніх фашистських чиновників виступила добровольцями, щоб створити елітну гвардію для придушення опозиції та контролю над масами. Це чудова можливість для нас!"
 AUS_form_nachrichtenabteilun_desc:0 "Ми були роззброєні протягом тривалого часу, і хоча це мало жахливі наслідки, у цьому були й позитивні сторони. Світ думає про нас як про дрібних вискочок, які зосереджуються лише на нашій армії. Зосередившись зараз на розвідці та шпигунстві, ми зможемо використати їхні власні припущення про нас на нашу користь."
 AUS_heavy_specialization_bonus:0 "Ініціатива Grossflugzeugkompanie"
 AUS_heimwehr_support_desc:0 "За роки існування Сен-Жерменського Договору, кількість воєнізованих формувань у Австрії стрімко зросла. Вони, як правило, потрапляли під заборону, адже більшість з них мали політичні плани, які вони хотіли просувати. Ідеали Гаймверу ніколи не були такими далекими від наших власних. Заручившись їхньою підтримкою, ми могли б переконати їх битися пліч-о-пліч із нашим Бундесгеером."
 AUS_heritage_of_an_empire_desc:0 "Ми не забули, ким були наші предки кілька десятиліть тому. В глибині душі, [AUS.GetNameDef] все ще залишається імперією, і після наполегливої праці не мине багато часу, перш ніж ми знову зможемо гідно зватися австрійцями. Настав час підготувати наших людей до цього переходу."
 AUS_hold_elections_desc:0 "Оскільки наші останні вибори відбулися 9 листопада 1930 року, перед «самоліквідацією парламенту» в 1934 році, наші люди майже втратили віру в австрійську демократію. Нашим першочерговим завданням має бути відновлення віри та надання людям можливості висловитися!"
 AUS_industrialization_effort_desc:0 "[AUS.GetAdjective]ий промисловий сектор напрочуд добре витримав нашу складну ситуацію. З високим рівнем безробіття це також дає нам певні перспективи. Розширюючи нашу промисловість, ми могли б одночасно вирішити дві проблеми: збільшити промислові потужності та зменшити безробіття."
 AUS_integrate_hungary:0 "Інтегрувати Угорщину"
 AUS_invest_in_erzberg_steel_mines:0 "Інвестувати в металургійні копальні Ерцберга"
 AUS_is_more_likely_to_accept_being_brothers_in_arms_flag:0 "§Y[AUS.GetAdjective]§! народ схиляється на наш бік"
 AUS_join_the_axis_tt:0 "§R[GER.GetNameWithFlag] навряд чи прийме нас як члена свого альянсу, [GER.GetFactionName], навіть із блискучими стосунками вони можуть відхилити наш запит!§!"
 AUS_mio_trait_modular_construction:0 "$generic_mio_trait_modular_construction$"
 AUS_mio_trait_structural_integrity:0 "Покращена структурна цілісність"
 AUS_news_events.10.a:0 "Абсурд!"
 AUS_news_events.6.a:0 "Тривожно"
 AUS_osterreichische_gebirgsjager_tt:0 "Відкриває §HГірська Оборонна Підготовка§!\n§HПіхота\n    Гори§!\n      Оборона: §G+5%§!\n      Рух: §G+5%§!\n§HГірська піхота\n    Гори§!\n      Захист: §G+5%§!\n      Рух: §G+10%§!\n"
 AUS_our_brothers_in_the_east_desc:0 "Хоча зараз ми нарешті відновили себе як демократію, є багато країн і їх народів, які страждають у тіні авторитарних диктаторів. Хоча ми не прагнемо возз’єднання з нашими угорськими братами, ми все ще вважаємо, що їм теж слід дозволити зробити вибір для себе. Вони пізнають демократію, чого б не хотів там їх уряд!"
 AUS_outlaw_the_radicals_desc:0 "Ми перебуваємо в дуже делікатній політичній ситуації. Зараз не час для внутрішньої боротьби між радикальними партіями на різних кінцях політичного спектру. Поки не мене найгірше, ми не можемо дозволити їм вивергати свою мерзенну пропаганду!"
 AUS_political_events.100.b:0 "Ми ризикуємо зазнати помсти, якщо відмовимося."
 AUS_political_events.105.desc:0 "Оскільки [GER.GetNameDef] дедалі агресивніше наполягає на тому, щоб ми дозволили їм анексувати себе, ми думали, що зможемо покладатися на Італію та їх гарантії. Здається, це було помилкою. Зіткнувшись із загрозою агресії Німеччини, вони негайно відступили, залишивши нас у катастрофічній ситуації. Їхні обіцянки були лише словами..."
 AUS_political_events.120.a:0 "Славний день."
 AUS_political_events.18.desc:0 "Здається, [FROM.GetAdjective] все-таки прийшла до тями. Заборона на нашу сестринську партію в їх країні все ще діє, але вони принаймні призначили Артура Зейсса-Інкварта радником в уряді, що дозволить нам трохи зрозуміти їхні політичні маневрування."
 AUS_political_events.19.t:0 "Годвін фон Брумовський пропонує свої послуги"
 AUS_political_events.3.desc:0 "Недавня ремілітаризація Рейнської області викликала велике занепокоєння серед нашого народу. У нашому уряді піднімається питання: «Чи станемо ми наступними?» Хоча німецький фюрер постійно запевняє, що анексія Австрії не відповідає його інтересам, ми не можемо бути впевненими, що такі дії в майбутньому — цілком виключені."
 AUS_political_events.47.a:0 "Тоді нехай подумають ще раз."
 AUS_political_events.51.a:0 "Ми ще їм це пригадаємо!"
 AUS_political_events.59.desc:0 "[FROM.GetNameDef] уряд знову показали свою довіру до Альфреду Янси, фельдмаршалу з явно антинімецькими настроями. З планами зміцнення наших кордонів і протидії нападу з нашого боку, цей фельдмаршал був для нас скалкою раніше і, ймовірно, ще встигне нам набриднути."
 AUS_political_events.76.a:0 "Наблидли. Ладно, хоча б так."
 AUS_political_events.79.desc:0 "Як ми й сподівалися, [FROM.GetAdjective]е керівництво запропонувало нам підтримку в цей важкий час. Звичайно, ми не можемо покладатися на них у повному вирішенні всіх наших проблем, але знову отримати їхню підтримку, безумовно, дуже вітаємо. Особливо, поки триває наша боротьба за владу."
 AUS_political_events.84.b:0 "Ні, ну майте совість."
 AUS_political_events.86.a:0 "Прокляття!"
 AUS_political_events.94.desc:0 "Незважаючи на доволі велику суму, яку ми запропонували [FROM.GetAdjective]ому уряду за придбання Аляски у них, вони відмовилися від цієї угоди. У нас є цілком законна претензія до тої землі, яку вони зараз активно відмовляють нам. А ми навіть не погрожували забрати її у випадку відмови. Схоже, таки доведеться."
 AUS_proclaim_austrian_empire_desc:0 "Наші зусилля щодо відновлення нашої Імперії нарешті окупилися. Ми завоювали всі наші старі території і можемо знову по праву називати себе Імперією!"
 AUS_promote_admirals:0 "Нові адмірали"
 AUS_release_imprisoned_leaders:0 "Легалізувати політичну опозицію"
 AUS_renounce_the_treaties_desc:0 "Хоча наш уряд загалом віддає перевагу дискурсу та дипломатії, а не конфліктам і зухвалим діям, у питанні Сен-Жерменського Договору ми не можемо зволікати. Оскільки наша нація стабілізується, і ми повертаємо собі контроль, немає жодних причин зв’язувати себе такими суворими обмеженнями. Ми негайно скасовуємо цей поствоєнний ідіотизм."
 AUS_seek_soviet_support_tt:0 "§RПоклавшись на [SOV.GetAdjective]у підтримку зараз, це зробить нас нездатними атакувати їх в майбутньому!§!"
 AUS_spanish_intervention:0 "Інтервенція в Іспанію"
 AUS_subject:0 "$OVERLORDADJ$а $AUS$"
 AUS_subjugating_the_lands_of_old_decision:0 "Заневолити [FROM.OWNER.GetNameDef]"
 AUS_take_back_galicia_desc:0 "Оскільки наша імперія знову починає рости, ми не можемо ухилитися від вимоги повернути наші законні землі навіть у більших країн. [POL.GetNameDefCap] може принаймні виглядати більшим за нас, однак причина в цьому — Галичина — має належати нам, і якщо вони не віддадуть її нам добровільно, нам, вірогідно, доведеться застосувати силу."
 AUS_the_danubian_federation_desc:0 "Завдяки нашому унікальному розташуванню в центрі Європи, ми маємо весь потенціал, щоб стати дуже впливовими без необхідності явних територіальних здобутків. Настільки важливою, наскільки сильною є сила нашої армії, є сила наших слів і дипломатичних дій. Сформувавши спільноту навколо Дунаю, ми могли б мати дипломатичне охоплення та владу далеко за межами наших власних кордонів."
 AUS_the_homeland_front:0 "Вітчизняний фронт"
 Attaleia:0 "Атталея"
 Attouda:0 "Аттуда"
 Axis:0 "Вісь"
 BALTIC_communist_opposition:0 "Вступити в опозицію"
 BALTIC_events.19.a:0 "Це природний вибір!"
 BALTIC_events.6.t:0 "[From.GetNameDefCap] бажає об'єднання Балтики"
 BALTIC_rejoin_the_railways:0 "Возз'єднати залізниці"
 BALTIC_soviet_equipment_desc:0 "У нас немає надії повалити уряд, не отримавши спочатку доступу до зброї та матеріалів, необхідних, щоб озброїти наше ополчення. Звернувшись за допомогою до росіян, ми дістанемо додаткове озброєння для своєї армії на випадок, якщо старий уряд спробує стримати революцію."
 BALTIC_unchain_education_desc:0 "[Root.GetNonIdeologyAdjectiveCap]а освітня система довго була обмежена розрізненістю наших великих населених пунктів, але тепер, коли люди з сіл переселяються ближче до міст, нам буде простіше ефективно навчати [Root.GetNonIdeologyAdjective] молодь."
 BATTLEFIELD_SUPPORT_DESC:0 "Поліпшивши взаємодію штурмовиків із наземними дивізіями, ми зможемо найбільш ефективно знищувати сили ворога."
 BBA_african_union_events.16.a:0 "Дуже підозріло."
 BBA_ethiopia_anti_colonialism_events.2.t:0 "[?global.african_supporting_country.GetNameDef] просить визнання держави [?global.african_revolt_country.GetNameDef]"
 BBA_ethiopia_balance_of_power_events.52.b:0 "Це потрібно припинити."
 BBA_ethiopia_balance_of_power_events.56.t:0 "Економічний бум в області [?ROOT.ETH_bop_state.GetName]"
 BBA_ethiopia_communist_events.03.desc:0 "Останнім часом з'явилися тривожні звіти про те, що [ETH.GetAdjective] війська говорять російською і використовують [SOV.GetAdjective] зброю. Ми можемо лише припустити, що [SOV.GetName] надсилає 'добровольців' для боротьби на боці [ETH.GetLeader], сподіваючись посилити вплив в Африці та послабити підтримку уряду [ITA.GetLeader] у [ITA.GetName]."
 BBA_ethiopia_communist_events.06.indy_desc:0 "Офіцери армії розпустили тимчасовий [ETH.GetAdjective]ий уряд. Вони заявили, що мають докази зради з боку [ROOT.GetLeader], нібито отримані розвідкою. За ними, уряд вів переговори з [ITA.GetAdjective]ою владою про окупацію країни в обмін на особисте збагачення. Після зіткнень із Чорними Левами більшість урядовців загинула або заарештована. \n\nТепер країною керує військова адміністративна рада."
 BBA_ethiopia_communist_events.22.desc:0 "[ITA.GetAdjective]а влада досі ігнорує наші вимоги припинити війну проти [ETH.GetName]. Стало зрозуміло, що єдина мова, яку вони розуміють — це мова грубої сили. Якщо ми продовжимо рух у тому ж напрямку, війна між [SOV.GetName] та [ITA.GetName] стане неминучою. Якщо ж відступимо зараз — втратимо все, що було здобуто у підтримці [ETH.GetName] і втратимо вагу на міжнародній арені."
 BBA_ethiopia_communist_events.36.desc:0 "[SPC.GetNameDefCap] погодилися з нашою пропозицією створити незалежну Республіку Риф на півночі Марокко. Це позитивний крок у боротьбі за незалежність по всій Африці та в усьому світі."
 BBA_ethiopia_communist_events.47.t:0 "[ETH.GetNameDefCap] пропонує мир"
 BBA_ethiopia_communist_events.52.b:0 "Ми навчимо їх поваги."
 BBA_ethiopia_communist_events.58.t:0 "Відносини між [ETH.GetNameDef] та [JAP.GetName] зіпсовані"
 BBA_ethiopia_communist_events.61.a:0 "Ми не віддамо наші землі."
 BBA_ethiopia_exile_events.14.b:0 "Нізащо!"
 BBA_ethiopia_exile_events.45.desc_redraw_map:0 "[FROM.GetLeader] уклав мир з [FROM.FROM.GetNameDef]. [ROOT.GetNameDefCap] повинен поступитися всім півднем [FROM.FROM.GetName]. В якості компенсації [550.GetName] має бути передано [ROOT.GetName], щоби гарантувати, що [ROOT.GetName] має доступ до моря. Це також, на погляд [FROM.GetLeader], розділяє територію на окремі одиниці, що, на думку [FROM.GetLeader], зменшить ризик майбутніх конфліктів між двома народами."
 BBA_ethiopia_exile_events.57.desc:0 "Нещодавній заклик до моряків і кораблів [?ETH.host_nation.GetAdjective], які бажають відважно боротися з ворогом у водах, що кишать ворогом, був зустрінутий великою кількістю охочих добровольців. Відставні військово-морські кадри, цивільні моряки і молоді добровольці, які просто шукають пригод, вступили до екіпажу різношерстого флоту вантажних кораблів, які ми зібрали на верфях [?ETH.host_nation.GetNameDef]."
 BBA_ethiopia_fascist_events.07.a:0 "Уперед, до перемоги."
 BBA_ethiopia_fascist_events.21.a:0 "Ярмо скинуте."
 BBA_ethiopia_fascist_events.56.desc:0 "[ITA.GetAdjectiveCap]ий уряд схвалив наш запит на військове оснащення. Хоча це, безумовно, не найкраще їхнє спорядження, воно, безумовно, прискорить наші плани модернізації."
 BBA_ethiopia_fascist_events.60.desc:0 "[ITA.GetAdjective] не захочуть ділитися всіма своїми промисловими секретами, остерігаючись, що вони можуть потрапити до рук ворогів. Тому ми маємо добре зважити, який аспект наших збройних сил найбільше виграє від аутсорсингу виробництва."
 BBA_ethiopia_fascist_events.69.t:0 "[FROM.GetName] просить військових радників"
 BBA_ethiopia_imperial_events.1.desc:0 "[FROM.GetLeader] хоче придбати [ROOT.GetAdjective]у колонію в області [268.GetName]. Цією купівлею [FROM.GetNameDef] отримає доступ до моря крізь порт Джібуті, до якого вже є залізничне сполучення з Аддіс-Абеби. За таку незначну колонію пропонують пристойну суму."
 BBA_italo_ethiopian_war_events.14.c:0 "Немає сенсу відправляти наших людей на смерть в іншу країну."
 BBA_italo_ethiopian_war_events.300.a:0 "Як мало в них віри!"
 BBA_italo_ethiopian_war_events.510.desc:0 "Ми отримали повідомлення про те, що італійці розпочали дезінформаційну кампанію з метою підірвати наше правління та легітимність на батьківщині. Ця підла брехня може схилити деяких наших підданих на бік держави [ITA.GetNameDef] і послабити наші претензії на трон. Ми мусимо відновити наше правління над Ефіопією, перш ніж вони завдадуть подальшої шкоди!"
 BBA_italy_air_accident.01.t:0 "Трагічна загибель $ITA_italo_balbo$"
 BBA_italy_anti_colonialism_events.09.a:0 "Ми підемо за нашими італійськими товаришами!"
 BBA_italy_anti_colonialism_events.11.t:0 "[FROM.GetAdjective]і робітники захоплюють владу"
 BBA_italy_civil_war.100.t:0 "Окупована італійська територія"
 BBA_italy_civil_war.3.desc:0 "Ми отримали інформацію, що кілька невеликих груп комуністичних партизанів, які називають себе Гаппісти, здійснили кілька успішних наїздів на нашу територію. Вони добре підготовлені та озброєні, що змушує нас підозрювати, що їх фінансує [FROM.GetName]."
 BBA_italy_civil_war.4.desc:0 "Опір і партизанські групи в державі [FROM.GetName], які невтомно працюють над звільненням решти Італії, досягли успіху! Насправді, зловісний режим, який досі утримує там владу, був змушений розпочати нову серію жорстких антипартизанських заходів. Це ускладнить роботу наших агентів у державі [FROM.GetName], але боротьба за вільну Італію триває!"
 BBA_italy_civil_war.6.desc:0 "Наш союзник — і тимчасовий — володар, [FROM.GetName], почув наш заклик до свободи й погодився повернути нам нашу незалежність! Це знаменна подія для нашої змученої війною країни. Тепер ми можемо серйозно взятися за відбудову і почати шлях до об'єднання."
 BBA_italy_interaction_events.12.t:0 "[FROM.GetName] передає нам чорногорську корону"
 BBA_italy_interaction_events.17.a:0 "Ми нічого не можемо з цим вдіяти..."
 BBA_italy_interaction_events.32.a:0 "Pour la Paix"
 BBA_italy_interaction_events.33.b:0 "І чому саме вони повинні його мати?"
 BBA_italy_interaction_events.35.b:0 "Безглуздо."
 BBA_italy_interaction_events.37.a:0 "Не все, що ми хотіли, але ми візьмемо це."
 BBA_italy_local_rulers.2.c:0 "$ETH_abba_jofir$ та його послідовники мають бути підкорені."
 BBA_italy_missiolinis.202.a:0 "Важко бути оточеним некомпетентністю."
 BBA_italy_missiolinis.213.desc:0 "Після нещодавніх підвищень у вищому військовому командуванні Муссоліні відчуває себе більш впевненим у військовій спроможності Італії, ніж будь-коли, заявив дуче у низці промов. Звертаючись до різних родів військ, він вихваляв їхню хоробрість і здібності, кажучи солдатам, що він переконаний в їхніх майбутніх успіхах."
 BBA_italy_missiolinis.41.t:0 "Зміцнення армії"
 BBA_italy_missiolinis.62.desc:0 "Недостача запасів пального постійно тривожить вище військове командування, яке побоюється, що літаки не злетять, лінкори стануть на якір, а армії не зрушать із місця. Дуче певен, що Італія це переживе — як завжди, — але його дратує, що його чіткі накази досі не було виконано."
 BBA_italy_missiolinis.71.desc:0 "Відтоді, як дуче заснував Regia Aeronautica, вона стала предметом національної гордості та одною з найвеличніших повітряних сил у світі. Єдина проблема — Aeronautica надто мала, і тепер дуче переконаний, що слід створити додаткові літаки для зміцнення Aeronautica."
 BBA_italy_missiolinis.73.a:0 "Aeronautica переможе!"
 BBA_italy_naval_cooperation_programs.01.a:0 "Вигідна угода!"
 BBA_italy_naval_cooperation_programs.06.a:0 "[FROM.GetLeader] не продумав це як слід..."
 BBA_italy_naval_cooperation_programs.12.desc:0 "[FROM.GetAdjective]ий флот отримав наші есмінці, які ми їм так щедро подарували. Безплатно. Сподіваємось, вони будуть використані з користю."
 BBA_italy_naval_cooperation_programs.15.a:0 "Чудово!"
 BBA_italy_pact.2.t:0 "[FROM.GetNameDefCap] відмовляється від нашої оливкової гілки"
 BBA_swiss_expansion.14.a:0 "Ми отримаємо їх так чи інакше"
 BBA_swiss_expansion.2.desc:0 "Після масштабної пропагандистської кампанії народ [?SWI.SWI_influence_target_state.GetName] переважною більшістю підтримує вступ до [ROOT.GetNameDef].\n\nЦе означає, що якби [?SWI.SWI_influence_target_state.GetName] була такою ж демократією, як і ми, вона вже була б частиною нашої країни. На жаль, це не так, тому їм потрібна наша допомога, щоби стати новим кантонами [SWI.GetName].\n\nМи можемо вимагати проведення референдуму в цьому штаті щодо членства у [ROOT.GetNameDef]."
 BBA_switzerland.1.c:0 "За цих обставин ми не можемо зберігати нейтралітет."
 BBA_switzerland.15.b:0 "Нам потрібен [ITA.GetAdjective] оперативник"
 BBA_switzerland.21.a:0 "Їм потрібен наш захист"
 BBA_switzerland.25.a:0 "Ми в незвіданих водах!"
 BBA_switzerland.7.t:0 "Франкфуртера загадково вбито у в'язниці"
 BBA_switzerland.8.b:0 "Він зробив послугу демократії. Його слід помилувати!"
 BEG_ETH_neutrality_subject:0 "Бенішангул-гумузька автономна область"
 BEL_CAS_equipment_2_short:0 "S.47"
 BEL_GER_fascism_autonomy_reichsprotectorate_DEF:0 "Райхспротекторат Бельгія"
 BEL_aviation_school:0 "Авіаційна школа"
 BEL_develop_home_support_desc:0 "Хоча більшість військових зусиль координуються з нашого місця у вигнанні, ми все ще користуємось широкою підтримкою вдома. Це, головним чином, завдяки роботі Генеральних секретарів, які довели свою здатність організовувати громадянські зусилля без надмірного протистояння окупантам."
 BEL_fonderie_royale_de_canons_liege_organization:0 "Fonderie Royale de Canons Liege"
 BEL_german_non_aggression_desc:0 "[GER.GetName] аплодує нашому оголошенню нейтралітету та публічно висловила зацікавленість у взаємному пакті про ненапад для зміцнення цієї позиції та забезпечення безпеки своїх кордонів."
 BEL_government_resigns_complete_national_unity_tt:0 "§RОбрання Уряду національної єдності в події «Уряд йде у відставку» завершить цей фокус.§!"
 BEL_legacy_of_the_soldier_king_desc:0 "Король Альбер, король-солдат, герой війни та рятівник Бельгії. Ми можемо багато чого навчитися у цього великого чоловіка, і його приклад є таким, який може бути корисний не лише нашій армії, а й усій нації. Ми будемо чинити опір і боротися з будь-яким загарбником до останнього."
 BEL_liberal_party:0 "ЛП"
 BEL_mio_trait_knight_engines:0 "Knight Engines"
 BEL_senior_officer_training:0 "Підготовка старших офіцерів"
