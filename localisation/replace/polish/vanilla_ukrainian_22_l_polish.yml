 ITA_SH_battleship_2_desc:0 "Клас «Regina Elena» — це гіпотетичний клас важких лінкорів, які були би спущені на воду приблизно в той час, коли Італія вступила у війну. Їх можна було порівняти з лінкорами класу «Montana», запланованими США. Вони мали високу броню, водотоннажність понад 70 000 тонн і були озброєні 406-мм гарматами в головній батареї."
