 news.102.d:0 "За повідомленнями з Лондона, столиця Великої Британії була захоплена німецькими військами.\n\nЗ передмість як і раніше доноситься стрілянина, але ніяких значних скупчень англійських військ у місті не помічено.\n\nЗагін особливого призначення взяв штурмом Бакингемський палац, але стверджується, що королівська сім'я була евакуйована напередодні атаки.\n\nВперше з часів Вільгельма Завойовника Лондон опинився в руках іноземних загарбників."
 news.14.d:0 "У сьогоднішньому прес-релізі Москва повідомила про анексію держави [TAN.GetNameDef]. Верховна Рада прийняла рішення позитивно відповісти на запит тувинського парламенту про членство в СРСР.\n\nТувинська народна республіка, яка досі була визнана лише СРСР і Монголією, буде перетворена на автономну область."
 news.140.d:0 "У радянському комюніке повідомляється про остаточну капітуляцію німецьких військ у Берліні. Оточивши місто, радянські війська увійшли до нього з декількох напрямків, щокроку долаючи відчайдушний опір німців.\n\nНарешті, радянським військам вдалося перейти міст Мольтке і зайняти будівлю Райхстагу. Вони відбивали одне приміщення за іншим і зрештою поставили над містом радянський прапор. Битву за Берлін закінчено."
 news.142.d:0 "Нестримне просування Червоної армії продовжується, і надходять повідомлення про захоплення французької столиці. Ймовірно, французькі комуністи надали допомогу СРСР і брали участь у боях.\n\nПо всьому місту розклеєні листівки, в яких парижанам повідомляють про їхнє «звільнення від буржуазного гніту» і про те, що Паризька комуна нарешті повстала з попелу."
 news.160.t:0 "На Німеччину напали"
 news.164.d:0 "Включивши Австрію до свого складу, держава [GER.GetName] використала це для виправдання подальших претензій та назвала «правомірним» повернення колишніх австрійських територій, зокрема Словенії, яка зараз належить державі [YUG.GetName].\n\nУ відповідь на це в Лондоні була скликана конференція для обговорення «словенського питання», куди прибули делегати країн, які підписали Версальський договір.\n\nНа конференції Велика Британія і Франція виступили проти німецьких вимог, заявивши, що [YUG.GetName] повинна зберегти кордони, передбачений Версалем."
 news.165.b:0 "Ми не відступимо."
 news.168.d:0 "Після втрати Словенії Югославія почала розпадатися по кордонах етнічних груп, а центральна влада слабшає з кожним днем.\n\nСьогодні міністр закордонних справ Німеччини оголосив про намір остаточно виправити помилку Версальської угоди. Було укладено договір, за яким держава [YUG.GetName] була поділена між дружніми Німеччини країнами.\n\n[YUG.GetAdjective]і дипломати не знали про договір до його ратифікації, і в ситуації, коли югославські землі розбирають по шматочках численні сусіди, [YUG.GetLeader] мало що може зробити."
 news.17.b:0 "Румуни принизили нас..."
 news.171.c:0 "Ми мусимо подивитися, чи зможемо ми допомогти Греції."
 news.171.d_ITA:0 "Після того як [GER.GetLeader] та [ITA.GetLeader] провели зустріч, [GER.GetAdjective]ий уряд публічно підтримав [ITA.GetAdjective]у позицію в суперечці про кордони з державою [GRE.GetNameDef].\n\nГрецький лідер [GRE.GetLeader] вважає запропоноване рішення абсолютно неприйнятним і клянеться захищати країну «до останнього патрона, останнього снаряда та останнього подиху»."
 news.172.a:0 "Вони вчинили розумно."
 news.177.f:0 "Ознака зростання напруженості в Європі."
 news.181.t:0 "[France.GetName] та [From.GetName] об'єднуються"
