 hq_motorized_desc:0 "Піхота на автотранспорті, що дозволяє значно швидше передислокувати штаб."
 hungary.1.d:0 "Незважаючи на наші законні вимоги, Німеччина вирішила, що Трансільванія має залишатися під контролем Румунії. Вона каже, що прагне виправити всі кривди, заподіяні у Версалі, але, вочевидь, це справедливо лише там, де йдеться про їхні власні кордони."
 iceland_events.12.t:0 "[FROM.GetLeader] вимагає компенсацію"
 iceland_events.18.desc:0 "[FROM.GetNameDefCap] лише висловлює помірний протест і не ризикує додатково провокувати [ROOT.GetAdjective]ий народ. [ROOT.GetNameDefCap] тепер може сфокусуватися на важливіших справах, ніж зв'язки з державою [FROM.GetName]."
 iceland_events.6.desc:0 "[FROM.GetLeader] офіційно заявляє, що, оскільки [FROM.GetName] воює разом із Данією та цілком справляється зі своїми обов'язками, держава більше не має потреби в данському наставництві з питань зовнішньої політики або в будь-яких інших справах, які стосуються [FROM.GetAdjective]ої політики. Це фактично оголошення незалежності."
