 ITA_forza_navale_especiale:0 "Forza Navale Speciale"
 ITA_grand_council_considers_intervention_tt:0 "Якщо баланс сил зсунеться більше до рук §YВеликої ради§!, вона може повністю §Rвідняти владу§!, якою володіє §Y[ROOT.GetLeader]!§!"
 ITA_guarantee_austrian_independence:0 "Гарантувати незалежність Австрії"
 ITA_heroes_of_the_nation_desc:0 "Ми мусимо визнати та винагородити заслуги великих героїв нашого народу, хоча не треба забувати, що без мудрого керівництва дуче їхній потенціал було би повністю змарновано."
