 HUN_apostolic_king_goering:0 "Коронувати Германа Гьорінга апостольським королем"
 HUN_balkan_union_category_desc:0 "Настав час реалізувати грандіозне бачення об’єднаної та незалежної Балканської Федерації, в якій усі громадяни рівні та можуть вільно жити, радіти, зрештою пересуватися незалежно від походження, культури чи віросповідання. Наші міжнародні амбіції міцніють з кожним днем!"
