 RULE_OPTION_HUN_REPUBLICAN_DEMOCRACY_EXPANSIONIST:0 "Рух Дракона"
 RULE_OPTION_SOVIET_REPUBLIC_DESC:0 "§HМексика§! зблизиться з Радянським Союзом, щоб із серпом і молотом у руках принести вогонь революції в Латинську Америку."
 RULE_TYPE_ITEM_TOOLTIP:0 "Вид правила: $RULE_TYPE|H$"
 RU_Adj_Ending_Aya:0 "а"
 SAF_SH_battleship_1_desc:0 "The Centurion was a class of hypothetical heavy battleships of the Royal Navy built to counter the large vessels of the German and Japanese navies. Large 18 in. guns and thick armor provide the ship with the necessary firepower and protection to battle these vessels. Strong AA armament, long range, and good speed were a necessity to cover the vast seas of the British Empire."
 SAF__south_african_military_college_desc:0 "У Південній Африці має з'явитися своя військова академія на зразок американського Вест-Пойнту. Ми зможемо випускати професійних офіцерів, вірних Союзу."
 SAF_a_king_for_our_people_desc:0 "Південна Африка має мати свого короля, і, на щастя, є один Віндзор, який зараз нікому не потрібен. Колишній Едуард VIII, герцог Віндзорський, може зайняти наш престол."
 SAF_anti_submarine_tactics:0 "Протичовнові тактики"
 SAF_anti_tank_equipment_2:0 "QF 6-pounder"
 SAF_armament_effort_desc:0 "Південній Африці не загрожує вторгнення з-за кордону, але вона віддалена від своїх союзників. Ми мусимо розвивати військову промисловість, щоб Союз не залишився без захисту."
 SAF_battleship_3_desc:0 "The Lion-class battleships were the follow-up class to King George V battleships, incorporating many of their features. Six ships were ordered in the 1938 Naval Program to replace the aging Revenge-class battleships but none were finished due to the erupting hostilities. The vessels would have been general similar to the King George-class, but the main armament would be heavier, introducing a new 16 in. cannon. They would also have thicker armor and more powerful engines."
 SAF_carrier_2_desc:0 "The Ark Royal aircraft carrier was the first such vessel to be built to fit the restrictions of the Washington Naval Treaty. She was the first ship on which the hangars and flight deck were an integral part of the hull. Designed in 1934, the vessel was well-armored and armed. It carried a large complement of aircraft and had adequate operational range and speed to keep up with the major forces of the Royal Navy."
 SAF_encourage_segregation_desc:0 "Ми мусимо активніше вводити законодавчий поділ етнічних груп, щоби зміцнити становище та єдність нашого керівного класу."
 SAF_expand_the_simons_town_base_desc:0 "Саймонстаун, розташований на Капському півострові, є головною військово-морською базою Південної Африки з 1790-х років. Базу необхідно модернізувати і розширити, щоби збільшити кількість і розміри кораблів, що знаходяться тут."
 SAF_heavy_cruiser_2:0 "Клас «Surrey»"
 SAF_infantry_equipment_1_short:0 "Rifle No. 4 Mk I"
 SAF_joint_air_training_scheme_desc:0 "Країни Співдружності об'єднали свої ресурси та досвід, щоби поліпшити та прискорити процес підготовки пілотів та льотних екіпажів."
 SAF_medium_tank_aa_equipment_1:0 "Crusader (зенітний)"
 SAF_retain_experienced_pilots:0 "Залишати досвідчених пілотів у себе"
 SAF_south_african_special_forces_desc:0 "Південній Африці потрібні спецпризначенці для виконання непростих завдань у важкодоступних районах."
 SAF_submarine_warfare_desc:0 "Ворожі торгові конвої продовжують використовувати маршрут, що проходить поблизу мису Доброї Надії. Їх треба атакувати із глибин."
 SAR:0 "Саравак"
 SAR_DEF:0 "Саравак"
 SAX_communism:0 "Демократична республіка Саксонія"
 SCORCHED_EARTH_STATE:0 "\n§HВипалена земля§!\n\nДозволяє пошкодити залізниці в цій області за £pol_power $COST|H$, що не дозволяє їх полагодити."
 SDL_democratic_DEF:0 "Судетська область"
 SEA_PHI_political_events.17.t:0 "Наше нове керівництво"
 SEA_PHI_political_events.19.a:0 "Світ сьогодні здається трохи похмурішим"
 SEA_PHI_political_events.31.desc:0 "Запит генерала МакАртура про приєднання Дуайта Д. Айзенгауера до нас на Філіппінах було схвалено! Нам пощастило, що така висхідна зірка приєднується до нас, і це є ще одним доказом того, наскільки Сполучені Штати віддані нашому захисту. Нам дали зрозуміти, що це буде короткострокове відрядження приблизно на два роки, проте, можливо, знайдеться спосіб заохотити його залишитися на Філіппінах."
 SEA_PHI_political_events.42.c:0 "Лаурель має зв'язки."
