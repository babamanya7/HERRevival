 news.32.d:0 "Дипломати Німеччини та Радянського Союзу уклали угоду, яку сміливо можна назвати історичною — пакт Молотова–Ріббентропа.\nПакт про ненапад, який отримав назву за прізвищами німецького міністра закордонних справ Йоахіма фон Ріббентропа та його радянського колеги В'ячеслава Молотова, зобов'язує кожну сторону не виступати проти іншої.\n\nЗакордонні дипломати попереджають, що такий пакт розв'язує Німеччині руки й дозволяє вести війну в Європі, не боячись радянського втручання."
 news.333.t:0 "Британська атака на Мерс-ель-Кебір"
 news.334.c:0 "[JAP.GetAdjective]а загроза зростає"
 news.336.c:0 "Як [USA.GetLeader] дав цьому статися?"
 news.337.desc:0 "Сьогодні було підписано мирний договір між [ETH.GetLeader] та [ITA.GetLeader], який припиняє військові дії між двома країнами. Незважаючи на величезну різницю в силі між королівством, що не має виходу до моря, та імперією, що охоплює весь світ, ефіопський уряд, безумовно, вийшов переможцем у цих переговорах. Італія не тільки повинна укласти перемир'я з Ефіопією, але й території Ерітреї та Італійського Сомаліленду були офіційно передані державі [ETH.GetNameDef].\n\nЦе вже друга поразка італійських збройних сил в Ефіопії, уряд [ITA.GetLeader] перебуває в руїнах, і, ймовірно, пройде багато років, перш ніж поранена італійська гордість по-справжньому оговтається від цієї поразки."
