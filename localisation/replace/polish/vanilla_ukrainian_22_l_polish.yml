 GER_mittelafrika:0 "Міттельафріка"
 GER_nationalist_spain_ally:0 "Альянс із Іспанією"
 GER_naval_rearmament:0 "Переозброєння флоту"
 GER_occupy_bosnia_decision:0 "Окупувати Боснію"
 GER_occupy_croatia_decision:0 "Окупувати Хорватію"
 GER_operation_panzerfaust_events.08.desc:0 "Ми успішно захопили Горті та його сина, і передали владу Ференцу Салаші. Тепер Угорщина буде вірною справі."
 GER_oppose_hitler_ww:0 "Об'єднати Вермахт"
 GER_plenipotentiary_of_armaments_desc:0 "Стає дедалі очевиднішим, що хтось має взяти на себе всю повноту відповідальності за забезпечення Вермахту всім необхідним. Альберт Шпеер показав найбільш багатообіцяючі результати у своїх зусиллях з постачання Вермахту. Зважаючи на статус імперського уповноваженого з питань озброєння та військової промисловості, ця людина могла б досягти напрочуд гарних результатів!"
 GER_poland_friend:0 "Подружитися з Польщею"
 GER_pool_technical_know_how_tt:0 "Кожна §Yкраїна§! в §Yальянсі§! отримає цей §Yнаціональний дух§!."
 GER_prepare_italian_coup_desc:0 "Фашистський режим в Італії має бути ліквідовано. Ми звернемося до італійських монархістів та запропонуємо їм свою підтримку у перевороті."
 GER_price_controls_cat_desc:0 "Запровадження контролю за цінами стабілізує економіку та допоможе запобігти інфляції. Завдяки регулюванню цін, товари першої необхідності залишатимуться доступними населенню."
 GER_raid_category_fluff_text_nuclear_raids:0 "§L100-та бомбардувальна ескадра (KG 100)§!"
