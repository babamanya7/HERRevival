 NZL_coastal_defense_desc:0 "Нова Зеландія — острівна держава, віддалена від ворогів, тому ми маємо бути готові до висадки десанту на наші береги."
 NZL_destroyer_1:0 "$ENG_destroyer_1$"
 NZL_full_employment_desc:0 "Завдяки безперервним громадським роботам, ретельному плануванню та неухильному розширенню промисловості, безробіття нарешті поступилося місцем можливостям. Простійні майстерні часів депресії знову працюють, а робоча сила нації повністю задіяна у продуктивних підприємствах. Відновивши впевненість і стабільність, ми не лише відновилися, але й стали сильнішими для майбутніх викликів."
