 HABSBURG_specializing_in_civilian_logistics_desc:0 "Потік інструментів і обладнання по всій федерації страждає від поганої інфраструктури та корумпованих власників фабрик. Ми повинні приділити значну увагу цьому сектору та покращити його якомога швидше."
 HABSBURG_specializing_in_the_arms_industry_desc:0 "Якщо ми колись захочемо конкурувати з колосами промисловості, типу Німеччини, Радянського союзу, Сполученого Королівства або Франції, ми повинні значно розширити нашу військову промисловість!"
