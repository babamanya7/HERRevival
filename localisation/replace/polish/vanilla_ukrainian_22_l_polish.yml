 MAN_assert_our_authority_desc:0 "Інші регіони країни страждають від роздробленості. Серед окупантів і карних злочинців, які називають себе вождями і головами, немає нікого, хто міг би правити. Коли ми наведемо лад, наша влада пошириться по всьому Китаю."
