 MAN_recruit_bandits_north_desc:0 "Кожна куля, витрачена на знищення бандитів, могла б бути використана для боротьби в майбутньому. Замість боротися з нашими підданими, ми можемо дати їм можливість виправитися шляхом служби імператорові."
 MAN_seize_arms:0 "Виконати план"
 MAN_tsr_beiyang_university_desc:0 "Без належної освіти нашим людям бракуватиме можливостей, а наші дослідницькі зусилля відставатимуть від решти Китаю та світу. Тому ми повинні заснувати університет на честь Пан Фу, останнього прем'єр-міністра старого Бейянського уряду."
 MAN_tsr_obedience_desc:0 "Дехто називає нас простою маріонеткою японців, але вони в корені неправильно розуміють наші тісні та рівноправні стосунки з Асоціацією злагоди на чолі. Піти проти наших благодійників було б так само, як дитині піти проти своїх батьків."
