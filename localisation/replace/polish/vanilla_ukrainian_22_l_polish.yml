 sp_land_reward_option_stronghold_network_collapse_02_desc:0 "Тунель під одним із головних бункерів несподівано обвалився, заваливши кількох робітників і зупинивши будівництво. Необхідно вжити екстрених заходів, щоби вирішити ситуацію та безпечно витягти застряглий персонал, але інцидент уже спричинив затримку в загальному прогресі."
 sp_multi_product_supply_ships_desc:0 "Завдяки використанню нових суден постачання ми можемо забезпечити більш плавний перевезення палива, боєприпасів та інших матеріалів."
