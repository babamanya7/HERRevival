 DEN_naval_power_projection_desc:0 "Наявність великого і потужного флоту буде марною, якщо він не зможе донести нашу волю до кожного куточка нашого королівства. З'єднавши наші володіння ланцюжком військово-морських баз, ми закріпимо наше панування на водах."
