 HUN_war_games_desc:0 "Проводячи військові навчання місцевого рівня, ми можемо виявити недоліки поточної структури збройних сил і усунути їх на основі отриманого досвіду."
 IAS_fascism_ADJ:0 "Істмо-америндськ"
 ICELAND_HAS_DECLARED_NEUTRALITY_JOIN:0 "Ісландія оголосила про безумовний нейтралітет і не може приєднуватися до війн"
 ICE_VICTORY_POINTS_11293:0 "Дюфлін"
 ICE_international_brigades_desc:0 "Боротьба проти гноблення має тривати, навіть якщо тут перемога вже здобута. Інакше ми ризикуємо, що наша перемога буде тимчасовою. Сини і доньки [ROOT.GetName] повинні бути готові прийти на допомогу там, де це буде потрібно, а держава повинна зробити все можливе, щоб підтримати це, впроваджуючи необхідне нове законодавство, постачаючи необхідну зброю та обладнання."
 ICE_not_our_king:0 "Не наш король"
 ICE_reykjavik_dockyards:0 "Верфі Рейк'явіка"
 ICE_royal_marines_desc:0 "Збройні сили Ісландії ніколи не будуть великими. Але ми можемо спеціалізуватися, і морська піхота є очевидним вибором для острівної країни. Створюючи і тренуючи морську піхоту, ми отримуємо гнучкі сили, які можуть бути розгорнуті там, де це необхідно."
 ICE_securing_the_north_sea_passage_desc:0 "Настав час повернути те, що має належати Ісландії. Шетландські та Фарерські острови в Північному морі є життєво важливими ключами для контролю над проходом до і з [ROOT.GetNameDef]."
 ICE_state_visits_desc:0 "Не можна заперечувати, що країни, очолювані фашистами, є рушійною силою змін у світі на даний момент. Якщо Ісландія хоче змінитися, можливо, є речі, яких можна навчитися у них. Офіційні відносини мають бути встановлені якнайшвидше, і будь-які можливості для співпраці мають бути вивчені негайно."
 ICE_the_guidance_of_aegir_and_ran_desc:0 "Під керівництвом Рана та Айгіра, уособлення моря та її чоловіка-йотунна, наші кораблі досягнуть панування над північними морями."
 ICE_trade_relations_desc:0 "Невелика країна не може сподіватися виробляти все, що їй потрібно. Однак, підтримуючи добрі стосунки з країнами світу та використовуючи стратегічне розташування посередині між Європою та Північною Америкою, Ісландія має всі шанси стати фінансовим і торговельним центром. Використання цих зв'язків з максимальною віддачею має полегшити закупівлю обладнання, якого країна відчайдушно потребує."
