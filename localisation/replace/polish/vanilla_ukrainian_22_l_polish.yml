 denmark_overlord_events.14.t:0 "[FROM.GetNameDefCap] обирає нового прем'єр-міністра"
 denmark_overlord_events.23.desc:0 "Ми змогли переконати данців відмовитися від своєї ідеології. Тепер у них панує [FROM.GetRulingIdeologyNoun_RU_lower_Nom]."
