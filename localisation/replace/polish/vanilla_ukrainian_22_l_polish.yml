 INS_loyalist_events.6.desc:0 "Наші дипломати повернулися з [FROM.Capital.GetCapitalVictoryPointName] з порожніми руками. Уряд [FROM.GetAdjective] не побажав розглядати цю пропозицію. Причин було названо мало, і нашу делегацію відправили додому, обмежившись ввічливими формальностями."
 INS_medium_tank_equipment_1:0 "Gevechtstank 3"
 INS_mixed_economy_system_desc:0 "Індонезія є унікальною країною і не буде процвітати за традиційного капіталізму чи комунізму. Ми маємо створити систему змішаної економіки, з елементами як капіталізму, так і комунізму."
 INS_nav_bomber_equipment_1_short:0 "PBY Catalina"
 INS_political_events.15.desc:0 "Переговори з Сукарно завершилися, і маріонетковий режим в Індонезії працює. Сукарно використав свої зв'язки разом з нашою військовою присутністю, щоб дестабілізувати голландський уряд і встановити де-факто контроль над архіпелагом."
 INS_purge_oppurtunists:0 "Чистка опортуністів"
