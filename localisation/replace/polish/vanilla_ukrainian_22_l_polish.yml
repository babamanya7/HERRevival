 united_polynesia_autonomy_dominion:0 "Домініон Полінезія"
 unitylow:0 "Низький рівень єдності"
 unlock_warsaw_uprising_tt:0 "Із §Rопором 50%§! на [POL.GetFlag][POL.GetAdjective]их теренах, ви відкриєте операцію §Y«Варшавське повстання»§! після завершення операції §Y«Зв'язатися зі спротивом»§!."
 usa.13.d:0 "Хоча стан здоров'я президента Рузвелта деякий час погіршувався, його потужна президентська кампанія переконала багатьох, що йому залишилося багато років. Проте ймовірність смерті ФДР іще на посаді зберігалася, і сьогодні він помер після перенесеного інсульту. Віце-президент Гаррі С. Трумен зараз склав присягу, попросивши підтримки та молитов народу. Старий кабінет залишився, і Трумен пообіцяв продовжувати багато політики свого попередника."
 usa.7.t:0 "Рузвелт проти Віллкі"
 walzing_matilda_tt:0 "Граючи як [AST.GetNonIdeologyName], розгорніть 25 батальйонів важких танків"
 war_escalation_10_max_tt:0 "Ескалація нижче §Y10§!"
 war_justification.11.a:0 "Вони сповідують насильницьку ідеологію, на яку реакцію, окрім насильства, вони можуть розраховувати?"
 war_justification.14.a:0 "Вони не знають, наскільки сильними нас зробили наші випробування."
 war_justification.301.b:0 "За межами партійних зборів немає місця для публічних розбіжностей."
 war_justification.4.d:0 "«[From.GetAdjective]ий народ — це народ, який не буде легко розлучатися з владою. Однак вони також повинні усвідомлювати, що траєкторія розвитку наших двох народів може закінчитися лише зіткненням. Ми повинні загартувати себе для майбутньої боротьби. Бо [From.GetName] не буде взята без бою».\n\nМожливість порозуміння між однаково думаючими урядами [From.GetName] і [ROOT.GetName] поступилася місцем кампанії по силовому захопленню їхньої території."
 war_justification.8.d:0 "«Чи є суспільство, більш огидне майбутньому революції, більш чуже до долі робітника, ніж фашистський режим [From.GetName]? Закликаючи народ фанатично присвятити себе ветхому інституту національної держави, вони одягнули віковічні способи дикунства в сучасне вбрання, намагаючись представити себе як альтернативу неминучій міжнародній перемозі робітничого класу. Це лише питання часу, коли вони завдадуть удару по нас або наших союзниках. Вдаримо, же першими!»\n\nНіхто не очікував, що між нами і [From.GetAdjective]ою державою буде щось менше, ніж взаємне презирство, але останнім часом ворожнеча посилилася. Схоже, що конфлікт виникне рано чи пізно."
