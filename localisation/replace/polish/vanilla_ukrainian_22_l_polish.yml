 SWE_defense_act:0 "Закон про оборону"
 SWE_defense_in_depth_desc:0 "Жодна сила противника не має нескінченного імпульсу, здебільшого через обмеження ліній постачання та фізичні та розумові обмеження солдатів. Таким чином, більш міцна форма захисту базується не на жорстких лініях фронту, які руйнуються, коли їх пробиють, а на шарах оборони, яка поступово позбавляє ворога його імпульсу."
