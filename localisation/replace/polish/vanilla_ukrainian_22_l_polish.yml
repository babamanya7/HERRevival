 FIN_reach_out_to_scandinavia:0 "Звернутися до Скандинавії"
 FIN_rebalance_industrial_focus:0 "Переглянути промисловий акцент"
 FIN_secure_the_baltic_sea_desc:0 "Хоча ми часто зосереджені на наших сухопутних кордонах і на тому, як найкраще їх захистити, ми не можемо дозволити нашим зусиллям бути марними, нехтуючи вразливістю нашого узбережжя. Тому ми повинні інвестувати в масштабну програму захисту узбережжя, щоб забезпечити це фланг."
 FIN_seek_german_protection:0 "Шукати німецького захисту"
 FIN_ship_torpedo_sub_3:0 "6x 533-мм ТА з заряд. порш."
 FIN_sotilaalliset_kappalaiset:0 "Sotilaalliset kappalaiset"
 FIN_the_second_finnish_civil_war_desc:0 "Завдяки поширенню класової свідомості серед зростаючого пролетаріату та організаторським здібностям його керівництва ми нарешті зібрали ресурси, щоб раз і назавжди повалити наших буржуазних панів."
 FIN_viron_kansa_positive_outcome_tt:0 "[EST.GetFlag][EST.GetNameDefCap] приєднається до нашої фракції або буде анексований нами."
