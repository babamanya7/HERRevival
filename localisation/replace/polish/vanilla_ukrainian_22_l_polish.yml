 mtg_britain.40.t:0 "[From.GetName] пропонує укласти союз"
 mtg_britain.43.a:0 "Вигнати їх до Канади!"
 mtg_britain.5.d:0 "Нарешті настала радісна дата королівського шлюбу. Натовпи людей збиралися тисячами вздовж усього маршруту, пройденого парою від Бакингемського палацу до Вестмінстерського абатства.\n\nВнутрішній опір шлюбу все більше демонстрував своє безсилля, через символічні відставки та інші марні протести, і тепер, здається, майже замовк. Останнім таким актом стала відставка Космо Ленга, архиєпископа Кентерберійського, і його подальша заміна особою, більш... прихильною до бажань короля.\n\nВ умовах політичного безладу, який спричинила ця криза, урочистості, що тривають зараз, є вкрай необхідними для повернення видимості нормального стану справ у суспільстві, а також як відправна точка для вирішення поточних політичних питань."
 mtg_britain.65.t:0 "[From.GetName] змінює уряд"
 mtg_britain.78.d:0 "[PAK.GetNameDef] нарешті визнає нашу незалежність. В умовах стрімкого ослаблення підтримки у них не залишається сенсу продовжувати цю виснажливу війну."
 mtg_exile_government.5.desc:0 "[From.GetAdjective]ий уряд повідомив нам, що їхні моряки нізащо не будуть служити під командуванням офіцерів іншої країни. Вони хочуть допомагати нам, але не мають наміру втрачати незалежність."
 mtg_generic.1.title:0 "[From.GetName] насильно змінює уряд"
 mtg_netherlands.22.d:0 "Представники уряду у вигнанні повідомили нам, що він переїжджає до Батавії і відтепер керує колоніями безпосередньо звідти. Наших послуг більше не потребують."
 mtg_netherlands.6.b:0 "Що ж, у жодному разі вони не дістануться венесуельцям!"
 mtg_netherlands.67.t:0 "[GER.GetName] домінує в [HOL.GetAdjective]их торгових переговорах"
 mtg_news.12.d:0 "Вони грають з вогнем..."
 mtg_news.22.b:0 "Наші фланги захищені."
 mtg_news.23.t:0 "У державі [From.GetName] формуються загони чорносорочників"
 mtg_news.27.c:0 "Ми маємо об'єднатися проти британців."
 mtg_news.3.f:0 "Нейтралітет має бути підтриманий силою."
 mtg_news.37.b:0 "Нам треба ухвалити рішення..."
 mtg_news.59.t:0 "Помер король Георг VI"
 mtg_usa_civil_war_democrats.10.desc:0 "Минулої ночі на збройове сховище армії США у віддаленій частині штату [GETUSASTATE] невідомими особами було скоєно збройний напад. Невелика група напала на кількох охоронців і замкнула їх у караульній. що склади спустошені. Схоже, під покровом ночі злочинці вивезли велику кількість зброї в невідомому напрямку."
 mtg_usa_civil_war_democrats.23.t:0 "Східне узбережжя приєднується до повстанців"
 mtg_usa_civil_war_fascists.15.t:0 "Перенесення виробництва зброї"
 mtg_usa_civil_war_fascists.203.a:0 "Всі вони поголовно зрадники."
 mtg_usa_diplomatic_protest.2.b:0 "Скажіть президентові, щоби займався своїми справами."
 mtg_usa_diplomatic_protest.3.desc:0 "Посилаючись на небажання допускати кровопролиття, уряд лідера [From.GetLeader] погодився передати нам свої американські володіння. У Держдепартаменті точаться суперечки про те, чи надавати негайно цим територіям суверенітет чи зберегти їх під."
 mtg_usa_diplomatic_protest.3.t:0 "[From.GetNameDefCap] повертає території"
 mtg_usa_pacific_pacification.1.t:0 "[USA.GetNameDefCap] вимагає передачі колоніальних володінь"
 mtg_usa_secure_asia.4.a:0 "Нехай одержують, що їм треба."
 mtg_usa_strategic_interests.1.a:0 "Нехай одержують, що їм треба."
 mutiny_event.4.desc:0 "While the War Office is doing its best to keep the current mutiny in the army from becoming widely known, censoring letters can only go so far. Soldiers on leave quickly spread the word that the army is no longer willing to bleed needlessly in this war.\n\nWithout mentioning the mutiny specifically, [Root.GetLeader] announced today that the government would now consider any act that reflected a lack of commitment to the war to be treason.\n\nThe punishment for treason is well known, and public support for the mutineers has all but evaporated. News of this was, of course, widely spread. Seeing little support from the general population, the soldiers have quietly resumed their duties."
 mutiny_event.9.a:0 "This shouldn't work, should it?"
