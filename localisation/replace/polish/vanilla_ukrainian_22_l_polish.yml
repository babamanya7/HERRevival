 PERMISSION_HEADER:0 "$PERMISSION|UH$ права:"
 PER_BLITZKRIEG_DESC:0 "Іран стоїть на порозі турбулентного і невизначеного майбутнього. З початком війни в Європі Реза-шах Пехлеві із занепокоєнням спостерігає за тим, як він опиняється затиснутим між двома великими гравцями, які, схоже, виявляють зацікавленість у залученні до конфлікту в цілому.\n\nІранський суверенітет може опинитися під питанням, якщо будуть задіяні ресурси, і уряд шаха має бути готовим відбити будь-яке потенційне вторгнення. Питання в тому, чи зможуть вони вчасно мобілізуватися?"
 PER_GATHERING_STORM_DESC:0 "Раніше відома як Персія, велика країна Іран опинилася під перехресним вогнем гуркотливих гігантів. Поки нейтральний Іран швидко модернізується за допомогою Німецького Райху, колишні союзники у Великій Британії та Радянському Союзі дивляться на це з підозрою. Реза-шах Пехлеві відмовляється дозволити цим двом країнам зазіхати на іранський суверенітет, навіть якщо ризик вторгнення переважає.\n\nЧи буде дотриманий нейтралітет Ірану? Чи готові ми захистити свою батьківщину від зловмисних загарбників? Якщо все інше не спрацює, можливо, настав час звернутися до нашого минулого і відродити дух старої Перської імперії..."
 PER_appease_the_seperatists_desc:0 "Настав час виконати наші зобов'язання перед азербайджанським та курдським населенням, надавши їм більшу автономію над їхніми власними справами. Однак ми повинні наполегливо працювати, щоб утримати їх у нашій сфері впливу в інтересах нашої колективної безпеки."
 PER_brown_shirts:0 "Марші штурмовиків"
 PER_civil_unrest_tt:0 "§RПрийняття цього фокусу розпочне місію з відліком часу $PER_civil_unrest_category$§!"
 PER_communist_events.2.t:0 "Придушення Курдського руху за незалежність"
 PER_communist_events.20.desc:0 "Намагаючись протистояти зусиллям з детрибалізації та загальній вимозі більшої автономії, новостворена Демократична партія Курдистану офіційно попросила функціонувати як окрема Соціалістична Республіка в межах [SOU.GetNameDef]. Нам потрібно зробити вибір. Ми можемо або зберегти контроль над цим регіоном самі, або передати його [KUR.GetAdjective] народу."
 PER_communist_events.8.t:0 "[FROM.GetNameDefCap] блокує Перську затоку"
 PER_communist_events_1_tt:0 "Відмикає сукупність рішень §Y$PER_anti_gulf_decisions_cat$§! для придушення опору."
 PER_communist_gulf_hegemony:0 "Гегемонія в Перській затоці"
 PER_communist_liberate_pashtuns_desc:0 "З [AFG.GetNonIdeologyName], надійно закріпленою у нашій сфері впливу, ми можемо дестабілізувати прикордонні регіони [ENG.GetAdjective], просуваючи більший пуштунський націоналізм по всій території."
 PER_curtail_pan_arabism:0 "Обмежити панарабізм"
 PER_cyrus_initiative_desc:0 "Ініціатива Кіра — це наш новітній надсекретний проєкт з розробки вражаючої, руйнівної зброї, яку ми можемо використовувати на полі битви, щоб повністю знищити наших ворогів. Наші вчені вже розробили кілька цікавих конструкцій, про які, здається, жодна інша нація не думала, а це означає, що ми маємо хороші позиції, щоб здивувати наших опонентів у часи війни."
 PER_develop_oil_fields_desc:0 "На додаток до нашого вже існуючого великого комплексу з видобутку нафти, ми нещодавно виявили нові джерела чорного золота, готового до видобутку. Наші промислові міністри вважають, що створення нових нафтових вишок може призвести до потенціалу встановлення монополії на цей найцінніший ресурс."
 PER_donate_oil_fields_desc:0 "Після стільки часу надання нафти націям, як [ENG.GetNameDef], для нас було б вигідніше пожертвувати деякі наші об'єкти з видобутку [GER.GetNameDef] для допомоги в їхніх військових зусиллях. Сподіваємося, це принесе користь нам обом у довгостроковій перспективі."
 PER_elevate_the_iran_party:0 "Піднести Партію Ірану"
 PER_embrace_industrial_powers_bonus:0 "Прийняті індустріальні держави"
 PER_establish_cells:0 "Організувати опозицію в [FROM.GetName]"
 PER_establish_northern_buffer_states:0 "Створити північні буферні держави"
 PER_foreign_retraining_desc:0 "Наша нинішня армія погано навчена та дезорганізована. Щоб покращити якість наших сил, було б розумно інвестувати у приїзд іноземців до [PER.GetNonIdeologyName] для навчання наших військ. Це має швидко привести їх у хорошу форму для бою."
 PER_imperial_events.131.t:0 "[SOU.GetNameDefCap] приймає нашу пропозицію"
 PER_imperial_events.14.a:0 "Згуртувати наші війська!"
 PER_imperial_events.151.desc:0 "Чудова новина! [FROM.GetNameDefCap] погодився на наші вимоги миру та почав виводити свої війська з наших кордонів. Ми довго і наполегливо боролися, щоб утримати їх на відстані, і цей день слід святкувати роками!"
 PER_imperial_events.153.desc:0 "Сьогодні вранці ми отримали повідомлення від Військового кабінету про те, що наші союзники, які очолюють наступ проти [PER.GetNameDef], вимагають, щоб ми припинили воєнні дії до їхніх мирних переговорів з ворогом. Оскільки ми приєдналися до конфлікту, щоб допомогти [FROM.GetAdjective] уряду, продовжувати боротьбу не має сенсу."
 PER_imperial_events.190.a:0 "Ми можемо погодитися на ці умови"
 PER_imperial_events.210.a:0 "Поступитися територією..."
 PER_industrial_events.2.t:0 "[FROM.GetNameDefCap] приймає нашу торговельну пропозицію"
 PER_iran_party_dem_long:0 "Iran Party"
 PER_middle_east_protectorate_desc:0 "Після завершення війни ми змогли забезпечити деякі нації на території, що оточує [PER.GetNameDef]. Тепер наш обов'язок як їхніх сюзеренів — забезпечити їхній захист від будь-яких інших колишніх держав-загарбників. Якщо хтось захоче спробувати забрати ці землі у нас, ми хотіли б побачити, як вони спробують."
 PER_modern_cataphract_desc:0 "Катафракт був формою броньованої важкої кавалерії, яка виникла на наших землях у стародавні часи. Як Імперія Ахеменідів, так і Сасанідів використовували цих потужних коней на полі битви. Беручи їх за натхнення, ми повинні створити моторизованого бегемота, який вшановуватиме нашу історію кавалерійської війни."
 PER_modernize_iran_economy_desc:0 "За допомогою наших більш працьовитих друзів ми змогли модернізувати нашу поточну економіку. Оскільки фабричні цехи гудуть, а наш народ наполегливо працює, ми незабаром станемо поруч з іншими великими націями цього світу як промисловий центр сили."
 PER_motorize_infantry_desc:0 "Ми повинні випереджати час, і для цього вкрай важливо механізувати наші регулярні війська, щоб вони могли мчати по полю битви поруч із нашими танками, захищені та готові сіяти хаос."
 PER_neutral_shortcut:0 "Політика:\nДинастія Пехлеві"
 PER_one_for_all_all_for_one_desc:0 "Кожен [PER.GetAdjective] має бути повністю навчений володінню зброєю та готовий захищати свій народ, якщо настане час. Ніхто не звільняється від цього обов'язку, єдиний шанс вижити у «Великій грі» та зберегти нашу іранську ідентичність — це розпочати мобілізацію зі швидкістю, за якою [ENG.GetNameDefCap] та [SOU.GetNameDef] не зможуть встигати."
 PER_open_abadan_desc:0 "Технічна освіта допоможе нам стати серед індустріальних гігантів світу, і відкривши цю нову технічну школу, ми можемо надати освітні можливості для тих, хто хоче працювати в цих галузях. Це має допомогти нам розпочати наш розвиток та процес модернізації."
 PER_our_own_artillery:0 "Побудувати власну артилерію"
 PER_qajar_dynasty_party_long:0 "Династія Каджарів"
 PER_state_atheism:0 "Повна секуляризація"
 PER_trans_iranian_railway:0 "Трансіранська залізниця"
 PER_vanguard_template_tt:0 "Створює §YШаблон артилерійської дивізії§!."
 PER_viceroyalty_of_iran:0 "Віцекоролівство Іран"
 PER_war_plan_cambyses:0 "Військовий план «Камбіз»"
 PHI_fascism_party:0 "Ганап"
 PHI_i_shall_return:0 "Я повернуся"
 PHI_investment_plan_2:0 "Інвестиційний план 2: Встановлення нових торговельних відносин"
 PHI_manila_tag_war_fascism_DEF:0 "$PHI_manila_tag_fascism_DEF$"
 PHI_maphilindo_tag_neutrality_ADJ:0 "Малайськ"
 PHI_maritime_communism:0 "Морський комунізм"
 PHI_polynesia_tag_war_communism:0 "$PHI_polynesia_tag_communism$"
 PHI_reconquista_desc:0 "Від гір Лусона до джунглів Мінданао наш народ стікав кров'ю і терпів під окупацією. Тепер настав час повернути нашу землю, місто за містом, острів за островом. Подібно до того, як наші пращури чинили опір конкістадорам, ми зараз боремося, щоб вигнати загарбника і відновити нашу націю. Це наша Реконкіста — остання битва за Філіппіни."
 PHI_smugglers:0 "Контрабандисти"
 PHI_subsidies:0 "Субсидії"
 PHI_uncouple_the_peso_and_dollar_desc:0 "Прив'язка песо до долара добре спрацювала для нас, забезпечивши необхідний рівень стабільності нашої валюти. Однак з наближенням незалежності нам потрібно роз'єднати їх, щоб ми могли мати більше контролю та гнучкості в нашій грошовій системі, застосовуючи такі інструменти, як кількісне пом'якшення, де це необхідно."
 PHI_usa_focus_done_T1_alt_tt:0 "Завершено принаймні один із фокусів: §Y$PHI_declare_military_emergency$§!, §YПрив'язати песо до долара§!, §YПро-хасендадос§! або §YЗакон про громадянство§!."
 PIERCING_THRESHOLD_TO_DAMAGE_LOWEST:0 "§R< $THRESHOLD|%0$§! пробито = $DAMAGE|%R0$ шкоди"
 PLANNING_SPEED_COHESION_IMMOBILE_FACTOR:0 "Згуртованість ($PLAN_COHESION_IMMOBILE_TITLE$): x $FACTOR|R$"
 PLAN_VALUE_STRAIT:0 "Протока: $VAL|0+%$"
 PLAYER_AI_PREFS_OPTION3_TITLE:0 "Намагатися якнайшвидше досягти миру"
 PLAYER_REMOVED_TITLE:0 "$PLAYER$ покидає гру"
 PLAYTHROUGH_STATS_LOCKED:0 "Недоступно в режимі спостерігача"
 PLU_DEF:0 "Палау"
 POLITICS_GOAL_NOREWARD:0 "§TЖодного ефекту.§!"
 POLITICS_GOAL_SUCCEEDED_DESC:0 "$NAME|H$"
 POLITICS_NO_IDEAS_FOR_COUNTRY:0 "У Вашої держави нема ідей $GROUP|H$"
 POL_GATHERING_STORM_DESC:0 "Польща нарешті знову незалежна після століть поділу польського народу поміж трьома імперіями. Її позиція, однак, не зовсім стабільна.\n\nНа сході знаходиться Радянський Союз, і він не забув ганебну поразку в Польсько-радянській війні.\n\nНа заході знаходиться Німеччина, і її фюрер Адольф Гітлер не приховує свого бажання розширити «життєвий простір» Німеччини — і колишні німецькі території під контролем Польщі стануть першим кроком для досягнення його мети."
