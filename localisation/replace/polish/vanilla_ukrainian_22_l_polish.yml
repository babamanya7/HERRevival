 news.252.a:0 "Так змінюється світ..."
 news.261.desc:0 "Британський парламент з невеликою перевагою голосів ухвалив рішення, яке докорінно реорганізує частину британських колоній в Африці. Новий закон фактично створює два нових колоніальних режими в Родезії та Кенії. Ці нові держави матимуть певну міру свободи в управлінні власними справами, але також будуть зобов'язані забезпечувати власну оборону.\n\nДеякі консерватори, які виступали проти цього рішення, відкрито висловлювали побоювання, що це рішення є лише першим кроком у процесі, який вони називають «деколонізацією».\n\n[ENG.GetLeader] не був одразу доступний для коментарів."
 news.264.desc:0 "Члени-засновники [SAF.GetFactionName] зібралися в Преторії, щоб оголосити про створення свого нового альянсу. Європейські спостерігачі швидко помітили, що єдиним легітимним урядом, який був присутній, був уряд держави [SAF.GetNameDef], [SAF.GetLeader], який головував на строкатому зібранні самопроголошених урядів у вигнанні та інших революційних груп.\n\nПрисутні сторони випустили спільну декларацію, в якій закликали європейські імперські держави негайно звільнити всі землі, які вони утримують в Африці, і віддати їх законним власникам, засудили практику колоніалізму і присягнулися принести свободу пригнобленим африканським народам, використовуючи для цього всі можливі засоби."
 news.280.a:0 "Чудово."
 news.285.t:0 "Пакистан вільний"
