 denmark_overlord_events.41.a:0 "Усе йде за планом"
 denmark_overlord_events.6.desc:0 "Судячи з усього, [FROM.GetLeader] не хоче влаштовувати скандал через те, що ми відмовилися вибачитися за коротку, але доречну відповідь нашого короля на вітальну телеграму."
 denmark_overlord_events.7.desc:0 "На жаль, [FROM.GetLeader] не бажає прислухатися до голосу розуму. У результаті цієї безглуздої ситуації, що отримала назву телеграмна криза, нам насаджують нові драконівські закони."
 denmark_political_events.9.t:0 "Демократичний прем'єр-міністр"
 denmark_protection_event.1.t:0 "[FROM.GetNameDefCap] пропонує пакт про ненапад"
 denmark_protection_event.4.desc:0 "Ми отримали новини з держави [FROM.GetNameDef]. Вони хочуть збільшити обсяги торгівлі між нашими країнами. Якщо ми погодимося, то зробимо крок до зближення з [FROM.GetAdjective]ою нацією."
 denmark_resistance_event.2.t:0 "[FROM.GetNameDefCap] погоджується підтримувати нас"
 denmark_resistance_event.24.desc:0 "[FROM.GetNameDefCap] проявляє мудрість і погоджується продати нам частину своїх старих есмінців. Ці есмінці потрібно приховувати від держави [?DEN.DEN_overlord_nation.GetNameDef] і вводити в стрій, тільки коли настане час завдати удару."
