 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI_DESC:0 "Adela Pankhurst-Walsh leads Australia with an initial goal of expanding the British Empire ever further, though precisely who will inherit that expanded empire remains an open question."
 RULE_OPTION_BRA_COMMUNIST_STALINISM:0 "Комунізм: Луїс Карлус Пресчіс"
