 ITA_combined_research_effort_desc:0 "Технологічний прогрес має важливе значення, якщо ми хочемо, щоби наші збройні сили мали сучасне обладнання, з яким зможуть протистояти нашим ворогам. Ми мусимо співпрацювати з нашими союзниками, щоби забезпечити постійний науковий прогрес, особливо у військовій галузі."
