 form_ottoman_empire_category_desc:0 "Силою зброї нам вдалося відшкодувати втрати, яких ми зазнали внаслідок нашої слабкості у Великій війні. Щоби відзначити цю історичну подію, ніщо не буде краще, ніж проголошення відновлення Османської імперії."
