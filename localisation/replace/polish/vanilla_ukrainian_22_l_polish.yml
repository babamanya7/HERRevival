 SOV_bring_old_trotskyists_back_effect_tt:0 "§Y$SOV_karl_radek$§! і §Y$SOV_yevgeny_preobrazhensky$§! стануть доступні як радники."
 SOV_build_national_academy_of_sciences_integrated_republic_GEO:0 "Збудувати [GEO.GetAdjective]у $SOV_build_national_academy_of_sciences_integrated_republic_default$"
 SOV_build_national_academy_of_sciences_integrated_republic_LIT_desc:0 "Ми збудуємо [LIT.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_build_national_academy_of_sciences_integrated_republic_TAN_desc:0 "Ми збудуємо [TAN.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_claim_on_sinkiang_desc:0 "Під владою товариша Шена Шицая Сіньцзян вже по суті є радянською маріонетковою державою. Ми мусимо зробити це офіційно..."
 SOV_comecon_industrialization_program_desc:0 "Ми проведемо програму індустріалізації в державі [FROM.GetNameDef] для прискорення будівництва нових вітчизняних промисловості й інфраструктури."
 SOV_concessions_germany_baku_SCW_desc:0 "[GER.GetNameDefCap] відчайдушно потребують нафти для власного військового будівництва. Пообіцявши їм ексклюзивні права на наші нафтові родовища після війни, вони повинні бути більш ніж готові допомогти нам."
 SOV_cooperation_against_stalin_other_tt:0 "Нові радники стануть доступні."
 SOV_cv_nav_bomber_equipment_3_short:0 "Ил-6 (П)"
 SOV_diplomacy_balkan_decision_category:0 "Балканська дипломатія"
 SOV_dismantle_the_zemsky_sobor:0 "Розпустити Земський собор"
