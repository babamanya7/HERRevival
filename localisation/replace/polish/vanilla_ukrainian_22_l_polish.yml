 ROM_change_sides_to_allies_desc:0 "Зміни в нашому уряді зажадали змін у нашому ставленні до війни. Приєднавшись до Союзників, наші сьогоднішні \"товариші\" у глобальному конфлікті будуть чимало здивовані, коли румунські кулі знайдуть нову мету."
 ROM_claim_vojvodina:0 "Претендувати на область [45.GetName]"
 ROM_constitutional_guarantees_desc:0 "Конституційні зміни, запроваджені Королем, мають бути скасовані, і мають бути запроваджені гарантії та баланси, щоб це не повторилося. Інакше нам залишається лише знущання над демократією."
