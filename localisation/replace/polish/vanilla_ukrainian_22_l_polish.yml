 PRC_light_tank_destroyer_equipment_2:0 "PTZ 36"
 PRC_marxist_orthodoxy_desc:0 "Ключ до побудови справжнього комунізму — це втілити в життя вчення Маркса настільки, наскільки можливим."
 PRC_mobilization_of_the_people_desc:0 "У часи кризи народ повстане.\n\nМи створимо загони ополчення на чолі з ветеранами Великого походу, а також наберемо та озброїмо місцеве населення."
 PRC_promote_paper_bills:0 "Просувати паперові банкноти"
 PRC_reclaim_tibet_desc:0 "Нестабільність у Китаї дозволила [TIB.GetNameDef] відокремитися від китайського правління, але історичні зв'язки між нашими націями не можна ігнорувати. Ми повинні прагнути возз'єднатися з ними, щоб наш кордон знову міг сягнути Гімалаїв."
