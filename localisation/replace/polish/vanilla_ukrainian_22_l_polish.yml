 DOD_hungary.11.t:0 "Богемія повертається до імперії"
 DOD_hungary.113.t:0 "Румунія пропонує компромісний варіант"
 DOD_hungary.116.desc_bessarabia:0 "Вислухавши нашу делегацію, [SOV.GetLeader] пропонує нам свого роду компроміс. Радянці готові залишити нам Трансільванію, якщо ми погодимося віддати їм Бессарабію. Угорська сторона при цьому не з'явилася на переговори."
 DOD_hungary.150.a:0 "Невеликий легкий перехоплювач."
 DOD_hungary.170.t:0 "Договір припинив дію"
 DOD_hungary.22.a:0 "Чудово."
 DOD_hungary.31.desc:0 "[HUN.GetLeader] та уряд країни здобули велику політичну перемогу — [From.GetNameDef] ратифікує переглянутий варіант Тріанонського договору. Тепер ми знову можемо вести набір на військову службу та відкрито виділяти кошти на будівництво військових заводів."
 DOD_hungary.32.b:0 "Звернутися по допомогу до Франції."
 DOD_hungary.90.t:0 "[HUN.GetNameDefCap] вимагає область [45.GetName]"
 DOD_hungary.91.t:0 "[FROM.GetNameDefCap] передає Воєводину"
 DOD_hungary.92.e:0 "Ми вирішимо це питання самі."
 DOD_romania.111.a:0 "Потрібно надіслати повідомлення."
 DOD_romania.16.a:0 "Ласкаво просимо, [FROM.GetAdjective] друзі!"
 DOD_romania.53.b:0 "Ми неодмінно переможемо. Зброя до бою!"
 DOD_romania.70.a:0 "Чергова перемога дипломатії."
 DOD_romania.82.desc:0 "Відомий соціолог випустив нову книгу, в якій докладно розповів про те, який вплив має близьке оточення короля на прийняті ним рішення. Більшість цих рішень у результаті приносять зиск цьому вузькому колу осіб. Особлива увага в книзі приділена коханці короля, яка, за чутками, добре нажилася, використовуючи свої зв'язки. Король наказав заарештувати автора книги.\n\nЛіберальна преса та ультраправі однаково обурені, але з різних причин. Ми мусимо опублікувати заяву з цього приводу, доки ситуація не вийшла з-під контролю."
 DOD_romania.84.desc:0 "Французька преса на всі лади обговорює паризькі пригоди Магди Лупеску, яка влаштувала загул по місцевих магазинах.\n\nСаме по собі це повсякденне явище, але, як стверджує національна преса, вона доручила доставку своїх покупок співробітникам і говорила продавцям у магазинах, що за все заплатить уряд Румунії. Нас попросили прокоментувати ці чутки."
 DOD_yugoslavia.184.d:0 "Напруга між [This.GetAdjective]им урядом і селянами досягла межі. Багато мілітаристів лівого спрямування по всій країні беруть до рук зброю, отриману, як вважається, з держави [From.GetNameDef]. Селяни тепер вимагають, щоб [This.GetLeader] залишив свою посаду народу, яку він, за його ж твердженням, представляє. У їхніх вимогах відчувається неявна загроза: у разі відмови селяни візьмуть зброю і воюватимуть за уряд, який проповідує нову ідеологію — [From.GetRulingIdeology]."
 DOD_yugoslavia.36.t:0 "Доля Югославії"
