 ENG_narvik_crisis_blow_up_mines:0 "Диверсія [SWE.GetAdjective]их копалень"
 ENG_propaganda_campaigns_in_british_raj_desc:0 "Ми запустимо потужну кампанію пропаганди, щоби розповісти народу Індії про некомпетентність його уряду та необхідність керівної ролі Британії."
 ENG_reclaim_burma_desc:0 "Короткий період незалежності держави [BRM.GetName] мусить тепер закінчитися. Наші війська зайняли позиції, готові повернути країну її законному володарю."
 ENG_self_government_for_africa:0 "Самоврядування в Африці"
 ENG_self_government_for_asia:0 "Самоврядування в Азії"
 ENG_submarine_3_desc:0 "Підводні човни класу «U» були малими підводними човнами, побудованими відповідно до програм надзвичайного стану війни 1940 і 1941 років. Спочатку розроблені як навчальні підводні човни, коли почалася війна, конструкція змінилася, що дозволило цим підводним човнам виявитися корисними в закритих водах Північного та Середземного морів. Через менші розміри їх радіус дії та озброєння були обмежені. Три підкласи склали клас: «Undine», «Umpire» і «Uproar»."
 ENG_suppress_imperialist_coup_in_new_zealand:0 "Придушити імперіалістичне повстання"
 ENG_trade_unions_demand_referendum_tt:0 "Знов дозволяє приймати закони, що збільшують масштаб призову.\n"
 ENG_trade_unions_demand_workplace_safety_legislation_desc:0 "Щоб виконати вимоги профспілок, ми ухвалимо нові закони про охорону праці, які захистять робітників за рахунок деякого зниження продуктивності."
