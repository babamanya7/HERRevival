 SWE_karnvapenprogram_air_bonus:0 "Повітряний бонус за програму ядерної зброї"
 SWE_king_in_council_desc:0 "Коли король Густав зійшов на престол, він мав велику владу над [SWE.GetAdjective]ою політикою. Під час його правління його влада була принижена ідеалістичними політиками з утопічним баченням демократії. Цей неприродний стан речей треба скасувати шляхом відновлення стародавніх повноважень короля."
 SWE_lynx_armored_car_tt:0 "Вмикає §YLynx Armored Car§!, що дає:\n§YArmored Car§! і §Y$armored_car_recon$§!:\n Потужна атака: §G+10%§!\n Прорив: §G+10%§!\n Організація: §G+5§!\n\n§YБроньована атака§!:\n§YЛіс:§!\n Ефективна зміна руху: §G+15%§!\n Ефективна зміна атаки: §G+20%§!\n§YПустеля:§!\n Ефективна зміна руху: §R-40%§!\n Ефективна зміна атаки: §R-20%§!\n§YСніг:§!\n Ефективна зміна руху : §G+35%§!\n Ефективна зміна атаки: §G+20%§!"
