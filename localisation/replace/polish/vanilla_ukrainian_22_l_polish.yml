 wtt_britain.25.b:0 "Ми ніколи не дозволимо іншій країні забрати наш флот!"
 wtt_britain.27.t:0 "Французи відхиляють ультиматум"
 wtt_britain_lease_azores.1.desc:0 "[From.GetAdjective]ий уряд звернувся до нас із проханням надати на час війни Азорські острови. Стратегічне становище робить їх важливою базою охорони морських шляхів через Атлантику. Острови будуть повернуті після закінчення військових дій."
 wtt_burma_road.2.desc_war_with_from:0 "[From.GetAdjective]і сили внаслідок стрімкого наступу змогли зайняти кілька важливих мостів та переправ. Дорога тепер закрита для будь-якого транспорту, і ми не зможемо отримувати постачання по ній."
 wtt_china_shared.14.a:0 "Вони боягузи, дурні, чи все в купі?"
 wtt_germany.27.d:0 "Минулої ночі мирно, вві сні, помер наш найславетніший фельдмаршал Август фон Макензен. Його заслуги у Великій війні та у справі вигнання фашистських гнобителів з нашої країни назавжди залишаться у пам'яті. Роль лідера нації після смерті фельдмаршала перейде до сина вигнаного кайзера, Фрідріха Вільгельма, який після коронації іменуватиметься Вільгельмом III і стане першим кайзером після зречення його батька в 1918 році."
 wtt_germany.42.t:0 "Німеччина відмовляється від переговорів щодо Ціндао"
 wtt_germany.54.desc:0 "Уряд Німеччини звернувся до нас із пропозицією об'єднатися, якщо того забажає австрійський народ. Для цього воно радить провести референдум."
 wtt_germany.65.a:0 "Вони мають рацію — ми мусимо приєднатися до їхньої війни."
 wtt_infiltration.24.t:0 "З комуністичною загрозою покінчено?"
 wtt_japan.101.b:0 "Ми приймемо Маньчжурію, але їхню доброзичливість."
 wtt_japan.104.t:0 "Суверенітет Філіппін"
 wtt_japan.116.desc:0 "Держава [From.GetNameDef] вирішила приєднатися до нашої війни з Радянським Союзом, незважаючи на укладений із ним пакт про ненапад."
 wtt_japan.41.a:0 "Як мило з їхнього боку."
 wtt_news.10.t:0 "Радянці збільшують темпи військової розбудови"
 wtt_news.15.desc:0 "У відповідь на інтенсивну протидію французів рішенню повернути кайзера Вільгельма II уряд Німеччини запропонував піти на компроміс. Вільгельм II продовжить жити у вигнанні, але на німецький трон під ім'ям Вільгельма III піде його син.\n\n[FRA.GetNameDef] ухвалила цю пропозицію, завдяки чому можна сподіватися на збереження миру між провідними європейськими державами."
 wtt_news.16.c:0 "Ми забрали його раніше, і можемо зробити знову!"
 wtt_news.27.t:0 "Молоді японські офіцери здійснюють переворот"
 wtt_news.35.c:0 "Війна у повітрі."
 wtt_news.35.t:0 "Шанхайський інцидент"
 wtt_news.4.a:0 "Ніхто не зупинить Німецьку імперію!"
 wtt_news.40.desc_eng:0 "У відповідь на наближення ворожих сил до Суецького каналу, щоби не ризикувати цим важливим торговим шляхом, держава [From.GetNameDef] вирішила зруйнувати канал, скориставшися затопленими суднами, підривними зарядами та мінами. Пошкодження досить великі, і швидше за все, відновні роботи займуть місяці."
 wtt_news.47.d:0 "Не змушуйте нас заходити туди!"
 wtt_news.5.b:0 "Хай живе король!"
 wtt_news.64.desc:0 "[From.GetOldAdjective]а військова машина продовжує свій незламний наступ, і ідея, яку раніше зустрічали лише глузуванням — створення нової Римської імперії — здається тепер цілком можливою. Більшість провідних європейських країн, які могли б чинити опір, практично розчавлені, і тепер Італія може навязати свою волю підкореним народам.\n\nПриступивши до інтеграції про «відвойованих римських територій», італійський уряд заодно заявив і про відродження Римської імперії, офіційно закріпивши нове ім'я для своєї країни: «[From.GetNameDef]»."
 wtt_political_warlord_support.13.a:0 "Незначна жертва."
 wtt_political_warlord_support.23.desc:0 "Прибула група офіцерів, яку лідер [From.GetLeader] відправив до нас, щоби допомогти реформувати наші збройні сили. Група охоплює широкий спектр фахівців від досвідчених командирів піхоти до артилеристів та офіцерів штабу.\n\nКерівник гурту передав нам офіційне послання від лідера [From.GetLeader] з нагадуванням, щоби ми виконали свої обіцянки щодо цієї угоди."
 wtt_prc.32.desc:0 "Ми успішно оточили та знищили японський патруль у державі [JAP.GetManchuriaPuppet]. Тіла солдатів були залишені на місці, щоб імперіалісти зрозуміли натяк.\n\nЧас покаже, чи це буде достатньою причиною, щоб вони оголосили війну."
 wtt_warlord_vs_prc.34.a:0 "То [From.GetLeader.GetSheHe] хоче випробувати нас?"
 wuw_GER_diplomacy.10.b:0 "Це неприйнятно!"
 wuw_GER_diplomacy.108.a:0 "Чудово"
 wuw_GER_diplomacy.21.desc:0 "Наше військове командування спільно з досвідченими дипломатами змогли переконати [FROM.GetLeader]а та [FROM.GetAdjective]ий уряд приєднатися до нас у боротьбі проти наших спільних ворогів. Нам, звісно, не обов’язково потрібна їхня допомога, але їхні солдати послужать гарматним м’ясом, поки наші війська будуть знищувати супротив."
 wuw_GER_diplomacy.22.desc:0 "Попри наші зусилля та очевидні переваги для [FROM.GetNameDef] від приєднання до нас, [FROM.GetLeader] та [FROM.GetAdjective]ий уряд ухвалили помилкове рішення відмовитися від нашого запрошення. Це, звісно, мало що змінює для нас — запрошення було радше для їхньої користі."
 wuw_GER_diplomacy.23.a:0 "[FROM.GetAdjective]и наводять переконливі аргументи"
 wuw_GER_diplomacy.23.desc:0 "[FROM.GetLeader], лідер [FROM.GetAdjective], звернувся до нас із пропозицією, яку [FROM.GetLeader.GetSheHe] називає взаємовигідною. В обмін на повернення колишніх колоній [FROM.GetLeader.GetSheHe] обіцяє поділитися знаннями з виробництва танків і гарантує мир між нашими державами."
 wuw_GER_diplomacy.24.desc:0 "Ми отримали чудову новину від [FROM.GetNameDef]. Вони побачили переваги в нашій угоді та передали нам контроль над усіма нашими колишніми колоніями, які перебували під їхнім управлінням."
 wuw_GER_diplomacy.54.desc:0 "[FROM.GetLeader] виявився далекоглядним лідером, що дбає про свою державу. Це також збігається з нашими інтересами. Ми добре використаємо ресурси з [FROM.GetName]."
 wuw_GER_diplomacy.60.t:0 "[FROM.GetNameDefCap] вимагає Північний Шлезвіг"
 wuw_GER_diplomacy.62.b:0 "Можливо, не варто загострювати..."
 wuw_GER_diplomacy.72.b:0 "Ми не купимось на це!"
 wuw_GER_diplomacy.74.desc:0 "Наших агентів у [FROM.GetNameDef] виявили. Ми отримали суворе попередження про негайне припинення діяльності. Очевидно, [FROM.GetLeader] — ворог трудящих."
 wuw_GER_diplomacy.80.desc:0 "[FROM.GetAdjective] уряд здійснив значні інвестиції в нашу промисловість. Вони презентують це як взаємовигідну угоду — ми отримаємо розвиток, а вони — доступ до нових потужностей."
 wuw_GER_diplomacy.91.desc:0 "[FROM.GetAdjective] уряд повідомив, що хоче слідувати нашій політичній лінії. Це шанс посилити вплив у їхній верхівці."
 wuw_GER_diplomacy.94.a:0 "Уперті [FROM.GetAdjective]и..."
 wuw_GER_diplomacy.99.desc:0 "[FROM.GetAdjective]и прийняли нашу пропозицію! Тепер ми матимемо доступ до їхніх напрацювань, як і вони — до наших. Це значно покращить нашу промисловість."
 wuw_GER_legions.1.b:0 "Нам вони не потрібні"
 wuw_GER_legions.3.b:0 "Місцеві колаборанти нам не потрібні"
 wuw_GER_legions.8.t:0 "Пропозиція від незадоволених козаків"
 wuw_GER_military_events.2.a:0 "Нехай живе, але це не повинно повторитись!"
 wuw_GER_monroe.11.t:0 "[FROM.GetNameDefCap] Частково скасовує Доктрину Монро"
 wuw_GER_monroe.2.b:0 "Гарантуємо лише тих, хто залишився вірним"
 wuw_GER_monroe.2.c:0 "Якщо хотіли гарантій — мали б втрутитись раніше"
 wuw_GER_mutual_guarantees.1.a:0 "Це взаємовигідна угода"
 wuw_GER_realpolitik.13.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб ми підкорилися їхній владі й стали їхньою державою-клієнтом, заявляючи, що це потрібно для нашого захисту від [SOV.GetAdjective] загрози. Чи підкоримося ми?"
 wuw_GER_realpolitik.16.a:0 "Для нас це кінець"
 wuw_GER_realpolitik.43.a:0 "Чудово"
 wuw_GER_realpolitik.46.a:0 "Ми не можемо битися з обома..."
 wuw_GER_realpolitik.48.a:0 "Ми повернемо своє!"
 wuw_GER_realpolitik.57.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] пішов далі, ніж обіцяв спочатку, маніпулюючи ринками, щоб ще більше посилити нашу залежність від їхньої економіки. Якщо ми не розірвемо з ними зв’язки негайно — це буде кінець нашої незалежності. Як нам діяти?"
 wuw_GER_reichskommissariats.14.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Іберії, нам слід визначити не лише її призначення, а й те, хто очолить місцеве населення та забезпечить виконання нашої політики. Чи слід нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще використати місцевого колаборанта?"
 wuw_GER_reichskommissariats.16.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.21.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.25.t:0 "Керівництво Великого Індостану"
 wuw_GER_releasable.2.d:0 "Народ повинен протестувати проти таких очевидно сфальсифікованих виборів!"
 wuw_GER_weltpolitik.1.b:0 "Ні, тепер це наші землі"
 wuw_GER_weltpolitik.19.desc:0 "Безрозсудний [FROM.GetLeader] нещодавно засудив наше, як він висловився, незаконне володіння [FROM.GetAdjective] Анголою. Тепер ми отримали ультиматум, а їхні війська скупчуються на нашому кордоні. Як нам відповісти?"
 wuw_HUN_a_habsburg_poland_desc:0 "Польські землі колись могли стати володінням Габсбургів. Настав час розширити володіння дому Габсбургів. Ми маємо звернутися до уряду Польщі з вимогою відновити королівство, коронуючи Карла Альбрехта."
 wuw_HUN_demand_carpathian_ruthenia:0 "Вимогти Карпатську Русь"
 wuw_HUN_embrace_navy_traditions_desc:0 "Не варто експериментувати з неперевіреними технологіями. Ми зосередимося на перевірених конструкціях з часів старої Імперії."
 wuw_HUN_expand_the_army:0 "Розширити Honvédség"
 wuw_HUN_hold_territorial_referendums_desc:0 "Після Великої війни багато угорських територій було забрано без жодного демократичного процесу. Ми повинні дипломатично звернутись до сусідів із проханням провести референдуми під міжнародним наглядом, аби люди самі вирішили, в якій країні хочуть жити."
 wuw_HUN_institute_corporatism_desc:0 "Щоб відновити нашу країну після руйнувань та принижень Великої війни та Тріанонського договору, ми повинні прийняти економічну модель Муссоліні та впровадити низку корпоративістських реформ."
 wuw_HUN_invest_in_universal_education:0 "Інвестувати в загальну освіту"
 wuw_HUN_invite_german_investors:0 "Запросити [GER.GetAdjective]их інвесторів"
 wuw_HUN_legacy_of_the_black_legion:0 "Спадщина Чорної армії"
 wuw_HUN_nationalize_key_industries:0 "Націоналізувати ключові галузі"
 wuw_HUN_news_events.2.b:0 "За велике майбутнє!"
 wuw_HUN_politicize_the_levente_associations_tt:0 "Коли почнеться §Y[ROOT.GetAdjective]а громадянська війна§!, §YАсоціації Левенте§! підтримають нас, і ми отримаємо додатково §G+8000§! людських ресурсів"
 wuw_HUN_purchase_burgenland_desc:0 "Регіон, який [AUS.GetAdjective]и називають Бургенландом, протягом століть був частиною [ROOT.GetAdjective] держави, допоки його не забрав у нас Тріанонський договір. Ми повинні звернутися до їхнього уряду з пропозицією — запропонувати велику суму грошей в обмін на цей регіон, адже їхня економіка перебуває в жахливому стані."
 wuw_HUN_reinstate_the_pragmatic_sanction_desc:0 "Прагматична санкція Карла VI дозволяла передавати престол Габсбургам по жіночій лінії та закріпила Угорщину як частину їх володінь. Після невдалої спроби перевороту Карла IV санкція була скасована. Ми повинні відновити її, незважаючи на спротив Малого Антанти."
 wuw_HUN_renew_the_rome_protocols:0 "Оновити Римські протоколи"
 wuw_HUN_renovato_imperii_tt:0 "Відкриває рішення для §YІнтеграції Імперських суб'єктів§! назад до держави, а також можливість §Yотримати ядра на землях старої Австро-Угорщини§!"
 wuw_HUN_restrict_voting_rights:0 "Обмежити виборчі права"
 wuw_HUN_revenge_for_the_romanian_humiliations:0 "Помста за приниження від Румунії"
 wuw_HUN_soviet_hungarian_military_academy_desc:0 "Без належного керівництва армія безсила. Ми співпрацюватимемо з радянськими інструкторами у створенні спільної військової академії для підготовки кращих офіцерів."
 wuw_HUN_strenghten_the_order_of_vitez_desc:0 "Орден Вітец, заснований у 1920 році, сьогодні очолює сам Міклош Горті. Ми можемо направити додаткові ресурси на підтримку командирів, що є членами ордену."
 wuw_HUN_support_for_our_finnish_brothers_tt:0 "Фінське керівництво має бути прихильне до нашого уряду"
 wuw_HUN_the_bulwark_against_the_west:0 "Форпост проти Заходу"
 wuw_HUN_the_march_on_budapest_desc:0 "Тепер, коли фашисти організовані та озброєні, ми можемо повести їх маршем до столиці з вимогою про відставку регента Міклоша Горті. Таким чином, Гьомбьош зможе зайняти своє законне місце як правитель країни, швидко відновити порядок і проголосити себе президентом Угорщини."
 wuw_HUN_the_turul_association:0 "Асоціація Турул"
 ww_BEL_event_diplomatic.20.t:0 "[FROM.GetNameDefCap] Запрошує нас до проєкту Європейської співпраці"
 ww_BEL_event_misc.1.desc:0 "Еміль Вандервельде, якого називали 'le patron' (бос), довгий час був соціалістичним політиком і прем'єр-міністром [BEL.GetName]. Він був відомий як член бельгійської делегації на Паризькій мирній конференції, яка завершила велику війну, а також став затятим противником фашизму, навіть закликаючи до прямого втручання в Іспанську громадянську війну на боці республіканців. \n\nАнрі де Ман став новим прем'єр-міністром і складе присягу королю сьогодні пізніше."
 ww_BEL_event_misc.1.t:0 "Бос помер"
 ww_BEL_event_political.6.c:0 "Бельгія визначається обома культурами, рівноцінно."
 ww_BEL_event_political.7.b:0 "Поль-Анрі Спаак та Лейбористська партія поведуть нас до нового соціалістичного майбутнього."
 ww_BEL_event_spanish_interaction.6.b:0 "Ми цінуємо їх підтримку, але ні."
 ww_BEL_event_war.6.desc:0 "Група бельгійських цивільних службовців звернулася до нас з пропозицією: дозволити їм продовжувати свою роботу в громадських органах, і вони забезпечать нормальне функціонування місцевого уряду в цей перехідний період. Бельгійський уряд прийняв законодавство, яке робить їхню співпрацю з нами законною, щоб зменшити вплив окупації на їхній народ. Вони навіть санкціонували бельгійські банки для продовження виплати заробітної плати цим адміністраторам. Це можливість для нас продемонструвати готовність працювати з місцевими, і це зменшить активний опір в регіоні."
 ww_congo.11.a:0 "Мудрий крок."
 ww_congo.17.d:0 "Після схвалення [BEL.GetAdjective] властями держави, новий прем'єр-міністр [COG.GetAdjective] Патріс Лумумба виголосив коротку промову, щоб відсвяткувати здобуту незалежність своєї країни. У ній звучить відверта критика колоніалізму і так званої «цивілізаційної місії [BEL.GetAdjective]». Хоча це було позитивно сприйнято всередині країни, багато хто за її межами інтерпретував це як особисту атаку на главу держави [BEL.GetAdjective]. Ера деколонізації тільки починається!"
 ww_congo.37.a:0 "Ми не віддамо свою територію."
 ww_congo.39.t:0 "Перші конголезькі вибори"
 ww_congo.48.a:0 "Він дасть нам легітимне право на Руанту, принаймні..."
 ww_congo.64.a:0 "Чудово!"
