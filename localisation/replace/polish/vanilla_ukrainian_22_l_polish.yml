 GER_hegemony_of_the_ss:0 "Гегемонія SS"
 GER_improve_national_spirit:0 "Укріплення національного духу"
 GER_improve_the_logistics_system_desc:0 "Забагато наших генералів у верховному командуванні зневажливо ставляться до логістики та ланок постачання, страждаючи від нерозуміння проблем нашої нинішньої системи. Вони мусять усвідомити першочергову важливість ефективної логістики в сучасній війні, оскільки ми розпочинаємо комплексну ініціативу з удосконалення нашої логістичної системи."
 GER_infantry_equipment_2_short:0 "MP 38"
 GER_influence_the_baltics:0 "Вплинути на Балтію"
 GER_influence_the_benelux_desc:0 "Країни Бенілюксу мають важливе значення для наших подальших військових зусиль, а також для їхнього промислового потенціалу і географічного положення. Хоча ми, ймовірно, могли б легко захопити їх, чому б замість цього не схилити їх на свій бік?"
 GER_inner_circle_event_pending_flag:0 " Очікується подія §YВнутрішнього кола§!.\n"
 GER_italy_ally:0 "Альянс із Італією"
 GER_italy_declined_assassination_tt:0 "§Y[ITA.GetNameWithFlag]§! не відхилила нашу пропозицію вбивства"
 GER_jet_tac_bomber_equipment_2_short:0 "Ar 234 'Blitz'"
 GER_labor_rights_and_union_stuff_desc:0 "Дозвіл працівникам створювати профспілки, аби спільно висловлювати свої потреби та регулювати умови праці, занадто довго ігнорувався. Настав час не лише дозволити, а й заохочувати утворення профспілок!"
 GER_land_cruiser_equipment_1_desc:0 "P.1000 Ratte — німецька концепція надважкого танка, розроблена під час Другої світової війни. Запропонований Krupp-ом у 1942 році, проєкт передбачав 1000-тонного броньованого звіра, озброєного двома 280-мм морськими гарматами, кількома додатковими гарматами та бронею товщиною до 360 мм. Ratte мав слугувати рухомою фортецею, здатною придушити всякий опір на полі бою. Однак через величезні розміри, високе споживання пального та логістичну непрактичність, проєкт був визнаний нездійсненним і врешті-решт був скасований у 1943 році."
 GER_light_tank_artillery_equipment_2:0 "Sd. Kfz. 124 Wespe"
 GER_light_tank_equipment_1_desc:0 "Panzer I був легким танком, виробленим у Німеччині в 1930-х роках. Розробка Panzer I почалася в 1932 році, а серійне виробництво почалося в 1934 році. PzKpfw I, призначений лише як навчальний танк для ознайомлення з концепцією бронетехнічного ведення німецької армії, широко використовувався в боях через брак більш сучасних танків."
 GER_medium_tank_destroyer_equipment_3:0 "Jagdpanther"
 GER_mega_reichskommissariats_desc:0 "Зважаючи на те, що райхскомісаріати виявилися дуже корисними, не дивно, що наш лідер, [ROOT.GetLeader], витрати[ROOT.GetLeader.GetVerbGendEndA_RU] багато часу на роздуми про подальші вдосконалення. Одною з проблем райхскомісаріатів є їхня зростаюча кількість, а разом із нею і зростаюча кількість адміністрування, необхідного для управління ними. Деякі з них напевне можна було б об'єднати..."
