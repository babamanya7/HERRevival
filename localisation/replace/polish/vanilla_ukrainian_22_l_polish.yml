 AFG_construct_mio_in_progress:0 "Триває створення ВПК"
 AFG_contact_amanullah_loyalists_desc:0 "Колишній король, $AFG_amunullah_khan$, ніколи формально не поступався троном наступнику, коли був несправедливо усунений натовпом. Тому ми повинні згуртувати тих у [AFG.GetNonIdeologyName], хто залишається вірним королю, та підготуватися до його неминучого повернення."
 AFG_empire_core_state:0 "Інтегрувати §Y[FROM.GetName]§! до Імперії"
 AFG_enforce_western_attire:0 "Запровадити західний одяг"
 AFG_expand_academy:0 "Розширити Військову академію"
 AFG_forge_a_national_identity_desc:0 "Наш народ не вважає себе афганцями, а скоріше частиною своїх окремих племен та національностей. Ми повинні прагнути запровадити пушту та дарі як національні мови, і, можливо, одного дня ми зможемо об'єднати людей під єдиною афганською національною ідентичністю."
 AFG_increase_agricultural_exports:0 "Збільшити експорт сільськогосподарської продукції"
 AFG_industrial_events.16.t:0 "[FROM.GetAdjective] Нафтова концесія призупинена"
 AFG_industrial_events.30.t:0 "[FROM.GetNameDefCap] змінює русло річки Гільменд"
 AFG_industrial_events.59.t:0 "[FROM.GetNameDefCap] відхиляє мирні умови"
 AFG_kabul_conference_tt:0 "Відмикає рішення §Y$AFG_kabul_conference_category$§! для зменшення вартості заявки на цільові області в §YІндії, Центральній Азії, Ірані та Близькому Сході§! під час мирних конференцій, коли наша фракція переможе."
 AFG_kingdom_democratic_DEF:0 "Королівство Афганістан"
 AFG_militia_cavalry_desc:0 "[ROOT.GetNameDefCap] має низку порід коней, спеціально виведених для суворої місцевості країни. Вони можуть бути використані в кавалерійських бригадах, замість того, щоб інвестувати у дороге іноземне обладнання, яке схильне ламатися та вимагає великої підтримки."
 AFG_modern_economy:0 "Сучасна економіка"
 AFG_neutrality:0 "Афганістан"
 AFG_officer_training_desc:0 "[GER.GetAdjective] армія довела, що здатна протистояти [ENG.GetAdjective] або [SOU.GetAdjective] арміям. Ми повинні звернутися по підтримку до їхніх офіцерів у навчанні наступного покоління [ROOT.GetAdjective] солдатів."
 AFG_permit_axis_airbases:0 "Дозволити авіабази Осі"
 AFG_political_events.101.desc:0 "Уряд [FROM.GetNameDef] погодився передати контроль над визначеними територіями у Східному [PER.GetNonIdeologyName]. Ця передача дозволить нам створити буферну державу Хорасан, як і планувалося."
 AFG_political_events.12.desc:0 "[FROM.GetAdjective] уряд відхилив нашу пропозицію про створення конфедерації з наших двох націй. Це величезна зовнішньополітична невдача для нас і викликало тривогу щодо того, якими будуть наші довгострокові стосунки з [FROM.GetNameDef]."
 AFG_political_events.151.t:0 "[FROM.GetName] погоджується розширити договір"
 AFG_political_events.171.desc:0 "Сайїд Мір Мухаммад Алім-хан перебуває в Кабулі з того часу, як був вигнаний з Бухари Радами. З його коронацією як нового Еміра Афганістану, можливо, ми зможемо використати його претензії, щоб повернути Середню Азію від [SOV.GetAdjective] загрози."
 AFG_political_events.173.c:0 "Більше прогресивний $AFG_mohammed_daoud_khan$."
 AFG_political_events.20.desc:0 "Дипломати [FROM.GetNameDefCap] звернулися до нас з економічною пропозицією інвестувати в їхню економіку. Вони стверджують, що якщо ми розвиватимемо для них там галузі промисловості, ми отримаємо вигоду від будь-якого майбутнього експорту. Крім того, вони дали зрозуміти, що це, безсумнівно, засмутить [SOU.GetAdjective]s та [ENG.GetAdjective]s, які історично були ключовими гравцями в [FROM.GetNonIdeologyName]."
 AFG_political_events.30.b:0 "Ми — нація пуштунів понад усе"
 AFG_political_events.70.t:0 "[FROM.GetNonIdeologyName] відхиляє Лінію Дюранда"
 AFG_proclaim_a_new_caliphate:0 "Проголосити новий Халіфат"
 AFG_purchase_aircraft:0 "Придбати іноземні літаки"
 AFG_purchase_destroyers_desc:0 "Нам знадобляться десятиліття, щоб розвинути досвід та інфраструктуру для підтримки проєктування та будівництва сучасних військових кораблів. Набагато прагматичнішим підходом було б придбати законсервовані судна в інших націй та переобладнати їх для наших цілей."
 AFG_recruit_experts_and_officers:0 "Набрати експертів та офіцерів"
 AFG_rehabilitate_the_saqqawists:0 "Реабілітувати Саккавістів"
 AFG_shadows_of_the_emir_category:0 "$AFG_reinforce_the_royal_guard$"
 AFG_timurid_bureaucracy:0 "Тимуридська бюрократія"
 AFG_topple_iran_desc:0 "Під прозорливим керівництвом [ROOT.GetLeader], ми готові принести свободу та справедливість нашим [PER.GetAdjective] братам та сестрам, які довгий час страждали під деспотичним правлінням [PER.GetLeader]. Ми не лише забезпечимо наші кордони, але й розширимо наш вплив по всьому регіону."
 AFG_towards_an_amanullah_caliphate:0 "На шляху до Халіфату Аманулли"
 AFG_work_with_gestapo_desc:0 "На наших нещодавно придбаних територіях інакомислення та заворушення продовжують створювати значні виклики нашій владі. Щоб вирішити це, ми налагодили співпрацю з [GER.GetAdjective] розвідувальними службами. Їхній досвід у боротьбі з повстанцями та розвідувальними операціями буде безцінним для виявлення та нейтралізації повстанських фракцій."
 AGGRESSIVE_LOW_DESC:0 "Виконувати завдання лише коли авіакрила мають $VAL|%0Y$ боєздатності."
