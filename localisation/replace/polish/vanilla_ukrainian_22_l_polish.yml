 HABSBURG_call_the_imperial_diet_desc:0 "Нарешті настав час знову скликати імператорський сейм. Для нас, як для керівника цієї федерації, її бачення завжди було чітким. Нашою метою завжди була реінтеграція імперії, і настав час її реалізувати."
