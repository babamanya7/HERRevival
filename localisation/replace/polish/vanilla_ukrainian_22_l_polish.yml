 GRE_pay_back_debt_to_the_ifc_category:0 "Регулювання боргу перед МФК"
 GRE_put_the_king_under_house_arrest_desc:0 "Якщо ми не дамо Георгу II втручатися в хід грецької демократії, більш популярярні венізелісти виграють вибори."
 GRE_reviving_the_spartan_warrior_spirit_desc:0 "Кажуть, що в битві при Фермопілах чотири тисячі спартанців змогли вбити двадцять тисяч персів та перегородити Ксерксу подальший шлях до Греції. Сьогодні нам як ніколи потрібен подібний героїзм, щоб коли новоявлені завойовники підступлять до Афін і захочуть забрати наші будинки і наші життя, ми могли б вийти і сказати їм в обличчя: «Прийдіть і візьміть»."
 GRE_ship_torpedo_sub_3:0 "6 x 533-мм ТА з заряд. порш."
 GRE_soviet_subsidised_railways:0 "Радянські субсидії для будівництва залізниць"
 GRE_the_hellenic_air_force_desc:0 "Хоч наша Академія ВПС була заснована лише в 1930 році, грецький народ був пов'язаний із авіацією ще з часів Балканських воєн! Ми вже розуміємо важливість сильних військово-повітряних сил, і якби тільки у нас була можливість зробити свої ВПС потужнішими і більшими..."
