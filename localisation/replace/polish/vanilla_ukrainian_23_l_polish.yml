 SWE_cruiser_ship_engine_1:0 "«De Laval» 33 000 к. с. н. в."
 SWE_demand_demilitarization_of_finnish_border_desc:0 "У рамках наших планів реінтеграції для [FIN.GetName] ми повинні продовжувати розмивати їхній суверенітет, дозволяючи їм підтримувати надійний захист від [SOV.GetAdjective]ої держави на сході. Тому ми повинні наполягати на демілітаризації їхній кордон з нами, що ускладнює встановлення оборони, якщо нам знадобиться силове втручання в їхні справи."
 SWE_dp_ship_secondaries_4:0 "12cm/50 Bofors M42 DP"
 SWE_food_stamps:0 "[SWE_food_stamps_loc]"
 SWE_foreign_designs:0 "Вивчити проєкти іноземних літаків"
 SWE_implement_military_reforms_countdown:0 "Військові очікують збільшення бюджету"
 SWE_italian_ships_tt:0 "Приведе до [ROOT.GetFlag][ROOT.GetName]:\n "
 SWE_light_cruiser_4:0 "Клас «Tre Kronor»"
 SWE_lottakaren_desc:0 "Жінки [SWE.GetName] так само готові захищати націю, як і чоловіки. Фінансуючи організацію, яка залучає та навчає жінок виконувати неліфові завдання, ми можемо доповнити збройні сили та збільшити наші оборонні можливості."
 SWE_military_integration:0 "Інтеграція військових з [GER.GetNameDef]"
 SWE_modern_tank_equipment_1:0 "Strv 81"
 SWE_nordland_ger:0 "Райхспротекторат Нордланд"
 SWE_organize_a_putsch_desc:0 "Ми нарешті накопичили достатню підтримку серед [SWE.GetAdjective]ого народу, щоб ми могли захопити контроль над Ріксдагом. Безсумнівно, буде опір з боку оманливих демократів і соціалістів, які забули, що означає бути шведами, але ми маємо сили просто відмахнутися від них."
 SWE_per_albin_line_desc:0 "Узбережжя [SWE.GetName] величезне і майже не захищене. Щоб запобігти висадці сил вторгнення ворога на наші береги, нам потрібно створити лінію укріплених позицій уздовж узбережжя, які зможуть відбити їх назад у Балтію."
