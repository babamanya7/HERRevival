 mtg_britain.30.d:0 "[From.GetNameDefCap] пропонує укласти договір про невтручання, що дозволить нам діяти у своїх інтересах на континенті, якщо тільки ми не будемо звертати увагу на те, як британці діють щодо своєї імперії та щодо італійців."
 mtg_britain.34_tt:0 "Королівський флот повертається під наш контроль.\n"
 mtg_britain.44.d:0 "[From.GetAdjective] уряд проявив «поблажливість» до членів королівської сім'ї, вигнавши їх із країни. Вони прибули до нас і просять притулку."
 mtg_britain.50.a:0 "Зламаємо німців!"
 mtg_britain.50.d:0 "Держава [From.GetNameDefCap] прийняла нашу пропозицію і готова напасти на Німеччину."
 mtg_britain.52.a:0 "Вони наші товариші-комуністи і знаходяться на нашому боці."
 mtg_britain.7.d:0 "Нещодавня стаття в [GETUKPROKINGNEWSPAPER] наголошує на праві короля на щастя і стверджує, що якщо правила не дозволяють йому одружитися з розлученою, то, можливо, настав час ці правила модернізувати."
 mtg_britain.76.d:0 "Культурні відмінності між східною та західною частинами держави [PAK.GetName] загострили обстановку, і тепер Бангладеш відкрито повстав проти того, що його представники називають «утиском». Не схоже, щоби ми могли повернути собі контроль над цим регіоном, не проливаючи крові..."
 mtg_britain.81.t:0 "[From.GetName] відкидає вимоги"
 mtg_netherlands.14.a:0 "Якби більше людей поділяло її рішучість..."
 mtg_netherlands.15.a:0 "Відмінна думка."
 mtg_netherlands.27.a:0 "Тепер, коли США на нашому боці, навряд чи хтось посміє їм загрожувати."
 mtg_netherlands.28.t:0 "[From.GetNameDefCap] відхиляє прохання захистити Вест-Індію"
 mtg_netherlands.29.e:0 "Доведеться їм вирішувати це питання самим."
 mtg_netherlands.33_tt:0 "Ми отримаємо бонус до захисту дивізій на національній території протягом 180 днів після нападу провідної західноєвропейської держави.\n"
 mtg_netherlands.53.a:0 "Ми знали, що йдемо на ризик..."
 mtg_netherlands.56.a:0 "Його відважні вчинки цього разу не увінчалися успіхом."
 mtg_netherlands.59.t:0 "Дипломатичний скандал із державою [From.GetName]"
 mtg_netherlands.77.b:0 "Наш суверенітет понад усе. Заради співпраці ми готові на багато — але не на це."
 mtg_news.12.desc:0 "\n[HOL.GetAdjective] уряд успішно зберігає торговий нейтралітет, і на досаду як британців, так і німців, рішучість нідерландців лише посилюється під тиском, який надають [ENG.GetAdjective] і [GER.GetAdjective] уряду."
 mtg_news.15.a:0 "Майбутнє було неминуче, і ми вирішили не затягувати з ним."
 mtg_news.18.a:0 "Не можна чекати, поки вони стануть сильнішими."
 mtg_news.21.b:0 "Перевага на морі забезпечена."
 mtg_news.21.desc:0 "[ENG.GetAdjective] і [GER.GetAdjective] уряди уклали пакт про взаємну військову допомогу, а також висловили намір «поважати сфери інтересів один одного». Мало кого дивує такий стан справ після того, як держава [GER.GetNameDef] ясно позначило останнім часом свою про[ENG.GetAdjective] позицію, але саме формулювання договору застало багатьох експертів зненацька і навіть спонукало до тривожних роздумів про те, що це може означати для Європи."
 mtg_news.25.t:0 "Гібралтар повернуто націоналістичній Іспанії"
 mtg_news.28.d:0 "Британці натиснули на них."
 mtg_news.29.t:0 "[From.GetName] відкидає [ENG.GetAdjective]ий ультиматум"
 mtg_news.37.desc:0 "[From.GetAdjective] уряд оголосив іншим колоніальним державам ультиматум, в якому зажадав негайно залишити свої колонії і дати їм повну незалежність, як нещодавно надійшли самі британці. Також він продемонстрував готовність при необхідності підкріпити ці вимоги військовим в."
 mtg_news.40.b:0 "Нехай спробують."
 mtg_news.44.b:0 "Ми не дозволимо розколоти субконтинент надвоє!"
 mtg_news.48.b:0 "Дуже приємний сюрприз."
 mtg_news.5.b:0 "Якщо вони не виходитимуть за межі своєї сфери впливу."
 mtg_news.52.t:0 "[USA.GetName] захищають [From.GetAdjective]у Вест-Індію"
 mtg_news.54.a:0 "Ми стали ще сильнішими."
 mtg_news.6.c:0 "Революція марширує до своєї неминучої перемоги!"
 mtg_usa_civil_war_democrats.1.t:0 "Протести у столиці"
 mtg_usa_civil_war_democrats.20.t:0 "Бостонське повстання"
 mtg_usa_civil_war_democrats.21.desc:0 "Уряди штатів Каліфорнія, Орегон і Вашингтон заявили про свою підтримку Бостонського уряду та наказали всім федеральним офіцерам або піти у відставку, або негайно залишити території цих штатів. Хоча надходять рапорти про деякі вогнища, деякі рапорти про деякі вогнища, що опір користуються підтримкою населення."
 mtg_usa_civil_war_democrats.23.a:0 "Ми повернемося."
 mtg_usa_civil_war_democrats.26.desc:0 "Законодавчі збори Уайомінга, Айдахо та Монтани ухвалили низку законів проти виходу з Союзу, надавши місцевим органам правопорядку широкі повноваження щодо арешту та затримання тих, хто виступає проти федерального уряду протягом усього. менш, наявність повстанських формувань у розташованих поблизу Вашингтоні та Орегоні вимагає надати негайну підтримку лояльним військам."
 mtg_usa_civil_war_fascists.2.t:0 "Протести переростають у насильство"
 mtg_usa_civil_war_fascists.20.t:0 "Розкол!"
 mtg_usa_civil_war_fascists.21.a:0 "На мою думку, ми вже таке проходили, чи не так?"
 mtg_usa_congress_small_support_tt:0 "До §Y5 сенаторів§! і §Y25 представників§! §Gпідтримають§! уряд.\n"
 mtg_usa_foreign_support.4.t:0 "Зброя для держави [USA.GetNameDef]"
 mtg_usa_north_american_dominion.3.a:0 "Відважні слова для такого слабкого керівника."
 mtg_usa_secure_asia.3.desc:0 "З [From.GetAdjective] уряду надійшло повідомлення: «Від здобутої свободи ніколи не слід відмовлятися». Більше жодних повідомлень від них не було, а нашому послу в державі [From.GetNameDef] вручили паспорт."
 mulan:0 "Mulan Joins the Army"
 mutiny_event.9.t:0 "A new breed of officer"
 nationalism_focus:0 "Ставка на націоналізм"
 naval_detection_tt:0 " $MODIFIER_NAVAL_DETECTION$: $RIGHT|+=%1$"
 naval_headquarters_desc:0 "Ця будівля дозволяє призначити адмірала для підвищення ефективності §Yоперативних груп§, що діють у зоні дії штабу ВМС.\n\nДо $MAXNUM|H$ штабів можуть мати призначеного адмірала одночасно.\n   Наразі призначено: $CURRNUM|H$\n\nШтаб ВМС можна побудувати лише у прибережній провінції, де розташована морська база не нижче 8-го рівня."
 naval_minelaying:0 "Технології вилову морських мін"
 neo_mesopotamia_ADJ:0 "Месопотамськ"
 news.1.a:0 "Цікаві часи."
 news.106.b:0 "Нарешті, Москау наша!"
 news.106.t:0 "Падіння Москви"
 news.151.a:0 "Поки що кризу запобігнуто."
 news.159.a:0 "Чи приведе це до вічного миру, чи до ще однієї війни?"
 news.166.a:0 "Світло гасне."
 news.169.c:0 "Це лякає."
 news.17.t:0 "Румунія відхиляє німецький арбітраж"
 news.170.d_GER:0 "Зміцнивши свій вплив на Балканах, держава [GER.GetName] стверджує, що його прагнення спрямовані на підтримання миру у колись неспокійному регіоні. Для цієї мети грекам необхідно поступитися частиною своїх земель.\n\nЗнаходячись віч-на-віч з німецькою військовою машиною, [GRE.GetName] не бачить іншого виходу, крім як поступитися вимогам."
 news.174.e:0 "Ми продовжемо дослідження в секреті."
 news.177.c:0 "Ми мусимо не дозволяти Франції знову мати гегемонію в Європі."
 news.185.b:0 "Будемо сподіватися, що їхні інтереси не суперечать нашим."
 news.187.b:0 "Це не дивно."
 news.188.a:0 "[ITA.GetName] посилює свій вплив"
 news.189.c:0 "Турецько-італійське суперництво посилюється."
 news.192.d:0 "У зверненні до італійців, які мешкають на узбережжі Далмації, [From.GetLeader] заявляє: [From.GetName] вважає, що законно претендує на частину держави [YUG.GetName].\n\nОфіційна заява підкріплює ці претензії і чітко дає зрозуміти, що [From.GetName] у разі потреби забере ці землі силою."
 news.195.d:0 "Під час [Soviet.GetName] окупації Німеччини, [From.GetName] отримала більшу частину Східної Німеччини, включаючи спірну територію Східної Пруссії.\n\nЗдається, це є результатом таємного пункту радянсько-польського договору. Польща отримала німецькі землі як компенсацію за те, що вони були змушені віддати [Soviet.GetName].\n\nПольща грала з найвищими ставками, і хоча багато було втрачено, тепер вона також багато виграла."
 news.203.c:0 "Німецька експансія продовжується."
 news.209.b:0 "Ми відрадили Японію від просування на Тихому океані"
 news.21.c:0 "Ця земля все одно нічого не варта."
 news.228.t:0 "[ENG.GetNameDefCap] оголошує Балканську дипломатичну ініціативу"
 news.232.a:0 "Дружити краще, ніж ворогувати..."
 news.246.a:0 "Чи будуть вони шукати в Америці, чи за її межами?"
 news.25.d:0 "Німеччина розмістила війська в Райнланді поруч із французьким кордоном, порушивши Версальський договір. Місцеве населення вітало німецьких солдатів, тоді як дипломатична реакція Франції та Великої Британії залишається стриманою. «Німці просто гуляють у своєму подвір'ї», — заявив один із англійських політичних коментаторів."
 news.250.d:0 "Нестабільність [MEX.GetAdjective]ої політики за останні кілька років переросла у збройний конфлікт! Сили партії синархістів взялися за зброю, і на вулицях кількох великих [MEX.GetAdjective]нських міст спалахнули бої! \n\nХоча вважалося, що уряд має очевидну перевагу над будь-яким повстанням, ходять чутки про іноземну підтримку націоналістів. Близькі сусіди країни спостерігають за подіями, затамувавши подих. Куди цей конфлікт приведе Мексику, покаже лише час."
 news.253.b:0 "Спостерігати, як імперія розпадається на шмаття..."
 news.294.c:0 "Це руйнує всі наші плани..."
 news.304.a:0 "Ми вітаємо їх у нашому товаристві."
 news.313.desc.a:0 "Сьогодні уряди Італії, Австрії та Угорщини оприлюднили спільну заяву, в якій оголосили про створення Римського пакту. Три держави пообіцяли надавати одна одній військову допомогу, як оборонну, так і наступальну, якщо виникне така потреба. Баланс сил в регіоні кардинально змінився за одну ніч."
 news.316.b:0 "Вони думають, це їх врятує?"
 news.324.t:0 "Югославія скорюється перед Румунією"
 news.327.desc:0 "З метою об'єднання македонських народів Югославія оголосила, що відтепер вважає Центральну Македонію невід'ємною частиною югославської нації. На підтвердження цієї заяви на кордоні з'явилися дивізії, а над регіоном нависла загроза нового військового конфлікту."
 news.330.e:0 "Може, це даcть стабільність?"
 news.332.desc:0 "Вчора британські військово-морські підрозділи заблокували своїх французьких колег на важливих військово-морських базах у Північній Африці, висунувши ультиматум: французи повинні негайно відплисти до британських портів і передати контроль над своїм флотом, інакше британці відкриють вогонь по своєму колишньому союзнику. Зіткнувшись з переважаючою вогневою силою, французи прийняли ультиматум, і тепер їхній флот перебуває під британським контролем."
 news.333.e:0 "Вони показали свою рішучість."
 news.338.b:0 "Світу слід бути в захваті від нашого досягнення."
 news.45.t:0 "Смерть Рудольфа Гесса"
 news.56.d:0 "Німецькі претензії на Судетську область у Чехословаччині, де мешкає значна німецька меншина, посилилися.\n\nНа зустрічі в Мюнхені лідери Німеччини, Великої Британії, Франції й Італії спробували знайти рішення так званої Судетської кризи. Чехословаччина не була запрошена на переговори. За укладеною угодою, Німеччина отримувала Судети в обмін на обіцянку не претендувати більше на жодні європейські території. Звертаючись до слухачів у Лондоні, Чемберлен проголосив: «Дорогі друзі, ось уже вдруге в нашій історії британський прем'єр-міністр привозить із Німеччини почесний мир. Я переконаний, що це мир надовго»."
 news.56.t:0 "Мюнхенська угода"
 news.57.d:0 "Німецькі претензії на Судетську область, що у Чехословаччині та котра населена великою кількістю етнічних німців, останнім часом посилилися.\n\nНа зустрічі в Мюнхені глави Німеччини, Великої Британії, Франції й Італії спробували знайти рішення так званої Судетської кризи.\n\nОднак переговори провалилися, коли Велика Британія та її союзники категорично заявили, що якщо німецькі війська перейдуть кордон Чехословаччини, почнеться війна.\n\nЗдається, мирним шляхом вийти з кризи вже не вдасться."
 night_assault_tactics:0 "Тактики нічного наступу"
 northern_territory_recon_support:0 "Розвідувальний підрозділ Північної Території"
 nsb_coup.2.desc:0 "Минулої ночі після декількох тижнів планування група офіцерів наказала виконати план, відомий як [Root.GetOperationName], із захоплення контролю над урядом.\n\nСхоже, що операцію було розпочато передчасно: вона виявилася поспішною і погано Група солдатів-змовників, які, очевидно, не знали про зміни в графіку варти, з'явилася в кабінет глави держави (а за даними наказами [Root.GetLeader] підлягає арешту або знищенню), але зробили вони це точно в момент зміни варти, коли охорони на місці виявилося вдвічі більше очікуваного. Послідувала коротка і жорстока перестрілка, з обох боків є вбиті і поранені.[Root.GetLeader] тим часом зміг втекти.\n\n[Root.GetLeader] згодом з'явився на публіці, показавши, що Замах на вбивство не вдалося, після провалу перевороту кілька офіцерів нашої армії покінчили життя самогубством, щоб уникнути арешту, або вирішили померти в бою з загонами, які прибули для арешту. t.GetLeader] тим часом приймає клятву вірності від командирів різних гарнізонів."
 nsb_news.1.desc:0 "У молодій Польській державі вибухнула громадянська війна! Десятиліття розбіжностей в уряді і недостатньо розвинена інфраструктура вже вилилися цього року у загальний страйк серед нижчих класів нації, а жорстокість поліції та армії по відношенню до страйкарів розколола народ надвоє. \n\nСелянський уряд, який очолює [peasant_poland_target.GetLeader], користується підтримкою Фронту Морж, демократичної фракції польської армії, а також коаліції марксистів, соціалістів і лібералів.\n\nЗараз, коли сили лоялістів зібрані в промисловому на сільському сході країни, Польща розділена кров'ю селян."
 nsb_news.2.d:0 "Польща в Африці?"
 nsb_news.304.a:0 "Цього разу держава виживе!"
 nsb_news.405.desc:0 "Знову приміривши на себе роль захисниці всіх слов'ян, Росія вирішила, що найкращий спосіб захистити слов'ян — це об'єднати їх усіх в одну націю. Закінчивши нарешті об'єднання, [SOV.GetLeader] проголошує тепер про утворення держави [SOV.GetNameDef] і заявляє, що «всі ресурси, доступні новій країні, будуть використані на благо її народу та на захист його від зовнішніх загроз»."
 nsb_news.5.desc.romania:0 "5 листопада 1916 року німецький Вільгельм II і австрійський Франц Йосип підписали спільну декларацію про створення нової держави з польських земель, окупованих Росією, — Королівства Польща. Проте молода держава не змогла знайти собі оголосив Другу Польську республіку. Тепер же, здається, Польща нарешті знайшла собі короля — ним буде [POL.GetLeader]! [ROM.GetNameDef]. Право на спадщину румунського трону робить незворотне зближення двох націй лише питанням часу."
 nuclear_espionage_outcome_tt:0 "Ми впровадимо в [FROM.GetAdjective]у ядерну програму агента, який спробує передати нам технічну документацію, щоби ми використали її у власних розробках."
 nuke_dropped.11.d:0 "A city many have tried and failed to conquer, Moscow was the target of a nuclear attack by [?global.nukecountry.GetNameDef] today. The explosion was directed at the heart of [From.From.Owner.GetAdjective] leadership, the Kremlin having been nearly completely destroyed by the blast.\n\n[From.From.Owner.GetLeader], having grown more aware and fearful of all possible and impossible threats recently, evacuated in time and survived. However, even the vastness of [From.From.Owner.GetName] may not be enough to escape such a ruthless enemy. Indeed, if this continues, the nation will soon consist only of two kinds of wastelands: Those which were there in the first place, and those created by its enemies."
 nuke_dropped.5.t:0 "Атомне бомбардування Лондона"
 occupy_south_italy_fra:0 "Окупувати Південну Італію"
 operation_infiltrate_armed_forces_airforce_desc:0 "§L[From.getAdjective]і ВВС — найновіший рід [From.GetAdjective]их військ, і тому в них служить багато людей незвичайної біографії. Можна скористатися цим фактом, щоб впровадити туди свою людину.§!"
 operation_steal_tech_civilian:0 "Вкрасти промислові креслення"
 operation_targeted_sabotage_infrastructure_desc:0 "§LСпротив на території ворога планує провести потайну операцію проти ворожої інфраструктури, але поки що нашим союзникам бракує ресурсів для потужного удару.§!"
 operation_zet_chi:0 "Операція «Зет»"
 pak_tech_tt:0 "[RAJ.GetName] має на §Y30%§! більше технологій, ніж §Y[PAK.GetName]§!\nНаші технології: [?var:THIS.num_researched_technologies]\nПотрібно: [?var:pak_researched_techs] "
 paras_combat_drop_desc:0 "Незважаючи на небезпеку, навчання наших елітних сил методам прямого вторгнення може дати нам значні бойові переваги в поєднанні зі звичайним штурмом."
 patrol_boats_home_waters_defense:0 "Оборона домашніх вод"
 pavel_events.1.t:0 "Відродження Донської республіки"
 pavel_events.2.a:0 "Чудово."
 peninsular_focus:0 "Півострівна війна"
 peoples_army_desc:0 "Концепція народної армії передбачає перевагу людини над зброєю, а потужної мотивації — над слабкою технологією. Вона користується широкою підтримкою у населення.\n\n"
 peru_bolivia_category_desc:0 "Хоча Перуано-болівійська конфедерація проіснувала лише з 1836 по 1839 рік, вона все ж закарбувалася у свідомості нашого народу. Якби нам вдалося відновити значну частину старих кордонів, не виключено, що ми знову відродили б втрачену державу та проголосили себе її новими лідерами."
 plane_designer_strategic_bomber:0 "Стратегічний бомбардувальник"
 poland.18.b:0 "Запросити фалангістів в уряд."
 poland.21.t:0 "[DNZ.GetNameDef] шукає примирення з державою [Ger.GetNameDefCap]"
 poland.2102.b:0 "Можливо, вони заслуговують певної автономії."
 poland_goal:0 "Данциг або війна!"
 political.12.d:0 "«[Root.GetLeader] хоче, щоби ви повірили, що [Root.GetName] стоїть у безпеці та єдності. Не дивно, що така брехня отруїла свідомість наших людей, коли по сусідству звивається змія! Погляньте лише на наш кордон, і ви побачите співвітчизників, які пішли один проти одного в ім'я комунізму, оголосивши про кінець націй. Скільки часу мине, перш ніж вони проголосять нашу націю мертвою? Чи захистить нас [Root.GetRulingParty] від цієї загрози?»\n\nЗростання фашистського руху в державі [Root.GetName] було підкріплене близькістю комуністичної революції. Багато поміркованих людей, які зазвичай відкидають фашизм як іще один помилковий ідеологічний експеримент, уважають, що це дуже реальна загроза і для них. Маючи вибір між комунізмом наших сусідів і фашистським режимом, вони, безперечно, віддадуть перевагу останньому. Можливо, вони навіть були б готові активно його підтримувати."
 political.21.b:0 "Фашисти несуть істинний [Root.GetAdjective]ий дух!"
 political.25.t:0 "Мода на комунізм минає"
 political.28.a:0 "Нарешті єдині!"
