 ICE_break_with_the_crown_desc:0 "Настав час зробити офіційний розрив з короною Данії. Ми повинні засудити короля, а також його занепадницький кабінет у Данії, і знову проголосити Ісландію незалежною державою, вільною йти власним шляхом до своїх мрій і прагнень."
 ICE_fascism_ADJ:0 "Ісландськ"
 ICE_incite_communist_uprising_ni:0 "Підбурити повстання в Північній Ірландії"
 ICE_incite_communist_uprising_ni_desc:0 "З невеликим поштовхом ми зможемо змусити робітників Північної Ірландії піднятися в [119.GetCapitalVictoryPointName] і проголосити свою незалежність від уряду в м. [119.owner.capital.GetCapitalVictoryPointName]."
 ICE_international_trade_desc:0 "Ісландія повинна бути більш активною на фінансовій світовій арені. Прийнявши вільну торгівлю та відкривши нашу країну для іноземних інвестицій, ми зможемо створити більше торгових можливостей і ще більше стимулювати нашу економіку."
 ICE_state_owned_industry_desc:0 "Маленька країна, така як [ROOT.GetNameDef], не може покладатися на капіталістів у виробництві необхідних товарів. Для того, щоб максимізувати ефективність і забезпечити виробництво найнеобхідніших товарів, держава повинна втрутитися і взяти промисловість під свій контроль. Країна більше не повинна залежати від іноземних інвестицій, щоб вижити. Ісландська держава дбатиме про своїх громадян та збройні сили."
