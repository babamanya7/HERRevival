 CZE_comprise_with_the_carpathians:0 "Компроміс з карпатцями"
 CZE_deepen_ties_with_puppet_kingdoms_desc:0 "Хоча тепер ми маємо чітку сферу впливу, нам потрібно буде зробити наш вплив ще сильнішим, щоб отримати максимальну вигоду від цих союзних країн."
 CZE_develop_sudetenland_resources_desc:0 "Судетська область має багато родовищ ресурсів, які ми зараз не використовуємо. Було б помилкою не інвестувати в будівництво нових шахт у цьому регіоні."
 CZE_diversify_airframe_production_desc:0 "Ми не можемо покладатися лише на наші винищувачі в небі. Інші літаки та більші корпуси необхідні для виконання інших типів місій."
 CZE_diversify_our_specialists:0 "Диверсифікувати наших спеціалістів"
 CZE_elevate_slovak_officers_desc:0 "Ми зосередимося на просуванні словаків, щоб забезпечити краще представництво в лавах армії. Знижуючи деякі вимоги до кандидатів зі словацьких округів, ми очікуємо покращення згуртованості в армії в майбутньому."
 CZE_form_the_european_federation_HUN_tt:0 "Отримати національні території в угорських регіонах"
 CZE_form_workers_brigades:0 "Сформувати робітничу міліцію"
 CZE_fortify_the_crossroads_with_slo:0 "Укріпити перехрестя шляхів"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc:0 "Англо-Чеський кредитний банк був одним із головних рушіїв нашої промисловості. Без їхніх коштів ми б не змогли підтримувати масштабний експортний бізнес, який маємо зараз. Відкриття нових відділень у Нью-Йорку та поглиблення зв'язків з [ENG.GetNameDef] сприяли б ще більшому зростанню банку. Це також дало б [ENG.getname] певну зацікавленість у нашому подальшому виживанні."
 CZE_import_foreign_fighters_desc:0 "Закупивши за кордоном зразки іноземних винищувачів, ми можемо провести випробування, щоби забезпечити власних конструкторів цінним досвідом."
 CZE_improve_balkan_trade_relations:0 "Покращити торгові відносини на Балканах"
 CZE_infantry_equipment_1:0 "Zbrojovka Brno vz. 24"
 CZE_invite_romania_desc:0 "Запросити Румунію в Антанту."
 CZE_keep_focus_on_weapon_exports:0 "Зберегти фокус на експорті зброї"
 CZE_keep_focus_on_weapon_exports_desc:0 "Наша потужна збройова експортна промисловість — це те, що вивело нас з економічної депресії. Зміна цієї тенденції була б небезпечною як політично, так і економічно. Дотримуватися поточного курсу — найкращий план дій у цей час. Будь-які загрози для нас все одно перебільшені."
 CZE_logistics_beyond_the_sudetes_tt:0 "Відкриває: §Y«Покращені склади припасів»§!\n§YРота забезпечення§!: Використання припасів: §G-10%§!"
 CZE_master_of_armaments_desc:0 "Заводи «Шкоди» були найбільшим виробником зброї в межах наших кордонів ще з часів Австро-Угорської імперії. Їхній досвід та кваліфікація не мають рівних серед промислових конгломератів нашої країни. Настав час дати їм звання Майстра озброєнь."
 CZE_merge_the_financial_and_state_guard_desc:0 "З зі створенням Гвардії оборони держави фінансова варта більше не потрібна. Їхнє об'єднання з Гвардією оборони держави допоможе швидко збільшити чисельність SOS."
 CZE_military_research_institute_desc:0 "Завдання Військово-технічного інституту — забезпечувати збройні сили Чехословаччини передовими технологіями, розробляючи та випробовуючи нові зразки озброєнь."
