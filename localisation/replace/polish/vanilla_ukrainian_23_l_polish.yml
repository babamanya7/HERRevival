 SPR_against_trotskyism_and_stalinism_desc:0 "Надто довго суперечки між Троцьким і Сталіним та їхніми прихильниками підривали єдність і цілісність соціалістичної справи. Якщо вони не можуть залишити свої розбіжності в стороні, тоді ми повинні просто позбавити нашу справу від їхнього впливу."
 SPR_castille_communism_DEF:0 "Республіканська Кастилія"
 SPR_disband_the_army_desc:0 "Ми більше не можемо ігнорувати ознаки нелояльності в армії. Навіть якщо це спонукає змовників до дії, у нас немає іншого вибору, як спробувати розпустити армію з негайним ефектом і перехопити ініціативу."
 SPR_global_defense_council_tt_2:0 "Відкриває набір рішень §Y$SPR_the_seeds_of_revolution$§!, які дозволяють передачу та контроль будь-яких держав, контрольованих іноземними державами, які мають достатньо високий рівень §Yпідпорядкування§!.\n"
 SPR_heavy_cruiser_2:0 "Клас «Canarias»"
 SPR_heavy_ship_engine_1:0 "«Parsons» 15 500 к. с. н. в."
 SPR_hinder_nkvd_interference_desc:0 "Радянський НКВС надто довго втручався у внутрішні справи Іспанії. Відверті критики Сталіна зникли, наші політики ізольовані, а наші зусилля по боротьбі з фашистами інколи зустрічають більший спротив з боку наших гаданих союзників, ніж наших ворогів. Досить значить досить. Ми дамо відсіч сталіністам."
 SPR_imprison_primo_de_rivera_desc:0 "Хосе Антоніо Прімо де Рівера вже достатньо потурбував країну своїми безперервними запальними промовами. Ми заарештуємо його та триматимемо там, де зможемо наглядати за ним. Голос Фаланги мусить замовкнути."
