 UNIT_LEADER_ADD_ADVISOR_DESC:0 "Ви справді хочете додати $NAME|Y$ на посаду $ROLE|Y$? Після цього $NAME|Y$ не зможе бути призначений(-а) на іншу посаду радника.\n\nДодавання цього командувача як радника коштує £command_power $COST|Y0$."
