 GER_reichskommissariats_tt:0 "Дозволяє утворювати особливі §Yпідлеглі держави§! та §Yадміністративні одиниці§! на завойованих теренах, як-от §Yрайхскомісаріати§! та §Yрайхспротекторати§!. Також дозволяє розподіляти Європу прогнозовані сфери впливу.\n"
 GER_rekindle_imperial_sentiment_tt:0 "Коли підтримка нейтралів буде досить висока, ці держави зможуть відродити Австро-угорську імперію та вступити до Центральних держав крізь рішення.\n"
 GER_rescued_mussolini:0 "Муссоліні врятований"
 GER_rocketry_focus:0 "Ракетні технології"
 GER_schlieffen_once_more_ww:0 "$GER_schlieffen_once_more$"
 GER_state_controlled_economy_desc:0 "Наша економіка занадто крихка, щоб залишити її в руках тих, хто не розуміє, як її правильно управляти. Щоб уникнути кризи, держава має взяти її під контроль."
 GER_stormtroopers:0 "Штурмові війська"
 GER_submarine_2:0 "Тип «IIA»"
 GER_support_the_proletarian_uprising_desc:0 "Ми передбачаємо зростання громадянських війн навколо нас, тому маємо змінити підхід до підтримки повсталих робітників. Вони можуть бути погано підготовлені, але якщо ми забезпечимо їх спорядженням, то зможемо гарантувати червону хвилю в нашому регіоні."
 GER_support_weapons3:0 "MG 42 & 8 cm Granatwerfer 34"
 GER_sway_the_balkans_tt:0 "Відкриває рішення для §YЗміцнення ідеології [ROOT.GetRulingIdeology]§! в §YБалканських§! країнах та для §YПриєднання їх до Міттелеуропи§!"
 GER_synthetic_rubber_desc:0 "Бурхливий розвиток автомобільної та авіаційної промисловості вимагає великих обсягів гуми, яких ми не маємо. Потрібно поліпшити методики синтезу необхідних матеріалів."
 GER_tackle_the_communist_threat:0 "Протистояти [GER.GetTackleCommunistThreatName] загрозі"
 GER_tech_sharing_desc:0 "Обмін технологіями між нами та однодумцями повинен бути пріоритетом. Найрозумнішим кроком буде звернутися до [SOV.GetAdjective]ого уряду для такої ініціативи."
 GER_the_prussian_legacy_desc:0 "«Де деякі держави мають армію, прусська армія має державу», — сказав колись Вольтер. Ми втілимо це в життя, розвиваючи стару німецьку доктрину Bewegungskrieg — маневреної війни — задля забезпечення швидких і приголомшливих перемог на полі бою."
 GER_u_boat_effort_desc:0 "Командор Дьоніц стверджує, що єдиним способом поставити Велику Британію на коліна є підводні човни. Якщо побудувати їх у достатній кількості та надати свободу дій, ми відріжемо британську промисловість від джерел сировини у колоніях."
 GER_u_boat_efforts:0 "Розвиток U-Boot"
 GER_ubd_state_transfer_effect_tt:0 "Кожна виділена область перейде під контроль §Y[UBD.GetNameDef]§!"
 GER_unlock_plan_z_tt:0 "Відімкне фокус §Y$GER_plan_z$§!."
 GER_volkskommissariat_industrial_effort_decision:0 "Зусилля по індустріалізації в державі [FROM.GetNameDef]"
 GER_war_with_france_desc:0 "Тепер, коли Німеччина на якийсь час залагодила проблеми на своєму східному кордоні, настав час звернути погляд на захід. Втрата Ельзасу–Лотарингії — ганьба для німецької нації, і тільки справедлива війна зможе змити її."
 GER_weserubung_nord:0 "«Навчання на Везері–Північ»"
 GER_womens_rights_and_equality:0 "Права жінок і рівність"
 GHA_ADJ:0 "Ганськ"
 GHA_democratic:0 "Республіка Гана"
 GIE_AIRWING_SELECT_MANPOWER_BUTTON_EXILE:0 "Наразі ми використовуємо §H$COUNTRYADJ$і§! §Hлюдські ресурси ветеранів у вигнанні§!."
 GOE_RAJ.13.desc:0 "Уряду Азад Хінд може знадобитися окрема столиця для адміністративних цілей, яка знаходиться далеко від фронту, доки їхня перемога не буде закріплена.\nНещодавно завойовані Андаманські острови можуть ідеально підійти для цього."
 GOE_RAJ.14.tt:0 "Ми можемо перенести нашу Столицю на Андаманські острови, завершивши фокус §Y$RAJ_shaheed_and_swara$j§!."
 GOE_RAJ.18.desc:0 "У міру того, як [RAJ.GetNameDefCap] скидає ярмо свого минулого, [RAJ.GetLeader] став достатньо зухвалим, щоб вимагати повернення наших колоніальних володінь у цьому районі. Об'єднання субконтиненту в єдину сильну державу, здається, є надзвичайно важливим для новонародженої країни."
 GOE_RAJ.45.desc:0 "Індійські війська взяли [433.GetName]. Пакистанські сили відступили після важких боїв, і над регіоном тепер майорять комуністичні прапори. Індійські радіопередачі називають це тріумфом народу."
 GOE_RAJ.46.b:0 "Ми не можемо витримати тиску"
 GOE_RAJ.50.b:0 "[433.GetName] по праву наш."
 GOE_RAJ_famine.6.desc:0 "Місцевий уряд схвалив схему пріоритетного постачання основних продуктів харчування для вищих та середніх класів населення, які важливі для важкої промисловості в штаті та симпатизують західним цінностям та модернізації. Це ще більше підвищило ціни на продукти харчування."
 GOE_RAJ_loyalist.01.desc:0 "Сьогодні ми приносимо добрі новини. Керівництво [RAJ.GetNameDef] звернулося до нас із пропозицією збільшити виробництво та експорт основних товарів з [RAJ.GetNonIdeologyName] у ширшу Імперію. Ми можемо очікувати, що наші магазини наповняться індійським чаєм, бавовною та джутом, оскільки [RAJ.GetNameDef] доводить себе цінним активом для нашого щедрого домініону."
 GOE_RAJ_loyalist.04.t:0 "[FROM.GetNameDefCap] погоджується на війну"
 GOE_RAJ_loyalist.05.a:0 "Ми повинні поважати бажання корони."
 GOE_RAJ_loyalist.10.a:0 "Чудово. Розпочати процедури."
 GOE_RAJ_loyalist.11.a:0 "$ENG_winston_churchill$ має очолити [RAJ.GetNameDef]."
 GOE_RAJ_navy.1.desc:0 "[RAJ.GetLeader] надіслав нам пропозицію про створення військово-морської торговельної угоди між [RAJ.GetAdjective] та [ENG.GetAdjective] адміністраціями. \nЦе дозволить взаємну співпрацю у військово-морському виробництві, а також відкриє двері для додаткових торговельних угод у майбутньому."
 GOE_RAJ_navy.11.a:0 "Це чудова новина для Королівського індійського флоту!"
 GOE_RAJ_navy.12.a:0 "Шкода."
 GOE_RAJ_navy.3.a:0 "Шкода."
 GOE_RAJ_princely.1.t:0 "Вибір князя для керівництва [ROOT.GetNameDef]"
 GOOD_ARMOR_ATTACK_DESC_STR:0 "Атакуючи ворожу дивізію, яка не зможе пробити нашу бронетехніку, ми нанесемо більше шкоди.\n"
