 YUG_GATHERING_STORM_DESC:0 "Югославія з'явилася після об'єднання новоствореної Держави сербів, хорватів і словенців з Королівством Сербія в 1922 році. Спершу Югославія приєдналася до Малої Антанти та Балканського пакту з метою забезпечення незалежності, але недавнє вбивство короля Александара I, зростаючий неспокій через націоналістів і зовнішній тиск із боку Італії та Німеччини призвели до нестабільності та переоцінки політичної та стратегічної позиції Югославії."
 YUG_attract_foreign_capital_desc:0 "Ми можемо скористатися нашими тісними дипломатичними зв'язками, сприяючи притоку іноземного капіталу та інвестицій."
 YUG_ban_fascists_desc:0 "Навіть зараз у нашій країні є партії, які ставлять одну культуру над усіма іншими і прагнуть домінування в Югославському союзі. Цим людям не місце в нашій країні, і їх треба замовкнути."
 YUG_bomber_license:0 "Ліцензії на бомбардувальники"
 YUG_crush_ustasa:0 "Насувається повстання усташів"
 YUG_destroyer_2_desc:0 "The Beograd class consisted of three destroyers built with French help. Two of the ships were built at Split, while the third was built in France. All three were based on the French L'Adroit-class destroyers and commissioned in 1939. They displaced 1,210 tons and were armed with four 120mm/43 Škoda guns and six 533mm torpedo tubes. They had excellent speed but below-average range."
 YUG_domestic_artillery_production_desc:0 "Стимулюючи розвиток сучасних зразків вітчизняної артилерії, ми можемо забезпечити нашим силам найкращу вогневу підтримку, яку ми можемо надати."
 YUG_evolution_desc:0 "Хоча дехто стверджує, що наша нація є нестабільним союзом різних культур, які живуть у ворожнечі, ми точно знаємо, що лише об'єднавшись як єдине ціле, ми зможемо дати відсіч іноземним загарбникам. Ми повинні докласти зусиль, щоб об'єднати наш народ і розгромити тих, хто хоче нас розділити."
