 SWI:0 "Швайцарія"
 SWI_FRA_puppet_democratic_DEF:0 "Гельветська республіка"
 SWI_air_research_desc:0 "Ми готові прискорити дослідження та розробку нових повітряних технологій, якщо хочемо не відставати від наступів ворога та зрештою мати можливість домінувати в небі."
 SWI_american_industrial_investments:0 "Американські промислові інвестиції"
 SWI_axis_gold:0 "Золото Осі"
 SWI_citizen_supply_mandate_desc:0 "Ми не знаємо, як би відбувалося вторгнення, і якщо б ми могли покластися на централізовану мережу постачання, це не сумісно з нашою командною структурою. Ось чому кожна родина [ROOT.GetAdjective] повинна зберігати принаймні 2 місяці запасів у своїх власних домівках, як для себе, так і для своїх місцевих ополченців."
 SWI_decision_remove_councilor_1_text:0 "Усунути канцлера [?SWI.SWI_councilor_1.GetName]"
 SWI_decision_remove_councilor_2_desc:0 "$SWI_decision_remove_councilor_1_desc$"
 SWI_democratic:0 "Швайцарія"
 SWI_freeze_german_assets_desc:0 "Протягом багатьох років [?SWI.SWI_biggest_fascist.GetNameDef] використовує наш нейтралітет і лазівки в нашій банківській системі, щоби захистити свої нечесно здобуті багатства та зберегти свою економіку на плаву. Моральний обов'язок повинен мати пріоритет над абсолютним нейтралітетом, навіть якщо ми впевнені, що це матиме наслідки."
 SWI_german_military_collaboration_desc:0 "Нам бракує необхідного досвіду ведення війни, необхідного для того, щоби наша армія процвітала в сучасному світі. Тут на допомогу приходить [?SWI.SWI_biggest_fascist.GetName], їхні збройні сили — це сила, з якою треба рахуватися, і співпраця з ними дозволить нам захищати себе і, можливо, навіть завчасно атакувати інші країни."
 SWI_infiltrate_federal_police_desc:0 "Федеральна поліція, яка має мандат на боротьбу з нашою іноземною пропагандою та недемократичними силами, є ідеальним місцем для проникнення та запобігання нападам на нашу власну фракцію. Згодом це також дозволить нам усунути наших ворогів під виглядом національної безпеки."
 SWI_join_france:0 "Приєднатися до Франції"
 SWI_max_gold_trade_TT:0 "§RДосягнута межа торгівлі золотом§!"
 SWI_mechanized_support_desc:0 "Нашим солдатам потрібно швидше, ніж будь-коли, дістатися до поля бою, а тому їм потрібна підтримка, інакше вся ця доцільність була б марною."
 SWI_no_president:0 "§RНемає президента Конфедерації§!"
