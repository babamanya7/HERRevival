 SOV_development_aid_for_eastern_allies_tt:0 "Додати до §G2§! комірок для будівництва та §Y2 цивільних заводів§! у столичній області. Додати §G1§! комірку для будівництва й §Y1 цивільний завод§! у випадковій нестоличній області."
 SOV_dismantle_the_zemsky_sobor_tt:0 "Половина поточної підтримки §Yнефашистів§! буде застосована як штраф до §Rстабільності§!:\n"
 SOV_dismiss_the_counter_revolution:0 "Відкинути контрреволюцію"
 SOV_expand_aviation_institutes_desc:0 "Найбільшою перешкодою для збільшення чисельності наших ВПС є наша спроможність готувати пілотів. Розширюючи наші пілотні школи, ми закладемо фундамент для більших і більш компетентних ВПС."
 SOV_far_east_fortification_forts_3:0 "Додати §Y4 наземні укріплення§! на японському кордоні.\n"
 SOV_finish_the_five_year_plan_alt:0 "Скасувати п'ятирічний план"
 SOV_formalize_of_the_soviet_republic_of_sinkiang_desc:0 "Настав час вимогти інтеграцію держави [SIK.GetNameDef] як Незалежної Радянської Соціалістичної Республіки, підпорядкованої [FROM.GetAdjective]ому уряду."
 SOV_foster_flying_clubs_desc:0 "Вишкіл нових пілотів коштує дорого, якщо вони ніколи не бачили літака до початку навчання. Але багато молодих людей захоплюються польотами, і за певної підтримки з них можуть вирости дуже здібні пілоти, які дуже швидко опанують тонкощі повітряного бою, якщо вони вже знають основи пілотування літака."
 SOV_fourth_five_year_plan_available_tt:0 "[ROOT.GetFlag][ROOT.GetNameDefCap] перебуває в мирі з великою державою, яка порушила третій п'ятирічний план.\n§GЦей фокус буде виконаний автоматично, щойно умова буде виконана.§!"
