 siam.36.desc:0 "[SIA.GetNameDefCap] офіційно зажадала, щоб ми покрили витрати, пов'язані з домовленістю про друк грошей, яку ми змусили їх укласти. Домовленість послужила нам добре, але рахунок тепер виставлено."
