 vojvodina_fascism_DEF:0 "Сремська імперія"
 war_justification.17.t:0 "[ROOT.GetLeader] ставить під питання [From.GetAdjective]ий суверенітет"
 war_justification.18.a:0 "Принаймні цей конфлікт завершиться через війну."
 war_justification.204.t:0 "[From.GetName] готується до великої війни"
 war_relation_active:0 "воює з державою"
 water_fjords_icon:0 "GFX_modifiers_terrain_icons:3"
 why_we_fight:0 "Чому ми боремося"
 woman_in_a_high_castle_tt2:0 "Лідер держави — жінка"
 wtt_britain.30.a:0 "Вони врятували нас від вторгнення!"
 wtt_germany.50.a:0 "Це початок кінця нацистів."
 wtt_germany.56.t:0 "Німецькі території"
 wtt_germany.6.t:0 "Вільгельма II визволено"
 wtt_germany.62.desc:0 "Після закінчення останньої війни компанії, які набули векселі «MEFO», вимагають від нас оплати. Вони стверджують, що більше немає потреби затримувати платежі, пояснюючи це «благом для Батьківщини»."
 wtt_germany.74.desc:0 "[From.GetAdjective]ий уряд повідомляє, що змушений відкинути нашу пропозицію щодо інтеграції нашої військової економіки. Ця держава цінує незалежність вище, ніж ефективність своєї армії..."
 wtt_germany.74.t:0 "[From.GetName] відкидає пропозицію про економічну інтеграцію"
 wtt_germany.9.d:0 "Представники італійського уряду та підпілля прийняли нашу пропозицію про переворот. Вони готуються до швидкого захоплення влади на користь короля відразу після вбивства Муссоліні."
 wtt_infiltration.6.t:0 "Атаковано базу в області [infiltrated_state.GetName]"
 wtt_japan.108.a:0 "Tennōheika Banzai!"
 wtt_japan.111.desc:0 "[GER_fascism.GetAdjective]ий та [ITA_fascism.GetAdjective]ий уряди погодилися підписати Троїстий пакт, присягнувшись підтримувати один одного у разі оголошення війни."
 wtt_japan.13.a:0 "Вони щось замишляють проти нас?"
 wtt_japan.32.t:0 "Імператорську сім'ю заслано"
 wtt_manchukou.11.b:0 "Інвестуймо в автомобільну промисловість."
 wtt_manchukou.3.a:0 "Ми навчимо [From.GetLeader.GetHerHim] манерам."
 wtt_manchukou_bandit_sabotage.22.t:0 "Саботаж на цивільному заводі"
 wtt_news.2.b:0 "Певно, вони знають, що роблять..."
 wtt_news.21.t:0 "[From.GetNameDefCap] ганить державу [SOV.GetNameDef]"
 wtt_news.22.c:0 "Нарешті німці роблять якісь реальні кроки."
 wtt_news.25.c:0 "Це кінець колоніалізму?"
 wtt_news.41.h:0 "Тихий та Атлантичний океани знову розділені."
 wtt_news.44.a:0 "Син неба повернувся."
 wtt_news.9.desc:0 "У відповідь на так звану «ворожу риторику, що зростає з боку Німеччини», радянське військове командування оголосило про проведення низки широкомасштабних навчань цього року.\n\nПредставники Радянського Союзу висловлюють надію, що стан підвищеної бойової готовності утримає німців від «продовження своїх наклепницьких тирад»."
 wtt_political_organisation.1.a:0 "Простий народ вміє визначати переможця."
 wtt_political_organisation.10.desc_had_majority:0 "Услід за серією терактів у області [state.GetName], місцеве населення, схоже, вже не вірить, що ми зможемо його захистити. Оскільки ціллю нападників був виключно штаб нашої партії, то зрозуміти, хто стоїть за цими атаками, не важко: очедивно, що до цього доклав свою руку [majority_country.GetLeader]."
 wtt_political_organisation.4.a:0 "Неприйнятно."
 wtt_political_organisation.5.a:0 "Ми мусимо спробувати знову."
 wtt_political_organisation.6.desc_not_majority:0 "Газети в області [state.GetName] повідомляють, що на мітинги, де виступав [From.GetLeader], прийшла рекордна кількість людей. Схоже, що [From.GetNameDef] приваблює на свій бік дедалі більше людей. [majority_country.GetLeader], як і раніше, користується підтримкою більшості."
 wtt_political_organisation.6.t:0 "[From.GetNameDef] нарощує підтримку в області [state.GetName]"
 wtt_prc.30.t:0 "Провокація успішна"
 wtt_take_national_leadership.1.a:0 "Народ висловив свою волю."
 wtt_warlord.1.t:0 "[From.GetNameDefCap] пропонує свою покірність"
 wuw_GER_civil_war.4.t:0 "Майбутнє парамілітарних крил"
 wuw_GER_civil_war.9.a:0 "Він добре нам послужив"
 wuw_GER_diplomacy.20.b:0 "У нас інші плани"
 wuw_GER_diplomacy.20.desc:0 "[FROM.GetLeader] особисто надіслав запрошення приєднатися до [FROM.GetFactionName] [ROOT.GetLeader]у. Представники [FROM.GetAdjective] Верховного командування запевняють нас, що разом із їхнім вже потужним альянсом ми без зусиль розіб’ємо наших спільних ворогів, забезпечивши домінування [ROOT.GetAdjective] у нашому регіоні."
 wuw_GER_diplomacy.26.b:0 "Нам це не цікаво"
 wuw_GER_diplomacy.26.desc:0 "Лідер [FROM.GetAdjective] [FROM.GetLeader] звернувся до нас із пропозицією про наукову співпрацю. [FROM.GetLeader.GetSheHeCap] вважає, що, маючи схожі ідеології, але дуже різні підходи до розвитку флоту, ми маємо чудову нагоду для обміну знаннями. Угода передбачає взаємний обмін досягненнями, що дозволить нам вчитися одне в одного."
 wuw_GER_diplomacy.32.a:0 "Ми не маємо інтересу поновлювати цю оренду"
 wuw_GER_diplomacy.35.desc:0 "Ми отримали звернення від [FROM.GetAdjective] лідера [FROM.GetLeader], який хоче повернути під контроль свої колишні колонії, що зараз знаходяться під нашим управлінням. Попри стриманий тон повідомлення, з огляду на політичну ситуацію в [FROM.GetNameDef], відмова може мати серйозні наслідки."
 wuw_GER_diplomacy.38.a:0 "[GetGERAfricanColonyOverlordOption]"
 wuw_GER_diplomacy.63.a:0 "На жаль, ми не можемо нічого вдіяти..."
 wuw_GER_diplomacy.78.desc:0 "Після перемоги прихильників приєднання на референдумі, уряд держави [FROM.GetNameDef] повернувся з позитивною відповіддю. Відтепер вони підкоряються нашій владі заради блага свого народу."
 wuw_GER_legions.1.a:0 "Вони завжди бажані у наших лавах"
 wuw_GER_realpolitik.13.a:0 "Можливо, вони зможуть захистити нас від [SOV.GetAdjective]их сил."
 wuw_GER_realpolitik.15.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що наші вимоги такі ж слабкі, як і наш народ та національна воля. Схоже, вони готові боротися за свою свободу..."
 wuw_GER_realpolitik.2.a:0 "Чудово"
 wuw_GER_realpolitik.3.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 wuw_GER_realpolitik.38.a:0 "Ми повинні поважати їхнє рішення"
 wuw_GER_realpolitik.53.desc:0 "Хоч це й не стало несподіванкою, але нерозумний [FROM.GetLeader] з [FROM.GetNameDef] привів війська до бойової готовності після отримання нашого ультиматуму й заявив, що не відступить ні на крок."
 wuw_GER_realpolitik.59.b:0 "Ми будемо стежити за ними уважно"
 wuw_GER_realpolitik.6.b:0 "Ми ніколи не віддамо свою свободу!"
 wuw_GER_reichskommissariats.1.t:0 "Керівництво Бельгії-Північної Франції"
 wuw_GER_reichskommissariats.22.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.4.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.4.desc:0 "Ми встановили нову цивільну адміністрацію в Україні..."
 wuw_GER_reichskommissariats.8.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_uncertain_future.02.t:0 "[ROOT.GetNameDefCap] стикається з невизначеним майбутнім"
 wuw_GER_weltpolitik.2.a:0 "Ми наближаємося до нової Золотої доби!"
 wuw_HUN_a_danubian_federation_desc:0 "Ми маємо шанс стати дипломатичною потугою без нових територій. Об'єднавши країни довкола Дунаю, ми отримаємо вплив далеко за межами наших кордонів."
 wuw_HUN_a_responsible_government_desc:0 "Традиційно уряд відповідав перед королем, що дозволяло йому ігнорувати волю народу. Ми змінемо конституцію, щоб гарантувати, що саме народ, а не правитель, контролює уряд."
 wuw_HUN_an_airforce_to_be_reckoned_with:0 "Повітряні сили майбутнього"
 wuw_HUN_degauss_ship_hulls:0 "Розмагнітити корпуси кораблів"
 wuw_HUN_expand_the_lignite_industry_desc:0 "Наша буровугільна промисловість велика, але ще недостатньо розвинена. Ми повинні відкрити нові шахти та фабрики, щоб не марнувати наші природні ресурси."
 wuw_HUN_goulash_communism:0 "Гуляш-комунізм"
 wuw_HUN_horthy_field_marshal_tt:0 "§YМіклош Горті§! стане доступним як фельдмаршал рівня 2"
 wuw_HUN_hungarian_tradition_desc:0 "Наші традиції глибоко вкорінені в сільське господарство Паннонської рівнини. Ми повинні зберігати ці традиції та підвищити врожайність для подальшого розвитку."
 wuw_HUN_magyar_allamvasutak_desc:0 "Наша державна залізнична компанія МÁV повинна бути розширена, щоб керувати усіма потягами в країні. Це дозволить нам краще контролювати залізничну мережу та ефективніше її використовувати."
 wuw_HUN_march_south:0 "Марш на Південь"
 wuw_HUN_officialize_the_rakosi_battalion:0 "Легалізувати батальйон Ракоші"
 wuw_HUN_on_a_high_horse_desc:0 "[ROOT.GetAdjective] народ — справжні володарі цього світу, і останні події це довели. Настав час зайняти належне місце під сонцем і купатися в променях слави, пануючи над усім світом! Апостольське королівство керуватиме Божими дітьми."
 wuw_HUN_pass_statute_xix:0 "Прийняти статут XIX"
 wuw_HUN_proclaim_greater_hungary:0 "Проголосити Велику Угорщину"
 wuw_HUN_reestablish_the_rongyos_garda_desc:0 "Парамілітарна 'Розпатлана Гвардія' була створена у 1921 році для боротьби проти Тріанонського договору. Її капітан Пал Пронаї знову готовий служити — настав час відновити цю організацію."
 wuw_HUN_renounce_the_treaty_of_trianon_desc:0 "Несправедливість, нав’язана нашій нації після Великої війни, що позбавила нас двох третин нашої території та населення, дорівнює ганьбі, яку зазнала Німеччина за Версальським договором. Це має бути скасовано."
 wuw_HUN_restore_the_georgian_monarchy_desc:0 "Наші контакти вийшли на зв'язок із вигнаним принцом Георгієм Багратіоном Мухранським — законним спадкоємцем грузинського трону. Він пообіцяв вічну підтримку нашій справі, якщо ми пообіцяємо звільнити його батьківщину та відновити там монархію. Тепер м'яч на нашому полі."
 wuw_HUN_revenge_for_the_brusilov_offensive_desc:0 "Росіяни принизили нас на початку Великої війни, особливо під час їхнього надзвичайно успішного Брусиловського прориву. Ми повинні закарбувати у національній пам’яті прагнення помсти тим, хто скривдив нас, насамперед росіянам. У такий спосіб ми також можемо знову спробувати заснувати Габсбурзьку Україну."
 wuw_HUN_the_mavag_heja:0 "MÁVAG Héja"
 wuw_HUN_undermine_the_admiral_desc:0 "Міклош Горті надто довго править як регент. Пора передати владу мудрішому — наприклад, Дюлі Гьомбьошу. Рух MOVE допоможе в цьому."
 ww_BEL_event_diplomatic.18.desc:0 "Наші запропоновані зусилля щодо зміцнення нашої позиції та відновлення армії для повернення батьківщини були схвалені [FROM.GetNameDef]. Хоча це не може вирішити всі наші проблеми, це стане чудовим першим кроком для відновлення нашої незалежності."
 ww_BEL_event_diplomatic.24.t:0 "[FROM.GetNameDefCap] Приєднується до групи досліджень Європейського Союзу"
 ww_BEL_event_misc.3.a:0 "Мабуть, саме вони побудували двигун нашої економіки!"
 ww_BEL_event_war.9.a:0 "Ми приймаємо! Кале за мир."
 ww_congo.21.d:0 "З огляду на надзвичайно слабку владу нашого уряду над мандатом Руанда-Урунді та поширення націоналістичних настроїв у регіоні, Мвамі Мвамбута IV, король Бурунді, оголосив націю незалежною, розірвавши зв'язки з нашим центральним урядом. Чи повинні ми втрутитися?"
 ww_congo.21.t:0 "Декларація Мвамбути"
 ww_congo.33.a:0 "Цириль Адулa — хороший державний діяч, він не може піти"
 ww_congo.46.b:0 "Ні, нам потрібен хтось інший!"
 ww_congo.6.desc:0 "Колоніальна адміністрація в [BEL.GetNameDef] відмовилася від нашого запиту на збільшення виробництва їжі шляхом зменшення видобутку корисних копалин з метою 'покращення соціальних умов колоніального населення'."
 ww_congo.68.t:0 "[FROM.GetLeader] приєднується до Товариства з розвитку урану"
