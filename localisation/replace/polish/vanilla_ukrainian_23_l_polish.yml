 CARRIER_STACK_PENALTY_DESC:0 " §HШтраф до удару авіаносців§!\n\n$PERC|H%0$ авіакрил здатні завдати удару по ворогу.\n\nЦя величина розраховується на основі числа літаків, які наразі перебувають у повітрі, та складу ворожого флоту.\n\nУ повітрі може перебувати щонайменше $MINIMUM|H$ літаків, перш ніж будуть застосовані штрафи. Склад ворожого флоту дозволяє дієво використовувати $ENEMY_FLEET|H$ літаків. Застосовується більше з цих двох чисел."
 CAS_equipment_3_short:0 "Штурмовик III"
 CHAT_ERROR_SLAP_MISSINGARG:0 "Неправильний синтаксис — потрібно писати: /slap <username>"
 CHI_CAS_equipment_3:0 "CAMCO Type 24"
 CHI_EQUIPMENT_VERSION_3:0 "C"
 CHI_SINAW_primacy_desc:0 "SINAW пропонує технічні інновації, яких не має CAMCO. Інвестування в їхнє розширення наближає нас до паритету з іноземними державами."
 CHI_a_party_unified_desc:0 "Через дисципліну, мораль і чесноти ми викували єдність у нашій партії. Дріб'язкові сварки та розкол позаду, і ми рухаємося вперед під синім стягом і білим сонцем. Вперед до остаточної перемоги над усіма ворогами, як внутрішніми, так і зовнішніми!"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long_desc:0 "Тривале бомбардування у світлий час доби пропонує стабільний, методичний підхід до повітряної війни. Ми повинні використовувати видимість і координацію для нанесення ефективних ударів."
 CHI_accepted_JAP_demands_to_suppress_communism_and_more_flag:0 "Китай вирішив співпрацювати з нашими вимогами"
 CHI_anti_tank_equipment_1_short:0 "37mm Type 14"
 CHI_ban_immoral_entertainment_desc:0 "Декадентські форми розваг поширилися на наші береги і забруднили наші моральні засади. Ми повинні заборонити їх на користь більш спортивних і мистецьких вітчизняних форм, а також створити спеціальні групи для забезпечення цього."
 CHI_bring_the_revolution_further_desc:0 "Наш шлях звільнення йде далі, ніж ми могли собі уявити. Ми поширимо світло свободи по всьому Тихому океану і відкинемо колоніалістів ще далі."
 CHI_bring_the_war_home_tt:0 "Розблоковує наступні рейди:\n[GetHuangshenRaidTooltip]\n[GetTokyoImperialPalaceTooltip]\n[GetNationalDietTooltip]\n[GetHakkoIchiuTooltip]"
 CHI_burma_road_desc:0 "Бірманська дорога з'єднує нас із країнами заходу. Її слід будь-якою ціною захищати та розширювати, щоби постачання продовжувало надходити."
 CHI_coastal_patrol_planes:0 "Літаки узбережного патрулювання"
 CHI_construct_the_banqiao_dam_desc:0 "Наші могутні річки — це те, що визначає наші землі, і контроль над ними був фундаментальним для нашої цивілізації. У майбутньому ці річки живитимуть зростання і велич нашої нації!"
 CHI_crackdown_on_corruption_in_recruitment:0 "Боротьба з корупцією"
 CHI_dai_lis_peoples_state_fascism:0 "Китайська народна держава"
 CHI_form_the_combined_logistics_command_desc:0 "Тепер, коли наша армія реорганізована і ефективно бореться з будь-якими загрозами нашій нації, ми стикаємося з іншими проблемами. Хоча наша логістична ситуація покращилася, нашим збройним силам бракує координації в системах логістичного розподілу. Ми повинні негайно вирішити цю проблему!"
 CHI_free_mountain_template_tt:0 "Отримає шаблон із §Y7 гірськими§! та §Y2 артилерійськими§! батальйонами.\n"
 CHI_french_drill_desc:0 "Досвід Великої війни зробив французів геніями оборони. Вивчивши їх навчальні методики та стандарти, ми помітно поліпшимо власну обороноздатність."
 CHI_guerrilla_warfare_desc:0 "Конвенційна війна дозволяє нам чинити опір певною мірою, але боротьба на власній землі дозволяє нам використовувати більш нетрадиційні методи. Проникнення в регіони, утримувані ворогом, і сіяння хаосу в тилу — це спосіб боротьби, до якого [JAP.GetNameDef] абсолютно не готова."
 CHI_guerrilla_warfare_tt:0 "Розблоковує рішення категорії §Y$PRC_guerilla_warfare_sea_cat$§!"
 CHI_heavy_tank_destroyer_equipment_1:0 "PTZ 34 D"
 CHI_improve_opium_modifiers_output:0 "Операції по боротьбі з контрабандою"
 CHI_infantry_equipment_1_short:0 "Type 24"
 CHI_initiate_the_gung_ho_movement_desc:0 "З нинішньою кризою ми зрозуміли, наскільки жалюгідною є наша ситуація, як щодо матеріалів, так і щодо виробничих засобів. Чого нам не бракує, так це людей, яких можна залучити до роботи, якщо тільки правильно організувати. Нам запропонували ідею створити невеликі промислові кооперативи, які ми можемо розосередити по всій країні."
 CHI_internal_party_support_fascism:0 "Внутрішня підтримка партії"
 CHI_light_cruiser_1:0 "Клас «Hairong»"
