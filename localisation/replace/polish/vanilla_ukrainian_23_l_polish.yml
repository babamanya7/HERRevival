 FIN_suomen_merivoimat_desc:0 "Військово-морські сили [ROOT.GetName] повинні бути готові захищати свою батьківщину від абиякої можливої загрози. З наголосом на дослідженні сучасної військово-морської техніки та розробці вдосконаленої програми навчання [ROOT.GetAdjective]их ВМС стануть потужним сила, здатна захистити наші інтереси на воді."
