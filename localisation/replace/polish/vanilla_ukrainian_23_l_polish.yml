 GER_karelia_rkm_effect_tt:0 "Кожна область у карельській зоні інтересів перейде під контроль [RKM.GetNameDef]"
 GER_kriegsmarinewerft_wilhelmshaven_organization:0 "$GER_kriegsmarinewerft_wilhelmshaven$"
 GER_liberate_oppressed_people_tt:0 "Вартість звільнення частин §Y[SOV.GetNameDef]§! зменшується на §G40%§!, а вартість їх перетворення на маріонеток — на §G20%§!."
 GER_light_cruiser_3:0 "Клас «M»"
 GER_medium_tank_destroyer_equipment_1_short:0 "StuG III"
 GER_memel_ultimatum_desc:0 "Якщо ми чогось і навчилися з Великої війни, то це того, що ми маємо підготуватися до нападу на наші східні володіння. Це неможливо без контролю над стратегічно важливим Мемелем, який ми маємо повернути."
