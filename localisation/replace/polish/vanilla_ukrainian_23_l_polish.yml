 form_united_central_america_category_desc:0 "Потужна держава, складовою якої була наша нація століття тому, мала надто короткий термін життя. Тепер, коли ми завоювали сепаратистські держави, які спричинили його занепад, ми можемо дивитися на відновлення федеративної республіки та розпочати проєктування влади об'єднаної Центральної Америки."
