 ETH_set_up_gideon_force_decision_desc:0 "[?ETH.host_nation.GetAdjectiveCap]ий уряд, схоже, готовий спонсорувати невеликий експедиційний загін для безпосередньої підтримки нашого наступу на окупантів. Ми мусимо негайно домогтися формування такого підрозділу!"
 ETH_social_reforms_tt:0 "Відмикає рішення: анархо-комуністичні соціальні реформи."
 ETH_take_DJI_tt:0 "Ми повинні дочекатися слушного моменту, щоб завдати удару. Коли Французький Сомаліленд не буде окупований, ми зможемо швидко зайняти цю територію. Франція, швидше за все, визнає наше право власності на цю територію, але ми, тим не менш, мусимо бути готові до більш масштабного конфлікту."
 ETH_take_loans_desc:0 "Ми можемо спробувати збільшити доступні нам кошти, використовуючи імперські активи в якості застави."
 ETH_the_common_soldier_desc:0 "Армія — ніщо без звичайних солдатів, які щодня ризикують життям, не очікуючи винагороди чи визнання. Цих героїв слід шанувати за їхній внесок у нашу колективну безпеку."
