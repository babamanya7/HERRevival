 FIN_finnish_influence_in_the_baltic_desc:0 "Колективна безпека Балтійського регіону ґрунтується на наших однодумцях, які співпрацюють один з одним і забезпечують надійний захист від сил агресії. Таким чином, ми повинні переконатися, що всі наші сусіди рухаються в одному напрямку."
 FIN_finnish_legion_of_honor_desc:0 "Наші війська є щитом, який стримує комуністичні орди на нашому кордоні. Ми повинні докладати більше зусиль, щоб вшанувати їхню хоробрість, створивши елітний орден Почесного легіону, до якого можуть прагнути приєднатися найсміливіші з них."
 FIN_finnish_supremacy_in_the_north_invite_to_faction_tt:0 "Будь-яка незалежна фашистська північна чи балтійська країна отримує подію §Y'[ROOT.GetNameDef], яка запрошує нас до $FIN_finnish_supremacy_league$'§!."
