 SPR_the_future_of_the_republic_desc:0 "Нинішня боротьба, безсумнівно, стане визначальною за своїм впливом на майбутнє Республіки. Ми не повинні шкодувати ні зусиль, ні грошей, щоб правильно сформувати це майбутнє."
 SPR_the_popular_army_desc:0 "Наша нова армія буде складатися з тих, хто не заплямований зрадою військових; ті серед населення, які ревно захищають принципи, на яких побудована Республіка, але, можливо, раніше не служили. У поєднанні з цією реорганізацією ми також розробимо нову зброю та доктрини, щоби допомогти цій новій армії у їхній боротьбі."
 SPR_the_popular_front:0 "Народний фронт"
 SPR_those_who_would_not_help_us_desc:0 "Ми були покинуті Заходом у нашій боротьбі з фашистами, але відтоді все змінилося, і вони опинилися у своїй війні. Тепер нам знову потрібна їхня допомога, і, можливо, цього разу вони навчилися звертати на нас увагу, коли ми формуємо авангард проти нового ворога."
