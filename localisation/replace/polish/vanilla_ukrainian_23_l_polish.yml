 RULE_BOOST_PARTY_PLAYER_ONLY_TT:0 "Правило гри: §R$RULE_ALLOW_PARTY_BOOSTING_PLAYER_ONLY_DESC$§!"
 RULE_COMMUNIST_ARG_AI_DESC:0 "ШІ намагатиметься перетворити країну на комуністичну та приєднається до Комінтерну, щоби зосередитися на поширенні своєї ідеології в Південній Америці."
 RULE_COMMUNIST_BALTIC_AI_DESC:0 "ШІ намагатиметься встановити комуністичний режим, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS_HOL_AI_DESC:0 "§HНідерландський§! ШІ намагатиметься зберегти демократію, але зосередиться на континентальній розбудові замість колоній, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_FASCIST_FRA_AI_DESC:0 "§HФранцузький§! ШІ намагатиметься перейти у фашизм і зблизитися з фашистською Німеччиною, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_GROUP_AI_BEHAVIOR:0 "Поведінка ШІ"
 RULE_OPTION_AMERICAS_DEIMPERIALIZED_DESC:0 "Усі америндські держави в Америці будуть звільнені після початку гри."
 RULE_OPTION_DEMOCRATIC_HISTORICAL:0 "Історичний демократичний шлях"
 RULE_OPTION_ETH_IMPERIAL:0 "Імперія: Лев стоїть твердо"
 RULE_OPTION_FASCISM_AFG_AI_DESC:0 "Афганський ШІ спробує повалити короля Захіра-шаха і замінити його Амануллою-ханом, який потім спробує швидко модернізувати країну. Після цього Афганістан спробує розширити свої кордони за допомогою країн Осі."
 RULE_OPTION_FASCISM_TUR_AI:0 "Фашистський кемалізм"
