 FRA_autoroutes_desc:0 "Німці вразили світ своєю концепцією обмеженого доступу, високошвидкісних доріг, що з'єднують різні частини їхньої країни. Ми можемо показати світові, що ми можемо зробити так само добре."
 FRA_avenge_waterloo_desc:0 "Історія Наполеона Першого назавжди визначиться його найбільшою поразкою. Якщо ми хочемо досягти успіху, ми мусимо показати, що ми можемо виграти там, де він програв."
 FRA_buy_time:0 "Виграти час"
 FRA_carrier_planes:0 "Палубні літаки"
 FRA_carry_the_revolution_south:0 "Поширити революцію на південь"
 FRA_celebrate_the_commune_desc:0 "Хоча Паризька комуна була недовгою, вона була першою спробою створити комуністичне суспільство на французькій землі."
 FRA_extra_research_slot_2:0 "Сформувати Національний дослідницький центр"
 FRA_firepower_kills_desc:0 "Уроки Великої війни були настільки ж простими, як і жорстокими: часи, коли люди воювали один з одним через відкриті приціли, минули. Сьогодні вбивство здійснюється в масових масштабах за допомогою найсучаснішої зброї на великій відстані."
 FRA_force_the_issue_desc:0 "Ми далеко пішли з моменту створення «Народного фронту». Але ми не можемо залишати нашу роботу наполовину. Настав час для всіх ліворуч зробити вибір і стати на позицію — або з революцією, або проти неї."
