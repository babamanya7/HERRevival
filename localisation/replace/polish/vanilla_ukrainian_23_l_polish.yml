 GRAND_DOCTRINE_BATTLEFIELD_SUPPORT_DESC:0 "Методи та навчання для тісної співпраці армії та ВПС, де авіаудари діють як летюча артилерія, прокладаючи шлях для швидких наземних операцій."
 GRAND_DOCTRINE_CONVOY_RAIDING:0 "Перехоплення торгівлі"
 GRAND_DOCTRINE_GRAND_BATTLEPLAN:0 "Глобальне планування"
