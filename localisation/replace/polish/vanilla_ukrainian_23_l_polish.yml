 BUL_oppose_the_royal_dictatorship_desc:0 "Якщо ми хочемо покінчити з репресивним режимом [GetBulgarianTsar], ми мусимо почати з пошуку необхідної підтримки, щоб виявити значну опозицію нинішньому уряду, який повністю складається з царських маріонеток."
 BUL_opression_anti_bzns_speech_desc:0 "Ми влаштуємо мітинг, де висловимо свій протест $BUL_bzns_name_dat2$ і свою зневагу до його організації та антиурядової позиції."
 BUL_overthrow_the_tsar:0 "Скинути царя"
 BUL_pressure_to_lift_army_restrictions_desc:0 "Ми мусимо натиснути на державу [ENG.GetNameDef], щоб вона нарешті погодилася зняти всі обмеження, накладені на нашу армію."
 BUL_reorganize_the_military_industry:0 "Реорганізувати військову промисловість"
 BUL_repress_imro_persecute_activists:0 "Переслідувати активістів ВМРО"
 BUL_the_fatherland_front_desc:0 "Отримавши значну підтримку з боку численних політичних груп, настав час, щоби наш антифашистський фронт перетворився на політичний рух сам по собі, об'єднавши членів усіх цих різних політичних організацій в одну партію, налаштовану протистояти фашизму в Болгарії будь-якою ціною."
 BUL_treaty_of_perpetual_friendship:0 "Договір про вічну дружбу"
 BUL_tsar_leads_diplomatic_mission:0 ", на чолі якої стояв сам цар [BUL.GetLeader],"
 BUL_vasil_levsky_national_military_university_desc:0 "Національний військовий університет має довгу історію, але його військова освіта різко скоротилася після прийняття Ньойїського договору. Настав час профінансувати проєкт розширення їхньої бази та заохочення набору нових курсантів, які з часом стануть успішними офіцерами."
