 germany.16.a:0 "Ми були дурнями, раз довірилися фашистам!"
 germany.40.d_2:0 "Недавно були висунуті вимоги німців до Чехословаччини про передачу Судетської області, де проживає помітна кількість етнічних німців. [GER.GetLeader] розмістив війська на чехословацькому кордоні, готуючись до війни. Оскільки ми довели, що не підтримуємо німецький експансіонізм, у нас тепер з'явився новий союзник у війні проти Німеччини."
 germany.41.d:0 "Недавно були висунуті вимоги німців до Чехословаччини про передачу Судетської області, де проживає помітна кількість етнічних німців. [GER.GetLeader] розмістив війська на чехословацькому кордоні, готуючись до війни. Зараз у Мюнхені проводяться переговори між Британією, Францією, Італією та Німеччиною для досягнення мирного закінчення Судетської кризи.\n\nБританці запевнили нас, що не будуть воювати через «у далекій від нас країні». Чи варто нам слідувати їхньому прикладу, або ми виконаємо наші зобов'язання перед Чехословаччиною, надавши їм підтримку?"
 germany.5.b:0 "Відмовитися"
 germany.53.d:0 "Не задовольнившися крадіжкою Судетів, німці тепер вирішили зайняти решту наших земель. Покинуті своїми так званими союзниками, і після втрати своїх найкращих укріплень унаслідок Мюнхенського диктату наша ситуація видається безнадійною..."
