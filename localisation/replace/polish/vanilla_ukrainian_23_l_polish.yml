 usa.47.t:0 "Слухання у Палаті про неправомірну поведінку президента"
 usa.5.d:0 "Незважаючи на наші приготування та добрі наміри, Британія відмовилася від нашої пропозиції старих есмінців в обмін на їхні морські бази."
