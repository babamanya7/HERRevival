 uk_protect_suez_desc:0 "Контроль над Суецьким каналом є частиною засобів, за допомогою яких Британська імперія утримує панування на морі. Втрата цього регіону була б катастрофою. Необхідно вжити заходів для його укріплення."
 uk_sanction_italy_focus_desc:0 "Муссоліні мріє про нову Римську імперію і, як би абсурдно це не звучало, може одного дня напасти на нас, щоб утілити свою мрію. Ми мусимо зробити все можливе, щоб уникнути цього до того, як дійде до війни."
