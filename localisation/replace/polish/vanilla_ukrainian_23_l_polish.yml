 ace_promoted.1.d:0 "Мало хто ризикує так само, як відважні пілоти [Root.GetAdjective]их повітряних сил. [From.GetName] [From.GetSurname], досвідчений пілот, відомий під позивним [From.GetCallsign], відзначи[From.GetVerbGendEndA_RU]ся тим, що не лише поверну[From.GetVerbGendEndA_RU]ся живим із недавньої місії над регіоном [From.GetMissionRegion], але й пережи[From.GetVerbGendEndA_RU] значні перемоги в багатьох критичних зустрічах.\n\nНещодавнє підвищення пілота, яке вважалося яскравим прикладом [Root.GetAdjective]ої мужності, було широко розголошено. Хоча люди можуть розглядати війну більше як пекло, ніж славу, багато хто радий бачити, що є ще герої, навколо яких можна згуртуватися."
