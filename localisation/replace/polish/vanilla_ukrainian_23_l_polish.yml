 INS_loyalist_events.27.desc:0 "Уряд [FROM.GetAdjective] відмовився. Їхня власна боротьба за незалежність занадто недавня і занадто дорога для них, щоб передати свій суверенітет іншій державі. Пропозиція була відкладена."
 INS_militias_jakarta_pemuda_mission:0 "Джакартські Пемуда вимагають покращення освіти"
 INS_political_events.18.t:0 "Тан Малака повертається до Індонезії"
 INS_political_events.3.t:0 "[FROM.GetName] погоджується відмовитися від [721.GetName]"
 INS_political_events.7.desc:0 "Петиція Фольксрааду, організована Сутарджо, яка вимагає проведення круглого столу між голландськими та індонезійськими представниками для обговорення прагнення Індонезії до автономії, завершила внутрішнє обговорення, і петиція надійшла на затвердження генерал-губернатору. Хоча багато радників наполягають на тому, що статус-кво має бути збережено, і тому на петицію слід накласти вето, не можна заперечувати, що націоналістичні рухи стають лише сильнішими та радикальнішими. Якщо ми продовжимо відмовляти у кожному мирному проханні про автономію, націоналісти можуть натомість почати випробовувати більш насильницькі альтернативи."
 INS_pontianak_to_balikpapan:0 "Від Понтіанака до Танджунгселора"
 INS_prioritize_sugar_economy:0 "Пріоритет цукрової економіки"
 INS_recognize_moestopos_batallion:0 "Визнання батальйону Мустопо"
 INS_restore_order_in_indies:0 "Відновити порядок в Ост-Індії"
 INS_revolution_events.24.a:0 "Це виглядає не дуже добре."
 INS_revolution_events.26.t:0 "Кінець війни в Індонезії"
 INS_revolution_events.39.a:0 "Світ стоїть з нами."
 INS_revolution_events.4.t:0 "[ENG.GetNameDefCap] відхиляє Лондонсько-Батавську угоду"
 INS_revolution_events.9.t:0 "Декларація незалежності Індонезії"
 INS_revolution_planning_cat_map_name:0 "Оберіть, де керувати діяльністю ополчення"
 INS_rubber_for_mil:0 "Продати каучук для фінансування розширення військової промисловості"
 INS_soetardjo_petition_desc:0 "Конференція круглого столу, до якої закликав Сутарджо, відбулася, завершившись висновком, що [INS.GetNameDef] має відповідати низці економічних вимог для забезпечення самодостатності. Ми повинні продемонструвати чіткий прогрес на шляху до цих цілей, інакше [HOL.GetNameDef] зрештою скасує це рішення, щоб зберегти статус-кво."
 INS_soviet_aid:0 "Радянська допомога"
 INS_spend_profits_on_military:0 "Витрачати прибутки на військовий розвиток"
 INS_subsidize_laskar_armament_desc:0 "Ополченці, що б'ються бамбуковими списами, не виживуть довго проти важкоозброєних підрозділів. Нам потрібно надати пріоритет виробництву більшої кількості зброї та боєприпасів для цих ополчень."
 INS_vice_presidential_edict_desc:0 "Національний комітет майже одностайний у своїй вимозі реальної законодавчої влади. Президенту було передано петицію, що пропонує гібридну систему, де Національний комітет стане незалежним парламентом, поділяючи спільні законодавчі повноваження з Президентом. Пропозиція приваблива, але існує ризик того, що влада Президента стане незначною."
 INS_volksraad_decisions_no_reject:0 "[HOL.GetFlag][HOL.GetNameDefCap] більше не може накладати §Yвето§! на рішення Фольксрааду"
 INS_volksraad_events.11.desc:0 "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INTEL_DOCKYARDS_USED_ON_SCREEN:0 "Припущена к-сть верфей для виробництва кораблів прикриття"
 INTEL_FROM_ALLIES:0 "Від союзників: $AMOUNT|.2+%%$"
 INTEL_IS_TOO_LOW:0 "Наших розвідданих замало, щоб отримати інформацію про те, чого вони вже досягли у своєму дереві фокусів."
