 tfv_australia.95.t:0 "Націоналісти на підйомі в Індонезії"
 tfv_canada.40.t:0 "План панування"
 tfv_canada.41.d:0 "[MEX.GetAdjectiveCap]ий уряд повністю згоден із загрозою, яку несе нашим країнам агресивна політика наших південних сусідів. Єдиний спосіб вижити — це розірвати їхній зашморг на континенті. Ми мусимо вдарити якнайшвидше — до того, як вони встигнуть завершити переозброєння. Звісно, доведеться піти на певні територіальні поступки нашим новим друзям, але разом ми покладемо край [USA.GetAdjective]ій гегемонії!"
 tfv_canada.51.t:0 "Чергова атака"
 tfv_canada.72.a:0 "Вони ж усвідомлюють, що це шкодить нашим відносинам?"
 tfv_raj.201.a:0 "Бийте з небес, браття!"
 tfv_raj.210.desc:0 "Місцеві робітники саме пішли на обід, коли на одному з наших заводів пролунав потужний вибух. Значної шкоди було завдано самій будівлі, а кілька робітників були поранені уламками скла. На щастя, верстати, схоже, залишилися загалом неушкодженими. Поліція та військові частини побудували периметр, поки слідчі розбирають завали в пошуках ключів до причини вибуху.\n\nХодять чутки, що це була робота осередку опору руху «Геть із Індії», який перетворив свій протест на насильство у своїй боротьбі за свободу."
 tfv_raj.30.t:0 "Індійські комуністи просять підтримку"
 tfv_raj.31.desc:0 "[SOV.GetAdjectiveCap]ий посол сьогодні відвідав Міністерство закордонних справ, щоб обговорити питання незалежності Індії. Під час зустрічі він чітко дав зрозуміти, що [SOV.GetNameDef] вважає наше подальше панування над Індією абсолютно неприйнятним. Схоже, що слова Боса знайшли відгук у лідера [SOV.GetLeader] і схилили росіян на його бік.\n\nНаразі [SOV.GetAdjective]а влада, схоже, обмежується тренуванням індійських добровольців у своїй країні, але вони цілком можуть втрутитися в будь-який конфлікт, що виникне на субконтиненті."
 tfv_raj.43.t:0 "[GER.GetNameDefCap] відмовляється допомагати"
 tfv_south_africa.14.a:0 "Зв'яжіться з нашими німецькими друзями."
 tfv_south_africa.14.desc.a:0 "Наша делегація до держави [HOL.GetNameDef] була розчарована нескінченними перешкодами та затримками. Зустрічі з [HOL.GetAdjective]ими посадовцями та керівниками галузі скасовуються в останню хвилину, дзвінки не передзвонюють, на телеграми не відповідають. Складається враження, що [HOL.GetAdjective]ий уряд насправді не зацікавлений у тому, щоб допомогти нам у наших зусиллях."
 tfv_south_africa.4.t:0 "Африканський компроміс"
 tfv_south_africa.63.d:0 "Звільнившися з-під влади колоніальних гнобителів, [ZIM.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [ZIM.GetAdjective]ого уряду."
 tfv_south_africa.93.d:0 "Звільнившися з-під влади колоніальних гнобителів, [SIE.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [SIE.GetAdjective]ого уряду."
