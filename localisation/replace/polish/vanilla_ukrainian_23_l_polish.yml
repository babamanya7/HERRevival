 INSHOL_east_indies_cruiser_manufacturing_desc:0 "Виробництво власних крейсерів замість замовлення їх безпосередньо у голландців — це перший крок до формування справжнього флоту, необхідне зусилля з огляду на японську загрозу."
 INSHOL_flag_will_fly_again:0 "Прапор замайорить знову"
 INSHOL_investments_in_civ_railways:0 "Інвестиції в цивільні залізниці"
 INSHOL_knil_engineers_desc:0 "Ми не повинні зосереджувати всі наші зусилля на виробництві піхоти та гвинтівок, і пам'ятати, що логістика та зв'язок відіграють важливу роль у виграші битв. Ми повинні навчати інженерів та фінансувати професійно-технічні школи Батавії, щоб наша армія не була обмежена поганою логістикою."
 INSHOL_manado_military_academy_desc:0 "Створення військової академії за межами Яви допоможе значно пом'якшити наш дефіцит людських ресурсів, зробивши призов реальним на східних островах. Макасар, розташований приблизно в центрі Ост-Індії, є ідеальним місцем для цього."
 INSHOL_produce_own_goods:0 "Виробництво власних товарів"
 INS_JAP:0 "Defenders of Homeland"
 INS_arm_militias_desc:0 "Листівки та промови можуть просунути революцію лише до певної межі. Коли настане момент, наші товариші в [FROM.GetName] повинні мати можливість битися. Надлишки зброї та припасів мають бути таємно переправлені прихильним до нас загонам ополчення, щоб сили реакції зіткнулися з озброєним населенням, а не з беззахисним."
 INS_bio_pharma_name_nationalized:0 "Bio Farma"
 INS_communist_events.3.desc:0 "Старий уряд у [FROM.GetName] капітулював. Зіткнувшись із повним масштабом революційного руху та певним знанням того, що за ним стоїть [ROOT.GetNameDef], вони не бачили іншого шляху вперед, окрім підкорення. Влада була передана місцевій комуністичній партії, і новий уряд вже почав звертатися до нас за керівництвом. Ще одна нація була звільнена від хватки старого порядку."
 INS_cost_text_rubber_32_blocked:0 "£resources_strip|3 §R32§!"
