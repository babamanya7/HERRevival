 CHI_sea_commit_to_korean_independence_desc:0 "$CHI_commit_to_korean_independence_desc$"
 CHI_sea_dominate_japan:0 "$CHI_dominate_japan$"
 CHI_sea_dominate_siam_desc:0 "Сіам залишається однією з небагатьох націй в Азії, не окупованих іноземною державою. Ми повинні захистити їх від цих іноземних держав, запропонувавши їм наш захист і, у свою чергу, взяти контроль над їхньою нацією."
 CHI_sea_give_falkenhausen_citizenship_desc:0 "$CHI_give_falkenhausen_citizenship_desc$"
 CHI_sea_industrial_evacuations:0 "$CHI_industrial_evacuations$"
 CHI_sea_local_bomber_production:0 "$CHI_local_bomber_production$"
 CHI_sea_new_model_province:0 "$CHI_new_model_province$"
 CHI_sea_personal_leadership_desc:0 "$CHI_personal_leadership_desc$"
 CHI_sea_refugee_relief_agency:0 "$CHI_refugee_relief_agency$"
 CHI_sea_refugee_resettlement_desc:0 "$CHI_refugee_resettlement_desc$"
 CHI_sea_renounce_the_mcmahon_line:0 "$CHI_renounce_the_mcmahon_line$"
 CHI_sea_secure_the_peninsula:0 "$CHI_secure_the_peninsula$"
 CHI_sea_the_army_desc:0 "Із завершенням армійської реформи ми нарешті можемо сказати, що ми не просто польовий командир зі своєю бандою солдатів, а радше командувач зі своєю армією, готовий прийняти будь-які загрози, що можуть трапитися на нашому шляху."
 CHI_sea_three_principles_of_the_people:0 "$CHI_three_principles_of_the_people$"
 CHI_secure_internal_politics:0 "Контроль над внутрішньою політикою"
 CHI_set_up_an_nco_school:0 "Створити школу унтерофіцерів"
 CHI_take_a_stance_on_illicit_trade_desc:0 "Занадто довго ми були залежні від отрути, що просочується крізь наше суспільство, і тих, хто нею торгує. Ми повинні відкинути цю спокусу, щоб вийти сильнішими та з яснішим розумом у нове століття процвітання."
 CHI_tank_plant:0 "Танковий завод"
 CHI_tour_the_north_desc:0 "Гірські внутрішні регіони стали центром комуністичної агітації. Цього не можна дозволити продовжувати, і ми повинні заявити про свою присутність, подорожуючи провінціями."
 CHI_warlord_economic_support_flag:0 " Нещодавно запропонована §Yекономічна підтримка§!"
 CHI_warlord_propaganda_army:0 "Продемонструвати боєздатність армії"
 CHI_whampoa_ideological_primacy_desc:0 "З Вампу наші офіцери несуть не лише зброю, а й принципи. На відміну від догматів інших шкіл, тим, що з Вампу, можна довіряти. Ми повинні спрямувати всю ідеологічну підготовку через школу, щоб зміцнити нашу націю в цілому."
 CHL_1938_chilean_presidential_election_tt:0 "Коли §Yпрезидентські вибори§! стануться в пізньому §Yжовтні 1938 року§!, цей фокус буде виконано автоматично."
 CHL_battleship_1:0 "Клас «Almirante Latorre»"
 CHL_criticize_liberal_complacency:0 "Критикувати безтурботність лібералів"
 CHL_dissolve_covensa_desc:0 "Створення компанії з розподілу внутрішніх ресурсів COVENSA було помилкою, і ми всі це знаємо. Єдиний вірний спосіб вирішити наші економічні проблеми — це перезапустити наш масштабний експорт, а для цього ми мусимо ліквідувати цю організацію та реформувати її так, щоби вона більше нагадувала COSACH, свою попередницю."
 CHL_house_of_orelie:0 "Дім Орелі"
 CHL_hub_of_the_world_revolution_desc:0 "Є багато революціонерів, яких не влаштовує нинішній стан світу, і, що більш важливо, які можуть бути розчаровані станом Радянського Союзу. Ми мусимо прагнути до кращого світу, разом!"
 CHL_integrate_central_america:0 "Інтегрувати Центральну Америку"
 CHL_integrate_northern_france:0 "Відновити правління в північній Франції"
 CHL_joint_research_initiatives_tt:0 "§YЧилі§! та кожна держава в альянсі з нами долучиться до §Yгрупи обміну технологіями§!."
 CHL_mapuche_liberate_maya:0 "Визволити [MAY.GetAdjective]ий народ"
 CHL_mapuche_liberate_samoa:0 "Визволити [SAM.GetAdjective]ий народ"
 CHL_mapuche_liberate_tahiti:0 "Визволити [TAH.GetAdjective]ий народ"
 CHL_mapuche_reconcilliation_campaigns_desc:0 "Мапуче зазнавали жорстокого поводження з боку наших урядів іще з часів завоювання Арауканії в 19 столітті. Ми мусимо докласти значних зусиль, щоби покращити їхнє становище та гарантувати, що вони зможуть жити в мирі разом зі своїми співгромадянами в Чилі."
 CHL_mapuche_reconcilliation_decisions_desc:0 "Відтоді, як чилійський уряд завоював цей регіон у процесі умиротворення Арауканії між 1861 і 1883 роками, тубільний народ мапуче залишився витісненим і незадоволеним своїм становищем, і це небезпідставно. Саме тому ми мусимо боротися за їхні права та вирішити це питання раз і назавжди!"
 CHL_news_events.3.b:0 "Ми — нова світова держава!"
 CHL_news_events.3.t:0 "Формування [CHL.GetNameDefCap]"
 CHL_political_events.1.t:0 "[CHL.GetNameDefCap] пропонує взаємний альянс"
 CHL_political_events.16.t:0 "Президентські вибори 1942 року"
 CHL_political_events.17.t:0 "Президентські вибори 1946 року"
 CHL_political_events.18.a:0 "Карлос Фуентес Рабе"
 CHL_political_events.25.a:0 "Ми повинні приєднатися до них!"
 CHL_political_events.56.desc:0 "Уряд у [ARG.GetNameDef] вирішив бути розумним і передав його нам у належний спосіб. Тепер настав час продовжувати тиск і просувати наші претензії, доки ми не зможемо створити ідеальну [CHL.GetAdjective] державу."
 CHL_political_events.63.a:0 "Це не завадить нашому прогресу"
 CHL_political_events.75.desc:0 "[CHL.GetLeader] з [CHL.GetNameDef] звернувся до нас із пропозицією. Оскільки економічна криза в [CHL.GetName] ще далеко не закінчена, йому терміново потрібні кошти, і він попросив, щоб ми викупили у них штат Аріка, який вони забрали у нас у мирному договорі, підписаному після Тихоокеанської війни, який вони тепер вважають несправедливим та незаконним. Чи приймемо ми його пропозицію?"
 CHL_political_events.87.a:0 "Два — це більше, ніж один"
 CHL_press_our_demands_tt:0 "Надсилає вимоги незаконним окупантам Гвіани §Yпримусово визнати наше володіння§! областями."
 CHL_reestablish_the_republican_guard:0 "Відновити Республіканську гвардію"
 CHL_return_to_the_continent_desc:0 "Нинішній французькій системі притаманна слабкість, і ми тут для того, щоби скористатися нею. Настав час знову повернутися на континент і відвоювати своє право!"
 CHL_ship_torpedo_1:0 "3x 533-мм торпедний апарат"
 CHL_suppress_the_nacistas_desc:0 "Національно-соціалістичний рух останнім часом активізувався, і цілком очевидно, що вони спробують щось зробити в найближчому майбутньому. Ми мусимо залишатися пильними і придушувати будь-яке інакомислення, хай де б воно з'явилося."
 CHL_take_loans_for_economy_2:0 "$CHL_take_loans_for_economy$"
 CHL_the_patagonian_giants_desc:0 "Патагони, або патагонські велетні, — це раса людей-велетнів, які, за чутками, жили в Патагонії та були описані в ранніх європейських описах і, як кажуть, щонайменше вдвічі перевищували нормальний людський зріст. Попри те, що ці чутки не відповідають дійсності, ми мусимо прагнути до того, щоби наші збройні сили відповідали образу цих велетнів і вселяли страх в очі наших ворогів."
 CHL_they_shall_not_pass:0 "Вони не пройдуть"
 CHL_unite_hispanic_america:0 "Об'єднати гіспанську Америку"
 CHL_unlocks_various_communist_advisors:0 "§YРізні комуністичні радники почнуть співпрацювати з мапуче і стануть доступними для найму.§!"
 CHL_utilize_national_populism:0 "Використати націонал-популізм"
 CHOOSE_EXISTING_FOLDER:0 "Оберіть існуючу папку:"
 CHU_communism_party_long:0 "Чуваська більшовицька партія"
