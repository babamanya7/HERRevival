 CONVEYOR_ASSIGN_ORDER_SELECT_AREA:0 "§GКлацніть§! на наказ армії або портрет командира, щоби призначити розгортання військ."
 CONVEYOR_LINE_DEPLOY_DESC:0 "§GКлацніть§!, щоби миттєво розмістити цю лінію."
