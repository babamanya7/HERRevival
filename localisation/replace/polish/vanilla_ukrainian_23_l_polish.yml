 RAJ_the_great_recovery_desc:0 "Шрами Великої депресії залишилися на нашій економіці, уповільнюючи прогрес та підриваючи довіру. Але тепер, з оновленою стабільністю та баченням, ми скинемо тягар стагнації. Це буде не просто повернення до нормального життя, це початок нової глави для [ROOT.GetNameDef]."
 RAJ_the_red_curtain_falls_over_asia_desc:0 "Ми забезпечили нашу батьківщину.\nНастав час нести полум'я революції нашим сусідам словом, брошурою або зброєю."
