 SOV_SH_battleship_1:0 "Клас «Советский Союз»"
 SOV_SH_battleship_1_desc:0 "The Sovetsky Soyuz-class (Project 23) was the last class of battleships built by the Soviet shipyards and were authorized in the 1938-43 shipbuilding program. Four ships were planned with a standard displacement of 59,000 tons, three triple turrets carrying 406mm cannons, and a heavy secondary and AA armament. They also had strong engines to accommodate their very thick belt armor. The outbreak of the war prevented these ships from being completed."
 SOV_SOS_civil_war_divisions_tt:0 "Якщо громадянська війна почнеться зараз, [?SOV.SOV_centre_army_support|%Y0] армії, [?SOV.SOV_centre_navy_support|%Y0] флоту й [?SOV.SOV_centre_air_support|%Y0] авіації лишаться лояльні лідеру [SOV.GetLeader].\n----\nЯкщо параноя вища ніж §R90%§!, щодня існує ризик §Y20%§!, що Сталін почне війну.\n"
 SOV_THE_LONELY_ISLAND_NAME_NORMAL:0 "Самотній острів"
 SOV_army_framejob:0 "Підставити офіцера армії"
 SOV_army_framejob_desc:0 "Поширюючи чутки про генералів, лояльних до лідера [ROOT.GetLeader], і передаючи деякі фальшиві «докази» в руки НКВС, ми зможемо на деякий час відвернути увагу від себе. Як бонусний ефект, якщо нам пощастить, інші військовослужбовці можуть бути незадоволені репресивними діями."
 SOV_artillery_equipment_2:0 "107-мм пушка обр. 1940"
 SOV_assassinate_stalin_bad_tt:0 "Буде здійснений замах на Сталіна.\nШанс успіху: §Y50%§!\n £trigger_yes base: 50%\n £trigger_no $SOV_infiltrate_the_nkvd$: +30%"
 SOV_battleship_4_desc:0 "The Stalingrad class (Project 82) capital ships were intended to provide the Soviet navy with its primary firepower in the post WWII era. They were fast, well-armed, and well-armored vessels. Construction started after the war, but the death of Josif Stalin led to the cancellation of these ships, though there were projects to finish at least one as a modified design equipped with Soviet V-2 missiles."
