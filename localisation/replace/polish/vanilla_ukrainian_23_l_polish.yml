 SWI_prolonged_service_desc:0 "Наш поточний термін обов'язкової служби недостатній для боротьби з довготривалою війною, ми повинні дати федеральному уряду інструменти, щоби довше тримати наших громадян під зброєю, навіть якщо це означає пожертвувати деякими свободами."
 SWI_promoting_to_president_TT:0 "\n§Y[?SWI.temp_character_president.GetName]§! буде усунутий із посади політичного радника й обраний президентом держави [SWI.GetNameDef]. Після обрання нового президента через рік §R[?SWI.temp_character_president.GetSheHe] більше не буде доступний як політичний радник або президент Конфедерації.§!"
 SWI_seize_democratic_gold:0 "Захопити золото демократичної держави"
 SWI_share_spy_networks_desc:0 "Мета [?SWI.SWI_best_dem_ally.GetNameDefCap] така ж, як і наша, — утримати фашизм на відстані, і нам не потрібно протидіяти [?SWI.SWI_biggest_fascist.GetNameDef], щоб її досягти. [ROOT.GEtName] має доступ до досвідчених оперативників, які можуть влитися в товариства [GER.GetAdjective], [ITA.GetAdjective] і [FRA.GetAdjective]; Ми можемо надати цю перевагу [?SWI.SWI_best_dem_ally.GetNonIdeologyName]."
