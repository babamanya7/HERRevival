 INS_dominion_of_atjeh:0 "Домініон Ачех"
 INS_education_subsidies_desc:0 "Інвестиції в майбутнє молоді нації абсолютно необхідні, якщо ми хочемо економічно успішної держави. Ми будуватимемо доступні школи по всій республіці."
 INS_fair_election:0 "Чесні вибори"
 INS_fighter_equipment_2:0 "Brewster B-339C"
