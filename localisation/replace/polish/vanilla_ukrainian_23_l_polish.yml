 form_greater_german_reich_category_desc:0 "Наші вороги були схилені перед нами, і наші цілі експансії на Схід були досягнуті. Зараз настав час, щоби світ усвідомив велич нашої нації і розпочати перетворення нашої столиці на те, на що всі можуть дивитися з гордістю."
