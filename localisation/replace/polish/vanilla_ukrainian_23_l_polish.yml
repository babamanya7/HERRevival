 ETH_liberate_aussa_desc:0 "[AFA.GetNameDefCap] керує підступна олігархія, яка неодноразово ставала на бік наших ворогів. Таку загрозу для [ETH.GetNameDef] більше не можна ігнорувати. Ми звільнимо [AFA.GetAdjective]ий народ та інтегруємо регіон до нашої робочої республіки."
