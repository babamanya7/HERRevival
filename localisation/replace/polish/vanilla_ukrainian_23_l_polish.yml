 GER_a_new_and_better_germany_desc:0 "Займаючись відновленням країни, ми маємо прагнути досягти нових висот. Держава, яку ми збудуємо, має витримати випробування часом."
 GER_aid_hun_rom_democratic_civil_war:0 "Молоді демократії"
 GER_armored_car_at_equipment:0 "Sdkfz 234/4 «Pakwagen»"
 GER_asia_revive_the_schutztruppe_tt:0 "Відімкне колоніальні ополчення §YSchutztruppe§! та сукупність рішень із їх §Yвербування§! та §Yполіпшення§! в §YАзії§!."
 GER_assist_our_eastern_comrades:0 "Допомогти східним товаришам"
 GER_build_defense_industry_desc:0 "Після того, як ми нарешті змогли стабілізувати і навіть у багато разів зміцнити нашу економіку, тепер ми можемо звернути свою увагу на забезпечення суверенітету нашої держави і побудову належної оборонної промисловості, захищаючи працьовитість німецького народу і його прагнення до прогресу і досконалості."
 GER_build_the_rur_dam:0 "Збудувати Рурську греблю"
 GER_communism_arbeit_party_long:0 "Комуністична робітнича партія"
 GER_controls_dnieper_rive_tt:0 "§Y[ROOT.GetName]§! або наш союзник повністю §Yконтролює§ всі регіони вздовж §YРічки Дніпро§! від регіону §Y[813.GetName]§! по регіон §Y[200.GetName]§!."
 GER_crossing_the_atlantic_desc:0 "Зламавши весь опір на континенті, нам доведеться переорієнтувати військово-промисловий комплекс на створення могутнього флоту, щоби бути готовими до протистояння з Британією та США. Ми не відступимо, допоки, у благословенний Богом час, Старий світ, із усією його силою та могутністю, не підпорядкує Новий своїй волі."
 GER_cv_CAS_equipment_2_short:0 "Ju 88 C"
 GER_danzig_for_guarantees:0 "Данциг в обмін на гарантії"
 GER_demand_sudetenland_rejected:0 "Чехословаччина відхилила передачу Судетів"
 GER_democratic_shield_desc:0 "Демократії знову перебувають під загрозою по всьому світу, як і колись у нашій країні. Ми знаємо, що означає авторитаризм, і повинні зробити все можливе, аби інші народи не пережили подібного."
 GER_division_estonia_mot_tt:0 "§YМоторизована§! частина §Y20. SS-Division§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_effective_operations_desc:0 "Оскільки Штазі зростає, ми маємо розширити сферу її діяльності. Місії за межами [ROOT.GetAdjective] кордонів так само важливі для нашої безпеки, як і ті, що здійснюються в межах країни."
