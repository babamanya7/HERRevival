 lar_congress_of_paris.3.desc:0 "Делегація держави [From.GetNameDef] загалом згодна з запропонованими територіальними змінами. Потрібно ще пропрацювати декілька малих деталей і обговорити точне розташування нового кордону, але великих проблем, які завадять підписанню угоди, наші дипломати не передбачають."
 lar_congress_of_paris.5.a:0 "Якщо вони готові заплатити обговорену ціну, ми готові виконати свої обо'язки."
