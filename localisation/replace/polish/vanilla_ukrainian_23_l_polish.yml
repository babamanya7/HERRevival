 sp_air_supersonic_jet_desc:0 "Здобутки в технології реактивних двигунів прокладають шлях до літаків, здатних досягати швидкості 1 маха та долати звуковий бар'єр."
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc:0 "$lc_high_impact_obliterator_cannon_desc$"
 sp_helicopter_artillery_observers_tech_desc:0 "Вертольоти здатні зайняти вигідну позицію над полем бою незалежно від рельєфу місцевості, тому вони є чудовими розвідниками, які надають точну інформацію для артилерійського вогню."
 sp_land_generic_reward_major_progress_1:0 "Багатообіцяючий прототип"
 sp_land_generic_reward_option_armor_tech_desc:0 "Останні розробки в проєкті «[SpecialProject.GetName]» під керівництвом [Character.GetName] уможливили значний прогрес у суміжних галузях. Ці відкриття докорінно змінюють військові спроможності, торуючи шлях до ефективніших і грізніших стратегій сухопутної війни."
 sp_land_reward_land_cruiser_turret_desc:0 "Величезна конструкція з декількома баштами викликає серйозні проблеми з вирівнюванням і прицілюванням, що затримує інтеграцію зброї. Команда інженерів рекомендує спростити компонування башт для підвищення надійності, але це зменшить заплановану вогневу потужність проєкту «[SpecialProject.GetName]»."
