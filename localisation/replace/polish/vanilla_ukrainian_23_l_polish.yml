 BRA_petropolis_line_desc:0 "Педру джі Алкантара колись був лідером вигнаного Імператорського дому Бразилії, перш ніж відмовився від усіх претензій на трон, щоб одружитися з графинею Елізабет Добрженською. Зі зростанням руху за відновлення монархії, він тепер стверджує, що його відмова була нелегітимною, і що він є законним спадкоємцем трону."
 BRA_radicalize_the_proletariat_desc:0 "Наша остання спроба захопити владу провалилася значною мірою через те, що ми не мали достатньо скоординованої підтримки з боку робітників. Ми повинні поширити наше повідомлення серед них та забезпечити їхню найвищу лояльність до нас."
