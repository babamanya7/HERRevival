 ETH_host_country_decision_tt:0 "§Y[ROOT.GetLeader]§! зможе встановити §Yуряд у вигнанні§! в державі §Y[FROM.GetNameWithFlag]§!, якщо фокус §Y$ETH_boarding_the_train$§! був виконаний до капітуляції.\n\nВідмикає додаткові фокуси, які будуть доступні для уряду у вигнанні в державі [FROM.GetNameDef]."
