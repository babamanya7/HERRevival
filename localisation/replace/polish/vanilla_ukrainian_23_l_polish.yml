 EST_events.1.d:0 "Побоюючись [SOV.GetAdjective] вторгнення, [From.GetLeader] ініціює формальний запит про договір між державами [Root.GetNameDef] та [From.GetNameDef]. Такий договір має стати гарантією взаємного ненападу, а також забезпечити посилення співпраці між країнами [Root.GetNonIdeologyName] та [From.GetNonIdeologyName]."
 EST_events.101.t:0 "[From.GetNameDefCap] погоджується"
 EST_events.5.d:0 "[From.GetLeader] has today announced an outright attack on the [Root.GetAdjective] government, claiming it to be weak and ineffective at defending its own people from foreign imperialists. Though this means little right now, we can anticipate that a [From.GetAdjective] invasion is on the horizon."
 EST_events.802.d:0 "Марш партії [Root.GetFascistParty] в області [?ROOT.vaps_from.GetName] пройшов відносно спокійно. спромоглася продемонструвати місцевим жителям цілі свого руху, уникаючи при цьому нападок з боку [Root.GetAdjective] влади."
