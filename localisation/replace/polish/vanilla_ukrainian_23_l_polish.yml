 SLV_AUS_danubian_state_ADJ:0 "Словено-дунайськ"
 SMB_air_force_PAR:0 "Fuerza Aérea Paraguaya"
 SMB_aircraft_carriers_desc:0 "Аби не залишитися позаду наших ворогів, ми мусимо включити авіацію до складу нашого флоту. Для цього нам потрібно будувати власні авіаносці. Використання корпусів наших більших, застарілих кораблів може бути способом прискорити їх виробництво."
 SMB_army_desc:0 "[SMB_army_desc_key]"
 SMB_expand_repair_yards_desc:0 "Навіть найміцніші кораблі з найефективнішими екіпажами рано чи пізно потребуватимуть ремонту перед поверненням до бойового складу. Ми мусимо інвестувати в наші морські ремонтні верфі, аби забезпечити якомога швидший процес."
 SMB_flying_fortress_default_desc:0 "Єдиний спосіб правильно використовувати військово-повітряні сили — це бомбардувати ворога, допоки на горизонті не залишиться нічого, що могло б стояти на місці. Тому ми мусимо будувати великі літаки, здатні нести стільки вибухівки, скільки нам може знадобитися."
 SMB_foreign_advisors_desc:0 "[SMB_foreign_advisors_desc_key]"
 SMB_mountain_guns:0 "Інвестувати в гірські гармати"
 SMB_purchase_aircraft_tt:0 "Буде відкрите рішення §YПридбати літаки§! from foreign powers"
 SMB_special_forces_BRA:0 "Comando de Operações Especiais"
 SMB_special_forces_option_3_default_desc:0 "Оскільки військово-повітряні сили є однією з наших наразі сильних сторін, було б більш ніж вигідно використати цей факт і дозволити їм мати власний військовий підрозділ, який складається зі спеціально вишколених і надзвичайно ефективних десантників."
