 PAR_fedrerista_land_reforms_desc:0 "Нам потрібно провести серйозні земельні реформи, щоб розширити права фермерів та перерозподілити їхню землю від могутніх землевласників."
 PAR_nazify_the_army:0 "Нацифікувати армію"
 PAR_put_estigarribia_on_a_pedestal_desc:0 "Хосе Фелікс Естігаррібія широко розглядається як герой Чакської війни, а тепер як ключова фігура, що виграла громадянську війну. Ми використаємо його для пропагандистських цілей, щоб зменшити заворушення громадянської війни та об'єднати країну, а також винагородимо його за його службу."
