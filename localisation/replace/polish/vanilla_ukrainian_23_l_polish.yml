 ESU_POR_unified_communism_DEF:0 "Іберійський соціалістичний союз"
 ETH_african_central_bank_desc:0 "Створивши [ETH_GetCentralBankName], ми могли б розпочати процес інтеграції економік в Організацію африканської єдності. Це дозволить нам більш ефективно використовувати наші ресурси та інфраструктуру для поліпшення всіх держав-членів."
 ETH_an_arabic_base_desc:0 "Стає все більш очевидним, що [JAP.GetName] має намір змінити Азійсько-Тихоокеанський регіон у найближчі роки. Оскільки ми все більше узгоджуємося з [JAP.GetAdjective], має сенс вирізати для себе частину. Для початку ми повинні запросити контроль над землями наших предків на Аравійському півострові."
 ETH_anarchist_dominant_range:0 "Анархісти панують у політиці"
 ETH_anti-italian_propaganda_desc:0 "Хоча ми дуже цінуємо гостинність наших господарів, які дозволили Імператору безпечно проживати тут, вони могли б зробити більше для прискорення звільнення нашого народу від фашистської окупації. Нам потрібно дати їм зрозуміти про жахи, які [ITA.GetAdjective]і солдати обрушили на людей [ETH.GetName], і згуртувати їх на нашу сторону для можливої визвольної кампанії."
