 XSM_recruit_salar_officers_desc:0 "The turkic Salar people of Qinghai province show promise in the art of war. Officers will be sent out to Xunhua county to scout out promising new leaders, and ensure they are given proper military training."
 XSM_strengthening_our_position_desc:0 "Нам знадобиться бойова сила, якщо ми хочемо об'єднатися, оскільки ймовірність збройного конфлікту вища за нуль, а наша армія все ще занадто мала для будь-якої масштабної операції."
 XSM_sweep_out_communists_desc:0 "Вигнання Чжана Готао та його банди комуністів є першочерговим завданням, якщо ми не хочемо потрапити до рук Радянської Республіки. Тому ми повинні вимести будь-яких залишків комуністів з нашої території."
