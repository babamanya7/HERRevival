 ENG_towards_dominion_independence_desc:0 "Після реструктуризації урядів домініонів ми мусимо допомогти нашим домініонам зробити останні кроки до розриву їхніх офіційних зв'язків із Вестмінстером. Цілком ймовірно, що ми побачимо період масової міграції, оскільки ті, хто воліє залишатися частиною держави [Root.GetNameDef], будуть іммігрувати."
