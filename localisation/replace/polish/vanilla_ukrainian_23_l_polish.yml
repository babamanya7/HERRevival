 SWE_aquire_modern_panzers:0 "Отримати сучасні танки"
 SWE_as_the_barometer_falls_desc:0 "Ми не можемо дозволити собі бути застигнутими зненацька вторгненням на нашу територію, незалежно від причини. Тому ми повинні переконатися, що збройні сили мають плани на випадок надзвичайних ситуацій і відповідну підготовку для боротьби з будь-яким таким сценарієм."
