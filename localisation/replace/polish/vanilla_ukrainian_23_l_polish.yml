 SEA_PHI_political_events.40.t:0 "Мануеля Кесона вбито!"
 SEA_PHI_political_events.49.desc:0 "Не відповідаючи на нашу декларацію незалежності протягом кількох днів, що, ймовірно, минули у палких дискусіях серед [FROM.GetAdjective]ого керівництва, [FROM.GetNameDef] офіційно оголосили, що визнають [ROOT.GetAdjective]у незалежність."
 SEA_PHI_political_events.55.c:0 "Тепер ми також повинні прагнути дипломатичної незалежності"
 SEA_PHI_political_events.57.t:0 "Довірено військово-морські сили"
 SEA_PHI_political_events.60.desc:0 "Після президентських виборів 1935 року [ROOT.GetNeutralLeader] досі не змирився зі своєю значною поразкою і оскаржує це питання перед радою, відповідальною за вибори. Якщо буде знайдено докази втручання, партія, ймовірно, передасть справу до одного з вищих судів країни."
 SEA_PHI_political_events.63.roxas:0 "Зв'язки $PHI_manuel_roxas$ допоможуть з економічними реформами"
 SEA_PRC_faction_events.41.a:0 "Хто там виходить знову?"
