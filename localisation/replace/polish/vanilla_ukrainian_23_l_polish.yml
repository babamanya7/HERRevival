 FRA_raid_category_fluff_text_air_raids:0 "§LВійськово-повітряні сили Франції§!"
 FRA_reform_the_labour_laws:0 "Реформувати робітничі закони"
 FRA_strat_bomber_equipment_2:0 "Bloch MB.162"
 FRA_submarine_2_desc:0 "Підводні човни класу «Minerve» (назва проєкту T2) базувалися на 630-тонній серії, хоча вони мали кращі двигуни та іншу компоновку торпед. Ці підводні човни були першою частиною програми стандартизації, яка стала результатом централізованого проєктування DCAN (Direction des Constructions et Armes Navale), а не проєктів попередніх класів, призначених для верфі."
 FRA_submarine_3:0 "Клас «Roland Morillot»"
 FRA_support_the_left_desc:0 "Комінтерн стає сильнішим. Настав час показати, що наші інтереси можуть бути єдиними, і підтримати комуністів усередині країни."
 FRA_the_regiment_normandie:0 "Regiment Normandie"
 FRA_the_young_school_desc:0 "Розробки в авіації, підводних човнах і торпедах зробили капітальний корабель застарілим. З нашою обмеженою військово-морською промисловістю ми не можемо дозволити собі витрачати час і гроші на будівництво гігантських плавучих фортець, які безпорадні проти загроз сучасного морського поля битви. Натомість ми мусимо зосередитися на підвищенні ефективності, щоби дозволити нам будувати більше малих суден.§!"
