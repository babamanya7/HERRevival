 RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC:0 "Німецький ШІ спробує повалити нацистів і принести комуністичну революцію до Німеччини. Тоді ті спробують установити більш демократичний соціалістичний режим під егідою нової Ліги Спартака й поширити комуністичну революцію по всій Європі."
 RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA:0 "GOE — Гіндутва-фашизм"
 RULE_OPTION_HASHEMITE_IRQ_AI_DESC:0 "ШІ намагатиметься залишатися лояльним до Великої Британії, одночасно зміцнюючи свою владу в регіоні, поступово перебираючи на себе управління територією і, зрештою, утворюючи гашімітську Арабську федерацію."
 RULE_OPTION_HISTORICAL_BEL_AI_DESC:0 "Бельгія спочатку спробує відбити атаки, але потім відступить до Конго і продовжить війну звідти."
 RULE_OPTION_HISTORICAL_SEA_DESC:0 "Китайський ШІ намагатиметься максимально дотримуватися історичного перебігу подій."
 RULE_OPTION_HISTORICAL_URG_AI_DESC:0 "ШІ уникатиме світових справ і зосередитися на внутрішній індустріалізації, привівши до влади партію «Колорадо». Країна приєднається до Союзників тільки наприкінці війни."
 RULE_OPTION_HUN_ROME_PROTOCOLS:0 "Відновлення Римських протоколів"
 RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC:0 "Італійські антифашисти об'єднають сили для повалення фашистського режиму силою, сформують комуністичний уряд, деколонізують імперію та спробують приєднатися до Комінтерну."
