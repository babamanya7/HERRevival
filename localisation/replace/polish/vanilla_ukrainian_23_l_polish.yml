 RAJ_rani_of_jhansi_regiment:0 "Полк Рані Джхансі"
 RAJ_relax_agrarian_society_criteria_desc:0 "Щоб перейти до сучасної промислової держави, ми повинні змістити нашу економіку від традиційного сільського господарства. Заохочуючи сільське населення приєднатися до промислової робочої сили, ми закладаємо основу для стійкого зростання та технологічного прогресу."
