 TUR_CAS_equipment_3_short:0 "Nu.D Tukan"
 TUR_a_common_destiny_for_all_of_turkey_desc:0 "Турки, греки, курди, християни, мусульмани, атеїсти — всі ми варимося в цьому котлі спільно. У наших спільних інтересах об'єднатися під керівництвом сильного уряду, який підтримує радикальні ідеї та працює на колектив загалом. Спільно ми вистоємо, а порізно — падемо."
 TUR_alienate_our_allies_tt:0 "\n§RПісля радикальної зміни зовнішньополітичного спрямування колишні союзники можуть відвернутися від нас, особливо якщо саме вони стануть нашою метою.§!"
 TUR_ataturk_health_stable:0 "§YСтабільне§!"
 TUR_avenge_the_treaty_of_sevres_desc:0 "[FRA.GetNameDefCap] думає, що ми слабкі, і нас можна вбити. Вони намагалися використати нас, роззброїти і внести розбрат у наші ряди. Що ж, саме так ми і вчинимо з ними."
 TUR_brace_against_the_red_menace_generic_desc:0 "На північ знаходиться віроломна Росія. Здавна вона намагається втрутитися у справи Балкан та Туреччини. Балканська Антанта надасть послугу людству, покінчивши з [SOV.GetAdjective] гегемонією."
 TUR_construct_the_cakmak_line_desc:0 "Фельдмаршал Февзі Чакмак запропонував побудувати лінію укріплень навколо Едірне та протоки Босфор. І хоча чиновники мали певні сумніви щодо цього проєкту, плюси помітно переважили мінуси, і з дня на день ми приступимо до будівництва укріплень."
 TUR_counter_the_rebels_in_erzurum:0 "Протистояти повстанцям в Ерзурумі"
 TUR_create_the_turkish_workers_militia_desc:0 "Політика — брудна справа, і жодному режиму не гарантовано постійне перебування при владі. Нам важливо озброїти робітників і дати їм можливості та волю захищати свої права від усіх, хто захоче їх відібрати, — будь то іноземна держава чи новий політичний рух у нашій країні."
 TUR_deal_for_the_oniki_islands_desc:0 "Острови Онікі біля наших берегів були відібрані в нас і передані розпусним італійцям, але спочатку на них претендували віроломні греки. Родос був турецьким і буде турецьким знову!"
 TUR_desert_camel_corps:0 "Пустельний верблюдовий корпус"
 TUR_etatism_crisis_3:0 "Погіршення економічної кризи"
 TUR_fully_integrate_the_is_bank_desc:0 "Джеляль Баяр із групою однодумців-лібералів та прихильників демократії пов'язали долю із установою İş Bank, заснованою Ататюрком у 1924 року. Провівши інтеграцію İş Bank та пов'язаних з ним лібералів, ми покажемо нашому народу та всьому світу, що Туреччина нарешті готова зробити наступні обережні кроки до повної демократії."
 TUR_kurdish_state_management_category:0 "Керування курдськими землями"
 TUR_loosen_the_laws_on_secularism:0 "Послабити світські закони"
 TUR_medium_tank_equipment_1:0 "Koç Asena II"
 TUR_misak_i_milli_desc:0 "Misak-ı Millî — національна обітниця Туреччини. Після падіння імперії Османа і закінчення Війни за незалежність ми добровільно поступилися величезною територією і відмовилися від претензій на неї. Світ змінився і мешканці цих регіонів мріють про наше повернення. Ми не можемо їм відмовити."
 TUR_officers_of_the_revolution_desc:0 "Як офіцери-кемалісти уособлюють та захищають свою ідеологію, так і наші нові офіцери стануть захисниками марксизму в державі [TUR.GetNameDef]."
 TUR_open_the_nazilli_callico_factory:0 "Відкрити ситцеву фабрику в Назіллі"
 TUR_patrol_the_seas:0 "Патрулювати моря"
 TUR_rebuke_the_treaty_of_kars_desc:0 "Карський договір мав покінчити з кордонами, якими розділені [ROOT.GetNameDef] і Кавказ, але хіба може подібна угода мати силу, коли на коні життя тюркських поселень у цьому проклятом регіоні? За родичів ми готові битися зубами та пазурами."
 TUR_stoked_jihad_flag:0 "Нещодавно розпалено екстремістські настрої"
 TUR_stop_the_stalinist_charade:0 "Зупинити сталіністів"
 TUR_strengthening_our_navies:0 "Посилення наших флотів"
 TUR_tac_bomber_equipment_0:0 "TamTAS Ju A-20"
 TUR_tac_bomber_equipment_2_short:0 "THK Baltimore"
 TUR_taking_over_defense_of_the_gulf_desc:0 "Ми можемо трохи полегшити життя нашим [ENG.GetAdjective] союзникам, запропонувавши їм охороняти їхні близькосхідні володіння. З огляду на весь наш внесок у справу війни, вони, найімовірніше, приймуть нашу пропозицію... і той факт, що вони все одно не змогли б завадити нам просто захопити ці території."
 TUR_the_clodius_agreement_desc:0 "[GER.GetAdjective] дипломати зробили нам гідну пропозицію: постачання хромової руди в обмін на підтримку виробництва спорядження для наших збройних сил. Крім того, якщо ми станемо для держави [GER.GetNameDef] головним джерелом хрому, [GER.GetNameDef] обіцяє нам захист, який у ці скрутні часи буде зовсім не зайвим."
 TUR_the_hatay_issue:0 "Хатайська ситуація"
 TUR_the_legacy_of_osmanli_donanmasi:0 "Спадщина Osmanlı Donanması"
 TUR_the_montreux_convention:0 "Конвенція Монтрьо"
 TUR_the_petra_proposal:0 "Пропозиція Петри"
 TUR_the_petra_proposal_desc:0 "Наші радники розробили план, внаслідок якого ми відповідатимемо за управління [ENG.GetAdjective] протекторатами в Леванті та їх захист. Стратегія і сама пропозиція звучать цілком розумно — залишилося лише правильно піднести наш план [ENG.GetAdjective] дипломатам."
