 SIA_appeal_for_support_cat_desc:0 "Жоден політичний рух не досягає успіху самотужки. Монархісти, конституціоналісти, солдати та цивільні — кожен має вплив на частину країни. Їхню підтримку необхідно ретельно культивувати, якщо ми хочемо мати сили діяти, коли настане слушний момент."
 SIA_civil_nationalism_desc:0 "Кожен таєць, незалежно від статусу, повинен знати, що його лояльність має належати не одному уряду чи одній особі, а скоріше підтримці цінностей свободи, незалежності та рівності, незалежно від того, хто зараз сидить на троні влади."
 SIA_decrease_civilian_approval_2_tt:0 "Зменшує схвалення крила §YЦивільних§! на §RЗначну величину§!"
 SIA_deficit_spending:0 "Дефіцитне фінансування"
 SIA_dem_event_count_cw_scale_tt:0 "§YПоточна прогнозована підтримка§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_demand_the_return_of_lost_territory:0 "Вимогти повернення втрачених територій"
 SIA_demand_the_return_of_lost_territory_desc:0 "[FRA.GetNameDefCap] показала свою слабкість, ставши не більше ніж паперовим тигром, що чіпляється за залишки свого згасаючого впливу. Після розвалу своїх збройних сил вона більше не може проектувати ту силу, яку колись мала, і не в змозі протистояти нашим вимогам."
 SIA_facilitate_prajadhipoks_move_to_japan_tt:0 "3 дивізії рейнджерів з [JAP.GetNameDef] підтримають нас під час громадянської війни."
 SIA_fighter_equipment_3:0 "Nakajima Ki-43"
 SIA_great_thai_empire_DEF:0 "Велика Тайська імперія"
 SIA_gw_tank_equipment_short:0 "$gw_tank_equipment_short$"
 SIA_join_the_allies:0 "Приєднатися до Союзників"
 SIA_national_savings_bond_current:0 "Наш поточний закон про мобілізацію надасть нам: "
 SIA_neutrality_party_royalist:0 "Роялісти"
 SIA_plan_for_a_short_war_desc:0 "Наші ресурси обмежені, а наших ворогів може бути багато. [ROOT.GetNameDefCap] не може дозволити собі довгу війну на виснаження. Якщо війна прийде, вона має бути швидкою, рішучою і завершеною до того, як ворог зможе зібратися з силами."
 SIA_prepare_for_a_pacific_war_desc:0 "Погляди імперій звертаються до Тихого океану. Амбіції Японії, європейські колонії та стратегія Союзників вказують на наближення бурі. Сіам повинен підготуватися до того, як перші постріли досягнуть наших берегів."
 SIA_revise_the_taxation_system:0 "Перегляд податкової системи"
 SIA_securing_the_rubber_islands_desc:0 "Каучук — це джерело життєвої сили сучасної війни, що забезпечує шини, ущільнювачі та незліченну кількість інструментів механізованого конфлікту. Багаті на ресурси території на південь від нас є водночас і можливістю, і необхідністю. Ми повинні діяти, щоб захистити їх, перш ніж це зроблять інші."
 SIA_ship_medium_battery_4:0 "20.3 cm Auto-Loading"
 SIA_standing_our_ground_mission_tt:0 "Ми повинні боротися за нашу свободу."
 SIA_strat_bomber_equipment_2:0 "Nakajima Ki-49"
 SIA_sway_generals_to_seri_thai_tt:0 "Генерали, яких ми переманив на бік Сері Тхай, приєднаються до нас, коли почнеться громадянська війна, замість того, щоб приєднатися до повстання лоялістів."
 SIA_thailand_DEF:0 "Королівство Тайланд"
 SIA_the_peoples_war_in_asia:0 "Народна війна в Азії"
 SIA_the_regency_of_boworadet_desc:0 "Принц Боворадет несе в собі престиж старого порядку, і ніхто не може сумніватися, кому належить його лояльність. Призначивши його регентом від імені Ананди, ми віддаємо державу в консервативні руки і даємо зрозуміти, що реставрація має стати чимось більшим, ніж просто зміною міністрів."
 SIA_tropical_air_operations:0 "Повітряні операції в тропіках"
 SIA_tropical_air_operations_desc:0 "Спека, вологість, мусонні дощі та нерівні передові аеродроми висувають власні вимоги до літаків та екіпажів. Адаптуючи двигуни, графіки технічного обслуговування та доктрину пілотів до цих умов, Управління може зробити наші військово-повітряні сили надійнішими в небі над Південно-Східною Азією."
 SIC_democratic:0 "Сичуаньська республіка"
 SIC_fascism:0 "Сичуаньська вільна держава"
 SIC_the_armies_of_yang_sen_desc:0 "Ян Сень — генерал з уже досить великою військовою кар'єрою, який був губернатором Сичуаню в 1924-1925 роках, потім зіткнувся з британцями і приєднався до Гоміньдану в 1926 році. Ми повинні намагатися здобути його прихильність, щоб розширити наші військові можливості."
 SIE:0 "Сьєрра-Леоне"
 SIK_heavy_tank_destroyer_equipment_2_short:0 "PTZ 41 D"
 SIK_light_tank_equipment_3:0 "Type 41 Xiao"
 SIK_medium_tank_aa_equipment_1:0 "PGZ 39"
 SIK_settle_dzungarian_tribes_desc:0 "We have received requests from chiefs and leaders of the Dungarian tribes to settle down in our state, as they have not been able to reap the rewards of our good harvests. We should grant their wish."
