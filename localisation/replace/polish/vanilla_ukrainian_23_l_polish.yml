 ss_recruitment_event.10.b:0 "Запевнити їх, що OKW має остаточне командування всіма силами SS."
 ss_recruitment_event.11.desc:0 "Посилаючися на погане самопочуття, [GER_SS_general_resigns.GetName] негайно залишив свою комісію. Однак не секрет, що [GER_SS_general_resigns.GetName] був відвертим критиком політики уряду щодо Waffen-SS, зокрема рішення дозволити іноземним добровольцям служити в дивізіях SS. Як повідомляється, [GER_SS_general_resigns.GetName] наполягав на тому, щоб особисто попрощатися з фюрером, що призвело до гарячої дискусії між ними щодо розподілу ресурсів у військових зусиллях.\n\nКілька інших офіцерів Вермахту висловили подібні занепокоєння, а деякі вказали, що вони подумають про те, чи слідувати за ним."
 ss_recruitment_event.20.desc:0 "Як повідомляється, під час приватної зустрічі Гайнріха Гіммлера та лідера [GER.GetLeader] райхсфюрер SS голосно й неодноразово скаржився, що його організація не отримала підтримки, необхідної їй для виконання необхідної роботи із захисту партії та держави. Далі він застеріг [GER.GetLeader] не довіряти Вермахту, щоб він залишався лояльним.\n\nТільки SS можна було довіряти створити нову Німеччину."
 stability.22.t:0 "Страйки!"
 stability.36.a:0 "Невже в них немає почуття обов'язку?"
 stability.36.desc:0 "Seeing the severity of the situation, the Military High Command has decided that more drastic measures are required to show that evading one's civic duty to defend their country will not be tolerated. At dawn, military police raided the homes of a number of carefully selected, well known and connected people who have used their influence to allow others to avoid the draft. Still in their nightgowns, they have found themselves conscripted into the military. Their families have mobilized their extensive support networks to protest this decision. The War Office has been flooded with calls and letters from simple workers who want their factory manager back to undersecretaries in various other ministries, demanding to know why people working in fields critical to the war effort have been removed from their work. It appears that even some cabinet members have second thoughts about the war - perhaps fearing for the safety of their own sons."
 steal_blueprints_seduction:0 "Використовувати чарівність"
 strat_bomber_equipment_1_short:0 "Страт. бомбардувальник I"
 strategic_bombing_campaign_goal_desc:0 "Великомасштабна стратегічна бомбардувальна кампанія систематично погіршить промисловий потенціал ворога, дозволяючи нам виснажувати його сили."
 strategic_bombing_campaign_goal_name:0 "Тривала стратегічна бомбардувальна кампанія"
 streamlined_deployment_tank_desant:0 "Танковий десант"
 streamlined_line_desc:0 "Стандартизація та жорстко задана структура конвеєрної лінії є запоруками її ефективності та безпеки. Ми мусимо наголосити на цих аспектах у розвитку нашої промисловості."
 street_fighting:0 "Вуличні бої"
 strikes_event.8.desc:0 "The troops assembled outside the towns overnight, but poor light and noise discipline gave the surprise away. As the troops moved in, they found the workers alert and ready for them. The first assault broke down in hails of thrown stones. A second assault with fixed bayonets was repulsed in brutal hand-to-hand fighting, leaving dozens of dead and dying in the streets.\n\nThe officers in charge have pulled back to consolidate their forces, while the workers are extending their fortifications and arming themselves with the weapons left behind in the retreat. A second day of fighting is expected tommorrow, but Military High Command does no longer believe that victory is likely."
 submarine_1_desc:0 "Підводні човни призначені для атак на незахищені морські конвої. Ранні моделі, що використовувалися в Першій Світовій війні, перший крок до нової стратегії бойових дій на морі."
 support_communism_short_desc:0 "§LПриведіть до влади більш комуністично налаштований уряд.§!"
 support_ship_2_desc:0 "Експлуатаційний досвід дозволяє створити більш досконалий і здібний корабель підтримки, здатий підтримувати бойовий флот на ще більших відстанях."
 sweden_hungary_required_states:0 "Контролює всі угорські початкові регіони"
 tactic_tw_attack:0 "Тактичний відступ: атака"
 tank_designer_land_cruiser_chassis_role_disallowed:0 "Необхідне §Y$land_cruiser_chassis$§!."
 tank_destroyer_force_independent_counterattacks:0 "Незалежні контратаки"
 tank_engine_upgrade:0 "Двигун"
 tank_manufacturer_cost_factor_tt:0 "$tank_manufacturer_cost_factor$: $RIGHT|-=%1$"
 targeted_race_for_the_bomb:0 "Ядерна гонка"
 tech_military_police4:0 "Військова поліція IV"
 tech_signal_company4_desc:0 "Серед наших зв'язківців є люди з безпосереднім досвідом застосування цих засобів зв'язку на полі бою. Підключивши їх до розробки нових технологій комунікації, ми знайдемо застосування їх знань."
 technology_idea_desc:0 "Ідеї, які допомагають досягти технологічних успіхів."
 tfv_australia.2.a:0 "Ми не розчаруємо."
 tfv_australia.31.a:0 "[Root.GetNameDefCap] веде шлях у майбутнє!"
