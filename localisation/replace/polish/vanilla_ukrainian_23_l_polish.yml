 mexico.19.l:0 "Ернан Лаборде, лідер троцькістської партії."
 mexico.42.a:0 "Центральній Америці досі загрожує американська агресія."
 mexico.53.b:0 "Наша інтерпретація Маркса — єдино вірна."
 mic_to_overlord_factor_tt:0 " $MODIFIER_MIC_TO_OVERLORD_FACTOR$: $RIGHT|Y=%1$"
 midget_submarine_specialization_desc:0 "Невеликі підводні човни, призначені для нападів на порти або легких конвоїв, ідеально відповідають нашій флотській доктрині."
 military_access_receiver_desc:0 "Держава $COUNTRY|Y$ надає право проходу військ іншим країнам."
 mio_cat_eq_all_heavy_tank:0 "Уся важка бронетехніка"
