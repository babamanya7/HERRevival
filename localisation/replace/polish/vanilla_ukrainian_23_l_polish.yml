 FIN_outokumpu_for_defence_industry_desc:0 "Інвестиції в національну металургійну компанію Outokumpu Oy допоможуть підвищити оборонну готовність [ROOT.GetName].\nСтворення внутрішнього металургійного заводу в Порі та заводу електролізу міді для рафінування сирої міді принесе само достатність для виробництва міді та латуні [ROOT.GetName]."
