 PEACE_PARTICIPANT_DELIMITER_ITEM:0 "Клацніть, щоби відкрити/закрити."
 PER_adult_literacy:0 "Кампанія з ліквідації неграмотності серед дорослих"
 PER_communist_events.4.desc:0 "В останні дні спостерігається помітне зростання опору нашій окупації територій навколо [PER.GetAdjective] кордону. Хоча причина цього сплеску залишається неясною, зростає занепокоєння, що хтось підбурює анти-[ROOT.GetAdjective] настрої в надії послабити нашу присутність у цьому районі."
 PER_communist_events.4.t:0 "Посилення опору на [PER.GetAdjective] кордоні"
 PER_communist_events.7.desc:0 "Як і слід було очікувати, вперті дурні в [FROM.Capital.GetCapitalVictoryPointName] відмовилися виводити війська зі спірних районів Перської затоки та Аравії. Здається, вони думають, що нам бракує рішучості здійснити наші погрози блокування морських шляхів як наслідок їхніх дій."
 PER_declare_loyalty_to_britain:0 "Заявити про лояльність до [ROOT.OVERLORD.GetNameDef]"
 PER_demand_west_asia:0 "Забезпечити Західну Азію Франції"
 PER_foreign_policy_events.5.desc:0 "Після кількох виснажливих зустрічей між [ROOT.GetAdjective] та [FROM.GetAdjective] дипломатами, [FROM.GetNameDef] вирішив не втручатися в наші плани щодо [PER.GetNameDef]. Сам [FROM.GetLeader] навіть наважився натякнути, що ця пропозиція була не більш ніж спробою виправдати наші територіальні амбіції.\nСхоже, нам доведеться розбиратися з [PER.GetNameDef] самостійно."
 PER_imperial_events.101.desc:0 "Після того, як вдалося витіснити загарбників і відправити їх далі назад на їхні власні землі, ми змогли звернутися до наших ворогів, щоб запросити їхніх дипломатів до Тегерана для початку мирних переговорів. На жастя, вони не були сприйнятливі до наших мирних переговорів, і в результаті війна триває."
 PER_imperial_events.11.a:0 "Відмінна робота."
 PER_imperial_events.12.t:0 "[FROM.GetNameDefCap] пропонує продати Белуджистан"
 PER_imperial_events.120.a:0 "Так, це здається прийнятним"
 PER_imperial_events.15.a:0 "Дякувати Богу за це."
 PER_imperial_events.15.desc:0 "Здається, [PER.GetNameDef] вирішив, що спроба забрати Белуджистан у нас не варта ризику. Принаймні ми можемо мати мир, поки що."
 PER_imperial_events.150.desc:0 "У міру того, як війна просувалася, ми не змогли досягти наших цілей у встановлений термін. Таким чином, ми нещодавно отримали повідомлення від [FROM.GetAdjective] уряду з вимогою припинити воєнні дії. Ми могли б продовжувати тиснути, однак ми повинні враховувати наші власні втрати."
 PER_imperial_events.162.a:0 "Вони пошкодують, що не скористалися шансом відступити!"
 PER_imperial_events.180.a:0 "Це вигідно для всіх."
 PER_imperial_events.230.desc:0 "Після багатьох років вигнання в [ENG.GetNameDef], спадкоємець династії Каджарів, Мохаммад Хассан Мірза, прагне повернутися на трон [PER.GetNameDef]. Правління династії Пехлеві не виправдало очікувань [ENG.GetAdjective] уряду, і є надія, що поверненням старої керівної родини на престол буде забезпечено [ENG.GetAdjective] інтереси в регіоні."
 PER_imperial_events.231.desc:0 "Після ретельного обмірковування династія Пехлеві була змушена залишити трон [PER.GetNameDef]. Незважаючи на їхні десятиліття служіння країні, вкрай важливо, щоб ми діяли на користь [ENG.GetAdjective] уряду. Хоча вони більше не мають свого місця в [PER.GetAdjective] монархії, вони все ще прагнуть бути присутніми в політичних колах країни."
 PER_imperial_events.231.t:0 "Династію Пехлеві усунуто від влади"
 PER_imperial_events.61.a:0 "Чудова новина."
 PER_imperial_events.61.t:0 "[GER.GetNameDefCap] погоджується на Пакт про ненапад"
 PER_infantry_equipment_3:0 "ППШ-41"
 PER_invite_british_investors:0 "Запросити [ROOT.OVERLORD.GetAdjective] інвесторів"
 PER_price_stabilization:0 "Стабілізація цін"
 PER_profit_from_war_desc:0 "Війна означає гроші, і багато чого можна заробити на поточному конфлікті, що лютує по всьому світу. З розвитком технологій воюючим націям потрібно більше нафти, щоб підживлювати свою військову машину. Це чудова можливість для нас, і було б нерозумно нею скористатися."
 PER_rapid_industrialization:0 "Швидка індустріалізація"
 PER_ssb_events.3.a:0 "Саадабадський альянс житиме і без них!"
 PER_ssb_events.3.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію про альянс."
 PER_stage_mass_protests_desc:0 "Народу набридли виправдання шаха та вкорінена влада еліти. Настав час вийти на вулиці та вимагати негайних змін."
 PER_trains_from_germany:0 "Запросити потяги з [GER.GetNonIdeologyName]"
 PER_upp:0 "ОПП"
 PER_upp_long:0 "Об'єднані прогресивні партії"
 PER_viceroyalty_of_persia_ADJ:0 "Перськ"
 PER_we_survived:0 "We Survived"
 PHI_AI_BEHAVIOR:0 "@PHI Філіппіни"
 PHI_american_intervention_invite_us_communists:0 "Запросити [USA.GetAdjective]их комуністів"
 PHI_army_of_the_philippines_desc:0 "Наші збройні сили значно еволюціонували всього за кілька коротких років, і настав час відкласти залежність від іноземної підтримки та впевнено йти самим до нового, світлого й безпечного майбутнього, захищеного виключно філіппінською кров'ю та сталлю. Відтепер наша безпека — це наша власна турбота."
 PHI_bill_of_rights:0 "Білль про права"
 PHI_bill_of_rights_for_veterans:0 "Білль про права ветеранів"
 PHI_convoys_for_infrastructure_decision_cat_desc:0 "Як для острівної нації, суднобудування — це ремесло, яке передує будь-якому урядовому втручанню. Модернізуючись, ми повинні використовувати цей досвід для залучення коштів та застосування наших методів, кораблів та іншого обладнання в інших секторах, таких як будівництво."
 PHI_eisenhower_steps_in_tt:0 "§GАйзенгауер спробує зірвати плани фашистів§!"
 PHI_hispanic_empire_tag_ADJ:0 "Гіспанськ"
 PHI_hispanic_empire_tag_DEF:0 "Гіспанська імперія"
 PHI_hukbalahap_desc:0 "«Хукбо на Баян Лабан са Хапон» (Народна антияпонська армія), або скорочено Хукбалахап, — це комуністичний партизанський рух, сформований фермерами Центрального Лусона, які виявилися одними з найбільш здібних бійців опору в усьому [PHI.GetNameDef]. Вони надзвичайно добре організовані та вмотивовані, але їм бракує зброї. Ми повинні дістати її для них."
 PHI_increase_sugar_exports_desc:0 "Цукор був основою нашої економіки протягом століть, і він допоміг нам пережити найгірші часи Великої депресії, зберігаючи здоровий рівень експорту. Підписуючи вигідні торговельні угоди з іншими країнами, ми можемо гарантувати, що найкраще використаємо зростання ролі цукру як основи міжнародної кухні... і газованих напоїв."
 PHI_infiltrate_chinese_ports_desc:0 "Наші докери були одними з перших, хто скористався можливостями, запропонованими комунізмом, і тому довго були нашими найвідданішими союзниками. Ми повинні викликати такі ж настрої в портах Китаю, а потім використати їх як трамплін для подальшого втручання в китайську боротьбу."
 PHI_infrastructure_points_requirement_tt:0 "Потрібно 5 §Yочок інфраструктури§!, отриманих через наведені нижче рішення, поточні очки: [?PHI_infrastructure_points]"
 PHI_juramentado_desc:0 "Хураментадо були воїнами моро та сулу, які присягалися битися на смерть проти загарбників. Хоча старі ритуали зблякли, дух безстрашної самопожертви залишається. Прийнявши цю традицію, ми можемо надихнути наших бійців опору на нищівні атаки, які жахатимуть окупантів і підбадьорюватимуть наш народ."
 PHI_macarthur:0 "МакАртура"
 PHI_malayo_polynesia_desc:0 "Історично ми мали тісні культурні, історичні та етнічні зв'язки з Малайським півостровом та Індіями. У світлі цього братерського зв'язку ми повинні поширити на них ті самі права та привілеї, якими користується наш народ."
 PHI_mariveles_naval_base:0 "Військово-морська база Марівелес"
 PHI_modernization_desc:0 "Наші промислові зусилля надто довго відставали від інших азійських країн. Тепер, коли ми здобули незалежність, ми повинні продемонструвати свій потенціал світові та надати ресурси і регуляторний простір для тих, хто хоче просувати механізацію нашої економіки."
 PHI_philippine_american_educational_foundation:0 "Філіппінсько-американська освітня фундація"
 PHI_philippine_scouts_desc:0 "Заснована в 1901 році організація філіппінських скаутів складається з найбільшого контингенту філіппінців, що служать у нашій армії, і ми повинні продовжувати підтримувати цей підрозділ та гарантувати, що вони отримають найкращу можливу підготовку та спорядження для виконання своєї ролі як спеціалізованих сил, призначених для захисту нашої батьківщини."
 PHI_rehabilitation_finance_corporation:0 "Фінансова корпорація з відбудови"
 PHI_san_miguel:0 "Сан-Мігель"
 PIERCING_GOOD_DESC:0 "Дивізія не отримає додаткових бонусів через можливість пробити броню ворожої дивізії, але й ворог не отримає бонусів через броню."
 PLAN_COHESION_STRICT_TITLE:0 "§HЖорстка згуртованість§!"
 PLAN_VALUE_FORTIFIED:0 "Укріплення: $VAL|0+%$"
 PLU_neutrality_ADJ:0 "Палауськ"
 POLITICS_EXPIRE_TIME:0 "Закінчується через $TIME|Y$ дн."
 POLITICS_STAGE_COUP_TITLE:0 "Улаштувати переворот"
 POL_VICTORY_POINTS_6571:0 "Ясіна"
 POL_air_base_expansion:0 "Розширення авіабаз"
 POL_appoint_new_officers_desc:0 "Тепер, коли наш військовий штаб очищено від нелояльних генералів, ми маємо можливість надати владу людям, які глибоко дбають про польський суверенітет і не мають жодної лояльності до Замку, лівих чи правих."
 POL_assert_eastern_claims_pavel:0 "Заявити про права на східні території"
 POL_committee_of_international_liberation_idea:0 "$POL_committee_of_international_liberation$"
 POL_cv_CAS_equipment_3:0 "PZL.59 Okoń Floty"
 POL_cv_fighter_equipment_0_short:0 "PZL.11 Floty"
 POL_demand_slovakia_pavel:0 "Вимогти Словаччину"
 POL_destroyer_2_desc:0 "Два есмінці типу «Grom» були побудовані в Британії для ВМС Польщі і вступили в дію у 1937 році. Це були одні з найбільших і найшвидших есмінців Другої світової війни. Їх водотоннажність становила близько 2000 тонн, а озброєння складалося з п'яти 120-мм гармат. Крім того, вони мали шість 533-мм торпедних апаратів і хороше протичовнове обладнання."
 POL_dismantle_soviet_empire:0 "Ліквідувати [SOV.GetAdjective]у імперію"
 POL_exile_industries:0 "Промисловість у вигнанні"
 POL_expansion_of_new_towns:0 "Нова польська промисловість"
 POL_fill_the_railways_gaps_desc:0 "Колись Польща була розділена між трьома державами, і тому наші залізничні мережі є віддаленими та не пов'язаними між собою. Ми повинні об'єднати ці три окремі залізничні лінії в одну, якщо ми хочемо зробити Польщу централізованою галуззю, якою вона повинна стати!"
 POL_greater_polish_SSR_desc:0 "Ми вже довели свою корисність для СРСР, і було б розумно вимогти повернення контролю над Східною Польщею нашому народові, з певною компенсацією за ті великі послуги, які ми надали революції."
 POL_habsburg_events.2.t:0 "[From.GetNameDefCap] пропонує укласти союз"
 POL_heavy_cruiser_3:0 "Клас «Żuk»"
 POL_heavy_fighter_concept_desc:0 "Якщо ми будемо змушені перейти в наступ, нам потрібен новий тип винищувача, здатний діяти в глибині ворожих кордонів."
 POL_internationalism_desc:0 "Вороги наших ворогів можуть бути нашими друзями."
 POL_intervention_focus_desc:0 "Якщо ми цінуємо свободу, ми повинні захищати її не лише для себе, але й для народів у всьому світі. Якщо це означає війну, так тому і бути!"
 POL_invite_somua:0 "Запросити «SOMUA»"
 POL_invite_the_lowlands_desc:0 "Хоча фалангізм перебуває на політичній периферії в країнах Бенілюксу, помірні інвестиції часу і ресурсів можуть зробити його достатньо популярним, щоб союз із цими країнами став можливим."
 POL_jet_fighter_equipment_1:0 "PZL.71 Orzeł"
 POL_local_western_plans_desc:0 "Уздовж польсько-німецького кордону є ключові стратегічні регіони. Розробка комплексних планів на суто місцевому рівні та їхнє виконання в потрібний час є настільки ж необхідним для подальшого виживання польської держави, як і наші грандіозні плани битв."
 POL_merge_civilian_industries:0 "Об'єднати громадянську промисловість"
 POL_pan_slavism:0 "Панслов'янський реваншизм"
 POL_polish_path_to_socialism_desc:0 "З моменту свого заснування у 1918 році Польська комуністична партія зазнала більшовизації, і на сьогоднішній день багато її членів є не більш ніж слугами Сталіна. Однак Марія Кошутська та низка інших відомих членів КПП прагнуть усунути сталінські елементи з партії та налаштувати Польщу проти Москви."
 POL_promote_chemical_industry:0 "Підтримати хімічну промисловість"
 POL_restore_don_cossacks_desc:0 "Запеклі противники більшовизму, донські козаки воювали на боці білих у громадянській війні в Росії. Тепер, коли вся їхня територія знаходиться під нашим контролем, ми можемо запросити донських вигнанців заселити ці землі і боротися пліч-о-пліч зі своїми товаришами."
 POL_second_man_of_the_state:0 "Друга людина в державі"
 POL_seek_accommodation_with_germany_desc:0 "Навіщо нам битися, якщо ми більше схожі ніж різні?"
 POL_tac_bomber_equipment_0:0 "LWS-6 Żubr"
 POL_the_mediterranean_desc:0 "Між Польщею і Середземним морем — стадо ягнят із вовками за спиною. Югославія, Австрія, навіть Греція та Туреччина є здобиччю хижих держав Заходу. Ми повинні дати зрозуміти всім державам на Балканах і за їх межами, що ми прагнемо захистити їх суверенітет і безпеку їх народів, тільки тоді ми зможемо надати їм офіційну пропозицію захисту і розширити Міжмор'я."
 POL_the_old_borders:0 "Старі кордони"
 POL_unification_propaganda:0 "Пропаганда об'єднання"
 POL_unite_west_slavia_desc:0 "З нашим королем на троні Польщі та Богемії, все, що нам потрібно зробити, це об'єднати внутрішню адміністрацію Польщі та Богемії, і мрія про Західну Славію буде досягнута."
 POR_a_royal_wedding:0 "Королівське весілля"
 POR_cancel_evade_blockade_flag:0 "Скасування Договору про обхід португальської блокади активовано"
 POR_destroyer_1_desc:0 "The Douro class was a class of seven destroyers launched in the early 1930s. They were built in both Portugal and the U.K. Two of the ships were sold to Colombia in 1934. The ships displaced over 1,200 tons and were armed with four BL 4.7 in. guns and eight 533mm torpedo tubes."
 POR_empire_fascism_ADJ:0 "Португальськ"
 POR_estado_novo_desc:0 "Ми дотримуємося принципів корпоративізму й автаркії з нашої конституції 1933 року. Найвірнішим шляхом до більшого національного зміцнення є подальше підкреслення цього підходу, розбудова нової, могутнішої держави."
 POR_fight_alongside_the_republic:0 "Приєднатися на боці Республіки"
 POR_join_the_allies_desc:0 "Настав час наслідувати приклад основних демократій Європи та приєднатися до них у їхній боротьбі. Разом ми вистоїмо перед будь-яким ворогом!"
 POR_medium_tank_equipment_1_short:0 "CDC-3"
 POR_ogme_organization:0 "$ogme$"
 POR_our_comrades_overseas:0 "Наші товариші за морем"
 POR_portuguese_legion:0 "Португальський легіон"
 POR_promote_communism_in_latin_america_tt:0 "§Y[From.GetFlag][From.GetNameDefCap]§! отримає щоденну підтримку §Yкомунізму§!: §G+0.10§! §Yна 180 днів§!."
 POR_the_iberian_socialist_union_tt:0 "(§Y[SPR.GetFlag]Республіканська Іспанія§!) Станеться подія §YІберійський соціалістичний союз§!."
 PRC_28_bolshevik_faction_decision_enlai_diplomatic_feelers:0 "Відправити §Y$PRC_zhou_enlai$§! з дипломатичною місією до [FROM.GetName]"
 PRC_CAS_equipment_2:0 "Q-2"
 PRC_anti_air_effort:0 "Розвиток ППО"
 PRC_appeal_for_foreign_aid__bt7_some_tanks_tt:0 "Отримати §Y100§! [SOV.GetAdjective]их §Yлегких танків БТ-7§!"
 PRC_appeal_for_foreign_aid_all_tanks_tt:0 "Отримати §Y250§! [SOV.GetAdjective]их §Yсередніх танків Т-34§!"
 PRC_assaulting_yanan:0 "Штурм [1032.GetName]"
 PRC_avenge_the_century_of_humiliation:0 "Помститися за Століття приниження"
 PRC_bolshevik_shortcut:0 "Політика: 28 ½ більшовиків"
 PRC_cooperate_ulanhu_desc:0 "Юнь Цзе, або Уланьфу, — відданий комуністичний борець із Монголії, який наразі діє на північ від наших опорних баз. Він запропонував приєднати свої сили до нас у [ROOT.capital.GetName], щоб битися пліч-о-пліч."
 PRC_dare_to_win:0 "... Наважитись на перемогу"
 PRC_enforce_maoism:0 "Насадити маоїзм"
 PRC_first_automative_works_soviet_advisors_trait:0 "Радянські радники"
 PRC_infiltrate_xian:0 "Проникнути в Сіань"
 PRC_internationalism:0 "Інтернаціоналізм"
 PRC_medium_tank_artillery_equipment_3:0 "PLZ 43"
 PRC_medium_tank_equipment_2:0 "Type 41 Zhōng"
 PRC_mobile_warfare:0 "Мобільна війна"
 PRC_move_capital:0 "Перенести столицю"
 PRC_nav_bomber_equipment_2:0 "Y-2"
 PRC_naval_guns_desc:0 "Фундамент, який ми заклали для будівництва великих суден, також дозволить нам використовувати більшу зброю. Ця зброя могла б дозволити нам загрожувати навіть важкоброньованим цілям і вступати в бій до того, як ми опинимося в межах їхньої ефективної дальності."
 PRC_naval_ocean_navy:0 "Від флоту «зеленої води» до «блакитного океану»"
 PRC_pavel_mif_alive:0 "Павло Міф живий"
 PRC_proclaim_the_peoples_republic:0 "Проголосити Народну республіку"
 PRC_proclaim_the_peoples_republic_desc:0 "Здобувши перемогу над націоналістами, ми можемо зайняти своє законне місце на чолі Китаю. У нас багато роботи, але з кожним днем майбутнє здається все світлішим."
 PRC_proclaimed_neutrality:0 "Китай"
