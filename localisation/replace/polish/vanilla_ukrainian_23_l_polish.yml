l_polish:
 43DescIsNotPuppet:0 "підкоритися їхнім вимогам і стати підданим їхнього правління"
 4572_modern_name:0 "Чанчунь"
 593_guangdong_points:0 "([?593.state_political_support_value|+0]) "
 598_jiangsu_points:0 "([?598.state_political_support_value|+0]) "
 AAT_Sweden.1.a:0 "Фермерська партія — найліпший варіант."
 AAT_Sweden.10.a:0 "Він досі потрібен в уряді."
 AAT_Sweden.15.a:0 "Ми не можемо ризикувати нашою країною заради цього."
 AAT_Sweden.19.desc:0 "Це світлий день, коли держава [NOR.GetName] нарешті знову возз'єдналася. Держава [SWE.GetName] люб'язно прийняла наше прохання повернути нам Нарвік, територію, яку під час війни прихистив [SWE.GetAdjective]ий уряд. Ми висловлюємо нашу найглибшу подяку [SWE.GetAdjective]ому уряду; це справді провіщає більш глибокий зв'язок між нашими країнами, який триватиме цілу епоху."
 AAT_Sweden.2.a:0 "Як це скінчиться?"
 AAT_Sweden.37.a:0 "Ми використаємо їх у якості буферної зони."
 AAT_Sweden_BoP.10.a:0 "Робітничий клас повинен керувати економікою."
 AAT_Sweden_BoP.11.c:0 "Ми повинні робити більше для підтримки провинціалів."
 AAT_Sweden_BoP.14.d_non_aligned:0 "День виборів настав, і виборці зробили свій вибір. $SWE_neutrality_party_long$ сформує мажоритарний уряд найближчими днями. Їхні обіцянки щодо зміцнення національної оборони та ставка на сільського виборця явно увінчалися успіхом. Тепер їм потрібно створити романтизовану версію Швеції, про яку вони так голосили на виборах."
 AAT_Sweden_BoP.14.d_socialist:0 "День виборів настав, і виборці зробили свій вибір. $SWE_communism_party_long$ сформує мажоритарний уряд найближчими днями. Схоже, їхня радикальна політика націоналізації, класової солідарності та неприйняття іноземних імперських зв'язків завоювала громадську думку. Залишається побачити, скільки з їхніх обіцянок тепер буде виконано."
 AAT_Sweden_ball_bearing.2.desc:0 "Держава [SWE.GetNameDef] звернулася з проханням обміняти їхні безцінні кулькові вальниці, які були би важливим ресурсом для наших військових зусиль, на імпорт харчів. [SWE.GetAdjectiveCap]ий уряд, схоже, шукає способи забезпечити цей життєво важливий імпорт у можливому майбутньому конфлікті, оскільки це було головною проблемою під час блокади у Великій війні."
 AAT_Sweden_ball_bearing.7.t:0 "[FROM.GetNameDefCap] відхиляє торгівлю кульковими вальницями"
 AAT_Sweden_ball_bearing.8.t:0 "Торгівлю кульковими вальницями скасовано з початком війни"
 AAT_Sweden_communism.5.desc:0 "На складах провинціїї [ROOT.GetName] були знайдені таємні схованки з важкою зброєю. [ROOT.GetFascistParty] була пов'язана із цим, тож усі лідери воєнізованих формувань, пов'язаних з партією, так званих коричневих сорочок, були затримані.\nЛисти, знайдені на одному з цих складів, вказують на участь генералів у цій змові, які привласнили цю зброю та підробили її інвентарні номери. Треба діяти вкрай обережно, оскільки ці ватажки могли вплинути на значну частину збройних сил."
 AAT_Sweden_flashpoints.12.a:0 "Ми виплатимо репарації державі [SWE.GetName] за збитки."
 AAT_Sweden_flashpoints.14.desc:0 "Спроби наших дипломатів обговорити інцидент у Паялі з [SOV.GetAdjective]ими офіційними особами наштовхуються на заперечення їхньої причетності. Ба більше, вони намагаються звинуватити нас у бомбардуванні як привід для втручання в їхні військові операції в державі [FIN.GetName]."
 AAT_Sweden_flashpoints.31.t:0 "[GER.GetName] просить право проходу для поранених"
 AAT_Sweden_flashpoints.37.t:0 "[SWE.GetName] відхиляє ультиматум"
 AAT_Sweden_flashpoints.41.a:0 "Чудово. Ми отримали від них якнайбільше."
 AAT_Sweden_flashpoints_civil_war_tt:0 "§RЯкщо комуністи здобудуть широку підтримку, зниження стабільності держави [SWE.GetFlag][SWE.GetName] може привести до громадянської війни!§!"
 AAT_britain_narvik.3.a:0 "Це обурливо."
 AAT_finland_continuation_war.02.t:0 "Фіно-[FROM.GetAdjective]ий пакт про війну з Союзом"
 AAT_finland_continuation_war.03.desc:0 "[FROM.GetLeader] недалекоглядно відкидає нашу пропозицію військового співробітництва. Можливо, [FROM.GetAdjective]ий уряд просто не хоче ризикувати тим крихким союзом, який укладено ним зараз із [SOV.GetAdjective]ою державою, — а може, в нього свої плани щодо нас. У будь-якому разі варто бути напоготові і шукати можливу підтримку в інших країн."
 AAT_finland_continuation_war.11.desc:0 "Незважаючи на початкову нерішучість, тепер [FIN.GetAdjective]ий уряд під тиском радянців розпочав вигнання і роззброєння наших військ, розміщених у його країні. Наші офіцери у зв'язку з цим готові задіяти розроблені на такий випадок плани, але хочуть уточнити, на який етап варто переходити. Що зараз важливіше?"
 AAT_finland_diplomacy.12.a:0 "[FROM.GetLeader] чинить в інтересах кольського і карельського народів."
 AAT_finland_diplomacy.13.t:0 "[FROM.GetLeader] відхиляє наші вимоги"
 AAT_finland_the_white_death.10.desc:0 "Багато разів Сімо Гяюгя оголошували загиблим, багато разів йому дивом вдавалося уникнути смерті, але він цілий і неушкоджений, він буде битися стільки, скільки буде потрібно. Біла Смерть іде за нашими ворогами!"
 AAT_finland_the_white_death.9.t:0 "Незважаючи на великі втрати, нашим солдатам вдалося вбити Білу Смерть!"
 AAT_germany.1.desc:0 "Держава [FROM.GetNameDef] звернулася до нас із пропозицією, яка, на їхню думку, буде вигідною для обох економік. Їм потрібні наші природні ресурси для їхніх галузей промисловості, а нам потрібні їхні інвестиції для розширення наших. Вигідна пропозиція, але чи не є це угодою з дияволом?"
 AAT_nordic_shared.2.desc:0 "Зі зростанням напруженості в усьому світі стає дедалі важче знайти надійних союзників, яким можна довіряти. [FROM.GetAdjectiveCap]ий уряд пропонує, щоби ми, як і інші Нордичні країни, оголосили світові, що [ROOT.GetName] та [FROM.GetName] будуть підтримувати один одного в разі іноземного вторгнення. Чи готові ми взяти на себе такі зобов'язання?"
 AAT_nordic_shared.2.t:0 "[FROM.GetName] пропонує взаємні гарантії"
 AAT_norway.6.b:0 "Сталін нас за це полюбить!"
 AAT_norway_communist.1.t:0 "[FROM.GetName] хоче відродити торгівлю в Помор'ї!"
 AAT_norway_communist.2.t:0 "Нова торгівля в Помор'ї"
 AAT_norway_rikstanken.12.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 AAT_norway_rikstanken.4.b:0 "Нам потрібні ці танки."
 AAT_norway_rikstanken.6.b:0 "Нам це не потрібно."
 AAT_norway_rikstanken.8.a:0 "Нарешті!"
 AAT_norway_rikstanken.8.desc:0 "[FROM.GetAdjectiveCap]ий уряд прийняв угоду про продаж великої кількості танків нашій країні. Це дозволить нашим військовим реально конкурувати з великими державами."
 ACTION_UNIT_SUPPORT:0 "$COUNT|H$ — підтримують атаку"
 ACTION_UNIT_SUPPORT_BOMBARDMENT:0 "надають підтримку бомбардуванням у бою поблизу"
 AFG_SOV_tech_sharing_group_desc:0 "Народи [AFG.GetNameDef] і [SOV.GetNameDef] почали обмінюватися знаннями та науковими досягненнями для спільного благополуччя."
 AFG_biding_our_time_desc:0 "Коли король Захір-шах виступає як символічна фігура нації, уряд може займатися своїми справами, не боячись радикальних повстань, якщо він зберігає лояльність консервативної більшості. Однак, все ще можуть бути невеликі можливості модернізувати націю способами, які не порушують традиційну діяльність."
 AFG_confederation_pak_fascism_DEF:0 "Афгано-пакистанський халіфат"
 AFG_develop_central_asia_category:0 "Розвиток Центральної Азії"
 AFG_expand_equipment_purchases_desc:0 "Наші збройні сили стають дедалі залежнішими від обладнання, що виходить за рамки простих гвинтівок та снарядів. Якщо вони мають залишатися надійною силою, ми повинні придбати більше допоміжного обладнання якомога швидше."
 AFG_expand_kabul_university:0 "Розширити Кабульський університет"
 AFG_expand_state_run_factories_desc:0 "Після років недбальства з боку попереднього режиму, настав час розпочати економічну модернізацію країни шляхом створення нових державних фабрик, що виробляють як споживчі, так і військові товари."
 AFG_follower_of_islam:0 "Послідовник Ісламу"
 AFG_form_the_khuddamul_furqan_desc:0 "Щоб зміцнити легітимність нашого нового уряду, ми повинні створити належну політичну партію під керівництвом Золотого Еміра. Єдиною прийнятною відданістю є Худдамуль Фуркан, і лише ця партія принесе спасіння народу."
 AFG_instate_a_compulsory_jizya_desc:0 "Права немусульман були чітко визначені в старій адміністрації. Настав час скоригувати ці питання для сучасного світу та довести всім нашим підданим, що ми є освіченим царством."
 AFG_introduce_national_service_desc:0 "Нації навколо нас занурюються у конфлікт, і немає гарантії, що ми зможемо уникнути втягнення у вир. Щоб підготуватися до такої події, ми запровадимо форму національної служби для посилення збройних сил."
 AFG_modifiy_look_to_the_past_modifier_tt:0 "Модифікувати §Y$AFG_look_to_the_past_modifier$§! на:\n"
 AFG_mughal_core_state:0 "Інтегрувати §Y[FROM.GetName]§! до Імперії"
 AFG_political_events.03.t:0 "[FROM.GetName] відхиляє пропозицію"
 AFG_political_events.131.desc:0 "[FROM.GetAdjective] уряд погодився на нашу пропозицію конфедерації. Тепер ми можемо розпочати процес інтеграції нашої нової території в нашу політичну та економічну систему. Це, сподіваюся, послужить стримуючим фактором для будь-яких наших регіональних супротивників у найближчому майбутньому."
 AFG_political_events.52.t:0 "[FROM.GetNameDefCap] відхиляє план"
 AFG_rapprochement_with_non_pashtuns:0 "Зближення з непуштунами"
 AFG_setup_artillery_mio:0 "Заснувати державний завод із виробництва артилерії"
 AFG_stir_unrest_in_the_east_desc:0 "Вазиристан та Пешавар залишаються осередком як анти-[RAJ.GetAdjective], так і [AFG.GetAdjective] активності. Ми повинні наслідувати їхній приклад та розпалити повстання на Хайберському перевалі, щоб утримати сили короля зайнятими в іншому місці."
 AFG_turko_persian_union:0 "Турко-перський союз"
 AIRBASE_DISTANCE_DESC:0 "§TВідстань від регіону $REGION|H$ до авіабази $AIRBASE|H$.§!"
 AIRWING_MISSION_TYPE_DROP_NUKE_DESC:0 "Ядерний удар."
 AIRWING_MISSION_TYPE_TRAINING:0 "Повітряні тренування"
 AIRWING_RECENTLY_ASSIGNED_WARNING:0 "§RВи відновите ефективність лише коли авіакрила будуть мати активне завдання.§!"
 AIRWING_REGION_COVERAGE:0 "Покриття в цьому регіоні: $VALUE|1%R$"
 AIR_BASE_CARRIER_SEPARATOR_DESELECT:0 "§GКлацніть, щоби відняти розміщені тут авіакрила від вибору.§!"
 AIR_DEPLOYMENT_TOOLTIP:0 "§RВи не можете вибрати це авіакрило до того, як його буде розгорнуто.§!"
 AIR_OVERVIEW_CATEGORY_CARRIER_2:0 "$COUNT|H$ §Hпалубних морських бомбардувальників§!"
 AIR_OVERVIEW_CATEGORY_REGULAR_3:0 "$COUNT|H$ §Hважких винищувачів§!"
 AIR_SORT_DISTANCE:0 "Відстань"
 AIR_WAREHOUSE_LABEL:0 "Резерви"
 AI_MESSAGE_CAT3_MES4:0 "I wouldn't have lost to $OTHER$ if Paradox hadn't explicitly coded it so that my allies are dumber than two tons of granite while the enemy has literal precognition!"
 ALB_subject_DEF:0 "$OVERLORDADJ$а $ALB$"
 ALERT_LOW_SUPPLY:0 "§RНестача ресурсів!§!"
 ALERT_SPOTTER_INFO_REGION:0 "Є $NUM|H$ нових виявлень у цьому регіоні."
 ALL_TASKFORCES_SELECTED:0 "Завдання — всі оперативні групи"
 ALT_fascism_ADJ:0 "Алтайсько-ойратськ"
 AOI_fascism_DEF:0 "Італійська держава Східна Африка"
 ARG_anti_american_propaganda:0 "Антиамериканська пропаганда"
 ARG_balancing_act_decisions_AAT_tt:0 "Відімкне сукупність рішень §Y$ARG_balancing_act_decisions$§!, котрі дозволять нам балансувати між заспокоєнням держав [USA.GetFlag]§Y[USA.GetName]§! та [ENG.GetFlag]§Y[ENG.GetName]§! або [GER.GetFlag]§Y[GER.GetName]§! та [ITA.GetFlag]§Y[ITA.GetName]§!. Умиротворення надасть §Yсубсидії на оснащення§! для §Yміжнародного ринку§!."
 ARG_british_loan_flag:0 "[ENG.GetAdjective]а позика"
 ARG_communism_DEF:0 "Народна Аргентина"
 ARG_economic_tax_reforms_decisions_desc:0 "Упроваджуючи різні реформи в нашу поточну податкову систему, ми зможемо надати допомогу сільським районам держави [ARG.GetName]. Створення життєздатної інфраструктури для наших фермерських громад лише сприятиме процвітанню нашої країни!"
 ARG_fighter_equipment_2:0 "FMA Hawk 75O"
 ARG_firmes_volamos:0 "Firmes Volamos"
 ARG_help_the_allies:0 "Допомогти Союзникам"
 ARG_hitler_4:0 "Відновити корабель"
 ARG_invite_spanish_nationalists_desc:0 "На жаль, переворот Франко було відбито, і громадянська війна офіційно закінчилася. Тисячі іспанських націоналістів тепер прагнуть покинути Іберійський півострів у пошуках дому, який краще відповідає їхній ідеології. Враховуючи історичний зв'язок між нашими двома націями, ми повинні відкрити для них двері, щоб вони допомогли зростаючому націоналістичному руху [ARG.GetNameDef]."
 ARG_jet_fighter_equipment_1:0 "FMA I.Ae. 27 Pulqui I"
 ARG_light_cruiser_2_desc:0 "The La Argentina light cruiser was built for Argentina by the U.K. in the late 1930s. She made several training cruises before the war but was placed in the active squadron to maintain Argentine neutrality. The ship was an enlarged version of the British Arethusa class, displacing 6500 tons and armed with nine 6 in. cannon as its main guns."
 ARG_no_gods_no_masters_desc:0 "Ніхто не повинен контролюватися тими, хто прагне завдати йому шкоди. Хоча наші сусіди, можливо, не розуміють нашої ідеології, ми можемо взяти на себе відповідальність звільнити їх від войовничих націй, які прагнуть жадібно розширити свою сферу впливу."
 ARG_political_events.100.desc:0 "[ARG.GetNameDefCap] звернулася до нас, запрошуючи приєднатися до їхнього альянсу. Чи об'єднаємо ми зусилля і допоможемо захистити демократію на континенті Південної Америки?"
 ARG_political_events.111.desc:0 "У відповідь на нашу операцію в [URG.GetNameDef], [FROM.GetNameDef] вимагає, щоб ми негайно вивели наші війська та припинили воєнні дії. Якщо ми відмовимося, існує ризик, що це переросте у повномасштабну війну з [FROM.GetNameDef]."
 ARG_political_events.12.t:0 "[ARG.GetNameDefCap] прагне приєднатися до Осі"
 ARG_political_events.20.t:0 "[URG.GetNameDefCap] погоджується на умови ультиматуму"
 ARG_political_events.25.a:0 "[ARG.GetNameDef] та [CHL.GetNameDef] стоять разом!"
 ARG_political_events.42.desc:0 "Ми отримали повідомлення від наших товаришів у [ARG.GetNameDef], які звернулися з надією, що ми підтримаємо їхній зростаючий революційний рух. У разі громадянської війни вони бажають, щоб ми надіслали добровольців, аби допомогти їм повалити їхній войовничий уряд."
 ARG_political_events.73.b:0 "Ми можемо запропонувати їм пакт про ненапад, але не більше."
 ARG_political_events.75.t:0 "[FROM.GetNameDefCap] погоджується на Пакт про ненапад"
 ARG_political_events.76.a:0 "Як прикро."
 ARG_reach_out_to_chile_desc:0 "[CHL.GetNameDefCap], порівняно з іншими нашими безпосередніми сусідами, набагато більша та могутніша. Було б розумно звернутися до них і запропонувати можливість укласти союз з нами. Можливо, якщо ми поступимося їм їхньою жаданою територією, вони охочіше погодяться."
 ARG_reach_out_to_the_soviet_union:0 "Звернутися до [SOV.GetNameDef]"
 ARG_revisit_the_roca_runciman_treaty:0 "Переглянути договір Роки–Рансимена"
 ARG_ship_medium_battery_1:0 "23.8 cm/35 Krupp"
 ARG_ship_torpedo_3:0 "5x 533-мм торпедний апарат"
 ARG_state_atheism:0 "Державний атеїзм"
 ARG_submarine_1_desc:0 "The Santa Fe-class class represents three submarines ordered from Italy and delivered to Argentina in 1933. The three ships of the class formed the backbone of the Argentinian Submarine Force until 1960. They were nicknamed the 'Tarantinos' for the dockyards in Taranto, Italy where they were built."
 ARG_the_castillo_cabinet_desc:0 "На жаль, через посилення хвороби, Президент Ортіс готується подати у відставку. Його місце займає колишній Віце-президент, Рамон Кастільйо. У міру зростання напруги між військовими фракціями, Кастільйо доведеться обережно розіграти свої карти, щоб забезпечити своє президентство."
 ARG_the_second_argentine_republic_desc:0 "Після багатьох років корупції та шахрайства ми нарешті повстали з попелу нашої старої держави та воскресли як новий бастіон демократії у західній півкулі. З цього дня, щоб відокремити себе від помилок минулого, ми будемо відомі як Друга Аргентинська республіка. ¡En unión y libertad!"
 ARG_union_nacional_fascista:0 "Національний фашистський союз (Unión Nacional Fascista)"
 ARMOUR_TITLE:0 "БРОНЕТЕХНІКА"
 ARMOUR_TITLE_HEAVY:0 "ВАЖКА"
 ARMY_LEADER_PREFERRED_TACTIC_DESC:0 "Генерали мають додаткову ймовірність $ARMY_GENERAL_CHANCE|H$ (фельдмаршали — $FIELD_MARSHAL_CHANCE|H$) обрати переважну тактику персонажа під час бою."
 ARMY_LEDGER_EQUIPMENT:0 "Запас"
 ARMY_NAVIES_MISSION:0 "Завдання: $MISSION$"
 AST_NZL_NO_PUPPET_FALLBACK:0 "країни південного Тихоокеанського регіону"
 AST_airborne_defence_desc:0 "Ми мусимо захищати небо Австралії та вкладати кошти у повітряну оборону, у тому числі перехоплювачі та зенітні установки."
 AST_allied_works_council:0 "Союзницька промислова рада"
 AST_approach_the_independents_desc:0 "Уряд нестабільний, оскільки віра в його здатність провести Австралію через недавні потрясіння згасає з кожним днем. Звернувшись до незалежних політиків, можна переконати їх, що зміна уряду була б найкращим виходом."
 AST_australian_regular_army_desc:0 "Ми вивчили багато уроків: від пляжів Галліполі до пустель Північної Африки, гір Греції та джунглів Південно-Східної Азії. Цей важко здобутий досвід сформував армію, яка є більш гнучкою та адаптивною, ніж будь-яка інша."
 AST_australian_womens_army_service_desc:0 "Усі чоловіки потрібні на фронті, тому тисячі австралійських жінок стануть водіями, радистами та техніками."
 AST_battle_cruiser_1:0 "$ENG_battle_cruiser_1$"
 AST_castle_crumbling_mission_desc:0 "Австралія дивиться на своїх лідерів після трагічної авіакатастрофи в Канберрі. Чи залишиться діючий уряд вартим довіри громадськості навіть після втрати членів кабінету, чи зміна керівництва просто була б на краще?"
 AST_castle_crumbling_mission_event_tt:0 "§YЕфекти події:§!"
 AST_citizen_military_forces_desc:0 "Настав час підготувати армійський резерв і тим самим підвищити рівень готовності до війни. Ми закликаємо всіх доступних ополченців до загонів самооборони, а потім, якщо це буде потрібно, підготуємо їх до несення військової служби за кордоном."
 AST_cv_CAS_equipment_3_short:0 "Sea Fury"
 AST_cv_nav_bomber_equipment_2:0 "Blackburn Roc"
 AST_diplomatic_events.17.desc:0 "Ворог наближається з півночі, і це лише питання часу, коли він опиниться на нашому порозі, принаймні так стверджують австралійські чиновники. [AST.GetNameDefCap] пропонує нам об'єднатися для створення єдиного бар'єру, переважно шляхом передачі [INS.GetName] під австралійське управління, або, щонайменше, надавши право проходу військам."
 AST_diplomatic_events.25.b:0 "Безумовно ні!"
 AST_diplomatic_events.30.t:0 "Австралія просить права на ресурси"
 AST_diplomatic_events.4.a:0 "Так, можемо."
 AST_diplomatic_events.40.desc:0 "Не маючи змоги взяти на себе обіцянки, які ще не можуть бути виконані, [GER.GetNameDef] відмовляється підтримати наш прихід до влади. Науруанський пакт закінчується, не встигнувши навіть початися, і амбіції [AST.GetFascistParty] повністю залишаться на наших плечах."
 AST_diplomatic_events.49.t:0 "Непідписаний пакт"
 AST_diplomatic_events.57.desc:0 "Вішістська Франція погодилася передати нам африканські території і дозволила австралійському гарнізону захопити контроль над регіоном."
 AST_diplomatic_events.62.desc:0 "Дипломати з [AST.GetName] прийшли до нас із пропозицією укласти Антибританський пакт. Це передбачає їхню допомогу в поверненні північної Ірландії від англосаксів, без нашого прямого втручання.\n Натомість, у разі їхнього успіху, ми приєднаємося до їхньої фракції та допоможемо їм у майбутній війні проти Британії, якщо така станеться.\nХоча об'єднання з північчю є привабливим, ми повинні ретельно обдумати, чи в тому ми становищі, щоб так відкрито ворогувати з нашим сильнішим сусідом, і що важливіше, чи зможемо ми вийти переможцями у разі конфлікту — щоб уся Ірландія знову не стала простою британською колонією."
 AST_diplomatic_events.76.t:0 "[USA.GetNameDefCap] відмовляється"
 AST_diplomatic_events.79.t:0 "[JAP.GetNameDefCap] гарантує незалежність [AST.GetName]"
 AST_dividing_the_pacific_desc:0 "«Австралія понад усе» виступає за мир із [JAP.GetNameDef], визначаючи націю — на відміну від більшості австралійських громадян — як потенційного тихоокеанського союзника, а не постійно навислу загрозу. З розширенням впливу [AST.GetName], цілком розумно, щоб [JAP.GetName] також з цим погодилася, і щоб потенційні конфлікти між нашими двома країнами були залагоджені до того, як вони встигнуть виникнути."
 AST_ensure_cabinet_loyalty_desc:0 "Загроза вотуму недовіри не становить небезпеки, поки більшість кабінету голосує за діючий уряд. Ми маємо забезпечити лояльність Кабінету."
 AST_expanding_into_new_markets:0 "Вихід на нові ринки"
 AST_expeditionary_leader:0 "Цей §YГенерал§! матиме рису §YЕкспедиційний лідер§!, яка покращує його можливості за кордоном, але обмежує кількість дивізій, якими він може командувати."
 AST_factory_investments:0 "Інвестиції у фабрики"
 AST_factory_investments_desc:0 "В обмін на те, що [ROOT.GetFascistParty] проводитиме вигідну для них політику, провідні діячі бізнесу погодилися інвестувати в галузеві реформи, які узгоджуються з цілями партії.\n\nЯкщо ми хочемо гарантувати, що як військові, так і цивільні запаси залишатимуться достатніми в часи конфлікту, нам потрібно розширити наші промислові потужності."
 AST_government_formation_period_desc:0 "Кожна партія хоче мати владу для визначення власної політики, але якщо певні обставини цього вимагають, уряд національної єдності може бути найрозумнішим варіантом.\n\n§W§YЕфекти, поки активно:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\nПартія $AST_ruling_party$ може сформувати §YУряд національної єдності§!.\n\nСформуйте §YУряд національної єдності§! у вікні демократичних виборів, розташованому в дереві фокусів Австралії.§!"
 AST_hand_in_glove_desc:0 "Просуваючись на північ, ми можемо збільшити австралійський вплив на дипломатію та конфлікти в Південно-Східній Азії. Ми вже довели свою здатність захищати британські інтереси поруч із власними, тому [ENG.GetNameDef] повинні зрозуміти, чому їхні віддалені території краще було б передати в наші руки."
 AST_hear_the_thunder_desc:0 "Чуєш, чуєш гуркіт грому? З далекої південної землі наші стратегічні бомбардувальники несуть міць Австралії по всьому світу. Коли небо реве, а земля тремтить, наші вороги будуть знати: буря прийшла і принесла руйнування."
 AST_heavy_cruiser_2:0 "Клас «Surrey»"
 AST_heavy_cruiser_4_desc:0 "These ships were proposed by Sir Winston Churchill, Lord of the Admirality, in the early stages of WWII to counter the German Deutschland class big gun cruisers. These vessels would have had 9.2 in. cannons, heavy AA, and strong armor. They were designed to effectively battle the enemy capital ships. The ships were eventually cancelled because of high costs and a lack of demand for a new heavy cruiser."
 AST_industrial_expansion_desc:0 "Велика депресія завдавала шкоди економічним показникам нашої країни протягом більшої частини минулого десятиліття. Тепер, коли у нас є політична воля до більш рішучих дій, ми повинні спрямувати її на сміливе розширення нашої промислової бази, створюючи робочі місця, збільшуючи попит на ресурси та випускаючи більше товарів для ринку."
 AST_integrate_the_fort:0 "Інтегрувати форт"
 AST_lee_enfield_no1_mark3_desc:0 "Ця маленька зірочка має значення — Lee-Enfield No. 1 Mk III* означає модифікації воєнного часу для швидшого і дешевшого виробництва. Оскільки попит випереджає навіть ці досягнення, ми повинні прийняти «схему розповсюдження», за якої компоненти вироблятимуться меншими фірмами та збиратимуться в Літгоу для збільшення випуску."
 AST_light_tank_aa_equipment_1:0 "Vickers Mk VI Anti-Air"
 AST_lose_sufficient_funds_tt_50:0 "§RВтратити§! Достатньо коштів (На §Y50§! днів)\n"
 AST_maritime_commission:0 "$USA_maritime_commission$"
 AST_medium_tank_artillery_equipment_3:0 "Yeramba"
 AST_mio_trait_cross_pacific_logistics:0 "Транстихоокеанська логістика"
 AST_mio_trait_nuffield_cruiser_tank_lineage:0 "Родовід крейсерських танків"
 AST_morts_dock_organization:0 "Док Морта"
 AST_never_another_gallipoli_desc:0 "Єдиний спосіб не втягувати Австралію в ще дорожчі війни — вести зовнішню політику самостійно. Ми обійдемося без далекого короля і не дозволимо давнім кровним союзам втягувати нас у війни, від яких нам немає жодної користи."
 AST_no1_flying_training_school_desc:0 "Заснована в 1921 році зі створенням Королівських ВПС Австралії, Льотна тренувальна школа відкривалася і закривалася в залежності від коливань попиту на авіаційний персонал. У зв'язку зі зростанням глобальної напруженості нам слід знову відкрити її для підготовки нового покоління пілотів та екіпажів."
 AST_platypus_modifier:0 "Обдарований качкодзьоб"
 AST_resist_western_intruders:0 "Опір західним загарбникам"
 AST_robert_g_menzies:0 "Роберт Г. Мензіс"
 AST_rural_concessions:0 "Поступки селу"
 AST_strat_bomber_equipment_3:0 "Avro Lincoln"
 AST_super_heavy_tank_destroyer_equipment_1:0 "Iron Duke"
 AST_take_it_to_foreign_streets_tt:0 "Подовжує тривалість іноземного комуністичного впливу на 60 днів у всіх наразі інфільтрованих націях."
 AST_the_1938_sesquicentenary_tt:0 "Фокус '§YНовий курс§!' у гілці §YЗаселяй або помри§! стає доступним."
 AST_the_australian_commonwealth:0 "Австралійський Комінвелт"
 AST_the_singapore_strategy:0 "Сінгапурська стратегія"
 AST_united_states_as_our_keystone_desc:0 "Ми знаємо про проблеми, з якими стикається Сполучене Королівство. Ми знаємо про небезпеку розпорошення сил, але ми також знаємо, що Австралія може впасти, а Британія все ще триматиметься. Тому ми твердо вирішили, що Австралія не впаде, і ми докладемо всіх зусиль для формування плану, в якому Сполучені Штати стануть ключовою опорою."
 AST_volunteer_defence_corps_taog_desc:0 "Створений як сили, подібні до британської Національної гвардії, Добровольчий корпус оборони — це неоплачувана громадянська міліція, що складається з тих, хто не підлягає регулярній службі. Незважаючи на ці обмеження, їхнє знання місцевої місцевості робить їх добре придатними для партизанської війни, якщо станеться найгірше."
 ASY_fascism_ADJ:0 "Ассирійськ"
 ATJ_communism_ADJ:0 "Ачезьк"
 ATJ_neutrality_ADJ:0 "Ачезьк"
 ATTRITION_UPKEEP:0 "\n - Підтримання частини: $VALUE|=-1%0$"
 AUS_VICTORY_POINTS_6571:0 "Яссінья"
 AUS_allied_tech_sharing_group_desc:0 "Ініціатива, започаткована [AUS.GetAdjective] з метою спільного розвитку технологій у рамках союзників."
 AUS_austria_boosting_communism_here_flag:0 "Австрія зараз насаджує комунізм у іншій країні"
 AUS_becoming_grossosterreich_decision:0 "§BТРІУМФ§! «[GetGrossosterreichCosmeticIdeology]» §BТРІУМФ§!"
 AUS_crusade_on_communism_desc:0 "Поки на європейському континенті є комуністи, наша країна та її народ не будуть в безпеці. Нам потрібно покласти край цій червоній загрозі, перш ніж вона стане справжнім джерелом проблем."
 AUS_danubian_countries_tt:0 "§YДунайські§! країни"
 AUS_danubian_socialist_communes_desc:0 "Наразі [ROOT.GetNameDef] повинна була протистояти своїм ворогам, покладаючись тільки на себе. Ми не хочемо, щоб так сталося з нами в майбутньому, однак на даний момент немає альянсів, які б відповідали ідеалам нашої країни. Створення власного альянсу — однозначно, найкращий варіант!"
 AUS_demand_hungarian_submission:0 "Вимогти угорську покірність"
 AUS_improved_warfare_strategies_bonus:0 "Удосконаленні стратегії ведення війни"
 AUS_kingdom_of_austria_neutrality:0 "Ерцгерцогство Австрія"
 AUS_news_events.11.a:0 "Навіщо це їм?"
 AUS_news_events.4.desc:0 "[AUS.GetAdjective]ий ас-винищувач, Годвін фон Брумовський, вчора ледь не потрапив у авіакатастрофу під час навчання нідерландського студента над аеродромом Схіпхол.\n\nФон Брумовський був найуспішнішим асом-винищувачем могутнього Luftfahrtruppen (ВПС колишньої Австро-Угорщини). Йому приписують 35 самостійних перемог у повітрі, 12 спільних, і ще 8 залишаються непідтвердженими. Він брав участь як у Великій Війні, так і в австрійський громадянській 1934 року.\n\nДует пілотів вижив відносно неушкодженим. "
 AUS_news_events.7.t:0 "Отто фон Габсбург повертається в Австрію"
 AUS_no_longer_expansion_target:0 "[FROM.OWNER.GetNameDefCap] більше не буде метою [ROOT.GetAdjective]ої експансії"
 AUS_panzer_effort_bonus:0 "Удосконалення танків"
 AUS_political_events.118.b:0 "Ми залишимо наші поточні домовленості, щоб вирішити це."
 AUS_political_events.124.desc:0 "Як ми й очікували від нашого колишнього союзника, вони були тільки раді отримати запрошення взяти участь і зібрати нашу колись славетну фракцію. Вони погодилися приєднатися до нашої боротьби проти всього світу, який ставився до нас так несправедливо наприкінці Великої ВВійни."
 AUS_political_events.125.t:0 "[FROM.GetNameDefCap] відхиляє наше запрошення"
 AUS_political_events.19.a:0 "Нам потрібна будь-яка можлива допомога!"
 AUS_political_events.31.desc:0 "Коли пил після громадянської війни влягся, з нами зв’язався [FROM.GetAdjective]ий уряд щодо питання компенсації за їхні зусилля в нашій громадянській війні. Вони вимагають певної компенсації за роботу, яку вони виконали, людей, яких вони втратили, і зброю, яку використали та зламали їхні волонтери."
 AUS_political_events.45.desc:0 "Виявляючи відверту неповагу та зневагу до власної безпеки, [FROM.GetNameDef] вирішила відхилити нашу пропозицію. Угода була б взаємовигідною для обох сторін, однак схоже, що вони не поділяють наших настроїв щодо цього."
 AUS_political_events.63.t:0 "[AUS.GetAdjective]і біженці готові допомогти"
 AUS_political_events.81.a:0 "Чудово, тепер ми готові їх захистити"
 AUS_political_events.85.desc:0 "\nМи добре усвідомлювали, що наші дії в державі [FROM.GetNameDef] рано чи пізно будуть виявлені. На щастя, здається, [FROM.GetLeader] не бачить нічого поганого в нашій підтримці комуністичних настроїв серед їхніх працівників. І правильно, ми всього навсього інформуємо їх про їхні права та обов’язки пролетаріату."
 AUS_political_events.90.b:0 "Карл Реннер добре послужив нам до цього!"
 AUS_political_events.97.desc:0 "Наш запит на приєднання до альянсу [ROOT.GetFactionName] було схвалено! Хоча ми впевнені, що наша країна потребувала значної й різкої зміни курсу, ситуація зараз надто серйозна. Після Великої Війни ми розірвали зв’язки з усіма альянсами в надії, що подібна ситуація більше ніколи не повториться. Хоча зараз ми можемо жити у відносній безпеці, оточені нашими новими союзниками, ми усвідомлюємо, що мир справді є крихкою річчю."
 AUS_political_events.98.desc:0 "Незважаючи на всі наші зусилля, запит, який ми надіслали [FROM.GetAdjective]им егоїстам на приєднання до альянсу [FROM.GetFactionName], було відхилено. Їхні відповіді на запитання «чому» не дали реальної причини, і здається, що нас знову кинули напризволяще."
 AUS_political_events.98.t:0 "[FROM.GetNameDefCap] відхиляє наше прохання"
 AUS_rally_the_people_desc:0 "У нашій історії було багато спроб державних переворотів тими, хто не поділяв ідеали керівної верхівки. У надії більше не вдаватися до таких методів, ми повинні згуртувати людей на свій бік і наполягати на мирних реформах."
 AUS_rebuild_democratic_systems:0 "Відновити демократичні системи"
 AUS_recruitment_push:0 "Кампанія прискореного вербування"
 AUS_release_imprisoned_leaders_desc:0 "У міру того, як наша нація поступово ставала все більш авторитарною; тих, хто наважувався їй протистояти, швидко кидали до в’язницям. Ці ув’язнення були абсолютно несправедливими і ґрунтувалися виключно на політичних мотивах. Ми повинні звільнити ув'язнених і знову зробити політичну опозицію легальною."
 AUS_seek_support_from_guarantors_tt:0 "Вони, швидше за все, дадуть позитивну відповідь, якщо мають §GВисоку§! думку про нас."
 AUS_seek_to_purchase_alaska:0 "Попит на Аляску"
 AUS_steyr_arms_investment:0 "Інвестування в Steyr Arms"
 AUS_steyr_organization:0 "Steyr Arms"
 AUS_sturmscharen_support:0 "Забезпечити підтримку Штурмшарена"
 AUS_supporting_italy_in_ethiopia_category:0 "Підтримати Італію в їх конфлікті з Ефіопією"
 AUS_supporting_italy_in_ethiopia_focus:0 "Підтримати Італію у війни з Ефіопією"
 AUS_the_evidenzburo:0 "Бюро доказів"
 AUS_up_security_around_high_command:0 "Підвищити безпеку членів верховного командування"
 AUS_up_security_around_high_command_tt:0 "Це дозволить нам убезпечити наше військове командування."
 AUTOMATE_HOME_BASE:0 "Автоматизувати вибір бази приписки: $VALUE$"
 AUTO_BALANCE_SHIPS_IN_TASK_FORCES:0 "Розподілити вибрані кораблі у збалансованих оперативних групах"
 BALTIC_autobahn:0 "[Root.GetAdjective]ий автобан"
 BALTIC_axis_investments_desc_fasc_int:0 "Позиції фашизму у світі зараз сильні, і, незважаючи на цілком виправдані сумніви, не можна заперечувати, що торгівля з фашистськими державами та їх інвестиції значно посилять [ROOT.GetNonIdeologyAdjective] економіку."
 BALTIC_defence_of_our_nation_desc:0 "Громадянська промисловість така ж важлива для нашої оборони, як і військова. Рівний гул машин буде розноситися по всій державі [Root.GetNonIdeologyName], коли його патріотичні громадяни почнуть працювати, виконуючи свій обов'язок індустріалізації країни."
 BALTIC_events.5.d:0 "Натхнувшись недовго існуючої в минулому Литовсько-Білоруської РСР, [From.GetLeader] бажає об'єднати державу [From.GetNameDef] з Білоруссю. держави [From.GetNameDef] для загальної революції, знищивши бар'єр між Сходом та Заходом."
 BALTIC_events.501.t:0 "[From.GetNameDefCap] погоджується"
 BALTIC_events.6.b:0 "У жодному разі! [Root.GetNonIdeologyName] залишиться [Root.GetAdjective]!"
 BALTIC_focus_on_the_interior_2:0 "Підготуватися до приходу німців"
 BALTIC_german_tank_licences_desc_default:0 "Німецькі танки відмінно проявили себе, пройшовшись блицем по завойованих територіях, заставши противників зненацька і розкидавши їх. Якщо ми зможемо використовувати таку ж тактику в прийдешніх війнах на Сході, це піде на користь державі."
 BALTIC_german_war_economics_desc:0 "[GetGermanWarEconomicsDesc]"
 BALTIC_natural_resources_desc:0 "[Root.GetNaturaResource_BAL] — джерело багатства нашої країни; ми торгуємо з радянцями, з Союзниками та з нашими друзями-балтами. Нам слід було б збільшити внесок у розробку ресурсів — нехай [Root.GetExtraction_BAL]!"
 BAR_democratic_ADJ:0 "Баротсейськ"
 BATTLE_ATTACKMOD:0 "Модифікатор атаки"
 BBA_SWI_annual_election.1.t:0 "Вибори Президента Швайцарської Конфедерації"
 BBA_african_union_events.23.t:0 "Спроба залякування в [FROM.GetNameDef] успішна"
 BBA_african_union_events.5.desc:0 "Уряд [FROM.GetNameDefCap] відмовився приєднуватися до [ETH_GetCentralBankName], віддаючи перевагу контролю над власною валютою та митною політикою у найближчому майбутньому."
 BBA_ethiopia_communist_events.01.a:0 "Ми підтримаємо наших товаришів у їхній боротьбі."
 BBA_ethiopia_communist_events.12.a:0 "Чудово!"
 BBA_ethiopia_communist_events.26.desc:0 "[SOV.GetNameDefCap] виключили можливість посередництва між нами та [ITA.GetAdjective]ою владою. Вони посилаються на небажання [ITA.GetName] дослухатися до Ліги Націй і той факт, що для впливу на них довелося б погрожувати силою. Ризик ескалації війни було визнано надто великим самим [SOV.GetLeader]."
 BBA_ethiopia_communist_events.28.t:0 "[SOV.GetNameDefCap] вимагає узгодження зовнішньої політики"
 BBA_ethiopia_communist_events.53.a:0 "Це краще, ніж нічого."
 BBA_ethiopia_communist_events.55.t:0 "[JAP.GetAdjective] підривники тікають з Імперії"
 BBA_ethiopia_communist_events.59.a:0 "Нам їхня торгівля й не потрібна."
 BBA_ethiopia_exile_events.17.t:0 "[ROOT.GetLeader] обіцяє [FROM.GetLeader] кораблі"
 BBA_ethiopia_exile_events.33.t:0 "[FROM.GetName] відмовляє"
 BBA_ethiopia_exile_events.34.desc:0 "[FROM.GetNameDefCap] дозволяє нам приєднатися до [FROM.GetFactionName]. Тепер у нас набагато більше шансів перемогти [ITA.GetName]."
 BBA_ethiopia_exile_events.41.b:0 "Це початок, але [ROOT.GetAdjective]ий народ мусить показати більше, щоб продемонструвати свої зусилля"
 BBA_ethiopia_exile_events.45.a:0 "Хоч якийсь мир, хоч якийсь спокій"
 BBA_ethiopia_fascist_events.01.a:0 "$ETH_haile_selassie_gugsa$ — очевидний вибір."
 BBA_ethiopia_fascist_events.51.a:0 "[ETH.GetName] сильнішає!"
 BBA_ethiopia_fascist_events.54.a:0 "Певно, ми можемо поділитися старим спроядженням."
 BBA_ethiopia_fascist_events.66.a:0 "Майбутнє належить [ETH.GetAdjective] народу."
 BBA_ethiopia_imperial_events.6.a:0 "Як вони сміють?!"
 BBA_italo_ethiopian_war_events.10.b:0 "Ми не можемо ризикувати нашою економікою."
 BBA_italo_ethiopian_war_events.100.t:0 "Запит від [FROM.GetNameDef]"
 BBA_italo_ethiopian_war_events.111.desc:0 "Після резолюції Ради Ліги Націй [FROM.GetAdjective]ий уряд на чолі з [FROM.GetLeader] нарешті прийшов до тями. Мирний договір, написаний Лігою Націй, відновлює довоєнні кордони. Він, на жаль, не включає в себе ніякої компенсації для держави [ROOT.GetName] за всі супутні збитки, але він дасть нам час, щоби почати відбудовувати країну."
 BBA_italo_ethiopian_war_events.14.a:0 "Треба це правильно організувати."
 BBA_italo_ethiopian_war_events.200.a:0 "Якби вони вміли робити більше, ніж говорити..."
 BBA_italo_ethiopian_war_events.510.a:0 "Вони відповідатимуть за свою брехню!"
 BBA_italo_ethiopian_war_events_wargoal_tt:0 "Великі держави в Лізі Націй можуть отримати ціль війни проти держави [ROOT.GetName]."
 BBA_italy_air_accident.01.a:0 "Нищівний удар..."
 BBA_italy_anti_colonialism_events.54.desc:0 "Жителі Східної Африки побачили, як доброзичливо та ефективно ми управляємо їхніми землями, і проголосували за те, щоб приєднатися до нашої адміністрації! Здається, що наші інвестиції та турбота про їхні провінції окупилися. Це, безумовно, піде на користь усім нам."
 BBA_italy_communist_events.01.c:0 "Сандро Пертіні поведе нас вперед."
 BBA_italy_communist_events.02.a:0 "Підтримаємо їх!"
 BBA_italy_interaction_events.15.desc:0 "[FROM.GetName] погодилась на наші вимоги та вирішив повністю демілітаризувати західну Анатолію. Це означає, що вони будуть набагато слабшими та не матимуть можливості чинити початковий опір там, де ми зможемо їх атакувати."
 BBA_italy_interaction_events.25.b:0 "Ми не можемо впоратися з таким протистоянням."
 BBA_italy_interaction_events.29.t:0 "Італія забирає регіон [802.GetName] у нас!"
 BBA_italy_interaction_events.33.t:0 "[ITA.GetName] хоче провести переговори щодо своїх претензій до регіону [906.GetName]"
 BBA_italy_interaction_events.37.b:0 "Splendido!"
 BBA_italy_interaction_events.38.t:0 "Вознесіння Папи Римського"
 BBA_italy_interaction_events.42.desc:0 "Держава [FROM.GetName] смиренно прийняла нашу пропозицію захисту і вклонилася законним володарям Середземного океану. Сьогоднішній день осяює новим яскравим світлом Іберію та державу [ITA.GetNameDef]."
 BBA_italy_interaction_events.60.desc:0 "Італія підписала мирний договір з Ефіопією, повернувши їй частину завойованих земель. Тепер італійський уряд просить нас виконати свою частину угоди й гарантувати незалежність Австрії перед обличчям німецького експансіонізму."
 BBA_italy_local_rulers.4.b:0 "Зробити $ETH_seyoum_mengesha$ губернатором регіону."
 BBA_italy_missiolinis.123.t:0 "Грецію підкорено"
 BBA_italy_missiolinis.201.a:0 "Ми перевернемо кожен камінь."
 BBA_italy_missiolinis.93.desc:0 "Компетентність нашої служби розвідки було незаперечно доведено після того, які деяких незгідливих громадян було захоплено за змову проти фашистського уряду Італії з допомогою з-за рубежу. Муссоліні використав цей успіх, аби продемонструвати, що саме під його проводом Італія переможе та подолає всякі труднощі, які може принести майбутнє."
 BBA_italy_naval_cooperation_programs.04.b:0 "Італійці не мають що нам запропонувати."
 BBA_italy_purge_the_party.1.a:0 "Очистити радників"
 BBA_italy_recognize_the_empire.1.desc:0 "[FROM.GetLeader] проголосив світанок Італійської імперії! Хоча наш посол у Римі рекомендує нам просто визнати цей факт і дозволити мріяти про велич, інші стурбовані таким поворотом подій. Вони стверджують, що умиротворення призведе лише до ще більших поступів, і що ми повинні стримувати такі небезпечні мрії про імперію."
 BBA_swiss_expansion.17.t_no_alps:0 "[ROOT.GetName] знову незалежна!"
 BBA_swiss_expansion.18.desc:0 "Наші плани нарешті здійснюються. [ROOT.GetNonIdeologyName] знову отримує незалежність, а разом з нею — території, які раніше були відомі як [FROM.GetAdjective] Альпи.\n\nХоч ми більше не перебуваємо під захистом колишнього сюзерена, нові землі підвищують наші шанси на виживання."
 BBA_swiss_expansion.6.c:0 "Ми не піддамося цьому прищу на обличчі Європи"
 BBA_switzerland.12.t:0 "Давід Франкфуртер просить про помилування"
 BBA_switzerland.20.t:0 "[FROM.GetName] не вступає до Антанти, але пропонує гарантії"
 BBA_switzerland.6.desc:0 "Юридичний представник вдови Густлоффа, без сумніву надісланий [?SWI.SWI_fascist_germany.GetNameDef], намагається змусити Федеральну Раду вплинути на суд для винесення суворого вироку Давіду Франкфуртеру. Це вкрай незвична вимога, яка, без сумніву, є спробою [?SWI.SWI_fascist_germany.GetNameDef] продемонструвати свою владу над нами.\n\nЗадоволення цього запиту може мати наслідки для нашої міжнародної репутації, тож ми повинні впевнитися, чи можемо дозволити собі відмову, якщо саме це ми хочемо зробити."
 BBA_switzerland_fascist.4.a:0 "Це несправедливо — це наші землі"
 BBA_switzerland_trade.7.a:0 "Знайдемо інший шлях!"
 BEG_democratic_ADJ:0 "Бенішангул-гумузьк"
 BEL_anti_corruption_taskforce:0 "Антикорупційна робоча група"
 BEL_belgian_renaissance:0 "Бельгійський ренесанс"
 BEL_benelux_union_tt:0 "Якщо вони є демократичними або не приєднаними, §Y[HOL.GetNameWithFlag]§! та §Y[LUX.GetNameWithFlag]§! будуть запрошені до §Y$BEL_benelux_union_faction$§!"
 BEL_corporate_social_responsibility:0 "Корпоративна соціальна відповідальність"
 BEL_dam_the_consequences:0 "Запобігти наслідкам"
 BEL_expedite_fort_construction_desc:0 "Цей світ небезпечний, сповнений ворожих держав. Нам потрібно забезпечити свою готовність і значно інвестувати в наші укріплення та інженерні сектори, щоб мати підготовку до того, коли вона стане необхідною."
 BEL_flanders_neutrality_DEF:0 "Велике герцогство Фландрія"
 BEL_government_of_national_unity:0 "Уряд національної єдності"
 BEL_infantry_equipment_2:0 "FN mle30 Type D"
 BEL_jet_fighter_equipment_2:0 "SABCA Hunter"
 BEL_join_comintern:0 "Приєднатися до Комінтерну"
 BEL_king_law_freedom:0 "Король, Закон, Свобода"
 BEL_legacy_of_the_soldier_king:0 "Спадщина короля-солдата"
 BEL_mio_trait_stampe_et_vertrongen:0 "Stampe et Vertrongen"
 BEL_remove_flooded_tank_barriers:0 "Прибрати затоплені танкові загородження"
 BEL_repudiate_treaty_with_france_desc:0 "[FRA.GetNameDefCap] відмова продовжити лінію Мажино вздовж наших кордонів фактично відкриває широкі двері, через які ворог буде змушений атакувати. Відмовившись від наших угод з ними, ми можемо бути вільними від будь-яких військових зобов'язань допомогти їм, але вони все одно будуть змушені втрутитися, якщо ми будемо атаковані, або ризикують вторгненням на свою неохоронювану територію."
 BEL_the_belgian_legion_desc:0 "Бельгійський легіон — це збірка консервативних і монархістських лоялістів, готових і бажаючих взяти зброю на ім’я їхнього короля. Ми повинні вивезти їх з країни, де зможемо, і використовувати їх на користь."
 BEL_the_king_surrenders:0 "Король здається"
 BEL_the_walloon_legion_desc:0 "Тепер, коли наша справжня спадщина правильно встановлена та уточнена, пора скористатися цією славною традицією та показати світу, що ми дійсно здатні зробити."
 BHR_communism_DEF:0 "Бахрейнська радянська республіка"
 BHR_communism_party:0 "ФНВ-Б"
 BHR_neutrality_DEF:0 "Королівство Бахрейн"
