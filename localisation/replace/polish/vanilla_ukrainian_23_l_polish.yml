 ITA_balbo_medium_control_range:0 "$ITA_mussolini_medium_control_range$"
 ITA_balkan_ambition:0 "Балканські амбіції"
 ITA_battleship_4_desc:0 "Лінкори «Impero» були гіпотетичним класом лінкорів пізньої війни. Вони мали водотоннажність близько 43 000 тонн, були озброєні 381-мм гарматами Ansaldo і добре броньовані."
 ITA_befriend_turkey:0 "$ITA_turkey_friend$"
 ITA_bop_military_parade:0 "£BoP_right_texticon Провести військовий парад"
 ITA_bop_slander_the_duce_desc:0 "Італія бореться на кількох фронтах через некомпетентність лідера [ITA.GetLeader]. Можливо, настав час для нового лідерства?"
 ITA_bop_take_over_ministry_of_justice_desc:0 "Назвавши себе міністром благодаті та правосуддя, Беніто Муссоліні отримає прямий контроль над судовою системою та установами Італії."
 ITA_bring_back_exiled_intellectuals_desc:0 "Фашистський режим змусив незліченну кількість італійських громадян піти у вигнання, серед яких є великі філософи, інтелектуали та науковці. Настав час запропонувати всім цим біженцям можливість повернутися додому."
 ITA_coronate_prince_aimone:0 "Коронувати принца Аймоне"
 ITA_corpo_di_truppe_volontarie:0 "Corpo Truppe Volontarie"
 ITA_culto_del_duce_desc:0 "Беніто Муссоліні, завойовник Африки, месник Адви, без сумніву, є найважливішим італійським державним діячем із часів римських імператорів. Він є абсолютною вершиною мужності, не виказує страху. Ми мусимо зробити так, щоби кожен італієць знав, що він мусить завжди прагнути стати настільки схожим на Муссоліні, наскільки це можливо."
 ITA_cv_CAS_equipment_1:0 "Breda Ba.65bis"
 ITA_cv_CAS_equipment_3_short:0 "Ba.201bis"
 ITA_demand_balearic_islands_bba:0 "$ITA_demand_balearic_islands$"
 ITA_demand_balearic_islands_bba_desc:0 "$ITA_demand_balearic_islands_desc$"
 ITA_develop_ethiopia_tt:0 "Додати §Y1 інфраструктуру§! й §G1§! комірку для будівництва в [ETH.GetAdjective]их областях (до §Y3§!), підконтрольних державі §Y[ROOT.GetFlag][ROOT.GetNameDef]§! або §Y[ROOT.GetAdjective]ому суб'єкту§!."
 ITA_disband_the_blackshirts:0 "Розпустити чорносорочників"
 ITA_end_fiat_ansaldo_duopoly_desc:0 "У нашому машинобудівному секторі вже давно панують дві компанії: «Fiat» і «Ansaldo». Хоча ці двоє є машинобудівними компаніями світового рівня, це дещо стримує зростання, адже жоден конкурент не може вижити на ринку. Якщо ми хочемо мати здорову машинобудівну галузь у довгостроковій перспективі, нам доведеться зруйнувати цю дуополію."
 ITA_expanded_corporatism_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$modifier_production_speed_arms_factory_factor$: §G+5.00%§!\n$modifier_production_speed_industrial_complex_factor$: §G+5.00%§!\n\n"
 ITA_germ_italy_same_tt:0 "§YІталія§! та §YНімеччина§! мають однакову §Yідеологію§!"
 ITA_german_millitary_cooperation_desc:0 "Завдяки тісній співпраці з потужною німецькою армією ми зможемо поєднати найліпше з німецької ефективності й італійських інновацій. Ми матимемо стратегічну перевагу над будь-ким, хто наважиться нам протистояти."
 ITA_grand_council_low_control_range:0 "Низький вплив ради"
 ITA_italian_mafia_dec_cat:0 "Італійська мафія"
 ITA_jet_fighter_equipment_1_short:0 "Re.2007"
 ITA_lancia_organization:0 "$lancia$"
 ITA_liberate_the_workers_of_africa_tt:0 "Кожна повністю підконтрольна Італії або її суб'єктам область в Африці:\nДодати §Y2 од. кожного ресурсу§!, який уже видобувається в області.\n$COMPLIANCE$: §G+10.0%§!"
 ITA_libyan_railway_state_modifier_tt:0 "\nДодає обласний модифікатор §Y$ITA_libyan_railway_modifier$§! в північноафриканські узбережні області. $generic_current_effects$\n"
 ITA_light_cruiser_3:0 "Клас «Capitani Romani»"
 ITA_masters_of_the_aegean_desc:0 "Якщо ми хочемо контролювати Середземне море, ми мусимо спершу забезпечити абсолютне панування Італії над Егейським морем. Завдяки цьому ми не лише контролюватимемо доступ до Чорного моря та більшої частини Балканського узбережжя, але й матимемо нові морські бази, за допомогою яких зможемо убезпечити Суецький канал."
 ITA_medium_tank_destroyer_equipment_3_short:0 "Semovente M41M 90/53"
 ITA_meritocracy:0 "Меритократія"
 ITA_mobilize_railway_guns_tt:0 "Створити §Y4 залізничні гармати§! в області [ROOT.capital.GetName]."
 ITA_moschettieri_del_duce_desc_king:0 "Для власного захисту король утримує під своїм командуванням загін елітних стрільців. Хоча безпека короля, звісно, має найвищий пріоритет, цих зразкових солдатів можна також використати для ліпшого вишколу наших регулярних військ, що збільшить їхню ефективність у бою."
 ITA_naval_cooperation_program_research_group_name:0 "Італійська програма морської співпраці"
 ITA_political_commissars:0 "Політичні комісари"
 ITA_power_plants_in_terni:0 "Електростанції в Терні"
 ITA_power_plants_in_terni_desc:0 "Наші нинішні електростанції в Терні недостатні та потребують розширення, якщо ми хочемо перетворити регіон на ще більший промисловий центр."
 ITA_pressure_country_government_balkan:0 "$SOV_pressure_country_government_baltic$"
 ITA_producing_midget_submarines_for_export_flag:0 "Вже виробляємо карликові підводні човни на експорт"
 ITA_pugno_alzato:0 "Pugno Alzato"
 ITA_redshirts_div_cap_8_tt:0 "Змінити межу шаблону §YCamicie Rosse§! на §G+8§!."
 ITA_regional_development_in_state_desc:0 "Розвиток наших колоніальних володінь зробить їх більш придатними для життя і процвітання."
 ITA_reorganize_irregulars_tt:0 "Додасть §Y2 батальйони нерегуляної піхоти§! й §Y1 загін кінної розвідки§! до всіх шаблонів дивізій нерегулярної піхоти.\nДодасть §Y2 батальйони кавалерії§! й §Y1 загін кінної розвідки§! до всіх шаблонів дивізій нерегулярної кавалерії.\nДодасть §Y2 батальйони верблюдової кавалерії§! й §Y1 загін кінної розвідки§! до всіх шаблонів дивізій нерегулярної верблюдової кавалерії."
 ITA_ricostruzione_industriale_cg_penalty_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y+1.0%§!\n\n"
 ITA_scientific_cooperation_research_sharing_group_tt:0 "Кожна союзна країна приєднається до: §Y$ITA_program_for_scientific_cooperation_name$§!."
 ITA_socialist_republic_neutrality_DEF:0 "Італія"
 ITA_spanish_italian_faction_desc:0 "Франко та іспанські націоналісти — наші природні союзники, сполучені релігією, культурою та ідеологією. Разом ми могли би захопити Гібралтар і дуже ускладнити життя Королівським ВМС."
 ITA_standardization_desc:0 "Війна в повітрі — більшою мірою, ніж війна на морі та війна на суші, — є війною індустрії проти індустрії. Вирішальну роль відіграє маса і тільки маса. Ми мусимо забезпечити виробництво якомога більшої кількості літаків, навіть якщо це означає, що згодом буде складніше змінювати конструкцію."
 ITA_steel_in_tripoli_desc:0 "Схоже, що в пустелях за межами Тріполі похована велика кількість заліза, яке тільки й чекає, щоби ми його відкопали та переробили. Побудувавши неподалік металургійний завод, ми могли би використовувати сталь для подальшого просування наших славетних військ!"
 ITA_steel_industry_in_terni_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$modifier_production_speed_arms_factory_factor$: §G+2.50%§!\n\n"
 ITA_strat_bomber_equipment_1_short:0 "P.50"
 ITA_superaereo_desc:0 "Часи невеликих груп літаків, що літають туди-сюди, давно минули. Сучасна повітряна кампанія багато в чому схожа за складністю на будь-яку наземну операцію. Тому нам потрібен спеціалізований штаб планування, який координуватиме дії різних ескадрилій, щоби ті могли діяти разом для виконання своїх завдань."
 ITA_support_nationalist_spain:0 "Підтримати Націоналістичну Іспанію"
 ITA_thermojet_research:0 "Термореактивні дослідження"
 ITA_towards_a_greater_italy:0 "Уперед, до Великої Італії"
 ITA_transport_plane_equipment_2:0 "Caproni Ca.133"
 ITA_triumph_in_africa_bba_desc:0 "Ганьбу Адви було стерто. По 40 роках після приниження, якого ми зазнали від рук ефіопів, ми нарешті помстилися. Наші війська довели свою спроможність поза будь-якими сумнівами, і тепер весь світ мусить визнати нашу міць!"
 ITA_united_socialist_front:0 "Об'єднаний соціалістичний фронт"
 ITA_war_with_france:0 "Війна з державою [FRA.GetName]"
 ITZ_fascism_DEF:0 "Південно-західна Імперія мая"
 IVO_communism_DEF:0 "Комуна Слонової Кістки"
 JAP_STATE_655:0 "Кіта Карафуто"
 JAP_VICTORY_POINTS_1148:0 "Шюнсен"
 JAP_ally_the_philippines:0 "Союз із Філіппінами"
 JAP_approach_yasuda:0 "Звернутися до Ясуда"
 JAP_arm_resistance_decision:0 "Озброїти опір проти §Y[FROM.OWNER.GetAdjective]ої§! влади в [FROM.GetName]"
 JAP_armored_car_equipment_2_short:0 "Kokusan"
 JAP_carrier_2_desc:0 "«Soryu» та «Hiryu» були спроєктовані з дзеркальною острівною надбудовою, щоби прискорити процес відновлення літаків під час плавання поруч один з одним. Це були швидкісні авіаносці з можливістю розміщення великих авіагруп, але з мінімальним бронюванням. Їх водотоннажність становила 20 000 тонн, а великі двигуни забезпечували високу швидкість і велику дальність польоту."
 JAP_claim_the_raven_crown_desc:0 "Наш Божественний Імператор стоїть вище за всіх інших, і ті, хто цього не розуміє, мають бути знищені. Ми повинні вдертися в [BHU.GetNameDef] і забрати їхній трон собі."
 JAP_cruiser_modernization:0 "Модернізація крейсерів"
 JAP_currently_investing_in_foreign_industry_flag:0 " Наразі інвестує в іноземну промисловість"
 JAP_develop_lethal_infantry_equipment_desc:0 "Армія чітко дала нам зрозуміти, наскільки застарілою є зброя, що зараз є в їхньому розпорядженні, і вимагає щось із цим зробити. Ми повинні зробити великі інвестиції в розробку більш сучасного піхотного спорядження, щоб ми більше ніколи не програвали війни."
 JAP_develop_singapore_aluminium_deposits:0 "Розвиток родовищ бокситів у Малайї"
 JAP_domestic_tank_modernization_program_desc:0 "Ми повинні вчитися на своїх помилках і гарантувати, що наша бронетехніка зможе витримати протитанкову зброю, інакше наші сили будуть приречені на поразку. Це слід робити, покладаючись не на проєкти західних держав, а на винахідливість великого [ROOT.GetAdjective]ого народу."
 JAP_eastern_road_and_steel_expansion:0 "Розширення східних доріг і сталеливарної промисловості"
 JAP_establish_nippon_hassoden:0 "Заснування Ніппон Хассоден"
 JAP_expand_boeitai_tt:0 "Межу ополчення збільшено до менш ніж 24 дивізій"
 JAP_finish_the_fight:0 "Закінчити боротьбу"
 JAP_first_air_fleet:0 "Перший повітряний флот"
 JAP_form_national_cooperatives_desc:0 "Багато наших мислителів виступають за створення більшої кількості національних кооперативів — організацій, утворених окремими особами або підприємствами зі спільними економічними, соціальними чи культурними потребами. Вони діють на принципах власності членів, демократичного контролю та взаємної вигоди. Ми повинні заохочувати їх створення."
 JAP_form_the_ldp:0 "Створити ЛДП"
 JAP_found_the_air_defense_surveilance_corps:0 "Заснувати Корпус нагляду протиповітряної оборони"
 JAP_free_colonized_asian_countries_tt:0 "Розблоковує рішення §YВимагати верховенства§! над §Yазійськими націями§!, які є суб'єктами §Yнеазійських націй§!"
 JAP_greater_east_asian_federation:0 "Велика Східноазійська Федерація"
 JAP_hold_a_peoples_tribunal_desc:0 "Є багато тих, хто вчинив тяжкі злочини від імені колишніх урядів, і хто боровся проти революції та її прихильників, підриваючи їх. Ми повинні судити цих осіб публічно і негайно викорінити будь-яке контрреволюційне інакомислення!"
 JAP_imperial_influence_ruler_name_text:0 "§Y[GetImperialInfluenceRulerName]§!"
 JAP_instill_the_spirit_of_bushido_desc:0 "Через державний шінтоїзм і традиційні ідеї моралі, відомі як Бушідо, ми зможемо прищепити людям потребу пожертвувати собою заради блага держави та імператорської сім'ї."
 JAP_integrate_the_government_general_tt:0 "Відкриває рішення для §Yінтеграції корейських регіонів§!, щойно вони матимуть достатньо високий рівень підкорення"
 JAP_isolate_oceania:0 "Ізоляція Океанії"
 JAP_jet_fighter_equipment_2_short:0 "J7W Shinden-Kai"
 JAP_light_tank_artillery_equipment_2:0 "Type 4 Ke-Nu"
 JAP_light_tank_destroyer_equipment_3_short:0 "Ho-Ru"
 JAP_minpon_shugi_desc:0 "Політичну доктрину Мінпон Шюгі, яка народилася в епоху Тайшьо, можна визначити як «політику здійснення політичної влади, що цінує прибуток, щастя та думку народу». Це не порушує імперського устрою і працює на користь як народу, так і імператора. Ми повинні продовжувати нашу демократію, засновану на монархічному суверенітеті, і закріпити її в нашій новій конституції!"
 JAP_motorized_equipment_0_short:0 "Kurogane, тип 95"
 JAP_promote_hayao_tada_to_lieutenant_general_decision:0 "Підвищити Хаяо Таду до генерал-лейтенанта"
 JAP_raise_the_red_flag_high_desc:0 "Червоний прапор є символом нашої революції і демонструє нашу рішучість просувати революцію вперед з надією врешті-решт звільнити всіх азійських робітників від буржуазного гніту. Настав час гордо підняти прапор високо і проголосити, що революція крокуватиме далі, назавжди!"
 JAP_reorganize_the_united_autonomous_government_desc:0 "Монгольський військовий уряд наразі має лише рудиментарну політичну організацію і не протримається довго без нашого втручання. Ми повинні реорганізувати їх у Монгольський об'єднаний автономний уряд, щоб вони могли належним чином утвердитися як суверенна нація."
 JAP_secretly_rebuild_the_party_desc:0 "Є багато груп, які втратили свій голос і політичне представництво, коли в 1925 році було підписано Закон про збереження миру. Однією з таких груп є комуністи, чиї організації були оголошені поза законом і які зазнали великих утисків за нашого минулого режиму. Ми повинні прагнути легалізувати їхній рух, щоб отримати їх як прихильників у нашій боротьбі проти військових."
 JAP_shinkansen_tt:0 "Коли національний дух §Y$JAP_shinkansen_construction_idea$§! буде видалено:\n"
 JAP_solidify_tohokai_rule:0 "Зміцнення правління Тохокай"
 JAP_soviet_japanese_neutrality_pact_desc:0 "Наш північний кордон має бути убезпечений, якщо ми хочемо мати свободу дій для удару на південь. Ми повинні негайно розпочати переговори з [SOV.GetNameDef], щоб гарантувати їхній нейтралітет, а також домовитися про розширення прав на ресурси Північного Сахаліну."
 JAP_spread_revolutionary_flames_to_west_asia_tt:0 "Розблоковує рішення для запрошення §Yкомуністичних близькогосхідних§! націй до нашого альянсу"
 JAP_supremacy_of_the_battlefleet:0 "Перевага лінійного флоту"
 JAP_supremacy_of_the_kempeitai:0 "Верховенство Кемпейтай"
 JAP_supremacy_of_the_kempeitai_desc:0 "Наші «солдати закону» переберуть на себе роль Токко, які є більш лояльними до старого режиму. Кемпейтай очолить національну поліцію та покращить наші можливості щодо боротьби з повстанцями, контррозвідки та придушення інакомислення."
 JAP_the_south_pacific_soviet:0 "Південно-Тихоокеанська Рада"
 JAP_the_spirit_of_the_imperial_nation_desc:0 "Щоб спрямувати увагу нашого народу на правильні речі та забезпечити його непохитну підтримку в досягненні [ROOT.GetAdjective]ої долі, ми повинні просувати Кокутай у кожному храмі та вшанувати [ROOT.GetLeader] у храмі в Токіо."
 JAP_unlock_senbu_occupation_law_tt:0 "Відкриває закон про окупацію у §Yкитайських§! регіонах:\n"
 JAP_west_pacific_treaty_org_trade_decision:0 "Почати торгові переговори з §Y[FROM.GetName]§!"
 JUNO_army_academy_random_generals_tt:0 "§YТри§! випадкові командувачі армії отримають §G+1§! до навичок планування."
 JUNO_brazil_events.132.desc:0 "[FROM.GetNameDefCap] не виконав свого зобов'язання перед Організацією американських держав, відмовившись прийти нам на допомогу. Таким чином, їх виключили з організації."
 JUNO_brazil_events.133.t:0 "Виключення з Організації американських держав"
 JUNO_brazil_events.141.desc:0 "Наша дипломатична місія повернулася з чудовими новинами. [FROM.GetNameDefCap] люб'язно прийняла наш подарунок — ягуара. На урочистій церемонії, яка привернула міжнародну увагу, вони привітали наш жест та погодилися на наші пропозиції щодо посилення торгівлі та співпраці у зовнішній політиці."
 JUNO_brazil_events.142.a:0 "Ми повинні діяти обережно."
 JUNO_brazil_events.162.t:0 "[FROM.GetNameDefCap] відхиляє виробничу співпрацю"
