 NAVAL_MISSION_NAME_TRAINING_DESC:0 "Наказати оперативній групі проводити тренування в сусідньому до найближчої морської бази в регіоні.\nУ процесі є шанс із часом пошкодити кораблі.\nЕкіпаж не отримуватиме досвід, поки не досягне рівня «Регуляри».\nВи отримуватимете §Yдосвід флоту§! під час тренувань.\n§YГордість флоту§! має менший шанс нещасних випадків.\n\nУтримуйте §HShift§! і клацніть, щоби розпочати §Hморські тренування§!, поки всі кораблі не будуть повністю натреновані."
