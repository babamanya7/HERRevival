 WW_hungary.111.a:0 "Якщо це воля народу"
 WW_hungary.120.desc:0 "Упродовж місяця в [76.GetName] тривав публічний референдум щодо приєднання до [HUN.GetNameDef]. Міжнародні спостерігачі повідомили про відсутність серйозних порушень. Результати свідчать про те, що більшість населення підтримала приєднання до [HUN.GetAdjective] держави. Чи визнаємо ми це рішення?"
 WW_hungary.32.desc:0 "Імператор [FROM.GetLeader] з [FROM.GetNameDefCap] вимагає від нас відновлення Цислайтанських земель і коронування Габсбурга як нашого нового монарха. Це фактично покладе край нашій незалежності, але може вберегти від повної анексії. Чи приймемо ми місце в новій імперській федерації?"
 WW_hungary.35.desc:0 "[FROM.GetLeader] звернувся до нас після візиту до нашої великої столиці, заявивши, що виступає від імені всього [FROM.GetAdjective] народу, з бажанням об'єднати наші держави у військовий альянс задля подальшого розширення територій обох націй."
 WW_hungary.36.t:0 "[FROM.GetNameDefCap] відновлює Центральні держави"
 WW_hungary.38.desc:0 "[FROM.GetLeader] звернувся до нас після візиту до нашої столиці, висловлюючи бажання об’єднати обидві держави у військовий альянс. Як відповімо на їхнє прохання?"
 WW_hungary.40.b:0 "Спробуємо інший підхід"
 WW_hungary.46.t:0 "[FROM.GetNameDefCap] відмовляється від монарха Відів"
 WW_hungary.50.a:0 "Так і є"
