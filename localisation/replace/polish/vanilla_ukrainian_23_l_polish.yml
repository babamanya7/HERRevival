 CHI_motorise_our_infantry_desc:0 "Наш людський резерв величезний і завжди був джерелом нашої могутності. Сучасний автотранспорт посилює звичайного солдата, доставляючи його в бій швидше і готовим завдати сильного удару. Людина в потрібному місці, з гвинтівкою в руках, завжди буде ефективною."
 CHI_ncns_sino_german_technical_mission_organization:0 "$german_chinese_tank_designer$"
 CHI_prosecute_cronyism_desc:0 "Занадто довго інтереси окремих осіб ставилися вище за потреби держави. Непотизм, хабарництво та розтрати роздирали тканину нашого суспільства. Цьому кінець зараз, настає нова ера чесноти!"
 CHI_reclaim_the_north_desc:0 "Через необхідність у минулому нам довелося відмовитися від претензій на великі ділянки північних територій. Але все змінилося, і зараз ми знаходимося в набагато сильнішій позиції — достатньо сильній, щоб знову повернути наші північні володіння!"
 CHI_reeducate_gu_zhutong_decision:0 "Перевиховати [SIC.GetFlag] $CHI_gu_zhutong$"
 CHI_reeducate_yu_zhishan_decision:0 "Перевиховати [MAN.GetFlag] $MAN_yu_zishan$"
 CHI_request_soviet_advisors_desc:0 "Війна радикально змінилася за останні десятиліття, і ми відстали. [SOV.GetNameDefCap] запропонував надіслати нам кваліфікованих експертів, щоб надолужити згаяне у нашій бронетанковій справі, і ми повинні погодитися."
