 CIV_LEDGER_THRESHOLD_RESEARCHED_AND_CURRENT_TREE:0 "Цивільні технології в процесі дослідження"
 CKK_SOV_communism_subject_ADJ:0 "Чукотськ"
 CLICK_NAVY_SEE_DETAILS:0 "§GКлацніть, щоби переглянути подробиці.§!"
 COG_31e_brigade_parachutiste_desc:0 "Ми повинні створити елітну парашутну одиницю, здатну швидко захоплювати населені пункти та знищувати ворогів у них, яка також може діяти як елітна охорона лідера нашої нації, якщо він коли-небудь опиниться під загрозою."
 COG_aeronautical_research_department_desc:0 "Хоча це може бути не тим, на що ми раніше значно інвестували, не можна забувати, що ми не повинні занадто сильно покладатися на іноземних акторів. Ми повинні спробувати розробляти та виробляти власні літаки, незважаючи на всі витрати, пов'язані з цим."
 COG_centralize_military_structure:0 "Централізація військової структури"
 COG_expand_shipping_industry_desc:0 "Багато місць в нашій країні важко досягти, якщо не використовувати повітряний транспорт чи річки. Ще одним важливим аспектом є зв'язки з іншими країнами через моря, і тому нам потрібно розширити нашу судноплавну індустрію, щоб задовольнити вимоги нашої модернізуючої нації."
 COG_freedom_at_gunpoint_dynamic_tt:0 "Отримати §YЦіль Війни на Визволення§! проти §Y[FROM.Capital.OWNER.GetName]у§!"
 COG_german_south_west_africa:0 "Німецька Південно-Західна Африка"
 COG_hold_the_pan_african_congress:0 "Провести Пан-африканський конгрес"
 COG_marine_nationale:0 "Національний флот"
 COG_military_service_for_citizenship_desc:0 "В нашій країні є багато людей, які не мають громадянства або паспорта. Тому ми повинні вчинити як це робили римляни і запропонувати громадянство кожному, хто буде служити в наших збройних силах певний період часу, сподіваючись таким чином привабити нових потенційних рекрутів."
 COG_mittelafrikan_kingdom_neutrality_DEF:0 "Королівство Міттельафрика"
 COG_peacekeeping_forces_desc:0 "Хоча війна наразі не охоплює Конго, вона продовжує вирувати в багатьох куточках світу. Ми повинні боротися за краще майбутнє, навіть якщо це означає відправку наших військ, щоб воювати за іноземні держави на віддалених землях."
 COG_ruanda_urundi_conscription_centers:0 "Виділити кошти на будівництво пунктів призову"
 COG_safeguard_cabinda_desc:0 "Провінція Кабінда колись була частиною Королівства Конго, і, оскільки війна розгоряється по всьому світу, настав час втрутитися та захистити наших братів від подальших страждань. Їхні нинішні окупанти можуть не сприйняти цей крок добре, але він необхідний для захисту майбутнього Африки."
 COG_socialist_education_reforms_desc:0 "Народ повинен бути належним чином освічений, щоб думати самостійно, не потрапляючи в пастки племінних розбіжностей і дикості. Тому ми повинні прагнути сформувати систему освіти та навчальні програми, які відповідатимуть нашим бажаним поглядам."
 COG_the_kingdom_of_kongo_focus:0 "Дім Água Rosada"
 COG_women_in_the_military_desc:0 "На даний момент жінки нашої країни не мають права брати участь у військовій службі, хоча є багато патріотичних жінок, які хочуть це зробити. Ми повинні змінити закони, щоб дозволити їм це, щоб мати можливість залучити якнайбільше здатних солдатів до наших збройних сил."
 COLLECTION_AMOUNT_OF_COMMUNIST_CONTROLLED_STATES_SAME_CONTINENT:0 "Області на тому ж континенті, підвладні §Yкомуністичним§! країнам"
 COLONIAL_FORCES_GENERAL_DESCRIPTION:0 "§GКлацніть, щоб оглянути шаблони суб'єктів і урядів у вигнанні.§!\n\nДивізії, створені за колоніальними шаблонами суб'єктів, можуть включати більше людських ресурсів суб'єкта при нижчому рівні автономії"
