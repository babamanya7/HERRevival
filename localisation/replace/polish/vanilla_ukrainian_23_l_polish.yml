 GRE_small_installment_payment_FRA:0 "$GRE_small_installment_payment_ENG$"
 GRE_soviet_influence_shunned_tt:0 "Якщо ганити §Y[FROM.GetAdjective]ий§! вплив після того, як ми скористались їх щедрістю, це може стати приводом до §Yвійни§!!\n"
 GRE_the_national_youth_organisation_desc:0 "Є щось чудове у тому, як німці та італійці організували свою молодь. Ми можемо запозичити їхню модель, щоби наші молоді люди не брали участі в антигромадських витівках і не виявляли неповаги до нашого великого лідера, яким є [ROOT.GetLeader]."
 GRN:0 "Гренландія"
 GRN_fascism_party_long:0 "Партія «Точка орієнтації»"
 GSM_fascism_party:0 "$CHI_fascism_party$"
 GUAY_disperse_military_power_desc:0 "Щоб забезпечити майбутнє нашого кабінету, ми повинні переконатися, що військові не зможуть захопити владу для себе."
 GUAY_meet_with_ITA:0 "Зустрітися з державою [ITA.GetNameDef]"
 GUAY_not_at_war_with_old_power:0 "Не перебуває у стані війни з обраною старою державою"
 GUAY_protect_domestic_industries_cash_crop:0 "Завершення $GUAY_cash_crop_exports$ призведе до:\nДодати: §G1§! §YЦивільну фабрику.§!\nДодати: §G1§! Будівельних слотів."
 GUAY_rekindle_old_gripes_URG_desc:0 "І [ARG.GetName], і [BRA.GetName] історично використовували нас у своїх власних цілях, що мало катастрофічні наслідки для нашого народу. Нам потрібно розширюватися назовні, щоб запобігти ворожим силам коли-небудь наблизитися до Монтевідео знову."
