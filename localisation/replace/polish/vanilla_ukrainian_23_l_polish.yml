 SEA_imperial_influence_events.241.t:0 "Фракція Флоту вимагає збільшення морського виробництва"
 SEA_japan_foreign_policy.110.t:0 "[FROM.GetNameDefCap] приймає повну інтеграцію"
 SEA_japan_foreign_policy.114.t:0 "[FROM.GetNameDefCap] відхиляє наш запит"
 SEA_japan_foreign_policy.14.desc:0 "[FROM.GetAdjective]і адміністратори, які допомагали у створенні нашої держави, вирішили, що зараз вдалий час для реорганізації нашої урядової структури та переформатування правової системи. У довгостроковій перспективі це лише зміцнить нас, тому ми не маємо причин їм відмовляти."
 SEA_japan_foreign_policy.19.a:0 "Вони знають, що для них краще"
 SEA_japan_foreign_policy.36.t:0 "[FROM.GetNameDefCap] поширює про-[FROM.GetAdjective]і настрої"
 SEA_japan_foreign_policy.37.a:0 "Саме так, як ми й передбачали"
 SEA_japan_foreign_policy.4.a:0 "Разом ми будемо сильнішими"
 SEA_japan_foreign_policy.41.t:0 "Сенбу"
 SEA_japan_foreign_policy.69.b:0 "Ми повинні приєднатися до них, процвітання вже близько!"
 SEA_japan_foreign_policy.78.b:0 "Ми поважатимемо їхні бажання, поки що..."
 SEA_japan_foreign_policy.80.a:0 "Дуже добре"
 SEA_japan_news_events.03.d:0 "Японський наступ у Бірмі триває, і нещодавно впав Рангун. Як столиця Британської Бірми, це місто має величезне стратегічне значення, і його втрата може стати вирішальним фактором у поточній бірманській кампанії.\n\nПовідомляється, що сам колоніальний губернатор був захоплений передовими японськими загонами, коли він керував перевезенням своїх речей з Будинку губернатора до вантажівки, але це ще не підтверджено."
 SEA_japan_popup_events.18.desc:0 "Військові почали готуватися до зіткнень із силами, лояльними уряду, після того, як цивільна поліція нещодавно оголосила про вірність Сейму. Схоже, вони намагаються забезпечити контроль над регіонами на випадок початку громадянської війни. Ми повинні почати протидіяти цьому акту заколоту з максимальною швидкістю!"
 SEA_japan_popup_events.20.a:0 "Вони заплатять за це!"
 SEA_japan_popup_events.28.a:0 "Хоккайдо підходить ідеально"
 SEA_japan_tokko_arrest_events.2.a:0 "Іноземні агенти отримують по заслугах!"
 SEA_warlords.100.a:0 "Ця зрада не зійде їм з рук!"
 SEA_warlords.17.t:0 "$wtt_political_warlord_support.12.t$"
 SEA_warlords.34.a:0 "Ми не піддамося на їхню брехню!"
 SEA_warlords.44.desc:0 "Ми щойно отримали повідомлення від [FROM.GetNameDef], що вони бажають бачити наші два регіони знову об'єднаними в єдине ціле, відоме як Лянгуан. Ця ідея відсилає нас до часів династії Цін і намісництва Лянгуан. Хоча нам більше не потрібні такі імперські титули, сила і престиж, які мала ця об'єднана сутність у той час, були незаперечними."
 SEA_warlords.48.tt:0 "§RЯкщо ми не зможемо перемогти їх протягом півроку, ми будемо змушені піти на патову ситуацію!§!"
 SEA_warlords.54.desc:0 "[FROM.GetLeader] вивів війська, розміщені в місті Яньань, намагаючись не лише зміцнити нас, а й привернути увагу центрального уряду. Зробивши це, [CHI.GetLeader], ймовірно, вирушить на північ, щоб покарати війська придушення і спробувати передислокувати їх на південний схід, одночасно роблячи догану бунтівним місцевим урядам, таким як [FROM.GetLeader] та [SHX.GetLeader]. Однак, перебуваючи в Сіані, [FROM.GetLeader] планує вдатися до радикального підходу, щоб переконати [CHI.GetLeader] створити Об'єднаний фронт проти Японії."
 SEA_warlords.67.desc:0 "[FROM.GetLeader] відхилив наш запит на передачу землі. Цього варто було очікувати від них, але це, безперечно, зашкодить нашим відносинам у довгостроковій перспективі."
 SEA_warlords.75.b:0 "A foolish idea"
