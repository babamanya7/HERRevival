 DEN_adjust_industrial_prioritize_desc:0 "Війна наближається, і ми повинні діяти відповідно, пристосовуючи нашу промисловість до військових потреб. Кожен чоловік і кожна жінка повинні розуміти і виконувати свій обов'язок без нарікань, щоб служити потребам країни."
