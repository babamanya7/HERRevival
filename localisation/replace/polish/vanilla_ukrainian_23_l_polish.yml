 bba_news.5.desc_owns_454:0 "[ETH.GetLeader] оголосив, що завдяки королівському родоводу, який нібито простягається в минуле аж до біблійного короля Соломона, саме він є законним правителем області [454.GetName]. Далі він проголосив переродження Ефіопії в Імперію Соломона. Вже оспоривши контроль великих держав над областю [454.GetName], [ETH.GetLeader] збирається перемістити столицю своєї імперії в місто [454.GetCapitalVictoryPointName]. Іще невідомо, які геополітичні наслідки буде мати це переродження Ефіопії."
 bermontian_party:0 "Бермонтівщина"
 bftb_bulgaria_equipment_purchases.1.c_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_artillery]§! од. §Yбуксованих ПТО§!"
 bftb_bulgaria_equipment_purchases.2.b:0 "Закупити бронетранспортери"
 bftb_bulgaria_equipment_purchases.4.c:0 "Закупити тактичні бомбардувальники"
 bftb_bulgaria_factions.21.desc:0 "Після того, як страйкарам почали протистояти наші сили, у всіх промислових районах почалися запеклі сутички і бунти. В області [?BUL.BUL_damaged_civs_state.GetName] бунти призвели до пошкодження цивільних фабрик[GetMilitaryFactoriesDamaged].[GetInfrastructureDamaged]"
 bftb_bulgaria_factions.27.a:0 "Разом ми досягнемо справжньої величі!"
 bftb_bulgaria_factions.47.t:0 "Націонал-соціалістичний рух інтегрований"
 bftb_bulgaria_factions.52.a:0 "Як обурливо..."
 bftb_bulgaria_fate_of_the_balkans.2.desc:0 "Дипломат, відправлений на переговори з урядом держави [FROM.GetName] про вступ до альянсу [BUL.GetFactionName], сьогодні приніс із [FROM.GetAdjective]ої столиці добру звістку: [FROM.GetLeader] погоджується на наші вимоги, і [FROM.GetLeader.GetHerHis] країна нарешті вступила до альянсу."
 bftb_bulgaria_fate_of_the_balkans.7.t:0 "[BUL.GetNameDefCap] вимагає [ROOT.GetAdjective]е підпорядкування"
 bftb_bulgaria_political_leaders.1.c:0 "Без нього світ стане кращим!"
 bftb_bulgarian_claims.9.desc:0 "[FROM.GetAdjectiveCap]ий уряд заявляє, що [ROOT.GetNameDef] не отримає адміністративний контроль над областю [FROM.FROM.FROM.GetName]. Союзник стверджує, що за нашою пропозицією варто лише розширити зону [ROOT.GetAdjective]ої окупації і урвати більше шматків Балкан після закінчення війни, і навіть сам [FROM.GetLeader] обмовився, що наші територіальні амбіції починають його дратувати."
 bftb_greece.104.t:0 "На півдні та півночі росте організований опір!"
 bftb_greece.105.t:0 "Громадянська війна!"
 bftb_greece.180.b:0 "Не цього разу."
 bftb_greece.182.c:0 "Воістину велика дружба!"
 bftb_greece.183.a:0 "Що ж, можливо, в інший раз."
 bftb_greece.188.desc:0 "На жаль, нам стало відомо, що цього разу [FROM.GetAdjective]і інвестори не стануть вкладати в нашу економіку. Це дуже прикро, але [FROM.GetAdjective]ий делегат не виключив можливості інвестицій у майбутньому, що нас влаштовує."
 bftb_greece.194.t:0 "[FROM.GetAdjectiveCap]і інвестори цього разу не стануть вкладати кошти"
 bftb_greece.195.a:0 "Тепер нам доведеться справлятися зі своїми економічними негараздами самими."
 bftb_greece.210.t:0 "Греки тримають обіцянки, дані на Іракліонській конвенції!"
 bftb_greece.218.a:0 "Не можна, щоб фашисти вирішували долю держави [ROOT.GetNameDef]!"
 bftb_greece.221.desc:0 "Більшість присутніх делегатів вирішила, що [FRA.GetNameDef] має отримати мандат у Курдистані після успішного повалення [TUR.GetAdjective]ої держави. [FRA.GetAdjectiveCap]і представники високо відгукнулися про делегатів за їх мудрість і передали [FRA.GetAdjective]ому уряду доручення про планування встановлення своєї адміністрації в регіоні."
 bftb_greece.232.desc:0 "Над нашим знедоленим народом сталося диво: божественне заступництво, послане нам із самих Небес святим Юстиніаном. Чоловіка в подертому лахмітті знайшли непритомним на березі гори Афон, де його врятували від неминучої смерті вірні служителі святого місця. Людина, яку влада, що заарештувала його, спочатку відкинула як божевільного, котрий пішки пройшов увесь шлях до держави [ROOT.GetNameDef] з Німеччини, насправді була ідентифікована одним із наших академіків НСГ як давно загублений нащадок династії Комнінів.\n\nДовго нас мучило питання, хто повинен очолити нашу Візантійську державу, і, здається, сам Бог дав нам своє рішення. Візантійський спадкоємець не знає жодного слова грецькою мовою, але його, безсумнівно, можна навчити! Воістину, [ROOT.GetNameDef] прихильна Божому провидінню."
 bftb_greece.234.b:0 "Ми не відмовимося від гарантій, чого б це не коштувало!"
 bftb_greece.25.t:0 "Іракліонська конвенція — Велика ідея відроджена!"
 bftb_greece.43.a:0 "Хай живе [TUR.GetNameDef]!"
 bftb_news.10.t:0 "Об'єднання балканських держав"
 bftb_news.11.d:0 "Вони лише хочуть, щоб [GER.GetLeader] захистив їх!"
 bftb_news.14.a:0 "Це нарешті принесе стабільність на Балкани!"
 bftb_news.202.desc:0 "[TUR.GetNameDefCap] і [SOV.GetNameDef] так і не домовилися про перегляд Лозаннського мирного договору, підписаного і який набув чинності, коли новоспечена Турецька республіка прогнала Антанту зі своїх земель під час [TUR.GetAdjective]ої війни за незалежність. Лозаннський договір демілітаризував Турецькі протоки, відкривши Босфор і Дарданелли для цивільного та військового транспорту. Судячи з усього, в найближчому майбутньому цей статус-кво не зміниться. За словами лідера [TUR.GetLeader], воно може призвести лише до того, що [TUR.GetNameDef] залишиться в чіпких лапах імперіалізму."
 bftb_news.206.b:0 "Що за бовдури!"
 bftb_turkey.1.a:0 "Ми підтримаємо у цьому питанні турків."
 bftb_turkey.131.a:0 "Нехай пробачить нас Всемогутній, але [GRE.GetNameDef] підлягає знищенню."
 bftb_turkey.132.desc:0 "[FROM.GetNameDefCap] відмовляється вчинити розумно і поділити державу [GRE.GetNameDef], віддаючи перевагу божевільній бійці за землю без огляду на її населення. Звичайно, вторгнення не бувають приємними, але можна було зробити все максимально делікатно, а [FROM.GetAdjective] дуболоми хочуть перетворити вторгнення в безладний бардак заради того, щоби захопити побільше територій і повністю підкорити [GRE.GetAdjective] народ.\n\nМи цього не хотіли. Цього не повинно було статися."
 bftb_turkey.134.i:0 "Казім Орбай очолюватиме військову хунту, доки ми не знайдемо свій шлях."
 bftb_turkey.139.desc:0 "[FROM.GetNameDef] і бандити, які очолюють цю країну, знову зрадили нашу довіру. Час закінчувати цей фарс. Союзники не поважатимуть нас, поки ми покриваємо країну, яка поводиться відверто вороже."
 bftb_turkey.16.b:0 "Ми дізнаємося про демократичну волю народу."
 bftb_turkey.26.desc:0 "[TUR.GetLeader] вимовив коротку промову в Антак'ї, привітавши жителів Хатаю з входженням до складу держави [TUR.GetNameDef] і з вдячністю зазначивши, що [FROM.GetLeader], лідер держави [FROM.GetNameDef], поважає демократичну волю народу. Хоч сирійськими офіційними особами ця заява була зустрінута з люттю, у Хатаї та державі [TUR.GetNameDef] настрій загалом добрий і багато [TUR.GetAdjective] громадяни вирушили зі своїх будинків у Хатай, щоби привітати новоявлених земляків зі вступом до держави [TUR.GetNameDef] та обмінятися подарунками."
 bftb_turkey.7.t:0 "[TUR.GetNameDefCap] йде на компроміс у питанні ремілітаризації проток"
 bftb_turkey.71.c:0 "Вони довели, що гідні вступити до альянсу [ROOT.GetFactionName]."
 bftb_turkey.75.c:0 "Необхідно захистити божественне право королів."
 bftb_turkey.79.t:0 "[FROM.GetNameDefCap] пропонує продовжити пакт про ненапад"
 bftb_turkey.93.t:0 "[FROM.GetName] відкидає Саадабадський пакт!"
 blitzkrieg:0 "Бліцкріг"
 bomber_ace_initiative_desc:0 "Офіційне визнання заслуг асів-бомбардувальників заохочує їхню відвагу та ініціативу."
 borbon_stuff_tt:0 "Повністю захоплено Францію"
 branch_operation:0 "Операції"
 brazil_militaristic:0 "Кров Ваших героїв"
 breakthrough_factor_tt:0 " $MODIFIER_BREAKTHROUGH$: $RIGHT|+=%1$"
 britain.20.d:0 "Азад, уряд Вільної Індії у вигнанні, поширює пропаганду та агітує за підтримку серед людей Індії. Незважаючи на те, що важливість спільної роботи Імперії є більшою, ніж будь-коли, вони вирішили, що настав час для удару."
 bulgaria.5.d:0 "Німеччина вирішила стати на бік підлих румунів у нашому прагненні до справедливості. [Root.GetLeader] повідомив німецькому послу, що Болгарія очікує більшого від своїх друзів."
 canada_vanilla.1.title:0 "Ronnie, the Bren Gun Girl"
 capture_cyphers_bribe_outcome:0 "Наш агент отримав від неназваного джерела повну копію книги шифрів в обмін на деякі цінності."
 category_all_armor:0 "Різновиди танків і бронетехніки"
 category_anti_air:0 "Батальйони ППО"
 category_scout_plane:0 "Літаки-розвідники"
 china.2.t:0 "Німеччина відкликала радників"
 china.203.d:0 "Звільнившись від контролю націоналістів, китайські революціонери, що симпатизують нашим ідеям, прийняли рішення об'єднати їхню державу з нашою під лідерством [Root.GetLeader]. Відтепер і назавжди буде одна [Root.GetName]."
 chinese_puppet_focus:0 "Китайська маріонетка"
 cobalt_sea_tt:0 "Граючи як [PHI.GetNonIdeologyName], запустіть успішний ядерний або термоядерний наліт із підводного човна"
 combat_stat_anti_air:0 "§HППО флоту§!\n\nППО флоту визначається з урахуванням сили всіх кораблів флоту. Вона заважає ворожим бомбардувальнам атакувати флот та зменшує шкоду від них.\n"
 condottieri:0 "Кондоттьєри"
 confirm_cancel_national_focus_progress_loss_plural:0 "Ви втратите $LOST_DAYS|R$ дн. прогресу."
 congo_independence_struggle.13.d:0 "Наша дипломатична гра з [COG.GetName] спрацювала! Їхня делегація прийшла до нас сьогодні, щоб прийняти своє місце як заморську територію."
 congo_independence_struggle.15.t:0 "[FROM.GetNameDefCap] не покидають без бою"
 congo_independence_struggle.19.a:0 "Перемога буде на їхній стороні!"
 congo_independence_struggle.21.a:0 "Слава [BEL.GetAdjective] Імперії!"
 congo_independence_struggle.8.t:0 "[FROM.GetNameDefCap] хоче, щоб ми стали заморським департаментом"
 construction2:0 "Будівництво II"
 construction4_desc:0 "Вищий ступінь механізації та поліпшені методики ще більше скорочують терміни будівництва."
 contain_japanese_expansion_asia_goal_name:0 "Стримувати японську експансію"
 containment_of_communism_goal_desc:0 "Світ не буде в безпеці, доки комуністична загроза не буде подолана."
 continuous_suppression:0 "Придушення спротиву"
 control_iwo_jima_goal_desc:0 "Забезпечення Іводжіми дозволить підтримувати далекобійні повітряні операції над Японією та розширити наше охоплення центральної частини Тихого океану."
 control_suriname_bauxite_goal_name:0 "Контролювати боксити Суринаму"
 control_the_chinese_coast_goal_name:0 "Зберегти контроль над узбережжям"
 convoy_sailing:0 "Конвоювання"
 coolant_loss:0 "Втрата охолоджувача для реактора"
 coordinate_strike_mark_targets_desc:0 "Команда буде використовувати заздалегідь сигнали і маркери, щоби дати нашим військам можливість простіше виявляти важливі цілі."
 cr_bonus:0 "Бонус до моделей крейсерів"
 cv_CAS_equipment_short:0 "Палуб. штурмовик"
 cv_nav_bomber_equipment_2_short:0 "Палуб. морськ. бомбардувальник II"
 cv_tech:0 "Моделі авіаносців"
 czech.14.d:0 "Словацькі лідери затаїли злість, коли їх усунули від управління державою, і активно підбурюють громадян до насильства. Сьогодні вони нарешті домоглися того, чого так завзято прагнули, — у Словаччині спалахнуло повстання."
 day_of_war:0 "День війни"
 decision_cost_CP_15_ArmXP_15:0 "£command_power£ §Y15§! £army_experience£ §Y15§!"
 decision_cost_CP_25_pp_15_blocked:0 "£command_power£ §R25§! £pol_power£ §R15§!"
 decision_cost_ie_1000_tooltip:0 "Прийняття цього рішення коштує £infantry_equipment_text_icon£ §Y1000§!"
 defence_in_depth_desc:0 "Виявивши незначний опір і тимчасово поступившись частиною землі, ми можемо розміняти простір на час, щоб атакуючі розтратили частину сил перед нашою контратакою."
 demolish_enemy_fortifications:0 "Знести ворожі укріплення"
 denmark_events.201.t:0 "Помер король Крістіан X"
 denmark_events.300.a:0 "Дай боже."
 denmark_events.300.t:0 "Засновано нові компанії"
 denmark_expansion_event.601.desc:0 "Чудові новини! [FROM.GetNameDefCap] погоджується приєднатися до нашої дослідницької угоди. Це означає, що в нас буде доступ до їхніх технологій. Майбутньому країни такий пакт піде тільки на користь."
 denmark_fascist_event.1.desc:0 "Цього ранку ми прийняли делегацію від [FROM.GetAdjective]ої фашистської партії. Вона хоче заручитися нашою підтримкою, щоб набрати силу у своїй країні. Якщо ми допоможемо їм, у нас у перспективі буде ще один гідний союзник."
 denmark_occupation_event.2.t:0 "[DEN.GetNameDefCap] здається"
 denmark_occupation_event.5.desc:0 "[FROM.GetNameDefCap] обирає насильство і кров, відхиливши нашу щедру пропозицію капітуляції. Ми знекровимо [FROM.GetAdjective]і війська насухо і покажемо їм, що нас не так-то легко завоювати!"
 denmark_overlord_events.11.c:0 "$DEN_aksel_larsen$"
 denmark_overlord_events.24.t:0 "[FROM.GetLeader] відмовляється віддавати владу"
 denmark_overlord_events.26.a:0 "Заборонити комунізм"
 denmark_overlord_events.26.t:0 "[FROM.GetNameDefCap] вимагає заборонити комунізм"
 denmark_overlord_events.32.desc:0 "Схоже, що [FROM.GetAdjective]ії стратегічні запаси закінчуються, раз вони звернулися до нас із вимогою надати зброю для поточних конфліктів.\nМожливо, це просто виверт, щоб обеззброїти нашу націю і завадити нам повстати і скинути [FROM.GetAdjective]е ярмо."
 denmark_overlord_events.35.a:0 "Але ж ця зброя була так потрібна нам самим"
 denmark_protection_event.120.desc:0 "Можливо, в деяких галузях науки [FROM.GetNameDefCap] і відстає від інших, але в інших їм немає рівних. Посланці цієї держави стверджують, що співпраця наукових колективів призведе до важливих проривів для обох наших країн. Чи погодимося ми на їхню пропозицію?"
 denmark_protection_event.6.t:0 "[FROM.GetNameDefCap] відкидає торговельну угоду"
 denmark_protection_event.9.desc:0 "Сьогодні вранці ми отримали повідомлення з держави [FROM.GetNameDef]: вони відхиляють нашу пропозицію про дослідницьку угоду. На жаль, обмін технологіями з [FROM.GetAdjective]їм урядом нам не світить."
 denmark_resistance_event.12.desc:0 "[FROM.GetAdjective]е розвідувальне агентство оцінило користь від спільного використання розвідданих і погодилося на нашу пропозицію."
 denmark_resistance_event.20.a:0 "Ми розмістимо війська"
 denmark_resistance_event.9.desc:0 "[From.GetLeader] найбезчеснішим чином відмовляється дотримуватися умов нашої угоди і запрошувати нас у свій альянс!"
 denmark_trade_deal.5.desc:0 "Наша торгова делегація повернулася з держави [FROM.DetName] з чудовими новинами! Лідер делегації сказав нам, що [FROM.GetLeader] цілком підтримує розширення угоди."
 destroyer_2_desc:0 "Збільшена дистанція ходу торпед, швидке заряджання та посилені знаряддя ППО забезпечують ефективність та універсальність есмінців."
