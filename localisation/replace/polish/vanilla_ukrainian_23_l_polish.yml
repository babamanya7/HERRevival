 lar_franco_soviet_treaty.1.desc:0 "[From.GetLeader] і уряд відправили в Москву особливого посланця для обговорення можливості альянсу. За [From.GetAdjective] пропозицією ми пообіцяємо брати участь у будь-якій оборонній війні, в яку виявиться втягнута держава., а [From.GetNameDef], у свою чергу, допоможе нам, якщо на нас нападуть."
