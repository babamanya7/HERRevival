 URG_investigate_german_and_italian_cultural_organization_desc:0 "Культурні та спортивні організації, пов'язані з Італією та Німеччиною, підозрюються у приховуванні фашистських симпатиків. Нам потрібно стежити за ними та розслідувати будь-які види неправомірної поведінки."
 USA_EQUIPMENT_VERSION_11_PLANE:0 "11"
 USA_REBEL_communism_DEF:0 "Соціалістичні Штати Америки"
 USA_REBEL_fascism_DEF:0 "Американська імперія"
 USA_accumulated_wealth_tax_act_desc:0 "Деякі громадяни нашої країни накопичили колосальні суми грошей. Ці кошти лежать без справи на банківських рахунках, або їх вкладають у непрактично величезні будівлі, позолочені меблі та дорогі картини. Ці витрати не несуть жодної користі для держави. Новий податок змусить тих, хто накопичив занадто багато непотрібних грошей, вкласти їх назад в економіку країни."
 USA_ally_with_the_silver_shirts:0 "Союз із срібносорочниками"
 USA_anti_air_equipment_3:0 "90 mm Gun M2"
 USA_battleship_2_desc:0 "The North Carolina Class was a challenging design and was the first battleship class built by the US Navy in 20 years. The US Navy required this class to meet the standards of Washington Naval Treaty, limited to 36,000 tons yet be armed with the 16\"/45 caliber guns and have improved armor while being capable of escorting the US Navy's fast aircraft carriers."
 USA_battleship_3:0 "Клас «Iowa»"
 USA_cancel_pearl_harbor_gambit_desc:0 "Розміщення флоту в Перл-Гарборі ставить під загрозу життя наших моряків. Ми не ризикуватимемо ними, щоби спровокувати війну з Японією."
 USA_destroyer_1:0 "Клас «Clemson»"
 USA_fascism_subject_DEF:0 "$OVERLORDADJ$ий протекторат Америка"
 USA_has_completed_reinforcement_flag:0 "§Y[USA.GetNameWithFlag]§! значно зміцнили доктрину Монро і зірвали наші плани."
