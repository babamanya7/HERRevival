 DEN_conspire_with_the_officer_corps_desc:0 "Маючи об'єднану праву коаліцію з набагато ширшим політичним мандатом і більш узгодженим порядком денним, ми можемо звернутися до офіцерського корпусу, щоби переконати принаймні деяких з них підтримати нас."
