 RAJ_ordnance_factory_medak_desc:0 "Спеціалізуючись на виробництві бронетанкових машин, Збройовий завод Медак є критично важливим для модернізації наших військових. Розширення його операцій забезпечує, що наші сили оснащені передовими машинами, необхідними для домінування на полі бою."
