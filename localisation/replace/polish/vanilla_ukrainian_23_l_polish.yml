 SOV_siberian_crackdown_timer:0 "Репресії в Сибіру"
 SOV_siberian_crackdown_timer_tt:0 "Одна область у Сибіру буде орієнтована на центристів."
 SOV_sinkiang_joined_comintern_counter_flag:0 "Вступили до Комінтерну"
 SOV_sinkiang_military_aid_sik_desc:0 "Ми запропонуємо військову допомогу державі [SIK.GetNameDef] в обмін на збільшення експорту їхніх місцевих товарів, необхідних нашій країні."
 SOV_sinkiang_mineral_prospection_sik:0 "Запропонувати розвідку корисних копалин у [SIK.GetAdjective]ому півдні"
 SOV_socialist_science:0 "Соціалістична наука"
 SOV_socialist_science_desc:0 "Світ, як і розум, перебуває в постійному русі. Природа перебуває у стані постійного прогресу, навіть революції. Принципи діалектичного матеріалізму можна застосувати як до природничих наук, так і до соціальних..."
 SOV_soviet_civil_war_over:0 "Громадянська війна закінчилася"
 SOV_stalins_cult_of_personality_desc:0 "Після викриття шокуючої змови проти Союзу стало очевидно, що лише прозорливе керівництво товариша Сталіна запобігло сповзанню до громадянської війни або ще гіршого. Кожен радянський громадянин, і навіть кожен член світового робітничого класу, зобов'язаний товаришеві Сталіну вічною вдячністю за його невтомну роботу із захисту революції."
 SOV_strat_bomber_equipment_0_short:0 "ТБ-3"
 SOV_the_glory_of_the_red_army_alt_desc:0 "$SOV_the_glory_of_the_red_army_desc$"
 SOV_the_glory_of_the_red_army_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$\n$MODIFIER_SPECIAL_FORCES_CAP$: §G+10.0%§!\n$MODIFIER_LAND_DOCTRINE_COST_FACTOR$: §G-10.00%§!\n\n"
 SOV_the_left_opposition_tt:0 "Розпочне шлях до §Yгромадянської війни§! в державі [ROOT.GetNameDef]."
 SOV_the_socialist_bulwark_join_war_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! приєднається до громадянської війни §Y[SPC.GetFlag]іспанської РПМО§! проти кожної іншої іспанської фракції."
 SOV_the_stalin_constitution_mission_tt:0 "---\nКоли громадянська війна почнеться, центристи отримають модифікатори від фокусу §Y$SOV_the_stalin_constitution$§!."
 SOV_urals_crackdown_timer_tt:0 "Одна область в Уральському регіоні буде орієнтована на центристів."
 SOV_war_measures_scope_tt:0 "Кожен союзник–невелика держава в Азії:"
 SOV_woo_navy_officers_desc:0 "Placeholder: When you start the civil war, this officer might join you, but they won't bring troops"
 SOV_yakovlev_design_bureau_dissolved_days_tt:0 "Число днів від розпуску Бюро: [?SOV_yakovlev_design_bureau_dissolved_flag:days|Y0]"
 SPA_bolster_offensive_infrastructure_desc:0 "Найбільшим вузьким місцем у нашому наступальному плануванні є наша нездатність забезпечити достатні запаси наших передових підрозділів. З акцентом на поліпшення інфраструктури в цих секторах наші наступальні операції мають бути значно посилені."
 SPA_caudillo_of_spain_desc:0 "Досягнення Франсіско Франко сказали самі за себе, а його можливі суперники передчасно закінчилися. Підтримка серед хунти зростає, щоби призначити його нашим офіційним лідером, і все, що залишається, це зробити офіційну заяву."
 SPA_civil_war_event_tt:0 "§GВідкриває заблоковані шаблони дивізій.§!\n"
 SPA_democratic:0 "Іспанія"
 SPA_ensure_agricultural_self_sufficiency_desc:0 "Ми повинні звільнитися від імпорту продовольства з-за кордону — наше сільське господарство має бути розширене настільки, щоб воно могло прогодувати всю нашу націю."
 SPA_expand_influence_in_the_madrid_garrison_mission:0 "Оспорюється вплив на гарнізон у Мадриді"
 SPA_garrison_control_republicans_weak_tt:0 "§LПоточний контроль націоналістів над гарнізоном: §Oслабкий§!\nКількість дивізій на початку громадянської війни: §Y1§! націоналістична — §Y2§! республіканські§!\n"
 SPA_improve_living_standards:0 "Поліпшити рівень життя"
 SPA_martyrdom_for_primo_de_rivera_desc:0 "Хосе Антоніо Прімо де Рівера, засновник партії «Фаланга», перебував у в'язниці ще до початку громадянської війни. Хоча нам пропонували обмін полоненими, можливо, цей імовірний політичний суперник краще послужить нашій справі як страчений мученик... Ми забезпечимо «провал» переговорів щодо обміну полоненими."
 SPA_murcia_offensive:0 "Наступ у Мурсії"
 SPA_nationalist_garrison_control_decisions_tt:0 "\nВідкриває рішення на карті §YРозширити контроль над гарнізоном§!, що дозволяє §Gрозширити§! §Yвплив націоналістів§! у державах.\n\nТільки держави, в яких на момент початку громадянської війни діє §Gтотальний§! Yконтроль над гарнізоном§!, вступлять у конфлікт під §Yуправлінням націоналістів§!.\n"
 SPA_secure_the_northern_garrisons_tt:0 "Збільшує §Yконтроль над гарнізонами§! до §Gповного§! в областях §Y[171.GetName]§!, §Y[174.GetName]§!, §Y[788.GetName]§!, §Y[791.GetName]§!, §Y[176.GetName]§!, §Y[166.GetName]§! і §Y[172.GetName]§!.\n\nНаціоналісти розпочнуть громадянську війну з контролем над ними, допоки їхній §Yконтроль над гарнізонами§! в них принаймні §Oслабкий§!.\n"
 SPA_suppress_the_strikes:0 "Придушити страйки"
