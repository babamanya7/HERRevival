 DNZ_communism_party:0 "КПД"
 DOCTRINE_DETAILS_BUTTON_DISABLE:0 "§GКлацніть§!, щоби вимкнути показ додаткових деталей доктрини."
 DOD_hungary.10.b:0 "Ми згодні на компромісний варіант."
 DOD_hungary.106.desc:0 "Незважаючи на письмові гарантії, які дає [From.GetLeader], німецька влада забула про свою обіцянку. На нещодавніх переговорах про долю держави [CZE.GetNameDef] ми не брали участь у дискусії — нас використали лише для того, щоб чинити тиск на інших."
 DOD_hungary.111.desc:0 "[HUN.GetNameDef] та [SOV.GetNameDef] виступили із спільною заявою про незаконну анексію Трансільванії та Бессарабії нашою країною. Вони розглядають ці території як незаконно окуповані і дають нам одну, останню можливість покинути ці райони."
 DOD_hungary.112.t:0 "[SOV.GetLeader] відкидає нашу пропозицію"
 DOD_hungary.147.desc:0 "В особистому посланні [From.GetLeader] наполегливо попросив нас переглянути нашу позицію щодо переозброєння Угорщини. Зокрема, він зазначив, що навіть якщо угорці отримають право на переозброєння, у них підуть роки, перш ніж вони накопичать армію, здатну загрожувати будь-якій країні цього регіону. \n\nПродовжуючи наполягати на своєму, ми опинимося в дипломатичній ізоляції. Ми мусимо вирішити, чи варто вона нашій додатковій безпеці."
 DOD_hungary.20.c:0 "Їхня війна — наша війна."
 DOD_hungary.25.desc:0 "Незважаючи на особисте прохання угорського короля, парламент відмовився допомагати Швеції у будь-який спосіб. Опозиція пригрозила, що [HUN.GetLeader] отримає вотум недовіри, якщо вдасться до будь-якої дії, що порушує нейтралітет Угорщини."
 DOD_hungary.30.a:0 "Це розумне прохання."
 DOD_hungary.4.a:0 "Чудово!"
 DOD_hungary.4.t:0 "Перемога на референдумі"
 DOD_hungary.51.desc:0 "Злякавшись зіткнення з нашою могутньою армією, боягузливі [ROM.GetAdjective]і політики вирішили повернути наші історичні землі. Трансільванія повністю перейшла під наше управління, а наші війська утримують ситуацію під контролем."
 DOD_hungary.52.b:0 "Цього разу вони зайшли надто далеко."
 DOD_hungary.68.b:0 "Віддати північну Трансільванію Угорщини."
 DOD_romania.115.desc:0 "[CZE.GetAdjective] керівництво проігнорувало наш ультиматум і оголосило загальну мобілізацію. [CZE.GetLeader] обіцяє, що кожен, хто наважиться вторгнутися в країну, дізнається, що її громадяни готові боротися до останнього."
 DOD_romania.20.t:0 "Румунія вимагає гарантій"
 DOD_romania.22.a:0 "Сурова відповідь."
 DOD_romania.42.a:0 "Це не варто кровопролиття."
 DOD_romania.60.t:0 "Румунія вимагає провести радикальну реорганізацію"
 DOD_romania.61.a:0 "Чудово."
 DOD_romania.62.t:0 "[From.GetNameDefCap] пручається"
 DOD_romania.63.b:0 "Навіщо нам їхня допомога?"
 DOD_romania.81.b:0 "Король взяв кошти з казни в рахунок своєї грошової допомоги."
 DOD_yugoslavia.32.a:0 "Дійти на нього."
 DOD_yugoslavia.45.desc:0 "Сьогодні міністерство закордонних справ відвідав британський посол і зажадав пояснити, чому ми продовжуємо торгувати з Німеччиною. Він заявив, що британська влада розглядає це як ворожі дії і готова вжити «відповідних заходів», якщо ми не припинимо торгівлю."
