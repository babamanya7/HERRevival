 SPR_soviet_technological_advancements_desc:0 "[SOV.GetNameDefCap] володіє технологіями, якої ми не маємо. З метою перемоги над фашизмом вони напевно хотіли б поділитися цими досягненнями з нами?"
 SPR_strat_bomber_equipment_1_short:0 "CASA 10.100"
