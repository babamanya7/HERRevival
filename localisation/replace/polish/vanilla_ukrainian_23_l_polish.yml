 iceland_events.13.desc:0 "[FROM.GetLeader] повністю розуміє і підтримує наш справедливий запит про компенсацію. [FROM.GetName] передасть державі [ROOT.GetName] як регіон [101.GetName], так і регіон [337.GetName]. Вони згодні, що нам простіше захищати ці острови і що посилення держави [ROOT.GetName] буде на руку всім."
