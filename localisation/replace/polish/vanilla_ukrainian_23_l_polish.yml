 CZE_soviet_alliance_desc:0 "Нинішній договір про союз з [SOV.GetNameDef] є занадто неоднозначним, щоб бути впевненими у їхньому втручанні у разі нападу на нас. Тому ми повинні звернутися до них щодо нової угоди, якщо ми хочемо гарантувати свою безпеку."
