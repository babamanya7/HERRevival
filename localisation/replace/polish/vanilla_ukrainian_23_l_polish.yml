 CZE_a_divided_nation_category_desc:0 "У різних рухах всередині країни зростає невдоволення урядом, яке більше не можна ігнорувати чи відкидати. Вирішення цих проблем послабить сили, що намагаються розірвати країну на частини. Принаймні в найближчому майбутньому."
 CZE_anti_tank_development_tech_tt:0 "Відкриває: §Y«Протитанкові вдосконалення»§!\nБронепробивність §Yартилерії§!: §G+5%§!\nБронепробивність §Yартилерії підтримки§!: §G+5%§!\nБронепробивність §Yпротитанкової зброї§!: §G+5%§!\nБронепробивність §Yпротитанкової підтримки§!: §G+5%§!"
 CZE_arms_exports_1_desc:0 "Škoda вже давно є одним з найбільших постачальників зброї для багатьох країн Європи завдяки своїм виробничим потужностям, що багаторазово перевершують наші власні потреби. Подібні обсяги виробництва дозволяють досягти ефективності, про яку багатьом компаніям залишається тільки мріяти."
