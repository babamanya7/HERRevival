 UNITS_HAS_INVALID_PATH_WARNING:0 "§RНе вдається знайти доступний шлях до цілі.§!"
 UNITS_VIEW_BTN_DRAW_FALLBACK:0 "§HЛінія відступу§!\n - §GКлацніть ПКМ та переміщуйте мишу§! по дружній території, щоби намалювати §Yодноразовий§! наказ про оборону.\n\nЛінії відступу корисні для розміщення дивізій в обороні, наприклад, по той бік річки або деінде в дружній території."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR:0 "§HМорське вторгнення (з підтримкою плавучої гавані)§!\nКрок 1) §GКлацніть§! по одній із підсвічених провінцій, щоб указати джерело вторгнення.\nКрок 2) §GКлацніть ПКМ§! по прибережних провінціях, у які Ви хочете вторгнутися.\nКоли план буде активований, розпочнеться підготовка до вторгнення й виділення конвоїв і плавучої гавані із Ваших державних запасів."
 UNIT_ASSIGN_TO_ORDER_HINT_ARMY_GROUP:0 "§GCtrl + клацніть§!, щоби прикріпити обрані армії до цього наказу."
