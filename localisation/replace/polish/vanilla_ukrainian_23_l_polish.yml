 DEN_effects_may_vary_science_pact_tt:0 "§Y$DEN_science_pact$§! вплине по-різному залежно від того, з якою державою [DEN.GetNameDef] укладає §YПакт про ненапад§! крізь рішення §Y$DEN_seek_guarantor$§!.\n\n"
