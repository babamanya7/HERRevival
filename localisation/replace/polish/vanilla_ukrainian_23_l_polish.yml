 SOV_military_reorganization_ns_tt:0 "\n$SOV_modify_the_red_army_ns_intro$\n$modifier_unit_infantry_design_cost_factor$: §G-10.00%§!\n$modifier_unit_artillery_brigade_design_cost_factor$: §G-10.00%§!\n\n"
 SOV_modern_tank_destroyer_equipment_1_short:0 "СУ-122-54"
 SOV_national_academy_of_sciences_dec_cat_desc:0 "$SOV_national_academies_of_sciences_desc$"
 SOV_pan_slavic_rhetoric_desc:0 "Товариш Ленін зайшов занадто далеко у своїй відмові від російської, слов'янської ідентичності у своєму прагненні до світової революції. Певний ступінь націоналізму може послужити нам на користь, а відродження своєрідного панславізму може допомогти зблизити нас з іншими слов'янськими народами."
 SOV_plan_start_of_uprising_ufa:0 "Створити секретний штаб у області [FROM.GetName]"
 SOV_policy_of_collective_security_desc:0 "Хоча вони є капіталістичними і часто реакційними, демократичні уряди Європи знають, що фашисти вважають їх слабкими і дегенеративними. Якщо прийде війна, вони впадуть першими, перш ніж вся лють фашизму буде спрямована проти вітчизни революції. Достатньо далекоглядні для усвідомлення цього політики мусять знати, що в Москві вони знайдуть тих, хто до них прислухається."
 SOV_promote_ideology_rallies_balkan_desc:0 "$SOV_promote_ideology_rallies_baltic_desc$"
 SOV_propaganda_happy_life:0 "Ти будеш жити щасливо!"
 SOV_reinstate_yakovlev_design_bureau:0 "Відновити конструкторське бюро Яковлєва"
 SOV_restore_cossack_units_desc:0 "У тяжкий час вітчизна не питає подробиць про те, хто хоче служити, щоб її захищати. Будь-хто, хто готовий зі зброєю в руках виступити проти загарбника, вітається і буде задіяний в міру своїх можливостей."
 SOV_rightful_heir_to_the_empire_desc:0 "$SOV_the_rightful_heir_to_the_empire_desc$"
 SOV_rocket_artillery_equipment_1_short:0 "М-8-6"
 SOV_russian_corporate_state:0 "Російська корпоративна держава"
 SOV_scorched_earth_moscow:0 "Випалити землю на підходах до Москви"
 SOV_secure_finland_desc:0 "Велике князівство Фінляндське охороняло наші північні кордони понад століття, доки не відокремилося під час громадянської війни. Настав день возз'єднання Фінляндії з вітчизною."
 SOV_secure_leningrad_opposition_tt:0 "Партизанські загони піднімуться в Ленінграді, коли почнеться громадянська війна."
