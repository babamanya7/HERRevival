 BUL_bs_loyalty_status_amount:0 "[?BUL.BUL_bs_loyalty|0]"
 BUL_bury_the_grudges_of_the_past_explanatory_tt:0 "Будь-яка незалежна §Yкомуністична§! нація на Балканах отримає подію §YБолгарія запрошує нас до Балканської федерації соціалістичних республік§!.\n§RБолгарія відмовиться від будь-яких територіальних претензій у цих країнах.§!"
