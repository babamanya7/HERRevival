 GRE_red_militias:0 "Червоні ополчення"
 GRE_republican_monarchist_alliance_tt:0 "Венізелістському уряду будуть доступні генерали і міністри монархістів. \n £faction_gre_monarchist §YМонархісти§! стали §Gдружніми§!. \n £faction_gre_communist §YКомуністи§! стануть §Rворожими§!."
