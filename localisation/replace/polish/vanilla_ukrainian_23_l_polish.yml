 SPR_secure_the_guardia_civil_tt_2:0 "Із початком громадянської війни Ви отримаєте 10 погано тренованих частин із §Y3 піхотними§! батальйонами. Націоналісти отримають 5 тренованих частин із §Y6 піхотними§! батальйонами.\n"
