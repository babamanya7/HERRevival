 CONFIRM_DISBAND_FLEET_TITLE:0 "Розформувати флот"
 CONGO_congo_free_state:0 "Вільна держава Конго"
 CONGO_develop_infrastructure:0 "Розвивати інфраструктуру"
 CONGO_expanded_rubber_plantations_available_tt:0 "Наш ворог захопив весь §YФранцузький Індокитай§!"
 CONGO_heat_resistant_cobalt_desc:0 "Ми давно видобуваємо кобальт у Конго, однак цей матеріал особливо високої якості, має термостійкі властивості, які є важливими для розробки нових реактивних двигунів."
 CONGO_shinkolobwe_mine_desc:0 "Шахта Шинколобве є одним з дуже, дуже небагатьох відомих джерел високоякісного урану у світі. На жаль, нижчі рівні шахти були сильно затоплені, що призвело до її закриття. Для відновлення її роботи та поновлення виробництва знадобляться значні інвестиції та зусилля."
