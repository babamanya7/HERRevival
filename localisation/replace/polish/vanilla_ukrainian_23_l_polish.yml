 INTERNATIONL_MARKET_DELETE_TARGET_TITLE:0 "Зняти оснащення"
 IRQ_armored_car_equipment_2_short:0 "AEC"
 IRQ_assassination_of_sidqi_desc_leader:0 "Бакра Сідкі не зміг об'єднати націю після повалення попереднього уряду. У політичній еліті зростає невдоволення, а широка іракська спільнота не довіряє курду, який має такий великий вплив на національні справи. Якби випала нагода, майже неминуче, хтось спробував би обірвати його життя..."
 IRQ_carve_up_syria:0 "Поділити Сирію"
 IRQ_demand_greater_stake_in_the_company:0 "Вимагати більшої частки в Компанії"
 IRQ_develop_the_kuwaiti_port_tt:0 "Додає §G1§Y Військово-морську базу §!§!у кожній провінції."
 IRQ_further_ussr_support_desc:0 "На початку нашого шляху до свободи ми покладалися на [SOV.GetAdjective] допомогу для успіху. Залежність від інших — це не те, до чого ми спочатку прагнули, однак, якщо їх можна переконати вважати нас рівними та товаришами, ці стосунки все ще можуть виявитися плідними."
 IRQ_invite_foreign_advisors_desc:0 "Нам бракує досвіду, щоб іти віч-на-віч із будь-якою військово-морською державою в регіоні. Однак ми могли б підвищити кваліфікацію наших сил, залучивши іноземних експертів для навчання наших військово-морських офіцерів."
 IRQ_kurdistan_tag_communism:0 "Соціалістична республіка Курдистан"
 IRQ_mechanized_equipment_3:0 "Churchill Kangaroo"
 IRQ_multi_role_aircraft_organization:0 "Шайбахський відділ військово-повітряних сил"
 IRQ_political_events.12.desc:0 "Уряд [FROM.GetNameDef] вимагає, щоб ми поступилися нашою західною територією, де є значна арабська меншина. Вони стверджують, що це для захисту арабів у цьому районі. Однак у тих самих районах також знаходиться значна нафтова інфраструктура, яка, ймовірно, принесе користь їхній економіці. Якщо ми відмовимося від цього ультиматуму, схоже, вони спробують захопити землю силою."
 IRQ_political_events.44.t:0 "[FROM.GetNameDefCap] вимагає нашої анексії"
 IRQ_political_events.76.t:0 "Делегація відхилена"
 IRQ_proclaim_united_arab_republic:0 "Проголосити Об'єднану Арабську Республіку"
 IRQ_sp_rockets_ballistic_missile:0 "Проєкт «Al Fat'h»"
 IRQ_special_projects_desc:0 "Чутки про атомні секрети з-за кордону дійшли до наших вчених та інженерів, які прагнуть продемонструвати свої здібності. Завдяки їхньому досвіду та достатньому фінансуванню ми можемо розробити зброю неймовірної сили."
 IRQ_status_of_lebanon_desc:0 "Зі встановленням контролю над Сирією, увага перейшла на майбутнє Лівану. Можливо, ми можемо спробувати нашу удачу ще раз і вимагати передачі його також під наш контроль."
 IRQ_united_arab_republic_communism_ADJ:0 "Арабськ"
 ISR_STATE_86:0 "Пойзн"
 ISR_sp_rockets_ground_to_air_missile:0 "Проєкт «Iron Dome»"
 IS_ATPEACE:0 "У стані миру"
 ITA_VICTORY_POINTS_6788:0 "Дженова"
 ITA_abolish_the_colonies_dec:0 "$ITA_abolish_the_colonies$"
 ITA_anglo_italian_pact:0 "Підписати Англо-італійський пакт"
