 siam.13.t:0 "[FROM.GetName] відкидає будь-які домовленості"
 siam.14.desc:0 "[FROM.GetNameDefCap] відкинула будь-які спроби переговорів. Їхній намір зрозумілий: повне завоювання та поглинання нашої нації. Ця війна буде вирішена не договорами, а тотальною перемогою або тотальним крахом."
 siam.2.t:0 "Третій замах на життя [SIA_plaek_phibunsongkhram.GetName]"
 siam.34.a:0 "Ми приєднаємося до їхнього альянсу і збережемо наше правління."
 siam.38.b:0 "Ні. Ми закінчимо це силою."
 siam_dem.2.desc:0 "На закритій зустрічі міністрів і старших офіцерів військовий представник виступив із суворою критикою пропозиції «Жовтого досьє». Він стверджує, що його автори занадто вільно говорять про державний контроль, перерозподіл і соціальні зобов'язання, приділяючи надто мало уваги дисципліні, власності та тягарям, які лягли б на офіцерський корпус і сільську місцевість. На його думку, [ROOT.GetNameDef] не можна переробити за допомогою теорій, написаних на папері, поки світ стає небезпечнішим з кожним місяцем."
