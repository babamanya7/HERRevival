 PRC_supreme_infiltration_desc:0 "Завдяки нашому попередньому досвіду інфільтрації ми здобули знання, які тепер можемо використати для розширення таких операцій, залучаючи все більше і більше наших земляків на свій бік."
 PRC_the_battle_behind_the_front_lines:0 "Битва в тилу ворога"
 PRC_three_rules_of_discipline_desc:0 "Як сформулював Мао у 20-х роках у рамках своєї військової стратегії, якщо ми хочемо отримати більшу підтримку населення, вкрай важливо, щоб наші війська не використовували свою силу для крадіжки майна. І якщо ми хочемо повною мірою скористатися нашими обмеженими ресурсами, також важливо, щоб предмети, відібрані у ворога, передавалися вищому командуванню для розподілу."
