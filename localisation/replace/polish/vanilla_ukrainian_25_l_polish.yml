 DEN_konge_og_faedreland_desc:0 "Нехай непохитна відданість і честь короля Крістіана Х слугують маяком надії для народних мас у ці часи випробувань. Ми повинні об'єднатися як народ, щоб захистити нашу батьківщину!"
 DEN_reintegrate_iceland_desc:0 "Не так давно держава [ICE.GetNameDef] була частиною нашої нації — і так було протягом століть. Настав час переконати [ICE.GetAdjective]ий народ приєднатися до нашого королівства та знову стати єдиним народом."
