 JAP_tetsu_katayama:0 "Тецу Катаяма"
 JAP_the_harakiri_debate_desc:0 "Після ганебного акту непокори, який Хамада Кунімацу продемонстрував проти військових, Хісаїчі Тераучі зажадав відставки кабінету та інавгурації нового прем'єр-міністра, якщо у старого залишилася бодай крапля честі. Шляхом обережного маневрування Сенджюро Хаяші може бути призначений маріонеткою військових."
 JAP_the_indochinese_soviet:0 "Індокитайська Рада"
 JAP_the_jeweled_spear_has_struck_tt:0 "Відкриває рішення, щоб заявити права на §Yазійські§! регіони та отримати §Yмету війни§! проти їхніх власників. Ми можемо обирати ціллю одну країну за раз, після чого нам потрібно окупувати всі існуючі заявлені регіони, щоб заявити права на нові."
 JAP_the_minitry_of_pan_asian_development_desc:0 "Щоб краще підвищити рівень життя в різних азійських країнах, ми повинні створити центральне міністерство, яке наглядатиме за інвестиціями в розвиток і допомагатиме в організації промислових та економічних програм."
 JAP_the_modern_ashigaru_desc:0 "Селянська піхота, яку наймали японські полководці на додаток до самураїв у своїх арміях і яка стала поширеною в період Муромачі, була відома як ашігару і не мала особливої лояльності. Щоб доповнити наші власні професійні сили, ми повинні спробувати відновити подібну систему, в якій селяни зобов'язані захищати державу у випадку війни."
