 SIA_restore_order_desc:0 "Громадянська війна виграна, але сама лише перемога не зцілить королівство. Руїни необхідно відбудувати, стару гвардію умиротворити, а адміністрацію відновити, щоб [ROOT.GetName] могла вийти з безладу з безпечною Короною і повернутим у належне русло громадським життям."
 SIA_revision_of_unequal_treaties_desc:0 "Старі угоди, підписані через слабкість, все ще надають іноземним інтересам привілеї, які не повинна терпіти жодна сучасна держава. Ми повинні переглянути ці нерівноправні договори та відновити повну владу [ROOT.GetNameDef] над своєю торгівлею, судами та концесіями."
 SIA_standing_our_ground_desc:0 "Настає момент, коли відступ і переговори обіцяють лише подальше приниження. [ROOT.GetNameDefCap] має показати, що вона все ще має волю стояти, битися і виганяти тих, хто бере на себе сміливість диктувати нам долю під дулом пістолета."
 SIA_strat_bomber_equipment_2_short:0 "Ki-49"
 SIA_support_songsuradets_military_clique_tt:0 "Якщо почнеться §YГромадянська війна§!, Сонгсурадет підтримає нас, надавши §Y3§! додаткові дивізії.\n§RЯкщо ми посилимо Сонгсурадета, а потім спробуємо заарештувати його через $SIA_the_songsuradet_rebellion$, він може чинити опір.§!"
