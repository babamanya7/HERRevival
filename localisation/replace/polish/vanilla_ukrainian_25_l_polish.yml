 CZE_fortification_focus2:0 "$CZE_fortification_focus$"
 CZE_frantisek_havel:0 "Франтішек Гавел"
 CZE_free_tuka_desc:0 "Тюремний термін $CZE_vojtech_tuka$ закінчився, і замість того, щоб шукати привід для продовження покарання, ми могли б звільнити його вчасно і залучити до роботи в нашому уряді. Краще, щоб він працював на нас, а не проти нас."
 CZE_fund_vladimir_mandl_research_desc:0 "Юрист на ім'я $CZE_vladimir_mandl$ захоплений ідеєю ракетних технологій. Якщо ми співпрацюватимемо з ним і надамо ресурси, необхідні для перетворення його досліджень на практичні технології, ми зможемо отримати величезну вигоду від цього партнерства."
 CZE_german_leanings_desc:0 "Німеччина набирає потужність у Європі, прагнучи об'єднання всіх носіїв німецької мови на території єдиного Райху. Це тривожні новини для нас, оскільки німецькомовна меншина становить відчутну частку нашого населення. Поки ми не заручилися підтримкою потужностей із Німеччиною."
