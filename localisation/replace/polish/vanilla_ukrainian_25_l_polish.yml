 MUN_czech.7.d:0 "Нещодавно до нас надійшли новини про те, що [GER.getnamedef] бажає анексувати Судетську область і готова піти на війну з [CZE.GetAdjective]им військом задля досягнення цієї мети. Наразі ми маємо оборонну угоду з Чехословаччиною, що означає, що у разі її війни з [GER.getnamedef] ми будемо зобов'язані прийти їй на допомогу. Якщо ми хочемо уникнути такого розвитку подій, нам потрібно негайно розірвати наші оборонні угоди з Чехословаччиною."
