 BUL_ratniks:0 "Ратніки"
 BUL_reorganize_the_military_industry_desc:0 "Наша військова промисловість застаріла та неефективна, розрахована на випуск застарілої техніки. Ми мусимо провести програму модернізації, поки не пізно."
