 ARG_anti_american_propaganda_desc:0 "[USA.GetNameDefCap] — це бастіон демократії в Америці, і він, природно, виступає проти всього, чого ми прагнули. Якщо ми коли-небудь сподіваємося впоратися з ними, нам потрібно згуртувати наше населення за цією справою. Для цього ми можемо підживити антиамериканські настрої по всій країні. З цим бойовим духом ми зможемо виправдати напад на гіганта на півночі."
 ARG_argentina_for_all:0 "Аргентина для всіх"
 ARG_corruption_crackdown_modifier_desc:0 "Корупція, яка вразила уряд нашої країни, була абсолютно неприйнятною. Завдяки політиці Роберто Марії Ортіса ми нарешті змогли покласти край кричущим шахрайським діям, в яких брали участь наші політики."
 ARG_cut_ties_with_britain:0 "Розірвати зв'язки з Британією"
 ARG_defense_and_democracy:0 "El Manifiesto Concordancia"
 ARG_envoy_to_london:0 "Посланець до Лондона"
 ARG_hitler_2_desc:0 "Guerra Relámpago — також відома як «Блискавична війна» — це спосіб, яким ми можемо використати переважну силу механізованої вогневої потужності, щоб подолати наших ворогів. Наш Президент прагне швидко розширюватися, стверджуючи, що «надолужує згаяний час». З якихось причин ці плани поширюються і на старі землі [GER.GetNameDef]."
 ARG_increase_military_salaries:0 "Збільшити зарплати військовим"
 ARG_infamous_decade_3_idea_desc:0 "$ARG_infamous_decade_idea_desc$"
 ARG_invest_in_the_railways:0 "Інвестувати в залізниці"
 ARG_italian_argentine_tech_sharing_group_name:0 "Італійсько-аргентинська угода"
 ARG_juan_pistarini:0 "Хуан Пістаріні"
 ARG_modify_argentine_navy_ns_intro:0 "Ідею §Y$ARG_navy_modifier$§! буде змінено:"
 ARG_political_events.27.desc:0 "Згідно з [ARG.GetAdjective] послом у [ROOT.Capital.GetCapitalVictoryPointName], наш нинішній уряд має зректися влади та бути заміненим на [ARG.GetAdjective] маріонетку. Існує висока ймовірність, що наша відмова призведе до оголошення війни. Ми повинні обирати мудро."
 ARG_political_events.29.b:0 "Вони пошкодують, що відмовилися від нас!"
 ARG_political_events.31.desc:0 "За нашого попереднього уряду, [ARG.GetAdjective] чоловік [GER.GetAdjective] походження був заарештований на кораблі після того, як його відправили з таємною місією до [GER.GetNameDef]. Ми можемо домовитися про його звільнення та дозволити йому приєднатися до лав нашого новоствореного розвідувального агентства, або ми можемо залишити його у в'язниці та наполягати на своєму щодо нашого ставлення до шпигунів."
 ARG_political_events.40.a:0 "Наш плацдарм в Африці забезпечено!"
 ARG_political_events.5.t:0 "[ARG.GetName] вимагає передати їм Південноатлантичні острови"
 ARG_political_events.50.a:0 "Наступного разу буде краще..."
 ARG_political_events.82.a:0 "Гроші витрачені з користю."
 ARG_preparations_for_war:0 "Підготовка до війни"
 ARG_preparations_for_war_desc:0 "Хоча ми можемо бути готові до війни цієї миті, ситуація з постачанням на наших кордонах свідчить про інше. Покращуючи наші лінії постачання, ми забезпечимо швидку перемогу над нашими супротивниками."
 ARG_raf_cooperation_idea_desc:0 "Оскільки конфлікти по всьому світу продовжують вирувати, ми повинні зробити все можливе, щоб підтримати наших союзників усім, що ми можемо зібрати. Тісніша співпраця з [ENG.GetAdjectiveCap]ими королівськими ВПС безсумнівно підніме рівень підготовки наших пілотів до більш сучасних стандартів."
 ARG_reform_our_industry:0 "Реформувати нашу промисловість"
 ARG_south_american_unity_decisions:0 "Єдність Південної Америки"
 ARG_state_atheism_desc:0 "[ARG.GetNameDefCap] довгий час була католицькою країною, і релігія відігравала головну роль у повсякденному житті багатьох її громадян. Однак у нас є можливість запровадити державний атеїзм, оскільки релігії, як правило, не місце в соціалістичній революції. Ми повинні, однак, пам'ятати, що це може спричинити невдоволення серед мас, які довгий час жили з релігією як частиною свого життя."
