 MEX_cedillo_tension_3_desc:0 "Генерал Сатурніно Седільйо та вірні йому каудільйо діють незалежно від уряду. Можливо, вони тепер заодно з ворогами, внутрішніми або зовнішніми, лідера [Root.GetLeader] та мексиканського народу!"
 MEX_cristero_SPA_fascism_subject_DEF:0 "Нова Іспанія"
 MEX_focus_abolish_capital_punishment_desc:0 "Нещодавня нестабільність військових повстань, селянських повстань і Війни крістерос, а також кривава реакція уряду на ці та дрібніші «злочини» призвели до того, що Мексика охопила атмосферу страху. Люди більше не можуть вільно розмовляти через страх стати жертвами тиранії з боку держави. Ми повинні поступово скасувати смертну кару. Якщо послабити нашу хватку, люди більше не відчуватимуть потреби вирватися з неї."
 MEX_focus_church_schools_desc:0 "Революційні генерали намагалися промити мізки молоді в соціалістичних таборах перевиховання, які вони називали школами. Ми повинні знову поставити релігію в клас, щоби священики та черниці навчали наших дітей."
 MEX_focus_invite_brazil_desc:0 "Хоча історія Бразилії як колишньої португальської колонії не зовсім повторює історію Мексики, вони все одно культурно ближчі до нас самих, ніж до мстивих європейських імперіалістів чи жадібних бізнесменів-янкі. Ми повинні наблизити їх до нашої сфери, щоб отримати вигоду від взаємного захисту."
 MEX_focus_strike_breaking:0 "Штрайкбрехерство"
