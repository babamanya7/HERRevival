 BUL_bs_strikes_no_infrastructure_damaged:0 ""
 BUL_bulgaria_on_the_three_seas_desc:0 "Як це було в стародавні часи під час Першої та Другої Болгарських імперій, узбережжя [ROOT.GetNameDef] знову омиваються Егейським, Адріатичним і Чорним морями. Наступним кроком є розвиток необхідної інфраструктури для створення потужних військово-морських сил, здатних забезпечувати панування Болгарії в трьох морях."
 BUL_bzns_tt:0 "[GetBznsName]: "
 BUL_collectivization_of_the_countryside_desc:0 "Криза розподілу сільськогосподарської продукції в минулому викликала великі занепокоєння в Болгарії, і вирішення цієї проблеми полягає в заміні індивідуальних господарств колективними господарствами, процес, який уже успішно здійснено в Радянському Союзі."
 BUL_consolidate_the_third_bulgarian_state:0 "Зміцнити Третю Болгарську державу"
 BUL_constitutional_monarchy_ADJ:0 "$BUL_neutrality_ADJ$"
 BUL_context_of_death_ger:0 "Невдовзі після повернення до міста [BUL.Capital.GetCapitalVictoryPointName] з несподівано суворої зустрічі, яку влаштував [GER.GetLeader] [GetBorisGermanMeetingLocation], цар Боріс III помер від очевидної серцевої недостатності."
 BUL_cooperation_fund_nsm_desc:0 "Для підтримки наших політичних союзників ми забезпечимо фракцію [GetNsmName] коштами на кампанію пропаганди, що збільшить її популярність."
 BUL_dar_desc:0 "Държавна аеропланна работилница — Державна авіаційна майстерня"
 BUL_defying_moscow_desc:0 "[GetDefyingMoscowFocusLoc]"
 BUL_destroy_imro_foreign_desc:0 "Ми мусимо провести військову операцію на всій території Македонії, щоб викорінити ВМРО раз і назавжди."
 BUL_dobri_bozhilov_bftb_desc:0 "Добрій Божілов Хаджіянакієв"
 BUL_fate_of_the_balkans_ultimatum_desc:0 "Ми організуємо зустріч з [FROM.GetAdjective]им урядом і змусимо їх вступити в альянс [ROOT.GetFactionName] в обмін на [ROOT.GetAdjective]ий захист. Декому це дуже не сподобається."
