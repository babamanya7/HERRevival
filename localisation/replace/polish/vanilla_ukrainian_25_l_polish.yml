 CHI_accelerate_the_tutelage_tt:0 "Розблоковує рішення для §Yприскорення політичної опіки§! над населенням у всій §Yкитайській сільській місцевості§!"
 CHI_autonomy_reichsprotectorate_DEF:0 "Китайський протекторат"
 CHI_blue_shirt_society_desc:0 "Товариство впровадження трьох народних принципів, або «Сині сорочки», освітлює наш особливий шлях і вражає тих, хто стоїть на ньому."
 CHI_chinese_general_staff:0 "Китайський генеральний штаб"
 CHI_chinese_industrial_support_idea_desc:0 "Ми отримуємо промислову підтримку від [CHI.GetNameDef], щоб зміцнити нашу промисловість, але натомість поступаємося своїм суверенітетом."
 CHI_civilian_unifier_upgraded_2:0 "$CHI_civilian_unifier$"
 CHI_close_the_hump:0 "Закрити «Горб»"
 CHI_constitutional_reform_desc:0 "Значна частина наших нинішніх проблем є результатом відсутності конституції, що відображає реалії сучасного Китаю. Це потрібно виправити."
 CHI_counter_infiltration_sea_cat:0 "$PRC_infiltration_sea_cat$"
 CHI_deny_the_enemy_desc:0 "Хоча наша перевага на суші незаперечна, можливо, найкраще, на що ми можемо сподіватися, відновлюючи наш слабкий флот, — це перешкоджання ворожим операціям."
 CHI_empower_the_mtac_tt:0 "Розблоковує рішення для націоналізації [MON.GetFlag] §Y[MON.GetAdjective]их§! та [TIB.GetFlag] §Y[TIB.GetAdjective]их§! регіонів."
 CHI_expropriate_industrialists_desc:0 "Посіпаки Чана отримали велику вигоду від слідування за такою корумпованою людиною і накопичили величезні багатства. Особиста вигода не може стояти вище партії, і те, що сталося, потрібно виправити. Ми повернемо те, що по праву належить державі."
 CHI_foreign_acquisition_desc:0 "Хоча ми прагнемо, щоб це було тимчасовим заходом, ми повинні визнати, що інші держави значно випередили нас у розвитку військово-морських технологій. Модернізація нашого флоту має початися зі звернення до технологічно передового покровителя."
 CHI_highlight_burma_road_decision:0 "Бірманська дорога"
 CHI_hyper_inflation_1:0 "Незначна інфляція"
 CHI_hyper_inflation_3_desc:0 "Гроші, випущені державою, коштують усе менше й менше, купівельна спроможність падає, а деякі товари доступні лише людям із відповідними зв'язками."
 CHI_integrating_states_democratic:0 "Зусилля з реінтеграції в [FROM.GetName]"
 CHI_internal_party_support_communism:0 "Внутрішня підтримка партії"
 CHI_is_not_china_leader:0 "@CHI§HНаціоналістичний Китай§! — більше не лідер Китаю"
 CHI_judiciary_reforms_desc:0 "Щоб досягти бажаних змін, ми маємо бути впевнені, що наші судді утворені в юридичних питаннях та правильно застосовують закони нашої країни."
 CHI_land_value_tax:0 "Податок на вартість землі"
 CHI_medium_tank_artillery_equipment_3_short:0 "PLZ 43"
 CHI_medium_tank_destroyer_equipment_2:0 "PTZ 41 Z"
 CHI_mend_the_rift_with_hu_desc:0 "Старе суперництво між [ROOT.GetLeader] та Ху Ханьмінем послаблювало партію досить довго. Послідовники Ханьміня означають, що він має значну міру впливу, що пішло б на користь нації, якби ми змогли об'єднатися."
 CHI_mio_trait_camco_bombers:0 "Бомбардувальники CAMCO"
 CHI_mobile_bases_desc:0 "Як доводить решта світу, авіація представляє майбутнє війни. Однак наша здатність завдавати ударів на відстані обмежена нашою географією. Наслідуючи приклад великих держав, ми повинні зосередити наші зусилля на мобільних ударних платформах."
 CHI_modern_logistics_desc:0 "Без налагодженої логістики ми не зможемо забезпечувати діючу армію."
 CHI_naval_aviation_desc:0 "Майбутнє боїв на морі — за авіаносцями. Нам ніколи не стати по-справжньому морською державою, поки у нас не буде власного авіанесучого флоту."
 CHI_open_afamf_plants_desc:0 "In order to develop new aircraft, such as the Chu XP-0 envisioned by Maj. Gen. Chu Chia-Jen, we must open facilities capable of supporting and producing light fighters and dive bombers. The ideal location for this would be in Kunming, but any place is good as long as we can make something that can contest our enemies in the skies."
 CHI_political_power_struggle_desc_not_active:0 "Своєю пристрасністю китайська політика не поступається іншим битвам. Щоб заволодіти владою в країні, ми, так само як і інші претенденти, повинні заручитися підтримкою місцевих правителів і населенням у різних областях."
 CHI_proclaim_rival_government:0 "Проголосити суперницький уряд"
 CHI_punish_the_signatories:0 "Покарати підписантів"
 CHI_reach_out_to_expats_desc:0 "Наші люди розсіялися по всьому світу і побудували собі нове життя. Для когось це ознака слабкості, але для нас — це сила. Ми покличемо наших відчужених співвітчизників у цей скрутний час."
 CHI_reopen_the_hump:0 "Заново відкрити «Горб»"
 CHI_reorganise_the_train_desc:0 "Наша організація постачання ніколи не розвивалася до того масштабу чи складності, які нам потрібні. Ретельна реорганізація дала б нам можливість кинути більше військ у бій."
 CHI_repurpose_fort_artillery:0 "Перепрофілювати фортечну артилерію"
 CHI_request_tank_aid_from_russia_decision:0 "Запитати бронетанкову підтримку в Росії"
 CHI_scout_for_air_experts_desc:0 "Наші військово-повітряні сили перебувають у зародковому стані, і багато викликів долаються з великими труднощами. Ми сприятимемо зусиллям ВПС, скориставшись досвідом інших."
