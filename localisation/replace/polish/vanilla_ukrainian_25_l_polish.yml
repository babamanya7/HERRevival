 SOV_anti_capitalist_policies_desc:0 "Очевидно, що більшість, якщо не всі, капіталістичні країни цілком задоволені тим, що просто вказують фашистам на інший напрямок, коли ті планують свою експансію. Коли в буржуазії є вибір, вони завжди, в кінцевому рахунку, обирають пригноблення пролетаріату. Тому ми не можемо їм довіряти і мусимо бути готовими до боротьби з ними."
