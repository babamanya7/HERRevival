 GER_ukr_state_transfer_effect_tt:0 "Кожна виділена область перейде під контроль §Y[UKR.GetNameDef]§!"
 GER_volkskommissariats_cat_desc:0 "Ми повинні захистити Червону Революцію і пролетаріат, встановивши нову форму протекторату — народний комісаріат (Фолькскомісаріат). Завдяки співпраці та інвестиціям ми сприятимемо процвітанню і цих держав-сателітів, і нашої країни, і всього пролетаріату!."
 GER_waning_patience_within_the_kriegsmarine_cat_desc:0 "Щоб завоювати лояльність адмірала Еріха Редера та Крігсмаріне в цілому, ми пообіцяли їм поступки та інвестиції у великий флот. Якщо ми не виконаємо свої обіцянки, схоже, що вони візьмуть справу у свої руки..."
