 UNITS_VIEW_BTN_DRAW_BLITZ:0 "§HПрорив§!\n§GКлацніть і втримуйте праву кнопку§! по мапі, щоби намалювати §Yлінію прориву§!.\nЛінії можна малювати тільки на території, на якій Ви позначили §Hлінію фронту§! або §Hморське вторгнення§!.\n\nПорівняно з §Yлінією наступу§!, §Yпрорив§! агресивно намагатиметься взяти всі провінції, які були тут, коли наказ був уперше намальований без підлаштування до змін. Надавайте перевагу §Yпроривам§!, коли Вам треба зробити оточення, що перекриваються, й відрізати ворога або для більш контрольованих менших наступів на ворожу територію."
