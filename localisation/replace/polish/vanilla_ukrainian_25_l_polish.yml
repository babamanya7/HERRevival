 SOV_ban_excessive_hero_worship_desc:0 "З'явилася тенденція публікувати вигадливі та дико перебільшені розповіді про приватне життя товариша Сталіна та його дитинство. Якими б добрими не були наміри, ці розповіді є контрреволюційними і спрямовані на те, щоб встановити культ героїзму в свідомості радянських людей, і намагаються замінити активне вивчення теорій товариша Сталіна сліпим ідолопоклонством."
 SOV_behead_the_snake_desc:0 "Стало абсолютно зрозуміло, що Союз не буде в безпеці, доки не буде повністю усунена загроза троцькістського перевороту. Хоча було б добре віддати Троцького під суд, щоб викрити його антирадянську діяльність, ми не маємо такої розкоші. Наш єдиний варіант — вбити його, щоб позбавити змову проти уряду її лідера і головного підбурювача."
 SOV_beria_idea:0 "Миколу Єжова усунуто з уряду\n"
 SOV_build_national_academy_of_sciences_integrated_republic_KAZ:0 "Збудувати [KAZ.GetAdjective]у $SOV_build_national_academy_of_sciences_integrated_republic_default$"
 SOV_claim_on_bessarabia_desc:0 "У 1918 році румуни безсоромно скористалися нашими внутрішніми негараздами і анексували Бессарабію. Настав час нагадати їм, що вони утримують землю, яка законно належить нам, і якщо вони не бажають відновити правильні кордони, ми витіснимо їх звідти військовим шляхом."
 SOV_communism_party_russian:0 "ВКП(б)"
 SOV_communist_threat:0 "комуністичн"
 SOV_covert_military_buildup_idea_desc:0 "Зараз ми таємно допомагаємо радянській опозиції, відкриваючи таємні підприємства з виробництва зброї та боєприпасів."
 SOV_development_of_tankograd_factories_tt:0 "Додати §G1§! комірку для будівництва й §Y1 військовий завод§! у кожній області на Уралі або Далекому Сході, де є принаймні 3 військові заводи (максимум 10)."
 SOV_exiled_flag:0 "Перебуває в засланні (§Gперсонажі в засланні не можуть бути піддані чистці§!)"
 SOV_found_the_pcdi_desc_alt:0 "Наша оборонна промисловість стала дуже великою, і тепер потребує спеціального урядового органу для координації, якщо ми хочемо, щоб вона розвивалася далі. Ми заснуємо Міністерство оборонної промисловості."
