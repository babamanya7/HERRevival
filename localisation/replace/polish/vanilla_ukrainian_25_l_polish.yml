 SPA_light_cruiser_1:0 "Клас «Méndez Núñes»"
 SPA_mauricio_de_sivatte:0 "Маурісіо де Сіватте"
 SPA_portuguese_aid_desc:0 "Ми повинні приймати допомогу, звідки б вона не прийшла. Португалія, надаючи притулок багатьом нашим лідерам, які були змушені втекти після невдалого повстання 1932 року, може бути готова надати нам матеріальну допомогу, якщо ми попросимо, і це може навіть стати основою для ще тіснішої співпраці в майбутньому."
 SPA_restore_the_empire_desc:0 "Наша імперія чекає! Нам потрібно створити військову промисловість, щоби ми могли її захопити."
 SPA_retake_the_spanish_netherlands:0 "Повернути Іспанські Нідерланди"
 SPA_secure_the_northern_garrisons_mission_tt:0 "§YКонтроль§! націоналістів §Yнад гарнізоном§! зросте до §Rповного§! в областях §Y[171.GetName]§!, §Y[174.GetName]§!, §Y[788.GetName]§!, §Y[791.GetName]§!, §Y[176.GetName]§!, §Y[166.GetName]§! і §Y[172.GetName]§!.\n\nНаціоналісти почнуть громадянську війну в цих областях, допоки їхній §Yконтроль над гарнізоном§! принаймні §Yслабкий§!.\n"
 SPA_the_army_of_africa_desc:0 "Ключ до перемоги в майбутній боротьбі — це загартована Африканська армія. Ми мусимо забезпечити їхню відданість нашій справі, створити плани для блискавичної окупації Північної Африки, а далі підготуватися до переправлення цих випробуваних боями військ у метрополію, де вони зможуть схилити терези на нашу користь."
 SPA_the_army_of_africa_model:0 "Модель «Африканської армії»"
 SPA_the_crusade_against_democracy:0 "Священна війна проти демократії"
 SPA_unite_the_requetes_desc:0 "Занадто довго регіональні карлістські хунти могли діяти незалежно одна від одної. Ми повинні об'єднати їх та їхні ополчення; рекете, щоб краще організувати військові зусилля карлістів і усунути внутрішнє інакомислення."
