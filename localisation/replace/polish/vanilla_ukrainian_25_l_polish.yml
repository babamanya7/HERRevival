 TUR_refet_pasha:0 "Рефет-паша"
 TUR_refining_our_strategies_desc:0 "З часів нашої поразки у Великій війні ми багато чого дізналися про військову справу, і нам слід забути про шалені плани, досягти успіху в яких у нас немає жодної надії. Ми мусимо битися розумно і обережно, щоб, коли вляжеться пил битв, виявитися переможцями."
