 JAP_integrate_the_government_general_desc:0 "Автономія Генерал-губернаторства Чьосен була величезною помилкою. Вони дозволили рухам опору існувати занадто довго, руйнуючи нашу промисловість у цьому районі. Ми повинні прямо втрутитися і підпорядкувати корейські території безпосередньо центральному уряду."
