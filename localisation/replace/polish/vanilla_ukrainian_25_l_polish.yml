 HUN_hungarian_national_defense_association_desc:0 "Крайньо-права, здебільшого парамілітарна організація M.O.V.E., створена в 1919 році, значною мірою віддана своєму лідеру та засновнику Дюлі Гьомбьошу. Незважаючи на це, вони також глибоко поважають Міклоша Горті за його жорстку антикомуністичну позицію."
