 mtg_britain.10.a:0 "Що політики взагалі знають про кохання?"
 mtg_britain.113.t:0 "[From.GetName] з'єднує імперію"
 mtg_britain.50.t:0 "[From.GetName] погоджується на пропозицію"
 mtg_britain.58.a:0 "Ніхто не може стати на шляху прогресу."
 mtg_britain.68.b:0 "Ми нічого не можемо з цим поробити."
 mtg_britain.69.d:0 "Держава [From.GetNameDefCap] висунула ультиматум з вимогою негайно припинити поширення комунізму в державі [CAN.GetNameDef]."
 mtg_britain.75.a:0 "Нарешті."
 mtg_britain.78.t:0 "[PAK.GetName] визнає нашу незалежність"
 mtg_britain.82.t:0 "Імперська конференція [?global.year|0] року"
 mtg_britain.9.a:0 "Криза поширилася на найвищі ешелони влади."
 mtg_britain.96.a:0 "Можливо, ми мусимо змиритися з тим, що політика умиротворення не діє."
 mtg_germany.3.d:0 "[From.GetAdjective] уряд відкинув наші вимоги, незважаючи на загрозу військового втручання."
 mtg_netherlands.16.d:0 "Британці сприйняли прихильність до нашої пропозиції об'єднати всі «Нижні землі». Ми можемо розпочинати підготовку до реінтеграції в міру їх звільнення."
 mtg_netherlands.50.b:0 "Наші генерали повинні відхиляти його «поради», навіть якщо це заплямує репутацію принца."
 mtg_netherlands.54.a:0 "Він повинен чинити так, як вважає правильним."
 mtg_netherlands.74.t:0 "[HOL_kaiserreich_germany.GetLeader] пропонує укласти союз"
 mtg_netherlands.75.d:0 "Виразивши крайню неповагу до нас, [HOL.GetAdjective] королева Вільгельміна оголосила про своє рішення повернути Вільгельма II на трон Німеччини після завершення війни. Вона запропонувала всім німцям, які бажають боротися за свого старого кайзера, добиратися до, що знаходиться під [HOL.GetAdjective] впливом, — явно щоби послабити [GER.GetAdjective] позиції та зміцнити власні."
 mtg_news.10.b:0 "Тепер вони теж у нашій сфері впливу."
 mtg_news.11.desc:0 "[HOL.GetAdjective] уряд намагається підтримати торговий нейтралітет, але їхні зусилля не увінчалися успіхом, а нещодавні заходи дають зрозуміти, що вони будуть проводити політику, яка сприятиме державі [ENG.GetName]. Мабуть, в результаті [ENG.GetAdjective] вплив на державу [HOL.GetNameDef] буде збільшено."
 mtg_news.13.a:0 "Доля імперії висить на волосині."
 mtg_news.2.b:0 "Боротьба за душу Америки вирвалася назовні."
 mtg_news.20.c:0 "У цьому винні британці з їхніми маніпуляціями!"
 mtg_news.32.b:0 "Підтасовка! ПІДТА... кхм. Який чудовий результат демократичних та вільних виборів."
 mtg_news.32.c:0 "Ми одні бачимо, що у нас насаджують тиранію?!"
 mtg_news.33.b:0 "Це насторожує..."
 mtg_news.37.t:0 "[From.GetName] вимагає деколонізації"
 mtg_news.42.t:0 "Громадянська війна в державі [From.GetName] завершується"
 mtg_news.57.desc:0 "Після недавнього завоювання американського материка [From.GetLeader] випустив королівський указ, який відносить колишні Сполучені Штати Америки до домініону Канада і перейменовує їх у домініон Північна Америка."
 mtg_news.6.b:0 "Доведеться звільняти від більшовизму ще одне місце."
 mtg_usa_civil_war_fascists.1.b:0 "Не можна йти на поводу у натовпу."
 mtg_usa_civil_war_fascists.23.a:0 "Заради них взагалі не варто було проливати кров."
 mtg_usa_civil_war_fascists.23.desc:0 "З закінченням війни штати, що входили в Нейтральний блок, заявили про те, що припиняють дію законів і заходів, покликаних підтримувати їх нейтралітет. З цього дня війська, що билися, знову можуть вільно входити на їхню територію. на час війни, мирно розпущено."
 mtg_usa_foreign_support.1.a:0 "Допоможемо, чим зможемо."
 mtg_usa_foreign_support.14.a:0 "Літати на літаку не так вже й важко, правда?"
 mtg_usa_north_american_dominion.1.a:0 "У нас немає вибору."
 mtg_usa_protect_south_america.2.desc:0 "Президент [From.GetLeader] прийняв нашу пропозицію і доручив [From.GetAdjective] міністру закордонних справ домовитися про подробиці."
 mtg_usa_southern_threat.2.desc:0 "Усвідомивши безнадійність свого становища, уряд лідера [MEX.GetLeader] прийняв нашу пропозицію і погодився консультуватися з нами перед прийняттям будь-якого важливого політичного рішення."
 mtg_usa_strategic_interests.2.a:0 "Відмінно!"
 muslim_scholar:0 "Мусульманський учений"
 mutiny_1:0 "Бунти"
 mutiny_event.3.t:0 "\"What ARE we fighting for?\""
 mutiny_event.5.desc:0 "While the War Office is doing its best to keep the current mutiny in the army from becoming widely known, censoring letters can only go so far. Soldiers on leave quickly spread the word that the army is no longer willing to bleed needlessly in this war.\n\nAttempts by the government to stem the tide have completely failed. Reports from the Secret Police indicate that the mutineers have a strong backing in the general public, making it unlikely that we can isolate and surpress them."
 nation_building_desc:0 "Ми мусимо навчити нове покоління керівників, які відведуть [From.GetAdjective] народ від тоталітаризму до демократії та влади закону."
 native_american_usa_fascism_ADJ:0 "Тубільн"
 native_american_usa_fascism_DEF:0 "Реваншистські Сполучені Штати Тубільної Америки"
 nav_bomber_equipment_1_desc:0 "Морська авіація буде вкрай затребувана у зв'язку із змінами в характері війни на морі — зокрема, посиленням ролі підводних човнів. Потрібні гідролітаки, здатні виконувати роль розвідників і пікіруючих бомбардувальників."
