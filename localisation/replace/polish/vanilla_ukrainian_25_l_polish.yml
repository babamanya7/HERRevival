 NSB_poland_communist_events.502.desc:0 "[From.GetNameDefCap] приймає нашу декларацію незалежності. Схоже, що тепер між нашими народами запанував мир. Відтепер ми повністю незалежні, але можемо залишитися в союзі з державою [From.GetNameDef] або ж вийти з нього та шукати інші шляхи розвитку."
