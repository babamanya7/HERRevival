 JUNO_already_specialized_in_tanks:0 "Уже є спеціалізація на типі танків"
 JUNO_brazil_events.10.a:0 "Незручно маленький захід."
 JUNO_brazil_events.120.b:0 "Як альтернативу, ми запропонуємо їм економічну допомогу."
 JUNO_brazil_events.131.t:0 "[FROM.GetNameDefCap] приходить нам на допомогу"
 JUNO_brazil_events.14.a:0 "Бажаний поворот подій"
 JUNO_brazil_events.140.desc:0 "Як жест доброї волі, [FROM.GetAdjective] дипломатична делегація прибула з унікальним подарунком — ягуаром, емблемою культури та сили їхньої нації. Цей надзвичайний подарунок супроводжується пропозицією щодо посилення торгівлі та співпраці у зовнішній політиці. [FROM.GetAdjective] посланці висловлюють своє бажання зміцнити зв'язок між нашими націями.\n\nХоча ягуар захопив уяву громадськості та здобув доброзичливість, ширші наслідки цього жесту вимагають ретельного розгляду."
 JUNO_brazil_events.16.a:0 "Разом ми відновимо мир у нашій півкулі."
 JUNO_brazil_events.160.a:0 "Хто ми такі, щоб стояти на шляху вільного ринку?"
 JUNO_brazil_events.163.desc:0 "Суперечки між працею та роботодавцями майже розірвали націю в останні роки. Настав час нам нарешті прийняти законодавство, щоб покласти край цій справі. З одного боку Національного Конгресу, Партія праці виступає за про-робітниче законодавство, яке б легалізувало діяльність профспілок, встановлювало гарантовані права робітників та право на визначену кількість днів відпустки на рік. З іншого боку, Республіканська партія виступає за менш радикальні реформи і замість цього залишає це питання на вирішення штатам. Вони стверджують, що поточна ситуація з глобальною безпекою означає, що ми повинні надавати пріоритет витратам на національну оборону, а не піддаватися радикальним лівим."
 JUNO_brazil_events.17.desc:0 "[USA.GetName] вирішила відхилити угоду, яка б зобов'язала нас підтримувати їх військово в обмін на економічну допомогу. Можливо, час був просто недоречним для Президента, або це може свідчити про зміну зовнішньої політики щодо Бразилії. У будь-якому випадку, це удар по довірі до [BRA.GetLeader]."
 JUNO_brazil_events.17.t:0 "Угоди [FROM.Capital.GetCapitalVictoryPointName] відхилені"
 JUNO_brazil_events.170.a:0 "Настав час відкласти наші розбіжності."
 JUNO_brazil_events.34.b:0 "Ми змусимо їх пошкодувати про це рішення."
 JUNO_brazil_events.51.a:0 "Разом ми сильніші."
 JUNO_brazil_events.73.b:0 "Ми ніколи не відмовимося від нашої незалежності!"
 JUNO_brazil_events.87.tt:0 "У разі спалаху громадянської війни [SOV.GetFlag]§Y[SOV.GetNameDef]§! більш імовірно надішле нам добровольців та обладнання за ленд-лізом."
