 GREATER_LIT:0 "Велика Литва"
 GRE_1936_election_category_desc:0 "Перші вибори з моменту повернення Георга II на престол мають відбутися до кінця місяця. Георг II більше не має наміру поступатися своїм троном, і як кажуть, готовий піти на будь-які заходи, щоби зберегти владу.\n\nОкремі підрозділи нашої армії досі є в таємному союзі з вигнаним, але популярним серед народу Елефтеріосом Венізелосом. Можливо, вони зможуть забезпечити у Греції чесні вибори, діючи дуже... переконливими методами."
 GRE_CAS_equipment_3_short:0 "SB2C-5"
 GRE_bedrock_of_balkan_financial_stability_desc:0 "Хто міг би подумати, що з усіх балканських країн саме Греція першою повністю виправить свою фінансову ситуацію? Наш престиж у регіоні злетів до небес, і тепер ми просто зобов'язані скористатися своєю новою позицією банкірів Південної Європи, щоб ще більше збагатити нашу країну."
