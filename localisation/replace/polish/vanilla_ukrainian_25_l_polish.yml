 JAP_increase_armament_spending_desc:0 "Віконт Такахаші Корекійо, можливо, зробив багато для нашої економіки, але він залишив нас погано підготовленими до майбутніх воєн. Ми повинні виправити цей факт і реінвестувати в нашу зростаючу військову промисловість."
