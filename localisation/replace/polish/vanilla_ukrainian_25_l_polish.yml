 AST_within_reach:0 "У межах досяжності"
 AST_within_reach_desc:0 "Так близько, і водночас так далеко. Австралія — надзвичайно багата на ресурси країна, і якщо ми копнемо трохи глибше, під нашими ногами лежать незліченні багатства. З розширенням нашої інфраструктури навіть віддалені шахти стали доступними, і ми стоїмо на порозі ери австралійського процвітання, заснованого на багатстві корисних копалин."
