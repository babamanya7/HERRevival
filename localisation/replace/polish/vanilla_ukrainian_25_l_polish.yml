 GOE_RAJ_news.4.desc:0 "It has been reported that [FROM.GetLeader] of [FROM.GetNameDef] has declared the unification for all peoples on the Indian subcontinent, marking a new chapter in the history of Asia, and for all the world. Many analysts have already stated that Hindustan's unification can have drastic effects on world politics, and mean the rise of a new Superpower."
