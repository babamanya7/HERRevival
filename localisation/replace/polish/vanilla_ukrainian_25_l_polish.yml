 JAP_establish_guerilla_units_in_state_decision:0 "Створити партизанські загони в §Y[FROM.GetName]§!"
 JAP_establish_nippon_hassoden_desc:0 "Щоб посилити контроль нашого уряду над національним електропостачанням та мати можливість регулювати споживання, ми повинні заснувати Японську компанію з виробництва та передачі електроенергії (Nippon Hassoden), яка регулюватиме електроенергетичну галузь. Це буде легко досягнуто шляхом злиття існуючих електроенергетичних компаній."
 JAP_every_kodoha_member_tt:0 "Кожен §Yприхильник Кодоха§!:"
 JAP_form_cabinet_intelligence_bureau_desc:0 "Прем'єр-міністр [ROOT.GetLeader] особисто звернувся з проханням створити урядову організацію, зосереджену на покращенні прояпонської громадської думки та забезпеченні того, щоб кожен громадянин робив свій внесок у війну та оборону нашої великої нації. Нобуфумі Іто прийняв цю пропозицію і лише чекає на офіційні накази для створення бюро."
 JAP_form_greater_east_asian_customs_union:0 "Створити Великий східноазійський митний союз"
 JAP_form_pioneer_organizations_desc:0 "Партія повинна створити організації для молоді, в яких вона зможе брати участь у заходах, щоб стати справжніми комуністами, здатними допомагати державі, а одного дня — навіть захищати її."
