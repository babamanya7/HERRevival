 FIN_finnish_airforce_desc:0 "Попри свій малий розмір і обмежені ресурси, ВПС Фінляндії пишаються своїм складом із вишколених пілотів і винахідливих дизайнерів, які роками поліпшували своє ремесло шляхом експериментування й імпровізації. Завдяки цілковитій рішучості та готовності адаптовуватися до мінливих обставин, ВПС Фінляндії створили репутацію грізної сили; такої, яка захищатиме свою вітчизну з усією відвагою та наполегливістю її наземних військ."
 FIN_finnish_march_of_conquest:0 "Фінський завойовницький марш"
 FIN_finnish_radio_intelligence_desc:0 "У міру загострення війни фінська армія усвідомила важливість збору надійної розвідданої. Під керівництвом Рейно Галлами було зібрано групу талановитих радіооператорів для перехоплення та декодування комунікацій ворога. Завдяки своїм навичкам і знанням ці оператори нададуть цінну інформацію фінським збройним силам, допомагаючи переломити хід війни."
 FIN_generic_communist_revolutionary:0 "Отто Вілле Куусінен"
 FIN_integrate_karelia_puppet_desc:0 "Настав час створити Карелію як нову Республіку, яку ми можемо взяти під своє крило."
 FIN_karl_harald_wiik:0 "Карл Гаральд Війк"
 FIN_mineral_wealth_development:0 "Розробка корисних копалин"
 FIN_modernize_production_lines_cas_designs_tt:0 "$FIN_modify_finnish_airforce_ns_intro$\n$FIN_support_for_ground_forces_dynamic_modifier_tt$\n"
 FIN_mustapaidat_desc:0 "Триваюча мілітаризація суспільства гарантує, що наші люди будуть найсильнішими, якими вони тільки можуть бути. Включаючи воєнізовані сили, ми можемо просувати військові цінності в усіх верствах суспільства, від тих, хто занадто молодий, щоб ще приєднатися до армії, до тих, хто вже готовий можливо, занадто старий для цього."
 FIN_national_firepower:0 "Національна вогнева сила"
 FIN_neutrality_party:0 "Аграрна ліга"
