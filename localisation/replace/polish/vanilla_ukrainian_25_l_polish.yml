 SWE_reject_saltsjobaden_desc:0 "Ця угода має бути відхилена, вона позбавить роботодавців їхніх прав вести власний бізнес, як вони вважають за потрібне, і обмежить повноваження працівників відкликати свою працю, коли вони почуваються ображеними. Ніхто не виграє від цієї домовленості."
