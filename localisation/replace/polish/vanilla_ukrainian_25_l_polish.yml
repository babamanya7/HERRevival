 AST_battle_of_the_ocean_desc:0 "Океани довго служили артеріями світової торгівлі. Тепер настав час перенести боротьбу в Тихий океан і розірвати систему, яку він підтримує. Води стануть червоними від крові корумпованих капіталістів та героїв революції."
