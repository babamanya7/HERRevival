 AST_council_for_scientific_and_industrial_research_desc:0 "Рада з наукових і промислових досліджень була посилена після Імперської конференції 1923 року, щоб допомогти розширити економічну базу різних колоній і домініонів. Хоча її внесок був значним, настав час надати органу новий напрямок: розвиток виробництва та вторинної промисловості."
