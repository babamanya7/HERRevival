 newline_tt:0 "\n "
 news.103.t:0 "Падіння м. [195.GetCapitalVictoryPointName]"
 news.106.d:0 "Сьогодні на світанку німецькі танки прорвалися крізь поспішно зведені оборонні споруди на вулицях Москви. Червону площу зайняли частини моторизованої піхоти. Густий дим від безлічі пожеж затягнув місто, а в цей час німецькі війська увірвалися до Кремля. За розповідями очевидців, впоратися з військами НКВС, готовими стояти до смерті, вдалося лише за допомогою гранат та вогнеметів. Тепер радянська столиця в руках німців, але від неї залишилися лише руїни та дим.\n\nЗа непідтвердженими даними, мумія Леніна з Мавзолею була заздалегідь евакуйована на схід країни."
 news.113.b:0 "Ще одна перемога Італії!"
 news.121.t:0 "Падіння Нанкіну"
 news.151.t:0 "Райнланд залишається демілітаризованим"
 news.155.d:0 "Хоча багато хто сподівався, що в Європі надовго встановився мир, недавні події знову повернули Німеччину на шлях війни. Грубо порушуючи Версальський договір, німецькі війська провели мобілізацію та готові перейти у наступ. Влада заявляє, що більше не бажає бачити Райнланд демілітаризованим, посилаючись на необхідність захисту німецьких громадян, які там живуть."
 news.167.b:0 "Ми розчавимо їх обох"
 news.170.d_BUL:0 "Запевняючи, ніби вона прагне міцного миру на Балканах, Німеччина змусила грецький уряд віддати частину своїх земель Болгарії. І хоча держава [GRE.GetName] протестувала проти цього, німецький вплив на Балканах не залишила їй вибору. Єдиний спосіб уникнути прямої конфронтації з державою [GER.GetName] — це дозволити німцям диктувати власні умови."
 news.171.b:0 "Як вони посміли?!"
 news.171.e:0 "Це означатиме війну."
 news.183.d:0 "Відкинувши [France.GetAdjective]і дипломатичні пропозиції, [From.GetLeader] публічно оголошує про те, що [From.GetName] не вступить у військовий союз, якого прагне [France.GetName].\n\nЗвинувачуючи [France.GetAdjective]у владу в слабкості і продажності, [From.GetAdjective]і дипломати заявляють, що жоден [From.GetAdjective]ий громадянин не дасть «[France.GetAdjective]ій заразі» поширитися."
 news.197.b:0 "Державу [Soviet.GetName] потрібно зупинити!"
 news.197.c:0 "[Soviet.GetName] позиціонується для виходу в Середземномор'я."
 news.199.d:0 "\n\n[?SOV.former_controller_of_bessarabia.GetNameDefCap] був змушений пристати на ультиматум [From.GetNameDef]. Території Бессарабії були передані під контроль [From.GetAdjective], а [?SOV.former_controller_of_bessarabia.GetAdjective]а влада залишилася зі зменшеними кордонами.\n\nНевідомо, як [?SOV.former_controller_of_bessarabia.GetNameDef] зможе уникнути подальших втрат."
 news.20.b:0 "Вони підписали свій смертний вирок."
 news.208.t:0 "Японська армія приймає «Наншін-рон»"
 news.217.a:0 "Ми повинні разом протистояти [GER.GetNameDef]."
 news.226.b:0 "$news.225.b$"
 news.254.a:0 "Ми повинні стежити за ситуацією."
 news.284.b:0 "Британці ніколи з цим не змиряться."
 news.287.desc:0 "Німецькі війська окупували західну Польщу, офіційно з метою захисту німецьких меншин від хаосу, що настав після розпаду польського уряду.\n\nРадянські війська були виведені з цих територій в належному порядку, що призвело до фактичного поділу Польщі між двома державами."
 news.288.desc:0 "[CHI.GetLeader] і [PRC.GetLeader] опублікували спільну заяву, в якій заявили, що вони відклали в сторону свої розбіжності перед обличчям агресії Японії. Обидві сторони дотримуватимуться суворої політики ненападу одна проти одної доти, доки триватиме війна проти Японії, і пообіцяли зробити все можливе, щоб відкинути загарбника назад. Ряд дрібніших воєначальників також заявили про свою підтримку, передавши свої сили під командування [CHI.GetLeader].\n\nЧи будуть давні вороги громадянської війни в Китаї насправді працювати разом, ще належить з'ясувати, і багато експертів вважають, що це зробить трохи більше, ніж відстрочить неминучу поразку Китаю."
 news.313.c:0 "Німеччина більше не беззахисна."
 news.314.desc:0 "З Угорщини надійшли повідомлення про те, що Міклош Горті був застрелений одиноким стрільцем сьогодні після того, як вийшов з будівлі парламенту в Будапешті. Постраждалого негайно доставили до лікарні, але лікарі повідомили, що він вже помер, коли вони прибули на місце. Нападник, був застрелений поліцією, коли він намагався втекти з місця злочину, був ідентифікований як член комуністичної партії.\n\nВбивство викликало збурення у внутрішній [HUN.GetAdjective]ій політиці, оскільки антикомуністичні погляди Горті мали першорядне значення для утримання революційних елементів на відстані. Без старого адмірала на чолі політичної сцени, цілком ймовірно, що комуністичні впливи різко зростуть."
 news.32.t:0 "Пакт Молотова–Ріббентропа"
 news.320.c:0 "Ми попередили їх."
 news.320.desc:0 "Незважаючи на вимоги Румунії щодо «радикальної реструктуризації» їхньої держави та загрозу застосування військової сили в разі відмови, Югославія відкинула ультиматум. Незважаючи на те, що на країну чинився значний тиск із різних боків, югослави були сповнені рішучості захищати свою державу зубами і нігтями. Зараз Румунія оголосила війну, і не виключено, що інші країни можуть взяти участь у поділі країни."
 news.325.desc:0 "Посилаючись на те, що основою їхньої нації є «союз південнослов'янських народів», югославська риторика останнім часом все частіше стверджує, що болгарський народ є частиною цього союзу. Зараз ця пропаганда набула нового різкого повороту, оскільки Югославія відкрито заявила про свої претензії на болгарський регіон. Оскільки обидві країни готують свої війська, війна може спалахнути будь-якої миті."
 news.35.c:0 "Об'єднані проти спільної загрози!"
