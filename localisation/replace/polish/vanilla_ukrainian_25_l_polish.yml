 JAP_central_economic_council_idea:0 "Центральна економічна рада"
 JAP_conquer_the_army_remnants:0 "Підкорити залишки армії"
 JAP_crush_the_spirit_of_gekokujo_desc:0 "У ранній період Шьова відбувалися неодноразові акти гекокуджьо, коли нижчі за рангом військові намагалися усунути тих, хто займав вищі посади, що загрожує порушенням нашого ланцюга командування. Ми повинні придушити ці ідеї якомога швидше!"
