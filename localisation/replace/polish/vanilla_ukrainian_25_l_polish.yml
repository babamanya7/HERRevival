 NSB_soviet_paranoia_system_events.24_paranoia_accused_decrease_tt:0 "£SOV_paranoia_text_icon Політична параноя знижується, виходячи з рівня чистки командувача військової частини, що піддався: §G[?SOV.SOV_accused_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.33.desc:0 "З різних морських баз надходять доповіді про те, що трохи збільшилася кількість запитів на запчастини, необхідні для термінового ремонту наших кораблів. У доповідях йдеться, що необхідність ремонту обумовлена природним зносом, а також навчаннями, але НКВС [Root.GetLeader] особисто цікавиться справою і просить провести ретельне розслідування щодо саботажу."
 NSB_soviet_policies_of_collective_security.8.t:0 "[FROM.GetNameDefCap] відмовляється укласти пакт, у якому не бере участі [POL.GetNameDef]"
 NSB_soviet_soviet_german_trade_agreement.3.desc:0 "Після декількох спроб нашого посла переконати [FROM.GetAdjective]их представників у взаємновигоді торгового пакту між нашими державами, [FROM.GetAdjective]і дипломати повідомили, що не зацікавлені в підписанні торгової угоди з державою [ROOT.GetNameDef]."
