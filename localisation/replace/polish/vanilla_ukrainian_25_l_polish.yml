 FOR_communism_ADJ:0 "Тайваньськ"
 FRA_GER_fascism_autonomy_reichsprotectorate_DEF:0 "Вішістська Франція"
 FRA_SH_battleship_2_desc:0 "Лінкори типу «Napoléon Bonaparte» були гіпотетичним проєктом і базувалися на класах «Alsace» і «Gascogne». Його важке озброєння розподілено рівномірно в носовій і кормовій частинах у потрійних баштах, із надстрільними вторинними частинами та важким зенітним озброєнням. Товста броня та потужні двигуни забезпечують швидкість і захист, необхідні для того, щоби не відставати від інших кораблів флоту та ефективно боротися з противниками."
 FRA_SNCASE_formed:0 "Сформовано SNCASE"
 FRA_THIRD_EMPIRE_ADJ:0 "Французьк"
 FRA_align_belgium:0 "Схилити Бельгію"
 FRA_ban_the_leagues_desc:0 "Ультраправим лігам дозволили організуватися без контролю. Хоча зараз вони занадто слабкі, щоби спробувати переворот, невідомо, що вони могли б зробити в майбутньому. Краще розчинити їх зараз."
 FRA_cas_focus:0 "Акцент на штурмову авіацію"
 FRA_civil_unrest_category:0 "Громадянські заворушення"
 FRA_colonial_military_factories_desc:0 "Якщо розмістити військову промисловість за межами Франції, ми зможемо забезпечити безперебійне постачання військ зброєю та боєприпасами, навіть якщо ворог контролюватиме наш повітряний простір."
 FRA_defensive_strategems_desc:0 "Якщо ми хочемо, щоб французький народ воював за нас у майбутній війні, необхідно дати нації чіткі орієнтири. Вистачить гризні один з одним, ми мусимо боротися за Францію і свободу, рівність, братерство."
 FRA_destroy_decadence:0 "Знищити декадентство"
 FRA_economic_devolution_desc:0 "Абсурдно думати, що якийсь бюрократ у Парижі знає, що краще для компанії в Бордо. Ми мусимо довіряти своїм підприємцям і надати їм можливість створювати власні рішення."
 FRA_emile_muselier:0 "Еміль Мюзельє"
 FRA_encourage_immigration_desc:0 "Наша Батьківщина гостро потребує робочих рук, щоби надолужити втрати, завдані у Великій війні. Полегшивши поселення у Франції, ми можемо залучити кваліфікованих іммігрантів, які зможуть компенсувати цей недолік."
 FRA_extra_research_slot:0 "Підтримати великі школи"
 FRA_fighter_focus_desc:0 "Нові досягнення у цивільному літакобудуванні можуть бути використані для збільшення швидкості, дальності та висоти польоту наших винищувачів. Потрібно зосередитись на цьому, якщо ми не хочемо відстати від інших держав."
 FRA_french_union_tt:0 "Будуть проведені референдуми в різних частинах нашої колоніальної імперії. Деякі частини можуть замість цього стати повністю незалежними."
 FRA_fusiliers_marine_desc:0 "Минули часи берегів як непрохідних оборонних споруд. У майбутньому ми мусимо мати можливість вести боротьбу з ворогом, де б він не був, і захопити висадку проти будь-якої опозиції."
 FRA_heavy_fighter_equipment_3:0 "Breguet 700 C2"
 FRA_hotchkiss:0 "Hotchkiss"
 FRA_industrial_collectivization_desc:0 "Французька економіка сьогодні складається з крихітних компаній із невеликою кількістю працівників, які вічно конкурують один з одним і висмоктують ресурси в неефективному дрібному виробництві. Ми об'єднаємо ці невеликі компанії, щоби нарешті створити компанії, які зможуть конкурувати на світовій арені."
 FRA_infantry_equipment_1:0 "MAS-36"
 FRA_invite_romania_desc:0 "Позиції демократів у Румунії залишаються хиткими, на них чинять як фашистські партії, так і радянські комуністи. Якщо ми запросимо румунів до Малої Антанти, наша підтримка зміцнить їх стабільність."
 FRA_invite_yugoslavia:0 "Запросити Югославію"
 FRA_jet_fighter_equipment_1_short:0 "Ouragan"
 FRA_light_cruiser_1_desc:0 "Легкі крейсери Duguay-Trouin були першими великими французькими військовими кораблями, побудованими після Першої світової війни за військово-морською програмою 1922 року. Вони стали першими легкими крейсерами з закритими головними баштами зі суперстрільбою. Серед легких крейсерів вони мали сильне торпедне озброєння, але практично не мали броні."
 FRA_light_medium_armor:0 "Automitrailleuses"
 FRA_light_tank_equipment_1_short:0 "H35"
 FRA_national_bureau_of_statistics:0 "$VIC_the_national_bureau_of_statistics$"
 FRA_nav_bomber_equipment_3_short:0 "D.750"
 FRA_naval_rearmament:0 "Переозброєння флоту"
 FRA_neo_jacobin:0 "Неоякобинець"
 FRA_the_old_school_desc:0 "Незважаючи на всі досягнення військово-морських технологій, ключовим елементом морської сили все ще є капітальний корабель, який діє за підтримки інших підрозділів флоту. Незалежно від того, чи це капітальний корабель все ще є лінкором, чи є новим авіаносцем, ми мусимо ще більше збільшувати розміри нашої суднобудівної промисловості, щоби гарантувати, що ми зможемо йти в ногу з іншими військово-морськими державами."
