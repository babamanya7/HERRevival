 PRC_holding_half_the_sky_desc:0 "Становище жінок у китайському суспільстві довгий час було нерівним. Оскільки ми прагнемо рівності, ми повинні змінити й це. Як сказав Мао: «Жінки тримають половину неба», і ми повинні дозволити їм зробити свій внесок у революцію."
 PRC_infantry_equipment_1_short:0 "Type 24"
 PRC_maoism_desc:0 "Наш великий голова багато місяців працював над перетворенням своїх політичних теорій на єдину ідеологію, яка вкаже шлях нашій країні."
