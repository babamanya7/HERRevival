 lar_portugal_purchase_ships.1.b:0 "Нам це не цікаво."
 lar_portugal_spanish_civil_war.3_tt:0 "§R[POR.GetNameDefCap] зможе приєднатися до держави [SPB.GetFlag][SPB.GetNameDef] у громадянській війні в Іспанії та воювати проти нас!§!"
 lar_spain.13.desc:0 "Після останньої поразки націоналістів генерал Франко оголосив про капітуляцію всіх своїх військ. Хоч це і значно спростило нам війну, ми, як і раніше, боремося з ворогами, що залишилися."
 lar_spain.36.desc:0 "Грубо ігноруючи Танжерський протокол 1924 року, [From.GetAdjective]і війська ввійшли до міжнародної зони Танжера як окупаційні сили: інакше їх не назвеш. Попри заклики іспанських націоналістів до прямої анексії території, [From.GetAdjective]ий посол запевняє нас, що це лише «тимчасовий захід воєнного часу», і що згодом місто повернеться до свого довоєнного статусу."
 lar_spain.42.desc:0 "Іспанський трон, який нещодавно зайняв король [From.GetLeader], не приховував своїх домагань на трон Франції на грунті легітимізму. і офіційно оголосив про своє бажання негайно бути коронованим у Реймсі."
 lar_spain.45.a:0 "Звучить мудро."
 lar_spain.57.t:0 "[From.GetNameDefCap] надає автономію"
 lar_spain.67.b:0 "Нам залишається лише прийняти це."
 lar_spain.67.t:0 "[From.GetAdjective] війна за незалежність!"
 lar_spain.71.t:0 "[From.GetNameDefCap] просить укласти пакт про ненапад"
 lar_spain.73.desc:0 "Держава [From.GetNameDefCap] вислухала нашу пропозицію укласти пакт про ненапад і повідомила, що зараз це не в їхніх інтересах."
