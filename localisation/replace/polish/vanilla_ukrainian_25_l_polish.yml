 GER_integrated_economies_desc:0 "Інтеграція економік наших союзників з нашою та створення німецького центрального банку, який зможе контролювати та допомагати економічному становищу інших держав, буде дуже вигідною для нас у довгостроковій перспективі, зміцнюючи нас і збільшуючи їхню залежність від нас, що в кінцевому підсумку дозволить нам контролювати їхні зовнішні справи."
