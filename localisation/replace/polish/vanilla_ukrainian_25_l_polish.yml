 HOL_beginnings_of_a_dutch_blitzkrieg_desc:0 "З німецькою допомогою, можливо, ми зможемо приєднатися до бліцкригу з нашими власними танковими силами."
 HOL_destroyer_1_desc:0 "The Van Ghent, or Admiralen, class consisted of eight destroyers built for the Royal Dutch Navy between 1926 and 1931. The ships were based upon early versions of the British A-class. All ships fought in World War II and were either scuttled or sunk. The ships displaced over 1,300 tons, were armed with four 120mm guns, and had decent speed for their vintage."
 HOL_escorts_for_the_new_fleet_desc:0 "Наші лінійні крейсери вимагають достатнього ескорту для захисту від торпедних катерів і підводних човнів. Ми повинні гарантувати, що будь-який ескорт, який ми будуємо, має найсучасніший дизайн."
 HOL_fokker_tt:0 "Буде відкритий конструктор літаків §Y$fokker$§!.\n"
 HOL_gateway_to_europe_eng_category_desc:0 "Німці використовують Нідерланди як «чорний хід» для обходу нашої блокади і торгують через нейтральні нідерландські порти. Нам потрібно схилити нідерландців на свій бік, якщо ми хочемо, щоб блокада стала більш ефективною."
 HOL_gateway_to_europe_ger_category:0 "Ворота в Європу"
 HOL_infantry_equipment_1_short:0 "Johnson M41"
 HOL_johan_furstner:0 "Йоган Фурстнер"
 HOL_lessons_from_the_low_countries_desc:0 "Будучи нейтральною землею між двома великими державами, Нижні землі пережили свою частку війн. Ми повинні винести з цього уроки та бути готовими до ще більших вторгнень, оскільки один сусід знову намагається зрівняти нас, щоби досягти іншого."
 HOL_liberation_desc:0 "Наша батьківщина звільнена, і армії, які здалися після нашої капітуляції, звільнені і жадають помсти. Моральний дух зростає, коли радісні натовпи вітають визволителів, і люди не легко потерплять ще одного загарбника."
 HOL_light_cruiser_4_desc:0 "The De Zeven Provinciën class consisted of two cruisers laid down just before the German invasion but not completed until 1951. The final design was modified from the original 1939 plan, and led to two ships that displaced over 12,000 tons and were armed with eight Bofors 152mm cannon. They were well-armored for a light cruiser and had good range."
 HOL_light_tank_artillery_equipment_3_short:0 "PTG-5"
 HOL_light_tank_destroyer_equipment_1_short:0 "TJ-1"
 HOL_philips_focus:0 "Philips"
 HOL_prince_bernhard:0 "Принц Бернард"
 HOL_royal_arms_purchases_desc:0 "Оскільки тепер її інтереси ще більш складно пов'язані з інтересами країни в цілому, королева запропонувала використати свої значні особисті статки для фінансування придбання нового обладнання з-за кордону."
