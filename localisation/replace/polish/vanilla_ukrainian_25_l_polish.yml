 RAJ_indian_marine_corps_desc:0 "Ми створимо спеціалізований Корпус морської піхоти, навчений амфібійним операціям та спеціалізованим штурмам."
 RAJ_jet_tac_bomber_equipment_2:0 "English Electric Canberra"
 RAJ_lobby_for_increased_policing_responsibilities_desc:0 "Світ більше не є тим тихим місцем, яким він був колись. Зростаюча напруга зсередини та ззовні дає нам додаткову санкцію захищати власність компанії. Ми будемо лобіювати збільшення фінансування ПВК, безсумнівно, уряд побачить розум, а якщо ні, то кожен має свою ціну."
