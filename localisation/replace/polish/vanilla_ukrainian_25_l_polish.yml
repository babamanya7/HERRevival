 SOV_organize_wreckers_desc:0 "Радянська влада вже очікує багато саботажу від шпигунів та класових ворогів. Театр безпеки навіть на найменшому металургійному заводі за іронією долі розчарував багатьох робітників, тож ми легко знайдемо людей, які спробують помститися дрібним тиранам на своєму заводі, якщо ми дамо їм для цього засоби."
