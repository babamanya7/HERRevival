 land_fort_tech_2_desc:0 "Навчаючись на минулих помилках і зміцнюючи не тільки саму структуру, але й її фундамент, ми зможемо побудувати набагато більші укріплення, які зможуть стримати навіть найдосвідченіших ворогів."
