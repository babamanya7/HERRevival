 GER_nordische_legion_ns_desc:0 "Багато [ROOT.GetAdjective]их громадян прагнуть пригод і бажають боротися за гідну справу. Ми створили легіон добровольців, які вирушать допомагати нашим північним братам у їхніх війнах."
