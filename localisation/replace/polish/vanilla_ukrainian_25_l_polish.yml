 SPA_activate_granada_fifth_columnists:0 "Задіяти п'яту колону у Гранаді"
 SPA_all_shall_serve:0 "Служитимуть усі"
 SPA_an_armored_corps:0 "Броньований корпус"
 SPA_carlist_uprising_mission_desc:0 "Карлістські елементи в нашій фракції були обурені нашим лідерством і нашим зростаючим впливом. Замість стати в один ряд, невдоволення поширюється по всіх рекете, і ширяться чутки про повстання. Ми мусимо бути готові до повстання карлістів, навіть якщо ми маємо справу з нашими ворогами-республіканцями."
 SPA_communism_DEF:0 "Республіканська Іспанія"
 SPA_establish_murcia_carlist_cell:0 "Створити осередок карлістів у Мурсії"
 SPA_expand_the_special_forces_desc:0 "Жменька спеціалістів може досягти того, чого не можуть звичайні піхотинці. Ми розпочнемо спеціалізовану підготовку для виконання конкретних завдань, гарантуючи, що у нас є необхідні інструменти, якщо виникне така потреба."
