 MAN_tsr_reform_the_army_desc:0 "Наші нинішні сили — це не що інше, як різношерста група різних повстанських армій і залишків маньчжурської армії. Якщо ми хочемо уникнути повної катастрофи в майбутніх війнах, ми повинні спочатку реформувати її в те, чим вона була колись."
 MAN_tsr_request_control_of_the_railways_desc:0 "$MAN_request_control_of_the_railways_desc$"
 MAN_tsr_the_southern_expedition_desc:0 "Північний похід Гоміньдану — це те, що колись зруйнувало нашу прекрасну республіку. Ми повинні виправити цю помилку, розпочавши Південний похід і нарешті покінчивши з неспроможною державою, що зараз окупує Нанкін."
