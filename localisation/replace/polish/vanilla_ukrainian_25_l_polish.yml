 SH_battleship_1_desc:0 "Виконання угод залишилося далеко в минулому. Відкинувши обмеження, ми можемо створити найважчий і найпотужніший лінкор, здатний вести бій із кількома супротивниками відразу."
 SIA_a_constitutional_monarchy_desc:0 "Трону не обов'язково домінувати в державі, щоб зберегти королівство. Відновивши монархію в рамках надійного конституційного врегулювання, ми зможемо зв'язати Корону і народ разом і забезпечити співіснування королівської гідності з відповідальним урядом."
 SIA_acquire_submarines_desc:0 "Підводні човни дають невеликому флоту шанс завдати удару вище своєї вагової категорії. Сховані під хвилями, вони можуть загрожувати судноплавству, стримувати сильніші флоти і ускладнювати будь-які ворожі задуми проти нашого узбережжя. [ROOT.GetNameDefCap] не повинна нехтувати такою зброєю."
 SIA_an_absolute_monarchy_desc:0 "Експеримент з обмеженою монархією приніс лише приниження, переворот та узурпацію королівської влади амбітними офіцерами. Якщо трон хоче знову командувати лояльністю, то Корона повинна відновити свої повні прерогативи і правити без підпорядкування партіям чи парламенту."
 SIA_ananda_military_1:0 "Студент військової справи"
 SIA_baht_stabilization_act_desc:0 "Сучасна економіка вимагає валюти, якій довіряють купці та яку приймають інвестори. Стабілізація бата зменшить невизначеність у торгівлі і дасть [ROOT.GetNameDef] твердіший ґрунт на міжнародному ринку."
 SIA_contingency_funds_tt:0 "Ми збиратимемо резервний фонд у мирний час. Під час збору цього фонду ми отримаємо помірну кількість §Yфактора споживчих товарів§!.\n\nПід час війни ми можемо розкрити цей фонд, якщо захочемо, отримавши великий виробничий бонус.\nТе, як довго триватиме бонус фонду, залежить від того, як довго ми збирали фонд перед тим, як його застосувати."
 SIA_conventional_tank_construction:0 "Традиційне танкобудування"
 SIA_defenders_of_constitutional_liberty:0 "Захисники конституційної свободи"
