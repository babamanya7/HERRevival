 bba_news.107.desc:0 "Папа Пій XI відійшов у вічність, очолюючи Католицьку Церкву майже 20 років. Під час свого перебування на посаді великого понтифіка Пій XI поклав край тривалому розриву між Папством та італійським урядом і відіграв вирішальну роль у відновленні Ватикану як незалежної держави."
