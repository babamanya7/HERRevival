 RAJ_corporate_domination:0 "Корпоративне домінування"
 RAJ_cult_of_personality_desc:0 "Щоб зміцнити націю, ми піднесемо нашого дорогого лідера та сформуємо культ особистості. Символічна фігура, за яку простий люд зможе згуртуватися та померти."
 RAJ_cv_CAS_equipment_3_short:0 "Sea Fury"
 RAJ_eastern_pakistan_desc:0 "Бангладеш стане Східним Пакистаном, і всі мусульмани керуватимуться під одним прапором."
 RAJ_elephants_for_the_modern_age:0 "Слони для сучасної епохи"
 RAJ_exile_princes_desc:0 "Ера князівського правління добігла кінця. Щоб забезпечити справжню національну єдність, ми усунемо ці залишки феодальної влади, виславши їх подалі від їхніх палаців та народу, яким вони колись правили."
 RAJ_fighter_equipment_2:0 "Supermarine Spitfire"
 RAJ_founder_of_the_csp:0 "Засновник CSP"
 RAJ_handloom_weaving_desc:0 "Ручне ткацтво стало символом традиції та незалежності на субконтиненті, водночас надаючи робочі можливості для місцевих виробників."
