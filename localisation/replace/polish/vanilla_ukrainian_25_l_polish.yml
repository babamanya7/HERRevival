 SOV_politicized_military_swap_desc:0 "Хоча ми не повинні дозволяти політичним міркуванням диктувати військові рішення, ми все одно повинні переконатися, що ці політичні міркування враховуються під час прийняття рішення."
 SOV_poster_center_text:0 "[GetDaysRemainingCenter]"
 SOV_preparations_for_operation_countenance_tt:0 "Ми матимемо §Y[?SOV.SOV_operation_countenance_preparation_days] дн.§!, щоб підготуватися, перш ніж починати операцію «Згода» й оголошувати війну державі [PER.GetNameDef]. \n$SOV_preparations_for_operation_countenance_mission_tt$\n"
 SOV_proclaim_soviet_hegemony_desc:0 "Зрозуміло, що радянська система влади, радянська економіка і радянське суспільство в усіх аспектах значно перевершують попередні системи. Поки ці застарілі системи існують в інших частинах світу, завжди знайдуться люди, готові їх оскаржити, і ми повинні це використати."
 SOV_propaganda_builders_of_communism_effect_tt:0 "Кожна радянська маріонетка отримає ідею §Y$SOV_young_builders_of_communism$§!, що дає §g(§!$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+1.00%§!, $MODIFIER_MASTER_IDEOLOGY_DRIFT$: §G+0.25§!§g)§! на §Y[?SOV_default_propaganda_campaign_duration]§! дн."
