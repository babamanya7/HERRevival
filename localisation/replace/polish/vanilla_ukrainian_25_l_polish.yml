 ICE_rally_the_workers_of_reykjavik_desc:0 "Ісландія не має армії, про яку можна було б говорити, але робітники столиці, безсумнівно, можуть стати силою, з якою слід рахуватися. Якщо робітники повстануть проти системи, їх мало що зможе зупинити, тому залучення їх на свій бік є надзвичайно важливим."
