 PRC_army_doctrines_desc:0 "Доктрина, яку ми ретельно розробляли протягом різних конфліктів, у яких брали участь, повинна бути пристосована до нашої нової організації та озброєння. Без інтеграції їхні переваги будуть зменшені."
 PRC_bolshevik_urbanization_completed_desc:0 "Наші інвестиції в урбанізовані райони успішно посилили наш вплив там. Тепер ми можемо розраховувати на міцнішу співпрацю між комуністичними організаціями села та міста."
