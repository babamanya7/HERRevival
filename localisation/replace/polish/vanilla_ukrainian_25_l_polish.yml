 BRA_corporatism:0 "Прийняти корпоративізм"
 BRA_end_the_state_of_emergency_desc:0 "Колись героїчний [BRA.GetLeader] тепер є найбільшою загрозою для [BRA.GetAdjective] демократії. Його прагнення до влади та опортуністичні тенденції дозволили йому майже призупинити права, за які ми боролися. Усі, хто цінує свободу, повинні протистояти цьому небезпечному надзвичайному стану."
 BRA_federal_republic:0 "Перехід до федералізму"
 BRA_gained_support:0 "Проведено мітинги інтегралістів задля створення підтримки в області"
 BRA_german_tanks_desc:0 "Завдяки тому, що ми стали на бік німців, ми можемо не лише легко отримати креслення та деталі для дослідження та виробництва танків, подібних до німецьких «Панцерів», але й легко придбати такі машини у них. «Тліючі кобри» вселятимуть страх у серця наших ворогів!"
 BRA_infantry_equipment_3:0 "M2 Carbine"
 BRA_infilitrate_the_military_desc:0 "Хоча високопоставлені члени військових залишаються ворожими до нашої ідеології, багато молодших офіцерів прагнуть можливості усунути своє начальство. Якби ми проникли в їхні лави, ми могли б схилити їх до нашої справи."
 BRA_italian_cooperation_desc:0 "У міру того, як старі імперії руйнуються, виникає нова боротьба за Африку. Завдяки нашим особливим стосункам з [ITA.GetNameDef], ми маємо можливість відхопити шматок континенту для себе."
 BRA_land_reform_key:0 "Земельна реформа"
 BRA_modify_brazilian_navy_ns_intro:0 "Ідею §Y$BRA_navy_modifier$§! буде змінено:"
 BRA_modify_estado_novo_ns_intro:0 "Ідею $BRA_estado_novo_modifier$ буде змінено:"
 BRA_no_communism_in_south_america_tt:0 "Отримає ціль війни §Y$puppet_wargoal_focus$§! проти всіх §Yкомуністичних§! держав §YПівденної Америки§!."
 BRA_ship_torpedo_sub_4:0 "6x 533-мм ТА з P.Loading"
 BRA_support_rural_folk_desc:0 "[BRA.GetAdjectiveCap]і жителі, які проживають у сільській місцевості нації, були забуті десятиліттями політиків. Інвестуючи в такі райони, ми можемо збільшити зайнятість та інфраструктуру, а також заручитися підтримкою цієї великої демографічної групи."
 BRA_tax_haven_desc:0 "Низькі податки для корпорацій і низка лазівок призвели до збільшення кількості транснаціональних корпорацій, які переїжджають до Бразилії. Зрештою, краще, щоби ми отримували від них певні податкові надходження, ніж не отримували жодних."
 BRA_vassouras_line:0 "Підтримати претензію Педру Енрікі"
