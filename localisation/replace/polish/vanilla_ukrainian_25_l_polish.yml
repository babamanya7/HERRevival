 GER_GER_is_monroe_actor_d_usa_resistance:0 "Схоже, що [USA.GetAdjective]і дурні вирішили боротися з нашими спробами дестабілізувати доктрину Монро. Проте, діючи швидко, ми все одно зможемо швидко позбутися безглуздя, про яке йдеться в Доктрині."
 GER_MONROE_DOCTRINE_COUNTRIES_IN_THE_DOCTRINE_TOOLTIP:0 "Наступні країни §Y[?global.monroe_doctrine_countries_to_destabilize^num]§! є частиною доктрини Монро:\n\n[GetCountriesInTheMonroeDoctrine]"
 GER_VICTORY_POINTS_3548:0 "Мункач"
 GER_VICTORY_POINTS_6711:0 "Клаузенбург"
 GER_VICTORY_POINTS_9503:0 "Штрасбург"
 GER_african_allies_desc:0 "Народи Африки прагнуть визволення від європейців. Можливо, обіцянка автономії переконає їх приєднатись до нас."
 GER_antischluss_progress_moderate:0 "зробили §Oсередній§! поступ у цьому"
 GER_ascension_of_himmler:0 "$GER_inner_circle_member_title$ Гіммлер"
 GER_atlantic_naval_bases:0 "Атлантичні морські бази"
 GER_aufrusting_modifier_desc:0 "Кожна збудована фабрика, кожна витрачена марка, кожен інвестований ресурс — усе це служить нашій амбітній меті створити грізну військову машину. Мілітаризація, Aufrüstung, є життєво важливою для захисту майбутнього нашої нації та зміцнення німецького суверенітету."
 GER_battle_cruiser_1_desc:0 "Три кораблі класу «Yorck» були спроєктовані у відповідь на британський крейсер класу «Renown». Вони мали бути озброєні вісьмома 380-мм гарматами в чотирьох спарених баштах. Всі три кораблі були закладені в 1916 році, але жоден із них не був завершений у зв'язку з війною."
 GER_case_anton_category:0 "Операція «Антон»"
 GER_construct_aircraft_carriers:0 "Побудувати авіаносці"
 GER_construct_south_atlantikwall_tt:0 "Побудувати оборонну лінію вздовж §YПіренейського узбережжя§! в кожній області повністю підконтрольній державі §Y[ROOT.GetNameDef]§!, [GER.GetAdjective]ій маріонетці або члену альянсу. Додати §G1§! додаткове §Y$coastal_bunker$§! в провінціях із хоча б §Y1 $naval_base_ins$§!. Поточний ефект:\n"
