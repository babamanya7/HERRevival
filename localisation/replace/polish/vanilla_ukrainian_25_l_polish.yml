 USA_pacific_decolonisation_desc:0 "Немає жодного виправдання тому, що країни Європи досі присутні в Тихому океані, а жителі тихоокеанських островів продовжують служити своїм європейським господарям. Америка більше не сидітиме склавши руки, дивлячись на цю кричущу несправедливість."
 USA_reestablish_the_gold_standard_desc:0 "Без золотого стандарту гроші забезпечені лише чесним словом, а галопуюча інфляція знищує заощадження наших громадян та знецінює їхню працю. Ми мусимо покласти край цій фінансовій безвідповідальності."
 USA_scout_plane_equipment_2_short:0 "F6"
 USA_the_giant_wakes_desc:0 "Інші держави звертаються до нас із проханням захистити демократичні цінності та свободи. Той світ, де Америка могла дозволити собі політику невтручання, більше не існує, і ми маємо це прийняти."
