 ITA_reorganize_ascari_tt:0 "Додасть §Y1 батальйон легкоброньованої розвідроти§! й §Y1 батальйон артилерії§! до всіх шаблонів дивізій колоніальної піхоти.\nДодасть §Y2 батальйони кавалерії§! й §Y1 загін кінної розвідки§! до всіх шаблонів дивізій колоніальної кавалерії.\nДодасть §Y2 батальйони верблюдової кавалерії§! й §Y1 загін кінної розвідки§! до всіх шаблонів дивізій колоніальної верблюдової кавалерії."
 ITA_request_control_of_french_territories:0 "Попросити контроль над французькими територіями"
 ITA_subdue_the_sentinels_desc:0 "Наступний крок на шляху до свободи та слави, на які заслуговує італійський народ, — це підкорити вартових, які тримають нас у полоні Середземномор'я, а тобто Гібралтар і Суец."
