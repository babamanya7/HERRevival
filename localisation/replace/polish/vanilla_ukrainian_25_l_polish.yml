 SWE_sp_rockets_ground_to_air_missile:0 "Проєкт «BAMSE»"
 SWE_subject:0 "$OVERLORDADJ$а $SWE$"
 SWE_the_new_order_desc:0 "Виживання найсильнішого є основою наших переконань. Таким чином, настав час знищити ослаблену [GER.GetName] і знову утвердити себе як незалежну велику державу."
 SWE_the_threat_of_the_iron_curtain_desc:0 "Незважаючи на нещодавній конфлікт, який охопив більшу частину земної кулі, між державами-переможницями назріває напруженість. Якщо ми хочемо уникнути підхоплення наших супротивників, які змагаються за контроль над Балтикою, ми повинні стримувати їх, беручи участь альянсу однодумців."
 SWE_train_the_sheltered_desc:0 "Конфлікт у нашому регіоні змусив багатьох наших північних сусідів знайти притулок тут, у [SWE.GetName]. Багато з них бойового віку, і їх можна було б покликати допомогти в захисті нації."
 SWE_train_the_sheltered_short_desc:0 "Наразі ми навчаємо скандинавських солдатів, замаскованих під поліцейських. У разі війни їх покличуть служити в армії, додаючи робочу силу до нашого резерву.\nМи можемо розширити наші можливості, щоб тренувати ще більше при необхідності"
 SWE_universal_basic_income:0 "Загальний базовий дохід"
 SWI_BLITZKRIEG_DESC:0 "Швайцарія перебувала в напруженій ситуації ще до аншлюсу, але тепер, коли Німецький Райх відчув смак легкої експансії на інші німецькомовні території, існує реальна небезпека, що наступною буде ця миролюбна альпійська держава. Тепер, як ніколи, абсолютний нейтралітет Швайцарії буде підданий випробуванню, а якщо все піде не так, можливо, навіть її захист."
