 SOV_super_heavy_tank_destroyer_equipment_1_short:0 "ИСУ-130"
 SOV_support_the_kuomintang_desc:0 "Китайські комуністи слабкі у військовому плані і не мають промислової бази, на якій можна було б побудувати велику армію. Зрозуміло, що Гоміньдан найкраще підходить для того, щоб контролювати Китай і створити буржуазне суспільство, необхідне як передумова для успішної комуністичної революції."
 SOV_surface_warfare_ns_tt:0 "$SOV_modify_red_fleet_ns_intro$\n$SOV_the_red_fleet_surface_1_bonus_tt$\n\n"
 SOV_system_decentralization_desc:0 "Сталін централізував не лише партію, але й усю країну в своїх руках. Це явно контрреволюційний підхід, який забирає владу у робітників і передає її в руки корумпованої еліти. Ми мусимо змінити цей напрямок і дозволити робітникам знову вирішувати свою долю."
 SOV_the_collectivization_process_desc:0 "Хоча багато роботи ще належить виконати, і хоча в деяких регіонах з нею погано впоралися, процес колективізації селянських господарств у Радянському Союзі майже завершився, і незабаром це призведе до збільшення виробництва в аграрному секторі."
 SOV_the_fourth_international_idea_desc:0 "Як справжні лідери Інтернаціоналу, ми тепер можемо керувати курсом комунізму у світі."
 SOV_the_military_conspiracy_mission:0 "$SOV_the_military_conspiracy$"
 SOV_the_rightful_heir_to_the_empire_desc:0 "Хоча старої Візантійської імперії вже давно немає, хтось все ще повинен захищати паломників до Святої Землі. Зрозуміло, що британці та французи не впораються з цим завданням, тож воно, вочевидь, має лягти на нас."
 SOV_the_vanguard_of_the_true_revolution_desc:0 "Нехай світ почує про нашу революцію. Ми звернемося до всіх революціонерів світу із закликом стати під наші прапори. Разом ми зможемо перемогти Сталіна. Разом ми зможемо довести революцію до перемоги."
 SOV_the_workers_dictatorship_mission_desc:0 "[FROM.GetLeader] працює над виконанням фокусу $SOV_the_workers_dictatorship$."
