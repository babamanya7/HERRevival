 ITA_battaglioni_m_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_militia_max_org_factor$: §G+5.00%§!\n$modifier_army_sub_unit_militia_defence_factor$: §G+5.00%§!\n§YШтурмові батальйони чорносорочників§! також будуть поліпшені після завершення фокусу §Y$ITA_battaglioni_d_assalto$§!.\n\n"
 ITA_bop_question_the_army:0 "£BoP_left_texticon Поставити під питання лояльність армії"
 ITA_bop_question_the_army_desc:0 "Нещодавні події, які продемонстрували неефективність армії, змусили багатьох людей замислитися над тим, наскільки саме війська лояльні до Італії та фашистської системи."
 ITA_bop_take_over_ministry_of_foreign_affairs:0 "\"£BoP_right_texticon Очолити Міністерство закордонних справ"
