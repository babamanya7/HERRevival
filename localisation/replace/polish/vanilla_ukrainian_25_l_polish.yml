 SIA_mandate_2_desc:0 "Тайський народ не повинен займатися жодною справою, не враховуючи вигоду та безпеку нації\n\nТайський народ ніколи не повинен розкривати іноземцям нічого, що може зашкодити нації. Такі дії є зрадою нації\n\nТайський народ не повинен діяти як агент або речник іноземців, не враховуючи інтереси тайської нації, і не повинен висловлювати думку або ставати на бік іноземців у міжнародних суперечках. Такі дії є зрадою нації.\n\nТайський народ не повинен таємно купувати землю від імені іноземців у спосіб, що ставить під загрозу націю. Ці дії є зрадою нації.\n\n Коли людина зрадила націю, обов'язок тайського народу — активно і швидко покласти цьому край."
