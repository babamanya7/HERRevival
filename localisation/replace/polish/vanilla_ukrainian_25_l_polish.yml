 GRE_siemens:0 "Siemens"
 GRE_the_right_to_rule_desc:0 "Навіщо призначати диктатора, який діятиме від імені короля, коли король чудово може діяти сам? Ми не будемо наполегливо дотримуватися традицій, поки Греція страждає. Настав час істинного монарха, який служить народові! Боже, бережи короля Георга II!"
