 DEN_unify_flyvevabnet_desc:0 "Наразі ми маємо два різних і повністю відокремлених один від одного військово-повітряних сили: армійські Hærens Flyvertropper і військово-морські Marinens Flyvevæsen. Обидві гілки часто суперечать одна одній. Об'єднання їх в один, єдиний військово-повітряний підрозділ створило б цілісну стратегію і започаткувало б новий вид збройних сил."
