 SPR_CAS_equipment_3_short:0 "HS-44"
 SPR_autogestion_desc:0 "Ми максимізуємо продуктивність, дозволяючи працівникам брати участь у самоуправлінні на робочому місці відповідно до принципів autogestión. Це дасть багато переваг з точки зору автономії працівників, морального духу та, як наслідок, загальної продуктивності."
 SPR_destroyer_2_desc:0 "The Spanish Churruca class included sixteen destroyers launched between 1925 and 1933, two of which were later sold to Argentina. The ships were designed based on the British S-class destroyers and made up the backbone of the Spanish Navy during the Civil War. They displaced over 1,500 tons and were armed with five 120mm/45 Vickers-Armstrong guns in their main armament, as well as six 533mm torpedo tubes. They had good speed and excellent range. "
 SPR_esperanza_y_cia_organization:0 "$SPR_esperanza_y_cia$"
 SPR_expand_the_means_of_production_desc:0 "Здоров'я колективу залежить від сили його промисловості. Розширюючи нашу, ми можемо забезпечити стабільність усередині та посилити захист від ворогів зовні."
 SPR_felipe_diaz_sandino:0 "Феліпе Діас Сандіно"
 SPR_masters_of_our_own_fate:0 "Володарі власної долі"
 SPR_no_pasaran_tt:0 "Розмістить §Y1 укріплення§! в усіх провінціях із §Y1 переможним балом§! у контрольованих регіонах.\nРозмістить §Y2 укріплення§! в усіх провінціях із §Y3 переможними балами§! в контрольованих регіонах.\nРозмістить §Y3 укріплення§! в усіх провінціях із §Y10 переможними балами§! в контрольованих регіонах.\nРозмістить §Y4 укріплення§! в усіх провінціях із §Y30 переможними балами§! в контрольованих регіонах.\n"
 SPR_prepare_for_the_next_war_desc:0 "Громадянська війна показала недоліки в керівництві нашим флотом. Поліпшення якості нашої військово-морської академії, а також збільшення її розміру повинні забезпечити, щоб ці дорогі тактичні та стратегічні помилки стали набагато менш імовірними в майбутньому."
 SPR_regional_defense_council_of_aragon_desc:0 "З метою ведення війни, і лише за необхідності, автономні анархістські комуни, які виникли в результаті громадянської війни, повинні бути об'єднані під єдиною Оборонною радою, яка зможе координувати наші зусилля. Ми почнемо зі створення в Арагоні."
