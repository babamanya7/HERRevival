 TUR_counter_the_rebels_in_diyarbakir_desc:0 "Повстанці в Діярбакирі зазвичай менш активні, ніж деінде, — можливо, через те, що сам Діярбакир відносно розвинений."
 TUR_desert_camel_corps_desc:0 "Якщо ми збираємося брати участь у важких і довгих операціях на Близькому Сході та в Африці, нерозумно не реформуватиме наші корпуси верблюжої кавалерії! На своїх верблюдах ми могли б доїхати від Каїру до Кейптауну зі зручністю та шиком!"
 TUR_disorganised_armed_forces_24_desc:0 "$TUR_disorganised_armed_forces_desc$"
 TUR_disorganised_armed_forces_7:0 "$TUR_disorganised_armed_forces$"
 TUR_german_advisors_desc:0 "Офіційно діючи як посли та бізнес-консультанти, ми зараз приймаємо значну групу німецьких офіцерів, готових допомогти нам у модернізації наших військових і зробити їх максимально ефективними бойовими силами."
 TUR_host_exiled_scientists_desc:0 "Багато націй, якими керують недалекоглядні солдафони, поспішають вигнати свої найкращі уми лише тому, що ті не підтримують тиранічну політику. [TUR.GetNameDef] надасть притулок цим вигнанцям — нам вони дуже потрібні."
 TUR_kemalist_army_officers_extended_power_neutral:0 "Офіцери-кемалісти"
 TUR_light_cruiser_1_desc:0 "The Turkish ship Mecidiye was a protected cruiser built in the U.S. for the Ottoman Navy at the turn of the century. She was actually sunk in shallow water during World War II, but was raised and after a brief stint as part of the Imperial Russian Navy, was returned to Turkey. She displaced just under 3,500 tons and was armed with two 152mm/44 Bethlehem No. 2 and eight 120mm/45 Armstrong Y guns. They had decent range but were relatively slow and lightly armored."
 TUR_mehmet_fahri_engin_bftb:0 "$TUR_mehmet_fahri_engin$"
 TUR_mustafa_kemal_ataturk_figurehead:0 "$TUR_mustafa_kemal_ataturk$"
 TUR_nationalism_desc:0 "Не бійтеся; бо багряний прапор, що гордо майорить на цій славній зорі, не згасне, поки не згасне останній вогонь, який палає в моїй батьківщині. Бо це зірка мого народу, і вона вічно буде світити; це моє; і належить виключно моєму доблесному народові."
