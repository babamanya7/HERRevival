 control_chinese_metals_goal_desc:0 "Багатство Китаю різними критично важливими металами може забезпечити військово-промислову базу альянсу необхідними ресурсами."
 control_guadalcanal_goal_desc:0 "Забезпечення Гуадалканалу дозволить нам здійснювати контроль над військово-морськими операціями в південній частині Тихого океану та маршрутами доступу з та до Австралії."
 control_okinawa_goal_desc:0 "Контроль над Окінавою уможливить запуск операцій проти Японських островів та встановлення сильного оборонного периметра в Тихому океані."
 control_trinidad_goal_desc:0 "Ключове розташування Тринідаду робить його необхідним для контролю над постачанням нафти в Карибському морі та дозволяє служити стратегічною точкою відправлення на північному узбережжі Південної Америки."
