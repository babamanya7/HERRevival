 DEN_industrial_capability_dynamic_modifier_improved_desc:0 "Данія традиційно була аграрним суспільством і виробником, але її промисловість зросла у своїй важливості та економічному значенні. Ми повинні індустріалізуватися та модернізуватися, щоб не відставати від стрімкого розвитку в сучасну епоху."
