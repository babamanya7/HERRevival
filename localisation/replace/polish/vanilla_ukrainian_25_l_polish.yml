 CZE_airlift_soviet_support_desc:0 "Відсутність спільних кордонів з нашим [SOV.GetAdjective]им союзником призвела до новаторської ідеї перекидання [SOV.GetAdjective]их військ повітрям. Транспортна операція такого масштабу ще ніколи не проводилася, але це означатиме, що [SOV.GetAdjective]им військам не доведеться входити на територію наших сусідів, принаймні по суші."
