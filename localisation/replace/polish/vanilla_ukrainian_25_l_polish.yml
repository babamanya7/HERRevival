 CZE_exchange_military_expertise:0 "Обмін військовим досвідом"
 CZE_facilitate_a_strong_hungary_desc:0 "З моменту здобуття незалежності [HUN.GetNameDef] мала з нами хиткі відносини. Але з назріванням конфлікту ми можемо залучити їх на свій бік."
