 SIA_unconventional_tank_construction_desc:0 "Ми не можемо імітувати бронетанкові програми великих держав деталь за деталлю. Якщо [ROOT.GetNameDef] взагалі планує розгортати танки, ми повинні шукати дешевші та більш адаптивні методи будівництва, жертвуючи грандіозністю на користь кількості та практичності."
