 JAP_army_securing_army_arsenals_mission_tt:0 "Коли почнеться §YГромадянська війна§!, ми отримаємо наступне на §R365§! днів"
 JAP_army_weapons_administration_headquarters_desc:0 "З метою уніфікації виробництва, постачання, досліджень, розробки, випробувань та навчання використанню армійської зброї ми повинні створити Штаб управління озброєння армії. Завдяки цьому наша промисловість, сподіваємось, матиме шанс протистояти таким гігантам, як [SOV.GetNameDef] та [USA.GetNameDef]."
 JAP_army_weapons_administration_headquarters_tt:0 "Якщо $JAP_army_faction$ має рівень §Y$JAP_imperial_influence_tier_3$§!, також додається §G1§! §Yоб'єкт сухопутної війни§!"
