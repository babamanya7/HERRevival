 YUG_united_kingdom_desc:0 "Тепер, коли наші люди мали нагоду відчути смак незалежності та відчути належне представництво в нашому союзі, настав час зробити кроки для створення того почуття паннаціоналізму та єдності, якого так бракувало нашій колишній державі."
