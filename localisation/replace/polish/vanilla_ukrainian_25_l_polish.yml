 ETH_ITA_fascism_autonomy_satellite_DEF:0 "Королівство Ефіопія"
 ETH_an_arabic_base:0 "Арабська база"
 ETH_ayalew_birru:0 "Аялев Бірру"
 ETH_boarding_the_train_tt:0 "§Y$ETH_haile_selassie$§! покине державу [ROOT.GetName] та піде в Лігу націй. Якщо Ефіопія капітулює, $ETH_haile_selassie$ створить §Yуряд у вигнанні§!."
 ETH_bring_in_foreign_advisors_desc:0 "Незважаючи на наш постійний прогрес у створенні повітряних сил [ETH.GetAdjective], нам не вистачає важливого досвіду з перших рук, щоб переконатися, що наші пілоти використовуються якомога повніше. Тому ми запросимо офіцерів з-за кордону, щоби порадити, як ми можемо поліпшити ситуацію."
 ETH_build_local_resistance_force_desc:0 "Ми повинні зробити все можливе, щоб підтримати рухи опору на окупованих територіях. Це значно послабить [ITA.GetAdjective]ий контроль над регіоном і втримає їх на окупованих територіях, поки ми готуємося до неминучого звільнення держави [ETH.GetName]."
 ETH_chitet_category:0 "Чітет"
 ETH_christmas_offensive_mission:0 "Різдвяний наступ"
 ETH_clearing_the_skies_desc:0 "Наші солдати повністю відкриті від ворожої авіації, не маючи можливості захиститися. Що ще гірше, ворог завжди знає про наші дислокації та пересування. Нам потрібні власні повітряні сили та засоби протидії, якщо ми хочемо мати надію на перемогу. Таким чином, ми повинні відправити волонтерів для навчання з [SOV.GetAdjective]ими ВПС."
 ETH_communal_agriculture_consumer_tt:0 "Змінити §Y$ETH_industrialization_dynamic_modifier$§! на:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-5%§!"
 ETH_contact_the_exiles:0 "Зв'язатися з вигнанцями"
 ETH_counter_the_armored_threat_LaR_tt:0 "\nЯкщо §Y[SOV.GetFlag][SOV.GetNameDef]§! погодиться, §Y[ETH.GetFlag][ETH.GetName]§! отримає технологію §Y$gw_armored_car_equipment$§! та §G480§! [SOV.GetAdjective]их бронемашин."
 ETH_coup_haile_selassie_imru_desc:0 "Демократично налаштований $ETH_ras_imru_haile_selassie$ править країною за відсутності імператора. Без сумніву, він сприймається масами як справжній герой держави [ROOT.GetName] після того, як очолив країну у війні. Заклики до більш демократичного режиму в державі [ROOT.GetName] стають дедалі гучнішими. Можливо, настав час дійсно змінити державу [ROOT.GetNameDef]."
 ETH_disband_the_chitet_mission:0 "Ополчення повертаються додому"
 ETH_electrify_state_tt:0 "Змінити §Y$ETH_state_development_dynamic_modifier$§! на:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 ETH_ethiopian_federation_democratic_DEF:0 "Ефіопська федерація"
 ETH_expand_the_kebur_zabagna_desc:0 "[ETH_GetGuardsName] зарекомендували себе як найкращі з найкращих у наших збройних силах. Ми повинні більше використовувати їхні здібності, поліпшуючи їхній доступ до обладнання та робочої сили."
 ETH_expand_the_officer_corps:0 "Розширити офіцерський корпус"
 ETH_hailu_tekle_haymanot:0 "Хайлу Текле Гайманот"
 ETH_hold_harar_mission_success:0 "\n[ETH.GetName] успішно втримала область [835.GetName] (+1) £trigger_yes£\n"
 ETH_hold_the_north_mission_desc:0 "Під час різдвяного наступу вдалося відкинути італійців назад, але нам не вдалося витіснити їх до моря, як ми планували. Вони перегрупуються і атакують із більшою силою, а ми повинні показати, що можемо втримати нашу країну."
 ETH_increase_anarchist_power_balance:0 "Зростаюча підтримка анархістів"
 ETH_italian_occupation_category_map_category_name:0 "Керування [ITA.GetAdjective]ою окупацією держави [ETH.GetNameDef]"
 ETH_italian_uprising_warning_mission_desc:0 "Ходять чутки, що [ETH.GetLeader] закликав повстанців у країні до скоординованого нападу на державу [ROOT.GetName]."
 ETH_italian_uprising_warning_mission_tt:0 "Повстання розпочнеться."
