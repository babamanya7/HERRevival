 HABSBURG_the_modern_hussar_desc:0 "Ні для кого час не зупиняється, навіть для наших хоробрих гусар. Хоча ці хоробрі чоловіки все ще залишаються лише надбанням нашої єдиної армії, ми повинні модернізувати значення слова «гусар». Майбутнє наших шановних нових воїнів, можливо, змусить їх злізти з коней, однак це нічого не означає. Головне, щоб гусарський дух жив!"
