 HRE_UNIFIED_communism_DEF:0 "Союз Німецьких Республік Рад"
 HUN_academy_of_sciences_desc:0 "Інвестуючи в розширення [ROOT.GetAdjective] академії наук, наша нація зможе досягти технологічного прогресу швидше за своїх конкурентів."
