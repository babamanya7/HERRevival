 JAP_propagandize_the_nihon_shoki_desc:0 "«Хроніки Японії» є важливою частиною пояснення нашої історії та детально описують наші міфи про заснування. Ми повинні гарантувати, що це ретельно вивчатиметься в школах, і що діти засвоять зв'язок між завоюваннями Джімму в минулому та нашою майбутньою долею."
 JAP_protect_the_manchurians:0 "Захистити маньчжурів"
 JAP_raise_the_boeitai:0 "Підняти Боейтай"
 JAP_research_spending_desc:0 "Нам слід виділити значне фінансування науково-дослідному напрямку, щоби найефективніше використовувати найкращі уми країни."
 JAP_revisit_the_thirteen_demands:0 "Перегляд «Двадцяти однієї вимоги»"
 JAP_rocket_artillery_equipment_2:0 "40-см ракетний міномет «Type 4»"
 JAP_sea_guide_the_zaibatsus_desc:0 "Найбільші корпорації нашої нації здавна володіли безпрецедентною політичною та економічною владою. Діючи витончено, ми зможемо спрямувати їхні зусилля на нашу користь та реорганізувати їхнє керівництво в групи під нашим ширшим контролем."
 JAP_secure_china_desc:0 "Китайці продовжують запеклий опір, тому ми теж повинні подвоїти наші зусилля і якомога швидше навести лад у континентальному Китаї."
 JAP_secure_the_sea_lanes_desc:0 "Наші флоти потребують найсучаснішого ескорту, щоб діяти без перешкод з боку ворожих підводних човнів і торпедних катерів. Тільки інвестуючи в це, наші транспорти зможуть безпечно дістатися до місця призначення."
