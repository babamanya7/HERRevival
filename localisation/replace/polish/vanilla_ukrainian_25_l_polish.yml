 INS_reallocate_rubber_industry_funding_desc:0 "Наша залежність від продажу каучуку мала згубний вплив на нашу економіку. Ми повинні диверсифікувати нашу економіку шляхом розвідки ресурсів і відкриття шахт і фабрик по всьому архіпелагу. Це буде недешевою справою, тому нам доведеться скоротити бюджет на утримання каучукових плантацій."
 INS_revolution_events.29.desc:0 "Незважаючи на всі наші зусилля, революціонери в Індії взяли під контроль наші великі міста і знищили колоніальний уряд зсередини. Наші генерали були захоплені, а наші лінії зв'язку перерізані. У нас немає іншого вибору, окрім як визнати нашу поразку."
 INS_revolution_events.30.a:0 "Ми погодимося на це."
 INS_revolution_events.37.b:0 "Індонезія наша. Ми не поступимося."
 INS_revolution_events.37.desc:0 "Американці втратили терпіння. Вашингтон висунув ультиматум, вимагаючи негайного припинення всіх військових операцій в Індонезії та визнання індонезійського суверенітету. Погроза ледь завуальована. Наша репутація в міжнародному співтоваристві не переживе публічного розриву з американцями, і наша економіка не зможе поглинути наслідки. Наші генерали наполягають, що кампанію все ще можна виграти, але якою ціною?"
 INS_revolution_events.40.a:0 "Розумний результат."
 INS_revolution_events.7.desc:0 "[ENG.GetNameDefCap] відмовилися допомогти нам відновити контроль над Індією, наполягаючи, що Індія — не їхня турбота, незважаючи на їхню близькість до конфлікту. Нам доведеться переозброювати KNIL самостійно."
