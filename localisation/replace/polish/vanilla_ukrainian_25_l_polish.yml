 PER_iranian_republic_democratic_ADJ:0 "Іранськ"
 PER_metropolitan_iran_desc:0 "Нарешті, після масових зусиль з розвитку, ми досягли того, що [ROOT.GetNonIdeologyName] можна вважати метрополією. Наші міста киплять промисловістю та життям, що налаштовує нас на успіх у майбутньому."
 PER_mohammad_ali_foroughi:0 "Мохаммад Алі Форугі"
 PER_path_through_iraq_desc:0 "[IRQ.GetNameDefCap] — це наш шлях до завоювання Північної Африки, і тому вона має впасти першою. Оскільки Багдад знаходиться так близько до наших кордонів, у нас не повинно бути проблем із просуванням у країну та заявленням прав на їхні землі."
 PER_persepolis_idea_desc:0 "На знак нашої сили як нової імперської держави ми успішно відбудували церемоніальну столицю Ахеменідської імперії. Персеполіс назавжди залишиться символом [PER.GetAdjective] досконалості."
 PER_rally_behind_mosaddegh_desc:0 "З самого початку режиму Пехлеві, Мохаммед Мосаддик був відомий своєю незгодою з багатьма аспектами правління шаха. Якщо ми справді хочемо протистояти династії Пехлеві та створити нову, більш демократичну [PER.GetNonIdeologyName], то, можливо, він той, навколо кого потрібно згуртувати наш рух."
 PER_republic_of_mahabad_tt:0 "Звільнить [KUR.GetNameDef] як §YРеспубліку Махабад§!."
 PER_request_british_equipment_desc:0 "Наші збройні сили зазнали поразки під час вторгнення, і тому ми відчайдушно потребуємо переозброєння. Як новий суб'єкт [ROOT.OVERLORD.GetNameDef], ми маємо хороші позиції, щоб просити припаси та обладнання, щоб наші війська повернулися до своїх попередніх стандартів."
 PER_revive_old_ways_desc:0 "Якщо ми хочемо виділитися на світовій арені, ми повинні продовжувати підтримувати ідеали колишніх Перських імперій. Таким чином, ми повинні докласти зусиль для відновлення зороастризму як державної релігії для [PER.GetNameDef]. Деякі менші племена, які бродять сходом країни, все ще сповідують цю релігію, тому відродження цієї стародавньої теології не є чимось неможливим."
 PER_rokneddin_mokhtari:0 "Рокнеддін Мохтарі"
 PER_ruhollah_khomeini:0 "Рухолла Хомейні"
 PER_saadabad_treaty:0 "Саадабадський договір"
 PER_secularize_the_state_desc:0 "Ever since we began our push for westernization, there has been a constant push back against the clergy in [PER.GetNameDef]. Islam remains to be our state religion, however in an effort to prove to the western world that we are capable of standing among them, it is time for us to separate religion from state and follow a path of modernization."
 PER_sp_rockets_medium_range_ballistic_missile:0 "Проєкт «Ghadr-110»"
 PER_spoils_of_war_idea:0 "Воєнні трофеї"
 PER_stand_with_germany_desc:0 "Протягом багатьох років [GER.GetNameDef] була одним із наших найбільших торговельних партнерів. У міру того, як вони продовжують свої власні цілі завоювання, нам було б розумно укласти угоду та встановити з ними пакт про ненапад, в інтересах захисту наших власних перспектив."
 PER_state_atheism_idea:0 "Повна секуляризація"
 PER_subserviant_to_noone_desc:0 "Хоча ми, можливо, колись вважали наш зв'язок з [ENG.GetNameDef] та Англо-Іранською нафтовою компанією вигідним, ми більше не маємо потреби дозволяти нашим ресурсам бути узурпованими іноземними державами. Ми повинні розпустити цю корпорацію та натомість зосередитися на власному розвитку."
 PER_tank_specialization_bonus:0 "[PER.GetAdjective] спеціалізація на танках"
 PER_transfer_officer_idea_lar:0 "Переведення офіцерів до розвідки"
 PER_transfer_officers_to_intelligence:0 "Перевести офіцерів до розвідки"
 PER_workers_army:0 "Робітнича армія"
 PHI_agricultural_migrants_to_hawaii_desc:0 "Чимало філіппінських робітників знайшли хорошу долю, працюючи на американських фермерів на Гаваях. Ми повинні заохочувати цю еміграцію, щоб вони могли продовжувати надсилати гроші своїм родинам додому, сприяючи зростанню нашої економіки."
 PHI_align_with_the_usa_desc:0 "Сполучені Штати Америки показали себе доброзичливим і багатим покровителем. Зближуючи наші нації, ми можемо отримати від них ще багато допомоги для прискорення нашого розвитку та гарантування нашої безпеки."
 PHI_american_capital_injection:0 "Вливання американського капіталу"
 PHI_american_intervention_host_training_exercise:0 "Провести військові навчання"
 PHI_american_intervention_icon_description:0 "Рівень загрози: [?PHI.PHI_american_intervention_icon_value|0H]§Y%§!\n\nЯкщо значення досягне §R100%§!, то §Y[USA.GetNameDefCap]§! вторгнеться. Якщо воно досягне §G0%§!, [USA.GetNameDef] погодиться не втручатися, і наведені нижче дії стануть недоступними."
 PHI_asia_treaty_faction:0 "Організація Договору Південно-Східної Азії"
 PHI_cobalt_supremacy:0 "Кобальтова перевага"
 PHI_eisenhower_stays_tt:0 "§YДуайт Д. Айзенгауер§! залишиться на Філіппінах і більше не може бути відкликаний [USA.GetNameDef]"
 PHI_expand_us_bases:0 "Розширити бази США"
 PHI_expand_us_bases_desc:0 "У сучасній війні панує авіація, і це особливо актуально для нашої ситуації на Філіппінах. Безумовно, найпростіший спосіб убезпечити острови — це панування в повітрі, і, що ще краще, це дозволяє нам патрулювати навколишній океан. Щоб краще підготуватися до цих повітряних операцій, нам потрібно кардинально розширити наші авіабази тут."
 PHI_far_east_air_force_desc:0 "Хоча Філіппіни набагато більше звикли до сухопутних і військово-морських сил, ніщо не заважає розширенню їхніх військово-повітряних сил. ВПС Далекого Сходу мають базуватися тут, а наші аеродроми — бути розширеними, щоб дозволити більшій кількості літаків (і більшим літакам) завдавати ударів набагато ближче до баз потенційних загроз."
 PHI_force_unification_tt:0 "Стала §Y$PHI_hispanic_empire_tag$§! шляхом мирного об'єднання"
 PHI_hispanidad_filipina_desc:0 "Попри прірву, створену Війною за незалежність проти Іспанської імперії 1896-1898 років, багато філіппінців все ще вважають себе частиною іспанської діаспори, а триваюча напруженість на материковій частині Іспанії стала предметом певного занепокоєння."
 PHI_if_chinese_immigration_tt:0 "Якщо §Y$PHI_encourage_chinese_immigration$§! було завершено:"
 PHI_japanese_investors_mod:0 "Японські інвестори"
 PHI_juan_sumulong:0 "Juan Sumulong"
 PHI_mandatory_conscription:0 "Обов'язковий призов"
 PHI_manila_tag_democratic_ADJ:0 "Філіппінськ"
 PHI_military_emergency_flag:0 "Оголошено воєнний стан"
 PHI_modify_the_great_depression_dynamic_modifier_tt:0 "Змінює §Y$PHI_the_great_depression_dynamic_modifier$§!:"
 PHI_off_shore_patrol:0 "Повітряний патруль"
 PHI_pearl_of_the_orient_dynamic_modifier_desc:0 "Наша економіка переживає справжній бум, і тепер, не обмежені колоніальним господарем, ми вільні приймати власні рішення і є свідченням економічного процвітання, можливого тут, у Південно-Східній Азії."
 PHI_recovering_economy_dynamic_modifier_desc:0 "Наша економіка почала відновлюватися після попередніх фінансових негараздів, і інвестиції знову почали надходити. Хоча реального зростання ще не спостерігається, ми принаймні повернулися приблизно до того стану, в якому були до початку Великої депресії."
 PHI_ruling_ideology_ideology_drift_tt:0 "Будь-який зсув ідеології буде узгоджуватися з керівною партією"
 PHI_sea_of_cobalt:0 "Кобальтове море"
 PHI_send_a_share_of_THIS_navy_to_ROOT_tt:0 "Надіслати частину [THIS.GetAdjective]ого флоту до [ROOT.GetNameDef]."
 PHI_small_arms_and_artillery_requisition_desc:0 "Хоча найнеобхідніше вже прибуло, щоб належним чином озброїти сили, які ми тут формуємо, нам потрібно реквізувати набагато більше зброї — як великого, так і малого калібру."
 PHI_spanish_refugees:0 "Іспанські біженці"
 PHI_subject_surrender:0 "Підданий... здайся"
 PHI_supreme_commissioner:0 "Верховний комісар"
 PHI_take_pacific_islands_desc:0 "Філіппіни вже є нацією островів, тому потрібно лише трохи уяви, щоб розширити наші законні кордони далі на схід через Тихий океан."
 PHI_the_sun_has_set:0 "Сонце зайшло"
 PHI_traitors_back_home:0 "Зрадники вдома"
 PHI_united_states_asiatic_fleet:0 "Азійський флот Сполучених Штатів"
 PHI_volunteers_to_republicans:0 "Добровольці до Республіканської Іспанії"
 PLAN_COHESION_IMMOBILE_TITLE:0 "§HНерухомі§!"
 POLITICAL_POLITICAL:0 "Політика"
 POLITICS_ELECTION_FREQUENCY:0 "Вибори проводяться раз на $MONTHS|H$ р."
 POL_april_constitution_4:0 "$POL_april_constitution_1$"
 POL_april_constitution_fas_2:0 "$POL_april_constitution_fas$"
 POL_army_modernisation:0 "Модернізація армії"
 POL_attract_foreign_motors:0 "Залучити зарубіжні автомобільні компанії"
 POL_attract_foreign_motors_desc:0 "Хоча дехто наполягає, що саме за оригінальними розробками LRL лежить майбутнє польської моторизованої техніки, залишається питання: навіщо нам вигадувати велосипед, якщо ми можемо його просто переналагодити? Іноземні автомобільні компанії опанували мистецтво робити матеріали дешевшими та твердішими, тому було б розумно запросити їх розробляти обладнання для нас!"
 POL_baltic_ultimatums_desc:0 "Після того, як ми розібралися з Литвою, все, що залишилося, — це залучити до нашої зростаючої імперії найпівнічніших колишніх членів Речі Посполитої. Ми сумніваємося, що балти зможуть відхилити наш ультиматум, оскільки їхні нації настільки малі, а армії настільки слабкі."
 POL_claim_greater_lithuania_desc:0 "Литва, яку ми знаємо сьогодні, є лише тінню Великого князівства Литовського, що існувало до неї. Річ Посполита — це не просто союз Польщі та Литви; це союз поляків, литовців, українців та білорусів."
 POL_codify_national_unity_desc:0 "Табір національного єднання представляє спільні інтереси Правої санації та Замку, і до цього часу політика і цілі групи були розпливчастими. Однак ми можемо внести зміни до Квітневої конституції, щоб закріпити наші цінності націоналізму, правопорядку та антикомунізму у фундаменті нашої республіки."
 POL_coerce_czechoslovakia_desc:0 "Чехи і словаки є братами Польщі, і захищати їх не лише в наших інтересах, але й є нашим моральним обов'язком."
 POL_complete_plan_west_desc:0 "Польське військове командування задоволене тим, що ми розробили адекватні плани на випадок неминучого конфлікту з німцями та що час плану «Захід» підійшов до кінця."
 POL_completing_miedzymorze_decision:0 "Вже ведуться переговори з іншою країною"
 POL_cv_fighter_equipment_2:0 "PZL.56 Kania Floty"
 POL_cv_nav_bomber_equipment_2_short:0 "Lew Morski Floty"
 POL_diplomatic_mission_to_HUN:0 "Дипломатична місія в державу [HUN.GetNameDef]"
 POL_ease_sanationist_tensions_desc:0 "Багато членів Фронту Морж займають високі військові посади в Санації, і, можливо, нам вдасться переконати їх використати свій політичний капітал для стримування урядових репресій проти страйку, що дасть нам життєво важливий час для розвитку нашого руху в Польщі."
 POL_expand_central_industrial_region_desc:0 "Галичина, як і Краків, була занедбана австрійцями, які колись тут правили. Але тепер, коли вона знову в польських руках, ми можемо виділити для неї інвестиції в так потрібну їй модернізацію."
 POL_expand_gdynia_seaport:0 "Розширити порт у Гдині"
 POL_expand_intelligence_idea:0 "Розширення польської розвідки"
 POL_expand_lithuanian_shipyards:0 "Розширити литовські верфі"
 POL_foreign_air_support_desc:0 "За допомогою наших союзників ми ще зможемо створити потужні польські ВПС. Закупівля заводів та обладнання — це лише початок польських ВПС у вигнанні!"
 POL_four_year_plan_mission_desc:0 "Чотирирічний план виконується; ми мусимо забезпечити виконання наших обіцянок щодо реформування та індустріалізації країни, якщо ми хочемо належним чином підготуватися до наступних чотирьох років."
 POL_german_training:0 "Німецький військовий штаб"
 POL_habsburg_events.102.a:0 "Час перейти до агресивних переговорів."
 POL_habsburg_pact:0 "Пакт Габсбургів"
 POL_liberalism_focus:0 "$POL_liberalism$"
 POL_light_tank_equipment_1_short:0 "TKS"
 POL_looming_peasants_strike_desc:0 "Розлючені повною відсутністю дій, спрямованих на подолання кричущого зубожіння населення Східної Польщі, селяни готуються до селянського страйку. Якщо не вирішити цю проблему до кінця року, Польща ризикує зіткнутися з небаченими раніше рівнями громадянських заворушень по всій країні."
 POL_lower_class_education:0 "Освіта нижчого класу"
 POL_lower_class_education_idea:0 "Освіта для селянського класу"
 POL_mechanized_equipment_1_short:0 "C4P"
 POL_mechanized_equipment_3:0 "C7P"
 POL_miedzymorze_decisions:0 "Міжмор'я"
 POL_motorized_equipment_1:0 "Polski Fiat 621"
 POL_natdem_party_long:0 "Народно-демократична партія Польщі"
 POL_polish_peoples_republic_desc_alt:0 "Польща вирізняється з-поміж інших країн у [SOV.GetAdjective]ій сфері впливу завдяки своїй відносній індустріалізації та іншій ідеології, тому цілком природно, що ми користуємося вищим ступенем автономії."
 POL_push_home_idea_desc:0 "Підготовка до проникнення та відвоювання батьківщини була зроблена, залишилося лише утримати її під польським контролем достатньо довго, щоб наші союзники прибули і Польща стала такою ж гарною, як і наша."
 POL_restore_the_sejm:0 "Відновити Сейм"
 POL_sanacja_falanga_decisions_desc:0 "Націонал-демократи та фалангісти здобули великий вплив у Другій Речі Посполитій. Надаючи поступки та проводячи загальнонаціональні демонстрації, вплив фашистів може експоненціально розширюватися в польському уряді та серед населення."
 POL_sideline_the_left_desc:0 "За допомогою правих ми зможемо усунути лівих і відштовхнути їх глибше в політичні окраїни нашого суспільства."
 POL_soldier_king:0 "Король-солдат"
 POL_subject:0 "$OVERLORDADJ$а $POL$"
 POL_submarine_3:0 "Клас «Sokół»"
 POL_tac_bomber_equipment_2_short:0 "Miś"
 POL_tac_bomber_equipment_3:0 "PZL.63 Dzik"
 POL_wincenty_kowalski:0 "Вінцентій Ковальський"
 POR_americo_tomas:0 "Амеріку Тумаш"
 POR_antonio_oscar_carmona:0 "Антоніу Ошкар Кармона"
 POR_continue_the_public_works:0 "Продовжити громадські роботи"
 POR_deal_with_fascism_tt:0 "Отримає ціль війни §YАнексія§! проти великих або сусідніх фашистських країн:"
 POR_develop_north_angola_desc:0 "Ми виявили джерело заліза в Північній Анголі, ми повинні побудувати видобувну промисловість, необхідну для експлуатації цього цінного ресурсу."
 POR_ditadura_militar_desc:0 "Нарешті ми маємо підтримку, необхідну для усунення Салазара від влади та відновлення військової диктатури. Ми залишимо Нову державу позаду і вживемо заходів, необхідних Португалії для процвітання в ці доленосні часи."
 POR_empire_neutrality_ADJ:0 "Португальськ"
 POR_estado_novo:0 "Estado Novo"
 POR_iberian_summit_working_together:0 "Іберійські держави працюють разом"
 POR_if_lose_timor_exports_die_tt:0 "§RБуде видалено, якщо ми втратимо власність над областю [721.GetName].§!"
 POR_infantry_equipment_2:0 "Bergmann MP28"
