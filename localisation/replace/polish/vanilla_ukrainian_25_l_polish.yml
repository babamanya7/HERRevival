 SOV_relocate_industry_from_leningrad_desc:0 "Евакуація важкого обладнання наших заводів у області [569.GetName] на Урал є величезною справою, але вона необхідна для забезпечення нашого військового виробництва."
 SOV_relocate_industry_lose_control_tt:0 "§RВтрата контролю над областю [FROM.GetName] призведе до того, що заводи зазнають більшої шкоди при переміщенні.§!"
 SOV_restoration_and_development_idea:0 "$SOV_restoration_and_development$"
 SOV_sabotage_behind_enemy_lines_desc:0 "Десятиліття комуністичного безгосподарювання призвели до того, що багато людей розлютилися і розчарувалися в комуністичному уряді. Там, де комуністи все ще чіпляються за владу, ми можемо використати цих людей, щоб прискорити їхню поразку."
 SOV_scout_plane_equipment_1:0 "Р-10"
 SOV_secure_the_administration_mission_tt:0 "---\nКоли громадянська війна почнеться, центристи отримають модифікатори від фокусу §Y$SOV_secure_the_administration$§!."
