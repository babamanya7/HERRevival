 INDUSTRIAL_ORG_QUEUE_SAVE_BUTTON_ENABLED_TOOLTIP:0 "§GНатисніть§!, щоб зберегти чергу рис."
 INDUSTRIAL_ORG_QUEUE_WINDOW_ITEM_DRAGDROP:0 "§GПереміщуйте риси мишею§!, щоби змінити порядок черги."
 INDUSTRIAL_ORG_TOOLTIP_NO_RELEVANT_ORGANISATION:0 "Вам §Rнічого§! призначати до цього типу оснащення."
 INFLUENCE_ABOVE_30_PERCENT:0 "§YКожен член альянсу§! із принаймні 30% впливу:"
 INSHOL_development_loans_netherlands_desc:0 "Ми можемо брати позики у голландських компаній, щоб пришвидшити наші зусилля з індустріалізації. Хоча ми використаємо нашу позицію як колонії, що розвивається, щоб гарантувати низькі відсоткові ставки, нам все одно доведеться платити відсотки."
 INSHOL_dutch_east_indies:0 "Голландська Ост-Індія"
 INSHOL_east_indies_navy:0 "Флот Ост-Індії"
 INSHOL_mountaineers:0 "Гірські стрільці"
 INSHOL_submarines_desc:0 "Протоки Ост-Індії створені для засідок, а підводний човен коштує набагато менше, ніж бойовий корабель, який він відправляє на дно. Сильна підводна складова дозволяє [ROOT.GetAdjective] флоту утримувати морські шляхи та завдавати ударів по ворожих суднах, навіть не показуючись."
 INS_HOL_autonomy_dominion:0 "Домініон Індонезія"
 INS_add_revolution_point_tt:0 "Отримує §Y1§! додаткового посланця ополчення."
 INS_admiral_mas_pardi:0 "Адмірал Мас Парді"
 INS_aluminium_factory:0 "Алюмінієва фабрика Панкалпінанга"
 INS_artillery_equipment_1_short:0 "M23 Vickers"
 INS_autonomy_national_language:0 "Індонезійську мову визнано"
 INS_cannot_become_independent_tt:0 "§W§Y[INS.GetFlag][INS.GetNameDefCap]§! буде §Rназавжди позбавлена можливості стати незалежною§! без іноземного втручання.§!"
 INS_communist_events.3.t:0 "[FROM.GetNameDefCap] впала"
 INS_continue_hybrid_politics_desc:0 "Гібридна політика — необхідне зло. Хоча кінцевою метою є справжня демократія, Індонезія занадто молода та нестабільна, щоб усю владу можна було передати народу. Президент і Парламент продовжуватимуть стримувати один одного, гарантуючи, що жоден з органів не стане надто могутнім."
 INS_deploy_the_kris_desc:0 "Служба індонезійського народу Сулавесі, відома індонезійською як KRIS, є активною групою ополчення та становить більшість присутнього ополчення на Сулавесі та Манадо. Ми маємо залучити їх до офіційної боротьби разом з TKR."
 INS_divert_army_funds_to_navy_desc:0 "Індонезія — це архіпелаг, наша піхота — ніщо без кораблів для її транспортування. Перенаправити фінансування від TKR до нашого нового флоту — це гідна жертва."
 INS_domestic_shipbuilding_desc:0 "Ми не можемо вічно покладатися на захоплені та куплені кораблі, не пройде багато часу, як для нас більше не залишиться голландських кораблів для захоплення. Ми повинні почати будувати власні кораблі завчасно."
 INS_dutch_east_indies_tt:0 "Змінює §Y$INS_dutch_east_indies$§! на:"
 INS_dutch_events.1.b:0 "Наші кораблі підпорядковуватимуться лише Гаазі."
 INS_dutch_investment_rate_50:0 "§YНідерланди§! з імовірністю на §G50%§! більшою обиратимуть фокуси зі спільного дерева"
 INS_embrace_co_prosp_sphere_desc:0 "Ми нарешті поклали край голландському правлінню, і хоча ми просто замінили одного сюзерена іншим, обіцянки економічного процвітання та паназіатства є дуже привабливими. Ми продовжуватимемо допомагати японським військовим зусиллям, щоб гарантувати, що Нідерланди ніколи не спробують повернутися в Індонезію."
 INS_escalate_the_conflict_HOL_desc:0 "$INS_escalate_the_conflict_desc$"
 INS_escalation_has_less_8_tt:0 "Рівень ескалації нижчий за §Y8§!"
 INS_infantry_equipment_3:0 "M3 SMG"
 INS_instigate_chaos_medan_tt:0 "Коли ми проголосимо незалежність, ми отримаємо §Gщитову територію§! на §Y[1049.GetName]§!. Голландська Ост-Індія більше не матиме там щитової території."
 INS_invite_phillipines_decision:0 "$INSHOL_invite_phillipines$"
 INS_japanese_resource_infrastructure:0 "Фінансування спільних військових зусиль"
 INS_leader_of_the_people_advisor:0 "$INS_leader_of_the_people$"
 INS_leaders_cat:0 "Демократичні вибори"
 INS_light_tank_artillery_equipment_3:0 "Pantsergeschut 5"
 INS_limited_war_events.6.desc:0 "Удар [FROM.GetAdjective] застав нас зненацька, і на деякий час ми боялися найгіршого. Але їхній наступ загруз у багнюці. Їхні люди втомилися, лінії постачання довгі, а погрози з Лондона стають слабшими з кожним комюніке. Республіка ще може бути великодушною і запропонувати маріонеткам вихід з цієї ситуації, хоча багато хто скаже, що чиста перемога служить справі краще, ніж зважена."
 INS_loyalist_events.11.a:0 "Ласкаво просимо додому."
 INS_loyalist_events.15.desc:0 "Наша пропозиція була відхилена. Контролери Сінгапуру не бажають розлучатися з островом на будь-яких умовах. Ми запропонували їм все, крім збереження суверенітету, і цього було недостатньо."
 INS_loyalist_events.16.a:0 "Дуже добре, нехай забирають."
 INS_loyalist_events.20.a:0 "Острів нарешті цілий."
 INS_loyalist_events.26.t:0 "[FROM.GetNameDefCap] приймає об'єднання"
 INS_loyalist_events.8.desc:0 "Наш сюзерен надав [FROM.FROM.GetNameDef] дозвіл провести референдум у нашій країні. Агітатори [FROM.FROM.GetAdjective] прибули у великій кількості, і голосування має розпочатися протягом місяця. Питання, поставлене перед нашим народом, просте. Ми хочемо приєднатися до [FROM.FROM.GetNameDef], чи ми хочемо залишитися такими, якими ми є?"
 INS_oil_for_mil:0 "Продати нафту для фінансування розширення військової промисловості"
 INS_peta_explain_tt:0 "Ми зможемо використати хаос окупації, щоб проголосити повну незалежність, якщо [JAP.GetName] відкинуть назад."
 INS_planning_revolution_hq:0 "Ще не створює Революційний штаб"
 INS_political_events.12.desc:0 "Наші війська висадилися в [?event_target:INS_invasion_event_invaded_state.GetName], і перемога на індонезійському фронті неминуча. Нам потрібно вирішити, як ми будемо окупувати Індонезію. Хоча пряма окупація дасть нам необхідні ресурси, це буде дорого і складно. Ми провели переговори з Сукарно, провідним революціонером, і розробили план, згідно з яким ми створимо індонезійську маріонеткову державу, офіційно очолювану частково Сукарно, але під нашим командуванням. Це заспокоїть індонезійських мирних жителів і буде набагато дешевше, ніж повна окупація."
 INS_political_events.5.desc:0 "Сьогодні історична віха для Індонезії. З офіційним завершенням революції прем'єр-міністр [INS.GetLeader] оголосив, що Індонезія проведе свої перші вільні та демократичні вибори. Результат цих виборів матиме тривалий вплив на Індонезію."
 INS_political_events.7.b:0 "Статус-кво має продовжуватися."
 INS_prepare_raiding_bases:0 "Підготовка рейдових баз"
