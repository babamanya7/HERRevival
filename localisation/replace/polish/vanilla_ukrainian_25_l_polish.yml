 NSB_polish_fascist_events.2.desc:0 "Незважаючи на свою позицію [Root.GetAdjective]ої маріонетки, [From.GetNameDef], здається, досі виношує плани на гегемонію в унії. Визнаючи наші претензії на Мемель, [From.GetLeader] пропонує розділити націю так, щоби регіон відійшов під [Root.GetAdjective]ий контроль, а решта країни стала [From.GetAdjective]ою територією."
