 aat_news.100.desc:0 "Після поразки у попередній війні з [SOV.GetAdjective]им урядом, [FIN.GetAdjective]ий народ мобілізувався і готовий повернути втрачені території та звільнити [FIN.GetAdjective]ий та [KAR.GetAdjective]ий народи від іноземного гніту, як духовний спадкоємець [FIN.GetAdjective]ої Війни за незалежність та Війни братніх народів."
