 PER_constitutional_iran_democratic_DEF:0 "Іран"
 PER_constitutional_shah:0 "Реза-шах Пехлеві"
 PER_defensive_maneuvers_modifier_desc:0 "Наші оборонні позиції повинні бути непохитними, як гірський хребет, якщо ми хочемо захистити наші міста від ворога. Наші нововпроваджені оборонні маневри, сподіваємося, утримають ворожі сили на місці!"
 PER_embrace_national_front:0 "На шляху до республіки"
 PER_entice_foreign_investment:0 "Залучити іноземні інвестиції"
 PER_expand_military_facilities_desc:0 "Наразі наша поточна здатність виробляти зброю є вкрай недостатньою. Ми повинні прагнути якнайшвидше розширити наші військові об'єкти, щоб забезпечити, що наша щойно реструктуризована армія оснащена та готова до бою."
 PER_expand_tehran_emam:0 "Сполучення Тегеран – Бандар-Шахпур"
 PER_feat_of_engineering_desc:0 "Ми досягли чогось особливого, завершивши Трансіранську залізницю. Не лише через її величезний масштаб, але й через інженерні дива, необхідні для подолання крутих маршрутів та гірської місцевості [ROOT.GetNonIdeologyName]. Ми повинні пишатися цим інженерним подвигом, здійсненим нашим урядом та запрошеними інженерами."
 PER_foreign_policy_events.4.t:0 "Англо-[SOV.GetAdjective] вторгнення в Іран"
 PER_form_savak:0 "Сформувати САВАК"
 PER_fund_imperial_excellency:0 "Фінансувати імперську досконалість"
 PER_future_of_war_idea:0 "Майбутнє війни"
 PER_generic_communist_revolutionary:0 "Mohammed Reza Mansour"
 PER_great_persian_empire_ADJ:0 "Перськ"
 PER_his_fathers_footsteps:0 "Слідами його батька"
 PER_hormuz_crisis_tt:0 "§YКожна колоніальна держава в Аравії або Перській затоці отримає подію з вимогою вивести війська з територій у регіоні. Якщо вони відмовляться, ми матимемо можливість оголосити їм війну.§!"
 PER_imperial_events.110.a:0 "$PER_imperial_events.80.a$"
 PER_imperial_events.131.desc:0 "На щастя, [SOU.GetAdjective] уряд погодився на нашу пропозицію. Можливо, ми втратили наші північні території, але принаймні ми запобігли продовженню маршу [SOU.GetAdjective] армії..."
 PER_imperial_events.15.t:0 "[FROM.GetNameDefCap] відступає"
 PER_imperial_events.20.a:0 "Сумний день для [PER.GetNameDef]..."
 PER_imperial_events.210.b:0 "Вони ніколи не отримають наших земель."
 PER_imperial_events.70.desc:0 "Сьогодні вранці ми отримали лист, надісланий нам прямо з палацу Са'дабад у Тегерані, [PER.GetNameDef]. Це було повідомлення доброї волі від самого Рези-шаха Пехлеві, який висловив зацікавленість у відвідуванні Берліна з надією покращити стосунки між нашими двома націями. Фюрер прагне підтримувати [PER.GetNameDef] у добрих стосунках. Що нам робити?"
