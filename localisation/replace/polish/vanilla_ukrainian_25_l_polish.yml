 denmark_overlord_events.42.desc:0 "Наші плани встановити повноважного представника, у віданні якого перебуватиме [FROM.GetNameDef], було зірвано впертістю та дурістю данського уряду й народу! Встановлення лояльного до нашої справи уряду дало б змогу зміцнити нашу владу над країною і зблизило б нас."
