 ITA_mobilize_the_railway_guns_dynamic_modifier_tt:0 "§Y$railway_gun_equipment_1$§! та §Y$train_equipment_3$§!: $production_cost_tt$ §G-10.00%§!\n"
 ITA_moschettieri_del_duce_desc_pope:0 "Для власного захисту Його Святість утримує під своїм командуванням загін елітних стрільців. Хоча безпека Святого Отця, звісно, має найвищий пріоритет, цих зразкових солдатів можна також використати для ліпшого вишколу наших регулярних військ, що збільшить їхню ефективність у бою."
