 COMBAT_RESERVES:0 "Резерв — це підкріплення, які поки що не вступили в бій.\n\nЯкщо ширина фронту дозволить, кожен час в бій може спробувати вступити одна з дивізій резерву.\n\nЗ більшою ймовірністю для цього будуть вибиратись з дивізії з порівняно високими показниками підкріплення."
