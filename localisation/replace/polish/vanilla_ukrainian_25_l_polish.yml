 add_to_faction_tt:0 "Додати до альянсу"
 advanced_depth_charges_desc:0 "Метальний пристрій здатний закинути глибинну бомбу досить далеко від корабля і не заважає акустичному пеленгу мети, що значно підвищує точність атак.\n\nУстановка цього модуля на §Yлегкі кораблі§! та §Yкрейсери§! дозволить атакувати ворожі §Yпідводні човни§!."
 advanced_dp_light_battery_desc:0 "Автоматичні скорострільні закриті гармати значно збільшують вогневу міць.\n\nУстановка цього модуля збільшує §Yатаку легких гармат§!, що допомогає в боротьбі з ворожими §Yкораблями прикриття§!. Ці модулі також збільшують §Yпротиповітряну атаку§!.\nУстановка модуля §YДопоміжна батарея§! дає §Yкрейсерам§!, §Yавіаносцям§! або §Yважким кораблям§! невелику §Yатаку легких гармат§! та дозволяє їм уражати другу ціль."
