 GOT_GER_integrated_puppet_economies.01.desc:0 "Німці інвестують у нашу промисловість, щоб покращити військове виробництво та частково інтегрувати нашу економіку. Це безумовно підвищить продуктивність, однак зменшить нашу автономію та незалежність."
