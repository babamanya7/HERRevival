 SMB_a_land_of_mountains_desc:0 "[ROOT.GetName] здавна має тверду традицію використовувати гірську місцевість на свою користь у бою, і майбутнє не буде винятком. Ми — люди, які звикли жити в горах, і ми використаємо наш досвід, щоби здолати всякого гіганта, з яким нам доведеться зіткнутися."
 SMB_air_academy_desc:0 "[SMB_air_academy_desc_key]"
 SMB_air_doctrine_default_desc:0 "Важливо зазначити, що без належної стратегії навіть найкращі пілоти та літаки не зможуть досягти успіху в бою. Війна — це планування, стратегія та максимальне використання індивідуальних сильних сторін нації. Тому ми мусимо докласти значних зусиль для розробки нових доктрин для наших ВПС."
