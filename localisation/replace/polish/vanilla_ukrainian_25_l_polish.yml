 HUN_place_a_habsburg_on_the_spanish_throne:0 "Посадити Габсбурга на іспанський трон"
 HUN_reaffirm_territorial_claims_desc:0 "Слідом за відхиленням Тріанонського договору ми мусимо знову підтвердити свої права на території, яких ми були позбавлені."
 HUN_recon_airplane_focus:0 "Акцент на розвідну авіацію"
 HUN_renew_the_rome_protocols:0 "Поновлення Римських протоколів"
 HUN_responsible_government_desc:0 "За традицією, що склалася, уряд підпорядковувався королю, завдяки чому він ігнорував вимоги народу. Ми змінимо конституцію таким чином, щоб уряд відповідав перед громадянами країни, а не перед королем."
