 unruly_falangist:0 "Некерований фалангіст"
 upgrade_portable_radios_desc:0 "§LЗвичайні засоби радіозв'язку занадто великі і малорухливі, щоб використовувати їх у потайливих операціях. Якщо створити компактні радіостанції та замаскувати їх під звичайні предмети на кшталт портфелів, наші агенти зможуть бути на зв'язку постійно, не порушуючи підозри.§!"
 uruguay_third_republic_democratic:0 "Третя Уругвайська республіка"
 usa.30.t:0 "Вибори до Конгресу"
 usa.31.a:0 "Народ висловився."
 usa.42.desc:0 "Сенатор дав інтерв'ю великій газеті, заявивши, що більше не може підтримувати «дурну та небезпечну» політику президента [USA.GetLeader]. Крім того, він стверджував, що знав кількох інших сенаторів, які думали подібним чином і незабаром покинуть президента."
 usa.43.desc:0 "Під час нещодавніх дебатів щодо податкової реформи представник виголосив розлогу промову про численні недоліки адміністрації. За його словами, жоден правильно мислячий американець не може захотіти підтримувати політику президента, якою б не була його партійна приналежність. \n\nСхоже, що його різкі слова вплинули, оскільки кілька представників, які раніше твердо вважали політику президента [USA.GetLeader], висловили підтримку."
 usa.47.desc:0 "Невеликий скандал, який виник у Білому домі, почав набирати обертів. Після кількох тижнів у ЗМІ повідомлень про те, що дрібний адміністративний чиновник брав хабарі в обмін на вигідні урядові контракти, Комітет Палати представників з питань витрат виконавчої влади почав проводити слухання, щоб визначити, чи знав про це президент. Хоча більшість спостерігачів не вірить, що це призведе до серйозних проблем для президента [USA.GetLeader], це, без сумніву, означатиме, що багатьом прихильникам президента доведеться на деякий час замовкнути."
 usa.65.a:0 "Нагородіть пілота за його відвагу!"
 vatan_ideologue:0 "Ідеолог «Повернення»"
 vichy_french_focus:0 "Дерево фокусів Вішістської Франції"
 volkssturm:0 "Volkssturm"
 war_declaration_rule_major_only:0 "Оголошувач уважається великою державою"
 war_declaration_threat_25:0 "Світова напруженість — принаймні 25%"
 war_escalation_6_tt:0 "§HРівень 6§!\n §YЛіга Націй§!: Ефіопія може надіслати запит на міжнародні бригади\n §YЕфіопія§!: Моральний дух армії посилений, фокус §YМіжнародні бригади§! відкритий\n §YІталія§!: Неспокій у колоніях"
 war_justification.14.d:0 "«[From.GetName] можуть вважати себе більш сучасними і просунутими, ніж ми, але правда полягає в тому, що їхня держава не пройшла таких випробувань, як наша, і вони не готові до загроз, які зараз ясно видно на горизонті. Своєю зневагою до нас і перешкоджанням нам забрати те, що по праву належить нам, вони перетворили нас на одну з цих загроз для себе. Їхня слабка і розділена держава навряд чи зможе протистояти нашим вимогам». \n\nЗнущальна думка про [From.GetName], якої довгий час дотримувалася [ROOT.GetRulingParty], переросла від критики до ворожості. Хоча популярна думка, що [From.GetAdjective]ий народ хоче уникнути війни, [ROOT.GetLeader] стверджує, що вибрані ними лідери спровокували її своєю пихатістю."
 war_justification.206.t:0 "[From.GetLeader] закликає підтримати [ROOT.GetAdjective]их робітників"
 war_justification.215.d:0 "«Національний дух [From.GetAdjective]ого народу сильний, але не всім народам так пощастило. Традиції [ROOT.GetName] були знищені, а законні правителі давно вбиті та поховані, і все це в ім'я ідеї великої марксистської революції. Наш обов'язок — відновити порядок у цьому світі, заведеному на манівці кровожерливими узурпаторами, і утвердити силу [From.GetName] проти цієї загрози».\n\nХоча [From.GetRulingParty] завжди виступала проти комунізму, [ROOT.GetName] стала мішенню особливих нападок в останніх промовах. Побоюючись неминучого переходу своєї нації до наступного етапу історії, вони вже готують превентивну атаку на комунізм [ROOT.GetAdjective]."
 war_justification.219.a:0 "Після таких погроз ми навряд чи зможемо роззброїтися."
 war_propaganda_manga_industry:0 "Друкувати патріотичну та мілітаристську мангу"
