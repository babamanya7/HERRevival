 RAJ_modernizing_navy_dlc_desc:0 "Щоб утвердити себе як регіональну державу, ми повинні модернізувати наш флот, інвестуючи в передові конструкції кораблів, покращену інфраструктуру та стратегічну доктрину, щоб проектувати вплив через моря Азії."
 RAJ_nav_bomber_equipment_2:0 "Fairey Albacore"
 RAJ_procure_the_task_force_desc:0 "Навіть найбільшим кораблям потрібен ескорт, щоб адекватно захистити їх від ворожих суден. Створивши надійну військово-морську оперативну групу, ми можемо забезпечити, що наші лінійні кораблі зможуть виконувати свої основні завдання."
 RAJ_quinine:0 "Хінін"
 RAJ_red_punjab_operation_desc:0 "Наша столиця вразлива до зовнішньої агресії. Ми повинні збільшити її зону безпеки."
