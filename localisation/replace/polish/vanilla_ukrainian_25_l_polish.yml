 GER_operation_panzerfaust_events.10.a:0 "Доведеться прийняти їхні умови"
 GER_operation_sea_lion_desc:0 "Географічне розташування держави [ENG.GetNameDef] виявилося ускладнюючим фактором у наших нинішніх військових діях. Початок повномасштабної наступальної операції як із повітря, так і з моря здається найкращим варіантом дій, щоб нарешті зламати [ENG.GetAdjective]ий дух!"
 GER_opposed_the_monroe_doctrine_good:0 "Виступив проти Доктрини Монро"
 GER_polish_membership_desc:0 "Поляки з підозрою ставляться до всіх своїх сусідів, але вони розуміють: найбільша небезпека нависла над ними зі сходу. Ми запропонуємо їм членство в союзі та можливість разом протистояти отруті, яку розповсюджує навколо себе [GER.GetDanubianMembershipDesc]."
 GER_proletarian_solidarity_desc:0 "Ми витратили багато часу та ресурсів, щоб спрямувати Європу на шлях до комунізму. Хіба не справедливо тепер пожинати плоди наших зусиль?"
 GER_propagandists_swaying_public_opinion_dem:0 "[GER.GetAdjective] пропаганда впливає на громадську думку"
