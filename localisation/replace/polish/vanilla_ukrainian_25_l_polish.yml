 RULE_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA_HOL_AI_DESC:0 "§HНідерландський§! ШІ намагатиметься зберегти демократію, але перемістить свою столицю в Батавію в разі капітуляції, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_HISTORICAL_ARG_AI_DESC:0 "ШІ намагатиметься триматися історичних подій, уникаючи приєднання до війни та поступово налагоджуючи співробітництво зі Сполученим Королівством і США."
