 SUBDOCTRINE_FIGHTER_BOMBERS_DESC:0 "Коли немає потреби в боротьбі з ворожою авіацією, наші винищувачі можуть переключитися на удари по наземних цілях, щоб допомогти армії."
 SUBDOCTRINE_FLYING_BATTERIES:0 "Літаючі батареї"
 SUBDOCTRINE_FLYING_FORTRESSES:0 "Летючі фортеці"
 SUBDOCTRINE_GREAT_WAR_INFANTRY_DESC:0 "Методичний підхід до піхотного бою, що включає атаки з обмеженими цілями з подальшим швидким окопуванням для завзятого утримання захопленої землі."
 SUBDOCTRINE_MOUNTED_INFANTRY_DESC:0 "Щоб модернізувати нашу кавалерію для XX століття, нам потрібна оперативна мобільність по пересіченій місцевості під час руху верхи, та бій у пішому строю за підтримки швидкої, сучасної важкої зброї."
 SUBDOCTRINE_NIGHT_BOMBING:0 "Нічне стратегічне бомбардування"
 SUBDOCTRINE_PARATROOPERS_2_DESC:0 "$paras_combat_drop_desc$"
 SUBDOCTRINE_PEOPLES_WAR_DESC:0 "Воля народу до опору, мобілізована та керована державою, гарантує нашу неминучу перемогу над імперіалізмом та контрреволюцією."
