 CONGO_new_vegetable_produce_markets_desc:0 "Хоча більшість уваги економіки Конго зосереджена на видобутку мінералів та комерційних культурах, ми все ще маємо сильний і здоровий аграрний сектор. Оскільки глобальні продовольчі дефіцити стають все серйознішими, попит на просту їжу ніколи не був таким високим."
 CONGO_societe_generale_de_belgique:0 "Societe Generale de Belgique"
 CONGO_societe_generale_de_belgique_desc:0 "Гігантська компанія, що є серцем багатьох економічних процесів Бельгії. Якщо ми хочемо організаційної та фінансової підтримки для розвитку цілої країни, немає кращої організації, до якої можна звернутися, щоб зміцнити наші інтереси в Конго."
