 tfv_australia.12.t:0 "[From.GetAdjective] блокує регіональні заходи безпеки"
 tfv_australia.21.t:0 "[From.GetNameDefCap] приймає анексію"
 tfv_australia.34.t:0 "[From.GetNameDefCap] відхиляє проєкт співпраці"
 tfv_australia.41.d:0 "Оскільки в колишніх [HOL.GetAdjective]их колоніях панує безлад, очевидно, що державі [INS.GetNameDef], нашому довіреному сусіду, потрібна допомоги, щоб підтримувати свій тяжко здобутий авторитет. Поки вони потребують нашої підтримки, [Root.GetNameDef] підтримує [INS.GetAdjective]ий уряд.\n\nОдного дня [INS.GetNameDef] зможе протистояти європейським колоніальним силам як наш тихоокеанський брат. А доти ми гарантуємо, що вони міцно стоять разом з нами."
 tfv_australia.60.a:0 "У нас насправді немає вибору. За революцію, товариші."
 tfv_canada.2.d:0 "Сьогодні ми підписуємо новий договір, що святкує дружбу та підтримку між державами [Root.GetNameDef] та [From.GetNameDef]. Наші дві країни обіцяють допомагати одна одній у питаннях зовнішньої політики, включаючи оборону нашого континенту.\n\nКоли наші нації працюють разом, іноземні агресори світу не мають жодного шансу проти нас."
 tfv_canada.21.a:0 "Ми станемо світовою силою."
 tfv_raj.21.desc:0 "Бенгалія і раніше страждала від голоду, але цього разу події склалися так, що ситуація стала набагато гіршою, ніж зазвичай. Абсолютно некомпетентна колоніальна адміністрація виявилася абсолютно нездатною — або, можливо, навіть неохочою — адекватно відреагувати на циклон, який знищив значну частину врожаю рису в Бенгалії. Біженці, що прибувають з постраждалих від війни регіонів країни, з кожним днем збільшують попит на продовольство, тим часом як його пропозиція зменшується.\n\nЦіни на продукти харчування різко зросли; це призводить до того, що люди залишаються без роботи, яка більше не платить достатньо, щоби прогодувати їхні сім'ї. Кількість призовників до армії також значно скоротилася, оскільки дедалі більше людей відмовляються залишати свої домівки, щоби воювати за уряд, який не робить нічого, щоби їм допомогти."
 tfv_raj.30.a:0 "Покінчимо з Британською імперією раз і назавжди."
 tfv_south_africa.75.d:0 "Звільнившися з-під влади колоніальних гнобителів, [DJI.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [DJI.GetAdjective]ого уряду."
 tfv_south_africa.76.t:0 "Свобода для держави [SOM.GetName]"
 tfv_south_africa.89.d:0 "Звільнившися з-під влади колоніальних гнобителів, [GHA.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [GHA.GetAdjective]ого уряду."
 tfv_south_africa.96.d:0 "Звільнившися з-під влади колоніальних гнобителів, [SEN.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [SEN.GetAdjective]ого уряду."
