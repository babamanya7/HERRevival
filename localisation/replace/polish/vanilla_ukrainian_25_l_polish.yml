 country_capitulated.0.d_positive_collab_diff_ideology:0 "\n[Root.GetNameDef] оголосили про свою повну капітуляцію перед [From.From.GetNameDef]. [From.From.GetAdjective]і сили разом з рядом незалежних [Root.GetAdjective]их прихильників ідеології [From.From.GetRulingIdeology] та глави держави, [Root.GetLeader], змусили [Root.GetLeader] та його уряд до вигнання, оскільки було створено новий уряд, який керуватиме [Root.GetNameDef] у співпраці з [From.From.GetNameDef]. [From.From.GetLeader] зауважив, що ця взаємна угода принесе нову епоху процвітання і співпраці для [Root.GetNameDef].\n[Root.GetLeader] відповів, що навіть у вигнанні він продовжуватиме боротися за [Root.GetNameDef] і підтримуватиме всі зусилля опору на своїй батьківщині."
