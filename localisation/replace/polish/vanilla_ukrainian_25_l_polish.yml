 ENG_anti_non_contact_committee:0 "Комітет із безконтактних мін"
 ENG_battle_cruiser_2_desc:0 "Princess Royal — це клас гіпотетичних лінійних крейсерів, які були швидшою та дешевшою версією лінійних кораблів класу «King George V». Ці судна мали подібне, але зменшене озброєння як для надводного, так і для протиповітряного бою: дві потрійні 14-дюймові гармати та шість здвоєних 5,25-дюймових зенітних гармат. Їхня швидка швидкість і великий радіус дії забезпечили б Королівському флоту можливість швидкого удару та захисту конвою, але їх обмежена броня виявилася б проблематичною, якщо б їм довелося битися з сучасними лінкорами."
 ENG_battleship_3_desc:0 "Лінкори типу «Lion» були наступним класом лінкорів «King George V» і мали багато їхніх особливостей. У рамках Військово-морської програми 1938 року було замовлено шість кораблів для заміни застарілих лінійних кораблів класу «Revenge», але жоден не був закінчений через вибух бойових дій. Кораблі мали бути загалом подібними до кораблів класу «King George», але основне озброєння було б важчим, з новою 16-дюймовою гарматою. Вони також мали б товщу броню та потужніші двигуни."
 ENG_blackshirt_march_in_cornwall:0 "Марш чорносорочників у Корнуоллі"
 ENG_blackshirt_march_in_lancashire_desc:0 "Тепер готується великий марш чорносорочників у Ланкаширі. Він, безсумнівно, приверне на нашу сторону місцеве населення."
 ENG_destroyer_2_desc:0 "Есмінці класів «G», «H» та «I» були замовлені в рамках Програм будівництва військово-морських сил 1933 і 1934 років. Загалом вони були повторами попереднього класу «F» із незначним зменшенням розміру. Озброєння в класах «G» й «H» таке ж, як і в класі «F», в обох використовуються гармати калібру 4,7 дюйма. Ці кораблі мали велику дальність, були адекватно озброєні та мали потужний торпедний комплект. Вони активно використовувалися під час війни і зазнали численних втрат."
 ENG_ditched_the_italians_flag:0 "Віддаляється від італійців на користь британців.\n"
 ENG_edmund_ironside:0 "Едмунд Айронсайд"
 ENG_embargo_germany_desc:0 "Переозброєння Німеччини є образою і великою загрозою для миру в усьому світі. Ми не будемо постачати їм ресурси, необхідні для заправки їхньої воєнної машини."
 ENG_england_fascism_ADJ:0 "Англійськ"
 ENG_heavy_tank_artillery_equipment_2:0 "Churchill AVRE"
 ENG_imperial_conscription:0 "Імперський призов"
 ENG_imperialist_south_africa_fascism_DEF:0 "Імперіалістична Південна Африка"
 ENG_impose_martial_law_on_british_raj_desc:0 "Народ Індії введений в оману, і його потрібно захистити від самого себе. Ми відкриємо йому очі і візьмемо владу у свої руки."
 ENG_impose_martial_law_tt:0 "ШІ не зможе ставати вільним протягом 180 днів."
 ENG_issue_gasmasks:0 "Видати протигази"
 ENG_kickstart_the_war_industry_desc:0 "Час не стоїть на місці, і ми не можемо чекати на природне зростання нашої військової промисловості. Ми мусимо зробити великі інвестиції для швидкого будівництва додаткових заводів, якщо хочемо бути готовими до війни."
 ENG_light_tank_aa_equipment_2_short:0 "Matilda (зеніт.)"
 ENG_medium_tank_artillery_equipment_3_short:0 "Sexton"
 ENG_modern_tank_equipment_1_short:0 "Centurion"
 ENG_norwegian_intervention_desc:0 "Норвезькі рухи проти демократії продовжують набирати силу. Ми мусимо забезпечити відповідність їхньої політики нашим власним інтересам, навіть якщо для цього доведеться застосувати силу."
 ENG_parachute_regiments:0 "Повітряно-десантний навчальний центр"
 ENG_replace_government_in_south_africa_fascism:0 "Установити фашистський уряд у Південній Африці"
 ENG_secure_the_imperial_shipping_routes_desc:0 "Згуртованість нашої колоніальної імперії залежить від нашої здатності захищати торговельне судноплавство, яке пов'язує її воєдино, і спрямовувати нашу силу туди, де це може бути необхідним. Для цього ми завжди покладалися на великий флот легких крейсерів, і ми повинні забезпечити наявність необхідної кількості цих кораблів, щоб мати змогу бути всюди одночасно."
 ENG_support_imperialist_coup_in_south_africa_mission_1_desc:0 "Імперські лоялісти підбурюють до заколоту! Якщо їм це вдасться, вони повалять всю країну в безодню громадянської війни!"
 ENG_tac_bomber_equipment_3:0 "de Havilland Mosquito B"
 ENG_tackle_capitalism_desc:0 "Капіталізм — найлютіший ворог робітничої справи, і ми не можемо сидіти склавши руки, поки він процвітає, навіть за океаном. Ми мусимо готуватися до боротьби з ним у самому його серці."
 ENG_the_one_true_revolution:0 "Єдина істинна революція"
 ENG_towards_indian_independence_desc:0 "Настав час вивести Індію на шлях до незалежності. Ми почнемо поступово передавати державні завдання, збільшуючи їхню автономію, готуючись до повної незалежності."
 ENG_trade_unions_demand_timer:0 "Вимога профспілок виконана в останні 30 днів"
 ENG_unite_the_anglosphere_desc:0 "Спадщина нашої золотої доби — це присутність наших культури та мови по всьому світі. Замість терпіти приниження та невдячність від того, що ці території залишаються незалежними, ми мусимо знову об'єднати їх під нашою владою."
