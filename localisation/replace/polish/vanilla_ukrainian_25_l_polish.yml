 BRA_anaue_desc:0 "Наш рух прийняв фразу народу тупі «Anauê» як бойовий клич. Ця фраза стала уособленням братерства членів руху та їхньої непохитної відданості захисту нашої нації. Anauê!"
 BRA_armored_car_at_equipment:0 "M38 90mm Turret"
