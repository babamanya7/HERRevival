 NAVY_REPAIR_POLICY_SPLIT_DESC:0 "§YДозвіл на відділення§! дозволяє найбільш пошкодженим кораблям відділятися та повертатися на близьку морську базу для ремонту в той час як інша частина оперативної групи продовжує своє завдання.\nВідділені кораблі дуже вразливі до атак під час руху.\nПісля завершення ремонту кораблі повернуться до призначених оперативних груп.\n\nКількість відділених кораблів залежить від установленого пріоритету ремонту, а також пошкоджень кожного окремого корабля."
