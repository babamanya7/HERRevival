 JAP_aichi_organization:0 "$aichi$"
 JAP_akizuki_class_destroyers_desc:0 "Нам потрібні висококласні багатоцільові кораблі-платформи з сильними можливостями протиповітряного прикриття для призначення в наші авіаносні групи та бойові флоти. Таким чином, наші інженери почали працювати над удосконаленням есмінців класу «Югумо», створивши новий клас, який вони називають класом «Акізукі»."
 JAP_amaterasus_aramitama:0 "Зброя арамітами Аматерасу"
 JAP_annex_developed_puppet_decision:0 "Інтегрувати §Y[FROM.GetAdjective]у§! цивільну адміністрацію"
