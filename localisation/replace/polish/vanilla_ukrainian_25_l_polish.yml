 USA_war_plan_crimson_desc:0 "Зараз Канада є нашим дружнім сусідом, але в майбутньому все може змінитися."
 USA_war_plan_gold:0 "Воєнний план «Золотий»"
 USA_war_plan_orange_desc:0 "Для нас немає більшої загрози, ніж імперіалістичні амбіції Японії. Її стрімке розширення в Азії та на Тихому океані йде врозріз із нашими споконвічними інтересами."
 USA_war_plan_silver:0 "Воєнний план «Срібний»"
 USA_war_plan_white_desc:0 "Загрозу, яку несе [GetSovietThreatName], не можна залишати поза увагою. Вона є найбільшою небезпекою як зсередини, так і зовні не тільки для нас, але і для всього світу."
