 weather_rain_heavy:0 "Буря"
 wolfpacks_spirit_desc:0 "Тихі морські мисливці."
 wtt_britain.25.a:0 "У нас немає іншого вибору..."
 wtt_china_shared.4.a:0 "Тривожно."
 wtt_germany.1000.a_tt:0 "Принцеса Вікторія Луїза буде направлена заздалегідь для допомоги в підготовці до великої церемонії. Це дещо навантажить ресурси нашого уряду. Будемо сподіватися, що решта королівської родини безпечно дістанеться до [ENG.GetNameDef]...\n"
 wtt_germany.13.d:0 "За нашої підтримки держава [From.GetOldName] взяло він керівну роль відродженні Австро-Угорської імперії. Сьогодні вранці між залученими сторонами було підписано необхідні договори. Уряд знову об'єднаної країни негайно заявив про свою військову підтримку Центральних держав та про входження до цього альянсу."
 wtt_germany.2.d:0 "Після недавніх ексцесів і насильницького видворення з країни багато німців, що залишили батьківщину, збираються під наші прапори. За допомогою досвідчених керівників нам вдалося сформувати з цих рекрутів кілька дивізій, готових битися з нашими ворогами.!"
 wtt_germany.3.t:0 "Німеччина пропонує повернутися Вільгельму II"
 wtt_germany.38.a:0 "Вимогти натомість підтримку фон Фалькенгаузена."
 wtt_germany.41.t:0 "Німеччина погоджується на переговори щодо Ціндао"
 wtt_germany.57.a:0 "Яка чудова ідея! Ми збережемо їх."
 wtt_germany.57.t:0 "Польща пропонує повернути німецькі території"
 wtt_germany.7.t:0 "Неконтрольована економічна залежність від держави [From.GetName]"
 wtt_hanoi_route.1.t:0 "Ханойський маршрут закрито"
 wtt_japan.1.a:0 "Час прийняти японське панування на Сході."
 wtt_japan.102.desc:0 "[From.GetNameDefCap] дякує нам за повернення Маньчжурії та приймає нашу пропозицію укласти альянс."
 wtt_japan.107.a:0 "Хвала японцям!"
 wtt_japan.11.desc:0 "Незважаючи на зростання тертя між [From.GetAdjective]ими лідерами та державою [Root.GetNameDef], [From.GetAdjective]а аержава знову розпочала переговори про підписання пакту про ненапад. Переваги для нас очевидні, але які переваги для нас — [From.GetAdjective]ої сторони? І чи не пошкодуємо ми про це?"
 wtt_japan.114.t:0 "Демократичні елементи здійснюють переворот"
 wtt_japan.115.a:0 "Ми приєднаємося до наших союзників!"
 wtt_japan.115.t:0 "[From.GetName] нападає на Радянський Союз"
 wtt_japan.116.a:0 "Як вони й мусять."
 wtt_japan.125.desc:0 "Звільнивши Маньчжурію від японців і позбавивши її від поваленого імператора Цін, держава [From.GetNameDef] запропонувала повернути Маньчжурію, стверджуючи, що вона по праву має перейти в [Root.GetAdjective]і руки."
 wtt_news.12.t:0 "Протест проти кайзера призводить до війни"
 wtt_news.23.desc:0 "Започаткована Німеччиною раніше цього тижня операція з анексування Вішістської Франції закінчилася успішно. Німцям вдалося захопити військово-морську базу у Тулоні до того, як французи наказали затопити кораблі. Таким чином, весь військово-морські сили Франції дісталися Німеччині в цілості та безпеці."
 wtt_news.26.desc:0 "В результаті [JAP.GetAdjective]ого тиску [From.GetAdjective]ий уряд оголосив про негайне припинення [From.GetAdjective]ого колоніального правління на архіпелазі Починаючи з цього дня держава [PHI.GetNameDef] отримала суверенітет."
 wtt_news.32.c:0 "Б'ються, наче діти малі..."
 wtt_news.4.desc:0 "Незважаючи на марні спроби опору, уряд Нідерландів поступився переважаючим силам Німеччини. Німецькі війська звільнили старого кайзера з-під його домашнього арешту в Дорні, і після повернення до Берліна він був урочисто оголошений кайзером Німецької імперії.\n\nКайзер вже заприсягся повернути Німеччині її колишню велич, але поки що не зробив жодних заяв щодо політичного курсу своєї країни."
 wtt_news.45.a:0 "Політика Політика ніколи не змінюється."
 wtt_news.56.a:0 "Indivisibiliter ac inseparabiliter!"
 wtt_news.59.a:0 "Необхідний перший крок для виходу на світову арену."
 wtt_political_organisation.11.desc:0 "Наша кампанія з придушення народної підтримки, метою якої є [majority_country.GetLeader], схоже, не увінчалася повним успіхом. Незважаючи на всі наші старання, [majority_country.GetLeader], як і раніше, користується підтримкою більшості громадян області [state.GetName]."
 wtt_prc.20.c:0 "Нам слід піти з материка взагалі."
 wtt_warlord_vs_prc.2.desc:0 "Представник [SOV.GetAdjective]ого уряду повідомив нам про те, що [SOV.GetLeader] відчуває великі сумніви щодо того, що [communist_china.GetLeader] чітко інтерпретує марксистську теорію. У справжню критичну фазу класової боротьби в Китаї ми мусимо не відхилятися від правильного застосування марксистсько-ленінського вчення. Схоже, що Москва вважає, що [warlord.GetLeader] краще розуміє, що необхідно для ширшого поширення ідей комунізму у Китаї. Щодо Москви, то партії краще погодитися на те, щоб її лідером став [warlord.GetLeader], інакше [SOV.GetLeader] обіцяє неприємні наслідки."
 wtt_warlord_vs_prc.34.desc:0 "[From.GetLeader] проігнорував більш рішучі вимоги переказати нам кошти, про які ми домовилися раніше. Він навіть залишив поза увагою вимогу приїхати до Москви для пояснення."
 wtt_xian_incident.5.a:0 "Японці становлять більшу загрозу."
 wuw_GER_civil_war.3.t:0 "Відновлення парамілітарних формувань"
 wuw_GER_diplomacy.118.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що [FROM.GetAdjective] нація підкоряється нашій владі, і це найкраще, бо сил чинити опір у них немає, а боротьба принесе лише руйнування їхній землі та народу."
 wuw_GER_diplomacy.27.t:0 "[FROM.GetNameDefCap] погоджується на спільні дослідження"
 wuw_GER_diplomacy.29.b:0 "Пахне підступом…"
 wuw_GER_diplomacy.39.a:0 "Прекрасно!"
 wuw_GER_diplomacy.62.desc:0 "\nСамовпевнений [FROM.GetLeader] оголосив, що Північний Шлезвіг — це назавжди [FROM.GetAdjective] земля. Війська [FROM.GetNameDefCap] мобілізуються і перекидаються до регіону, щоб стримати можливе вторгнення. Як нам відповісти на цю провокацію?"
 wuw_GER_diplomacy.63.t:0 "[FROM.GetNameDefCap] захоплює [912.GetName]"
 wuw_GER_diplomacy.95.b:0 "Нас приймають за дурнів."
 wuw_GER_diplomacy.95.desc:0 "[FROM.GetAdjective] керівництво запропонувало нам план промислової співпраці. Ідея полягає в спільному розвитку та модернізації виробництва. Чи отримаємо ми з цього вигоду, чи це гра в одні ворота — покаже час."
 wuw_GER_german_politics.01.desc:0 "З поверненням вільних виборів [ROOT.GetAdjective] народ масово йде на дільниці, щоб визначити майбутнє Німеччини. Вулиці наповнені ейфорією, а день виборів сприймається радше як свято, ніж політична подія."
 wuw_GER_monroe.5.desc:0 "До нас надійшли повідомлення, що [FROM.GetAdjective] агенти активно намагаються вплинути на нашу політику. Їхній вплив не є нав’язливим, однак вони підсилюють уже наявні політичні сили та збільшують їхній авторитет у суспільстві."
 wuw_GER_monroe.6.a_tt:0 "Ми відкрито §Gпідтвердимо підтримку§! Доктрини Монро. Якщо Доктрина буде скасована, у нас збережеться шанс отримати §Gгарантії§! від [FROM.GetNameDef]. §Y[GER.GetFlag][GER.GetNameDefCap]§! більше не зможе нас схилити."
 wuw_GER_monroe.7.desc:0 "[FROM.GetNameDef] надіслав нам жорстку ноту. Вони заявляють, що їхні зусилля з дестабілізації Доктрини Монро увінчались успіхом, і що це лише питання часу, коли [USA.GetNameDef] остаточно відмовиться від Доктрини. Вони дають нам останній шанс підтримати їх та зректись Доктрини."
 wuw_GER_monroe.9.desc:0 "Наші зусилля нарешті дали плоди. Лідер [FROM.GetNameDef], [FROM.GetLeader], щойно оголосив про повне скасування Доктрини Монро. Хоча [FROM.GetLeader.GetSheHe] і подає це як негатив, ми знаємо, що багато країн, раніше підпорядкованих Доктрині, лише зрадіють."
 wuw_GER_realpolitik.22.a:0 "Вони не купилися, але ми не здамося!"
 wuw_GER_realpolitik.55.a:0 "Чудовий день!"
 wuw_GER_realpolitik.62.a:0 "Вони — загроза єдності федерації!"
 wuw_GER_reichskommissariats.10.t:0 "Статус Південного Уралу"
 wuw_GER_reichskommissariats.11.a:0 "Фінляндія повинна бути винагороджена"
 wuw_GER_reichskommissariats.12.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.3.t:0 "Керівництво Норвегії"
 wuw_GER_uncertain_future.01.a:0 "Ми повинні діяти швидко!"
 wuw_GER_weltpolitik.16.a:0 "Ми завоюємо світ — разом!"
 wuw_GER_weltpolitik.21.b:0 "Ми повинні це відпустити"
 wuw_GER_weltpolitik.8.desc:0 "[BEL.GetLeader] з [BEL.GetNameDef] погодився на наші вимоги та заявив, що Конго буде негайно передано нам. Неясно, чи погодяться з цим народ і губернатори Конго, але принаймні [BEL.GetAdjective]и піддались."
 wuw_HUN_forcefully_revitalize_the_industries_desc:0 "Нам потрібно дати нашій національній промисловості поштовх, щоб вона оговталася після економічної депресії. Це може зашкодити економіці в короткостроковій перспективі, але в довгостроковій — стане вартісною інвестицією в майбутнє нашої нації."
 wuw_HUN_hold_war_games:0 "Провести військові ігри"
 wuw_HUN_joint_oil_exploitation_company:0 "Спільна компанія з видобутку нафти"
 wuw_HUN_news_events.5.a:0 "Нарешті — король!"
 wuw_HUN_politicize_the_levente_associations_desc:0 "Парамілітарні молодіжні організації Левенте допомагають організувати молодь [ROOT.GetAdjective] та підготувати її до конфліктів. Ми маємо проникнути в ці структури та забезпечити їхню лояльність до нас."
 wuw_HUN_reinstate_the_navy_desc:0 "Після повернення до нас узбережжя, ми повинні зосередити зусилля на відновленні флоту, гідного великої держави."
 wuw_HUN_reviving_the_spirit_of_1848_desc:0 "Угорська революція та війна за незалежність 1848–1849 років була частиною хвилі європейських революцій. Хоча вона не принесла бажаної незалежності, вона започаткувала ідеали, за якими ми живемо й сьогодні. Ми повинні знову розпалити вогонь революції й повалити тиранів!"
 wuw_HUN_reviving_the_spirit_of_1848_tt:0 "Монархічні та фашистські елементи країни підтримають §YМіклоша Горті§! у §Rгромадянській війні§! проти нас!"
 wuw_HUN_the_balkan_pact:0 "Балканський пакт"
 wuw_HUN_the_szekesfehervar_sosto_plant:0 "Завод у Секешфегервар-Шошто"
 wuw_HUN_zrinyi_arty_tt:0 "\nПісля дослідження технології §Y$advanced_medium_tank_chassis$§!:\n"
 ww_BEL_event_diplomatic.13.desc:0 "Ми отримали чудову новину від дипломатів [FROM.GetAdjective]. Вони погоджуються, що наша безпека може бути під загрозою, і що наша армія може не бути достатньою для захисту нашої незалежності. У зв'язку з цим вони запропонували гарантію, яку ми запросили."
 ww_BEL_event_diplomatic.18.t:0 "[FROM.GetNameDefCap] Погоджується"
 ww_BEL_event_diplomatic.20.b:0 "Це виглядає підозріло..."
 ww_BEL_event_diplomatic.33.t:0 "Майбутнє нейтралітету [ROOT.GetAdjective]"
 ww_BEL_event_political.3.b:0 "Обрати рексиста Леона Дегреля, щоб відновити закон та порядок"
 ww_congo.19.t:0 "Конголезьке повстання успішне"
 ww_congo.33.b:0 "Крістоф Гбене має очолити"
 ww_congo.38.desc:0 "Дипломати з [FROM.GetNameDef] повідомили нам, що їхній уряд готовий відмовитися від претензій на [?COG.COG_disputed_colony.GetAdjective] територію, яку ми звільнили. Вони тепер виводять свої війська до новоутворених кордонів у регіоні."
 ww_congo.69.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], відмовився від нашого запрошення до Товариства з розвитку урану, стверджуючи, що їм потрібно зберігати будь-які ядерні програми в таємниці, оскільки витік будь-якої інформації до ворога занадто небезпечний, щоб приймати таку пропозицію."
 ww_congo.8.t:0 "Поява нового середнього класу"
