 JAP_boeitai_category_desc:0 "Оскільки оборонна війна на наших власних землях стає все більш реальною, ми повинні створити Корпус оборони, який можна швидко мобілізувати для захисту наших островів у випадку ворожого вторгнення. Це також стосуватиметься осіб, які зазвичай не підлягають військовій службі за японською призовною системою."
