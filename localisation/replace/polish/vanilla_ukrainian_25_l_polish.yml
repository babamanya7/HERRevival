 DOD_hungary.1.a:0 "Нехай народ висловить своє бажання."
 DOD_hungary.1.desc:0 "Виступаючи з промовою в Будапешті, [HUN.GetLeader] зажадав, щоб його австрійським підданим дозволили повернутися під його опіку. Втім, як жест дружби він публічно зазначив, що австрійський народ має право зробити цей вибір самостійно."
 DOD_hungary.144.t:0 "[From.GetNameDefCap] наполягає на переозброєнні"
 DOD_hungary.160.t:0 "Конкурс на бомбардувальники"
 DOD_hungary.162.desc_tac_refused:0 "Посилаючись на інтереси національної безпеки, [From.GetAdjective] уряд відмовився видати нам ліцензію на виробництво. Ми можемо спробувати щастя де-небудь ще або зайнятися модернізацією наших існуючих літаків як екстрені заходи."
 DOD_hungary.41.desc:0 "Наша недавня відмова від умов Тріанонського договору викликала надзвичайно бурхливий протест з боку держави [From.GetNameDef]. Як нам повідомили, [From.GetLeader] чекає від [From.GetAdjective] військових терміновий план вторгнення. часом, [From.GetAdjective] посол попросив нас уточнити нашу заяву щодо договору, натякаючи, що не відкидає силового варіанта розвитку подій."
 DOD_hungary.60.desc:0 "Останні кілька днів загострили і без того напружені відносини між Угорщиною та Румунією. Угорщина зажадала від Румунії повернути спірні території Трансільванії. Румунія відповіла відмовою. Обидві сторони розпочали мобілізацію своїх армій, і війна в регіоні здається неминучою.\"\n\nМіністр закордонних справ вважає, що ми мусимо підготуватися до інтервенції для захисту наших інтересів у регіоні, а також новина про те, що ми можемо втрутитися в конфлікт, можливо, поверне одну зі сторін за стіл переговорів."
 DOD_hungary.80.b:0 "Звернутися до наших союзників."
 DOD_hungary.80.d:0 "Нас не залякати!"
 DOD_romania.161.t:0 "[FROM.GetNameDefCap] зраджує державу [ROOT.GetNameDef]!"
 DOD_romania.21.desc:0 "Виступаючи перед учасниками Румунсько-[From.GetAdjective] асоціації дружби, [From.GetLeader] оголосив про те, що поточні кордони Румунії є «незмінними та постійними». Він пообіцяв, що його уряд докладе всіх зусиль захисту кордонів, якщо почнеться війна."
 DOD_romania.40.t:0 "Румунія чинить тиск"
 DOD_romania.50.desc:0 "Коли [ROM.GetLeader] публічно зажадав собі право блокувати призначення будь-якого міністра в [HUN.GetAdjective]ому уряді, тому що це входить в інтереси Румунії, більшість дипломатів визнали його слова порожньою пропагандою, розрахованою на жителів його країни.. \n\nМи були здивовані, коли трохи пізніше отримали офіційну ноту з такою ж вимогою.\n\nЗагроза застосувати силу, якщо ми відмовимося виконати цю умову, викликала паніку в нашому генштабі. Верховне командування серйозно сумнівається у тому, що ми зможемо стримати тиск румунської армії."
 DOD_romania.63.desc:0 "У відносинах між Румунією та Югославією вибухнула криза, що відкрила перед нами вигідну можливість. [YUG.GetLeader] відповів відмовою, коли [ROM.GetLeader] зажадав від нього віддати країну. У відповідь [ROM.GetLeader] звернувся до нас із ідеєю розділу Югославії, він запропонував передати нам Словенію та створити незалежну державу Хорватія під нашим контролем."
 DOD_romania.69.desc_ITA:0 "Ми отримали другий ультиматум. Цього разу до вимог додалося схоже по тексту послання від посла держави [ITA.GetNameDef], який підтримав румунський план. Він вимагає, щоби наші війська не заважали окупації Далмації та Чорногорії італійської армії."
 DOD_yugoslavia.2.a:0 "Виконати 25-ту директиву фюрера."
 DOD_yugoslavia.501.a:0 "Весілля — це чудово!"
