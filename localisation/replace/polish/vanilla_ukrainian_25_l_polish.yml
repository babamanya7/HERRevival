 generic.20.d_enemies:0 "Сьогодні від держави [From.GetNameDef] надійшло повідомлення з вимогою, щоб [Root.GetLeader] визнав [From.GetAdjective]ого лідера [From.GetLeader] главою держави і щоб наша держава була реорганізована у щось більш відповідне до бачення [From.GetAdjective]ого уряду. Прийнявши вимоги, ми станемо маріонеткою держави [From.GetNameDef].\n\nХоча ми не хотіли б здавати нашу незалежність нашим ворогам по той бік кордону, у їхньому повідомленні є певний елемент погрози, який наводить нас на думку, що якщо ми не виконаємо їхні вимоги, то незабаром опинимося у стані війни з державою [From.GetNameDef]."
