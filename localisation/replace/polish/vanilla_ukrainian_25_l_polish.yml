 MainInvader192:0 "Настав темний день. Наш ворог вирішив продовжувати просування на нашу територію, незважаючи на їхні втрати та наші вимоги миру. Їхнє небажання дозволити нам закінчити війну та віддати нам їхні ресурси розчаровує, і у нас немає вибору, окрім як продовжувати боротьбу."
