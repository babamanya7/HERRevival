 BUL_military_secrets_sharing:0 "Обмін військовими таємницями"
 BUL_national_industry_01_desc:0 "Ми придбали сучасні інструменти для забезпечення нашого промислового виробництва. Може це лише невеликий крок, але він необхідний на шляху до розвитку сильної національної промисловості."
 BUL_obliterate_the_bolshevik_threat:0 "Усунути загрозу більшовиків"
 BUL_opression_anti_bs_speech_desc:0 "Ми влаштуємо мітинг, де висловимо свій протест $BUL_bs_name_dat$ і свою зневагу до його організації та антиурядової позиції."
