l_polish:
 28_german_name:0 "Ельзас-Лотринген"
 37DescIsPuppet:0 "[FROM.FROM.OWNER.GetNameDef]"
 4801_monarchist_name:0 "Урга"
 AAT_Sweden.11.a:0 "Мабуть, мати у [GER.GetAdjective]ій власності військові комплекси було нехорошою ідеєю."
 AAT_Sweden.21.desc:0 "Враховуючи занепокоєння щодо післявоєнної напруженості між державами-переможницями, [FROM.GetName] стверджує, що ми не повинні повертатися до провальної політики ізольованого нейтралітету, а повинні координувати нашу військову і зовнішню політику в регіоні, щоб краще стримувати агресію в майбутньому."
 AAT_Sweden.25.t:0 "Інвестування в сили спеціальних операцій"
 AAT_Sweden.3.axel_is_leader:0 "Аксель досі добре вправлявся. Нехай залишається."
 AAT_Sweden.33.desc:0 "[FROM.GetAdjectiveCap]ий уряд повідомив нам, що не розглядатиме наші претензії на Борнгольм, стверджуючи, що які би претензії ми не висували, вони вичерпали себе ще багато століть тому. Якщо вони не віддадуть нам острів, ми будемо змушені забрати його силою, як ми це робили століттями раніше."
 AAT_Sweden.37.desc:0 "[DEN.GetAdjectiveCap]ий уряд ослаблений настільки, що більше не в змозі належним чином протистояти концентрованим зусиллям з нашого боку, спрямованим на утвердження нашого панування над ними. Як колись ми були підданими данців, так тепер вони стануть підданими нас. Нам лише потрібно вирішити, що з ними робити, перш ніж висувати ультиматум."
 AAT_Sweden.40.b:0 "Ми ніколи їх не віддамо."
 AAT_Sweden.41.a:0 "Чудово."
 AAT_Sweden.49.desc:0 "Держава [FROM.GetName] відхилила наші вимоги, повністю відкинувши їх. Це кричуще ігнорування наших проблем і водночас загроза для нашої видобувної діяльності. На це може бути лише відповідь."
 AAT_Sweden.9.desc:0 "Рікарда Перссона заарештували, коли він разом із 11 іншими намагався штурмувати Ріксдаг. Його розшукували за контрабанду тютюну, і він був ув'язнений на 2 роки. Ми зв'язалися з ним, де він зараз перебуває, і раді повідомити, що після відбуття покарання він вирішив змінити своє життя й негайно вступив до флоту.\nЙого вище командування побачило в ньому здібну молоду цілеспрямовану людину, і відтоді його просували по службі за його працьовитість і природний талант."
 AAT_Sweden_flashpoints.14.t:0 "[SOV.GetNameDefCap] відмовляється визнавати причетність до Паяли"
 AAT_Sweden_flashpoints.40.a:0 "$AAT_Sweden_flashpoints.31.a$"
 AAT_Sweden_flashpoints.41.b:0 "Наостанок нам слід отримати повне право проходу військ."
 AAT_Sweden_flashpoints.42.desc:0 "Не задовольнившися попередніми поступками з нашого боку, уряд держави [GER.GetNameDef] попросив право проходу військ, щоби зменшити навантаження на свої військові операції в Скандинавії. Очевидно, що це завжди було наміром [GER.GetAdjective]ого уряду, і відмова поступитися останніми залишками нашого нейтралітету буде використана лідером [GER.GetLeader] як виправдання для вторгнення в державу [SWE.GetName]. Однак, якщо ми дозволимо доступ, наші сусіди та вороги держави [GER.GetNameDef], найімовірніше, розцінять нас співучасниками окупації держави [NOR.GetName]."
 AAT_Sweden_flashpoints.52.a:0 "Ми не можемо дозволити цьому наброду знищити нашу державу."
 AAT_Sweden_flashpoints.62.a:0 "Якщо вони не стануть із нами торгувати, ми більше не поважатимемо їхні кордони."
 AAT_Sweden_flashpoints.83.desc:0 "[SWE.GetName] вирішує, що не хоче витрачати власні резервні кошти на придбання Оландських островів."
 AAT_Sweden_nationalists.12.t:0 "Аристократи вітають реформи"
 AAT_Sweden_nationalists.19.desc:0 "Під час таємної зустрічі в королівському палаці, що у [SWE.Capital.GetCapitalVictoryPointName]і, лідери різних націоналістичних рухів зустрілися з монархом, щоби обговорити, як [SWE.GetName] відновить свою колишню славу. Після тривалої дискусії щодо об'єднання всіх рухів у єдиний організм, було вирішено, що коли настане час, король Густав знову заявить про себе, як про дієвого правителя, а не номинального лідера. Король вагався, але зрештою погодився на більш активну роль у політичних справах. Почне він з поїздки по королівству, щоби оцінити підтримку серед народу."
 AAT_Sweden_nationalists.2.t:0 "[FROM.GetNameDefCap] відхиляє пропозицію"
 AAT_Sweden_nationalists.27.desc:0 "Наше вірне маріонеткове утворення, «держава» [FROM.GetName] просить нас розширити їхню зону відповідальності за рахунок територій держави [FIN.GetName]. Так ми перекинемо тягар окупації на іншу державу, що дозволить нам сфокусуватись на важливіших цілях."
 AAT_finland_continuation_war.12.b:0 "Не можна ризикувати спровокувати Радянський Союз!"
 AAT_finland_diplomacy.03.a:0 "Непогано..."
 AAT_finland_kinship_war.04.desc:0 "Останні кілька місяців [FROM.GetAdjective]і війська раз у раз підходили до міст Східної Карелії, щоб знайти способи дестабілізувати регіон і посіяти хаос серед місцевих гарнізонів. Але опір [SOV.GetAdjective]їхніх військ був занадто сильним. \n\nБагатьох фінських агітаторів і бунтівних карелів було заарештовано, депортовано або вони вимушено втекли назад до Фінляндії, не встигнувши спланувати саме повстання. Люди налякані, можливість втрачена."
 AAT_finland_motti_tt:0 "\n§RВідтепер [FROM.GetNameDefCap] зможе використовувати тактику motti на інших осердних областях.§!"
 AAT_finland_political.03.a:0 "Призначити Рісто Рюті, він уже бере на себе обов'язки Калліо!"
 AAT_finland_winter_war.02.t:0 "[ROOT.GetAdjective]і мирні вимоги"
 AAT_nordic_cooperation.5.desc:0 "Наші північні сусіди були досить люб'язні, щоби прийняти наше запрошення інвестувати в нашу економіку. Звісно, вони будуть винагороджені за свою довіру, але, що більш важливо, це дозволить нашій економіці зростати швидшими темпами."
 AAT_nordic_cooperation.7.t:0 "[FROM.GetName] шукає економічне співробітництво"
 AAT_norway.12.desc:0 "Незважаючи на свої попередні обіцянки, уряд, торік сформований Юганом Нюгошволдом, схоже, не лише не зміг виконати свої зобов'язання, але й був пекельно зацікавлений у роззброєнні. Багато членів парламенту вважали, що [ROOT.GetName] має розвивати свою промисловість таким чином, щоб інвестувати в [NOR.GetAdjectiveCap]і збройні сили, що тільки-но зароджуються, з метою стримування іноземної держави від вторгнення.\n\nТаким чином, члени консервативної партії «Праві» ініціювали вотум недовіри. Хоча її голова, промисловець Юган Г. Андресен вже задумувався про відставку, він скористався можливістю повести Норвегію в новому напрямку, представивши себе як прагматичну та ефективну альтернативу мріям Нюгошволда про соціальний прогрес."
 AAT_norway.13.b:0 "[ROOT.GetAdjectiveCap]ий народ ніколи тобі не пробачить, зраднику."
 AAT_norway_communist.3.desc:0 "Незважаючи на нашу спільну історію торгівлі через Баренцове море, [FROM.GetNameDef] не вважає, що її варто відроджувати. Ми повинні спробувати інші шляхи для розвитку наших найпівнічніших берегів."
 AAT_norway_fascist.1.a:0 "[FROM.GetName] приєднається до нас!"
 AAT_norway_fascist.2.desc:0 "Незважаючи на нашу щедру пропозицію, [FROM.GetAdjective]ий уряд повідомив, що він захопить державу [ROOT.GetName], не потребуючи нашої допомоги. Здається, ми залишилися наодинці з нашою місією взяти під контроль уряд держави [ROOT.GetNameDef]."
 AAT_norway_fascist.3.a:0 "Саме час!"
 AAT_norway_news.99.a:0 "Це виходить із-під контролю!"
 AAT_norway_news.99.desc:0 "Незважаючи на те, що більша частина світу ігнорує цей арктичний острів, король Войтек, володар артилерії та престолу, побачив потенціал цього арктичного острова.\n\nЗа допомогою місцевих та новоприбулих білих ведмедів Ян-Маєн заселяється і перетворюється на справжню націю, здатну прийняти будь-який виклик. Це справді видовище, якого не бачили з вікторіанських часів.\n\nСеред його громадян виділяється одна поляризаційна постать, чиє старе ім'я не має значення, але хто відтепер буде відомий як гросадмірал Юган Маєн."
 AAT_norway_rikstanken.6.a:0 "Їхні танки буде не зупинити."
 ABDA_events.4.c:0 "Збалансований підхід. Жоден напрямок атаки не повинен залишатися без захисту."
 ABDA_maintain_strategic_flexibility_spirit:0 "Стратегічна гнучкість"
 ABDA_unified_naval_command_modifier_tt:0 "Змінює §Y$ABDA_supreme_command$§! на:\n §G+10%§! Приріст досвіду кораблів"
 ACTUAL_EQUIPMENT_ENTRY_STRING:0 " - $NAME|Y$ ($NUM|Y$ од.)"
 ADD_FACTION_THEATER_TITLE:0 "§HСтворити новий театр альянсу§!"
 ADVISOR_MASTERY_GAIN_ACTIVE:0 "- Надає $VALUE|+=%2$ £doctrine_mastery §Hмайстерності§!"
 AFG_against_kabul:0 "Проти Кабула"
 AFG_confederation_pak_neutrality_DEF:0 "Афгано-пакистанська конфедерація"
 AFG_eyes_on_the_north_desc:0 "Регіони на півночі багаті ресурсами, які ще не повністю експлуатуються нашими супротивниками. Вкрай необхідно, щоб ми почали необхідну підготовку до потенційної експансії в ці райони. Зміцнення нашої військової присутності та забезпечення ліній постачання будуть вирішальними кроками в цьому процесі."
 AFG_form_the_turkestan_legion_desc:0 "Є багато охочих боротися проти комунізму навіть на світовій арені. Ми повинні організувати тюркські антикомуністичні добровольчі сили, які боротимуться до кінця проти сил, що протистоять Ісламу."
 AFG_generic_american_3:0 "Джон Стівенс"
 AFG_hellmand_altered_adopted_treaty:0 "Афгано-іранська водна угода"
 AFG_industrial_events.12.desc:0 "Недалекоглядний [FROM.GetAdjective] уряд відхилив нашу пропозицію про спільну розробку наших нафтових ресурсів."
 AFG_industrial_events.13.a:0 "Ми пішли на ризик і програли."
 AFG_industrial_events.33.t:0 "[FROM.GetNameDefCap] відмовляється від подальших переговорів"
 AFG_industrial_events.36.desc:0 "[FROM.GetAdjective] уряд погодився скасувати багато змін, які вони внесли в річку Гільменд. Хоча це, безсумнівно, викликало велике обурення до нас, нам вдалося уникнути збройної конфронтації наразі."
 AFG_industrial_events.55.desc:0 "[FROM.GetAdjective] уряд виступив із заявою, засуджуючи нашу окупацію нібито паштунських земель, та вказав, що вони готові звільнити територію силою, якщо це необхідно. Звичайно, вони можуть блефувати, але ми не маємо можливості знати їхні справжні наміри наразі."
 AFG_industrial_events.58.a:0 "Давайте покінчимо з цим конфліктом."
 AFG_invite_waziristan_rebels_tt:0 "Коли розпочнеться §Y[ROOT.GetAdjective] громадянська війна§!, ми отримаємо додаткові §G+10000§! Живої сили"
 AFG_khuddamul_furqan_party_long:0 "Khuddamul Furqan"
 AFG_nationalize_oil:0 "Націоналізувати нафтову промисловість"
 AFG_oil_concessions_category:0 "Нафтові концесії"
 AFG_oil_deal_negotiation_in_progress:0 " Переговори щодо розвитку нафтової галузі тривають"
 AFG_parliamentary_democracy_desc:0 "Політичні переконання короля Захіра-шаха починають проявлятися після років перебування в тіні своїх дядьків. Зрозуміло, що король підтримав би перехід до парламентської демократії, якби серед народу була достатня підтримка таких змін. Однак така радикальна зміна може втягнути країну у громадянську війну з більш традиційними людьми за межами столиці."
 AFG_political_events.02.desc:0 "[FROM.GetNameDefCap] прийняв нашу пропозицію про об'єднання Центральної Азії в єдине політичне утворення під нашим контролем. Здається, після десятиліть нестабільності на наш народ чекає нова ера."
 AFG_political_events.173.b:0 "Військово обдарований $AFG_sardar_shah_wali_khan$."
 AFG_political_events.60.a:0 "Ми приймемо нашу спільну долю!"
 AFG_political_events.71.desc:0 "Попри все, [FROM.GetNameDef] поступилася нашим вимогам щодо перегляду Лінії Дюранда. Під величезним тиском та небажанням ризикувати тривалим конфліктом у регіоні, [FROM.GetAdjective] погодилися перемалювати кордони, визнаючи наше законне право на паштунські землі. Ця дипломатична перемога не лише об'єднує наш народ, але й зміцнює легітимність правління [ROOT.GetLeader]. [ROOT.GetNameDef] стоїть більш об'єднаною та сильнішою, ніж будь-коли."
 AFG_political_events.74.t:0 "[FROM.GetNameDefCap] відхиляє територіальну поступку"
 AFG_political_events.95.a:0 "Це важливо для регіональної безпеки, схвалено."
 AFG_political_events_153_tt:0 "§Y[JAP.GetNonIdeologyName] постачатиме нам зброю та надсилатиме добровольців для допомоги нам, коли розпочнеться громадянська війна.§!"
 AFG_political_influence_major_warning_tt:0 "Якщо [FROM.GetNameDefCap] отримає понад §R40%§! підтримки ідеології, яка не узгоджується з нашою, ми отримаємо можливість втрутитися та, можливо, вторгнутися до них за допомогою рішень §Y$AFG_foreign_intervention_category$§!"
 AFG_proclaim_the_second_afghan_empire:0 "Проголосити Другу Афганську імперію"
 AFG_pursue_our_own_agenda_desc:0 "Міжнародний порядок переписується, оскільки великі держави зіштовхуються між собою. Замість того, щоб прив'язуватися до будь-якої групи, ми повинні скористатися хаосом та переслідувати наші власні зовнішньополітичні цілі."
 AFG_quami_category_desc:0 "$AFG_maintain_quami_desc$"
 AFG_quami_modifier:0 "Куамі"
 AFG_raise_quami:0 "Сформувати нерегулярні війська"
 AFG_reclaim_transoxiana:0 "Повернути Трансоксанію"
 AFG_renounce_the_durand_line:0 "Відмовитися від Лінії Дюранда"
 AFG_request_german_support_tt:0 "Якщо §Y[GER.GetNonIdeologyName]§! прийме нашу пропозицію, вони забезпечать нас зброєю та надішлють добровольців для допомоги нам, коли почнеться громадянська війна. §Y[GER_oskar_von_nidermayer.GetName]§! приєднається до нас як генерал."
 AFG_seek_british_investment:0 "Шукати британські інвестиції"
 AFG_subsistence_economy_modifier_desc:0 "Більшість населення веде сільський спосіб життя, виробляючи лише достатньо їжі для себе та своїх сімей, щоб пережити суворі зимові місяці. Вони мало зацікавлені в зміні свого способу життя заради розгортання прибуткових промислових галузей і навряд чи змінять цю думку, незалежно від того, хто номінально утримує владу в Кабулі."
 AFG_support_king_zahir_desc:0 "Після десятиліть політичної нестабільності, правління короля Захіра-шаха ознаменує початок епохи миру та економічної стабільності для нашої багатостраждальної нації."
 AFG_tanks_organization:0 "Гератські арсенали"
 AFG_towards_an_amanullah_caliphate_desc:0 "$AFG_amunullah_khan$ колись розглядав можливість прийняти титул Халіфа після розпуску Османської імперії, але вирішив відмовитися на користь більш сучасного режиму. Цього разу він вирішив не робити тієї ж помилки, а натомість забезпечить своє місце як лідера ісламського світу."
 AFG_uzbek_scholar:0 "Узбецький учений"
 AGENCY_NAME:0 "Розвідувальне агентство"
 AGGRESSIVE_HIGH:0 "§HНе відступати§!"
 AGRESSIVE_MISSION_WITH_NO_AGGRESSIVENESS:0 "§R£mapicon_unit_no_orders£ Оперативна група $NAME|H$ має наказ §Hне вступати в бій§!.§!"
