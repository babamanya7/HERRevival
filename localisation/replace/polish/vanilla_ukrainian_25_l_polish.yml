 EXILES_RETURNED_TITLE:0 "Наші війська повертаються додому!"
 EXILE_TEMPLATE_DESC:0 "Це — шаблон військ вигнанців держави $COUNTRY|H$. Війська з цим шаблоном братимуть людські ресурси від відповідного уряду у вигнанні."
