 tut_1_1_text_1:0 "Досліджується §LЗброя вогневої підтримки I§!"
 uk_sanction_japan_focus_desc:0 "Японці, схоже, прагнуть створити свою «Велику східноазійську сферу співпроцвітання»; звісно, під своєю гегемонією. Британська імперія є головною перешкодою, разом з колоніями інших західних держав. Вони мусять бути позбавлені доступу до необхідних їм ресурсів."
 uk_spain_focus_desc:0 "Іспанці краще за інших знають про міць Королівських ВМС, але, мабуть, не зайвим буде нагадати..."
