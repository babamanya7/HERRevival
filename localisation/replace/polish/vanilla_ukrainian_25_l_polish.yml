 USA_eliminate_the_southern_threat_desc:0 "Ось уже кілька років поспіль у Мексиці не припиняються заворушення. Неважливо, що станеться раніше — конфлікт переллється через наш кордон або хтось об'єднає країну і відправить армії на північ; ми мусимо захищати наші південні рубежі."
