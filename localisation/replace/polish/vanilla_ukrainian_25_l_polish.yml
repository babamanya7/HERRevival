 MAN_national_cooperation_government_desc:0 "До нас доходять тривожні чутки про те, що японці планують сформувати маріонетковий уряд з інших китайських політиків-простолюдинів. Це недопустимо. Нам потрібні гарантії того, що всі китайські території, захоплені спільно, будуть під владою нашої адміністрації."
