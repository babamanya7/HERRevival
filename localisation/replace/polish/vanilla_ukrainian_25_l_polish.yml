 RULE_OPTION_ASIA_DECOLONIZED_DESC:0 "Усі доступні для звільнення колонізовані нації в Азії будуть створені як вільні та незалежні держави після початку гри."
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC:0 "ШІ спробує відновити демократію в Австрії й утворити Альпійську федерацію."
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI_DESC:0 "Японський ШІ спробує зробити країну комуністичною та сформувати уряд на чолі з Ронохою, очоливши боротьбу проти імперіалізму в Азії, обравши відповідний шлях у дереві національних фокусів."
