 mexico.45.desc2:0 "Американські війська на південному кордоні приведені в стан бойової готовності після того, як недавній [From.GetAdjective]ий напад на американську військову базу біля Панамського каналу застав зненацька більшість спостерігачів. Хоча деякі латиноамериканські експерти попереджали, що [From.GetAdjective] атаки на центральноамериканські держави призведуть до зіткнень з Америкою через протилежні інтереси в цьому регіоні, після захоплення Каналу [USA.GetLeader] наклали ембарго на Мексику, але утрималися від воєнних дій. Такий розвиток подій може допомогти примиритися з агресивним урядом партії [GetRulingPartyLong], або, навпаки, підштовхне до подальших дій."
