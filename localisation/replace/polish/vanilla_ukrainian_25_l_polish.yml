 WW_hungary.108.a:0 "Ми дозволимо це"
 WW_hungary.123.desc:0 "Наші війська перехопили радикального націонал-соціалістичного політика Золтана Бешермені та його прихильників, які маршем ідуть на Будапешт у спробі перевороту, натхненному маршем Муссоліні на Рим. Цей маргінальний діяч, який називає себе «гігантом серед інтелектуальних гігантів і великим угорським поетом з пророчою місією», зібрав навколо себе невдоволених аграріїв під символом Сокири та Хреста й прямує до нашої столиці. Як нам діяти?"
 WW_hungary.15.t:0 "[FROM.GetNameDefCap] передає Воєводину"
 WW_hungary.27.desc:0 "Великий [FROM.GetLeader] з [FROM.GetNameDef] погодився на створення нового військового союзу, зміцнивши зв'язки між нашими державами. Народ вийшов на вулиці святкувати цю історичну подію — початок нової епохи для [ROOT.GetAdjective] держави!"
 WW_hungary.29.desc:0 "Уряд [FROM.GetNameDef] оголосив про намір поновити Прагматичну санкцію 1713 року, фактично знову дозволяючи Габсбургу зайняти престол — всупереч нашим вимогам після Великої війни. Це не дає нам реального приводу до війни, але оскільки вони можуть стати загрозою, можливо, варто трохи натиснути?"
 WW_hungary.39.a:0 "Виправимо помилки Великої війни!"
 WW_hungary.8.desc:0 "[HUN.GetLeader] з [HUN.GetNameDef] звернувся до нас з цікавою пропозицією. Він стверджує, що в обмін на повернення [975.GetName], або як вони це називають — Лайтабаншагу, до [HUN.GetAdjective] рук, вони готові надати нам гарантії незалежності та стати на наш бік, якщо [GER.GetAdjective]и вирішать напасти на нас. Чи варто нам прийняти їхню пропозицію?"
 WW_hungary.86.t:0 "[FROM.GetNameDefCap] організовує повстання в [975.GetName]"
