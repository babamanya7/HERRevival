 rhineland_challenge_met:0 "Райнланд: зустрінуто опір"
 rocket_interceptor_3_desc:0 "Нові техніки приземлення та більш безпечні паливні системи підвищили шанси реактивних перехоплювачів на виживання та успіх завдання. Теоретичний потенціал цих надсучасних літаків нарешті реалізовано."
 sabotage_aluminium:0 "Саботаж видобутку алюмінію"
 saving_private_bryansk_tt:0 "Полоніть ворожого генерала в області [224.GetName]"
 scandinavian_expedition_desc:0 "Ми маємо зробити все, що в наших силах, щоб війна не наближалася до території Франції. Кампанія в Норвегії та Північній Швеції відкриє новий фронт, з яким Німеччині доведеться зважати. Німеччина отримує звідти велику частку своєї сталі, тому, перерізавши лінії постачання, ми зможемо послабити її промисловість."
