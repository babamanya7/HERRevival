 undoing_brest_litowsk_goal_desc:0 "Ганебний Брест-Литовський мир так і не був повністю скасований. Настав час стерти останні частини цієї ганебної сторінки нашої історії."
 united_ma_clique_tag_democratic_ADJ:0 "Хуейськ"
