 AUS_antischluss_category_desc_critical:0 "§RНеминучий§!"
 AUS_ban_dnsap_desc:0 "Зараз у нашій країні існують радикально-праві політичні партії, які становлять реальну загрозу суспільству. Хоча ми раді бачити політичну опозицію, ми все ще повинні гарантувати, що вона буде існувати без ризику для нашої власної безпеки. НСРП заслуговує остаточної заборони, а гріхи Вітчизняного Фронту треба показати населенню!"
