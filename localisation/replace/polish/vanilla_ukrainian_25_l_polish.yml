 SEA_PHI_political_events.11.t:0 "[FROM.GetName] відхиляє торговельну пропозицію"
 SEA_PHI_political_events.13.a:0 "Втрутитися, щоб зупинити комунізм у Південно-Східній Азії"
 SEA_PHI_political_events.40.a:0 "Факел демократії згасає!"
 SEA_PHI_political_events.47.desc:0 "Наші дипломати, відправлені до [FROM.GetNameDef], швидко повернулися після того, як їхній уряд відмовився обіцяти допомогу в наших кроках до незалежності. Хоча вони стверджували, що хочуть нам допомогти, вони не можуть ризикувати втягненням у війну з [ROOT.overlord.GetNameDef]."
 SEA_PHI_political_events.52.desc:0 "Військова ситуація в [USA.GetNameDef] виявилася настільки загрозливою, що надійшов запит на негайне повернення $USA_dwight_d_eisenhower$ додому."
 SEA_PHI_political_events.57.desc.2:0 "$SEA_PHI_political_events.57.desc$ Крім того, нафтові родовища в [371.GetName] тепер налаштовані на виробництво пального для наших сил, щоб підтримати їхню логістику після цього значного придбання."
 SEA_PHI_political_events.62.desc:0 "Наші історичні та культурні зв'язки з [SPR.GetNonIdeologyName] означають, що наш народ уважно стежив за конфліктом там."
 SEA_PRC_faction_events.22.t:0 "[FROM.GetLeader] сварить [ROOT.GetLeader]"
 SEA_PRC_misc_events.17.b:0 "Ми візьмемо своє силою!"
 SEA_PRC_misc_events.18.a:0 "Передати область [326.GetName]"
 SEA_PRC_misc_events.18.desc:0 "Наша делегація до [FROM.GetNameDef] повернулася у пригніченому настрої. Наше прохання до [FROM.GetLeader] передати наші законні території було зустрінуте відмовою та презирством. [ROOT.GetLeader] проклинає як [FROM.GetLeader], так і наших дипломатів за те, що вони не змогли забезпечити те, що належить нам по праву."
 SEA_PRC_misc_events.6.t:0 "Американський журналіст Едгар Сноу бере інтерв'ю у Мао"
 SEA_PRC_request_aid.31.b:0 "Ми можемо виділити трохи"
 SEA_china.11.a:0 "Ми йдемо цим шляхом разом"
 SEA_china.12.t:0 "[FROM.GetNameDefCap] відхиляє наш запит"
 SEA_china.28.t:0 "[FROM.GetName] вимагає підкорення"
 SEA_china_democratic.18.t:0 "[FROM.GetName] повертається до Республіки"
 SEA_china_improvement.1.desc:0 "Сонце сяє, сорочки випрасувані, а черевики начищені. Солдати стоять у рівних шеренгах, слухаючи [ROOT.GetLeader], який прийшов виголосити промову на їхньому випуску. Незабаром випускники будуть на фронті, здобуваючи славу для [ROOT.GetNameDef]."
 SEA_china_improvement.2.t:0 "Викорінення отрути"
 SEA_china_warlords.6.t:0 "[FROM.GetNameDefCap] відхиляє інтеграцію"
 SEA_generic_events.11.b:0 "Це минеться"
 SEA_generic_events.14.b:0 "Забезпечити мирний характер протесту"
 SEA_generic_events.4.t:0 "[GetOppositionPartySupportersName] зривають засідання уряду"
 SEA_imperial_influence_events.450.t:0 "Фракція Цивільного уряду прагне обмежити вплив Флоту"
 SEA_japan.1.d:0 "Військових треба приборкати!"
 SEA_japan_foreign_policy.107.a:0 "Чудово!"
 SEA_japan_foreign_policy.11.desc:0 "Керівництво в [FROM.GetNameDef] прислухалося до голосу розуму і почало виводити свої війська з Тонкіна, щоб дозволити нам створити там зону безпеки, аби гарантувати, що китайські війська не увійдуть на [VIN.GetAdjective]у територію. Перемога за нами!"
 SEA_japan_foreign_policy.129.t:0 "[FROM.GetLeader] погоджується на наші вимоги"
 SEA_japan_foreign_policy.137.a:0 "[ROOT.GetLeader] will gain a good position, so we accept"
 SEA_japan_foreign_policy.139.a:0 "A Great Shame"
 SEA_japan_foreign_policy.32.desc:0 "[FROM.GetAdjective]і дипломати зробили розворот на 180 градусів у своїй зовнішній політиці і тепер заявляють, що бажають тісніше співпрацювати з нами за умови, що ми придушимо комуністичні та антияпонські настрої. У цій угоді є щось підозріле, але, можливо, вона варта ризику?"
 SEA_japan_foreign_policy.44.t:0 "[FROM.GetLeader] відмовляється підписувати пакт"
 SEA_japan_foreign_policy.87.desc:0 "Після того, як Асоціація Конкордія нещодавно погодилася на вимоги Кодоха, це було лише питанням часу. Сьогодні прибула [FROM.GetAdjective]а делегація з документами для сприяння нашій повній інтеграції в їхню націю, що вже було підписано нашими власними делегатами."
 SEA_japan_popup_events.25.desc:0 "Зараз проводяться перші вибори після усунення військових з нашої політики, і люди йдуть використовувати свій голос, щоб керувати майбутнім нації. Вибір наразі стоїть між ліберальною партією Ріккен Мінсейто та більш консервативною Ріккен Сейюкай; обидві нещодавно очолювали Імперський сейм. Бюлетені заповнюються, і незабаром буде визначено переможця."
 SEA_japan_popup_events.33.c:0 "Вони занадто небезпечні, щоб залишати їх живими!"
 SEA_japan_popup_events.35.desc:0 "Наш сюзерен [FROM.GetNameDef] вимагає, щоб наш колоніальний губернатор пішов у відставку на користь Лі Уна, спадкоємця [ROOT.GetAdjective]ого престолу та лояльного до Японської імперії. Це звучить як пропозиція, від якої неможливо відмовитися."
 SEA_japan_popup_events.39.b:0 "Ні, [ROOT.GetLeader] продовжить керувати"
 SEA_japan_popup_events.39.desc:0 "Завдяки інкорпорації нашим об'єднавчим рухом різних соціалістичних течій по всій Японії, буддистський соціалістичний рух на чолі з Гіро Сеноо стрімко зріс, а «Молодіжна ліга відродження буддизму» стала головним рухом для нашої молоді-соціалістів. Тепер радник партії Цудзі Дзюн натиснув на [ROOT.GetLeader] у питанні лідерства, стверджуючи, що державі буде краще з дедалі популярнішим Гіро Сеноо на чолі партії. Чи це правильний шлях до духовного звільнення, а також соціальної та економічної емансипації?"
 SEA_japan_popup_events.4.b:0 "У нас є на думці інші кандидати"
 SEA_japan_popup_events.47.a:0 "На півночі назріває буря..."
 SEA_japan_popup_events.48.a:0 "Надання Токугавам абсолютної влади ще ніколи не призводило до біди"
 SEA_warlords.1.t:0 "Смерть Лю Сяна"
 SEA_warlords.17.desc:0 "$wtt_political_warlord_support.12.desc$"
 SEA_warlords.34.t:0 "Лянгуанський інцидент"
 SEA_warlords.48.t:0 "Південь гуртується проти нас"
 SEA_warlords.53.desc:0 "[FROM.GetLeader] почав контрабандою переправляти зброю та кошти, надані його арміям центральним урядом у Нанкіні, і доставляє їх у наш революційний базовий район різними шляхами, намагаючись підвищити нашу взаємну довіру та зміцнити нас як заклятих ворогів [JAP.GetAdjective]ої влади."
 SEA_warlords.53.t:0 "[FROM.GetLeader] контрабандою переправляє кошти та спорядження для справи"
 SEA_warlords.59.t:0 "Великий похід на північ"
