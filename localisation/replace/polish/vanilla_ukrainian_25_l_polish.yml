 denmark_events.100.desc:0 "Після того, як державою [DEN.GetNameDef] вихором пронеслася революція, нам повідомили, що данський король і його сім'я шукають притулку в нашій країні. Прийняти в себе монарха у вигнанні — нелегке рішення, і нам потрібно ретельно зважити всі варіанти. Чи будемо ми допомагати данському королю? Чи відправимо його шукати далі?"
 denmark_events.201.desc:0 "Король Крістіан X, який правив підданими Данії 35 років і провів країну через найскладніші часи європейської історії, помер уві сні минулої ночі. Замість нього на трон зійде його син Фредерік IX."
 denmark_expansion_event.14.desc:0 "[NOR.GetAdjective]а держава схаменулася і підкорилася нашим вимогам. Держава [SWE.GetNameDef] тепер наша і її ресурси можна пустити на розвиток нашої армії."
