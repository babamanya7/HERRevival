 CHI_secure_the_northern_front:0 "Убезпечити північний фронт"
 CHI_sino_american_cooperative_organization:0 "Китайсько-американська спільна організація"
 CHI_small_arms_expertise:0 "Експертиза стрілецької зброї"
 CHI_start_looking_outwards_tt:0 "Ми зможемо запрошувати вільні азійські країни до нашого альянсу"
 CHI_tac_bomber_equipment_1:0 "CAMCO Type 36"
 CHI_the_freedom_to_abject:0 "Свобода заперечувати"
 CHI_the_hump_sea_hidden:0 "$CHI_the_hump_sea$"
 CHI_tour_the_west_desc:0 "У країні гір і пустель місце стародавнього Шовкового шляху далеке від владних кабінетів. [SOV.GetNameDefCap] поширює свій вплив у цьому регіоні, тому ми переконаємося, що місцеві можновладці знають, куди їм слід звернути свою увагу."
 CHI_tsr_promote_tridemism_desc:0 "Три народні принципи, викладені Сунь Ятсеном, — це націоналізм, демократія та народний добробут. Ми повинні прагнути продовжувати його спадщину, водночас приймаючи наші власні принципи, щоб краще відображати природу нашої держави."
 CHI_uplift_the_mountain_brigades:0 "Підвищити гірські бригади"
 CHI_xian_incident:0 "Сіанський інцидент"
 CHI_zhang_guotao:0 "Чжан Готао"
 CHL_anarchic_society_level_down_tt:0 "§GПослаблює§! ефекти §YНапіванархічного суспільства§!."
 CHL_banco_central_de_chile_desc:0 "Центральний банк Чилі було створено в серпні 1925 року крізь Декрет-закон 486, який також установив монополію банку на випуск банкнот в умовах золотого стандарту. Він був створений під час першого президентського терміну Артуро Алессандрі."
 CHL_bernardo_leighton:0 "Бернардо Лейтон"
 CHL_communist_socialist_party_long:0 "Соціалістична партія Чилі"
 CHL_compania_manufacura_cartones_desc:0 "CMPC — це [CHL.GetAdjective]а целюлозно-паперова компанія зі штаб-квартирою в Сантьяго. Це найбільший виробник паперу в країні, і компанія була заснована в 1920 році в результаті злиття фабрик Cartón del Maipo і Esperanza та об'єднання бізнесмена Луїса Матте Ларраїна і німецького інженера Хермана Еббінггауса."
 CHL_famae_rama_de_artilleria:0 "FAMAE — Rama de Artillería"
 CHL_hispanic_union_democratic_DEF:0 "Федерація іспанських республік"
 CHL_honor_the_legacy_of_caupolican_desc:0 "Кауполікан був токі, який очолив опір свого народу проти іспанських конкістадорів, що вторглися на територію мапуче в шістнадцятому столітті. Ми мусимо намагатися бути гідними таких імен, як Кауполікан і Лаутаро, якщо ми хочемо звільнити наш континент від європейських імперіалістів."
 CHL_host_german_intelligence:0 "Розмістити німецьку розвідку"
 CHL_hosting_german_intel_non_lar_desc:0 "$CHL_hosting_german_intel_lar_desc$"
 CHL_ibanez_foriegn_support_desc:0 "Завдяки величезним обсягам нових кредитів країна може знову повільно рухатися вперед, адже нові гроші надходять до рук наших галузей."
 CHL_ibanez_strengthening_the_carabineros_tt:0 "Ібаньєс здобуде більше дивізій, коли війна за незалежність почнеться."
 CHL_inflitrate_the_carabinieros_desc:0 "Карабінери Чилі мають завдання захищати країну від будь-яких повстанців, до яких зараховують і нас. Якщо ми підемо проти них, це, безсумнівно, призведе до кровопролиття, але якщо ми завоюємо їхню лояльність, вони, безсумнівно, стануть дуже корисним пішаком."
 CHL_invest_in_shipping_desc:0 "Армія — не єдине, для чого може бути корисним море. Оскільки ми є країною, яка значною мірою залежить від торгівлі, а також володіє кількома острівними регіонами, такими як Рапа-Нуї, ми мусимо розширити торговельний флот і інвестувати кошти в розширення судноплавної галузі."
 CHL_liberal_party_long:0 "Ліберальна партія"
 CHL_national_falange_desc:0 "Християнська політична партія «Національна фаланга» — прогресивна та реформістська — відкололася від консервативної партії в 1935 році, і вона більш ніж готова підтримати нашу нинішню політичну коаліцію."
 CHL_new_fatherland_fascism_ADJ:0 "Чилійськ"
 CHL_news_events.2.t:0 "Чилі проголошує відновлення старого Королівства"
 CHL_news_events.4.b:0 "Ми принесемо свободу та процвітання тим, хто цього потребує!"
 CHL_news_events.7.t:0 "[CHL.GetNameDefCap] запроваджує проактивну оборону"
 CHL_orden_el_sol_del_peru:0 "Orden el Sol del Perú"
 CHL_pan_hispanic_rhetoric_3:0 "$CHL_pan_hispanic_rhetoric$"
 CHL_political_events.13.a:0 "Їм не варто турбувати нас знову"
 CHL_political_events.18.desc:0 "У нашій армії багато чоловіків, які готові взяти на себе мантію та відповідальність керувати, а також багато тих, хто готовий боротися до останнього подиху за нашу країну. Через те, що у нас новий президент, нам тепер потрібно обрати наступника Оскара Новоа Фуентеса, який обіймав цю посаду вже майже п'ять років. Хто очолить наші армії як командувач номер один?"
 CHL_political_events.36.t:0 "[FROM.GetNameDefCap] приєднується до Іспанського альянсу"
 CHL_political_events.56.t:0 "[FROM.GetName] поступається нашим вимогам"
 CHL_political_events.60.b:0 "Ми візьмемо це пізніше"
 CHL_political_events.70.c:0 "Хуан Гомес Мільяс"
 CHL_political_events.74.a:0 "Хай живе обраний Монарх Антуан III!"
 CHL_political_events.80.a:0 "Ну, це те, що є..."
 CHL_political_events.81.a:0 "Нам доведеться погодитися"
 CHL_political_events.83.t:0 "Спроба перевороту Антиібаньїстської коаліції"
 CHL_political_events.87.desc:0 "Великий [FROM.GetLeader] з [FROM.GetNameDef] прийняв наше прохання про офіційне приєднання до альянсу, і ми дякуємо йому за це. Ми сильніші разом!"
 CHL_political_events.9.d:0 "Вантажне судно «SS Tolten» йшло поблизу Барнегата, Нью-Джерсі, коли вчора було уражено торпедою, випущеною з німецького підводного човна. Вантажне судно було придбане у Данії, але всі 27 членів екіпажу були чилійцями, з яких вижив лише один. Наш міністр закордонних справ заявив, що не бажає розмовляти зі своїм німецьким колегою, а люди в Сантьяго проводять антинімецькі протести на вулицях. Як ми відповімо на цю ситуацію?"
 CHL_political_events.92.a:0 "Ми надамо титул нашому найкращому!"
 CHL_political_events.92.b:0 "Блискучий молодий офіцер підійде"
 CHL_propose_closer_cooperation_desc:0 "Комуністичні держави в нашому оточенні можуть поділяти нашу ідеологію, але вони розкидані стратегічно та не мають координації. Ми мусимо взяти їх під своє крило і допомогти їм краще орієнтуватися."
 CHL_protect_the_easter_island:0 "Захистити Острів Пасхи"
 CHL_radical_party_in_power:0 "Радикальна партія"
 CHL_reclaiming_quebec_desc:0 "Наші брати-франкофони у Квебеку мусять бути звільнені з пазурів іноземного гноблення та окупації, і ми мусимо плекати їх як наших братів по зброї супротив англомовної гегемонії у світі. Ми мусимо звільнити їх зараз!"
 CHL_royal_mountaineers_desc:0 "Хоча Патагонія може такою і не є, Арауканія безумовно є країною гір і джунглів. Тому король закликав створити корпус королівських альпіністів, які спеціалізуються на боротьбі в цій суворій місцевості."
 CHL_strict_secularism_desc:0 "Церква не має права голосу в політиці і мусить розглядатися повністю відокремлено від неї. Ми мусимо вимагати від наших політиків присяги не приносити свою релігію в парламент."
 CHL_sway_ariosto_hererra_desc:0 "Генерал Аріосто Еррера демонструє сильні антисоціалістичні симпатії, але він не обов'язково лояльний до нас. Було б розумно заручитися його підтримкою та підтримкою його найвідданіших людей, адже такі люди, як він, безумовно, можуть нам знадобитися в наших рядах."
 CHL_the_latin_american_alliance_desc:0 "Хоча пангіспанізм — це те, до чого ми прагнемо і чого домагаємося, на нашому континенті досі є ті, хто хоче приєднатися до нас у боротьбі проти імперіалістичного гноблення, незважаючи на те, що вони є лише латіно. Ми мусимо запросити їх, адже разом латіно сильні."
 CHL_they_shall_not_pass_desc:0 "Нашій країні загрожують не лише наші старі вороги часів Тихоокеанської війни, але й наш великий сусід Аргентина, з яким ми маємо спільний величезний кордон. Якщо ми хочемо мати бодай віддалений шанс в обороні проти них, ми мусимо стримати їх у горах. Вони не пройдуть, і ми ніколи не здамося!"
 CHL_undo_colonialist_occupations_desc:0 "Колоніальні держави надто довго окуповували частини гіспанської Америки, і настав час показати їм, що з нами не варто зв'язуватися. Засилайте армію!"
