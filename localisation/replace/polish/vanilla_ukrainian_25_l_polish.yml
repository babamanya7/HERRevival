 ETH_naval_college_name_historical:0 "Асмерське морське училище"
 ETH_navy_3_dynamic_modifier:0 "Ефіопський флот"
 ETH_organization_of_african_unity_desc:0 "Досі свобода від європейської колонізації розглядалася як питання простого здобуття незалежності. Однак, здається, ми всі все ще є можливими цілями для завоювання в очах багатьох лідерів за межами Африки. Лише об'єднавшись і співпрацюючи, люди Африки можуть сподіватися протистояти тому, щоби знову стати підданими."
 ETH_our_enemys_enemy_tt:0 "Якщо держава погодиться надіслати зброю, [ETH.GetFlag][ETH.GetName] отримає §G1000 піхотного спорядження§! від них."
 ETH_reclaiming_ethiopia:0 "Повернення Ефіопії"
 ETH_recruit_merchant_marines_from_host:0 "Надбати цивільні кораблі"
 ETH_request_italian_equipment_tt:0 "Якщо [ITA.GetFlag][ITA.GetName] погодиться, [ETH.GetFlag][ETH.GetName] отримає §G500 од. $artillery_equipment$§! або §G2500 од. $infantry_equipment_1$§!."
 ETH_resistance_support_progress_flag:0 "Наразі навчає місцевий спротив"
 ETH_restore_the_country:0 "Відновити країну"
 ETH_risk_of_demoralized_ras_tt:0 "§RРизик§! деморалізації расів, якщо Ви наразі контролюєте лише 50% початкової території або менше.\n Це розпочне §Yзавдання§! з повернення країни."
 ETH_road_reform_local_BoP_desc:0 "Дорожня мережа держави [ETH.GetName] все частіше стає бар'єром для подальшого економічного розвитку. Зараз ми маємо політичний вплив, щоб домогтися модернізації доріг, яка принесе користь пересічній людині по всій країні, створивши кращі дороги між містами та селами."
 ETH_state_local_retreat_modifier:0 "Скоординований ефіопський відступ"
 ETH_state_supporting_resistance_modifier:0 "Опір за підтримки Ефіопії"
 ETH_steel_lions:0 "Сталеві леви"
 ETH_support_resistance_decision_desc:0 "Підтримати борців спротиву в поваленні [FROM.Owner.GetAdjective]ого правління."
 ETH_the_capital_victory_parade_desc:0 "Незважаючи на те, що наш великий лідер врятував нас від певного знищення, багато наших людей підозрюють мотиви [ETH.GetLeader] і чекають днів старої імператорської родини. Ми повинні нагадати їм про те, наскільки вони вдячні [ETH.GetLeader], і продемонструвати славне майбутнє, яке чекає на [ETH.GetName]."
 ETH_the_hindenburg_wall_desc:0 "Наш турецький радник $ETH_wehib_pasha$ хоче збудувати навколо міст Харер і Дире-Дава укріплення, подібні до німецьких з останньої війни. Утримування регіону гарантує, що італійці не зможуть з'єднати свої фронти, і забезпечить наш доступ до моря крізь порт у Джібуті."
 ETH_the_italian_language:0 "Італійська мова"
 ETH_the_lion_stands_firm_desc:0 "За словами Лева-переможця з коліна Юдового, Його Імператорська Величність [ETH.GetLeader] показав себе здібним воїном. Ми повинні згуртувати війська, продемонструвавши їм силу їхнього Імператора, коли він бореться поруч із ними та демонструє, що [ITA.GetAdjective]у військову машину можна перемогти."
 EU_scandinavian_expansion_decision:0 "Скандинавська експансія"
