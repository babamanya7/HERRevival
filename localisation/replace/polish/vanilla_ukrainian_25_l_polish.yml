 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "Перебуваючи в довгій тіні Робітничих визвольних ВМС, інші морські держави змушені розробляти інноваційні нові доктрини, щоби зрівнятися з нами"
 ENG_BSA_COMPANY_DESC_HISTORICAL:0 "Королівські заводи боєприпасів не виробляють достатньо стрілецької зброї, але, як і у Великій війні, ми могли би підписати контракт із Birmingham Small Arms Company та розширити її можливості."
