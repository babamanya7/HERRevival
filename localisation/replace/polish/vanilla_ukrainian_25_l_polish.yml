 AUS_makes_demands_desc_56:0 "Наші вимоги до держави [FROM.GetNameDef] були повністю задоволені. [FROM.GetAdjective] негайно передасть нам регіони [39.GetName] і [850.GetName]. Нарешті їх населення знову повернеться до своєї Батьківщини!"
 AUS_news_events.8.b:0 "Габсбург наш!"
 AUS_news_events.9.t:0 "Комуністичний переворот в Австрії"
 AUS_political_events.1.t:0 "Доля Creditanstalt-Bankverein"
 AUS_political_events.112.desc:0 "Сьогодні наші плани зробили ще один крок вперед, [FROM.GetNameDef] та їх уряд погодились підписати пакт про ненапад. Ми продовжуватимемо наші зусилля, щоб ще ближче прив’язати їх до себе. Нехай майбутнє все ще залишається ненаписаним, але це не привід зупинятися зараз."
 AUS_political_events.123.desc:0 "Звістка про те, що Австрія відновила альянс Центральних Держав, дійшла до нас сьогодні вранці. Військовий альянс протримався протягом Великої Війни, але був вимушений піти в історію після падіння більшості провідних членів. [FROM.GetAdjective]ий уряд вирішили знову відродити великий союз, і враховуючи, що ми були частиною її попередньої ітерації, вони вважали за потрібне надіслати нам запрошення."
 AUS_political_events.29.desc:0 "Після тривалих дискусій і численних дебатів, гаранти вирішили не погоджувати наш запит на переозброєння. Не дивлячись на нашу аргументацію, їхня відповідь залишається твердою, навіть незважаючи на очевидний ризик для нашого суверенітету та незалежності."
 AUS_political_events.29.t:0 "Гаранти відхилили звернення щодо переозброєння"
 AUS_political_events.30.b:0 "Ну й бог з ними."
 AUS_political_events.34.desc:0 "Після допомоги легітимному [SPA.GetAdjective]ому уряду перемогти у їхній громадянській війні, ми найменше очікували відшкодування та вдячності, але, здається, ми надто багато сподівалися. Заявляючи, що наша допомога не була значною, [SPA.GetNameDef]е керівництво відкидає ідею, що ми повинні отримати будь-яку компенсацію за надану підтримку."
 AUS_political_events.35.desc:0 "Наша нещодавня співпраця з [GetMilitiaName] мала тривожний побічний ефект. Оскільки організація була легітимована керівництвом країни, [GetMilitiaName] стала сміливішою у своїх діях проти цивільного населення.\n\nЗаворушення всередині країни зросли, оскільки наші люди більше не відчувають себе в безпеці. До нашого керівництва ставляться запитання, чи справді ми контролюємо ситуацію? Може це [GetMilitiaName] контролює нас?"
 AUS_political_events.38_tt:0 "Ви отримаєте Ціль Війни §YЗахоплення через претензії§! проти держави §Y[FROM.FROM.OWNER.GetNameWithFlag]§!"
 AUS_political_events.4.b:0 "Пан Інніцер має право на власну думку."
 AUS_political_events.6.a:0 "Тост за наше партнерство!"
 AUS_political_events.79.a:0 "Чудово!"
 AUS_political_events.90.c:0 "Вінценц Шуми зміг задовольнити більшість виборців!"
 AUS_political_events.98.a:0 "Із такою політикою, їх союз приречений!"
 AUS_reclaiming_yugoslavian_territories_tt:0 "Володар регіонів §Y[102.GetName]§!, §Y[103.GetName]§! і §Y[853.GetName]§! отримає подію '§YУльтиматум від Австрії§!'"
 AUS_resourceful_princess:0 "Винахідлива принцеса"
 AUS_schutzbund_support_desc:0 "Більшість австрійських воєнізованих груп мають націоналістичні, легітимністські чи навіть фашистські політичні плани. Вони небезпричинно частково винні в більшості збройних конфліктів у нашій країні. Хоча Республіканський Шуцбунд (Republikanischer Schutzbund) спричинив чимало проблем, факт залишається фактом: політично ми дуже схожі. Ми повинні залучити їх до нашої справи."
 AUS_seek_international_partners_desc:0 "Якщо ми хочемо бути конкурентоспроможними в повітрі, нам потрібно вчитися у тих, хто нас оточує, як найкраще керувати повітряними силами. Роблячи висновки з дій великих держав і країн, які зіткнулися з подібною боротьбою, ми можемо досягти ще більшого рівня, ніж раніше."
 AUS_the_danubian_federation_category_desc:0 "Ідея об’єднання всіх країн уздовж Дунаю у єдину федерацію існує достатньо довгий час. З нашою поточною позицією здається, що саме ми можемо бути найкращим кандидатом, щоб взяти ініціативу та втілити цю мрію в реальність."
 AUS_the_political_front_desc:0 "Війну виграють не лише на передовій і на полях битв, але й на заводах і вулицях. Зміцнюючи нашу політичну систему, ми можемо переконатися, що навіть якщо станеться найгірше, ми не впадемо в анархію й хаос."
 AUS_treaty_asked_permission_key:0 "Незважаючи на всі наші зусилля зупинити їх, [AUS.GetAdjective]ий уряд дав указ на переозброєння Австрії, що є повним порушенням договору. Ми сподівалися, що до цього не дійде, але, здається, тепер ніщо не завадить їм піти цим шляхом."
 AUS_true_liechtenstein_neutrality:0 "Ліхтенштайн"
 AVERAGE_MEMBER_STRENGTH:0 "Середня міць члена альянсу"
 Antiochia:0 "Антіохія"
 BALTIC_economic_union_1:0 "Балтійський економічний пакт"
 BALTIC_entente_events.6.b:0 "Це виключено!"
 BALTIC_events.18.a:0 "[Root.GetNameDefCap] ніколи не буде комуністичною країною!"
 BALTIC_investments:0 "Балтійські інвестиції"
 BALTIC_red_army_desc:0 "Наша армія повинна складатися тільки з тих, хто бажає захищати соціалізм у державі [Root.GetNameDef] і розповсюджувати його по світу. Досягти цього можна лише відновивши рух [Root.GetAdjective] червоних стрільців."
 BALTIC_request_german_support_desc_default:0 "Нам бракує промислової потужності Німеччини, але, можливо, ми зможемо переконати німецький уряд передати нам обладнання з їхніх запасів, щоби посилити оборону від майбутньої комуністичної загрози зі сходу."
 BAR_ADJ:0 "Баротсейськ"
 BASE_FUEL_CAPACITY:0 "Базова місткість: $NUM|H$"
 BATTLE_DEFENDMOD:0 "Модифікатор захисту"
 BATTLE_LOC:0 "$NAME$: $VALUE1$"
 BBA_african_union_events.10.a:0 "Вони не повинні втручатися в наші справи."
 BBA_african_union_events.15.desc:0 "Організація Африканської Єдності запропонувала угоду про взаємну оборону між державами-членами. Це означає, що напад на будь-якого члена вважатиметься нападом на всіх. Це, ймовірно, відлякає іноземних агресорів та запобігатиме війнам між членами організації."
 BBA_african_union_events.18.b:0 "Можливо, підписання було помилкою."
 BBA_african_union_events.7.desc:0 "Організація Африканської Єдності створила виконавчу раду для управління політичними справами країн-учасниць. Рада складається з представників держав-членів і має на меті спрямовувати внутрішню та зовнішню політику у спільному напрямку. Вступ до неї стане кроком до повної політичної та економічної інтеграції з іншими країнами-членами. Проте, це також означатиме втрату певної частини нашої політичної незалежності."
 BBA_african_union_events.8.t:0 "[FROM.GetNameDefCap] приєднується до Виконавчої ради"
 BBA_ethiopia_anti_colonialism_events.3.desc:0 "[?global.african_supporting_country.GetLeader], лідер держави [?global.african_supporting_country.GetNameDef], успішно провів переговори з [?global.african_colonial_country.GetLeader] від нашого імені. [?global.african_colonial_country.GetLeader] погодився визнати [ROOT.GetAdjective]у незалежність і наказав припинити військові дії між державами [?global.african_colonial_country.GetNameDef] та [ROOT.GetNameDef]. Держава [ROOT.GetNameDef] завжди буде вдячна державі [?global.african_supporting_country.GetNameDef] за допомогу в нашій боротьбі."
 BBA_ethiopia_balance_of_power_events.30.a:0 "Повернення справжнього героя."
 BBA_ethiopia_balance_of_power_events.52.desc:0 "Місцевий владика в області [?ROOT.ETH_bop_state.GetName] планує розширити свою владну базу, а також розширити свої володіння. Це певною мірою буде вигідно для країни в цілому, оскільки він інвестує значні кошти у місцеві виробничі потужності. В той же час, не зупиняючись на цьому, він послаблює контроль центрального уряду над областю [?ROOT.ETH_bop_state.GetName]."
 BBA_ethiopia_communist_events.11.b:0 "Ми не можемо допустити, щоб іноземці дізналися наші тактики."
 BBA_ethiopia_communist_events.17.a:0 "Чудова нагода випробувати нашу техніку."
 BBA_ethiopia_communist_events.18.desc:0 "[SOV.GetNameDefCap] відмовилися надсилати бронетехніку для протидії [ITA.GetAdjective]. Схоже, [SOV.GetAdjective] побоюються ескалації напруги з [ITA.GetAdjective]."
 BBA_ethiopia_communist_events.39.b:0 "Ми переконаємось, що вони більше не становлять загрози."
 BBA_ethiopia_communist_events.51.t:0 "[ETH.GetNameDefCap] пропонує мир"
 BBA_ethiopia_communist_events.52.t:0 "[ETH.GetNameDefCap] розриває зв’язки з [SOV.GetNameDef]"
 BBA_ethiopia_communist_events.60.t:0 "[FROM.GetName] відхиляє мирну пропозицію"
 BBA_ethiopia_exile_events.13.a:0 "Змушує замислитися"
 BBA_ethiopia_exile_events.18.desc:0 "[FROM.GetAdjective]і військово-морські сили люб'язно надав нам одиницю есмінців після обіцянки [FROM.GetLeader] надати державі [ROOT.GetName] військово-морські сили."
 BBA_ethiopia_exile_events.20.desc:0 "Після візиту [ROOT.GetLeader] до [FROM.GetLeader], [FROM.GetName] наказав передати лінкор [ROOT.GetName]. Таким чином, [ROOT.GetNavy] тепер має абсолютно новий флагман. Нам потрібно побудувати ескорт, але з [FROM.GetAdjective]ою допомогою це має бути здійсненним завданням."
 BBA_ethiopia_exile_events.41.desc_offered_compensation:0 "Через те, що [FROM.GetNameDef] дозволив лідеру нашого ворога у вигнанні, [?global.ETH_peace_country.GetLeader], перебувати в [FROM.GetName], [FROM.GetLeader] тепер хоче виступити посередником у конфлікті між [ROOT.GetName] та [?global.ETH_peace_country.GetName]. [FROM.GetLeader] заявляє, що [FROM.GetLeader.GetSheHe] вдалося переконати [?global.ETH_peace_country.GetLeader] піти на незначні поступки [ROOT.GetName] в обмін на мир та можливу майбутню співпрацю."
 BBA_ethiopia_exile_events.48.a:0 "[ROOT.GetLeader] — гарант миру в наш час"
 BBA_ethiopia_exile_events.51.t:0 "Підозрілий інцидент на кордоні"
 BBA_ethiopia_fascist_events.02.t:0 "Самозванець бажає миру"
 BBA_ethiopia_fascist_events.04.b:0 "$BBA_ethiopia_fascist_events.02.b$"
 BBA_ethiopia_fascist_events.20.b:0 "У нас є важливіші речі."
 BBA_italo_ethiopian_war_events.16.desc:0 "Ліга Націй не пішла так далеко, щоби спробувати створити військові сили для боротьби проти держави [ITA.GetName] з державою [ROOT.GetName]. Однак вони закликали країн-членів надіслати війська, щоби допомогти відновити статус-кво. Є ознаки того, що кілька країн організовують експедиції, включаючи такі країни, як [FROM.GetName]. Залишається з'ясувати, чи це лише розмови, чи вони дійсно йдуть нам на допомогу."
 BBA_italy_air_accident.03.desc:0 "Фельдмаршал Італо Бальбо потрапив під дружній вогонь зенітних батарей після помилкової ідентифікації в небі над Лівією. Зумівши зв'язатися з наземними військами й тримаючись осторонь від шквалу вогню, Бальбо переконав екіпаж зенітників припинити вогонь і успішно посадив свій літак. Фельдмаршал був відзначений за хоробрість і спокій у гарячій ситуації."
 BBA_italy_anti_colonialism_events.02.a:0 "Звучить розумно."
 BBA_italy_anti_colonialism_events.03.desc:0 "[FROM.GetAdjective]ий [FROM.GetLeader] погодився на запропоноване нами припинення вогню і готовий дати шанс на мир. Ми можемо нарешті залишити одне з найбільших звірств Муссоліні позаду і почати все спочатку."
 BBA_italy_anti_colonialism_events.05.desc:0 "Уряд держави [FROM.GetName] намагається взяти на себе прямий контроль над нашими територіями та інтегрувати нас у велику [FROM.GetAdjective]у адміністрацію. Як це вплине на наших людей, культуру та традиції, поки що ніхто не знає."
 BBA_italy_bop.1.desc:0 "Ми втратили [?ITA.ITA_lost_core.GetName] на користь ворога! Це, природно, похитнуло віру італійського народу в наші військові зусилля і навіть підняло голоси за мирні переговори. Такий поворот подій багатьох, м'яко кажучи, засмутив, і люди шукають винних, кого завгодно. Ми повинні знову перехопити ініціативу і витіснити ворожі сили з Італії!"
 BBA_italy_communist_events.05.t:0 "Військова співпраця з [FROM.GetAdjective]ою армією"
 BBA_italy_interaction_events.11.t:0 "[ITA.GetName] претендує на чорногорський престол"
 BBA_italy_interaction_events.18.a:0 "Ми на крок ближче до возз'єднання Греції!"
 BBA_italy_interaction_events.19.desc:0 "Грецький уряд сьогодні оголосив, що прийняв нашу пропозицію і розпочне військову співпрацю якнайшвидше в обмін на володіння Додеканеськими островами. Побачимо, куди це нас приведе."
 BBA_italy_interaction_events.40.a:0 "Умови прийнятні"
 BBA_italy_interaction_events.41.t:0 "[FROM.GetName] пропонує нам захист"
 BBA_italy_interaction_events.45.a:0 "Чудово."
 BBA_italy_interaction_events.667.desc:0 "Це великий день не лише для Папства, але й для всього християнства![FROM.GetAdjective]ий лідер, [FROM.GetLeader], мудро вислухав наше прохання і погодився передати [454.GetName] під наше управління. Це призведе до стабільності та процвітання регіону і нового світлого майбутнього для [ROOT.GetName]."
 BBA_italy_interaction_events.7.desc:0 "Італія призначила [MNT.GetLeader] новим головою Національного комітету. Це, безумовно, зміцнить наш режим."
 BBA_italy_missiolinis.03_north.t:0 "Успіх на півночі Ефіопії"
 BBA_italy_missiolinis.122.t:0 "Осоромлення в Греції"
 BBA_italy_missiolinis.13.desc:0 "Муссоліні — в екстазі. Він відкрито хвалиться всім готовим і неготовим слухати про нашу нещодавню перемогу. Він ніколи не сумнівався, що Італія зможе здобути тріумф в Абіссінії, попри різні перешкоди, які нас уповільнили. Ми нарешті помстилися за поразку в Першій італо-абіссінській війні!\n\nДуче назвав завоювання перемогою для фашистської системи та свого уряду, стверджуючи, що італійський народ сильніший і більш єдиний, ніж будь-коли раніше."
 BBA_italy_missiolinis.131.t:0 "Звільнення Тічіно"
 BBA_italy_missiolinis.73.t:0 "ВПС успішно зміцнені"
 BBA_italy_naval_cooperation_programs.08.b:0 "Нам не потрібен [ITA.GetAdjective]ий брухт."
 BBA_italy_naval_cooperation_programs.14.desc:0 "Уряд держави [FROM.GetName] запитав про нашу зацікавленість у придбанні п'яти карликових підводних човнів. Вони мають обмежену придатність до використання, але можуть слугувати нашим потребам і розширити наш флот."
 BBA_italy_naval_cooperation_programs.15.desc:0 "[FROM.GetAdjective]ий флот побачив певні переваги наших карликових підводних човнів і вирішив їх придбати. Це дійсно великий момент як для інженерів нашої країни, так і для нашого флоту."
 BBA_italy_recognize_the_empire.3.t:0 "Імперська відмова"
 BBA_swiss_expansion.19.a:0 "До зброї!"
 BBA_switzerland.15.c:0 "Можливо, [FRA.GetAdjective] агент"
 BBA_switzerland.20.a:0 "Що ж, нехай буде так"
 BBA_switzerland.25.desc:0 "Похмурі новини: [?SWI.SWI_angriest_country.GetName] заявляє про своє зневажливе ставлення до [ROOT.GetNameDef]. Вони проголосили, що ми — справедлива мішень для політичних інтриг і навіть завоювання."
 BBA_switzerland_fascist.4.t:0 "[FROM.GetNameDefCap] відмовили у нашому проханні про розширення"
 BBA_switzerland_fascist.6.desc:0 "Після очевидного успіху [FROM.GetAdjective] окупації [848.GetName], [FROM.GetNameDef] пропонує захистити наші території [SWI_requested_territory.GetAdjective] від нашого імені. \n\nЗвісно, це також означає передачу контролю над регіоном їм, тому ми маємо уважно зважити їхню вірність."
 BBA_switzerland_fascist.6.t:0 "[SWI.GetName] просить розширення своїх територій"
 BEL_GATHERING_STORM_DESC:0 "Бельгія все ще страждає від наслідків Великої війни, значна частина країни досі лежить у руїнах, а глибокі рани залишаються в психіці її народу. Демократичне майбутнє самої нації знаходиться під питанням, оскільки різні фашистські угрупування висувають проти неї звинувачення в корупції.\n\nНа міжнародному рівні Бельгія балансує на тонкому канаті між договірними зобов'язаннями перед тими, хто перетворив країну на поле бою, і турботою про свою безпеку в дедалі неспокійнішому світі."
 BEL_GER_fascism_autonomy_integrated_puppet_DEF:0 "Райхскомісаріат Бельгія"
 BEL_august_borms:0 "Аугуст Бормс"
 BEL_belgian_maginot:0 "Бельгійський Магіно"
 BEL_center_for_advanced_military_studies_desc:0 "Зі збільшенням розмірів армій зростають й вимоги до командування. Ми повинні залишатися попереду і навчати наші командні кадри найсучаснішими стратегічними принципами, підвищуючи їхню здатність у таких сферах, як логістика, управління, контроль і інтеграція комбінованих сил, можливо, враховуючи союзні сили."
 BEL_chasseurs_ardennais_ns:0 "Chasseurs Ardennais"
 BEL_constitutional_crisis:0 "Конституційна криза"
 BEL_contradictions_in_socialism_tt:0 "Отримує військові цілі §Yвимагати спірні території§!  проти країн, які наразі утримують претензії, отримані в результаті цього фокусу."
 BEL_cooperative_cooperation:0 "Кооперативна співпраця"
 BEL_cores_in_gallic_france_cat:0 "Осердні землі в Галльській Франції"
 BEL_corvette_fleet_ns:0 "Флот корветів"
 BEL_dietsland_desc:0 "Наші зусилля щодо захоплення решти нідерландомовних територій Європи увінчалися успіхом, але здається, що не всі наші брати адаптувались до цього нового майбутнього так, як ми очікували. Нам слід нагадати їм про культуру та мову, яку ми ділимо."
 BEL_dissolve_political_parties_desc:0 "Слабкість демократії стала очевидною як нічого більше, ніж розсадник корупції та жадібності. Люди не потребують вибору, вони повинні бути керовані, і лише [ROOT.GetRulingPartyLong] здатні на це."
 BEL_fascism_party:0 "Рекс"
 BEL_fighter_equipment_2_short:0 "R.36"
 BEL_flanders_fascism_DEF:0 "Велика фламандська держава"
 BEL_foreign_plane_purchases:0 "Закупівля іноземних літаків"
 BEL_generic_communist_revolutionary:0 "Жюльєн Лао"
 BEL_hubert_pierlot:0 "Гюбер П'єрло"
 BEL_king_law_freedom_ns_desc:0 "Девіз Бельгії чудово відображає бельгійську психологію. Король — той, хто веде нас до перемоги. Закон — меч, що бореться з хаосом війни. Свобода — для Бельгії та бельгійців."
 BEL_legacy_of_the_belgian_airforce_ns_desc:0 "Бельгія була однією з перших країн, що прийняла авіаційну міць, і наші пілоти билися дуже відважно під час Великої війни. Їхня спадщина була визнана нинішнім поколінням пілотів, які прагнуть йти їхніми слідами."
 BEL_legacy_of_the_great_war_ns_desc:0 "Поля Фландрії стали місцем одних з найзапекліших боїв на Західному фронті, це була територія, яку відчайдушно захищали король Альберт, його хоробрі бельгійські солдати і через жертви наших союзників. Ми повинні вшанувати цю пам'ять і прагнути дотримуватися їхнього прикладу."
 BEL_leon_degrelle:0 "Леон Дегрелль"
 BEL_luxembourg_war_goal_desc:0 "Люксембург має багато спільного з Бельгією: мову, культуру та географію. Природно, ці двоє мусять бути єдині!"
 BEL_mio_trait_high_speed_transport:0 "High Speed Transport"
 BEL_mio_trait_stampe_et_renard:0 "Stampe et Renard"
 BEL_nationalize_the_banks:0 "Націоналізувати банки"
 BEL_poudreries_reunies_de_belgique_desc:0 "Друга за віком збройова компанія в Бельгії, Poudreries спеціалізується на боєприпасах, тому оптимізація їхнього місця в нашій логістичній мережі дасть реальні вибухові результати."
 BEL_railway_expansion_desc:0 "Артерії, що живлять [ROOT.GetAdjective] торгівлю та промисловість, — це залізниці. Коли наша економіка відновлюється, ми повинні забезпечити, щоб інфраструктура йшла в ногу з темпами розвитку."
 BEL_royal_intervention_tt:0 "Король втрутиться, щоб вирішити кризу уряду."
 BEL_royal_military_academy_dynamic_modifier:0 "Королівська військова академія"
 BEL_soviet_guarantee_desc:0 "Незважаючи на наші більш демократичні схильності, ми прийняли соціалістичний шлях і маємо багато чого запропонувати [SOV.GetNameDef]. Якщо ми правильно висловлюємося і дотримуємось їхніх широких дипломатичних підходів, то, можливо, зможемо знайти друга в Російському Ведмеді."
 BEL_the_lost_tribe:0 "Втрачене плем'я"
 BEL_times_gold_reserves_were_spent_tt:0 "Ця дія була повторена §Y[?BEL_gold_reserves_spending]§! разів з можливих §Y4§!"
