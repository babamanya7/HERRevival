 NOR_battleship_focus:0 "Акцент на лінкори"
 NOR_broken_gun_ns_desc:0 "Наша політика зламаної рушниці забезпечить мир і процвітання в державі [NOR.GetName] та не тільки. Ми можемо використати гроші на поліпшення життів наших громадян і показати сусідам, що ми нікому не зашкодимо."
 NOR_convoy_defense:0 "Захист конвоїв"
 NOR_dem_his_integrate_militias:0 "Інтегрувати ополчення"
 NOR_eirik_raudes_land_desc:0 "Абсурдне рішення Гааги в 1933 році має бути скасовано. Як вони сміють дозволити [DEN.GetName] мати землю, яку Ерік Рудий, норвежець, відкрив тисячоліття тому. Лише кілька років тому ми володіли частиною східного узбережжя Гренландії, але незабаром ми заберемо це та багато іншого, спадщина Еріка Рудого продовжиться, коли ми повернемо те, що наше."
 NOR_encourage_recruitment:0 "Заохотити вербування"
 NOR_establish_milorg:0 "Встановити Milorg"
 NOR_exiled_monarchy_to_desc_NONE:0 "Світ дуже відрізняється від того, яким він був у 1905 році. Висхідна норвезька монархія опинилася без країни, де можна було б правити, і без очевидного місця призначення, де можна було б провести своє вигнання. Монархізм у світі незабаром закінчиться."
 NOR_fascist_invasion_of_norway:0 "Фашистське вторгнення до Норвегії"
 NOR_heavy_cruiser_1_desc:0 "The Norge was a coastal defense ship built for Norway in Britain at the turn of the century. Its armament, which centered around two 210mm guns, was comparable to a heavy cruiser, though its size, which displaced just over 4,200 tons, was closer to a light cruiser. Its speed was comparable to a dreadnought battleship. It was one of four coastal defense ships of its era that was still serving the Royal Norwegian Navy at the start of World War II."
