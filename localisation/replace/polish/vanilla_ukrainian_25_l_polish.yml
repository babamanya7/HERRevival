 SIC_the_domain_of_liu_wenhui_desc:0 "Лю Веньхуей, дядько і колишній суперник Лю Сяна, викроїв собі маленьке королівство в провінції Сікан. Спочатку він був губернатором Сичуаню, але був усунутий у 1935 році і відтоді керує Сіканом як фактично незалежною державою, потенційно маючи амбіції об'єднати весь Сікан під своєю владою."
