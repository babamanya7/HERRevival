 election.14.d:0 "[Root.GetName] перебуває у стані війни. Зазвичай у цей час мали б відбутися вибори, але, перебуваючи в епіцентрі важливого конфлікту, багато хто стверджує, що не може дозволити собі витрачати час на політичну кампанію або зміну керівництва, якщо це станеться. Тим часом інші стверджують, що оголошення поточної війни поважною причиною для пропуску виборів — це перший крок до ерозії [Root.GetAdjective]ої демократії. Зрештою, дозволити військовим питанням мати перевагу над впливом народу може бути слизькою стежкою."
 election.2.d:0 "На майбутніх виборах підтримка партії [Root.GetRulingParty] залишається високою, люди довіряють лідерству [Root.GetLeader]. Однак прагнення партії посилити увагу держави [Root.GetName] до військових питань не зовсім популярне серед громадськості, оскільки значна частина громадян вважає це непродуманим джінгоїзмом. Війна ще не дійшла до наших кордонів, і мало хто хотів би, щоби [Root.GetAdjective]ий уряд вдавався до агресивних дій. Співпрацюючи з іншими великими партіями, які поділяють нашу стурбованість безпекою нації, ми все ще зможемо керувати країною після виборів, хоча і зі зменшеною підтримкою."
