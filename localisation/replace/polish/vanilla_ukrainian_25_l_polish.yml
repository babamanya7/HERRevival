 COG_make_use_of_the_british_proposal_in_negotations:0 "Ми зможемо використовувати §YБританську підтримку§! для просування нашої незалежності під час майбутніх переговорів з нашими колоніальними сюзерени, в обмін на права на ресурси в §Y[538.GetName]§! та §Y[890.GetName]§!."
