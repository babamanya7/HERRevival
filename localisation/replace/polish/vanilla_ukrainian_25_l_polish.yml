 lar_appeal_to_overseas_territories.2.desc:0 "Місцевий губернатор Індокитаю офіційно і публічно відмовився навіть розглядати можливість переходу на інший бік для підтримки нашого уряду. У своєму радіозверненні до колонії він оголосив про суворі покарання для будь-якої групи, яка бажає «змінити цей статус своїми одностороннями  і безвіідповідальними діями»."
 lar_appeal_to_overseas_territories.3.t:0 "[This.GetLeader] отримує підтримку Індокитаю"
 lar_appeal_to_overseas_territories.9.t:0 "[This.GetNameDef] отримує підтримку Західної Африки"
 lar_bruneval_raid.1.desc:0 "Надійшли повідомлення про ворожий наліт: невеликий загін противника атакував одну з наших РЛС. Подолавши відчайдушну оборону гарнізону, супротивник ненадовго захопив контроль над РЛС, перш ніж був відкинутий до пляжу негайної затятої контратакою і поспішаючи човни.\n\nРетельний огляд РЛС виявив, що було видалено кілька компонентів, а підрахунок особового складу виявив відсутність одного з радіотехніків, який, можливо, був викрадений ворожими диверсантами."
 lar_communist_uprising_organise_cells:0 "Організувати осередки революціонерів"
 lar_communist_uprising_train_workers_militia_desc:0 "Наш агент організує базову підготовку кількох ретельно відібраних кандидатів, які потім складуть кістяк ополчення."
 lar_decryption_bonus_tech:0 "Бонус до розшифрування"
 lar_fra_join_the_ententes.2.a:0 "Наш альянс став ще сильнішим."
 lar_franco_soviet_treaty.1.b:0 "Ніхто з нас не зможе допомогти іншому."
 lar_intervention_in_greece.2.desc:0 "[From.GetLeader] відправив повідомлення через нашого посла в Римі, висловивши абсолютну підтримку наших поглядів та повну згоду з ними. [From.GetAdjective] армії наказано підготувати плани спільних військових дій проти Греції на випадок, якщо така потреба виникне."
