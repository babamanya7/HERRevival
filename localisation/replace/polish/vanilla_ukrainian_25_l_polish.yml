 IRQ_protector_of_the_gulf_desc:0 "Ми довели себе як надійний союзник західних держав. Можливо, вони будуть готові вийти з регіону в обмін на те, що ми будемо підтримувати безпеку Перської затоки."
 IRQ_purchase_alternative_aricraft_desc:0 "Щоб уникнути надмірної залежності від одного постачальника, ми повинні шукати за межами [ENG.GetAdjective] для постачання літаків для наших зростаючих збройних сил. Багато наших офіцерів виступають за угоду з [ITA.GetAdjective]s."
