 DLC_DESCRIPTION_dlc038:0 "Напишіть нову, захопливу історію Нордичних країн, поки великі держави Європи воюють за майбутнє всього світу. Центральне місце займають нові національні фокуси для Фінляндії, Швеції, Данії та Норвегії. Спеціалізуйте свою збройну промисловість, щоби збільшити її ефективність, а тоді продавайте цю зброю на новому міжнародному ринку."
