 change_leader_rule_manifest_below_35:0 "Маніфест альянсу — нижче 35%"
 chinese_coastal_regions_desc:0 "Ми маємо скористатися своєю перевагою на морі та ізолювати Китай, зайнявши його основні порти. Імператорський генеральний штаб намітив кілька регіонів, які повинні перейти під контроль Японії."
 coastal_defence_fleet_hail_of_fire:0 "Град вогню"
 collaboration_government_train_paramilitary_forces_desc:0 "Наша команда організує та навчає загони, які допоможуть новому уряду підтримувати закон і порядок. Також вони допоможуть охороняти тили, доки не буде організовано новий уряд."
 combined_arms_expert_desc:0 "§LЗдатний поєднувати в собі сильні сторони як бронетехніки, так і піхоти.§!"
 congo_independence_struggle.10.t:0 "[FROM.GetNameDefCap] готові прийняти статус домініону"
 congo_independence_struggle.15.d:0 "Сьогодні лояльні підрозділи Сил Публіки намагались затримати і арештувати лідерів руху за незалежність. Міліція [COG.GetAdjective] втрутилася, і між ними почалась перестрілка. Здається, що дипломатія не вдалася, і ця війна за незалежність офіційно розпочалась."
 congo_independence_struggle.4.d:0 "Ми отримали новину від [BEL.GetName], і вони поставили на нашій незалежності конкретну ціну. Вони нагадують нам про значні капіталовкладення, які вони здійснили в нашу країну, від прокладання величезних залізничних ліній до розвитку гірничодобувних можливостей і загального розширення інфраструктури. \n\nТоді це вважалося частиною їхньої відповідальності перед нами як колоніальним паном і частиною процесу цивілізації нації. Однак зараз вони утримують це як заставу для збереження нашої подальшої лояльності через економічну залежність. \n\nЦіна не є недосяжною, але вона дуже висока, і це збіднить нашу націю в короткостроковій перспективі, залишивши нас залежними від них через борги на значно більший термін. Тепер питання: чи варто це ціною незалежності, чи повинно це бути заплаченою кров'ю?"
 conservative_grandee:0 "Консервативний вельможа"
