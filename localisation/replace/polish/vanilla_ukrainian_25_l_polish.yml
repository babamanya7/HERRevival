 AUS_danubian_unity_desc:0 "Оскільки наша федерація стабільно розвивається, ми повинні переконатися, що ми також не забуваємо про нашу власну країну та внутрішню політику. Наші люди повинні знати про велич, яку принесе їм наш союз!"
