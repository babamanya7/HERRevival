 SWE_coalition_war_cabinet_desc:0 "Нещодавні події в усьому світі сколихнули націю та викликали побоювання щодо поширення конфлікту на [SWE.GetName]. Щоб сприяти почуттю єдності в ці важкі часи, ми створимо коаліційний військовий кабінет з провідних членів основних партії в Ріксдазі."
