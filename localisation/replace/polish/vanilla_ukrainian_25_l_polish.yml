 COG_brown_water_navy_desc:0 "Море для нас не є важливим, але наші величезні річки та озера потребують належного патрулювання, якщо ми хочемо зберегти безпеку нашої нації."
 COG_command_post_goma_desc:0 "Нам потрібно створити командний пункт у Гомі для кращого патрулювання наших північно-східних річок."
