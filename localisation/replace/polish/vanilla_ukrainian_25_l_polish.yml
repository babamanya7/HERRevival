 MEX_focus_xefo:0 "XEFO"
 MEX_heavy_tank_equipment_3_short:0 "VBA-7"
 MEX_manuel_perez_trevino_desc:0 "§LМануель Перес Тревіньйо — революційний генерал, талановитий інженер та артилерист. Також він має політичний вплив, будучи засновником Національно-революційної партії.§!"
 MEX_professional_army_desc:0 "Завдяки військовій школі наші генерали навчилися розробляти ефективні системи постачання та підтримувати війська, які мають боротися з максимальною ефективністю."
