 ITA_comandante_diavolo:0 "Comandante Diavolo"
 ITA_common_ground_bop_tt:0 "§Y$ITA_power_balance$§! зміститься на §Y15%§! у бік §Yпротилежної фракції§!."
 ITA_cooperation_programs_decisions_tt:0 "Відкриває доступ до рішень §Y$ITA_naval_cooperation_programs_dec_cat$§!, які дозволяють співпрацювати з союзниками Італії та іхніми ВМС."
 ITA_cooperatives_for_intensive_exploitation_desc:0 "Африка — багатий континент з великими покладами ресурсів. Ми мусимо інвестувати в удосконалення способів експлуатації цих родовищ, щоб отримати від них максимальну вигоду."
 ITA_corpo_volontari_della_liberta_spawn_divs_capital_tt:0 "Створити §Y2 піхотні§! дивізії в області §Y[THIS.GetName]§!.\n\n"
 ITA_demand_balearic_islands_desc:0 "Довівши свою підтримку новому режиму Франко, ми можемо вимогти, щоб одна з важливих територій, за яку ми боролися, — Балеарські острови — була передана Італії для зміцнення наших стратегічних позицій у Середземному морі."
 ITA_democratic_high_control_range:0 "Панування соціалістів у політиці"
 ITA_end_fiat_ansaldo_duopoly:0 "Покінчити з дуополією «Fiat» і «Ansaldo»"
 ITA_expanded_intelligence_service_basic:0 "Розширена служба розвідки"
 ITA_free_states_of_europe:0 "Вільні держави Європи"
 ITA_gappisti_desc:0 "Ми сформуємо Gruppi di Azione Patriottica — невеликі партизанські загони, які діятимуть переважно в містах, подібно до французького Опору. Наші гаппісти завдаватимуть ворогові сильних ударів поза лінією фронту, деморалізовуючи гарнізони та здобуваючи підтримку місцевих жителів."
 ITA_gw_armored_car_equipment:0 "Fiat AB611"
 ITA_ibrahim_farag_mohammed:0 "Ібрагім Фараг Мохаммед"
 ITA_il_vento_aureo_desc:0 "Протягом тривалого часу папство було пригноблене іноземними силами. Однак ми можемо оптимізувати наші військово-повітряні сили та програми підготовки винищувачів, щоби мати набагато дешевших, але сміливіших пілотів, які з неба обрушать золоте панування Католицької Церкви на наших ворогів. Це буде наш найвеличніший реквієм!"
 ITA_independence_rds_desc:0 "Досить цього поневолення, якому нас піддають наші нібито союзники. Відтепер італійська нація сама вирішуватиме свою долю. Якщо для досягнення цієї мети знову потрібно буде пролити кров, гордий італійський народ буде готовий до цього."
 ITA_industria_della_gomma_sintetica_desc:0 "Наше географічне розташування в самому серці Середземномор'я робить нас унікально вразливими до блокади з боку ворожих держав. Якщо ми хочемо посісти гідне місце у світі, ми мусимо мати можливість підтримувати нашу промисловість без іноземного імпорту."
 ITA_institute_the_five_year_plan:0 "Запровадити п'ятирічний план"
 ITA_italian_dalmatia_name:0 "Далмація"
 ITA_italian_hegemony_master_2:0 "$ITA_italian_hegemony_master_1$"
 ITA_italo_balbo_focus_desc:0 "Нам потрібен здібний військовий лідер, який проведе нас через турбулентні часи, що чекають попереду. Італо Бальбо — не лише військовий лідер; він також герой авіації, який здійснив кілька дипломатичних місій і досить ефективно керував нашими лівійськими володіннями. Без сумніву, він поліпшить той жалюгідний стан, у якому перебувають наші військові, і принесе славу Італії!"
