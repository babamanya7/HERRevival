 sotamarsalkka:0 "Sotamarsalkka"
 south_america_adj:0 "Південноамериканськ"
 south_american_events.11.d:0 "Хоча президент Еусебіо Аяла привів нашу країну до перемоги у війні проти Болівії разом зі своєю правою рукою Хосе Феліксом Естігаррібією, він і його уряд дуже винні в тому, що війна взагалі почалася, і по всій країні існує велике невдоволення проти нього. Зараз багато офіцерів оголосили себе ворожими до самовдоволеного і слабкого ліберального уряду, а підполковники Федеріко Венман Сміт і Камільдо Рекальде окупували Асунсьйон і вимагають негайної відставки Еусебіо Аяли!"
 south_american_events.11.t:0 "Спроба військового перевороту"
 south_american_events.14.e:0 "Еліас Лафертте Гавіньйо."
 south_american_events.50.desc:0 "Наше зобов'язання доктрини Монро ставиться під сумнів через недавнє оголошення війни проти [FROM.FROM.GetNameDef]. Хоча багато наших власних громадян не в захваті від перспективи бути відправленими воювати на захист [FROM.FROM.GetNonIdeologyName], наші експерти із зовнішньої політики висловлюють занепокоєння, що бездіяльність на їхній захист може призвести до ланцюгової реакції іноземних держав, які втручатимуться у нашу півкулю."
