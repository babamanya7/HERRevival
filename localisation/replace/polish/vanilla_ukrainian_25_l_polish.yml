 COG_south_to_lake_malawi_desc:0 "Нам потрібно зробити останній поштовх до ще одного великого озера, яке не входило до карти старої Імперії Кітари. Це озеро Малаві, і воно буде нашим, так само як і всі інші великі озера в регіоні."
