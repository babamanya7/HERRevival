 EST_events.401.d:0 "[From.GetLeader] has been successfully wooed by [Root.GetAdjective] efforts to instill a pan-Baltic national identity and has agreed to merge the [From.GetFascistParty] Party with the [Root.GetFascistParty]. A firm victory in [Root.GetLeader]'s goal to unite the Baltics, [Root.GetNameDef] will surely be in a much better position to defend itself from the [SOV.GetAdjective] invasion."
 EST_events.401.t:0 "[From.GetNameDefCap] Accepts!"
 EST_generic_democratic_reformer:0 "Каарел Ліідак"
 EST_launch_vaps_investigation_desc:0 "Ми мусимо виділити підрозділи наших спецслужб для проникнення і припинення спроб вапсів підірвати уряд."
 EST_richard_veermaa:0 "Ріхард Веермаа"
 EST_the_brotherhood_desc:0 "Естонія існує не у вакуумі, і на південь від нас знаходяться дві дуже вразливі країни, чиї шанси на виживання стануть набагато вищими, якщо інтегрувати їх до естонської держави. Країни Балтії — брати, і ми, як брати, повинні триматися разом."
 EST_vaps_crackdown:0 "Придушення вапсів"
