 JAP_reiterate_the_three_principles_of_hirota_desc:0 "Завдяки обережному маневруванню уряду Хірота зміг домогтися, щоб його наступник Казушіге Угакі став новим прем'єр-міністром. Настав час офіційно ратифікувати три заяви Хіроти, а саме: створення блоку Японія-Китай-Маньчжоу-го, організацію спільного японсько-китайського фронту проти поширення комунізму та придушення антияпонської діяльності в Китаї."
