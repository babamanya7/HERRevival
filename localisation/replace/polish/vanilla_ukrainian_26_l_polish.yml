 denmark_expansion_event.602.a:0 "Дуже шкода..."
 denmark_fascist_event.21.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 denmark_fascist_event.22.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 denmark_occupation_event.8.desc:0 "[FROM.GetLeader] вряди-годи дослухається до голосу розуму і визнає нашу незалежність. Схоже, ми звільнилися з рабства безкровно."
 denmark_overlord_events.10.desc:0 "Погіршення відносин між нашими країнами призвело до того, що [FROM.GetAdjective]е міністерство закордонних справ надіслало нам офіційну вимогу про те, щоб [ROOT.GetLeader] пішов у відставку.\nХоча нам було надано унікальну автономію під [FROM.GetAdjective]им протекторатом, ще сильніше руйнувати відносини між нашими країнами було б необачно."
 denmark_overlord_events.26.b:0 "Нас не змусиш обмежити свободу слова!"
 denmark_overlord_events.36.b:0 "Жоден данець не помре на чужій землі!"
 denmark_overlord_events.37.desc:0 "Данський уряд відповів на наш запит і вже відправив частину військ для допомоги нам у поточних конфліктах."
 denmark_overlord_events.37.t:0 "[FROM.GetNameDefCap] погоджується надати призовників"
