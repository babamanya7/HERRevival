 CHI_tsr_never_another_national_protection_war_desc:0 "Війна на захист республіки відбувалася між 1915 і 1916 роками і була спробою нелояльних генералів і республіканців повалити законне правління імператора Хунсянь. Щоб гарантувати, що це ніколи не повториться, ми повинні швидко розправитися з автономними варлордами та незалежними арміями і забезпечити, щоб уся влада перебувала в руках Сина Неба!"
 CHI_tsr_our_place_in_the_sphere_desc:0 "Ставши справжнім партнером Японії, а не просто її сателітом, ми повинні знайти своє місце в Сфері Співпроцвітання та Великій Східній Азії в цілому. Китай знову стане світовою державою!"
