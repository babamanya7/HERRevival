 news.11.t:0 "Румунія відхиляє радянські вимоги"
 news.126.t:0 "Падіння Нью-Делі"
 news.131.b:0 "Польський натиск не зупинити!"
 news.164.t:0 "Криза в Словенії"
 news.165.d:0 "Включивши Австрію до свого складу, держава [GER.GetName] використала це для виправдання подальших претензій та назвала «правомірним» повернення колишніх австрійських територій, зокрема Словенії, яка зараз належить державі [YUG.GetName].\n\nУ відповідь на це в Лондоні була скликана конференція для обговорення «словенського питання», куди прибули делегати країн, які підписали Версальський договір.\n\nНезважаючи на дні переговорів, на конференції не вдалося дійти згоди. Хоча британський уряд шукав мирного рішення, французи рішуче протистояли німецьким загрозам. Німецька делегація пішла на знак протесту, а хмари війни збираються над Словенією."
 news.168.a:0 "Так будується Новий Порядок."
 news.169.e:0 "Мир під загрозою."
 news.17.d:0 "Перемовини у Відні щодо територіальної суперечки між державами [HUN.GetNameDef] та [ROM.GetNameDef] були зірвані.\n\n[GER.GetNameDef], який виступав як третейський суддя, виніс рішення про передачу Північної Трансільванії державі [HUN.GetNameDef]. Румунський уряд не ухвалив такий вердикт і відкликав свою делегацію. Судячи з усього, [GER.GetNameDef] поки що не має великого дипломатичного впливу, як би йому цього не хотілося."
 news.171.a:0 "Дурні."
 news.184.d:0 "Інтереси Італії та Німеччини часом не збігаються, особливо в Австрії та на Балканах. Втім, це не заважає потеплінню відносин між країнами на міжнародній арені, і зараз вони ведуть переговори про укладання пакту для «захисту спільних інтересів».\n\nЯкщо переговори пройдуть успішно, ми побачимо альянс, здатний вплинути на Центральну і Східну Європу."
 news.195.t:0 "[From.GetName] Надано Східну Німеччину"
 news.215.b:0 "Боротьба лише прискорить робітничу революцію."
 news.224.a:0 "Ми мусимо прийняти їхню дипломатичну місію."
 news.23.d:0 "Дипломати держави [ITA.GetNameDef] пред'явили ультиматум державі [ALB.GetNameDef] з вимогою увійти до складу Великої Італії. Король Зогу I відмовився підкоритися італійцям, закликавши албанський народ опиратися.\n\nОднак закордонні військові експерти сходяться на тому, що [ALB.GetNameDef] не має шансів відбити агресію."
 news.238.e:0 "Вони справді вірять, що це щось змінить?"
 news.239.b:0 "Ми вітаємо наших колег-соціалістів з розпростертими обіймами!"
 news.239.e:0 "Ще більше щурів на борту корабля, який ми ось-ось потопимо."
 news.246.t:0 "[USA.GetNameDefCap] й [CAN.GetNameDef] формалізовують альянс"
 news.248.b:0 "Все так, як і повинно бути."
 news.250.b:0 "Тепер нам лише треба подбати, щоби націоналісти взяли владу."
 news.250.t:0 "Громадянська війна в державі [MEX.GetNameDef]!"
 news.252.e:0 "Ще один фронт, про який варто було б турбуватися, якби дійшло до війни."
 news.265.t:0 "[SAF.GetAdjective]ий тиск на Францію"
 news.286.desc:0 "\nУ результаті запеклого голосування невелика більшість у [AST.GetAdjective]ому парламенті вирішила, що країна має вийти зі складу Британської імперії. Останні залишки британського правління були оголошені недійсними. [AST.GetLeader] вже підписав це рішення як закон, тим самим обійшовши давню правову традицію надання королівської згоди генерал-губернатором і перетворивши [AST.GetNameDef] на повністю суверенну націю.\n\nПарламент також проголосував за створення Конституційного комітету, який буде обговорювати і консультувати щодо змін, які будуть внесені до Конституції, щоб видалити всі сліди британського втручання у справи [AST.GetAdjective]."
 news.287.t:0 "Німеччина окуповує Західну Польщу"
 news.293.desc:0 "За наполяганням угорців Австрія провела референдум щодо можливого возз'єднання двох народів під короною Габсбургів. Остаточний підрахунок голосів майже завершено, але перемога прихильників возз'єднання вже недосяжна. Тому австрійський уряд прийняв рішення проти приєднання до австро-угорського союзу.\n\nУ дусі демократії та самовизначення Угорщина прийняла результат і вирішила не просувати свої пропозиції далі."
 news.297.b:0 "Глибоко тривожний розвиток подій..."
 news.298.t:0 "[HUN.GetName] розриває Тріанонський договір"
 news.299.a:0 "Світ побачить нашу міць."
 news.314.c:0 "Чи зможуть комуністи впасти нижче?"
 news.317.a:0 "Ми беремо владу в свої руки."
 news.32.b:0 "Підіймемо бокал за наших нових друзів-більшовиків!"
 news.326.a:0 "Це було необхідно."
 news.34.a:0 "Це занепокоює."
 news.35.d:0 "Під загрозою поразки у Франції французький і британський уряд ухвалили рішення про об'єднання двох держав, доки не буде досягнуто перемоги над Німеччиною.\n\nУ Лондоні було сформовано новий спільний уряд, головою якого залишився Едуард VIII. У своїй «Декларації про об'єднання» новий спільний військовий кабінет заявив: «Франція та Велика Британія відтепер є не двома окремими державами, а єдиним франко-британським союзом. Його конституція встановить спільні органи оборонної, іноземної, фінансової та економічної політик. Кожен громадянин Франції та Великої Британії з цього моменту набуває громадянства іншої країни»."
 news.35.t:0 "Народження Франко-британського союзу"
 news.48.a:0 "Велика втрата для авіації."
 news.5.c:0 "Шакали на залишили нам вибору."
 news.5.t:0 "[JAP.GetNameDefCap] вимагає Французький Індокитай"
 news.56.a:0 "Тоді жодної війни цього року."
 news.59.a:0 "Ситуація для чехів видається сумною."
 non_aggression_pact:0 "Пакт про ненапад"
 norfolk_naval_yard:0 "Norfolk Naval Yard"
 nsb_news.10.b:0 "Комуністичної революції завдано серйозного удару."
 nsb_news.301.b:0 "Цікаво"
 nsb_news.402.d:0 "Тепер вони підпорядкують собі Європу..."
 nsb_news.7.a:0 "Скоро ми станемо єдиними."
 nsb_news.8.desc:0 "4 червня 1918 року Вільгельм Карл фон Урах був демократично і за масового схвалення народу обраний королем Литви, але втручання Німецької імперії зробило референдум недійсним, і Литва так і не возз'єдналася зі своїм королем. Натомість президент Литви скасував свою посаду і оголосив короля Міндаугаса III главою нового Королівства Литва. Тепер, коли Антанас Смєтона служить литовським прем'єр-міністром, держава стала абсолютною монархією, і в ній варто очікувати розвитку нової хвилі патріотизму — в тому числі і шаленого."
 nsb_news.9.g:0 "Цього разу нехай справляються самі."
 nuclear_reactor:0 "Ядерний реактор"
 occupy_libya_fra:0 "Окупувати Італійську Лівію"
 officers_purged_8:0 "$officers_purged$"
 one_opposing_monroe:0 "§Y\n\nНижче наведені країни, які наразі висловили свою опозицію Доктрині:\n\n[?global.monroe_countries_not_in_support^0.GetNameWithFlag]§!"
 operation_buffel_desc:0 "Щоб забезпечити Німеччині роль безумовного лідера при новому світовому порядку, ми мусимо здійснити широкомасштабне вторгнення на континентальну територію Сполучених Шатів. Необхідно негайно зайняти ключові політичні та промислові центри Північно-Східного узбережжя США, включаючи Білий дім"
 operation_capture_cipher:0 "Захопити шифр"
 operation_huansheng_success_tt:0 "Під час зухвалого бомбардувального нальоту вдалося розкидати листівки над усіма визначеними містами. Частина листівок упала на дахи або в лісистій місцевості, але більшість потрапила в доступні та густонаселені райони, де їх швидко розібрали місцеві жителі."
 operation_seelowe:0 "Операція «Морський лев»"
 operative_demolition_expert:0 "Експерт із вибухівки"
 operative_skill_1:0 "Новобранець"
 operative_slot_tt:0 " $MODIFIER_OPERATIVE_SLOT$: $RIGHT|+=0$"
 overwhelming_firepower:0 "Гнітюча вогнева міць"
 pakistan_RU_Dat:0 "Пакистану"
 pan_americanism_goal_name:0 "Панамериканізм"
 panay_incident.2.e:0 "Канонерський човен США USS Panay сьогодні потрапив під обстріл під час евакуації цивільних осіб у ході конфлікту між державами [JAP.GetName] і [CHI.GetName], хоча на його належність ясно вказували [USA.GetAdjective] прапори Після двох прямих влучень бомб вона пішла на дно, внаслідок чого три громадяни США загинули, а багато людей отримали поранення, які вижили підібрали [USA.GetAdjective] і [ENG.GetAdjective] канонерки, що знаходяться в тому районі.\n\nДержава [JAP.GetNameDef] поспішила заявити, що це був нещасний випадок, і вибачитися, але деякі вважають, що атака була навмисною. Ряд радників пропонують оголосити війну. Як нам відреагувати?"
 panzerwaffe:0 "Створити Панцерваффе"
 paraguay.1.b:0 "Цього немає в бюджеті"
 paraguay.1.t:0 "Можливість збільшити витрати на фортифікацію"
 paras_keystone_1_desc:0 "До наших десантних батальйонів слід відбирати лише найбільш загартованих у боях ветеранів. Хоча це може зменшити кількість новобранців, це обов'язково принесе дивіденди на полі бою."
 pavel_events.301.a:0 "Що, серйозно?"
 peace_conference_rules_filter_tooltip:0 "§GКлацніть§!, щоби перемкнути фільтр §Hмирна конференція§!."
 plane_designer_scout_plane:0 "Літак-розвідник"
 poland.12.a:0 "Учімося-но всі на його відвазі."
 political.1.b:0 "Рух для народу мусить шукати підтримку в самого народу."
 political.33.t:0 "[ROOT.GetCountryAppropriateFilmProduction]"
 political.5.d:0 "«Капіталісти та націоналісти хотіли би, щоби ви проливали свою кров за них на фронтах, піднімаючи брата на брата через суперечки, які не стосуються трудящих! Замість піднімати зброю проти робітників, які борються за кордоном, підніміть її проти гнобителів і скиньте тиранів!»\n\nАрмія, зазвичай бастіон патріотизму та відданості, виявилася не захищеною від комуністичної пропаганди, яка швидко поширюється державою [Root.GetName]. Солдати дезертирують, відмовляються воювати за свою країну, а іноді доходять до того, що приєднуються до партизанських рухів, які стверджують, що готуються до революції."
 political.7.d:0 "«[Root.GetAdjectiveCap]ий народ надто довго перебував під некомпетентним правлінням партії [Root.GetRulingParty]! Вони стверджують, що представляють народ, але не здатні навіть підтримувати порядок на наших вулицях! Тільки усунувши їх від влади, ми зможемо змусити цю націю розвиватися!»\n\n[Root.GetAdjectiveCap]і фашистські оратори не приховують, що вони думають про нашу нинішню владу та політичну систему. Подібні промови використовують суспільну незгоду, яка особливо яскраво виражена в більш консервативних частинах збройних сил."
