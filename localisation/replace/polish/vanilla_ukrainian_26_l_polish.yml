 PRC_central_committee_desc:0 "Центральний комітет Комуністичної партії Китаю є вищим політичним органом партії. Заснований у 1920-х роках, Центральний комітет очолюється Генеральним секретарем. Політбюро є виконавчим комітетом і складається з вищого керівництва партії. $PRC_zhang_wentian$ перейняв посаду Генерального секретаря від $PRC_bo_gu$ у січні 1935 року."
 PRC_centralized_army_command_desc:0 "Децентралізоване командування нам не послужить. Уся інформація повинна проходити через нову структуру командування, щоб покращити належне оперативне планування згори донизу, до найнижчого новобранця."
