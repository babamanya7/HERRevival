 AFG_political_events.100.desc:0 "Уряд [FROM.GetNameDef] визначив стратегічну необхідність створення буферної держави у Східній [PER.GetNonIdeologyName]. З цією метою вони офіційно попросили передати контроль над низкою територій у Східному Ірані, щоб сприяти створенню штату Хорасан. Вони стверджують, що ця нова буферна держава слугуватиме стабілізуючою силою в регіоні."
