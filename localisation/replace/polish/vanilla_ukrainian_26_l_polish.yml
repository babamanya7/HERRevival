 RULE_ALLOW_PARTY_BOOSTING_BLOCKED_DESC:0 "Держави не можуть збільшувати популярність партії в жодній державі."
 RULE_ALLOW_RELEASE_NATIONS_POLAND_KASHUBIA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! не може дати незалежність державі §Y[KSH.GetNameDef]§!."
 RULE_ALLOW_VOLUNTEERS_FREE_DESC:0 "Держави можуть надсилати добровольців куди завгодно незалежно від рівня світової напруженості."
 RULE_DEMOCRATIC_ALTERNATE_CAN_AI_DESC:0 "§HКанадський§! ШІ намагатиметься отримати повну незалежність і створити альянс ізі Сполученими Штатами, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_ALTERNATE_PRC_AI_DESC:0 "§HКомуністичний китайський§! ШІ намагатиметься створити коаліційний уряд із націоналістами, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_BALKAN_DOMINANCE:0 "Домінування на Балканах"
 RULE_OPTION_CHL_LE_DELUGE_DESC:0 "Чилійський ШІ звернеться до традицій і усуне Алессандрі від влади, поставивши на його місце Ібаньєса. Тоді він влаштує громадянську війну, за результатом якої Антуан III відновить старе Королівство Арауканія та Патагонія, проголосивши себе спадкоємцем Наполеона."
 RULE_OPTION_COMMUNIST_JAP_AI_DESC:0 "§HЯпонський§! ШІ намагатиметься перейти в комунізм і підтримувати інші комуністичні режими в Азії, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEFAULT_AI_DESC:0 "ШІ прийматиме рішення, виходячи з інших налаштувань ігрового процесу, як-от обмеження до історичних фокусів, або інших ігрових сценаріїв. Це така ж поведінка ШІ, як у версії 1.5 і раніше."
 RULE_OPTION_DEMOCRATIC_ENG_AI_DESC:0 "§HБританський§! ШІ намагатиметься захистити Польщу й очолити Союзників у їхній оборонній війні проти німців, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEMOCRATIC_LIBERAL:0 "Демократичний лібералізм"
 RULE_OPTION_DEMOCRATIC_SEA_DESC:0 "Китайський ШІ спробує піти шляхом Демократичної ліги в дереві фокусів."
 RULE_OPTION_ETH_COLLABORATIONIST:0 "Фашизм: колабораціонізм"
 RULE_OPTION_FASCISM_IRQ_AI_DESC:0 "ШІ спробує якнайшвидше привести до влади «Золотий квадрат», а потім приєднатися до Осі, щоб воювати проти Великої Британії. Після цього вони спробують анексувати сусідні арабські території."
 RULE_OPTION_FREE_50:0 "Вільні при 50% світової напруженості"
 RULE_OPTION_GOE_HISTORICAL:0 "GOE — історичний шлях"
 RULE_OPTION_HISTORICAL_SEA:0 "$RULE_OPTION_HISTORICAL$"
 RULE_OPTION_LIMITED:0 "Обмежені"
 RULE_OPTION_MONARCHIST_ALCANTARA_DESC:0 "ШІ намагатиметься відновити Бразильську імперію, заручившися підтримкою Педру джі Алкантари як законного спадкоємця на престол. Тоді він намагатиметься возз'єднатися з Португалією шляхом дипломатії або сили."
 RULE_OPTION_MONARCHIST_PHI_AI:0 "Іспаномовність"
 RULE_OPTION_NO:0 "Ні"
 RULE_OPTION_OBEDIENCE_CHINA:0 "Два імператори"
 RULE_OPTION_OCEANIA_UNITED:0 "Полінезійська імперія"
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC:0 "Члени альянсу дають 10% своїх балів мирної конференції лідеру альянсу."
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC:0 "Шведський ШІ піде фашистським шляхом, стане підлеглим Німеччині і залишиться слухняним своєму володареві."
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0 "ШІ озброїть Швайцарію та підготує до війни, приєднавши Швайцарію до демократичних держав світу, зрештою порушивши нейтралітет на користь Союзників."
 RULE_OPTION_WANG_JINGWEI_SEA:0 "Фронт Вана Цзінвея"
 RULOC_Emu:0 "йому"
 RU_Prep_SOV_RUSSIANS_DEMONYM_RUSSIANS:0 "росіян"
 RU_lower_Gen_communism:0 "комунізму"
 RWA_democratic_ADJ:0 "Руандійськ"
 SAF_cv_CAS_equipment_2:0 "Blackburn Skua"
 SAF_empower_the_workers_desc:0 "Ми — нація шахтарів та фермерів. Робочий клас Південної Африки — ось справжній вигляд нашого національного духу."
 SAF_equal_opportunity_employment:0 "Рівні можливості для працевлаштування"
 SAF_heavy_tank_aa_equipment_2_short:0 "Churchill (зеніт.)"
 SAF_heavy_tank_aa_equipment_3:0 "Black Prince Marksman"
 SAF_heavy_tank_equipment_1_short:0 "Vickers"
 SAF_light_tank_aa_equipment_2_short:0 "Matilda (зеніт.)"
 SAF_perfect_the_cab_rank_technique:0 "Довести «кеб-ренк» до досконалості"
 SAF_q_services_corps_desc:0 "Служба тилового забезпечення «Q» стане єдиним центром постачання регулярної армії. Вона займеться доставкою палива, провізії, боєприпасів та обмундирування."
 SAF_retain_experienced_pilots_desc:0 "Занадто часто наші досвідчені пілоти йдуть на подальшу службу у ВПС Великої Британії, замість того, щоби залишатися вдома. У Королівських ВПС більше можливостей зробити кар'єру та взяти участь у бойових діях. Але ми мусимо намагатися утримувати досвідчених пілотів у себе, щоб вони надихали та навчали нові покоління південноафриканських льотчиків."
 SAF_rocket_artillery_equipment_2_short:0 "RP-3 HE/SAP"
 SAF_south_african_railways_desc:0 "Необхідно розвивати компанію «Південноафриканські залізниці». Тут можна навчати молодь та прищеплювати їй необхідні навички, які стануть у нагоді як у країні, так і на службі за кордоном."
 SAF_support_spain:0 "Підтримати Іспанію"
