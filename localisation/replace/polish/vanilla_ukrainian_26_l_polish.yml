 ETH_breakup_fight_tt:0 "§RСтане незалежним від держави [ROOT.GetName]. [ROOT.GetName] оголосить їм війну.§!"
 ETH_bring_in_foreign_advisors_tt:0 "Змінити §Y[GetEthiopianAirforceSpiritName]§! на:\n $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G-5%§!\n $MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-5%§!\n $MODIFIER_AIR_ACCIDENTS$: §G-15%§!"
 ETH_communist_dominant_range:0 "Комуністи панують у політиці"
 ETH_conservative_high_command_idea:0 "Консервативне вище командування"
 ETH_consolidate_east_africa_desc:0 "Світовий порядок змінюється навколо нас, коли старі імперії починають розвалюватися. Єдиний спосіб забезпечити місце для нашого народу в цьому новому порядку — це завоювання та демонстрація нашої здатності подолати будь-які перешкоди. Таким чином, ми об'єднаємо Східну Африку під нашим контролем і покажемо світові могутність [ETH.GetName]."
 ETH_copy_light_plane_tt:0 "Буде створений варіант (§Y$iw_small_airframe$§!): §Y[ITA.GetFlag]CR.32§!"
 ETH_develop_the_capital_region:0 "Розвинути область [271.GetName]"
 ETH_ecole_militaire_haile_selassie_1er:0 "[GetEthiopianMilitaryAcademyName]"
 ETH_elect_of_god:0 "Обранець Бога"
 ETH_empower_the_ras:0 "Уповноважити расів"
 ETH_freedom_at_gunpoint_desc:0 "Нам уже кілька разів вдалося дати відсіч [ITA.GetAdjective]им військам у їхньому прагненні підкорити наш народ. Проте нашим сусідам не так пощастило протистояти колонізаторам. Настав час направити наш досвід війни та нашу нову економічну силу на звільнення Африки, використовуючи єдину мову, яку розуміють колоніальні держави. Груба сила."
 ETH_german_mediation_desc:0 "Оскільки [GER.GetAdjective]і й [ITA.GetAdjective]і амбіції починають збігатися, питання [ETH.GetName] залишається каменем спотикання для розширення співпраці між двома країнами. Можливо, [GER.GetLeader] зможе переконати [ITA.GetLeader] припинити свою безглузду діяльність і дозволити Імператору повернутися на своє законне місце в [ETH.GetName]."
 ETH_gojjam_haymanot_fascism_party_long:0 "Годжамські роялісти"
 ETH_haile_abba_mersa:0 "Хайле Абба Мерса"
 ETH_haile_selassie_returns_tt:0 "$ETH_haile_selassie$ повернеться в державу [ETH.GetName]:"
 ETH_hmmbi:0 "Hibret Manufacturing and Machine Building Industry"
 ETH_host_country_decision_desc:0 "Треба готуватися до найгіршого. Якщо країна впаде, нам потрібна база, звідки ми зможемо продовжувати опір. Ми повинні звернутися до [FROM.GetAdjective]ого уряду та попросити дозволу створити там уряд у вигнанні."
 ETH_italian_settlers_idea:0 "Італійські поселенці"
 ETH_jimma_jofir_fascism_party_long:0 "Прихильники Абби Джофіра"
 ETH_local_development_industry_grows_mission_desc:0 "Мале виробництво в області [?ETH.ETH_local_state.GetName] процвітає. Якщо ми продовжимо заохочувати це, то від цього виграє вся [ROOT.GetName]."
 ETH_mesafint_dominant_range:0 "Месафинт панують у політиці"
 ETH_offer_peace_KEN_tt:0 "Запропонувати власнику [KEN.GetAdjective]ої території мир, якщо він погодиться відмовитися від претензій на територію, яку наразі контролює [ETH.GetName]. [KEN.GetAdjectiveCap]а територія, яку наразі контролює [ETH.GetAdjective]а влада, стане [ETH.GetAdjective]ою маріонеткою."
 ETH_recruit_from_the_african_diaspora_desc:0 "Багато представників африканської діаспори в усьому світі, не бажаючи знищити один із останніх залишків незалежної Африки, готові взяти до рук зброю та воювати разом з нами. Разом ми врятуємо не лише [ETH.GetName], але й саму ідею свободи Африки."
 ETH_red_army_engineers:0 "Інженери Червоної армії"
 ETH_renewed_offensive_desc:0 "Італійці, ймовірно, намагаються повернути собі ініціативу. Але це також значить, що вони не очікуватимуть атаку з нашого боку. Замість просто протриматися якнайдовше, нам слід принести їм війну."
 ETH_send_home_advisors_tt:0 "Усі [SOV.GetAdjective]і військові радники будуть повернені в державу [SOV.GetNameDef]."
 ETH_stalingrad_tractor_factory:0 "$stalingrad_tractor_factory$"
 ETH_state_owned_industry_desc:0 "Ми чітко бачимо від великих держав світу, що ті уряди, які бажають втручатися у вільний ринок, бачать величезні економічні вигоди, контролюючи виробництво та скорочуючи безробіття. Ми наслідуватимемо їхній приклад і швидко розширимо нашу економіку за допомогою державних галузей промисловості."
