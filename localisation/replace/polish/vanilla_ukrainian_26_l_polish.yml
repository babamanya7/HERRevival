 ENG_discuss_appeasement:0 "Обговорити умиротворення"
 ENG_eliminate_the_upper_class_desc:0 "Робітники мусять повстати і порвати кайдани, створені вищими класами. Ми вправимося з ними та захопимо їхні компанії на користь держави."
 ENG_expand_the_secret_intelligence_service_focus_desc:0 "Таємна розвідувальна служба, яку зазвичай називають МІ6, допомагає захищати нашу батьківщину від будь-якої підривної діяльності та іноземних загроз. Хоча вона була заснована ще під час Великої війни, її реорганізація відбулася у двадцятих. Однак тоді ми упустили деякі важливі деталі, і нам слід докласти зусиль, щоби знову збільшити розмір організації."
 ENG_home_defence_desc:0 "Величезна імперія не принесе користі, якщо ми не зможемо захистити британський народ. Ми мусимо зосередити наші зусилля на збереженні безпеки Британських островів."
 ENG_home_defence_tt:0 "У разі вторгнення будуть відкриті рішення §YЗахист батьківщини§!."
 ENG_imperial_conference_economy_dominion:0 "Економічні угоди імперської конференції"
 ENG_imperial_federation_india_unified_fascism_DEF:0 "Імперія"
 ENG_impose_martial_law_on_canada:0 "Увести воєнний стан у Канаді"
 ENG_indian_autonomy_tt:0 "§RБез автономії або лорда Галіфакса як лідера держави [RAJ.GetNameDef] не підтримає жодні пропозиції щодо створення імперської федерації.§!"
 ENG_medium_tank_equipment_1_short:0 "Crusader"
