 infiltrate_military_bribe_desc:0 "Наш агент знайде людину, яка зазнає фінансових труднощів, і запропонує їй значну суму за підтримку. Гроші на хабар ми виділимо з нашої скарбниці."
 infiltrate_military_turned_pow_outcome:0 "Наш відділ психологічної війни переконав військовополоненого в тому, що наша справа — краща, і відправив його назад до противника."
 infiltration_bombing_desc:0 "Ідея приєднатися до ворожої групи або простежити її шлях до авіабази здається шаленою. Але, набравшись досвіду, можна зробити і таке."
