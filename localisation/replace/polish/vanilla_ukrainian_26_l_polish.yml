 denmark_expansion_event.12.desc:0 "Ці дурні в [SWE.GetAdjective]ому уряді вирішили відкинути нашу розумну пропозицію про підпорядкування! Що ж, якщо вони не хочуть ділитися ресурсами добровільно, нам доведеться забрати їх силою."
