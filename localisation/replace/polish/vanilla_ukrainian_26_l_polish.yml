 war_bonds:0 "Військові облігації"
 war_building_slot_flag:0 "Ще не отримано додаткову комірку для будівництва від привласнення земель"
 war_escalation_5_tt:0 "§HРівень 5§!\n §YЛіга Націй§!: Ефіопія може надіслати запит на закриття Суецу\n §YІталія§!: Африканська армія зневірена\n §YЕфіопія§!: Фокус §YЗакрити Суец§! відкритий"
 war_justification.15.a:0 "Вбиті в революції будуть помщені!"
 war_justification.211.d:0 "«Без сумніву, [ROOT.GetName] комунізм є однією з найбільших загроз свободі та порядку в цю епоху. Невблаганний і безжальний, він загрожує поглинути не лише надію [ROOT.GetAdjective]ого народу на процвітаюче, демократичне суспільство, але й надію його сусідів. Якщо ми не будемо діяти зараз, то можемо побачити, як це перше доміно впаде занадто пізно, залишивши по собі ще більше невдалих соціальних експериментів. Скільки ще має загинути людей, перш ніж ми втрутимося?»\n\nРобітничий рух, що зароджується, залякав лідерів [From.GetAdjective]. Хоча представники їхньої опозиції називають це червоною загрозою, спрямованим на війну з нами, риторика [From.GetRulingParty] досі була дуже успішною."
 war_justification.8.a:0 "Смерть фашистам!"
 war_justification.9.a:0 "Іноді потрібно піднятися на гору конфлікту."
 war_on_democracy_goal_name:0 "Оголосити війну демократії"
 war_reparation_receiver_extended_desc:0 "$COUNTRY2|UY$ отримує цивільні заводи від держави $COUNTRY1|Y$ в якості військових репарацій:"
 warsaw_uprising_operation_tt:0 "Спровокувати національне повстання у Польщі, створивши нові військові частини на її територіях."
 we_will_play_as_kum_tt:0 "Ми продовжимо гру за [KUM.GetFlag]§Y[KUM.GetNameDef]§!!"
 weekly_manpower_tt:0 " $MODIFIER_WEEKLY_MANPOWER$: $RIGHT|+=0$"
 where_the_dragon_rises:0 "Where the Dragon Rises"
 will_be_removed_once_scw_is_over_tt:0 "\nЦей дух буде §Rвидалений§! після завершення громадянської війни в Іспанії."
 wtt_border_conflict_escalate_to_war.1.a:0 "Ми мусимо бути готові до зустрічі з ними!"
 wtt_border_conflict_lost_defender.1.desc:0 "Війська під командуванням [their_country.GetLeader] успішно витіснили нас із спірної території між областями [our_state.GetName] і [their_state.GetName]. Наші солдати організовано відступили й тепер перегруповуються, щоб у майбутньому поновити боротьбу."
 wtt_britain_lease_azores.1.b:0 "А де вигода для нас?"
 wtt_china.12.t:0 "[From.GetNameDefCap] опирається"
 wtt_germany.1000.a:0 "Прекрасна ідея! Ми надішлемо своїх радників та помічників."
 wtt_germany.1000.t:0 "[From.GetAdjective]ий уряд погоджується виконати прохання"
 wtt_germany.3.b:0 "Потрібно зупинити його — ми не можемо піти на ризик розв'язати другу Велику війну."
 wtt_germany.32.d:0 "Незважаючи на те, що громадська думка у Великій Британії проти війни, уряд країни визнав німецьку загрозу і запропонував нам повну підтримку. Ми висунемо Німеччині останній ультиматум, щоб вони не сміли повертати кайзера, цього розпалювача війни. У разі відмови наші війська перейдуть кордон і покладуть край цієї тиранії!"
 wtt_germany.39.desc:0 "Офіційні представники Китаю звернулися до нас із пропозицією, яка, на їхню думку, може задовольнити обидві сторони. Вони пропонують повернути Ціндао Німеччині в обмін на гарантію того, що ми не відкликаємо місію фон Фалькенгаузена."
 wtt_germany.5.a:0 "Що ж, надамо їм привід потурбуватися по-справжньому!"
 wtt_germany.8.b:0 "Це обурливо! Ми ніколи не відмовимося від свого курсу!"
 wtt_infiltration.21.a:0 "Головне — скоріше."
 wtt_infiltration.21.t:0 "В області [infiltrated_state.GetName] виявлено комуністичний осередок"
 wtt_infiltration.23.desc:0 "Низка рейдів на відомі місця укриття комуністів не дала жодних нових відомостей про масштаб комуністичного впровадження. Детальні допити захоплених комуністів також не принесли нічого нового. \n\nСхоже, наша розвідка непогано впоралася з цим питанням."
 wtt_japan.101.desc:0 "Після нещодавньої перемоги над державою [MAN.GetName] Японський уряд визнав претензії Китаю на цей регіон та запропонував повернути його нам. Разом із цим жестом доброї волі воно пропонує нам укласти союз."
 wtt_japan.121.t:0 "[From.GetName] займає Токіо"
 wtt_japan.123.a:0 "Війна виграна."
 wtt_japan.123.desc:0 "Після захоплення Токіо фашистський уряд впав. У прихильників і військових загонів, що залишилися, немає шансів згуртуватися, і вони почали розбредатися, завдяки чому захопити решту віддалених територій буде легко."
 wtt_japan.13.t:0 "[From.GetNameDefCap] відхиляє пакт про ненапад"
 wtt_manchukou.2.t:0 "[From.GetLeader] підкоряється"
 wtt_news.10.desc:0 "У відповідь на недавню заяву Німеччини про створення Центральноєвропейського альянсу, покликаного протидіяти радянській агресії, радянський уряд вжив заходів щодо нарощування темпів випуску військової продукції.\n\nПредставник Кремля дав чітко зрозуміти, що Радянський Союз не просто так спостерігатиме, як біля його кордонів наростає загроза. Необхідно якнайшвидше дати недвозначну відповідь."
 wtt_news.16.b:0 "Ми заплатили невелику ціну."
 wtt_news.22.d:0 "Навряд чи радянці залишать це без відповіді..."
 wtt_news.25.t:0 "[JAP.GetNameDefCap] приймає контроль над [From.GetAdjective]ими колоніями"
 wtt_news.3.b:0 "Повернення до початку століття?"
 wtt_news.40.c:0 "Наступного разу ми врахуємо їхню рішучість."
 wtt_news.45.desc:0 "У ході тривалої боротьби за владу між лідерами [old_leader.GetLeader] і [new_leader.GetLeader] перший нарешті визнав поразку. Обидва суперники зустрілися у резиденції, що належить лідеру [new_leader.GetLeader]. Під кінець двогодинних переговорів [old_leader.GetLeader] погодився поступитися владою; прем'єр-міністром республіки відтепер стає [new_leader.GetLeader].\n\nРаніше біля стін резиденції зібралися численні прихильники обох політиків, і можна було побоюватися жорстоких зіткнень у тому випадку, якщо переговори закінчаться невдало.\n\nОднак жодних відомостей про сутички не надходить; схоже, передача влади пройшла цілком мирно."
 wtt_news.48.desc:0 "У ході внутрішньої боротьби за владу між японською адміністрацією та урядом лідера [MAN.GetLeader] суперечка за контроль над Маньчжурією нарешті дійшла до точки кипіння.\n\nСудячи з повідомлень, приводом до конфронтації послужив інцидент при Імператорському дворі, коли японський генерал образив імператора Маньчжоу-го, нібито зажадавши від нього вітального поклону.\n\nПрийшов у лють [MAN.GetLeader] відповів, що «Син неба ні перед ким не кланяється» і вдарив генерала тростиною, а потім наказав своїм військам негайно видворити всіх японських солдатів із китайської землі."
 wtt_news.62.b:0 "Подивімося, чи вдасться це їм."
 wtt_news.63.b:0 "Невже це кінець колоніального панування в Африці?"
 wtt_news.68.a:0 "Це кінець колоніалізму в Азії!"
 wtt_news.69.t:0 "Відродження держави [From.GetNameDef]"
 wtt_political_warlord_support.13.desc:0 "Переговори з лідером [From.GetLeader] закінчились. [From.GetLeader] зазначив, що його війська відчувають гостру нестачу кваліфікованих офіцерів і потребують реорганізації. Народ держави [From.GetNameDef] ніколи не підтримає його в поточній боротьбі, поки його армія перебуває в такому жалюгідному стані.\n\nЯкщо ми допоможемо лідеру [From.GetLeader] реформувати його збройні сили, то він буде радий публічно заявити про підтримку нашої сторони."
 wtt_political_warlord_support.13.t:0 "[From.GetLeader] вимагає військову допомогу"
 wtt_prc.21.t:0 "Саботаж на збройовому заводі"
 wtt_the_hump.1.t:0 "Авіаперевезення через «Горб» припинено"
 wtt_warlord.2.a:0 "Мала ціна за наше виживання."
 wtt_warlord_vs_prc.1.a:0 "Вірна маріонетка може виявитися корисною."
 wtt_warlord_vs_prc.10.desc:0 "Поставлений перед вибором — віддати владу чи назвати погрози з боку Радянського Союзу блефом, — [communist_china.GetLeader] обрав останній варіант. На жаль, схоже, [SOV.GetLeader] не просто погрожував, а перейшов до ворожих дій. На своїй хиткій позиції ми тепер зазнаємо тиску з обох боків, і Радянський Союз вимагає, щоби ми виключили зі своїх лав зрадника.\n\nЗа заявою радянської сторони, відмова вважатиметься визнанням, що ми обираємо бік лідера [communist_china.GetLeader]."
 wtt_warlord_vs_prc.31.a:0 "Ми вітаємо можливість навчитися."
 wtt_xian_incident.7.b:0 "Голову з плечей!"
 wuw_GER_chinese_diplomacy.4.a:0 "Справжнє розчарування"
 wuw_GER_chinese_diplomacy.7.t:0 "[FROM.GetNameDefCap] відмовляється від співпраці"
 wuw_GER_diplomacy.104.t:0 "[FROM.GetNameDefCap] погоджується на встановлення сфер впливу"
 wuw_GER_diplomacy.20.a:0 "Разом — до перемоги!"
 wuw_GER_diplomacy.24.t:0 "[FROM.GetAdjective] передають колишні [ROOT.GetAdjective] колонії"
 wuw_GER_diplomacy.32.desc:0 "У рамках угоди 1898 року [743.GetName] було передано в оренду тодішній Німецькій імперії. Сьогодні їхній наступник, [FROM.GetNameDef], звертається до нас із проханням поновити цю оренду. Початкова угода передбачала 99-річний термін, однак її було перервано Великою війною та наступною окупацією з боку [JAP.GetAdjective]."
 wuw_GER_diplomacy.38.t:0 "[FROM.GetAdjective] вимагають території"
 wuw_GER_diplomacy.53.desc:0 "Дипломати з [FROM.GetNameDef] звернулися до нас із вигідною пропозицією. Вони бажають придбати права на певні природні ресурси в наших колоніях, пропонуючи натомість промислову допомогу. Варто нам погодитися?"
 wuw_GER_diplomacy.66.b:0 "Вони потребують захисту, навіть якщо відмовляються платити!"
 wuw_GER_diplomacy.88.a:0 "Чудово!"
 wuw_GER_diplomacy.92.b:0 "Ми не дозволимо втручання у наші справи!"
 wuw_GER_diplomacy.95.t:0 "Пропозиція щодо промислової співпраці"
 wuw_GER_german_politics.01.t:0 "Повернення демократії"
 wuw_GER_legions.3.a:0 "Ми завжди раді ворогам наших ворогів!"
 wuw_GER_monroe.3.a:0 "Кляті вони!"
 wuw_GER_monroe.8.b:0 "Ми й не хотіли цієї Доктрини!"
 wuw_GER_news.1.t:0 "Возз'єднання Німеччини"
 wuw_GER_realpolitik.13.b:0 "За сісу, ми не здамося!"
 wuw_GER_realpolitik.18.t:0 "[FROM.GetNameDefCap] приймає наші вимоги"
 wuw_GER_realpolitik.24.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] позитивно відповів на нашу пропозицію, і їхні дипломати прибули до нашої країни для підписання документів про вступ до нашого альянсу. Вони з радістю приймуть нашу допомогу у поверненні старих оттоманських земель."
 wuw_GER_realpolitik.5.a:0 "Їх слід включити до складу [ROOT.GetNameDef]"
 wuw_GER_realpolitik.54.t:0 "Друга Берлінська нагорода"
 wuw_GER_realpolitik.55.desc:0 "\nРозсудливий [FROM.GetLeader] з [FROM.GetNameDef] погодився передати території старих угорських земель нашому альянсу та наказав військам відступити. Ми знову тріумфуємо!"
 wuw_GER_realpolitik.58.desc:0 "Радісна новина — керівництво [FROM.GetNameDef] погодилося на подальшу інтеграцію з нами, що викликало гучні оплески в Рейхстазі. Наші пропозиції виявилися достатніми, попри удар по їхньому суверенітету."
 wuw_GER_reichskommissariats.10.b:0 "Включити до Московії"
 wuw_GER_reichskommissariats.17.b:0 "Її слід включити до Балкан"
 wuw_GER_reichskommissariats.17.d:0 "Її слід включити до нашої імперії"
 wuw_GER_reichskommissariats.19.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Кляйн-Фенедігу, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_reichskommissariats.22.t:0 "Керівництво Північної Америки"
 wuw_GER_reichskommissariats.25.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Індостані, нам слід визначити не лише її призначення, а й те, хто керуватиме регіоном і забезпечить впровадження нашої політики. Чи варто нам призначити [ROOT.GetAdjective] політика на посаду райхскомісара, чи краще скористатися послугами місцевого колаборанта?"
 wuw_GER_releasable.1.d:0 "Наша столиця і так чудова, залишимо все як є"
 wuw_GER_weltpolitik.1.a:0 "Все для наших друзів"
 wuw_HUN_award_military_promotions_desc:0 "У [ROOT.GetAdjective] армії багато достойних людей, які не займають відповідних посад. Ми повинні підвищити їх у званні та посилити нашу армію."
 wuw_HUN_horthy_admiral_tt:0 "§YМіклош Горті§! стане доступним як адмірал рівня 3"
 wuw_HUN_instate_a_socialist_economy:0 "Запровадити соціалістичну економіку"
 wuw_HUN_joint_aluminum_mining_company:0 "Спільна компанія з видобутку алюмінію"
 wuw_HUN_news_events.1.t:0 "[HUN.GetNameDEFCAP] оголошує Дьорську програму"
 wuw_HUN_reaffirm_territorial_claims:0 "Підтвердити територіальні претензії"
 wuw_HUN_reinstate_the_lenin_boys:0 "Відновити Ленінських хлопців"
 wuw_HUN_renew_the_shipping_industry_tt:0 "Додати §G3§! §Yверфі§! у випадкову контрольовану §Yприбережну область§!"
 wuw_HUN_restore_the_georgian_monarchy:0 "Відновити грузинську монархію"
 wuw_HUN_strengthen_the_turani_vadaszok_requirement_tt:0 "§Y$HUN_hungarian_national_defense_association$§! усе ще існує"
 wuw_HUN_the_kingdom_of_georgia_required_states_tt:0 "§Y[ROOT.GetNameDefCap]§! або суб'єкт контролює всі §Yгрузинські§! національні області в §YСРСР§!"
 wuw_HUN_wherever_the_cross_points:0 "Куди б не вказував хрест"
 ww_BEL_event_diplomatic.17.desc:0 "Вигнане уряд [FROM.GetNameDef] звернувся до нас з пропозицією спільної роботи по обміну військовим досвідом між нашими арміями. Це може принести користь як нам, так і їм."
 ww_BEL_event_diplomatic.29.desc:0 "Ми отримали пропозицію підтримки від людини, від якої ми дещо здивовані почути. Отто фон Габсбург може бути спадкоємцем Карла I, імператора Австрії, короля Угорщини та короля Хорватії, але здається, що на відміну від його батька, Отто значно більше схиляється до співпраці в межах Європи. Він вітає наші зусилля і пропонує свою допомогу на дипломатичному фронті, його широка дипломатична мережа може стати для нас активом, і він із задоволенням надасть нам свою допомогу."
 ww_BEL_event_diplomatic.36.desc:0 "Керівництво [FROM.GetNameDef] погоджується, що ми можемо отримати вигоду від поглиблення наших дипломатичних відносин. Ми можемо розраховувати на них як на друзів і союзників у цьому все більш ворожому світі."
 ww_BEL_event_diplomatic.37.a:0 "Соромно..."
 ww_BEL_event_diplomatic.4.a:0 "Вони зробили неправильний вибір"
 ww_BEL_event_diplomatic.5.a:0 "Погрожувати війною."
 ww_BEL_event_political.4.a:0 "Сподіваємось, прем'єр-міністр Спак буде на посаді довше!"
 ww_BEL_event_spanish_interaction.3.t:0 "[FROM.GetNameDefCap] Надсилає більше обладнання"
 ww_BEL_event_spanish_interaction.8.t:0 "[FROM.GetNameDefCap] Відхиляє нашу пропозицію про альянс"
 ww_BEL_event_war.1.a:0 "Ось чому ми плануємо заздалегідь!"
 ww_BEL_event_war.5.desc:0 "Після запеклого захисту країни, король Леопольд III нарешті запропонував капітуляцію [BEL.GetName], і наш уряд був змушений втекти в еміграцію. Леопольд вирішив залишитися зі своїми людьми і стати в'язнем у власному домі. Ми все ще можемо покладатися на доброзичливість наших союзників і використовувати ресурси [BEL.GetAdjective] імперії, і з часом повернемо нашу батьківщину."
 ww_BEL_event_war.6.b:0 "Цікава ідея, ми розглянемо їхню пропозицію."
 ww_congo.25.a:0 "Ось де війна справжньо починається"
 ww_congo.30.t:0 "[FROM.GetNameDefCap] вирішує допомогти нам"
 ww_congo.33.t:0 "Питання лідерства"
 ww_congo.57.t:0 "[FROM.GetLeader] передає території Руанди"
 ww_congo.59.t:0 "[FROM.GetLeader] просить стати протекторатом"
 ww_congo.6.a:0 "Це було передбачувано"
 ww_congo.60.a:0 "Сьогодні день, який запам'ятається!"
 ww_congo.70.t:0 "Ян Зумбах приєднується до [ENG.GetAdjective]"
 ww_congo.71.b:0 "Заблокуємо його виїзд!"
 yakovlev_design_bureau:0 "ОКБ Яковлєва"
