 NOR_moscows_education_centers_desc:0 "Роками Комінтерн навчав товаришів з усієї Скандинавії навичкам, необхідним для виведення Революції з підпілля. Тепер ми можемо виводити їх на світло, щоб навчати, як продовжувати Революцію безперервно."
 NOR_norges_rikstanksfabrikk:0 "Norges Rikstanksfabrikk"
 NOR_norgesveldet_fascism_ADJ:0 "Норвезьк"
 NOR_quislings_coup:0 "Переворот Квіслінга"
 NOR_reduce_fascist_prep_time_TT:0 "§YЧас§! рішення §YСтворити підтримку в області§! скорочено на §G$RIGHT|0$§! дн."
 NOR_reduced_workers_rights_ns:0 "Скорочені права робітників"
 NOR_secret_police_desc:0 "Настав час посилити контроль над [NOR.GetAdjective]им населенням. Ми помітили деякі вогнища підбурювання. Вони можуть здатися незначними, але вони можуть стати єдиним фронтом до того, як ми встигнемо розробити тактику їх утримання Зрештою, найкращий спосіб зберегти гостроту леза — часто ним користуватися."
 NOR_start_rearmament:0 "Почати переозброєння"
 NOR_swedish_claims_desc_fas:0 "Історія монархій у Скандинавії — це довга та заплутана плутанина, але ми можемо використати її на нашу користь. Швеція вкрала цілі регіони, які колись належали нашій нації, ми можемо використовувати помсту як виправдання для [SWE.GetAdjective]ого вторгнення і перетворити нашу імперію на суміш історичних [NOR.GetAdjective]их територій."
 NOR_the_chamberlains_overture_desc:0 "Оскільки Стортінг стає застарілим, взірець шляхетних цінностей, барон Педер Анкер Ведель-Ярлсберг, другий у черзі феодального графства Ярлсберг, і лорд-канцлер нашого скромного короля Гокона VII, вважає, що ми повинні дивитися на минуле для вирішення майбутнього. А саме, можливо, королівський апарат може взяти під контроль увесь уряд."
 NOR_the_crowns_executive_powers:0 "Виконавчі повноваження Корони"
 NOR_the_kingdom_of_norway:0 "Королівство Норвегія"
 NOR_uproot_secret_army_desc:0 "Створена в 1918 році попереднім урядом, таємна армія ховалася в тіні в очікуванні комуністичного перевороту, який так і не відбувся, і тим часом багато хто радикалізувався в переконаних фашистів. Ці люди — лише бомба уповільненої дії, яка може вибухнути на наших обличчях у будь-який час, з ними потрібно мати справу."
 NOR_wants_to_defend_finland_bad:0 "Хочуть захистити Фінляндію від нас"
 NOR_weapons_for_the_resistance_desc:0 "Ми можемо використати наш величезний торговельний флот, щоб отримати зброю як для наших зусиль тут, так і для бійців опору на нашій батьківщині. Зброя там послабить контроль нашого ворога над [NOR.GetNonIdeologyName], а зброя тут завдасть остаточного удару до їхньої тиранії."
 NOR_worker_armies:0 "Робітничі армії"
