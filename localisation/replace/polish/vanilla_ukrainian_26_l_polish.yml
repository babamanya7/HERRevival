 SWI_declare_the_alpine_confederation_desc:0 "Тепер, коли наша демократія поширилася на Альпи, Конфедерація більше не належить лише державі [SWI.GetNonIdeologyName], вона належить усім людям і громадам Альп."
 SWI_demand_italian_alps_desc:0 "Протягом десятиліть [ITA.GetName] безсоромно претендувала на наші [ITA.GetAdjective] розмовні кантони. Якщо вони зможуть це зробити, ми, звичайно, можемо вимогти, щоб їхні Альпи приєдналися до нашого демократичного суспільства, зрештою, вони належать до [ROOT.GetNameDef] так само, як Тічіно належить до [ITA.GetNameDef]."
 SWI_dismiss_council_desc:0 "Наші вороги надто сильні і радіють суперечкам та міжусобицям у Федеральній Раді. Настав час великому лідеру встати і провести державу [ROOT.GetNonIdeologyName] крізь цю бурю."
 SWI_expand_special_forces_desc:0 "Наша постійна армія добре підготовлена, надзвичайно мала порівняно з армією інших країн, і її може бути недостатньо, щоби схилити захист [ROOT.GetName] на нашу користь. Нам знадобиться їх більше, щоби привести [ROOT.GetAdjective] до перемоги!"
 SWI_expand_the_confederation:0 "Розширити Конфедерацію"
 SWI_fritz_platten:0 "Фріц Платтен"
 SWI_guisans_coup_desc:0 "[?SWI.SWI_confederation_president.GetName] привів нашу велику та мирну країну до війни та нещастя. Це не та [ROOT.GetNonIdeologyName], яку ми знаємо й любимо, його було зіпсовано в ім'я самозбереження. Є лише одна людина, популярна та здатна, щоби покласти край цій війні раз і назавжди та, сподіваюся, повернути цю колись нейтральну націю до її коріння; Анрі Гізан."
 SWI_increase_defense_budget_desc:0 "Хоча нам вдалося зберегти нейтралітет і суверенітет у Великій війні, ми не можемо спочивати на лаврах; існує реальна ймовірність, що одна з великих держав, які нас оточують, вторгнеться в нашу країну, щоб обійти укріплення, побудовані між ними, і нашого поточного бюджету буде недостатньо, щоби запобігти цьому."
 SWI_increase_timeout_TT:0 "Відстрочка завдання §Y$SWI_militia_active$§! збільшується на $RIGHT|0G$ дн."
