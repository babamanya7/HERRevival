 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU:0 "I'm Here to Rescue You!"
 CAREER_PROFILE_LAND_ACQUISITION_MEDAL_DESCRIPTION:0 "Шляхом наземних битв здобудьте (й утримайте) певну кількість додаткових провінцій у межах 48 годин."
 CAREER_PROFILE_MILITARY_PLANNER_MEDAL_DESCRIPTION:0 "Зробіть так, щоб дивізія досягла певного відсотку бонусу до планування."
