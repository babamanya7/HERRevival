 PRC_the_chinese_red_army_1939_fake:0 "$PRC_the_chinese_red_army$"
 PRC_the_peoples_doubt_desc:0 "Народ Китаю бачить нашу пасивність щодо іноземних загарбників і починає сумніватися в нашій рішучості об'єднати весь Китай та нашій здатності належним чином захистити його."
 PRC_three_rules_of_discipline_idea:0 "Три правила дисципліни"
 PRC_to_unify_a_country_desc:0 "Зі зміцненням нашої позиції як політично, так і військово на території інших мілітаристів, ми повинні вимагати отримання ресурсів і визнання, на яке це заслуговує."
