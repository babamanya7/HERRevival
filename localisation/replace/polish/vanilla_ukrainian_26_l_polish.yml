 INS_oto_iskandar_di_nata:0 "Ото Іскандар ді Ната"
 INS_political_events.1.desc:0 "П'ятирічний термін [INS.GetLeader] добігає кінця, і тому ми повинні обрати відповідного лідера на його місце. Королева Вільгельміна порекомендувала Алідіуса Тьярду ван Старкенборга Стахауера, який показав великі перспективи як надзвичайний посол і повноважний міністр."
 INS_political_events.11.a:0 "Несподівано, але вітається."
