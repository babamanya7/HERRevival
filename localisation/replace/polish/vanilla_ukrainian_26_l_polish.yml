 high_progress:0 "Великий поступ"
 high_seas_fleet_goal_desc:0 "Забезпечення того, щоб наші вороги не контролювали Північну Атлантику, життєво важливе для наших операцій. Якщо ми зможемо порушити це, це означатиме, що ми не постраждаємо від наслідків військово-морської блокади, і що наші флоти зможуть вільно пересуватися."
 home_defence_spirit_desc:0 "Величезний простір неба містить незліченні обіцянки для тих, хто шукає спадщину."
 home_of_revolution_desc:0 "Товариші, після розгрому контрреволюційних сил в особі троцькістів, ми можемо зосередити свої зусилля на захисті революції. Наша мета, наша надія, наше гасло — побудова соціалізму в окремо взятій країні. Ми побудуємо справжній соціалістичний рай у Радянському Союзі, й інші країни світу підуть за нами."
