 WW_hungary.59.desc:0 "Розсудливий [FROM.GetLeader] із [FROM.GetNameDef] погодився передати нам території в Галичині та Буковині, наказавши своїм військам відступити з регіону. Ми знову здобули перемогу!"
 WW_hungary.60.desc:0 "Хоч це й не стало несподіванкою, нерозумний [FROM.GetLeader] із [FROM.GetNameDef] привів свої війська у бойову готовність після отримання нашого ультиматуму та надіслав посланника з заявою, що вони не поступляться ні кроком у цій суперечці."
 WW_hungary.62.desc:0 "Імператор [FROM.GetLeader] із [FROM.GetNameDefCap] вимагає від нас відновити правління Ітурбіде-Габсбургів, як це було у 1821–1823 та 1864–1867 роках, і знову коронувати монарха. Це дозволить нам приєднатися до їхнього альянсу без повної втрати незалежності."
 WW_hungary.7.t:0 "[FROM.GetNameDefCap] Вимагає Південну Словаччину"
 WW_hungary.73.desc:0 "Розсудливий [FROM.GetLeader] з [FROM.GetNameDef] погодився передати нам Сілезькі території, наказавши своїм військам відступити. Ще одна перемога за нами!"
 WW_hungary.96.desc:0 "Імпульсивний [FROM.GetLeader] нещодавно засудив нашу, як він висловився, незаконну окупацію [FROM.GetAdjective] Словаччини. Тепер ми отримали ультиматум, а їхні війська накопичуються на кордоні. Як відповімо?"
