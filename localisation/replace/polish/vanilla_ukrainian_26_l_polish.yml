 INSHOL_flag_will_fly_again_desc:0 "Голландський прапор майорів в Ост-Індії століттями, немає світу, в якому ми б дозволили його спустити. Якщо для збереження нашої коронної колонії потрібно надіслати танки та бомбардувальники, то їх буде надіслано!"
