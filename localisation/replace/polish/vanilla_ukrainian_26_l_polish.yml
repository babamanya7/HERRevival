 tfv_south_africa.20.d:0 "Революція досягла успіху в державі [From.GetNameDef]! Новий комуністичний уряд взяв на себе відповідальність за країну і прагне вступити до Комінтерну."
 tfv_south_africa.40.t:0 "Договір про наукове співробітництво з державою [From.GetNameDef]"
 tfv_south_africa.50.d:0 "В Іспанії розгорілася боротьба між націоналістичним урядом і легітимним республіканським урядом. Серед людей точаться значні суперечки про те, на чиїй стороні стоїть наш уряд."
 tfv_south_africa.52.a:0 "Вони допоможуть нам у наступній війні."
 tfv_south_africa.87.d:0 "Звільнившися з-під влади колоніальних гнобителів, [DAH.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [DAH.GetAdjective]ого уряду."
 the_atomic_race_complete_trigger_fail:0 "Країна, яка не є членом [ROOT.GetFactionName], є першою країною, яка завершила $sp_nuclear_bomb$"
 theater_north_africa:0 "Північна Африка"
 tom_phillips:0 "$ENG_tom_phillips$"
 tooltip_for_collapse_button:0 "§GКлацніть§!, щоби згорнути."
 tooltip_launch_all_button_second:0 "Готові до запуску нальоти: $NUM|H$"
 tooltip_raid_disaster_description:0 "§gЯкщо наліт закінчиться §Rкритичною поразкою§!, наші загони не тільки не зможуть дієво вдарити по цілі, але також понесуть нищівні втрати.§!"
 town_class:0 "Клас «Town»"
 trait_BUL_ff_sympathizer_desc:0 "Цей лідер симпатизує Вітчизняному фронту й у разі конфлікту виступить на його боці."
 trait_GRE_stauch_monarchist_desc:0 "Цей лідер поважає і шанує монархію як грецький суспільний устрій."
 trait_reckless_desc:0 "§LХороший офіцер мусить бути на передовій.§!"
