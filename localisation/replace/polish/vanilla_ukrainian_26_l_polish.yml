 PRC_scholarly_revolution_desc:0 "Наші лідери вийшли з інтелігенції, і ми повинні формувати майбутнє [ROOT.GetAdjective]ої держави через їхню призму."
 PRC_secure_the_lands:0 "Убезпечити землі"
 PRC_soviet_economic_aid_desc:0 "Без зовнішньої допомоги наслідки Великого походу відчуватимуться ще одне покоління. Нам слід звернутися до Радянського Союзу за підтримкою."
