 floating_harbor_equipment_1:0 "$floating_harbor_equipment$"
 floating_harbor_equipment_1_desc:0 "$floating_harbor_equipment_desc$"
 form_baltic_sea_empire_category_desc:0 "Встановлення гегемонії над Балтійським морем було протягом тривалого часу однією з наших головних цілей. Ми вели багато воєн, насамперед зі шведами, за контроль над морем. Нарешті здійснивши наші амбіції, настав час встановити [ROOT.GetAdjective]ий Dominium maris Baltici."
 form_byzantine_empire_category:0 "Відновити Візантію"
 form_country_czechoslovakia_coring_states_tt:0 "Усі §Yчехословацькі§! території стануть осердними.\n"
 form_country_sirmium_coring_states_tt:0 "Відповідні §Yюгославські§! землі стануть осердними та будуть перейменовані.\n"
