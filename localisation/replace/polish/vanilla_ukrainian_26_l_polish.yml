 sp_land_military_engineering_vehicles_desc:0 "Спеціалізовані машини для підвищення мобільності на полі бою, будівництва фортифікаційних споруд та подолання перешкод у бойових умовах."
 sp_land_reward_land_cruiser_ammunition_desc:0 "Під час випробувань проєкту «[SpecialProject.GetName]» виникли побоювання щодо безпечного зберігання та перевезення великокаліберних набоїв, оскільки стандартні стелажі не могли безпечно витримати вагу вибухонебезпечних боєголовок. Було запропоновано нову систему зберігання набоїв із використанням посилених перегородок і гідравлічних навантажувачів, що дозволяє безпечніше поводитися з набоями та швидше завантажувати їх у бойових умовах."
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "Гармата проєкту «[SpecialProject.GetName]» щойно успішно завершила знакові випробувальні стрільби, продемонструвавши вражаючу дальність і точність. Це досягнення підняло бойовий дух дослідницької групи та привернуло увагу вищого керівництва, надавши проєкту нового імпульсу та оптимізму щодо його успіху."
