 ss_recruitment_event.4.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що в Бельгії є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS."
 stability.21.desc.a:0 "Новий звіт від Управління війни свідчить про помітне скорочення наявної робочої сили. Схоже, що остання партія призовників набагато менша, ніж очікувалося спочатку. Наразі триває розслідування цієї розбіжності, але перші ознаки вказують на те, що велика кількість людей, фактично придатних до служби, намагаються уникнути призову різними способами. 18-річні студенти несподівано стають кваліфікованими робітниками, зайнятими на критично важливих військових підприємствах, колишні спортсмени провалюють тести на придатність, а в деяких випадках призовники просто безслідно зникають.\n\nКоли людей ловлять і допитують, вони вказують на погані умови в армії, байдужих офіцерів і небажання вмирати за безнадійну справу. Військове керівництво вимагає суворого покарання для тих, хто ухиляється від призову, але багато хто в уряді вважає, що поліпшення умов життя солдатів-строковиків може бути кращим підходом."
 stability.23.e:0 "Оголосімо про мирну ініціативу. Зробімо її неприйнятною для ворога."
 stability.33.desc:0 "Our attempts at resolving the situation through military force have not been met with success. It appears that someone in our administration has leaked our planned operation to the public, which responded quickly. When military police and other law enforcement agencies tried to apprehend known draft dodgers, they found their way blocked by angry mobs, demanding an end to the war and to forced conscription. In several cases, street battles erupted between the police and the protesters, leading to a number of fatalities when the soldiers were forced to use their weapons to defend themselves.\n\nThe situation quickly spiralled out of control after that, as citizens rushed the soldiers and stormed police stations to arm themselves. Several cities in the country are now in a state of armed insurrection against the government. Ironically, the rebels seem to have no issues finding soldiers willing to take up arms."
