 JAP_konoes_first_cabinet_desc:0 "Сенджюро Хаяші розглядається лише як короткостроковий тимчасовий прем'єр-міністр. Принц Фумімаро Коное, аполітичний і вихований генро Сайонджі Кіммочі, є ідеальним кандидатом для стабілізації хаотичної політичної ситуації та духовного об'єднання нації. Настав час йому сформувати власний кабінет, будучи особисто номінованим імператору Хірохіто самим Сайонджі."
