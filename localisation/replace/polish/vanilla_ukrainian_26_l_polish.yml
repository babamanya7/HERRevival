 COG_an_expansionist_state:0 "Експансіоністська держава"
 COG_approach_the_barotse_litunga_desc:0 "Літунга народу Баротсе на південь від нас, Єта II, розділяє багато наших цілей стосовно антикороліалізму. Можливо, було б розумно здобути його довіру та попросити його воїнів допомогти в нашій визвольній боротьбі?"
 COG_assemble_a_regency_council_desc:0 "Рішення наших політичних проблем поки не видно. Жодна конкретна партія чи політик не має достатньої підтримки для того, щоб взяти на себе національне лідерство, і така ситуація не може тривати довго. Нам потрібно зібрати раду, яка спробує запропонувати лідерство певним племінним вождям і монархам, щоб здобути якомога більше легітимності для нашого нового уряду."
