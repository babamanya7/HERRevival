 lar_align_belgium.3.a:0 "Це ми ще подивимося."
 lar_appeal_to_overseas_territories.10.t:0 "Мадагаскар залишається з Віші"
 lar_appeal_to_overseas_territories.11.t:0 "Мадагаскар міняє сторону"
 lar_capture_tito.1.desc:0 "Наша операція, метою якої було взяття в полон або ліквідація Тіто, лідера югославських партизанів, не увінчалася успіхом. Перша хвиля десантників підібралася досить близько до печери, де, як ми підозрювали, переховувався Тіто, але нас зустрів нещадний вогонь переважаючих сил супротивника, не виявлених нашою розвідкою. Наші війська боролися щосили, але вороже підкріплення приспіло раніше, ніж очікувалося. Навіть відчайдушна спроба прориву завершилася провалом. \n\nВижили солдати відійшли до наших кордонів."
 lar_compensate_italy.1.desc:0 "[From.GetLeader] прибув до Рима, щоб обговорити умови угоди, яка може вирішити деякі серйозні розбіжності між нашими народами. Згадавши про давнє братерство двох націй, освячене загальними жертвами у Великій війні, він запропонував передати під наш контроль французький порт Джібуті в обмін на допомогу Франції у війні."
 lar_concessions_to_italy.7.t:0 "[ITA.GetLeader] відмовляється"
 lar_congress_of_paris.6.a:0 "Це невелика ціна."
 lar_decryption_bonus_tt:0 "Ми отримаємо §G+10 швидкості розшифрування§!."
 lar_end_the_occupation.3.b:0 "Ми відповімо на цю образу сталлю і вогнем!"
 lar_fra_join_the_ententes.1.a:0 "Розумна пропозиція."
 lar_low_stability_civil_war.2.t:0 "Повстання реакціонерів!"
 lar_news.10.b:0 "Їх недалекоглядність заважає нам вести війну!"
 lar_news.11.c:0 "Настав час скинути з себе ярмо!"
 lar_news.12.a:0 "Нам потрібні союзники."
 lar_news.14.b:0 "У нас не було іншого вибору."
 lar_news.15.desc:0 "Оскільки споріднені монархістські рухи в державах [SPB.GetNameDef] і [FRA.GetNameDef] набрали вагу вже досить давно, франко-іспанські відносини стали міцнішими і взаємопроникнення зовнішніх політик цих країн збільшилося.\n\nТепер, коли рух легітимистів у державі [FRA.GetNameDef] офіційно оголосив, що король [SPB.GetLeader] — законний спадкоємець французького престолу, той зробив офіційну заяву, проголосивши свій намір носити корону Франції. У відповідь на це легітимістський уряд держави [FRA.GetNameDef початок приготування до пишної церемонії коронації в Реймському соборі."
 lar_news.17.b:0 "Що ж, непогано."
 lar_news.2.desc_independent_communist:0 "Після довгої та жорстокої громадянської війни незалежні іспанські комуністи нарешті перемогли своїх ворогів — республіканців і націоналістів — і захопили повний контроль над Іспанією. В ізольованих вогнищах націоналістичного опору досі йде контролю в раніше націоналістичних районах, але малоймовірно, що вона переросте в масштабний скоординований опір.\n\nКраїна кинула всі сили на відновлення міст і промисловості, що постраждали від війни, нова іспанська комуністична держава вже обрубала всі зв'язки з державою [SOV.GetNameDef], але при цьому запросило всі компартії, що відкидають як сталінізм, так і троцькізм, приєднатися і разом йти вперед, ні на кого не озираючись."
 lar_news.25.a:0 "Це лише початок."
 lar_news.25.t:0 "Королівське весілля у Бразилії"
 lar_news.27.t:0 "Об'єднання Іберії"
 lar_operative_event.2.desc:0 "Працюючи в державі [From.From.GetNameDef], агент [This.GetName] був, очевидно, розкритий [From.From.GetAdjective] контррозвідкою. У своєму останньому повідомленні [This.GetSheHe] заявляє що за [This.GetHerHim] ведеться вороже стеження і [This.GetSheHe] збирається йти в укриття. або когось ще.\n\nЯкщо все пройде успішно, агент [This.GetName] знову вийде з нами на зв'язок через кілька тижнів."
 lar_operative_event.6.t:0 "[From.GetAdjective]ий агент спійманий!"
 lar_portugal_iberian_summit.1.t:0 "Іберійський самміт"
 lar_portugal_navy_mutiny.5_tt:0 "§G[SPD.GetNameDefCap] переведе кораблі ([?POR_ships_revolted]) назад до держави [Root.GetNameDef].§!"
 lar_portugal_promote_monarchist_cause.1.desc:0 "Португальський уряд звертається до бразильських монархістів, підтримуючи пропаганду, що вихваляє принца Педру Енріке і заявляє про його право на бразильський престол. \nНеможна недооцінювати ймовірний вплив, що призведе до повалення уряду."
 lar_portugal_promote_monarchist_cause.5.desc:0 "Бразильський уряд проявив мудрість і підписав згоду на об'єднання наших націй. Могутнє Об'єднане королівство Португалії та Бразилії знову піднімається, і править ним король [Root.GetLeader].\n\nТак нації!"
 lar_portugal_promote_monarchist_cause.5.t:0 "Бразилія погоджується на об'єднання"
 lar_ratify_the_stresa_front.3.desc:0 "[From.GetAdjective]ий уряд несподівано пішов назад і вирішив не дотримуватися своїх зобов'язань за Стрезьким договором. Усі спроби добитися пояснень по дипломатичних каналах зазнали невдачі. [From.GetAdjective]і представники були здивовані тим, що сталося."
 lar_rescue_mussolini.2.desc:0 "Операція зі звільнення Муссоліні увінчалася успіхом. Невеликий загін десантників успішно висадився поряд з готелем і штурмував будинок без єдиного пострілу. Місцева охорона здалася, усвідомивши марність опору. Згодом Муссоліні вилетів на Fiesler Storch і повернувся на дружню територію, звідки поїде на зустріч, де його чекає [GER.GetLeader]."
 lar_spain.24.a:0 "Вони спочивають на лаврах, поки іспанці проливають кров, щоби стримати комуністичну загрозу."
 lar_spain.27.a:0 "Вони послаблюють себе, самі того не розуміючи."
 lar_spain.33.a:0 "Залучити союзників з держави [union_militar_target_state_1.GetName] до Військового союзу."
 lar_spain.35.desc:0 "Лікуючий натовп у Мадриді було важко стримати: після того як країна пробула без монарха більше п'яти років, цього ранку [From.GetSPBkingloc] урочисто в'їхав до столиці. Під радісні крики городян королівська процесія пройшла вулицями міста церкви Святого Ієроніма.\n\nУ ході помпезної церемонії [From.GetSPBking2loc].\n\nХоча наша нація досі здебільшого лежить у руїнах, можливо, новий король послужить об'єднуючою і відновлюючою силою і завдяки йому [From.GetNameDef] вирушить назустріч славному майбутньому."
 lar_spain.41.a:0 "Тоді нам доведеться забрати її силою."
 lar_spain.44.a:0 "[Root.GetLeader] все одно стане королем Франції."
 lar_spain.61.t:0 "Червона Іберія — [From.GetNameDefCap] відкидає пропозицію"
 lar_spain.77.a:0 "Король мертвий. Viva el Rey!"
 lar_spain.89.desc:0 "[From.GetAdjective] уряд несподівано пішов назад і погодився на наші вимоги незалежності. Схоже, він не хоче ув'язати в черговому конфлікті на заході Європи."
 lc_flamethrower_turret_desc:0 "Спеціалізована турель, що вистрілює струменем вогню, ідеально підходить для знищення укріплених позицій, піхоти та місць засідок. Ідеально підходить для ближнього бою в умовах щільного міського забудови."
 lc_heavy_anti_air_platform_desc:0 "Платформа, на якій встановлено кілька висококаліберних зенітних гармат, призначена для захисту від ворожих бомбардувальників і розвідувальних літаків, які загрожують сухопутному крейсеру."
 lc_heavy_naval_guns_desc:0 "Ці потужні гармати військово-морського класу, що є стандартним основним озброєнням для такого масивного броньованого транспортного засобу, пристосовані для прямого протистояння і забезпечують руйнівну вогневу потужність як проти броньованих, так і укріплених цілей."
 lc_light_anti_air_battery_desc:0 "Легка зенітна батарея, призначена для ураження низьколітаючих літаків і захисту транспортного засобу від штурмових вильотів і пікіруючих бомбардувальників."
 left_trade_unionist:0 "Лівий профспілковий діяч"
 left_wing_tt:0 "До влади приходить §Yлівий§! президент"
 liangguang_clique_autonomy_sea_warlord_subject_DEF:0 "Лянгуанська кліка"
 liberal_democratic_paragon:0 "Взірцевий ліберал-демократ"
 liberate_upper_volta:0 "Звільнити державу [VOL.GetName]"
 lifelong_carlist:0 "Довічний карліст"
 light_airframe:0 "Планер легкого літака"
 light_cruiser_4_desc:0 "Обмеження пішли в минуле, і нове покоління легких крейсерів отримало більш потужне озброєння, а також ефективні системи ППО."
 light_tank_destroyer_equipment_2_desc:0 "$light_tank_destroyer_equipment_desc$"
 light_tank_equipment_1:0 "Легкий танк I"
 little_entente_research_group_desc:0 "Скорочення часу дослідження технологій, уже вивчених країнами-членами чеської Малої Антанти."
 logistics_wizard_desc:0 "§LПрипаси ніколи не спізнюються — і не прибувають рано. Їх доставляють саме тоді, коли мені це потрібно.§!"
 march_of_the_eagles:0 "Марш орлів"
 marine_corps_goal_name:0 "Створити корпус морської піхоти"
 marines_expeditionary_support_desc:0 "Наразі неможливо переоцінити очевидну важливість співробітництва між відділами армії. Виділення логістики оперативних груп для наших операцій дійсно робить нас силою, з якою слід зважатися."
 massed_carrier_fleet_carrier_independence:0 "Незалежність авіаносця"
 mazagon_dock_limited:0 "Mazagon Dock Limited"
 mechanical_computing:0 "Механічне обчислювання"
 mechanization_effort_desc:0 "Переосмисливши можливості моторизованої піхоти, ми зможемо просунути обмеження сучасного транспорту."
 medium_tank_artillery_equipment_3:0 "Середня САУ III"
 medium_tank_destroyer_equipment_1_desc:0 "$medium_tank_destroyer_equipment_desc$"
 medium_tank_equipment_1:0 "Середній танк I"
 mexican_ford:0 "Мексиканський Ford"
 mexico.14.desc:0 "[From.GetLeader] відмовляється продати нам Британський Гондурас. [From.GetAdjective]ий уряд вважає, що як база ВМС ця територія марна, і воліє зберегти колонію. Більшість населення там англомовне, так що відмова зрозуміла, хоч і розчаровує."
 mexico.18.b:0 "Що за безглуздість! [Root.GetLeader] сам знає, що краще, він піде на другий термін!"
 mexico.18.title:0 "Починається виборча кампанія"
 mexico.19.r:0 "Валентін Кампа, синдикаліст-залізничник, близький до Лаборди."
 mexico.23.title:0 "Необмежена підводна війна"
 mexico.36.a:0 "Чорт!"
 mexico.40.a:0 "Центральна Америка буде захищена від американської агресії."
 mexico.42.title:0 "Операція «Справедлива справа» пройшла невдало"
 mexico.43.b:0 "Наш суверенітет під загрозою. Це вимагає військової відповіді."
 mexico.50.a:0 "[From.GetLeader] — справжній друг мексиканського народу."
 militarism:0 "Мілітаризм"
 military_police_desc:0 "Підтримує порядок і пригнічує опір на окупованих територіях."
 military_support_for_democratic_civil_war:0 "$military_support_for_fascist_civil_war$"
 military_youth_focus:0 "$military_youth$"
 mio_cat_all_heavy_aircraft_and_modules:0 "Усі технології важкої авіації"
 mio_cat_eq_all_small_plane:0 "Усі малі та палубні літаки"
 mio_header_chassis:0 "Шасі"
 mio_header_engine_and_drive_system:0 "Двигуни та привідні системи"
 mobile_defense_attached_support:0 "Гусенична бойова підтримка"
 modern_blitzkrieg_desc:0 "Сучасний бліцкріг — вінець маневреної війни, він включає всі останні технологічні досягнення і уроки, витягнуті з попередніх доктрин."
 modifier_state_production_speed_rocket_site_factor:0 "Швидкість будівництва §Y$rocket_site_pl_gen$§!"
 momotarou_umi_no_shinpei:0 "Momotaro's Divine Sea Warriors"
 monarchist_puppet:0 "Королівська маріонетка"
 monopulse_radar_desc:0 "З допомогою моноімпульсного радара ми можемо визначати напрямок цілі, порівнюючи сигнали від декількох антен, що поліпшує виявлення."
 monroe_opposition_is_bad:0 "§R[?global.monroe_countries_not_in_support^num]§!"
 mot_recon_desc:0 "Використовуючи легкі вантажівки та мотоцикли, розвідроти можуть діяти на більшій відстані та покривати більший радіус, захищаючи фланги."
 motorized_military_police:0 "Моторизована військова поліція"
 mtg_britain.10.t:0 "Парламент налаштований проти шлюбу"
 mtg_britain.107.d:0 "[From.GetAdjective] представники вибачилися з приводу порушення Вашингтонського морського договору і запевнили нас, що вони скоротили кількість своїх основних кораблів відповідно до його умов."
 mtg_britain.58.t:0 "Хід в області [ENG_blackshirt_march_state.GetName]"
 mtg_britain.7.a:0 "Це довгоочікувана демонстрація підтримки короля."
 mtg_britain.70.b:0 "Вони розкусили, що ми блефуємо. Потрібно відступити."
 mtg_britain.81.a:0 "Вони самі напросилися."
 mtg_britain.85.a:0 "Вони виконують свій обов'язок перед імперією."
 mtg_britain.99.t:0 "Імперська конференція: федерація"
 mtg_exile_government.3.title:0 "[From.GetName] пропонує інтеграцію флоту"
 mtg_exile_government.4.desc:0 "[From.GetAdjective]ий уряд повідомив нам, що вони приймають нашу пропозицію, і відтепер їхні кораблі діятимуть під нашим командуванням."
 mtg_landing_craft_desc:0 "$landing_craft_desc$"
 mtg_netherlands.12.a:0 "Прийнятне рішення для нашого скрутного становища."
 mtg_netherlands.12.t:0 "[From.GetNameDefCap] пропонує контроль над Вест-Індією"
 mtg_netherlands.29.b:0 "Надіслати їм додаткове обладнання."
 mtg_netherlands.35_tt_2:0 "Ми отримаємо цільовий бонус до захисту та атаки проти провідної західноєвропейської держави, якщо воюватимемо з нею.\n"
 mtg_netherlands.41.d:0 "[From.GetNameDefCap] просить, щоби ми поділилися деякими нашими військовими знаннями, що дозволить їм досягти значного розвитку військової доктрини."
 mtg_netherlands.79.t:0 "[From.GetNameDef] відкидає пропозицію про створення федерації"
 mtg_netherlands.9.a:0 "Як недоречно..."
 mtg_news.10.d:0 "[GER.GetAdjective] уряд посилює свій вплив..."
 mtg_news.13.c:0 "Ми уважно стежитимемо за розвитком подій."
 mtg_news.20.t:0 "[ITA.GetAdjective] дипломатична ізоляція"
 mtg_news.56.desc:0 "Після недавнього завоювання американського материка [From.GetLeader] випустив королівський указ, що скасовує посаду президента Сполучених Штатів і заміщає її монархічною структурою, аналогічною тій, що є в державі [From.GetNameDef]. Новий трон король Едуард вирішив віддати своїй дружині, королеві Уолліс, яка відтепер буде відома під тронним ім'ям Уолліс I і правитиме Об'єднаним Королівством Америки від імені чоловіка.\n\nПоки неясно, як саме американська публіка пристосується до цієї нової форми правління."
 mtg_news.58.desc:0 "Після обіцянки [HOL.GetAdjective] королеви Вільгельміни зробити все для повернення династії Гогенцоллернів на німецький трон і звільнення першої німецької землі кайзер повернувся до Німеччини, щоб очолити вже фактично повноцінну громадянську війну. Тим часом\n\n німецькі перебіжчики продовжують переходити на територію, що знаходиться під [HOL.GetAdjective] контролем, щоби боротися за королеву і кайзера, повільно, але вірно зрушуючи тим самим баланс сил. вкрай не схвалюють ситуацію, що склалася."
 mtg_usa_civil_war_democrats.23.desc:0 "Повстанські війська, що пройшли Новою Англією, багато в чому зустрічали як визволителів у Меріленді, Нью-Йорку, Пенсилванії та Нью-Джерсі, а місцеві губернатори наказали поліції та Національній гвардії не втручатися. Усі спроби сконцентрувати сили лоялістів у районі столиці провалилися. [USA.GetLeader] був евакуйований із Вашингтона лише за кілька годин до того, як повстанські війська перекрили всі шляхи. Його моторизована колона попрямувала до Річмонда, штат Вірджинія, а звідти, швидше за все, рушить далі на південь."
 mtg_usa_civil_war_democrats.30.a:0 "Всі вони до одного герої."
 mtg_usa_civil_war_democrats.41.desc:0 "Тепер, коли Бостонське повстання наближається до кінця, багато членів уряду не впевнені, в якому напрямку краще рухатися. Спочатку передбачалося, що уряд Національної оборони МакАртура діятиме лише на час війни. Проте [USA.GetNameDef], як і раніше, перебуває у світі, який стає все ворожішим, і незабаром нас можуть знову втягнути в конфлікт. Лідер фашистів Вільям Дадлі Пеллі офіційно оголосив про повернення до «законного організованого правління», подякувавши МакАртуру за його послуги. Наголошуючи на тому, що під час війни кількість його прихильників зросла, Пеллі назвав себе гідним кандидатом на роль президента та лідера Америки [USA.GetCandidatesFascism2][USA.GetCandidatesFascism]\n\n[USA.GetLeader] раптово погодився скласти повноваження, якщо цього вимагатиме громадськість. Американський народ дивиться на нас в очікуванні — як вчинять решта представників адміністрації?"
 mtg_usa_civil_war_fascists.14.a:0 "Яка неблагонадійність."
 mtg_usa_civil_war_fascists.15.a:0 "Це не привід для серйозного занепокоєння."
 mtg_usa_civil_war_fascists.21.desc:0 "Буквально за кілька годин після того, як перший штат заявив про розрив зв'язків із державою [USA.GetNameDef], за ним були й інші з майже ідентичними деклараціями. Надії на мирне поділ швидко зникли, як у цих штатах сталися запеклі зіткнення з прибічниками єдиної держави. Також було скоєно замахи на низку федеральних чиновників. У деяких випадках прихильників президента [USA.GetLeader] (або просто тих, хто не поділяє захоплення щодо незалежності) лінчував натовп. Тимчасово виконуючий обов'язки глави держави [CSA.GetLeader] назвав ці події «сумними, але зрозумілими заходами з боку цивільних осіб у відповідь на урядові зловживання» і пообіцяв помилувати тих, хто з'явиться з повинною.\n\n Він також зажадав повного виведення всіх федеральних військ з території нової держави та демілітаризованої зони на кордоні з метою «запобігання новим випадкам непорозуміння». Президент [USA.GetLeader] відмовився навіть розглядати таку вимогу і наказав військовим відновити порядок у бунтівних штатах."
 mtg_usa_civil_war_fascists.21.t:0 "Поділ країни"
 mtg_usa_civil_war_fascists.23.t:0 "Розпад Нейтрального блоку"
 mtg_usa_foreign_support.11.t:0 "[From.GetNameDefCap] відмовляється допомагати"
 mtg_usa_foreign_support.14.t:0 "[From.GetNameDefCap] відмовляється тренувати пілотів"
 mtg_usa_foreign_support.2.t:0 "[From.GetNameDefCap] схвалює пожертвування"
 mtg_usa_foreign_support.3.t:0 "[From.GetNameDefCap] відмовляється виділяти будь-які пожертвування"
 mtg_usa_foreign_support.4.desc:0 "Діючи по своїх каналах, ряд членів Срібного легіону зв'язався з нами для переговорів про постачання зброї. Вони щиро переконані, що їхній країні загрожує громадянська війна проти комуністичних елементів, що руйнують американський спосіб життя,\n\nВони просто бажають отримати більше шансів на перемогу і запитують, чи не можемо ми поділитися з ними будь-яким спорядженням."
 mtg_usa_foreign_support.8.desc:0 "Наш агент у державі [From.GetNameDef] повідомляє про разючий успіх. Під час приватного обіду [From.GetLeader] погодився продати нам кілька броньованої техніки в кредит. [From.GetNameDefCap] з великою зацікавленістю стежить за тим, як держава [USA.GetNameDef] веде свої справи, і буде більш ніж щасливо допомогти нам, чим може.\n\nТим не менш, не можна, щоби стало помітно, як [From.GetAdjective] уряд підтримує партію, що ще не прийшла до влади, тому танки будуть доставлені в потрібний момент."
 mtg_usa_north_american_dominion.2.a:0 "Мудрий вибір."
 mtg_usa_protect_south_america.1.desc:0 "На самміті [USA.GetAdjective] столиці [USA.GetAdjective] президент [USA.GetLeader] закликав до створення нової схеми безпеки в Південній Америці. Якщо прояснити дипломатичні терміни, то [USA.GetAdjective] уряд ясно дає зрозуміти, що хоче стати основною діючою силою на континенті, а ми мусимо дотримуватися їхнього політичного керівництва.\n\n На ділі [USA.GetAdjective] дипломати вже чинять тиск за лаштунками і надягають свої рекомендації в конкретні політичні вимоги, на кшталт надання послу США — і лише йому — особливих консультаційних прав та права вето.\n\nЩе більше турбує той факт, що відмова від такої пропозиції, як стверджує президент, вважатиметься ворожою та дестабілізуючою обстановкою дією, яка призведе до серйозних наслідків."
 munckska_karens_member:0 "Член Корпусу Мунка"
 nationalism_desc:0 "Наші люди пишаються тим, що належать до великої нації, і завзято боротимуться, захищаючи свою батьківщину."
 nav_bomber_equipment_desc:0 "Морські бомбардувальники призначені для нальотів на ворожі кораблі."
 naval_air_innovations_focus_desc:0 "Основним завданням морської авіації має стати підтримка нашого славного флоту!"
 naval_effort_tt:0 "Недостатньо комірок для будівництва §Yверфей§!"
 naval_folder:0 "Флот"
 naval_general_support_value_factor:0 "(Кораблі підтримки) Величина підтримки: $RIGHT|+=%$"
 naval_gunfire_support_green_water_operations:0 "Операції у прибережних водах"
 naval_ship_recovery_chance_factor_tt:0 " $MODIFIER_NAVAL_SHIP_RECOVERY_CHANCE_FACTOR$: $RIGHT|+=%2$"
 naval_strike_torpedo_tactics_desc:0 "Навчивши пілотів більш точно запускати торпеди, ми підвищимо ефективність наших нальотів на ворожі кораблі."
 navy_chief_naval_gunnery_designer_1:0 "Конструктор корабельних гармат\n(спеціаліст)"
