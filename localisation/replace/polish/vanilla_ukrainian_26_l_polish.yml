 GER_influence_countries_cat:0 "Розширити [ROOT.GetAdjective]ий вплив"
 GER_influence_countries_cat_desc:0 "Втручаючись у внутрішню політику стратегічно важливих країн, ми можемо залучити їх у сферу свого впливу."
 GER_inner_circle_himmler.00.b:0 "Зосередитись на вдосконаленні розвідки"
 GER_inner_circle_himmler.00.desc:0 "Гіммлер здобув значний вплив на німецьку політику та прийняття рішень після того, як взяв під контроль СС і гестапо. Хоча це робить його впливовою фігурою в справах Рейху, він має лише обмежений час для зміцнення однієї з цих організацій. Питання в тому, яка з них матиме пріоритет?"
 GER_integrate_war_economies_tt2:0 "Якщо §Y[ROM.GetName]§! та §Y[Root.GetName]§! — союзники, вони отримають по §Y4 військові заводи§!, а §Y[ROM.GetName]§! стане маріонеткою держави §Y[Root.GetName]§!.\n"
 GER_intelligence_coordinator:0 "Координатор розвідки"
 GER_intervene_in_spain_desc:0 "Наш обов’язок — допомогти нашим товаришам в Іспанії у боротьбі з фашистськими силами. Відправка досвідчених солдатів буде безумовно цінною."
