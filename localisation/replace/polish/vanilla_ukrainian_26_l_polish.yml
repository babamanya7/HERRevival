 GOE_RAJ_generals.4.b:0 ""
 GOE_RAJ_loyalist.14.desc:0 "Сьогодні вранці ми отримали посланця від [FROM.GetNameDef]. Їхній уряд просить дозволу на експлуатацію [BRM.GetAdjective] $state_resource_tungsten$ у [288.GetName] для підтримки їхніх зростаючих військових зусиль. Ми повинні вирішити, як ми маємо діяти з такою пропозицією, оскільки її не можна сприймати легковажно."
 GOE_RAJ_navy.8.t:0 "[ENG.GetNameDefCap] приймає нашу торговельну пропозицію!"
 GOOD_ARMOR_ATTACK_DESC_ORG:0 "\nАтакуючи ворожу дивізію, яка зможе пробити менш ніж §H50%§! нашої бронетехніки, ми нанесемо додаткову шкоду."
 GREATER_LIT_fascism:0 "Велика Литва"
 GRE_AI_BEHAVIOR:0 "@GRE Греція"
 GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_STANDARD:0 "Основа фінансової стабільності Балкан"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_BYZANTINE:0 "Ми перемогли! Після стільки років Візантія нарешті помстилася! Повернувши собі стару столицю імперії, ми стали на крок ближчими до здійснення того, що накреслено долею! Ми стоїмо на порозі нової епохи Греції — епохи, народженої з крові та вогню! Космідісі Нікас!"
 GRE_a_socialist_economy:0 "Соціалістична економіка"
 GRE_abandon_the_greek_turkish_naval_treaty:0 "Скасувати Греко-турецьку морську угоду"
 GRE_ally_the_anatolian_fascists_tt:0 "£faction_gre_fascist §YФашисти§! стануть §Gдружніми§!! \nСоюз із §YНСГ§! потягне за собою §Rсерйозні наслідки§! після скликання §YІракліонської конвенції§!."
