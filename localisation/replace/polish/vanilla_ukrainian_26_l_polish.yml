 concentrated_industry4_desc:0 "Розміщуючи ключові точки виробництва близько один до одного, ми збільшимо їх ефективність."
 congo_independence_struggle.18.d:0 "Здається, що наш ультиматум був сприйнятий з належною серйозністю нашим колонізатором, тому сьогодні ми отримали підписаний акт про незалежність від колоніальної адміністрації. Вже почалися плани щодо офіційного спуску [BEL.GetAdjective] прапора, і з ним — мирна передача влади нашому новому режиму. Хоча наша основна мета досягнута, справжня робота по формуванню уряду тепер тільки починається. Нам ще багато чого треба зробити: розвивати економіку, нормалізувати відносини з іншими країнами, і, звісно, віддати певні борги тим, хто підтримав нас у досягненні цієї мрії."
