 SOV_memories_of_1905_desc:0 "Війна 1905 року все ще залишається чорною міткою в колективній пам'яті нашого народу. Ми повинні скористатися цим і закликати робітників до монументальних зусиль зі створення нового флоту, з яким ми зможемо домінувати на Тихому океані — і розпалити полум'я їхньої ненависті, щоб вони закликали використати його для помсти нашим старим ворогам."
