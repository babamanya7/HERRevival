 RAJ_battaglione_azad_hindoustan_desc:0 "Італія сформувала Battaglione Azad Hindoustan — батальйон, що складається з колишніх індійських військовополонених. Навчені проникнення, організації диверсій та десантування, бійці батальйону можуть сильно підштовхнути національну гордість громадян."
 RAJ_carrier_4:0 "$ENG_carrier_4$"
 RAJ_congress_demands_decrease_decision_cost_reached_min_tt:0 "Витрати на рішення для кампаній досягли мінімального значення (§R20§! £pol_power£)."
 RAJ_conquerors_of_iraq_desc:0 "Ірак колись був життєво важливим перехрестям торгівлі та влади в імперії Тимура, і його багатства підживлювали нашу минулу славу. Тепер він знаходиться в руках менш гідних правителів, негідних його спадщини. Повернувши Месопотамію під наше панування, ми забезпечимо стратегічну серцевину, контролюватимемо ворота між Сходом та Заходом і нагадаємо світові, що Тимуриди не просять — вони забирають."
 RAJ_crossley_motors_organization:0 "Crossley Motors — індійський відділ"
 RAJ_crown_commodities:0 "Товари Корони"
 RAJ_cv_fighter_equipment_3_short:0 "Firefly"
 RAJ_defense_of_malaya_desc:0 "[MAL.GetNameDef] може бути під загрозою вторгнення, враховуючи її розташування між Індійським та Тихим океанами. Як ще одна перлина Корони, ми повинні зробити свій внесок, щоб допомогти захистити та зміцнити регіон. Ми повинні зберегти контроль над Південно-Східною Азією."
 RAJ_desert_training_desc:0 "У рамках наших зусиль з покращення навичок та ефективності наших бойових сил, ми можемо запровадити тренувальний режим у пустелі Тар та навколо неї. Це має допомогти нашим військам адаптуватися до посушливих умов."
 RAJ_expand_mazagon_dock_desc:0 "Верф Мазагон у Бомбеї — наша головна суднобудівна компанія на західному узбережжі. Ми мусимо розширити її з урахуванням поточної світової кризи."
 RAJ_expand_the_zamindari_system:0 "Розширити систему заміндарів"
 RAJ_fascism_party:0 "ВІЗ"
 RAJ_five_year_plan_tt:0 "Завершення або §YАграрного соціалізму§!, або §YМіського індустріалізму§! змінить П'ятирічний план"
 RAJ_for_the_people_by_the_people_desc:0 "Наш фокус буде на зміцненні піхоти, артилерії та допоміжних дивізій, щоб створити армію, справді вкорінену у волі народу."
