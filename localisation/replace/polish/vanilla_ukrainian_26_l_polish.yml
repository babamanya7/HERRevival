 DEN_increase_maritime_trade_desc:0 "Майбутнє лежить у відкритих морях і за нашим торговим флотом, який експортуватиме нашу продукцію далеко і широко. Наша країна може бути невеликою за чисельністю населення та політичним впливом, але ми можемо стати великою торговельною державою."
 DEN_increase_produce_production_desc:0 "Наші реінвестиції окупилися, і всі — від невеликих фермерських господарств до великих кооперативів — процвітають. Зараз ми добре підготовлені до того, щоб збільшити виробництво продуктів харчування ще більше."
