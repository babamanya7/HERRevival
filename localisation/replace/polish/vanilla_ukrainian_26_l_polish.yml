 PRC_equipment_from_copper_coins_desc:0 "Оскільки нам бракує великої гірничодобувної промисловості, мідні монети можна переплавляти та використовувати для куль або інших матеріалів."
 PRC_establish_pla_navy_desc:0 "Через відсутність у нас виходу до узбережжя в минулому, перед нами стоїть важке завдання наздогнати військово-морські сили наших ворогів. Флот дозволить нам не лише захистити наше узбережжя та новознайдені торгові зв'язки, але й поширити наш вплив через моря."
