 ETH_assertiveness_tt:0 "Якщо фокус §Y$ETH_sway_the_warlords$§! був виконаний, а країна є §Y$jimma_RU_Inst$§!:\n§Y$ETH_balcho_safo$§! та §Y$ETH_tadesse_birru$§! стануть лояльні."
