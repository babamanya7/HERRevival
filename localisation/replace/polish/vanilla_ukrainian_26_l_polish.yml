 DOD_hungary.10.t:0 "Австро-Угорщина пропонує гарантії"
 DOD_hungary.100.a:0 "У нас немає вибору."
 DOD_hungary.103.t:0 "Угорщина хоче розділити державу [CZE.GetNameDef]"
 DOD_hungary.104.t:0 "[GER.GetLeader] погоджується"
 DOD_hungary.120.desc:0 "[HUN.GetLeader] вирушив до Москви з пропозицією забезпечити спільні гарантії державі [CZE.GetNameDef] в обмін на зняття обмежень з комуністичної партії та передачу Південної Словаччини під контроль Угорщини."
 DOD_hungary.13.t:0 "[CZE.GetNameDefCap] відкидає пропозицію"
 DOD_hungary.145.d:0 "Італія."
 DOD_hungary.147.b:0 "Нам видніше, що краще для нас."
 DOD_hungary.151.b:0 "Звернутися до Італії"
 DOD_hungary.153.t:0 "Конкурс на [From.GetAdjective] винищувачі"
 DOD_hungary.34.desc:0 "Посол держави [From.GetNameDef] ясно давши зрозуміти, що його уряд незадоволений нашим рішенням відмовити Угорщині у проханні доозброїти армію. Він також зазначив, що, якщо ми продовжимо наполягати на цьому рішенні, його уряд врахує нашу позицію при обговоренні дипломатичних питань, які можуть виникнути між нашими країнами в майбутньому. Іншими словами, вони готові поставити на дружні відносини з нами."
 DOD_hungary.63.desc_HUN_refused:0 "Незважаючи на всі наші зусилля, ми не змогли знайти тих, хто підтримав би наші домагання. Від нас відвернулися всі країни, до яких ми звернулися. Нам радили визнати, що Трансільванія є частиною Румунії. \n\nАле як можна визнати те, що просто неприпустимо?"
 DOD_hungary.73.b:0 "Віддати північну Трансільванію Угорщини."
 DOD_hungary.80.a:0 "Нам не перемогти в такій війні. Краще віддати землі."
 DOD_hungary.86.a:0 "Одними словами війну не виграти."
 DOD_romania.30.a:0 "Вони отримають наші гарантії."
 DOD_romania.63.a:0 "Цікавий маневр."
 DOD_romania.67.t:0 "Ультиматум Югославії"
 DOD_romania.86.a:0 "Підписаний контракт не можна змінити."
 DOD_yugoslavia.10.desc:0 "Країною розноситься новина про те, що ми оголосили війну Німеччині, але далеко не всі жителі готові стати під рушницю, щоби дати відсіч агресору. Багато частин хорватської армії відмовилися виконати наказ і висунутися до кордону, а в деяких випадках навіть відкривали вогонь частинами, що виконували цей наказ.\n\nСхоже, ми залишилися без підтримки хорватів, що щонайменше ускладнює оборону нашого кордону з Німеччиною."
 DOD_yugoslavia.183.t:0 "Панбалканське ополчення"
 DOD_yugoslavia.34.desc:0 "Ми зайняли чільне становище у Європі. Франція тривалий час була гарантом стабільності Південно-Східної Європи, але ми можемо захопити весь цей регіон. Якщо ми втягнемо всі його нації до нашої орбіти, більше ніхто не зможе нам перешкодити. \n\nНастав час повідомити югославам про те, що вони мають зробити вибір. Якщо вони не приєднаються до нас, ми зітремо їх з лиця землі."
 DOD_yugoslavia.36.desc:0 "Незважаючи на наші регулярні заклики вибрати одну зі сторін, [YUG.GetLeader] та його уряд все ще чіпляються за думку про те, що Югославія зможе зберегти нейтралітет у цьому конфлікті. Тепер вони пізнають ціну своєї малодушності."
 DOD_yugoslavia.50.e:0 "Іспанська принцеса Марія-Франсуаза."
 DOD_yugoslavia.60.peter:0 "Уперше з початку ХХ століття монарх держави [YUG.GetNameDef] коронований у Белградському соборі. Церемонія пройшла зі світським відтінком, що відображає релігійну різноманітність сучасної Югославії. Не всі згодні з тим, що король Петар може правити в такому юному віці, але тепер він носить корону, і майбутнє Югославії, чи до добра, чи на погане, знаходиться в його руках."
