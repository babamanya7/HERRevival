 POR_latin_american_communism_desc:0 "Ми повинні досягти латиноамериканських народів. Звертаючись до присутніх там комуністичних елементів і підтримуючи їхні зусилля щодо поширення ідеї єдиного міжнародного блоку, ми створимо основи союзу між американськими та європейськими соціалістами."
