l_polish:
 AAT_Sweden.1.desc:0 "У 1930 році держава призначила парламентське розслідування, щоб надати рекомендації щодо майбутніх оборонних витрат Швеції. Партія фермерів разом з поміркованими наполягають на збільшенні витрат, у той час як прем'єр-міністр Пер Альбін Ганссон із партії соціал-демократів рішуче виступає проти цього, заявляючи, що такий крок зашкодить його баченню соціальних реформ.\nНа тлі все більш загрозливої риторики з боку сусідів, розслідування зараз твердо стоїть на боці правих партій. Він заявив, що «недбалість в обороні суперечила б інтересам держави та її народу».\n\nЦе спричинило урядову кризу, а Пер Альбін Ганссон погрожує піти у відставку, доки він не зможе зміцнити свою базу на майбутніх виборах 1936 року.\n\nТим часом ми повинні призначити когось, хто очолить країну до майбутніх виборів."
 AAT_Sweden.13.b:0 "Це все належить державі [THIS.GetNameDef]."
 AAT_Sweden.15.t:0 "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 AAT_Sweden.2.t:0 "Вотум недовіри"
 AAT_Sweden.27.t:0 "[SOV.GetNameDefCap] відмовляється від своїх претензій на область [?146.GetName]"
 AAT_Sweden.3.t:0 "Загальні вибори у Швеції 1936 року"
 AAT_Sweden.53.t:0 "Питання держави [NOR.GetName]"
 AAT_Sweden_BoP.11.b:0 "Кращий доступ до освіти та медичної допомоги виведе людей з бідності."
 AAT_Sweden_ball_bearing.4.desc:0 "Держава [SWE.GetNameDef] звернулася з проханням обміняти їхні безцінні кулькові вальниці, які були би значним ресурсом для нашої війни, на наші наукові ноу-гау і досягнення. [SWE.GetAdjectiveCap]ий уряд, схоже, шукає способи отримати перевагу в можливому конфлікті за допомогою наукового прогресу, в чому ми, безсумнівно, можемо їм допомогти."
 AAT_Sweden_ball_bearing.4.t:0 "[SWE.GetNameDefCap] просить знання в обмін на кулькові вальниці"
 AAT_Sweden_ball_bearing.5.t:0 "[FROM.GetNameDefCap] прймає торгівлю кульковими вальницями"
 AAT_Sweden_communism.2.desc:0 "Результатом урядового розслідування діяльності військових стало досьє, яке пов'язує кількох високопоставлених командирів з підпільним фашистським рухом, що має на меті повалити обраний уряд. У доповіді зазначається, що військова риторика щодо політичного курсу країни стала ще більш сміливою, тож рекомендується вжити заходів проти них."
 AAT_Sweden_flashpoints.10.desc:0 "Мешканці Паяли, села поблизу [FIN.GetAdjective]ого кордону, сьогодні були налякані серією вибухів, які спричинили руйнування багатьох будівель і транспортних засобів. На щастя, ніхто серйозно не постраждав. Докази чітко вказують на те, що вибухи були спричинені [SOV.GetAdjective]ими бомбардувальниками, які помилково прийняли цю територію за ціль у державі [FIN.GetName].\n\nМи мусимо розібратися в ситуації, перш ніж громадські настрої вийдуть із-під контролю. Однак ми також мусимо остерігатися провокування ширшого конфлікту з державою [SOV.GetNameDef]."
 AAT_Sweden_flashpoints.13.t:0 "[SOV.GetNameDefCap] вибачається за бомбардування Паяли"
 AAT_Sweden_flashpoints.18.a:0 "[SOV.GetLeader] блефує, і ми на це не поведемося. Продовжуйте поставки."
 AAT_Sweden_flashpoints.19.t:0 "[SWE.GetName] відхиляє ультиматум"
 AAT_Sweden_flashpoints.33.t:0 "[GER.GetLeader] ставить під сумнів [SWE.GetAdjective]ий нейтралітет"
 AAT_Sweden_flashpoints.34.desc:0 "[SWE.GetAdjectiveCap]і військові були приведені в стан підвищеної готовності в навмисно провокаційний спосіб, щоби продемонструвати свою готовність опиратися нашому тиску на них. Ми мусимо діяти обережно, інакше ризикуємо втягнути себе в іще один конфлікт у Скандинавії."
 AAT_Sweden_flashpoints.53.desc:0 "Спорадичне насильство останніх тижнів тепер збирається в організовані рухи по всій країні. Більшість цих рухів пов'язані зі Шведською комуністичною партією і навіть можуть бути пов'язані з державою [SOV.GetNameDef].\n\nКомуністичні ополчення захопили контроль над низкою урбанізованих районів і почали арештовувати всіх, хто пов'язаний із нашими нещодавніми планами щодо затримання лівих. Тим часом націоналісти, часто за підтримки місцевої поліції, також формують ополчення, щоби запобігти переходу їхніх міст під контроль комуністів. Насильство між обома групами та нашими військовими зросло до такої міри, що його можна вважати нічим іншим, як громадянською війною."
 AAT_Sweden_flashpoints.61.a:0 "Побачимо, як вони впораються без нашої торгівлі."
 AAT_Sweden_flashpoints.64.b:0 "Ми впораємося й без них."
 AAT_Sweden_flashpoints.64.desc:0 "Держава [SWE.GetNameDef] чітко відкинула наш ультиматум. Уряд заявив, що всякий напад на них не надасть їм доступ до [SWE.GetAdjective]им рудним запасам, оскільки шахти буде знищено задовго до того, як нашща армія зможе їх зайняти."
 AAT_Sweden_nationalists.18.a:0 "Таким чином ми відновимо авторитет короля."
 AAT_Sweden_nationalists.25.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 AAT_Sweden_nationalists.28.a:0 "$AAT_Sweden_nationalists.21.a$"
 AAT_Sweden_nationalists.4.a:0 "$SWE_sven_olov_lindholm$ здатний зконсолідувати всіх."
 AAT_Sweden_nationalists.4.b:0 "$SWE_birger_furugard$ є наконований долею лідер держави [SWE.GetName]."
 AAT_britain_narvik.3.desc:0 "[ENG.GetNameDefCap] незаконно вторглася на територію держави [SWE.GetName] та знищила їхні шахти без належного оголошення війни. Ключовий економічний двигун [SWE.GetAdjective]ої економіки тепер є лише зруйнованим кар'єром. [ENG.GetAdjective]ий уряд виправдовує свої дії, стверджуючи, що торгувати з державою [GER.GetNameDefCap] так само погано, як і бути на їхньому боці, і що дії є виправданими, але здається, що навіть їхнє внутрішнє населення не погоджується з поясненнями уряду."
 AAT_finland_continuation_war.05.desc:0 "Наші прораховані дипломатичні маневри і військове планування принесли свої плоди: держава [FROM.GetNameDef] нарешті розпочала операцію “Барбаросса” — вторгнення в державу [SOV.GetNameDef]. Тепер ми повинні згадати про свої зобов'язання і привести у виконання свою частину плану."
 AAT_finland_continuation_war.11.a:0 "Почати операцію “Береза”"
 AAT_finland_continuation_war.12.desc:0 "[FIN.GetLeader], лідер держави [FIN.GetNameDef], звернувся до нас сьогодні з дуже цікавою пропозицією. Він стверджує, що держава [FIN.GetName] готова закінчити війну з державою [SOV.GetNameDef], оскільки та розгортається не на їхню користь, і пропонує дозволити нам висадитися в Петсамо, вступити до нашого союзу, щоб разом вигнати [GER.GetAdjective]і війська зі Скандинавії та покласти край державі [GER.GetNameDef] раз і назавжди. Що ми на це відповімо?"
 AAT_finland_diplomacy.07.b:0 "Ми повинні подбати про саамів!"
 AAT_finland_diplomacy.10.desc:0 "На жаль, [FROM.GetAdjective]ий лідер [FROM.GetLeader] не вирізняється прозорливістю і не бачить небезпеки в акулах, що кружляють біля скандинавського багатства. [FROM.GetLeader.GetHerHis] уряд недвозначно заявив нам, що наші війська повинні залишатися по наш же бік кордону, і застерег нас від подальшого розвитку цієї теми. Зрозуміло, наші цілі залишилися незмінними, і, хоч би що стверджували сусіди, нам, як і раніше, потрібні ресурси, щоб гарантувати безпеку — свою та всіх, хто там мешкає."
 AAT_finland_diplomacy.19.t:0 "[FROM.GetAdjective]ий уряд відхиляє вимоги"
 AAT_finland_diplomacy.20.t:0 "[FROM.GetAdjective]а пропозиція фінсько-[ROOT.GetAdjective]ого пакту"
 AAT_finland_diplomacy.25.a:0 "Удача залишила нас!"
 AAT_finland_diplomacy.26.desc:0 "[FIN.GetLeader], лідер держави [FIN.GetNameDef], шукає захисту від держави [SOV.GetNameDef], яка вперше з часів громадянської війни почала з цікавістю поглядати на землі сусідів. В обмін на захист від загрози нам пропонують права на видобуток [FIN.GetAdjective]их природних ресурсів."
 AAT_finland_misc_events.01.desc:0 "Бушує [GetFinnishWinterWarOrNot], і [ROOT.GetAdjective]ий уряд прийняв непросте рішення евакуювати наших дітей в область [GetFinnishChildrenDestination], щоб врятувати від постійної небезпеки...\n\nЕвакуація зажадала колосальних зусиль: багато родин виявилися розділеними, дітей вивезли з рідних домівок, але ми маємо пам'ятати, що їхня безпека важливіша за все, і треба зробити все, щоб уберегти їх. \n\nПоки [ROOT.GetAdjective]ий народ зазнає труднощів війни, ми повинні зберігати в серцях надію і віру в те, що наші діти будуть у безпеці й отримають у ці непрості часи турботу. Можливо, на нас чекає довгий і непростий шлях, але ми повинні витерпіти все і бути стійкими перед лицем негараздів."
 AAT_finland_misc_events.06.t:0 "[FROM.GetAdjective]і військові вкладення в державу [ROOT.GetName]"
 AAT_finland_national_defense.02.t:0 "[FIN.GetAdjective]і схованки зі зброєю захоплені в області [FROM.FROM.GetName]"
 AAT_finland_political.07.a:0 "Маннергейм впорається з ситуацією!"
 AAT_finland_the_white_death.4.b:0 "Біла Смерть — це збірне прізвисько всієї Фінляндії, а не окремої людини!"
 AAT_finland_the_white_death.8.desc:0 "Від наших офіцерів у державі [FIN.GetNameDef] надійшли повідомлення про поранення Білої Смерті. Це досягнення, однак, далося дорогою ціною — багато солдатів було вбито в процесі і ще більше поранено. Проте навряд чи наш заклятий ворог тепер повернеться в стрій."
 AAT_finland_winter_war.05.desc:0 "Ці дурні з держави [FROM.GetNameDef] відповіли відмовою на нашу щедру пропозицію миру. Вони помилково переконані, що їхні нещодавні втрати — лише прикра випадковість і скоро все зміниться. Ми розуміємо, що це абсолютна брехня, вигадана, щоб захистити уряд від гніву народу, але скоро істина все одно стане очевидною. \n\nНаші солдати залишаються на полі бою, їхній дух, як і раніше, високий, вони знають, що б'ються за праве діло, і готові битися далі."
 AAT_finland_winter_war.06.b:0 "Та як вони сміють?!"
 AAT_nordic_shared.2.b:0 "Ми не дозволимо їм потягти нас за собою."
 AAT_nordic_shared.4.desc:0 "Століття спільної історії, схоже, не мають великого впливу на переконання [FROM.GetAdjective]ого уряду в тому, що наш народ повинен об'єднатися проти іноземних тиранів. Будемо сподіватися, вони змінять свою думку до того, як стане занадто пізно."
 AAT_norway_communist.8.desc_ENG:0 "Норвезька королівська родина була пов'язана з нашою протягом багатьох років: королева Вікторія влаштувала весілля своєї онуки Мод з майбутнім королем Гоконом VII, а потім принцом Данії Карлом.\n\nНа жаль, революція скинула їх з престолу, і оскільки Данія більше не є варіантом, вони були змушені шукати притулку тут, в державі [ROOT.GetName]."
 AAT_norway_fascist.1.t:0 "[FROM.GetAdjectiveCap]а «Національна єдність» хоче, щоби ми вторглися в їхню країну!"
 AAT_norway_monarchist.4.desc:0 "Можливо, ми ніколи не дізнаємося, що відбувалося за зачиненими дверима королівського палацу, але королівський уряд Норвегії оголосив, що королева Мод, королева-консорт покійного короля Гокона, відтепер правитиме королівством, взявши ім'я Матильди I. Це особливо незвично, оскільки наступним у черзі на престол був принц Олав, але, схоже, він віддає перевагу цій домовленості, щоб і надалі зосереджувати свою увагу на військових зусиллях. Крім того, вона все ж таки онука королеви Вікторії, тож вона просто піде по її стопах і за законами престолонаслідування своєї батьківщини.\n\nСлід також зауважити, що ім'я маркіза Веделя-Ярлсберга не згадується в жодному з публічних оголошень; його роль у новому режимі невідома, так само як і його місцезнаходження."
 AAT_norway_rikstanken.10.a:0 "Нарешті, норвезькі танки!"
 AAT_norway_rikstanken.5.desc_GER:0 "Представники [FROM.GetAdjective]ої адміністрації хочуть придбати велику кількість наших чудових легких танків.\n\nКрім того, вони виявили інтерес до принципів нашої ідеології і хочуть показати своєму населенню, як виглядає [ROOT.GetRulingIdeologyNoun_RU_lower_Nom] у своєму зеніті, щоби поширити його в своїй країні."
 ABDA_abdacom_desc:0 "З огляду на швидке просування ворожих сил у Південно-Східній Азії та Тихому океані, союзні сили в регіоні повинні діяти як єдине ціле, щоб стримати їх. Створивши об'єднане верховне командування, ми зможемо об'єднати наші ресурси, скоординувати наші військово-морські активи та виступити єдиним фронтом проти ворога."
 ABDA_develop_naval_infrastructure:0 "Розвиток військово-морської інфраструктури"
 ABDA_ship_a_day_sinking_quotas:0 "Квота на затоплення корабля на день"
 ACCLIMATIZATION_DESCRIPTION:0 "Коли дивізія перебуває в жорстких умовах, вона отримує акліматизацію, яка зменшує відповідні штрафи."
 ADDRESS_LINE_1:0 "Адресний рядок 1"
 ADD_GOAL_TT_ALREADY_COMPLETED:0 "§RЦіль уже виконано§!"
 AFG:0 "Афганістан"
 AFG_accelerate_integration:0 "Посилити Конфедерацію"
 AFG_ally_the_sikhs:0 "Союз із сикхами"
 AFG_asymmetric_warfare_desc:0 "У той час як наші сусіди задоволені тим, що відкидають свою спадщину в гонитві за індустріалізацією та дедалі більшими збройними силами. Ми здолаємо їх через використання нетрадиційної тактики та чудового знання нашої місцевості. У поєднанні з рішучістю наших солдатів, ми відіб'ємо будь-яку силу вторгнення."
 AFG_bill_of_rights_desc:0 "Наш народ заслуговує на кодифікований документ про свої права згідно із законом."
 AFG_caliph_trait:0 "Халіф"
 AFG_crown_the_golden_emir_desc:0 "Зі встановленням контролю над територією новий правитель має зійти, щоб претендувати на титул Еміра. Довівши себе на полі бою, не дивно, що Мірзалі Хан Вазір є найпопулярнішим кандидатом. Він допоможе нам возз'єднати Пуштуністан та об'єднати ісламський світ."
 AFG_disgruntled_minority_desc:0 "Пуштуни можуть домінувати в Афганістані за чисельністю, але вони не єдина група в нації з багатою історією, культурою та самобутньою ідентичністю. Таджики, узбеки та багато інших на півночі Афганістану не повинні бути забутими, інакше вони можуть об’єднатися і повалити чинний режим, як це було в минулі десятиліття."
 AFG_establish_radio_networks_desc:0 "Радіо Кабул було засноване у 1920-х роках із застарілим обладнанням. Ми повинні інвестувати в оновлення його мовного обладнання, щоб забезпечити прямий зв'язок уряду з якомога більшою кількістю населення."
 AFG_expel_allied_nationals:0 "Вислати громадян Союзників"
 AFG_exploit_turko_persian_heritage_desc:0 "На нашу націю протягом століть сильно впливала як [PER.GetAdjective], так і [TUR.GetAdjective] культура. Ми повинні вивести це на перший план нашої політики та сформувати нову тюрко-перську ідентичність, яку можна використовувати для встановлення почуття єдності з нашими сусідами."
 AFG_gant_refuge_to_jadidists:0 "Надати притулок джадидистам"
 AFG_generic_american_2:0 "Роберт Джонсон"
 AFG_industrial_events.35.b:0 "Якщо вони не можуть бути розумними, немає сенсу продовжувати переговори."
