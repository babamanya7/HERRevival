 ecole_militaire_haile_selassie_1er:0 "École Militaire Haile Selassie 1er"
 election.17.d:0 "Хоча [Root.GetLeader] змушує мовчати більшість своїх опонентів, декотрі з них усе ще висловлюються про нещодавні вибори, звинувачуючи партію [Root.GetRulingParty] у фальсифікації результатів та ігноруванні явних зусиль, спрямованих на обрання парламенту, який би протистояв їхній політиці.\n\nУряд відмахується від цих заперечень, називаючи їх спробою розділити народ проти себе. Однак факт залишається фактом: більша частина народу, схоже, має сумніви щодо їхнього правління; опозиція, хоча поки замовкла, висловила свою позицію."
 election.7.t:0 "Фашисти впливають на зовнішню політику"
 elyesa_bazna_desc:0 "§H$TUR_elyesa_bazna$§! широко відомий під своїм кодовим ім'ям «Cicero»."
 emergency_factory_conversion_defensive_desc:0 "На фронті вкрай необхідно більше оснащення. Нам терміново треба переобладнати більше заводів, щоби виробляти зброю й техніку для захисту нашої країни."
 emperor_of_the_purple_forbidden_city:0 "Імператор Пурпурового Забороненого міста"
 engine_2_6x:0 "6 двигунів II"
 entrenched_old_guard_spirit_desc:0 "Хто цей бовдур і чому він говорить свої дурниці про «літаки»?"
 ernst_thalmann:0 "$GER_ernst_thalmann$"
 escort_patrols_desc:0 "Поліпшені засоби виявлення роблять наші кораблі супроводу помітно небезпечнішими для підводних човнів. Їм ніде сховатися, а значить, вони не становлять реальної загрози."
 exile_extraction_campaign_desc:0 "Хоча при капітуляції [From.GetAdjective]ого уряду більшість армійських частин були взяті в полон та інтерновані, у державі [From.GetNameDef] ще залишаються демобілізовані війська, які з радістю скористаються можливістю залишити окуповані регіони та допомогти нам під час війни. Ми підготуємо плани евакуації цих військ, потім озброїмо їх і навчимо боротися за Батьківщину."
 expand_french_air_force_desc:0 "У майбутній війні багато що вирішуватиме перевагу в повітрі — поразка в повітряних битвах майже неминуче означатиме поразка самої Франції. Ми мусимо збільшити чисельність ВПС і простежити за тим, щоб у Франції була найкраща військова авіація у світі."
 expand_wake_island_bases_goal_name:0 "Розширити бази Уейка"
 expeditionary_warfare_landing_operations:0 "Десантні операції"
