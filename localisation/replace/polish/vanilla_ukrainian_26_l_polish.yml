 INS_republic_founded:0 "Республіка Індонезія заснована"
 INS_resist_occupation_tt:0 "Цей фокус буде автоматично завершено, якщо на нас нападуть і ми не здамося."
 INS_restore_order_in_indies_desc:0 "Зростаючий націоналістичний рух в Ост-Індії дестабілізував кілька регіонів і може вийти з-під контролю, якщо ми його не зупинимо. Ми повинні зробити відновлення порядку та стабільності нашим головним пріоритетом."
 INS_revolution_events.14.t:0 "Ополченці окупують [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.2.desc:0 "[HOL.GetLeader] скликав екстрену зустріч з нашими лідерами, вимагаючи надати подальшу допомогу у відвоюванні Індії, аж до безпосереднього вступу в конфлікт. [HOL.GetLeader] заявив, що ситуація жахлива, і голландські сили не здатні відкинути революційні ополчення. [HOL.GetLeader] обіцяє, що якщо ми їм допоможемо, нам віддадуть Борнео як плату."
 INS_revolution_events.22.a:0 "Хоча допомога буде дорого коштувати, Суматра цілком може того вартувати."
 INS_revolution_events.25.desc:0 "Сили [HOL.GetAdjective] знищили головні бази ополчення і повалили республіканський уряд. Республіканська еліта та командири були заарештовані, а уряд Індії відновлює свої операції на колишній території республіки. Як і було обіцяно за наш внесок, погоджену територію було передано нам."
 INS_revolution_events.31.desc:0 "Переговори про припинення вогню пройшли добре, і [HOL.GetLeader] погодився на наші умови. Ми наказали командирам ополчення в [FROM.GetName] негайно вивести свої війська."
 INS_revolution_events.4.a:0 "Це виглядає не дуже добре."
 INS_revolution_events.41.desc:0 "Гаага категорично відхилила наш ультиматум. Голландські війська в Індонезії продовжують свої операції у відкритій непокорі американським вимогам. Це надзвичайна помилка. Нідерланди не можуть вести колоніальну війну в Азії і водночас залежати від американської допомоги в Європі. Вони змусили нас діяти."
 INS_soetardjo_pending:0 "Фольксраад обговорює петицію Сутарджо про автономію"
 INS_stronghold_java:0 "Фортеця Ява"
 INS_supriyadi:0 "Супріяді"
 INS_tac_bomber_equipment_1_short:0 "Fokker T.V"
 INS_the_declaration_of_independence:0 "Декларація незалежності"
 INS_union_events.5.t:0 "[INS.GetNameDefCap] пропонує Нідерландсько-Індонезійський союз"
 INS_union_events.8.b:0 "Це не що інше, як спроба відновити колоніальне панування."
 INS_volksraad_events.100.desc:0 "[INS.GetLeader] схвалив петицію Фольксрааду про дозвіл резидентам не голландського походження [INS.GetNameDef] подавати заявки на отримання освітніх субсидій. Петицію було відправлено [HOL.GetLeader] на остаточне затвердження."
 INS_war_escalation_4_tt:0 "§Y[HOL.GetName]§!: Розблоковує рішення про оголошення війни (з важкими штрафами через протидію міжнародної спільноти)\n§Y[INS.GetName]§!: Розблоковує рішення про запит міжнародного посередництва для деескалації"
