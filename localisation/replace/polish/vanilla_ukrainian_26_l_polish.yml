 ROM_expand_ploiesti_oil_production_desc:0 "Ми володіємо одними з найбільших нафтових родовищ у Європі — в Плоєшті, і вони мають величезне значення не лише для нас самих, а й для наших союзників та інших країн у регіоні. Ми мусимо збільшити видобуток родовищ, щоб краще задовольнити потреби."
 ROM_expand_the_galati_shipyards_desc:0 "Наші вже існуючі верфі в Галаці необхідно значно розширити, якщо ми хочемо спрямувати свою потужність на Чорне море."
 ROM_fighter_equipment_0_short:0 "IAR 12"
 ROM_force_abdication_desc:0 "Король Кароль II більше не потрібен, і, справді, виявляється, що дає більше клопоту, ніж користі. Хоча він все ще має широкий контроль над державним урядом і фінансами, його необхідно змусити зректися престолу заради довгострокового блага Румунії."
 ROM_infantry_equipment_0_short:0 "Mannlicher M1893"
 ROM_king_michael:0 "Міхай I"
 ROM_king_michaels_coup_desc:0 "Поточна влада веде Румунію до краху. Потрібна тверда рука, щоб уберегти націю від катастрофи — рука князя Міхая."
 ROM_light_tank_equipment_1_short:0 "R-1"
 ROM_light_tank_equipment_2:0 "R-2"
 ROM_local_development_desc:0 "Ми покладемося на вітчизняну румунську аеронавтичну індустрію для виробництва потрібних нам літаків."
 ROM_mountain_artillery_desc:0 "Наші альпіністи повинні отримати належну артилерійську підтримку, якщо ми хочемо зберегти їхню досконалість. Тому наша артилерія повинна бути адаптована для використання в горах."
 ROM_present_ultimatum:0 "Висунути ультиматум"
 ROM_puppet_bulgaria:0 "Маріонеткова Болгарія"
 ROM_split_czechoslovakia_desc:0 "Чехословаччина — це штучна конструкція, яка не може вижити сама по собі. Ми не можемо допустити, щоб ця частина скотилася в хаос, і мусять втрутитися, поки ситуація не стане неспроможною."
