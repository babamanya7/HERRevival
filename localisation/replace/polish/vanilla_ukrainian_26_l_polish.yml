 GER_modern_tank_destroyer_equipment_1_short:0 "E-25"
 GER_mol_rib_pact_desc:0 "Договір про дружбу та ненапад із [GER.GetTheUSSRName] може викликати огиду, зате їхня дорогоцінна нафта продовжить текти в Німеччину. Секретні протоколи передбачають розподіл Румунії, Польщі, Литви, Латвії, Естонії та Фінляндії на [GER.GetAdjective]у та [SOV.GetAdjective]у зони впливу..."
 GER_nationalize_industries_desc:0 "Спостерігаючи позитивні результати централізації економіки, ми повинні зробити наступний крок — націоналізувати промисловість. Зараз вона розпорошена серед приватних власників із різними методами. Націоналізація забезпечить нам контроль над виробництвом і ефективністю."
 GER_nav_bomber_equipment_3_short:0 "Fw 300"
 GER_navy_imperial_modifier:0 "Kaiserliche Marine"
 GER_occupy_serbia_decision:0 "Окупувати Сербію"
 GER_occupy_slovenia_decision:0 "Окупувати Словенія"
 GER_operation_3:0 "Unternehmen Stierkampf"
 GER_our_place_in_the_sun_ww_desc:0 "Нехай усі знають, що [ROOT.GetNameDef] знову заявляє своє право на місце під сонцем! Наш народ більше не буде принижуватись у тіні — під п’ятою імперії, над якою ніколи не заходить сонце!"
 GER_petition_for_the_return_of_old_colonies_desc:0 "Наші нові британські друзі можуть бути відкриті до обговорення повернення колоній, які вони захопили наприкінці Великої війни. Вони можуть вимагати певної компенсації, але ми готові на це, якщо це дозволить нам відновити наші історичні претензії."
 GER_polish_ultimatum:0 "Поставити ультиматум Польщі"
 GER_political_commissars:0 "Політичні комісари"
 GER_pride_of_the_modern_germany_desc:0 "На те, щоби наздогнати британський Королівські ВМС за чисельністю, у нас піде багато років. Тому ми мусимо перевершити його як: наші кораблі стануть найпотужнішими і найсучаснішими з усіх, що колись виходили в море!"
 GER_raid_category_fluff_text_land_infiltration_raids:0 "§LДивізія «Бранденбург»§!"
 GER_red_europe_desc:0 "Ми не можемо обмежувати наші зусилля з підняття червоного прапору лише сусідніми країнами. Революція пролетаріату має охопити всю Європу!"
 GER_reform_austro_hungarian_empire:0 "Сформувати Австро-угорську імперію"
 GER_reich_minister_of_propaganda_improved:0 "$GER_reich_minister_of_propaganda$"
 GER_rocket_interceptor_equipment_3_short:0 "Fw VJ"
 GER_rocketry_focus_desc:0 "Ракетобудування є ключем до глобального вдосконалення всіх трьох видів збройних сил."
 GER_safeguard_poland_tt:0 "Якщо §YПольща§! перебуває у нашій фракції або має нашу гарантію під час виконання фокусу §YПровести спільні військові навчання§!, ми отримаємо додатково §G25§! §Yдосвіду армії§! та §G15§! §Yдосвіду авіації§!."
 GER_second_vienna_award_other:0 "Другий Віденський арбітраж"
 GER_sign_the_second_treaty_of_berlin:0 "Підписати Другий Берлінський договір"
 GER_soviet_treaty_desc:0 "Ми можемо обговорити з державою [SOV.GetNameDef] укладання нового науково-дослідного договору про створення вдосконалених танків. Якщо він на це погодяться, ми зможемо знову відкрити танкове училище в Камі, закрите в 1933 році. Проте зиск від такої співпраці отримає й [SOV.GetAdjective]а держава..."
 GER_sp_rockets_ground_to_air_missile:0 "Проєкт «Wasserfall»"
 GER_spreading_the_red_flame_cat_desc:0 "Нам нарешті вдалося сформувати справжній Пролетаріат, але боротьба була довгою і тяжкою. Наш обов’язок — рознести полум’я революції так далеко, як тільки зможемо, допомагаючи пригнобленим робітникам повалити тиранію капіталізму і створити свою власну Пролетарську Країну!"
 GER_state_development_north:0 "Програми громадських робіт в Північній Німеччині"
 GER_sturmtruppe_battalion_tt:0 "Відімкне батальйон підтримки §Y$sturmtruppe_battalion$§!."
 GER_support_weapons2:0 "MG 34 & 5 cm Granatwerfer 36"
 GER_tend_to_the_future_of_germany_desc:0 "Тепер, коли Німеччина звільнена від нацизму, ми маємо визначити курс на її майбутнє: за єдність, справедливість і свободу!"
 GER_the_fate_of_greater_finland:0 "Доля Карелії"
 GER_the_swiss_gold_desc:0 "Оскільки [SWI.GetAdjective]і урядовці вирішили поки що триматися осторонь глобальних конфліктів, вони представляють ідеальну можливість для торгівлі та шпигунства. Нам слід подбати про те, щоби розмістити в їхній державі агентів, а також використати їхній потенціал для зберігання здобутого нами золота."
 GER_trade_agreements:0 "Торгові угоди"
 GER_trade_interdiction_lock_other_focus_tt:0 "Фокус §Y$GER_plan_z$§! буде заблокований, доки не буде завершено фокус §Y$GER_unrestricted_convoy_raiding$§!."
 GER_train_schutztruppe_in_kaiser_wilhelmsland:0 "Мобілізувати Шуцтруппе на землі Кайзера Вільгельма"
 GER_uranverein_desc:0 "Наша країна мусить стати піонером у дослідженні атомної енергії та використати її потенціал для себе. Ми маємо одні з найгостріших умів на Землі, щоби займатися цим і стати руйнівником світів."
 GER_will_also_recieve_trade_and_civs_tt:0 "Ми також отримаємо частину їхніх ресурсів і цивільної промисловості.\nРівень §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! залежатиме від кількості країн, які погодяться на наші умови."
 GHA_fascism:0 "Імперія Гана"
 GIE_REINSTATE_EFFECT_DESC:0 "Після відновлення уряду всі §H$NAMEADJ|l$і§! §Hдивізії у вигнанні§!, §Hкомандувачі арміями§! та §Hкораблями§! перейдуть назад до держави $NAMEDEF|H$. Ми більше не зможемо використати її §Hлюдські ресурси ветеранів у вигнанні§! для §Hавіакрил у вигнанні§!, а літаки повернуться на склад."
 GIE_REINSTATE_ENABLED_LIBERATED:0 "Держава $NAMEDEF|H$ повністю звільнена, і її §Hлегітимність§! зменшуватиметься щодня на $VALUE|H2$. Як тільки §Hлегітимність§! упаде до §H0§!, уряд буде відновлений автоматично."
 GIE_SHIP_SELECTION_ITEM_EXILE_FLAG:0 "§H$COUNTRYADJ$ий§! $SHIPTYPE|H$ §Hу вигнанні§!"
