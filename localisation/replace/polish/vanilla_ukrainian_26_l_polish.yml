 BUL_bs_name_acc:0 "$BUL_bs_name_gen$"
 BUL_bulgarian_army_01_desc:0 "Нас оточують можливі вороги, як нас суворо навчила історія, і дуже важливо створити потужну армію та розробити сучасну тактику, якщо ми хочемо перемогти в будь-яких майбутніх конфліктах."
 BUL_context_of_death_eng:0 "За тиждень після повернення до міста [BUL.Capital.GetCapitalVictoryPointName] з зустрічі, яку влаштував [ENG.GetLeader] у місті [ENG.Capital.GetCapitalVictoryPointName], цар Боріс III помер від очевидної серцевої недостатності."
 BUL_contract_foreign_companies:0 "Контракти з іноземними компаніями"
 BUL_cooperation_fund_bs_desc:0 "Для підтримки наших політичних союзників ми забезпечимо фракцію [GetBsName] коштами на кампанію пропаганди, що збільшить її популярність."
 BUL_defensive_lines:0 "Оборонні лінії"
 BUL_dest_vidin:0 "Відін"
 BUL_destroy_imro_divisions_thrace_tt:0 "Має менш ніж §Y4 піхотних§! дивізій у §YПловдіві§! вздовж кордону з §YФракією§!"
