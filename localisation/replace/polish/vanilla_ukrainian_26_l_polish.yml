 NOR_fascist_invasion_of_norway_desc:0 "Сталося неймовірне: фашистська загроза, яка, як ми думали, була далеко від нас, з'явилася на нашому порозі та зламала його. Ми можемо лише сподіватися, що зможемо витримати допомогу достатньо довго, щоб дістатися сюди."
