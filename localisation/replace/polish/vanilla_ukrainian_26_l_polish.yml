 TUR_crush_the_warmongers_in_rome_desc:0 "[ITA.GetAdjective] громадяни — джерело всіх бід у Середземномор'ї. Це шкідлива пухлина, яка вважає, що може розповзтися Південною Європою на правах сильного. Ми атакуємо їх і платитимемо їм їхньою ж монетою, поки вони не запитають пощади."
