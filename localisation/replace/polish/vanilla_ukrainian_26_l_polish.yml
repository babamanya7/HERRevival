 PRC_reestablish_moscow_sun_yat_sen_university_desc:0 "Відновивши та збільшивши фінансування Московського університету імені Сунь Ятсена, ми можемо допомогти скеровувати та вдосконалювати націю, виховуючи майбутні покоління вчених на кшталт тих 28 з половиною, що були раніше."
