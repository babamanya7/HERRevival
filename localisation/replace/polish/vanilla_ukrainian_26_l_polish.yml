 form_hre_germany_coring_states_tt:0 "Усі §Yнімецькі§! землі, крім §YСхідної Пруссії§!, стануть осердними.\n"
 form_liga_federal_cat:0 "Відтворити Федеральну Лігу"
 form_macedonian_empire:0 "Ушанувати спадщину Аргеадів"
 form_nordic_league:0 "Проголосити єдність Скандинавії"
 form_spqr_italy_coring_states_tt:0 "Усі §Yіталійські§! території в Північній Африці стануть осердними.\n"
 form_turan_category_desc:0 "Довгий час Туран здавався нам швидше фантазією, ніж реальністю, але тепер ми маємо можливість об'єднати всі тюркські народи світу під одним прапором. Хіба можна її упускати?"
 france.17.b:0 "[Root.GetName] йде своїм шляхом."
 france.24.b:0 "Розбіжності є частиною демократичного процесу."
 france.24.t:0 "Комуністична загроза"
 france.25.d:0 "Оскільки режим у Берліні посилює напругу на кордоні між ними та Югославією, британці вирішили поступитися. Однак Югославія є одним із трьох стовпів, на яких будується східноєвропейське поселення. Якщо вона послабиться, то безпека Франції постраждає. Чи варто доводити, що ми є більшою силою і ризикувати битися наодинці?"
 france_continue_the_fight_tt:0 "Іншої можливості здатися з честю у нас не буде. Якщо ми програємо, вся французька метрополія буде окупована."
