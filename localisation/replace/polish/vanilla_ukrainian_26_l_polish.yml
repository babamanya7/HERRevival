 DIVISION_CAP_LIMIT_DESC:0 "Ця дивізія використовує межу шаблону, оскільки це найнижча межа."
 DIVISION_COMMANDER_DESCRIPTION_TEXT:0 "§HПольові офіцери§! — це офіцери, що командують Вашими дивізіями. Їхня дивізія може здійснювати різні бойові дії, за які її можна нагородити, від чого вона отримає бонуси. Крім того, офіцер може отримувати досвід й особисті риси під час командування своєю дивізією, які зберігатимуться навіть коли їх підвищать до генерала армії."
