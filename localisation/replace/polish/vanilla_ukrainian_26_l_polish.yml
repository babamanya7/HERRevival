 aat_news.105.desc:0 "У державу [FIN.GetNameDef] прийшла війна, і багато мисливців, ополченців із Suojeluskunta і члени стрілецьких клубів взяли до рук зброю, щоб битися із загарбниками. [FIN.GetAdjective]а стійкість духу переповнює їх, поки вони відбивають атаки ворога, користуючись тим, що [FIN.GetAdjective]а природа стала для окупантів справжньою Білою Смертю."
