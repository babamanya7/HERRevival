 scientist_refuge_desc:0 "Ураховуючи поточне політичне становище в Європі, деякі вчені вирішили покинути свою батьківщину. Вони подали документи на отримання візи до нашої країни. Надання її дасть нам бонус до досліджень, але також обурить деяких людей, які вважають це внутрішньою справою, в яку нам не слід втручатися."
