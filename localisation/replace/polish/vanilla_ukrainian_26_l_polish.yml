 YUG_attract_allied_capital_desc:0 "Британці мають підстави підтримувати нашу націю; ми давно були союзниками ще до першої Великої війни, і, залучаючи інвесторів з країн-союзників, ми запевнимо їх у тому, що відносини між нашими країнами нерозривні."
 YUG_attract_axis_capital_desc:0 "Наша економіка перебуває в жалюгідному стані, і хоча ми знаємо, що ні для кого не секрет, що італійці мають амбіції в нашому домі, ми повинні заохочувати торгівлю з нашими сусідами, якщо ми хочемо бути економічно готовими протистояти їм."
 YUG_coastal_defense_effect_tt1:0 "Додати §Y2 узбережні укріплення§! на береговій лінії.\n"
 YUG_defence_army_of_yugoslavia_desc:0 "Боротися за наш союз — це важко вимогти від пересічного громадянина, але боротися за власний дім — це обов'язок кожної людини. З обіцянкою незалежності на горизонті наш союз переповнений людьми, готовими боротися з нашим ворогом; все, що їм потрібно, це державна підтримка."
 YUG_designer_tt:0 "Ця компанія буде доступна як конструктор літаків.\n"
