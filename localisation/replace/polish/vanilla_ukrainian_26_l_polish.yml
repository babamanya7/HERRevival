 MTG_naval_treaty.5.t:0 "[From.GetNameDefCap] погоджується на роззброєння"
 MTG_naval_treaty.7.desc:0 "[From.GetLeader] оголоси[From.GetLeader.GetVerbGendEndA_RU] сьогодні, що [From.GetNameDef] відмовляється дотримуватися умов підписаної раніше морської угоди. За [From.GetLeader.GetHerHis] словами, ситуація, що склалася у світі, не залишає іншого вибору. [From.GetAdjectiveCap]ий уряд, очевидно, отримав із надійних джерел повідомлення про те, що кілька сусідніх країн розпочали програму агресивного розширення флоту, що загрожує інтересам у цьому регіоні.\n\n[From.GetAdjectiveCap]е адміралтейство відмовилося коментувати чутки про збірку кораблів, запланованих уже без урахування обмежень угоди."
