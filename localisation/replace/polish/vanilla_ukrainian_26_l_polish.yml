 EST_cave_to_enemy_pressure_desc:0 "Стало очевидно, що варіанта, за якого виживуть і наша нація, і наш народ, просто немає. Ми зробили багато, щоби захистити родичів, але тепер зрозуміло, що [Root.GetNonIdeologyName] не може зберегти незалежність без величезних жертв серед населення."
 EST_events.1.b:0 "Ми маємо інші плани на державу [From.GetNameDef]."
 EST_jaan_tonisson:0 "Яан Тиніссон"
 EST_look_north_desc:0 "Ми усвідомлюємо, що одних лише країн Балтії може бути недостатньо, щоб протистояти лиху нацистів і радянців на нашому кордоні, але, враховуючи амбіції наших агресорів у Скандинавії, можливо, нам вдасться переконати наших союзників на півночі приєднатися до Балтійської Антанти."
