 SOV_fascist_youth_union_desc:0 "Замість дивитися в минуле, ми повинні дивитися в майбутнє, на молодь і сучасні технології. Молоді фашисти горять бажанням бачити Росію відновленою до її колишньої слави. Те, чого їм бракує в досвіді, вони з лишком компенсують чистим завзяттям."
