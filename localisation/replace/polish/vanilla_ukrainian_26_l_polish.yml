 INS_fokker_name_nationalized:0 "IPT Nusantara"
 INS_increased_trade_with_japan_desc:0 "[JAP.GetNameDefCap] стає дедалі ціннішим торговельним партнером і жодного разу нас не підвів. Ми повинні домовитися про нові торговельні угоди для подальшого економічного співробітництва між нашими двома країнами та допомогти собі скинути пута Великої депресії. Це може засмутити наших союзників на Заході, особливо Нідерланди. Однак, якщо ми хочемо колись мати право вирішувати власну долю, нам потрібно забезпечити власні торговельні зв'язки."
 INS_industrial_events.4.b:0 "Нам слід відкрити алюмінієвий завод у [FROM.FROM.GetName]"
