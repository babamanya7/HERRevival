 BUL_acquire_modern_tools_desc:0 "Болгарська промисловість в основному складається зі старомодного, дрібного виробництва та ремісничих виробів. Нам потрібні відповідні інструменти для того, щоби будувати та розвивати основи сучасної промисловості."
