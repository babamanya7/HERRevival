 INTERNATIONAL_MARKET_DELETE_DESC:0 "Все оснащення буде передане на Ваші склади."
 IRE_a_t_lawlor:0 "A. T. Lawlor"
 IRE_subject_DEF:0 "$OVERLORDADJ$а $IRE$"
 IRQ_a_new_caliph:0 "Новий Халіф"
 IRQ_create_repair_yards_desc:0 "Розвиток глибоководного порту може значно збільшити нашу здатність експортувати товари, а також забезпечити об'єкти для швартування та поповнення запасів військових кораблів."
 IRQ_effectivize_the_production_line_desc:0 "Щоб забезпечити нашу незалежність у майбутньому, одиничних зусиль буде недостатньо. Ми повинні тому запровадити заходи, щоб постійно вдосконалюватися."
 IRQ_extensive_irrigation_projects_680_tt:0 "Якщо ми контролюємо §Y[680.GetName]§!, ми отримаємо §G1§! додатковий слот для будівництва в цій області"
 IRQ_finish_the_berlin_baghdad_railway_desc:0 "Прагненням старої Німецької імперії довгий час було створити залізницю від Берліна до Багдада, щоб підтримувати військово-морську присутність у Перській затоці. Цей «Експрес Тавр» так і не був повністю завершений, однак ми можемо пожинати економічні переваги лінії, завершивши її самостійно."
 IRQ_forceful_industrialization:0 "Примусова індустріалізація"
 IRQ_greater_iraq_tag_communism_DEF:0 "Соціалістична республіка Великий Ірак"
 IRQ_hashemite_arab_federation_democratic_DEF:0 "Об'єднана Арабська Федерація"
 IRQ_invite_foreign_arms_corporations:0 "Запросити іноземні збройові корпорації"
 IRQ_invite_oil_mission_desc:0 "Наш важіль впливу — чорне золото, і нашим новим друзям воно потрібне понад усе. Невелика поступка зараз може означати набагато більшу вигоду в майбутньому, якщо війна розвиватиметься на нашу користь."
 IRQ_iraqi_al_futuwwa_idea:0 "Іракська організація Аль-Футувва"
 IRQ_kurdish_democratic_desc:0 "Права курдів щодня топчуться арабською більшістю [IRQ.GetNameDef]. Настав час нам створити власний політичний рух з метою забезпечення вільної та незалежної нації для нашого народу."
 IRQ_kurdistan_events.4.b:0 "Ми не можемо дозволити цих соціалістичних практик!"
 IRQ_kurdistan_tag_DEF:0 "Курдистан"
 IRQ_political_events.50.a:0 "У нас небагато вибору."
 IRQ_political_events.52.t:0 "[FROM.GetNameDefCap] відхиляє запит"
 IRQ_political_events.60.a:0 "Дуже добре."
 IRQ_political_events.74.a:0 "Ідеальний час."
 IRQ_purchase_armored_equipment_desc:0 "Нашим силам бракує ударної потужності наших супротивників через надмірну залежність від традиційних піхотних сил. Танк — це явно майбутнє сухопутної війни, і ми повинні шукати того, хто готовий продати нам свої надлишкові моделі."
 IRQ_rally_behind_the_hashemite_dynasty:0 "Згуртуватися навколо Гашімітської династії"
 IRQ_sp_land_multi_charge_large_caliber_gun:0 "Проєкт «Babylon»"
 IRQ_support_from_skies_above:0 "Підтримка з небес"
 ITA_VICTORY_POINTS_9907:0 "Фіренце"
 ITA_a_new_era_for_the_red_shirts_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$modifier_army_sub_unit_militia_max_org_factor$: §G+5.00%§!\n\n"
 ITA_albanian_fascist_militia_desc:0 "Ми створимо нове крило італійських чорносорочників у Албанії, переконавшися, що вербуватимемо не лише італійських колоністів у країні, але й албанських добровольців."
 ITA_alpine_defense_desc:0 "Жорстокі бої в горах під час Великої війни ще свіжі в пам'яті багатьох людей. Ми повинні захистити наш північний фронт від будь-яких можливих атак, маючи у своєму розпорядженні боєздатних солдатів, здатних ефективно битися на цій місцевості."
 ITA_amedeo_guillet:0 "Амедео Гвіллет"
 ITA_battaglioni_m:0 "Battaglioni M"
 ITA_bop_praise_the_army_desc:0 "Мужні чоловіки та жінки, які служать в нашій армії, є основою безпечної та стабільної держави [ITA.GetName]. Вони заслуговують на обожнювання італійського народу!"
 ITA_bop_question_the_airforce:0 "£BoP_left_texticon Поставити під питання лояльність авіації"
 ITA_bop_resign_ministry_of_foreign_affairs_position_desc:0 "Відставка з посади міністра закордонних справ відкриє доступ до неї іншим, і Беніто Муссоліні втратить контроль над зовнішньою політикою та відносинами Італії."
 ITA_bop_take_over_ministry_of_education:0 "\"£BoP_right_texticon Очолити Міністерство освіти"
 ITA_catholic_action_desc:0 "Наша католицька молодіжна організація виявляється дуже ефективним інструментом у викоріненні комуністів, просуванні католицьких принципів соціальної справедливості та поповненні лав наших збройних сил новими призовниками, які прагнуть служити в армії."
 ITA_claims_on_turkey_desc:0 "Лондонський договір 1915 року обіцяв Італії турецькі землі в Анатолії в обмін на здобутки західних держав у Леванті. Вони отримали своє, стверджуючи, що це були лише мандати Ліги Націй, тоді як Італії було відмовлено. Нова Італія набагато сильніша за стару, і ми змусимо турків виконати британські обіцянки."
 ITA_comandante_diavolo_ethiopia_tt:0 "Створити §Y1 дивізію нерегулярної піхоти§!, §Y1 кавалерійську дивізію§! й §Y1 дивізію верблюдової кавалерії§!."
 ITA_cooperate_with_the_mafia_dm_tt:0 "\nКожна підконтрольна область із модифікатором §Y$ITA_mafia_on_the_rise$§!:"
 ITA_democratic_subject_DEF:0 "Республіканська Італія"
 ITA_devotion:0 "Відданість"
 ITA_devotion_desc:0 "Італійський народ у великому боргу перед Муссоліні. Він силою своєї волі поліпшив його в усіх відношеннях. Італійці стали сміливішими, багатшими, морально досконалішими. Найменше, що може зробити італійський народ у відповідь — це віддячити йому та виконувати його накази."
 ITA_disgruntlement_in_the_army_desc:0 "Невдоволення просочилося в армію після того, як її звинуватили в тому, що вона не здатна досить швидко розширюватися."
 ITA_dp_light_battery:0 "120mm/50 Ansaldo DP"
 ITA_european_democracies_bonus_per_ally_tt:0 "\nОтримає §G+2.00%§! стабільності та §G+25§! політичної влади за кожну незалежну демократичну країну в [ROOT.GetAdjective]ому альянсі (щонайбільше §Y+10.00%§! стабільності та §Y+125§! політичної влади).\n\n"
 ITA_expand_the_royal_guard_desc:0 "Ми будемо зміцнювати та розширювати Корпус королівської гвардії, щоби мати надійні війська, вірні італійській монархії та здатні виконувати різні ролі в будь-якій військовій операції, якщо виникне така необхідність."
 ITA_expanded_intelligence_service_basic_desc:0 "Розширена служба розвідки зміцнить нашу національну безпеку."
 ITA_flotta_d_evasione_desc:0 "Надто довго Італія задовольнялася обмеженням своїх морських амбіцій Середземним і Червоним морями. Взявши на себе зобов'язання створити «флот прориву» і збираючи кораблі, призначені для Атлантичного та Індійського океанів, ми зможемо поширювати свій вплив на всі океани світу."
 ITA_franco_italian_tech_sharing_desc:0 "Програма спільних військових розробок Італії та Франції."
 ITA_fronte_militare_clandestino_desc:0 "Ми організуємо підпільну військову організацію при осередках Опору в кожному італійському місті та у зв'язку з нашими збройними силами, щоби координувати наші військові операції та партизанські дії поза лінією фронту."
 ITA_grand_council_high_control_range:0 "Вотум недовіри в дуче"
 ITA_gw_tank_equipment:0 "Fiat 3000"
 ITA_has_disbanded_blackshirts_tt:0 "Чорносорочники не були розпущені"
 ITA_incrociatori_pesanti_rm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_STRIKE_FORCE_MOVING_ORG$: §G-5.00%§!\n$ITA_incrociatori_pesanti_dynamic_modifier_tt$\n\n"
 ITA_independence_overlord_fallback_accept_tt:0 "[ROOT.GetAdjective]ий володар прибере маріонетковий режим у державі [ROOT.GetName].\nОтримає модифікатор §Y$ITA_granted_us_independence$§! (думка про §Yколишнього володаря§!: §Y50§!)."
 ITA_institute_the_five_year_plan_desc:0 "Як і наші радянські товариші, ми мусимо індустріалізувати нашу переважно аграрну країну, щоби конкурувати з великими світовими державами. Ми розробимо п'ятирічний план, який допоможе нам не тільки повернутися до довоєнного промислового рівня, але й значно перевищити його."
 ITA_investments_in_edison:0 "Інвестиції в «Edison»"
 ITA_italian_hegemony_subjects_desc:0 "Об'єднайтесь під гегемонією держави [ITA.GetNameDef], ми є захисниками фашизму, діючи як бастіон правди та просвіти. Ніхто і ніщо не стане на нашому шляху!"
 ITA_jet_engine_effort:0 "Розвиток реактивних двигунів"
 ITA_libyan_infrastructure:0 "Лівійська інфраструктура"
 ITA_light_tank_destroyer_equipment_2:0 "Semovente 47/32"
 ITA_missiolini_bolster_political_cabinet_desc:0 "Знайти потрібних людей для потрібних місць завжди непросто. Ми не можемо залишити каменя на камені в пошуках найрозумніших і найяскравіших людей."
 ITA_missiolini_industrial_research_desc:0 "Ми повинні показати світові, з якою величезною швидкістю фашизм і італійський народ можуть здійснювати великі технологічні стрибки."
 ITA_missiolinis_reroll_tt:0 "Велика фашистська рада подбає про те, щоби Муссоліні передумав і незабаром видав новий наказ."
 ITA_modify_partisan_state_modifier_intro:0 "Змінити §Y$ITA_fronte_militare_clandestino_modifier$§! на:"
 ITA_moschettieri_del_duce_alt:0 "Moschettieri della Repubblica"
 ITA_mussolini_is_assassinated_tt:0 "Ми можемо обернути його смерть на свою користь."
 ITA_paolo_thaon_di_revel:0 "Паоло Таон ді Ревель"
 ITA_pietro_badoglio:0 "П'єтро Бадольйо"
 ITA_remove_balbo_as_advisor_tt:0 "§Y$ITA_italo_balbo$§! більше не буде доступний як §Yрадник§! або §Yфельдмаршал§!."
 ITA_self_propelled_guns_dynamic_modifier_tt:0 "§YЛегкі§!, §Yсередні§! та §Yважкі САУ§!: $production_cost_tt$ §G-5.00%§!\n§YЛегкі§!, §Yсередні§! та §Yважкі ВТ§!: $production_cost_tt$ §G-5.00%§!\n"
 ITA_ship_armor_bc_1:0 "150-мм пояс/25-мм палуба"
 ITA_socialist_cooperation:0 "Соціалістична кооперація"
 ITA_spanish_italian_alliance:0 "$ITA_spanish_italian_faction$"
 ITA_special_brigades:0 "Спеціальні бригади"
 ITA_stop_the_squandering:0 "Зупинити марнотратство"
 ITA_strengthened_heavy_industry:0 "Зміцнена важка промисловість"
 ITA_subject:0 "$OVERLORDADJ$а $ITA$"
 ITA_tac_bomber_equipment_3_short:0 "Z.1018 Leone"
 ITA_the_abyssinian_fiasco_desc:0 "Наше вторгнення в Ефіопію обернулося катастрофою. Ми знову зіткнулися з ганебною картиною, коли італійська армія не змогла здолати ефіопську. Як і наші предки при Адві, ми зазнали поразки. Можна лише здогадуватися, що поразка такого масштабу означатиме для майбутнього фашистської системи в Італії."
 ITA_the_kings_finest_desc:0 "Ми сформуємо спеціальні підрозділи з солдатів і офіцерів, відданих італійській короні, і будемо тренувати їх, щоби ті стали елітою нашої Визвольної армії."
 ITA_the_path_to_progress_event_tt:0 "У кожній §Yкомуністичній§! або §Yдемократичній соціалістичній§! країні в мирі з нами станеться подія з економічної та збройної підтримки нашого нового."
 ITA_united_anarchist_confederations_desc:0 "Ми мусимо шукати співпрацю з іспанськими та іншими анархістами по всьому світі в нашій боротьбі проти фашизму та капіталізму. Ми сформуємо Велику комісію зі співробітництва, до якої увійдуть активісти, інтелектуали та борці за свободу з усього світу."
 ITA_vallo_alpino_del_littorio_tt:0 "\nВідкриває доступ до рішень §Y$ITA_vallo_alpino_del_littorio_dec_cat$§!, які дозволяють розширити оборонні лінії в Альпах.\n\n"
 ITA_vento_aureo:0 "Золотий вітер"
 ITA_war_with_greece_desc:0 "Якою могутньою імперією ми стаємо, якщо не включимо в неї Грецію? Вона не має стати складною мішенню..."
 JAM_neutrality:0 "Ямайське князівство"
 JAP_MAN_accepted_our_proposal_for_integration:0 "§Y[MAN.GetNameDefCap]§! прийняла нашу пропозицію про об'єднання"
