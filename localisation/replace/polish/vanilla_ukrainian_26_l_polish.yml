 INS_charles_welter:0 "Шарль Вельтер"
 INS_communist_events.7.desc:0 "Тривожні звіти надійшли до нас із [FROM.FROM.GetName]. Агенти, які діють від імені [FROM.GetNameDef], розпалюють революційні настрої серед місцевого населення, використовуючи невдоволення нашою адміністрацією для створення підтримки комуністичного перевороту. Якщо цього не зупинити, [FROM.FROM.GetNameDef] може бути повністю втрачений для радикалів, і гниль цілком може поширитися далі на наші інші володіння."
