 RAJ_medium_tank_aa_equipment_2_short:0 "Cromwell (зеніт.)"
 RAJ_modify_a_loyal_government_tt:0 "Модифікувати §Y$RAJ_a_loyal_government$§! на:"
 RAJ_mountain_tanks:0 "Гірські танки"
 RAJ_mughal_court_princely_states_tt:0 "Усі князі залишать своє князівство та приєднаються до Імперії Моголів як доступні радники чи генерали."
 RAJ_nationalize_tata_group_desc:0 "Ми повинні припинити залежати від Tata Group для нашої економіки. Настав час взяти під контроль та націоналізувати компанію."
 RAJ_nothing_personal:0 "Нічого особистого"
 RAJ_procure_the_guns_desc:0 "Нам потрібен достатньо великий засіб стримування для захисту наших маршрутів, а достатньо великий засіб стримування вимагає великої гармати, дуже великої гармати."
 RAJ_quit_india_movement:0 "Рух «Геть із Індії»"
 RAJ_rebuilding_the_nation_desc:0 "Тепер, коли імперські агресори вигнані, а громадяни Індії готові працювати, настав час усунути збитки, завдані двома століттями окупації."
 RAJ_research_collaboration_desc:0 "Британці показали нам, яку вигоду дає обмін науковими розробками між найближчими союзниками. Весь наш альянс зможе ефективніше вести дослідження у воєнний час, якщо ми зуміємо скоординувати цей процес."
 RAJ_return_churchill_desc:0 "$ENG_winston_churchill$ виконав своє призначення тут, і настав час йому повернутися додому."
 RAJ_reveal_famine_timeframe:0 "Прогнозувати тривалість голоду"
 RAJ_rural_development_plan:0 "План розвитку сільської місцевості"
 RAJ_scindia_shipyard_organization:0 "$scindia_shipyard$"
 RAJ_secure_rajahsthan_decision_desc:0 "Раджастхан повільно стає базою для контрреволюції. Ми повинні включити цю державу до нашого складу та відновити домінування, перш ніж це стане реальною загрозою."
 RAJ_seven_shackles_2:0 "Четвертий—шостий із семи кайданів"
 RAJ_sikh_religious_guarantees:0 "Сикхські релігійні гарантії"
 RAJ_south_indian_railway_company_desc:0 "Залізнична компанія Південної Індії з'єднує жвавий південь з рештою Індії. Зміцнення та розширення цієї мережі сприятиме регіональному зростанню, плекатиме єдність та зміцнюватиме роль півдня в русі Індії до економічної незалежності."
 RAJ_special_economic_zones_desc:0 "Ми створимо спеціальні економічні зони в нашій країні, щоб полегшити корпораціям інвестування та зменшити податковий тягар для цих корпорацій."
