 RAJ_the_indian_parliament:0 "Індійський парламент"
 RAJ_the_indian_parliament_desc:0 "Зі зростанням вимог до самоврядування, ми створимо Індійський парламент, щоб він взяв на себе цивільну владу від Віце-короля. Цей перехід надасть реальну автономію місцевому керівництву, звичайно, в рамках Імперії."
