 communist_influence_desc:0 "Комуністичний тиск зробив цю ідеологію дуже популярною, що зробило країну схильною до симпатій до інших комуністів."
 communist_revolutionaries_desc:0 "Якщо підтримка комунізму зросте понад 70%, у країні почнеться громадянська війна. Якщо підтримка комунізму впаде нижче 30%, революційна активність зупиниться."
