 NOR_defeatist_commander_in_chief:0 "Командир-поразник"
 NOR_dem_his_integrate_militias_desc:0 "Тепер, коли люди, котрі сформували наші ополчення, довели свою мужність, ми могли би краще інтегрувати їх в армію, у регулярні батальйони та дивізії."
