 axis_meetthegeneral:0 "Зустріч із генералом"
 axis_war_1:0 "Тема Осі"
 baltic_entente_leader_flag:0 "Є лідером Балтійської Антанти\n"
 bangladesh:0 "Бангладеш"
 base_strike_academy_spirit_desc:0 "Тісна співпраця між повітряними та морськими частинами є життєво необхідною!"
 basic_dp_light_battery_desc:0 "Поєднання протикорабельної та протиповітряної гармат в одному кріпленні забезпечує більшу гнучкість та зменшує вагу.\n\nУстановка цього модуля збільшує §Yатаку легких гармат§!, що допомогає в боротьбі з ворожими §Yкораблями прикриття§!. Ці модулі також збільшують §Yпротиповітряну атаку§!.\nУстановка модуля §YДопоміжна батарея§! дає §Yкрейсерам§!, §Yавіаносцям§! або §Yважким кораблям§! невелику §Yатаку легких гармат§! та дозволяє їм уражати другу ціль."
 basic_dp_medium_battery_desc:0 "Самозарядні скорострільні батареї з середніми закритими гарматами значно збільшують вогневу міць.\n\nУстановка модуля §YЛегка середня батарея§! збільшує §Yатаку легких гармат§!, що допомагає в боротьбі з ворожими §Yкораблями прикриття§!. Цей модуль також збільшує §Yпротиповітряну атаку§!."
 basic_encryption_desc:0 "З новими засобами зв'язку з'явилися нові можливості для перехоплення даних. Роторні шифрувальні апарати забезпечують швидке, складне шифрування інформації."
 basic_medium_shell_desc:0 "Балістичний наконечник поліпшує аеродинамічні властивості снаряда, не позначаючись на ефективному бронепробітії."
 basic_secondary_battery:0 "Казематна допоміжна батарея"
 basic_ship_hull_heavy:0 "Корпус важкого корабля 1936 р."
 bb_tech:0 "Моделі лінкорів"
 bba_news.106.t:0 "[GetVittorioDiesEventTitles] помирає"
 bba_news.3.t:0 "Італо-ефіопська угода про перемир'я"
 bftb_bulgaria_balkan_federation.16.t:0 "[BUL.GetNameDefCap] вимагає всі [ROOT.GetAdjective]і землі на Балканах"
 bftb_bulgaria_balkan_federation.3.a:0 "Яка зухвалість з боку Болгарії..."
 bftb_bulgaria_equipment_purchases.2.c:0 "Закупити бронемашини"
 bftb_bulgaria_equipment_purchases.4.b_tt:0 "Ми купимо §Y[?BUL_quantity_purchased_naval_bomber]§! од. §Yморських бомбардувальників§!"
 bftb_bulgaria_equipment_purchases.4.t:0 "Закупити [FROM.FROM.GetAdjective]у авіацію"
 bftb_bulgaria_equipment_purchases.9.desc:0 "Після майже року будівництва два замовлені нами [FROM.GetAdjective]і есмінці пройшли випробування в морі і нарешті готові до офіційної передачі на флот."
 bftb_bulgaria_factions.19.desc:0 "В останні кілька тижнів поліція відловлювала залишки «Звена», яка, втративши керівництво після недавньої черги арештів, помітно послабшала і розгубилася.\nМожна впевнено заявити, що «Звена» більше немає в державі [ROOT.GetNameDef], і це наша країна та уряд тільки виграють."
 bftb_bulgaria_factions.40.a:0 "Це навіть не самобутній протест!"
 bftb_bulgaria_factions.64.desc:0 "Захоплення лідерів широких соціалістів пройшло не так, як було задумано. Поліція заарештувала кілька важливих діячів, але багатьом лідерам організації вдалося втекти, і тепер вони продовжують керувати широкими соціалістами, хай навіть із укриття."
 bftb_bulgaria_factions.70.t:0 "Члени Землеробського союзу репресовані"
 bftb_bulgaria_factions.85.desc:0 "Захоплення лідерів націонал-соціалістичного руху з тріском провалилося. Поліцейські увірвалися на таємну зустріч, але їх було набагато менше, ніж змовників, тому нікого не вдалося затримати, і учасники зборів швидко розбіглися. У ході поліцейського переслідування на На вулицях зав'язалися жорстокі зіткнення, і постраждали багато невинних жителів. Зіткнувшись з такою жорстокістю поліції, багато городян мимоволі віддали свої симпатії націонал-соціалістам і почали приховувати членів організації, а іноді й стали давати відсіч органам охорони порядку."
 bftb_bulgaria_fate_of_the_balkans.1.t:0 "[BUL.GetNameDefCap] вимагає, щоби ми приєдналися до альянсу [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.5.a:0 "[FROM.FROM.FROM.GetName] повертається до законних власників"
 bftb_bulgaria_fate_of_the_balkans.7.a:0 "Ми не в тому положенні, щоби відмовлятися..."
 bftb_bulgaria_fatherland_front.1.desc_negative:0 "Спільно з представниками інших організацій комуністи організували Вітчизняний фронт — політичний рух опору, який із небезпечною швидкістю набирає популярності серед пролетаріату і в недалекому майбутньому може перетворитися на загрозу уряду."
 bftb_bulgaria_fatherland_front.2.desc_has_zveno_support:0 ".\nУ Софії тим часом військові офіцери «Звена» захопили пункти зв'язку і кинулися до Національних зборів, заставши зненацька місцеві війська та змусивши їх здатися"
 bftb_bulgaria_german_influence.6.t:0 "[BUL.GetLeader] відмовляється замінити Кьосеіванова"
 bftb_bulgaria_greek_influence.1.desc:0 "[BUL.GetAdjectiveCap]ий прем'єр-міністр, [BUL.GetLeader] та [ROOT.GetLeader] зустрілися, щоби надати офіційний характер дружбі, якій давно пов'язані [BUL.GetNameDef] та [ROOT.GetNameDef], і укласти мирний договір. [BUL.GetAdjectiveCap]ий лідер також пропонує деякі податкові пільги [ROOT.GetAdjective]им капіталістам, які бажають відкрити філії у сусідній країні."
 bftb_bulgaria_nationalization.3.desc:0 "[FROM.GetAdjectiveCap]ий уряд поступився під тиском інвесторів та промислових магнатів, які після [BUL.GetAdjective]ої націоналізації зарубіжних філій заявили, що держава [FROM.GetNameDef] не тільки повинна накласти торгове ембарго на державу [BUL.GetNameDef], але й вигнати її з альянсу [FROM.GetFactionName].\nЕмбарго[GetEmbargoAndKickAllies] серйозно вплине на кілька секторів економіки, але найгірше в тому, що наша країна виявиться без захисту перед територіальними амбіціями сусідів, скористаються ситуацією, де знаходиться [BUL.GetNameDef]."
 bftb_bulgaria_rearmament.1.desc:0 "[BUL.GetAdjectiveCap]ий уряд публічно оголосив про політику світу, якої [BUL.GetNameDef] має намір дотримуватися на Балканах, і тепер наполегливо підштовхує нас до переговорів про зняття серйозних військових обмежень, на Великої війні.\nВони стверджують, що почати переозброєння необхідно негайно, щоби дати їм можливість створити армію, здатну захистити суверенітет і самобутність народу."
 bftb_bulgaria_rearmament.2.desc:0 "[ENG.GetAdjectiveCap]ий уряд відмовився знімати будь-які обмеження з наших збройних сил. Схоже, їх не хвилюють зростаюча напруга в Європі і думка про те, що [ROOT.GetNameDef] залишиться без захисту перед ворожими силами, якщо тендітна рівновага на Балканах буде порушена."
 bftb_bulgaria_rearmament.3.desc:0 "[ENG.GetAdjectiveCap]ий уряд відмовляється знімати будь-які обмеження з наших збройних сил, поки [ROOT.GetNameDef] не підпише офіційний договір з однією з сусідніх держав, започаткувавши розвиток дружніх відносин на Балкан."
 bftb_bulgaria_rearmament.7.desc:0 "[BUL.GetAdjectiveCap]а делегація прибула до Лондона в спробі натиснути на [ROOT.GetAdjective]ий уряд і вимогти зняття обмежень з збройних сил держави [BUL.GetNameDef]. \nНа Балканах зріє війна, що незабаром [BUL.GetNameDef] так чи інакше почне готуватися до захисту цілісності своїх територій."
 bftb_bulgaria_rearmament.9.desc:0 "[BUL.GetAdjectiveCap]ий дипломат, якого відправив особисто [BUL.GetLeader], прибув до нашої країни із заявою: [GetReasonForNotAbiding]."
 bftb_bulgarian_claims.1.a:0 "Визнати болгарські претензії."
 bftb_bulgarian_claims.7.desc:0 "[FROM.GetAdjectiveCap]а держава бере на себе миротворчу місію на окупованих балканських землях і для підтримки порядку та стабільності просить нас надати адміністративний контроль над областю [FROM.FROM.GetName], яку займає [ROOT.GetFactionName]. Також це дозволить звільнити [ROOT.GetAdjective]і гарнізони: ці війська зможуть зміцнити фронт."
 bftb_greece.13.t:0 "Іракліонську конвенцію відвідують усі учасники Севрського мирного договору"
 bftb_greece.15.a:0 "Ми голосуємо за!"
 bftb_greece.167.t:0 "Наші бізнесмени повертаються з [FROM.GetAdjective]ої національної виставки"
 bftb_greece.169.desc:0 "[FROM.GetAdjectiveCap]і інвестори повернулися до нашої країни після минулого короткого візиту і привезли з собою нові інвестиції та нові можливості! З їхньою допомогою ми вибудуємо справжню сучасну економіку."
 bftb_greece.176.desc:0 "$bftb_greece.169.desc$"
 bftb_greece.177.a:0 "Що ж, можливо, в інший раз."
 bftb_greece.183.desc:0 "На жаль, нам стало відомо, що цього разу [FROM.GetAdjective]і інвестори не стануть вкладати в нашу економіку. Це дуже прикро, але [FROM.GetAdjective]ий делегат не виключив можливості інвестицій у майбутньому, що нас влаштовує."
 bftb_greece.190.a:0 "[ROOT.GetNameDefCap] направить частину ресурсів на розвиток держави [FROM.GetNameDef]."
 bftb_greece.190.c:0 "[ROOT.GetAdjectiveCap]ий народ не страждатиме заради того, щоб кілька [FROM.GetAdjective]их фермерів могли працювати на заводі."
 bftb_greece.193.t:0 "[FROM.GetNameDefCap] отримує інвестиції!"
 bftb_greece.201.t:0 "Іракліонська конвенція відбулася"
 bftb_greece.204.b:0 "Марна трата часу..."
 bftb_greece.221.t:0 "Іракліонська конвенція — [FRA.GetAdjective]а держава отримує свій мандат!"
 bftb_greece.229.desc:0 "[GRE.GetNameDefCap] починає війну з державою [TUR.GetNameDef] і закликає нас надати їй обіцяну допомогу. Нам обіцяють великі трофеї, і завжди є можливість просити більшого, але, можливо, ми вже не в тому положенні, щоб виконувати свої зобов'язання — навіть якщо через це доведеться відмовитись від претензій."
 bftb_greece.230.t:0 "[FROM.GetNameDefCap] виконує свої обіцянки"
 bftb_greece.24.t:0 "Іракліонська конвенція — Велика ідея"
 bftb_greece.25.desc:0 "Більшість присутніх делегатів вирішила, що [GRE.GetNameDef] має отримати право на реалізацію так званої Великої ідеї, якщо вона переможе державу [TUR.GetNameDef] у війні. Наші представники дуже раді: [ROOT.GetLeader] вже звернувся до нації і заявив, що Іракліонська конвенція увінчалася успіхом. Воскресіння Великої ідеї. Ми домоглися від Іракліонської конвенції всього, чого хотіли, але головні труднощі ще попереду..."
 bftb_greece.40.a:0 "Через Смирну ми візьмемо всю країну!"
 bftb_greece.45.desc:0 "Уряд був приголомшений звісткою про те, що наші війська, розташовані в області [354.GetName], успішно прогнали [FROM.GetAdjective]их солдатів, що вторглися до нас, і утримали свої позиції, незважаючи на величезну перевагу противника. Ми отримали термінове комюніке від [FROM.GetAdjective]ого посла, який активно вибачався за інцидент, і дізналися, що за усією операцією стоїть [GRE.GetAdjective]ий режим. Нас запевнили, що у випадку, якщо наша боротьба з державою переросте у війну, варто очікувати [FROM.GetAdjective]их заходів у відповідь."
 bftb_greece.48.t:0 "[FROM.GetAdjectiveCap]і провокатори розпалюють комуністичне повстання на півдні!"
 bftb_greece.52.desc:0 "Ми щойно закінчили приймати у своїх доках зброю та добровольців з держави [FROM.GetNameDef]. Ця підтримка дуже доречна; вона набагато найбільше, що ми могли очікувати, і знадобиться нам у найближчі місяці."
 bftb_greece.6.b:0 "З фашистською гиддю справ не ведемо."
 bftb_news.11.a:0 "Це поліпшить наші відносини з державою [GER.GetNameDef]!"
 bftb_news.14.b:0 "Відчайдушна спроба завадити нашим військовим успіхам!"
 bftb_news.4.b:0 "А цей старезний дід узагалі здатний правити?"
 bftb_turkey.10.desc:0 "Навіть перед набагато сильнішим опонентом [TUR.GetLeader] відмовляється йти на компроміс із питань [TUR.GetAdjective] прав на Турецькі протоки. Відносини між країнами значно розжарилися, на [TUR.GetAdjective]о-[SOV.GetAdjective]ий кордон виведені війська. [TUR.GetLeader] назвав цю кризу «моментом істини для держави [TUR.GetNameDef]» і пообіцяв, що [TUR.GetNameDef] ніколи не схилиться перед [SOV.GetAdjective] тиранією."
 bftb_turkey.110.a:0 "Республіка єдина і неподільна"
 bftb_turkey.116.a:0 "Удар у відповідь з подвоєною силою!"
 bftb_turkey.134.g:0 "Геній Шевкета Сюрейї Айдеміра допоможе нам."
 bftb_turkey.23.desc:0 "[TUR.GetLeader] та [ROOT.GetLeader] ведуть переговори: перший пропонує другому підписати пакт про ненапад із перспективою подальшої співпраці. [TUR.GetAdjective] дипломати старанно працювали над пропозицією, докладно описавши спільні історію та інтереси наших двох націй, супроводжувавши це щирим закликом до миру між братніми народами. Переговори пройшли у дружній атмосфері, але в результаті рішення підписувати документ чи ні залишається за нами."
 bftb_turkey.24.g:0 "Геній Шевкета Сюрейї Айдеміра допоможе нам."
 bftb_turkey.30.c:0 "Пропозиції дружби буде цілком достатньо."
 bftb_turkey.37.desc:0 "[FROM.GetAdjectiveCap]ий уряд публічно заявив, що, незважаючи на зусилля [TUR.GetAdjective] агітаторів та реваншистів, архіпелаг Додеканес назавжди залишиться невід'ємною частиною [FROM.GetAdjective]ої держави. [FROM.GetLeader] заявив, що навіть якщо [TUR.GetLeader] користується великою повагою у державі [TUR.GetNameDef], у державі [FROM.GetNameDef] він висміювався [FROM.GetAdjective] громадянами як некомпетентний правитель. [FROM.GetLeader] оголосив, що [TUR.GetNameDef] — держава, що не відбулася, і докладно описав, як саме існування нашого народу є непробачною образою [FROM.GetAdjective] нації. У своїй довгій промові [FROM.GetLeader] згадав невиконані обіцянки Севрського мирного договору не менше тридцяти\n. n[TUR.GetLeader] назвав [FROM.GetAdjective] позицію «прикрою», але висловив надію на можливість для подальшого дипломатичного діалогу в майбутньому."
