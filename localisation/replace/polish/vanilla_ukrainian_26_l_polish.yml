 SOV_move_industry_to_the_urals_desc:0 "До нас прийшла війна, і наша вітчизна під загрозою. Хоча наші війська битимуться до останнього патрона, не віддаючи ні кроку землі, ми не можемо гарантувати, що цього буде достатньо, зважаючи на сили, які проти нас виступили. Ми мусимо евакуювати заводи в безпечне місце, поки їх не захопили."
