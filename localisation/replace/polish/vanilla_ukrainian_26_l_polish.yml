 SHX_strat_bomber_equipment_3_short:0 "Type 444"
 SHX_tac_bomber_equipment_1:0 "CAMCO Type 36"
 SIA_GATHERING_STORM_DESC:0 "Минуло лише чотири роки відтоді, як Кхана Ратсадон поклала край століттям абсолютної монархії. Сіам робить свої перші кроки як конституційна держава, але єдність вже почала руйнуватися: цивільні реформісти мріють про демократію, тоді як військові вимагають сили, дисципліни та пантайської експансії.\n\nОточений британською та французькою колоніальною владою, з підбадьореною Японією, що просувається на північ, Сіам повинен обережно орієнтуватися. Наближення бурі може змусити цю молоду націю обрати сторону — або знайти спосіб вижити без неї."
 SIA_civil_service_heroism:0 "Героїзм державної служби"
 SIA_demand_repatriation:0 "Вимагати репарацій"
 SIA_develop_eastern_burma:0 "Розвиток Сахарат Тай Доєм"
 SIA_domestic_tin_smelters:0 "Вітчизняні оловоплавильні заводи"
 SIA_foreign_currency_exchange_desc:0 "Індустріалізація вимагає іноземного обладнання, ліків і палива, але їх можна купити лише за дефіцитну валюту. Контрольована система обміну валют спрямує іноземні кошти на найважливіші для держави галузі."
 SIA_great_thai_empire:0 "Велика Тайська імперія"
 SIA_great_war_veteran:0 "Ветеран експедиційного корпусу Великої війни"
 SIA_kuang_abhayavongsa:0 "Khuang Aphaiwong"
 SIA_mandate_5:0 "П'ятий мандат"
 SIA_mandate_5_desc:0 "Тайський народ повинен намагатися споживати лише їжу, виготовлену з тайських продуктів.\n\nТайський народ повинен намагатися носити лише одяг, виготовлений з тайських продуктів.\n\nТайський народ повинен підтримувати сільськогосподарські, комерційні, промислові та інші професійні зусилля своїх співвітчизників.\n\nТайський народ повинен використовувати та підтримувати будь-які комунальні підприємства, створені урядом або тайським народом.\n\nТайці, які займаються сільським господарством, комерцією, промисловістю чи іншою професією, що підтримується цим мандатом, повинні намагатися підтримувати стандарти, покращувати якість і вести свій бізнес чесно."
 SIA_mobilize_the_defenders_of_siam_desc:0 "Старі військові підвели націю, але Сіам все ще потребує захисників. Добровольці, лояльні офіцери, провінційна гвардія та патріотичні громадяни повинні бути організовані в силу, яка захищатиме конституцію від ворогів внутрішніх і зовнішніх."
 SIA_phraya_wichcitcholathai:0 "Phraya Wichcitcholathai"
 SIA_prince_of_chai_nat:0 "Принц Чайнату"
 SIA_reluctant_submission_trigger:0 "Цей фокус буде автоматично виконано, якщо на нас нападуть і ми оберемо варіант §YПідкорення§! у відповідній події."
 SIA_seek_support_from_constitutional_monarchists:0 "Шукати підтримки конституційних монархістів"
 SIA_ship_torpedo_sub_3:0 "6x 533-мм ТА з заряд. порш."
 SIA_siam_electricity_company_desc:0 "Жодна економіка не може витримати сучасних навантажень без надійної електроенергії. Зміцнивши Енергетичну компанію Сіаму, ми зможемо розширити генерацію, покращити координацію і гарантувати, що майстерні, склади і міста залишатимуться забезпеченими навіть у скрутні часи."
 SIA_southeast_asia_joint_command:0 "Об'єднане командування Південно-Східної Азії"
 SIA_steel_arteries_desc:0 "Жодна армія не просунеться далеко без залізниць і доріг, що її забезпечують. Сталеві артерії нації повинні бути зміцнені, щоб війська, запаси і гармати могли бути швидко доставлені до кожного кордону, що перебуває під загрозою. У цій справі військова безпека і національний розвиток йдуть пліч-о-пліч."
 SIA_sway_aditya_dibabha_to_seri_thai_desc:0 "Залучити Адітью Дібабху на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_sway_general_cw_scale_tt:0 "Збільшує нашу підтримку в громадянській війні на §Y5%§!\nЯкщо підтримка перевищує §Y80%§!, громадянської війни вдасться уникнути, і ми захопимо владу без опору."
 SIA_the_army_of_siam_desc:0 "Стара структура наших збройних сил більше не відповідає вимогам часу. Якщо [ROOT.GetName] хоче захистити свій суверенітет та відстоювати свої інтереси за кордоном, ми повинні побудувати нову сучасну армію, оснащену, навчену та організовану для воєн, які зараз розгортаються по всьому світу."
 SIA_the_hammers_that_strike_desc:0 "Наш альянс — це більше не набір малих держав, які сподіваються вижити. Це зброя. Кожна нація — це молот, і разом ми вдаримо по будь-якій державі, яка прагне домінувати в Азії."
 SIA_the_purge_desc:0 "Військова кліка втопила націю в крові, замість того, щоб підкоритися цивільному правлінню. Зі зрадниками не може бути компромісів. Офіцери, колабораціоністи та співчуваючі повинні бути усунуті з кожного командування, перш ніж вони зможуть знову загрожувати державі."
 SIA_the_revolution_of_24th_june:0 "Революція 24 червня"
 SIA_the_songsuradet_rebellion_historical_tt3:0 "на §Y[?var:SIA_purged_military_timer]§! днів"
 SIA_the_thonburi_arsenal:0 "Арсенал Тонбурі"
 SIA_the_yellow_dossier_desc:0 "Підроблений радикальний проект зробив свою справу. Тепер можна впроваджувати справжнє Жовте досьє: зважені реформи, економічна модернізація та політичні запобіжники, покликані зламати домінування військових, не віддаючи націю в руки хаосу."
 SIA_war_fervor_cat_desc:0 "Апетит народу до конфлікту потрібно ретельно контролювати. Якщо його не стримувати, воєнний запал обернеться всередину — уряд, який розпалює бойовий дух, не спрямовуючи його, ризикує стати його наступною мішенню."
