 FIN_repurposed_small_industries_desc:0 "Взявши під контроль малі підприємства та перепрофілювавши їх на потреби війни, фінський уряд тепер може мобілізувати свої ресурси і повністю мобілізувати економіку як на цивільні, так і на військові потреби."
 FIN_request_extradition_of_kullervo_manner_desc:0 "Стан Куллерво Маннера погіршується з кожним днем, і нам потрібно повернути його до [FIN.GetNameDef], перш ніж його туберкульоз уб'є його в таборі для полонених."
 FIN_social_democratic_womens_union_desc:0 "Становищем жінок у суспільстві нехтували з незапам'ятних часів. Привівши Соціал-демократичний жіночий союз глибше в серце уряду, ми нарешті зможемо вирішити їхні проблеми та створити більш справедливе суспільство для всіх."
 FIN_sosialistinen_eduskuntaryhma_desc:0 "Парламентська група соціалістів виступає за зближення з [SOU.GetNameDef], а не за антагонізацію. Їхні пропозиції можуть дати найкращу надію на збереження нашої власної форми соціалізму без втручання з боку держави [SOU.GetNameDef]."
