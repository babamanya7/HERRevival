 GRE_temper_italian_colonial_ambitions_in_greece:0 "Угамувати [FROM.GetAdjective]і колоніальні амбіції в державі [ROOT.GetNameDef]"
 GRE_the_right_to_rule:0 "Право правити"
 GRE_venerate_the_ancient_hellenes_5_desc:0 "Ми мусимо вчитися у воїнів Фів, що звільнилися від спартанської гегемонії, і у афінських філософів, що передбачили концепцію сучасної демократії."
 GRN_communism_DEF:0 "Народна спільнота Калаалліт Нунаат"
 GSM_autonomy_sea_warlord_subject:0 "Ганьсуська кліка Ма"
 GUAY_cooperation_in_the_americas_desc:0 "$BRA_cooperation_in_the_americas_desc$"
 GUAY_dam_construction_desc:0 "Наша країна має широкі можливості для гідроелектростанцій, але недостатньо резервів для реалізації таких дорогих проєктів. Можливо, партнер буде готовий надати нам позику?"
