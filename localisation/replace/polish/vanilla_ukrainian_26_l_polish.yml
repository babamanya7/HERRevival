 DLC_DESCRIPTION_dlc040:0 "Trial of Allegiance додає масштабні дерева фокусів Бразилії, Аргентині, Чилі, Уругваю та Парагваю. Стабільність усього континенту балансує на лезі ножа. Відкрийте новий фронт війни, схиляючи на свій бік європейські держави своїм найціннішим товаром: Вашою відданістю."
