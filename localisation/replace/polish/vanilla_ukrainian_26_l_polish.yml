 sp_naval_ice_carrier_unique_reward_a_desc:0 "Вкладаючи величезну кількість часу в будівництво цього гігантського авіаносця, ми маємо бути впевнені, що забезпечуємо йому найкращий захист. Що становить найбільшу загрозу?"
