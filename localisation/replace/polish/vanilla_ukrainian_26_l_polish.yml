 INS_ki_hajar_dewantara:0 "Кі Хаджар Девантара"
 INS_light_tank_destroyer_equipment_1_short:0 "TJ-1"
 INS_loyalist_events.11.desc:0 "Народ [MAL.GetName] проголосував за приєднання до нашої нації. Офіційні особи [MAL.GetAdjective] співпрацюють з нашою адміністрацією, щоб розпочати передачу повноважень. На карті малайського світу буде на один кордон менше."
 INS_loyalist_events.24.desc:0 "Колоніальний губернатор у Ділі особисто написав, щоб відхилити нашу вимогу, наполягаючи на тому, що Східний Тимор залишається суверенною територією його уряду. Наш генеральний штаб розробив плани на випадок надзвичайних ситуацій, якщо кабінет міністрів побажає розглядати це питання далі."
