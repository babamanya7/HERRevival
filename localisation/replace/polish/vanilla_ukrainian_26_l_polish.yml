 TUR_kamil_tolon:0 "Каміль Толон"
 TUR_keeping_turkey_under_observation:0 "Ми будемо пильно стежити за діями держави §Y[TUR.GetNameDef]§! і в майбутньому виключимо її з нашого альянсу, якщо виникне така потреба."
 TUR_kemalist_army_officers_powerful_disloyal_desc:0 "Офіцери елітного турецького корпусу — одні з найбільших захисників кемалістських цінностей. Кемалізм ніколи ще не укорінявся в Туреччині так глибоко, як в наші дні, і офіцерський корпус, напевно, ставиться до нас із презирством за те, що ми дієм так відверто суперечно кемалістським цінностям в часи, коли ці цінності розділяє багато хто."
 TUR_medium_tank_equipment_1_short:0 "Asena II"
 TUR_nav_bomber_equipment_3:0 "Nu.D Denizanası"
 TUR_rebuilding_our_home_desc:0 "Наша держава була матеріально, фізично та духовно спустошена собаками-кемалістами, але нарешті їхній тиранії було покладено край. Ми стоїмо на порозі нової ери для нашого народу: тієї, коли ми нарешті зможемо виправити помилки минулого. Ми мусимо будувати майбутнє, щоби ми могли воскресити минуле."
 TUR_reclaiming_our_lost_empire:0 "Відродити втрачену імперію"
 TUR_republicanism_desc:0 "Бо незалежність є абсолютним правом мого богопоклонного народу!"
 TUR_second_five_year_plan_cakmak:0 "П'ятирічний план Чакмака"
 TUR_sponsor_petrol_olfisis_formation_desc:0 "На уряд тиснуть, щоб він створив державну організацію з розслідування збитків навколишньому середовищу, що завдається видобутком нафти та виробництвом палива."
 TUR_strat_bomber_equipment_3:0 "G.O. Evren"
