 HABSBURG_meeting_the_logistical_challenge:0 "Рішення логістичного виклику"
 HABSBURG_united_in_the_face_of_danger_desc:0 "Смерть або безчестя; наші люди це добре знають. Ми будемо повністю об’єднані проти будь-яких загроз, які можуть постати проти нас!"
 HAI_georges_leger:0 "Georges Léger"
