 BUL_found_dvf_sopot:0 "Заснувати ДВФ–Сопот"
 BUL_full_voting_rights_for_women_ideology_tt:0 "\nЗміна популярності комунізму та демократії на основі підтримки поточної ідеології:"
 BUL_georgi_markov:0 "Георгій Марков"
 BUL_hindered_planned_expansion:0 "Перешкодили запланованій експансії"
 BUL_military_dictatorship:0 "Військова диктатура"
 BUL_nationalization_warning_tt:0 "Унаслідок націоналізації іноземні країни, які інвестували в болгарську промисловість, можуть вирішити накласти на нашу країну торгове ембарго, вигнати нас із фракції або навіть оголосити нам війну.!"
 BUL_negotiate_bulgarian_rearmament_desc:0 "Болгарська армія перебуває в жалюгідному стані через обмеження Ньойї-сюр-Сенського договору, і ми майже беззахисні перед вторгненням будь-якої прикордонної країни. Ми мусимо якомога швидше домовитися про скасування цих обмежень, щоби наші жадібні сусіди не вирішили розпочати нову балканську війну."
 BUL_opression_ban_bzns_media:0 "Заборонити видання $BUL_bzns_name_gen$"
 BUL_opression_discredit_zveno_leaders_desc:0 "Фракція [GetZvenoName] поширює серед населення небезпечні ідеї та розгромну критику нашого уряду, що для нас абсолютно неприйнятно. Ми мусимо публічно дискредитувати лідерів фракції, нашкодивши тим самим його популярності та публічному образу."
 BUL_opression_repress_bs:0 "Репресувати $BUL_bs_name_acc$"
 BUL_popular_suspicions_about_death_assassinated:0 "Служба національної безпеки розпочала розслідування з метою знайти винних у вбивстві. Згідно з офіційними повідомленнями, у злочинця була болгарська, німецька та англійська документація, що лише ускладнює розслідування та підживлює спекуляції. Більшість болгар уважають, що винні [GER.GetLeader], НКВС або [ENG.GetAdjective]а влада, але є й ті, хто наважується стверджувати, що до вбивства царя причетний сам уряд..."
 BUL_promote_bulgarian_nationalism_desc:0 "Може бути незліченна кількість загроз для нашої нації як з-за кордону, так і всередині неї, але якщо ми, болгари, будемо разом і працюватимемо пліч-о-пліч, ми переможемо в неспокійні часи, що нас чекає!"
 BUL_purchase_artillery_tt:0 "\nМи зробимо вибір між придбанням [?BUL_quantity_purchased_artillery] од. §Yартилерії§![GetAvailableArtilleryToPurchase] на основі [FROM.GetAdjective]их досліджень.\n"
 BUL_repress_imro_flag:0 "ВМРО репресована"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance_desc:0 "[SOV.GetNameDef] є потужним союзником, який може підвищити нашу економіку та допомогти нам забезпечити територіальну цілісність [ROOT.GetNameDef] у ці важкі часи. Ми мусимо спробувати зміцнити зв'язки з урядом [SOV.GetAdjective] і отримати його цінну підтримку, якщо ми хочемо перемогти численних ворогів, які нас оточують."
 BUL_stefan_tsanev:0 "Стефан Цанев"
 BUL_strengthen_the_royal_dictatorship_desc:0 "Ми мусимо зосередитися на тому, щоб пропагувати лояльність до Боріса і викорінювати будь-яку опозицію режиму. Це відкриває шлях до Царя-Об'єднавця, щоби нарешті принести славу, на яку заслуговує наш улюблений народ."
 BUL_support_imro_garrisons_tt:0 "Отримає [?BUL_imro_garrisons_mp_value|Y] од. §Yлюдських ресурсів§! за кожну македонську землю під повним [ROOT.GetAdjective]им контролем."
 BUL_the_path_towards_a_greater_bulgaria_desc:0 "Ми мусимо почати налаштовувати нашу економіку, щоб вона витримала неминучу мобілізацію болгарської армії. Бо шлях до великої Болгарії переповнений війнами та конфліктами."
 BUL_zveno_bulgaria:0 "Болгарська республіка"
