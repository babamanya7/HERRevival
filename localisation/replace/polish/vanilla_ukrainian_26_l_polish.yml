 strength_in_unity_goal_desc:0 "Країни в нашому куточку світу повинні стояти разом. Створивши міцний альянс, ми маємо найкращі шанси залишатися незалежними та нейтральними."
 strike_usa_focus:0 "Ударити по США!"
 strike_usa_focus_desc:0 "Підступні американці намагаються нас задушити: вони контролюють поставки нафти, що йдуть до нас, та інших життєво необхідних ресурсів. Їхня промисловість багаторазово перевершує нашу, тому удар треба завдавати стрімко та потужно! Тривалої війни зі США нам не витримати..."
