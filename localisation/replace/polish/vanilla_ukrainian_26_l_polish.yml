 PEACE_CONFERENCE_SHIP_CONTEST_BREAKDOWN_BEGIN:0 "У цього корабля є £peace_conf_icons|3 §Rзаперечені§! вимоги:"
 PEACE_CUSTOM_PUPPET_STATE_LABEL:0 "$ACTION$ $STATE$"
 PEACE_END_TURN_EXPECTED_CONTEST_DESC:0 "Деякі обрані Вами ставки призведуть до виникнення £peace_conf_icons|3 §Rоспорюваної ставки§!, оскільки інша країна вже висунула подібні вимоги."
 PEACE_FOR_OUR_TIME:0 "Peace for Our Time"
 PEACE_WAR_SCORE_REDISTRIBUTION_FROM_TOP_FACTION_INFLUENCE:0 "Отримано від перебування в топ-$AMOUNT|Y$ за впливом в альянсі"
 PER_assadollah_hosseinpoor:0 "Асадолла Хоссейнпур"
 PER_azadi_autonomy_effect:0 "Дух Азаді"
 PER_battlefield_support_desc:0 "Щоб забезпечити безпеку наших військ під час маршу до лінії фронту, вкрай важливо використовувати наші літаки наземної підтримки, щоб запобігти обстрілу нашої армії ворожими літаками."
 PER_bolster_infantry_desc:0 "Звичайний піхотинець вважався основою будь-яких збройних сил протягом поколінь, і це не та посада в армії, якою ми повинні нехтувати. Давайте посилимо нашу піхоту та забезпечимо, щоб наші армії марширували добре та з гордістю."
 PER_capital_protect_desc:0 "Враховуючи розташування [PER.Capital.GetCapitalVictoryPointName], це ідеальне місце для організації рішучої оборони. Встановивши тут бункери та опорні пункти, ми зможемо стати останнім бастіоном надії в [PER.GetNameDef]."
 PER_clergy_upset_tt:0 "§RПрийняття цього фокусу засмутить Духовенство. Якщо стабільність впаде надто низько, ви ризикуєте отримати революційну громадянську війну!§!"
 PER_communist_events.7.b:0 "Ми не можемо дозволити собі ескалацію."
 PER_curtail_pan_arabism_desc:0 "Арабські народи Близького Сходу та Північної Африки дедалі більше приймають ідею панарабської солідарності. Ми не можемо дозволити їм стати об'єднаною силою біля нашого порогу, і тому повинні завдати превентивного удару, щоб запобігти цьому."
 PER_demand_iraqi_territory:0 "Вимагати Іракську територію"
 PER_expand_unique_unit:0 "Розширити Легіон Безсмертних"
 PER_expand_unique_unit_desc:0 "Створивши Легіон Безсмертних як частину нашої імперської спадщини, ми тепер можемо спрямувати ресурси на розширення цього престижного легіону та дозволити набагато більшій кількості чоловіків стояти пліч-о-пліч, щоб нести тягар [PER.GetAdjective] Імперії!"
 PER_fakhrafagh_parsa:0 "Фахрафаг Парса"
 PER_fight_for_iran_shortcut:0 "Боротьба за Іран"
 PER_finding_a_shah_desc:0 "З поразкою династії Пехлеві ми маємо можливість поставити на Сонячний Трон більш згідливого шаха, який буде дотримуватися мудрих порад своїх довірених радників."
 PER_food_for_all:0 "Їжа для кожного [PER.GetAdjective]"
 PER_force_them_back_desc:0 "Ми завжди знали, що коли почнеться війна, нам доведеться або перейти до оборони, або відкинути ворогів назад. Якщо ми оберемо наступальний шлях, ми матимемо хороші позиції для висунення вимог після завершення конфлікту. Це може бути ризиковано, але наші сили готові до такої операції."
 PER_force_white_peace_desc:0 "Вторгнення нашого ворога пішло не за планом. Через наш запеклий опір та бажання протистояти їм, їм не вдалося отримати значного просування в [PER.GetNonIdeologyName]. Враховуючи їхні труднощі, ми маємо хороші позиції, щоб нав'язати білий мир цим зухвалим загарбникам."
 PER_free_elections_desc:0 "З формуванням нашого нового, оновленого уряду, настав час нам вирішити, хто буде Прем'єр-міністром, який поведе [PER.GetNameDef] у золоту добу демократії!"
 PER_fund_state_intelligence_desc:0 "Спрямовуючи більше грошей у нашу державну розвідувальну програму, ми повинні мати можливість більш уважно стежити за потенційними повстаннями та заколотами в нашій країні. Придушуючи їх у зародку, ми продовжуємо забезпечувати безпеку та захист нашої нації."
 PER_future_of_war_desc:0 "Лише кілька десятиліть тому війни все ще велися за допомогою людини та коня, мізерної артилерії та старомодної тактики. У ці сучасні часи настає ера танків. Ми повинні продовжувати не відставати від прогресу у військових технологіях, якщо хочемо протистояти силам, що нам загрожують."
 PER_his_fathers_footsteps_desc:0 "Після трагічної загибелі Рези-шаха Пехлеві його син, Мохаммед Реза Пехлеві, взяв на себе мантію лідера [PER.GetNameDef]. Незважаючи на те, що він молодий король, який не мав бажання правити, він повинен наслідувати шлях свого батька та принести славу [PER.GetNameDef]."
 PER_imperial_events.140.b:0 "У нас є важливіші речі, про які варто думати"
 PER_imperial_events.172.a:0 "$PER_imperial_events.162.a$"
 PER_imperial_events.2.a:0 "Чудова новина."
 PER_imperial_events.201.desc:0 "[FROM.GetLeader] був дуже захоплений, коли йому представили наші пропозиції щодо договору про дружбу та пакту про ненапад, і не гаючи часу, повернувся до нас зі своїми підписами на нашому договорі. З їхньою згодою ми на крок ближче до досягнення миру вдома та миру у світі!"
 PER_imperial_events.70.b:0 "У нас немає часу на такі легковажності"
 PER_imperial_events.70.t:0 "Реза-шах Пехлеві бажає відвідати [GER.GetNameDef]"
 PER_imperial_events.72.a:0 "Ну що ж, повертаємося до роботи."
 PER_imperial_excellency_tt:0 "Після завершення національного фокусу §YРозширити Імперську гвардію§!, §Yдві§! одиниці §YІранської імперської гвардії§! будуть набрані у §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_infantry_equipment_bonus:0 "Посилення піхотного озброєння"
 PER_islamic_rep_party:0 "Ісламська рада"
 PER_islamic_revolution_events.2.a:0 "Працювати над придушенням цих революціонерів."
 PER_march_on_saadabad_desc:0 "Режим не зміг вирішити наші скарги, тому ми рушимо на комплекс Са'дабад і висунемо шаху ультиматум. Або він погодиться на зміну курсу та залишиться сувереном, або зіткнеться з гнівом нашого руху."
 PER_military_high_schools:0 "Створити військові середні школи"
 PER_national_museum:0 "Відкрити Національний музей"
 PER_one_for_all_all_for_one:0 "Один за всіх, всі за одного"
 PER_post_war_spoils_desc:0 "Тепер, коли війна добігла кінця, ми маємо вирішити, що робити з нашою захисною окупацією [IRQ.GetNonIdeologyName] та [AFG.GetNonIdeologyName]. Звернувшись до наших союзників, ми вирішили, що найкращим курсом дій буде інтеграція цих територій в управління [PER.GetNameDef]. Таким чином, ми зможемо забезпечити міцніший та стабільніший Близький Схід."
 PER_promote_communism:0 "Освітня кампанія"
 PER_rapid_appeasement_idea:0 "Швидке заспокоєння"
 PER_reintegrate_anatolia:0 "Реінтегрувати Анатолійську територію"
 PER_resist_gharbzadegi_idea:0 "Опір гарбзадегі"
 PER_reza_mizani:0 "Reza Mizani"
 PER_spoils_of_war_desc:0 "Наші зусилля в цій війні не залишилися непоміченими нашими союзниками, які відкриті до ідеї, що [PER.GetNameDef] забезпечить територію в навколишньому регіоні після закінчення війни. Це чудова можливість скористатися здобиччю війни."
 PER_ssb_events.7.t:0 "[IRQ.GetNameDefCap] відкриває Багдадську залізницю для Саадабадського пакту"
 PER_swear_fealty_tt:0 "Надішле нашим ворогам §Yподію§!, що пропонує нам здатися та приєднатися до них як §Yмаріонетка§!. Це відмикає §Yгілку маріонетки§!, що дозволить нам вирішити, як ми хочемо діяти."
 PER_tech_share_bonus:0 "Технологічна співпраця"
 PER_tehran_power_grid_bonus:0 "Електромережа Тегерана розширена"
 PER_territory_demands_tt:0 "Це надішле вимоги до відповідної країни, вимагаючи, щоб вони §Yпередали§! нам свої прикордонні території. Вони більш імовірно зроблять це, якщо наші військові будуть більш §Yпотужними§!."
 PER_trial_fifty_three_idea_desc:0 "Після арешту п’ятдесяти трьох іранців за участь у комуністичній політичній діяльності ми змогли притягнути їх до суду за антиурядові настрої. Ми не могли дозволити, щоб такі інакомислення вкоренилися в такий критичний час для нашої нації."
 PER_university_of_isfahan_bonus:0 "Профінансовано Університет Ісфахана"
 PHI_appoint_macarthur:0 "Призначити МакАртура"
 PHI_asean_tag:0 "Асоціація держав Південно-Східної Азії"
 PHI_cavite_naval_base_desc:0 "Військово-морська верф у Кавіте, розташована через затоку від міста Маніла, має найбільший потенціал стати глибоководним портом і верф'ю на Філіппінах. Вона вже має деякі зародкові потужності, але за умови інвестицій може стати серйозним стратегічним активом, де можна розмістити флот, здатний контролювати води Південно-Східної Азії."
 PHI_chief_justice:0 "Головний суддя"
 PHI_cristanto_evangelista:0 "Крісанто Еванхеліста"
 PHI_decision_cost_convoys_icon_very_small:0 "15 £GFX_topbar_convoys"
 PHI_devil_boats_ns:0 "Диявольські човни"
 PHI_emma_rotor:0 "Emma Rotor"
 PHI_government_reform:0 "Урядова реформа"
 PHI_inspect_road_network:0 "Перевірити дорожню мережу"
 PHI_jose_abad_santos:0 "Хосе Абад Сантос"
 PHI_jose_v_andrada:0 "Jose Andrada"
 PHI_luce_celler_act:0 "Закон Люса-Селлера"
 PHI_manila_tag_democratic:0 "Філіппіни"
 PHI_mariveles_naval_base_desc:0 "Маніла має базові військово-морські споруди, проте має потенціал для набагато більшого. Перше, що ми повинні зробити, це розширити військово-морську базу Марівелес, розташовану на стороні Батаан. Цей глибоководний порт може розмістити значніші потужності для виробництва та обслуговування військово-морських активів."
 PHI_marsman_and_company:0 "Marsman and Company"
 PHI_mindanao_transport_decision_unlock_tt:0 "§YРозблоковує рішення§! продавати конвої за військове спорядження"
 PHI_mineral_prospecting_chromium_small_decision:0 "Розвідка родовищ хрому"
 PHI_petition_the_supreme_court_communism_timed_idea:0 "Комуністичний тиск"
 PHI_philippine_resistance_movement_dynamic_modifier_tt:0 "Змінює §Y$PHI_philippine_resistance_movement_dynamic_modifier$§!:"
 PHI_polynesia_tag_neutrality:0 "Австронезійська співдружність"
 PHI_polynesia_tag_war_communism_ADJ:0 "$PHI_polynesia_tag_communism_ADJ$"
 PHI_polynesia_tag_war_fascism_ADJ:0 "$PHI_polynesia_tag_fascism_ADJ$"
 PHI_rally_the_fisherfolk_desc:0 "Оскільки ми є архіпелагом, наша рибальська промисловість велика і добре укомплектована людьми. Тому ми повинні звернути увагу на цих селян моря, залучити їх до комуністичного руху та використати морський потенціал, який вони пропонують."
 PHI_recovering_economy_dynamic_modifier:0 "Відновлення економіки"
 PHI_reino_de_filipinas:0 "Королівство Філіппіни"
 PHI_richard_sutherland:0 "Richard Sutherland"
 PHI_slippery_slope_desc:0 "Зростаючий японський вплив на нашу націю почав підпалювати хмиз невдоволення. Все, що нам потрібно зробити, це відійти вбік і спостерігати, як гнів проти жадібності, притаманної корумпованій демократичній капіталістичній системі, вибухає, залишаючи по собі вакуум, який більш радикальні ідеології з радістю допоможуть заповнити."
 PHI_subject_surrender_tt:0 "§RВтрата контролю над усім регіоном [327.GetName] завершить цей фокус.§!"
 PHI_treaty_of_manila_desc:0 "[IndependentOrNot]"
 PHI_trucks_and_transport_requisition:0 "Реквізиція вантажівок і транспорту"
 PHI_war_of_independence_desc:0 "Дайте мені свободу або дайте мені смерть! Настав час для колоніальних гнобителів залишити наші береги назавжди. \n\nНове сонце сходить над Філіппінами."
 PHI_yuitsu_tsuchihashi:0 "Yuitsu Tsuchihashi"
 PICK_RANDOM_COUNTRY_TITLE:0 "Обрати випадкову країну"
 PIERCING_ENEMIES_THRESHOLD_ENTRY:0 "Ця дивізія може завдати $PIERCE_VALUE|%H$ шкоди крізь броню $NUM|H$ ворожих дивізій."
 PLAYER_AI_PREFS_OPTION4_DESC:0 "Чи зможе ШІ переміщувати торговців в інші точки"
 PNG_fascism_DEF:0 "Папуа"
 POK_fascism_DEF:0 "Велике Королівство Мемпаваг"
 POLITICS_GRACE_PERIOD_END:0 "Підготовка триватиме до $DATE|Y$."
 POLITICS_ONLY_IDEA_FOR_COUNTRY:0 "Ідея $IDEA|H$ є єдиною в групі $GROUP|H$"
 POLITICS_SUBGOAL:0 "Завдання Nº $NUMBER$"
 POL_BEL_autonomy_eu_member:0 "Європейська Польща"
 POL_EMPIRE_fascism_DEF:0 "Польська імперія"
 POL_VICTORY_POINTS_11372:0 "Кошалін"
 POL_adam_zakrzewski:0 "Адам Закшевський"
 POL_air_innovations_desc:0 "У галузі повітряної стратегії і тактики ще багато чого треба зробити."
 POL_appoint_new_officers:0 "Призначити нових офіцерів"
 POL_april_constitution_dem_2:0 "$POL_april_constitution_dem$"
 POL_claim_livonia_desc:0 "Серед балтійських народів існує непорушне почуття братерства і товариськості, і тепер, коли ми представляємо інтереси Литви, ми можемо заявити про це почуття братерства для себе і об'єднати країни Балтії в нашу зростаючу імперію."
 POL_complete_plan_west_tt:0 "Відкриває доступ до §Yплану «Схід»§!, якщо він іще не виконаний.\nЗабороняє виконання подальших фокусів у гілці §Yплану «Захід»§!."
 POL_cossack_republic_decisions:0 "Козацькі республіки"
 POL_demand_slovakia_desc:0 "$POL_demand_slovakia_pavel_desc$"
 POL_destroyer_1_desc:0 "Два есмінці типу «Wicher» були введені в дію між 1930 і 1932 роками, ставши першими великими надводними кораблями ВМС Польщі. Це були великі есмінці з водотоннажністю в 1540 тонн. Відповідно до проєкту вони мали бути озброєні чотирма 130-мм знаряддями, які замінили 120-мм знаряддями шведського виробництва незадовго до вторгнення Німеччини. Торпедне озброєння та системи ППО також були модернізовані."
 POL_expand_intelligence_idea_desc:0 "Втративши батьківщину, Польща може сподіватися відновити свою незалежність, лише підтримуючи рухи опору та закидаючи своїх ворогів таємними агентами."
 POL_foreign_naval_support_desc:0 "Те, що залишилося від нашого флоту, перебуває в жалюгідному стані. І хоча ми, можливо, ніколи не зможемо відновити його колишню славу, підтримка наших спонсорів може дати польським морякам можливість допомагати нашим друзям на морі."
 POL_fortification_of_belarus_desc:0 "Північна частина Східної Польщі — це не що інше, як низка густих лісів, серед яких немає жодних ознак цивілізації. Так не може тривати у випадку вторгнення; ці ліси повинні бути перетворені на щит проти більшовизму!"
 POL_heavy_tank_equipment_1_short:0 "27TP"
 POL_ideological_fanaticism_desc:0 "Незліченна кількість молодих людей навчається в університетах по всій країні, і ми втрачаємо золоту нагоду вкласти в їхні голови ідеали Польщі, яку ми будуємо. Ми повинні заохочувати молодих людей ставати патріотами, борцями і захисниками польських ідеалів!"
 POL_integrate_the_falanga_desc:0 "НРЛ–Фаланга є насильницькою і підривною організацією, але зростання націоналізму в уряді може спонукати фалангістів об'єднатися з нами заради майбутнього Польщі."
 POL_join_CZE_military:0 "Приєднати чеську армію"
 POL_legion_of_merit:0 "Легіон заслуг"
 POL_light_ship_engine_4:0 "Двигун 75 000 к. с. н. в."
 POL_nav_bomber_equipment_3_short:0 "Mors"
 POL_new_military_academy_desc:0 "Наше верховне командування є безплідним і пустим, але це залишає чудову можливість посіяти зернята на майбутнє, гарантуючи, що майбутні генерали будуть віддані нашій нації і високоосвічені у військовому мистецтві. Фінансуючи військові академії по всій країні, ми гарантуємо, що будь-які нові польські офіцери будуть вищого калібру, ніж їхні попередники."
 POL_poland_first_desc:0 "Благо нації повинно мати пріоритет над так званими «істинами». Подібно до того, як ми куємо свою долю, ми повинні кувати свої власні факти."
 POL_privatized_education:0 "Націоналізована промисловість"
 POL_pro_allied_government_desc:0 "Багато сеймиків вже виступають за продовження орієнтації Польщі на Захід, і, просуваючи цих представників на вищі щаблі в уряді, ми робимо себе більш відкрито дружніми до справи членів Альянсу."
 POL_promote_falangism_benelux:0 "Просувати фалангізм у §YБенілюксі§!"
 POL_reassert_silesian_claims:0 "Знову заявити права на Сілезію"
 POL_ship_torpedo_1:0 "3x 533-мм торпедний апарат"
 POL_soviet_industry_default:0 "Радянські промислові інвестиції"
 POL_state_national_council:0 "Krajowa Rada Narodowa"
 POL_support_weapons4:0 "Nkm wz. 38 FK & Moździerz wz. 40 ST"
 POL_the_bombe_no_mtg:0 "$POL_the_bombe$"
 POL_the_sanation_left_desc:0 "Лояльна Валерію Славеку Ліва санація представляє тих, хто вважає Славека справжнім наступником Пілсудського і шукає порозуміння з опозицією, замість того, щоб повністю вигнати її з уряду, як це роблять праві та Замок. Хоча співпраця з ними, ймовірно, засмутить Праву санацію, ліві мають внутрішню силу, яка нам потрібна для створення компетентного кабінету міністрів."
 POL_the_twin_threats:0 "Продовжити модернізацію флоту"
 POL_tighten_control:0 "Посилити контроль"
 POPS_ua:0 "Не відповідає вимогам"
 POR_appease_monarchists:0 "Умиротворити монархістів"
 POR_army_reorganization_desc:0 "Треба реорганізувати армію, зменшивши роздуту чисельність офіцерів і неефективні підрозділи, запровадивши належну призовну систему. Це створить основи сучасної армії."
 POR_battleship_effort:0 "Розвиток лінкорів"
 POR_infantry_equipment_3:0 "FBP m/948"
