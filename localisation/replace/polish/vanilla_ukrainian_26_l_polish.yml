 raid_type_INS_militia_increase_activity_raid_desc:0 "Ми відправимо ополчення до регіону, де вони вийдуть на зв'язок із місцевими революціонерами та створять партизанські осередки. Якщо операція пройде успішно, ми спробуємо проникнути в регіон і відібрати контроль у нідерландців.\n\n§WЦільовий регіон має перебувати в межах досяжності §Yбункера§!, §Yзалізниці§! або §Yвійськово-морської бази§!, що належать республіканцям. Ці споруди можна використовувати як вихідні пункти.§!\n\n§YЕфекти:§!\n§RПризначена дивізія витрачається§!\n§YУспіх:§!\n        §WСтає власником і контролером регіону\n        Збільшує ескалацію на §R1§!§!.\n§YЧастковий успіх:§!\n        §WДодає §Yодин рівень§! активності ополчення, збільшуючи шанси на успіх майбутніх спроб.§!\n§YНевдача:§!\n        §WБез ефектів§!."
