 GRE_georgios_papandreou:0 "Георгіос Папандреу"
 GRE_heavy_cruiser_1_desc:0 "The Averof was an armored cruiser that was built in Italy for the Hellenic Navy prior to World War I. She served throughout World War II as the flagship of the fleet. The Averof was quite powerful compared to cruisers of her time, displacing nearly 10,000 tons. She was very well-armored and had a main armament of four 234mm/45 Armstrong guns. Despite all of this, she was relatively fast for an armored cruiser."
 GRE_italian_influence_tt:0 "Якщо надто сильно розраховувати на §Y[FROM.GetAdjective]у§! допомогу, наш суверенітет може опинитись під загрозою.\n"
 GRE_last_country_standing:0 "Остання держава, що залишилася"
 GRE_medium_tank_equipment_2:0 "PKD Vouváli I"
 GRE_metaxism_lost_tt:0 "Якщо ми не провели останні з реформ Метаксаса, ми втратимо національний дух §Y$GRE_metaxism_focus$§!!"
 GRE_metaxism_warning_tt:0 "\nЯкщо §YГреція§! вступить в альянс до повного поліпшення національного духу §Y$GRE_metaxism_focus$§!, він буде §Rвидалений§!.\n"
 GRE_monarchist_civil_war:0 "Почалася громадянська війна через абсолютистське правління Георга II"
 GRE_paying_back_our_debts_in_bulk_ENG_tt:0 "Буде відкрите рішення: §YВелика виплата боргу перед [ENG.GetAdjective]ою державою§!.\n"
 GRE_rapprochement_with_the_italians_desc:0 "Відчайдушні часи вимагають відчайдушних заходів. Ми мусимо зробити немислиме та звернутися до італійців за допомогою у модернізації країни. Чим вони шантажуватимуть, як вони тиснуть на нас, перш ніж погодяться? Лише Бог знає. Якщо, звичайно, така угода можлива в принципі..."
 GRE_recommission_the_american_battleships:0 "Повторне введення в експлуатації американських лінкорів"
 GRE_reevaluating_the_drachma_desc:0 "Нашим фінансовим негараздам, здається, немає числа; дефолти та борги зробили нашу економічну ситуацію абсолютно нестерпною. Ми мусимо підштовхнути нашу валюту до девальвації, щоби стимулювати приплив закордонного капіталу, нехай навіть у довгостроковій перспективі це посилить наші борги."
 GRE_restoring_our_home_desc:0 "Час був немилосердний до Греції — нас мучили війни, борги та злидні. Тепер, коли на наші береги нарешті повернулася дипломатія, настав час відкинути експлуататорів-німців та італійців. Замість них варто зосередитися на зближенні з британцями, які, як ми сподіваємося, допоможуть нам відновити націю як її промисловість, так і її дух."
