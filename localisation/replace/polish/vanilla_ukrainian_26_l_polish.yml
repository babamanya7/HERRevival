 trusty_no_lar:0 "$trusty$"
 tsr_fake_china_opm:0 "Уряд самозванців"
 tsr_manchukuo.12.desc:0 "Надійшли повідомлення про те, що Народно-революційна партія Внутрішньої Монголії на чолі з Серенгдонрубом разом із маньчжурськими бандитами проникла в кілька важливих точок на півночі і тепер чекає свого часу, щоб завдати удару. Ми ще не знаємо, коли це станеться, але побоюємося, що це буде скоро."
 tsr_manchukuo.2.t:0 "[FROM.GetLeader] просить контроль над Далянем"
 tsr_manchukuo.8.a:0 "Нападайте!"
 tsr_manchukuo_border_war.3.t:0 "[MAN.GetNameDefCap] завойовує [608.GetName]"
 tut_14_text_1:0 "Щоб переправити війська між двома дружніми територіями, Ваші війська мають знаходитись у порті.\n\nОберіть дивізії, що знаходяться §Yв порту§! та §Gклацніть правою кнопкою миші§! на інший §Yпорт в Італії§!."
 uk_carrier_focus_desc:0 "Серед флотських теоретиків точаться запеклі суперечки щодо подальшої життєздатності лінкора. Є ті, хто стверджує, що сучасні повітряні сили домінуватимуть над морськими, і що авіаносець замінить лінкор у ролі короля океанів."
 uk_greece_focus_desc:0 "В наших інтересах мати право на базування в Греції. І, відверто кажучи, греки не в тому становищі, щоби відмовити нам."
 uk_jet_focus_desc:0 "Здається, майже напевно, що реактивний двигун прийде на зміну гвинтовим двигунам на літаках. Потенціал величезний, і ми не мусимо дозволити Британії відставати в цій важливій галузі досліджень."
