 MUN_czech.1054.d:0 "Як і було домовлено раніше, [FROM.GetNameDef] виступила з пропозицією, яка допомогла б зміцнити нашу країну. А саме, шляхом насильницького об'єднання з Литвою; це дало б нам доступ до додаткових ресурсів і позбавило б ворога можливості атакувати нас через Литву"
 MUN_czech.7.b:0 "У нас не було б і шансу проти [GER.GetAdjective]ого війська"
 MUN_czech.news.1.b:0 "Хаос — це драбина."
 MUN_czech_bop.1.d:0 "Зусилля з проведення реформ у першій половині десятиліття починають приносити свої плоди. Наразі наша армія є однією з найсучасніших у Європі. Проте серед деяких політиків і керівників багатьох промислових конгломератів почало поширюватися почуття самовпевненості. Якщо наша армія має залишатися на піку бойової готовності, ми повинні боротися з можливими сумнівами щодо її здатності воювати, а також з тими, хто прагне підірвати її заради власної вигоди."
