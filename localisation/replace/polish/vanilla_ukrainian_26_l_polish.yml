 RAJ_hide_communist_infiltration:0 "§RРішення про комуністичну інфільтрацію буде скасовано після виконання наших зобов'язань§!"
 RAJ_hindi_as_a_national_language:0 "Хінді як національна мова"
 RAJ_imperial_rail_renewal_act_tt:0 "Додати §G1§! §Y$industrial_complex$§! за кожен завершений фокус залізниці в промисловій гілці."
 RAJ_indian_army_corps_of_engineers_desc:0 "Від укріплень до мостів, [ROOT.GetAdjective] Інженерний корпус армії є важливим для оперативного успіху. Розширюючи та оснащуючи цю життєво важливу галузь, ми забезпечуємо, що наші сили можуть подолати будь-яку перешкоду, прокладаючи шлях до тріумфу на кожному фронті."
 RAJ_indian_national_army_desc:0 "Сформовано Індійську національну армію, незалежну від армії, підконтрольну британцям. Ми можемо створювати її частини у вільних від британського впливу регіонах та використовувати проти Союзників, позбавляючи імперію доступу до індійських людських ресурсів."
 RAJ_instigate_in_sia_desc:0 "Ми оберемо [SIA.GetName] $RAJ_instigate_generic_desc$"
 RAJ_jaguar_desc:0 "Ягуар — ідеальний кандидат для здійснення демократичного правосуддя згори."
 RAJ_lions_of_the_great_war_dlc:0 "$RAJ_lions_of_the_great_war$"
