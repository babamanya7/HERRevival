 CHI_GATHERING_STORM_DESC:0 "Незадовго після революції, що скинула уряд останнього імператора династії Цін, молода Китайська республіка була вимушена відчайдушно боротися за виживання. Воєначальники керують більшістю земель на периферії. В центрі країни комуністи встановили свою базу у важкодоступній гірській долині. Просто поза нашими кордонами японці створили маріонетковий уряд на чолі з останнім китайським імператором, і вони намагатимуться об'єднати країну під його правлінням.\n\nОскільки в уряду Чана Кайші є багато ворогів, йому доведеться приймати дуже складні рішення, якщо він хоче вижити та втримати владу над Китаєм."
 CHI_anti_opposition_campaigns_effect_tooltip_no_communists:0 "§RЖоден воєначальник іще не став на бік комуністів.§!\n"
 CHI_armoured_car_tactics_desc:0 "Більшість армій отримують все більш важкі броньовані підрозділи в гонці промислової могутності. Однак, ніхто не стає ефективнішим із сокирою, коли потрібен ніж."
 CHI_camco_1:0 "CAMCO"
 CHI_central_steel_and_machine_works:0 "Центральний металургійний та машинобудівний завод"
 CHI_chiang_ching_kuo:0 "Цзян Цзінго"
 CHI_ching_lings_republic_democratic_ADJ:0 "Китайськ"
 CHI_commemorate_the_labour_corps:0 "Вшанувати Трудовий корпус"
 CHI_commemorate_the_labour_corps_desc:0 "Наші люди вирушили за кордон і працювали задля визнання нашої нації, проявляючи старанність на полях битв Великої війни. Хоча [ENG.GetAdjective]а та [FRA.GetAdjective]а влада не пам'ятає їх, ми пам'ятаємо, і ми вшануємо їхню працю, піднісши пам'ять про них і взявши їхній досвід близько до серця."
 CHI_crack_down_on_illicit_goods_desc:0 "Занадто довго ми були залежні від отрути, що просочується крізь наше суспільство, і тих, хто нею торгує. Ми повинні відкинути цю спокусу, щоб вийти сильнішими та з яснішим розумом у нове століття процвітання."
 CHI_crackdown_on_corruption_in_recruitment_desc:0 "Відтоді, як була створена республіканська армія, існували системні проблеми з набором. Люди відкуплялися від служби, а креативна бухгалтерія використовувалася для розкрадання зарплат. Цьому потрібно покласти край, якщо ми хочемо пережити натиск сучасного світу, адже тут немає місця неефективності."
 CHI_demonstrate_our_resolve_desc:0 "Решта світу занадто довго дивилася на нас зверхньо. Настав час довести нашу відвагу, перемігши цю жорстоку агресію."
 CHI_financial_policy_desc:0 "Економічний стан у країні не з найкращих, а амбіційні урядові програми загрожують неконтрольованою гіперінфляцією. Фінансова реформа має стати нашим першим пріоритетом."
 CHI_foreign_economic_support:0 "Іноземна економічна підтримка"
 CHI_growing_impatience_dummy:0 "Зростаюче нетерпіння"
 CHI_hyper_inflation_2:0 "Середня інфляція"
 CHI_institute_cross_border_raids:0 "Прикордонні рейди"
 CHI_integrate_tibet:0 "Інтегрувати Тибет"
 CHI_introduce_income_tax:0 "Ввести прибутковий податок"
 CHI_introduce_the_baojia_system:0 "Запровадити систему Баоцзя"
 CHI_join_the_chinese_soviet_desc:0 "Революція може досягти успіху лише тому випадку, якщо всі комуністи об'єднають свої зусилля. Потрібно вжити заходів, щоб усередині партії не залишилося реакціонерів — інакше революція може зазнати краху, навіть не розпочавшись."
 CHI_legitimise_du:0 "Легітимізувати Ду"
 CHI_lend_lease_missions_cat_desc:0 "Підтримка, яку ми отримуємо з-за кордону, дозволила нам дати відсіч окупантам, але нічого не дається безкоштовно. Ми повинні продовжувати демонструвати, що заслуговуємо на підтримку, яку отримуємо зараз, і що ми можемо використовувати і заслуговуємо на більше."
