 british_far_east_desc:0 "Якщо Японія збирається зайняти належне їй по праву місце лідера нового світового порядку у Великій Східній Азії, то Британію необхідно позбавити її азійських володінь. Захопіть Гонконг, окупуйте півострів Малакка і увійдіть до Бірми. Розширте свої."
