 POR_nationalize_industry_desc:0 "Приватний капітал надто довго виснажував нашу економіку та затримував прогрес нашого суспільства. Ми повинні позбутися цього, націоналізувавши приватні компанії та взявши під контроль виробництво кожної окремої фабрики, на благо народу Португалії."
