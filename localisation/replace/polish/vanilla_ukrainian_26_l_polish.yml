 FRA_align_belgium_desc:0 "Бельгійці завдячують нам своїм існуванням, і ми не можемо дозволити їм забути цей факт. Якщо ми дозволимо їм залишатися незалежними, ми принаймні забезпечимо створення дружнього уряду."
 FRA_appeal_to_the_french_nation_desc:0 "Франція, можливо, програла битву, але не програла війну. Обов'язок кожного француза-патріота — чинити спротив."
 FRA_apx_organization:0 "$FRA_APX$"
 FRA_ban_covert_intervention:0 "Заборонити таємне втручання"
 FRA_battleship_2_desc:0 "Лінкори типу «Richelieu» були останніми лінкорами, прийнятими до складу ВМС Франції. Вони були вдосконаленою конструкцією «Dunkerque» і дозволені відповідно до військово-морських програм 1935 і 1938 років. Вони мали відмінне зенітне озброєння, швидкість і дальність польоту, що робило його чудовим капітальним кораблем. З чотирьох замовлених лише два були запущені, а один був завершений до падіння Франції. Були численні спроби закінчити інші кораблі, використовуючи різні проєкти, запропоновані для використання як зенітні лінкори, гібриди лінкорів і авіаносців або повномасштабні авіаносці."
 FRA_carrier_focus_desc:0 "Теоретики морської справи вказують на те, що наші авіаносці застаріли. Вони мають ідеї, як удосконалити ці кораблі, якщо розвиток піде у правильному напрямку. Але це неможливо без вашої повної підтримки."
