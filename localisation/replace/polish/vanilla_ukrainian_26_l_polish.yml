 CHI_political_power_struggle_desc_active:0 "У Китаї почалася кривава боротьба за владу. Щоб перемогти, ми мусимо заручитися підтримкою місцевих правителів і населенням у різних областях."
 CHI_prepare_for_a_change_in_leadership_tt_2:0 "§RВідправлення Чана Кайші до Гуанчжоу під час Лянгуанського інциденту призведе до його більш ранньої смерті, що дозволить обрати фокус $CHI_look_for_allies$§!"
 CHI_proclaim_rival_government_desc:0 "Настав час оголосити усьому світу про свої амбіції. Нас влаштує лише повний контроль над Китаєм, і ми готові вести діалог з іншими державами лише на рівних."
