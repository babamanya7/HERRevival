 germany.104.f:0 "Їм знадобиться ще кілька тисяч смертей."
 germany.1041.b_default:0 "[FROM.GetAdjectiveCap]а військова машина мусить бути зупинена тут."
 germany.105.d:0 "Через наше рішення не давати жодних територій Італії, вона вирішила покинути альянс [Root.GetFactionName], сказавши, що ми — недостатньо достойні, щоби бути їхніми союзниками."
 germany.108.a:0 "Бідний дурень."
 germany.11.a.tt:0 "§RПоки пакт є чинним, торгова політика закритої економіки буде недоступною.§!\n"
 germany.11.d:0 "Міністерство закордонних справ Німеччини запропонувало пакт про ненапад між нашими двома державами. Цей договір збільшить об'єм взаємної торгівлі, а також за додатковим секретним протоколом пропонує розподіл Східної Європи на на німецьку та радянську сфери впливу.\n\nХоча фашисти в Берліні може й не вселяють довіри, цей пакт дозволить нам розквитатися з Фінляндією, країнами Балтії та Румунією, не боячися зовнішнього втручання. Також нам перепадуть східні польські землі у випадку розвалу Польської Республіки."
 germany.124.desc_cze_subject_of_ger:0 "[From.GetAdjective] уряд не мав іншого вибору, окрім як погодитися на повну передачу контролю над Судетами, остаточно відмовившись від будь-яких майбутніх претензій на цей регіон.\n\n[ROOT.GetAdjective] населення Судет нарешті перебуватиме в безпеці під захистом [ROOT.GetNameDef]."
 germany.201.t:0 "[FROM.GetName] хоче возз'єднати Німеччину"
 germany.27.t:0 "Укріплення Західного валу"
 germany.28.t:0 "Німці хочуть аншлюс"
 germany.42.b:0 "Франція не буде брати в цьому участь."
 germany.56.a:0 "Аякже! Велика Угорщина скоро стане реальністю!"
 germany.60.a:0 "Це акт агресії! Збирайте британців на наш бік!"
 germany.63.d:0 "Британці відмовляються підтримувати нас проти Німеччини, виправдовуючися, що німці «просто гуляють у своєму задньому дворі». Якщо ми почнемо війну, схоже, що ми будемо воювати самі.\n\nГромадська думка у Франції висловлюється проти війни, але Німеччина з часом ставатиме тільки сильнішою, а ремілітаризація Райнланду становить пряму загрозу нашим кордонам. Висунення ультиматуму без підтримки Британії буде менш загрозливим для Німеччини. Чи варто нам це робити проти неї самостійно?"
 germany.73.c:0 "На даному етапі Гьорінг — наша єдина надія!"
 germany.92.d:0 "Попри наше уточнення, що ремілітаризація Райнланду буде розглянуте як акт агресії, Німеччина відмовилася поступитися та продовжила просування в демілітаризовану зону, проігнорувавши наше попередження. Це означає, що попри наші спроби зберегти мир, у Європі знову розгорілась війна."
 germany_mefo_bills.4.desc:0 "Витрати на військові потреби досягли безпрецедентного рівня і серйозно підірвали наші фінанси. Без негайного фінансування наше виробництво озброєнь зупиниться, а економіка загалом зазнає удару, намагаючись його підтримати."
