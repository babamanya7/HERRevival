 denmark_political_events.1.desc:0 "[Den.GetLeader] зараз перебуває під важким вогнем критики, і парламент вимагає відставки прем'єр-міністра."
 denmark_political_events.1.t:0 "Вотум недовіри"
 denmark_political_events.8.a:0 "Обрати демократичного прем'єр-міністра"
 denmark_political_events.8.c:0 "$DEN_knud_bach$ утримає нас на вірному шляху"
 denmark_protection_event.1.b:0 "Зараз це не в наших інтересах."
 denmark_protection_event.1.desc:0 "Цього ранку ми прийняли посланця від [FROM.GetAdjective]ого уряду з пропозицією підписати з ними пакт про ненапад. Ця угода буде кроком до зближення з [FROM.GetAdjective]ою стороною."
 denmark_protection_event.11.desc:0 "Чудові новини! [FROM.GetNameDefCap] приймає нашу пропозицію про продаж територій в обмін на гарантії. Нам потрібно виконати свою частину угоди і якомога швидше передати права на землі [FROM.GetAdjective]ому уряду."
 denmark_protection_event.12.desc:0 "Схоже, наша пропозиція продати територію державі [FROM.GetNameDef] була зустрінута відмовою. Наступного разу потрібно буде запропонувати цікавіші умови."
 denmark_protection_event.132.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], відхиляє наше запрошення вступити з нами в альянс, заявивши, що їхній країні немає вигоди укладати союзи з дияволом. Ці негідники дестабілізують регіон, з ними потрібно швидше розібратися!"
 denmark_resistance_event.13.desc:0 "Розвідувальне агентство держави [FROM.GetNameDef] вчинило вкрай недалекоглядно і необдумано. Воно не побачило користі у спільному використанні розвідданих і відхилило нашу пропозицію."
 denmark_resistance_event.7.t:0 "[DEN.GetNameDefCap] звертається до нас за підтримкою"
 denmark_trade_deal.8.c:0 "Вони не заслуговують на нашу продукцію!"
 denmark_trade_deal.8.desc_war_cancelation_denmark:0 "Торговельну угоду з державою [FROM.GetNameDef] скасовано через нещодавню ворожнечу між нашими країнами."
 denmark_trade_deal.8.t_subjugation_cancelation:0 "Окупація перериває данську торгівлю"
 develop_minnesota_steel_deposits:0 "Розвиток металургії в Міннесоті"
