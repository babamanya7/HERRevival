 XIC_recruit_mancurian_bandits_desc:0 "Багато так званих бандитів, що блукають Маньчжурією, насправді є партизанами, які ведуть активну боротьбу проти [JAP.GetNameDef] і [MAN.GetNameDef]. Ми повинні об'єднатися з ними і використати їхній досвід, якщо хочемо мати реальний шанс проти східної загрози."
