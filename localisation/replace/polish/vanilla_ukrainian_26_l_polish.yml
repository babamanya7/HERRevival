 SWI_purchase_fascist_planes_cas_desc:0 "Поки наші промислові можливості все ще обмежені, ми повинні покладатися на державу [FROM.GetName] для забезпечення наших ВПС бомбардувальниками, необхідними для підтримки наших військ на полі бою."
 SWI_reaffirm_spiritual_defense_desc:0 "Наша конфедерація віддана захисту національних цінностей Швайцарії з 1932 року у відповідь на зростаючу загрозу авторитаризму навколо неї. Зараз, як ніколи, ця загроза нависла, тому ми повинні відновити свою обітницю захищати свій спосіб життя фізично та духовно."
