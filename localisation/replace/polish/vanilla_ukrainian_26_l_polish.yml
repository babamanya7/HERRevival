 PAR_get_rid_of_colonel_peredes_desc:0 "Міністр внутрішніх справ Паредес є потенційним суперником через свій вплив. Ми усунемо його, щоб зміцнити нашу владу."
 PAR_guarani_in_the_army:0 "Гуарані в армії"
 PEACE_ACTION_CATEGORY_DEFENSIVE_WAR:0 "Оборонна війна"
