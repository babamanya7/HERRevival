 ARG_mio_trait_dreams_of_a_domestic_tank_trait:0 "Dreams of a Domestic Tank"
 ARG_modify_argentine_airforce_ns_intro:0 "Ідею §Y$ARG_airforce_modifier$§! буде змінено:"
 ARG_monroe_doctrine_idea_desc:0 "Доктрина Монро вже давно слугує засобом запобігання європейському втручанню в Західну півкулю. Для нас вкрай важливо дотримуватися її, якщо ми хочемо вижити під натиском війни."
 ARG_nobel_peace_prize_winner:0 "Лауреат Нобелівської премії миру"
 ARG_political_events.1.t:0 "Армія обертається проти нас!"
