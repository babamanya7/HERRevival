 HINT_EDIT_TEMPLATE_TEXT:0 "Ви виробляєте озброєння, яке не використовується в жодному §Yшаблоні дивізії§!. Але це можна змінити за допомогою £army_experience §Yдосвіду армії§!, який у Вас є.\n\nКлацніть на §YРедагувати§! під шаблоном §YDivisione di Fanteria§! або, за бажанням, будь-яким іншим шаблоном."
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT:0 "Щоб боротися зі спротивом і стежити за населенням, в окупованих областях потрібно розмістити війська, щоб вони виконували поліцейські обов'язки. Тут це відображається внутрішньоігровими гарнізонами, які можна призначати у вкладці §YОкуповані землі§! на Вашому екрані §Yполітики§!, який можна відкрити, клацнувши на прапор Вашої країни в лівому верхньому кутку (або £GFX_Q£ ).\n\nДивізії, потрібні для наповнення гарнізонів, не відображаються на мапі та призначаються й отримують своє оснащення автоматично. Виділення оснащення можна встановити на екрані §Yтренування та розгортання§!."
 HINT_PRODUCTION_LINES_TEXT_2:0 "Коли Ви виберете тип оснащення з однієї з цих категорій, буде створена відповідна виробнича лінія.\n\nПрочитайте §Yнаступну сторінку§! цієї підказки, щоб глянути §Yпоради§! щодо того, що саме виробляти та скільки заводів призначати для кожної лінії."
