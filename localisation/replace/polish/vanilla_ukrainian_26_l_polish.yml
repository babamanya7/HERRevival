 USA_secure_asia:0 "Наведення порядку в Азії"
 USA_south_america_desc:0 "Ніякі колоніальні держави більше не повинні мати впливу у Південній Америці. Ми виступатимемо гарантом незалежності та безпеки наших південних побратимів."
 USA_sp_rockets_medium_range_ballistic_missile:0 "Проєкт «PGM-19 Jupiter»"
 USA_the_canadian_corridor_desc:0 "Вузька смужка малонаселеної канадської землі відокремлює Аляску від нижньої частини США. Таким чином, оборона Аляски залежить від доброзичливості канадців. Втім, найвірогіднішим загарбником є саме Канада. Так більше не може продовжуватися."
 USA_womens_armed_service_integration_act_desc:0 "Ми зараз не в тій ситуації, щоби відмовляти тим, хто бажає служити в лавах нашої армії. Чим більше у нас жінок у військовій формі, тим більше чоловіків ми можемо відправити на фронт."
