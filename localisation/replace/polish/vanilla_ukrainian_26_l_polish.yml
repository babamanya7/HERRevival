 SOV_permanent_revolution_desc:0 "Деспотичного демагога більше немає! Справжня влада повернулася до народу нашої країни. Тепер кожен може відстоювати свої інтереси незалежно і без компромісів. Ми завжди змінюємося. Вічна революція — це революція перемоги."
