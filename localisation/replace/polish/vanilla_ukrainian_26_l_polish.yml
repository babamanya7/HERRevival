 ARG_banco_central_de_la_republica_argentina_desc:0 "Створений шістьма Актами Конгресу в 1935 році, Центральний банк Аргентинської Республіки замінив валютну раду [ARG.GetName]. Його президент, Ернесто Бош, прагне розвинути банк та допомогти розпочати нашу економіку, щоб ми нарешті почали відновлюватися фінансово після Великої депресії."
 ARG_capitalize_the_beef_industry_desc:0 "[ARG.GetAdjective] яловичина є одним з наших основних експортних товарів, особливо для [ENG.GetNameDef]. Ми повинні скористатися цим, розширити наші можливості для скотарства та забезпечити, щоб наше смачне м'ясо було відоме у всьому світі!"
