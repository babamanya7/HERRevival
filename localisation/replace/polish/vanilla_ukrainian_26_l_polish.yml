 INS_can_raid_here_HOL_tt:0 "Цей регіон є потенційною ціллю сухопутного рейду ополчення Республіки. У разі успіху регіон буде відібрано у нас. Щоб захистити регіон від рейдів, ми можемо:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Збільшити §YПеревагу в повітрі§!\n- Зменшити розвіддані для ворогів\n- Зменшити опір у регіоні"
