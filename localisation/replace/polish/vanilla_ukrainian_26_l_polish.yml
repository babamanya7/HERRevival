 UNIT_LEADER_SKILL_LAND_DESC:0 "Якщо у Вашого генерала рівень навичок вищий, ніж у ворожого, він з більшою ймовірністю обере ефективну тактику протистояння ворогу. Навички генерала збільшуються з отриманням досвіду.\n\n"
