 AST_lithgow_arms_organization:0 "Lithgow Arms"
 AST_make_common_cause:0 "Створити спільну справу"
 AST_marines_desc:0 "Як найбільший острів в океані островів, ми маємо забезпечити наявність десантних можливостей для проєкції сили за межі наших берегів. Якщо нам доведеться перейти від оборони до нападу, ці сили дозволять проводити ефективні операції зі стрибків по островах."
 AST_mio_trait_cockatoo_docks_battle_damage_overhaul:0 "Ремонт бойових пошкоджень"
 AST_mio_trait_trainer_to_combat_pipeline:0 "Шлях від навчального до бойового літака"
 AST_pankhurst_walsh_desc:0 "Для формального заснування Руху «Австралія понад усе» ми призначимо Аделу Панкгерст Волш президентом. Як засновниця Австралійської жіночої гільдії імперії, Панкгерст Волш — зберігаючи тісні зв'язки з лондонською Жіночою гільдією — давно відстоювала цінність британського громадянства. Ця цінність стане основним принципом нашого руху: збереження зв'язків з Британією."
 AST_protect_the_south_west_pacific_desc:0 "Настав час використати всю нашу міць у регіоні, щоби залучити всю південно-західну частину Тихого океану до нашої сфери впливу. Тільки ми зможемо захистити громадян і ресурси від чужинців, які роблять замах на нашу спадщину."
 AST_recovery:0 "Відновлення"
 AST_red_solidarity:0 "Червона солідарність"
 AST_soothing_australian_fears_tt:0 "\nЧерез §Y180§! днів:"
 AST_swpa_protector:0 "Захисник ЗПЗТО"
 AST_swpi_research_tt:0 "Ми укладемо §Yугоду про обмін технологіями§! зі США чи іншими членами нашого альянсу."
 AST_take_it_to_foreign_streets:0 "Організувати міжнародний марш солідарності робітників"
 AST_take_it_to_the_streets:0 "Вийти на вулиці"
 AST_the_brisbane_line_desc:0 "Оборонні можливості Австралії можуть бути недостатньо сильними, щоб повністю стримати іноземну агресію. Прийнявши політику, яка надає пріоритет міцній обороні життєво важливих територій, а не слабкій обороні всіх, ми можемо гарантувати, що найбільш розвинені та населені частини [AST.GetName] залишаться під нашим контролем.\n\nХоча така політика безсумнівно зустріне опір тих, хто відкидає будь-яку можливість здачі, уряд несе відповідальність за те, щоб спрямувати [AST.GetName] в розумному напрямку."
 AST_the_publics_australia_desc:0 "Ми відкинули старий порядок і побудували країну, яка існує для багатьох, а не для обраних. Промисловість, праця та ресурси тепер служать народу в цілому. Це Народна Австралія. Рівна, єдина і незламна."
 AST_the_ultimate_overseas_duty_tt:0 "\nЯкщо §Y$AST_robert_menzies$§! очолить Британію, у Фокусі §Y$AST_a_change_of_authority$§! ми зможемо стати §Y$autonomy_associated_dominion$§!."
 AST_through_the_barricades_tt:0 "Якщо §Y[ENG.GetNameDef]§! має щонайменше §Y10%§! підтримки Комунізму, то на початку війни докери в §Y[132.GetCapitalVictoryPointName]§! повстануть на нашу підтримку!"
 AST_training_camps_specialization:0 "Наші тренувальні табори готові запропонувати спеціалізовану підготовку нашим військам, роблячи їх більш ефективними на різних театрах бойових дій."
 AST_veterans_revolt:0 "Повстання ветеранів"
 ASY_benjamin_arsanis:0 "Бенджамін Арсаніс"
 ASY_neo_assyrian_empire_fascism:0 "Велика Новоассирійська імперія"
 AT_PEACE_WITH_SYRIA_OWNER_TT_NOT:0 "Не перебуває у стані війни із Сирією"
 AUS_ELIN_organization:0 "ELIN"
 AUS_VICTORY_POINTS_690:0 "Кронштадт"
 AUS_alpine_federation_against_fascism:0 "Альпійський антифашистський наступ"
 AUS_antischluss_risk_text:0 "Нинішній ризик [GER.GetAdjective]ого Аншлюсу: [GetAnschlussRisk]"
 AUS_artillery_equipment_2_short:0 "15 cm schw. FH M.15"
 AUS_bullied_austria:0 "Австрія залякана"
 AUS_currently_sending_a_subsidy_flag:0 "Зараз відправляє військову допомогу союзнику"
 AUS_danubian_bloc:0 "Дунайський блок"
 AUS_elin_desc:0 "Натхнення може прийти з найдивніших місць. ELIN, виробник переважно електроніки, нещодавно наважився на створення експериментальних підводних човнів. Підводні човни напрочуд гарні. Ми повинні розглянути можливість звернутися до них і попросити їх будувати наші підводні човни в майбутньому."
 AUS_end_european_fascism:0 "Чиста від фашизму Європа"
 AUS_establish_bohme_plan_desc:0 "Франц Беме, один із наших фельдмаршалів, розглядав план наступальної битви, якщо ми захочемо атакувати за межами наших кордонів. З нашими нинішніми амбіціями цей план може бути корисним."
 AUS_hirtenberger_artillery_tt:0 "§YHirtenberger Defence Systems§! буде відкрита в якості виробника артилерії"
 AUS_improved_warfare_strategies:0 "Удосконалення стратегії ведення війни"
 AUS_integrate_hungary_desc:0 "Щоби якнайкраще використовувати території, які ми зараз повернули, слід переконатися, що нація залишається єдиною. Держави, які виявляться найбільш охочими та корисними, мають бути якомога швидше інтегровані власне до Імперії. Території, які ми вимагали від Угорщини, виявилися найбільш перспективними. Треба негайно починати інтеграційні зусилля!"
 AUS_integration_target_is_not_poland_key:0 "[FROM.GetAdjective]ий уряд звернувся до нас з ультиматумом. Передати [Get37PuppetOrNotDesc] добровільно або зіткнутися з могутністю їхньої відновленої бойової машини на полі бою. Незалежно від того, який курс ми вибрали в цьому питанні, здається, що без наслідків не буде шляху вперед."
 AUS_invite_danubian_countries_desc:0 "Оскільки наша декларація про наміри відкрита для всіх, настав час першого розширення нашої федерації, щоб вона стала найкращою, якою вона тільки може бути. Нашим першим кроком, природно, має бути запрошення інших придунайських націй, які наразі залишаються самотніми, приєднатися до нас."
 AUS_makes_demands_title_57:0 "[FROM.GetNameDefCap] відхиляє наші вимоги"
 AUS_news_events.1.t:0 "[AUS.GetNameDefCap] не підкоряється [GER.GetAdjective]ому Аншлюсу"
 AUS_news_events.5.desc:0 "\n[AUS.GetLeader], австрійський лідер, нещодавно заявив про свій намір раз і назавжди скасувати Сен-Жерменський Договір та знову озброїти країну. Цей договір було укладено після Великої Війни, щоб утримати Австрію від повторення вчинків, які поклали початок війні, і розширення їхньої території заради здобуття влади. Теоретики припускають, що це відповідь на поступове зростання напруженості у світі. Однак чи буде передбачуване використання цих зусиль мілітаризації оборонним чи агресивним, ще належить з’ясувати."
 AUS_osterreichische_seebataillon_desc:0 "Ми пройшли довгий шлях, щоб убезпечити нашу опору на береговій лінії. І лише для того, щоб зрозуміти, що наша армія дуже погано підготовлена до завдання фактичної боротьби в цих умовах. Ми повинні шукати, що може допомогти нашим людям боротися ефективніше."
 AUS_otto_bauer:0 "Отто Бауер"
 AUS_political_events.103.a:0 "Погані новини для такого чудного ранку..."
 AUS_political_events.104.a:0 "Якийсь дурень, ми не піддамося його мовленню."
 AUS_political_events.111.b:0 "Згадуючи жах, що стався через їх дії в минулому, [FROM.GetNameDef] не заслуговоє ані каплі довіри!"
 AUS_political_events.13.b:0 "Доволі переконуюче."
 AUS_political_events.14.desc:0 "[FROM.GetNameDefCap] нещодавно висунула протест щодо накладеного на нас світового ембарго. Заявляючи, що ми є їх найціннішим союзником, вони активно надсилали заперечення всім країнам, які підтримали резолюцію Ліги Націй, намагаючись хоча б трохи полегшити для нас ситуацію."
 AUS_political_events.34.a:0 "Як грубо..."
 AUS_political_events.38.desc:0 "Ми сумлінно дали [FROM.GetAdjective]ому уряду можливість [Get38PuppetOrNotDesc] у наше суспільство, але, здається, наша найщедріша пропозиція не була прийнята. Зрештою, ми чудово усвідомлюємо, що [FROM.GetNameDef] буде  існувати лише під керівництвом Відня!"
 AUS_political_events.43.t:0 "[FROM.GetNameDefCap] потребує [Get43PuppetOrNotTitle]"
 AUS_political_events.55.t:0 "[FROM.GetNameDefCap] бажає укласти угоду щодо права власності на регіони [39.GetName] й [850.GetName]"
 AUS_political_events.63.a:0 "Ми не знаємо, наскільки вони будуть лояльні."
 AUS_political_events.67.desc:0 "Славні новини надходять нам, адже [FROM.GetNameDef] погодилась стати частиною нашої нової федеративної держави. Того, що ми могли запропонувати, було явно достатньо, щоб вони вважали цю пропозицію вигідною, незважаючи на невеликий удар по їхньому суверенітету."
 AUS_political_events.68.b:0 "Ми будемо пильно за ними спостерігати"
 AUS_political_events.69.a_tt:0 "Прибирає рішення §YЗаходів проти Аншлюсу§!."
 AUS_political_events.70.t:0 "[FROM.GetAdjective]ий уряд пропонує компенсацію в обмін на гарантії"
 AUS_political_events.72.desc:0 "Сказати, що ми старалися, — нічого не сказати. Ми посилалися на Сен-Жерменський Договір і запропонували компенсацію, дії, які значно перевищують те, на що могла б бути здатна країна нашого розміру та в нашій ситуації. Незважаючи на всі нашу зусилля, клятий [FROM.GetAdjective]ий уряд уперто відмовляється гарантувати нам відповідність до Договору, у розробці якого вони самі брали участь. Ми не можемо розраховувати на їх допомогу в майбутньому."
 AUS_political_events.74.t:0 "Гаранти утверджують переглянутий договір"
 AUS_political_events.75.a:0 "Ми витримаємо."
 AUS_political_events.78.b:0 "Вони — не наш нинішній пріоритет."
 AUS_political_events.84.t:0 "[FROM.GetAdjective]ий уряд підштовхує комуністичні настрої в нашій країні"
 AUS_political_events.95.a_tt:0 "Один справжній [ROOT.GetAdjective]ий патріот доєднався до нашої армії."
 AUS_promote_the_worthy_desc:0 "Декілька наших генералів демонструють великі надії та відданість як нашій справі, так і нашій країні. Беручи з них приклад і винагороджуючи їх підвищенням по службі, ми заохочимо таку поведінку більшої кількості наших співробітників!"
 AUS_reestablish_creditanstalt:0 "Creditanstalt-Bankverein буде розпущено, а новий Österreichische Creditanstalt отримає нашу повну підтримку."
 AUS_reinstate_the_imperial_council:0 "Відновити Herrenhaus"
 AUS_scientific_grants_desc:0 "Оскільки ми збільшуємо наш бюджет на науку та дослідження, стає очевидним можливе застосування цих нових знань. Надаючи низку грантів, ми зможемо ще більше посилити позитивний ефект від цього."
 AUS_seize_galicia_desc:0 "З роками ми зрозуміли, що дуже сумуємо за однією з частин нашої старої імперії. Бачачи останніми роками Галичину, розтерзану та кинуту між різними країнами, ми день за днем все більше стверджували, що ми повинні знову її захопити."
 AUS_the_father_of_austromarxism:0 "Батько австромарксизму"
 AUS_the_right_to_rearm_fed_instead_tt:0 "Якщо б [ROOT.GetNameDef] була §YНейтральною Нацією§!, ми б замість цього переозброїлись напряму, не дивлячись на наслідки."
 AUS_unfriendly_neighbor:0 "Непривітний сусід"
 AUS_women_in_academia:0 "Жінки в академічному середовищі"
 AZR_fascism_party:0 "Кліка Вогняного коня"
 BALTIC_arm_baltic_reds_desc:0 "Усе готово — по всій Балтії палає жар комунізму. Червоним потрібен лише сигнал та ресурси від нас, і тоді ми розпалимо вогонь балтійської революції!"
 BALTIC_arm_the_nation_desc:0 "У державі [Root.GetNonIdeologyName] безліч людей, готових відображати радянське вторгнення, але у них не вистачає для цього спорядження. Ми мусимо підготувати збройну промисловість до швидкого виробництва піхотного озброєння."
 BALTIC_christian_communism:0 "Християнський соціалізм"
 BALTIC_events.102.t:0 "[From.GetNameDefCap] відхиляє пропозицію!"
 BALTIC_events.3.a:0 "Необхідне пряме втручання!"
 BALTIC_modernize_industry_desc:0 "Занадто довго сільське господарство переважало в державі [Root.GetNonIdeologyName] — час із цим кінчати. [Root.GetNonIdeologyName] стане державою із сучасною економікою, тільки якщо ми зосередимо промисловість навколо основних міст."
 BALTIC_original_designs:0 "Власні розробки"
 BALTIC_path_to_the_north_sea:0 "Шлях до Північного моря"
 BALTIC_popular_resistance:0 "Народний спротив"
 BALTIC_promote_unity_BLR_desc:0 "Коли в Білорусі почнеться громадянська війна, всі держави повинні вирішити індивідуально, яку сторону революції вони віддають перевагу. Ми повинні переконатися, що [From.GetName] переможе."
 BALTIC_request_german_support_desc:0 "[GetRequestGermanSupportDesc]"
 BALTIC_royal_arsenal:0 "Королівський арсенал"
 BALTIC_royal_arsenal_organization:0 "$BALTIC_royal_arsenal$"
 BALTIC_secure_military_support:0 "Забезпечити військову підтримку"
 BALTIC_soviet_military_staff_desc:0 "Після того, як [Root.GetAdjective] Республіка робітників була розпущена, наше військове керівництво в масі своїй вирушило на заслання в СРСР. Треба повернути його додому."
 BAL_UNIFIED_communism:0 "Балтійська соціалістична республіка"
 BAN_neutrality:0 "Султанат Бангладеш"
 BAR_fascism_DEF:0 "Відроджена імперія Баротселенд"
 BASE_MEDAL_TYPE:0 "Клацніть, щоби присудити командувачеві цієї дивізії нагороду §H$TYPE$§!. Якщо його підвищать, медалі залишаться з ним."
 BAS_communism_DEF:0 "Британо-антильська комуна"
 BATTLE_BATTLE:0 "Битва"
 BAY_STATE_975:0 "Бургнланд"
 BAY_neutrality_DEF:0 "Королівство Баварія"
 BBA_ALB_fascist_lawyer:0 "Фашистський юрист"
 BBA_african_union_events.2.desc:0 "[FROM.GetNameDefCap] прийняли пропозицію про членство в Організації Африканської Єдності. Сподіваємося, що це стане початком більш тісної співпраці між нашими державами."
 BBA_african_union_events.20.desc:0 "[FROM.GetName] відмовились виконувати свої оборонні зобов'язання, попри те, що є підписантами угоди про взаємну оборону Організації Африканської Єдності. Ми вже розпочали процес їх виключення з угоди."
 BBA_ethiopia_anti_colonialism_events.2.b:0 "Війна скінчиться, коли [?global.african_revolt_country.GetNameDef] зазнає поразки."
 BBA_ethiopia_balance_of_power_events.10.desc:0 "Поступова децентралізація держави [THIS.GetNameDef], не дивно, призвела до того, що центральний уряд втратив значну частину своїх повноважень. Зараз різні регіони заходять так далеко, що проголошують свою незалежність від держави [THIS.GetNameDef]. Ми мусимо діяти швидко, якщо хочемо відновити контроль над цими регіонами."
 BBA_ethiopia_communist_events.06.t:0 "Тимчасовий уряд розпущено"
 BBA_ethiopia_communist_events.08.t:0 "[ETH.GetName] просить стрілецьке озброєння"
 BBA_ethiopia_communist_events.27.a:0 "Вони зрадили нас."
 BBA_ethiopia_communist_events.33.a:0 "Свободу для всіх!"
 BBA_ethiopia_exile_events.07.desc:0 "[FROM.GetAdjective]ий уряд вважає наші претензії на всі землі хабеша законними та погодився з нашим проханням про передачу під владу [550.GetName]."
 BBA_ethiopia_exile_events.12.a:0 "Напевно, легше віддати чужі землі"
 BBA_ethiopia_exile_events.15.desc:0 "Дещо несподівано, але [FROM.GetAdjective]а держава погодилася дозволити нам використовувати [454.GetName] як базу. Ми повинні поспішати, щоби створити там нашу адміністрацію. Одного дня ми побудуємо новий храм Соломона."
 BBA_ethiopia_exile_events.42.desc:0 "Мирна пропозиція [GetGermanCountryLeaderTitle] не була відверто відхилена [FROM.GetLeader]. Однак, [FROM.GetAdjective]ий уряд вважає, що потрібно більше продемонструвати свої зусилля, спрямовані на придушення громадської опозиції режиму, і тому попросив нас дещо переглянути пропозицію."
 BBA_ethiopia_fascist_events.52.t:0 "[FROM.GetName] відхиляє [ETH.GetAdjective]ий контроль над Сомалілендом"
 BBA_ethiopia_fascist_events.64.desc:0 "[ETH.GetLeader] просить передати контроль над [550.GetName] як нагороду, або ж як компенсацію, за свою відданість [ITA.GetName]. [ETH.GetLeader] зіграв ключову роль у подоланні глухого кута під час вторгнення в Ефіопію, і це значно покращило б наші відносини. Однак, [ITA.GetAdjective] народ може не зрозуміти, чому ми віддаємо територію."
 BBA_ethiopia_fascist_events.70.desc:0 "[FROM.GetName] погодився надіслати декількох своїх військових офіцерів до нашого генерального штабу на найближче майбутнє. Сподіваємось, ми навчимося ефективно застосовувати нову техніку на полі бою."
 BBA_ethiopia_imperial_events.7.desc:0 "Растафаріанський рух у області [689.GetName] стверджує, що $ETH_haile_selassie$ — це Месія, або Джа, їхнє ім'я для реінкарнації Бога. Дещо несподівано, $ETH_haile_selassie$ прийняв цю репутацію. Як наслідок, [FROM.GetLeader.GetSheHe] тепер просить державу [ROOT.GetNameDef] офіційно приєднатися до [FROM.GetAdjective]ої імперії та створити нову базу влади в Карибському басейні, звідки вплив можна буде поширити на решту світу."
 BBA_italo_ethiopian_war_events.03.t:0 "Італійське нарощування сил"
 BBA_italo_ethiopian_war_events.200.desc:0 "Симпатії громадськості до курсу держави [ROOT.GetName] завжди були сильними. Однак ніхто не очікував, що країна протримається більше місяця або близько того. Наш затятий опір [ITA.GetAdjective]им загарбникам завойовує серця людей по всьому світу, і лідери країн починають ставитися до держави [ROOT.GetName] більш серйозно."
 BBA_italo_ethiopian_war_events.200.t:0 "Міжнародна репутація зростає"
 BBA_italo_ethiopian_war_events.502.desc_guarantees:0 "Італійський уряд відхилив нашу вимогу укласти мир із державою [ETH.GetNameDefCap] в обмін на нашу допомогу проти німців. Їм доведеться протистояти цьому натиску самотужки."
 BBA_italy_anti_colonialism_events.57.desc:0 "Можливо, це не стало повною несподіванкою, але нам, на жаль, повідомили, що народ Західної Африки не бажає більше перебувати під нашим правлінням. Вони відчували себе знехтуваними та експлуатованими протягом тривалого часу і тому проголосували за вихід з-під нашого управління."
 BBA_italy_decide_the_fate_of_mussolini.3.a:0 "Звинуватити комуністів!"
 BBA_italy_decide_the_fate_of_mussolini.3.b:0 "Придумати історію для прикриття."
 BBA_italy_interaction_events.13.desc:0 "[FROM.GetLeader] оголосив, що вони не будуть прагнути до подальших дипломатичних відносин з нами, і що ми повинні негайно відкликати наші претензії на чорногорський престол. Непробачно, неприйнятно!"
 BBA_italy_interaction_events.23.t:0 "[TUR.GetNameDef] невдячно відхилила нашу пропозицію"
 BBA_italy_interaction_events.31.t_refused_peace:0 "[ETH.GetNameDefCap] відмовляється від мирних переговорів"
 BBA_italy_interaction_events.32.b:0 "Ні!"
 BBA_italy_interaction_events.34.a:0 "Так."
 BBA_italy_interaction_events.34.desc:0 "[GetItalyWantsTunisia]"
 BBA_italy_interaction_events.35.t:0 "[ITA.GetName] Wants to Negotiate their Claim to Malta"
 BBA_italy_interaction_events.36.a:0 "Немає сенсу сперечатися з цим."
 BBA_italy_interaction_events.4.a:0 "І буде він королем Томіславом!"
 BBA_italy_interaction_events.6.a:0 "Це війна!"
 BBA_italy_interaction_events.71.a:0 "Ми мало що можемо зробити"
 BBA_italy_interaction_events.72.t:0 "[FROM.GetName] виходить"
 BBA_italy_local_rulers.1.c:0 "$ETH_haile_selassie_gugsa$ та його послідовники мають бути підкорені."
 BBA_italy_missiolinis.05_south.desc:0 "Дуже задоволений нещодавніми здобутками на півдні Абіссінії, Муссоліні вихваляє мужність італійських солдатів і їхню відданість закінченню цього конфлікту. Він не мав жодних сумнівів і непохитно вірив, що наші армії здолають ворога на полі бою — щойно отримають належну підтримку від свого дуче."
 BBA_italy_missiolinis.11.t:0 "Кінець війни"
 BBA_italy_missiolinis.112.t:0 "Загрузле вторгнення в Далмацію"
 BBA_italy_missiolinis.13.t:0 "Завоювання Ефіопії"
 BBA_italy_missiolinis.202.desc:0 "Нездатність розширити політичний кабінет достатньою мірою розлютила Дуче, який назвав політичний кабінет недієздатним. Він звинувачує всіх, хто наближається до нього, в ідіотизмі та лиходійстві за те, що вони працюють проти нього та величі, яку він намагається принести Італії."
 BBA_italy_missiolinis.213.a:0 "Компетентне лідерство — ключ до успіху."
 BBA_italy_missiolinis.31.a:0 "Розширмо наші індустрії."
 BBA_italy_missiolinis.42.t:0 "Невдале розширення армії"
 BBA_italy_missiolinis.53.a:0 "Безсумнівно, це зробить наші армії непереможними."
 BBA_italy_naval_cooperation_programs.02.desc:0 "Здається, що [From.GetName] прийняла розумне рішення і вирішила приєднатися до нашої Програми морського співробітництва. Це, безумовно, піде на користь обом сторонам і посилить наші можливості!"
 BBA_italy_naval_cooperation_programs.08.a:0 "Це посилить [ROOT.GetAdjective]ій флот!"
 BBA_italy_naval_cooperation_programs.17.a:0 "Давайте приступимо до роботи!"
 BBA_italy_second_italo_ethiopian_war.1.t:0 "[FROM.GetAdjectiveCap]а пропозиція миру"
 BBA_swiss_expansion.11.t:0 "[FROM.GetNameDefCap] Відхилив нашу пропозицію!"
 BBA_swiss_expansion.12.a:0 "Нехай забирають Альпи"
 BBA_swiss_expansion.13.desc:0 "[FROM.GetAdjective] уряд прийняв правильне рішення та визнав, що їхні альпійські території по праву належать нам. Це гарантує нам захист від майбутніх агресорів."
 BBA_swiss_expansion.7.a:0 "[848.GetName] одного дня буде вільним!"
 BBA_swiss_expansion.9.t:0 "[FROM.GetName] Пропонує нам свій захист"
 BBA_switzerland.15.a:0 "Нам згодиться [GER.GetAdjective] агент"
 BBA_switzerland.15.desc:0 "Попри свою нейтральну позицію, [FROM.GetNameDef] таємно пропонує нам скористатися одним зі своїх оперативників для наших розвідувальних місій.\n\nЦе особливо вигідно для нас, оскільки населення [SWI.GetNonIdeologyName] розмовляє тими ж мовами, що і [GER.GetNonIdeologyName], [FRA.GetNonIdeologyName] та [ITA.GetNonIdeologyName], тож у них буде перевага при проникненні до цих країн."
 BBA_switzerland.2.t:0 "Представника нацистської партії у Швайцарії вбито"
 BBA_switzerland.9.desc_alt:0 "Наші агенти в [SWI.GetName] повідомляють, що попри заяви про нейтралітет і верховенство права, [SWI.GetNameDef] таємно організувала втечу Давіда Франкфуртера, який зізнався у вбивстві Вільгельма Густлоффа, інсценувавши його смерть, і завербувала його як розвідника.\n\nЦе доводить, що їм не можна довіряти, і вони мають бути знищені при першій нагоді. Ми не дозволимо такій зухвалій образі [?SWI.SWI_fascist_germany.GetNameDef] залишитися безкарною."
 BBA_switzerland.97.a:0 "Хвилі оживуть від звуку наших торпед"
 BBA_switzerland_fascist.1.b:0 "Вони нам не потрібні!"
 BBA_switzerland_fascist.2.a:0 "На обрії згущуються хмари"
 BBA_switzerland_trade.11.b:0 "Ми не можемо посилювати ризик зради"
 BBA_switzerland_trade.2.b:0 "Ми більше не дамо їм себе обдурити"
 BBA_switzerland_trade.3.desc:0 "Торговельна угода з [FROM.GetNameDef], що діяла впродовж останнього року, була дуже вигідною для [ROOT.GetName], і тепер настав час вирішити, чи слід її поновити. \n\nПопри всі переваги такої двосторонньої угоди, і зважаючи на те, наскільки вона потрібна такій країні, як наша, слід розуміти, що інші країни можуть сприйняти це як подальше порушення нашої нейтральності. Ми маємо переконатися, що така ізоляція буде контрольованою і виправданою."
 BECOME_SPY_MASTER_COST_FI:0 "It will cost £faction_initiative_texticon£ $VALUE$ to become $HEADOF|H$."
 BEL_40_hour_workweek_desc:0 "Іншим результатом Національної трудової конференції стало радикальне введення 40-годинного робочого тижня. Спочатку ми сумнівались, але згодом побачили зростання продуктивності та задоволення працівників."
 BEL_AUS_autonomy_eu_member_DEF:0 "Європейська Бельгія"
 BEL_abandon_neutrality_desc:0 "Крики про нейтралітет були словами слабких. У цьому світі єдина дипломатія, що має значення, — це та, що продемонстрована через силу."
 BEL_academies_of_belgium_dynamic_modifier_desc:0 "Академії Бельгії — це колективна організація вищих навчальних закладів країни, що займають центральне місце в бельгійських технологічних проривів."
 BEL_belgian_air_force_desc:0 "[ROOT.GetNameDef] був одним з перших, хто почав використовувати повітряну силу, розвинувши потужні сили під час останньої війни, які добре проявили себе. На жаль, бюджетні обмеження стримують інновації. З ростом напруги ми повинні забезпечити, щоб наша повітряна оборона залишалась сильною."
 BEL_belgian_maginot_tt:0 "Додати §YНаземні укріплення§! вздовж §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! кордону."
 BEL_belgian_resistance_state_dynamic_modifier:0 "Бельгійський опір"
 BEL_charles_count_of_flanders:0 "Шарль, граф Фландрії"
 BEL_corporate_social_responsibility_desc:0 "Незважаючи на значну індустріалізацію та урбанізацію [ROOT.GetNameDef], дивує те, що профспілки ніколи не мали такої влади, як можна було б очікувати. Це тому, що в культурі існує традиція, коли корпорації несуть соціальну відповідальність перед своїми працівниками — хоча нагадувати їм про це не завадить."
 BEL_economic_recovery_desc:0 "Робота нашого уряду, навіть попри численні труднощі, які він пережив, призвела до зростання та швидкого відновлення нашої економіки, але навіть це вже викликає нарікання, що навіть цього недостатньо."
 BEL_edouard_van_den_burgen:0 "Едуар ван ден Берген"
 BEL_flanders_ascendant:0 "Фландрія на підйомі"
 BEL_flooded_tank_barriers:0 "Затоплені бар'єри від танків"
 BEL_junior_officer_training:0 "Підготовка молодших офіцерів"
 BEL_leopold_unknown_sympathies:0 "Невідомі симпатії"
 BEL_license_POL_air_idea-desc:0 "Завдяки хорошим відносинам з нашими польськими партнерами ми змогли отримати низку військових ліцензій за дуже вигідними умовами."
 BEL_nationalize_the_banks_desc:0 "Занадто довго банки управлялися жадібними маленькими людьми, які дбали лише про прибуток. Банк — це інститут на службі всіх, тому справедливо, що ми захопимо контроль над ними і правильно направимо їх фінансові інструменти на нашу колективну користь."
 BEL_pride_of_the_golden_lion:0 "Прайд Золотого Лева"
 BEL_problem_of_language:0 "Проблема мови"
 BEL_propose_limited_federalization_descision:0 "Запропонувати федералізацію із [FROM.GetNameDef]"
 BEL_renard_constructions_aeronautiques:0 "Renard Constructions Aéronautiques"
 BEL_soviet_guarantee:0 "Гарантія Радянського Союзу"
 BEL_stk_desc:0 "Ми прагнемо заснувати Studiecentrum voor de Toepassingen van de Kernenergie (Дослідницький центр застосувань ядерної енергії), або STK, як спеціалізовану установу для дослідження наукових можливостей атомної енергії."
 BEL_subject_DEF:0 "$OVERLORDADJ$а $BEL$"
 BEL_support_the_european_project_desc:0 "У світі, де панують війни і конфлікти, нам стало очевидно, що нейтралітет не є гарантією миру. Тому ми повинні звернутися до інших європейських держав і створити орган, що буде спрямований на взаємну безпеку і економічну стабільність, і разом ми зможемо процвітати."
 BEL_transport_plane_equipment_3:0 "Douglas DC-3"
 BEL_worker_rallies_decision:0 "Провести робітничі мітинги"
 BHR_democratic:0 "Ісламська республіка Бахрейн"
 BLR_SOV_communism_autonomy_dominion:0 "Білоруська народна республіка"
 BLZ_neutrality:0 "Республіка Беліз"
 BLZ_neutrality_ADJ:0 "Белізьк"
 BLZ_neutrality_DEF:0 "Республіка Беліз"
 BOL_plurinational_republic_democratic_ADJ:0 "Болівійськ"
 BOP_RANGE_DEACTIVATION_EFFECT:0 "\n§YЕфект від деактивації:§!\n$DESC$"
 BOS_without_HRZ_ITA_fascism_subject:0 "Губернаторство Сараєво"
 BOU:0 "Бугенвіль"
 BRA_USA_tech_sharing_group_desc:0 "Сполучені Штати та Бразилія домовилися об'єднати свої наукові знання після маневрів бразильського уряду, спрямованих на більш тісну співпрацю з північним сусідом у питаннях зовнішньої політики."
 BRA_align_with_moscow:0 "Зблизитися з м. [SOU.Capital.GetCapitalVictoryPointName]"
 BRA_apolonio_de_carvalho:0 "Аполонью джі Карвалью"
 BRA_armored_car_at_equipment_short:0 "M38"
 BRA_article_138_desc:0 "$BRA_implement_article_138_desc$"
 BRA_church_desc:0 "Католицька Церква зберігає значний вплив на нашу політику, незважаючи на те, що поділ Церкви та держави був встановлений десятиліттями тому. Це пов'язано з великою кількістю побожних католиків, які складають більшість електорату. Якби ми могли завоювати прихильність Церкви, ми могли б отримати масову підтримку для нашої політики."
 BRA_departamento_de_ordem_politica_e_social:0 "Departamento de Ordem Política e Social"
 BRA_empire_of_brazil_neutrality_ADJ:0 "Бразильськ"
 BRA_end_military_interference_desc:0 "Зі створенням нашої національної гвардії ми нарешті маємо можливість обмежити вплив військового істеблішменту, підпорядкувавши наші збройні сили нагляду цивільного уряду."
 BRA_infantry_equipment_1:0 "M1 Garand"
 BRA_infilitrate_the_military:0 "Проникнути у військові"
 BRA_invest_in_the_armed_forces_desc:0 "Військова еліта є мінливою у своїх лояльностях та параноїдальною щодо загрози комунізму, як внутрішнього, так і зовнішнього. Ми використаємо це на нашу користь, підкуповуючи їх збільшеним військовим бюджетом в обмін на підтримку нашого правління."
 BRA_jaguar_diplomacy_economic:0 "Дипломатія ягуара"
 BRA_joao_neves_da_fortuna:0 "Жуан Невіс да Фонтора"
 BRA_king_vassouras:0 "Дом Педру Енрікі"
 BRA_mechanized_equipment_3:0 "M5 Half-Track"
 BRA_nadiya_morozova:0 "Надія Морозова"
 BRA_no_communism_in_south_america_desc:0 "Комуністам не можна довіряти, як ми помітили під час спроби революції 1935 року, яку ми справедливо придушили. Щоби забезпечити майбутнє нашої нації, ми мусимо подбати про те, щоби з будь-якими іноземними диверсантами поблизу було покінчено якнайшвидше!"
 BRA_political_fox:0 "Політичний лис"
 BRA_reach_out_to_our_neighbors:0 "Звернутися до наших сусідів"
 BRA_reach_out_to_the_great_powers_desc:0 "$ARG_reach_out_to_the_great_powers_desc$"
 BRA_rome_accords_desc:0 "Ми довгий час мали міцні зв'язки з [ITA.GetName] через історичну міграцію звідти до [BRA.GetName]. Оскільки світ починає змінюватися, і наші уряди стають більш узгодженими, має сенс формалізувати партнерство між нашими націями."
 BRA_seek_international_support_desc:0 "Хоча були докладені великі зусилля для відновлення комуністичного руху, ми все ще слабкі порівняно з силами, які ми повинні подолати. Тому ми повинні заручитися підтримкою однодумців та урядів у всьому світі."
 BRA_smoking_cobras:0 "Cobras Fumantes"
 BRA_snakes_on_a_plane_achievement:0 "Захоплено область §Y[2.GetName]§! повітряним десантом"
 BRA_third_republic:0 "Порядок і прогрес"
 BRA_unwilling_subjects_desc:0 "В умовах, коли монархія дедалі більше захоплює політичну систему країни, люди відчувають дискомфорт і розчарування від того, що вони знову підкоряються самодержцю."
 BRA_us_of_brazil_desc:0 "Ідеали свободи і демократії — це фундамент, на якому збудована наша республіка. Ми зробимо все можливе, щоби захистити ці цінності вдома та за кордоном, якщо це буде необхідно."
