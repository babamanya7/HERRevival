 NORDIC_nuclear_production_desc:0 "Тепер, коли ми маємо знання, щоб розщепити атом, ми також можемо використовувати їх. Але спершу нам потрібно виготовити матеріали та інфраструктуру, необхідні для виробництва достатньої кількості, щоб змінити хід війни на нашу користь."
 NORDIC_political_cooperation_desc:0 "На словах недостатньо для справжньої спільної роботи. Якщо ми дійсно хочемо стати силою, з якою потрібно рахуватися, нам потрібно, щоб усі наші системи були гвинтиками більшої, добре налагодженої машини."
 NORDIC_second_institution:0 "[NORDIC_get_institution_2_name]"
