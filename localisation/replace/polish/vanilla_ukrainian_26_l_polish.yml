 INS_arm_the_revolutionaries_desc:0 "Ми маємо почати з революціонерів і націоналістів, які сповнені енергії і готові віддати все, що мають, за Індонезію. Ми забезпечимо їм навчання та спорядження, необхідні для боротьби за свою країну."
