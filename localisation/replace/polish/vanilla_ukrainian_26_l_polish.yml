 DEN_potential_refinery_tt:0 "З §Y$synth_oil_experiments$§! дослідженими, додати §G1§! комірку для будівництва та §G1§! §Y$synthetic_refinery$§! у §Y$STATE_99$§!."
 DEN_public_works_desc:0 "Випустивши програму громадських робіт, ми могли б не лише покращити інфраструктуру нашої країни, побудувавши мости, що з'єднали б наші острови, але й ініціювати будівництво нових житлових проєктів і знизити все ще високий рівень безробіття."
