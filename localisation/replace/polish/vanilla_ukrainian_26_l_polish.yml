 BUL_dimitrana_ivanova_desc:0 "$BUL_dimitrana_ivanova$"
 BUL_dominance_in_the_aegean_black_sea_success:0 "Після наших успіхів у забезпеченні Чорного моря настав час повторити маневр в Егейському морі. Ми виженемо будь-яку ворожу націю, яка знаходиться на її берегах, і захопимо її цінні території для Пруссії на Балканах."
 BUL_fate_of_the_balkans_demand_submission_tt:0 "Якщо боєздатність армії держави [FROM.GetNameDef] нижча, шанс підпорядкувати її підвищується."
 BUL_federation:0 "федерацію"
 BUL_ff_approaching_bzns_mission:0 "§YВітчизняний фронт§! виходить на зв'язок із $BUL_bzns_name_ins$"
 BUL_ff_massive_arrests_desc:0 "Щоб покінчити з загрозою, що походить від Вітчизняного фронту, потрібнл вжити суворих заходів. Ми влаштуємо масові рейди і заарештуємо всіх, хто пов'язаний із цією організацією."
 BUL_form_a_popular_bloc:0 "Створити Народний блок"
