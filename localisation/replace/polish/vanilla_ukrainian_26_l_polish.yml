 CHL_ligas_patrioticas_desc:0 "Ligas Patrióticas — це ультраправа параполіцейська громадська організація, яка діє в державі [CHL.GetNameDef], допомагаючи нам придушувати будь-яке інакомислення і переконуючи будь-кого уникати призову до армії."
 CHL_mapuche_liberate_nahua:0 "Визволити [NAH.GetAdjective]ий народ"
 CHL_news_events.3.d:0 "Станом на сьогодні, [CHL.GetLeader] оголосив про формування [CHL.GetNameDef] і стверджує, що вона є новою світовою державою. Вони заявили, що їхня мета — звільнити всіх іспанців та латиноамериканців від іноземного гніту, і що їхня місія ще не закінчена."
 CHL_outlaw_socialism_desc:0 "Багато хто виступає проти диктатури Ібаньєса, але ніхто з них не є настільки непохитним, як соціалісти. Тому ми мусимо позбавити країну від них якнайшвидше."
 CHL_political_events.16.c:0 "Карлос Ібаньєс дель Кампо"
 CHL_political_events.2.desc:0 "Південноамериканські країни Чилі та Аргентина звернулися до нас із спільною заявкою на приєднання до нашої фракції. Вони заявляють, що бажають допомогти нам, одночасно захищаючи свої власні інтереси. Що ми скажемо?"
 CHL_political_events.22.t:0 "[CHL.GetNameDefCap] бажає приєднатися до нашої фракції"
 CHL_political_events.23.a:0 "Ми будемо сильнішими разом"
 CHL_political_events.28.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вирішив відхилити нашу пропозицію про анексію. Як ми маємо з ними вчинити?"
 CHL_political_events.37.t:0 "[FROM.GetNameDef] відмовляється приєднатися до Іспанського альянсу"
 CHL_political_events.38.t:0 "[CHL.GetName] запрошує нас до [GER.GetAdjective] фракції"
 CHL_political_events.4.a:0 "Немає сенсу з ними воювати"
 CHL_political_events.41.t:0 "[CHL.GetName] вимагає нашої покори [GER.GetNameDef]"
 CHL_political_events.51.a:0 "Хіба вони нас не бояться?"
 CHL_political_events.73.a:0 "Це має бути Мануель Манкілеф"
 CHL_political_events.75.b:0 "Ми не хочемо ризикувати війною в майбутньому..."
 CHL_political_events.82.desc:0 "Зі створенням нашого нового Королівства Арауканії та Патагонії виникли питання щодо нашого статусу. Наразі Сантьяго все ще є нашою столицею, а це означає, що ми не надто відрізняємося від занепалої старої держави Чилі. Однак є й інші потенційні міста, які є хорошими кандидатами на нову столицю Королівства. Яка воля нашого верховного короля, Антуана III?"
 CHL_released_maya_flag:0 "Мая звільнено"
 CHL_return_to_the_parliamentary_era_tt:0 "§Y$CHL_miguel_cruchaga_tacomal$§! буде завербований як радник."
