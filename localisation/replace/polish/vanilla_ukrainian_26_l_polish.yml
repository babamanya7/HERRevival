 ENG_rocket_artillery_equipment_1_short:0 "RP-3 HE/GP"
 ENG_secure_the_italian_alliance_desc:0 "Муссоліні має набагато більш прийнятний підхід до фашизму, і Мослі вже давно захоплюється ним. Цілком природно, що наші дві країни мусять налагодити більш тісні відносини, взаємовигідні для обох наших народів."
 ENG_self_government_for_the_mediterranean_desc:0 "Країни Середземномор'я готові отримати широку автономію в рамках підготовки до повної незалежності. Це, ймовірно, призведе до припливу іммігрантів, які бажають отримати британське громадянство до того, як незалежність буде офіційно оформлена."
 ENG_spirit_of_the_industrial_revolution:0 "Дух промислової революції"
 ENG_support_imperialist_coup_in_australia_mission_1_desc:0 "Імперські лоялісти підбурюють до заколоту! Якщо їм це вдасться, вони повалять всю країну в безодню громадянської війни!"
