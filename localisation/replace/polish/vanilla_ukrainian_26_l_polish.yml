 COG_congolese_bussinessowners:0 "Конголезькі бізнесмени"
 COG_cooperate_with_the_comite_special_du_katanga_desc:0 "Огюст Тількенс, колишній губернатор Бельгійського Конго, тепер очолює Комітет спеціального управління Катанга — парастатальну організацію, створену в 1900 році для адміністрації та експлуатації ресурсів провінції Катанга. Варто скористатися цією організацією на повну."
