 usa.10.b:0 "Америка готова до нового Нового курсу."
 usa.12.a:0 "МакАртур більше потрібен на передовій, ніж у Білому домі."
 usa.12.b:0 "Він нам потрібен, щоби кинути виклик Рузвелту."
 usa.46.t:0 "Сенатор іде у відставку"
 usa.61.a:0 "Цей регіон дуже недорозвинений."
 usa.62.b:0 "Такі угоди нижче президента."
 utilize_diyarbakir_chromium_deposits:0 "Розвиток родовищ хрому в Діярбакирі"
 v_weapons_desc:0 "Ракети далекої дії будуть ідеальною зброєю відплати проти наших ворогів."
