 NORDIC_sending_investments_ns:0 "$NORDIC_receiving_investments_fake_ns$"
 NOR_GER_fascism_autonomy_reichsprotectorate:0 "Райхспротекторат Норвегія"
 NOR_anti_air_equipment_3:0 "7.5 cm luftvernkanon m/32"
 NOR_battleship_focus_desc:0 "Лише гігантські броньовані кораблі можуть гарантувати, що ми справді пануємо над хвилями. Загроза побачити один із наших бойових кораблів на їх узбережжі відлякує всякого можливого загарбника."
 NOR_bjarmeland_desc:0 "[ROOT.GetAdjective]і дослідники протягом століть розширювали межі можливого та досяжного. Одним із таких випадків є Біармія, який вперше досліджували [NOR.GetAdjective]s, а тепер поза межами нашої свідомості. Ми знову повинні простягни руку і захопи цю землю за свою."
