 URG_pluna_desc:0 "Pluna — це перспективний національний авіаперевізник як для вантажних, так і для чартерних перевезень. Інвестиції в це можуть вивести нашу авіаційну галузь у сучасну еру."
 URG_the_fuhrmann_plan_desc:0 "Арнульф Фурман запропонував, щоб [URG.GetName] стала колонією [GER.GetName], діючи як плацдарм для фронту Осі у Південній Америці. Можливо, не як колонія, але як керуючий Південної Америки Осі?"
 USA_REBEL_fascism:0 "Американська імперія"
 USA_air_support_desc:0 "Бойові дії у повітрі завжди повинні координуватися з іншими військовими операціями."
 USA_amphibious_tank_equipment_2:0 "Sherman DD"
 USA_continue_the_new_deal:0 "Продовження Нового курсу"
 USA_destroyer_2_desc:0 "The Sims Class was the largest \"1500 Tonner\" design with a more streamlined torpedo arrangement and longer hull. Improvement in fire control granted better attack capabilities with its 5\"/38 caliber guns and included 12 centerline torpedo tubes."
 USA_execute_war_plan_brown:0 "Виконати Військовий план «Браун»"
 USA_focus_on_asia_desc:0 "Поки багато хто з тривогою спостерігає за розвитком ситуації в Європі, у Тихоокеанському регіоні посилюється нестабільність. Нам буде краще, якщо ми втрутимось у ситуацію, поки нас не атакували біля наших кордонів."
 USA_gold_standard:0 "На золотому стандарті"
 USA_honor_the_confederacy_desc:0 "Протягом багатьох років події громадянської війни подавали тільки з точки зору жителів півночі, як хроніку невдалого бунту. Час дати слово та іншій стороні конфлікту."
 USA_infantry_equipment_2_short:0 "M1 Thompson"
 USA_liberty_ships_desc:0 "Розвиток промисловості має супроводжуватися масовим виробництвом великих вантажних суден, щоби наші товари та війська будь-якої миті могли опинитися там, де вони необхідні."
 USA_mechanized_equipment_3:0 "M5 Half-Track"
 USA_medium_lobby_effort:0 "Середні зусилля з лоббіювання"
 USA_medium_tank_equipment_2_short:0 "Sherman"
 USA_neutrality_act_desc:0 "Війна в Європі з кожним днем стає все більш неминучою. Під час світової війни американські компанії активно продавали зброю Союзникам, і багато хто впевнений, що Америка вступила в неї, щоби гарантувати собі оплату за ці поставки. Але цього разу ніхто не зможе наживатися на війні."
 USA_oppenheimer_made_the_nuke_flag:0 "Роберт Оппенгаймер виконав спеціальний проєкт §YЯдерні бомби§!"
 USA_permit_confederate_flags:0 "Дозволити бойові штандарти Конфедерації"
