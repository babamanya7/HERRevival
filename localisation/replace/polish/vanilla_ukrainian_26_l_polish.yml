 develop_west_africa_aluminium_deposits:0 "Розвиток родовищ бокситів у Західній Африці"
 disarm_aggression_central_powers_goal_desc:0 "Демократії рідко нападають на інші країни. Щоб убезпечити Європу для майбутніх поколінь, ми повинні забезпечити, щоб ці агресивні країни або були перетворені на демократії, або були повністю усунені."
 disarmament_proponent:0 "Пропонент роззброєння"
 disdain_for_politicians_2:0 "$disdain_for_politicians_1$"
 disregard_for_the_common_soldier_spirit_desc:0 "Звичайний солдат — найтупіша, найпотворніша, найледачіша істота, яка могла б уміститися в уніформі."
