 SEA_PHI_political_events.1.t:0 "[FROM.GetName] пропонує торговельну угоду"
 SEA_PHI_political_events.16.a:0 "Найкращий можливий результат, враховуючи обставини"
 SEA_PHI_political_events.42.desc:0 "Тепер, коли контроль над Філіппінами встановлено, а стабільність почала повертатися, настав час для Виконавчої комісії зібратися і визначити, кому належить остаточна влада в країні. Є три кандидати на вибір. \n\nЕміліо Агінальдо, герой революції проти іспанців, є давнім прихильником незалежності Філіппін і відкрито заявляв, що під владою Сполучених Штатів народ Філіппін є лише ринком збуту для американського експорту, якщо не ізгоями, оскільки філіппінці навіть не вважаються громадянами Сполучених Штатів. \n\nАртеміо Рікарте, начальник філіппінської армії під час воєн проти Іспанії та США, згодом висланий за відмову присягнути на вірність американським окупантам. Його любов до країни ніколи не згасала, і навіть живучи в Японії, він працював заради нашої остаточної незалежності. \n\nХосе Лаурель, більш поміркований вибір; цей суддя Верховного суду отримав міжнародну освіту та має родинні зв'язки з японськими чиновниками, тому може мати хороші позиції для налагодження зв'язків між Філіппінами та японцями і таким чином просувати нашу справу незалежності."
 SEA_PHI_political_events.42.t:0 "Боротьба за лідерство"
 SEA_PHI_political_events.46.desc:0 "Ми отримали повідомлення від [FROM.GetAdjective]ого уряду, в якому йдеться, що вони готові підтримати нашу майбутню вимогу незалежності. Хоча саме це вже мало б допомогти переконати [ROOT.overlord.GetNameDef], [FROM.GetNameDef] також пообіцяв підтримати нас військовим шляхом, якщо вони спробують скасувати будь-які кроки до незалежності."
 SEA_PHI_political_events.66.t:0 "[FROM.GetName] пропонує договір про взаємодопомогу"
 SEA_PHI_political_events.7.a:0 "Чудовий перший крок"
 SEA_PRC_border_war_events.1.desc:0 "Після прикордонних сутичок вздовж кордону [1045.GetName], [PRC.GetNameDef] вдалося прорвати оборонні рубежі та витіснити ворога. [PRC.GetNameDefCap] тепер оголошує регіон своїм."
 SEA_PRC_faction_events.10.a:0 "Проблеми Китаю важливіші за нашу ворожнечу"
 SEA_PRC_faction_events.21.t:0 "[FROM.GetNameDefCap] пропонує нам свою підтримку"
 SEA_PRC_faction_events.42.a:0 "Ми впораємося без них"
 SEA_PRC_faction_events.53.desc:0 "Наша делегація до [FROM.GetNameDef] повернулася додому з хорошими новинами. Виявляється, що [FROM.GetLeader] — набагато мудріший правитель, ніж ми вважали спочатку, оскільки він підписав нашу пропозицію про союз. Хоча це й не зовсім несподівано, завжди варто очікувати дощу і радіти ще більше, коли натомість світить сонце. Це значно зміцнить наші нації та [ROOT.GetFactionName]."
 SEA_PRC_faction_events.72.b:0 "Ні, наша поточна ситуація цілком прийнятна"
 SEA_PRC_faction_events.90.t:0 "[FROM.GetNameDefCap] просить приєднатися до [ROOT.GetFactionName]"
 SEA_PRC_fourth_army_incident.7.desc:0 "Після нещодавнього інциденту, коли війська [ROOT.GetName] вступили в бій з військами [FROM.GetName], остання вимагає, щоб ми визнали свою участь у спричиненні цього інциденту і надали гарантії, що наші командири будуть обережнішими. Інцидент, у якому Нова 4-та армія [FROM.GetNameDef] зазнала дуже важких втрат, стався після розбіжностей щодо наказів про відступ, що призвело до того, що невідома сторона відкрила вогонь, коли наші відступаючі війська зустріли солдатів [FROM.GetName]."
 SEA_PRC_misc_events.1.t:0 "Народ сумнівається в нашій рішучості"
 SEA_PRC_misc_events.2.t:0 "Втрата довіри"
 SEA_PRC_political_events.2.a:0 "Ми повинні захистити наших товаришів"
 SEA_PRC_political_events.2.b:0 "Ми гарантуємо їм безпеку — якщо вони погодяться стати нашими підлеглими"
 SEA_PRC_political_events.2.t:0 "[FROM.GetNameDefCap] просить про територіальні гарантії"
 SEA_PRC_political_events.31.desc:0 "Наша місія до [FROM.GetNameDef] була успішною: вони пообіцяли захистити нас від будь-яких загроз, з якими ми можемо зіткнутися. Цей захист має дозволити нам зосередитися на довгострокових цілях, таких як розвиток [ROOT.capital.GetName] — справа, яка інакше була б поставлена під загрозу через потенційну необхідність чергового тактичного відступу."
 SEA_PRC_political_events.8.t:0 "[FROM.GetName] хоче підписати пакт про ненапад"
 SEA_PRC_request_aid.1.desc:0 "Через нашу часту підтримку [FROM.GetNameDef] у минулому вони знову просять нас надати їм спорядження. Цей запит може бути пов'язаний із нещодавно завершеним Великим походом, який коштував їм великих втрат у живій силі та техніці."
 SEA_PRC_request_aid.31.a.tt:0 "Ми погодимося надіслати §R350 танків БТ-7§! до §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.33.a:0 "Могло бути більше, але краще, ніж нічого"
 SEA_PRC_request_aid.4.b:0 "Ми можемо виділити трохи"
 SEA_border_incidents_events.5.a:0 "Ми вирішили цю справу з честю"
 SEA_china.14.a:0 "Доконаний факт..."
 SEA_china.22.b:0 "Нічого не робити"
 SEA_china.24.desc:0 "Телеграма від [FROM.GetNameDef] надходить до Нанкіна, підтверджуючи їхній вихід із Договору дев'яти держав. Іноземні річкові патрулі готуються відпливати додому, тоді як [FROM.GetAdjective]і дипломати визнають, що угода більше не є обов'язковою для Китаю. Натовпи збираються перед Міністерством закордонних справ, поки радіо проголошує кінець ще однієї нерівноправної угоди."
 SEA_china_democratic.2.t:0 "[FROM.GetNameDefCap] запрошує нас до свого альянсу"
 SEA_generic_events.10.a:0 "Ми все заперечуватимемо"
 SEA_generic_events.4.desc:0 "Невелика група прихильників [GetOppositionPartyName] нещодавно зірвала засідання уряду невеликим, але гучним протестом. Хоча інцидент був нешкідливим, зростання частоти подібних випадків свідчить про підтримку опозиційних рухів."
 SEA_imperial_influence_events.330.t:0 "Фракція Дзайбацу бажає змін у законі про економіку"
 SEA_imperial_influence_failure_event_option_3:0 "Наша рішучість залишається непохитною"
 SEA_japan_foreign_policy.109.a:0 "Ми змушені змиритися з ситуацією"
 SEA_japan_foreign_policy.133.a:0 "Блискуче"
 SEA_japan_foreign_policy.15.b:0 "Ми їм це не віддамо!"
 SEA_japan_foreign_policy.15.t:0 "[FROM.GetNameDefCap] вимагає окупації області [729.GetName]"
 SEA_japan_foreign_policy.25.a:0 "Це виходить з-під контролю!"
 SEA_japan_foreign_policy.27.t:0 "[FROM.GetNameDefCap] підтримує панмонгольські претензії"
 SEA_japan_foreign_policy.30.a:0 "Ще з однією загрозою розібралися"
 SEA_japan_foreign_policy.4.c:0 "We are in the middle of a war! Ask them to wait."
 SEA_japan_foreign_policy.4.t:0 "[FROM.GetNameDefCap] вимагає, щоб ми приєдналися до їхнього альянсу"
 SEA_japan_foreign_policy.42.t:0 "Китайсько-японський альянс"
 SEA_japan_foreign_policy.43.desc:0 "Наш народ радіє, оскільки [FROM.GetAdjective]а держава приєдналася до нас зі зброєю в руках проти головної загрози стабільності в Азії, а саме комуністів. Хоча цей пакт лише тимчасовий, він, безумовно, принесе нам великі переваги."
 SEA_japan_foreign_policy.65.desc:0 "Обмежений [FROM.GetLeader] відмовився слухати голос розуму і відхилив нашу пропозицію про об'єднання з [RNG.GetNameDef]. Можливо, краща угода, а можливо, навіть належна доза залякування, будуть доречними."
 SEA_japan_foreign_policy.74.b:0 "Вони нам не потрібні"
 SEA_japan_foreign_policy.86.b:0 "Це не наша війна."
 SEA_japan_popup_events.10.desc:0 "Останнім часом ширяться чутки про можливий державний переворот, що планується фракцією Кодоха, радикальною традиціоналістською фракцією в армії. Цілком ймовірно, що вони чекатимуть завершення суду над підполковником Сабуро Айдзавою, оскільки він є невід'ємною частиною їхньої організації. Знаючи їхні можливі мотиви, здається ймовірним, що під час цього перевороту вони спробують вбити багатьох із тих, кого вважають загрозою своїм цінностям. Нам, можливо, доведеться діяти швидко, щоб не допустити кровопролиття в найближчому майбутньому."
 SEA_japan_popup_events.10.t:0 "Чутки про військовий переворот"
 SEA_japan_popup_events.25.b:0 "Ріккен Сейюкай перемагає!"
 SEA_japan_popup_events.35.a:0 "Ми люб'язно погодимося"
 SEA_japan_popup_events.42.t:0 "Народ втрачає довіру до [ROOT.GetLeader]"
 SEA_japan_popup_events.43.b:0 "Темні хмари повинні зникнути з правління Імператора!"
 SEA_japan_popup_events.45.a:0 "Наша консолідація триває"
 SEA_japan_popup_events.8.desc:0 "Зі встановленням нашого нового військового уряду знову постало питання про лідерство. Засновник Кодоха Садао Аракі заявив, що бажає обійняти посаду прем'єр-міністра, і висунув цю пропозицію імператору. Однак, оскільки Дзіндзабуро Масакі є популярнішим як серед солдатів, так і серед широких верств населення, ніж Аракі, можливо, було б розумніше дозволити йому стати прем'єр-міністром, тоді як Аракі просто обійме церемоніальну посаду. Що нам робити?"
 SEA_warlords.11.desc:0 "$KUM_yulbars_khan$, генерал Гоміньдану, повернувся на наш бік після невдалого повстання проти сил [SIK.GetLeader], губернатора провінції Сіньцзян. Ми повинні прийняти його з розпростертими обіймами."
 SEA_warlords.30.desc:0 "Стверджуючи, що наша пропозиція миру та амністії є лише обманом з метою знищити [FROM.GetNameDef], [FROM.GetLeader] відмовився припинити бойові дії і натомість розпочав новий наступ сьогодні вранці. Схоже, знадобиться більше, ніж простий лист, щоб покласти край конфлікту."
 SEA_warlords.32.desc:0 "Незважаючи на всі наші зусилля переконати їх, наші спроби дипломатично захопити [434.GetName] виявилися марними. Посилаючись на лінію Мак-Магона, [FROM.GetLeader] заявив, що ми не маємо права на цю територію і що наша провокація — це лише блеф."
 SEA_warlords.42.b:0 "Нехай поки що керує Сунь Тунсюань"
 SEA_warlords.56.b:0 "Ми не можемо довірити йому цю посаду"
 SEA_warlords.58.a:0 "Що ж, наш обов'язок виконано"
 SEA_warlords.58.desc:0 "Від [XIC.GetNameDef] і [FROM.GetNameDef] надійшла спільна вимога підкоритися їхньому новому плану передачі [608.GetName] і прилеглих територій Молодому маршалу для використання як нової передової бази операцій проти японців. Схоже, вони мають намір покінчити з нашою автономією так чи інакше..."
 SEA_warlords.63.desc:0 "На початку цього тижня додаткова [SOV.GetAdjective]а зброя та припаси прибули до наших військ навколо Кашгара через перевал Іркештам, що на заході. На замовлення Олександра Барміна, представника [SOV.Genetive], відповідального за постачання зброї нашому уряду, схоже, що [SOV.GetNameDef] має конкретні плани щодо подальшого поглиблення нашої співпраці."
 SEA_warlords.70.c:0 "Long Live the Great Ma Dynasty!"
