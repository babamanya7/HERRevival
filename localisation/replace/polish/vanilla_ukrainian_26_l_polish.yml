 SOV_organize_the_wreckers_desc:0 "Якщо Сталін і його поплічники вирішать стати до бою замість зробити те, що було б краще для революції — тобто піти у відставку, ми мусимо бути готовими до протистояння. У такій відчайдушній ситуації треба розглядати навіть саботаж проти власності народу. Ми мусимо запевнитися, що він спрямований туди, де він необхідний, і не знищив великі досягнення радянських робітників."
