 JUNO_brazil_events.190.desc:0 "Ми отримуємо низку повідомлень про те, що [FROM.GetAdjective] оперативники намагаються сприяти монархічним настроям у [ROOT.GetNonIdeologyName]. Залежно від того, якими ми бачимо наші довгострокові плани для нації, ми повинні або прийняти цей рух, або придушити його, перш ніж він вийде з-під контролю."
 JUNO_brazil_events.34.a:0 "Вони розгадали наш блеф, ми повинні відступити."
 JUNO_brazil_events.38.desc:0 "[ARG.GetNameDefCap], схоже, готує власні сили для нападу на нас, після наших нещодавніх провокацій уздовж кордону. Вони й не підозрюють, що потрапляють у нашу пастку, незабаром ми матимемо можливість розгромити їх, і вони матимуть страждати від міжнародного засудження за війну."
