 ARG_political_events.120.b:0 "Абсолютно ні."
 ARG_political_events.24.b:0 "Ми ніколи не станемо на бік [ARG.GetNameDef]!"
 ARG_political_events.29.desc:0 "Уряд [CHL.GetAdjective] вирішив відмовитися від умов, які ми висунули. Враховуючи розмір та силу їхньої нації, ми можемо відступити. Інакше ми можемо згуртувати наші війська та розпочати підготовку до вторгнення."
 ARG_political_events.37.t:0 "[ARG.GetNameDefCap] відмовляється припинити воєнні дії"
 ARG_political_events.39.t:0 "[SPA.GetNameDefCap] відхиляє наші вимоги"
 ARG_political_events.73.desc:0 "[ARG.GetAdjective] дипломати щойно звернулися до нас із проханням про тіснішу співпрацю після наших нещодавніх торговельних угод з ними, а також через те, що їхня ідеологія стає дедалі схожою на нашу. Поточний запит стосується підписання пакту про ненапад між нашими країнами, а також гарантії їхньої незалежності."
 ARG_the_american_push_desc:0 "Наша прихильність до балансування відносин між Союзниками та Віссю не залишилася непоміченою [USA.GetName]. Вони дали зрозуміти, що незадоволені нашими поміркованими поглядами, і можуть попросити нас раз і назавжди розірвати зв'язки з Віссю."
 ARG_the_buenos_aires_conference_2_tt:0 "Залишившись з §YФанні Едельман§!, відімкнуться гілки фокусів §YОб'єднати континент§! та §YЗвільнити континент§!. Обрання §YАнтоніо Сото§! відімкне гілку фокусів §YПокращити Патагонію§!."
 ARG_the_buenos_aires_conference_desc:0 "Тепер, коли ми почали стабілізувати країну, ми повинні бути обережними, щоб не дозволити нашому керівництву потрапити в ту саму пастку напівдиктатури, в яку потрапив наш попередній уряд. Таким чином, у Буенос-Айресі була скликана соціалістична конференція з наміром обговорити та обрати наступного лідера для [ARG.GetNameDef]."
 ARG_unite_the_workers_decisions_desc:0 "Основою комуністичного руху завжди був працьовитий і пригноблений пролетаріат. Тепер, коли [ARG.GetAdjective]ий політичний ландшафт зміщується ліворуч, саме КПА має спровокувати страйки робітників у деяких із наших великих міст, щоби згуртувати людей, які стоять за нашою славною революцією!"
 ARMY_AIR_VARIANT_AIRWING_ITEM:0 "$COUNT|H$ із $ALL|H$ в авіакрилі $NAME|H$ на базі $BASE|H$"
 ARMY_NAVIES_ACTIVE:0 "$N$ флотів"
 ARMY_RAILWAY_GUNS_BUTTON:0 "§GКлацніть§!, щоб обрати.\n§GКлацніть§!, утримуючи §HShift§!, щоб обрати кілька залізничних гармат.\n§GКлацніть ПКМ§!, щоби перейти до залізничної гармати."
 ARM_UK_autonomy_puppet_DEF:0 "Протекторат Вірменія"
 AST_EQUIPMENT_VERSION_13:0 "Mk XIII"
 AST_SH_battleship_2_desc:0 "$ENG_SH_battleship_2_desc$"
 AST_a_change_of_authority:0 "Зміна влади"
 AST_a_change_of_authority_desc:0 "З покірного суб'єкта Австралія перетворилася на шановану та впевнену націю, і настав час зробити останній крок до того, щоб стати однією зі світових держав. Як лідера альянсу, друзі поважатимуть нас, а вороги — боятимуться. Окопавшись і міцно тримаючись, Австралія не здасться."
 AST_a_controversial_recruitment:0 "Суперечливе вербування"
 AST_a_convenient_disaster_desc:0 "Наскільки б популярним не став рух «Передусім Австралія», консерватори завжди чинитимуть опір ідеології групи. Щоб «Передусім Австралія» успішно здобула владу, може знадобитися щось більш драматичне, ніж звичайні вибори; щось, що вкине уряд у хаос.\n\nНаш рух не має можливості спровокувати таку подію самостійно, але наш іноземний фашистський прихильник має. Допомогши нашому приходу до влади, іноземні фашисти знайдуть друга в особі [AST.GetName]."
 AST_a_rational_request:0 "Раціональне прохання"
 AST_a_sense_of_place_desc:0 "Національна ідентичність — це зв'язок, що тримає народ разом. Завдяки розквіту культури австралійці об'єдналися, сповнені рішучості протистояти будь-кому, хто може загрожувати їхнім кордонам."
 AST_advanced_pilot_training:0 "Просунута підготовка пілотів"
 AST_aerodrome_of_democracy_neutrality:0 "Аеродром сили"
 AST_anti_air_equipment_2:0 "QF 40 mm Bofors"
 AST_anti_malaria_campaign_desc:0 "Наші сили можуть бути відправлені воювати в джунглях Тихого океану, де їх чекає загроза більш смертоносна, ніж ворожі кулі: малярія. Ми повинні вжити рішучих заходів, щоб захистити наші війська від цього невидимого ворога."
 AST_anti_tank_equipment_3:0 "QF 17-pounder"
 AST_armored_car_equipment_0_short:0 "Vickers Crossley"
 AST_australia_first_party:0 "Австралія перш за все"
 AST_big_business_pact_cat:0 "Пакт з великим бізнесом"
 AST_cabinet_trust_state_3_idea:0 "Середня довіра до кабінету"
 AST_canberra_air_disaster_events.4.t:0 "Зміна керівництва"
 AST_central_bureau_idea:0 "Центральне бюро"
 AST_cockatoo_doe_organization:0 "$Cockatoo_doe$"
 AST_cockatoo_island_shipyards_taog:0 "Верфі острова Какаду"
 AST_conscription_at_last_desc:0 "Незалежність солодка, адже ми усвідомлюємо, що тепер маємо владу ставити пріоритетом власну оборону — але ця влада також несе відповідальність. Обов'язковий призов не слід розширювати легковажно, але з війною, яка вже на порозі, це стало необхідним."
 AST_curtiss-wright_organization:0 "Curtiss-Wright"
 AST_defying_american_interference_desc:0 "Тінь [USA.GetNameDefCap] нависла над нами, погрожуючи втрутитися щоразу, коли наші дії не збігаються з її інтересами. Поки світова держава такого масштабу стискає свій залізний кулак навколо [PHI.GetNameDef], східноазіатські країни ніколи по-справжньому не належатимуть Східній Азії. [AST.GetName] не підкориться владі іноземних загарбників — Філіппіни будуть нашими."
 AST_defying_american_interference_idea:0 "$AST_defying_american_interference$"
 AST_destroyer_1:0 "Клас «Vendetta»"
 AST_destroyer_1_desc:0 "These destroyers included the Admirality and Thornycroft V and W classes, which were transferred to the RAN to form the 'Scrap Iron Flotilla'. They were built under the War Emergency Program. They were the ultimate evolution of British destroyer design during the First World War, embodying the improvements of their predecessors as well as new technological advances. Large numbers of these ships were built during the late stages of WWI and became the backbone of the Royal Navy's destroyer flotillas afterwards. Beginning in the 1930s, they were placed into reserve fleets, used eventually relegated to convoy escort duties. They were adequately-armed, fast vessels with good range."
 AST_diplomatic_events.10.b:0 "[USA.GetNameDefCap] буде сильнішою без них."
 AST_diplomatic_events.13.desc:0 "Під час процесу, який об'єднав австралійські колонії у федерацію, Нова Зеландія зрештою вирішила не брати участі. Проте з того часу Конституція Австралії продовжує визначати нас як один із потенційних штатів Співдружності та дозволяє наше приєднання.\n\n[AST.GetName] тепер стверджує, що нинішня ситуація у світі вимагає єдності, і просить, щоб [NZL.GetName] перейшла під австралійське управління. Чи варто нам скликати референдум з цього питання?"
 AST_diplomatic_events.15.a:0 "Австралія залишиться такою, як є."
 AST_diplomatic_events.17.b.tt:0 "§Y[INS.GetNameDefCap]§! надасть §YПраво проходу військам§! для §Y[AST.GetNameDefCap]§!."
 AST_diplomatic_events.3.desc:0 "Делегація, відправлена до [FROM.GetNameDef], телеграфувала відповідь країни на нашу пропозицію щодо пакту про ненапад. На превелику радість, [FROM.GetLeader] оцінив нашу ініціативу та погодився скріпити її своєю печаткою."
 AST_diplomatic_events.36.t:0 "Тихий океан розділить сам себе"
 AST_diplomatic_events.41.desc:0 "Тепер, маючи повну владу, [AST.GetFascistParty] дотримується своєї обіцянки і виконує свою частину угоди. Науру повертається до [GER.GetNameDef], і ми маємо гарантувати незалежність Австралії."
 AST_diplomatic_events.51.t:0 "Тихоокеанський гарнізон [ENG.GetNameDefCap]"
 AST_expected_election_winner_tt:0 "§YОчікуваний переможець\n[GET_AST_EXPECTED_WINNER]§! наразі має більшість Демократичних голосів.\n\nВпливайте на голоси через Фокуси, Політичних радників або запускаючи Політичну кампанію."
 AST_faction_training_initiative_idea_2_desc:0 "Спільна тренувальна ініціатива Тихоокеанського опору — це програма співпраці між його учасниками, яка гарантує, що всі солдати союзників проходять однаково сувору військову підготовку."
 AST_for_greater_good:0 "Заради вищого блага"
 AST_free_the_colonies_desc:0 "Вогонь революції палає у розвалюваній Британській імперії. Колонії більше не будуть колоніями, а стануть вільними націями. Повстаньте, товариші! Скиньте свої кайдани і приєднуйтесь до революції!"
 AST_free_the_colonies_tt:0 "§Y[AST.GetName]§! знижує статус усіх колишніх британських колоній під її контролем до інтегрованих маріонеток."
 AST_government_formation_period:0 "Період формування уряду"
