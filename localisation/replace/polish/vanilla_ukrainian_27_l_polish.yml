 INS_volksraad_events.20.t:0 "Пропозиція у Фольксрааді дозволити індонезійську мову в уряді"
 INS_volksraad_knil_rank_limit_desc:0 "Хоча немає офіційного правила, яке б заважало корінним індонезійцям просуватися по службі в KNIL, існує неписане правило, яке забороняє це, обмежуючи навіть найуспішніших військовослужбовців званням полковника. Кілька партій у Фольксрааді чинять тиск на уряд, вимагаючи визнати зусилля успішних індонезійських офіцерів."
