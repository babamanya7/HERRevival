 BRA_establish_the_brazilian_investment_bank_desc:0 "Не бракує міжнародних корпорацій, яким було б вигідно платити менше податків, ніж вони платять зараз. Встановивши сприятливу податкову політику для таких компаній, ми можемо залучити їх до [ROOT.GetNameDef], що принесе користь нашій економіці."
 BRA_estado_novo_desc:0 "Після багатьох років перебування на межі громадянської війни ми можемо нарешті вийти з політичного глухого кута і побудувати нову державу, засновану на мирі, справедливості та праці. Тим часом, ми повинні продовжувати викорінювати тих, хто виступає проти нового устрою, поки вони не посіяли ще більше розбрату."
