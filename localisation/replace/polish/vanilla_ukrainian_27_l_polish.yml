 landing_craft:0 "Десантні судна"
 landmark_statue_of_liberty_desc:0 "Колосальна Статуя Свободи гордо стоїть у гавані Нью-Йорка, головному пункті в’їзду до Сполучених Штатів для іммігрантів, які прагнуть почати нове життя. Згодом вона стала втіленням американського духу життя, свободи та прагнення щастя."
 lar_appeal_to_overseas_territories.10.desc:0 "Губернатор острова закликав його громадян зберігати спокій і виконувати вказівки легітимного уряду Віші. Схоже, що невдоволення на острові практично немає — більшість жителів дотримуються заклику губернатора."
 lar_capture_tito.2.a:0 "Ми його взяли."
 lar_concessions_to_italy.1.b:0 "[ITA.GetLeader] не з тих, кому можна довіряти."
 lar_concessions_to_italy.5.b:0 "Вони занадто мало пропонують і дуже багато хочуть."
 lar_concessions_to_italy.7.desc:0 "У стислій відповіді на нашу ноту [From.GetAdjective]ий уряд зазначає, що наразі він не зацікавлений в укладенні союзу або ратифікації Стрезької угоди. Як стверджується, жодні територіальні поступки не змінять цього рішення."
 lar_end_the_occupation.3.t:0 "[From.GetLeader] відмовляється"
 lar_end_the_occupation.6.desc:0 "Вислухавши довгу лекцію про те, що [This.GetLeader] нікчемна як людина, патріот, солдат і громадянин, наша делегація, яку приймав [From.GetLeader], вирушила додому, не досягши нічого. Пізніше тим А вдень [From.GetLeader] у своєму радіозверненні публічно затаврував наш уряд як «найбільші збори боягузів і зрадників за всю історію Франції». Якщо ми хочемо повернути свою батьківщину і звільнити її від німців, нам доведеться впоратися без чужої допомоги."
 lar_france_vichy_reunification.3.a:0 "Отже, ми досягнемо єдності силою."
 lar_france_volunteers.3.desc:0 "Бої в Іспанії закінчилися, і частина людей, що боролися за ті ж ідеали, що і [From.GetLeader], повернулися додому. Військова розвідка хоче поговорити з ними, щоби знати, чи можуть вони поділитися з нами корисними знаннями про сучасні методи війни, але багато хто в уряді побоюється, що колишні військові можуть радикалізувати інші політичні групи."
 lar_franco_soviet_treaty.3.desc:0 "Під час дуже прохолодної зустрічі з [From.GetAdjective] міністром закордонних справ нашому послу повідомили, що союз із нами нецікавий [From.GetAdjective] стороні. Як було сказано, у географічних реаліях Європи [From.GetAdjective]і війська не зможуть ефективно підтримувати нас у разі нападу на наші території та навпаки, тому [From.GetAdjective] уряд змушений відхиляти подібні пропозиції."
 lar_news.1.t_independent_communist:0 "Перемога РПМО в громадянській війні в Іспанії"
 lar_news.10.b_2:0 "Вони готові ризикнути нашою перемогою над республіканцями?!"
 lar_news.14.e:0 "Вони мають шанс."
 lar_news.27.desc:0 "За минулі місяці португальські та іспанські політики провели безліч зустрічей, де обговорювали можливість створення в Іберії керованого політиками обох націй єдиної держави лівого спрямування. \n\nПісля довгого періоду приготувань та переговорів сьогодні лідери Португалії й Іспанії офіційно заявили про створення держави [POR.GetNameDef], нової держави, де іберійські громадяни будуть вибирати лідерів, які найкраще представляють суспільні інтереси, і де буде свобода пересування."
 lar_news.28.a:0 "Принаймні громадянська війна йде так, як вигідно нам."
 lar_news.29.t:0 "Іспанські націоналісти переможені"
 lar_news.7.desc:0 "[FRA.GetLeader] та [GER.GetLeader] зустрілися в Берліні, щоб обговорити політичну та стратегічну ситуацію в Центральній Європі. Зустріч не висвітлювалася у подробицях, офіційне комюніке випущено не було, але спостерігачі помітили явне зрушення в [FRA.GetAdjective] і [GER.GetAdjective] риториці та політиці у бік країн Бенілюксу.\n\nНімецька меншість у Бельгії, що була раніше предметом німецької пропаганди, тепер згадувалося лише мимохіть, при цьому було відзначено, що Бельгія, а не держава; купка нашвидкуруч зібраних разом народів», і великий наголос робився на велику франкомовну діаспору."
 lar_portugal_iberian_summit.4.desc:0 "Іспанія та Португалія відправили нам спільний запит на вступ до альянсу [Root.GetFactionName]. Вони чекають, що ми приймемо в нього обидві іберійські нації. \n\nМи оцінюємо потенціал доступу до Середземного моря, а наші військові командири тим часом стурбовані імовірним відкриттям нових фронтів, на захист яких ми можемо не вистачити ресурсів..."
 lar_portugal_naval_blockade.3.t:0 "[POR.GetNameDefCap] відмовляється дотримуватися морської блокади"
 lar_portugal_navy_mutiny.5.t:0 "Наші моряки повертаються з громадянської війни в Іспанії"
 lar_portugal_overseas_provinces.1.t:0 "Інтеграція ангольських територій"
 lar_portugal_promote_monarchist_cause.3.b_tt:0 "§R§Y[From.GetFlag][From.GetNameDefCap]§! буде воювати проти нас у громадянській війні.§!"
 lar_portugal_purchase_ships.3.t:0 "[From.GetNameDefCap] відмовляється побудувати нам кораблі"
 lar_portugal_purchase_ships.5.desc:0 "Після майже року будівництва два замовлені нами [GetPortugueseShipsBuilder] есмінці пройшли випробування в морі і нарешті готові до офіційної передачі на флот.\nКораблі стоять у [Root.GetAdjective] порту, їх команди ожиють"
 lar_portugal_spanish_civil_war.2_tt:0 "§R[POR.GetNameDefCap] зможе приєднатися до держави [SPA.GetFlag][SPA.GetNameDef] у громадянській війні в Іспанії та воювати проти нас!§!"
 lar_spain.13.t:0 "Націоналісти переможені"
 lar_spain.34.a_tt:0 "Хав'єр Бурбон-Пармський стане королем при відновленні монархії.\n"
 lar_spain.34.c:0 "Претендент-Габсбург показав себе гідним."
 lar_spain.63.t:0 "Повстання комуністів у державі [From.GetNameDefCap]"
 lar_spain.8.desc:0 "Лідери Фаланги, незадоволені нашими постійними вимогами політичної незалежності, вирішили покласти край нашому руху. Сили фалангістів виступили проти наших рекете і спробували заарештувати кількох наших провідних мислителів і політиків.\n\nСвоєю відсутністю гнучкості вони поставили під удар позицію всього Націоналістичного фронту і зіграли на руку республіканцям."
 lar_spain.9.desc_2:0 "Після нещодавніх подій зростаюча незалежність анархістських комун досягла свого апогею. Анархісти та їх союзники з РПМО, розлючені нашими розсудливими спробами поступово повернутися до стабільного і централізованого уряду, перейшли від місцевих розбіжностей до повномасштабних військ. \n\nВони готові ризикнути насилу здобутою перемогою над націоналістами, аби не розлучатися зі своїми дурними думками про незалежність!"
