 SOV_socialism_in_one_country_desc:0 "Хоча світова революція залишається нашою кінцевою метою — і науково доведено, що вона неминуча — ми мусимо спочатку забезпечити соціалізм у нашій країні, щоб звільнення робітників в інших частинах світу не затрималося через нашу поразку."
