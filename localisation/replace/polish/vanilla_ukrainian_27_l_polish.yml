 HUN_habsburg_restored:0 "Правління Габсбургів відновлено"
 HUN_heavy_fighter_effort_desc:0 "Наші винищувачі мусять бути здатні підтримати більш вразливі бомбардувальники. Їм потрібно поліпшити озброєння та підвищити дальність польоту, нехай навіть ціною швидкості та маневреності."
 HUN_home_defense_desc:0 "Невеликі мобільні ударні групи не в змозі захистити межі нашої батьківщини у разі нападу. Ми мусимо організувати неприступні оборонні рубежі та розробити нові доктрини для підвищення ефективності такого підходу."
