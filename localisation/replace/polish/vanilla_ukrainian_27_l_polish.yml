 ETH_together_for_victory_tt:0 "Воїни-повстанці піднімуться в тилу ворога, коли почнеться війна за незалежність."
 ETH_transformation_of_nature_desc:0 "[ETH.GetNameDefCap] багатий на природні ресурси, які чекають, щоб їх використали. Завдяки створенню гребель гідроелектростанцій на наших річках ми можемо забезпечити електрикою кожну домівку на землі. Водночас ми можемо використовувати наші водні шляхи для розширення наших сільськогосподарських можливостей для підтримки зростаючого населення."
 ETH_unification_of_the_habesha_desc:0 "Війна з [ITA.GetName] завдала неймовірної шкоди нашій інфраструктурі та завдала лиха нашим людям. Просто повернути Батьківщину вже недостатньо. Ми вимагаємо від [ITA.GetAdjective]ої влади компенсації, включаючи територіальні поступки, які дозволять нам об'єднати народи хабеша."
