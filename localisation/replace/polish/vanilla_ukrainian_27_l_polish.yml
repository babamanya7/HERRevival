 IRQ_align_afghanistan_fasc_desc:0 "[AFG.GetNameDef] довгий час була затиснута між [SOU.GetAdjective]s та [ENG.GetAdjective] як буферна держава. Можливо, співпрацюючи, ми зможемо підняти їх до більш відповідного становища в регіоні."
