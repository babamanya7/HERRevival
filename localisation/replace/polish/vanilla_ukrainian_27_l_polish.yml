 DEN_align_with_foreign_powers_desc:0 "[?DEN.DEN_overlord_nation.GetNameDefCap] не віддадуть ані п'яді завойованої землі без бою, і ми не зможемо самотужки протистояти їхній військовій могутності. Якщо ми хочемо коли-небудь скинути кайдани поневолення і повернути собі свободу, ми мусимо шукати можливих союзників, які можуть допомогти нам у нашому скрутному становищі."
