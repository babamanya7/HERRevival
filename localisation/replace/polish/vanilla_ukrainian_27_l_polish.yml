 RAJ_the_legacy_of_babur_desc:0 "Імперія Великих Моголів колись об'єднала величезні простори субконтиненту під своїм прапором. Тепер є ті, хто мріє відновити її славу, використовуючи спадщину Бабура, щоб надихнути нову еру імперського відродження та єдності."
 RAJ_the_ordnance_factories_board:0 "Рада збройових заводів"
 RAJ_the_return_of_the_east_india_company_desc:0 "Після багатьох десятиліть відсутності, Ост-Індійська компанія має бути відновлена, щоб повністю експлуатувати Індійський субконтинент через безжальну ефективність."
 RAJ_timurid_empire_fascism_ADJ:0 "Тімурідськ"
 RAJ_to_shake_the_world_desc:0 "Промисловий потенціал Індії величезний, і настав час його розкрити. Розширюючи фабрики, модернізуючи інфраструктуру та використовуючи наші ресурси, ми можемо перетворити Індію на промислового гіганта, здатного формувати долю світу."
