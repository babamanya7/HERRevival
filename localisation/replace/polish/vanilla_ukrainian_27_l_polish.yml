 MEXICO_GATHERING_STORM_DESC:0 "Мексика пережила два десятиліття громадянських війн після повалення тирана Порфіріо Діаса. Централізатори воювали з регіоналістами, селяни та соціалісти виступали проти власників асьєнд, а війна держави та релігії тероризує Мексику з часів епохи Просвітництва.\n\nСвітський уряд наполягає, що він переміг у цій війні, але він сидить на троні з попелу. Після перебудови Мексики, можливо, з'явиться інший переможець."
