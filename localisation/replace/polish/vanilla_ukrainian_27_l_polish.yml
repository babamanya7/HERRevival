 MUN_czech.1015.t:0 "[FROM.GetName] пропонує об'єднати наші фракції"
 MUN_czech.1026.unification:0 "Незважаючи на визнання переваг, які принесла б федерація, [FROM.GetNameDef] вирішила зберегти свій уряд у вигнанні як єдиний законний уряд для своїх земель."
 MUN_czech.1044.d:0 "Вирішивши, що їм буде краще самим, ніж під нашим керівництвом, [FROM.getname] відкинула можливість приєднатися до нашої федерації. Це удар по нашій меті зміцнити свої позиції в Європі. Що ми маємо робити тепер, коли [FROM.getname] не бажає братися за розум."
 MUN_czech.3.a:0 "Хіба може бути ще гірше?"
 MUN_czech.news.2.desc:0 "\nДесь у нещодавньому ланцюгу подій, що послідували за політичним хаосом у Чехії, невеликий регіон [RUT.getname] опинився поза межами будь-якої країни. Мала сепаратистська держава згодом оголосила себе незалежною нацією і почала формувати ополчення, щоб спробувати захистити свою нову державність.\n\n[FROM.getnamedefcap] давно мала плани на цей регіон і, побачивши можливість, негайно здійснила вторгнення в цю невелику сепаратистську державу. Їхня перемога над [RUT.getname] багатьом спостерігачам здається заздалегідь визначеною."
 MUN_czech_bop.1.a:0 "Ми будемо готові."
 MUN_czech_bop.3.t:0 "[CZE.getname] надіслала спостерігачів до нашої країни"
 MUN_the_fall_of_the_republic.3.d:0 "З огляду на нещодавній політичний хаос, що охопив нашу країну, невеликий регіон Карпатської України бажає отримати більшу автономію від [9.GetCapitalVictoryPointName]. Вони посилаються на давні розбіжності між своїм регіоном та рештою [ROOT.getname]. Однак це прохання більше схоже на те, що місцеві лідери просто користуються нагодою для розширення власних повноважень. Відхилення цього прохання коштуватиме багато політичного капіталу в той момент, коли ми не маємо зайвого."
 MUN_the_fall_of_the_republic.7.d:0 "Як і очікувалося, [FROM.getname] прийняла наші вимоги і готова бути анексованою нашою країною в обмін на деякі тривіальні умови. Цей невеликий регіон не мав жодних шансів протистояти такій могутній державі, як наша. Тепер наш північний кордон захищений краще, ніж раніше, і уряд дуже задоволений здобутою легкою перемогою."
