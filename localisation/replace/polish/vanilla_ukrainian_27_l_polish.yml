 FRA_arms_purchases_allowed:0 "Купівля зброї дозволена"
 FRA_artillery_focus_desc:0 "Наша артилерія буде об'єднуватись у єдиний потужний кулак для ведення зосередженого вогню за вказаними напрямками. Один залп — і ми послабимо ворожу лінію фронту і прорвемося через неї, якщо потрібно."
 FRA_battle_of_maneuver_desc:0 "Старе уявлення про поле битви як про невелику територію, на якій стикаються армії, мертво. З масовою моторизацією, літаками та швидким радіозв'язком битви швидко просуваються на сотні кілометрів. Чим швидше ми до цього підготуємось, тим краще."
 FRA_buy_from_the_enemy:0 "$VIC_buy_from_the_enemy$"
 FRA_carry_the_revolution_north:0 "Поширити революцію на північ"
 FRA_communist_cooperation:0 "Комуністична співпраця"
 FRA_counter_action_desc:0 "Action Francaise довгий час була найрішучішим прихильником повернення до монархії. На жаль, їхні погляди на інші теми менш приємні. Настав час повідомити їм, що вони виконали свою мету, і позбутися від них."
 FRA_coup_in_madagascar:0 "Підготувати переворот на Мадагаскарі"
 FRA_coup_in_syria_desc:0 "Багато французів у Сирії прагнуть знову боротися із загарбником. Треба лише вийти з ними на зв'язок."
 FRA_cv_CAS_equipment_3:0 "SNCASO SO.8000 Narval"
 FRA_cv_fighter_equipment_1_short:0 "D.510"
 FRA_destroy_decadence_desc:0 "Жодна країна ніколи не була великою, якщо дозволяла собі обговорювати навіть найменше питання місяцями. Деякі країни, безпечні за океаном і підтримувані глобальними імперіями, можуть вважати, що вони можуть дозволити собі цю розкіш. Ми не можемо."
 FRA_fascist_civil_war_decision_desc:0 "Обурення популістів зростає, і цю хвилю не зупинити. Підсумок неминучий."
 FRA_fighter_equipment_3:0 "Bloch MB.157"
 FRA_humanite_unie:0 "Humanité Unie"
 FRA_indochina_intervention.3.desc:0 "З приходом поганої погоди та виснаженням запасів у обох сторін командувачі союзними та вишистськими військами в Індокитаї домовилися про припинення вогню. Оскільки елемент несподіванки вже втрачений, а атакуючі зіткнулися з величезними труднощами, верховне команд навряд чи зможуть продовжити наступ навіть після того, як ситуація поліпшиться."
