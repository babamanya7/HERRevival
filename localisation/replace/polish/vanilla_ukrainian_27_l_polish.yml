 RU_lower_ShortAdj_democratic:0 "демократичн"
 RWA_neutrality_ADJ:0 "Руандійськ"
 SAF_abram_fischer:0 "Брем Фішер"
 SAF_anti_colonialist_crusade:0 "Священна війна проти колоніалізму"
 SAF_anti_tank_equipment_1:0 "QF 2-pounder"
 SAF_battle_cruiser_2_desc:0 "The Princess Royal was a class of hypothetical battlecruisers that were a faster and cheaper version of the King George V-class battleships. These vessels carried a similar but reduced armament for both surface and anti-air combat: two triple 14 in. cannons and six twin 5.25 in. AA guns. Their fast speed and long range would provide the Royal Navy quick strike capabilities and convoy protection, but their limited armor would prove problematic if they had to fight modern battleships."
 SAF_carrier_1_desc:0 "These three aircraft carriers were converted battlecruisers and were the first fleet carriers of the Royal Navy. Their conversion was the result of the Washington Naval Treaty of 1922 and the work was finished in 1925. They were moderately-armored but well-armed vessels, with long range and good speed, but due to the nature of the conversion their aircraft complement was limited. Nonetheless, they gave the Royal Navy important experience in aircraft carrier construction and fleet air projection."
 SAF_commit_to_the_five_year_plan_desc:0 "Ми розробили п'ятирічний план модернізації та збільшення південноафриканських ВПС. Уряд повинен публічно оголосити про початок виконання, щоби не відставати від графіка."
 SAF_csir_desc:0 "Південна Африка відстає від інших домініонів у розвитку науки і техніки, тому створення Ради з наукових і промислових досліджень (РНПД) у Преторії стало одним із головних завдань влади."
 SAF_destroyer_1_desc:0 "These destroyers included the Admirality and Thornycroft V and W classes. They were built under the War Emergency Program. They were the ultimate evolution of British destroyer design during the First World War, embodying the improvements of their predecessors as well as new technological advances. Large numbers of these ships were built during the late stages of WWI and became the backbone of the Royal Navy's destroyer flotillas afterwards. Beginning in the 1930s, they were placed into reserve fleets, eventually relegated to convoy escort duties. They were adequately-armed, fast vessels with good range."
 SAF_liberate_portugese_desc:0 "Колонії Ангола та Мозамбік межують із нашою країною. Настав час покінчити з експлуатацією їх громадян."
 SAF_light_tank_artillery_equipment_2:0 "Priest"
 SAF_light_tank_destroyer_equipment_2_short:0 "Valiant"
 SAF_light_tank_destroyer_equipment_3_short:0 "Archer"
 SAF_light_tank_equipment_1:0 "Vickers Medium Mark II"
 SAF_moses_kotane:0 "Мозес Котане"
 SAF_pierre_oliver_knoll:0 "П'єр Олівер-Нолл"
 SAF_support_the_world_revolution_desc:0 "Пролетарі зможуть здобути перемогу лише тоді, коли об'єднаються у всьому світі. Революція має стати світовою, її потрібно експортувати до інших країн."
 SAF_work_for_all_poor_desc:0 "В останні роки міста наповнили незаможні африканери із сільських районів, які намагаються знайти роботу, але ми їм практично не допомагали; принаймні, донині. Індустріалізація та урядові гарантії зайнятості цих громадян стануть для них підмогою."
