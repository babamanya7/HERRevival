 sp_air_earthshaker_bomb_desc:0 "Важка бомба, сконструйована таким чином, що вона проникає в землю до того, як вибухне, спричиняючи масивні структурні пошкодження цілі."
 sp_air_intercontinental_bomber_preference_bombing_payload:0 "Більше корисне навантаження"
 sp_air_mothership_aircraft_desc:0 "Масивний літак, який несе винищувачі в бій, забезпечуючи глибокі супровідні місії на територію противника — воістину повелитель небесного рою."
 sp_air_mothership_preference_reliability:0 "Безпека та надійність"
 sp_armored_maintenance_tech:0 "Бронетанкова ремонтна рота"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc:0 "Спеціалізовані транспортні засоби, призначені для перевезення та обслуговування надважких гаубиць, що забезпечують мобільність та легкість розгортання на полі бою."
 sp_land_land_cruiser_desc:0 "Масивний броньований велетень, створений домінувати на полі бою. Маючи неперевершені розміри та вогневу міць, ця машина є вершиною танкової війни."
 sp_land_reward_option_land_cruiser_engine_new_bonus_name:0 "Перероблений двигун"
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety:0 "Виділити зусилля на безпеку робітників"
 sp_naval_aip_engine_preference_a:0 "Тихіші двигуни"
 sp_naval_aip_engine_unique_reward_a_desc:0 "Наші вчені, які працюють над цією технологією, поділилися результатами з колегами, що вдосконалюють традиційніші двигуни. Не варто завчасно тішити себе надіями, адже отримані покращення навряд чи будуть приголомшливими."
 sp_naval_cruiser_submarine_unique_reward_a:0 "Рейдерський протокол"
 sp_naval_fleet_submarine:0 "Ескадрений підводний човен"
 sp_naval_fleet_submarine_preference_a:0 "Атакувальний потенціал"
 sp_naval_generic_reward_armor_tech_2:0 "Інновації морської броні"
 sp_naval_generic_reward_option_armor_tech_bonus_name:0 "Експериментальні дослідження морської броні"
 sp_naval_generic_reward_scientist_xp_3:0 "Ванна — Еврика!"
 sp_naval_underway_replenishment_unique_reward_a:0 "Масштаби поповнення запасів"
 sp_naval_underway_replenishment_unique_reward_a_desc:0 "Поки ми працюємо над тим, щоб система поповнення запасів на ходу діяла максимально безперебійно, нам потрібно ухвалити ще одне рішення: чи хочемо ми змінити наші початкові розрахунки?"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc:0 "[Character.GetName] зумі[Character.GetVerbGendEndA_RU] вирішити складну теоретичну задачу під час роботи з останнім прототипом. Це дозволило оптимізувати конструкцію бомби, що зробить її менш складною у виробництві."
 sp_nuclear_warheads_desc:0 "Створюючи компактну ядерну зброю, ми зможемо застосовувати її як корисне навантаження для широкого спектру ракетних пускових систем, що дозволить нам наносити удари на величезні відстані."
 sp_rocket_glass_wool_choice_reward_accept:0 "Прикро, але необхідно."
 sp_rocket_outercoating_reward_accept:0 "Можливо, можна застосувати мастило?"
 sp_standard_tenshioned_replenishment_alongside_method_desc:0 "Стандартизована система поповнення запасів на ходу (STREAM) є подальшим розвитком забезпечення стабільного поповнення запасів для наших морських операцій на далеких відстанях."
 sp_tag_surface_ship_speed_factor_tt:0 " $sp_tag_surface_ship_speed_factor$: $RIGHT|+=%1$"
 spa_civil_war_divisions_counter_full_breakdown:0 "Якщо громадянська війна почнеться зараз, [SPA.GetNameDefCap] почне її з [?SPR.spa_civil_war_divisions_counter_var|+0] §Hдивізіями§!.\n"
 spawn_cossacks_tt:0 "Отримати 15 військових частин із §Y8 кавалерійськими§! батальйонами.\n"
 special_project_consumer_costs_high:0 "Секретне постачання ресурсів"
