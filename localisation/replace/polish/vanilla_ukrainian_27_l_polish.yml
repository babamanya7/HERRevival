 ARG_internal_focus_desc:0 "Хоча можливість звернутися до головних демократичних держав існує, багато хто в нашому уряді вважає за розумне зосередитися на [ARG.GetNameDef] внутрішньо, а не спрямовувати наші ресурси в інше місце. Наразі ми повинні обмежити торгівлю нашої нації зі світом, щоб забезпечити, що [ARG.GetNameDef] має те, що їй потрібно, щоб витримати натиск війни."
