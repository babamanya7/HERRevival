 YUG_mio_trait_rogozarski_funding:0 "Фінансування $YUG_rogozarski$"
 YUG_replace_the_dalmacija_desc:0 "Старий німецький крейсер «Dalmacija» має застарілу конструкцію. Нам потрібен новий, сучасний корабель крейсерського типу, щоби замінити його і стати основою нашого Адріатичного флоту."
