 BUL_ban_far_right_organizations_desc:0 "Ультра-праві радикали без вагань застосовують насильство проти влади, створюючи велику загрозу для нашого уряду та для наших громадян. Ми мусимо заборонити всі соціальні рухи такого характеру та розпустити будь-які пов'язані з ними воєнізовані організації."
 BUL_carry_the_revolution_abroad_tt:0 "Будь-яка незалежна §Yкомуністична§! держава на Балканах отримає подію §YБолгарія запрошує нас у свій альянс§!."
 BUL_consolidate_the_third_bulgarian_state_desc:0 "Після тривалого періоду соціальних конфліктів, економічної депресії та міжнародних суперечок ми нарешті готові стабілізувати та зміцнити Третю Болгарську державу."
 BUL_cooperate_with_the_zveno_desc:0 "Ми мусимо працювати разом із Звеном, а не протистояти їм. Якщо ми вирішимо піти їм на певні поступки, то зможемо отримати могутнього союзника."
