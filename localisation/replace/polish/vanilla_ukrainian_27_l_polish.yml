 SOV_architect_of_communism_desc:0 "Непохитна відданість товариша Сталіна ідеалам революції дозволила йому побачити виклики побудови соціалізму в одній країні. Коли робота над побудовою соціалізму вже йде повним ходом, він може перейти до наступного великого кроку: як перейти від соціалізму до повного комунізму."
