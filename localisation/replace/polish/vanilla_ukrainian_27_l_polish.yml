 category_marines:0 "Уся морська піхота"
 champion_of_peace_3:0 "$champion_of_peace_1$"
 chief_engineer_desc:0 "§LЦей офіцер чудово знає, як влаштований корабель.§!"
 china.101.a:0 "Разом ми — сила!"
 china.105.b:0 "Ми дамо їм певний контроль над нашою країною на час війни."
 china.11.t:0 "Поразка проти Гоміньдану"
 china.13.b:0 "Ми не можемо дозволити собі ще одну сутичку."
 china.202.t:0 "Комуністичні повстання в області [CHI_communist_state.GetName]"
 china.204.d:0 "Із закінченням громадянської війни в Китаї, час укріпити владу в Китаї й показати народу, що ми — сучасне втілення Середнього царства. Ми — держава, що поведе їх у майбутнє.\n\nНа завершення, у нас має бути столиця, що личить нашій великій державі."
 claim_bessarabia:0 "Вимогти Бессарабію"
 claim_karelia:0 "Вимогти Карелію"
 close_panama_canal:0 "Перекрити Панамський канал"
 collectivization_specialist:0 "Спеціаліст із колективізації"
 communism_desc:0 "Тоталітарний режим"
 concentrated_fire_plans:0 "Плани концентрованого вогню"
 condemn_japan_desc:0 "Японська агресія проти Китаю — порушення всіх норм цивілізованості та посягання на принципи свободи; загроза життю та правам громадян США, як і загроза економічним інтересам США в Китаї! Японія має припинити агресію або зіткнутися з наслідками."
 confederate_flags:0 "Прапори Конфедерації"
 congo_independence_struggle.14.b:0 "Ми зараз надто перевантажені. Дайте їм ту свободу, яку вони бажають."
 congo_independence_struggle.3.t:0 "[FROM.GetNameDefCap] дасть нам нашу свободу, якщо ми приєднаємось до їхньої фракції"
 conquest_of_territory_goal_desc:0 "У ворожому світі розширення життєво необхідне для виживання. Розширення створює буферні зони та дає нам доступ до більшої кількості ресурсів."
 construction2_desc:0 "Модернізація інструментів та обладнання піде на користь нашим будівельникам."
 construction5:0 "Будівництво V"
 contain_japanese_expansion_asia_goal_desc:0 "Ми повинні робити все можливе, щоб стримати територіальну експансію японців."
 continuous_restrict_freedom_desc:0 "Піддані в наших колоніях забили собі голови всякими дурощами на кшталт «права на самовизначення» та «національної незалежності». Час розвіяти їхні помилки."
 continuous_special_facility:0 "Будівництво компексів"
