 HUN_pan_ugric_volunteer_force_desc:0 "Наша нещодавня підтримка фінно-угорських братів надихнула багатьох [ROOT.GetAdjective] добровольців вступити до лав армії та приєднатися до боротьби за кордоном."
 HUN_referendum_in_carpathian_ruthenia:0 "Організувати референдум в [73.GetName]"
 HUN_strengthen_fascists_desc:0 "Ми маємо посилити фашистські рухи в нашій країні, організувавши платформу для поширення цієї ідеології. Подібні погляди на майбутнє Угорщини допоможуть нашій державі знову стати великою."
