 ITA_capital_ships_desc:0 "Держава з найбільшою кількістю лінкорів пануватиме океанами. Ми не можемо дозволити Королівським ВМС перевершити нас у Середземному морі..."
 ITA_carica_di_isbuscenskij:0 "Carica di Isbuscenskij"
 ITA_carlo_geloso:0 "Карло Джелозо"
 ITA_carrier_2:0 "Клас «Falco»"
 ITA_christian_democracy_desc:0 "Християнсько-демократична партія — це консервативна політична організація центру на чолі з Альчіде де Гаспері, яка зуміла завоювати народну підтримку, об'єднавши християнські ідеали з ідеєю свободи. Ми мусимо дозволити їм сформувати уряд, поки вони залишаються лояльними до монархії."
 ITA_convene_the_grand_council:0 "Скликати Велику раду"
 ITA_defend_the_land:0 "Захищати землю"
 ITA_disgruntled_military_desc:0 "Очищення армії від роялістських елементів, які могли загрожувати нашій новій республіці, призвело до втрати досвідченого керівництва."
 ITA_empower_the_carabinieri:0 "Уповноважити карабіньєрів"
 ITA_expand_regional_control_desc:0 "Ми розширимо [ITA.GetAdjective]ий контроль: [FROM.GetName]."
 ITA_ferrea_mole_ferreo_cuore_heavy_tempaltes_tt:0 "\nКоли буде досліджено технологію §Y$advanced_heavy_tank_chassis$§!:\n"
 ITA_flotta_d_evasione_dockyards_tt:0 "\nПевні області в §YПівнічній Африці§!, §Yзахідному узбережжі Іберії§! та §Yзахідному узбережжі Франції§! також отримають §Y1 верф§!, якщо вони повністю підконтрольні державі §Y[ROOT.GetFlag][ROOT.GetNameDef]§! або §Y[ROOT.GetAdjective]ому суб'єкту§!."
 ITA_francesco_pricolo:0 "Франческо Пріколо"
 ITA_gappisti_state_modifier_rds_tt:0 "$ITA_modify_partisan_state_modifier_intro$\n$MODIFIER_RESISTANCE_TARGET_ON_OUR_OCCUPIED_STATES$: §G+10%§!\n$MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS_ON_OUR_OCCUPIED_STATES$: §G+10%§!\n\n"
 ITA_german_millitary_cooperation:0 "Німецька військова співпраця"
 ITA_grande_rivolta_rurale:0 "Grande Rivolta Rurale"
 ITA_grandi_side:0 "$ITA_dino_grandi$"
 ITA_investments_in_edison_desc:0 "Італія може похвалитися найпершою електростанцією в Європі, і вона завжди знаходилася на технологічній передовій. Завдяки інвестиціям у компанію «Edison» ми можемо гарантувати, що залишимося в лідерах."
 ITA_italia_libera_faction_tt:0 "Станеться подія §Y[ROOT.GetName] запрошує нас у $ITA_free_states_of_europe$§!."
 ITA_italian_irredentism_desc:0 "Завдяки нашому фашистському режиму італійський іредентизм після Великої війни стає дедалі агресивнішим. Настав час Італії повернутися до своїх природних кордонів і об'єднати всі території, які по праву належать італійському народу!"
 ITA_italys_destiny_desc:0 "Ми визначимо роль, яку Італія мусить відігравати в цьому альянсі: роль верховної морської держави в Середземному морі. Наступним ключовим кроком у досягненні цієї мети є забезпечення домінування на Балканах."
 ITA_king_low_control_range:0 "Слабкий вплив Савойського дому"
 ITA_mechanized_equipment_3_short:0 "Breda 61"
 ITA_medium_tank_equipment_1:0 "Fiat M11/39"
 ITA_military_industry_dynamic_modifier:0 "Військова промисловість"
 ITA_missiolini_occupy_dalmatia_desc:0 "Ми повинні виправити велику несправедливість часів Великої війни і силою забрати те, що належить нам по праву. Далмація повинна стати італійською!"
 ITA_missiolini_strengthen_the_airforce_desc:0 "Regia Aeronautica стала символом національної гордості і колись була одним з найбільших повітряних флотів у світі. Нам потрібно виробляти додаткові літаки, щоб посилити наші військово-повітряні сили і зробити їх знову великими."
 ITA_missiolinis:0 "Завдання від дуче"
 ITA_mussolini_took_over_minister_of_foreign_affairs_flag:0 "Минуло §Y365 днів§! відтоді, як §Y[ROOT.ITA_benito_mussolini.GetName]§! очолив Міністерство закордонних справ\n(наразі минуло [?ITA_mussolini_took_over_minister_of_foreign_affairs_flag:days|Y0])"
 ITA_naval_air_coordination_desc:0 "Досі вище командування ВПС слідувало власній доктрині та погано координувало свої дії з ВМС. Це обмежувало здатність Regia Marina проводити ефективну розвідку. Розробивши спільну морсько-повітряну доктрину та налагодивши зв'язок між флотськими й авіаційними підрозділами, наші кораблі зможуть ліпше знаходити ворога та завдавати йому ударів."
 ITA_new_corporations_desc:0 "Ми мусимо взяти попередню концепцію корпорацій, яку використовував фашистський режим, і адаптувати її до потреб нашого нового уряду."
 ITA_novus_ordo:0 "Novus Ordo"
 ITA_nuclear_research:0 "Ядерні дослідження"
 ITA_polizia_dell_africa_italiana_occupation_law_tt:0 "Змінити закон окупації §Y$colonial_police$§! на:\n $MODIFIER_LOCAL_MANPOWER$: §G+5%§!\n $MODIFIER_RESISTANCE_TARGET$: §G-10%§!\n $MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS$: §G-10.00%§!\n $MODIFIER_REQUIRED_GARRISON_FACTOR$: §G-5%§!\n $MODIFIER_COMPLIANCE_GAIN_ADD$: §G+0.005%§!\n\n"
 ITA_pressure_government_cd_tt:0 "\nМи можемо тиснути на уряд держави лише раз [?ITA_pressure_government_cd|Y] дн."
 ITA_proclaim_the_italian_empire_tt:0 "Отримає ціль війни §YМаріонетка§! проти §Yкожної несоюзної сусідньої країни в Африці§!:"
 ITA_production_lines:0 "Виробничі лінії"
 ITA_program_for_scientific_cooperation_desc:0 "Італійський проєкт щодо обміну технологіями між учасниками альянсу."
 ITA_proper_carriers:0 "Належні авіаносці"
 ITA_reestablish_old_alliances:0 "Відновити старі альянси"
 ITA_regia_marina_2_dynamic_modifier:0 "$ITA_regia_marina_dynamic_modifier$"
 ITA_russian_government_ideology_alt2:0 "Боротьба з тими, хто нас розділяє"
 ITA_russian_government_ideology_desc_alt2:0 "На жаль, є цілі країни, які наполегливо працюють над тим, щоби нас розділити. Хоча ми не дуже любили Сталіна та його уряд, нинішня ситуація не набагато краща. Такі країни становлять загрозу. Ми не можемо сидіти склавши руки та чекати, поки вони нападуть — ми мусимо завдати удару першими!"
 ITA_sell_obsolete_escort_ships_to_country:0 "Продати застарілі кораблі супроводу державі [FROM.GetNameDef]"
