 HOA_exploit_national_resources_desc:0 "[ROOT.GetNameDefCap] має велику кількість природних ресурсів, які тільки й чекають свого використання. З невеликими інвестиціями ми нарешті могли б почати їх використовувати."
 HOA_lay_claim_to_the_danakil_desc:0 "[ROOT.GetNameDefCap] завжди буде вразливим до морського вторгнення без захисту регіону Данакіль на півночі."
 HOA_military_cooperation_desc:0 "Незважаючи на те, що ми досягаємо великих успіхів у вдосконаленні наших збройних сил, є деякі уроки, які ми можемо винести у наших міжнародних друзів під час спільних навчань і посилення військової співпраці."
 HOA_observe_and_learn_desc:0 "Війна постійно розвивається завдяки природі технологічного прогресу та інноваційного мислення. Щоб підтримувати міцну армію, ми повинні вивчити уроки війни та ніколи не переставати шукати шляхи вдосконалення."
 HOA_promote_local_crafts_desc:0 "[ROOT.GetNameDefCap] має велику кількість кваліфікованих ремісників, які працюють у невеликих масштабах, щоби постачати націю товарами. Ми повинні спиратися на їхній досвід і полегшити їм розширення діяльності та виробництва зазначених товарів."
