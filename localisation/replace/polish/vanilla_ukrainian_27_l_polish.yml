 INS_BLITZKRIEG_DESC:0 "Три роки тому Сутарджо та його колеги-петиціонери звернулися до Гааги з проханням скликати конференцію з питань самоврядування протягом десятиліття. У листопаді минулого року королівський указ повернувся. Відповідь була негативною.\n\nДокір зробив те, чого не змогли зробити роки агітації. У травні вісім найбільших націоналістичних організацій відклали свої суперечки та об'єдналися в єдину федерацію, одностайно закликаючи до створення індонезійського парламенту. Колоніальна адміністрація відповідає, як завжди, але Японія просувається далі на південь через Китай, а Індія знаходиться далеко від Гааги."
 INS_CAS_equipment_1_short:0 "A-17"
 INS_andries_cornelis_dirk_de_graeff:0 "Андріс Корнеліс Дірк де Граефф"
 INS_anti_colonialist_sentiment_idea_desc:0 "В нашій країні активно діють індонезійські революціонери, поширюючи пропаганду серед населення, що призводить до зростання антиколоніальних настроїв."
 INS_chaos_events.1.t:0 "Битва в Сурабаї"
 INS_communist_events.2.t:0 "[FROM.GetNameDefCap] обирає боротьбу"
 INS_communist_events.6.desc:0 "Наші розвідувальні служби підтвердили те, що ми давно підозрювали. [FROM.GetNameDefCap] проводить постійну кампанію підривної діяльності в межах наших кордонів, фінансуючи радикальні осередки, розповсюджуючи крамольні брошури та організовуючи страйки серед робітників. Їхні агенти вкорінилися в профспілках і сільських кооперативах, і тепер відкрито закликають до повалення нашого уряду. Ситуація досягла критичної точки, і ми повинні діяти рішуче, перш ніж вона вийде з-під нашого контролю."
 INS_communist_events.8.t:0 "Пропаганда [FROM.GetAdjective] циркулює в [ROOT.GetName]"
 INS_continue_hybrid_politics:0 "Продовження гібридної політики"
 INS_develop_a_functioning_airforce_desc:0 "Військово-повітряні сили мають великий вплив на армію, ми повинні надати пріоритет їх створенню."
 INS_divert_army_funds_to_navy:0 "Перенаправити армійські кошти на флот"
 INS_enact_militarism_desc:0 "Ми маємо засвоїти кілька уроків від [JAP.GetNameDefCap] та її мілітаристської політики. Прийняття подібних принципів піде на користь нашому новому уряду."
