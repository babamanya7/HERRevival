 ITA_thermojet_research_desc:0 "Наші інженери вірять, що в майбутньому літаки більше не будуть приводитися в рух пропелерами чи поршневими двигунами. Натомість нова технологія зробить літаки набагато швидшими та дозволить створювати докорінно нові конструкції літаків. Італія мусить бути на передньому краї цього розвитку."
 ITA_train_equipment_1:0 "FS Class 685"
 ITA_transport_plane_equipment_3_short:0 "G.212"
 ITA_unite_the_opposition:0 "Об'єднати опозицію"
 ITA_unite_the_opposition_desc:0 "Коріння фашизму в Італії сильне, і для його викорінення знадобляться величезні зусилля. Ми мусимо знайти спільні цілі між різними групами, які виступають проти фашистського режиму, адже тільки об'єднавшися ми зможемо повалити огидного дуче."
 ITA_vallo_alpino_occidentale:0 "Vallo Alpino Occidentale"
 ITA_vallo_alpino_settentrionale_east_tt:0 "Буде збудовано оборонну лінію в областях §Y[850.GetName]§! й §Y[39.GetName]§! вздовж північно-східного альпійського кордону з областю [153.GetName].\n"
 JAP_EQUIPMENT_VERSION_15:0 "Kai O"
 JAP_a_green_persimmon_desc:0 "Наші сили ще не повністю готові до війни з [SOV.GetNameDef], і їхня увага недостатньо відвернута на захід. Попри все це, ми повинні атакувати зараз, інакше шанс може вислизнути від нас назавжди..."
 JAP_a_mongol_volunteer_army:0 "Реформування Монгольської армії незалежності"
 JAP_add_the_imperial_way_modifier_tt:0 "Додає §Y$JAP_the_imperial_way_dm$§!, що дає:\n"
 JAP_ally_the_gorkhas:0 "Союз із гуркхами"
 JAP_anti_militarist_speeches_in_the_diet_tt:0 "Розблоковує рішення для §Yзбільшення підтримки комуністів§! по всій країні"
 JAP_assume_guardianship_over_asian_subject_decison:0 "Взяти опіку над §Y[FROM.GetNameDef]§!"
 JAP_battle_for_australia_desc:0 "Тепер, коли [AST.GetNameDef] ізольовано, настав час розпочати боротьбу за небо над континентом. Якщо нам вдасться встановити контроль над їхнім повітряним простором, то, можливо, окупація Океанії буде не такою вже й нереальною."
 JAP_battleship_1_desc:0 "Лінкори класу «Fuso» були збудовані під час Першої світової війни та модернізовані в 1930-х роках, коли 1-й Лондонський морський договір заборонив будівництво нових лінкорів для країн-підписантів. Вони були добре броньовані та озброєні, а 6 здвоєних башт на центральній лінії надавали їм велику ширину, але також обмежували кількість додаткової артилерійської зброї, яку могли нести ці кораблі."
 JAP_border_incident_forgotten:0 "Вікно можливості"
 JAP_build_hakko_ichiu_landmark_tt:0 "Створює §Y$landmark_hakko_ichiu$§! у регіоні [1018.GetName]"
 JAP_build_the_nishotaki_and_miyanaka_dams:0 "Будівництво гребель Нішьотакі та Міянака"
 JAP_chuichi_nagumo:0 "Чюйчі Нагумо"
 JAP_danchi_idea:0 "Данчі"
 JAP_demand_tonkinese_bases_desc:0 "Регіон Тонкін не тільки багатий на ресурси, але й є життєво важливим плацдармом для нашої подальшої експансії на південь. Перебуваючи на кордоні з Китаєм, він також може слугувати важливою оперативною базою для ударів наших військово-повітряних сил по Кантону."
 JAP_democratic_side_also_spawns_tt:0 "§YДемократичний уряд§! також спробує дати відсіч нашій Революції!"
 JAP_develop_lethal_infantry_equipment:0 "Розробити смертоносне піхотне спорядження"
 JAP_dp_light_battery:0 "10cm/65 Type 98 DP"
 JAP_empower_the_thought_police:0 "Посилення Поліції думок"
 JAP_enemy_of_our_enemy_opm:0 "Ворог нашого ворога"
 JAP_establish_the_gunbatsu:0 "Встановити Гунбацу"
 JAP_expand_kawagoe_army_arsenal:0 "Розширити армійський арсенал Кавагое"
 JAP_fix_flawed_naval_designs_desc:0 "Наші проєкти кораблів виявилися перевантаженими зверху, і у нас були випадки їх перекидання, щойно вони залишали гавань. Ми повинні негайно вирішити ці проблеми, щоб наші кораблі могли безпечно виходити в море."
 JAP_focus_on_aircraft_carriers:0 "Зосередитися на авіаносцях"
 JAP_free_asians_from_soviet_opression_desc:0 "Російські більшовики нічим не кращі за капіталістів, які прагнуть контролювати людей і позбавляти їх майбутнього. Ми не можемо стояти осторонь, поки вони продовжують пригнічувати азійців. Настав час діяти!"
 JAP_gain_national_defense_state_remove_total_mob_tt:0 "§RСкасувати§! §Y$tot_economic_mobilisation$§!. Отримати §Y$national_defense_state$§!."
 JAP_greater_east_asian_co_prosperity_sphere_desc:0 "Час західного імперіалізму минув: народи Азії мають згуртуватися під нашим чуйним керівництвом. Азія — для азійців!"
 JAP_greater_emperor_dominant_fascism_DEF:0 "Велика Японська імперія"
 JAP_heisuke_yanagawa:0 "Хейсуке Янагава"
 JAP_imperial_influence_communist_dm:0 "Національний вплив"
 JAP_imperial_influence_dm_desc:0 "Різні фракції в країні змагаються за владу і вплив на [GetImperialInfluenceRulerTitle], продовжуючи традицію олігархів і військових клік, заснованих в епохи Мейджі і Тайшьо."
 JAP_improve_agricultural_output_desc:0 "Промислове виробництво на Тайвані незабаром перевищить сільськогосподарське виробництво на острові. Хоча це приносить користь нашій промисловості, це далеко не ідеально, оскільки сільськогосподарський експорт з Тайваню має велике значення для задоволення потреб нашого населення та постачання нашої армії. Ми повинні негайно виправити це!"
 JAP_industrial_investment_for_chromium_decision:0 "Перемістити промисловість до §Y[FROM.CONTROLLER.GetNameDef]§! в обмін на §Yхром§! з §Y[FROM.GetName]§!"
 JAP_integrate_the_great_empire_of_manchuria:0 "Інтеграція Великої Маньчжурської імперії"
 JAP_issue_the_ten_commandments_for_marriage_desc:0 "Наші чиновники вигадали нове гасло «Плодіться і розмножуйтеся» як частину своєї нової кампанії зі збільшення чисельності [ROOT.GetAdjective]ого населення, зважаючи на нашу відносно низьку кількість жителів порівняно з багатьма нашими супротивниками. Ми повинні підтримати цю ініціативу."
 JAP_jungle_armor_tt:0 "\n§Y$category_all_armor$§!:\n§YДжунглі§!:\n Зміна ефективності атаки: §G+10%§!\n Зміна ефективності захисту: §G+10%§!"
