 GRE_pitsos:0 "«Пітсос»"
 GRE_prepare_against_the_mediterranean_threat_desc:0 "Італійці небезпечні для нас, і їхні амбіції суперечать долі Греції. Чекаючи і вдаючи, що вони не становлять загрози, ми нічого не досягнемо. Ми мусимо діяти, і коли італійці нарешті висадяться на наші береги, спільними зусиллями мільйонів греків ми відтіснимо їх назад у море!"
