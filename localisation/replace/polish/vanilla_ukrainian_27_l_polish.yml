 SOV_dissent_in_the_party_desc:0 "Ми повинні тиснути на Сталіна на кількох фронтах, щоб підірвати його контроль над партією. Один із підходів — опублікувати низку критичних статей та есе в партійних газетах, вимагаючи реформ і вказуючи на помилки в його рішеннях. Хоча Сталіна це дуже занепокоїть, це також поліпшить наше становище серед різних опозиційних груп."
 SOV_embrace_the_black_hundreds_desc:0 "У старі часи, до хаосу революції, були групи людей, які вірили. Вони вірили в сильну Росію, в єдину Росію, в Росію, яка не боятиметься сама себе. Їх називали чорносотенцями. Хоча їхні члени, що залишилися в живих, зараз розкидані по різних країнах, вони все ще вірять. І ми можемо їх знайти і повернути."
