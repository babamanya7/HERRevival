 SPR_deal_with_the_devil_desc:0 "Німці мають багатий досвід боротьби з Радянським Союзом, і хоча ми ніколи не могли б погодитися на формальний союз, можливо, обмін їхніми військовими знаннями міг би дати нам явну перевагу в наших власних військових зусиллях проти нашого спільного ворога."
