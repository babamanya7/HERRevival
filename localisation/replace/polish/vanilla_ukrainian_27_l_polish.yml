 SWE_affordable_housing_desc:0 "У той час як стандарти житла в містах почали покращуватися, надто багато людей все ще живуть у бідності через недосяжну орендну плату. Щоб виправити ситуацію, ми повинні забезпечити кожному доступ до доступного житла."
