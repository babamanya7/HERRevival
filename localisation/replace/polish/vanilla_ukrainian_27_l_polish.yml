 SUBDOCTRINE_INFILTRATION_TACTICS_DESC:0 "Замість того, щоб бити ворожі лінії в їхніх найсильніших точках, ми обійдемо їх, як вода, зберігаючи наступальний імпульс та змушуючи ворога відступати під загрозою оточення."
 SUBDOCTRINE_THEATER_INTERDICTION_DESC:0 "Звільнений від ризику влучання в дружні війська, наш бомбардувальний флот може безперешкодно діяти в тилових районах ворога, сіючи хаос та опосередковано допомагаючи бойовим фронтам."
