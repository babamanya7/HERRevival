 GER_integrate_czech_manufacturers_desc:0 "Промисловість, розташована в Богемії, є золотою жилою виробничого досвіду та промислових ресурсів для нашої економіки. Додаткова промислова потужність, яку додадуть богемські виробники, стане величезним стимулом для нашої військової промисловості. Цілком логічно інтегрувати їх у наші виробничі лінії."
