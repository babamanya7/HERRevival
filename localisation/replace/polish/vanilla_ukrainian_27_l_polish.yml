 PAR_Jose_Felix_Estigarribia:0 "Хосе Фелікс Естігаррібія"
 PAR_aftermath_of_the_coup:0 "Наслідки громадянської війни"
 PAR_emergency_powers_desc:0 "Хиткий стан країни всередині та ззовні вимагає сильного лідера, щоб утримати нас разом. Це можливо лише тоді, якщо цей лідер отримає повноваження діяти швидко та рішуче."
 PAR_soliders_for_prisoners_desc:0 "У нашій армії бракує чоловіків після громадянської війни, що залишило нашу країну вразливою. З [BOL.GetName], що чекає слушного моменту, щоб повернути Чако, нам потрібен різкий приплив чоловіків як запобіжний захід. Ми помилуємо в'язнів, якщо вони погодяться приєднатися до армії та посилити наші сили, доки не буде набрана належна армія."
 PEACE_CONFERENCE_REJECTED:0 "Держава $COUNTRY$ відхилила договір"
 PEACE_CONFERENCE_RIGHTCLICK_GOTO_STATE:0 "§GКлацніть ПКМ§!, щоби перейти до області."
 PEACE_DEMILITARIZED_ZONE:0 "й ця область стане демілітаризованою зоною"
 PEACE_ONLY_MAIN_COUNTRY_LEADER_CAN_ACT:0 "§HВи не є головою основної держави і не можете виконувати дії на мирній конференції.§!"
 PEACE_PUPPETED:0 "Маріонетка"
 PEACE_TAKER_TAB_BENEFICIARIES:0 "Бенефіціари"
 PEACE_WAR_SCORE_REDISTRIBUTION_TO_HUMANS:0 "Передано гравцям"
 PER_ali_dashti:0 "Алі Дашті"
 PER_appease_the_seperatists_tt:0 "§GМи більше не будемо ризикувати спалахом війни за незалежність проти нас.§!"
 PER_arthur_millspaugh:0 "Артур Міллспо"
 PER_assessing_the_opposition:0 "Оцінка опозиції"
 PER_assessing_the_opposition_desc:0 "Перш ніж ми зможемо навіть розглянути можливість розширення наших кордонів за межі Ірану, ми повинні спочатку подивитися всередину. Кілька опозиційних партій, здається, з часом стають дедалі більш розчарованими нашим урядом. Якщо ми хочемо згуртувати підтримку народу для відбудови імперії, ми повинні забезпечити повну підтримку в уряді, будь-якими необхідними засобами."
 PER_brown_shirts_desc:0 "Багато членів нашої партії нещодавно прийняли коричневі сорочки уніформи європейських фашистських рухів. Можливо, ми повинні спрямувати цих відданих членів на організацію масових маршів, щоб заручитися підтримкою руху."
 PER_communist_destabilize_iraq:0 "Дестабілізувати Північний Ірак"
 PER_communist_destabilize_iraq_tt:0 "Відмикає рішення §Y$PER_gulf_decisions_cat$§! для сприяння курдському повстанню."
 PER_communist_events.11.t:0 "[FROM.GetNameDefCap] просить військові технології"
 PER_communist_events.8.desc:0 "Різким загостренням кризи в Затоці, [FROM.GetNameDef] виконав свої погрози та розпочав блокування цивільного судноплавства та авіації в цьому районі. Крім того, розвідка свідчить про те, що їхні військові підвищили свою боєготовність в очікуванні конфлікту з нашими силами."
 PER_communist_industrialization_idea:0 "Швидка індустріалізація"
 PER_communist_shore_defense:0 "Ініціатива берегової оборони"
 PER_demand_afghan_territory_desc:0 "[AFG.GetNameDefCap] — це земля звивистих гір та річок, і, таким чином, її буде складно завоювати в майбутньому. Якщо ми зможемо створити плацдарм у країні, це буде чудовим відправним пунктом для просування до Кабула."
 PER_develop_cities_desc:0 "На даний момент столиця Тегеран є найбільш розвиненим містом у [ROOT.GetNonIdeologyName]. Якщо ми справді хочемо прийняти модернізацію в нашій країні, ми повинні зосередити наші зусилля на розширенні інфраструктури наших великих міст."
 PER_economy_proved:0 "Доведено економічну надійність"
 PER_entice_foreign_investment_desc:0 "Наша економіка має величезний потенціал для зростання завдяки великій кількості природних ресурсів та зростаючому міському населенню, яке шукає роботу. Однак нам потрібні більші інвестиції з-за кордону, щоб започаткувати це зростання."
 PER_exclude_religion_desc:0 "Іслам та релігія в цілому стали перешкодою для модернізації нашої нації як політично, так і економічно. Ми повинні чітко заявити, що такі перешкоди будуть подолані в новому [ROOT.GetNonIdeologyName]."
 PER_expand_military_facilities:0 "Розширити військові об'єкти"
 PER_form_oil_company_desc:0 "Надто довго наші нафтові родовища видобувалися та контролювалися зовнішніми колоніальними державами. З нашим новим запасом та майбутнім, вільним від іноземного впливу, настав час нам створити Національну [PER.GetAdjective] нафтову компанію."
 PER_great_iranian_empire_ADJ:0 "Іранськ"
 PER_hassan_majid_firooz:0 "Hassan Majid Firooz"
 PER_idea_comintern_research_collaboration:0 "[ROOT.GetFactionName] Співпраця в галузі досліджень"
 PER_imperial_events.141.desc:0 "Як і очікувалося, [FROM.getLeader] відмовив у проханні про офіційну незалежність від [ROOT.GetLeader]. Оскільки це був очікуваний поворот подій, [ROOT.GetAdjective] збройні сили вже забезпечують ключові позиції в країні. Нація цього разу набагато краще підготовлена."
 PER_imperial_events.180.desc:0 "Сьогодні вранці ми отримали повідомлення від [PER.GetAdjective] уряду з пропозицією припинити воєнні дії та натомість дозволити, щоб нами правили як маріонеткою під нашим наглядом. Це принесе швидке завершення війни та дозволить нам зосередитися на наших більших цілях."
 PER_imperial_events.192.t:0 "[FROM.GetNameDefCap] відмовляється від наших умов"
 PER_imperial_events.80.a:0 "У нас є більші проблеми в іншому місці. Вивести наші війська."
 PER_industrial_events.1.desc:0 "[PER.GetAdjective] уряд звернувся до нас сьогодні з пропозицією прав на ресурси на їхню нещодавно придбану нафту в $STATE_413$. Територія, про яку йдеться, багата на цей критично важливий ресурс. Можливо, варто розглянути цю пропозицію?"
 PER_industrial_events.1.t:0 "[FROM.GetNameDefCap] пропонує права на ресурси"
 PER_invasion_of_india_desc:0 "Наші плани вторгнення в [RAJ.GetNameDef] мають потенціал стати однією з наших найбільших цілей, але серед наших військ немає сумнівів, що це буде небезпечна операція. Погрожуючи Індії, ми накличемо на себе гнів [ENG.GetAdjective]. Якщо це не має значення, то давайте розпочнемо вторгнення в Індію."
 PER_iranian_radio_idea_desc:0 "Наша національна система радіомовлення сприятиме просуванню державної думки з питань, щодо яких громадськість не повністю згодна."
 PER_iranian_revolutionary_vanguard_desc:0 "Щоб відстояти свою позицію проти наддержав, набагато сильніших за нас, ми повинні почати розширювати наші військові сили та мобілізувати населення. Хоча це не поставить нас на рівні з цими загрозами, це зробить нас більш ніж «лежачим поліцейським» на їхньому шляху."
 PER_iranian_socialist_revolution_desc:0 "Настав момент для робітничого класу Ірану повстати та розгромити немічний шахський режим та його буржуазних посіпак. На його місці постане нова держава робітників та селян, керована самим народом."
 PER_islamic_revolution_events.2.t:0 "Ісламські революціонери активізуються"
 PER_mohammad_mosaddegh:0 "Мохаммад Мосаддег"
 PER_nasser_moghaddam_operative:0 "Насер Могаддам"
 PER_offers_oil_flag:0 "Запропоновано [PER.GetAdjective] нафту"
 PER_oil_and_rubber_industry:0 "Диверсифікувати промисловість"
 PER_oil_baron:0 "Оголосити себе нафтовим бароном"
 PER_paying_for_baluchistan_idea_desc:0 "На жаль, [RAJ.GetNameDef] не бажав віддати цю територію безкоштовно. Нам доведеться виплачувати борг протягом року."
 PER_perfect_iranian_airforce_desc:0 "З усіма ресурсами та часом, які ми вклали у розвиток наших повітряних можливостей, настав час прагнути до самої вершини та оголосити себе одними з найефективніших повітряних сил у світі. Ніщо не може перевершити майстерність та талант наших пілотів, ані досконалість наших літаків."
 PER_pilot_training:0 "Програма підготовки пілотів"
 PER_promote_resistance_in_gulf_states:0 "Сприяти опору в [FROM.GetName]"
 PER_provisional_government:0 "Тимчасовий уряд"
 PER_push_negotiations_desc:0 "Наразі ми змогли відбивати вторгнення, наскільки могли. Однак ми не в змозі наполягати на прямому завершенні конфлікту. Проте ми маємо важелі впливу, щоб потенційно запропонувати частину наших природних ресурсів, щоб зберегти наш суверенітет."
 PER_reach_to_seperatists_tt:0 "Усі області у власності, які є ключовими для §YКурдистану§! або §YАзербайджану§!, приєднаються до нас та нададуть війська у майбутній громадянській війні. \n\n§RОднак вони очікуватимуть отримати незалежність як компенсацію протягом двох років після завершення цього фокусу!§!"
 PER_recruit_bakhtiari:0 "Набрати гірських фахівців Бахтіарі"
 PER_reparations_tt:0 "Надішле нашим ворогам §Yподію§!, що вимагає §Yмиру§! та §Yвійськових репарацій§! у вигляді §Yфабрик§! та §Yштрафу§! для агресора. Якщо ворожа країна є §Yбезпосереднім сусідом§!, то вона натомість поступиться прикордонною територією §Yнам§!."
 PER_secularized_state_idea_desc:0 "За правління династії Пехлеві було постановлено, що для того, щоб стати на рівні з іншими великими націями світу, [PER.GetNameDef] необхідно модернізуватися. Це включає відокремлення релігії від держави. Люди все ще можуть сповідувати іслам, однак він більше не матиме впливу на політику нашої нації."
 PER_sohrab_tahmasebi:0 "Сограб Тегмасебі"
 PER_special_units_boost:0 "Програма спеціальних підрозділів"
 PER_ssb_events.5.a:0 "Чудово!"
 PER_sumka_party:0 "НСРПІ"
 PER_support_kurds_in_iraq:0 "Підтримати курдів у [FROM.OWNER.GetName]"
 PER_take_regional_tour_desc:0 "Після формування нашої нової Імперії Реза-шах Пехлеві бажає здійснити тур регіоном, відвідавши як [IRQ.GetNameDef], так і [AFG.GetNameDef], щоб покращити свої стосунки з лідерами цих двох націй."
 PER_the_peoples_navy_desc:0 "Хоча ми не можемо сподіватися кинути виклик надводним флотам імперських держав, ми можемо зробити це, розробивши спеціально створений клас підводних човнів."
 PER_trial_fifty_three_idea:0 "Суд над п’ятдесятьма трьома"
 PER_white_revolution:0 "Розпочати Білу революцію"
 PHI_TreatyOfManilaToBeSigned:0 "\n\nТому було санкціоновано переговори щодо підписання Манільського договору, і взаємно узгоджена незалежність [PHI.GetNameDef], схоже, є неминучою."
 PHI_anti_hacendados:0 "Проти асьєндадо"
 PHI_army_air_corps:0 "Армійський авіаційний корпус"
 PHI_assassination_of_quezon_desc:0 "Прикра правда полягає в тому, що «президент» Кесон занадто довго стримував розвиток Філіппін. Ця американська болонка зробила все можливе, щоб національна воля філіппінського народу не була реалізована. Інституції, які він вибудував навколо себе, зробили його невразливим до демократичних змін, тому тепер ми повинні просувати політику іншими засобами."
