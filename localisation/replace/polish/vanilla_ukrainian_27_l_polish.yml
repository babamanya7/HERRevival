 DEN_securing_norway_ns:0 "Забезпечення контролю над [NOR.GetNameDef]"
 DEN_seek_independence_desc:0 "Незалежність Данії більше не є гарантією, незважаючи на те, що ми співпрацюємо з [?DEN.DEN_overlord_nation.GetNameDef]. Ми повинні захистити нашу свободу, чинячи опір окупаційним силам, і завдати удару, коли настане час."
 DEN_support_the_faroes_industries_desc:0 "У непевні часи, в яких ми опинилися, може виявитися розумним підтримати ті кілька галузей промисловості, які існують на Фарерських островах, що зробить наші права на стратегічно важливий архіпелаг беззаперечними."
 DEN_territory_for_protection_desc:0 "Програма переозброєння йде за планом, але у військових все ще є сумніви, що цього буде достатньо. Ми могли б продати частину наших територій, щоб отримати більш конкретні гарантії захисту, ніж просто пакт про ненапад. Така угода могла б навіть піти на користь нашій економіці."
