 CHI_fighter_equipment_0_short:0 "Type 3"
 CHI_focus_on_the_Tianlong_project_desc:0 "Реактивна тяга — це майбутнє повітряної війни. Проєкт «Тяньлун» стоїть в авангарді цієї еволюції."
 CHI_fund_the_plan_domestically_desc:0 "Якщо й можна щось винести з минулого століття, так це те, що довіряти іноземному капіталу небезпечно. Якщо ми хочемо розбудовувати промисловість нашої країни, покладатися на іноземців, а не на наші місцеві банки та інвесторів, було б серйозною помилкою та небезпечною перспективою. Ми повинні знайти внутрішні джерела фінансування, щоб не ризикувати потрапити в залежність."
