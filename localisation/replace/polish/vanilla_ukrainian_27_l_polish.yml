 SWI_the_national_front_desc:0 "Національний фронт є провідною фашистською партією в [ROOT.GetNonIdeologyName], якщо хтось і збирається взяти владу в цій демократично орієнтованій країні, то це вони. Деякі високопоставлені члени вже мають тісні зв'язки з [GER.GetNameDef], що може призвести до свого роду захисту від них, якщо або коли почнеться війна."
