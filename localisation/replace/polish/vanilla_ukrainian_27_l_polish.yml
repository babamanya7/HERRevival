 ARG_political_events.101.desc:0 "[FROM.GetNameDefCap] люб'язно вирішила прийняти нашу пропозицію приєднатися до нашого альянсу, і тепер ми стоїмо разом як бастіон миру та демократії в Південній Америці."
 ARG_political_events.11.a:0 "Готуватися захищати [ARG.GetName] від цих повстанців!"
 ARG_political_events.11.desc:0 "Ми отримали повідомлення, що наші вищі військові офіцери відокремилися від уряду та згуртували своїх прихильників у спробі взяти під контроль [ARG.GetAdjective] політику. Ми не можемо дозволити їм дістатися Буенос-Айреса. Настав час готуватися до [ARG.GetAdjective] громадянської війни."
 ARG_political_events.17.a:0 "Відступити, це того не варте..."
 ARG_political_events.21.t:0 "[URG.GetNameDefCap] відмовляється від умов ультиматуму"
 ARG_political_events.35.t:0 "[ENG.GetNameDefCap] пропонує поступитися островами"
 ARG_political_events.41.t:0 "Родольфо Гйольді повертається до [ARG.GetNameDef]"
 ARG_political_events.70.b:0 "Антоніо Сото — набагато кращий вибір."
 ARG_socialist_unification_idea_desc:0 "Завдяки силі нашої славної революції ми нарешті змогли утвердитися як панівна ідеалогія на Південноамериканському континенті. Ця війна, виграна кров'ю і доблестю, наповнила наш народ бажанням створити велику батьківщину для Південноамериканських соціалістичних республік."
