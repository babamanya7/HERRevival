 GER_rekindle_imperial_sentiment_desc:0 "Хоча війна розколола Австро-Угорщину, серед населення залишилося чимало тих, хто сумує за старою імперією. Ми підтримаємо прихильників імперії, сподіваючись, що це підштовхне роздроблені держави до об'єднання."
