 DEN_overthrow_the_government_desc:0 "Нашою країною надто довго керували жадібні люди, які дбали лише про себе, ігноруючи всі небезпеки, що загрожують данському народу. Настав час встановити новий порядок і розпочати нову еру для держави [DEN.GetNameDef]!"
 DEN_prioritize_army_desc:0 "Основою будь-якого війська є армія. Якщо ми спрямуємо наші ресурси на підготовку солдатів і виробництво військової техніки, ми будемо більш ніж готові протистояти будь-кому, хто наважиться загрожувати [DEN.GetNameDef]."
