 PHI_gunboat_diplomacy_desc:0 "Ми острівна нація, і тому повинні мати військово-морські можливості, щоб вселяти страх у серця тих, хто виступає проти наших інтересів. А якщо вони нас ще не бояться, то злякаються, коли філіппінський флот з'явиться в їхньому головному порту і візьме під контроль судноплавство."
