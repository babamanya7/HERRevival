 ENG_war_with_italy_desc:0 "Італійці відмовляються відмовитися від своїх планів щодо нової імперії і продемонстрували готовність розпочати війну, щоб розширити свої кордони. Ми мусимо зробити все можливе, щоб усунути цю загрозу, поки не стало занадто пізно."
