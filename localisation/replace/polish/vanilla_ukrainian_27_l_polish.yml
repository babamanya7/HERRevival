 GRE_completely_debt_free:0 "Ми повністю §Yпозбулись боргів§!."
 GRE_debt_to_the_ifc_desc:0 "Греція багато заборгувала у Міжнародної фінансової комісії — колись впливової організації, в якій тепер головами є лише Сполучене Королівство, Франція й Італія. Незважаючи на роздутість МФК, пов'язані з нею країни досі чекають, щоб Греція виплатила їм борги в повному об'ємі. Це означає, що поки ми не виплатимо борги або не спишемо їх якимось чином, МФК буде на нас тиснути."
 GRE_dem_monarchy_fascism_DEF:0 "Грецький національний союз"
 GRE_destroyer_2_desc:0 "The Vasilefs Georgios I class was a class of two modified British H-class destroyers built in the U.K. for the Hellenic Navy in the late 1930s. The ships displaced 1,350 tons and had decent speed. They had long range, were armed with four 128mm/42 SK C/34 guns, and had a strong torpedo complement."
 GRE_fascists_put_in_play_tt:0 "§YФракція фашистів§! стає активною та на початку буде §Gдружньою§! до уряду.\nСпівпрацюючи з §Yфашистами§!, ми легітимізуємо їхній рух."
