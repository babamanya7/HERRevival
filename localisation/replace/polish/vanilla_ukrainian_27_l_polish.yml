 INSHOL_import_sugar_desc:0 "Ми запровадимо контроль цін у зростаючому сільськогосподарському секторі Ост-Індії, щоб імпортувати весь цукор країни з плантацій Ост-Індії за цінами, з якими жоден інший уряд не зможе зрівнятися, і встановимо державну монополію на цукор."
