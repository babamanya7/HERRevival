 LEADER_HAS_INITIATIVE:0 "§HІніціатива!§!\nЦя сторона наразі має ініціативу через вищу величину розвідки її дивізій або вищий рівень навичок їхнього командувача.\nЦе означає, що вони отримують додатковий шанс підібрати тактику, яка відіб'є тактику іншої сторони на момент вибору."
