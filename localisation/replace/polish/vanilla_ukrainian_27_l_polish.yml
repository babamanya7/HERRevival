 ROM_the_royal_foundation_desc:0 "Король люб'язно погодився створити фонд свого імені для вивчення румунської культури та створення науки про націю."
 ROM_trade_treaty_with_germany_desc:0 "Ми знаємо про економічний інтерес Німеччини в нашій державі. Організація збільшення поставок товарів, таких як нафта, дозволить нам просити німецької допомоги в модернізації нашої армії."
 RULE_ALLOW_COUPS_AI_ONLY_DESC:0 "Держави можуть готувати та влаштовувати перевороти лише проти держав, керованих ШІ."
 RULE_BOOST_PARTY_BLOCKED_TT:0 "Правило гри: §R$RULE_ALLOW_PARTY_BOOSTING_BLOCKED_DESC$§!"
 RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC:0 "ШІ намагатиметься зберегти демократичний уряд і досягти повного суверенітету, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_DEMOCRATIC_BRA_AI_DESC:0 "Бразилія намагатиметься повалити Варгаса, закінчивши надзвичайний стан. Тоді вона намагатиметься реформувати державу, збільшуючи демократичну участь, перш ніж урешті-решт налагодить співробітництво зі США супротив країнам Осі."
 RULE_FASCIST_NZL_AI_DESC:0 "ШІ намагатиметься перейти у фашизм і вступити в союз із Японією, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC:0 "§HТуреччина§! призначить Февзі Чакмака на посаду президента, що слідує Мустафи Кемаля Ататюрка, і буде зберігати нейтралітет якомога довше, перш ніж намагатися приєднатися до Осі або Союзників."
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI:0 "Fascist Stephensen"
 RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC:0 "Угорський ШІ намагатиметься відновити Австро-угорську імперію, рухаючися відповідною гілкою дерева національних фокусів, обравши своїм правителем Отто фон Габсбурга, якщо той доступний."
 RULE_OPTION_ETH_INDEPENDENT_FASCIST:0 "Фашизм: незалежність"
 RULE_OPTION_INDEPENDENCE_FAS_MAN_AI_DESC:0 "Маньчжурський ШІ спробує здобути незалежність і захопити весь Китай і Зовнішню Маньчжурію, рухаючись відповідною гілкою дерева національних фокусів."
 RULE_OPTION_MONARCHIST_SIA_AI_DESC:0 "ШІ піде монархістським шляхом."
 RULE_OPTION_NORDICS_FRAGMENTED:0 "Нордика роздроблена"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC:0 "ШІ почне тиснути на короля Гокона VII, щоб він розпустив Стортінг і перетворив Норвегію на олігархічну монархію."
