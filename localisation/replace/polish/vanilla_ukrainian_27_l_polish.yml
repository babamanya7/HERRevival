 SWE_liquidate_the_monarchy_desc:0 "Настав час розпустити паразитичний інститут монархії в [SWE.GetName] раз і назавжди. У королівської сім'ї та ширшої аристократії будуть позбавлені титулів, а їхні багатства перерозподілені між людьми."
