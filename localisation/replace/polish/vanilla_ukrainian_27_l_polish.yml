 HOL_form_the_benelux_desc:0 "Нам, малим націям Західної Європи, століттями стиснутим між сильними силами Британії, Франції, а тепер і Німеччини, досить конфліктів, які розривають наш континент. Сполучені Штати Європи могли б одного дня запобігти таким катастрофам, як Велика війна, але, утворивши нещільний союз із нашими південними сусідами, ми можемо створити ядро такої організації вже сьогодні."
