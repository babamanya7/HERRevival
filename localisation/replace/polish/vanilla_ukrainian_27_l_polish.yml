 siam.1.t:0 "[SIA_phraya_phahon.GetName] замішаний у скандалі"
 siam.12.desc:0 "Наша кампанія проведена успішно. Опір ворога зломлено, і [FROM.GetName] офіційно відмовилася від контролю над спірними землями, щоб уникнути подальших руйнувань. Ця перемога підвищує наш авторитет і забезпечує наші кордони — принаймні на деякий час."
 siam.16.desc:0 "Наш наступ зупинився, це не проблема, проблема в тому, що ворог це знає. Вони надіслали нам ультиматум: або здатися зараз із мінімальними втратами, або продовжити війну з ще більшим кровопролиттям. Різниця лише в кількості загиблих, яких доведеться ховати."
 siam.28.a:0 "Хай живе король."
 siam.33.desc:0 "Продаж компанії Bangkok Dock завершено, і кошти тепер у скарбниці. Уряд має вирішити, куди найкраще спрямувати ці гроші — чи то на зменшення фінансового тягаря для звичайних громадян, чи на прискорення технічних амбіцій нації, чи на зміцнення впевненості у майбутньому країни."
 siam.6.b:0 "Це обернулося проти нас. Давайте відступимо."
 siam_adc.3.a:0 "Яким буде їхнє майбутнє?"
