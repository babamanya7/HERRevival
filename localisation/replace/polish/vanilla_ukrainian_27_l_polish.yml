 fortify_strait_of_hormuz_tooltip:0 "Кожна провінція в §YМусандам§! та §YФарс§!, що контролює протоку §YОрмуз§!, має 1-й рівень §Yберегового форту§!, 1-й рівень §Yсухопутного форту§! і зайнята однією дивізією."
 france.12.a:0 "До Лондона!"
 france.12.t:0 "Британія погоджується на злиття"
 france.24.d:0 "Загроза, яку представляють об'єднана Німеччина та Радянський Союз, занадто велика, щоб її ігнорувати. Після угоди двох країн про розподіл Польщі перед нами стоїть важкий вибір. Якщо ми дозволимо партії [Root.GetCommunistParty] діяти так, як вони діяли досі, ми відкриємося для внутрішньої боротьби, оскільки сила Радянського Союзу зростає з кожним днем. Заборонивши будь-яку комуністичну діяльність або приналежність до партії [Root.GetCommunistParty], ми надішлемо потужний сигнал усім громадянам, що ми не терпимо нікого, хто становить загрозу миру. \nТрадиційно нам вдалося залучати партію [Root.GetCommunistParty] до політичних дискусій, але оскільки вони відмовляються залишити свої прихильності Москві, можливо, настав час ужити радикальних заходів."
 fuel_line_grid_entry_3:0 "Споживання флотом"
 fuel_refining3_desc:0 "Нові технології регенерації дозволяють нам виробляти пальне з побічних продуктів технічних процесів."
 generic.2.d.c:0 "[alliance_applicant.GetNameDefCap] визнає, що вона повинна об'єднатися з іншими соціалістичними республіками, щоби зміцнити місце комунізму у світі. Прийнявши нашу провідну роль у міжнародному становищі робітників, [alliance_applicant.GetAdjective]а держава тепер просить офіційно укласти з нами союз."
 generic.2.d.e:0 "Оскільки нинішні потрясіння в міжнародній політиці продовжують лунати у світі, [alliance_applicant.GetAdjective]а влада вважає нас своїм найбільшим шансом пережити ці буремні часи. Тому вони просять прийняти їх до нашого союзу, щоби ми разом витримали майбутній шторм."
 generic.3.e:0 "Ми відкладемо наші відмінності, поки що."
 generic.4.a:0 "І вони звуть себе захисниками свободи?"
