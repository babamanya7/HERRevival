 INS_negotiate_new_contracts_desc:0 "Наша репутація надійного постачальника, що постійно зростає, відкрила двері, які раніше були зачинені для нас. Нові покупці кружляють навколо, і ми повинні діяти швидко, щоб залучити їх до довгострокових угод, перш ніж наші конкуренти зможуть перехопити ініціативу."
 INS_netherlands_most_precious_jewel_tt:0 "£GFX_trigger_no Може підвищити автономію до рівня: Вільна"
 INS_oil_export_desc:0 "Ми покращимо нафтову інфраструктуру на Суматрі та Калімантані, щоб забезпечити торговельні угоди з нашими новими торговельними партнерами."
