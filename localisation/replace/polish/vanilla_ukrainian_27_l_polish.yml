 TUR_abolish_etatism_desc:0 "Політика етатизму була великим досягненням кемалістської системи та плідним експериментом, але, на жаль, заради вищого блага з цим експериментом треба покінчити назавжди."
 TUR_athenian_balkan_academy_desc:0 "Місце, де найкращі уми Південної Європи збираються працювати на благо Балкан і всього людства."
 TUR_battleship_1:0 "Клас «Reşadiye»"
 TUR_britain_backs_turkey_tt:0 "\n§Y[TUR.GetNameDef]§! отримає нашу підтримку, оскільки вони мають повноваження регулювати прохід кораблів крізь §YТурецькі протоки§!. \n\n§RМи зможемо відмовити їм у підтримці, якщо §Y[TUR.GetNameDef]§! і §Y[SOV.GetNameDef]§! почнуть готуватися до війни.§!"
 TUR_central_balkan_bank:0 "Балканський центральний банк"
 TUR_cgt_organization:0 "$cgt$"
 TUR_connecting_our_capitals_desc:0 "Щоб полегшити пересування від фронту до фронту, необхідно прокласти по всьому Балканському півострові ефективну інфраструктуру. Ми будемо працювати спільно з партнерами та зробимо все, щоби наші столиці були з'єднані сучасними дорогами та шляхами сполучення."
 TUR_create_the_balkan_central_bank_desc:0 "Ми перейдемо на нову валюту, яка ходитиме в наших країнах нарівні з національними, та організуємо новий центральний банк, через який зможемо проводити всі платежі та угоди. Що може піти не так?"
 TUR_debt_council_has_no_sway_tt:0 "§YБоргова рада§! не має впливу на [ROOT.GetAdjective]і економічні справи."
 TUR_etatism_2:0 "$TUR_etatism$"
 TUR_etatism_4:0 "$TUR_etatism$"
 TUR_extend_an_olive_branch_to_bulgaria_desc:0 "Балканський пакт був сформований, щоб протистояти болгарському реваншизму, але відтоді світ породив значно небезпечніших чудовиськ. Болгарія, як і ми, — лише черговий пішак імперіалістів у боротьбі за імперіалістичну перевагу. Ми мусимо простягнути їй руку допомоги, об'єднати сили, щоби зміцнити як наші кордони, так і наш бойовий дух."
 TUR_fatherland_first_desc:0 "У турецькому суспільстві багато тих, хто заважає роботі уряду та дестабілізує ситуацію у своїх егоїстичних інтересах. Час з цим закінчувати. Відтепер кожен громадянин Туреччини шануватиме Вітчизну перш за все!"
 TUR_fortify_the_north_tt:0 "Додати оборонну лінію з §Yназемних укріплень§! в області §Y[354.GetName]§!.\n"
 TUR_hazi_aslanov:0 "Хазі Асланов"
 TUR_heavy_fighter_equipment_3:0 "TamTAS Eşekarısı"
 TUR_increase_german_military_aid:0 "Збільшити німецьку військову допомогу"
 TUR_issue_an_ultimatium_to_the_bulgarians_desc:0 "Ну чи не підла ця нація [BUL.GetNameDef]? Щоразу вони порушують рівновагу на Балканах лише для того, щоби потішити свій іредентистський егоїзм. Ми підкоримо їх, і [BUL.GetAdjective]і робітники будуть вільні — хоча, по правді кажучи, вони цього не дуже заслуговують."
 TUR_kemalist_socialist_theory_desc:0 "Рух «Kadro» дотримується вкрай патріотичної форми соціалізму, багато в чому схожій на британської різновидом фашизму і марксизму-ленінізму. По суті, Кадро виводить перше місце за значимістю турецького робітника, не намагаючись у своїй позбавити його національної ідентичності. Наш рух справді революційний, і, що ще важливіше, це по-справжньому турецький рух."
