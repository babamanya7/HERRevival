 LAT_dievs_keepers_desc:0 "Добрі латвійські язичники гуртуються навколо нашої справи і стають все більш і більш войовничими, починаючи вважати Целміньша кимось на кшталт релігійного лідера. Більш консервативні католики в нашій адміністрації побоюються ми ж хочемо отримати користь, поставивши цих захоплених молодих людей під рушницю."
 LAT_events.502.d:0 "[Root.GetAdjective] прохання про головну роль в окупації Остланду не було задоволено державою [From.GetNameDef]. Спроба отримати контроль над остландською окупацією була розцінена ось яким чином: [Root.GetLeader] намагається прибрати до рук основні заселені території Сходу та підірвати вплив держави [From.GetNameDef]."
 LAT_events.6.d_both:0 "Держава [From.GetNameDefCap] сьогодні запропонувала запросити в альянс [Root.GetFactionName] усі країни Балтії. Відзначивши приголомшливий успіх націоналізму в державах [LIT.GetNameDef] та [EST.GetNameDef], а також їх у народженні прагнення до загальнобалтійської співпраці, [From.GetLeader] гаряче пропонує [Root.GetAdjective] уряду розглянути нових союзників націоналізму, якими мають стати [LIT.GetLeader] та [EST.GetLeader]."
 LAT_events.6.d_lithuania:0 "Держава [From.GetNameDefCap] сьогодні запропонувала запросити в альянс [Root.GetFactionName] країну [LIT.GetNonIdeologyName]. Відзначивши приголомшливий успіх націоналізму в державі [LIT.GetNameDef], а також співпраці, [From.GetLeader] гаряче пропонує [Root.GetAdjective] уряду розглянути нового союзника націоналізму, яким має стати [LIT.GetLeader]."
 LAT_free_the_ugonskrusts:0 "Звільнити «Вогняний хрест»"
 LAT_ignite_civil_war_in_target_desc:0 "Пропаганда може досягти дуже багато, іноді потрібні прямі дії, щоби принести державі силу та стабільність. Ми зробили все можливе, тепер залишаємо партію [From.Owner.GetFascistParty] напризволяще."
