 SEA_generic_events.6.b:0 "Ми дистанціюємося від цієї схеми"
 SEA_generic_events.6.t:0 "Викрито урядову схему підриву [GetOppositionPartyName]"
 SEA_imperial_influence_demand_event_option_9:0 "Рішучість точить камінь"
 SEA_imperial_influence_events.130.t:0 "Фракція Армії бажає змін у законі про призов"
 SEA_imperial_influence_events.310.t:0 "Фракція Дзайбацу прагне розширити нашу промислову базу"
 SEA_imperial_influence_events.340.t:0 "Фракція Дзайбацу вимагає найняти промислову компанію"
 SEA_japan_air_accidents_events.01.a:0 "Нищівний удар..."
 SEA_japan_foreign_policy.104.a:0 "Ми вдячні за їхню наївність"
 SEA_japan_foreign_policy.109.b:0 "Перемога або смерть!"
 SEA_japan_foreign_policy.113.a:0 "Ми будемо охороняти Тихий океан для них"
 SEA_japan_foreign_policy.131.a:0 "За пролетаріат!"
 SEA_japan_foreign_policy.133.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прийняв наші вимоги і підкорився нашій владі, привівши [FROM.GetAdjective]у державу в нашу сферу впливу. Ми святкуємо перемогу в цей день, оскільки [FROM.GetAdjective]ий народ тепер звільнено від буржуазної диктатури!"
 SEA_japan_foreign_policy.137.t:0 "Merging with [MAN.GetNameDef]"
 SEA_japan_foreign_policy.22.a:0 "Вони не заподіють нам шкоди, нехай залишаються"
 SEA_japan_foreign_policy.35.t:0 "[FROM.GetNameDefCap] поширює про-[FROM.GetAdjective]і настрої"
 SEA_japan_foreign_policy.38.a:0 "Вони знають, що доля приготувала для них"
 SEA_japan_foreign_policy.4.b:0 "Це суперечило б нашим принципам нейтралітету!"
 SEA_japan_foreign_policy.45.a:0 "Це надто гарна пропозиція, щоб від неї відмовлятися"
 SEA_japan_foreign_policy.47.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відреагував на наше запрошення до інтеграції з сильним невдоволенням і стверджує, що будь-яке тісніше економічне партнерство між нашими країнами не обговорюється і ніколи не буде обговорюватися. Можливо, вони могли передбачити, що ми для них готували..."
 SEA_japan_foreign_policy.48.a:0 "Процвітання вже близько!"
 SEA_japan_foreign_policy.54.desc:0 "Віднедавна, схоже, зброя, що належить [FROM.GetNameDef], наповнює наші чорні ринки, і значна її частина потрапляє до дисидентів та підривних елементів у межах наших кордонів. Схоже, вони або просто прагнуть дестабілізувати нас, або, що ще гірше, повалити наш уряд!"
 SEA_japan_foreign_policy.67.desc:0 "[JAP.GetLeader] проголосив створення нової [ROOT.GetAdjective]ої держави, яка протистоїть нам і нашому поточному курсу. Схоже, вони готові боротися за свою незалежність від нас і не здадуться без бою!"
 SEA_japan_foreign_policy.74.t:0 "[FROM.GetNameDefCap] шукає нашого захисту"
 SEA_japan_foreign_policy.76.desc:0 "[FROM.GetLeader] оголосив, що через надзвичайний стан, запроваджений після перевороту Кодоха, та можливість переховування незгодних офіцерів у підконтрольних нам регіонах, ми повинні стати інтегрованою частиною нації. Це, в свою чергу, дозволить [FROM.GetAdjective]ій державі здійснювати повне управління. Чи погоджуємося ми?"
 SEA_japan_foreign_policy.83.a:0 "Відмінно!"
 SEA_japan_foreign_policy.92.desc:0 "Дипломати, що належать до [FROM.GetNameDef], звернулися до нас щодо зміцнення наших зв'язків — процесу, який стримувався військовими фракціями в їхній країні, але з цим тепер покінчено. Вони бажають торговельних, наукових та оборонних угод. Ми можемо або підписати одну з них, або прийняти всі. Здається, не найкраща ідея повністю відштовхувати їх після всіх зусиль, яких вони доклали, щоб дійти до цього етапу."
 SEA_japan_foreign_policy.95.desc:0 "Милостивий лідер [FROM.GetNameDef], [FROM.GetLeader], прийняв одну з наших пропозицій, погодившись укласти оборонний пакт з нашою нацією, згідно з яким ми обидва обіцяємо прийти на допомогу іншому в разі нападу. Це великий день для [ROOT.GetNameDef] та її дипломатичних досягнень!"
 SEA_japan_foreign_policy.97.t:0 "[FROM.GetNameDefCap] просить про торговельні угоди"
 SEA_japan_popup_events.1.t:0 "Генріх Люшков прибуває до Маньчжурії"
 SEA_japan_popup_events.12.a:0 "Нація сумує"
 SEA_japan_popup_events.13.desc:0 "Завдяки нещодавнім розслідуванням, проведеним поліцією Токіо за наказом Нагако, дружини покійного імператора Шьова, було виявлено, що фракція Кодоха справді несе відповідальність за холоднокровне вбивство колишнього Імператора. Маючи більш ніж достатньо підстав оголосити це державною зрадою, настав час усунути цю зрадницьку кліку від влади."
 SEA_japan_popup_events.32.t:0 "Лідер для Роно-ха"
 SEA_japan_popup_events.35.t:0 "[FROM.GetLeader] хоче надати владу династії Лі"
 SEA_japan_popup_events.38.t:0 "Громадянська війна в [ROOT.GetNameDef]"
 SEA_japan_popup_events.40.b:0 "Азійська країна не становитиме для нас загрози, все гаразд"
 SEA_japan_tokko_arrest_events.1.t:0 "Інцидент з Народним фронтом"
 SEA_japan_tokko_arrest_events.6.a:0 "Як він сміє погано говорити про нашого прем'єр-міністра? Заарештувати його!"
 SEA_warlords.38.t:0 "Кліка Гуансі капітулює"
 SEA_warlords.66.a:0 "Великий день!"
 SEA_warlords.66.desc:0 "[FROM.GetLeader] погодився на наше прохання, і Памірький регіон передається нам саме в момент отримання цього повідомлення. Відтепер держава буде управлятися нами, автономно від прямого правління [FROM.Genetive]."
