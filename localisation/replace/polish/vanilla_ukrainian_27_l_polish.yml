 SIA_breaking_the_burmese_line_desc:0 "Бірма стоїть як бар'єр між нашими амбіціями і землями за нею. Якщо зброя [ROOT.GetAdjective] має довести свою цінність, ворожа лінія там повинна бути прорвана рішучістю, плануванням і зосередженим використанням сили."
 SIA_focus_on_commercial_civilian_ships_desc:0 "Не кожен закладений кіль повинен призначатися для бою. Торгові судна, транспортні кораблі та інші цивільні судна формують кровоносну систему національної економіки. Стимулюючи комерційне суднобудування, [ROOT.GetNameDef] зміцнює як процвітання, так і стійкість у воєнний час."
 SIA_fortress_hanoi:0 "Фортеця Ханой"
 SIA_heavy_tank_equipment_3:0 "M26 Pershing"
 SIA_increase_military_approval_tt:0 "Збільшує схвалення крила §YВійськових§! на §GНевелику величину§!"
 SIA_light_cruiser_3:0 "Клас «Taskin»"
 SIA_light_cruiser_3_desc:0 "The Taskin class consisted of a pair of light cruisers built in Italy. They were launched in 1941 but were requisitioned by the Siamese navy in 1942. They were to become the Etna-class Italian AA cruisers of the Regia Marina but were never completed before the Italian armistice. They would have displaced 5,900 tons and been armed with six 152mm/53 OTO 1929 guns in their main armament. They would have had decent armor but would be fairly slow for a cruiser."
 SIA_luang_sinthusongkhramchai:0 "Luang Sinthusongkhramchai"
 SIA_modern_tank_equipment_1:0 "M46 Patton"
 SIA_police_general:0 "Генерал поліції"
 SIA_prajadhipok_audience_with_churchill_desc:0 "Присутність Прачадіпока в [ENG.GetName] пропонує більше, ніж просто престиж. Якщо він зможе переконати [ENG.GetLeader], що повстання лоялістів служить британським інтересам в Азії, тоді зброя з Малайї все ще може потрапити до рук людей, відданих трону."
 SIA_rambai_barni:0 "Рамбаї Барні"
 SIA_recover_indochina_tt:0 "Відкриває можливість почати обмежені війни проти §YІндокитайських§! територій"
 SIA_release_contigency_funds_tt2:0 "протягом §Y[?var:SIA_contingency_funds]§! місяців. По завершенні фонди зникнуть. Чим довше ми збираємо кошти в мирний час, тим довше фонд діятиме у воєнний час."
 SIA_royal_thai_ordnance_factory:0 "Королівський тайський збройовий завод"
 SIA_ship_torpedo_3:0 "5x 533-мм торпедний апарат"
 SIA_thai_soldiers_blood:0 "Кров тайських солдатів"
 SIA_the_iron_handed:0 "Із залізною рукою"
 SIA_the_khana_ratsadon_tt:0 "\n§YКхана Ратсадон§! стає активною.\n\n§YКхана Ратсадон§! є провідною партією в [ROOT.GetName], яка поділяється на §YВійськове крило§! та §YЦивільне крило§!.\n\n§YЦивільне крило§! загалом підтримує продемократичну політику з акцентом на цивільну промисловість, тоді як §YВійськове крило§! загалом підтримує профашистську політику та мілітаризацію промисловості.\n\nНаші рішення змусять їх ставитися до нас краще або гірше, даючи різні бонуси або штрафи.\nЯкщо вони стануть бунтівними, то можуть спробувати влаштувати переворот.\n\nРізні стани схвалення: §YБунтівний§!, §YВ опозиції§!, §YНейтральний§!, §YНезначна підтримка§! та §YПовна підтримка§!"
 SIA_the_siamese_armada_desc:0 "Сучасна [SIA.GetName] потребує сучасного флоту. З новими кораблями, підготовленими екіпажами та розширеною військово-морською інфраструктурою, армада [SIA.GetAdjective] стане силою, здатною захищати наші береги і проектувати силу за їхні межі."
 SIA_the_songsuradet_rebellion:0 "Повстання Сонгсурадета"
 SIA_unlock_character_as_advisor_tt:0 "§Y$CHARACTER$§! стає доступним як радник."
 SIA_yield_the_air_war:0 "Поступки в повітряній війні"
 SIC_anti_communism:0 "Антикомунізм"
 SIC_armor_efforts_desc:0 "Бронетанкові та військово-повітряні сили, які ми маємо, занадто малі для сучасного конфлікту. Ми повинні прагнути покращити наші технології, щоб протистояти іноземним загрозам."
