 SPA_equipment_shipments_desc:0 "Війська — не єдине, що нам потрібно для забезпечення нашої перемоги. Наші прихильники за кордоном повинні зрозуміти нашу гостру потребу в обладнанні та те, як вони можуть допомогти нам у цій справі."
 SPA_establish_catalunya_carlist_cell:0 "Створити осередок карлістів у Каталонії"
 SPA_establish_ciudad_real_carlist_cell:0 "Створити осередок карлістів у Сьюдад-Реалі"
 SPA_foment_a_carlist_split_desc:0 "Карлісти внутрішньо настільки ж розділені, як і сам націоналістичний фронт. Протиставляючи різних лідерів карлістів один проти одного, ми можемо послабити їхню владу, що відкриває нам шлях для укладення окремих угод з різними групами карлістів."
 SPA_generic_communist_revolutionary:0 "Хосе Діас Рамос"
 SPA_improve_cross_country_railways_desc:0 "Розширення нашої національної залізничної мережі не лише забезпечить вкрай необхідні робочі місця, але й полегшить пересування військ, постачання та стане предметом національної гордості для всіх іспанців."
 SPA_invest_in_naval_infrastructure_desc:0 "Іспанії потрібні нові військово-морські підприємства для підтримки розширення нашого флоту."
 SPA_juan_vigon_suero_diaz:0 "Хуан Вігон Сеуро-Діас"
 SPA_light_cruiser_1_desc:0 "The Méndez Núñes-class light cruisers were a pair of cruisers built within Spain for the Spanish Navy in the early 1920s. The ships were ordered in 1915 but materials shortages during World War I delayed construction. The design was heavily influenced by the British C-class cruisers. The cruisers displaced nearly 4,800 tons but was relatively slow. Its main armament consisted of six 152mm/50 Vickers Mk V guns. It also had good armor and a dozen 533mm torpedo tubes."
