 PRC_raiding_parties:0 "Рейдові загони"
 PRC_return_manchuria_communist_desc:0 "Японські імперіалісти відібрали Маньчжурію у її законних власників — вільного народу Китаю. Тепер, коли наші товариші в Японії вигнали гнобителів, ми повинні просити повернути це людям."
