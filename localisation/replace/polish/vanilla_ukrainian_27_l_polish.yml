 scientist_trait_armored_specialist_desc:0 "Досвідчений інженер, що спеціалізується на проєктуванні та вдосконаленні танків та іншої броньованої техніки."
 scientist_trait_helicopter_expert_desc:0 "Піонер у галузі гвинтокрилих літальних апаратів, спеціалізувався на механіці вертикального польоту, гвинтових системах і ранніх моделях вертольотів."
 scientist_trait_nuclear_power_expert_desc:0 "Провідний фахівець у галузі ядерної фізики, знавець ядерного розщеплення з акцентом на виробництво електроенергії."
 scientist_trait_resourceful_desc:0 "Завжди знаходить творчі рішення, навіть коли ресурси обмежені або ситуація складна."
 scope_YUN_GetNameDef:0 "[scope_YUN.GetNameDefCap]"
 scout_plane1_desc:0 "Збір даних про пересування військ і флоту супротивника — важливе завдання авіації з часів її першого бойового застосування у Великій війні та понині."
