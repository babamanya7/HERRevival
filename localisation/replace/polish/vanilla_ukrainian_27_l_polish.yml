 ARG_GATHERING_STORM_DESC:0 "У 1930 році уряд Іполіто Ірігоєна було повалено в результаті першого військового перевороту з часу прийняття Конституції Аргентини, що розпочало так звану «Безславну декаду». Аргентина мусить орієнтуватися у стрімко мінливому світі, де великі держави загрожують крихкому миру, який тримається з часів закінчення Великої війни.\n\nЯка загроза є більш помітною? Буря, що насувається на Європу? Їхні власні сусіди? Чи вони самі? Аргентині доведеться стояти на своєму та закріпити своє місце на світовій арені."
 ARG_a_red_south_america_desc:0 "Нарешті нам вдалося поставити Південну Америку під один комуністичний прапор. Коли червона хвиля охоплює континент, пригноблені робочі класи можуть нарешті бути вільними жити більш самодостатнім життям під нашим керівництвом. Однак, навіщо нам зупинятися на цьому? Настав час запровадити операцію «Ocaso Escarlata» та принести остаточний червоний захід сонця кожному, хто виступає проти глобальної революції."
 ARG_alberto_teisaire:0 "Альберто Тейсайре"
 ARG_align_with_the_soviets:0 "Приєднатися до Рад"
 ARG_anti_soviet_idea_desc:0 "Загроза комунізму та небезпека, яку він становить для нашої нації, є надто важливою, щоб її ігнорувати. [SOV.GetNameDefCap] продовжує проявляти себе як сила, здатна зруйнувати наш спосіб життя, яким ми його знаємо. Люди бояться червоної загрози, і це правильно!"
 ARG_argentine_nationalism:0 "Аргентинський націоналізм"
 ARG_balancing_act_decisions:0 "Балансування"
 ARG_construction_guilds_idea:0 "Аргентинські будівельні гільдії"
 ARG_demand_spanish_compensation_desc:0 "Наші іспанські брати успішно повернули владу, яка по праву належала їм. Тепер, можливо, ми повинні нагадати їм, що ми зіграли свою роль у їхньому успіху, і що настав час платити!"
 ARG_democratic_faction:0 "Альянс Монро"
 ARG_destroyer_1_desc:0 "The Catamarca-class destroyers were ordered by the Argentine Navy and built by the U.K. shortly before World War I. They were armed with four 120mm/50 cal main guns and four 533mm torpedo tubes."
 ARG_economic_tax_reforms_desc:0 "Наша сільська інфраструктура надто нерозвинена. Якби ми прийняли деякі реформи нашої поточної податкової політики, ми змогли б більше наголошувати на розбудові наших нерозвинених сільськогосподарських угідь."
 ARG_eliminate_american_imperialism_desc:0 "Гігант на півночі довгий час був бастіоном корпоративної жадібності та корупції. Оскільки ми тепер самі стали наддержавою, це лише питання часу, коли капіталістичні пси Вашингтона вирішать, що ми є загрозою, яку потрібно усунути. Ми не можемо дозволити цьому статися. Настав час запровадити операцію «Ocaso Escarlata» та принести остаточний червоний захід сонця [USA.GetNameDef]."
 ARG_eliminate_american_imperialism_idea:0 "Операція «Багряні сутінки»"
 ARG_empower_the_fjc:0 "Розширити можливості ФМК"
