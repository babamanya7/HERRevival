 BEL_collapsing_government_ns_desc:0 "Звинувачення у корупції потрясли уряд настільки, що щурі втікають з т sinking корабля. Практично щодня відбуваються відставки, і ясно, що цей кабінет не має довгого терміну."
 BEL_defensive_reorganization_desc:0 "Ми зробили все, що могли для підготовки до вторгнення, залишилось лише визначити більше стратегічних та високорівневих доктринальних змін, спрямованих на найбільш сучасні принципи оборонної думки."
