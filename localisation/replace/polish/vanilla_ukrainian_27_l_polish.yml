 raid_type_ENG_operation_jericho_desc:0 "За інформацією французького опору, Німеччина утримує в Ам'єні велику кількість бійців опору. Відправивши ескадрилью літаків, щоби пробити отвір у стінах в'язниці, ми зможемо звільнити велику кількість цих бійців опору."
