 DOD_hungary.110.a:0 "Відмінна пропозиція, товариші!"
 DOD_hungary.116.b:0 "Ми ніколи не погодимося на такі умови!"
 DOD_hungary.130.desc:0 "Незважаючи на перші успіхи, схоже, уряд, яким керує [From.GetLeader], змінив свою думку незадовго перед підписанням договору. Вони не пояснили причин, які змусили їх передумати, але, як вважає наша розвідка, приводом стала неготовність їх збройних сил."
 DOD_hungary.164.desc:0 "У [From.GetAdjective] ВПС проходять випробування нових середніх бомбардувальників. За даними нашого військово-повітряного аташе, наша новітня модель має здобути гору. Ми чекаємо на офіційний запит від [From.GetAdjective] уряду. \n\nКерівництво заводу-виробника повністю схвалює угоду, але продаж новітньої військової техніки іноземній державі може завдати шкоди нашій національній безпеці. Чи варто нам дозволити продаж цих літаків?"
 DOD_hungary.165.t:0 "Конкурс на бомбардувальники завершено"
 DOD_hungary.32.a:0 "Добре, ми виконаємо їхнє бажання."
 DOD_hungary.42.a:0 "Як ми й очікували."
 DOD_hungary.43.a:0 "Якщо [HUN.GetAdjective]ий народ хоче війни, ми її забезпечимо."
 DOD_hungary.52.desc:0 "Сьогодні вранці [HUN.GetLeader] і [ROM.GetAdjective]ий посол провели зустріч. Посол позначив позицію своєї країни якомога яскравіше, додавши «як завжди» до безапеляційної відмови обговорювати навіть думку про передачу спірних територій. Знов і знов [ROM.GetAdjective]а влада публічно відкидає наші претензії, часом насміхаючись з них. Довгий час ми були слабкими і не могли їм відповісти.\n\nАле тепер все буде інакше."
 DOD_hungary.68.c:0 "Трансільванія залишиться у складі Румунії."
 DOD_hungary.84.t:0 "[From.GetName] відмовляється"
 DOD_romania.111.t:0 "[GER.GetLeader] погоджується"
 DOD_romania.114.t:0 "Німецький ультиматум"
 DOD_romania.20.b:0 "Це лише послабить наші війська."
 DOD_romania.32.a:0 "Це справді турбує."
 DOD_romania.42.t:0 "[From.GetNameDefCap] пручається"
 DOD_romania.52.desc:0 "У відповідь на нашу недавню вимогу внести зміни в роботу угорського уряду [HUN.GetLeader] запропонував нам укласти договір про дружбу та взаємодопомогу. Він зобов'яже їх стати на наш бік у разі війни, але також містить умову, що забороняє нам втручатися у внутрішні справи Угорщини."
 DOD_romania.71.a:0 "Ми не блефуємо."
 DOD_yugoslavia.3.desc:0 "Відразу після того, як уряд принца Павле підписав Троїстий пакт, ряд офіцерів [YUG.GetAdjective] ВПС організували ретельно спланований переворот, скинувши законно обраний уряд і посадивши на престол неповнолітнього Петара II.\n\nНизка колишніх членів уряду засудили переворот і оголосили в країні надзвичайний стан. Оскільки це явно робота іноземних агентів, вони стверджують, що ми зобов'язані надати допомогу."
 DOD_yugoslavia.33.desc:0 "Через лічені години після того, як німецькі війська увійшли до Праги, а [CZE.GetAdjective] посол вимовив прощальну промову, посол держави [GER.GetNameDef] був викликаний до міністерства закордонних справ. \n\nЗа його словами, німецький уряд глибоко жалкує про те, що йому довелося вжити таких рішучих заходів щодо держави [CZE.GetNameDef], але [GER.GetLeader] радий, що [YUG.GetLeader] не дав йому приводу вчинити аналогічно з Югославією.\n\nПосол висловив надію на те, що цей стан справ збережеться і надалі."
