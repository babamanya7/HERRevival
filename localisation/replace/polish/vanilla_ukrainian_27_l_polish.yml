l_polish:
 1037_chongqing_points:0 "([?1037.state_political_support_value|+0]) "
 44DescIsPuppet:0 "нам контроль над державою [FROM.FROM.OWNER.GetNameDef] негайно"
 592_guangzhou_points:0 "([?592.state_political_support_value|+0]) "
 AAT_Sweden.15.desc:0 "Держава [FROM.GetNameDef] відхилила нашу пропозицію щодо демілітаризованої зони навколо Нарвіка. Нам треба вирішити, як реагувати: або наполягати на створенні такої зони на благо наших нордичних братів, або залишити їх у темряві."
 AAT_Sweden.43.desc:0 "[FROM.GetName] вимагає від нас демілітаризації нашого північного кордону. Вони занепокоєні загрозами для своїх гірничодобувних підприємств, водночас підкреслюючи, що будь-яка мислима загроза прийде зі Сходу, а не з Заходу. Це знизило би напруженість у відносинах між державою [FROM.GetName] й нами, яка зростає з часів Оландської кризи."
 AAT_Sweden.9.t:0 "Тютюновий контрабандист змінює своє життя"
 AAT_Sweden_ball_bearing.1.t:0 "Установлення умов торгівлі кульковими вальницями з державою [FROM.FROM.GetName]"
 AAT_Sweden_flashpoints.43.desc:0 "Держава [SWE.GetName] надала нам повне право проходу військ їхньою країною. Це не лише допомагає нашим операціям у Скандинавії, але й посилює наш вплив на державу [SWE.GetName] та не дає їм легко приєднатися до наших ворогів."
 AAT_Sweden_flashpoints.52.desc:0 "Наше рішення залучити армію для підтримки поліції під час арештів радикальних лівих спричинило спіраль насильства, яка загрожує занурити країну в громадянську війну. Зіткнення між робітниками та поліцією призвели до загибелі та поранень. Радикали, яких нам не вдалося заарештувати, підбурюють робітників проти нас і закликають до повного розпуску уряду. Крім того, ми бачили, що декотрі солдати відмовляються виконувати накази і навіть повністю дезертирують з армії. Це, можливо, найгірша ситуація, в якій опинилася держава за останні сто років."
 AAT_Sweden_flashpoints.72.a:0 "Це акт війни. Вони мусять віддати їх або постати перед наслідками."
 AAT_Sweden_flashpoints.72.desc:0 "Під час стоянки в [ENG.GetAdjective]ому порту наші чотири нові кораблі були викрадені їхнім флотом. Схоже, вони використовують право «стоянки» як привід для викрадення. Ми мусимо діяти обережно, якщо хочемо повернути кораблі, не спричинивши війну."
 AAT_Sweden_nationalists.13.desc:0 "Провідні промисловці очікують на рекордні прибутки та дивіденди в найближчі роки після заборони профспілок. Вони подолають бюрократичну тяганину, яку соціал-демократи створювали протягом останніх років, і, нарешті, прискорити економічне зростання."
 AAT_Sweden_nationalists.29.t:0 "$AAT_Sweden_nationalists.22.t$"
 AAT_Sweden_nordic_defense_council.3.t:0 "[FROM.GetName] не бажає долучатись до Нордичного оборонного союзу"
 AAT_USA_events.08.b:0 "Ми не поступимося гнобителям!"
 AAT_finland_continuation_war.11.b:0 "Розпочати операцію “Північне сяйво”"
 AAT_finland_diplomacy.02.desc:0 "Наші урочисті дипломати повернулися з відрядження до міста [FROM.capital.GetCapitalVictoryPointName] з новинами: [FROM.GetName] погоджується з необхідністю об'єднатися проти спільних ворогів і приймає нашу пропозицію союзу. Урядовці вже вирушають до нашої столиці, щоб почати плавну інтеграцію нових територій."
 AAT_finland_diplomacy.13.a:0 "Зараз ми не можемо дозволити собі нажити такого ворога, як [FROM.GetLeader]..."
 AAT_finland_diplomacy.24.desc:0 "[FROM.GetAdjective]ий уряд погодився на наше прохання і пообіцяв захищати нас від [SOV.GetAdjective]ої агресії. Ми нарешті можемо зітхнути з полегшенням."
 AAT_finland_kinship_war.03.desc:0 "Цього ранку пролунали перші постріли, знаменуючи заколот у Східній Карелії, спровокований [FIN.GetAdjective]ими елементами, і напад на державних службовців. Напруженість у регіоні зріла не перший рік, і наші сусіди активно переправляли зброю через кордон, підтримуючи місцевих заколотників. [FIN.GetName] не в захваті від Тартуського договору, підписаного 1920 року, і відтоді підтримує бунтівні фракції у Східній Карелії.\n\nДосі їхнє втручання було обмеженим, але, схоже, [FIN.GetName] починає діяти більш відкрито. Ситуація загострилася ще сильніше, коли [FIN.GetAdjective] війська перейшли кордон, збільшивши масштаби конфлікту і почавши відкриту війну між нашими країнами."
 AAT_finland_kinship_war_rebellion_crushed_fin_tt:0 "§RКарельські бунтівники були придушені, не встигнувши організувати повстання§!"
 AAT_finland_misc_events.02.t:0 "Заборона на танці"
 AAT_finland_political.05.a:0 "$FIN_risto_ryti$ наступний на черзі!"
 AAT_finland_political.07.desc:0 "Зараз, коли самому існуванню держави [ROOT.GetName] загрожує війна, [ROOT.GetLeader] — уже не той лідер, що підходить нам. На посаді лідера потрібен герой [ROOT.GetAdjective]ої війни за свободу, фельдмаршал Карл Густав Маннергейм. Якщо ми хочемо скинути вороже ярмо і врятувати вітчизну, нам не обійтися без його військового досвіду. Маннергейм із запалом взявся за виконання своїх нових обов'язків, заявивши:Ця війна — ніщо інше, як продовження і фінальний акт нашої Війни за незалежність. Ми боремося за свої будинки, свою віру і свою країну."
 AAT_finland_political.08.t:0 "Обов'язки Маннергейма виконані"
 AAT_finland_the_white_death.11.t:0 "Сімо Гяюгя поранений і евакуйований з поля бою"
 AAT_nordic_shared.3.desc:0 "Ми отримали звістку, що [FROM.GetAdjective]ий народ буде захищати незалежність держави [ROOT.GetName], а ми, в свою чергу, будемо захищати їхню. Нордичні країни повинні бути готові відбити будь-яке вторгнення як об'єднана сила, а не як розрізнені маленькі нації."
 AAT_norway.1.d:0 "Його минуле — достатній доказ. Ув'язнити його!"
 AAT_norway.10.desc:0 "Оскільки війна в Європі стає все більш неминучою, [NOR.GetAdjective]ий парламент, або Стортинг, охоплений хвилями хаосу і розбрату. Ознаки того, що кабінет Нюгошволда принесе епоху стабільності, давно забуті, оскільки члени парламенту, схоже, не можуть домовитися про будь-які узгоджені заходи, щоб безпечно провести державу [NOR.GetName] крізь прийдешню бурю.\n\nТим часом вороги народу гострять свої ножі, щоби насолодитися розбратом, що розростається, поки [NOR.GetName] не поглине полум'я війни."
 AAT_norway.15.desc:0 "Незважаючи на всі наші зусилля, Відкун Квіслінг розпочав спробу захопити владу в Осло. За підтримки фашистів, що вторглися в країну, він транслює проголошення нового уряду, який налаштований на співпрацю з нашими ворогами.\n\nНеможливо це виправити, ми програвали і раніше, і цей переворот лише погіршить наші військові зусилля."
 AAT_norway_allied.1.a:0 "Немає шкоди в допомозі майбутньому союзникові."
 AAT_norway_allied.1.desc:0 "[NOR.GetAdjectiveCap]ий уряд хоче розвивати свою промисловість з нашою допомогою. Це була б чудова можливість для отримання прибутку, а для нас — перетворення їх на можливого союзника в майбутньому, якщо, звісно, почнеться війна."
 AAT_norway_communist.1.a:0 "Баренцове море вируватиме від судноплавства!"
 AAT_norway_communist.4.a:0 "Їхню зброю буде застосовано проти наших ворогів!"
 AAT_norway_news.1.a:0 "Цікаво..."
 AAT_norway_news.1.desc:0 "Після років виснажливого заслання відомий революціонер Лев Троцький прибув до Мексики з Норвегії. Його прийняли відома художниця Фріда Кало та її чоловік Дієго Рівера, які поселили його у своєму будинку в Мехіко, що, безсумнівно, чудово підійде Троцькому та його дружині.\n\nЩе важливіше те, що він буде далеко від будь-якої небезпеки з боку ворогів у державі [SOV.GetNameDef], і, можливо, насолоджуватиметься тихим вигнанням у латиноамериканській країні."
 AAT_norway_rikstanken.4.desc:0 "[FROM.GetAdjectiveCap]ий уряд хоче купити наші танки для своєї першої вилазки у танкову війну.\n\nЦе було б добре для нашої економіки та збройової промисловості, але ми повинні спочатку подумати про наш власний запас танків і про те, чи можемо ми довірити їм бронетанкові війська."
 ABDA_events.5.t:0 "Запрошення приєднатися до ABDACOM"
 ABDA_ship_a_day_modifier_tt:0 "Змінює §Y$ABDA_supreme_command$§! на:\n §G+10%§! Атака підводних човнів\n §G+10%§! Захист підводних човнів"
 ABK_communism_party_long:0 "Комуністична партія Абхазії"
 ABK_democratic:0 "Абхазія"
 ACCESSIBLE_NAVAL_BASES:0 "§HПраво на стоянку§!"
 ACE_PILOT_ELIGIBLE_TYPES:0 "Можна призначити до авіакрил типів: "
 ACHIEVEMENTS_DISABLED_MODIFIED_GAME:0 "§YHoI4 запущена з модами або змінена якимось іншим шляхом. Досягнення вимкнені.§!"
 ACHIEVEMENTS_VIEW_LOCKED:0 "§RДосягнення недоступні§!"
 AFG_axis_equipment:0 "Обладнання Осі"
 AFG_defending_democracy:0 "Захист нації"
 AFG_defending_democracy_desc:0 "Хоча ми й захистили уряд від внутрішніх загроз, завжди будуть загрози за межами наших кордонів. Ми повинні зробити все можливе, щоб наша економіка була здатна підтримувати наші збройні сили, якщо війна дійде до нас."
 AFG_electrification_desc:0 "Інновації в промисловості, зв'язку та війні все більше залежать від електроенергії. Тому ми повинні забезпечити, щоб наша нація могла скористатися новими досягненнями, розширюючи електрифікацію по всій [ROOT.GetNonIdeologyName]."
 AFG_establish_camelry_regiments_desc:0 "Верблюди — витривалі тварини, і щоб наша армія могла функціонувати навіть у пустелях та горах, ми повинні адаптуватися. За допомогою верблюдів ми зможемо битися незалежно від місцевості та в районах, де вороги, можливо, не зможуть."
 AFG_fortify_pakistan_desc:0 "Вкрай важливо захистити наші нещодавно розширені кордони. Створення низки укріплень та оборонних позицій забезпечить стабільність та безпеку нашої території. Крім того, це дасть нам сильну позицію для проектування нашої військової могутності, якщо в цьому районі виникне конфлікт."
 AFG_industrial_events.20.b:0 "[FROM.GetNonIdeologyName] не враховується в наших довгострокових планах"
 AFG_industrial_events.32.t:0 "[FROM.GetAdjectiveCap]ий уряд пропонує договір про воду"
 AFG_industrial_events.53.a:0 "Чудово"
 AFG_influential_spiritual_leader_trait:0 "Впливовий духовний лідер"
 AFG_integrate_the_basmachi_movement_desc:0 "До 1934 року Басмачі боролися проти [SOV.GetAdjective] сил за визволення Центральної Азії від їхнього тиранічного правління. Хоча їхній рух з того часу був значною мірою придушений, деяким їхнім лідерам вдалося втекти. Ми повинні спробувати налагодити контакт із цими борцями за свободу та запросити їх до нашого двору."
 AFG_islamic_republic_idea:0 "Ісламська демократія"
 AFG_maintain_quami:0 "Зберегти куамі"
 AFG_mechanized_equipment_1_short:0 "Bren Carrier"
 AFG_modern_economy_desc:0 "Ми нарешті скинули кайдани наших застарілих економічних практик, які стримували наш народ протягом століть. Тепер ми можемо справді стати поруч з іншими індустріалізованими націями світу."
 AFG_mohammad_zahir_shah_ns:0 "Король Захір-шах"
 AFG_mountain_training_2_desc:0 "Після успіху нашої ініціативи з гірської підготовки стало очевидним, що ми повинні продовжувати створювати спеціалізовані бойові підрозділи для такої місцевості."
 AFG_new_army:0 "Постійна армія"
 AFG_oil_concession_here_flag:0 "Нафта контролюється іноземною державою"
 AFG_pashtunistan_ascendancy_neutrality:0 "Пуштунський халіфат"
 AFG_political_events.112.desc:0 "[FROM.GetNameDefCap] відмовився передати штати, які ми у них просили. Схоже, нам доведеться знайти альтернативні засоби для повернення нашої законної території в майбутньому."
 AFG_political_events.130.a:0 "Ми підтримуємо цю ініціативу."
 AFG_political_events.131.a:0 "Чудово!"
 AFG_political_events.155.t:0 "[FROM.GetNameDefCap] погоджується підтримати нас"
 AFG_political_events.30.desc:0 "Після років політичних реформ та компромісів між різними фракціями по всій нашій нації, ми тепер маємо можливість скинути кайдани монархізму раз і назавжди. Однак ми повинні переосмислити, хто ми є як нація."
 AFG_political_events.72.b:0 "Нам не погрожуватимуть, щоб змусити піти на територіальні поступки."
 AFG_political_events.80.desc:0 "Рішучим кроком для утвердження домінування в ісламському світі, [FROM.GetNameDef] висунула ультиматум. Вони вимагають, щоб ми приєдналися до їхнього альянсу, що розширюється, спрямованого на об'єднання та зміцнення ісламських націй під [FROM.GetAdjective] керівництвом. Невиконання цієї вимоги, очевидно, призведе до повномасштабного вторгнення."
 AFG_political_events.82.a:0 "Тоді вони будуть знищені."
 AFG_political_events.85.b:0 "Ми не будемо втягуватися у [FROM.GetAdjective] політику."
 AFG_political_events.87.a:0 "Це займе час, але ми досягнемо наших цілей самі."
 AFG_prepare_the_war_industries_desc:0 "Нашій нинішній промисловості бракує потенціалу для військового виробництва. Щоб запобігти перевантаженню з боку сусідніх країн, ми повинні переорієнтувати наші фабрики на підтримку наших військових, замість того, щоб задовольняти потреби керівної еліти. Цей перехід є вирішальним для нашого виживання."
 AFG_propose_confederation_with_pakistan:0 "Запропонувати конфедерацію з Пакистаном"
 AFG_protector_of_the_tajiks:0 "Захисник таджиків"
 AFG_protector_of_the_tajiks_desc:0 "Напруга часто виникала між більшістю пуштунів та значним населенням таджиків на півночі. Однак у нас є можливість завоювати їхню прихильність, звільнивши таджиків за межами наших кордонів від деспотичного правління [742.OWNER.GetLeader]."
 AFG_provisional_government_trait:0 "Тимчасовий уряд"
 AFG_rapprochement_with_non_pashtuns_desc:0 "Надто довго непуштуни нашої нації були відсунуті на узбіччя політики. Це не лише призвело до обурення проти центрального уряду, але й до його повного повалення у 1929 році. Тому ми повинні забезпечити, щоб у новій демократичній системі весь наш народ почувався представленим та почутим."
 AFG_republic_idea:0 "Нова республіка"
 AFG_return_of_the_emir_desc:0 "Плани розроблені, контакти налагоджені, а зброя розподілена. Залишилося лише повернутися королю до Афганістану, і наше розрізнене повстання розпочне повалення нелегітимного режиму короля Захіра."
 AFG_scavenging:0 "Тактика збору трофеїв"
 AFG_seek_american_aid_desc:0 "Американці тиснуть на нас, щоб ми не приєднувалися до держав Осі, і готові інвестувати значні кошти в нашу країну, щоб запобігти нашому зближенню з їхніми супротивниками."
 AFG_sikh_volunteers_idea:0 "Сікхські добровольці"
 AFG_the_faqirs_revolt_desc:0 "Нарешті настав час. Війська Факіра готові повстати на сході, щоб протистояти корумпованим чиновникам у Кабулі та повернути ісламські традиції, на які колись спиралася наша нація. Іншалла, ми врятуємо Афганістан!"
 AFG_work_with_ger_intel_bonus:0 "Техніка придушення партизанів"
 AIRBASE_DISTANCE_PENALTY_DETAIL:0 "Нестача дальності для повного покриття зони: $PERC|%1=+$"
