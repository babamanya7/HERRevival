 advanced_torpedoes_focus_desc:0 "Завдяки тому, що ми стали використовувати стиснений кисень замість стисненого повітря у пропульсивних системах наших торпед, вони збільшили дальність дії; крім того, тепер вони зможуть нести більший боєзаряд."
