 POL_non_discriminatory_recruitment_desc:0 "Польські католики непропорційно переважають у наших збройних силах через політику Санації. Рухаючись вперед, ми дамо місце кожному патріоту чи соціалісту, який бажає, повернути зброю проти фашизму."
