 naval_minelaying_research:0 "Minelaying Research"
 naval_strike_torpedo_tactics_oi:0 "$naval_strike_torpedo_tactics$"
 navy_chief_naval_gunnery_designer_3:0 "Конструктор корабельних гармат\n(геній)"
 navy_screen_defence_factor_tt:0 " $MODIFIER_NAVY_SCREEN_DEFENCE_FACTOR$: $RIGHT|+=%1$"
 nazism:0 "Нацизм"
 nazism_desc:0 "Коріння нацизму — крайній націоналізм та ідеї про перевагу германської нації. Нацисти закликають до агресивного розширення кордонів та до побудови тоталітарної держави, всі громадяни якої об'єднані під керівництвом фюрера — лідера з абсолютною владою."
 neighbor:0 "Сусід"
 nepotism_naval_academy_spirit:0 "Непотизм"
 news.106.a:0 "Чи це кінець Радянського Союзу?"
 news.117.d:0 "Сінгапур, «Гібралтар Сходу», був захоплений японськими імперськими військами, незважаючи на те, що англійці, які володіли ним раніше, вважали місто неприступним.\n\nЯпонська військова адміністрація Сінгапура зробила своєю штаб-квартирою Фуллертон-білдинг, а місто було перейменовано в Сенанто, що приблизно можна перекласти як «Південний острів, отриманий в еру Шьова». Патрулі Кемпейтай заполонили вулиці, демонструючи, що японці прийшли сюди всерйоз і надовго."
 news.117.t:0 "Падіння Сінгапура"
 news.120.d:0 "Закріпившись на північноамериканському материку, японські війська кинулися до Лос-Анджелеса і змусили тікати захисників міста. Довга процесія імперських військ пройшла маршем Центральною авеню сьогодні у другій половині дня. Ця подія була задокументована японськими кінохронікерами.\n\nДо відступу американських військ відчайдушні бої йшли в кількох районах міста. Голлівуду завдано особливо великої шкоди; багато японських офіцерів фотографувалися навпроти знаменитого напису, понівеченого стріляниною."
 news.168.g:0 "Ми вдячні."
 news.175.c:0 "Об'єднуються, як щури, загнані в кут."
 news.176.a:0 "Їм варто було просити краще."
 news.178.a:0 "Франція йде за нами в майбутнє!"
 news.178.b:0 "Очевидна ознака французької слабкості."
 news.178.e:0 "Тривожний розвиток подій."
 news.179.t:0 "Праві стають популярнішими у Франції"
 news.184.t:0 "Італія налагоджує тісніші відносини з Німеччиною"
 news.186.b:0 "Обурливі претензії!"
 news.190.b:0 "Італія посилює контроль над Середземним морем."
 news.201.c:0 "[From.GetNameDefCap] couldn't resist the strength of the [GER.GetFactionName]."
 news.204.e:0 "Це серйозна проблема."
 news.210.e:0 "Схоже, що між Китаєм і Японією настане своєрідний мир"
 news.211.b:0 "Це цікавий розвиток подій."
 news.214.a:0 "Нова сила в Східній Європі."
 news.230.b:0 "Га? Це не ми."
 news.253.e:0 "Це матиме великі наслідки для Тихоокеанського регіону."
 news.26.a:0 "Це ж було вже!"
 news.281.c:0 "$news.280.c$"
 news.284.desc:0 "\nБританські державні службовці прокинулися сьогодні вранці від грубого шоку, коли надійшли результати нещодавніх виборів у провінції. Тепер зрозуміло, що переважна більшість індійців віддали свої голоси за кандидатів, які підтримують Swaraj. У провінціях Індії вже почали лунати заклики якнайшвидше перетворити цей обмежений обсяг місцевого самоврядування на повне самоуправління.\n\nРечник [ENG.GetAdjective]ого уряду підкреслив, що зараз не час обговорювати такі заходи, і що про будь-яку передачу подальших повноважень індійцям не може бути й мови."
 news.284.t:0 "Рух «Swaraj» здобуває перемогу на провінційних виборах"
 news.288.t:0 "Утворюється Китайський об'єднаний фронт"
 news.294.desc:0 "За наполяганням угорців Австрія провела референдум щодо можливого возз'єднання двох народів під короною Габсбургів. Остаточний підрахунок голосів майже завершено, але перемога прихильників возз'єднання вже недосяжна. Тому австрійський уряд вирішив не приєднуватися до австро-угорського союзу.\n\nУгорщина, однак, звинуватила австрійський уряд у фальсифікації виборів проти возз'єднання. Вони заявили, що не ухилятимуться від застосування сили, щоб захистити бажання австрійського народу возз'єднатися зі своїми угорськими братами. Обидві сторони почали мобілізацію, і війна здається неминучою."
 news.295.e:0 "Нам краще зміцнити наші кордони..."
 news.299.b:0 "Вони трохи самовпевнені."
 news.307.t:0 "Югославія повертає Воєводину"
 news.308.desc:0 "Югослави відхилили [HUN.GetAdjective]і вимоги щодо Воєводини, продемонструвавши явний акт непокори. Угорщина, зі свого боку, не доклала жодних зусиль, щоб відмовитися від своїх погроз застосувати силу для захисту своєї «законної території». Обидві країни, схоже, готуються до війни, яка може вибухнути в будь-який день."
 news.310.a:0 "Словакам так краще."
 news.312.a:0 "Вітаємо наших нових друзів."
 news.312.desc.a:0 "З [HUN.GetAdjective]ої ініціативи Італія, Австрія й Угорщина поновили дію Римських протоколів, первісно підписаних у 1934 році. Угоди стосуються економічного розвитку та зближення. По суті, це декларація про дружбу, але є ознаки того, що вона може призвести до офіційного союзу, спрямованого на протидію зростаючим ревізіоністським та експансіоністським тенденціям держави [GER.GetNameDef]."
 news.327.c:0 "Тривожні події."
 news.330.b:0 "Нахабні вискочки!"
 news.333.d:0 "Ми не скоро забудем цю зраду!"
 news.337.desc_no_states:0 "Сьогодні було підписано мирний договір між [ETH.GetLeader] та [ITA.GetLeader], який припиняє військові дії між двома країнами. Незважаючи на величезну різницю в силі між королівством, що не має виходу до моря, та імперією, що охоплює весь світ, ефіопський уряд зумів утримати свої позиції проти італійських військ.\nЦе була друга поразка італійських збройних сил в Ефіопії, уряд [ITA.GetLeader] перебуває в руїнах, і, ймовірно, пройде багато років, перш ніж ображена італійська гордість по-справжньому оговтається від цієї поразки."
 news.43.d:0 "Сьогодні дивом вдалося уникнути катастрофи, коли на німецькому дирижаблі «Гінденбург» під час посадки на базі в Лейкгерсті, США, було виявлено витік палива.\n\nВиток вдалося усунути. Якби він залишився непоміченим, горючі випари могли б призвести до пожежі та знищити дирижабль цілком. Багато хто давно критикує цей вид транспорту через ненайкращий рівень безпеки. Ймовірно, цей нещасний випадок дасть їм привід виступати більш промовисто."
 news.44.d:0 "Заступника фюрера Рудольфа Гесса було заарештовано сьогодні військами місцевої самооборони в Шотландії, де він приземлився, зістрибнувши на парашуті з важкого винищувача. Будучи досвідченим пілотом, він, судячи з усього, поодинці подолав Північне море, намагаючись залишитися поза зоною дії радарів, а потім повернув у бік Великої Британії. Гесс стверджує, що прилетів обговорити можливий мирний договір між Великою Британією та Німеччиною. Берлін уже оголосив його божевільним і позбавив усіх звань та посад. Британская влада поки що відмовляється від коментарів."
 news.58.c:0 "Французи цього разу самі по собі."
 news.59.t:0 "Мюнхенський диктат"
 night:0 "Ніч"
 nordic_defence_goal_desc:0 "Щоб забезпечити майбутнє наших громадян і цивільних осіб, ми повинні захищати Скандинавію усім, що маємо. Тільки тримаючи імперії, що нависають, подалі, ми зможемо процвітати."
 nsb_news.1.e:0 "Що це означає для Польщі?"
 nsb_news.11.a:0 "Може, в цьому справді якось замішаний НКВС?"
 nsb_news.12.t:0 "[SOV.GetAdjective] державний переворот"
 nsb_news.3.b:0 "Цікаво."
 nsb_news.302.b:0 "Знову?"
 nsb_news.4.desc:0 "Вільне місто Данциг, засноване Версальським договором у 1920 року, донині було незалежною державою під захистом Польщі. Проте зараз, коли загострюється обстановка на німецько-польському кордоні, а уряд Данцига відмовляється пропускати польські товари через міський порт, уряд Польщі оголосив, що свободі Данцига прийшов кінець.\n\nВулиці міста вже сповнені польських солдатів, і зроблено це з єдиною метою— посилити тут вплив держави. на бік держави [GER.GetNameDef]."
 nuke_dropped.1.d:0 "For the first and hopefully last time in history, a nuclear bomb has been detonated in [From.From.GetName] as part of international warfare conducted by [?global.nukecountry.GetNameDef]. The unprecedented destruction stands as a testament to the devastating power of this new weapon, which is feared not only for what it can do to its targets, but what implications it has for the one who deploys it and for humanity itself.\n\nThe world holds its breath waiting for what will come next. Will this force [From.From.Owner.GetNameDef] to surrender to avoid further terror, or will it only strengthen their resolve to strike back against those who would resort to such measures?"
 nuke_dropped.11.b:0 "They may burn every city we have, but they will never take them."
 nuke_dropped.3.d:0 "A nuclear bomb, originally intended for Kokura, was detonated today over the Nagasaki. Weather conditions forced the planes to divert their mission, a combination of smoke, clouds and technical difficulties being deciding factors in an event that may well change history.\n\nThe effects of the bomb were contained somewhat by the city's location in a valley, but the damage is still severe. Some military installations were struck, but the catastrophic civilian losses overshadow them by far. It may take decades before we know the long-term effects of this weapon with certainty. The threat posed by [?global.nukecountry.GetNameDef] knows no bounds."
 occupy_philippines_desc:0 "Перший крок у вдалій Тихоокеанській кампанії — це захоплення Філіппін. Американці не преминуть скористатися цими островами як зручна база для завдання ударів по Японії, але ми теж можемо зайняти їх з метою підготовки до майбутньої операції проти Південної зони ресурсів."
 offer_military_access_initiator_desc:0 "Держава $COUNTRY|Y$ надає право проходу військ іншим країнам."
