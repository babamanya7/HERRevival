 GOE_RAJ.1.desc:0 "Наш суб'єкт [FROM.GetNameDef] побачив можливість розширити наш вплив на Індійському субконтиненті, підкоривши [BHU.GetAdjective] королівство-відлюдник. Це може відкрити ворота до внутрішньої Азії."
 GOE_RAJ.20.desc:0 "[FROM.GetName] неохоче прийняла наші вимоги. Вони чітко дають зрозуміти, що така груба політика не протримається довго і є лише невеликою компенсацією."
 GOE_RAJ.21.a:0 "Запропонувати їм мир"
 GOE_RAJ.21.b:0 "Не може бути миру для імперіалістів"
 GOE_RAJ.31.b:0 "Ніколи"
 GOE_RAJ.34.desc:0 "Катастрофа в [UK_INDIA.GetName]! Місцева адміністрація розпалася через тривалу війну на заході. Щоб зберегти контроль над країною, вони запропонували територіальний компроміс повстанцям. Можливо, ми не визнаємо цих повстанців, але наразі війна програна."
 GOE_RAJ.48.desc:0 "Після серії публікацій та передач, натхненних [RAJ.GetNameDef], зростаюча частина [This.GetAdjective] суспільства звертається до індійської моделі аграрного соціалізму. Повідомлення про земельну реформу, самоврядування та антиімперіалістичну єдність резонує серед робітників та селян.\n\nХоча це все ще маргінальний рух, багато хто в [This.GetAdjective] керівництві побоюється, що без рішучої відповіді ці настрої можуть перерости у масові страйки, або, що гірше, збройну агітацію, узгоджену з революційними цілями [From.GetNameDef]."
 GOE_RAJ_eic.8.desc:0 "[FROM.GetName] виключив будь-яку передачу земель нам, заявивши, що навіть пропонувати таке є образою загальної порядності"
 GOE_RAJ_famine.9.desc:0 "[FROM.Getname] стикається з погіршенням ситуації, коли частина її країни перебуває у стані голоду. Її уряд благає про будь-яку допомогу, яку міжнародна спільнота може надати, щоб полегшити страждання та припинити надзвичайну ситуацію."
 GOE_RAJ_loyalist.06.b:0 "Ми повинні зосередитися на наших наступальних можливостях."
