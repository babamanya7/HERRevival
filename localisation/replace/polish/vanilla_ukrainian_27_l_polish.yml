 AST_all_for_one_one_for_all_desc:0 "«Всі за одного, і більше для мене» довго було бойовим кличем буржуазії, чия жадібність вимагає все більше, віддаючи все менше. Обіцянка того, що багатство потече вниз, — брехня. Воно повинно розподілятися порівну, усіма і для всіх."
 AST_australian_culture_investments_idea:0 "Інвестиції в австралійську культуру"
 AST_big_business_pact:0 "Пакт із великим бізнесом"
 AST_cabinet_trust_effects_5:0 "[GET_AST_CABINET_TRUST_EFFECTS_5]"
 AST_call_on_japanese_fascists:0 "Заклик до японських фашистів"
 AST_canberra_air_disaster_events.5.desc:0 "На прес-конференції [AST.GetName] кинула звинувачення в наш бік, стверджуючи, що ми несемо відповідальність за нещодавню авіакатастрофу на території Австралії, в результаті якої загинули кілька політичних чиновників.\n\nЦі звинувачення, звісно, є абсолютно неправдивими, що робить цю неповагу лише ще більш зловмисною."
 AST_carrier_4_desc:0 "$ENG_carrier_4_desc$"
 AST_claim_french_indochina_desc:0 "Оскільки доля Франції не вирішена, доля її колоній також залишається невизначеною. Інші нації можуть спробувати накласти свої жадібні руки на Французький Індокитай, але вони не виграють у нас."
 AST_commonwealth_aircraft_corporation_desc:0 "Авіаційна корпорація Співдружності — головний постачальник літаків та авіаційних двигунів в Австралії. Вона має перевірену репутацію, тому, підтримавши її, ми забезпечимо наших пілотів потрібними матеріалами."
 AST_daimler_dingo_desc:0 "Цей британський бронеавтомобіль поліпшить нашу мобільність на полі бою. До того ж, його назвали на честь знаменитого виду австралійських собак."
 AST_death_from_down_under_desc:0 "Жоден бомбардувальник не зможе завдати шкоди нашим портам та містам, як тільки ми модернізуємо нашу систему ППО та поліпшимо пізнання в галузі авіації та зенітної артилерії."
 AST_department_of_supply_and_development_taog_desc:0 "Оскільки вимоги війни доводять наші виробничі та логістичні системи до межі, ми повинні централізувати наші зусилля під спеціальним органом, відповідальним за їх координацію та підтримку."
 AST_diggers_desc:0 "«Копай, копай, копай, поки не будеш у безпеці» — такий наказ отримав генерал Вільям Бірдвуд, коли АНЗАК висадилися в Галліполі, і ці слова стали синонімом австралійського стилю війни. Проте дух Діггера сягає глибше, пов'язуючи австралійських і новозеландських солдатів через «товариство»: міцний зв'язок боротьби пліч-о-пліч і заради своїх товаришів."
 AST_diplomatic_events.10.desc:0 "[AST.GetNameDefCap] високо цінує союзництво з [USA.GetNameDef] і тепер просить формалізувати його у спільній міжнародній воєнній коаліції. Об'єднавши зусилля, наші дві нації могли б допомагати одна одній у нинішніх та майбутніх конфліктах."
 AST_diplomatic_events.15.desc:0 "За підсумками нещодавно проведеного референдуму, [NZL.GetName] вирішила не застосовувати статтю 6 Конституції Австралії. [NZL.GetNameDefCap] залишиться окремою нацією."
 AST_diplomatic_events.18.a:0 "Фантастика!"
 AST_diplomatic_events.18.t:0 "[INS.GetNameDefCap] погоджується на австралійський запит"
 AST_diplomatic_events.38.a:0 "Наша територія повернеться!"
 AST_diplomatic_events.39.a:0 "Чудово!"
 AST_diplomatic_events.39.desc:0 "[GER.GetNameDefCap] та [AST.GetFascistParty] домовилися про спільну мету: [AST.GetName] здобуде незалежність. Через наразі обмежений політичний вплив [AST.GetFascistParty], [GER.GetNameDef] допоможе субсидією, щоб прискорити його зростання, і коли наш вплив більше не буде обмеженим, угода буде виконана в повному обсязі."
 AST_diplomatic_events.50.b:0 "Регіон розташований досить близько."
 AST_diplomatic_events.51.desc:0 "[FROM.GetNameDefCap] погоджується; води Південно-Східної Азії захищатимемо ми. В обмін на поставки палива від Британії, [ROOT.GetName] докладе зусиль для збільшення військово-морського домінування в сусідніх водах."
 AST_diplomatic_events.54.desc:0 "[ENG.GetNameDefCap] погоджується: збільшення присутності союзників у Африці принесе користь Співдружності.\n\nМи ініціюємо переговори з Вішістською Францією з метою мирної передачі їхніх колоній та створення австралійського гарнізону."
 AST_diplomatic_events.8.desc:0 "[USA.GetNameDefCap] погодилися виділити певну кількість конвоїв, щоб допомогти [AST.GetName] з постачанням."
 AST_eastern_focus_tt:0 "\nМісія дозволить §Y[ENG.GetNameDef]§! оголосити війну §Y[JAP.GetNameDef]§!. Якщо вони не зроблять цього протягом 180 днів, війна почнется автоматично. §Y[ENG.GetNameDefCap]§! може відстрочити дату завершення місії, фінансуючи австралійське оборонне будівництво."
 AST_election_events.1.desc.b:0 "Голоси підраховано; на виборах перемогла Австралійська лейбористська партія.\n\nЛейбористи пройдуть короткий період формування уряду, після чого наступні три роки доводитимуть, що громадяни не дарма довірилися їхнім представникам."
