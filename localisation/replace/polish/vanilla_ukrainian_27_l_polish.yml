 JAP_new_industrial_city_development_policy_desc:0 "Комітет з планування національних земель розробив план створення нових міст, зосереджених навколо військових об'єктів постачання для армії та флоту, заводів боєприпасів та супутніх об'єктів, а також масштабного містобудування для підтримки цих галузей. Ми повинні інвестувати в цю ініціативу."
 JAP_nichiren_marxist_trait:0 "Нічірен-марксист"
 JAP_occupy_siam:0 "Окупація Сіаму"
 JAP_promote_pan_asianism_desc:0 "Мрія про єдину азійську державу зараз ближча до здійснення, ніж будь-коли раніше, завдяки подвигам наших хоробрих солдатів та ініціативам, вжитим у рамках Великої східноазійської сфери співпроцвітання. Раз і назавжди західним націям буде показано, що Азія — це не просто регіон, яким вони можуть користуватися, а сила, яка стоятиме на рівні навіть з найвеличнішими імперіями в їхніх найсміливіших фантазіях."
 JAP_purge_the_kodoha_faction_desc:0 "Нам загрожують елементи, які прагнуть захопити владу та завдати удару на північ по СРСР. Ми мусимо нейтралізувати загрозу, доки не завдано непоправної шкоди."
 JAP_raise_support_within_the_proletarian_class_tt:0 "§Y[529.GetName]§! почне підтримувати КПЯ"
 JAP_request_soviet_support:0 "Прохання про радянську підтримку"
 JAP_rethink_armor_doctrine_desc:0 "Хісаїчі Тераучі дійшов жахливого висновку. Наші нинішні конструкції бронетехніки та наземних транспортних засобів погано пристосовані для боротьби з чимось, окрім легкої піхоти, і будуть знищені, якщо вони коли-небудь зіткнуться із західною бронетехнікою. Ми повинні виправити цей недогляд якнайшвидше!"
 JAP_return_of_the_manchukuo_exiles_tt:0 "Лише регіони з §Y$JAP_state_infiltrated_by_the_jcp$§! приєднаються до нас на початку §YГромадянської війни§!"
 JAP_revisited_21_demands_neg_op_mod:0 "Перегляд «Двадцяти однієї вимоги»"
 JAP_rocket_suicide_equipment_1:0 "Yokosuka MXY7 Ohka"
 JAP_sea_mountaineers_desc:0 "Наша армія усвідомила, що не зможе проникнути в гірські регіони південного та західного Китаю, якщо не буде вжито рішучих заходів. Тому вони звернулися з проханням створити спеціальні гірсько-піхотні бригади, щоб вони могли очолити атаку та прорвати ворожі лінії."
 JAP_sea_promote_japanese_settlement:0 "Сприяти японському розселенню"
 JAP_sea_the_showa_restoration:0 "[JAP_sea_the_showa_restoration_key]"
 JAP_sea_the_showa_restoration_emperor_genka_desc:0 "Нарешті епоха ліберальної демократії Тайшьо добігла кінця. Знову націю очолить невелика група кваліфікованих людей, що підтримують сильного Імператора. Тільки так нашій країні нарешті буде принесено порятунок."
 JAP_senbu_idea:0 "Організації Сенбу"
 JAP_soto_trait:0 "Сото"
 JAP_state_under_rebel_control_tt:0 "Цей регіон приєднається до §Yдемократів§! на початку громадянської війни, якщо він також не є §Yінфільтрованим КПЯ§!"
 JAP_strategic_offensives_tt:0 "Відкриває рішення §Y«Розпочати наступ»§!, які дають тимчасові бонуси в §Yкитайських регіонах§!"
