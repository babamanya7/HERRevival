 ITA_a_time_for_war:0 "Час війни"
 ITA_abolish_the_colonies_desc:0 "Ми розробимо та представимо революційний план скасування статусу колонії для будь-якого регіону Італії. Вперше в історії нашої країни місцеві жителі постраждалих регіонів отримають можливість вирішувати свою долю. Від нас залежить, чи побачать вони переваги від становлення легітимною провінцією італійської держави."
 ITA_alberto_beneduce:0 "Альберто Бенедуче"
 ITA_alberto_de_stefani:0 "Альберто де'Стефані"
 ITA_all_eth_initial_states_controlled_tt:0 "Усі початкові ефіопські області підконтрольні державі §Y[ROOT.GetFlag][ROOT.GetNameDef]§! або §Y[ROOT.GetAdjective]им союзникам§!."
 ITA_armored_car_equipment_2:0 "AS.42 Sahariana"
