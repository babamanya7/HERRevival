 CONGO_even_a_hospital_can_do_better_desc:0 "Кілька менших підрозділів Конго служили в різних театрах бойових дій по всьому світу. Особливо зусилля медичного корпусу стали легендою, навіть на передовій, коли вони стикалися з переважаючими силами, до такої міри, що місцевий командир був почутий, як обурювався на своїх солдатів: \"Навіть лікарня може зробити краще!\"."
