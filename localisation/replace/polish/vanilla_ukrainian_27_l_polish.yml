 SWE_continue_the_second_industrial_revolution_desc:0 "Триваюча індустріалізація є ключем до зростання процвітання та безпеки для наших людей. Тому ми повинні використовувати потужність нових технологій і прагнути до ще більших темпів індустріалізації в [SWE.GetName]."
