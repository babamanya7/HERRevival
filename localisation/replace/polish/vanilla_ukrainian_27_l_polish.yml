 SPR_light_cruiser_1_desc:0 "The Méndez Núñes-class light cruisers were a pair of cruisers built within Spain for the Spanish Navy in the early 1920s. The ships were ordered in 1915 but materials shortages during World War I delayed construction. The design was heavily influenced by the British C-class cruisers. The cruisers displaced nearly 4,800 tons but was relatively slow. Its main armament consisted of six 152mm/50 Vickers Mk V guns. It also had good armor and a dozen 533mm torpedo tubes."
 SPR_medium_tank_equipment_3:0 "Carro de Combate 44"
 SPR_militarize_the_industry_desc:0 "Необхідно заохочувати комуни збільшити виробництво військового постачання, інакше ми ризикуємо позбавити наших відважних солдатів інструментів, необхідних для захисту наших домівок."
 SPR_organizational_military_council:0 "Організаційна військова рада"
 SPR_relocate_the_gold_reserves_desc:0 "Наші золоті резерви є ключовими у закупівлі військових матеріалів з-за кордону. Ми повинні забезпечити його зберігання в безпечному місці, що, на жаль, вимагає переміщення його за кордон."
 SPR_secn_organization:0 "$secn$"
 SPR_secure_democratic_principles_desc:0 "Ми не можемо дозволити комуністичному впливу змінити або навіть знищити принципи, на яких була заснована Друга республіка — незалежно від наших стосунків з комуністами чи [SOV.GetNameDef], ці принципи повинні нести в наших серцях, якщо не відкрито."
 SPR_secure_the_guardia_de_asalto_mission_tt_2:0 "Коли почнеться громадянська війна, Ви отримаєте 10 погано тренованих дивізій із §Y3§! батальйонами §Yпіхоти§!. Республіканці отримають 5 тренованих дивізій із §Y6§! батальйонами §Yпіхоти§!.\n"
 SPR_seized_the_gold_reserves:0 "Захоплено золоті резерви"
 SPR_ship_torpedo_3:0 "4x 533-мм торпедний апарат"
 SPR_soviet_military_advisors_desc:0 "Радянські військові радники можуть просто дати нашим військам і лідерам перевагу, яка їм потрібна проти наших ворогів."
 SPR_strengthen_the_anti_fascist_coalition_desc:0 "Ми усунули незгодні частини нашої коаліції — сподіваємося, це означає, що тепер ми нарешті можемо зосередитися на зміцненні нашої єдиної рішучості у викоріненні фашизму."
 SPR_submarine_2_desc:0 "The General Mola class was a class of four Italian Archimedes-class submarines commissioned in 1934 and transferred to the Nationalists in 1937. They were fairly large, displacing 880 tons, yet faster than most subs. They were armed with eight 533mm torpedo tubes and had a diving depth of 90m."
 SPR_the_inevitable_counterblow_desc:0 "Міжнародна ворожнеча до нашого спільного способу життя зростає. Це лише питання часу, коли припаде удар, і ми повинні бути готові прийняти його."
 SPR_the_popular_front_desc:0 "Небезпека, яку фашизм і релігійні забобони представляють для наших свобод, суттєва. Ми мусимо заснувати широкий фронт політичних партій, об'єднаних в опозиції правим. Тільки об'єднавшися, ми зможемо зупинити їхній наступ і врятувати Республіку."
 SPR_war_of_independence_desc:0 "Настав час виступити проти наших колишніх союзників, щоби не перетворити нас на ще одну державу-член Союзу. Наш народ потребує останніх великих зусиль, щоб отримати остаточну нагороду — свободу від лівого та правого авторитаризму."
 SP_ROCKET_AND_SUBMARINE_SITE_REMINDER_PROJECT:0 "Аби ефективно використовувати проєкт $PROJECT|Y$, нам потрібно збудувати ракетний майданчик або мати підводні човни, здатні наносити ракетні удари."
 SP_UNLOCK_TECH_WITH_EXTRA_PROJECT:0 "У поєднанні зі спеціальним проєктом $EXTRA_PROJECT|Y$ відкриває $TECH|Y$."
 SSB_berlin_baghdad_railway_into_iran_afghanistan_desc:0 "Залізниця Берлін—Багдад є основним стовпом торгівлі та економіки [IRQ.GetAdjective]. Ми маємо можливість з'єднати цю залізницю із залізницею Анкара—Кабул та дозволити іншим державам-підписантам торгувати через неї."
