 SOV_support_afghan_ideology_desc:0 "Афганістан — це місце, де горді нації принижуються. Військова операція в цій країні буде в кращому випадку дорогою і може навіть не увінчатися успіхом. У нас є кілька контактів в Афганістані, які хочуть створити уряд, ідеологічно ближчий до нас. Ми мусимо підтримати ці зусилля."
