 HINT_RESEARCH_TREE_TEXT:0 "Це — §Yдерево технологій§!. Хоча спершу воно може здатися приголомшливим, насправді воно не є складним. Ми виділили кілька технологій, рекомендованих на початку гри.\n\nХорошою ідеєю буде дослідження технологій, що посилюють промисловість Вашої країни, а також загальні військові поліпшення. По ходу гри буде краще досліджувати більш спеціалізовані технології, як-от моделі танків або літаків. Усе залежить від того, чого Ви намагаєтеся досягти.\n\nДослідження технологій із випередженням забиратиме більше часу. Також існують §Yнаціональні фокуси§!, які можуть зменшити штраф за випередження для певних технологій."
