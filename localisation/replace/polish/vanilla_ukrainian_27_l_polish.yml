 GER_naval_effort2_desc:0 "Щоб по справжньому відбудувати флот, гідний поваги, нам потрібно сильно розширити наші можливості в кораблебудуванні."
 GER_naval_rearmament_desc:0 "Морська угода, укладена між Британією та Німеччиною у 1935 році, дозволяє нам значно розширити свій флот. У це слід вкладати всі сили та ресурси."
 GER_operation_panzerfaust_events.04.b:0 "Ми не будемо грати в його ігри"
