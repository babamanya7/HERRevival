 RAJ_GOE_undermine_gandhis_movement_desc:0 "Хоча меседж Ганді залишається популярним, його рух вразливий до внутрішніх протиріч і класових компромісів. Через цілеспрямовану інфільтрацію та тонке підбурювання ми можемо виявити ці слабкості та спрямувати підтримку на більш революційну альтернативу."
 RAJ_P_krishna_pillai:0 "$RAJ_p_krishna_pillai$"
 RAJ_a_loyal_government_desc:0 "Незважаючи на прагнення до незалежності з боку дисидентів у [RAJ.GetNameDef], наш уряд залишається сильним і стабільним. Ми будемо й надалі відстоювати інтереси Корони з дисципліною та рішучістю."
 RAJ_a_private_military_tt_1:0 "Створює нерегулярні дивізії з повним особовим складом та обладнанням.\n\nВідправка дивізій як добровольців надасть §G1§! зовнішню §Yцивільну фабрику§! протягом §Y365§! днів, якщо їх відправити до країн, куди ми раніше не надсилали добровольців.\nНадсилання нових добровольців до тієї ж країни через §Y540§! днів знову надасть фабрику.\n\nЦі фабрики не враховуються до §YПодатків§!"
