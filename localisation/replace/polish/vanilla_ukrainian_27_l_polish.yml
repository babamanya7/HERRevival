 JAP_the_enemy_of_our_enemy:0 "Ворог нашого ворога"
 JAP_the_five_year_plan_idea:0 "П'ятирічний план"
 JAP_the_ie_system_and_socialism:0 "Система Іє та соціалізм"
 JAP_the_koiso_cabinet:0 "Кабінет Койсо"
 JAP_to_rival_the_comintern:0 "Скласти конкуренцію Комінтерну"
 JAP_unity_cabinet_party:0 "Кьококу іччі найкаку"
 JAP_unlock_japans_longest_day_tt:0 "Розблокує фокус §Y$JAP_japans_longest_day$§!"
 JAP_utilize_our_polish_friendship_desc:0 "Наша нація підтримувала добрі відносини з поляками ще з часів Російської імперії, коли ми приймали їхніх людей, засланих до Сибіру. З того часу ми обмінювалися розвідданими про [SOV.GetNameDef] і мали спільне суперництво з цією країною. Ми повинні оформити з ними оборонний пакт, щоб ми обидва могли почуватися захищеними від ведмедя."
 JAP_yasuhide_kurihara:0 "Ясухіде Куріхара"
 JOR_communism_ADJ:0 "Йорданськ"
 JOR_emirate_DEF:0 "Емірат Зайордання"
 JUNO_brazil_events.135.t:0 "[SOV.GetNameDefCap] погоджується на угоду"
 JUNO_brazil_events.138.t:0 "[FROM.GetNameDefCap] погоджується звільнити [BRA_country_to_be_liberated.GetNameDef]"
 JUNO_brazil_events.142.t:0 "Дипломатичне збентеження"
 JUNO_brazil_events.150.desc.b:0 "Бандити Північно-Східної Бразилії, відомі як Кангасу, розширюють свою діяльність на більшу територію регіону. Хоча місцеві правоохоронні органи та землевласники розлючені такою активністю в цьому районі, багато бідніших місцевих жителів залишаються, в кращому випадку, байдужими, а в гіршому — у захваті від новин. Схоже, що для вистеження винуватців знадобиться набагато сильніша присутність сил безпеки в цьому районі."
 JUNO_brazil_events.153.a:0 "Ми розберемося з ними з часом."
 JUNO_brazil_events.19.desc:0 "[FROM.GetAdjective] дипломати повідомили нам, що вони ще не готові приєднатися до війни військово, незважаючи на роки економічної допомоги, яку ми їм надавали. Не зовсім зрозуміло, чи вони просто намагаються відмовитися від своїх зобов'язань, чи мають справжні причини не виконувати їх. Ми повинні ретельно вирішити, як відповісти."
 JUNO_brazil_events.200.b:0 "$BRA_armando_de_sales_oliveira$"
 JUNO_brazil_events.35.a:0 "Ми повинні все одно стежити за ними."
 JUNO_brazil_events.49.t:0 "Напруга з [FROM.GetNameDef] зростає"
 JUNO_brazil_events.72.a:0 "Це не варте війни через океан."
 JUNO_brazil_events.72.desc:0 "Уряд [FROM.GetNameDef] нерозумно відмовився передати нам контроль над своїми заморськими територіями. Це приниження не залишилося непоміченим у дипломатичних колах. З очима світу, спрямованими на нас, ми повинні вирішити, як відповісти."
 JUNO_brazil_events.73.a:0 "У нас немає сил чинити опір."
 JUNO_brazil_events.74.a:0 "Нарешті возз'єднані!"
 JUNO_brazil_events.82.desc:0 "[FROM.GetNameDefCap] відхилила нашу щедру пропозицію про взаємні гарантії захисту. Що це означає для довгострокової безпеки нашої нації, ще належить побачити."
 JUNO_brazil_news.5.a:0 "Трагедія, що до цього дійшло."
 JUNO_guay_events.2.desc:0 "[FROM.GetName] прагне індустріалізуватися. Будучи країною з великою кількістю річок, гребля є очевидним кандидатом для електрифікації. Якщо ми вирішимо інвестувати, ми можемо очікувати повернення коштів протягом 2 років."
 KAL_communism_ADJ:0 "Калмицьк"
