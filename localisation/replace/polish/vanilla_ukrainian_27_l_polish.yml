 GER_proletarian_revolution_cat_desc:0 "Пролетаріат у нашій країні останнім часом стає дедалі сміливішим. Локалізовані повстання викликають заворушення, створюючи чудову можливість для більш радикальних політичних змін."
 GER_proletariat_uprising_modifier:0 "Повстання пролетаріату"
 GER_propaganda_master_desc:0 "Ми не мали жодних сумнівів, призначаючи Йозефа Гьоббельса на посаду міністра пропаганди. Він уже був досвідченим оратором і письменником. Тепер, коли він висловлює ідеї щодо вдосконалення нашої розвідувальної організації, ми повністю переконані, що реалізація цих ідей є в наших інтересах."
 GER_provisional_gvt_democratic_DEF:0 "Німецький перехідний уряд"
 GER_reich_engineer:0 "Райхсінженер"
 GER_reichskommissariat_arabien:0 "Райхскомісаріат Аравія"
