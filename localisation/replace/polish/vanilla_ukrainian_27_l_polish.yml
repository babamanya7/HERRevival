 CHL_political_events.20.desc:0 "Комуністична партія сьогодні зібралася з єдиною метою вирішити шлях, яким країна повинна піти в найближчі роки, а також обрати особу, яка допоможе повести країну до прогресу, оскільки нинішня широка коаліція не може повністю домовитися з усіх питань і потребує когось, хто б вжив заходів та надав керівництво. Наразі вибір стоїть між марксистом Еліасом Лафертте Гавіньйо, соціалістом Мармадюком Гроувом Вальєхо, сталіністом Карлосом Контрерасом Лабарка та троцькістом Мануелем Ідальго Плаза."
