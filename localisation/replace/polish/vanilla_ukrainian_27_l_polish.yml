 amphibious_armor:0 "Батальйон танків-амфібій"
 amphibious_mechanized_desc:0 "Підрозділ механізованої піхоти в машинах-амфібіях."
 amphibious_mechanized_equipment_desc:0 "Трактори-амфібії, або амтраки, дозволяють морським піхотинцям висаджуватися на пляж під броньованим захистом. Однак це відбувається за рахунок низької ефективності палива."
 anti_air_building:0 "Гармата ППО"
