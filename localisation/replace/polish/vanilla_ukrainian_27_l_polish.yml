 PHI_struggle_conference_desc:0 "Наш комуністичний рух змушений мати справу з безліччю різних конфліктів і напруженостей, і наша відповідь на це потребує більш організованої, офіційної реакції. Тому нам потрібно зібрати наших лідерів на першій Конференції боротьби, де всі ці питання будуть винесені на обговорення та вирішені."
