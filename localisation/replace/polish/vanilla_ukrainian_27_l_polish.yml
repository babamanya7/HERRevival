 POR_refuse_the_naval_blockade_desc:0 "Ми можемо скористатися перевагами морської блокади, накладеної на країни, які воюють з державою [ENG.GetName]. Наші дипломати укладатимуть зручні угоди про надання наших транспортних засобів тим країнам, які борються з [ENG.GetAdjective]ими військами, в обмін на їхню економічну підтримку."
 POR_strict_neutrality_in_the_spanish_civil_war_desc:0 "Громадянська війна в Іспанії спалахнула, але зараз ми не можемо дозволити собі бути втягнутими в міжнародні конфлікти. Ми повинні проголошувати політику суворого нейтралітету, одночасно зміцнюючи нашу націю та поліпшуючи наші дипломатичні відносини."
