 TUR_soviet_tank_factories_desc:0 "Якщо ми займемо ще жорсткішу антифашистську позицію у зовнішній політиці, [ROOT.GetNameDef] зможе реалізувати плани з виробництва бронетехніки з [SOV.GetAdjective] допомогою."
