 mtg_britain.104.a:0 "Отже, відтепер наші шляхи мають розійтися."
 mtg_britain.106.t:0 "[From.GetName] вимагає дотримання договору"
 mtg_britain.16.d:0 "Як ми і побоювалися, король Едуард VIII вирішив одружитися з Уолліс Сімпсон, тепер відомою як Уолліс, герцогиня Віндзорська."
 mtg_britain.25.d:0 "[From.GetNameDefCap] повідомляє, що перериває дипломатичні відносини з нами відповідно до [ENG.GetAdjective] вимог."
