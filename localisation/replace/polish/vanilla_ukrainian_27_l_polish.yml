 SWE_socialist_reforms_desc:0 "Тепер, коли ми отримали достатньо влади в Ріксдазі, ми можемо почати закладати основи справжньої соціалістичної республіки. Щоб убезпечити нашу позицію, ми повинні швидко запровадити реформи, щоб обмежити вплив буржуазії та заручитися підтримкою пролетаріату."
