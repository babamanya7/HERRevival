 SUPPLY_FLOW_DELAYED_DESC:0 "§HЗалишок припасів§! вказує на те, скільки постачання надається цій провінції й обчислюється з обласного постачання та центрів постачання в межах досяжності. Досяжність центрів залежить від погоди, стану ґрунту, інфраструктури, рівня залізниці та моторизації.\n\n§HДивізії§! споживатимуть припаси в провінції в залежності від ваги постачання. Якщо їхні §Hзапаси припасів§! перевищують відсоток припасів, наданих їхній місцевості, вони споживатимуть припаси з внутрішніх запасів, поки рівень не досягне місцевого.\n\nУтримуйте §GCtrl§!, щоби побачити джерела потоків."
