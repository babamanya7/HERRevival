 SEA_PHI_political_events.50.a:0 "Хай спробують!"
 SEA_PHI_political_events.58.desc:0 "На жаль, наш [FROM.GetAdjective]ий союзник відхилив прохання частково делегувати свій флот нашим військовим. Схоже, нам доведеться наростити виробництво на верфях, якщо ми хочемо зробити внесок у морський театр бойових дій."
 SEA_PHI_political_events.69.t:0 "[FROM.GetName] пропонує об'єднання"
 SEA_PRC_faction_events.11.desc:0 "Лідер [FROM.GetNameDef] знову показав світові, яким дурнем [FROM.GetLeader.GetSheHe] є, відхиливши нашу пропозицію створити єдиний фронт для захисту та об'єднання Китаю. Це означає, що завдання захистити наш народ лежить виключно на нас. Ми доведемо світові, що ми більш ніж готові до цього завдання!"
 SEA_PRC_faction_events.4.desc:0 "Спільна загроза з боку [CHI.GetNameDef] та [PRC.GetNameDef], схоже, виявилася занадто великою для [FROM.GetLeader], який поступився нашим вимогам і погодився дозволити нашим військам увійти в [FROM.GetNameDef] без опору. Зрештою, виявляється, що сила — це право..."
 SEA_PRC_faction_events.42.desc:0 "Схоже, [FROM.GetLeader] вирішив, що [FROM.GetNameDef] і [FROM.GetFactionName] краще обійдуться без нас в альянсі. Яке божевілля змусило [FROM.GetLeader] прийняти таке безглузде рішення, невідомо, але одне можна сказати напевно: це зробило нас більш вразливими. Ми можемо лише здогадуватися, що замислив [FROM.GetNameDef], але це точно нічого доброго."
 SEA_PRC_faction_events.51.desc:0 "Наша делегація до [FROM.GetLeader] повернулася додому з порожніми руками, за винятком поганих новин. Наша щедра пропозиція запросити [FROM.GetNameDef] до нашої фракції, вочевидь, була зустрінута недовірою та погано прихованим презирством. Схоже, [FROM.GetLeader] вирішив, що [FROM.GetNameDef] краще обійдеться без сили та безпеки, які пропонує [ROOT.GetFactionName]. Можна лише уявити, як вони впораються без нас!"
 SEA_PRC_faction_events.80.a:0 "Нехай приходять і спробують"
 SEA_PRC_fourth_army_incident.11.a:0 "Цього вистачить"
 SEA_PRC_misc_events.19.b:0 "[FROM.GetNameDefCap] передає область [729.GetName]"
 SEA_PRC_political_events.26.t:0 "[FROM.GetName] наказує $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ вирушити до [PRC.GetName]"
 SEA_PRC_request_aid.3.a:0 "Доведеться знайти інше джерело"
 SEA_PRC_request_aid.3.desc:0 "Наш запит про допомогу від [FROM.GetNameDef] було відхилено; [FROM.GetAdjective]і посадовці вказали, що [FROM.GetNameDef] має обмаль спорядження після нещодавньої реорганізації."
 SEA_PRC_request_aid.31.c:0 "Ми можемо принаймні допомогти їх виготовити"
 SEA_PRC_zhang_guotao_events.2.t:0 "Телеграма від $PRC_zhang_guotao$"
 SEA_border_incidents_events.5.desc:0 "Після зіткнення між [MON.GetAdjective]ими та [JAP.GetAdjective]ими силами в прикордонній зоні навколо озера Буїр, [MON.GetAdjective]і сили, за повідомленнями, повністю відступають. [JAP.GetAdjective]і підрозділи зайняли ряд стратегічних висот навколо цього району і готуються знову увійти в село Тауран.\n\nПід час бою [JAP.GetAdjective]і сили захопили в полон кількох [MON.GetAdjective]их солдатів і [SOV.GetAdjective]их радників, що завдасть руйнівного удару по моральному духу ворога."
 SEA_china.15.a:0 "Дуже добре"
 SEA_generic_events.5.a:0 "Гарантувати, що преса це не висвітлить"
