 FIN_extra_refresher_exercises:0 "Додаткові тренування"
 FIN_finnish_goods_desc:0 "Завдяки хитромудрому маневру ми уклали надійну торговельну угоду з Куусіненовою державою [FIN.GetName], що забезпечило нам привілейований доступ до їхніх цінних товарів та дуже вигідні умови для їх закупівлі."
 FIN_finnish_influence_in_the_baltic_tt:0 "Впливає на будь-яку незалежну §YБалтійську країну§! та §Y[POL.GetName]§!.\nЯкщо країна поділяє ту саму ідеологію, що й [ROOT.GetFlag]§Y[ROOT.GetName]§!: отримує подію §Y'[ROOT.GetName] запрошує нас до [GetAppropriateFinnishFactionInviteTooltip]'§!."
 FIN_greater_finland_ADJ:0 "Фінськ"
 FIN_hold_leningrad_mission_desc:0 "[195.GetName], можливо, було захоплено нашими військами, але щоби виконати наші вимоги, ми повинні утримувати регіон, доки [SOV.GetAdjective]і сили не будуть належним чином деморалізовані."
 FIN_ilmari_kianto:0 "Ілмарі Кіанто"
 FIN_integrate_ingria_additional_states_desc:0 "Існує більше регіонів, які можна інтегрувати до нашої новоствореної Інгерської Республіки, і [FROM.GetName] є одним із них."
 FIN_integrate_leningrad:0 "Встановити [FROM.GetName] столицею Інгерійської Республіки"
 FIN_join_the_allies_desc:0 "Нейтралітет швидко стає застарілою політикою, яка просто веде до васалізації в руках великих держав. Хоча це ризик, враховуючи наше геополітичне положення, приєднання до Альянсу може дозволити нам зберегти наш суверенітет у довгостроковій перспективі.."
 FIN_joint_research_and_development_program_name:0 "Спільна програма досліджень і розробок"
 FIN_military_research_desc:0 "Війна постійно переосмислюється з появою нових технологій і тактик, які їх використовують. Щоб забезпечити постійну силу та готовність наших збройних сил, члени нашого альянсу повинні об'єднати наші знання та технології."
 FIN_national_aircraft_production_desc:0 "Оскільки [ROOT.GetName] стикається з загрозою війни, стає дедалі очевиднішим, що сучасні військово-повітряні сили мають важливе значення для оборони країни. З цією метою було започатковано національну програму виробництва літаків з метою забезпечення необхідні ресурси та підтримку для [ROOT.GetAdjective]их конструкторів і виробників літаків, гарантуючи, що [ROOT.GetName] зможе конкурувати з великими державами Європи."
 FIN_national_firepower_desc:0 "Враховуючи нагальні зовнішні загрози, з якими стикається наша держава, ми повинні взяти на себе зобов'язання здійснити великі інвестиції в нові військові заводи. Ці потужності будуть призначені для виробництва найновіших артилерійських гармат для наших сухопутних сил і берегових батарей, гарантуючи, що [ROOT.GetNameDef] має необхідну вогневу міць для захисту своїх кордонів."
 FIN_northern_defense_front_faction:0 "Північний оборонний фронт"
