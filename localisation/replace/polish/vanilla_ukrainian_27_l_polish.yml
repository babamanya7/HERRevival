 CHI_state_aa_desc:0 "У цьому новому світі ворог атакує не лише з суші та моря, а й з повітря. Підготовка до навали, яка неминуче прийде з неба, шляхом розвороту наших гармат вгору, буде імперативом, якщо ми хочемо стримати загарбників."
 CHI_taoist_devotee_trait:0 "Прихильник даосизму"
 CHI_the_freedom_to_abject_desc:0 "Система, яку не можна критикувати, ніколи не буде рости та розвиватися. Ми занадто довго топтали людей, які вказували на елементи, що збагачують одних на шкоду народу [CHI.Getadjective]. Нам потрібні процеси, які дозволять вказувати на недоліки системи, доки це не дестабілізує нас."
 CHI_the_northwest_highway_desc:0 "Ми маємо довгий спільний кордон із [SOV.GetnameDef], тому можна подумати, що є широкі можливості для безперешкодного транспортування вантажів між нашими двома режимами. Однак інфраструктура в тих регіонах, м'яко кажучи, залишає бажати кращого. Ми повинні зосередитися на розбудові маршруту, віддаленого від лінії фронту, щоб ми могли отримувати більше від наших [SOV.Getadjective] друзів."
 CHI_tour_the_north:0 "Поїздка на північ"
 CHI_tsr_deepen_our_collaboration:0 "Поглибити нашу співпрацю"
 CHI_tsr_peace_desc:0 "Ми повинні прагнути миру будь-якими засобами, навіть якщо це означає зраду цього принципу в короткостроковій перспективі. Ми повинні перемогти кожного, хто стоїть на шляху процвітання Китаю."
 CHI_utilize_german_contacts:0 "Використати німецькі контакти"
