 YUG_zara_for_axis_desc:0 "Італійці стверджують, що уряд у Зарі є законним розпорядником Далмації, але, можливо, запевнивши італійців, що ми боремося за ту саму справу, вони, можливо, захочуть віддати Зару нам назад і відмовитися від своїх балканських амбіцій, принаймні до часу."
