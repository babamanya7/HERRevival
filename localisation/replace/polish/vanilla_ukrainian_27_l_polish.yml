 LIT_GATHERING_STORM_DESC:0 "Оскільки Польща все ще прагне заманити Литву в нову Річ Посполиту, радянці не визнають право Литви на самовизначення, а також зростає нацистська загроза в регіоні Мемелю, ветеран війни за незалежність піднявся, щоби зберегти стабільність і незалежність литовської нації. Маючи у своєму розпорядженні обмежені ресурси, Антанас Смєтона сидить на чолі нестабільного режиму; з фашистськими воєнізованими загонами «Залізного вовка», які нишпорять сільською місцевістю, розлюченими ув'язненням свого лідера — Аугустінаса Волдемараса. З війною на горизонті, Литва повинна захищати свій народ, не зважаючи на це."
