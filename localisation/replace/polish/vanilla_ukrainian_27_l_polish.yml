 GER_ally_the_shade_desc:0 "Якщо ми не можемо зайняти місце під сонцем, то ми станемо союзниками тих, хто кидає на нас тінь."
 GER_amerikabomber_desc:0 "Ми мусимо повністю присвятити себе амбіційній меті опанувати небо та створити літак далекої дії, здатний шокувати наших ворогів, вражаючи цілі в глибині їхньої території — або ж перетнути Атлантику й показати всім, що ніхто не застрахований від нашої досяжності."
 GER_army_communist_modifier:0 "Volksarmee"
 GER_around_maginot:0 "В обхід Мажіно"
 GER_autobahn_communism:0 "Volksautobahn"
 GER_battleship_1:0 "Клас «Deutschland»"
 GER_battleship_1_desc:0 "Після Версальського договору Німеччині було дозволено зберегти шість лінкорів-додредноутів. Класифіковані Крігсмаріне як Linienschiffe (кораблі лінії), лише два кораблі класу «Deutschland» (не плутати з пізнішими кишеньковими лінкорами класу «Deutschland») залишалися на активній службі до 1930-х років. О 04:47 1 вересня 1939 року Schleswig-Holstein зробив перші постріли Другої світової війни, відкривши вогонь по базі Вестерплатте в Данцигу, Польща."
