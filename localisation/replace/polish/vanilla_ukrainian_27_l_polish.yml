 BALTIC_british_aircraft_default:0 "Британське виробництво літаків"
 BALTIC_entente_events.1.a:0 "Разом ми стаємо сильнішими."
 BALTIC_entente_events.1.b:0 "Можливість відновити демократію!"
 BALTIC_events.11.t:0 "Пропаганда «лісових братів»"
 BALTIC_events.3.d:0 "Дуже йде громадянська війна між [From.GetAdjective] народною армією, якою командує [From.GetLeader], і збитим з істинного шляху пролетаріатом, що бореться за буржуазну диктатуру, яку несе [From.GetNonIdeologyName], схоже, що [From.GetLeader] не може поодинці привести революцію до перемоги.[Root.GetLeader] отримує повідомлення від [Root.GetAdjective] посла в державі [From.GetNonIdeologyName]: у цьому посланні висловлено занепокоєння майбутнього [From.GetAdjective Посол вважає, що якщо ця війна буде програна, надії на успіх соціалізму в державі [From.GetNonIdeologyName] не залишиться."
 BALTIC_events.502.d:0 "Хоча спочатку Литовсько-Білоруська РСР була утворена, щоби згладити різницю між Сходом і Заходом, схоже, що [From.GetLeader] вже не бачить у цьому необхідності і оголошує Білорусь невід'ємною частиною СРСР, яка не може відійти державі [Root.GetNameDef]."
 BALTIC_events_8_tt:0 "Станеться подія §Y[Root.GetNameDefCap] просить про вторгнення в Данію§!."
 BALTIC_military_support_tt:0 "З початком §Yгромадянської війни§! §Yкомуністи§! отримають на §G20%§! §Yбільше частки в армії§!."
 BALTIC_new_red_riflemen:0 "Нові червоні стрільці"
 BALTIC_renew_allied_trade_default:0 "Поновити торгівлю з Союзниками"
