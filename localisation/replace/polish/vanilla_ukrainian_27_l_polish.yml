 CHI_a_chapter_in_every_village_desc:0 "Наші Сині сорочки досягли успіху в містах, але більшість населення живе в сільській місцевості. Нам потрібно розширити організацію, щоб вона була представлена в кожному містечку, селі та хуторі."
 CHI_a_functioning_bureaucracy_first_desc:0 "Хоча контроль над державним апаратом має велике значення, він безглуздий, якщо самої держави не існує. Надання інституціям певної міри самоврядування та заохочення правильних людей до просування по службі на основі заслуг, а не правильних ідей, принесе нам користь у довгостроковій перспективі."
 CHI_baojia_desc:0 "Ця децентралізована організація дозволить нам збільшити чисельність, залишивши вербування на розсуд лідерів місцевих груп — баочжанів."
