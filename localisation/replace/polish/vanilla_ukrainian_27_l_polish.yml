 CZE_petition_the_nobles_desc:0 "Дворянський клас [ROOT.GetNameDef] може більше й не мати визнаних титулів, але він все ще є впливовою частиною [ROOT.GetAdjective]ого суспільства; їхня підтримка дасть нам як легітимність, так і ресурси, необхідні для залучення подальшої підтримки."
