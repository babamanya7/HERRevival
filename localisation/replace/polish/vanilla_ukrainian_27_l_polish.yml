 NORDICS_FRAGMENTATION_STATUS:0 "Роздробленість Нордики"
 NORDIC_amphibious_forces_desc:0 "Гарантуючи, що ми можемо завдати удару нашим ворогам у будь-якому місці та в будь-який час, ми можемо зменшити їхні наступальні можливості. Якщо їм завжди доводиться боятися висадки в будь-якому місці вздовж узбережжя, вони не можуть розгорнути стільки підрозділів на лінії фронту. Таким чином ми повинні зосередитися на десантних операціях і морській піхоті."
 NORDIC_control_the_northern_sea_desc:0 "Норвезьке та Північне моря є воротами в Атлантику. Зосередження наших зусиль там дозволить нам мати справу з країнами північного узбережжя Європи і навіть досягти Північної Америки, якщо ми цього забажаємо."
 NORDIC_cooperation_decisions_category:0 "Скандинавське співробітництво"
 NORDIC_extended_range:0 "Розширений діапазон"
 NORDIC_investing_in_neighbor_ns:0 "Інвестиції в сусіда"
 NORDIC_monarchist_alliance_leader_dmod:0 "Лідер альянсу [NORDIC_get_alliance_name]"
 NORDIC_nordic_navy_desc_com:0 "Хвилі належать людям, і [NORDIC_get_alliance_name] сповнений рішучості звільнити та заволодіти ними для людей півночі. [NORDIC_get_nordic_navy_name] подбає про те, щоб наші вороги востаннє бачили наші кораблі, що піднімаються над червоним обрієм."
 NORDIC_nordic_research:0 "[NORDIC_get_nordic_research_name]"
 NORDIC_nordic_university:0 "Нордичний університет"
 NORDIC_promoted_nordic_unity:0 "Просування нордичної єдності"
 NORDIC_receiving_investments_TT:0 "Цивільні заводи поза мапою: §G£civ_factory +3§!"
 NORDIC_synthetic_refineries:0 "Синтетичні нафтопереробні заводи"
 NOR_GER_fascism_autonomy_reichskommissariat_DEF:0 "Райхскомісаріат Норвегія"
 NOR_GER_fascism_autonomy_reichsprotectorate_DEF:0 "Райхспротекторат Норвегія"
 NOR_allied_democratic_preparation_decisions_category_desc:0 "Цей уряд певен, що наші вороги завдадуть удару будь-якої хвилини. Ми повинні бути рішучими у своєму прагненні озброїти населення [NOR.GetName], щоб запобігти вторгненню. Навіть якщо це означає попереджувальний напад. Тож нехай ми згуртуємо нашу країну та візьмемо владу, необхідну для рішучої перемоги над нашими ворогами.\n\nНаціональна готовність: [?NOR.NOR_country_preparedness]/30"
 NOR_alt_dem_modernize_armed_forces_decision:0 "$NOR_modernize_armed_forces_decision$"
 NOR_attack_sweden_ns:0 "Напад на Швецію"
 NOR_contested_leadership_ns:0 "Оспорюване керівництво"
 NOR_continue_nygaardsvold_government_desc:0 "Лейбористський уряд на чолі з Юганом Нюгошволдом досі добре нам служив, тому, незважаючи на політичну напруженість наших сусідів на півдні, ми повинні продовжувати зосереджувати наші зусилля на виведенні норвезької економіки з економічної кризи, в якій ми перебуваємо. життя."
 NOR_decision_military_takeover_title:0 "Військове захоплення області [FROM.GetName]"
 NOR_demand_king_haakons_rise_to_power:0 "Вимогти прихід короля Гокона до влади"
 NOR_focus_on_training:0 "Зосередитися на навчанні"
 NOR_kungens_garde_ns:0 "Hans Majestet Kongens Garde"
 NOR_lev_trotsky:0 "Лев Троцький"
 NOR_nasjonal_samling_desc:0 "Протягом багатьох років провідна фашистська партія в [NOR.GetName] була відсторонена центральними та лівими партіями. Що ж, це закінчилося. Ми повинні об'єднатися за її лідера Відкуна Квіслінга, нашого здібного та харизматичного лідера, щоб принести справді [NOR.GetAdjective]ий фашистський режим."
 NOR_nav_bomber_equipment_1:0 "M.F. 11"
 NOR_organize_partisan_militias_desc:0 "Очевидно, що капіталізм не пом'якшить свою хватку над робітниками [NOR.GetName] без бою. Озброймо бажаючих і навчимо їх, щоб, коли прийде час, вони могли піднятися й розчистити шлях для революції. розірвати ланцюги капіталу."
 NOR_our_royal_claims:0 "Наші королівські претензії"
 NOR_pan_germanic_cooperation_desc:0 "У культурному відношенні [NOR.GetNonIdeologyName] належить до ширшого германського світу, тому має сенс прагнути до тіснішої співпраці з ними. Простягнімо руку та побудуємо наші імперії разом."
 NOR_printing_money_ns_desc:0 "Якщо ми хочемо вийти з тяжких тридцятих до того, як десятиліття скінчиться, знадобляться гроші — і багато!"
 NOR_promote_civilian_donations:0 "Сприяти цивільним пожертвам"
 NOR_promote_the_armed_defense_of_the_country:0 "Сприяти збройній обороні держави [NOR.GetName]"
 NOR_public_investment_drive_desc:0 "У держави [ROOT.GetName] ще багато роботи, і, схоже, її не вдасться зробити без прямих інвестицій державного сектору. Давайте заповнимо країну інфраструктурними та будівельними проєктами."
 NOR_quislings_coup_happened:0 "Квіслінг уже почав свій державний переворот"
 NOR_rasmus_hatledal:0 "Расмус Гатледал"
 NOR_repurpose_lighthouses_desc:0 "Погода та геологія зробили маяки по всьому [ROOT.GetAdjective]ому узбережжю обов'язковими та стали символом нашої нації. Ми можемо перетворити їх на маяки надії, використовуючи їх для підтримки радіолокаційного обладнання та допомагаючи нам відбиватися від загарбників."
 NOR_the_chamberlains_overture:0 "Увертюра королівського камергера"
 NOR_tobacco_industrialist:0 "Тютюновий магнат"
 NOR_tobacco_industrialist_leader:0 "Тютюновий магнат"
 NOR_vidkun_quisling:0 "Відкун Квіслінг"
 NOR_vote_of_no_confidence_desc:0 "Чи можемо ми довіряти Нюгошволду та його робітничій партії, щоб утримати більшовиків і нацистів? Це його роззброєння більше відчувається як грек, що відчиняє двері Трої, ніж прем'єр-міністра, готового захищати свою землю від комунізму. Ми не можемо дозволити вони передають нашу новонароджену націю [SOU.GetNameDef]."
 NOR_wilhelm_von_tangen_hansteen:0 "Вільгельм фон Танген Ганстеен"
 NOT_READY_TO_PLAY_MP:0 "Гравець $PLAYER|H$ не готовий"
 NO_SUBDOCTRINE_ASSIGNED:0 "Не призначено піддоктрину"
 NSB_poland_communist_events.3.a:0 "Робітники держав [Root.GetNonIdeologyName] та [From.GetNonIdeologyName], об'єднуйтесь!"
 NSB_poland_communist_events.4.b:0 "Вони не готові."
 NSB_poland_events.601.t:0 "[From.GetNameDefCap] відмовляється"
 NSB_polish_fascist_events.102.t:0 "[From.GetNameDefCap] відкидає пакт"
 NSB_polish_fascist_events.401.b:0 "Ні."
 NSB_soviet_civil_war_common.010_left_opposition:0 "Революція перемогла. Диктатуру повалено, і країною знову править пролетаріат. Культ Сталіна необхідно припинити, а всі його символи мусять бути знищені. Містам, названим на честь Сталіна і його послідовників, це потрібно дати. Сталінграду."
 NSB_soviet_civil_war_common.101.desc:0 "[FROM.GetAdjectiveCap]ий режим погодився на наше прохання і в разі потреби підтримає нашу боротьбу зі сталіністами потужним експедиційним загоном. Після закінчення боїв Владивосток відійде до наших союзників."
 NSB_soviet_civil_war_common.115.a:0 "Чудова ідея."
 NSB_soviet_communist_civil_war.002.desc:0 "$SOV_lavrenty_beriya$ був схоплений армійськими офіцерами і чекає суду. У столицю прибули війська, щоби захистити місто від будь-якої спроби повстання прихильників Берії, а його найближчих соратників зараз повсюди шукають для держави [ROOT.GetNameDef] нового лідера."
 NSB_soviet_communist_civil_war.003.t:0 "[GetSovietCivilWarName]"
 NSB_soviet_fascist_tsarist.27.a:0 "Це велика неприємність."
 NSB_soviet_fascist_tsarist.4.desc:0 "До нас дійшли тривожні новини: [FROM.GetAdjective] агітатори розповсюджують у нашій країні фашистську пропаганду, а [FROM.GetAdjective] гроші йдуть на фінансування внутрішніх фашистських організацій та політичні витрати."
 NSB_soviet_fascist_tsarist.5.desc:0 "Визнаючи схожість наших поглядів на світ, [FROM.GetNameDef] запрошує вступити до альянсу [FROM.GetFactionName], пропонуючи нам свою військову та економічну підтримку у розвитку нації!"
 NSB_soviet_foreign_politics_events.10.desc:0 "[FROM.GetAdjectiveCap]ий уряд розпочав велику програму інвестицій в економіку. У рамках цієї програми виділено кошти для будівництва мережі мостів, тунелів і доріг у столиці та за її межами. Відповідне зростання нашого будівництва, без сумніву, дасть свої плоди в майбутньому.\n\nВ уряді, однак, є ті, хто побоюється, що, прийнявши [FROM.GetAdjective] інженерів та фінансування, ми лише станемо більш залежними від цієї держави в майбутньому."
 NSB_soviet_foreign_politics_events.152.d:0 "Ми мусимо підготувати спільне з [ENG.GetAdjective] державою вторгнення"
 NSB_soviet_foreign_politics_events.2.desc:0 "Цього тижня в столиці оголосили про свій збір кілька політичних груп. Навряд чи вони хочуть озвучити якісь особливі жалю крім спільних міркувань про те, що нам треба постаратися поліпшити свої відносини з державою [FROM.GetNameDef] і прибрати з впливових постів всіх політиків, що критикують [SOV.GetAdjective] адміністрацію. Хоч і можливо, що ці демонстрації — просто спонтанне вираження народної думки, не можна не відзначити, що кілька ключових організаторів нещодавно побували в Москві і, судячи з всьому, розпочали агітацію саме після повернення звідти."
 NSB_soviet_foreign_politics_events.260.desc:0 "Після захоплення Курил і Південного Сахаліну [FROM.GetAdjective] командувач запропонував припинити вогонь і підготуватися до перемир'я. Мається на увазі, що в ході перемир'я новий кордон буде встановлений як мінімум по північних островах, а Курили відійдуть державі [FROM.GetNameDef]."
 NSB_soviet_foreign_politics_events.263.a:0 "Це помітно зрушить баланс сил."
 NSB_soviet_foreign_politics_events.264.desc_hokkaido:0 "військовий похід, і [GetAppropriateRedArmyNsName] просувається по [FROM.GetAdjective] Північним територіям, включаючи [536.GetName],"
 NSB_soviet_foreign_politics_events.273.desc:0 "[FROM.GetAdjectiveCap]ий представник у Діхуа висуває нам нову пропозицію щодо видобутку ресурсів у області [619.GetName] та поліпшення його інфраструктури. В обмін він просить можливості виплачувати [FROM.GetAdjective] викопними з Алтаю."
 NSB_soviet_foreign_politics_events.277.desc:0 "[ROOT.GetAdjective] дипломати в державі [SIK.GetNameDef] повідомляють, що наша пропозиція щодо видобутку корисних копалин та нафти в північній частині регіону [SIK.GetNameDef] прийнята. Уряд буде радий поліпшенню інфраструктури в області [618.GetName], адже ці заходи підвищать ефективність експлуатації покладів золота та срібла, які згодні поступитися нам правом на видобуток будь-яких знайдених нами в області [618.GetName] стратегічних ресурсів в обмін на [ROOT.GetAdjective] інвестиції."
 NSB_soviet_great_patriotic_war.01.desc:0 "Після [?ROOT.SOV_invader_of_ukraine.GetAdjective] вторгнення в Україну Микола Кузнєцов офіційно попросив прийняти його до лав НКВС для захисту батьківщини. З його унікальними здібностями він відмінно підійде для підтримки."
 NSB_soviet_paranoia_system_events.28.t:0 "Велике чищення молодшого офіцерського складу"
 NSB_soviet_paranoia_system_events.29.b:0 "Це безглузда різанина!"
 NSB_soviet_paranoia_system_events.39.desc:0 "Розслідування троцькістського осередку в армії явно виявило, що особливо сильно троцькісти угнездилися у флоті. Багато хто, якщо не всі адмірали потрапляють під підозру — у них була можливість співпраці з іноземною розвідкою під час зарубіжних. всі вищі адмірали, заарештовані НКВС, зізналися у тяжких злочинах, включаючи шпигунство і саботаж, після всього кількох днів допитів, оскільки в змову залучені нові й нові офіцери флоту, очевидно, що для того, щоб викорінити заразу, буде потрібна дуже ретельна робота."
 NZL_2nzef:0 "2НЗЕС"
 NZL_2nzef_desc:0 "Незважаючи на жахи попередньої війни, Нова Зеландія знову ладна йти в бій. Ми зайняті підготовкою 2-го Новозеландського експедиційного корпусу."
