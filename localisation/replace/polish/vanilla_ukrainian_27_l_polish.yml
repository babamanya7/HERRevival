 ger_fra_research_desc:0 "Скорочення часу дослідження технологій, уже вивчених іншими підписантами Франко-німецького пакту."
 germany.104.d_Corsica:0 "Італійці вимагають передачу острова Корсика з-під контролю Віші в якості розподілу залишків Франції. Чи надамо ми контроль над островом?"
 germany.104.d_Savoy:0 "Італійці почали висловлювати претензії на території Вішістської Франції за спиною нашої перемоги. Вони бажають отримати прикордонну територію Савоя, щоби посилити Італію. Однак, саме ми приймаємо рішення в цій ситуації."
 germany.122.a:0 "Вони можуть оголошувати війну, якщо посміють!"
 germany.14.t:0 "Розподіл Польщі"
 germany.200.t:0 "Нова Німеччина"
 germany.40.d:0 "Недавно були висунуті вимоги німців до Чехословаччини про передачу Судетської області, де проживає помітна кількість етнічних німців. [GER.GetLeader] розмістив війська на чехословацькому кордоні, готуючись до війни. Зараз у Мюнхені проводяться переговори між Британією, Францією, Італією та Німеччиною для досягнення мирного закінчення Судетської кризи. Якою буде позиція Британії?"
 germany.67.d:0 "Французи мудро поступилися, зрозумівши, що їхня божевільна авантюра не отримає британську підтримку. Їхні війська були демобілізовані, і війну поки що вдалося уникнути. Чорт візьми, це було близько!"
 germany.71.b:0 "Герр Гьорінг — логічний вибір."
 germany.71.c:0 "Єва Браун мусить помститися!"
 germany.84.d:0 "Як ми й підозрювали, коли підписували Антирадянський пакт, ми опинилися у стані війни з Радянським Союзом. Час нагадати нашим союзникам про їхню обіцянку та прикликати їх у війну."
