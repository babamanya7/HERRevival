 HUN_apostolic_kingdom_idea_desc:0 "Як і було проголошено протягом століть, починаючи зі Святого Іштвана, наш апостольський монарх — це істинний послідовник апостолів, що має право правити всіма християнськими землями від імені Сина. Ми повинні повернути все, що по праву наше!"
