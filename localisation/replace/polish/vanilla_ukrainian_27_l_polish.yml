 GER_german_monarchy_conservative_democratic:0 "Королівство Німеччина"
 GER_glory_to_the_imperial_army_desc:0 "Імператорська армія здобувала перемоги одна за одною та забезпечила місце Пруссії й Німеччини в Європі. Попри зраду політиків у кінці Великої війни, армія поверне собі колишню велич."
