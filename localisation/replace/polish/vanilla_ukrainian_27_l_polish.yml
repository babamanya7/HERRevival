 ENG_concessions_to_the_trade_unions_desc:0 "Наші зусилля з переозброєння постійно затьмарюються конфліктами з профспілками. Ми могли б здійснити набагато більш плавний перехід, якби вирішили співпрацювати з ними, а не продовжувати боротьбу проти них."
