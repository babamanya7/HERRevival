 ETH_peoples_army_desc:0 "Незважаючи на нашу початкову слабкість у веденні сучасної війни, нам вдалося уповільнити [ITA.GetAdjective]е вторгнення за допомогою використання нетрадиційної тактики. Ми можемо закріпити це у нашій військовій доктрині та навчити наших офіцерів тому, як вести асиметричну війну."
