 SWI_case_west:0 "План «Захід»"
 SWI_country_angry_mission_desc:0 "Схоже, що наші дії щодо інших країн інтерпретуються державою [?SWI_angriest_country.GetNameDef] як неприпустиме порушення нейтралітету. Якщо ми не заспокоїмо їх найближчим часом, вони неодмінно використають це як привід для вторгнення."
 SWI_dormant_citizen_militia:0 "Громадянські ополчення в резерві"
 SWI_expand_the_confederation_desc:0 "Жодна нація не застрахована від швидкого прогресу тоталітаризму, багато регіонів у націях навколо нас можуть скористатися захистом, який пропонує наша традиція нейтралітету, а якщо почнеться війна, наші вражаючі оборонні можливості."
 SWI_expedite_mobilization:0 "Прискорити мобілізацію"
 SWI_expedite_mobilization_desc:0 "Роль нашої невеликої постійної армії полягає в тому, щоби стримувати ворога, поки люди [ROOT.GetName] беруть до рук зброю та формують громадянське ополчення, основну частину наших сил оборони. Ось чому ми повинні переконатися, що вони можуть бути готові якомога швидше, щоби зменшити ризик розгрому нашої постійної армії."
