 SOV_recapture_lokot_to_destroy_the_autonomy_tt:0 "Якщо ми знову захопимо §Y[224.GetName]§!, §Y[220.GetName]§! і §Y[222.GetName]§!, ми зможемо швидко ліквідувати §Yавтономію Локот§!"
 SOV_recover_alaska:0 "Повернути Аляску"
 SOV_reorganize_the_pc_of_heavy_industry_desc:0 "Наш попередній зсув у бік важкої промисловості призвів до того, що стала очевидною певна неефективність в управлінні. Ми мусимо забезпечити, щоб правильні люди були поставлені на правильні місця, щоб операції знову працювали безперебійно."
 SOV_sabotage_behind_enemy_lines_decision_desc:0 "Лояльні партизани, що діють в тилу ворога, можуть бути використані для порушення комунікацій ворога в області [FROM.Getname]. Удари по командних пунктах, перерізання телеграфних дротів або зняття з рейок поїздів роблять ворога менш підготовленим до протистояння атакам наших підрозділів і збільшують шанси на успішне визволення Росії."
