 IRQ_political_events.32.a:0 "Нинішня домовленість нежиттєздатна..."
 IRQ_political_events.60.desc:0 "Зіткнувшись із зростаючим тиском з боку Союзників, узурпатори в [FROM.GetNonIdeologyName] запропонували мирне врегулювання. Вони пропонують відновити регента та відновити нашу владу в обмін на припинення воєнних дій та збереження їхньої територіальної цілісності. Хоча ця пропозиція визнає марність подальшого опору, вона знаменує значний відступ від амбіцій «Золотого квадрата» і може призвести до заворушень серед їхніх прихильників."
 IRQ_political_events.78.b:0 "Дейр-ез-Заур стоїть!"
 IRQ_promote_kurdish_culture_desc:0 "Курдський народ розкиданий по кількох націях, але наша культура пов'язує нас, незалежно від того, де ми живемо. Ми повинні просувати та захищати цю спадщину, перш ніж вона буде зруйнована тими, хто нами керує."
 IRQ_religious_resistance:0 "Релігійний опір"
 IRQ_restore_al_andalus_desc:0 "Іспанці можуть вважати себе господарями Іберії, але задовго до створення їхньої нації там був Аль-Андалус. Повернення його до ісламського світу буде поразкою, яку європейці ніколи не забудуть."
