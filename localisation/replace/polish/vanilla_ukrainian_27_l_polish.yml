 SPR_exploit_spains_riches_desc:0 "Піренейський півострів багатий на природні ресурси. Експлуатація їх значно зміцнить нашу військову промисловість, а також створить багатство, яке можна використати для відбудови нашої нації."
 SPR_faith_in_the_cause:0 "Віра в справу"
 SPR_foreign_arms_purchases:0 "Закупівлі іноземної зброї"
 SPR_fortify_la_linea_de_la_concepcion_desc:0 "La Línea de la Concepción — це перший бастіон проти ворога, який лежить позаду. Маючи адекватний захист, ми зможемо зустріти будь-яку атаку з боку Гібралтару."
 SPR_fuel_for_the_war_machine_desc:0 "Ресурси мають першочергове значення для нашої військової промисловості, і чим більше ми можемо бути самодостатніми в цих потребах, тим краще. Будуючи нові шахти, металургійні заводи та алюмінієві заводи по всій нашій країні, ми змогли б пройти довгий шлях до досягнення такої самодостатності."
