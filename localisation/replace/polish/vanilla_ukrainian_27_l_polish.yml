 denmark_protection_event.102.desc:0 "Дипломати з держави [FROM.GetNameDef] передають нам позицію свого керівництва про нашу пропозицію альянсу. [FROM.GetLeader] вважає, що якщо ми укладемо такий договір, то обов'язково почнемо втручатися в їхні внутрішні справи, і що їм такий союз невигідний. Іншими словами, нам відповіли відмовою."
