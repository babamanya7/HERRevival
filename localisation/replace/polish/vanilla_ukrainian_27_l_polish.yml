 RAJ_preamble_to_the_constitution_of_india_desc:0 "Ми, народ [GetRajName], урочисто вирішили створити [GetRajName] як суверенну соціалістичну світську демократичну республіку та забезпечити всім її громадянам: справедливість, свободу, рівність та сприяти серед них братерству в нашій установчій асамблеї цього дня."
 RAJ_princely_states_policy_desc:0 "Туземні князівства бувають різних форм і розмірів, від впливового Хайдарабада до менших князівств на Північних кордонах. Нам потрібно визначити політику щодо них."
