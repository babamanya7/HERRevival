 HUN_dockyards_desc:0 "Націлившися на відновлення наших кордонів, ми мусимо приступити до розбудови середземноморського флоту, який зможе конкурувати з нашою минулою величчю."
 HUN_expand_the_aluminum_industry:0 "Розширити алюмінієву промисловість"
 HUN_expand_the_aluminum_industry_desc:0 "Нам потрібно активно експлуатувати всі доступні ресурси — як для внутрішніх потреб, так і для експорту. Наша алюмінієва промисловість непогано розвинена, але це далеко не межа. Слід негайно направити фінансування для її подальшого розширення."
