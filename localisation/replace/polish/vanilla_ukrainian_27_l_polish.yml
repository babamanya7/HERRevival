 HUN_invite_the_habsburg_prince_desc:0 "Угорщина тривалий час перебувала під керівництвом Габсбургів, будучи частиною однієї з найбільших імперій Європи. Габсбург на угорському троні, поза сумнівом, знову зробить Угорщину великою."
