 mtg_netherlands.17.d:0 "Британці дали чітко зрозуміти, що невисока думка про нашу пропозицію створити Об'єднані Нідерланди."
 mtg_netherlands.23.d:0 "[From.GetNameDefCap] приймає нашу пропозицію передати всю Вест-Індії."
 mtg_netherlands.25.d:0 "Представники держави [From.GetNameDefCap] повідомили, що наша пропозиція їх не цікавить."
 mtg_netherlands.32.a:0 "Чудова ідея!"
 mtg_netherlands.34.d:0 "[From.GetNameDefCap] відхиляє нашу пропозицію скласти спільний план оборони. Якщо нам так потрібна допомога, ми мусимо звернутися за нею формально."
 mtg_netherlands.51.a:0 "Чудова ідея!"
 mtg_netherlands.52.d:0 "Схоже, що надані принцом Бернардом відомості дуже знадобилися нам у боях. Численними успішними операціями ми зобов'язані саме інформації, здобутої його каналами."
 mtg_netherlands.52.t:0 "Принц Бернард видобуває чудові розвіддані"
 mtg_netherlands.66.d.a:0 "Британці розширили свій вплив на нас настільки, що ми тепер змушені давати їм сприятливі умови в торгових переговорах."
 mtg_news.12.b:0 "Вкрай невдале рішення."
 mtg_news.20.b:0 "Такий розвиток подій підвищує наші шанси."
 mtg_news.24.e:0 "Британія виявила значну дипломатичну маневреність..."
 mtg_news.26.d:0 "Закулісна боротьба..."
 mtg_news.3.a:0 "Наших хлопців не посилатимуть на іноземні війни."
 mtg_news.3.desc:0 "Напруга підвищується по всьому світу, і в Конгресі США не вщухають дискусії щодо ролі, яку держава [USA.GetNameDef] має грати на світовій арені. Багато конгресменів побоюються, що президент [USA.GetLeader] може будувати секретні плани щодо втручання у європейські чи азійські війни. Деякі досі пам'ятають, яку роль країна зіграла у Великій війні, і бажають уникнути втручання у чужі справи.\n\nБажаючи залучити більше прихильників до своєї програми економічної реформи, президент [USA.GetLeader] підписав Закон про нейтралітет, який накладає серйозні обмеження на торгівлю з воюючими країнами та прямо забороняє президентові пропонувати будь-яку підтримку іншим країнам."
 mtg_news.4.t:0 "[USA.GetNameDefCap] приймає політику втручання"
 mtg_news.44.d:0 "Британці мали це передбачити..."
 mtg_news.5.a:0 "Тепер наші слова володітимуть великою вагою."
 mtg_news.50.b:0 "Вони і правда за свободу."
 mtg_news.52.b:0 "Краще [From.GetAdjective] війська, ніж хтось ще."
 mtg_usa_civil_war_democrats.20.desc:0 "Серія протестів проти президента досягла кульмінації. Вчора, після того, як маршируючі дійшли до своєї мети в центрі Бостона, вони не розійшлися по будинках, а розбилися на дрібні загони та захопили важливі об'єкти по всьому місту. До ночі вони повністю контролювали Бостон. Поліцейські здебільшого перейшли на бік протестуючих, а губернатор Массачусетсу відмовився надіслати Національну гвардію.\n\nКерівництво містом узяв до рук «Комітет громадян Бостона», який, судячи з повідомлень, співпрацює з повстанцями. Інші населені пункти Нової Англії заявили про підтримку повстанців і про те, що вони більше не зобов'язані підкорятися будь-яким законам, які підписав [USA.GetLeader]. Вони закликають уряди інших штатів оголосити про усунення президента від влади, розпустити Конгрес та провести нові вибори.\n\nХоча деякі військові підрозділи залишаються на нашому боці, більшість з них не мають наміру підкорятися наказам про придушення повстання."
 mtg_usa_civil_war_democrats.25.desc:0 "Губернатори Уайомінга, Айдахо та Монтани спільно заявили про свою підтримку Бостонського уряду. Повстанські війська з Вашингтону та Орегона вже об'єдналися зі своїми побратимами по зброї в цих штатах."
 mtg_usa_civil_war_fascists.20.a:0 "Скажіть прямо: зрада."
 mtg_usa_foreign_support.10.t:0 "[From.GetNameDefCap] схвалює створення тренувальних таборів"
 mtg_usa_foreign_support.12.desc:0 "Американські фашисти зі Срібного легіону зустрілися з лідером [This.GetLeader], щоб умовити його прийняти деяку кількість добровольців для підготовки як пілотів. Кандидатів будуть ретельно відбирати за фізичними та ідеологічними критеріями. що багато нинішніх професійних пілотів не погодяться з приходом до влади в США фашистського уряду і виступлять проти нього."
 mtg_usa_foreign_support.13.t:0 "[From.GetNameDefCap] погоджується тренувати пілотів"
 mtg_usa_foreign_support.9.desc:0 "Срібний легіон Америки звернувся до нас із проханням створити низку тренувальних таборів для підготовки добровольців. Політична обстановка в їхній країні стрімко погіршується, і вони хотіли б підготуватися до війни, яка, на їхню думку, неминуча."
 mtg_usa_house_large_opposition_tt:0 "До §Y100 представників§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_house_medium_opposition_tt:0 "До §Y40 представників§! увійдуть в §Rопозицію§!.\n"
 mtg_usa_house_medium_support_tt:0 "До §Y50 представників§! §Gпідтримають§! уряд.\n"
 mtg_usa_secure_asia.6.b:0 "Вони можуть зберегти території... на якийсь час."
 murder_trotsky:0 "Непомітне вбивство"
 murder_trotsky_infiltration_desc:0 "Використовуючи підроблений канадський паспорт, наш агент вирушить у місце проживання Троцького і потоваришує з його охоронцями."
 mutiny_event.7.t:0 "Military Crackdown succeeds."
 nationalist_victory:0 "Націоналістична Іспанія перемогла у громадянській війні"
 nato_not_suggested_yet:0 "НАТО не була запропонована"
