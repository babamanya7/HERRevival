 NAVY_REPAIR_BECAUSE_OF_REFIT_CANCEL_NOTIFY:0 "Корабель ремонтується, оскільки запланований процес переобладнання. Скасування ремонту також скасує завдання переобладнання."
 NAVY_REPAIR_POLICY_DESC:0 "Система ремонту та повернення дозволяє відправляти пошкоджені кораблі додому на ремонт без дій гравця. Налаштування пріоритету дозволяє гравцеві вибирати, що важливіше...\nПродовжити місію будь-якою ціною?\nАбо ж вижити будь-якою ціною?"
