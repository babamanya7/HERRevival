 SWE_urbanization_decision:0 "Сприяти урбанізації"
 SWE_urbanization_desc:0 "Індустріалізація та урбанізація йдуть рука об руку. Оскільки в містах з'являється більше роботи, більше людей із сіл переїжджає до них. Якщо ми хочемо, щоб міста не перетворилися на перенаселені нетрі, нам потрібно інвестувати в їх інфраструктуру та підготуватися для майбутнього зростання населення."
