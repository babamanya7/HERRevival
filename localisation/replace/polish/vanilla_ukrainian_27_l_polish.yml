 usa.10.a:0 "[Root.GetLeader] показав себе здатним лідером."
 usa.17.a:0 "Хай [From.From.GetName] знає: ми готові до війни."
 usa.24.a:0 "Повернення до демократії."
 usa.6.t:0 "Вибори [GetYear] року"
 usa.7.d:0 "З моменту заснування посади Президента Сполучених Штатів жоден президент не правив протягом трьох строків поспіль. Однак у світлі нестабільного стану світу та міжнародних подій за останні кілька років президент Рузвелт вирішив порушити традицію та балотуватися на третій термін. Республіканець Уенделл Віллкі, якого характеризують як «темну конячку» з минулим як промисловець з обмеженим політичним досвідом, критично оцінював як економічний інтервенціонізм Рузвелта, так і його виправдання балотуватися на третій термін.\n\nХоча кандидати мають багато спільного в У їхній зовнішній політиці та Віллкі хоче зберегти певну форму Нового курсу, багато хто все ще вважає ці вибори визначальним моментом для майбутнього американської демократії."
 usa.8.d:0 "Чотири роки тому президент Лендон зупинив продовження реформ Нового курсу демократів, вирішивши покладатися на силу країни, що полягає в промислових компаніях, таких як ті, які він допоміг створити до свого президентства. Рузвелт, який продовжував кампанію на користь завершення програм, які він спочатку планував на свій другий термін, тепер знову балотується на пост президента. Незважаючи на те, що він залишається популярним кандидатом, Лендон продовжує критикувати його спроби зосередити владу в руках президента, і, відповідно, сам уникає подібної політики.\n\nЗагрози за кордоном, як для нашої країни, так і для інших, залишаються реальністю і жоден з кандидатів не виступає за те, щоб Сполучені Штати закривали на них очі. Питання в тому, хто керуватиме арсеналом демократії в ці жахливі часи."
 usa.9.t:0 "Рузвелт проти Дьюї"
