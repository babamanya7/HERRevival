 ICE_joint_shipbuilding_programme_desc:0 "Наша найкраща можливість допомогти Данії — це море. Разом ми можемо захистити Північне море. Для цього нам потрібні кораблі, тому спільні зусилля зі створення флоту є природним кроком у побудові нашої стратегії військової співпраці."
