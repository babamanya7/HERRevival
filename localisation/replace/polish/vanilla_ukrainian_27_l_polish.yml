 CHL_battleship_1_desc:0 "The Almirante Latorre class consisted of two super-dreadnought battleships built in Britain for the Chilean Navy at the outbreak of World War I. Only one was finished as a battleship, with the other being converted to the HMS Eagle aircraft carrier. The ships displaced over 28,000 tons and had a main armament of ten 14 in./45 caliber BL guns. They were less armored but somewhat faster than other dreadnoughts of their era."
 CHL_carlos_huayquinir:0 "Карлос Уайкіньїр"
 CHL_claim_the_mexican_throne:0 "Посісти мексиканський престол"
 CHL_compania_sudamerica_vapores_desc:0 "CSAV — це [CHL.GetAdjective]а судноплавна компанія, наразі найбільша свого типу в Латинській Америці, а також одна з найстаріших — її було засновано в 1872 році. Її можна використати для збільшення виробництва цивільних морських суден."
 CHL_embargo_strategies_tt:0 "Ми введемо §Yембарго§! проти всіх держав, які воюють із великими §Yдемократичними§! державами світу."
 CHL_establish_trade_relationships:0 "Налагодити вигідні торговельні відносини"
 CHL_esteban_romero_sandoval:0 "Естебан Ромеро Сандовал"
 CHL_expand_the_naval_arsenal_desc:0 "Arsenales de Marina є нашим надійним виробником кораблів, і вони також допомагають нам утримувати флот у такій гарній формі, як нам вдавалося протягом останніх років, що значно перевищує якість утримання, якої досягла будь-яка інша південноамериканська країна. Тепер ми мусимо збільшити їхнє фінансування, щоби підготувати флот до війни."
 CHL_hispanic_unity_decisions:0 "Об'єднання іспанського світу"
