 PHI_militarize_the_constabulary_desc:0 "Філіппінське констеблярство було об'єднано з центральною філіппінською армією згідно із Законом про національну оборону, однак, озираючись назад, це могло бути помилкою, оскільки поліцейські сили, залишені йому на заміну, виявилися неадекватними. Натомість ми повинні відновити констеблярство, але залишити його оснащеним армійською зброєю та вишколом, щоб вони могли як служити нашій нації, так і захищати її."
