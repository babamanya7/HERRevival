 AUS_VICTORY_POINTS_11539:0 "Зиллайн"
 AUS_advanced_tanks:0 "Просунуте удосконалення танків"
 AUS_alpine_federation_focus_tt:0 "Ми запросимо держави §Y[SWI.GetNameWithFlag]§!, §Y[FRA.GetNameWithFlag]§! і §Y[ITA.GetNameWithFlag]§! в наш альянс, якщо вони §YДемократи§! або §YНейтрали§! і на даний момент вже не є частиною іншого альянсу."
 AUS_attempt_to_spur_communism_sent_flag:0 "Австрія намагалась підштовхнути комунізм в іншій країні"
 AUS_austrian_aggression_desc:0 "Хоча захист може здатися очевидним варіантом для цих часів, він означає лише очікування атаки. Якби ми натомість посилювали наші здатності до атаки та переконалися, що наша армія готова завдати удару в будь-який момент, ми могли б ефективно стримувати всяких можливих нападників. Зрештою, напад — це найкращий захист."
 AUS_austrofascism_fake_ns:0 "Австрофашизм"
 AUS_can_annex:0 "Анексувати"
 AUS_consolidate_industries_desc:0 "Наш промисловий сектор значно виріс за короткий проміжок часу, його позитивний вплив на нашу економіку та армію явно помітний. Для подальшого його зміцнення ми маємо розробити план консолідації та забезпечити найкращу ефективність і продуктивність наших промислових галузей."
 AUS_currently_coring_german_state_flag:0 "Йде інтеграція §YНімецької області§!"
 AUS_cut_ties_with_the_church:0 "Розірвати зв'язок із церквою"
 AUS_democratic_christlichsoziale_partei:0 "ХСП"
 AUS_doth:0 "Захист Вітчизни"
 AUS_extend_the_traun_line:0 "Розширити лінію Траун"
 AUS_generic_democratic_reformer:0 "Адольф Шерф"
 AUS_generic_fascist_demagogue:0 "Вільгельм Міклас"
 AUS_improve_army_logistics:0 "Покращення матеріально-технічного забезпечення армії"
 AUS_infantry_equipment_2:0 "Steyr MP34"
 AUS_intervention_in_spain:0 "Інтервенція в Іспанію"
 AUS_invest_in_alpen_elektrowerke:0 "Alpen-Elektrowerke"
 AUS_invite_danubian_countries_tt:0 "Відкриває сукупність рішень для §YЗапрошення Придунайських Країн в Дунайську Федерацію§!"
 AUS_invite_foreign_tank_designers:0 "Запросити іноземних конструкторів танків"
 AUS_light_specialization_desc:0 "Ми не можемо по-справжньому конкурувати з великими країнами, коли йдеться про більші планери, однак, маючи кращі винищувачі та штурмовики, ми зможемо гарантувати, що наш ворог навіть не досягне нашої території. Адже повітряні битви ведуться, виграються та програються в небі."
 AUS_news_events.10.t:0 "Нова громадянська війна в Австрії"
 AUS_news_events.7.desc:0 "\nПровівши більшу частину свого життя у вигнанні, спочатку в Швайцарії, а пізніше на острові Мадейра в Португалії, Отто фон Габсбург сьогодні повертається до Австрії. Принц біжав з країни в 1918 році разом зі своїми батьками, імператором Карлом I і імператрицею Зітою, в часи падіння монархій після Великої війни. Його повернення, як нового глави австрійської держави означає явну зміну політичного клімату в країні."
 AUS_payment_for_alaska:0 "Оплата за продаж Аляски"
 AUS_peoples_army:0 "Народна Армія"
 AUS_political_events.124.t:0 "[FROM.GetNameDefCap] приєднується до нас"
 AUS_political_events.13.a:0 "[AUS.GetAdjective]ий уряд забагато про себе думає."
 AUS_political_events.13.t:0 "[FROM.GetNameDefCap] виступає проти ембарго Італії"
 AUS_political_events.17.desc:0 "Як і очікувалося, [FROM.GetNameDef] погано відреагував на нашу нещодавню заборону НСРП. Вони вважають це нападом на свою власну ідеологію та висловили велике розчарування та гнів нашим рішенням. Хоча у нас були вагомі причини для заборони нацистської партії, керівництво Німецького Райху вимагає негайного скасування заборони."
 AUS_political_events.21.a:0 "Краще й бути не могло!"
 AUS_political_events.31.c:0 "Їх підтримка була занадто незначною"
 AUS_political_events.55.a:0 "По руках."
 AUS_political_events.74.a:0 "Дипломатичні зусилля були того варті!"
 AUS_political_events.9.a_tt:0 "§YВільгельм Ценер§!§R мертвий!§!"
 AUS_political_events.91.a_tt:0 "Нова Столиця буде називатися §YВадуц§!"
 AUS_political_events.91.b:0 "Навіть ерцгерцоги мусять лишатися на своєму місці"
 AUS_refuses_to_submit:0 "Відмовили нам у послуханні"
 AUS_revitalize_austrian_air_industry:0 "Відродити авіапромисловість"
 AUS_revolution:0 "Червоне небо над Віднем"
 AUS_seek_international_partners:0 "В пошуках міжнародних партнерів"
 AUS_seeks_a_deal_title_57:0 "[FROM.GetNameDefCap] відхиляє нашу запропоновану угоду"
 AUS_strengthen_legitimistische_corps:0 "Зміцнення легітимістичного корпусу"
 AUS_the_silesian_question:0 "Сілезьке питання"
 AUS_totalitarian_safety:0 "Тоталітарна безпека"
 AUS_viktor_seebauer:0 "Віктор Зеебауер"
 AUS_volkschule_desc:0 "Під час економічної кризи вважалось звичайним явищем, коли діти не ходили до школи, а змушені були працювати чи допомагати по дому. Оскільки найгірша криза вже позаду, нам потрібно впоратися з цим боргом знань, щоб не відставати від світу технологічно та науково."
 AUS_von_trapp_hired_flag:0 "Георг фон Трапп повернувся до флоту"
