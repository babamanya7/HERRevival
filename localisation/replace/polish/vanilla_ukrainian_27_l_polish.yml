 tut_11_text_1:0 "Ваші війська тепер почнуть наступ на §YАддіс-Абебу§! — столицю Ефіопії. Коли Ви окупуєте достатньо ворожих територій, вони здадуться.\n\n§YЗапустіть гру§!, натиснувши £SPACE£. Ви можете змінити швидкість гри, натискаючи кнопки £KP_PLUS£ або £KP_MINUS£. Більшість гравців налаштовує швидкість гри за потреби, а не граючи весь час на одній швидкості.\n\nПідказка: Якщо Ви відчуваєте, що могли б краще керувати військами вручну, оберіть дивізію та §Gклацніть правою кнопкою миші§! по провінціях, щоби замінити наказ, сформульований згідно з планом бою."
