 EST_anti_communist_militia_desc:0 "Серед нашого народу повно тих, хто готовий битися з більшовицькою загрозою на сході, але колишній уряд відкидав нас за зайву радикальність. Для вапсів жодні заходи по боротьбі з комунізмом не вважаються надмірними, і ті, хто готовий так само заслуговують місця в нашій армії."
 EST_baltic_defence_army:0 "Балтійська оборонна армія"
 EST_baltic_defence_army_desc:0 "$LIT_baltic_defence_army_desc$"
 EST_events.201.a:0 "Wonderful!"
 EST_formalize_baltic_entente_desc:0 "Балтійська Антанта — це угода між нами та нашими балтійськими братами про захист один одного під час війни, але щирість, із якою ця угода дотримується, в ліпшому випадку викликає сумніви. Німці та радянці дихають нам у наші потилиці, а британці знаходяться далеко від наших берегів, тому співробітництво ще ніколи не було таким життєво важливим для збереження нашої крихкої незалежності."
 EST_launch_vaps_investigation:0 "Розпочати розслідування вапсів"
 EST_prepare_covert_resistance_desc:0 "Опір — це не просто люди з гвинтівками. Це саботаж шляхів постачання, це зв'язок із союзниками, це заплутування і розсіювання ворожих військ, поки наші кулі рвуть їхні тіла. Якщо ми хочемо повернути собі батьківщину, нам треба розвивати [Root.GetAdjective]у розвідку."
