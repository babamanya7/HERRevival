 BEL_anti_tank_guns_desc:0 "Велика якість металургії [ROOT.GetAdjective] дозволила нашим механікам створювати найкращі гармати, і ми повинні використати нашу можливість створити справжніх високоточних \"звірів\"! Ми навіть можемо зробити ще крок вперед і встановити ці гармати на танки, які ми маємо."
