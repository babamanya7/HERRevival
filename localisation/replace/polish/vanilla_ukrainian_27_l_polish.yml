 AST_rural_concessions_tt:0 "\n§Y$AST_country_party_influence_uap$§! збільшить кількість голосів за партію, яка перебуває при владі, коли фокус буде завершено."
 AST_standard_gauge_line_to_darwin_desc:0 "Нам занадто довго не вистачало належного сполучення з нашими північними територіями. У рамках ширшої програми громадських робіт, спрямованої на повернення грошей в економіку, ми можемо побудувати залізницю, що з'єднає наші південні міста з північчю."
 AST_state_research_funding:0 "Державне фінансування досліджень"
 AST_strat_bomber_equipment_1:0 "Vickers Wellington"
 AST_under_the_rule_of_canberra_desc:0 "Зростання напруженості серед тихоокеанських держав викликає занепокоєння, і з огляду на те, що Британія зайнята власними справами, її здатність прийти нам на допомогу видається неправдоподібною. Якби ми реконструювали Британську Співдружність так, щоб управління країнами Тихого та Індійського океанів здійснювалося безпосередньо з Канберри, ми могли б об'єднатися в єдиний фронт — навіть без [ENG.GetNameDef]."
 AST_war_carriers_tech_tt:0 "§Y$logistics_company$§!:\n $MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-15%§!"
