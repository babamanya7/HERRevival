 WW_hungary.102.desc:0 "Після місяців протестів проти регента Горті, фашисти, натхненні заколотом Серпа та Молотка й маршем на Рим, вирушили до столиці, вимагаючи відставки Горті та передачі влади Дюлі Гьомбошу."
 WW_hungary.104.t:0 "[FROM.GetNameDefCap] вимагає контроль над Хорватією"
 WW_hungary.117.t:0 "Референдум про приєднання до [HUN.GetAdjective] держави"
 WW_hungary.16.desc:0 "Під час напруженої зустрічі з [FROM.GetLeader] нашій делегації було чітко сказано, що суверенітет над Воєводиною не підлягає обговоренню, а [FROM.GetAdjective] уряд ніколи не піддасться такому тиску. Народ Воєводини висловився ще у 1919 році, і тоді вирішив не приєднуватись до нас. Для [FROM.GetAdjective] уряду це питання вважається вичерпаним."
 WW_hungary.21.t:0 "[FROM.GetNameDefCap] передає Карпатську Русь"
 WW_hungary.27.a:0 "Будуємо спільне майбутнє!"
 WW_hungary.31.t:0 "[FROM.GetNameDefCap] призначає нам нового монарха"
 WW_hungary.33.t:0 "[FROM.GetNameDefCap] приймає монарха з династії Габсбургів"
 WW_hungary.39.desc:0 "Великий і благородний [FROM.GetLeader] з [FROM.GetNameDef] приєднався до нашого нового військового альянсу. Народ святкує — це початок нової епохи!"
 WW_hungary.69.desc:0 "Імператор [FROM.GetLeader] із [FROM.GetNameDefCap] вимагає повернення Габсбургів, як це було до об'єднання з Італією, знову коронувати монарха. Вони обіцяють більше автономії, ніж раніше. Що скажемо?"
 WW_hungary.71.desc:0 "Дегенеративне керівництво [FROM.GetNameDef] вирішило залишитися при владі, вважаючи себе розумнішими за монарха, обраного богом. Ми скинемо їх і посадимо Роберта на трон!"
 WW_hungary.95.c:0 "Янош Зічи допоможе нам піднятись"
 WW_hungary.99.desc:0 "Область [76.GetName], знана [HUN.GetAdjective] як Секейфьолд, переважно заселена їхніми братами — секеями. Вони мають власну культуру та діалект, і [HUN.GetLeader] стверджує, що регіон не повинен бути інтегрований, але має стати протекторатом під їхнім захистом. Чи погодимось ми?"
