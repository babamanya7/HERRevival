 RAJ_revisiting_inquities_desc:0 "Історичний занепад нашої Імперії був лише прискорений втручанням іноземних торговельних компаній. Є серед нас ті, хто вважає, що з нашою новою міццю, це наше право піддати наших старих ворогів тим самим несправедливостям, які вони колись чинили над нами."
 RAJ_secular_rule:0 "Світське правління"
 RAJ_secure_west_bengal_decision_desc:0 "Калькутта ізольована і нестабільна. Нам потрібно встановити контроль над регіоном, перш ніж вони встигнуть міцно закріпитися."
 RAJ_seek_intial_funding:0 "Шукати початкове фінансування"
 RAJ_sideline_the_conflict_desc:0 "Незрозуміло, чому [ROOT.GetName] має страждати через хибне судження інших та територіальну агресію. Нам потрібно зосередитися внутрішньо, а не зовнішньо."
