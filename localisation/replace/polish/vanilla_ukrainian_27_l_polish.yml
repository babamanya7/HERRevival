 GER_spawn_more_communist_militias_in_civil_war_tt:0 "У випадку §Yгромадянської війни§! буде створено §Y2 німецькі підрозділи§! у трьох ключових штатах з модифікатором §Y$GER_proletariat_uprising_modifier$§!."
 GER_stasi_modifier_desc:0 "Міністерство державної безпеки, або Штазі, забезпечить ефективний та швидкий збір, обробку та аналіз інформації щодо національної безпеки. Штазі захищатиме нашу державу від загроз як зсередини, так і ззовні, виступаючи щитом і мечем Партії."
 GER_strength:0 "\n§Y[GER.GetAdjective]і§! претензії: [?This.claim_strength_GER|G]"
