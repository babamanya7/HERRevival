 IRQ_found_the_state_company_for_iron_and_steel_desc:0 "Нещодавні інвестиції в сталеливарну промисловість принесли користь нашій економіці та зменшили залежність від імпорту. Однак ми могли б піти ще далі, створивши власні державні галузі промисловості для контролю над постачанням такої життєво важливої сировини."
