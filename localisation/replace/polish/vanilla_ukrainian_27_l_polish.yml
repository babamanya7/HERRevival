 SWI_martial_law_idea_desc:0 "Небезпечні часи вимагають небезпечних заходів. Військові повинні взяти на себе контроль, щоби гарантувати порядок і стабільність. Якщо пощастить, одного дня [ROOT.GetAdjective]у державу можна буде відновити."
