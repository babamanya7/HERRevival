 specialization_air_short:0 "Авіація"
 ss_recruitment_event.23.t:0 "Змова Гіммлера"
 ss_recruitment_event.5.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що у Франції є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS."
 stability.23.desc.a:0 "Тривожні новини надійшли до вищого військового командування: низка підрозділів нашої армії відмовляються виконувати накази вищого офіцерського складу. Хоча жоден із підрозділів не залишив своїх позицій на лінії фронту, представники солдатів чітко дали зрозуміти, що вони не підкоряться жодним наказам атакувати ворога.\n\nБунт поки що обмежився невеликою кількістю батальйонів та кількома навчальними й допоміжними підрозділами, але багато хто в Управлінні війни побоюється, що незабаром це повстання пошириться на інші підрозділи і, врешті-решт, може призвести до того, що ми виявимося нездатними продовжувати війну. Потрібні рішучі дії."
 steal_blueprints_bribe_desc:0 "Наш агент запропонує значну суму інженеру, який бере участь у проєкті."
