 workers_militia_outcome:0 "Кілька батальйонів робочого ополчення готові охороняти важливі об'єкти."
 wtt_border_conflict_won_defender.1.t:0 "Перемога в області [their_state.GetName]"
 wtt_britain.30.d:0 "Американський уряд за будь-якої підтримки американського Комітету із захисту жителів Великої Британії терміново вислав нам партію старих гвинтівок, спорядження та артилерії. Вантаж надто різнорідний, щоб виявитися корисним для регулярної армії, але він, безперечно, допоможе поспішно озброєним загонам місцевої самооборони.."
 wtt_britain_lease_azores.3.desc:0 "Посилаючись на свій заявлений нейтралітет та положення міжнародного права про військові дії, [From.GetLeader] відмовив нам у проханні надати Азорські острови. Поки ми не знайдемо спосіб залучити цю країну до війни на нашому боці, острови залишаться для нас недоступними."
 wtt_china.2.t:0 "[From.GetLeader] підкоряється"
 wtt_germany.13.t:0 "Відродження Австро-Угорщини"
 wtt_germany.18.a:0 "Повісити їх!"
 wtt_germany.26.t:0 "$GER_wilhelm_ii$ помер"
 wtt_germany.34.d:0 "Англійці повели себе розумно і погодилися на повернення кайзера, але французи у своєму божевіллі відмовляються поступитися! Вони заявляють, що бачать у цьому пряму загрозу своїй безпеці та проводять мобілізацію армії, яка будь-якої миті може перейти наші кордони! Це війна!"
 wtt_germany.44.t:0 "Японія пропонує поторгуватися за Ціндао"
 wtt_germany.50.desc:0 "Захопивши Берлін, наші війська виявили у бункері труп Гітлера. Лідер нацистів, очевидно, вважав за краще накласти на себе руки, ніж потрапити в руки ворогів, що захоплюють його країну.\n\nТепер нацистів очолив Генріх Гіммлер, який уже заявив, що уряд жодним чином не послабить своєї боротьби з «антинімецькими зрадниками»."
 wtt_germany.68.b:0 "Добровільно приєднатися до них? Ніколи!"
 wtt_infiltration.24.desc:0 "Схоже, за останні кілька місяців комуністи зазнали втрат після низки важких ударів. Наші агенти перехоплюють зростаючу кількість повідомлень зі штабу комуністів до керівників на місцях з проханням доповісти — зазвичай такі повідомлення надходять після арештів зазначених керівників або засідок. Схоже, зараз комуністів міцно притиснули, а їх організація на загальнодержавному рівні не становить особливої загрози.\n\nАле ми мусимо не втрачати пильність, оскільки поки що комуністична партія існує в будь-якій формі, вона завжди може активізуватися."
 wtt_japan.1.b:0 "Їм доведеться брати їх силою!"
 wtt_japan.108.desc:0 "Група молодих офіцерів провела низку вдалих замахів на різних урядовців та прем'єр-міністра, після чого зайняла Токіо та взяла під контроль імператорський палац. Офіцери заявили про свої наміри «очистити уряд від корупції та ідеологічної загрози», а також повернути імператору статус єдиного правителя нації.\n\nЇхня акція знайшла несподівано широку підтримку у військових колах, а виступи противників були заздалегідь припинені масовими арештами та стратами лояльних до колишнього уряду елементів. Через несподіванку і тиск обставин імператор не став осудити повсталих.\n\nОрганізований опір уряду вже втрачає чинність, і очікується, що бунтівники незабаром заявлять про повернення імператору повного контролю над усіма справами внутрішньої, зовнішньої та військової політики..."
 wtt_japan.118.a:0 "Пречудова ідея!"
 wtt_japan.22.t:0 "Обмін [Root.GetAdjective]ими генералами закінчено"
 wtt_japan.40.b:0 "Вони ще не готові правити самостійно."
 wtt_ledo_road.4.t:0 "[From.GetNameDefCap] наново відкриває Ledo Road"
 wtt_news.24.c:0 "Відчайдушний жест незгідливих французів."
 wtt_news.39.a:0 "Як і було заплановано."
 wtt_news.43.a:0 "Ми відновили життєво важливий зв'язок між океанами."
 wtt_news.44.e:0 "Що за балаган!"
 wtt_news.60.t:0 "Об'єднання Балтії"
 wtt_political_organisation.12.desc_has_majority:0 "Агенти, якими керує [From.GetLeader], розпочали кампанію політичного терору в області [state.GetName]. Ми отримали повідомлення про те, що громадян, які відкрито стали на наш бік, піддають репресіям і звинувачують у зраді. Партійних функціонерів б'ють, а деякі наші штаби спалені. Незважаючи на це, більшість місцевих жителів не бажають підкорятися терористам і продовжують підтримувати нас."
 wtt_political_organisation.4.desc_not_majority:0 "Наші агенти в області [state.GetName] доповіли, що [old_majority_country.GetNameDef] різко втрачає підтримку серед місцевого населення. [majority_country.GetNameDef], навпаки, накопичує її — у всіх великих містах області пройшли масові демонстрації в знак солідарності, а портрети, на яких зображений [majority_country.GetLeader], можна побачити в кажному селі."
 wtt_political_warlord_support.22.t:0 "[From.GetLeader] надсилає оснащення"
 wtt_political_warlord_support.3.a:0 "Аби він зберіг нейтралітет..."
 wtt_prc.1.b:0 "Ми не поведемося на цей дешевий трюк."
 wtt_prc.10.t:0 "[From.GetNameDefCap] вимагає співробітництво"
 wtt_prc.30.a:0 "Ми розворушили осине гніздо."
 wtt_warlord_vs_prc.35.a:0 "Народ став героєм!"
 wuw_GER_diplomacy.102.desc:0 "Наш запит на пакт про ненапад із [FROM.GetNameDef] було прийнято. Обидві сторони утримаються від агресії, що має сприяти стабільності."
 wuw_GER_diplomacy.102.t:0 "[FROM.GetNameDefCap] погоджується на пакт про ненапад"
 wuw_GER_diplomacy.105.a:0 "Як неввічливо!"
 wuw_GER_diplomacy.105.desc:0 "[FROM.GetAdjective]и відмовились визнавати нашу сферу впливу. Вони заявили, що самостійно вирішуватимуть, які землі належать їм. Це може призвести до напруги."
 wuw_GER_diplomacy.112.desc:0 "[FROM.GetLeader] здається розсудливим лідером, який дбає про інтереси своєї країни. Випадково, але ця нерівна угода чомусь виявляється вигідною і для нас. Ми ефективно використаємо додаткові ресурси з [FROM.GetName]."
 wuw_GER_diplomacy.34.t:0 "[FROM.GetNameDefCap] погоджується поновити оренду [743.GetName]"
 wuw_GER_diplomacy.50.b:0 "Жодної співпраці з цими прусаками!"
 wuw_GER_diplomacy.94.desc:0 "Незважаючи на наші найкращі наміри допомогти [FROM.GetAdjective] товаришам, вони вперто відмовились дослухатись. Здається, вони сприйняли це як втручання у внутрішні справи, хоча ми не мали такого наміру."
 wuw_GER_legions.6.a:0 "Війна змінила свій хід"
 wuw_GER_monroe.10.a:0 "Вперед!"
 wuw_GER_news.2.t:0 "Повстання в Сілезії"
 wuw_GER_realpolitik.1.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прибув до нашої столиці з пропозицією. Вони бажають, аби ми приєдналися до їхнього альянсу та стали частиною всіх існуючих союзів і домовленостей. Чи приймемо ми цю пропозицію?"
 wuw_GER_realpolitik.11.t:0 "[FROM.GetNameDefCap] приймає наші вимоги"
 wuw_GER_realpolitik.19.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що наші вимоги щодо територій були анульовані Версальським договором — договором, порушувати який ми не маємо права."
 wuw_GER_realpolitik.2.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 wuw_GER_realpolitik.41.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 wuw_GER_realpolitik.47.t:0 "[FROM.GetLeader] погоджується на поділ Чехословаччини"
 wuw_GER_realpolitik.53.b:0 "Ми повинні відступити..."
 wuw_GER_realpolitik.53.t:0 "[FROM.GetNameDefCap] стоїть на своєму"
 wuw_GER_reichskommissariats.21.t:0 "Керівництво Колумбуса"
 wuw_GER_weltpolitik.15.desc:0 "\n[FROM.GetLeader] з [FROM.GetNameDef], на наше здивування, вирішив передати всі колишні [GER.GetAdjective] колоніальні території назад їм, включно з тими, що знаходяться під нашим контролем. На жаль, ми не можемо нічого вдіяти, окрім як вимагати певну компенсацію."
 wuw_HUN_habsburg_ascension_in_spain:0 "Сходження Габсбургів у Іспанії"
 wuw_HUN_habsburg_ascension_in_spain_desc:0 "Габсбурги довгий час правили Іспанією. Ми повинні відновити монархію в цій країні та використати її для зміцнення Габсбурзького союзу і оточення наших супротивників у Західній Європі."
 wuw_HUN_honor_the_great_war_veterans:0 "Вшанувати ветеранів Великої війни"
 wuw_HUN_integrate_bohemian_and_austrian_industries:0 "Інтегрувати чеську та австрійську промисловість"
 wuw_HUN_invest_in_destroyer_models:0 "Інвестувати в ескадрені міноносці"
 wuw_HUN_join_the_allies:0 "Приєднатися до Союзників"
 wuw_HUN_news_events.6.b:0 "Новий ворог з’явився"
 wuw_HUN_news_events.8.c:0 "Несподівано, але приємно"
 wuw_HUN_press_maximilians_and_the_iturbides_claims_desc:0 "Мексика була проголошена імперією під правлінням династії Ітурбіде, а згодом правилася Максиміліаном фон Габсбургом під час Другої імперії, поки його несправедливо не стратили. Нинішньою спадкоємицею є Марія Йозефа Софія де Ітурбіде, яку він колись усиновив. Ми повинні допомогти їй повернути свій трон!"
 wuw_HUN_purchase_burgenland:0 "Купити Бургенланд"
 wuw_HUN_reaffirm_territorial_claims_tt:0 "Відкриває рішення §YРеінтегрувати старі угорські території§!"
 wuw_HUN_revenge_for_1919_desc:0 "У 1919 році [ROM.GetAdjective]и принизили нас у конфлікті за нашу законну Трансильванію: вони окупували регіон, захопили Будапешт і влаштували парад у нашій столиці. Ця ганьба не може залишитися без відповіді, якщо ми прагнемо відродити славу [ROOT.GetAdjective] нації."
 wuw_HUN_revenge_for_1919_tt:0 "Відкриває рішення для §Yреінтеграції старих угорських територій§! у Трансильванії"
 wuw_HUN_reviving_the_spirit_of_1848:0 "Відродити дух 1848 року"
 wuw_HUN_strenghten_the_order_of_vitez:0 "Посилити Орден Вітец"
 wuw_HUN_strengthen_the_turani_vadaszok:0 "Посилити Туранських мисливців"
 wuw_HUN_the_balkan_pact_desc:0 "Демократії Заходу занадто далеко, щоб надати нам допомогу, тому ми повинні шукати союзників ближче. Як лідери Балканського пакту, ми запропонуємо їм наш захист і поведемо до перемоги!"
 ww_BEL_event_diplomatic.15.a:0 "Ми надішлемо їм $infantry_equipment$!"
 ww_BEL_event_diplomatic.20.desc:0 "Ми отримали офіційне запрошення від [FROM.GetNameDef] приєднатися до [FROM.GetFactionName]. Це їхня нова ініціатива для заохочення співпраці в регіоні, їхня мета — стабілізувати регіон і покращити дипломатичні відносини."
 ww_BEL_event_diplomatic.33.a:0 "Ми повинні розірвати кайдани та підготуватися!"
 ww_BEL_event_diplomatic.6.a:0 "Сакре бльо! Ні!"
 ww_BEL_event_political.2.a:0 "Хіба немає кінця цій корупції?!"
 ww_BEL_event_spanish_interaction.4.t:0 "Речення [FROM.GetAdjective] на підтримку нашої боротьби"
 ww_BEL_event_spanish_interaction.8.desc:0 "Ми сподівалися, що наша пропозиція отримає позитивну відповідь, враховуючи постійну підтримку, яку ми надавали [FROM.GetAdjective]. Здається, це не так, оскільки вони відхилили нашу пропозицію, заявивши, що наша допомога є бажаною, але вони не хочуть альянсу."
 ww_BEL_event_war.5.t:0 "Капітуляція короля"
 ww_congo.14.t:0 "[FROM.GetNameDefCap] погоджується з нашими вимогами"
 ww_congo.42.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], погодився передати нам будь-які території з великою кількістю баконго, бажаючи нам удачі в майбутньому. Сьогодні великий день для нації Конго."
 ww_congo.52.desc:0 "\nНаша пропозиція про створення альянсу була холодно відхилена [FROM.GetLeader]. Ми намагалися довести нашу користь, але, на жаль, [FROM.GetNameDef] прийняло своє рішення. Хоча це дуже неприємно, ми не будемо засмучуватися, а знайдемо інші рішення."
 ww_congo.53.a:0 "Це на благо народу"
 ww_congo.66.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], вирішив скасувати нашу поточну угоду з ураном, оскільки вона виявилася занадто дорогою для [FROM.GetAdjective] нації."
 you_get_a_canton_tt:0 "Володіє більш ніж §Y24§! областями"
 yulbars_khan_fled_tt:0 "$KUM_yulbars_khan$ втік до Хотана"
