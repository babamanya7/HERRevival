 USA_war_powers_act_desc:0 "У світі, де все більш швидкі літаки несуть на борту дедалі більші боєзаряди, де існують підводні човни та хімічна зброя, обмежувати повноваження президента із захисту країни і змушувати його запитувати схвалення у Конгресу— означає накликати біду."
