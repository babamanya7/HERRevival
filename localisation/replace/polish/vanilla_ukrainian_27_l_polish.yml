 GER_unify_west_africa:0 "Об'єднати Південно-Західну Африку"
 GER_unify_west_africa_desc:0 "Нашим мріям про Міттельафріку заважає існування регіону Анголи. Щоб з'єднати наші володіння в Південно-Західній Африці з Конголезькими землями, ми маємо висунути ультиматум щодо негайного визнання нашого контролю над цією територією."
 GER_wage_war_on_capitalism_desc:0 "Капіталізм — природний ворог комунізму й має бути знищений, якщо потрібно — силою. Ми поведемо наступ проти [USA.GetNameDef], що є символом капіталізму, відкриваючи шлях до нової соціалістичної епохи."
 GER_war_against_communism_tt:0 "Здобуде ціль війни §YАнексія§! проти всякої §Yкомуністичної§! держави у світі. Нинішні цілі:"
 GER_war_against_fascism_tt:0 "Отримати ціль війни §YАнексія§! проти будь-якої §Yфашистської§! нації в §YЄвропі§!, проти якої [GER.GetNameDef] ще не має цілі війни. Поточний ефект:"
 GER_war_preparations_tt:0 "Після вступу §Y[ROOT.GetNameDef]§! у §Yвійну§!:"
 GER_wehrwirtschaft_modifier_desc:0 "Ми не можемо дозволити іноземним державам диктувати наш добробут чи майбутнє. Досягнення автаркії забезпечить економічну незалежність [ROOT.GetNameDef], зменшивши залежність від імпорту й гарантувавши самозабезпечення для нашого народу."
