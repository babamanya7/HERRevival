 BBA_SWI_annual_election.2.b:0 "Обрати [SWI_GetCouncilor2name]"
 BBA_african_union_events.13.desc:0 "[FROM.GetLeader] оголосив про вихід [FROM.GetNameDef] з Організації Африканської Єдності. Вони висловили занепокоєння щодо напрямку, в якому рухається організація, та звинуватили нас у зраді цінностей, на яких вона була заснована."
 BBA_african_union_events.22.a:0 "Вічно це тривати не може."
 BBA_african_union_events.3.a:0 "Шкода."
 BBA_african_union_events.4.b:0 "Це зашкодить нашій економіці."
 BBA_ethiopia_balance_of_power_events.23.a:0 "З кожним днем режим стає все більш безпечним."
 BBA_ethiopia_balance_of_power_events.56.a:0 "Ми мусимо скористатися цією можливістю, щоб іще більше прискорити процес централізації."
 BBA_ethiopia_communist_events.02.a:0 "Ось вам і солідарність класів."
 BBA_ethiopia_communist_events.02.desc:0 "Попри наше відчайдушне прохання, [SOV.GetNameDef] відвернулися від нас. Це, безперечно, удар, але ми продовжимо опір фашистським силам. Тепер нам слід шукати підтримку серед ширших антифашистських мереж у світі."
 BBA_ethiopia_communist_events.05.t:0 "Переворот проти [ROOT.GetLeader]"
 BBA_ethiopia_communist_events.07.b:0 "Зараз ми не можемо ризикувати великою війною."
 BBA_ethiopia_communist_events.23.t:0 "[SOV.GetNameDefCap] відступає"
 BBA_ethiopia_communist_events.34.b:0 "Це надто ризиковано"
 BBA_ethiopia_communist_events.35.desc:0 "Після того як вони допомогли нам у громадянській війні, представники [ETH.GetNameDef] звернулися до нас із проханням розпочати процес деколонізації. Вони заявляють, що якщо ми справді віримо в цінності, за які боролися під час війни, то повинні підтримати право народів Африки на самовизначення. [ETH.GetLeader] запропонував разом заснувати незалежну Республіку Риф на півночі Марокко."
 BBA_ethiopia_communist_events.41.desc:0 "[ETH.GetNameDefCap] повідомили нас, що всі наші військові радники мають негайно залишити країну. Схоже, що [ETH.GetLeader] має намір спрямувати країну на більш незалежний шлях. Якщо ми не відреагуємо найближчим часом, можемо втратити контроль над режимом у [ETH.Capital.GetCapitalVictoryPointName]"
 BBA_ethiopia_communist_events.55.b:0 "Ці зрадники мають бути негайно екстрадовані до [JAP.GetName]!"
 BBA_ethiopia_exile_events.14.a:0 "Можливо, ми зможемо це якось використати"
 BBA_ethiopia_exile_events.33.a:0 "Дратує"
 BBA_ethiopia_exile_events.40.t:0 "[FROM.GetName] просить посередництва"
 BBA_ethiopia_exile_events.53.desc:0 "Останні кілька місяців ми бачили численні зусилля, спрямовані на лобіювання підтримки серед наших господарів для надання нам допомоги у звільненні [ETH.GetNameDef]. Його Величність написав листи членам уряду та військовим, просуваючи нашу справу. Тим часом, інші вигнанці об'їжджали країни, даючи інтерв'ю та статті для багатьох газет, щоби заручитися підтримкою громадськості [?ETH.host_nation.GetAdjective]. Хоча це було важко, здається, що настрій нації зараз рухається в напрямку прямої військової підтримки для звільнення [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.59.t:0 "Поставлено допоміжне обладнання"
 BBA_ethiopia_exile_events.60.desc:0 "Танки, придбані з армійських надлишків [?ETH.host_nation.GetAdjective], передані до наших Збройних Сил. Це старі моделі, які були законсервовані протягом останніх років. Проте, вони все ще перебувають у повному робочому стані і зараз використовуються для підготовки екіпажів, готових до відправки на передову."
 BBA_ethiopia_fascist_events.55.t:0 "[ITA.GetName] відмовляється надсилати військове оснащення"
 BBA_ethiopia_fascist_events.60.a:0 "Передусім потрібно модернізувати армію."
 BBA_ethiopia_fascist_events.64.a:0 "Ми винагородимо їхню лояльність."
 BBA_ethiopia_fascist_events.68.a:0 "Яке обурливе звинувачення."
 BBA_ethiopia_imperial_events.11.desc:0 "Держава [FROM.GetNameDef] відмовилася приймати наші вимоги щодо реінтеграції. Знов і знов держава [FROM.GetName] була готова зрадити нас, щоби захистити себе. Ми не можемо допустити, щоби це сталося знову."
 BBA_ethiopia_imperial_events.4.c:0 "Нізащо!"
 BBA_ethiopia_industrial_financial_events.2.a:0 "Вони не мають права це робити!"
 BBA_italo_ethiopian_war_events.01.t:0 "Кінець Різдвяного наступу"
 BBA_italo_ethiopian_war_events.110.a:0 "Ми мусимо змиритися. Поки що..."
 BBA_italo_ethiopian_war_events.110.b:0 "Вони не наважаться щось зробити."
 BBA_italo_ethiopian_war_events.14.t:0 "Резолюція Ліги Націй про підтримку держави [ETH.GetName]"
 BBA_italo_ethiopian_war_events.15.desc_a:0 "У результаті резолюції Ліги Націй, яка дозволила підтримку держави [ROOT.GetName], з усього світу прибувають добровольці. З цих добровольців формуються інтернаціональні бригади. Сподіваємося, що їхні бойові можливості не поступаються їхньому ентузіазму."
 BBA_italo_ethiopian_war_events.500.b:0 "Нам потрібна їхня підтримка."
 BBA_italy_air_accident.12.a:0 "Удача на їхньому боці!"
 BBA_italy_anti_colonialism_events.02.t:0 "Пропозиція про припинення вогню від держави [FROM.GetName]"
 BBA_italy_anti_colonialism_events.08.a:0 "[ROOT.GetCapitalVictoryPointName] процвітає!"
 BBA_italy_anti_colonialism_events.100.desc:0 "До нас завітала делегація від держави [FROM.GetName], яка прагнула налагодити з нами тісніші зв'язки. Вони довго говорили про нашу спільну історію і про те, наскільки сильнішими ми були б, якби об'єднали зусилля один з одним. Немає сумнівів, що вони бачать себе лідерами цього можливого пакту. Хоча така угода була б вигідною на певних рівнях, ми би втратили всяку автономію."
 BBA_italy_anti_colonialism_events.103.t:0 "[FROM.GetLeader] відмовив нашим посадовцям"
 BBA_italy_anti_colonialism_events.21.a:0 "Наша робота тут завершена."
 BBA_italy_anti_colonialism_events.53.t:0 "Північна Африка голосує за вихід з держави [ROOT.GetNameDef]"
 BBA_italy_bop.1.a:0 "Це катастрофа!"
 BBA_italy_colonial_management_and:0 " та "
 BBA_italy_interaction_events.2.a:0 "Perfetto!"
 BBA_italy_interaction_events.34.t:0 "[ITA.GetName] хоче провести переговори щодо своїх претензій до Тунісу"
 BBA_italy_interaction_events.36.desc:0 "[GetItalyClaimsBalkan]"
 BBA_italy_interaction_events.40.t:0 "Ратифікація Фронту Стрези"
 BBA_italy_interaction_events.42.a:0 "Супер."
 BBA_italy_missiolinis.102.a:0 "Ганебно."
 BBA_italy_missiolinis.212.a:0 "У наш час важко знайти компетентних людей."
 BBA_italy_missiolinis.71.t:0 "Розширення військово-повітряних сил"
 BBA_italy_naval_cooperation_programs.03.a:0 "Несподівано дурний вибір."
 BBA_italy_naval_cooperation_programs.08.desc:0 "До нас звернувся уряд держави [FROM.GetName] з пропозицією продати нам кілька своїх ескортних кораблів. Деякі з цих кораблів досить старі та застарілі, але, можливо, ми ще зможемо знайти їм застосування у нашому флоті."
 BBA_italy_naval_cooperation_programs.11.desc:0 "Уряд держави [FROM.GetName] запропонував нам два своїх старих есмінці. Безкоштовно. Хоча ці кораблі можуть бути дещо застарілими, вони все ще можуть добре служити нашому флоту. Це дійсно щедрий жест. "
 BBA_italy_purge_the_party.1.b:0 "Очистити генералітет"
 BBA_swiss_expansion.11.desc:0 "Незважаючи на наші спроби створити нову націю, здатну захищатися від найбільших європейських держав, [FROM.GetLeader] висловив(ла) своє обурення нашою пропозицією."
 BBA_swiss_expansion.12.t:0 "[FROM.GetName] Висуває претензії на наші альпійські території"
 BBA_swiss_expansion.17.desc_no_alps:0 "Це радісний день для [ROOT.GetNonIdeologyName], адже [FROM.GetNameDef] погодився на нашу вимогу про незалежність. Відтепер ми вільні знову визначати власний курс і обирати зовнішньополітичні пріоритети. З іншого боку, ми маємо розраховувати лише на себе."
 BBA_swiss_expansion.8.a:0 "Це заради демократії!"
 BBA_switzerland.13.a:0 "Можливо, нам і не доведеться вторгатися"
 BBA_switzerland.16.desc:0 "Один із наших агентів у [FROM.capital.GetCapitalVictoryPointName] отримав пропозицію від [FROM.GetAdjective] уряду: таємний пакт між нашою фракцією та [FROM.GetNameDef], за яким вони допомагатимуть нам підривати наших ворогів у Європі, зберігаючи при цьому видимість нейтралітету, а згодом можуть навіть відмовитися від нього на нашу користь.\n\nЦе також означає, що ми станемо на їхній захист у разі загрози вторгнення."
 BBA_switzerland.23.t:0 "[FROM.GetNameDefCap] відмовляється нас підтримати!"
