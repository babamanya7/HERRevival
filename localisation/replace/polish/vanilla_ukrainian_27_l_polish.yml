 GER_heavy_cruiser_1_desc:0 "«Blücher» був останнім броненосним крейсером, збудованим Німеччиною. Його конструкція була інноваційною для свого часу і проклала шлях для пізніших крейсерів класу «Von der Tann». До початку Першої світової війни він уже був застарілим. «Blücher» був потоплений у бою при Доггер-банці в 1915 році."
 GER_heavy_tank_artillery_equipment_3_desc:0 "Заснований на корпусі Königstiger, він мав бути здатний встановити 170-мм гармату K 72 L/50."
