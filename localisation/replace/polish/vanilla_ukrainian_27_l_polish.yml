 extend_maginot_line_desc:0 "Наш кордон з Німеччиною захищає укріплена лінія Мажіно, але німецькі війська можуть обійти її з флангу, через Бельгію та Люксембург, як це сталося в 1914 році. Ми мусимо довести лінію укріплень до Ла-Маншу, навіть якщо заради цього доведеться пожертвувати Бельгією і віддати її на милість Німеччині."
 extra_tech_focus:0 "Додаткові дослідження"
 fabrica_material_guerra:0 "Fabrica de Material de Guerra"
 faction_goal_the_southern_mandate_desc:0 "У славному минулому ми поширювали вплив на території на південь від нас, і ми зробимо це знову. Зі статками, які можна знайти в цьому районі, немає меж тому, що ми могли б зробити."
 faction_goal_unlock_military_desc:0 "Здатність реагувати на ситуації, що розвиваються, за допомогою добре структурованих спільних оперативних груп стане життєво важливою в міру поглиблення наших альянсів. Ми повинні негайно розпочати планування цієї можливості."
