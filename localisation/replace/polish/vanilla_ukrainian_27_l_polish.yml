 CHL_radical_party:0 "РП"
 CHL_seek_foreign_investments_desc:0 "Допомога та відбудова національної промисловості за рахунок позичених коштів від іноземних держав — випробуваний і вірний метод для Ібаньєса, і цей випадок не став винятком."
 CHL_state_supporting_resistance_modifier_desc:0 "Чилі таємно постачає зброю і спорядження, а також проводить військову підготовку для місцевого опору і партизанських угруповань."
 CHL_strengthen_the_anti_fascist_coalition:0 "Заснувати Антифашистську коаліцію"
 CHL_submarine_1:0 "Клас «H»"
 CHL_the_future_of_Chile_desc:0 "Комуністична партія мусить зібратися, аби вирішити, яким шляхом рухатися в найближчі роки, оскільки нинішня «наметова» коаліція не в змозі повністю погодитися з усіма пунктами. Наразі вона стоїть між марксистом Еліасом Лафертте Гавіньйо, соціалістом Мармадуке Грове Вальєхо, сталіністом Карлосом Контрерасом Лабаркою та троцькістом Мануелем Ідальго Пласою."
 CHL_the_path_to_conquest_desc:0 "Славний акт завоювання, подібно до давніх конкістадорів, об'єднає наші народи, бо вони перебувають під контролем егоїстичних і дріб'язкових націоналістичних урядів, які не бачать ширшої картини, частиною якої вони є. Ми мусимо звільнити гіспанський народ, силою!"
 CHL_the_spirit_of_the_war_of_the_pacific_desc:0 "Якщо ми хочемо, щоби наші війська були надихнуті, ми мусимо нагадати їм про наші великі досягнення під час Тихоокеанської війни, яку ми вели проти Перу та Болівії. Ми також можемо скористатися цією можливістю, щоби підтвердити наші претензії на певні території, які наші німецькі союзники, можливо, захочуть нам надати."
 CHL_undermine_the_carabineros_de_chile_desc:0 "Карабінери Чилі колись були засновані президентом Карлосом Ібаньєсом дель Кампо і досі залишаються йому дуже відданими. Якби ми спробували створити державу на чолі з нами, вони, безсумнівно, стали б на його бік і стали б на нашому шляху. Тому ми мусимо зробити все в наших силах, щоб у них було якомога менше влади в майбутньому."
 CHL_utlilize_famae_desc:0 "Наша збройова промисловість наразі залежить від міжнародних закупівель та одиничних гвинтівок місцевого виробництва. Якщо ми хочемо наростити військове виробництво, ми мусимо переконатися, що у нас є державний виробник зброї, як-от сторічна компанія Fábricas y Maestranzas del Ejército, яку необхідно швидко модернізувати."
