 targeted_sabotage_remove_roadsigns_outcome:0 "Загін прибрав покажчики на кількох важливих перехрестях і замінив дорожні знаки в інших місцях, заплутавши цим незнайомих з місцевістю водіїв."
 tech_field_hospital3_desc:0 "Хірургічне втручання — найпоширеніша лікарська операція на полі бою. Необхідні засоби для їх проведення мають бути ближчими до лінії фронту, і ми мусимо зробити так, щоби серед військових медиків були досвідчені хірурги."
 tech_field_hospital4_desc:0 "Незважаючи на досягнення військово-польової медицини, багато винаходів зроблено нашвидкуруч, і ми не маємо спільної доктрини. Накопичивши достатньо досвіду, ми можемо точніше окреслити коло завдань цих частин і зробити тимчасові поліпшення постійними."
 tech_special_forces:0 "Сили спеціальних операцій"
 tfv_australia.2.t:0 "[From.GetNameDefCap] передає колоніальні володіння"
 tfv_australia.41.a:0 "Разом зі зброєю, проти світу, якщо треба!"
 tfv_australia.50.d:0 "Ідентифікуючись як нація робітників, вільна від старої європейської буржуазії, держава [From.GetNameDef] поступово перемістилася у [Root.GetAdjective]у сферу політики. [From.GetAdjective]ий уряд офіційно подав запит на національне членство в альянсі [Root.GetFactionName].\n\nЗ огляду на Світову революцію, [From.GetLeader] представляє бачення держав [Root.GetNameDef] і [From.GetNameDef] як два ключових полюси нового, соціалістичного світового порядку, заснованого на домінуванні держави [From.GetNameDef] в Океанії та [Root.GetNameDef] в Євразії."
 tfv_australia.52.d:0 "Після тижнів застопорених переговорів і бюрократичних складнощів стало очевидним, що в державі [From.GetNameDef] не зацікавлені дати нам остаточну відповідь щодо нашого приєднання до альянсу [From.GetFactionName].\nОскільки ми сподівалися на швидкі й остаточні переговори, [Root.GetNameDef] має підготуватися, щоби надати справжню свободу працівникам усього світу самостійно."
 tfv_australia.70.a:0 "Так, стабільність Південно-Східної Азії є пріоритетом."
 tfv_canada.3.a:0 "У нас є інші варіанти."
 tfv_canada.63.d:0 "Новий уряд [CAN.GetAdjective]ої держави зробив нам інтригуючу пропозицію щодо поступки наших територій у Ньюфаундленді. Хоча й правда, що закони нашої країни визнають неподільну державу, наші радники закликають нас розглянути можливість спалахування нового фронту, який може відволікти від ситуації в Європі."
 tfv_canada.73.t:0 "[CAN.GetName] отримує від Британії Ньюфаундленд і Лабрадор"
 tfv_new_zealand.7.desc:0 "За трагічного збігу обставин від раку помер улюблений прем'єр-міністр Нової Зеландії Майкл Джозеф Севедж, якого багато хто любив. Уся країна сумує за людиною, якій багато хто завдячує заснуванням системи соціального забезпечення Нової Зеландії. Історія запам'ятає його мужність і доброту до тих, хто його оточував."
