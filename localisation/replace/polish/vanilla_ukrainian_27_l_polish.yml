 LIT_events.802.d:0 "Схоже, що поляки ще не готові возз'єднатися з державою [Root.GetNameDef]. [Root.GetNameDefCap] намагається представити цей союз як відновлення колишньої унії, але [From.GetAdjective] міністрів це не переконує."
 LIT_iron_wolf_partisans_desc:0 "«Залізний вовк» організовується в нашій країні. Згодом вони неминуче збільшать свою підтримку серед литовського народу і, зрештою, можуть відчути наснагу вчинити державний переворот проти уряду."
 LIT_lithuanian_youth_desc:0 "Армії потрібні бійці, але зараз, коли така важлива ідеологія, нам потрібно посіяти в головах наших хлопців зерна патріотизму, щоб молоді люди, ставши дорослими і вставши під рушницю, могли з радістю віддати життя за п'ядь литовської землі."
