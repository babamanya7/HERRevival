 BUL_kaproni_bulgarski_desc:0 "Італійська авіабудівна компанія Caproni зараз стоїть перед банкрутством, намагаючися подолати нестачу ресурсів, які були спрямовані на інші виробничі лінії. Це відкриває для нас можливість придбання свого промислового комплексу «Капрони Българськи» в Казанлиці, де ми могли б зосередитися на виробництві середніх і важких бомбардувальників."
 BUL_liberalization_of_trade_policies_desc:0 "Болгарська економіка хилиться від однієї кризи до іншої з моменту її незалежності від Османської імперії. У минулому автаркічна політика виявилася неадекватною, тому настав час рухатися до економічної лібералізації."
