 WARLORDS_GATHERING_STORM_DESC:0 "Слабкість Національного уряду Китаю дає можливості для приходу до влади досить амбітним лідерам. На периферії країни місцеві лідери постворювали малі напівфеодальні держави, майже повністю ігноруючи накази Національного уряду.\n\nНасувається війна, і кожний воєначальник мусить зробити рішення: співробітництво з Національним урядом або ж альянс із комуністами? Кожен із варіантів обіцяє місце в уряді, але є й третій шлях — забрати весь Китай собі."
