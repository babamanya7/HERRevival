 INS_political_events.8.desc:0 "Солдати з [?event_target:INS_invasion_event_invader.GetName] прибули до [?event_target:INS_invasion_event_invaded_state.GetName], і наші солдати в цьому районі, значно поступаючись чисельністю, отримали наказ розпочати повну військову евакуацію [?event_target:INS_invasion_event_invaded_state.GetName]. Сили [?event_target:INS_invasion_event_invader.GetAdjective] продовжують просуватися в Індії, і наші шанси уникнути окупації виглядають похмуро."
