 SOV_if_poum_wins_tt:0 "\nЯкщо §Y$SPC_communism_DEF$ на чолі з РПМО§! переможе в громадянській війні в Іспанії, низка іспанських дивізій прийде нам на допомогу в нашій громадянській війні."
