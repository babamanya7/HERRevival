 CZE_powerhouse_of_europe:0 "Рушійна сила Європи"
 CZE_promote_moravec_writings_desc:0 "Незважаючи на те, що праці Моравця «Солдати і час» та «Оборона держави» викликали дуже суперечливі реакції, його нещодавно опублікована робота «Військове значення нашої держави в Центральній Європі» обговорювалася в щоденній пресі по всій Європі. Ми повинні заохочувати його продовжувати свою роботу як беззаперечного експерта з питань оборонної політики та військової історії."
 CZE_revive_kraljevica_designs_desc:0 "Використовуючи наші знання про канонерські човни та вивчаючи старі проєкти верфі в Кральєвиці, ми можемо відродити цей клас есмінців для нашої держави."
