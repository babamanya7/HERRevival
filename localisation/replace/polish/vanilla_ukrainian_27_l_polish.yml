 CZE_a_divided_nation_czech_states_desc:0 "Нестача кваліфікованих кадрів гальмує стрімкий розвиток промисловості в центрі нашої країни. Ми повинні інвестувати в програми покращення освіти нашого населення для роботи в нашій зростаючій промисловості."
 CZE_align_catholic_parties_desc:0 "ЧСЛ та інші католицькі партії були традиційною базою підтримки монархічної системи в Австро-Угорській імперії; настав час спробувати схилити їх повернутися до цієї позиції."
