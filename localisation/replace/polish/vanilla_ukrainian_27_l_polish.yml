 GYA_DEF:0 "Гаяна"
 HABSBURG_defensive_hussars_desc:0 "Наша відроджена гусарська сила має зазнати деяких змін, щоб бездоганно ввійти в нашу тепер більш сучасну армію. Нинішня угорська легка кіннота; погляд на сучасну гусарську армію, має бути взірцем, за яким ми формуємо нашу нову гусарську армію. Використовуючи їхній досвід і прагнучи досягти їхньої спритності та швидкості, ми зможемо створити силу, з якою варто рахуватися."
