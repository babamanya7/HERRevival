 YUG_crush_ustasa_desc:0 "Рішення уряду розправитися з фашистською групою усташів схвилювало прихильників незалежності Хорватії, і усташі швидко готуються до збройного повстання проти уряду. Якщо нам не вдасться вчасно ліквідувати цю фашистську організацію, то усташі цілком можуть здолати місцевий хорватський уряд і підняти свій прапор на знак повстання проти нашої держави."
 YUG_devolved_croatia_desc:0 "В опозиції союзу ніхто не виступає так голосно, як хорвати. Зараз Хорватія поділена між Савським банатом на півночі та Приморським банатом на півдні. Якщо ми надамо цим банатам індивідуальну автономію, ми зможемо як заспокоїти хорватську опозицію, так і не дати хорватам стати занадто впливовими в союзі."
 YUG_infantry_equipment_1:0 "Puška M24"
 YUG_infantry_equipment_3_short:0 "ZB vz. 26"
 YUG_invite_romania_desc:0 "Румуни живуть в аристократичному суспільстві, яке бачило шкоду, яку аристократія та капіталізм можуть завдати країні. Вони більше не будуть страждати від мінливих рук своїх корумпованих монархів; вони самі будуть господарями своєї долі!"
 YUG_join_axis_desc:0 "Хоча багато хто хотів би, щоб Югославія приєдналася до союзників і протистояла фашизму, ми знаємо, що це безнадійна амбіція, яка закінчиться лише війною та хаосом. Нам була надана можливість приєднатися до німців, італійців та японців у пакті про взаємне військове та економічне співробітництво, і ми повинні негайно скористатися цим."
 YUG_join_comintern_desc:0 "Найкращий шлях до просування Революції — це об'єднання з нашими співдружніми комуністичними державами в Комінтерні."
 YUG_nav_bomber_equipment_3_short:0 "IK-19"
 YUG_non_discriminating_officer_promotions:0 "Недискримінаційне підвищення офіцерів"
 YUG_recruitment_flag:0 "Хорвати вже завербовані"
 YUG_reinforce_old_alliances_desc:0 "З самого початку нашої нації ми користувалися підтримкою великих європейських демократій Франції та Великої Британії. Настав час зміцнити ці відносини для підготовки майбутніх союзів."
 YUG_ship_torpedo_sub_4:0 "6x 550-мм ТА з P.Loading"
 YUG_tank_licenses_desc:0 "Замість того, щоб витрачати обмежені ресурси на розробку власних моделей танків, ми могли б набагато ефективніше просто виготовляти іноземні моделі за ліцензією."
 YUG_ustasa_crushed_mission_desc:0 "Якщо ми зможемо посилити наш контроль над Хорватією, повстання усташ буде обійти, і всі труднощі з хорватськими націоналістами будуть приборкані, поки що."
