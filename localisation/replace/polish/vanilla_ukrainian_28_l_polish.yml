 strikes_event.4.a:0 "Слід було зробити це від початку."
 submarine_1:0 "Підводний човен I"
 subvert_india_focus_desc:0 "Британія засуджує наші зусилля щодо створення імперії, але ми покажемо, що їхня власна імперія вже руйнується. Індійські військовополонені та емігранти стануть основою руху, який скине британське панування."
