 SPA_reduce_reliance_on_foreign_resources:0 "Зменшити залежність від іноземних ресурсів"
 SPA_suspend_the_constitution_desc:0 "Ми не досягнемо прогресу, поки будемо дотримуватися конституції, яка неодноразово доводила свою помилковість і слабкість. Ми призупинимо його, відкриваючи шлях для військового перехідного уряду, який може провести нас через це необхідне братовбивство, яке, у свою чергу, зрештою звільнить місце для нового, сильного, авторитарного уряду."
