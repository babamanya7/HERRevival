 SDL_CZE_communism_subject:0 "Крконосько-Єсеницька комуна"
 SEA_PHI_political_events.48.desc.5:0 "Раніше сьогодні ми отримали повідомлення про порушення в [FROM.GetNameDef]. Після цього ми отримали декларацію незалежності від їхнього уряду з чіткою заявою про підтримку від [SPR.GetAdjective]ого уряду та деяких південноамериканських урядів. Хоча заява закликає нас не втручатися, [FROM.GetAdjective]ий уряд чітко дав зрозуміти, що вони не ухилятимуться від боротьби за збереження своєї нової незалежності, маючи підтримку своїх іспаномовних союзників."
 SEA_PHI_political_events.53.a:0 "Його досвід напевно стане в нагоді"
 SEA_PHI_political_events.58.t:0 "[FROM.GetName] відмовляється делегувати флот"
 SEA_PRC_border_war_events.1.a:0 "Наша сила зростає!"
 SEA_PRC_faction_events.30.t:0 "[FROM.GetNameDefCap] вимагає перерозподілу землі"
 SEA_PRC_faction_events.52.desc:0 "Ми щойно отримали звістку від [FROM.GetLeader], що [FROM.GetNameDef] вирішив вийти з [ROOT.GetFactionName] і об'єднати сили з [PRC.GetNameDef]. Яке божевілля змусило [FROM.GetLeader] прийняти таке безглузде рішення, невідомо, але якщо вони хочуть накликати на себе труднощі та руїну, хто ми такі, щоб стояти у них на шляху?"
 SEA_PRC_faction_events.52.t:0 "[FROM.GetNameDefCap] залишає [ROOT.GetFactionName]"
 SEA_PRC_fourth_army_incident.5.desc:0 "Ми отримали повідомлення, що Нова 4-та армія зазнала майже повного знищення після того, як її оточили сили націоналістів під час відступу, до якого наше командування не хотіло приєднуватися. Дані про те, як почалися бої, розмиті, але те, що могло початися як інцидент з дружнім вогнем, незабаром перетворилося на криваву бійню, коли обидві сторони запідозрили, що зазнали навмисного нападу."
 SEA_PRC_misc_events.9.desc:0 "Після поразки [JAP.GetNonIdeologyName] Комуністична партія Китаю зібралася, щоб обговорити шлях уперед. 7-й з'їзд знаменує собою перший національний з'їзд з 1928 року, а також повернення до зустрічей на китайській землі, оскільки попередній з'їзд проводився в Москві через ослаблення партії. Обговорювані питання включали успіхи та невдачі нашої тактики проти [JAP.GetAdjective]их військ. Інші пункти включали прийняття нової конституції, яка має на меті втілити бачення [ROOT.GetLeader] щодо того, як найкраще вести нашу націю вперед."
 SEA_PRC_request_aid.4.b.tt:0 "Ми погодимося надіслати §R50 танків Т-34§! до §Y[FROM.GetName]§!"
 SEA_PRC_zhang_guotao_events.5.desc:0 "$PRC_zhang_guotao$, «колишній» комуністичний лідер і політичний суперник $PRC_mao_zedong$, звернувся до [ROOT.GetLeader] з проханням приєднатися до нашої сторони у боротьбі проти іноземної агресії. Названий «колишнім» комуністом через нещодавнє засудження ним лідерства [PRC.GetLeader] у Центральному комітеті, Готао з того часу залишив партію і тепер прагне приєднатися до нас. Його досвід може бути корисним, але [PRC.GetNameDef], безсумнівно, буде розлючений через те, що ми дозволили приєднатися тому, кого вони вважають зрадником."
 SEA_border_incidents_events.8.desc:0 "Після того, як ми зайняли село Тауран, схоже, що [FROM.GetAdjective]і сили відійшли з околиць і не виказують ознак наміру повернутися. Визнаючи марність подальших наступів, [JAP.GetAdjective]і військові визнали, що село лежить на [ROOT.GetAdjective]ій території."
 SEA_china.16.t:0 "[From.GetName] надав нам права на якірну стоянку"
 SEA_china.6.desc:0 "Відповідь на наші благання надійшла від [FROM.GetNameDef], яка вирішила покинути нас напризволяще. Підтримки не буде, кошти не будуть виділені. Ми стоїмо наодинці перед обличчям агресії, як це було багато разів раніше. Ми переможемо, тому що якщо ми цього не зробимо, наша спадщина буде забута."
 SEA_china_democratic.1.a:0 "У CPWDP є хороші кандидати"
 SEA_china_democratic.1.b:0 "Чжан Цзюньмай показав свою цінність"
 SEA_china_democratic.11.t:0 "[FROM.GetNameDefCap] приймає наше скромне прохання"
 SEA_china_improvement.2.desc:0 "Визнаючи розкладницький вплив торгівлі опіумом на державну владу та суспільну довіру, ми повинні розпочати довгострокову кампанію зі зменшення впливу опіумних синдикатів. Чиновникам доручено проводити суворіші перевірки, кадрові перестановки та кампанії з інформування громадськості; жоден із цих заходів не принесе плодів миттєво. Проте кожен крок послаблює тіньові мережі, що живляться вразливістю [CHI.GetAdjective]ої держави."
 SEA_china_warlords.4.b:0 "Ніколи!"
 SEA_imperial_influence_events.150.desc:0 "Армія висунула свої вимоги. Схоже, вони прагнуть розширити можливості виробництва моторизованої техніки та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми будували більше вантажівок для задоволення їхніх потреб у розширенні. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.400.t:0 "Цивільний уряд втрачає вплив"
 SEA_imperial_influence_failure_event_option_2:0 "Навіть Місяць спадає, але повертається"
 SEA_japan_air_accidents_events.01.t:0 "Трагічна смерть $JAP_isoroku_yamamoto$"
 SEA_japan_foreign_policy.108.b:0 "Ми будемо уважно стежити за ними"
 SEA_japan_foreign_policy.112.t:0 "[FROM.GetNameDefCap] вимагає контролю над нашими азійськими колоніями"
 SEA_japan_foreign_policy.113.t:0 "[FROM.GetNameDefCap] передає свої азійські колонії"
 SEA_japan_foreign_policy.121.a:0 "Ох..."
 SEA_japan_foreign_policy.124.a:0 "Разом ми будемо сильнішими"
 SEA_japan_foreign_policy.128.b:0 "Ми будемо битися до останнього!"
 SEA_japan_foreign_policy.128.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] вимагає, щоб наша незаконна сепаратистська держава знову підкорилася правлінню центральної влади в Токіо і повернулася до [FROM.GetAdjective]ої сфери. Як нам реагувати на цю очевидну загрозу?"
 SEA_japan_foreign_policy.131.b:0 "Ми повинні зупинити це божевілля!"
 SEA_japan_foreign_policy.132.t:0 "[FROM.GetLeader] вимагає нашої покори"
 SEA_japan_foreign_policy.21.t:0 "[FROM.GetNameDefCap] далі реорганізовує наш уряд"
 SEA_japan_foreign_policy.3.desc:0 "[FROM.GetLeader] відмовився поступитися нашим вимогам, незважаючи на те, що він бачив, що ми зробили з Німа-одсором, коли той виступив проти нашого божественного правителя. Можливо, настав час дати їм урок смирення."
 SEA_japan_foreign_policy.33.t:0 "[FROM.GetLeader] приймає наші вимоги"
 SEA_japan_foreign_policy.44.desc:0 "Нерозумно, [FROM.GetLeader] з [FROM.GetNameDef] вирішив вчинити безчесно, відкинувши нашу велику пропозицію. Альянс скасовано, і Квантунська армія знову поклала око на північний Китай. Можливо, саме зараз необхідне коригування нашої зовнішньої політики."
 SEA_japan_foreign_policy.45.t:0 "[FROM.GetNameDefCap] вимагає економічної інтеграції"
 SEA_japan_foreign_policy.5.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 SEA_japan_foreign_policy.53.a:0 "Ми повинні бути напоготові!"
 SEA_japan_foreign_policy.53.desc:0 "У межах наших кордонів було помічено агентів, які, ймовірно, діють за наказом [FROM.GetAdjective]их спецслужб і, схоже, намагаються встановити контакт із дворянами та заманюють наших громадян великими обіцянками співпроцвітання. Схоже, у них є плани щодо народу Монголії."
 SEA_japan_foreign_policy.56.t:0 "Маньчжурських партизанів помічено на сході"
 SEA_japan_foreign_policy.63.t:0 "Об'єднання з [RNG.GetNameDef]"
 SEA_japan_foreign_policy.7.a:0 "Поміркувавши, ми повинні просто підкоритися зараз"
 SEA_japan_foreign_policy.71.a:0 "Вони впадуть від нашого клинка!"
 SEA_japan_foreign_policy.89.b:0 "Зараз не найкращий час"
 SEA_japan_popup_events.11.a:0 "Накази будуть віддані, але намагайтеся не залишати доказів"
 SEA_japan_popup_events.21.desc:0 "На диво, китайці вирішили відступити після ультиматуму, надісланого щодо контролю над Шанхаєм. Вони розуміють, що гнів із нашого боку має високу ціну, і погодилися на значні територіальні поступки, які включають саме місто та прилеглі регіони. Крок за кроком Китай стає нашим."
 SEA_japan_popup_events.27.t:0 "Золота можливість"
 SEA_japan_popup_events.35.b:0 "Ні, губернаторство має залишитися!"
