 PRC_agrarian_socialism_desc:0 "Китай не схожий на промислові держави Заходу. Чекати на здійснення комуністичної революції відповідно до вчень Маркса означає не розуміти ситуації, в якій перебуває країна."
 PRC_agricultural_reform_boom_desc:0 "Ми повинні забезпечити безпеку нашим фермерам, щоб вони відчували достатнє заохочення для вирощування врожаю, необхідного нашій нації."
