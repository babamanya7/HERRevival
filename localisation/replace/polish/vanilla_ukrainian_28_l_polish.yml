 iceland_events.20.t:0 "[ICE.GetName] вимагає повернення Гренландії"
 iceland_events.7.desc:0 "Наша декларація рівного становища з Данією не викликала протестів, якщо не брати до уваги кількох буркотливих ремарок у данському парламенті. Данці розуміють нашу позицію, і, з огляду на той факт, що ми разом ведемо війну, вони згодні, що майбутня співпраця важливіша за старі феодальні реалії та націоналістичну гордість. Король Крістіан, як ми і просили, зрікся титулу короля Ісландії. Тепер ми повністю суверенна держава. Треба, однак, вирішити, що робити з монархією, адже зараз ми — монархія без короля."
