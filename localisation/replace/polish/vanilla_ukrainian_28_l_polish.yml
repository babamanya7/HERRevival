 CHI_three_princpals_reorganized_idea_desc:0 "Засновник Республіки, доктор Сунь Ятсен, встановив три фундаментальні принципи, які повинні її формувати: Міньцзу, Міньцюань і Міньшен — Націоналізм, Демократія і Народний добробут. Хоча це не зовсім відповідає нашому підходу до тридемізму, ми все ж повинні намагатися використовувати їх на свою користь."
 CHI_unify_as_the_china_democratic_league:0 "Об'єднатися як Демократична ліга Китаю"
 CHI_wang_jingwei:0 "Ван Цзінвей"
 CHI_war_of_anti_imperialism_desc:0 "Звільнивши наші землі від окупантів, ми дамо бій ворогові на його території, щоби захистити себе від майбутніх вторгнень."
 CHI_wei_lihuang:0 "Вей Ліхуан"
 CHI_women_in_the_war_effort_desc:0 "Після Руху 4 травня роль жінок у суспільстві змінилася назавжди. Приймаючи сучасність і любов до своєї країни, жінки також повинні мати можливість зробити свій внесок. Організація жіночих батальйонів та інтеграція їх у збройні сили значно допоможе нам."
 CHI_zhonghua_minzu_focus_2_tt:0 "Замінює §Y$CHI_the_political_tutelage_dm$§! на §Y$CHI_the_political_tutelage_upgraded_dm$§!, ефективна зміна:"
 CHL_align_the_marxists_desc:0 "У нашій країні є багато людей, які вважають нинішню структуру влади слабкою, але багатьох із них можна досить легко переконати підтримати уряд, якщо президент лівого спрямування звернеться до них із проханням."
 CHL_army_modifier:0 "$SMB_army_CHL$"
 CHL_bartolome_blanche:0 "Бартоломе Бланче"
 CHL_crusade_against_imperialism:0 "Священна війна проти імперіалізму"
 CHL_enaer:0 "ENAER"
 CHL_expand_the_forestry_desc:0 "Центральні регіони нашої країни, особливо Арауканія, багаті на деревину. Хоча є й ті, хто виступає проти розширення промислу в регіонах, це необхідно, якщо ми хочемо, щоби наша країна коли-небудь відчула економічну безпеку, а отримання деревини та розчищення земель — це найшвидший шлях до цього."
 CHL_heavy_cruiser_1:0 "Клас «O'Higgins»"
 CHL_hispanic_union_communism:0 "Союз іспанських народів"
 CHL_ibanez_ruling_by_decree_mission:0 "Ібаньєс править за указом"
 CHL_jorge_alessandri:0 "Хорхе Алессандрі"
 CHL_la_corporacion_araucania_desc:0 "Арауканська корпорація на чолі з консерватором і корпоративістом Венансіо Конюепаном Уенчуалом, онуком відомого вождя абахіно, може виявитися корисним союзником для об'єднання проти чилійської держави."
 CHL_nacista_insurgency_decisions_desc:0 "Нацисти на чолі з Хорхе Гонсалесом фон Мареесом збирають підтримку та викликають нестабільність усередині нашої країни, і розвідка доповідає, що не дуже багато часу залишилося до того, як вони спробують здійснити повномасштабне повстання, або, можливо, державний переворот."
 CHL_new_fatherland_ADJ:0 "Чилійськ"
 CHL_new_fatherland_neutrality:0 "Королівство Патрія-Нуева"
 CHL_oppressed_working_class_desc:0 "Із нашим жорстоким придушенням усього, що хоч трохи схоже на комунізм, профспілки більше не можуть діяти в країні, а робітничому класу можна наказувати виконувати нашу волю, не даючи йому можливості належним чином протестувати, щоби не порушити закон про постійну оборону."
 CHL_pan_hispanic_rhetoric_2:0 "$CHL_pan_hispanic_rhetoric$"
 CHL_political_events.11.t:0 "[GER.GetName] надає нам компенсацію"
 CHL_political_events.12.desc:0 "[GER.GetLeader] влаштував одну зі своїх звичайних тирад, стверджуючи, що чилійський уряд слабкий розумом та крихкий, і що немає потреби надавати компенсацію країні, яка не має великої внутрішньої цінності. Ми не маємо можливості спростувати ці претензії наразі, а ескалація була б дитячою..."
