 SIA_pan_thaiism_desc:0 "Для [ROOT.GetName] недостатньо лише жити, вона повинна процвітати. Майбутнє [ROOT.GetAdjective] народу полягає не в тому, щоб змиритися з роллю третьосортної держави, а в тому, щоб стати активним гравцем у світових справах. Спочатку серця і уми людей повинні бути згуртовані проти імперіалістів, які відібрали те, що колись належало нам, і нагадати людям про те, що у нас забрали."
