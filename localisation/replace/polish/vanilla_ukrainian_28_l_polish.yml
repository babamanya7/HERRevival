 take_claimed_state:0 "Захоплення за претензією"
 taog_news.2.a:0 "Це може спричинити великі зміни у світі."
 targeted_sabotage_collapse_tunnel_outcome:0 "Знайшовши слабкі місця в конструкції, загін встановив вибухівку і залишив місце операції. Збитки, завдані тунелю, усунемо, але на те, щоб тунелем знову можна було користуватися, піде час"
 targeted_sabotage_organize_more_meetings_desc:0 "З бесіди з робітниками стало ясно, що проведення нарад з будь-якого незначного приводу помітно знижує темпи виробництва з мінімальними витратами зусиль з боку наших агентів."
 tech_engineers2_desc:0 "Обладнані сучасним обладнанням та потужною вибухівкою, наші інженери виконують не тільки звичні для них завдання. Вони можуть здивувати супротивника своїми знахідками як на землі, так і на морі."
 tech_recon:0 "Розвідрота I"
 tech_signal_company:0 "Рота зв'язку I"
 test_the_chinese_focus_desc:0 "Китайці досі не визнають наше звільнення Маньчжурії, і напруженість на кордоні поблизу Пекіна вже вилилася в кілька сутичок. Якщо підлаштувати інцидент, то можна роздмухати його до повномасштабної війни. Він стане зручним приводом, щоби розквитатися з цим!"
 tfv_australia.22.t:0 "[From.GetNameDefCap] відмовляється від нашої пропозиції об'єднання"
 tfv_australia.80.t:0 "Пропозиція з-за моря"
 tfv_australia.96.a:0 "Даймо відсіч націоналістичним покидькам!"
 tfv_canada.2.t:0 "Північноамериканський альянс засновано"
 tfv_canada.22.a:0 "Ми покажемо їм, що справді означає велич."
 tfv_canada.3.d:0 "Незважаючи на переваги формалізованої військової співпраці між нашими двома країнами, прикладом якої є Рада спільної оборони, [From.GetAdjective]а влада відхилила наші переговори про постійний союз.\nПакт забезпечив би цілісність Північної Америки, але тепер, схоже, нам доведеться шукати інші засоби для захисту батьківщини."
 tfv_canada.30.b:0 "Підтримати республіканців."
 tfv_canada.42.desc:0 "[MEX.GetAdjectiveCap]ий уряд відхилив нашу пропозицію працювати разом проти нашого спільного супротивника. Здається, він уважає, що може просто ігнорувати гримучу змію, яка готова вдарити по ньому, сподіваючися, що та залишить їх у спокої, доки вони не робитимуть жодних загрозливих кроків. Схоже, що ми мусимо дбати лише про власну оборону."
 tfv_canada.70.desc:0 "[FROM.GetLeader] звернувся до нас після голосування, яке відбулося в канадському парламенті, з проханням підписати зміни до попереднього Закону про Британську Північну Америку, і крізь нього проголосити союз між державою [FROM.GetNameDef] та колонією Ньюфаундленд і Лабрадор."
 tfv_new_zealand.4.desc:0 "Побачивши міць нашої непереможної армії, уряд держави [NZL.GetName] вирішив, що їм краще бути на нашому боці конфлікту. Питання в тому, чи повинні ми їм це дозволити."
 tfv_south_africa.100.t:0 "Свобода для держави [WES.GetName]"
 tfv_south_africa.13.desc.a:0 "Наша делегація до держави [GER.GetNameDef] повернулася з порожніми руками. Незважаючи на теплі слова від [GER.GetAdjective]ого уряду, вони не змогли отримати жодних твердих зобов'язань щодо підтримки. Схоже, що ми більше не можемо розраховувати на допомогу німецького уряду в нашій боротьбі."
 tfv_south_africa.62.d:0 "Звільнившися з-під влади колоніальних гнобителів, [COG.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [COG.GetAdjective]ого уряду."
 tfv_south_africa.75.t:0 "Свобода для держави [DJI.GetName]"
 tfv_south_africa.99.d:0 "Звільнившися з-під влади колоніальних гнобителів, [MRT.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [MRT.GetAdjective]ого уряду."
 the_day_of_sacrifice:0 "День пожертви"
 the_dragon_king:0 "Король-дракон"
 the_long_lance_desc:0 "§LЯпонська торпеда «Type 93», прозвана «Довгим списом», була найдосконалішою торпедою свого часу, яка не мала західних аналогів. Вона легко знищувала малі кораблі та завдавала ефективних пошкоджень більшим броньованим кораблям у радіусі дії.§!"
