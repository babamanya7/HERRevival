 RULE_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES_HOL_AI_DESC:0 "§HНідерландський§! ШІ намагатиметься зберегти демократію та повести малі демократії Європи до створення Європейського Союзу, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_FASCIST_LAT_AI_DESC:0 "§HЛатвійський§! ШІ намагатиметься встановити фашистський уряд, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_GROUP_USA:0 "Сполучені Штати"
