 SUBDOCTRINE_NIGHT_BOMBING_DESC:0 "Всупереч Дуе, бомбардувальник насправді не завжди проривається. Нічні польоти знижують нашу точність, але значно покращують виживаність наших літаків та екіпажів."
 SUBDOCTRINE_PARATROOPERS_1:0 "Sabotage Parties"
 SUBDOCTRINE_SCREEN_CONVOY_ESCORT_DESC:0 "Головний обов'язок легких кораблів — забезпечувати морську торгівлю, від якої залежать усі наші військові зусилля. Усе інше є другорядним."
 SUBDOCTRINE_SUBMARINE_WOLFPACKS_DESC:0 "Полювання розсіяне — удар злагоджений. Наші підводні човни можуть розійтися, щоб охопити величезні простори океану, а потім сигналізувати один одному про зближення, коли помічена підходяща здобич."
