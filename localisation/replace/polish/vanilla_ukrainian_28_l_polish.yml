 JAP_machida_chuuji_focus:0 "Прем'єрство Мачіди Чюджі"
 JAP_mechanized_equipment_3_short:0 "Type 4 Ka-Tsu"
 JAP_mio_trait_type_97_torpedo_control_director:0 "Торпедний командно-далекомірний пост «Тип 97»"
 JAP_modernize_agriculture_desc:0 "Наш аграрний сектор такий же важливий, як і промисловий. Зрештою, наша промисловість не працюватиме, якщо ми не зможемо прогодувати всіх у нашій країні. Тому ми повинні інвестувати в розробку нових інструментів та покращувати дорожні мережі, що з'єднують наші села з містами."
 JAP_morihei_ueshiba:0 "Моріхей Уешіба"
 JAP_nagoya_arsenal_organization:0 "$nagoya_arsenal$"
 JAP_naval_armaments_program_desc:0 "Щоб наші верфі та промисловість встигали за нашими амбіціями, що постійно зростають, наш флот розробив нові плани розширення в рамках Програми швидкого поповнення морських озброєнь. Це включає нові військові кораблі та має на меті розширити флот щонайменше до 293 морських суден."
 JAP_naval_faction_demands_strike_south_happen_mission:0 "$JAP_naval_faction$ вимагає, щоб ми завдали удару на південь"
 JAP_new_order_in_east_asia_faction:0 "Новий порядок у Східній Азії"
 JAP_ni_go_nuclear_project_desc:0 "Армійський комітет започаткував експериментальний проєкт у Рікен, який вони назвали проєктом Ні-Го. Його мета — виділення урану-235 шляхом термодифузії, ігноруючи альтернативні методи, такі як електромагнітне розділення, газова дифузія та центрифугування. Сподіваємось, ми скоро зможемо навчитися використовувати це у військових цілях."
 JAP_nobuhito_takes_up_the_throne_tt:0 "§YНобухіто§! замінить §YХірохіто§! у розділі Імператорського впливу"
 JAP_occupy_east_timor_desc:0 "Тиморці, хоч і не беруть участі в нашій війні, все ж мають бути взяті під наше крило заради майбутнього Азії. Наші війська готові на островах, і ми готові увійти швидко, без оголошення війни, сподіваючись, що це залишиться непоміченим."
 JAP_open_up_the_universities_desc:0 "Освіта має бути доступна кожному — незалежно від її походження та соціального статусу."
 JAP_overhaul_the_education_system_desc:0 "У системі освіти все ще домінують ідеї та звичаї минулого, що пропагують націоналістичні та патріотичні думки. Ми повинні швидко виправити це і реформувати систему освіти, щоб належним чином навчити нашу молодь, як самим стати революційними лідерами."
 JAP_prepare_for_peninsular_warfare:0 "Підготовка до війни на півострові"
 JAP_produce_bullet_stamps_decision:0 "Випускати марки «кулі»"
 JAP_pure_buddhist_land_tag_communism_DEF:0 "Чиста Земля"
 JAP_riken_institute_director:0 "Директор інституту RIKEN"
 JAP_rikken_minseito_victory:0 "Перемога Ріккен Мінсейто"
 JAP_rikken_seiyukai_leader:0 "Лідер Ріккен Сейюкай"
 JAP_sanzo_nosaka:0 "Сандзо Носака"
 JAP_sea_greater_east_asian_co_properity_sphere_desc:0 "Ми повинні створити союз в Азії, щоб забезпечити економічну самодостатність і співпрацю між державами-членами, а також протистояти впливу західного імперіалізму та радянського комунізму. Звісно, це також ефективний пропагандистський інструмент для зміцнення нашої гегемонії на континенті."
 JAP_sea_long_operational_range:0 "Великий радіус дії"
 JAP_sea_sturdy_aircraft_tt:0 "Зменшує шанс цілеспрямованих повітряних атак проти певних персонажів"
 JAP_southern_expansion:0 "Південна експансія"
 JAP_sp_naval_super_heavy_battleship:0 "Лінкор класу «Yamato»"
 JAP_sp_rocket_interceptor:0 "Mitsubishi J8M Shūsui"
 JAP_state_shinotism_dm_desc:0 "З часів реставрації Мейджі ми прагнули використовувати поклоніння в шінтоїстських храмах для просування імперської вірності та допомоги в державному будівництві. Це дозволило нам побудувати країну, яка готова пожертвувати багатьом в ім'я держави."
 JAP_subdue_the_kwantung_army_tt:0 "§GПриборкує§! §YКвантунську армію§! і гарантує, що вони не зможуть діяти незалежно від бажань нашого уряду"
 JAP_sue_for_peace_nuke_mission_desc:0 "Нещодавнє успішне випробування ядерної бомби пропонує альтернативу повномасштабному вторгненню на Японські острови. Розвідка припускає, що якщо ми відірвемо контроль над Окінавою та Іводжімою в японців і зменшимо їхній флот лише до 30 кораблів, швидкий послідовний удар ядерними бомбами по двох місцях на Японських островах змусить японський уряд беззастережно капітулювати."
 JAP_supremacy_of_will:0 "Верховенство волі"
 JAP_the_co_prosperity_sphere_decisions:0 "Сфера співпроцвітання"
 JAP_the_footsteps_of_jimmu_desc:0 "Наш легендарний засновник, імператор Джімму, розпочав військову експедицію з Хюга біля Внутрішнього Японського моря, захопив Ямато і встановив це місце як свій центр влади. Він почав Великий східний похід, який значно розширив наші території, керований Ятагарасу, богом-вороном. Як цей божественний воїн колись завойовував в ім'я богів, так і ми будемо."
 JAP_the_koiso_cabinet_desc:0 "Оскільки Імператор висловлює дедалі більшу недовіру до здібностей [ROOT.GetLeader] та Імперських збройних сил Японії, він виявив бажання об'єднати націю та шукати вихід із війни, щоб уникнути остаточного знищення держави. Хоча Койсо непопулярний кандидат серед політиків і генералів, він може мати здатність вивести країну з конфлікту."
 JAP_the_long_march_to_victory_idea:0 "Довгий марш до перемоги"
 JAP_the_ultimate_battleship_desc:0 "Оскільки ми не купаємось у ресурсах, необхідно інвестувати їх з розумом. Ми побудуємо найпотужніший лінкор на планеті, здатний у відкритому бою здобути гору над будь-яким противником."
 JAP_to_rival_the_comintern_desc:0 "З часу створення троцькістами Четвертого Інтернаціоналу багато хто закликав до створення П'ятого Комуністичного Інтернаціоналу, який би діяв як противага і йому, і Комінтерну. Ми повинні взяти на себе цю роль і проголосити себе справжніми захисниками революції!"
 JAP_torpedo_cruisers_desc:0 "Ми створимо новий клас кораблів, здатних нести безліч наших нових потужних торпед і завдавати нищівних ударів по ворожому флоту."
 JAP_unsinkable_aircraft_carriers:0 "Непотоплювані авіаносці"
 JAP_war_with_soviet_union_desc:0 "Наші союзники в Європі підписали договір про ненапад із державою [SOV.GetNameDef]. Проте наша війна не може чекати; ми повинні в односторонньому порядку продовжувати конфлікт з комуністами, навіть якщо це ризикує відштовхнути наших союзників."
