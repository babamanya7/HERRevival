 BUL_cooperation_bolster_zveno_desc:0 "Після нашої успішної співпраці ми дамо фракції [GetZvenoName] певні привілеї і дозволимо його вигнаним учасникам повернутися і знову вступити до своєї організації."
 BUL_corporatism_desc:0 "Натхнені італійською моделлю, робітники та капіталісти з різних секторів економіки мусимо брати участь у виробленні національної політики, щоби ми могли виступати посередником між цими групами та проводити найбільш вигідні реформи для національної економіки."
 BUL_dominance_in_the_adriatic_black_sea_failure:0 "Удар, який ми зазнали після провалу нашої місії із забезпечення Чорного моря, призвів до потьмарення настроїв болгарського населення, єдиний спосіб вирішити це — забезпечити, цього разу успішно, болгарське панування в Адріатиці."
