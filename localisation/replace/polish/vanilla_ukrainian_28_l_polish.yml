 ITA_ispettorato_dei_mezzi_antisommergibili_desc:0 "Створення Mariantisom як командного штабу протичовнової боротьби забезпечить організаційну спроможність для ліпшої координації наших кораблів супроводу та стимулюватиме технологічні інновації, які дадуть нам перевагу в боротьбі з ворожими підводними човнами."
