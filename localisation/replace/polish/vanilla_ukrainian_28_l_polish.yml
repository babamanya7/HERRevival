 MAN_the_kangde_emperor_desc:0 "In 1934 Puyi was crowned the Emperor of Manchukuo, changing his title from Chief Executive to Emperor, and as such as new Era name was adopted. Ruling previously under the name Datong, he now rules Manchuria as Emperor Kangde."
