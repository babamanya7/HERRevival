 ITA_potential_allies_in_the_balkans_desc:0 "Щоби контролювати Балкани, нам не потрібно підкорювати та домінувати над усіма країнами регіону. Настав час використати дипломатію, щоби забезпечити собі вигідних союзників на Балканах, а потім підкорити решту."
