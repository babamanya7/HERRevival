 SPA_expand_influence_in_the_navarra_garrison_mission:0 "Оспорюється вплив на гарнізон у Наваррі"
 SPA_expand_the_axis_gold_trade_desc:0 "Держави Осі відчайдушно потребують торгівлі, переживаючи блокаду союзників. Їхнє золото тече в нашу країну, завдяки чому вони можуть отримувати природні ресурси як у нас, так і в інших нейтральних країн. Ми отримуємо значний прибуток від цього, тому, можливо, нам слід заохочувати це ще більше..."
