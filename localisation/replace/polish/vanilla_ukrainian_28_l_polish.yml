 improved_machine_tools:0 "Поліпшені верстати"
 improved_ship_torpedo_launcher_desc:0 "Посилені мотори дозволяють встановлювати більше труб в одному блоці і швидше здійснювати наведення.\n\nУстановка цього модуля на §Yлегкі кораблі§! та §Yкрейсери§! дозволяє завдавати істотної шкоди ворожим §Yосновним кораблям§!."
