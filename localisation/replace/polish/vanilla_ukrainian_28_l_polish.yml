 COG_belgian_congo_neutrality:0 "Бельгійське Конго"
 COG_central_african_bank_desc:0 "Створивши [ETH_GetCentralBankName], ми могли б почати процес інтеграції економік у межах Організації африканської єдності. Це дозволить нам ефективніше використовувати наші ресурси та інфраструктуру для благо всіх держав-членів."
 COG_claim_the_great_lakes_desc:0 "Різні королівства Великих озер, одним з яких ми колись були, тепер підкорені іноземними державами. Як одне з цих старих королівств, ми маємо набагато більш легітимне право на цю територію, ніж будь-які імперіалістичні держави, і тому повинні забрати її для себе якнайшвидше."
