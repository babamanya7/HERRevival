 south_american_events.32.t:0 "Підтримка антикомуністів у [FROM.GetNonIdeologyName]"
 south_american_news.11.t:0 "Болівійська соціалістична революція 1936 року"
 south_american_news.2.b:0 "Його буде не вистачати."
 south_american_news.20.d:0 "Антильська Конфедерація була рішучою ідеєю Рамона Еметеріо Бетансеса про необхідність об'єднання корінних жителів Карибського ба моря в регіональне утворення, яке прагнуло б зберегти суверенітет та добробут антильських націй. Підтримка була найсильнішою з 1850-х років до Іспансько-американської війни, а потім здебільшого зникла. Однак після об'єднання регіону [FROM.GetLeader] ця ідея знову жива, і тепер, коли Антильська Конфедерація була оголошена, стає зрозуміліше, ніж будь-коли, що Антильські острови справді для антильців!"
 south_american_news.60.desc:0 "Незважаючи на спроби Президента $BRA_getulio_vargas$ загравати з різними фракціями військових та інтегралістським рухом, перші стали нетерплячими щодо темпів змін, які відбувалися повільно, і взяли справу у свої руки. Під час швидкої військової операції були забезпечені основні інфраструктурні та комунікаційні об'єкти по всій нації, перш ніж війська штурмували палац Катете в Ріо-де-Жанейро, де був захоплений $BRA_getulio_vargas$."
 south_american_news.8.b:0 "Тепер ми вільні прагнути ліпшого майбутнього!"
 south_pacific_mandate_SUCCEEDED_DESC:0 "Інженери зміцнили острови нашого Південного Тихоокеанського мандату. Ворогу буде важко висадитися на них."
 soviet.12.d:0 "Переважаючі сили, які ми зосередили вздовж їхніх кордонів, переконали [FROM.GetAdjective]ий уряд задовольнити наше скромне прохання про перегляд своїх кордонів. Ми отримали контроль над Карелією, і [195.GetName] тепер набагато безпечніший."
 soviet.30.a:0 "Надсилайте ультиматум!"
 soviet.33.t:0 "Утиск Латвії"
 soviet.35_threat_EST:0 "Естонія — частина Радянського Союзу"
 soviet.48.d:0 "Незважаючи на те, що за останні роки незліченну кількість людей було страчено та ув'язнено як зрадників і контрреволюціонерів, керівні посади в основному залишалися в безпеці. Однак вони не були звільнені від підозр. Після створення Четвертого інтернаціоналу Сталін, здається, був одержимий думкою, що найближчі до нього люди ніколи не були по-справжньому на його боці. Ті, хто намагається завоювати його довіру, ще більше підживлюють цю ідею, щоби виставити себе в ліпшому світлі.\n\nСитуація, що склалася, сповнена виняткової іронії: недовіра до нинішньої влади зробила її нежиттєздатною, і тепер переворот неминучий. Деякі члени партії стверджують, що повторне запрошення Троцького і спрямування чисток на сталіністів може мінімізувати шкоду від громадянської війни, яка розпочнеться після цього. Чи може цей план, який роками був найбільшим страхом генерального секретаря, дійсно бути виконаним?"
 soviet.6.t:0 "[FROM.GetNameDefCap] підкорюється"
