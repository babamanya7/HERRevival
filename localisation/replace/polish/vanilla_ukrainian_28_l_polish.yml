 PER_anti_soviet_idea:0 "Антирадянські настрої"
 PER_azerbaijan_resistance_idea:0 "Азербайджанський опір"
 PER_azerbaijan_resistance_idea_desc:0 "[PER.GetNameDefCap] охоплює деякі території, які колись належали азербайджанському народу. Через це існує значна діаспора людей, які незадоволені нашим правлінням. У попередні роки наш уряд зміг придушити низку повстань у цьому регіоні [PER.GetNameDef], але бунтівні настрої зберігаються."
 PER_choose_a_shahbanu:0 "Обрати шахбану"
 PER_clergy_revolt_tt:0 "§RПрийняття цього фокусу спричинить невдоволену революцію проти вас, занурюючи вас у громадянську війну!§!"
 PER_communist_afghanistan_intervention_desc:0 "[ENG.GetAdjective] та [SOU.GetAdjective]s сперечалися про статус [AFG.GetNonIdeologyName] майже століття. Ми зірвемо баланс на нашу користь, поставивши там комуністичний режим."
 PER_communist_air_defense_desc:0 "Ми не повинні дозволити, щоб усе, що ми побудували, було зруйновано з повітря імперськими державами. Тому ми створимо низку протиповітряної оборони по всій нації."
 PER_communist_events.6.t:0 "[FROM.GetNameDefCap] погоджується на виведення"
 PER_communist_events_3_tt:0 "§RМи повинні розпочати придушення інакомислення, якщо хочемо уникнути курдського повстання та війни!§!"
 PER_communist_propaganda:0 "Національне іранське радіо"
 PER_continue_westernization:0 "Продовжити вестернізацію"
 PER_core_egypt_state:0 "Інтегрувати [FROM.GetName]"
 PER_every_man_serves_desc:0 "Кількість, а не якість, буде майбутнім наших військових. У нас таке велике населення, і в такі часи, як ці, кожен чоловік, який може носити зброю, повинен виконувати свій громадянський обов'язок захищати [PER.GetNameDef] від іноземних загарбників. Ми втратимо спеціалізовану підготовку, але, сподіваємося, наша чисельність зможе здолати ворога."
 PER_expand_dockyards_desc:0 "У міру зростання нашого флоту ми повинні розширювати нашу військово-морську інфраструктуру відповідно до нього. Це лише забезпечить, що контроль над нашими береговими лініями залишатиметься міцно за нами."
 PER_fight_for_iran:0 "Битва за [PER.GetNonIdeologyName]"
 PER_force_abdication_tt:0 "\n§RЯкщо нейтральна партія має більше 50% підтримки, шах розпочне проти нас громадянську війну!§!"
 PER_foreign_schools_desc:0 "По [PER.GetAdjective] землях розкидана велика кількість іноземних шкіл. Ці установи можна вважати прикладом того, що наше керівництво поступається суверенітетом іноземним державам. Ми повинні захопити та націоналізувати їх заради розвитку нашої країни."
 PER_imperial_events.150.t:0 "[FROM.GetNameDefCap] вимагає білого миру"
 PER_imperial_events.220.desc:0 "Через масову реструктуризацію [PER.GetAdjective] уряду було призначено вибори, щоб дозволити народу [PER.GetNameDef] обрати свого нового Прем'єр-міністра. Оскільки багато громадян стікаються на виборчі дільниці по всій країні, особливо виділяються два кандидати: Мохаммад Мосаддик та Мохаммад Алі Форугі. Як проголосує нація зрештою?"
 PER_imperial_events.71.a:0 "Я чув, Бранденбурзькі ворота прекрасні в цю пору року!"
 PER_increase_heavy_arms_desc:0 "У міру зростання наших збройних сил зростає і наша потреба у великих об'єктах для виробництва деяких наших важких машин. Це також відкриє нам двері для створення власних артилерійських конструкцій, а це означає, що нам більше не доведеться покладатися на іноземні держави для підтримки наших військ. Це також дозволить нам коригувати наші бойові плани, щоб враховувати артилерійсько орієнтований фронт."
 PER_increase_military_funding_desc:0 "Наш лідер, Реза-шах Пехлеві, є випускником престижних Перських козаків. Не дивно для тих, хто в уряді, що він прагне збільшити військові можливості [PER.GetNameDef]. Це починається з фінансування того, що ми маємо зараз, для покращення якості наших військ та збільшення виробництва військового обладнання."
 PER_infantry_equipment_2_short:0 "ZB vz. 30"
 PER_invading_country_flag:0 "Очолює вторгнення проти [PER.GetNameDef]"
 PER_iran_first_desc:0 "Ніхто, крім самого іранського народу, не може адекватно захистити наші цінності та культуру. Таким чином, ми будемо переслідувати власні цілі та змусимо світ підкоритися нашій волі."
 PER_iranian_empire:0 "Іранська імперія"
 PER_iranian_industrialization_desc:0 "Ми не будемо робити себе залежними від іноземних держав для модернізації нашої економіки. Натомість ми використаємо нерозкритий потенціал нашого народу та знайдемо власний шлях до модернізації."
 PER_islamic_republic_democratic_ADJ:0 "Іранськ"
 PER_kur_indy_war_tt:0 "§RУсі курдські осердні області, якими ми володіємо, повстануть і оголосять війну за незалежність проти нас!§!"
 PER_kurds_armed_and_ready:0 "Курди озброєні та готові"
 PER_mass_protests:0 "Опозиція шаху"
 PER_operation_countenance_flag:0 "Операція «Зіткнення»"
 PER_preemptive_strike_desc:0 "Ніхто не загрожуватиме нашому суверенітету. Щоб ті, хто дивиться на нас із заздрісними очима, зрозуміли, що не можна втручатися в наші справи, ми покажемо їм усю міць військових сил [PER.GetNameDef]. Якщо ми вдаримо першими, вони не будуть готові захищатися від швидкого та сильного нападу."
 PER_prepare_for_worst:0 "Готуватися до найгіршого"
 PER_qorkhaneh:0 "Корханех"
 PER_recruit_rebels_tt:0 "Відмикає шаблони дивізій §YПовстанці Бахтіарі§! та §YПовстанці Кашкаї§! та набирає §Yдві§! одиниці кожного у §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_revolution_events.1.t:0 "Переворот неминучий"
 PER_revolution_in_the_gulf_desc:0 "Баланс сил у регіоні зміщується на нашу користь. Ми повинні використати нашу перевагу та почати просувати більші антиколоніальні рухи по всій території."
 PER_sp_rockets_ground_to_air_missile:0 "Проєкт «Sayyad»"
 PER_spoils_of_war_idea_desc:0 "Після успішної допомоги нашим союзникам у їхній війні ми змогли забезпечити власні території внаслідок цього конфлікту. Настав час включити ці землі до нашої зростаючої сфери впливу."
 PER_ssb_events.4.b:0 "Це явно не в наших найкращих інтересах."
 PER_strategic_bombing_desc:0 "Війни виграються не лише в повітрі, але й шляхом знищення економічного та промислового потенціалу противника. Зосередимося на стратегічному бомбардуванні та знищимо їхні об'єкти, перш ніж вони зможуть використати їх проти нас."
 PER_teymur_bakhtiar:0 "Теймур Бахтіар"
 PER_the_memphis_initiative:0 "Мемфіська ініціатива"
 PER_the_new_economy:0 "Нова економіка"
 PER_the_pahlavi_imperium_desc:0 "З тих пір, як Реза-шах Пехлеві повалив династію Каджарів у 1925 році, він був керівною силою для [PER.GetNameDef]. Оскільки наша країна стоїть на роздоріжжі ще одного великого світового конфлікту, великий шах має бути готовий протистояти будь-якій бурі, яка загрожує охопити наші славетні [PER.GetAdjective] землі."
 PER_viceroyalty_of_persia:0 "Віцекоролівство Персія"
 PER_war_plan_darius_idea_desc:0 "Дарій Великий був третім царем царів Ахеменідської імперії. Хоча він правив імперією на піку її територіального розширення, саме він поширив перський вплив аж до долини Інду в сучасному Пакистані. Давайте спрямуємо його експансіоністські ідеали та підемо проти наших ворогів на сході!"
 PER_war_plan_xerxes_desc:0 "Ксеркс був четвертим Царем Царів Імперії Ахеменідів, родичем як Дарія, так і Кіра Великого. Оскільки Ксеркс найбільш відомий своїм вторгненням у Грецію в 480 році до н.е., ми вирішили назвати наші плани вторгнення на землі на захід від [PER.GetNameDef] на його честь. Ми нарешті надолужимо нашу поразку від рук еллінів."
 PER_we_will_survive_desc:0 "Нарешті війна прийшла до нашого порогу. Без сумніву, ми зробимо все можливе, щоб протистояти цим загарбникам, і покажемо світові, що велика нація [PER.GetNameDef] виживе, незважаючи ні на що. Ми проіснували тисячі років і проіснуємо ще тисячі."
 PHI_american_intervention_is_over:0 "[USA.GetNameDefCap] погодилися не втручатися"
 PHI_beach_defense_strategy:0 "Стратегія берегової оборони"
 PHI_benigno_ramos:0 "Бенігно Рамос"
 PHI_benito_n_ebuen:0 "Benito N. Ebuen"
 PHI_coastal_defense_ships:0 "Кораблі берегової оборони"
 PHI_decision_cost_convoys_icon_small_blocked:0 "[?PHI.PHI_convoy_vars_small_cost|0R] £GFX_topbar_convoys"
 PHI_eisenhower:0 "Айзенгауер"
 PHI_establish_reserve_transport_fleet:0 "Створити резервний транспортний флот"
 PHI_fascism_party_long:0 "Партія Ганап"
 PHI_japan_aligned_ideology_improved_tt:0 "Змінює §Y$PHI_japan_aligned_ideology$§!:"
 PHI_japanese_observers:0 "Японські спостерігачі"
 PHI_juramentado:0 "Хураментадо"
 PHI_manila_tag_fascism_ADJ:0 "Філіппінськ"
 PHI_maphilindo_tag_democratic:0 "Федерація малайських народів"
 PHI_mio_trait_widened_tracks:0 "Розширені гусениці"
 PHI_modify_economy_dynamic_modifier_tt:0 "[GetPHIEconomicModifier]"
 PHI_napoleon_de_leon:0 "Napoleon de Leon"
 PHI_national_confederation:0 "Національна конфедерація"
 PHI_petition_the_supreme_court:0 "Петиція до Верховного суду"
 PHI_petition_the_supreme_court_desc:0 "Комунізм був офіційно заборонений Верховним судом у 1932 році, проте ми натрапили на юридичну лазівку, яка могла б знову легалізувати рух; нам просто потрібно підписати та подати петицію для цього."
 PHI_philippine_division_desc:0 "Філіппінській дивізії доручено оборону наших островів, але вона погано оснащена та недоукомплектована. Ми повинні звернутися по зовнішню експертизу в питанні командування та забезпечити нашим військам сучаснішу зброю та спорядження."
 PHI_police_chief_eisenhower:0 "Шеф поліції Айзенгауер"
 PHI_preemptive_strikes:0 "Превентивні удари"
 PHI_pt_boat_development_tt:0 "§G+10%§! швидкості здобуття майстерності для §YКораблів супроводу§!."
 PHI_resident_commissioner:0 "Постійний комісар"
 PHI_social_reformer:0 "$social_reformer$"
 PHI_soldiers_in_hiding_desc:0 "Хоча ми формально програли битву в [PHI.GetNameDef], війна не закінчена. Велика кількість наших військ не виконала наказ здатися і продовжила боротьбу, перебуваючи в підпіллі. Ми знаємо низку виняткових офіцерів, які прийняли виклик і почали розширювати загони опору навколо себе — і ми повинні надати все можливе для їхнього успіху."
 PHI_usa_focus_done_T3_alt_tt:0 "Завершено принаймні три з фокусів: §Y$PHI_declare_military_emergency$§!, §YПрив'язати песо до долара§!, §YПро-хасендадос§! або §YЗакон про громадянство§!."
 PHI_war_plan_rainbow_five:0 "Військовий план «Райдуга-5»"
 PHI_will_gain_hukbalahap:0 "Отримає 3 бригади Хукбалахап після завершення фокусу §Y$PHI_grassroot_guerillas$§!."
 PIERCING_COMBAT_DESC:0 "Шкода базується на % пробитої ворожої броні:"
 PLAN_COHESION_BALANCED_DESC:0 "Дивізії будуть переміщуватися лише з середніх відстаней, щоби зберегти бойову лінію."
 PLAN_EXECUTE_BALANCED_DESC:0 "Задіяні стандартні правила виконання бойових планів. Військові частини намагатимуться просуватися таким чином, щоби зберегти лінію фронту якомога коротшою й можуть атакувати укріплені позиції."
 PLAN_PREPARATION_HQ_DESC:0 "§RЩоби збільшити готовність її плану, дивізія мусить бути в армії з розгорнутим армійським штабом.§!"
 PLU_democratic_ADJ:0 "Палауськ"
 POLITICS_ACTIVE_GOAL:0 "Поточна мета"
 POLITICS_GOAL_LEADS_TO_ENTRY:0 "$GOAL|Y$"
 POLITICS_IDEA_COST_COMPACT:0 "$VALUE|0$"
 POLITICS_INVALID_IDEA_REPLACED:0 "§HНевідповідна ідея $IDEA|R$ замінена§!"
 POLITICS_POPULARITY_INCREASE_SPY:0 "$SPY|H$ збільшує популярність (§H$VALUE|2$%§! щотижня)"
 POLITICS_STAGE_COUP_EQUIPMENT_ENTRY:0 "$EQUIPMENT$: $CURRENT|0$/$TOTAL|0$"
 POL_KINGDOM_RUS_neutrality:0 "Конгресове королівство Польське"
 POL_NATDEM_fascism:0 "Польська національна республіка"
 POL_PEASANT_communism_DEF:0 "Польська селянська республіка"
 POL_aces_in_exile_desc:0 "Ворог захопив нашу Батьківщину, але наші найкращі пілоти все ще піднімаються в небо і надихають наших бійців продовжувати наступати додому!"
 POL_anti_air_equipment_2:0 "Armata plot. 75mm wz. 36"
 POL_april_constitution_5:0 "$POL_april_constitution_1$"
 POL_april_constitution_dem_1_desc:0 "$POL_april_constitution_dem_desc$"
 POL_april_constitution_fas_desc:0 "Цей законодавчий акт був прийнятий Сеймом у 1935 році з метою забезпечення тривалого миру та стабільності польської держави. До конституції були внесені поправки, згідно з якими військові стали сувереном усіх внутрішніх і зовнішніх справ. Крім того, ультранаціоналістичні фалангістські принципи були прийняті високопоставленими військовими, що зробило різницю між військовими і фалангістами простою формальністю."
 POL_april_constitution_left:0 "$POL_april_constitution_1$"
 POL_austro_hungarian_alliance:0 "Австро-угорський альянс"
 POL_baltic_security_desc:0 "Хоча ми покладалися на підтримку Заходу, постійні поступки, зроблені німцям, змушують нас сумніватися в тому, що союзники захистять нас у разі вторгнення. Можливо, захищаючи наших співвітчизників у Східній Європі, ми зможемо зберегти мир."
 POL_baltic_socialism_desc:0 "Волю балтійських народів придушують диктатори, капіталісти і фашисти. Якщо робітники коли-небудь звільняться, це має відбутися за прямої польської інтервенції."
 POL_camp_of_national_unity:0 "Зберігати диктатуру"
 POL_claim_greater_lithuania:0 "Претензії на Велику Литву"
 POL_commerce_attack:0 "Тактики нападу на комерційні судна"
 POL_cv_nav_bomber_equipment_3:0 "PZL.75 Mors Floty"
 POL_demand_LIT_desc:0 "Литовський уряд роздроблений, слабкий і характеризується поганим економічним і військовим керівництвом. Польська держава є неповноцінною без своїх підданих, і, можливо, просто вимагаючи цього, литовці погодяться на об'єднання."
 POL_diplomatic_mission_to_SWE:0 "Дипломатична місія в державу [SWE.GetNameDef]"
 POL_dismantle_fascist_empires:0 "Ліквідувати фашистські імперії"
 POL_dissolve_the_sejm_desc:0 "Сейм продовжував існувати за санаційного уряду як символ демократії, яку колись прийняла Польща. Однак настав час позбавити Сейм усіх повноважень і передати всю владу Сенатові та сенаторам Замку."
 POL_draft_a_new_constitution:0 "Розробити нову конституцію"
 POL_eastern_conscripts:0 "Східні призовники"
 POL_expand_polish_intelligence_desc:0 "Коли наші армії розбиті, розгромлені і змушені піти в підпілля, Польща змушена продовжувати боротьбу з тіні. Ми повинні зробити пріоритетом швидке розширення польської розвідки, якщо ми хочемо мати хоча б найменшу надію на повернення додому."
 POL_expand_the_strike_name:0 "Розширити селянський страйк"
 POL_fb_organization:0 "Fabryka Broni «Łucznik» — Radom"
 POL_integrate_gdansk_industries_desc:0 "Десятиліттями Гданськ був відокремлений від решти країни, але з цим покінчено! Інтегрувавши Гданськ до нашої адміністрації, ми зможемо відновити контроль над нашим експортом та імпортом!"
 POL_invite_denmark_desc:0 "Данці, хоч їхня держава і невелика, контролюють Данські протоки — ключовий стратегічний регіон Балтики. Приєднавши данців до нашого альянсу, ми забезпечимо доступ до Балтики та вихід з неї. Данцям треба просто довіритися, щоби вижити."
 POL_invite_romania_to_morges_desc:0 "Одного лише франко-польського союзу недостатньо, щоб протистояти повній силі держав Осі. Ми повинні розширити наш союз між морями."
 POL_king_of_lithuania_desc:0 "Час настав; литовське населення збурилося проти лідера [LIT.GetLeader], і прихильники монархізму готові висунути свої вимоги до уряду. За підтримки Польщі вони вважатимуть лідера [Root.GetLeader] своїм правителем, призначеним Богом."
 POL_light_tank_equipment_2:0 "7TP"
 POL_mechanized_equipment_2:0 "C2P"
 POL_medium_tank_equipment_1_short:0 "10TP"
 POL_mio_trait_multi_role_tank_designer:0 "Конструктор багатоцільових літаків"
 POL_protect_czechozlovakia_desc:0 "Стало очевидним, що [GER.GetLeader] має свій власний план щодо долі Чехословаччини, який залишить чехословаків без їхньої незалежності. Цю хвилю імперіалізму необхідно зупинити."
 POL_refused_states:0 "Польща відмовилася від територій"
 POL_reopen_the_maritime_and_colonial_league_desc:0 "Амбіції міжконтинентальної польської присутності закінчилися з невдачею Польщі придбати Палестину, але з нашими новими тісними зв'язками із Заходом і соціалістичним урядом ми маємо можливість використати наш капітал для звільнення робітників колоній від європейських колонізаторів під новою польською адміністрацією."
 POL_restoration_of_the_royal_sejm_desc:0 "У старі часи Польського королівства сеймики були вірними слугами народу і корони. З відновленням Сейму і знищенням Другої Речі Посполитої ми повинні переконатися, що всі сеймики лояльні до корони і не намагатимуться повернути Польщу до санаційного правління."
 POL_romanov:0 "Романова"
 POL_sanation_left_opposition_1_desc:0 "[Root.GetLeftDesc] Наразі ліві санаціоністи є дуже незначною загрозою для диктатури та не в змозі загрожувати стабільності режиму."
 POL_sanation_left_opposition_3_desc:0 "[Root.GetLeftDesc] Наразі ліві санаціоністи дуже потужні та можуть довести наш цивільний сектор до повної зупинки, якщо вони цього захочуть."
 POL_sanation_right_opposition_4:0 "Дуже висока опозиція правої санації"
 POL_sideline_the_left:0 "Відтіснити лівих"
 POL_sideline_the_right:0 "Відтіснити правих"
 POL_silesia_fortified_area:0 "Сілезька укріплена зона"
 POL_sp_nuclear_reactor:0 "Проєкт «MSC-1»"
 POL_start_central_industrial_region_desc:0 "Стара столиця Польщі вільна від панування Австрійської імперії, але й досі місто страждає від свого минулого: у ньому відсутні сучасні промисли, потрібні, щоби зрівнятися з Заходом. Інвестуючи в місцеву промисловість, ми повернемо Краків з мертвих."
 POL_strat_bomber_equipment_3:0 "PZL.72 Szerszeń"
 POL_submarine_1_desc:0 "Клас «Wilk» складався з трьох підводних човнів, сконструйованих французами для ВМС Польщі в ранніх 1930-х на основі дизайну французького класу «Saphir». Ці човни були доволі великими, з водотоннажністю 1100 т, озброєні шістьома 550-мм торпедними апаратами й могли пірнати до 80 м."
 POL_the_cyclometer_no_mtg:0 "$POL_the_cyclometer$"
 POR_AI_BEHAVIOR:0 "@POR Португалія"
 POR_buy_artillery_in_britain_desc:0 "Ми укладемо угоду з державою [ENG.GetNameDef] на придбання сучасних артилерійських гармат."
 POR_const_kingdom_neutrality_ADJ:0 "Португальськ"
 POR_infantry_equipment_0:0 "Espingarda m/04"
 POR_nationalist_intervention_desc:0 "Амбіції іспанського уряду загрожують нашим інтересам, і ми не можемо з цим миритися. Якщо наші сусіди не бажають приєднатися до нашої справи, тоді нам доведеться змусити їх зробити це більш переконливими засобами."
 POR_portugal_promoting_monarchist_cause_in_brazil:0 "Португалія підбурює монархістів"
 POR_reorganization_of_the_communist_party_desc:0 "Під час диктаторського режиму Салазара багато членів нашої партії були заарештовані. Ми повернемо їх і реорганізуємо структуру нашої партії, забезпечивши, щоб кожним відділом керували найкращі кваліфіковані люди."
 POR_restart_investment_into_timor_desc:0 "Timor has been seen as an economic burden during the Great Depression, and has as such received little support or management from us since the crisis first began. With the Japanese Nan'yō Kōhatsu development company investing in the region, perhaps it is time to resume our own investment there too."
 POR_ships_trade:0 "Торгівля кораблями"
