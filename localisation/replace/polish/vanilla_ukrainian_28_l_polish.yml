 HUN_gombos_trade_treaty_desc:0 "Торговельна угода, яку Дюла Гьомбьош підписав із Німеччиною в 1934 році, має велике значення для стимулювання нашої економіки та подолання наслідків Великої депресії, однак вона також має значні недоліки. Хоча угода дає нам вигідну ціну на продаж пшениці, зароблені кошти повинні залишатися на рахунку в Німеччині й витрачатись лише на купівлю німецьких промислових товарів. Якщо це триватиме, Німеччина зможе досягти економічного домінування над нашою країною."
