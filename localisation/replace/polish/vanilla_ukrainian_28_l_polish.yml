 CHL_we_must_dig_deeper_desc:0 "Неможливо копати «занадто глибоко», навіть якщо ми прокладаємо тунелі під власними містами, злегка пошкоджуючи їхні фундаменти. Якщо ми хочемо відновити нашу економіку за рахунок експорту, ми мусимо ризикувати і робити це швидко, щоб отримати якомога більше з наших шахт."
