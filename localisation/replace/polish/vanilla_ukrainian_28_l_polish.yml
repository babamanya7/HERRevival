 LIT_VICTORY_POINTS_6332:0 "Караляучюс"
 LIT_a_king_for_our_people_desc:0 "Антанас Смєтона не може правити Литвою поодинці, і хоча багато хто чекає, що президент призначить прем'єр-міністра, є інший варіант. Карл Геро фон Урах — законний син Міндаугаса II, і тепер, коли над Литвою більше не висить темрява німецького правління, ніщо не заважає нам коронувати свого монарха."
 LIT_appease_nazis:0 "Умиротворити німців"
 LIT_baltic_economic_union_desc:0 "Тепер, коли в нашу країну повернулася ліберальна демократія і ми встановлюємо близькі економічні зв'язки з іншими державами, логічно буде увійти до економічного союзу з нашими сусідами по Балтії. Економіки наших країн невеликі, але разом вони можуть зміцніти!"
 LIT_claim_livonia_desc:0 "На півночі є дві молоді держави, які століттями не знали незалежності. Безсумнівно, в руках Литви їм буде краще..."
 LIT_events.1.d:0 "Очевидно, що [LIT.GetLeader] хоче возз'єднати [LIT.GetAdjective] державу з його старою столицею, Вільнюсом. Будучи малонебезпечною для держави [POL.GetNameDef] сама по собі, [LIT.GetAdjective] держава навмисно розділити націю з державою [Root.GetNameDef] так, щоб [POL.GetAdjective] Україна та Білорусь об'єдналися з країною [Root.GetNameDefCap], а Вільнюс повернувся до держави [LIT.GetNameDef].\n\n[POL.GetNameDefCap], звісно, може відмовитися виконувати спільний ультиматум, і така відмова призведе до війни між державами [POL.GetNameDef] та [Root.GetNameDef]."
 LIT_events.2.b:0 "Я так не думаю."
 LIT_events.8.a:0 "Це жертва, на яку можна піти."
 LIT_monarchy_events.1.b:0 "Залишиться лише один!"
 LIT_prepare_forest_brothers:0 "[Root.Get_Forest_Focus_Loc]"
 LIT_rapid_fortifications_in_the_east_desc:0 "Очевидно, що головна загроза нашої незалежності — комунізм, і потрібно робити все можливе, щоби захистити від нього націю."
 LIT_rastikis_military_reforms_desc:0 "Наша армія погано готова до такої масштабної загрози, як можливість чергового німецького вторгнення. Дуже важливо, щоб військове крило уряду поставило компетентних командирів над патріотами в литовській армії."
