 SOV_SOP_civil_war_divisions_tt:0 "Підтримка армії: [?SOV.SOV_exiles_army_support|%Y0]\nПідтримка флоту: [?SOV.SOV_exiles_navy_support|%Y0]\nПідтримка авіації: [?SOV.SOV_exiles_air_support|%Y0]\n\nНародна підтримка: [?SOV_opposition_popular_support|Y1]§Y%§!\n (Народна підтримка впливає на рівень капітуляції лідера [FROM.GetLeader] й додає партизанські війська під час війни)"
 SOV_SOS_civil_war_divisions_tt_long:0 "§YПідтримка громадянської війни§!\n§LНадзвичайно важливо забезпечити якомога більшу підтримку в разі початку громадянської війни як у збройних силах, так і серед населення в цілому.\n\n§![GetArmedForcesText]\n\n----\nЯкщо параноя вища ніж §R90%§!, щодня існує ризик §Y20%§!, що Сталін почне війну.\n----\n[GetCategoryStateText]"
