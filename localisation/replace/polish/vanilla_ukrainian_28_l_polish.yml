 OPERATIVE_MISSION_DIPLOMATIC_PRESSURE_DESC:0 "§LВплинути на націю, керовану ШІ, таким чином, щоб вона воліла ваш альянс і ваші пакти про ненапад. У націй гравців буде обмеження на вступ до інших альянсів.§!\n§HЩоденний дипломатичний тиск: $BASE_ACCEPTANCE$§!\n Базова величина: $BASE_ACCEPTANCE|G$\n§HВимоги до щоденної світової напруженості: -$BASE_TENSION|%$§!\n Базова величина: §G-$BASE_TENSION|%$§!"
 ORDER_PROV_TOOLTIP_DEFENSIVE_LINE_ARMY_GROUP:0 " - §GКлацніть§!, щоби створити §Yоборонну лінію§! вздовж усього кордону.\n - §GShift + клацніть§!, щоби створити §Yоборонну лінію§! вздовж усього кордону без ліній окремих армій.\n - §GКлацніть ПКМ§! та перетягуйте, щоби намалювати §Yоборонну лінію§! вздовж цього кордону.\n - §GShift + клацніть ПКМ§! та перетягуйте, щоби намалювати §Yоборонну лінію§! вздовж цього кордону без ліній окремих армій."
