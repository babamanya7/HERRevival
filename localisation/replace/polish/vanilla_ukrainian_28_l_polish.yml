 GXC_the_scorched_earth_speech_desc:0 "Центральний уряд діяв занадто м'яко щодо японців. Ми повинні боротися з ними до останньої людини, випалюючи землю, якщо будемо змушені відступити. Японська імперія ніколи не повинна контролювати весь Китай, незалежно від ціни."
