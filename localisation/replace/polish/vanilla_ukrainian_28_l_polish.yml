 NAVY_REFIT_ABORT_DESC:0 "Обрані оперативні групи зараз переозброюються з прогресом:\n$PROGRESS_LIST$\nНа даному етапі кораблі не є морехідними. Ви можете лише почекати, поки переобладнання буде завершене, або Ви можете §Rзатопити§! їх.\nВи справді хочете §Rзатопити§! $NUM_SHIPS|H$ кораблі(в)?\nЦя дія незворотна!"
