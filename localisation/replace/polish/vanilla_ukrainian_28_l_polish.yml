 ITA_believe_obey_fight_desc:0 "Наша партія була заснована на простих принципах. По-перше, щоби захопити владу, треба вірити, що це можливо. По-друге, щоби захопити владу, треба підкорятися людям, які нею керують. По-третє, щоби захопити владу, треба боротися. А захоплення влади — це єдина справжня мета будь-якого політичного руху, гідного цієї назви."
 ITA_bop_revoke_the_lateran_treaty_tt:0 "\n§RНе дозволить нам виконати фокус §Y$ITA_seek_papal_support$§!.§!\n"
 ITA_bop_take_over_ministry_of_foreign_affairs_desc:0 "Призначення себе міністром закордонних справ дозволить Беніто Муссоліні здійснювати прямий контроль над зовнішньою політикою та відносинами Італії."
