 SUBDOCTRINE_COASTAL_AIR_PATROL_DESC:0 "Традиційні засоби берегової оборони на рівні моря є трудомісткими та неефективними. Повітряна мобільність дозволяє нам стежити за дружніми берегами та карати будь-якого потенційного загарбника."
