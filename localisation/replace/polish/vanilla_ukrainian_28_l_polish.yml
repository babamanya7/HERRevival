 battleship_3_desc:0 "Більш міцна броня, потужніша енергетична установка, великокаліберні гармати та знаряддя ППО дозволяють лінкорам зберігати ефективність в умовах повної присутності бойової авіації."
 bba_news.100.t:0 "[GetPurgeEventTitles]"
 bba_news.100.t_some_purged:0 "Чистка в лавах Національної фашистської партії"
 bba_news.103.desc_coverstory:0 "Колишній лідер держави [FROM.GetNameDef] Беніто Муссоліні намагався втекти з-під домашнього арешту, куди його помістили після усунення від влади. Жменька озброєних людей увірвалася до помешкання Муссоліні, після чого почалася перестрілка. Під час сутички Муссоліні був поранений і помер від отриманих ран."
 bba_news.3.a:0 "Цей мир проіснує недовго."
 bftb_bulgaria_balkan_federation.12.a:0 "Заради збереження миру ми готові задовольнити їхні вимоги..."
 bftb_bulgaria_balkan_federation.8.desc:0 "[FROM.GetAdjectiveCap]ий уряд погодився вступити в Об'єднану балканську федерацію, але наразі [FROM.GetNameDef] відчайдушно потребує фінансової допомоги для запобігання колапсу їх занепадної економіки. [F. після відновлення економіки [FROM.GetNameDef] з радістю вступить у велику Об'єднану балканську федерацію."
 bftb_bulgaria_factions.10.b:0 "Почекаємо, поки вони не зроблять перший крок"
 bftb_bulgaria_factions.53.desc:0 "Захоплення лідерів «Звена» пройшло успішно. Кілька важливих постатей, у тому числі сам Кімон Георгієв, заарештовані. Для організації цей удар стане дуже болючим."
 bftb_bulgaria_factions.60.a:0 "Вони отримали по заслугах."
 bftb_bulgaria_factions.61.desc:0 "Наша служба безпеки провела серйозні репресії проти фракції широких соціалістів. Нам доповіли, що поліцейським вдалося захопити багатьох бунтівників на таємній зустрічі членів організації з робочими союзами і навіть комуністами. Начальник поліції стверджує, що операція завершилася."
 bftb_bulgaria_greek_influence.3.desc:0 "[FROM.GetAdjectiveCap]ий лідер [FROM.GetLeader] заявляє, що не довіряє новій [BUL.GetAdjective]ій миролюбній політиці, а тому відхиляє нашу пропозицію юридично оформити дружні відносини між державами [BUL.GetNameDef]."
 bftb_bulgaria_nationalization.1.c:0 "Надправимо до них дипломатів... на танках!"
 bftb_bulgaria_nationalization.1.desc_party_name:0 "міністри партії [BUL.GetRulingPartyLong]"
 bftb_bulgaria_political_leaders.1.b:0 "Нам потрібен прихильник радикальніших поглядів... Призначимо Александира Цанкова!"
 bftb_bulgaria_scw_volunteers.2.a:0 "Вони стали справжніми ветеранами війни!"
 bftb_bulgaria_tsar_boris.1.c:0 "Тоді більше жодних бенкетів, поки що..."
 bftb_bulgarian_claims.1.t:0 "Болгарія жадає забезпечення претензій на Балканах"
 bftb_greece.166.desc:0 "Коли [FROM.GetAdjective]ий уряд запросив нас обговорити наші економічні зв'язки, ми не могли відмовити. Зрозуміло, він переконливо обґрунтував нам, чому [FROM.GetAdjective]у промислову міць слід наростити. Чи вкластися нам у розвиток їхньої нації або надати їхній промисловий потенціал власній долі — вирішувати нам."
 bftb_greece.177.t:0 "[FROM.GetAdjectiveCap]і інвестори вирішують цього разу не вкладати кошти"
 bftb_greece.207.desc:0 "Ми мусимо були передбачати такий розвиток подій. Верхівка НСГ затаврувала нас слабкими і неефективними і оголосила, що ми є перепоною для величі. Хулігани влаштували спектакль перед еллінським парламентом, де вони нарекли зрадниками і оголосили, що зроблять все, що в їх силах, щоби змістити нас. Зрозуміло, показово покинувши зал, через кілька годин вони повернулися в супроводі натовпу і зажадали нашої негайної колективної відставки. Чесно кажучи, багато урядових міністрів вже не вірять, що цій адміністрації під силу довести справу до кінця, як ми обіцяли нації, багато хто вважає, що йдучи маршем на Константинополь без зарубіжної чи народної підтримки, ми відправляємо всю країну на вірну смерть і вже ніколи не оправимось від наслідків."
 bftb_greece.213.a:0 "Злодії та паразити!"
 bftb_greece.226.desc:0 "Більшість присутніх делегатів вирішила, що держава [ITA.GetNameDef] не повинна отримати колонії в південній частині держави [TUR.GetNameDef], і визнали саме таке бажання підбурюванням до війни з боку [ITA.GetAdjective]ої держави [ITA.GetAdjective]і представники розкритикували рішення і заявили, що воно зайвий раз демонструє правильність самого поняття «зіпсована перемога». щоб вони могли вплинути на вердикт за останнім і найважливішим пунктом порядку денного."
 bftb_greece.24.a:0 "Ми голосуємо за!"
 bftb_greece.41.a:0 "Ми помстимось за полеглих!"
 bftb_greece.62.b:0 "[FROM.GetAdjectiveCap]ий уряд справді збожеволів..."
 bftb_news.203.f:0 "Жахливо."
 bftb_news.206.a:0 "Ура!"
 bftb_news.3.t:0 "Смерть болгарського царя Боріса III"
 bftb_news.5.c:0 "Сміливий хід з боку болгар..."
 bftb_news.8.b:0 "Тривожні новини..."
 bftb_turkey.1.b:0 "Британську імперію не хвилюють проблеми Туреччини."
 bftb_turkey.11.t:0 "[TUR.GetNameDefCap] виконує наші вимоги"
 bftb_turkey.114.a:0 "Мабуть, дрібні поступки запропонувати можна."
 bftb_turkey.137.a:0 "Вони стали саме тими, кого самі ж клялися знищити."
 bftb_turkey.140.desc:0 "[FROM.GetAdjectiveCap]ий уряд попередив нас про неприпустимість повторного порушення суверенітету членів нашого альянсу. Цього разу вони готові нам пробачити, але у разі подальших дій [FROM.GetNameDef] вживе заходів у відповідь."
 bftb_turkey.35.desc:0 "[FROM.GetAdjectiveCap]а влада повернула нам острови Онікі в обмін на частину плодів праці нашої індустрії. Офіційні особи приватно висловили своє невдоволення тим, що нам доводиться платити за століттями належало нам, але багато хто з голосів були заглушені спільним приємним хвилюванням з приводу анексії нової провінції держави [TUR.GetNameDef].\n\n[TUR.GetLeader] прибув з особистим візитом на Родос, де запевнив громадян, що давно пригнічуються, що всі їхні скарги будуть почуті і розібрані [TUR.GetAdjective]им урядом. На архіпелазі тим часом поширювалася нова методичка, в якій всіляко звеличувався історичний та етнічний зв'язок островів з державою [TUR.GetNameDef]."
 bftb_turkey.4.desc:0 "[TUR.GetLeader] оголосив, що Турецькі протоки переходять під повний контроль держави [TUR.GetNameDef], що дає [TUR.GetAdjective]ому уряду можливість перекривати їх на власний розсуд! Це абсолютно неприйнятно: [TUR.GetAdjective]ий уряд вирішив, ніби має право замикати наш флот у Чорному морі, коли йому це політично вигідно."
 bftb_turkey.53.desc:0 "Ми отримали партію [FROM.GetAdjective] танків прямо з їх запасів! Ці танки явно застаріли і зняті [FROM.GetAdjective]ими військами з озброєння через численні недоліки. І все-таки наша армія знайде й застосування... якесь."
 bftb_turkey.61.a:0 "З поверненням на батьківщину, брати та сестри."
 bftb_turkey.7.a:0 "Що ж, цю кризу можна вважати вирішеною."
 bftb_turkey.84.c:0 "Має хтось врятувати нас від марксистської сволоти!"
 bftb_turkey.89.desc:0 "[ROOT.GetLeader] не може прийти до тями після жахливих новин про те, що [ROOT.GetNameDef] не отримає жодної підтримки проти [TUR.GetAdjective] агресії. Нехтування інших націй залишило нас без захисту перед огидним ультиматумом: вийти на бій або здатися заради порятунку життів."
 black_cross_anarchist:0 "Бабуся анархії"
 blood_toil_tears_and_sweat:0 "Кров, піт і сльози"
 blow_panama_canal:0 "Підірвати Панамський канал"
 bold_intelligence_officer_no_lar_lesser:0 "$bold_intelligence_officer$"
 bomber_focus_desc:0 "Коли люди майбутнього розповідатимуть про жахи сучасних війн, вони згадуватимуть вогонь, що падає з небес. Потрібно зробити все можливе, щоб ці історії розповідали наші вороги."
 britain.11.a:0 "Об'єднаємо демократів!"
 britain.16.a:0 "Хай спочиває з миром."
 britain.2.d:0 "Уряд США погодився з нашою пропозицією і поділився деякими своїми дослідженнями."
 britain.21.t:0 "Тріумф місії Тізарда"
 britain.27.a:0 "Шкода, але це необхідний крок"
 build_factories_desc:0 "Нові заводи — це нові робочі місця як під час будівництва, так і при їх експлуатації, а також важливий крок на шляху поліпшення економіки."
 bulgaria.3.d:0 "Ми довго мріяли про велику Болгарію і довго до нас ставилися як до людей другого сорту. Нам відмовляли у справедливому праві на Лондонській конференції, у 1913 році нас зрадили наші союзники, у 1918 році нас покарали за прагнення до справедливості. Але цього вже не буде, Німеччина прагне виправити кривди цього так званого миру не лише для себе, але й для інших. Болгарія тепер побачить повернення Македонії зі складу Югославії."
 calculated_restraint_spirit:0 "Розрахована стриманість"
 call_to_war_rules_applicability:0 "§gКоли активно, тільки країни, які виконують ці умови, можуть закликати інших членів альянсу до війни:§!"
 can_unlock_new_special_forces_tree_none:0 "£trigger_yes §HГалузевих спеціалізацій§! залишилося: §H1§!"
 canadian_car_foundry:0 "Canadian Car & Foundry"
 captain_of_industry:0 "Капітан промисловості"
 capture_cyphers_seduction_outcome:0 "Наш агент зміг переконати людину, яка має шифри, поділитися ними."
 capture_tito_outcome_tt:0 "Ми спробуємо полонити або вбити Тіто. Це ризикована операція, яка може завершитися невдачею."
 cas_veteran_initiative_desc:0 "Політика, за якою пілоти-ветерани передають свій досвід та знання молодим льотчикам, збільшить шанси новобранців на виживання."
 cat_grand_battle_plan_research:0 "Доктрина масштабного планування"
 cat_mobile_warfare_research:0 "Доктрина мобільної війни"
 cat_strategic_bomber:0 "Моделі страт. бомбардувальників"
 category_line_artillery:0 "Лінійна артилерія"
 cavalry_expert_desc:0 "§LЕксперт із використання швидкості та мобільності в бою.§!"
 centimetric_radar_desc:0 "Новий радар, який працює в мікрохвильовому спектрі, дозволяє виявляти об'єкти занадто малі, щоби їх могли вловити попередні радари."
 chile_civilian:0 "Патагонські мрії"
 china.1.b_tt_SND:0 "§Y[SND.GetNameDefCap]§! will be pressured to hand over their land to §Y[JAP.GetName]§!"
 china.101.b:0 "Треба відбити загарбників!"
 china.14.d:0 "Попри наші зусилля показати, що ми дозволимо комуністам поширювати їхній вплив поза територіями, де вони зараз знаходяться, ми не виділили достатньо ресурсів для перемоги в конфлікті на кордоні області [From.GetName].\n\nНеперіодичні сутички з комуністичними партизанами повільно схилялись усе більше й більше на їхню користь, що врешті-решт призвело до провалу кампанії й показало, що ми не повністю тримаємо ситуацію під контролем. Якщо їхня підтримка серед народу продовжить зростати, комуністи можуть стати значною загрозою."
 china.204.c:0 "Нема потреби змінювати розміщення уряду."
 china.7.t:0 "Гоміньдан влаштовує наступ"
 cl_tech:0 "Моделі легких крейсерів"
 claim_baltic_states:0 "Надати претензії на балтійські держави"
 coastal_security_goal_desc:0 "Ми повинні забезпечити повний контроль над усім морським узбережжям Східної та Південно-Східної Азії. Таким чином ми зможемо забезпечити, щоб західні імперіалістичні колонізатори не змогли зберегти плацдарм у нашому регіоні."
 comintern_TITLE:0 "Комінтерн"
 communist_revolutionaries:0 "Комуністичні революціонери"
 computing_tech:0 "Технології обчислення"
 condemn_japan:0 "Засудити Японію"
