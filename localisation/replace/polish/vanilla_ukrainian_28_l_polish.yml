 WW_hungary.10.desc:0 "Дурне керівництво [FROM.GetNameDef] відкинуло нашу пропозицію, заявивши, що вона вигідна лише нам і що вони не можуть довіряти нашій відданості... Ким вони нас вважають!?"
 WW_hungary.100.desc:0 "[FROM.GetLeader] із [FROM.GetNameDef] прийняв наші вимоги й передав регіон Секейфьолд як автономний. Тепер ми відповідаємо за його захист та розвиток."
 WW_hungary.115.t:0 "[FROM.GetNameDefCap] приймає результати референдуму"
 WW_hungary.116.a:0 "Нам доведеться це прийняти"
 WW_hungary.119.desc:0 "Керівництво [FROM.GetNameDef] заявило, що результати референдуму в [45.GetName] є нелегітимними. Вони вважають, що вибори були сфальсифіковані й проведені під впливом [ROOT.GetAdjective] влади."
 WW_hungary.14.b:0 "Ми не підтримаємо їхні ілюзії"
 WW_hungary.24.a:0 "Чудово"
 WW_hungary.28.desc:0 "Підлий [FROM.GetLeader] з [FROM.GetNameDef] відмовив у нашому проханні, фактично перекривши всі можливості для співпраці між нашими державами у найближчому майбутньому. Тепер ми змушені шукати інші альянси або діяти самостійно."
