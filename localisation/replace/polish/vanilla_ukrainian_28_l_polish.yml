 FRA_submarine_4_desc:0 "Підводні човни класу Phénix були середнього розміру океанськими і далекобійними човнами, дозволеними у військово-морських програмах 1939-40 років, але початок війни та падіння Франції призвели до скасування цих човнів. Вони були схожі на клас Redoutable, хоча були меншими та водотоннажністю 1200 тонн. Вони мали таке ж важке торпедне озброєння."
