l_polish:
 1939_bookmark_threat:0 "Нещодавній фашистський експансіонізм"
 AAT_Sweden.2.desc:0 "На тлі відмови Пера Альбіна внести зміни до бюджету, одночасно відмовляючись піти у відставку на користь іншого кандидата, коаліція Фермерської партії та поміркованих вирішила висловити прем'єр-міністру вотум недовіри.\n\nПісля об'єднання цих двох партій у Пера Альбіна не залишилося іншого вибору, окрім як піти у відставку, залишивши пост прем'єр-міністра вакантним. Це спричинило кризу в уряді, де жодна партія не має політичного впливу, щоб прийти до влади.\n\nСам король виступив проти виниклого хаосу, що є надзвичайним кроком для монарха, який не має офіційної політичної влади."
 AAT_Sweden.3.a:0 "Пер Альбін Ганссон має мандат народу."
 AAT_Sweden.32.desc:0 "Держава [FROM.GetNameDef] повідомила нам, що не буде оскаржувати наші претензії на Борнгольм, але повідомила, що це безпрецедентний крок, який загрожує стабільності в Нордиці."
 AAT_Sweden_BoP.12.t:0 "Передвиборча кампанія — Зовнішня політика"
 AAT_Sweden_ball_bearing.1.c:0 "Попросити про обмін знаннями."
 AAT_Sweden_flashpoints.17.b:0 "Нам доведеться умиротворити [SWE.GetAdjective]у владу. Поки що."
 AAT_Sweden_flashpoints.35.desc:0 "Держава [GER.GetNameDef] висунула жорсткий ультиматум, в якому вимагає, щоби ми погодилися на їхні останні вимоги щодо доступу до нашої інфраструктури. У ньому зазначено, що якщо ми цього не зробимо, вони вважатимуть нас ворогом держави [GER.GetNameDef] і застосують всю силу, необхідну для забезпечення своїх інтересів у Скандинавії."
 AAT_Sweden_flashpoints.35.t:0 "[GER.GetName] ставить ультиматум"
 AAT_Sweden_flashpoints.53.b:0 "Ми придушимо цих агентів держави [SOV.GetNameDef]."
 AAT_Sweden_flashpoints.73.b:0 "Ми мало отримаємо від збереження кораблів."
 AAT_Sweden_flashpoints.78.c:0 "Якщо [SWE.GetName] надає компенсацію."
 AAT_Sweden_flashpoints.82.desc:0 "[SWE.GetName] погоджується виплатити нам фінансову компенсацію за Оландські острови. У зв'язку з укладенням угоди відбулася невелика церемонія, і хоча деякі оландці зі зрозумілих причин занепокоєні майбутнім, [SWE.GetAdjective]а влада запевняє, що перехід буде максимально плавним та поважатиме їхній лад життя."
 AAT_Sweden_nationalists.15.a:0 "Чергова перемога нашої влади."
 AAT_Sweden_nationalists.2.a:0 "Це ліпше, ніж нічого."
 AAT_Sweden_nationalists.3.t:0 "[FROM.GetNameDefCap] приймає пропозицію"
 AAT_Sweden_nationalists.6.t:0 "Безтурботний марш штурмовиків у регіоні [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.8.a:0 "Невелика ціна за відновлення величі держави."
 AAT_Sweden_nordic_defense_council.2.a:0 "Добре"
 AAT_finland_diplomacy.05.a:0 "Жертва в ім'я благородної мети!"
 AAT_finland_diplomacy.11.desc:0 "[FIN.GetAdjective]а держава молода, її народ живе розрізнено на територіях найрізноманітніших націй. У спробі об'єднати фінські народи її представники прийшли до нас із проханням інтегрувати Східну Карелію і Кольський півострів до складу [FIN.GetAdjective]ої держави."
 AAT_finland_diplomacy.26.a:0 "Ми прийдемо їм на допомогу!"
 AAT_finland_political.01.t:0 "Вотум недовіри лідеру [ROOT.GetLeader]"
 AAT_finland_political.05.t:0 "[ROOT.GetLeader] йде у відставку"
 AAT_finland_winter_war.02.a:0 "Можливо, настав час укласти мир..."
 AAT_finland_winter_war.07.a:0 "Будемо сподіватися, що вони нарешті зробили висновки."
 AAT_norway.1.b:0 "Ми могли б убити двох зайців одним пострілом."
 AAT_norway_rikstanken.6.desc:0 "[FROM.GetAdjectiveCap]ий уряд прагне розробити власну танкову програму, тому звертається до нас по допомогу. Він стверджує, що не тільки може отримати деякі технологічні та ідеологічні ноу-гау, але й що наша власна танкова програма також отримає вигоду від цієї угоди."
 AAT_norway_rikstanken.8.t:0 "[FROM.GetNameDefCap] надасть нам танки"
 ABILITY_ROTATING_RESERVES_DESC:0 "Резервні війська будуть частіше виходити в бій як підкріплення."
 ADD_BREAKTHROUGH_PROGRESS_EFFECT_DESC:0 "Здобуде прогрес прориву:"
 ADD_FACTION_INFLUENCE_EFFECT:0 "Додає державі $COUNTRY|H$ $VAL$ §Yвпливу§! в альянсі $FACTION|H$."
 AFA_ETH_neutrality_subject_DEF:0 "Афарська автономна область"
 AFA_ITA_fascism_subject_DEF:0 "Губернаторство Аусса"
 AFA_communism:0 "Революційно-демократичний афарський союз"
 AFG_baghlan_sugar_factory_idea:0 "Цукровий завод у Баглані"
 AFG_expand_standing_army:0 "Розширити постійну армію"
 AFG_expand_the_madrasas_desc:0 "Щоб краще контролювати наше населення та навчати його шляхам, якими воно має жити, ми повинні збільшити фінансування мусульманських освітніх установ, присутніх у нашій країні."
 AFG_exploit_turko_persian_heritage:0 "Використати тюрко-перську спадщину"
 AFG_foreign_intervention_category_desc:0 "Афганістан розташований на перехресті між різними великими державами. Історично склалося, що протягом XIX століття британці та росіяни сперечалися щодо статусу цієї знедоленої нації. Тепер нові країни, які виявляють інтерес до Афганістану, дестабілізували делікатний баланс у регіоні, і втручання для його забезпечення може бути неминучим."
 AFG_graveyard_of_empires_desc:0 "Імперії приходять і йдуть, але наш народ залишається беззаперечним господарем цього регіону. Доки наш народ залишається об'єднаним та пов'язаним зі своєю спадщиною, будь-який агресор побачить, що [ROOT.GetNonIdeologyName] справді є його могилою."
 AFG_industrial_events.11.desc:0 "[FROM.GetAdjective] уряд погодився інвестувати в розвиток наших нафтових ресурсів в обмін на довгострокову частку після початку видобутку."
 AFG_infantry_equipment_0:0 "Rifle No.1 MkIII"
 AFG_instate_a_compulsory_jizya:0 "Запровадити обов'язкову джизію"
 AFG_invite_to_turko_persian_faction:0 "Запросити §Y[FROM.OWNER.GetNonIdeologyName]§! до фракції"
 AFG_islamic_republic_democratic:0 "Ісламська республіка Афганістан"
 AFG_mahmud_tarzi:0 "Махмуд Тарзі"
 AFG_modifiy_1923_constitution_modifier_tt:0 "Модифікувати §Y$AFG_1923_constitution_modifier$§! на:\n"
 AFG_pashtunistan_ascendancy_communism:0 "Пуштунська народна республіка"
 AFG_pashtunwali_desc:0 "Пуштуни складають найбільшу та найвпливовішу частину населення. Значна частина пуштунів живе за традиційним кодексом етики та правил, відомим як Паштунвалі. Це ускладнює урядам утримання влади, не кажучи вже про проведення реформ, коли вони суперечать традиційному кодексу."
 AFG_political_events.100.a:0 "Якщо це призведе до довгострокового миру, хто ми такі, щоб сперечатися?"
 AFG_political_events.121.desc:0 "Демонструючи свою прихильність до ідеалів міжнародної солідарності, [FROM.GetNameDefCap] погодилася допомогти нам у нашій боротьбі. Вони повідомляють нам, що повністю оснащені добровольці їхніх збройних сил незабаром вирушать до нас."
 AFG_political_events.132.a:0 "Втрачена можливість."
 AFG_political_events.153.desc:0 "У невеликому повідомленні $AFG_faqir_of_ipi$, традиціоналістський племінний лідер у [FROM.GetNonIdeologyName], звернувся до нашого уряду з проханням про підтримку його сходження на трон. Він обіцяє, що за нашої підтримки він створить сильну націю, узгоджену з нашими інтересами."
 AFG_political_events.173.t:0 "Новий королівський прем'єр-міністр"
 AFG_political_events.40.desc:0 "Представники [FROM.GetAdjective] посольства висунули ультиматум нашому уряду. Вони вимагають, щоб ми обмежили іноземний вплив у нашій нації, який міг би поставити під загрозу інтереси [FROM.GetAdjective]s, або зіткнутися з можливим військовим втручанням для заміни нашого уряду."
 AFG_political_events.90.t:0 "[AFG.GetNameDefCap] підтримує реакціонерів у Центральній Азії."
 AFG_political_events_51_tt:0 "Коли розпочнеться громадянська війна в [AFG.GetNonIdeologyName]: "
 AFG_promote_muslim_work_ethic_desc:0 "Західняки довгий час хвалилися своєю «протестантською трудовою етикою», ігноруючи важку працю ісламського світу. Настав час нагадати їм, що ми є їхніми рівними у нашій відданості та досвіді."
 AFG_qiamuddin_khadim:0 "Кіамуддін Хадім"
 AFG_raise_quami_active:0 "нерегулярні війська сформовані"
 AFG_reform_3:0 "Обмежити антидемократичний вплив"
 AFG_research_bonus_2:0 "Інвестувати у військово-морські розробки"
 AFG_retire_the_uncles:0 "Відправити дядьків у відставку"
 AFG_savior_of_the_holy_lands_trait:0 "Спаситель Святої землі"
 AFG_soviet_research_cooperation_desc:0 "Наші колишні супротивники в [SOU.GetNameDef] швидко стали нашими найближчими друзями після повалення старого режиму. Тому ми маємо можливість отримати від них технологічні знання, які допоможуть у трансформації [ROOT.GetNonIdeologyName]."
 AFG_support_king_zahir:0 "Підтримати короля Захіра"
