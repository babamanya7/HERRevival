 SOV_leader_of_the_party_and_the_people_desc:0 "Товариш Сталін старанно і вміло виконує свої важкі завдання і користується беззастережною і безроздільною підтримкою як партії, так і народу. Будь-який натяк на марнославство або самозамилування йому чужий; він, мабуть, найскромніша людина з усіх нині живих."
