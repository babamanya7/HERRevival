 ETH_chitet_law_tt:0 "Автоматично збільшує штрафи та резерви людських ресурсів під час війни.\nДозволяє скликати національне ополчення в час війни."
 ETH_cie_anarcho_communist:0 "[ETH.GetAdjectiveCap]ий залізничний колектив"
 ETH_clearing_the_skies_tt:0 "\nЯкщо §Y[SOV.GetFlag][SOV.GetNameDef]§! погодиться, §Y[ETH.GetFlag][ETH.GetName]§! отримає §G100§! [SOV.GetAdjective]их винищувачів і технологію §YРанній винищувач§!."
 ETH_communal_education:0 "Комунальна освіта"
 ETH_consolidate_east_africa:0 "Консолідувати Східну Африку"
 ETH_demand_DJI_desc:0 "Після звільнення [AFA.GetName] тепер ми керуємо значною кількістю афарських народів. Однак афари залишаються розділеними через окупацію [FRA.GetAdjective]ого Джібуті. Вимагаючи звільнення народу Афар від імперіалістичного правління, ми, можливо, зможемо завоювати лояльність народу Афар і отримати стратегічний порт у цьому процесі."
 ETH_djibouti_purchase_idea:0 "Купівля Джібуті"
 ETH_djibouti_sale_idea:0 "Продаж Джібуті"
 ETH_electrify_state_desc:0 "Проведення електроенергії до місцевих сіл є ключовою частиною модернізації країни."
 ETH_ethiopian_officers:0 "[ROOT.GetAdjective]і офіцери"
 ETH_fait_accompli_desc:0 "Хоча багато хто припускав, що [ETH.GetName] стане виноскою в історії колоніалізму, але натомість вона подолала величезні труднощі, не лише відбивши [ITA.GetAdjective]е вторгнення, але й повністю вигнавши [ITA.GetName] зі Східної Африки. Все, що залишилося зробити, це змусити [ITA.GetAdjective]у владу офіційно визнати свою поразку."
 ETH_falling_back_tt:0 "Італійські війська отримають штраф до руху й атаки в підконтрольних Ефіопії прикордонних областях на 60 днів."
 ETH_host_nation_fallback_name:0 "Приймаюча країна"
 ETH_invite_foreign_prospectors:0 "Запросити іноземних старателів"
 ETH_liberate_DJI_tt:0 "Отримає ціль війни проти власників [DJI.GetAdjective]ої території."
 ETH_mesafint_total_control_range:0 "Месафинт контролюють політику"
 ETH_navy_2_dynamic_modifier:0 "Недосвідчений флот"
 ETH_number_levy_units_less_than_five:0 "Менш ніж 5 активних дивізій ополчення"
 ETH_our_own_path_tt:0 "§R[SOV.GetNameDefCap] буде розлючений таким курсом дій і може спробувати повернути Ефіопію під [SOV.GetAdjective]ий контроль!§!"
 ETH_outsourced_production_desc:0 "Наша промисловість залишається малою та недосвідченою, коли справа стосується виробництва знарядь війни. Однак тепер ми міцно перебуваємо у сфері впливу [ITA.GetAdjective], тому ми можемо максимально використати ситуацію, передавши наші виробничі потреби на аутсорсинг і використовуючи досвід їхніх виробників зброї."
 ETH_refuge_for_spanish_exiles_idea:0 "$ETH_refuge_for_the_spanish_exiles$"
 ETH_replace_the_abuna:0 "[Get_ETH_replace_the_abuna_name]"
 ETH_restore_the_empire_of_axum:0 "Відновити Аксумську імперію"
 ETH_scavenging_tactics_idea:0 "$ETH_scavenging_tactics$"
 ETH_send_home_advisors_desc:0 "Хоча ми користувалися підтримкою [SOV.GetName] під час війни з [ITA.GetName], ми ніколи не очікували, що вони змусять нас виконувати таку підпорядковану їм роль. Розбудовуючи власний промисловий і військовий потенціал, у нас стає все більше сил протистояти вимогам [SOV.GetAdjective]. Таким чином, настав час уточнити, хто відповідає за [ETH.Capital.GetCapitalVictoryPointName]."
 ETH_tax_exemption_default_desc:0 "Нам потрібно зберегти дворянство задоволеним, щоби запобігти фрагментації [ETH.GetName]. Тому ми винагородимо їх за їхню постійну лояльність, розширивши їхні податкові пільги, що дозволить їм зберегти більшу частину свого багатства."
