 AUS_alexander_lohr:0 "Александер Льор"
 AUS_austrian_communists_active:0 "Австрійська комуністична пропаганда"
 AUS_autobahn_east_desc:0 "Ми підключили наш автобан до наших партнерів, що виявилося вигідним для обох сторін. Дивлячись на схід, ми бачимо нашого старого союзника в подвійній монархії, [HUN.GetNameDef], якщо ми об’єднаємо наші інфраструктури, ми також зможемо сприяти кращим стосункам з ними."
 AUS_beyond_our_old_lands:0 "За межі минулого"
 AUS_devalued_the_schilling_desc:0 "Для запобіганню інфляції, валюта була девальвована. Короткострокові наслідки не дуже сприятливі, але в довгостроковій перспективі це має свідчити про покращення для нації."
 AUS_eberhard_reininghaus:0 "Ебергард Райнінггаус"
 AUS_graf_und_stift_focus_desc:0 "Хоча компанія GRäf & Stift практично ніколи не виготовляла вантажівки для військових, у них дуже хороша репутація у виробництві швидких легкових і вантажних автомобілів. Хоча це нетрадиційний підхід, він, безумовно, може виявитися корисним у цій галузі."
 AUS_habsburg_monarch:0 "Габсбурзький монарх"
 AUS_heavy_specialization:0 "Ініціатива Grossflugzeugkompanie"
 AUS_join_the_allies_desc:0 "Традиційно ми завжди вважали себе найсильнішими самі по собі, але, оскільки ситуація навколо нас продовжує погіршуватися, ми змушені зіткнутися з фактом, що це може бути неправдою. Залишитися на самоті не завжди найкращий варіант. Ми повинні прагнути приєднатися до сильної демократичної фракції."
 AUS_militia_support_desc:0 "Ми заручилися підтримкою [GetMilitiaName], щоб допомогти нашій справі. Ця парамілітарна організація давно заборонена, але в цій ситуації ми можемо легко виправдати їх повернення."
 AUS_minister_of_education:0 "Міністр освіти"
