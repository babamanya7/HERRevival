 GOE_RAJ.47.desc:0 "Народна Республіка Індія почала розширювати свій ідеологічний вплив за межі своїх кордонів.\n\nВ останні тижні проіндійські голоси стали гучнішими у нашій політичній сфері. Видання вихваляють їхню модель децентралізованого соціалізму, їхній опір іноземному впливу та їхній очевидний успіх у трансформації постколоніальної держави.\n\nЧи є це частиною скоординованих зусиль [From.GetNameDef] для зміщення нашої внутрішньої політики, залишається незрозумілим, але їхня присутність відчувається."
