 LOADING_TIP_137:0 "«Можливо заплатити надто високу ціну, навіть за мир».\n(Майкл Джозеф Севедж про Чемберленову політику вмиротворення)"
 LOADING_TIP_87:0 "«Під час війни правда є настільки цінною, що за нею завжди мусить приглядати тілохранитель брехні».\n(Вінстон Черчилл)"
