 AIR_SUPERIORITY_BAR_DISABLED:0 "У нас є авіакрила в цьому регіоні, але вони або не виконують свої завдання, або не можуть обійти ворожу перевагу в повітрі."
 AIR_TITLE_HEAVY_FIGHTER:0 "Важкі\nвинищувачі"
 AIR_VIEW_AIR_SPEED_LOWER:0 "Середня величина нашої §Hшвидкості§! §Rнижча§! за їхнє"
 AIR_VIEW_DAMAGE_DISRUPTED_PLANES_BY_US:0 "§HВорожих літальних апаратів перервано§!\nНанесено достатньо шкоди, щоби змусити літальний апарат повернутися на базу, перш ніж він виконав своє завдання."
 AIR_VIEW_SHOW_OUR_MISSIONS:0 "§HНаші завдання§!\nПоказати результати завдань, виконаних нашими авіакрилами."
