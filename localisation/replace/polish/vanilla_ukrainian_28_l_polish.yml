 improved_decimetric_radar_desc:0 "Радар уже довів, наскільки він важливий, але в нас поки що занадто мало дециметрових радарів, щоби забезпечити хороше охоплення. Оснастивши радаром інші військові частини, ми зможемо використовувати цю технологію в повному обсязі."
