 SOV_organize_uprisings_in_the_country_tt:0 "Розпочинає повстання в різних частинах країни, що призведе до більшої підтримки громадянської війни в Радянському Союзі."
 SOV_paranoia_medium_decrease_effect_tt:0 "£SOV_paranoia_text_icon Політична параноя зменшується на [?SOV_paranoia_medium_decrease|G]"
