 HABSBURG_securing_the_consumer_rights_desc:0 "Хоча прихильники війни є повсюди, ми повинні пам’ятати, хто саме робить цю федерацію можливою. Це люди, народ, і ми повинні забезпечити, щоб вони завжди були задоволені ситуацією."
