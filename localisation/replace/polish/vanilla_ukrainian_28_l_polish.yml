 TUR_AI_BEHAVIOR:0 "@TUR Туреччина"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_ISLAMIST:0 "Ми не зможемо повноцінно керувати державою, доки не викинемо з кожного її куточку кемалістську заразу. Поки що цього не сталося, законно обраний уряд не може повністю довіряти навіть власній армії! Так не може продовжуватися."
 TUR_PROVISIONARY_fascism:0 "Тимчасова анатолійська держава"
 TUR_acquiesce_to_fundamentalists:0 "£faction_tur_traditionalist Піти назустріч фундаменталістам"
 TUR_alter_the_royal_laws_of_succession:0 "Змінити закони престолонаслідування"
 TUR_annul_the_ankara_anlasmasi:0 "Анулювати Анкарську угоду"
 TUR_balkan_defense_council:0 "Балканська оборонна рада"
 TUR_british_dockyards_in_turkey:0 "Британські верфі в Туреччині"
 TUR_collaborative_civil_works_programme_desc:0 "Якщо все залежало від держави [ITA.GetNameDef], то союз [ROOT.GetFactionName] займався б виключно підкоренням інших народів. Ми хочемо, щоби наші слова прозвучали голосом розуму і нагадуємо про інші методи правління. Чому ніхто не думає про рівень зайнятості чи післявоєнну економіку? Ми мусимо об'єднати зусилля та працювати спільно, інакше все це кровопролиття було марним."
 TUR_counter_the_rebels_in_hakkari_desc:0 "Повстанці в Хаккярі зазвичай більш організовані, ніж деінде, і боротися з ними серед численних гір і пагорбів важче."
 TUR_counter_the_rebels_in_van:0 "Протистояти повстанцям у Вані"
 TUR_debt_council_desc:0 "Пішовши нарешті в історію, Османська імперія залишила нам прощальний подарунок — величезний борг. Ми винні купу грошей та активів західним державам, але, що найбільш принизливе, нашими боргами управляємо навіть не ми. Рада по заборгованостях у своїй безмежній мудрості збирається у Франції."
 TUR_democratic_party_islamist_long:0 "Демократична партія"
 TUR_disorganised_armed_forces_18:0 "$TUR_disorganised_armed_forces$"
 TUR_expanded_credit_on_our_debts_desc:0 "Як вдало, що ми виявилися союзниками багатьох держав, які мають у великому боргу! Безперечно, наша участь у цьому конфлікті буде законним приводом списати частину боргу — в ім'я нашої спільної боротьби за свободу, звичайно."
 TUR_expanding_our_navy:0 "Розширити наш флот"
 TUR_fethi_okyar:0 "Фетхі Ок'яр"
 TUR_fighter_equipment_3_short:0 "THK P47"
 TUR_fully_integrate_the_is_bank:0 "Повністю інтегрувати İş Bank"
 TUR_fundamentalist_state_management_category:0 "Керування фундаменталістськими землями"
 TUR_georgian_manganese_extraction_desc:0 "У Грузії є дуже багато нерозроблених корисних копалин та металів, у той час як наші запаси скромні та їх не вистачає. Ми надішлемо регіональній владі Грузії пропозицію дозволити нам видобувати для них копалини в обмін на право забирати частину надлишків собі. Якщо вони погодяться, ми зможемо лити сталь прямо поряд із Трабзоном."
 TUR_halide_edib_adivar:0 "Халібе Едіб Адивар"
 TUR_inanc_vergisi_spirit_desc:0 "«Податок на віру» — абсолютне втілення світської доктрини кемалізму. Це агресивна міра, яку багато хто вважатиме великим кроком до атеїзму на державному рівні."
 TUR_join_the_allies_desc:0 "Світ досяг доленосного моменту — багато імперій змагаються, щоби змінити його назавжди. Ми опинилися в центрі цієї боротьби і маємо відстоювати цінності, на яких заснована наша країна, борючись за свободу разом із націями Заходу."
 TUR_join_the_axis_desc:0 "Майбутнє держави [ROOT.GetNameDef] нерозривно пов'язане з нацією, якій судилося змінити світ. Немає іншої такої країни, готової скинути старезний статус-кво і розпочати нову епоху миру та процвітання, як [GER.GetNameDef]. Ми маємо допомогти втілити цю ідею у реальність."
 TUR_kemalist_army_officers_decreased_power_neutral:0 "Офіцери-кемалісти"
 TUR_kemalist_army_officers_limited_power_neutral:0 "Офіцери-кемалісти"
 TUR_kemalist_infiltration_mission:0 "£faction_tur_kemalist Криза проникнення кемалістів"
 TUR_kemalist_state_management_category:0 "Керування кемалістськими землями"
 TUR_kemalist_state_management_category_desc:0 "Прихильники кемалізму зазвичай живуть у великих містах і схильні захищати свої політичні погляди так запекло, ніби відстоюють власний спосіб життя."
