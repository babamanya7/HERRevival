 INS_oil_decisions_unlock_tt:0 "Відкриває нові рішення §Y$INS_realign_supply_chains_cat$§! для продажу §YНафти§!."
 INS_paramount_of_bali:0 "Верховний правитель Балі"
 INS_political_events.12.b:0 "Ми не зацікавлені у співпраці з революціонерами."
 INS_political_events.15.t:0 "Захисники Батьківщини"
 INS_political_events.17.t:0 "[INS.GetName] проголошує незалежність"
 INS_political_events.7.a:0 "Ми повинні почати переговори, щоб уникнути неминучої громадянської війни."
 INS_political_events.7.c:0 "Можливо, націоналісти мають рацію?"
 INS_privately_owned_military_industry:0 "Приватна військова промисловість"
 INS_revolution_events.12.a:0 "Ми не можемо дозволити цьому загостритися."
 INS_revolution_events.12.t:0 "Ополченці намагаються окупувати [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.2.a:0 "Ми зробимо це за Борнео."
 INS_revolution_events.24.desc:0 "[FRA.GetNameDefCap] відмовилися допомогти нам з революцією, незважаючи на терміновість. Ми повинні почати швидко переозброюватися, інакше незабаром ми опинимося в меншості."
 INS_revolution_events.34.a:0 "Будемо сподіватися, що голландці прислухаються до голосу розуму."
 INS_revolution_events.41.t:0 "Голландці кидають нам виклик"
 INS_revolution_has_started:0 "Національна революція триває"
 INS_royal_dutch_shell_name_nationalized:0 "Permina"
 INS_soetardjo_pending_desc:0 "Сутарджо — член Фольксрааду, відомий як лідер мирного націоналістичного руху. Зараз він організовує петицію з проханням надати [INS.GetNameDef] більшу автономію та організувати конференцію круглого столу між нідерландськими та індонезійськими представниками, щоб обговорити прагнення індонезійців стати автономними у складі нідерландської співдружності. Ця петиція наразі обговорюється у Фольксрааді. Коли ці дебати завершаться, ми маємо вирішити, як реагувати, оскільки наслідки петиції мають величезне значення."
 INS_union_events.9.a:0 "Якщо ми хочемо вистояти, ми повинні вистояти разом."
 INS_unity_in_diversity_explain_tt:0 "Дозволяє зробити §Gнаціональним регіоном§! будь-яке індонезійське князівство, яке отримало промислові інвестиції."
 INS_utilize_tan_malakas_militia:0 "Використати ополчення Тана Малаки"
 INS_volksraad_cat_desc:0 "Народна рада, відома нідерландською як Фольксраад, була заснована у 1918 році як спроба принести демократію в Ост-Індію в рамках впровадження так званої «Етичної політики». Місця займають як нідерландські, так і індонезійські чиновники, обрані різними шляхами. Хоча Нідерланди зберігають безумовне право вето, Фольксраад може подавати пропозиції та законопроєкти на розгляд уряду."
 INS_volksraad_events.40.t:0 "Пропозиція у Фольксрааді зменшити експортний податок на каучук"
 INS_volksraad_rumors_tt:0 "Усі §Yіндонезійські §!радники Фольксраду будуть §Gзбережені§! після проголошення незалежності."
