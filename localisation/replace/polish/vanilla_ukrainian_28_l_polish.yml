 NOR_complete_the_sourthern_railway_network:0 "Завершити будівництво мережі південних залізниць"
 NOR_contain_the_labor_movement_desc:0 "Поки існує рух, присвячений інтересам робітничого класу, ми ніколи не зможемо повністю контролювати капітал, що надходить до [NOR.GetName], і засоби для увічнення його потоку."
 NOR_crackdown_on_civilian_life:0 "Репресії проти цивільного життя"
 NOR_crush_stalin_ns_desc:0 "Сталін і його так званий [SOU.GetName] використовуються як мірило того, що означає комунізм. Ми не можемо дозволити цьому тривати, адже режим цього бандита є нічим іншим, як старою Російською імперією з червоною фарбою."
 NOR_expand_merchant_marine:0 "Розгорнути торговий флот"
 NOR_expand_military_industry_desc:0 "Нашої військової промисловості, що зароджується, буде недостатньо, щоб знищити світовий капіталізм. Її потрібно розширити, щоб задовольнити потреби наших збройних сил, що постійно зростають."
 NOR_hurtigruten_desc:0 "Не можна заперечувати, що [ROOT.GetNonIdeologyName] не тільки надзвичайно довга країна, але й має дуже складний рельєф навколо. Це, безперечно, сформувало нашу національну ідентичність, але також унеможливлює належне будівництво інфраструктури та залізниць. Ми має створити Hurtigruten як обхідний шлях, серію поромів для перевезення людей і товарів уздовж [ROOT.GetAdjective]ої берегової лінії."
 NOR_iceland_desc_PAWJ:0 "Наш камергер, наш король і наш принц не будуть спати, доки це не буде виправлено і Ісландія знову є частиною Королівства Норвегія."
 NOR_invite_soviet_designers_desc:0 "Технічні ноу-гау, якими володіють наші комуністичні союзники, на десятиліття випереджають наші; якщо вони нададуть нам свій досвід, ми зможемо перескочити наших ворогів і уникнути непотрібного кровопролиття, маючи кращу зброю та транспортні засоби."
 NOR_join_the_comintern_desc:0 "Комуністичний Інтернаціонал є справжньою парасолькою, яка бореться за революцію пролетаріату в усьому світі. Якщо ми сподіваємося перемогти капіталізм і фашизм, це найкращий і єдиний шлях."
 NOR_kingdom_of_norway_dmod_desc:0 "У чому сенс цього фасаду демократії? Тепер, коли Стортинг остаточно розпущений, наше королівство може процвітати під доброзичливою рукою нашого короля і праведним кулаком нашого лорда-регента Педера Анкера Веделя-Ярлсберга."
 NOR_leaving_the_hard_thirties_behind:0 "Залишити важкі тридцяті позаду"
 NOR_mio_trait_cruiser_specialization:0 "Спеціалізація на крейсерах"
 NOR_neutrality_party:0 "Ліві"
 NOR_skule_storheil:0 "Скуле Сторгейл"
 NOR_the_kings_abdication_desc:0 "Король і його камергер, усвідомивши жахливу силу наших загарбників, не мають нічого, щоб дати своєму народу або взяти в нього. Король Гокон VII у рідкісній публічній появі оголосив, що кожен [NOR.GetAdjective]ий громадянин повинен вклонитися фашистам, які кишать нашими землями."
 NOR_uproot_secret_army:0 "Викорінити таємну армію"
 NOR_when_the_coup_starts_TT:0 "Коли почнеться фашистський переворот:\n"
 NOT_ENOUGH_PLANES_FOR_MISION:0 "§RВашому авіакрилу потрібно принаймні $NUM$ літаків, щоби почати це завдання.§!"
 NO_INTERSECTED_EQUIPMENT_TITLE:0 "Небезпечна модифікація"
 NSB_poland_communist_events.501.desc:0 "Як всі і передбачали, [From.GetLeader] приймає [Root.GetAdjective] оголошення незалежності різко негативно і вважає його актом агресії."
 NSB_poland_monarchist_events.2.desc:0 "На жаль, ми більше не можемо підтримувати свої претензії на державу [From.GetNonIdeologyName]. Поточний [From.GetAdjective] уряд безумовно виграв пропагандистську війну, і тепер всі розмови про претензії, які висуває [Root.GetLeader], викликають лише сміх."
 NSB_poland_royal_election.4.t:0 "Анастасія Романова прибуває до Польщі"
 NSB_polish_fascist_events.1.b:0 "У нас інші плани на Польщу."
 NSB_polish_fascist_events.401.a:0 "Це прийнятно."
 NSB_polish_fascist_events.6.desc:0 "Постійна агітація фалангістів вилилася в серію націоналістичних бунтів на вулицях Варшави. Бунтівники, явно натхненні тим, що [Root.GetLeader] планує співпрацювати з правими екстремістами і заохочувати їх. Офіцери, вірні урядовим санаціоністам, не змогли втримати натовп, і той пішов на штурм, внаслідок чого [Root.GetLeader] видворявся з будівлі."
 NSB_soviet_civil_war_common.106.desc_exiles_before:0 "Антикомуністичні угруповання в Маньчжурії затіяли змову, мета якої — [SOV.GetLeader]. Вони планують скинути більшовиків під час чергової громадянської війни. Представники угруповань звернулися до нас із проханням на майбутні права на нафту з родовищ Баку."
 NSB_soviet_civil_war_common.123.t:0 "[FROM.GetName] залишає нас"
 NSB_soviet_civil_war_common.124.t:0 "[FROM.GetAdjectiveCap]і фабрики добудовані"
 NSB_soviet_fascist_tsarist.2.t:0 "Панслов'янський союз — [FROM.GetNameDef] приймає пропозицію"
 NSB_soviet_fascist_tsarist.28.t:0 "Токійська вісь — [GER.GetName] відкидає пропозицію"
 NSB_soviet_foreign_politics_events.10.b:0 "Це лише збільшить нашу залежність від держави [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.2.b:0 "Надайте туди сили правопорядку, нехай натягнуть пару боків!"
 NSB_soviet_foreign_politics_events.210.c:0 "Нехай приходять!"
 NSB_soviet_foreign_politics_events.211.t:0 "Пропозиція Хакімова"
 NSB_soviet_nationalist.002.b:0 "Може, воно і на краще."
 NSB_soviet_paranoia_system_events.29.desc:0 "Свідчень того, що в армії існує ціла мережа троцькістів, стає все більше. Щодня НКВС ловить нових підозрюваних за показаннями заарештованих раніше. Схоплені, у свою чергу, розкривають імена інших змовників. На те, щоби розкрити. всіх замішаних у цьому генералів, знадобиться час, але вже ясно, що у списку нижче перерахована значна їх частина, чия провина доведена їх власними зізнаннями."
 NSB_soviet_spanish_civil_war.3.desc:0 "Радянські десантники-антисталіністи таємно прибули до Барселони з декількома відмінно підготовленими агентами, які співчувають нашій справі. Згідно з нашими посередниками в Радянському Союзі, це підкріплення допоможе нам утворити елітні бригади. а також поповнить наше командування досвідченими агентами та офіцерами."
 NSB_soviet_spanish_civil_war.6.b:0 "Революція чи смерть!"
