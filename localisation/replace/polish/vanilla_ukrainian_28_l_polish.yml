 SIA_a_race_against_time_desc:0 "Наш флот застарілий, недофінансований і не підготовлений до сучасної війни. Кошти повинні бути негайно перенаправлені на суднобудування, ремонт, берегову оборону та військово-морську підготовку. Годинник цокає швидше, ніж працюють наші верфі."
 SIA_a_race_against_time_tt:0 "Після закінчення дії духу ми отримаємо: "
 SIA_achieve_domestic_legitimacy_desc:0 "Уряд вижив завдяки силі зброї, але тепер він повинен перемогти завдяки закону, хлібу та порядку. Довіра громадськості має бути відновлена, надзвичайні заходи мають бути обґрунтовані, і народ повинен побачити, що цивільне правління пропонує більше, ніж просто виживання."
