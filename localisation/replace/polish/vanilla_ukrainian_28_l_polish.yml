 AUS_ELIN:0 "ELIN"
 AUS_STATE_91:0 "Лемберг"
 AUS_VICTORY_POINTS_6889:0 "Рагуза"
 AUS_air_base_intiative:0 "Зусилля з будівництв авіабаз"
