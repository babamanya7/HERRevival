 BOU_neutrality:0 "Республіка північних Соломонових островів"
 BRA_USA_tech_sharing_group_name:0 "Програма обміну технологіями між США та Бразилією"
 BRA_address_labor_disputes:0 "Вирішити трудові суперечки"
 BRA_amazonian_settlement_cat:0 "Військові поселення в Амазонії"
 BRA_amazonian_settlement_desc:0 "Амазонія багата ресурсами та землею, готовими до експлуатації. Щоб стимулювати економіку та створити стимул для наших солдатів воювати, ми повинні запропонувати тим, хто приєднається до військових, можливість придбати такі землі після відповідного терміну служби."
 BRA_anaue_idea:0 "Anauê"
 BRA_anti_cangaceiro_op_in_progress:0 "Операція проти кангасу проводиться"
 BRA_batalha_do_borracha:0 "Batalha da Borracha"
 BRA_coffee_crisis_aftermath_desc:0 "Велика депресія зруйнувала бразильську економіку через надмірну залежність від експорту, головним чином кави. Хоча були докладені зусилля для відновлення економіки, нам залишається завершити цю роботу. Ми відродимо наші галузі промисловості та станемо економічним центром континенту."
 BRA_desenvolvimentismo_desc:0 "Якщо ми хочемо, щоб люди повернулися до роботи і наш експорт знову почав функціонувати, нам потрібно розпочати зростання економіки. Ми зробимо це, створюючи нові галузі промисловості та полегшуючи людям доступ до фінансових послуг."
 BRA_ensure_continued_military_support_desc:0 "Збереження підтримки військових є життєво важливим для довговічності нашого режиму. За допомогою кількох обіцянок між державою та провідними офіцерами, безсумнівно, їх можна залучити на нашу сторону."
 BRA_foreign_legion_tt:0 "Створити шаблон §YLegião Estrangeira§! та розгорнути його §G3§! одиниці в місті [ROOT.Capital.GetCapitalVictoryPointName].\n\nВідмикає сукупність рішень §Y$BRA_foreign_legion_cat$§! для вербування додаткових дивізій §YLegião Estrangeira§!."
 BRA_form_mercosul_focus_tt:0 "Відмикає рішення для запрошення інших південноамериканських націй приєднатися до Mercosul"
 BRA_invest_in_the_armed_forces:0 "Підкупити військових"
 BRA_italian_air_mio_tt:0 "Відкриє військово-промислову організацію §Y$ITA_fiat_aviazione_organization$§!."
 BRA_italian_car_industry_desc:0 "Наше автомобільне виробництво знаходиться на початковій стадії, тим часом наші друзі в [ITA.GetName] мають велику та успішну автомобільну промисловість. Можливо, настав час звернутися до них за порадою щодо покращення наших молодих компаній."
 BRA_light_cruiser_1:0 "Клас «Bahia»"
 BRA_light_ship_engine_1:0 "«Parsons» 24 500 к. с. н. в."
 BRA_nationalized_banks_desc:0 "Націоналізувавши банки, ми зможемо посилити контроль над пропозицією грошей в економіці та переспрямувати їх із кишень акціонерів до рук робітників."
 BRA_neutrality_party_long:0 "Нова держава"
 BRA_penal_battalions_tt:0 "Створює шаблон дивізії, відомий як §YBatalhões de Presos§!, який використовує штрафні батальйони. Також набирає §Y6 одиниць§! у місті §Y[ROOT.Capital.GetCapitalVictoryPointName]§!."
 BRA_presidential_republic_desc:0 "Нація потребує сильне, рішуче керівництво, здатне об'єднати народ і захистити наші кордони. Для цього ми зосереджуємо політичну владу в руках президента республіки, хоч і мусимо забезпечити сильну систему стримувань і противаг, щоби запобігти черговій спробі Варгаса захопити владу."
 BRA_promote_immigration_to_brazil_desc:0 "[BRA.GetName] — це різноманітна нація, чиї предки походять з усього світу. З відродженням нашої економіки та великою кількістю ресурсів, які чекають на використання, настав час заохочувати більше людей переїжджати сюди та називати себе [BRA.GetAdjective] також."
 BRA_repeal_the_national_security_law_desc:0 "Загроза того, що інший опортуністичний президент підірве нашу демократію, буде постійною, якщо ми не скасуємо закони про національну безпеку, які $BRA_getulio_vargas$ використовував під час надзвичайного стану."
 BRA_road_investment:0 "Інвестування в дороги"
 BRA_secure_our_borders_idea_desc:0 "$BRA_secure_our_borders$"
 BRA_south_american_defense_cooperation_desc:0 "Наш континент різноманітний як за людьми, так і за географією. Проводячи спільні військові навчання з нашими сусідами, наш народ отримує розуміння не лише того, як вони воюють, але й того, як вони живуть."
