 JAP_can_no_longer_manually_promote_civ_government_tt:0 "Ми більше не зможемо §Rвручну підтримувати§! §Yцивільну фракцію§!"
 JAP_china_step_up_war_effort:0 "Ескалація війни в Китаї"
 JAP_claim_the_raven_crown:0 "Претензія на Воронячу корону"
 JAP_democratic_women_in_the_workforce:0 "Жінки в робочій силі"
 JAP_develop_new_fighters_desc:0 "Нова розробка Міцубіші цілком може виявитися найбільш дієздатним палубним винищувачем, створеним на сьогодні. Неперевершена маневреність у поєднанні з пристойною дальністю означає, що цей проєкт, ймовірно, слугуватиме нам роками. Ми повинні негайно розпочати створення прототипів і виробництво."
 JAP_develop_sophisticated_artillery_equipment:0 "Розробити вдосконалене артилерійське спорядження"
 JAP_develop_sophisticated_artillery_equipment_desc:0 "Армія чітко дала нам зрозуміти, наскільки застарілою є зброя, що зараз є в їхньому розпорядженні, і вимагає щось із цим зробити. Ми повинні зробити великі інвестиції в розробку більш сучасних артилерійських гармат, щоб нам не довелося атакувати ворога, поки він практично вже не здався."
 JAP_enact_religious_organizations_law:0 "Прийняти Закон про релігійні організації"
