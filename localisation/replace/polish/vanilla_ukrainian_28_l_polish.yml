 TUR_reaffirm_the_balkan_pact_desc:0 "Балканський пакт був сформований на опір болгарському та угорському іредентизму, але з тих часів світ став набагато небезпечнішим. Цей пакт не відповідає вимогам сучасності — його треба перетворити на Балканську Антанту!"
 TUR_reformism_decision_desc:0 "Наш народ завжди знаходився на самому вістрі — відомо, що навіть османи іноді розсовували межі можливого своїми політичними та соціальними реформами. Динамічність [FROM.GetAdjective]ого народу — одна з найкращих наших якостей."
 TUR_restoring_our_nations_pride_desc:0 "За останні кілька років ми досягли величезних успіхів. З жертв, розчавлених жахом після величезних втрат у Великій війні, ми перетворилися на завойовників, які здобули перемогу за перемогою по всьому світу. Ми стоїмо на порозі великої епохи: золотої доби вовка!"
