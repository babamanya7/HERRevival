 ITA_go_after_france_desc:0 "Франція... ще одна реакційна демократія Заходу, котра щомиті прагне завадити просуванню вперед і часто ставить під загрозу саме існування італійського народу. Ми йдемо в бій за благо Італії та майбутнє Імперії."
 ITA_increase_production:0 "Збільшити виробництво"
 ITA_integrate_polizia_dell_africa_italiana_desc:0 "Ми мусимо інтегрувати нашу колоніальну поліцію, поки ці підрозділи залишаються вірними Італії та нашому режиму. Партизани, без сумніву, незабаром спробують заволодіти цими військами..."
 ITA_integrate_polizia_dell_africa_italiana_eritrea_tt:0 "Створити §Y1 піхотну§! дивізію й §Y1 кавалерійську§! дивізію."
