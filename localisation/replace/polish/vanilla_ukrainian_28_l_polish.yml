 CHL_releases_usa_tt:0 "Необхідні землі буде передано підлеглій §Yреорганізованій Америці§!."
 CHL_ruler_of_the_inca_desc:0 "Стара Імперія Інків була великою і охоплювала значну частину Анд. Ми мусимо відтворити цю державу, але під новим керівництвом, нашим керівництвом."
 CHL_ship_torpedo_sub_4:0 "6x 533-мм ТА з P.Loading"
 CHL_silverworking_desc:0 "Срібло завжди було одним з особливих традиційних ремесел народу мапуче, і було б легко експортувати високоякісні дорогі срібні дрібнички, оскільки ми також володіємо великими покладами природного срібла, особливо після того, як ми відвоюємо Пуельмапу в аргентинців."
