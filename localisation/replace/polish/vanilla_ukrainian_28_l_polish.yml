 JAP_ikki_kitas_state_socialist_ideals:0 "Державно-соціалістичні ідеали Іккі Кіти"
 JAP_imperial_influence_decision_cat_desc:0 "Внутрішні фракції в нашій країні мають велику автономію і не сидітимуть склавши руки, поки [ROOT.GetLeader] їх ігнорує. Тому вони продовжуватимуть висувати масштабні вимоги до нашого уряду, доки їх суттєво не обмежать."
 JAP_imperial_influence_dm_tt:0 "Поточні рівні фракцій: \n[GetArmyFactionDesc] \n[GetNavalFactionDesc] \n[GetZaibatsuFactionDesc] \n[GetGovernmentFactionDesc]"
 JAP_imperial_influence_title_text_monarchist:0 "ІМПЕРСЬКИЙ ВПЛИВ"
 JAP_integrate_the_great_japan_youth_party_desc:0 "Молодіжна партія Великої Японії, націоналістична молодіжна організація, створена за зразком німецьких молодіжних рухів, ще не повністю під нашим контролем і діє як незалежна третя сторона під керівництвом полковника Кінгоро Хашімото. Ми повинні приборкати їх і підпорядкувати контролю Тайсей Йокусанкай."
