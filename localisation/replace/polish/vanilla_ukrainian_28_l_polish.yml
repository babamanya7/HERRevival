 ITA_the_carabinieri_desc:0 "Через роль, яку карабіньєри відіграли у падінні фашистського режиму, зараз вони зазнають нападів із боку фашистів, що змусило багатьох із них приєднатися до італійського руху опору. Ми мусимо приєднати ці підрозділи до Італійського визвольного корпусу."
 ITA_the_catholic_dominion_desc:0 "Із повторним сходженням папства як великої держави, з якою слід іти, настав час нам звернутися до всіх віруючих християн і діяти як рука, що веде народ, подібно до того, як пастух веде свою отару та захищає її від зла. Це Божий мандат!"
 ITA_the_garibaldi_legion_desc:0 "Ми організуємо добровольчі загони, щоби воювати пліч-о-пліч із нашими товаришами в Іспанській республіці в складі інтернаціональних бригад у громадянській війні в Іспанії."
 ITA_the_italian_legions_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_ARMY_SPEED_FACTOR_FOR_CONTROLLER$: §G+5.00%§!\n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5.0%§!\n$MODIFIER_MAX_COMMAND_POWER_MULT$: §G+15%§!\n\n"
 ITA_the_new_emperor_of_ethiopia_desc:0 "Народ Ефіопії жив під владою імператора століттями. Без сумніву, наше завдання стане значно простішим, якщо ми представимо їм нового імператора на заміну старого, коронувавши нашого короля як нового імператора."
