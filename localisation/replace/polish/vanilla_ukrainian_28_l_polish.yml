 SOV_has_selected_hq_tt:0 "Створив таємну штаб-квартиру"
 SOV_heavy_cruiser_2_desc:0 "The Kirov class (Project 26) cruisers were the Soviet Navy's first modern cruisers. The design was based on the Italian Raimondo Montecuccoli class light cruisers and was built as part of the 1933-1938 shipbuilding program. The ships displaced between 7,700 and 9,200 tons. They were armed with new 180mm guns in 3 triple turrets and a solid AA battery. Their strong engines provided good speed and an acceptable operational range, while the armor belt was thin compared to other heavy cruisers."
 SOV_heavy_cruiser_3_desc:0 "The Project 22 heavy cruisers were designed in the mid 1930's to counter similar vessels in neighboring countries. The design called for a larger-sized vessel displacing between 15,500 and 17,000 tons. They were equipped with four triple 240mm cannons to fight off enemy cruisers, a heavy AA armament for self-defense, and a larger scout plane force to find the enemy. Their main tasks would be to scout for enemy forces and convoy hunting. The cost of the ships and the allocation of resources to other needs resulted in the cancellation of the project."
 SOV_heavy_tank_equipment_1_short:0 "Т-35"
 SOV_ilyushin_design_bureau_dissolved_flag:0 "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_increase_state_reserves_desc:0 "Наша зростаюча промисловість потребує дедалі більше ресурсів. Ми не завжди можемо забезпечити зростання видобутку ресурсів, тому мусимо створювати резерви там, де це можливо."
 SOV_infantry_equipment_0:0 "Винтовка Мосина обр. 1891/30"
 SOV_infiltrate_stalinist_plans_in_spain_poum_desc:0 "Незабаром до Іспанії на допомогу буржуазному республіканському уряду буде відправлена нова партія радянських військових радників, і у нас є шанс впровадити серед них кількох антисталінських агентів.\nЦі агенти будуть зв'язуватися і вербувати солдатів, бригадирів і ополченців, які симпатизують РПМЄ на боці буржуазної республіки, щоби створити мережу інформаторів, яка дозволить нам дізнаватися про плани ворога ще до того, як вони будуть реалізовані."
 SOV_infiltrate_the_nkvd_coup_tt:0 "Збільшує ймовірність успішного замаху на Сталіна."
 SOV_influence_airforce_opposition_desc:0 "Використовуючи наші зв'язки у збройних силах, ми зможемо знайти військовослужбовців і командирів авіації, які симпатизують нашій справі. Якщо військово-повітряні сили будуть на нашому боці, це, безумовно, зробить війну набагато простішим завданням."
 SOV_influence_cd_tt:0 "\nЦе рішення буде знову доступне через §Y60 днів§!."
