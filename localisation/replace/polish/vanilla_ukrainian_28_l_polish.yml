 ITA_2ndItaloEthiopianWar:0 "Ліга Націй поки що не вжила проти нас заходів, лише символічно виступаючи проти нашого завоювання Ефіопії. Однак що довше затягнеться конфлікт і що більше регулярних військ ми залучимо, то більший ризик того, що вони дійсно почнуть втручатися в наші справи. Ми мусимо закінчити цю війну, перш ніж [ETH.GetLeader] зуміє переконати Лігу Націй вжити заходів."
