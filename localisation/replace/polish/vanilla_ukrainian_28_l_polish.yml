 siam.13.a:0 "Нехай буде так."
 siam.15.t:0 "Наступ [SIA.GetAdjective] зупинився"
 siam.20.a:0 "Чудовий день!"
 siam.22.desc:0 "Наші бюрократи погано пристосовані до сучасної економіки, їм бракує навчання, необхідного для стимулювання зростання. На щастя, є багато країн із сучасною, розвиненою бюрократією, куди ми можемо їх відправити, щоб отримати досвід, не переймаючи їхні методи правління."
 siam.43.desc:0 "[FROM.GetNameDefCap] надіслала запрошення нашим інженерам і фахівцям допомогти в розвитку їхньої нації. Кооператив пропонує нашим галузям плацдарм у регіоні та зміцнює економічні зв'язки між нашими урядами. Це скромна пропозиція, але вона може принести значні результати з часом."
 siam.45.desc:0 "Делегація з [FROM.GetName] прибула з пропозицією від [FROM.GetLeader]. Вони стверджують, що наші окремі альянси тепер переслідують ті самі загальні цілі, водночас розділяючи людей, матеріали та дипломатичний вплив між конкуруючими командуваннями.\n\nОб'єднавши наші сили, ми створимо потужніший блок, здатний координувати стратегію на ширшому фронті. Така угода зміцнила б спільну справу, хоча вона також вимагала б від нас прийняти вплив [FROM.GetAdjective] на майбутній напрямок альянсу."
 siam.7.t:0 "Сонгсурадет шукає підтримки ВМС"
 siam_adc.1.b:0 "Вони залишаться під окупацією."
 siam_dem.5.a:0 "Пріді Баноміонг має очолити країну. Опір це заслужив."
