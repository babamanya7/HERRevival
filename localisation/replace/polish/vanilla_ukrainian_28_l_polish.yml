 SOV_divert_purge_attention_tt:0 "Розпочнеться випадкова чистка проти армії.\nБудуть відкриті §Yрішення§! з метою підставити військових офіцерів.\nЦе пропустить фокус §Y$SOV_the_zinovyevite_terrorist_center$§! для Центру."
