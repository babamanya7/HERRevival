 MEX_decision_assassinate_cristero_traitor_desc:0 "Повстанці, які підняли зброю проти держави, не заслуговують на жалість і не отримають пощади. Хоча умови миру, укладеного з церковними лідерами, мали на меті припинити бойові дії, ми знаємо, що зрадники знову візьмуться за зброю, якщо їм випаде така нагода. Нам слід ударити першими."
 MEX_decision_integrate_cuba:0 "Інтегрувати державу [CUB.GetNameDef]"
 MEX_focus_ban_political_militias_desc:0 "Ліві та праві воєнізовані організації заявляють, що вони патріоти, які борються з національними зрадниками, але насправді вони є пішаками іноземних держав, які прагнуть дестабілізувати країну з підлими цілями. Уряд має знищити фашистські та комуністичні ополчення."
 MEX_focus_fortify_the_canal:0 "Зміцнити Канал"
 MEX_focus_hispanic_alliance_desc:0 "Наші правителі походять з півостровників, колоністів, які принесли цивілізацію в Новий Світ. Іспанія з її сильною традицією церковної влади та земельних еліт колись була джерелом легітимності. Нині Іспанія все менше схожа на лідера латинського світу. Ми повинні взяти цю манію на себе та створити міцніші зв'язки на всьому континенті, використовуючи наше іспанське походження як будівельний блок."
 MEX_focus_liberate_the_caribbean_desc:0 "Як і решта Латинської Америки, країни Карибського басейну були нещадно експлуатовані європейськими імперіалістами, перш ніж скинути з них кайдани. Хоча ці держави все ще слабкі, вони заслуговують на наш захист. Національна гордість Мексики вимагає, щоби ми убезпечили Карибський басейн, щоби запобігти його експлуатації імперіалістами!"
 MEX_focus_raiding_navy_desc:0 "Ми не можемо сподіватися наздогнати головні морські держави світу в боротьбі на поверхні з лінкорами та авіаносцями. Натомість ми повинні спробувати перекрити транспорти ворожих військ до їх прибуття, щоби захистити Мексику від вторгнення."
 MEX_focus_revanchist_revolution_desc:0 "Мексиканський народ довго страждав від агресії Янкі та комуністичного проникнення, але ми подолали ці перешкоди на шляху національної єдності та створили сильну державу з могутнім лідером. Тепер ми повинні виправити кривду, якої Мексика зазнала в минулому."
 MEX_focus_seize_the_panama_canal_desc:0 "Цей канал, один із найкритичніших перешкод у світі, був проритий дорогою ціною для латиноамериканських робітників, які стікали кров'ю та гинули під американськими батогами заради прибутку промисловців. Захопивши навколишню місцевість, ми можемо завдати блискавичного удару по невеликому гарнізону каналу, змусивши янкі вибирати між кривавою війною проти нас або переданням контролю над каналом."
 MEX_focus_the_red_shirts:0 "Червоносорочники"
