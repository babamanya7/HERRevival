 CHI_international_squadron_desc:0 "Наші друзі за океаном організували добровольчу групу пілотів і придбали кілька сучасних літаків для підтримки наших військових зусиль. Ми повинні вітати їхню ініціативу з розпростертими обіймами."
 CHI_invoke_the_nine_powers_desc:0 "Хоча нерівноправні договори були підписані на нашу шкоду, дев'ять держав погодилися на статус-кво, за якого жодна нація не повинна захоплювати більше території Китаю. З огляду на триваючу японську агресію, настав час задіяти цей пункт."
 CHI_join_the_chinese_soviet:0 "Приєднатися до Китайської ради"
 CHI_ju_zheng:0 "Ju Zheng"
 CHI_know_thy_enemy:0 "Пізнай ворога свого"
 CHI_liberate_the_peoples_of_asia_tt:0 "Ми отримаємо мету війни проти кожного, хто контролює колоніальні регіони або має маріонеток у §Y$asia$§!"
 CHI_local_alloy_commission_desc:0 "Наша земля є джерелом величезних природних мінеральних багатств, але попри це ми ще не скористалися ними сповна. Дослідження наших можливостей тут обов'язково принесе дивіденди в майбутньому."
 CHI_long_range_screens_desc:0 "Оскільки ми посилюємо наші зусилля, щоб вийти за межі внутрішніх конфліктів, здатність розгортати значні сили на великій відстані з низькими витратами стає життєво важливою."
 CHI_long_term_economic_planning:0 "Довгострокове економічне планування"
 CHI_make_a_stand_against_the_colonialists_tt:0 "Розблоковує рішення §Y«Антиколоніалізм»§! для звільнення колоній в §YАзії та Океанії§!, що утримуються колоніальними державами."
