 modern_depth_charges_desc:0 "Збільшена потужність метального заряду дозволяє кинути глибинну бомбу на велику відстань.\n\nУстановка цього модуля на §Yлегкі кораблі§! та §Yкрейсери§! дозволить атакувати ворожі §Yпідводні човни§!."
