 denmark_expansion_event.24.desc:0 "Схоже, [SWE.GetAdjective]ий уряд не позбавлений здорового глузду! Він погодився віддати в нашу владу державу [NOR.GetNameDef]. Ми раді, що вони теж вважають нас повновладними правителями цих земель."
 denmark_expansion_event.25.desc:0 "На жаль, [SWE.GetNameDef] відмовляється поступитися нашим вимогам, і [NOR.GetNameDef] залишається в їхніх руках. Це дуже прикро, адже в минулому ми передавали цю територію під їхній контроль. Ми сподівалися, що нам дадуть відповідь добром на добро."
 denmark_expansion_event.300.desc:0 "[DEN.GetAdjective]ий уряд сьогодні запропонував нам права на ресурси в нещодавно завойованому регіоні $STATE_666$. У тих землях дуже багато корисних копалин. Можливо, варто обміркувати пропозицію?"
 denmark_expansion_event.602.desc:0 "Незважаючи на всі наші зусилля, [FROM.GetAdjective]ий уряд вирішив залишити свої технології при собі. Це дуже прикро, адже разом ми могли б розвиватися набагато швидше, ніж поодинці."
 denmark_fascist_event.20.desc:0 "Щоб підвищити дух співпраці між двома нашими державами, [FROM.GetAdjective]ий уряд запропонував укласти дослідницьку угоду, щоб ми могли ділитися один з одним технічними відкриттями."
 denmark_occupation_event.10.desc:0 "По всій державі [DEN.GetNameDef] почалися протести проти окупації. Це мирний спосіб висловити незгоду, але він, безсумнівно, зашкодить нашим відносинам із державою [?DEN.DEN_overlord_nation.GetNameDef]."
 denmark_occupation_event.2.a:0 "Ми їх захистимо"
 denmark_overlord_events.14.desc:0 "Данський уряд підкорився нашим вимогам і обрав нового прем'єр-міністра."
 denmark_overlord_events.2.b:0 "Покарати їх за грубість"
 denmark_overlord_events.28.t:0 "[FROM.GetNameDefCap] відмовляється заборонити комунізм"
 denmark_overlord_events.42.b:0 "Зміни рідко бувають добровільними"
 denmark_overlord_events.43.desc:0 "[FROM.GetNameDefCap] знову показує, що не збирається дотримуватися домовленостей і хоче покінчити з данською незалежністю. [FROM.GetLeader] проігнорував нашу відмову передати уряд під початок повноважного представника і все одно його призначив."
 denmark_political_events.4.b:0 "Треба поводитися агресивно"
 denmark_political_events.4.desc:0 "Різні демократичні партії не зійшлися в думках щодо того, як їм планувати свої кампанії. Хтось не хоче загострювати і без того непросту обстановку і стримує свою риторику. Хтось вважає, що, навпаки, потрібно атакувати на повну силу, щоб здобути розгромну перемогу і позбавити суперників будь-якого шансу поволі набрати вплив. Хтось переконаний, що потрібно активно нападати на суперників уже потім, щоб не допустити їх до влади."
