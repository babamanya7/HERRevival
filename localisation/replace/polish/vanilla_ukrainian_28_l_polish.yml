 ARG_fascism_party:0 "НФС"
 ARG_federal_intervention_tt:0 "Упровадження федерального втручання в області не дозволить фракції військових поглинути її в разі державного перевороту та подальшої громадянської війни."
 ARG_heriberto_la_galine:0 "Еріберто Ла Галіне"
 ARG_improve_patagonia:0 "Покращити Патагонію"
 ARG_integrate_the_motherland:0 "Інтегрувати Америку"
 ARG_islas_del_atlantico_sur_desc:0 "Фолклендські та Південна Джорджія острови є суверенною територією [ENG.GetName] і належать їм протягом багатьох років. Незважаючи на наші власні претензії на острови, які розташовані так близько до [ARG.GetName], вони залишаються під [ENG.GetAdjective] правлінням. Завдяки нашому новому альянсу з [ENG.GetName], можливо, ми зможемо домовитися про передачу островів під наш контроль. Зрештою, ми зможемо краще захистити їх у цій війні."
 ARG_liberation_theology_idea:0 "Теологія визволення"
 ARG_loan_from_germany:0 "Узяти позику в держави [GER.GetFlag]§Y[GER.GetName]§!."
 ARG_nationalist_state_fascism:0 "Аргентинська конфедерація"
 ARG_political_events.1.a:0 "Ми нічого не можемо вдіяти."
 ARG_political_events.100.a:0 "Давайте стояти разом!"
 ARG_political_events.102.a:0 "Можливо, іншим разом..."
 ARG_political_events.23.a:0 "Яке полегшення..."
 ARG_political_events.27.t:0 "[ARG.GetNameDefCap] висуває ультиматум"
 ARG_political_events.32.b:0 "Ми ніколи не здамо острови!"
 ARG_political_events.34.desc:0 "[ENG.GetAdjective] вперто відмовилася здати нам Фолклендські та Південна Джорджія острови. Здається, незважаючи на свої втрати, вони прагнуть продовжувати кровопролиття. Це їхнє право. Ми відкинемо їх аж до [ENG.Capital.GetCapitalVictoryPointName], якщо це буде необхідно."
 ARG_political_events.50.desc:0 "На жаль, наша спроба спровокувати страйк робітників у [FROM.FROM.GetName] пішла не зовсім за планом. Нашим промовцям вдалося привернути увагу лише кількох людей, коли ті прямували на роботу. Хоча нам вдалося залучити кількох людей до нашої справи, ми все ще повинні наполегливо працювати, щоб переконати населення повстати проти гніту вищих класів."
 ARG_political_events.62.a:0 "Давайте почекаємо слушного часу..."
 ARG_political_events.76.t:0 "[FROM.GetNameDefCap] відхиляє наш запит про тіснішу співпрацю"
 ARG_political_events.81.a:0 "Гроші витрачені з користю."
 ARG_production_initiative_desc:0 "Наші виробничі інструменти застаріли і потребують оновлення. Ми повинні спрямувати кошти на розвиток наших виробничих технологій, щоб допомогти прискорити створення необхідних компонентів для наших військових."
 ARG_refused_embargo_idea_desc:0 "Держава [ARG.GetNameDef] відхилила наш запит накласти ембарго на країни Осі."
 ARG_resource_extration_focus:0 "Акцент на видобуток ресурсів"
 ARG_ship_torpedo_2:0 "4x 533-мм торпедний апарат"
 ARG_women_in_industry_idea_desc:0 "Оскільки жінка є постійним лідером для держави [ARG.GetNameDef], це створює прецедент того, що жінки повинні мати право працювати і в інших галузях. З таким значним поповненням нашої робочої сили ми можемо очікувати великого економічного прогресу для нашої країни."
 ARG_work_with_the_nationalists_desc:0 "Можливо, настав час, щоб ми застосували інший підхід до управління. Зрештою, зростаюча корупція, яка роками переслідує вибори, явно не має ознак уповільнення. Якщо ми співпрацюватимемо з націоналістичними організаціями в країні, то ми матимемо більше шансів відновити порядок у [ARG.GetNameDef]."
 ARMY_DIVISIONS_ACTIVE:0 "$N$ дивізій"
