 SWI_fortify_border_with_italy_desc:0 "Експансіоністські амбіції [ITA.GetAdjective] можуть будь-якої миті перекинутися на [ROOT.GetName]. Зрештою, значна частина нашого населення розмовляє італійською мовою, і все, що потрібно, це промова від [ITA.GetLeader] і [ROOT.GetName] буде в їхній полі зору. Ми повинні показати їм, що ми нелегка мішень."
