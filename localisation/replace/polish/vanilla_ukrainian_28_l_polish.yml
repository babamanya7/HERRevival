 HOA_rallying_the_adjective_people_desc:0 "Світ спустошують конфлікти. Все, що стоїть між нашими нинішніми свободами та прірвою підкорення, — це готовність [ROOT.GetAdjective]ого населення встати та боротися. Об'єднані ми вистоїмо, розділені ми впадемо."
 HOA_the_adjective_regional_development_fund_desc:0 "Регіони [ROOT.GetNameDef] стагнують і гостро потребують інвестицій. Створивши фонд регіонального розвитку, ми можемо забезпечити органи місцевого самоврядування інструментами, необхідними для модернізації свого регіону."
 HOA_the_steam_locomotive_desc:0 "У той час як автомобілі та вантажівки корисні для переміщення невеликих кількостей або на короткі відстані, потяги набагато ефективніші для переміщення величезної кількості товарів і людей. Інвестиції в нашу залізничну мережу були б великим поштовхом для економіки країни."
 HOA_warrior_tradition_desc:0 "[ROOT.GetNameDefCap] має довгу історію хоробрих воїнів, які захищали свої домівки від імовірних завойовників. Зараз, як ніколи, нам потрібно використовувати цю традицію для захисту батьківщини."
 HOL_EQUIPMENT_VERSION_7:0 "No. 7"
