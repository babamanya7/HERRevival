 RAJ_medium_tank_equipment_1_short:0 "Crusader LP"
 RAJ_orchestrate_train_robberies_tt:0 "Фокуси на залізниці тепер модифікуватимуть дух §YІндійська залізниця§! на:\nВипуск фабрик: §G+[?RAJ_railway_default_increase_tt]%§!\nШвидкість будівництва залізниці: §R[?RAJ_railway_default_decrease_tt]%§!\nШвидкість будівництва центрів постачання: §R[?RAJ_railway_default_decrease_tt]%§!\nШвидкість будівництва інфраструктури: §R[?RAJ_railway_default_decrease_tt]%§!\nза кожен завершений фокус залізниці\n\nКожен існуючий завершений фокус залізниці буде автоматично змінено відповідно до цього."
 RAJ_orde_wingate_tt:0 "У Вас з'явиться §Yгенерал§! із §Y4 рівнем навичок§! на ім'я §Y$RAJ_orde_wingate$§!.\n"
 RAJ_phantom_armies_desc:0 "Якщо ми завищимо кількість військовослужбовців, яких ми найняли, у балансовому звіті, ми зможемо обдурити податкову службу."
 RAJ_pratap_singh_rao_gaekwad:0 "Пратап Сінгх Рао Гаеквад"
 RAJ_raise_import_duties:0 "Підвищити імпортні мита"
 RAJ_reduce_agrarian_society_value_tooltip:0 "\n§H$RAJ_agrarian_society$§!\n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: [?RAJ_agrarian_society_increment|+=%]\n"
 RAJ_royal_indian_artillery:0 "[ROOT.GetAdjectiveCap]а королівська артилерія"
 RAJ_seek_domestic_allies_desc:0 "Передовий блок не може досягти свого бачення самотужки. Шукаючи союзників по всьому політичному спектру, ми можемо об'єднати революційних мислителів, мобілізувати ширшу підтримку та зібрати керівництво, необхідне для просування Індії до справжньої незалежності."
 RAJ_seek_intial_funding_unlock_tt:0 "Відмикає фокус §Y$RAJ_seek_intial_funding$§!\n\n"
 RAJ_siege_batteries_desc:0 "Коли укріплення стоять на нашому шляху, облогові батареї перетворять їх на щебінь. Ці важкі артилерійські підрозділи приносять неперевершену руйнівну силу, забезпечуючи, що жодна фортеця чи опорний пункт не зможе протистояти нашому наступу."
 RAJ_specialized_dietary_requirement:0 "Спеціалізовані дієтичні вимоги"
 RAJ_stir_unrest_in_the_north:0 "Розпалити заворушення на півночі"
 RAJ_stir_unrest_in_the_north_focus_tt:0 "Ми збережемо контроль над наступними штатами, коли відокремимося:"
 RAJ_support_weapons4:0 "Bren Mk III & ML 4.2 inch Mortar"
 RAJ_swadeshi_movement_desc:0 "Свадеші, або самодостатність від [ENG.GetAdjective], активізує рух за незалежність та збереже багатство Індії в Індії."
 RAJ_tata_steel:0 "Tata Steel"
 RAJ_tata_steel_desc:0 "«Tata Steel» скоро стане найбільшим виробником сталі в Імперії. Нарощуючи випуск, ми прискоримо модернізацію Індії."
 RAJ_the_burma_road:0 "Бірманська дорога"
 RAJ_the_dominion_of_india:0 "Домініон Індії"
 RAJ_the_riches_of_the_raj:0 "Багатства Раджу"
 RAJ_the_smiling_buddha_desc:0 "Вчені скоро розкриють секрети атомної енергії, і це дозволить нам створити дуже потужні вибухові речовини. Нам не можна відставати в гонці ядерних озброєнь."
 RAJ_trade_federation_of_india:0 "Ребрендинг"
