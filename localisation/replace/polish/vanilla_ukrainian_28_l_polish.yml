 spain.1.d:0 "Група вищих генералів Збройних сил зробили прооголошення, в якому засудили поточний уряд Іспанії! Вони влаштували правоцентристський переворот за підтримки консервативних монархістів і церкви. Значна частина військових сил стала на бік націоналістів, але поки вони не змогли захопити жодне велике місто, крім Севільї.\n\nЛіві добровольці тим часом збираються під знаменом республіканського уряду, готові підтримати його в боротьбі проти повстанців. Ці лоялісти може й погано треновані, та ніхто не може засумніватись у їхніх ентузіазмі й відданості.\n\nЛінії фронту розкреслені. Яку фракцію нам варто підтримати?"
 spain.8.d:0 "Війна завершилася перемогою. Мадрид знову наш і в нас є можливість знову зробити кількасотрічне місто центром Іспанії. Воно пережило багато битв і вимагає перебудови. Який є кращий варіант окрім як зробити його нашою столицею?"
 spain.9.d:0 "Друга республіка виявилася хиткою й нестабільною. [Root.GetLeader] може бути президентом за підтримки Народного фронту — широкої коаліції лівих рухів, яких підтримують республіканці, комуністи й анархісти.\n\nАле права опозиція, що включає консерваторів, монархістів і фашистів, також починає об'єднуватися навколо мети знищити Народний фронт. Яка б коаліція не розпалася, їхні опоненти ймовірно скористаються внутрішніми конфліктами, щоб улаштувати революцію. Ці вибори — не останнє випробування, яке Іспанії доведеться пережити для вирішення цього конфлікту."
