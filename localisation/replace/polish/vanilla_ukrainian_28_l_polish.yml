 ENG_expand_the_repair_yards_desc:0 "Хоча наш морський флот є одним з найбільших у світі, ми також мусимо мати засоби для швидкого ремонту наших кораблів, якщо вони отримають пошкодження в бою, або наші вороги можуть виснажити нас через виснаження. Розширення наших ремонтних заводів не лише дозволить досягти цієї мети, але й дасть нам змогу вчасно переобладнати деякі з наших старих моделей."
