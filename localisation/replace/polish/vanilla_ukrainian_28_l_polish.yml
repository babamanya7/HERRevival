 MAN_tsr_empire_of_manchukuo_desc:0 "Маньчжоу-го, або Велика Маньчжурська Імперія, як вона офіційно називається, аж ніяк не є світовою державою, але нам все ж вдалося вибороти своє місце в ландшафті Великої Східної Азії. Ми повинні прагнути зберегти цю позицію, не піддаючись на фальшиві претензії на велике багатство і славу, а натомість прагнучи знайти свою роль у цьому світі."
