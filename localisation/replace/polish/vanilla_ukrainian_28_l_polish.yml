 CHI_naval_separate_defense_plan:0 "Окремий план морської оборони"
 CHI_pick_a_fight_with_japan_desc:0 "Довгі роки японці невпинно висували нові та нові вимоги. Цей час минув: наступного разу ми не поступимося ні йотою."
 CHI_prepare_for_a_change_in_leadership_desc:0 "Ми маємо нинішній уряд вже десять років, а [JAP.GetNameDef]ий привид все ще переслідує [CHI.GetAdjective]у державу. Існує потреба, щоб хтось інший взяв у свої руки важелі влади."
 CHI_price_controls:0 "Контроль цін"
