 ITA_destroyer_4_desc:0 "Есмінці класу «Comandanti Medaglie d'Oro» були групою есмінців, запланованих для Regia Marina, але так і не спущених на воду до часу італійського перемир'я. Кораблі були значно більшими за попередні італійські есмінці, водотоннажністю майже 2100 тонн. Вони також були озброєні більшими 135-мм гарматами Ansaldo і мали вдосконалені двигуни."
