 ss_recruitment_event.11.a:0 "Добре, він пішов, перш ніж встиг заразити інших своєю слабкістю."
 ss_recruitment_event.14.desc:0 "Елементи Вермахту виконали операцію «Валькірія», план дій у надзвичайних ситуаціях для масових заворушень у Німеччині. Армійські підрозділи оточили ряд урядових міністерств і намагалися заарештувати високопоставлених чиновників партії. По всьому Берліну повідомлялося про дрібні сутички та перестрілки між деталями гвардії SS та загонами армії. Схоже, Вермахт зажадав, щоб усі підрозділи SS негайно відступили та здали зброю, від чого керівництво SS категорично відмовилося.\n\nНаразі обидві фракції борються за контроль над Берліном. Частини Вермахту заявили про свою лояльність лідеру [GER.GetLeader] і підняли зброю проти повстанців.\n\nПожежа цієї війни буде тільки поширюватися."
 ss_recruitment_event.20.t:0 "Гіммлер протестує"
 ss_recruitment_event.21.b:0 "Нагадайте Гіммлеру, кому він повинен бути вірним."
 ss_recruitment_event.22.b:0 "Змусити Гіммлера провести повне розслідування та повідомити про результати особисто."
 ss_recruitment_event.3.desc:0 "У цій титанічній боротьбі за національне виживання ми мусимо використовувати всі активи та всі переваги. SS вважає, що в Нідерландах є багато тих, хто охоче візьме зброю в руки і воює на нашому боці проти загрози глобального більшовизму.\n\nХоча Вермахт в принципі погоджується, що деякий набір відповідних добровольців може бути корисним, генерали в OKW дуже впевнено вірять, що будь-які іноземні добровольці повинні бути під командуванням військових, а не SS."
