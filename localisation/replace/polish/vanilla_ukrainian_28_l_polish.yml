 EST_disrupt_vaps_recruitment:0 "Зірвати вербування вапсів"
 EST_events.1.t:0 "[From.GetNameDefCap] хоче укласти договір про дружбу"
 EST_form_scandinavia_desc:0 "Багато хто на півночі вважає претензії Естонії на приналежність до Скандинавії сміховинними, але тепер, коли весь субконтинент знаходиться під нашим контролем, хто сміється останнім? Швеція, Норвегія і Данія вже перебувають під чоботом Естонії, і ніхто не завадить нам!"
 EST_mobilize_the_vets_desc:0 "Багато естонських ветеранів не давали піти на дійсну військову службу за їх зв'язок з рухом вапсів. Тепер, коли ми при владі, ми можемо надати цим людям право служити своїй країні."
 ETH_African_Union_neutrality_DEF:0 "Африканський Союз"
 ETH_CZE_skoda_works_2:0 "$CZE_skoda_works_2$"
 ETH_Education_reform_decentralized_BoP_tt:0 "Освіта знаходиться на передовій нашої боротьби проти застарілих владних структур. Ми повинні виховувати молодь таким чином, щоб вона ставила під сумнів авторитети і відкидала застарілі погляди традиціоналістів."
 ETH_anti_colonialism_map_category_name:0 "Колоніальні області, де можна підтримати спротив"
 ETH_arms_production_desc:0 "Кульмінацією індустріалізації стане створення власної збройової промисловості. Ми ніколи більше не покладатимемося на інші країни щодо нашого оборонного обладнання."
