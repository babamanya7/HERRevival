 SOV_popular_speeches_poum_desc:0 "За допомогою місцевих організацій і впливових представників антисталінської опозиції за кордоном ми проводимо велику інформаційно-агітаційну кампанію на підконтрольних нам територіях, щоби розпалити полум'я революції в масах."
