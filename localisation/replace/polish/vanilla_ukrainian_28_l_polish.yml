 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI_DESC:0 "It is only in unity that the Communist utopia can be realized, for this is the path of the worldwide workers' revolution."
 RULE_OPTION_BERMONDT:0 "Монархізм: династія Авалішвілі"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC:0 "Конголезький ШІ спробує якнайшвидше здобути незалежність мирним шляхом, а згодом буде боротися за демократію в усій Африці."
 RULE_OPTION_GERMANY_FRAGMENTED:0 "Німеччина роздроблена"
 RULE_OPTION_GER_COMMUNIST_STALINIST_AI_DESC:0 "Німецький ШІ спробує повалити нацистів і принести комуністичну революцію до Німеччини. Тоді ті спробують установити диктатуру пролетаріату."
 RULE_OPTION_HISTORICAL_SOV_AI_DESC:0 "§HРадянський§! ШІ намагатиметься якомога точніше слідувати історичній низці подій."
 RULE_OPTION_IMPERIAL_PER_DESC:0 "ШІ встановить абсолютну монархію під керівництвом Рези-шаха Пехлеві та розпочне кампанію завоювання Близького Сходу."
 RULE_OPTION_INDEPENDENCE_NEU:0 "Нова конституція"
 RULE_OPTION_LEFT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "§HРадянський§! ШІ спробує відновити владу лівої опозиції та включити інші опозиційні групи в партію, а також поновити вічну революцію, рухаючися відповідною гілкою дерева національних фокусів. Метою ШІ є формування Верховної Ради."
 RULE_OPTION_MONARCHIST_ALCANTARA:0 "Монархізм: дом Педру джі Алкантара"
 RULE_OPTION_NORDICS_FRAGMENTED_DESC:0 "Нордичні країни будуть роздроблені та поділені."
 RULE_OPTION_OTTOMAN:0 "Відновлення Османського султанату"
 RULE_OPTION_SECULAR_REPUBLIC_DESC:0 "У §HМексиці§! продовжиться поступове відокремлення церкви від держави та посилення юридичних норм у міру зближення країни з Америкою."
 RULE_OPTION_STALINIST_GRE_AI_DESC:0 "§HГреція§! намагатиметься приєднатися до Комінтерну і воює з Туреччиною за Босфор."
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC:0 "Експансіоністська демократія"
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE:0 "Демократичний консерватизм"
 SAB_fascism_DEF:0 "Велика держава північного Борнео"
 SAF_abandon_westminster:0 "Розрив зв'язків із Вестмінстером"
 SAF_demand_madagascar_desc:0 "Ситуація у Європі драматично змінилася, і настав час переглянути всю систему колоніалізму. Чому Мадагаскар досі прив'язаний до імперії, що руйнується?"
 SAF_desert_equipment_desc:0 "Війна в Північній Африці вимагає застосування особливих видів техніки і оскільки нашу армію можуть відправити на цей фронт, забезпечення і доставка цієї техніки стане важливим логістичним питанням."
 SAF_generic_communist_revolutionary:0 "Маркус Б. Лоренс"
 SAF_heavy_cruiser_3_desc:0 "$ENG_heavy_cruiser_3_desc$"
 SAF_heavy_tank_equipment_2:0 "Churchill Local Pattern"
 SAF_infrastructure_effort:0 "Розвиток інфраструктури"
 SAF_invite_soviet_advisers_desc:0 "Якщо ми хочемо підтримати СРСР у боротьбі за свободу всіх пролетарів світу, то маємо перейняти його досвід і поліпшити свою армію."
 SAF_liberate_british_desc:0 "Британська імперія — один із найгірших проявів колоніалізму в історії. Ми з ним покінчимо."
 SAF_light_cruiser_3:0 "Клас «Crown Colony»"
 SAF_light_tank_aa_equipment_1:0 "Vickers II (зенітний)"
 SAF_outlaw_strikes_desc:0 "Стихійні страйки та трудові заворушення у розпал кризи — прояви антипатріотизму. Тому страйки тепер оголошені поза законом, і влада змусить людей повернутися на робочі місця."
 SAF_repeal_the_native_representation_act_desc:0 "Расова дискримінація суперечить ідеалам народної революції в Південній Африці. Ми мусимо повернути чорношкірим громадянам право голосу та інші політичні права."
