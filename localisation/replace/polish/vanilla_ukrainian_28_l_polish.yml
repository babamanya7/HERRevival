 ITA_a_leader_steps_forward_desc:0 "Настав час вирішити, хто стане на чолі нової Італійської республіки. На щастя, ми можемо обирати з висококваліфікованих кандидатів."
 ITA_a_new_era_for_the_red_shirts_desc:0 "Ми підемо слідами Джузеппе Гарібальді та його червоносорочників, зміцнюючи ці ополчення та навчаючи їх оптимальному виконанню своїх обов'язків як у складі італійської армії, так і в якості добровольчих бригад за кордоном."
 ITA_abolish_the_colonies_event_chain_tt:0 "Розпочне ланку подій §Y$ITA_abolish_the_colonies$§!, по ходу яких підконтрольні нам території на інших континентах проведуть референдуми, на яких вирішать, чи будуть вони інтегровані в нашу країну або стануть незалежними державами."
