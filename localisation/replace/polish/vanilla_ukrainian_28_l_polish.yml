 FRA_heavy_tank_equipment_2_short:0 "ARL 44"
 FRA_host_the_german_exiles_desc:0 "Німеччина, батьківщина Маркса й Енгельса, колись була в авангарді комуністичної думки та практики. Багато німецьких комуністів втекли, коли нацисти прийшли до влади. Якщо ми дамо їм дім, вони допоможуть нам організувати більш ефективне управління звільненими територіями."
 FRA_infantry_focus_desc:0 "Усі чоловіки та жінки, здатні битися, мусять взятися за зброю. Масове виробництво озброєнь знизить їхню собівартість. Ми дамо гвинтівку в руки кожному."
 FRA_intervention_in_greece_desc:0 "Греція контролює одні з найцінніших територій Середземного моря. Ми не можемо дозволити ворожому уряду контролювати його, тому ми мусимо діяти першими."
 FRA_invite_anti_fascist_emigrants:0 "Запросити антифашистських іммігрантів"
 FRA_jeanmarie_charles_abrial:0 "Жан-Марі Шарль Абріаль"
