 SOV_recruit_cd_tt:0 "\nЦе рішення буде знову доступне через §Y30 днів§!."
 SOV_religious_primacy_desc:0 "Важливість релігії в нашому суспільстві не можна применшувати. Настав час державі визнати і підтримати цю першість — і зробити перші кроки до об'єднання Церкви і держави."
 SOV_reopen_novodevichi:0 "Наново відкрити Новодівичий монастир"
 SOV_return_democracy_to_the_party_desc:0 "Під час революції був момент, коли ми не могли дозволити собі загрузнути в нескінченних дискусіях про те, як краще рухатися далі. Але часи змінилися, і настав час виконати обіцянку демократії в усіх сферах життя, дану робітникам. Це також означає, що тепер ми можемо дозволити людям повернутися в партію, чия критика з добрими намірами колись розглядалася як саботаж."
 SOV_reverse_the_collectivization_process_desc:0 "Колективізація стала справжньою катастрофою, що призвела до злиднів і голоду на територіях, які колись були житницею нації. Вони повинні бути негайно скасовані."
