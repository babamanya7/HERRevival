 SIA_deficit_spending_desc:0 "Ортодоксальна бухгалтерія не побудує сучасну економіку вчасно, щоб зустріти небезпечний світ. Держава повинна бути готова витрачати більше своїх поточних доходів, використовуючи громадські роботи та закупівлі для стимулювання промислового зростання."
