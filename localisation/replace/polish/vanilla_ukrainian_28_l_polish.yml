 timed_stage_coup_initiator_desc:0 "Держава $COUNTRY|Y$ готує переворот проти іноземного уряду"
 tooltip_escort_ships:0 "Кораблі супроводу"
 tooltip_raid_auto_launch_disabled:0 "Автоматичний запуск наразі §Rвимкнений§!."
