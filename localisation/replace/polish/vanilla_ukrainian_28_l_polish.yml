 sp_land_generic_reward_option_major_breakthrough_desc:0 "[Character.GetName] здійснює великий прорив, що значно просуває проєкт уперед, підтверджує [Character.GetHerHis] авторитет і надихає дослідницьку групу. Завдяки цьому прогресу проєкт наближається до мети, увічнюючи ім'я [Character.GetName] як новатора."
 sp_land_generic_reward_option_test_failure_desc:0 "Під час випробувань сталася незначна невдача, яка виявила неочікувані вади в прототипі [Character.GetName]. Ця прикрість змушує переглянути підхід і вдосконалити методи. Попри тимчасову затримку, здобутий досвід у довгостроковій перспективі зробить проєкт надійнішим і стійкішим."
