 SOV_southern_thrust_desc:0 "Анексія Ірану та Іраку забезпечила б їхні величезні нафтові запаси для революції і створила б прямий тиск на британських імперіалістів у Єгипті й Індії."
 SOV_soviet_advisors_spr:0 "Радянські військові радники"
 SOV_soviet_german_trade_agreement_desc:0 "Відповідно до нашої торгової угоди з державою [SOU.GetNameDef], вони надсилають нам таку сировину, як зерно, бавовна, нафта, металеві руди та каучук."
 SOV_sp_land_self_propelled_super_heavy_howitzer:0 "2А3 «Конденсатор-2П»"
 SOV_superior_war_machines_desc:0 "За останнє десятиліття танки і бронемашини значно розвинулися. Маючи потужну оборонну промисловість, яка виробляє і постачає їх, ми можемо створювати чудові машини і масово застосовувати їх проти ворога."
 SOV_the_centre:0 "Центр"
 SOV_the_enemies_of_the_people:0 "Вороги народу"
 SOV_the_fight_for_the_pacific_desc:0 "Незалежно від нашої сили на суші, нам доведеться перетнути воду, щоб здолати наших ворогів у Тихоокеанському регіоні. Тому ми мусимо розвивати нашу прибережну інфраструктуру і суднобудівну промисловість, перш ніж зможемо вести ефективну війну в цьому регіоні світу."
 SOV_the_fourth_international_idea:0 "Четвертий інтернаціонал"
 SOV_the_glory_of_the_red_army_name_communism:0 "Червон"
 SOV_the_new_soviet_woman_desc:0 "Політична революція принесла свободу мільйонам людей в нашому Союзі, зокрема мільйонам жінок, які більше не обмежуються лише роллю дружин і матерів, а можуть бути повністю рівноправними на робочому місці."
 SOV_the_red_army_dynamic_modifier_alt:0 "Російська армія"
 SOV_they_will_know_fear_desc:0 "Наші вороги навчилися боятися Червоної армії і радянського народу. Ми витримали початковий натиск і настав час дати відсіч. Нам потрібно розробити нові страхітливі бойові машини, здатні прорвати навіть найбільш укріплені лінії оборони ворога. Такі бойові машини мусять вселяти жах в саме серце ворога однією своєю назвою..."
