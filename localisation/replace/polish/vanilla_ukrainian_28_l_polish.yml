 MUN_czech.1038.d:0 "Представники [FROM.GetAdjective]ого уряду та їхніх збройових компаній звернулися до нас із пропозицією щодо продажу зброї. Ціна здається цілком прийнятною, до того ж [FROM.GetNameDef] пропонує деякі дуже сучасні зразки."
