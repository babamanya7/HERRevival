 AUS_osterreichische_bundesheer:0 "Österreichische[GetArmyName]"
 AUS_osterreichische_luftstreitkrafte:0 "Österreichische Luftstreitkräfte"
 AUS_political_events.115.b:0 "Якось підозріло..."
 AUS_political_events.28.a:0 "Чудово!"
 AUS_political_events.37.desc:0 "[GetIntegrationEventTarget]"
 AUS_political_events.68.t:0 "[FROM.GetNameDefCap] Відмовляється вступати до федеративного союзу"
 AUS_political_events.72.a:0 "З такими союзниками і вороги не потрібні. Нас чекає жах, яким ми викуємо собі славу!"
 AUS_political_events.80.a:0 "Вони справді кидають нас?!"
 AUS_political_events.87.b:0 "Ми самі приймаємо рішення."
 AUS_political_events.93.desc:0 "Ми отримали повідомлення від американського лідера: [463.GetName] буде продана нам за запропоновану нами суму. Регіон буде негайно передан нам, щоб ми могли почати інтеграційні зусилля."
 AUS_politicized_general_staff_desc:0 "Хоча ми раніше бачили, як воєнізовані групи з політичними планами можуть стати справжньою проблемою для нас, цього не можна сказати про нашу регулярну армію. Армія, яка добре розбирається в нашій політиці та розділяє наші бачення, матиме набагато більше мотивації боротися за нашу безпеку!"
 AUS_repeal_the_may_constitution_desc:0 "Так звана травнева конституція, встановлена Енгельбертом Дольфусом у 1934 році, заважала австрійській політиці протягом останніх кількох років. Політичні партії було заборонено, що позбавляло нашу націю будь-яких можливостей змін на краще. Ми повинні скасувати цю несправедливу конституцію, якщо наша країна хоче знову процвітати."
 AUS_ruthless_university_rector:0 "Безжальний ректор університету"
 AUS_stabilize_the_political_climate_desc:0 "Наша нинішня опозиція є радикальною та екстремальною. Краще переконатися, що їх ідеї відповідають діючим законам, і вони не ризикуватимуть бути забороненими. Ця поблажлива позиція також має забезпечити нам підтримку з боку їхніх менш радикальних послідовників."
 AUS_standardized_army_training_desc:0 "Роки неможливості підготовки нових військ залишили свій слід на навчальних полках наших дивізій. Якщо ми хочемо забезпечити найкращу підготовку нашої армії, нам слід розглянути питання про оновлення процедур підготовки нових військ."
 AUS_support_weapons:0 "Maschinengewehr Schwarzlose"
 AUS_universitat_wien:0 "Університет Відня"
 AUS_volunteer_effort:0 "Волонтерські зусилля"
 AUTO_BALANCE_SHIPS_IN_TASK_FORCES_TOO_FEW:0 "§RВи мусите вибрати більш ніж один доступний корабель§!"
 BAH_democratic_DEF:0 "Багамська співдружність"
 BALTIC_belarus_fascism_DEF:0 "$NONIDEOLOGYADJ$о-білоруська націоналістична асамблея"
 BALTIC_eastwall_desc:0 "Німці, як і ми, очікують атаки зі сходу, і німецькому уряду слід організувати зміцнення наших кордонів з тією ж старанністю, що і своїх власних."
 BALTIC_end_bourgeouis_dictatorships:0 "Покінчити з буржуазними диктатурами"
 BALTIC_entente_events.6.d:0 "З часів своєї першої появи у вигляді неміцного союзу країн Балтії Балтійська Антанта значно розвинулася. Тепер балтійські держави так тісно пов'язані політично, що майже стали єдиною нацією. Судячи з усього, [From.GetLeader] пропонує розвинути у такий цей союз, об'єднавши і військові, і цивільні уряди країн Балтії."
 BALTIC_events.19.desc:0 "Відмінний день для держави [ROOT.GetNameDef]! Після доблесної кампанії, проведеної нашими товаришами, [SOV.GetNameDefCap] справедливо заявляє, що новозвільнена територія [BALTIC_country_to_transde юрисдикцію.[GetExtraBalticTerritories]\n\nТак ми зробимо ще один крок на шляху до утворення об'єднаної Балтійської держави, достатньо потужної, щоби боротися з ворогами робітничого класу."
 BALTIC_events.2.b:0 "Я думаю, у нас є кращі варіанти."
 BALTIC_invest_in_baltic_trade_desc:0 "На Балтійському морі щодня йде торгівля зі Скандинавією, Німеччиною та Росією, наші порти важко витримують такий масштаб. Ми мусимо відкрити нові маршрути торгівлі зі своїми друзями, сусідами цим морем, заради славного майбутнього і процвітання держави [Root.GetNonIdeologyName]!"
 BALTIC_will_be_at_war_with_EST:0 "Якщо вони погодяться, §Y[Root.GetNameWithFlag]§! негайно опиниться §Rу війні§! з державою §Y[EST.GetNameWithFlag]§!."
 BAN_a_k_fazlul_huq:0 "А. К. Фазлул Хук"
 BAR_democratic_DEF:0 "Федеральна республіка Баротселенд"
 BAR_democratic_party:0 "БНР"
 BAR_democratic_party_long:0 "Баротселендська національна рада"
 BASE_VALUE:0 "Базова величина: $VALUE|1Y$"
 BAY_democratic_ADJ:0 "Баварськ"
 BBA_african_union_events.18.desc:0 "Один із підписантів угоди про взаємну оборону Організації Африканської Єдності зазнав нападу. Як учасники угоди, ми зобов’язані надати їм військову допомогу. У разі відмови нас, безсумнівно, виключать з угоди, і це може зашкодити нашим дипломатичним відносинам з іншими учасниками."
 BBA_african_union_events.22.desc:0 "Керівництво [FROM.GetNameDef] обурено відреагувало на наші спроби їх залякати. Схоже, що в найближчому майбутньому вони не налаштовані на співпрацю."
 BBA_african_union_events.3.t:0 "[FROM.GetNameDefCap] відхиляє членство в Організації Африканської Єдності"
 BBA_african_union_events.6.a:0 "Мудре рішення."
 BBA_african_union_events.9.a:0 "Навіщо вони тоді взагалі вступали до організації?"
 BBA_ethiopia_anti_colonialism_events.4.t:0 "[FROM.GetNameDefCap] відмовляється визнавати [?global.african_revolt_country.GetAdjective]у незалежність"
 BBA_ethiopia_balance_of_power_events.30.t:0 "$ETH_balcho_safo$ повертається"
 BBA_ethiopia_balance_of_power_events.53.a:0 "Отримати більше гвинтівок зараз важливіше, ніж контроль."
 BBA_ethiopia_communist_events.14.t:0 "[ETH.GetNameDefCap] просить допомоги у створенні ВПС"
 BBA_ethiopia_communist_events.16.t:0 "[SOV.GetNameDefCap] відмовляється надсилати військових радників"
 BBA_ethiopia_communist_events.17.b:0 "Не будемо ризикувати ескалацією."
 BBA_ethiopia_communist_events.20.a:0 "Ми самі з цим впораємося."
 BBA_ethiopia_communist_events.22.b:0 "Ми ще не готові до війни."
 BBA_ethiopia_communist_events.24.a:0 "Це необхідно. Поки що."
 BBA_ethiopia_exile_events.04.t:0 "Відкликано $RAJ_orde_wingate$"
 BBA_ethiopia_exile_events.05.a:0 "Дуже погано."
 BBA_ethiopia_exile_events.05.desc:0 "[ENG.GetAdjective]ий уряд повідомляє нам, що $RAJ_orde_wingate$ буде негайно переміщено до Бірми, де йому буде доручено організувати нові сили."
 BBA_ethiopia_exile_events.12.desc:0 "У державі [FROM.GetNameDef] кажуть, що ми можемо отримати частину сомалійських земель. Точніше, тих, які їм або нам вдасться захопити у ворога. Однак вони відмовляються віддавати те, що наразі вважають частиною своєї імперії."
 BBA_ethiopia_exile_events.13.desc:0 "Наш запит на майбутнє володіння всіма сомалійськими землями був відхилений [FROM.GetNameDef]. На жаль, вони навіть відмовилися пообіцяти контроль над територією, відвойованою у ворога."
 BBA_ethiopia_exile_events.14.t:0 "[FROM.GetLeader] просить контроль над [454.GetName]"
 BBA_ethiopia_exile_events.31.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 BBA_ethiopia_fascist_events.03.a:0 "$BBA_ethiopia_fascist_events.02.a$"
 BBA_ethiopia_fascist_events.21.desc:0 "Доволі несподівано [FROM.GetLeader] прийняв декларацію про [ROOT.GetAdjective]у незалежність. З цього моменту [FROM.GetNameDef] не має жодного впливу на [ROOT.GetAdjective]у політику, ані внутрішню, ані зовнішню. На головній площі міста [ROOT.Capital.GetCapitalVictoryPointName] зібрався величезний натовп, який святкує лідерство [ROOT.GetLeader]."
 BBA_ethiopia_fascist_events.65.t:0 "[FROM.GetName] просить контроль над [559.GetName] та [844.GetName]"
 BBA_ethiopia_imperial_events.9.t:0 "[FROM.GetNameDefCap] відмовляється підкорюватися"
 BBA_ethiopia_industrial_financial_events.2.t:0 "[FROM.GetNameDefCap] вимагає інтеграцію"
 BBA_italo_ethiopian_war_events.12.desc:0 "[FROM.GetLeader] повідомляє раді Ліги Націй, що [FROM.GetNameDef] не буде закривати Суецький канал для держави [ITA.GetName]. Це є явним порушенням міжнародних угод, і коли державу [FROM.GetName] закликали виконати їх, [FROM.GetName] просто повідомили, що вони виходять з Ліги Націй."
 BBA_italo_ethiopian_war_events.122.t:0 "[FROM.GetLeader] вперто відмовляється"
 BBA_italo_ethiopian_war_events.400.a:0 "Поставити ультиматум, вимагаючи повного підкорення."
 BBA_italo_ethiopian_war_events.400.desc:0 "[AFA.GetLeader], султан держави [AFA.GetNameDef], довгий час перебував під сильним [ROOT.GetAdjective]им впливом. Як і під час минулої війни, він зберігає нейтралітет, хоча формально входить до складу [ETH.GetAdjective]ої імперії. Насправді, єдина причина того, що султан все ще має владу — це [ROOT.GetAdjective]ий вплив і його добра воля. Країна може й продала своє узбережжя державі [ROOT.GetName], але вона все ще є перешкодою для нашого завоювання. Захоплення області [?ITA.ITA_capture_state.GetName] може бути достатнім, щоби переконати султана віддати решту своїх земель."
 BBA_italy_anti_colonialism_events.04.desc:0 "Кровожерливий [FROM.GetLeader], мабуть, відчув запах крові після нашої громадянської війни та вважає нас слабкими. [FROM.GetSheHeCap] відхилив нашу щедру мирну пропозицію і налаштований боротися далі. Ми покажемо [FROM.GetHerHim], що ми зовсім не слабкі!"
 BBA_italy_anti_colonialism_events.04.t:0 "[FROM.GetLeader] відхиляє нашу пропозицію"
 BBA_italy_civil_war.1.b:0 "Нам потрібні стабільність і традиції!"
 BBA_italy_civil_war_democratic_tt:0 "Ми станемо §Y$RDS_RU_Inst$§!, повсталою стороною у громадянській війні проти §Yдемократичної§! ідеології. [GetRdsOverlord]"
 BBA_italy_council_deposes_duce.1.desc:0 "Щоб врятувати Італію від руїни і зберегти фашистську систему, ми повинні зробити немислиме — усунути [?ITA.ITA_var_deposed_leader.GetName] від влади! Його некомпетентність і неадекватність вже давно обтяжують нашу країну та її прогрес. Наш обов'язок — захистити [FROM.GetAdjective]ий народ та його майбутнє!"
 BBA_italy_council_deposes_duce.2.a:0 "Ми мусимо вжити вжити рішучих заходів, щоби це не допустити!"
 BBA_italy_democratic_events.02.t:0 "Італійська програма наукового співробітництва"
 BBA_italy_interaction_events.10.a:0 "Тоді примусьте це зробити"
 BBA_italy_interaction_events.14.a:0 "Нам немає сенсу розміщувати там війська."
 BBA_italy_interaction_events.29.a:0 "Ми не можемо нічого зробити, щоб зупинити їх."
 BBA_italy_interaction_events.31.b:0 "О, Боже, ні."
 BBA_italy_interaction_events.43.t:0 "[FROM.GetName] відхиляє нашу пропозицію"
 BBA_italy_interaction_events.7.t:0 "Новий голова Національного комітету"
 BBA_italy_missiolinis.212.t:0 "Брак військової компетентності"
 BBA_italy_missiolinis.213.t:0 "Ефективне вище військове командування"
 BBA_italy_missiolinis.23.t:0 "Утихомирення Ефіопії"
 BBA_italy_missiolinis.93.t:0 "Великий розвиток служби розвідки"
 BBA_italy_naval_cooperation_programs.02.t:0 "[FROM.GetNameDefCap] приєднується до $ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.13.t:0 "[FROM.GetNameDefCap] відмовляється від наших есмінців"
 BBA_italy_naval_cooperation_programs.14.b:0 "Не цікаво."
 BBA_swiss_expansion.9.a:0 "Це може бути наш єдиний шанс вижити"
 BBA_switzerland_trade.1.d:0 "Ми не можемо довіряти [FROM.GetName]"
 BBA_switzerland_trade.13.desc:0 "[FROM.GetNameDefCap] просить нашої підтримки, щоби протистояти фашистським державам, що стоять у них на порозі. Ми можемо інвестувати в їхню економіку, щоби підготувати їх до гіршого або навіть допомогти їм безпосередньо боротися з фашизмом, якщо вони змусять або самі захочуть відмовитися від свого тривалого нейтралітету."
 BBA_switzerland_trade.7.t:0 "[FROM.GetNameDefCap] відхилив нашу торгову пропозицію"
 BEL_HOL_autonomy_eu_member_DEF:0 "Європейська Бельгія"
 BEL_albert_de_vleeschauwer:0 "Альбер де Влеесхауер"
 BEL_boost_miner_unions_decision:0 "Стимулювати шахтарські профспілки"
 BEL_contradictions_in_socialism:0 "Протиріччя в соціалізмі"
 BEL_defensive_neutrality_desc:0 "Тепер, коли ми чітко визначили нашу нейтральну позицію, настав час працювати над її забезпеченням. Ми зробимо себе занадто важкими для завоювання, що зробить вторгнення нездійсненним."
 BEL_department_of_telecommunications_desc:0 "Зв'язок має важливе значення для армії, тому ми повинні направити освіту на використання нових технологій, таких як радіо, разом із перевіреними старими методами, такими як поштові голуби."
 BEL_diplomatic_rapprochment:0 "Дипломатичне примирення"
 BEL_dyle_plan_tt:0 "У разі початку війни, §Y[ENG.GetNameWithFlag]§! та §Y[FRA.GetNameWithFlag]§! будуть більш схильні прийти на допомогу!"
 BEL_eben_emael_fortress_desc:0 "Найбільша та найбільш грандіозна фортифікація в нашій лінії, розташована на підвищеній точці з виглядом на канал Альберт. Ебен-Емаель буде забезпечувати оборонну позицію та артилерійську підтримку для будь-яких навколишніх сил і стане неприступною перепоною для будь-кого, хто наважиться порушити наші кордони."
 BEL_eddy_blondeel:0 "Едді Блондеель"
 BEL_flanders_democratic_ADJ:0 "Фламандськ"
 BEL_flanders_democratic_DEF:0 "Федеративна держава Фландрія"
 BEL_georges_lemaitre:0 "Жорж Леметр"
 BEL_increased_length_of_service:0 "Збільшена тривалість служби"
 BEL_invest_congo_gold_into_welfare_decision:0 "Інвестувати золото [COG.GetNameDef] в добробут населення"
 BEL_join_comintern_desc:0 "Комінтерн має історію підтримки тих, хто стоїть за соціалістичний шлях, і оскільки ми оточені тими, хто хоче придушити зароджувану свободу наших працівників, ми повинні звернутися на схід за новими друзями."
 BEL_king_leopold_iii:0 "Король Леопольд III"
 BEL_man_with_a_plan_leader:0 "Чоловік з планом"
 BEL_raoul_daufresne_de_la_chevalerie:0 "Рауль Дофрен де Ла Шевалері"
 BEL_remove_engine_of_the_economy_dynamic_modifier_tt:0 "Замінити §Y$BEL_engine_of_the_economy_dynamic_modifier$§! на §Y$BEL_belgian_miracle_dynamic_modifier$§!, ефективна зміна:"
 BEL_revitalize_nederlands:0 "Оживити нідерландську мову"
 BEL_revive_coal_mining_desc:0 "Камінь, на якому тримається валлонська промисловість, завжди був сталлю, а для покращення виробництва цього важливого матеріалу ми повинні активно розвивати вугільні шахти в цьому регіоні."
 BEL_royal_intervention_complete_degrelle_tt:0 "§RОбрання Дегреля в події «Королівське втручання» завершить цей фокус.§!"
 BEL_the_french_horse_and_the_red_rider_desc:0 "Бельгія занадто довго була під каблуками французів, звіра, якого керували комуністичні вершники. Ми повинні піднятися і стояти на своєму, боротися з цією підлою навалою. Тільки показавши свою впевненість і силу, ми змусимо цю істоту відступити і схилитися."
 BEL_transport_plane_equipment_2:0 "Savoia-Marchetti S.73"
 BEL_v_for_victory:0 "V for Victory"
 BHR_DEF:0 "Бахрейн"
 BHR_fascism_party_long:0 "Ісламська національна трибуна"
 BHU_communism:0 "Унія Червоних Драконів"
 BHU_fascism_DEF:0 "Імперія Громового Дракона"
 BLI_democratic:0 "Пулау Девата Балі"
 BLR_GER_autonomy_dominion_DEF:0 "Біла Русь"
 BLR_GER_autonomy_integrated_puppet_DEF:0 "Райхскомісаріат Біла Русь"
 BLR_SOV_communism_autonomy_colony:0 "Соціалістична республіка Білорусія"
 BLT_you_can_ban_communism_tt:0 "Якщо прийняти рішення §Y«Заборона комунізму»§!, §Yзарубіжні країни Балтії§! більше не зможуть заохочувати фашизм у нашій країні."
