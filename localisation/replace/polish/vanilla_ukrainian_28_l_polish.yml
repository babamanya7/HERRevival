 SUBDOCTRINE_FLYING_BATTERIES_DESC:0 "Загальноармійська ініціатива щодо підвищення мобільності допоміжних родів військ, щоб вони могли не відставати від швидких моторизованих наступів і швидко вступати в бій для підтримки."
