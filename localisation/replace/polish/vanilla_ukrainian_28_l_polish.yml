 PRC_central_committee:0 "Центральний комітет"
 PRC_emergency_prodction_protocols_desc:0 "Щоб збільшити військове виробництво, ми повинні встановити виробничі квоти для нашої промисловості. Такий захід ризикує відштовхнути наших прихильників, але наразі альтернатив немає."
