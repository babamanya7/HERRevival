 CONGO_belgian_officer_corps_desc:0 "На даний момент Force publique очолюється бельгійським офіцерським кадром, однак, оскільки сила значно розширилася, корпус офіцерів не виріс пропорційно. Ми повинні запросити додатковий [BEL.GetAdjective] персонал, щоб забезпечити належне керівництво новими призовниками."
