 GER_land_cruiser_equipment_1:0 "Landkreuzer P.1000 Ratte"
 GER_light_cruiser_3_desc:0 "Крейсери класу «M» були спроєктовані як розвідники для ескадри торгових рейдерів. Шість кораблів було замовлено в межах Плану «Z», причому два з них були закладені до того, як роботи були зупинені на початку війни. Основне озброєння складали вісім 150-мм гармат у чотирьох спарених баштах."
 GER_light_tank_aa_equipment_2_short:0 "FlakPz Luchs"
 GER_loyalty_to_the_fuhrer_desc:0 "З огляду на референдум 1934 року, коли посади президента і канцлера було об'єднано, ми усвідомлюємо величезну підтримку, яку Гітлер має серед нашого населення. Ми не бачимо жодних ознак того, що політичний ландшафт змінився, і тому ми продовжимо підтримувати фюрера."
