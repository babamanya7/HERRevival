 NORDIC_becomes_military_industry_leader_tooltip:0 "§Y$NORDIC_mil_industry_originator_dmod$§! буде замінено на §Y$NORDIC_mil_industry_member_dmod$§!, а §Gстане лідером [NORDIC_get_adjective]ої військової промисловості§!."
 NORDIC_civilian_capstone_unlock_TT:0 "Це відімкне додаткові гілки фокусів для §Y$NORDIC_nordic_industry$§!."
 NORDIC_communist_institution_1:0 "Північна федерація"
 NORDIC_economic_union_desc:0 "Ми повинні об'єднати наші ресурси разом, ми всі маємо щось, що потрібно нашим сусідам. Зламаючи бар'єри, які тримали наші економіки розділеними протягом тривалого часу, ми досягнемо вищого рівня ефективності. Ресурси повинні перетікати між нами, щоб ми могли краще допомагати один одному."
 NORDIC_expedited_training_desc:0 "Плейсголдер"
 NORDIC_fighter_command_desc:0 "Так само, як ми поділяємо наші ідеали та головну місію, ми поділяємо небо над собою. Ми повинні літати разом, щоб захищати повітряний простір один одного, і здобувати панування в повітрі над полем бою, щоб наші зв'язки не були розірвані наземною підтримкою ворога."
 NORDIC_ground_operations:0 "Наземні операції"
 NORDIC_joint_amphibious_effort:0 "Спільне планування десантів"
 NORDIC_materiel_design:0 "Розробка матеріального забезпечення"
 NORDIC_mutual_guarantees_desc:0 "Плейсголдер"
 NORDIC_navy_originator_dmod:0 "Лідер [NORDIC_get_adjective]их ВМС"
 NORDIC_nordic_army_desc_com:0 "Незалежно від країни, з якої вони походять, усі солдати [NORDIC_get_nordic_army_name] є частиною [NORDIC_get_alliance_name] і маршируватимуть, доки не буде знищено капіталізм, нашою спільною силою та невблаганною волею."
 NORDIC_nordic_industry_desc_dem:0 "З війною чи без неї наші країни повинні створити інфраструктуру та капітал, необхідні для підтримки нашого цивільного населення та покращення якості їхнього життя. Звичайно, коли настане війна, це стане життєво важливою основою нашої військової економіки."
 NORDIC_nordic_military_industry_democratic:0 "Скандинавські закупівлі матеріалів"
