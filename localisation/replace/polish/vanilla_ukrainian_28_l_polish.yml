 CHI_relocate_factories_from_the_coast_tt_no_aat:0 "Дозволяє переміщення §Yфабрик§!"
 CHI_river_crossing_studies_desc:0 "Китай — це край великих річок, і будь-яка армія, що діятиме в ньому, повинна навчитися воювати через них. Ми знаходимося в особливо вдалому місці, щоб навчитися цьому і застосувати ці знання на практиці. Знання, які стануть нам у пригоді, щоб вигнати загарбників і перенести боротьбу за кордон."
