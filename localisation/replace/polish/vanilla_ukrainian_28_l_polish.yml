 paramilitary_training:0 "Тренування воєнізованих організацій у державі [From.GetNameDef]"
 paramilitary_training_desc:0 "Агітатори лівого спрямування та інша зрадницька наволоч послаблює [From.GetAdjective]у націю. Ми мусимо допомогти союзним військам, які бажають співпрацювати з нашою армією."
 paratroopers_desc:0 "Використовуючи повітрянодесантні війська, ми можемо вторгатися в раніше недоступні райони і розміщувати там ключові сили, що відкриває нові тактичні можливості."
 party_popularity_stability_factor_tt:0 " $MODIFIER_STABILITY_POPULARITY_FACTOR$: $RIGHT|+=%1$"
 pax_romana_goal_desc:0 "Мрією нашого народу завжди було відновити славу Римської імперії. Настав час втілити цю мрію в реальність!"
 peoples_commissar_for_posts_and_telegraphs:0 "Комісар пошт та телеграфів"
 peru_bolivian_confederation_communism:0 "Перуано-болівійська федеративна народна республіка"
 pervert_radiotjanst_communism:0 "$pervert_radiotjanst_parent$ [SWE.GetCommunistParty]"
 plane_engine_upgrade_desc:0 "Вища швидкість дає літаку перевагу, коли справа доходить до позиціонування та вибору цілі. Важливо для перехоплювачів."
 poland.16.a:0 "Аякже!"
 poland.2.d:0 "Підтвердивши свої претензії на наші східні терени, [FROM.GetNameDef] тепер тисне на нас, щоби ми поступилися їм цими землями, припускаючи, що це єдиний спосіб уникнути нового вторгнення і можливої анексії або розподілу.\n\nЗазвичай, про те, щоб легко піддатися таким погрозам, не може бути й мови, але [FROM.GetNameDef] — далеко не єдина наша турбота. Якщо ми погодимося на їхні вимоги, нам, можливо, буде менше турбуватися про східний фронт; хоча це також перемістить східний фронт значно далі на захід."
 poland.2101.t:0 "[From.GetNameDefCap] пропонує підтримку"
 poland.22.a:0 "Принаймні, ми спробували."
 poland.5.d:0 "Після того, як держава [FROM.GetNameDef] заявила про своє право на Східну Польщу, ми припустили, що ще одна атака неминуча. Однак нещодавня пропозиція від [FROM.GetAdjective]ої влади свідчить про протилежне. Очевидно, за умови, що ми поступимось територією, на яку претендуємо, вони готові дозволити нам приєднатись до їхнього альянсу. Крім того, вони обіцяють, що в разі війни з Німеччиною нам компенсують втрати, надавши нові землі на заході.\n\nХоча це може бути ліпшою пропозицією, ніж ми очікували, ми не можемо знати, чи буде ця передбачувана майбутня війна коли-небудь продовжена. Можливо, [FROM.GetNameDef] шукає лише легкого захоплення земель і примусу нас до входження у сферу свого впливу. Тим не менш, це може бути найкращим захистом, на який ми можемо розраховувати."
 political.19.t:0 "Комуністи вимагають референдум"
 political.2.a.tt:0 "Якщо громадська підтримка буде достатня, можна буде здійснити переворот."
 political.23.a:0 "Порятуйте нас від цього правління натовпу!"
 political.26.t:0 "Демократичний рух затих"
 political.33.desc:0 "Намагаючися поліпшити громадську думку щодо військових зусиль, наші міністри пропаганди вибрали для показу по всій країні винятковий кінематографічний продукт «[ROOT.GetCountryAppropriateFilmProduction]» — піднесений перегляд із сильним патріотичним настроєм.\n\nМи сподіваємося, що це стане початком довгої й історичної традиції для нашої патріотичної кіноіндустрії; досі результати були чудовими."
 political.9.a:0 "Сильна держава необхідна, щоби захистити народ від самого себе."
