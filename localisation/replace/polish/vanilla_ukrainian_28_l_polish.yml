 SWI_infantry_equipment_0_short:0 "Schmidt-Rubin M1911"
 SWI_isolate_switzerland:0 "Ізолювати Швайцарію"
 SWI_multipurpose_tanks_desc:0 "Як і універсальні багатофункціональні ножі, які ми випускаємо для нашої піхоти, нам потрібні машини, які можуть заповнити будь-які прогалини та виконати будь-які завдання, необхідні для наших військових зусиль. У танковій війні ми маємо багато чого наздогнати, тому ми повинні мати широкий спектр розробок, щоб мати всеосяжну силу."
 SWI_ongoing_president_initiative:0 "Триває ініціатива президента Конфедерації"
 SWI_patriotic_shooting_clubs_desc:0 "[ROOT.GetName] має давні традиції клубів і змагань зі стрільби. Деякі з наших стрільців-любителів є більш досвідченими, ніж професійні снайпери інших країн. Ми можемо використовувати ці клуби та інтегрувати їх у наші збройні формування, щоби поліпшити наші оборонні можливості."
 SWI_promote_guisan_desc:0 "Наша політична система допускає єдиного генерала та головнокомандувача лише у часи крайньої потреби, коли наша Конфедерація знаходиться під загрозою. Це, безсумнівно, одна з таких ситуацій, і людина для цієї роботи очевидна: Анрі Гізан не лише найбільш кваліфікований для цієї роботи, але він також користується широкою популярністю в [ROOT.GetNameDef]."
 SWI_propagandize_swiss_military_tradition_desc:0 "Зараз не час згадувати наше демократичне минуле. Натомість ми повинні зосередитися на нашій бойовій традиції; [ROOT.GetAdjective] піхота та арбалетники славилися своєю дисципліною та ефективністю, їх наймали в усьому світі як бажаних найманців. Якщо ми хочемо пережити майбутню війну, нам потрібно нагадувати нашим людям про їхню військову історію."
 SWI_rearmed_idea_industrial:0 "Переозброєна Швайцарія"
 SWI_rejected_fascists:0 "Відкинули фашистських прихильників"
 SWI_spirit_of_helvetia_passive_peace:0 "Пасивний дух Гельвеції"
 SWI_weapons_production_for_civilian_supplies_desc:0 "Оскільки припаси меншають, у нас немає іншого виходу, окрім як дозволити деяким військової підприємствам виробляти деталі для [FROM.GetAdjective]ої військової машини. Таким чином ми можемо принаймні гарантувати деякі цивільні поставки і, можливо, утримати державу [FROM.GetNameDef] від вторгнення в державу [ROOT.GetName]."
