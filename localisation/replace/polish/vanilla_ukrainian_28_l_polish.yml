 JAP_adopt_syndicalist_ideas:0 "Прийняти синдикалістські ідеї"
 JAP_advance_one_hundred_million_fireballs_tt:0 "Цей дух зникне, якщо наша стабільність впаде нижче §Y40%§!"
 JAP_ally_with_the_zaibatsus_desc:0 "Найбільші корпорації в нашій країні мають безпрецедентну політичну та економічну силу. Вони — підтвердження того, які можливості дають свобода та індивідуальність; ми маємо співпрацювати з ними на благо нації."
 JAP_an_expedition_to_tibet_desc:0 "Щоб краще зрозуміти, чи зможемо ми переконати [TIB.GetAdjective]ий уряд стати на наш бік у великому конфлікті за Азію, ми повинні розпочати розвідувальну місію для встановлення контакту з ними. Однак через суворі правила в'їзду нам доведеться відправити Джінзо Номото, замаскованого під монгола, у супроводі тибетського ченця."
 JAP_army_expansion_law_desc:0 "Одним із найважливіших пріоритетів нашого уряду має бути негайне збільшення чисельності збройних сил."
