 GER_the_inner_circle_dm_desc:0 "Внутрішнє коло Фюрера — це політична еліта [GER.GetNameDef], віддані прибічники, які просувають бачення [GER.GetLeader]. Наповнене амбіціями, кожен прагне стати Райхсляйтером — Лідером Райху. Їхній вплив формує військові, промислові й політичні рішення, але водночас є джерелом інтриг і зрад."
 GER_the_mannheim_project_ww_desc:0 "Ми мусимо подвоїти наші зусилля в розкритті секретів атома й розглянути його можливе використання проти [SOV.GetAdjective]ої держави. Із новими союзниками, які можуть поділитися знаннями, це стане набагато простішим."
