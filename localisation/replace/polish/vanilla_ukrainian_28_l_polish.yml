 SPA_embrace_pan_hispanism_desc:0 "Останніми роками спостерігається сплеск пангіспанізму в наших старих колоніях, і тепер, після наших успішних кампаній із реконкісти, настав час прийняти їхні ідеї, щоб Іспанська імперія могла простояти ще тисячу років!"
 SPA_equipment_shipments:0 "Поставки озброєння"
