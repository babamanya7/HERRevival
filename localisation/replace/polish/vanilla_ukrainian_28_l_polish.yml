 SIA_sway_tiang_sirikhan_to_seri_thai_desc:0 "Залучити Тіанга Сірікхана на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_tankettes_desc:0 "Легкі, дешеві та прості у виробництві, танкетки, можливо, й не вирішуватимуть великих битв самі по собі, але вони все ще можуть служити для розвідки, колоніальних воєн та підтримки піхоти. Для нації зі скромними коштами такі малі броньовані машини пропонують практичний вхід у механізовану війну."
 SIA_thai_rice_company_desc:0 "Рис залишається джерелом життя [ROOT.GetName], проте занадто багато його торгівлі є фрагментованою, спекулятивною і вразливою до іноземного тиску. Національна рисова компанія дозволить державі керувати експортом, стабілізувати ціни і перетворити врожай наших полів на міцніший фундамент для національної могутності."
 SIA_thailand:0 "Тайланд"
 SIA_the_hammers_that_strike:0 "Молоти, що б'ють"
 SIA_the_thonburi_arsenal_desc:0 "Верф без озброєння залишається неповноцінною. Створення арсеналу в Тонбурі дозволить виробляти і зберігати корабельні гармати, боєприпаси та відповідне обладнання, що ще тісніше прив'яже наш флот до національної промисловості."
