 NZL_battle_cruiser_2:0 "Клас «Princess Royal»"
 NZL_battleship_1:0 "$ENG_battleship_1$"
 NZL_bob_semple_tank_desc:0 "Чому б Новій Зеландії не обзавестися власним танком? Міністерство громадських робіт у Темуці розробляє легкий танк, оснащений лише кулеметами. Навіть якщо нам не вдасться просунутися далі за прототип, ми отримаємо безцінний досвід."
 NZL_democratic_party:0 "Лейбористи"
 NZL_edward_puttick:0 "Едвард Паттік"
 NZL_establish_the_ncb_desc:0 "Створивши Національну вугільну раду, ми зможемо взяти розкидані по країні шахти під скоординоване управління та забезпечити стабільне постачання палива для залізниць, промисловості та генерації енергії. Централізований нагляд дозволить нам раціоналізувати виробництво, підвищити ефективність і гарантувати, що стратегічні потреби мають пріоритет над приватними інтересами."
 NZL_expand_devonport_naval_base:0 "Розширити морську базу в Девонпорті"
 NZL_form_the_rnzn_desc:0 "Наша колись маленька берегова охорона розрослася і включає кораблі, що діють незалежно від Королівських ВМС. У Нової Зеландії з'явиться власний флот."
 NZL_maori_affairs_act_desc:0 "Більшість земель, що належать племенам маорі, є неродючими. Якщо ми об'єднаємо їх і частково переведемо у власність держави, то перетворимо ці пустельні землі на процвітаючі промислові та торгові зони."
 NZL_maori_volunteers_desc:0 "Сотні маорі виконали свій патріотичний обов'язок та записалися добровольцями до армії Нової Зеландії."
 NZL_new_zealand_steel_taog:0 "$NZL_new_zealand_steel$"
 NZL_sidney_holland:0 "Сідні Голланд"
 NZL_statute_of_westminster_desc:0 "Вестмінстерський статут наділяє нас ширшими повноваженнями, але при цьому ми залишаємось частиною Британської імперії."
