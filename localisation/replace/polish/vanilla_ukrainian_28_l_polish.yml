 mothership_equipment_0_short:0 "Літак-матка"
 mountaineers_ski:0 "Лижні війська"
 mtg_britain.101.d:0 "[From.GetAdjective] уряд повідомив нас про те, що погоджується з нашою пропозицією щодо створення імперської федерації. Вони повністю підтримують нас і готові підготуватися до інтеграції, якщо цей рух набере сили."
 mtg_britain.108.a:0 "Більше вони не насміляться нас не послухатися."
 mtg_britain.2.a:0 "Гаразд. Визначмо дату."
 mtg_britain.31.d:0 "[From.GetAdjective] представники повідомляють нам, що вони приймають нашу пропозицію укласти договір про невтручання. Вони обіцяють закрити очі на наші дії в імперії та щодо Італії, якщо ми надамо їм свободу дій на континенті."
 mtg_britain.53.d:0 "[From.GetNameDefCap] дозволяє нам вступити до Комінтерну. Тепер ми разом, пліч-о-пліч, захищатимемо робітників по всьому світу."
 mtg_britain.63.d:0 "Розгорнувши свої війська в нашій країні, [From.GetAdjective] уряд ввів воєнний стан, тимчасово призупинивши повноваження місцевої влади."
 mtg_britain.67.d:0 "Держава [From.GetNameDefCap] повідомила нам, що не може дотримуватися тієї ж ідеологічної спрямованості, що й ми, і тому вирішує вийти зі складу імперії."
 mtg_britain.68.d:0 "[ENG.GetNameDefCap] нав'язує комуністичне правління в державі [FROM.GetNameDef]. Ми ж не можемо дозволити собі таку ідеологічну загрозу біля нашого кордону?"
 mtg_britain.88.b:0 "Будемо торгувати всім, чим їм завгодно."
 mtg_britain.999.a:0 "Король мертвий. Хай живе король!"
 mtg_britain.999.t:0 "Бомбардування Бакингемського палацу — король Едуард загинув"
 mtg_exile_government.3.b:0 "Ми не будемо служити під їх початком."
 mtg_exile_government.3.desc:0 "Керівництво [From.GetAdjective]их ВМС представило нам план інтеграції нашого флоту в їх флот. Воно стверджує, що, якщо дати плануючим органам [From.GetAdjective]ого флоту повний контроль над нашими кораблями, їх ефективно в порівнянні з незалежним статусом."
 mtg_netherlands.17.t:0 "[From.GetNameDefCap] відкидає пропозицію створити Об'єднані Нідерланди"
 mtg_netherlands.18.d:0 "До нашої інформації дійшло, що британці прийняли пропозицію нідерландців створити Об'єднані Нідерланди під спільним нідерландським прапором. З представниками нашого уряду не порадилися..."
 mtg_netherlands.24.t:0 "[From.GetNameDefCap] приймає ресурси Вест-Індії"
 mtg_netherlands.41.a:0 "Сильна держава [From.GetName] — корисний союзник."
 mtg_netherlands.50.d:0 "Схоже, принц Бернард останнім часом бере досить активну участь у розробці планів бойових операцій. Користуючись своїм становищем і вирізняючись зайвою самовпевненістю, він затикає рот незгодним з його пропозиціями. При реалізації низки планів виявилися закладені в них фундаментальні недоліки."
 mtg_news.17.c:0 "Британці дуже серйозно ставляться до своєї морської переваги."
 mtg_news.3.t:0 "Конгрес США приймає Закон про нейтралітет"
 mtg_news.4.d:0 "Цього разу велетню не доведеться спати."
