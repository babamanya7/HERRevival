 PRC_protracted_warfare_desc:0 "Ми маємо вести війну на своїх умовах. У Китаю багато людей та багато часу; вступати з ворогом у відкрите протистояння самогубно."
 PRC_put_an_end_to_the_sufan:0 "Покласти край Суфань"
 PRC_red_army_reborn:0 "Відродження Червоної армії"
 PRC_red_army_weakened_desc:0 "Виснажена Великим походом наша Червона армія ще не придатна до бою. Ми мусимо сформувати нові підрозділи і сформувати нову Визвольну армію."
 PRC_request_guarantees_desc:0 "Наш новий курс, натхненний Радянським Союзом, отримав би значну користь від їхнього захисту. Надання гарантій безпеки не обійдеться без ризику для них, але важливість цього кроку для стримування потенційних ворогів робить його виправданим."
 PRC_sea_peoples_liberation_army_desc:0 "$PRC_peoples_liberation_army_desc$"
 PRC_secure_lend_lease_from_soviet_desc:0 "Минулі спроби встановити сухопутний зв'язок із [SOV.GetNameDef] закінчилися катастрофічно. Але тепер, коли ми це подолали, отримувати від них припаси буде набагато легше."
 PRC_secure_the_lands_desc:0 "Ми ближче, ніж будь-коли, до виконання наших цілей — ми не повинні вагатися зараз. Нам потрібно витратити більше ресурсів, щоб переконати населення під контролем фальшивого уряду в справедливості нашої справи."
