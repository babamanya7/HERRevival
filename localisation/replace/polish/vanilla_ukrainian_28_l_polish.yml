 INTERNATIONAL_MARKET_EQUIPMENT_FILTER_INFANTRY:0 "§YПіхотне й артилерійське оснащення§!"
 INTERNATIONAL_MARKET_SUBSIDIES_ENTRY_DRAFT_SELECT_TO_ADD_TT:0 "§GОберіть§!, щоби додати субсидію до контракту."
 INTERNATIONAL_MARKET_SUBSIDIES_OVERVIEW_ENTRY_CLICK_TO_REMOVE_FILTER_TT:0 "§RКлацніть§!, щоби видалити фільтрування за цією субсидією."
 INTERNATIONAL_MARKET_SUBSIDIES_OVERVIEW_TOGGLE_SUBSIDIES_TT:0 "Ви маєте $AMOUNT|Y$ доступних §Yринкових субсидій§!."
 INTERNATIONAL_MARKET_SUBSIDY_DRAFT_EQUIPMENT_HEADER:0 "Тип оснащення"
 IN_COMBAT:0 "У бою"
 IRQ_a_new_caliph_desc:0 "Після років боротьби ми утвердилися як переважна сила в ісламському світі. Настав час продовжити спадщину Хусейна бін Алі та відновити халіфат під керівництвом Гашімітської династії."
 IRQ_a_new_islamic_golden_age_desc:0 "TODO"
 IRQ_air_research_bonus_desc:0 "Галузь авіоніки швидко розвивається, оскільки по всьому світу виникають конфлікти. Нам потрібен об'єкт, де наші інженери можуть розробляти передові технології для повітряних сил, якщо ми хочемо стати потужною силою в регіоні."
 IRQ_ali_ben_jawad:0 "Ali ben Jawad"
 IRQ_anti_western_alliance_per_tt:0 "§Y[PER.GetNameWithFlag]§! запрошується до нашої фракції"
 IRQ_artisans_society_trade_union_idea:0 "Джам’ія Ашаб ас-Сана"
 IRQ_british_overseas_airway_corporation:0 "Британська корпорація закордонних авіаліній"
 IRQ_cavalry_integration_desc:0 "Хоча моторизація може стати стандартом у майбутньому, наша армія потребує підтримки, яку ми можемо надати лише у вигляді кавалерії, принаймні наразі."
 IRQ_curtail_arabism_desc:0 "Ця зростаюча одержимість панарабізмом серед нашого народу відчужує неарабські громади, які складають нашу націю, і налаштовує нас на зіткнення з великими державами. Ми повинні обмежити цю ідеологію, перш ніж вона знищить нас."
 IRQ_expand_the_cotton_industries_desc:0 "Being an important part of our economy, we must focus more on our cotton sector as our demands continue to grow."
 IRQ_form_opec_desc:0 "Великі держави повністю залежать від потоку нафти у свої фабрики та транспортні засоби. Якби нафтовидобувні нації світу співпрацювали одна з одною щодо видобутку та безпеки нафти, ми могли б нарешті притягнути великі держави до відповідальності за все, що вони нам зробили."
 IRQ_has_permanently_rejected_fed:0 "Назавжди відхилив членство."
 IRQ_infantry_equipment_1:0 "Rifle No.4 MkI"
 IRQ_inviting_to_federation_in_progress:0 "Наразі триває запрошення інших націй до Федерації."
 IRQ_kurdish_politician:0 "Курдський політик"
 IRQ_kurdish_socialist_desc:0 "[SOU.GetNameDefCap] прагне знайти спосіб підірвати західне домінування на Близькому Сході. Можливо, вони будуть сприйнятливі до допомоги нам у нашій боротьбі проти [IRQ.GetAdjective] уряду, і, відповідно, [ENG.GetAdjective]."
 IRQ_kurdish_support_resistance_desc:0 "Поки люди в межах наших кордонів користуються справжньою свободою, надто багато наших родичів залишаються в пастці під правлінням іноземних держав. Ми повинні підтримати їх у їхніх спробах звільнитися."
 IRQ_kurdistan_events.3.desc:0 "Наші контакти в [FROM.GetNameDefCap] відповіли на наше прохання про допомогу та, на жаль, відмовилися нам допомогти, ми залишилися самі."
 IRQ_mahmud_salman:0 "Махмуд Салман"
 IRQ_mechanized_equipment_1_short:0 "Bren Carrier"
 IRQ_muhammad_amin_zaki:0 "Мухаммад Амін Закі"
 IRQ_political_events.12.a:0 "Ми захистимо нашу територію."
 IRQ_political_events.14.b:0 "Вони розгадали наш блеф."
 IRQ_political_events.14.t:0 "[FROM.GetNameDefCap] відмовляється передати територію"
 IRQ_political_events.18.a:0 "Час святкувати!"
 IRQ_political_events.26.c:0 "Ми ніколи не відмовимося від нашого суверенітету!"
 IRQ_political_events.51.t:0 "[FROM.GetNameDefCap] має намір передати нас"
 IRQ_political_events.72.b:0 "Фейсал II має замінити його безпосередньо!"
 IRQ_political_events.72.desc:0 "Надійшли повідомлення про те, що сьогодні наш великий король, Газі I, трагічно загинув у автокатастрофі, керуючи своїм спортивним автомобілем у Багдаді. Деякі стверджують, що це була просто аварія, тоді як інші припускають, що це могло бути за наказом Нурі аль-Саїда, через плани короля щодо об'єднання з Кувейтом, але ніхто не знає напевно. Одне зрозуміло: хтось повинен підхопити факел і зайняти його місце, тепер, коли його не стало."
 IRQ_political_events.73.b:0 "Вкрай важливо, щоб ми зберегли конституційний характер нашої монархії!"
