 HINT_LOGISTICS_TEXT:0 "Це екран §Yлогістики§!. Його функція — допомогти Вам побачити, наскільки швидше або повільніше Ви виробляєте оснащення, ніж використовуєте.\n\nЯкщо Ви виробляєте більше певного типу §Yоснащення§!, ніж Вам потрібно, хорошою ідеєю буде перепризначити кілька заводів із відповідної §Yвиробничої лінії§!.\n\nДостатня або недостатня §Yоснащеність§! грає важливу роль у досягненні успіхів на полі бою. Ви можете перевірити Ваш стан оснащення, ввімкнувши режим мапи §YОснащення§! £GFX_F4£ ."
