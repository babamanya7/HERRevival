 GOE_RAJ_news.2.desc:0 "Швидке зростання комуністичних настроїв у [RAJ.GetNonIdeologyName] сьогодні досягло критичної поворотної точки, коли Королівський індійський флот оголосив про заколот, внаслідок чого вже ослаблена колоніальна адміністрація втратила той невеликий вплив, який вона мала над [RAJ.GetNonIdeologyName]. В результаті [RAJ.GetLeader] оголосив про створення нової Індійської Народної Республіки.\n\nЩоб уникнути неминучого конфлікту, [RAJ.GetLeader] вже забезпечив угоду про автономію [PAK.GetAdjective], з формуванням [PAK.GetAdjective] незалежної держави на чолі з [PAK.GetLeader], а також перемир'я між двома націями, яке набуває чинності негайно."
