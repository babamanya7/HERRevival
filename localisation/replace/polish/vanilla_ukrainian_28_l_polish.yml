 germany.1002.desc:0 "Німеччина та [SOU.GetNameDef] вже уклали угоду про поділ Польщі на східну та західну частини, однак наша окупація сходу створила певні труднощі в реалізації цієї домовленості. Хоча наші німецькі союзники цілком очікують, що ми передамо обіцяні польські території [SOU.GetNameDef], ми можемо замість цього порушити пакт і продовжити нашу окупацію."
 germany.101.b:0 "Варто подумати про подальші перспективи."
 germany.120.a:0 "Це тривожно."
 germany.128.d:0 "[From.GetNameDefCap] пропонує нам вступити до альянсу для більшої організованості проти комуністичної загрози. Посли вже прибули в столицю для затвердження союзу."
 germany.15.t:0 "Німеччина дотрималась умов пакту"
 germany.50.d:0 "Нещодавно в Мюнхені були проведені переговори між лідерами Британії, Франції, Італії та Німеччини про обговорення майбутнього Чехословаччини. Як британці, так і французи визнали наші претензії на Судетську область законними, а також скасували підтримку для чехів.\n\nВизнаючи безнадійність ситуації, чехи віддали нам Судети. Тамтешні пригноблені німецькі жителі врешті-решт повернуться до Фатерланду!"
 germany.57.d:0 "Угорці грубо відмовили на нашу щедру пропозицію анексувати Словаччину, заявляючи, що їх цей регіон не цікавить! Скоро нам доведеться мати з ними справу. А поки нам треба знайти вирішення словацького питання."
 germany.6.b:0 "Відмовитися"
 germany.6.d:0 "Держави, що підписали пакт, вважають необхідною умовою будь-якого міцного миру надання кожній державі можливості зайняти своє місце у світі та вирішили об'єднатися та співпрацювати між собою у своїх зусиллях відповідно в Східній Азії та Європі, де їх основною метою є встановлення та підтримка нового порядку речей, розрахованих на сприяння взаємному процвітанню та добробуту зацікавлених народів."
 germany.66.d:0 "Британці вчинили розумно та затвердили ремілітаризацію Райнланду, але божевільні французи відмовилися поступатися! Стверджуючи, що цей інцидент представляє пряму загрозу безпеці їхньої держави, вони мобілізовують війська й можуть перейти кордон у будь-який момент! Ми у стані війни!"
 germany.75.t:0 "Німецько-радянський договір"
 germany.86.d:0 "[GER.GetNameDefCap] давно говорить про повернення територій, втрачених унаслідок Великої війни. Зокрема, [GER.GetNameDef] заглядається на територію Данцига, що відділяє Східну Пруссію від іншої частини їхньої держави.\n\nТепер [GER.GetNameDef] вимагає передачу Данцига, обіцяючи в обмін відкликання претензій на Познань. Над нами висить загроза війни, і прийняття цієї пропозиції відкладе можливий конфлікт, але ціною вільного надання сили німцям для здійснення своїх подальших планів."
 germany.87.d:0 "Розглянувши наш ультиматум, Польща погодилася віддати нам несправедливо отриману територію, довівши, що вони розуміли, що Данциг законно належить Німеччині!"
 germany.96.d:0 "Югославія, підбурювана дурними італійцями, вирішила кинути нам виклик. Невдячні італійці згорять із югославами. Генерал Роммель запевняє нас, що вони побігли в попередній раз, і, безсумнівно, побіжать знову."
 germany.999.a:0 "Вшануймо героїв останньої війни!"
