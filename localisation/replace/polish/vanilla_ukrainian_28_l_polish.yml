 ICE_anglo_icelandic_relations_desc:0 "[ENG.GetNameDefCap] швидше за все, є нашим найкращим вибором як майбутнього торговельного партнера. У будь-якому випадку, було б дуже шкідливо для нашої країни, а можливо, і просто небезпечно ворогувати з [ENG.GetAdjective]. Тому ми повинні зробити все можливе, щоб зберегти добрі відносини з нашим сусідом за морем."
 ICE_communism_ADJ:0 "Ісландськ"
 ICE_completion_break_with_the_crown_tt:0 "Коли завершено фокус: §Y$ICE_break_with_the_crown$§!"
 ICE_develop_icelandic_shipping_desc:0 "Ми — острів; острів посеред океану. Зосередитися на будівництві кораблів — настільки ж очевидний вибір курсу, як і будь-який інший."
 ICE_expand_the_fishing_industry_desc:0 "Рибальство завжди було ключовою частиною життя ісландців. Це наш головний природний ресурс, і ми маємо його в надлишку. Тому саме тут ми повинні зосередити наші зусилля. Ставати сильнішими в тій сфері, де є справжній потенціал."
 ICE_iceland_air:0 "Ісландська авіація"
 ICE_industrial_cooperation:0 "Промислова кооперація"
 ICE_mineral_prospecting_desc:0 "Теоретично, в горах можуть бути заховані природні ресурси. Спробувавши знайти їх, ми могли б створити альтернативу рибальству та сільському господарству як основним галузям економіки Ісландії."
