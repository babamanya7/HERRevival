 DOD_hungary.117.desc:0 "Радянці згодні з нашою пропозицією поставити комуністів на чолі держави. [SOV.GetLeader] особисто запевняє нашу делегацію в тому, що ніхто не пред'являтиме до нас нових територіальних претензій. Щонайменше жодна з країн Комінтерну."
 DOD_hungary.148.desc:0 "Після кількох днів напружених переговорів у Бледі делегації так і не дійшли єдиної думки і повернулися додому з порожніми руками. Навіть [From.From.GetLeader] не може вплинути на ситуацію своїм втручанням. \n\nУ дипломатичних колах панує глибоке розчарування. Багато старших дипломатів вважають, що ми все одно мусимо провести переозброєння — нехай дізнається, що буває, коли він не хоче домовлятися."
 DOD_hungary.151.d:0 "Звернутися до Великої Британії"
 DOD_hungary.151.desc_light_fighter_refused:0 "Посилаючись на інтереси національної безпеки, [From.GetAdjective] уряд відмовився видати нам ліцензію на виробництво. Ми можемо спробувати щастя де-небудь ще або зайнятися модернізацією наших існуючих літаків як екстрені заходи."
 DOD_hungary.153.desc:0 "У [From.GetAdjective] ВПС проходять випробування нових легких винищувачів. За даними нашого військово-повітряного аташе, наша новітня модель має здобути гору. Ми чекаємо на офіційний запит від [From.GetAdjective] уряду. \n\nКерівництво заводу-виробника повністю схвалює угоду, але продаж новітньої військової техніки іноземній державі може завдати шкоди нашій національній безпеці. Чи варто нам дозволити продаж цих літаків?"
 DOD_hungary.163.desc:0 "У [From.GetAdjective] ВПС проходять випробування нових легких бомбардувальників. За даними нашого військово-повітряного аташе, наша новітня модель має здобути гору. Ми чекаємо на офіційний запит від [From.GetAdjective] уряду. \n\nКерівництво заводу-виробника повністю схвалює угоду, але продаж новітньої військової техніки іноземній державі може завдати шкоди нашій національній безпеці. Чи варто нам дозволити продаж цих літаків?"
 DOD_hungary.20.b:0 "Треба відправити спостережну місію до Угорщини. Зробимо широкий жест."
 DOD_hungary.26.a:0 "Ми цьому дуже раді."
 DOD_hungary.3.desc:0 "Незважаючи на потужну агітаційну кампанію, організовану проугорськими групами та монархістами, попередні підсумки референдуму показують, що прихильники збереження статусу-кво взяли гору з невеликою перевагою."
 DOD_hungary.31.t:0 "Перегляд Тріанонського договору"
 DOD_hungary.46.a:0 "Ми впораємося самі."
 DOD_hungary.59.b:0 "Ми не горимо бажанням відстоювати їхні інтереси."
 DOD_hungary.6.desc:0 "Як заявляє глава Австрії [AUS.GetLeader], вся країна об'єдналася, щоб висловити протест Габсбургам, а сама ідея референдуму про незалежність Австрії є повним маренням."
 DOD_hungary.61.t:0 "Балканський криза: [From.GetNameDef] підтримує Угорщину"
 DOD_hungary.67.desc:0 "Переговори між великими державами виявилися зірвані, коли стало зрозуміло, що обидві країни не зможуть знайти точок дотику. Усі спроби дійти компромісу були перекреслені неприйнятними вимогами, які висунули обидві сторони. Делегати залишили переговори, так і не вирішивши проблему."
 DOD_hungary.71.b:0 "Віддати північну Трансільванію Угорщини."
 DOD_hungary.80.desc:0 "До нас звернувся угорський уряд із проханням передати їм південну Словаччину нібито через утиск етнічних угорців у цьому регіоні. Водночас ми затримали кількох учасників терористичної групи «Гвардія обірванців», які намагалися перетнути кордон з боку Угорщини. Вони стверджують, що не мають жодного відношення до уряду Угорщини, але у них було вилучено речі з офіційним угорським маркуванням.\n\nНазріває війна, але ми ще маємо шанс вирішити проблему дипломатичним способом, якщо ми заручимося підтримкою провідної держави."
 DOD_hungary.80.t:0 "Угорщина вимагає Південну Словаччину"
 DOD_hungary.84.a:0 "Ми повернемо свій, але час для цього ще не настав."
 DOD_hungary.97.t:0 "Югославія пручається"
 DOD_romania.10.t:0 "Cordon sanitaire"
 DOD_romania.16.t:0 "[FROM.GetNameDefCap] хоче приєднатися до альянсу [ROOT.GetFactionName]"
 DOD_romania.161.a:0 "Потрібно було розуміти, що [FROM.GetLeader] не заслуговує на довіру!"
 DOD_romania.2.a:0 "Відмінно."
 DOD_romania.41.t:0 "[From.GetNameDefCap] здається "
 DOD_romania.601.t:0 "[FROM.GetName] прагне розділити державу [YUG.GetNameDef]"
 DOD_romania.68.desc:0 "Наші спроби звернутися до Німеччини та Італії за підтримкою не увінчалися успіхом. Це дало Югославії достатньо часу підготуватися до неминучої війни, але в генштабі, як і раніше, впевнені, що ми зможемо швидко здобути перемогу."
 DOD_romania.82.b:0 "Негайно відпустити автора книги."
 DOD_romania.85.a:0 "Це був офіційний державний візит."
