 GER_MAN_desc:0 "Найбільш відома за їхній танк «Panther», компанія «MAN» також брала участь у розробці та виробництві ранніх моделей «Panzer»."
 GER_STATE_4:0 "Нідерьостеррайх"
 GER_a_strong_successor_desc:0 "Наближається «зміна варти», і новий фюрер мусить зійти на вершину влади. У нас є можливість установити нового лідера, який відображатиме наші прагнення до держави [ROOT.GetNameDef]. Ця зміна пожвавить наші зусилля, спрямовані на забезпечення світлого майбутнього для німецького народу."
 GER_add_bewegungskrieg_modifier_tt:0 "Додає §Y$GER_bewegungskrieg_modifier$§!, що надає:"
 GER_airforce_modifier_desc:0 "З неперевершеною майстерністю та технічною досконалістю Люфтваффе готова домінувати в небі та демонструвати нашу могутність будь-якому ворогу. Завдяки найновішим літакам і майстерно навченим пілотам наша авіація готова палити небо, знищувати армії та топити флот ворогів."
 GER_allied_trade_tt:0 "Відкриває рішення: §Y$GER_mitteleuropa_allied_trade_cat$§!"
 GER_around_maginot_desc:0 "Якщо ми хочемо досягти тактичної переваги над Францією, необхідно отримати можливості для атак із усіх боків. Вони не чекають нападу з півночі, звідки ми почнемо свій наступ, попередньо усунувши низку перешкод."
 GER_atlantikwall_desc:0 "Західна Європа в наших руках. Тепер потрібно зміцнити позиції у разі можливого вторгнення через Атлантику. Нам потрібна масштабна мережа укріплень на берегах Європи."
 GER_battle_cruiser_2:0 "Клас «O»"
 GER_bribe_senior_officers:0 "Підкупити старших офіцерів"
 GER_carve_up_congo_desc:0 "Конго багате на ресурси та готове до колонізації. Можливо, ми зможемо домовитись із британцями про розподіл цієї території як крок до відродження колоніальної імперії."
 GER_case_yellow_netherlands:0 "План «Жовтий» — Нідерланди"
