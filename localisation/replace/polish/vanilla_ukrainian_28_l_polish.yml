 FRA_battle_cruiser_2_desc:0 "Dunkerque були розроблені для протистояння німецьким кишеньковим лінкорам класу Deutschland. Вони були вершиною серії досліджень дизайну з середини 1920-х до початку 1930-х років. Схвалені у військово-морських програмах 1931 та 1934 років, вони були схожі на британські лінкори класу «Nelson», з усіма їхніми головними баштами, зосередженими вперед. Це призвело до коротшої поясної броні і, отже, до меншого корабля, який відповідав обмеженням військово-морських угод."
 FRA_colonial_industry_desc:0 "Потрібно розвивати промисловість у колоніях. Якщо напруженість у Європі зросте, наші фабрики залишаться поза досяжністю для бомбардувальників супротивника."
 FRA_compensate_italy:0 "Компенсація Італії"
 FRA_coordinate_rearmament_desc:0 "Щоби відповідати єдиному процесу розвитку німців та інших наших супротивників, ми також мусимо координувати наші зусилля з нашими союзниками."
 FRA_cv_nav_bomber_equipment_1:0 "Latécoère 298B"
