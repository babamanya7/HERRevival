 MAN_coring_mongolia_tuva:0 "Інтеграція [FROM.GetName]"
 MAN_expand_the_textile_industry_desc:0 "Текстильна промисловість є історично дуже важливою для нас. Залучити іноземний капітал для її розвитку буде найпростіше."
