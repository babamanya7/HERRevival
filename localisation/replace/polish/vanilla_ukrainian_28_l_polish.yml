 SID_neutrality_DEF:0 "Королівство Сідамо"
 SIK_a_new_nationality_policy_desc:0 "Ми повинні прийняти радянську національну політику, де одна група не домінує над усіма, а багато хто живе в гармонії. Для цього ханці повинні навчитися читати і писати уйгурською мовою, і навпаки. Ми також запровадимо атеїзм в офіційних державних органах, але дозволимо людям свободу практики та віри, щоб забезпечити більш стабільну та єдину провінцію."
