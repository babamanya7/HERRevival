 SPR_class_war_desc:0 "Концепція Народного фронту хибна; робітник ніколи не може бути по-справжньому вільним, поки він змушений працювати разом з буржуазією. Тільки тотальна безкомпромісна класова війна може принести нам бажану свободу, навіть якщо це означає боротьбу проти капіталістів і фашистів одночасно."
