 BUL_balkan_federation_of_socialist_republics_desc:0 "Проєкт Балканської федерації провалився в 1920-х роках через націоналістичні прагнення різних членів. Але часи змінилися, і ми мусимо показати наш новий проєкт федерації решті балканських країн, починаючи з [YUG.GetNameDef]."
