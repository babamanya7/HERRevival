 MUN_czech.news.1.desc:0 "Населення Судетської області розпочало збройне повстання проти [CZE.GetAdjective]ого уряду. Почали надходити повідомлення про те, що воєнізовані формування атакують поліцейські дільниці та урядові будівлі по всьому регіону. Це було спровоковано нещодавніми новинами про те, що [FROM.getname] прагне анексувати цей регіон.\n\nЦі повстання, схоже, є прелюдією до більшого конфлікту між [FROM.GetAdjective]ими загарбницькими інтересами та [CZE.GetAdjective]им сувернітетом. Конфлікту, який тепер здається неминучим."
