 RAILWAY_GUN_SERIES_INCREASE_DESC:0 "Збільшити кількість залізничних гармат, які треба виробити.\n§GCtrl + клацніть§!, щоби додати §H10§!.\n§GShift + клацніть§!, щоби додати §H100§!."
