 MAN_hoankyoku_desc:0 "Наш уряд дає Китаю найкращі шанси на світле майбутнє. Проте багато хто задумує знищити його. Нам потрібна організація, яка візьме на себе боротьбу з подібними елементами та захист нашої держави."
