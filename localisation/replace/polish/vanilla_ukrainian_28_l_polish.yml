 RAJ_a_private_military:0 "Приватна військова компанія"
 RAJ_an_indian_sandhurst_desc:0 "Ще з минулої війни Індія вимагає від нас побудувати військовий коледж, і ми нарешті виконали це прохання в 1932 році. Ось уже кілька років поспіль Індійська військова академія випускає індійських офіцерів, завдяки чому ми змогли створити головний штаб."
 RAJ_azad_hind_dlc:0 "Азад Гінд"
 RAJ_communist_coup:0 "Комуністичний переворот у [RAJ_communist_coup_target.GetName]"
 RAJ_defend_burma_desc:0 "[BRM.GetName] виступає оплотом проти [JAP.GetName] агресії. Зміцнення їхньої позиції вигідне лише для нас."
 RAJ_dominate_the_bay_of_bengal:0 "Домінувати у Бенгальській затоці"
 RAJ_expand_air_bases_desc:0 "Індія — величезна держава. Для патрулювання та захисту її повітряного простору необхідно наростити кількість літаків на всіх авіабазах субконтиненту."
 RAJ_expand_healthcare_facilities:0 "Розширити медичні заклади"
 RAJ_focus_on_the_countryside:0 "Зосередитися на сільській місцевості"
 RAJ_fortify_aden:0 "Укріпити Аден"
 RAJ_found_scindia_shipyard_dlc_desc:0 "$RAJ_found_scindia_shipyard_desc$"
 RAJ_great_indian_peninsula_railway_dlc_desc:0 "Велика залізниця Індійського півострова є ключем до розкриття економічного потенціалу центральної та південної Індії. Розширення цієї мережі підвищить торгівлю, розширить можливості галузей промисловості та забезпечить безперебійний зв'язок по всьому субконтиненту."
 RAJ_hawker_organization:0 "Hawker — індійський відділ"
 RAJ_headhunt_army_personell_desc:0 "Є багато безробітних зростаючих зірок з колишньої армії, які шукають роботу, ми можемо запропонувати їм кращу угоду, ніж та, що може запропонувати уряд."
 RAJ_indian_institute_of_science:0 "Індійський науковий інститут"
 RAJ_indian_national_highways_desc:0 "Для розвитку промисловості [RAJ.GetNameDefCap] ми повинні почати з основ — наших ліній постачання."
 RAJ_indian_socialism:0 "Індійський соціалізм"
 RAJ_industrialize_the_ganges_desc:0 "Ганг годував нас протягом століть.\nТепер він буде живити наші машини, палити наші печі та озброювати наші армії."
 RAJ_instigate_in_ins_desc:0 "Ми оберемо [INS.GetName] $RAJ_instigate_generic_desc$"
 RAJ_jet_strat_bomber_equipment_1:0 "Vickers Valiant"
