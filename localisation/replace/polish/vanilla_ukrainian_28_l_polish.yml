 FRA_legal_equality:0 "Рівність перед законом"
 FRA_light_tank_destroyer_equipment_3_short:0 "UE-57"
 FRA_little_entente_desc:0 "Союз Малої Антанти, створений після Великої війни для протидії агресії Австрії та Угорщини, свого часу був підтриманий Францією, але зараз почав розпадатися. Замість того, щоби будувати відносини з Великою Британією, нам слід відновити та зміцнити цей альянс, починаючи з Чехословаччини."
 FRA_milice:0 "Milice"
 FRA_national_mobilization_focus:0 "Національна мобілізація"
 FRA_navy_focus_desc:0 "Якщо ми маємо намір розширювати флот, першим кроком має стати поліпшення та будівництво нових морських баз. Це необхідно для підтримки наших кораблів у постійній бойовій готовності."
 FRA_non_military_aid_tt:0 "Дозволяє надсилати §Yдодаткове обладнання§! фракціям, залученим у громадянській війні в Іспанії."
