 interwar_artillery_desc:0 "Уроки, випущені з помилок при створенні різних видів артилерії, можна застосувати для розробки іншої техніки."
 invasion_of_india_desc:0 "Нарешті ера британського володарювання на Індійському субконтиненті добігає кінця. Наступаючи з Бірми, ми мусимо повністю витіснити англійців з Азії. Від такого удару їхня імперія не оправиться ніколи!"
 invite_non_fascist_communist_only_TT:0 "Можливі союзники мусять бути не фашистськими або комуністичними режимами, а також мусять не перебувати в союзі.\n"
