 JUNO_brazil_events.151.t:0 "Успішна операція проти Кангасу"
 JUNO_brazil_events.160.b:0 "Це хитрощі, щоб вкрасти нашу інтелектуальну власність."
 JUNO_brazil_events.49.desc:0 "Після нашого відхилення пропозиції [FROM.GetNameDef] про «стабілізацію» нашої нації, їхні збройні сили, схоже, готуються до війни. Ми не знаємо, коли саме вони мають намір завдати удару, але можна припустити, що ми будемо їхньою ціллю. Дипломати з їхнього посольства також, здається, були евакуйовані, що посилює побоювання, що війна може бути неминучою."
 JUNO_brazil_events.52.a:0 "Абсолютно смішно."
