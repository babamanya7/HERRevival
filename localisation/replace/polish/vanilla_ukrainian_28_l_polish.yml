 GER_dismantle_maginot:0 "Знищення лінії Мажіно"
 GER_dutch_friend_desc:0 "Нідерландці чудово знають, що у новій світовій війні вони довго не протримаються. Якщо переконати їх, що Німеччина здатна серйозно загрожувати навіть Великій Британії, вони можуть погодитися на союз із нами, щоб уникнути окупації."
