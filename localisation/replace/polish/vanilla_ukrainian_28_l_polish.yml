 COG_freedom_at_gunpoint_subject_offer_peace:0 "Запропонувати мир в обмін на [FROM.GetAdjective]у свободу"
 COG_friendship_with_france_desc:0 "[FRA.GetNameDefCap] можливо колонізували нас колись, але вони дозволили нам номінальну незалежність, і ми вдячні за це. Ми повинні спробувати виправити минулі помилки і встановити з ними альянс."
 COG_industrial_investment_decisions:0 "Промислові інвестиції в Конго"
 COG_invest_in_geomines:0 "Інвестувати в Géomines"
 COG_kingdom_of_rwanda_neutrality:0 "Королівство Руанда"
 COG_lecho_du_katanga:0 "L'Écho du Katanga"
 COG_mend_the_linguistic_divides_desc:0 "У нашій нації існують великі поділи, і одним з найбільших є лінгвістичний — між основними мовами, такими як кіконго, лінгала, суахілі, тшилуба та французька, а також сотнями менших мов. Ми повинні надати офіційний статус багатьом з них, якщо хочемо досягти справжньої рівності."
 COG_move_the_capital_to_kigali:0 "Перенести столицю до Кігалі"
 COG_royal_university_of_higher_education:0 "Королівський університет вищої освіти"
 COG_secure_soviet_aid:0 "Забезпечити допомогу СРСР"
 COG_societe_africaine_dexplosifs_congo:0 "Африканське товариство вибухових речовин Конго"
 COG_societe_africaine_dexplosifs_congo_desc:0 "Ще однією річчю, яку необхідно для забезпечення наших потреб у зброї, є державна компанія, що розташована в межах нашої країни, яка може задовольнити наші вимоги. Для цього ми повинні створити Африканське товариство вибухових речовин Конго, щоб вони виробляли для нас боєприпаси і тільки для нас."
