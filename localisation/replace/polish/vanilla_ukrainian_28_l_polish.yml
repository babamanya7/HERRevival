 NETHERLANDS_GATHERING_STORM_DESC:0 "Нідерландський уряд дивиться на зростаючу світову напруженість із тривогою. Він не може створити ефективний план оборони через «хвору» економіку, сильний пацифістських рух і тверде наполягання на нейтралітеті настільки сильне, що відштовхує можливих союзників.\n\nУ той же час важливість Нідерландів як торгового шлюзу з доступом до континенту означає, що британці та німці прагнуть залучитися їхньою «співпрацею», щоби перешкодити іншій стороні й можуть сприйняти відмову як причину застосувати силу. Можливо, відступ у колонії — це єдиний спосіб не постраждати від вторгнення..."
