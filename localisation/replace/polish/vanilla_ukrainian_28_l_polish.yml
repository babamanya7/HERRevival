 AST_an_equal_union:0 "Рівноправний союз"
 AST_an_equal_union_desc:0 "Хоча ми несемо прапор революції, всі, хто приєднується до нас, є рівними. У цьому союзі ресурси, праця та ідеї діляться вільно, формуючи майбутнє, де процвітання є колективним, і жодна нація не стоїть вище за іншу."
 AST_australian_culture_investments_desc:0 "Своїм есеєм «Основи культури в Австралії» Стівенсен вплинув на формування поетичного руху Джіндіворобак і прояснив одне: австралійська культура має бути пріоритетом. Уряд, здається, повністю нехтує цінністю митців і письменників, але ми цього не робитимемо. Мобілізувавши прихильників Джіндіворобак та «Австралії понад усе», ми стимулюватимемо культурний розвиток."
 AST_australian_culture_investments_idea_desc:0 "§W§YПри видаленні§!:\nДодає §YВідчуття Батьківщини§!, що надає\nСтабільність: §G+10.00%§!\nПідтримка війни: §G+10.00%§!.§!\n"
 AST_bring_home_the_farmers:0 "Повернути фермерів додому"
 AST_cabinet_trust_state_5_idea:0 "Дуже висока довіра до кабінету"
 AST_canberra_air_disaster_events.4.desc:0 "Після періоду політичної нестабільності та суспільної недовіри, [AST.GetRulingParty] замінює своє керівництво. Більшість голосів змушує прем'єр-міністра піти у відставку, дозволяючи його наступнику зайняти місце за трибуною."
 AST_central_bureau:0 "Координувати Центральне бюро"
 AST_cv_nav_bomber_equipment_1:0 "Blackburn Shark"
 AST_diplomatic_events.17.c:0 "Ми не погодимося на жодне."
 AST_diplomatic_events.19.t:0 "[INS.GetNameDefCap] відмовляється"
 AST_diplomatic_events.22.a:0 "Врешті-решт, це було того варте."
 AST_diplomatic_events.25.t:0 "Під владою Канберри"
 AST_diplomatic_events.28.a:0 "Австралія повинна подбати про власну оборону."
 AST_diplomatic_events.36.a:0 "Як і уряд Австралії."
 AST_diplomatic_events.38.t:0 "Науруанський пакт"
 AST_diplomatic_events.47.a:0 "Ми маємо погодитися."
 AST_diplomatic_events.49.desc:0 "[ENG.GetNameDefCap] відмовилася підписувати пакт про ненапад. Наша спроба налагодити військову співпрацю між нашими двома країнами зазнала невдачі, і ми повинні продовжувати наші наступи самостійно."
 AST_diplomatic_events.72.a:0 "Чудово."
 AST_diplomatic_events.78.b:0 "[JAP.GetNameDefCap] має свої справи."
 AST_diplomatic_events.78.t:0 "[AST.GetName] просить гарантій проти гіганта"
 AST_diplomatic_events.82.a:0 "Дійсно сумна новина."
 AST_domestic_industry_desc:0 "Ми не можемо покладатися на оборонну промисловість союзників у разі війни. Ми повинні розширювати власну промисловість, щоб бути готовими до того, що насувається."
 AST_edmund_herring:0 "Едмунд Геррінг"
 AST_end_the_kingdom_desc:0 "Час настав. Корінь імперіалістичного капіталізму отримає удар у своє гниле серце. Звільнення робітників по всій Британській імперії вже близько. Покінчити з монархією. Покінчити з королівством. Покінчити з пригніченням. Робітники Співдружності, єднайтеся!"
 AST_energy_independence:0 "Енергетична незалежність"
 AST_expand_the_fort_desc:0 "Західна частина Тихого океану не призначена для командування нею [USA.GetNameDef]. Острови, на які претендують американці, належать східноазіатським державам, і з ростом австралійського впливу, ми будемо тими, хто заявить на них права."
 AST_exports_for_economic_recovery_desc:0 "Опоненти ідей Ланга натомість пропонують використовувати зовнішні ринки та борги для заохочення закордонних інвестицій і продажів, зробивши ставку на експортно-орієнтовану економіку задля підвищення внутрішнього виробництва, зайнятості та, в кінцевому підсумку, споживчих витрат."
 AST_fighter_equipment_1_short:0 "Wirraway"
 AST_fund_australian_defense_research_desc:0 "Ставши суверенною державою, Австралія втратила доступ до новітніх прототипів та креслень, які вона отримувала раніше. Ми мусимо бути впевнені в тому, що завжди на крок випереджаємо наших ворогів і не поступаємось ним у технологічних перегонах."
 AST_heavy_fighter_equipment_1:0 "Bristol Blenheim Mk. IF"
 AST_indonesian_nationalists:0 "Індонезійські націоналісти"
 AST_lee_enfield_no1_mark3:0 "Lee-Enfield No.1 Mk III*"
 AST_light_tank_destroyer_equipment_1:0 "Vickers Mk VI Tank Destroyer"
 AST_light_tank_destroyer_equipment_2_short:0 "M3 Light TD"
 AST_light_tank_equipment_3_short:0 "Crusader II"
 AST_nationalizing_cat:0 "Націоналізація"
 AST_new_deal_desc:0 "Протест, що відбувся під час 150-річного ювілею [AST.GetName], зробив очевидним, що наші закони стосовно громадян з корінного населення повинні бути переглянуті. На прохання груп активістів з прав аборигенів, ми зустрінемося з ними, щоб разом визначити шлях до повноцінного громадянства для корінних народів."
 AST_political_events.4.a:0 "Національна трагедія."
 AST_political_events.7.a:0 "Незважаючи на спроби Британії, [AST.GetName] сама визначатиме свій шлях."
 AST_political_events.7.desc:0 "Після недавніх подій вже неможливо заперечувати, що політика Австралії змінюється. [ENG.GetNameDefCap] вжила заходів, щоб дипломатично переконатися, що [AST.GetName] залишається на шляху, який підходить для нації під егідою їхньої Співдружності, сподіваючись, що їхнього мирного поштовху в правильному напрямку буде достатньо, щоб утримати їхній Домініон лояльним."
 AST_rats_of_tobruk_effect_1:0 "Отримає елітну військову частину в Тобруку."
 AST_recovery_desc:0 "Вперше наш валовий внутрішній продукт перевищив додепресійний рівень. Це момент для святкування, оскільки тепер єдиним напрямком для нашої економіки є зростання. Ми вступаємо в період сильного зростання, і настав час пожинати плоди нашого оновленого процвітання."
 AST_recruitment_drive_desc:0 "Слабка воля попередніх урядів, а також їхня надмірна залежність від Британії, призвели до тривалого періоду нехтування збройними силами Австралії. Це більше не може тривати, і ми запускаємо кампанію з вербування до Сил оборони Австралії."
 AST_seven_million_britishers_uncle_tt:0 "\n§YЯкщо $AST_an_uncle_for_father_figure$ не завершено§!:"
 AST_steelworks_and_shipyard_upgraded:0 "$AST_steelworks_and_shipyard$"
 AST_stephensen_desc:0 "Для формального заснування Руху «Австралія понад усе» ми призначимо П. Р. Стівенсена президентом. Будучи літературним радником Вільяма Джона Майлза, Стівенсен поділяє ізоляціоністські та націоналістичні погляди свого наставника. Вони ляжуть в основу двох ключових принципів статуту нашого руху: незалежність від Британії та об'єднання австралійської культури."
 AST_strengthen_ties_with_uk_desc:0 "Ми повністю віддані нашій метрополії. Ми йдемо за нею і знищуємо її ворогів. Боже, бережи короля."
 AST_stretch_the_fleet_desc:0 "Британія все ще стоїть як оплот капіталізму, захищена своїм могутнім флотом. Настав час розширити власні військово-морські можливості, перенести боротьбу до них і показати світові, чий острів більший."
