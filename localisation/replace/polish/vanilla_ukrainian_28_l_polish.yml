 news.11.e:0 "Нехай дурні б'ються."
 news.119.t:0 "Падіння Нового Південного Уельсу"
 news.121.d:0 "Столиця Республіки Китай, Нанкін, була окупована військами Японської імперії. Незважаючи на запеклий спротив захисників, які сховалися за стінами, японці взяли ворота Чжуншань і прорвалися в місто.\n\nЗвуки перестрілки ще часом чутні, пожежі палахкотять у кількох районах, проте залишки китайських військ або відступили, або були взяті в полон. Разом із захопленням Шанхаю цю перемогу можна вважати однією з найважливіших для Японії у війні з Китаєм."
 news.13.d:0 "Після довгих суперечок уряд держави [FIN.GetNameDef] вирішив задовольнити радянські вимоги щодо перегляду кордонів у Карелії.\n\n[SOV.GetNameDef] заявив про необхідність створення буферної зони для безпеки Ленінграду, розташованого всього за 30 км від колишнього фінського кордону. Багато спостерігачів побоювалися, що радянсько-фінська війна неминуча, проте тепер ці побоювання частково затихли."
 news.140.b:0 "Фашистське лігво наше!"
 news.145.a:0 "Значний розвиток подій."
 news.160.d:0 "Нещодавно Німеччина була змушена вступити в нову війну. Всі сподівалися, що в Європі встановився міцний мир, проте напруженість на континенті виявилася занадто великою. Німецькі офіційні особи стверджують, що більше не можуть зберігати Райнланд демілітаризованим і стверджують, що їм потрібно мати можливість захистити свої кордони."
 news.167.c:0 "Принаймні ми не без друзів"
 news.173.a:0 "Скільки ще буде інтернаціоналів?"
 news.184.b:0 "Ми будемо стежити за ситуацією."
 news.189.b:0 "Ми отримаємо те, що нам обіцяли!"
 news.189.t:0 "Італія претендує на морські бази в Анатолії"
 news.190.c:0 "Символ «великої дружби» між нашими народами."
 news.193.b:0 "На Адріатиці буде мир."
 news.195.b:0 "Сподіватимемося, вільна Польща зможе встати з попелу, створеним її «захисником»."
 news.196.a:0 "Демократія ніколи не буде принижена!"
 news.197.a:0 "Вони повинні бути задоволені, що ми запропонували їм такі хороші умови."
 news.207.a:0 "Людство буде звільнене від цієї ідеологічної виразки!"
 news.208.b:0 "Поки американській території не загрожує небезпека"
 news.222.d:0 "\nВраховуючи стратегічну цінність Скандинавського регіону для оборонних зусиль [ENG.GetAdjective], а також можливі ризики посилення впливу ворога в цьому регіоні, [ENG.GetAdjective]ий парламент обговорив можливість військової інтервенції.\n\nХоча політичні наслідки такої дії сильно вплинули на [ENG.GetLeader], було наведено кілька вирішальних аргументів, перш ніж було вирішено провести решту дебатів у закритих кабінетах.\n\nТаке втручання безповоротно змінило б політичний пейзаж Північної Європи."
 news.233.b:0 "Нам слід розглянути наші варіанти."
 news.235.a:0 "Він отримає прийом, гідний героя Америки!"
 news.245.t:0 "[USA.GetNameDefCap] приєднується до [AST.GetAdjective]ої оборонної ініціативи"
 news.247.b:0 "Ми допоможемо нашим союзникам в Європі!"
 news.254.t:0 "[AST.GetNameDefCap] та Нова Зеландія «об'єднані»"
 news.28.t:0 "Гітлер убитий!"
 news.289.d:0 "\nСьогодні, [alliance_inviter.GetNameDef] і [alliance_applicant.GetNameDef] опублікували спільну заяву про те, що останньому офіційно надано статус члена [alliance_inviter.GetFactionName]. Чи буде це партнерство використовуватися в наступальних або оборонних цілях, поки що невідомо, але, безсумнівно, спільне військове планування вже ведеться."
 news.289.t:0 "[alliance_applicant.GetNameDefCap] приєднується до альянсу [alliance_inviter.GetFactionName]"
 news.292.b:0 "Це був наш план!"
 news.300.a:0 "Ми більше не будемо боягузами!"
 news.300.t:0 "[HUN.GetNameDefCap] вимагає Трансільванію"
 news.303.b:0 "Сподіваємося, ми зможемо знайти компроміс..."
 news.315.desc:0 "Австрія категорично відкинула [HUN.GetAdjective]і заклики до проведення референдуму, незважаючи на зростаючу войовничість Угорщини. Угорщина звинуватила австрійський уряд у грубому нехтуванні демократичними правами свого народу. Вони заявили, що не ухилятимуться від застосування сили, щоб захистити прагнення австрійського народу до возз'єднання зі своїми [HUN.GetAdjective]ими братами. Обидві сторони почали мобілізацію, і війна здається неминучою."
 news.316.a:0 "Ми потрібні один одному."
 news.335.b:0 "Згадайте USS Panay!"
 news.34.t:0 "Друге Комп'єнське перемир'я"
 news.35.a:0 "Французи у відчаї."
 news.55.b:0 "Вони блефують!"
 news.57.t:0 "Судетська криза"
 night_vision2_desc:0 "Ранні моделі інфрачервоних прицілів, що призначалися для снайперів, мали малу дальність огляду. У міру поліпшення огляду та портативності пристроїв, їх зможуть використовувати й інші підрозділи під час нічних операцій."
 non_core_controller_desc:0 "Область, яку контролює неосердна держава."
 nsb_news.1.b:0 "Ми зламаємо цих вискочок!"
 nsb_news.102.desc_default:0 "Пакт про взаємодопомогу між державами [SOV.GetNameDef] та [SOV_collective_security_pact_integrant.GetNameDef] був підписаний учора в місті [SOV.Capital.GetCapitalVictoryPointName] дипломатами обох політик, яку запропонував [SOV.GetAdjective] народний комісар закордонних справ [SOV.SOV_maksim_litvinov.GetName]. За умовами пакту [SOV.GetNameDef] та [SOV_collective_security_pact_integrant.GetNameDef] обіцяють захищати один одного у разі агресії."
 nsb_news.302.d:0 "Вперше був на початку російської громадянської війни — тоді Кавказ швидко розпався. Вдруге Кавказ об'єднали у вигляді Радянської республіки, що розкололася за результатами Радянської Конституції 1936 року. Тепер, вже втретє, [FROM.GetLeader] намагається об'єднати транскавказькі держави, і вони знову готові не тільки захищати свої землі, а й захоплювати чужі. Лише час покаже, як вони зроблять."
 nsb_news.304.d:0 "Вперше з часів російської громадянської війни народи, що заселяють волго-уральський район, об'єдналися в державу, звану ними Ідель-Урал. Цього разу вони оголосили, що не здадуться Росії і збережуть свою незалежність за всяку ціну. Тільки час покаже, чи судиться цій державі вижити..."
 nsb_news.401.b:0 "Поки неясно, чи це допоможе нашій ситуації."
 nsb_news.404.a:0 "Чудово!"
 nuclear_effort_desc:0 "Стоячи на порозі відкриття, яке змінить світ, ми не можемо дозволити іншим запалити вогонь, який зможе одного дня пожерти Землю."
