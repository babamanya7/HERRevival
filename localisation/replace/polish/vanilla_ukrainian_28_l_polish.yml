 ITA_new_forms_of_weaponry_desc:0 "Якщо Італія хоче стати однією з найбільших військових держав світу, ми мусимо досліджувати нові форми озброєння. Наші вчені переконані, що розробка новаторської програми досліджень в галузі атомної енергетики може мати великі перспективи."
 ITA_new_industrialization_program_desc:0 "Щоб іти в ногу з рештою світу, потрібні постійні інновації та вдосконалення. Ми не зможемо залишатися конкурентоспроможними, якщо спочиватимемо на лаврах; ми мусимо постійно прагнути більшого."
