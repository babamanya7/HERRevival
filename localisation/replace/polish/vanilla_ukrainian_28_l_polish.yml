 tsr_anti_soviet_government_opm:0 "Відвернулися від нас"
 tsr_manchukuo.3.desc:0 "Погодившись із нашим аргументом про те, що було б логічно возз'єднати Квантунську орендовану територію з рештою маньчжурської нації, японська влада погодилася передати цю територію."
 turkestan_united_communism:0 "Республіка тюркських народів"
 tut_10_text_2:0 "Кнопка §YВиконати план§!"
 tut_6_text_1:0 "Тепер у Вас є намальований наступальний наказ про атаку столиці Ефіопії. Перед тим, як віддати наказ про виконання операції, мудро буде зробити правильну підготовку.\n\nЯкщо дозволити своїм військам підготуватися впродовж $DAYS_OF_PLANNING|0Y$ днів, вони отримають бойовий бонус до максимальних §G+$PLANNING_MAX|0%$§!. Певні £tech_mod£ §Yназемні доктрини§! можуть змінити те, наскільки швидко війська зможуть §Yпідготуватися§!, тим часом як інші можуть змінити те, наскільки швидко Ви можете досягти максимального рівня підготовки.\n\nТакож рекомендовано підготувати свої військово-повітряні сили. Клацніть на §Yавіабазу§! в §YЕрітреї§!."
 tut_construction_obj_1:0 "20 §Lцивільних заводів§! у використанні"
 uk_free_india_focus_desc:0 "Японія активно розпалює повстання в Індії і навіть сформувала «Індійську національну армію», що складається з індійських новобранців. Ситуація може стати небезпечною, якщо нічого не зробити, щоб запобігти цьому. Ми можемо або швидко перемогти Японію, або пообіцяти індійцям незалежність через кілька років."
 uk_jet_focus:0 "Реактивні літаки"
 unit_artillery_brigade_design_cost_factor_tt:0 " $modifier_unit_artillery_brigade_design_cost_factor$: $RIGHT|-=%2$"
 unite_hui_states:0 "Об'єднати хуеїв"
 united_polynesia_neutrality_ADJ:0 "Полінезійськ"
 upgrade_blueprint_stealing_desc:0 "§LМи знаємо, що наш супротивник має секретні проєкти експериментальної зброї та техніки, але ми не знаємо, що саме розробляється в рамках цих проєктів. Впровадившись у відділ експериментальної зброї наших супротивників, ми не тільки зможемо дізнатися, що саме вони планують використовувати проти нас, але й отримаємо унікальну можливість використовувати цю інформацію для розвитку власного озброєння."
 usa.41.desc:0 "Відповідаючи на питання про її позицію щодо низки політичних питань під час вечері зі збору коштів, представниця висловилася на підтримку політики президента [USA.GetLeader]. Вона також стверджувала, що багато її колег-депутатів мали подібні погляди, але їх просто стримувала «ідіотська недалекоглядність, не думаючи далі від наступних виборів», замість робити те, що було б правильно для американського народу.\n\nЇї коментарі були широко розповсюджувалася в пресі, і кілька її колег поставили в гарячу воду, оскільки їм довелося пояснювати свою позицію з цих питань."
 usa.6.a:0 "Демократи. Ще на чотири роки!"
 usa.7.b:0 "Республіканці. Ми хочемо Віллкі!"
 usa.9.d:0 "Президентство Франкліна Д. Рузвелта вже було винятковим у багатьох відношеннях. Незважаючи на погіршення стану здоров'я та безпрецедентну тривалість президентства, він прагне й надалі керувати нашою країною під час війни. Республіканці були обмежені у своєму виборі кандидатів через те, що багато підхожих кандидатів брали участь у війні, але обрали губернатора Томаса Е. Дьюї, щоб представляти їх.\n\nРузвелт продовжує користуватися народною підтримкою, але багато хто підозрює, що він може не дожити до побачити кінець свого терміну. Але чи достатньо цього, щоби забезпечити Дьюї перемогу над людиною, яка завела нас так далеко?"
 vauxhall:0 "Vauxhall"
 vef:0 "VEF"
 victory_through_airpower:0 "Перемога шляхом панування у повітрі"
 war_escalation_9_tt:0 "§HРівень 9§!\n §YЕфіопія§!: Виживання всупереч усьому"
 war_justification.2.a:0 "[ROOT.GetName] об'єднані під проводом [ROOT.GetLeader]."
 war_justification.203.a:0 "Якщо вони бояться нашої справи, вони бояться свого народу."
 war_justification.206.d:0 "«Чи є більша брехня, ніж уявна свобода [ROOT.GetAdjective]ого народу? Там, де вони колись були рабами під владою князів і герцогів, які претендували на володіння землею, тепер вони змушені продавати свою працю тим, хто претендує на володіння фабриками. Їхню свободу обирати одного господаря замість іншого навряд чи можна назвати свободою. Так само їхня свобода обирати своїх лідерів є фальшивим вибором, оскільки пропаганда ніколи не дозволить справжнім соціалістам прийти до влади. Народ, настільки ретельно індоктринований, може бути врятований лише [From.GetAdjective]им втручанням».\n\nНе бажаючи визнати, що наш народ може бути задоволений без їхніх соціальних експериментів, комуністичний режим в [From.GetName] відкрито погрожував напасти на нашу націю. Існує мало підстав вважати, що цей конфлікт може бути вирішений мирним шляхом."
 war_justification.217.d:0 "«Who determines the borders of a nation and how are they determined? Whatever way people may have found in the past to justify where [From.GetName] ends and [ROOT.GetName] begins, we live in a new era. The strategic importance of this border cannot be overstated, and we are well within our rights to shift it to ensure the continued security of our people».\n\nListening to [From.GetLeader]'s recent speeches, an invasion of [ROOT.GetName] appears imminent. Dissenting voices have objected, but public support for war is on the rise."
 war_justification.301.a:0 "Хіба вони не хочуть уникнути війни?"
 war_propaganda_against_warmonger:0 "Військова пропаганда проти держави [From.GetName]"
 war_propaganda_against_warmonger_desc:0 "Нація скликає всіх чоловіків, жінок і дітей. Війна, схожа на ту, яку переживає [From.GetName], може статись і тут."
 war_propaganda_film_industry:0 "[ROOT.GetImportOrDomesticFilmIndustry]"
 water_fjords_desc:0 ""
 white_liberal_leader_improved:0 "$white_liberal$"
 widespread_bulgarian_sentiment_02:0 "$widespread_bulgarian_sentiment_01$"
 wtt_border_conflict_canceled_attacker.1.t:0 "Патова ситуація в області [their_state.GetName]"
 wtt_border_conflict_canceled_defender.1.a:0 "Ми повернемось."
 wtt_china_shared.10.t:0 "«Летючі тигри»"
 wtt_germany.10.d:0 "Представники італійського уряду та підпілля недвозначно дали нам зрозуміти, що вони не зацікавлені у підготовці перевороту. Вони погрожують розкрити наші плани уряду Італії, якщо ми посміємо ще хоч раз зробити їм таку пропозицію."
 wtt_germany.1000.b_tt:0 "Усі члени великого королівського сімейства вирушать на церемонію на «Гінденбурзі». Це підвищить престиж імператорського сімейства в очах наших союзників та нашого народу, а також зміцнить позиції нашого уряду.\n"
 wtt_germany.27.t:0 "$GER_august_von_mackensen$ помер"
 wtt_germany.38.t:0 "[FROM.GetNonIdeologyName] вимагає повернення Ціндао"
 wtt_germany.41.desc:0 "Німецька імперія прийняла нашу пропозицію провести переговори щодо повернення Ціндао. Її представники гарантують підтримку фон Фалькенгаузен."
 wtt_germany.43.t:0 "Німці вимагають повернення Ціндао"
 wtt_germany.52.t:0 "Демократична громадянська війна в державі [From.From.GetName]"
 wtt_germany.59.a:0 "Принаймні вони будуть у безпеці."
 wtt_germany.62.t:0 "Компанії вимагають виплат за векселями «MEFO»"
 wtt_germany.63.desc:0 "[GER.GetAdjective]ий уряд видав указ про реінтеграцію Ельзасу–Лотарингії та Люксембургу в державу [GER.GetName]. Ми вже оголосили про масовий військовий заклик нашого населення..."
 wtt_germany.7.a:0 "Потрібно змиритися... на якийсь час."
 wtt_germany.999.a:0 "Чудова ідея!"
 wtt_infiltration.10.t:0 "Повстання комуністів"
 wtt_japan.109.b:0 "Ні, не можна ризикувати та налаштовувати світ проти себе."
 wtt_japan.11.b:0 "Найперше — не дати їм жодної переваги!"
 wtt_japan.32.desc:0 "[From.GetNameDefCap] виганяє імператорську сім'ю, чим надає нам велику послугу! Імператор прибув до держави [Root.GetNameDef], але, незважаючи на вигнання, його авторитет у народі та військах, як і раніше, великий."
 wtt_news.1000.desc:0 "Сьогодні під час посадки «Гінденбурга» у Лондоні сталася жахлива трагедія. З поки що нез'ясованих причин дирижабль спалахнув і розбився, забрав життя пасажирів та екіпажу, включаючи майже всіх членів великої німецької імператорської сім'ї.\n\nЖивих залишилася лише принцеса Вікторія-Луїза, яка виїхала раніше для допомоги у підготовці церемонії. Таким чином, принцеса, третя в сімействі, що носить ім'я Вікторія на честь своєї бабки, імператриці Німеччини Вікторії, і своєї прабабки — королеви Вікторії, стала єдиною спадкоємицею престолу. Не одужавши до кінця від потрясіння, вона, проте, вже зійшла на трон як імператриця Вікторії I."
 wtt_news.21.a:0 "Світ має дізнатися про [SOV.GetAdjective]у загрозу!"
 wtt_news.21.b:0 "Як вони сміють наклепувати на нас?"
 wtt_news.4.c:0 "Певно, це все ж була не найкраща ідея..."
 wtt_news.40.b:0 "Ми не могли дозволити ворогові скористатися ним."
 wtt_news.44.desc:0 "Вдягнений у багато прикрашений одяг, що належать імператору Китаю, [MAN.GetLeader], Син неба, Владика десяти тисяч років, Імператор великої династії Цін, зійшов на Трон Дракона під час незвичайної церемонії другої Коронації, і нині мешкає у Забороненому місті, як і його предки. Посилаючись на давні звичаї, [MAN.GetLeader] стверджує, що перемога його військ у китайській громадянській війні доводить, що він отримав Мандат небес на управління Китаєм.\n\nПоки що неясно, чи збирається він поширити свою владу на всю Піднебесну, як мав намір попередній імператор."
 wtt_news.57.a:0 "Якщо Бог із нами, то хто проти нас?"
 wtt_news.58.t:0 "Возз'єднання Нижніх земель"
 wtt_news.6.b:0 "Знов об'єднані!"
 wtt_news.63.t:0 "Підйом держави [From.GetNameDef]"
 wtt_political_organisation.5.desc:0 "Незважаючи на активні спроби залучити громадян області [state.GetName] на нашу сторону, мало хто готовий підтримати нас відкрито. За чутками, [majority_country.GetLeader] заявив про те, що область [state.GetName] необхідно утримати за будь-яку ціну. Багато жителів явно не поспішають підтримувати лідера [Root.GetLeader], оскільки бояться репресій, але наші представники на місцях сподіваються, що в майбутньому, доклавши більше зусиль, ми зможемо переконати людей."
 wtt_political_organisation.8.a:0 "Ганьба!"
 wtt_prc.1.a:0 "Ми мусимо об'єднатися супротив наших ворогів."
 wtt_the_hump.1.desc:0 "[occupying_country.GetAdjective]і війська зайняли кілька аеродромів у області [state_occupied.GetName], через що довелося евакуювати місцеві транспортні літаки, які здійснюють постачання через Гімалаї. Активність ворожих винищувачів посилилася, і тепер, коли не можна долетіти до мети з однією заправкою, цей маршрут закритий. Подальші постачання нею неможливі."
 wtt_xian_incident.5.desc:0 "Схоже, націоналісти втомилися від спроб стерти нас зі своїх карт. На зустрічі у Сіані [CHI.GetLeader] погодився розглянути можливість укладання союзу з нами у боротьбі проти японців.\n\nМи мусимо ретельно зважити всі варіанти."
 wtt_xian_incident.7.desc_a:0 "[CHI_xian_instigator.GetLeader] надіслав повідомлення про те, що він заарештував лідера [CHI.GetLeader], якого хоче передати нам. \n\nМожливо, це найкращий шанс стратити ворога народу!"
 wtt_xian_incident.9.desc:0 "[PRC.GetLeader] надіслав повідомлення про те, що комуністам надається унікальна можливість залучити лідера [CHI.GetLeader] до суду за його злочини проти народу та революції. Його страта стане величезною перемогою для комуністичної партії у її боротьбі за першість у Китаї. \n\nВодночас вона послабить націоналістів у критичний момент і, можливо, навіть дозволить японцям просунутися ще глибше на територію Китаю."
 wuw_GER_chinese_diplomacy.3.a:0 "Чудово"
 wuw_GER_civil_war.1.desc:0 "Після нещодавнього перевороту Вермахту проти нацистського режиму, багато комуністів, які раніше покинули країну, масово повертаються, сподіваючись допомогти у боротьбі з тими, хто колись їх переслідував. Чи дозволимо ми їм воювати, чи спробуємо приховати їх повернення, побоюючись нової революції?"
 wuw_GER_diplomacy.100.t:0 "[FROM.GetAdjective] припиняють виплати за окупацію"
 wuw_GER_diplomacy.109.desc:0 "Попри нейтральне ставлення, [FROM.GetAdjective]и вирішили відхилити пропозицію. Вони зазначили, що час ще не настав, проте не виключають такої можливості в майбутньому."
 wuw_GER_diplomacy.25.desc:0 "Ми гадали, що [FROM.GetLeader] із [FROM.GetNameDef] — розсудливий лідер, але, схоже, ми помилялись. Вони вперто відмовляються передавати наші колонії, попри очевидну вигоду від такої угоди. Що ж, доведеться обійтися без них."
 wuw_GER_diplomacy.38.desc:0 "[GetGERAfricanColonyOverlordDesc]"
 wuw_GER_diplomacy.40.a:0 "Знайдемо інший шлях"
 wuw_GER_diplomacy.50.a:0 "Чудово!"
 wuw_GER_diplomacy.59.t:0 "[FROM.GetNameDefCap] стоїть на своєму щодо Шлезвігу"
 wuw_GER_diplomacy.69.a:0 "Пошукаємо інших партнерів"
 wuw_GER_diplomacy.73.a:0 "За пролетаріат!"
 wuw_GER_diplomacy.77.a:0 "А чому б і ні?"
 wuw_GER_diplomacy.78.a:0 "Свято для нації!"
 wuw_GER_diplomacy.79.desc:0 "Ми отримали відмову надто швидко, щоб повірити, що референдум взагалі проводився. Попри всі ознаки того, що їхній народ виграв би від нашого захисту, [FROM.GetLeader] обрав владу замість блага для народу."
 wuw_GER_legions.7.t:0 "Пропозиція від російських емігрантів у Сербії"
 wuw_GER_monroe.11.desc:0 "[FROM.GetLeader] оголосив про часткове скасування Доктрини Монро, зазначивши, що гарантії залишаються лише для тих, хто підтримав Доктрину. Хоча таких країн менше, вони залишаються рішучими. Це лише тимчасова перешкода."
 wuw_GER_monroe.4.desc:0 "Ми отримали досить жорстко сформульовану ноту від [FROM.GetNameDef]. Вони заявляють, що Доктрина Монро скоро впаде і що незабаром ми більше не будемо під захистом [USA.GetNameDef]. Якщо ми відмовимось від Доктрини зараз, вони пропонують свою протекцію як заміну, проте наголошують, що ця пропозиція дійсна лише у випадку негайної відповіді."
 wuw_GER_monroe.6.a:0 "Ми підтверджуємо підтримку Доктрини"
 wuw_GER_monroe.7.t:0 "Ультиматум від [FROM.GetAdjective]"
 wuw_GER_monroe.8.t:0 "[FROM.GetNameDefCap] Подвоює підтримку Доктрини Монро"
 wuw_GER_realpolitik.14.a:0 "Великий день для [ROOT.GetNameDef]!"
 wuw_GER_realpolitik.21.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що [FROM.GetAdjective] нація передасть нам [87.GetName], [98.GetName] та [97.GetName]. Можливо, вони ще не зрозуміли, що ми замислили для держави [FROM.GetAdjective]."
 wuw_GER_realpolitik.36.a:0 "Мала німецька ідея була помилкою"
 wuw_GER_realpolitik.43.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 wuw_GER_reichskommissariats.17.desc:0 "Після захоплення стратегічної зони Словаччини постало питання, як саме слід розпорядитися цим регіоном. Деякі плани передбачають включення її до Балкан, інші ж — приєднання до Богемії. Дехто навіть пропонує інтегрувати її до складу Великої Німеччини. Що скажемо?"
 wuw_GER_reichskommissariats.25.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_releasable.1.a:0 "Берлін — очевидний вибір!"
 wuw_GER_weltpolitik.10.b:0 "Сьогодні хороший день"
 wuw_HUN_a_multi_ethnic_empire_desc:0 "Наша імперія об'єднує багато народів і культур, і це не слабкість, а наша сила. Ми маємо повністю прийняти це, надавши широку автономію регіонам нашої держави, щоб кожен народ прагнув залишатися її частиною."
 wuw_HUN_aid_the_carlist_struggle:0 "Допомогти Карлістам"
 wuw_HUN_demand_the_vojvodina_desc:0 "Регіон Бачка здавна був невід'ємною частиною нашої нації, однак після Великої війни він був несправедливо відібраний [YUG.GetAdjective] урядом. Ми повинні виправити цю історичну кривду."
 wuw_HUN_expand_the_aluminum_industry_desc:0 "Нам потрібні всі доступні ресурси — як для експорту, так і для внутрішнього споживання. Наша алюмінієва промисловість уже велика, але має простір для подальшого розвитку. Ми маємо негайно спрямувати туди ресурси."
 wuw_HUN_expand_the_army_desc:0 "Наша діюча армія — Honvéd — надто мала, щоб протистояти сусідам. Ми маємо якнайшвидше збільшити її чисельність."
 wuw_HUN_expand_the_arpad_line_tt:0 "Будує §Yфорти§! рівня 2 вздовж північного та східного кордонів §Y[73.GetName]§! та §Y[76.GetName]§!"
 wuw_HUN_invite_foreign_investors:0 "Запросити іноземних інвесторів"
 wuw_HUN_joint_hungarian_soviet_research_effort_desc:0 "Ми запросимо радянських науковців до нашої академії, аби разом розробляти нові технології для потреб нашої нації."
 wuw_HUN_proclaim_greater_hungary_desc:0 "Повернувши історичні території, ми можемо офіційно проголосити створення Великої Угорщини та звернути свій погляд на нові цілі."
 wuw_HUN_reenlist_the_sich_riflemen_desc:0 "Українські січові стрільці билися за нас у Великій війні, а потім за незалежну Україну в часи громадянської війни. Ми повинні відродити цей підрозділ під проводом одного з їхніх найпопулярніших командирів — ерцгерцога Вільгельма Франца Габсбурга, відомого їм як Василь Вишиваний."
 wuw_HUN_revenge_for_1919:0 "Помста за 1919 рік"
 ww_BEL_event_diplomatic.21.desc:0 "Наше запрошення до [FROM.GetNameDef] було прийнято схвально. Вони погоджуються, що більша європейська спільнота — це правильний шлях. Спільними зусиллями ми зможемо стабілізувати регіон."
 ww_BEL_event_diplomatic.26.t:0 "[FROM.GetNameDefCap] Просить обмежену федералізацію"
 ww_BEL_event_war.3.desc:0 "Король, як головнокомандувач збройними силами, сьогодні запропонував безумовну капітуляцію [BEL.GetName], не чекаючи ратифікації від [BEL.GetAdjective] парламенту. Технічно, як головнокомандувач, він має право здатися в армії, але не в країні. \n\nЦивільний парламент вже втік в еміграцію, ясно давши зрозуміти своє бажання продовжити війну, використовуючи всі ресурси [BEL.GetAdjective] імперії."
 ww_congo.23.a:0 "Чудово"
 ww_congo.28.desc:0 "Оскільки новоутворений Національний комітет за визволення прийняв більш відсторонену позицію щодо колоніального уряду, багато людей у сільській місцевості почали турбуватися, що комітет не обиратиме мирний шлях до незалежності. Більше того, в регіоні Катанга почалися чутки про відокремлення, і є ймовірність, що держава спробує проголосити незалежність, коли розпочнеться наша війна за визволення..."
 ww_congo.30.a:0 "Чудово"
 ww_congo.31.t:0 "[FROM.GetNameDefCap] вирішує не допомагати нам"
 ww_congo.35.desc:0 "\n[COG.GetAdjective] уряд, як повідомляється, почав постачати зброю групам опору в Африці, а також приховує і навчає дисидентів та міліції для спроби визволення своїх держав під нашим контролем. Нам слід бути обережними щодо регіону в подальшому..."
 ww_congo.55.a:0 "Ми не можемо багато зробити"
 ww_congo.62.a:0 "Удачі!"
 ww_congo.7.desc:0 "Колоніальна адміністрація в [BEL.GetNameDef] схвалила наш запит на збільшення виробництва їжі шляхом зменшення видобутку корисних копалин з метою 'покращення соціальних умов колоніального населення'."
