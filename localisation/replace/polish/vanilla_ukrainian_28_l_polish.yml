 RAJ_light_tank_destroyer_equipment_1_short:0 "Deacon"
 RAJ_local_leaders_investments_civs_tt:0 "Розвиток цивільної промисловості: \nПобудувати до §G1§! §YЦивільної фабрики§!, §G1§! §YІнфраструктури§! та §Y2§! будівельних слотів у державі."
