 NOR_building_an_independent_norway_desc:0 "[ROOT.GetAdjective]а країна у своїй нинішній, незалежній формі існує лише з 1905 року, тож потрібно виконати багато національної роботи, особливо в нашій галузі, яка буде життєво важливою для нашої незалежності."
