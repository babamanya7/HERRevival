 INSHOL_dutch_east_indies_desc:0 "Колонія була заснована майже 500 років тому і з того часу багато разів змінювалася. Світ швидко змінюється, і наші поточні дії визначатимуть майбутнє голландсько-індонезійських відносин далеко в майбутньому."
 INSHOL_east_indies_fokker_division:0 "Сформувати Ост-Індійський підрозділ Fokker"
 INSHOL_east_indies_student_exchange_desc:0 "Створення системи, за якою індонезійці зможуть переїжджати до Нідерландів для навчання в наших університетах, може стати значним поштовхом для економіки як Нідерландів, так і Ост-Індії."
 INSHOL_hawk_75a7:0 "Hawk 75a-7"
 INSHOL_import_lumber:0 "Імпорт деревини"
 INSHOL_java_desc:0 "$HOL_java_desc$"
 INSHOL_naval_secondchance_desc:0 "Хоча [HOL.GetNameDef] відмовилися передати контроль над флотом, нам все одно потрібно захищати Тихий океан, якщо ми не хочемо, щоб нас захопили. Хоча це може спрацювати не так добре, як якби вони погодилися на нашу пропозицію, ми знайдемо достатньо хорошу альтернативу."
 INSHOL_netherlands_in_exile_desc:0 "Трагічне падіння нашого королівства тепер стало реальністю. Ми не можемо опуститися до пораженства. Ми повинні прийняти те, що сталося, і зосередитися на тому, що ми можемо врятувати."
 INSHOL_reduce_land_ownership_taxes:0 "Зниження податків на землеволодіння"
 INSHOL_request_british_support:0 "Запит британської підтримки"
 INS_REP_UNION_DEF:0 "United States of Indonesia"
 INS_aluminium_factory_desc:0 "Наш видобуток сирих бокситів зростає, але відсутність внутрішнього виробництва алюмінію обмежує наші прибутки. Як провінційна столиця островів Банка-Белітунг, Панкалпінанг був би ідеальним місцем для створення власних заводів. Це дозволить нам виключити посередників і максимізувати наші доходи."
 INS_aslia_ADJ:0 "Аслійськ"
 INS_commander_oerip_desc:0 "Уріп десятиліттями служив в армії і є єдиним індонезійцем, який коли-небудь був підвищений до майора в KNIL. Його знання та досвід набагато перевищують знання будь-якого іншого члена. Він має спрямувати шлях Армії народної безпеки і привести нас до перемоги."
 INS_communist_events.6.a:0 "Цього не можна терпіти!"
 INS_concessions_to_communists_desc:0 "PKI має значну кількість місць у парламенті, ми повинні надати кілька міністерських посад лідерам PKI, щоб забезпечити стабільність."
 INS_cost_text_oil_60_blocked:0 "£resources_strip|1 §R60§!"
 INS_cost_text_rubber_8:0 "£resources_strip|3 §Y8§!"
 INS_current_revolution_strength_0_tt:0 "У цьому регіоні наразі немає активності ополчення."
 INS_current_revolution_strength_3_tt:0 "У цьому регіоні наразі спостерігається §GВисока§! активність ополчення."
 INS_destroy_pacific_colonialism_desc:0 "Революція могла закінчитися, але ще є битви, які потрібно виграти. Є ще багато людей, які живуть під колоніальною тиранією біля нашого порогу. Ми не можемо сидіти склавши руки та спостерігати, ми маємо діяти, щоб звільнити їх від сюзеренів!"
 INS_east_indies_exile_government:0 "Уряд Ост-Індії у вигнанні"
 INS_escalation_has_10_tt:0 "Рівень ескалації становить §Y10§!"
 INS_escalation_has_8_tt:0 "Рівень ескалації вищий за §Y8§!"
 INS_increase_escalation_1_tt:0 "Підвищує §YРівень ескалації§! на §R1§!"
 INS_indonesian_naval_doctrine_desc:0 "Тепер, коли ми будуємо власний флот, важливо розглянути доктрину, за якою ми будемо битися та тренуватися. Ми маємо надати пріоритет формуванню та прийняттю Військово-морської доктрини якомога швидше."
 INS_industrial_events.36.a:0 "Прийнято."
 INS_industrial_events.5.desc:0 "[INS_industrial_events_5_desc_scripted]"
 INS_instigate_in_country_desc:0 "Наша революція не закінчилася, коли останнього колоніального солдата було вигнано з [ROOT.GetAdjective] землі. Робітники та селяни [FROM.GetName] страждають під тим самим ярмом, яке ми скинули, і тепер вони дивляться на нас як на доказ того, що гнобителя можна перемогти. Ми зашлемо до них наших агітаторів, будемо розповсюджувати листівки, фінансувати їхні профспілки та роздмухувати полум'я невдоволення, поки не дозріють умови для революції."
 INS_light_tank_artillery_equipment_2_short:0 "PTG-2"
 INS_limited_war_events.5.a:0 "Ми вистоїмо або впадемо разом."
