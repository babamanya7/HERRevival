 SWE_hygenic_housing_mission_tt:0 "Випадковий стан, суміжний із станом із наявним модифікатором §YГігієнічне житлоg§!, отримає модифікатор §YГігієнічне житло§!.\nЦя місія повторюється, доки кожен основний стан не матиме модифікатор §YГігієнічне житло§!"
