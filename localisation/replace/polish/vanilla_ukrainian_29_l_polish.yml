 CHI_power_struggle_defeated_neutrality_DEF:0 "Кліка братів Чень"
 CHI_prepare_the_war_zones:0 "Підготувати зони бойових дій"
 CHI_reeducate_yulbars_khan_decision:0 "Перевиховати [KUM.GetFlag] $KUM_yulbars_khan$"
 CHI_refugee_relief_agency:0 "Організація допомоги біженцям"
 CHI_revise_the_national_curriculum:0 "Переглянути національну навчальну програму"
 CHI_rocaf_desc:0 "Щоб убезпечити небо [ROOT.GetName] і спроєктувати силу за межі наших кордонів, ми повинні зміцнити ВПС. Інвестиції в доктрину та технічну експертизу закладають основу для сучасного повітряного флоту, здатного кинути виклик будь-якому ворогу."
 CHI_route_safety_trigger:0 "Маршрут контролюється країною, яка не перебуває у стані війни з нами."
 CHI_scorched_earth_tactics_desc:0 "У боротьбі за виживання нації всі засоби хороші."
 CHI_sea_consolidate_our_rule_desc:0 "Хоча ми маємо номінальний контроль над нашою провінцією, все ще є місця, де наша влада слабка. Ми повинні спробувати достукатися до цих місць, щоб населення знало, хто ним керує."
