 USA_protectionist_tariffs_desc:0 "Вільна торгівля відкрила наш ринок для зарубіжних компаній, багато з яких підвищили у себе податки та мита. Наші підприємці ведуть боротьбу з жорсткими конкурентами, що сховалися за податковою стіною. Час з цим покінчити."
