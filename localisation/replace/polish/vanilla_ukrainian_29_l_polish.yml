 germany.200.desc:0 "Німеччина більше не становить тієї загрози, якою була раніше. Тепер саме [SOV.GetNameDef] загрожує зруйнувати світовий порядок. Сильна та демократична Німеччина могла б стати дуже корисним союзником у цій боротьбі. Дозвіл Німеччині знову піднятися також може принести вагомі торговельні переваги як нам, так і їм. Можливо, настав час покласти край окупації та створити підґрунтя для сильного й об'єднаного демократичного світу."
 germany.28.a:0 "Ми приєднаємось до Німецького Райху!"
 germany.4.d:0 "Повторні повстання в Австрії чітко вказують, що її народ прагне об'єднатися з нашим Райхом. Настав час ужити заходів і дозволити волі народу проявитися."
 germany.51.a:0 "Саме час!"
 germany.54.d:0 "Чехи якимось чином набралися сміливості протистояти нашій оккупації їхньої держави. Їхні найкращі укріплення знаходились у Судетах, і вони тепер під нашим контролем, тож це буде швидкою кампанією."
 germany.71.d:0 "Підрозділи SS та вірні армійські частини, що кинулися до Райхсканцелярії, змогли знищити або захопити всіх зрадників-диверсантів, але не раніше, ніж цим псам вдалося вбити Гітлера! Фюрера знайшли, з численними вогнепальними пораненнями, схиленого над своїм письмовим столом — безсумнівно, він працював на благо Фатерлянду до свого останнього подиху! Його давня супутниця Єва Браун була поранена під час перестрілки, але, схоже, з часом вона одужає.\n\nТі змовники, що вижили, постануть перед судом за свій жахливий злочин, але зараз Німеччина перебуває у стані війни і потребує нового лідера. Хто стане наступним Фюрером?"
 germany.97.d:0 "Велика Лондонська конференція мусила б виправити одну з багатьох кривд, завданих Німеччині. Французи, однак, усе ще прагнуть помсти і бажають побачити Німеччину навколішках. Вони підтримали белградський режим попри виправданість наших поглядів. Вони справді вважають, що їхні порожні погрози щось означають для нас?"
 germany.98.c:0 "Зробити маріонетками Хорватію та Югославію."
 germany.99.b:0 "Спершу навчіться дотримуватися графіку потягів."
