 TUR_securing_iran_desc:0 "Якщо [PER.GetAdjective] чиновники не регулюватимуть свою торгівлю нафтою так, щоби нафта не потрапляла до наших ворогів, нам доведеться примусово взяти на себе управління їх ресурсами."
 TUR_the_anglo_turkish_agreement_desc:0 "[ENG.GetAdjectiveCap]ий уряд дуже хоче підписати з нами угоду, яка фактично нічого не вимагає від нас, проте зобов'язує державу [ENG.GetNameDef] миттєво прийти до нас на допомогу у разі вторгнення. Відразу зрозуміло, що вони зневірилися, — втім, нам це тільки на користь."
 TUR_the_international_of_proletarian_freethinkers_desc:0 "Вільнодумці походять із робітничого класу, і незабаром лише найкращі та найяскравіші його представники збиратимуться тут заради загального блага."
