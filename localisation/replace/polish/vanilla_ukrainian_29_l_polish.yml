 CHL_nacista_influence_in_the_universities_mission:0 "Зростання впливу нацистів у університетах"
 CHL_political_events.11.a:0 "Можливо, вони все-таки розумні"
 CHL_political_events.12.a:0 "Що ж, це так, як є"
 CHL_political_events.23.desc:0 "[SOV.GetLeader] оголосив сьогодні політбюро, що Союз має нового союзника в [CHL.GetNameDef], зв'язок з Південною Америкою та плацдарм проти американців, якщо це буде необхідно. Таким чином, ми є частиною їхньої фракції, і ми, безсумнівно, процвітатимемо разом."
 CHL_political_events.27.t:0 "[FROM.GetName] приймає домінування"
 CHL_political_events.38.b:0 "Це надто ризиковано..."
 CHL_political_events.56.a:0 "Сьогодні ми вітаємо вісімдесят тисяч нових чилійців"
 CHL_political_events.62.t:0 "[FROM.GetName] демілітаризує Патагонію"
 CHL_political_events.79.t:0 "[FROM.GetName] вирішує допомогти нам"
 CHL_political_events.89.b:0 "Ким вони себе вважають?"
 CHL_political_events.92.desc:0 "Зі створенням нашого нового сателітного королівства, Імперії Інків, нам потрібно обрати генерала, який поведе їх як Сапа Інка, у дусі наполеонівської доктрини. Хто буде удостоєний цього престижного титулу?"
 CHL_political_events.93.desc:0 "Тепер, коли ми створили державу, яка має нагадувати міфічне Королівство Ельдорадо, ми повинні надати титул сяючого короля одному з наших гордих і відданих генералів. Хто заслуговує на цю роль?"
 CHL_prop_up_gustavo_ross:0 "Підтримати Густаво Росса"
 CHL_return_to_the_continent_tt:0 "Будуть відкриті рішення з §Yінтеграції французьких володінь§! після їхнього взяття."
 CHL_rule_by_decree:0 "Правління за указом"
 CHL_skip_one_line_tt:0 " \n"
 CHL_started_a_revolutionary_movement_here:0 "Держава [CHL.GetName] посилила революцію тут"
 CHL_strengthen_control:0 "Зміцнити контроль"
 CHL_taking_back_patagonia:0 "[CHL_taking_back_patagonia_key]"
 CHL_union_of_american_indigenous_peoples_desc:0 "У світі є багато народів, які були насильно підпорядковані європейському імперіалізму та зазнали мук від нього. Настав час об'єднати індіанців, інуїтів та полінезійців під одним прапором, щоби дати відсіч цим аморальним загарбникам!"
