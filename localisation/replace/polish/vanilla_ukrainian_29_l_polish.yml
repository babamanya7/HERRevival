 communist_infiltration_tt:0 "§RЯкщо не протидіяти, успішне комуністичне повстання призведе до ось чого:§!\n"
 congo_independence_struggle.1.a:0 "Ми повинні спробувати здобути свободу через дипломатію"
 congo_independence_struggle.19.b:0 "Це занадто небезпечно. Ми повинні відступити."
 congo_independence_struggle.22.a:0 "Ми вдало їх обдурили!"
 construction4:0 "Будівництво IV"
 continuous_naval_production:0 "Виробництво кораблів"
 control_chinese_metals_goal_name:0 "Контролювати китайські метали"
 control_curacao_oil_goal_name:0 "Контролювати нафту Кюрасао"
 control_gibraltar_goal_desc:0 "Стратегічна база на Гібралтарській протоці дозволить нам здійснювати контроль над морським рухом між Середземним морем та Атлантикою."
 control_of_the_balkans_goal_name:0 "Безпека Балкан"
 convoy_sailing_bs:0 "$convoy_sailing$"
 coordinate_strike_mark_targets:0 "Позначити цілі"
 coordinated_strike_scout_target_outcome:0 "Команда надала точну інформацію про місцезнаходження ворожого штабу та інших важливих об'єктів всього за кілька годин до атаки."
 country_capitulated.0.d_negative_prev_no_faction:0 "\n[Root.GetLeader] оголосив, що [Root.GetAdjective]а держава більше не може встояти під тиском [From.From.GetAdjective]их окупаційних військ, які скоюють немислимі звірства в їхній країні. [Root.GetAdjective]а влада створила уряд у вигнанні. Їхні основні війська капітулювали, а [From.From.GetNameDef] тепер контролює їхні головні території.\nХоч війна проти держави [From.From.GetNameDef] продовжується, це прикра невдача для всього альянсу [Root.GetFactionName]."
 crisis_solution_in_progress:0 "Уже ведеться спроба вирішити кризу"
 cruiser_effort_desc:0 "Перш ніж заглиблюватись у дослідження лінкорів, потрібно замінити менші крейсери."
 cv_CAS_equipment_3_short:0 "Палуб. штурмовик III"
 czech.1.a:0 "Ми з радістю їх приймемо."
 czech.1.b:0 "Вони поки що не готові."
 czech.14.t:0 "Словацьке повстання"
 czech.21.a:0 "Можливо, це на краще."
 czech.32.d:0 "Антанта, яку очолює [From.GetNameDef], давно намагається стримати розвиток нашої держави. Проте, чим сильніша Німеччина, тим активніший тиск [From.GetNameDef] зазнає з її боку. Не бажаючи воювати на два фронти, [From.GetLeader] шукає можливості укласти з нами світ. \n\nДумки наших керівників розділилися. Одна фракція вважає, що договір із державою [From.GetNameDef] стане першим кроком до виходу з оточення. Інші запевняють, що [GER.GetLeader] розлютиться, почувши таку новину."
 dam_blown_modifier:0 "Дамбу підірвано"
 damage_dealt_screen:0 "  Кораблями прикриття: $NUM|.0H$ ($RATIO|%.0H$)\n"
