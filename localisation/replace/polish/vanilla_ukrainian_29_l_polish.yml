 ICE_american_investments_desc:0 "Тисячі американців, які перебувають на острові, самі по собі добре впливають на економіку. Але це також означає, що американські компанії стають більш зацікавленими у створенні дочірніх підприємств та інвестуванні в ісландські компанії. Загалом, ця ситуація може бути дуже корисною для нас, якщо ми правильно розіграємо наші карти."
 ICE_american_protection_desc_british_subject:0 "[ENG.GetNameDefCap] у цій війні дуже напружена. Вони можуть бути не в змозі захистити нас від ворожих сил, якщо ті вирішать вторгнутися. Ми повинні звернутися до уряду [США.GetAdjective] і запропонувати їм взяти на себе завдання захисту Ісландії."
