 raid_type_CHI_great_wall_raid_land_desc:0 "Мур уже не має того оборонного значення, що колись, але все ще може надати закопаному в землю ворогу перевагу. Відправивши невеликі групи бійців, ми зможемо проникнути за ворожі лінії та підірвати вдало закладені заряди, щоб знівелювати цю перевагу."
