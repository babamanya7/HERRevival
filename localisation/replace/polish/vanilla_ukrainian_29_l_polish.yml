 news.280.t:0 "Індія здобуває незалежність"
 news.282.desc:0 "Останнім часом в Індії посилилися заклики до незалежності. Зараз ситуація досягла апогею, коли радикальний рух «Геть із Індії» закликав [ENG.GetNameDef] якнайшвидше покинути країну. [ENG.GetAdjective]а влада швидко відреагувала і розправилася з рухом, заарештувавши кількох лідерів під час ранкових рейдів по домівках по всій Індії.\n\nЗвіти, підготовлені Спеціальним відділом, вказують на те, що багато прихильників руху все ще перебувають на волі, і багато хто на державній службі висловлює побоювання, що більш екстремістські елементи руху можуть навіть вдатися до насильства."
