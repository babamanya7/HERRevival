 news.33.d:0 "Радянські війська окупували Східну Польщу з метою захисту білоруської та української етнічних меншин від хаосу, який з'явився після відставки польського уряду. Німецькі війська покинули ці області добровільно, внаслідок чого Польща була розділена надвоє."
