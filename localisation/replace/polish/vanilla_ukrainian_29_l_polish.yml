 PHI_encourage_japanese_investment_desc:0 "Наразі Сполучені Штати користуються низкою торговельних переваг у нашій країні. Ми повинні тихо налагоджувати зв'язки з Японією, щоб японські інвестиції могли надходити в нашу країну і підривати жадібність американців."
 PHI_has_built_at_least_one_dockyard:0 "Побудовано щонайменше одну $dockyard$"
 PHI_hispanic_empire_tag_war_communism:0 "$PHI_hispanic_empire_tag_communism$"
 PHI_infiltrate_chinese_ports:0 "Інфільтрація в китайські порти"
 PHI_legalize_the_communist_party_desc:0 "Тепер, коли комунізм як рух знову легальний, наступним кроком є виведення партії з тіні, оприлюднення її дій та початок роботи з розширення руху."
