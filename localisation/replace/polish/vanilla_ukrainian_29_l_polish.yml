 aat_news.777.desc:0 "Зумівши підкорити більшу частину регіону Балтійського моря, [From.GetOldAdjective]ий уряд почав посилено рухатися в напрямку інтеграції новозавойованих територій. В результаті, намагаючись згуртувати народ навколо держави, спостерігається посилення націоналістичної пропаганди за явної підтримки уряду.\n\nThe [FROM.GetOldAdjective]ий лідер [FROM.GetLeader] gave a speech about how [FROM.GetOldNameDef] has managed to do what no other country has and laid the Baltic Sea under its rule. [FROM.GetLeader.GetSheHe] finished the speech by proclaiming the formation of ‘[From.GetNameDef].’"
