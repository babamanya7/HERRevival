 PEACE_FORCE_GOVERNMENT_DESC:0 "Змінити ідеологію однієї із переможених країн. Обрана країна буде змушена перейти на вашу ідеологію."
 PEACE_PUPPET_COUNTRY_LABEL:0 "Маріонетка"
 PEACE_TAKE_NAVY_DESC:0 "Заявити претензії на основні кораблі для власного флоту. Наприкінці конференції кораблі охорони будуть поділені тими, хто заявив права на основні кораблі. Поширення кораблів охорони проходить автоматично відповідно до частки промислової вартості основних кораблів, взятої у кожної окремої ворожої держави."
 PEACE_TAKE_STATE:0 "@$TAKERTAG$$TAKER|Y$ забирає область $STATE|Y$ в держави @$GIVERTAG$$GIVER|Y$"
 PERMISSION_FRIEND:0 "Дружні"
 PER_bolster_civilian_industry_desc:0 "Якщо ми хочемо пережити наближення бурі, ми повинні подбати про посилення нашої цивільної промисловості. Чим більше ресурсів ми вкладемо в це, тим більша ймовірність того, що наша економіка переживе будь-яку війну, що насувається."
 PER_boost_stability:0 "Кампанія державних пільг"
 PER_coastal_defense_initiative:0 "Ініціатива берегової оборони"
 PER_communism_iran_party:0 "Партія Ірану"
 PER_communist_events.14.a:0 "Добре, що вони дотримали слова."
 PER_communist_events.14.desc:0 "Відповідно до нашої угоди з [FROM.GetNameDef], вони надали конструкцію зброї, яка, на їхню думку, буде здатною витіснити імперіалістів з Перської затоки. Чи буде конструкція ефективною для наших потреб, ще належить побачити."
 PER_communist_events.20.b:0 "Ці землі мають залишатися в нашій юрисдикції."
 PER_communist_events.5.t:0 "Криза в Перській затоці"
 PER_communist_events.8.b:0 "Вони довели свою точку зору, видати накази про відступ."
 PER_communist_submarine_design_desc:0 "Спільно з нашими [SOU.GetAdjective] товаришами ми близькі до розробки передового підводного човна, який дозволить нам домінувати в Перській затоці."
 PER_continue_westernization_desc:0 "Вестернізація завжди була певною метою, яка залишалася в думках нашого керівництва. Багато хто прагне наслідувати деяких головних гравців на Заході, приймаючи їхні ідеології та практики. Якщо ми прагнемо приєднатися до них у майбутньому, ми повинні підготуватися до цієї інтеграції зараз."
 PER_crush_saudi_arabia:0 "Інтеграція військової економіки"
 PER_embrace_industrial_powers:0 "Прийняти індустріальні держави"
 PER_establish_special_unit_desc:0 "Безсмертні були одними з найбільш знакових військ, виставлених Перськими імперіями минулого. У міру того, як ми відкриваємо нову еру імперської величі, настав час нам відновити Безсмертних як легіон елітних штурмових військ."
 PER_establish_tehran_armor:0 "Створити «Тегеран Армор»"
 PER_establish_the_navy:0 "Створити Флот"
 PER_expand_imperial_guard:0 "Розширити Імперську гвардію"
 PER_fight_for_iran_desc:0 "Наші найгірші побоювання справдилися, оскільки ворожі сили проривають нашу оборону та просуваються до повномасштабного вторгнення в [PER.GetNameDef]. Хоча ці часи будуть важкими, ми повинні згуртувати наш народ та підготувати наші війська для захисту нашої великої нації проти будь-якої іноземної сили, яка загрожує нашому суверенітету."
 PER_form_arya_party_desc:0 "Хасан Арфа був вірним військовим офіцером і непохитним захисником шаха як відображенням Бога. Однак він може використати зростаючі націоналістичні настрої, щоб радикально реформувати націю, перевершивши навіть найсміливіші мрії шаха."
 PER_great_iranian_empire:0 "Велика Іранська імперія"
 PER_imperial_events.1.desc:0 "Сьогодні вранці посланець з [PER.Capital.GetCapitalVictoryPointName] прибув до [SOU.Capital.GetCapitalVictoryPointName] з пропозицією від шаха [PER.GetNameDef] підписати Пакт про ненапад для забезпечення безпеки наших двох націй. Враховуючи близькість [PER.GetNameDef] до наших південних кордонів, ми повинні взяти це до уваги."
 PER_imperial_events.101.t:0 "Невдалі переговори"
 PER_imperial_events.111.t:0 "Забезпечення наших буферних держав"
 PER_imperial_events.16.a:0 "Тоді війна."
 PER_imperial_events.171.t:0 "[FROM.GetNameDefCap] виводить свої сили"
 PER_imperial_events.182.t:0 "[FROM.GetNameDefCap] відмовляється від наших умов"
 PER_imperial_events.80.desc:0 "На жаль, недавнє просування [PER.GetAdjective] армії призвело до численних втрат з нашого боку, особливо коли вони встановлюють контроль над низкою наших регіонів. Ситуація в [PER.GetNameDef] розвинулася несприятливо для нас, і ми можемо розглянути можливість консолідації наших втрат та виведення військ із регіону. Однак це призведе до того, що ми поступимося деякими втраченими територіями [PER.GetAdjective]s."
 PER_increase_education_funding_bonus:0 "Збільшене фінансування освіти"
 PER_iranian_iraq:0 "Домініон Ірак"
 PER_legacy_of_greatness_tt:0 "Модифікувати §Y$PER_legacy_of_greatness_modifier$§! на:"
 PER_luftwaffe_planes:0 "Придбати літаки Люфтваффе"
 PER_march_to_nile:0 "Довгий марш до Нілу"
 PER_military_fielded:0 "Мобілізовано армію"
 PER_motorized_infantry_bonus:0 "Ініціатива модернізації бронетехніки"
 PER_path_through_iraq:0 "Пробити шлях через Ірак"
 PER_persian_gulf_fleet:0 "Флот Перської затоки"
 PER_rebuilding_iran_desc:0 "Вторгнення залишило значну частину нашої промисловості та інфраструктури в руїнах. Ми повинні використати цей час, щоб зосередитися на відбудові нашої країни до її колишньої слави, збираючи уламки та зализуючи рани."
 PER_recruit_bakhtiari_desc:0 "Бахтіарі — це плем'я лурів зі східного [PER.GetNonIdeologyName]. Хоча багато хто на заході країни стурбований їхнім впливом, їхній кочовий спосіб життя може бути використаний у наших військових силах. Залучаючи членів їхніх племен, ми можемо дати нашим гірськострілецьким силам значну перевагу над ворогами."
 PER_soviet_alignment:0 "Радянське узгодження"
 PER_soviet_iranian_oil_collaboration:0 "Радянсько-іранська нафтова співпраця"
 PER_ssb_events.1.b:0 "Це не в інтересах [THIS.GetNameDefCap]."
 PER_stand_with_giants_tt:0 "Модифікувати §Y$PER_stand_with_giants_modifier$§! на:"
 PER_the_peoples_airforce_desc:0 "Якщо ми коли-небудь утвердимося як регіональна держава, нам потрібно встановити контроль над Перською затокою. Для цього ми розпочнемо створення революційних повітряних сил, щоб протистояти військово-морському домінуванню імперських держав."
 PER_uphold_civil_rights_desc:0 "Повага до громадянських прав громадян [PER.GetNameDef] була важливою частиною правління Мохаммеда Рези-шаха досі. Підтримуючи цей фундаментальний аспект нашого суспільства, ми заохочуємо наш народ досягати більшого, ніж вони могли раніше."
 PER_upscale_military_production_desc:0 "Якщо ми хочемо протистояти тим, хто загрожує нашій нації, ми повинні бути готові подвоїти наш військово-промисловий випуск. Створивши нові фабрики, ми будемо в найкращому становищі, щоб продовжувати посилювати наші сили новим та оновленим обладнанням."
 PHI_american_garrison:0 "американського гарнізону"
