 GER_air_innovation_2_desc:0 "Перед Міністерством авіації Райху стоять завдання першорядної ваги. Люфтваффе мусять стати найдосконалішими ВПС у світі!"
 GER_align_romania_desc:0 "Румунія вже входить у нашу сферу впливу, проте ми могли б іще більше навернути їх у наш погляд на світ. У майбутньому це дозволить нам іще легше маніпулювати цією державою."
 GER_alliance_with_portugal:0 "Альянс із Португалією"
