 AIRWING_STR:0 "Боєздатність: $VALUE|%0H$"
 AIR_LEDGER_THRESHOLD_FIELDED_MANPOWER:0 "Авіаційні людські ресурси «в полі»"
 AIR_MISSION_EXTENSION_ENTRY:0 "$COUNT$ $TYPE$ з: $LOCATION$"
 AIR_MISSION_INTEL_RANGE:0 "$RANGE|H$ літаків призначені на завдання $MISSION|H$ в цьому регіоні."
 AIR_SUPPLY_NORMAL_SUPPLY:0 "§GМи споживаємо $VAL|H1$/$MAX|H1$ постачання в стратегічному регіоні.§!"
 AIR_VIEW_INTERCEPTED_EN_ROUTE_BY_US_COUNT:0 "§HВорожих літальних апаратів збито на шляху до цілі:§! $COUNT$"
 AIR_WING_LEVEL_2:0 "Регулярні"
