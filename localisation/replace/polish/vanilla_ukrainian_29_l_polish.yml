 GER_CAS_equipment_3:0 "Henschel Hs-129"
 GER_GATHERING_STORM_DESC:0 "Нова Німеччина на підйомі. Минули три роки відтоді, як Ваймарську республіку було ліквідовано та замінено на гітлерівський Третій Райх. Після важких років Великої депресії в країну повернулась економічна стабільність, а також було покладено кінець масовому безробіттю.\n\nВійськові обмеження, накладені на Німеччину за умовами Версальського договору, давно забуті, і Вермахт сильнішає день у день. Нова світова війна вже не за горами."
 GER_GER_is_monroe_actor_d_no_resistance:0 "[USA.GetNameDefCap] не показали нічого, окрім незнання щодо наших досягнень в Америці. Хоча у нас ще є над чим працювати, щоб остаточно знищити Доктрину, однак поки що ми маємо перевагу."
