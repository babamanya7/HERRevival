 PLANES_IN_REGION_SUBTITLE:0 "§HЛітаки в регіоні§!\n"
 PLAN_PREPARATION_DESC:0 "Військові частини в стартових позиціях плану почнуть збирати бонус від підготовки. Коли вони почнуть воювати за планом або рухатися геть, бонус знову почне спадати."
 PLAN_VALUE_NEUTRAL:0 "Цей план вважається §Rризикованим§!."
 PLAYER_AI_PREFS_DESC:0 "У цьому віконці Ви можете встановити поведінку ШІ, коли Ви покинете гру в мережі.\nНалаштування зберігаються у файлі збереження, тож якщо інші гравці продовжать гру без Вас, ШІ прийматиме рішення у Вашій країні відповідно до цих налаштувань."
 POK_democratic_DEF:0 "Даяцька республіка Західного Борнео"
 POLITICS_TIMED_ACTIVITY_STATES:0 "$TYPE|H$ областей $STATES|H$ в держави $TARGET|H$"
 POL_align_with_the_west_desc:0 "Велика Британія, Франція та інші західні держави вже давно є непохитними захисниками польського суверенітету, тож нам варто було б тримати нашу країну на їхньому боці."
 POL_anti_capitalist_decisions:0 "Антикапіталістична революція"
 POL_artillery_equipment_2:0 "Haubica 100mm wz. 38 St."
 POL_assurance_of_loyalty_desc:0 "Німці відібрали у нас значні території, і наші зусилля у підтримці війни не можуть бути оскаржені. Ми досить довго підлабузнювалися, настав час вимогти певну компенсацію за те, що ми здали."
 POL_attract_poles_to_gdynia:0 "Залучити поляків у Гдиню"
 POL_carrier_4:0 "Клас «Fryderyk August»"
 POL_central_defence_of_poland_idea:0 "Центральна оборона Польщі"
 POL_draw_closer_to_britain_desc:0 "Британці взяли на себе зобов'язання захищати нашу незалежність перед обличчям агресора. Ми повинні зробити необхідні жести вдячності."
 POL_fighter_equipment_1_short:0 "Jastrząb"
 POL_finno_polish_pact_desc:0 "Фіни перебувають у схожому з нами становищі: вони застрягли на [SOV.GetAdjective]ому кордоні, які не хочуть нічого іншого, окрім як бачити свою націю знову підкореною імперією. Це робить Фінляндію ідеальним кандидатом для початкового розширення Міжмор'я в Нордичні країни."
 POL_four_year_plan_complete_1:0 "$POL_four_year_plan_idea$"
 POL_habsburg_desc:0 "Карл Альбрехт фон Габсбург — польський патріот і, на щастя, він є королем. Можливо, варто запросити його посісти трон, до якого він прагнув від народження."
 POL_habsburg_events.2.a:0 "Звичайно, ми об'єднаємо сили."
 POL_heavy_fighter_equipment_1:0 "PZL.38 Wilk"
 POL_jet_fighter_equipment_1_short:0 "Orzeł"
 POL_join_allies:0 "Приєднатися до Союзників"
 POL_king_michaels_coup_desc:0 "Настав час королю Міхаю узурпувати поточну румунську владу і проголосити себе королем, як це належить йому по праву народження. Колись союзники, Польща і Румунія тепер повинні об'єднатися в одне ціле."
 POL_konfederacja_narodu_desc:0 "Конфедерація нації — це невелика група польських націоналістів, які виступають проти будь-яких спроб Німеччини окупувати Польщу. Можливо, оголосивши про наші інтереси в протистоянні німцям, ці бойовики можуть приєднатися до нашої справи."
 POL_light_bomber_focus:0 "Акцент на легкі бомбардувальники"
 POL_promote_falangism_caribbean:0 "Просувати фалангізм у §YКарибському морі§!"
 POL_purchase_gambia_desc:0 "Століття тому Курляндське герцогство намагалося колонізувати область [701.GetName] від імені Речі Посполитої. Незважаючи на добрі стосунки з місцевими жителями, вони були витіснені іноземними державами. Настав час це виправити."
 POL_pzinz_organization:0 "Państwowe Zakłady Inżynierii"
 POL_restore_kuban_cossacks:0 "Відновити Кубанську республіку"
 POL_sanation_left_irritation_desc:0 "Втомлені від маргіналізації та відсторонення під час режиму Мосціцького, члени Лівої санації прагнуть відновити уряд колишнього прем'єр-міністра Валерія Славека."
 POL_sp_naval_modern_battleship:0 "Лінкор класу «Huragan»"
 POL_the_castle_desc:0 "Замок відображає губернаторів, які правлять із Варшавського замку на чолі з Ігнацієм Мосціцьким. Затяті прихильники статус-кво, підтримуючи уряд у Замку, збережуть стабільність у державі і не дадуть лівим і правим санаціоністам необхідного підґрунтя для державного перевороту."
 POL_the_four_year_plan:0 "Чотирирічний план"
 POPS_invalid-email:0 "Ел. пошта неправильна"
 POPUP_MINOR_EVENTS:0 "Незначні події"
 PORT_STRIKE_RESULT_HEADER:0 "§HУдар по порту§!"
 POR_BEL_autonomy_eu_member:0 "Європейська Португалія"
 POR_assist_the_requetes_desc:0 "Кілька членів португальської армії та авіації будуть направлені до Іспанії, щоби спостерігати за військовими зусиллями карлістів і консультувати їх лідерів. Поки вони там, вони також збиратимуть інформацію про тактику бою, яку використовує кожна зі сторін."
 POR_buy_artillery_in_britain:0 "Придбати артилерійські гармати в держави [ENG.GetNameDef]"
 POR_buy_ships_italy_desc:0 "Ми надішлемо [ITA.GetAdjective]ому уряду пропозицію про придбання кораблів."
 POR_continue_the_public_works_desc:0 "Завдяки державним нормам, які наш уряд запровадив після років нестабільної фінансової ситуації, нам вдалося стабілізувати нашу економічну ситуацію, і ми повинні продовжувати інвестувати в державні проєкти, щоби стимулювати нашу інфраструктуру."
 POR_fight_alongside_the_republic_desc:0 "Ми приєднаємося до громадянської війни в Іспанії на боці Республіки."
 POR_heavy_tank_equipment_2:0 "Tanque Pesado II"
 POR_instituto_superior_tecnico_desc:0 "Португалії потрібна передова інженерна школа з найсучаснішими навчальними та дослідницькими засобами, щоби не залишитися позаду в боротьбі, яка наближається."
 POR_medium_tank_destroyer_equipment_1:0 "Destruidor de Tanques 3"
 POR_national_cruiser_production:0 "Національне виробництво крейсерів"
 POR_research_sharing:0 "Обмін дослідженнями"
 POR_roads_bridges_and_dams_desc:0 "Ми повинні інвестувати в проєкти громадського будівництва, спрямовані на поліпшення нашої інфраструктури та систем доріг."
 POR_ship_torpedo_sub_2:0 "6x 450-мм торпедний апарат"
 POR_the_royal_iberian_alliance_desc:0 "Ми повинні шукати співпраці з іспанською монархією, щоб протистояти загрозам, які існують в Європі та за її межами. Лиш об'єднавшися, ми можемо вийти переможцями в цей час потрясінь."
 PRC_a_stronger_united_front_desc:0 "Ми повинні показати [CHI.GetName], що ми є надійним союзником, щоб вони не відчували потреби тримати ресурси в резерві на випадок, якщо ми порушимо альянс. Нам повинні дозволити більше брати участь у прийнятті рішень."
 PRC_establish_guerilla_cells_start:0 "[GetGuerillaWarfareName]"
 PRC_fascism_DEF:0 "Китайська імперія"
 PRC_fighter_equipment_0_short:0 "Lenin"
 PRC_guerilla_cells_established_in_state_tt:0 "Створити партизанський осередок у [FROM.GetName]"
 PRC_infiltrate_uprising_effect_4:0 "В області з'являться комуністичні елітні дивізії.\n"
 PRC_launch_sabotage_campaigns:0 "Розпочати диверсійні кампанії"
 PRC_leadership_of_mao_desc:0 "Мао проявив себе під час Великого походу, і зростання його впливу завдяки його вмінням — це, мабуть, непогано. Зрештою, якщо ми не хочемо обмежуватися нашими нинішніми кордонами, нам потрібне сильне лідерство."
 PRC_light_tank_destroyer_equipment_3:0 "PTZ 41"
 PRC_light_tank_equipment_3:0 "Type 41 Xiao"
 PRC_peaceful_reunification_desc:0 "Ми є справжніми лідерами Китаю, і цей факт має бути визнаний раз і назавжди. Ми намагатимемося переконати в цьому [WTT_current_china_leader.GetNameDef]. Якщо вони відмовляться... що ж... нація побачить, ким вони є насправді."
 PRC_purge_deng_xiaoping:0 "£BoP_right_texticon Провести чистку: $PRC_deng_xiaoping$"
 PRC_rally_the_industry:0 "Згуртувати промисловість"
 PRC_rebuild_28_bolshevik_desc:0 "Підтримка, яку отримало наше нове керівництво, чітко свідчить про довіру до нього. Ця легітимність дозволить нам легше збирати прихильників як на міжнародному рівні, так і вдома."
 PRC_rebuild_28_bolshevik_effect_tt:0 "Втрачає §Y$PRC_28_bolshevik_trait$§! та отримує §Y$PRC_28_bolshevik_trait_improved$§!.\n§YЕфективна зміна:§!\nЩоденний приріст політичної влади: §G+0.12§!\nСтабільність: §G+5.00%§!\nЩомісячна думка (та ж ідеологія): §G+5.00%§!"
 PRC_rural_region_development_tt:0 "До §Yтрьох§! сільських регіонів отримають §G25%§! локального постачання та §G15%§! локальних людських ресурсів.\nПоточні ефекти:"
 PRC_sea_confrontation_with_the_warlords_desc:0 "$PRC_confrontation_with_the_warlords_desc$"
 PRC_sea_enforce_the_three_rules_desc:0 "$PRC_enforce_the_three_rules_desc$"
 PRC_sea_infiltration_desc:0 "$PRC_infiltration_desc$"
 PRC_sea_prepare_for_war_with_japan_desc:0 "$PRC_prepare_for_war_with_japan_desc$"
 PRC_seek_support_from_ussr_desc:0 "Наш давній союзник, [SOU.GetNameDef], надав вирішальну допомогу нашій революції. Однак для успіху революції ми повинні просити їх ще більше збільшити цю допомогу. Зрештою, успіх нашої революції дозволить їм зосередити свої зусилля на інших кордонах."
 PRC_shipbuilding_industry_bureau_organization:0 "Бюро суднобудівної промисловості"
 PRC_soviet_battle_tactics:0 "Радянська бойова тактика"
 PRC_strengthen_the_air_arsenal_desc:0 "Щоб покращити наші ВПС, ми повинні інвестувати в удосконалення нашого обладнання на основі нашого досвіду. Одноразова інвестиція, щоб зробити наші розробки надійнішими зараз, може навіть заощадити нам гроші на замінах у майбутньому."
 PRC_strong_guotao_support_range:0 "Strong Support of Guotao"
 PRC_the_battle_behind_the_front_lines_desc:0 "Ми повинні подвоїти наші зусилля, щоб завдавати ударів по іноземних агресорах за їхніми лініями фронту. Перешкоджаючи їхньому постачанню та здатності підкріплювати свої передові лінії, ми змушуємо ворога витрачати цінні людські ресурси для захисту свого тилу."
