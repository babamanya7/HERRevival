 AST_print_the_publicist_upgrade_desc:0 "$AST_print_the_publicist_desc$"
 AST_rats_of_tobruk_desc:0 "Наші відважні бійці довели, що здатні воювати у пустелі та використати ресурси, доступні на полі бою. Вони вимотують супротивника, роблячи напади зі своїх баз і відступаючи перед контратакою."
 AST_royal_australian_artillery:0 "Королівська австралійська артилерія"
 AST_smuggle_arms_to_northern_ireland:0 "Контрабанда зброї до Північної Ірландії"
 AST_smuggle_arms_to_northern_ireland_desc:0 "Якщо ми зможемо забезпечити Північну Ірландію достатньою кількістю зброї та хорошим зв'язком з Ірландією, то ми зможемо гарантувати, що вона об'єднається з Ірландією до того, як британці матимуть шанс втрутитися."
 AST_south_australian_housing_trust:0 "Південноавстралійський будинковий трест"
 AST_summon_the_cabinet_tt1:0 "\nЦя подія порушить роботу діючого уряду, потенційно призвівши до його §Yкраху§!."
 AST_union_control_events.5.t:0 "Катастрофа [MAL.GetAdjective]"
 AST_union_control_progressbar_pip_4:0 "Громадянська війна спровокована"
 AST_until_the_tide_of_battle_swings_desc:0 "У публічній заяві ми дамо зрозуміти, що час ігнорувати загрозу, що зріє на нашому задньому дворі, минув. Ми відмовляємося приймати політику, за якою боротьба в Тихому океані розглядається як підлеглий сегмент загального конфлікту; Австралія повинна негайно готуватися до вторгнення."
 AST_war_is_coming_advisors_tt:0 "\nЗмінює політичного радника на:"
 ASY_fascism:0 "Велика Ассирія"
