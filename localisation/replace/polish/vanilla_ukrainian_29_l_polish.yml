 WW_hungary.112.t:0 "[FROM.GetNameDefCap] приймає результати референдуму"
 WW_hungary.121.desc:0 "Керівництво [FROM.GetNameDef] оголосило про підтримку результатів референдуму в [76.GetName] та відмову від претензій на територію, визнаючи волю місцевого населення."
 WW_hungary.17.desc:0 "[HUN.GetLeader] з [HUN.GetNameDef] сьогодні надіслав нам ультиматум з вимогою надати [HUN.GetName] контроль над регіоном Західного Банату. Якщо ми не виконаємо вимоги [HUN.GetLeader], ймовірно, це призведе до військового конфлікту."
 WW_hungary.2.desc:0 "[FROM.GetAdjective]ий уряд зайняв відверту позицію на користь нашої країни у наших військових зусиллях. У рамках своєї нової підтримки вони надіслали нам партії зброї. Це точно не завадить нам у війні."
 WW_hungary.2.t:0 "[FROM.GetAdjective]і поставки зброї"
 WW_hungary.20.b:0 "А чи справді вони зможуть це підкріпити?"
 WW_hungary.23.desc:0 "[HUN.GetAdjective] уряд посилив тиск щодо Бургенланду, стверджуючи, що він раніше належав Угорщині під час Імперії й має бути повернений. Вони заявляють, що Лайтабаншаг має бути відновлений у регіоні, а наше управління — нелегітимне. Як ми маємо відповісти?"
 WW_hungary.36.a:0 "Будуємо наше майбутнє разом!"
 WW_hungary.4.desc:0 "Трансільванія довгий час була частиною Угорщини, перш ніж її було вилучено після Тріанонського Договору. На жаль, угорці так і не подолали горе через втрату своєї території. У різний час вони публічно заявляли, що Трансільванія є невід’ємною частиною їхньої нації. Через останні зміни в політичній ситуації, вони знову вирішили висунути свої претензії до нині нашої землі, вимагаючи, щоб ми передали їм увесь регіон, інакше..."
 WW_hungary.52.t:0 "[FROM.GetNameDefCap] приймає монарха з династії Габсбургів"
 WW_hungary.66.t:0 "[FROM.GetLeader] вимагає відновити правління Габсбургів"
 WW_hungary.85.b:0 "Вони сказали ні, і ми це поважаємо"
