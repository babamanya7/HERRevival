 BUL_nsm_name_dat2:0 "£faction_bul_nsm §YНародному соціальному рухові§!"
 BUL_old_enemies:0 "Старі вороги"
 BUL_opression_destroy_bs_desc:0 "Настав час завдати вирішального удару $BUL_bs_name_dat$ і позбавити країну від цієї загрози раз і назавжди."
 BUL_opression_repress_zveno:0 "Репресувати $BUL_zveno_name_acc$"
 BUL_prussia_of_the_balkans_desc:0 "У перші роки свого існування Болгарське царство було сильно мілітаризованою державою з великою й добре оснащеною армією, а тому називалася Пруссією Балкан, поки її не зрадили колишні віроломні союзники. Проте ми відбудували нашу країну після принизливих поразок минулого, і тепер настав час повернути колишню славу Болгарії. Світ знову назве нас Пруссією Балкан!"
 BUL_purge_the_elites_desc:0 "Привілейованим класам Болгарії настав час припинити накопичувати свої багатства. Якщо ми хочемо, щоби наша країна та її економіка процвітали, багаті мають ділитися тим, що мають, з тими, у кого нічого немає, а не з банками."
 BUL_rebuild_the_army_desc:0 "Ми оточені можливими ворогами, і як нас навчила історія, дуже важливо, щоби ми побудували потужну армію та розробили сучасну тактику, якщо ми хочемо перемогти в будь-якому майбутньому конфлікті."
 BUL_reduced_faction_interaction_cooldown_tt:0 "Рішення по §Yуправлінню фракціями§! будуть швидше виконуватися і будуть доступними після активації."
 BUL_reinforce_naval_bases_desc:0 "Ми мусимо гарантувати, що наші військово-морські бази добре захищені та мають можливість підтримувати наш флот, що працює в цьому районі."
 BUL_simeon_is_7:0 "всього сім років"
