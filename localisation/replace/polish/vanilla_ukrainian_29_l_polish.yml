 default_scripted_diplo_action_send_desc:0 "Ви справді хочете надіслати дипломатичну дію $ACTION|H$ державі $RECEPIENT|H$?"
 defeat_of_fascism_goal_desc:0 "Щоб раз і назавжди зупинити поширення фашизму, ми повинні почати вдома, викорінюючи фашизм у нашій частині світу."
 denmark_expansion_event.100.a:0 "Нам залишається лише допустити це."
 denmark_expansion_event.301.desc:0 "[FROM.GetNameDefCap] люб'язно приймає нашу пропозицію щодо новопридбаних [SWE.GetAdjective]их ресурсів. Можливо, це означає, що наші країни можуть порозумітися."
 denmark_expansion_event.4.a:0 "Це прийнятно."
 denmark_expansion_event.500.t:0 "Пропозиція альянсу"
 denmark_expansion_event.802.t:0 "[FROM.GetNameDefCap] відмовляється від нашого захисту"
 denmark_fascist_event.1.a:0 "Ми допоможемо їм прийти до влади!"
 denmark_fascist_event.1.t:0 "[FROM.GetNameDefCap] шукає нашої підтримки"
 denmark_fascist_event.20.b:0 "У нас немає на це часу."
 denmark_fascist_event.20.t:0 "[FROM.GetNameDefCap] пропонує дослідницьку угоду"
 denmark_occupation_event.102.desc:0 "[FROM.GetLeader] необачно відштовхує нашу руку допомоги і пропозицію про співпрацю — але ж ми могли допомогти державі [FROM.GetNameDef]. Треба думати, ця країна вважає за краще діяти поодинці, не покладаючись на союзників."
 denmark_overlord_events.17.desc:0 "[FROM.GetNameDefCap] дає нам зрозуміти, що збирається звести на чолі нашої країни новий, більш про[FROM.GetAdjective]ий уряд. Це їхня відповідь на те, що [ROOT.GetLeader] відмовився зняти з себе повноваження прем'єр-міністра. Ми втратимо незалежність, якщо не повстанемо зараз же, навіть якщо ми ще не готові..."
 denmark_overlord_events.6.t:0 "Телеграмна криза вирішується сама собою"
 denmark_protection_event.11.a:0 "Славно!"
 denmark_protection_event.11.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію продати територію"
 denmark_resistance_event.2.a:0 "Блискуче!"
