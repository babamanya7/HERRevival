 SWE_merge_army_complexes_desc:0 "Буде ефективніше централізувати наші військові комплекси. Залишаючи їх у наших державах-членах, ви ризикуєте втратити їх у разі вторгнення."
 SWE_mobilization_of_society:0 "Мобілізація населення"
 SWE_modern_tank_aa_equipment_1_short:0 "Lvkv m/49"
 SWE_neutrality_party:0 "ФЛ"
 SWE_per_albin_bus_tt:0 "Створює підрозділ мобільного штабу, який дозволяє нашому лідеру евакуюватися. Проте, якщо автобус буде знищено, це не віщує нічого доброго для нашого прем'єр-міністра."
 SWE_per_albin_line_tt:0 "Додає укріплення в ключових оборонних районах навколо Мальмьо та його протоки, далі вглиб країни в перекриттях навколо озер Венерн і Веттерн, а також у Готланді та Стокгольмі"
 SWE_police_reforms_desc:0 "Не дивно, що наша політика створює для нас дуже сильних ворогів серед буржуазії та аристократії. Якщо ми хочемо запобігти їм розпочати контрреволюцію, ми повинні діяти швидко та викорінити їх, разом із усіма класовими зрадниками серед пролетаріату."
 SWE_prevent_a_red_dictatorship_desc:0 "Соціал-демократи — це не що інше, як троянський кінь для комуністів. Якщо ми хочемо запобігти потраплянню Швеції в радянську сферу впливу, ми повинні забезпечити, щоб електорат надав націоналістичним партіям контроль над Ріксдагом. Використовуючи будь-які засоби необхідно."
 SWE_secret_mobilization_desc:0 "Якщо ми рухатимемося занадто швидко в мобілізації наших сил, ми можемо попередити наших супротивників і спровокувати саме те вторгнення, від якого ми намагаємося захиститися. Тому ми повинні діяти обережно, щоб не викликати підозр."
 SWE_ship_torpedo_4:0 "5x 533-мм ТА (пневм.)"
 SWE_social_democrat_range:0 "Соціал-демократи при владі"
 SWE_socialists_reforms_decision_efficiency_mil_to_civ:0 "Від військової економіки до цивільної"
 SWE_sub_ship_engine_1:0 "«Atlas» 1 340 к. с. н. в."
 SWE_swedes_not_sweden_to_finlands_aid_pre_fin_war:0 "Шведський добровольчий корпус"
 SWE_swedish_finnish_defense_agreement_faction:0 "Шведсько-фінська оборонна угода"
 SWE_tank_development_desc:0 "Хоча ми не можемо розгорнути бронетехніку у величезних кількостях, як це можуть інші країни, ми можемо бути більш ефективними в наших проєктах і виробництві."
 SWE_the_aland_question_desc:0 "Оскільки [SOV.GetNameDef] намагається відновити контроль над [FIN.GetName], ми не можемо дозволити їм отримати контроль над стратегічною територією [145.GetName]. Оскільки острови розташовані недалеко від нашого узбережжя, вони можуть бути використані спрямувати [SOV.GetAdjective]у повітряну та морську силу глибоко на [SWE.GetAdjective]у територію."
 SWE_totalforsvar_desc:0 "Як ми й підозрювали, нещодавні конфлікти неминуче переростають у тотальну війну. Таким чином, нам потрібно перевести економіку на військове виробництво, щоб забезпечити наші війська обладнанням, необхідним для захисту нації."
 SWE_vasa_ii_communist:0 "Röd Orkan"
 SWE_winter_drill_desc:0 "Ретельно навчивши наші війська розуміти [SWE.GetAdjective]у місцевість і як використовувати переваги погоди, вони могли б взяти верх над ворожими силами, значно більшими за них самих."
 SWE_work_projects_for_the_unemployed:0 "Робочі проєкти для безробітних"
 SWE_work_projects_for_the_unemployed_desc:0 "Люди, які можуть працювати, але не можуть знайти роботу, є рушійною силою радикалізму. Якщо ми хочемо, щоб люди не виступали проти уряду, нам потрібно створити робочі проєкти для безробітних."
 SWI_GER_puppet_democratic_DEF:0 "Швайцарська співдружність"
 SWI_arsenal_of_the_alps_desc:0 "Їхні круті вершини, те, наскільки сильно ми їх укріпили, і наше знання їхньої місцевості роблять Альпи ідеальним місцем для різкого збільшення нашої військової потужності та збереження її, якщо нам знадобиться відступ."
 SWI_attack_from_the_mountains_desc:0 "Розташувавшись на наших укріплених позиціях в Альпах і Юрі, ми зможемо завдати хаосу ворожим військам у долині. Ми маємо переконатися, що вони знають, що кожна хвилина, яку вони проводять на нашій території, означає ще більші втрати персоналу та матеріальних засобів."
 SWI_banned_communism_good:0 "Комунізм заборонений"
 SWI_become_german_puppet:0 "Стати [SWI_get_fascist_neighbor_adjective]ою маріонеткою"
 SWI_bought_equipment_from_us:0 "Придбали оснащення від нас"
 SWI_buy_ships_SOV:0 "Придбати старі [SOV.GetAdjective]і лінкори"
 SWI_concessions_to_monarchists_desc:0 "[SWI_concessions_to_political_party_desc]"
 SWI_emergency_industry:0 "Промисловість надзвичайного стану"
 SWI_expand_military_staff:0 "Розширити військовий штаб"
 SWI_export_saboteurs_desc:0 "Нам не потрібно вступати у війну, якщо ми можемо знищити наших ворогів зсередини. Наше розвідувальне агентство може вдосконалити наші операції, щоби спеціалізуватися на агітації та зміцненні опору на територіях, окупованих гнобителями, повільно знищуючи їхню владу."
 SWI_federal_council_decisions_category_desc_fasc:0 "Можливо, це не та рада, що була раніше, але новому славному режиму на чолі з лідером [SWI.GetLeader] усе ще потрібна сильна рада, щоби виконувати волю фюрера в державі [?SWI.SWI_biggest_fascist.GetNameDef].\n\n§YПровідні канцлери:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_police:0 "Відділ розвідки федеральної поліції"
 SWI_guiding_principles_council:0 "$SWI_swiss_guiding_principles$"
 SWI_investing_in_switzerland:0 "Інвестують у Швайцарію"
 SWI_jump_into_action_desc:0 "Всього 10 років тому це було б неможливо, але [ROOT.GetNameDef] підготувався до активного та відкритого приєднання до війни. Ми підготували нашу інфраструктуру, промисловість і наукові інституції до повного конфлікту, подібного якому ми ще не бачили. Двигун [ROOT.GetAdjective] війни гуде, готовий кинутися в дію."
 SWI_liberate_italy:0 "Звільнити Італію"
 SWI_national_redoubt:0 "Réduit national"
 SWI_naval_industry_desc:0 "Навіть якщо нова берегова лінія, яку ми придбали, має деякі залишки військово-морської промисловості, ми повинні поспішити, щоб усебічно її розширити та перетворити на цілісну структуру для виробництва та обслуговування, гідну справді потужного швайцарського флоту."
 SWI_neutral_entente_desc:0 "Ми не єдина нейтральна нація у світі, і з огляду на ризик війни та воюючих держав, які перешкоджають нашому бажанню не брати участі в їхніх конфліктах, ми маємо й далі їх стримувати. Ми повинні шукати взаємної допомоги всіх інших нейтральних країн, тому війна з одним нейтралом означає війну з усіма нейтралами."
 SWI_opinion_good_text:0 "§Gхороша§!"
 SWI_purchase_american_planes_desc:0 "Нашим військово-повітряним силам не вистачає необхідної кількості та технологій для ефективного захисту, тому ми повинні шукати десь в іншому місці, щоби придбати наше обладнання. [SWI_purchase_american_planes_second_paragraph]"
 SWI_purchase_american_planes_other:0 "Придбати літаки від демократичної держави"
 SWI_purchase_democratic_planes_fighters:0 "Придбати винищувачі в держави [FROM.GetName]"
 SWI_sentenced_frankfurter_without_a_trial:0 "Засудили Давіда Франкфуртера без суду"
