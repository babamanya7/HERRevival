 baltic.4.a:0 "Ми мусимо погодитися."
 baltic.5.d:0 "[Root.GetName] обрала солідарність і вирвала політичну владу у буржуазії. Багато хто в новому уряді пропонує нам виконати наші комуністичні обов'язки і стати одним цілим з Радянським Союзом."
 baltic_security_goal_name:0 "Захистити Балтію"
 basic_dp_light_battery:0 "Базова універсальна батарея"
 battle_cruiser_2_desc:0 "Модернізовані лінійні крейсери, як і раніше, швидше за навіть новітніх лінкорів, і при цьому вони отримали нові системи управління вогнем, виявлення та ППО."
 battlecruiser_supremacy_capital_drills:0 "Принцип швидкого дивізіону"
 bba_news.101.t:0 "Колишнього італійського лідера Беніто Муссоліні страчено"
 bba_news.110.desc:0 "Новопризначений лідер держави [FROM.GetName], [FROM.GetLeader], не зміг упоратися зі зростаючою напругою, яка нещодавно розділила [FROM.GetAdjective]ий народ. Це призвело до спалаху громадянської війни, яка розриває країну зсередини. Різні групи, від комуністів до роялістів і демократів, борються за владу і створюють мінливі альянси, тим часом як фашисти сповнені рішучості зберегти своє правління.\n\nХоча результат громадянської війни ще не визначений, допомога ззовні, безсумнівно, відіграватиме важливу роль у майбутній перемозі."
 bftb_bulgaria_balkan_federation.16.desc:0 "[BUL.GetAdjectiveCap]і дипломати передали вимогу свого уряду поступитися [ROOT.GetAdjective]ими землями Балкан, які, згідно з [BUL.GetAdjective]им посланням, по праву належать їм. \nЗагалом делегати держави [BUL.GetNameDef] витримують доброзичливий тон, але деяким нашим дипломатам у ньому чуються загрозливі нотки, особливо у світлі відмови [ROOT.GetAdjective]их міністрів."
 bftb_bulgaria_democratic_international_policies.7.desc:0 "[ENG.GetAdjectiveCap]ий уряд відправив дипломатичну делегацію, щоби повідомити нам про свою згоду на негайну передачу державі [BUL.GetNameDef] адміністративного контролю над колишніми болгарськими територіями. Зумівши домовитися з [ENG.GetAdjective]ою владою, наш уряд був змушений передати контроль над цими окупованими територіями, щоби не зіпсувати відносин із союзниками."
 bftb_bulgaria_democratic_international_policies.7.t:0 "[ENG.GetAdjectiveCap]о-[BUL.GetAdjective]ий пакт"
 bftb_bulgaria_equipment_purchases.1.b:0 "Закупити ППО"
