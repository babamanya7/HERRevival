 GER_amphibious_mechanized_equipment_1:0 "Land-Wasser-Schlepper"
 GER_anti_colonialism_category:0 "Антиколоніалізм"
 GER_anti_soviet_pact:0 "Анти-[SOV.GetAdjective]ий пакт"
 GER_autonomy_collaboration_government_DEF:0 "$OVERLORDADJ$а $NONIDEOLOGY$"
 GER_autonomy_in_the_kriegsschulen:0 "Автономія в Kriegsschulen"
 GER_bribe_senior_officers_desc:0 "Щоби забезпечити лояльність наших старших офіцерів у відношенні до фюрера, нам слід розглянути можливість винагородити вірність і послух. Пропонуючи гроші, землю та податкові пільги, ми забезпечимо, що вони не лише залишаться лояльними, але й залишатимуться на своєму місці та не ставитимуть під сумнів свого фюрера."
 GER_bring_turkey_into_the_fold_desc:0 "Турецька держава має претензії на території поза своїми нинішніми кордонами і буде легко примушена приєднатися до нашої фракції. Час знову повернути їх до складу."
 GER_build_defense_industry:0 "Збудувати оборонну промисловість"
 GER_case_anton_tt2:0 "Не контролює більшість французьких областей у Північній Африці"
 GER_case_red:0 "План «Червоний»"
 GER_central_planning_desc:0 "Оскільки економіка вже в руках держави, логічно, що її планування також має бути централізованим. Лише ті, хто має повне бачення економіки, здатні приймати найкращі рішення щодо інвестицій та розподілу ресурсів."
 GER_communist_propaganda_south_america_decision:0 "$GER_communist_propaganda_decision$"
 GER_construct_central_atlantikwall_tt:0 "Побудувати оборонну лінію вздовж узбережжя від регіонів §Y[99.GetName]§! до §Y[6.GetName]§! в кожній області повністю підконтрольній державі §Y[ROOT.GetNameDef]§!, [GER.GetAdjective]ій маріонетці або члену альянсу. Додасть §G1§! додаткове §Y$coastal_bunker$§! в провінціях із хоча б §Y1 $naval_base_ins$§!. Поточний ефект:\n"
 GER_controls_french_coast_tt:0 "§Y[ROOT.GetName]§!, [GER.GetAdjective]а маріонетка або член альянсу повністю контролює всі регіони вздовж §YАтлантичного узбережжя§! від §Y[29.GetName]§! до §Y[806.GetName]§!."
 GER_cossack_exiles_divisions_recruitment_tt:0 "Отримати два козацькі §Yкавалерійські§! підрозділи"
 GER_democratic_shield_send_support:0 "Відправити військову підтримку державі [FROM.GetName]"
 GER_destroyer_1_desc:0 "Тип «23» був класом торпедних катерів, побудованих для Крігсмаріне після Першої світової війни. Шість кораблів було збудовано між 1926 і 1928 роками, і всі вони служили під час Другої світової війни. Незважаючи на те, що вони були торпедними катерами, кораблі були розміром з есмінець, водотоннажністю понад 920 тонн і озброєні трьома 105-мм гарматами L/45."
 GER_division_belgium_mech_tt:0 "Ветеранська §Yмеханізована§! частина §Y27. SS-Division Langemark§! and the veteran §Ymechanized 28. SS-Division Wallonien§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_norge_armored_tt:0 "§YТанкова§! частина §YSS-Panzerdivision Norge§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_dp_light_battery_2:0 "12.7cm/45 SK C/41 DP"
 GER_economic_path_shortcut:0 "Економіка"
 GER_embrace_liberal_leanings:0 "Прийняти ліберальний курс"
 GER_expand_ss_security_duties_desc:0 "Оскільки SS постійно зростає під керівництвом Гайнриха Гіммлера, настав час їм узяти на себе більшу відповідальність за нашу безпеку. Дозволивши розширити їхні обов'язки, ми зможемо вивільнити ресурси для використання в інших сферах."
 GER_fan_prussian_militarism_desc:0 "$GER_fan_the_prussian_militarism_desc$"
 GER_fascism_civil_war_tt:0 "Прихильники фашизму почнуть громадянську війну.\n"
 GER_finland_puppet_description_neutrality:0 "[FIN.GetAdjective] народ свого часу відхилив нашу пропозицію посадити короля, але ми більше цього не дозволимо. Принц Вольфганг Гессенський сяде на їхній трон, подобається їм це чи ні."
