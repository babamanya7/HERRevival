 BUL_AUS_autonomy_eu_member:0 "Європейська Болгарія"
 BUL_GATHERING_STORM_DESC:0 "Після Визвольної війни 1878 року та відмови західних демократій від Сан-Стефанського договору Болгарія переживала довгу історію конфліктів і зрад на Балканах. Будучи переможеним членом Центральних держав у Великій війні, Болгарія зазнала великих територіальних втрат, а Ньойї-сюр-Сенський договір наклав жорсткі економічні санкції та суворі військові обмеження.\n\nАле з великими політичними та соціальними змінами, що відбуваються в Європі, настав час Болгарії вибрати свій власний шлях і знайти своє гідне місце на Балканах."
 BUL_all_that_glitters_desc:0 "Поклади золота в Челопечі можуть служити нашій економіці в той час, коли інвестиції в нематеріальні активи знаходяться під великим ризиком. Вплив на наші національні резерви має бути відчутним."
 BUL_arms_trade:0 "Торгівля зброєю"
 BUL_assert_our_claims_desc:0 "Настав час вирішувати територіальні проблеми, які мучать нашу країну десятиліттями. Ми мусимо шукати підтримки від уряду [ENG.GetAdjective], щоб виправити образи, які були завдані Болгарії після її звільнення."
 BUL_balkan_confederation_desc:0 "[GetABalkanConfederationFocusLoc]"
 BUL_balkan_federation_demand_turkish_territory_desc:0 "Ми надішлемо делегацію, з якою [TUR.GetLeader] обговорить передачу [TUR.GetAdjective]их територій на Балканах під контроль держави [BUL.GetNameDef]."
 BUL_balkan_federation_propaganda_desc:0 "Ми організуємо масштабну кампанію пропаганди в державі [FROM.GetNameDef], щоби забезпечити проєкту Балканської федерації підтримку [FROM.GetAdjective]ого пролетаріату."
 BUL_bs_destroyed_flag:0 "Фракція [GetBsName] знищена"
 BUL_condemn_macedonian_organizations:0 "Засудити македонські організації"
 BUL_cooperation_integrate_faction_tt:0 "Лояльність фракції — §Y100§!\nПопулярність фракції вища, ніж §Y70§!"
 BUL_dest_burgas:0 "Бургас"
 BUL_destroy_imro_foreign_cancel_trigger_macedonia:0 "§Y[106.GetName]§!:\nОдна з умов мусить бути виконана:\n   Не повністю контролюється державою §Y[ROOT.GetName]§!\n   Менш ніж §Y9 піхотних§! дивізій в області §Y[106.GetName]§!\n"
 BUL_dominance_in_the_adriatic_default:0 "Темні часи вимагають вжити жахливих заходів. Щоб гарантувати не лише цілісність болгарської нації, а й її панування в Трьох морях, настав час убезпечити Адріатику, усунувши будь-які можливі загрози з її берегів."
 BUL_ferdinand_is_back:0 "Фердінанд I повернувся"
