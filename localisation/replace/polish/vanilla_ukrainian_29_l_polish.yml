 GER_industrial_cooperation:0 "Промислова співпраця"
 GER_inner_circle_himmler_gestapo_tt:0 "§Y$GER_heinrich_himmler$§! незабаром розпочне роботу над фокусом §Y$GER_expand_gestapo$§!."
 GER_integrate_czech_manufacturers:0 "Інтегрувати чеських виробників"
 GER_mio_trait_innovative_safety_features:0 "Інноваційні засоби безпеки"
 GER_mio_trait_panzerjager:0 "Panzerjäger"
 GER_operation_panzerfaust_events.04.desc:0 "Міклош Горті сьогодні оголосив, що не піддасться тиску Німеччини, і що Угорщина залишиться незалежною. Оскільки дипломатичний тиск не спрацював, ми маємо вирішити, що робити далі."
 GER_operation_panzerfaust_events.05.t:0 "Німеччина розпочинає операцію «Маргарет»"
 GER_operation_panzerfaust_events.08.a:0 "Чудово"
 GER_operation_tannenbaum_desc:0 "Народ і політична система Швайцарії огидні та нікчемні. Настав час розквитатися зі смертельними ворогами нової Німеччини."
 GER_oppose_hitler_desc:0 "Правлінню Гітлера слід покласти край. Його ремілітаризація Райнланду — це спроба спровокувати держави Заходу, але вона дасть нам необхідний привід для повалення Гітлера за підтримки наших прихильників у Вермахті."
 GER_polish_membership:0 "Членство Польщі"
 GER_pool_technical_know_how_desc:0 "Кожна країна використовує свої методи управління промисловістю та технічного обслуговування обладнання. Ми можемо надіслати групи експертів для обміну досвідом між учасниками союзу."
 GER_prioritize_the_four_year_plan_desc:0 "Ми від початку знали, що чотирирічний план, який висуну[ROOT.GetLeader.GetVerbGendEndA_RU] [ROOT.GetLeader], буде необхідним кроком для підготовки нації до війни. Оскільки сам фюрер є дуже зайнятою людиною, потрібен буде хтось, хто контролюватиме та координуватиме необхідні заходи."
 GER_proletarian_revolution_cat:0 "Пролетарська революція"
 GER_propaganda_desc:0 "Ми вже бачили силу пропаганди й не можемо заперечити її ефективність. Виділивши ресурси на посилення підтримки наших славних лідерів, ми забезпечимо контроль над населенням."
 GER_rapid_army_expansion:0 "Швидке розширення армії"
 GER_realpolitik_cat_desc:0 "Вітри змін дмуть дедалі сильніше, і часто можуть миттєво змінити напрямок. Тому ми повинні зробити все можливе, щоб забезпечити майбутнє нашої Батьківщини, зрозуміти, хто нам партнер, а хто нам ворог. Доречна оцінка зможе допомогти нам у найскладніший для нас час."
 GER_recruit_african_schutztruppe_tt:0 "Мобілізувати одну дивізію §YAfrikanische Schutztruppe§! і одну дивізію §YAskari Schutztruppe§! в обраному регіоні\n"
 GER_reichskommissariat_balkan:0 "Райхскомісаріат Балкани"
 GER_reichskommissariat_ostland_effect_tt:0 "Усі необхідні області, окрім §Y[808.GetName]§!, перейдуть під контроль [RKO.GetNameDef]"
 GER_reichskommissariat_ural_rkt_effect_tt:0 "Кожна область у зоні інтересів Південного Уралу перейде під контроль [RKT.GetNameDef]"
 GER_request_the_return_of_qingdao:0 "Попросити повернення Ціндао"
 GER_revive_the_schutztruppe:0 "Відродити Schutztruppe"
 GER_root_not_proletarian_subject:0 "Як комуністична держава, ми отримали пропозицію про економічну солідарність і торговельну співпрацю з [FROM.GetAdjective] для підтримки робітничого класу."
 GER_second_ljubljana_award_tt:0 "Ця подія дозволить вимогти землі на користь держави [Root.GetName] або цінного союзника."
 GER_second_vienna_award_eq_trigger_tt:0 "Понад §Y60 000§! од. піхотного спорядження в армії"
 GER_see_to_the_eastern_front_ww:0 "Звернути увагу на Східний фронт"
 GER_send_military_support_democratic_shield_tt:0 "Відкриває рішення на §YНадсилання Військового Обладнання§! для §Yдемократичних§! країн, які перебувають у стані війни"
 GER_strat_bomber_equipment_1_short:0 "Do 19"
 GER_support_a_coup_in_liechtenstein:0 "Підтримати переворот у Ліхтенштайні"
 GER_tackle_the_communist_threat_desc:0 "Поки [SOV.GetNameDef] існує, для нас завжди залишатиметься загроза. Нам слід взяти ініціативу у свої руки, не чекаючи, поки вони зроблять перший крок."
 GER_the_end_to_fascist_europe_desc:0 "У Європі досі залишаються країни під фашистським правлінням. Ми добре знаємо, яку ціну платить населення за це, і мусимо забезпечити негайне їхнє визволення!"
 GER_the_german_stakhanovite_movement_desc:0 "Стаханівський рух зародився в [SOV.GetName] під час комуністичного правління, коли робітники почали пишатися тим, що працюють понад норму. Це значно підвищило продуктивність і надало робітникам відчуття мети. Нам слід заохотити подібний рух у [ROOT.GetNameDef]."
 GER_the_mannheim_project:0 "Проєкт «Мангайм»"
 GER_trade_deal_with_sweden_desc:0 "$GER_swedish_trade_agreement_desc$"
 GER_train_equipment_3:0 "Клас «BR57»"
 GER_train_schutztruppe_in_karas:0 "Мобілізувати Шуцтруппе в Карасі"
 GER_turkey_puppet:0 "Маріонеткова Туреччина"
 GER_uncertain_future_cat:0 "[GER.GetAdjective]а турбота про майбутнє"
 GER_unlock_seize_gold_reserves_tt:0 "Відкриває Рішення: §Y$GER_seize_gold_reserves_cat$§!, які можуть полегшити §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! після капітуляції іншої країни"
 GER_wunderwaffe_desc:0 "Гайзенберг і фон Браун прагнуть перевірити на практиці низку своїх ідей щодо створення зброї масового знищення. Усе, що їм потрібно, — це ресурси."
 GIE_REINSTATE_DISABLED_EXILE_VIEWING:0 "Держава $NAMEDEF|UH$ не може відновити наш уряд, оскільки ми оголосили про капітуляцію."
 GLC_communism_DEF:0 "Соціалістична держава Галісія"
 GOE_RAJ.22.a:0 "Ніяких компромісів"
 GOE_RAJ.27.a:0 "Ні, війна має тривати"
 GOE_RAJ.38.a:0 "Поки що будемо поводитися чемно."
 GOE_RAJ.45.a:0 "Революція рухається вперед."
 GOE_RAJ.51.t:0 "[PAK.GetName] зберігає контроль над [986.GetName]"
 GOE_RAJ.7.b:0 "У нас інші плани"
 GOE_RAJ_33_c_tt:0 "§RМи повинні витримати 255 днів, доки не буде запропоновано припинення вогню. Якщо ми окупуємо всі штати Західної, Східної, Центральної, Південної чи Північної Індії на момент припинення вогню, ми отримаємо більші територіальні поступки!§!"
 GOE_RAJ_famine.4.desc:0 "Індійські провінції та князівства почали запроваджувати міжпровінційні торговельні бар'єри через занепокоєння зростанням цін на продукти харчування. Ці торговельні бар'єри ризикують ще більше роздути ціни на продукти харчування, оскільки провінції стають дедалі більш ізольованими."
 GOE_RAJ_generals.4.a:0 ""
 GOE_RAJ_loyalist.06.d:0 "Давайте розширимо наші військово-морські операції."
 GOE_RAJ_loyalist.13.b:0 "Ми більше не потребуємо його послуг."
 GOE_RAJ_navy.6.desc:0 "Чиновники з [FROM.GetNameDefCap] відмовилися надіслати одного зі своїх командирів до [RAJ.GetNameDefCap] і наполягають, щоб ми навчали власних командирів."
 GOE_RAJ_navy.6.t:0 "[ENG.GetNameDefCap] відхилив пропозицію."
 GOE_RAJ_news.1.desc:0 "Оскільки напруга в [RAJ.GetNonIdeologyName] продовжує зростати, питання про те, як [?event_target:EIC_FORMER.GetNonIdeologyName] стабілізує регіон, було ключовим пунктом обговорення в їхньому парламенті. Сьогодні вранці [?event_target:EIC_FORMER.GetLeader] виступив з промовою, оголошуючи свій план [?event_target:EIC_FORMER.GetLeader.GetHerHis] щодо формування нової корпоративної держави в [429.GetName], щоб сприяти економічному зростанню як у [RAJ.GetNonIdeologyName], так і в [?event_target:EIC_FORMER.GetNonIdeologyName]. [?event_target:EIC_FORMER.GetLeader.GetSheHeCap] стверджує, що ця держава функціонуватиме незалежно від корони, але, тим не менш, буде економічно пов'язана з [?event_target:EIC_FORMER.GetNonIdeologyName] через оподаткування. [?event_target:EIC_FORMER.GetLeader.GetSheHeCap] описав це як «духовного наступника Ост-Індійської компанії 19-го століття».\n\n[?event_target:EIC_FORMER.GetLeader] сказав, що хоча це може призвести до тимчасової плутанини та підвищення нестабільності, це прокладе шлях для нової економічної безпеки та поступової стабілізації регіону."
 GOE_RAJ_partition.11.desc:0 "Протягом багатьох років [RAJ.GetNameDef] керували переважно люди від Корони, але зі зростанням вимог до самоврядування, вкрай необхідно, щоб ми створили новий Індійський парламент. Це дозволить місцевому керівництву відігравати роль у формуванні країни, забезпечуючи при цьому, що нація все ще пам'ятає про інтереси Імперії. З огляду на це, ми повинні прийняти рішення про те, хто має очолити цей новий уряд."
 GOE_RAJ_partition.2.t:0 "Широкомасштабні протести в [?unrest_target_state.GetName]"
 GOE_RAJ_partition_become_free_to_stop_the_chaos_tt:0 "Ми можемо очікувати, що нестабільність триватиме, доки ми не здобудемо незалежність"
 GOT_GER_amerikabomber.01.t:0 "Проєкт Амерікабомбера"
 GOT_guarantee_events.01.b:0 "Нехай [GER.GetLeader] робить те, що [GER.GetLeader.GetSheHe] хоче."
 GRAND_DOCTRINE_TITLE:0 "§HГлобальна доктрина§!: $NAME|H$"
 GRE_ally_tito:0 "Укласти союз із Тіто"
 GRE_ally_tito_desc:0 "Немає революціонера, більш відданого до нашої справи антисталіністського марксизму, ніж югослав Йосіп Броз Тіто. Нехай він нам і не до вподоби, але нам потрібні він і його співвітчизники, щоб об'єднатися під прапором братньої солідарності для боротьби з кровожерливими фашистами та підступними більшовиками."
 GRE_anti_soviet_stratagems:0 "$GRE_anti_german_stratagems$"
 GRE_attack_the_fascists_desc:0 "Фашизм — це вірус. Він передавався в Європі від країни до країни, мов чума. Комунізм же — ліки, і ми змусимо прийняти його силою!"
 GRE_clear_the_slums:0 "Розчистити нетрі"
 GRE_clear_the_slums_desc:0 "Грецькі біженці ухиляються від заклику і займають цінне місце, селячись у брудних нетрях, які вони самі й зводять. Існування нетрів ганьбить країну, як і їхні жителі, які нехтують своїм обов'язком перед нацією. Ми розчистимо ці будівлі та знайдемо землі та людям найкраще застосування."
 GRE_connecting_our_prefectures:0 "Сполучення наших префектур"
 GRE_crush_republicans:0 "Придушити £faction_gre_venezelist республіканців"
 GRE_debt_paid_1607:0 "§G16.7%§!"
 GRE_debt_paid_25:0 "§G25%§!"
 GRE_debt_payment_impossible_tt:0 "Комуністичні та фашистські уряди будуть неохочі сплачувати свої борги.\n"
 GRE_dem_monarchy_fascism_ADJ:0 "Грецьк"
 GRE_france_rebuffed:0 "§YФранцузькі§! інвестиції не прийняті"
 GRE_go_to_paris_to_negotiate_investment_talks_desc:0 "Аудієнція з потрібними людьми в Парижі, де ми зможемо продемонструвати тобширний потенціал нашого народу та виробничого сектору, може піти на користь нашої нації."
 GRE_heavy_tank_equipment_3:0 "PKD Perséfs I"
 GRE_increase_our_mining_operations:0 "Збільшити обсяг видобутку корисних копалин"
 GRE_megali_idea_option_tt:0 "Якщо пропозиція буде прийнята, то, коли §Y[TUR.GetNameDefCap]§! капітулює, §Y[GRE.GetNameDefCap]§! анексує §YСтамбул§! та інші §Y[TUR.GetAdjective]§! берегам §YЕгейського моря§!. §RЯкщо Греція відмовиться від Великої ідеї, то всі раніше прийняті пропозиції будуть анульовані!§!"
 GRE_open_foreign_subsidized_factories:0 "Відкрити субсидовані з-за кордону заводи"
 GRE_open_foreign_subsidized_factories_tt:0 "Буде додано один §Yвійськовий§! і один §Yцивільний заводи§! за кожну з ось цих країн, чия §Yдумка§! про §YГрецію§! вища ніж §G80§!: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§! та §Y[SOV.GetNameDef]§!."
 GRE_recruit_monarchist_general:0 "Найняти £faction_gre_monarchist генерала-монархіста"
 GRE_recruit_the_fascists:0 "Завербувати фашистів"
 GRE_request_communist_support_focus_tt:0 "Стануть доступними генерали й міністри-§Yкомуністи§!. \n§YКомуністи§! стануть дружніми§!. \nГенерали й міністри-§Yмонархісти§! підуть §Rу відставку§!. \n§YМонархісти§! стануть §Rворожими§!!"
 GRE_restructure_debt_tt:0 "Усі поточні §Yборги§! перед §YМФК§! будуть скорочені наполовину."
 GRE_small_payment_to_british_debt_effect_tt:0 "Це рішення на чверть зменшить наш поточний §Yборг§! перед державою §Y[ENG.GetName]§! після кожного його виконання.\n"
 GRE_small_payment_to_french_debt_effect_tt:0 "Це рішення на чверть зменшить наш поточний §Yборг§! перед державою §Y[FRA.GetName]§! після кожного його виконання.\n"
 GRE_stalinist_communism_ADJ:0 "Грецьк"
 GRE_the_hellenic_spirit:0 "Еллінський дух"
 GRE_the_modern_movement_desc:0 "Фашизм — ідеологія ХХ століття, це відповідь на недоліки дикого капіталізму і спотворення ідей комунізму. Фашизм — призовний клич покоління, що втомився від іноземних утисків! Покоління, яке більше не бажає соромитися за свою країну! Покоління, яке готове вивести Грецію в нову епоху, зробивши її великою державою, і готове відповісти на будь-яку загрозу, будь-яку образу! Аера!"
 GSM_democratic_DEF:0 "Ганьсуська республіка Хуей"
 GUAY_defense_force_desc:0 "Для захисту наших громадян нам потрібно сформувати сили оборони, щоб запобігти будь-якій потенційній агресії з боку наших сусідів."
 GUAY_demand_a_seat_at_the_high_table_desc:0 "Нас все ще вважають не більш ніж другорядним союзником великих держав, незважаючи на наш внесок. Ми будемо вимагати, щоб ми сіли за той самий стіл, що й інші, та стали керуючими півдня у цьому новому світовому порядку."
 GUAY_develop_new_territories:0 "Розвивати нові території"
 GUAY_free_seconday_schools_desc:0 "Освіта — це наріжний камінь добре функціонуючої економіки. Ми інвестуємо в це заради майбутніх поколінь."
 GUAY_meet_with_ENG:0 "Зустрітися з державою [ENG.GetNameDef]"
 GUAY_rekindle_old_gripes_BRA_URG_tt:0 "Якщо ми контролюватимемо §Y[502.GetName]§! протягом §Y365 днів§! з моменту початку війни, [BRA.GetNameDef] доведеться укласти білий мир або зіткнутися з катастрофічною втратою морального духу."
