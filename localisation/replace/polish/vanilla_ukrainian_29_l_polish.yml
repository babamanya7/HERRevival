 sp_land_generic_reward_major_progress_2:0 "Критичне випробування дало успіх"
 sp_land_generic_reward_option_army_xp_desc:0 "[Character.GetName] проводить зустріч із групою військових офіцерів для обговорення потенціалу проєкту «[SpecialProject.GetName]», отримуючи важливі відомості щодо використання нової технології в сухопутній війні. Ця співпраця посилила наші військові можливості, гарантуючи готовність до майбутніх боїв."
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "[Character.GetName] робить важливий прорив у технології метальних зарядів, значно підвищуючи швидкість і потужність снарядів проєкту «[SpecialProject.GetName]». Це досягнення відкриває нові можливості для підвищення ефективності зброї на полі бою та прискорює завершення проєкту."
