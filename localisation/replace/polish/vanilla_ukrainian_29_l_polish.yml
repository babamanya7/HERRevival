 ENG_neutrality_subject:0 "$OVERLORDADJ$а Британія"
 ENG_nuclear_missile_equipment_1:0 "Blue Streak IRBM"
 ENG_pre_empt_spanish_alignment_desc:0 "Існує ризик, що іспанці стануть на бік німців, якщо ми зробимо якісь наступальні дії по відношенню до останніх. Цього не можна допустити — ми мусимо розквитатися з цією можливою загрозою, перш ніж перейдемо до власне держави [GER.GetName]."
 ENG_propaganda_campaigns_in_canada:0 "Кампанії пропаганди в Канаді"
 ENG_raise_the_home_guard_in_state:0 "Зібрати місцеву самооборону в області [FROM.GetName]"
 ENG_renew_support_for_imperialist_coup_in_canada:0 "Підсилити підтримку повстання в Канаді"
 ENG_replace_government_in_australia_fascism_desc:0 "Народ Австралії готовий змінити уряд на... більш прихильне до нашого фашистського правління."
 ENG_replace_government_in_british_raj_communism_desc:0 "Народ Індії готовий змінити уряд на... більш прихильне до нашого комуністичного правління."
 ENG_self_government_for_asia_desc:0 "Країни Азії готові отримати широку автономію в рамках підготовки до повної незалежності. Це, ймовірно, призведе до припливу іммігрантів, які бажають отримати британське громадянство до того, як незалежність буде офіційно оформлена."
 ENG_trade_unions_demand_legislation_amendment_desc:0 "Щоб виконати вимоги профспілок, ми відобразимо їхні побажання у законопроєктах, доклавши додаткові політичні зусилля."
