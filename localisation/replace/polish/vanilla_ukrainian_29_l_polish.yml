 china.10.a:0 "Це не допоможе їм у подальшій перспективі."
 china.103.t:0 "Китай об'єднується"
 china.202.d:0 "Зростаюча підтримка комуністів у області [CHI_communist_state.GetName] досягла переломного моменту. Державні установи були захоплені, і повстанці оголосили, що вони більше не вважають себе частиною держави [Root.GetName]. Ми фактично втратили весь контроль над областю [CHI_communist_state.GetName] на користь комуністичного режиму."
 china_struggle_icon_value:0 "[?Root.total_political_support_points|0H]"
 combat_unit_destruction_desc:0 "Навчивши наших пілотів штурмовиків безперервно атакувати одну і ту ж мету, поки вона не буде знищена, ми зможемо гарантувати, що ціль накриють після близького промаху."
 comintern_snowpatrol:0 "Сніговий патруль"
