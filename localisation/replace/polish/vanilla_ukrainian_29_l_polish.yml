 BUL_ff_percentage_ally_at_war_with_sov:0 "\nСоюзник у стані війни з державою [SOV.GetFlag][SOV.GetName]: §Y25%§!"
 BUL_infantry_equipment_3:0 "Schmeisser MP41"
