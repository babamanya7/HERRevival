 south_american_events.62.desc:0 "Близько 06:18 військові кораблі Крігсмаріне та Королівського флоту вступили в бій біля Монтевідео. Повідомляється, що німецькі кораблі сильно пошкоджені та знайшли притулок у порту столиці Уругваю. Британські дипломати тиснуть на уряд Уругваю, щоб змусити корабель вийти з порту відповідно до Гаазької конвенції, де він, безсумнівно, буде знищений силами Королівського флоту, що очікують."
 south_american_news.1.a:0 "Що стане з Південною Америкою?"
 south_american_news.4.d:0 "Габріель Терра, президент Уругваю, оголосив минулого тижня про проведення виборів і відхід від влади — влади, яку він продовжив шляхом державного перевороту в 1933 році. Однак він не очікував масової підтримки комуністичної партії, що призвело до перевороту проти новосформованого уряду, призначеного його наступником Альфредо Бальдоміром Феррарі."
 south_american_news.50.c:0 "Наші товариші будуть відомщені!"
 south_american_news.9.b:0 "Сподіваємося, ми востаннє бачимо цих заколотників..."
 southern_expansion_focus_tt:0 "Підпише §Yпакт про ненапад§! із §YРадянським Союзом§! при виборі.\n"
 soviet.1.a:0 "Ми відштовхнемо їх. Жорстко."
 soviet.30.b:0 "No, we'll pay the iron price!"
 soviet.34.d:0 "Литва не зможе опиратися силі Червоної армії. Якщо ми надішлемо їм вимогу прав на стоянку та контролю над прикордонними військами, ми зможемо по суті анексувати їх без війни."
 soviet.36.d:0 "Нещодавні політичні потрясіння в державі [From.GetName] залишили їхній уряд із сильним баченням майбутнього, яке збігається з нашими власними планами. Вони шукають нашого захисту і пропонують свою безумовну підтримку. Офіційно вони залишаться самостійною нацією, але в кожному своєму кроці будуть слідувати за Вітчизною."
 soviet.74.b:0 "Ми не приймаємо пожертви."
