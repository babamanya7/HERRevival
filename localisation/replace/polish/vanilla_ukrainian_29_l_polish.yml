 FIN_bop_modifier_finnish_sovereignty_threatened:0 "Суверенітет Фінляндії під загрозою"
 FIN_bring_foreign_armor_experts_desc:0 "Танки є важливим компонентом будь-якої сучасної армії, але наш досвід роботи з ними обмежений. Можливо, ми могли б розширити наші можливості за допомогою них, запросивши іноземних експертів у цій галузі для допомоги."
 FIN_children_destination_norway:0 "державу [NOR.GetNameDef]"
