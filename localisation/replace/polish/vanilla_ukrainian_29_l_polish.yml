 AIR_WING_XP_TRAINING_DAILY_PROGRESS:0 "Щоденний прогрес до наступного рівня досвіду від §Yповітряних тренувань§!: $EXP|Y%1$"
 AIR_XP_TITLE:0 "§HЩоденний приріст досвіду авіації від офіцерів§!"
 AI_MESSAGE_CAT1_MES1:0 "Great job getting annexed there, $OTHER$. We're all proud of you."
 AI_MESSAGE_CAT2_MES10:0 "Hit surrender already, $COUNTRY$! You're really just wasting my time here."
 AI_MESSAGE_CAT2_MES5:0 "Make sure to keep those $OTHER_ADJ$ factories nice and polished, I'll be using them soon!"
 AI_MESSAGE_CAT3_MES2:0 "This game is so unbalanced! $OTHER_ADJ$ space marines are impossible to beat while $US_ADJ$ troops are just wet paper."
 ALG_neutrality:0 "Алжир"
 ALL_FACTION_MEMBERS_WITH_25_SUBMARINES:0 "§YКожен член альянсу§!, що має щонайменше 25 §Yпідводних човнів§!"
 ANU:0 "Айну"
 ARA_UNIFIED_fascism_DEF:0 "Аравійська імперія"
 ARG_anti_corruption_policies:0 "Антикорупційна політика"
 ARG_argentine_island_sovereignty_desc:0 "Надто довго південноатлантичні острови утримувалися Британією, незважаючи на те, що вони явно перебували у сфері впливу [ARG.GetNameDef]. Ми повинні повстати та вимагати те, що належить нам по праву, навіть якщо це означає оголошення війни [ENG.GetNameDef]. Ці острови будуть [ARG.GetAdjective] будь-якою ціною!"
 ARG_british_cooperation_desc:0 "Тісніша співпраця з [ENG.GetName] допоможе підвищити нашу економіку, особливо з огляду на те, який вплив вони мали під час останніх виборів. Покращення наших стосунків з [ENG.GetAdjective] означатиме кращі торговельні угоди в майбутньому."
 ARG_encourage_italian_argentine_diplomacy_desc:0 "[ITA.GetAdjective] фашизм став стандартною моделлю, за якою основна націоналістична партія [ARG.GetNameDef] моделювала свою політику. Ми повинні надіслати посланця до міста [ITA.capital.GetCapitalVictoryPointName] і відкрити новий канал дипломатії між нашими країнами. Це була б чудова можливість налагодити наукову угоду, щоб обидві наші нації могли отримати вигоду від швидкого технологічного прогресу."
 ARG_hispano_argentina_organization:0 "Hispano — Argentina"
 ARG_industrial_expansion:0 "Промислова експансія"
 ARG_infantry_equipment_0_short:0 "Mauser M91"
 ARG_italy_loan_repaid_flag:0 "[ITA.GetAdjective]у позику сплачено"
 ARG_join_the_allies_desc:0 "Настав час нам обрати сторону в цьому конфлікті. Як нація, що працює над захистом недоторканності демократії, вкрай важливо, щоб ми звернулися до Союзників та забезпечили своє місце у фракції. Ми повинні допомогти захистити світ від тих, хто прагне його підкорити."
 ARG_medium_tank_equipment_2_short:0 "Nahuel"
 ARG_our_own_path_desc:0 "Протягом останніх кількох років нам вдалося зосередитися на собі, залишаючись поза більшим глобальним конфліктом, який спустошує інші країни. [ARG.GetName] стоїть на своїх власних ногах, і ми самі вирішуватимемо, куди нас приведе наш шлях. Чи будемо ми продовжувати процвітати та зростати економічно, чи прагнемо поставити власні експансіоністські цілі, ще належить побачити."
 ARG_political_events.13.t:0 "[GER.GetNameDefCap] прийняла нашу заявку!"
 ARG_political_events.15.desc:0 "За словами [ARG.GetAdjective] посла в [ROOT.Capital.GetCapitalVictoryPointName], наш нинішній уряд має зректися влади та бути заміненим на [ARG.GetAdjective] маріонетку. Існує висока ймовірність, що наша відмова призведе до оголошення війни. Ми повинні обирати мудро."
 ARG_political_events.2.a:0 "У нас майже немає вибору."
 ARG_political_events.35.b:0 "Ми понесемо цю війну до [ENG.Capital.GetCapitalVictoryPointName]!"
 ARG_political_events.6.a:0 "Чудово!"
 ARG_reinforced_alliance.tt:0 "([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) отримує подію «§Y$ARG_political_events.73.t$§!», яка запропонує §Yпакт про ненапад§! та §Yгарантію незалежності§! між нашими двома країнами. Вони, ймовірно, погодяться, якщо мають §YВисоку думку про нас§!."
 ARG_ship_torpedo_sub_2:0 "6x 533-мм торпедний апарат"
