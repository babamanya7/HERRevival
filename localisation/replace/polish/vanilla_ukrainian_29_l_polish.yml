 RULE_ALLOW_PARATROOPERS_BLOCKED_TOOLTIP:0 "Правило гри: §RДержави не можуть використовувати десантування при жодних умовах.§!"
 RULE_ALLOW_RELEASE_NATIONS_BLOCKED_DESC:0 "Держави не можуть давати незалежність іншим державам."
 RULE_FASCIST_LIT_AI_DESC:0 "§HЛитовський§! ШІ намагатиметься встановити фашистський уряд, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_GROUP_GENERAL_UI:0 "Інтерфейс"
 RULE_HISTORICAL_LIT_AI_DESC:0 "§HЛитовський§! ШІ більшу частину кампанії лишиться нейтральним, але країна стане радянською маріонеткою в 1940-х."
 RULE_NON_GIE_CALL:0 "§RМи не можемо закликати союзників, перебуваючи у війні лише з крахноб у вигнанні.§!"
 RULE_OPTION_COMMUNIST_INDEPENDENT:0 "Союз європейських соціалістичних республік"
 RULE_OPTION_COMMUNIST_PAR_AI_DESC:0 "ШІ збереже комуністичний уряд Рафаеля Франко та намагатиметься помститися Болівії за Чакську війну."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC:0 "§HНідерландський§! ШІ намагатиметься приєднатися до Союзників у разі вторгнення, але не перемістить свій уряд в Ост-Індію, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DEN_MONARCHIST_AI_DESC:0 "Король Крістіан X намагатиметься забезпечити природні ресурси та посилити військовий потенціал Данії, контролюючи решту країн Північної Європи всіма необхідними засобами."
 RULE_OPTION_FIN_COMMUNIST_PLAN_DESC:0 "Звернувшись за допомогою до Радянського Союзу, комуністи організують фінський лівий рух, об'єднавши соціалістів, соціал-демократів та інші ліві сили, щоби здійснити державний переворот і привести країну до нової революції проти капіталістичних і фашистських загроз за рубежем."
 RULE_OPTION_GERMANY_FRAGMENTED_DESC:0 "Німеччина почне гру роздроблена на різні дрібніші держави."
 RULE_OPTION_HUN_ARROW_CROSS_MOVEMENT:0 "Рух «Стрілохрест»"
