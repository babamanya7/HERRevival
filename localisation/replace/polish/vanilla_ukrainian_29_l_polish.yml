 ---_democratic:0 "будь-яка демократична країна"
 191_autenticite_name:0 "Лубумбаші"
 600_jiangxi_points:0 "([?600.state_political_support_value|+0]) "
 605_sichuan_points:0 "([?605.state_political_support_value|+0]) "
 AAT_Sweden.15.a_tt:0 "§YЯкщо [FROM.GetNameDef] відмовиться, це дасть ціль війни проти держави.§!"
 AAT_Sweden.31.a_tt:0 "§RЦе може зрештою призвести до того, що [FROM.GetName] зможе зробити нас маріонеткою.§!"
 AAT_Sweden.4.t:0 "Політик називає опонента «до ганебного невмілим»"
 AAT_Sweden.43.t:0 "[FROM.GetName] вимагає демілітаризацію області [148.GetName]"
 AAT_Sweden_communism.2.a:0 "Глибока стурбованість"
 AAT_Sweden_communism.7.c:0 "Взагалі-то, сталінізм не такий вже й поганий"
 AAT_Sweden_flashpoints.18.desc:0 "Наші свідомо провокаційні поставки зброї державі [FIN.GetName] привернули увагу [SOV.GetAdjective]ої влади. Дипломати з Москви повідомили нам, що [SOV.GetLeader] розглядає наші дії як приєднання до конфлікту проти держави [SOV.GetNameDef] і що проти нас будуть вжиті всі необхідні заходи."
 AAT_Sweden_flashpoints.19.desc:0 "[SWE.GetAdjectiveCap]і дипломати чітко дали зрозуміти, що не мають наміру припиняти поставки зброї, доки ми не визнаємо свою причетність до бомбардування Паяли і не виплатимо репарації. Якщо ми не відреагуємо на наші погрози, інші держави в регіоні можуть розглядати нас як легку мішень для власних агресивних дій. Однак, втягування кількох країн у нашу [FIN.GetAdjective]у військову операцію може призвести до ескалації конфлікту до глобальних масштабів."
 AAT_Sweden_flashpoints.21.b:0 "[SOV.GetLeader] буде переможений і без [FIN.GetAdjective]ої підтримки."
 AAT_Sweden_flashpoints.22.t:0 "[FIN.GetName] відхиляє пропозицію альянсу"
 AAT_Sweden_flashpoints.39.a:0 "Чудово. Ми не станемо надалі їх турбувати."
 AAT_Sweden_flashpoints.42.a:0 "Ми не маємо сил, щоби боротися з державою [GER.GetName]."
 AAT_Sweden_flashpoints.43.t:0 "[SWE.GetName] дає прохід військ"
 AAT_Sweden_flashpoints.64.t:0 "[FROM.GetNameDefCap] відкидає ультиматум"
 AAT_Sweden_flashpoints.80.desc:0 "Посилаючись на свою нестабільну ситуацію, вони віддають перевагу нашому контролю над островами перед ворожою тиранією. Місцева шведська більшість сприйняла це добре, а їхнє життя триватиме у звичному режимі."
 AAT_Sweden_nationalists.14.t:0 "Підтримка армії"
 AAT_Sweden_nationalists.18.t:0 "Успішний королівський візит до[FROM.FROM.GetName]"
 AAT_Sweden_nationalists.8.desc:0 "Представники аристократії вже давно незадоволені тим, що їхні впливи на політику держави обмежуються на користь обраних чиновників. Тому багато хто з них погодився використати залишки своїх ресурсів для підтримки нашого націоналістичного руху. Натомість вони очікують певних політичних поступок, коли рух здобуде контроль над Ріксдагом."
 AAT_USA_events.03.t:0 "[FROM.GetName] хоче повернути Фарерські острови"
 AAT_finland_continuation_war.01.desc:0 "Керівна верхівка держави [FROM.GetName] звернулася до нас із питаннями військового співробітництва та спільного захисту від [SOV.GetAdjective]ої загрози на сході. Вона пропонує нам право на розміщення нашої армії на території держави [FROM.GetName] за умови взаємного захисту кордонів і спільних вилазок на [SOV.GetAdjective]і землі."
 AAT_finland_diplomacy.06.t:0 "[FROM.GetAdjective]а поступка саамських територій"
 AAT_finland_diplomacy.07.desc:0 "Імперіалісти з держави [From.GetNameDef] відкинули нашу освічену петицію про об'єднання земель саамського народу. У своїй офіційній відповіді вони висловлюють сумніви в нашій готовності підтримувати культуру і добробут місцевого населення, але ми ж розуміємо: справжня причина відмови в тому, що ця держава хоче виглядати більшою на карті."
 AAT_finland_diplomacy.11.t:0 "[FROM.GetAdjective]а пропозиція інтеграції Коли і Карелії"
 AAT_finland_diplomacy.20.a:0 "Шкоди від цього точно не буде"
 AAT_finland_diplomacy.26.t:0 "[FROM.GetName] шукає [ROOT.GetAdjective]ого захисту"
 AAT_finland_misc_events.04.c:0 "Перенаправити сировину в області [926.GetName]."
 AAT_finland_misc_events.07.a:0 "Чудова пропозиція!"
 AAT_finland_national_defense.03.b:0 "У нас є важливіші справи."
 AAT_finland_political.01.desc:0 "Сьогодні стало відомо, що [Root.GetLeader] не набере достатньо голосів, щоб подолати вотум недовіри в едускунті, [ROOT.GetAdjective]ому парламенті.\n\nНе дивлячись на перебування на посаді президента з 1931 року та чималі заслуги, [ROOT.GetLeader.GetHerHis] становище значно похитнулося після відмови допустити до уряду соціал-демократів всупереч власним обіцянкам. Ця політична помилка розвинулася до політичної кризи, від якої [ROOT.GetLeader.GetSheHe] зараз і потерпає."
 AAT_finland_the_white_death.1.desc:0 "Надійшли повідомлення, що наші снайпери дуже ефективно показали себе в боях із ворогом у лісі. Це дуже добре для військової пропаганди — серед ворожих солдатів уже пішли розмови про Білу Смерть, образ небезпечної для них фінської природи та її людей. Таке прізвисько можна буде дати якомусь особливо видатному воїну, якщо такий з'явиться."
 AAT_finland_the_white_death.1.t:0 "Наші снайпери дуже ефективні"
 AAT_nordic_cooperation.9.a:0 "Це спантеличує."
 AAT_norway.10.a:0 "Наскільки швидким буде наше падіння?"
 AAT_norway.16.a:0 "Ми повернемося!"
 AAT_norway.19.t:0 "Держава [FROM.GetName] відхилила наші вимоги!"
 AAT_norway.5.a:0 "Його треба було зупинити."
 AAT_norway_fascist.1.desc:0 "[FROM.GetAdjectiveCap]а коаліція націоналістів і фашистів, які підтримують нашу справу, пропонує свою допомогу в завоюванні держави [NOR.GetName]. Вони заклали основу для захоплення уряду та управління [FROM.GetAdjective]ими територіями від нашого імені.\n\nЯкщо це правда, то можливість може бути надто гарною, щоб її втратити, але ми повинні переконатися, що ми готові до удару."
 AAT_norway_rikstanken.2.t:0 "Наш підхід до [NOR.GetAdjective]ої бронетанкової програми"
 ABDA_events.2.desc:0 "[FROM.GetNameDef] прийняла наше запрошення приєднатися до Верховного командування ABDACOM. Їхні сили відтепер діятимуть під спільним командуванням, що зміцнить наші позиції на Тихоокеанському театрі."
 ABK_fascism_DEF:0 "Православна абхазька держава"
