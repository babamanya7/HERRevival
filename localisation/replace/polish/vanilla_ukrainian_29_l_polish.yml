 COG_african_research_and_development_department:0 "Африканський відділ наукових досліджень і розвитку"
 COG_anti_colonialism_decision:0 "Анти[FROM.GetAdjective]а пропаганда"
 COG_bakongo_military_might:0 "Військова потужність баконго"
 COG_belgian_congo_DEF:0 "[BEL.GetAdjectiveCap]е Конго"
 COG_clan_abanyiginya_party_long:0 "Клан Абаньїгінья з Руанди"
 COG_communism_DEF:0 "Демократична республіка Конго"
 COG_expand_banana_plantations_desc:0 "Банани є життєво важливими для будь-якої здорової економіки. Ми повинні прагнути в десять разів збільшити виробництво бананів, щоб наш народ та економіка могли бути задоволені."
 COG_fonderie_royale_de_canons_leopoldville_organization:0 "Fonderie Royale de Canons Léopoldville"
 COG_guerilla_tactics_drills:0 "Навчання партизанським тактикам"
 COG_kingdom_of_burundi_neutrality_DEF:0 "Королівство Бурунді"
 COG_liberation_by_force:0 "Звільнення силою"
 COG_ma_loango_party:0 "Клан Конді"
 COG_marine_nationale_desc:0 "Хоча раніше ми не дуже інвестували в цей напрямок, морські сили є необхідністю для більшості сучасних націй. Єдине питання — чи хочемо ми створити їх для виходу в Атлантичний океан, чи для роботи на численних річках басейну Конго."
