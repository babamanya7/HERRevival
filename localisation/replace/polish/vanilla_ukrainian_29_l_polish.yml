 TUR_annul_the_ankara_anlasmasi_desc:0 "У 1926 році питання Мосулу, здавалося, було вирішено, але, як і в більшості криз тих часів, вигоду отримали виключно [ENG.GetAdjective] і [FRA.GetAdjective] держави. Ми більше не можемо вдавати, що [IRQ.GetAdjective] туркам непогано живеться. Настав час діяти."
 TUR_applying_british_oil_embargoes_on_iraq_desc:0 "[ENG.GetAdjectiveCap]і дипломати не хочуть пускати постачання [IRQ.GetAdjective] нафти до своїх континентальних ворогів, але це їм здебільшого не вдається. Ми можемо підтримати [ENG.GetAdjective] ініціативу, блокувавши один із найбільших наземних маршрутів, через який проходять [IRQ.GetAdjective] поїзди, що постачають товар до Європи."
 TUR_ataturk_health_terminal:0 "§RНевиліковне§!"
 TUR_combined_operational_strategies:0 "Стратегії сумісних операцій"
 TUR_commence_an_overhaul_of_our_training_methods_desc:0 "Наші методи навчання та інструктажу неефективні. Наші ветерани навчалися на особистому досвіді, а ось новобранцям доводиться туго."
 TUR_construct_the_cakmak_line:0 "Збудувати лінію Чакмака"
 TUR_continue_the_sumerbank_industrialization_scheme_2_tt:0 "Якщо ідея §Y$TUR_first_five_year_plan$§! §RНЕ§! діє:"
 TUR_cooperative_research_centers_desc:0 "Цю війну виграє найтехнологічніша держава. Фашизм — справа майбутнього, і з новітніми технологіями наша перемога буде невідворотною."
 TUR_counter_influence_of_fundamentalists_in_state:0 "£faction_tur_kemalist Розпочати операцію проти фундаменталістів"
 TUR_fortifying_the_bosporus_desc:0 "Босфор — це брама між Чорним і Середземним морями. Суецький канал та входи до Гібралтарської протоки добре захищені. Чи має сенс залишати нашу протоку без захисту від намірів інших держав? Звичайно, ні. Ми маємо всіма силами оберігати те, що наше по праву."
 TUR_fortifying_the_bosporus_istanbul_tt:0 "Додати §Y3 наземні укріплення§! в межах міста.\n"
 TUR_hold_a_march_in_state_desc:0 "Марш наших непохитних послідовників крізь землі повстанців спричинить трепет усіх, хто завзято чіпляється за релігійне минуле країни."
 TUR_infantry_equipment_2_short:0 "Sten Mk II"
