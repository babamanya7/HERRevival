 INDUSTRIAL_ORG_POLICY_COOLDOWN:0 "Ви не зможете змінювати політику ВПО протягом $VALUE|H$ дн."
 INDUSTRIAL_ORG_POLICY_POPUP_COST_DESC:0 "Це коштуватиме £GFX_pol_power_icon $VALUE|H$"
 INDUSTRIAL_ORG_UNLOCK_TRAIT_POPUP_UPGRADE_VARIANTS_TOOLTIP_DELAYED:0 "Оснащення, створене старішою версією §Yвійськово-промисловою організацією§! треба поліпшити, щоби застосувати останні §Yриси дизайнерської команди§!."
 INSHOL_australian_divisions_desc:0 "Відповідно до Лондонсько-Батавійської угоди, Британія зобов'язана надіслати додаткові дивізії до Ост-Індії через Австралію після нашого запиту, оскільки близькість Австралії до Ост-Індії робить їх ідеальними кандидатами для розміщення військової бази за межами самої Ост-Індії."
 INSHOL_east_indies_investments_desc:0 "Хороший сюзерен — це той, хто інвестує в розвиток своїх колоній. Інвестиції в економічний розвиток Ост-Індії відповідають нашим інтересам і корисні для громадян колонії."
 INSHOL_eventual_autonomy:0 "Погодитись на майбутню автономію"
 INSHOL_franco_dutch_accord_desc:0 "Незважаючи на те, що наші солдати краще екіпіровані та організовані, ніж республіканські ополчення, їхня переважна чисельність повернула конфлікт проти нас. Для забезпечення перемоги нам потрібна підтримка ззовні, більша, ніж більшість готова дати. Франція може погодитися втрутитися, якщо ми запропонуємо їй територію в Ост-Індії для розширення їхньої присутності в Тихому океані."
 INSHOL_increase_rubber_taxes_desc:0 "Багато каучукових компаній в Ост-Індії отримують величезні багатства, використовуючи ресурси колонії. Буде справедливо, якщо ми накладемо значний податок на ці операції."
 INSHOL_industrialized_colony_desc:0 "Ост-Індія, колись скромна колонія, стала одним із найіндустріалізованіших, найбагатших регіонів у всій Азії. Це знаменує собою монументальний момент в історії Нідерландів та людства. Наші зусилля окупилися, і ми продовжуватимемо інвестувати в розвиток нашої колонії та знову відновимо Нідерланди як світову державу."
 INSHOL_nationalize_dutch_companies_desc:0 "Великі торгові доми, судноплавні лінії, плантаційні концерни та банки носили голландські імена стільки, скільки хтось може пам'ятати. Відтепер вони носитимуть індонезійські. Ради директорів будуть перепризначені, вивіски зняті, а капітал, який вилучався з цих островів протягом трьох століть, нарешті належатиме самим островам."
 INSHOL_reasserting_control:0 "Відновлення контролю над Ост-Індією"
 INSHOL_request_british_support_desc:0 "[ENG.GetNameDefCap], як ще одна колоніальна держава, швидше за все, з розумінням поставиться до нашої ситуації, особливо зважаючи на те, що якщо революціонери досягнуть успіху, це може викликати ефект доміно у східній Азії. Ми повинні попросити їх про економічну та військову допомогу."
 INS_CAS_equipment_4_short:0 "Vampire"
 INS_artillery_equipment_1:0 "M23 Vickers"
 INS_bauxite_export:0 "Подвоїти експорт бокситів"
 INS_bio_pharma_name_normal:0 "Landskoepok–Pasteur"
 INS_chaos_events.2.b:0 "Немає часу на політику, оголосіть воєнний стан!"
 INS_closer_economic_ties_to_netherlands:0 "Тісніші економічні зв'язки з Нідерландами"
 INS_communist_events.1.b:0 "Подальший опір лише принесе загибель нашому народу."
 INS_cost_text_oil_12:0 "£resources_strip|1 §Y12§!"
 INS_cost_text_oil_4:0 "£resources_strip|1 §Y4§!"
 INS_dominion_of_atjeh_desc:0 "Сепаратистський рух в Ачеху є значним і зростає. Немає причин для ескалації ситуації, замість цього ми повинні домовитися про компроміс, згідно з яким вони залишаться частиною Індонезії, маючи при цьому значну автономію."
 INS_dutch_events.2.desc:0 "[HOL.GetNameDefCap] прийняли нашу пропозицію дозволити нам взяти на себе командування об'єднаними військово-морськими силами. Перехід відбувається гладко, і офіцери як [HOL.GetAdjective], так і [INS.GetAdjective] працюють пліч-о-пліч, щоб зміцнити наші позиції в Тихому океані."
 INS_electrical_investments_desc:0 "Кожна європейська індустріальна нація має потужну електричну мережу для підтримки своєї промисловості. Якщо ми хочемо припинити покладатися на експорт матеріалів і створити власну обробну промисловість, як вони, ми повинні побудувати високопотужну електричну мережу, яка простягнеться по всій території Яви."
 INS_evacuate_soldiers_to_australia:0 "Евакуація солдатів до Австралії"
 INS_expand_batavia_med_school:0 "Розширення Медичної школи Батавії"
 INS_governor_general_de_jonge:0 "Генерал-губернатор де Йонге"
 INS_heavy_tank_equipment_1_short:0 "ZT-I"
 INS_industrial_events.4.c:0 "Нам слід шукати ресурси, виробництва яких нам не вистачає"
 INS_industrial_events.5.a:0 "Нам слід спробувати зміцнити гульден, а не замінювати його."
 INS_industrial_events.6.t:0 "Більш вигідна угода"
 INS_is_union_tt_NOT:0 "Не створено Нідерландсько-Індонезійську унію"
 INS_just_a_fisherman:0 "Проста рибалка"
 INS_limited_war_events.7.a:0 "Краще поганий мир, ніж гірша війна."
 INS_local_cooperatives_desc:0 "Ми не повинні створювати капіталістичну систему, як на заході, але ми не повинні ігнорувати економічні вигоди, які забезпечує приватизація. Ми дозволимо створення місцевих кооперативів, успіх яких принесе багатство їхнім власникам. Однак вони контролюватимуться урядом і їм буде заборонено розширюватися за межі свого регіону."
 INS_loyalist_events.2.a:0 "Це буде дуже корисно."
 INS_loyalist_events.3.a:0 "Ми повинні поспішно придумати новий план."
 INS_loyalist_events.31.t:0 "[FROM.GetNameDefCap] голосує за об'єднання"
 INS_loyalist_events.32.a:0 "Нарешті разом."
 INS_loyalist_events.4.b:0 "Ми повинні відмовитися."
 INS_loyalist_events.7.desc:0 "[FROM.GetNameDefCap] офіційно попросили нас дозволити референдум у [MAL.GetName] з питання об'єднання з їхньою державою. Їхній посол був відвертим щодо ймовірного результату, заявивши, що малайський народ по обидва боки кордону вважає себе однією нацією. Дозвіл на голосування майже напевно означав би втрату [MAL.GetName]."
 INS_malay_unification_cat:0 "Малайське об'єднання"
 INS_medium_tank_destroyer_equipment_2:0 "Tankjager 4"
 INS_political_events.12.a:0 "Ми повинні продовжувати переговори з Сукарно"
 INS_political_events.4.desc:0 "Переговори з [FROM.GetName] пройшли не дуже добре. [FROM.GetLeader] відмовився віддавати [721.GetName] з будь-яких причин, достроково завершивши зустріч."
 INS_rapid_mobilization_desc:0 "Будь-яка сильна нація опирається на сильну армію. Якщо ми хочемо стати регіональною наддержавою, здатною стояти на своєму, ми повинні почати з того, щоб зробити нашу армію набагато сильнішою, ніж вона є сьогодні."
 INS_revolution_events.12.desc:0 "Команда республіканських ополченців розпочала військову операцію з окупації [?event_target:INS_temp_occupied_state.GetName]. Нашій поліції та солдатам зрештою вдалося стримати ситуацію, але ситуація викликала невдоволення в [?event_target:INS_temp_occupied_state.GetName], причому багато цивільних підтримують ополченців і публічно виступають проти уряду [HOL.GetAdjective]."
 INS_revolution_events.35.a:0 "Ми вирішимо це на власних умовах."
 INS_revolution_events.36.t:0 "[FROM.GetNameDefCap] відмовляється втручатися"
 INS_revolution_events.6.a:0 "Це буде легко."
 INS_revolution_events.9.b:0 "Це не варте зусиль, якщо вони так сильно хочуть незалежності, то нехай так і буде."
 INS_revolution_planning_envoy_DONE_trigger_tt:0 "Неможливо створити кілька баз в одному регіоні"
 INS_revolution_planning_hq_DONE_trigger_tt:0 "Можна створити лише один штаб"
 INS_revolution_point_spend_tt:0 "Базу ополчення створено у [FROM.GetName]"
 INS_rubber_for_soldiers:0 "Фінансувати проєкт військової інфраструктури зв'язку за рахунок каучуку"
 INS_sjarifuddin_focus_2_desc:0 "З нашою новою незалежністю ми маємо переглянути нашу експортну економіку та реорганізувати її таким чином, щоб більше не враховувалися голландські прибутки. Хоча економіка, заснована на експорті, все ще небезпечна, ми можемо зробити її набагато надійнішою, ніж у попередні роки."
 INS_union_events.2.desc:0 "[INS.GetNameDefCap] погодилися прийняти наш уряд у вигнанні в [1058.GetName]. Триває підготовка до переїзду, і обидві адміністрації координують інтеграцію офісів і персоналу. Разом ми понесемо факел Королівства вперед зі Сходу."
 INS_union_events.8.a:0 "Це має бути зроблено."
 INS_volksraad_events.2.desc:0 "Хоча петиція була схвалена [INS.GetLeader], на неї було накладено вето після розгляду [HOL.GetLeader], і тому ми не зможемо продовжити імплементацію в цей час."
 INS_volksraad_indonesian_national_language_desc:0 "Індонезійська мова стала спільною мовою в багатьох частинах архіпелагу, долаючи мовні бар'єри між кількома культурами. Оскільки тепер індонезійська мова дозволена в освіті та урядових структурах, багато представників Фольксрааду звернулися з петицією про її юридичне визнання офіційною мовою колонії нарівні з нідерландською."
 INS_volksraad_rumors:0 "Чутки у Фольксраді"
 INS_war_escalation_text:0 "£generic_war_escalation_text_icon Рівень ескалації: §Y[?INS.INS_war_escalation_level]§!"
 INS_womens_sufferage_desc:0 "Надання жінкам права голосу призведе до короткострокової нестабільності, але є необхідним для довгострокової стабільності та демократії."
 INTERNATIONAL_MARKET_CONTRACT_FILTER_SELLING_BUTTON:0 "Продаж"
 INTERNATIONAL_MARKET_OPTIONS:0 "Налаштування ринку"
 INTERNATIONAL_MARKET_PRICE_LEVEL_LABEL_MIXED:0 "Ціна: §Yзмішана§!"
 INTERNATIONAL_MARKET_TOPBAR_BUTTON_INEFFICIENT_COUNT:0 "$VALUE|R$"
 INTERNATIONAL_MARKET_TOPBAR_BUTTON_TOOLTIP_CONTRACT_COUNTRY:0 " - $COUNTRY|Y$ ($VALUE|Y$)"
 IRQ_GATHERING_STORM_DESC:0 "За правління короля Фейсала І, а згодом його сина, короля Газі, Ірак переживає буремні наслідки Першої світової війни як британський мандат. Гашімітська монархія намагається балансувати між модернізацією та націоналізмом, але під поверхнею тліє невдоволення. Вожді племен обурюються центральною владою, тоді як міські еліти прагнуть більшої незалежності від британського впливу. Панарабські настрої стикаються з різноманітними етнічними та релігійними ідентичностями Іраку, створюючи крихку єдність. У той час як світ наближається до нового великого конфлікту, Ірак балансує між консолідацією і потрясіннями, його майбутнє невизначене, але сповнене можливостей."
 IRQ_arab_dominance:0 "Арабське домінування"
 IRQ_bomber_training_desc:0 "Нашим повітряним силам бракує досвіду з більшими літаками, які можна використовувати для бомбардувальних місій. Цей пробіл у навичках має бути заповнений якнайшвидше."
 IRQ_eliminate_the_golden_square_desc:0 "«Золотий квадрат» та їхні послідовники змусять нас ризикувати регіональним конфліктом та внутрішнім розколом через їхнє бажання об'єднати арабський світ. Їх потрібно усунути, перш ніж вони знищать нашу націю."
 IRQ_greater_iraq_desc:0 "З більшою частиною арабського населення, тепер у безпеці під нашим правлінням, здається лише логічним відзначити цю подію, оголосивши про створення ширшого визначення [IRQ.GetNonIdeologyName]."
 IRQ_hashemite_arab_federation_democratic_ADJ:0 "Арабськ"
 IRQ_invite_to_federation:0 "Запросити §Y[FROM.OWNER.GetNameDef]§! до [ROOT.GetNameDef]."
 IRQ_join_axis_desc:0 "$TUR_join_the_axis_desc$"
 IRQ_kurdish_form_the_peshmerga_desc:0 "Хоча наше повстання було успішним у розгромі іракських військових, у майбутньому нам може не пощастити. Ми тому створимо національну армію зі справжньою військовою підготовкою та сучасним обладнанням, щоб запобігти потенційному конфлікту."
 IRQ_kurdistan_tag_democratic_ADJ:0 "Курдськ"
 IRQ_naval_air_support:0 "Військово-морська повітряна підтримка"
 IRQ_navy_research_bonus_desc:0 "Досі ми залежали від вживаних кораблів з-за кордону, які були застарілими ще до того, як ми їх придбали. Щоб уникнути відставання, нам потрібно досліджувати та розробляти власні військово-морські технології, а також модернізувати або відбудовувати наш флот."
 IRQ_political_events.18.t:0 "[FROM.GetNameDefCap] погоджується на передачу"
 IRQ_political_events.24.t:0 "[FROM.GetNameDefCap] відхиляє передачу"
 IRQ_political_events.25.a:0 "Імперіалістичні прислужники"
 IRQ_political_events.25.desc:0 "[FROM.GetAdjective] уряд відхилив план передачі відповідальності за їхню націю [IRQ.GetNonIdeologyName]. Хоча ми думали, що це їх задовольнить, схоже, вони воліють дотримуватися знайомого їм зла."
 IRQ_political_events.32.t:0 "[FROM.FROM.GetNonIdeologyName] планує взяти під контроль"
 IRQ_political_events.35.a:0 "Імперіалістичні прислужники"
 IRQ_political_events.52.b:0 "У нас є інші засоби захоплення землі."
 IRQ_political_events.77.b:0 "Ну що ж."
 IRQ_regime_change_in_arabia_desc:0 "На дім Саудів не можна покладатися як на потенційного союзника проти великих держав. Тому його потрібно усунути, перш ніж він стане загрозою."
 IRQ_renegotiate_treaty_desc:0 "Ми довели, що не є загрозою для інтересів [ENG.GetAdjective] у регіоні і можемо бути їхнім потенційним союзником, якщо виникне потреба. Таким чином, ми повинні нарешті переглянути Англо-іракський договір на рівних засадах."
 IRQ_royal_iraqi_army_KUR:0 "Курдська армія"
 IRQ_support_weapons4:0 "Bren Mk. III & ML 4.2 inch Mortar"
 IRQ_united_arab_republic_neutrality_DEF:0 "Об'єднана Арабська Республіка"
 ISR_fascism:0 "Ізраїльський тоталітаріат"
 ITA_ENG_must_control_necessary_states_tt:0 "§Y[ENG.GetNameWithFlag]§! не контролює історичні британські колонії на Африканському Розі та Мальті"
 ITA_artillery_equipment_1_short:0 "Cannone da 75/27"
 ITA_battleship_3:0 "Клас «Littorio»"
 ITA_bomber_effort:0 "Розвиток бомбардувальників"
 ITA_bop_take_over_ministry_of_justice:0 "\"£BoP_right_texticon Очолити Міністерство юстиції"
 ITA_claims_on_france_desc:0 "Заберімо землі у Вішістської Франції. Після захоплення Німеччиною Парижа та формування нового уряду у Франції настав час заявити про свій законний шматок Південної Європи. Німеччина значно розширила свої володіння на півночі, і буде справедливо, якщо ми отримаємо свою частку."
 ITA_combined_land_and_air_warfare_desc:0 "Допомога Regia Aeronautica для Regio Esercito продемонструвала можливості італійських збройних сил, але є ще багато можливостей для розвитку! Поглиблення цієї співпраці знищить наших ворогів на полі бою і принесе вічну славу Італії!"
 ITA_corpo_volontari_della_liberta_spawn_divs_tt:0 "Створити §Y2§! дивізії §Yополчення§! в щонайбільше §Y5 повністю контрольованих осердних землях§!.\n\n"
 ITA_democratic_low_control_range:0 "Низький соціалістичний вплив"
 ITA_develop_libya_desc:0 "Лівія є нашою найближчою колонією та має найбільший потенціал. Перш ніж ми зможемо почати пожинати всі плоди нашої довгої та важкої роботи з умиротворення цього регіону, ми мусимо поліпшити його інфраструктуру."
 ITA_disband_irregulars:0 "Розпустити нерегулярні війська"
 ITA_ferrea_mole_ferreo_cuore:0 "Ferrea Mole Ferreo Cuore"
 ITA_guardia_nazionale_repubblicana_spawn_divs_tt:0 "Створити §Y5§! дивізій §YCamicie Nere§! у області §Y[THIS.GetName]§!."
 ITA_human_torpedo_effect_tt:0 "Завдає шкоди ворожим морським підрозділам, пришвартованим у доку."
 ITA_independence_bonus_tt:0 "Коли оголошена війна з ціллю §Y$independence_wargoal$§!:"
