 sp_armored_lc_transmission_improvements_tech_desc:0 "Удосконалені передаточні числа, механізми зчеплення та гідротрансформатори для створення більш ефективних трансмісій, здатних витримувати надзвичайну потужність і вагу сухопутних крейсерів, покращуючи загальну мобільність і зменшуючи механічне навантаження."
