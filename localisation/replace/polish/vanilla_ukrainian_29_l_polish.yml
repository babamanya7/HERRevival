 tank_aa_upgrade_desc:0 "Слід переконатися, що наша протиповітряна зброя здатна збивати новітні літаки."
 tank_designer_anti_tank_role_disallowed:0 "Установіть модуль, який дозволяє роль §Hвинищувача танків§!, щоби могти змінити її."
 taxes_desc:0 "Ми сплачуємо податки як відсоток від нашого доходу в різних рівнях, які називаються податковими групами. У міру зростання нашого доходу ставка податку на наступний рівень доходу збільшується.\n\nНаприкінці кожного фіскального року ми повинні сплачувати податки [ENG.GetAdjective] уряду залежно від розміру нашої промисловості. Це визначається кількістю наших §YЦивільних фабрик§!.\n\nСума сплачується у вигляді §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!\nСкільки потрібно сплатити, визначається різними податковими групами, як зазначено нижче:\n"
 tech_mountaineers3:0 "Гірська піхота III"
 tech_recon4:0 "Розвідрота IV"
 tfv_australia.21.a:0 "[Root.GetNameDefCap] та Нова Зеландія, разом до міцнішого майбутнього!"
 tfv_australia.22.a:0 "До зброї, [Root.GetAdjective]ий народе!"
 tfv_canada.42.t:0 "Мексика відмовляється"
 tfv_canada.50.a:0 "Ми не дозволимо ворогові здолати нас!"
 tfv_new_zealand.9.a:0 "Розсудливе прохання."
 tfv_south_africa.104.t:0 "Свобода для держави [LBA.GetName]"
 tfv_south_africa.14.desc.b:0 "Незважаючи на початкову підтримку, останній раунд переговорів із [HOL.GetAdjective]им урядом щодо нового обладнання зірвався. Схоже, що [HOL.GetAdjective]а влада більше не бажає приймати оплату діамантами, посилаючися на проблеми з їх переведенням у конвертовану валюту."
 tfv_south_africa.65.d:0 "Звільнившися з-під влади колоніальних гнобителів, [MAD.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [MAD.GetAdjective]ого уряду."
 tfv_south_africa.82.d:0 "Звільнившися з-під влади колоніальних гнобителів, [CMR.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [CMR.GetAdjective]ого уряду."
 the_arteries_of_trade_goal_name:0 "Захистити артерії торгівлі"
 theater_chinese_mainland:0 "Внутрішній Китай"
 tooltip_raid_category_naval_commando_raids:0 "§HНальоти морської піхоти§!\nНевеликі нальоти, що здійснюються морськими піхотинцями в прибережних районах з використанням невеликих швидкісних катерів і подібного обладнання для швидкого нанесення удару та подальшого зникнення до того, як противник встигне відреагувати."
 tsr_manchukuo.20.a:0 "Це вже непогано"
 tsr_manchukuo.4.desc:0 "Не переконавшись нашими аргументами, японці натомість висміяли наше серйозне прохання про передачу порту Далянь. Стверджуючи, що це «абсолютно смішно», вони порадили нам переглянути, наскільки важливою насправді є наша роль у сфері впливу."
 tsr_manchukuo_border_war.1.a:0 "Наша сила зростає!"
 tsr_manchukuo_news.1.d:0 "Вкрай неочікувано"
 tsr_sichuan_border_war.2.desc:0 "Зіткнувшись із серйозними труднощами, [SIC.GetAdjective]а армія відступила з [601.GetName] і оголосила про завершення свого військового походу. Кордон залишиться без змін."
 tsr_sichuan_border_war.2.t:0 "[SIC.GetNameDefCap] відступає з [601.GetName]"
 turkestan_united:0 "Туркестан"
 tut_1_2_text_3:0 "Досліджуються §LБазові верстати§!"
 tut_3_text_1:0 "Відмінно! Тепер Ви навчитеся, як розпочати планування наступальної операції.\n\nДивізії можуть бути об'єднані в §Yармії§!. Армія використовується для малювання планів бою, і в якості її лідера можна призначити §Yкомандира§!."
 tut_5_text_1:0 "Добре! Тепер у напрямі Ефіопії існує §Yлінія фронту§!. Щоб наказати Вашим військам атакувати відповідно до §Yплану бою§!, Ви мусите спершу намалювати §Yнаступальний наказ§!.\n\nКлацніть по кнопці §YЛінія наступу§!, а потім проведіть лінію, втримуючи праву кнопку миші, по двох виділених провінціях. Зробіть те ж саме з дивізіями на півдні, в §YСомаліленді§!."
 uk_small_arms_focus_desc:0 "[Root.GetBSACompanyDesc]"
 unite_the_somalis:0 "Об'єднати сомалійців"
 united_guiana_neutrality_ADJ:0 "Гвіанськ"
 united_mahgreb_democratic_ADJ:0 "Магрибськ"
 usa.14.a:0 "Повернення до демократії."
 usa.32.desc:0 "Здається, реформи виборчої системи, які ми запровадили, були найбільш успішними, оскільки велика кількість наших прихильників була обрана до Конгресу на останніх виборах. Маючи впевнену більшість, у нас не буде проблем з просуванням нашого політичного порядку денного."
 usa.44.desc:0 "Сенат відхилив пропозицію винести осуд президенту [USA.GetLeader]. Хоча навіть найпалкіші його прихильники мало сподівалися, що він пройде, кількість голосів проти нього стала шоком навіть для найбільш песимістичних спостерігачів. Схоже, що президент користується набагато більшим рівнем підтримки в Сенаті, ніж більшість вважало, що має допомогти просувати його законодавчу програму."
 war_escalation_10_or_more_tt:0 "Ескалація досягла §Y10§!"
 war_escalation_10_tt:0 "§HРівень 10§!\n §YЕфіопія§!: Народна війна\n §YІталія§!: Заворушення в колоніях"
 war_justification.13.t:0 "[ROOT.GetLeader] закликає до війни проти держави [From.GetName]"
 war_justification.18.d:0 "«Немає сумнівів, що [From.GetName] готується до війни. Зміни в економічній політиці дають зрозуміти, що [From.GetAdjective]ий народ не є миролюбним, а скоріше чекає слушної нагоди, щоб завдати нам удару. Чи будемо ми стояти осторонь і спостерігати, як вони озброюються, поки [ROOT.GetName] залишається беззахисним? Чи ми обеззброїмо цю загрозу до того, як вона стане непідвладною нам?»\n\nЯструби в партії [ROOT.GetRulingParty] звернули свої погляди на [From.GetName], стверджуючи, що напад є найкращим захистом. Їх точка зору набирає обертів, і [ROOT.GetName] готується до війни."
 war_justification.19.t:0 "[ROOT.GetLeader] гнівається з [From.GetAdjective]ої політики"
 war_justification.208.t:0 "[From.GetLeader] закликає до знищення [ROOT.GetAdjective]ого націоналізму"
 war_justification.219.d:0 "«Наївні громадяни [From.GetName], які уявляють собі [ROOT.GetAdjective]ий народ як миролюбний, повністю відірвані від реальності. Ті, хто живе на нашому кордоні, не мають розкоші таких ілюзій, бо бачать, як їхні війська наближаються до нас просто по той бік кордону. Це загроза, яку ми не можемо залишити без відповіді. З кожним днем [ROOT.GetName] готується до війни. Було б божевіллям з нашого боку не робити того ж».\n\nНаша військова присутність поблизу [From.GetAdjective]ої території викликала посилене занепокоєння, оскільки вони інтерпретують пересування наших військ як доказ ворожих намірів. Навряд чи вони врахували, що їхня агресивна риторика є причиною наших оборонних заходів."
 war_justification.3.t:0 "[ROOT.GetLeader] застерігає від [From.GetAdjective]ого комунізму"
 war_propaganda_casualties:0 "Закликати до героїзму"
 winter_logistics_support:0 "Рота зимової логістики"
 winter_logistics_support_desc:0 "Забезпечення піхоти відповідним спорядженням для боротьби в зимових умовах."
 wtt_britain.25.d:0 "Нещодавно у наших головних портів з'явилися кораблі британських ВМС, і нам було пред'явлено ультиматум із вимогою негайної передачі наших військових кораблів. Інакше британський адмірал загрожує відкрити вогонь."
 wtt_britain.26.d:0 "Французи вирішили переправити свої кораблі в наші порти. Тепер ми отримали повний контроль над їхніми військово-морськими силами."
 wtt_britain_lease_azores.3.a:0 "Ми це запам'ятаємо."
 wtt_china_shared.13.t:0 "[CHI_USA_General.GetName] прибуває до Китаю"
 wtt_china_shared.4.desc:0 "Схоже що [From.From.GetLeader] відвідав державу [From.GetNameDef] не тільки для обміну люб'язностями за чашкою чаю. Останнім часом розрізнені рухи за незалежність почали дедалі частіше й ефективніше координувати свої дії. Схоже, вони одержують допомогу з-за кордону."
 wtt_germany.17.a:0 "Якщо це не надто дестабілізує ситуацію в країні..."
 wtt_germany.18.t:0 "Нацистське керівництво взято в полон"
 wtt_germany.21.d:0 "Німеччина запропонувала вступити до альянсу державам, які перебувають у нашій сфері впливу. Очевидно, що це є пряма загроза нам!"
 wtt_germany.3.a:0 "Потрібно дозволити йому повернутися та очолити свій народ."
 wtt_germany.57.b:0 "Ні, не варто злити радянців."
 wtt_infiltration.3.t:0 "Комуністи стримані"
 wtt_infiltration.4.a:0 "Сподіватимемося, що ми позбулися всіх."
 wtt_japan.108.t:0 "Переворот молодих офіцерів"
 wtt_japan.115.b:0 "Ми не порушуємо наші угоди... поки що."
 wtt_japan.121.a:0 "Здійсніть цей план."
 wtt_japan.124.desc:0 "У Японії перемогли комуністи, і наші добровольці повернулися додому."
 wtt_ledo_road.3.t:0 "[From.GetNameDefCap] наново відкриває частину Ledo Road"
 wtt_news.1.c:0 "Сподіватимемося, мир скоро повернеться в Європу..."
 wtt_news.19.desc:0 "В умовах радянського наступу, що триває, польський уряд цього ранку заявив про негайне повернення колишніх німецьких територій, Данцига і Познані, державі [GER.GetNameDef].\n\nНезважаючи на те, що уряди Польщі та Німеччини не вказують причину, експерти згодні в тому, що вона, швидше за все, викликана спробами зберегти ці території від вторгнення Радянського Союзу через неминучу воєнну поразку Польщі."
 wtt_news.26.t:0 "Незалежність Філіппін"
 wtt_news.39.b:0 "Хто це зробив?"
 wtt_news.40.h:0 "Це зачепить весь світ..."
 wtt_news.58.desc:0 "Після завоювання всіх територій Бенілюксу [From.GetOldAdjective]а держава взялася в недвозначних термінах виправдовувати свої дії. Його представники стверджують, що є законними спадкоємцями Об'єднаного королівства Нідерландів, і що умови Лондонського договору 1839 були злочинним чином нав'язані іншими державами, а тому він повинен бути анульований. Таким чином, держава [From.GetOldNameDef] лише знову затвердило контроль над землями, що колись належали йому.\n\nПісля цього [From.GetOldAdjective]ий уряд оголосив про зміну назви країни на «[From.GetNameDef]» і тепер намагається заручитися широкою громадською підтримкою за допомогою пропаганди та міркувань про зовнішню загрозу в умовах поточної глобальної кризи."
 wtt_news.59.desc:0 "Після завоювання інших центральноамериканських країн [From.GetOldAdjective]а держава взялася в недвозначних термінах виправдовувати свої дії. Стверджуючи, що воно є єдиним законним спадкоємцем Федеративної республіки Центральної Америки, воно оголосило всі інші держави, що виникли наприкінці 1830-х років, незаконними утвореннями сепаратистів, а недавні військові конфлікти назвали «правомірними спробами повернути собі контроль» над цими територіями.\n\nЯк наслідок, [From.GetOldAdjective]ий уряд оголосив про зміну назви країни на «[From.GetNameDef]» і тепер намагається заручитися широкою громадською підтримкою за допомогою пропаганди та міркувань про зовнішню загрозу в умовах поточної глобальної кризи."
 wtt_news.67.t:0 "Об'єднання Аравії"
 wtt_political_warlord_support.23.a:0 "Вони припадуть до речі."
 wtt_take_national_leadership.1.desc:0 "Китаєм прокотилася хвиля мітингів. Народ вимагає, щоб [old_leader.GetLeader] пішов у відставку, а [new_leader.GetLeader] прийняв кермо влади Китаєм. Навіть у нашому уряді багато хто вважає, що тільки [new_leader.GetLeader] зможе об'єднати Китай і повести його у майбутнє.\n\n[new_leader.GetLeader] користується настільки потужною підтримкою, що відмова передати йому владу може спровокувати нову хвилю заворушень."
 wtt_warlord_vs_prc.10.b:0 "Ми не станемо брати в цьому часть."
 wtt_warlord_vs_prc.21.t:0 "[From.GetLeader] вимагає нашу підтримку"
 wtt_warlord_vs_prc.23.desc:0 "На нашу вимогу додаткової допомоги [From.GetLeader] відповів рішучою відмовою, заявивши, що його країна не здатна виконати такі «абсурдні» умови."
 wtt_warlord_vs_prc.4.a:0 "Добре."
 wtt_xian_incident.1.t:0 "[From.GetLeader] надсилає запрошення"
 wtt_xian_incident.10.a:0 "Допоки вони виконують наші накази."
 wuw_GER_diplomacy.102.a:0 "Чудово"
 wuw_GER_diplomacy.113.desc:0 "[FROM.GetLeader] здається безрозсудним та недалекоглядним лідером, якому байдуже до своєї країни. [FROM.GetAdjective] народ постраждає від цієї дурості."
 wuw_GER_diplomacy.61.desc:0 "[FROM.GetLeader] оголосив, що через небажання вступати у збройний конфлікт з нами, вони погоджуються повернути територію [912.GetName]. Люди регіону радіють — вони знову частина нашої держави."
 wuw_GER_diplomacy.73.desc:0 "Наші агенти у [FROM.GetNameDef] не зустріли опору. Їхні лідери не перешкоджають зростанню пролетарських настроїв — ми можемо продовжити роботу."
 wuw_GER_diplomacy.79.t:0 "Лідерство [FROM.GetNameDefCap] відмовляється приєднатись"
 wuw_GER_diplomacy.90.t:0 "[FROM.GetNameDefCap] пропонує пакт про ненапад"
 wuw_GER_diplomacy.96.desc:0 "[FROM.GetAdjective]и схвально відгукнулись на нашу пропозицію. Попереду нас чекає спільне розширення та оптимізація промислового виробництва."
 wuw_GER_monroe.3.desc:0 "Не дивно, що [FROM.GetNameDef] дізнались про наші спроби дестабілізувати регіон. Провівши масштабну пропагандистську, шантажну і підкупну кампанію, [FROM.GetAdjective]и схилили країни, включені до Доктрини Монро, на свій бік і об’єднали їх проти нас. Доктрина Монро міцніша, ніж будь-коли."
 wuw_GER_monroe.5.a:0 "Нехай буде"
 wuw_GER_mutual_guarantees.1.b:0 "Ми не бачимо користі в цьому союзі"
 wuw_GER_mutual_guarantees.3.a:0 "Велика помилка з їхнього боку"
 wuw_GER_mutual_guarantees.3.t:0 "[FROM.GetNameDefCap] відмовляється від співпраці"
 wuw_GER_news.1.b:0 "Це лише початок..."
 wuw_GER_realpolitik.10.b:0 "За сісу, ми не здамося!"
 wuw_GER_realpolitik.20.t:0 "[FROM.GetNameDefCap] вимагає подальших поступок"
 wuw_GER_realpolitik.43.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] позитивно відповів на нашу пропозицію, і їхні дипломати прибули для підписання необхідних документів щодо повного вступу до Міттельєвропи. Вони радо приймають нашу допомогу у поверненні австро-угорських земель і хочуть знову битися з нами пліч-о-пліч."
 wuw_GER_realpolitik.48.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відмовився поступатися законними землями та заявив, що ми зможемо їх отримати лише силою. Вони голосно говорять, але чи зможуть це довести?"
 wuw_GER_realpolitik.54.a:0 "Це не варте пролиття крові"
 wuw_GER_realpolitik.59.a:0 "Вони — загроза єдності конфедерації!"
 wuw_GER_realpolitik.7.a:0 "Ми мало що можемо вдіяти..."
 wuw_GER_reichskommissariats.16.a:0 "Їм потрібен німецький чиновник"
 wuw_GER_reichskommissariats.3.desc:0 "Ми встановили нову цивільну адміністрацію в Норвегії..."
 wuw_GER_reichskommissariats.8.desc:0 "Ми встановили нову цивільну адміністрацію в Московії..."
 wuw_GER_reichskommissariats.9.a:0 "Перетворити на Рейхсгебіт!"
 wuw_GER_weltpolitik.21.a:0 "Вони пошкодують про своє рішення!"
 wuw_GER_weltpolitik.3.desc:0 "\n[FROM.GetLeader] з [FROM.GetNameDef] відхилив наше прохання щодо повернення колоній, заявивши, що це одностороння угода, яка не несе їм користі."
 wuw_HUN_a_grand_habsburg_alliance:0 "Великий союз Габсбургів"
 wuw_HUN_demand_burgenland:0 "Вимогти Бургенланд"
 wuw_HUN_develop_laszlo_vargas_design:0 "Розвинути проєкт Ласло Варги"
 wuw_HUN_elect_a_democratic_king_desc:0 "Ми повинні знайти короля, який підтримуватиме демократичні принципи нашої нації та права нашого народу. Для цього ми маємо звернути погляд на соціал-демократичні конституційні монархії Північної Європи та дізнатися, чи є серед них гідний кандидат на наш трон."
 wuw_HUN_end_the_regency:0 "Завершити регентство"
 wuw_HUN_establish_the_mavag_aircraft_factory_desc:0 "Іштван Горті співпрацюватиме з MÁVAG для створення нових заводів, присвячених виробництву літаків, і негайно почне постачання нових технологій для Magyar Légierő."
 wuw_HUN_news_events.4.b:0 "Світ наш!"
 wuw_HUN_parade_istvan_bethlens_platform:0 "Нова опозиція Іштвана Бетлена"
 wuw_HUN_reach_out_to_candidates_desc:0 "Ми створимо комітет для пошуку гідних кандидатів на трон. Очевидними виборами є Отто та Йосиф Август — нащадки Габсбургів. Проте Малий Антанта забороняє Габсбургів, тож ми можемо шукати альтернативу."
 wuw_HUN_secure_army_loyalty:0 "Забезпечити лояльність армії"
 wuw_HUN_the_arado_ar_96_desc:0 "Ми повинні отримати ліцензію на виробництво літаків від німецької компанії Arado Flugzeugwerke та змістити акцент нашого авіавиробництва у бік повітряної розвідки."
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias:0 "Спадщина Арпада, Андраша та Матяша"
 wuw_HUN_transylvanian_mountaineers_desc:0 "Гори Трансільванії — одні з найвищих у нашому регіоні. Це ідеальне місце для підготовки наших гірських підрозділів."
 wuw_HUN_uplift_the_dragon_movement:0 "Підтримати Рух Дракона"
 ww_BEL_event_diplomatic.1.desc:0 "[FROM.GetLeader] повідомив нам, що договір взаємної оборони між нашими країнами втратив свою силу, оскільки вони прагнуть до нейтралітету в ці важкі часи. Це не зовсім спрацювало для них під час Великої війни..."
 ww_BEL_event_diplomatic.27.a:0 "Чудово!"
 ww_BEL_event_diplomatic.28.b:0 "Вони є загрозою для всіх нас!"
 ww_BEL_event_diplomatic.33.b:0 "Нейтралітет повинен бути збережений!"
 ww_BEL_event_political.6.b:0 "Французька мова має бути пріоритетною."
 ww_BEL_event_spanish_interaction.2.a:0 "Відправити ще гвинтівки!"
 ww_BEL_event_spanish_interaction.5.t:0 "Промоція еміграції [FROM.GetAdjective]"
 ww_BEL_event_war.10.a:0 "Ми отримали те, за чим прийшли, укласти мир!"
 ww_BEL_event_war.8.b:0 "Продовжимо боротьбу! Ця війна ще не закінчена."
 ww_BEL_event_war.9.t:0 "Франція погоджується на мир"
 ww_congo.34.a:0 "Ми віримо, що можна досягти великої співпраці"
 ww_congo.34.b:0 "Він лідер, якого нам потрібно!"
 ww_congo.60.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], вирішив прийняти наш запит і дозволити нам знову стати протекторатом їхньої нації. Справжній баланс відновлено в Африці!"
 ww_congo.61.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], відмовився від нашого запиту, оскільки не бачить великої користі від нашого регіону, стверджуючи, що ми не можемо дати їм нічого такого, чого вони вже не мають."
 ww_congo.62.t:0 "Рауль ван Оверстретен повертається до Бельгії"
 ww_congo.67.t:0 "[FROM.GetLeader] запрошує нас до Товариства з розвитку урану"
 ww_congo.9.t:0 "Евольє починають входити в політику [ROOT.GetAdjective]"
