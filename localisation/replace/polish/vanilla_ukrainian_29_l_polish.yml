 CAN_montreal_laboratory_collaboration:0 "Співпраця з Монреальською лабораторією"
 CAN_offer_concessions_for_labrador_tooltip:0 "§H[ENG.GetName]§!, ймовірніше, розгляне цей запит, ніж пряму вимогу. Вони §Gз більшою ймовірністю§! погодяться на наш запит, якщо вони:\n - Перебувають у стані війни\n - Мають високу думку про нас\n - Мають більше ніж §H25%§! прогресу капітуляції\n - Мають ту ж ідеологію, що й ми\n\nЯкщо вони приймуть:\n"
 CAN_send_in_the_zombies_desc:0 "Настав час закликати всіх військовозобов'язаних громадян Канади на службу в армію. Ми залучили чимало людей у промисловості за допомогою Закону про мобілізацію національних ресурсів, але тепер ми маємо відправити їх за океан."
 CAN_shadow_factories:0 "Тіньові заводи"
 CAN_sp_land_flamethrower_tank:0 "Проєкт «Ram Badger»"
 CAN_support_weapons4:0 "Bren Mk III & ML 4.2 inch Mortar"
 CAN_swastika_clubs:0 "Клуби свастики"
 CAN_we_have_the_hurricane_desc:0 "Сполучене Королівство дозволило нам розпочати випуск винищувачів «Hurricane». Ці літаки стануть основою наших авіакрил."
 CAN_women_in_the_workforce_desc:0 "Ронні каже: «Продовжуйте!» Оскільки наші чоловіки служать в армії, тягар нашого військового виробництва лягає на плечі жінок нашої країни. Протягом війни 800 000 канадських жінок зайняли роботу, яку залишили ті, хто вступив на військову службу, назавжди доводячи, що жінки можуть виконувати роботу так само добре, як і чоловіки."
 CAREER_PROFILE_BACKUP_QUOTE_22:0 "«The cause doesn't have to be righteous and battle doesn't have to be winnable; but over and over again throughout history, men have chosen to die in battle with their friends rather than to flee on their own and survive».\n\n(Себастіан Юнгер, «Війна»)"
