 YUG_brigadistas_desc:0 "Багато хоробрих громадян Югославії вимагають битися проти наших спільних ворогів у громадянській війні в Іспанії."
 YUG_destroyer_4:0 "Клас «Split»"
 YUG_expand_the_serbian_shipyards_desc:0 "Хоча в регіоні бракує потужностей, які б дозволяли легко виробляти більші військові кораблі, розміщення великих верфей у регіоні Чорногорії гарантувало б, що ми збережемо контроль над ними незалежно від нашої майбутньої політики щодо хорватської автономії."
 YUG_gw_tank_equipment_short:0 "FT-17"
 YUG_light_tank_equipment_2_short:0 "LT M36"
 YUG_limited_self_government_desc:0 "Розбіжності в нашій країні явно надто глибокі, і їх занадто багато, щоб впоратися за допомогою простих реформ. Лише шляхом надання автономії різним народам, що становлять нашу націю, ми зможемо зберегти наш союз без застосування сили."
 YUG_listening_post_flag:0 "Недавно створено пункти прослуховування"
 YUG_local_self_management_desc:0 "Розвиток місцевого самоврядування поліпшить використання місцевих ресурсів і ефективність нових будівельних проєктів."
