 LAT_HOL_autonomy_eu_member_DEF:0 "Європейська Латвія"
 LAT_military_industrial_complex_desc:0 "Щоб належним чином озброїти «Pērkonkrusts», Латвія має бути не так державою, як військовим заводом."
 LAT_nationalised_industry_desc:0 "Пора капіталістичної економіки пройшла. Настав воєнний час, і ми мусимо переконатися, що уряд твердо контролює економіку."
 LAT_pan_baltic_bank:0 "Панбалтійський банк"
 LAT_perkonkrust_uprising_desc:0 "З часом Перконкрустс отримає підтримку по всій країні, і якщо їх не зупинити, вони відчують себе достатньо сміливими, щоб здійснити спробу державного перевороту."
 LAT_what_is_capitalism_desc:0 "Тепер, коли засновані трудові палати, настав час взяти на себе пряме управління економікою. Хоч за своєю природою наша економіка залишається капіталістичною, диктатура повинна керувати ключовими виробництвами."
 LBA_communism_DEF:0 "Лівійська соціалістична республіка"
 LBA_fascism:0 "Нова Африка"
 LEADER_CANNOT_PROMOTE:0 "§RНеможливо підвищити§!"
 LEADER_FUNCTION_NAVY_DESC:0 "Наявність адмірала, призначеного до флоту, посилює оперативні групи в різних областях залежно від навичок адмірала."
 LEADER_RANK_WITH_PROGRESS:0 "$RANK|Y$ ($PROGRESS|%Y0$)"
 LEB_democratic_ADJ:0 "Ліванськ"
 LEB_mandate_DEF:0 "Ліванська республіка"
 LIB_fascism_DEF:0 "Реорганізована вільна Ліберія"
 LIST_AND:0 " і "
 LIT_MIL_neutrality_DEF:0 "Литовська хунта"
 LIT_abolish_the_presidency_desc:0 "Поки що Смєтона продовжує правити нацією, але зі зростаючою популярністю Міндаугаса III здається розумним скасувати інститут президентства і замінити його абсолютною владою короля. Смєтона відійде на роль прем'єр-міністра і служитиме радником молодому Міндаугасу III."
 LIT_events.103.a:0 "Розробити з ними!"
 LIT_events.801.t:0 "[From.GetNameDefCap] погоджується"
 LIT_exile_voldemares:0 "Вигнати Вольдемараса"
 LIT_iron_wolf_partisans:0 "Прибічники «Залізного вовка»"
 LIT_lithuanian_preservationism_desc:0 "Литовська республіка молода і все ще шукає своє місце у світі. Багато хто хотів би, щоб у ній встановився комунізм, фашизм чи лібералізм, але ми мусимо уникати спокус піддатися іноземному впливу. По-справжньому незалежна Литва має знайти свій шлях самотужки."
 LIT_offer_military_basing_tt_2:0 "§RАБО§!\n"
 LIT_push_for_ruthenia_desc:0 "Залізниці України та Білорусі абсолютно занедбані, але ці території — така сама частина Речі Посполитої, як і будь-які інші. Якщо ми хочемо дістатися самого Радянського Союзу і забрати те, що належить нам по праву, потрібно вкладати кошти у східну залізничну мережу."
 LIT_rastikis_military_reforms:0 "Військові реформи Раштікіса"
 LIT_underground_production_centers:0 "[Root.Get_Underground_Resistance_Focus_Loc]"
 LOADING_TIP_106:0 "«Усі люди лякаються. Що розумніші вони, то більше лякаються».\n(Джордж С. Паттон)"
 LOADING_TIP_110:0 "«Варшава не чекає на порожні слова похвали чи на заяви про визнання, ані на запевнення в симпатії. Варшава чекає на зброю та набої».\n(Юзеф Пілсудський)"
 LOADING_TIP_126:0 "«Як майбутня історія осудить німецький народ, якщо навіть дюжина людей не знайшла відваги покінчити з цим злочинцем?»\n(Геннінг фон Тресков)"
 LOADING_TIP_157:0 "«Республіка — моя дитина. Вона під загрозою потонути. Я намагаюся втримати її на плаву і нас зносить ріка. Я кличу на допомогу Англію й Америку. Вони стоять на березі та глумляться з мене».\n(Сунь Ятсен)"
