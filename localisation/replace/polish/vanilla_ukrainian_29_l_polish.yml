 CONFIRMDELETE_ARMY_GROUP_HEADER:0 "Перепризначити групу армії"
 CONFIRM_DELETE_ENCIRCLED_MULTI:0 "§R$NUM$ військ. част. знаходяться в оточенні; Ви втратите все їхнє оснащення та $VALUE|%0$ людських ресурсів!§!"
 CONFIRM_REMOVE_BUILDING_LEVEL_TITLE:0 "Знищити споруду"
 CONGO_congo_army:0 "Армія Конго"
 CONGO_congo_army_desc:0 "Все ясніше стає, що існують іноземні сили, які зацікавлені в завоюванні Конго. Тому ми повинні значно більше інвестувати в армію, щоб Конго могло краще захищатися, а, можливо, й допомогти [BEL.GetName] реалізувати її вплив за кордоном."
 CONGO_forminiere_desc:0 "Société internationale forestière et minière du Congo — це організація, що здебільшого займається лісівництвом та видобутком корисних копалин у Конго. Хоча їхній досвід у лісовому господарстві цінний, нічого не зрівняється з їх монополією на діаманти в Касай. Це потрібно посилити та розширити!"
 CONGO_gold_and_diamonds:0 "Золото та діаманти"
 CONGO_humanitarian_aid:0 "Гуманітарна допомога"
 CONGO_new_vegetable_produce_markets:0 "Нові ринки овочевих продуктів"
 CONGO_overseas_department_of_belgium:0 "Заморський департамент Бельгії"
 CONGO_prince_leopold_mine_desc:0 "Регіон Кіпуші видобуває мідь протягом століть, і хоча ми працюємо тут вже певний час, потенційна вартість міді, ймовірно, зросте через глобальні напруженості. Будемо готові до цього попиту, коли він з'явиться."
 CONGO_ruanda_urundi_desc:0 "Колись частина Німецької Східної Африки, територія була передана [BEL.GetName] під опіку Лігою націй після Великої війни. Це регіон з доступом до цінних ресурсів, таких як бавовна, кава і вольфрам."
 CONGO_secure_international_funding:0 "Забезпечити міжнародне фінансування"
 CONGO_smuggle_uranium_tt:0 "Відкриває рішення для §YПродажу Урану Великим Державам§!, даючи їм бонус до їхньої ядерної програми, а нам — бонус до нашої промисловості"
 CONSTRUCTION_MASTER_BUILDING_CANT_REDUCE:0 "§RМи не можемо знизити рівень цієї споруди або скасувати її будівництво.§!"
