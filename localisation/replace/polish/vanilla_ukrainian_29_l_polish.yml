 election.13.d:0 "Впливовий промисловець, що стоїть за однією з компаній, з якою ми вирішили співпрацювати для нашого промислового виробництва, нещодавно зробив низку заяв про політику, які викликали занепокоєння у членів адміністрації. Він відкрито виступав за авторитарний уряд і вихваляв іноземні адміністрації, які ідентифікують себе як фашистські, неявно припускаючи, що держава [Root.GetName] отримала б вигоду від такого правління. Засудження магната та його ідеалів може зіпсувати наші відносини з компанією, але якщо залишити їх без контролю, він отримає платформу для поширення пропаганди, яка підірве все, за що виступає [Root.GetRulingParty]."
