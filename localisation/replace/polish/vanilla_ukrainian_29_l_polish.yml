 PAR_discipline_hierarchy_and_order_desc:0 "Після скасування виборів ми оголосимо нову політику «Дисципліна, ієрархія та порядок». Набір принципів, якими керуватиметься наша країна, а особи, які поширюють підривні ідеї, підлягатимуть ув'язненню."
 PEACE_CONFERENCE_COST_NO_ACTIONS:0 "Немає обраних дій"
