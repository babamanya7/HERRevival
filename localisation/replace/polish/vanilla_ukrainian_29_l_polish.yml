 SOV_anti_tank_equipment_1:0 "45-мм противотанковая пушка М1934"
 SOV_approach_semyonov_tt:0 "§Y$SOV_grigory_semyonov$§! стане доступним як радник і генерал, коли почнеться [GetSovietCivilWarName].\nВідмикає §Yрішення§!, щоби набрати додаткові кавалерійські дивізії."
 SOV_article_124_desc:0 "[SOV.GetArticle124Desc]"
 SOV_beaten_but_not_defeated_desc:0 "Зрозуміло, що комуністи повели нашу колись горду країну зрадницьким шляхом. Рано чи пізно країни на наших кордонах відчують слабкість режиму і накинуться на нас. Якщо ми хочемо врятувати нашу любу батьківщину, ми повинні усунути комуністів від влади!"
 SOV_bring_old_trotskyists_back_trigger_tt:0 "§Y$SOV_karl_radek$§! і §Y$SOV_yevgeny_preobrazhensky$§! були піддані чистці Сталіним"
 SOV_capital_of_the_tsars_desc:0 "Санкт-Петербург протягом всієї історії був столицею нашої гордої нації. Тепер, коли Зимовий палац знову зайнятий Романовими, настав час знову перенести офіційну столицю до цього чудового міста і спрямувати всі зусилля на примноження його величі."
 SOV_comecon_joint_military_program:0 "Спільна військова програма"
 SOV_consolidate_power_tt:0 "§Y$SOV_nikolay_ustryalov$§! стане доступний на посаду радника."
 SOV_default_poum_cd_tt:0 "\nЦе рішення стане доступне через §Y[?SOV_default_poum_cd]§! дн.\n"
 SOV_desperate_measures_desc:0 "У цій відчайдушній ситуації ми мусимо вжити заходів, які раніше вважали неможливими. Все, що можна зробити, щоби зупинити вторгнення, мусить бути зроблено."
 SOV_exiles_name:0 "Роійські вигнанці"
 SOV_far_east_fortification_forts_1:0 "Додати §Y6 наземних укріплень§! на японському кордоні.\n"
 SOV_great_purge_tt2:0 "Кількість проведених чисток вплине на ймовірність поновлення §Yгромадянської війни§! і масштабування ефекту від §Yчистки офіцерів§!.\nНевиконання цього завдання призведе до §Yгромадянської війни§! і можливого повернення §YЛева Троцького§! з еміграції.\n\n"
 SOV_has_active_ship_designer_any_black_sea_tt_NOT:0 "Нема активного чорноморського §Yконструктора кораблів§!"
 SOV_infrastructure_effort_desc:0 "[ROOT.GetNameDefCap] — величезна держава, але здебільшого порожня. Ми мусимо забезпечити можливість швидкого транспортування товарів та обладнання через всю країну."
 SOV_inspection_in_the_administration:0 "Інспекція в адміністрації"
 SOV_inspection_in_the_airforce_desc:0 "Ми мусимо дозволити НКВС провести перевірку в авіації, щоби знайти можливих дисидентів і саботажників."
 SOV_integrate_smirnovs_bloc_tt:0 "§Y$SOV_ivan_smirnov$§!, §Y$SOV_ivar_smilga$§! й §Y$SOV_aleksandr_shlyapnikov$§! будуть звільнені з в'язниці та відправлені у вигнання (§Gперсонажі у вигнанні не можуть бути піддані чистці§!). Вони стануть доступні, коли почнеться громадянська війна.\nДає підтримку лівої опозиції в двох регіонах."
 SOV_is_opposition_tt:0 "Є опозицією"
 SOV_left_eliminate_right:0 "Знищити правих"
 SOV_left_eliminate_right_desc:0 "Всередині партії є фракції, які абсолютно несумісні одна з одною. Якщо ми хочемо взяти владу в свої руки і повернути революцію в правильне русло, ми не можемо дозволити собі відволікатися на їхні втручання. Але якщо «товариш» Сталін шукає внутрішніх ворогів для боротьби, ми могли б втягнути деяких людей, щоб він подивився на них..."
 SOV_lithuanian_claimed_states_tt:0 "[ROOT.GetNameDefCap] отримає претензії на §Yвсі [LIT.GetAdjective]і осердні землі§!."
 SOV_medium_tank_artillery_equipment_2:0 "СУ-122"
 SOV_mig_design_bureau_dissolved_days_tt:0 "Число днів від розпуску Бюро: [?SOV_mig_design_bureau_dissolved_flag:days|Y0]"
 SOV_modern_tank_equipment_1_short:0 "Т-54"
 SOV_modify_airforce_ns_intro_name_default:0 "§Y$SOV_soviet_airforce_dynamic_modifier$§!"
 SOV_national_specialists_desc:0 "Нашим економічним розвитком мають керувати насамперед люди, які добре знають, у якому стані вона перебуває. Іноземцям знадобиться багато часу, щоб здобути ці знання, і, мабуть, іще гірше — вони заберуть їх із собою, коли поїдуть звідси."
 SOV_operation_countenance:0 "Операція «Згода»"
 SOV_operation_iskra_desc:0 "Ми почнемо підготовку до військової операції з прориву облоги області [195.GetName]."
 SOV_operation_iskra_ongoing:0 "Операція «Іскра» триває"
 SOV_optimize_production_lines_desc:0 "Інші країни успішно впровадили «фордизм» на своїх заводах, щоб максимізувати виробництво. Ми мусимо вчитися на їхньому прикладі."
 SOV_paranoia_army_purgeable_tt:0 "Підозрілі справи в армії можуть бути розслідувані"
 SOV_paranoia_system_desc:0 "Над державою [ROOT.GetNameDef] нависає атмосфера підозри та недовіри. [ROOT.GetLeader] стурбований фракційністю всередині партії й ця стурбованість зростає, тим часом як НКВС розслідує незліченні звинувачення та ймовірні акти саботажу, диверсій та шпигунства."
 SOV_paranoia_text_tooltip_default:0 "§YНа щотижневу £SOV_paranoia_text_icon£ параною впливають:§!\n[GetLeaderTrait]\n[GetNKVDTrait]"
 SOV_planned_economy_desc:0 "Незважаючи на свої недоліки, очевидно, що НЕП мав і низку успіхів. Ми все ще далекі від того, щоб перейти до повного соціалістичного суспільства, але зараз ми можемо перейти до планування нашої економіки у більш формальний спосіб. Зокрема, ми повинні створити економічну політику, яка б враховувала можливості наших партнерів і союзників і створювала більш взаємозалежну економіку."
 SOV_planned_economy_subjects_tt:0 "$EFFECT_EVERY_SUBJECT_COUNTRY_STARTS$:"
 SOV_poum_exists_tt:0 "§Y$SPC_communism$§!:\n   Існує\n   Виконано фокус §Y$SPR_the_anti_fascist_workers_revolution$§!"
 SOV_pressure_country_government_baltic:0 "Натиснути на уряд держави [FROM.GetNonIdeologyName]"
 SOV_propaganda_campaign_empty_slot_tt:0 "Ця комірка для плакату пропаганди наразі §Gпорожня§!. Ви можете §Gактивувати§! £SOV_propaganda_text_icon §Yкампанію пропаганди§!."
 SOV_propaganda_motherland_calls:0 "Вітчизна-Мати кличе!"
 SOV_purge_event_not_enough_pp_to_avoid_regular_tt:0 "\nЦю чистку не можна уникнути, тому що величина £GFX_pol_power §Y$POLITICAL_POWER$§! має бути позитивна на момент спрацювання події."
 SOV_recruit_manchurian_cavalry_exiles_desc:0 "Додає одну маньчжурську кавалерійську бригаду в області [?SOV.SOV_civil_war_start_state.GetName], коли починається війна."
 SOV_reinforce_western_naval_bases_radar_tt:0 "Якщо вже досліджена технологія §Y$radio_detection$§!: Додати §Y1 радарну станцію§!\n"
 SOV_secure_the_administration_desc:0 "Після шоку від зізнань терориста Зінов'єва та його поплічників ми мусимо поставити питання про лояльність інших членів партії. Нам вкрай важливо знати, де стоїть кожен член Політбюро."
 SOV_seek_a_defense_pact_with_the_allies_target_fra_caps:0 "§Y[FRA.GetFlag][FRA.GetNameDefCap]§! може"
 SOV_set_civil_war_state_tt:0 "Опозиційний осередок, створений у державі [FROM.GetName], що забезпечує лояльність держави у випадку громадянської війни."
 SOV_soviet_civil_war_not_started_tt_NOT:0 "Громадянська війна в Радянському Союзі почалася"
 SOV_sp_rockets_ballistic_missile:0 "Проєкт «Р-1»"
 SOV_steppe_crackdown_timer_desc:0 "НКВС вирішив зосередитися на Великому степу, проводячи масові арешти та допити, щоби забезпечити вірність населення регіону."
 SOV_steppe_crackdown_timer_tt:0 "Одна область у регіоні Великого степу буде орієнтована до центристів."
 SOV_sub_ship_nuclear_engine_1:0 "VM-A Pressurized Water Reactor"
 SOV_super_heavy_tank_aa_equipment_1_short:0 "ИСУ-57-4"
 SOV_swap_to_political_advisors:0 "Військові політичні радники"
 SOV_the_new_soviet_woman:0 "Нова радянська жінка"
 SOV_the_onslaught_on_colonialism:0 "Наступ на колоніалізм"
 SOV_the_permanent_revolution_desc:0 "Марксистська теорія вчить, що революція неминуча, якщо обставини є сприятливими. Однак обставини явно не є сприятливими, або не скрізь сприятливими. Ми не мусимо заспокоюватися і чекати на світову революцію, яка може відбутися через століття. Робітники і селяни по всьому світу страждають прямо зараз, сьогодні, і їхнє звільнення не може чекати."
 SOV_the_southern_thrust_desc:0 "Наш південний кордон — це широкий відкритий фланг, з якого вороги можуть використати будь-яку слабкість. Ми не можемо з цим миритися і не можемо чекати мирних змін у регіоні."
 SOV_the_trade_union_as_labor_organizer:0 "Профспілка як організатор праці"
 SOV_the_triple_entente_desc:0 "Наших старих ворогів у Центральній Європі треба стримувати. Колись для цього існував союз, хоча наш ганебний вихід з Великої війни означав його кінець. Настав час відновити ці зв'язки"
 SOV_third_five_year_plan:0 "[GetThirdFiveYearPlanName]"
 SOV_transformation_of_nature:0 "Трансформація природи"
 SOV_undermine_stalins_authority_paranoia_tt:0 "£SOV_paranoia_text_icon Щотижневе збільшення параної: §R+1§!"
 SOV_woo_navy_officers:0 "Placeholder: Recruit an officer to fascism"
 SPAIN_BLITZKRIEG_DESC:0 "Громадянська війна, що спустошувала країну протягом останніх трьох років, нарешті завершилася. Під керівництвом Франко переможці мають подбати про відновлення Іспанії, ліквідацію залишкових осередків опору та виправлення розколів, утворених війною.\n\nОднак час не безмежний, оскільки світ загалом продовжує свій невблаганний марш до того, що, безсумнівно, буде набагато більшою і ще більш кровопролитною війною. Якщо Іспанія хоче стояти на своєму, а тим більше пожинати плоди можливостей, наданих цим майбутнім конфліктом, вона повинна негайно підготувати свою промисловість і армію."
 SPA_activate_asturias_fifth_columnists:0 "Задіяти п'яту колону в Астурії"
 SPA_arms_modernization:0 "Модернізація зброї"
 SPA_asturias_offensive_mission:0 "Насувається наступ в Астурії"
 SPA_cultivate_fanaticism:0 "Культивувати фанатизм"
 SPA_democratic_DEF:0 "Іспанія"
 SPA_emergency_munitions_corporations_desc:0 "Військові зусилля потребують негайного посилення, якщо ми хочемо підтримувати достатній рівень постачання для наших відважних військ. Ми організуємо тих, хто не воює, у тимчасові майстерні, де виготовлятимуть найнеобхідніше для наших військ."
 SPA_expand_the_air_branch_desc:0 "Громадянська війна чітко показала нам, яку важливу роль відіграє авіація. Якщо ми хочемо стати силою, з якою потрібно рахуватися, це сфера, в якій нам потрібно розширюватися."
 SPA_facilitate_pyrenees_freight_transports_desc:0 "Постачання нового матеріалу з півночі потрібно ще більше сприяти, щоби не відставати від попиту, тому ми розширимо залізниці, які проходять крізь Піренеї."
 SPA_fascism_DEF:0 "Націоналістична Іспанія"
 SPA_glory_and_wealth_on_the_sea_lanes:0 "Слава і багатство на морських шляхах"
 SPA_heavy_cruiser_1_desc:0 "The Princesa de Asturias class consisted of three armored cruisers built for the Spanish Navy around the turn of the century. All three had been either scrapped or wrecked by the mid-1930s. They were armed with twin 240mm Guillén M1896 and eight 140mm/33 Schneider-Canet guns. They were heavily armored but also somewhat slow compared to a standard heavy cruiser."
 SPA_heavy_tank_equipment_2:0 "Tanque Pesado 2"
 SPA_italian_shipbuilding_expertise:0 "Італійська кораблебудівна експертиза"
 SPA_la_division_azul_desc:0 "Хоча ми перемогли комуністичну загрозу тут, в Іберії, корінь зла все ще вимальовується на Сході. Поки інші несуть основний тягар бойових дій, ми повинні надіслати підрозділ добровольців, щоб виконати нашу роль у боротьбі з цією загрозою."
 SPA_preparing_the_carlist_insurrection:0 "Підготовка до карлістського заколоту"
 SPA_strengthen_the_supreme_reality_of_spain:0 "Зміцнити верховну реальність Іспанії"
 SPA_suppress_the_strikes_tt:0 "Національні страйки повністю придушено"
 SPA_the_iberian_pact_desc:0 "Цілісність наших двох народів залежить від добрих відносин між ними. Ми повинні запропонувати договір, згідно з яким і Іспанія, і Португалія завжди приєднуватимуться до однієї сторони в будь-якій глобальній війні, в яку вони вступатимуть, або будь-якому союзі, до якого вони приєднаються. Об'єднана Іберія — сильна Іберія!"
