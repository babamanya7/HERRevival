 ENG_issue_gasmasks_desc:0 "Світ стає дедалі небезпечнішим із кожним днем. Ми мусимо захистити цивільне населення від будь-яких атак із використанням отруйних газів. Британія буде дихати вільно."
 ENG_light_tank_artillery_equipment_2:0 "Priest"
