 lar_congress_of_paris.2.b:0 "У нас немає жодної причини підтримувати цю пропозицію."
 lar_fra_join_the_ententes.1.b:0 "Це не в наших інтересах."
 lar_intervention_in_greece.1.desc:0 "Французький посол вручив нам ноту від свого уряду, в якій вказується на наші спільні інтереси у Східному Середземномор'ї. Судячи з усього, [From.GetLeader] хоче придбати острів Крит і влаштувати на ньому базу флоту, але, що присутність у Греції «недружнього чи ворожого» уряду помітно ускладнить ведення справ у цьому регіоні. По суті, [From.GetAdjective] уряд хоче дізнатися, що ми думаємо про можливе спільне вторгнення в Грецію. або навіть взяти території під свій контроль."
 lar_news.1.f:0 "¡La guerra ha terminado!"
 lar_news.10.desc:0 "Сили карлістів під проводом Мануеля Фал Конде, стурбовані постійним відтиском у тінь і скороченням свого впливу, оголосили, що більше не підтримують зв'язку зі справою націоналістів. Проголосивши своє власне незалежне повстання, карлістські рекете, здебільшого на півночі країни, виступили проти колишніх союзників, продовжуючи при цьому боротися з ворогами-республіканцами.\n\nЕфекти, що надаються на їхній воєнний стан у громадянській війні, применшуються лідерами націоналістів, але очевидно, що хаос, що запанував, надає республіканцям великі можливості."
 lar_news.10.t:0 "Карлістське повстання у громадянській війні в Іспанії"
 lar_news.11.desc_2:0 "Постійні спроби уряду відновити централізований контроль над здебільшого самочинними анархістськими комунами на північному сході Іспанії, а також репресії сталіністів проти комуністів-інакодумців призвели до повномасштабних внутрішніх конфліктів серед республіканців, які здобули перемогу у громадянській війні в Іспанії.\n\nСпочатку конфлікт обмежувався вуличними боями та дрібними сутичками між ополченнями та урядовими або сталіністськими силами, проте через небажання обох сторін іти на компроміс він стрімко загострився всього за кілька днів. Оскільки лідери фракцій відмовляються розглядати можливість примирення, а лінії фронту вже визначені, Іспанія, здається, приречена на чергову громадянську війну."
 lar_news.14.a:0 "Вони прийняли мудре рішення."
 lar_news.14.d:0 "От так одним розчерком пера ми втратили Північну Африку..."
 lar_news.18.b:0 "Але це зазнає значних змін?"
 lar_news.23.d:0 "Іберійські нації нарешті працюють спільно..."
 lar_news.26.t:0 "Імперія Португалії та Бразилії"
 lar_news.27.d:0 "Це лише гарна назва, за якою вони ховають свої справжні амбіції."
 lar_news.4.b:0 "Виходить, їхню честь можна купити так дешево?"
 lar_news.5.a:0 "Коли Італія каже, весь світ слухає."
 lar_news.5.desc:0 "Незважаючи на початкові затримки та розбіжності з приводу італійського вторгнення в Ефіопію, лідери альянсу [This.GetStresaMembers] зібралися, щоби перетворити угоди, досягнуті в 1935 році, у формальне союзне зобов'язання.\n\n [This.GetStresaConcessions] У той час як лідери нового альянсу стверджують, що угода лише ставить за мету підтримати мир у Європі, багато дипломатів сходяться на думці, що початкове його завдання — стримування Німеччини."
 lar_news.6.e:0 "Вони вважають за краще не вплутуватися в справи, які їх не стосуються, — і правильно."
 lar_news.8.c:0 "Повернення до давно минулих днів."
 lar_portugal_iberian_summit.5.b:0 "Спочатку треба звернутися до [?global.POR_iberian_summit_target.GetAdjective] дипломатам."
 lar_portugal_iberian_summit.9.t:0 "Іберійський самміт — [From.GetNameDef] відхиляє пропозицію"
 lar_portugal_navy_mutiny.1.b:0 "Зупинити це божевілля!"
 lar_portugal_overseas_provinces.2.desc:0 "Наша колишня колонія Мозамбік нарешті інтегрована в наше співтовариство. Місцеві жителі Мозамбіку отримали португальське громадянство і тепер мають ті ж права і обов'язки, що й інші громадяни Португалії — в тому числі і зобов'язання. Так ми зможемо посилити нашу армію людськими ресурсами."
 lar_portugal_promote_monarchist_cause.1.a:0 "Та як вони посміли?!"
 lar_portugal_promote_monarchist_cause.4.desc:0 "За підтримки [POR.GetAdjective] уряду бразильським монархістам вдалося мирно змінити режим. Тут і там в країні залишилися кілька елементів, які чинили опір тому, щоб трон зайняв наш законний імператор [Root.GetLeader], будуть утихомирені."
 lar_portugal_promote_monarchist_cause.6.t:0 "Бразилія не погоджується на об'єднання"
 lar_ratify_the_stresa_front.1.desc:0 "Йде підготовка до підписання та ратифікації Стрезького договору, який оформляє союз із Францією в обмін на територіальні поступки. Після довгих місяців роботи дипломатичної служби залишилося лише поставити підпис."
 lar_spain.1.a:0 "Іспанія виживе, лише позбувшись фашизму!"
 lar_spain.11.desc:0 "Незважаючи на фанатичний опір, наші війська зачистили останні осередки опору карлистів. Хоч це і значно спростило нам війну, ми, як і раніше, боремося з ворогами, що залишилися."
 lar_spain.26.a:0 "Вони і справді вірні друзі."
 lar_spain.46.desc:0 "[From.GetNameDefCap] приймає нашу пропозицію утворити Іберійський Союз, лідером якого стане [Root.GetLeader]. Вони почнуть процедуру інтеграції свого урядового апарату з нашим."
 lar_spain.53.t:0 "Іспанський золотий запас"
 lar_spain.61.a:0 "Вони ще самі не зрозуміли, як помиляються."
 lar_spain.65.a:0 "Чудові новини!"
 lar_spain.66.t:0 "[From.GetNameDefCap] відкидає прохання про допомогу"
 lar_spain.69.a:0 "Це дуже хороші новини"
 lar_spain.7.t:0 "Повстання карлістів!"
 lar_spain.77.desc2:0 "Сьогодні король Альфонсо XIII несподівано помер у Мадриді після сильних болів у грудях. Тіло короля буде виставлено в мадридській церкві Святого Ієроніма, щоби народ зміг попрощатися з ним перед королівським похованням.\n\n, Раніше відрікся від успадкування трону у зв'язку зі своєю глухотою, лише через кілька годин після смерті батька знову заявив про свої права."
 lar_spain.78.t:0 "Помер Санхурхо"
 lar_spain.8.t:0 "Фашистський терор!"
 lar_spain.9.desc:0 "Після недавніх подій зростаюча незалежність анархістських комун досягла свого апогею. Анархісти та їхні союзники з РПМО, розлючені нашими розсудливими спробами утримати централізований контроль над основними елементами нашої спільної військової економіки, перейшли від місцевих розбіжностей нашими військами.\n\nНезважаючи на свій локальний характер спочатку, сутички поширилися і тепер ставлять під загрозу цілісність наших з націоналістами фронтів."
 lc_high_velocity_cannon_turret_desc:0 "Башта, оснащена високошвидкісною гарматою для ураження ворожої бронетехніки. Її невеликі розміри дозволяють швидко і оперативно надавати вогневу підтримку проти легкої бронетехніки."
 lc_radio_1:0 "$tank_radio_1$"
 liangguang_clique_autonomy_sea_integrated_warlord_subject_DEF:0 "Провінція Лянгуан"
 liangguang_clique_democratic:0 "Лянгуанська федерація"
 liangguang_clique_fascism_ADJ:0 "Кантонськ"
 liberate_central_african_republic:0 "Звільнити державу [CAR.GetName]"
 liberate_congo_brazzaville_desc:0 "$liberate_angola_desc$"
 liberate_libya_desc:0 "$liberate_angola_desc$"
 liberate_rwanda:0 "Звільнити державу [RWA.GetName]"
 liberate_territory_goal_desc:0 "Ворог володіє нашою територією. Визволення її має бути нашою першою метою."
 liberate_tunisia:0 "Звільнити державу [TUN.GetName]"
 liberate_western_sahara_desc:0 "$liberate_angola_desc$"
 light_tank_destroyer_equipment_3_desc:0 "$light_tank_destroyer_equipment_desc$"
 manpower_contribution_small:0 "Обмежені вимоги до гарнізону"
 marines_2_reward_2:0 "Increased Artillery Coordination"
 marines_commandoes_desc:0 "Наші морські піхотинці довели свою ефективність під час тривалих операцій у тилу ворога. Настав час закріпити цю практику в нашій доктрині й організувати війська на основі ефективних ударних дій."
 marines_commandos_demolition:0 "Експерти з піротехніки"
 mechanized_equipment_3_short:0 "Бронетранспорт III"
 men_of_timor:0 "Люди з Тімору"
 metropolis:0 "Метрополіс"
 mexico.10.desc:0 "Лідер [From.GetLeader] запросив державу [Root.GetNameDef] вступити до альянсу [From.GetFactionName]. Це правий блок країн, що захищають Латинську Америку від комуністичної загрози і які водночас ідуть шляхом, незалежним від занепадницьких американців."
 mexico.15.b:0 "Гори в пеклі, зраднику."
 mexico.43.desc:0 "Диктатор Мексики [From.GetLeader] безрозсудно посмів атакувати наші війська біля Панамського каналу з найближчого плацдарму. На щастя, нашим військам вдалося зірвати цю так звану операцію «Справедлива справа» і відкинути загарбників. Мексиканці не перетинають континент кордон США, так що це не прелюдія до генерального вторгнення, але їхня атака показала, що ми вже не господарі в цьому регіоні, і принизила нас на міжнародній арені."
 mexico.52.title:0 "[MEX.GetLeader] проголошує об'єднання всіх комуністичних рухів"
 mexico.9.b:0 "У нас інші плани на Мексику."
 midget_submarine_specialization:0 "Піонери карликових підводних човнів"
 military_idea_desc:0 "Ідеї про те, як має функціонувати армія країни."
 military_youth:0 "Мілітаризована молодь"
 mio_cat_eq_only_tactical_bomber:0 "Тактичні бомбардувальники"
 mio_cat_tech_all_armor_and_modules:0 "Усі технології бронетехніки"
 mio_cat_tech_heavy_armor_and_modules:0 "Технології важкої бронетехніки"
 mio_policy_NOR_general_permanent_industrial_revolution:0 "Вічна промислова революція"
 mio_policy_general_vertical_integration:0 "Вертикальна інтеграція"
 modifier_army_sub_unit_armored_car_recon_max_org_factor_tt:0 " $modifier_army_sub_unit_armored_car_recon_max_org_factor$: $RIGHT|+=%1$"
 modifier_army_sub_unit_long_range_patrol_support_defence_factor_tt:0 " $modifier_army_sub_unit_long_range_patrol_support_defence_factor$: $RIGHT|+=%1$"
 modifier_experience_gain_battleship_mission_factor:0 "Приріст досвіду лінкорів від завдань"
 modifier_production_speed_bunker_factor_desc:0 "Модифікатор швидкості будівництва наземних укріплень."
 modifier_production_speed_synthetic_refinery_factor_desc:0 "Модифікатор швидкості будівництва синтетичних НПЗ."
 modifier_state_production_speed_air_base_factor_desc:0 "Модифікатор швидкості будівництва §Y$air_base_pl_gen$§! у цій області."
 modifier_state_production_speed_radar_station_factor_desc:0 "Модифікатор швидкості будівництва §Y$radar_station_pl_gen$§! у цій області."
 motorised_infantry:0 "Моторизована піхота"
 motorized_military_police_desc:0 "Підтримка порядку та придушення опору на окупованих територіях, а також ведення розвідки в зонах активних бойових дій."
 mtg_britain.1000.a:0 "Король мертвий. Хай живе королева!"
 mtg_britain.105.a:0 "Зосередимося на більш досяжній меті."
 mtg_britain.105.d:0 "Не знайшовши одностайної підтримки, ідея імперської федерації зазнала поразки. Оскільки інтерес до цієї альтернативи самоврядування, схоже, слабшає, то це питання безумовно буде виключено з порядку денного майбутніх імперських конференцій. Натомість ми продовжимо розробляти план з надання повної незалежності."
 mtg_britain.73.t:0 "Громадянська війна в Індії"
 mtg_britain.8.d:0 "Нещодавня стаття в [GETUKANTIKINGNEWSPAPER] нагадує про обов'язки короля перед своєю країною і народом, стверджуючи, що його статус і привілеї приходять з тягарем обов'язків, і тому він повинен пожертвувати або своїм шлюбом, або короною."
 mtg_britain.83.c:0 "Витратити значні дипломатичні зусилля на те, щоби переконати домініони."
 mtg_britain.89.t:0 "Імперська конференція: торгівля — [From.GetName] погоджується"
 mtg_britain.94.t:0 "Імперська конференція: економіка — [From.GetName] відмовляється"
 mtg_netherlands.23.t:0 "[From.GetNameDefCap] приймає передачу Вест-Індії"
 mtg_netherlands.31.a:0 "Вони переоцінюють наш промисловий потенціал..."
 mtg_netherlands.37.desc:0 "[From.GetNameDefCap] відмовляється поділитися своїми розвідувальними даними."
 mtg_netherlands.69.d:0 "Не бачачи необхідності затоплювати Голландську водну лінію, місцеве населення почало закликати до осушення сільських земель, щоб люди могли повернутися до повсякденного життя. Неприйняття цих вимог, швидше за все, лише призведе до подальших хвилювань."
 mtg_news.14.b:0 "Нас чекає незалежність."
 mtg_news.15.t:0 "Деколонізація Британської імперії"
 mtg_news.16.t:0 "[From.GetName] не визнає умиротворення"
 mtg_news.32.t:0 "[ENG.GetName] приводить до влади лоялістський [From.GetAdjective]ий уряд"
 mtg_news.46.b:0 "До чого вони зухвалі."
 mtg_news.51.desc:0 "Зараз, коли ослабли Люксембург і Бельгія, держава [ENG.GetNameDef], очевидно, піддалася [From.GetAdjective] закликам відновити постнаполеонівську «буферну державу» в цьому регіоні. Британці погодилися передати звільнену державу [From.GetNameDef]. Поки неясно, чи допоможе це нідерландцям підтримувати внутрішню стабільність."
 mtg_news.53.b:0 "Смілива ініціатива."
 mtg_news.6.a:0 "Нарешті все це закінчилося."
 mtg_usa_civil_war_democrats.21.t:0 "Повстання охоплює Західне узбережжя"
 mtg_usa_civil_war_democrats.22.a:0 "Вони і повинні були так вчинити."
 mtg_usa_civil_war_democrats.27.a:0 "Прекрасно, тим менше потрібно буде захищати марні пустелі."
 mtg_usa_civil_war_democrats.29.t:0 "Захід Середнього Заходу виходить із Союзу"
 mtg_usa_civil_war_fascists.13.desc:0 "Губернатор штату [usa_ng_mobilized.GetName] заявив про мобілізацію Національної гвардії для того, що він назвав «тривалим періодом тренувань і вправ». Військове міністерство заявляє, що не знає про жодні запланові операції в штаті [usa_ng_mobilized.GetName].\n\n Також схоже, що загони Національної гвардії видали велику кількість припасів та бойових зарядів, і це викликає питання, до чого вони взагалі готуються."
 mtg_usa_foreign_support.1.b:0 "Ми не можемо собі нічого дозволити."
 mtg_usa_foreign_support.6.t:0 "[From.GetLeader] відмовляє у підтримці"
 mtg_usa_foreign_support.8.a:0 "Нехай залякаються наші вороги!"
 mtg_usa_pacific_pacification.2.desc:0 "Уряд лідера [From.GetLeader] прийняв нашу пропозицію. Було створено особливий спільний комітет для координації деталей угоди."
 mtg_usa_protect_south_america.3.b:0 "Війна лише посилить дестабілізацію регіону."
 mtg_usa_secure_asia.1.b:0 "Краще померти, міцно стоячи на ногах."
 mtg_usa_secure_asia.1.t:0 "[USA.GetNameDefCap] чинить тиск"
 mtg_usa_secure_asia.3.b:0 "Зрештою, вони нічого не означають."
 mtg_usa_secure_asia.5.desc:0 "Виступаючи сьогодні перед представниками преси, [From.GetLeader] оголосив про те, що його уряд підписав договір з державою [USA.GetNameDef], погодившись розділити контроль над Вест-Індією.\n\nДоговір містить ряд секретних положень, згідно з якими ми отримаємо контроль одразу ж, як тільки на місце прибуде наша адміністрація. Держдепартамент уже відправив у цей регіон низку чиновників."
 mtg_usa_strategic_interests.3.a:0 "Побачимо, чи зможуть вони захистити ці землі!"
