 ARG_unify_south_america_desc:0 "На континенті Південної Америки є низка країн, які здійснили власні революційні рухи та створили комуністичні уряди. Якщо ми хочемо залишатися сильними, ми повинні об'єднатися. Настав час звернутися до цих націй та попросити їх приєднатися до нашого інтернаціоналу."
