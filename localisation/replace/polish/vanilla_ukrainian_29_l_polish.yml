 CHI_coastal_patrol_planes_desc:0 "Наше велике узбережжя можна ефективно контролювати лише з повітря. Сучасна морська бомбардувальна авіація дозволить нам захистити берегову лінію без зайвої витрати ресурсів."
 CHI_communist_administrators:0 "Комуністичні адміністратори"
 CHI_communist_infiltration_in_shanxi:0 "Комуністичне проникнення в Шаньсі"
 CHI_communist_infiltration_none:0 "\n§HМи ще не знайшли слідів комуністичного проникнення.§!"
 CHI_dagu_shipyard_organization_sea:0 "$CHI_dagu_shipyard_organization$"
 CHI_demand_mongolia_desc:0 "Монголія знаходиться між нами та Росією і може будь-якої миті пасти жертвою радянської агресії. Ми маємо діяти швидше."
 CHI_draw_support_from_the_big_families_desc:0 "У Китаї є кілька дуже впливових родин у різних секторах. Хоча це може і не сприяти стабілізації країни, ці зв'язки все ж можна використати для досягнення наших цілей."
 CHI_end_military_primacy:0 "Кінець військового примату"
 CHI_expand_the_bureaucracy_desc:0 "Наша країна величезна, і управління нею вимагає багато зусиль і людей. З нашою розширеною освітньою базою ми тепер можемо працевлаштувати більше людей у державному апараті та посилити наш контроль над більш віддаленими частинами країни."
 CHI_extend_compulsory_education_desc:0 "Грамотне населення є основою національного розвитку, але, на жаль, наші освітні зусилля були поверхневими і занадто зосередженими навколо міських районів. Це призвело до того, що сільське населення залишилося поза увагою, готове до того, що хтось інший займе місце держави."
 CHI_fighter_equipment_3:0 "CAMCO P12"
 CHI_find_foreign_financiers_desc:0 "Хоча потенціал нашої економіки безмежний, її нинішній стан означає, що розбудова займе час, якщо ми будемо робити це самотужки. Швидшим способом прискорити нашу економіку було б залучення зовнішнього капіталу в країну через спільні підприємства. Ми повинні шукати за кордоном людей, здатних побачити можливості китайської нації."
 CHI_forced_conscription_desc:0 "Наші поточні методи вербування не забезпечують достатню притоку солдатів. Поразка у війні стане кінцем нашої нації, тому ми змушені просити від свого народу ще більших жертв."
 CHI_french_military_mission_desc:0 "Французька армія — одна з найбільш навчених у Європі. Ми можемо багато чого навчитися у французів."
 CHI_heavy_tank_artillery_equipment_1:0 "PLZ 34 D"
 CHI_industrial_evacuations_from_beijing:0 "Евакуація промисловості з Пекіну"
 CHI_industrial_evacuations_from_hubei:0 "Евакуація промисловості з Хубею"
 CHI_institute_cross_border_raids_desc:0 "Щоб вважатися повноправними претендентами на владу в Китаї, ми маємо показати всьому світу, що ми здатні боротися за свої землі. Провівши кілька невеликих рейдів, ми продемонструємо всім свою рішучість і заразом, можливо, зможемо окупувати погано захищені території."
 CHI_know_thy_enemy_tt:0 "Розблоковує покращену версію «Силової атаки», яка не втрачає окопаності під час атаки."
 CHI_land_reform_desc:0 "Комуністи проводять агресивну програму перерозподілу земель, завойовуючи цим підтримку селянських верств населення. Нам слід замислитись про проведення менш радикальної програми, щоб також залучити населення на свій бік."
