 FIN_a_cry_for_help_desc:0 "Ліга Націй не виконала свій обов'язок захистити країни-члени від конфлікту. Але за кордоном все ще є ті, хто може почути наш крик про допомогу та прийти нам на допомогу. Принаймні ми на це сподіваємося."
