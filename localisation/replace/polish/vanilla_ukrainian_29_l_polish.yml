 DEN_offer_protection_desc:0 "Для подальшого посилення нашого впливу та могутності в Скандинавському регіоні та навколо Балтійського моря ми повинні створити Данську гегемонію, пропонуючи належний захист тим, хто його потребує. Захист наших північних і балтійських братів зміцнить безпеку в усьому регіоні і піде на користь усім нам."
 DEN_pan_scandinavianism_decisions_category:0 "Розпалити панскандинавський рух"
 DEN_potential_fuel_silos_tt:0 "З §YFuel Storage§! вивченим, додати §G1§! комірку для будівництва і §G1§! §YFuel Silo§! в §Y2§! Областях."
 DEN_protect_the_faroe_islands_desc:0 "Зі зростанням світової напруженості в Північному морі незабаром можуть виникнути серйозні конфлікти. Фарерські острови є життєво важливою ланкою в нашій здатності здійснювати контроль над Гренландією та її численними ресурсами. Втрата цього архіпелагу може виявитися для нас руйнівною, тому надзвичайно важливо, щоб ми забезпечили його оборону."
 DEN_return_occupied_territory_category:0 "Повернення окупованих територій"
 DEN_ship_anti_air_2:0 "20mm/60 RK Madsen M41"
 DEN_torpedofly_desc:0 "Єдиний спосіб утримати наші заморські володіння — це спроможність проєктувати нашу силу і волю на водні простори. Це вимагатиме масштабної координації та стратегії військово-морських і військово-повітряних сил."
 DEN_undermine_overlord_continuous_focus_desc:0 "Ми повинні робити все можливе, щоб чинити опір і підривати наших володарів, щоб забезпечити суверенітет Данії."
