 DOCTRINE_MASTERY:0 "£doctrine_mastery $VALUE|H0$"
 DOCTRINE_TRACK_STRIKE_AIRCRAFT:0 "Ударна авіація"
 DOD_hungary.105.desc:0 "\nЗа чутками, [From.GetLeader] перебуває у сказі через наш план щодо розділу держави [CZE.GetNameDef]. Нас назвали «відсталою країною, яка й гадки не має про сучасні реалії». \n\nЗайве говорити, що наша пропозиція була відкинута."
 DOD_hungary.114.desc:0 "На загальний подив, [ROM.GetLeader] пропонує розділити повноваження з Румунською комуністичною партією, якщо ми у відповідь гарантуємо цілісність їх кордонів. Це чудова можливість посилити наш вплив у регіоні, не починаючи війну."
 DOD_hungary.116.t:0 "[SOV.GetLeader] відповідає на пропозицію"
 DOD_hungary.144.b:0 "Звернутися до провідної держави за підтримкою."
 DOD_hungary.148.t:0 "Провал Бледської конференції"
 DOD_hungary.160.desc:0 "Як показало дослідження, проведене міністерством оборони, наші ВПС погано укомплектовані для підтримки наземних сил. Найгірша ситуація склалася з авіаударами на великій дальності та повітряною підтримкою. Уряд виділив кошти на прискорену програму випуску сучасних бомбард вирішити, який тип літака краще."
 DOD_hungary.20.a:0 "Ми не дозволимо, щоби нас втягнули в цей конфлікт."
 DOD_hungary.3.t:0 "Провал референдуму"
 DOD_hungary.44.desc:0 "Щойно мова зайшла про війну, уряд Угорщини відразу став більш дружнім. Нашого посла запросили на закриту вечерю, під час якої [HUN.GetLeader] запевнив його, що [HUN.GetNameDef] прагне миру і Будь-які висловлювання охочих до сенсацій преси не слід приписувати уряду Угорщини, який ніколи не бажав війни."
 DOD_hungary.46.t:0 "[From.GetNameDefCap] повідомляє про свій нейтралітет"
 DOD_hungary.5.t:0 "Поразка на референдумі"
 DOD_hungary.51.t:0 "[ROM.GetNameDefCap] передає Трансільванію"
 DOD_hungary.7.b:0 "Громадяни погодилися"
 DOD_hungary.83.t:0 "[SLO.GetName] благає про допомогу"
 DOD_hungary.84.b:0 "Тоді ми виконаємо їхні вимоги."
 DOD_romania.111.desc:0 "Німецький уряд схвалив запропоновані нами чорновий варіант договору та демаркаційні лінії. Залишилося лише відправити ультиматум до Праги."
 DOD_romania.115.t:0 "[CZE.GetLeader] пручається"
 DOD_romania.163.t:0 "Кодряну помер"
 DOD_romania.70.t:0 "Розділ Югославії"
 DOD_romania.86.b:0 "Реформувати процес."
 DOD_romania.999.desc:0 "Сьогоднішню стратегічну нараду перервав п'яний і розчулений король Кароль II, щоби розповісти всім про «геніальну» ідею, що осяяла його вчора ввечері.\n\nКороль, який завжди мав славу романтика, зі сльозами на очах оголосив про те, що хоче показати всім дорогим його серцю жінкам, як палко він їх любить. Звернувшись до начальників штабів і міністрів з довгою, хоч і плутаною промовою, він закликав їх найщиріші почуття і завершив свій монолог проханням перейменувати два найбільших ворожих міста на честь найяскравішого почуття, яке є у людей, — любові.\n\nСхоже, ця ідея міцно засіла у голові короля, і його навряд чи вдасться переконати."
 DOD_yugoslavia.21.t:0 "[From.GetNameDefCap] погоджується продати винищувачі"
 DOD_yugoslavia.3.a:0 "Вони глибоко помиляються."
 DOD_yugoslavia.35.desc:0 "На нещодавній зустрічі в Берггофі [GER.GetLeader] та [YUG.GetLeader] обговорили поточну ситуацію в Європі та нашу участь у ній. [GER.GetLeader] наполягає на тому, що Югославія повинна приєднатися до однієї зі сторін масштабного конфлікту, що насувається. Крім того, Німеччина не потерпить сусідства з країною, яка дотримується нейтралітету. \n\nБуло б ідеально, уклав він, якби Югославія вибрала союзників, щоб усім показати, на чиєму боці."
 DOD_yugoslavia.701.tripartite_rejection:0 "[FROM.GetLeader] відповідає на [ROOT.GetAdjective] пропозицію підписати Троїстий пакт відмовою, заявляючи, що його країна має «інші ідеї» щодо майбутнього нашої держави."
