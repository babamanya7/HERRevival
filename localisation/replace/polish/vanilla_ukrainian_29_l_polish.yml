 SWI_tighten_press_censorship_desc:0 "Тут немає місця для помилок, одне слово може бути різницею між виживанням конфедерації та її відходом у забуття. Ми не можемо дозволити вільній пресі поставити під загрозу наше майбутнє, її потрібно жорстко контролювати саме так, як того вимагає [?SWI.SWI_biggest_fascist.GetNameDef]."
