 poland.13.t:0 "[From.GetNameDefCap] сподівається на [faction_invitee_target.GetAdjective]у співпрацю"
 poland.1302.d:0 "Схоже, що [From.GetLeader] вірить у необхідність [faction_invitee_target.GetAdjective]ого союзу менше, ніж [Root.GetLeader]. Неясно, яка точна причина такої недовіри, але [From.GetAdjective]ий уряд, вочевидь, вважає, що [faction_invitee_target.GetNameDef] скоріш є перешкодою, ніж благом для виживання союзу [From.GetFactionName]."
 poland.4.d:0 "Незважаючи на наші зусилля вирішити суперечку з державою [FROM.GetNameDef] мирним шляхом, вони відмовилися поступитися своїми східними землями Та поставили нас у становище, коли єдиним варіантом узяти їх є війна. Очевидно, що ця неспокійна країна не уникне розподілу, навіть якщо їй дадуть таку можливість."
 political.13.a:0 "Для початку ми можемо обговорити це всередині."
 political.2.d:0 "Хоча партійна лінія [Root.GetRulingParty] полягає в тому, щоби рішуче протистояти революційному соціалізму, пильно стежачи за радикальними лівими елементами в країні, декотрі особи в уряді більш відкриті до такої можливості. Принаймні, вони бачать можливість вирішити проблеми людей, які шукають рішення у комуністів, без ризику повномасштабної громадянської війни.\n\nХоча ті, хто залишається вірним [Root.GetLeader], можуть уважати їх зрадниками, ці голоси дисидентів можуть бути тими, хто забезпечить відносно безкровний перехід, якщо революція прийде."
 political.20.c:0 "Якщо ми приймемо референдум, мабуть, зможемо зберегти нашу спадщину."
 political.22.d:0 "Після того, як їхній запит на проведення референдуму був відхилений, нечисленні реформатори комуністичного руху в державі [Root.GetName] швидко втратили вплив на користь більш радикальних елементів. Із відмовою [Root.GetRulingParty] визнати громадську підтримку запропонованих реформ, романтичний погляд на революцію поступово став більш поширеним, а лідерами руху стали ті, хто найлегше міг підняти бунт. Ці заворушення переросли в повномасштабну громадянську війну, на кону якої стоїть майбутнє нації."
 political.24.t:0 "Фашисти висміяні"
 potential_war_with_turkey_tt:0 "§RЯкщо ми погодимося взяти участь, є значний шанс, що в найближчому майбутньому нас втягнуть у війну з державою [TUR.GetNameDef] в обмін на його території§!."
