 SEA_PRC_misc_events.13.d:0 "Не давати їм нічого!"
 SEA_PRC_misc_events.14.t:0 "[FROM.GetNameDefCap] погоджується"
 SEA_PRC_misc_events.3.desc:0 "$PRC_pavel_mif$, колишній наставник 28 ½ більшовиків та високопоставлена фігура як у Комуністичній партії Китаю, так і в Московському університеті імені Сунь Ятсена, був заарештований і підданий чистці в [SOV.GetNameDef]. Схоже, зв'язки Міфа з колишніми суперниками Сталіна виявилися фатальними."
 SEA_PRC_political_events.10.t:0 "[FROM.GetName] відмовляється підписати пакт про ненапад"
 SEA_PRC_political_events.11.desc:0 "[FROM.GetLeader] надіслав телеграму [Root.GetLeader], офіційно вимагаючи незалежності [FROM.GetName]. У телеграмі не сказано, що станеться, якщо ми відмовимо, але безпечніше припустити, що вони не будуть щасливі."
 SEA_PRC_political_events.24.desc:0 "\nПочувши про місію $SOV_vasily_chuykov$ та $SOV_aleksandr_cherepanov$ до [CHI.GetNameDef], [FROM.GetNameDef] висловив зацікавленість також прийняти їх як аташе. [FROM.GetNameDefCap], схоже, звернув увагу на практичні навички командирів, що поєднують вільне володіння китайською мовою з великим військовим досвідом, або, можливо, вони просто хочуть позбавити [CHI.GetName] цього досвіду."
 SEA_PRC_political_events.25.a:0 "Втрата для нашої армії"
 SEA_PRC_political_events.41.desc:0 "Політичні суперники протягом багатьох років, $PRC_mao_zedong$ і $PRC_zhang_guotao$, зустрілися в [ROOT.Capital.GetName], щоб відкласти свої розбіжності перед обличчям нашої небезпечної ситуації. Хоча жоден з них не довіряє іншому повністю, ворог нашого ворога — справді друг."
 SEA_PRC_political_events.9.desc:0 "Після ретельного обговорення [FROM.GetNameDef] вирішив підписати запропонований нами пакт про ненапад. На щастя, вони, схоже, не зацікавлені у втягуванні в конфлікти в регіоні."
 SEA_PRC_request_aid.11.desc:0 "[FROM.GetNameDefCap] відмовився підписати угоду про технологічну співпрацю, посилаючись на необхідність пріоритетного задоволення внутрішніх потреб. Хоча вони співчувають нашій справі, вони не можуть виділити жодних ресурсів для цього починання."
 SEA_PRC_request_aid.21.a:0 "Це чудові новини, ми знайдемо їм чудове застосування!"
 SEA_PRC_request_aid.31.e:0 "Відхилити запит [FROM.GetNameDef]"
 SEA_border_incidents_events.4.desc:0 "В рамках ескалації напруженості між нами та [FROM.GetNameDef] після наших суперечок щодо прикордонних сіл, таких як Тауран, схоже, що вони зараз перекидають війська в цей район, щоб штурмувати наш гарнізон, який ми розмістили в регіоні. Ми повинні підготуватися захищати регіон до останнього і вигнати загарбників із законної [ROOT.GetAdjective]ої землі!"
 SEA_china.11.desc:0 "Ми отримали відповідь від лідера [FROM.GetFactionName], і епоха зосередження на власному куточку світу закінчилася. Уряд [FROM.GetNameDef] прийняв нас з розпростертими обіймами, і тепер ми можемо зайняти своє місце у світі на рівних умовах."
 SEA_china.12.desc:0 "Лідери [FROM.GetFactionName] відхилили нашу пропозицію об'єднати зусилля. Це була можливість принести мир і стабільність у світ, але, на жаль, дехто виступає проти таких речей."
 SEA_china.3.a:0 "Чого ще ми могли очікувати"
 SEA_china.6.a:0 "Битися за виживання країни!"
 SEA_china_democratic.16.t:0 "[FROM.GetNameDefCap] інвестує в нашу економіку"
 SEA_china_democratic.6.t:0 "[FROM.GetNameDefCap] розпалює республіканські настрої"
 SEA_generic_events.10.desc:0 "Зростання популярності опозиційних рухів, таких як [GetOppositionPartyName], змусило уряд вдаватися до дедалі креативніших заходів, щоб залишитися при владі. Одну з таких схем нещодавно було викрито, і масштаб ресурсів, витрачених на утримання [ROOT.GetRulingParty] при владі, викликав серйозну негативну реакцію."
 SEA_generic_events.12.b:0 "Запевнити їх, що ми прагнемо досягти миру"
 SEA_imperial_influence_events.120.desc:0 "Армія висунула свої вимоги. Не маючи централізованого контролю та автономії діяти самостійно, вони бажають, щоб на посаду було призначено нового командувача армії, що також послужить посиленню їхнього впливу на [GetImperialInfluenceRulerTitle]. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.320.desc:0 "Лідери Дзайбацу висунули свої вимоги. Схоже, вони бажають, щоб принаймні один з їхніх членів увійшов до консультативної ради [GetImperialInfluenceRulerTitle], аби вони могли керувати індустріалізацією та курсом нації. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.400.desc:0 "Цивільний уряд намагався посилити свій вплив на [GetImperialInfluenceRulerTitle], але через свої недоліки йому це не вдалося. Через це вони втратили обличчя, а отже, і престиж, що означає зменшення їхнього впливу."
 SEA_imperial_influence_events.501.desc:0 "Через невиконання планів, розроблених для реалізації доктрини «Південного удару» у час, відведений нам штабом флоту, схоже, що багато морських офіцерів, які брали участь у спробі тиску на [ROOT.GetLeader], подали у відставку."
 SEA_japan.1.b:0 "Настав час повернутися до традицій!"
 SEA_japan_foreign_policy.100.b:0 "Мені це звучить підозріло..."
 SEA_japan_foreign_policy.114.a:0 "Зарозумілі західняки..."
 SEA_japan_foreign_policy.130.a:0 "Тоді ми повинні повернути нашу територію силою!"
 SEA_japan_foreign_policy.131.desc:0 "Після нещодавніх закликів [FROM.GetAdjective]ого уряду та агітаторів, таких як Пак Хон Йон, здається, що [ROOT.GetAdjective]ий пролетаріат втомився чекати мирної зміни влади. Після напружених дискусій, схоже, дипломатія зазнала краху, і почався збройний конфлікт, а сили Хон Йона вже захопили контроль над південними частинами країни."
 SEA_japan_foreign_policy.134.t:0 "[FROM.GetLeader] відхиляє наші вимоги"
 SEA_japan_foreign_policy.2.a:0 "Імператору буде приємно це почути"
 SEA_japan_foreign_policy.24.desc:0 "Наші офіцери повідомили, що [FROM.GetAdjective]им агентам, схоже, вдалося встановити контакт із Тубтеном Кунпхелою, дворянином, який має велику владу і якого свого часу прозвали «Силачем Тибету». Далі все може обернутися для нас кепсько..."
 SEA_japan_foreign_policy.28.t:0 "[FROM.GetNameDefCap] передає монгольські землі"
 SEA_japan_foreign_policy.54.t:0 "[FROM.GetAdjective]а зброя наповнює чорні ринки"
 SEA_japan_foreign_policy.59.a:0 "Процвітання вже близько!"
 SEA_japan_foreign_policy.68.t:0 "Проголошення Другої Філіппінської Республіки"
 SEA_japan_foreign_policy.73.b:0 "Тоді ми повинні отримати захист Японії замість них!"
 SEA_japan_foreign_policy.73.desc:0 "Наші союзники пішли зі Східної Азії, капітулювавши перед вимогами [JAP.GetNameDef]. Це ставить нас у дуже вразливе становище. Шукати нових союзників чи продовжувати боротьбу проти [JAP.GetAdjective]их сил?"
 SEA_japan_foreign_policy.77.t:0 "[FROM.GetNameDefCap] приймає повну інтеграцію"
 SEA_japan_foreign_policy.80.t:0 "Асоціація Конкордія погоджується"
 SEA_japan_foreign_policy.88.desc:0 "[FROM.GetLeader], лідер [FROM.GetNameDef], сьогодні погодився на повну інтеграцію до нашої нації. Це означає, що наш уряд нарешті зможе отримати повний контроль навіть над місцевими дивізіями наших маньчжурських регіонів."
 SEA_japan_foreign_policy.88.t:0 "Анексія [FROM.GetNameDef]"
 SEA_japan_foreign_policy.93.t:0 "[FROM.GetLeader] підписує угоду про співпрацю"
 SEA_japan_popup_events.9.b:0 "Аракі правий, і ми повинні прийняти ці ідеї"
 SEA_japan_tokko_arrest_events.3.desc:0 "Токко виявила ще одну загрозу нашій внутрішній стабільності. Багато співробітників Відділу розслідувань Південно-Маньчжурської залізниці були заарештовані вже двічі військовою поліцією Квантунської армії; їх утримують за підозрою в поширенні антияпонської та комуністичної пропаганди в наших колоніях. Також здається, що вони займалися соціальними дослідженнями та аналізом, використовуючи марксистські методи, які раніше були заборонені в Метрополії. Ця змова може бути дуже глибокою, як нам вчинити?"
 SEA_warlords.16.a:0 "$wtt_political_warlord_support.13.a$"
 SEA_warlords.16.t:0 "$wtt_political_warlord_support.13.t$"
 SEA_warlords.25.t:0 "[From.GetLeader] відмовляється"
 SEA_warlords.34.b:0 "Відправити його до Гуанчжоу для обговорення Об'єднаного фронту"
 SEA_warlords.34.desc:0 "Після серії провокацій дві провінції, Гуансі та Гуандун, об'єдналися під приводом того, що ми надто пасивні проти японців, і, таким чином, поставили під сумнів наше правління. Вони стверджують, що якщо ми не діятимемо, вони виступлять проти наших сил і заберуть Нанкін собі. Хоча вони запропонували Чану Кайші прибути до Гуанчжоу для подальшого обговорення дій проти японців, незрозуміло, чи не є це пасткою."
 SEA_warlords.41.t:0 "Кліка Гуансі чинить опір"
 SEA_warlords.43.desc:0 "Після боягузливої втечі Хань Фуцзюя з Цзінаня у розтерзаній війною провінції Шаньдун утворився вакуум влади. Вирішивши не втручатися, а призначити Сунь Тунсюаня тимчасовим губернатором, Центральний уряд залишив вибір подальших дій за нами."
 SEA_warlords.54.a:0 "Чудові новини!"
 SEA_warlords.66.t:0 "[FROM.GetLeader] передає Киргизстан"
 SEA_warlords.69.desc:0 "Потрапивши під контроль ворожих сил, Хебей-Чахарська політична рада, яка діяла як місцева автономія для виконання вимог щодо регіональної демілітаризації, висунутих Японією в рамках угоди Хе-Умедзу, більше не виконує жодної реальної мети. Можливо, настав час приборкати їхнє керівництво і підпорядкувати їхні сили центральному уряду."
 SEA_warlords.7.a:0 "Принаймні це хоч щось"
 SEA_warlords.72.t:0 "Aid Arrives from [FROM.GetNameDef]"
 SELECT_SUB_DOCTRINE_PROMPT:0 "§GКлацніть§!, щоб обрати §Hпіддоктрину§!."
 SELLER_TRIGGER:0 "Продавець — $COUNTRY|Y$"
 SEND_PING_TOOLTIP:0 "§GCtrl + Alt + клацніть§!, щоби надіслати сигнал союзникам."
 SER_democratic:0 "Сербія"
 SET_FACTION_MANIFEST_EFFECT:0 "Змінює маніфест альянсу $FACTION|H$ на $GOAL|H$."
 SHIPS_THAT_AR_BEING_REPAIRED_IN_ALLY_INFO:0 "Кораблі, які ремонтуються на морській базі іншого союзника, будуть використовувати його доки для ремонту."
 SHIP_DESIGNER_NAVAL_DOMINANCE_NAME:0 "§YПанування на морі§!"
 SHIP_REFIT_CONFIRM_DESCRIPTION:0 "§HПереобладнати вибрані кораблі ($COUNT$) під дизайн корабля $VARIANT_NAME|H$.§!\n\nКораблі повернуться на найближчу §Hморську базу§! та будуть заблоковані там до завершення процесу. З максимальною кількістю призначених §Hверфей§! це займе до $DAYS|H$ дн.\n\nЯкщо §Hморська база§!, де вони ремонтуються, буде розбомблена, прогрес ремонту буде зменшено. Якщо базу захоплять, кораблі будуть узяті ворогом.\n\nВи справді хочете переобладнати кораблі?"
 SHL_DEF:0 "Шлезвіг"
 SHX_fighter_equipment_0_short:0 "Type 3"
 SHX_heavy_tank_aa_equipment_3_short:0 "PGZ 43 D"
 SHX_heavy_tank_destroyer_equipment_3:0 "PTZ 43 D"
 SHX_light_tank_aa_equipment_3:0 "PGZ 41"
 SHX_super_heavy_tank_equipment_1:0 "Type 44"
 SIA_BLITZKRIEG_DESC:0 "З моменту приходу до влади наприкінці 1938 року прем'єр-міністр Пібунсонкрам переробив Сіам за своїм образом і подобою. Країна має нову назву — Таїланд — і нове кредо: військову дисципліну, пантайський націоналізм і територіальні амбіції, спрямовані на тайськомовні народи, які все ще перебувають під французьким та британським колоніальним правлінням.\n\nПоки Європа скочується до війни, а Японія заглиблюється в Китай, армія Фібуна з кожним днем міцніє. Його амбіції не є секретом. Питання лише в тому, поруч з ким стоятиме Таїланд, коли настане цей момент."
 SIA_a_fledgling_tobacco_industry:0 "Зародження тютюнової промисловості"
 SIA_a_land_war_in_asia:0 "Наземна війна в Азії"
 SIA_a_land_war_in_asia_desc:0 "Війну не виграти лише деклараціями. Сіамські солдати повинні маршувати, битися і терпіти на складній місцевості Азії. Наша відданість Об'єднаному фронту має вимірюватися в діях."
 SIA_acquire_light_tools_desc:0 "Перш ніж ми зможемо створювати великі машини, ми повинні спочатку освоїти прості знаряддя промисловості. Імпорт легких інструментів та цехового обладнання дозволить розмножити невеликі фабрики та ремонтні майстерні по всій [ROOT.GetName]."
 SIA_as_the_eyes_turn_towards_southeast_asia_desc:0 "Південно-Східна Азія більше не є віддаленим театром дій. Це перехрестя імперій, революцій та воєн. [SIA.GetName] повинен вирішити, чи буде пішаком у цій боротьбі, чи державою з власними планами."
 SIA_built_to_withstand_every_flame_desc:0 "Фабрика, що згорає за одну ніч, не може служити нації на ранок. Наші склади, заводи та майстерні повинні будуватися з урахуванням розосередження, вогнестійкості та аварійного захисту, щоб саботаж, бомбардування або аварія не могли так легко паралізувати виробництво."
 SIA_chemical_imports_tt:0 "Додає §G+1§! позамапову §YЦивільну фабрику§!, якщо ставлення вище §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! на момент завершення цього фокусу."
 SIA_develop_southern_indochina:0 "Розвиток Південного Індокитаю"
 SIA_divert_army_funds_to_navy_toggle_do:0 "Спрямувати кошти армії на флот"
 SIA_divert_army_funds_to_navy_toggle_undo:0 "Припинити спрямовувати кошти армії на флот"
 SIA_establish_the_foundry_and_machine_shop_desc:0 "Суверенний флот вимагає більшого, ніж просто корпуси, зібрані з імпортних деталей. Створивши власне ливарне виробництво та механічний цех, ми зміцнимо промислові м'язи, які дозволять [ROOT.GetNameDef] відливати, формувати та ремонтувати життєво важливі компоненти військових кораблів вдома."
 SIA_expand_aircraft_workshops:0 "Розширення авіаційних майстерень"
 SIA_facilitate_prajadhipoks_move_to_japan_desc:0 "Британія — не єдина держава, яка може отримати вигоду з потрясінь у [ROOT.GetNameDef]. Організувавши переїзд Прачадіпока до Японії, ми можемо забезпечити прихильність Токіо і, можливо, навіть гарантії того, що нам буде надана військова допомога, якщо повстання роялістів переросте у громадянську війну."
 SIA_fighter_equipment_3_short:0 "Ki-43"
 SIA_kasetsart_university_desc:0 "Якщо сільське господарство має стати продуктивнішим, воно повинно керуватися наукою, а не лише спадщиною. Університет Касецарт навчатиме агрономів, ветеринарів та технічних спеціалістів для модернізації сільського господарства."
 SIA_military_academies_indoctrination_desc:0 "Наші військові академії є ідеальними мішенями для ідеологічної підготовки. В цьому нам допоможуть інструктори, які забезпечать військову підготовку нашої молоді. Сильна армія, лояльна до правлячого класу, є основою будь-якої потужної держави, і цією державою будемо ми."
 SIA_military_oversight_bureau:0 "Бюро військового нагляду"
 SIA_national_defense_in_asia_tt:0 "§Y[ROOT.GetNameWithFlag]§! об'єднується з націоналістичними силами в Об'єднаному фронті.\nДодає §Y$SIA_national_defense_in_asia_idea$§!, що надає:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_national_savings_bond:0 "Національні ощадні облігації"
 SIA_recover_indochina:0 "Повернення Індокитаю"
 SIA_reduction_of_agricultural_yield_taxes_desc:0 "Не можна вимагати від селянства годувати королівство, фінансувати державу і терпіти всілякі труднощі без жодного полегшення. Знижуючи податки на сільськогосподарський врожай, ми залишаємо більше надлишку в сільській місцевості, зміцнюємо лояльність серед землеробів і стимулюємо до більшого виробництва з землі."
 SIA_siam_cement_group_desc:0 "Заснована під королівським патронажем, Цементна група [ROOT.GetName] є одним з найважливіших промислових підприємств [ROOT.GetNameDef]. Завдяки цільовим інвестиціям та урядовій підтримці компанія може перетворитися з внутрішнього постачальника на наріжний камінь нашої ширшої промислової потужності — заклавши фундамент, у буквальному сенсі, для майбутнього нації."
 SIA_submarine_2_desc:0 "The Vilun-class submarines were four small coastal subs built in Japan for the Royal Thai Navy between 1936 and 1938. They displaced 370 tons and were armed with five 533mm torpedo tubes."
 SIA_sue_the_king_in_exile_desc:0 "Ходять чутки, що король-вигнанець вивіз із собою досить багато цінностей до [ENG.GetNameDefCap]. Ми повинні повернути їх, і якщо для цього доведеться подати до суду на нього та його дружину, нехай так і буде."
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc:0 "$idea_SIA_cemented_control_3_desc$"
 SIA_to_forge_a_king_desc:0 "Король Ананда залишається далеко у Швейцарії, він достатньо молодий, щоб його розум і характер все ще формувалися. Якщо ми будемо обережно спрямовувати його навчання, ми все ще можемо викувати не просто короновану маріонетку, а правителя, який відповідає долі, яку ми готуємо для [ROOT.GetNameDef]."
 SIA_use_abandoned_french_tools:0 "Використання покинутих французьких інструментів"
 SIC_communism_party_long:0 "$CHI_communism_party_long$"
 SIC_the_governor_of_sichuan_desc:0 "Лю Сян, нинішній губернатор і племінник Лю Веньхуея, контролює найбагатшу і найважливішу частину Сичуаню. Ми повинні прагнути до її подальшого розвитку, одночасно покращуючи наші технологічні можливості, продовжуючи його реформи."
 SIC_the_sichuan_clique_desc:0 "Сичуанська кліка перебуває в цікавому становищі, будучи територією кількох по-різному налаштованих мілітаристів, яких слабко об'єднує ідея провінційної єдності. Ми повинні використати різні сильні сторони цих воєначальників, щоб зростати і ставати сильнішими, ніж ми є зараз."
 SIE_fascism:0 "Хунта Сьєрра-Леоне"
 SIK_a_new_xinjiang:0 "Новий Сіньцзян"
 SIK_autonomy_sea_integrated_warlord_subject_DEF:0 "Провінція Сіньцзян"
 SIK_ensure_a_clean_government_desc:0 "Одна з шести великих політик передбачає уряд, очищений від корупції, а також від заколотів. Ми повинні забезпечити стабільність уряду за будь-яку ціну, усуваючи всіх, хто може загрожувати правлінню [ROOT.GetLeader], використовуючи допомогу НКВС!"
