 sp_naval_super_heavy_battleship_unique_reward_b_desc:0 "Вищі військово-морські командири поставили перед нами нездійсненне завдання: зробити цей корабель практично невразливим. І хоча це неможливо, ми принаймні спробуємо наблизитися до цієї мети. Що цього разу стане нашим пріоритетом?"
