 improved_secondary_battery_desc:0 "Розмістивши допоміжне озброєння в поворотних баштах, можна значно розширити кути наведення ціною підвищення ваги та зниження стійкості корабля при сильному хвилюванні.\n\nУстановка модуля §Yдопоміжна батарея§! дає §Yкрейсеру§!, §Yавіаносцю§! або §Yважкому кораблю§! обмежену можливість обстрілу з легких знарядь і дозволяє йому атакувати в бою другу мету."
