 NO_MOD_TITLE:0 "Назва не вказана"
 NSB_poland_communist_events.1.b:0 "Місце Польщі — в СРСР."
 NSB_poland_communist_events.1.desc:0 "У комуністичній партії Польщі давно назріває конфлікт між тими, хто бажає союзу Польщі та СРСР, і тими, хто вважає, що зараз СРСР — такий самий імперіаліст, як і Росія в попередні союзи часи монархії.\" nАнтирадянський рух представляє Марія Кошутська, імовірно [Root.GetStalinistOrTrotskyite] Своїх прорадянських товаришів вона називає безхребетними ворогами революції.\nВладислав Гомулка, фактично виконуючий обов'язки лідера, представляє прорадянське крило партії. —за проросійською дипломатичною позицією.\nПартія контролює Польщу, але її члени розходяться у питанні про те, хто з кандидатів має стати лідером. У світлі їх нерішучості зростає тиск із Москви: там не тільки вимагають не допускати Кошутську до керівництва, а й стверджують, що вона повинна піти під суд як [Root.GetStalinistOrTrotskyite] і контрреволюціонер."
 NSB_poland_events.3.t:0 "[From.GetNameDefCap] пропонує укласти союз"
 NSB_poland_events.7.a:0 "Чудова пропозиція!"
 NSB_poland_events.7.desc:0 "Відновивши в Польщі демократію, новий уряд країни хоче посилити франко-польські зв'язки та створити союз із обох боків німецького кордону. Хоча Польща досі ослаблена після недавнього громадянського конфлікту державі [GER.GetNameDef], безсумнівно, важко буде вести війну відразу на два фронти."
 NSB_poland_royal_election.1.t:0 "Фрідріх Крістіан пред'являє претензії на трон"
 NSB_polish_fascist_events.204.desc:0 "Схоже, що Литва відповіла відмовою на наші розумні вимоги. Спроби знайти дипломатичне рішення успіхом не увінчалися — тепер справа за армією."
 NSB_soviet_civil_war_common.010_right_opposition:0 "Диктатуру повалено. Настав час розвінчати культ Сталіна, позбавити його послідовників об'єкта, що залишилися, для поклоніння і показати народу, що старі часи пішли безповоротно. Потрібно знести пам'ятники і перейменувати міста."
 NSB_soviet_civil_war_common.102.desc:0 "Сталося несподіване: [FROM.GetAdjective] уряд відхилив пропозицію передати йому порт і околиці Владивостока в обмін на активну підтримку у боротьбі зі Сталіним."
 NSB_soviet_civil_war_common.103.c:0 "Ми можемо хоча б купити для них трохи зброї."
 NSB_soviet_civil_war_common.113.desc_started:0 "Наші німецькі зв'язкові повідомляють, що підготовлене ними українське ополчення готове до бою. Війська оснащені і таємно переміщені до стратегічно важливих районів. Наказ до початку повстання відданий, і воно ось-ось почнеться."
 NSB_soviet_civil_war_common.121.a:0 "Якраз цього ми й чекали."
 NSB_soviet_fascist_tsarist.1.t:0 "Членство в Панслов'янському Союзі"
 NSB_soviet_fascist_tsarist.29.b:0 "Історія вже показала нам, що буває з тріумвіратами... Ми не згодні."
 NSB_soviet_fascist_tsarist.31.desc:0 "[JAP.GetName] з жалем повідомляє нам, що вважає [SOV.GetAdjective] пропозицію, що не відповідає його інтересам, тому союзу не буде."
 NSB_soviet_fascist_tsarist.6.t:0 "[FROM.GetNameDef] приєднується до альянсу [ROOT.GetFactionName]"
 NSB_soviet_foreign_politics_events.13.desc:0 "[FROM.GetAdjectiveCap]ий уряд несподівано відкинув наші настанови і відмовився слідувати плану, запропонованому нашими представниками. Таке враження, ніби [FROM.GetLeader] виношує ворожі задуми по відношенню до держави [ROOT.GetNameDef]..."
 NSB_soviet_foreign_politics_events.264.desc_default:0 "[ROOT.GetAdjective] окупація [FROM.GetAdjective] Північних островів ([GetAppropriateRedArmyNsName]),"
 NSB_soviet_foreign_politics_events.271.desc:0 "[SIK.GetAdjective] консул, що працює в Семипалатинську, зв'язався з нашими дипломатами, щоби повідомити, що [SIK.GetAdjective] уряд приймає [ROOT.GetAdjective] ініціативу з розширення він зауважив, що уряд провінції [SIK.GetNameDef] відкрито для нових економічних та дипломатичних відносин із нашою країною."
 NSB_soviet_foreign_politics_events.284.a:0 "Вони заважають співпраці між нашими країнами!"
 NSB_soviet_foreign_politics_events.286.b:0 "Треба впоратися з цими базіканнями і зрадниками!"
 NSB_soviet_great_patriotic_war.01.a:0 "Ласкаво просимо до органів, товаришу!"
 NSB_soviet_paranoia_system_events.01.desc:0 "На недавньому засіданні Центрального комітету товариш [Root.GetLeader] звернув увагу на роздробленість, що зростає в партії. Всі члени комітету поспішили запевнити його у своїй повній і беззастережній підтримці, але це не допомогло. Товариш [Root.GetLeader] каже, що потрібно завжди бути напоготові і побоюватися саботажників і шкідників, які замишляють проти держави, на яких би постах вони не були. Такі новини здивували багатьох членів партії, які вважали, що небезпека розколу минула з вигнанням Троцького."
 NSB_soviet_paranoia_system_events.11.t:0 "Радник підозрюється у зраді"
 NSB_soviet_paranoia_system_events.28.a:0 "Не можна, щоб гнилизна вкоренилася."
 NSB_soviet_policies_of_collective_security.11.desc:0 "[POL.GetAdjective] уряд відмовився вступити в пакт про взаємодопомогу, пославшись на те, що країні не загрожує серйозна небезпека.\n\nУ дипломатичних колах ходять чутки, що це просто слушна відмова, — їхня недовіра до нас."
 NSB_soviet_policies_of_collective_security.3.a:0 "Дуже недалекоглядне рішення."
