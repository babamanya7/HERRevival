 AFG_75_year_oil_concessions_tt:0 "§YВідмикає рішення про видобуток нафтових ресурсів з нашої території у співпраці з іноземною державою.§!"
 AFG_agreement_with_germany_tt:0 "\n\n§Y[GER.GetNameDefCap] буде більш схильний прийняти, якщо їхня думка про нас перевищує 50.§!"
 AFG_capitulated_Soviet:0 "Граючи як [AFG.GetNonIdeologyName], змусьте капітулювати державу [SOV.GetNonIdeologyName]"
 AFG_cross_border_ties_desc:0 "Характер нашої географії означає, що кордони завжди пористі, сім'ї перетинають їх і оселяються по обидва боки. Протягом поколінь це призвело до міцних міжособистісних зв'язків у сусідніх країнах, якими у час кризи можна скористатися."
 AFG_eastern_state_breakaway_tt:0 "§Y [1006.GetName] \n [1008.GetName] §!"
 AFG_emerging_economy:0 "Зростаюча економіка"
 AFG_gain_religious_support_for_reforms:0 "Той, хто покладає надію на Бога"
 AFG_infantry_at2:0 "PIAT"
 AFG_into_the_plains_of_india_desc:0 "Настав час нашому народові утвердитися як господарі Індійського субконтиненту. Ми зробимо, як колись наші предки, спустимося з гір, поки вони слабкі, але цього разу ми залишимося тут."
 AFG_kajaki_dam_tt:0 "\n§RНедомовленість щодо договору з [414.OWNER.GetNameDef] через наступний ланцюг подій може призвести до війни!§!"
 AFG_khorasan_buffer_state_tt:0 "§YМи створимо маріонетковий уряд Хорасану в наступних областях, якщо ми їх контролюємо: \n [1004.GetName]\n [416.GetName]\n [1003.GetName]§!"
 AFG_khorasan_communism:0 "Соціалістична республіка Хорасан"
 AFG_maintain_quami_tt:0 "§YЗберігає рішення §Y$AFG_quami_category$§! та можливість вербувати більше нерегулярних дивізій.§!"
 AFG_nufus_intro_tt:0 "Модифікувати §Y$AFG_nufus_modifier$§! на:"
 AFG_political_events.120.desc:0 "Представники комуністичного руху в [AFG.GetNonIdeologyName] звернулися до нас з проханням про підтримку у їхній бурхливій революції. Хоча можна сперечатися, чи здатна виснажена нація підтримувати соціалістичну економіку, ми не можемо ігнорувати важливість просування кордонів соціалізму глибше в Центральну Азію та за її межі."
 AFG_political_events.131.t:0 "[FROM.GetName] погоджується на конфедерацію"
 AFG_political_events.140.t:0 "Результати виборів"
 AFG_political_events.151.a:0 "Чудово!"
 AFG_political_events.154.a:0 "Як вони сміють зрадити нас!"
 AFG_political_events.154.t:0 "[FROM.GetNameDefCap] відхиляє план"
 AFG_political_events.20.b:0 "[FROM.GetNonIdeologyName] не враховується в наших довгострокових планах"
 AFG_political_events.40.b:0 "Це лише галас, і нас це не залякає."
 AFG_propose_peace_for_tajikistan:0 "Запропонувати мир за [FROM.GetName]"
 AFG_reclaim_moghulistan_desc:0 "Моголістан, один із Чагатайських ханств, був одним із наступників Великої Монгольської імперії. Як нова держава, що прагне тієї ж слави, яку вони колись мали, було б розумно забрати ці землі собі."
 AFG_reinforce_the_royal_guard:0 "Тіні короля"
 AFG_renew_soviet_trade_agreement:0 "Відновити радянську торговельну угоду"
 AFG_repaying_our_friends:0 "Відплатити нашим друзям"
 AFG_request_soviet_support_desc:0 "Нашій революції загрожує крах через наші обмежені економічні ресурси та живу силу, з якою ми могли б захопити ключові населені пункти нації. Якщо ми хочемо досягти успіху, нам знадобиться допомога від [SOU.GetNameDef] якнайшвидше."
 AFG_sugar_processing:0 "Цукрова фабрика Баглан"
 AFG_the_echoes_of_panipat_desc:0 "Третя битва при Паніпаті все ще відлунюється у спогадах усіх на Індійському субконтиненті. Там ми розгромили сили Маратха та встановили наше домінування над північно-західною Індією. Настав час зробити це знову та розбити зухвалих спадкоємців Конфедерації Маратха!"
 AFG_turko_persian_heritage_category:0 "Турко-перська спадщина"
 AFRICA_COLONIZATION_STATUS:0 "Статус колонізації Африки"
