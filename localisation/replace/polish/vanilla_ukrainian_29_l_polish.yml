 CHI_shifting_the_balance_desc:0 "Хоча ми отримали підтримку з-за кордону, вона була пасивного типу. Ми збираємося просити про активне залучення, щоб нам допомогли перемогти японську загрозу раз і назавжди."
 CHI_ship_medium_battery_1:0 "20.3cm/45 Armstrong T"
 CHI_sino_american_cooperative_organization_desc:0 "Американська розвідка готова співпрацювати з нами та проводити спецоперації у тилу противника. Це допоможе нам розширити власні можливості у цій галузі."
 CHI_snd_integration_cost:0 "Зменшує вартість інтеграції для [SND.GetNameDef] на §G[?snd_integration_cost_reduction|%G0]§!"
 CHI_soviet_volunteer_group:0 "Розсилка радянської добровольчої групи"
 CHI_super_heavy_tank_aa_equipment_1_short:0 "PGZ 44"
 CHI_super_heavy_tank_destroyer_equipment_1_short:0 "PTZ 44"
 CHI_the_4_defence_areas_desc:0 "Якщо ми хочемо успішно захистити нашу велику націю, комплексний план є першочерговим для успіху. Ми поділимо країну на чотири зони і призначимо відповідного командувача для кожної, це гарантує місцеву безпеку та ефективний опір."
 CHI_toward_a_socialist_economy_desc:0 "Щоб справді змінити наше суспільство на краще, ми повинні змінити спосіб руху грошей і усунути керівників корпорацій, які отримали свої посади лише через кумівство. Робоча людина знову матиме право голосу у своїй країні, і весь [ROOT.GetAdjective]ий народ буде рівним!"
 CHI_tsr_anti_communism_desc:0 "Комунізм — це бич нашої нації, а партизани — болюче місце нашої адміністрації. Ми повинні боротися проти цієї ідеології і покласти їй край, навіть якщо це означає віддати життя за справу."
 CHI_unified_industrial_planning:0 "Об'єднане промислове планування"
 CHI_uplift_the_mountain_brigades_desc:0 "Землі внутрішнього Китаю суворі та важкодоступні. Тому, щоби ми могли належним чином захистити наші землі, необхідно тренувати спеціальні бригади для ведення бойових дій у горбистій і гірській місцевості."
 CHI_vietnam_FRA:0 "Французька влада"
 CHI_war_of_national_liberation:0 "Національно-визвольна війна"
 CHI_war_of_national_liberation_desc:0 "Відбивши наступ японців, ми можемо розпочати активніші дії, спрямовані на звільнення наших територій."
 CHI_warlord_PRC_communism:0 "Китайська радянська республіка"
 CHI_warlord_PRC_communism_DEF:0 "Китайська радянська республіка"
 CHI_warlord_in_opposition:0 "Воєначальник в опозиції"
 CHL_1938_chilean_presidential_election_desc:0 "Зближаються президентські вибори 1938 року, і країна має обрати свого лідера з чотирьох основних кандидатів. Зліва — Педро Агірре Серда і Народний фронт, справа — Карлос Ібаньєс дель Кампо і Альянс народної свободи, посередині — Густаво Росс і ліберали, а ще лівіше — Еліас Лафертте Гавіньйо і комуністи. Хто переможе?"
 CHL_an_empire_on_the_pacific:0 "Імперія Тихого океану"
 CHL_approach_the_moderates_desc:0 "Незважаючи на свою нелюбов до монархії, в країні є багато людей, які, принаймні, підуть за Ібаньєсом, якщо він скаже їм про це, і це саме те, що йому доведеться зробити."
 CHL_communist_tech_sharing_group_desc:0 "Спільна програма соціального та технологічного прогресу зі штаб-квартирою в Сантьяго, Чилі."
 CHL_cooperate_with_operation_bolivar_desc:0 "Німці, однак, багато зробили для нас. Коли ми найбільше цього потребували, німецькі поселенці переїхали колонізувати Арауканію, і тепер вони потребують допомоги у боротьбі з американцями. Наш обов'язок — допомогти їм у цьому і віддати їм борг, який ми їм винні."
 CHL_demand_demilitarization_of_patagonia_desc:0 "Аргентинці продовжують загрожувати нашому народу своєю постійною військовою присутністю в Патагонії. Настав час попросити їх залишити нас у спокої та пообіцяти не вводити війська в регіон."
 CHL_demand_snap_election:0 "Вотум недовіри до Алессандрі"
 CHL_destroyer_1:0 "Клас «Almirante Lynch»"
 CHL_devalue_the_peso_peso_desc:0 "У той час як інші країни дозволили своїм валютам стати менш цінними, щоби допомогти своїм економікам, ми ще не зробили цього. Як наслідок, ми дуже відстаємо. Якщо ми хочемо наздогнати їх, ми не мусимо чекати на девальвацію нашої валюти, навіть якщо це виявиться непопулярним заходом."
 CHL_establish_trade_relationships_desc:0 "Існує багато вимог для успішності торгівлі, і наявність ресурсів, які користуються попитом, не є єдиною з них. Нам також потрібні торгові партнери, яким ми можемо довіряти, а також контракти, які не продають нашу робочу силу та природні ресурси надто дешево. Таким чином, ми мусимо звернутися до наших братів і сестер в Америці, щоби переконатися, що ми знаємо тих, з ким торгуємо."
 CHL_expand_the_department_of_provinces_coring_tt:0 "Буде відкрите рішення §YІнтегрувати області§!, на які претендують чилійські іредентисти."
 CHL_fascist_kingdom:0 "Королівство Чилі"
 CHL_fortify_the_coastlines_desc:0 "Наші берегові лінії довгі, а пропорційно до розміру країни, мабуть, найдовші у світі. Тому, якщо ми якимось чином програємо морську війну, вся наша країна опиниться під загрозою, і ми станемо вразливими та відкритими для нападу з моря. Отже, ми мусимо збудувати великі комплекси, здатні відбити будь-який морський десант!"
 CHL_found_national_steelworks_desc:0 "Країна гостро потребує сталі, і наші дослідники виявили, що пишний регіон Арауканія має саме її. Тому ми мусимо докласти зусиль, щоб заснувати нові металургійні заводи, щоби могти використати доступні нам національні ресурси."
