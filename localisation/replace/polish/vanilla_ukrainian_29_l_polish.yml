 FRA_THIRD_EMPIRE_neutrality_ADJ:0 "Французьк"
 FRA_bring_home_quebec_desc:0 "Давно втрачена провінція з часом знову буде нашою. Всі франкофони світу згодом возз'єднаються з батьківщиною."
 FRA_central_africa_intervention.2.a:0 "Навіщо їм чинити опір своїм же визволителям?"
 FRA_colonial_naval_bases_desc:0 "Ключем до глобального прогнозування потужності є здатність підтримувати флот далеко від рідних вод. У нас уже є великі колоніальні холдинги, тепер ми мусимо розвивати їх, щоби служити базою для заправки та ремонту нашого флоту."
 FRA_confirm_eastern_commitments:0 "Підтвердити східні зобов'язання"
 FRA_coup_in_north_africa_flag:0 "Підготувати переворот у Північній Африці"
 FRA_coup_in_syria:0 "Підготувати переворот у Сирії"
 FRA_defensive_focus_desc:0 "Настав час, коли необхідно всіляко зміцнювати оборону. Нехай вороги приходять, ми зустрінемо їх на рідній землі. У нас є відмінний кандидат на посаду головнокомандувача, достатньо лише Вашого слова."
 FRA_extend_the_maginot_line_focus_pos:0 "Продовження лінії Мажіно"
 FRA_infantry_equipment_2:0 "MAS-38"
 FRA_infantry_equipment_2_short:0 "MAS-38"
 FRA_integralism_desc:0 "Ідеологія інтегралізму стверджує, що всі сторони суспільства мусять об'єднатися і працювати так, ніби вони є одним невеликим шматком більшого цілого. Це суспільство має бути добре впорядкованим, щоб усі його частини працювали разом у злагоді."
 FRA_intervention_in_north_africa_desc:0 "Північна Африка є найкращим місцем для вторгнення, щоби повернути батьківщину. Повернення його на наш бік є життєво важливим для нашої визвольної кампанії."
 FRA_intervention_in_syria_desc:0 "Відмова ворогу в стратегічних територіях в Сирії захищає Суецький канал і різко поліпшує нашу ситуацію в східному Середземномор'ї."
 FRA_loyalty_to_moscow_desc:0 "Модель соціалізму, яка практикувалася в Радянському Союзі, може бути не ідеальною, але поза будь-якими розумними сумнівами Радянський Союз досяг найвищого ступеня реалізації соціалістичних ідей. Ми були б дурнями, якби спробували знайти власний шлях."
 FRA_metropolitan_france:0 "Інвестувати у французьку метрополію"
 FRA_non_military_aid_allowed:0 "Невійськова підтримка дозволена"
 FRA_prioritize_the_joffre_tt:0 "Додає сучасний §Yавіаносець§!, зібраний на 40%, у чергу для збірки."
 FRA_promise_independence_to_syria:0 "Пообіцяти незалежність Сирії"
 FRA_revise_the_constitution_desc:0 "Республіканська конституція завжди мала бути зупинкою, якій дозволялося діяти занадто довго. Тепер ми перепишемо його, щоби дозволити монарху повернутися."
