 CZE_airlift_soviet_support:0 "Перекидання радянської підтримки повітрям"
 CZE_anti_tank_development_desc:0 "Оскільки все більше армій розгортають дедалі більші бронетанкові сили, вдосконалення наших протитанкових гармат є обов'язковим. Здатність боротися з танками за допомогою польових гармат — це те, що вирішує, чи стримаємо ми ворога, чи він прорветься."
 CZE_balanced_3_desc:0 "Продовжується активний розвиток промисловості у всіх регіонах нашої країни, і деякі її галузі почали спеціалізуватися на певних товарах та послугах. Ми мусимо підтримувати цю тенденцію."
 CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization:0 "Böhmische-Mährische Maschinenfabrik AG"
 CZE_bolster_domestic_construction:0 "Підтримати вітчизняне будівництво"
 CZE_bolster_domestic_construction_desc:0 "Наш вітчизняний будівельний сектор неухильно зростає відтоді, як ми здобули незалежність після закінчення Великої війни. Надання додаткових інвестицій деяким середнім будівельним підрядникам ще більше посилило б це зростання."
 CZE_bop_reservist_training:0 "£BoP_right_texticon Підготовка резервістів"
 CZE_build_the_slapy_reservoir_desc:0 "Будівництво дамби біля Слапи призведе до збільшення виробництва електроенергії та економічних можливостей у цьому районі. Зростання генерації енергії значно допоможе розвитку нашої промисловості в регіоні."
 CZE_cancel_anti_hungary_focus_tt:0 "Скасовує фокус §Y«$CZE_neutralize_the_hungarian_threat$»§!"
 CZE_complete_reconciliation_desc:0 "Ми доклали зусиль, щоб побудувати мости довіри. Настав час примиритися з нашими співвітчизниками."
 CZE_concealment_efforts_desc:0 "Широке використання штурмовиків і розвідувальних літаків зробило маскувальні сітки та інші тактики приховування необхідністю. Нам потрібно посилити наші зусилля, щоб переконатися, що наші війська добре замасковані на полі бою."
 CZE_contact_henlein_cooldown_flag:0 "Виконано фокус §Y«$CZE_no_compromise_with_the_sdp$»§!"
 CZE_deliver_sudetenland_desc:0 "Німеччина хоче Судетську область, і вона її отримає. Схоже, це єдиний спосіб уникнути повномасштабної війни."
 CZE_develop_horska_artillery_desc:0 "Модифікувавши нашу нинішню артилерію, щоб вона була легкою та розбірною, ми забезпечимо наші війська достатньою вогневою міццю в гірській та горбистій місцевості."
 CZE_diversify_bata_desc:0 "«Батя» — це велика споживча компанія, яку ми могли б використати на свою користь у нашому ланцюжку постачання ресурсів. Вони можуть допомогти нам, надаючи критично важливі матеріали, які інакше важко дістати."
 CZE_exchange_military_expertise_desc:0 "[SOV.GetNameDefCap], як і більшість держав зі значною армією, експериментує з військовою тактикою. Ми маємо попросити їх поділитися своїми напрацюваннями, а ми, своєю чергою, можемо поділитися нашими."
 CZE_exclude_the_slovaks_desc:0 "Словаки висловлюють невдоволення з першого дня освіти нашої країни. Прагнучи посилити свою політичну вагу, вони вимагають несправедливо більшого доступу до національних ресурсів. Досить! Уся влада в країні відтепер належатиме чехам. §RЦе призведе до громадянської війни.§!"
 CZE_expand_trinec_ironworks_desc:0 "Тршинецький металургійний завод був титаном промисловості в [72.getname] з моменту свого заснування. Подальші інвестиції принесли б нам величезні дивіденди у виробництві ресурсів."
 CZE_focus_on_export_designs_desc:0 "Армія дуже вимоглива до того, що вона хоче бачити в наших розробках. Експортний ринок більш поблажливий, і він також допомагає фінансувати вітчизняні проєкти для армії. Тож насправді армія мала б бути нам дуже вдячною за те, скільки грошей ми їй економимо на дослідженнях і розробках. Нема за що, арміє."
 CZE_get_weapon_sales_idea_tt:0 "Ці виробничі потужності будуть передані [ROOT.GetNameDef] з невеликою затримкою. Якщо триватимуть достатні продажі зброї, виробничі потужності натомість будуть накопичуватися і розподілятися протягом довшого періоду часу."
 CZE_great_moravia_democratic_DEF:0 "Федерація моравських держав"
 CZE_grow_ckd_secondary_facilities_desc:0 "ČKD має багато невеликих другорядних заводів, які виробляють деякі важливі промислові товари, такі як електрогенератори. Розширення цих заводів сприяло б зростанню нашої важкої промисловості."
 CZE_infantry_equipment_2:0 "Koucký ZK 383"
 CZE_leverage_gunboat_experience:0 "Використати досвід створення канонерських човнів"
 CZE_live_fire_exercise:0 "£BoP_right_texticon Бойові стрільби"
 CZE_live_fire_exercise_desc:0 "Ніщо не замінить дня, проведеного на стрільбищі."
 CZE_merge_the_paramilitaries:0 "Об'єднати воєнізовані групи"
 CZE_militarize_the_associations:0 "Мілітаризувати асоціації"
 CZE_mio_trait_additional_ammo_storage:0 "Додаткове сховище боєприпасів"
 CZE_modern_tank_equipment_1_short:0 "TVP"
 CZE_national_defense_act_desc:0 "Цей закон про оборону охоплює всі заходи, військові чи інші, спрямовані на протидію будь-якій загрозі або нападу на суверенітет, цілісність, єдність і безпеку нашої нації під наглядом Вищої ради національної оборони (NROS)."
 CZE_nationalize_key_industries_desc:0 "Шахти забезпечують сировиною, з якої наша промисловість кує зброю для війни. Забезпечення постачання матеріалів у час кризи найкраще залишити в руках уряду, а не фінансистів та промисловців."
 CZE_nav_bomber_equipment_2:0 "Praga E-51"
 CZE_opl_exercises_desc:0 "Проводячи навчання з протиповітряної оборони (OPL), наша армія зможе відпрацювати маневрування з покращеною координацією та збереженням сил, тим самим покращуючи загальне пересування військ та безпеку."
 CZE_realize_motorway_proposals:0 "Реалізувати проєкти автомагістралей"
 CZE_redirect_the_fortification_councils_funds:0 "Перенаправити кошти Ради з фортифікації"
 CZE_reintegrate_cross_border_rail_connections:0 "Покращити транскордонне залізничне сполучення"
 CZE_restore_noble_titles:0 "Відновити дворянські титули"
 CZE_revive_the_czechoslovak_legion_communist:0 "Створити волонтерську організацію"
 CZE_ringhoffer_tatra_organization:0 "Ringhoffer-Tatra"
 CZE_skoda_internal_competition_desc:0 "У такій великій компанії, як «Шкода», важко підтримувати максимальну працездатність кожного. Заохочення внутрішньої конкуренції значно покращить ефективність роботи співробітників на наших заводах."
 CZE_skoda_select_spain_group:0 "Продаж зброї в Іспанії"
 CZE_strike_at_the_heart_of_bolshevism:0 "[THIS.GetAntiSovietFocusName]"
 CZE_tac_focus_desc:0 "Інститут військової авіації за підсумками випробувань дійшов висновку, що нам слід зосередитись на тактичних бомбардувальниках."
 CZE_the_legacy_of_ottokar_desc:0 "Легендарний король Оттокар II розширив Богемське королівство на Австрію та до Адріатики завдяки схваленню австрійської знаті. Ми повинні знову звернутися до австрійців, як знатних, так і незнатних."
 CZE_the_second_fortification_program:0 "Розпочати Другу програму фортифікації"
 CZE_the_second_fortification_program_desc:0 "Перша програма фортифікації заклала фундамент оборони, який ми повинні негайно розбудовувати. Заради майбутнього нашої нації ми повинні якомога швидше розпочати другу програму фортифікації та розширювати наші оборонні лінії."
 CZE_usurp_the_mantle_desc:0 "Маючи королівство, що простягається від Балтійського до Адріатичного моря і панує над землями історичної регіональної потуги — Австрії, тепер ми можемо проголосити себе законним наступником Священної Римської імперії."
