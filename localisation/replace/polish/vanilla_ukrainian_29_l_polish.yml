 ITA_multirole_aircraft_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §G-25%§!\n\n"
 ITA_naval_air_coordination:0 "Координація флоту й авіації"
 ITA_power_balance_lost_core_2:0 "$ITA_power_balance_lost_core_1$"
 ITA_promote_ideology_rallies_balkan:0 "$SOV_promote_ideology_rallies_balkan$"
 ITA_regio_esercito_name_alt:0 "$ITA_regio_esercito_alt_dynamic_modifier$"
 ITA_regio_esercito_name_default:0 "$ITA_regio_esercito_dynamic_modifier$"
 ITA_secure_the_borders_desc:0 "Зі зростанням міжнародної напруженості в усьому світі, будь-яка країна, яка не є нашим союзником, мусить розглядатися як імовірно ворожа. Ми мусимо зміцнювати та гарнізонувати наші кордони якнайшвидше, щоби запобігти та зупинити будь-яке вторгнення."
 ITA_setting_course:0 "Установлення курсу"
 ITA_strat_bomber_equipment_2_short:0 "P.108"
 ITA_strengthen_the_blackshirts_template_tt:0 "Додає §Y1 батальйон артилерії§! до шаблону дивізій Camicie Nere.\n$ITA_blackshirts_div_cap_12_tt$"
 ITA_superesercito_desc:0 "Координувати велику армію — нелегка справа. Нам потрібно створити структуру верховного командування, яке могло би спрямовувати та підтримувати війська на місцях."
 ITA_supported_the_new_government:0 "Підтримали новий уряд"
 ITA_the_italian_confederation_desc:0 "Переглянувши нашу колоніальну політику, наступним кроком, який ми мусимо зробити, є створення конфедерації, яка включатиме всі держави, що виникли в результаті процесу деколонізації, і слугуватиме рамками, в яких наші нації зможуть співпрацювати й отримувати взаємну вигоду."
 ITA_victoryinETH_desc:0 "Поразка в першій Першій італо-ефіопській війні залишалася плямою на італійській честі протягом 40 років, а досягнута зараз перемога зніме цю пляму та доведе силу залізної волі фашизму!"
 ITA_war_with_france_claims_tt:0 "Отримає претензію на §Yкожну [FRA.GetAdjective]у колонію§! в стратегічних регіонах §Y$STRATEGICREGION_182$§!, §Y$STRATEGICREGION_126$§!, §Y$STRATEGICREGION_128$§!, §Y$STRATEGICREGION_28$§!, §Y$STRATEGICREGION_17$§! і §Y$STRATEGICREGION_216$§! або середземноморський острів, на який [ROOT.GetFlag][ROOT.GetNameDef] ще не має претензію.\nПоточні ефекти:"
 ITA_war_with_greece:0 "$ITA_greece_war_goal$"
 ITZ_communism_DEF:0 "Колектив Чічен-Іци"
 IVO_fascism_DEF:0 "Президентська диктатура Кот-д'Івуар"
 JAM_communism_ADJ:0 "Ямайськ"
 JAP_EQUIPMENT_VERSION_14:0 "Kai N"
 JAP_EQUIPMENT_VERSION_7:0 "Kai G"
 JAP_STATE_1030:0 "Кейшьоу"
 JAP_STATE_537:0 "Карафуто"
 JAP_a_common_currency_for_all_of_asia:0 "Спільна валюта для всієї Азії"
 JAP_alliance_with_siam:0 "Альянс із Сіамом"
 JAP_an_integrated_union_desc:0 "Інтеграція економік наших союзників з нашою та створення Азійського центрального банку, який зможе моніторити та допомагати економічному становищу інших держав, буде дуже вигідною для нас у довгостроковій перспективі. Це не тільки зміцнить нас, але й посилить їхню залежність від нас, що зрештою дозволить нам взяти під контроль їхні зовнішні справи."
 JAP_annex_developed_puppet_decision_tt:0 "Ми отримаємо §G25%§! §YПідкорення§! у всіх їхніх регіонах"
 JAP_army_smuggling_kwantung_army_units_to_the_home_islands_mission:0 "Армія таємно переправляє підрозділи Квантунської армії на острови метрополії"
 JAP_balanced_naval_approach_desc:0 "Ми повинні уникати ситуації, коли заганяємо себе в глухий кут, якщо виявиться, що лінкори або авіаносці неефективні проти наших ворогів. Тому нам слід дотримуватися збалансованого морського підходу та інвестувати в обидва сектори."
 JAP_border_conflict_back_out_of_conflict:0 "Поступитися"
 JAP_coal_liquification:0 "Зрідження вугілля"
 JAP_combined_nuclear_research_efforts:0 "Об'єднані зусилля ядерних досліджень"
 JAP_continue_takahashi_korekiyos_policies_desc:0 "Віконт Такахаші Корекійо врятував нашу націю від Великої депресії й гарантував, що її наслідки більше не відчуватимуться в нашій економіці. Однак для досягнення цього він пішов на скорочення бюджету військових фінансів, що виявилося непопулярним кроком для багатьох. Ми повинні йти його стопами!"
 JAP_cooperate_with_anarchists:0 "Співпраця з анархістами"
 JAP_danganressha_desc:0 "Міністерство залізниць схвалило так званий план «Данганрешшя», згідно з яким поруч зі стандартними коліями мають бути прокладені ширококолійні залізниці, якими транспортні поїзди зможуть рухатися швидко, як куля. Піонер залізниці Ясуджіро Шіма та його син пообіцяли допомогти у розробці цього плану."
 JAP_demand_submission_from_breawakay_states_desc:0 "Держави, які незаконно відокремилися від нас, просто зробили помилку і не усвідомили, що народна революція буде успішною. Ми повинні звернутися до них і зробити тверду заяву, вимагаючи, щоб вони підкорилися партії і дозволили своєму народу звільнитися від капіталістичного гніту."
 JAP_democratic_core_asian_state:0 "Інтегрувати §Y[FROM.GetName]§!"
 JAP_divert_naval_guns_to_the_army_desc:0 "Щоб дозволити сухопутним військам використовувати важке озброєння, таке як залізничні гармати й танки, ми повинні перенаправити частину виробництва морських гармат для армії."
 JAP_dp_ship_secondaries_3:0 "10cm/65 Type 98 "
 JAP_east_asia_development_board:0 "Рада розвитку Східної Азії"
 JAP_ensure_civil_liberties_desc:0 "З поверненням миру та процвітання нашій нації настав час виконати деякі з обіцянок, які ми дали. Ми повинні забезпечити дотримання всіх громадянських свобод у новій Японії та розпочати створення нових фільмів для популяризації нашої демократії."
 JAP_eth_is_invited_to_faction_tt:0 "§Y[ETH.GetNameDefCap]§! запрошено до нашого альянсу"
 JAP_exchange_the_exiles_desc:0 "Раніше ми відправляли офіцерів та чиновників із переконаннями лівого спрямування в неофіційне вигнання до Маньчжурії. Тепер настав час обміняти їх на прихильників правих течій."
 JAP_expand_the_snlf_desc:0 "Війна в океані — це масовані висадки із моря. Нам слід збільшити чисельність нашої морської піхоти, щоб вона могла виконувати поставлені завдання."
 JAP_fascism_party_kodoha:0 "Кодоха"
 JAP_foreign_tank_modernization_cooperation_desc:0 "Щоб перемогти Захід, ми повинні спочатку вивчити їхні проєкти й завдяки цьому навчитися їх долати. Ми повинні шукати дружби з однією із західних держав, щоб згодом ми могли виробляти танки, якими навіть вони будуть захоплюватися."
 JAP_found_the_air_defense_surveilance_corps_desc:0 "Щоб забезпечити раннє виявлення авіаційних атак ворога, ми повинні мобілізувати цивільне населення для служби на постах спостереження ППО, встановлених по всій країні, та для виявлення ворожих літаків на ранній стадії з подальшим інформуванням відповідних органів. Це буде організовано шляхом прийняття Закону про протиповітряну оборону."
 JAP_generic_mio_trait_escort_in_force:0 "Закриті гарматні установки"
 JAP_german_rocketry:0 "Німецькі ракетні технології"
 JAP_hakko_ichiu:0 "Хакко Ічіу"
 JAP_heavy_industry_development_desc:0 "Легка промисловість задовольняє просунуті потреби наших збройних сил, тому її слід розвивати."
 JAP_hitachi_arms_department_organization:0 "$hitachi_arms_department$"
 JAP_ichi_go_desc:0 "Війні вже видно кінець. За допомогою останнього поштовху та рішучих зусиль ми можемо швидко довести конфлікт до завершення. Однак, якщо ми не зможемо досягти перемоги протягом наступного року, ми можемо постраждати від внутрішньої нестабільності, оскільки громадська думка підніметься проти посилення військових зусиль..."
 JAP_imperial_influence_ruler_gender_he_she:0 "[GetImperialInfluenceGenderHeShe]"
 JAP_imperial_influence_title_text:0 "[GetImperialInfluenceTypeName]"
 JAP_improve_agricultural_output:0 "Покращити сільськогосподарське виробництво"
 JAP_improve_the_category_of_state_decision:0 "Інвестувати в урбанізацію §Y[FROM.GetName]§!"
 JAP_incite_increased_tensions_in_the_diet_decision:0 "Спровокувати зростання напруженості в Сеймі"
 JAP_invest_in_foreign_industries_tt:0 "Розблоковує §Yрішення§! інвестувати в промисловість менших §Yазійських§! націй в обмін на ресурси"
 JAP_kawasaki_dockyards_organization:0 "$kawasaki_dockyards$"
 JAP_kwantung_army_decisions:0 "Квантунська армія"
 JAP_ministry_of_commerce_and_industry_desc:0 "Щоб отримати кращий огляд наших фінансів, ми повинні розширити Міністерство торгівлі та промисловості й переконатися, що вони мають усі ресурси, необхідні для належного виконання своїх завдань."
 JAP_organize_the_fifth_column:0 "Організувати п'яту колону"
 JAP_promulgate_the_military_ministers_system_desc:0 "Короткий період після спроби державного перевороту фракцією Кодоха був яким завгодно, але не стабільним. Оскільки невдоволення військових урядом зростає, необхідно вжити заходів для їхнього заспокоєння. З цією метою Кокі Хірота запропонував зробити посаду міністра війни доступною виключно для офіцерів, що перебувають на дійсній службі, як це вже траплялося кілька разів у нашій історії."
 JAP_pursue_international_trade_desc:0 "Хоча ми торгували з іноземними державами відтоді, як комодор Метью Перрі поклав край нашій ізоляції, цього було далеко не достатньо. Ми повинні приділяти значну увагу міжнародному ринку і гарантувати, що зможемо отримувати необхідні ресурси шляхом дипломатії, а не війни."
 JAP_sea_nationalize_the_zaibatsus_desc:0 "Найбільші корпорації нашої країни довго володіли безпрецедентною політичною та економічною владою, але цьому настав кінець. Контроль держави не підлягатиме сумніву. Ми повинні націоналізувати їх і використати їхній капітал на благо народу!"
 JAP_sea_promote_japanese_settlement_desc:0 "Розселяючи наших власних людей у Маньчжурії, ми можемо збільшити робочу силу і тим самим створити більш сприятливі місця для фабрик. Люди, які переїжджають туди, також можуть виробляти сільськогосподарські товари, які можна відправляти назад на рідні острови."
 JAP_sea_purge_the_kodoha_faction:0 "Чистка фракції Кодоха"
 JAP_sea_state_general_mobilization_law_desc:0 "До нашого відома дійшло, що нам необхідно перевести національну економіку на військові рейки, щоб не відстати в розробці озброєнь. Завдяки цьому новому закону ми зможемо отримати урядовий контроль над цивільними організаціями та профспілками, націоналізувати стратегічні галузі, контролювати ціни та запроваджувати нормування там, де це необхідно."
 JAP_sea_the_showa_restoration_emperor_showa_desc:0 "Нарешті епоха ліберальної демократії Тайшьо добігла кінця. Знову націю очолить невелика група кваліфікованих людей, що підтримують сильного Імператора. Тільки так нашій країні нарешті буде принесено порятунок."
 JAP_seek_yakuza_support_tt:0 "Більша частина §YІмператорської армії§! перейде на наш бік під час §YГромадянської війни§!"
 JAP_ship_anti_air_3:0 "4cm/60 Type 5"
 JAP_strengthen_the_divine_wind_desc:0 "$imperial_glory_focus_desc$"
 JAP_sue_for_peace_CHI_desc:0 "Ми втратили контроль над материком. Військові вважають, що навряд чи вдасться повернути втрачені території. Цивільний уряд пропонує нам шукати умови, щоби принаймні зберегти наш суверенітет над островами."
 JAP_supported_the_rounoha_idea_tt:0 "Розблокує фокус §Y$JAP_the_labor_farmer_faction_ascendant$§!"
 JAP_supremacy_of_technology_desc:0 "Технології — ось що призведе до перемоги. Ми мусимо направити всі наші зусилля на те, щоби перевершити ворогів за рівнем зброї та спорядження."
 JAP_takahashi_korekiyo_was_killed:0 " Такахаші Корекійо був убитий повстанцями"
 JAP_the_imperial_colors:0 "Імператорські стяги"
 JAP_trans_pacific_influence_tt:0 "Розблоковує рішення для запрошення §Yкомуністичних південноамериканських§! націй до нашого альянсу"
 JAP_ultimate_deterrence:0 "Абсолютне стримування"
 JAP_yokosuka_organization:0 "$yokosuka$"
 JUNO_SPR_immigration_completed:0 "Уже підтримано імміграцію з держави [SPR.GetFlag]§Y[SPR.GetName]§!"
 JUNO_brazil_events.120.t:0 "[FROM.GetNameDefCap] пропонує обмін технологіями"
 JUNO_brazil_events.121.a:0 "Взаємовигідна домовленість!"
 JUNO_brazil_events.137.a:0 "Нам все одно не потрібні ті колонії."
 JUNO_brazil_events.150.b:0 "Таке бандитство більше не можна терпіти!"
 JUNO_brazil_events.153.t:0 "Загроза Кангасу"
 JUNO_brazil_events.180.b:0 "Він надто ризикований, щоб залучати його до прийняття наших рішень."
 JUNO_brazil_events.200.t:0 "Сезон виборів"
 JUNO_brazil_events.47.b:0 "Вони пошкодують про своє рішення."
 JUNO_brazil_events.48.desc:0 "[FROM.GetAdjective] військові, здається, відступають, незважаючи на наше відхилення їхньої пропозиції «стабілізації». Схоже, ми розгадали їхній блеф, і вони не мали справжнього бажання конфліктувати."
 JUNO_brazil_events.60.a:0 "Ми сильніші разом!"
 JUNO_brazil_events.60.desc:0 "[BRA.GetNameDefCap] звернулася до нашого уряду, пропонуючи, щоб наші дві країни знову об'єдналися. Вони посилаються на схожість наших культур та недавній шлюб між Домом Дуарте Нуно, герцогом Браганським, та принцесою Марією Франсіскою Орлеансько-Браганською як на причини цієї пропозиції та запевняють нас, що ми станемо сильнішими разом під правлінням [BRA.GetLeader]."
 JUNO_brazil_news.1.d:0 "[BRA.GetAdjective] уряд останнім часом займає все більш войовничу та наполегливу позицію щодо питань зовнішньої політики. Після десятиліть заворушень, схоже, останній режим тепер почувається достатньо впевнено, щоб шукати можливості за межами своїх кордонів, які приносять користь [BRA.GetName] за рахунок її сусідів. Що це означає для наших стосунків з бразильським урядом, ще належить побачити."
 JUNO_guay_events.9.t:0 "[FROM.GetName] повертає інвестиції в греблю"
