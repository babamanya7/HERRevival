 AST_heavy_cruiser_1:0 "$ENG_heavy_cruiser_1$"
 AST_heavy_tank_destroyer_equipment_2:0 "Churchill Local Pattern Tank Destroyer"
 AST_hmas_assault_desc:0 "Війна на Тихому океані вестиметься із застосуванням морського десанту, тому будівництво бази ВМС, де морпіхи зможуть відпрацьовувати маневри, є першорядним завданням."
 AST_improved_ground_crews_desc:0 "На кожного пілота потрібна ціла команда наземного екіпажу, щоб забезпечити належне технічне обслуговування літаків, координацію польотів і роботу бази. Не кажучи вже про штурманів, стрільців і бомбардирів, які супроводжують їх у повітрі. Ми повинні створити належні тренувальні бази, щоб наші ВПС працювали з максимальною ефективністю."
 AST_infantry_equipment_0:0 "LSAF Rifle No.1 MkIII"
 AST_lang_plan_desc:0 "Джек Ланг вийшов на передній план економічної політики завдяки своїй гучній відмові виконувати зобов'язання за зовнішнім боргом, спрямовуючи натомість ці кошти на державні ініціативи, спрямовані на стимулювання внутрішнього зростання. Зрештою, не можна вичавити кров з каменя."
 AST_light_cruiser_1_desc:0 "C-class light cruisers were a group of twenty-eight light cruisers of the Royal Navy. They were built before and during the First World War for the rough conditions of the North Sea. They proved to be rugged and capable vessels despite being somewhat small and cramped. Their armament was more than satisfactory, as they carried enough 6 in. guns to fight enemy surface targets and a heavy torpedo load. They saw extensive use during WWI and participated in many surface actions. Only the Caledon, Ceres, and Carlisle subclasses were in service by the mid 1930's."
 AST_light_tank_equipment_2:0 "M3 Light"
 AST_make_a_common_enemy_tt:0 "§RМожливі наслідки події:§!"
 AST_mio_trait_anti_tank_improvements:0 "Протитанкові вдосконалення"
 AST_mio_trait_evans_deakin_coral_sea_hunters:0 "Мисливці Коралового моря"
 AST_natunity_desc:0 "§YУряд національної єдності§!\n§LУ моменти кризи дрібні суперечки поступаються місцем більшим. Нації навколо нас стикаються з конфліктами один за одним, і хоча внутрішні проблеми мають свою актуальність, ця актуальність зникає, коли загроза кровопролиття стає дедалі більш неминучою. Демократичні партії [AST.GetName] повинні відкласти свої розбіжності та зустріти світ об'єднаними.§!"
 AST_naurus_return_to_german_hands:0 "Повернення Науру до німецьких рук"
