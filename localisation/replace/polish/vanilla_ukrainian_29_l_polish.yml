 RAJ_strat_bomber_equipment_1:0 "Handley Page Halifax"
 RAJ_swaraj_desc:0 "В Індії набирає популярності Swaraj — рух за отримання самоврядування, початок якого поклав Ганді. Його прихильники, які ведуть активну агітацію в індійських школах, закликають до повної відмови від британських законів та традицій."
