 EST_divide_veterans_societies:0 "Розділити ветеранські спільноти"
 EST_divide_veterans_societies_desc:0 "До складу вапсів входять переважно ті, хто воював у Війні за незалежність Естонії, і хоча сумно бачити, як наші герої потрапляють під вплив ультранаціоналізму, ми мусимо розірвати і розділити ветеранські товариства, які об'єднали вапси."
 EST_events.101.a:0 "Чудово."
 EST_events.11.a:0 "Нічні вискочки."
 EST_events.202.d:0 "In spite of the overwhelming influence that the Vapsid government of [Root.GetNonIdeologyName] holds over [From.GetNameDef], [From.GetLeader] has refused [Root.GetAdjective] efforts for unification."
 EST_events.401.a:0 "[From.GetNonIdeologyName] is merely the beginning."
 EST_events.802.t:0 "Марш в області [?ROOT.vaps_from.GetName]"
 EST_events.803.d:0 "У всій області [?ROOT.vaps_from.GetName] демонстранти партії [Root.GetFascistParty] влаштували масові ходи, щоби показати свою підтримку сильній націоналістичній державі. Хоча офіційні особи намагалися не дати демонстрантам промаршувати через основні населені пункти, офіцери зброю і дали учасникам партії [Root.GetFascistParty] мирно пройти вулицями. На ході рух [Root.GetFascistParty] не зустрів якоїсь помітної протидії і тим самим здобув рішучу перемогу."
 EST_fortify_the_border:0 "Укріпити кордон"
 ESU_POR_unified:0 "Іберія"
 ETA_WEEKS:0 "§TЛишилося $WEEKS|H$ тиж. із $COST|H$ дн.§!"
 ETH_African_Union_neutrality:0 "Африканський Союз"
 ETH_BoP_purge_anarchists_tt:0 "Непростий мир між військовими та Чорними левами руйнується. Їхні наївні анархістські погляди розкладають державу [ETH.GetNameDef] зсередини, роблячи нас вразливими до атак. Щоб гарантувати продовження нашої революції, ми повинні знищити Чорних левів раз і назавжди.\n\n§Y$ETH_prov_mil_admin$§! стане лідером держави §Y[ROOT.GetFlag][ROOT.GetNameDef]§!"
 ETH_african_wildfire_desc:0 "Ми успішно подолали [ITA.GetAdjective]е вторгнення, але ми не повинні заспокоюватися, доки вся Африка не буде звільнена від жахів колоніалізму. Ми повинні використати наші навички та ресурси, щоби розпалити вогонь опору на всьому континенті та змусити імперіалістів відступити."
 ETH_alternate_fascist_party_long:0 "Прихильники $ETH_hailu_tekle_haymanot$а"
 ETH_bop_is_mesafint_influence_or_higher_tt:0 "Вплив месафинт:\n Принаймні §Y$ETH_mesafint_influence_range$§!"
 ETH_collectivization_reforms_decision:0 "Земельні реформи"
 ETH_compensation_desc:0 "Незважаючи на початкову напругу між нашими великими державами, ми неодноразово доводили свою відданість [ITA.GetName]. Однак це мало привернуло увагу нашої адміністрації до нашого населення. Можливо, [ITA.GetNameDef] захоче компенсувати нам контроль над деякими іншими їхніми землями, щоби ми могли посилити підтримку нашого режиму."
 ETH_counter_the_armored_threat_desc:0 "Бронетанкова війна явно замінює роль кавалерії на полі бою. На жаль, у нас немає способу адекватно протистояти [ITA.GetAdjective]ій бронетехніці, і наша галузь ще не впорається із завданням її виробництва. Можливо, [SOV.GetName] захоче розлучитися з деякими зі своїх старих броньованих машин?"
 ETH_develop_the_horn_of_africa_desc:0 "Африканський Ріг містить безліч народів, ресурсів і потенціалу. Якби ми співпрацювали з урядами регіону з питань економіки, ми могли б почати використовувати цей потенціал у взаємовигідний спосіб."
 ETH_events.101.t:0 "[From.GetNameDefCap] відхиляє мир"
 ETH_expand_the_bodyguard:0 "Розширити особисту охорону"
 ETH_expand_the_bodyguard_desc:0 "Стає все важче визначити, кому можна довіряти, оскільки владні структури [ETH.GetName] починають руйнуватися. У ці важкі часи майбутній лідер нашої великої нації потребує постійної охорони, вірної лише йому, для захисту від зрадницьких елементів."
 ETH_expand_the_kebur_zabagna:0 "Розширити [ETH_GetGuardsName]"
 ETH_influence_host_cost:0 "§G10§! £GFX_ETH_imperial_treasury£"
 ETH_mekwanint_total_control_range:0 "Мекуанинт контролюють політику"
 ETH_naval_college_reduction:0 "Дослідження військово-морської колегії"
 ETH_old_reliable:0 "Старе й надійне"
 ETH_organization_of_african_unity:0 "Організація африканської єдності"
 ETH_prospect_for_resources_desc:0 "У області [FROM.GetName] є природні ресурси, які можна знайти. Якщо копати і бурити досить далеко, то [ROOT.GetName] стане багатшою країною."
 ETH_raise_from_the_ranks_desc:0 "Аристократія більше не матиме командування збройними силами. Багато наших відважних воїнів зарекомендували себе як здібні керівники. Настав час винагороджувати хоробрість і вміння на полі бою замість династичних зв'язків чи особистого багатства."
 ETH_recruit_mercenaries_host_cost:0 "§G[?ETH_recruit_mercenaries_cost]§! £GFX_ETH_imperial_treasury£"
 ETH_refuge_for_the_spanish_exiles_desc:0 "Наші ідеологічні товариші в Іспанії бачили, як їхні мрії про анархізм були розбиті спільними зусиллями фашистів, сталіністів і капіталістів з усього світу. Ми повинні відкрити наші кордони для наших друзів-переселенців і дати їм другий шанс побудувати краще майбутнє."
 ETH_reinforce_jimman_identity:0 "Зміцнити джімманську ідентичність"
 ETH_seize_assets_default_title:0 "Оподаткування дворянства"
 ETH_the_defense_of_addis_ababa_tt_2:0 "§Y$VICTORY_POINTS_8036$§!:\n"
 ETH_the_hindenburg_wall:0 "Стіна Гінденбурга"
 ETH_the_lessons_of_war_desc:0 "Ніхто не знає, як вони впораються з тиском на полі бою, не кажучи вже про те, як впораються імперія чи держава. Хоча ми були недостатньо готові до навантажень сучасної війни, наші військові засвоїли важкі уроки війни та стали сильнішими для неї."
