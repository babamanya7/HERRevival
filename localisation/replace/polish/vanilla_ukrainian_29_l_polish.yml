 NOR_neutrality_purple_flag_DEF:0 "Королівство Норвегія"
 NOR_offensive_doctrines_desc:0 "Наша стара доктрина була розроблена на основі припущення, що ми будемо просто захищатися, доки наш ворог не втомиться. Це було очікування наших попередників і наших майбутніх ворогів, і це ще одна причина, чому ми повинні йти в наступ з самого початку. іди."
 NOR_prepare_exile:0 "Підготувати вигнання"
 NOR_proactive_defense_desc:0 "Наші вороги не можуть атакувати, якщо ми їх уже знищили. Перенесімо війну на їхні землі, перш ніж вона торкнеться наших, покажемо їм, що можуть зробити люди [NOR.GetName], коли їм загрожує."
 NOR_rejected_our_offer:0 "Відхилили нашу пропозицію"
 NOR_restart_public_investment_desc:0 "Не час дозволяти нашій інфраструктурі та економіці слабнути через недбалість, лейбористський уряд повинен знову інвестувати в майбутнє країни, будь то цивільне виробництво чи підготовка до війни, яка може настати раніше, ніж ми надія."
 NOR_sabotage_unions_desc:0 "Те, що робітники називають правами людини, для нас — це перешкоди промисловому зростанню. Ми можемо придушити синдикалістський рух зсередини та зовні, тому ми можемо легко усунути будь-які перешкоди нашій військовій готовності."
