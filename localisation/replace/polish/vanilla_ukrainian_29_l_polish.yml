 GER_heavy_tank_destroyer_equipment_3_desc:0 "Jagdtiger був найважчою броньованою бойовою машиною, яка використовувалася під час Другої Світової війни. Машина мала 128-мм гармату PaK 44 L/55 і важку лобову броню."
 GER_heavy_tank_equipment_1_desc:0 "Grosstraktor був серією прототипів для розробки більш важкого танка в Німеччині. Після Першої світової війни Німеччина була обмежена у військових розробках Версальським договором, але секретна програма під назвою «Traktor» розробляла броньовані військові машини та артилерію."
 GER_henschel_kassel_organization:0 "Henschel-Kassel"
 GER_improve_autarkic_economy_tt:0 "§Y$autarkic_economy$§! буде поліпшена."
