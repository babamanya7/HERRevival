 RAJ_GOE_enforced_peace_decision_desc_2_4_tt:0 "§YЯкщо ми контролюємо [431.GetName], [985.GetName], [430.GetName], [432.GetName], [990.GetName] та [434.GetName], ми отримаємо більші територіальні поступки, коли війна закінчиться§!"
 RAJ_a_peacock_prince_desc:0 "Спадщина Моголів вимагає гідного лідера, щоб повернути свій трон. Серед туземних князівств має повстати князь-павич — той, чий родовід, амбіції та бачення можуть відновити велич імперії та знову об'єднати субконтинент."
 RAJ_accept_russian_muhajir_money:0 "Прийняти гроші від російських мухаджирів"
 RAJ_across_the_himalayas_desc:0 "Землі за Гімалаями приховують незліченні багатства та стратегічне значення. Розширюючи вплив Імперії Моголів через ці грізні вершини, ми зміцнюємо наше домінування та забезпечуємо нові рубежі для слави імперії."
 RAJ_air_support_effort_desc:0 "Загальновіскові операції — новий спосіб ведення війни. Ми мусимо зайнятися випуском літаків та підготовкою пілотів, які зможуть надати підтримку нашим наземним арміям та флоту."
 RAJ_azad_hind_tag:0 "Азад Гінд"
 RAJ_bathe_in_hellfire_desc:0 "Наші вороги матимуть лише дві альтернативи: підкоритися або зіткнутися з вогнем."
 RAJ_cv_nav_bomber_equipment_1_short:0 "Shark"
 RAJ_destroyer_1_desc:0 "$ENG_destroyer_1_desc$"
 RAJ_education_efforts_2_desc:0 "Рівень грамотності в [ROOT.GetName] все ще незадовільний. Нам потрібно різко збільшити витрати на освіту, щоб наздогнати великі держави."
 RAJ_education_for_the_masses_desc:0 "Без знань революція занепадає до тиранії.\nГрамотність, політична освіта та наукова підготовка будуть запроваджені в кожному селі та на фабриці."
 RAJ_enable_local_industrialization:0 "Відкриває доступ до рішень §H$RAJ_population_decisions$§!, які дозволяють змінювати дух §H$RAJ_agrarian_society$§!."
 RAJ_establish_the_reserve_bank_of_india:0 "Створити Резервний банк Індії"
 RAJ_favor_the_muslim_league:0 "Сприяти Мусульманській лізі"
 RAJ_heavy_cruiser_2_desc:0 "The Surrey-class heavy cruisers were proposed under the 1928 Naval Program. They were improved versions of the earlier York-class heavy cruisers. Had they been completed, they would have been equipped with four twin 8 in. gun turrets, heavier armor, and more powerful engines. Two ships were ordered but none were laid down."
 RAJ_heavy_tank_artillery_equipment_2_short:0 "Churchill AVRE"
 RAJ_ignite_the_sino_indian_war_desc:0 "Напруженість, що назріває з Китаєм через прикордонні суперечки, більше не можна ігнорувати. Вживаючи рішучих заходів, ми стверджуємо наше домінування в Гімалаях та забезпечуємо наші законні території. Сміливий удар зараз може змінити баланс сил в Азії на нашу користь."
 RAJ_incorporation_of_the_east_india_company_tt:0 "§YРадж§! буде розділений між §YОст-Індійською компанією§! та залишками §YІндії§!."
 RAJ_indian_national_army:0 "Індійська національна армія"
 RAJ_industrial_expansion_desc:0 "Сотні мільйонів громадян вважають Індію своєю батьківщиною, і ми впевнені, що з такою кількістю мешканців ми станемо індустріальною державою."
 RAJ_industrialize_state_desc:0 "Наша країна знову на підйомі. Хоча завдання величезне, залучення сільських територій до сучасної епохи обов'язково принесе дивіденди в майбутньому."
 RAJ_institute_of_fundamental_research_desc:0 "Деякі з наших провідних вчених та промисловців закликають до створення нового інституту фундаментальних досліджень, який займеться останніми розробками в галузі природничих наук."
 RAJ_jet_fighter_equipment_1_short:0 "Meteor"
 RAJ_just_good_business:0 "Просто хороший бізнес"
 RAJ_local_recruitment_offices_tt:0 "Кожен [?RAJ_recruitment_offices_timeout_max]-й місяць зменшуватиме штраф §Y$idea_RAJ_agrarian_society$§! на:\n\t Коефіцієнт набору населення: §G+[?RAJ_agrarian_society_conscription_factor_penalty_reduction_display]%§!\n Швидкість мобілізації: §G[?RAJ_agrarian_society_mobilization_speed_penalty_reduction_display]%§!\n Коефіцієнт вартості закону про мобілізацію: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_penalty_reduction_display]%§!"
 RAJ_local_resistance_to_land_taxes_desc:0 "Уряд у Делі значною мірою фінансується за рахунок місцевих податків. Якщо ми заохотимо опір сплаті цих податків, це задушить уряд і водночас надасть більшу частку багатства його підданим."
 RAJ_mechanized_equipment_3:0 "Windsor Carrier"
 RAJ_mechanized_equipment_3_short:0 "Windsor Carrier"
 RAJ_modern_tank_artillery_equipment_1:0 "Centurion AVRE"
 RAJ_mughal_empire_ADJ:0 "Могольськ"
 RAJ_nav_bomber_equipment_1_short:0 "Swordfish"
 RAJ_preamble_to_the_constitution_of_india:0 "Преамбула до Конституції [GetRajName]"
 RAJ_promote_violence_against_the_british_desc:0 "Час мирного протесту минув. Щоб розірвати ланцюги імперського гніту, ми повинні прийняти прямі дії. Скоординований опір послабить британський контроль та надихне маси повстати проти тиранії."
 RAJ_provincial_autonomy_desc:0 "Отримання додаткової провінційної автономії від британців буде першим вирішальним кроком до виконання кінцевої мети — незалежності."
 RAJ_reform_the_agricultural_system_desc:0 "Надто довго продовольча система Індії була обтяжена недбалістю, безгосподарністю та експлуатацією. З відновленням Імперії Великих Моголів ми повинні гарантувати, що жоден підданий більше не голодуватиме. Інвестуючи у зрошення, модернізуючи сільське господарство та руйнуючи контроль хижих землевласників, ми перетворимо Індію на землю достатку, де голод стане пережитком минулого."
 RAJ_revolt_of_the_princes_tt:0 "Після оголошення війни Британському Раджу туземні князівства повстануть і приєднаються до нас, ставши нашими суб'єктами."
 RAJ_rocket_artillery_equipment_1:0 "RP-3 High Explosive/General Purpose"
