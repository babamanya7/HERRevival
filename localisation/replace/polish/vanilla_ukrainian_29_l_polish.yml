 FIN_entice_the_masses:0 "Залучити маси"
 FIN_foreign_aircraft_desc:0 "[ROOT.GetAdjective]і повітряні сили мусять розширити свої можливості, щоб захистити суверенітет країни та забезпечити безпеку нашої батьківщини. Будуть затребувані проєкти іноземних літаків і експертиза для покращення наших можливостей і розробки наших власних літаків."
 FIN_greater_kingdom_of_finland_ADJ:0 "Фінськ"
 FIN_integrate_kola_and_karelia_desc:0 "Хоча ми встановили міцні стосунки співпраці з нашими [SOU.GetAdjective]ими товаришами, прикордонні суперечки нависають над ними, як дощова хмара, яка готова розірватися. Можливо, нам варто розчистити повітря та нарешті вирішити ці проблеми як союзники, а не як вороги."
 FIN_jaeger_movement_desc:0 "[ROOT.GetAdjective]е верховне командування висунуло пропозицію відновити сили оборони шляхом підвищення офіцерів, які пройшли попередню підготовку єгерів. Ці офіцери є експертами з партизанської війни та диверсійних операцій у тилу ворога, що робить їх ідеальними кандидатами для вдосконалення нові навички підрозділів у нетрадиційній тактиці ведення війни та вести їх у бій."
 FIN_kingdom_of_finland:0 "Королівство Фінляндія"
 FIN_medium_trust_range:0 "Середній рівень довіри"
 FIN_national_defense_category_desc:0 "Захист [ROOT.GetAdjective]их території та незалежності є надзвичайно важливими. Ми мусимо бути готові зробити все можливе, щоби захистити наш народ від будь-яких зовнішніх загроз."
 FIN_pilot_training_desc:0 "Зі збільшенням попиту на повітряні сили в сучасній війні нашим пілотам необхідна більш просунута спеціалізована підготовка. Завдяки інвестиціям у нові методи навчання та обладнання [ROOT.GetAdjective]і повітряні сили можуть гарантувати, що їхні пілоти будуть одними з кращих у світі."
