 ATTACKING:0 "Нападник"
 AUS_STATE_88:0 "Кракау"
 AUS_VICTORY_POINTS_11401:0 "Райхенберг"
 AUS_VICTORY_POINTS_11691:0 "Унгвар"
 AUS_VICTORY_POINTS_3548:0 "Мункач"
 AUS_a_safe_harbor_for_dissidents_desc:0 "Останнім часом політичні вигнанці стали дуже звичним явищем у світі, деякі з них поділяють схожі політичні почуття з нами. Завербувавши цих вигнанців на нашу сторону, ми могли б отримати велику користь від їхніх навичок."
 AUS_align_with_ussr_tt:0 "Нинішній керівник §YКПА§! отримаює рису, що прирівняє його до доктрини правителя §Y[SOV.GetFlag][SOV.GetLeader]§!, авжеж якщо §Y[SOV.GetFlag][SOV.GetNameDef]§! дотримується §YКомунізму§!"
 AUS_ban_dnsap:0 "Викорінювати націоналістів"
 AUS_beyond_our_old_lands_desc:0 "Оскільки ми знову перетворилися на велику державу, це питання постає перед нами ще раз. Ми контролюємо всі наші старі землі, але чому ми маємо зупинятися тут? Завдяки нашій силі, перед якою тремтить вся Європа, подальше розширення не повинно виявитися проблемою."
 AUS_continue_old_production:0 "Продовжити старі виробничі лінії"
 AUS_extend_the_traun_line_desc:0 "У той час як нинішні укріплення захищали північно-західний кордон, ми все ще маємо гірський перевал біля Інсбрука, який залишається без охорони. Подовжуючи лінію укріплень, ми гарантуватимемо, що ворог не пробереться за наші укріплення."
 AUS_grossosterreich_fascism_DEF:0 "Велика Австрія"
 AUS_invest_in_kapsch:0 "Telefon- und Telegrafen-Fabrik"
 AUS_inviting_the_observers:0 "Запросити спостерігачів"
 AUS_mechanized_equipment_1:0 "Austro-Daimler ADMK"
 AUS_mio_trait_improved_suspensions:0 "Покращена підвіска"
 AUS_news_events.3.desc:0 "[AUS.GetAdjective]ий ас, Годвін фон Брумовський, сьогодні зустрів трагічний кінець у жахливій катастрофі над аеродромом Схіпхол. Жертвою, окрім самого аса, також став студент-льотчик з Нідерландівв, якого він тренував.\n\nФон Брумовський був найуспішнішим пілотом могутнього Luftfahrtruppen (ВПС колишньої Австро-Угорщини). На його рахунку 35 самостійних перемог у повітрі, 12 спільних, і 8 непідтверджених. Він брав участь як у Великій Війні, так і в австрійській громадянській війні 1934 року."
 AUS_our_brothers_in_the_east:0 "Наші східні брати"
 AUS_political_events.110.desc:0 "У результаті фінансоаним урядом мітингу у державі [FROM.GetNameDef], ми отримали інформацію про різке зростання анти[ROOT.GetAdjective]их поглядів. [FROM.GetAdjective]е керівництво не зверталося до нас безпосередньо для вирішення цих питань, тож можна припустити, що вони не сильно зацікавлені в дипломатії."
 AUS_political_events.113.a:0 "Як прикро."
 AUS_political_events.114.a:0 "Передайте їм нашу подяку."
 AUS_political_events.19.b:0 "Він брав участь у путчі 1934-го року. Думав, ми про це забудемо?"
 AUS_political_events.54.a:0 "За Габсбург!"
 AUS_political_events.56.a:0 "Чудові новини."
 AUS_political_events.58.b:0 "Це виключено!"
 AUS_political_events.60.a:0 "Ладно, тоді замість нього ми підемо за Францом Беме"
 AUS_political_events.69.t:0 "Ризик аншлюсу ліквідовано"
 AUS_political_events.73.t:0 "[FROM.GetNameDef] пропонує переглянути Сен-Жерменський Договір"
 AUS_political_events.78.t:0 "Комуністи в державі [FROM.GetNameDef] звертаються по нашу підтримку"
 AUS_political_events.9.desc:0 "Вільгельма Ценера, одного з членів нашого військового командування, знайшли мертвим у своїй квартирі. [GER.GetAdjective]і дипломати все заперечують і стверджують, що їх країна не причетна, висуваючи теорію із самогубством через пістолет, який у нього знайшли. Однак докази після кримінальне розслідування кажуть про зовсім інше..."
 AUS_political_events.90.a:0 "Курт Шушніг завжди був демократом у душі!"
 AUS_political_events.94.t:0 "[FROM.GetNameDefCap] відмовляється продавати Аляску"
 AUS_political_events.99.t:0 "[FROM.GetNameDefCap] відхиляє наші вимоги"
 AUS_preparing_the_industry:0 "Виробництво літаків в Lohner-Werke"
 AUS_radar_effort:0 "Зусилля з розробки систем Goldhaube"
 AUS_restoring_our_rightful_flag:0 "Відновлення права на наш прапор"
 AUS_revive_stt:0 "Відродити STT"
 AUS_revive_stt_desc:0 "Stabilimento Tecnico Triestino колись була нашою головною верфлю для наших найбільших суден. Кораблі, які вони виробляли, були виняткової якості та добре служили нам у той час. Оскільки кілька верфей знову під нашим контролем, ми повинні знову повернути їх до роботи."
 AUS_seize_galicia_tt:0 "§Y[88.GetName]§!, §Y[89.GetName]§! і §Y[91.GetName]§! стануть осередними.\n\nОтримає §YЦіль Війни§! на завоювання осередних земель §YГаличини§!."
 AUS_spanish_intervention_desc:0 "Піренейський півострів було охоплено полум'ям громадянської війни. Багато зовнішніх сил втручаються в конфлікт між націоналістами та республіканцями, і ми не бачимо причин, чому б нам також не поступити так само. Втрутившись, ми могли б дозволити нашим військам отримати більше досвіду ведення сучасної війни та отримати орієнтир того, наскільки добре наша армія відповідають сучасним стандартам."
 AUS_stalinism_DEF:0 "Австрійська радянська республіка"
 AUS_subjugating_the_lands_of_old_category:0 "Повернення старих земель"
 AUS_subjugating_the_lands_of_old_decision_tt:0 "§Y[FROM.OWNER.GetNameWithFlag]§! стане §YАвстро-Угорським васалом§!."
 AUS_suddeutschland_neutrality_ADJ:0 "Південнонімецьк"
 AUS_the_czechoslovakian_lands_desc:0 "Території на північ від нас належать недо/країні, званою Чехословаччиною, вони були частиною нашої великої імперії, перш ніж уся вона розвалилася. До цього дня в цих регіонах живе багато німецькомовних груп, і виходячи з цього цілком правильно, щоб вони знову стали частиною нашої відродженої Імперії. Чи буде за це пролита кров чи ні, залежить від них."
 AUS_the_evidenzburo_desc:0 "Разом із багатьма іншими нашими ретельно розробленими системами, бюро доказів (Evidenzbureau) було демонтовано наприкінці Великої Війни. Оскільки ми більше не зв’язані ганебним договіром, немає жодних причин, щоб ми дотримувалися цієї безглуздості, згідно з якою розвідувальне агентство більше не може існувати."
 AUS_the_right_to_rearm_desc:0 "З часів Великої Війни ми були зобов’язані Сен-Жерменським Договіром обмежити чисельність нашої регулярної армії до 30 000 особ. Враховуючи розвиток подій навколо нас, ми вважаємо, що нині це неможливе, і що нам потрібно надати право озброїтися."
 AUS_volunteer_effort_SPR_flag:0 "Ми відправляли добровольців в Республіканську Іспанію"
 AUTOMATION_HOMEBASE_ON:0 "§Yввімкнено§!"
 AUTONOMY_CHANGE_COST:0 "Вартість (£pol_power£): $VALUE$"
 AZR_communism:0 "Азербайджанська соціалістична республіка"
 AZR_fascism:0 "Імперія Вогню"
 Aggression:0 "Агресія"
 Antioch:0 "Антіохія"
 BAH_democratic_ADJ:0 "Багамськ"
 BALTIC_arm_baltic_reds:0 "Озброїти балтійських червоних"
 BALTIC_direct_intervention_desc:0 "Ми виявилися нездатними захопити владу самостійно — треба покликати на допомогу наших союзників з держави [SOV.GetNameDef]."
 BALTIC_eastwall:0 "Східний вал"
 BALTIC_events.1.d:0 "Цього ранку з держави [From.GetNameDef] прибула телеграма, адресат якої — [Root.GetLeader]. У посланні вимагали, щоб держава [Root.GetNameDef] відновила свої гарантії [From.GetAdjective] незалежності. Згадуючи довгу дружбу держав [Root.GetNameDef] і [From.GetNameDef] з моменту зародження держави в 1918 році, [From.GetLeader] наполягає, що виживання [From.GetLeader.GetHerHis] нації необхідне для тривалого миру в Східній Європі.\n\nВідносини між державами [From.GetNameDef] та [SOV.GetNameDefCap] напружені, і, прийнявши те, що пропонує [From.GetLeader], можна нарватися на конфлікт із [Root.GetNameDef] державою..."
 BALTIC_events.12.t:0 "Наліт «лісових братів» у державі [forest_brothers_raid_state_target.GetName]"
 BALTIC_events.2.t:0 "[From.GetNameDefCap] шукає співробітництва на Балтиці"
 BALTIC_events.7.a:0 "Цікаво!"
 BALTIC_events_7_tt:0 "Станеться подія §Y[Root.GetNameDefCap] просить про вторгнення у Фінляндію§!."
 BALTIC_finnish_invasion:0 "Фінське вторгнення"
 BALTIC_forment_disloyalty_desc:0 "Як у [Root.GetAdjective]ому уряді, так і за його межами є багато різних рухів, і, якщо ми хочемо скинути тиранію, що долає державу [Root.GetNameDef], нам потрібно стати єдиним голосом усіх, хто в опозиції до партії [Root.GetNeutralParty]!"
 BALTIC_rejoin_the_railways_desc:0 "Німецькі та російські окупанти завжди вважали нас простою глушиною, але досить це терпіти. [ROOT.GetNonIdeologyName] досягне свого максимального потенціалу за допомогою індустріалізації, а почнемо ми з залізниць та інфраструктури."
 BALTIC_revolutionary_cabinet:0 "Кабінет революціонерів"
 BALTIC_trade_with_neighbors_desc:0 "Кожного разу, коли ми інвестуємо в торгівлю з німцями або радянцями, ми робимо гірше собі. Не можна, щоб ворожі війська вторглися в державу [Root.GetNonIdeologyName], харчуючись пайками з литовського зерна. естонської нафти ми мусимо допомагати не їм, а один одному, щоби розгромити спільного ворога."
 BALTIC_will_be_at_war_with_LAT:0 "Якщо вони погодяться, §Y[Root.GetNameWithFlag]§! негайно опиниться §Rу війні§! з державою §Y[LAT.GetNameWithFlag]§!."
 BANNED:0 "Вас виключили з цієї гри"
 BAN_communism:0 "Бенгальська народна республіка"
 BAR_neutrality_ADJ:0 "Баротсейськ"
 BAS_fascism_ADJ:0 "Британо-вестіндійськ"
 BAY_communism_ADJ:0 "Баварськ"
 BBA_african_union_events.1.t:0 "Організація Африканської Єдності пропонує членство"
 BBA_african_union_events.3.desc:0 "[FROM.GetNameDefCap] відмовились від пропозиції щодо членства в Організації Африканської Єдності. Поки що неясно, чи це через внутрішні політичні обставини, чи через те, що їхні зовнішньополітичні амбіції в Африці не сумісні з нашими. Можливо, в майбутньому вони погодяться приєднатися."
 BBA_ethiopia_communist_events.10.t:0 "[SOV.GetNameDefCap] відмовляється надсилати спорядження"
 BBA_ethiopia_communist_events.14.desc:0 "[ETH.GetNameDefCap] звертається по підтримку у створенні власних повітряних сил. У їхньому плані йдеться про відправку добровольців для навчання разом із нашими пілотами на старих літаках із резерву. Це чудова можливість для наших пілотів здобути досвід і випробувати техніку проти [ITA.GetAdjective]."
 BBA_ethiopia_communist_events.15.a:0 "Це давно було потрібно."
 BBA_ethiopia_communist_events.54.a:0 "Дякуємо вам, товариші!"
 BBA_ethiopia_exile_events.07.t:0 "[FROM.GetNameDefCap] погоджується з нашим запитом"
 BBA_ethiopia_exile_events.40.c:0 "Ми повинні провести нові кордони, які будуть більш стабільними"
 BBA_ethiopia_exile_events.42.a:0 "Зрозуміло"
 BBA_ethiopia_fascist_events.04.desc:0 "$ETH_abba_jofir$, син останнього султана $jimma_RU_Gen$, запропонував співпрацювати з державою [ROOT.GetName] в обмін на визнання [ROOT.GetAdjective]ою владою статусу $ETH_abba_jofir$ як правителя $jimma_RU_Gen$. Звісно, $jimma$ стане частиною [ROOT.GetAdjective]ої імперії, а $ETH_abba_jofir$ присягне на вірність [ROOT.GetAdjective]ій короні, якщо [ROOT.GetName] прийме пропозицію."
 BBA_ethiopia_fascist_events.07.desc:0 "[ROOT.GetEthiopianCollaboratorName] відкрито виступив на боці італійців і проти імператора, заявивши, що це народження нової [ROOT.GetAdjective]ої держави. Незважаючи на відчайдушне становище, $ETH_haile_selassie$ відмовляється визнавати поразку. Боротьба вже почалася, і хоча більша частина старої гвардії досі на боці імператора, бій, дуже ймовірно, може скінчитися лише в один бік."
 BBA_ethiopia_fascist_events.50.t:0 "[ETH.GetAdjectiveCap]і війська окуповують [ROOT.GetAdjectiveCap]ий Сомаліленд"
 BBA_ethiopia_fascist_events.52.a:0 "Вони програли одну нещодавню війну, і ось програють іще одну."
 BBA_ethiopia_fascist_events.59.a:0 "Втрачена можливість."
 BBA_ethiopia_fascist_events.65.a:0 "Ми винагородимо їхню лояльність."
 BBA_ethiopia_fascist_events.68.t:0 "Склад [ITA.GetAdjective] розграбовано"
 BBA_ethiopia_industrial_financial_events.5.desc:0 "[FROM.GetLeader] has signed the document that unites [ROOT.GetName] and [FROM.GetName]. The economic policies will be aligned, the foreign offices are to combined into one. The judicial systems will be merged to make full cooperation easier.\n[FROM.GetNameDefCap] will from this day be an integral part of [ROOT.GetName]."
 BBA_italo_ethiopian_war_events.201.t:0 "Підвищення бойового духу армії"
 BBA_italo_ethiopian_war_events.400.b:0 "Із державою [AFA.GetNameDef] ми можемо розквитатися пізніше. Зараз не час."
 BBA_italo_ethiopian_war_events.503.desc:0 "Уряд Ефіопії відмовився від вимоги британців підписати з нами мирну угоду. Це призвело до того, що [ENG.GetLeader] вигнав ефіопів із держави [ENG.GetNameDef], надіславши всім чіткий сигнал, співпрацю з якою країною вони цінують більше. Це залишає нам можливість і надалі зміцнювати наші африканські володіння!"
 BBA_italy_anti_colonialism_events.08.desc:0 "Здається, що новий уряд держави [FROM.GetName] бажає виправити деякі недоліки менш вишуканого ставлення своїх попередників до [ROOT.GetAdjective]ого народу, і вирішив інвестувати в нашу країну для змін."
 BBA_italy_anti_colonialism_events.103.a:0 "Чи приймуть це [FROM.GetAdjective]і люди?"
 BBA_italy_anti_colonialism_events.56.desc:0 "Жителі Західної Африки побачили, як доброзичливо та ефективно ми управляємо їхніми землями, і проголосували за те, щоб приєднатися до нашої адміністрації! Здається, що наші інвестиції та турбота про їхні провінції окупилися. Це, безумовно, піде на користь усім нам."
 BBA_italy_anti_colonialism_events.61.t:0 "Південна Африка голосує за вихід з держави [ROOT.GetNameDef]"
 BBA_italy_bop.2.a:0 "Ми піднімемося!"
 BBA_italy_civil_war.101.t:0 "[FROM.GetName] Передає італійську територію"
 BBA_italy_democratic_events.03.t:0 "Італійська мафія знову повстає"
 BBA_italy_interaction_events.1.a:0 "Це ще одне слабке місце, яке нам потрібно захищати"
 BBA_italy_interaction_events.12.desc:0 "[FROM.GetLeader] заявив, що у них немає причин чинити опір нашій волі, і що територія Чорногорії буде передана нам негайно. Сьогодні великий день для італійської нації!"
 BBA_italy_interaction_events.14.b:0 "Це означало б, що ми не можемо захистити себе!"
 BBA_italy_interaction_events.29.desc:0 "Італія намагається відібрати у нас регіон [802.GetName], приєднавши його до свого королівства Албанія. Якщо ми нічого не зробимо, наші права на регіон будуть втрачені назавжди. "
 BBA_italy_interaction_events.70.desc:0 "Ми відправили посланця до [GetAdjective]ого лідера з питанням, чи готові вони відкинути наші розбіжності й сформувати новий уряд під італійським наглядом."
 BBA_italy_interaction_events.9.desc:0 "[FROM.GetLeader] від держави [FROM.GetNameDef] люб'язно прийняв наші вимоги щодо окупації Далмації, а згодом поступився нам цією територією. Вони радше заспокоять нас, аніж виступатимуть проти нас, що лише сприятиме досягненню цілей Італії на Балканах."
 BBA_italy_local_rulers.3.b:0 "Зробити $ETH_hailu_tekle_haymanot$ губернатором регіону."
 BBA_italy_missiolinis.111.a:0 "Далмація по праву наша."
 BBA_italy_missiolinis.113.a:0 "Несправедливість виправлено."
 BBA_italy_missiolinis.131.desc:0 "Відтоді, як Ганнібал перетнув Альпи зі своїми слонами, гори стали для варварів магістраллю, що веде вглиб Італії. Дуче давно мріє убезпечити північні гірські перевали та хоче скористатися можливістю включити італомовне населення Тічіно до складу своєї Батьківщини - об'єднати італійський народ, де б він не перебував."
 BBA_italy_missiolinis.32.t:0 "Поступ індустріалізації відстає"
 BBA_italy_missiolinis.63.a:0 "Наші запаси, безумовно, знадобляться."
 BBA_italy_missiolinis.council:0 "Велика рада має більш нагальні питання..."
 BBA_italy_naval_cooperation_programs.04.a:0 "Avanti!"
 BBA_italy_naval_cooperation_programs.15.t:0 "[FROM.GetName] купує наші карликові підводні човни"
 BBA_italy_sends_military_support.1.desc:0 "[FROM.GetNameDefCap] хоче підтримати нас у наших військових зусиллях і надіслала деяке спорядження. Це досить невелика партія, але ми раді будь-якій допомозі."
 BBA_swiss_expansion.10.desc:0 "Міста по всіх Альпах святкують об'єднання наших двох альпійських народів! Тепер ми зможемо краще захистити себе від великих держав, що нас оточують."
 BBA_switzerland.5.a:0 "Вона заслуговує на правосуддя за цей жахливий злочин!"
 BBA_switzerland.5.t:0 "[SWI.GetName] вирішує продовжити суд над убивцею Густлоффа"
 BBA_switzerland.6.t:0 "[GER.GetAdjective] тисне на нас із вимогою суворого вироку для Давіда Франкфуртера"
 BBA_switzerland.97.b:0 "Він і його родина можуть залишитись у Швайцарії та виступати, попри все"
 BBA_switzerland_fascist.3.b:0 "Їм не можна довірити це"
 BBA_switzerland_trade.1.b:0 "Наші цивільні економіки допоможуть одна одній"
 BBA_switzerland_trade.1.desc:0 "Попри свою історичну нейтральність, [FROM.GetNameDefCap] прагне укласти з нашою країною торговельну угоду. Або вони хочуть зблизитися з нами, або ж вони у гіршому становищі, ніж ми думали. \n\nУ будь-якому разі, ми можемо отримати вигоду, отримавши доступ до їхніх промислових потужностей та зручного розташування без необхідності вторгнення в їхню добре укріплену країну. З іншого боку, це може посилити їхні позиції у разі можливого вторгнення з боку [ROOT.GetNameDef]."
 BBA_switzerland_trade.5.desc:0 "Попри вигідні умови, які ми надали [FROM.GetName] у нашій взаємній торговельній угоді, вони вирішили її не поновлювати й діяти самостійно. \n\nНам важко зрозуміти, чому вони так вирішили, але, можливо, це на краще."
 BBA_switzerland_trade.8.desc:0 "З огляду на зростання напруги у світі, торгівля ускладнюється, а під час війни можливості купівлі-продажу золота ще більше скоротяться. Якщо ми їм довіряємо, нейтралітет [FROM.GetName] може стати можливістю зберігати наші резерви та вільно торгувати, що зміцнить нашу економіку — і зрештою, нашу воєнну машину."
 BBA_switzerland_trade.9.t:0 "[FROM.GetNameDefCap] погоджується торгувати золотом через нас"
 BEL_40_hour_workweek:0 "40-годинний робочий тиждень"
 BEL_SPR_alliance:0 "Бельгійсько-іспанський альянс"
 BEL_command_power_25:0 "£command_power£ §Y25§!"
 BEL_fortify_liege_tt:0 "Будує рівень 1 §Y$bunker$§! у §Y[34.GetName]§! уздовж річки Мьоз у провінціях, що мають для цього місце"
 BEL_greater_netherlands:0 "Дітсланд"
 BEL_join_axis_desc:0 "Ми були ізольовані занадто довго, настав час приєднатися до наших германських братів і укріпити альянс між нами для захисту та розширення наших спільних амбіцій."
 BEL_la_dame_blanche:0 "Ля Дам Бланш"
 BEL_light_tank_destroyer_equipment_1_short:0 "T-13"
 BEL_minerva_imperia_desc:0 "Бельгія була не тільки лідером у використанні броньованих автомобілів під час Першої світової війни, а й займала провідне місце в автомобільній промисловості протягом міжвоєнного періоду. Два наших найбільших виробники, Minerva і Imperia, нещодавно об'єдналися, і було б великою шкодою, якщо ми не використаємо їхнє лідерство на нашу загальну вигоду."
 BEL_spending_gold_reserves_flag:0 " Зараз інвестуємо золотий резерв"
 BEL_the_new_ruhr_desc:0 "Регіон Рур у Німеччині відомий своєю величезною промисловою потужністю, настільки, що став об'єктом заздрості серед інших великих держав. Бельгія також має претензії на промислову велич, і потенціал, який може значно перевищити той, що є в нашого сусіда. У нас є можливості, у нас є ресурси, у нас є прагнення і, що найголовніше, у нас є люди."
 BEL_val_benoit_institutes_desc:0 "Ми повинні заснувати Інститути Валь-Бенуа при Льєзькому університеті, створивши кілька нових наукових відділів на руїнах старої абатства Валь-Бенуа."
 BIA_fascism:0 "Великий Ігболенд"
 BLR_GER_autonomy_integrated_puppet:0 "Райхскомісаріат Біла Русь"
 BLR_baltic_DEF:0 "Балтійська держава Білорусь"
 BM_EXPERIENCE:0 "Досвід"
 BM_TEMPORARY_UNIT_BONUS:0 "Бонус від навичок комундувача"
 BOL_democratic:0 "Болівійська республіка"
 BOL_orelia_neutrality_DEF:0 "Орелія"
 BOL_reintegrate_litoral_department:0 "Відновлення департаменту Літораль"
 BORDER_WAR_POWER_RATIO:0 "Співвідношення військової моці на нашу користь: $VAL|2%H$"
 BOU_democratic_DEF:0 "Республіка Бугенвіль"
 BRA_amazonian_settlement_in_progress:0 "Наразі пропонується земля в області"
 BRA_ban_political_parties:0 "Заборонити політичні партії"
 BRA_collectivization_of_agriculture_desc:0 "Наша сільськогосподарська промисловість досить фрагментована і не працює так ефективно, як могла б. Колективізувавши галузь та передавши її робітникам як колективу для проведення необхідних реформ, ми могли б вирішити цю проблему та багато інших."
 BRA_cooperation_in_the_americas:0 "Політика добросусідства"
 BRA_democratic_union:0 "БДС"
 BRA_destroyer_1_desc:0 "The Maranhão was a British-built K-class destroyer that was sold to Brazil in 1922. The ship displaced just over 930 tons and was armed with four 4 in. guns."
 BRA_destroyer_3_desc:0 "The Marcílio Dias-class destroyers (sometimes referred to as M class, or Greenhalgh class) were three ships of the Brazilian Navy that were commissioned in 1943. They were based on the U.S. Mahan-class destroyers and were the first sizable ships built in Brazil. They displaced 1,500 tons and were armed with five 5 in./38 cal main guns."
 BRA_ensure_continued_military_support:0 "Забезпечити підтримку армії"
 BRA_fabrica_nacional_de_motores:0 "Національна фабрика моторів"
 BRA_foreign_legion_recruitment_in_progress:0 "Проводить найм"
 BRA_implement_a_national_guard:0 "Впровадити Національну гвардію"
 BRA_implement_article_138:0 "Впровадити статтю 138"
 BRA_infantry_at:0 "M1 Bazooka"
 BRA_italian_aircraft:0 "Італійська програма розвитку літаків"
 BRA_mechanized_equipment_2:0 "M3 Half-Track"
 BRA_new_capital:0 "Бразиліа"
 BRA_oust_the_empires_decision_cat:0 "Антиколоніалізм Південної Америки"
 BRA_promote_immigration_to_brazil:0 "Сприяти імміграції"
 BRA_radio_nacional_desc:0 "Багато націй починають створювати національні мовні установи для надання фактичного контенту та розваг масам через радіохвилі. Ми не дозволимо собі відставати в таких починаннях, заснувавши власне Національне радіо."
 BRA_rossi_organization:0 "Amadeo Rossi"
 BRA_union_of_latin_american_socialist_republics_desc:0 "Наш революційний рух продовжує руйнувати структури буржуазного суспільства по всьому континенту. Зрозуміло, що ми більше не рух [ROOT.GetAdjective]ої нації, ми — рух південноамериканців, і настав час, щоб наші політичні структури краще відображали цю зміну."
