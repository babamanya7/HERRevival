 MEX_focus_liberty_and_justice_for_all_desc:0 "Американці зараз є найбільшою економічною силою в історії. Можливо, Радянський Союз швидко індустріалізується, а німці краще розуміють війну, але переваги Америки доповнюються її наполяганням на свободі для особистості та опорою на інституції, а не на грубу силу. Розширення наших економічних зв'язків до військового альянсу було б цілком природним."
