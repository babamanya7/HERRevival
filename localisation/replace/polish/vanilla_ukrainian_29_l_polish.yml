 TUR_the_sanayiciler:0 "Sanayiciler"
 TUR_thwarting_kemalist_infiltration_desc:0 "Не дати кемалістам поширювати свою отруту і далі — не просто громадянський, але й божественний обов'язок."
 TUR_victory_or_death_against_communism_generic_desc:0 "Всесвітня боротьба з [SOG.GetAdjective]им імперіалізмом — права справа. Це не просто суперечка про межі: ми боремося за наш спосіб життя проти жахливого загарбника, який все знищує на своєму шляху. У нас немає права на поразку."
