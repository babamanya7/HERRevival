 NOR_complete_the_sourthern_railway_network_desc:0 "Навіть якщо південна частина [ROOT.GetNonIdeologyName] є чимось більш розвиненою, ніж північна, якщо ми почнемо порівнювати її інфраструктуру з інфраструктурою інших країн, навіть сусідніх, стане зрозуміло, що ще багато чого залишилося має бути зроблено."
