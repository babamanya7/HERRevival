 SPR_torchbearers_of_tomorrow_desc:0 "Ті, хто робить свою роль у підтримці нашої справи, чи то через інтелектуальну чи військову діяльність, є втіленням майбутнього. Це усвідомлення цілком може бути потужною рушійною силою, тому ми повинні переконатися, що вони усвідомлюють важливість своєї роботи."
