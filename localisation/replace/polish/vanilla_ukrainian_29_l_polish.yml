 news.104.d:0 "Київ, столиця Української РСР, був захоплений німецькими військами, які просуваються вглиб території Радянського Союзу.\n\nВтрата одного з найбільших міст стане для СРСР серйозним ударом, але поки незрозуміло, чи німці зможуть і далі рухатися з тією ж швидкістю. Незабаром після взяття Києва тисячі мін, закладених військами НКВС, детонували в будинках, розташованих уздовж Хрещатика — головної вулиці міста, — зруйнувавши його ще сильніше. Тепер загарбники прагнуть йти на схід."
 news.110.d:0 "Бої в районі Вашингтону завершилися сьогодні, коли останні осередки опору були знищені німецькими силами, що просуваються вздовж річки Потомак. Густа завіса диму майже приховала місто. Частково причиною пожеж стали офіцери розвідки, які до останнього моменту спалювали секретні документи. Підрозділ військ SS захопив Білий дім після короткої битви з офіцерами спецслужб, але самого президента, схоже, евакуювали кілька днів тому.\n\nПадіння американської столиці чітко продемонструвало страшну міць німецької військової машини."
 news.114.d_council:0 "Останнє вогнище французького опору було придушене сьогодні в Парижі, і тепер місто перебуває під контролем італійців.\n\nПредставники [ITA.GetLeader] прилетіли, щоб особисто провести парад перемоги на Єлисейських полях й очолили його верхи на білих конях. В урочистій промові деякі члени ради порівняли французьку кампанію з завоюванням Галлії Цезарем і пообіцяли, що це лише початок відродження величі Італії.\n\nЧас покаже, чи праві вони."
 news.12.c:0 "Ми мусимо підготувати оборону."
 news.131.d:0 "У Берліні йдуть відчайдушні бої, але попри це столиця Німеччини вже майже повністю в руках поляків. Просунувшись у місто по Франкфурт-алеї, польська армія досягла Александерплац, де розгорілася найзапекліша битва.\n\nБранденбурзькі ворота обрушилися, ймовірно, після того, як їх протаранив польський танк, а будівля Кролль-опери була знищена артилерійським вогнем, коли загони SS, що засіли там, відмовилися здатися. Червоно-білий прапор Польщі майорить над Райхстагом, війська придушують останні осередки опору."
 news.161.c:0 "Можливо, це було необхідно."
 news.165.c:0 "Це прикро."
 news.165.e:0 "Разом ми переможемо!"
 news.165.t:0 "Криза в Словенії"
 news.168.b:0 "Цього дня померла мрія."
 news.171.d_ITA_BUL:0 "Німеччина запропонувала свої послуги посередника у суперечці між Грецією з одного боку та Італією та Болгарією з іншого боку, але Греція відмовилася — [GRE.GetAdjective]ий уряд твердо заявив, що [GRE.GetAdjective]а армія готова захищати країну і швидше помре в бою, ніж здасться на милість стерв'ятників та шакалів, які підтримують Німеччину."
 news.173.d_2:0 "Комуністичні делегації з усього світу зустрілися сьогодні у Парижі на установчому з'їзді, який заклав основу Четвертого інтернаціоналу. Ідея його створення обговорювалася роками, поки прихильники теорій Троцького не взялися за її реалізацію.\n\nСталін відреагував на зростаючу підтримку троцькізму за кордоном, організувавши нову серію політичних вбивств і посиливши пропаганду проти свого колишнього конкурента. Високопоставлені радянські військові та партійні чиновники добре пам'ятають нещодавні чистки, тому навряд чи чинитимуть якийсь опір."
 news.178.c:0 "Трагічний розвиток подій для Третьої республіки."
 news.183.c:0 "Допоки вони зайняті боротьбою один з одним..."
 news.187.t:0 "Італія шукає підтримки від [GRE.GetName]"
 news.198.d:0 "[From.GetName] відхилила [SOV.GetAdjective]і вимоги в ультиматумі, висунутому їм щодо островів в Егейському морі. Оскільки [SOV.GetName] здійснює все більший і більший вплив на регіон, [From.GetLeader] заявив, що надання їм одного острова в Егейському морі закінчиться тим, що вони захоплять все Середземномор'я.\n\nВідхиливши ультиматум, [From.GetName] опинився на межі війни і може лише чекати, коли [SOV.GetNameDef] натисне на спусковий гачок."
 news.20.c:0 "Тут треба провести лінію!"
 news.205.c:0 "Можливо, зараз нам буде важко знайти союзників в Америці"
 news.208.d:0 "Збройні сили Японії давно визнали, що [JAP.GetName] не володіє природними ресурсами, необхідними для ведення тривалої війни. Зі зростанням напруженості і спалахами збройних конфліктів за участю великих світових держав, загроза втрати імпорту здається більшою з кожним днем.\nЩоб протистояти цьому, японські стратеги розробили стратегічний план захоплення західних колоній в Південно-Східній Азії і Тихоокеанському регіоні. Ці багаті на ресурси регіони підживлюватимуть японську військову машину і дозволять їй продовжувати більш-менш безперешкодно, доки колоніальні держави і [USA.GetName] будуть триматися на відстані."
 news.211.a:0 "[JAP.GetFactionName] збільшується"
 news.215.d_soviet:0 "[GER.GetLeader] був затятим противником комунізму ще до того, як прийшов до влади, і ніколи не було сумнівів, що [GER.GetNameDef] вважає себе ворогом [SOV.GetNameDef].\n\nСьогодні це ставлення було оголошено світові, оскільки раніше укладена \"Антирадянська угода\" між [GER.GetNameDef] та кількома іншими країнами тепер оформлена у вигляді пакту. Інші учасники будуть закликані у війну, якщо одна з них втягнеться в конфлікт проти нас."
