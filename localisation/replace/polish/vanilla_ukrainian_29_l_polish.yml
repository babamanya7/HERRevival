 denmark_trade_deal.1.desc:0 "Данська делегація звернулася до нас із торговою пропозицією. Данія виробляє велику кількість продуктів, і історично склалося так, що чималу їхню частину ми імпортуємо. Нещодавно вони девальвували свою валюту, крону, підвищивши конкурентоспроможність сільськогосподарської продукції. Ця торговельна угода могла б дуже допомогти нам, забезпечивши їжею населення і посиливши маршрути поставок."
 denmark_trade_deal.4.desc:0 "[FROM.GetLeader] відправляє до нас торгову делегацію з проханням розширити вже укладену торговельну угоду для сільськогосподарської продукції. Схоже, вони хочуть ще більше наших товарів. Розширивши угоду, ми створимо робочі місця і ще більше зміцнимо позиції наших фермерів."
