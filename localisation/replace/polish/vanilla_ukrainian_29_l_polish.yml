 MTG_naval_treaty.11.a:0 "Це була шляхетна спроба забезпечити мир."
 MTG_naval_treaty.6.b:0 "Договори лише настільки сильні, наскільки сильне бажання їх дотримуватися..."
 MTG_send_treaty_warning_to_FROM_desc:0 "Схоже, [From.GetNameDef] вважає, що ми не помітимо його порушень при будівництві флоту. Треба повідомити його представників, що вони помиляються."
 MUN_czech.1018.d:0 "Незважаючи на всі наші дипломатичні зусилля, ми не змогли заручитися іноземною підтримкою для превентивного вторгнення в [GER.GetName]. Тепер постає питання, чи варто взагалі втілювати наші плани наступу."
 MUN_czech.1019.a:0 "Можливо, це убезпечить нас"
 MUN_czech.1021.b:0 "Ми маємо захищати національних виробників"
 MUN_czech.1040.d:0 "[CZE.getnameDEFCAP] нещодавно відновила дипломатичні переговори щодо митного союзу між нашими двома країнами. Угода, яку вони намагаються укласти, здається справедливою, але згодом може містити інші вимоги, до яких ми можемо бути не готові. Цей договір і те, що становить предмет торгівлі, виглядає тривіальним і символічним, тому від його підписання не буде жодної шкоди."
 MUN_czech.1042.d:0 "Переконавшись, що Договір є задовільним, [FROM.getname] погодилася з його умовами. Сподіваємось, це перший крок до більш тісних зв'язків між нашими двома країнами."
 MUN_czech.1043.a:0 "Ми згодні"
 MUN_czech.1043.d:0 "Посилаючись на тісніші зв'язки між нашими країнами та останні події у світі, [FROM.getname] заявила, що нам буде краще під їхнім захистом, ніж на самоті. Це виглядає як хитрий план, щоб просто окупувати нашу територію. Що ми маємо робити?"
 MUN_czech.2.t.3:0 "Судетська робітнича міліція просить про допомогу"
