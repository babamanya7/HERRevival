 HINT_DIVISION_DESIGNER_NOXP_TEXT:0 "Це §Yконструктор дивізій§!. Його використовують для створення нових і редагування існуючих §Yшаблонів дивізій§!. Створення та редагування коштуватиме Вам £army_experience£ §Yдосвіду армії§!. Досвід армії накопичується, коли Ваші війська беруть участь у боях або армійських навчаннях. Військові частини 1 рівня досвіду — §YНенавчені§! не генерують £army_experience£ досвід армії.\n\nВам знадобиться більше £army_experience£ досвіду армії, перш ніж Ви зможете створити або відредагувати шаблон."
 HINT_WORLD_TENSION_TEXT:0 "Це екран £world_tension_icon£ §Yсвітової напруженості§!. Усі події, що так чи інакше впливають на рівень напруженості, будуть записані в хроніці.\n\nСвітова напруженість — це міра того, наскільки загострилася ситуація у світі. У деяких держав певні §Yдипломатичні дії§! будуть заблоковані до досягнення певного рівня світової напруженості.\n\nЗагалом, державам Осі вигідніше втримувати світову напруженість на низькому рівні, щоби не дозволити демократичним державам втручатися в їхні справи. Демократичні держави, з іншого боку, прагнутимуть якомога вищий рівень світової напруженості, щоб отримати можливість втручатися.\n\nОголошення війн, виправдання претензій, анексування територій, виконання певних §Yнаціональних фокусів§! — ось приклади дій, що можуть збільшити рівень світової напруженості.\n\nЩо більша світова напруженість, то ближчий світ до нової світової війни."
