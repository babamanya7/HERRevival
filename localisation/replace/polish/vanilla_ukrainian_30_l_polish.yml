 ARG_CAS_equipment_2:0 "I.Ae 22 DL"
 ARG_CAS_equipment_3:0 "I.Ae 30 Nancu P2"
 ARG_argentine_nationalism_desc:0 "Дух конкістадорів тече в наших жилах, і було б розумно дотримуватися їхнього імені завойовників Америки. Давайте згуртуємо тих, хто хоче боротися і померти за свою країну, і підготуємо наші галузі промисловості до масового виробництва зброї та машин. [ARG.GetNameDefCap] готується до війни!"
 ARG_conquer_uruguay:0 "Закріплення позицій"
 ARG_democratic:0 "Аргентинська республіка"
 ARG_develop_civilian_economy_desc:0 "Оскільки ми більше зосереджуємося на наших містах, важливо, щоб ми забезпечили зручності, необхідні [ARG.GetName] народу. Якщо ми зможемо забезпечити щастя нашого народу, це лише зміцнить нас. Інвестування в негайний розвиток більшої кількості фабрик — це шлях вперед."
 ARG_economic_tax_reforms_decisions:0 "Економічні податкові реформи"
 ARG_fma_organization:0 "FMA"
 ARG_forge_our_own_future:0 "Творити наше власне майбутнє"
 ARG_industrial_expansion_bonus:0 "Бонус до промислових технологій"
 ARG_international_loan_decisions_desc:0 "Щоби відновити [ROOT.GetAdjective]у економіку, було б розумно звернутися до великих держав світу за позикою, аби запустити процес нашого омолодження. Однак нам слід бути обережними, щоби не залізти в надто великі борги."
 ARG_international_loan_tt:0 "Додасть модифікатор §Y$ARG_international_loan_modifier$§!, котрий дасть:\n $MODIFIER_POLITICAL_POWER_COST$: §R-20.0%§!\n $MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+5.0%§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+4.0%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+6.0%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+6.0%§!\n"
 ARG_invite_spanish_nationalists:0 "Запросити іспанських націоналістів"
 ARG_light_cruiser_2:0 "Клас «La Argentina»"
 ARG_military_union_south_america_ADJ:0 "Південноамериканськ"
 ARG_political_events.17.t:0 "[PAR.GetNameDefCap] відмовляється від умов ультиматуму"
 ARG_political_events.20.desc:0 "Уряд [URG.GetAdjective] вирішив погодитися на умови, які ми висунули в нашому ультиматумі. Тепер ми можемо офіційно здійснити колоніальний план, який наші [GER.GetAdjective] союзники розробили багато років тому. Вони, безумовно, будуть задоволені цим поворотом подій."
 ARG_political_events.5.desc:0 "Протягом багатьох років Фолклендські та Південна Джорджія острови були [ENG.GetAdjective] суверенною територією. Однак, схоже, [ARG.GetAdjective] уряд офіційно вимагає передати острови під їхню опіку, що дозволить їм краще забезпечити безпеку Південної Атлантики в ці важкі часи."
 ARG_political_events.70.desc:0 "Нарешті наш новий комуністичний уряд досяг рівня стабільності, за якого ми можемо відкрити першу Конференцію в Буенос-Айресі. Тут ми можемо вирішити майбутнє КПА та хто може бути гідним керувати країною в наступні роки. Цього року у нас є два сильні кандидати з різними ідеями щодо майбутнього [ARG.GetNameDef]. Наш нинішній лідер, Фанні Едельман, продовжуватиме дотримуватися статусу-кво, пропонуючи стабільність та зосереджуючись на [ARG.GetNameDef] на світовій арені. Антоніо Сото, з іншого боку, є колишнім патагонським повстанцем, який вважає, що ми повинні працювати над тим, щоб [ARG.GetNameDef] пішла шляхом анархо-синдикалізму та згодом скасувала будь-яку форму ієрархії в країні. Хто повинен взяти на себе мантію прем'єра [ARG.GetNameDef]?"
 ARG_political_events.83.a:0 "Гроші витрачені з користю."
 ARG_support_the_spanish_republicans_desc:0 "Наші брати в Іспанії потрапили в кривавий конфлікт, де вони воюють зі своїми співвітчизниками в спробі запобігти захопленню їхніх земель фашистським режимом. Падіння Іспанії до фашизму не відповідає нашим інтересам, і ми повинні докласти всіх зусиль, щоб висловити підтримку нашому найближчому культурному зв'язку в Європі."
 ARG_the_castillo_cabinet_tt:0 "§Y$ARG_ramon_castillo$§! стає лідером партії §Y$ARG_neutrality_party_long$§!"
 ARG_the_old_enemy:0 "Старий ворог"
