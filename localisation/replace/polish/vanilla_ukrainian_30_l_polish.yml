 blow_suez_canal_desc:0 "Ми не можемо дозволити нашим ворогам використовувати стратегічно місця Суецьким каналом. Тому ми повинні розпочати підготовку, щоби завдати достатньо цілеспрямованої шкоди каналу, щоб він залишався непрацюючим протягом тривалого часу. Це значно обмежить здатність противника переміщати кораблі з Азії та Східної Африки в Середземне море."
 border_conflict_reconciled:0 "Прикордонний конфлікт урегульований"
 britain.17.a:0 "Боже, бережи короля Георга VI."
 building_up_guam_goal_desc:0 "Нам потрібно забезпечити зв'язок з Філіппінами на випадок конфлікту з Японією. Крім того, мати ближчу точку базування для наших флотів, якщо ми коли-небудь воюватимемо з Японією, було б дуже вигідно. [638.GetName] ідеально підходить."
 building_up_guam_goal_name:0 "Розширити військово-морську базу на Гуамі"
 capital_ships_effort_desc:0 "Морями правитиме держава з найбільшою кількістю лінкорів. Лінкори та лінійні крейсери відображають старий і новий підходи до концепції панування на морі."
 cat_operational_integrity_research:0 "Доктрина оперативної цілісності"
 category_carrier_fighter:0 "Палубні винищувачі"
 china.102.d:0 "Оскільки Радянський Союз зайнятий війною з Німеччиною, нас сповістили, що СРСР не зможе надати таку ж підтримку, яку надавав у минулому. У кращих інтересах завоювати підтримку Гоміньдану та приєднатися до війни проти Японії."
 china.17.d:0 "Наші зусилля накреслити межу для стримання загрози комунізму були успішні. Партизанські кампанії КПК у відповідь на збільшену присутність наших військ у навколишніх областях недооцінили нашу відданість стриманню їх. Ця демонстрація сили, хоч і не без втрат, запевнила багато місцевих, котрі раніше впевнено підтримували [From.GetLeader] і його партію, що Китай ніколи не зможе бути об'єднаний під такою ідеологією."
 china.204.a:0 "Ми керуватимемо зі старої Північної Столиці."
 china.4.d:0 "Оскільки ми воюємо з Німеччиною, всі їхні військові радники, присутні в нашій країні, були затримані. Фон Фалькенгаузен і кілька його помічників змогли уникнути затримання й повернулися до Європи!"
 china.5.a:0 "Хай живе Народна республіка!"
