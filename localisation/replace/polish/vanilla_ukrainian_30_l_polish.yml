 HUN_bomber_competition_desc:0 "Щоб обрати найбільш підходящу модель бомбардувальника для виробництва за ліцензією, ми маємо порівняти параметри всіх претендентів. Ми організуємо змагання та попросимо провідні держави надіслати свої найдосконаліші зразки для участі."
