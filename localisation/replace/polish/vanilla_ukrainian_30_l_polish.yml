 AST_the_pacific_resistance_tt2:0 "§Y[USA.GetName]§! приєднується до альянсу §YТихоокеанський опір§!."
 AST_torres_strait_battalion_desc:0 "Зусилля роти Торресової протоки як гарнізону були добре організовані, але її люди мають потенціал для інших досягнень. З огляду на те, що її члени походять з островів біля північного узбережжя [AST.GetName], підрозділ має глибокі знання про Торресову протоку. Ми підготуємо цих людей як морську піхоту і закличемо додаткових добровольців для формування батальйону."
 AST_uap_decrease_votes_daily_impact:0 "\n Через зміни в §YУАП§!: §G+[?AST_uap_votes_daily_impact_var|2G]%§!"
