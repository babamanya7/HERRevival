 FRA_join_comintern:0 "Приєднатися до Комінтерну"
 FRA_light_cruiser_2:0 "Клас «La Galissonnière»"
 FRA_light_medium_armor_desc:0 "Безперечний факт: піхота контролює танкові війська. Легша і швидкісна бронетехніка краще підходить для переміщення військ і здатна завдавати шкоди встановленим на ній зброєю."
 FRA_light_tank_equipment_3:0 "AMX 12t"
 FRA_loyalty_to_the_cause_desc:0 "Інші країни можуть сформулювати своє бачення комунізму, але немає причин, чому ми повинні йти на компроміс із нашим. Можливо, вони зупинилися на півдорозі, охоплені сумнівами щодо того, чи мета виправдовує засоби. Ми не будемо."
 FRA_no_further_humiliations_desc:0 "Протягом багатьох років республіканські уряди дозволяли німцям боротися з міжнародними договорами, деякі з яких були нахабно порушені до того, як чорнило навіть висохли. Це зараз закінчується."
 FRA_reconnect_to_the_balkans:0 "Відновлення зв'язку з Балканами"
 FRA_reconnect_to_the_balkans_desc:0 "Франція довгий час намагалася збалансувати сили Центральної Європи, звертаючись до країн Балкан. Цей зв'язок все ще існує, навіть якщо нещодавно йому було дозволено припинити дію."
 FRA_repeal_the_law_of_exile:0 "Скасувати Закон про вигнання"
 FRA_revise_versailles:0 "Переоглянути Версаль"
 FRA_revise_versailles_desc:0 "Німці вже деякий час тому припинили виплату репарацій за Версальським договором, Франція більше не вселяє поваги. Ми маємо повне право вимогти плати за всі втрати, понесені в тій війні, однак Франція має стати сильною, щоби змусити Німеччину дотримуватись договору."
 FRA_scw_intervention_republicans:0 "Республіканська інтервенція"
 FRA_sp_naval_nuclear_missile_submarine:0 "Підводний човен класу «Triomphant»"
 FRA_spanish_intervention_category:0 "Інтервенція в громадянську війну в Іспанії"
 FRA_split_belgium:0 "Розділити Бельгію"
 FRA_stimulate_the_dynamic_market_desc:0 "Доведено, що динамічний ринок є найбільш ефективною формою організації економіки. Але нею досі керують люди, і люди іноді потребують певних запевнень, що їхня важка праця не буде марною. Законодавчо скасувавши деякі обмеження та надаючи гарантії, ми можемо допомогти інвесторам подолати їхні страхи та допомогти стимулювати нашу економіку."
 FRA_submarine_1_desc:0 "Серія 600-тонних підводних човнів була першими сучасними підводними човнами Франції після Першої світової війни. Вони були середнього розміру, водотоннажністю близько 600 тонн. Незважаючи на те, що вони були морськими, вони називалися прибережними підводними човнами і використовувалися переважно в теплих водах Середземного моря. Три класи по 4 кораблі кожен побудовані цього типу: класи Sirène, Ariane і Circé. Вони були основою більшої 630-тонної серії класів Argonaute, Diane та Orion."
 FRA_support_weapons:0 "FM Chauchat & Stokes mortar"
 FRA_tac_bomber_equipment_1:0 "Amiot 143"
 FRA_the_civil_and_military_organization:0 "Цивільна та військова організація"
 FRA_the_civil_and_military_organization_desc:0 "Численні невеликі групи, які здійснюють акти опору, об'єднуються, щоб утворити більшу організацію. Ми мусимо дати цьому наше благословення."
 FRA_the_congress_of_paris_desc:0 "На Берлінському конгресі були сформовані кордони Африки. Але мапа сьогодні скидається на клаптикову ковдру. Настав час перемалювати карту і таким чином сформувати основу для нової колоніальної імперії."
