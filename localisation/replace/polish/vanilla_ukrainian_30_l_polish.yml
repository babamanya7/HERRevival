 RAJ_carrier_3_desc:0 "$ENG_carrier_3_desc$"
 RAJ_central_comittee_authority_desc:0 "Дисципліна — це сила.\nЦентральний Комітет контролюватиме всі аспекти управління, гарантуючи, що революція не переросте в хаос."
 RAJ_communist_unions_promised_worker_safety_mission:0 "Виконати наші зобов’язання перед профспілками"
 RAJ_consult_with_congress_leaders_desc:0 "Замість того, щоб силою пробиватися до приєднання до [ENG.GetNameDef] у її війнах, ми повинні використовувати офіційні шляхи для цього. Давайте проконсультуємося з лідерами Конгресу та звернемося до них з надією, що вони дозволять [RAJ.GetNameDef] вступити у війну."
