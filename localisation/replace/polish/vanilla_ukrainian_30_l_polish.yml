 AUS_grossosterreich_fascism:0 "Велика Австрія"
 AUS_heritage_of_an_empire:0 "Спадщина Великої Імперії"
 AUS_hold_elections:0 "Провести вибори"
 AUS_infantry_equipment_0:0 "Steyr M95/30"
 AUS_intensify_training_efforts:0 "Зусилля інтенсивних тренувань"
 AUS_lawmaking_leniency:0 "Законотворча поблажливість"
 AUS_legitimistische_jugend_desc:0 "Ми побачили, що раннє ознайомлення дітей і підлітків з монархією та всіма її основними цінностями допоможе їм вирости лояльними та щасливими громадянами, які працюють і, якщо потрібно, борються за нашу націю. Є місце страху, що це слизьким шляхом до набагато гірших речей, однак ми впевнені, що ця освіта буде для них виключно корисною."
 AUS_makes_demands_title_56:0 "[FROM.GetNameDefCap] передає нам територію"
 AUS_medium_specialization_desc:0 "Наші повітряні сили повинні виконувати багато функцій, однак у нас немає ресурсів для розбудови всіх аспектів наших повітряних сил, тому пошук питання пошуку компромісу є першорядним. Двомоторні літаки можуть використовуватися як у виді бомбардувальників, так і у виді винищувачів, що для нас виглядає ідеальним компромісом."
 AUS_neustadter_flugzeugwerke_desc:0 "Нещодавно новий виробник літаків придбав виведену з експлуатації фабрику Österreichischen Fliegerschule. Нова компанія, Neustädter Flugzeugwerke, має намір будувати легкі спортивні літаки, однак оскільки компанію заснували два колишніх пілоти-винищувачі, ми цілком можемо переконати їх виробляти їх для нас."
 AUS_political_events.108.a:0 "Ми спостерігатимемо за ними!"
 AUS_political_events.12.a:0 "Це було неочікувано, але щиро дякуємо."
 AUS_political_events.125.desc:0 "Ми сподівалися, що [FROM.GetAdjective]ий уряд зможе знову побачити очевидну користь від об’єднання з нами, але, схоже що невдача, яку ми зазнали 20 років тому, затьмарила їх бачення. Наш лідер, [ROOT.GetLeader], відреагував на це витончено та рішуче, це лише незначна перешкода на нашому шляху."
 AUS_political_events.27.t:0 "[AUS.GetNameDefCap] прагне переозброєння"
 AUS_political_events.29.a_tt:0 "§RВибравши цей варіант, ми назавжди позбудемося Сен-Жерменського Договору, проте це може мати наслідки§!"
 AUS_political_events.29.b:0 "Ми повинні прийти до згоди!"
 AUS_political_events.31.b:0 "Передамо їм частину захопленого нами обладнання"
 AUS_political_events.55.b:0 "Ми не продаємо свої землі!"
 AUS_political_events.63.desc:0 "Аншлюс Австрії примусив багатьох австрійців, які виступали проти такого розвитку подій, бігти зі свого колишнього дому. Деякі з цих «дисидентів» прибули до нашої країни і пропонують свої послуги для праці на заводах, вулицях або навіть на передовій."
 AUS_political_events.66.b:0 "Це зовсім не піде нам на користь!"
 AUS_political_events.73.b_tt:0 "Ми §Rне підтримаємо§! запропонований варіант Австрії. §RМи залишимо їх голими перед загрозою.§!"
 AUS_political_events.77.desc:0 "Деякі з наших найдосвідченіших і кваліфікованих дипломатів уже давно відслідковують ризик того, що [GER.GetNameDef] діятиме відповідно до планів. Іноді підтверджених, а іноді заперечених німецьким лідером. Здається, останнім часом відбулися досить радикальні зміни, і наші джерела тепер вважають, що спроба анексувати нас цілком — може бути неминучою."
 AUS_political_events.95.desc:0 "Коли австро-прусська війна закінчилася 22-го липня 1866 року, наша відважна армія рушила назад додому, а після повернення виявилось, що в рядах стало на одного солдата більше, ніж відправлялось на війну. Чи це правда, чи просто вигадка, — суперечать досі. Однак ми можемо підтвердити, що це сталося знову, зараз, коли наша славна армія повертається, вона більша на одного бійця."
 AUS_purchase_foreign_designs_desc:0 "Щоб бути справді конкурентоспроможними в повітрі, ми повинні вивчати, як інші країни проєктують власні літаки. Незважаючи на те, що внутрішнє виробництво може мати свої переваги, з вибіркою та купівлею в багатьох країнах ми можемо отримати найкращі літаки для наших потреб без великих початкових витрат."
 AUS_reestablish_austrian_navy_desc:0 "Втрата нашої берегової лінії наприкінці Великої Війни означала, що ми більше не мали можливості будувати нові кораблі. Ми неохоче віддали решту нашого флоту Югославії, якій було достатньо двох тижнів, щоб самій передати нашу гордість морів. Тепер, коли ми знову маємо можливість розвивати військово-морський флот, ми повинні переконатися, що ця помилка ніколи не повториться."
 AUS_regulate_austrian_finance_sector_desc:0 "[AUS.GetAdjective]а економіка все ще відчуває труднощі, незважаючи на всі наші зусилля відновлення її балансу. Якщо нічого не вжити, ми боїмося, що незабаром може настати ще один повномасштабний економічний крах із супутньою гіперінфляцією. Настав час повернути контроль над нашим фінансовим сектором."
 AUS_repeal_the_adelsaufhebungsgesetz_desc:0 "Закон про ліквідацію дворянства (Adelsaufhebungsgesetz) набув чинності разом із законом Габсбургів (Habsburgergesetz) і фактично скасував існування австрійського дворянства. Знатні роди були позбавлені титулів, почесних привілеїв та влади одним махом руки. Цей закон, очевидно, неправильний. Відновивши наших дворян і їх сімейну гордість, ми зможемо переконатися в їхній лояльності в майбутньому."
 AUS_saurerwerke_initial_mio_trait_attack_focused_organization:0 "Виробник ударного автотранспорту"
 AUS_seek_support_from_guarantors:0 "Звернутися за підтримкою до Гарантів"
 AUS_spur_the_communist_resistance:0 "Заохочувати комуністичні настрої"
 AUS_standardized_army_training:0 "Стандартизована підготовка Армії"
 AUS_strengthen_the_arms_industry:0 "Збройовий завод Леопольда Гассера"
 AUS_strengthen_the_cabinet_desc:0 "Незважаючи на те, що демократичні настрої досить швидко поширилися серед народу, наш кабінет все ще залишається відносно слабким. Влада, звісно, має належати народу, що буде зроблено за рахунок розширення парламенту та кабінету міністрів. Тож, для ефективного управління, кабінет міністрів має мати пріоритет."
 AUS_take_back_galicia:0 "Повернути Галичину"
 AUS_treaty_no_permission_key:0 "Без будь-якого попередження, нам повідомили, що [AUS.GetNameDef] більше не дотримуватиметься Сен-Жерменського Договору та з усіма умовами, що з нього випливають. Це означає, що тепер вони вільно переозброюватимуться, незважаючи на обмеження, встановлені на них після Великої війни. Чому вони так раптово хочуть переозброїтися, залишається незрозумілим."
 AUS_true_liechtenstein_neutrality_ADJ:0 "Ліхтенштайнйськ"
 AUS_von_brumowski_recruited_flag:0 "Завербував Годвіна фон Брумовського"
 AUS_wien_anti_air_effort_desc:0 "Хоча ми повністю віримо в те, що наші військово-повітряні сили будуть убезпечувати цю країну від повітряних нападів, протиповітряні будівлі можуть забезпечити бажаний додатковий рівень захисту в густонаселених районах. Ми повинні розглянути можливість встановлення протиповітряних споруд у районі Відня."
 AUTOMATE_HOME_BASE_TOGGLE:0 "Перемикання цього параметра змусить флот самостійно вибирати базу приписки, яка найбільше годиться для регіонів, до яких вона призначена."
 AZR_DEF:0 "Азербайджан"
 AZR_democratic_DEF:0 "Азербайджанська демократична республіка"
 AZR_neutrality_party:0 "Єднання"
 Apr:0 "кві"
 BALTIC_attract_workers_to_capital_desc:0 "Робітники держави [Root.GetNonIdeologyName] розпорошені по всій сільській місцевості і часто працюють у застарілому сільськогосподарському секторі. Щоб індустріалізувати нашу націю і підготувати її до війни, треба залучати робітників на заводи міста [Root.Capital.GetName]."
 BALTIC_balticwall:0 "Балтійський вал"
 BALTIC_british_aircraft_desc_default:0 "Зусилля з місцевого проєктування літаків особливим успіхом не увінчалися. Поки що наші ВПС залежать від техніки, взятої як трофеї у німців і росіян, але щоб вижити, нам потрібно освоїти самостійне виробництво. Можливо, ключем до нашої перемоги стане британська авіація..."
 BALTIC_events.102.d:0 "[Root.GetLeader] у розчаруванні: [From.GetAdjective] МЗС вирішило не підтримувати військовий зв'язок із державою [Root.GetNameDef]."
 BALTIC_events.2.d_scandi:0 "[From.GetLeader] та [From.GetHerHis] кабінет звернулися до [Root.GetAdjective] уряду з пропозицією перетворити слабоорганізовану Балтійську Антанту на військовий союз. Укладання договору означатиме, що у разі війни на армії виступлять проти того, хто загрожує нашому суверенітету.\n\n[From.GetLeader] стверджує, що коли війська, що влаштувалися на кордонах, завоюють у Балтії те, що їм потрібно, наступною у них на черзі стане Скандинавія і за часів глобального конфлікту нам слід було б триматися разом."
 BALTIC_events.601.t:0 "[From.GetNameDefCap] відповідає відмовою!"
 BALTIC_squash_resistance_desc:0 "Досі залишилися ті, хто вважає соціалізм ворогом [Root.GetAdjective] суверенітету. Якщо ми хочемо успіху нашої революції, цих людей треба усунути."
 BALTIC_technology_sharing:0 "Обмін технологіями"
 BAL_UNIFIED_ADJ:0 "Балтійськ"
 BAN_democratic_DEF:0 "Бангладеш"
 BAY_STATE_4:0 "Нідерьостеррайх"
 BBA_african_union_events.21.t:0 "[THIS.GetAdjective] економічне зростання"
 BBA_ethiopia_anti_colonialism_events.4.desc:0 "Despite our pressure, the [?global.african_colonial_country.GetAdjective] government refuses to recognize [?global.african_revolt_country.GetNameDef] and cease hostilities. The [?global.african_colonial_country.GetAdjective] seem set on destroying the independence movement. This is probably as far as we can get with diplomacy alone."
 BBA_ethiopia_balance_of_power_events.01.a:0 "Ми їх переможемо."
 BBA_ethiopia_balance_of_power_events.01.b:0 "Знищити самозванця."
 BBA_ethiopia_balance_of_power_events.10.t:0 "[ROOT.GetName] розвалюється"
 BBA_ethiopia_balance_of_power_events.55.b:0 "Центральна влада не мусить втручатися у місцеві справи."
 BBA_ethiopia_communist_events.15.desc:0 "Генерали з [SOV.GetNameDef] прибули до [ROOT.Capital.GetCapitalVictoryPointName]. Радникам вже представлено огляд структури наших збройних сил і стану війни з [ITA.GetName]. Сподіваємось, вони допоможуть модернізувати армію."
 BBA_ethiopia_communist_events.46.a:0 "Ми не віддамо наші землі."
 BBA_ethiopia_communist_events.50.desc:0 "[ETH.GetAdjective] дипломати звернулися до нас із пропозицією миру. Умова пропозиції — відмова від претензій на [SOM.GetAdjective] територію, яку ми втратили на користь [ETH.GetNameDef] під час цього конфлікту. Дипломати також заявляють, що в регіоні буде створено [SOM.GetAdjective]ий уряд. Наскільки незалежним буде цей уряд — ще належить побачити."
 BBA_ethiopia_communist_events.51.a:0 "Ми не віддамо наші землі."
 BBA_ethiopia_exile_events.17.d:0 "Кораблів ми не можемо дати, але принаймні можемо передати їм деякі ноу-гау"
 BBA_ethiopia_exile_events.23.a:0 "[?ETH.japanese_island.GetName] — наш."
 BBA_ethiopia_exile_events.32.a:0 "Звучить як гарна ідея"
 BBA_ethiopia_exile_events.44.t:0 "[FROM.GetLeader] обурені нашим запитом"
 BBA_ethiopia_fascist_events.53.a:0 "Кожному солдатові потрібна гвинтівка."
 BBA_ethiopia_fascist_events.54.t:0 "[FROM.GetName] просить військове оснащення"
 BBA_ethiopia_fascist_events.57.a:0 "Посилення [FROM.GetName] вивільнить наші сили в регіоні."
 BBA_ethiopia_imperial_events.5.desc:0 "[FROM.GetNameDefCap] прийняля наш скромний запит на передачу контролю над областю [689.GetName]. Це знаменує початок нової ери. Хай живе $ETH_haile_selassie$. Сподіваємося, це означає, що ми зможемо залучити послідовників із усієї Америки."
 BBA_italo_ethiopian_war_events.01.desc:0 "Наші війська зайшли в глухий кут у війні проти Абіссінії, а в деяких місцях навіть були відкинуті. Цей «Різдвяний наступ» змушує Муссоліні секретно докоряти вищому військовому командуванню за його некомпетентність. Дуче хоче результатів. Зараз.\n\nТому він дозволив будь-які засоби, необхідні для відсічі абіссінців і швидкого припинення цієї війни. Чого б це не потребувало."
 BBA_italo_ethiopian_war_events.02.desc:0 "Італійці намагаються повернути собі ініціативу у війні. Вони розпочинають великий наступ, намагаючись зруйнувати наші лінії та розтрощити [ROOT.GetAdjective]у Імперію одним ударом.\nНаші сили мають вистояти. Життєво важливо, щоби наші сили протримались достатньо довго проти інтенсивних бомбардувань і нападів танків і артилерії, щоби ми мали час переконати міжнародну спільноту діяти від нашого імені."
 BBA_italo_ethiopian_war_events.113.desc:0 "Ліга націй вимагає від держави [FROM.GetNameDef] негайно припинити агресію проти держави [ETH.GetName]. Однак, [FROM.GetLeader] залишається зухвалим і відмовляється підкорюватися. Це кричуще порушення міжнародних правил, і Рада закликала до міжнародних дій проти держави [FROM.GetNameDef]."
 BBA_italo_ethiopian_war_events.202.a:0 "Ситуація змінюється."
 BBA_italo_ethiopian_war_events.204.desc:0 "Скрізь люди повстають проти загарбників, як молоді, так і старі приєднуються до руху опору, змушуючи [ITA.GetName] воювати наполегливіше, щоби досягти бодай чогось. Місцеві жителі, які не можуть воювати, виготовляють зброю та техніку для армії."
 BBA_italo_ethiopian_war_events.500.desc:0 "[GetItaloEthiopianPeaceDemands]"
 BBA_italo_ethiopian_war_events.503.a:0 "Ми їх підкоримо."
 BBA_italy_air_accident.12.desc:0 "Під час польоту до французького кордону у літака командувача ВПС Альдо Пеллегріні та генерала П'єтро Пінтора виникли проблеми з двигуном, і він почав стрімко втрачати висоту. Зіткнувшись з неминучою загибеллю, Пеллегріні взяв керування на себе і зумів здійснити аварійну посадку завдяки своєму знайомству з літаками Savoia-Marchetti. Всі, хто перебував на борту, вижили, хоча й отримали синці. "
 BBA_italy_anti_colonialism_events.10.t:0 "[FROM.GetAdjective]і робітники радіють!"
 BBA_italy_anti_colonialism_events.12.a:0 "Час покаже їм, як вони помиляються."
 BBA_italy_anti_colonialism_events.12.desc:0 "[FROM.GetAdjective]ий лідер, [FROM.GetLeader] рішуче виступив проти нашої пропозиції про захист та співпрацю і недобрими словами наказав нашій делегації якнайшвидше повертатися додому."
 BBA_italy_civil_war.1.d:0 "Нехай панує свобода!"
 BBA_italy_civil_war.1.t:0 "Громадянська війна в Італії"
 BBA_italy_communist_events.02.t:0 "[FROM.GetName] просить про допомогу"
 BBA_italy_communist_events.03.t:0 "Міжнародна підтримка для [ROOT.GetNameDef]"
 BBA_italy_decide_the_fate_of_mussolini.1.t:0 "Доля Муссоліні"
 BBA_italy_democratic_events.05.desc:0 "Чума, яка є мафією, поширюється! Нещодавній хаос у державі [FROM.GetName] став живильним середовищем для злочинців і їм подібних, і, за відсутності сильної місцевої влади, цих небажаних осіб стає дедалі більше. Вони скористалися вакуумом влади, що залишився після Громадянської війни, і знову утверджують свою владу по всій країні [FROM.GetName]."
 BBA_italy_interaction_events.17.desc:0 "Наш володар [ITA.GetName] сьогодні вирішив передати угорцям територію [45.GetName], яку ми контролюємо. Це має зміцнити відносини між італійською та угорською державами, і ми не можемо нічого з цим вдіяти. Однак ми подамо невеликий дипломатичний протест, навіть якщо вище керівництво його навіть не прочитає."
 BBA_italy_interaction_events.23.a:0 "Нам буде краще без них."
 BBA_italy_interaction_events.31.desc_peace_signed:0 "[ITA.GetNameDefCap] і [ETH.GetNameDefCap] відклали свої розбіжності та підписали мирний договір, не в останню чергу завдяки нашій вмілій дипломатії. Італійський уряд нагадав нам про укладену нами угоду, згідно з якою вони отримають [269.GetName] та [903.GetName] в обмін на ратифікацію Фронту Стрези."
 BBA_italy_interaction_events.5.a:0 "Bellissimo!"
 BBA_italy_interaction_events.71.b:0 "У нас все ще є наша гордість!"
 BBA_italy_local_rulers.1.a:0 "Надання деяких поступок могло б задовольнити місцевих жителів."
 BBA_italy_missiolinis.111.desc:0 "Хоча ми й вийшли переможцями з Великої війни, а за Лондонським пактом нам було обіцяно Далмацію, наші так звані союзники нас зрадили. Ми ніколи не отримане обіцяне нам, тож тепер ми маємо взяти це силою, наполягає дуче. Він також зазначив, що взяття того, що належить нам по праву, полягає в долі Італії — хай що старі великі держави скажуть."
 BBA_italy_missiolinis.42.a:0 "Італія буде захищена... якимось чином."
 BBA_italy_naval_cooperation_programs.05.a:0 "Неймовірно!"
 BBA_swiss_expansion.1.a:0 "Ми не зрадимо свою місію"
 BBA_swiss_expansion.11.a:0 "У нас залишився лише один шлях."
 BBA_swiss_expansion.19.desc:0 "Нашу декларацію незалежності колишній сюзерен [FROM.GetNameDef] сприйняв вороже. Вони оголосили нам війну з наміром захопити нашу країну силою. Візьмемося за зброю та покажемо, що [ROOT.GetName] не так легко підкорити."
 BBA_swiss_expansion.5.a:0 "Наша присяга того вимагає!"
 BBA_switzerland_trade.10.desc:0 "Попри очевидну взаємну вигоду, [FROM.GetName] не зацікавлений у розширенні торгівлі золотом із рештою світу."
 BBA_switzerland_trade.11.a:0 "Вони довели, що заслуговують на довіру"
 BEL_allied_donations_desc:0 "Обставини, які змушують нас посилювати нашу морську присутність, стали ще більш актуальними, тому ми повинні звернутися до наших союзників і дізнатися, чи можуть вони допомогти нам у відновленні морських можливостей."
 BEL_boost_factory_workers_unions_decision:0 "Стимулювати профспілки фабричних робітників"
 BEL_boost_unions_tt:0 "§RЛише одна профспілка може бути посилена. Вибір цього варіанту заблокує два інших!§!"
 BEL_charles_count_of_flanders_desc:0 "Очевидно, що Леопольд не може бути довіреним для відновлення трону, адже він зрікся своєї відповідальності, як тільки здав націю. На щастя, у нього є молодший брат, принц Шарль, граф Фландрії, який буде відмінним регентом, поки ми не вирішимо, що робити з «королем»."
 BEL_communism_party:0 "КПБ"
 BEL_corruption_ns_fake_tt:0 "Щоденний приріст політичної влади: §R-0.25%§!\nСтабільність: §R-20%§!\nШвидкість будівництва: §R-20%§!\nЩоденна підтримка фашизму: §G+0.10%§!"
 BEL_dismantle_BEL_SPR_alliance_decision:0 "Розпустити союз [ROOT.GetFactionName]"
 BEL_eben_emael_fortress_available_tt:0 "Можна побудувати щонайменше 2 §Y$bunker$и§! в §YЛьєж§!"
 BEL_engine_of_the_economy_desc:0 "Потяги займають особливе місце в [ROOT.GetAdjective] серці, вони стимулюють нові інновації, підтримують виробництво на шляху і є паливом для подальшого зростання. А головне, вони є двигуном економіки."
 BEL_expression_of_belgian_unity:0 "Вираження бельгійської єдності"
 BEL_flanders_ascendant_desc:0 "Тепер, коли гордість за фламандські традиції та історію зростає, час скористатися цим новим націоналістичним підйомом і привести нашу націю до її долі — возз'єднання з Нідерландами."
 BEL_flanders_communism_DEF:0 "Соціалістична народна республіка Фландрія"
 BEL_flanders_fascism:0 "Велика фламандська держава"
 BEL_flooded_tank_barriers_desc:0 "Ми віримо, що танки відіграватимуть важливу роль у майбутніх війнах, і наші оборони повинні це враховувати. Ми можемо підготувати Бельгійські ворота і занурити їх у воду, щоб подвоїти їхню ефективність."
 BEL_invest_congo_gold_into_infrastructure_decision:0 "Інвестувати золото [COG.GetNameDef] в інфраструктуру"
 BEL_la_belgique_et_le_congo:0 "Бельгія та Конго"
 BEL_leopolds_return:0 "Повернення Леопольда"
 BEL_liberal_victory_desc:0 "Економічно ліберальна Католицька партія здобула перемогу на останніх виборах, і Юбер Пірло очолить [BEL.GetName], обіцяючи захищати його та бельгійський народ до останнього."
 BEL_light_tank_artillery_equipment_1_short:0 "SA 76mm"
 BEL_mio_trait_flourishing_automobile_industry:0 "Flourishing Automobile Industry"
 BEL_mio_trait_high_grade_armor:0 "High Grade Armor"
 BEL_monetary_reconstruction_desc:0 "Після Першої світової війни економіка Бельгії була зруйнована. Для того щоб полегшити реконструкцію та погасити величезні борги, бельгійське фінансове міністерство почало друкувати гроші. Багато грошей. Хоча це допомогло на той час, зараз ми ризикуємо потрапити в гіперінфляцію, і нам необхідно контролювати це, перш ніж впроваджувати будь-які інші реформи."
 BEL_problem_of_language_desc:0 "Бельгія надто довго була розділена мовою, і якщо Лейбористська партія хоче об'єднати націю за своє правління, очевидним кроком стане чітка позиція щодо пріоритету мови — або навіть лідерство в зусиллях до офіційного двомовства, як це практикується в Брюсселі."
 BEL_rebuild_wallonian_industry_desc:0 "Валлонія була найбільш постраждалою під час німецької окупації в Першій світовій війні, коли значна частина її промисловості та ресурсів була пограбована окупантами. Реконструкція йде швидкими темпами, але їй завжди потрібно більше інвестицій, щоб досягти свого справжнього потенціалу як індустріального серця [ROOT.GetAdjective]."
