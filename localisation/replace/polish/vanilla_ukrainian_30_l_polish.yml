 sp_armored_lc_weapon_fire_control_tech_desc:0 "Впровадження передової прицільної оптики, далекомірів та гіроскопічних стабілізаторів для підвищення точності зброї та координації вогню, що забезпечує ефективне ураження цілей незважаючи на значну віддачу та повільну маневреність."
 sp_commercial_nuclear_reactor_desc:0 "Ядерні реактори добре підходять для виробництва матеріалів для бомб. Але кількість виробленої енергії могла би натомість забезпечувати цивільну та військову промисловість електроенергією."
