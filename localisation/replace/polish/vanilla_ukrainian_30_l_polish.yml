 LIT_adopt_the_dobuzhinsky_flag_design_decision_desc:0 "Кольори нашого прапора мусять відповідати кольорам герба. На гербі немає зеленого кольору, а отже, його не повинно бути і на прапорі. Таким чином, ми мусимо прийняти пропозицію, яку нам передали Мстислав Добужинський і Відунас."
 LIT_belarus_DEF:0 "Литва-Білорусь"
 LIT_events.5.b:0 "Ми не здамося!"
 LIT_events.601.d:0 "Поляки, як і очікувалося, погодилися вступити до Ліги польсько-литовської переваги. Нехай Литва і не зовсім уявляла собі долю Польщі, це знаменує важливий перший крок у забезпеченні майбутнього країн Балтії."
 LIT_events.7.d:0 "Активно шукаючи [From.GetAdjective]о-[POL.GetAdjective]е співробітництво, [From.GetAdjective]ий міністр закордонних справ сьогодні звернувся до [Root.GetAdjective] представників із проханням запросити державу [POL.GetNameDef] до альянсу [Root.GetFactionName]."
