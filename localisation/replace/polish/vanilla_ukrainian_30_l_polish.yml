 GER_accept_british_naval_dominance:0 "Прийняття британського морського панування"
 GER_aerodynamic_research_institute_desc:0 "Нещодавно держава [ROOT.GetNameDef] стала синонімом повітряних інновацій, оскільки ми вклали значні кошти в наші ВПС. Ми мусимо продовжувати вкладати ресурси в цю сферу, щоби залишатися попереду конкурентів. Фінансування Аеродинамічного НДІ та розробка ним нових методів руху, безсумнівно, призведе до нових інновацій у нашому прагненні стати господарями неба."
 GER_african_allies:0 "Африканські союзники"
 GER_alliance_with_the_ussr_desc:0 "$GER_soviet_ally_desc$"
 GER_ally_chiang_kai_shek:0 "Укласти союз із Чаном Кайші"
 GER_amerikabomber_focke_wulf_flag:0 "§Y$GER_focke_wulf_organization$§! призначено для розробки §YАмерікабомбера§!"
 GER_anti_comitern_pact_desc:0 "Втручання у внутрішні справи інших держав, яке дозволяє собі Комуністичний інтернаціонал, ставить під загрозу не лише їхнє соціальне благополуччя, а й мир у всьому світі! Ми запропонуємо всім країнам, які виступають проти комуністів, підписати пакт, покликаний стримувати червону загрозу."
 GER_anti_tank_equipment_1_short:0 "3,7 cm PaK 36"
 GER_anti_tank_equipment_3:0 "12,8 cm PaK 44"
 GER_asian_spheres_of_influence_tt:0 "Ми та §Y[CHI.GetNameWithFlag]§! встановимо Сфери Впливу в §YАзії§!, змінюючи вартість захоплення територій у межах або поза цими сферами.\n\nНаша §YСфера Впливу§! включатиме:\n§Y[MAL.GetNameWithFlag]§!\n§Y[INS.GetNameWithFlag]§!\n§Y[PHI.GetNameWithFlag]§!\n§Y[AST.GetNameWithFlag]§!\n§Y[NZL.GetNameWithFlag]§!\nУсі §YПівденно-Тихоокеанські Острови§!\n\nЇхня §YСфера Впливу§! включатиме:\n§Y[SIA.GetNameWithFlag]\n[VIN.GetNameWithFlag]\n[CAM.GetNameWithFlag]\n[LAO.GetNameWithFlag]\n[CHI.GetNameWithFlag]\n[RAJ.GetNameWithFlag]\n[TIB.GetNameWithFlag]\n[NEP.GetNameWithFlag]\n[BHU.GetNameWithFlag]\n[KOR.GetNameWithFlag]\n[JAP.GetNameWithFlag]\n[MON.GetNameWithFlag]§!"
 GER_autonomy_puppet_DEF:0 "$OVERLORDADJ$а Німеччина"
 GER_build_the_eastern_bulwark_desc:0 "Оборонні споруди в країнах на сході недостатньо сильні, щоб ефективно протистояти [SOV.GetAdjective] загрозі. Ми повинні інвестувати у фортифікацію на їхній території, аби зробити будь-який напад надзвичайно коштовним для ворога."
 GER_carrier_2_desc:0 "«Seydlitz» був закладений як четвертий корабель важких крейсерів класу «Admiral Hipper». Частково добудований до початку війни, він розглядався для перетворення на авіаносець. Проєкт під кодовою назвою «Weser 1» частково перебував на стадії завершення, коли роботи були зупинені через посилення повітряних атак на Бремен і брак ресурсів для його будівництва."
 GER_carrier_4_desc:0 "У 1940-х роках Крігсмаріне розглядав можливість переобладнання кількох цивільних кораблів на авіаносці. Найбільшим з цих кораблів був пасажирський лайнер Europa. Будучи найбільшим пасажирським кораблем у Німеччині, він використовувався як корабель-казарма та транспорт для перевезення військ до того, як почалися роботи з його переобладнання на авіаносець. Після завершення робіт він мав би водотоннажність 56 000 тонн і міг би перевозити авіагрупу з 42 літаків."
 GER_carrier_variants_tt:0 "Буде створено §Yваріант§! авіаносця та §Yвиробничу лінію§!, в залежності від технологій §Y$early_ship_hull_carrier$§!, §Y$basic_ship_hull_carrier$§! або §Y$ship_hull_carrier_2$§!. Нинішній ефект:\n"
 GER_construct_ostwall_tt:0 "Побудувати оборонну лінію в областях від Балтійського до Азовського морів вздовж річки Дніпро в кожній області, повністю контрольованій державою §Y[ROOT.GetNameDef]§!, [GER.GetAdjective]ою маріонеткою або членом альянсу. Додасть §G1§! §Y$bunker$§!. Поточний ефект:\n"
 GER_construct_the_kammhuber_line_desc:0 "Ми не можемо дозволити ворожим бомбардувальникам і винищувачам вільно блукати в небі над державою [ROOT.GetNameDef]. Ми мусимо побудувати оборонну лінію вздовж узбережжя Франції, щоби мати змогу перехоплювати їх іще до того, як вони досягнуть наших внутрішніх земель."
 GER_construct_westwall_tt:0 "Побудувати оборонну лінію в областях: §Y[51.GetName]§!, §Y[42.GetName]§! та §Y[978.GetName]§! вздовж західного кордону. Додає §G2§! рівні §Yназемних укріплень§!.\n"
 GER_controls_an_atantic_island_tt:0 "§Y[ROOT.GetName]§! або підлеглий Німеччини повністю контролює острів у північному Атлантичному океані"
 GER_demand_the_return_of_southern_jutland:0 "Вимогти повернення Південної Ютландії"
 GER_division_belgium_armored_tt:0 "Ветеранська §Yтанкова§! частина §YSS-Panzerdivision Flandern§! and the veteran §Yarmored SS-Panzerdivision Wallonien§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_division_sweden_armored_tt:0 "§YТанкова§! частина SS-Panzer-Division Sveaborg§! з'явиться без оснащення, але з повними запасами людських ресурсів."
 GER_dp_light_battery_4:0 "12.7cm/45 SK C/41 DP"
 GER_dutch_friend:0 "Подружитися з Нідерландами"
 GER_embrace_liberal_leanings_desc:0 "Консерватизм виявився застарілим ще тоді, коли наш кайзер не зміг зробити того, що під силу було нашим політикам. Ми завжди повинні дивитися вперед і прагнути кращого завтра!"
 GER_establish_eastern_grand_duchies_desc:0 "Ми не зможемо напряму утримувати всі території, що охоплені договором. Але ми маємо плани щодо утворення Великих Герцогств і Сателітних Королівств на сході, які утримуватимуть ці землі для нас."
 GER_establish_the_skijager_desc:0 "Щоби запевнитися, що наші збройні сили зберігають свою ефективність і адаптивність за будь-яких погодних умов, ми мусимо оволодіти мистецтвом ведення війни взимку. З цією метою ми тренуватимемо і оснащуватимемо спеціалізовані гірські війська, відомі як Skijäger, для ефективних дій в засніженій і гірській місцевості."
 GER_expand_pacific_holdings_desc:0 "Спробувавши імперіалізму на смак у Тихому океані, наші політики виступають за розширення присутності в регіоні з метою встановлення [ROOT.GetAdjective] гегемонії на Далекому Сході. Ми повинні підтримати цю ініціативу й перейти в наступ."
 GER_expand_ss_recruitment_desc:0 "Вимоги для вступу до SS — високі, а сам процес описується як проходження крізь вушко голки. Хоча вимоги мусять залишатися високими, щоби забезпечити високу якість сил, вербування можна розширити іншими способами, які не призведуть до зниження наших стандартів."
 GER_expand_the_proletarian_uprisings_decision:0 "Поширити пролетарське повстання в регіоні [FROM.GetName]"
 GER_fortify_the_vaterland_cat_desc:0 "$GER_fortify_the_vaterland_desc$"
 GER_gw_armored_car_equipment_short:0 "Sdkfz 222"
 GER_heavy_cruiser_4_desc:0 "Клас «P» був великим важким крейсером, який офіційно отримав назву Panzerschiff (броненосний корабель) від Крігсмаріне. Водотоннажністю майже 24 000 тонн, він був на 3000 тонн легшим, але на 55 метрів довшим, ніж американські лінкори класу «New York». Озброєння складалося з шести 280-мм гармат у двох потрійних баштах."
 GER_infantry_equipment_0_short:0 "Gewehr 98"
 GER_inner_circle.01.d:0 "[GetAscendingAdvisorName] не заслуговує довіри фюрера"
 GER_jet_strat_bomber_equipment_1_desc:0 "Експериментальна схема «летюче крило» — майбутнє малопомітних бомбардувальників. Цей міжконтинентальний бомбардувальник здатний завдати удару по найдальших ворогів, перш ніж вони встигнуть відреагувати."
 GER_jet_strat_bomber_equipment_1_short:0 "H.XVIII"
 GER_lower_taxes_desc:0 "Податковий тягар на наш народ поступово стає все важчим і важчим, щоб оплачувати програму переозброєння. Зменшивши цей тягар, ми можемо втратити державні доходи в короткостроковій перспективі, але люди зможуть витрачати більше важко зароблених грошей у майбутньому."
 GER_medium_tank_artillery_equipment_1_desc:0 "Sd.Kfz. 138/1 Grille (з нім. — «цвіркун») — самохідна артилерійська установка, яка використовувалася Німеччиною під час Другої світової війни. Було випущено близько 490-500 одиниць. Вони використовувалися піхотними ротами Panzergrenadier-полків для надання важкої мобільної вогневої підтримки."
 GER_medium_tank_destroyer_equipment_2_short:0 "JagdPz IV"
 GER_medium_tank_destroyer_equipment_3_short:0 "Jagdpanther"
 GER_mefo_bills_warning_tt:0 "§Y[GetMilitaryProductionModifierName]§! досяг рівня $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y[?ROOT.GER_industrial_consumer_goods_factor|1%]§!"
 GER_mio_trait_3_7_cm_pak:0 "3.7cm Panzerabwehrkanone"
 GER_mittelafrika_revive_the_schutztruppe_tt:0 "Відімкне колоніальні ополчення §YSchutztruppe§! та сукупність рішень із їх §Yвербування§! та §Yполіпшення§! в §YАфриці§!."
 GER_modern_tank_destroyer_equipment_1:0 "E-25 Standardpanzer"
 GER_modern_tank_equipment_1_short:0 "E-50"
 GER_nationalist_spain_ally_desc:0 "Перемога націоналістів у громадянській війні в Іспанії створила можливість більш тісного союзу між нашими країнами. Франко тримає ключі від Середземного моря."
 GER_naval_bases_on_atlantic_islands_tt:0 "Кожен острів, який контролює §Y[ROOT.GetName]§! або підлеглий Німеччини та має §Yморську базу§!, в §Yпівнічному Атлантичному океані§!: Додасть §G1§! §Yморську базу§!. Додасть §G1§! §Yприбережне укріплення§!. Нинішній ефект:"
 GER_negotiate_old_colonies_in_the_east_desc:0 "Багато наших колоніальних володінь у Східній Азії були відібрані у нас [JAP.GetAdjective]ими силами під час Великої війни. Оскільки ми зараз активно працюємо над поліпшенням наших дипломатичних відносин, можливо, ми зможемо повернути деякі з цих колоній дипломатичним шляхом."
 GER_nfl_rus_effect_tt:0 "Кожна область у зоні інтересів Ньюфаундленду перейде під контроль [RUS.GetNameDef]"
 GER_not_controls_dnieper_rive_tt:0 "§Y[ROOT.GetName]§! або наш союзник §Rне контролює повністю§ всі регіони вздовж §YРічки Дніпро§! від регіону §Y[813.GetName]§! по регіон §Y[200.GetName]§!."
 GER_operation_panzerfaust_events.01.t:0 "Питання лояльності Горті"
 GER_operational_planning:0 "Кампанія проти держави [FROM.GetName]"
 GER_reichskommissariat_norwegen:0 "Райхскомісаріат Норвегія"
 GER_resource_trade_desc:0 "Попри наші зусилля забезпечити себе всім необхідним, ми повинні бути відкритими до торгівлі з країнами, які поділяють наші ідеали. Запропонувавши [SOV.GetNameDef] компенсацію у вигляді промислових потужностей, ми зможемо укласти вигідну угоду."
 GER_ressurect_the_red_front_fighters_league_tt:0 "§Y2 підрозділи міліції§! буде створено у §Yтрьох випадкових штатах§!, що мають §Y$GER_proletariat_uprising_modifier$§! або під контролем §Yкомуністів [ROOT.GetAdjective]§!."
 GER_rhineland_ultimatum:0 "§RРемілітаризація може бути скасована, якщо Вас змусять зупинитись і Ви це зробите.§!\n"
 GER_rocket_interceptor_equipment_1_short:0 "Me 163 'Komet'"
 GER_safeguard_the_baltic:0 "Безпека Балтії"
 GER_scandinavian_membership_desc:0 "Гори та морози — слабкий захист від загрози, яку несе [GER.GetGreatRedMenaceName]а загроза. Скандинавські держави це добре розуміють. Ми запропонуємо їм членство в союзі та можливість разом протистояти отруті, яку розповсюджує навколо себе [GER.GetDanubianMembershipDesc]."
 GER_second_vienna_award_ROM_north:0 "Другий Віденський арбітраж"
 GER_secure_spain_desc:0 "Держава [SPR.GetNameDef] виявилася найбільш нестабільною країною. Оскільки вони борються зі своєю адміністрацією, можливо, нам слід простягнути їм руку допомоги? На цьому етапі, безсумнівно, бути нашим маріонетковим режимом має бути краще, ніж хаос, до якого вони звикли?"
 GER_see_to_the_eastern_front_tt2:0 "Додати 8 §Yназемних укріплень§! у 4 провінціях на східному кордоні.\n"
 GER_soviet_ally_desc:0 "Можливо, незважаючи на всі [GER.GetUSSRAllianceDesc] розбіжності з [GER.GetRussiansDemonym], нам вдасться зосередитися на тому, що нас об'єднує, — на ненависті до егоїстичного лібералізму і Заходу, що розкладається. Ставши союзником [GER.GetTheUSSRName], ми отримаємо доступ до всіх необхідних ресурсів і, зрозуміло, до його військової сили..."
 GER_soviet_military_exercises:0 "Військові навчання"
 GER_sp_air_intercontinental_bomber:0 "Amerikabomber"
 GER_sp_rockets_flying_bomb:0 "Проєкт «V1»"
 GER_spark_the_flame_of_revolution_red_europe_tt:0 "Відкриває рішення для §YПоширення комуністичних настроїв§! у §Yменших європейських країнах§!. Коли комуністи отримають більшість — спалахне §Yгромадянська війна§! для встановлення §Yкомуністичної влади§!"
 GER_state_development:0 "Розвивати [FROM.GetName]"
 GER_strasserite_state_fascism_DEF:0 "Німецький фольксрайх"
 GER_strat_bomber_equipment_3_short:0 "Ta 400"
 GER_strike_at_the_rising_sun:0 "Завдати удару по Висхідному Сонцю"
 GER_super_heavy_tank_destroyer_equipment_1_desc:0 "Шасі Maus із 150-мм гарматою у фіксованій надбудові."
