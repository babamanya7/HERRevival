 AAT_Sweden.18.t:0 "[NOR.GetName] просить повернути Нарвік"
 AAT_Sweden.28.a:0 "У жодному разі."
 AAT_Sweden.3.bagge_is_not_leader:0 "Помірковані. У ці важкі часи нам потрібне нове керівництво."
 AAT_Sweden.37.t:0 "Доля держави [DEN.GetName]"
