 SWE_landverk_l_62_desc:0 "Грунтуючись на успішних конструкціях танків Landverk і зенітних гармат Bofors, ми можемо створити мобільну протиповітряну платформу світового класу, яка може впоратися навіть із найшвидшими маневрами."
 SWE_medium_tank_destroyer_equipment_3:0 "Pvkv III"
 SWE_medium_tank_equipment_2:0 "Stridsvagn m/41"
 SWE_neither_death_nor_dishonor_desc:0 "Скандинавці стоять у прірві. Німецькі вовки виють на Заході. На Сході більшовики чекають часу, готові вдарити своїми червоними кинджалами глибоко в наші серця. Наше перо має стати мечем, наша хитрість — стань нашою бронею.\nМи не будемо вибирати між двома золами, не буде ні смерті, ні безчестя."
 SWE_neither_death_nor_dishonor_tt:0 "$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+4%§!\n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: §G+4%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+4%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+4 %§! для кожної північної країни в тій же фракції, що й §Y[SWE.GetName]§! або для кожного §Y$autonomy_aat_defense_council_member$§!"
 SWE_neutrality_party_long:0 "Фермерська ліга"
 SWE_operation_save_norway_desc:0 "[NOR.GetName] і [SWE.GetName] мають переплетену історію, що сягає в глибину століть. Бачити, як її народ потрапив у пастку чужої держави, неприйнятно, і ми повинні будувати плани їх звільнення, коли з'явиться нагода."
 SWE_proclaim_big_power_sweden_tt:0 "Кожна осердна область на початку гри:\n Повністю контролюється державою §Y[?ROOT.GetName]§!"
 SWE_rationing_tt:0 "Відмикає рішення щодо впровадження політики нормування за невеликі суми §Yпідтримки війни§!, §Yстабільності§! або §Yспоживчих товарів§!. Можливі політики для впровадження включають:\n"
 SWE_refuge_for_revolutionaries_desc:0 "Хоча соціалізм неминучий, все ще є революціонери, які опиняються на стороні програшу в конфлікті або в пастці держави, яка зрадила пролетаріат. Ми дамо зрозуміти, що всі такі революціонери можуть знайти мету та безпеку в [SWE.GetName]."
 SWE_restoring_order:0 "Відновлення порядку"
 SWE_saab_organization:0 "SAAB"
 SWE_secret_mobilization:0 "Таємна мобілізація"
 SWE_strike_the_capitalist_beast_down_desc:0 "Робітничий клас Швеції надто довго страждав під ярмом буржуазії. Хоча соціал-демократи вірять, що вони можуть пом'якшити суворість капіталізму, лише соціалісти пропонують виборцям правду, капіталізм не можна виправити. Капіталізм має бути скасовано."
 SWE_submarine_3_desc:0 "The Swedish U-class submarines were a class of nine subs commissioned between 1942 and 1944. They were fairly small and relatively slow, displacing only 370 tons. They were armed with four 533mm torpedo tubes."
 SWE_support_norwegian_communists_desc:0 "Ми ніколи не будемо в повній безпеці, доки [NOR.GetName] не звільниться від буржуазного правління. Однак вони ніколи не приймуть соціалістичний уряд, нав'язаний їм нами. Тому нам потрібно підтримувати [NOR.GetAdjective]их комуністів у їхня боротьба за повалення встановленого порядку."
 SWE_tac_bomber_equipment_0_short:0 "CVM S/J-3"
 SWI_add_forts_bordering:0 "[ROOT.GetNameDef] отримає §H2 наземні укріплення§! в кожній сусідній провінції.\n\n"
 SWI_air_research:0 "Дослідження літаків"
 SWI_aktion_nationaler_widerstand_desc:0 "У кожній частині [ROOT.GetAdjective] суспільства є невелика група цивільних осіб, які готові таємно співпрацювати, щоб впливати на населення. Їхні цілі — боротися з пораженством, надихнути на єдність і закласти основу опору в [ROOT.GetName] у разі вторгнення."
 SWI_alpine_communism_ADJ:0 "Альпійськ"
 SWI_ban_national_movement_for_switzerland_desc:0 "Фашисти, як і таргани, мають властивість ховатися в закутках суспільства, живлячись нашою недбалістю, щоби набратися сили, поки не стане надто пізно протистояти їм. Не більше! Їхні новий вигляд і назва нас не обдурять, ми повинні завдати рішучого удару, якщо хочемо зберегти нашу демократію."
 SWI_bring_democracy_to_germany:0 "Принести демократію в Німеччину"
 SWI_case_north:0 "План «Північ»"
 SWI_current_confederation_president:0 "Поточний президент Конфедерації"
 SWI_decision_substract_total_MR:0 "§RУся§! наша §Y£GFX_SWI_military_readiness_text_icon£ бойова готовність§! буде витрачена."
 SWI_defend_the_skies_desc:0 "Сучасна війна значною мірою залежить від переваги в повітрі та підтримки. [ROOT.GetName] не готовий до цієї нової реальності, тому ми повинні підготувати кожен кантон до захисту свого неба від ворожих літаків."
 SWI_demand_french_alps_desc:0 "Це питання часу, поки [FRA.GetNameDef] розвалиться під внутрішнім і зовнішнім тиском. Ми повинні зайняти активну позицію в обороні Альп, інакше небезпечний ворог може взяти під контроль оборонні позиції, які можуть стати плацдармом для вторгнення на нашу територію."
 SWI_democratic_party_long:0 "Федеральні збори кантонів"
 SWI_extensive_appeasement:0 "Широке умиротворення"
 SWI_fascism_party:0 "НРШ"
 SWI_focus_on_military_production:0 "Зосередитися на військовому виробництві"
 SWI_fortify_sargans_gotthard_and_st_maurice:0 "Укріпити Зарганс, Готтгард і Сен-Моріс"
 SWI_protect_liechtenstein_desc:0 "Розташоване між трьома нашими кантонами, крихітне князівство Ліхтенштайн має бути захищене, щоби захистити свій народ. Адже вони не мали шансів проти будь-якої чужої армії, в тому числі й нашої. Ми можемо запропонувати свою допомогу, окупувавши їх територію, вони можуть приєднатися до нашої присяги і стати нашим найновішим кантоном."
 SWI_tank_development:0 "Розробка танків"
 Sweden_rearnament.3.desc:0 "Століттями країни навколо Балтійського моря прагнули контролювати його вхід, і Швеція не є винятком. Маючи велике безперервне узбережжя, що простягається від крайньої півночі до західного узбережжя, яке виходить до північної частини Атлантичного океану, ми стикаємося з загрозами з боку Червоного флоту в Ленінграді і Kriegsmarine на півдні.\nХоча сильний флот має вирішальне значення для нашої оборони, великі металеві корпуси кораблів коштують недешево. Тому важливим є ретельно продуманий бюджет."
