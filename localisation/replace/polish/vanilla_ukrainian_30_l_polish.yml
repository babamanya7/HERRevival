 NORDIC_decision_dangerous_war_participation:0 "$NORDIC_dangerous_war_participation$"
 NORDIC_mechanized_army_desc:0 "Якщо ми зосередимо наші зусилля на навчанні наших людей битися всередині та поряд із величезними транспортними засобами, одягненими в сталь і гармати, ми досягнемо більшого удару з меншою кількістю людей. Звісно, якщо ми можемо виготовити достатньо згаданих величезних автомобілів."
 NORDIC_naval_officer_academy:0 "Академія морських офіцерів"
 NORDIC_nordic_airforce_desc:0 "Небо — новий кордон нашого альянсу. [NORDIC_get_nordic_airforce_desc]"
 NORDIC_nordic_army_desc_mon:0 "Сили [NORDIC_get_alliance_name] — це не просто армії, це набагато більше. [NORDIC_get_nordic_army_name] відважно битися під єдиним прапором за свого володаря та землю, яку вони представляють."
 NORDIC_procurement_fund:0 "Фонд закупівель"
