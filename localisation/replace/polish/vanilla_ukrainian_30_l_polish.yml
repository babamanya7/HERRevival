 BRA_batalha_do_borracha_desc:0 "[BRA.GetNameDefCap] колись домінувала на світовому ринку каучуку, поки [ENG.GetAdjective] не створили величезні плантації у своїй імперії. З загрозою їхнім лініям постачання, світ знову дивиться на нас, щоб ми постачали цей дорогоцінний ресурс."
 BRA_battleship_1_desc:0 "The Minas Gerais was a class of two dreadnought battleships built by the U.K. for Brazil in the early 1900s. They were active during World War II but far too obsolete for any serious duty, instead being used as coastal defense ships along the Brazilian coast."
 BRA_bop_right_side:0 "Військовий уряд"
 BRA_collectivization_of_transport_desc:0 "Наша транспортна система бачила кращі дні і гостро потребує реорганізації, щоб ми могли ефективніше використовувати її для наших потреб. Колективізація транспортної системи надала б владу робітникам для запровадження цих необхідних реформ таким чином, як вони вважають за найкраще."
 BRA_constitutional_monarchy_tt:0 "Залежно від попереднього вибору між §Y$BRA_petropolis_line$§! та §Y$BRA_vassouras_line$§!, буде активовано один із наступних національних духів:"
 BRA_cooperation_in_the_americas_desc:0 "«Політика добросусідства» Франкліна Рузвелта залишається впливовою в Західній півкулі. Нам слід прийняти цю політику та прагнути співпрацювати з країнами Америки, а не втручатись у справи один одного."
 BRA_democratic_union_long:0 "Бразильський демократичний союз"
 BRA_destroyer_2_desc:0 "The Juruena-class destroyers were a series of six H-class destroyers ordered by Brazil from the U.K. in the late 1930s. The ships were never delivered, however, as the British requisitioned them once war broke out in 1939. They displaced over 1,300 tons, had good speed, and were armed with three QF 4.7 in. Mk IX cannon as their main guns, as well as eight 533mm torpedo tubes."
