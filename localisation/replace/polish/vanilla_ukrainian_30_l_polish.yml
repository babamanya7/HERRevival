 MUN_czech.1022.d:0 "Після запеклих боїв у горах [69.GetName], [CZE.GetAdjective]і війська врешті-решт прорвалися і встановили контроль над усією Сілезією, перш ніж війська, з якими вони зіткнулися, встигли оговтатися, щоб чинити серйозний опір."
