 SIA_blood_of_suphan:0 "Кров Супхана"
 SIA_diversity_foreign_reserves:0 "Диверсифікація іноземних резервів"
 SIA_khana_ratsadon_cat:0 "Хана Ратсадон"
 SIA_mandate_4_desc:0 "Побачивши підняття або спуск державного прапора згідно з урядовим звичаєм, почувши звук сигнального горна чи свистка, або коли подається сигнал до підняття чи спуску прапора, слід вшанувати прапор згідно з правилами або звичаєм.\n\nКоли звучить державний гімн, незалежно від того, чи він виконується в офіційних цілях, чи як частина будь-якої церемонії, учасники або присутні повинні вшанувати гімн згідно з правилами або звичаєм.\n\nПомітивши будь-яку особу, яка не виявляє належної поваги, слід зробити їй зауваження, щоб вона зрозуміла важливість вшанування державного прапора, державного гімну та королівського гімну."
 SIA_mechanization_of_agriculture_desc:0 "Занадто багато праці залишається прив'язаною до традиційної обробки землі, даючи мало надлишку для промисловості. Впровадивши сучасні інструменти та машини в сільську місцевість, ми зможемо збільшити виробництво і вивільнити робочі руки для фабрик."
 SIA_prepare_for_a_pacific_war:0 "Підготовка до війни в Тихому океані"
 SIA_printing_money_monthly_increase_set:0 "Цей показник $MODIFIER_CONSUMER_GOODS_FACTOR$ збільшуватиметься щомісяця на §Y[?idea_SIA_printing_money_monthly_change|%]§!"
 SIA_relocate_the_capital_to_phetchabun_tt2:0 "Після закінчення дії духу - Ви отримаєте базову стабільність: §R-25%§!"
 SIA_reluctant_submission_desc:0 "Якщо [ROOT.GetNameDef] зіткнеться з вторгненням сильнішого ворога, може настати момент, коли відкритий опір обіцятиме лише руїну. Схилитися — гірко, але іноді уряд повинен поступитися, щоб врятувати націю від знищення і дочекатися більш сприятливого часу."
 SIA_rice_husk_steam_turbines:0 "Парові турбіни на рисовому лушпинні"
 SIA_singaporean_reinforcements:0 "Сінгапурські підкріплення"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc:0 "Залучити Пхічіта Кріангсакпхічіта на бік Сері Тхай. Якщо його вдасться переконати, він стане на наш бік, коли почнеться громадянська війна."
 SIA_tac_bomber_equipment_2_short:0 "Ki-21"
