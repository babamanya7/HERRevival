 NAVAL_MISSION_NAME_INVASION_DESC:0 "Наказати оперативній групі активно підтримувати переправлення військ і §Yнакази про вторгнення§!.\n§GКлацніть§!, щоб увімкнути це завдання, а потім §Gклацніть§! на стрілку вторгнення, якщо Ви її намалювали."
 NAVAL_MISSION_NAME_PATROL_DESC:0 "Наказати оперативній групі патрулювати зону операцій флоту.\n\nОперативна група може патрулювати тільки один регіон за раз.\nВона намагатиметься виявляти ворожі флоти в регіоні. Радари та перевага в повітрі допомагають їй швидше помічати ворога.\n\nЗауважте, що ворог може помітити й напасти на групу до того, як вона помітить його."
