 BRA_revive_the_anl_tt:0 "Під час майбутньої комуністичної революції отримайте §G2§! додаткові дивізії §Yкомуністичного ополчення§!."
 BRA_ship_torpedo_3:0 "4x 533-мм торпедний апарат"
 BRA_south_american_research_cooperation_desc:0 "Не секрет, що наші галузі промисловості та університети по всій Латинській Америці не мають доступу до такого ж рівня фінансування, як багато наших суперників. Однак, співпрацюючи через спільний дослідницький інститут, ми можемо уникнути дублювання зусиль та покращити темп інновацій у нашому регіоні."
 BRA_united_kingdom_of_brazil_and_portugal:0 "Сполучені королівства Бразилії та Португалії"
