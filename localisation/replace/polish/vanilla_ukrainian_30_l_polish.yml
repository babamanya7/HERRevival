 SOV_send_supporters_abroad_back_tt:0 "\nЦі персонажі повернуться до країни з метою підтримати нас у випадку громадянської війни.\n"
 SOV_send_ultimatum_to_country_middle_east:0 "$SOV_send_ultimatum_to_country_baltic$"
 SOV_sinkiang_oil_prospection_desc:0 "[618.GetName], у північній частині колишнього Сіньцзяну, багата на нафту та мінерали, але наразі жоден із них не розробляється. Ми мусимо шукати ресурси та розвивати інфраструктуру в області, щоби полегшити розробку будь-яких родовищ, які ми знайдемо."
 SOV_soviet_civil_war_not_started_tt:0 "Громадянська війна в Радянському Союзі не почалася"
 SOV_spheres_of_influence_in_china:0 "Сфери впливу в Китаї"
 SOV_stalingrad_hydro_station:0 "Сталінградська ГЕС"
 SOV_synthetic_rubber_desc:0 "Настане день, коли ми більше не зможемо покладатися на імпорт іноземного каучуку. Коли цей день настане, ми мусимо бути готові задовольнити наші потреби в каучуку за рахунок внутрішнього виробництва."
 SOV_the_bloc_of_rights_and_trotskyites_mission:0 "$SOV_the_bloc_of_rights_and_trotskyites$"
 SOV_the_end_of_the_imperialist_era_desc:0 "Чи не найбільш виразним проявленням імперіалізму є так звана доктрина Монро, за допомогою якої одна країна оголошує два цілих континенти своєю виключною територією. Це не допустимо. Революція знайде точку опори в Америці, і робітники західної півкулі нарешті зітхнуть вільно."
 SOV_the_fourth_international_desc:0 "Сталінські маріонетки з так званого Третього інтернаціоналу довели свою повну нездатність вести революцію вперед. Їхнє бачення комунізму має мало спільного з теоріями, записаними Марксом і Леніним, і натомість перетворює мрію про демократично контрольовану робітничу державу на антиутопічний кошмар. Нам потрібен новий Інтернаціонал, який захистить революцію!"
 SOV_the_socialist_bulwark_desc:0 "Ми стоїмо пліч-о-пліч з нашими іспанськими товаришами. У прикладі міжнародної солідарності, їхня боротьба — це наша боротьба, а наша боротьба — це їхня боротьба. Разом ми сформуємо два соціалістичні революційні центри на протилежних кінцях Європи."
 SOV_the_third_rome_tt:0 "§Y$SOV_metropolitan_meletius$§! більше не буде доступний як радник."
 SOV_the_true_tsars_tt:0 "Коли [GetSovietCivilWarName] почнеться:"
 SOV_tolkachi_desc:0 "У радянській економіці існує певний тип людей, чия робота полягає в тому, щоб цифри у виробничому плані відповідали цифрам, які промисловість може реально забезпечити. Якщо ми зможемо переконати цих людей працювати на нас, ми зможемо давати радянській владі одні цифри, а керівникам заводів — інші, а різницю у виробництві переносити туди, де її можна буде зберігати, доки не настане час."
 SOV_victory_over_devastation_tt:0 "Ідею §Y$SOV_planned_economy_dynamic_modifier$§! буде змінено:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-2.0%§!\n$MODIFIER_STABILITY_POPULARITY_FACTOR$: §G+15.00%§!\n$MODIFIER_MAX_SURRENDER_LIMIT_OFFSET$: §G+10.00%§!\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+10.00%§!\n\n"
 SOV_war_economy:0 "Воєнна економіка"
 SOV_wreckers_sabotage_contruction:0 "Саботувати будівництво"
 SPA_a_methodical_approach_desc:0 "Ключ до успіху в цій громадянській війні лежить не в сміливих маневрах і безрозсудних атаках, а в ретельному і методичному плануванні та навмисних і точних атаках."
 SPA_absorb_carlist_remnants:0 "Поглинути залишки карлістів"
 SPA_activate_pais_vasco_fifth_columnists:0 "Задіяти п'яту колону у Країні Басків"
 SPA_autarky:0 "Автаркія"
 SPA_battleship_1_desc:0 "The España class was originally a class of three dreadnought battleships that were commissioned around the time of World War I, though one had wrecked by the time of the Spanish Civil War. The other two were lost during the war. They were fairly small for a battleship, displacing just over 15,400 tons. They had decent armor and decent speed, however, and had a main battery of eight 305mm/50 Vickers H guns. "
 SPA_concessions_to_the_left_mission_desc:0 "Уряд робить широкомасштабні поступки робітникам-страйкарям, дозволяючи їм сходити з рук те, за що наші праві брати і сестри перебувають у в'язниці. Незважаючи на всю свою огидність, ці заходи, схоже, користуються популярністю серед страйкарів."
 SPA_confirm_the_fueros_desc:0 "Управління нацією належить до компетенції короля, але давні привілеї захищають право на самоврядування для регіонів, що складають королівство в цілому. Ці права, або фуерос, як їх називають, повинні бути підтверджені, якщо ми хочемо зберегти лояльність різних регіонів."
 SPA_develop_all_talent:0 "Розвинути всі таланти"
 SPA_expand_influence_in_the_asturias_garrison:0 "Розширити вплив на гарнізон в Астурії"
 SPA_expand_influence_in_the_extremadura_garrison:0 "Розширити вплив на гарнізон в Естремадурі"
 SPA_improve_domestic_naval_facilities:0 "Поліпшити вітчизняні військово-морські підприємства"
 SPA_no_compromise_on_carlist_ideals_desc:0 "Хоча ми співпрацювали з Фалангою під час нашого початкового повстання, тепер нам ясно, що компроміс із нашими ідеалами рівнозначний зраді. Якщо «Фаланга» не прийме наші вимоги, то у нас не буде іншого виходу, як і їх скасувати."
 SPA_obtain_training_staff_desc:0 "Хоча це може завдати шкоди нашій гордості, ми повинні визнати найкращий досвід наших іноземних прихильників у мистецтві ведення війни. Ми повинні запросити їхніх військових експертів до Іспанії, щоби навчати наших офіцерів і допомагати навчати наші війська, даючи нам необхідну перевагу над республіканцями."
 SPA_primo_de_rivera_prisoner_exchange:0 "Обмін в'язня на Прімо де Ріверу"
 SPA_primo_de_rivera_prisoner_exchange_desc:0 "Засновник Фаланги Хосе Антоніо Прімо де Рівера, син старого диктатора Мігеля Прімо де Рівери, був ув'язнений ще до початку громадянської війни. Республіканці висловили готовність піти з нами на обмін полоненими, і якщо ми хочемо повернути нашого ідеологічного лідера, ми повинні погодитися."
 SPA_reassert_american_dominance_desc:0 "За століття незалежності різні нації в Латинській Америці лише сварилися та сварилися між собою. Вони забули силу, яка полягає в нашій культурній єдності, тому ми нагадаємо їм, що ми є віссю, навколо якої вони обертаються."
 SPA_reassign_disloyal_leader_mission:0 "Перепризначення нелояльного командувача"
 SPA_restart_small_scale_shipbuilding_desc:0 "Нашому флоту знадобляться численні ескортні судна такого розміру, який можуть побудувати невеликі вітчизняні верфі. Ми повинні заохочувати розробку нових проєктів на цих верфях."
 SPA_submarine_3_desc:0 "The Spanish G-class submarines were a pair of German VIIC-class submarines licensed-built by Nationalist Spain. Only one was ever completed, however, and was not transferred to the Spanish Navy until 1947. The subs displaced 770 tons and were armed with five 533mm torpedo tubes. They had excellent speed and range, as the Type VIICs were the workhorse of the German submarine fleet."
