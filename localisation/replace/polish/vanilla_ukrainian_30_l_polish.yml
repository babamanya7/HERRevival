 DEN_increase_industrial_production_desc:0 "Останнім часом міська промисловість набуває все більшого значення, збільшуючи як зайнятість, так і економічне виробництво. Незважаючи на те, що наші підприємства збільшили свої можливості, вони мають стати ще більш ефективними."
 DEN_nordic_security_category_desc:0 "Ми повинні захистити наших скандинавських братів і захистити Нордичний фронт, щоб ми могли звернути увагу на більш нагальні справи."
 DEN_rally_the_nation_desc:0 "Тепер, коли ми захопили контроль над країною, вкрай важливо заручитися підтримкою народу. Хоча вони, можливо, не зможуть зробити багато, щоб протистояти нам, набагато краще мати народ на нашому боці, який готовий боротися за свою країну, ніж мати його з ножем у спині. Тож давайте відновимо [DEN.GetAdjective] гордість і згуртуємо народ на боротьбу за свою країну!"
 DEN_resistance_category_desc:0 "Ми повинні протистояти окупаційній владі та відновити нашу свободу! Цього можна досягти лише спільними зусиллями, і ми наполегливо працюємо над спільною метою звільнення [ROOT.GetNameDef]."
 DEN_rigid_training_desc:0 "Сама по собі чисельність не забезпечить нам панування в небі. Ми повинні провести наших пілотів через сувору підготовку, щоб вони могли тримати небо вільним від літаків [?DEN.DEN_overlord_nation.GetAdjective]."
 DEN_secure_swedish_steel_desc:0 "[DEN.GetNameDefCap] є бідною на ресурси країною, якій бракує більшості матеріалів, необхідних для утримання сучасної армії. З іншого боку, Швеція має багато природних ресурсів — і колись була під владою Данії. Настав час знову повернути [SWE.GetNameDef] під нашу владу."
 DEN_seek_industrial_investments:0 "Попросити промислові інвестиції"
 DEN_sikkerhedspolitiet_desc:0 "Створення розвідувальної служби допомогло б нам підвищити нашу пильність в умовах зростання напруженості в Європі і загрози конфлікту, що підриває наш суверенітет."
