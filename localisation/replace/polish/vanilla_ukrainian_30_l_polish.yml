 lend_lease_receiver_desc:0 "$COUNTRY|UY$ отримує допомогу від інших держав шляхом політики ленд-лізу"
 leninism_desc:0 "Заснований на марксистських поглядах ленінізм намагається вибудувати соціалістичну державу на чолі з партією, що проведе революцію з поваленням капіталістичного суспільства. З приходом до влади партія починає правити крізь систему, в якій рішення приймається після його обговорення."
