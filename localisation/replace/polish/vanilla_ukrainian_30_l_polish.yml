 EST_events.6.t:0 "[From.GetNameDefCap] Requests [FIN.GetAdjective] Entry into the [Root.GetFactionName]"
 EST_events.803.t:0 "Масштабний фашистський марш в області [?ROOT.vaps_from.GetName]"
 EST_modernize_capital_desc:0 "Велике місто Таллінн надто довго перебувало в пазурах німецьких і російських гнобителів, і все ж змогло розкрити свій потенціал на заздрість усій Балтії. Наше велике місто ніколи не було й не буде спалене чи осквернене іноземними арміями, і його необхідно осучаснити, щоби воно могло змагатися з іншими містами Європи."
 EST_ship_torpedo_sub_3:0 "6x 533-мм ТА з заряд. порш."
 EST_stomp_the_vaps_desc:0 "[EST.GetLeader] знає, що ми прагнемо порушити режим [EST.GetLeader.GetHerHis], і [EST.GetLeader.GetSheHe] готується придушити нас і покласти край нашим маршам. Якщо нам не вдасться повалити уряд до цього часу, Естонії загрожує громадянська війна!"
 EST_unite_karelia_desc:0 "У Карелії багато фінських народів — від власне карелів до східних саамів. Тепер, коли Фінляндія під нашим контролем, ми можемо розширити свою державу на територію Карелії і об'єднати там фінські народності."
 ETH_2ndItaloEthiopianWar:0 "[ITA.GetName] незаконно вторглася на нашу батьківщину. Незважаючи на те, що ми є повноправним членом Ліги Націй, світ не вживає заходів і розглядає конфлікт як незначну колоніальну сутичку.\nМи мусимо довести Лізі, що це повномасштабна війна агресії однієї держави-члена проти іншої, і таким чином змусити світ ужити заходів проти [ITA.GetLeader]."
 ETH_SWE_join_war_tt:0 "Якщо великі країни воюють з §Y[ITA.GetFlag][ITA.GetNameDef]§! і §Y[SWE.GetFlag][SWE.GetNameDef]§! погоджується на заявку спільного альянсу, вони спробують приєднатися до альянсу та до війни.\n §RЯкщо альянс недоступний, [SWE.GetFlag][SWE.GetName] не піде на війну поодинці проти [ITA.GetFlag] [ITA.GetName]!§!"
 ETH_bomb_proofing:0 "Захист від бомб"
 ETH_camouflage:0 "Камуфляж"
 ETH_capital_school_of_technology:0 "Школа технологій м. [ROOT.Capital.GetCapitalVictoryPointName]"
 ETH_conquer_harar_mission:0 "Завоювати [835.GetName]"
 ETH_cooperation_som_tt:0 "Отримає сомалійського політичного радника:\n§Y$economic_organizer$:§!\n   $MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5%§!\n   Стабільність: §G+5%§!"
 ETH_empower_the_ras_desc:0 "Подальше розширення можливостей неосвічених селян імперії призведе лише до руйнування імперської системи в довгостроковій перспективі. Натомість ми наділимося владою Рас в обмін на подальшу лояльність Імператору."
 ETH_ethiopian_officers_tt:0 "Змінити §Y[GetEthiopianAirforceSpiritName]§! на:\n $MODIFIER_AIR_ATTACK$: §G+15%§!"
 ETH_expand_tax_exemptions_desc:0 "[ETH_GetTaxExemptionDesc]"
 ETH_expand_the_bodyguard_tt:0 "Отримає додаткові війська, коли почнеться громадянська війна."
 ETH_france_divided_tt:0 "Франція була розділена"
 ETH_heavy_industry_desc:0 "Ми повинні продовжувати процес швидкої індустріалізації, якщо ми хочемо вирватися з лап феодальної економіки. Створення важкої промисловості залучить робітників у міста, створивши на місці існуючого селянства клас зразкових пролетарів."
 ETH_improve_the_administration:0 "Поліпшити нашу адміністрацію"
 ETH_japan_joins_tt:0 "§Y[JAP.GetNameDefCap]§! приєднається до війни держави §Y[ROOT.GetName]§! проти держави [ITA.GetName].\n§Y[ROOT.GetName]§! стане маріонеткою §Y[JAP.GetName]§!"
 ETH_japanese_investments_tt:0 "Відкриває §Yрішення§! для японських інвестицій у [ROOT.GetName] після звільнення [ROOT.GetName]"
 ETH_mass_transit_desc:0 "Значна частина нашої транспортної інфраструктури застаріла та потребує реорганізації, щоб її можна було використовувати ефективніше. Найліпше для реалізації таких реформ підходять працівники, які керують інфраструктурою."
 ETH_mercenaries_desc:0 "Є багато іноземців, які хочуть долучитися до нашої боротьби з різних причин. Більшість з них нікчемні авантюристи, які шукають тільки наші гроші; але ми могли б найняти найманців з Бельгійського Конго та з Аравії. Залучення деяких із цих досвідчених воїнів на наш бік, безсумнівно, допоможе схилити терези на нашу користь."
 ETH_mesafint_influence_range:0 "Месафинт впливають на політику"
 ETH_peacekeeping_forces_desc:0 "Ключ до нашої безпеки полягає в тому, щоби будь-яка криза за кордоном була швидко врегульована, перш ніж вона може вийти з-під контролю. Тому вкрай важливо підтримувати миротворчі сили, здатні бути розгорнуті по всьому світу в будь-який час."
 ETH_trigger_fulfilled:0 "£trigger_yes£"
 ETH_uk_arabia_tt:0 "Будь-яка §Yаравійська§! область належить державі §Y[ENG.GetNameWithFlag]§! або §Yсоюзнику§! держави §Y[ENG.GetNameDef]§!"
