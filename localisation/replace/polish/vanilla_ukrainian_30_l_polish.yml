 volkssturm_desc:0 "Volkssturm, або народне ополчення, складалося з чоловіків, які були непридатні до військової служби за віком або з інших причин.\n\n"
 war_justification.12.t:0 "[ROOT.GetLeader] протистоїть [From.GetAdjective]ому фашизму"
 war_justification.209.a:0 "Їх поблажлива риторика нас не залякає."
 war_justification.212.t:0 "[From.GetLeader] протистоїть [ROOT.GetAdjective]ому фашизму"
 war_propaganda_against_tension:0 "Військова пропаганда проти держави [From.GetName]"
 war_propaganda_against_tension_desc:0 "Ми мусимо стати проти загрози з боку держави [From.GetName]. Безпека нашої держави залежить від кожної людини, яка виконує свою роль."
 we_will_gain_tt:0 "§YМи отримаємо:§!"
 weather_snow:0 "Снігопад"
 when_intercontinental_bomber_project_is_completed_tt:0 "Після завершення спеціального проєкту §Y$sp_air_intercontinental_bomber$§!:"
 world_revolution_faction:0 "Світова революція"
 wtt_britain.29.a:0 "Хто їм допоможе, коли німці прийдуть по них?"
 wtt_britain_lease_azores.2.desc:0 "[From.GetAdjective]ий уряд схвалив прохання і передало Азорські острови під наш повний контроль за умови, що ми несемо повну відповідальність за їх захист від будь-яких атак. Невеликий загін уже прибув на острови, щоби закласти базу для операцій."
 wtt_burma_road.3.t:0 "[From.GetNameDefCap] наново відкриває частину Burma Road"
 wtt_china_shared.11.a:0 "$wtt_china_shared.10.a$"
 wtt_germany.17.b:0 "Збільште фінансування поліції та обмежте їхній вплив на нашу політику!"
 wtt_germany.19.b:0 "Ми мусимо врятувати свою репутацію та поліпшити відносини."
 wtt_germany.21.a:0 "Ми мусимо завдати удару, щоб убезпечити решту країн."
 wtt_germany.66.desc:0 "Держава [From.GetNameDef] вирішила приєднатися до нашої війни проти держави [SOV.GetNameDef], завдяки чому наші війська зможуть пройти його територією."
 wtt_infiltration.21.desc:0 "Діючи на основі отриманих нашою розвідкою відомостей, наші патрулі виявили велику базу комуністів. Ми мусимо негайно атакувати їх, перш ніж вони підготуються до нападу та зможуть дати відсіч."
 wtt_japan.101.t:0 "Возз'єднання Маньчжурії"
 wtt_japan.104.b:0 "Філіппіни залишаться американськими!"
 wtt_japan.117.t:0 "[From.GetName] засуджує нашу війну"
 wtt_japan.31.a:0 "Зашліть їх!"
 wtt_ledo_road.1.desc:0 "[occupying_country.GetAdjective]і війська, що атакують область [state_occupied.GetName], дійшли до дороги Ледо та перекрили її у кількох місцях. Тепер постачання нею недоступне."
 wtt_ledo_road.4.a:0 "Чудові новини!"
 wtt_manchukou.3.t:0 "[From.GetLeader] відмовляється"
 wtt_news.12.a:0 "Вони вважають, що можуть казати нам, хто може бути нашим лідером?!"
 wtt_news.18.t:0 "Австрія голосує за приєднання до Німеччини"
 wtt_news.22.a:0 "Ми очолимо вільну Європу у боротьбі з комунізмом!"
 wtt_news.47.b:0 "Прийдіть і заберіть!"
 wtt_news.47.t:0 "[From.GetNameDefCap] претендує на Південний Індокитай"
 wtt_news.6.desc:0 "У дунайських державах-спадкоємицях Австро-Угорської імперії останнім часом посилилися проімперські настрої і вирішили знову об'єднатися під керівництвом лідера. [From.GetOldNameDef].\n\nНовий уряд відновленої Австро-Угорщини негайно зробив кроки щодо укладання союзу з Німецькою імперією, відкрито висловивши свою підтримку антибританській та антифранцузькій політиці Німеччини."
 wtt_news.62.desc:0 "Держава [From.GetOldNameDef] підкорила всі основні держави континентальної Європи, і вперше за всю історію мрія про «Об'єднану Європу» може стати реальністю. Різноманітні «експерти» (імовірно фінансовані урядом) навперебій міркують про те, що це єдиний шанс «уникнути подальших військових конфліктів у Європі».\n\nУ спробах надати своїй країні статусу «держави для всіх європейців» уряд активно проводить низку реформ на загальнонаціональному та місцевому рівнях; зокрема сьогодні було оголошено про те, що відтепер країна іменується «[From.GetNameDef]», щоб «усі європейці відчували себе в ній, як удома»."
 wtt_news.65.b:0 "Чи принесе це мир і стабільність у регіон?"
 wtt_political_organisation.7.t:0 "Повідомлення з області [state.GetName]"
 wtt_political_warlord_support.10.b:0 "Попросити надіслати партію гвинтівок."
 wtt_prc.1.desc:0 "Після довгих років безуспішного конфлікту і перед загрозою з боку Японії комуністи звернулися до нас із пропозицією створити об'єднаний уряд. Наші армії зможуть боротися пліч-о-пліч, і ми спільно координуватимемо свою політику.\n\nМотиви такої несподіваної зміни в настроях не дуже зрозумілі, і дехто в уряді вважає, що це лише їхній перший етап із захоплення країни."
 wtt_the_hump.2.desc_war_with_from:0 "[From.GetAdjective]і війська зайняли аеродроми, що використовуються для постачання наших військ повітрям через Гімалаї. Подальші поставки за цим маршрутом неможливі."
 wtt_warlord_vs_prc.1.a_tooltip:0 "У разі відхилення це призведе до війни з державою §H[communist_china.GetNameDef]§!.\n"
 wtt_warlord_vs_prc.21.a:0 "Така ціна, яку ми змушені платити."
 wtt_warlord_vs_prc.22.desc:0 "Незважаючи на протести, [From.GetLeader] погодився збільшити економічну допомогу на нашу вимогу."
 wtt_warlord_vs_prc.23.a:0 "Він обіцяв, і ми отримаємо своє!"
 wtt_xian_incident.7.a:0 "Попросити радянців про схвалення."
 wuw_GER_civil_war.6.a:0 "За пролетаріат!"
 wuw_GER_diplomacy.1.t:0 "[FROM.GetNameDefCap] пропонує торговельне партнерство"
 wuw_GER_diplomacy.101.t:0 "[FROM.GetNameDefCap] відкидає ініціативу з обміну технологіями"
 wuw_GER_diplomacy.25.t:0 "[FROM.GetAdjective] відмовляються повернути наші колонії"
 wuw_GER_diplomacy.26.a:0 "Звучить справедливо"
 wuw_GER_diplomacy.28.desc:0 "Відповідь від [FROM.GetNameDef] виявилася не такою, як ми очікували. Вони не бажають ділитися своїми досягненнями в галузі морського інженерного мистецтва, попри те що ми запропонували їм доступ до наших розробок. Вони заявляють, що флот [FROM.GetAdjective] значно переважає наш, і до тих пір, поки ми не досягнемо серйозного технологічного прориву, будь-яка така угода — неможлива."
 wuw_GER_diplomacy.34.a:0 "Чудова новина!"
 wuw_GER_diplomacy.51.t:0 "[FROM.GetNameDefCap] погоджується на співпрацю у військово-морському розвитку"
 wuw_GER_diplomacy.64.a:0 "Якщо це необхідно — погоджуємось"
 wuw_GER_diplomacy.64.b:0 "Це надто дорого для нас..."
 wuw_GER_diplomacy.66.t:0 "[FROM.GetNameDefCap] відкидає наші умови"
 wuw_GER_diplomacy.82.desc:0 "Наші товариші з [FROM.GetNameDef] надіслали нам партію зброї для боротьби з капіталізмом і буржуазією. Можливо, пізніше вони вимагатимуть відплати, але зараз ми не можемо відмовитись."
 wuw_GER_diplomacy.97.a:0 "Розширимось власними силами."
 wuw_GER_diplomacy.97.desc:0 "[FROM.GetAdjective]и відкинули нашу пропозицію, попри її очевидну вигідність для обох сторін. Хоча план зірвався, ми самі можемо продовжити модернізацію."
 wuw_GER_german_politics.02.b:0 "Залишимо Ернста Тельмана при владі!"
 wuw_GER_legions.2.desc:0 "У зв’язку з оголошенням воєнного стану між нами та [SOV.GetAdjective], наш військовий аташе, генерал-майор Ганс Кребс, був завчасно відкликаний і нещодавно прибув до Берліна. Тепер він готовий служити на Східному фронті, заявляючи, що володіє потрібним досвідом і знанням про армію [SOV.GetAdjective] для успішного вторгнення."
 wuw_GER_legions.5.desc:0 "Після звільнення Брянської, Курської та Орловської областей наша армія заарештувала більшість колаборантів у Локоті та відновила місцеву владу. [GER.GetAdjective] війська відступили, і наші командири впевнені, що перемога близька."
 wuw_GER_monroe.1.b_tt:0 "[GER.GetNameDefCap] отримує доступ до рішень щодо спроби §RДестабілізувати Доктрину Монро§!.\n\nОбравши цей варіант, ми §RНЕ§! отримуватимемо подальших повідомлень щодо Доктрини Монро. [FROM.GetNameDefCap] матиме змогу намагатися скасувати Доктрину без нашого втручання.\n\n§RОберіть цей варіант лише якщо у вас є запасний план!§"
 wuw_GER_monroe.13.a:0 "Ох вже ці справи…"
 wuw_GER_monroe.3.t:0 "[FROM.GetNameDefCap] Зміцнює Доктрину Монро"
 wuw_GER_monroe.6.t:0 "[FROM.GetNameDefCap] Вимагає підтвердження нашої позиції щодо Доктрини Монро"
 wuw_GER_monroe_news.1.d:0 "Жахливий день!"
 wuw_GER_realpolitik.25.a:0 "Вони втрачають можливість..."
 wuw_GER_realpolitik.27.b:0 "Ми повинні зупинити цю дурницю!"
 wuw_GER_realpolitik.36.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] запропонував об'єднати наші країни, вважаючи, що наші народи єдині та почуватимуться безпечніше в межах однієї могутньої держави. У повідомленні відчувається примус, але, можливо, краще бути частиною чогось більшого?"
 wuw_GER_realpolitik.37.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] оголосив, що після проведення публічного голосування [FROM.GetAdjective] нація офіційно припиняє своє існування й стає невід'ємною частиною [ROOT.GetAdjective] держави. Схоже, нам вдалося їх переконати."
 wuw_GER_realpolitik.40.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 wuw_GER_realpolitik.45.a:0 "Домовилися!"
 wuw_GER_realpolitik.46.t:0 "[GER.GetNameDefCap] вимагає чехословацькі землі"
 wuw_GER_realpolitik.61.desc:0 "Чудова новина — керівництво [FROM.GetNameDef] погодилося на повну інтеграцію до нашої держави. Це викликало оплески в Рейхстазі. Наші переваги виявилися вагомішими за їхню незалежність."
 wuw_GER_reichskommissariats.12.desc:0 "Тепер, коли ми створили нову цивільну адміністрацію в Південній Польщі, нам слід визначити не лише її призначення, а й те, хто очолить місцеве населення та забезпечить виконання нашої політики. Чи слід нам призначити [ROOT.GetAdjective] політика на посаду генерал-губернатора, чи краще використати місцевого колаборанта?"
 wuw_GER_reichskommissariats.15.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.20.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_weltpolitik.12.t:0 "[FROM.GetName] просить повернення колоніальних територій"
 wuw_HUN_a_declaration_of_intentions_desc:0 "Настав час відкрито заявити всьому світу про наші наміри та показати, з чого справді зроблений [ROOT.GetAdjective] народ."
 wuw_HUN_demand_austrian_restoration:0 "Вимогти відновлення Австрії"
 wuw_HUN_demand_burgenland_desc:0 "Смілива Rongyos Gárda створила Лайтабаншаг після Великої війни, щоб повернути Бургенланд під контроль Угорщини. Та регіон був відібраний і переданий Австрії. Ми повинні повернути цю територію, щоб відновити нашу гідність."
 wuw_HUN_demand_croatian_reintigration:0 "Вимогти реінтеграцію Хорватії"
 wuw_HUN_empower_the_greenshirts:0 "Посилити Зелені Сорочки"
 wuw_HUN_light_infantry_divisions_doctrine:0 "Доктрина легкої піхоти"
 wuw_HUN_protect_czechoslovakia:0 "Захистити Чехословаччину"
 wuw_HUN_reclaim_transylvania:0 "Повернути Трансильванію"
 wuw_HUN_renew_the_rome_protocols_interventionalism_tt:0 "Буде знято штраф до політичної влади з ідеї §YІнтервенціонізм§!"
 wuw_HUN_state_protection_authority_desc:0 "Щоб захистити наших громадян і запобігти контрреволюції, ми створимо таємну поліцію з широкими повноваженнями."
 wuw_HUN_the_matyasfold_fighter_factory:0 "Завод винищувачів у Матяшфьолді"
 wuw_HUN_undermine_the_volksbund_desc:0 "Багато фашистських парамілітарних угруповань, таких як німецько-угорський Фольксбунд, пов'язаний з німецькими фашистами, виступлять проти нас у разі революції. Ми повинні знищити їх зсередини або ззовні, доки не пізно."
 ww_BEL_event_diplomatic.35.b:0 "Ні, ми не бачимо в цьому вигоди."
 ww_BEL_event_diplomatic.5.c:0 "Забезпечити фінансову компенсацію."
 ww_congo.13.d:0 "Конголезькі сили розташовані вздовж нашого кордону, і вони вимагають повного контролю над нашими базами, установами та інфраструктурою! Якщо ми погодимося на їхній запит, ми фактично припиняємо нашу незалежність, ставши частиною їхньої нації. З іншого боку, у нас немає реальних засобів для боротьби з ними з цього питання."
 ww_congo.29.t:0 "Конголезькі націоналісти звертаються до нас за допомогою"
 ww_congo.32.a:0 "Цириль Адулa — хороший державний діяч"
 ww_congo.32.desc:0 "Рух Симба здобув велику підтримку в країні останнім часом. Тепер вони увійшли до національного конгресу, вимагаючи зміни лідерства. Нашим політикам не залишилось нічого іншого, як прийняти ситуацію. Але питання: хто має очолити нашу державу?"
 ww_congo.46.t:0 "Ма Лоанго"
 ww_congo.48.b:0 "Ні, нам потрібен хтось інший!"
 ww_congo.48.desc:0 "Рада вирішила, що ще одним можливим правителем Конго може бути Мутара III Рудахігва, Умвамі Королівства Руанда, королівства на сході. Напевно, він може принести стабільність і досягти об'єднання з Руандою?"
 ww_congo.51.desc:0 "\n[FROM.GetNameDefCap] з ентузіазмом відреагував на нашу пропозицію про альянс і підписав всі необхідні документи для його офіційного укладення. Більше ми не будемо воювати самотужки проти тих, хто нас загрожує!"
 ww_congo.57.desc:0 "\n[FROM.GetLeader], лідер [FROM.GetNameDef], погодився передати нам всі території з великою кількістю руандійців, бажаючи нам удачі в майбутньому. Сьогодні великий день для нації Конго."
 ww_congo.63.b:0 "Ми не опустимося до криміналу"
