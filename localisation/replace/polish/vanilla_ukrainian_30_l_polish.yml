 BEL_stk:0 "Заснувати STK"
 BEL_tac_bomber_equipment_1:0 "LACAB GR.8"
 BEL_the_flemish_question_desc:0 "Постійний поділ всередині [BEL.GetName] продовжує спричиняти розбіжності серед нашого народу. Нам потрібно вирішити це питання раз і назавжди та самостійно визначити, який мовний стандарт є правильним. Люди зроблять те, що їм скажуть, адже ми всі є [BEL.GetAdjective], і це перевершує будь-яку суперечку щодо мови."
