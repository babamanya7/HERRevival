 WW_hungary.11.desc:0 "Безрозсудний [FROM.GetLeader] нещодавно засудив наше, як він заявив, незаконне володіння [FROM.GetAdjective] Словаччиною. Тепер ми отримали [FROM.GetAdjective] ультиматум, а їхні війська зосереджуються біля наших кордонів. Як нам відповісти?"
 WW_hungary.112.desc:0 "Керівництво [FROM.GetNameDef] публічно заявило про свою непохитну підтримку самовизначення жителів [664.GetName]. «Настав час обрати, у якій державі жити», — заявив [FROM.GetLeader], фактично відмовившись від претензій на ці території."
 WW_hungary.117.b:0 "Референдум був сфальсифікований"
 WW_hungary.122.a:0 "Ми змушені це прийняти"
 WW_hungary.122.desc:0 "Керівництво [FROM.GetNameDef] заявило про недійсність референдуму в [76.GetName], стверджуючи, що результати були сфальсифіковані, а спостерігачі діяли в інтересах [ROOT.GetAdjective] уряду."
 WW_hungary.19.t:0 "Дурний [FROM.GetLeader] відхилив наш ультиматум"
 WW_hungary.22.a:0 "Вони ще пожалкують!"
 WW_hungary.24.desc:0 "Розсудливий [FROM.GetLeader] з [FROM.GetNameDef] погодився передати нам території в Бургенланді та наказав своїм військам відійти. Ми знову перемогли!"
 WW_hungary.26.a:0 "Вони бажані в нашій фракції"
 WW_hungary.35.a:0 "Ми вітаємо їх"
 WW_hungary.4.a:0 "Бог з ними, виводьте гарнізони..."
 WW_hungary.56.a:0 "Ще один крок до повернення нашої спадщини."
 WW_hungary.6.desc:0 "Зарозумілі лідери держави [FROM.GetNameDef] відмовилися від нашої пропозиції про мир. По їх думці: війна — кращий варіант, ніж передача нам Трансільванії. Можливо, вони вважають наші вимоги блефом, або настав відповідний час, щоб завдати їм удару. Тільки час покаже."
 WW_hungary.71.t:0 "[FROM.GetNameDefCap] відмовляється від Габсбурзького монарха"
 WW_hungary.72.a:0 "Не варто проливати кров"
 WW_hungary.77.b:0 "Ми повинні відступити"
 WW_hungary.78.a:0 "Без сумніву"
 WW_hungary.86.a:0 "Ми не маємо сил боротися з ними"
 XIC_reestablish_the_zhili_army_desc:0 "Чжилійська армія Фентянської кліки була колись армією, яку Цзолінь розмістив у нинішній провінції Хебей і Бейпіні. Ми повинні відновити цю організацію як гарну сходинку на нашому шляху до повної відбудови Кліки."
 XIC_restore_the_glory_of_the_fengtian_army:0 "Відновити славу Фентянської армії"
 XIC_revive_the_beiyang_government:0 "Відродити Бейянський уряд"
 XSM_a_hui_army_desc:0 "Армія під командуванням Ма Буфана значною мірою складається з народу хуей, який присягає на абсолютну вірність своєму командиру. Вони будуть дуже корисними, якщо Ма Буфану доведеться захопити владу військовим шляхом."
