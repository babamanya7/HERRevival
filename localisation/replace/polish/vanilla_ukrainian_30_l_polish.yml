 GRE_faction_friendly:0 "§GДружні§!"
 GRE_fascist_leanings:0 "Фашистські нахили"
 GRE_greek_autarky:0 "Грецька автаркія"
 GRE_heavy_fighter_equipment_1:0 "EAF Nieuport Nighthawk"
 GRE_hellenic_armoured_corp_desc:0 "Якщо зараз започаткувати власну бронетанкову дивізію, весь світ побачить, які ми сучасні! Хіба на задвірках цивілізації є танки?"
 GRE_light_tank_equipment_2:0 "Vickers Light Tank Mk IIIB"
 GRE_macedonian_generals:0 "Македонські генерали"
 GRE_modern_cataphracts_desc:0 "Катафрактарії були грозою античного світу! Усі жахалися їхньої швидкості, броні та сили! Катафрактарій наших днів — це, без сумніву, танк, і ми створимо такий клас танків, який гідний нести спадщину Візантії."
 GRE_paying_back_our_debts_in_bulk_ITA_tt:0 "Буде відкрите рішення: §YВелика виплата боргу перед [ITA.GetAdjective]ою державою§!.\n"
 GRE_republican_economy_change_radical_tt:0 "Радикальна зміна економічної політики зменшить лояльність §Yфракції венізелістів§! на §R10§!.\n"
 GRE_republicans_stability_status_amount:0 "[ROOT.GetRepublicanStabilityBonus]"
 GRE_sub_ship_engine_1:0 "«Sulzer» 1 420 к. с. н. в."
 GRE_submarine_1_desc:0 "The Katsonis-class submarines were built in France for the Hellenic Navy in the late 1920s. Both ships of the class served during World War II. They displaced nearly 580 tons and were armed with six 533mm torpedo tubes."
 GRE_submarine_4:0 "Клас «Pipinos»"
 GRE_tac_bomber_equipment_3_short:0 "EAF Baltimore"
 GRE_the_birthplace_of_democracy_desc:0 "Нелюбов до тиранів греки з гордістю зберігають ще з часів Перікла! Демократія — один з багатьох плодів нашого генія, і буде справедливо, якщо ми захищатимемо її від тиранії римського і тевтонського зразка!"
 GRE_the_greek_industrial_revolution_desc:0 "У Греції індустріалізація мала розпочатися ще кілька десятиліть тому, але через продажних політиків і підступів іноземних держав наша економічна система застрягла у минулому. У нас немає часу, щоби змінювати свій спосіб життя поступово, треба починати негайно і діяти швидко."
 GRN_neutrality_party_long:0 "Уперед"
 GUAY_abolish_low_level_income_tax_desc:0 "Оподаткування найбідніших верств нашого суспільства не має сенсу, це має бути скасовано."
 GUAY_cult_of_personality_desc:0 "Щоб зміцнити націю, ми піднесемо нашого дорогого лідера та сформуємо культ особистості. Символічна фігура, за яку простий люд зможе згуртуватися та померти."
 GUAY_dam_construction_desc_tt:0 "Очікується, що ми повернемо інвестиції через §Y720 днів§!. Погашення буде анульовано, якщо ми розпочнемо війну з цією країною до настання терміну платежу."
