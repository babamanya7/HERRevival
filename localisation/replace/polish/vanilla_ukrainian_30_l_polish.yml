 HOA_names_finest:0 "Найкращі з [ROOT.GetName]"
 HOA_names_finest_desc:0 "Наші війська знають, що вони є єдиною перешкодою для того, щоби наш народ став підданим чужої влади. З цим знанням приходить непохитна відданість захисту батьківщини та збереженню [ROOT.GetAdjective]ої свободи."
 HOA_the_first_album_desc:0 "Світ видається дедалі небезпечнішим, оскільки напруга між великими державами зростає, але це також відкриває світ можливостей для тих націй, які бажають і готові скористатися моментом."
