 CZE_contact_henlein_focus_order_warning_tt:0 "Якщо ми виконаємо §Y«$CZE_no_compromise_with_the_sdp$»§! після завершення цього §Yнаціонального фокусу§!, §Y$CZE_konrad_henlein$§! піде у відставку."
 CZE_deepend_ties_with_the_trademans_desc:0 "Партія торговців популярна серед міських виборців середнього класу. Якщо ми надамо їм повноваження та працюватимемо з ними, ми зможемо знайти підхід до міського електорату, не відштовхуючи при цьому нашу сільську базу виборців."
 CZE_defensive_preparations_desc:0 "Війна здається неминучою, хочемо ми того чи ні. Буде корисно заздалегідь до неї підготуватися."
 CZE_demand_guarantees_desc:0 "Незважаючи на існуючі договори та альянси, ми повинні переконатися, що наші партнери не покинуть нас у скрутний час лише тому, що їм так легше. Нам потрібно щось сильніше за гарантію."
 CZE_demand_slovenia_desc:0 "Словенія в минулому була помітною частиною Австрійської імперії, і тепер, коли ми взяли під контроль ядро цієї імперії, ми повинні спробувати повернути її територію."
