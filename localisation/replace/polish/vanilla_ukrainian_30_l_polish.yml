 BRA_embraer_organization:0 "Empresa Brasileira de Aeronáutica"
 BRA_federal_development_desc:0 "Економічний розвиток має бути розподілений по всій нації, щоб усі могли пожинати плоди своєї наполегливої праці. Тому нам потрібно диверсифікувати не лише товари нашої промисловості, але й їхнє місцезнаходження."
