 SUBDOCTRINE_STREAMLINED_DEPLOYMENT_DESC:0 "Наступальні результати у стратегічному масштабі можуть бути досягнуті лише тоді, коли всі роди військ, включно з танками, масовані для концентрації своєї ударної потужності у вирішальній точці."
