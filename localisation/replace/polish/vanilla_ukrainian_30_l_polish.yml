 SOV_aristocratic_investments_desc:0 "Багато колишніх російських дворян досі розкидані по всьому світі, і чимало з них володіє значними статками. Частину цих багатств можна було б передати нам для придбання зброї та обладнання."
 SOV_autonomy_dominion_DEF:0 "Російський домініон"
 SOV_autonomy_wtt_imperial_protectorate_DEF:0 "Імперський протекторат Росія"
 SOV_battle_cruiser_2:0 "Клас «Кронштадт»"
 SOV_build_national_academy_of_sciences_integrated_republic_GEO_desc:0 "Ми збудуємо [GEO.GetAdjective]у національну академію наук, що, безсумнівно, проскорить наші дослідження."
 SOV_carrier_2_desc:0 "The Krasnyi Vozdukh-class aircraft carrier was a hypothetical design to provide the Soviet navy air projection over its fleets. They were similar in size to the British Ark Royal or Japanese Hiryu classes but carried additional secondary guns against surface targets and adequate AA guns for air cover. The increased armor results in a slightly reduced air group compared to these classes."
