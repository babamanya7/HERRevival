 DOD_hungary.151.desc_light_fighter:0 "Міністерство авіації бажає придбати новий легкий винищувач для бойових рейдів та оборони об'єктів, але міністерство закордонних справ зазначило, що політичні та дипломатичні мотиви також мають впливати на вибір країни, в якій ми замовимо літаки."
