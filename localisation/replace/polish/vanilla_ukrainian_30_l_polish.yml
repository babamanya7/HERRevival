 PAR_GATHERING_STORM_DESC:0 "Despite having just emerged victorious from the bloody Chaco War against Bolivia, the country is economically exhausted and heavily militarized, with the unpopular Ayala unable to control the situation as he, together with his right-hand man José Félix Estigarribia, is to blame for the war even happening in the first place.\n\nThe military, rallying behind Rafael Franco and the socialist Feberista movement seem to be preparing to oust the government, and it seems they will not back down without a fight."
 PAR_a_call_out_for_aid_desc:0 "Ми використаємо [FRA.GetAdjective] дружину президента, щоб лобіювати [FRA.GetAdjective] уряд, аби дозволити добровольцям допомогти нам у нашій боротьбі."
 PAR_accept_american_loans:0 "Прийняти американські позики"
 PAR_accept_american_loans_desc:0 "Американці тиснуть на нас, щоб ми не приєднувалися до держав Осі, і готові інвестувати значні кошти в нашу країну, щоб запобігти нашому зближенню з їхніми супротивниками."
