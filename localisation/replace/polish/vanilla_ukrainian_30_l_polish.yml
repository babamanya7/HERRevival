 GIE_EXILE_ARMY_LEADER_LOCKED:0 "Державі $EXILENAMEDEF|UH$ потрібно $VALUE|0H$ §Hлегітимності§!, щоби відкрити цього §Hкомандувача армією у вигнанні§!."
 GIE_PLAYER_CONTROLLED:0 "§HПід керуванням гравця§!\n\nОтримає §Hкомандувачів арміями у вигнанні§! замість приймаючої країни.\nПрийнявши, ШІ передає управління §Hкадровими дивізіями у вигнанні§!"
