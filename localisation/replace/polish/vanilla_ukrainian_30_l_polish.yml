 faction_goal_the_northern_mandate_desc:0 "Щоб наш народ міг процвітати, нам знадобляться територія та ресурси, які можна знайти в Сибіру. Поточний власник не в змозі використовувати їх належним чином, тому ми маємо на це право."
 fake_intel_release_pow_desc:0 "Полоненого ворожого офіцера треба з міркувань гуманності відправити додому. Перш ніж він покине нас, ми зробимо так, щоб він щось побачив."
 fall_weiss:0 "План «Білий»"
 finland.8.d:0 "Війна з державою [From.GetNameDef] була дорогою справою, але оскільки ми змогли відтіснити [From.GetAdjective]у армію, вони зробили нам переконливу пропозицію. Ми отримуємо контроль над стратегічно важливими територіями, але мусимо вивести наші війська та припинити подальші бойові дії.\nЦе завершить наш наступ на державу [From.GetNameDef] без повного контролю над регіоном, але у свою чергу дозволить нам зосередитися на розширенні нашої сфери впливу в інших частинах світу."
 fire_support:0 "Важкозбройова рота"
 flexible_navy:0 "Гнучкий флот"
 fluchtlinge:0 "Fluchtlinge"
 form_andalusia_desc:0 "З Кордовою, Гранадським еміратом і більшою частиною Південної Іберії під нашим контролем, ми маємо унікальну можливість відновити старий султанат Аль-Андалус і проголосити всі його колишні території законними частинами нашої держави."
