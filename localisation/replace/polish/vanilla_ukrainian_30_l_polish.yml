 BUL_form_a_popular_bloc_desc:0 "Щоб сформувати міцний об'єднаний блок проти авторитаризму та гноблення в [ROOT.GetNameDef], ми мусимо схилятися до соціалістичної політики та прагнути згуртованості між лівими політичними групами, які готові боротися проти фашистських і монархічних режимів."
