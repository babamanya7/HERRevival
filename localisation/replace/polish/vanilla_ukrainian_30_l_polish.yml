 INS_communist_events.10.desc:0 "Брошури [FROM.GetAdjective] циркулюють у казармах і на державній службі, і зусилля з конфіскації мало допомогли зупинити цю хвилю. Вони говорять про звільнені нації, про народи, які скинули своїх колоніальних губернаторів і побудували щось своє. Це було б легше придушити, якби ці настрої не здавалися правдивими. Навіть лояльні чиновники почали тихо запитувати, чи служить наша нинішня домовленість нашому народу, чи лише нашим господарям."
 INS_communist_events.4.desc:0 "Комуністичні революціонери, озброєні та організовані за підтримки [FROM.FROM.GetNameDef], підняли відкрите повстання в [FROM.GetName]. Колоніальна адміністрація втратила контроль над великими ділянками території, і губернатор повідомляє, що місцевий гарнізон не може відновити порядок без підкріплення."
