 POL_complete_april_constitution_desc:0 "Квітнева конституція — це низка реформ, покликаних перетворити Польщу в більш централізований авторитарний режим на чолі з президентом. Санаційний уряд легітимізується цим законодавчим актом, але й досі є ті, хто прагне стару систему. Квітневу конституцію слід доповнити та змінити, щоб [GetAppropriateLeaderNameInBookmark] отримав розширені повноваження і централізував польську державу!"
 POL_consolidate_sanation_government_desc:0 "Після смерті Юзефа Пілсудського санаційний уряд був фрагментований і дезорганізований. Уряд розділився на три гілки: Замок, Ліву санацію та Праву санацію. Невідомо, чи зможе Замок зберегти контроль над диктатурою, але уряд повинен якнайшвидше вийти зі стану нерішучості, якщо він хоче мати хоч якусь надію вистояти в майбутньому штормі війни, що насувається."
 POL_diplomatic_mission_to_TUR:0 "Дипломатична місія в державу [TUR.GetNameDef]"
 POL_flip_lithuania_monarchist:0 "Подати претенію"
 POL_light_bomber_focus_desc:0 "Не можна недооцінювати значення використання пікіруючих бомбардувальників для ближньої авіаційної підтримки."
 POL_light_cruiser_2:0 "Клас «Łódź»"
 POL_lithuanian_annexation:0 "Вимогти анексію Литви"
 POL_political_commissars_desc:0 "Для того, щоб зберегти контроль над військовими, будуть призначені політичні офіцери, які забезпечуватимуть дотримання військовими партійної політики."
 POL_prepare_for_the_next_war_desc:0 "Велика війна, можливо, була лише першою у своєму роді. Ми повинні готуватися до того, що поле бою, безсумнівно, буде постійно змінюватися."
 POL_san_right_desc:0 "Праве крило уряду значною мірою складається з впливових військових кадрів, об'єднаних навколо Едварда Ридза-Сміглого."
 POL_ship_torpedo_sub_4:0 "6x 550-мм ТА з P.Loading"
 POL_social_commonwealth:0 "Співдружність соціалістичних республік"
 POL_soviet_industry_desc_alt:0 "Незважаючи на поневолення, яке ми зазнаємо з боку держави [SOV.GetNameDef], ми повинні продовжувати розвивати власну індустрію. Це може стати в нагоді, якщо ми коли-небудь вирішимо розірвати наші кайдани."
 POL_standardisation_of_equipment_desc:0 "Стандартизуючи оснащення наших солдатів, ми закладаємо фундамент для сучасного апарату забезпечення."
 POL_submarine_2_desc:0 "Клас «Orzeł» складався з двох підводних човнів, сконструйованих у Нідерландах для ВМС Польщі. Вони були завершені за кілька місяців до німецького вторгнення. Ці човни були доволі великими, з водотоннажністю 1100 т, озброєні дванадцятьма 550-мм торпедними апаратами й могли пірнати до 80 м."
 POL_the_between_the_seas_concept_desc:0 "Юзеф Пілсудський мріяв про союз народів між морями: поляки, румуни, колишні члени Речі Посполитої та навіть італійці працювали разом, щоб забезпечити своє спільне виживання, не поступаючись ні на йоту своїм суверенітетом. Зараз ми маємо можливість втілити в життя сміливе бачення Пілсудського. Звернувшись до Румунії, ми зробимо перший крок до того, щоб Міжмор'я стало реальністю!"
 POL_wettin_party:0 "Веттини"
 POPS_account-exists:0 "Обліковий запис із таким іменем уже існує"
 POPS_dynamodb-failure:0 "Не вдалося під'єднатися"
 PORTUGAL_BLITZKRIEG_DESC:0 "Консервативний уряд Салазара дозволив Португалії зберегти нейтралітет протягом громадянської війни в Іспанії, при тому ж активно підтримуючи націоналістів, чим той забезпечив поразку комуністів й анархістів.\n\nТепер, коли Іберійський півострів нарешті знайшов стабільність, настав час пошукати у світі можливих союзників та обдумати роль, яку Португалія відіграє в, здавалося б, неминучому світовому конфлікті."
 POR_HOL_autonomy_eu_member:0 "Європейська Португалія"
 POR_Iberian_Summit_Receiver_Portugal:0 "Португал"
 POR_arsenal_do_alfeite_desc:0 "Нашим головним пріоритетом має бути створення сильного флоту, здатного захистити нашу розгалужену імперію. Ми повинні мати потенціал і знання, щоби будувати більші кораблі. Головні верфі ВМС у Лісабоні слід розширити та найняти експертів із суднобудування."
 POR_deal_with_the_japanese_threat:0 "Покінчити з японською загрозою"
 POR_empire_fascism:0 "П'ята Португальська імперія"
 POR_light_tank_destroyer_equipment_2:0 "Veículo Anti-Tanques 2"
 POR_naval_research_institute:0 "Морський дослідницький інститут"
 POR_rebuild_the_lines_of_torres_vedras_desc:0 "Декілька офіцерів вищого керівництва стверджують, що наші кордони занадто великі, щоб їх захищати, і пропонують відновити Ліняш-ди-Торриш-Ведраш (Linhas de Torres Vedras), переобладнавши старі укріплення для сучасної війни. У випадку, якщо ворог порушить наші лінії, ми відступимо до Лісабону, дотримуючись тієї ж стратегії, яка добре послужила нам проти французького вторгнення під час Наполеонівських війн."
 POR_revert_the_local_autonomy_policies_desc:0 "After the Rebellion of Manufahi in 1911, our colonial policy has shifted back towards using indigenous rulers as figureheads, abandoning prior attempts for further integration of the region. Perhaps we should revert this, and embrace the multiculturalism of our state."
 POR_the_empire_of_brazil_potential_civil_war_tt:0 "§RЯкщо §YБразилія§! НЕ є §Yнейтральною§! та має менш ніж §Y50% стабільності§! або §Y70% нейтралітету§! на момент завершення цього фокусу, бразильські монархісти почнуть громадянську війну та втягнуть нас у неї!§!"
 POR_the_iberian_socialist_union_cosmetic_name_tt:0 "§YПортугалія§! буде відома як §YІберійський соціалістичний союз§!."
 POR_workers_of_iberia_unite_civil_war_tt:0 "§RПрихильники §Yнейтралітету§! почнуть громадянську війну!§!"
 POSITIONING_SURFACE_DETECTION_SUPERIORITY:0 "Бонус до поверхневого виявлення: $NUM|+%$"
 PRC_BLITZKRIEG_DESC:0 "Зіткнувшись із тотальним японським нападом, націоналісти та комуністи уклали непросте перемир'я. Обидві сторони добре усвідомлюють, що цей Об'єднаний фронт не може тривати довго. Територія комуністичної бази в Яньані тепер формує лінію фронту у війні проти японців.\n\nКомуністи мусять ретельно використовувати свої ресурси, якщо вони хочуть вижити. Будь-які втрати, завдані в боротьбі проти Японії, будуть відчуватися двічі, коли настане час вести війну проти націоналістів, і це цілком може бути те, на що розраховує уряд Чана Кайші..."
 PRC_CSCEC_mils_desc:0 "Ми закликатимемо CSCEC спеціалізуватися на військовому будівництві та використовувати всі засоби для досягнення цієї мети. Нам потрібно покращити наше військове виробництво, щоб мати шанс у найближчі роки."
 PRC_army_doctrines_mobile_warfare_tt:0 "За наявність §Y$GRAND_DOCTRINE_MOBILE_WARFARE$§!:"
 PRC_ballistic_missile_equipment_2_short:0 "DF-2"
 PRC_coalition_government_desc:0 "Нехай до об'єднання нашої країни ще далеко, спільний уряд за участю націоналістів зробить цю перспективу реалістичнішою."
 PRC_currently_rooting_out_guerilla_sympathizers:0 "Наразі викорінює співчуваючих партизанам"
 PRC_establish_pla_air_force_desc:0 "У міру того, як ми розширюємося з нашої гірської фортеці та захоплюємо все більше низовин, ми стаємо більш вразливими до атак з повітря. На щастя, під час нашої експансії ми також досягли промислової потужності, необхідної для того, щоб щось із цим зробити, і ми негайно усунемо цю вразливість, створивши власні військово-повітряні сили."
 PRC_establish_yanan_university:0 "Заснувати Яньаньський університет"
 PRC_heavy_tank_artillery_equipment_1:0 "PLZ 34 D"
 PRC_increase_domestic_production_capacity_desc:0 "Хоча нам вдалося розширити свій вплив обмеженими засобами, настав час інвестувати у нашу військову промисловість. Якби ми зазнали ще однієї тривалої війни, наше накопичене спорядження врешті-решт було б вичерпано або потребувало б ремонту, і неможливість запропонувати заміну стала б катастрофічною."
 PRC_initialize_shorter_market_plans_tt:0 "§RНевиконання промислових цілей до кінцевого терміну плану призведе до великих штрафів для вашої економічної ефективності, що відображатиме втрату довіри до центрального планування.§!\n\n§YВсього фабрик, необхідних для досягнення цілей:\n[GetShorterMarketPlansGoalCivFactoriesText] цивільних фабрик\n[GetShorterMarketPlansGoalMilFactoriesText] військових заводів§!"
