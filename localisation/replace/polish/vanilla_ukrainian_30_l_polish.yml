 USA_democratic_socialism_desc:0 "Жоден розсудлива людина не стане сперечатися з тим, що соціалізм є майбутнім людства. У той же час жоден гордий патріот нашої республіки не підтримає систему, де уряд не створений народом і для народу. Подібно до наших батьків-засновників, ми створимо нову форму правління, що поєднує обидві ці системи."
