 AST_diplomatic_events.38.b:0 "Ми не можемо давати порожні обіцянки."
 AST_diplomatic_events.48.a:0 "Це знаменує собою новий етап у наших відносинах."
 AST_diplomatic_events.52.t:0 "Власний тихоокеанський гарнізон Австралії"
 AST_diplomatic_events.55.desc:0 "[ENG.GetNameDefCap] відхиляє австралійську допомогу в Африці і сама займеться питанням Вішістської Франції. Проте наші амбіції не так легко відхилити.\n\nАвстралійський контроль над африканськими територіями Вішістської Франції зробить нас рівнею Британській Співдружності, а не її підлеглим. Ми повинні переслідувати їх попри бажання [ENG.GetNameDef], хоча це і доведеться робити силою."
 AST_diplomatic_events.58.desc:0 "Вішістська Франція відмовляється передавати нам африканські території. Втім, це було не прохання, а вимога.\n\nМи будемо домагатися контролю над регіоном, у якому вони нам відмовили, хоча це доведеться робити силою."
 AST_election_countdown:0 "Відлік до виборів"
 AST_empower_the_workers:0 "Наділити робітників великими правами"
 AST_expand_northern_presence_desc:0 "Оскільки більшість міст розташовані на східному і західному узбережжях острова, північні кордони Австралії погано захищені від можливої висадки десанту або нападу. Було б непогано звести там військові споруди."
