 SEA_warlords.38.desc:0 "Побоюючись, що ми знищимо їхню провінцію в процесі вигнання [GXC.GetLeader], вони натомість запропонували стати частиною нашої республіки в обмін на помилування всіх лідерів і збереження їхніх посад. Це здається справедливим компромісом."
 SEA_warlords.53.a:0 "Ми знайдемо цьому гарне застосування"
