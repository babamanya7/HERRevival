 FIN_a_new_course_for_kokoomus_desc:0 "Останні події призвели до зростання підтримки Національної коаліції, оскільки люди шукають сильного, розумного лідерства та повернення до традиційних цінностей. Ми повинні скористатися цим, просуваючи консервативну програму партії."
 FIN_appeal_to_the_finnish_spirit_desc:0 "Ми повинні звернутись до надзвичайної рішучості, стійкості та витривалості фінів перед обличчям труднощів. Фінський народ має працювати разом, щоб перемогти всупереч усім. Наш sisu робить нас сильними!"
