 EQUIPMENT_CAS:0 "Штурмовик"
 EQUIPMENT_DESIGNER_DUPLICATE_DESC:0 "§HЗберегти як новий§!\nПри збережені цього дизайну §Hбезкоштовно§! буде створений новий дизайн. Первісний дизайн лишиться незміненим і Ви зможете використовувати його після створення нового дизайну."
