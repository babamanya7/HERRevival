 germany.101.d:0 "Відсутність підходящих союзників ставить Німеччину в невдалу стратегічну позицію в Східному Середземномор'ї. Однак, ми можемо змінити це, надіславши вимоги Греції про надання баз і навколишніх територій для їхньої оборони."
 germany.1042.desc_default:0 "[ROOT.GetAdjectiveCap]а міць не знає меж. Нам було передано території Судетської області, первісно в [FROM.GetAdjective]ій сфері впливу. [FROM.GetNameDefCap] залишається поза нашим поглядом. Поки що."
 germany.113.t:0 "Німеччина офіційно заявила про претензії на Данциг"
 germany.21.t:0 "Румунія незадоволена нашим рішенням"
 germany.25.a:0 "Ми дамо йому роботу."
 germany.47.d:0 "Нещодавно в Мюнхені були проведені переговори між лідерами Британії, Франції, Італії та Німеччини про обговорення майбутнього Чехословаччини. Британія та Франція відмовили нам у наших законних претензіях на Судети, і вони ще й пригрозили нам війною, якщо ми «порушимо» кордони з Чехословаччиною!\n\nУже розроблено план вторгнення в Чехословаччину, але це, ймовірно, призведе до всеєвропейської війни. Ми мусимо запевнитися, що ми готові до цього."
 germany.5.d:0 "Німеччина пропонує підписати пакт, щоби привернути увагу до мети Комінтерну про світове поширення комунізму з використанням диверсій і насильства. Підписавши цей пакт, ми погодимося ділитися розвідданими про комуністичну загрозу та діяти в тісній співпраці проти неї."
 germany.67.t:0 "Франція поступається"
 germany.68.d:0 "Французи вперто наполягають на своєму, виступаючи самі проти німців, тож наш альянс із ними був скасований. Ще одна війна в Європі розпочалася через безглузді причини. Схоже, що настав час Британії знову відсторонитися від справ на континенті..."
 germany.81.a:0 "Німеччина знову єдина."
