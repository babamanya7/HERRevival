 RULE_ALLOW_PARTY_BOOSTING_PLAYER_ONLY_DESC:0 "Держави можуть збільшувати популярність партії лише в державах, керованих гравцем."
 RULE_ALLOW_RELEASE_NATIONS_NOT_RAJ_TOOLTIP:0 "§Y[RAJ.GetName]§! може звільнити цю країну тільки виконваши фокус §Y$RAJ_a_secular_state$§!, §Y$RAJ_incorporation_of_the_east_india_company$§!, §Y$RAJ_hindutva$§!, §Y$RAJ_netaji$§! або завершивши §Yподіл§!."
 RULE_ALLOW_WARGOALS_FREE_25_DESC:0 "Виправдання цілей війни вимкнене при менш ніж 25% світової напруженості, але доступне для всіх держав при більшому рівні. Обмеження за ідеологіями не враховуються, але отримання цілей за національними фокусами досі доступне."
 RULE_DEMOCRATIC_ALTERNATE_SAF_AI_DESC:0 "§HПівденноафриканський§! ШІ намагатиметься зберегти демократичний уряд і відігравати більш напористу роль у відносинах із материнською країною, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_FASCIST_RAJ_AI_DESC:0 "§HІндійський§! ШІ намагатиметься отримати свою незалежність крізь союз із фашистськими країнами, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_ALT_FASCIST_GRANDI:0 "Альтернативний фашизм — Діно Гранді"
 RULE_OPTION_AMERICAS_DECOLONIZED_DESC:0 "Усі доступні для звільнення колонізовані нації в Америці будуть створені як вільні та незалежні держави після початку гри."
 RULE_OPTION_CARLIST_DESC:0 "§HКарлісти§! на чолі з Мануелем Фал Конде відхилять фалангізм і забезпечать повернення абсолютистської монархії давнини на чолі з її законним карлістським королем."
 RULE_OPTION_CHL_COMMUNIST_AI_DESC:0 "Чилійський ШІ скористається спричиненою фашистами нестабільністю, щоби вимогти відставки Артуро Алессандрі та збільшити повноваження президента, щоби створити комуністичну державу."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION:0 "Комунізм — Балканська федерація"
 RULE_OPTION_COMMUNIST_CZE_AI_DESC:0 "§HЧехословацький§! ШІ намагатиметься реформувати країну в комунізм і вступити в альянс із Радянським Союзом або іншою великою комуністичною державою."
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI:0 "Сходження робітничо-селянської фракції"
 RULE_OPTION_DEMOCRATIC_AFG_AI_DESC:0 "Афганський ШІ змусить короля Захіра-шаха усунути своїх дядьків, перш ніж продовжити шлях радикальних реформ. Це призведе до того, що Афганістан стане демократичною країною і приєднається до союзників."
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT_ENG_AI_DESC:0 "§HБританський§! ШІ намагатиметься зупинити свою політику умиротворення та замінити її на демократичний інтервенціонізм, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_DISPERSE_MILITARY_POWER_AI_DESC:0 "ШІ залишиться нейтральним у світових справах і намагатиметься розвивати свою країну, допоки його не спровокують."
 RULE_OPTION_FASCIST_SEA_DESC:0 "Китайський ШІ спробує піти фашистським шляхом у дереві фокусів."
 RULE_OPTION_FOCUSES_ONLY_39:0 "Лише за фокусами (до 1939 р.)"
 RULE_OPTION_HISTORICAL_PER_AI_DESC:0 "ШІ буде проводити політичні реформи та зміцнювати військову потужність країни, перш ніж у країну вторгнуться й той негайно капітулює."
 RULE_OPTION_ICE_FASCIST_AI_DESC:0 "Ісландський ШІ засудить данського короля та спробує створити фашистську імперію в Північному морі."
 RULE_OPTION_ITA_FRAGMENTED_DESC:0 "Обертає назад Рісорджіменто та встановлює такі кордони, які були якраз перед ним."
 RULE_OPTION_MONARCHIST_ORLEANIST:0 "Монархізм: Орлеанська династія"
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC:0 "Маріонетки залишають усі бали мирної конференції, зароблені ними під час війни."
 RULE_OPTION_SOCIAL_CATHOLICISM:0 "Соціал-католицизм"
