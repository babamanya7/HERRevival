 CHL_political_events.65.desc:0 "Диктатор [FROM.GetNameDef], [From.GetLeader], мав нахабство здійснити великий напад на наші сили в [311.GetName] з найближчих позицій. Їхня операція була успішною, і наші війська відступають у замішанні. [FROM.GetAdjective]s не перетинають наші інші території, тому це не було прелюдією до загального вторгнення, але напад послабив нашу здатність проектувати силу по всьому світу та принизив нас на міжнародній арені."
