 RAJ_the_government_of_india_act_desc:0 "Акт про уряд Індії відкрив двері для більшого самоврядування в наших провінціях. Делегуючи більше повноважень місцевим міністерствам, ми можемо заспокоїти помірковані голоси та зміцнити адміністративну ефективність, водночас міцно тримаючи руку Імперії на кермі."
 RAJ_the_ledo_road_desc:0 "Прокладена через пересічену місцевість, Дорога Ледо є критично важливим маршрутом постачання, що з'єднує Індію із силами Союзників у Китаї. Завершення та забезпечення цієї життєво важливої артерії гарантує потік військ, ресурсів та обладнання, необхідних для перелому ситуації у Південно-Східній Азії."
