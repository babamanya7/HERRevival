 SUBDOCTRINE_DEEP_BATTLE_DESC:0 "Дальність і ударна міць сучасної зброї дозволяють подолати ворожу систему оборони шляхом одночасного удару на всю її глибину, використовуючи всю наявну у нашому розпорядженні зброю."
