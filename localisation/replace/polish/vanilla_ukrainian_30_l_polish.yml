 SEA_PHI_political_events.41.a:0 "Незалежність стає дедалі ближчою."
 SEA_PHI_political_events.48.desc:0 "Раніше сьогодні ми отримали повідомлення про порушення в [FROM.GetNameDef]. Після цього ми отримали декларацію незалежності від їхнього уряду; хоча вони явно намагаються переконати нас не втручатися, вони чітко дали зрозуміти, що не ухилятимуться від боротьби за збереження своєї нової незалежності."
 SEA_PHI_political_events.71.t:0 "[FROM.GetName] відмовляється від об'єднання"
 SEA_PRC_faction_events.22.desc:0 "У нещодавній промові [ROOT.GetLeader] розкритикував лідерство [?PRC_faction_leader_var.GetName] у [ROOT.GetFactionName], що сподобалося не всім учасникам саміту фракції. [FROM.GetLeader] з [FROM.GetName] відкрито вилаяв [ROOT.GetLeader] за спробу послабити [ROOT.GetFactionName] і налаштувати його членів один проти одного."
 SEA_PRC_faction_events.40.b:0 "Ми прокладемо власний шлях уперед"
 SEA_PRC_faction_events.82.desc:0 "[FROM.GetName] прийняв наш ультиматум. Їхні лідери говорять про національну єдність та історичну долю, але зміст зрозумілий — тепер вони визнають верховенство [ROOT.GetNameDef].\nХоча їхнє підкорення може бути неохочим, воно рятує Китай від подальшого розколу та кровопролиття."
 SEA_PRC_faction_events.90.desc:0 "У світлі поточної агресії, з якою ми обидва стикаємося, [FROM.GetNameDef] прагне приєднатися до нашої справи. Це означало б прийняти їх та всіх членів фракції [FROM.GetFactionName]."
 SEA_PRC_fourth_army_incident.2.t:0 "[FROM.GetNameDefCap] прагне знизити напругу"
 SEA_PRC_misc_events.17.t:0 "[FROM.GetNameDefCap] відмовляється"
 SEA_PRC_misc_events.19.d:0 "[FROM.GetNameDefCap] передає все"
 SEA_PRC_misc_events.5.a:0 "Нарешті! Нам знадобиться його досвід"
 SEA_PRC_political_events.1.b:0 "Нехай веде $PRC_bo_gu$"
 SEA_PRC_political_events.13.a:0 "Відчайдуні часи вимагають відчайдушних заходів..."
 SEA_PRC_political_events.19.t:0 "Деякі наші генерали перейшли на інший бік!"
 SEA_china.11.t:0 "[FROM.GetNameDefCap] підтримує наш вступ"
 SEA_china.13.t:0 "[CHI.GetLeader] вбитий"
 SEA_china.16.desc:0 "Намагаючись задобрити нас, щоб ми не нападали, [From.GetName] надав нам права на якірну стоянку. Квантунська армія вирішила поки що відступити."
 SEA_china.19_tt:0 "§RМи приєднаємося до війни Китаю проти Японії!§!"
 SEA_china.22.desc:0 "Пекін подвоює ставки. Кабінет міністрів обговорює, як відповісти на цей зростаючий тиск: чи завдати удару у відповідь ембарго, яке може перевернути торгівлю, чи повністю звільнити [CHI.GetName] від його зобов'язань."
 SEA_china.22.t:0 "[CHI.GetName] тисне на питання"
 SEA_china.25.a:0 "$morozov_design_bureau$"
 SEA_china.25.desc:0 "[FROM.GetNameDefCap] звернувся до нас із проханням надіслати фахівців з наших бронетанкових підрозділів для підтримки їхнього переходу до більш сучасного стилю ведення війни. Ми можемо надіслати групу радників від одного з наших головних виробників або відхилити їхній запит."
 SEA_china.28.a:0 "У нас немає вибору"
 SEA_china.29.b:0 "We can't afford to lose him..."
 SEA_china.8.t:0 "[FROM.GetName] приймає запрошення"
 SEA_china.9.desc:0 "[FROM.GetLeader] відмовився приєднатися до нашого альянсу, посилаючись на необхідність збереження регіональної незалежності та політичної автономії. Хоча це прикро, це рішення відображає стійкі розбіжності всередині країни."
 SEA_china_democratic.1.c:0 "Сун Цінлін — ідеальний лідер"
 SEA_china_democratic.13.b:0 "Їм доведеться самим дбати про свою економіку"
 SEA_imperial_influence_events.160.t:0 "Фракція Армії вимагає збільшення виробництва танків"
 SEA_imperial_influence_events.210.desc:0 "Флот висунув свої вимоги. Схоже, вони прагнуть розширити свої виробничі можливості та свій вплив на [GetImperialInfluenceRulerTitle], і тому вимагають, щоб ми будували більше морських верфей для збільшення випуску продукції. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_imperial_influence_events.460.desc:0 "Лідери партії висунули свої вимоги. Схоже, вони засмучені зростаючою силою та впливом Дзайбацу на [GetImperialInfluenceRulerTitle] і бажають швидких дій для обмеження їхнього зростання та влади. Здається, вони готові проявити трохи терпіння, але не чекатимуть вічно."
 SEA_japan_foreign_policy.100.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із пропозицією приєднатися до валютного союзу з ними, що лише зміцнить економіки обох наших країн. Звучить як пропозиція, від якої неможливо відмовитися, чи не так?"
 SEA_japan_foreign_policy.104.t:0 "[FROM.GetNameDefCap] приймає нашу пропозицію"
 SEA_japan_foreign_policy.11.a:0 "Великий день для [ROOT.GetAdjective]ого народу"
 SEA_japan_foreign_policy.118.desc:0 "Делегація здалеку нещодавно прибула до нашої столиці, шукаючи аудієнції у [ROOT.GetLeader]. Вони заявляють, що представляють [FROM.GetNameDef], і прагнуть укласти альянс між нашими державами. Чи погодимося ми?"
 SEA_japan_foreign_policy.129.a:0 "Блискуче"
 SEA_japan_foreign_policy.26.b:0 "Дайте їм відсіч!"
 SEA_japan_foreign_policy.26.t:0 "Переворот «Силача»"
 SEA_japan_foreign_policy.31.desc:0 "Сили, що належать [MEN.GetNameDef] та Армії праведності Великої Хань, атакували наші позиції в Суйюані і, схоже, мають намір захопити аймаки Внутрішньої Монголії, що перебувають у нашому володінні. Ми не можемо дозволити їм пройти!"
 SEA_japan_foreign_policy.31.t:0 "Прояпонські сили штурмують наші позиції!"
 SEA_japan_foreign_policy.35.desc:0 "Різні радіостанції на західному узбережжі почали транслювати [FROM.GetAdjective]у пропаганду, щоб схилити наше населення на свій бік у конфлікті за Азію. Ми повинні закрити це, поки воно не завдало занадто великої шкоди!"
 SEA_japan_foreign_policy.41.b:0 "Було б розумно почекати з нашим рішенням"
 SEA_japan_foreign_policy.44.a:0 "З цим нічого не поробиш"
 SEA_japan_foreign_policy.7.desc:0 "Не сприймаючи «ні» як відповідь, [FROM.GetAdjective]і війська були помічені під час підготовки до швидкого вторгнення в нашу країну, ймовірно, маючи намір швидко увійти і підкорити нас, втягнувши у свою сферу впливу. Ймовірно, це останній шанс уникнути конфлікту, але питання залишається відкритим. Чи скористаємося ми ним?"
 SEA_japan_foreign_policy.91.t:0 "[FROM.GetAdjective]а влада відхиляє угоду про промислову торгівлю"
 SEA_japan_foreign_policy.92.a:0 "Зв'язки можна зміцнити через торгівлю"
 SEA_japan_popup_events.17.a:0 "Події набирають обертів..."
 SEA_japan_popup_events.18.b:0 "Ми повинні гарантувати, що вони не захоплять контроль над Промисловим поясом!"
 SEA_japan_popup_events.29.a:0 "Революція нарешті почалася!"
 SEA_japan_popup_events.31.a:0 "Сандзо Носака має популярність"
 SEA_japan_popup_events.38.a:0 "За пролетаріат!"
 SEA_japan_popup_events.38.b:0 "Ми повинні зупинити це божевілля!"
