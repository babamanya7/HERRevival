 more_equipment_civil_war_tt:0 "На початку страйку §Yселяни§! отримають більше оснащення."
 mountaineers2_bonus:0 "Бонус до гірської піхоти II"
 mountaineers_1_reward_5:0 "$mountaineers_keystone_1$"
 mountaineers_keystone_1_desc:0 "Успіх наших елітних сил спеціального призначення вимагає реорганізації нашої військової філософії навколо їхньої присутності."
 mtg_britain.100.d:0 "[From.GetAdjective] уряд знову запропонував створити федеральну державу, яка охопить всю Британську імперію, у всіх членів якої буде право голосу у зовнішній та внутрішній політиці. Уряд стверджує, що це буде життєздатною альтернативою системі автономій і у в результаті принесе нам повну незалежність."
 mtg_britain.107.t:0 "[From.GetName] підкоряється умовам договору"
 mtg_britain.12.a:0 "Відмінний сюжет для роману."
 mtg_britain.13.t:0 "Едуард VIII виступає по радіо"
 mtg_britain.15_tt:0 "Якщо Едуард VIII не передумає, ми здобудемо незалежність і вийдемо з Союзників.\n"
 mtg_britain.18.t:0 "Шлях до незалежності домініонів"
 mtg_britain.25.t:0 "Зближення між Німеччиною та Великою Британією"
 mtg_britain.26.d:0 "[From.GetNameDefCap] повідомляє, що вона вирішила не переривати дипломатичні відносини з державою [ITA.GetNameDef]."
 mtg_britain.37.d:0 "[From.GetNameDefCap] повідомляє, що наша пропозиція заінтригувала її, і вона відповідає згодою. Ми об'єднаємося з нашими ідеологічними союзниками і разом зустрінемо загрози зовнішнього світу."
 mtg_britain.39.t:0 "[From.GetName] залишає нас"
 mtg_britain.40.b:0 "Ми так не думаємо."
 mtg_britain.48.a:0 "Тоді це війна."
 mtg_britain.48.d:0 "[From.GetNameDefCap] відкидає наші вимоги щодо деколонізації."
 mtg_britain.63.a:0 "Та як вони посміли!"
 mtg_britain.68.a:0 "Ми висловлюємо крайнє несхвалення."
 mtg_britain.68.t:0 "Комунізм у Канаді"
 mtg_britain.94.a:0 "Вони користуються нашим багатством!"
 mtg_exile_leader_added.1.desc:0 "Після довгої і небезпечної подорожі через утримувану ворогом територію і кілька нейтральних країн [From.GetName] нарешті прибув до столиці. Після невеликого відпочинку лідер [From.GetSheHe] запропонував свою допомогу в нашій.\n\nСудячи з повідомлень, [From.GetSheHe] «прагне повернутися до свого звичайного заняття — вбивств і руйнувань»."
 mtg_netherlands.13.b:0 "Такого «компромісу» недостатньо."
 mtg_netherlands.19.b:0 "Нам це не цікаво."
 mtg_netherlands.43.d:0 "[From.GetNameDefCap] відмовляється ділитися з нами своїми військовими знаннями."
 mtg_netherlands.53.t:0 "Принц Бернард видобуває погані розвіддані"
 mtg_netherlands.54.d:0 "Коли мова на нещодавній нараді штабу зайшла про недостатній опір на нашій окупованій центральній території, принц Бернард, схоже, вважав це питанням особистого характеру. Він уже готується до парашутної висадки за лінією фронту."
 mtg_netherlands.58.t:0 "Принц Бернард викликає дипломатичний скандал"
 mtg_netherlands.6.a:0 "У нас немає іншого вибору, крім як погодитися з [VEN.GetAdjective] пропозицією."
 mtg_news.10.a:0 "Тоді ми будемо змушені також оголосити їм блокаду."
 mtg_news.15.b:0 "Закінчилася епоха."
 mtg_news.54.b:0 "Союз росте."
 mtg_news.55.t:0 "Короля Едуарда вбито"
 mtg_news.62.desc:0 "Представники урядів Домініону сьогодні оголосили, що в односторонньому порядку розривають зв'язки з Короною. Головною причиною цього вони називають явну зневагу короля до думок і побажань урядів Домініону. Криза, викликана наміром короля одружитися з Уолліс Сімпсон, до утворення нової Співдружності націй із різними домініонами. Очевидно, нинішній параліч британського уряду перешкоджатиме будь-яким діям у відповідь Корони. Безсумнівно, на це і сподівалися домініони."
 mtg_news.7.d:0 "Майбутнє демократії стає ще більш невизначеним."
 mtg_tank_landing_craft_desc:0 "$tank_landing_craft_desc$"
 mtg_usa_canadian_corridor.1.t:0 "Канадський коридор"
 mtg_usa_civil_war_democrats.11.desc:0 "У ході недавніх маршів та демонстрацій проти політики президента [USA.GetLeader] безліч протестувальників відкрито носили зброю і пов'язки на руках, що позначають їхню приналежність до руху «Громадянське ополчення», що швидко набирає силу. Коли проти них виступила поліція, протестувальники заявили, що вони лише здійснюють свої права згідно з Другою поправкою, але ФБР виявило, що це не просто приватні особи, які володіють зброєю.\n\nІнформатори повідомили про те, що ці групи проводять регулярні збори та намагаються отримати доступ до посібників з тренування піхоти."
 mtg_usa_civil_war_democrats.14.desc:0 "Надходять повідомлення про масові страйки на всій території США, до яких закликають різні профспілки. Продовжують працювати лише найнеобхідніші служби. У багатьох місцях спостерігаються зіткнення між страйкарями та штрайкбрехерами.\n\nНезвичайно не підвищення зарплат чи інших поступок, а відставки президента [USA.GetLeader]."
 mtg_usa_civil_war_democrats.16.t:0 "Економічна міграція"
 mtg_usa_civil_war_democrats.26.t:0 "Північний Захід заявляє про підтримку уряду"
 mtg_usa_civil_war_democrats.29.desc:0 "Під час добре скоординованого повстання за сприяння місцевих правоохоронців і співчуваючих членів Національної гвардії були повалені уряди Дакоти, Айови, Міннесоти та Небраски. Поспішно обрані тимчасові урядники."
 mtg_usa_civil_war_democrats.41.t:0 "[USA.GetLeader] отримує виклик від Вільяма Дадлі Пеллі"
 mtg_usa_civil_war_fascists.14.t:0 "Солдати дезертують"
 mtg_usa_civil_war_fascists.201.desc:0 "Зайнявши території так званої держави [CSA_liberated_state.GetName], наші війська зустріли велику кількість громадян, налаштованих доброзичливо та бажаючих допомагати нам. У патріотичному пориві вони заявили про те, що готові вступити до нашої армії."
 mtg_usa_congress_large_support_tt:0 "До §Y30 сенаторів§! і §Y125 представників§! §Gпідтримають§! уряд.\n"
 mtg_usa_foreign_support.3.desc:0 "Наша делегація, яку ми відправили до держави [From.GetNameDef], не досягла особливого успіху, виступаючи перед порожніми залами і майже не маючи можливості зустрітися з політичними лідерами. Вона повернулася з порожніми руками."
 mtg_usa_foreign_support.6.desc:0 "Наші спроби роздобути нову зброю в державі [From.GetNameDef] зустріли грубу відсіч. [From.GetLeader] заявив, що його уряд ніколи не дозволить бездумно витрачати ресурси [From.GetAdjective] народу на таку дурницю."
 mtg_usa_north_american_dominion.3.desc:0 "[From.GetLeader] відповів на нашу дипломатичну ноту з висловом непідробної заклопотаності. Він заявив, що [From.GetNameDef] пишається довгою історією незалежності та суверенітету і ніколи не дозволить якійсь державі нав'язувати .\n\nВін також попросив президента, лідера [USA.GetLeader], замислитися про наслідки війни з цього приводу, внаслідок чого держава [USA.GetNameDef] буде визнана найбільшою загрозою миру з непередбачуваними наслідками."
 mtg_usa_secure_asia.4.desc:0 "На нещодавній прес-конференції президент [USA.GetLeader] оголосив про новий стратегічний погляд на Індокитай та на Південно-Східну Азію загалом. Його уряд більше не зазнає вакууму влади в цьому регіоні. Хто б не контролював Індонезію, зрозуміло, що цей вплив є надто слабким, щоби забезпечити [USA.GetAdjective] інтереси в цьому регіоні. Його уряд має намір взяти кермо влади у свої руки. \n\nКоли [This.GetLeader] викликав [USA.GetAdjective] посла для пояснень, той передав ноту, в якій докладно описується [USA.GetAdjective] позиція — вимога передати острова Індонезії під [USA.GetAdjective] контроль."
 mughal_west_britain_company_dec:0 "Інкорпорувати Компанію Західної Британії"
 multialtitude_flying_desc:0 "Повітряний бій відбувається у трьох вимірах, але більшості пілотів важко відстежувати літаки, що знаходяться під або над ними. Ми можемо скористатися цією особливістю, розташувавши наші бойові порядки по вертикалі."
 mutiny_event.3.a:0 "Good speech."
 nation_building:0 "Будівництво нації в державі [From.GetNameDef]"
 natural_harbor:0 "§YПриродна гавань§!"
 nav_bomber_equipment_2_desc:0 "Поліпшена аеродинаміка та нові двигуни помітно підвищують швидкість та бойову ефективність морської авіації."
 nav_bomber_equipment_3_short:0 "Морськ. бомбардувальник III"
 naval_blockade_initiator_desc:0 "$COUNTRY|UY$ вводить морську блокаду проти інших країн."
 naval_mines:0 "Технології мінної війни"
 neo_mesopotamia_fascism:0 "Неомесопотамська імперія"
 news.10.a:0 "Цікаво."
 news.107.d:0 "Добре укріплене місто Севастополь, основна база радянського флоту на Чорному морі, упало під натиском німецьких військ.\n\nПісля такої втрати СРСР буде набагато складніше утриматися в цьому регіоні, тому взяття Севастополя стало великою перемогою Німеччини.\n\nУ Берліні вже видано указ про перейменування міста на Теодоріхсхафен на честь Теодоріха Великого."
 news.108.d:0 "Сьогодні німецькі війська зайняли Баку, який був важливим стратегічним об'єктом Радянського Союзу.\n\nМісто, розташоване на березі Каспійського моря, — це ключ до Кавказу, а його нафтові родовища стануть для німців у пригоді на війні.\n\nЗ його захопленням для Німеччини відкривається шлях на Середній Схід і навіть до Індії."
 news.108.t:0 "Падіння Баку"
 news.150.t:0 "Переворот у Югославії"
 news.157.a_usa:0 "Ми їм покажемо."
 news.167.t:0 "Криза в Словенії"
 news.169.d_puppet_CRO_YUG:0 "Нещодавні територіальні втрати спричинили розділ югославської держави, за яким послідували етнічний конфлікт та послаблення центральної влади. Німеччина вирішила розділити решту між сербською та хорватською державою, які знаходяться під їхнім керівництвом"
 news.17.a:0 "Цікаво..."
 news.170.f:0 "Який сором."
 news.173.t:0 "Четвертий інтернаціонал"
 news.175.d:0 "Нагадавши про угоди, укладені під час Великої війни, Франція запропонувала Британії об'єднатися в альянс проти сил, що загрожують стабільності Європи.\n\nСьогодні це прохання було схвалено британським парламентом, і Франція приєдналася до альянсу [ENG.GetFactionName]."
 news.177.d:0 "Намагаючися створити єдиний фронт проти спільних ворогів, держава [From.GetName] звертається до Чехословаччини з пропозицією об'єднатися в «Малій Антанті» і цим порушити домовленості, укладені з Британією у Велику війну. Незважаючи на те, що Британії запропонували місце в оборонному альянсі, прем'єр-міністр країни заявив, що вона не розглядає його як «корисний для захисту європейських свобод».\n\nТим не менш, Франція налагодила відносини з державами, які вважають себе вразливими, і закликає об'єднатися, щоб підтримати дипломатичний баланс у Європі та запобігти війнам. Час покаже, наскільки успішною буде ця спроба."
 news.188.t:0 "[ITA.GetName] прагне примирення з державою [TUR.GetName]"
 news.19.a:0 "І знову мапи застаріли."
 news.212.a:0 "Це зробить нас усіх сильнішими."
 news.226.t:0 "[ENG.GetNameDefCap] впливає на державу [GRE.GetNameDef]"
 news.227.a:0 "Ми в країні Фледермауса."
 news.236.d:0 "Вважаючи спільну перемогу над [GER.GetNameDef] неминучою, [yalta_origin.GetNameDef] та [yalta_partner.GetNameDef] прагнуть забезпечити майбутню стабільність в Європі. [yalta_origin.GetLeader], [yalta_partner.GetLeader] та лідери інших країн, що беруть участь у військових діях, зустрілися, щоб домовитися про долю [GER.GetNameDef].\n\nДні переговорів привели до створення нової карти Європи. Цей новий європейський порядок розділений між Сходом і Заходом раною, яка ось-ось пройде посередині [GER.GetNameDef].\n\nЗалишається тільки з'ясувати, чи дійсно це призведе до тривалого миру в Європі."
 news.24.d:0 "У своїй палкій промові, вимовленій сьогодні перед Райхстагом, [GER.GetLeader] викривав польське ставлення до німців, які населяють Данциг і Польський коридор.\n\n[GER.GetLeader] стверджував, що німецька меншина піддається в Польщі «найжахливішим переслідуванням», і висловив позицію свого уряду:\n«Данциг був і лишається німецьким! Коридор був і лишається німецьким! Без німців ці східні області занурилися б у вир варварства»."
 news.243.t:0 "[AST.GetNameDefCap] та [JAP.GetNameDef] оголошують альянс"
 news.247.d:0 "Після швидких переговорів [CAN.GetNameDef] оголосив, що став членом-підписантом [GER.GetFactionName]. [CAN.GetAdjective]ий уряд проголосив себе «гордим захисником [GER.GetAdjective]ого народу, так само як [GER.GetNameDef] буде захисником [CAN.GetAdjective]ого».\n\nХоча деталі вступу держави [CAN.GetNameDef] до пакту невідомі, здається ймовірним, що бойові дії проти ворогів [GER.GetNameDef] будуть розпочаті найближчим часом. Це цілком може стати вирішальним моментом у військових діях."
 news.252.b:0 "Ми є тією вагою, яка підтримує баланс сил."
 news.272.a:0 "Жах."
 news.273.desc:0 "Після місяців відносної бездіяльності колоніальний уряд та індійська армія нарешті вирішили діяти. До постраждалих районів почали надходити надзвичайні запаси продовольства, а новий врожай рису перевищив очікування.\n\nЦіни на продукти харчування в постраждалих районах залишаються високими, і довгострокові наслідки голоду поки що не можуть бути оцінені."
 news.289.a:0 "Разом ми сильніші."
 news.289.b:0 "Вони шукають силу в кількості."
 news.29.d:0 "Група офіцерів Вермахту, що виступала проти війни, здійснила в Берліні замах на життя Гітлера. Озброєні люди увірвалися в Райхсканцелярію і ліквідували фюрера після відчайдушної перестрілки з його охоронцями з SS. Змовники, які вижили, були заарештовані Гестапо, і сьогодні вранці Герман Гьорінг склав присягу як новий фюрер Третього Райху.\n\nУ своїй промові перед Райхстагом Гьорінг звинуватив Велику Британію і Францію в організації вбивства Гітлера і заявив, що Німеччина не знатиме спокою, поки не знищить обидві ці держави."
 news.310.desc.a:0 "Після тривалих роздумів [From.GetAdjective]ий уряд на чолі з [From.GetLeader] вирішив задовольнити вимоги [HUN.GetAdjective]. Вони прийняли [HUN.GetAdjective]ий контроль над Словаччиною, вважаючи за краще заспокоїти [HUN.GetLeader] заради збереження миру. Безсумнівно, це посилить рішучість [HUN.GetAdjective]ої влади в майбутніх відносинах з їхніми ослабленими сусідами."
 news.310.desc.b:0 "Після тривалих роздумів словаки вирішили поступитися [HUN.GetAdjective]им вимогам. Не бачачи альтернативи, вони розлучилися зі своєю незалежністю, щоб зберегти життя свого народу. Безсумнівно, це зміцнить [HUN.GetAdjective]у рішучість у майбутніх відносинах зі своїми ослабленими сусідами."
 news.316.t:0 "Польсько-румунський альянс"
 news.318.c:0 "Тривожний розвиток подій."
 news.320.t:0 "Югославія відхиляє румунські вимоги"
 news.332.c:0 "Як вони сміють?!"
 news.64.d:0 "Після падіння останнього оплоту республіканців громадянська війна в Іспанії завершилася.\n\nНаціоналісти здобули перемогу, і для Іспанії почалася нова ера.\n\nКраїна сильно постраждала в ході війни, її доведеться відбудовувати."
 news.9.c:0 "Усього лише тактичний відступ."
 nsb_coup.0.desc:0 "Не секрет, що деякі з наших генералів незадоволені становищем у державі [Root.GetNameDef], але зараз, схоже, частина з них почала обмірковувати радикальніші способи залагодження наших розбіжностей. Вже проводяться зустрічі в різних кабінетах — імовірно, в області [?.Root.meeting_location.GetName].\n\nПодробиці мізерні, але у нас є причини вважати, що в рядах змовників — [coup_member_1.GetName] і [coup_member_2.GetName]. Ніби як [coup_member_3.GetName] підтримує зв'язок з останнім, хоча точні мотиви їх зустрічей неясні."
 nsb_news.10.g:0 "Можливо, [SOV.GetLeader] з тих, з ким простіше домовитися."
 nsb_news.11.b:0 "О ні!"
 nsb_news.11.desc:0 "Незважаючи на надзвичайно потужний апарат особистої охорони, лідер держави [SOV.GetNameDef] $SOV_iosif_stalin$ був знайдений на своїй дачі мертвим. Імовірно, його вбили. [SOV.GetAdjective] столиця вирує від чуток, і схоже, Що управління вже перехопила — принаймні, тимчасово — трійка, якою командує $SOV_lavrenty_beriya$. Новий лідер, щоправда, не користується популярністю, так що поки неясно, чи зможе він утриматися при владі. Берія присягнув знайти тих, хто винен у вбивстві."
 nsb_news.2.t:0 "Оголошено [LIB.GetAdjective] протекторат"
 nsb_news.9.desc_right:0 "У Радянській Росії знову йде боротьба. Цього разу розгорілася не війна більшовиків з білими, а війна між двома ворогуючими угрупованнями в комуністичній партії. [SOS.GetLeader] утримує столицю, тоді як повстанці, яких веде [SOV.GetLeader], влаштувалися навколо міста [SOV.Capital.GetName]. Ходять чутки, що [SOV.GetLeader] та його повстання фінансуються зарубіжними країнами, але підтвердити їх чи спростувати нічим."
 nuke_dropped.13.t:0 "Атомне бомбардування Стокгольма"
 offer_air_base_access_receiver_extended_desc:0 "$COUNTRY2|UY$ має доступ до авіабаз держави $COUNTRY1|Y$"
 operation_infiltrate_civilian_desc:0 "§LУ [From.GetAdjective]ому уряді безліч вразливих місць, через які ми можемо впровадити свого агента. У такому разі ми отримуватимемо цінні відомості про внутрішні процеси держави [From.GetNameDef], а також зможемо в майбутньому використовувати цього агента в операціях проти держави [From.GetNameDef].§!"
 operation_jericho_success_tt:0 "Під час зухвалого бомбардувального нальоту вдалося пробити велику діру в стіні в'язниці. Частина в'язнів зазнала поранень або не змогла втекти, але значній кількості вдалося вирватися на волю, де їх зустрів місцевий рух опору."
 operation_make_resistance_contacts:0 "Зв'язатися зі спротивом"
 operation_mungo:0 "Операція «Мунго»"
 p_dest_bonus:0 "Бонус до доктрини оперативного знищення"
 pak_factories_tt:0 "[RAJ.GetName] має на §Y150%§! більше фабрик, ніж §Y[PAK.GetName]§!\nНаші фабрики: [?var:THIS.num_of_factories]\nПотрібно: [?var:pak_factories] "
 panay_incident.2.d:0 "Канонерський човен США USS Panay сьогодні потрапив під обстріл під час евакуації цивільних осіб у ході конфлікту між державами [JAP.GetName] і [CHI.GetName], хоча на його належність ясно вказували [USA.GetAdjective] прапори Після двох прямих влучень бомб вона пішла на дно, внаслідок чого три громадяни США загинули, а багато людей отримали поранення, які вижили підібрали [USA.GetAdjective] і [ENG.GetAdjective] канонерки, що знаходяться в тому районі.\n\nДержава [JAP.GetNameDef] поспішила заявити, що це був нещасний випадок, і вибачитися, але деякі вважають, що атака була навмисною., приведе до глибокого розколу. Як нам відреагувати?"
 paratroopers:0 "Повітряний десант I"
 patrol_boats_hit_and_run:0 "Вогонь та відхід"
 poland.1.a:0 "Час обернути Вісь із загрози в союзника."
 poland.1301.b:0 "[From.GetFactionName] нас не цікавить."
 poland.19.t:0 "Самогубство Валерія Славека"
 poland.20.desc.c:0 "Скрегіт коліс локомотива на рейках, терпкий запах сажі та смогу в повітрі, їдкий промисловий туман — все це ознаки прогресу. Сьогодні прибути до центрального регіону Польщі — це потрапити у світ індустрії та розвитку. Заводи, дороги, рейки, локомотиви, автомобілі — всім цим урешті-решт володіє Польська держава. Тепер, коли Царство Польське, Велика Польща та Східна Польща пов'язані міцною мережею звичайних та залізниць, Польща нарешті стала єдиним промисловим цілим і чотирирічний план Квятковського можна вважати успішним. Хоча це не означає припинення промислових інвестицій у Польщу, приголомшливий успіх програми індустріалізації забезпечив її мешканцям стабільність і зайнятість. Тепер багато хто готовий зустріти будь-які труднощі, які чекають на Польську державу."
 poland.22.d:0 "Ця війна йде вже досить довго, і навіть підступний [DNZ.GetLeader] бажає укласти мир із державою [POL.GetNameDef]. Тепер, коли під [DNZ.GetAdjective]им контролем знаходиться навіть Гдиня, багато хто турбується, що, продовживши війну з Вільним містом, ми втратимо більше, ніж отримаємо, хоча саме місто неминучо перейде під [GER.GetAdjective]ий контроль, ми не можемо дозволити собі продовжувати цей конфлікт."
 political.11.a:0 "Тільки державним зрадникам є чого боятися."
 political.14.e:0 "Це минеться."
 political.25.a:0 "Просто зграя лицемірів."
