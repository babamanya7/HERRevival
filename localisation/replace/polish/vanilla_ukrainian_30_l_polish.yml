 BUL_cooperation_with_italy:0 "Співпраця з Італією"
 BUL_defy_moscow_desc:0 "Радянський Союз давно виграв від суперництва між балканськими країнами, не вагаючись втручатися в нашу політику, якщо це було в їхніх інтересах. Настав час для нашої [GetFederationOrConfederation] завдати удару до того, як радянський уряд усвідомить, що наш об'єднаний балканський блок в змозі кинути виклик гегемонії Москви."
 BUL_dest_dobrich:0 "Добріч"
 BUL_dominance_in_the_adriatic_sea_claims_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! отримує претензії на будь-яку державу вздовж узбережжя Адріатичного моря, яка не контролюється союзником або суб'єктом."
