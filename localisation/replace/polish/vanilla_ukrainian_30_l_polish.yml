 DELETE_DESIGN_POPUP_TITLE:0 "Видалити дтзайн"
 DEN_advanced_flight_desc:0 "За останні кілька років авіація зазнала стрімкого прогресу, але на нас чекає ще більше інновацій та вдосконалень. Щоб по-справжньому домінувати в небі, ми повинні очолити технологічний прогрес!"
 DEN_bop_occupation_censor_the_media_desc:0 "Ми не можемо дозволити ЗМІ відкрито критикувати [?DEN.DEN_overlord_nation.GetAdjective]і окупаційні сили в цій нестабільній ситуації. Ми повинні обмежити їх у тому, що вони можуть публікувати, щоб не ризикувати тією маленькою свободою, яку ми ще маємо."
 DEN_bop_unban_oppositions_uniforms:0 "£BoP_left_texticon Дозволити політичну форму опозиції"
 DEN_build_motorveje_desc:0 "Останнім часом було багато розмов і навіть певних планів щодо національних автомагістралей. Побудова мережі автобанів сприяла б скороченню часу подорожі по всій країні, а також тісніше зв'язала б країну між собою."
 DEN_civilian_preparations_desc:0 "Незалежно від того, наскільки підготовленим є військовий та промисловий сектор, все це зійде нанівець, якщо рішучість цивільного населення зруйнується, а народ швидко зневіриться в нашій обороні та прагненні до миру. Ми повинні загартувати рішучість у кожному данському серці і зміцнити їхню віру в себе."
