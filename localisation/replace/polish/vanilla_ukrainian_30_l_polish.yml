 ICE_research_cooperation_desc:0 "Саме завдяки співпраці з державами, що стоять на одному рівні з нами, ми можемо краще розвивати технології, які принесуть нам переваги в галузі озброєнь у майбутньому. Ми можемо вчитися у наших шановних партнерів, пропонуючи при цьому хороші і відокремлені полігони для випробувань, далеко від сторонніх очей."
