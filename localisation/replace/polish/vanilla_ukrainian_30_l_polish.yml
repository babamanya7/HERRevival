 SAX_fascism:0 "Саксонська імперія"
 SCREENING_BOX_TOOLTIP:0 "У §Yгрупу прикриття§! входять усі кораблі прикриття — зазвичай легкі крейсери й есмінці. Їхньою задачею є недопустити ворожі кораблі прикриття до §Yбойової лінії§!. Нестача кораблів прикриття дозволить ворожим кораблям прикриття проводити торпедні атаки проти бойової лінії."
