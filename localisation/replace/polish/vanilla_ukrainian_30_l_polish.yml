 AUS_a_safe_harbor_for_dissidents_tt:0 "§YОльга Таратута§!, що надасть (§G+5%§! Підтримки Війни, §R-10%§! Стабільності, §G+10%§! Фактору Війсковозабов'язаного Населення, §G+0.03§! Щоденного приросту популярності Комунізму)"
 AUS_air_force_partnership_big:0 "Широке партнерство ВПС"
 AUS_anschluss_risk_high_tt:0 "Ризик аншлюсу на даний момент §OВисокий§!."
 AUS_antischluss_category_desc:0 "З ремілітаризацією Німеччиною Райнланду, вона показала світу одне — їх майбутня політика буде сповнена мілітаризмом і агресією. Слід сподіватися на краще, готуючись до найгіршого, якщо ми не хочемо стати кормом для німецької машини."
 AUS_austromarxism_focus:0 "Австромарксизм"
