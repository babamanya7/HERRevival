 JAP_revoke_the_peace_preservation_law_desc:0 "Цей мерзенний Закон про збереження миру сприяв створенню Токко, які чинили хаос від імені військових, відколи Окада вперше виступив проти них. Він також блокує демократичний процес, оскільки оголошує поза законом численні демократичні принципи та організації. Настав час віддати свій голос і розірвати цей згубний папірець."
