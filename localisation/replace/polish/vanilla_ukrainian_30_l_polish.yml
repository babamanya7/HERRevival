 FIN_surrender_to_the_soviet_union_desc:0 "Очевидно, що, незважаючи на найсміливіші зусилля нашого солдата, ми не можемо вічно стримувати [SOV.GetAdjective]s. Настав час просити обмеженого миру з нашими ворогами."
