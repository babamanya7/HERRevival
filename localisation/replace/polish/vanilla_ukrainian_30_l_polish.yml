 VIC_modernize_the_airforce_desc:0 "Можливо, найпринизливішою частиною нашої поразки була наша нездатність змагатися в повітрі. Сучасних літаків у нас було занадто мало. Оскільки війна триває навколо нас, нові літаки швидко запускаються у виробництво. Ми мусимо не допустити повторення подібного."
