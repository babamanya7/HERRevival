 SUBDOCTRINE_EXPEDITIONARY_WARFARE_DESC:0 "Вся бойова міць у світі мало що означає, якщо вона не може дістатися до місця бою. Ми зробимо організаційний акцент на можливості проектування сил для досягнення наших стратегічних цілей."
 SUBDOCTRINE_HEAVY_AIRCRAFT_FOCUS_DESC:0 "Розмір і вантажопідйомність великих корпусів літаків дають їм неперевершену здатність нести широкий спектр спеціалізованого обладнання для будь-якої військової ситуації."
