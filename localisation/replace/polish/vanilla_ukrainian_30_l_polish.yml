 BUL_the_anti_capitalist_fight_desc:0 "Протягом історії так звані великі демократії Європи втручалися в економіку та кордони балканських країн, піклуючись про власні інтереси та байдужі до кривавих конфліктів, які вони спричиняли. Але настав час, щоб ці гнилі капіталісти зникли, бо тепер настала черга Болгарії диктувати свої економіки, свої уряди та свої кордони."
 BUL_the_peoples_militia_directorate_desc:0 "Ми створимо Управління народної міліції під безпосереднім підпорядкуванням Міністерства внутрішніх справ, яке буде відповідати за політичну безпеку, охорону громадського порядку та кримінальне розслідування."
