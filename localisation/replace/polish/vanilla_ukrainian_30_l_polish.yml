 WTT_build_support_in_hebei_desc:0 "§W§H[614.GetStateMajorityCountryName]§! має §Hбільшість в області§! й отримує [?614.state_political_support_value|+0] §Hбалів політичної підтримки§!, поки інша країна не отримає більшу §Hмісцеву підтримку§!\n\n§HМісцева підтримка§!:\n[614.GetLocalStateSupport_CHI][614.GetLocalStateSupport_PRC][614.GetLocalStateSupport_GXC][614.GetLocalStateSupport_YUN][614.GetLocalStateSupport_SHX][614.GetLocalStateSupport_XSM][614.GetLocalStateSupport_SIK]§!"
