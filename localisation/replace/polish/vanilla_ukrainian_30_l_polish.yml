 SIA_war_fervor:0 "Воєнний запал"
 SIA_war_fervor_tt:0 "Підтримка війни буде постійно зростати, поки ми не оголосимо війну будь-якій іншій країні, після чого дух буде вилучено.\n\nЯкщо §YПідтримка війни§! залишатиметься вище §Y95%§! без оголошення війни занадто довго, розпочнеться громадянська війна.\nПри оголошенні війни: "
 SIC_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3:0 "Шаоцзян"
 SIC_drive_out_the_japanese_desc:0 "Спроба японців підкорити китайців повинна негайно припинитися. Хоча їхня повна військова перемога все ще здається нереалістичною, ми повинні зупинити їх і змінити хід подій раз і назавжди. Ми повинні прагнути вигнати їх з нашої славетної нації!"
 SIC_neutrality:0 "Сичуаньська кліка"
 SIC_xikang_offensive:0 "Наступ на Сікан"
 SID_fascism_DEF:0 "Сідамське царство"
 SIE_communism:0 "Народна демократична республіка Сьєрра-Леоне"
 SIE_democratic_ADJ:0 "Сьєрра-леонськ"
 SIK_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0:0 "Шаосяо"
 SIK_light_tank_equipment_2:0 "Type 36 Xiao"
 SIK_rejoin_the_central_government:0 "Возз'єднатися з Центральним урядом"
 SIK_rejoin_the_central_government_desc:0 "Ради не такі надійні, як ми могли колись думати. Здається, найкраще буде поставити на переможця, змінити наш курс, щоб приєднатися до Гоміньдану та швидко інтегруватися з Центральним урядом."
 SKIP_LINK_ACCOUNTS:0 "Пропустити сполучення"
 SKK_communism_ADJ:0 "Сіккімськ"
 SLAVIC_UNIFIED_communism_DEF:0 "Об'єднана слов'янська радянська республіка"
 SLO_AUS_danubian_state_DEF:0 "Дунайська держава Словаччина"
 SLO_infantry_equipment_1:0 "Zbrojovka Brno ZH-29"
 SMB_air_defense_default:0 "Протиповітряна оборона"
 SMB_air_modifier_boost_2:0 "[SMB_air_modifier_boost_2_key]"
 SMB_army_academy_default_desc:0 "Наявність ефективної зброї — не єдиний фактор, який визначає результат битви. Іншим величезним фактором є майстерність не лише окремого солдата, але й генерала, який командує військами. Для досягнення цієї мети ми мусимо інвестувати в розширення діяльності армійської кафедри нашої військової академії."
 SMB_army_support_desc:0 "[SMB_army_support_desc_key]"
 SMB_blue_water_fleet:0 "[SMB_blue_water_fleet_key]"
 SMB_carrier_conversion:0 "Переобладнані авіаносці"
 SMB_conscription_default_desc:0 "Хоча професіоналізм наших солдатів можна поставити під сумнів, немає сумніву, що наша армія зараз відчайдушно потребує більше солдатів, щоби поповнити свої лави, оскільки ми страждаємо від нестачі чоловіків, які бажають приєднатися до наших збройних сил."
 SMB_conscription_desc:0 "[SMB_conscription_desc_key]"
 SMB_domestic_designs_default_desc:0 "Найкраще було б створювати та виробляти власні моделі та конструкції літаків, оскільки не можна довіряти іншим країнам у розробці та виробництві літаків, придатних для наших пілотів."
 SMB_experimental_weapons_department:0 "[SMB_experimental_weapons_department_key]"
 SMB_mechanized_troops_desc:0 "[SMB_mechanized_troops_desc_key]"
 SMB_motorized_default_desc:0 "Майбутнє війни — це швидкі транспортні засоби, які оточують і знищують ворогів, не даючи їм часу на реакцію, а не вогневі рубежі піхоти 16 чи 17 століття — стратегія, яка безглуздо витрачає час і людські ресурси, не даючи великого ефекту."
 SMB_raiding_fleet_desc:0 "Морські шляхи постачання мають вирішальне значення для функціонування більшості економік. Використання наших флотських засобів для порушення цих ліній постачання може поставити навколішки навіть найпотужніші країни."
