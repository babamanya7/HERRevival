 USA_raise_the_free_corps_desc:0 "Наша підготовка завершена. Тисячі ветеранів Великої війни готові створити підрозділи, щоби воювати за нас."
 USA_reinforce_monroe_doctrine_tt:0 "Поліпшить торговельні відносини з усіма американськими країнами.\n"
 USA_reintegration_desc:0 "Війна розколола нашу країну, але згодом навіть ті, хто повстав проти нас, зможуть спокутувати свої гріхи. Люди, які усвідомили глибину своїх помилок, мають отримати право на повернення до політичного життя нашої республіки."
