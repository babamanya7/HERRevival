 denmark_protection_event.200.desc:0 "Перед обличчям війни важливо підготувати армію до майбутніх випробувань. Пройшовши посилену підготовку, наші війська відмінно зможуть захистити кордони держави [DEN.GetNameDef]."
 denmark_protection_event.7.t:0 "[FROM.GetNameDefCap] пропонує дослідницьку угоду"
