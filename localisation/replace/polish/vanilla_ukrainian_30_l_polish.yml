 PRC_protracted_warfare:0 "Затяжна війна"
 PRC_put_an_end_to_the_sufan_desc:0 "Коли ми прибули в [622.GetName], місцевого лідера ЦК Політбюро Лю Чжиданя та інше місцеве керівництво саме зачищали в рамках антиконтрреволюційної кампанії. $PRC_bo_gu$ отримає завдання покласти край цьому безглуздю."
 PRC_reinforce_base_area_tt:0 "Побудувати §Yсухопутні укріплення§! рівня §G2§! на кордонах §Y[622.GetName]§! та §Y[1046.GetName]§!. \nЯкщо були виграні прикордонні війни: \nПобудувати §Yсухопутні укріплення§! рівня §G1§! на їхніх кордонах"
 PRC_sea_china_medical_university_desc:0 "$PRC_china_medical_university_desc$"
 PRC_social_democracy_focus_desc:0 "Радикальні рішення партії лише посилили і так непросту ситуацію. Націоналісти за всіх їхніх недоліків є нашими союзниками у боротьбі за світле майбутнє. Ми маємо бути ближче до них у політичних питаннях."
