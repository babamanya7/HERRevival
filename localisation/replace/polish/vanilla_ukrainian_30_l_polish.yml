 TUR_peace_at_home_desc:0 "Наші ймовірні вороги нападуть на нас одразу, як тільки відчують нашу слабкість. Усі, хто керує Туреччиною, мають працювати над добробутом та внутрішньою стабільністю держави. Коли буде мир у нашому домі, ми зможемо прагнути миру в усьому світі."
 TUR_refining_our_strategies:0 "Удосконалення наших стратегій"
 TUR_remaining_defiant_tt:0 "\nМи продовжимо вимагати право регулювати рух кораблів крізь §YТурецькі протоки§!. \n\n§RМожливо, це наш останній шанс уникнути конфлікту: якщо [SOV.GetNameDef] не відступиться, на нас чекає війна!§!"
 TUR_republicanism_decision_desc:0 "Наша країна з'явилася на уламках Османського султанату, що згинув. Тепер ми не підкоряємося ні султанам, ні халіфам, ні богам — ми вільні, і свою свободу ми здобули, страждаючи."
 TUR_sanayiciler_etatism_tt:0 "\nРішення §YПромислові проєкти Sanayiciler§! стануть дорожчими за рахунок нашої етатистської економічної моделі."
