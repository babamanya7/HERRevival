 JUNO_brazil_events.180.desc:0 "Через нещодавні заворушення в Сполучених Штатах та повалення їхнього уряду марксистами, низка [USA.GetAdjective]s попрямувала до [ROOT.GetNonIdeologyName] у пошуках нового життя. Можливо, найвідомішим нашим прибульцем наразі є відомий промисловець $BRA_henry_ford$. Він запропонував розширити свою діяльність у Фордландії в обмін на місце в уряді, щоб допомогти нам запобігти падінню жертвами комуністичного впливу, як це сталося з його батьківщиною."
 JUNO_brazil_events.41.desc:0 "Уряд [FROM.GetNameDefCap] прийняв нашу пропозицію про державність, а це означає, що військова акція для забезпечення безпеки невеликої нації більше не буде необхідною."
 JUNO_brazil_events.53.desc:0 "Посли [FROM.GetNameDef] повідомили нам, що їхній уряд не вважає, що інтересам їхньої нації найкраще слугуватиме військова співпраця з нами в цей час. Незрозуміло, чи мають вони власні плани щодо нашого регіону, чи нас просто вважають тягарем для них."
