 INSHOL_peg_indies_guilder_to_us_dollar_desc:0 "Гульден Ост-Індії втратив більшу частину своєї вартості під час великої депресії, а наше економічне зростання зайшло в глухий кут. Хоча ми могли б прив'язати ост-індський гульден до голландського гульдена, долар США є набагато стабільнішою валютою. Прив'язка гульдена до долара також дозволяє нам мати більшу економічну незалежність, роблячи самоврядування більш досяжною метою."
 INSHOL_prioritize_dutch_profits:0 "Пріоритет голландських прибутків"
 INSHOL_urge_gov_veto_desc:0 "Петиція Сутарджо — це націоналістична схема, на яку ведеться уряд Ост-Індії. Ми повинні закликати генерал-губернатора негайно накласти вето на петицію, інакше ми ризикуємо втратити нашу колонію."
