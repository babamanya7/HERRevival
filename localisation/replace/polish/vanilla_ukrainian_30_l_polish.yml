 tech_engineers4_desc:0 "Зберігаючи локальну мобільність і створюючи те, що раніше вважалося б постійними зміцненнями та системами постачання, інженерні війська майбутнього забезпечать наших солдатів захистом скрізь, де б їх не атакували."
 tech_field_hospital:0 "Польовий шпиталь I"
 tech_field_hospital2_desc:0 "Використовуючи пересувні шпиталі та надаючи допомогу там, де вона найпотрібніша, ми запобігаємо чимало зайвих смертей та невиліковних травм."
 tech_mountaineers3_desc:0 "Підготовка до найважчих завдань на великій висоті в горах і за низької температури вимагатиме від наших гірничо-стрілецьких військ граничної зібраності та виучки."
 test_the_ussr_focus_desc:0 "Ми мусимо відповісти на регулярні провокації радянців уздовж нашого північного кордону. Не можна більше миритися з їхніми постійними порушеннями встановленого кордону Маньчжурії. Зосередьте війська у північній Маньчжурії, щоби припинити всі майбутні провокації."
 tfv_australia.32.d:0 "Після офіційного відходу держави [From.GetNameDef] зі Співдружності [From.GetAdjective]ий уряд тепер шукає нових союзників. Оскільки Європа, здавалося б, стоїть на порозі нового дорогого конфлікту, а стратегічна цінність держави [From.GetNameDef] для абиякого можливого конфлікту в Тихому океані, партнерство може бути в наших інтересах.\n\nЦе, безумовно, підкреслює Південно-Східну Азію, Далекий Схід і Тихий океан є частиною нашої сфери впливу, і гарантувати, що незалежно від того, що станеться в Європі, [Root.GetAdjective]і інтереси не будуть втручані."
 tfv_australia.71.d:0 "Після вказівок [Root.GetAdjective]ого військового командування, держава [From.GetNameDef] вирішила надати нам «проміжний контроль» над усіма колоніальними [From.GetAdjective]ими володіннями у Південно-Східній Азії.\n\nЗі старих сил Тихого океану жодного тим мудріше, наші спроби забезпечити домінування держави [Root.GetNameDef] над регіоном продовжуються."
 tfv_canada.41.a:0 "Білий дім згорить знову!"
 tfv_canada.73.desc:0 "Після підписання Закону про Ньюфаундленд суверенітет над Ньюфаундлендом і Лабрадором має бути переданий нашому союзнику, державі [CAN.GetNameDef]. Хоча вони заявляють, що це не підлягає обговоренню, вони принаймні визнають, що ми мусимо отримати економічну компенсацію за відмову від наших баз у цьому регіоні."
 tfv_new_zealand.3.t:0 "Членство в Комінтерні відхилене"
 tfv_new_zealand.5.a:0 "Це нас убереже."
 tfv_raj.40.a:0 "Британці забрали наші колонії. Тепер ми заберемо їхні."
 tfv_raj.42.desc_GER_helps_ENG_reject:0 "Наші надії на легкий шлях до незалежності були жорстоко розбиті британським колоніальним відомством. Коли [GER.GetAdjective]ий посол звернувся до них із проханням дозволити нам самим визначати свою долю, йому швидко відповіли, що немає про що говорити. [ENG.GetAdjectiveCap]ий уряд стверджує, що питання нашої незалежності є внутрішньою справою, в яку не може втручатися жодна іноземна держава."
 tfv_south_africa.12.b:0 "$tfv_south_africa.11.b$"
 tfv_south_africa.15.desc.a:0 "З Німеччини прибула партія літаків. Наші пілоти з нетерпінням чекають на них, і за місця в новій ескадрильї розгорнулася запекла боротьба."
 tfv_south_africa.4.a:0 "Хороший компроміс: ніхто ним не задоволений."
 tfv_south_africa.52.t:0 "Добровольці громадянської війни в Іспанії повертаються"
 tfv_south_africa.73.d:0 "Звільнившися з-під влади колоніальних гнобителів, [ERI.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [ERI.GetAdjective]ого уряду."
 tfv_south_africa.76.d:0 "Звільнившися з-під влади колоніальних гнобителів, [SOM.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [SOM.GetAdjective]ого уряду."
 tfv_south_africa.90.d:0 "Звільнившися з-під влади колоніальних гнобителів, [IVO.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [IVO.GetAdjective]ого уряду."
