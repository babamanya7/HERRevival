 TUR_edirne_research_exchange_desc:0 "Ми перехопимо ініціативу та утворимо громадський інститут, який заохочує вільний багатонаціональний обмін ідеями, щоби бути в авангарді останніх промислових та наукових досягнень Балканського договору."
