 RAJ_found_scindia_shipyard:0 "Збудувати верф Скіндіа"
 RAJ_hill_training_desc:0 "У рамках нашої ініціативи з диверсифікації підготовки, яку ми пропонуємо нашим військам, ми повинні забезпечити, щоб вони були готові до боїв у гірській місцевості, а також у джунглях, пустелях та містах."
 RAJ_his_majestys_loyal_government_desc:0 "Хоча заклики до незалежності стають гучнішими на вулицях, механізм [ROOT.GetName] залишається непохитним. Керовані призначеним віце-королем Його Величності та підтримувані Індійською цивільною службою, ми будемо нести інтереси Корони з дисципліною та рішучістю."
 RAJ_indian_independence_act:0 "Акт про незалежність Індії"
 RAJ_indian_socialism_desc:0 "Замість того, щоб шукати натхнення у соціалістичної великої держави, ми створимо власну соціалістичну доктрину, адаптовану до потреб [RAJ.GetNameDefCap]."
 RAJ_industrialized_this_state:0 "§HСільська місцевість уже індустріалізована§!"
