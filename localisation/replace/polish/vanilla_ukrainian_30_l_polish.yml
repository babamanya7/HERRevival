 italy.11.d:0 "Незважаючи на допомогу, яку ми надали їм у громадянській війні, [From.GetLeader] тепер відмовився надати нам Балеарські острови, захищаючи які воювали наші співвітчизники. Хоча вони наполягають на тому, що прагнуть підтримувати добрі відносини з нашою нацією, ми мусимо змусити їх віддати нам острови, тепер вже силою..."
 italy.14.a:0 "Це неприйнятно. Ми мусимо зробити це самостійно."
 japan.2.d:0 "На наш подив, китайці вирішили відступити після сутички біля мосту Марко Поло. Вони зрозуміли, що заплатять велику ціну за нашу лють, і тому погодились передати нам великі територіальні поступки, що включають Пекін та його прилеглі регіони. Потрохи Китай стає нашим."
 japan.5.d:0 "Помітивши нарощування наших військ, радянці мудро вирішили відвести свої сили з районів, безпосередньо прилеглих до кордону Маньчжурії. Наші бійці тимчасово зайняли декілька своїх до цього покинутих прикордонних застав. Сподіваємося, це покладе край безглуздим прикордонним претензіям, які висувають росіяни та їхні монгольські союзники."
 japan_border_conflict.3.a:0 "Краще програти з честю, ніж ніколи не намагатися."
