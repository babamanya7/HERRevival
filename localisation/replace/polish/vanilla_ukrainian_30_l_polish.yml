 MUN_czech.1035.d:0 "Наше тісне партнерство з [CZE.GetNameDef] спонукало їх запропонувати унікальну угоду: вони виготовлятимуть для нас зброю, яку ми зараз виробляємо всередині країни, звісно ж, за певну ціну. Це, у свою чергу, дозволить нам зосередитися на інших секторах нашої промисловості."
 MUN_czech.1042.t:0 "[FROM.getname] погоджується на Договір про митний союз"
