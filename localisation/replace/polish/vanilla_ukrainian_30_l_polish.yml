 DOD_hungary.31.a:0 "Чудово."
 DOD_hungary.36.a:0 "Невже ми настільки небезпечні?"
 DOD_hungary.62.desc:0 "Нашого посла в державі [From.GetNameDef] викликали для консультацій. У ході зустрічі його поінформували про те, що [From.GetNameDef] вважає територіальну цілісність Румунії своїм національним інтересом. [From.GetNameDef] насамперед черга турбується про нафтові родовища в Плоєшті. Якщо ми заберемо Трансільванію або спробуємо окупувати Румунію повністю, запаси нафти опиняться під загрозою. Схоже, що влади не згодні на такий ризик. дійде до війни."
 DOD_hungary.63.a:0 "Всі зрадили нас!"
 DOD_hungary.85.desc:0 "Влада держави [From.GetNameDef] повідомила нас про те, що територіальна цілісність Словаччини не є предметом обговорення. Нас попросили вивести з цього регіону всі регулярні та нерегулярні частини або готуватися до гіршого."
 DOD_hungary.93.a:0 "Ми надамо їм всіляку підтримку."
 DOD_romania.10.b:0 "Нейтралітет — найкращий спосіб захисту."
 DOD_romania.113.b:0 "Ми завдамо удару поодинці."
 DOD_romania.114.b:0 "Для нас смерть понад безчестя."
 DOD_romania.20.a:0 "Вони отримають наші гарантії."
 DOD_romania.21.t:0 "[From.GetNameDefCap] гарантує цілісність румунських кордонів"
 DOD_romania.22.t:0 "[From.GetNameDefCap] відмовляється дати гарантії"
 DOD_romania.30.t:0 "Румунія пропонує бази"
 DOD_yugoslavia.20.c:0 "Ми не можемо нічого продати."
 DOD_yugoslavia.22.t:0 "[From.GetNameDefCap] погоджується продати бомбардувальники"
 DOD_yugoslavia.46.desc:0 "Схоже, наш тиск на Югославію мав протилежний ефект. Замість припинити торгівлю з Німеччиною або оголосити про підтримку союзників, [YUG.GetLeader] вперто наполягає на нейтралітеті. МІ-6 отримала відомості що югославська влада має намір пропустити німецькі війська крізь свою територію."
 DOD_yugoslavia.502.desc:0 "Молодий король [Root.GetLeader] і [From.GetPrincessName] пов'язали себе священними узами шлюбу в церемонії, що проводиться в місті [Root.GetLondonBelgrade] перед тріумфуючим натовпом— як свідками вш кризи [Root.GetWeddingGoodBad] Хоч це весілля і не знаменує створення будь-якого офіційного [yugoslavia_wedding_partner.GetAdjective]о-[Root.GetAdjective]ого союзу, зараз ясно, що співпраця між двома державами цим не обмежиться."
 DOD_yugoslavia.702.b:0 "Не бачу приводів для занепокоєння."
 DOD_yugoslavia.80.t:0 "Зара в обмін на альянс"
 DOD_yugoslavia.801.t:0 "[From.GetNameDefCap] вимагає регіону [103.GetName]!"
 DOD_yugoslavia.802.a:0 "Все пройшло за планом."
