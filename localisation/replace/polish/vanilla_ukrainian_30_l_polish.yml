 NO_LEADER_SHIPS_COUNT_AND_LIMIT:0 "Військова частина без компндира може втримувати до $MAX|Y$ кораблів. Зараз тут є $SHIP|Y$."
 NO_RAILWAY_ACCESS_TO_TARGET_COOLDOWN:0 "Військова частина не може ввійти в провінцію з неконвертованими залізницями. Конверсія буде завершена через $DAYS$ дн."
 NO_RESERVED_CP:0 "Командна влада не виділяється на підтримання Вашого офіцерського корпусу."
 NO_RETREAT_ALLOWED:0 "Військова частина не може відступити сюди."
 NSB_poland_monarchist_events.4.t:0 "Монархістська громадянська війна"
 NSB_poland_monarchist_events.5.desc:0 "Після довгої кампанії королівської пропаганди, ініціаторами якої були [From.GetLeader] і [From.GetLeader.GetHerHis] уряд, напруга між лоялістами, яких очолює [Root.GetLeader] держав [Root.GetNonIdeologyName] і [From.GetNonIdeologyName], досягли тієї точки, де мирне співіснування вже неможливе. [Root.GetNonIdeologyName].\n\nЯкщо прийняти таку вимогу, [Root.GetNonIdeologyName] стане не більше ніж [From.GetAdjective] маріонеткою, але відмова майже напевно призведе до громадянської війни."
 NSB_polish_fascist_events.3.a:0 "Цілком розумно."
 NSB_soviet_civil_war_common.100_exiles.desc:0 "У Маньчжурії групи російських опозиціонерів планують повстання, метою якого стане [FROM.GetLeader]. Їх головний переговорник, $SOV_konstantin_rodzayevsky$, пропонує передати нам Владивосток після того, як переможе лідера [FROM.GetLeader], в обмін на підтримку в разі громадянської війни."
 NSB_soviet_civil_war_common.118.c:0 "У нас зброї немає, але, може, якщо ми її для них купимо..."
 NSB_soviet_communist_civil_war.006.desc:0 "Робітники в регіоні [?SOV_uprising_state.GetName] масово вийшли на вулиці. В основному вони закликали підвищити вплив профспілок, але звучали й інші гасла та знаки протесту. Доповідають навіть про прямі анти."
 NSB_soviet_fascist_tsarist.33.a:0 "Шкода, але у нас зараз є проблеми важливіші."
 NSB_soviet_fascist_tsarist.6.a:0 "Тепер ця держава буде нашим плацдармом на Американському континенті."
 NSB_soviet_fascist_tsarist.7.t:0 "[FROM.GetNameDef] відхиляє запрошення"
 NSB_soviet_foreign_politics_events.12.desc:0 "Звертаючи увагу на зростаючу загрозу з боку держави [JAP.GetNameDef], [FROM.GetAdjective] уряд наполегливо рекомендує нам почати зміцнювати кордон з державою [JAP.GetNameDef]. Так ми будемо менше від людей на наш захист, і за це нам обіцяна логістична та матеріальна допомога."
 NSB_soviet_foreign_politics_events.2.t:0 "Столичні мітинги за підтримки держави [FROM.GetNonIdeologyName]"
 NSB_soviet_foreign_politics_events.211.a:0 "Нехай Хакімов і пропонує від щирого серця, але ми мусимо пам'ятати про радянські амбіції і бути насторожі."
 NSB_soviet_foreign_politics_events.269.a:0 "Прикро."
 NSB_soviet_foreign_politics_events.274.a:0 "Це відкриває нові торгові можливості!"
 NSB_soviet_foreign_politics_events.274.desc:0 "[ROOT.GetAdjectiveCap]ий представник у Діхуа повідомлений [SIK.GetAdjective]ими дипломатами, що вони прийняли нашу пропозицію з видобутку ресурсів у області [619.GetName] і поліпшення його інфраструктури. У відповідь, [SIK.GetAdjective]і борги будуть виплачуватись золотом і рідкісними копалинами з Алтаю."
 NSB_soviet_foreign_politics_events.277.t:0 "$NSB_soviet_foreign_politics_events.274.t$"
