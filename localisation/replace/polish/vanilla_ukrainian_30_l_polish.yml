 GNB_fascism_DEF:0 "Диктаторська Гвінея-Біссау"
 GOE_RAJ.24.t:0 "[ENG.GetName] приймає мирну пропозицію"
 GOE_RAJ.25.a:0 "Підписати мир"
 GOE_RAJ.26.t:0 "Субгас Чандра Бос звільнений із в'язниці"
 GOE_RAJ.27.b:0 "Звучить як угода"
 GOE_RAJ.34.t:0 "Адміністрація [UK_INDIA.GetName] зазнає краху"
 GOE_RAJ.4.desc:0 "Оскільки ситуація з безпекою на континенті швидко погіршується, [FROM.GetNameDef] вимагає, щоб наше Королівство було міцно інтегроване у їхню сферу впливу.\n[FROM.GetAdjective] уряд наголосив, що ми збережемо певну незалежність, але вони більше не можуть допускати потенційних ризиків для безпеки держави."
 GOE_RAJ.41.a:0 "Революція рухається вперед."
 GOE_RAJ.44.desc:0 "Індійські сили перетнули спірну територію поблизу [433.GetName]. Індійські війська захопили Тадж-Махал. Вони стверджують, що земля належить революції за історичним правом. У радіопромові Прем'єр назвав Пакистан пережитком колоніального поділу. Напруга зростає, і сутичка здається неминучою."
 GOE_RAJ_eic.9.a:0 "Чудові угоди!"
 GOE_RAJ_famine.10.a:0 "Холоднокровні дурні"
 GOE_RAJ_famine.12.desc:0 "[FROM.GetName] надала нам невеликий пакет допомоги, допомагаючи полегшити голод та запобігти його подальшому поширенню на сусідні штати. Хоча вони, безумовно, могли б зробити більше, це краще, ніж нічого."
 GOE_RAJ_famine.13.desc:0 "Найгірше від голоду, здається, минуло. Гарний урожай полегшив найгірші страждання, і ціни на продукти харчування дефлюють. Хоча знадобиться деякий час, щоб відновити відчуття нормальності, це перший крок до зцілення території.\nЗ великою трагедією, що спіткала нас, ми повинні запитати себе, яка справжня ціна перемоги?"
 GOE_RAJ_loyalist.14.t:0 "[BRM.GetAdjective] $state_resource_tungsten$ для [FROM.GetName]"
 GOE_RAJ_navy.11.desc:0 "Чиновники з [ENG.GetNameDefCap] відповіли на наш запит та погодилися надати нам покращені контракти на кораблі, ми отримали п'ять крейсерів для початку, які прибудуть зараз."
 GOE_RAJ_navy.3.desc:0 "Чиновники з [FROM.GetNameDefCap] відхилили нашу запропоновану військово-морську угоду, заявивши, що вона не приносить їм жодної користі і є явно односторонньою."
 GOE_generic_events.1.t:0 "[FRA.GetAdjective] уряд зазнає краху"
