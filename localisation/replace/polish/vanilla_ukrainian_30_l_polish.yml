 AST_GATHERING_STORM_DESC:0 "Австралійці кров'ю заробили своє місце в історичних підручниках про Велику війну. Не були забуті жертви, понесені в результаті Дарданельської операції, — як і імена тих, хто цією операцією керував.\n\nАвстралія знаходиться на роздоріжжі: чи варто їй лишатися на боці своїх колоніальних господарів, ризикуючи знову бути втягнутою в конфлікт у далекій Європі, чи краще зосередитися на загрозах ближче до своєї землі?"
