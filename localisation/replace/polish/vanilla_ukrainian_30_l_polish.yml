 VIC_down_with_marianne_desc:0 "Псевдорелігійне поклоніння Маріанні, символу французького республіканізму, скривило свідомість нашого народу. Подібно до нікчемної Республіки, яку вона представляє, усі її сліди мають бути знищені."
