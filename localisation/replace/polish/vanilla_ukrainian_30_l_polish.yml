 SAF_anti_colonialist_crusade_desc:0 "Колоніалізм є основою імперіалістичної системи, яка утискує трудівників усього світу. Ми знаходимося в унікальному становищі — ми можемо зруйнувати цю систему та звільнити африканський народ, який експлуатували багато століть."
