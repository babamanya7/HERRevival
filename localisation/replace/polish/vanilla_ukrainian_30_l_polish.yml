 MA_unified_training_program_desc:0 "In order to protect our borders and keep a tight grip over the northeast, it is of utmost importance that we improve the quality of our troops as well as coordinate recruitment to ensure no valuable recruits slip under our noses."
 MEL_communism_DEF:0 "Марійська незалежна фермерська комуна"
 MEN_mongol_autonomy_fascism:0 "Монгольська автономна держава"
 MEN_mongol_banner_category_desc:0 "Система знамен була частиною адміністративного устрою нашого народу протягом століть і дозволяє нам залучати чоловіків з різних знамен на наших підконтрольних територіях, щоб вони брали зброю до рук і захищали свої села."
 MERGE_NAVIES_IN_COMBAT:0 "§RВи не можете об'єднувати флоти, якщо один із них бере участь у бою.§!"
 MEX_cristero_SPA_neutrality_subject_DEF:0 "Нова Іспанія"
 MEX_decision_interior_defence_plan_desc:0 ""
 MEX_focus_aerial_artillery:0 "Повітряна артилерія"
 MEX_focus_agricultural_credit_bank_desc:0 "Banco de Crédito Agricola допоможе пришвидшити програму земельної реформи, надаючи позики фермерам ехідо на купівлю техніки та інших засобів виробництва. Альберто Х. Пані — ветеран фінансової індустрії, який може очолити цей банк і допомогти Мексиці розширити її продуктивні можливості."
 MEX_focus_nafinsa_desc:0 "Nacional Financiera — це банк розвитку, створений для сприяння індустріалізації Мексики. Це було особливо важливо для створення нових заводів у центральних мексиканських штатах, таких як хімічні заводи та металургійні заводи в Мехіко."
 MEX_focus_reform_the_cristero_guard_desc:0 "Крістерос хоробро захищали Церкву від гніту тирана Кальєса, і багато з них загинули мученицькою смертю під прапором Христа. Тепер, коли влада Святої Церкви відновлена, вони повинні бути реорганізовані, щоби стати озброєними захисниками Христа."
 MEX_focus_rescind_the_mexican_cession_desc:0 "Величезні землі, втрачені через нашого північного агресора в 1848 році, продовжують дратувати деяких мексиканських націоналістів. Зараз у Сполучених Штатах живуть мільйони латиноамериканських людей, деякі з них є нащадками корінних мешканців Мексики, інші — недавніми мігрантами. Ми повинні спокутувати честь Мексики, розгромивши агресорів-янкі та об'єднавши мексиканський народ!"
 MEX_focus_rewrite_the_constitution:0 "Переписати Конституцію 1917 року"
 MEX_focus_rural_schools_desc:0 "У школах ми перетворюємо сирий матеріал неписьменних селян на патріотичних громадян, готових боротися з несправедливістю і зміцнювати Вітчизну. Escuelas Regionales Campesinas здійснить революцію серед селян, навчить їх технічним навичкам і зробить їх самостійними."
