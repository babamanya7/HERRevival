 IRQ_attempted_assasination_of_sidqi:0 "Спроба замаху на Сідкі"
 IRQ_attempted_assasination_of_sidqi_desc:0 "Незважаючи на масове невдоволення серед населення та політичної еліти, нещодавні спроби замаху на Бакра Сідкі поки що були безуспішними. Однак, схоже, нам потрібно посилити безпеку та розвідку, щоб захистити новий режим від дисидентів."
 IRQ_found_the_iraqi_state_railways_desc:0 "[ENG.GetAdjective] все ще зберігають контроль над нашою залізничною інфраструктурою у формі Месопотамських залізниць, незважаючи на нашу нібито незалежність. Ми повинні звернутися до них з пропозицією придбати бізнес та перейменувати його на Іракські державні залізниці."
 IRQ_greater_iraq_tag_fascism_ADJ:0 "Іракськ"
 IRQ_infantry_at:0 "Boys Anti-Tank Rifle"
 IRQ_infantry_focus:0 "Зміцнити піхоту"
 IRQ_invest_in_ordnance_mountain_howitzers_desc:0 "Наша нація оточена горами на півночі та сході, але нашим збройним силам бракує адекватної вогневої потужності для боїв у таких районах. Можливо, настав час нам інвестувати у спеціалізовану гірську артилерію, щоб підтримати їх у разі виникнення такого конфлікту з нашими сусідами."
 IRQ_kurdish_industry_desc:0 "Щоб запобігти поглинанню нашими сильнішими сусідами, ми повинні розвинути власну промислову базу."
 IRQ_kurdish_socialist:0 "Шукати радянської допомоги"
 IRQ_kurdish_united:0 "Об'єднаний Курдистан"
 IRQ_neutrality_party_long:0 "Династія Гашімітів"
 IRQ_political_events.13.t:0 "[FROM.GetNameDefCap] погоджується передати територію"
 IRQ_political_events.14.desc:0 "Уряд [FROM.GetNameDefCap] відмовився передати територію, яку ми вимагали у них. Схоже, нам доведеться покладатися на наші збройні сили, якщо ми хочемо звільнити регіон від [FROM.GetAdjective] правління."
 IRQ_political_events.17.a:0 "Це бажана зміна."
 IRQ_political_events.19.desc:0 "Через безліч ускладнень [FROM.GetNameDef] відхилив наш план взяти на себе відповідальність за [455.GetName]. Здається, незважаючи на всі наші зусилля догодити [FROM.GetAdjective], вони все ще ставляться до нас із презирством та недовірою."
 IRQ_political_events.21.b:0 "Вони забувають своє місце."
 IRQ_political_events.22.t:0 "[FROM.FROM.GetNonIdeologyName] планує взяти під контроль"
 IRQ_political_events.25.t:0 "Адміністрація [FROM.GetNameDef] відхиляє пропозицію"
 IRQ_political_events.26.b:0 "Ми не зацікавлені в цей час."
 IRQ_political_events.35.desc:0 "[FROM.GetAdjective] уряд відхилив план передачі відповідальності за їхню націю [IRQ.GetNonIdeologyName]. Хоча ми думали, що це їх задовольнить, схоже, вони воліють дотримуватися знайомого їм зла."
 IRQ_political_events.40.a:0 "У нас небагато вибору."
 IRQ_political_events.53.t:0 "[FROM.GetNameDefCap] погоджується на запит"
 IRQ_political_events.62.a:0 "Тоді ми будемо боротися до кінця."
 IRQ_recruiting_arab_legion:0 "Наразі триває набір Вільного арабського легіону тут."
 IRQ_regional_economic_integration:0 "Регіональна економічна інтеграція"
 IRQ_restoration_of_hejaz_desc:0 "[SAU.GetAdjective]s розгромили Королівство Хіджаз не так давно. І цим вони обмежили вплив Гашімітської династії. Настав час нам відплатити їм."
 IRQ_strengthen_relations_with_iran:0 "Зміцнити стосунки з Іраном"
 ITA_AUS_autonomy_eu_member_ADJ:0 "Італійськ"
 ITA_SH_battleship_1:0 "Клас «Regina Margherita»"
 ITA_VICTORY_POINTS_3604:0 "Падова"
 ITA_abolish_the_colonies_dec_desc:0 "$ITA_abolish_the_colonies_desc$"
 ITA_agents_of_the_church_desc:0 "Церква має незліченну кількість представників по всьому світу, і якщо нам вдасться залучити Ватикан на свій бік, ми отримаємо у своє розпорядження нових агентів із ідеальним прикриттям у вигляді посланців Церкви, які вдосконалять нашу розвідувальну мережу."
 ITA_albania_war_goal_desc:0 "Албанія — легка мішень для окупації нашими військами. Навряд чи ми зустрінемо великий опір. Ми мусимо показати світові міць Італії та відновити славу Римської імперії!"
 ITA_anti_tank_equipment_1_short:0 "Cannone da 37/45"
 ITA_army_leaders_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_XP_GAIN_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_LEADER_COST_FACTOR$: §G-15.0%§!\n$MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-25.0%§!\n$MODIFIER_ARMY_SPEED_FACTOR_FOR_CONTROLLER$: §G+5.00%§!\n\n"
 ITA_artillery_equipment_2:0 "Cannone da 149/40 modello 35"
 ITA_artillery_equipment_2_short:0 "Cannone da 149/40 m/35"
 ITA_bomber_designs:0 "Дизайни бомбардувальників"
 ITA_bring_back_old_glories:0 "Повернути стару славу"
 ITA_carrier_4_desc:0 "«Sparviero» також був запланованим переобладнанням океанського лайнера Augustus. Переобладнання розпочалося наприкінці 1942 року, але далеко не зайшло. Німеччина пустила корабель на дно після його захоплення після італійського перемир'я. Авіаносець мав би водотоннажність 30 400 тонн, був досить добре броньований і мав потужну батарею ППО."
 ITA_combined_land_and_air_warfare:0 "Комбінована наземна та повітряна війна"
 ITA_common_ground_desc:0 "Ми мусимо залишити позаду розбіжності з іншими політичними групами, з якими насправді поділяємо однакові цілі. Настав час працювати разом, щоби повести нову італійську державу до прогресу."
 ITA_cv_CAS_equipment_2_short:0 "Re.2001G/H Falco II"
 ITA_cv_nav_bomber_equipment_1_short:0 "SM.79-II Sparviero"
 ITA_defense_against_capitalism_ws_tt:0 "\nОтримає §G2.00%§! базової підтримки війни за кожного демократичного сусіду (щонайбільше §Y+10.00%§!).\n\n"
 ITA_demand_recognition_of_the_bashkimi_kombetar:0 "Офіційно затвердити Bashkimi Kombëtar"
 ITA_depose_mussolini_desc:0 "Настав час усунути Муссоліні від влади! Він довів, що є некомпетентним лідером, який провів нашу улюблену Італію через багато непотрібних труднощів і перевірив її стійкість на міцність далеко за межею. Хоча його тінь може ще деякий час нависати над нами, Італія та її народ переможуть!"
 ITA_destroyer_2:0 "Клас «Soldati»"
 ITA_dismissed_the_empire:0 "Проігнорували Італійську імперію"
 ITA_fighter_designs_desc:0 "Винищувачі — основа будь-яких ВПС. Ми мусимо гарантувати, що наша винищувальна авіація має засоби для забезпечення повітряної переваги в небі й оборони наших бомбардувальників на шляху до цілей."
 ITA_grand_council_medium_control_range:0 "Переважаючий вплив ради"
 ITA_in_our_controlled_states_cw:0 "у підконтрольних нам [RDS.GetAdjective]их областях"
 ITA_independence_rsi:0 "$ITA_independence_rds$"
 ITA_industria_della_gomma_sintetica:0 "Industria della Gomma Sintetica"
 ITA_integrate_polizia_dell_africa_italiana_libya_tt:0 "Створити §Y1 піхотну§! дивізію, §Y1 кавалерійську§! дивізію й §Y1§! дивізію §Yверблюдової кавалерії§!."
 ITA_investments_in_edison_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-5.0%§!\n\n"
 ITA_invite_france_to_military_partnership_desc:0 "Франція — найсильніший із наших найближчих сусідів і давній союзник. Хоча ми не забудемо їхню зраду в останній війні, ми можемо пробачити. Можливо, настав час залишити старі обрáзи позаду та домогтися зміцнення наших збройних сил крізь тісне партнерство."
 ITA_irregulars_create_units_tt:0 "Створити до §Y10 [ROOT.GetFlag][ROOT.GetAdjective]их§! нерегулярних частин у контрольованих африканських областях і до §Y3 [ROOT.GetFlag][ROOT.GetAdjective]их§! нерегулярних частини в кожного суб'єкта в Африці."
 ITA_is_ruled_by_a_pope_tt:0 "§YПапа§!$TRIGGER_HAS_RULING_COUNTRY_LEADER$"
 ITA_italian_highways:0 "Італійські шосе"
 ITA_light_cruiser_2_desc:0 "Клас «Duca degli Abruzzi» був п'ятим підкласом легких крейсерів класу «Condottieri». Вони були побудовані перед Другою світовою війною для завоювання панування в Середземному морі. Це були найбільші італійські легкі крейсери, введені в експлуатацію під час війни, водотоннажністю понад 9400 тонн. Вони були добре броньовані і мали десять 152-мм гармат Ansaldo."
 ITA_medium_tank_equipment_1_short:0 "M11/39"
 ITA_medium_tank_equipment_3_short:0 "M20/43"
 ITA_ministero_della_cultura_popolare_desc:0 "Наші люди завжди мусять мати доступ до достовірної інформації. Під час війни ворожі агенти можуть легко поширювати дезінформацію, і ми мусимо протидіяти цьому, надаючи нашим людям правдиву версію подій."
 ITA_mio_trait_high_altitude_fighter_development:0 "Розробка висотних винищувачів"
 ITA_modern_musculus_desc:0 "Як і римляни, ми мусимо розробити потужні бойові машини, які дозволять нам домінувати на полі бою. Ми розробимо ідеальний танк, щоби штурмувати лінію фронту та вселяти жах у серця ворогів."
 ITA_modernized_artillery_desc:0 "Regio Esercito, в теорії, є однією з найбільших армій світу. На жаль, ми аж ніяк не зможемо як слід озброїти всіх цих солдат. Що найгірше, більшість нашої артилерії походить із 1918 року!"
 ITA_monarchia_d_italia:0 "Monarchia d'Italia"
 ITA_officers_of_the_service_role:0 "Офіцери служби"
 ITA_piaggio_organization:0 "$piaggio$"
 ITA_prospect_for_oil:0 "Розвідка нафти"
 ITA_pugno_alzato_desc:0 "Настав час викорінити лихо фашизму і загрозу, яку він становить для всього людства. Ми піднімемо наші кулаки в єдності в цій вирішальній боротьбі!"
 ITA_raid_category_fluff_text_air_raids:0 "§LКоролівські ВПС Італії (Regia Aeronautica)§!"
 ITA_rds:0 "$RDS$"
 ITA_reestablish_old_alliances_tt:0 "Буде надіслано подію державі §Y[ENG.GetFlag][ENG.GetNameDef]§! або §Y[FRA.GetFlag][FRA.GetNameDef]§! стосовно приєднання до їхнього альянсу.\nЯкщо країна перебуває у стані війни:"
 ITA_refused_to_grant_us_independence:0 "Відмовилися надавати нам незалежність"
 ITA_revoke_the_acerbo_law:0 "Скасувати закон Ачербо"
 ITA_rsi_ADJ:0 "$RSI_ADJ$"
 ITA_savoia_marchetti_organization:0 "$savoia_marchetti$"
 ITA_sp_rockets_ground_to_air_missile:0 "Проєкт «Aster»"
 ITA_supermarina_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$\n$MODIFIER_NAVAL_MORALE$: §G+10.0%§!\n$MODIFIER_STRIKE_FORCE_MOVING_ORG$: §G-5.00%§!\n$MODIFIER_NAVAL_DOCTRINE_COST_FACTOR$: §G-10.00%§!\n\n"
 ITA_the_garibaldi_legion:0 "Легіон Гарібальді"
 ITA_transport_plane_equipment_2_short:0 "Ca.133"
 ITA_utilize_the_blackshirts:0 "Використати чорносорочників"
 ITA_vallo_alpino_orientale:0 "Vallo Alpino Orientale"
 ITA_vittorio_abdicate_desc:0 "Король Віктор Еммануїл III завжди дбав про благо Італії. Найкращий спосіб, яким він може послужити Італії, — це піти у відставку та дозволити своєму синові стати королем."
 ITZ_ADJ:0 "Іцинськ"
 IVO_communism_ADJ:0 "Івуарськ"
 JAP_EQUIPMENT_VERSION_10:0 "Kai J"
 JAP_agility_focus:0 "Акцент на маневреність"
 JAP_ally_the_gorkhas_desc:0 "Король Непалу править своїм королівством у найвищому гірському ланцюзі світу, будучи значною мірою відрізаним від зовнішніх контактів. Можливо, він прислухається до голосу розуму. Ми повинні спробувати відправити офіційну делегацію до Катманду, щоб переконати його приєднатися до нас у справі звільнення Азії."
 JAP_amphibious_tank_equipment_2:0 "Type 3 Ka-Chi"
 JAP_artillery_equipment_3:0 "Type 96 15 cm"
 JAP_border_conflict_escalate_to_war:0 "Оголосити війну"
 JAP_border_conflict_escalation_warning_SOV_desc:0 "Повітряна розвідка підтвердила великі переміщення військ на японському боці кордону. Ми не знаємо, чи й коли японці вирішили завдати удару, але ми повинні бути готові."
 JAP_bribe_generals_desc:0 "Хоча це й радикально, не всі наші військові хочуть бути на боці зла. Вони приєднуються до своїх товаришів по службі через обов'язок і честь, але, можливо, їх можна переконати підтримати кращу справу, витративши достатньо часу і зусиль."
 JAP_bypass_the_philippines:0 "Обійти Філіппіни"
 JAP_colonial_independence_desc:0 "With the reconquest of former imperial possessions, it is high time we liberate their people and grant them the independence they deserve."
 JAP_communist_state_infiltrating_cost_cost_increase_tt:0 "Вартість прийняття цього рішення §Rзросте на 10§!"
 JAP_cruiser_modernization_desc:0 "Крейсери складають основний кістяк наших оперативних з'єднань у Тихому океані. З усіх доступних варіантів ми маємо зосередитися на найкращих та найсучасніших проєктах."
 JAP_democratic_womens_suffrage_desc:0 "Ічікава Фусае давно виступала за поширення права голосу на жінок. Тепер, коли політична ситуація стабілізувалася, настав час надати виборче право жінкам Японії, щоб вони теж могли зробити свій внесок у наш зростаючий успіх."
 JAP_destroyer_1:0 "Клас «Minekaze»"
 JAP_develop_tunguska_coal_deposits:0 "Develop Tunguska Coal Deposits"
 JAP_establish_housing_corporation:0 "Створити житлову корпорацію"
 JAP_establish_the_japanese_korean_army:0 "Розширення Японської корейської армії"
 JAP_expand_ashigaru_tt:0 "Межу ополчення збільшено до менш ніж 24 дивізій"
 JAP_extensive_army_maneuvers_desc:0 "Щоб здолати Квантунську армію, яка захопила Маньчжурію, коли наша нація розпалася внаслідок громадянської війни, ми повинні переконатися, що наша армія перебуває на належному рівні та готова протистояти їм. Тому ми повинні організувати масштабні маневри, щоб гарантувати нашу готовність до бою."
 JAP_form_the_jikyoku_iinkai:0 "Сформувати Джікьоку Іінкай"
 JAP_generic_mio_trait_improved_light_gun_mounting:0 "Триствольна 25-мм зенітна установка Тип 96"
 JAP_imperial_influence_factions_names_text_communist:0 "Внутрішня фракція"
 JAP_industrial_investment_for_tungsten_decision:0 "Перемістити промисловість до §Y[FROM.CONTROLLER.GetNameDef]§! в обмін на §Yвольфрам§! з §Y[FROM.GetName]§!"
 JAP_intensify_anti_guerilla_operations_tt:0 "Зменшує вдвічі вартість прийняття рішень §Y$PRC_root_out_guerilla_fighters$§! та дозволяє тимчасово знизити опір у регіонах, де партизанів було викорінено"
 JAP_join_the_london_naval_treaty_desc:0 "Щоб схльоснутись з ведмедем, нам потрібно убезпечити свої фланги. Якщо підписання паперу, який обмежує будівництво ВМС, гарантує нам мир, то нехай так і буде."
 JAP_kantai_kessen_tt:0 "Коли §Y[ROOT.GetNameDef]§! §Rоголошує війну§! країні, що має §Y$capital_ship$§!, отримує на §Y180 днів§!:\n §Y$JAP_kantai_kessen_dm$§!\n  Атака великих кораблів проти країни: §G+10.0%§!\n  Швидкість виявлення проти країни: §G+10.0%§!"
 JAP_kantokuen:0 "Кантокуен"
 JAP_kantokuen_desc:0 "Аби скористатися світовими подіями, Квантунська армія готує «Особливі маневри» в рамках підготовки до вторгнення та окупації Далекого Сходу Росії. Щоб атака пройшла швидко, ми повинні інвестувати в ці завершальні приготування, перш ніж переходити до дій."
 JAP_minseito_party:0 "Мінсейто"
