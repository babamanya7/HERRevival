 JAP_mitsumasa_yonai_focus_desc:0 "Міцумаса Йонай, поміркований адмірал, який був важливою частиною прозахідної фракції договору у флоті, має сформувати новий кабінет, який наполягатиме на прийнятті нашої нової конституції. Завдяки цьому ми більше не матимемо тимчасового прем'єр-міністра, і порядок, що існував до початку міжусобиць, буде нарешті відновлено."
