 line_of_battle_bulkhead_drills:0 "Посилена техніка боротьби з затопленням"
 marxism_desc:0 "Марксизм охоплює широкий спектр економічних й історичних поглядів. Політики-марксисти намагаються втілити ідеї Карла Маркса в політичній практиці. Ці погляди об'єднують класова боротьба та потреба переходу до суспільства, заснованого на спільного володіння засобами виробництва."
 mass_motorization:0 "Масова моторизація"
 mechanization_effort:0 "Розвиток механізації"
 medium_tank_amphibious_equipment_2:0 "Середній танк-амфібія II"
 medium_tank_artillery_equipment_1_desc:0 "$medium_tank_artillery_equipment_desc$"
 medium_tank_equipment_3_desc:0 "$medium_tank_equipment_desc$"
 mexico.12.a:0 "[Root.GetLeader] приймає пропозицію."
 mexico.12.b:0 "Ця територія корисна як база ВМС."
 mexico.2.desc:0 "[From.GetLeader] висловлював будь-яку популістську нісенітницю, спрямовану проти наших економічних інтересів у Мексиці, і тепер партія [From.GetRulingPartyLong] ухвалила закон про націоналізацію активів «Royal Dutch Shell», «Standard Oil of California» та багатьох інших міжнародних нафтових компаній! Хоча конституція країни і дозволяє приймати такі закони, згідно з міжнародним правом за понесені компанією втрати належать компенсації. Нафтові барони вимагають від нас рішучих дій."
 mexico.21.title:0 "Мексика екстрадує Троцького"
 mexico.28.a:0 "Потрібно було знищити під корінь усіх цих зрадників раніше!"
 mexico.30.desc1:0 "Нечестивці, яких ми вважали переможеними, згуртувалися для останньої, марної битви проти Слуг Божих. Агенти Сатани, такі як Плутарко Кальєс та його тиранічні «революційні» поплічники, виходять зі своїх лігв зла, озброєні гвинтівками та багнетами, щоби нанизати вірних на шаблі. Ми мусимо зупинити цей напад на Тіло Христове, інакше наша праця, спрямована на підтримання та примноження полум'я побожності, буде зведена нанівець, а двадцять століть пізнання законів нашого Спасителя і Царя будуть забуті."
 mexico.52.desc_not_trotsky:0 "На конгресі партії [MEX.GetFactionName] [MEX.GetLeader] оголошує про перевагу тлумачення Троцьким праць Маркса, Енгельса та Леніна над такими хибними розуміннями суті революції, як сталінізм. З розвалом 3-го Інтернаціоналу (відомого як Комінтерн) комуністичні лідери всього світу повинні розглянути свої дії з позиції самокритики. Після визнання своєї політичної сліпоти та нерозуміння істинного духу революції вони будуть запрошені до 4-го Інтернаціоналу та будуть допомагати в організації світової соціалістичної революції."
 miniature_fighters_desc:0 "Завдяки меншим розмірам винищувачів ми зможемо брати їх більше в бій, не втрачаючи при цьому значної вогневої потужності, а також зменшимо вагу навантаження літаків-маток."
 mio_cat_eq_all_destroyer:0 "Усі есмінці"
 mio_policy_general_experimental_development_teams:0 "Групи дослідників-експериментаторів"
 mobile_infantry_decisive_operations:0 "Операції першого удару"
 mobile_infantry_desc:0 "Звичайна піхота часом занадто повільна, щоби не відставати від швидкої бронетехніки, реагувати на її дії або відступати від неї. Проблему вирішує моторизована або механізована піхота, що йде в ногу з темпами сучасної війни.\n\n"
 mobile_warfare:0 "Мобільна війна"
 modern_tank_destroyer_brigade_desc:0 "Шасі сучасного танка, оснащене більш важким знаряддям замість башти, що повертається."
 modern_tank_equipment_1:0 "Сучасний танк"
