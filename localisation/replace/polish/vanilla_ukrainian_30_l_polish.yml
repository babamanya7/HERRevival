 tooltip_raid_warning_header:0 "§RВиявлено наліт на підході:§!"
 tooltip_risk_taking_description:0 "Беручи на себе більші ризики, ви можете збільшити §Gймовірність успіху§! ціною §Rкритичної поразки§! в разі неуспіху."
 town_class_1940:0 "Клас «Town» 1940 р."
 treaty_org.2.desc:0 "Сьогодні декілька колишніх держав-союзниць оголосили про підписання нового договору в Брюсселі, нагадуючи таким чином світові, що найгірше не залишилося в минулому.\n\nДоговір буцімто спрямований на взаємне цивільне та військове співробітництво, проте мало хто сумнівається в тому, який посил це надсилає керівництву держави [SOV.GetNameDef] та його союзникам.\n\nДекілька держав, які опинилися просто в епіцентрі геополітичної напруги, скористалися можливістю оголосити про принцип формального нейтралітету."
 treaty_org.5.d:0 "Побоюючися опинитися учасником нового конфлікту між Сходом і Заходом, держава [FROM.GetNameDef] оголосила про свій намір негайно покинути альянс [ROOT.GetFactionName]. Чи можна їх винуватити в їхній позиції?"
