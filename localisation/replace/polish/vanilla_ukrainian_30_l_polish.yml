 CZE_negotiate_sphere_of_influence_desc:0 "Беззаперечно, військові ресурси, які має [ROOT.GetNameDef], становлять велику цінність для [GER.GetAdjective]ого альянсу. Цілком справедливо, що натомість ми вимагаємо деяких територіальних здобутків."
