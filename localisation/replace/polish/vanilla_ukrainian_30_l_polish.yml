 shortcircuited_radar_3:0 "$shortcircuited_radar_1$"
 siam.3.a:0 "Сумний кінець."
 siam.31.a:0 "[ENG.GetAdjective] човни послужать нам добре."
 siam.7.b:0 "Це виходить з під контролю. Давайте відступимо."
 south_american_events.2.desc:0 "В результаті наших нещодавніх зусиль із модернізації виробництва важкого озброєння, наші експерти дійшли висновку, що нам потрібно спеціалізувати Відділ важкого озброєння. Якщо ми хочемо, щоби наші виробничі лінії не стали вкрай неефективними і не завдавали шкоди безпеці нашої держави, нам необхідно спеціалізувати Відділ важкого озброєння. Що ж нам обрати?"
 south_american_events.52.desc:0 "[FROM.GetAdjective] дипломати повідомили нам, що вони готові припинити воєнні дії в Західній півкулі та на деякий час повернутися до дипломатичних засобів вирішення своїх проблем. Чи триватиме цей домовлений мир, ще належить побачити."
 south_american_events.61.desc:0 "Крігсмаріне та Королівський флот вступили в запеклий бій біля Монтевідео. [GER.GetAdjective] корабель, сильно пошкоджений, кинув якір близько 00:10 у наших портах, вимагаючи ремонту, тоді як британські дипломати тиснуть на нас, щоб ми змусили корабель вийти в море, де він неминуче буде знищений Королівським флотом."
 south_american_events.63.t:0 "[MEX.GetNameDefCap] посилює фашистські настрої"
 south_american_news.4.a:0 "То ось на що здатен народ."
