 MAN_raise_manchu_banner_desc:0 "У стародавні часи імператори династії Цін мали можливість скликати загони маньчжурів для боротьби у війнах. Хоч часи змінилися, старі принципи все ще застосовуються. І от Династії Цін знову потрібна допомога своїх загонів."
 MAN_republic_of_china_neutrality_DEF:0 "Китайська республіка"
 MAN_republican_party_long:0 "Republican Party of China"
 MAN_tsr_ally_bandit_leaders_desc:0 "Присутність Квантунської армії означає, що японцям вдалося встановити значну владу над нашою країною. Однак це також означає, що існує значна кількість людей, готових взяти до рук зброю, щоб позбавити наші землі від них. Ми повинні скористатися цією можливістю, щоб забезпечити перемогу народу."
 MAN_tsr_collective_farms:0 "$MAN_collective_farms$"
 MAN_tsr_expand_the_navy_desc:0 "Хоча нам все ще доведеться покладатися на підтримку японців на морі, було б розумно інвестувати в те, щоб мати більше, ніж просто річковий флот. На чолі з нашим флагманом «Хай Вей» і в тісній співпраці з нашими союзниками ми зможемо протистояти будь-якій спробі вторгнення або набігу на наші землі з моря."
