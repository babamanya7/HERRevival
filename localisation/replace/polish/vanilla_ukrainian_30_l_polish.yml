 denmark_expansion_event.501.desc:0 "[FROM.GetNameDefCap] погоджується прийняти нашу пропозицію про альянс і офіційно підписує свою декларацію. Тепер ми об'єднаємося проти прийдешньої бурі і будемо відтепер захищати один одного."
 denmark_fascist_event.3.a:0 "Прокляття!"
 denmark_occupation_event.11.a:0 "Це тільки початок"
 denmark_occupation_event.2.desc:0 "Данський уряд і [DEN.GetLeader] відправили нам телеграму з умовами своєї капітуляції. Якщо ми готові визнати і поважати суверенітет і територіальну цілісність їхньої країни, вони готові скласти зброю і фактично стати нашим протекторатом."
 denmark_occupation_event.7.t:0 "Данська війна за незалежність"
 denmark_overlord_events.1.desc:0 "Між нашою країною та державою [?DEN.DEN_overlord_nation.GetNameDef] розгорається дипломатична криза через телеграму від нашого короля. Він лише написав: Мої сердечні подяки, нам повідомляють, що [?DEN.DEN_overlord_nation.GetAdjective]ий лідер [?DEN.DEN_overlord_nation.GetLeader] сприймає таку коротку відповідь на привітання з днем народження як образу.\n\nУпродовж останнього часу стосунки між нашими країнами натягнені, і наші старші партнери можуть скористатися цим інцидентом для того, аби спробувати обмежити нашу незалежність і повноваження нашого уряду."
 denmark_overlord_events.20.a:0 "Доведеться підкоритися — заради блага народу..."
 denmark_overlord_events.24.b:0 "Змусимо їх силою"
 denmark_overlord_events.25.a:0 "Ми повинні підкоритися і врятувати наш народ від війни"
 denmark_overlord_events.28.desc:0 "Не дивлячись на всі наші прохання і вмовляння, данський уряд відмовився проявити розсудливість і заборонити комунізм. Ми б'ємося з цією шкідливою ідеологією не на життя, а на смерть, а вона тим часом уже встигла проникнути в серця данців. У цій битві може бути тільки один переможець, і ми повинні взяти гору в ім'я благоденства [ROOT.GetAdjective]ого народу!"
 denmark_overlord_events.36.desc:0 "Схоже, що [FROM.GetAdjective]і людські ресурси закінчуються, раз вони звернулися до нас із вимогою надати солдатів для поточних конфліктів. \nМожливо, це просто виверт, щоб обеззброїти нашу націю і завадити нам повстати і скинути [FROM.GetAdjective]е ярмо."
 denmark_political_events.3.b:0 "Спланувати кампанію комуністів"
