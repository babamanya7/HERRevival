 PERMISSION_ENEMY:0 "Ворожі"
 PER_absorb_byzantines_category_desc:0 "[BYZ.GetNameDefCap] нарешті впала під натиском нашої могутньої імперії. Ми змогли покласти край давній ворожнечі з Грецією, що походить із наших стародавніх часів, і тепер можемо працювати над підпорядкуванням цих земель нашому суверенному правлінню."
 PER_air_shortcut:0 "Авіація"
 PER_air_superiority:0 "Перевага в повітрі"
 PER_ally_the_bazaari_desc:0 "Серед [PER.GetAdjective] еліти зростає занепокоєння щодо напрямку розвитку нації. Багато хто боїться за майбутнє своїх підприємств чи активів і може бути готовий підтримати нашу справу в обмін на гарантії, які захистять їх від політичних наслідків."
 PER_capital_protect:0 "Захистити [PER.Capital.GetCapitalVictoryPointName]"
 PER_civil_war_happened:0 "Громадянська війна сталася"
 PER_communist_events.4.a:0 "Хто стоїть за цим?"
 PER_declared_loyalty:0 "Оголошена лояльність сюзерену"
 PER_demand_iraqi_territory_desc:0 "Північні території [IRQ.GetNameDef] були б чудовим плацдармом, щоб показати народам цього регіону, що [PER.GetNameDef] має стати єдиним центром сили. Це буде одним із наших відправних пунктів для нашої великої кампанії завоювання."
 PER_establish_tehran_armor_desc:0 "Настав час нам заснувати власну компанію з виробництва танків. Після вибору назви «Тегеран Армор» було оголошено, що корпорація буде субсидуватися урядом, щоб допомогти їй налагодити роботу."
 PER_force_them_back:0 "Відкинути їх назад"
 PER_imperial_events.11.desc:0 "Чудова новина. [FROM.GetNameDefCap] прийняв мудре рішення відмовитися від територій Белуджистану на користь нашого контролю. Ми нарешті маємо плацдарм у регіоні Інду."
 PER_imperial_events.121.desc:0 "На щастя, [ENG.GetAdjective] уряд погодився дозволити нам продовжувати керувати [PER.GetNameDef] під їхнім пильним оком. Сподіваємося, це покладе край кровопролиттю та смерті."
 PER_imperial_events.151.a:0 "Це можна вважати перемогою!"
 PER_imperial_events.151.t:0 "[FROM.GetNameDefCap] виводить свої сили"
 PER_imperial_events.161.t:0 "[FROM.GetNameDefCap] виводить свої сили"
 PER_imperial_events.181.a:0 "Піррова перемога, але це найкраще, що ми маємо."
 PER_imperial_events.230.b:0 "Розумно усунути династію Пехлеві."
 PER_imperial_events.40.a:0 "Шах одружиться з Фавзією Єгипетською"
 PER_imperial_events.60.b:0 "Ми не можемо на це погодитися."
 PER_imperial_expansionism:0 "Імперський експансіонізм"
 PER_increase_oil_sales:0 "Збільшити продаж нафти"
 PER_infantry_equipment_1_short:0 "vz. 24"
 PER_iranian_revolutionary_vanguard:0 "Іранський революційний авангард"
 PER_islamic_republic_neutrality_ADJ:0 "Іранськ"
 PER_march_to_nile_desc:0 "Щоб повернути колишні перські території в Північній Африці, ми повинні пробитися через [ENG.GetAdjective] Північну Африку, перш ніж остаточно вторгнутися в Єгипет. Це, безсумнівно, призведе до війни з [ENG.GetNameDef], але це ризик, на який ми повинні піти, якщо хочемо утвердитися як домінуюча імперська сила в регіоні."
 PER_perfect_iranian_airforce:0 "Удосконалити [PER.GetAdjective] Повітряні сили"
 PER_preemptive_invasion_of_iran_tt:0 "Щойно [PER.GetNameDef] капітулює, ми створимо маріонеткову державу, інтегрувавши кілька областей у нашому прикордонні та отримавши права на ресурси в [PER.GetAdjective] областях, багатих на нафту. Ми зможемо запросити [SOU.GetAdjective] втручання для проведення спільної операції."
 PER_push_to_mountains_desc:0 "Схоже, вторгнення закріпилося на півдні [PER.GetNonIdeologyName]. Якщо ми хочемо його відбити, ми повинні зосередити наші зусилля на відкиданні ворогів назад до Перської затоки. Час має вирішальне значення, ми не можемо дозволити їхнім силам зайняти більше території."
 PER_reinforce_iranian_identity_desc:0 "Незважаючи на те, що нам довелося підкоритися нашим ворогам, ми всі все ще [PER.GetAdjective] і ніхто цього у нас не забере. Ми повинні посилити цю ідентичність серед народу та показати їм, що наше бажання свободи все ще яскраво горить у наших серцях."
 PER_reinforced_identity:0 "Посилена ідентичність"
 PER_resource_rights_on_war_tt:0 "§RЯкщо між нашими країнами спалахне війна, права на ресурси та зовнішні фабрики будуть скасовані!§!"
 PER_roll_back_reforms_desc:0 "Хоча шах досяг певного прогресу в модернізації нації, реформи не зайшли досить далеко. Ми будемо прагнути набагато глибшого та радикальнішого плану, який відновить нашу велич."
 PER_secure_coastline_desc:0 "Вторгнення має відбутися з Перської затоки, тому давайте зустрінемо їх віч-на-віч і запобіжимо ворогу отримати будь-який плацдарм у [PER.GetNonIdeologyName]. Якщо ми зможемо зупинити їх від підготовки до висадки на пляжі, ми матимемо хороші позиції, щоб зупинити їх на місці."
 PER_ssb_events.4.a:0 "Це взаємовигідна угода!"
 PER_ssb_events.5.t:0 "[FROM.GetNameDefCap] приймає!"
 PER_stage_mass_protests:0 "Організувати протести"
 PER_stand_with_giants_desc:0 "Світ балансує на лезі ножа, і в Європі назріває конфлікт між могутніми націями. Поки горить ґніт тієї порохової бочки, ми повинні підготуватися, щоб підняти [PER.GetNameDef] до рівня, на якому ми зможемо стояти серед гігантів цього світу і витримати випробування часом як сучасне та прогресивне суспільство."
 PER_sumka_party_long:0 "Націонал-соціалістична робітнича партія Ірану"
 PER_tehran_power_plant_desc:0 "У міру зростання наших міст по всій нації, ми повинні забезпечити їх достатньою кількістю електроенергії. Давайте відкриємо нову електростанцію в столиці Тегерана та закріпимо це як значний наступний крок у розширенні нашого найважливішого міста."
 PHI_aguinaldos_coup:0 "Боротьба за лідерство"
 PHI_american_intervention_icon_value:0 "[?PHI.PHI_american_intervention_icon_value|0H]§Y%§!"
 PHI_commonwealth_of_the_philippines_desc:0 "Створена лише рік тому, Співдружність Філіппін є першим кроком до незалежності Філіппін, яку США обіцяли надати після 10-річного перехідного періоду. Попереду ще багато роботи та рішень, які потрібно ухвалити, щоб наша молода нація запрацювала належним чином."
 PHI_filipino_polynesian_reunification_desc:0 "У цьому регіоні світу панує океан, що складається з розкиданих ділянок суші та далеких островів, проте ми підкорили їх усі. Таким чином, ми забезпечуємо собі законне місце як володарі Тихого океану."
 PHI_focus_time_reduced_T2_tt:0 "§Y$PHI_anti_hacendados$§! скоротить час, необхідний для цього фокусу, на 35 днів."
 PHI_has_built_or_purchased_x_convoys:0 "Флот конвоїв розширено до [?PHI_convoys_investment_goal] шляхом будівництва або купівлі."
 PHI_maphilindo_tag_neutrality_DEF:0 "Федерація малайських народів"
 PHI_military_requisitions:0 "Військові реквізиції"
 PHI_mineral_prospecting:0 "Геологорозвідка корисних копалин"
 PHI_mineral_prospecting_steel_repeatable_decision_2:0 "Розширена розвідка родовищ сталі"
 PHI_mio_trait_engine_filters:0 "Фільтри двигуна"
 PHI_mio_trait_rugged_construction:0 "Міцна конструкція"
 PHI_open_borders_desc:0 "Втомлених, бідних, знедолені маси, що прагнуть вільно дихати — віддайте їх мені.Попри [USA.GetAdjective]і спроби обмежити імміграцію, ми маємо контроль над власними кордонами. Ми повинні прагнути утвердитися як безпечна гавань для тих, кого переслідують через війну, расу, релігію чи з будь-якої іншої причини."
 PHI_partido_komunista_ng_pilipinas_coup_desc:0 "Це почалося як загальний страйк серед фермерів, який перекинувся на їхніх товаришів на фабриках. Народ сказав своє слово, і Національна асамблея впала перед комуністичною справою. Тепер профспілки та колективи поспішають обрати новий центральний комітет і, що найважливіше, визначити, хто має стати новим Генеральним секретарем."
 PHI_pt_boat_development_desc:0 "Нашій нації, що є великим скупченням островів, краще підійде використання менших суден, здатних шмигати туди-сюди вузькими водними шляхами архіпелагу, щоб турбувати і знищувати більших ворогів. Ми повинні придбати експертизу в доктринах торпедних катерів і використати це для розробки власних спеціальних морських активів, які називатимуться патрульними катерами."
 PHI_quezon_city_campus:0 "Кампус Кесон-Сіті"
 PHI_sanction_piracy_desc:0 "Наша країна-архіпелаг є домівкою для безлічі малих суден і заповзятливої молоді, і тому було б злочином, якби ми не скористалися старою системою «каперських свідоцтв», де ми надаємо законні підстави для цих буканьєрів нападати на наших ворогів, щоб потім втекти назад у свої бухти зі своїми новонабутими морськими трофеями."
 PHI_second_republic_tag_democratic_DEF:0 "Друга Філіппінська республіка"
