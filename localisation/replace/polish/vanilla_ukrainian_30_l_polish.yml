 CHL_prop_up_gustavo_ross_desc:0 "Густаво Росс є головним учнем Артуро Алессандрі та його фаворитом на майбутніх президентських виборах. Тому Алессандрі мусить подбати про те, щоби про це стало відомо громадськості, і спробувати створити з Росса свого духовного наступника, використовуючи величезну кількість пропаганди."
