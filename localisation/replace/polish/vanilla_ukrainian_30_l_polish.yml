 AST_unlocking_further_conscription_tt:0 "Для законів §YРозширений призов§! або §YОбов'язкова служба§!, вам також знадобиться будь-який із цих фокусів; §Y$AST_british_pact$§! Фашизм, §Y$AST_refuse_british_wars$§! Фашизм, §Y$AST_toe_the_line$§! Фашизм, §Y$AST_from_picket_line_to_front_line$§! Комунізм, або §Y$AST_part_with_colonizer$§! Комунізм."
 AST_vichy_out_of_africa_desc:0 "Падіння або співпраця з Вішістською Францією є однією з головних цілей [ENG.GetNameDef]. Як жест доброї волі, [AST.GetName] приєднається до боротьби і переслідуватиме французькі африканські колонії до їхнього підкорення."
