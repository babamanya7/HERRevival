 AFG_political_events.42.a:0 "Нам доведеться використовувати альтернативні засоби, щоб привести їх у відповідність."
 AFG_prepare_for_operation_countenance_desc:0 "Союзники готуються до інтервенції у сусідньому [PER.GetName] для забезпечення нафти, перш ніж вороги випередять нас. Ми повинні організувати логістичні домовленості для підтримки інтервенції та зробити свій внесок у майбутню операцію."
 AFG_raise_quami_tt:0 "Розгорнути всі нерегулярні дивізії до поточного ліміту."
 AFG_reform_2:0 "Побудувати дамбу Чак"
 AFG_reintroduce_heavy_cavalry:0 "Відновити важку кавалерію"
 AFG_second_empire_neutrality:0 "Друга Афганська імперія"
 AFG_the_conquerors_of_persia_desc:0 "[PER.GetNameDefCap], земля величезного багатства та історії, колись була суперником імперії. Взявши її під наше правління, ми підтверджуємо наше домінування, забезпечуємо життєво важливі західні території та зміцнюємо місце імперії як справжнього спадкоємця імперської величі."
