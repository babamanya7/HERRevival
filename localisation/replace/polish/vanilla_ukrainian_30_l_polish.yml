 RULE_VOLUNTEERS_ETHIOPIA_ONLY_ONE_TT:0 "Наразі Ви можете надсилати добровольчі війська тільки державі [ETH.GetName]."
 RULE_VOLUNTEERS_SOVIET_SCW_POUM_TT:0 "§RРадянська соціалістична республіка підтримує РПМО та не може надсилати добровольців будь-якій іншій іспанській фракції.§!"
