 SOV_military_offensive_ongoing_not_holding_main_objective_tt:0 "§RМи не контролюємо головну ціль на даний момент.§!"
 SOV_moscow_trial_index_3:0 "Третій"
 SOV_no_time_for_peace:0 "Немає часу на мир"
 SOV_organize_fifth_columnists_in_enemy_neighbor_desc:0 "Робітники та селяни, що симпатизують Більшовицькій партії, на всій території держави [FROM.GetNameDef] підготувалися до збройного повстання і готові завдати удару там, де ворог найменше цього очікує."
 SOV_paranoia_administration_purgeable_tt:0 "Підозрілі справи в адміністрації можуть бути розслідувані"
 SOV_paranoia_bg_tooltip:0 "Якщо величина £SOV_paranoia_text_icon §Yпараної§! перевищить §Y25§!, у Вас зможуть ставатися випадкові чистки.\nЧим вища £SOV_paranoia_text_icon §Yпараноя§! й чим довше вона знаходиться на цьому рівні, тим вища ймовірність чисток.\nЯкщо величина £SOV_paranoia_text_icon §Yпараної§! перевищить §R75§!, у Вас зможуть ставатися великі чистки.\n\nПевні §Yфокуси§!, §Yрішення§! й §Yефекти§! миттєво збільшуватимуть/зменшуватимуть £SOV_paranoia_text_icon §Yпараною§!, а певні риси радників і лідерів країни з часом будуть потрохи збільшувати §Yпараною§!.\n\nВиконання фокусу §Y[GetAppropriateLastPurgeFocusName]§! вимкне систему £SOV_paranoia_text_icon §Yпараної§!."
 SOV_paranoia_tooltip_stalin_undermined:0 "$SOV_iosif_stalin$ ($stalin_authority_undermined$): §R+2%§!"
 SOV_pc_of_mortar_armament_desc:0 "Скромний міномет швидко стає основною формою непрямої вогневої підтримки наших підрозділів. Тому ми мусимо намагатися виробляти якомога більше мінометів усіх типорозмірів і створити державне підприємство, єдиною метою якого буде саме це."
 SOV_permanent_revolution_dec_cat_desc_targets:0 "Марксистська теорія вчить, що революція неминуча за сприятливих обставин, а численні ворожі [SOV.GetAdjective]і агенти, що діють в межах наших кордонів, забезпечують створення сприятливих обставин серед робітничого класу для успішного збройного повстання в державі [ROOT.GetName]."
 SOV_polish_territory_desc:0 "Наразі ми контролюємо багато території, яка колись була частиною так званої Польської Республіки. Якби ми повернули її частину, керівництво, яке ми встановили в [POL.capital.GetCapitalVictoryPointName], могло б використовуйте це як доказ переваг співпраці з [ROOT.GetNameDef]."
