 CHI_free_indochina_tsr:0 "Звільнення Індокитаю"
 CHI_glorify_deng_yanda_desc:0 "Гоміньдан зрадив революцію, яку ми розпочали в 1911 році, заради егоїстичної наживи. Був один, хто заступився за просту людину і створив інший шлях, ніж тиранія та умиротворення: Ден Яньда. Він став мучеником за свої переконання, і ми ніколи не забудемо його чи те, що він уособлював."
