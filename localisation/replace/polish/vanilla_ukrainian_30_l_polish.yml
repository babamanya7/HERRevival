 AFG_expand_quami_template_2_tt:0 "Якщо ми дослідили §Y$tech_engineers$ , $tech_military_police$ або $tech_field_hospital$§!, вони будуть додані до шаблону."
 AFG_expand_royal_guard_desc:0 "Королівська гвардія є елітою наших збройних сил і має відповідну підготовку та досвід. Однак, у міру того, як наші сусіди занурюються у конфлікт, виникає занепокоєння щодо їхньої обмеженої чисельності."
 AFG_industrial_events.16.desc:0 "Через нещодавні воєнні дії між нашими націями, уряд [FROM.GetNameDef] призупинив наші нафтові концесії в країні. Навіть якщо воєнні дії закінчаться, вони, ймовірно, захочуть зберегти контроль над власними ресурсами."
 AFG_industrial_events.37.a:0 "Яка абсурдна ескалація."
 AFG_industrial_events.38.a:0 "Здається, зміни в безпеці, поки що."
 AFG_infantry_organization:0 "Кабульська збройова компанія"
 AFG_political_events.03.a:0 "Вони не зможуть вічно стояти на нашому шляху."
 AFG_political_events.102.t:0 "[FROM.GetNameDefCap] відхиляє пропозицію про буферну державу"
