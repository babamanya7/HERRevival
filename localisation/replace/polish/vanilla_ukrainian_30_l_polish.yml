 SOV_fortify_mongolian_border_desc:0 "Хоча японські прихильники жорсткої лінії зараз зосереджені на Китаї, ми не можемо виключати, що вони можуть захотіти розширити свої здобутки, напавши на нас. Ми мусимо переконатися, що наші монгольські союзники не перетворяться на відкритий фланг."
 SOV_found_the_jet_institute_desc:0 "Нинішні поршневі двигуни можуть просунутись лише так далеко. Майбутнім літакам доведеться покладатися на нові методи руху. Ми мусимо заснувати інститут, який би займався дослідженнями реактивних двигунів, щоб нас не випередили іноземні розробки."
