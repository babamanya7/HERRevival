 JAP_supreme_council_for_direction_of_war_desc:0 "Наш уряд усвідомив, що нам потрібно терміново провести Координаційну нараду Імператорської ставки та уряду, побачивши нагальну потребу в посиленні координації між державними справами та командуванням. Можливо, це зможе привести нас до перемоги."
 JAP_tauran_border_incident_forgotten_1_desc:0 "Якщо ми хочемо колись відбити село у наших ворогів, ми повинні діяти швидко."
 JAP_the_oceanian_soviet_desc:0 "Тепер, коли Південно-Тихоокеанську Раду створено, ми повинні розширити наші кордони далі на південь. З цією метою ми повинні створити Океанійську Раду, щоб виправдати нашу окупацію регіону."
