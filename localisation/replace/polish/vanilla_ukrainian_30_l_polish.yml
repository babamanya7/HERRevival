 RAJ_league_against_gandhism_tt:0 "Події заворушень тепер даватимуть §G5%§! Підтримки війни, до максимуму §Y+50%§!."
 RAJ_lessons_of_the_great_war_desc:0 "Колоніальні війська Індії брали участь у минулій світовій війні, і ми можемо здобути уроки з цього досвіду, щоби поліпшити підготовку та рівень організації нашої армії."
 RAJ_local_recruitment_offices:0 "Місцеві відділення вербування"
 RAJ_mass_production_desc:0 "Ми будемо отримувати обладнання від приватних підприємств, які забезпечують найнижчу вартість. Зниження вартості обладнання є ключем до зростання."
