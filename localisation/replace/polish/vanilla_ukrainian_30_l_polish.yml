 HABSBURG_an_empire_not_just_in_name_desc:0 "Наша федерація безсумніву стоятиме ще тисячу років, адже тепер ніщо не зможе стати на заваді нам і нашому майбутньому. Нехай весь світ знає, що Дунайський регіон — найбагатший і найшановніший у всій планеті!"
 HABSBURG_effectivizing_the_motorized_troops:0 "Ефективне використання палива"
 HABSBURG_effectivizing_the_motorized_troops_desc:0 "Наше використання палива стрімко зросло, оскільки ми прийшли до інтеграції більшої кількості моторизованих, механізованих і бронетанкових підрозділів у нашу армію. Саме паливо стало проблемним місцем, яке заважає нашим військовим можливостям. Нам слід поліпшити використання палива, це принесе нам користь як у військовому, так і в економічному плані."
