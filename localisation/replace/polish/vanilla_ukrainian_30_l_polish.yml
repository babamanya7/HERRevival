 spain.10.d:0 "Після мирних виборів генерала Франсіско Франко як президента Іспанії була надія, що настане кінець жорстоким повстанням і політичним негараздам останніх років. Чутки, що Франко спробує встановити однопартійну диктатуру і себе як голову держави, були підживлені несподіваними зникненнями кількох лідерів опозиції.\nПісля швидкого суду офіцер карабінерів Хосе Галанфор був засуджений за зраду, і невдовзі сталася його публічна страта. Хоча це мало б стати ходом для придушення всякого спротиву підйому Націоналістичної Іспанії, ця подія призвела до зворотного ефекту. Ліві добровольці та навіть декотрі генерали об'єднались під знаменом Народної армії, готові боротися проти пригноблювачів-націоналістів. Хоча більшість із них погано треновані, їм вдалося захопити деякі ключові міста під час хаосу повстання.\n\nЛінії фронту розкреслені. Яку фракцію нам варто підтримати?"
 spain.2.b:0 "Іспанія буде виграна ціною іспанської крові!"
 special_forces_organization_tt:0 " $MODIFIER_ARMY_SUB_UNIT_CATEGORY_SPECIAL_FORCES_MAX_ORG_FACTOR$: $RIGHT|+=0%$"
 special_forces_recon_desc:0 "Наші елітні полки мають неперевершену контррозвідку та обізнаність на полі бою. Додаткова підготовка, безумовно, принесе нам ще більше користі."
 ss_recruitment_event.13.desc:0 "Непідтверджені повідомлення зі штабу фюрера свідчать про те, що хтось підірвав вибуховий пристрій під час ситуаційної зустрічі, на якій був присутній [GER.GetLeader]. Інформації досі мало, а і у Вермахті, і в SS існує значна плутанина, офіцери з обох сторін звинувачують іншу у спробі здійснити переворот.\n\nНам доведеться почекати додаткової інформації."
 ss_recruitment_event.21.desc:0 "Надійшли повідомлення, що Гіммлер викликав вище керівництво SS у замок Вевельсбург для термінових консультацій. Точний зміст цих консультацій невідомий, але цілком зрозуміло, що вони пов'язані з тривалим розчаруванням Гіммлера в керівництві партії. [GER.GetLeader], схоже, досі дотримується порад Вермахту, коли справа стосується військових питань, блокуючи спроби Гіммлера створити та розширити незалежні збройні сили як противагу.\n\nХодять чутки, що Гіммлер натомість звернув свою увагу на створення того, що він називає «новим Тевтонським орденом для нової Німеччини». Ці «лицарі» клянуться у фанатичній вірності й беззаперечній покорі Гіммлеру особисто, і кожен з них отримує меч, виготовлений за дизайном Гіммлера зі сталі, освяченої в старогерманських ритуалах — імовірно, щоб убити ворогів Нової Німеччини."
 ss_recruitment_event.26.b:0 "Уряд підтримає Гьорінга."
