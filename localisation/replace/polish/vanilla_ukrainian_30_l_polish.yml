 LAT_military_dictatorship_desc:0 "Не можна заперечувати, що Улманіс — корисна і важлива постать, але, можливо, в ці часи наростаючого конфлікту варто простежити, щоб він був саме фігурою — символом, але не більше. Управління державою слід віддати виключно армії."
 LAT_support_baltic_fascists:0 "Підтримати балтійських фашистів"
 LAT_wrath_of_the_old_gods_desc:0 "Балтія — не єдиний регіон, заплямований чужоземною релігією. Більшість світу сповідує вчення Христа, і це час змінити. Ми мусимо оголосити власний похід за віру — похід проти християнства!"
