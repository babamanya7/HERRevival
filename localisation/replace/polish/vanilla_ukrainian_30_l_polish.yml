 FIN_national_aircraft_production:0 "Національне виробництво літаків"
 FIN_operation_kilpapurjehdus_desc:0 "За рішенням Ліги Націй, Оландські острови були демілітаризовані з 1921 року, що означає, що в цьому районі немає військ або військового постачання. Проте напруга в Європі зростає, і перед обличчям серйозної загрози з боку ворога висадившись на островах, наше верховне командування розробило план озброєння та зміцнення Оландських островів.\nПідготовка проведена, і наші війська готові діяти!"
