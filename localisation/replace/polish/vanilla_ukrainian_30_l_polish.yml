 congo_independence_struggle.14.a:0 "Тоді вони отримають війну! [COG.GetNameDef] є НАШИМ!"
 congo_independence_struggle.14.d:0 "Сьогодні дуже агресивний делегат від [COG.GetName] зустрівся з колоніальним губернатором. Очевидно, вони розчаровані результатами переговорів і виставили ультиматум. \n\nАбо ми негайно приймаємо їхню незалежність, або вони починають бойові дії. Ми вже отримуємо повідомлення про те, що міліційні підрозділи збираються, і вже були кілька сутичок з гарнізонами Сил Публіки. Ніхто не загинув, але це лише питання часу при таких високих напруженостях."
 congo_independence_struggle.2.d:0 "До нас тільки що звернулась група, що стверджує, що представляє рух за незалежність нашого колоніального підданого, [COG.GetNameDef]. Хоча колоніальна адміністрація вже давно була обізнана з зростаючими настроями за незалежність, їхня сміливість прямо попросити про це дещо здивувала. Вони попереджають, що існує широке місцеве підтримання досягнення цієї мети — вільної та незалежної нації, і що, якщо ми реагуємо занадто різко, це може призвести до насильства, а можливо й до війни. \n\nМи також повинні врахувати наші глобальні зобов'язання та престиж. Тому найбільш дипломатичною пропозицією буде дозволити їм приєднатися до нас як рівноправним партнерам у [BEL.GetAdjective] Співдружності. \n\nАльтернативно, значна частина нашого багатства походить з цієї території, і наші фінанси будуть дуже сильно постраждати від їхньої втрати. Ми можемо попросити їх заплатити за свою свободу — за дуже високу ціну. \n\nНарешті, ми можемо просто сказати \"ні\" і мобілізувати наші сили як попередження для можливих заколотів."
 congo_independence_struggle.6.d:0 "Виявилось, що [COG.GetNameDef] відмовився від нашої щедрої пропозиції мирного і взаємовигідного шляху до незалежності. Тому тепер від нас залежить, наскільки сильно ми будемо триматися за цю непокірну колонію. У нас є три варіанти, як діяти;\n\nПерший варіант: якщо ми віримо, що їхнє бажання здобути незалежність слабшає, ми можемо запропонувати їм статус заморського департаменту, фактично перетворивши їх з колоніального активу на віддалену частину нашої нації, з дуже обмеженою автономією.\n\nДругий варіант — спровокувати їх на відкритий конфлікт і потім продемонструвати свою силу на полі бою. Це більше ставка, але якщо ми виграємо, шлях до повної домінації відкритий, і ми можемо забрати всі їхні активи без міжнародного осуду.\n\nТретій варіант є найбільш дипломатичним: ми впроваджуємо модель, подібну до Британської імперії, надаючи [COG.GetNameDef] право стати домініоном. Їхні дипломатичні рішення все ще будуть прийматися нами, але в іншому випадку їхня автономія значно розшириться.\n\nТим не менш, ми повинні бути готові до того, що, якщо вони відкинуть будь-який із цих варіантів, то, ймовірно, не буде іншого виходу, крім насильства."
