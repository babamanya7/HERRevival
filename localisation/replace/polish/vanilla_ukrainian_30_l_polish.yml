 SWE_crusade_against_bolshevism_desc:0 "[SOV.GetNameDefCap] — це найбільша загроза традиційним європейським цінностям, яку ми бачили протягом століть. Більше недостатньо просто стримувати її, ми повинні розпочати нову священну війну проти більшовизму та знищити його."
