 CHI_defence_in_depth:0 "Ешелонована оборона"
 CHI_defence_in_depth_desc:0 "Належна оборона не може бути статичною, і ми повинні включити це в нашу стратегію. Ми знаємо, що [JAP.GetAdjective]а армія не має витривалості, тому чим більше ми зможемо їх затягнути, тим краще. Припливи та відливи битви не повинні прорвати дамби, якими є наші збройні сили."
