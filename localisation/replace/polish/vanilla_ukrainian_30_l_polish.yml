 LIT_promote_falange_militancy:0 "Підтримати фалангістських бойовиків"
 LIT_relocate_iron_wolf_recruitment_desc:0 "«Залізний вовк» покладається на місцевих вербувальників, щоби залучити нових людей до своїх лав. Примусово перемістивши цих вербувальників, ми заплутаємо всіх можливих послідовників і, можливо, запобіжимо їхньому входженню в групу «Залізного вовка»."
 LIT_subject:0 "$OVERLORDADJ$а $LIT$"
 LIT_unify_the_military_desc:0 "Деякі литовські військові зацікавилися Вольдемарасом та його воєнізованою групою «Залізний вовк» настільки, що вистачить одного запрошення, щоб майже вся армія перейшла під крило цієї організації. Тоді ми нарешті зможемо усунути Смєтону з уряду та повернути собі Литву!"
 LOADING_TIP_143:0 "«Тепер я — Смерть, руйнівник світів».\n(Роберт Оппенгаймер після випробування «Трініті»)"
