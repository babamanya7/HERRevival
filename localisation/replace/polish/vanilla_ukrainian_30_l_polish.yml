 AAT_Sweden.39.b:0 "$AAT_Sweden.38.a$"
 AAT_Sweden.8.t:0 "11 осіб, заарештованих біля Ріксдагу, відпущено"
 AAT_Sweden_BoP.11.a:0 "Соціальна рівність не може бути досягнута із буржуями на чолі держави."
 AAT_Sweden_BoP.11.d:0 "Ми забули, що значить бути шведами. Треба розширити патріотичну освіту."
 AAT_Sweden_flashpoints.33.a:0 "$AAT_Sweden_flashpoints.31.a$"
 AAT_Sweden_flashpoints.39.b:0 "Продовжуйте тиснути. Ми можемо отримати доступ до їхніх мереж зв'язку."
 AAT_Sweden_flashpoints.70.desc:0 "Наші нещодавно придбані в держави [ITA.GetName] кораблі щойно вийшли з порту. Подорож до держави [SWE.GetNameDef] займе близько місяця через потребу підзаправки на шляху."
 AAT_Sweden_flashpoints.70.t:0 "Куплені кораблі покидають [ITA.GetAdjective]і порти"
 AAT_Sweden_flashpoints.82.t:0 "[SWE.GetName] погоджується"
 AAT_Sweden_nationalists.11.t:0 "Сільська підтримка зростає"
 AAT_Sweden_nationalists.17.t:0 "Звичайний королівський візит до провинції [FROM.FROM.GetName]"
 AAT_Sweden_nordic_defense_council.1.c:0 "Ми долучимося як інтегровані члени ради"
 AAT_Sweden_nordic_defense_council.2.desc:0 "[FROM.GetName] вирішили долучитись до нашого союзу. Принаймні, тепер ми не самотні."
 AAT_USA_events.03.desc:0 "[FROM.GetLeader] від держави [FROM.GetNameDef] закликає нас виконати наші обіцянки та повернути Фарерські острови, як було домовлено, тепер, коли вони знову вільні від гніту."
 AAT_finland_continuation_war.08.b:0 "Цього разу вони легко не відбудуться!"
 AAT_finland_diplomacy.04.a:0 "Ми поважаємо їхнє рішення."
 AAT_finland_diplomacy.04.desc:0 "Наші тріумфуючі дипломати повернулися з відрядження в державу [FROM.GetName], але їм, схоже, не вдалося переконати [FROM.GetAdjective]ий уряд у користі об'єднання. Співрозмовники не стали пояснювати свою відмову детально, і тепер наші урядовці гадають, якими ж будуть наслідки такого результату.\n\nМожливо, нам слід посилити свою оборону на випадок, якщо наміри сусідів стануть менш добрими, або ж забезпечити їхню... співпрацю іншими засобами."
 AAT_finland_diplomacy.09.desc:0 "Ми отримали чудові новини: держава [From.GetName] проявила мудрість і вирішила дати нам прямий контроль над своїми багатими на ресурси регіонами. Наша армія готується заступити на охорону цих земель, а наші провідні промисловці почали будувати плани використання ресурсів."
 AAT_finland_diplomacy.14.b:0 "Та ким вони себе уявили?"
 AAT_finland_kinship_war_rebellion_crushed_sov_tt:0 "§GКарельські бунтівники були придушені, не встигнувши організувати повстання§!"
 AAT_finland_misc_events.06.desc:0 "[FROM.GetName] визнає, що розвиток Скандинавії призведе до процвітання населення і збільшить вигоди від спільної оборони і торгівлі. Першим кроком на шляху до цієї мрії стане збільшення можливостей колективної оборони, покликаної відвести від нас іноземні загрози. У зв'язку з цим [FROM.GetName] пропонує нам промислове устаткування і фахівців, які допоможуть нам посилити виробництво військового спорядження."
 AAT_finland_national_defense.01.a:0 "Це ні до чого не призведе."
 AAT_finland_national_defense.01.desc:0 "Наша розвідка доповідає, що у Фінляндії схованки зі зброєю по всій території області [?FIN_state_with_weapon_caches.GetName]. Варто очікувати значних труднощів під час проведення військових операцій і більш агресивного місцевого опору. Залежно від досягнутих результатів ми можемо зіткнутися з аналогічними проблемами в інших фінських регіонах."
 AAT_finland_the_white_death.4.a:0 "Потрібно допомагати народу дізнатися про сучасного фінського героя"
 AAT_nordic_cooperation.3.t:0 "Держава [FROM.GetName] відхилила нашу пропозицію про допомогк"
 AAT_nordic_cooperation.4.desc:0 "Наші нордичні сусіди надіслали делегацію, яка шукає інвестиції для подальшого розвитку своєї економіки. Це, безумовно, буде корисно і для нашого промислового сектору, але ми повинні переконатися, що підтримуємо дружнього сусіда, а не можливого ворога."
 AAT_nordic_cooperation.8.t:0 "Держава [FROM.GetName] прийняла нашу угоду"
 AAT_nordic_shared.3.a:0 "Чудові новини!"
