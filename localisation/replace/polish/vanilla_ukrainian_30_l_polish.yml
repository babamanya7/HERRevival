 raid_type_JAP_pearl_harbor_strike_desc:0 "Відправивши групу бомбардувальників для удару по головному військово-морському штабу й флоту ворога в Тихому океані, ми зможемо підняти моральний дух нашого народу, завдавши нищівного удару по бойовому духу та морських силах супротивника. Завдяки цьому наш флот зможе вільно діяти протягом 6 місяців!"
 raid_type_lock_bombing_raid_no_bba:0 "$raid_type_lock_bombing_raid$"
 raid_type_nuclear_strike:0 "Ядерний удар"
 raid_type_thermonuclear_missile_strike_desc:0 "Ракета дальнього радіусу дії вийде на суборбітальну балістичну траєкторію з визначеного місця запуску в напрямку наміченої цілі. У відповідний момент на борту ракети відбудеться термоядерний вибух боєголовки."
 rail_way_plural:0 "Залізниці"
 rank4_desc:0 ""
 rapid_domination_shock_and_awe:0 "Шок та трепіт"
 recruit_in_australia:0 "Створити океанічний відділ"
 refuse_the_tribute_desc:0 "Радянські вимоги знекровлюють нашу країну. Ми не можемо допустити, щоби наші так звані «товариші» нас так експлуатували."
 regia_marina_short_desc:0 "§LПобудуйте більше верфей, щоби збільшити виробництво кораблів.§!"
 regional_anti_communist_faction:0 "Щит проти червоної загрози"
 reject_second_united_front_tt:0 "§RChoosing this option means the Second United Front will not form§!"
 remove_support_in_state_4:0 ": §HМісцева підтримка§! §Y-4§!\n"
 remove_support_in_state_6:0 ": §HМісцева підтримка§! §Y-6§!\n"
 repair_ship_hull:0 "Ремонтний корабель"
 repel_invaders_desc:0 "На нашу країну підступно напали, і в цей самий час злісний ворог топче наші поля і руйнує наші міста! Зберемося з силами і дамо йому гідну відсіч!"
 rescue_mussolini_infiltration_desc:0 "Спеціально обраний загін зануриться на планери і висадиться ближче до того місця, де за вказівками нашої розвідки тримають Муссоліні."
 romania.1.t:0 "[FROM.GetNameDefCap] вимагає Бессарабію"
 romania.2.d:0 "Німеччину залучили як посередника в нашій територіальній суперечці з Угорщиною, і на Другому Віденському арбітражі було вирішено, що Північна Трансільванія має бути повернута під контроль Угорщини. Чи мусимо ми прийняти це рішення?"
 romania.6.c:0 "Нам слід залишитися нейтральними."
 rule_group_geographical:0 "Географія"
 russo_mexican_diplomacy:0 "Російсько-мексиканська дипломатія"
