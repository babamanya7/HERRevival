 SOV_recruit_general_opposition:0 "Залучити генерала до своєї справи"
 SOV_recruit_general_opposition_tt:0 "Один генерал або фельдмаршал стає відданим нашій справі."
 SOV_reinforce_western_naval_bases_desc:0 "Балтійський флот дуже вразливий у своїх базах. Ми мусимо інвестувати певні ресурси в захист його якірних стоянок і покращити його ремонтні можливості."
