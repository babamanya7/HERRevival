 JAP_spread_revolutionary_flames_to_west_asia_desc:0 "Полум'я революції поширюється далеко і широко, а наші успішні кампанії надихають пролетаріат усюди. Ми повинні почати фінансувати революційні групи в Західній Азії, щоб дестабілізувати регіон і залучити їх до П'ятого Інтернаціоналу."
