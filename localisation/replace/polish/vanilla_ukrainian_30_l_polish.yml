 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "Танк було винайдено в Британії, тож Республіканський танковий полк мусив би бути оснащений найліпшими у світі танками, але наразі це не так"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "Королівський танковий полк"
 ENG_SH_battleship_1_desc:0 "Centurion — клас гіпотетичних важких лінійних кораблів Королівського флоту, побудованих для протидії великим суднам німецького та японського флотів. Великі 18-дюймові гармати та товста броня забезпечують кораблю необхідну вогневу міць і захист для боротьби з цими суднами. Потужне зенітне озброєння, велика дальність і хороша швидкість були необхідні для покриття величезних морів Британської імперії."
 ENG_amphibious_mechanized_equipment_1:0 "Terrapin"
 ENG_anti_air_equipment_2:0 "QF 40 mm Bofors"
 ENG_artillery_equipment_3:0 "BL 5.5-inch Medium Gun"
 ENG_british_commonwealth_air_training_plan:0 "План вишколу пілотів Британської Співдружності"
 ENG_crush_the_dream:0 "Розбити Мрію"
 ENG_cv_fighter_equipment_3:0 "Fairey Firefly"
 ENG_declare_american_monarchy:0 "Проголосити американську монархію"
 ENG_decolonization_desc:0 "Це кінець епохи, але кінець за нашою настановою. Замість страждати від приниження, марно борючися проти нестримного зростання рухів за незалежність, ми високо підняли голови та з гордістю вели тих, хто перебував під нашим захистом, як могли. Тепер залишилося лише розірвати решту зв'язків і привітати наших колишніх підданих на світовій арені як рівних."
 ENG_democratic_subject:0 "$OVERLORDADJ$а Британія"
 ENG_fascism_subject_DEF:0 "$OVERLORDADJ$ий протекторат Британія"
 ENG_global_defense_desc:0 "Захист британського народу починається із запобігання поширенню того, що власне загрожує йому. Ми мусимо знайти вуглинки конфлікту і загасити їх, перш ніж вони перетворяться на пожежу, яка пошириться далеко і широко, спалюючи нас у наших домівках."
 ENG_god_save_the_king:0 "God save the King"
 ENG_gw_tank_equipment:0 "Mark V"
 ENG_heavy_tank_equipment_3:0 "Churchill Black Prince"
 ENG_imperial_conscription_desc:0 "Ми довго нехтували багатством людських ресурсів, які надає наша імперія. Настав час кардинально покращити призов на військову службу по всій імперії та забезпечити достатню кількість людей для ведення війни. Всі мусять виконати свій обов'язок перед короною!"
 ENG_imperialist_south_africa_neutrality_ADJ:0 "Імперіалістично-південноафриканськ"
 ENG_install_american_monarchy:0 "Установити американську монархію"
 ENG_jet_fighter_equipment_2_short:0 "Vampire"
 ENG_light_tank_aa_equipment_3:0 "Valentine (зенітний)"
 ENG_light_tank_artillery_equipment_1:0 "Birch"
 ENG_light_tank_equipment_1_short:0 "Vickers II"
 ENG_light_tank_equipment_2_short:0 "Matilda"
 ENG_modern_tank_equipment_1:0 "Centurion"
 ENG_motion_of_no_confidence_desc:0 "Нинішній уряд зазнав невдачі у своїх спробах розрядити світову кризу, що насувається. Будь-які подальші спроби зробити це зараз — лише ознаки слабкості. Ми потребуємо сильнішого лідерства, щоб пережити прийдешній шторм."
 ENG_raised_home_guard_here_already_flag:0 "Місцеву самооборону вже було створено в цій області"
 ENG_renew_support_for_imperialist_coup_in_canada_tt:0 "Канада матиме 90 днів на придушення повстання до того, як воно відбудеться.\n"
 ENG_replace_government_in_canada_communism_desc:0 "Народ Канади готовий змінити уряд на... більш прихильне до нашого комуністичного правління."
 ENG_replace_government_in_new_zealand_communism_desc:0 "Народ Нової Зеландії готовий змінити уряд на... більш прихильне до нашого комуністичного правління."
 ENG_socialist_science_pool_desc:0 "Ми мусимо координувати обмін технологічними знаннями, щоб усі наші союзники могли скористатися нашими досягненнями, а ми — їхніми. Тільки так боротьба робітників матиме успіх."
 ENG_submarine_2_desc:0 "Човни класу «T», або «Triton», були розроблені для заміни великих підводних човнів класу «O», «P» та «R». Це були помірно великі підводні човни з великою дальністю, які добре підходили для Атлантичного та Тихого океанів. Ці човни були добре озброєними, стійкими платформами і широко використовувалися під час конфлікту, оскільки 25 відсотків побудованих човнів було втрачено під час війни."
 ENG_support_imperialist_coup_in_canada:0 "Влаштувати імперіалістичне повстання в Канаді"
 ENG_support_imperialist_coup_in_south_africa_desc:0 "Настав час підтримати лоялістів у Південній Африці, які готуються розпалити повномасштабну громадянську війну."
 ENG_suppress_imperialist_coup_in_australia:0 "Придушити імперіалістичне повстання"
 ENG_trade_unions_demand_increase_in_paid_leave_mission:0 "Профспілки вимагають збільшити оплачувану відпустку"
