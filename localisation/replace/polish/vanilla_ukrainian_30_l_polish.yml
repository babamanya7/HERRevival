 PRC_medium_tank_equipment_2_short:0 "Type 41"
 PRC_national_leadership_desc:0 "Без Чана Кайші вже ніхто не намагається завадити об'єднанню. Буде цілком розумно, якщо керівна роль нового уряду залишиться за нами."
 PRC_neighboring_SOV_tt:0 "§Y[ROOT.GetName]§! повинна мати прямий або непрямий (через §Yчленів альянсу§!) кордон із §Y[SOV.GetName]§!"
 PRC_on_guerilla_warfare:0 "Про партизанську війну"
