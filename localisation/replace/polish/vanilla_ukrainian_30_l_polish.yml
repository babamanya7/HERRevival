 NOR_a_warden_king:0 "Король-наглядач"
 NOR_artillery_equipment_1:0 "Kongsberg 12 cm felthaubits/m32"
 NOR_claims_on_scotland_desc:0 "До того, як Шотландія була частиною Сполученого Королівства, вона була лише заднім двором наших предків. Заберімо її з тих слабких рук, які ледве стримують її коріння вікінгів, і знову блукаємо узбережжям і горами Північної Британії."
 NOR_compromise_with_the_nkp_desc:0 "Оскільки безпека нашої країни, здається, висить на краю прірви, можливо, компроміс із Комуністичною партією Норвегії та їхні глибоко вкорінені зв'язки зі сталінізмом можуть допомогти нам отримати допомогу [SOU.GetNameDef]. Це, звичайно, краще, ніж майбутнє підкорення фашистів чи капіталістів."
 NOR_convoy_bombing_desc:0 "Що менший торговельний флот ворога, то сильнішим може бути наш величезний флот. Якщо ми підірвемо їхній корабель, ми зможемо переломити хід війни."
 NOR_decision_emergency_production_title:0 "Аварійне виробництво в області [FROM.GetName]"
 NOR_decision_take_over_state_title:0 "Захоплення області [FROM.GetName]"
 NOR_defend_finland_desc:0 "Ми не можемо дозволити мерзенному [SOU.GetName] скористатися гордою нацією [FIN.GetName]. Ми повинні підняти зброю проти тиранії режиму, який прикидається за людей, але лише топче їх. Фінляндія повинна залишатися незалежною."
 NOR_democratic_party:0 "РП"
 NOR_democratic_preparation_decisions_category_desc:0 "Нашій молодій нації потрібно багато чого наздогнати, якщо ми хочемо конкурувати зі світом загалом. Десятиліття нехтування та роки великої депресії призвели до того, що наша галузь опинилася в жалюгідному стані; виправлення цього потребуватиме узгоджених зусиль.\n\nНа жаль, це обійдеться ціною нашої військової готовності та оборонних можливостей, але ми віримо, що наша політика повного та беззбройного нейтралітету продемонструє нашу добру волю та будь-яких ворогів, які безпечно оглядають нашу територію. \n\n\n Загальний розвиток [NOR.GetName]: [?NOR.NOR_country_preparedness]/30"
 NOR_destroyer_1_desc:0 "The four Draug-class destroyers were the first multi-vessel class of destroyers built for the Royal Norwegian Navy. They were commissioned just before World War I and displaced 580 tons. They were armed with three 3 in. British QF guns in their main armament. They were fairly slow, however, even compared to other destroyers of their vintage."
 NOR_foment_resistance_in_state:0 "Розпалити опір в області [FROM.GetName]"
 NOR_invite_german_engineers:0 "Запросити фашистських інженерів"
 NOR_mio_trait_trondhjems_mekaniske_vaerksted:0 "Trondhjems Mekaniske Værksted"
 NOR_modify_air_force_dmod_TT:0 "Змінює §Y$NOR_army_air_force_dmod$§! на:"
 NOR_norwegian_planes_desc:0 "Ми були свідками того, що сьогоднішні союзники можуть стати завтрашніми загарбниками, з цієї причини ми не можемо покладатися на іноземні держави щодо наших літаків, їхнє значення на сучасному полі битви є надто великим."
 NOR_print_more_money_desc:0 "Наша початкова фінансова система ще не повністю оговталася після суворої ощадливості важких тридцятих років, ми повинні використати всі наявні в нашому розпорядженні інструменти, щоб запобігти погіршенню ситуації, зокрема друкувати більше готівки, яка може циркулювати в країні."
 NOR_recruit_norwegian_refugees:0 "Набір норвезьких біженців"
 NOR_reichskommissariat:0 "Райхскомісаріат Норвегія"
 NOR_ship_torpedo_sub_2:0 "4x 450-мм торпедний апарат"
 NOR_submarine_4:0 "Клас «Utsira»"
 NOR_the_kings_no_desc:0 "Наш король Гокон VII відхилив прохання нашого ворога про підкорення. [NOR.GetName] — це не земля, а народ, і [NOR.GetAdjective]ий народ продовжуватиме воювати, навіть коли всю їхню землю буде захоплено."
 NOR_the_stumbling_storting:0 "Спотикання у Стортінгу"
