 AIR_TITLE_FIGHTER:0 "Винищувачі"
 AIR_VIEW_DETECTION_DESC:0 "Чим вище §Yповітряне виявлення§! в області, тим легше знайти й атакувати ворожі літаки. Це впливає на кількість літаків, які беруть участь у бою."
