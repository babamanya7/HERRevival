 SPR_primo_de_rivera_speech_mission_desc:0 "Хосе Антоніо Прімо де Рівера, один із засновників Іспанської Фаланги, планує виступити із запальною промовою, залучаючи людей під прапори націоналістів і підбурюючи до громадянських заворушень."
