 lar_align_belgium.2.a:0 "Вони вчинили розумно."
 lar_concessions_to_italy.2.t:0 "[From.GetLeader] погоджується"
 lar_concessions_to_italy.3.desc:0 "Наша пропозиція не знайшла підтримки в [From.GetAdjective]ому уряді. Всі погодилися з тим, що [ITA.GetNameDef] може бути корисним союзником, але [From.GetAdjective]ий уряд не зміг змиритися з тим, що для альянсу потрібно розлучитися з територією."
 lar_congress_of_paris.5.b:0 "Жодна пустеля, скільки завгодно велика, не варта і краплі іспанської крові."
 lar_end_the_occupation.2.t:0 "Окупація завершується"
 lar_end_the_occupation.3.a:0 "Час прийшов: ми і [FRA.GetLeader] маємо об'єднати сили!"
 lar_intervention_in_greece.3.a:0 "Це голос страху."
 lar_news.1.b:0 "Ці фанатики продовжують жити у Середньовіччі..."
 lar_news.10.c_2:0 "Та нехай вони подавляться своєю перемогою!"
 lar_news.26.a:0 "Слава імператору!"
 lar_news.26.b:0 "Ця імперія піднімається, щоби знову впасти."
 lar_news.27.b:0 "Прекрасна ініціатива іберійських народів."
 lar_news.4.d:0 "Так собі «французький уряд»."
 lar_news.9.e:0 "У Європі зростає ще одна загроза."
 lar_non_intervention.2.a:0 "У нас немає причин сумніватися в чесності глави держави, чи не так?"
 lar_portugal_iberian_summit.7.a:0 "Будемо сподіватися, це того варте..."
 lar_portugal_navy_mutiny.5.a:0 "Подивимося, в якому стані ці кораблі..."
 lar_portugal_purchase_ships.4.a:0 "Добре."
 lar_spain.16.desc:0 "Військові лідери Другої республіки після недавніх військових поразок і скорочення контрольованої ними території до малої частки півострова повалили уряд і почали переговори про мир. В результаті піднялося чергове комуністичне повстання, але республіканці придушили його і, не маючи інших варіантів, погодилися на беззастережну капітуляцію. Хоч це і значно спростило нам війну, ми, як і раніше, боремося з ворогами, що залишилися."
 lar_spain.19.desc:0 "[From.GetAdjective] дипломати вимагають, щоби ми підпорядковували свою зовнішню політику їхній політиці, заявляючи, що «[From.GetNameDef] візьме на себе лідерство над іспанським світом» у глобальних питаннях."
 lar_spain.2.e:0 "...яку ми і виграємо завдяки відвагі робітничого класу!"
 lar_spain.37.b:0 "Отже, треба відступити."
 lar_spain.39.a:0 "Ми не можемо дозволити собі знову вплутатися у війну. Треба погоджуватися."
 lar_spain.43_tt:0 "Почнеться приготування до коронації."
 lar_spain.45.desc:0 "Як і в період між 1580 і 1640, [From.GetNameDef] пропонує об'єднати дві наші нації, які очолить [From.GetLeader]. [From.GetAdjective] дипломати просять нас подумати про тому, наскільки сильна буде на світовій арені об'єднана Іберія, очолювана єдиним лідером."
 lar_spain.54.a_tt:0 "§RЦе вплине на нашу економіку після громадянської війни!§!\n"
 lar_spain.72.t:0 "[From.GetNameDefCap] погоджується на пакт про ненапад"
 lar_spain.81.a:0 "Наш вплив у Західній Європі зростає!"
 lar_spain.83.desc:0 "За минулі кілька тижнів нашим представникам і вірним справі сталінізму міністрам і офіцерам у державі [SPD.GetNameDef] неодноразово не надавали важливу інформацію і не давали доступу до [SPD.GetAdjective] уряду та військових чиновників. відомо, що наших людей систематично видавлюють з впливових постів і що навіть нашим програмам допомоги іншим державам ставлять перепони.\n\nТакі часті «збіги» не можуть бути випадковими. перед державою [SOV.GetNameDef], з Москви вже чути заклики до каральних заходів та суворого контролю."
 lar_spheres_of_influence.2.a:0 "Ще один успіх нашої дипломатичної стратегії."
 lar_split_belgium.2.a:0 "Демократія — це чудово."
