 AFA_neutrality_party_long:0 "Династія Кандгафо"
 AFG_ally_the_young_afghans_desc:0 "Spearheaded by the intellectual Mahmud Tarzi, the Young Afghans influenced the former Amanullah Khan and drove a reformist movement that advocated for a constitutional monarchy. We should reestablish contacts with some of the democratically leaning Amanullah loyalists, and ensure their support for our new democratic government."
 AFG_arranged_expansion_modifier_tt:0 "Вартість пропозиції зменшена на §G0.55§! для Афганістану на мирній конференції."
 AFG_custail_pashtunwali_primacy:0 "Обмежити верховенство Пуштунвалі"
 AFG_darulaman:0 "Даруламан"
 AFG_emirate_fascism_DEF:0 "Королівство Афганістан"
 AFG_establish_naval_bases_tt:0 "Додати §G1§! §YВійськово-морську базу§! у випадковій прибережній області"
 AFG_expel_axis_nationals_desc:0 "Союзники звинувачують нас у потуранні їхнім ворогам через те, що громадянам войовничих націй дозволено вільно займатися своєю діяльністю в [ROOT.GetNonIdeologyName]. Хоча є мало доказів того, що вони роблять щось шкідливе для наших інтересів, ми повинні заспокоїти Союзників, вимагаючи, щоб ці люди покинули країну на час поточного глобального конфлікту."
 AFG_extend_a_hand_to_tokyo_desc:0 "Завдяки допомозі [JAP.GetAdjective] сил, нам вдалося виграти боротьбу за Афганістан. Тепер, коли [JAP.GetNameDef] прагне об'єднати та звільнити Азію, було б розумно нам знову звернутися до них."
 AFG_fascist_cw_is_over:0 "Повстання Аманулли закінчилося. (Фашисти повалили уряд та виграли громадянську війну.)"
 AFG_fruit_packing:0 "Переробка фруктів"
 AFG_industrial_events.11.a:0 "Це стане великим кроком до індустріалізації."
 AFG_industrial_events.13.b:0 "Ці ресурси будуть повернуті силою."
 AFG_industrial_events.20.t:0 "Інвестиційна можливість [FROM.GetName]"
 AFG_industrial_events.52.t:0 "[FROM.GetAdjectiveCap]ий уряд пропонує передачу території"
 AFG_industrial_events.54.desc:0 "Незважаючи на нашу ретельну маніпуляцію ситуацією вздовж кордону з [FROM.GetNameDef], їхній уряд відмовився передати нам будь-яку паштунську територію. Здається, наш єдиний шлях до захоплення території — це ескалація ситуації з погрозою військового втручання."
 AFG_industrial_events.58.desc:0 "[FROM.GetAdjective] дипломати звернулися до нас із мирною пропозицією за умови, що ми визнаємо їхній контроль над спірною паштунською територією вздовж кордону. Оскільки вони наразі займають територію, ми не маємо гарантії, що зможемо витіснити їх найближчим часом. Однак це створило б прецедент, що [FROM.GetNameDef] може поступово відхоплювати наші кордони."
 AFG_infantry_equipment_3:0 "Sterling MkI"
 AFG_khyber_pass_rifling_org_cost_reduction_1:0 "Кустарне виробництво"
 AFG_kingdom_democratic:0 "Королівство Афганістан"
 AFG_pashtunistan_ascendancy_democratic_ADJ:0 "Пуштунськ"
 AFG_pashtunistan_ascendancy_fascism_ADJ:0 "Пуштунськ"
 AFG_pashtunistan_ascendancy_fascism_DEF:0 "Пуштуністанська верховна влада"
 AFG_placeholder_1:0 "Забезпечити німецькі інвестиції"
 AFG_political_events.01.t:0 "Пропозиція об'єднання Центральної Азії"
 AFG_political_events.11.desc:0 "[FROM.GetAdjective] уряд погодився на нашу пропозицію конфедерації. Тепер ми можемо розпочати процес інтеграції наших двох політичних та економічних систем в одну. Це, сподіваємося, слугуватиме стримуючим фактором для будь-яких наших регіональних супротивників у найближчому майбутньому."
 AFG_political_events.120.t:0 "[FROM.GetNameDefCap] просить підтримки"
 AFG_political_events.150.b:0 "Вони дурні, що взагалі звертаються до нас із цим"
 AFG_political_events.159.desc:0 "Уряд [FROM.GetAdjective] відповів на наш запит і з жалем відмовляється надавати підтримку сходженню $AFG_faqir_of_ipi$ на трон. Посилаючись на занепокоєння щодо потенційних ускладнень та поточного геополітичного клімату, [FROM.GetAdjective] вирішив зосередитися на інших стратегічних пріоритетах."
 AFG_political_events_90_tt:0 "Відмикає рішення §Y[AFG_get_turkik_people_name_key]§! для усунення осередків опору в середньоазіатських штатах. §RЯкщо ми не зможемо усунути осередки опору та перебуваємо у війні з [FROM.GetNameDef], штати повстануть проти нас!§!"
 AFG_reform_3_desc:0 "Незважаючи на наші зусилля подолати розрив між новим урядом та опозицією, багато хто залишається схильним до реакційних, антидемократичних переконань, і цілком можливо, що вони можуть діяти проти нас, якщо їм дадуть можливість. Тому ми повинні робити більше для обмеження такої діяльності."
 AFG_repaying_our_friends_desc:0 "TODO"
 AFG_shadows_of_the_emir_category_desc:0 "$AFG_reinforce_the_royal_guard_desc$"
 AFG_shipyards_desc:0 "Навіть якщо ми ще не готові розробляти власні кораблі, будь-які майбутні кораблі потребуватимуть обслуговування та переобладнання. Створивши верф зараз, ми можемо забезпечити, що наші майбутні судна матимуть необхідні об'єкти для функціонування протягом десятиліть."
 AFG_turko_persian_empire_desc:0 "Оскільки більшість [TUR.GetAdjective] та [PER.GetAdjective] земель тепер міцно під нашим контролем, настав час реорганізувати наше панування в нову Тюрко-Перську імперію, для безпеки та захисту нашого великого суспільства."
