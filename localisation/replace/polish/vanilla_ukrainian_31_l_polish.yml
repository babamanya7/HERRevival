 BEL_legacy_of_the_great_war:0 "Спадщина Великої війни"
 BEL_mio_initial_trait_fn_herstal:0 "Виробник стрілецької зброї"
 BEL_mobilize_the_nation_desc:0 "Фортифікації — це не єдине, що ми маємо підготувати, адже сама популяція може стати нашою найбільшою перевагою. Під час останньої війни наш народ мужньо чинив опір загарбникам, давайте використаємо ту саму пристрасть і закличемо наших людей до оборони."
 BEL_moi_dabord:0 "Моїм першим!"
 BEL_pressurized_cabin_development_desc:0 "З метою покращення якості авіаперевезень між Бельгією та Конго, ми працюємо над розробкою пресуризованих кабін, що дозволять нам літати набагато вище, ніж це зазвичай можливо. Адаптація цієї технології до наших військових літаків значно покращить їхні можливості."
