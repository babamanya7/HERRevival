 TUR_turk_silahli_kuvvetleri_desc:0 "Наші збройні сили — вже не виснажений зброд, у який перетворила їхня жахлива Війна за незалежність, але справжня сучасна армія. Ми такі сильні, що готові захопити світ. І ми пишаємось своїми успіхами."
