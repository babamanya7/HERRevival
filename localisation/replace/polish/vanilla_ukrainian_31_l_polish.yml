 tfv_australia.70.d:0 "Стверджуючи, що нездатність держави [Root.GetNameDef] захистити свої колоніальні володіння в Південно-Східній Азії матиме катастрофічні наслідки для національної оборони держави [From.GetNameDef], і [From.GetLeader] попросив [From.GetAdjective]ий уряд надати повну незалежну відповідальність за оборону регіону.\nХоча це і не є прямою вимогою, зростання [From.GetAdjective]ого стратегічного та військового впливу в регіоні має певний сенс. Противагою є нещодавнє політичне дистанціювання від нас, яке прийняла держава [From.GetNameDef].\nЦе буде угода з можливим партнером, а не суб'єктом, і де-факто залишить колонії з наших рук, якщо [From.GetNameDef] вирішити зробити це так."
 tfv_australia.90.desc:0 "[AST.GetLeader] поїхав до Британії, щоб узяти участь у коронаційній церемонії короля Георга VI та королеви Єлизавети. Після кількох тижнів обідів, вечерь, вечірок у саду, прийомів і ще більше вечерь, йому нарешті вдалося отримати приватну аудієнцію з новим королем. Після обміну люб'язностями та світської бесіди, тема розмови переходить до політики, і король запитує, чим він може допомогти державі [AST.GetNameDef]."
 tfv_australia.92.a:0 "$tfv_australia.90.a$"
 tfv_new_zealand.6.desc:0 "[JAP.GetAdjectiveCap]ий уряд навіть не потрудився надати нам офіційну відповідь на наш запит. Подейкують, що в [JAP.GetAdjective]их урядових колах його розглядають із великим сміхом."
 tfv_raj.32.a:0 "Боротьба продовжується."
 tfv_south_africa.12.e:0 "$tfv_south_africa.11.e$"
 tfv_south_africa.4.d:0 "Після довгих роздумів британський уряд знайшов компроміс щодо оборони африканських колоній. Згідно з цією новою схемою, колонії відповідатимуть за власну оборону, але матимуть більшу свободу в управлінні власними справами."
 tfv_south_africa.51.a:0 "Дуже вдячні."
 tfv_south_africa.83.d:0 "Звільнившися з-під влади колоніальних гнобителів, [CAR.GetAdjective]ий народ готовий узяти на себе відповідальність за власну долю. Він сформував тимчасовий уряд і розробив проєкт конституції. Залишилося лише передати владу від наших військових губернаторів до нового [CAR.GetAdjective]ого уряду."
 tfv_south_africa.86.t:0 "Свобода для держави [NGR.GetName]"
