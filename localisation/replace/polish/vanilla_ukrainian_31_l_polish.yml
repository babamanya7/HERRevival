 faction_goal_the_greater_game_desc:0 "Імперії прагнули нав'язати свою волю Центральній Азії і були відбиті. Настав наш час знову просуватися на захід і через степи."
 faction_goal_west_subjugated_desc:0 "Якщо ми докладемо узгоджених зусиль для інтеграції цієї частини нашого альянсу, решта мілітаристів зрозуміє, куди дме вітер, і підкориться."
 faction_rule_modifier_encourage_liberate_tt:0 "§G20%§! зниження вартості для §Yвизволення§!\n§R5%§! збільшення вартості для §Yзахоплення областей§!"
 faction_set_goal_rules:0 "Налаштування цілей"
 fake_intel_plant_evidence_desc:0 "Ми влаштуємо невелику операцію в районі, контрольованому противником, але не потрібному нам, і спеціально залишимо там докази."
 far_eastern_states_coring_states_tt:0 "Усі §Yдалекосхідні§! землі стануть осердними."
 field_engineering_sapper_fieldcraft:0 "Саперна польова майстерність"
 fighter_equipment_2_desc:0 "У міру того як ми застосовуємо нові технології до вже відпрацьованих схем, розвиток винищувачів іде небаченими темпами. Нам потрібен винищувач, який відрізняється високою швидкістю, маневреністю на великих висотах та максимальною дальністю польоту. Крім того, він має нести потужне озброєння."
 film_bismarck:0 "Bismarck"
 finland.6.d:0 "Наше прохання до шведського уряду про спільну оборону Оландських островів було задоволене з більшим успіхом, ніж ми очікували. Швеція приєдналася до нас у війні проти Радянського Союзу, відмовившись залишатися нейтральною перед обличчям такої явної загрози. Незважаючи на внутрішні розбіжності, тепер вони будуть боротися з нами пліч-о-пліч, щоб забезпечити подальший суверенітет Фінляндії."
 finland.9.t:0 "[From.GetNameDefCap] відмовляється"
