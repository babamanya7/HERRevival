 MEX_cristero_neutrality_ADJ:0 "Мексиканськ"
 MEX_focus_capital_reserves_desc:0 "Тверда готівка, яку ми отримуємо від продажу нафти, дозволяє нам напружувати наші економічні м'язи. Якщо нам потрібно купувати технології в Америці чи Британії, наприклад, у нас зараз є засоби. Ми можемо провести зворотний інженерний аналіз або масове виробництво цих конструкцій, як вважаємо за потрібне."
 MEX_focus_heavy_artillery:0 "Важка артилерія"
 MEX_focus_institutional_revolution:0 "Інституційна революція"
 MEX_focus_knights_of_columbus_desc:0 "Під час Війни крістерос, коли зловживання чинилися з обох сторін, міжнародне братство Лицарів Колумба втрутилося, щоби допомогти нам. Спочатку вони таємно збирали пожертви для фінансування та озброєння крістерос. Після того, як мексиканські єпископи дезавуювали повстання, лицарі агітували в американського уряду провести переговори, які зрештою поклали край війні."
 MEX_focus_new_world_order:0 "Новий світовий порядок"
 MEX_focus_redeem_aztlan_desc:0 "Мексиканський народ, який живе у звільнених регіонах Сполучених Штатів, мріє про уряд, який не пригнічуватиме їх за походження, місце народження чи мову, якою вони розмовляють удома. Ця мрія стала реальністю."
 MEX_focus_synarchist_communes_desc:0 "Тепер, коли уми людей врятовано від «революціонерів» і вірні стікаються назад до повторно освячених церков, наш економічний план можна реалізувати. Нові одиниці виробництва дозволять вірним служити національній справі та Церкві, відчуваючи при цьому почуття єдності у вірі та розумі."
