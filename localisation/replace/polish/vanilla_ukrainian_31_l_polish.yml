 INSHOL_eventual_autonomy_desc:0 "Прагнення індонезійців до незалежності сильне і не слабшає. Ми погодимося на остаточну автономію для Ост-Індії, але тільки після того, як колонія доведе, що може утримувати себе сама і продовжуватиме дотримуватися демократичних ідеалів."
 INSHOL_eventual_autonomy_req_tt:0 "Успішно виконано щонайменше §Y4§! місії Фольксрааду"
 INSHOL_peg_indies_guilder_to_dutch_guilder:0 "Прив'язати гульден Ост-Індії до голландського гульдена"
 INSHOL_prioritize_dutch_profits_desc:0 "Ми зосередимо наші зусилля на збільшенні прибутків для батьківщини. Їхня економічна стабільність йде на благо всього Королівства."
 INSHOL_subsidize_bauxite_desc:0 "Поточний проєкт в Ост-Індії з модернізації багатих на боксити островів Банка-Белітунг є дуже перспективним, а потенціал для довгострокового прибутку високий. Ми повинні підтримати уряд Ост-Індії економічними субсидіями, щоб прискорити виконання проєкту."
 INS_all_cards_into_industry_desc:0 "Індустріалізація мала величезний вплив на економіку [1058.GetName]. Якщо ми індустріалізуємо весь острів з його десятками мільйонів громадян, ми зможемо стати впливовими у глобальному масштабі."
 INS_centralize_the_state_1_tt:0 "Необхідні регіони, які є §Yнаціональними§!:"
 INS_commander_sudirman:0 "Армія Судірмана"
 INS_communist_events.8.a:0 "З'ясуйте, хто розповсюджує цей бруд!"
 INS_denounce_soetardjo_tt:0 "Ми розпочнемо підготовку до підпільної революції, проникаючи в уряд і створюючи партизанські осередки по всьому архіпелагу. Коли ми будемо достатньо підготовлені, ми почнемо партизанську війну за незалежність проти голландців."
 INS_escalate_the_conflict:0 "Ескалювати конфлікт"
 INS_expand_resistance_membership:0 "Розширення членства в Опорі"
 INS_fate_of_de_javasche_bank_scripted_desc_colony:0 "Гульден Ост-Індії перебуває у вільному падінні відтоді, як вибухнула депресія, і De Javasche Bank бракує інструментів, щоб зупинити цей спад. Ми повинні вирішити, як стабілізувати нашу валюту, перш ніж залишки довіри інвесторів випаруються остаточно."
 INS_gradual_escalation_HOL:0 "Поступова ескалація"
 INS_industrial_events.36.t:0 "Партія нафти відправлена"
 INS_industrial_events.4.a:0 "Ми побудуємо нафтові свердловини в [FROM.FROM.GetName]"
 INS_industrial_events.6.desc:0 "Хінне бюро прийняло наші умови. Оскільки малярія спустошує половину тропіків, а замінника хініну не видно, у них було мало вибору. Нова угода гарантує нам значно більшу частку прибутку від кожного грама хініну, який покидає наші береги. Тепер питання в тому, куди спрямувати цей несподіваний прибуток."
 INS_instigate_chaos_sulawesi_tt:0 "Коли ми проголосимо незалежність, ми отримаємо §Gщитову територію§! на §Y[673.GetName]§! та §Y[1056.GetName]§!. Голландська Ост-Індія більше не матиме там щитових територій."
 INS_integrate_sarekat_islam_desc:0 "Великі ісламські політичні партії мають значну підтримку населення. В наших інтересах інтегрувати їх в уряд."
 INS_launched_feint_uprising:0 "Наразі активне інше відволікаюче повстання."
 INS_light_tank_artillery_equipment_1:0 "Pantsergeschut 1"
 INS_light_tank_equipment_3_short:0 "PVT-5"
 INS_limited_war_events.8.a:0 "Тоді нехай буде так."
 INS_loyalist_events.21.a:0 "Ми запам'ятаємо це."
 INS_loyalist_events.25.t:0 "[FROM.GetNameDefCap] пропонує об'єднання"
 INS_loyalist_events.28.a:0 "Народ повинен мати своє слово."
 INS_loyalist_events.29.a:0 "Це цікава пропозиція."
 INS_maphilindo_neutrality_ADJ:0 "Малайськ"
 INS_medium_tank_artillery_equipment_1:0 "Pantserhouwitser 3"
 INS_medium_tank_destroyer_equipment_3_short:0 "TJ-6"
 INS_medium_tank_equipment_3:0 "Gevechtstank 6"
 INS_musso_ascends_tt:0 "Відкриває §Y$INS_launch_revolution$§! у країнах із §Y30%§! або більше підтримки комуністів. Країни, в яких ми розпалюємо революції, залишаться незалежними."
 INS_netherlands_can_remove_autonomy_tt_150:0 "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -150.00§!"
 INS_peta_explain_tt_jap:0 "§R[INS.GetName] може залишатися лояльною до нас, але якщо ми почнемо втрачати контроль над територією, вони можуть розкрити наш блеф і проголосити незалежність§!."
 INS_pledge_to_allies_desc:0 "Ми ризикуємо зазнати вторгнення як частина зростаючого конфлікту в усьому світі. Хоча наші відносини з Союзниками були хиткими, ми утвердилися як демократична держава в Тихому океані і повинні об'єднатися з великими демократичними державами."
 INS_political_events.13.desc:0 "Солдати з [?event_target:INS_invasion_event_invader.GetName] прибули до [?event_target:INS_invasion_event_invaded_state.GetName], і наші солдати в цьому районі, значно поступаючись чисельністю, отримали наказ розпочати повну військову евакуацію [?event_target:INS_invasion_event_invaded_state.GetName]. Сили [?event_target:INS_invasion_event_invader.GetAdjective] продовжують просуватися в Індії, і наші шанси уникнути окупації виглядають похмуро. Крім того, наші шпигуни повідомляють, що [?event_target:INS_invasion_event_invader.GetLeader] вів переговори з Сукарно та іншими націоналістичними лідерами, маючи на меті створити індонезійську маріонеткову державу на чолі з Сукарно в рамках Сфери співпроцвітання."
 INS_political_events.16.desc:0 "Сили [?event_target:INS_invasion_event_invader.GetAdjective] в Індії співпрацювали з індонезійськими націоналістами для дестабілізації нашої колоніальної адміністрації і повністю окупували Індію. Голландські прапори були спущені і замінені індонезійськими, а місцеві жителі Індії, здається, приймають окупантів [?event_target:INS_invasion_event_invader.GetAdjective]. Для нашої колоніальної імперії все виглядає не дуже добре."
 INS_political_events.8.a:0 "Ми заарештуємо націоналістів і будемо захищати наш дім до смерті!"
 INS_prepare_for_policy_shift_desc:0 "Політичний ландшафт в Ост-Індії зазнав впливу національного пробудження останніх десятиліть, і наша нинішня політика вочевидь застаріла. Ми повинні подумати про внесення деяких змін до нашої структури управління."
 INS_realign_supply_chains_time_reduce_30_tt:0 "Зменшує час відновлення рішень §Y$INS_realign_supply_chains_cat$§! на §Y30§! днів."
 INS_revolution_events.22.desc:0 "[HOL.GetLeader] закликав до зустрічі з [FRA.GetLeader] в Амстердамі для обговорення поточної ситуації в Індії. Під час зустрічі [HOL.GetLeader] пояснив, як революціонери почали озброювати ополчення такими темпами, з якими голландська армія не може зрівнятися, і що [HOL.GetNameDef] ризикує втратити свою колоніальну гегемонію. [HOL.GetLeader.GetHeShe] попросив(ла), щоб ми формально приєдналися до конфлікту на боці голландців і надіслали дивізії до Батавії, щоб допомогти відвоювати Індію. В обмін ми отримаємо право на північно-східну Суматру, коли порядок буде відновлено."
 INS_revolution_events.34.t:0 "[FROM.GetNameDefCap] погоджується на посередництво"
 INS_revolution_events.36.desc:0 "Американці відхилили наше прохання про посередництво. Вашингтон вирішив підтримати своїх європейських союзників, а не підтримувати нашу боротьбу за самовизначення. Ми залишилися самі. Це гіркий удар, але революція почалася не тому, що ми очікували, що іноземні держави подарують нам свободу."
 INS_revolution_events.37.t:0 "[USA.GetNameDefCap] висуває ультиматум"
 INS_set_leader_to_INS_syarif_kasim:0 "Обрати $INS_syarif_kasim$"
 INS_soviet_economic_integration_desc:0 "Революція дала нам свободу, але сама по собі свобода не будує фабрик і не годує маси. Радянський Союз пропонує те, чого не запропонує жодна капіталістична держава: промисловий досвід, кредити на розвиток і торгівлю на умовах, які не супроводжуються колоніальними ниточками. Ми були б дурнями, якби відмовилися."
 INS_spend_profits_on_military_desc:0 "Після остаточного узгодження нашої нової угоди про хінін, ми отримуємо можливість значно покращити нашу армію, витративши наш додатковий дохід на будівництво та обслуговування нових збройових заводів у Джок'якарті та Семаранзі."
 INS_sukarnos_industrialization2:0 "Кожен має відігравати свою роль"
 INS_volksraad_events.61.desc:0 "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_legalize_displaying_flag:0 "Легалізувати демонстрацію червоно-білого прапора"
 INS_we_will_need_another_tt:0 "Оскільки ми вже контролюємо всю Яву, нам потрібно буде контролювати ще один регіон на додаток до Яви."
 INS_win_condition_base_republic_real:0 "Знищити Ост-Індію"
 INTEL_NETWORK_STRENGTH_IN_STATE:0 "Області під впливом розвідки: $INFLUENCED|H$/$CONTROLLED|H$"
