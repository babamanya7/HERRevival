 INTERNATIONAL_MARKET_EQUIPMENT_FILTER_ARTILLERY:0 "§YАртилерія§!"
 INTERNATIONAL_MARKET_FILTERED_COUNTRY:0 "Фільтрувати за державою $COUNTRY|Y$"
 INTERNATIONAL_MARKET_MARKET_ACCESS_OVERVIEW_TITLE:0 "Доступ до ринку"
 INTERNATIONAL_MARKET_OTHER_STOCKPILE:0 "Держава $COUNTRY|Y$ виставила $AMOUNT|0Y$ од. $EQUIPMENT|Y$ на ринок."
 INTERNATIONAL_MARKET_REQUEST_AUTOMATION_AUTO_ACCEPT_MARKET_ACCESS_DESC:0 "Автоматично приймати §Yобговорення доступу до ринку§!"
 INTERNATIONAL_MARKET_SUBSIDIES_OVERVIEW_DESCRIPTION:0 "Оберіть, за якими §Yринковими субсидіями§! Ви хочете відсортувати."
 INTERNATIONAL_MARKET_SUBSIDIES_OVERVIEW_TITLE:0 "Ринкові субсидії"
 INTERNATIONAL_MARKET_SUBSIDIES_OVERVIEW_TITLE_YELLOW:0 "§YРинкові субсидії§!"
 IN_STOCKPILE:0 "$EQUIPMENTNAME|H$ у запасах"
 IRE_fascism_party_long:0 "Національна корпоративна партія"
 IRE_neutrality_DEF:0 "Вільна Ірландія"
 IRQ_align_afghanistan_fasc:0 "Запросити Афганістан"
 IRQ_arab_free_legion_cat:0 "Вільний арабський легіон"
 IRQ_assasination_of_sidqi:0 "Вбивство Бакра Сідкі"
 IRQ_bakr_sidqi_coup_desc:0 "Нинішній режим слабкий та заблуканий. Під керівництвом Бакра Сідкі ми повалимо його та забезпечимо незалежне майбутнє для народу [ROOT.GetNonIdeologyName]."
 IRQ_commander_of_the_faithful_desc:0 "Тепер, коли ми взяли на себе місію об'єднання арабських народів під нашим правлінням, розумно залучати їх до нашої справи. Абд аль-Ілах може прийняти титул Амір аль-Мумінін, який колись носив Хусейн бін Алі аль-Гашімі."
 IRQ_expand_oil_production_desc:0 "Геологи вважають, що по всій нашій країні є велика кількість нерозвіданих запасів нафти. Такі ресурси можуть генерувати величезні суми багатства для нашого народу, і їх потрібно експлуатувати якнайшвидше."
 IRQ_hashemite_arab_federation_neutrality_DEF:0 "Гашімітська Арабська Федерація"
 IRQ_invest_in_ordnance_mountain_howitzers:0 "Інвестувати в артилерійські гірські гаубиці"
 IRQ_kurdish_language_desc:0 "З нашою новознайденою незалежністю ми можемо нарешті розпочати створення системи освіти, яка зосереджена навколо курдської культури та мови."
 IRQ_kurdish_outreach_desc:0 "Курди північного Іраку мають потенціал масово підірвати нашу владу над регіоном, якщо вони об'єднаються проти нас. Тому ми повинні докласти зусиль для їхньої інтеграції в ширшу іракську націю, навіть якщо це означатиме надання їм певної автономії."
 IRQ_kurdistan_events.3.t:0 "[FROM.GetNameDefCap] відмовляється допомогти нам"
 IRQ_kurdistan_tag_neutrality_DEF:0 "Королівство Курдистан"
 IRQ_political_events.11.desc:0 "На наш подив, [FROM.GetAdjective] уряд висловив лише рішучий дипломатичний протест нашому послу щодо нашого виходу з Англо-іракського договору. Здається, наразі нам не потрібно боятися будь-яких серйозних наслідків з боку [FROM.GetAdjective]."
 IRQ_political_events.27.t:0 "[FROM.GetNameDefCap] приймає членство у Федерації"
 IRQ_political_events.42.b:0 "У нас є інші засоби захоплення землі."
 IRQ_political_events.44.a:0 "$IRQ_political_events.40.a$"
 IRQ_political_events.75.a:0 "Чудово"
 IRQ_proclaim_united_arab_republic_desc:0 "Наші мрії про панарабську націю починають збуватися. Ми повинні скористатися нагодою та оголосити про створення Об'єднаної Арабської Республіки та згуртувати народ навколо нашої справи."
 IRQ_religious_resistance_desc:0 "З Великим Муфтієм під нашим захистом, ми зможемо співпрацювати з ним, щоб розпалити опір по всьому арабському світу проти гнітючих західних режимів, які були нам нав'язані."
 IRQ_support_the_allied_war_effort_desc:0 "Незалежно від того, чи готові наші люди це прийняти, наше майбутнє лежить із націями Союзників світу. Ми повинні продемонструвати нашу прихильність їхній справі та зайняти позицію у новому світовому порядку, що формується."
 ISR_sp_rockets_ballistic_missile:0 "Проєкт «Jericho I»"
 ITA_albanian_fascist_militia_spawn_divs_tt:0 "Створити §Y3§! дивізії §YCamicie Nere§! в області §Y[THIS.GetName]§!."
 ITA_albanian_oil_desc:0 "Настав час замінити наше застаріле обладнання, яке використовувалося на старій нафтовій концесії в Албанії, та перетворити її на потужну нафтовидобувну галузь тепер, коли ми маємо повний контроль над країною."
 ITA_anti_tank_equipment_1:0 "Cannone controcarro da 37/45"
 ITA_bend_the_bars:0 "Зігнути ґрати"
 ITA_bop_concesions_to_the_bourgeoisie:0 "£BoP_right_texticon Поступки перед буржуазією"
 ITA_bop_condemn_fascism:0 "£BoP_left_texticon Засудити фашизм"
 ITA_bop_praise_the_navy_desc:0 "Мужні чоловіки та жінки, які служать у нашому флоті, є основою безпечної та стабільної держави [ITA.GetName]. Вони заслуговують на обожнювання італійського народу!"
 ITA_carrier_effort:0 "Розвиток авіаносців"
 ITA_ceded_destroyers:0 "Передади нам італійські есмінці"
 ITA_characters_will_be_spared_tt:0 "§YНаступні персонажи не потраплять під чистку:§!"
 ITA_combined_land_and_air_warfare_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_ARMY_ORG$: §G+5.0%§!\n$MODIFIERS_ARMY_ARMOR_ATTACK_FACTOR$: §G+5.0%§!\n\n"
 ITA_communism_low_control_range:0 "Низький комуністичний вплив"
 ITA_conspiracies_in_the_shadows:0 "Змови в тіні"
 ITA_conspiracies_in_the_shadows_desc:0 "Дехто у владних кабінетах дедалі частіше пошепки висловлює своє невдоволення Муссоліні. Плетуться змови та формуються альянси між людьми, які зазвичай мають мало спільного. Час змін швидко наближається."
 ITA_crush_the_mafia:0 "Розбити мафію"
 ITA_expand_naval_intelligence_desc:0 "Італійська радіорозвідка вже багато років працює з невеликим бюджетом, покладаючися на неабиякі таланти Джорджо Веріти Поети та Луїджі Доніні. Але так може тривати лише до певного часу. Забезпечивши їх більшим штатом і залучивши нових талантів, як-ось лейтенанта Елізо Порто, ми матимемо більше шансів зламати ворожі коди та виявити місцезнаходження їхніх сил."
 ITA_fighter_equipment_1:0 "Macchi C.200 Saetta"
 ITA_heavy_fighter_equipment_3_short:0 "SM.92"
 ITA_human_torpedo_raid:0 "Рейд керованих торпед"
 ITA_integrate_polizia_dell_africa_italiana_spawn_units_italy_tt:0 "Створити §Y2 піхотні§! дивізії, §Y1 кавалерійську§! дивізію й §Y1§! дивізію §Yверблюдової кавалерії§!."
 ITA_italian_highways_desc:0 "Ми мусимо розширити нашу інфраструктуру, щоби забезпечити легку мобільність військ по всій Імперії. З ворогами в кожному куточку світу це є важливою частиною здатності захистити всю італійську землю."
 ITA_latin_initiatives:0 "Латинська ініціатива"
 ITA_libyan_infrastructure_bba_desc:0 "Враховуючи важливість Лівії як бази операцій в Північній Африці, ми мусимо докладати постійних зусиль для поліпшення її інфраструктури, щоби мати можливість оперувати там великими угрупованнями військ, якщо в цьому виникне необхідність."
 ITA_litoranea_balbo_default:0 "Litoranea Balbo"
 ITA_midget_submarines_desc:0 "Прозорі води Середземного моря небезпечні для великих підводних човнів. Будівництво невеликих і малопомітних човнів малої дальності може збільшити їхні шанси на виживання в середземноморському середовищі та надати нам сили, необхідні для патрулювання таких важливих вузьких місць, як Сицилійський канал."
 ITA_military_cooperation_acceptance:0 "Військова співпраця"
 ITA_military_cooperation_desc:0 "Ми мусимо укласти угоди про військову співпрацю з нашими союзниками, якщо хочемо перемогти в цьому світі, адже великі держави, які нас оточують, з повною впевненістю є ворогами пролетаріату."
 ITA_ministry_of_italian_africa_occupation_law_tt:0 "Відкриває закон окупації для §Yафриканських§! областей:\n"
 ITA_missiolini_occupy_ticino_desc:0 "Відколи Ганнібал перетнув Альпи зі своїми слонами, гори стали для варварів дорогою вглиб Італії. Ми повинні захистити наш північний кордон."
 ITA_missiolini_occupy_ticino_occupation_effects:0 "\n[846.GetName] та кожна [SWI.GetFlag][SWI.GetAdjective]а осердна земля, повністю підконтрольна державі [ROOT.GetFlag][ROOT.GetNameDef]:\n   Підпорядкування: §G+5.0%§!.\n   Спротив: §G-5.0%§!.\n\nПоточні ефекти:"
 ITA_missiolini_strengthen_the_army_desc:0 "Як і давня Римська імперія, наша зростаюча імперія простягається вшир і вглиб і потребує сильної армії, щоб захистити її від орд варварів, що стоять одразу за кордонами."
 ITA_modernize_ansaldo_facilities_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+5.00%§!\n$MODIFIER_EQUIPMENT_UPGRADE_XP_COST$: §G-15%§! \n\n"
 ITA_motorized_equipment_1:0 "Fiat 626"
 ITA_new_corporations:0 "Нові корпорації"
 ITA_new_ricostruzione_industriale_motorized:0 "$ITA_new_ricostruzione_industriale$ (мотопіхота)"
 ITA_new_roman_citizens_desc:0 "Надання громадянства корінному населенню наших колоній, безумовно, допоможе нам отримати схвалення та співпрацю з місцевими жителями."
 ITA_novus_ordo_create_units_tt:0 "Створити §Y[ROOT.GetFlag][ROOT.GetAdjective]і§! частини в підконтрольній лівійській області в володінні:"
 ITA_paramilitary_training_desc:0 "Настав час розширити нашу добровольчу організацію та поліпшити їхій військовий вишкіл. Ми залучатимемо видатних офіцерів із наших елітних підрозділів для навчання новобранців та керівництва підрозділами чорносорочників."
 ITA_power_balance_lost_core_5:0 "$ITA_power_balance_lost_core_1$"
 ITA_reggianes_exports_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-1.0%§!\n\n"
 ITA_reorganize_ascari_desc:0 "Реорганізувавши війська аскарі, ми зможемо посилити їх, зробивши більш грізною силою."
 ITA_ship_armor_bb_3:0 "330-мм пояс/162-мм палуба"
 ITA_special_brigades_desc:0 "Ми сформуємо спеціальні штурмові бригади, здатні підтримати наші військові частини в бою під час великих наступальних операцій. Ці бригади будуть сформовані з ополченців, які відзначилися у своїх підрозділах."
 ITA_strengthen_the_blackshirts_desc:0 "Королівська армія занадто пов'язана методами старих режимів і неодноразово демонструвала тривожний брак фашистського завзяття. Зрозуміло, що нам потрібно мати цілі дивізії, що складаються з наших власних, вірних чорносорочників."
 ITA_supremacy_in_the_skies_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$\n$MODIFIER_AIR_SUPERIORITY_EFFICIENCY$: §G+5%§!\n$MODIFIER_AIR_INTERCEPT_EFFICIENCY$: §G+5%§!\n$MODIFIER_AIR_SUPERIORITY_BONUS_IN_COMBAT$: §G+5.0%§!\n\n"
 ITA_the_fourth_shore_desc:0 "Лівію часто називають четвертим узбережжям Італії, і вона є невід'ємною частиною майбутнього нашої країни. Це найближча колонія й одна з найцінніших, адже вона слугує сполучною ланкою з рештою Африканського континенту. Інвестовуючи сюди ресурси, ми захистимо наші заморські володіння й отримаємо значні прибутки в майбутньому."
 ITA_the_italian_confederation_effects_tt:0 "Додати §G1§! комірку для будівництва й §Y1 цивільний завод§! у столиці.\nКраїна приєднається до §Y[ROOT.GetFlag][ROOT.GetAdjective]ого альянсу§!."
 ITA_train_irregulars_eritrea_tt:0 "Створити §Y1 дивізію нерегулярної піхоти§! й §Y1 дивізію кавалерії§!."
 ITA_train_irregulars_ethiopia_tt:0 "Створити §Y1 дивізію нерегулярної піхоти§! й §Y1 дивізію верблюдової кавалерії§!."
 ITA_transport_plane_equipment_3:0 "Fiat G.212"
 JAG_neutality_pact_focus_days_tt:0 "Поточна кількість днів: [?JAP_soviet_japanese_neutrality_pact_flag:days|Y0]"
 JAP_EQUIPMENT_VERSION_6:0 "Kai F"
 JAP_STATE_648:0 "Мінаміторішіма"
 JAP_adopt_new_air_doctrine_desc:0 "Тепер, коли ми зіткнулися з ворогами, що мають такі ж технологічні можливості, як і ми, ми зрозуміли, що також повинні модернізувати наші бойові доктрини, щоб не відставати."
 JAP_aizawa_trial_ongoing_desc:0 "Підполковник Сабуро Айзава наразі перебуває під домашнім арештом, поки триває судовий процес щодо вбивства ним офіцера Тецузана Нагати. Однак, оскільки процес перетворився на медіа-сенсацію, а судді вступають у змову з його фракцією і перетворюють суд на трибуну для проголошення їхньої ідеології, зрозуміло, що він не отримає реального вироку. Як основний член Кодоха, якщо група збирається діяти, вони не зроблять цього, доки не закінчиться домашній арешт Айзави."
 JAP_anti_air_equipment_2_short:0 "20-мм кулемет, тип 2"
 JAP_armored_divisions_desc:0 "Багато країн вже усвідомили всю силу танкових дивізій. Ми мусимо не відставати: потрібно розробити більш сучасні види техніки, які дозволять нам бити ворога швидко та сильно."
 JAP_border_conflict_escalate_conflict_desc:0 "Конфлікт на кордоні з державою [FROM.GetNameDef] зупинився. Можливо, продовжуючи ескалацію та надсилаючи більше військ на театр, ми все одно зможемо досягти перемоги."
 JAP_border_conflict_escalate_to_war_desc:0 "Бойові дії в спірному регіоні тривають уже деякий час і не мають ознак припинення. Ми повинні бути готові зробити наступний крок і розглядати цей конфлікт як перший крок у загальній війні."
 JAP_border_conflict_warning_SOV_desc:0 "На нашому спільному кордоні в Кореї сталася сутичка між нашими прикордонниками та японськими солдатами. Джерела розвідки в Японії повідомляють, що це може бути лише першим кроком у більшій конфронтації. Треба негайно зміцнити кордон з Японією."
 JAP_civilian_nuclear_reactor_investments_desc:0 "Як визначили наші вчені з інституту РІКЕН, ядерна енергія стане енергією майбутнього. Ми повинні інвестувати в цю нову технологію, щоб нам ніколи більше не довелося спалювати вугілля."
 JAP_democratic_work_with_the_zaibatsus:0 "Співпрацювати з Дзайбацу"
 JAP_democratic_work_with_the_zaibatsus_desc:0 "Найбільші корпорації нашої країни довгий час мали безпрецедентну політичну та економічну владу. З певною вправністю ми, можливо, зможемо працювати пліч-о-пліч з ними і спрямовувати їхні зусилля на нашу користь."
 JAP_eastern_road_and_steel_expansion_desc:0 "Для сприяння розширенню наших шахт і промисловості в Маньчжурії ми повинні заснувати Корпорацію розвитку східних доріг. Як тільки це буде досягнуто, видобувні станції будуть створені в Тєчанцзи, Удаоцзяні та Шиженьгоу, а офіси з видобутку залізної руди будуть створені в Даліцзи та Цідаогоу."
 JAP_emperor_hirohito_under_house_arrest_flag:0 "§YХірохіто§! поміщений під §Yдомашній арешт§!"
 JAP_establish_mongol_military_government_desc:0 "Князь Де, нащадок великого Чингісхана, займає впливову позицію в раді Байлінмяо — маріонетковому керівництві Гоміньдану у Внутрішній Монголії. Він бажає повернути монголам їхню колишню славу і буде більш ніж готовий стати на наш бік у формуванні Монгольського військового уряду, якщо ми пообіцяємо задовольнити його амбіції."
 JAP_expand_ashigaru_tt_2:0 "Збільшує межу набору ополчення на 1"
 JAP_expand_banner_recruitment:0 "Розширити набір ашігару"
 JAP_expand_the_metropolitan_police_tt:0 "§G2§! §Yгенерали§! стануть лояльними до нас"
 JAP_formalize_the_tonarigumi_tt:0 "Відкриває рішення §Y«Організувати Тонарігумі»§! у наших суб'єктах"
 JAP_full_sovereignty_for_the_philippines_desc:0 "Перехід до самовизначення має продовжити свій шлях Азією. [USA.GetNameDefCap] продовжують контролювати Філіппіни, і ми маємо чинити тиск, нагадавши про демократичні права філіппінського народу."
 JAP_ichiro_hatoyama_focus:0 "Прем'єрство Ічіро Хатоями"
 JAP_imperial_arsenals_desc:0 "Посилення імперського контролю за оборонною промисловістю значно підвищить ефективність роботи — і, як наслідок, її результати."
 JAP_imperial_influence_ruler_title:0 "[GetImperialInfluenceRulerTitle]"
 JAP_imperial_navy_medium_control_range:0 "Strong Navy Influence"
 JAP_implement_army_reforms_tt:0 "§RВидаляє§! можливість отримати модифікатори §YПринцип першого удару§! та §YКантай Кессен§!, що пропонуються фокусом §YПлан оборони Імперії§!"
 JAP_improved_radio_communications:0 "Покращити радіозв'язок"
 JAP_incorporate_buddhist_socialism:0 "Впровадити буддійський соціалізм"
 JAP_intervene_in_china:0 "Інцидент на мості Марко Поло"
 JAP_jet_fighter_equipment_2:0 "Kyushu J7W Shinden-Kai"
 JAP_kalkin_gol:0 "Випробування радянців"
 JAP_kozaha_party_long:0 "Лекційна фракція"
 JAP_light_cruiser_1:0 "Клас «Tenryu»"
 JAP_light_cruiser_3:0 "Клас «Agano»"
 JAP_limit_military_power:0 "Наполягати на обмеженні військової влади"
 JAP_male_leader_text:0 "він"
 JAP_medium_tank_destroyer_equipment_3_short:0 "Na-To"
 JAP_ministry_of_commerce_and_industry:0 "Міністерство торгівлі та промисловості"
 JAP_mio_trait_rapid_counterflooding_system:0 "Система швидкого контрзатоплення"
 JAP_modern_tank_equipment_1_short:0 "Type 61"
 JAP_modernize_agriculture:0 "Модернізувати сільське господарство"
 JAP_mountain_village_operation_units_tt:0 "Розблоковує рішення для §Yстворення партизанських загонів§! у регіонах, які повстануть, коли настане час"
 JAP_organize_the_fifth_column_flag:0 "Підготовка акту саботажу"
 JAP_organize_the_fifth_column_tt:0 "Розблоковує рішення для заохочення партизанів §Yзавдавати шкоди ворожим підрозділам§! під час громадянської війни"
 JAP_pacific_union_communism_ADJ:0 "Азійськ"
 JAP_raid_category_fluff_text_naval_commando_raids:0 "§LСпеціальні морські десантні сили (SNLF)§!"
 JAP_raise_ashigaru_active:0 " Ополчення піднято"
 JAP_raise_the_ashigaru:0 "Підняти ашігару"
 JAP_raise_the_red_flag_high:0 "Підняти високо червоний прапор"
 JAP_reeducation_campaign:0 "Кампанія з перевиховання"
 JAP_reinforce_the_beijing_garrison_desc:0 "Автономний уряд Східного Хебею було створено після того, як ми підкорили Великий Китайський мур, а Армія Східного Хебею існує для забезпечення демілітаризації регіону з [CHI.GetAdjective]ого боку. Ми повинні превентивно посилити цей підрозділ та Квантунські гарнізони в цьому районі, щоб вони не впали жертвою [CHI.GetAdjective]ої агресії."
 JAP_release_korea:0 "Корейська незалежність"
 JAP_reprimand_hamada_kunimatsu_desc:0 "У своїй промові з критикою військових у Парламенті Хамада Кунімацу зайшов надто далеко. Щоб не дозволити військовим повністю переграти цивільний уряд на політичній арені, ми повинні винести йому належну догану і продемонструвати, що ми все ще здатні до боротьби."
 JAP_request_soviet_support_desc:0 "Нам потрібна допомога в нашій нинішній громадянській війні, і найближчими ймовірними прихильниками нашої справи є Радянський Союз на нашій півночі. Можливо, ми могли б обміняти Південно-Сахалінський півострів в обмін на групу радянських добровольчих дивізій."
 JAP_social_and_cultural_revolution_tt:0 "Коли національний дух §Y$JAP_reorganization_of_society_idea$§! буде видалено:\n"
 JAP_societal_bushido_desc:0 "Генерал Садао Аракі пов'язав стародавній кодекс самураїв Бушідо з ідеями, схожими на європейський фашизм, щоб сформувати філософську основу своєї ідеології, яка пов'язує Імператора, народ, землю і мораль як єдине і неподільне ціле. З цією метою ми повинні пропагувати кодекс Бушідо як те, чого кожен добрий громадянин повинен завжди дотримуватися."
 JAP_southern_expansion_desc:0 "Continuing the Navy's doctrine of Nanshin-ron, it is time we encroach on the imperialist and colonialists in the south and expand our domain to cover all of the southern road."
 JAP_sp_land_military_engineering_vehicles:0 "Sōkō Sagyō Ki"
 JAP_sp_land_super_heavy_railway_gun:0 "Експериментальна гаубиця 41H"
 JAP_split_uo_zaibatsu_monopolies_desc:0 "Найбільші корпорації нашої країни довгий час мали безпрецедентну політичну та економічну владу. Ми повинні нагадати їм, що вони все ще підпорядковані волі уряду, і розділити їх на менші конгломерати Кейрецу, щоб ними було легше керувати."
 JAP_strenghten_the_supply_lines_desc:0 "Наші лінії постачання розтягнуті більше, ніж ми можемо витримати, і наші війська зазнають втрат через це. Ми повинні вирішити цю ситуацію, якщо хочемо, щоб наші успіхи продовжувалися, оскільки час швидко спливає, перш ніж наші війська ослабнуть і впадуть."
 JAP_strike_down_the_great_pretender_desc:0 "Більшовики в Радянському Союзі вдають, що вони за народ, а самі тиранічно правлять частинами Азії. Ми повинні повалити цю буржуазну диктатуру, що маскується під революційну силу, і проголосити себе єдиними захисниками революції!"
 JAP_submarine_2_desc:0 "Підводні човни класу «Kaidai VI» були великими і добре озброєними субмаринами з великою дальністю плавання і відносно хорошою швидкістю. Вся серія підводних човнів «Kaidai» була стабільними і успішними човнами, які служили в Імперському флоті до кінця Тихоокеанської війни."
 JAP_submarine_4_desc:0 "Підводні човни класу «Sen-Toku» були найбільшими підводними човнами Другої світової війни. Це були підводні авіаносці з важким торпедним озброєнням, достатньою кількістю легких зенітних установок і, завдяки своїм розмірам і двигунам, відносно швидкісні і далекобійні. Вони могли нести три літаки Aichi M6A Seiran для розвідки і мали обмежені ударні можливості."
 JAP_supreme_council_for_direction_of_war:0 "Вища рада з керівництва війною"
 JAP_the_pacific_union_of_soviet_socialist_republics:0 "Тихоокеанський Союз Радянських Соціалістичних Республік"
 JAP_the_zero_desc:0 "Новий проєкт «Mitsubishi» може стати найкращим на сьогоднішній момент палубним винищувачем. Неймовірна маневреність разом із солідною дальністю дії довгі роки залишатиметься актуальною. Потрібно негайно розпочати складання прототипу та підготовку до виробництва."
 JAP_to_reach_princess_kaguya_desc:0 "У «Повісті про бамбукоруба» Кагуя-хіме, принцесу з Місяця, знаходять немовлям усередині сяючого стебла бамбука. Наприкінці казки Кагуя-хіме розкриває своє небесне походження і повертається на Місяць. Тепер, коли технології доступні нам, ми повинні зробити все можливе, щоб дістатися до неї знову."
 JAP_tora_tora_tora_desc:0 "Перший удар чекає. Після цього ми повинні продовжувати стрімко, використовуючи набраний імпульс, щоби покалічити наших ворогів, перш ніж вони дізнаються, що сталося."
