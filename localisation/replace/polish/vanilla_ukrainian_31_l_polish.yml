 SWI_crack_down_on_dissent_desc:0 "[ROOT.GetNonIdeologyName] не може бути роз'єднаним у часи, коли одна тріщина в нашому суспільстві може призвести до краху [ROOT.GetAdjective]ого уряду."
 SWI_democratic_party:0 "Федеральні збори"
 SWI_embrace_communism_desc:0 "Тепер, коли все готово, ми мусимо діяти швидко і скористатися цією єдиною в житті можливістю перетворити державу [ROOT.GetNonIdeologyName] на рай для робітників."
 SWI_expand_covert_operations_desc:0 "Ми можемо збільшити наші шпигунські ресурси, щоб впливати на світові справи на свою користь, зберігаючи при цьому видимість нейтралітету."
 SWI_expand_federal_police_intelligence_desc:0 "Ворог ховається в тіні і може прийняти будь-яку форму, включаючи форму нашого власного населення. Ось чому Відділ розвідки Федеральної поліції повинен мати інструменти для придушення інакомислення, де б воно не було."
 SWI_expand_special_forces:0 "Розширити ССО"
 SWI_fortify_border_with_france_desc:0 "Незважаючи на їхню відданість демократичним цінностям і давні дружні стосунки, ми не можемо ігнорувати можливість того, що [FRA.GetName] може вторгнутися на територію [ROOT.GetAdjective], щоби здійснити таємну атаку на [GER.GetNonIdeologyName] або [ITA.GetNonIdeologyName]."
 SWI_fund_resistance_groups_desc:0 "Європейські нації воювали між собою та підкоряли людей на всіх інших континентах протягом століть. Обов'язок людей [ROOT.GetAdjective] — допомогти жертвам невпинних воєн на нашому континенті, даючи їм інструменти, щоби розірвати кайдани та визначити власне майбутнє."
 SWI_improve_deployment_speed:0 "Збільшити швидкість розгортання"
 SWI_industrial_production:0 "Промислове виробництво"
 SWI_integrate_refugees_into_the_army:0 "Інтегрувати біженців в армію"
 SWI_militarization_drive_desc:0 "Ми можемо перенести наш фокус на розширення [SWI.GetAdjective]ої військової машини, щоби ми могли захистити себе і, можливо, навіть перехопити ініціативу і випередити їхні наступи."
 SWI_military_readiness_decisions_category:0 "Швайцарські громадянські ополчення"
 SWI_national_defense_fund_desc:0 "Захист країни вимагає не тільки поту та праці, нам також потрібні кошти для імпорту обладнання та сировини, необхідної для підготовки до найгіршого. Створення та сприяння фонду, куди [ROOT.GetAdjective] громадяни можуть добровільно робити внески, дозволить нам компенсувати будь-яке збільшення військового бюджету, і це демонструє [ROOT.GetAdjective] ставлення до участі."
 SWI_neutrality_decisions_disabled_TT:0 "Рішення §Y$SWI_absolute_neutrality_decisions_category$§! будуть вимкнені."
 SWI_purchase_fascist_planes_fighters_desc:0 "Захист неба над державою [ROOT.GetName] не може чекати, поки ми матимемо можливість виробляти власні військово-повітряні сили, тому поки що нам доведеться залежати від держави [FROM.GetName] щодо наших винищувачів."
 SWI_request_italian_alps_occupation:0 "Попросити [ITA.GetAdjective]у окупацію"
 SWI_seek_allied_trade_desc:0 "Оскільки навколо нас вороги, нам потрібно забезпечити життєво важливу торгівлю з союзниками, щоб вижити. Якщо нам пощастить, ми зможемо уникнути гніву інших наших сусідів за те, що вони прагнуть тіснішої торгівлі з їхніми суперниками."
 SWI_spirit_of_saint_bernard_desc:0 "З незапам'ятних часів ми пишаємося нашими медичними традиціями та бажанням допомогти людям, які цього потребують. Госпіс Великого Святого Бернарда й організація Червоного Хреста є тому свідченням. Тепер цей дух можна озброїти та переорієнтувати на ополчення, щоби зміцнити наші оборонні зусилля."
