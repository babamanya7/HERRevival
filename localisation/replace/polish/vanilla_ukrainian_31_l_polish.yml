 adu_mediterrenean_emirates_desc:0 "У часи розквіту мавританського впливу на Середземномор'ї на островах було розташовано багато ісламських еміратів. Тепер, коли Сицилія, Крит і Кіпр знаходяться в руках Андалусії, ми можемо знову повернути ці території їхнім законним мавританським володарям."
 advanced_ship_torpedo_launcher_desc:0 "Труби збільшеного діаметра дозволяють використовувати більші і, як наслідок, більш потужні торпеди.\n\nУстановка цього модуля на §Yлегкі кораблі§! та §Yкрейсери§! дозволяє завдавати істотної шкоди ворожим §Yосновним кораблям§!."
