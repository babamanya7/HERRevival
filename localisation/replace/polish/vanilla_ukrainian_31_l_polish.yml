 AST_a_controversial_recruitment_desc:0 "Моріс Блекберн — відомий юрист-соціаліст, знаний тим, що захищав права робітників у судових баталіях проти репресивних роботодавців. Будучи членом Лейбористської партії, його лояльність була поставлена під сумнів через зв'язки з більш радикальним Рухом проти війни та фашизму."
