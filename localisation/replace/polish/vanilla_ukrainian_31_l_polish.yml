 SWE_centralized_military_aid_desc:0 "Нам потрібно вдосконалити військовий потенціал наших країн та країн-членів. Інвестиції у виробництво озброєння забезпечать наші армії засобами для захисту наших кордонів."
 SWE_decentralized_nordic_army_command_desc:0 "Централізація армійського командування Радою оборони Нордичних країн спричинила б занадто багато конфліктів інтересів для командування. Єдиною гарантією національної безпеки кожної країни-члена є збереження контролю над своїми силами."
 SWE_economic_independence_desc:0 "Хоча ми вдячні за [GER.GetAdjective]у підтримку у нашій славетній революції, ми не маємо наміру ставати ще однією з їхніх провінцій. Щоб відновити нашу економіку, нам потрібно структурувати її таким чином, щоб сприяти економічній незалежності понад усе."
 SWE_establish_politburo_desc:0 "Буржуазії та аристократії, позбавленої влади, більше немає. Таким чином, ми розпустимо останній слід їхнього впливу, Ріксдаг. На його місці ми створимо новий робітничий уряд."
 SWE_gengas_effect:0 "Базовий приріст пального: §G+30%§!"
 SWE_greater_nordic_reich_DEF:0 "Велика Нордична імперія"
 SWE_greater_nordic_reich_desc:0 "Лише завдяки силі ми довели, що ми є беззаперечними господарями Скандинавії. Але це лише початок для нашого народу. Коли ми об'єднаємось разом як одна Ріке, світ повинен підготуватися до того, що має статися."
 SWE_greater_nordic_reich_tt:0 "Дозволяє відбирати національні території та анексувати §Yнордичні§! маріонетки"
