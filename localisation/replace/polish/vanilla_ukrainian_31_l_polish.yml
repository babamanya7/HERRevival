 BUL_ff_impending_coup_mission:0 "Неминучий переворот §YВітчизняного фронту§!"
 BUL_fight_alongside_country_comrades_desc:0 "Ми мусимо підтримати наших товаришів з держави [FROM.GetNameDef] і виступити на їхньому боці у [FROM.GetAdjective]ій громадянській війні."
