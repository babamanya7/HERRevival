 ENG_imperial_conference_decision:0 "Імперська конференція"
 ENG_imperial_loyalist:0 "Імперський лояліст"
 ENG_jet_tac_bomber_equipment_2_short:0 "Canberra"
 ENG_medium_tank_destroyer_equipment_1_short:0 "Cavalier"
 ENG_nav_bomber_equipment_2_short:0 "Albacore"
 ENG_no_further_appeasement_desc:0 "Умиротворення провалилося, і продовжувати цю політику зараз — нерозумно. Зрозуміло, що наші вороги не відступлять і вимагатимуть дедалі більше. Ми мусимо зупинити їх зараз, поки не дали їм ще більше переваг."
 ENG_operation_3:0 "Operation Jester"
 ENG_organize_the_blackshirts_desc:0 "Успіх Британського союзу фашистів залежить від його публічного іміджу. Ми можемо продемонструвати дух єдності та особисту силу нашого руху, проводячи марші на військову тематику по всій країні. Ми залучимо більше прихильників, одночасно примусивши опозицію до бездіяльності. Кінцевою метою буде марш на саму Даунинг-стріт із закликом до зміни керівництва."
 ENG_regnalname_george:0 "Георг"
 ENG_request_trade_union_war_propaganda_support_desc:0 "Нам потрібна допомога профспілок, щоб підготувати народ до неминучої війни — профспілки повинні підтримати уряд, що готується до неї."
 ENG_secure_the_oil_imports:0 "Убезпечити імпорт нафти"
 ENG_send_the_home_guard_back_home:0 "Надіслати місцеву самооборону додому"
 ENG_sp_land_military_engineering_vehicles:0 "Hobart's Funnies"
 ENG_spoke_out_against_us:0 "Висловилися проти нас"
 ENG_suppress_imperialist_coup_in_canada:0 "Придушити імперіалістичне повстання"
 ENG_tackle_fascism_desc:0 "Фашизм — головна загроза для робітничої справи. Ми мусимо зосередитися на тому, щоб усунути це згубне явище з обличчя Європи."
