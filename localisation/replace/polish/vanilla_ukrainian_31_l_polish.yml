 DEN_anti_tank_equipment_3:0 "75mm Fodfolkskanon m1943"
 DEN_ask_for_weapons_desc:0 "Наші [?DEN.DEN_overlord_nation.GetAdjective] володарі продовжують виснажувати наші запаси зброї та боєприпасів, підриваючи нашу здатність дати відсіч, коли прийде день знову проголосити нашу незалежність. Ми могли б попросити наших союзників скинути нам необхідні припаси, щоб поповнити наші порожні запаси."
 DEN_baltic_sea_domination:0 "Домінація на Балтиці"
 DEN_bop_occupation_defend_collaboration_desc:0 "Капітуляція [?DEN.DEN_overlord_nation.GetNameDef] і співпраця з [?DEN.DEN_overlord_nation.GetNameDef] були єдиним правильним вибором! Це позбавило нас жахів і руйнувань, які ми не можемо осягнути."
 DEN_build_a_modern_dannevirke:0 "Побудова сучасного Данневірке"
 DEN_cic_to_overlord_10_or_more_tt:0 "§Y$DEN_occupation_laws_dynamic_modifier$§! забезпечує щонайменше §G+10.00%§! цивільної промисловості для володаря"
 DEN_contribute_to_the_war_desc:0 "Незважаючи на те, що ми чітко висловили свою позицію та наміри щодо наших [?DEN.DEN_overlord_nation.GetAdjective]их господарів, вони не дозволять нам розвивати нашу армію далі. Лише приєднавшись до [?DEN.DEN_overlord_nation.GetFactionName] і пообіцявши зробити свій внесок у військові зусилля, ми зможемо покращити нашу армію, флот і військово-повітряні сили. А з підтримкою [?DEN.DEN_overlord_nation.GetNameDef] ми могли б звернути свої погляди на решту скандинавських країн..."
 DEN_demand_weapon_deliveries:0 "Запит на доставку зброї"
 DEN_democratic_venstre_party_long:0 "Ліві"
 DEN_expand_the_resistance_desc:0 "Хоча з початку окупації з'явилося багато різних груп опору з усіх прошарків суспільства, ми повинні об'єднати ще більше людей в ці групи, якщо ми коли-небудь сподіваємося відбити сили [?DEN.DEN_overlord_nation.GetAdjective] з наших земель."
