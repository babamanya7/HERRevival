 ARG_bastion_of_democracy_desc:0 "Ми досягли великих успіхів у дотриманні ідей демократичної нації та пройшли довгий шлях з часів наших небезпечно корумпованих виборів. У міру того, як по всьому світу наростає війна, ми повинні стати бастіоном миру та взяти на себе зобов'язання захищати менші нації цього континенту."
