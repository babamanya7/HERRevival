 ARG_reach_out_to_the_great_powers_desc:0 "Один із варіантів, який ми маємо для покращення нашої економічної ситуації, — це звернутися до великих держав світу та взяти кредити для прискорення нашого відновлення. Ми повинні бути обережними, оскільки не хочемо мати більше боргів, ніж на початку."
