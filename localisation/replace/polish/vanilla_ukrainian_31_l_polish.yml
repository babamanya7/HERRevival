 ICE_death_from_above_desc:0 "Якщо ми виграємо війну в повітрі, ми виграємо війну, і виграємо її швидко. Ще швидше, якщо ми посилимо співпрацю між нашими повітряними та сухопутними військами і підготуємо спеціальні парашутно-десантні полки, які будуть готові знищувати ворожі лінії постачання, де це тільки можливо."
 ICE_infiltrating_the_british_isles_desc:0 "Революційне полум'я повинно поширюватися, якщо ми не хочемо, щоб воно задихнулося і згодом згасло. Очевидною ціллю для звільнення є пригноблені робітники Британських островів.[ROOT.GetNameDefCap] має допомогти робітникам у пригноблених регіонах повстати проти своїх імперіалістичних та капіталістичних панів. Разом ми можемо зробити революційні ідеали реальністю для простих робітників."
 ICE_international_research_community_desc:0 "Ми можемо багато чому навчитися в інших, як через комуністичний інтернаціонал, так і через інші спільні проєкти з країнами по всьому світу. Взаємодіючи з міжнародною спільнотою, [ROOT.GetName] досягне нових рівнів величі. Колективізм — це єдиний вірний шлях до прогресу!"
 ICE_mineral_prospecting:0 "Розвідка корисних копалин"
 ICE_organize_the_greyshirts_desc:0 "Добре озброєне ополчення, підготовлене з молоді, може бути корисним інструментом для виховання молоді та формування її відповідно до нашого нового світу. Крім того, напіввійськова підготовка також означає зміцнення потенціалу збройних сил, що може виявитися корисним при поверненні того, що належить нам по праву."
