 tier_three_threshold:0 "3-тя податкова група з високим доходом"
 tier_threshold_increase_0:0 "Підвищує вимогу до цивільних фабрик для перебування в податковій групі.\n§Y1-ша§! група: З §Y[?var:tier_two_taxes_threshold]§! до §G[?var:tier_two_taxes_threshold_plus_4]§! §YЦивільних фабрик§!"
 tizard_mission_focus_desc:0 "Ми створили багато проривних технологій, які ми не можемо використати в повній мірі через брак ресурсів та промислових потужностей. Генрі Тізард хотів би очолити делегацію на переговорах щодо укладення договору про обмін технологіями зі США."
