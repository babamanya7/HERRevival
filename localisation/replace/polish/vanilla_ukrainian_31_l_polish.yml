 FRA_reach_out_to_spain:0 "Звернутися до Іспанії"
 FRA_repeal_the_law_of_exile_desc:0 "Жодному главі французької королівської сім'ї чи їх спадкоємцям не дозволяється на французьку землю без чіткого дозволу. Перш ніж ми зможемо мати тріумфальне повернення монархії, ми мусимо позбутися цієї неприємної маленької перешкоди."
 FRA_scw_intervention_nationalists_SPA:0 "$FRA_scw_intervention_nationalists_SPR$"
 FRA_support_status_quo_desc:0 "Франція — колиска і бастіон свободи, і жодні сили не зможуть це змінити. Якщо ми хочемо знову досягти єдності, потрібно зміцнювати демократію, що похитнулася."
