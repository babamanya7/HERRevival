 HINT_ARMY_PLANNER_TEXT_1_1:0 "Це екран §Yтренування та розгортання§!. Тут можна додавати нові дивізії в чергу на тренування, а пізніше розгортання. Ми радимо додати в чергу дивізію з шаблоном §YDivisione di Fanteria§!.\n\nДивізії в черзі спершу спробують зібрати потрібне їм §Yоснащення§!. Коли оснащення буде отримане, вони почнуть тренування. прогрес тренування не може перевищити відсоток отриманого оснащення.\n\nКлацніть по кнопці §YТренувати§!, щоби додати дивізію в чергу тренування."
 HINT_DECISION_SCREEN_TEXT:0 "§YПодії§! стаються протягом усієї гри. У грі є цілий асортимент подій, які призводять до позитивних, негативних або змішаних наслідках для країни гравця. Вони приймають форму спливаючих сповіщень на екрані гравця, які можуть поставити гравця перед вибором, або просто повідомити про наслідки, змушуючи гравця визнати, що подія сталася.\n\n§YРішення§! — це довго- або короткострокові цілі, які Ви можете прагнути. Прийняття рішень коштує £pol_power §Yполітичну владу§!.\n\nДеякі рішення мають обмеження по часу й для їхнього виконання потрібно виконати певні умови впродовж визначеного часу."
 HINT_NAVAL_MISSIONS_TEXT:0 "Це віконце §Yфлоту§!, де можна переглянути та призначити наказ обраному флоту. Ви можете наказати флотам виконувати певні §Yморські завдання§!.\n\nФлот зазвичай поділений на кілька §Yоперативних груп§!. Флоти можуть бути активні в кількох регіонах зразу; оперативні групи, однак, ні. Коли флот виконує завдання, він намагатиметься покрити всі призначені стратегічні регіони, але це може розсіяти його й зробити менш організованим у бою з ворожими флотами.\n\nЩоби відправити флот на §Yморську завдання§!, клацніть на одну з виділених кнопок унизу, а далі §Gклацніть правою кнопкою миші§! на §Yстратегічний регіон§!. Непоганою ідеєю буде віддати наказ про §YПатрулювання§! якого-небудь регіону."
 HINT_WORLD_TENSION_TEXT_2:0 "£world_tension_icon£ §YСвітова напруженість§! — це міра того, наскільки загострилася ситуація у світі. У деяких держав певні §Yдипломатичні дії§! будуть заблоковані до досягнення певного рівня світової напруженості.\n\nЗагалом, фашистським і комуністичним державам вигідніше втримувати світову напруженість на низькому рівні, щоби не дозволити демократичним державам втручатися в їхні справи. Демократичні держави, з іншого боку, прагнутимуть якомога вищий рівень світової напруженості, щоб отримати можливість втручатися.\n\nОголошення війн, виправдання претензій, анексування територій, виконання певних §Yнаціональних фокусів§! — ось приклади дій, що можуть збільшити рівень світової напруженості.\n\nЩо більша світова напруженість, то ближчий світ до нової світової війни."
