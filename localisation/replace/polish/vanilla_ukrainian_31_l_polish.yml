 DOD_hungary.101.a:0 "Ми повернемося до колишніх історичних кордонів."
 DOD_hungary.101.b:0 "Краще створити маріонетковий уряд."
 DOD_hungary.108.t:0 "Словаччина під нашим контролем"
 DOD_hungary.115.desc:0 "[ROM.GetAdjectiveCap]ий уряд відмовився обговорювати статус спірних територій. У кулуарній бесіді румунський міністр закордонних справ наважився сказати нашому послу, що ми отримаємо ці землі лише ціною мільйона занапащених життів."
 DOD_hungary.121.b:0 "Саме від таких вимог ми й мусимо себе захищати!"
 DOD_hungary.126.a:0 "Поживемо — побачимо."
 DOD_hungary.145.a:0 "Німеччина."
 DOD_hungary.145.t:0 "Звернення за підтримкою"
 DOD_hungary.153.a:0 "Безперечно."
 DOD_hungary.36.t:0 "[From.GetNameDefCap] продовжує впиратися"
 DOD_hungary.45.b:0 "Ми не бажаємо вплутуватися в цей конфлікт."
 DOD_hungary.66.desc:0 "Румунський уряд відмовився прийняти умови угоди, прийнятої на конференції, що щойно завершилася. Кажуть, що [ROM.GetLeader] розірвав документ, навіть не дочитавши його до кінця, і оголосив про те, що швидше відріже собі руку, чим підпише такий принизливий папірець. \n\nУгорський уряд заявив, що готовий відстоювати свої законні землі зі зброєю в руках, але при цьому поцікавився, яку зі сторін конфлікту готові підтримати ми."
 DOD_hungary.74.desc_HUN_all:0 "Румунська сторона, схоже, горить бажанням швидше покінчити з цією проблемою. Вони відкинули наш попередній компромісний варіант і натомість запропонували віддати всю Трансільванію Угорщини. Розмовляючи з румунськими делегатами в кулуарах, наши вони зробили цю пропозицію, але вона висунута абсолютно серйозно. Нам варто її прийняти."
 DOD_hungary.81.a:0 "Чудово."
 DOD_hungary.82.t:0 "[CZE.GetName] благає про допомогу"
 DOD_hungary.91.desc:0 "\nДержава [FROM.GetNameDef] погодилася передати нам Воєводину. Наші сили взяли над нею повний контроль."
 DOD_romania.16.desc:0 "Зміни в [FROM.GetAdjective]ому уряді, хоча поки що він і [romania_former_ally_target.GetNameDef] перебувають у союзі, означають, що [ROOT.GetAdjective] ідеали стануть ближчими. [FROM.GetLeader] вже заявив, що вступ до альянсу [ROOT.GetFactionName] дуже його цікавить. Це історична можливість — ворог зараз спрямований на державу [FROM.GetNameDef] і не чекає удару в спину від [FROM.GetAdjective] військ."
 DOD_romania.30.desc_alt:0 "У Європі наростає напруженість, і [ROM.GetLeader] звертається до нас із несподіваною пропозицією: якщо ми погодимося захищати Румунію від усіх зовнішніх загроз, то матимемо право розміщувати свої війська на її території."
 DOD_romania.40.b:0 "Смерть понад безчестя!"
 DOD_romania.999.t:0 "Освідчення в коханні"
 DOD_yugoslavia.20.e:0 "Перейти на виробництво бомбардувальників, щоб виконати їхнє замовлення."
 DOD_yugoslavia.21.desc:0 "Наша закупівельна комісія в державі [From.GetNameDef] домовилася про постачання винищувачів для наших ВПС. Ми вже отримали першу партію літаків, і наші пілоти почали їх освоювати."
 DOD_yugoslavia.34.a:0 "Наше терпіння вже закінчується."
 DOD_yugoslavia.702.a:0 "[YUG.GetLeader] — боягуз і узурпатор!"
