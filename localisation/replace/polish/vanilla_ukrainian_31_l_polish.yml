 WTT_build_support_in_urumqi_desc:0 "§W§H[617.GetStateMajorityCountryName]§! має §Hбільшість в області§! й отримує [?617.state_political_support_value|+0] §Hбалів політичної підтримки§!, поки інша країна не отримає більшу §Hмісцеву підтримку§!\n\n§HМісцева підтримка§!:\n[617.GetLocalStateSupport_CHI][617.GetLocalStateSupport_PRC][617.GetLocalStateSupport_GXC][617.GetLocalStateSupport_YUN][617.GetLocalStateSupport_SHX][617.GetLocalStateSupport_XSM][617.GetLocalStateSupport_SIK]§!"
