 CZE_STATE_73:0 "Підкарпатська Русь"
 CZE_ally_hungary_desc:0 "Незважаючи на конфлікти, які шкодили нашим відносинам з [HUN.GetNonIdeologyName] з моменту народження [CZE.GetNonIdeologyName], нещодавно вони продемонстрували потенціал стати цінним союзником."
 CZE_anti_air_equipment_1:0 "ZB-60"
 CZE_armored_car_equipment_2_short:0 "Jarmila"
 CZE_bailout_moser_desc:0 "Компанія «Мозер» переживає важкі часи після Великої депресії. Її підприємства потребують фінансової допомоги, заводи мають бути знову відкриті, а звільнені люди — повернуті на роботу."
 CZE_bonus_research_slot_2_desc:0 "Обмін досвідом із союзниками дає нам серйозні переваги. Пропонується офіційно зробити цей процес постійним."
 CZE_cancel_anti_hungary_focus:0 "Відступили після [GER.GetAdjective]ого втручання"
 CZE_car_and_oil_rationing_desc:0 "Нормування приватного автотранспорту та його реквізиція за потреби дозволять нам зосередити автомобільне виробництво та нафтові ресурси на військових потребах."
 CZE_cooperate_with_the_allies:0 "Співпрацювати із Союзниками"
 CZE_cooperate_with_the_sdp_desc:0 "Хоча SdP і є дестабілізуючою силою, вона може піти на поступки, якщо її належним чином заохотити, наприклад, включивши до керівної коаліції."
 CZE_crisis_in_the_sudentenland_desc:0 "Судетські воєнізовані угруповання підняли повстання в Судетах і розпочали проти нас партизанську війну. Тривалі зіткнення з нашими військами призвели до хаосу. Ми маємо взяти ситуацію під контроль, і зробити це потрібно до того, як ворог зможе цим скористатися."
 CZE_destabilize_potential_adversaries:0 "Дестабілізувати потенційних супротивників"
 CZE_destroyer_catchup_1:0 "Прорив есмінців"
 CZE_diversify_airframe_production:0 "Диверсифікувати виробництво корпусів"
 CZE_diversify_our_specialists_desc:0 "Нам потрібно диверсифікувати наших спеціалістів за межі гірських військ. Війна ведеться не лише на гірських вершинах та пагорбах."
 CZE_enter_exile_desc:0 "З потенційними союзниками, які нарешті борються з [GER.GetAdjective]им алігатором, наш уряд може підготуватися та боротися за повернення нашого суверенітету."
 CZE_expand_existing_armory_plants:0 "Розширити існуючі збройові заводи"
 CZE_expand_the_communist_press_desc:0 "Наша газета «Червоне право» (Rudé právo) могла б слугувати для інформування тих, хто зараз не читає жодних газет, для цього потрібно лише збільшення фінансування."
 CZE_expand_the_land_department_of_vtu_desc:0 "Розширивши сухопутний відділ Військово-технічного інституту (VTÚ), вони отримають додаткове обладнання та випробувальні полігони для посилення своїх досліджень задля нашого майбутнього оснащення."
 CZE_favor_czechs_3:0 "Нові індустріальні містечка"
 CZE_for_the_homeland_desc:0 "Коли наші військові повністю готові до майбутніх випробувань, ми можемо з упевненістю сказати, що готові захищати батьківщину. Ми готові до будь-якого завдання, що стоїть перед нами."
 CZE_full_faith_in_hacha:0 "Повна віра в Гаху"
 CZE_german_minor_ally:0 "Сателіт Німеччини"
 CZE_great_moravia_ADJ:0 "Моравськ"
 CZE_healing_a_divided_nation_desc:0 "The people of our nation now know that when comes to their liberty our words are backed up with action. We can finally heal some of the wounds that have been deeply dividing our nation."
 CZE_improve_the_current_officer_pool_desc:0 "Ми будемо просувати по службі персонал, який продемонстрував здатність бути кістяком нашої армії, оскільки вони відіграють важливу роль у виконанні наглядових та координаційних функцій між вищим командуванням і місцевими підрозділами."
 CZE_integrate_sudeten_germans:0 "Інтегрувати Судетську область"
 CZE_invest_in_balkan_industry:0 "Інвестувати у [FROM.GetAdjective]у промисловість"
 CZE_invest_in_the_smaller_air_plants:0 "Інвестувати в менші авіаційні заводи"
 CZE_letov_organization:0 "$CZE_letov$"
 CZE_leverage_sokol_desc:0 "Сокільський рух був важливою організацією в нашій країні протягом десятиліть. У часи кризи ми повинні використати їх, щоб допомогти забезпечити воєнізовану підготовку та новобранців для нашої армії."
 CZE_no_compromise_with_the_sdp_desc:0 "SdP не має чого запропонувати нашій коаліції. Вони прагнуть лише створити політичну напругу та очорнити дії нашого уряду. В ім'я ефективного управління вони повинні й надалі залишатися поза будь-якими коаліціями."
 CZE_praga_organization:0 "$CZE_praga$"
 CZE_protect_neutrality_desc:0 "Велика війна дала зрозуміти, що намагатися залишатися нейтральними марно, коли ти під прицілом ворога. Захист цих країн означає примушування наших ворогів до війни на два фронти під час експансії замість того, щоб дозволяти їм розділяти і володарювати."
