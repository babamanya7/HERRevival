 MUN_czech.1017.d:0 "[FROM.GetNameDef] звернулася до [ROOT.GetAdjective]ого керівництва з таємними планами вторгнення у [GER.GetNameDef]. Показавши свою рішучість усунути [GER.GetAdjective]у загрозу, вони попросили нашої допомоги, щоб разом розгромити могутню [GER.GetAdjective]ою армію."
 MUN_czech.1018.d.FRA_POL:0 "З [FRA.GetNameDef] та [POL.GetNameDef] надійшли чудові новини — наші дипломати повідомляють, що обидві країни зобов'язалися допомогти нам у вторгненні до [GER.GetNameDef]."
