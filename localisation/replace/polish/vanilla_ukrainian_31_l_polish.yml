 HUN_announce_the_gyor_program_desc:0 "Наша армія слабка і потребує підвищення як чисельності, так і боєздатності. Щоб задовольняти потреби зростаючої армії, нам потрібно значно прискорити темпи виробництва. П'ятирічна Дьорська програма підвищить бюджетні витрати не тільки безпосередньо на збройні сили, а й на: промисловість, сільське господарство, інфраструктуру та освіту."
