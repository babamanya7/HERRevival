 FRA_destroyer_2:0 "Клас «Le Fantasque»"
 FRA_expand_to_the_suez_desc:0 "Поділ контролю між нами та Британією в Леванті є нездійсненним компромісом, якого тепер, на щастя, нам більше не доводиться дотримуватися."
 FRA_extend_the_maginot_line_desc:0 "Не варто сподіватися, що бельгійці протримаються. Якщо ворог прорветься на їхню територію, нам незлагодити. Слід продовжити лінію Мажіно, щоб жодний ворог не зумів захопити Францію.!"
