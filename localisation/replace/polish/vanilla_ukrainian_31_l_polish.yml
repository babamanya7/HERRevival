 mtg_britain.15.t:0 "$mtg_britain.1.t$"
 mtg_britain.25.a:0 "Та як вони посміли!"
 mtg_britain.28.d:0 "[From.GetNameDefCap] приймає нашу пропозицію про союз. Відтепер ми будемо правити як на морі, так і на суші."
 mtg_britain.47.t:0 "[From.GetName] проводить деколонізацію"
 mtg_britain.62.a:0 "Можливо, вони йдуть до нас."
 mtg_britain.8.t:0 "Газети налаштовані проти шлюбу"
 mtg_britain.80.t:0 "[From.GetNameDefCap] приймає вимоги"
 mtg_britain.999.d:0 "Вибухи в столиці призвели до жахливих жертв. Після вчорашнього нальоту бомбардувальників сильно постраждали Сент-Джеймський парк і Бакингемський палац. на них внаслідок вибуху обрушилася стеля підвалу.\n\nНація сумує за загиблим королем, але тим часом вже розпочато приготування до коронації спадкоємця. Георг VI вже готується до коронації."
 mtg_generic.1.a:0 "Нам залишається лише прийняти це."
 mtg_netherlands.1.d:0 "Скориставшися тим, що після вторгнення на нашу основну територію наша військова присутність ослаблена, [VEN.GetAdjective]ий уряд виступив із пропозицією «допомогу захистити» острови Ей-Бі-Сі від ворожого нападу. Навряд чи вони за покинути ці острови, коли їхня допомога більше не знадобиться..."
 mtg_netherlands.10.a:0 "Будемо сподіватися, що воно виявиться стабільнішим, ніж колишні."
 mtg_netherlands.2.a:0 "Наш задум спрацював."
 mtg_netherlands.2.t:0 "[From.GetNameDefCap] приймає нашу пропозицію"
 mtg_netherlands.20.d:0 "[HOL.GetAdjective] представники зв'язалися з нами і запропонували тісне співробітництво з малими демократичними країнами Європи. Тепер вони бажають отримати наше офіційне схвалення цього проєкту."
 mtg_netherlands.25.a:0 "Дивно... і тривожно..."
 mtg_netherlands.30.d:0 "Держава [From.GetNameDefCap] надіслала нам партію спорядження для переоснащення наших військ."
 mtg_netherlands.35.t:0 "[From.GetNameDefCap] просить обмінятися розвідданими"
 mtg_netherlands.37.a:0 "Схоже, ми не вселяємо особливої довіри..."
 mtg_netherlands.49.a:0 "У нього чудовий розум."
 mtg_netherlands.51.t:0 "Принц Бернард хоче добувати розвіддані"
 mtg_netherlands.58.a:0 "Це вкрай неприємно..."
 mtg_netherlands.61.t:0 "[From.GetNameDef] ще більше загострює скандал"
 mtg_netherlands.76.t:0 "Німецькі легіони Її Величності розформовуються"
 mtg_news.11.t:0 "[HOL.GetName] поступається вимогам Великої Британії"
 mtg_news.28.t:0 "[From.GetName] підпорядковується державі [ENG.GetName]"
 mtg_news.4.b:0 "Їм слід не втручатися у справи інших народів."
 mtg_news.40.t:0 "[From.GetName] кидає виклик капіталізму"
 mtg_news.51.b:0 "Ось приклад відмінної [From.GetAdjective] дипломатичної маневреності."
 mtg_news.58.d:0 "Що це — витончений дипломатичний хід чи безумство?"
 mtg_news.7.t:0 "[USA.GetNameDefCap] понад усе!"
 mtg_usa_canadian_corridor.2.desc:0 "Уряд лідера [CAN.GetLeader] погодився виконати наші вимоги та покинути оспорювані території. Наші сили висунулися для забезпечення контролю над осередками цивілізації за межами міст."
 mtg_usa_civil_war_democrats.11.a:0 "У цьому немає нічого поганого."
 mtg_usa_civil_war_fascists.1.t:0 "Протести Срібного легіону"
 mtg_usa_civil_war_fascists.2.a:0 "Кров пролилася. І нічого ще не закінчилося."
 mtg_usa_civil_war_fascists.22.desc:0 "Після збройних зіткнень між державами [USA.GetNameDef] і [CSA.GetNameDef] ряд законодавчих зборів штатів прийняли декларації про невтручання. Вони наказують губернаторам підтримувати територіальну сторону. Вони також забороняють проводити заклик на користь однієї зі сторін, але, що важливо, не обмежують продаж зброї та боєприпасів за умови оплати авансом.\n\nЦі заяви особливо підкреслюють, що ці штати залишаються частиною держави [USA.GetNameDef] і не бажають формувати свій власний постійний уряд."
 mtg_usa_foreign_support.11.a:0 "Ми це запам'ятаємо."
 mtg_usa_foreign_support.9.b:0 "Нехай пограють у солдатиків в іншому місці."
 mtg_usa_north_american_dominion.1.desc:0 "У ході того, що виглядає як частина злагодженого дипломатичного наступу по всій Північній Америці та в регіоні Карибського моря, [USA.GetAdjective] посол передав нам ноту від президента. [USA.GetLeader] та його уряд очікують, що відтепер ми будемо консультуватися з ними щодо зовнішньополітичних рішень «на користь підтримання миру та доброї волі у відносинах між нашими країнами»."
 mtg_usa_secure_asia.6.a:0 "У них був шанс вирішити справу мирним шляхом."
 mtg_usa_secure_asia.9.desc:0 "Після тривалих і все більш напружених переговорів [From.GetAdjective] уряд відкинув нашу пропозицію. Наш посол у державі [From.GetNameDef] повідомляє про те, що він більше не може досягти аудієнції у лідера [From.GetLeader]."
 mtg_usa_southern_threat.1.t:0 "[USA.GetNameDefCap] вимагає підписати Договір про консультування та дружбу"
 murder_trotsky_exfiltration_outcome:0 "Нашому агенту вдалося втекти в метушні, що виникла після нападу. Ніхто не розглянув його обличчя як слід."
 native_american_usa_neutrality:0 "Сполучені Штати Тубільної Америки"
 naval_base_desc:0 "Розширює дальність дії Вашого флоту та дозволяє ремонтувати його. Дозволяє робити заморські поставки та експорт ресурсів. Вищий рівень збільшує пропускну здатність для поставок."
 naval_minelaying_research_desc:0 "Developments in magnetic detection and stable ignition sources for naval explosives."
 neo_mesopotamia_category_desc:0 "Родючий півмісяць — це колиска цивілізації та батьківщина багатьох великих держав. Тепер, коли територіальну цілісність відновлено, ми нарешті можемо оголосити про створення єдиної Месопотамської держави."
 neo_mesopotamia_communism:0 "Народна республіка Месопотамія"
 neutrality_focus:0 "Ставка на нейтралітет"
 news.12.t:0 "[FIN.GetNameDefCap] відхиляє радянські вимоги"
 news.139.t:0 "Звільнення Варшави"
 news.145.d:0 "У центрі Лондона, як і раніше, вирують пожежі, але майже всі німецькі солдати, що захищали місто, або загинули в боях, або були взяті в полон радянською армією. Натовпи на вулицях вітають радянських військових, які прямують до останніх осередків опору.\n\nЗ колабораціоністами було покінчено без жодної пощади, і СРСР призначили тимчасову адміністрацію для управління містом. Критики стверджують, що більша частина цієї адміністрації є членами британської комуністичної партії."
 news.151.d:0 "Після спроби Німеччини порушити умови Версальського договору та провести ремілітаризацію Райнланду, Союзниками було направлено ультиматум, який змусив Берлін відступити. Велика Британія та Франція пригрозили війною у випадку, якщо Німеччина продовжуватиме свої дії, і незабаром стало очевидно, що такої протидії з обох боків німці не очікували.\n\nРайнланд залишиться демілітаризованим згідно з угодою, інакше Німеччину чекає війна."
 news.163.t:0 "Лондонська конференція"
 news.165.a:0 "Це видається похмурим."
 news.17.c:0 "Трансільванія наша!"
 news.172.c:0 "Це викликає занепокоєння."
 news.172.f:0 "Це грецька трагедія."
 news.189.a:0 "Це питання було вирішено!"
 news.194.b:0 "[From.GetName] поглинає все на своєму шляху."
 news.196.b:0 "Сміховинна спроба!"
 news.198.e:0 "Ми на захисті [From.GetNameDef]."
 news.199.b:0 "Країни світу повинні протистояти злу, яке несе з собою [From.GetNameDef]!"
 news.202.c:0 "Це кричуще порушення Версальських угод!"
 news.205.a:0 "Це зробить Америку безпечнішою"
 news.206.a:0 "Весь світ буде звільнено революцією!"
 news.207.e:0 "Яким би шляхом не пішов цей конфлікт, руйнування будуть тотальними"
 news.208.e:0 "Війна в Південно-Східній Азії здається ймовірною"
 news.213.t:0 "[USA.GetNameDefCap] постає проти фашизму"
 news.214.b:0 "Вони втручаються в нашу сферу впливу!"
 news.214.t:0 "Польща шукає співпрацю в Балтіі"
 news.215.t:0 "[GER.GetName] формалізовує Антирадянський пакт"
 news.216.c:0 "Безглуздий опір."
 news.222.f:0 "Чи справді вони наважаться на втручання?"
 news.230.d:0 "І в Центральній, і в Південній Америці революціонери взяли до рук зброю і підняли повстання в ім'я [USA.GetRulingIdeologyNoun_RU_lower_Gen].\n\nЗазвичай вони добре озброєні і добре організовані, і якби вони відстоювали іншу ідеологію, їхнє фінансування було б легко відстежити. Однак, хто б не постачав ці рухи, вони докладають цілеспрямованих зусиль, щоб приховати свою участь.\n\nЗвісно, є лише одна велика держава, яка має заявлену зовнішньополітичну місію просувати [USA.GetAdjective]і інтереси в Америці..."
 news.233.t:0 "[GER.GetAdjective]ий інтерес у Скандинавії"
 news.234.d:0 "Після початку війни з Францією Німеччина чинить сильніший дипломатичний тиск на країни Бенілюксу, ніж будь-коли раніше. Однак, маючи [FRA.GetAdjective]у та [ENG.GetAdjective]у підтримку, вони відмовляються піддаватися тиску.\n\nЄ підстави вважати, що якщо [GER.GetNameDef] не зможе отримати бажане дипломатичним шляхом, вони візьмуть його силою."
 news.239.t:0 "[AST.GetNameDefCap] приєднується до альянсу [SOV.GetFactionName]"
 news.240.a:0 "Це стало несподіванкою."
 news.242.t:0 "[AST.GetNameDefCap] Встановлює контроль над колоніями Південно-Східної Азії"
 news.264.t:0 "Союз африканських народів"
 news.281.t:0 "$news.280.t$"
 news.289.c:0 "Це їм не допоможе!"
 news.290.a:0 "Королівство перестало бути лише за назвою."
 news.295.b:0 "Це суттєво змінює ситуацію..."
 news.300.desc:0 "Намагаючись ще більше скасувати Тріанонський договір, держава [HUN.GetNameDef] висунула державі [ROM.GetNameDef] ультиматум із вимогою повернути Трансільванію. Офіційної відповіді ще не було, але держава [HUN.GetNameDef] вже натякнула, що розгляне можливість застосування сили, якщо її вимоги будуть відхилені."
 news.32.a:0 "Це недобре..."
 news.32.f:0 "Ми мусимо підготуватися до оборони нашої землі."
 news.320.a:0 "Вони напросилися."
 news.323.desc:0 "Під тиском впливових елементів у своєму уряді король Румунії Кароль II не бачив іншого вибору, окрім як оголосити і підписати своє зречення від престолу. Його спадкоємцем став король Міхай, але багато диктаторських повноважень, отриманих Каролем, були повернуті уряду, і тому навряд чи молодий король зможе володіти такою ж владою, як його попередник.\n\nПісля зречення Кароль, схоже, спустошив свої величезні банківські рахунки і втік у вигнання, оселившися в одному з найдорожчих районів Мехіко разом зі своєю коханкою Магдою Лупеску."
 news.324.b:0 "Як хитро."
 news.327.t:0 "Югославія претендує на Македонію"
 news.334.b:0 "Це може ускладнити ситуацію"
 news.337.b:0 "Сподіваємося, що [ITA.GetLeader] не запам'ятається своїми невдачами."
 news.36.b:0 "Ласкаво просимо до Райху!"
 news.37.d:0 "Лев Троцький, який колись був соратником та можливим спадкоємцем Леніна, помер сьогодні у лікарні Мехіко. Він був убитий у себе вдома іспанським націоналістом на службі НКВС. Убивця використав кригоруб. Після безуспішної боротьби зі Сталіним та його союзниками за контроль над комуністичною партією Радянського Союзу, Троцький провів усі тридцяті роки у вигнанні. Якийсь час він жив у Туреччині, Франції та Норвегії, поки нарешті не опинився в Мексиці. Він невпинно критикував Сталіна та його методи управління «занепалою «робітничою» державою»."
 news.55.f:0 "Ми підтримуємо наших союзників."
 night_vision2:0 "Прилади нічного бачення II"
 no_friends_only_family_tt:0 "Правитель-Габсбург володіє областю [3.GetName], а ще 3 країни у світі керуються членом родини Габсбургів"
 no_more_oil_flag:0 "Нафтові родовища вичерпалися"
 nsb_coup.3.t:0 "Офіцери намагаються влаштувати переворот"
 nsb_news.301.a:0 "Більш ми не роз'єднані!"
 nsb_news.403.desc:0 "З'явилися свідчення масштабного втручання у внутрішню політику багатьох країн Південної та Центральної Америки. Помітно похитнулася. Експерти переконані: якщо не зупинити таємну [SOV.GetAdjective] діяльність, принаймні частина цих держав стане ідеологічним плацдармом держави [SOV.GetName] на Американському континенті. підтримка цих націй лише зростатиме і поширюватиметься."
 nsb_news.404.b:0 "Вони ж несерйозно!"
 nsb_news.408.desc:0 "[From.GetNameDefCap] оголошує про рішення приєднатися до своїх колишніх союзників у поновленому Троїстому союзі, спрямованому на протистояння експансії в Центральній Європі."
 nsb_news.9.c:0 "Комуністи знищують себе самі."
 nuclear_missile_equipment_desc:0 "$nuclear_missile_equipment_1_desc$"
 nuke_dropped.4.a:0 "Today, I am relieved not to be a Berliner."
 nuke_dropped.5.d:0 "A nuclear explosion has devastated the city of London today. Despite the city's anti-air defenses, [From.From.Owner.GetNameDef] was not prepared for this attack initiated by [?global.nukecountry.GetNameDef]. At [GetDateText], Big Ben chimed for the last time, having been melted by the blast. Early reports suggest Buckingham Palace has been completely leveled and the whereabouts of the royal family are currently unknown.\n\n[From.From.Owner.GetLeader] has nevertheless been confirmed to have survived and is preparing a rousing speech for the radio later today. With morale at an all-time low, the British people is in dire need of this — or a very eloquent surrender."
 operation_infiltrate_armed_forces_navy:0 "Проникнення у флот"
 operation_jericho_critical_success_tt:0 "Під час зухвалого бомбардувального нальоту вдалося пробити величезну діру в стіні в'язниці без жодних поранень серед ув'язнених. Більшості в'язнів вдалося втекти, і їх зустрів місцевий рух опору."
 operation_laudabiliter_short_desc:0 "§LЗдійсніть вторгнення в Ірландію і поверніть її Великій Британії.§!"
 order_of_the_dannebrog:0 "Орден Даннеброга"
 ott_absorb_the_tunis_and_algerian_eyalets:0 "Приєднати еялети Туніс і Алжир"
 otto-man_tt:0 "Контролює області §Y[88.GetName]§!, §Y[89.GetName]§!, §Y[91.GetName]§! та всі початкові області держав:\n§Y[AUS.GetNameDef]\n[HUN.GetNameDef]\n[CZE.GetNameDef]\n[CRO.GetNameDef]\n[LBV.GetNameDef]\n[ROM.GetNameDef]\n[BUL.GetNameDef]\n[GRE.GetNameDef]\n[TUR.GetNameDef]§!"
 panay_inc2_opinion_modifier:0 "Напад на HMS Ladybird"
 panay_incident.3.b:0 "Ми ніколи не станемо на коліна перед зіпсованим Заходом!"
 panay_incident.6.d:0 "Втрата USS Panay посилила страхи перед війною в державі [USA.GetNameDef]. Будучи налаштованими проти конфронтації, [USA.GetAdjective]і політики вдало пролоббіювали виведення всіх канонерських човнів і особового складу, що залишилися, з Китаю."
 panzerwaffe_desc:0 "Нова концепція мобільної війни передбачає створення ударних танкових військ. У ході підготовки до майбутньої війни ми мусимо посилити міць наших панцерваффе."
 panzerwaffe_short_desc:0 "§LСтворіть бронетанкові війська, сформувавши нові танкові дивізії наземних військ.§!"
 paratroopers_1_reward_4:0 "$paras_bonus_1$"
 paratroopers_2_reward_3:0 "$paras_combat_2$"
 patriotic_guerilla:0 "Патріотичний партизан"
 peru_bolivian_confederation_democratic_DEF:0 "Об'єднана Перуано-болівійська конфедерація"
 poland.1501.d:0 "Сьогодні для держави [Root.GetNameDef] настав великий день — [From.GetAdjective]а армія склала зброю й дала [Root.GetAdjective]им солдатам пройти прямо в столицю і оголосити возз'єднання держав [Root.GetNameDef] і [From.GetNameDef]! Річ Посполита відродилася, й вулиці міста [Root.Capital.GetName] сповнені людьми, що махають [Root.GetAdjective]ими та [From.GetAdjective]ими прапорами, — правда, в [From.GetAdjective]ій столиці таких урочистостей не видно, і народ там на диво похмурий."
 poland.20.a:0 "Чорт забирай!"
 poland.25.b:0 "Нам потрібен легіонер."
 poland.5.t:0 "[FROM.GetNameDefCap] пропонує захист"
 poland.6.d:0 "Пропозиція взяти державу [FROM.GetNameDef] під наше крило та вести її до майбутніх завоювань на заході в обмін на території на сході виявилася успішним підходом. Отримавши обіцяну частку Німеччини в разі успішної війни та наш захист, вони погодилися мирно поступитися своїми східними теренами."
 political.1.a.tt:0 "Збільшує ймовірність внутрішньої підтримки комуністичного перевороту."
 political.14.t:0 "[Root.GetRulingParty] обговорює демократію"
 political.16.d:0 "Демонстрації громадської незгоди, які колись обмежувалися обмеженими територіями, зараз набули широкого розповсюдження. Поки люди збираються на вулицях, [Root.GetRulingParty] опиняється на роздоріжжі. Якщо ми продовжимо дозволяти цій пропаганді поширюватися, референдуми, запропоновані як усередині самої партії, так і опозицією, можуть показати, що ми не користуємося підтримкою громадськості. Єдність, якої ми прагнули, поступається місцем плуралізму думок, об'єднаних проти нас."
 political.18.d:0 "Швидко зростаючий [Root.GetAdjective]ий фашистський рух ніколи не стверджував, що йому потрібна підтримка більшості перед захопленням влади, розраховуючи на об'єднання нації під своїм керівництвом після встановлення влади. Однак, схоже, їхня суспільна підтримка стрімко зростає. Багато фашистів зараз заявляють, що [Root.GetLeader] — лицемір, який стверджує, що представляє бажання народу, тим часом як насправді не дослухається до мас.\n\nЗаклик до референдуму досі відкидався членами партії [Root.GetRulingParty] як типова спроба зруйнувати систему, але, принаймні, це політичний захід. Якщо ми не будемо діяти зараз, фашисти можуть обрати насильницьку боротьбу як кращий шлях до влади."
 political.27.t:0 "[Root.GetLeader] покидає нейтральну зовнішню політику"
 political.31.desc:0 "Війна розділила нашу країну. Настав час розпочати відбудову зараз, коли ми знову живемо в мирі. Серед [ROOT.GetAdjective]их фракцій ([ROOT.GetRulingIdeology]) існує сильний поштовх до возз'єднання."
