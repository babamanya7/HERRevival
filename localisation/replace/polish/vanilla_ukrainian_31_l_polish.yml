 XIC_restore_the_glory_of_the_fengtian_army_desc:0 "Після завершення відновлення Чжилійської армії настав час належним чином відбудувати Фентянську армію до тієї сили, якою вона колись була, як домінуюча сила в північному Китаї. Скоро наші дні слави будуть відновлені!"
