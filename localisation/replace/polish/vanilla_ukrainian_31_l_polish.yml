 is_core_or_compliance_60_tt_NOT:0 "Не є осердною землею §Yрозпорядника§! або має §Y60§! од. §Yпідпорядкування§!\n"
 is_literally_china_tt_NOT:0 "НЕ: $is_literally_china_tt$"
 islamic_brotherhood_goal_desc:0 "Ісламські держави світу повинні об'єднатися, щоб протистояти тим, хто скоріше побачить нас завойованими та підкореними."
 italy.10.a:0 "Вони визнають нас законними власниками."
 japan_border_conflict.3.desc:0 "Слідом за зіткненням між [SOV.GetAdjective]ими та японськими загонами на кордоні біля озера Хасан японський посол у Москві зажадав припинення вогню. \n\nУ ході кількох невдалих атак на [SOV.GetAdjective]і позиції японці зазнали важких втрат, що викликало в японських військових колах занепокоєння та сумніви щодо можливостей їхніх військ."
 jet_tac_bomber_equipment_1_desc:0 "Поява реактивних перехоплювачів вимагає створення бомбардувальників, які не поступаються ним у швидкості. Ця роль відведена середнім бомбардувальникам першого покоління, оснащеним реактивними двигунами."
