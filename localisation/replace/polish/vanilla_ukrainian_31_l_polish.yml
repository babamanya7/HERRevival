 LIT_baltic_unification:0 "Об'єднання Балтії"
 LIT_baltic_unification_desc:0 "Між балтійськими державами давно існує почуття братерства і товариства, але ми весь час розділені межами та політикою. Хоч наші незалежні етноси сильні й окремо, наша готовність боротися за свою незалежність робить нас ще ближче один до одного. Можливо, настав час зробити з Балтійської Антанти окрему націю!"
 LIT_claim_livonia:0 "Претензії на Лівонію"
 LIT_demand_vilnius_desc:0 "Занадто довго традиційну литовську столицю утримують наші польські вороги, а наш уряд надто слабовільний, щоб щось із цим поробити. Досить! Вільнюс знову буде литовським!"
 LIT_events.201.d:0 "Схоже, [From.GetLeader] погоджується з думкою [Root.GetAdjective] міністрів і вирішує поки що укласти з державою [Root.GetNameDef] мир. З цим миром прийде і взаємна гарантія незалежності. За часів війни ми зможемо покладатися на допомогу наших друзів із держави [From.GetNameDef]!"
 LIT_events.4.a:0 "Це ж чудова можливість!"
 LIT_events.601.t:0 "[From.GetNameDef] вступає до ліги"
 LIT_greater_commonwealth_desc:0 "Амбіції Речі Посполитої виходять далеко за історичні межі давно зниклого королівства. У серцях поляків Річ Посполита — велика держава, мультикультурна імперія, що простяглася від моря до моря!"
 LIT_pan_baltic_bank_desc:0 "Тепер, коли у нас діє економічний союз, є можливість утворити панбалтійський банк та запровадити єдину для наших країн валюту."
 LOADING_TIP_125:0 "«Я — лідер одної країни, котра має дві абетки, три мови, чотири релігії, п'ять народностей, шість республік і оточена сімома сусідами; країни, в котрій живе вісім етнічних меншин».\n(Йосіп Броз Тіто)"
 LOADING_TIP_136:0 "«Це не мир. Це перемир'я на двадцять років».\n(Фердінан Фош, 1919)"
 LOADING_TIP_59:0 "«Нацисти вступили в цю війну з досить дитячою ілюзією, що вони розбомблять усіх, і ніхто не стане бомбити їх».\n(Артур «Бомбардувальник» Гарріс)"
 LOADING_TIP_95:0 "«Будячи тигра, беріть довгу палицю».\n(Мао Цзедун)"
