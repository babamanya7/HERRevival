 DLC_DESCRIPTION_dlc043:0 "Розробляйте прототипні технології та зброю, щоби розгорнути проти ваших ворогів. Проводьте нальоти, щоби знищувати ворожі дослідницькі комплекси, греблі та визначні місця. Нові й оновлені дерева фокусів дозволять вам скористатися внутрішнім колом Німеччини заради досягнення ваших цілей, відновити імперію Габсбургів за Австрію або Угорщину та відкрити динамічність Бельгії та її колонії, Бельгійського Конго."
