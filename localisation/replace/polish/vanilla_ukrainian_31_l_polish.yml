 ROM_modern_destroyers_desc:0 "Есмінці є основою будь-якого флоту, і наш не виняток. Наш морський кістяк має бути приведений у відповідність до стандартів сьогодення."
 ROM_national_defense_industry_desc:0 "Ми мусимо значно розширити нашу національну збройову промисловість, якщо ми хочемо встигати за зростаючими вимогами."
