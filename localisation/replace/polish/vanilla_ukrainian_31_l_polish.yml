 HABSBURG_armor_initiative_desc:0 "Майбутнє війни вирішить бронетехніка, як це і було в кінці Великої Війни, яку програв наш попередник. Ми повинні виправити ці помилки та зосередитися на цьому, щоб не повторити його помилку знову."
 HABSBURG_defensive_hussars:0 "Взяти модель угорських гусарів"
 HABSBURG_improved_production_methods_desc:0 "Тепер, коли наші галузі ефективно співпрацюють, ми можемо прагнути покращити наші методи виробництва, використовуючи справжню силу та потенціал наших людей та їх наполегливу працю."
 HABSBURG_industrial_effectivization_desc:0 "Наші заводи повинні працювати не тільки у воєнний, але, зрозуміло, і в мирний час. В ідеальному світі останнє було б набагато важливіше, ніж перше. На жаль, наш світ не ідеальний. Однак ми все ще не можемо ігнорувати наші промислові зусилля мирного часу."
