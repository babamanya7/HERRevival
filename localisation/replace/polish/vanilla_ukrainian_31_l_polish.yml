 SWE_join_allies_for_colonies_desc:0 "Зі зміцненням відносин між нами та союзниками у нас є можливість повернути наші колишні колоніальні володіння по всьому світу в обмін на наш вступ до їхньої військової коаліції."
 SWE_land_air_warfare_desc:0 "Хоча кожна гілка збройних сил потребує власної спеціальної підготовки та обладнання, вони найбільш ефективні на полі бою, коли працюють разом, щоб подолати ворога на землі та з повітря одночасно."
