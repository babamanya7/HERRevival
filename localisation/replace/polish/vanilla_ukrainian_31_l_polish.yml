 PROGRESS_SECTION_DESC:0 "$NAME|Y$\nДіапазон: $MIN|%Y$–$MAX|%Y$\n$MODIFIER$\n$RULE$\n$ACTIVATION_EFFECT$\n$DEACTIVATION_EFFECT$"
 PROTOTYPE_STATE:0 "Прототип"
 PRU:0 "Перу"
 PRU_communism_DEF:0 "Революційне Перу"
 PRU_democratic_DEF:0 "Республіка Перу"
 PRU_light_cruiser_1_desc:0 "The Almirante Grau class consisted of two pre-WWI light cruisers built in Britain for the Peruvian Navy and commissioned in 1907. Even for a light cruiser, the ships were fairly small, displacing only 3,100 tons, and had below-average speed as well. They were lightly armored and had twin 152mm/50 caliber Vickers guns as their main armament."
 PSR_neutrality:0 "Друга Філіппінська республіка"
 PURCHASE_CONTRACT_CONVOYS_TT:0 "Конвої"
 PURCHASE_CONTRACT_REQUIRED_CONVOYS_EFFICIENCY_TT:0 "Ефективність маршруту: $EFFICIENCY$"
 QEM_fascism_DEF:0 "Футуристський союз народів Кеманту та Квари"
 QEM_neutrality_ADJ:0 "Бегемдирськ"
 QUEBEC_COLONIZATION_STATUS:0 "Статус колонізації Квебеку"
 RAJ_GOE_enforced_peace_decision:0 "Наближення припинення вогню"
 RAJ_GOE_infiltrate_the_national_congress:0 "Інфільтрувати Національний конгрес"
 RAJ_arm_communist_militants:0 "Озброїти [RAJ_communist_coup_target.GetAdjective] бойовиків"
 RAJ_arm_the_peasantry_desc:0 "Революція має охопити кожне поле.\nМи роздамо зброю лояльному сільському ополченню, гарантуючи, що жодне село не залишиться беззахисним проти реакції."
 RAJ_bathe_in_hellfire:0 "Купатися в пекельному вогні"
 RAJ_battle_cruiser_2:0 "Клас «Princess Royal»"
 RAJ_battleship_3:0 "Клас «Lion»"
 RAJ_battleship_3_desc:0 "The Lion-class battleships were the follow-up class to King George V battleships, incorporating many of their features. Six ships were ordered in the 1938 Naval Program to replace the aging Revenge-class battleships but none were finished due to the erupting hostilities. The vessels would have been general similar to the King George-class, but the main armament would be heavier, introducing a new 16 in. cannon. They would also have thicker armor and more powerful engines."
 RAJ_chariot_of_victory:0 "Колісниця перемоги"
 RAJ_coal_fire_and_steel:0 "Вугілля, вогонь та сталь"
 RAJ_comrades_of_the_city_desc:0 "Робітники міст — це авангард.\nЗ освітою, інструментами та єдністю вони поведуть республіку до сучасності."
 RAJ_concessions_to_the_congress_cat:0 "Поступки Конгресу"
 RAJ_conquerors_of_turkey:0 "Друга битва під Анкарою"
 RAJ_core_states:0 "Ядро [FROM.GetName]"
 RAJ_curtail_the_zamindars_desc:0 "Вкорінений вплив сільських землевласників довгий час перешкоджав зусиллям модернізувати управління та видобути повний потенціал [ROOT.GetNameDef]. Переміщуючи адміністративну владу та ресурси до чиновників, заснованих на заслугах, та більш підзвітних установ, ми можемо послабити їхній контроль, водночас зміцнюючи основи більш чуйної держави."
 RAJ_engineering_revolution:0 "Інженерна революція"
 RAJ_expand_tax_loopholes_desc:0 "Використовуючи прогалини у податковому кодексі, ми можемо законно мінімізувати наші зобов'язання та реінвестувати ці заощадження у подальше розширення. Ефективність, зрештою, починається з балансового звіту."
 RAJ_form_ties_with_leftist_parties:0 "Налагодити зв'язки з лівими партіями"
 RAJ_fortify_aden_desc:0 "Оскільки Аден тепер є важливим портом, його потрібно зміцнити від потенційних атак."
 RAJ_forward_bloc_desc:0 "Передовий блок представляє сміливе бачення майбутнього Індії — таке, що відкидає компроміс та приймає революційні дії. Об'єднавши всі антиімперіалістичні сили, ми можемо прискорити боротьбу за повну незалежність та закласти основу для сильнішої, більш радикальної Індії."
 RAJ_funnel_british_investments_into_princely_states:0 "Спрямувати британські інвестиції в туземні князівства"
 RAJ_great_indian_peninsula_railway_dlc:0 "Велика залізниця Індійського півострова"
 RAJ_hidden_pressure_ban_exists:0 "Тиск [BAN.GetAdjective] на [THIS.GetName]: §YНевідомо§!"
 RAJ_hostile_takeover_cost:0 "Більше ніж §Y1§! контрольована §YЦивільна фабрика§! (наразі §Y[?actually_controlled_civs]§!)"
 RAJ_hostile_takeover_cost_2:0 "Більше ніж §Y2§! контрольовані §YЦивільні фабрики§! (наразі §Y[?actually_controlled_civs]§!)"
 RAJ_hostile_takeover_tt:0 "Відмикає рішення про купівлю штатів за §Yцивільні фабрики§!. Штати, з якими ми починаємо, отримують знижку при купівлі."
 RAJ_indian_defense_research_desc:0 "Ставши суверенною державою, Індія втратила доступ до новітніх прототипів і креслень, які вона отримувала раніше. Ми мусимо бути впевнені в тому, що завжди на крок випереджаємо наших ворогів і не поступаємось ним у технологічних перегонах."
 RAJ_indian_gentlemen_officers_desc:0 "Дворяни, які служили на благо Британської Індії і тісно співпрацювали з імперською владою, стануть командирами, якщо нам знадобляться вірні люди, здатні повести в бій нову індійську армію."
 RAJ_indian_peoples_army_desc:0 "Ми маємо підготувати армію, яка зможе переймати досвід у комуністів і стане їх союзником."
 RAJ_integrate_the_princes_desc:0 "Тепер, коли ми вислали князів та повільно інтегрували їх в Індію, настав час остаточно інкорпорувати туземні князівства."
 RAJ_investments_from_local_leaders_tt:0 "Обрати одну з можливих інвестицій зі списку вище та побудувати відповідні споруди в одній із наших контрольованих держав. \n\nДодає споруди в одну з наших контрольованих держав залежно від випадково обраної категорії інвестицій."
 RAJ_light_cruiser_3:0 "Клас «Crown Colony»"
 RAJ_light_tank_aa_equipment_3:0 "Valentine (зенітний)"
 RAJ_local_leaders_investments_civs_chance:0 "[?RAJ_local_leaders_civs_chance|%+]"
 RAJ_manipulate_army_statistics_desc:0 "Корона остерігається того, що наша ПВК стає надто великою та впливовою і, у свою чергу, потенційно кидає виклик регулярній армії. Що ж, є способи втопити урядових контролерів у цифрах та фальшивих звітах."
 RAJ_model_after_usa_desc:0 "Вивчаючи американські військові стратегії, ми можемо модернізувати нашу армію, зосередившись на гнучкості та технологічних інноваціях."
 RAJ_north_western_state_railway_desc:0 "Північно-Західна державна залізниця є життєво важливою для з'єднання серцевини Індії з її стратегічними кордонами. Розширення та модернізація цієї мережі зміцнить регіональну торгівлю, підвищить мобільність та посилить нашу присутність уздовж критично важливих кордонів."
 RAJ_peacock_throne_for_the_modern_age_desc:0 "Павиний трон був кінцевим символом влади та величі наших предків. Побудувавши новий трон у нашому історичному центрі влади, ми стверджуємо наше домінування, надихаємо лояльність та чітко заявляємо про наше бачення родючих дельт субконтиненту."
