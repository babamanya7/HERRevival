 USA_congress_desc:0 "Капітолій має свої власні правила й ідеї. Нам доведеться працювати з ним, щоби досягти поставлених цілей, але є способи забезпечити, щоби Конгрес був прихильним і підтримував нас у нашій роботі."
 USA_escort_effort_desc:0 "Підводні човни становлять небезпеку для наших конвоїв. Ми мусимо розробляти нові есмінці, щоб вести війну з підводними човнами ефективним чином."
