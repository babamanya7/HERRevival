 WW_hungary.34.desc:0 "Дегенеративне керівництво [FROM.GetNameDef] відмовилось скласти повноваження, чомусь вважаючи, що розумніші за монарха, обраного самим богом. Ми скинемо їх і посадимо Йожефа Августа на трон — хочуть вони того чи ні!"
 WW_hungary.49.a:0 "Вони зробили хибний вибір"
 WW_hungary.55.desc:0 "З огляду на політичні зрушення в Балканах, питання про наші стосунки з новою Австро-Угорською імперією стало дуже актуальним. Сьогодні угорський посол передав офіційну ноту з вимогою визначити наше ставлення до Імперії. Габсбурги вважають, що Чехія та Моравія — їхні давні коронні землі.\n\nОднак [HUN.GetLeader] висловив готовність піти на компроміс — бути номінальним головою держави, не маючи реальної влади."
 WW_hungary.69.b:0 "Ким вони себе вважають?"
 WW_hungary.72.desc:0 "Імпульсивний [FROM.GetLeader] нещодавно засудив наше 'незаконне' володіння [FROM.GetAdjective] Сілезією. Ми отримали ультиматум, а їхні війська стягуються до кордону. Як відповімо?"
 WW_hungary.75.a:0 "Захисники католицизму можуть її мати"
 WW_hungary.81.a:0 "І все добре в цьому світі"
 WW_hungary.9.a:0 "Ми знову як двоє старих друзів!"
 WW_hungary.90.a:0 "Міклош Горті — природний вибір"
 WW_hungary.99.b:0 "Це марення"
