 DEN_overlord_requests_greenland_back:0 "$DEN_request_greenland_back$"
 DEN_political_agitator_flag:0 "Політичний агітатор"
 DEN_political_unity_desc:0 "Лише співпрацюючи та працюючи над партійними питаннями, ми можемо сподіватися на безпеку нашої країни. Ніколи ще не було так важливо відкинути наші політичні розбіжності, і лише будучи прагматичними, ми зможемо захистити Данію."
