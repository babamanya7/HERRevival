 EST_events.4.a:0 "Perhaps we are more alike than different."
 EST_events.6.a:0 "What a good idea!"
 EST_hold_saaremaa:0 "Утримувати Сааремаа"
 EST_new_economic_policy_desc:0 "Наша економіка майже повністю залежить від торгівлі з СРСР. Росіяни — відверті вороги самовизначення Естонії, і допоки ми в усьому залежимо від них, ми не будемо справді вільними. Потрібно відокремитися від наших гнобителів, щоби мати справді незалежну економіку."
 EST_occupy_norway_desc:0 "Тепер, коли Швеція та Фінляндія у нас на повідку, нам залишається лише підкорити собі Норвегію, і вся материкова Скандинавія буде під естонським контролем."
