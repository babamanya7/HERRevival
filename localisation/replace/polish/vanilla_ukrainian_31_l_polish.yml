 AST_diplomatic_events.17.a:0 "Погодитися на перехід під австралійське управління."
 AST_diplomatic_events.18.desc:0 "[INS.GetName] погодилися на наш запит; наша співпраця матиме великий вплив на обороноздатність обох наших країн."
 AST_diplomatic_events.34.desc:0 "[AST.GetNameDefCap] пропонує пакт; такий, що врегулює потенційні конфлікти між нашими двома націями ще до того, як вони встигнуть виникнути. Розділивши тихоокеанські території між собою, ми зможемо планувати наші майбутні експансії, не побоюючись втручання іншої сторони."
 AST_diplomatic_events.5.desc:0 "Британія погоджується передати Сінгапур під австралійське управління. Це нарешті покладе край застарілій Сінгапурській стратегії, передавши нам керівництво власною обороною."
 AST_diplomatic_events.81.a:0 "[ENG.GetLeader] отримає свого качкодзьоба."
 AST_diplomatic_events.81.desc:0 "Зацікавленість британського прем'єр-міністра тваринами навряд чи пройшла повз чиюсь увагу, оскільки його колекція досить вражаюча. Будь-яке поповнення до його різноманітної сім'ї істот обов'язково буде оцінене, а тим паче екзотичне.\n\nСам [ENG.GetLeader] висловив зацікавленість в австралійському качкодзьобі, і хоча його експорт наразі заборонений через ризики для здоров'я маленької істоти під час транспортування, можливо, варто зробити виняток.\n\nЧи маємо ми задовольнити бажання прем'єр-міністра як символ єдності?"
 AST_election_campaign_pp_cost_hidden_idea:0 "Виборча кампанія"
 AST_empire_air_training_scheme:0 "Імперська програма льотної підготовки"
 AST_establish_training_camps_desc:0 "Як і у Великій війні, Другі Імперські сили можуть бути закликані воювати в будь-якій точці світу. Тому ми маємо розробити комплексні програми тренувань, щоб підготувати наших солдатів до будь-якого середовища, від пустель Північної Африки до джунглів південної частини Тихого океану."
 AST_exports_for_economic_recovery:0 "Експорт для економічного відновлення"
 AST_foreign_competition_desc:0 "Конкуренція корисна для бізнесу; вона стимулює інновації та ефективність, водночас усуваючи самовдоволення. Це світ, де виживає сильніший, і нам треба переконатися, що наш пес найбільший, і що ми зняли з нього нашийник, щоб він був повністю вільний конкурувати."
 AST_income_tax_assessment_act_desc:0 "Наша система оподаткування перебуває в поганому стані, і людям важко в ній орієнтуватися, що вимагає жорсткого державного нагляду, який ми не можемо собі дозволити. Переглянувши та оптимізувавши відповідні положення, ми можемо зробити збір податків значно ефективнішим."
 AST_infantry_equipment_3_short:0 "Electrolux SMLE-CAR"
 AST_invoke_the_1903_defence_act_desc:0 "Традиційно Австралія покладалася на свою міліцію для національної оборони. Проте в часи значної загрози ми можемо застосувати Закон про оборону 1903 року. Це дозволяє нам призивати додаткову робочу силу для оборонних цілей."
 AST_mio_trait_john_brown_wartime_surge_capacity:0 "Різке нарощування потужностей у воєнний час"
