 TUR_VICTORY_POINTS_833:0 "Дебре"
 TUR_anti_bolshevik_accord:0 "Антибільшовицький договір"
 TUR_assess_our_future_desc:0 "Коли Мустафа Кемаль Ататюрк звільнив цю країну і оголосив про незалежність, він мав досить своєрідне бачення того, якою має бути [ROOT.GetAdjective] держава. Настав час замислитися, чи бачення Газі відповідає цілям нинішньої адміністрації."
