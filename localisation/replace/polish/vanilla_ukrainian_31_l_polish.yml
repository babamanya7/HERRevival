 when_at_war_TT:0 "§YКоли почнеться війна:§!\n"
 wtt_britain_lease_azores.4.t:0 "Оренда Азорських островів скінчилася"
 wtt_britain_lease_azores.5.a:0 "Найкращий можливий результат."
 wtt_china_shared.1.desc:0 "[From.GetLeader] прибув до столиці для обговорення обстановки. Зустрівшись як з незалежними активістами, так і з представниками уряду, він заявив, що наша незалежність є вкрай важливою для держави. [From.GetNameDef] і що воно готове підтримати всі наші кроки щодо її розширення."
 wtt_china_shared.11.desc_a:0 "Тривалі битви в Китаї змушують нас підтримати наших товаришів із [From.GetAdjective]ої Червоної армії. [From.GetLeader] пропонує направити до них пілотів-добровольців та літаки. Він просить виділити близько 50 бомбардувальників та 100 винищувачів для їхнього супроводу. \n\nЦе може виявитися корисним досвідом для наших пілотів і дозволить випробувати на практиці нові розробки."
 wtt_germany.1.a:0 "Проженемо нацистських покидьків з нашої землі!"
 wtt_germany.10.t:0 "Італійці відмовляються від пропозиції про переворот"
 wtt_germany.12.t:0 "Успішний замах на Муссоліні"
 wtt_germany.21.b:0 "Ми не можемо дозволити настроїти Захід проти нас."
 wtt_germany.44.desc:0 "Офіційні представники Японії звернулися до нас із пропозицією, яка, на їхню думку, може задовольнити обидві сторони. Вони пропонують повернути Ціндао Німеччині в обмін на гарантію того, що ми негайно відкликаємо місію фон Фалькенгаузена з Китаю."
 wtt_germany.51.desc:0 "Війна була такою довгою та руйнівною, що до військової служби тепер залучено все доросле населення Німеччини. Нехай деякі з нацистських керівників не поділяють наші ідеологічні погляди, але їх досвід управління може виявитися корисним у ці важкі часи. Ми можемо запропонувати їм свободу в обмін на їх досвід і допомогу нам."
 wtt_germany.60.t:0 "Німеччина відмовляється від Данцига та Познані"
 wtt_germany.69.t:0 "[From.GetName] приймає пропозицію про інтеграцію"
 wtt_infiltration.10.a:0 "Приготуємось до битви за Китай!"
 wtt_japan.103.desc:0 "[From.GetNameDefCap] дякує нам за повернення Маньчжурії, але відхиляє нашу пропозицію укласти альянс."
 wtt_japan.112.t:0 "[From.GetNameDefCap] відхиляє Троїстий пакт"
 wtt_japan.127.desc:0 "[From.GetNameDef] приймає нашу пропозицію миру та припиняє бойові дії в обмін на наші територіальні поступки."
 wtt_japan.127.t:0 "[From.GetName] приймає пропозицію миру"
 wtt_japan_118_TT:0 "Цих добровольців буде повернуто до запасу людських ресурсів, якщо §Y[From.GetName]§! виграє громадянську війну."
 wtt_manchukou.11.c:0 "Загальна програма індустріалізації піде на користь."
 wtt_news.10.a:0 "Вони продовжують несвідомо допомагати нам!"
 wtt_news.20.t:0 "Німеччина пропонує укласти антирадянський пакт"
 wtt_news.24.a:0 "Жаль, але це ні на що не впливає."
 wtt_news.33.desc:0 "\nПісля зустрічі між лідерами [CHI.GetLeader] і [PRC.GetLeader] останній виступив із критикою того, що він назвав «неприкритою та нахабною спробою залучити Червону армію для виконання націоналістичних та контрреволюційних цілей». [CHI.GetLeader] відмовився від коментарів із цього приводу, заявивши лише, що націоналістична армія готова захистити Китай від будь-якого агресора. \n\nПоступають повідомлення про те, що обидва лідери обговорили можливість створення єдиного фронту проти Японії.\n\nПоки не ясно, чи приведе цей розлад до чергового конфлікту між двома сторонами."
 wtt_news.36.desc:0 "Сьогодні [CHI.GetNameDef] потрясла трагедія: літак, на борту якого знаходився Чан Кайші, вибухнув у повітрі за кілька хвилин після зльоту. Рятувальники досі досліджують місце трагедії, але жодної надії на те, що вони виявлять тих, що вижили серед екіпажу та пасажирів, вже немає.\n\nПередбачається, що генералісимус та його дружина загинули.\n\nНовий китайський лідер [CHI.GetLeader] пообіцяв провести ретельне розслідування причин катастрофи Ходять чутки про змову проти генералісімусу, якого багато хто вважав перешкодою на шляху об'єднання різних фракцій усередині Китаю."
 wtt_news.37.a:0 "великий день."
 wtt_news.42.a:0 "Ми відновили зв'язок із імперією."
 wtt_news.46.d:0 "Це не вдавалося й більшим."
 wtt_news.50.t:0 "Гітлера вбили"
 wtt_news.55.b:0 "Народження нової наддержави в Америці?"
 wtt_news.61.a:0 "Ми нарешті скасували поділи!"
 wtt_news.69.desc:0 "У міру того, як [From.GetOldAdjective]а держава розростається за рахунок своїх сусідів, уряд переосмислює свій відхід від назви Раттанакосін. Оскільки нинішні кордони щодалі більше нагадують кордони історичного розквіту королівства, досягнення Королівства Раттанакосін дедалі частіше використовуються для впливу на громадську думку.\n\nСьогодні [From.GetOldAdjective]ий уряд зробив іще один крок вперед і офіційно перейменував країну на «[From.GetNameDef]», намагаючись отримати легітимність від історії."
 wtt_news.8.t:0 "Громадянська війна в Німеччині скінчується"
 wtt_political_organisation.8.t:0 "Повідомлення з області [state.GetName]"
 wtt_political_warlord_support.1.b:0 "Зачекаємо на більш вигідну пропозицію."
 wtt_xian_incident.6.b:0 "Це може запросто вийти з-під контролю."
 wuw_GER_chinese_diplomacy.1.a:0 "Це нам дуже знадобиться"
 wuw_GER_chinese_diplomacy.2.a:0 "Справжні союзники"
 wuw_GER_chinese_diplomacy.6.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] погодився на нашу пропозицію та висловив велику зацікавленість у Китайсько-німецькій програмі спільних досліджень. Час починати працю!"
 wuw_GER_diplomacy.1.b:0 "Ця угода вигідна лише їм..."
 wuw_GER_diplomacy.117.a:0 "Ми не зможемо їм протистояти..."
 wuw_GER_diplomacy.29.desc:0 "Колись ми вважали [FROM.GetNameDef], або принаймні їхнього попередника, нашими союзниками. В останні роки ми віддалилися, але тепер вони, здається, бажають відновити дружбу. Запропонувавши взаємовигідну торгівлю, [FROM.GetAdjective] знову простягають нам руку."
 wuw_GER_diplomacy.30.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] позитивно відповів на нашу пропозицію укласти торговельну угоду. У минулому ми вже мали вигідні відносини з ними, і [ROOT.GetLeader] впевнений, що це принесе нам чималий прибуток."
 wuw_GER_diplomacy.36.t:0 "[FROM.GetAdjective] відмовляються передавати наші колонії"
 wuw_GER_diplomacy.50.t:0 "[FROM.GetNameDefCap] пропонує співпрацю в розвитку флоту"
 wuw_GER_diplomacy.58.desc:0 "[FROM.GetLeader] оголосив, що вони не бажають воювати з нами, і тому повертають території, отримані внаслідок плебісциту 1920 року. Люди радіють, адже знову повернулися під наше крило."
 wuw_GER_diplomacy.71.desc:0 "[FROM.GetNameDef] оголосив про реформу — для об'єднання трудящих ми маємо передати більше індустріальних потужностей під контроль метрополії. Ми не маємо змоги протестувати — ми знали, що така ціна можлива."
 wuw_GER_diplomacy.73.t:0 "[FROM.GetNameDefCap] дозволяє комуністичну пропаганду"
 wuw_GER_diplomacy.89.t:0 "[FROM.GetNameDefCap] встановлює сферу впливу"
 wuw_GER_diplomacy.92.t:0 "[FROM.GetNameDefCap] схвалює наше пристосування"
 wuw_GER_diplomacy.99.t:0 "[FROM.GetNameDefCap] приєднується до ініціативи з обміну технологіями"
 wuw_GER_legions.1.t:0 "Формування Грузинського Іноземного Легіону"
 wuw_GER_monroe.9.a:0 "Вундербар!"
 wuw_GER_mutual_guarantees.1.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із пропозицією взаємних гарантій та співпраці. Угода передбачає спільний захист територій один одного і може в майбутньому перерости в щось значно більше. Як відповімо?"
 wuw_GER_news.2.b:0 "Їх чекала поразка тоді, чому має чекати перемога зараз?"
 wuw_GER_realpolitik.12.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] заявив, що наші вимоги такі ж слабкі, як і наш народ та національна воля. Схоже, вони готові боротися за свою свободу..."
 wuw_GER_realpolitik.19.b:0 "Зараз не час для поспішних дій"
 wuw_GER_realpolitik.23.b:0 "Нам не потрібна їхня дружба!"
 wuw_GER_realpolitik.33.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прибув до нашої столиці з пропозицією. Вони хочуть посилити нашу митну співпрацю та просунути економічну інтеграцію з ними. Це могло б суттєво допомогти нашій економіці, але щось тут не чисто..."
 wuw_GER_realpolitik.34.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] позитивно відповів на нашу пропозицію, і їхні дипломати прибули до нашої держави, щоб підписати необхідні документи для подальшої економічної інтеграції."
 wuw_GER_realpolitik.38.t:0 "[FROM.GetNameDefCap] відкидає наші вимоги"
 wuw_GER_realpolitik.45.b:0 "Ми не можемо погодитися на це"
 wuw_GER_realpolitik.46.desc:0 "[GER.GetLeader] з [GER.GetNameDef] вимагає, щоб ми передали всі чехословацькі території, які колись належали Австро-Угорській імперії, їм та їхнім союзникам. Це виглядає як погана угода для нас, але чи зможемо ми їм протистояти?"
 wuw_GER_realpolitik.48.t:0 "[FROM.GetLeader] відкидає поділ Чехословаччини"
 wuw_GER_reichskommissariats.1.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_reichskommissariats.14.b:0 "Можливо, варто скористатися місцевим колаборантом"
 wuw_GER_reichskommissariats.6.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_reichskommissariats.8.b:0 "Можливо, краще скористатися місцевим"
 wuw_GER_weltpolitik.12.b:0 "Ні, тепер вони наші"
 wuw_GER_weltpolitik.4.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] звернувся до нас із пропозицією щодо повернення втрачених колоній, відчуваючи себе обкраденим Версалем. Вони вимагають, щоб ми підписали договір з [GER.GetAdjective] стороною про розподіл Конго на сфери впливу. Чи варто нам піддаватись і підписати такий пакт?"
 wuw_HUN_a_multi_ethnic_empire:0 "Багатонаціональна імперія"
 wuw_HUN_approach_the_diasporas_desc:0 "Після Тріанона угорці опинилися поза межами батьківщини. Ми звернемось до них із закликом до єдності й підготуємо до звільнення від гнобителів."
 wuw_HUN_bringing_down_the_giants:0 "Повалити гігантів"
 wuw_HUN_capital_ship_efforts_desc:0 "Основою флоту є лінкори. Ми маємо якнайшвидше почати їх будівництво, щоб надолужити згаяний час."
 wuw_HUN_central_military_planning_committee_desc:0 "Для успіху світової революції потрібна стратегічна координація з союзниками. Наш комітет забезпечить ефективність армії та готовність до удару."
 wuw_HUN_construct_the_arpad_line_tt:0 "Будує §Yфорти§! рівня 3 вздовж північного та східного кордонів §Y[73.GetName]§! та §Y[76.GetName]§!"
 wuw_HUN_establish_the_second_republic_desc:0 "Перша Республіка була знищена як комуністами, так і націоналістами. Ми повинні зараз захистити демократію, інакше її буде втрачено назавжди."
 wuw_HUN_expand_the_arpad_line_southern_expansion_tt:0 "Будує §Yфорти§! рівня 2 вздовж південного та східного кордонів §Y[84.GetName]§!"
 wuw_HUN_goulash_communism_desc:0 "Після громадянської війни молоді таланти стрімко піднялись. Серед них — Янош Кадар, який пропонує систему гуляш-комунізму, де високий рівень життя об'єднує націю. Кожен угорець має змогу дозволити собі миску смачного гуляшу!"
 wuw_HUN_integrate_the_volksbund_desc:0 "Щоб повалити Горті, потрібні люди. Ми можемо завербувати націонал-соціалістичний Фольксбунд і використати його як парамілітарну силу."
 wuw_HUN_news_events.2.t:0 "[HUN.GetNameDefCap] приєднується до [GER.GetAdjective]ого альянсу"
 wuw_HUN_news_events.3.desc:0 "\nНе маючи варіантів для альянсів у своєму регіоні, [HUN.GetNameDef] вирішує знову сформувати Центральні держави. Звільнившись від накладених на них договорів, країна стрімко мілітаризується. Чи стане цей новий союз подібним до свого тезки часів Великої війни — ще належить дізнатися."
 wuw_HUN_our_ancestral_lands_desc:0 "Посилаючись не лише на фінно-угорське, а й на тюркське спадкоємство, ми можемо обґрунтувати наші претензії на прадавні землі й повернути те, що належить нам по праву."
 wuw_HUN_salami_slicing_tactics:0 "Тактика салямі"
 wuw_HUN_salami_slicing_tactics_tt:0 "Коли почнеться §Y[ROOT.GetAdjective]а громадянська війна§!, дещо більша частина §Yзбройних сил§! буде на нашому боці."
 wuw_HUN_state_protection_authority:0 "Управління державної безпеки"
 wuw_HUN_support_for_our_finnish_brothers:0 "Підтримка фінських братів"
 wuw_HUN_support_for_our_finnish_brothers_desc:0 "Лише століття тому походження фінів і угорців почали розглядати як спільне, тож багато наших громадян вважають фінів братами по крові. Тепер, коли вони у стані війни, ми повинні надіслати добровольців та техніку на допомогу в боротьбі."
 wuw_HUN_the_kingdom_of_ukraine_tt:0 "Ми створимо нову §Yукраїнську державу§! як наш суб'єкт із вказаних територій"
 wuw_HUN_the_second_northern_campaign_desc:0 "Наша перша північна кампанія 1919 року закінчилась невдачею, і словацькі землі потрапили до рук чехів. Ми маємо діяти швидко, щоб звільнити і угорців, і словаків у втрачених землях."
 wuw_HUN_the_war_on_atheism:0 "Війна з атеїзмом"
 ww_BEL_event_diplomatic.30.desc:0 "Після рішення [FROM.GetAdjective] скасувати їхні прагнення до нейтралітету, керівництво [FROM.GetNameDef] стало ще тісніше співпрацювати з нашою політичною програмою. Тепер вони звернулися до нас з проханням приєднатися до [ROOT.GetFactionName]. Їхня допомога може бути корисною, даючи нам нові можливості для стратегії майбутнього розширення."
 ww_BEL_event_diplomatic.31.t:0 "[FROM.GetNameDefCap] Приймає нас до [FROM.GetFactionName]"
 ww_BEL_event_spanish_interaction.7.a:0 "Вперед!"
 ww_BEL_event_war.3.c:0 "Він не мав права! Помістіть короля під домашній арешт."
 ww_BEL_event_war.6.a:0 "Гарна ініціатива, працюйте з ними для забезпечення гладкої окупації."
 ww_congo.14.a:0 "Мудрий крок."
 ww_congo.18.b:0 "Зрадники отримали те, що заслужили"
 ww_congo.44.b:0 "Ні, нам потрібен хтось інший!"
 ww_congo.64.t:0 "[FROM.GetLeader] приймає угоду з ураном"
 yugoslavia_mefo_bills_tt:0 "Використовує югославське золото для зменшення вартості §Y[GetMilitaryProductionModifierName]§!.\n"
