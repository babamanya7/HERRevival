 TUR_placate_fundamentalist_state_all_targets_effect_tt:0 "£faction_tur_traditionalist §YТрадиціоналісти§! всі разом зупинять свою опозицію урядові."
 TUR_rebuke_the_treaty_of_lausanne:0 "Розкритикувати Лозаннський договір"
 TUR_recall_ataturk_to_active_service_desc:0 "Мустафа Кемаль Ататюрк, перший фельдмаршал Туреччини, відіграв вирішальну роль у забезпеченні нашої незалежності в Національній кампанії. У нього один з найгостріших військових умов на континенті, і тепер необхідно знову звернутися до Батька турків, щоб він особисто перемозі."
 TUR_salt_the_scars_of_the_great_war_desc:0 "За роки, що минули з Війни за незалежність, турецький народ розм'як. Де ж та лють, яка така потрібна нам, якщо ми хочемо показати свою міць світові? Ми втратили у Великій війні більше за багатьох і вижили лише тому, що боролися за своє життя, як звірі. Ми битимемося зі звіриною люттю і в наступній війні."
 TUR_scout_plane_equipment_2:0 "THK Kartal"
 TUR_scrapping_our_debts_desc:0 "Нам довелося відроджувати націю чи не з попелу, а це заняття недешеве. Ми з вдячністю приймаємо руку допомоги від багатих народів, і помалу встаємо на ноги, проте наші цілі стали надто далекі від устремлінь тих, хто намагався тримати нас у фінансовій вузді. У нас немає вибору — ми мусимо відмовитися від усіх боргів."
