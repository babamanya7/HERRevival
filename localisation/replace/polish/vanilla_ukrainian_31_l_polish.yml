 BEL_belgian_renaissance_desc:0 "Нас били, нас ображали, але ми ніколи не були зламани. Це стало можливим лише завдяки винятковому прикладу [ROOT.GetRulingPartyLong]. Тільки через наше постійне лідерство цей бельгійський ренесанс зможе продовжуватися, наближаючи нас до нової золотої ери."
