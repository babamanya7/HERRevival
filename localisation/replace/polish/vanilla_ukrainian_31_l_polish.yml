 AST_request_resource_rights_in_indochina:0 "Запросити права на ресурси у Французькому Індокитаї"
 AST_strike_from_down_under:0 "Удар з півдня"
 AST_tac_bomber_equipment_1_short:0 "Battle"
 AST_the_guild_for_the_war_effort_desc:0 "Австралійська жіноча гільдія імперії була створена для служіння Короні. Тепер її призначення повністю змінюється. Величезна організаційна мережа, яку вона побудувала, направить свою енергію на військову промисловість, госпіталі та ланцюги постачання самодостатньої Австралії."
 AST_the_ultimate_overseas_duty:0 "Найвищий заморський обов'язок"
 AST_uap_discount:0 "\n\nПідніміть Голоси вище §Y50%§!, щоб отримати скорочення часу завершення кластерів фокусів §YУАП§! на §Y5§! днів."
 AST_union_control_1_map_area_name:0 "Штати, на які ще можна вплинути"
 AST_union_control_commonwealth:0 "Розблоковує рішення §YКонтроль профспілок§!. \nДозволяє комуністичне проникнення в Нову Зеландію, Малайзію, Бірму і, зрештою, Індію."
 AST_vichy_africa_claim_flag:0 "Претензії [AST.GetFlag]§Y[AST.GetName]§! на всі території §YВішістської Франції§! в §YАфриці§! додано до §YДосить втручатися§!."
 AST_volunteers_desc:0 "Важливим є мати вибір; здатність відхилити заклик до зброї не означає, що Австралія завжди це робитиме. Австралійці матимуть повне право боротися за те, що є правильним, як на своїй, так і на чужій землі."
 ASY_neo_assyrian_empire_neutrality:0 "Новоассирійська імперія"
 ATTRITION_STATE_MODIFIERS:0 "\n - Обласні модифікатори:"
 AUS_VICTORY_POINTS_3780:0 "Майланд"
 AUS_anschluss_risk_medium_tt_NOT:0 "Ризик аншлюсу на даний момент не §YСередній§!."
 AUS_artillery_equipment_2:0 "15 cm schwere Feldhaubitze M. 15"
 AUS_artillery_equipment_3:0 "15 cm Autokanone M. 15/16"
 AUS_bring_generals_out_of_retirement:0 "Відкликати до служби відставних генералів"
 AUS_defence_of_the_homeland:0 "Захист Батьківщини"
 AUS_disregard_the_treaties_desc:0 "Незважаючи на те, що ми поважаємо бажання підписантів залишити нас зобов’язаними перед Сен-Жерменським Договіром, поточна ситуація у світі більше не дозволяє нам слідувати його вимогам. Цілком можливо, що ці дії викликають гнів наших партнерів і ми можемо постраждати від наслідків, але ми не можемо більше стояти без зброї в палаючому світі."
 AUS_fascism_vaterlandische_front_long:0 "Вітчизняний фронт"
 AUS_form_evidenzburo_desc:0 "Незалежно від того, яку позицію ми займаємо - агресивну чи оборонну, - збір розвідувальної відомостей про можливих ворогів є надзвичайно важливим. Ми не можемо дозволити собі бути захопленими зненацька силою, швидкістю чи координацією наших ворогів, так само як і не можемо дозволити їм отримати інформацію про нас. Настав час реформувати старе Evidenzbureau відповідно до наших поточних потреб."
 AUS_has_not_rejected_before:0 "[FROM.GetLeader], [FROM.GetAdjective]ий лідер і його уряд, відгукнулися на наші вимоги; дипломатично сформульованим листом, але все ж з образливим відтінком. Наше занепокоєння відкинули, як пустий звук. Це означає, що наші занепокоєння щодо них справді були виправдані. Серед нашого керівництва було піднято голоси, щоб ми продовжували підштовхувати Австрію до підпорядкування, оскільки це може полегшити реалізацію наших майбутніх планів щодо них, проте меншість заявляє, що ми повинні віддати цю недотепну перемогу австрійцям."
 AUS_installing_a_habsburg_ruler_decision:0 "Поставити при владі Габсбурзького монарха у [FROM.GetNameDef]"
 AUS_invest_in_erzberg_steel_mines_desc:0 "Австрія завжди мала досить багато сталеливарних копалень, серед яких ерцберзькі (від однойменної гори), здаються особливо плідними. Нам слід розглянути можливість подальших інвестицій, щоб отримати від цього якомога більше вигоди."
 AUS_is_forming_hre:0 "Велич нашого ерцгерцога [ROOT.GetLeader] не знає меж, так само як і кордони нашої держави. Зараз вони розширилися до меж колишньої Священної Римської імперії, і країни, що стоять на нашому шляху, більше не в змозі опиратися нашій політиці. Ерцгерцог постановив, що нинішня можливість повинна бути використана, і що нація повинна прийняти свою роль як духовна спадкоємиця Священної Римської імперії. Aquila Elegit Iovis Omnia Vincit!"
 AUS_mio_initial_trait_technologically_advanced_submarines:0 "Конструктор передових підводних човнів"
 AUS_motorized_equipment_0_short:0 "Вантажівка «Type B»"
 AUS_news_events.1.b:0 "Ми ще їм покажемо..."
 AUS_news_events.10.b:0 "Гарна робота, бажаємо їм успіхів!"
 AUS_osterreichische_luftstreitkrafte_desc:0 "На наші повітряні сили серйозно, що означає — дуже негативно, вплинули договори, які були нав’язані нам через дії наших предків. Щоб отримати шанс у цьому новому та набагато суворішому світі, ми повинні розглянути питання про відновлення наших військово-повітряних сил до стандартів нинішньої епохи."
 AUS_political_events.106.t:0 "[FROM.GetNameDefCap] підтверджує свою підтримку"
 AUS_political_events.11.desc:0 "[GER.GetAdjective]і дипломати висловили занепокоєння щодо одного з членів нашого військового командування. Вони стверджують, що хоча ми, безперечно, є суверенною державою і можемо робити все, чого захоче душа; це не знімає з нас відповідальності й не позбавляє наслідків. Такі дії можуть призвести до того, що наші дипломатичні відносини з Німеччиною похитнуться. \n\nМи можемо очікувати, що вони готові взяти справу у свої руки, якщо ми не діятимемо в їхніх інтересах."
 AUS_political_events.112.a:0 "Чудненько."
 AUS_political_events.122.desc:0 "Георг фон Трапп колись був шановним адміралом великого австро-угорського флоту. Після падіння нашої могутньої імперії та втрати доступу до берегової лінії, він, як і багато інших, звернувся до іншого заняття в житті. Після «перерви» у фінансовій області, після роботи в якій він втратив більшу частину свого багатства, Георг спробував себе в музиці.\n\nА зараз, коли ми повернули контроль над береговою лінією, фон Трапп вирішив повернутися до флотилії й пропонує нам свої послуги в якості адмірала. Він радий знову вийти в бій заради нашої великої нації!"
 AUS_political_events.15.b:0 "Як грубо!"
 AUS_political_events.16.a:0 "Ми будемо пильно стежити за ним."
 AUS_political_events.30.t:0 "[AUS.GetNameDefCap] розриває Сен-Жерменський Договір"
 AUS_political_events.32.a:0 "Чудово!"
 AUS_political_events.35.a:0 "Вони мали свій шанс."
 AUS_political_events.37_tt:0 "Ми передамо їм області, на які вони претендують."
 AUS_political_events.38.a:0 "Вони приєднаються до нас, незалежно від їхньої думки."
 AUS_political_events.46.a:0 "Так навіть краще!"
 AUS_political_events.46.b:0 "Ні. Ми чітко висловили наші вимоги!"
 AUS_political_events.57.desc:0 "[GetHostilityItalianClaimDesc57]"
 AUS_political_events.62.t:0 "[FROM.GetNameDefCap] залишає Альфреда Янсу в якості головнокомандувача."
 AUS_political_events.73.a:0 "Це прийнятно для нас."
 AUS_political_events.75.b:0 "Ні! Достатньо! Руки геть від нашої країни!"
 AUS_political_events.90.desc:0 "Перші вибори після «самоліквідації парламенту» підійшли до кінця, підраховуються останні голоси. Явка виборців була доволі високою, оскільки нація побачила, на що вона може перетворитися, якщо вони нехтуватимуть своїми обов’язками виборців. Від остаточного підрахунку трьох провідних кандидатів відокремлюють лише кілька голосів."
 AUS_properly_trained_militias:0 "Належним чином навчені ополченці"
 AUS_refine_vaterlandische_front_desc:0 "Дуже довго Вітчизняним Фронтом називалась співпраця між іншими політичними партіями, об’єднаних в одну після ліквідації парламенту. Початкова ідеологія австрофашизму з часом повільно змінювалася не зовсім на нашу користь. Настав час повернути себе на правильний курс."
 AUS_renew_claims_in_italy_desc:0 "Коли наші території були розділені після Великої війни, італійці забрали у нас Альто-Адідже та Трентіно, незважаючи на те, що насправді цього не сильно хотіли. Оскільки наша влада зараз значною мірою відновлена, ми маємо право вимагати, щоб вони повернули нам наші законні території."
 AUS_seek_papal_support:0 "Шукати папської підтримки"
 AUS_send_infantry_equipment_to_italy:0 "Відправити §YПіхотне спорядження§!"
 AUS_send_volunteers_to_italy:0 "Відправити військовий контингент"
 AUS_sent_ultimatum_flag:0 "Уже надіслано ультиматум, який стосується цієї території"
 AUS_sp_land_military_engineering_vehicles:0 "SB-20 Greif"
 AUS_the_peoples_army:0 "Народна армія"
 AUS_universitat_wien_desc:0 "Як і більшість наших університетів, Віденський університет постраждав від фашистських загарбників. Фашистські настрої вільно поширювалися, нехай і переважно студентами. Посиливши правила та переконавшись, що ця практика більше не поширується, ми можемо забезпечити вищу якість наданої освіти."
 AUTONOMY_NOT_ENOUGH_TIME:0 "§RРівень автономії можна змінювати лише кожні §Y$DURATION$ дн.§! (§Yзалишилося $REMAINDER$ дн.§!)§!"
 BALTIC_belarus_uprising_desc:0 "Білоруський народ розривають на частини, половина нації хоче залишитися в складі держави [SOV.GetNameDef], а інша половина бажає перебігти в Балтію."
 BALTIC_events.101.a:0 "Нам нічого не загрожує."
 BALTIC_events.203.a:0 "Дуже прикро."
 BALTIC_focus_on_the_interior_2_desc:0 "Нам потрібно будь-що пам'ятати ту жорстокість, з якою так багато років тому в державу [Root.GetNameDef] прийшов добровольчий корпус. Робітників і селян вирізали як худобу, цілі села були спалені вщент—не можна допустити, щоб [Root.GetAdjective] народ колись ще страждав від подібного."
 BALTIC_german_tank_licences:0 "Ліцензії на танки ([GetBalticAxisInvesmentsAdj])"
 BALTIC_influence_neighbours_desc:0 "Концепція вільної соціалістичної Балтики далеко не така популярна зараз, як до воєн за незалежність, але вона з'явилася так само давно, як і сама концепція балтійського самовизначення. Наша держава може стати прикладом тим, хто живе під гнітом балтійської диктатури. озброївшись, ми безкровно поширимо революцію до сусідніх країн."
 BALTIC_renew_allied_trade_alt:0 "Залучити іноземні інвестиції"
 BALTIC_revolutionary_cabinet_desc:0 "Тепер, коли ми повернули собі законне звання ревнителів інтересів бідних верств суспільства, ми знову можемо зібрати кабінет міністрів, який дотримується ідеології нашої нової держави."
 BAR_neutrality:0 "Королівство Баротселенд"
 BAS_fascism_DEF:0 "Звільнені держави Британської Вест-Індії"
 BATTLES_OVER_TIME:0 "Битви за певний період"
 BBA_african_union_events.21.desc:0 "Наша економіка зазнала втрат під час переходу на нову валюту [ETH_GetCentralBankName]. Однак зараз виробництво та обсяги зростають знову, перевищуючи попередні показники. Економісти пояснюють зростання усуненням торгових бар’єрів між [THIS.GetNameDef] та іншими членами, що користуються спільною валютою, що дозволило глибше інтегрувати наші економіки."
 BBA_ethiopia_anti_colonialism_events.3.a:0 "Нарешті свобода."
 BBA_ethiopia_balance_of_power_events.01.desc_neutrality:0 "Зростаюча децентралізація держави [THIS.GetName] в поєднанні з відсутністю широкої підтримки керівної влади та загальною нестабільністю в регіоні вилилась у відкрите повстання проти центрального уряду."
 BBA_ethiopia_balance_of_power_events.23.desc:0 "Наша нещодавня хвиля освітніх реформ вже доводить свою успішність. Молодь не тільки стає все більш лояльною до [ETH.GetLeader], але й, схоже, чинить тиск на своїх батьків, щоби ті підкорялися цим вимогам."
 BBA_ethiopia_balance_of_power_events.54.desc:0 "Люди в області [?ROOT.ETH_bop_state.GetName] сподіваються на допомогу центрального уряду. Нещодавні події призвели до дефіциту постачання, і регіон дійсно міг би використати деякі інвестиції для протидії ситуації."
 BBA_ethiopia_communist_events.06.desc:0 "Офіцери армії за підтримки держави [SOV.GetName] розпустили тимчасовий [ETH.GetAdjective]ий уряд. Вони заявили, що отримали від [SOV.GetAdjective]ої розвідки докази зради з боку уряду під керівництвом [ROOT.GetLeader]. За цими даними, члени уряду вели переговори щодо повної окупації країни [ITA.GetAdjective]ими військами в обмін на великі особисті вигоди. Після перестрілок із Чорними Левами колишні члени уряду вважаються мертвими або заарештованими. \n\nВлада в країні тепер у руках військової адміністративної ради, що прагне відновити порядок і викрити спільників [ROOT.GetLeader]. Залишається незрозумілим, наскільки довго ця рада залишиться при владі."
 BBA_ethiopia_communist_events.08.desc:0 "[ETH.GetName] звертається з проханням про постачання стрілецької зброї для боротьби з Італією. Без нових поставок базового спорядження армія [ETH.GetAdjective] навряд чи зможе ефективно озброїти свої війська. Проте надання їм зброї погіршить наші відносини з [ITA.GetName]."
 BBA_ethiopia_communist_events.17.t:0 "[ETH.GetNameDefCap] просить підтримки проти [ITA.GetAdjective] бронетехніки"
 BBA_ethiopia_communist_events.19.t:0 "[SOV.GetNameDefCap] надсилає бронетехніку"
 BBA_ethiopia_communist_events.20.t:0 "[SOV.GetNameDefCap] відмовляється тренувати пілотів"
 BBA_ethiopia_communist_events.34.a:0 "Свободу для всіх!"
 BBA_ethiopia_communist_events.56.desc:0 "Спецслужби повідомили, що допомогли групі добровольців дістатися Східної Африки, щоб вони могли підтримати тамтешні революційні рухи. Серед добровольців були $IA_sakutaro_iwasa$ та $IA_sanshiro_ishikawa$."
 BBA_ethiopia_communist_events.57.desc:0 "Ми отримали офіційний запит від уряду [JAP.GetName], в якому вимагається екстрадиція будь-яких підданих [JAP.GetAdjective], які прибувають до країни з наміром приєднатися до нашого революційного руху. Хоча неясно, що саме вони планують, у запиті чітко зазначено, що будуть наслідки за відмову виконати вимогу."
 BBA_ethiopia_exile_events.01.t:0 "[FROM.GetLeader] готовий до повторного захоплення [FROM.GetName]"
 BBA_ethiopia_exile_events.17.a:0 "Кілька есмінців ми точно зможемо дати"
 BBA_ethiopia_exile_events.19.desc:0 "Після обіцянки [FROM.GetLeader] надати державі [ROOT.GetName] кілька кораблів, [FROM.GetAdjective]а держава передала під [ROOT.GetAdjective]ий контроль крейсер і кілька есмінців. Може і не великий флот, але все ж таки флот. Початок нової ери для держави [ROOT.GetName]."
 BBA_ethiopia_exile_events.40.desc:0 "Імператор у вигнанні [FROM.GetName], [FROM.GetLeader], звернувся до [ROOT.GetAdjective]ої держави з проханням про посередництво в італо-ефіопській війні. [GetGermanCountryLeaderTitle] висловив особисту зацікавленість у вирішенні цього конфлікту, який Ліга Націй не змогла вирішити. Досягнення цієї мети підвищить статус [ROOT.GetName] на світовій арені."
 BBA_ethiopia_exile_events.41.desc_redraw_map:0 "Лідер [FROM.GetAdjective], [FROM.GetLeader], запропонував рішення італо-ефіопської війни, в якому [ROOT.GetName] отримує велику частину території [?global.ETH_peace_country.GetAdjective], в обмін на мир та майбутню співпрацю проти зовнішніх ворогів. [?global.ETH_peace_country.GetName], якщо [ROOT.GetName] прийме цю пропозицію, отримає компенсацію від [550.GetName], таким чином, вони також щось отримають. Це дозволило б зміцнити [ROOT.GetAdjective]і позиції в Африці, в той же час надаючи [?global.ETH_peace_country.GetName] доступ до моря."
 BBA_ethiopia_exile_events.46.desc:0 "На жаль, спроби [FROM.FROM.GetLeader] домовитися з [FROM.FROM.GetNameDef] про мирну угоду виявилися безуспішними. [FROM.FROM.GetLeader] продовжує відмовлятися бачити аргументи. Тепер ми сподіваємося, що зможемо змусити [FROM.GetNameDef] приєднатися до нас у війні."
 BBA_ethiopia_exile_events.46.t:0 "Посередництво зазнало краху"
 BBA_ethiopia_fascist_events.04.t:0 "Повалений лідер $jimma_RU_Gen$ пропонує свою допомогу"
 BBA_ethiopia_fascist_events.62.desc:0 "[FROM.GetAdjective] дипломати дали зрозуміти, що вони готові почати постачання зброї, щоби ми підготувалися до повстання проти [ITA.GetAdjective] сил. Звісно, нам наказано повністю заперечувати їхню участь, якщо [ITA.GetAdjective] війська виявлять зброю."
 BBA_ethiopia_fascist_events.69.a:0 "Сильніший [FROM.GetName] дозволить нам зосередитись на власних регіонах."
 BBA_ethiopia_imperial_events.11.a:0 "Ми покладемо цьому край."
 BBA_ethiopia_imperial_events.12.a:0 "Одним клопотом менше."
 BBA_ethiopia_imperial_events.7.a:0 "Звучить як гарна ідея."
 BBA_italo_ethiopian_war_events.01.a:0 "Будь-якими засобами."
 BBA_italy_air_accident.03.a:0 "Галантність Бальбо врятувала ситуацію!"
 BBA_italy_anti_colonialism_events.21.desc_rejected:0 "Здається, що наші зусилля з деколонізації африканського континенту та принесення свободи підкореним народам відкидаються на кожному кроці. Старі колоніальні держави, очевидно, заперечують те, як вони ставляться до своїх підданих, і відмовляються прислухатися до голосу розуму. Вони повинні бути притягнуті до відповідальності!"
 BBA_italy_civil_war.5.desc:0 "Наші італійські союзники і суб'єкти попросили звільнити їх з-під нашого управління і надати їм повну незалежність. Спочатку ми взяли під контроль державу [FROM.GetName], щоб переконатися, що італійський фронт не розвалиться остаточно, але, можливо, настав час надати їм свободу."
 BBA_italy_civil_war.5.t:0 "[FROM.GetName] вимагає незалежності"
 BBA_italy_civil_war.7.t:0 "[FROM.GetName] відхиляє наші вимоги незалежності"
 BBA_italy_communist_events.04.t:0 "Міжнародної підтримки не отримано"
 BBA_italy_democratic_events.01.t:0 "$BBA_italy_communist_events.01.t$"
 BBA_italy_interaction_events.19.a:0 "І союз у нас буде."
 BBA_italy_interaction_events.27.b:0 "Якщо вони укладуть мир з [ETH.GetNameDef]"
 BBA_italy_interaction_events.27.desc:0 "[GetItalyAsksEngland]"
 BBA_italy_interaction_events.28.t:0 "Італія просить нас допомогти їм стримати Німеччину"
 BBA_italy_interaction_events.29.b:0 "Нам потрібно втекти від них."
 BBA_italy_interaction_events.46.a:0 "Ми мало що можемо зробити, щоб змінити їхню думку..."
 BBA_italy_interaction_events.51.desc:0 "Нашу розумну пропозицію ратифікувати Фронт Стрези в обмін на деякі незначні колоніальні території британці зустріли з цілковитою зневагою. Вони, мабуть, справді відчувають себе сильними та впевненими в собі, якщо відкидають нашу значну міць."
 BBA_italy_interaction_events.666.desc:0 "Його Святість Папа [From.GetLeader] вимагає, щоб ми передали регіон [454.GetName]. Його посланці стверджують, що таким святим місцем має керувати лише Папство, і відмова від такої вимоги буде єрессю. Виконання цієї вимоги пішло б на користь нашим відносинам з державою [FROM.GetName], але [454.GetName] лежить на перехресті між Європою, Азією та Африкою — що робить його таким стратегічно важливим місцем, як зараз, так і протягом всієї історії."
 BBA_italy_local_rulers.2.a:0 "Надання деяких поступок могло б задовольнити місцевих жителів."
 BBA_italy_missiolinis.103.a:0 "За майбутні подвиги!"
 BBA_italy_missiolinis.132.a:0 "Відсутність прогресу турбує."
 BBA_italy_missiolinis.133.desc:0 "Муссоліні особисто приїхав до Тічіно, щоб привітати тамтешніх італійськомовних мешканців з широкою італійською громадою, запевнивши, що на них та Італію в цілому чекає світле майбутнє. Він також заявив, що північні кордони тепер захищені й що Італія може зупинити будь-яких варварів, які намагатимуться перейти через Альпи."
 BBA_italy_missiolinis.22.a:0 "Абіссінці тугіші, ніж ми розраховували."
 BBA_italy_missiolinis.41.desc:0 "Подібно до Римської імперії в давнину, наша зростаюча імперія розкидається широко та потребує сильну армію, щоби захистити її від орд варварів просто за її кордонами. Дуче впевнений: аби Італія могла зважатися з іншими великим державами, ми мусимо могти підкріпити наші слова силою — інакше нас ніхто не сприйме всерйоз!"
 BBA_italy_missiolinis.92.a:0 "Справді соромно."
 BBA_italy_naval_cooperation_programs.03.desc:0 "[FROM.GetName] нерозумно відмовилася приєднатися до нашої Програми морського співробітництва, прийнявши самотність за силу, тоді як мудрі знають, що сила в кількості."
 BBA_italy_pact.1.desc:0 "[FROM.GetNameDefCap] готова представити спільну декларацію про дружбу та співпрацю між нашими країнами. Пакт про ненапад з ними захистить наші кордони та вивільнить ресурси, які ми зможемо спрямувати на інші цілі. Навіть якщо ми не завжди вважатимемо їх гідними довіри, це дозволить нам витримати час і накопичити сили."
 BBA_italy_pact.2.desc:0 "[FROM.GetNameDefCap] відкинула нашу пропозицію про пакт про ненапад, назвавши угоду нечесною та односторонньою. Вони явно помиляються і не розуміють, що для них краще."
 BBA_italy_purge_the_party.1.d:0 "Очистити всіх."
 BBA_swiss_expansion.4.t:0 "[FROM.GetName] погодились на референдум!"
 BBA_swiss_expansion.5.t:0 "[FROM.GetNameDef] ігнорує заклики до референдуму!"
 BBA_switzerland.1.b:0 "Мабуть, нам слід бути активнішими в захисті нашої демократії."
 BBA_switzerland.10.a:0 "Можливо, це забезпечить нам безпеку."
 BBA_switzerland.10.t:0 "[?SWI.SWI_fascist_germany.GetNameDefCap] задоволена рішенням [SWI.GetNameDef]"
 BBA_switzerland.3.desc:0 "Суд над Давідом Франкфуртером, який у лютому вбив представника нацистської партії в Давосі, ось-ось почнеться. Ми пообіцяли йому справедливий і неупереджений процес, але, безсумнівно, існують і інші варіанти.\n\nМи могли б таємно звільнити його і завербувати для розвідувальних операцій, або ж спробувати задобрити [?SWI.SWI_fascist_germany.GetNameDef], скасувавши суд і негайно винісши вирок.\n\nЩо б ми не зробили, задовольнити всіх навряд чи вийде."
 BBA_switzerland_fascist.5.t:0 "[FROM.GetNameDefCap] погодились передати нам контроль над [?SWI.SWI_requested_territory.GetName]"
