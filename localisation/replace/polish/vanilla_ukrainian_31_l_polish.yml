 SEA_PRC_fourth_army_incident.7.b:0 "Варто спробувати залишитися в дружніх стосунках з [FROM.GetNameDef]"
 SEA_PRC_fourth_army_incident.8.a:0 "Ми не можемо дозволити собі конфлікт у цей момент"
 SEA_PRC_misc_events.1.a:0 "Цього не можна допустити!"
 SEA_PRC_misc_events.8.t:0 "Плідний період для $PRC_mao_zedong$"
 SEA_PRC_political_events.1.desc2:0 "Оскільки 28 ½ більшовиків перемагають у боротьбі за владу, настав час обрати представника, який очолить націю. Хоча обидва кандидати мають добрі зв'язки з комуністами в [SOV.GetNameDef], $PRC_bo_gu$ має менше політичного досвіду. Проте він демонструє глибоке розуміння військових справ, що може бути корисним у майбутній боротьбі, якщо це переважить політичну та дипломатичну кмітливість $PRC_wang_ming$. Обидва чоловіки готові взяти на себе відповідальність."
 SEA_PRC_political_events.10.desc:0 "Імперіалістичний [FROM.GetName] відхилив наше прохання підписати з нами пакт про ненапад. Схоже, вони ставлять стосунки з нашими суперниками вище за стосунки з нами."
 SEA_PRC_political_events.11.b:0 "Ні, вони залишаться нашим підлеглим"
 SEA_PRC_political_events.2.c:0 "Це занадто ризиковано"
 SEA_PRC_request_aid.31.a:0 "Ми можемо виділити багато"
 SEA_PRC_request_aid.31.b.tt:0 "Ми погодимося надіслати §R100 танків БТ-7§! до §Y[FROM.GetName]§!"
 SEA_PRC_zhang_guotao_events.1.a:0 "Хоча у Готао є армія, Партія виступає проти його претензій на легітимність"
 SEA_PRC_zhang_guotao_events.6.desc:0 "$PRC_zhang_guotao$ не лише залишив Комуністичну партію Китаю, але й приєднався до Гоміньдану під керівництвом [CHI.GetNameDef]. Якщо ми колись опинимося у прямому конфлікті з ними, $PRC_zhang_guotao$ буде на боці ворога."
 SEA_china.1.t:0 "[FROM.GetNameDefCap] шукає нашої підтримки"
 SEA_china.18.desc:0 "Намагаючись задобрити нас, щоб ми не нападали, [From.GetName] надав нам права на ресурси. Квантунська армія вирішила поки що відступити."
 SEA_china.19.a:0 "Погодитися на вимогу Пекіна"
 SEA_china_democratic.11.desc:0 "[FROM.GetLeader] люб'язно прийняв нашу пропозицію офіційно оформити анти-[JAP.GetAdjective]ий союз між нашими країнами і вже почав впроваджувати заходи проти східної загрози. Сьогодні день для святкування!"
 SEA_china_democratic.14.a:0 "Шлях до перемоги відкритий"
 SEA_china_democratic.5.b:0 "Ми повинні зупинити це безглуздя!"
 SEA_china_democratic.5.desc:0 "Після тривалого періоду зростання республіканських настроїв, схоже, що [ROOT.GetAdjective]і демократи втомилися чекати мирної зміни влади. Після напружених дискусій, схоже, дипломатія зазнала краху, і почався збройний конфлікт."
 SEA_china_democratic.7.b.tt:0 "§RЦе дасть їм мету війни проти нас!§!"
 SEA_china_misc.1.t:0 "$CHI_retreat_to_taiwan$"
 SEA_generic_events.12.a:0 "Запевнити їх, що це лише для захисту країни"
 SEA_imperial_influence_demand_event_option_2:0 "Наш шлях зрозумілий"
 SEA_imperial_influence_events.120.t:0 "Фракція Армії вимагає політичних призначень"
 SEA_imperial_influence_events.200.desc:0 "Фракція Флоту намагалася посилити свій вплив на [GetImperialInfluenceRulerTitle], але через свої недоліки їй це не вдалося. Через це вони втратили обличчя, а отже, і престиж, що означає зменшення їхнього впливу."
 SEA_japan_foreign_policy.103.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] прибув до нашої столиці сьогодні з пропозицією. Вони бажають, щоб ми розширили нашу діяльність у валютному союзі та поглибили економічну інтеграцію з ними. Це значно допомогло б нашій економіці, але в усьому цьому є щось підозріле..."
 SEA_japan_foreign_policy.111.b:0 "Ми будемо уважно стежити за ними"
 SEA_japan_foreign_policy.113.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] люб'язно прийняв нашу пропозицію і підписав документи про передачу нам своїх колоній у Малайзії та Бірмі в обмін на збереження контролю над життєво важливими природними ресурсами в цьому районі. Сьогодні великий день для народів Азії!"
 SEA_japan_foreign_policy.118.b:0 "Це суперечитиме нашим принципам нейтралітету..."
 SEA_japan_foreign_policy.121.desc:0 "[FROM.GetLeader], наш колишній сюзерен, підписав документи про передачу контролю над нашою державою [JAP.GetNameDef]. Схоже, нас передали під захист іншої великої держави. Тепер у нас новий сюзерен, чиїм забаганкам ми будемо підкорятися."
 SEA_japan_foreign_policy.17.a:0 "Вони пошкодують про своє рішення!"
 SEA_japan_foreign_policy.20.t:0 "[FROM.GetNameDefCap] відмовляється приєднатися до нас"
 SEA_japan_foreign_policy.26.desc:0 "Нарешті цей день настав. Сьогодні вранці Тубтен Кунпхела рушив на Лхасу зі своїми озброєними прихильниками, заявивши, що наше правління корумповане і нелегітимне, і стверджуючи, що для [ROOT.GetNameDef] було б краще стати частиною [FROM.GetAdjective]ої сфери. Чи піддамося ми його вимогам, чи чинитимемо опір до останнього?"
 SEA_japan_foreign_policy.27.a:0 "Воістину великий день"
 SEA_japan_foreign_policy.3.t:0 "[FROM.GetNameDefCap] відмовляється коритися Імператору"
 SEA_japan_foreign_policy.47.a:0 "Жахливі новини..."
 SEA_japan_foreign_policy.67.b:0 "Ми повинні приєднатися до них, процвітання вже близько!"
 SEA_japan_foreign_policy.82.desc:0 "Наші історичні друзі з далекосхідної країни [FROM.GetName] звернулися до нас із привабливою пропозицією. Через наші історичні зв'язки та взаємну недовіру до [SOV.GetAdjective]ої держави вони запропонували військовий пакт, який передбачає, що якщо один із нас вступить у війну з [SOV.GetNameDef], то в неї вступить й інший. Безумовно, це занадто гарна можливість, щоб її втрачати?"
 SEA_japan_popup_events.15.t:0 "Окаду вбито на станції Токіо"
 SEA_japan_popup_events.16.a:0 "Ліберал Мачіда Тюдзі"
 SEA_japan_popup_events.19.a:0 "Ми не повинні піддаватися на їхні вимоги!"
 SEA_japan_popup_events.20.t:0 "[FROM.GetLeader] відхиляє ультиматум Хункоу"
 SEA_japan_popup_events.39.t:0 "Відродження буддизму"
 SEA_japan_popup_events.4.a:0 "Ми повинні отримати його підтримку, будь-якими засобами!"
 SEA_warlords.1.b:0 "Ми повинні боротися далі!"
 SEA_warlords.16.b:0 "Неприйнятно."
 SEA_warlords.16.desc:0 "$wtt_political_warlord_support.13.desc$"
 SEA_warlords.26.a:0 "У нас немає іншого вибору, окрім як погодитися"
 SEA_warlords.29.desc:0 "Після останніх подій у війні [FROM.GetLeader] вирішив, що більше не варто воювати проти нас, і що нам краще об'єднатися проти більшого ворога. Разом з цим [FROM.GetLeader] також запропонував повну амністію для наших солдатів і лідерів, якщо ми погодимося, прощаючи їм будь-які потенційні злочини проти Китаю в обмін на об'єднання зброї."
 SEA_warlords.38.a:0 "Дуже добре"
 SEA_warlords.39.a:0 "Чудово"
 SEA_warlords.55.t:0 "Наступ стагнує"
 SEA_warlords.57.a:0 "Вони пошкодують про цей день..."
 SEA_warlords.61.desc:0 "Після нашого викрадення [CHI.GetLeader] і примусового переконання призупинити кампанії з оточення, щоб зосередитися на більшій загрозі для китайського народу, ми отримали ордери на арешт і погрози від центрального уряду, в яких [ROOT.GetLeader] та його найближче оточення мають бути притягнуті до відповідальності, а Північно-Західний штаб придушення бандитизму має бути повністю розпущений. Чи повинні ми прийняти цю долю, чи продовжувати боротьбу?"
 SEA_warlords.71.b:0 "We already have enough problem to deal with"
 SEA_warlords.72.a:0 "With this we can turn the tide!"
