 SWE_starve_the_fascists_of_iron_desc:0 "Ми не будемо робити тих самих помилок, що й інші, заспокоюючи наших майбутніх ворогів, лише для того, щоб вони використовували наші ресурси, щоб вести проти нас війну. З цього дня ми заборонимо їм експорт усіх ресурсів, включаючи наше жадане залізо руда."
 SWE_sub_ship_engine_4:0 "«Götaverken» 4 000 к. с. н. в."
 SWE_swedish_shooting_movement_tt:0 "Число: §G+400§! для кожного рівня Hemvärnet\n§Y+100§! одиниці $SWE_infantry_equipment_0$ додаються до національного запасу для кожного рівня Hemvärnet\nЗбільшує стартовий досвід розгорнутих дивізій Hemvärn до §Y30%§! з §Y10%§!\nЗбільшує початкову частку оснащення розгорнутих дивізій Hemvärn до §Y90%§! з §Y60%§!\nЗбільшує початкову частку людських ресурсів розгорнутих дивізій Hemvärn до §Y90%§! з §Y70%§!"
