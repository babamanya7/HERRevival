 JUNO_brazil_events.191.desc:0 "[FROM.GetNameDefCap][BRA.GetFlag] запровадила жорстке придушення будь-якого сприяння монархічним настроям. Не дивно, що це мало охолоджуючий ефект на вплив наших оперативників у нації."
