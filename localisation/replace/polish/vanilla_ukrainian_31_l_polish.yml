 MAN_tsr_the_question_of_leadership_desc:0 "Хоча зараз ми перебуваємо під владою прем'єр-міністра Чжан Цзінхуея, а Пуї є імператором лише номінально, це, звісно, можна змінити. Якщо Квантунська армія вважатиме за потрібне, вона може повернути владу Імператору або навіть піти так далеко, щоб поставити власного імператора і відсторонити Пуї."
