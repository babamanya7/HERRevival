 SOCIAL_DSTATUS_OBSERVING:0 "Спостерігає"
 SOCIAL_STATUS_AVAILABLE:0 "Гравець доступний"
 SOK_communism_party_long:0 "Сокотський національно-визвольний фронт"
 SOL_communism_party_long:0 "Партія народного альянсу"
 SOL_democratic:0 "Соломонові острови"
 SOM_communism_DEF:0 "Сомалійська демократична республіка"
 SORT_BY_TENSION:0 "Сортувати за світовою напруженістю"
 SOV_ARTICLE_124_DESC_EXILES:0 "Комуністи стверджували, що вони лише відокремлюють Церкву від держави, але насправді вони прагнули усунути Церкву з життя людей. Століттями Церква була невід'ємною частиною російського суспільства, і такою вона повинна стати знову."
 SOV_DANUBIAN_MEMBERSHIP_DESC_COMMUNIST:0 "комунізму"
 SOV_Pokrovsk:0 "Покровськ"
 SOV_THE_LONELY_ISLAND_DESC_INDEPENDENCE:0 "Ціна, яку ми заплатили за [JAP.GetAdjective]у допомогу в нашій громадянській війні, була надто високою. Досить! Ми відновимо нашу незалежність за будь-яку ціну."
