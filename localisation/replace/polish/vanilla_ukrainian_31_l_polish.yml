 HOL_develop_the_south_desc:0 "Отримавши решту старих Об'єднаних Нідерландів, ми тепер маємо подивитись на те, щоб ці землі отримували такі ж інвестиції для промислового будівництва, як це було в центрі Нідерландів, щоб вони не відставали від решти країни."
