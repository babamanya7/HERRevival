 FACTION_POWER_RANKING_TOOLTIP:0 "§HРейтинг альянсів§!\n\nНа основі §Hпроєкції сили§! нашого §Hальянсу§! в розмірі $VAL|0H$, наш альянс посідає $RANK|H$. місце у світі."
