 form_arabia:0 "Об'єднати Аравійський півострів"
 form_country_poland_required_states_tt:0 "Контролює всі §Yпольські§! території"
 form_country_saudi_required_states_tt:0 "Контролює всі §Yаравійські§! території"
 form_country_south_america_required_states_tt:0 "§Y[ROOT.GetName]§! контролює всі §Yматерикові землі§! в §YПівденній Америці§!"
 form_east_africa_category_desc:0 "Незважаючи на культурні відмінності, ми поділяємо спільну долю з багатьма іншими державами та народами Східної Африки. Настав час об'єднатись і стати разом перед обличчям зовнішніх загроз."
 form_maphilindo_category:0 "Об'єднати малайські народи"
 form_mare_nostrum_coastal_uk_required_states_tt:0 "Контролює області: §Y[118.GetName]§!, §Y[116.GetName]§! та §Y[183.GetName]§!"
 form_mountainous_republic_category:0 "Сформувати Гірську республіку Північного Кавказу"
 form_mutapa:0 "Відтворити Зімбабвійську імперію"
 form_rattanakosin_kingdom_category_desc:0 "За останні роки ми відійшли від традиційних цінностей, на яких спочатку була заснована наша нація. Тепер, коли ми досягли територіального масштабу з часів нашої слави, можливо, настав час міцніше обійняти нашу історію."
 fortify_bosporus_goal_name:0 "Укріпити Босфор"
 france.10.a:0 "Ми мусимо співпрацювати з німцями."
 france.10.d:0 "Битва програна. Париж потрапив у руки Німеччини, і це лише питання часу, коли решта країни буде окупована. Тепер ми мусимо думати про майбутнє. В уряді хочуть перемир'я з Німеччиною, але багато офіцерів бажають продовжити боротьбу проти німців разом з Британією.\n\nДеякі члени британського військового кабінету запропонували інший варіант — злиття Франції та Великобританії в єдину країну, яка буде боротися, поки не буде звільнена вся Франція."
 france.11.a:0 "Ні. Британія — це Британія, а Франція — це Франція."
 france.14.t:0 "Тріумф у Франції"
 france.22.b:0 "Негайно відкликайте їхні права та підвищте продуктивність."
 france.25.a:0 "Ми збережемо мир."
 france.3.d:0 "Ми розпочали роботу з удосконалення укріплень Альпійської лінії. Італійці мають взагалі втратити здоровий глузд, щоби спробувати її перетнути після завершення цього будівництва!"
 generic.18.d:0 "Схоже, що [From.GetRank] [From.GetName], з ризиком для життя очоливши своїх людей і успішно довівши бій до переможного кінця, якийсь час не зможе виконувати обов'язки на належному рівні, доки повністю не оправиться від отриманого поранення."
 generic.2.d.b:0 "Наше важке становище по порушенню нинішнього світового порядку не залишилося поза увагою однодумців. [alliance_applicant.GetAdjective]а влада визнає, що їхній найкращий шанс створити для себе процвітаюче майбутнє — приєднатися до нас у майбутньому конфлікті, і тому вони запропонували офіційно приєднатися до нас проти наших ворогів."
 generic.23.a:0 "У нас немає вибору."
 generic.9.d:0 "Інша країна вперше у світі застосувала ядерну зброю, що дозволило їй очолити гонку озброєнь. Незважаючи на всі наші зусилля, ми не створили засобів оборони та удару у відповідь. Зважаючи на таку незаперечну перевагу, у нас немає іншого вибору, крім як подвоїти зусилля і скоротити розрив, перш ніж лідер гонки повністю продемонструє свою нищівну міць."
 generic_mio_initial_trait_fast_tanks_designer:0 "Дизайнер швидких танків"
 generic_mio_initial_trait_standardized_production:0 "Стандартизоване виробництво"
 generic_mio_trait_advanced_artillery_racks:0 "Удосконалені платформи артилерії"
 generic_mio_trait_even_thicker_armor:0 "Ще товстіша броня"
 generic_mio_trait_flying_fortress:0 "Летюча фортеця"
 generic_mio_trait_high_capacity_ammunition:0 "Збільшена місткість набоїв"
 generic_mio_trait_light_assault_gun_improved_cannon_stabilization:0 "Покращені осколково-фугасні боєприпаси"
 generic_mio_trait_medium_airframe:0 "Корпус середнього літака"
 generic_mio_trait_naval_strike:0 "Морські удари"
 generic_mio_trait_reinforced_frames:0 "Зміцнені рами"
 generic_mio_trait_reinforced_stocks:0 "Посилені приклáди"
 generic_motorized_mechanized_organization:0 "Виробник автотранспорту"
 ger_mitteleuropa_research_desc:0 "Скорочення часу дослідження технологій, уже вивчених іншими країнами-членами Міттельєвропи."
 germany.107.a:0 "Wahnsinn!"
 germany.119.b:0 "Ми диктуватимемо наш власний мир."
 germany.123.d:0 "[From.GetLeader], лідер [From.GetAdjective]ої держави, вчинив нерозумно, відхливши всі [ROOT.GetAdjective]і претензії!\n\nВони не віддадуть Судетську область, фактично змушуючи нас оголосити війну, і глузують над нашим бажанням захистити наших [ROOT.GetAdjective]их братів і сестер."
 germany.126.a:0 "Ми приєднаємося до Німецького Райху!"
 germany.127.a:0 "Ми надішлемо послів."
 germany.22.t:0 "Мемель: [FROM.GetNameDef] поступилась"
 germany.54.a:0 "Прага скоро буде наша."
 germany.56.b:0 "Ні, нам не потрібні ні Словаччина, ні дружба з німцями."
 germany.62.d:0 "Кілька німецьких дивізій нещодавно ввійшли в Райнланд. Уперше з часів Великої війни Німеччина розмістила війська на лівому березі Райну. Це чітке порушення Версальського договору, за умовами якого Німеччині було заборонено ремілітаризовувати цей регіон!\n\nФранцузи, схоже, мають намір обмежити свою відповідь на порушення умов Версаля до дипломатичних претензій, а громадська думка в Британії твердо висловлюється проти війни."
 germany.82.t:0 "Держава [From.GetNameDefCap] відмовилася віддавати Данциг"
 germany.85.d:0 "Антирадянський пакт зобов'язує всі держави, що підписали його, приєднатися до всякої оборонної війни з Радянським Союзом. Нещодавно СРСР напав на державу [From.GetName] і тепер вона надіслала всім членам пакту запит про негайну допомогу у війні. Час показати [Root.GetAdjective]у відданість захисту світу від радянської загрози раз і назавжди."
 germany.85.desc.b:0 "Наша гарантія держави [From.GetNameDef] зобов'язує нас приєднатися до всякої оборонної війни з Радянським Союзом. Нещодавно СРСР напав на неї, тож час нам виконати наш обов'язок і негайно прийти їй на допомогу. Час показати [Root.GetAdjective]у відданість захисту світу від радянської загрози раз і назавжди."
 get_SOV_ideology_london_desc_alt:0 "[SOV.GetAdjective]а офензива триває. Унаслідок нещодавніх подій Лондон зазнав агресивного наступу, і згодом упав під тиском, як здавалося, нескінченних атак.\n\nОстанні осередки опору ще не були добиті, а [SOV.GetAdjective]а армія вже зорганізувала парад для відсвяткування своєї перемоги. Прихильники лідера [SOV.GetLeader] і [SOV.GetLeader.GetHerHis] керівництво запропонували свою повну підтримку та виразили захоплення початком цієї нової епохи."
 guided_missile_equipment_short:0 "Керована ракета"
 han_will_flee_if_not_removed_tt:0 "§RЯкщо це не буде завершено до моменту захоплення Цзінаня Японією, Хань Фуцзюй покине свою провінцію§!"
 has_american_ideology:0 "США не ворожі до цієї ідеології"
 heavy_battleship2_desc:0 "Удосконалення нашої попередньої надважкої конструкції з більш потужною зброєю та вдосконаленими системами керування вогнем."
 hills_desc:0 ""
 hold_fight_on_the_beaches_speech_desc:0 "«We shall go on to the end. We shall fight in France, we shall fight on the seas and oceans, we shall fight with growing confidence and growing strength in the air, we shall defend our island, whatever the cost may be. We shall fight on the beaches, we shall fight on the landing grounds, we shall fight in the fields and in the streets, we shall fight in the hills; we shall never surrender...»"
 home_defence:0 "Оборона Вітчизни"
 hq_air_liaison_desc:0 "Групи авіаційно-наземного контролю та інші підрозділи, призначені для забезпечення тісної співпраці між військово-повітряними силами та сухопутними військами, які вони підтримують."
 hq_logistics_desc:0 "Визначає пріоритети та розподіляє припаси й пальне в межах армії."
 hungarian_dynasty_name:0 "Габсбургів"
 iceland_events.10.t:0 "Переговори не вдалися"
 iceland_events.14.a:0 "Ми візьмемо своє силою"
 iceland_events.14.desc:0 "На жаль, наше справедливе і скромне прохання про компенсацію за всю надану державі [FROM.GetName] допомогу залишилося без відповіді. [FROM.GetLeader] відмовляється йти нам назустріч, хоч це й було б в інтересах держави [FROM.GetName]."
 iceland_events.25.desc:0 "[FROM.GetLeader], лідер держави [FROM.GetNameDef], відмовляється поступитися нам своїми володіннями в Північному морі. Над нашими вимогами посміялися, відповівши, що, якщо ми хочемо отримати острови, нам доведеться взяти їх силою."
 iceland_events.4.t:0 "[FROM.GetNameDefCap] відповідає відмовою"
 iceland_events.45.e:0 "$ICE_gisli_sigurbjornsson$ принесе славу державі [ROOT.GetName]"
 iceland_events.9.a:0 "Слава королю Кнуду, правителю держави [ROOT.GetName]!"
 idea_PAR_emergency_powers:0 "Країна в умовах надзвичайних повноважень"
 idea_SIA_weather_broadcasts_desc:0 "Регулярні прогнози погоди дають нашим повітряним та військово-морським силам чіткішу картину умов, підвищуючи їхню ефективність і зменшуючи ризики дій у погану погоду."
 improved_light_shell_desc:0 "Повноцінний бронебійний снаряд для знарядь малого калібру. Дає есмінцям та іншим легким кораблям можливість протистояти броньованим ворогам."
 improved_worker_conditions:0 "Поліпшення умов праці"
 industrialize_southern_italy_desc:0 "Північна Італія здавна була промисловим центром нашої нації, тоді як південь залишався бідним і недорозвиненим. Ми маємо скоротити економічний розрив, забезпечивши промисловий розвиток наших південних районів."
 infantry_folder_desc:0 "Оснащення та зброя для піхотних військ."
 infiltrate_military_turned_pow:0 "Залучити на свій бік військовополоненого"
 infiltration_submarine_desc:0 "Агенти будуть доставлені до берега в нашому підводному човні. Ми вже розвідали можливі місця висадки та графік ворожих патрулів, щоб уникнути виявлення."
 infiltration_submarine_outcome:0 "Перша спроба висадки не вдалася через сильні хвилі, але друга спроба наступного дня пройшла успішно, і загін успішно зійшов на берег."
 infiltration_tactics_infiltration_assault:0 "Інфільтраційний штурм"
 infrastructure_gen:0 "інфраструктури"
 instigating_a_coup:0 "Розпалювання селянського повстання"
