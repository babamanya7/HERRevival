 BUL_bzns_values_removed:0 ""
 BUL_context_of_death_basic:0 "Після тижня важкої хвороби цар Боріс III помер сьогодні, [?BUL.BUL_date_of_tsars_death.GetDateStringNoHourLong], в місті [BUL.Capital.GetCapitalVictoryPointName] від очевидної серцевої недостатності."
 BUL_destroy_imro_foreign_tt:0 "Видаляє осердні болгарські землі в македонських областях. [ROOT.GetAdjective]і осердні землі відновляться."
