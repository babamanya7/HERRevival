 BEL_independent_neutral_and_loyal_desc:0 "Під час останньої війни ми покладалися на наших союзників, і наша країна стала полем битви. Тому, щоб зберегти мир у [BEL.GetNameDef], наш правитель оголосив нас \"Незалежними, нейтральними та лояльними\". \n \n Це об'єднає політичні кола в потребі зміцнити нашу оборону і розвивати власний військовий стримуючий потенціал."
