 secure_european_continent_goal_desc:0 "Ми повинні забезпечити, щоб Європейський континент був узгоджений з нашими цілями. [faction.GetName] має панувати в Європі."
 self_propelled_super_heavy_artillery_desc:0 "Великокаліберні гаубиці, встановлені на мобільних шасі, поєднують в собі нищівну вогневу міць та покращену мобільність, щоб знищити оборону супротивника."
