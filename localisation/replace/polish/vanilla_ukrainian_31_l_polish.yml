 ROM_invite_german_advisors_desc:0 "Німецька допомога є важливою, якщо ми хочемо модернізувати нашу армію. Вони володіють необхідним нам технічним ноу-гау, тому ми мусимо звернутися за допомогою до їхніх радників."
