 NO_NAVY_INTEL_WITH_CAP:0 "Нема розвідданих (потрібні флотські розвіддані: $MIN|H.0%$)"
 NSB_poland_communist_events.302.desc:0 "[Root.GetLeader] може радіти: план включити державу [From.GetNameDef] у Співдружність соціалістичних республік увінчався успіхом. [From.GetAdjective] уряд погодився перейти під пряме [Root.GetAdjective]е управління."
 NSB_poland_communist_events.602.b:0 "Що ж, значить, незалежність!"
 NSB_poland_events.304.desc:0 "На жаль, домовитися з поляками не виходить. Вони не прийняли нашу пропозицію поступитися нам Данцигом в обмін на укладення союзу. Обстановка на [From.GetAdjective] межі загострюється, є побоювання, що наближається війна."
 NSB_polish_fascist_events.203.desc:0 "[From.GetNameDefCap] погоджується на наші вимоги, і колишні литовські території вже діляться між Польщею та Німеччиною. Литва тепер наша — без жодного пострілу."
 NSB_polish_fascist_events.4.c:0 "Потрібно завершити формування Міжмор'я."
 NSB_polish_fascist_events.401.desc.baltics:0 "Польща днями висунула нам пропозицію щодо повоєнної розмітки кордонів. Згадавши про землі, що відійшли державі [Root.GetNameDef] внаслідок пакту Бека — Ріббентропа, [опрос] певні територіальні поступки після перемоги у війні. Вони хочуть заглибитися на північ в країни Балтії і взяти собі в компенсацію колишній сателіт Унії Курляндію."
 NSB_soviet_civil_war_common.010.b:0 "Нехай називається як раніше — Царицин."
 NSB_soviet_civil_war_common.113.desc_before:0 "Наші німецькі зв'язкові повідомляють, що підготовлене ними українське ополчення готове до бою. Війська оснащені та навчені, їх таємно розмістять в Україні в очікуванні початку війни."
 NSB_soviet_civil_war_common.113.t:0 "Українське ополчення готове"
 NSB_soviet_civil_war_common.114.b:0 "Зрештою, ми на це погодилися."
 NSB_soviet_civil_war_common.118.desc:0 "Члени антисталінської радянської опозиції зараз ведуть кампанію проти режиму. Вони організували кілька кампаній проти радянського вождя і збирають кошти в державі [ROOT.GetName].\nОпозиціонери заручаються підтримкою народу, а також таємно звернулися до нас підтримати повстання постачанням зброї."
 NSB_soviet_civil_war_common.125.a:0 "Чудово"
 NSB_soviet_comecon.1.t:0 "[FROM.GetAdjectiveCap]ий проєкт індустріалізації в державі [ROOT.GetNameDef]"
