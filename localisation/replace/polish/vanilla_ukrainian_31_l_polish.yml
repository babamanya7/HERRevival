 URG_GATHERING_STORM_DESC:0 "In a move referred to as the 1933 Uruguayan coup d'état, President Gabriel Terra couped his own government, dissolving parliament, weakening constitutional checks, and ruling in an increasingly authoritarian manner. Until this point Uruguay had been one of Latin America's most progressive democracies under José Batlle y Ordóñez, under a liberal doctrine called Batllismo.\n\nThe external debt has not helped the political situation, and the oriental republic now finds itself in the midst of a dictatorship, one which cannot last forever."
