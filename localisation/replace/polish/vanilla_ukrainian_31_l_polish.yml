 NOR_a_resurgent_labor_movement_desc:0 "Люди [NOR.GetName] більше не сприймають зав'язки на очах капіталізму. Вони нарешті бачать правду, що вони повільно тонули в злиднях, запроваджених їхніми господарями. Тепер вони піднімають голови над водою і бачать революцію на своїх горизонтах!"
 NOR_active_prep_flag_name_monarchist:0 "Демонстрація в області"
 NOR_alt_dem_modernize_armed_forces_decision_desc:0 "$NOR_modernize_armed_forces_decision_desc$"
 NOR_anti_air_construction_desc:0 "Наша пересічена місцевість робить [NOR.GetName] важкою ціллю для ворожого вторгнення, але наше небо відкрито для ворожих літаків, що робить їх перевагою для можливого іноземного вторгнення. Ми повинні створити необхідні протиповітряні батареї, щоб запобігти це."
 NOR_anti_tank_equipment_3:0 "75mm panservernkanon"
 NOR_assure_the_population_desc:0 "Може здатися, що [ROOT.GetName] рухається до загибелі, але Королівський канцлер від імені короля Гокона VII хоче, щоб населення знали, що монархія триматиме тверду руку, щоб повернути країну до стабільності."
 NOR_coastal_defense_desc:0 "[NOR.GetName] має одну з найдовших берегових ліній у світі, тому її зміцнення буде складним завданням, але це необхідно зробити, якщо ми хочемо зберегти нещодавно здобуту незалежність."
 NOR_compromise_with_the_nkp:0 "Компроміс із НКП"
 NOR_crush_hitler:0 "Знищити Гітлера"
 NOR_democratic_preparation_decisions_category:0 "Розбудова нашої нації"
 NOR_emergency_conversions_desc:0 "Ми маємо великий торговельний флот, але його кораблі плавають небезпечними морськими шляхами з великим ризиком для себе. Ми мусимо зняти з озброєння деякі з цих невеликих суден і дати їм можливість захищати наше вразливе судноплавство. Пізніше ми завжди зможемо переобладнати їх для виконання більш спеціалізованих завдань, якщо нам це буде потрібно."
 NOR_expand_naval_academy:0 "Розгорнути військово-морську академію"
 NOR_generic_fascist_ally:0 "Наш союзник-фашист"
 NOR_get_rid_of_quisling:0 "Позбутися Квіслінга"
 NOR_infantry_equipment_0_short:0 "M1918 carbine"
 NOR_join_the_allies_desc:0 "Коли нарешті станеться найгірше, мати сильних і надійних союзників означатиме різницю між підкоренням і свободою. [FRA.GetName] і [ENG.GetName] виграли Велику війну проти Німеччини, і ми віримо, що вони зможуть зробити це знову."
 NOR_lastname_trotskij:0 "Троцький"
 NOR_move_government_headquarters_decision:0 "Перемістити уряд в область [FROM.GetName]"
 NOR_old_vinland_desc:0 "Давньоскандинавські дослідники просувалися далі на захід, ніж будь-хто інший, поки вони нарешті не досягли щедрих земель Вінланду, або того, що вони тепер називають Ньюфаундлендом і Лабрадором. Помандруймо ще раз на захід і завоюємо те, що мало залишитися нашим у першість."
 NOR_pan_germanic_entent:0 "Пангерманська Антанта"
 NOR_prepare_state_alt_dem:0 "Підготувати область [FROM.GetName] до війни"
 NOR_prepare_state_communist:0 "Розбудити пролетаріат в області [FROM.GetName]"
 NOR_prince_olavs_inspiration:0 "Натхнення принца Олава"
 NOR_ship_secondaries_2:0 "152mm/50 RF. Cannon"
 NOR_spawn_militias_fasc_TT:0 "Буде створено 2 §Yфашистські ополчення§!, коли буде прийнято рішення про §YВійськове захоплення§! на цій території."
 NOR_stavanger_airfield:0 "Аеродром Ставангер"
 NOR_swedish_claims_desc_mon:0 "Мимоволі наша історія та гонорари були пов'язані з [SWE.GetNonIdeologyName]. Протягом століть туди-сюди держава [SWE.GetNameDef] вкрала величезні масиви землі: Ємтланд, Гер'єдален і Бугуслен. Дім Бернадотт, Васа, Ольденбург чи хтось інший винен, не має значення. Ми помстимося і повернемо наші землі."
 NOR_tank_rikstanken_armor_desc:0 "Зроблена з листів заліза замість сталі, щоби заощадити кошти. Краще, ніж її відсутність... мабуть."
 NOR_the_royal_guards_battalion_desc:0 "Протягом деякого часу Королівська гвардія була нашою найелітнішою бойовою силою, ми можемо розширити цю програму та покращити їхнє навчання, щоб вони могли бути авангардом наших збройних сил."
