 SPR_arm_the_workers_militias_desc:0 "Ми організували ополчення з робочої сили, і тепер повинні забезпечити їх належне оснащення, щоб вони могли сформувати авангард проти фашистського ворога та нелояльної армії."
 SPR_communal_military_strategies_desc:0 "Організувати широкомасштабну війну, залишаючись вірним принципам анархізму, є великим викликом. Ми також маємо зустріти його, оскільки без нього все, за що ми боремося, буде втрачено."
 SPR_expand_the_naval_academy_desc:0 "Громадянська війна показала недоліки в керівництві нашим флотом. Поліпшення якості нашої військово-морської академії, а також збільшення її розміру повинні забезпечити, щоб ці дорогі тактичні та стратегічні помилки стали набагато менш імовірними в майбутньому."
 SPR_foreign_arms_purchases_desc:0 "«Звільнені» нами золоті запаси можуть бути використані для отримання іноземної зброї, яка нам гостро потрібна. Міжнародна громадська думка не обов'язково підтримує нас, тому нам, ймовірно, доведеться пройти через неортодоксальні канали, щоб отримати їх, однак..."
 SPR_fortify_the_central_government:0 "Укріпити центральний уряд"
 SPR_heavy_cruiser_1_desc:0 "The Princesa de Asturias class consisted of three armored cruisers built for the Spanish Navy around the turn of the century. All three had been either scrapped or wrecked by the mid-1930s. They were armed with twin 240mm Guillén M1896 and eight 140mm/33 Schneider-Canet guns. They were heavily armored but also somewhat slow compared to a standard heavy cruiser."
