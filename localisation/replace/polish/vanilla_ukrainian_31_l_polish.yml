 USA_national_employment_strategy_desc:0 "Безробіття виникає з дуже простої причини: розбіжність людей і пропонованих вакансій. Фабрики простоюють через те, що наймачі не можуть знайти робітників, а жителі інших регіонів країни тим часом голодують. Ми розробимо нову стратегію, завдяки якій будь-який наймач зможе знайти відповідних людей для своєї фірми."
 USA_order_weapons_in_USB:0 "Придбати зброю в нейтрального блоку"
 USA_pearl_harbor_gambit_desc:0 "Морська база Перл-Гарбор може стати легкою метою для японців. Якщо ми розмістимо свій флот, то продемонструємо свою міць на Тихому океані. Чи наважаться вони кинути нам виклик?"
 USA_protest_anschluss:0 "Висловити протест проти аншлюсу Австрії"
 USA_protest_baltic_annexation:0 "Висловити протест проти анексії Балтії"
 USA_reinforce_monroe_doctrine_desc:0 "Прийнята сто років тому доктрина Монро закріплює за США право протидіяти будь-яким спробам Європи перетворити Америку на колонію, а також невтручання у європейські справи. Виступаючи у ролі миротворців на обох континентах, ми підвищимо свій вплив у цих регіонах."
