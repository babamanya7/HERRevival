 ban_democratic_party_desc:0 "Партії в політичному центрі надто довго перешкоджали нашому уряду. Їхнє наполягання на індивідуальних «правах» підривають наші зусилля по створенню кращої нації для всього нашого населення."
 basic_fortification_tech_desc:0 "Використовуючи міцніші матеріали та металеві арматури в конструкціях, ми можемо будувати більші укріплення, не турбуючись про те, що вони можуть обвалитися."
 basic_torpedo:0 "Базові торпеди"
 battle_class_1942:0 "Клас «Battle» 1942 р."
 battlefield_destruction_desc:0 "Літаки здатні завдавати ударів по країнах, що знаходяться далеко, але вони з не меншою користю можуть допомогти наземним військам у битві."
 bba_news.100.a_many_purged:0 "Прояв сили."
 bba_news.2.a:0 "Чи переживе [ITA.GetLeader] це?"
 bba_news.200.t:0 "Гітлер мертвий"
 bba_news.8.b:0 "Це розтягне наші війська ще більше."
 bftb_bulgaria_balkan_federation.14.desc:0 "[BUL.GetAdjectiveCap]ий уряд направив дипломатів у державу [ITA.GetNameDef] з вимогою поступитися [ITA.GetAdjective]і землі на Балканах. \nПісля довгої зустрічі [ITA.GetLeader] піддався тиску та погоджується передати контроль над [ITA.GetAdjective]ими землями на Балканах законним власникам."
 bftb_bulgaria_democratic_international_policies.1.a:0 "Яка турбота з їхнього боку!"
 bftb_bulgaria_democratic_international_policies.1.desc:0 "Сьогодні [BUL.GetAdjective]ий уряд оголосив, що [BUL.GetNameDef] вважає своїм обов'язком захищати територіальну цілісність дружніх балканських країн від мілітаристських посягань. [BUL.GetLeader] оголоси[BUL.GetLeader.GetVerbGendEndA_RU], що [BUL.GetNameDef] має намір захищати [ROOT.GetAdjective]ий народ, і повідоми[BUL.GetLeader.GetVerbGendEndA_RU] про впровадження ряду заходів для підготовки оборони Балкан."
 bftb_bulgaria_equipment_purchases.5.a_tt:0 "Ми отримаємо §Y1§! §Yцивільний завод§! поза мапою на сплату під час будівництва [BUL.GetAdjective]их кораблів."
 bftb_bulgaria_equipment_purchases.6.a_tt:0 "[FROM.GetNameDef] побудує §Y3 підводні човни§! для [ROOT.GetAdjective]ого флоту."
 bftb_bulgaria_factions.29.t:0 "Широкі соціалісти знищені"
 bftb_bulgaria_german_influence.1.t:0 "[GER.GetNameDefCap] пропонує допомогу літаками"
 bftb_bulgaria_nationalization.1.desc:0 "Тепер, коли [GetTsarLoyalistOrPartyName] підтримують його, [GetLeaderNameIfRegencyCouncil] країни [BUL.GetNameDef] видав новий закон, згідно з яким всі іноземні філії в державі націоналізовані і надалі\" Зухвале зневажання [ROOT.GetAdjective]их інтересів з боку держави [BUL.GetNameDef] у вищих ешелонах влади було сприйнято як серйозний удар."
 bftb_bulgaria_scw_volunteers.1.b:0 "Вони захищали свободу як могли..."
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_victorious:0 " після славної перемоги у громадянській війні в Іспанії, з якою їх привітав сам [FROM.GetLeader].\nНаші"
 bftb_bulgaria_yugoslavian_influence.1.desc:0 "Сьогодні [GetBulgarianLeaderToMeetStalin] та [ROOT.GetLeader] зустрілися в місті [ROOT.Capital.GetName] для обговорення [BUL.GetAdjective]ого договору про вічну дружбу між нашими країнами. відкинути колишні розбіжності і запевняє, що угода сприятиме зміцненню відносин із державою [YUG.GetNameDef] і дасть надію на створення в майбутньому альянсу двох країн заради співпраці та взаємної підтримки у випадку, якщо одна із сторін виявиться втягнутою у конфлікт."
 bftb_bulgarian_claims.7.b:0 "Як же болгари жадібні до територій!"
 bftb_greece.105.desc:0 "Доленосний день нарешті настав: лідер венізелістів вийшов з тіні і засудив декрет короля як незаконну та безпрецедентну загрозу демократії держави [FROM.GetNameDef]. На думку лідера, у них немає вибору, окрім як насильно скинути монархію та відновити вже двічі зниклу Еллінську Республіку.\n\n[ROOT.GetLeader] затаврував усіх повстанців зрадниками і пообіцяв з коренем вирвати марксистський і республіканський рух, щоб у державі [ROOT.GetNameDef] знову запанував порядок. Схоже, що [ROOT.GetAdjective]а політична сцена знову перетворилася на гладіаторську арену, звідки підуть з перемогою лише найсильніші."
 bftb_greece.168.b:0 "Переламай ситуацію на свою користь, Шахте!"
 bftb_greece.168.desc:0 "Хитрі дрібні паразити з держави [FROM.GetNameDef] придумали спосіб використовувати нашу фінансову піраміду проти нас. Невеликий прийом, створений так, щоби ми могли використати недосконалість плану Шахта на свою користь, обернулася проти нас же, на ми можемо або зберегти обличчя і дати [FROM.GetAdjective]им хитрунам здобути цю маленьку перемогу, або припинити вдавати, що граємо за правилами, і припинити переговори з [FROM.GetAdjective]им народом."
 bftb_greece.210.a:0 "Розіграно як по нотах."
 bftb_greece.32.b:0 "[FROM.GetAdjectiveCap]ий народ обрав неправильний шлях. Час це виправити."
 bftb_greece.51.desc:0 "Про-[ROOT.GetAdjective]ий уряд в Афінах запросив у нас матеріальну допомогу після того, як політичний розкол усієї нації призвів до спустошливої громадянської війни. Безумовно, вони у своєму праві висловлювати подібне прохання, але лише ми можемо визначити, чи стоять вони затребуваних ними матеріальних цінностей."
 bftb_greece.62.a:0 "В ім'я миру нам треба розв'язати війну."
 bftb_greece.91.a:0 "Таку ініціативу треба підтримати!"
 bftb_greece.96.a:0 "Що він замислив?"
 bftb_news.10.a:0 "Мрія стає дійсністю!"
 bftb_news.12.d:0 "Вони уклали угоду з дияволом..."
 bftb_news.12.t:0 "[ITA.GetAdjective]о-[BUL.GetAdjective]ий обмін військовими технологіями"
 bftb_news.205.t:0 "Відродження Османського султанату"
 bftb_news.302.c:0 "Це їм не допоможе!"
 bftb_news.4.desc:0 "Після смерті царя Боріса III уряд Болгарії прийняв несподіване рішення зустрітися з батьком Боріса, колишнім царем Фердінандом I, і попросити його знову правити країною.\nПісля довгої конференції з [GetFormerLeaderBeforeFerdinand] і Фердінанд I, войовничий правитель, який був змушений зректися престолу на користь сина після катастрофічних поразок у Другій Балканській і Великій війнах, погодився повернутися в Софію та повторно коронуватися царем Болгарії."
 bftb_news.7.desc:0 "Учора в Софії пройшов багатотисячний мітинг, організований болгарським урядом.\nНа мітингу, на превеликий подив, [BUL.GetLeader] оголосив про створення Третього Болгарського царства та сповістив про настання нової епохи для великої болгарської нації.\nЗа цією промовою пішла велична і урочиста церемонія, під час якої [BUL.GetLeader] коронувався імператором Болгарії, а політичні та військові лідери присягнули на вірність імперії та її правителю."
 bftb_turkey.10.t:0 "[TUR.GetAdjectiveCap]ий уряд залишається непохитним"
 bftb_turkey.117.t:0 "Фундаменталісти отруюють регіон [TUR_fundamentalist_state.GetName]"
 bftb_turkey.141.desc:0 "[FROM.GetNameDef] не в змозі змиритися з нашою зовнішньою політикою, тому ми більше не вважаємося союзником цієї держави. Відтепер ми не входимо до альянсу [FROM.GetFactionName]."
 bftb_turkey.19.a:0 "Це темний день для Європи."
 bftb_turkey.3.a:0 "Тепер чекаємо відповідь держави [SOV.GetNameDef]"
 bftb_turkey.31.desc:0 "[FROM.GetAdjectiveCap]ий уряд звернувся до нас із дивовижною пропозицією. Вони хочуть передати нам право на сто відсотків усіх природних руд і металів, що видобуваються в області [342.GetName], замість архіпелагу Додеканес.\n\nНаш уряд більше звик отримувати території, ніж віддавати їх, але [TUR.GetNameDef] пропонує нам джерело ресурсів, які можуть бути дуже важливими для підтримки військової економіки. Чи приймати [FROM.GetAdjective] пропозицію чи ні, вирішувати виключно нам."
 bftb_turkey.40.a:0 "От мерзотники!"
 bftb_turkey.50.desc:0 "Представники держави [FROM.GetNameDef] виявили бажання купити у нас легкі танки. Виразивши трепет перед тим, що вони називають «[ROOT.GetAdjective] генієм» та «бездоганним проєктуванням», [FROM.GetAdjective]і представники повідомили, що держава [FROM.GetNameDef] просто не може захищати свій суверенітет без [ROOT.GetAdjective] бронетехніки."
 bftb_turkey.54.desc:0 "[FROM.GetAdjectiveCap]ий уряд відмовився відправляти нам навіть шасі своєї найстарішої моделі. Як видно, [FROM.GetAdjective]а бронетехніка призначена тільки для [FROM.GetAdjective]ої армії, і верхівка держави [FROM.GetNameDef] посилається на питання національної безпеки як на привід не давати нам танки."
 bftb_turkey.56.t:0 "[FROM.GetNameDefCap] дає нам концесію без жодних умов"
 bftb_turkey.58.desc:0 "[FROM.GetAdjectiveCap]ий уряд погодився на всі наші вимоги в обмін на нашу допомогу у видобутку нафти на сході держави [FROM.GetName]."
 blackshirt_assault_battalion_tech:0 "$blackshirt_assault_battalion$"
 blizzard_icon:0 "GFX_modifiers_weather_icons:4"
 britain.23.t:0 "Індійське повстання"
 britain.7.d:0 "Велика Британія висунула нам ультиматум: або ми припинимо торгівлю з Німеччиною, або вони вторгнуться."
 bruneval_exfiltration_outcome_fail:0 "Після евакуації до Британії виявилося, що нашого агента немає серед тих, кого забрали з пляжу. Неясно, коли саме було втрачено контакт із ним, але слід припускати найгірше."
 byz_restore_byzantine_empire_category_tt:0 "Будуть відкриті рішення: §YВідновити Візантійську імперію§!."
 capture_cyphers_reverse_engineer_desc:0 "У продажу доступний спрощений різновид основного шифрувального апарату країни супротивника. Ми купимо його і досконало вивчимо, щоби розгадати принцип роботи."
 carrier_3_desc:0 "Загальне поліпшення конструкції та спеціалізовані розробки, на зразок бортових підйомників, підвищують ефективність авіаносців."
 case_anton:0 "Операція «Антон»"
 category_artillery:0 "Підтримка артилерії та лінійна артилерія"
 category_exile_forces:0 "Війська у вигнанні"
 category_regimental_support_artillery:0 "Піхотні гармати та ракетні батареї"
 centrism_desc:0 "Центризм — це форма уряду, що має намір досягати поміркованих рішень, що відповідають теперішнім і майбутнім потребам нації, підтримують довіру з боку суспільства та служать загальному благу, враховуючи ризики та контекст цих потреб."
 china.1.t:0 "Інцидент на мості Марко Поло"
 china.106.a:0 "Ми виженемо японських демонів з наших земель."
 china.107.a:0 "Більше в нас нема спільного ворога."
 china.13.a:0 "Ми мусимо провести межу зараз!"
 china.203.t:0 "Комуністичні повстання в області [CHI_communist_state.GetName]"
 china.8.t:0 "Комуністи відступають"
 citizen_militia_tt:0 "Громадяни держави утворюють загони ополчення, які діятимуть, коли вибухне війна."
 claim_bessarabia_desc:0 "У неспокійний період, що пішов за Жовтневою революцією, територія Бессарабії була незаконно зайнята Румунією. Вона по праву належить нам, і її необхідно повернути. Пакт Молотова-Ріббентропа розв'язав нам руки, і ми можемо не боятися втор. діяти!"
 close_combat:0 "Ближній бій"
 coastal_security_goal_name:0 "Контролювати узбережжя"
