 ENG_destroyer_3_desc:0 "Класи «J», «K» і «N» були схожі на попередній клас «Tribal», але замість того акцентувати увагу на гарматному озброєнні, конструктори повернулися до більш стандартної важкої торпеди та легшої установки гармати. Кораблі піддавалися модифікаціям протягом усього періоду військової служби. Модернізація включала поліпшені зенітні гармати та радар. Це були швидкісні, далекобійні та добре озброєні судна, ідеальні для супроводу флоту."
 ENG_enforce_decolonization:0 "Примусова деколонізація"
