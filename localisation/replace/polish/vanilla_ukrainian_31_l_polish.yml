 FIN_bop_modifier_eradicate_socialism:0 "Викорінення соціалізму"
 FIN_cooperation_with_germany_desc:0 "Ми можемо покладатися на геополітичну реальність, що [GER.GetNameDef] і [SOU.GetNameDef] зрештою посваряться один з одним. Якщо ми будемо співпрацювати з [GER.GetAdjective]ими силами, ми можемо бути здатні помститися за наші втрати в попередніх війнах з [SOU.GetAdjective]ою державою і відкрити нові можливості для себе."
 FIN_coup_preparations:0 "Підготовка державного перевороту"
 FIN_crack_down_on_fascists_desc:0 "Фашисти є справжніми ворогами [FIN.GetAdjective]ого народу, і з ними потрібно розправитися якомога швидше."
 FIN_crack_down_on_the_military_divs_tt:0 "Кілька фашистських §Yпіхотних§! дивізій буде розформовано."
 FIN_faction_name:0 "альянсу [ROOT.GetFactionName]"
 FIN_fighter_equipment_2_short:0 "VL Myrsky"
 FIN_finnish_federation_of_trade_unions_desc:0 "Профспілки представляють справжніх майстрів промисловості, робітників. Співпрацюючи з федерацією профспілок, ми можемо реорганізувати всю економіку на користь робітничого класу."
 FIN_finnish_irredentism_desc:0 "Незважаючи на те, що ми здобули незалежність від колишньої Російської імперії, все ще є землі та люди, якими ми маємо по праву керувати, але залишаємося під ярмом гніту наших ворогів. Ми повинні активізувати наш народ для звільнення цих земель."
 FIN_finnish_resistance_category_desc:0 "У рамках секретної військової операції велика кількість [ROOT.GetAdjective]ої армійської зброї та обладнання була розкидана по всій Фінляндії, щоб допомогти елементам [ROOT.GetAdjective]ого опору продовжувати боротьбу проти наших військ."
 FIN_greater_finland:0 "Велика Фінляндія"
 FIN_increase_military_budget_desc:0 "Безпека нації є надзвичайно важливою. Завдяки збільшенню військового фінансування сили оборони будуть добре оснащені та краще підготовлені протистояти абияким можливим загрозам."
 FIN_industrial_upgrade_in_harjavalta:0 "Промислове оновлення в Гар'явалті"
 FIN_innovative_designs:0 "Інноваційні проєкти"
 FIN_integrate_ingria_states:0 "Інтегрувати область [FROM.GetName] як Інгерійську Республіку"
 FIN_mining_the_sea_decision_cost_pp_xp_cp:0 "£pol_power §Y[?FIN.FIN_mining_the_sea_pp_xp_cost]§! £navy_experience §Y[?FIN.FIN_mining_the_sea_pp_xp_cost]§! £command_power §Y[?FIN.FIN_mining_the_se a_cp_cost]§!"
 FIN_modernize_the_army_desc:0 "Пріоритетом будь-якого уряду є захист і безпека його людей. Коли наші збройні сили виявляються нестачами, ми зобов'язані інвестувати в їх модернізацію та вдосконалення до такого рівня, щоб вони знову могли виконувати свій головний обов'язок."
 FIN_mustapaidat:0 "Mustapidat"
 FIN_oy_alkoholiliike_desc:0 "Відчайдушні часи вимагають відчайдушних заходів, і зараз настав час для Алкогольної компанії Oy Alkoholiliike підтримати фінську армію, забезпечивши необхідні компоненти для їх озброєння.\nЗавдяки ретельному виробництву та переробці вони спеціалізуватимуться на створенні високоякісної продукції. ефективні запальні коктейлі, які дають піхоті перевагу, необхідну для нейтралізації легкої бронетехніки противника."
 FIN_prepare_construction_workers_actions_dec_tt:0 "Наша сторона отримає §G+5%§! загальної території та військових підрозділів. \nБуде створено додаткові дивізії комуністичного §Yополчення§!."
 FIN_prioritize_heavy_industry_dec_cost_tt:0 "Вартість рішення §Y$FIN_prioritize_light_industry$§! буде §Rподвоєна§! при пріоритетності важкої промисловості.\n"
 FIN_red_finland_desc:0 "Ми помстилися за наших товаришів, які впали перед білим терором, створивши справжню робітничу республіку. Тепер усе, що залишилося, це захистити те, чого ми досягли, від тих, хто за межами наших кордонів намагався знищити це."
 FIN_secure_the_military_dec_tt:0 "Наша сторона отримає §G+10%§! від загальної території та військових підрозділів і залишить усіх воєначальників."
 FIN_the_last_kinship_war:0 "Остання родинна війна"
 FIN_the_lone_wolf_desc:0 "Нікого так не турбують інтереси [ROOT.GetAdjective]ого народу, як сам [ROOT.GetAdjective]ий народ. Історія показала, що замість того, щоб покладатися на допомогу інших, ми повинні покладатися на себе."
