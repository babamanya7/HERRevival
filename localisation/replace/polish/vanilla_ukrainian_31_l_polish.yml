 sp_air_mothership_strength:0 "Літак-матка - Stronger Frame and Better Armaments"
 sp_armored_lc_specialized_field_manuals_tech_desc:0 "Розробка детальних навчальних посібників, адаптованих для екіпажів сухопутних крейсерів, що охоплюють унікальні операційні процедури, протоколи технічного обслуговування та складні тактики ведення бойових дій, необхідні для ефективного управління цими гігантськими бойовими машинами."
 sp_land_generic_reward_artillery_tech_2:0 "$sp_land_generic_reward_armor_tech_2$"
 sp_land_reward_land_cruiser_communication:0 "Проблема системи зв'язку"
 sp_land_reward_option_land_cruiser_ammunition_simplified:0 "Використати спрощену систему"
 sp_land_reward_option_multi_charge_large_caliber_gun_test_failure_desc:0 "Під час вирішального випробування катастрофічний вибух сколихнув полігон, знищивши гармату та завдавши значних руйнувань прилеглій інфраструктурі. Команда [Character.GetName] мусила з'ясовувати причини вибуху та ліквідувати наслідки інциденту, зокрема пильну увагу громадськості та ймовірні затримки в графіку проєкту."
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01:0 "Прорив в армуванні бетону"
 sp_landward_forts_focus_desc:0 "Нинішня оборона острова Сінгапур є недостатньою. Ми мусимо зосередити наші зусилля на зміцненні укріплень!"
 sp_naval_modern_battleship_desc:0 "Інші можуть вважати, що майбутнє морських боїв буде належати авіаносцям, але ми тут, щоб переконати їх у тому, що вони помиляються."
 sp_naval_modern_carrier_preference_a_b:0 "Ворожа артилерія"
 sp_naval_super_heavy_battleship_desc:0 "Хоча в останні роки морська гонка озброєнь стала більш різноманітною, важко заперечувати велич лінкорів і потенціал для створення ще більших гігантів."
 sp_naval_super_heavy_battleship_preference_a_a:0 "Важкі гармати"
 sp_naval_super_heavy_battleship_tt:0 "Додати технологію: §YНадважкий корпус§!"
 sp_nuclear_bomb:0 "Проєкт бомби з поділом ядра"
 sp_nuclear_bomb_critical_mass_generic_reward_desc:0 "Критична аварія сталася під час експериментів із визначення критичної маси, що призвело до радіаційного опромінення та жертв серед ключового персоналу."
 sp_nuclear_major_political_interference_generic_reward_option_keep:0 "[(Character?.GetName:'CAP_SCIENTIST)] залишиться"
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc:0 "Нашим інженерам вдалося значно поліпшити дальність і надійність імпульсного двигуна, підвищивши бойові можливості ракети."
 sp_rockets_high_speed_flight_control_reward_desc:0 "Нам нарешті вдалося створити робочу систему управління, яка може функціонувати на високих швидкостях і реагувати на зміну динаміки польоту. Ці знання, безсумнівно, можуть бути корисними і в інших сферах."
 sp_rockets_long_range_ballistic_missile_desc:0 "Міжконтинентальна балістична ракета, ймовірно, - найбільша ракета, яку нам коли-небудь знадобиться побудувати; вона здатна доставити боєголовку з високою точністю практично в будь-яку точку земної кулі."
 sp_rockets_rocket_bomber:0 "$rocket_propelled_bombs$"
 sp_tag_nuclear_warfare:0 "Проєкти ядерної війни"
 sp_tag_radar:0 "Проєкти радарів"
 sp_thermo_nuclear_bomb_desc:0 "Справді важко уявити щось більше за бомбу з поділом ядра, але завдяки ядерному синтезу можна створити вибух набагато потужніший, ніж будь-що створене раніше."
 sp_torpedo_cruiser_eq_bonus_torpedo:0 "Торпедний крейсер - Enhanced Torpedo Capability"
 spain.9.a:0 "Підтримати Народний фронт."
 ss_recruitment_event.12.desc:0 "Гестапо підготувало новий і дуже тривожний звіт. Очевидно, група високопоставлених офіцерів Вермахту почала проводити регулярні зустрічі у віддаленому маєтку десь у Східній Пруссії.\n\nЗамасковані під звичайну сесію гри в бридж, ці зустрічі тривають щонайменше кілька місяців і, здається, там представлене дуже вибране коло офіцерів. Служби безпеки поки що не змогли залучити людину всередину, але всі офіцери, які підтвердили, що вони пов'язані з цим «прусським колом», дуже відверто висловлювали свою зневагу до націонал-соціалістичного уряду і, зокрема, його рішення розширити Waffen-SS.\n\nНаразі мало вказівок на те, що є кінцевою метою цього сюжету, і чи це взагалі є метою."
 st_olavsmedaljen:0 "Орден Святого Олава"
 strat_bomber_equipment_desc:0 "Стратегічні бомбардувальники атакують споруди та інфраструктуру супротивника, знищуючи промисловість."
 strat_bomber_intercontinental:0 "Міжконтинентальний бомбардувальник"
 strikes_event.3.desc:0 "\"Industrial war is more than just divisions marching and planes bombing. It is more than just the duty of a soldier to fight and die for their country. An industrial war is won, first and foremost, in the factories and foundries. To abandon the battle on the assembly line is no better than abandoning it on the front line. And the victories of the assembly line should be celebrated just as much as the ones won by the front line.\"\n\nAll available propaganda resources have been rerouted to show the work of the armaments workers in the best possible light. [Root.GetLeader] has personally approved a new award to be given out for workers who have exceeded their quota by more than 100%, and the first recipients have been sent on tours around the country to instruct other workers in their methods.\n\nIt appears that this has made a lot of the strikers reconsider their stance. Work has resumed in all previously affected factories."
 strikes_event.4.t:0 "Відділ військового виробництва"
 strikes_event.7.desc:0 "The troops assembled outside the towns overnight, maintaining noise and light discipline to keep the element of surprise. As the sun crept over the horizon and the workers manning the barricades at the factories looked forward to relief by the day shift, the assault columns moved in. The tired workers were sluggish to organize the resistance and quickly overcome. Leaving a small detachment to guard the prisoners, the troops sweept the town, arresting everyone on the list of known factory workers. By noon, the military had taken full control of the cities and instituted a curfew. No further resistence is expected. The majority of workers will soon be released on the condition that they return to work, the ring leaders will be held and put on trial. Death sentences are expected to be handed down."
 subsidiary_carrier_role_ti:0 "$subsidiary_carrier_role$"
