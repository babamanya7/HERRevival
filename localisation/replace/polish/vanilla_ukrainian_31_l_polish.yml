 PER_AI_BEHAVIOR:0 "@PER Іран"
 PER_add_organizer_trait_tt:0 "§YДва§! випадково обрані армійські лідери отримають рису «Організатор»."
 PER_clamp_kurdish_dissidence:0 "Приборкати курдське інакомислення"
 PER_communist_events.10.t:0 "[FROM.GetNameDefCap] надсилає флот"
 PER_communist_naval_designs:0 "Військово-морська співпраця"
 PER_currently_doing_war_plan:0 "Наразі працюємо над §YВійськовим планом§!."
 PER_develop_qorkhaneh_desc:0 "Корханег був нашим основним джерелом виробництва зброї та боєприпасів у Тегерані. Варто було б інвестувати ресурси у розвиток арсеналу Корханег, щоб забезпечити, що наше виробництво обладнання залишається у відмінному стані для будь-якого потенційного конфлікту."
 PER_establish_airforce_desc:0 "Імперські [PER.Adjective] Повітряні сили були офіційно створені у 1920 році Резою-шахом Пехлеві. Однак тепер, коли над світом нависає загроза війни, ми повинні зміцнити здатність нашої нації брати участь у битвах у небі, хоча б для того, щоб забезпечити безпеку [PER.GetNameDef] на десятиліття вперед."
 PER_exclude_religion:0 "Виключити релігію"
 PER_expand_imperial_guard_desc:0 "Як найновіша велика родина, що править [PER.GetNameDef], дім шаха потребує лише найкращого, коли справа доходить до королівської гвардії. Якщо вони будуть належним чином оснащені та навчені, то зможуть приєднатися і до наших фронтів."
 PER_fascist_attack_turkey:0 "Приборкати [TUR.GetAdjective] загрозу"
 PER_fascist_reach_out_to_germany_desc:0 "Оскільки наше втягнення в той чи інший глобальний конфлікт здається все більш імовірним, можливо, ми повинні об'єднатися з однодумцями, такими як режим [GER.GetNameDef]."
 PER_foreign_policy_events.4.a:0 "Розпочати підготовку!"
 PER_foreign_policy_events.5.a:0 "Як завжди, такі ненадійні..."
 PER_hormuz_crisis_desc:0 "Імперіалісти відступають, настав час силою вигнати їх з регіону, погрожуючи атакою з усіх фронтів. Ми розпочнемо процес, заблокувавши Ормузьку протоку для імперського судноплавства."
 PER_imperial_events.11.t:0 "[FROM.GetNameDefCap] погоджується відмовитися від Белуджистану"
 PER_imperial_events.180.t:0 "[FROM.GetNameDefCap] пропонує присягнути на вірність"
 PER_imperial_events.20.desc:0 "Сьогодні вдень у центрі Тегерана пролунали постріли, коли під час промови до нації Реза-шах Пехлеві був уражений кулею та опинився у критичному стані. Незважаючи на всі зусилля рятувальників, шах, на жаль, помер від отриманих травм. Винуватцями виявилися офіцери [PER.GetAdjective] армії, які були незгодні з керівництвом шаха. Син Рези-шаха Пехлеві, Мохаммед Реза Пехлеві, має бути приведений до присяги як новий шах [PER.GetNameDef]. Будемо сподіватися, що його правління буде менш бурхливим."
 PER_imperial_events.50.t:0 "Реза-шах Пехлеві переживає спробу вбивства!"
 PER_imperial_events.62.t:0 "[GER.GetNameDefCap] відхиляє нашу пропозицію"
 PER_increase_military_funding:0 "Збільшити військове фінансування"
 PER_infantry_equipment_0:0 "Mauser 98"
 PER_infantry_equipment_1:0 "Zbrojovka Brno vz. 24"
 PER_intervene_in_central_asia_desc:0 "Ми послабили [SOU.GetAdjective] контроль над Центральною Азією. Крім того, вони відволікаються на конфлікти по всьому світу. Тому ми повинні використати цей момент, щоб раз і назавжди витіснити їх із регіону."
 PER_intervention_in_iraq_desc:0 "[IRQ.GetNonIdeologyName] — це лише конструкція Західних імперіалістів, які малюють кордони на карті. Така нація є нежиттєздатною і має бути повернута своїм законним власникам, нам."
 PER_islamic_restoration:0 "Опір гарбзадегі"
 PER_land_reform_desc:0 "З успіхом революції ми запровадимо далекосяжні земельні реформи, які звільнять економіку від кайданів феодалізму."
 PER_legacy_of_gilani_desc:0 "Озра Гілані була першою жінкою, яка приєдналася до Імперських [PER.Adjective] Повітряних сил, і таким чином створила прецедент для майбутнього, в якому наші збройні сили будуть більш інклюзивними. Ми повинні працювати над визначенням ролі жінок у наших військових та дозволити їм літати як пілотам. Вони також повинні мати право добре служити своїй країні."
 PER_metropolitan_iran:0 "Метрополіс [ROOT.GetNonIdeologyName]"
 PER_national_bank:0 "Зміцнити Національний банк [ROOT.GetNonIdeologyName]"
 PER_nationalize_oil_fields:0 "Націоналізувати нафтові родовища"
 PER_neutrality_party:0 "Династія Пехлеві"
 PER_qorkhaneh_organization:0 "Корхане"
 PER_rally_bakhtiari_and_qashqai_desc:0 "Незадоволені зміною режиму, племена бахтіарів та кашкаїв почали чинити опір новому правовому режиму. Ми могли б скористатися цим, і якщо ми згуртуємо їх навколо нашої справи, у нас буде більше людей, які допоможуть нам боротися, якщо наш рух за незалежність стане кривавим."
 PER_reject_foreign_dominance_desc:0 "[SOU.GetNameDefCap] та [ENG.GetNameDef] стоять прямо біля нашого порогу. Зрозуміло, що ми можемо стати суб'єктом, якщо негайно не почнемо діяти. Настав час нам витягнути голови з піску та почати чинити опір діям «Великої гри»."
 PER_request_membership_allies_desc:0 "Зі зростанням напруги по всьому світу, настав час нам нарешті обрати сторону. З огляду на те, що ми зблизилися з нашими західними друзями, найрозумніше для нас — об'єднатися з ними. Разом ми зможемо покінчити із загрозою фашизму у всьому світі."
 PER_reverse_engineer_tanks:0 "Зворотне проєктування іноземних танків"
 PER_ssb_events.10.desc:0 "[FROM.GetAdjective] уряд завершив угоди з провідними компаніями по всьому регіону Саадабаду, обмінюючи велику кількість [SSB_resource_event_scripted_loc] на різноманітні ресурси. Хоча основна частина [SSB_resource_event_scripted_loc] надходить безпосередньо приватним особам, наш уряд зберігає скромну частку як адміністративний збір."
 PER_ssb_events.9.t:0 "Світанок Саадабадської дослідницької співпраці"
 PER_tehran_moscow_pact:0 "Тегерансько-московський пакт"
 PER_third_persian_empire:0 "Третя Перська імперія"
 PER_trans_iranian_railway_desc:0 "У 1927 році ми розпочали роботу над загальнонаціональною залізничною лінією, відомою як Трансіранська залізниця. Тепер, коли ми стрімко прямуємо до модернізації [ROOT.GetNonIdeologyName], вкрай необхідно, щоб ми спрямували гроші на завершення цього монументального проєкту."
 PER_war_plan_darius_desc:0 "Дарій Великий був правителем Ахеменідів, який служив Персії як цар царів у нашій стародавній історії. Він правив Персією на її територіальному піку, включаючи аж до Долини Інду. Таким чином, його ім'я тепер служитиме нам для наших планів вторгнення на Індійський субконтинент та вигнання [ENG.GetAdjective]s з цих земель."
 PHI_aircraft_requisition_desc:0 "Ми не змогли розвинути власну значну авіабудівну промисловість, тому повністю покладалися на американські літаки. Наша потреба зросла, тому ми повинні реквізувати більше літаків у наших американських спонсорів."
 PHI_align_with_the_usa:0 "Орієнтація на США"
 PHI_american_intervention_recognize_unions:0 "Визнати профспілки"
 PHI_assassination_of_quezon:0 "Вбивство Кесона"
 PHI_bicameral_legislature_desc:0 "Розширення нашого уряду триває. Ми вже створили нижню палату, і тепер настав час заснувати верхню. За цією моделлю ми зможемо найкращим чином ухвалювати нові закони для нашої нації."
 PHI_government_in_exile_cat:0 "Співпраця уряду у вигнанні"
 PHI_grassroot_guerillas_desc:0 "На території нашої країни діє дуже багато організацій опору, однак їм бракує централізованого командування та контролю, щоб спрямувати всі їхні зусилля в більш скоординоване русло для вигнання окупантів. Бойовий дух є, його просто потрібно належним чином приборкати і направити на найвразливіші цілі."
 PHI_hispanic_coalition:0 "Латинська коаліція"
 PHI_investment_plan_2_tt:0 "Який буде успішним і надасть кращі винагороди, якщо ми досягнемо добрих торговельних відносин щонайменше з 3 регіональними державами, контролюватимемо §Y$naval_base$§! 6-го рівня та побудуємо щонайменше 1 нову §Y$dockyard$§! під час плану"
 PHI_manila_tag_neutrality:0 "Філіппінська республіка"
 PHI_manila_tag_war_fascism:0 "$PHI_manila_tag_fascism$"
 PHI_maphilindo_tag_fascism:0 "Малайська імперія"
 PHI_mosquito_fleet:0 "Москітний флот"
 PHI_nationality_act:0 "Закон про національну приналежність"
 PHI_nationality_act_desc:0 "[USA.GetNameDefCap] ухвалюють Закон про національну приналежність, який переглядає існуючі закони про громадянство, включаючи ті, що стосуються філіппінців та їхнього статусу в Сполучених Штатах. Закон уточнює, що філіппінці визнаються особами з приналежністю до США (nationals), а не громадянами США, що дозволяє їм жити і працювати в [USA.GetNameDef], але без повних прав громадянства."
 PHI_open_borders:0 "Відкриті кордони"
 PHI_pambansang_sosyalista_party_long:0 "Національна соціалістична партія"
 PHI_polynesia_tag_communism:0 "Федеративна Морська Співдружність"
 PHI_purchasing_weapons:0 "Очікування відповіді щодо запропонованого продажу"
 PHI_reduce_unneccessary_expenditure:0 "Зменшити непотрібні витрати"
 PHI_resolve_interregnum_tt:0 "§GЦе завершить період міжвладдя і дозволить призначити нового лідера.§!"
 PHI_second_republic_tag_communism_DEF:0 "Друга Філіппінська народна республіка"
 PHI_second_republic_tag_democratic_ADJ:0 "Філіппінськ"
 PHI_usa_focus_done_T2_tt:0 "Завершено принаймні два з фокусів: §YПрив'язати песо до долара§!, §YПро-хасендадос§! або §YЗакон про громадянство§!."
 PHI_war_for_oceania_desc:0 "Океанія визначається самим океаном, але наш народ подорожував цими водами з давніх-давен. Настав час включити ці острови до нашої нації, що розростається."
 PLANES_PASSING_THROUGH_REGION:0 "\n§HЛітаки проходять крізь регіон§!\n"
 PLANNING_SPEED_FROM_LOCAL_INTEL_NETWORK:0 "Швидкість планування за локальної розвідки: $FACTOR|+%$"
 PLAN_EXECUTE_BALANCED_TITLE:0 "Виконувати бойові плани §Yзбалансовано§!"
 PLAN_EXECUTE_RUSH_DESC:0 "Військові частини атакуватимуть провінції, якщо вони є частиною плану, навіть якщо ще означатиме розтягнути лінію фронту або поставить деякі частини у вразливі позиції."
 PLAY_AS_OBSERVED:0 "Грати за державу"
 PLU_fascism_ADJ:0 "Палауськ"
 PNG_communism_ADJ:0 "Папуанськ"
 POK_ADJ:0 "Даяцьк"
 POLITICS_GOAL_FAILED_DESC:0 "$NAME|R$"
 POLITICS_IDEA_STAT_CONSUMER_GOODS:0 " £consumer_goods_texticon£ $VALUE|H0%$"
 POL_CAS_equipment_3_short:0 "Okoń"
 POL_LIT_union_desc:0 "[Root.GetLeader] — король і Польщі, і Литви. Тепер усе, що залишилося, — це знову об'єднати Сеймас із Сеймом, і Річ Посполита зродиться наново."
 POL_VICTORY_POINTS_11301:0 "Бялисток"
 POL_VICTORY_POINTS_3473:0 "Костшин-над-Одрою"
 POL_VICTORY_POINTS_552:0 "Лєгниця"
 POL_VICTORY_POINTS_6332:0 "Крулевець"
 POL_VICTORY_POINTS_6375:0 "Ольштин"
 POL_additional_research_slot1_desc:0 "Математика займає центральне місце майже у всьому, що відбувається в технологічному секторі. По всій Польщі, від Львова до Варшави, математичні школи процвітають. Ми повинні скористатися цим золотим віком польських мислителів і надати цим людям все необхідне, щоб зробити Польщу технологічним центром сили, на який вона заслуговує!"
 POL_additional_research_slot2_desc:0 "Варшавський університет — це місце, де навчається більшість найкращих умів Польщі, щоб викладати, вчитися та розширювати технологічні можливості Польщі. Інвестуючи в розширення університету, ми матимемо місця для ще більшої кількості умів та мислителів, які зміцнюватимуть польську державу!"
 POL_air_base_expansion_desc:0 "Авіабази такі ж важливі для повітряної підтримки, як і повітряна підтримка для сучасних війн."
 POL_annex_czech:0 "Анексувати Чехословаччину"
 POL_anti_soviet_offensive:0 "Антиросійські плани"
 POL_attract_poles_to_gdynia_desc:0 "Великий морський порт потребує великих людей, щоб керувати ним, і є незліченна кількість поляків, які чекають на роботу. Заохочуючи міграцію до Гдині, ми можемо продовжити наш проєкт розвитку морського порту."
 POL_central_region_strategy:0 "Стратегія центрального регіону"
 POL_claim_prussia_desc:0 "Східна Пруссія є домом для незліченних литовських і польських меншин, і настав час, щоб ці люди об'єдналися зі своїми товаришами в Речі Посполитій."
 POL_claiming_lithuania_desc:0 "Є багато тих, хто в рівній мірі претендує на Польщу і Литву, і було б надзвичайно корисно для амбіцій кожного поляка відновити Річ Посполиту, якби ми зробили це під владою короля, здатного претендувати на божественне право на обидві держави."
 POL_cossack_republic_decisions_desc:0 "Під час Громадянської війни в Росії було створено кілька незалежних козацьких держав, які воювали пліч-о-пліч із білими. Зараз, коли білі вигнанці просуваються вглиб російської території, у нас є можливість відродити загиблі республіки."
 POL_cruiser_tank_experiments:0 "Експерименти з крейсерськими танками"
 POL_defensive_focus_desc:0 "Ми не почнемо наступну війну, але ми подбаємо про те, що завершимо її."
 POL_expand_gdynia_seaport_desc:0 "Тепер, коли Гдиня перетворилася на велике торгове місто, яке може конкурувати з Данцигом, залишилося лише офіційно відкрити місто для торгівлі, і наша економіка знову буде належати нам і тільки нам, щоб контролювати її!"
 POL_fight_capitalism_decisions_desc:0 "Капіталізм — це чума. Багато капіталістичних країн називають себе демократичними, але їхня буржуазна демократія — лише ширма для поневолення пролетаріату. А обов'язок кожного соціаліста — звільняти своїх товаришів."
 POL_fighter_equipment_2:0 "PZL.56 Kania"
 POL_fulfil_fifth_of_november_desc:0 "Після того, як регентська рада знову зібралася, настав час відчинити двері для всіх претендентів на польський трон."
 POL_governorate_livonia:0 "Губернаторство Лівонія"
 POL_habsburg_events.2.desc:0 "Обидві наші нації тепер правлять Габсбурги, і [From.GetLeader] висуває пропозицію: [Root.GetNameDef] і [From.GetNameDef] повинні об'єднати сили, щоби спільно захищати інтереси династії Габсбургів по всій Європі."
 POL_hohenzollern_sigmaringen:0 "Гогенцоллерни"
 POL_infantry_equipment_0_short:0 "Kb Mauser wz. 98a"
 POL_integrate_the_falanga:0 "Інтегрувати Фалангу"
 POL_invest_in_the_peasantry_desc:0 "Селяни боролися за нас, обіцяючи, що ми покращимо життя на селі, і ми маємо намір виконати цю обіцянку. Належна залізнична та інфраструктурна мережа гарантує, що ніхто не залишиться позаду."
 POL_invite_the_lowlands:0 "Запросити Нижні землі"
 POL_mechanized_equipment_1:0 "C4P"
 POL_nav_bomber_equipment_1:0 "PZL.57 Foka"
 POL_paramilitarism:0 "$paramilitarism$"
 POL_polish_peoples_republic_desc:0 "[GetSovietPolishPeoplesRepublicDesc]"
 POL_push_for_ruthenia:0 "Пробитися крізь Рутенію"
 POL_reassert_silesian_claims_desc:0 "Доля Сілезії була предметом великих суперечок на початку існування Польської Республіки, і тодішній уряд погодився поступитися більшою частиною Сілезії і задовольнитися відносно невеликою Верхньою Сілезією. Сильний уряд не пішов би на таку поступку, і ми повинні відстоювати наші права."
 POL_resistance_industries_desc:0 "Хоча батьківщина втрачена, нам все ще потрібна потужна промислова база, за допомогою якої ми зможемо розширювати польську розвідку і розвивати будь-яку територію, яку ми відвоюємо у ворога."
 POL_sanacja_falanga_decisions:0 "Ендеція та Фаланга"
 POL_skirmish_with_monarchist_militants:0 "Обеззброїти монархістських бойовиків"
 POL_soviet_industry:0 "[GetSovietIndustrialInvestmentTitle]"
 POL_state_catholicism_desc:0 "Католицька ідентичність є невід'ємною частиною ідеології фалангістів, і тому церква та держава повинні бути одним цілим."
 POL_the_sanation_left:0 "Ліва санація"
 POPUP_EVENTS:0 "Події"
 POR_anti_fascism_desc:0 "Фашизм є великою загрозою для нашої справи, і з ним потрібно боротися. Ми повинні боротися всіма засобами, щоби звільнити світ від його пазурів зла."
 POR_develop_mozambique:0 "Розвинути Мозамбік"
 POR_fascist_portugal_joins_scw_tt:0 "§YФашистська Португалія§! приєднується до держави §Y[SPA.GetFlag][SPA.GetName]§! в їхній війні проти [GetSpanishRepublicFlagAndNameDef]."
 POR_iberian_summit_diplomatic_approach:0 "Іберійські держави йдуть на зближення"
 POR_join_the_carlist_fight_desc:0 "Найкращий спосіб забезпечити перемогу карлістів у громадянській війні в Іспанії — це боротися на стороні Рекете й самим перемогти інші іспанські фракції."
 POR_national_syndicalism_desc:0 "Ми виправимо помилку Салазара щодо розпуску Національного синдикалістського руху та вигнання Франсішку Ролана Прету. Ми повинні знову легітимізувати рух і повернути Прету."
 POR_neutrality_opinion_democratic:0 "Демократична думка"
 POR_portuguese_artillery:0 "Португальська артилерія"
 POR_send_assistance_desc:0 "Доля націоналістів у громадянській війні в Іспанії висить на волосині, оскільки фронти, здається, консолідувалися. Ми повинні приєднатися до боротьби та допомогти повстанцям перемогти республіканський уряд, викорінивши комуністичну загрозу в Іберії раз і назавжди."
 POR_submarine_2_desc:0 "The Delfim class consisted of a pair of submarines originally ordered and laid down in Italy for the Portuguese Navy in the early 1930s. The order was cancelled and they ships were instead completed for the Italian Navy. They were based on the large, Italian Squalo class, displacing 980 tons and armed with eight 533mm torpedo tubes."
 POR_textile_industry_desc:0 "Щоб повністю розкрити потенціал нашої текстильної промисловості, ми повинні побудувати нові фабрики, які дозволять нам переробляти велику кількість бавовни, виробленої на наших територіях."
 POR_unify_leftist_youth_wings:0 "Об'єднати лівацькі молодіжні крила"
 PRC_CSCEC_civs:0 "Спеціалізація CSCEC — Цивільна промисловість"
 PRC_CSCEC_mils:0 "Спеціалізація CSCEC — Військова промисловість"
 PRC_a_new_central_committee_tt_1:0 "Протягом §Y180 днів§!:"
 PRC_agricultural_reform:0 "Сільськогосподарська реформа"
 PRC_army_reforms:0 "Армійські реформи"
 PRC_asian_democratic_union_faction:0 "Азійський демократичний союз"
 PRC_centralized_army_command:0 "Централізоване армійське командування"
 PRC_closer_ties_to_sov_desc:0 "Ми повинні прагнути ще тісніших відносин із [SOV.GetNameDef]. Китайсько-радянські зв'язки міцні, але їх потрібно зробити ще міцнішими."
 PRC_connecting_the_country:0 "З'єднати країну"
 PRC_conventional_warfare_completed_tt:0 "Після завершення §Y$PRC_conventional_warfare$§!:"
 PRC_convince_wang_jiaxiang:0 "£BoP_right_texticon Переконати §Y$PRC_wang_jiaxiang$§! повернутися до 28-ми"
 PRC_cruisers_desc:0 "Легкоозброєні, але універсальні крейсери, такі як судна класу «Кіров», дозволять нам захищати моря поблизу дому. Давайте придбаємо кілька незавершених корпусів і закінчимо будівництво."
 PRC_establish_guerilla_cells_tt:0 "Замінити §Y$PRC_guerilla_cells_active_1$§! на §Y$PRC_guerilla_cells_active_2$§!. Ефективні зміни:"
 PRC_form_the_academy_of_sciences_desc:0 "Ми об'єднаємо різні науково-дослідні комплекси та університети, щоби створити єдину організацію з більш ефективним управлінням."
 PRC_heavy_tank_equipment_3_short:0 "Type 43 Dà"
 PRC_huangyadong_arsenal_cave_industry_trait:0 "Печерна промисловість"
 PRC_indirect_fire:0 "Вогонь із закритих позицій"
 PRC_infiltrate_east_hebei:0 "Проникнути в Східний Хебей"
 PRC_infiltrate_gansu:0 "Проникнути в Ганьсу"
 PRC_lessons_learnt_desc:0 "Досвід, який ми отримали з часів Великого походу, слід використати для точного налаштування досягнень у нашій військовій доктрині та підготовці."
 PRC_light_plane_focus:0 "Розробки легкої авіації"
 PRC_light_tank_aa_equipment_2_short:0 "PGZ 36"
 PRC_light_tank_destroyer_equipment_2_short:0 "PTZ 36"
 PRC_light_tank_equipment_1:0 "Type 34 Xiao"
 PRC_medium_tank_destroyer_equipment_2:0 "PTZ 41 Z"
 PRC_military_shortcut:0 "Військо"
 PRC_naval_mio_desc:0 "Враховуючи відсутність у нас промисловості у військово-морському секторі в минулому, уряд повинен забезпечити ефективну роботу новостворених організацій для морського виробництва."
 PRC_nuclear_missile_equipment_1:0 "Dongfeng 2"
 PRC_petition_for_freedom:0 "Петиція про незалежність"
 PRC_prepare_for_the_inevitable_desc:0 "Експансіоністські наміри як з боку [JAP.GetNameDef], так і, можливо, навіть нашого традиційного союзника [SOV.GetNameDef], маячать на горизонті. Ми повинні відкласти ідеологічні розбіжності та підготуватися виступити єдиним фронтом проти зовнішніх загроз."
 PRC_promote_guerilla_warfare_desc:0 "Червона армія не може сподіватися зрівнятися силою з нашими ворогами — принаймні поки що. \n\nМи повинні використовувати наші сильні сторони та битися в тилу ворога, перш ніж швидко зникати, щоб завдати удару знову."
 PRC_rally_the_industry_desc:0 "Наше переміщення залишило нашу промисловість дезорганізованою. Ми повинні дослідити, що можна зробити з виробничими інструментами, які ми взяли у Великий похід, і спробувати повторно використати ці забуті ресурси наших початкових баз."
 PRC_rally_the_peasants_desc:0 "Селянство становить нашу головну базу підтримки через неефективне управління [CHI.GetNameDef]. Вони багато отримають від наших обіцяних реформ."
 PRC_request_for_aid_desc:0 "[SOV.GetNameDefCap] від самого нашого заснування підтримували наші зусилля, водночас уникаючи прямого втручання. Однак нинішня світова ситуація вимагає більше, ніж символічної підтримки, тому необхідно надіслати місію з проханням про надання [SOV.GetAdjective]ого спорядження для розбудови нашої армії."
 PRC_return_manchuria_communist:0 "Вимогти повернення Маньчжурії"
 PRC_rural_recruitment_tt:0 "При §Yінфільтрації§! §Yсільського§!, §Yрозвиненого сільського§! або §Yскотарського§! регіону ви отримаєте §G[?PRC_rural_recruitment_manpower]§! людських ресурсів"
 PRC_rural_region_development_desc:0 "Для сприяння покращенню якості життя в [ROOT.GetNameDef], виробництво продовольства має бути збільшене шляхом інвестування в модернізацію ферм у наших сільських районах."
 PRC_sea_china_medical_university:0 "$PRC_china_medical_university$"
 PRC_socialism_with_chinese_characteristics_desc:0 "Праці Маркса, безсумнівно, блискучого теоретика, написані з європейського погляду. Особлива ситуація, в якій опинився Китай, враховуватиметься при втіленні в життя соціалістичних ідей."
 PRC_strengthen_the_left_wing_of_the_kmt_desc:0 "У націоналістів вистачає своїх проблем: деякі елементи ведуть підривну діяльність, прагнучи не допустити угоди між нашими режимами. Потрібно зробити все можливе, щоб підтримати наших союзників у боротьбі за владу."
 PRC_the_peoples_doubt:0 "Зростаючі сумніви"
 PRC_the_unwilling_diarchy_focus_tt:0 "Ви не зможете сформувати або приєднатися до §YДругого Об'єднаного фронту§!"
 PRC_to_steal_an_army:0 "Вкрасти армію"
 PREFERRED_TACTIC_REQUIRED_SKILL:0 "Потрібен $SKILL_LEVEL|H$ рівень навичок\n"
 PREPARED_OPERATION_REFUND_TOOLTIP:0 "Витрати на операцію будуть повернуті через $DAYS|R$ дн."
 PRE_fascism_ADJ:0 "Прусськ"
 PRODICTION_MIC_SENT_TO_OVERLORD:0 "Наш володар використовує $AMOUNT|R$ наших військових заводів, лишаючи нам лише $LEFT|H$."
 PRODUCTION_CONSUMER_GOODS_DESC:0 "В умовах поточної економічної політики наше населення розраховує, що $PERCENTAGE|H0%$ з $TOTAL_FACTORIES|H$ цивільних і військових заводів виробляють споживчі товари. Цю потребу задовольняють $GENERAL_FACTORIES|H$ цивільних заводів, що залишає нам $OPERATIONAL|H$ заводів, із яких $TRADE_USABLE|H$ можна використовувати для торгівлі."
 PRODUCTION_ENTRY_NEW:0 "(нове)"
 PRODUCTION_FILTER_RIGHTCLICK:0 "\n§GКлацніть ПКМ§!, щоби згорнути або розгорнути всю цю категорію."
 PRODUCTION_NAVAL_NAME_LIST_ADD_NAME:0 "§GКлацніть§!, щоби назвати наступне ($EQUIPMENT|H$) в цій лінії $NAME|H$."
 PRODUCTION_OUTPUT_EXPLAIN_REFIT:0 "Наші $FACTORIES|Y$ £factory_item£ військових заводі мають об'єм випуску £production_cost£ $OUTPUT|Y$.\nКонверсія $FROM|Y$ коштує £production_cost£ $COST|2Y$, тож ми можемо конвертувати $PERTIMEPERIOD$.\n"
