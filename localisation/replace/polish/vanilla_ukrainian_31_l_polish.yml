 ARG_juan_peron_elected_desc:0 "Після періоду політичних потрясінь, настав час, щоб [ARG.GetNameDef] мала популярного та улюбленого лідера. З обіцянками, що викликають почуття гордості та безпеки в аргентинського народу, Хуан Перон став очевидним вибором нового президента нашої великої країни. З його улюбленою дружиною Евою поруч, нарешті настав час зміцнити [ARG.GetNameDef] проти бурі."
