 siam.36.a:0 "Визнати борг і почати виплати."
 siam.40.t:0 "Уряд [FROM.GetAdjective] відхиляє нашу пропозицію"
 siam.49.a:0 "Ми отримали союзника."
 siam_adc.3.desc:0 "Уряд [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] обрав незалежність. Оскільки окупаційна адміністрація тепер має бути розпущена, [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] готується відновити своє місце серед суверенних націй світу."
 siam_adc.4.desc:0 "Попри можливість здобути свободу, уряд [FROM.GetNameDef] відхилив негайну незалежність. Їхні міністри стверджують, що держава ще не готова витримати тягар повного суверенітету і віддає перевагу, поки що, збереженню статус-кво."
 siam_dem.5.c:0 "Генерал Пхін Чунхаван. Армія отримає своє місце."
 south_american_events.10.a:0 "[FROM.GetAdjectiveCap]ому уряду нас не перехитрити!"
 south_american_events.11.b:0 "Змусимо їх платити за загрозу республіці!"
 south_american_events.22.t:0 "[ECU.GetNameDefCap] відхиляє нашу пропозицію миру"
 south_american_events.30.t:0 "Тиск з метою ізоляції [FROM.GetNonIdeologyName]"
 south_american_events.53.desc:0 "[FROM.GetAdjective] дипломати повідомили нам, що [USA.GetNameDef] не має права втручатися у нібито законні претензії їхнього уряду. Таким чином, вони заявили, що продовжуватимуть діяти у своїх власних інтересах у Західній півкулі, доки вважатимуть це за необхідне."
 south_american_events.54.desc:0 "Ми отримали термінове повідомлення від [FROM.Capital.GetCapitalVictoryPointName] про те, що вони не дозволять акту агресії, що здійснюється проти нас, і що вони ведуть переговори з нашими ворогами про припинення воєнних дій. Якщо їм не вдасться це зробити, вони присягнули прийти нам на захист."
 south_american_naval_arms_race_category:0 "[toa_purchase_dreadnaughts_descision_cat]"
 south_american_news.12.b:0 "Ми покінчили з їхнім підлим путчем!"
 south_american_news.14.b:0 "Наше майбутнє — з німцями."
 south_american_news.50.a:0 "Більшовицькі зрадники отримали те, на що заслуговували."
 south_american_news.50.t:0 "Бразилія запроваджує надзвичайний стан"
 sov_jap_border_conflict_won:0 "Досвід від прикордонної сутички в Кореї:"
 soviet.11.d:0 "[FROM.GetNameDefCap], схоже, прагне самознищення, а дурні в їхньому уряді відмовляють нашим військам у доступі до своєї країни. Невже вони думають, що їм буде краще під німцями? Їхні егоїстичні лідери скоюють злочин проти народу, відмовляючи своїм громадянам у справжньому соціалізмі."
 soviet.46.t:0 "Велика Вітчизняна війна"
 soviet.48.b:0 "Комунізм у одній державі провалився. Нам потрібен Троцький."
 soviet.49.d:0 "Зі зростанням параної Сталіна партія й армія розділилися. Ті, кому вдалося завоювати його довіру — принаймні тимчасово — хочуть утримати його при владі та зберегти культ особистості, який він вибудував, але багато інших були неформально відсторонені від процесу. Деякі з них вважають, що правління Сталіна провалилося, інші ж підозрюють, що вони просто чекають дня, коли НКВС знайде або дасть привід для їхнього арешту.\n\nРазом вони сформували фракцію досить потужну, щоби кинути виклик нинішній адміністрації. Їхньою заявленою метою є повалення сталінської тиранії і перехід від тоталітарної держави, з радою військових офіцерів, які контролюватимуть цей процес.\n\nПрихильники Сталіна в армії та партії об'єдналися, щоби зберегти нинішній режим, називаючи своїх опонентів контрреволюційними зрадниками. Наближається нова громадянська війна."
 soviet.49.t:0 "Друга громадянська війна в Росії"
 soviet.62.a:0 "Це не було варте навіть чорнил!"
 soviet.9.d:0 "Буржуазні гнобителі, що правлять державою [FROM.GetNameDef], вирішили відмовитися від усякого глузду. Вони відкинули наш щедрий пакт про взаємодопомогу і вимагають негайного виведення всіх радянських військ, що «скупчилися» вздовж їхнього кордону."
 soviets_true_enemy_flag:0 "Назвали Радянський Союз справжнім ворогом"
