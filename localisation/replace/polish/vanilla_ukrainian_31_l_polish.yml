 demobilization_economic_desc:0 "Оскільки загроза війни здається далекою, люди більше не бажають миритися з труднощами воєнної економіки. Ми повинні переглянути наші економічні закони та подумати про те, щоби змінити їх, щоби виробляти більше споживчих товарів для задоволення їхніх потреб."
 denmark_expansion_event.100.desc:0 "[DEN.GetLeader] повідомляє про початок повноцінної інтеграції нашої країни в [DEN.GetAdjective]у державу."
 denmark_expansion_event.212.a:0 "Можливо, акт агресії зробить їх більш поступливими."
 denmark_expansion_event.23.a:0 "Нам нема чого сваритися з державою [DEN.GetNameDef]. Нехай забирають."
 denmark_occupation_event.102.a:0 "Вони недооцінюють нашу силу!"
 denmark_occupation_event.110.a:0 "Прийняти їх із розпростертими обіймами"
 denmark_occupation_event.7.desc:0 "[FROM.GetLeader] знову відкидає всі розумні доводи і відмовляється визнати нашу незалежність. Ми повинні заявити про свою свободу і боротися за неї — схоже, тільки так і можна звільнитися від рабства. Так, проллється кров, але зате держава [ROOT.GetNameDef] знову буде вільною!"
 denmark_overlord_events.11.d:0 "Фашистський лідер"
 denmark_overlord_events.26.desc:0 "[FROM.GetNameDef] шле нам вимоги заборонити будь-яку комуністичну активність у країні. [FROM.GetAdjective]і дипломати заявляють, що з нашого боку майже зрада дозволяти цій шкідливій ідеології пускати коріння в нашій державі, поки наші гегемони відважно захищають себе і весь вільний світ від держави, що цілком прийняла комунізм як ідеологію."
 denmark_protection_event.130.b:0 "Ми підемо своєю дорогою"
 denmark_protection_event.4.a:0 "Розширення торгівлі піде нам усім на користь."
 denmark_protection_event.9.a:0 "Яке розчарування."
 denmark_resistance_event.10.b:0 "Ми не зобов'язані дотримуватися їхньої угоди"
