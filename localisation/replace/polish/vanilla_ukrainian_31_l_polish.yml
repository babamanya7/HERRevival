 ETH_SefariNameDemocratic:0 "Національні сили оборони"
 ETH_a_last_stand_desc:0 "Ми не повинні дозволити невдачам зупинити нас. В крайньому випадку ми можемо повернутися до $VICTORY_POINTS_13244$ і підготувати там захист. Італійцям буде важко підтримувати постачання своєї армії на крайньому заході [ROOT.GetName]."
 ETH_adapt_and_improve:0 "Адаптація та поліпшення"
 ETH_adopt_the_lira:0 "Увести ліру"
 ETH_african_independence_join_tt:0 "Дозволяє державі §Y[ROOT.GetNameDef]§! втручатися в африканські війни за незалежність."
 ETH_asmera_naval_college:0 "[GetNavalCollegeName]"
 ETH_boarding_the_train_desc:0 "Наші лінії оборони починають руйнуватися, і якщо щось кардинально не зміниться, [ETH.GetName] припинить своє існування. У той час як багато його радників сперечаються про шкідливі наслідки відсутності трону, Його Величність [ETH.GetLeader] вирішив відправитися до Женеви з метою залучення міжнародної підтримки нашої справи в Лізі Націй."
 ETH_boots_on_the_shore:0 "Чоботи на узбережжі"
 ETH_communist_total_control_range:0 "Комуністи контролюють політику"
 ETH_conquer_addis_ababa_mission_desc:0 "Ми мусимо взяти столицю та змусити державу [ETH.GetName] капітулювати."
