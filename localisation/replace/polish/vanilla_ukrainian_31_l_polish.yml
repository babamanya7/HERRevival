 SHX_infantry_equipment_1:0 "Type 24"
 SIA_a_fledgling_tobacco_industry_desc:0 "Тютюн залишається незначним напрямком торгівлі, розпорошеним і погано організованим. Завдяки помірному захисту та обережним інвестиціям ця невелика культура може стати надійним джерелом акцизних надходжень, доходів сільського населення та фабричної роботи."
 SIA_a_more_moderate_option:0 "Більш поміркований варіант"
 SIA_all_weather_roads_desc:0 "Занадто багато доріг зникає під час дощів, залишаючи провінції відрізаними від столиці та ринків. Мережа всепогодних доріг зв'яже королівство воєдино і дозволить товарам та солдатам пересуватися у будь-яку пору року."
 SIA_as_the_eyes_turn_towards_southeast_asia:0 "...Коли погляди звертаються до Азії"
 SIA_death_to_the_nationalists:0 "Смерть націоналістам"
 SIA_directorate_of_aeronautical_engineering:0 "Директорат авіаційної інженерії"
 SIA_finish_the_triangular_defense_network:0 "Завершення трикутної оборонної мережі"
 SIA_heavy_tank_equipment_3_short:0 "M26"
 SIA_increase_military_approval_3_tt:0 "Збільшує схвалення крила §YВійськових§! на §GВеличезну величину§!"
 SIA_invite_to_adc:0 "Запросити §Y[FROM.GetName]§! до нашої фракції"
 SIA_irrigation:0 "Іригація"
 SIA_mandate_10_desc:0 "Тайці не повинні з'являтися на публічних зібраннях, у громадських місцях або в межах міста без належного одягу. До неналежного одягу належить носіння лише спідньої білизни, відсутність сорочки або носіння тканини, обгорнутої навколо тіла.\n\nНалежний одяг для тайців складається з: Уніформи, якщо це дозволяє посада та нагода; Ввічливого одягу міжнародного стилю; Ввічливого традиційного одягу."
 SIA_pacific_war_desc:0 "Конфлікт у Східній Азії більше не можна розглядати як віддалений. Війна на Тихому океані визначає долю всіх країн нашого регіону, і [ROOT.GetNameDef] має визначити своє місце в цій боротьбі — як послідовник, партнер чи жертва."
 SIA_prepare_for_a_long_war_desc:0 "Великі держави можуть вирішити війну за місяці, але менші країни часто змушені витримувати їх роками. Тому ми повинні підготувати зброю, промисловість і транспорт [ROOT.GetAdjective] до довгого виснажливого конфлікту, в якому терпіння і стійкість мають таке ж значення, як і мужність."
 SIA_reduction_of_agricultural_yield_taxes_tt:0 "Зменшує §YСпоживчі товари§! від $idea_SIA_agricultural_tax_reduction$ на §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! щомісяця та підвищує §YСтабільність§! на §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! щомісяця, поки штраф §YСпоживчих товарів§! не досягне §Y0%§!\n\nКоли цей дух буде видалено, ви отримаєте:\n"
 SIA_renegotiate_teak_control_desc:0 "Наші північні ліси збагачують концесіонерів, у той час як занадто мало повертається до держави. Переглянувши контроль над тиковим деревом, ми зможемо повернути доходи, врегулювати видобуток і гарантувати, що сіамська деревина служитимите сіамському розвитку."
 SIA_royal_thai_navy_desc:0 "Оборона [ROOT.GetNameDef] не закінчується на береговій лінії. Наші узбережжя, річки і морська торгівля вимагають флоту, гідного королівства. Зміцнюючи Королівський військово-морський флот Таїланду, ми гарантуємо, що Сіам залишиться господарем власних вод."
 SIA_sent_bureaucrats_to_us:0 "Навчання держслужбовців разом з нами"
 SIA_seri_thai_desc:0 "Підкорення не повинно означати капітуляцію національного духу. Під поверхнею окупації та підпорядкування можна організувати лояльне підпілля, щоб зберегти справу незалежності, збирати розвіддані та підготувати день, коли [ROOT.GetName] знову повстане."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt:0 "§Y$anti_fascist_raids$§! тепер збільшуватимуть схвалення §YЦивільного крила§! та зменшуватиме схвалення §YВійськового крила§!"
 SIA_sway_aditya_dibabha_to_seri_thai:0 "Переманити Адітью Дібабху"
 SIA_tankettes:0 "Танкетки"
 SIA_the_kings_gambit_desc:0 "Прачадіпок має повернутися до Бангкока з повним очікуванням того, що режим його заарештує. Цей акт забезпечить роялістів обуренням, легітимністю та авторитетом, необхідними для того, щоб відкинути вагання і повстати від його імені. Як тільки король-вигнанець буде схоплений, буде дано сигнал, і почнеться боротьба за [ROOT.GetName]."
 SIC_fascism_party:0 "$CHI_fascism_party$"
 SID_democratic:0 "Сідамська республіка"
 SIK_a_united_sinkiang_clique_desc:0 "З вигнанням Нової 36-ї дивізії і повним переходом Сіньцзяну під наше правління ми тепер виступаємо грізною силою в цьому районі. Тепер ми повинні звернути свій погляд на схід і забезпечити територіальну цілісність наших товаришів і союзників проти японських загарбників."
 SIK_establish_the_xinjiangneft:0 "Заснувати «Сіньцзяннафту»"
 SIK_fighter_equipment_2:0 "Chu X-P0"
 SIK_fighter_equipment_3_short:0 "P12"
 SIK_light_tank_artillery_equipment_1:0 "PLZ 34"
 SIK_tac_bomber_equipment_0_short:0 "Type 16"
 SIK_tac_bomber_equipment_1:0 "CAMCO Type 36"
 SIK_tac_bomber_equipment_3_short:0 "Type 44"
 SIK_three_year_plan_for_reconstruction_desc:0 "Щоб забезпечити наше правління та уникнути подальших потрясінь, ми повинні ініціювати трирічний план відбудови за підтримки Радянського Союзу. Беручи позики, ми тимчасово прив'яжемо себе до СРСР, але в довгостроковій перспективі це забезпечить наше економічне процвітання і, зрештою, нашу незалежність."
 SIL_VICTORY_POINTS_11467:0 "Глівиці"
 SIL_neutrality_party:0 "Дім Гохберг"
 SLAVIC_UNIFIED_ADJ:0 "Слов'янськ"
 SLO_infantry_equipment_0:0 "Zbrojovka Brno vz. 24"
 SLO_povazska_bystrica_organization:0 "Škoda-Повазька Бистриця"
 SMB_air_force_ARG:0 "Fuerza Aérea Argentina"
 SMB_aircraft_carriers_default:0 "Авіаносці"
 SMB_army_PAR:0 "Ejército Paraguayo"
 SMB_domestic_designs:0 "[SMB_domestic_designs_key]"
 SMB_foreign_designs_default_desc:0 "Хоча ми й хотіли б мати власних науковців та інженерів, щоб виготовляти власну бронетехніку, але краще використовувати зв'язки, які ми маємо, щоб домовитися про вигідні пропозиції на міжнародному ринку, оскільки це єдиний реальний і життєздатний варіант придбання спеціалізованого обладнання на даний момент часу."
 SMB_license_designs_default:0 "Ліцензувати зарубіжні проєкти"
 SMB_license_designs_default_desc:0 "Дослідження та розробка власних проєктів літаків забирає забагато часу та зусиль. Ось чому ми мусимо ліцензувати іноземне обладнання, а натомість зосередитися на його виробництві тут, у державі [ROOT.GetNameDef]."
 SMB_minelaying:0 "[SMB_minelaying_key]"
 SMB_minelaying_desc:0 "Утримання достатньої кількості кораблів для постійного захисту нашого величезного узбережжя може бути надзвичайно дорогим. Міни пропонують дешевше рішення, яке може допомогти стримати або вповільнити ворожі сили до прибуття флоту."
 SMB_reescalate_the_naval_arms_race_desc:0 "Хоча ми не маємо формальної угоди з нашими сусідами щодо розміру наших флотів, ми утримувалися від їхнього надмірного розширення від часів Великої війни. Однак війна знову майорить на обрії, і для нас було б краще мати перевагу в переозброєнні над нашими сусідами."
 SMB_special_forces_option_1:0 "[SMB_special_forces_option_1_key]"
 SMB_special_forces_option_2_continuation_default_desc:0 "Аби наші морські піхотинці працювали на повну потужність і ефективність, нам слід розглянути можливість розвитку технологій, які їх підтримують, як-от десантні транспортні засоби та кращі методи розподілу постачання під час висадки на узбережжя."
 SMB_special_forces_option_2_desc:0 "[SMB_special_forces_option_2_desc_key]"
