 ARG_political_events.15.b:0 "Ми не відмовимося від нашого суверенітету."
 ARG_political_events.22.desc:0 "[ARG.GetAdjective] посол у [GER.capital.GetCapitalVictoryPointName] звернувся до нас сьогодні вранці з новиною про те, що [ARG.GetNameDef] зробила націю [URG.GetNameDef] маріонеткою в ім'я наших попередніх колоніальних планів щодо країни. Це чудова новина, оскільки це дозволить посилити [GER.GetAdjective] вплив на континенті."
