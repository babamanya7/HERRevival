 NAVAL_MISSION_NAME_STRIKE_FORCE_DESC:0 "Наказати оперативній групі чекати на найближчій морській базі, поки не буде помічена ворожа оперативна група.\nКоли ворога буде помічено однією з Ваших патрульних оперативних груп, Ваша ударна сила вийде на перехоплення.\n\nКоли вона не вступає в бій із ворогом, це завдання споживає $PERCENT|%0G$ пального."
