 BRA_cohen_plan_desc:0 "З наближенням виборів і зменшенням нашої підтримки серед електорату, нам потрібно забезпечити продовження нашого режиму іншими засобами. Розробляючи плани чергового комуністичного перевороту, ми можемо відновити свою підтримку, одночасно призупинивши вибори заради національної безпеки."
 BRA_continue_centralization_desc:0 "[ROOT.GetNameDefCap] — це нація багатьох культур, розкиданих по величезній території. Якщо ми не зробимо більше для об'єднання різноманітних штатів нації, ми ризикуємо фрагментацією або навіть військовими вторгненнями з боку наших сусідів. Лише завдяки сильному центральному уряду ми можемо сподіватися захистити наш народ та демократію."
 BRA_defense_of_the_fatherland_desc:0 "Наші амбіції значно перевищують наші нинішні кордони, але навіть якщо це так, ми мусимо бути абсолютно впевнені, що ніхто не може загрожувати нашим рідним територіям. Viva o Brasil!"
 BRA_democratic_party:0 "БДС"
 BRA_destroyer_4:0 "Клас «Acre»"
 BRA_domination_of_the_americas_desc:0 "Ми ніколи не будемо повністю захищені з такою кількістю супротивників біля нашого порогу. Єдиний шлях до [BRA.GetAdjective] порятунку — це стати беззаперечною силою регіону."
 BRA_ensure_support_cat:0 "Здобуття влади"
 BRA_free_speech_desc:0 "З обмеженням впливу військового істеблішменту на Національний Конгрес, потенціал для іншої диктатури зменшився. Тепер настав час закріпити кращий захист свободи слова та заохотити більшу політичну участь наших громадян."
 BRA_infantry_at2:0 "M20 recoilless rifle"
 BRA_invest_in_railways_desc:0 "Потяги залишаються найбільш економічним методом масового перевезення людей та товарів на великі відстані. Тому ми повинні інвестувати в розширення та модернізацію нашої залізничної мережі, а також у розробку власних поїздів."
 BRA_italian_car_industry:0 "Співпраця з італійською автомобільною промисловістю"
 BRA_national_petroleum_council:0 "Національна нафтова рада"
 BRA_national_petroleum_council_desc:0 "Від тракторів на полях до лінкорів, що захищають наші береги, нафта стала життєвою силою сучасних машин. Залежність від такого важливого ресурсу є загрозою для нашої національної безпеки. Щоб зменшити цей ризик, ми створимо національну нафтову раду для нагляду за виявленням та видобутком внутрішньої нафти."
 BRA_senta_a_pua_desc:0 "Наші пілоти, здається, нещодавно розробили бойовий клич, який дозволяє їм спрямувати свою неперевершену лютість та відданість перемозі в одну фразу. Senta a Púa!"
