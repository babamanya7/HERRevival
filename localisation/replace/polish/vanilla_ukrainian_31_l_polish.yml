 ETH_road_reform_BoP:0 "Поліпшення доріг"
 ETH_set_up_a_customs_barrier_desc:0 "Чим довше ми будемо дозволяти нашій економіці обплутуватися [ITA.GetName], тим важче буде вирватися з-під їхнього корупційного впливу. Хоча це сповільнить наше економічне зростання, ми повинні запровадити митний бар'єр, щоб ускладнити торгівлю між нашими країнами. [ITA.GetAdjectiveCap]ий режим буде обурений цим, але ми знайдемо економічне виправдання, якщо буде потрібно."
 ETH_take_DJI:0 "Узяти Французький Сомаліленд"
 ETH_the_rif_desc:0 "Багато фашистів, які зараз борються за владу в Іспанії, колись були солдатами, які розгромили Республіку Ріф у Північному Марокко. Ми повинні використовувати наші тісні зв'язки з [SPC.GetName], щоб просувати деколонізацію їхніх африканських володінь. Якщо вони дійсно наші товариші, вони обов'язково погодяться. А якщо ні, ми вже знаємо, як боротися з колоніалізмом."
 ETH_the_state_bank_of_ethiopia_desc:0 "Розширюючи ресурси Державного банку держави [ETH.GetName], ми можемо надати людям нову кредитну лінію та діяти як фінансовий сечогінний засіб для хворої [ETH.GetAdjective]ої економіки."
