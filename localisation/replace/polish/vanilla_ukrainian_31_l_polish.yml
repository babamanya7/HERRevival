 ETH_invest_in_the_north_desc:0 "Виробництво машин починає відбуватися на півночі [ETH.GetName]. Ми повинні підтримати цей розвиток за допомогою збільшення інвестицій, щоби допомогти розширити цю зростаючу галузь."
