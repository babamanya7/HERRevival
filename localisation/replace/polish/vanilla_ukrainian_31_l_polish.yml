 denmark_resistance_event.23.a:0 "Віддайте їм кілька старих есмінців"
 denmark_resistance_event.30.desc:0 "Король завів звичку щодня їздити Копенгагеном без супроводу охорони в безмовному протесті проти загарбників і став символом опору всієї нації проти [?DEN.DEN_overlord_nation.GetAdjective]ої окупації."
