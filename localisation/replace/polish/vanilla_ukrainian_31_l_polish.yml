 ETH_replace_the_abuna_desc_ethiopia:0 "Лідер православної церкви, $ETH_abuna_qerellos_iv$, занадто тісно пов'язаний із $ETH_haile_selassie$. Нам потрібно замінити його людиною, яка буде більш лояльною до нашої справи."
