 NSB_soviet_foreign_politics_events.275.t:0 "[FROM.GetNameDefCap] відкидає нашу пропозицію"
 NSB_soviet_foreign_politics_events.278.b:0 "Ми мусимо чинити опір [FROM.GetAdjective] економічної окупації!"
 NSB_soviet_paranoia_system_events.29.t:0 "Велика чистка — суд над генералами"
 NSB_soviet_policies_of_collective_security.7.b:0 "Хіба вони не знають, що радянцям довіряти не можна?"
 NUMBER_OF_ALLY_SHIPS:0 "Число дружніх кораблів у регіоні"
 NZL_arrest_pacifist_leaders_desc:0 "Наразі не час для розбіжностей у країні. Всі повинні прагнути перемоги у війні, і якщо це означає, що ми мусимо затримувати всіх, хто виступає проти неї, то так ми й зробимо."
 NZL_bureau_of_industry_taog_desc:0 "$NZL_bureau_of_industry_desc$"
 NZL_carrier_2_desc:0 "The Ark Royal aircraft carrier was the first such vessel to be built to fit the restrictions of the Washington Naval Treaty. She was the first ship on which the hangars and flight deck were an integral part of the hull. Designed in 1934, the vessel was well-armored and armed. It carried a large complement of aircraft and had adequate operational range and speed to keep up with the major forces of the Royal Navy."
 NZL_christchurch_workshops_organization:0 "$NZL_christchurch_workshops$"
 NZL_defend_our_islands_desc:0 "Наш райський острів має бути готовим до морського вторгнення супротивника. Морські бомбардувальники зможуть перехоплювати та атакувати не лише десантні судна, а й основні кораблі."
