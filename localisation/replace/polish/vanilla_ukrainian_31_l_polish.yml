 AST_canberra_air_disaster_events.4.a:0 "Сподіваємося, це прокладе шлях для Австралії."
 AST_canberra_air_disaster_events.5.b:0 "Це не залишиться безкарним."
 AST_canberra_air_disaster_events.6.desc:0 "[JAP.GetNameDefCap] не сприйняла наші звинувачення легковажно, вважаючи їх першим актом агресії. [JAP.GetLeader] пішов на подальшу ескалацію конфлікту, заявивши, що тепер його нація має повне право вторгнутися на наші землі."
