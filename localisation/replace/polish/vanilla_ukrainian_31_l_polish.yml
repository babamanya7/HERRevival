 SWI_air_production:0 "Виробництво літаків"
 SWI_alpine_fascism_ADJ:0 "Альпійськ"
 SWI_american_industrial_investments_desc:0 "Велика війна чітко показала, що [USA.GetAdjective] промислова могутність може змінити будь-яку ситуацію на свою користь. Якщо ми підійдемо до них і зможемо отримати від них промислові інвестиції, ми зможемо зміцнити нашу власну позицію та переконатися, що захист нашої незалежності відповідає їхнім інтересам."
 SWI_avoid_failing_country_angry_TT_NOT:0 "Не: [?SWI.SWI_angriest_country.GetAdjective]а думка про державу [ROOT.GetName] вища ніж [?SWI.SWI_no_longer_angry_threshold]"
