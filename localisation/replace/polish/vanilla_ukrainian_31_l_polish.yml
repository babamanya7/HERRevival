 RULES_SORT_NAME:0 "§GКлацніть§!, щоби сортувати за назвою."
 RULE_ALLOW_LICENSING_SAME_FACTION_DESC:0 "Держави можуть отримувати ліцензії лише від держав в одному альянсі."
 RULE_ALLOW_VOLUNTEERS_SAME_IDEOLOGY_DESC:0 "Держави можуть надсилати добровольців лише державам з однаковою керівною ідеологією."
 RULE_ALLOW_WARGOALS_ALWAYS_FREE_DESC:0 "Виправдання цілей війни доступне для кожної ідеології та при будь-якому рівні світової напруженості."
 RULE_ALLOW_WARGOALS_FREE_75_DESC:0 "Виправдання цілей війни вимкнене при менш ніж 75% світової напруженості, але доступне для всіх держав при більшому рівні. Обмеження за ідеологіями не враховуються, але отримання цілей за національними фокусами досі доступне."
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC:0 "§HФранцузький§! ШІ намагатиметься відновити французьку монархію та посадити претендента-бонапартиста на трон, рухаючися відповідною гілкою дерева національних фокусів."
 RULE_OPTION_3:0 "3 рівень"
