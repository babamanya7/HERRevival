 FRA_fighter_equipment_3_short:0 "MB.157"
 FRA_form_the_national_committee:0 "Створити Національний комітет"
 FRA_heavy_cruiser_1_desc:0 "Важкі крейсери типу Suffren були в основному повторенням попереднього класу Duquesne з незначними поліпшеннями щодо його морехідних можливостей. Обидва класи нагадували сучасну філософію крейсерів французького флоту; дуже тонка броня, але хороша швидкість і дальність. Їх стандартна водотоннажність становить 10 000 тонн, вони були оснащені стандартним для важкого крейсера озброєнням."
