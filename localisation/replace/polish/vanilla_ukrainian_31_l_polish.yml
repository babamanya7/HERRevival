 AAT_Sweden.14.desc:0 "Держава [FROM.GetNameDef] прийняла нашу пропозицію щодо демілітаризованої зони навколо Нарвіка. Їхні війська залишили цю територію, і тепер ми оголосимо її небойовою зоною. Ми очікуємо, що [NOR.GetAdjective]ий уряд звернеться з проханням про повернення території після закінчення війни, але поки що ми будемо забезпечувати безпеку [NOR.GetAdjective]ого населення."
 AAT_Sweden.38.a:0 "Forpulet."
 AAT_Sweden.6.a:0 "Годі сьорбати!"
 AAT_Sweden.7.t:0 "12 осіб заарештовано біля Ріксдагу"
 AAT_Sweden.8.desc:0 "Сьогодні 11 осіб, заарештованих за спробу штурму Ріксдагу, були звільнені з випробувальним терміном, а 1 людина все ще перебуває в ув'язненні за звинуваченням у контрабанді."
 AAT_Sweden_BoP.12.a:0 "Робітники всього світу мають об'єднатися проти імперських загарбників."
 AAT_Sweden_ball_bearing.2.b:0 "Ми не можемо собі цього дозволити."
 AAT_Sweden_ball_bearing.5.c:0 "Технології синтетичної нафти."
 AAT_Sweden_ball_bearing.7.a:0 "Шкода."
 AAT_Sweden_flashpoints.11.desc:0 "[SOV.GetAdjectiveCap]і пілоти випадково здійснили повітряний наліт на [SWE.GetAdjective]е село, прийнявши його за ціль у державі [FIN.GetName]. [SWE.GetAdjectiveCap]ий уряд тепер діє з обуренням, привертаючи увагу світу до прикрої аварії.\n\nМи могли би визнати інцидент і запропонувати відшкодувати збитки, але це може призвести до того, що наші громадяни поставлять під сумнів наші військові дії в державі [FIN.GetName] й це буде сприйнято іншими країнами як ознаку слабкості."
 AAT_Sweden_flashpoints.40.b:0 "Ми можемо скористатися цим на свою користь."
 AAT_Sweden_flashpoints.51.desc:0 "Після нашого рішення розпочати інтернування радикальних лівих по всій державі [SWE.GetName], рейди та арешти поліції з цією метою наштовхнулися на запеклий опір трудящих. Багато з них навіть допомагали радикалам уникнути затримання або відкрито нападали на поліцейських. Вони стверджують, що таке масове ув'язнення рівнозначне створенню поліцейської держави. Ми мусимо бути обережні у своїх діях, інакше ситуація може дуже швидко вийти з-під контролю."
 AAT_Sweden_flashpoints.63.b:0 "Ми не можемо ризикувати таким конфліктом."
 AAT_Sweden_flashpoints.75.t:0 "[ENG.GetName] відмовляється повертати судна"
 AAT_Sweden_flashpoints.77.desc:0 "Кораблі, які ми придбали в держави [ITA.GetNameDef], прибули без жодних серйозних проблем під час подорожі. Хоча екіпажі повідомляють, що під час дозаправки в портах за ретельно стежили."
 AAT_Sweden_flashpoints.78.a:0 "Оландські острови наши, віднині й назавжди."
 AAT_Sweden_nationalists.17.desc:0 "Королівський візит до провинції [FROM.FROM.GetName] був досить нудним. Хоча король сподівався, що натовпи людей зберуться на зустріч із ним, на вулиці вийшла лише жменька його прихильників. Кажуть, що король був дуже незадоволений та збентежений тою ситуацією, обіцяючи не брати участі в таких легковажних заходах у майбутньому."
 AAT_USA_events.05.t:0 "[FROM.GetName] хоче повернути Гренландію"
 AAT_USA_events.07.desc:0 "[FROM.GetLeader] від держави [FROM.GetNameDef] виконав свою обіцянку і погодився повернути території, які вони утримували для збереження, тепер, коли ми знову вільні від гноблення."
 AAT_britain_narvik.4.a:0 "Це все ще обурливо."
 AAT_finland_continuation_war.03.t:0 "[FROM.GetName] відкидає нашу пропозицію"
 AAT_finland_diplomacy.07.a:0 "Ми нічого не можемо з цим вдіяти."
 AAT_finland_kinship_war.02.t:0 "Повстання в Східній Карелії!"
 AAT_finland_kinship_war.04.a:0 "Нам доведеться звільняти Східну Карелію іншими способами."
 AAT_finland_misc_events.04.a:0 "Передати права на видобуток у області [929.GetName]."
 AAT_finland_political.02.t:0 "Президентський термін добігає кінця"
 AAT_finland_the_white_death.11.desc:0 "Надійшли повідомлення, що Гяюгя сильно поранений розривною кулею в ліву частину нижньої щелепи. Спершу його навіть вважали загиблим, але він дістався до найближчого табору, де доповів про прибуття. Більше Гяюгя не зможе битися, але він і так уже послужив країні достатньо, щоб бути гідним вічної вдячності [FIN.GetAdjective]ого народу."
 AAT_finland_winter_war.03.desc:0 "До нас прийшли новини від ворогів із держави [FROM.GetNameDef]. Вони пропонують укласти мир на умовах статус-кво: наші війська повинні негайно припинити атакувати і піти на свою територію. Судячи з усього, [FROM.GetNameDef] задовольниться тим, що наші кордони повернуться до довоєнного стану і жодна зі сторін не розширить свою територію... \n\nНе думаю, що наше населення буде радо продовжувати бої, зважаючи на те, яких втрат ми зазнали останнім часом. Можливо, ми зможемо переконати людей, що перемога близька, але якщо очікування не виправдаються, народне невдоволення нашим правлінням зросте."
 AAT_finland_winter_war.04.t:0 "[FROM.GetNameDefCap] приймає наші мирні вимоги"
 AAT_nordic_cooperation.2.t:0 "[FROM.GetName] пропонує свою допомогу у наших воєнних зусиллях"
 AAT_nordic_cooperation.4.b:0 "Воно не варте ризику."
 AAT_norway.17.t:0 "[NOR.GetAdjectiveCap]і територіальні вимоги"
 AAT_norway.19.desc_monarchist:0 "Престиж нашої корони зазнав великого удару, оскільки держава [FROM.GetName] заперечила наші законні територіальні претензії. Це рівносильно образі [ROOT.GetAdjective]ої корони і це не можна терпіти."
 AAT_norway.2.desc:0 "Посилаючися на порушення угоди про уникнення політичної участі під час його заслання, а також на хиткі докази, викрадені грабіжниками-фашистами, ми відправили Лева Троцького на ферму в Гурумі, де він буде перебувати під наглядом поліції та ізольований від зовнішнього світу.\n\nЦе суворе покарання, але тиск із боку держави [SOU.GetNameDef] і місцевих фашистів робить його небезпечним центром згуртування."
 AAT_norway_communist.3.t:0 "[FROM.GetName] відхиляє нашу торговельну пропозицію"
 AAT_norway_rikstanken.10.desc:0 "[FROM.GetAdjectiveCap]і посли підтвердили, що готові допомогти нам у розробці наших власних танків — звісно, якщо наші країни продовжуватимуть ідеологічно зближуватися. Ми впевнені, що вони також отримають користь від нових підходів до розробки танків, які принесе наша співпраця."
 ABDA_events.4.b:0 "Укріпити сухопутний периметр. Справжня загроза прийде з суші."
 ABDA_faction_membership_requirement_tt:0 "Відповідні члени фракції отримають запрошення приєднатися."
 ABDA_fortress_singapore_desc:0 "Сінгапур є стрижнем нашої оборонної стратегії в регіоні. Зміцнення його укріплень та розміщення потужного гарнізону виграють критичний час для ширших зусиль ABDACOM і не дадуть ворогу здобути швидку стратегічну перемогу."
 ABDA_naval_procurement_ins_ships_tt:0 "[INS.GetName] отримає §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
 ABDA_the_malay_barrier:0 "Малайський бар'єр"
 ABDA_unified_naval_command_desc:0 "Зі створенням сухопутної оборони та інфраструктури ABDA тепер може об'єднати всі військово-морські сили під єдиним командуванням. Стандартизовані сигнали, спільна розвідка та скоординовані маршрути патрулювання примножать ефективність кожного судна на театрі воєнних дій."
