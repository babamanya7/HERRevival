 JUNO_brazil_events.88.t:0 "[SOV.GetNameDefCap] відхиляє наш заклик про допомогу"
 JUNO_brazil_news.3.d:0 "Після зростання монархічних настроїв як у [BRA.GetNameDef], так і в [POR.GetNameDef], дві країни вирішили знову об'єднатися під одним монархом та прапором. Посилаючись на бажання використовувати знання та ресурси одне одного, дві нації рішуче налаштовані тепер зростати разом як єдине ціле."
