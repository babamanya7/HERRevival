 unrestricted_submarine_warfare:0 "Необмежена підводна війна"
 upgrade_decryption_boost_desc:0 "§LРадіохвилі дозволяють спілкуватися на великих відстанях, і сигнали часто зашифровуються за допомогою постійної та нерегулярної зміни частоти мовлення. Щоб перехоплювати ворожі повідомлення, ми мусимо створити групу радіоперехоплення для зламування шифрів супротивника.§!"
 upgrade_interrogation_techniques_desc:0 "§LЧастіше ефективніше буває зламати розум ворожого агента, а не його тіло. Застосування фізичної сили в цьому випадку ненадійне та часто призводить до отримання хибної інформації. Майстер допиту здатний зламати дух противника, не вдаючися до насильства. У нас є способи будь-якого...§!"
 uprising:0 "Uprising"
 uruguay_cisplatina:0 "Сісплатіна"
 usa.17.d:0 "Світ уже став небезпечним місцем. Чи справді ми можемо допустити війну у власному регіоні чи маємо забезпечити збереження миру? Ми можемо надіслати державі [From.From.GetName] ультиматум укласти мир із державою [From.GetName] або залишити їх боротися."
 usa.19.t:0 "[From.GetNameWithFlag] отримає ціль війни §HМаріонетка (фокус)§! проти держави [Root.GetName]."
 usa.401.desc:0 "Прем'єр-міністр Великої Британії [From.GetLeader] оголосив про свою згоду з умовами Угоду про есмінці в обмін на бази. Група [From.GetAdjective]их морських офіцерів прибула, щоб оглянути есмінці та спостерігати за їхнім переміщенням.\n\n Очевидно, ще є над чим працювати, оскільки кілька [From.GetAdjective]их офіцерів, здається, дещо стурбовані великою кількістю та товщиною гуано й іржі на кораблях, які підлягають передачі."
 usa_focus:0 "Дерево фокусів США"
