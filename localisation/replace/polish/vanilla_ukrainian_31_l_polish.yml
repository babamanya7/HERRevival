 CHANGE_ADMIRAL_IN_NAVAL_HEADQUARTER:0 "§GКлацніть§!, аби змінити адмірала у штабі ВМС."
 CHI_BLITZKRIEG_DESC:0 "Після двох років війни проти японців армії Чана Кайші знекровили себе, намагаючися зупинити наступ. Ворог захопив найбагатші райони країни. Західні демократії надали лише незначну підтримку, й комуністи, схоже, не бажають вступати з ворогом у відкритий бій.\n\nОскільки війна загрожує ще більше поширитися, здається, що найгірше ще попереду. Але оскільки японська атака вповільнюється неосяжністю наших земель, вони цілком можуть звернути свій погляд в інші сторони, а нові союзи можуть переломити хід..."
 CHI_allocate_lend_lease_desc:0 "Нині в Китаї є кілька центрів сили, хоча лише один представляє націю за кордоном. Ми можемо використати цю перевагу, щоб вирішувати, хто отримає підтримку, а отже, хто матиме вплив."
 CHI_anti_opposition_campaigns_effect_tooltip:0 "Відкриває £decision_icon_small §Hрішення§! про початок §Hприкордонних конфліктів§! із воєначальниками, що приєдналися до протилежної сторони.\n"
 CHI_artillery_equipment_2:0 "105mm Type 16 Jin"
 CHI_autonomy_puppet_DEF:0 "$OVERLORDADJ$ий $CHI$"
 CHI_build_a_carrier:0 "Збудувати авіаносець"
 CHI_close_whampoa_desc:0 "Академія Вампу завжди була відома як особиста вотчина Чана та розсадник його ідеологічних схильностей. Це установа, існування якої неможливо дозволити, тому ми закриємо її та піддамо осуду всіх, хто, як відомо, має зв'язки з нею."
 CHI_conquer_tibet:0 "Завоювати Тибет"
 CHI_control_yuan:0 "Контролюючий Юань"
 CHI_declare_war_zone:0 "Оголосити зону бойових дій"
 CHI_develop_the_chemical_industry_desc:0 "Одним із найбільших досягнень сучасної цивілізації є підкорення природи за допомогою хімії. Від сільського господарства до виробництва, хімічна промисловість може розширити можливості суспільства — але, на жаль, наша тільки зароджується. Якби ми розвивали ці галузі, невідомо, чого ми могли б досягти."
 CHI_empower_those_that_have_lost:0 "Підтримати тих, хто втратив усе"
 CHI_enforce__virtues:0 "Забезпечити дотримання чеснот"
 CHI_extend_jurisdiction_to_the_provinces:0 "Поширити юрисдикцію на провінції"
 CHI_fascist_infiltrate_state:0 "Створити місцеві відділення в [FROM.GetName]"
 CHI_focus_on_positional_advantage_desc:0 "Повітряний бій — це не лише кількість чи швидкість. Перевага полягає у висоті, куті атаки та обізнаності. Ми повинні навчити наших пілотів використовувати кожну перевагу."
 CHI_forced_loans_desc:0 "Купці та промисловці накопичили величезні статки за час відносного затишшя. Безсумнівно, держава має право претендувати на частину їхніх багатств у тяжкий час — зрозуміло, з гарантією повернення позик одразу, як це дозволить ситуація."
 CHI_form_y_force:0 "Сформувати сили Y"
 CHI_fortify_shanghai_desc:0 "Якщо Японія нападе, перший удар прийдеться на Шанхай. Ми мусимо бути готові."
 CHI_guidance_and_support:0 "Керівництво та підтримка"
 CHI_impair_the_control_yuan_tt_2:0 "480 днів $instead_of$ 365 днів"
 CHI_import_fertilisers:0 "Імпортувати добрива"
 CHI_industrial_evacuations_from_jiangxi:0 "Евакуація промисловості з Цзянсі"
 CHI_infantry_equipment_0:0 "Type 88"
 CHI_infantry_equipment_1:0 "Type 24"
 CHI_integrate_the_warlords_democratic_sea_cat:0 "Ініціативи возз'єднання"
 CHI_jiangnan_shipyard_group_organization:0 "$jiangnan_shipyard_group$"
 CHI_jinling_arsenal_organization:0 "Jinling Arsenal"
 CHI_land_redistribution_desc:0 "Поміщики безжально експлуатують селян попри те, що є основою економіки. Зробивши власниками землі тих, хто на ній працює, ми створимо куди більш справедливе та продуктивне суспільство."
 CHI_military_affairs_commission:0 "Комісія з військових питань"
 CHI_military_affairs_commission_desc:0 "Наші збройні сили страждають від нестачі компетенції. Реформа командного складу — перший крок до поліпшення ситуації."
 CHI_move_mios:0 "Перемістити фабрики до §Y[FROM.GetName]§!"
 CHI_move_mios_tt:0 "Перемістить фабрики та ВПО з §Y[?var:selected_mio.GetName]§! до §Y[FROM.GetName]§!"
 CHI_navy_spooks:0 "Розвиток морської розвідки"
 CHI_occupation_actions:0 "Антиокупаційні заходи"
 CHI_panthay_empire_neutrality_DEF:0 "the Chinese Sultanate"
 CHI_rapidity_is_the_essence_of_war:0 "Швидкість — це суть війни"
 CHI_reach_out_for_help_tt:0 "§Y[USA.GetNameDefCap]§! з більшою ймовірністю надішле нам §Yленд-ліз§!"
 CHI_reeducate_sheng_shiqi_decision:0 "Перевиховати [SIK.GetFlag] $SIK_sheng_shiqi$"
 CHI_reform_the_blue_shirts_desc:0 "Товариство втілення трьох народних принципів — Товариство синіх сорочок — діє вже майже пів десятиліття, але з обмеженою ефективністю. Через те, що фракція не поширилася серед простих людей, вона не досягла свого повного потенціалу. Реформувавши організацію як народний фронт, ми кинемо виклик комуністам у їхній власній грі."
 CHI_refugee_resettlement:0 "Переселення біженців"
 CHI_revive_the_new_culture_movement:0 "Відродити Рух за нову культуру"
 CHI_sea_chinese_general_staff:0 "$CHI_chinese_general_staff$"
 CHI_sea_cooperation_with_the_nationalists_effect_tooltip:0 "$CHI_cooperation_with_the_nationalists_effect_tooltip$"
 CHI_sea_defensive_posture_desc:0 "$CHI_defensive_posture_desc$"
 CHI_sea_democracy_desc:0 "$CHI_democracy_desc$"
 CHI_sea_develop_capital_arsenal_desc:0 "Без арсеналу ми не матимемо армії, а без армії ми не матимемо держави. Тому, щоб забезпечити наше виживання, ми повинні розширити наші промислові можливості."
 CHI_sea_labor_reform_desc:0 "$CHI_labor_reform_desc$"
 CHI_sea_modern_submarines:0 "$CHI_modern_submarines$"
 CHI_sea_new_model_province_desc:0 "$CHI_new_model_province_desc$"
 CHI_sea_opposition:0 "$CHI_opposition$"
 CHI_sea_order_destroyers:0 "$CHI_order_destroyers$"
 CHI_sea_small_arms_production_desc:0 "Стрілецька зброя є основою нашої військової промисловості. Без неї наші армії були б марними, а наша держава розсипалася б від будь-якого тиску. Тому логічно буде інвестувати більше в цей сектор."
 CHI_sea_strenghten_warlord_authority:0 "$CHI_strenghten_warlord_authority$"
 CHI_sea_tank_plant:0 "$CHI_tank_plant$"
 CHI_sea_unemployment_assistance:0 "$CHI_unemployment_assistance$"
 CHI_ship_secondaries_1:0 "120-мм/45 Armstrong Y"
 CHI_strike_at_what_is_weak:0 "Бити по слабких місцях"
 CHI_strike_from_below:0 "Удар з глибини"
 CHI_target_upper_society_desc:0 "Вищий прошарок суспільства відмовився від належних цінностей і став занадто зацікавленим у космополітичному дозвіллі, тоді як він повинен бути прикладом морального і доброчесного життя для простої людини. Як тільки це станеться, ми зможемо підняти всю націю через відродження духу і вийти за межі простих матеріальних багатств."
 CHI_the_hanoi_route_desc:0 "Наші східні порти вразливі перед [JAP.GetNameDef], і нам потрібно вжити запобіжних заходів. Спуск з гір Куньміна в джунглі навколо Ханоя — це важкий шлях, але він дав би нашим поставкам певний перепочинок."
 CHI_the_hump:0 "«Горб»"
 CHI_the_hump_sea:0 "«Горб»"
 CHI_tsr_never_another_national_protection_war:0 "Більше ніякої війни на захист республіки"
 CHI_tsr_tianxia_desc:0 "Усі землі на цій землі були призначені нашому небесному суверену універсальними та чітко визначеними принципами порядку. Центром цієї землі має бути [ROOT.GetAdjective]ий двір та Імператор. Нарешті настав час заявити про своє місце як Серединної імперії та справжньої колиски людської цивілізації!"
 CHI_unified_industrial_planning_desc:0 "Не можна відкладати наш план агресивної індустріалізації."
 CHI_unlock_faction_goal_west_subjugated_tt:0 "Якщо цей фокус поїздки буде обрано першим, то буде розблоковано ціль альянсу §Y$faction_goal_west_subjugated_name$§!."
 CHI_utilize_german_contacts_wang_tt:0 "Ми використаємо наші зв'язки через [CHI.GetLeader], щоб отримати:"
 CHI_war_in_sinkiang_desc:0 "З початком війни в провінції Сіньцзян це лише питання часу, коли центральний уряд примусить регіон до миру, а наші війська здадуться. Якщо ми хочемо перемогти, ми повинні діяти швидко і рішуче."
 CHI_war_of_resistance_cat_desc:0 "Коли ворог знову на нашій землі, а війна прийшла в наш дім, ми повинні прийняти виклик. Хоча ми не найсучасніша і не найкраще оснащена армія у світі, ми маємо інструменти, щоб боротися з ними і перемагати. Ми дамо їм відсіч на наших полях, пагорбах і в горах."
 CHI_warlord_integration_cost_reduction:0 "Зменшує вартість §Yпримусу мілітаристів стати нашими суб'єктами§! на £GFX_influence_texticon §G-5%§! та £pol_power §G-50§!"
 CHI_welfare_desc:0 "Держава, що йде в ногу з часом, повинна дбати про своїх громадян, щоб вони у скрутну хвилину змогли стати на її захист."
 CHL_abide_by_the_francoist_model_tt:0 "Ми §Rбільше не зможемо приєднуватися до альянсів§!."
 CHL_buy_american_artillery:0 "Придбати американську артилерію"
 CHL_buy_american_support_equipment:0 "Придбати американське додаткове обладнання"
 CHL_cooperation_with_the_falange_desc:0 "Національна фаланга — це християнсько-демократична партія, яка була заснована в 1935 році і складається переважно з прогресивних і реформаторських католиків. Оскільки багато їхніх програмних документів дуже схожі на наші, запросити їх до нашого уряду не складе труднощів."
 CHL_denounce_the_anarchy:0 "Денонсувати стан напіванархії"
 CHL_escalate_the_laguna_del_desierto_issue:0 "Ескалація питання Лагуна-дель-Десьєрто"
 CHL_hispanic_union_DEF:0 "Іспанський Союз"
 CHL_introduce_authoritarianism_fascist:0 "Запровадити авторитарну політику"
 CHL_invite_carlist_refugees_desc:0 "Карлісти в Іспанії близькі нам, як прихильники монархії. Оскільки їх вигнали з їхніх домівок, ми могли б здобути їхню прихильність, запропонувавши їм притулок тут."
 CHL_kickstart_the_arsenal_of_democracy_desc:0 "Цілком імовірно, що ми можемо бути втягнуті у великий конфлікт у найближчому майбутньому, і щоби не бути знищеними в такій ситуації, ми мусимо швидко розширювати наші військово-промислові організації."
 CHL_mapuche_liberate_itza:0 "Визволити [ITZ.GetAdjective]ий народ"
 CHL_mapuche_reorganize_the_bolivian_government:0 "Реорганізувати [BOL.GetAdjective]ий уряд"
 CHL_occupy_belize:0 "Окупувати область [311.GetName]"
 CHL_organize_patriotic_leagues_desc:0 "Патріотичні ліги — це фашистські мафіозні синдикати, які колись бродили вулицями Сантьяго та Буенос-Айреса, і ми мусимо докласти зусиль, щоб відновити їх, а також переконатися, що вони залишаються лояльними до нашого уряду, замість давати їм працювати незалежно, як це було раніше."
 CHL_political_events.21.t:0 "[PRU.GetName] перетинає Пастасу"
 CHL_political_events.25.t:0 "[CHL.GetName] пропонує нам стати одним цілим з ними"
 CHL_political_events.32.desc:0 "[CHL.GetLeader] з [CHL.GetNameDef] звернувся до нас із проханням приєднатися до нашої фракції. Він стверджує, що разом ми будемо набагато сильнішими, і що ми зможемо повалити американську гегемонію за їхньої допомоги."
 CHL_political_events.34.a:0 "Вони пошкодують про це..."
 CHL_political_events.50.t:0 "[FROM.GetNameDefCap] приєднується до Іспанського альянсу"
 CHL_political_events.69.a:0 "О, яке нещастя"
 CHL_political_events.71.desc:0 "Війська, що симпатизують ширшій коаліції консерваторів та фашистів, оточили Паласіо де Ла Монеда, де перебувають Артуро Алессандрі та його кабінет. Вони наказали президенту піти у відставку на користь колишнього президента та генерала Карлоса Ібаньєса дель Кампо, який пообіцяв повернути країну до її старих цінностей та вирішити проблеми, які Алессандрі не зміг. Оскільки військові на його боці, мало що можна зробити."
 CHL_political_events.72.desc:0 "Під час першої сесії, що відбулася в новому Арауканійському Конгресі, виникла суперечка. Хоча всі погоджуються, що антиімперіалізм має бути основним принципом будь-якої держави мапуче, існують розбіжності щодо того, чи можна довіряти іншим, хто поділяє ці ідеали, таким як комуністи та соціалісти, бути частиною уряду мапуче. Деякі стверджують, що вони можуть бути корисними союзниками, тоді як деякі стверджують, що вони вдарять нам у спину при першій нагоді. Хто має рацію?"
 CHL_political_events.73.b:0 "Естебан Ромеро Сандоваль має народну підтримку"
 CHL_political_events.77.t:0 "[PRU.GetName] вирішує не купувати у нас Аріку"
 CHL_political_events.78.desc:0 "[FROM.GetLeader], обраний Королем [FROM.GetNameDef], попросив нашої допомоги у його війні проти чилійських фашистів та комуністів, які бажають його повалити. Він хоче зброї та добровольців, які могли б йому допомогти. Чи приймаємо ми його заклик до зброї?"
 CHL_political_events.81.desc:0 "[FROM.GetLeader] з [FROM.GetNameDef] відгукнувся на наш заклик до зброї та пообіцяв надіслати нам зброю та добровольців, стільки, скільки зможе виправдати. Однак вони заявили, що їхня допомога коштує недешево, і що якщо ми хочемо її, нам доведеться заплатити їм взамін."
 CHL_political_events.82.t:0 "Столиця Королівства"
 CHL_political_events.89.t:0 "[FROM.GetNameDefCap] пропонує захистити [270.GetName]"
 CHL_political_events.93.a:0 "Бартоломе Бланш знає, як керувати!"
 CHL_political_events.94.b:0 "Педро Дартнелл добре служив нам довгий час"
 CHL_promote_ideology_rallies_americas:0 "Спонсорувати ідеологічні мітинги в державі [FROM.GetNameDef]"
 CHL_secure_the_brazilian_border_desc:0 "Бразилія — одна з небагатьох країн на континенті, яка здатна нам протистояти. Ми мусимо убезпечити нашу границю з ними, щоби було якомога легше здійснити вторгнення, коли настане відповідний час."
 CHL_sunk_the_tolten:0 "Затоплення судна «SS Tolten»"
 CHR_fascism_DEF:0 "Неочарруанське королівство"
 CHU_neutrality_party:0 "ЧПС"
 CIC_BANK_CURRENTLY_EARNED_FROM_DEAL:0 "$COUNTRY|H$ ($NUM|H$): §G+$PAYMENT|2$§!/місяць"
 CKK_democratic:0 "Чукотська республіка"
 CKK_fascism_party:0 "ЧФ"
 CLEAR_OVERRIDE_GARRISON_TOOLTIP:0 "Очистити шаблони дивізій, які замінюють поточний вибір шаблону."
 CMR_communism_ADJ:0 "Камерунськ"
 COG_alliance_de_bakongo:0 "Альянс Баконго"
 COG_anti_colonialism_category_desc:0 "Ми зробимо все можливе, щоб підтримувати рухи опору в усьому регіоні, доки наслідки імперіалізму не будуть усунені остаточно."
 COG_attempt_to_ally_the_portuguese_desc:0 "Наші відносини з [POR.GetNameDef] і їхніми дослідниками були періодично напруженими, але настав час виправити минуле і поглянути в майбутнє. Тому ми повинні спробувати укласти з ними союз."
 COG_attempt_to_sway_moise_thsombe_desc:0 "Провінція Катанга не зовсім згодна з нашими ідеями про відокремлення, і, ймовірно, вони самі відокремляться, якщо ми почнемо наше повстання. Тому ми повинні заручитися підтримкою одного з їхніх найвідоміших політиків, Моїза Тшомбе, і переконати його, що наші спільні інтереси насправді взаємодоповнюють один одного."
 COG_command_post_matadi:0 "Командний пункт Матаді"
 COG_congo_kisangani_democratic:0 "Конго-Кісангані"
 COG_congo_stanleyville_democratic:0 "Конго-Стенлівіль"
 COG_contract_the_empain_group_desc:0 "Група Емпена була заснована Едуардом Емпеном у 1881 році і є однією з найбільших корпорацій нашого часу. Вона відповідає за трамвайні лінії, залізниці, виробництво електроенергії, будівництво та видобуток корисних копалин, і вже значною мірою сприяла розвитку східного Бельгійського Конго. Їхні послуги нам дуже потрібні!"
 COG_endorse_force_publique_mutinies_desc:0 "Хоча Force Publique є інструментом колоніальної влади, багато хто в організації бачить цивілізаційну місію такою, якою вона є насправді. Ми повинні переконати їх, що найкращий курс дій — це заколот, і що тільки через це ми можемо здобути повну незалежність."
 COG_expand_production_facilities_desc:0 "Нам потрібно збільшити виробництво військового обладнання, і єдиний спосіб зробити це — будувати нові потужності, здатні до цього."
 COG_fascism_DEF:0 "Заїр"
 COG_freedom_at_gunpoint_category_desc:0 "Наші сусіди залишаються під ярмом імперіалістів. Настав час направити наш досвід війни та нашу нову економічну силу на звільнення усієї Африки! Адже тепер, ми здатні на рівних використовувати єдину мову, яку розуміють колоніальні держави. Мову примусу і грубої сили."
 COG_kasa_vubus_first_cabinet_2_tt:0 "§YЖозеф Каса-Вубу§! отримає рису §YОсновоположник Конголезької нації§!, і ми отримаємо §YСтабільність§! та §YПолітичну владу§!"
 COG_occupy_cabinda_desc:0 "Провінція Кабінда знаходиться між нашими провінціями Лоанго і Бома, і поки війна точиться по всьому світу, настав час вступити в дію та захистити наших невинних братів від подальших лих. Їхні поточні окупанти можуть не схвалити цей крок, але це необхідно для захисту майбутнього Африки."
 COG_peoples_republic_of_congo_democratic:0 "Соціал-демократична народна республіка Конго"
 COG_recall_charles_tombeur_to_active_service:0 "Відкликати Шарля Томбьора, 1-ого барона Табори, назад до активної служби"
 COG_societe_nationale_chemins_du_congo:0 "Національна компанія залізниць Конго"
 COG_strengthen_the_banque_du_congo_belge_desc:0 "Жодна країна не може ефективно функціонувати без належного банку, і ми не є винятком. Щоб зміцнити контроль за фінансовою ситуацією в нашій країні, ми повинні зосередитися на зміцненні бельгійського державного Банку Бельгійського Конго."
 COG_the_ten_year_plan:0 "План на десять років"
 COG_the_umwami_of_rwanda_focus_desc:0 "Тепер, коли Мутара III Рудахігва зійшов на наш трон, ми можемо претендувати на титул Королівства Руанда. Зробивши це, ми зможемо легітимізувати наші претензії на це маленьке королівство на сході, і, можливо, ми можемо піти далі."
