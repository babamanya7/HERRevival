 DEN_safeguard_the_eastern_front_desc:0 "Історично склалося так, що Фінляндія завжди була поза межами нашої досяжності, але з нашою відроджуваною силою ми більш ніж здатні поставити її під нашу гегемонію. Забезпечити Фінляндію означає убезпечити наш Східний фронт і посилити наш контроль над Балтійським морем."
 DEN_social_stability_desc:0 "Щоб уникнути соціальної нестабільності, яка потрясла інші країни, ми повинні зробити випереджувальні кроки! Перш ніж проводити масштабні реформи в галузях та економіці в цілому, ми повинні мати тверду і стабільну позицію."
 DEN_submarine_4:0 "Клас «Støren»"
 DEN_support_battalions_desc:0 "Для того, щоб данська бригада була дієздатною силою і мала шанс звільнити [ROOT.GetNameDef], вона повинна мати відповідне озброєння. Гвинтівки і кулемети — це дуже добре, але артилерія і протиповітряна підтримка є обов'язковими в наш час."
