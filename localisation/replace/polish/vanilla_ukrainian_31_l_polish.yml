 BEL_vandervelde_minority_desc:0 "Еміль Вандервельде здобув перемогу на виборах, однак його Лейбористська партія змогла виграти лише через міноритарний склад. Після того, як переговори по коаліції провалилися, він вирішив йти самостійно, хоча політичний шлях попереду буде складним."
