 land_fort_tech_1:0 "Поліпшені наземні укріплення"
 landactions:0 "Наземні дії"
 landmark_eiffel_tower_desc:0 "Ейфелева вежа названа на честь свого творця Гюстава Ейфеля, її будівництво було завершено в 1889 році. Будучи розташованою на Марсовому полі в Парижі, Залізна леді стала світовою культурною іконою Франції та є символом національної гордості."
 landmark_hakko_ichiu:0 "Монумент Хакко Ічіу"
 landmark_nanjing_presidential_palace:0 "Президентський палац у Нанкіні"
 landmark_sadabad_complex:0 "Палац Саадабад"
 lar_appeal_to_overseas_territories.6.desc:0 "Колоніальні керуючі наших центральноафриканських територій спільно заявили, що радіовиступ, в якому [This.GetLeader] звертається до народу, — акт зради, спрямований на підрив авторитету законного уряду. Джерела стверджують, у разі переходу на інший бік і боїться втратити підтримку в тому випадку, якщо люди, налаштовані на незалежність, спробують розпочати звільнення."
 lar_concessions_to_italy.2.desc:0 "[From.GetAdjective]ий кабінет із невеликою перевагою проголосував за нашу пропозицію. Хоча в політичних колах досі сумніваються в тому, чи буде надійним союзником [ITA.GetLeader], тепер ми можемо дати справі хід і представити нашу спільну пропозицію [ITA.GetAdjective]ого уряду."
 lar_fra_launch_coup_desc:0 "Операції почнуться після отримання зашифрованого радіосигналу."
 lar_news.10.a:0 "Тепер їм доведеться сприймати нас серйозно!"
 lar_news.11.desc:0 "Постійні спроби уряду відновити централізований контроль над здебільшого самочинними анархістськими комунами на північному сході Іспанії, а також репресії сталіністів проти комуністів-інакодумців призвели до повномасштабних внутрішніх конфліктів у лавах республіканців.\n\nСпочатку конфлікт обмежувався вуличними боями та дрібними сутичками між ополченнями та урядовими або сталіністськими силами, проте через небажання обох сторін іти на компроміс він стрімко загострився всього за кілька днів. Перерозподіл військових ресурсів для боротьби з цією внутрішньою загрозою призвів до помітного ослаблення лінії фронту проти націоналістів."
 lar_news.20.t:0 "[SPD.GetAdjectiveCap]а війна за незалежність"
 lar_news.281.desc:0 "Кілька століть тому маври були вигнані з Іберії під час Реконкісти. Тепер [From.GetOldAdjective] війська просунулися глибоко в південну Іберію і почали вперше за століття засновувати там поселення маврів. Зокрема, регіон [From.GetOldNameDef] був перетворений на нову націю під назвою «[From.GetNameDefCap]», що заявила про прийняття спадщини древнього султанату, який колись правив всією Іберією. Можливо, [From.GetLeader] бажає відродити цю стару імперію та об'єднати розрізнені народи Близького Сходу, Північної Африки та Європи."
 lar_news.3.t:0 "Паризький конгрес"
 lar_news.6.a:0 "Нас знову зрадили."
 lar_non_intervention.1.desc:0 "[From.GetLeader] офіційно закликає до створення Комітету з невтручання, який повинен стежити за тим, щоби зовнішні держави не брали участь у війні, що йде в Іспанії. З іншого боку, поки не було запропоновано практично жодних заходів, які могли б забезпечити це невтручання.\n\nНавіть якщо ми погодимося не втручатися, є безліч лазівок, завдяки яким ми за бажанням зможемо впливати на війну в Іспанії. Єдиним відчутним наслідком може стати те, що і уряд отримають трохи більше народної підтримки."
 lar_portugal_promote_monarchist_cause.3.a_tt:0 "§G§Y[From.GetFlag][From.GetNameDefCap]§! буде воювати на нашому боці у громадянській війні.§!"
 lar_portugal_promote_monarchist_cause.6.desc:0 "[BRA.GetAdjective] уряд безрозсудно відмовився прийняти нашу пропозицію об'єднати нації, королем яких повинен був стати [Root.GetLeader].\nЦе абсолютно неприйнятно, але не завадить нам повернути Португальському король.\n\nУ результаті їм, як і іншим, доведеться підкоритися нашим вимогам..."
 lar_portugal_promote_monarchist_cause.7.desc:0 "Ситуація в нашій країні критична. Монархістський рух набирає обертів, і в уряді утвердилася антимонархістська коаліція — імовірно, для того, щоби запобігти швидкому повстанню. \nСоціальна нестабільність, і збільшується поляризація суспільства між фашизмом і монархізмом.\nУ такій доленосній ситуації нам час вибрати, на чиєму ми боці."
 lar_portugal_purchase_ships.2.t:0 "[From.GetNameDefCap] приймає пропозицію щодо будівництва наших кораблів"
 lar_portugal_purchase_ships.4.a_tt:0 "Три підводні човни додані в резервний флот"
 lar_portugal_royal_iberian_alliance.1.t:0 "Утворити Королівський Іберійський союз"
 lar_ratify_the_stresa_front.4.a:0 "Ми дали слово."
 lar_spain.17.desc:0 "Комуністичні військові лідери Другої республіки після недавніх військових поразок і скорочення контрольованої ними території до малої частки півострова повалили уряд і нарешті розпочали переговори про мир. Хоч це і значно спростило нам війну, ми, як і раніше, боремося з рештою ворогів."
