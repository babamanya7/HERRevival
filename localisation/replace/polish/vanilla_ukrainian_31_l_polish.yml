 LAT_events.2.d:0 "Згадавши зростаючу напругу в Балтії, [From.GetLeader] оголошує, що об'єднання її народів абсолютно необхідно, щоб три держави існували і надалі. Проте міністр закордонних справ із держави [From.GetNameDef] вимагає не тільки щоб [Root.GetLeader] залишив свою посаду, але й повне підпорядкування всієї партії [Root.GetRulingParty] лідеру їхньої країни, [From.GetLeader], та [From.GetLeader.GetHerHis] адміністрації."
 LAT_events.7.a:0 "Розігнати цей набрід!"
 LAT_events.8.t:0 "Латвія у вогні"
 LAT_military_diarchy_desc:0 "Вплив Балодіса на уряд виріс настільки, що багато хто вважає нашу диктатуру діархією армії та Улманіса. Буде правильно втілити цю помилку в життя і дати Балодісу більше контролю над урядом."
 LAT_state_paganism:0 "Державне язичництво"
 LAT_submarine_1_desc:0 "The Ronis class consisted of two submarines built in France for the Latvian Navy. They were commissioned in 1927. They were small, displacing only 390 tons, and were armed with six 533mm torpedo tubes."
