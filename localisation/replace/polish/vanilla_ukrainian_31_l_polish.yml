 TRUCE_LASTS_UNTIL:0 "Перемир'я триватиме до$DATE|Y$"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_ISLAMIST:0 "Аднан Мендерес, відкрито просував ісламістську політику з урахуванням демократії, став народним героєм. Світ завмер у безсилому сум'ятті, поки [ROOT.GetNameDefCap] переживає консервативну революцію."
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_STANDARD:0 "Мустафа Кемаль Ататюрк із давніх-давен мріяв, що в один прекрасний день [ROOT.GetNameDef] стане оплотом справжньої демократії. Схоже, нам удалося втілити його мрію."
