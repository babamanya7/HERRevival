 RAJ_the_pakistan_movement_desc:0 "Зростаючі заклики до мусульманської батьківщини, Пакистану, дедалі посилюються. Якщо сутички між індусами та мусульманами триватимуть так, це може зробити неможливим збереження єдиної Індії."
 RAJ_timurid_bureaucracy_desc:0 "Вкорінена у спадщині Тимура, Тимуридська бюрократія є зразком ефективного управління та централізованого контролю. Відновлення цієї системи зміцнить адміністрацію Імперії, забезпечуючи стабільність та процвітання на її великих територіях."
 RAJ_timurid_empire_communism_ADJ:0 "Тімурідськ"
 RAJ_timurid_empire_democratic:0 "Тімурідська республіка"
 RAJ_unite_the_subcontinent_desc:0 "Розколоті держави субконтиненту — це тінь його колишньої слави. Возз'єднавши ці землі під прапором Моголів, ми відновимо гармонію, силу та велич імперії, якій судилося правити від гір до морів."
