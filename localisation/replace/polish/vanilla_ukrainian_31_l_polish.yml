 volunteer_target_is_triggered_uprising_tt:0 "Держава §Y[ROOT.GetNameWithFlag]§! може надсилати добровольців лише повстанням, котрі та спричинила."
 war_justification.13.a:0 "Це може бути важке рішення, але ми повинні його прийняти."
