 BUL_bury_the_grudges_of_the_past_decisions_tt:0 "Відкриває рішення щодо впливу на балканські країни та запрошує їх приєднатися до [GetBalkanFactionName]."
 BUL_bury_the_grudges_of_the_past_desc:0 "Настав час залишити суперечки минулого позаду і почати дивитися на майбутнє солідарності та співпраці на Балканах. Ми мусимо закликати наших сусідів приєднатися до нашої [GetFederationOrConfederation], тому що без них наш проєкт об'єднаних Балкан ніколи не буде завершеним."
