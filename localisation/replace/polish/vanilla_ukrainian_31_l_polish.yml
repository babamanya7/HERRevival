 super_heavy_railway_gun_equipment_1_desc:0 "Колосальна зброя незрівнянної потужності та точності, яка стане свідченням невпинного прагнення нашої країни до військової переваги."
 supersonic_fighter_equipment_1:0 "$supersonic_fighter1$"
 support_polish_falange_decisions_desc:0 "У Литві фашизм переміг, і ми не бачимо жодних причин, чому ми повинні залишити наших колишніх братів у Польщі. Поширюючи фалангістську думку серед населення, ми зможемо посилити партію [POL.GetFascistParty] і звідти працювати над утвердженням верховенства Польщі та Литви на всьому континенті."
