 abandon_the_entente:0 "Покинути Антанту"
 ace_killed_by_ace.1.d_major:0 "Pilots returning from [From.GetMissionRegion] report that, a squadron of [Prev.Owner.GetAdjective] aircraft led by the infamous [Prev.GetCallsign] focused on chasing down [From.GetCallsign]. After taking down a number of enemy aircraft and dodging several burst from the [Prev.Owner.GetAdjective]s, [From.GetCallsign] was overwhelmed by [Prev.GetCallsign] in his [Prev.GetWingShort], who reportedly outmaneuvered [From.GetHerHim] and ripped the fuel tanks open with a clean hit. [From.GetName] [From.GetSurname]'s [From.GetWingShort] caught fire and went spiraling down over [From.GetMissionRegion] in a violent inferno.\n\n[From.GetFullName] has shown great courage throughout [From.GetHerHis] service and was looked up to by many. The loss of this national hero is a great blow to the [From.Owner.GetAdjective] air force and is a devastating blow to our nation as a whole. Knowing that while we grieve, [Prev.Owner.GetName] is celebrating [Prev.GetFullName] as a hero, makes the tragedy even greater."
 ace_promoted.1.d_major:0 "Мало хто ризикує так само, як відважні пілоти [Root.GetAdjective]их повітряних сил. [From.GetName] [From.GetSurname], досвідчений пілот, відомий під позивним [From.GetCallsign], відзначи[From.GetVerbGendEndA_RU]ся не лише поверненням живим, але й пілотуванням свого крила [From.GetWing] за допомогою величезної майстерності. Нещодавно [From.GetName] виконува[From.GetVerbGendEndA_RU] місію над регіоном [From.GetMissionRegion] і допоміг[From.GetVerbGendEndA_RU] досягти успіху в цій критичній зустрічі.\n\nЦе яскравий приклад [Root.GetAdjective]ої мужності, тож нещодавнє підвищення пілота було широко розголошено. Хоча люди можуть розглядати війну більше як пекло, ніж славу, багато хто радий бачити, що є ще герої, за якими можна згуртуватися."
 achievement_captured_rommel:0 "Узято в полон Ервіна Роммеля"
 achievement_thaitanic:0 "Затоплено гордість [SIA.GetNonIdeologyAdjective]их ВМС"
