 FACTION_THEATER_SUPPLY_BONUS_TOOLTIP:0 "Вибрані країни в театрі отримують $VAL$ §Hспоживання припасів§! на основі навичок командувача $SKILL1|H$ ($SKILL1VAL|H$) та $SKILL2|H$ ($SKILL2VAL|H$).\n\n§HАдмірал§! надасть вищий бонус до споживання морських припасів, тоді як §Hфельдмаршал§! надасть кращий бонус до споживання сухопутних припасів."
