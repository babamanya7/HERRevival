 construction_effort_2_desc:0 "Продовження розширення наших заводів дозволить нам пришвидшити виробництво товарів для торгівлі та різні будівельні проєкти."
 control_faroe_islands_goal_desc:0 "Фарерські острови розташовані у стратегічному місці, що дозволяє контролювати північні морські маршрути та підтримувати військово-морські операції до Британії, Скандинавії та Арктики."
 control_narvik_goal_desc:0 "Забезпечення Нарвіка дозволить підтримувати доступ до життєво важливих поставок залізної руди та контролювати арктичні маршрути постачання."
 convoy_escort_force_goal_desc:0 "Щоб забезпечити наші лінії постачання, ми повинні мати достатню кількість ескортних суден."
 coordinated_strike_direct_units_outcome:0 "Наш загін успішно спрямував бойові частини до важливих цілей, збільшивши тим самим збитки, завдані противнику."
 coordinated_strike_occupy_bridges_desc:0 "Наш загін захопить мости в районі ведення бою, не даючи знищити їх і блокуючи контратаки супротивника."
 country_capitulated.0.d_negative_both_no_faction:0 "\n[Root.GetLeader] оголосив, що [Root.GetAdjective]а держава більше не може встояти під тиском [From.From.GetAdjective]их окупаційних військ, які скоюють немислимі звірства в їхній країні. [Root.GetAdjective]а влада створила уряд у вигнанні. Їхні основні війська капітулювали, а [From.From.GetNameDef] тепер контролює їхні головні території.\nНезважаючи на цю нищівну втрату, війна проти держави [From.From.GetNameDef] ще далека від завершення."
