 YUG_invite_greece_desc:0 "Молоді чоловіки та дівчата Греції страждають під залізним черевиком своїх панів, і лише озброївши їх бідних і пригноблених, ми зможемо розірвати ланцюги, які їх зв'язують."
 YUG_invite_hungary:0 "Запросити Угорщину"
 YUG_light_tank_equipment_1:0 "Projekat Laki Tenk M1934"
 YUG_local_self_management:0 "Місцеве самоврядування"
 YUG_pan_balkan_workers_congress:0 "Панбалканська ініціатива"
 YUG_pan_balkan_workers_congress_desc:0 "Хоча ми забезпечили ідеали соціалізму в наших безпосередніх південних сусідах, на Балканах незліченна кількість людей страждає від монархічних і буржуазних диктатур. Тільки звільнивши робітників Румунії, Угорщини та Греції, ми можемо сказати, що ми звільнили робітників Балкан."
 YUG_propaganda_in_target_desc:0 "Наша мета обрана — потрібно лише забезпечити наших союзників-соціалістів ефективною пропагандою, і вже скоро ми посіємо зернята повстання, потрібне, щоби повалити найвищі класи Балкан."
 YUG_shut_down_recruitment_centers_desc:0 "Усташі також мають власні центри вербування; навчання та озброєння будь-якого здатного тіла, достатньо дурного, щоб воювати та померти за свою справу. Ми мусимо знайти та знищити ці центри вербування та позбавити усташів засобів для залучення нових тіл до своїх лав."
 YUG_sold_planes:0 "Ухвалили придбання літаків"
 YUG_something_in_progress_flag:0 "Нині впливає на усташів"
 YUG_surrender_italian_claims_desc:0 "Зара й Істрія залишаються в руках Італії, але ми не можемо ризикувати розгнівати [ITA.GetLeader], продовжуючи наполягати на тому, що вони по праву наші. Можливо, ми зможемо отримати доступ до країн Осі в обмін на відмову від претензій за межами нашого кордону."
 YUG_united_autonomous_croatia_desc:0 "Об'єднання Бановини Хорватії в автономну державу вже давно було запропонованим вирішенням проблеми зростання хорватського сепаратизму. Надавши Хорватії певну автономію, ми можемо зробити з нашого можливого ворога сильного союзника."
