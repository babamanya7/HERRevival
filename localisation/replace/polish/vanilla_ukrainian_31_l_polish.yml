 CONGO_establish_university_of_louvain_desc:0 "Спочатку заснований як медичний коледж для вивчення тропічної медицини, ми маємо можливість розширити інститут за допомогою факультету аграрних наук, а потім, коли ми оголосимо його справжнім університетом, він обов'язково стане об'єктом заздрості Африки."
