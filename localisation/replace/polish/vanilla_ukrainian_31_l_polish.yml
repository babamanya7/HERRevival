 MUN_czech_bop.3.d:0 "[CZE.getname] нещодавно надіслала людей до нашої країни для спостереження за поточним конфліктом. Водночас один із їхніх виробників стрілецької зброї зв'язався з нашими дипломатами через інші канали, цікавлячись, чи не хочемо ми купити у них стрілецьку зброю. Через накладені на нас обмеження це передбачатиме контрабанду зброї до нашої країни."
