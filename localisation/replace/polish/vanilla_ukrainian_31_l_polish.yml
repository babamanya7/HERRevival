 shadow_scheme:0 "Тіньова схема"
 ship_hull_cruiser_3_desc:0 "Крейсери всіх держав стають все потужнішими; для подальшого розвитку потрібен збільшений корпус нової конструкції, здатний вмістити все необхідне обладнання."
