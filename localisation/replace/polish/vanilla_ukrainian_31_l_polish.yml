 GER_aeronautical_research_institute_desc:0 "З часів Великої війни важливість і складність повітряної війни зросла, а оскільки Версальський договір заборонив нам мати військово-повітряні сили, ми відстали у розвитку літаків. Щоби виправити це, треба збудувати Luftfahrtforschungsanstalt (Авіаційний науково-дослідний інститут) для розробки інноваційних корпусів літаків, двигунів та зброї, які забезпечать панування в повітрі."
 GER_all_for_the_front:0 "Усе для фронту!"
 GER_ally_white_russian_forces_desc:0 "Є багато росіян, які втекли за кордон після перемоги червоних у громадянській війні. Ми повинні звернутися до них і з'ясувати, чи готові вони співпрацювати заради повернення на батьківщину — в обмін на відмову від претензій на землі, передані нам чи нашим союзникам Брест-Литовським договором."
 GER_anti_air_equipment_2:0 "2 cm Flakvierling 38"
 GER_anti_comintern_pact_unaligned_desc:0 "Військове вторгнення — не єдине, що нам загрожує: ми маємо стримувати тиск комунізму на всіх фронтах. Ми укладемо союз із некомуністичними режимами, щоб ефективніше боротися з червоною загрозою."
 GER_baltic_membership_desc:0 "Два десятиліття країни Балтії живуть, побоюючись вторгнення збройних сил та загрози [GER.GetBalticMembershipDesc]. Ми запропонуємо їм членство в союзі та можливість разом протистояти отруті, яку розповсюджує навколо себе [GER.GetDanubianMembershipDesc]."
 GER_befriend_czechoslovakia_desc:0 "$GER_czech_friend_desc$"
 GER_break_anglo_french_colonial_hegemony_ww:0 "$GER_break_the_anglo_french_colonial_hegemony$"
 GER_brothers_in_arms:0 "Брати по зброї"
 GER_case_anton_category_desc:0 "Метою створення Франції Віші завжди було утримати французькі колонії та французький флот подалі від рук союзників. Однак цю угоду ми можемо скасувати в будь-який час. У нас є план, спрямований на примусову інтеграцію території, а також на блискавичний поштовх до бази французького флоту в Тулоні."
 GER_clamp_down_on_fascism:0 "Боротьба з фашизмом"
 GER_communism_arbeit_party:0 "НРП"
 GER_concentrated_armament_program_desc:0 "Наша промисловість мусить підтримати військові потреби, щоби переозброїти нашу країну. Мусить бути запущена комплексна програма переозброєння для швидкої модернізації та розширення наших збройних сил!"
 GER_cv_nav_bomber_equipment_3_short:0 "Ar 215"
 GER_danzig_for_slovakia_desc:0 "$GER_danzig_vs_slovakia_desc$"
 GER_demand_sudetenland_threat:0 "Німеччина вимагає Судетську область"
 GER_deschimag_organization:0 "$GER_deschimag$"
 GER_disband_the_schutztruppen:0 "Розпустити Шуцтруппе"
 GER_divide_and_conquer_desc:0 "У нас із [CHI.GetAdjective] є свої сфери інтересів на Далекому Сході. Ми маємо якнайшвидше позначити кордони, щоб наші імперські прагнення були взаємно визнані."
 GER_encouraging_proletarian_uprising:0 "Вибрати місце для заохочення пролетарського повстання"
 GER_end_european_communism:0 "Знищити європейський комунізм"
 GER_ensure_army_loyalty_desc:0 "У наших лавах ще залишились ті, кого можна переконати стати на наш бік, відкинувши помилкові переконання, яких вони дотримувались раніше. Це потребує зусиль, але за допомогою колективного духу ми забезпечимо лояльність на роки вперед."
 GER_establish_a_customs_union:0 "Створити митний союз"
 GER_establish_night_fighter_squadrons:0 "Створити нічні ескадрильї винищувачів"
 GER_establish_production_targets:0 "Установити виробничі цілі"
 GER_extra_funds_to_waffenamt:0 "Додаткові кошти для Waffenamt"
 GER_first_ljubljana_award_GER:0 "Перший Люблянський арбітраж"
 GER_focus_on_the_true_enemy:0 "Акцент на справжніх ворогах"
 GER_grosraumwirtschaft:0 "Großraumwirtschaft"
 GER_gw_tank_equipment:0 "Leichttraktor"
 GER_hungary_desc:0 "Робітники в [HUN.GetNameDef] досі борються за права, які мали б бути гарантованими. Уряд країни не визнає їхні потреби, тож ми повинні втрутитися й забезпечити, щоб пролетаріат по всій території [HUN.GetName] отримував справедливе ставлення і повагу, на які заслуговує."
 GER_implement_rations:0 "Впроваджувати пайки"
 GER_industrialists_intrigue_prevailed_tt:0 "§Y$PREVAILED_CHARACTER$§! отримав довіру очолити промисловий напрям і єдиний, хто може працювати над взаємовиключним фокусом."
 GER_jet_fighter_equipment_2:0 "Heinkel He 162 'Volksjäger'"
 GER_light_tank_artillery_equipment_1_short:0 "Bison"
 GER_light_tank_equipment_3_desc:0 "VK1602 Leopard був спланованою німецькою розвідувальною машиною, розробленою в 1942 році. Планувалося озброїти машину 75-мм KwK 41, хоча її замінили на меншу 50-мм гармату. VK 1602 мав похилу лобову броню, створену за зразком середнього танка Panther. Для підвищення прохідності VK 1602 був оснащений гусеницями шириною 350 мм."
 GER_mechanized_equipment_2_desc:0 "Sd.Kfz. 251 — напівгусенична броньована бойова машина, розроблена та вперше виготовлена компанією Hanomag під час Другої світової війни на базі їх попереднього Sd.Kfz. 11 транспортний засіб."
 GER_medium_tank_aa_equipment_1:0 "Flakpanzer III Möbelwagen"
 GER_medium_tank_equipment_1_desc:0 "Ще в 1934/35 роках генерал Гайнц Гудеріан передбачив два основних типи, які будуть використовуватися як найчисленніша техніка для майбутніх німецьких танкових дивізій. Перша машина мала бути озброєна протитанковою гарматою і двома кулеметами, а друга — бути машиною забезпечення з гарматою більшого калібру. Перший згодом став відомий як Panzerkampfwagen III, який мав стати стандартним танком для трьох легких рот танкового батальйону. Другий отримав назву Panzerkampfwagen IV."
 GER_mefo_bills_effect_in_days:0 "Ось що станеться за [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] дн.:\n"
 GER_mio_trait_90_degree_dives:0 "Пікірування під кутом 90 градусів"
 GER_mio_trait_armored_design:0 "Броньована конструкція"
 GER_mio_trait_carrier_raiders:0 "Авіаносні рейдери"
 GER_mio_trait_doppel_blitz:0 "Doppel-Blitz"
 GER_mio_trait_dual_recoil_mechanism:0 "Механізм подвійного відкочування"
 GER_mio_trait_high_velocity_armament:0 "Високошвидкісне озброєння"
 GER_mio_trait_psychological_warfare:0 "Психологічна війна"
 GER_mitteleuropa_allied_trade_cat_desc:0 "Наші союзники мають багато ресурсів, які були б корисними для нашої країни. Ми можемо отримати значну вигоду від поглиблення торгових відносин з ними. Ми забезпечили б постійний потік життєво важливих ресурсів і одночасно позбавили б наших ворогів тих самих ресурсів, зміцнюючи нас і послаблюючи їх."
 GER_modify_economy_of_conquest_modifier_russian_states_tt:0 "Використовує ресурси області §Y[FROM.GetName]§!, щоби змінити §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! ідеї §Y$GER_economy_of_conquest_modifier$§!.\n"
 GER_occupy_herzegovina_decision:0 "Окупувати Герцеговину"
 GER_operation_green:0 "План «Зелений»"
 GER_oppose_hitler:0 "Протистояння Гітлеру"
 GER_prepare_for_the_next_naval_blockade:0 "Підготуватись до наступної морської блокади"
 GER_propaganda:0 "Загальнонаціональна пропаганда"
 GER_railway_gun_equipment_1:0 "28 cm Kanone 5 (E)"
 GER_re_form_the_freikorps_desc:0 "Фрайкор допомагав нам боротися проти ідеологічних ворогів, подавляючи Баварську радянську республіку та інші повстання під час Ваймарської доби. Слід відродити таке формування, щоб ані комуністи, ані нацисти не змогли знову вкоренитися в нашій державі."
 GER_realize_mittelafrika_desc:0 "Наша колоніальна імперія простягнеться далеко, а багатства Центральної Африки завжди нас вабили. Пора реалізувати наші мрії про Німецьку Міттельафріку."
 GER_realize_mittelafrika_tt:0 "Отримує претензії на всі §Yконголезькі§!, §Yкенійські§!, §Yангольські§! та §Yмозамбіцькі§! землі."
 GER_reichskommissariat_highlighted_required_states:0 "§Y[ROOT.GetNameWithFlag]§! або маріонетка контролює усі §YВиділені області§!"
 GER_restore_the_holy_roman_empire:0 "Відновити Священну Римську імперію"
 GER_return_of_the_kaiser_ww_desc:0 "Кайзеррайху потрібен кайзер, а Вільгельм ІІ усе ще живий, хоч і в еміграції в Нідерландах. Ми скасуємо його заслання та запросимо повернутися на трон — попри невдоволення західних демократій."
 GER_salvage_captured_equipment:0 "Утилізація захопленого спорядження"
 GER_secure_finland:0 "Забезпечити близькість Фінляндії"
 GER_see_to_the_eastern_front_desc:0 "Досвід Великої війни недвозначно говорить про те, що нам потрібно бути готовими захищати наші східні володіння. Потрібно зміцнити рубежі зі Сходу та підготуватися відобразити вторгнення."
 GER_seize_gold_reserves_cat_desc:0 "Наша амбітна програма переозброєння вимагає більше грошей і ресурсів, ніж наша країна може забезпечити самостійно. Проте, ми не одні... адже розширюючись, ми можемо використовувати здобутки наших завоювань для підтримки нашої військової промисловості. Здобич переможцю!"
 GER_sentinels_of_the_pacific_desc:0 "Наші плацдарми в Тихому океані, як правило, недорозвинені та погано пристосовані для того, щоби бути корисними як для наших власних Крігсмаріне, так і для наших союзників. Необхідно докласти значних зусиль для створення належної військово-морської інфраструктури у відповідних районах Тихого океану."
 GER_shalva_maglakelidze_and_giorgi_kvinitadze_join:0 "§YГіоргі Квінітадзе§! та §YШалва Маглакелідзе§! приєднаються до нас як §Yфельдмаршал§! та §Yгенерал§!\n"
 GER_strike_at_the_source:0 "Вдарити в джерело"
 GER_submarine_4_desc:0 "Підводні човни типу «XXI», також відомі як «Elektroboote», були першими підводними човнами, спроєктованими для роботи під водою, а не як надводні кораблі, які могли занурюватися, щоб уникнути виявлення або розпочати атаку. Його ключовими особливостями були обтічний корпус і башта, а також велика кількість акумуляторних батарей. Це був один з найбільших німецьких підводних човнів, водотоннажність якого перевищувала 1620 тонн. Між 1943 і 1945 роками було побудовано 118 човнів."
 GER_subversive_infiltrators_desc:0 "Розвідка та інформація про ворога мають вирішальне значення для успішного вторгнення. Оскільки ми збільшуємо витрати в багатьох сферах, цілком логічно, що ми також інвестуємо в поліпшення збору розвідувальних даних."
 GER_super_heavy_tank_artillery_equipment_1:0 "Geschützwagen E-100"
 GER_super_heavy_tank_destroyer_equipment_1_short:0 "Jagdmaus"
 GER_tac_bomber_equipment_0:0 "Dornier Do 23"
 GER_the_mannheim_project_tt:0 "Дає різні нагороди в залежності від поточного рівня атомних досліджень:\n\n"
 GER_the_sino_germanic_pact_desc:0 "Настав час офіційно визнати [CHI.GetAdjective] уряд як союзника. Ми маємо негайно формалізувати цей альянс, щоб разом протистояти гнобителям!"
 GER_trade_interdiction:0 "Перехоплення торгівлі"
 GER_transport_plane_equipment_2:0 "Junkers Ju 52/3m"
 GER_unlocks_statue_of_liberty_raid_tt:0 "Відімкне §Yповітряний наліт§! на §YСтатую Свободи§!, коли країна опиниться у війну з державою §Y[USA.GetNameWithFlag]§!."
 GER_war_against_major_countries_in_europe_tt:0 "Отримати ціль війни §YАнексія§! проти всіх §Yвпливових§! націй, що контролюють хоча б одну область у §YЄвропі§!. Поточний ефект:"
 GER_war_with_greece_desc:0 "Оскільки Греція вже втягнута у війну, Німеччині не можна упускати шанс створити базу у східному Середземномор'ї."
 GER_weserubung_nord_desc:0 "Норвегія є критично важливою стратегічною точкою і стане очевидною точкою атаки для будь-якого ворога, який хоче зірвати нашу торгівлю сталлю зі Швецією. Ми не можемо ризикувати, щоби наші вороги розмістили бази в цьому регіоні."
 GER_womens_rights_and_equality_desc:0 "Стать тривалий час визначала, де громадянин має служити — на фронті, на фабриці чи вдома. Розподіл обов'язків на рівних дозволить нам мати більшу робочу силу та, за потреби, більшу армію."
 GNA_neutrality:0 "Гвінея"
 GNB_neutrality_ADJ:0 "Біссауськ"
 GOE_RAJ.10.a:0 "Ми воюємо"
 GOE_RAJ.26.a:0 "Чудово!"
 GOE_RAJ.3.a:0 "Шкода"
 GOE_RAJ.30.b:0 "Ні, нам тут до вподоби"
 GOE_RAJ.39.b_tt:0 "Коли ми отримаємо владу, ми будемо зобов'язані гарантувати мінімальну заробітну плату протягом §Y6 місяців§!. Невиконання цього засмутить профспілки. Гарантована мінімальна заробітна плата дає: "
 GOE_RAJ.42.desc:0 "Індійські сили перетнули спірну територію поблизу [431.GetName]. Сутички спалахують на рівнинах на північ від Калькутти. Вони стверджують, що земля належить революції за історичним правом. У радіопромові Прем'єр назвав Пакистан пережитком колоніального поділу. Напруга зростає, і сутичка здається неминучою."
 GOE_RAJ.44.a:0 "Як вони сміють?"
 GOE_RAJ.51.b:0 "[986.GetName] по праву наш."
 GOE_RAJ_famine.12.a:0 "Добре!"
 GOE_RAJ_generals.6.t:0 ""
 GOE_RAJ_goa.4.a:0 "Чудово."
 GOE_RAJ_loyalist.09.t:0 "[FROM.GetNameDefCap] відхиляє наш оборонний план"
 GOE_RAJ_loyalist.13.desc:0 "З поверненням наших рідних земель під наш контроль ми можемо почати відновлювати наш попередній кабінет. $ENG_winston_churchill$ добре прийнятий після свого повернення з [RAJ.GetNameDef], і настав час вирішити, як ми будемо діяти."
 GOE_RAJ_partition.4.desc:0 "У міру того, як прагнення до незалежності набирає обертів, виникає глибокий і зростаючий розкол. Індуси, сповнені рішучості зберегти єдину Індію, все більше конфліктують з мусульманами, які, побоюючись маргіналізації в державі з індуїстською більшістю, закликають до створення окремої батьківщини. Ця зростаюча напруженість розпалила насильницькі зіткнення між екстремістськими фракціями з обох громад, ставлячи стабільність країни під серйозний ризик."
 GRE_VICTORY_POINTS_3924:0 "Аспалафос"
 GRE_anti_german_stratagems:0 "Анти-[FROM.GetAdjective]і стратагеми"
 GRE_civil_war_imminent_2_desc:0 "Напруження між республіканцями та монархістами досягнуло апогею. На жаль, нам не уникнути громадянської війни..."
 GRE_debt_50:0 "§Y50%§!"
 GRE_gw_tank_equipment_short:0 "CL Mark VI"
 GRE_investment_decisions_category:0 "Схеми інвестування"
 GRE_nenikikamen:0 "Ми перемогли"
 GRE_paying_back_our_debts_in_bulk_desc:0 "Чим швидше ми виплатимо наші борги, тим швидше зможемо почати перетворювати країну. Ми збільшимо частку, яку виділяє з капіталу країни на виплату боргів, щоб швидше звільнитися від гніту іноземних кредиторів."
 GRE_realign_ourselves_with_the_central_powers:0 "Поновити відносини з Центральними державами"
 GRE_remembering_the_anatolian_catastrophe_desc:0 "Кампанія у Малій Азії стала справжньою катастрофою. Наші люди були жорстоко вбиті, наш престиж упав на саме дно, наш політичний рух роздавлений — і все за три роки! Не можна, щоб ця поразка увійшла до нашої історії. Потрібно обернути все так, щоби наш народ звинувачував турків, а не нас, можливо, тоді ми нарешті зможемо реалізувати свої мрії про Велику Грецію..."
 GRE_republican_victory_tt:0 "£faction_gre_monarchist §YМонархісти§! стануть §Yбайдужі§!.\n£faction_gre_communist §YКомуністи§! стануть §Yбайдужі§!."
 GRE_request_italian_assistance_with_industrialisation:0 "Попросити допомоги з індустріалізацією"
 GRE_resurrecting_the_megali_idea_desc:0 "У 1919 році нам обіцяли Велику ідею, але наступна греко-турецька війна мало не поховала її назавжди. І все ж поки турки осквернюють наші споконвічні землі своєю присутністю, ми будемо прагнути повернути їх собі. Грецький народ уже якось згадував про це — можна спонукати його згадати знову..."
 GRE_sophistry_and_science:0 "Софістика та наука"
