 ENG_emergency_arms_for_china_desc: "Безвозмездно направить через общий западный склад полный пехотный пакет. Подготовка груза занимает 14 дней."
 USA_finance_burma_road_expansion: "Финансировать расширение Бирманской дороги"
 USA_finance_burma_road_expansion_desc: "Оплатить расширение бирманского маршрута. Через 120 дней его недельная пропускная способность увеличится на §G500§!."
 USA_expand_hump_airlift: "Расширить воздушный мост через Гималаи"
 USA_expand_hump_airlift_desc: "Выделить транспортные и промышленные мощности для воздушного моста. Через 120 дней его входящая пропускная способность увеличится на §G500§!."
 her_chi_aid.1.t: "Китай запрашивает товарный кредит"
 her_chi_aid.1.d: "Правительство Китая предлагает обеспечить американский кредит будущими поставками стратегически важного вольфрама. Сохранение открытых путей через китайские порты, Индокитай и Бирму будет необходимо как для поставок вооружения, так и для погашения обязательств."
 her_chi_aid.1.a: "Одобрить кредит"
 her_chi_aid.1.b: "Отказать Китаю"
 her_chi_aid.2.t: "Американский кредит одобрен"
 her_chi_aid.2.d: "Соединённые Штаты открыли кредитную линию для закупки вооружения. Китай обязался погасить её поставками вольфрама, а в Чунцине создан защищённый экспортный склад. Строительство и расширение западных маршрутов остаётся ответственностью США и Великобритании."
 her_chi_aid.2.a: "Это укрепит сопротивление"
 her_chi_aid.3.t: "Американцы отказали в кредите"
 her_chi_aid.3.d: "Правительство Соединённых Штатов отказалось принять китайское предложение."
 her_chi_aid.3.a: "Прискорбно"
 her_chi_aid.contract_accept: "Принять американское предложение"
 her_chi_aid.contract_refuse: "Отказаться от контракта"
 her_chi_aid.4.t: "Американское стрелковое вооружение"
 her_chi_aid.4.d: "Соединённые Штаты предлагают полный пехотный пакет за 55 000 единиц кредита: винтовки, пулемёты, миномёты и ручные противотанковые средства."
 her_chi_aid.5.t: "Американская артиллерия"
 her_chi_aid.5.d: "Соединённые Штаты предлагают смешанный пакет полевой, тяжёлой, противотанковой и зенитной артиллерии за 70 000 единиц кредита."
 her_chi_aid.6.t: "Американские грузовики"
 her_chi_aid.6.d: "Соединённые Штаты предлагают поставить 1 000 грузовиков за 35 000 единиц кредита."
 her_chi_aid.7.t: "Американские истребители"
 her_chi_aid.7.d: "Соединённые Штаты предлагают поставить одно авиакрыло из 40 истребителей за 50 000 единиц кредита."
 her_chi_aid.request_approve: "Одобрить китайский запрос"
 her_chi_aid.request_refuse: "Отказать Китаю"
 her_chi_aid.8.t: "Китай запрашивает стрелковое вооружение"
 her_chi_aid.8.d: "Китайское правительство запрашивает полный пехотный пакет за 55 000 единиц кредита. Подготовка одобренного груза займёт 14 дней."
 her_chi_aid.9.t: "Китай запрашивает артиллерию"
 her_chi_aid.9.d: "Китайское правительство запрашивает смешанный пакет полевой, тяжёлой, противотанковой и зенитной артиллерии за 70 000 единиц кредита."
 her_chi_aid.10.t: "Китай запрашивает грузовики"
 her_chi_aid.10.d: "Китайское правительство просит продать ему 1 000 грузовиков за 35 000 единиц кредита."
 her_chi_aid.11.t: "Китай запрашивает истребители"
 her_chi_aid.11.d: "Китайское правительство просит продать одно авиакрыло из 40 истребителей за 50 000 единиц кредита."
 her_chi_aid.12.t: "Американцы одобрили запрос"
 her_chi_aid.12.d: "Американское правительство одобрило наш последний запрос. Стоимость контракта списана с кредитного счёта, а оборудование направлено на транзитный склад."
 her_chi_aid.12.a: "Ожидаем прибытия груза"
 her_chi_aid.13.t: "Американцы отказали в поставке"
 her_chi_aid.13.d: "Американское правительство отклонило наш последний запрос. Средства с кредитного счёта не списывались."
 her_chi_aid.13.a: "Придётся искать другие возможности"
 her_chi_aid.14.t: "Китай запрашивает боеприпасы"
 her_chi_aid.14.d: "Китай просит продать 10 000 единиц боеприпасов за 45 000 единиц кредита."
 her_chi_aid.15.t: "Китай запрашивает дополнительное оснащение"
 her_chi_aid.15.d: "Китай просит продать 1 000 единиц дополнительного оснащения за 45 000 единиц кредита."
 her_chi_aid.16.t: "Китай запрашивает штурмовики"
 her_chi_aid.16.d: "Китай просит продать авиакрыло из 40 штурмовиков за 55 000 единиц кредита."
 her_chi_aid.17.t: "Китай запрашивает лёгкие бомбардировщики"
 her_chi_aid.17.d: "Китай просит продать авиакрыло из 40 лёгких тактических бомбардировщиков за 65 000 единиц кредита."
 her_chi_aid.18.t: "Американский контракт на боеприпасы"
 her_chi_aid.18.d: "Соединённые Штаты предлагают 10 000 единиц боеприпасов за 45 000 единиц кредита."
 her_chi_aid.19.t: "Американское дополнительное оснащение"
 her_chi_aid.19.d: "Соединённые Штаты предлагают 1 000 единиц дополнительного оснащения за 45 000 единиц кредита."
 her_chi_aid.20.t: "Американские штурмовики"
 her_chi_aid.20.d: "Соединённые Штаты предлагают авиакрыло из 40 штурмовиков за 55 000 единиц кредита."
 her_chi_aid.21.t: "Американские лёгкие бомбардировщики"
 her_chi_aid.21.d: "Соединённые Штаты предлагают авиакрыло из 40 лёгких тактических бомбардировщиков за 65 000 единиц кредита."
 CHI_request_american_credit_expansion: "Запросить расширение кредитной линии"
 CHI_request_american_credit_expansion_desc: "После первых поставок вольфрама запросить ещё §Y750 000§! единиц американского кредита. В случае согласия вольфрамовый долг увеличится на §Y1 500 000§!."
 USA_deploy_flying_tigers: "Развернуть «Летающих тигров»"
 USA_deploy_flying_tigers_desc: "Сформировать Американскую добровольческую группу из трёх элитных истребительных эскадрилий. §Y120 истребителей§! пройдут через транзитный склад BRA, а американские инструкторы усилят китайские ВВС."
 USA_offer_china_emergency_credit: "Предложить чрезвычайный кредит Китаю"
 USA_offer_china_emergency_credit_desc: "Предложить Китаю ещё §Y1 000 000§! единиц кредита на льготных условиях в обмен на увеличение вольфрамовых обязательств на §Y1 000 000§!. Китай должен согласиться с предложением."
 USA_begin_ledo_road_construction: "Начать строительство дороги Ледо"
 USA_begin_ledo_road_construction_desc: "Начать прокладку дороги из Ассама к Бирманской дороге. Работы займут §Y790 дней§! и потребуют §Y10 гражданских фабрик§!. Маршрут не сможет открыться раньше §Y28 января 1945 года§!."
 USA_expand_ledo_road: "Расширить дорогу Ледо"
 USA_expand_ledo_road_desc: "Увеличить недельную пропускную способность открытой дороги Ледо на §G500§! после 120 дней работ."
 CHI_flying_tigers_air_group: "«Летающие тигры»"
 CHI_flying_tigers_air_group_desc: "Опытные американские добровольцы, инструкторы и отлаженная система управления полётами стали элитным ядром китайских истребительных сил."
 her_chi_aid.30.t: "Китай запрашивает расширение кредита"
 her_chi_aid.30.d: "Китайское правительство уже начало обслуживать вольфрамовый долг и просит открыть дополнительную кредитную линию для дальнейших закупок вооружения."
 her_chi_aid.30.a: "Одобрить расширение кредита"
 her_chi_aid.30.b: "Отказать в новом кредите"
 her_chi_aid.31.t: "Кредитная линия расширена"
 her_chi_aid.31.d: "Соединённые Штаты предоставили ещё 750 000 единиц кредита. Наши обязательства по поставкам вольфрама выросли на 1 500 000 единиц."
 her_chi_aid.31.a: "Продолжим закупки"
 her_chi_aid.32.t: "В расширении кредита отказано"
 her_chi_aid.32.d: "Американское правительство отказалось расширять нашу кредитную линию."
 her_chi_aid.32.a: "Прискорбно"
 her_chi_aid.33.t: "Американский чрезвычайный кредит"
 her_chi_aid.33.d: "Соединённые Штаты предлагают дополнительный кредит на закупку вооружения. Условия выгоднее прежних, но соглашение увеличит наши обязательства по поставкам вольфрама."
 her_chi_aid.33.a: "Принять предложение"
 her_chi_aid.33.b: "Отказаться от новых обязательств"
