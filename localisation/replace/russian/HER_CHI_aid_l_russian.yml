 CHI_foreign_aid: "Иностранная помощь Китаю"
 CHI_foreign_aid_desc: "Иностранные кредиты и поставки поддерживают китайское сопротивление.\nКонтракт проходит §Y14 дней§! доставки на транзитный склад и §Y14–35 дней§! перевозки выбранным маршрутом.\n\n§YФинансы§!\nАмериканский кредит: §Y[?CHI_usa_credit_balance|0]§!\nВольфрамовый долг: §Y[?CHI_usa_tungsten_debt|0]§!\n\n§YВольфрамовые поставки§!\n§LЭтап — Объём§!\nНа китайском складе: §Y[?left_tungsten|0]§!\nВ пути в США: §Y[?CHI_tungsten_in_transit|0]§!\nПрибыло за 7 дней: §G[?CHI_tungsten_arrived_7d|0]§!\nПрибыло всего: §G[?CHI_tungsten_arrived_total|0]§!\n\n§YПропускная способность маршрутов§!\nМорские порты: §Y[?CHI_sea_route_capacity|0]§!\nФранцузский Индокитай: §Y[?CHI_hanoi_route_capacity|0]§!\nБирманская дорога: §Y[?CHI_burma_route_capacity|0]§!\nВоздушный мост через Гималаи: §Y[?CHI_hump_route_capacity|0]§!\nДорога Ледо: §Y[?CHI_ledo_route_capacity|0]§!\nОбщая пропускная способность: §Y[?CHI_western_route_capacity|0]§!\n\n§YЗагрузка маршрутов за неделю§!\n§LМаршрут — Ввоз использовано/лимит | Вывоз использовано/лимит§!\nМорские порты: §Y[?CHI_sea_import_used|0]/[?CHI_sea_import_allocation|0]§! | §Y[?CHI_sea_export_used|0]/[?CHI_sea_export_allocation|0]§!\nИндокитай: §Y[?CHI_hanoi_import_used|0]/[?CHI_hanoi_import_allocation|0]§! | §Y[?CHI_hanoi_export_used|0]/[?CHI_hanoi_export_allocation|0]§!\nБирма: §Y[?CHI_burma_import_used|0]/[?CHI_burma_import_allocation|0]§! | §Y[?CHI_burma_export_used|0]/[?CHI_burma_export_allocation|0]§!\nГималаи: §Y[?CHI_hump_import_used|0]/[?CHI_hump_import_allocation|0]§! | §g—§!\nЛедо: §Y[?CHI_ledo_import_used|0]/[?CHI_ledo_import_allocation|0]§! | §Y[?CHI_ledo_export_used|0]/[?CHI_ledo_export_allocation|0]§!\n\n§YЗагрузка общего транспортного пула за неделю§!\n§LНаправление — Лимит | Использовано | Свободно | Загрузка§!\nВ Китай: §Y[?CHI_western_import_allocation|0]§! | §Y[?CHI_western_import_used_last_week|0]§! | §G[?CHI_western_import_capacity|0]§! | §Y[?CHI_western_import_load_percent|0]%§!\nИз Китая: §Y[?CHI_western_export_allocation|0]§! | §Y[?CHI_western_export_used_last_week|0]§! | §G[?CHI_western_export_capacity|0]§! | §Y[?CHI_western_export_load_percent|0]%§!\n\n§YПоставки вооружения§!\n§LТип груза — Очередь | В пути | За 7 дней | Всего§!\nВинтовки: §Y[?BRA.BRA_CHI_queued_infantry_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_infantry_equipment|0]§! | §G[?CHI_arrived_7d_infantry_equipment|0]§! | §G[?CHI_arrived_total_infantry_equipment|0]§!\nПулемёты: §Y[?BRA.BRA_CHI_queued_machinegun|0]§! | §Y[?BRA.BRA_CHI_in_transit_machinegun|0]§! | §G[?CHI_arrived_7d_machinegun|0]§! | §G[?CHI_arrived_total_machinegun|0]§!\nМиномёты: §Y[?BRA.BRA_CHI_queued_mortar|0]§! | §Y[?BRA.BRA_CHI_in_transit_mortar|0]§! | §G[?CHI_arrived_7d_mortar|0]§! | §G[?CHI_arrived_total_mortar|0]§!\nРучные ПТ: §Y[?BRA.BRA_CHI_queued_antitank|0]§! | §Y[?BRA.BRA_CHI_in_transit_antitank|0]§! | §G[?CHI_arrived_7d_antitank|0]§! | §G[?CHI_arrived_total_antitank|0]§!\nПолевая артиллерия: §Y[?BRA.BRA_CHI_queued_artillery_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_artillery_equipment|0]§! | §G[?CHI_arrived_7d_artillery_equipment|0]§! | §G[?CHI_arrived_total_artillery_equipment|0]§!\nТяжёлая артиллерия: §Y[?BRA.BRA_CHI_queued_heavy_artillery_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_heavy_artillery_equipment|0]§! | §G[?CHI_arrived_7d_heavy_artillery_equipment|0]§! | §G[?CHI_arrived_total_heavy_artillery_equipment|0]§!\nПТО: §Y[?BRA.BRA_CHI_queued_anti_tank_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_anti_tank_equipment|0]§! | §G[?CHI_arrived_7d_anti_tank_equipment|0]§! | §G[?CHI_arrived_total_anti_tank_equipment|0]§!\nПВО: §Y[?BRA.BRA_CHI_queued_anti_air_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_anti_air_equipment|0]§! | §G[?CHI_arrived_7d_anti_air_equipment|0]§! | §G[?CHI_arrived_total_anti_air_equipment|0]§!\nБоеприпасы: §Y[?BRA.BRA_CHI_queued_ammunition_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_ammunition_equipment|0]§! | §G[?CHI_arrived_7d_ammunition_equipment|0]§! | §G[?CHI_arrived_total_ammunition_equipment|0]§!\nДопоснащение: §Y[?BRA.BRA_CHI_queued_support_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_support_equipment|0]§! | §G[?CHI_arrived_7d_support_equipment|0]§! | §G[?CHI_arrived_total_support_equipment|0]§!\nГрузовики: §Y[?BRA.BRA_CHI_queued_motorized_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_motorized_equipment|0]§! | §G[?CHI_arrived_7d_motorized_equipment|0]§! | §G[?CHI_arrived_total_motorized_equipment|0]§!\nИстребители: §Y[?BRA.BRA_CHI_queued_small_plane_airframe|0]§! | §Y[?BRA.BRA_CHI_in_transit_small_plane_airframe|0]§! | §G[?CHI_arrived_7d_small_plane_airframe|0]§! | §G[?CHI_arrived_total_small_plane_airframe|0]§!\nШтурмовики: §Y[?BRA.BRA_CHI_queued_small_plane_cas_airframe|0]§! | §Y[?BRA.BRA_CHI_in_transit_small_plane_cas_airframe|0]§! | §G[?CHI_arrived_7d_small_plane_cas_airframe|0]§! | §G[?CHI_arrived_total_small_plane_cas_airframe|0]§!\nЛёгкие бомбардировщики: §Y[?BRA.BRA_CHI_queued_small_plane_tactical_bomber_airframe|0]§! | §Y[?BRA.BRA_CHI_in_transit_small_plane_tactical_bomber_airframe|0]§! | §G[?CHI_arrived_7d_small_plane_tactical_bomber_airframe|0]§! | §G[?CHI_arrived_total_small_plane_tactical_bomber_airframe|0]§!"
