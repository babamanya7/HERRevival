week|0]§! | §G[?CHI.CHI_western_import_capacity|0]§! | §Y[?CHI.CHI_western_import_load_percent|0]%§!\nИз Китая: §Y[?CHI.CHI_western_export_allocation|0]§! | §Y[?CHI.CHI_western_export_used_last_week|0]§! | §G[?CHI.CHI_western_export_capacity|0]§! | §Y[?CHI.CHI_western_export_load_percent|0]%§!\n\n§YПоставки вооружения§!\n§LТип груза — Очередь | В пути | За 7 дней | Всего§!\nВинтовки: §Y[?BRA.BRA_CHI_queued_infantry_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_infantry_equipment|0]§! | §G[?CHI.CHI_arrived_7d_infantry_equipment|0]§! | §G[?CHI.CHI_arrived_total_infantry_equipment|0]§!\nПулемёты: §Y[?BRA.BRA_CHI_queued_machinegun|0]§! | §Y[?BRA.BRA_CHI_in_transit_machinegun|0]§! | §G[?CHI.CHI_arrived_7d_machinegun|0]§! | §G[?CHI.CHI_arrived_total_machinegun|0]§!\nМиномёты: §Y[?BRA.BRA_CHI_queued_mortar|0]§! | §Y[?BRA.BRA_CHI_in_transit_mortar|0]§! | §G[?CHI.CHI_arrived_7d_mortar|0]§! | §G[?CHI.CHI_arrived_total_mortar|0]§!\nРучные ПТ: §Y[?BRA.BRA_CHI_queued_antitank|0]§! | §Y[?BRA.BRA_CHI_in_transit_antitank|0]§! | §G[?CHI.CHI_arrived_7d_antitank|0]§! | §G[?CHI.CHI_arrived_total_antitank|0]§!\nПолевая артиллерия: §Y[?BRA.BRA_CHI_queued_artillery_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_artillery_equipment|0]§! | §G[?CHI.CHI_arrived_7d_artillery_equipment|0]§! | §G[?CHI.CHI_arrived_total_artillery_equipment|0]§!\nТяжёлая артиллерия: §Y[?BRA.BRA_CHI_queued_heavy_artillery_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_heavy_artillery_equipment|0]§! | §G[?CHI.CHI_arrived_7d_heavy_artillery_equipment|0]§! | §G[?CHI.CHI_arrived_total_heavy_artillery_equipment|0]§!\nПТО: §Y[?BRA.BRA_CHI_queued_anti_tank_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_anti_tank_equipment|0]§! | §G[?CHI.CHI_arrived_7d_anti_tank_equipment|0]§! | §G[?CHI.CHI_arrived_total_anti_tank_equipment|0]§!\nПВО: §Y[?BRA.BRA_CHI_queued_anti_air_equipment|0]§! | §Y[?BRA.BRA_CHI_in_transit_anti_air_equipment|0]§! | §G[?CHI.CHI_arrived_7d_anti_air_equipment|0]§! | §G[?CHI.CHI_arrived_total_anti_air_equipment|0]§!\n