l_russian:
 CHI_foreign_aid: "Иностранная помощь Китаю"
 CHI_foreign_aid_desc: "Иностранные кредиты и вооружение поддерживают китайское сопротивление, но каждый контракт проходит §Y14 дней§! подготовки на складе и ещё §Y7 дней§! в пути после отправки.\n\n§YФинансы и экспорт§!\nАмериканский кредит: §Y[?CHI_usa_credit_balance|0]§!\nВольфрамовый долг: §Y[?CHI_usa_tungsten_debt|0]§!\nВольфрам на китайском складе: §Y[?left_tungsten|0]§!\nОтправлено вольфрама за сутки: §G[?CHI_tungsten_exported_last_day|0]§!\n\n§YМаршруты§!\nМорские порты: §Y[?CHI_sea_route_capacity|0]§!; Индокитай: §Y[?CHI_hanoi_route_capacity|0]§!; Бирма: §Y[?CHI_burma_route_capacity|0]§!; Гималаи: §Y[?CHI_hump_route_capacity|0]§!; Ледо: §Y[?CHI_ledo_route_capacity|0]§!\nВсего: §Y[?CHI_western_route_capacity|0]§!; на ввоз: §Y[?CHI_western_import_allocation|0]§!; на вывоз: §Y[?CHI_western_export_allocation|0]§!\n\n§YГотово на складе / в пути§!\nПехотное снаряжение: §Y[?BRA.BRA_CHI_pending_infantry_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_infantry_equipment|0]§!; винтовок отправлено сегодня: §G[?CHI_infantry_cargo_dispatched_last_day|0]§!\nПолевая артиллерия: §Y[?BRA.BRA_CHI_pending_artillery_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_artillery_equipment|0]§!; орудий отправлено: §G[?CHI_artillery_cargo_dispatched_last_day|0]§!\nБоеприпасы: §Y[?BRA.BRA_CHI_pending_ammunition_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_ammunition_equipment|0]§!; отправлено: §G[?CHI_ammunition_dispatched_last_day|0]§!\nДопоснащение: §Y[?BRA.BRA_CHI_pending_support_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_support_equipment|0]§!; отправлено: §G[?CHI_support_dispatched_last_day|0]§!\nГрузовики: §Y[?BRA.BRA_CHI_pending_motorized_equipment|0]§! / §Y[?BRA.BRA_CHI_in_transit_motorized_equipment|0]§!; отправлено: §G[?CHI_trucks_dispatched_last_day|0]§!\nИстребители: §Y[?BRA.BRA_CHI_pending_small_plane_airframe|0]§! / §Y[?BRA.BRA_CHI_in_transit_small_plane_airframe|0]§!; отправлено: §G[?CHI_fighters_dispatched_last_day|0]§!\nШтурмовики: §Y[?BRA.BRA_CHI_pending_small_plane_cas_airframe|0]§! / §Y[?BRA.BRA_CHI_in_transit_small_plane_cas_airframe|0]§!; отправлено: §G[?CHI_cas_dispatched_last_day|0]§!\nЛёгкие бомбардировщики: §Y[?BRA.BRA_CHI_pending_small_plane_tactical_bomber_airframe|0]§! / §Y[?BRA.BRA_CHI_in_transit_small_plane_tactical_bomber_airframe|0]§!; отправлено: §G[?CHI_tactical_bombers_dispatched_last_day|0]§!"
 USA_CHI_foreign_aid: "Американская поддержка Китая"
 USA_CHI_foreign_aid_desc: "Соединённые Штаты могут предложить Китаю конкретные контракты в пределах открытой кредитной линии или самостоятельно выделить экстренную помощь. Принятое вооружение поступает на западный транзитный склад и не телепортируется напрямую в Китай.\n\nКредит Китая: §Y[?CHI.CHI_usa_credit_balance|0]§!\nВольфрамовый долг Китая: §Y[?CHI.CHI_usa_tungsten_debt|0]§!\nПропускная способность маршрутов: §Y[?CHI.CHI_western_route_capacity|0]§!\n\nНа транзитном складе:\nвинтовки — §Y[?BRA.BRA_CHI_pending_infantry_equipment|0]§!; артиллерия — §Y[?BRA.BRA_CHI_pending_artillery_equipment|0]§!; грузовики — §Y[?BRA.BRA_CHI_pending_motorized_equipment|0]§!; самолёты — §Y[?BRA.BRA_CHI_pending_small_plane_airframe|0]§!"
 CHI_request_american_tungsten_credit: "Запросить американский вольфрамовый кредит"
 CHI_request_american_tungsten_credit_desc: "Предложить Соединённым Штатам товарный кредит, обеспеченный будущими поставками китайского вольфрама."
 CHI_request_american_rifles: "Запросить американское стрелковое вооружение"
 CHI_request_american_rifles_desc: "Запросить пехотный пакет: §Y5 000§! винтовок, §Y2 400§! пулемётов, §Y800§! миномётов и §Y700§! ручных противотанковых средств за §Y50 000§! кредита. Гранаты входят в абстракцию стрелкового вооружения."
 CHI_request_american_artillery: "Запросить американскую артиллерию"
 CHI_request_american_artillery_desc: "Запросить §Y240§! полевых, §Y80§! тяжёлых, §Y120§! противотанковых и §Y120§! зенитных орудий за §Y60 000§! кредита."
 CHI_request_american_ammunition: "Запросить американские боеприпасы"
 CHI_request_american_ammunition_desc: "Запросить §Y10 000§! единиц боеприпасов за §Y40 000§! кредита."
 CHI_request_american_support_equipment: "Запросить дополнительное оснащение"
 CHI_request_american_support_equipment_desc: "Запросить §Y1 000§! единиц дополнительного оснащения за §Y30 000§! кредита."
 CHI_request_american_trucks: "Запросить американские грузовики"
 CHI_request_american_trucks_desc: "Запросить поставку §Y1 000§! грузовиков за §Y40 000§! единиц кредита."
 CHI_request_american_aircraft: "Запросить крыло истребителей"
 CHI_request_american_aircraft_desc: "Запросить §Y40§! истребителей — одно авиакрыло — за §Y40 000§! кредита."
 CHI_request_american_cas: "Запросить крыло штурмовиков"
 CHI_request_american_cas_desc: "Запросить §Y40§! штурмовиков за §Y48 000§! кредита."
 CHI_request_american_tactical_bombers: "Запросить крыло лёгких бомбардировщиков"
 CHI_request_american_tactical_bombers_desc: "Запросить §Y40§! лёгких тактических бомбардировщиков за §Y60 000§! кредита."
 CHI_expand_the_burma_road: "Расширение Бирманской дороги"
 CHI_expand_the_burma_road_desc: "За 120 дней расширить дорожную сеть и увеличить пропускную способность Бирманской дороги на §G500§! единиц в сутки. Максимум улучшений: §Y5§!."
 CHI_expand_the_airlift: "Усиление воздушного транспорта над Гималаями"
 CHI_expand_the_airlift_desc: "За 120 дней расширить аэродромы и транспортную службу, увеличив входящую пропускную способность воздушного моста на §G500§! единиц в сутки. Воздушный мост не используется для вывоза вольфрама."
 CHI_expand_the_ledo_road: "Расширение дороги Ледо"
 CHI_expand_the_ledo_road_desc: "За 120 дней увеличить пропускную способность дороги Ледо на §G500§! единиц в сутки. Максимум улучшений: §Y5§!."
 CHI_prioritize_military_cargo: "Приоритет военным грузам"
 CHI_prioritize_military_cargo_desc: "Направить 80% пропускной способности западных маршрутов на ввоз вооружения и 20% — на вывоз вольфрама."
 CHI_balance_foreign_cargo: "Сбалансировать перевозки"
 CHI_balance_foreign_cargo_desc: "Направить 60% пропускной способности западных маршрутов на ввоз вооружения и 40% — на вывоз вольфрама."
 CHI_prioritize_credit_repayment: "Приоритет обслуживанию кредита"
 CHI_prioritize_credit_repayment_desc: "Направить 40% пропускной способности западных маршрутов на ввоз вооружения и 60% — на вывоз вольфрама."
 USA_offer_china_rifle_contract: "Предложить контракт на стрелковое вооружение"
 USA_offer_china_rifle_contract_desc: "Предложить Китаю полный пехотный пакет: §Y5 000§! винтовок, §Y2 400§! пулемётов, §Y800§! миномётов и §Y700§! ручных ПТ-средств за §Y50 000§! кредита."
 USA_offer_china_artillery_contract: "Предложить контракт на артиллерию"
 USA_offer_china_artillery_contract_desc: "Предложить Китаю §Y240§! полевых, §Y80§! тяжёлых, §Y120§! противотанковых и §Y120§! зенитных орудий за §Y60 000§! кредита."
 USA_offer_china_ammunition_contract: "Предложить контракт на боеприпасы"
 USA_offer_china_ammunition_contract_desc: "Предложить §Y10 000§! единиц боеприпасов за §Y40 000§! кредита."
 USA_offer_china_support_contract: "Предложить контракт на дополнительное оснащение"
 USA_offer_china_support_contract_desc: "Предложить §Y1 000§! единиц дополнительного оснащения за §Y30 000§! кредита."
 USA_offer_china_truck_contract: "Предложить контракт на грузовики"
 USA_offer_china_truck_contract_desc: "Предложить Китаю приобрести §Y1 000§! грузовиков за §Y40 000§! единиц кредита."
 USA_offer_china_fighter_contract: "Предложить контракт на истребители"
 USA_offer_china_fighter_contract_desc: "Предложить Китаю одно авиакрыло из §Y40§! истребителей за §Y40 000§! кредита."
 USA_offer_china_cas_contract: "Предложить контракт на штурмовики"
 USA_offer_china_cas_contract_desc: "Предложить авиакрыло из §Y40§! штурмовиков за §Y48 000§! кредита."
 USA_offer_china_tactical_bomber_contract: "Предложить контракт на лёгкие бомбардировщики"
 USA_offer_china_tactical_bomber_contract_desc: "Предложить авиакрыло из §Y40§! лёгких тактических бомбардировщиков за §Y60 000§! кредита."
 USA_emergency_arms_for_china: "Экстренная военная помощь Китаю"
 USA_emergency_arms_for_china_desc: "Безвозмездно направить полный пехотный пакет: §Y5 000§! винтовок, §Y2 400§! пулемётов, §Y800§! миномётов и §Y700§! ручных ПТ-средств."
 ENG_emergency_arms_for_china: "Британская военная помощь Китаю"
 ENG_emergency_arms_for_china_desc: "Безвозмездно направить через общий западный склад полный пехотный пакет. Подготовка груза занимает 14 дней."
 USA_finance_burma_road_expansion: "Финансировать расширение Бирманской дороги"
 USA_finance_burma_road_expansion_desc: "Оплатить расширение бирманского маршрута. Через 120 дней его суточная пропускная способность увеличится на §G500§!."
 USA_expand_hump_airlift: "Расширить воздушный мост через Гималаи"
 USA_expand_hump_airlift_desc: "Выделить транспортные и промышленные мощности для воздушного моста. Через 120 дней его входящая пропускная способность увеличится на §G500§!."
 her_chi_aid.1.t: "Китай запрашивает товарный кредит"
 her_chi_aid.1.d: "Правительство Китая предлагает обеспечить американский кредит будущими поставками стратегически важного вольфрама. Сохранение открытых путей через китайские порты, Индокитай и Бирму будет необходимо как для поставок вооружения, так и для погашения обязательств."
 her_chi_aid.1.a: "Одобрить кредит"
 her_chi_aid.1.b: "Отказать Китаю"
 her_chi_aid.2.t: "Американский кредит одобрен"
 her_chi_aid.2.d: "Соединённые Штаты открыли кредитную линию для закупки вооружения. Китай обязался погасить её поставками вольфрама."
 her_chi_aid.2.a: "Это укрепит сопротивление"
 her_chi_aid.3.t: "Американцы отказали в кредите"
 her_chi_aid.3.d: "Правительство Соединённых Штатов отказалось принять китайское предложение."
 her_chi_aid.3.a: "Прискорбно"
 her_chi_aid.contract_accept: "Принять американское предложение"
 her_chi_aid.contract_refuse: "Отказаться от контракта"
 her_chi_aid.4.t: "Американское стрелковое вооружение"
 her_chi_aid.4.d: "Соединённые Штаты предлагают полный пехотный пакет за 50 000 единиц кредита: винтовки, пулемёты, миномёты и ручные противотанковые средства."
 her_chi_aid.5.t: "Американская артиллерия"
 her_chi_aid.5.d: "Соединённые Штаты предлагают смешанный пакет полевой, тяжёлой, противотанковой и зенитной артиллерии за 60 000 единиц кредита."
 her_chi_aid.6.t: "Американские грузовики"
 her_chi_aid.6.d: "Соединённые Штаты предлагают поставить 1 000 грузовиков за 40 000 единиц кредита."
 her_chi_aid.7.t: "Американские истребители"
 her_chi_aid.7.d: "Соединённые Штаты предлагают поставить одно авиакрыло из 40 истребителей за 40 000 единиц кредита."
 her_chi_aid.request_approve: "Одобрить китайский запрос"
 her_chi_aid.request_refuse: "Отказать Китаю"
 her_chi_aid.8.t: "Китай запрашивает стрелковое вооружение"
 her_chi_aid.8.d: "Китайское правительство запрашивает полный пехотный пакет за 50 000 единиц кредита. Подготовка одобренного груза займёт 14 дней."
 her_chi_aid.9.t: "Китай запрашивает артиллерию"
 her_chi_aid.9.d: "Китайское правительство запрашивает смешанный пакет полевой, тяжёлой, противотанковой и зенитной артиллерии за 60 000 единиц кредита."
 her_chi_aid.10.t: "Китай запрашивает грузовики"
 her_chi_aid.10.d: "Китайское правительство просит продать ему 1 000 грузовиков за 40 000 единиц кредита."
 her_chi_aid.11.t: "Китай запрашивает истребители"
 her_chi_aid.11.d: "Китайское правительство просит продать одно авиакрыло из 40 истребителей за 40 000 единиц кредита."
 her_chi_aid.12.t: "Американцы одобрили запрос"
 her_chi_aid.12.d: "Американское правительство одобрило наш последний запрос. Стоимость контракта списана с кредитного счёта, а оборудование направлено на транзитный склад."
 her_chi_aid.12.a: "Ожидаем прибытия груза"
 her_chi_aid.13.t: "Американцы отказали в поставке"
 her_chi_aid.13.d: "Американское правительство отклонило наш последний запрос. Средства с кредитного счёта не списывались."
 her_chi_aid.13.a: "Придётся искать другие возможности"
 her_chi_aid.14.t: "Китай запрашивает боеприпасы"
 her_chi_aid.14.d: "Китай просит продать 10 000 единиц боеприпасов за 40 000 единиц кредита."
 her_chi_aid.15.t: "Китай запрашивает дополнительное оснащение"
 her_chi_aid.15.d: "Китай просит продать 1 000 единиц дополнительного оснащения за 30 000 единиц кредита."
 her_chi_aid.16.t: "Китай запрашивает штурмовики"
 her_chi_aid.16.d: "Китай просит продать авиакрыло из 40 штурмовиков за 48 000 единиц кредита."
 her_chi_aid.17.t: "Китай запрашивает лёгкие бомбардировщики"
 her_chi_aid.17.d: "Китай просит продать авиакрыло из 40 лёгких тактических бомбардировщиков за 60 000 единиц кредита."
 her_chi_aid.18.t: "Американский контракт на боеприпасы"
 her_chi_aid.18.d: "Соединённые Штаты предлагают 10 000 единиц боеприпасов за 40 000 единиц кредита."
 her_chi_aid.19.t: "Американское дополнительное оснащение"
 her_chi_aid.19.d: "Соединённые Штаты предлагают 1 000 единиц дополнительного оснащения за 30 000 единиц кредита."
 her_chi_aid.20.t: "Американские штурмовики"
 her_chi_aid.20.d: "Соединённые Штаты предлагают авиакрыло из 40 штурмовиков за 48 000 единиц кредита."
 her_chi_aid.21.t: "Американские лёгкие бомбардировщики"
 her_chi_aid.21.d: "Соединённые Штаты предлагают авиакрыло из 40 лёгких тактических бомбардировщиков за 60 000 единиц кредита."
