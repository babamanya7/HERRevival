l_russian:
 PRODUCTION_MATERIALS_COAL:0 "Уголь"
 coal_desc:0 "Уголь является горючим и крупнейшим источником производства электроэнергии, а также важным компонентом в процессе производства стали."
 PRODUCTION_MATERIALS_IRON:0 "Железо"
 iron_desc:0 "Металлическое железо имеет решающее значение при производстве стали, чугуна и других сплавов."
 PRODUCTION_MATERIALS_BAUXITE:0 "Бокситы"
 bauxite_desc:0 "Бокситы - это руда, необходимая для производства алюминия."

 arms_factory_desc:0 "Это сооружение снабжает регион новой военной техникой. При необходимости его можно превратить в завод по выпуску мирной продукции."
 
 industrial_complex_desc:0 "Это сооружение снабжает регион товарами народного потребления и позволяет строить новые сооружения. При необходимости его можно превратить в завод по выпуску военной продукции. §Y(ПОТРЕБЛЯЕТ §!§R20 СТАЛИ)§!\n"
 
 steel_refinery:0 "Сталелитейный завод"
 steel_refinery_plural:0 "Сталелитейные заводы"
 steel_refinery_desc:0 "Сталелитейный завод – это промышленное предприятие по производству и разливке стали. §Y(ПОТРЕБЛЯЕТ §!§R30 УГЛЯ§Y И §!§R30 ЖЕЛЕЗА§!§Y)§!\n"
 aluminium_refinery:0 "Алюминиевый завод"
 aluminium_refinery_plural:0 "Алюминиевые заводы"
 aluminium_refinery_desc:0 "Выплавка алюминия — это процесс извлечения алюминия из его оксида, глинозема, как правило, с помощью процесса Холла-Эру. §Y(ПОТРЕБЛЯЕТ §!§R30 УГЛЯ§!§Y И §!§R30 БОКСИТОВ§!§Y)§!\n"
 hydro_steel_refinery:0 "Сталелитейный завод с гидроприводом"
 hydro_steel_refinery_plural:0 "Сталелитейные заводы с гидроприводом"
 hydro_steel_refinery_desc:0 "Производство стали удешевляется за счет гидроэлектростанции. Однако она требует больших первоначальных инвестиций в виде стоимости строительства. §Y(ПОТРЕБЛЯЕТ §!§R10 УГЛЯ§Y И §!§R30 ЖЕЛЕЗА§! §Y)§!\n"
 hydro_aluminium_refinery:0 "Алюминиевый завод с гидроприводом"
 hydro_aluminium_refinery_plural:0 "Алюминиевые заводы с гидроприводом"
 hydro_aluminium_refinery_desc:0 "Выплавка алюминия удешевляется за счет гидроэлектростанции. Однако она требует больших первоначальных инвестиций в виде стоимости строительства. §Y(ПОТРЕБЛЯЕТ §!§R30 БОКСИТОВ§!§Y)§!\n"
 
 steel_refinery_inactive:0 "Сталелитейный завод (неактивен)"
 steel_refinery_inactive_plural:0 "Сталелитейные заводы (неактивные)"
 steel_refinery_inactive_desc:0 "Этот сталелитейный завод неактивен из-за нехватки сырья. Будет повторно активирован автоматически, если будет обеспечено достаточно сырья."
 aluminium_refinery_inactive:0 "Алюминиевый завод (неактивный)"
 aluminium_refinery_inactive_plural:0 "Алюминиевые заводы (неактивные)"
 aluminium_refinery_inactive_desc:0 "Этот алюминиевый завод неактивен из-за нехватки сырья. Будет повторно активирован автоматически, если будет обеспечено достаточно сырья."
 hydro_steel_refinery_inactive:0 "Гидросталеплавильный завод (неактивно)"
 hydro_steel_refinery_inactive_plural:0 "Гидросталелитейные заводы (неактивные)"
 hydro_steel_refinery_inactive_desc:0 "Этот гидросталелитейный завод не работает из-за нехватки сырья. Будет повторно активирован автоматически, если будет обеспечено достаточно сырья."
 hydro_aluminium_refinery_inactive:0 "Гидроалюминиевый завод (неактивный)"
 hydro_aluminium_refinery_inactive_plural:0 "Гидроалюминиевые заводы (неактивные)"
 hydro_aluminium_refinery_inactive_desc:0 "Этот гидроалюминиевый завод неактивен из-за нехватки сырья. Будет повторно активирован автоматически, если будет обеспечено достаточно сырья."
 synthetic_refinery_inactive:0 "Нефтеперерабатывающий завод (неактивный)"
 synthetic_refinery_inactive_plural:0 "Нефтеперерабатывающие заводы (неактивные)"
 synthetic_refinery_inactive_desc:0 "Этот нефтеперерабатывающий завод неактивен из-за нехватки сырья. Может быть повторно активирован по решению, если будет предоставлено достаточно сырья."

 modifier_production_speed_hydro_aluminium_refinery_factor:0 "§YАлюминиевый завод с гидроприводом§! скорость строительства"
