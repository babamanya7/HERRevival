    ITA_war_speech:0 "Речь «Жребий брошен»"
    ITA_war_speech_desc:0 "'Бойцы на суше, на море и в воздухе, мужчины и женщины Италии и империи, слушайте! Час, предначертанный нам судьбой, пробьёт для нас. Час бесповоротного решения настал. Объявление войны уже объявлено. Мы победим, чтобы наконец даровать новый мир, мир и справедливость Италии, Европе и вселенной. Итальянский народ, хватайтесь за оружие и покажите свою стойкость, своё мужество, свою доблесть!'"

    ITA_war_speech_tt:1 "£faction_ita_proletariat §YПролетариат§! станет §Gподдерживать§! войну, увеличивая §YПрирост политической власти§! на §G10%§!"

