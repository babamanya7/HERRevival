    GER_west_wall_border_watch_completed:0 "Пограничные укрепления Западного вала построены"

    GER_west_wall_limes_line:0 "Западный вал: программы «Лимес» и «Ахен-Саар»"
    GER_west_wall_limes_line_desc:0 "Западный вал необходимо укрепить, чтобы он был защищен от любых атак со стороны стран Бенилюкса, а также усилить французскую линию обороны."
    GER_west_wall_limes_line_dd:0 "Построит §Y4 уровня бункеров§! в каждой провинции вдоль французско-бельгийской границы от Мозельланда до Бадена.\n"
