    GER_internal_factions_desc:1 "СС и Вермахт соперничают за господство в немецкой армии, и оба не потерпят параллельной командной структуры, нам придется осторожно ориентироваться, чтобы предотвратить враждебные действия, или просто выбрать одну сторону и очистить другую. Немецкий народ жаждет, чтобы Германия обрела свой законный статус великой державы, и с помощью промышленников мы можем сделать это реальностью.\n\n"
    
