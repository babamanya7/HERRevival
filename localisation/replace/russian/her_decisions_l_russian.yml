    SS_himmler_speer_agreement:0 "Соглашение Гиммлера-Шпеера"
    SS_himmler_speer_agreement_desc:0 "В 1942 году, после назначения Альберта Шпеера, Гиммлер предложил, чтобы от 5% до 8% военного производства Германии было перенаправлено Ваффен-СС в обмен на лояльных рабочих СС для промышленности Германии. Выполнение этого решения приведет к появлению новых юнитов СС с 3/30/60% бесплатным снаряжением в зависимости от выбранного варианта."

