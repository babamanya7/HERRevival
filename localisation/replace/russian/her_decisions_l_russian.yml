    USA_power_projection:0 "Тихоокеанская проекция силы"
    USA_power_projection_desc:0 "Мы должны переместить наш штаб Тихоокеанского флота в Перл-Харбор, на Гавайи, чтобы улучшить нашу проекцию силы через Тихий океан. Без него японское эмбарго невозможно.\n\nРазместите Тихоокеанский флот, состоящий как минимум из §Y8 линкоров§!, §Y8 крейсеров§! и §Y30 эсминцев§! в Перл-Харборе, Гавайи, чтобы дать отпор японским провокациям."  
    USA_power_projection_tt:0 "§RМы не сможем ввести эмбарго на Японию!"
    USA_power_projection_fail:0 "Тихоокеанская проекция силы"
    USA_embargo_japan_tt:0 "Имейте адекватную проекцию силы через Тихий океан через Тихоокеанский флот в Перл-Харборе."

    JAP_pearl_harbor:0 "Окно возможностей в Перл-Харборе"
    JAP_pearl_harbor_desc:0 "Нам представилась уникальная возможность атаковать сгруппированный Тихоокеанский флот Соединенных Штатов в Перл-Харборе. Если мы нанесем скоординированный удар в Перл-Харборе, то сможем вывести из строя значительную часть их военно-морской мощи. Если мы будем ждать слишком долго, мы упустим наш единственный шанс. Мы должны объявить войну и атаковать Перл-Харбор в течение полу года, пока американцы не готовы."
    JAP_pearl_harbor_tt:0 "§RМы потеряем элемент неожиданности, а вместе с ним и возможность быстрой войны!§!"

