    ITA_bonifica_integrale_tt:0 "£faction_ita_proletariat  §YПролетариат§! станет более §GДружелюбным§!, увеличивая £stability_texticon  §YСтабильность§! на §G+5.00%§!."

    ITA_cooperate_with_moderates_tt:0 "£faction_ita_bourgeoisie  §YБуржуазия§! станет более §GДружелюбной§! и §GВлиятельной§!, увеличивая £stability_texticon  §YСтабильность§! на §G+5.00%§! и £political_power_texticon  §YПрирост политической власти§! на §G+0.10§!"




    JAP_internal_factions:0 "Внутренние Фракции"
    JAP_internal_factions_desc:1 "Япония получает выгоду от лояльного населения, готового выполнять любые приказы Императора. Однако различные военные группировки Японии ведут ожесточенное соперничество, которое приносит больше вреда, чем пользы. Дзайбацу крепко контролируют экономику и открыты для нашего Влияния, чтобы компенсировать наши стратегические слабости..\n\n"
    
