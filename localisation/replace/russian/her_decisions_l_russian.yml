    GER_me262_1943:0 "£faction_ger_industrialists Первый реактивный самолёт"
    GER_me262_1943_desc:0 "Наша реактивная техника далеко продвинулась вперед, и мы уже проектируем наш первый реактивный истребитель. Потребуется много политических маневров и благосклонности, чтобы подтолкнуть люфтваффе к внедрению этой неизвестной технологии"

    GER_reopen_trade_with_sweden:0 "Возобновить торговлю со Швецией"
