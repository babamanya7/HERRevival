    ENG_the_kings_speech:0 "Речь короля"
    ENG_the_kings_speech_desc:0 "'В этот роковой час, возможно, самый судьбоносный в нашей истории, во второй раз в жизни большинства из нас мы находимся в состоянии войны. Снова и снова мы пытались найти мирный выход из разногласий между нами и теми, кто теперь является нашими врагами. Но все было тщетно. Задача будет сложной. Впереди могут быть мрачные дни, и война больше не ограничивается полем боя.'"
    ENG_the_kings_speech_tt:0 "£faction_eng_british_royalists Роялисты, £faction_eng_conservative §YКонсерваторы§! и £faction_eng_labour §YРабочие§! станут более §GДружелюбными§!"

