    USA_internal_factions_desc:1 "Великая депрессия увеличила политическую напряженность в США. Несмотря на то, что они финансировал его первые выборы, промышленные титаны все больше расходятся с Рузвельтом, поскольку он обслуживает народ. Однако он не может позволить себе полностью потерять их поддержку, так как их промышленная база может понадобиться, если Соединенные Штаты будут втянуты в новую войну....\n\n"

