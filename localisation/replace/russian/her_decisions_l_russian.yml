    ENG_British_Royalists_influence_2_tt:0 "£faction_eng_british_royalists Роялисты станут §GБолее влиятельными§!\n"
    ENG_British_Royalists_influence_3_tt:0 "£faction_eng_british_royalists Роялисты станут §GБолее влиятельными§! и увеличат §YПрирост политической власти§! на §G5%§!\n"
    ENG_British_Royalists_stability:0 "£faction_eng_british_royalists Роялисты увеличат §YСтабильность§! на §G5%§!\n"

