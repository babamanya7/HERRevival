    GER_danzig_speech:0 "Речь 'Данциг останется немецким'"
    GER_danzig_speech_desc:0 "«Дорогие мои жители Данцига, не только вы переживаете этот момент с глубочайшим волнением; более того, вся немецкая нация разделяет его с вами, и я тоже осознаю величие этого часа, когда впервые ступаю на землю, которую пять веков назад занимали немецкие поселенцы, которая на протяжении пяти веков была немецкой и которая, можете быть уверены, останется немецкой»."
    GER_fall_of_france_speech:0 "Речь 'Версаль отомщен'"
    GER_fall_of_france_speech_desc:0 "«Теперь, когда мы разгромили французов, они почувствуют, что происходит, когда пытаешься подавить немецкий народ! Они будут платить нашим войскам, которых мы оставляем охранять и защищать эту землю!»"
    GER_total_war_speech:0 "Речь 'Тотальная война'"
    GER_total_war_speech_desc:0 "«Верите ли вы вместе с фюрером и нами в окончательную полную победу немецкого народа? Готовы ли вы и немецкий народ работать, если фюрер прикажет, по 10, 12, а если необходимо, и 14 часов в день и отдать всё ради победы? Хотите ли вы тотальной войны? Если потребуется, хотите ли вы войны более тотальной и радикальной, чем всё, что мы можем себе представить сегодня?»"

    GER_west_wall_border_watch:0 "Западный вал: программа «Пограничник»"
