  news.401.t: "Падение Будапешта"
  news.401.desc: "Из города Будапешт нам поступают донесения: Венгерская столица захвачена наступающими Советскими войсками.\n\nВ ходе боев значительная часть городской застройки оказалась разрушена до основания. Местное ополчение еще пытается вести безнадежные стычки с красной армией.\n\nНад Будайской крепостью развевается советское знамя, а значительное количество венгерских политиков попало в плен. Неужели после падения последнего союзника Гитлера, Третий Рейх вскоре перестанет существовать?"
  news.401.a: "Это серьезный поворот."
  news.401.b: "Родина запомнит нашу победу!"
  news.401.c: "Конец ближе, чем казалось"

  her_romania.1.t: "Антонеску требует отречения Кароля II"
  her_romania.1.d: "Уже на следующий день после назначения премьер-министром «национального легионерского правительства» Антонеску потребовал от Кароля II отречься от престола в пользу его сына, Михая I. Выполнив это требование, король Кароль II покинет страну. Михай I, которому сейчас 18 лет, формально сохранит королевскую власть, но фактически лишится всех полномочий."
  her_romania.1.a: "Это к лучшему"

  her_romania.3.t: "Попытка государственного переворота"
  her_romania.3.d: "Железная гвардия два дня назад организовала еврейские погромы направленные непосредственно на евреев и на правительство Антонеску, в Бухаресте завязались уличные бои. После двух дней боев полиция Румынии и армия одержали вверх над восставшими. По примерным данным в сумме погибло одна тысяча человек. Лидеры Железной Гвардии сбежали в Германию."
  her_romania.3.a: "Добейте выживших"

  her_romania.2.t: "Казнь Корнелиу Зеля Кодряну"
  her_romania.2.d: "Сегодня по приказу Короля Кароля II, был казнен Корнелиу Зеля Кодряну, весьма популярный в народе лидер движения "Железная Гвардия". Общество осталось недовольным решением короля"
  her_romania.2.a: "Что творит король..."

  news.153.t: "Германия Нападает на СССР"
  news.153.d: "Сегодня, 22 Июня. Германские войска пересекли государственную границу СССР во всех местах. Гитлер произнес речь перед немецким народом о слабости СССР. Сообщают о серьезных потерях в рядах Красной Армии. До начала боевых действий немецкие самолеты нанесли удар по советским аэродромам. К советскому народу обратился диктор Левитан: "Граждане и гражданки Советского Союза, сегодня в 4 часа утра без объявления войны, германские вооруженные силы атаковали границы Советского Союза. Началась Великая Отечественная война."
  news.153.a: "Доверие между гигантами — вещь хрупкая."
  news.153.b: "Мы подписали это, только чтобы выиграть время для нападения."
  news.153.c: "Договор для фашистов — это просто бумажка."

  guards_recruitment_event.1.t: "Формирование Гвардейских дивизий"
  guards_recruitment_event.1.desc: "Верховный сформировал новые гвардейские дивизии, ура!"
  guards_recruitment_event.1.a: "Принято к сведению"

  news.322.t: "Переворот в Румынии"
  news.322.desc: "В Румынии произошел переворот организованный и проведённый королём страны Михаем I и оппозиционными маршалу Иону Антонеску партиями.  В 16:30 Антонеску прибыл в королевский дворец. В жёлтом салоне дворца его ожидали Сэнэтеску и Михай I. Михай I предложил Антонеску прекратить войну и подписать перемирие с Советским Союзом. Кондукэтор  отказался. После этих слов Михай I покинул жёлтый салон, а Антонеску был арестован королевской охраной. Новым премьер-министром и фактическим руководителем страны стал Константин Сэнэтеску. После чего Румыния объявила войну Германии."
  news.322.a: "Это к лучшему."
  news.322.b: "Он... хотя бы скромнее."

  generic.26.t: "[From.GetName] подорвался на мине"
  generic.26.d: "Генерал [From.GetName] погиб сегодня в результате наезда автомобиля на мину. Он отступал со штабом на машине которая наехала на мину, в результате погиб сам генерал, его адьютант и водитель."

  generic.27.t: "[From.GetName] погиб в авиакатастрофе"
  generic.27.d: "Сегодня пришло известие о том, что генерал [From.GetName], будучи тяжело ранен осколком мины, погиб в авиакатастрофе самолёта, эвакуировавшего его в столицу. Тела погибших были захоронены в братской могиле."

  generic.28.t: "[From.GetName] сгорает в танке"
  generic.28.d: "Сегодня пришло известие о том, что генерал [From.GetName], чтобы воодушевить своих танкистов, двигался в боевых порядках одного из своих соединений. Генерал бросился на своём танке вперёд, ворвался в расположение противника и там сложил голову."

  generic.29.t: "[From.GetName] погиб"
  generic.29.d: "Сегодня в результате боя погиб генерал [From.GetName]. Во время боя он лично руководил своими частями на поля боя в своем танке и был подбит противником. У танка в результате попадания взорвался боекомплект и генерал погиб. От него остался только мундир с медалями"

  generic.30.t: "[From.GetName] погиб"
  generic.30.d: "Генерал [From.GetName], погиб в результате артиллерийского удара по штабу. Снаряд угодил точно в блиндаж в результате чего погиб генерал, радист и еще несколько старших офицеров."

  generic.31.t: "[From.GetName] погиб"
  generic.31.d: "Генерал [From.GetName] был убит во время боя. Командуя войсками непосредственно с передовой он был тяжело ранен снайпером и во время транспортировки в госпиталь он скончался от потери крови"

  generic.32.t: "[From.GetName] погиб"
  generic.32.d: "Генерал [From.GetName] погиб сегодня при случайной детонации снаряда. Во время инспекции на армейский склад произошёл взрыв боеприпаса, когда пожарные команды смогли потушить склад генерала было уже не спасти."

  generic.33.t: "[From.GetName] погиб"
  generic.33.d: "Генерал [From.GetName] погиб в результате съезда машины в канаву. Он отступал вместе со своими войсками, когда его машина съехала в канаву и перевернулась. Генерал погиб, а водитель был тяжело травмирован от удара головой."

  man_armor.801.t:0 "Маньчжоу-Го готовит рейдовые отряды"
  man_armor.801.d:0 "Граница между нами и Маньчжоу-Го всегда была местом стычек и столкновений с тех пор, как Япония выиграла первую китайско-японскую войну. Теперь новое правительство в Маньчжоу-Го организовало бригады, готовые совершать набеги и грабить нашу сельскую местность, если у них появится возможность. Мы должны убедиться, что у нас достаточно войск, чтобы предотвратить это, пока мы не найдем более надежное решение."
  man_armor.801.a:0 "Нам придется держать границу укрепленной"
  MAN_raids_tt:0 "\n§RДержите не менее 25 дивизий (375 тыс. личного состава) на маньчжурской границе§!"

