  lar_ratify_the_stresa_front.5.t:0 "Ратификация фронта Стреза"
  lar_ratify_the_stresa_front.5.desc:1 "Ведется подготовка к подписанию и ратификации Стрезских соглашений, формализующих союз с Италией в обмен на территориальные уступки. Подписывая соглашение, мы соглашаемся перенести территорию Джибути в Восточную Африку. После нескольких месяцев работы дипломатической службы остается только положить чернила на бумагу."
  lar_ratify_the_stresa_front.5.a:1 "Триумф дипломатии [This.GetAdjective]."
  lar_ratify_the_stresa_front.5.b:1 "Это больше не служит нашим интересам."
  lar_ratify_the_stresa_front.6.desc:1 "Пришло время выполнить обещание, которое мы дали правительству [From.GetAdjective]. Теперь, когда Альянс действует, мы обязаны передать Джибути под их контроль."
  lar_ratify_the_stresa_front.6.a:2 "Франция выполняет свои обещания."
  lar_ratify_the_stresa_front.6.b:1 "Ситуация изменилась."
  lar_ratify_the_stresa_front.7.t:0 "[From.GetNameDefCap] отказывается ратифицировать альянс"
  lar_ratify_the_stresa_front.7.desc:1 "Внезапно правительство [From.GetAdjective] решило больше не выполнять свои предыдущие обязательства по ратификации соглашений Стрезы. Все попытки получить объяснение по дипломатическим каналам провалились, а дипломаты [From.GetAdjective], похоже, в равной степени шокированы внезапной сменой сердца."
  lar_ratify_the_stresa_front.7.a:1 "Тёмный день."
  lar_ratify_the_stresa_front.8.desc:1 "[FRA.GetNameDefCap] и [ITA.GetNameDef] уже подписали Stresa Accords и формализовали свой альянс. Теперь настала наша очередь поддержать нашу сделку, подписать Соглашения и передать наши активы в Сомали под контроль [ITA.GetAdjective]."
  lar_ratify_the_stresa_front.8.a:1 "Мы дали слово."
  lar_ratify_the_stresa_front.8.b:1 "Наши интересы разошлись."

  france.37.t:0 "Пакт Лаваля-Риббентропа - французское предложение"
  france.37.d:0 "Сегодня утром министр иностранных дел Франции Пьер Лаваль встретился с министром иностранных дел Германии Риббентропом, чтобы предложить пакт о ненападении между Францией и Германией. Причиной послужила необходимость для обеих стран бороться с настоящим врагом в лице Великобритании. Что мы должны ответить?"
  france.37.a:0 "Звучит хорошо"
  france.37.b:0 "Ни за что"

  france.35.t:0 "Пакт Лаваля-Риббентропа - Германия принимает"
  france.35.d:0 "Сегодня утром министр иностранных дел Франции Пьер Лаваль встретился с министром иностранных дел Германии фон Риббентропом, чтобы предложить пакт о ненападении между Францией и Германией. Причиной послужила необходимость для обеих стран бороться с настоящим врагом в лице Великобритании. После интенсивных переговоров делегация Германии приняла это предложение."
  france.35.a:0 "Отлично!"

  france.36.t:0 "Пакт Лаваля — Риббентропа: Германия отказывает"
  france.36.d:0 "Сегодня утром министр иностранных дел Франции Пьер Лаваль встретился с министром иностранных дел Германии фон Риббентропом, чтобы предложить заключить пакт о ненападении между Францией и Германией. Основанием называлась необходимость совместной борьбы обеих стран против истинного врага — Великобритании. После напряжённых переговоров германская делегация отклонила предложение."
  france.36.a:0 "Merde !"

