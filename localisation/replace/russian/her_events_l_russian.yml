  imperial_federation_fail_tt:0 "§RСоздание Имперской федерации потерпит неудачу.§!"
  mtg_britain.104.b:0 "Без России мы не можем продолжать"

  eng_armor.804.t:0 "Россия требует мира"
  eng_armor.804.d:0 ""
  eng_armor.804.a:0 "Принять мир"
  eng_armor.804.b:0 "Отвергать мир"

  eng_armor.805.t:0 "Великобритания требует от нас ввести эмбарго против Германии"
  eng_armor.805.d:0 "С нарушением Германией нейтралитета Бенилюкса Соединенное Королевство оказывает на нас давление, чтобы помочь остановить немецкую агрессию. Отключив наши поставки ресурсов в Германию, мы надеемся, что они увидят ошибку в своих путях и будут стремиться к миру в Европе. Мы сделаем это, чтобы быть в солидарности с нейтральными странами мира и предотвратить еще одну войну."
  eng_armor.805.a:0 "За мир!"
  eng_armor.805.b:0 "Мы не хотим нарушать наш нейтралитет."

  eng_armor.806.t:0 "Швеция приняла эмбарго"
  eng_armor.806.d:0 "Швеция приняла наше предложение и начала накладывать эмбарго на Германию, мы должны защитить их за эту помощь в военных усилиях."
  eng_armor.806.a:0 "Отличные новости"

  eng_armor.807.t:0 "Швеция отказалась от эмбарго"
  eng_armor.807.d:0 "Шведы отказались, ссылаясь на свой нейтралитет, и продолжают помогать немцам в их военных усилиях против нас. Мы должны принять меры, чтобы остановить это!"
  eng_armor.807.a:0 "Мы должны остановить поток железа любой ценой."

  eng_armor.808.t:0 "Германия возобновляет торговлю"
  eng_armor.808.d:0 "Катастрофическая защита наших скандинавских братьев привела к их уничтожению, и теперь немцы обратились к нам с требованиями возобновить нашу торговлю с ними с угрозой вторжения. Чтобы предотвратить собственную гибель и потерю демократии, у нас нет другого выбора, кроме как уступить их требованиям."
  eng_armor.808.a:0 "Мы неохотно принимаем."
  eng_armor.808.b:0 "Мы не будем поддаваться тиранам!"

  eng_armor.809.t:0 "Швеция открывает торговлю"
  eng_armor.809.d:0 "Шведское правительство выполнило наши договоренности и сняло эмбарго, и железная дорога будет течь."
  eng_armor.809.a:0 "Очень хорошо, мы могли бы пощадить их еще"

  eng_armor.810.t:0 "Швеция отказалась открывать торговлю"
  eng_armor.810.d:0 "Шведы отказались выполнить наши требования и поддержали Британию против нас. Мы поставим их на их место."
  eng_armor.810.a:0 "Дас Айн Бефель!"

  eng_armor.811.t:0 "Шведское эмбарго"
  eng_armor.811.d:0 "Великобритания использовала Норвегию как средство принуждения Швеции прекратить торговлю с нами, мы должны завоевать Норвегию, чтобы заставить шведов возобновить торговлю с нами."
  eng_armor.811.a:0 "Это катастрофа для нашего производства."
  eng_armor.811.b:0 "Мы должны отомстить!"

  eng_armor.812.t:0 "Британское эмбарго - наша страна"
  eng_armor.812.d:0 "Великобритания наложила на нас полное эмбарго после наших недавних политических действий. Многие страны, союзнические под Великобританией, также последовали их декларации. Мы должны искать другие ресурсы, которые нам нужны."
  eng_armor.812.a:0 "Мы потеряли жизненно важных поставщиков ресурсов."

  eng_armor.813.t:0 "[PER.GetName] требует мира"
  eng_armor.813.d:0 "После нашего завоевания большей части Персии [From.GetName] запросил тушение пожара и примет частичную оккупацию страны, пока война в Европе не закончится."
  eng_armor.813.a:0 "Мы разделим Север и Запад"
  eng_armor.813.b:0 "Мы хотим полной оккупации"

  eng_armor.814.t:0 "[ENG.GetName] требует полной капитуляции"
  eng_armor.814.d:0 "После нашего завоевания большей части Персии [From.GetName] запросил тушение пожара и примет частичную оккупацию страны, пока война в Европе не закончится."
  eng_armor.814.a:0 "Мы будем входить в"
  eng_armor.814.b:0 "Эти требования абсурдны!"

  eng_armor.815.t:0 "Эвакуироваться в Канаду?"
  eng_armor.815.d:0 "Мы сталкиваемся с возможностью поражения на нашем материке. Должны ли мы эвакуировать правительство и королевскую семью в Канаду, чтобы обеспечить продолжение нашей борьбы?"
  eng_armor.815.a:0 "Мы вернемся"
  eng_armor.815.b:0 "Мы стоим и умираем в Великобритании."
  population_evacuates_tt:0 "§RОколо миллиона человек эвакуируются в Канаду.§!"

  eng_armor.818.t:0 "Теракт в Северной Ирландии"
  eng_armor.818.d:0 "После нашей оккупации Ирландии фракция-изгой, называющая себя ИРА, начала террористическую атаку в Северной Ирландии в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что ожидает последующих атак, пока они не достигнут своей цели."
  eng_armor.818.e:0 "После последней атаки ИРА вновь атаковала заводы и инфраструктуру в Северной Ирландии. Кажется, что конца не видно, пока мы не вышвырнем их или не удовлетворим их требования."
  eng_armor.818.f:0 "После окончания нашего конфликта с ИРА оставшиеся несогласные попытались напасть на Северную Ирландию, но были остановлены. Радикалы были арестованы, и полиция уверена, что дальнейших нападений ожидать не стоит."
  eng_armor.818.a:0 "Мы должны разобраться с этим."
  eng_armor.818.b:0 "Браво"

  eng_armor.819.t:0 "Теракт в Лондоне"
  eng_armor.819.d:0 "После нашей оккупации Ирландии, фракция-изгой, называющая себя ИРА, начала террористическую атаку в Лондоне в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что ожидает последующих атак, пока они не достигнут своей цели."
  eng_armor.819.e:0 "После последней атаки ИРА вновь атаковала заводы и инфраструктуру в Лондоне. Кажется, что конца не видно, пока мы не вышвырнем их или не удовлетворим их требования."
  eng_armor.819.f:0 "После окончания нашего конфликта с ИРА оставшиеся несогласные попытались атаковать Лондон, но были остановлены. Радикалы были арестованы, и полиция уверена, что дальнейших нападений ожидать не стоит."
  eng_armor.819.a:0 "Это должно закончиться быстро"
  eng_armor.819.b:0 "Браво"

  eng_armor.820.t:0 "Теракт в Бирмингеме"
  eng_armor.820.d:0 "После нашей оккупации Ирландии фракция-изгой, называющая себя ИРА, начала террористическую атаку в Бирмингеме в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что ожидает последующих атак, пока они не достигнут своей цели."
  eng_armor.820.e:0 "После последней атаки ИРА вновь атаковала заводы и инфраструктуру в Бирмингеме. Кажется, что конца не видно, пока мы не вышвырнем их или не удовлетворим их требования."
  eng_armor.820.f:0 "После окончания нашего конфликта с ИРА оставшиеся несогласные попытались атаковать Бирмингем, но были остановлены. Радикалы были арестованы, и полиция уверена, что дальнейших нападений ожидать не стоит."
  eng_armor.820.a:0 "Мы не можем сдаться"
  eng_armor.820.b:0 "Браво"

  eng_armor.821.t:0 "Теракт в Ливерпуле"
  eng_armor.821.d:0 "После нашей оккупации Ирландии фракция-изгой, называющая себя ИРА, начала террористическую атаку в Ливерпуле в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что ожидает последующих атак, пока они не достигнут своей цели."
  eng_armor.821.e:0 "После последней атаки ИРА вновь атаковала заводы и инфраструктуру в Ливерпуле. Кажется, что конца не видно, пока мы не вышвырнем их или не удовлетворим их требования."
  eng_armor.821.f:0 "После окончания нашего конфликта с ИРА оставшиеся несогласные попытались атаковать Ливерпуль, но были остановлены. Радикалы были арестованы, и полиция уверена, что дальнейших нападений ожидать не стоит."
  eng_armor.821.a:0 "У нас кризис в руках"
  eng_armor.821.b:0 "Браво"

  eng_armor.822.t:0 "Теракт в Шеффилде"
  eng_armor.822.d:0 "После нашей оккупации Ирландии фракция-изгой, называющая себя ИРА, начала террористическую атаку в Шеффилде в знак протеста против нашей оккупации Ирландии. Требуя полной независимости от Великобритании, ИРА заявила, что ожидает последующих атак, пока они не достигнут своей цели."
  eng_armor.822.e:0 "После последней атаки ИРА вновь атаковала заводы и инфраструктуру в Шеффилде. Кажется, что конца не видно, пока мы не вышвырнем их или не удовлетворим их требования."
  eng_armor.822.f:0 "После окончания нашего конфликта с ИРА оставшиеся несогласные попытались атаковать Шеффилд, но были остановлены. Радикалы были арестованы, и полиция уверена, что дальнейших нападений ожидать не стоит."
  eng_armor.822.a:0 "Прискорбный поступок"
  eng_armor.822.b:0 "Браво"

  eng_armor.823.t:0 "ИРА нейтрализована"
  eng_armor.823.d:0 "После успешных рейдов по всей Ирландии лидеры ИРА и большинство их сторонников были либо убиты, либо арестованы. Мы надеемся, что это будет конец дальнейших атак."
  eng_armor.823.a:0 "Отличная работа"

  eng_armor.824.t:0 "Отбитая армия"
  eng_armor.824.d:0 "После рейдов по всей Ирландии британская армия стала участвовать в тяжелых боях и партизанской войне со стороны ИРА. К сожалению, руководителям ИРА удалось отступить в новые места, и нам остается мало что показать для наших усилий."
  eng_armor.824.a:0 "Мы получим их в следующий раз."

  eng_armor.825.t:0 "Поставки IRA отслеживаются"
  eng_armor.825.d:0 "Анализ рейдов показал, какое оборудование использовало ИРА, и, отслеживая поставки в Ирландию и из Ирландии, полиция смогла отследить нелегальных поставщиков оружия и арестовать их. Это приближает нас на один шаг к поиску штаб-квартиры ИРА."
  eng_armor.825.a:0 "Хорошая работа"

  eng_armor.826.t:0 "Сотрудников ИРА нашли"
  eng_armor.826.d:0 "Нападения на возможных членов ИРА привели к многочисленным арестам. Следуя выводам из межведомственных переговоров, мы обнаружили различных агентов ИРА, стоящих за планированием некоторых будущих атак, и положили им конец. После нашего предыдущего успеха это сделает руководство более отчаянным и безрассудным."
  eng_armor.826.a:0 "Отличная работа"

  eng_armor.827.t:0 "Лидер ИРА арестован"
  eng_armor.827.d:0 "Отслеживание IRA Атака привела нас к одному из старших членов ИРА. После нашего вмешательства был проведен крупный рейд с участием нескольких отделов полиции и групп спецназа на предполагаемый штаб ИРА. К счастью для нас, это было правильное место, и теперь мы считаем, что ИРА будет нейтрализована."
  eng_armor.827.a:0 "Угроза сохраняется"

  eng_armor.828.t:0 "Лига наций эмбарго нашей страны"
  eng_armor.828.d:0 "Лига наций наложила на нас полное эмбарго после наших недавних политических действий."
  eng_armor.828.a:0 "Мы потеряли жизненно важных поставщиков ресурсов."

  eng_armor.829.t:0 "Лига Наций сняла эмбарго"
  eng_armor.829.d:0 "Лига Наций сняла эмбарго после ослабления напряженности"
  eng_armor.829.a:0 "Они платят, чтобы быть на их стороне."

  eng_armor.830.t:0 "Удаление из Лиги Наций"
  eng_armor.830.d:0 "Лига Наций выгнала нас из своей фракции после наших недавних действий."
  eng_armor.830.a:0 "Мы никогда не нуждались в них в любом случае."

  eng_armor.831.t:0 "Судьба Эфиопии"
  eng_armor.831.d:0 "С освобождением Эфиопского полуострова возникает вопрос о будущем этой земли. Мы можем продолжать наши империалистические пути присоединения земли к нашей империи или восстановления эфиопской автономии и создания дружественного правительства, которое может стать сильным союзником."
  eng_armor.831.a:0 "Восстановление Эфиопии"
  eng_armor.831.b:0 "Приложить землю"
  eng_armor.831.c:0 "Приложить землю"

  eng_armor.832.t:0 "Марш на Кейбл-стрит"
  eng_armor.832.d:0 "БУФ на одном из своих маршей был остановлен на кабельной улице после собрания антифашистов. К сожалению, два столкновения привели к многочисленным травмам и арестам."
  eng_armor.832.a:0 "Это зрелищное событие"
  eng_armor.832.b:0 "Мы должны выступить против них."

  eng_armor.833.t:0 "Марши в Ланкашире"
  eng_armor.833.d:0 "После Катастрофы на Кейбл-стрит BUF привязался к более традиционным ценностям и, в частности, выступал за права женщин. Это резонировало с общественностью и их влиянием, и последующее выросло. Как к этому подойти?"
  eng_armor.833.a:0 "Нам нужно перерезать бутон, пока он не зацвел."
  eng_armor.833.b:0 "Мы можем использовать их"

  eng_armor.834.t:0 "Выборы Лондонского городского совета"
  eng_armor.834.d:0 "Недавние выборы в Лондоне вызвали всплеск новых членов совета от BUF до удивления всех. Так или иначе, нам придется взаимодействовать с этой новой политической фракцией."
  eng_armor.834.a:0 "Чертовы чёрные рубашки"
  eng_armor.834.b:0 "Они становятся все более полезными"

  eng_armor.835.t:0 "Оборонительный регламент 18B"
  eng_armor.835.d:0 ""
  eng_armor.835.a:0 ""

  eng_armor.836.t:0 "BUF протестует против войны с [GER.GetName]"
  eng_armor.836.d:0 "Наша война с Германией вызвала протесты со стороны BUF. Твердо полагая, что Советский Союз представляет большую угрозу, они предсказывают, что Европа станет слишком слабой в этой войне, чтобы противостоять вторжению с Востока."
  eng_armor.836.a:0 "Мы не компрометируем принципы"

  eng_armor.837.t:0 "BUF поддерживает войну против [SOV.GetName]"
  eng_armor.837.d:0 "Наша война с Россией вызвала много аплодисментов со стороны радикальных партий, которые оказывают больше поддержки, чем раньше, чтобы помочь нам победить Красную угрозу."
  eng_armor.837.a:0 "Мы были рады их поддержке."

  eng_armor.838.t:0 "Блиц"
  eng_armor.838.d:0 ""
  eng_armor.838.a:0 ""

  eng_armor.840.t:0 "Военная ситуация"
  eng_armor.840.d:0 "Высшее командование проанализировало наши стратегии на текущий момент. Надеясь, что Советский Союз и Германия все еще могут начать войну друг с другом, они призвали нас прекратить войну против Советов и сосредоточить наше внимание на Германии."
  eng_armor.840.a:0 "Это было бы самым мудрым"
  eng_armor.840.b:0 "Мы не можем простить СССР."

  eng_armor.841.t:0 "Британия просит мира"
  eng_armor.841.d:0 ""
  eng_armor.841.a:0 "Мир будет лучшим"
  eng_armor.841.b:0 "Мы должны продолжать эту войну"

  eng_armor.842.t:0 "[FROM.GETNAME] эвакуирует свой торговый флот"
  eng_armor.842.d:0 "Вслед за вторжением Германии, правительство государства [FROM.GETNAME] отдало приказ направить все торговые суда в Великобританию, чтобы предотвратить их захват немцами"
  eng_armor.842.a:0 "Браво"

  eng_armor.846.t:0 "Проблемы в Ираке"
  eng_armor.846.d:0 "Принц Абд аль-Ила пришел к нам с сообщением о готовящемся перевороте в Ираке, только что избежав ареста. Это относится и к другим сообщениям об арестах пробританских граждан и изгнании политиков. Нет никаких сомнений в том, что нам придется вмешаться, и поэтому мы должны немедленно подготовить оперативную группу."
  eng_armor.846.a:0 "Подготовка должна быть сделана"

  eng_armor.847.t:0 "Советский Союз принял это предложение"
  eng_armor.847.d:0 "Советы видят важность этого вторжения и начали мобилизацию войск на границе. Как только мы будем готовы, мы дадим сигнал, чтобы вторжение началось всерьез."
  eng_armor.847.a:0 "Превосходно"

  eng_armor.848.t:0 "Советский Союз отверг наше предложение."
  eng_armor.848.d:0 "Советский Союз, похоже, не признает, что Иран является возможной угрозой или имеет какое-либо стратегическое значение, чтобы оправдать вторжение. Это ставит нас в положение, когда мы можем видеть гораздо более затянутую и дорогостоящую войну."
  eng_armor.848.a:0 "Мы пойдем одни"
  eng_armor.848.b:0 "План сейчас слишком рискованный."

  ENG_cable_street_march_tt:1 "£faction_eng_british_radicalists §YРадикалы§! станут §Rменее влиятельными§!, но §Yстабильность§! снизится на §R5%§!."

  ENG_cable_street_march_tt_2:1 "£faction_eng_british_radicalists §YРадикалы§! станут §Rменее влиятельными§! и §Rболее враждебными§!; §Yстабильность§! и их §Yотношение§! снизятся."

  ENG_lancashire_march_tt:1 "£faction_eng_british_radicalists §YРадикалы§! станут §Rвлиятельнее§!, а прирост §Yполитической власти§! снизится на §R5%§!."

  ENG_london_city_council_elections_tt:1 "£faction_eng_british_radicalists §YРадикалы§! станут §Rвлиятельнее§!, а прирост §Yполитической власти§! снизится на §R5%§!."

  ENG_london_city_council_elections_2_tt:1 "£faction_eng_british_radicalists §YРадикалы§! станут §Gвлиятельнее§!, а прирост §Yполитической власти§! увеличится на §G5%§!."

