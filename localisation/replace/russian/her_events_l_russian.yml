  sov_her.10.t:0 "Арест Солженицына"
  sov_her.10.d:0 "Сегодня утром капитан Солженицын был арестован агентами "СМЕРША" за его критику Сталина в письмах которые он отправлял с фронта."
  sov_her.10.a:0 "Изменники должны гнить в тюрьме"

  sov_her.11.t:0 "Провал пятилетнего плана"
  sov_her.11.d:0 ""
  sov_her.11.a:0 "Полетят головы!"

  sov_her.12.t:0 "Матрона Московская"
  sov_her.12.d:0 "Немцы уже близ Москвы, столица находится в угрожающем положении. Иосиф Сталин решил посетить Матрону. Святая сказала Вождю: «Русский народ победит, победа будет за тобой. Из начальства один ты не выедешь из Москвы». Опосля, изрядно смутившийся Сталин призвал к себе в Кремль духовенство для молебна о даровании победы; тогда же, чудотворная Тихвинская икона Богоматери из Тихвинской в Алексеевском церкви была на самолете обнесена кругом Москвы и Москву от врага спасла. А 9 декабря после первого успешного контрнаступления, предшествовавшего московскому, был освобожден г. Тихвин."
  sov_her.12.a:0 "Принято к сведению"

  sov_her.14.t:0 "Следствие по халатности Генерала Павлова"
  sov_her.14.d:0 "Бывший командующий Западным фронтом Павлов Д. Г. с начала военных действий немецко-фашистских войск против СССР проявил трусость, бездействие власти, отсутствие распорядительности, допустил развал управления войсками, сдачу оружия и складов противнику, самовольное оставление боевых позиций частями Западного фронта и этим дали врагу возможность прорвать фронт. Таким образом Павлов Д. Г. нарушил военную присягу, обесчестил высокое звание воина Красной Армии, забыл свой долг перед Родиной, своей трусостью и паникерством. Генерал Павлов, не признавший свою вину, лишён воинского звания и приговорён к расстрелу."
  sov_her.14.a:0 "Привести приговор в исполнение"

  sov_her.16.t:0 "Гибель командующего Юго-Западного Фронта"
  sov_her.16.d:0 "20 сентября 1941 года сводная колонна штабов Юго-Западного фронта была атакована главными силами немецкой танковой дивизии. Потеряв несколько орудий и бронемашин, остатки колонны отошли в рощи. В группе оставалось не более тысячи человек, из них около 800 командиров, в том числе командующий фронтом Кирпонос, члены Военного совета, начальники штабов, генералы управления фронта и командующий 5-й армией Потапов. Транспорт и люди рассредоточились по кромке пересекавшего рощу оврага, бронемашины заняли позиции по опушке. Противник атаковал рощу с трёх сторон. Вначале они ворвались на восточную опушку. В рукопашной схватке участвовали все — от солдата до командующего фронтом. В бою Кирпонос был ранен в ногу, а через несколько часов погиб от попадания осколка в голову."
  sov_her.16.a:0 "Тяжёлые времена"

  sov_her.18.t:0 "Пленение командующего 5-й армии"
  sov_her.18.d:0 "Входя в состав Юго-Западного фронта, 5-я армия под командованием Потапова участвовала в приграничном сражении, вела оборонительные бои на государственной границе, затем в районах Ковеля, Дубно, Ровно, Житомира. В последующем армия упорно оборонялась на позициях Коростеньского укрепленного района, с 7 июля участвовала в Киевской оборонительной операции, сражаясь с превосходящими силами противника на киевском направлении. В этих боях войска армии понесли тяжелые потери и значительная часть из них попала в окружение. При выходе из окружения генерал-майор Михаил Потапов попал в плен."
  sov_her.18.a:0 "Это печально!"

  sov_her.19.t:0 "Военная заговорщическая организация"
  sov_her.19.d:0 "По информации НКВД ряд высших офицеров РККА являются участниками «военной заговорщической организации», по заданиям которой, во время национально-революционной войны в Испании проводили вражескую работу, направленную на поражение Республиканской Испании, снижение боевой подготовки ВВС Красной Армии и увеличение аварийности в Военно-Воздушных Силах."
  sov_her.19.a:0 "Врагам народа - смерть!"

  sov_her.20.t:0 "Смена командования ВВС"
  sov_her.20.d:0 "даров"
  sov_her.20.a:0 "Великолепно!"

  sov_her.21.t:0 "Вторжение в Польшу?"
  sov_her.21.d:0 "Согласно пакту Молотова Риббентропа мы должны вторгнутся в Польшу"
  sov_her.21.a:0 "Начать вторжение"

  ger_her.1.t:0 "Panzerschokolade"
  ger_her.1.d:0 "В Германии, начиная с 1938 года, первитин применяли систематически и в больших дозах как в армии, так и в оборонной промышленности. Таблетки первитина официально входили в «боевой рацион» лётчиков и танкистов под названием «Panzerschokolade» (танковый шоколад). Накануне вторжения во Францию военнослужащим Вермахта было выдано 35 миллионов доз первитина."
  ger_her.1.a:0 "Принято к сведению"

  ger_her.2.t:0 "Подкалиберные снаряды и конические стволы"
  ger_her.2.d:0 "С 1940 года на вооружение Вермахта начинают поступать противотанковые артиллерийские орудия с коническим стволом, а в начале 1941 года были применены подкалиберные боеприпасы, разработанные ранее, что привело к повышение эффективности противотанковых средств."
  ger_her.2.a:0 "Принято к сведению"

  ger_her.3.t:0 "Крупносерийное производство САУ StuG III"
  ger_her.3.d:0 "Sturmgeschütz III - средняя по массе немецкая самоходно-артиллерийская установка класса штурмовых орудий времён Второй мировой войны на базе танка PzKpfw III, которая была дешевле в производстве на 15-20%, чем танки на тех же шасси. Серийно выпускалась в различных модификациях с 1940 по 1945 год и стала самым массовым по численности представителем бронетехники вермахта (выпущено 8636 САУ с 75-мм орудиями)."
  ger_her.3.a:0 "Принято к сведению"

  ger_her.4.t:0 "Разработка Panzerkampfwagen VI «Тигр»"
  ger_her.4.d:0 "Конструкторским бюро двух машиностроительных фирм, «Хеншель» и «Порше», поступили тактико-технические требования на тяжёлый танк прорыва проектной массой 45 тонн и пушкой, способной пробить броню толщиной 100 мм на дистанции в 1,5 километра. Представление опытных образцов было приурочено ко дню рождения Фюрера. При показе на Куммерсдорфском полигоне выбор военной комиссии пал на танк фирмы «Хеншель». В итоге гибрид с шасси фирмы «Хеншель» и башней Фердинанда Порше поступил в производство."
  ger_her.4.a:0 "Принято к сведению"

  ger_her.5.t:0 "Успешное завершение операции «Рейнхард»"
  ger_her.5.d:0 "Сегодня Глобочник сообщил Гиммлеру из Триеста, что операция «Рейнхард» завершена в генерал-губернаторстве двумя неделями ранее и все лагеря ликвидированы. В своём ответе Гиммлер благодарил Глобочника и выражал ему благодарность и признательность за большую и неповторимую услугу, которые он оказал всему немецкому народу при проведении операции."
  ger_her.5.a:0 "Принято к сведению"

  ger_her.10.t:0 "Операция Валькирия провалилась!"
  ger_her.10.d:0 "Попытка покушения на нашего фюрера провалилась. После взрыва бомбы во время одной из наших военных встреч в Волчьем Логове наш Фюрер был всего в нескольких метрах от смерти, также от полученных ран скончался начальник генерального штаба ОКЛ. Мы выследили предателей, которые осмелились свергнуть нас! Теперь нам нужно решить судьбу всех офицеров, имеющих какое-либо отношение к этому заговору. В любом случае за это придется адски платить!"
  ger_her.10.a:0 "Они все вкусят наш гнев!"

  ger_her.11.t:0 "Объявление войны Соединенным Штатам"
  ger_her.11.d:0 "Соединенные Штаты находятся в состоянии войны, и японцы быстро захватывают территорию союзников в Восточной Азии, где шансы на победу высоки. Если сопоставить это с ухудшением отношений между США и Германией, то можно предположить, что их присоединение к войне на стороне Великобритании будет лишь вопросом времени. Мы должны опередить их в объявление войны, и тем самым вывести Соединенные Штаты из равновесия, увеличив шансы победы Японии на востоке."
  ger_her.11.a:0 "Великая нация не позволит объявить себе войну!"

  ger_her.12.t:0 "Гибель Ойгена фон Шоберта"
  ger_her.12.d:0 "Во время боевых действий в южной части Советского Союза, на юге Украины, Ойген Риттер фон Шоберт и его пилот погибли, когда их самолёт наблюдения Fieseler Fi.156 Storch сел на советское минное поле. Генерал похоронен с воинскими почестями на недавно созданном военном кладбище в Николаеве."
  ger_her.12.a:0 "Печальная весть!"

  ger_her.13.t:0 "Провал «Барбароссы»"
  ger_her.13.d:0 "В ходе летне-осенней кампании на востоке нашей армией не удалось достигнуть поставленных целей в уничтожении РККА и взятии ключевых промышленных центров Западной части СССР. Москва ещё находится в руках большевиков, а красная армия сохраняет свою боеспособность. Причины неудач лежит на плечах командующих, которые не исполняют приказы, их следует отстранить от дел «по болезни»"
  ger_her.13.a:0 "Принято к сведению"
  blitz_lose_comander_retire_tt:0 "§RОтстранит§! от командования следующих генералов: \n§YХайнц Гудериан§! \n§YВильгельм фон Лееб§! \n§YЭрих Гёпнер§! \n§YАдольф Штраус§!\n\n§GНа 2 месяца§! не будут доступны следующие командующие: \n§YФедор фон Бок§! \n§YГерд фон Рундштедт§!"

  ger_her.14.t:0 "Хайнц Гудериан: новое назначение"
  ger_her.14.d:0 "После окончания операции «Блау» Гудериан был вызван в ставку фюрера в Виннице и после беседы с Гитлером назначен на должность главного инспектора бронетанковых войск, ответственным за модернизацию бронетанковых частей. Наладив хорошие отношения с Албертом Шпеером, они, обоюдными усилиями смогут увеличить количество выпускаемых танков."
  ger_her.14.a:0 "Чудесно!"
  inspektor_guderian_tt:0 "§GРазблокирует§! черту «Личная инспекция заводов Гудерианом» у военно-промышленных организаций §YХеншель§!, §YМАН§!, §YДаймлер-Бенц§! и §YКрупп§!"
  inspektor_guderian:0 "§GГудериан§! назначен главным инспектором бронетанковых войск"

  ger_her.15.t:0 "Разногласия в командовании"
  ger_her.15.d:0 "Находясь в должности командующего вооруженными силами, Гитлер вступил в конфликт с начальником своего штаба Гальдером, относительно стратегии ведения боевых действий согласно плану «Блау». Также Бок, командующий группой армии, критиковал Гитлера за его вмешательство в дела армии. Необходимо пресечь их нелояльность и лишить должностей."
  ger_her.15.a:0 "Мы найдём им замену"

  ger_her.16.t:0 "Ешоннек застрелился"
  ger_her.16.d:0 "Сегодня, после аудиенции с Гитлером, начальник генерального штаба ОКЛ Ганс Ешоннек застрелился, не выходя из ставки Вольфшанце."
  ger_her.16.a:0 "Мы найдём ему замену"

  ger_her.17.t:0 "Нервный срыв у Цейтцлера"
  ger_her.17.d:0 "Сегодня у Цейтцлера случился нервный срыв и он без разрешения покинул резиденцию Гитлера в Бергхофе, сказавшись больным."
  ger_her.17.a:0 "Мы найдём ему замену"

  ger_her.18.t:0 "Оборона Рейха"
  ger_her.18.d:0 "После очередного спора с Гитлером, вызванного вмешательством последнего в управление танковыми боевыми частями, Гудериан был снят с должности и отправлен в отпуск. Ганс Кребс был назначен начальником штаба сухопутных войск."
  ger_her.18.a:0 "Последняя надёжда Рейха"
  ger_her_18tt:0 "§GТеодор Буссе станет доступен в качестве генерала§!"

  her_news.1.t:0 "Взрыв в Бомбее"
  her_news.1.d:0 "14 Апреля 1944 в порту Индийского города Бомбей произошел взрыв. Причиной его стал пожар на параходе «Форт Стикин». На борту был груз «особой срочности» (хлопок и взрывчатка). Пожар начался в 12:30, пожарные команды пытались тушить разгорающийся пожар, но их попытки не увенчались успехом. Пожар разгорался. Первые ящики со взрывчаткой загорелись в 15:40. В 16:06 произошёл взрыв. От взрыва образовалась приливная волна такой силы, что корабль «Джалампада» водоизмещением почти 4000 тонн оказался на крыше одного из складов, высота которого была 17 метров. Через 34 минуты прогремел второй взрыв. Горящие кипы хлопка подожгли в радиусе девятисот метров от эпицентра всё. В результате взрыва и последующих пожаров погибло 1376, ранено было 2408. Почти одна квадратная миля городских кварталов была уничтожена."
  her_news.1.a:0 "Принято к сведению"
  her_news.1.b:0 "О,боже..."
  her_news.1.c:0 "Прискорбная весть..."

  her_news.2.t:0 "Землетрясение в Турции"
  her_news.2.d:0 "27 Декабря в 1:57 по местному времени произошло одно из сильнейших землетрясений в истории Турции, уступая землетрясению в Северной Анатолии 1668 года. Эпицентр землетрясения находился вблизи Эрзинджана. Толчки продолжались 52 секунды. Землетрясение привело к возникновению цунами высотой 1—3 м, которое обрушилось на побережье Чёрного моря. Землетрясение серьёзно повредило около 116 720 зданий. Первоначально число погибших составляло около 8000 человек. На следующий день, 27 декабря, поступило сообщение о том, что оно возросло до 20 000 человек. В течение того же дня температура упала до -30. В Итоге погибшими от низких температур, снежных бурь и наводнений и непосредственно землятресения стали 32 968, около 100 тысяч были ранены. Ущерб, нанесённый городу Эрзинджан, был настолько велик, что его месторасположение было полностью заброшено."
  her_news.2.a:0 "Это неоспоримая трагедия Турции"

  her_news.3.t:0 "Путч молодых офицеров"
  her_news.3.d:0 "26 Февраля 1936 была предпринята попытка государственного переворота в Японии приверженцами национал-социализма в японской армии. Идеологом путча был Икки Кита, программная работа которого, под названием «План реконструкции», сподвигла военных на мятеж. Мятежникам удалось захватить центр Токио, включая здания Парламента, Министерства внутренних дел и Министерства обороны, и убить нескольких влиятельных политических лидеров. Несмотря на их заявления о полной поддержке императорской власти, император Сёва резко осудил их действия, признав их незаконными. Деморализованные мятежники сдались правительственным войскам. Некоторые восставшие офицеры, в том числе и лидер мятежа, покончили с собой. 19 руководителей путча были казнены."
  her_news.3.a:0 "Импереалисты пожирают сами себя"
  her_news.3.b:0 "Жаль что не вышло"
  her_news.3.c:0 "Интересно"
  her_news.3.e:0 "Хорошо что император не пострадал,а у мятежников ничего не вышло"

  her_news.4.t:0 "Всеобщая забастовка в Греции"
  her_news.4.d:0 "13 мая 1936 года в Греции произошла массовая забастовка. Она стала ответом на кровавую расправу жандармерии над бастовавшими трудящимися города Салоники. Правительство в ответ на требования рабочих в Салониках просто расстреляло демонстрантов из пулеметов (8—9 мая), тогда было убито 12 человек и сотни ранены. Несмотря на репрессии, в забастовке участвовало около 500 тысяч рабочих, ремесленников и служащих. "
  her_news.4.a:0 "Рабочий Класс дает о себе знать"
  her_news.4.b:0 "Недостаточно оружия было применено..."
  her_news.4.c:0 "Жестокость жандармов была неоправданной"

  her_news.5.t:0 "Хрустальная ночь"
  her_news.5.d:0 "9 Ноября 1938 года по всей нацистской Германии, в части Австрии и в Судетской области произошли еврейские погромы. Они совершались военизированными отрядами СА и гражданскими лицами. Полиция самоустранилась от препятствования этим событиям. В результате нападений многие улицы были покрыты осколками витрин принадлежавших евреям магазинов, зданий и синагог. Поводом для погрома стала смерть в Париже немецкого дипломата Эрнста фом Рата после покушения на него польского еврея Гершеля Гриншпана, интерпретированная Геббельсом как нападение международного еврейства на Германию и фюрера."
  her_news.5.a:0 "Преследования Евреев переходит все границы!"
  her_news.5.b:0 "Так им и надо!"
  her_news.5.c:0 "Разве эта та свобода которую обещал Гитлер?"
  her_news.5.e:0 "Жаль простых граждан."


  her_news.6.t:0 "Халхин-Гольская война"
  her_news.6.d:0 "[GetDateText] начался локальный вооружённый конфликт между советско-монгольскими войсками и Вооружёнными силами Японии. За несколько месяцев до этого Японские войска вступали в стычки с Советскими пограничниками, так 16 января 1939 года в районе высоты Номон-Хан-Бурд-Обо группа из пяти японских солдат с расстояния около 500 метров обстреляла наряд из четырёх пограничников МНР. Вооруженный конфликт продолжается и в настоящий момент."
  her_news.6.a:0 "Пожелаем стойкости Советским бойцам"
  her_news.6.b:0 "Японцы,в атаку!"
  her_news.6.c:0 "Тоталитарные режимы столкнулись в битве"

  her_news.7.t:0 "Победа СССР в боях на Халхин-Голе"
  her_news.7.d:0 "[GetDateText] вступило в силу перемирие подписанное днем ранее между Японией и СССР. В боях на Халхин-Голе победу одержала Советская сторона. Потери Японии составили до 45 тысяч человек, 162 самолета и неизвестное количество танков. Потери СССР составляют 25 тысяч человек, включая раненых, заболевших и погибших,а также 207 самолетов и 253 танка. Победа Советского Союза привело к правительственному кризису и отставке кабинета Хиранумы Киитиро."
  her_news.7.a:0 "Победа за нами!"
  her_news.7.b:0 "Мы не забудем этот проигрыш..."
  her_news.7.c:0 "Сокрушительное поражение Японии."

  her_news.8.t:0 "Покушение на Адольфа Гитлера"
  her_news.8.d:0 "8 Ноября 1939, Иоганн Георг Эльзер совершил неудачное покушение на Адольфа Гитлера, Германа Геринга и Йозефа Геббельса. Бомба была встроена в колонну зала. В «Бюргербройкеллер» собралось около 3000 человек, в том числе всё высшее руководство нацистской Германии и Мюнхена. Гитлер покинул зал за семь минут до взрыва по другим данным за тринадцать минут. Взрывная волна разрушила часть крыши и разметала несколько рядов слушателей, находившихся наиболее близко к трибуне. 8 человек погибло и 63 человека было ранено. Ещё за 35 минут до взрыва около 20:45, Эльзер был задержан немецким пограничным патрулем при попытке незаконно пересечь швейцарскую границу."
  her_news.8.a:0 "Жаль не вышло..."
  her_news.8.b:0 "Кто он такой чтоб попытаться отнять жизнь великого Фюрера!"
  her_news.8.c:0 "Жаль не вышло..."
  her_news.8.e:0 "Интересные события"

  her_news.9.t:0 "Операция «Антропоид»"
  her_news.9.d:0 "[GetDateText] было совершено покушение на Рейнхарда Гейдриха в Праге. Автомобиль Гейдриха с откинутым верхом подъехал к месту, где его ждали агенты в 10:32. В этот день постоянного шофёра заменял водитель Йоханнес Кляйн, обершарфюрер СС. Когда машина притормозила у поворота диверсанты напали на машину в результате чего Гейдрих и Кляйн получили ранения, но все равно смогли вступить в перестрелку с диверсантами, которым по итогу удалось уйти. Состояние офицеров СС остается неизвестным, обоих отправили в больницу."
  her_news.9.a:0 "Надеюсь они сдохнут!"
  her_news.9.b:0 "Здоровья офицерам!"
  her_news.9.c:0 "Надеюсь они сдохнут!"
  her_news.9.e:0 "Мировая война вынуждает людей идти на откровенное самоубийство."

  her_news.10.t:0 "Рейнхард Гейдрих скончался!"
  her_news.10.d:0 "Рейнхард Тристан Ойген Гейдрих, начальник Главного управления имперской безопасности, исполняющий обязанности имперского протектора Богемии и Моравии, Обергруппенфюрер СС и генерал полиции скончался [GetDateText] в возрасте 38 лет. Причиной смерти явилось покушение совершенное на него неделей ранее. Обергруппенфюрер получил тяжелые ранения и врачи боролись за его жизнь. Ему была удалена селезёнка, в которой оставались металлический фрагмент и кусок обивки. Утром следующего дня появилась информация об улучшении состояния Гейдриха, но уже около полудня он впал в кому и умер сегодня."
  her_news.10.a:0 "Фашисткая свинья сдохла!"
  her_news.10.b:0 "Жаль такого великого человека"
  her_news.10.c:0 "Возможно он получил по заслугам"

  her_news.12.t:0 "Подрыв ДнепроГЭСа"
  her_news.12.d:0 "В [GetDateText] Днепрогэс, Днепровские плотины, железнодорожный мост через Днепр были взорваны советскими войсками. Военные транспорты и люди, которые в то время двигались по дамбе, погибли. О планируемом взрыве Днепровской дамбы никто не был предупрежден ни на самой дамбе, ни населения и учреждения города Запорожье. Так же не были предупреждены военные части, расположенные вниз от Запорожья в днепровских плавнях, хотя телефонное соединение в то время на Левобережье функционировало нормально. В теле плотины образовалась большая брешь, пошел активный сброс воды. Почти тридцатиметровая лавина воды пронеслась Днепровской поймой, заливая все на своем пути."
  her_news.12.a:0 "Падение Сталинского колосса"

  her_news.14.t:0 "Парад на Красной площади 7 ноября"
  her_news.14.d:0 "Военный парад в честь 24-й годовщины Октябрьской революции готовился в обстановке строжайшей секретности. Парад начался с приветствия маршала Будённого, который выехал на коне из ворот Спасской башни под бой курантов. После выступления Иосифа Сталина сводный оркестр под руководством Агапкина заиграл «Интернационал», а на Софийской набережной устроили орудийный салют. Марш открыли курсанты 1-го Московского Краснознамённого артиллерийского училища имени Л. Б. Красина. \nВоенный парад на Красной площади в Москве вселил в советских людей уверенность: все поняли, что если в такой тяжелой обстановке, когда враг у стен Москвы, а в столице традиционно отмечают годовщину Октября, значит, врагу не взять город."
  her_news.14.a:0 "За Родину, братцы!"

  her_news.15.t:0 "Гибель конструктора"
  her_news.15.d:0 "Владимир Михайлович Петляков, советский авиаконструктор бомбардировщиков Пе-2. Погиб в авиакатастрофе около деревни  Мамешево. Он залез в бомбардировщик Пе-2 для вылета в Москву. Командир перегоночной группы, думая, очевидно, что его просит об услуге рядовой работник завода, посадил Владимира Михайловича в первый подвернувшийся под руку самолёт, экипаж которого оказался недостаточно опытным. Оторвавшись от земли, самолёт быстро полез вверх, вошел в низкую облачность и через несколько минут, делая, как можно было определить по звуку мотора, круг над аэродромом, вывалился из облаков. В беспорядочном падении, с полностью работающими моторами, машина врезалась в землю. Гибель всего экипажа и конструктора произошла мгновенно."
  her_news.15.a:0 "Принято к сведению"

  her_news.16.t:0 "Сын Сталина попал в плен"
  her_news.16.d:0 "Яков Иосифович Джугашвили, старший сын Иосифа Сталина, старший лейтенант РККА при попытке выхода из окружения попал в немецкий плен. Он доставлен на допрос к Гюнтеру Фон Клюге."
  her_news.16.a:0 "Вот незадача!"
  her_news.16.b:0 "Принято к сведению"

  her_news.17.t:0 "Падение Кёнигсберга"
  her_news.17.d:0 "Сегодня, Советскими войсками был взят Кенигсберг.  Немецкий город Кёнигсберг был превращён в один из мощных укреплённых районов Восточной Пруссии. В Кёнигсберге было создано три кольца обороны. Первое состояло из траншей, рвов и мин. На этом кольце располагалось 15 фортов. Второе кольцо обороны проходило по окраинам города. Третье кольцо, в центре города. Советские войска пробивая артиллерией себе путь продвигались по кварталам города, а Инженерные подразделения подрывали укрепления. После массированной штурма крепости. Немецкий гарнизон капитулировал по приказу коменданта  Кёнигсберг генерала Отто Ляша, подписавшего акт о капитуляции. За это Гитлер  заочно приговорил Ляша к смертной казни. На «Башне Дона» было водружено Знамя Победы."
  her_news.17.a:0 "Это конец Третьего Рейха"

  her_news.18.t:0 "Освобождение Праги"
  her_news.18.d:0 "Советские Войска взяли Прагу! Наступление велось круглосуточно. Немецкое командование рассчитывало как можно дольше обороняться в Чехословакии и пытаться использовать разногласия между союзниками по антигитлеровской коалиции. Получив данные о переброске советских войск на фланги, генерал решил стянуть свои основные части в район Праги и упорно обороняться там и в самом городе, превратив Прагу во «второй Берлин». Советские войска сбивали с рубежей обороны арьергарды противника, широко применяя охваты и обходы. Чешскими партизанами был пленён и позднее передан советскому командованию начальник штаба ВС КОНР генерал Трухин. Общее отступление из района Праги и западнее Праги частей Вермахта и СС быстро переросло в паническое бегство в сторону западной границы Чехословакии."
  her_news.18.a:0 "Это конец Третьего Рейха"

  her_news.20.t:0 "Резня в Нанкине"
  her_news.20.d:0 "На днях японские военнослужащие совершили массовые убийства и изнасилования гражданского населения Нанкина. Насилие продолжалось в течение шести недель, начавшись 13 декабря 1937 года. За этот период солдаты Японской императорской армии убили, по разным оценкам, от 40 000 до более 500 000 китайских гражданских лиц и разоружённых солдат,а также совершили множество изнасилований и актов мародёрства."
  her_news.20.a:0 "Интересно"

  her_news.21.t:0 "Контрнаступление РККА под Москвой"
  her_news.21.d:0 "В оборонительный период битвы Красная армия отстояла Москву. Наступление противника, несмотря на успехи лета — осени 1941 года, было остановлено. Враг не сумел достичь своей главной цели блицкрига. Германия оказалась перед неизбежностью затяжной войны с СССР. Надежды вывести Россию из войны в 1941 г. провалились в самую последнюю минуту. Теперь руководителям Германии важно было понять, что дни блицкрига канули в прошлое. Нам противостояла армия, по своим боевым качествам намного превосходящая все другие армии, с которыми нам когда-либо приходилось встречаться на поле боя. Товарищ Сталин приказал перейти в контрнаступление!"
  her_news.21.a:0 "За Родину! За Сталина!"
  her_news.21.b:0 "Ещё не всё решено"

  her_news.22.t:0 "Советские войска вступают в Бухарест"
  her_news.22.d:0 "После перехода Румынии на сторону антигитлеровской коалиции,  Советское и Румынское командование начали совместные действия по разгрому немецких и венгерских частей на территории Румынии для полного его освобождения. Для выполнение данной задачи советское командование перекинуло дополнительные части в Румынию, которые в [GetDateText] достигли Бухареста. В целом Румынский народ встречал советскую армию как освободителей. Части Советской армии прошли город не задерживаясь по политическим причинам"
  her_news.22.a:0 "За Родину! За Сталина!"
  her_news.22.b:0 "Ещё не всё решено"

  her_news.23.t:0 "Пожар в клубе «Коконат Гроув»"
  her_news.23.d:0 "Трагедия случилась вечером, когда в заведении находилось много людей. Пожар произошел из-за короткого замыкания: во время замены электрической лампочки загорелся горючий декор в виде листьев пальмы. В результате трагедии погибли 492 человека. После происшествия начались пересмотры норм пожарной безопасности в США."
  her_news.23.a:0 "Боже...прими души погибших"
  her_news.23.b:0 "Так им и надо"
  her_news.23.c:0 "Передайте соболезнования американцам"

  her_news.24.t:0 "Суд над Лаки Лучано"
  her_news.24.d:0 "Сегодня 7 июня 1936 года произошел судебный процесс над Чарльзом «Лаки» Лучано, архитектором современной структуры американской мафии. Он был признан виновным по 62 пунктам обвинения в принуждении к проституции и получил беспрецедентный срок 50 лет тюрьмы."
  her_news.24.a:0 "Интересно"

  her_news.25.t:0 "Взятие Эльбруса Вермахтом"
  her_news.25.d:0 "Сегодня утром, группа немецких горных стрелков под командованием Хайнца Грота заняла гостиницу для альпинистов «Приют 11», располагавшуюся на горе Эльбрус на высоте 4050 метров. Грот, опытный альпинист, организовал восхождение на вершину Эльбруса и установил там флаг дивизии «Эдельвейс». Теперь флаг со свастикой развивается над Кавказом."
  her_news.25.a:0 "Интересно"

  her_news.26.t:0 "Взятие Эльбруса РККА"
  her_news.26.d:0 "После короткого пехотного боя за Приют 11, немецкие войска в спешке отступили с занимаемым позиций, вскоре бойцы Красной Армии начали восхождение на Эльбрус и сбросили с западной вершины Эльбруса флаги Третьего рейха и штандарты 1-й горнострелковой дивизии вермахта «Эдельвейс», установив вместо них знамёна с серпом и молотом."
  her_news.26.a:0 "Интересно"

  her_news.27.t:0 "Подрыв Весёловского водохранилища"
  her_news.27.d:0 "Неизвестный герой ценой своей жизни взорвал плотину Весёловского водохранилища, плотина Весёловского водохранилища взлетела на воздух. Маныч вышла из русла и из вялотекущей реки превратилась в гигантский водоток, достигающий в ширину 4 км."
  her_news.27.a:0 "Интересно"



  her_news.28.t:0 "Освобождение концлагеря Заксенхаузен"
  her_news.28.d:0 "Сегодня, Советские войска освободили концлагерь Заксенхаузен, представшие перед взоров советских солдат шокировало их, изможденные люди, дети, женщины, мужчины просили о помощи, Советские медики начали оказания помощи узникам лагеря. Всего было освобождено 45 тысяч человек. Заключенные рассказали что, должны были разнашивать новую обувь для немецких военных, при этом пары специально подбирались не по размеру: измученных людей заставляли в этой обуви бегать целыми сутками."
  her_news.28.a:0 "Жесть"

  her_news.29.t:0 "Освобождение концлагеря Освенцим"
  her_news.29.d:0 "Сегодня, Советские войска освободили концлагерь Освенцим. Где нацисты уничтожали массово пленных, также уничтожая евреев, цыган и славян. Часть заключённых использовалась в качестве личной прислуги нацистов или для работ по обслуживанию лагерей. Ещё одна группа узников становилась невольными жертвами медицинских экспериментов – их проводил «ангел смерти» доктор Йозеф Менгеле. На узниках испытывали новые медицинские препараты по заказам немецких фармацевтических фирм, заражали различными болезнями и делали экспериментальные операции."
  her_news.29.a:0 "Жесть"

  her_news.30.t:0 "Освобождение концлагеря Майданек"
  her_news.30.d:0 "Сегодня, Советские войска освободили концлагерь Майданек. Когда Красная Армия вступила на территорию Майданека, она встретила лишь несколько сотен едва держащихся на ногах узников. Войдя на территорию лагеря, советские воины увидели настоящее царство смерти – ещё чадящие печи, сотни мёртвых тел, горы обуви и одежды арестантов."
  her_news.30.a:0 "Жесть"

  her_news.31.t:0 "Красная Армия обнаружила массовые захоронения в Бабьем Яру"
  her_news.31.d:0 "\nСегодня, Советские войска обнаружили массовые захоронения. Согласно отчету, в двух ямах они обнаружили тела. Там же говорится: «Мы обнаружили многочисленные останки сожженных тел, одежду и кости... в Киеве массовые убийства мирных советских граждан были беспрецедентными по масштабам... жертвами стали несколько десятков тысяч мужчин, женщин и детей»."
  her_news.31.a:0 "Жесть"

  her_news.32.t:0 "Освобождение Хатыни"
  her_news.32.d:0 "Советские войска освободили Хатынь. Бойцы РККА обнаружили около сотни трупов, это было мирное население нескольких деревень которых вывезли на уничтожение. Причиной стало убийство  Ханса Вёльке, который в 1936 году стал чемпионом Олимпийских игр в толкании ядра и был лично знаком с Гитлером. Они стали прочёсывать лес в поисках партизан и во второй половине дня 22 марта 1943 года окружили деревню Хатынь."
  her_news.32.a:0 "Жесть"

  her_news.33.t:0 "Речь Геббельса о Тотальной войне."
  her_news.33.d:0 "Итак, вы, сидящие здесь передо мной, представляете в этот момент весь немецкий народ. И я хотел бы задать вам десять вопросов, на которые вы вместе со всем немецким народом должны дать мне ответ перед лицом всего мира, а особенно наших врагов, слушающих нас сейчас по радио. Я спрашиваю вас: хотите ли вы тотальную войну? Если потребуется, хотите ли вы более тотальную и радикальную войну, чем вы вообще можете сегодня представить?"
  her_news.33.a:0 "Принято к сведению"

  her_news.34.t:0 "«Везерюбунг-Зюд» — Капитуляция Дании»"
  her_news.34.d:0 "Вермахт сегодня утром, на рассвете, пересек  границу континентальной Дании. Датская армия оказывала символическое сопротивление. В это время в Коппенгаген была произведена высадка. Когда десантники подошли к королевскому дворцу Король Кристиан X, решая избежать жертв, приказал сложить оружие."
  her_news.34.a:0 "Бабах"



  news_1941.1.t:0 "Падение Киева"
  news_1941.1.desc:0 "[GetDateText] Киев, столица Украинской ССР, был захвачен наступающими немецкими войсками в Советском Союзе. \n\nЗахват одного из их самых важных городов является серьезным ударом для Советов, но все еще остается вопрос, смогут ли немцы сохранить набранный темп. Через несколько мгновений после того, как немцы заняли город, тысячи мин, заложенных НКВД, по-видимому, взорвались в зданиях вдоль главной улицы Крещатик, причинив еще больший ущерб и без того разрушенному городу.\n\nСейчас силы вторжения смотрят на восток."
  news_1941.1.a:0 "Тревожное развитие..."

  news_1941.2.t:0 "Возвращение Киева"
  news_1941.2.desc:0 ""
  news_1941.2.a:0 ""

  news_1941.3.t:0 "Падение Москвы"
  news_1941.3.desc:0 "В [GetDateText] немецкие танки прорвались через наспех воздвигнутые заграждения на улицах Москвы, а на Красной площади были замечены полугусеницы, выгружающие панцергренадеров. \nГустой клубящийся дым от многочисленных пожаров, бушующих в пригородах, поднимался в воздух, когда пехота вермахта штурмовала Кремль. Сообщается, что гранаты и огнеметы были необходимы для борьбы с упорными противниками НКВД, намеревавшимися защищать каждый дюйм комплекса. Российская столица теперь в руках нацистов, но осталась в горящих руинах. \n\nПо неподтвержденным данным, забальзамированный труп Ленина был благополучно эвакуирован на восток."
  news_1941.3.a:0 "Удар в самое сердце Советов..."

  news_1941.4.t:0 "Возвращение Москвы"
  news_1941.4.desc:0 ""
  news_1941.4.a:0 ""

  news_1941.5.t:0 "Падение Сталинграда"
  news_1941.5.desc:0 "Наступающие немецкие передовые части захватили Сталинград, город-тезку Сталина на берегу Волги. \n\nПрорвавшись с боями через разрушенный Сталинградский тракторный завод и захватив стратегически важные высоты Мамаева кургана, фашистские войска вытеснили последних советских защитников через Волгу к ее восточному берегу. Однако еще предстоит увидеть, смогут ли румыны удержать свою линию..."
  news_1941.5.a:0 "Вернет ли Сталин «свой» город?"

  news_1941.6.t:0 "Возвращение Сталинграда"
  news_1941.6.desc:0 "В [GetDateText] Сталинград освобожден от немецко-фашистских войск. Бои были ожесточенными и в отдельных местах продолжались неделями. \n\nФлаг Союза Советских Социалистических Республик снова гордо развевается над городом."
  news_1941.6.a:0 "Тревожное развитие..."

  news_1941.7.t:0 "Падение Ленинграда"
  news_1941.7.desc:0 "Ленинград, родина русской революции, пал перед наступающими силами вермахта группой армий «Север». \n\nСпорадические бои до сих пор слышны в некоторых пригородах, но над остальной частью разрушенного города, кажется, воцарилось странное спокойствие.\n\nСегодня ранее колонны солдат 18-й армии вермахта прошли маршем мимо Исаакиевского собора, чья великая Купол был выкрашен инженерами Красной Армии в серый цвет, чтобы не привлекать внимание мародерствующих бомбардировщиков Люфтваффе. \nНесмотря на их усилия, он изрешечен пулевыми отверстиями и осколками."
  news_1941.7.a:0 "Тревожное развитие..."

  news_1941.8.t:0 "Возвращение Ленинграда"
  news_1941.8.desc:0 "После недельных боев в городе, известном как Родина русской революции, пыль наконец осела. Любому наблюдателю ясно, что Советы снова у власти. Останется ли это — вопрос."
  news_1941.8.a:0 "Тщательно расспросил..."

  news_1941.9.t:0 "Падение Севастополя"
  news_1941.9.desc:0 "Сильно укрепленный город Севастополь, база советского Черноморского флота, окончательно подвергся нападению фашистов. \n\nЕго потеря будет серьезно препятствовать любой советской попытке бороться за Черное море, а падение города рассматривается как важная победа Оси.\n\nИз Берлина уже издан указ, в котором говорится, что город отныне должен быть известный как «Теодорихсхафен» в честь Теодориха Великого."
  news_1941.9.a:0 "Тревожное развитие..."

  news_1941.10.t:0 "Возвращение Севастополя"
  news_1941.10.desc:0 "Севастополь, бывшая база советского Черноморского флота, был возвращен СССР. Временно изгнанный флот снова может работать с максимальной эффективностью, поскольку его главная гавань снова открыта. Хотя ремонтов еще много..."
  news_1941.10.a:0 "Пусть у них будет база..."

  news_1941.11.t:0 "Падение Баку"
  news_1941.11.desc:0 "Ранее сегодня силы группы армий «Юг» вермахта успешно заняли город Баку, жизненно важную стратегическую цель в их войне против Советского Союза. \n\nРасположенный на берегу Каспийского моря, город является ключом к Кавказу, а его многочисленные нефтяные месторождения, несомненно, принесут пользу немецким военным усилиям.\n\nЕго захват дает странам Оси возможность расширить войну на Ближний Восток и, возможно, даже в Индию."
  news_1941.11.a:0 "Тревожное развитие..."

  news_1941.12.t:0 "Возвращение Баку"
  news_1941.12.desc:0 "После недельных боев на богатых нефтяных месторождениях Баку РККА удалось отбить превосходящие силы вермахта в условиях плохой местности. \n\nСССР удалось отстоять свои нафтянные месторождения на кавказе. Это, безусловно, будет стоить немцам справедливой цены в будущем..."
  news_1941.12.a:0 "Нефть? У них тоже нет демократии?"







  news.338.t:0 "Черный барон мертв!"
  news.338.d:0 "[GetDateText] англо-канадские войска начали операцию Totalize. Под покровом темноты британские и канадские танки в сопровождении солдат захватили высоту у города Сен-Эньян-де-Крамниль. Здесь они остановились в ожидании воздушной бомбардировки. Не зная о причине остановки союзных войск, Курт Мейер из 12-й дивизии СС «Гитлерюгенд» приказал отбить высоту. \nТанковый ас Михаэль Виттманн, также известный как «Черный барон», на счету которого 135 подтвержденных уничтожений танков, должен был возглавить группу из семи танков «Тигр». Его группа тигров, пересекающих открытую местность к возвышенности, попала в засаду Англо-Канадских танков. Во время засады противотанковые снаряды, смогли пробить верхнюю часть корпуса танка Виттмана, воспламенив боеприпасы. Возникший огонь охватил танк и оторвал башню."
  news.338.a:0 "Да упокоится он с миром"

  ger_armor.57.t:"Черный барон умер в Нормандии"
  ger_armor.57.d:"Мы ехали по шоссе, Михаэль с четырьмя другими танками — по одной полосе, а я и брат Хайнца фон Вестерхагена — по другой. Справа, метров через 800, началась рощица и мне она показалась подозрительной. Там-то всё и решилось. Времени на разведку у нас не было. Спустя пару километров, я получил сообщение от Михаэля, и оно подтвердило мои худшие опасения. Раздалось лишь: „сильный противотанковый огонь справа" — и всё оборвалось. Я вылез посмотреть и вижу: танки Михаэля остановились. На мои позывные он уже не отвечал. Тут в нас самих попало прямой наводкой, танк загорелся и пришлось выбираться. Мы побежали со всех ног. Я в ужасе заметил, что всего мы потеряли пять „Тигров". У танка Михаэля снаряд угодил прямо в башню. Было сразу ясно, что никто не выжил."
  ger_armor.57.a:0 "Да упокоится он с миром"

  ww2_germany.44.t:0 "Операция Панцерфауст"
  ww2_germany.44.d:0 "Фюрер недавно получил сообщение о том, что Миклош Хорти, лидер Венгрии, ведет тайные переговоры о капитуляции своей страны перед наступающей Красной Армией. На данный момент он отправил Отто Скорцени разобраться с ситуацией вместе с другими спецподразделениями. Фюрер опасался, что эта капитуляция сильно обнажит южный фланг Германии, где Румыния уже объединилась против рейха, и отрежет многие наши войска."
  ww2_germany.44.a:0 "Хорти надо убрать!"

  ww2_germany.47.t:0 "Кенигсберг Пал"
  ww2_germany.47.d:0 "Город Кенигсберг попал в руки врага, мы должны вернуть его во что бы то ни стало!"
  ww2_germany.47.a:0 "Это плохая новость..."

