  japan_border_conflict.4.t:0 "Патовая ситуация на Халхин-Голе"
  japan_border_conflict.4.desc:0 "Перестрелки между японскими и [SOV.GetAdjective] отрядами на Халхин-Голе затихли после того, как обе стороны отошли от спорного участка с целью перегруппировки и пополнения припасов. Признав бесполезность дальнейшего наступления, японское военное командование предложило прекратить огонь и начать переговоры о закреплении границы."
  japan_border_conflict.4.a:0 "Мы получили ценный опыт."

  sov_her.1.t:0 "Смерть Ватутина"
  sov_her.1.d:0 "[GetDateText] Ватутин вместе со своим сопровождением выехал в расположение 60-й армии, чтобы проверить ход подготовки к очередной операции. При въезде в одно из сёл машины попали под обстрел УПА. Ватутин, выскочив из машины, вместе с офицерами вступил в перестрелку, во время которой был ранен в бедро. Тяжело раненого военачальника на автомобиле отвезли в госпиталь, где его осмотрел генерал-майор медицинской службы И. Н. Ищенко, а через день на поезде доставили в киевский госпиталь. Несмотря на оперативное вмешательство и использование в ходе лечения новейшего пенициллина у Ватутина развилась газовая гангрена и спасти генерала так и не удалось. Через 2 месяца после ранения он скончался в госпитале от заражения крови"
  sov_her.1.a:0 "Проклятые бандеровцы!"
  vatutin_killed:0 "Попал под обстрел УПА"

