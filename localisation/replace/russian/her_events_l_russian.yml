  ENG_Radical_party_support_tt:1 "£faction_eng_british_radicalists §YРадикалы§! станут §Gдружелюбнее§!; прирост §Yполитической власти§! и §Yстабильность§! увеличатся на §G5%§!."

  mtg_britain.4.t:1 "Доминионы расстаются с короной"
  mtg_britain.4.d:1 "Представители правительств Доминиона сообщили нам, что они будут в одностороннем порядке разрывать связи с Короной. Они ссылаются на опасный рост фашизма и все более антидемократическую позицию Великобритании в качестве основной причины того, почему отношения между Британией и Содружеством больше не могут продолжаться.\n\nКак заявил один из представителей Содружества в жарком интервью: \"Правительству, которое использует насилие, ненависть и манипуляции, нельзя доверять действовать в интересах своих подданных. Основываясь на последних событиях, мы можем определить неизбежное падение демократии и парламентаризма, ситуация может стать только хуже, если черные рубашки получат власть. Поэтому для защиты интересов наших народов мы не видим альтернативы, кроме как убрать короля с поста главы нашего государства и отделиться от Великобритании».\n\nНесомненно, они надеются, что нынешний политический паралич помешает нам действовать в соответствии с этим резким шагом."
  mtg_britain.4.a:1 "Мы бессильны остановить их - пока."

  usa_armor.804.t:0 "Россия требует мира"
  usa_armor.804.d:0 ""
  usa_armor.804.a:0 "Принять мир"
  usa_armor.804.b:0 "Отвергать мир"

  usa_armor.805.t:0 "Эмбарго [USA.GetName] для нашей страны"
  usa_armor.805.d:0 "Соединенные Штаты Америки наложили на нас полное эмбарго после наших недавних политических действий. Используя свои связи в Южной Америке, страны в соответствии с доктриной Монро последовали примеру декларации США. Мы должны искать другие ресурсы, которые нам нужны."
  usa_armor.805.a:0 "Мы потеряли жизненно важных поставщиков ресурсов."

  usa_armor.806.t:0 "Закон о судебных процедурах"
  usa_armor.806.d:0 "Поскольку Верховный суд безжалостно сокращает законодательство Нового курса, необходимо принять решительные меры для обеспечения экономической безопасности американского народа. Для того, чтобы сделать суд беспроблемным, был разработан план, чтобы добавить судей, лояльных новому курсу, в суд. Основное положение закона позволит президенту назначить нового судью, если какой-либо судья, который служил по крайней мере 10 годы и не смог уйти в отставку 6 месяцы после поворота 70. Этот акт, хотя и может быть конституционным, серьезно нарушит баланс сил между ветвями власти 3 и будет рассматриваться многими американцами как попытка пересмотреть конституцию и почти наверняка обойдется нам в значительную поддержку."
  usa_armor.806.a:0 "Будем надеяться, что это сработает"

  usa_armor.807.t:0 "Вопрос о Доме"
  usa_armor.807.d:0 "Планируя преодолеть оппозицию Конгресса, возник вопрос о том, на какой части Конгресса следует сосредоточиться, чтобы принять законопроект. В то время как законы обычно отправляются в палату в первую очередь, может быть выгодно сосредоточить усилия в Сенате."
  usa_armor.807.a:0 "Сосредоточиться на Сенате"
  usa_armor.807.b:0 "Сосредоточьтесь на доме"

  usa_armor.808.t:0 "Девятый Fireside Chat"
  usa_armor.808.d_house_not_told:0 "В беседе с Рузвельтом в камине Рузвельт обратился к своим планам судебной реформы. В своем выступлении он связал ветви американского правительства 3 с лошадьми 3, возглавляемыми американским народом, с третьей лошадью, Судом, не вытягивая ее долю. Он раскритиковал суд как \\"Policy Making Body\\" вместо суда и высмеял его за попытку предотвратить облегчение. Однако примеры, приведенные Рузвельтом, оказались вводящими в заблуждение или фактически ошибочными, и это привело к тому, что многие американцы разделились по этому вопросу, рассматривая его как бесстыдный захват власти, даже многие партии, выступающие за новый курс."
  usa_armor.808.d_house_told:0 "В беседе с Рузвельтом в камине Рузвельт обратился к своим планам судебной реформы. В своем выступлении он связал ветви американского правительства 3 с лошадьми 3, возглавляемыми американским народом, с третьей лошадью, Судом, не вытягивая ее долю. Он раскритиковал суд как \\"Policy Making Body\\" вместо суда и высмеял его за попытку предотвратить облегчение. Поддержка со стороны Палаты представителей помогла укрепить эту веру, несмотря на отсутствие доказательств, которые привели к сбору поддержки от американского народа."
  usa_armor.808.a:0 "Фальсификация документов – необходимое зло"
  usa_armor.808.b:0 "Мы должны ускорить законопроект."
  usa_armor.808.c:0 "Будем надеяться, что это работает"

  usa_armor.809.t:0 "Дебаты среди демократов"
  usa_armor.809.d:0 "Как только законопроект попал в дом, разразился хаос. Демократическая партия просто развалилась, когда две коалиции осудили друг друга, а многие демократы, выступающие против законопроекта, присоединились к республиканцам, которые воспользовались всеми преимуществами, которые они имели, чтобы разделить демократов. Этому не помогло письмо вице-президента Джона Нэнса Гарнера, осуждающее законопроект, в прямом неповиновении президенту. При разделении части необходимо принять меры для обеспечения принятия законопроекта."
  usa_armor.809.a:0 "Принудить к компромиссу"
  usa_armor.809.b:0 "Осудить противников законопроекта"

  usa_armor.810.t_bill_pass:0 "Билл проходит"
  usa_armor.810.t_bill_fails:0 "Билл провалился"
  usa_armor.810.d_bill_pass:0 "Несмотря на жесткую оппозицию, законопроект прошел через обе палаты Конгресса. С помощью набора компромиссов и убедительных, законопроект был принят с 225 на голосование 210 в палате представителей и 50 на 46 в Сенате. Этот успех во многом объясняется тем, что Рузвельт осудил письмо Гарнера, а также уступками, сделанными на других фронтах. Однако, несмотря на этот успех, многие в партии отвернулись от Рузвельта. Несмотря на это, законопроект должен вступить в силу очень скоро, расширяя возможности для законодательства."
  usa_armor.810.d_bill_fails:0 "Несмотря на наши усилия, законопроекту удалось собрать достаточно оппозиции, чтобы эффективно победить его. Отчасти из-за письма вице-президента, а также шагов, сделанных республиканцами, законопроект был полностью разрушен, с 170 за и 265 против в Палате представителей, и законопроект не смог продвинуться в Сенат. Кроме того, многие отвернулись от Рузвельта из-за того, что они описывают как попытку диктатуры."
  usa_armor.810.a:0 "Какое облегчение"
  usa_armor.810.b:0 "Проклятье"

  usa_armor.814.t:0 "США против Батлера: 0 Закон о регулировании сельского хозяйства признан неконституционным"
  usa_armor.814.d:0 "Сегодня Верховный суд США постановил, что Закон о регулировании сельского хозяйства является неконституционным. В деле «США против Батлера» было решено, что налог на производителей является неконституционным, поскольку он не является истинным налогом, поскольку он облагал налогом переработчиков сельскохозяйственных товаров только для того, чтобы дать деньги фермерам, а также попытку контролировать сельскохозяйственные цены, выходящие за рамки перечисленных полномочий Конституции. Это решение ставит заслон в усилиях по оказанию помощи фермерам."
  usa_armor.814.a:0 "Что-то должно быть сделано с этим судом."
  usa_armor.815.t:0 "Сидячая забастовка в городе Флинт"
  usa_armor.815.d:0 "Сегодня Объединение рабочих автомобильной промышленности организовало широкомасштабную забастовку на заводе General Motors во Флинте. Впервые применив новую тактику забастовки, в отличие от пикетирования, придумали «сидячую забастовку», рабочие заняли завод, не дав GM нанять штрейкбрехеров. Чтобы поддерживать закон и порядок, мы могли бы вмешаться, чтобы добиться компромисса, однако отказ от этого сохранит нашу поддержку со стороны профсоюзов, значительной части коалиции демократических партий."
  usa_armor.815.a:0 "Пусть профсоюз и завод сами разбираются"
  usa_armor.815.b:0 "Отправьте армию, чтобы добиться компромисса"

  usa_armor.816.t:0 "Письмо Эйнштейна Рузвельту"
  usa_armor.816.d:0 "Сегодня на наших столах оказалось письмо, составленное всемирно известными учеными Альбертом Эйнштейном и Лео Сцилардом, беженцами из Европы. В письме оба заявляют, что существует вероятность того, что Германия разрабатывает бомбу, работающую на расщеплении атомов, чтобы произвести взрыв, последствия которого будут катастрофическими. Они призывают нашу администрацию начать разработку аналогичной бомбы в качестве контрмеры потенциальным немецким разработкам."
  usa_armor.816.a:0 "Необходимо рассмотреть эту возможность"

  usa_armor.817.t:0 "Рецессия Рузвельта"
  usa_armor.817.d:0 "Внезапное сокращение бюджета привело к резкому спаду американской экономики. Учитывая, что уровень безработицы стал самым высоким с начала депрессии, ясно, что восстановление американской экономики займет больше времени, чем ожидалось."
  usa_armor.817.a:0 "Что-то должно быть сделано"
  usa_armor.817.b:0 "Это сработает в конце концов"

  usa_armor.818.t:0 "Америка обещает помощь"
  usa_armor.818.d:0 "С ростом поддержки войны в Соединенных Штатах был принят недавний законопроект, в котором Америка может оказывать косвенную помощь, помогая с экономической и военной помощью. Мы надеемся, что поставки оружия и топлива будут в ближайшие годы."
  usa_armor.818.a:0 "Самый желанный спасательный круг"

  usa_armor.819.t:0 "США хотят присоединиться к союзникам"
  usa_armor.819.d:0 "При поддержке из дома Соединенные Штаты официально направили просьбу присоединиться к союзникам, чтобы начать помогать военным усилиям и свергнуть фашистскую тиранию. Наличие такого гиганта рядом с нами заставит ось пожелать, чтобы они не пошли на войну."
  usa_armor.819.a:0 "Приветствие нашим новым союзникам"
  usa_armor.819.b:0 "Нам не нужна их помощь"

  usa_armor.820.t:0 "Торпедный кризис США"
  usa_armor.820.d:0 "Во время нашего первого морского боя и тренировок мы обнаружили серьезные проблемы с нашими торпедами. Мы установили, что существуют серьезные проблемы в том, что торпеда работает слишком глубоко, преждевременная детонация, отказы взрыва и торпеда движется круговыми, а не линейными движениями. По сути, нам нужно прекратить производство наших дефектных торпед и срочно заняться устранением этих проблем, которые на какое-то время оставят нас уязвимыми."
  usa_armor.820.a:0 "Мы должны быть осторожны, пока это не будет исправлено"

  usa_armor.821.t:0 "Исправлены проблемы со взрывом торпеды."
  usa_armor.821.d:0 "Наши ученые обнаружили проблемы с магнитным воздействием взрывателя и любые проблемы с преждевременными взрывами. Кроме того, были установлены новые гироскопы, которые также фиксируют любые круговые движения нашей торпеды. Ожидается, что это резко увеличит количество попаданий наших торпед, хотя есть еще некоторые проблемы, которые необходимо исправить."
  usa_armor.821.a:0 "Превосходно"

  usa_armor.822.t:0 "Исправлены проблемы с глубиной торпеды."
  usa_armor.822.d:0 "Новые улучшения в плавучести торпеды устранили проблемы с слишком глубоким бегом нашей торпеды"
  usa_armor.822.a:0 "Превосходно"

  usa_armor.870.t:0 "Тегеранская конференция"
  usa_armor.870.d:0 "Мы разделяем Германию как общего врага с Советами, и нам было бы выгодно использовать это, чтобы организовать встречу и превратить ее в великий союз между нашими фракциями. Возможно, мы сможем возглавить эти переговоры и заставить Советы использовать силы против Японии и, возможно, открыть больше дипломатических отношений с азиатскими странами, такими как Турция, используя советское влияние. Однако следует ожидать трений из-за наших противоположных идеологий."
  usa_armor.870.a:0 "Нам следует послать делегацию"

  usa_armor.871.t:0 "Тегеранская конференция"
  usa_armor.871.d:0 "Союзники направили с нами делегацию, чтобы начать переговоры и обсудить стратегию. Их главная цель — заставить нас направить силы против Японии. Мы, конечно, согласимся на это только после того, как с Германией будет решен вопрос, но, хотя мы еще можем их отвернуть, это хорошая возможность укрепить наши связи с союзниками, которые могут оказаться полезными в открытии для нас новых рынков. Мы также могли бы оказать давление на союзников, чтобы они придерживались более агрессивной стратегии в отношении Германии и взяли на себя большее бремя, когда дело дойдет до войны."
  usa_armor.871.a:0 "Это хорошая возможность"

  usa_armor.872.t:0 "Тегеранская конференция"
  usa_armor.872.d:0 "После того, как Советы согласились на конференцию, они обязались объявить войну Японии после того, как будет решен вопрос с Германией. Но они ожидают, что мы внесем больший вклад в победу над Осью."
  usa_armor.872.a:0 "Превосходный результат"

  usa_armor.874.t:0 "Война с Японией"
  usa_armor.874.d:0 "По итогам Тегеранской конференции мы обязаны объявить войну Японии и вместе с нашими союзниками положить конец восходящему солнцу. Наши советники уверены в нашей силе, так как Япония уже очень давно находится в состоянии войны, ее резервы и техника наверняка почти исчерпаны."
  usa_armor.874.a:0 "Давайте размолотим их"

  usa_armor.875.t:0 "Восточный мирный договор"
  usa_armor.875.d:0 "С нашей победой на Востоке настало время разрезать завоеванные земли."
  usa_armor.875.a:0 "Победа!"

  usa_armor.876.t:0 "США предлагают экономическую помощь"
  usa_armor.876.d:0 "Конгресс США одобрил план Маршалла по оказанию помощи в восстановлении Европы. Согласно плану, США обратились к нам с экономической помощью, чтобы помочь уменьшить нашу экономическую усталость во время войны и восстановить нашу поврежденную экономику. Это также позволит быстрее завершить любые строительные проекты. Однако взамен мы должны принять политику свободной торговли, а также начать демилитаризацию, и, конечно, принять доминирование США в нашей фракции. Помощь по плану Маршалла продлится 3 годы, если будет принята"
  usa_armor.876.a:0 "Мы принимаем это щедрое предложение."
  usa_armor.876.b:0 "Мы восстановим себя"

  usa_armor.877.t:0 "[From.GetName] предлагает воссоединение Австрии"
  usa_armor.877.d:0 ""
  usa_armor.877.a:0 "Если они остаются нейтральными"

  usa_armor.878.t:0 "[From.GetName] принял нейтральное объединение"
  usa_armor.878.d:0 ""
  usa_armor.878.a:0 "Это будет достаточно хорошо"

  usa_armor.879.t:0 "Меньшее количество накопленного богатства"
  usa_armor.879.d:0 "С уходом накопленного богатства некоторое время назад многие люди, которые пострадали, приняли меры, чтобы уменьшить количество застойного богатства и использовать его. Это означает меньше денег для нас, но мы получаем более здоровую экономику."
  usa_armor.879.a:0 "Мы сделали свою работу"
  usa_armor.879_tt:0 "Снижает затраты на товары народного потребления, но повышает скорость строительства и добычу ресурсов благодаря §Yналогу на накопленное богатство§!."

  usa_armor.1000.t:0 "Выборы 1936"
  usa_armor.1000.d:0 "Настал день президентских выборов. Действующий президент Франклин Делано Рузвельт уже реализовал несколько программ, которые в совокупности называются «Новый курс», призванный вывести США из Великой депрессии. Хотя многие усилия были популярны, его планы по дальнейшему расширению роли и власти правительства были встречены критикой со стороны его оппонента, республиканца Альфа Лэндона. Лэндон хочет видеть большую экономическую свободу, в то время как Рузвельт и Демократическая партия хотят расширить социальное обеспечение и обеспечить экономическую стабильность. Выборы могут быть близким звонком или крупной победой демократов."
  usa_armor.1000.a:0 "Рузвельт, конечно."

  usa_armor.1001.t:0 "Выборы 1940"
  usa_armor.1001.d:0 "С тех пор, как должность президента Соединенных Штатов была впервые учреждена, ни один президент не правил в течение трех последовательных сроков. Однако в свете нестабильного состояния мира и международных событий последних нескольких лет президент Рузвельт решил порвать с традицией и баллотироваться на третий срок. Республиканец Венделл Виллки, которого характеризуют как кандидата от «темной лошадки» с опытом работы в качестве промышленника с ограниченным политическим опытом, критически относился как к экономическому интервенционизму Рузвельта, так и к его оправданиям баллотироваться на третий срок. Хотя у кандидатов много общего во внешней политике, и Уиллки хочет сохранить некоторую форму Нового курса, многие по-прежнему считают эти выборы определяющим моментом для будущего американской демократии."
  usa_armor.1001.a:0 "Демократы. FDR незаменим."

  usa_armor.1002.t:0 "Выборы 1940"
  usa_armor.1002.d:0 "С тех пор, как должность президента Соединенных Штатов была впервые учреждена, ни один президент не правил в течение трех последовательных сроков. Однако в свете нестабильного состояния мира и международных событий последних нескольких лет президент Рузвельт решил порвать с традицией и баллотироваться на третий срок. Республиканец Уэнделл Уиллки, которого характеризуют как кандидата от «темной лошадки» с опытом работы в качестве промышленника с ограниченным политическим опытом, критиковал как экономический интервенционизм Рузвельта, так и его оправдания, за то, что он баллотировался на третий срок, и резко критиковал принятие законопроекта о судебной реформе. Хотя у кандидатов много общего во внешней политике, и Уиллки хочет сохранить некоторую форму Нового курса, многие по-прежнему считают эти выборы определяющим моментом для будущего американской демократии."
  usa_armor.1002.a:0 "Демократы. FDR незаменим."
  usa_armor.1002.b:0 "Республиканцы. Мы хотим Уиллки!"

  usa_armor.1003.t:0 "Выборы 1944"
  usa_armor.1003.d:0 "Президентство Франклина Д. Рузвельта было исключительным во многих отношениях. Несмотря на ухудшение здоровья и беспрецедентную продолжительность своего президентства, он стремится продолжать руководить нашей страной посредством военных усилий. Республиканцы были ограничены в выборе кандидатов из-за многих потенциальных кандидатов, служащих в войне, но выбрали губернатора Томаса Дьюи, чтобы представлять их. \n\nRoosevelt продолжает пользоваться народной поддержкой, но многие подозревают, что он может не дожить до конца своего срока. Но достаточно ли этого, чтобы дать Дьюи победу над человеком, который завел нас так далеко?"
  usa_armor.1003.a:0 "ФДР победил Дьюи."

  usa_armor.1100.t:0 "Выборы в Конгрессе"
  usa_armor.1100.d:0 "С завершением еще одного избирательного цикла народ высказался, и конгресс был перестроен в соответствии с его интересами."
  usa_armor.1100.a:0 "Нам придется работать с этим"

  usa_armor.880.t:0 "Переговоры с Ford и Chrysler"
  usa_armor.880.d:0 "Генри Форд, владелец Ford Motor Comapny, и Уолтер Крайслер, владелец Chrysler Corporation, не видят немедленной необходимости в капитальном перевооружении для размещения военной промышленности, поскольку мы находимся в мире. Они оба очень недовольны тем, что их наказали за Великую депрессию через Новый курс. На данный момент Ford и Chrysler будут принимать только ограниченные правительственные заказы и конвертировать только небольшие части своей промышленной базы в военное производство."
  usa_armor.880.a:0 "Это начало, я полагаю."

  usa_armor.881.t:0 "Переговоры с GM и DuPont"
  usa_armor.881.d:0 "Пьер Дюпон, владелец General Motors и DuPont Company, не видит немедленной необходимости в капитальном перевооружении для размещения военной промышленности, поскольку мы находимся в мире. Дюпон все еще злится на то, что его очерняют как «Торговца смертью» расследованиями Governemnt. На данный момент GM и DuPont будут принимать только ограниченные правительственные заказы и конвертировать только небольшие части своей промышленной базы в военное производство."
  usa_armor.881.a:0 "Это начало, я полагаю."

  usa_armor.882.t:0 "Переговоры с J.P. Morgan"
  usa_armor.882.d:0 "J.P. Morgan-младший, владелец банковского конгломерата J.P. Morgan, всегда стремится помочь правительству США в виде кредитов. Морган все еще в ярости из-за того, что его обвиняют в великом крахе фондового рынка и начале Великой депрессии, но бизнес для него бизнес. В обмен на более благоприятный прогноз по его банку со стороны правительства США, он может предоставить нам очень выгодные варианты кредитования."
  usa_armor.882.a:0 "Как он сказал, бизнес — это бизнес."

  usa_armor.883.t:0 "Ford строит автомобильный комплекс в Толедо"
  usa_armor.883.d:0 "Форд построил один из крупнейших заводов в мире - Автомобильный комплекс Толедо, для массового производства джипов и грузовиков в невиданных ранее масштабах. Это должно поддерживать надлежащую моторизацию армии Соединенных Штатов, в дополнение к остальной части союзников."
  usa_armor.883.a:0 "Союзникам нужны наши грузовики"

  usa_armor.884.t:0 "Chrysler строит Детройтский арсенал"
  usa_armor.884.d:0 "Компания Chrysler построила крупнейший в мире завод в Детройте, чтобы наладить массовое производство танков в невиданных ранее масштабах. Это позволит производить более чем достаточно танков для снабжения наших бронетанковых войск и наших союзников."
  usa_armor.884.a:0 "Это должно помочь военным усилиям"

  usa_armor.885.t:0 "Ford повторно активирует Willow Run"
  usa_armor.885.d:0 "Чтобы поэкспериментировать с производством самолетов до Великой депрессии, Форд построил крупнейший в мире завод по производству самолетов - Willow Run. Он был закрыт из-за отсутствия спроса после экономического краха, но если его снова открыть, это будет самый эффективный авиационный завод в мире. Эдсел Форд утверждает, что бомбардировщики будут сходить с конвеера каждый час. "
  usa_armor.885.a:0 "Вы говорите, Б-24 каждый час?"

  usa_armor.886.t:0 "Полное сотрудничество с Ford и Chrysler"
  usa_armor.886.d:0 "После начала войны Генри Форд и Уолтер Крайслер решили отложить свои хватки с правительством США и помочь любым возможным способом для победы. Они предлагают помочь построить новые заводы по производству боеприпасов, а также полностью переоборудовать свою производственную базу для производства военной техники, в частности джипов, грузовиков и танков."
  usa_armor.886.a:0 "Нам нужно все, что мы можем получить"

  usa_armor.887.t:0 "Полное сотрудничество с GM и DuPont"
  usa_armor.887.d:0 "После начала войны Пьер Дюпон решил отложить свою вражду с правительством США о том, чтобы быть «торговцем смертью» и снова вернуться к титулу, чтобы помочь Союзническому делу войны. Он предлагает General Motors помощь в повышении эффективности военного производства и DuPont Corporation помощь в исследованиях и разработке новых видов оружия и взрывчатых веществ."
  usa_armor.887.a:0 "Нам нужно все, что мы можем получить"

  usa_armor.888.t:0 "Займы от J.P. Morgan "
  usa_armor.888.d:0 "Война — одна из самых дорогих вещей, которые может сделать правительство. Поскольку правительство США не может оплатить весь счет, чтобы спасти мир, J.P. Morgan-младший вмешался и предложил не только покрыть разницу, но и предложить нам чрезвычайно выгодные кредиты, чтобы погасить остальное. Это сделка, от которой мы не можем отказаться."
  usa_armor.888.a:0 "Маленькая инфляция никому не повредит"
  usa_armor.888.b:0 "Думаю, мы можем напечатать больше сами."

  usa_armor.889.t:0 "Ford помогает Kaiser"
  usa_armor.889.d:0 "Отчаянные времена требуют отчаянных мер. Хотя магия сборочных линий Ford является коммерческой тайной, мы убедили Ford научить Kaiser кое-чему о массовом производстве. Благодаря этим новым знаниям Кайзер может производить корабли с огромной скоростью."
  usa_armor.889.a:0 "Делиться заботой"

  usa_armor.891.t:0 "Форд строит завод в Ричмонде"
  usa_armor.891.d:0 "Чтобы облегчить массовое производство танков и авиадвигателей, Форд предлагает расширить один из своих крупнейших заводов — завод Форда в Ричмонде, штат Калифорния. Это обеспечит превосходный крупный производственный центр на Западном побережье для военных."
  usa_armor.891.a:0 "Это должно помочь военным усилиям"

  USA_congress_info:0 "Новая информация о системе Конгресса"
  USA_depression_relief:0 "Спасение от депрессии"
  USA_deal_with_rosevelt_depression_economy:0 "Рестимулирование экономики"
  USA_waited_out_rosevelt_depression_economy:0 "Рецессия оттаивает"
  USA_rosevelt_depression_crisis:0 "Рецессия Рузвельта"
  USA_rosevelt_depression_crisis_desc:0 "С внезапным сокращением государственных расходов безработица снова начала расти, экономика еще больше пришла в упадок. Если мы не примем срочных мер, это может иметь драматические последствия."

  afo_news.1.t:0 "Высадка союзников в Нормандии"
  afo_news.1.d:0 "Союзные силы начали то, что могло стать последним ударом против Оси, с вторжения в Нормандию. Время покажет, станет ли это первым шагом к победе и окончанию войны."
  afo_news.1.a:0 "Мы должны немедленно сокрушить этот новый фронт!"
  afo_news.1.b:0 "Вперед!"
  afo_news.1.c:0 "Наконец-то"
  afo_news.1.e:0 "Мировая сцена меняется"

  afo_news.2.t:0 "Победа Оси в Северной Африке"
  afo_news.2.d:0 "Силы Оси теперь полностью контролируют Северную Африку, получив важный Суэцкий канал и контроль над Ближним Востоком. Это серьезная неудача для союзных войск, которые теперь возлагают свои надежды на СССР."
  afo_news.2.a:0 "Теперь мы сосредоточим все усилия против большевиков!"
  afo_news.2.b:0 ""
  afo_news.2.c:0 "Мы победим в одиночку, если придется"
  afo_news.2.e:0 "Мировая сцена меняется"

  afo_news.3.t:0 "Победа союзников в Северной Африке"
  afo_news.3.d:0 "Войска союзников вытеснили силы Оси в Северной Африке, теперь у них есть шанс открыть второй фронт на юге Европы и они на один шаг приблизились к окончанию Второй мировой войны."
  afo_news.3.a:0 "Мы должны победить в Европе, чтобы компенсировать это поражение."
  afo_news.3.b:0 "Победа в наших руках"
  afo_news.3.c:0 "Мы обязаны первыми взять Берлин"
  afo_news.3.e:0 "Мировая сцена меняется"

  afo_news.4.t:0 "Польское восстание в Варшаве"
  afo_news.4.d:0 "После длительного периода немецкой оккупации войска польского подполья поднялись, чтобы освободить свою столицу. Польская армия под руководством моих бывших офицеров начала наступление на оккупационные силы по всему городу. Звуки выстрелов и взрывов резонируют на улицах Варшавы; для немецких угнетателей Польши — это звуки восстания, для поляков — отголоски свободы."
  afo_news.4.a:0 "Мы должны немедленно ликвидировать это восстание!"
  afo_news.4.b:0 "Желаем им удачи"
  afo_news.4.c:0 "Пусть они кровоточат"
  afo_news.4.e:0 "У них нет шансов."

  afo_news.5.t:0 "Гитлер был убит"
  afo_news.5.d:0 "Уговор избавиться от Гитлера удался"
  afo_news.5.a:0 "Что это будет означать для нашего альянса?"
  afo_news.5.b:0 "Наш враг рушится изнутри!"
  afo_news.5.c:0 "Долой нацистов!"
  afo_news.5.e:0 "Действительно, сюрприз"

  afo_news.6.t:0 "Италия разразилась гражданской войной"
  afo_news.6.d:0 "Итальянский народ потерял веру в Муссолини после потери его колоний и Сицилии. Во главе с фельдмаршалом Пьетро Бадольо и королем Эммануилом III итальянские сепаратисты взяли под контроль его острова и южное побережье. Это прокладывает путь к высадке союзников и окончательной главе фашистской Италии."
  afo_news.6.a:0 "Какая катастрофа"
  afo_news.6.b:0 "Давайте воспользуемся этой возможностью!"
  afo_news.6.c:0 "Фашисты бесхребетны"
  afo_news.6.e:0 "Нисколько не удивлен"

  afo_news.7.t:0 "Гитлер совершает самоубийство"
  afo_news.7.d:0 "После решительного вторжения в Германию Гитлер предпочел самоубийство бегству из Берлина, эта потеря нанесла огромный удар по моральному духу немцев, и раздаются призывы как к прекращению войны, так и к осуществлению мести. В своей последней воле и завещании Гитлер избрал Карла Деница, командующего военно-морским флотом, штатсобергауптом, главой государства.Дениц объявил, что война будет продолжаться до тех пор, пока страна не будет спасена от неминуемого поражения, однако сомнительно, что немецкие войска смогут оказать сколько-нибудь значимое сопротивление."
  afo_news.7.a:0 "Наш народ теряет надежду"
  afo_news.7.b:0 "Мы на пороге победы"
  afo_news.7.c:0 "Интересно"
  afo_news.7.e:0 "Мы приближаемся к поражению"

  afo_news.8.t:0 "Виши Северная Африка переключается!"
  afo_news.8.d:0 "Со многими провинциями Франции Виши в союзническом контроле и быстро растущей легитимностью Свободной Франции, глава французской Северной Африки, адмирал Дарлан приказал всем силам Виши присоединиться к союзническим усилиям против оси. Это огромный удар по режиму Виши и оси в Северной Африке и дает союзникам уникальную возможность взять под полный контроль регион."
  afo_news.8.a:0 "Большая катастрофа!"
  afo_news.8.b:0 "Узел затягивается..."
  afo_news.8.c:0 "Французам нельзя доверять"
  afo_news.8.e:0 "Удивительный поворот событий!"

  afo_news.9.t:0 "Рузвельт произносит речь «Арсенал демократии»."
  afo_news.9.d:0 "Сегодня в своей 16-й беседе у камина Рузвельт призвал американский народ осознать опасность, которую агрессия Оси представляет для Соединенных Штатов. Вдохновленный падением Франции и изоляцией Британии, Рузвельт призвал американский народ осознать, что Атлантический и Тихий океаны не гарантируют безопасности Соединенных Штатов, указав, что многие немецкие бомбардировщики легко могут достичь США. Наиболее узнаваемой частью речи была ее определяющая фраза, в которой Рузвельт заявил: «Мы должны быть великим арсеналом демократии. Для нас это чрезвычайная ситуация, такая же серьезная, как и сама война». В то время как США постепенно отказывались от изоляционизма. На данный момент это категорический сигнал Оси о том, что Америка будет готова защищать свои интересы за границей, независимо от ее прежнего нейтралитета."
  afo_news.9.1:0 "Мы должны быть готовы защищать демократию"
  afo_news.9.2:0 "Беспокойно"
  afo_news.9.3:0 "Вместе мы должны защищать демократию"
  afo_news.9.4:0 "Интересно"

  afo_news.10.t:0 "Речь Хайле Селассие"
  afo_news.10.d:0 "После завоевания Эфиопии ее бывший лидер Хайле Селассие сбежал в штаб-квартиру Лиги Наций, чтобы объявить о последних событиях. Селассие осудил итальянскую агрессию и раскритиковал мировое сообщество за бездействие. В заключение своего выступления, которое позже стало заголовком во всем мире, он сказал: «Сегодня это мы. Завтра это будете вы». Хотя многие справедливо критикуют Великобританию и Францию, обе страны не готовы к какому-либо вмешательству. Именно из-за этого и предыдущих неудач Лиги эксперты сходятся во мнении, что это был последний гвоздь в крышку гроба Лиги Наций."
  afo_news.10.a:0 "Никто не встанет у нас на пути"
  afo_news.10.b:0 "Мы не выполнили свой долг"
  afo_news.10.c:0 "Что за притворство"

  afo_news.11.t:0 "Победа Японии в Тихом океане"
  afo_news.11.d:0 "Японская империя господствует на Тихом океане, контролируя весь Тихий океан и океанический континент, и нет никакой надежды на сдерживание японской армии и военно-морских сил. Чтобы остановить дальнейшее продвижение на запад в Центральную Азию и на Ближний Восток, союзники решили подписать мир с Японией, уступив территорию и военно-морские базы японцам и возвести мир между ними. Празднования по всей Империи продолжаются, и восстановление континента начинается, пока мы говорим, но уже есть сомнения относительно того, будет ли этот мир продолжаться. США остаются мировой сверхдержавой и крайне враждебны японцам, а военные расходы остаются высокими. Будущее Империи будет зависеть от того, насколько хорошо она сможет интегрировать свои новые территории и укрепить их."
  afo_news.11.a:0 "Во славу Империи!"
  afo_news.11.b:0 "Очень тревожная ситуация"
  afo_news.11.c:0 "Как непредвиденно"

  afo_news.12.t:0 "Победа союзников на Тихом океане"
  afo_news.12.d:0 "С капитуляцией японцев война на Тихом океане подошла к концу. Император Хирохито подписал безоговорочную капитуляцию с союзными державами и приказал прекратить все военные операции на всей территории Японской империи. Однако капитуляция не была принята по всей стране: некоторые опорные пункты отказались сдаться, а императорский дворец на короткое время даже предпринял попытку восстания.\nОднако США направили тысячи военных солдат в Токио и остальную часть Японии, чтобы предотвратить организованное сопротивление и начало процесс восстановления и дерадикализации Японии. Большая часть Восточной Азии находится в руках союзников, создавая ощущение стабильности в регионе, однако еще неизвестно, как Китай и Советский Союз отреагируют на поражение Японии."
  afo_news.12.a:0 "Мы боролись до конца"
  afo_news.12.b:0 "Победа над Японией!"
  afo_news.12.c:0 "Отличная победа"

  afo_news.13.t:0 "Победа Оси в Европе"
  afo_news.13.d:0 "Оси торжествуют в Европе. Союзников выгнали, а Советы потерпели поражение. Одна победа за другой немецкая военная машина доказала, что может победить, несмотря на все шансы. Без надежды на какое-либо значимое сопротивление Соединенные Штаты решили подписать белый мир с Германским рейхом, отказавшись от своих союзников в Европе и реорганизовав то, что осталось в Америке. Хвастовство \nHitler о тысячелетнем рейхе теперь видит свет, но разговоры о третьей мировой войне - это не слухи. Без сомнения, США и Германия остаются в состоянии повышенной боевой готовности и крайне враждебны друг к другу, мы увидим в ближайшие несколько лет, будет ли Германия продолжать оставаться сильной или разразится в гражданской войне, движимой жаждой власти, или союзники вернутся так или иначе."
  afo_news.13.a:0 "Мы принимаем только окончательную победу!"
  afo_news.13.b:0 "Ужасный результат"
  afo_news.13.c:0 "Потрясающая победа"

  afo_news.14.t:0 "Союзническая победа в Европе"
  afo_news.14.d:0 "С капитуляцией Германии и Италии война в Европе практически закончилась. Европа стоит среди полного опустошения и в центре нового разрыва между двумя сверхдержавами мира. Территории, находящиеся под советским контролем, платят высокую цену, и мало надежды на их свободу, а районы, находящиеся под контролем союзников, остаются в полном опустошении, так и не оправившись от великой войны полностью. Они будут зависеть от очень необходимой помощи со стороны США. Это знаменует собой конец фашизма в Европе, и хотя это повод для большого празднования, эксперты и лидеры уже рассматривают возможность третьей мировой войны. Каково бы ни было будущее, одно является ключевым, союзники торжествуют, но впереди еще много дорог."
  afo_news.14.a:0 "Победа!"
  afo_news.14.b:0 "Великая победа Родины!"
  afo_news.14.c:0 "Выдающаяся победа"

  afo_news.15.t:0 "Италия подписывает перемирие"
  afo_news.15.d:0 "После катастрофических потерь территории и людей. Италия свергла Муссолини и подписала перемирие с союзниками, положив конец войне за итальянцев. Северная Африка остается в руках союзников, а Италия находится под частичной оккупацией союзников до окончания войны. Без сомнения, удар по державам оси, мы задаемся вопросом, какова может быть реакция Германии на это."
  afo_news.15.a:0 "Предатели!"
  afo_news.15.b:0 "Огромная победа для нас"
  afo_news.15.c:0 "Мы обеспечили свое выживание"
  afo_news.15.e:0 "Большой удар по альянсу Оси"

  afo_news.16.t:0 "Конец Зимней войны"
  afo_news.16.d:0 "После захвата города Ленинград финскими войсками финское правительство вынудило Советы подписать мирное соглашение. Такой катастрофический результат для Советов не мог быть предсказан и является большой победой для финнов, которым другие страны не стоит их недооценивать."
  afo_news.16.a:0 "Великая Победа!"
  afo_news.16.b:0 "Как такое могло случиться!"
  afo_news.16.c:0 "Это беспрецедентно"

  afo_news.17.t:0 "[From.GetName] формирует северное сияние"
  afo_news.17.d:0 "Стремясь сдержать иностранную агрессию в Скандинавии, [From.GetName] предпринимает политические шаги в направлении создания нового альянса в регионе. [From.GetFactionName], по словам [From.GetLeader], гарантирует защиту всех скандинавских народов от иностранной агрессии."
  afo_news.17.a:0 "Мы будем сильными"
  afo_news.17.b:0 "Будем надеяться, что их интересы не будут противоречить нашим."
  afo_news.17.c:0 "Это может вызвать беспокойство."

  afo_news.18.t:0 "Финляндия уступила Аландские острова"
  afo_news.18.d:0 "Стремясь улучшить отношения со Швецией, Финляндия решила уступить Аландские острова, положив конец этому спорному вопросу. Это, несомненно, приведет к расширению сотрудничества между двумя странами в гражданских и, возможно, военных вопросах."
  afo_news.18.a:0 "Для большего блага Финляндии"
  afo_news.18.b:0 "Это хороший результат"
  afo_news.18.c:0 "Интересный результат"

  afo_news.19.t:0 "Финляндия охвачена гражданской войной!"
  afo_news.19.d:0 "Расколотая коммунистическая фракция в Финляндии направилась к Хельсинки и захватила столицу после многочисленных стычек, теперь это переросло в полномасштабную гражданскую войну, начавшую Вторую гражданскую войну в Финляндии. Иностранные аналитики считают, что коммунисты медленно распространяли недовольство в Финляндии, дестабилизируя страну и позволяя им тайно привозить людей и оружие в ожидании поглощения. Время покажет, кто победит."
  afo_news.19.a:0 "За большую Финляндию!"
  afo_news.19.b:0 "Наши товарищи поднимаются!"
  afo_news.19.c:0 "Коммунистическая угроза распространяется"
  afo_news.19.e:0 "Это вызывает беспокойство"

  afo_news.20.t:0 "[SIK.GetName] аннексирован!"
  afo_news.20.d:0 "Министр иностранных дел России объявил сегодня об объединении Монгольской территории в Советский Союз. Монголы, казалось, были очень рады празднованию объединения, хотя за ними внимательно следили советские гвардейцы."
  afo_news.20.a:0 "Синки-ваа?"
  afo_news.20.b:0 "Слава Советскому Союзу!"

  afo_news.21.t:0 "[SIK.GetName] принят в состав государства [SOV.GetName]!"
  afo_news.21.d:0 "Компания [SOV.GetName] объявила [SIK.GetName] своим новым участником. С присоединением Монголии Союз на востоке становится все больше. КПСС, казалось, была довольна своим членством, принятым после новой войны, которая разразилась между [CHI.GetName] и [JAP.GetName], когда они привели свою страну в новую эру безопасности."
  afo_news.21.a:0 "Для свободной Восточной Азии..."
  afo_news.21.b:0 "Вместе, товарищи!"

  afo_news.22.t:0 "[SOV.GetName] присоединился к [EST.GetName]"
  afo_news.22.d:0 "После ультиматума, данного [SOV.GetName], правительство [EST.GetName] согласилось разрешить советским войскам въезжать в страну после того, как [SOV.GetName] потребовал заключения пакта о взаимной помощи путем создания военных баз в Эстонии. Тем не менее, теперь сообщения показывают, что авиабазы и порты были захвачены советскими военными, и вынужденные выборы привели к тому, что [EST.GetName] был присоединен к [SOV.GetName]. Многие наблюдатели сочувствуют эстонскому народу в том, что они называют враждебным захватом."
  afo_news.22.a:0 "Наслаждайтесь захватом земли, Советы. Ты будешь следующим."
  afo_news.22.b:0 "Советская экспансия на Запад? Это должно стать интересным..."
  afo_news.22.c:0 "Я надеюсь, что их голоса будут подсчитаны..."
  afo_news.22.e:0 "Еще одно замечательное дополнение к моей коллекции."

  afo_news.23.t:0 "[SOV.GetName] присоединился к [LAT.GetName]"
  afo_news.23.d:0 "После ультиматума, данного [SOV.GetName], правительство [LAT.GetName] согласилось разрешить советским войскам войти в страну после того, как [SOV.GetName] потребовал заключения пакта о взаимной помощи, создав военные базы в Латвии. Тем не менее, теперь сообщения показывают, что авиабазы и порты были захвачены советскими военными, и вынужденные выборы привели к тому, что [LAT.GetName] был присоединен к [SOV.GetName]. Многие наблюдатели сочувствуют латышскому народу в том, что они называют враждебным захватом."
  afo_news.23.a:0 "Наслаждайтесь захватом земли, Советы. Ты будешь следующим."
  afo_news.23.b:0 "Советская экспансия на Запад? Это должно стать интересным..."
  afo_news.23.c:0 "Я надеюсь, что их голоса будут подсчитаны..."
  afo_news.23.e:0 "Еще одно замечательное дополнение к моей коллекции."

  afo_news.24.t:0 "[SOV.GetName] присоединился к [LIT.GetName]"
  afo_news.24.d:0 "После ультиматума, данного [SOV.GetName], правительство [LIT.GetName] согласилось разрешить советским войскам войти в страну после того, как [SOV.GetName] потребовал заключения их пакта о взаимопомощи путем создания военных баз в Литве. Тем не менее, теперь сообщения показывают, что авиабазы и порты были захвачены советскими военными, и вынужденные выборы привели к тому, что [LIT.GetName] был присоединен к [SOV.GetName]. Многие наблюдатели сочувствуют литовскому народу в том, что они называют враждебным захватом."
  afo_news.24.a:0 "Наслаждайтесь захватом земли, Советы. Ты будешь следующим."
  afo_news.24.b:0 "Советская экспансия на Запад? Это должно стать интересным..."
  afo_news.24.c:0 "Я надеюсь, что их голоса будут подсчитаны..."
  afo_news.24.e:0 "Еще одно замечательное дополнение к моей коллекции."

  afo_news.25.t:0 "Победа оси в России"
  afo_news.25.d:0 "После долгих лет сражений ось торжествует в России. Продвигаясь мимо Урала, Советы лежали избитые и побежденные. Одно сражение за другим немецкая военная машина доказала, что может победить, несмотря на шансы. Потеряв большую часть своей промышленности, населения и армии, Советы подписали мирный договор о войне, которую они не могут выиграть. Цели \nHitler на Востоке теперь выполнены, но нет сомнений, что Советы будут использовать это время, чтобы попытаться восстановить свои силы для завоевания. Без сомнения, новая граница между Советами и Германией остается в состоянии повышенной готовности."
  afo_news.25.a:0 "Мы достигли своего жизненного пространства!"
  afo_news.25.b:0 "Мы будем мстить..."
  afo_news.25.c:0 "Ужасный результат"
  afo_news.25.e:0 "Потрясающая победа"

  afo_news.26.t:0 "Вильгельм II возвращается в Германскую империю"
  afo_news.26.desc:0 "В неожиданном заявлении вчера утром немецкое правительство официально сняло изгнание с Вильгельма II. Позже в тот же день кортеж старого кайзера прошел голландско-немецкую границу, но с неожиданным поворотом кайзер, как защищал и одобрил своего сына Вильгельма III, чтобы занять трон вместо этого. Кайзер уже поклялся, что Германия вернется к своему старому величию, но он будет поддерживать со стороны, но еще предстоит выяснить, в каком направлении пойдет страна с ее дипломатией."
  afo_news.26.a:0 "Да здравствует кайзер!"
  afo_news.26.b:0 "Возвращение к началу века?"
  afo_news.26.c:0 "Мы внесли свой вклад в его безопасность."
  afo_news.26.d:0 "Мы должны были сильнее подтолкнуть голландцев к его экстрадиции!"

  afo_news.27.t:0 "Японское вторжение в Китай"
  afo_news.27.d:0 "После инцидента в Ояме и Япония, и Китай обвинили друг друга в эскалации растущей напряженности в Китае. Переговоры прервались после того, как Китаю были предъявлены требования полностью уйти из Шанхая, которые были категорически отвергнуты после боевых действий в Пекине и Тяньцзине. Шанхай стал следующим полем битвы в конфликте, который теперь перерос в полномасштабную войну.\n\n У Японии есть преимущество в виде лучше оснащенной армии и авиации, но время покажет, сможет ли их остановить огромный масштаб Китая."
  afo_news.27.a:0 "Очередной провал Лиги Наций"
  afo_news.27.b:0 "Пришло время вернуть себе весь Китай!"
  afo_news.27.c:0 "Пришло время оккупировать весь Китай!"

  afo_news.28.t:0 "Падение Пекина"
  afo_news.28.d:0 "После нескольких недель боев крупномасштабные военные столкновения между Китаем и Японией в Пекине и Тяньцзине охватили весь регион, а Япония оттеснила китайцев дальше в Хэбэй.\n\n Обладая абсолютным превосходством Японии на море и в воздухе, китайская армия действительно могла не сохранить сплоченности и понести огромные потери в городах."
  afo_news.28.a:0 "Интересный результат"
  afo_news.28.b:0 "Мы недооценили соперника."
  afo_news.28.c:0 "Для многих побед впереди"

  afo_news.29.t:0 "Падение Шанхая"
  afo_news.29.d:0 "Вскоре после сражений за Пекин и Тяньцзинь китайские и японские войска перестреляли из стрелкового оружия районы Шанхая. Это противостояние привело к месяцам жестокой городской войны с тяжелыми потерями с обеих сторон, в конце концов упорного китайского сопротивления оказалось недостаточно, чтобы сдержать японские силы. С двумя великими победами, одержанными японцами, кажется, что в обозримом будущем войне не будет конца."
  afo_news.29.a:0 "Интересный результат"
  afo_news.29.b:0 "Мы недооценили соперника."
  afo_news.29.c:0 "Вперёд, на Нанкин!"

  afo_news.30.t:0 "Падение Уханя"
  afo_news.30.d:0 "После многих жестоких сражений в Ухане и его окрестностях японские войска наконец одержали победу, переправившись через реку и захватив ключевые районы Ухани. Нельзя недооценивать, насколько это наносит ущерб китайской промышленности и военным усилиям, мы можем только признать, что без помощи дни Китая сочтены."
  afo_news.30.a:0 "Большой поворот событий"
  afo_news.30.b:0 "Мы должны копать пятки"
  afo_news.30.c:0 "Китай калека!"

  afo_news.31.t:0 "Победа японцев в России"
  afo_news.31.d:0 "После долгих лет сражений японцы торжествуют в России. Захватив весь Дальний Восток, Советы потерпели поражение. Одна битва за другой, японская военная машина доказала, что может победить, несмотря на шансы. В рамках мирного соглашения Монголия уступает Сфере сопровождения и новому марионеточному режиму на Дальнем Востоке России. Время покажет, будет ли Советский Союз готовиться к возвращению этих территорий позднее."
  afo_news.31.a:0 "Оглушительный успех!"
  afo_news.31.b:0 "Мы будем мстить..."
  afo_news.31.c:0 "Ужасный результат"
  afo_news.31.e:0 "Потрясающая победа"

  afo_news.32.t:0 "[PRC.GetName]Победа в китайской гражданской войне"
  afo_news.32.d:0 "После долгих лет борьбы китайские коммунисты одержали победу в Китае. Захватив весь материковый Китай в кровавой борьбе, поддержка его народа помогла им свергнуть правящую фракцию националистов. У [PRC.GetName], без сомнения, есть планы на этот новый Китай, еще предстоит выяснить, что это за планы."
  afo_news.32.a:0 "Мы добились высшей победы!"
  afo_news.32.b:0 "Мы будем мстить..."
  afo_news.32.c:0 "Потрясающий результат"

  afo_news.33.t:0 "Великобритания эвакуируется в Канаду"
  afo_news.33.d:0 "После борьбы с немцами за каждый дюйм своего острова правительство и королевская семья Великобритании были вынуждены эвакуироваться. Кроме того, один миллион важных мужчин и женщин были эвакуированы через Королевский флот в случае, когда многие называют «Второй Дюнкерк». Несмотря на встречу с врагом на пляжах и борьбу с ним на посадочных площадках, гвардия была отброшена назад и захвачена. Британское правительство возобновит операции через пруд в Канаде, где они продолжат решительно противостоять врагам Ее Величества."
  afo_news.33.a:0 "Мы никогда не сдадимся!"
  afo_news.33.b:0 "Мы больше их не увидим."
  afo_news.33.c:0 "Падение империи"

  afo_news.34.t:0 "Смерть Сталина"
  afo_news.34.d:0 "Умер великий генеральный секретарь Коммунистической партии Советского Союза Иосиф Сталин, сообщила сегодня советская газета «Правда». Сообщается, что он умер медленной и мучительной смертью от кровоизлияния в мозг, внутреннего кровотечения мозга. Хотя он не оставил никаких рамок для преемственности, Президиум Центрального Комитета Коммунистической партии Советского Союза встретился сразу после смерти Сталина, чтобы обсудить коллективные шаги вперед для Союза. Его похороны планируется провести на Красной площади, а тело покоится в мавзолее Ленина."
  afo_news.34.a:0 "Да здравствует Сталин, Человек из стали!"
  afo_news.34.b:0 "Жаль, что это естественно"
  afo_news.34.c:0 "Смерть диктатора"

  afo_news.35.t:0 "Смерть Сталина"
  afo_news.35.d:0 "Умер генеральный секретарь Коммунистической партии Советского Союза Иосиф Сталин. Вскоре после их сокрушительного поражения и унизительного отступления на Урал и в Сибирь Иосиф Сталин умер от загадочных обстоятельств. В настоящее время нет новостей о том, была ли это естественная, случайная или нечестная игра. Многие подозревают, что его власть ослабла так же быстро, как и Союз, который он когда-то возглавлял. Завидует борьба за власть над развалинами Советского Союза. Будет ли это означать конец сталинизма или коммунизма в целом? Только время покажет."
  afo_news.35.a:0 "Он подвел нас. Настало время для появления нового лидера."
  afo_news.35.b:0 "Хорошая езда"
  afo_news.35.c:0 "Должно быть, это было \"самоубийство\""

  afo_news.36.t:0 "[SOV.GetName] уходит в гражданскую войну"
  afo_news.36.d:0 "Остатки Объединённых Социалистических Советских Республик окончательно отделились сегодня от явной борьбы за власть после смерти знаменитого лидера Иосифа Сталина. Неспособность ЦК определиться с будущим Советского Союза привела к тому, что внутренний круг Сталина схватился за власть. Георгий Маленков, которого многие считают «любимым» Сталиным, заручился поддержкой тех, кто до сих пор остается верным партии. И наоборот, Никита Хрущев смог заручиться поддержкой реформатора, стремящегося изменить многие политики Сталина к лучшему."
  afo_news.36.a:0 "Возможно, мы проиграли врагу, но мы не проиграем себе."
  afo_news.36.b:0 "Мы успешно открыли дверь. Сейчас мы наблюдаем, как вся гнилая структура рушится."
  afo_news.36.c:0 "Столько за то, что был «Союзом» социалистических советских республик."

  afo_news.37.t:0 "Объединение Польши и Литвы"
  afo_news.37.d:0 "По настоянию поляков Литва провела референдум о возможном воссоединении двух наций. Окончательный подсчет почти завершен, но уже ясно, что это ошеломительная победа для лагеря воссоединения. Поступали многочисленные сообщения о несоответствиях, фальсификациях и фальсификациях на выборах, но литовские чиновники отвергли эти обвинения и уже начали реформировать администрацию в региональное правительство польского государства. Хотя этот шаг очень приветствуется польской общественностью, политические последствия референдума, вероятно, будут остро ощущаться по всей Европе."
  afo_news.37.a:0 "Братские узы и несколько удобных взяток..."
  afo_news.37.b:0 "Это наша сфера влияния!"
  afo_news.37.c:0 "Польша может стать крупным игроком"
  afo_news.37.e:0 "Интересный результат"

  wtt_news.3.t:0 "Вильгельм II возвращается в Германскую империю"
  wtt_germany.4.b:0 "Лучше, чтобы он поддерживал страну со стороны"

  afo_news.38.t:0 "Итальянская гражданская война"
  afo_news.38.d:0 "В Италии разразилась гражданская война! Муссолини вышел из темноты, готовый вернуть титул Иль Дуче после своего увольнения, и большая часть итальянских вооруженных сил ответила на его призыв к оружию. \n\nHe установил крепость на севере, которая содержит большую часть итальянской промышленности, и его взгляды устремлены на Рим и Сицилию. Силы и добровольцы \n собрались под руководством короля, решив противостоять и положить конец угрозе Муссолини раз и навсегда. \n\nБитва за Италию началась."
  afo_news.38.a:0 "Удастся ли Муссолини?"
  afo_news.38.b:0 "К победе!"

  afo_news.39.t:0 "Конец гражданской войны в Италии"
  afo_news.39.d:0 "С капитуляцией последних оплотов фашистов гражданская война в Италии подошла к концу. Республиканцы одержали победу, и для Италии началась новая эра. Раздираемая войной страна сильно пострадала в боях, но амбиции Италии остаются. Время покажет, когда Италия сделает следующий шаг."
  afo_news.39.a:0 "Место рождения фашизма свергли"
  afo_news.39.b:0 "Теперь, чтобы исцелить нашу страну."

  afo_news.40.t:0 "Протектор Балкан"
  afo_news.40.d:0 "Стремясь стать доминирующей державой на Балканах, регион, известный своей изменчивостью, но невероятно ценный, Италия провозгласила себя своим защитником. Дипломатов с Балкан пригласили присоединиться к Италии под единым знаменем, но мы подождем и посмотрим, как каждый из них на это отреагирует. Протесты со стороны окружающих крупных держав также были поданы, поскольку они, возможно, свидетельствуют о прекращении там сферы влияния."
  afo_news.40.a:0 "Мы - маяк надежды для Балкан!"
  afo_news.40.b:0 "Настало время, чтобы порох был пойман"
  afo_news.40.c:0 "Противостояние с Италией неизбежно."
  afo_news.40.e:0 "Интересный ход Италии"
  afo_news.40.f:0 "Позволим ли мы Италии избежать этого?"

  afo_news.41.t:0 "Подписание Бейрутской конференции"
  afo_news.41.d:0 "Видеть совместную победу над[GER.GetNameDef]как неизбежное,[beirut_origin.GetNameDef]и[beirut_partner.GetNameDef]Мы стремимся к будущей стабильности в Германии.[beirut_origin.GetLeader]и[beirut_partner.GetLeader]Встречались, чтобы договориться о судьбе[GER.GetNameDef].\n\nДни переговоров привели к составлению новой карты Германии. Эта новая Германия разделена между Востоком и Западом с Францией, создающей марионеточное государство в Рейне.\n\nОстается выяснить, приведет ли это к прочному миру в Европе."
  afo_news.41.a:0 "Не хвалите за день до окончания вечера."
  afo_news.41.b:0 "Мы требовали того, что казалось правильным."
  afo_news.41.c:0 "Давайте быстро завершим эту войну."
  afo_news.41.e:0 "Это может быть конец [GER.GetNameDef]."

  afo_news.42.t:0 "Возвышение империи Тиоса"
  afo_news.42.desc:0 "Военное продвижение [From.GetOldAdjective] кажется совершенно непреодолимым, и идея, которой многие насмехались в последние годы - создание новой Римской империи - теперь кажется полностью в пределах досягаемости итальянцев. Большинство континентальных европейских держав, которые могли бы противостоять им, были практически уничтожены, оставив итальянцев свободными, чтобы навязать свою волю завоеванным народам. В дополнение к началу интеграции того, что они уже начали называть «завоеванными римскими территориями», итальянское правительство объявило о возрождении Римской империи, переименовав нацию в [From.GetNameDef]."
  afo_news.42.a:0 "Произведения бельгийских львов!"
  afo_news.42.b:0 "Посмотрим, как долго они будут длиться"

  afo_event.1.t:0 "Приветствую!"
  afo_event.1.d:0 "Этот мод частично перестраивает почти всю игровую механику. Большинство изменений легко понять, как и в дереве фокусов. Но если вы не знакомы с модом, вы можете найти несколько опций ниже, которые помогут прояснить некоторые из скрытых изменений в игре. \n\nОсновные изменения:\nИзменен рельеф и общий вид карты: убраны холмы под Москвой, леса на реке Дон и на Украине. Добавлена возможность снабжать по озеру Ленинград. Псков, Полтава, Новгород - теперь города (а не леса). Крупные города (Берлин, Париж, Москва, Киев и тд) разделены на болшее количество клеток. Добавлено больше воздушных и морских регионов."
  afo_event.1.a:0 "Изменения в экономике"
  afo_event.1.b:0 "Изменения в технологическом древе"
  afo_event.1.c:0 "Изменения в боевой механике"
  afo_event.1.e:0 "Я готов к игре"

  afo_event.2.t:0 "Изменения в экономике"
  afo_event.2.d:0 "Усталость экономики — это новая механика, она проецирует негативные эффекты на экономику страны и зависит от милитаризации и мобилизации экономики. Экономические, мобилизационные и торговые законы теперь увеличивают или снижают усталость экономики, что в свою очередь снижает скорость строительства и, в конечном итоге, стабильность и производительность фабрики. Экономические законы также теперь дают еженедельный штраф за поддержку войны, чтобы бороться с этим, есть решения и министерства пропаганды. \n\nЭкономическая усталость естественна при милитаризации вашей экономики, и это не должно быть чем-то, что вы должны пытаться сохранить при 0%. Ниже приведены основные способы снижения экономической усталости:\n\nФокусы\nВоенные облигации (доступны во время войны) \nРешения (большинство из них доступны только во время войны)\nСнижение законов (только в крайнем случае, если близко до 100% усталости)\n\nОставаясь на частичной мобилизации, ваша усталость увеличится с 0% до 100% за 24 года, военная экономика - за 12, а тотальная мобилизация - за 6. Имейте в виду, что фокусы также может увеличить или уменьшать усталость."
  afo_event.2.a:0 "Назад"
  afo_event.2.b:0 "Изменения в индустрии и строительстве"
  afo_event.2.c:0 "Изменение в политике"
  afo_event.2.e:0 "Я готов к игре"

  afo_event.3.t:0 "Изменения в технологическом древе"
  afo_event.3.d:0 "Технологии в технологическом древе артиллерии растянулись до 1945 (без добавления новых технологий). Добавлена 3 танковая средняя пушка. Также технологии артиллерии могут изучатся с опережением не больше 2-х лет, а технологии танков год в год.\nТехнологии станков в промышленности дают бонус в скорости роста эффективности производства. Бонусы даваемые технологиями на строку и на ресурсы снижены вдвое. Штраф на опережение в 2 раза сильнее по сравнению с ванилой."
  afo_event.3.a:0 "Назад"
  afo_event.3.b:0 "Я готов к игре"

  afo_event.4.t:0 "Изменения в боевой механике"
  afo_event.4.d:0 "Боевая ширина изменена на числа кратные 15 и 20 ( 120 - равнина, 90 - пустыня и холмы, 60 - лес и город, 40 - горы, джунгли и болота, 30 - лесные болота (новая местность), что делает идеальную дивизию боевой шириной 15 и 30. Погода стала суровее. Организация требует больше времени для восстановления и сильно зависит от погоды, а запас припасов у дивизий составляет 4 недели вместо 3 дней.\n\n Максимальное кол-во авианосцев без штрафа - 12 за бой. Думстаки сильно ослаблены, так что идеальный размер флота теперь составляет ~50 кораблей. Количество экранных кораблей, необходимых для каждого тяжёлого корабля теперь составляет 4 вместо 3.\n\nУвеличены статы ПТО, ПВО, артиллерии. Стоимость авиации увеличена в 2 раза. Первая наземная доктрина доступна только Германии, куда были добавлены бонусы на статы танков. Четвёртая доктрина немного изменена.\n\nПереработаны танки, статы всех модулей были изменены. За каждую прокачку брони дают по 2% к софте и харде танка. За каждую прокачку двигателя даётся 2% прорыва.\n\nУрон штурмов по войскам уменьшен почти в 2 раза. Урон по морским целям у тактов снижен в 2 раза.\n\nДобавлено большое количество доп. рот: легких, средних, тяжёлых истребителей танков и легких, средних САУ. Катюши можно добавлять в дивизии теперь только как доп роту. С 3 технологии сапёрной роты доступна доп. рота тяжёлых танков. Для США, ВБ и её доминионов добавлена доп рота средних танков (по фокусу у США)."
  afo_event.4.a:0 "Назад"
  afo_event.4.b:0 "Я готов к игре"

  afo_event.5.t:0 "Изменения в индустрии и строительстве"
  afo_event.5.d:0 "Производство военных и гражданских заводов сократилось вдвое ( было 4.75, стало 2 ) , но взамен вы получаете примерно вдвое больше заводов и фабрик. Для военно-морских верфей и военных заводов требуется уголь, а для гражданских заводов еще и 1 единица стали.\n\nВ дополнение к этому максимальное количество гражданских построек составляет 20 для каждого нового здания, а общее количество слотов под застройку в одном регионе - 50.\n\nТакже были добавлены новые ресурсы: бокситы, уголь и железо. Эти ресурсы сопровождаются 3 новыми зданиями.\n\nАлюминиевый завод использует бокситы и уголь для производства алюминия.\n\nАлюминиевый завод с гидроприводом использует бокситы для производства алюминия, но он дороже, чем алюминиевый завод.\n\nСталелитейный завод использует железо и уголь для производства стали.\n\nИнфраструктура также больше не увеличивает количество стали и алюминия, которые вы получаете от провинции, поскольку они производятся только на этих заводах.\n\n "
  afo_event.5.a:0 "Назад"
  afo_event.5.b:0 "Я готов к игре"

  afo_event.6.t:0 "Изменение в политике"
  afo_event.6.d:0 "Раздел «Министерства» был добавлен на вкладку «Политика».\n\nНовые дополнения включают:\nМинистерство культуры, которое сосредоточено на месте женщин в обществе. Он начинается с более ориентированных на дом ролей, которые дают вам более высокий прирост населения, но вы можете изменить его со значительной стоимостью или с помощью фокусов, чтобы обеспечить больше бонусов для вашей промышленности и армии. Например, более высокое рекрутируемое население и/или производительность фабрик.\n\nМинистерство обороны сосредоточено на военных облигациях. Вы используете их, чтобы уменьшить экономическую усталость. Однако к ним можно получить доступ только во время военных действий, и они предоставляются за счет ТНП в течение 2 лет после окончания войны.\n\nМинистерство пропаганды сосредоточено на увеличении поддержки войны. Поскольку законы экономики высокого уровня требуют еженедельной военной поддержки, это используется для противодействия этому. Каждый уровень обеспечивает 0,1% еженедельной военной поддержки и требует 0,05 политической власти в день.\n\nМинистерство труда сосредоточено на предоставлении различных баффов, таких как стабильность, объемы производства, рекруты и опыт. Для некоторых требуются проценты потребительских товаров, рекрутируемое население или полит власть.\n\nМинистерство бизнеса — это, по сути, ваша экономическая идеология, тесно связанная с вашей политической идеологией. Например, фашисты не могут использовать полную приватизизацию, а демократы не могут следовать идеям национал-социализма. Каждая экономическая идеология дает различные баффы и дебаффы, которые варьируются от увеличения/уменьшения стабильности, увеличения/уменьшения потребительских товаров, скорости строительства, времени исследования и так далее."
  afo_event.6.a:0 "Назад"
  afo_event.6.b:0 "Я готов к игре"

  ss_recruitment_event.1.t:0 "Создание 5.SS-Mot.-Division «Wiking»."
  ss_recruitment_event.1.desc:0 "5.SS-Mot.-Division «Wiking» был подразделением СС среди тридцати восьми дивизий Ваффен-СС нацистской Германии. Он был набран из иностранных добровольцев в Дании, Норвегии, Швеции, Финляндии, Эстонии, Нидерландах и Бельгии под командованием немецких офицеров. Во время Второй мировой войны дивизия служила на Восточном фронте. В мае он сдался американским войскам в Австрии."
  ss_recruitment_event.1.a:0 "Наша армия расширяется"
  ss_recruitment_event.1.b:0 "Набор только вспомогательных для ОКВ"
  GER_division_wiking_mot_tt:0 "Будет сформирована §Y5-я моторизованная дивизия СС «Викинг»§!."

  ss_recruitment_event.2.t:0 "Создание 6.SS-Gebirgs-Div."
  ss_recruitment_event.2.desc:0 "Горная дивизия СС «Норд» (6. SS-Gebirgs-Division «Норд») была немецким подразделением Ваффен-СС во время Второй мировой войны, сформированным в феврале 1941 как SS Kampfgruppe Nord (SS Battle Group North). Дивизия была единственным подразделением Ваффен-СС, которое воевало за Полярным кругом, когда она была размещена в Финляндии и на севере России в период с июня по ноябрь 1941. Воевал в Карелии до перемирия в сентябре 1944, после чего покинул Финляндию. Она участвовала в операции «Нордвинд» в январе 1945, где понесла большие потери. В начале апреля 1945 была уничтожена американскими войсками близ Бюдингена, Германия."
  ss_recruitment_event.2.a:0 "Наша армия расширяется"
  ss_recruitment_event.2.b:0 "Набор только вспомогательных для ОКВ"
  GER_division_nord_tt:0 "§Y6.SS-Gebirgs-Div. 'Nord'§! создан."

  ss_recruitment_event_22_b_tt:0 "§RВлияние СС возрастает5Точки./n Гнев СС уменьшается5очки.§!"

  ss_recruitment_event.27.t:0 "Обновление 2.SS-Verfügungstruppe-Division"
  ss_recruitment_event.27.desc:0 "В конце 1940 2.SS-Verfügungstruppe-Division был переоборудован в 2.SS-Mot.-Division «Das Reich»."
  ss_recruitment_event.27.a:0 "Наша армия расширяется"
  SS_DasReich_refit_1_tt:0 "§Y2. SS-Motorisierte-Division 'Das Reich' §! переоборудован."

  ss_recruitment_event.28.t:0 "Обновление 1.SS-Motorisierte Regt. \"ЛССАХ\""
  ss_recruitment_event.28.desc:0 "В середине 1941, после удивительных действий полка во время вторжения в Грецию, LSSAH получил право быть модернизированным в полную дивизию."
  ss_recruitment_event.28.a:0 "Наша армия расширяется"
  SS_LSSAH_refit_tt:0 "§Y1. SS-Motorisierte-Division 'LSSAH'§! переоборудован."

  ss_recruitment_event.29.t:0 "Создание 7.SS-Freiw.-Gebirgs-Div."
  ss_recruitment_event.29.desc:0 "В конце 1942 был создан 7.SS-Freiw.-Gebirgs-Div. «Prinz Eugen» с добровольцами и призывниками из Балканского и Volksdeutsche населения. Дивизия участвовала в антипартизанских операциях в районе."
  ss_recruitment_event.29.a:0 "Наша армия расширяется"
  SS_recruitment_prinz_eugen_tt:0 "§Y7.SS-Freiw.-Gebirgs-Div. 'Prinz Eugen'§! создан."

  ss_recruitment_event.30.t:0 "Создание 8.SS-Kavall.-Div. «Флориан Гейер»"
  ss_recruitment_event.30.desc:0 "В середине 1942 был создан 8.SS-Kavall.-Div. «Флориан Гейер» с немцами и Volksdeutschesoldiers. Дивизия участвовала в антипартизанских операциях в Советском Союзе."
  ss_recruitment_event.30.a:0 "Наша армия расширяется"
  SS_recruitment_florian_geyer_tt:0 "§Y8.SS-Kavall.-Div. 'Florian Geyer'§! создан."

  ss_recruitment_event.31.t:0 "Создание 9.SS-Panzergrenadier-Div."
  ss_recruitment_event.31.desc:0 "В декабре 1942, 9.SS-Panzergrenadier-Div. «Hohenstaufen» был создан с призывниками из Рейхской рабочей службы. Гогенштауфен принимал участие в рельефе немецких войск в Каменец-Подольском кармане, Нормандских боях, операции Рыночный сад, Арденнском наступлении и операции Весеннее пробуждение."
  ss_recruitment_event.31.a:0 "Наша армия расширяется"
  SS_recruitment_Hohenstaufen_tt:0 "§Y9.SS-Panzergrenadier-Div. 'Hohenstaufen'§! создан."

  ss_recruitment_event.32.t:0 "Создание 10.SS-Panzer-Division «Frundsberg»"
  ss_recruitment_event.32.desc:0 "В начале 1943, 10.SS-Panzergrenadier-Div. 'Frundsberg' был создан с призывниками из Рейхской рабочей службы, однако он не был завершен до начала 1944. Первые бои дивизия провела на Украине в апреле 1944. Затем подразделение было переброшено на запад, где оно сражалось с союзниками во Франции и в Арнеме. Дивизия была перемещена в Померанию, затем воевала к юго-востоку от Берлина в районе Лужицы до конца войны."
  ss_recruitment_event.32.a:0 "Наша армия расширяется"
  SS_recruitment_Frundsberg_tt:0 "Сформирована §Y10-я танковая дивизия СС «Фрундсберг»§!."

  ss_recruitment_event.33.t:0 "Создание 11.SS-Panzergrenadier-Div."
  ss_recruitment_event.33.desc:0 "В середине 1943 был создан 11.SS-Panzergrenadier-Div. «Нордленд» с добровольцами из Скандинавии и Венгрии, а также некоторыми призывниками. Он видел действия, как часть группы армий Север, в Независимом государстве Хорватия и на Восточном фронте во время Второй мировой войны."
  ss_recruitment_event.33.a:0 "Наша армия расширяется"
  SS_recruitment_Nordland_tt:0 "§Y11.SS-Panzergrenadier-Div. 'Nordland' §! создан."

  ss_recruitment_event.34.t:0 "Создание 12.SS-Panzer-Division «Гитлерюгенд»"
  ss_recruitment_event.34.desc:0 "В середине 1943 была создана 12.SS-Panzer-Division «Hitlerjugend» с добровольцами и призывниками из Гитлерюгенда, в то время как старшие офицеры и офицеры были из других дивизий Ваффен-СС. Дивизия совершила несколько военных преступлений по пути в Нормандию и во время ранних сражений в Нормандии, включая резню в Аскке и Арденнском аббатстве. Впервые он увидел действия на 7 в июне 1944 в рамках немецких оборонительных операций в Кане и понес большие потери во время битвы при Фалезском кармане. В декабре 1944 дивизия была совершена против армии США в Арденнском наступлении. После провала операции, получившей название Битва при Балге, дивизия была отправлена в Венгрию для участия в боях вокруг Будапешта. В конце концов дивизия отступила в Австрию и сдалась армии США 7th на 8 May 1945. После войны несколько членов дивизии, в том числе ее командир Курт Мейер, были осуждены за военные преступления."
  ss_recruitment_event.34.a:0 "Наша армия расширяется"
  SS_recruitment_Hitlerjugend_tt:0 "Сформирована §Y12-я танковая дивизия СС «Гитлерюгенд»§!."

  ss_recruitment_event.35.t:0 "Создание 13.SS-Waffen-Gebirgs-Div. \"Handschar\" (кроатише Nr. 1)."
  ss_recruitment_event.35.desc:0 "С марта по декабрь1944, The13.SS-Waffen-Gebirgs-Div. \"Handschar\" (kroatische Nr.1.) боролся против повстанческой кампании против возглавляемых коммунистами югославских партизанских сил сопротивления в Независимом государстве Хорватия, фашистском марионеточном государстве Германии, которое охватывало почти всю современную Хорватию, всю современную Боснию и Герцеговину, а также части Сербии. Он получил название Handschar после того, как местный боевой нож или меч носили османские полицейские в течение веков, когда регион был частью Османской империи. Это была первая негерманская дивизия Ваффен-СС, и ее формирование ознаменовало расширение Ваффен-СС в многонациональную военную силу. Состоящий из боснийских мусульман (этнических боснийцев) с некоторыми католическими хорватскими солдатами и главным образом немецкими и югославскими Volksdeutsche (этническими немецкими) офицерами и унтер-офицерами, он принял присягу на верность как Адольфу Гитлеру, так и хорватскому лидеру Анте Павеличу. Дивизия ненадолго сражалась в районе Сырмии к северу от реки Савы, прежде чем перейти в северо-восточную Боснию. После пересечения Саввы он установил обозначенную «зону безопасности» в северо-восточной Боснии между реками Сава, Босна, Дрина и Спреча. Он также несколько раз воевал за пределами зоны безопасности и заслужил репутацию жестокости и дикости не только во время боевых действий, но и в результате зверств, совершенных против сербских и еврейских гражданских лиц. В конце1944Часть дивизии была ненадолго переброшена в район Загреба, после чего негерманские члены начали в большом количестве дезертировать. В течение зимы1944-45Он был отправлен в регион Баранья, где он воевал против Красной Армии и болгар по всей южной Венгрии, отступая через ряд оборонительных линий, пока они не оказались внутри границы Рейха. Большинство оставшихся боснийских мусульман уехали в этот момент и попытались вернуться в Боснию. Остальные отступили дальше на запад, надеясь сдаться западным союзникам. Большинство оставшихся в живых стали военнопленными британской армии."
  ss_recruitment_event.35.a:0 "Наша армия расширяется"
  SS_recruitment_Handschar_tt:0 "Сформирована §Y13-я горнопехотная дивизия СС «Ханджар» (хорватская № 1)§!."

  ss_recruitment_event.36.t:0 "Создание 14. Waffen-Grenadier-Div. bei der SS (Galizische SS-Division Nr. 1)"
  ss_recruitment_event.36.desc:0 "14. Waffen-Grenadier-Div. bei der SS (Galizische SS-Division Nr. 1) - немецкое военное формирование Второй мировой войны, состоящее преимущественно из военных добровольцев с украинским этническим происхождением из области Галиции, позже также с некоторыми словаками и чехами. Сформированный в 1943, он был в значительной степени разрушен в битве при Броди, реформирован и видел действие в Словакии, Югославии и Австрии, прежде чем был переименован в первую дивизию украинской Национальной армии и сдался западным союзникам 10 May 1945."
  ss_recruitment_event.36.a:0 "Наша армия расширяется"
  SS_recruitment_14_tt:0 "§Y14. Создан Waffen-Grenadier-Div. bei der SS (galizische SS-Division Nr. 1)'§!."

  ss_recruitment_event.37.t:0 "Создание 15. Waffen-Grenadier-Div. bei der SS (lettische Nr. 1)"
  ss_recruitment_event.37.desc:0 "15. Waffen-Grenadier-Div. bei der SS (lettische Nr. 1) — пехотная дивизия Ваффен-СС во время Второй мировой войны. Он был сформирован в феврале 1943, и вместе со своим родственным подразделением, 19th Waffen Grenadier Division SS (2nd Latvian) сформировал латвийский легион."
  ss_recruitment_event.37.a:0 "Наша армия расширяется"
  SS_recruitment_15_tt:0 "§Y15. Создан Waffen-Grenadier-Div. bei der SS (lettische Nr. 1)'§!."

  ss_recruitment_event.38.t:0 "Создание 16.SS-Panzergrenadier-Div."
  ss_recruitment_event.38.desc:0 "Образован в ноябре 1943, когда в Штурмбригаду рейхсфюрера СС были добавлены новобранцы Фольксдойче, которые использовались в качестве кадров при формировании новой дивизии. Kampfgruppe («боевая группа») из дивизии сражалась на плацдарме Анцио, в то время как остальная часть дивизии приняла участие в оккупации Венгрии. Он сражался в Италии как дивизия с мая 1944, пока не был переведен в Венгрию в феврале 1945. В июне 27, 1944, командный пункт 16th SS-Panzergrenadiers в Сан-Винченцо, Италия был захвачен американским батальоном 1st, пехотой 133rd, пехотной дивизией 34th (Red Bulls). Командный пункт был квартирой в центре города, которая была захвачена; когда владельцы вернулись в свою квартиру, они обнаружили подписанный большой кожаный хендатлас. В конце лета 1944, часть этой дивизии, SS-Panzer-Aufklärungsabteilung 16 (разведывательный батальон 16), под командованием майора Вальтера Редера, была выведена из боя с американской армией 5th, а затем наступала на Готической линии, чтобы иметь дело с итальянским коммунистическим партизанским подразделением, Бригадой Красной Звезды (Brigata Stella Rossa). Действуя из горного комплекса, сосредоточенного на Монте-Соле, к юго-востоку от города Марзаботто, Красная Звезда была замечена как значительная угроза немецкому тылу, как с точки зрения сокращения связи, так и препятствия возможному пути отступления. Майор Редер выполнил свое задание и уничтожил эту партизанскую силу. Kampfgruppe учебно-заменительного батальона 16th базировался в Арнеме и принимал участие в операции Market Garden. Дивизия сдалась британским войскам под Клагенфуртом, Австрия, в конце войны."
  ss_recruitment_event.38.a:0 "Наша армия расширяется"
  SS_recruitment_Reichsfuhrer_SS_tt:0 "Будет сформирована §Y16-я моторизованная дивизия СС «Рейхсфюрер СС»§!."

  ss_recruitment_event.39.t:0 "Создание 17.SS-Panzergrenadier-Div. «Гетц фон Берлихинген»"
  ss_recruitment_event.39.desc:0 "Дивизия была поднята около Пуатье, Франция, как Panzer-Grenadier-Division 'Götz von Berlichingen' в октябре. Она была сформирована с нуля, причем большая часть ее первоначального персонала поступала из запасных частей и призывников, многие из которых были румынскими немцами и французскими добровольцами. Дивизия получила почетное звание Гётц фон Берлихинген. Оберштурмбанфюрер Отто Бинге руководил формированием дивизии, а недавно назначенный бригадефюрер Вернер Остендорф принял командование в январе 1944. Гётц фон Берлихинген был помещен под армейский корпус LXXX, часть Герда фон Рундштедта Heeresgruppe D. В рамках плана по нумерации всех названных дивизий СС в начале 1944 дивизия была переименована в 17th SS-Panzer-Grenadier-Division «Götz von Berlichingen». В феврале у 1944 все еще не было автомобилей. В том же году по приказу армейского корпуса LXXX дивизия начала закруглять французские машины в попытке завершить мобилизацию. К марту большинство крупных боевых формирований были полностью моторизованы, хотя два из шести пехотных батальонов всё ещё находились на велосипедах. На 1 в июне Götz von Berlichingen оказался в Туаре во Франции, без танков (хотя экипажи были полностью оснащены штурмовыми орудиями 42 Sturmgeschütz IV), всего за несколько месяцев обучения и ниже силы в офицерах и офицерах."
  ss_recruitment_event.39.a:0 "Наша армия расширяется"
  SS_recruitment_Berlichingen_tt:0 "§Y17.SS-Panzergrenadier-Div. 'Götz von Berlichingen'§! создан."

  ss_recruitment_event.40.t:0 "Создание 18.SS-Panzergrenadier-Div."
  ss_recruitment_event.40.desc:0 "18.SS-Freiwilligen Panzergrenadier-Division 'Horst Wessel' была сформирована в 1944 вокруг кадров из пехотной бригады 1st SS и включала в основном этнических немцев (Volksdeutsche) из Венгрии. Батальон 1st, состоящий из бойцов 1000, был прикреплен к дивизии СС Хорста Весселя и отправлен в Галицию. Он использовался для «задней охраны», пока не был отправлен на Восточный фронт, за исключением одного полка, который боролся со Словацким национальным восстанием в августе. Позже он воевал как единое целое в Венгрии, а затем в Чехословакии, где был разрушен. Дивизия была названа в честь члена СА Хорста Весселя, известного как автор текста гимна нацистской партии Хорст-Вессель-Лид и прославленного нацистским режимом как мученик ранних лет партии."
  ss_recruitment_event.40.a:0 "Наша армия расширяется"
  SS_recruitment_Wessel_tt:0 "§Y18.SS-Panzergrenadier-Div. 'Horst Wessel'§! создан."

  ss_recruitment_event.41.t:0 "Создание 19. Waffen-Grenadier-Div. bei der SS (lettische Nr. 2)"
  ss_recruitment_event.41.desc:0 "19. Waffen-Grenadier-Div. bei der SS (lettische Nr. 2) — пехотная дивизия Ваффен-СС во время Второй мировой войны. Это была вторая латвийская дивизия, сформированная в январе 1944, после ее сестринского подразделения, 15th Waffen Grenadier Division SS (1st Latvian), с которым она сформировала латвийский легион. В конце войны он был окружен в Курляндском кармане, где сдался Красной Армии."
  ss_recruitment_event.41.a:0 "Наша армия расширяется"
  SS_recruitment_19_tt:0 "§Y19. Создан Waffen-Grenadier-Div. bei der SS (lettische Nr. 2)'§!."

  ss_recruitment_event.42.t:0 "Создание 20. Waffen-Grenadier-Div. der SS (estnische Nr. 1)"
  ss_recruitment_event.42.desc:0 "20. Waffen-Grenadier-Div. der SS (estnische Nr. 1) была иностранной пехотной дивизией Ваффен-СС, вооруженного отделения немецкой нацистской партии, которая служила вместе, но никогда формально не была частью вермахта во время Второй мировой войны. Согласно некоторым источникам, дивизия находилась под общим командованием рейхсфюрера СС Генриха Гиммлера, но не была неотъемлемой частью Schutzstaffel (SS). Он был официально активирован на 24 в январе 1944, и многие из его солдат были членами эстонского легиона и / или эстонской добровольческой бригады 3rd, которая сражалась в составе немецких войск с августа 1942 и октября 1943 соответственно. Оба предшествующих формирования вывели свой личный состав из оккупированной немцами Эстонии. Вскоре после его официальной активации немецкие оккупационные власти объявили о широком призыве в Эстонию. Дивизия была сформирована в Эстонии в составе эстонской добровольческой бригады СС 3rd и первоначально была известна как эстонская добровольческая дивизия СС 20th."
  ss_recruitment_event.42.a:0 "Наша армия расширяется"
  SS_recruitment_20_tt:0 "§Y20. Создан Waffen-Grenadier-Div. der SS (estnische Nr. 1)'§!."

  ss_recruitment_event.43.t:0 "Обновление моторизованных дивизий"
  ss_recruitment_event.43.desc:0 "В середине 1942 «LSSAH», «Das Reich», «Totenkopf», «Polizei» и «Wiking» были переоборудованы, от моторизованных и пехотных дивизий до механизированных. Однако, в отличие от их эквивалента Хира, механизированные дивизии СС имели полный танковый полк, что делало их эквивалентными танковым дивизиям."
  ss_recruitment_event.43.a:0 "Наша армия расширяется"
  SS_motorized_and_inf_to_mechanized_refit_1_tt:0 "§YДивизии «LSSAH», «Das Reich», «Totenkopf», «Polizei» и «Wiking» переоснащены.§!"


  ss_recruitment_event.44.t:0 "Переоборудование механизированных подразделений"
  ss_recruitment_event.44.desc:0 "В конце 1943 были переоборудованы дивизии «LSSAH», «Das Reich», «Totenkopf», «Wiking» и «Hohenstaufen», от механизированных до бронированных."
  ss_recruitment_event.44.a:0 "Наша армия расширяется"
  SS_mechanized_to_panzer_refit_1_tt:0 "§YДивизии «LSSAH», «Das Reich», «Totenkopf», «Wiking» и «Hohenstaufen» переоснащены.§!"

  ss_recruitment_event.45.t:0 "Соглашение Гиммлера-Шпеера"
  ss_recruitment_event.45.desc:0 "В 1942 году, после назначения Альберта Шпеера, Гиммлер предложил, чтобы от 5% до 8% военного производства Германии было перенаправлено Ваффен-СС в обмен на лояльных рабочих СС для промышленности Германии. Вы можете либо решить отдать 0%, 5% или 10% вашего заводского производства SS. В зависимости от вашего выбора будущие дивизии СС будут появляться с соответственно 0%, 40% или 80% бесплатного снаряжения. Однако, чем больше вы отдадите СС, тем меньше это оценит ОКВ."
  ss_recruitment_event.45.a:0 "Отказать что-либо давать СС!"
  ss_recruitment_event.45.b:0 "Согласится отдать 8% производства СС"
  ss_recruitment_event.45.c:0 "Согласится отдать 16% производства СС"

  ss_recruitment_event.46.t:0 "Создание 21.SS-Waffen-Gebirgs-Div. der SS 'Skanderberg' (albanische Nr. 1)"
  ss_recruitment_event.46.desc:0 "Ваффенская горная дивизия СС Скандербег (1st албанский) была немецкой горной пехотной дивизией Ваффен-СС, вооруженного крыла немецкой нацистской партии, которая служила вместе, но никогда формально не была частью Вермахта во время Второй мировой войны. Дивизия была разработана вокруг ядра этнического албанского батальона, который ненадолго столкнулся с югославскими партизанами в восточной Боснии в составе 13th Waffen Mountain Division SS Handschar (1st Croatian). Состоящий из албанцев с главным образом немецкими и югославскими Volksdeutsche (этническими немецкими) офицерами и унтер-офицерами, ему дали название Скандербег после средневекового албанского лорда Джорджа Кастриоти Скандербега, который защищал область Албании против Османской империи в течение более чем двух десятилетий в 15th веке."
  ss_recruitment_event.46.a:0 "Будет сформирована §Y21-я горнопехотная дивизия СС «Скандербег» (албанская № 1)§!."

  ss_recruitment_event.47.t:0 "Создание 22.SS-Freiw.-Kavall.-Div."
  ss_recruitment_event.47.desc:0 "Добровольческая кавалерийская дивизия СС 22nd (немецкий, 22. SS-Freiwilligen Kavallerie-Division) была немецкой кавалерийской дивизией Ваффен-СС, которая действовала на Восточном фронте во время Второй мировой войны. Дивизия состояла в основном из венгерской армии Volksdeutsche призывников, которые были переданы в Ваффен-СС после соглашения между Германией и Венгрией. Подразделение широко известно под именем Марии Терезии в публикациях, хотя никаких документов, подтверждающих это название, обнаружено не было."
  ss_recruitment_event.47.a:0 "§Y22.SS-Freiw.-Kavall.-Div. 'Maria Theresia' §! создана."

  ss_recruitment_event.48.t:0 "Создание 24. Waffen-Gebirgs-Div. 'Karstjäger' / KAMA"
  ss_recruitment_event.48.desc:0 "Ваффенская горная дивизия СС «Карстягер» была немецкой горнопехотной дивизией Ваффен-СС, вооруженным крылом немецкой нацистской партии, которое служило вместе, но никогда формально не было частью Вермахта во время Второй мировой войны. Названный Karstjäger («Охотник на Карста»), он был одним из подразделений 38, развернутых Waffen-SS. Сформированный на 18 в июле 1944 из добровольческого батальона СС «Карствер», его номинальная численность была не более чем теоретической, и дивизия вскоре была сокращена до бригады СС «Ваффен-Маунтин». На протяжении своего существования в качестве батальона, дивизии и бригады он в основном участвовал в борьбе с партизанами на Карстовом плато на границах Югославии, Италии и Австрии; горная местность требовала специализированных горных войск и снаряжения. Основанная в 1942 как компания, подразделение состояло в основном из Volksdeutsche (этнические немцы / австрийцы) из Югославии и Южной Тирольской провинции Италии. Несмотря на то, что он был сосредоточен на антипартизанских операциях, он также видел действия после капитуляции Италии, когда он двинулся, чтобы разоружить итальянские войска в Тарвисио и защитить этнические немецкие общины в Италии. Кроме того, в конце войны он успешно боролся, чтобы держать проходы в Австрию открытыми, позволяя немецким подразделениям бежать с Балкан и сдаться британским силам. Остатки подразделения стали одними из последних немцев, сложивших оружие, когда они сдались британской танковой дивизии 6th на 9 May 1945. Совместное итало-германское исследование включало разделение в 23 отдельных военных преступлений, связанных с убийством в общей сложности людей 277 между итальянской капитуляцией и концом войны."
  ss_recruitment_event.48.a:0 "§Y24. Создан Waffen-Gebirgs-Div. 'Karstjäger' / KAMA§!."

  ss_recruitment_event.49.t:0 "Создание 25. Waffen-Grenadier-Div. der SS 'Hunyadi'"
  ss_recruitment_event.49.desc:0 "25th Waffen Grenadier Division SS «Hunyadi» (1st Hungarian) была недолговечной пехотной дивизией Waffen-SS, вооруженного отделения немецкой нацистской партии, которая служила вместе, но никогда формально не была частью вермахта во время Второй мировой войны. Основанная в ноябре 1944 после свержения Германией венгерского режима Миклоша Хорти, она состояла в основном из войск, взятых из дивизии Королевской венгерской армии 13th Honvéd. Она никогда не была должным образом сформирована, обучена или оснащена, и после эвакуации из учебного лагеря перед лицом наступающей советской Красной армии, она сдалась армии Соединенных Штатов в Австрии в мае."
  ss_recruitment_event.49.a:0 "§Y25. Создан Waffen-Grenadier-Div. der SS 'Hunyadi'§!."

  ss_recruitment_event.50.t:0 "Создание 26. Waffen-Grenadier-Div. der SS 'Hungaria' (ungarische Nr. 2)"
  ss_recruitment_event.50.desc:0 "26th Waffen Grenadier Division of the SS (2nd Hungarian) (немецкий, 26). Waffen-Grenadier-Division der SS (ungarische Nr.2), венгерский, 26. Waffen-SS Gránátos Hadosztály (2. magyar)), была недолговечной пехотной дивизией Waffen-SS, вооруженного отделения немецкой нацистской партии, которая служила вместе, но никогда формально не была частью вермахта во время Второй мировой войны. Основанная в ноябре 1944 после свержения Германией венгерского режима Миклоша Хорти, она никогда не была должным образом сформирована, обучена или оснащена, и после эвакуации из своего тренировочного лагеря перед лицом наступающей советской Красной армии, она сдалась армии Соединенных Штатов в Австрии в мае 1945."
  ss_recruitment_event.50.a:0 "§Y26. Создан Waffen-Grenadier-Div. der SS 'Hungaria' (ungarische Nr. 2)§!."

  ss_recruitment_event.51.t:0 "Создание бригады «Ваффен-Штурм» СС «Рона»"
  ss_recruitment_event.51.desc:0 "29th Waffen Grenadier Division of the SS «RONA» (1st Russian) (также известная как Waffen-Sturm-Brigade der SS RONA, и Kaminski Brigade) была коллаборационистским формированием, составленным из советских граждан с территории автономии Локот в занятых Осью областях РСФСР в Советском Союзе во время немецко-советской войны 1941-45. К августу 27, 1944, обнаружив бригаду слишком недисциплинированной и ненадежной, немецкие командиры вывели ее из Варшавы. Подразделение было отправлено в Словакию и развернуто против словацких партизан. После окончания октября 1944 бригада была расформирована, а оставшийся личный состав поглощён Российской освободительной армией генерала Андрея Власова."
  ss_recruitment_event.51.a:0 "Создан §YWaffen-Sturm-Brigade der SS 'RONA'§!."

  ss_recruitment_event.52.t:0 "Создание 29. Waffen-Grenadier-Div. der SS 'Italienische Nr. 1'"
  ss_recruitment_event.52.desc:0 "29th Waffen Grenadier Division of the SS (1st Italiana) также Legione SS Italiana (немецкий, 29). Waffen-Grenadier-Division der SS (italienische Nr. 1) — формирование СС нацистской Германии во время Второй мировой войны. Первоначально он был создан в марионеточной Итальянской социальной республике в 1943 как итальянский легион, позже переименованный в бригаду. Подразделение было обновлено до статуса подразделения на 10 Февраль 1945."
  ss_recruitment_event.52.a:0 "§Y29. Создан Waffen-Grenadier-Div. der SS 'Italienische Nr. 1'§!."

  ss_recruitment_event.53.t:0 "30-я гренадерская дивизия войск СС (русская № 2)"
  ss_recruitment_event.53.desc:0 "The30Гренадерская дивизия СС (немецкий,30. Waffen-Grenadierdivision der SS (weißruthenische Nr.1)[1]Это была недолговечная немецкая пехотная дивизия Ваффен СС, сформированная в основном из белорусского, российского и украинского личного состава бригады «Шутцманшафт» в августе.1944Варшава в Генеральном правительстве.[2]Дивизия была переброшена на юго-восток Франции к середине августа.1944Французские силы внутренних дел (FFI). Выступление дивизии в бою было плохим, и два батальона взбунтовались, убили своих немецких лидеров и перешли в FFI. Другие войска дивизии пересекли швейцарскую границу и были интернированы. Впоследствии часть личного состава дивизии была переведена в Российскую Освободительную Армию, а другие были сохранены для формирования пехотной бригады СС «Белая Русина» с января.1945."
  ss_recruitment_event.53.a:0 "30.Waffen-Grenadier-Div. der SS 'Russische Nr. 2'§! создана."

  ss_recruitment_event.54.t:0 "31.SS-Freiwilligen-Grenadier-Division «Батька»"
  ss_recruitment_event.54.desc:0 "Волонтерская гренадерская дивизия СС 31st (немецкий, 31. SS-Freiwilligen-Grenadier-Division) была подразделением немецких вооруженных сил во время Второй мировой войны. Он был сформирован из венгерского Volksdeutsche (этнические немцы), в основном из Бачки в сентябре 1944. К ноябрю 1944 действовал на Венгерском фронте. В январе 1945 была отправлена в Австрию и преобразована в дивизию 45 с двумя батальонами в каждом полку и только тремя взводами в каждой роте. Затем дивизия присоединилась к армии 17th в Силезии, где она была окружена Красной Армией; она сдалась около Градец Кралове в мае 1945."
  ss_recruitment_event.54.a:0 "Создан 31.SS-Freiwilligen-Grenadier-Division «Batschka» §!."

  ss_recruitment_event.55.t:0 "Моторизированная дивизия 'Великая Германия'"
  ss_recruitment_event.55.desc:0 "Дивизия 'Великая Германия' - тактическое соединение сухопутных войск нацистской Германии. Принимала участие во Второй мировой войне. Созданное на базе караульного батальона, за период своего существования было развёрнуто в танковый корпус. Наряду с некоторыми соединениями вермахта и войск СС, 'Великая Германия' была одной из наиболее боеспособных военных сил нацистской Германии."
  ss_recruitment_event.55.a:0 "Моторизированная дивизия 'Великая Германия'§! сформирована."

  ss_recruitment_event.56.t:0 "Танковая дивизия люфтваффе «Герман Геринг»"
  ss_recruitment_event.56.desc:0 "Дивизия люфтваффе «Герман Геринг» - элитное тактическое соединение военно-воздушных сил нацистской Германии, лично подчинялось рейхсмаршалу Герману Герингу. Созданное на базе полицейского батальона, за период своего существования было развёрнуто в парашютно-танковый корпус. Наряду с рядом отборных формирований войск СС и вермахта, дивизия (впоследствии — корпус) «Герман Геринг» была одним из наиболее боеспособных соединений в вооружённых силах нацистской Германии."
  ss_recruitment_event.56.a:0 "Танковая дивизия люфтваффе «Герман Геринг»§! сформирована."

  ss_recruitment_event.57.t:0 "Зондеркоманда СС под командованием Дирлевангера"
  ss_recruitment_event.57.desc:0 "Зондеркоманда СС под командованием Дирлевангера — карательное подразделение СС под командованием Оскара Дирлевангера, комплектовалось из заключённых немецких тюрем, концлагерей и военных тюрем СС. Особый статус подразделения отмечался в том, что с января 1943 года по распоряжению Генриха Гиммлера на петлицах вместо рун СС её члены носили изображение скрещённых винтовок и гранаты."
  ss_recruitment_event.57.a:0 "Зондеркоманда СС под командованием Дирлевангера§! сформирована."

